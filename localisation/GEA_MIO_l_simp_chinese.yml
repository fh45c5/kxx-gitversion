 # GEA-specific names and descriptions for imported German MIOs
 GEA_henschel_organisation: "亨舍尔"
 GEA_henschel_desc: "§g亨舍尔父子公司由格奥尔格·亨舍尔与其子约翰·维尔纳于1810年在卡塞尔创立，最初生产火炮，1816年后转向蒸汽机。卡尔·安东·亨舍尔于1835年接掌公司，并在1848年推出首台“龙”号蒸汽机车；到1894年，公司已生产四千余台机车。进入二十世纪后，亨舍尔成为德国最大的机车制造商之一，在世界大战期间既生产军用机车，也制造早期坦克。战后，公司继续同博尔西格和哈诺玛格争夺欧洲铁路车辆市场，并凭借机车与机动装甲车辆维系着中欧经济的钢铁血脉。§!"
 GEA_henschel_mio_desc: "$generic_mio_initial_trait_fast_tanks_designer$\n§L$GEA_henschel_desc$§!\n"
 GEA_adler_organisation: "阿德勒"
 GEA_adler_desc: "§g阿德勒厂由海因里希·克莱尔于1880年在法兰克福创立，最初制造自行车，随后扩展到打字机、缝纫机和汽车。埃德蒙·隆普勒于1902年出任技术总监，公司由此开始生产发动机，并在世界大战后推出新的“标准”系列汽车。黄金二十年代，中产阶级对“标准6型”的需求使其迅速繁荣，但随后竞争加剧，公司逐渐落后于三大主要对手。尽管如此，阿德勒仍是德国第二受欢迎的汽车品牌，也愿意在需要时为军队生产坦克和军用车辆。§!"
 GEA_adler_mio_desc: "$generic_mio_initial_trait_heavy_tank_designer$\n§L$GEA_adler_desc$§!\n"
 GEA_krupp_tank_organisation: "克虏伯"
 GEA_krupp3_desc: "§g格鲁松厂由赫尔曼·格鲁松于1855年在马格德堡附近的布考创立，最初从事炼铁和机器零件制造，随后开始为普鲁士军队生产装甲炮塔，并在统一战争中因供应军火而获利。格鲁松去世后公司经营不振，1893年被克虏伯强行收购，改名为克虏伯-格鲁松厂，负责为克虏伯体系生产装甲板和舰炮塔。世界大战期间，它为陆军提供武器，并为日耳曼尼亚造船厂建造的舰艇供应装备。长期和平并未使其衰落；一旦战争重临，它仍准备生产支援步兵作战的装甲车辆。§!"
 GEA_krupp3_mio_desc: "$generic_mio_initial_trait_infantry_tanks_designer$\n§L$GEA_krupp3_desc$§!\n"
 GEA_benz_organisation: "奔驰公司"
 GEA_benz_desc: "§g奔驰莱茵燃气发动机厂由弗里德里希·埃斯林格、马克斯·罗斯和卡尔·本茨于1883年在曼海姆创立。卡尔·本茨于1885年造出第一辆能够实际运行的汽车，并凭借奔驰专利汽车的声望将公司发展为十九世纪九十年代世界最大的汽车制造商之一。此后，公司同戴姆勒汽车公司展开长期竞争，并先后推出闪电奔驰、奔驰水滴车、奔驰赛车大师和10/35 PS等车型；世界大战期间还生产Bz III航空发动机和军用卡车。如今奔驰已迁往柏林，在豪华车市场同戴姆勒争夺首位，同时也努力追赶欧宝的大众化生产，并能够为军队提供可靠的坦克。§!"
 GEA_benz_mio_desc: "$generic_mio_initial_trait_general_tank_designer$\n§L$GEA_benz_desc$§!\n"
 GEA_daimler_organisation: "戴姆勒"
 GEA_daimler_desc: "§g戴姆勒汽车公司由戈特利布·戴姆勒和威廉·迈巴赫于1890年在坎施塔特创立，目标是制造高速发动机，并于1897年推出首款“凤凰”汽车。迈巴赫设计的梅赛德斯35 PS于1900年在法国蔚蓝海岸的比赛中击败竞争者；1903年坎施塔特火灾后，公司迁往下图尔克海姆并继续扩张。世界大战期间，辛德尔芬根工厂生产装甲车和飞机；战后总部迁往柏林，以梅赛德斯豪华车和赛车闻名。公司虽然在高端市场同奔驰激烈竞争、在大众市场又落后于欧宝和阿德勒，但战争将为其高品质坦克和装甲车辆带来新的机会。§!"
 GEA_daimler_mio_desc: "$generic_mio_initial_trait_medium_tank_designer$\n§L$GEA_daimler_desc$§!\n"
 GEA_kaiserliche_werft_wilhelmshaven_organisation: "威廉港造船厂"
 GEA_kaiserliche_werft_wilhelmshaven_desc: "§g威廉港皇家造船厂的源头可追溯至1853年的玉石湾条约，普鲁士从奥尔登堡取得玉石湾沿岸土地，并于1869年建立威廉港。1871年成立的威廉港造船厂是三大皇家造船厂之一，专门为不断扩张的帝国海军建造大型军舰。无畏舰竞赛期间，提尔皮茨主持扩建三座新船坞和深水港，拿骚号战列舰、兴登堡号大巡洋舰等著名舰艇均出自这里。世界大战时，它既是造船和维修中心，也是公海舰队的重要基地，雇员超过两万一千人。战后短暂低迷之后，帝国扩张使其重新繁荣；面对英国与日本，它仍将承担研发下一代主力舰的重任。§!"
 GEA_kaiserliche_werft_wilhelmshaven_mio_desc: "$generic_mio_initial_trait_battle_line_ship_builders$\n§L$GEA_kaiserliche_werft_wilhelmshaven_desc$§!\n"
 GEA_germaniawerft_organisation: "日耳曼尼亚造船厂"
 GEA_germaniawerft_desc: "§g弗里德里希·克虏伯日耳曼尼亚造船厂的前身是1863年在基尔加尔登建立的布鲁恩船厂，1867年改为北德意志船厂，由格奥尔格·豪瓦尔特领导的北德航运公司经营。该厂在1879年前建造约八十三艘船，却因管理不善破产，随后几经转手，于1902年被克虏伯收购并改为现名。克虏伯将其建设为德国最重要的造船厂之一，战前建造了皇储号、摄政王路易特波尔德号、波森号等战列舰，以及瞪羚号、宁芙号和亚马逊号等轻巡洋舰。世界大战期间，该厂尤其专注于潜艇，到1919年约生产一百艘。战后它继续建造主力舰和皇家游艇，并在邓尼茨海军上将推动下越来越重视VII型潜艇。§!"
 GEA_germaniawerft_mio_desc: "$GEA_mio_initial_trait_refurbishment_repair_dockyard$\n§L$GEA_germaniawerft_desc$§!\n"
 GEA_blohm_voss_organisation: "布洛姆&福斯"
 GEA_blohm_voss_desc: "§g布洛姆与福斯由赫尔曼·布洛姆和恩斯特·福斯于1877年在汉堡创立，最初建造货船和铁壳蒸汽船。1887年建成首座浮船坞后，公司在汉堡参议院支持下大规模扩张，并于1899年建造第一艘帝国军舰“查理大帝”号。此后其第五船坞发展为世界最大的浮动船坞，公司也成为帝国海军战列巡洋舰的主要供应商。世界大战期间，汉堡船厂又成为德国最大的潜艇生产基地，并协助奥斯曼帝国改造金角湾设施。战后，公司同腓特烈港飞机制造公司密切合作生产海军飞机，同时继续发展高速潜艇。§!"
 GEA_blohm_voss_mio_desc: "$generic_mio_initial_trait_raiding_fleet$\n§L$GEA_blohm_voss_desc$§!\n"
 GEA_schichau_werke_organisation: "硕效造船厂"
 GEA_schichau_werke_desc: "§g硕效厂由费迪南德·硕效于1837年在埃尔宾创立，最初制造机器和发动机，1859年进入机车行业，并成为德国铁路的重要供应商。为向帝国海军提供舰艇，公司于1877年在埃尔宾建立船厂，专门生产鱼雷艇和驱逐舰，到1918年共建造四百八十三艘，其中大部分售予俄罗斯帝国。由于埃尔宾设施无法建造大型舰艇，硕效又于1890年在但泽兴建更大船厂。费迪南德去世后，其女婿海因里希·齐泽接手，公司先后建造西里西亚号战列舰和科尔贝格号巡洋舰。战后虽经历过管理问题，它仍借助为北德意志劳埃德建造民船维持发展，并继续支撑德国东部经济和帝国海军。§!"
 GEA_schichau_werke_mio_desc: "$generic_mio_initial_trait_submarine_designer$\n§L$GEA_schichau_werke_desc$§!\n"
 GEA_weser_organisation: "威悉造船厂"
 GEA_weser_desc: "§g威悉股份公司的前身是1843年创立的瓦尔特延与莱昂哈特铸铁及机器厂。卡斯滕·瓦尔特延领导公司转向造船，1847年下水首艘明轮船；海因里希·莱昂哈特离开后，公司改名为瓦尔特延公司，并于1872年成为威悉股份公司。由不来梅商人组成的董事会使其能够建造各种舰艇，包括帝国海军军舰；战前尤其擅长炮舰、护航舰和近岸舰艇。世界大战爆发后，公司转向潜艇生产，战争结束前约建造九十艘。战后它继续翻修船坞，并发展鲍尔-瓦赫废气涡轮机和坚固的迈尔船型，至今仍是德国造船业的重要创新者。§!"
 GEA_weser_mio_desc: "$generic_mio_initial_trait_escort_fleet$\n§L$GEA_weser_desc$§!\n"
 GEA_kaiserliche_werft_kiel_organisation: "基尔船厂"
 GEA_kaiserliche_werft_kiel_desc: "§g基尔皇家造船厂成立于1867年，是三大皇家造船厂中历史最悠久的一座，最初名为基尔王家造船厂，德国统一后改为现名。历任海军军官不断扩建设施；1895年基尔运河完工后，船厂吞并旧埃勒贝克村并迅速扩张，甚至迫使克虏伯日耳曼尼亚造船厂让出土地。世界大战前，它建造了布吕歇尔号、罗恩号等装甲巡洋舰以及皇帝号战列舰。大战期间，船厂对维持主力舰队至关重要。战后它一面建造现代主力舰和改造旧式无畏舰，一面参与多尼尔、腓特烈港水上飞机以及德国首艘航空母舰齐柏林伯爵号等新项目。§!"
 GEA_kaiserliche_werft_kiel_mio_desc: "$generic_mio_initial_trait_task_force_ship_builders$\n§L$GEA_kaiserliche_werft_kiel_desc$§!\n"
 GEA_focke_wulf_organisation: "福克-沃尔夫"
 GEA_focke_wulf_desc: "§g海因里希·福克和格奥尔格·沃尔夫于1912年开始合作研制试验发动机和新式飞机。世界大战打断学业并使二人进入空军服役后，他们于1921年制造A 7“鹳”式飞机，并在不来梅商人支持下于1924年成立福克-沃尔夫飞机制造股份公司。同年，公司为德意志航空运输公司生产A 16民航机，也为空军制造战斗机和侦察机。二十年代末，公司已开发近二十种多用途型号，虽经历沃尔夫1927年坠机险情和信贷危机中的投资损失，仍保持上升势头。其轰炸机、战斗机、侦察机乃至试验直升机都可能服务于未来战争。§!"
 GEA_focke_wulf_mio_desc: "$generic_mio_initial_trait_range_focused_aircraft_designer$\n§L$GEA_focke_wulf_desc$§!\n"
 GEA_bfw_organisation: "巴伐利亚飞机制造厂"
 GEA_bfw_desc: "§g巴伐利亚飞机制造股份公司的前身是古斯塔夫·奥托于1910年创立的奥托飞行机器厂。公司因管理不善在1916年陷入财务危机，随后由多家银行和曼恩公司重组为巴伐利亚飞机制造厂，由前信天翁公司职员彼得·埃伯魏因主持并获准生产信天翁D.III等型号。战后，公司开始推出BFW M17和“火烈鸟”等自主机型，却在二十年代继续受财务问题和隆普勒、信天翁等竞争者压制。1926年，在包括威利·梅塞施密特在内的新董事会领导下，公司再次重组，建设拉默斯多夫工厂并兼并AGO等企业。BFW 109的成功使其成为巴伐利亚最大的飞机制造商之一，但仍需挑战德国航空工业传统“四巨头”。§!"
 GEA_bfw_mio_desc: "$generic_mio_initial_trait_light_aircraft_designer$\n§L$GEA_bfw_desc$§!\n"
 GEA_siemens_schuckert_organisation: "西门子-舒克特"
 GEA_siemens_schuckert_desc: "§g西门子-舒克特厂于1903年由西门子与哈尔斯克收购舒克特公司后成立，在阿尔弗雷德·贝利纳领导下生产电子设备、列车和汽车。1914年世界大战爆发后，格奥尔格·威廉·冯·西门子决定进军军用航空，先任命维勒哈德·福斯曼设计仿照伊里亚·穆罗梅茨的大型轰炸机，失败后又于1915年改用斯特芬兄弟。他们设计的R.I、R.II、R.III轰炸机和著名D.IV战斗机成为战争中的重要装备。战后，卡尔·弗里德里希·冯·西门子继续扩张，为民航公司供应飞机，并研制D.10等高爬升战斗机和更多G系列轰炸机。公司因此跻身德国航空业巨头之列，也深受曼弗雷德·冯·里希特霍芬青睐。§!"
 GEA_siemens_schuckert_mio_desc: "$generic_mio_initial_trait_multi_role_aircraft_designer$\n§L$GEA_siemens_schuckert_desc$§!\n"
 GEA_junkers_organisation: "容克斯"
 GEA_junkers_desc: "§g容克斯飞机厂源自胡戈·容克斯于1895年创立、生产工业锅炉的容克斯公司。世界大战期间，他转向航空制造，并于1917年推出世界首架全金属飞机容克斯J 4。空军和最高陆军指挥部看中这一技术，于1918年迫使容克斯同福克合并，但双方因全金属设计与量产方式的分歧在1919年底分道扬镳。此后容克斯成立航空运输公司，以F 13和新式柴油发动机经营中欧民航，同时向空军提供Ju 87、Ju 88等军机。如今其工厂遍布马格德堡、德绍和普鲁士腹地；胡戈·容克斯于1935年去世后留下权力真空，公司还需面对哥达、西门子-舒克特和信天翁等对手。§!"
 GEA_junkers_mio_desc: "$generic_mio_initial_trait_cas_aircraft_designer$\n§L$GEA_junkers_desc$§!\n"
 GEA_dornier_organisation: "多尼尔"
 GEA_dornier_desc: "§g克劳德·多尼尔于1910年以齐柏林伯爵麾下工程师的身份开始航空事业，负责飞艇设计，并在世界大战期间主持腓特烈港办事处，进而建立齐柏林林道工厂这一独立子公司。公司凭多尼尔RS IV和“海豚”等水上飞机成名，1922年成为齐柏林集团伙伴并改称多尼尔金属制造公司。此后它大力投资“彗星”II和Do N等高速全金属飞机，并在吕贝克和柏林建立新厂。如今公司大量承接民航订单，为劳埃德航空服务公司和德意志航空运输公司提供飞机。克劳德·多尼尔已成为成功企业家，其Do 19等机型也能够承担未来的远程轰炸任务。§!"
 GEA_dornier_mio_desc: "$GEA_mio_initial_trait_medium_aircraft_designer$\n§L$GEA_dornier_desc$§!\n"
 GEA_gothaer_waggonfabrik_organisation: "哥达汽车厂"
 GEA_gothaer_waggonfabrik_desc: "§g哥达车辆厂源自1883年创立、制造旋转木马和行李车的弗里茨·博特曼公司，后来改组为股份公司。原业主博特曼和路易斯·格吕克退出后，新董事会于1910年将其更名为哥达车辆厂。阿尔贝特·坎特在萨克森-科堡-哥达公爵卡尔·爱德华支持下带领公司进入航空领域，兴建飞艇港、先进飞行学校和大型军用机场。世界大战期间，哥达厂开创了德国早期飞机生产，制造双翼机和破坏力强大的哥达G系列轰炸机。战后，公司在菲尔特、拜罗伊特和维斯马继续扩张，成为德国最强大的飞机制造商之一，其轰炸机和高速战斗机都深受空军欢迎。§!"
 GEA_gothaer_waggonfabrik_mio_desc: "$generic_mio_initial_trait_heavy_aircraft_designer$\n§L$GEA_gothaer_waggonfabrik_desc$§!\n"
 GEA_friedrichshafen_organisation: "腓特烈港飞机结构公司"
 GEA_friedrichshafen_desc: "§g腓特烈港飞机制造公司由齐柏林设计师兼飞行员特奥多尔·科伯于1912年在博登湖畔创立。1916年，他得到齐柏林伯爵的大笔投资，接管曼采尔机库和瓦尔讷明德船厂，开始制造水上飞机和轰炸机。战争期间，FF 29和FF 49等机型同帝国海军密切配合，在波罗的海和北海执行巡逻。战后，公司在科伯领导下继续成长，并在技术总监卡尔·格伦主持下研制FF 80等新机，服务于德国维持南洋海域秩序的行动。公司还生产FF 77等轰炸机并购买哥达厂许可证，如今是受帝国海军尊重的中型企业，也在水上飞机领域同多尼尔竞争。§!"
 GEA_friedrichshafen_mio_desc: "$generic_mio_initial_trait_naval_aircraft_designer$\n§L$GEA_friedrichshafen_desc$§!\n"
 GEA_mauser_organisation: "毛瑟"
 GEA_mauser_desc: "§g威廉和保罗·毛瑟兄弟最初随父亲安德烈亚斯在符腾堡国王腓特烈一世的王家兵工厂工作。兄弟二人随后自行开发武器，在十九世纪六十年代研制针发枪和后膛步枪，并凭借可靠军火商的声誉使改进型号成为普鲁士军队制式步枪。1871年后的订单改变了他们的命运，旧王家兵工厂于1874年被收购，并在1897年同其他品牌合并为毛瑟股份公司。此后毛瑟一直是德国陆军的重要供应商，尤其在世界大战东西两线发挥关键作用。如今公司凭K98k步枪和C96手枪等优质武器主导德国及中欧市场。§!"
 GEA_mauser_mio_desc: "$generic_mio_initial_trait_infantry_manufacturer$\n§L$GEA_mauser_desc$§!\n"
 GEA_dwm_organisation: "德意志武器弹药公司"
 GEA_dwm_desc: "§g德意志武器弹药公司成立于1896年，源于路德维希·勒韦公司分别收购柏林兵工厂和卡尔斯鲁厄弹药厂。伊西多尔·勒韦随后发动一系列强硬兼并，取得毛瑟和比利时国营赫斯塔尔等企业的重要股份，并同克虏伯争夺德国军火市场。世界大战期间，两家公司竞相向陆军供货，德意志武器弹药公司提供毛瑟步枪、鲁格手枪和马克沁机枪，从战争订单中获取巨额利润。战后，公司把中欧各地旧兵工厂改为子公司，并在英国革命后买入比利时军工业股份。如今它是帝国第二大军火制造商，能够持续供应高质量枪械和支援装备。§!"
 GEA_dwm_mio_desc: "$generic_mio_initial_trait_support_equipment_manufacturer$\n§L$GEA_dwm_desc$§!\n"
 GEA_rheinmetall_organisation: "莱茵金属"
 GEA_rheinmetall_desc: "§g莱茵金属制品与机器制造股份公司于1889年作为大型金属企业的子公司成立，负责为德意志帝国生产弹药。公司很快在海因里希·埃尔哈特主持下收购杜塞尔多夫工厂，在远程火炮领域取得突破，1892年获得无缝管生产专利，并于1896年制造出世界首门速射炮。通过1901年收购德莱塞步枪厂等濒危企业，到1914年它已成为德国主要军火商之一。世界大战期间，莱茵金属以野战炮和榴弹炮闻名；此后又扩展到装甲和防空技术。§!"
 GEA_rheinmetall_mio_desc: "$generic_mio_initial_trait_artillery_manufacturer$\n§L$GEA_rheinmetall_desc$§!\n"
 GEA_opel_organisation: "欧宝"
 GEA_opel_desc: "§g亚当·欧宝于1862年在黑森吕瑟尔斯海姆创立公司，最初生产缝纫机，后来又制造自行车。1895年他去世后，遗孀索菲和儿子们接管企业，并于1899年同弗里德里希·卢茨曼合作制造汽车。世界大战期间，欧宝凭三吨卡车和标准化军用零件成长为大型企业；战后则成为德国最受欢迎的汽车品牌，占据近三分之一国内市场并主导中欧。二十年代的欧宝4型“树蛙”成为德国的福特T型车，三十年代的“闪电”则成为最流行的卡车。若祖国再次开战，欧宝能够为机动作战提供所需的一切车辆。§!"
 GEA_opel_mio_desc: "$generic_mio_initial_trait_motorized_mechanized_manufacturer$\n§L$GEA_opel_desc$§!\n"
 GEA_hanomag_organisation: "哈诺玛格"
 GEA_hanomag_desc: "§g格奥尔格·埃格斯托夫于1835年在林登创立汉诺威铸铁及机器厂，最初制造蒸汽机，1846年进入机车生产，到1870年已为汉诺威国营铁路供应大部分车辆。1871年企业出售后改组为汉诺威机器制造股份公司，并在二十世纪扩展到拖拉机和汽车。世界大战期间，公司为德国军队提供蒸汽车和卡车；战后又在农业机械领域取得进展，制造速度更快、马力更强并采用柴油发动机的拖拉机。如今哈诺玛格以德国民用“拖拉机之王”著称，但也能转向军工生产，为军队提供维持全球远距离补给所需的高速车辆。§!"
 GEA_hanomag_mio_desc: "$generic_mio_initial_trait_motorized_mechanized_manufacturer$\n§L$GEA_hanomag_desc$§!\n"

