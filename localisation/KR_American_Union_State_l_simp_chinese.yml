TEX_CLAIRE_LEE_CHENNAULT_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1890年9月6日，美利坚合众国 德克萨斯州 科默斯\n§Y军旅生涯：§W陈纳德在路易斯安那州立大学就学期间加入了预备役军官训练队，从此开始了他的军旅生涯。1917年，他从印第安纳州本杰明·哈里森堡军官学校毕业，不久就被调到陆军通信兵航空部。1919年，他获得了上天飞行的计划并在航空处转型为陆军航空兵团后继续在其中服役。1931年，他成为空军战术学校追击组组长兼阿拉巴马州飞行表演队的第一追击组组长，成为该地区因优雅的飞天驾驶技巧而闻名的人物。1937年临近时，因为华盛顿的工作人员拒绝提拔他担任队长以外的职务，陈纳德考虑辞职。毕竟他的健康状况已经不再适合他继续从事飞行了。美国内战开始时，陈纳德站在路易斯安那州前州长休伊·朗的一边，他因此带动了休伊·朗征募新兵的活动，对陈纳德的表演充满热情的观众挤满了征募摊位。为表达感激之情，休伊·朗授予了陈纳德荣誉准将的军衔，以表彰他为南方所做的贡献\n§Y重要信息：§W陈纳德的健康状况一直在慢慢恶化，耳聋和慢性支气管炎是陈纳德迟早要面对的主要问题。"
 TEX_DADDY_COLLINS_DESC:0 "§Y指挥官介绍\n§Y生于：§W1896年5月1日，美利坚合众国 路易斯安那州 新奥尔良\n§Y军旅生涯：§W约瑟夫·劳顿·柯林斯“闪电乔”在1913年西点军校开始了他的军事生涯——因为他的叔叔马丁·贝尔曼当时是新奥尔良的少校并在他17岁那年设法推荐了他——1917年他在西点毕业并取得步兵少尉军衔。在西点军校任教期间，他一直担任教师，并与格拉迪斯·伊斯特布鲁克结婚。1921年，他开始在西点军校教授化学。1926年，他自本宁堡步兵学校连长课程毕业，一年后，他又在锡尔堡野战炮兵学校完成了一门高级课程。1927年到1932年间，柯林斯在步兵学校教武器与战术，1933年到1934年间他曾多次要求转到菲律宾师团，并最终如愿以偿，并在那里晋升为少校。1935年到1936年，他从陆军工业学院和战争学院毕业，晋升中校。\n§Y重要信息：§W-他是一名极具天赋但又极具进攻性的指挥官，在领导进攻时，他的能力比在防守时更出色。"
 TEX_COURTNEY_HODGES_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1887年1月5日，美利坚合众国 佐治亚州 休斯敦县\n§Y军旅生涯：§W考特尼·希克斯·霍奇斯 1904年加入西点军校，但一年后由于学业极其糟糕而被迫退学。但他并没有因此而放弃从军的理想，1906年，他作为一名二等兵应征入伍。1907年迅速晋升为中士，1909年荣登少尉军衔。他在惩罚性远征期间加入潘兴，在那里遇到了乔治·巴顿和乔治·马歇尔，并在墨西哥边境逗留10年代晚期，期间曾在第六步兵团对抗几个小规模的游击队小组。由于在边境服役而被提升为少校后，他进入了指挥和参谋学院，1925年毕业成为本宁堡步兵委员会的一员。1934年，他从陆军战争学院毕业晋升为中校。"
 TEX_WILLIAM_SIMPSON_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1888年5月18日，美利坚合众国 德克萨斯州 威瑟福德\n§Y军旅生涯：§W威廉·胡德·辛普森 1909年毕业于西点军校并被授予步兵少尉军衔。辛普森的第一个任务是在北达科他州林肯堡的第六步兵团。此后不久，该团于1910年1月被派往菲律宾棉兰老岛并在那里停留了两年半，辛普森在那里参与了对摩洛叛乱的镇压。1912年，他随团返回美国，驻扎在布利斯堡担任连长，1916年他参加了潘兴远征队并在那里晋升为中尉。1917年2月，他成为指挥埃尔帕索军区的乔治·贝尔少将的副官。从1919年起辛普森经历了几项人事任命，并最终参加了一些军事课程培训。1921年初获准晋升为上尉。1932年，辛普森开始在波莫纳学院教授军事科学和战术。1936年晋升为中校。随着美国逐渐失去控制，辛普森与休伊·朗对美国的看法越来越一致。休伊宣布成立自立门户时，辛普森站了出来向他所认为的“真正的美国”做出了关键的贡献。由于他的忠诚，辛普森被任命为准将。"
 TEX_JACOB_DENVERS_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1887年9月8日，美利坚合众国宾夕法尼亚州约克\n§Y军旅生涯：§W德弗斯的军旅生涯始于1906年国会议员丹尼尔·F·拉费恩推荐他进入西点军校并于1909年6月11日以炮兵少尉的身份毕业。德弗斯的第一个任务是在华盛顿的第四山地炮兵第一营，1912年底，他被送回西点军校教授数学。1916年4月1日，他晋升为中尉并被调到夏威夷斯科菲尔德兵营新启用的第九野战炮兵部队，1917年初晋升为上尉。1919年5月，德弗斯被派去欧洲进行为期三个月的短期任务，学习世界大战经验。他出席了普鲁士军事学院的课程学习二战期间双方使用的新装备和战术思维。1920年他被提升为少校并选入指挥和普通参谋学校，1925年毕业后被派往锡尔堡担任野战炮兵学校枪炮系主任。1929年8月31日，德弗斯被调往华盛顿特区出任野战炮兵部队总司令参谋。1932年，他又被选入陆军战争学院进修并于1933年6月毕业。1934年2月26日他晋升为中校。美国陷入骚乱后，德弗斯越发抵触上级处理内部问题的方式，并因此同德怀特·艾森豪威尔成了死对头，甚至与老朋友莱斯利·麦克奈尔也产生了分歧。休伊·朗建立联盟国后，德弗斯认定麦克阿瑟将军及其部下对美国而言是个累赘，遂转投联盟国怀抱，并与老特里·德拉梅萨一起获提拔为了陆军上将。"
 TEX_MATTHEW_RIDGWAY_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1895年3月3日，美利坚合众国 弗吉尼亚州 门罗堡\n§Y军旅生涯：§W“老铁奶”马修·邦克·李奇微于1913年通过西点军校入学考试后开始其军事生涯。他于1917年以步兵少尉身份从军校毕业。李奇微最初被派往墨西哥边境的第3步兵团进行巡逻任务，在那里他被晋升为上尉，并于1920年返回西点军校执教西班牙语。1925年，李奇微从美国陆军步兵学校毕业，之后被派往美国驻天津公使馆，后又被派往尼加拉瓜，并成为试图监督1927年选举的美国人之一。1930年，他被调往菲律宾，成为菲律宾群岛总督的顾问，并于1933年以少校身份返回美国。1935年，他从陆军司令部和总参谋部学校毕业，在内战爆发前就读于宾夕法尼亚州的陆军战争学院。随着身边环境的激进化，他发现自己多次遭到“工人民兵”的骚扰，并慢慢开始对联邦政府失去信心。当休伊·朗最终宣布成立美利坚联盟国时，李奇微决定，如果有必要的话，最好是去美利坚联盟国，把美国从无政府状态中拯救出来。在联盟国那里，他被提升为准将。"
 TEX_BRUCE_CLARKE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1901年4月29日，美利坚合众国 纽约州 亚当斯\n§Y军旅生涯：§W布鲁斯·库珀·克拉克，1918年加入国民警卫队，1920年成为美国军事学院的一员。1925年，他从西点军校毕业，成为工程兵少尉。同年，他获得了土木工程学位和法学学士学位。他主要从事参谋工作，直到1935年升为上校。"
 TEX_HENRY_HODES_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1899年3月19日，美利坚合众国 华盛顿特区\n§Y军旅生涯：§W亨利·欧文·霍兹在进入美国军事学院后开始其军事生涯，于1920年以骑兵中尉身份从那里毕业。在完成怀俄明和德克萨斯的一系列工作任务后，他发现自己变得和巴顿一样强烈支持美国军队的机械化，但由于军队预算的削减，这对他们来说只是个白日梦。"
 TEX_CLIFTON_CATES_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1893年8月31日，美利坚合众国田纳西州蒂普顿维尔\n§Y军旅生涯：§W1910年，克利夫顿·布莱索·“幸运”·凯茨从密苏里军事学院毕业，成为了美国海军陆战队预备役的一名少尉。因为在训练中的出色表现，凯茨的能力引起了时任准将的乔治·巴内特的注意，后者因此将其提拔为了自己的副官。1923年之前，凯茨一直跟随巴内特左右，在那里，凯茨一路升迁为上校并被派去指挥亚利桑那号上的海军陆战队。1928年，他被调往圣地亚哥海军陆战队第四团，该团将被调往上海保卫美国公使馆。1932年，凯茨回到美国，在那里报名参加了陆军工业学院和海军陆战队的高级军官课程，1935年毕业并晋升为中校。1936年，凯茨又回到了上海，并于1937年3月底再度离开。美国陷入内战之际，凯茨前去看望了田纳西州的家人。在看到了家乡的混乱局面之后，凯茨说服了同事刘易斯·普勒，两人一同加入了宪政国政府，他也成为海军陆战队的准将，而普勒也成为了宪政国政府最重要的海军陆战队指挥官之一"
 TEX_CHESTY_PULLER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1898年6月26日，美利坚合众国 弗吉尼亚州 西点\n§Y军旅生涯：§W刘易斯·伯韦尔·普勒在很小的时候就决定参军，但因为他无法得到父母的同意而一直无法如愿。在他21岁之前，他最终决定前往弗吉尼亚军事学院学习，1919年毕业后，他进入海军陆战队的士官学校和军官预备学校学习并获得了少尉军衔。1921年，他被派往海地宪兵队与卡科叛军发生了40多次小规模冲突，后来他成为亚历山大·范德格里夫特的副官。在美国驻军服役四年后，1928年12月，他被分配到尼加拉瓜国民警卫队的海军陆战队分队。在尼加拉瓜，他领导了几次对抗桑地诺阵线的战斗，尽管在人数上明显落后于尼加拉瓜叛军，但他还是取得了胜利并因此获得了海军十字勋章。1931年他回到美国，在本宁堡完成了连队军官课程培训。1932年6月，他以上尉的身份从本宁堡毕业，9月返回尼加拉瓜。在那里，他参加了埃尔绍塞战役并获得了少校的晋升。1933年，他被调到上海指挥“中国派遣军海军陆战队”，1936年6月返回美国从事教职。随着美国逐渐陷入内战，因为普勒在支持谁的问题上犹豫不决，普勒被盖茨说服加入美利坚联盟国。当普勒抵达路易斯安那州后，他在尼加拉瓜和海地的行动赢得了许多当地军事人员和休伊·朗内阁成员的敬重，并支持他晋升为准将。"
 TEX_PEDRO_DEL_VALLE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1893年8月28日，美利坚合众国 波多黎各 圣胡安\n§Y军旅生涯：§W佩德罗·奥古斯托·德尔巴列在接受时任波多黎各总督的乔治·拉德克利夫·科尔顿任命前往阿纳波利斯后开始其军事生涯。他于1915年毕业后被委任为海军陆战队少尉。在完成弗吉尼亚州诺福克海军军官学校的课程后，他随第一临时海军陆战队旅到海地共和国海岸执行海外任务。1916年5月，他从大草原号登陆参与攻占圣多明戈城的行动和在多米尼加共和国展开的战役。随后他作为海军陆战队分队的指挥官登上德克萨斯号，在海军上将贝蒂的指使下与英国大舰队一起服役。在目睹日德兰的第二次海战后，他被派往弗吉尼亚州匡提科的海军陆战队军营。在怀俄明号执行完另一次海上任务后，他被指派为J·H·彭德尔顿少将的副官，陪同少将视察西印度群岛。1924年，他前往华盛顿特区的海军陆战队总部。在那里他担任联邦交通委员会的海军陆战队代表。1926年，他奉命在海地宪兵队服役三年，于1928年返回美国后参加了弗吉尼亚州匡提科海军陆战队学校的野战军官课程。毕业后，他成为教员，曾两次为执行尼加拉瓜的美国选举团任务暂时离职。在里士满号以海军中队军官的身份执行海上任务后，他奉命前往海军陆战队总部。他后来在欧洲成为助理海军专员，直到内战爆发不久前被召回，并因政治原因投靠美利坚联盟国。\n§Y重要信息：§W公开和私下皆表现出强烈的反犹主义观点。"
 POLITICS_CARROLL_STUART_REGENT_DESC:0 "虽然名义上君主才是美国的国家元首，但所有人都清楚美国政府的真正掌权者是谁。菲利普·阿科斯塔·卡罗尔，战争英雄和神圣美利坚联盟的领袖，他才是美国真正的权力核心。以获詹姆斯三世任命为摄政王（前总统职位的直接继承者）作为起点，摄政王卡罗尔发誓他将不惜一切代价纠正整个国家，让美国能走在正确的道路上。"
 POLITICS_CHRIST_THE_KING_DESC:0 "在现代历史上最具争议的政治决定之后，拿撒勒的耶稣正式加冕为美利坚之王。他所获得的新头衔对实际政治意义不大，毕竟，耶稣若要真正行使他作为国王的权力，就需要真正意义上的“第二次降临”，而要是耶稣基督真的重降人间，人世的政治恐怕也就无关紧要了。事实上，授予基督王权不过是神圣美利坚联盟为其天主教政治和极权统治添光加彩粉饰打扮的一次不加掩饰的尝试。如果基督的王权被证明只是可怕的独裁统治的掩盖幕布，那么美国真正的光明未来几时才能到来就有待观察了。"
 POLITICS_HOLY_AMERCIA_DESC:0 "神圣美利坚摄政委员会诞生于混乱的圣玛丽城。庞大到臃肿的国会决定谁来继承我们敬爱的卡罗尔的时候，很快议员之间便陷入剑拔弩张的混乱，有些人看到了这种局势潜藏的危险。因此，当他们的担忧变成现实，圣玛丽城被卷入渴望权力的派系之间的斗争时，这些伟大的议员决定团结起来，因为只有团结一致，国家才能生存。现在，愿意合作的议员们在一个可以决定国家命运的委员会中共同领导着这个国家。只要摄政委员会一天还存在，他们就不会允许美国再次陷入混乱。"
 POLITICS_REGENT_JOE_DESC:0 "小约瑟夫·P·肯尼迪，出生于1915年7月25日。他出生于上升时期的肯尼迪家族，父亲希望把他培养为未来的政治家，成为第一位天主教美国总统。然而，美国那野蛮的内乱爆发时，他没有选择留在和平安宁的新英格兰，而是选择了应征入伍，成为联盟国的天主教军队一员。事实证明他的决定是正确的。天主教徒们已在通往美国统治者的道路上铺好石阶，肯尼迪也声名鹊起。倘若圣玛丽城没有爆发政治混乱，他或许会留在军队继续服役。但肯尼迪绝不会允许天主之国因某些人的政治野心而崩溃，因此他率军攻占了国会大厦并恢复秩序。现在，腐朽的政客和他们的帮凶再也不会威胁国家的秩序稳定了。"
 POLITICS_CHAD_KOC_DESC:0 "马丁·亨利·卡莫迪出生于1872年，自出生以来便是一位虔诚的天主教徒。他在很小的时候就加入了哥伦布骑士团，投身于研究哥伦布骑士团的历史以及作为基督忠实的骑士仆人。因此，当他在1929年成为哥伦布骑士团的至高骑士时，他越发专注于历史研究和对古老天主教历史的回溯。当菲利普·卡罗尔掌权时，卡莫迪很快就开始试图赢得他的宠爱，卡罗尔选择哥伦布骑士作为自己的近卫时，他立刻献上了忠诚。这项新任务似乎改变了卡莫迪，他认真对待这项任务，从完全忠诚和充满荣誉感的新兵中挑选卡罗尔的护卫，将其转变为真正的近卫军。很快，在卡罗尔不幸去世后，骑士团在强硬派中成为了极具影响力的存在，并开始发挥作用。现在骑士们已经赢得了权力斗争，他们似乎下定决心要实现让美国回归古老的基督教世界的目标。"
 POLITICS_FEENEY_DESC:0 "伦纳德·费尼，其出生于1897年2月18日，他一直是一个严格的耶稣会士，他认为，对天主教教义来说，除了最精准最本质的解读之外，其他都只是通往地狱的大门。由于其对天主教理想的坚定信仰以及对非天主教徒的不信任，菲利普·卡罗尔认为把他任命为美国宗教裁判所的负责人是再合适不过的了。而掌握了这个新的权柄，费尼便立即着手镇压那些敢于反对新天主教秩序的党派与团体，并帮助裁判所对“美国再洗礼派”进行审问。他总是让宗教裁判所密切监视那些新受洗礼的美国天主教徒，因为他确信其中有些人是隐藏在羊群中的狼。在卡罗尔去世后，他比以往任何时候都要更加关注这一问题。而现在，在国会展现了对他的信任，并赋予了他掌握国家的大权后，费尼和宗教裁判所誓要消除美国国内的一切威胁，因为他们正权柄在握，没有人胆敢反对他们。"
 POLITICS_CATHOLIC_CHARLES_DESC:0 "查尔斯·库格林，其出生于 1891 年 10 月 25 日。在美国境内，他已是一名声名狼藉的神父，尽管他一直是一位非常有魅力的演讲者，但他在利用无线电广播来传达天主教福音之余，还在讨论一些更激烈的争议话题，其中便包括他对经济与少数民族的看法。他对帮助美国家庭如此执著，最终使他加入了休伊·朗领导下的美利坚至上党。虽然他认为自己是该党及其理想的忠实信徒，但他毕竟还是一名天主教徒。因此，在新火药阴谋成功后，他加入了菲利普·卡罗尔的神圣联盟。而多年后的如今，他业已证明了自己在联盟中的价值，这让他被提名为国家领袖。或许这个舌灿莲花的神父正是我们国家现在所需要的。"
 POLITICS_FULTON_SHEEN_DESC:0 "富尔顿·约翰·申，其生于 1895 年 5 月。他以在广播中对美国天主教徒动听的布道与教导而声名鹊起。尽管他不像库格林那样出名，但这位谦逊的主教曾作为一名主的仆人服务美国各地的天主教徒，他的教导也被美国各天主教大学与天主教徒所奉行。而这些光荣事迹也让他进入了卡罗尔的视线，卡罗尔让他在内阁中拥有了一席之地，让他得以继续在这个瞬息万变的美国里忠实地担任着传教士一职。现在，在基督的摄政逝世后。富尔顿·申再次证明了自己在神圣美利坚联盟中的价值，他们让他成为了卡罗尔的继任者。申现在有很多决定要做，但他最主要的目标是维持卡罗尔的美国精神——清心的人有福了。"
 POLITICS_CATHOLIC_SMITH_DESC:0 "许多政治家都假装渴望改革，或假装着反对各种形式的腐败，但只有少数政治家能既信守这些承诺，又能在这样做时取得成功、行事高效，赢得显赫的名声。而摄政王阿尔·史密斯便是这样一位政治家——一颗在贪婪狼群与阴谋家的海洋之中，罕见的、未受污染的宝石。史密斯于1873年出生于曼哈顿，其出身于天主教爱尔兰工人阶级移民，在年轻时，他加入了“沉默者”查理·墨菲和坦慕尼协会的队伍，以此开始了政治生涯。而正是在青年岁月里，史密斯树立起了他的改良主义理想与对工人的热爱——而这也正是他能在职业生涯上勇攀高峰的基础。而其作为臭名昭著，长期主导纽约的政治舞台的坦慕尼协会的政治机器的一员，协会也帮助他步步高升，让他在后来成为了一名成功的、旨在改革那些导致他国家衰落的法律的运动的领导者，史密斯一直能让他想要的法律通过，他也一直因此作为唯一成功的天主教政治家而闻名。现在，作为摄政王，史密斯摆脱了那些认为他对教宗命令言听令从的怀疑者的声音。因为，除了对诚实的善政和上帝的双重信仰之外，没有任何人或任何命令能影响史密斯的政策。"
 POLITICS_CATHOLIC_DAY_DESC:0 "很少有人能像现在的摄政王多萝西·戴那样，既能拥有深刻的社会主义正义感，又能坚持纯粹的基督教原则。戴于1897年出生在布鲁克林的一个英裔爱尔兰中产阶级家庭里，她自己的宗教意识是在她自己的阅读、学习和实践过程中形成的。而她的父母充其量只是在名义上是基督徒，但这也让戴能以自己的方式追随上帝。她的童年被对基督教的兴趣所充满，她的青春期则颇有些波希米亚式狂想的色彩，她以记者和流浪者的身份在全国各地旅行，在她寻找自我的过程中，她从基督教教义与社会主义意识形态中接受了新的影响与思想洗礼。经过十多年的自省，并经历了初为人母的考验，并在美国内战中兼顾了她与世界产业工人联盟的社会主义者的联系与前联邦各州的圣公会的联系，戴已成为了神圣美利坚联盟里最独特、也是最温和的政治领袖之一。尽管许多人仍然不相信她对社会主义真有同情可言，但所有真诚的信徒都知道戴对社会主义的热爱并非是那种对枯燥无味的、老掉牙的理论的盲目热爱，而是将社会主义视为上帝本人慈爱、平等的旨意，并对其衷心热爱。她将是那位向美国人民展示真正的、未经污染的社会主义之光的先知——而那是一个沐浴在上帝的荣耀之中、并在虔诚中得到升华的社会主义。"
 POLITICS_CHAD_KOC_KING_DESC:0 "马丁·亨利·卡莫迪出生于1872年，自出生以来便是一位虔诚的天主教徒。他在很小的时候就加入了哥伦布骑士团，投身于研究哥伦布骑士团的历史以及作为基督忠实的骑士仆人。因此，当他在1929年成为哥伦布骑士团的至高骑士时，他越发专注于历史研究和对古老天主教历史的回溯。当菲利普·卡罗尔掌权时，卡莫迪很快就开始试图赢得他的宠爱，卡罗尔选择哥伦布骑士作为自己的近卫时，他立刻献上了忠诚。这项新任务似乎改变了卡莫迪，他认真对待这项任务，从完全忠诚和充满荣誉感的新兵中挑选卡罗尔的护卫，将其转变为真正的近卫军。很快，在卡罗尔不幸去世后，骑士团在强硬派中成为了极具影响力的存在，并开始发挥作用。随着他加冕为美利坚国王马丁一世，把复古的新封建主义带来美国的任务似乎已经完成。尽管如此，持续监视着人间的骑士团似乎变得越发强势和庞大，而所有这些都是为了保护美国作为基督的地上王国最后堡垒的地位。"
 POLITICS_ROBERT_STUART:0 "作为斯图亚特家族的合法继承人，现已去世的詹姆斯三世将王位传给这位最合法的继承人是再自然不过了。我们的新国王已经加冕，现任巴伐利亚国王、巴伐利亚公爵、法兰克尼亚公爵、施瓦本公爵、莱茵行宫伯爵鲁普雷希特·马里亚·柳特波德·斐迪南，已蒙上帝恩典，成为了新任美利坚国王、英格兰国王、苏格兰国王、新不列颠帝国皇帝、主的信仰捍卫者。这位年迈而经验丰富的国王于1869年在慕尼黑出生，并作为一名退伍军人和职业贵族过着传奇般的生活——这背景对一位高贵而受人尊敬的国王来说，实在再合适不过了。在他登基践祚后，斯图亚特家族的真正子嗣再次得到了其与生俱来的权利。"
 POLITICS_MARY_STUART:0 "在父亲突然去世后，第18代阿尔巴女公爵，年轻的玛丽亚·德尔·罗萨里奥·卡耶塔纳·菲茨-詹姆斯·斯图亚特-席尔瓦，已蒙上帝恩典，加冕为美利坚女王、英格兰女王、苏格兰女王、新不列颠帝国女皇、主的信仰捍卫者。玛丽亚女王于1926年出生，是已故国王哈科沃·菲茨-詹姆斯·斯图亚特和他已故的妻子，圣比森特德尔巴科第九任女侯爵，阿尔巴·德·托尔梅斯公爵夫人多娜·玛丽亚·德尔·罗萨里奥·德·席尔瓦·古尔图拜的女儿。玛丽亚女王是斯图亚特家族的真正继承人，是尊贵的詹姆斯二世的真正后裔，无可质疑地流淌着斯图亚特家族的血脉。然而，这位皇室后代现在只是一个缺乏执政经验的年轻社交名媛，但在她信任的顾问们——神圣美利坚联盟的成员们和尊敬的卡罗尔摄政王的帮助之下，这位年轻的女王也许正是美国人民需要的宠儿，能为我们根基尚浅的君主制提供民众支持。在我们为美利坚加冕首位女王之际，愿她能让心碎的人民团结一致，并帮助我们重建国家。"
 POLITICS_STUART_REGENCY:0 "由于国王去世，而他的女儿玛丽亚目前还太过年轻，无法履行职责，卡罗尔摄政和神圣美利坚联盟已成立了摄政委员会。在这个新制度之下，摄政王代替了年轻的玛丽亚公主，以仁慈的独裁者的身份高效地统治着这个国家，他也毫不隐藏是自己真正控制着这个国家。卡罗尔摄政王在方方面面都控制着美国政府，并引领着这个虔诚而神圣的帝国去追求自己的目标——而这一切都掩盖在一个年轻女孩的影子之中，一层薄到几乎不存在的帘幕之下。直到玛丽亚年纪大到可以登上帝位为止，神圣帝国才能走出摄政王的阴影（即使那算不上多黑暗），虽然国内的许多人觉得这一天遥遥无期，认为摄政王终将巩固权力，永掌大权，但卡罗尔本人正尽力去消除民众的恐惧。而不管他的意图如何，摄政王现在都掌握着最终决定权，他的法令也等同于天意，因为摄政王和他的摄政委员会已无所顾忌。"
 POLITICS_E_W_MARLAND:0 "欧内斯特·惠特沃思·马兰1874年出生于匹兹堡的一个商人家庭，长期以来他一直遵循着美利坚资本主义，但与他同时代的许多资本家不同，对利润和现金的热爱并没有使他成为工人的敌人。马兰时常声称自己作为一个磨坊主的儿子，由于真心去照顾自己的工人，在漫长的职业生涯中从不需要处理罢工问题，因为在从小接受资本主义教育的同时，他也了解良好的劳资关系的必要性。\n在进入法学院之前，马兰一直在私立学校接受提前教育，因此在19岁时他就获得了完整的法律学位，以此在安顿下来之前解决生计问题。在担任律师期间，马兰对地质学产生了兴趣，决定转行从事石油业务，希望在宾夕法尼亚州的石油大繁荣时期大赚一笔，这最终使他走上了终身的石油商人的道路。马兰创办了许多不同的企业，多次发家致富，但1907年开始的经济危机，以及对他的掠夺性垄断收购又让他一次次失去财富。最终，马兰终于获得了稳定的成功，并接着竞选国会议员，作为俄克拉何马州第八选区的代表获得了一个席位，成为了15年来首位担任该职位的民主党人。\n由于独特的人道资本主义理念以及作为普通工人朋友的声誉，马兰变得越来越受欢迎。在1935年，由于默里试图竞选总统宝座，他取代了老苜蓿比尔成为了俄克拉何马州州长，但无情的命运终结了他的任期。美国内战的战火熊熊燃烧，马兰发现当自己在俄克拉何马州与旧民主党崛起的影响力持续抗争时，渐渐地站到了王鱼和他的亲信的一边。随着时间推移，内战终于接近尾声，也许马兰是时候实现自己开拓一个进步资本主义的美国的独特愿景了。"
 POLITICS_PHILIP_THE_FIRST:0 "菲利普·阿科斯塔·卡罗尔摄政是在《独立宣言》上签字的唯一一位天主教国父卡罗尔顿的查尔斯·卡罗尔的直系后裔，他出生于1879年，父亲是约翰·李·卡罗尔，母亲是玛丽·卡特·卡罗尔，想到这么一号人物日后竟会执掌美国，不得不让人感叹造化的奇妙。也许是家世的原因，又或许是成长环境所致，身为州长之子的菲利普从小就与法律结下了不解之缘，即使是在世界大战的战火之中，他也不忘研习法律，至于后来立志成为一名律师，并于1906年加入了马里兰州律师协会也就不难理解了。当世界大战以德国胜利告终时，卡罗尔对自由民主的美好幻想在一瞬间破灭，不过他并没有声张，而是把这种情感深藏于心。\n\n1923年，卡罗尔与妮娜·玛丽亚·瑞恩成婚。在长子菲利普·阿科斯塔·卡罗尔二世出生受洗后，卡罗尔的心境发生了变化，原先不冷不热的宗教信仰突然迸发出了似火的热情。这一突如其来的180度转变也影响到了卡罗尔的法律工作。在对基督、对教会抑制不住的热忱的驱使下，卡罗尔想要为自己的信仰做点什么，于是他决定去为纽约市的基督教阵线成员进行辩护。也正是在为致力于建立天主教美利坚的这群人辩护的过程中，卡罗尔接触到了整合主义思想。虽然基督教阵线本身根本算不上是整合主义组织，但其许多激进的天主教成员都对一些外国的意识形态有所涉猎，整合主义就是其一。\n\n在日薄西山的奥兰治骑士团的恐慌之下，美国基本快成了一个天主教国家，而此时，卡罗尔摄政决定迈出大胆的一步——他宣布美利坚合众国彻底成为了过往，取而代之的是为了全世界天主教信仰而诞生的瓜达卢佩圣母帝国。帝国势不可挡，因传播圣信是祂本人的意志。"
 POLITICS_CARROLL_DESC:0 "菲利普·阿科斯塔·卡罗尔摄政是在《独立宣言》上签字的唯一一位天主教国父卡罗尔顿的查尔斯·卡罗尔的直系后裔，他出生于1879年，父亲是约翰·李·卡罗尔，母亲是玛丽·卡特·卡罗尔，想到这么一号人物日后竟会执掌美国，不得不让人感叹造化的奇妙。也许是家世的原因，又或许是成长环境所致，身为州长之子的菲利普从小就与法律结下了不解之缘，即使是在世界大战的战火之中，他也不忘研习法律，至于后来立志成为一名律师，并于1906年加入了马里兰州律师协会也就不难理解了。当世界大战以德国胜利告终时，卡罗尔对自由民主的美好幻想在一瞬间破灭，不过他并没有声张，而是把这种情感深藏于心。\n\n1923年，卡罗尔与妮娜·玛丽亚·瑞恩成婚。在长子菲利普·阿科斯塔·卡罗尔二世出生受洗后，卡罗尔的心境发生了变化，原先不冷不热的宗教信仰突然迸发出了似火的热情。这一突如其来的180度转变也影响到了卡罗尔的法律工作。在对基督、对教会抑制不住的热忱的驱使下，卡罗尔想要为自己的信仰做点什么，于是他决定去为纽约市的基督教阵线成员进行辩护。也正是在为致力于建立天主教美利坚的这群人辩护的过程中，卡罗尔接触到了整合主义思想。虽然基督教阵线本身根本算不上是整合主义组织，但其许多激进的天主教成员都对一些外国的意识形态有所涉猎，整合主义就是其一。\n\n内战爆发时，卡罗尔二话不说就加入了梵蒂冈派来援助王鱼的民兵队。出色的作战能力，加上家庭背景，使得他很快就将这一组织掌控在了自己手中。如今，卡罗尔大权在握，还因自己的“中间派”身份得到了整个神圣美利坚联盟的支持，他将不惜一切代价建成天主教国家。"
 TEX_TERRY_DE_LA_MESA_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1888年4月1日，美利坚合众国犹他州道格拉斯堡\n§Y军旅生涯：§W艾伦出生在一个有着悠久军队传统的家庭。他的祖父卡洛斯·阿尔瓦雷斯·德拉梅萨上校是西裔移民，在内战中加入了联邦军。他的父亲塞缪尔·艾伦上校也曾在军队服役。1907年，艾伦考上了纽约的西点军校。然而由于口吃等原因，艾伦最终被学校开除。不过，在美国天主教大学成功接受了高等教育后，艾伦获得了第二次军事生涯的机会，并被分配到弗吉尼亚州迈尔堡担任骑兵少尉。这些年来，他的职位一直在慢慢攀升，这一切得益于在一次下巴遭到枪击后，他奇异地不再口吃了。在指挥系统中晋升的同时，艾伦继续在各种机构接受军事教育，从堪萨斯州的美军骑兵学校和美军指挥学校，到佐治亚州本宁堡的美军步兵学校。他的职业生涯一直发展到他成为一名指导员，并最终遇到了乔治·C·马歇尔将军，并被对方直接任命为准将。虽然他跳过了家族前人们必经的上校军衔，但他并不介意，而是把注意力全身心投入到了战场上。事实上，很多人都把他的作战方式和乔治·S·巴顿将军的相提并论，因为他咄咄逼人的作风和变化多端的风格使他与那位更著名的军人非常相似。然而，除此以外，两人却很不相同，艾伦不太在意自己的风度容姿，而更看重战术，重视夜间进攻和出奇制胜的计划。他自信、高效的领导风格使他成为美军最有前途的准将之一。或许正因为这个，在1936年，奥马尔·布拉德利少将与艾伦发生冲突，导致艾伦搬去了自己熟悉的德克萨斯州，在那里他与如今的妻子相识，并服役了几年。在德克萨斯，他加入了休伊·朗，而朗也慧眼识人，立即将他和雅各布·德弗斯一起晋升为了陆军上将。"
 POLITICS_PAPPY_O_DANIEL_DESC:0 "威尔伯特·李·奥丹尼尔有一段迷人的生活经历。他的成年生活从面粉推销员开始，还涉足音乐和广播，最终接管了他所在公司的广播广告工作，并将其变成自己的项目。正是在这个广播节目中，“递上饼干，帕比”这句话被首次使用，也是奥丹尼尔成为一个家喻户晓的名字的地方。在最近德克萨斯州和全国其他地区的动荡中，奥丹尼尔决定加入休伊·朗的美利坚至上党，认为他们比联邦政府更能代表普通人，尽管在政策上有很多分歧。现在，他已经开始了自己的政治冒险，成为德克萨斯州和整个联邦的民主党领袖，他希望带领美国度过当前的危机，只有老式的德克萨斯价值观和他的基督教信仰可以指导他。"
 POLITICS_GERALD_L_K_SMITH:0 "几十年来，杰拉尔德·史密斯一直被认为是一个追随者，而不是一个领导者，在1937年加入休伊-朗的美利坚联盟国后，他在福音派的圈子里开始了自己的发展。史密斯早年被任命为牧师，首次受到了休伊·朗分享社会财富计划的影响。然而，史密斯加入了美利坚至上党的极右派。史密斯一直在朗的手下工作，尽管他们之间有很多争执，但他还是成功地确保了自己作为休伊·朗的继承人的地位。现在他掌权了，毫无疑问，美利坚至上党将进一步右转。"
 POLITICS_EARL_KEMP_LONG:0 "自从1932年被其兄弟休伊·朗拒绝任命为副州长后，厄尔·坎普·朗一直生活在兄弟的阴影之下。厄尔在国会以其进步政策而声名远扬，但也因支持至上党的权威凌驾于州政府而臭名昭著。作为休伊去世前多年就已钦定的继任者，厄尔推行和兄弟一样的改革议程，但在社会问题上更为保守和宽容。正是在厄尔·朗的领导下，休伊·朗的教育和福利改革才在这局势紧张的年代真正付诸实施。而关于他发表种族主义言论和精神不稳的流言则悄无声息地被至上党所掩盖。"
 POLITICS_JACOBO_F_J_STUART:0 "哈科沃·菲茨-詹姆斯·斯图亚特，出生于1878年10月17日，第17任阿尔巴公爵，获得了一个他做梦也想不到的职位——美利坚的国王詹姆斯三世。在他接任美国的王位之前，雅各布过着精彩纷呈的人生。在1931年以前他一直担任西班牙外交部长，他还是一名艺术品收藏家，甚至是奥运会奖牌的获得者，他在1924年柏林奥运会上赢得了马球项目银牌。1920年10月7日，他与圣比森特德尔巴科第九任女侯爵玛丽亚·德·罗萨里奥·德·席尔瓦结婚。他们俩有一个女儿，卡耶塔娜·菲茨-詹姆斯·斯图亚特，斯图亚特家族的继承人。\n\n当雅各布第一次收到邀请他登上美国王位的信时，他惊讶地哑口无言。虽然他确实持有斯图亚特家族的宣称，他可从来没有想过提出宣称，更不用说他从来没有预料到自己的宣称奏效的地方居然是那个自建国以来一直燃烧着共和主义与反天主教之火的前殖民地国度。然而现在他就在这里，统治着一个本不可能再有国王的国家。\n\n虽然加冕为王，哈科沃几乎没有任何实权，毕竟授予了他冠冕的人也是掌权之人。尽管哈科沃显然只是一个无力的傀儡，但他出色地扮演了自己的新角色，几乎每天都愿意出现在公众面前，无论是发表演讲，还是与摄政王卡罗尔一起出席，或者仅仅和家人散步。虽然他可能只是神圣美利坚联盟光荣的橡皮图章，哈科沃·菲茨-詹姆斯·斯图亚特仍然发自内心爱着他的人民，而人民则回报以爱。"
 TEX_EARL_C_LONG_DESC:0 "§Y指挥官介绍\n§Y生于：§W 1883年11月，美利坚合众国 新泽西州 克莱顿\n§Y军旅生涯：§W 高中毕业后，厄尔·朗进入了加利福尼亚大学。他于1905年毕业，获得了工程学学士学位，1909年8月5日，他参加海军陆战队，同时被任命为少尉。1909年9月，他被送到南卡罗来纳州罗亚尔港的海军军官学校接受进一步训练。1911年1月毕业后，朗被分配到马雷岛海军造船厂的海军军营，在那里服役到1912年7月。随后，他被派往丹佛号巡洋舰上的海军陆战队分遣队，并乘船前往尼加拉瓜与路易斯·梅纳将军领导的叛军作战。朗在尼加拉瓜的科林托登录，与斯梅德利·巴特勒少校一起参加作战。随后朗被分配到圣地亚哥海军军营服役，直到1920年1月，又被调到海军陆战队总部的军需部。1920年5月初，朗转移至菲律宾的甲米地海军陆战队军营，并在那里度过了接下来的两年。1922年11月初，他回到圣地亚哥，在1924年1月晋升少校军衔后，朗被调到匡提科海军军营。第三海军陆战队在斯梅德利·巴特勒准将的领导下，于1927年5月乘船前往中国，参加了上海租界的保卫工作。朗在1929年1月收到返回美国的命令，并再次隶属于海军陆战队总部的军需部。他受命在海军陆战队匡提科军营内的海军陆战队学校学习野战军官课程，毕业后，朗于1934年10月晋升为中校军衔。第二次美国内战爆发后，朗主动向太平洋国提供服务，但由于与休伊·朗是亲戚而遭到拒绝。随后，他又试图向他的老朋友斯梅德利·巴特勒提供服务，但由于同样的原因遭到拒绝。休伊·朗闻讯后，为他提供了一个职位，他唯有接受。\n§Y重要信息：§W厄尔对休伊·朗的忠诚心并不强，只是站在联盟国一边战斗——因为那是唯一一个不会因为他的亲戚关系而拒绝他的国家。"
 POLITICS_GEORGE_VAN_HORN_MOSELEY:0 "莫斯利在美国陆军服役40年，从菲律宾的一名骑兵中尉一直升到华盛顿的一名军官，这为他创造了丰富的履历。在乔治·巴顿和麦克阿瑟将军手下服役的经历影响了他，这使得他最终决定支持休伊·朗，以及他坚定了对犹太人阴谋论的信念。最终，他相信任何形式的社会主义都是非常危险的，这使他成为战争权力委员会的完美发言人。有谣言说，没有莫斯利参与谋划的失踪案，战争权力委员会就不可能接替休伊·朗。"
 POLITICS_WILLIAM_DUDLEY_PELLEY:0 "三十九岁的威廉·佩利是一个相当缺乏想象力的好莱坞编剧和记者。他过去的冒险经历主要包括访问俄罗斯和吸收反犹太主义的小册子。到1933年成立银色军团时，佩利已经形成了他独特的意识形态，将灵性论、民主和宗教结合了起来。佩利更古怪的观点则只有值得信赖的盟友才知晓。在他的组织被休伊·朗允许参加选举后，他以“基督教党”党魁的身份赢得了选举。反社会主义和对基督教的认同和扩大民主信仰是构成他政府的理想。"
TEX_national_political_machine:0 "国家政治机器"
 TEX_national_political_machine_desc:0 "行政命令曾被用来在不侵犯国家主权的前提下建立为美国人民服务的机构。然而在过去，这种权力也激发了商政界裙带关系与机构腐败。我们的总统是绝对清廉的，现在他已向美国承诺将扭转局面，反对垄断和贪污。"
 TEX_every_man_a_king:0 "人人皆国王"
 TEX_every_man_a_king_desc:0 "“人人皆国王！”起初只是奥里森·斯威特·马登所撰写的励志读物中阐述的美好理想。然而现在，“人人皆国王”已经成为了美国的政治现实。我们的分级税率和对宝贵的公共事业的控制，让每个家庭都可以获得足够的生活保障收入，最终彻底结束了美国的贫困。"
 TEX_for_the_poor_man:0 "为了穷人"
 TEX_for_the_poor_man_desc:0 "现在，总统已向国会提交立法倡议，要求提供相当于平均财富三分之一的家园津贴，并为忠诚的美国国民保证养老金供给与至少两千美元的年收入。在为这些项目适当地调整我国的所得税制度之前，所有这些好处的经费都将来源于国库。"
 TEX_road_map_for_the_future:0 "未来的道路图"
 TEX_road_map_for_the_future_desc:0 "总统贯彻“人人皆国王”的费用需要一种与以往完全不同的税收与公共财政手段来维持。因此，休伊·朗总统已经制定了一份改革路线图来策划四年任期内对他所希望实现的各项法案与政治里程碑的预算分配。"
TEX_marland_presidency:0 "正统民主党回归"
 TEX_marland_presidency_desc:0 "只有美利坚联盟国内部的一小部分人——残存的民主党人和其他各派资本主义自由主义者和进步人士仍然没有在其他更主要的政党中得到有力支持，于是他们都选择联合起来支持白手起家的百万富翁E·W·马兰，以便为联盟国带来一个新的自由时代。著名的石油商人马兰与其民主党人专注于人道资本主义，特别强调支持我们的工人和下层阶级，而不让其被资本主义机器所吞噬，他们设想了一个崭新的美国，在草原上拥抱我们的先锋遗产和拓荒者文化，同时为所有美国人创造一个公平且有利可图的天堂。随着马兰和新民主党人的崛起并取代了王鱼之位，现在全国都在屏息凝气，看看这些人道的资本家能否兑现他们的承诺。"
 TEX_promote_marland_oil:0 "新马兰石油公司"
 TEX_promote_marland_oil_desc:0 "作为一名石油大亨，马兰总统一生中创造了无数企业，但每一次都最终落入掠夺性垄断和精英竞争的陷阱，迫使马兰两次失去自己白手起家的财富，重建自己的商业帝国。尽管他的旧马兰石油公司是这些最终失败的公司之一，在20世纪20年代被摩根大通吞并，但随着他新获得的权力地位，也许这一切最终可以改变。创建一个新的马兰石油公司，将其与国家和经济捆绑，同时扩大其业务，为全国大多数公民提供石油，马兰总统将为尽可能多的美国人带来廉价和负担得起的石油，同时再次重建他的财富。"
 TEX_reject_eastern_businessmen:0 "反对海岸精英主义与垄断主义"
 TEX_reject_eastern_businessmen_desc:0 "E·W·马兰总统长期与东海岸的精英资本家为敌，因为正是这些掠夺成性的资本家们不止一次毁了他的生意，他已经开始通过一系列法律和立法来限制这些垄断大亨的权力。美国的资本主义应该彻底脱离任人唯亲与垄断，最终完全摆脱这些只会榨干普通人每一分血汗钱的掠夺性行为。美国经济将最终拥抱自由、人道和非掠夺性资本主义的真正理念，确保美国梦对联邦的每一个人都是真正可以实现的。"
 TEX_affordable_oil_for_all:0 "订立州际石油契约"
 TEX_affordable_oil_for_all_desc:0 "尽管新成立的马兰石油公司已经开始为尽可能多的美国人提供廉价、可负担得起的石油和天然气，但这项服务仍然只延伸到大平原地区——我们能源基础的核心。在美国的各个边缘地区，竞争激烈的石油商和垄断企业仍然在推高油价，剥削着我们只想寻求温暖与力量，并为了美国梦而无休止工作的无辜公民。我们必须现在就结束这种掠夺性资本主义！虽然我们还并未拥有足够的权力或权威以清除“价格战”，但我们可以在此期间创建一个新组织来对抗这些行为。州际石油契约委员会将因此成立，以确保联盟国中的每一个州都遵守“为所有人提供可负担的石油、天然气和电力”的宗旨。到目前为止，已经有31州的州长签署了这项协议，将确保尽可能多的美国人能够廉价地取暖与供电，而无需担忧其他，同时还能保护国家库存，确保并无浪费。"
 TEX_lift_the_unemployed:0 "再无失业"
 TEX_lift_the_unemployed_desc:0 "第二次美国内战，以及此前的大萧条和黑色星期一，共同造成了美国有史以来最高的失业率。为了解决这一问题，我们应该通过新的政策来帮助失业者在困难时期生存下来，同时协助他们寻找工作，以求其在没有政府救济的情况下也能养活自己。像往常一样，如果这些傻瓜仍然找不到稳定的工作，马兰自己的石油公司总会有职位空缺，以满足他们的额外需求。"
 TEX_promote_american_unity:0 "弥合美国分歧"
 TEX_promote_american_unity_desc:0 "美国比以往任何时候都更为分裂，这早已不是什么秘密。新党派如雨后春笋般不断涌现，旧党派和联盟纷纷瓦解，不信任和怀疑仍在群众心中涌动，激进主义虽然在内战后遭到打击，但仍能尽其所能地渗入至每一个裂缝与缝隙。甚至我们自己的民主党也受到了这种分歧的影响——声名狼藉的旧民主党污渍还在继续玷污我们的形象。我们必须为重建和修复曾经伟大的联邦迈出第一步，既要在物质上开始一个新的重建时期，也要在精神上甚至是思想上努力修补美国人民的心灵——因为世界诸国可不会等待这个沉睡的巨人缓慢苏醒。"
 TEX_protect_the_pioneering_women:0 "保护先锋女性"
 TEX_protect_the_pioneering_women_desc:0 "当被委托在他的家乡庞卡市建造一座雕像，以纪念并引起人们对当地正在消失的部落的关注时，马兰迅速反击称，不是印第安人从美国消失了，而是拓荒女性精神真正在濒临消亡。这一努力的最终成果——一尊名为“红颜”的美丽27英尺高铜像，描绘了拓荒妇女和她的孩子——确立了该思想与言论。总统已采取行动，维护边疆生活和先驱自由的理念，特别是针对女性。全美国的女士们将欢欣鼓舞，因为她们终于得到了应有的声音和尊重，与其他真正的美国同胞享有平等的地位，正是这些妇女把她们的优雅、道德品质和精神力量带到了西部。此外，保护拓荒者和拓荒者生活方式和文化主题的小规模宣传将与这些措施相配合。在这个新的美国，当我们抛弃往日恐怖，拥抱美国真正建立之初长达数十年的文化之时，在文明和真正的野性的边界上，强大、自给自足和母系生活方式的理念将深入人心。"
 TEX_rebuild_the_democrat_party:0 "重塑民主党"
 TEX_rebuild_the_democrat_party_desc:0 "近几十年来，民主党历经磨难，在泥沼中几经沉浮，在全美和崩溃的联邦中分裂为无数派别。这些伪民主党中的大多数恶棍都属于旧民主党。充斥着南方民主党人、三K党同情者、精英棉花大王和其他庸碌之辈，旧民主党和其他像他们一样的组织玷污我们的好名声太久了。在马兰总统的领导下，我们将把民主党重塑为人道主义新堡垒和公平资本主义灯塔，在我们恢复联邦所诞生的圣水中重新为我们的政党洗礼，涤去过去的罪恶。"
 TEX_nationwide_homestead_exemption:0 "全国宅地豁免"
 TEX_nationwide_homestead_exemption_desc:0 "马兰总统实践了自己在俄克拉何马州执政期间提出的观点，将他的宅地豁免政策在全国范围内推广，从而使我们公民的财产价值得到保护，不受掠夺性财产税、债权人和从价税的影响——这些通常会压倒一个刚刚丧偶的财产所有者。这种免于强制出售的豁免权也保证了寡妇在需要时能得到庇护，并确保她们不会被债权人的要求所“溺死”。在我们可怕的兄弟之战后，寡妇遍布国家，在我们继续修复联邦之时，这项新的豁免将帮助美国中产阶级重新站起来。"
 TEX_introduce_little_new_deal:0 "推行小新政"
 TEX_introduce_little_new_deal_desc:0 "与他在国会和担任俄克拉何马州州长期间制定的计划类似，马兰总统已经为全美国制定了他的“小新政”。在20世纪20年代，他与已故的罗斯福和菲奥雷洛·拉瓜迪亚共同创建了该计划，小新政将带来一个救济、复苏和改革的新时代，旨在提高美国人民的生活水平，防止另一场大萧条。然而，为了确保激进主义永远不会再次在美国扎根，小新政将被美式自由保守主义和人道资本主义的思想所约束，同时也避免了更激进的政策——在过去几乎撕裂了国家的社会主义和左翼民粹主义政策。"
 TEX_establish_works_prog_admin:0 "建立公共事业振兴署"
 TEX_establish_works_prog_admin_desc:0 "为了给大众带来新的就业机会，同时刺激我们的经济，马兰总统已经着手建立公共事业振兴署。通过公共工程项目创造就业机会，如筑坝和植树，公路建设，寻找新资源的考古和地质考察，翻新历史建筑和场馆等等，公共事业振兴署将为美国人民创造数百万个新的就业机会，在我们继续重建这个曾经伟大的联邦之时，最终使经济回归正轨。"
 TEX_aid_for_the_disabled_elderly_children:0 "扶困济贫"
 TEX_aid_for_the_disabled_elderly_children_desc:0 "虽然我们是真正的资本与利润之子，但这并不意味着我们不关心那些真正需要帮助的人。销售税和其他联邦收入来源应在全国范围内提高，增加的税收收入将由国家拨付，用于扶助残疾人、老年人、受抚养儿童或孤儿。一些人的繁荣理应成为所有人的繁荣，甚至是被遗忘者和受压迫者——因为马兰总统将帮助所有需要帮助的美国人，无论其背景如何。"
 TEX_always_fair_to_labor:0 "永远公平"
 TEX_always_fair_to_labor_desc:0 "就像父亲所教导的那样，E·W·马兰一直努力公平对待工人，因为正是父亲对工人的尊重与帮助，才使他们从未罢工反对马兰的管理。工人们可能身份低微，但他们数量众多，也至关重要，没有他们，任何企业或国家都无法运转。我们不会再犯导致第二次美国内战以及助长战争的社会主义动乱的相同错误。我们的新经济和新联盟将把下层阶级的需要与国家的其他事务放在同等重要的位置。没有一个美国人会因此掉队，也没有一个工人会被我们遗忘，因为美国掠夺性资本主义的时代终于结束了。"
 TEX_true_american_democracy:0 "真正民主的美国"
 TEX_true_american_democracy_desc:0 "在马兰及其新生的民主党的巧妙举措下，真正的美国民主已为所有人所拥抱与享受。所有美国人，无论其背景、性别或种族，在这个公平的制度中都享有平等的发言权，所有人都会受到国家和这种新式人道资本主义的关照，而不会滑向危险的民粹主义。美国人民迎来了一个民主新时代，马兰总统和他的新民主党人将成为这个光荣而自由的新时代先驱。自由人的国度和勇敢者的家园终于回归正轨，在这个新建立的联盟中为所有人带来了美式天堂，这一切都要感谢马兰总统。"
 TEX_oil_conservation:0 "石油的最终公平价格"
 TEX_oil_conservation_desc:0 "州际石油委员会现在几乎囊括了美国的每一个州，加上马兰总统无与伦比的权威与声望，我们的政府终于可以自由地推行马兰在美国的最终石油计划了。马兰石油公司将在全国范围内拓展业务，甚至超越目前州际石油委员会成员州的边界，并以大局为重，采取一些我们的竞争对手所使用一些令人厌恶的垄断政策。在这种人道主义的“垄断”下，所有人都将得到公平的价格与公平的服务，无论各州州长或当地政治家和商业大亨们怎么想，所有美国人都应享有平等和舒适的生活方式。那些拒绝屈服于我方人道资本主义的掠夺性组织和竞争性垄断企业，如标准石油公司，将被我们更优秀的商业头脑所淘汰，当廉价的黑金从海岸流向内陆时，所有的美国人都会欢欣鼓舞，这都要感谢马兰总统。"
 TEX_protect_our_highways:0 "州际高速公路巡警"
 TEX_protect_our_highways_desc:0 "马兰总统复制了他在担任俄克拉何马州州长期间制定的计划，建立了州际公路巡警。这支新警察部队的管辖权将高于州立与地方警察部门，直属于联邦政府，在整个联邦范围内拥有广泛的管辖权。这些新警员将专门负责交通执法和预防公路犯罪，他们会时刻准备并保持警惕，在我们新联盟不断扩大的高速公路上进行巡逻。有了这些新的执勤人员，我们也将可以自由地扩大新生联盟的基础设施，而不必担心公路犯罪活动或车辆事故的增加。"
 TEX_new_gunpowder_plot:0 "新火药阴谋得胜"
 TEX_new_gunpowder_plot_desc:0 "“反天主教”长期以来一直困扰着美国社会，这点毋庸置疑。而当天主教终于获得了一定的政治权力时，反天主教思潮再度出现。无论是朗本人还是其他的激进美国新教徒，菲利普·卡罗尔领导下的神圣美利坚联盟都绝不能对教会受到的威胁坐视不理，所以他们采取了行动。随着新火药阴谋的成功，教会和美国自身都得到了拯救。凭借手中前所未有的政治权力，神圣美利坚联盟将开始为美国带来救赎。吾王基督万岁！"
 TEX_knights_of_columbus:0 "起用哥伦布骑士团"
 TEX_knights_of_columbus_desc:0 "哥伦布骑士团成立于1882年，是美国境内最大的天主教兄弟会组织。为了在内战的烽烟之中保卫家园、保卫教会，许多地方教团都组建了自己的民兵团，身处敌方腹地的哥伦布骑士团也建立了自己的间谍网，为教会民兵和联盟国做出了莫大的贡献。后来，民兵团经过改组编入了神圣美利坚联盟，而尚存的间谍网则成了至高骑士卡莫迪手下的暗部。如今，卡莫迪入主联邦调查局，而联盟也正需要信得过的老练特工执行情报工作，于是政府决定正式起用骑士团。他们将充当联盟的耳目，根除一切反对天主教的势力，其地位甚至要在调查局之上。"
 TEX_fight_pelleyism:0 "清算旧账"
 TEX_fight_pelleyism_desc:0 "受阿尔斯特统一主义者影响而成立的新教组织奥兰治骑士团虽然不是国内最大的势力，但自我们掌权以来，他们就迅速成长为了我们的头号对手。他们之所以能这么快壮大，很大程度上要归咎于我们查封了最大的新教团体，而当时的奥兰治骑士团还名不见经传，所以他们就逃过了一劫。现在来看，这绝对是步错棋。根据哥伦布骑士团的报告，奥兰治骑士团就是反对我们统治的新教徒的大本营。据传，杰拉尔德·L·K·史密斯呈递给朗的反天主教法案就是奥兰治骑士团的主意，也因此，奥兰治骑士团和哥伦布骑士团成了水火不容的宿敌。我们两家之间的恩怨是该理清一下了，就算前路充满了艰难险阻，我们也会刨根究底，揪出奥兰治骑士团的每一位成员，追究他们的责任。"
 TEX_puppet_the_opposition:0 "束缚各党"
 TEX_puppet_the_opposition_desc:0 "当摄政王卡罗尔第一次掌控美利坚合众国时，他轻松地将这个腐败和异端的共和国变成了一个他本人担任摄政王的君主立宪制国家。然而他犯了一个错误，不仅允许那些反对神圣美利坚联盟的人继续保持合法，而且还允许他们待在国会大厅。这一错误导致他们对我国及其合法性大肆攻击，并最终导致国家内部一盘散沙。但是这个问题终于得以解决！通过使用哥伦布骑士团对其施加压力并授权给正确的人，我们可以有效地傀儡那些残存的政党。这不仅会让我们在美国的正义重建中拥有更大的自由，而且当人们看到我们与那些反对我们统治的人并肩工作时，他们只会愈发拥护我们，这将是一个双赢的局面。"
 TEX_cremate_the_klan:0 "火葬三K党"
 TEX_cremate_the_klan_desc:0 "奥兰治骑士团虽是近期美国大部分反天主教活动的幕后黑手，但他们很少会亲自出手，新教抵抗势力背后的真正打手其实是臭名昭著的三K党及其众多分支。我们在得势之前就看三K党不顺眼，从那时到今日，他们一直在坚持不懈地给我们制造着麻烦。如今蛇头已被斩断，非裔美国人和天主教徒的梦想终于照进了现实。我们会追击残余的三K党成员至天涯海角，将他们斩草除根！待到美国人的心目中已不再记得起三K党这个名号，我们的工作才算真正地结束了，而那时，我们就可以自豪地说三K党已被彻底埋葬了。"
 TEX_criminalise_republicanism:0 "自由主义非法化"
 TEX_criminalise_republicanism_desc:0 "用费利克斯·萨尔达-萨尔瓦尼神父的话来说，自由主义就是罪孽一宗。这也不难理解，毕竟教会一直视癌症般的启蒙时代产物为大敌。如果美国要转变成真正的天主教国家，那自由主义这一荼毒就必须被清除。为此，自由主义这一理念本身就应被取缔，所有奉行自由主义的组织也会被我们渗透，实行内部爆破。虽然道阻且长，但只要能将美国从人类创造出的最恶毒的思想之一中解救出来，那么一切就都是值得的。"
 TEX_promote_monarchism:0 "迈向贵族理想"
 TEX_promote_monarchism_desc:0 "中世纪的贵族虽谈不上尽善尽美，但他们通常被视作道德楷模、世俗世界中的天主教模范。当然真实情况如何大伙心里都清楚，不过我们倒是可以利用下这一理想画像。通过宣传贵族理想，竖立得体的天主教贵族人设，我们可以将天主教的思想深深刻印入大众的心中。既然追星在美国是种通常现象，那何不让虔诚的天主教徒充当这个“星”呢？"
 TEX_catholic_america:0 "走向整合主义美利坚"
 TEX_catholic_america_desc:0 "整合主义最本质的特征之一就是分权的政治模式。虽然我们的国家和分权还八竿子打不着关系，因为威胁仍未退去，我们需要强大的中央政府来处理局面，但现在没有不等于以后也没有。为此，我们会先尽量下放一切不必要的权力，大幅提高地方的自主权，然后再成立一个委员会负责后续所有事务，逐步向完全分权过渡，最终实现整合主义的理想。"
 TEX_guadalupism:0 "推广“瓜达卢佩主义”"
 TEX_guadalupism_desc:0 "瓜达卢佩主义这一独特的意识形态由卡罗尔摄政提出，它阐述了神圣美利坚联盟的整合主义的具体形态。瓜达卢佩主义大体上与卢西塔尼亚整合主义相似，但存在着几处关键不同。从理论上来讲，瓜达卢佩主义与政治无关，它融合了天主教世界方方面面的内容，着重强调泛美利坚主义与天主教的传播。不过实际上，瓜达卢佩主义只是为了让普通的美国人能更容易接受整合主义而立的名头，至于其效果，那就只能边走边看了。"
 TEX_encourge_conversions:0 "鼓励皈依正信"
 TEX_encourge_conversions_desc:0 "美国是一个新教徒占多数的国家，这是无可回避的事实，虽然天主教会禁止强行改变任何人的信仰，但联盟想出了这样一个计划。通过资助如耶稣会与圣高隆庞传教会这样的各个传教士团体，我们无疑可以大大增加皈依天主教的人数，从而源源不断地为数量庞大天主教团体输送新鲜血液。"
 TEX_catholic_monarchy:0 "马加比计划"
 TEX_catholic_monarchy_desc:0 "美国的经济仍旧一片狼藉，传教行动虽然取得了一定成果，但进展缓慢。为了同时振兴经济、推动传教进展，联盟拟定了马加比计划，即降低天主教徒和天主教组织的税收，对非天主教徒增税。如此，既能提高国库收入，又能鼓励人们皈依天主教，真可谓一石二鸟。"
 TEX_reward_catholicism:0 "奖赏忠诚的天主教徒"
 TEX_reward_catholicism_desc:0 "马加比计划的首要任务是确定谁才是我们真正的公民，有权得到减税的承诺。如想参与其中，公民就必须是虔诚的天主教徒，信奉四大信条且每周日参加弥撒。如若他们不满足上述条件，就不会得到他们的奖赏，并将被征收适度的税，以此为天主教徒织就某种形式的安全网。这是因为，一个叛逆不羁的天主教徒也比一个虔诚驯良的新教徒好些。"
 TEX_catholic_education:0 "义务天主教教育"
 TEX_catholic_education_desc:0 "自设立以来，公立学校就是公共教育的标准。将青年教育成为虔诚的天主教徒是联盟对美利坚未来愿景的重要一环，为此我们应当为全国各地公立学校的教理问答课拨款。对于“真”基督教的真理的内省将最终摧毁新教，即使这需要几代人的时间。"
 TEX_cavalier_identity:0 "培养骑士身份认同"
 TEX_cavalier_identity_desc:0 "作为英国的前殖民地，美国是英国在全世界散布的邪恶圣公会信仰的受害者。然而，在英国完全被邪恶的新教卷须吞噬之前，她曾经经历过一场可怕的内战。其中有一方代表着上帝、国王和国家，而另一方则任由自己被邪恶的新教和所谓的启蒙运动所腐化。那些为国王，以及国王对真正的信仰的自由许可而战的人，那时采用了天主教骑士这个词来形容自己。骑士身份认同是一种为了信仰和国家而战的绅士行为方式，是我国政府必须推动美国人民接受的身份。通过颂扬内战中的詹姆斯二世党人为英雄，我们不仅可以开始真正让我们的人民产生骑士身份认同，还可以把加拿大人和他们的保皇党流亡者描绘成一群篡位者，使美国革命和我们建立的君主制在人民眼中更具合法性。"
 TEX_distributism:0 "创建道德经济"
 TEX_distributism_desc:0 "没有人能够挑战我们的政权了，天主教徒已经控制了局面，我们几乎准备好实现完全的经济独立，并最终摆脱我们依赖的外国生命线。然而，一场探讨我国经济形式的争论已经蔓延到我们政府的最高层。多萝西·戴描述了她对“分产主义”的支持，这种主义希望尽量分散生产资料，该计划获得了信教工人的支持，但却被一些人认为是工团主义的复活。另一方面，阿尔·史密斯描述了他的“天主教资本主义”计划，内容正如它听起来的那样，这个计划也获得了支持，但它也被视为摧毁旧美国的邪恶的自由主义。这场辩论已经传到了摄政王卡罗尔的耳朵里，那么问题来了，领袖会选择哪条道路？"
 TEX_catholic_unions:0 "扶持天主教工会"
 TEX_catholic_unions_desc:0 "多萝西·戴表示，她将在我们的指导下协助建立天主教工会，这些工会会将信仰发扬光大，同时也确保工人能够有发声的渠道。教会历来都支持工人通过工会保障自己的权利，所以多萝西·戴能提出这一想法毫不意外。天主教社会教导终会在美国社会扎下根来，而这正是政坛中的天主教徒们自这一概念诞生之初就许下的目标。"
 TEX_common_man_monachism:0 "推广“大众整合主义”"
 TEX_common_man_monachism_desc:0 "为了在美国传播天主教信仰，我们用心良苦，也取得了不俗的成绩，天主教的势头越来越盛，而与之相对的，我们的整合主义理念却仍旧被大众百般排斥，即使有瓜达卢佩主义作引，也没能拉拢到什么死忠。为了解决这一难题，卡罗尔摄政提出了“大众整合主义”。一言以蔽之，大众整合主义将原有的整合主义理想进行了拆分，并加入了朗的民粹主义思想。毕竟，朗和我们都是同路人，都奉行人民至上，而我们只是更加重视宗教罢了。"
 TEX_blur_the_lines:0 "模糊界线"
 TEX_blur_the_lines_desc:0 "政教分离也许是所谓启蒙运动最大的罪过。自罗马帝国崩溃，圣母教会单枪匹马地开始从头重建社会以来，教会和国家就紧密交织在一起。为了敲响美国国内启蒙思想的丧钟，教会将成为美国社会的中心支柱。主教会拥有世俗权力，政府中也会少不了神职人员的影子。虽然违背了国父们的意愿，但政教合一乃至高天主的意志，而不出多久，国家与教会就将再度紧密结合在一起。"
 TEX_americae_sanctus:0 "圣 哉 美 利 坚"
 TEX_americae_sanctus_desc:0 "漫长而艰难的战斗过后，美利坚完成了自己的激进转变。她再也不是新教与资本主义的避风港，而是天主教和整合主义的乐土，一个担得上“闪耀的山巅之城”名号的国家。美利坚化羽成圣，圣母教会再也不会受到任何威胁了，因天主的罗马是这片土地的土地，胆敢反抗之人定会形消神灭。"
 TEX_improve_artillery:0 "改进火炮"
 TEX_improve_artillery_desc:0 "南方炮兵工业的最高产出也低于全国其他地区。为了迎头赶上，改善其射程和装填速度的新草案将使我们的炮兵比敌人打击速度更快，打击力度更强。"
 TEX_Assembly_line_modifications:0 "装配线改良"
 TEX_Assembly_line_modifications_desc:0 "随着新的设计已在装配线上，我们的一名设计师指出，装配所需的几件零件能用更易获取的零件加以精简，并建议批准这些零件进入大规模生产，供火炮装配使用。"
 TEX_focus_on_concentration:0 "专注集火"
 TEX_focus_on_concentration_desc:0 "从罗马军团时代起，集中兵力就一直是每位指挥官的宝贵策略。考虑到我国在打击美国叛徒时的有限资源，我们应再次为炮兵重新考虑这一战略，将其集中于特定区域，使步兵能利用其实现突破。"
 AUS_focus_on_swiftness:0 "专注机动"
 AUS_focus_on_swiftness_desc:0 "自堑壕战在西线盛行至今，现代战争已经演变了许多。摩托化部队和坦克的快速发展不再是梦想，而是作战部队成功的必要条件，因此我国军队应该走在这一发展的前列。"
 TEX_focus_on_command:0 "专注指挥"
 TEX_focus_on_command_desc:0 "我们在内战中的敌人能简单描述为没有组织和士气低落的民兵，偶尔有前军队的残余力量在进行真正的抵抗。如果希望战胜他们，我们应使自己的军队成为拥有强大的组织性和凝聚力的榜样。"
 TEX_military_research:0 "军事科研"
 TEX_military_research_desc:0 "纵然我们有几所世界一流的大学和许多杰出的理论家，我们也没法同时进行太多的研究项目。我们需要为军事方面的研究选择一个指导方向。"
 TEX_new_arms_factories:0 "新武器工厂"
 TEX_new_arms_factories_desc:0 "建立军事工业所需面临的主要问题，是大萧条以来我国军工生产设施的普遍萎缩。我们必须扩建已有设施，重新利用老建筑，以便在我国领土上生产出更多重型武器所需的零件。"
 TEX_war_bonds:0 "战争债券"
 TEX_war_bonds_desc:0 "流动资金短缺已经成为现有经济计划执行阶段的主要障碍。我们可以像大多数自由国家那样以政府信用为依托发行公共债券筹措财政资金。因此在参与“胜利花园”计划与志愿者服务之外，公民们应该通过购买政府债券为战争贡献自己额外的力量。"
 AUS_new_army_goes_rolling_along:0 "“我们将保卫”"
 AUS_new_army_goes_rolling_along_desc:0 "我们的新军重新采用先辈们使用的古老格言，他们拿起武器保卫我们伟大的国家。就像我们的先辈一样，现在是时候在不断变化的世界里为美利坚而战了，无论是国内还是国外。"
 TEX_army_bonus_bill:0 "陆军奖金法案"
 TEX_army_bonus_bill_desc:0 "战斗把男孩们磨砺成坚强的男子汉，把男子汉磨练成坚如磐石的钢铁。他们是美国精神不可动摇的支柱，只有傻瓜才会把这样的老兵放在一边。通过向参战退伍军人发放慷慨的额外奖金，要求他们保持正直和忠诚——尤其是参与我们的军事研究机构——如此而为的话我们或许能够最终发掘他们的全部潜力。"
 TEX_coordinated_fire:0 "协同射击"
 TEX_coordinated_fire_desc:0 "按照命令定时射击火炮的日子已一去不返。一个更好的随时间运转的人力行动系统将使我们能在必要时协同射击。这将给我们更大的灵活性，也使我们能够更有效地协调各单位之间的关系。"
 TEX_air_force_reform:0 "组建美国空军"
 TEX_air_force_reform_desc:0 "由于美军中持续近20年的辩论仍在继续，叛逃我们一方的空军军官们承诺，如果将空军从陆军中分离出来，将会取得巨大的成果。在王鱼的赐福下，爱国的美国空军将成立，并将决定其未来的计划。"
 TEX_expand_ACTS:0 "扩建陆军航空兵战术学校"
 TEX_expand_ACTS_desc:0 "很幸运，美军过去将空军军官训练下放到南方腹地，因此我们现得以进入阿拉巴马州麦克斯韦空军基地航空兵战术学校。然而，为了超过在弗吉尼亚州兰利空军基地设立的学校，我们需要扩大招生规模。"
 TEX_fighters:0 "战斗机开发"
 TEX_fighters_desc:0 "由于缺乏政府的资金支持，美国战斗机项目在1920年代处于停滞状态，导致战斗机发展处于不利地位。为缩小这一差距，我们必须以一份利润丰厚的飞机生产合同为奖励来资助不同公司间的设计竞赛。"
 TEX_le_may_reform:0 "庞德改革计划"
 TEX_le_may_reform_desc:0 "前空军上尉、酒贩和飞机销售员威廉·托马斯·庞德提出了建立一支注重制空权优势和对先进技术（包括所谓的“火箭技术”）投资的空军，他指出，我们不能让敌人主宰天空。"
 TEX_air_field_expansion:0 "扩建空军基地"
 TEX_air_field_expansion_desc:0 "我们无法部署足够的空军，这可以通过进一步建设空军基础设施加以弥补。"
 TEX_naval_bombers:0 "发展海军轰炸机"
 TEX_naval_bombers_desc:0 "我们的海军部队不足以保卫海岸线，因此，空军应当承担起这份责任，不惜一切代价将企图涉足我国领土的敌军舰队沉入无尽的深渊。出于补充海军巡逻队的需要，我们将配属大批海军轰炸机负责侦察和阻碍任何敌对船只，尤其是传统海军难以深入或广泛开展巡逻的海域更是如此。"
 TEX_Weyland_plan:0 "帕森斯计划"
 TEX_Weyland_plan_desc:0 "埃德温·查尔斯·帕森斯呼吁联盟国建设空军时，要让其与军队的其他部分互补，并指出各军种之间的相互支持比各自为战更有效。"
 TEX_bombers:0 "发展轰炸机"
 TEX_bombers_desc:0 "轰炸机，恐惧的源泉，力量投射的象征。当她们授命为绝密计划服务而承载那些不为人知的秘密的重量时，我们当然需要让她们变得更加听话而精巧。"
 TEX_radar:0 "研发“雷达”"
 TEX_radar_desc:0 "“雷达”是一项用于发现空中敌军动向并让我军的空况监视员在夜晚能够更加轻松进行工作的最高机密技术。"
 TEX_screaming_eagles:0 "“呼啸之鹰”计划"
 TEX_screaming_eagles_desc:0 "随着空军力量的不断壮大和战场需求的日益增长，一个问题出现在我国陆军和空军军官面前：是否有可能将两军相结合，输送部队至敌后战场以改变战争的面貌？为证明或反驳这一理论，必须进行试验。"
 TEX_rule_the_skies:0 "统治天空"
 TEX_rule_the_skies_desc:0 "起飞吧，飞向无垠的苍穹，飞向高耸的天际吧。我们的空军举世无双，我们的力量无所不及。"
 TEX_CAS_focus:0 "近距离空中支援发展"
 TEX_CAS_focus_desc:0 "陆军在穿越敌人所建立的战壕时要求更多的地面支援。作为平等的合作伙伴，空军批准了这一要求。"
 TEX_CAS_doctrine:0 "空地协同演习"
 TEX_CAS_doctrine_desc:0 "为确保近地支援机队能够更为有效地投入战斗，我们首先要对这项新颖的战争概念加以实践。"
 TEX_flexible_bombers:0 "多用途轰炸机发展"
 TEX_flexible_bombers_desc:0 "自从我国空军肩负起辅助地面部队作战的使命以来，轰炸机正在扮演愈发广阔的角色。对敌军后方实施近地轰炸的成果，无论是针对后勤补给还是通讯设施都效果显著，我应该鼓励生产商开发能够适应这些任务的新型战斗机。"
 TEX_combined_arms_offensive:0 "陆空军协同进攻"
 TEX_combined_arms_offensive_desc:0 "我们的空军指挥官已经准备就绪，但阻碍我国军事力量发展另一问题正重新浮现：陆军军官们并不清楚该怎样发挥空军的最大潜力。因此，我们应该手把手地教导他们如何实现步兵、机械化车队与空军的战术协调，对敌人发起势不可挡的猛攻。"
 TEX_strat_bomber_development:0 "开发战略轰炸机"
 TEX_strat_bomber_development_desc:0 "我国空军的发展方向日渐清晰后，眼下应该着重于新型轰炸机的开发，实现摧毁敌方工业设施的重要使命。"
 TEX_cult_of_aviation:0 "航空崇拜"
 TEX_cult_of_aviation_desc:0 "自莱特兄弟在北卡罗来纳州小鹰镇进行人类历史上首次试验飞行以来，美国人对航空技术便显得愈发着迷。我们应该有效利用这种魅力，将我国空军打造为美利坚的骄傲。"
 TEX_long_range_interceptors:0 "远程拦截者"
 TEX_long_range_interceptors_desc:0 "尽管战斗机可以捍卫战场上空的安全，但位于敌方领空的战斗通常过于遥远，很少有战斗机可以护送我方的轰炸机群不受敌方空军部队干扰。为应对这些问题，我们设计改良了新的战斗机样品，分量更重、灵活性更强，在空中对决中更有优势。对该领域实施进一步投资有望提升项目的收益。"
 TEX_navy:0 "美利坚海军"
 TEX_navy_desc:0 "盘点海上形势之后，我们发现我方的海军只有很少的几艘船，水手的数量就更少了……但至少他们忠于美国人民。"
 TEX_great_white_fleet:0 "大白舰队"
 TEX_great_white_fleet_desc:0 "“大白舰队”是历史上美国海军实力的巅峰，它的荣光激励着每一代海军人。我们应当重拾往日荣光，建设一支以战列舰与无畏舰为核心的传大舰队，来捍卫美利坚的海权。"
 TEX_protect_american_trade:0 "保护美国贸易"
 TEX_protect_american_trade_desc:0 "贸易是美国的经济命脉，我国海军作战理论也自然应当以保卫海上生命线免遭敌军袭扰为核心。"
 TEX_carriers:0 "航母舰队项目"
 TEX_carriers_desc:0 "航空母舰代表着海军未来的潮流。我们应当投资相关领域研究以便更好地发展国内海军力量。"
 TEX_battleships:0 "研究战列舰"
 TEX_battleships_desc:0 "战列舰是当之无愧的公海霸主。我们应着手研发能够装载更大的舰炮与优良防空体系的新型战列舰。"
 TEX_battle_cruisers:0 "研究战列巡洋舰"
 TEX_battle_cruisers_desc:0 "战列巡洋舰，是战列舰重火力与巡洋舰机动性的完美结合。我国海军应配备相当数量的战列巡洋舰用于执行常规任务。"
 TEX_light_cruisers:0 "发展轻巡洋舰"
 TEX_light_cruisers_desc:0 "轻型巡洋舰的主要职责是为舰队提供防空火力、攻击敌方驱逐舰和摧毁敌方潜艇。我国海军应配备相当数量的轻巡洋舰来维持舰队战力平衡。"
 TEX_naval_aviation:0 "海军航空"
 TEX_naval_aviation_desc:0 "海军航空兵将成为未来远洋作战的主力。我们必须确保舰载战机可以在敌人对我方舰队产生威胁之前就将其歼灭。"
 TEX_expand_dockyards:0 "扩展造船厂"
 TEX_expand_dockyards_desc:0 "我国当前的船坞保有量不足以独力应付战争的需要，眼下我们应当建设更多的海军生产设施来供给战时所需。"
 TEX_submarine_development:0 "发展潜艇"
 TEX_submarine_development_desc:0 "潜艇可以对敌军运输编队和重型战舰造成重大破坏。我国的潜艇设计应当时刻领先于敌方驱逐舰与反潜战术的发展。"
 TEX_liberty_ships:0 "自由轮"
 TEX_liberty_ships_desc:0 "我国的民用造船厂先前主要是生产商业货轮。这些船厂能够迅速转向大规模运输船生产，让我们可以向遍布世界的盟友送去援助。"
 TEX_maritime_industry:0 "海事产业"
 TEX_maritime_industry_desc:0 "我们的海上传统依然牢固。我们可以利用商业航运业帮助我们苦苦挣扎的民主制度勉力生存下去。"
 TEX_new_admirals:0 "新海军将领"
 TEX_new_admirals_desc:0 "许多海军将领选择与东方的叛徒同流合污，为保障我国的海上霸权，我们必须培养新生代的海军指挥官。"
 TEX_life_at_sea:0 "建立海军女子志愿服务队"
 TEX_life_at_sea_desc:0 "女性可以在海军中承担一些辅助性的角色，以便让男人们专心于战斗任务。此举虽可能在社会上引发争议，但无疑有助于达成我们的战争目标。"
 TEX_marine_corps:0 "扩张海军陆战队"
 TEX_marine_corps_desc:0 "海军陆战队是美国全球军事投射能力的缩影。从蒙特祖马大厅，到的黎波里海岸，陆战队永远为国家效劳。我们应该确保他们能得到最先进的装备与训练设施。"
 TEX_naval_training:0 "海军训练"
 TEX_naval_training_desc:0 "尽管安纳波利斯海军军校在内战中被毁，我们仍然有充足的训练设施来培养新一代海军军官与水兵。"
 TEX_urban_warfare:0 "扩建海军陆战队"
 TEX_urban_warfare_desc:0 "我们应该扩建海军陆战队规模，确保他们有能力在全球范围内投射我国的力量。"
 TEX_coastal_bunkers:0 "永远忠诚"
 TEX_coastal_bunkers_desc:0 "“永远忠诚”是海军陆战队的格言，作为美利坚自由与民主的堡垒，他们将为世界传播解放的福音！"
 TEX_america_rules_waves:0 "美利坚统治海洋！"
 TEX_america_rules_waves_desc:0 "我国在海军研究与建设领域的广泛投资，使我们重新成为世界领先的海军强国之一。起航吧，为黑暗的世界开辟道路！"
 TEX_back_in_business:0 "重返世界舞台"
 TEX_back_in_business_desc:0 "现在我们已恢复世界强国的地位，是时候弄清下一步计划该指向什么地方了。我们的大多数政治家和人民都在敦促我们走向孤立主义。这很简单，因为这基本上是美国战前外交政策的延续。然而，现状已经发生改变，有人说在这个不断变化的世界里寻求盟友才是明智的。"
 TEX_enter_the_fray:0 "介入纷争"
 TEX_enter_the_fray_desc:0 "美国是世界舞台的一员。虽说我们对加入外国阵营一事心存芥蒂，但我们也会毫不犹豫地动用军事力量，消除世界各地那些终将找上门来的威胁。"
 TEX_arsenal_of_america:0 "美洲兵工厂"
 TEX_arsenal_of_america_desc:0 "“睦邻政策”要求我们在国家建制内，为未来冲突准备好充足的武器装备。总统阁下倡导的“民主兵工厂”由此应运而生，它将为其他国家推翻暴政、摧垮工团主义提供充足的帮助，无论路途多么艰难。"
 TEX_longer_reach:0 "伸手向远方"
 TEX_longer_reach_desc:0 "如果我们希望将自己的力量投射到世界各地，那就必须拥有一支强劲的海军。"
 TEX_on_the_beach:0 "踏上滩涂"
 TEX_on_the_beach_desc:0 "我们的敌人终将会为美国士兵踏上其滩头时的雄姿而感到恐惧，为此，我们必须磨炼自身的能力，让其无愧于我们庞大的力量投射范围。"
 TEX_working_with_allies:0 "与盟友携手合作"
 TEX_working_with_allies_desc:0 "我们应该允许自己的盟国和“敌人的敌人”，自由运用我国的专业知识。假若他们的斗争可以更顺利些，我们离成功也能更进一步。"
 TEX_american_century:0 "美利坚世纪"
 TEX_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 TEX_fortress_america:0 "孤立信条"
 TEX_fortress_america_desc:0 "美国方才刚在地狱里走了一遭，现在还没精力参与外部的纷争。眼下必须放眼祖国各地，维护国内秩序，做好在敌国来袭时守卫边境高墙的准备。"
 TEX_man_the_walls_desc:0 "我国国防政策的第一步，就是守护好御敌的高墙。若有人吃了熊心豹子胆挑战我们，那它定将被美国的强大实力吓破胆。"
 TEX_business_of_neutrality:0 "务实贸易"
 TEX_business_of_neutrality_desc:0 "维持中立政策的好处就是敌人少、贸易伙伴多。假若美国有意成为真正的世界强国，就必须依靠强劲的美元。"
 TEX_look_inward:0 "美国优先"
 TEX_look_inward_desc:0 "美国再也无需顾虑动荡与内战的威胁。眼下必须放眼国内，处理必要的内政问题，而非紧盯着那些不属于美国人的地方。"
 TEX_leap_forward:0 "美利坚的跃进"
 TEX_leap_forward_desc:0 "成果既已巩固，前进方向亦已明确，美国可以团结一致、遥遥领先于世界迈入下一纪元了。"
 TEX_peace_at_last:0 "我们一代人的和平"
 TEX_peace_at_last_desc:0 "我们的努力终见成效，美国也明白过来，真正的和平唯有通过实力与牺牲。"
 TEX_Devers_plan1:0 "德弗斯改革计划"
 TEX_Devers_plan1_desc:0 "得到政府同意后，德弗斯将军开始重组军队，推动指令标准化。不久后，我军将能在与敌军的战斗中以最小的伤亡取得最大的效益。"
 TEX_Devers_plan2:0 "德弗斯改革计划"
 TEX_Devers_plan2_desc:0 "德弗斯军事改革计划的第一步是对因英雄举动而应得晋升和因浪费行为而应被降级的军官进行统计。这些军官将被召回首都，与我们的新供应商会面。"
 TEX_Devers_plan3:0 "德弗斯改革计划"
 TEX_Devers_plan3_desc:0 "德弗斯的第二步是评估遍布全国的要塞和武器库存。需要维修或被认为太危险的设施将被拆除和回收。"
 TEX_Devers_plan4:0 "德弗斯改革计划"
 TEX_Devers_plan4_desc:0 "军官得到激励，武器得到储藏，现在是时候让德弗斯围绕国家战略安排战斗序列了。这可能会让喜欢滥用职权进行冒险行动的将军们感到失望，但这是种进步。"
 TEX_Devers_plan5:0 "德弗斯改革计划"
 TEX_Devers_plan5_desc:0 "随着德弗斯改革的完成，我军如今站在军事战术和组织的前沿，随着后勤团的扩大和最新武器的发展，我们将能无所畏惧地面对任何威胁，无论敌军多么人多势众。"
 TEX_american_auto_industry:0 "美国汽车工业"
 TEX_american_auto_industry_desc:0 "美国汽车工业正以极大的热情协助我们的战争，并仍在开发应对新近毁坏道路的方法。"
 TEX_american_auto_industry2:0 "美国汽车工业"
 TEX_american_auto_industry2_desc:0 "虽然道路仍被毁坏，但多亏汽车制造商，我们仍能在保证车辆完好如新的情况下抵达目的地。"
 TEX_weapons_manufacturers_idea:0 "武器制造商"
 TEX_weapons_manufacturers_idea_desc:0 "于陆地上与敌军短兵相接的需求意味着我们需要发展一系列能适应各类战场环境的枪支。"
 TEX_increased_military_spending:0 "增加军费开支"
 TEX_increased_military_spending_desc:0 "在我们伟大国家的持续斗争中，国家预算得到额外的重视。"
 TEX_Weyland_reform_plan1:0 "帕森斯空军改革计划"
 TEX_Weyland_reform_plan1_desc:0 "帕森斯计划的第一步是评估空陆军将领之间合作的程度。那些协力共事者应得到奖赏。"
 TEX_Weyland_reform_plan2:0 "帕森斯空军改革计划"
 TEX_Weyland_reform_plan2_desc:0 "帕森斯计划的第二步是建立通讯和信息网络以便进行侦察和近距离空中支援，使陆军们能了解空中援助提供给他们的新可能性。"
 TEX_ACTS:0 "陆军航空兵战术学校"
 TEX_ACTS_desc:0 "一座训练新时代美国飞行员的机场拔地而起。"
 TEX_airborne_experiments:0 "空降先锋"
 TEX_airborne_experiments_desc:0 "在空战的新时代，专业化飞行显然仍有其意义。如果我们想要征服笼罩着天空的工业巨头，就必须用训练飞行员采取最新的回避空战的方式。"
 TEX_pendergast_chads:0 "汤姆老大站上顶点"
 TEX_king_of_kansas_city:0 "堪萨斯城之王"
 TEX_king_of_kansas_city_desc:0 "托马斯·约瑟夫·彭德格斯特在其漫长而腐败丛生的一生中获得过许多称号，但没有一个比得上他“堪萨斯城之王”那么贴切。彭德格斯特是民主党的一员，他性格强硬，从无悔意，靠着自己的政治机器为霸一方。彭德格斯特和他的朋友乔·香农、卡司·韦尔奇以及亨利·弗朗西斯·麦克尔罗伊一道，不择手段地让他自己和其庞大的爱尔兰裔家族赚得盆满钵满，当然他那群收受了一堆贿赂的走狗们也是如此。彭德格斯特不仅只是四处敛财，密苏里州和联盟国其它部分也逐渐被他那肥胖而富得流油的大手紧紧攥在手中。"
 TEX_kansas_city_aint_big_enough:0 "小城难容两大佛"
 TEX_kansas_city_aint_big_enough_desc:0 "彭德格斯特在这个被称为联盟国的小型舞台上最大的竞争对手是朗派联盟。必须通过一切必要手段将这些对王鱼忠心耿耿的人置于其应有的位置。通过合法和各类隐秘渠道，我们将把朗派从所有可能的权力机构赶走，取而代之的则是我们自己效忠者，利用贿赂和勒索以及我方更为自由的政策来说服所有能够说服的人加入民主党，这当然是为了所有美国人的利益——尤其是彭德格斯特。"
 TEX_utilizing_connections_across_america:0 "高堂之友"
 TEX_utilizing_connections_across_america_desc:0 "彭德格斯特也许只是堪萨斯城的国王，但他在支离破碎的美国各地的高位都有重要的朋友，从纽约市的坦慕尼大厅老板和迪克西的棉花之王到太平洋国和新英格兰的沿海商业精英。通过拉拢这些关系并呼吁他们回报往日的恩情，彭德格斯特将在整个燃烧的合众国中建立一个由忠臣，线人和盟友组成的网络，帮助我们重新整合美国丧失的土地。"
 TEX_swaying_philantropists:0 "接触平民"
 TEX_swaying_philantropists_desc:0 "在政治场合，彭德格斯特一直都在试着打造一个“亲民形象”。有人叫他媒体宠儿，也有人斥之为媒体妓女。彭德格斯特频繁进行各种吸睛活动，以获取民众信任，让他看起来更有人情味。不仅如此，彭德格斯特还为患病公民支付医疗账单，为流浪汉们提供临时工作岗位，还在堪萨斯城为穷苦大众举办各种假日晚餐会。彭德格斯特可谓是出尽良策，他还要把这些善举在全国范围内推行，来哄骗全联盟国人民，并将联盟国大权渐渐收入囊中。堪萨斯城的著名慈善家威廉·沃克尔也被彭德格斯特收入麾下，沃克尔的公共福利委员会将会成为彭德格斯特新民粹政策之喉舌。有了沃克尔清廉形象的加持，我们必不可能失败！"
 TEX_providing_quote_jobs:0 "提供“工作”"
 TEX_providing_quote_jobs_desc:0 "由于其“平易近人”的性格，彭德格斯特一直向穷人或有需要的人提供工作，或是终身的，或是临时的，并通过这种方式提高他的公众支持率和大众吸引力。为了在争取全国人民群众的同时，也为重建而努力，彭德格斯特决定在全国范围内推行这套体制，为数百万人提供就业机会，以此博得公众的支持。"
 TEX_compassion_for_the_poor:0 "基督济贫"
 TEX_compassion_for_the_poor_desc:0 "彭德格斯特是一名虔诚的天主教徒，至少他在公众面前是这样示人的。彭德格斯特继续进行着援助穷人的善举。通过为无知无识的辛劳大众们建设私营庇护所和食物赈济处，并让彭德格斯特在这些地方露面的时候让广播和电视媒体来报导，我们将借基督之光来援助穷苦大众，并让彭德格斯特的政治机器因此受益。"
 TEX_pendergast_stamp:0 "彭德格斯特印花"
 TEX_pendergast_stamp_desc:0 "彭德格斯特邮票是一种商贸邮票，彭德格斯特所有的公司和附属子公司生产的货物上都有这种邮票之身影。从预拌混凝土公司到富达银行，堪萨斯城规模最大盈利最为丰厚的公司都在使用彭德格斯特邮票，这也意味着这些公司的利润有一部分直接分流进彭德格斯特和其朋党的腰包里面。彭德格斯特一直都梦想着能够实现全面经济霸权，他想继续活在如帝王般奢华的条件里。因此，彭德格斯特会将他的邮票扩散到联盟国内的各个角落中去——从造船业到建造业，再到资源钻探乃至最为简单的商业活动，都会贴上彭德格斯特邮票。彭德格斯特将会慢慢但稳定地收购各行各业的公司，如果行业内没有中意公司的话，那他就会建立自己的公司。彭德格斯特的最终目标是从美利坚国内的各种销售购买行为中收获利润，这是为了他自己的利益着想，为了政治机器着想，也是为了全体美利坚人民的利益着想的。"
 TEX_liberal_policies:0 "民主党“自由化”"
 TEX_liberal_policies_desc:0 "虽然民主党在少数派别和特定阵营外从未成为所谓的自由主义堡垒，但这并不妨碍彭德格斯特为国家设想一个全新的自由主义现实。通过一些自由主义政策，如支持民权和其他平等主义政策，我们将促使美国大众，特别是少数族裔，涌向我们一方。我们将赢得黑人的选票，墨西哥裔的选票，以及任何其他可以利用我方威权主义和严重腐败的伪自由主义得到的选票，并通过杜鲁门和威廉·J·汤普金斯博士这样的新盟友来铺设这条崭新的前进之路。新的民主党将宣扬自由，宽容，高度城市化与种族多样化——成为非裔美国人和大多数新移民群体的政治家园。我们的权力基础来自中西部的爱尔兰天主教徒，他们与黑人、移民、工人和刚好够多的“南方”白人联合起来，共同支持着一个帮助普通人生活而不是评判他们做了什么的政府愿景，我们也将建立一个全新且更好的政党。尽管这是一种冷酷的实用主义且与意识形态无关，我们的竞争对手却仍称之为“堪萨斯城式社会主义”，但我们知道真相，因为我们会为所有人提供相对的公正、廉价酒水与公共工程，无论其阶级、信仰或肤色如何，只要他们直接投票给民主党，我们就能重塑民主党的含义。"
 TEX_an_open_alliance:0 "公开勾结黑恶势力"
 TEX_an_open_alliance_desc:0 "与现代美国历史上其他的政治机器和有权有势的政治领袖不同，彭德格斯特因公开与顽固的罪犯和臭名昭著的无赖（如约翰·拉西和卡尔·“科奇”·西维拉）结盟从而名声大噪。彭德格斯特与非法赌博集团、酒类走私商、有组织犯罪等有着极深的关系，尽管他在职业生涯中树敌众多，但他的安全则通过更为“危险”的盟友得以保障。有了黑市和美国肮脏底层站在我们一方，我们将主宰美国社会的正反两面。"
 TEX_wonders_of_gambling:0 "散播赌瘾"
 TEX_wonders_of_gambling_desc:0 "彭德格斯特一直是一个众所周知的赌徒，他经常毫不顾忌地光顾堪萨斯城和附近其他大都市的赌桌与老虎机。而彭德格斯特最近意识到，利用赌博经济可能会改善国家的财政状况，于是开始着手在全美范围内推行赌场合法化。就连堪萨斯城的社区小店也已经在店面橱窗内公开摆放赌博机，全国其他地区也会很快跟进。通过向大众“传播”赌瘾，我们的经济将在一定程度上由贪污和“赌运”刺激而迅速反弹。"
 TEX_freeing_booze:0 "不再禁酒"
 TEX_freeing_booze_desc:0 "T·J·彭德格斯特一直在口头上直言不讳地反对任何禁酒令法案，甚至在禁酒令于国家层面失败后，还依旧不遗余力地在自己所在的州内反对禁酒令——他明白，禁酒制度中蕴藏着丰厚的利润。本着“良心”，彭德格斯特在公开场合谴责一切关于禁酒的想法，却反其道而行之地在全国范围内推行禁酒令。在这一令人窒息的体制下，彭德格斯特和他的打手们将控制全美的“非法”酒业，确保一切来自酒类销售、创造和消费的利润都直接流入彭德格斯特和政治机器的口袋。为了进一步推进这一计划，彭德格斯特还出资在全国各地新建、改造酿酒厂，比如他自己的T·J·彭德格斯特酒类批发公司、阿特拉斯饮料公司和城市饮料公司，同时鼓励小企业主开设新的酒吧或其他赌博、饮酒和犯罪的肮脏窝点。用彭德格斯特自己的美元，我们将把美国变成一个供所有人享受的“矛盾”酗酒天堂，而人们对酒精与堕落的无尽渴望将进一步推动经济，再度充实彭德格斯特早已鼓鼓囊囊的口袋。"
 TEX_paving_brush_creek:0 "“铺过”刷溪"
 TEX_paving_brush_creek_desc:0 "堪萨斯市中心的“刷溪”是彭德格斯特第一次大规模市政建设的地点，为了翻新他心爱的家乡和封地，他花费了大约4000万美元。在那段时间里，甚至有传言称彭德格斯特把他的政治对手们扔进了铺满水泥的“溪流”之中，并将他们彻底尘封，以此铸就了他新近成功的基石。与这些市政工程相呼应，我们将在全国范围内掀起一波新的建设浪潮，建设新的城市中心和民用基础设施，以帮助国家的运作，如果我们的政敌想要再次沉入“水泥溪流”之中，那就如其所愿吧。"
 TEX_police_forces_in_grip:0 "束缚警察"
 TEX_police_forces_in_grip_desc:0 "虽然堪萨斯城警察部队以及奥马哈和威奇托等城市的警察部队早已被彭德格斯特收入囊中，但全美其他警察的情况则大不相同。通过在全国范围内集体贿赂和勒索美国警察，彭德格斯特应确保联邦的每一个警官都忠于他和他的钱包，而不是其他想法和事物，并将其作为自己的俱乐部以进一步征服国家。"
 TEX_connections_with_other_bosses:0 "老大们的生意"
 TEX_connections_with_other_bosses_desc:0 "我们在纽约市的爱尔兰裔主导的政治机器坦慕尼协会也表示有兴趣与彭德格斯特机器合作，尤其是在卡西米尔·韦尔奇叛变后——与北方有着联系的堪萨斯城“小坦慕尼”政治机器领袖。而来自迪克西的一个类似组织——E·H·克伦普的社会机器，也表达了他们与我方合作的兴趣，为了全美国的利益，也为了老板们的权益。我们有着共同的想法，即腐败民主、与犯罪集团合作、征服自由民主，拥护华而不实的基督教保守民粹主义、我们接纳少数族裔以攫取他们的选票、以及我们对爱尔兰裔主导地位的支持，所有这一切都不谋而合，这些坦慕尼猛虎和克伦普派将成为完美的盟友，并将极大地帮助我们征服并整合东北部与迪克西地区。"
 TEX_complex_alliance:0 "锻造复合联盟"
 TEX_complex_alliance_desc:0 "彭德格斯特需要黑人的选票以及其他少数族裔的支持，才能稳坐其“老大”之位，而这些少数族裔，尤其是那些仍生活在深南部和联邦其他糟糕地区的人，同样需要彭德格斯特来缓解自身的困境。通过重复自己在堪萨斯城和密苏里州使用的策略，同时利用闻名遐迩且广受爱戴的黑人斗争人物，如威廉·J·汤普金斯博士的帮助，彭德格斯特将调整他的政策与意识形态，以更包容、更文明、更善解人意的方式帮助我们国家的少数民族，作为回报，我们将彻底确保他们的选票和我们自身的权力席位。"
 TEX_crush_democrat_factionalism:0 "粉碎民主党宗派主义"
 TEX_crush_democrat_factionalism_desc:0 "民主党长久以来一直受着派系主义的荼毒。从历史上的“白银民主党人”与“黄金民主党人”到激进民主党，再到当代的旧民主党和南北民主党人分裂，安德鲁·杰克逊所创立的党派从未真正团结统一。为了使彭德格斯特对联盟国政治机器的控制更加紧密，我们将努力使曾今分裂的民主党变得更正规化和去派系化——而且我们会用尽所能想到的一切手段，只为创造一个团结统一的执政阵线，让彭德格斯特能更好的操纵整个美利坚。譬如说……彭德格斯特可以利用他过去经常使用的裙带关系策略，当时他用自己的家人、朋友和盟友填补了堪萨斯城及其周边城市的每一个官僚岗位。渐渐地，整个民主党都将被彭德加斯特完全控制。"
 TEX_business_empire:0 "我们自己的商业帝国"
 TEX_business_empire_desc:0 "彭德格斯特一直梦想着成为一个庞大商业帝国的君主，现在整个美国都已经被他所掌控，彭德格斯特终于有机会着手实现这一梦想。通过在美国各地建立直接效忠于他及其亲信的新企业，并利用珍贵的资源和利润丰厚的收入源，彭德格斯特将会建立他设想中的商业帝国，包括采石、保险、工业机械制造、煤矿、餐馆、酒店、建筑、银行、酒类等众多企业，在这个过程中，他设法挤出了所有地方性竞争，使他和他的政治机器比其他任何企业都要富有，以造福于整个美国。"
 TEX_the_senator_from_pendergast:0 "启用彭德格斯特的参议员"
 TEX_the_senator_from_pendergast_desc:0 "“彭德格斯特的参议员”是彭德格斯特的政治盟友哈里·杜鲁门的外号，此人也代表着彭德格斯特政治机器友善的一面。既然杜鲁门的政治名声依然清廉，由他来做这个腐败与恩惠之国的领导人就再合适不过了。温和而受人信赖的杜鲁门将“领导”国家，为彭德格斯特分散火力，而堪萨斯城之王则可从暗影之中，随心所欲地运营国家。"
 TEX_emperor_of_missouri:0 "坚定站在密苏里皇帝一边"
 TEX_emperor_of_missouri_desc:0 "虽然彭德格斯特的名誉肯定遭到了玷污，但它的确从一开始就不是清白的。去他妈的傻逼大会和狗屎细节。堪萨斯城国王将成为密苏里帝国的皇帝和联盟国真正无可置疑的领导人。所有人都将臣服在他腐败的辉煌面前，并宣誓效忠于他那无尽的财富，免得他们成为通往繁荣和进步的道路上的铺路砖！"
 TEX_living_like_true_king:0 "如真正的国王般生活"
 TEX_living_like_true_king_desc:0 "在彭德格斯特的政治机器之下，他的盟友和亲信们过着国王般的生活。彭德格斯特和他的铁杆盟友杜鲁门，就像当代的国王和君主一样，一切需求都得以满足，积累的财富也越来越多。这样一个根植于腐败、贿赂、赌博、走私、伪民粹主义、内幕商业交易和伪民政府的基础上的新美国正在崛起。这可能不是建国者们的理想，但这却是彭德格斯特的理想，现在让美国为新王米达斯的统治欢欣鼓舞吧。"
 TEX_the_longist_legacy:0 "下一步"
 TEX_the_longist_legacy_desc:0 "休伊·朗已逝！现在，我们必须迅速采取行动，以巩固我们的权力。而要做到这一点，我们必须战胜我们的对手，并赢得致力于实现休伊事业的同志们的身心。尽管未来扑朔迷离，但美国已要求我们提枪上马。"
 TEX_christian_renewal:0 "振兴基督教"
 TEX_christian_renewal_desc:0 "我们的国家已误入歧途，因为它忘了本，忘了让它成为世界强国的基督教价值观。如果美国人能再次坚定信念，我们便可将让国家走上繁荣之路。更妙的是，史密斯相信这个计划正是休伊想要的，他不这样做是因为他被顾问们带歪了。"
 TEX_support_for_families:0 "扶助家庭"
 TEX_support_for_families_desc:0 "家庭也许是世界历史上最重要的社会单位。然而在美国，家庭却被多年的战争、饥荒和苦难所困扰着。如果我们想要愈合近几十年来造成的创伤，并完成休伊·朗开创的事业，我们就必须扶持美国家庭，让他们兴旺发达。我们必须治愈我们千疮百孔的人民，并创造新一代美国人！"
 TEX_protect_farmers:0 "保护农民"
 TEX_protect_farmers_desc:0 "农民们在大萧条时期受害最深，因此许多农民在内战期间选择与休伊·朗同甘共苦。现在，他们的忠诚应当得到回报。为了做到这一点，我们必须确保他们的农产品价格与土地都受到保护，无论他们是在路易斯安那州、爱荷华州，还是任何其他州都一视同仁，美国农民将有理由再次感到自豪。"
 TEX_new_american_morality:0 "美利坚道德观"
 TEX_new_american_morality_desc:0 "虽然我们曾数次失败，但我国民众已产生了一种新的道德感。家庭再次茁壮成长，工人们为国家尽心尽力，甚至我们的孩子们也为建立一个基于基督教道德的美国献出了一份力量，近些年来的腐败已一扫而空。"
 TEX_friends_in_high_places:0 "高堂之友"
 TEX_friends_in_high_places_desc:0 "为了巩固我们的权力，我们必须拥有站在我们这边的盟友。在高层寻找朋友不是一件易事，但通过贿赂、操纵和一些传统手艺，我们就能找到我们需要的支持者，让我们拥有超过对手的追随者。"
 TEX_loyalty_in_labor:0 "工人忠诚"
 TEX_loyalty_in_labor_desc:0 "一个国家拥有一个强大的工会是很重要的——毕竟，那是工人发声的唯一渠道。另一方面，如果他们想在我们的经济中得到突出地位的话，那么他们就必须忠于我们。而有了工会的支持，我们就可以遏制那些傲慢的企业与商人，并一劳永逸地确保资本和劳工之间的公平关系。"
 TEX_subsidize_unions:0 "补贴工会"
 TEX_subsidize_unions_desc:0 "工会是工人权利的典范，我们不能忘却这一事实。任何认为自己是美国工人的朋友的人都必须支持工会。当然，我们不会支持那些为联合工团或其他势力而战的工会，但我们不会放弃扶持与资助那些一再证明了自己忠诚的工会。有了强大的工会，我国的工人们将像应有的那样发出强有力的声音。"
 TEX_defend_private_property:0 "保护私有财产"
 TEX_defend_private_property_desc:0 "私有财产神圣不可侵犯是我国的立国理念之一。所有公民都有权在自己的财产范围内享有隐私权，虽然我们扩大了政府的规模，但这并不意味着我们就应去践踏这一基本权利。与之相反，我们应确保“人人皆国王”，特别是在他们自己的土地上。"
 TEX_arcadian_america:0 "美式田园牧歌"
 TEX_arcadian_america_desc:0 "这个国家的自然美景，以及我们的建国原则与休伊的辉煌计划，必须成为我们开创的下一个阶段的美国生活的指导。我们将成为全世界羡慕的对象，就像我们命中注定的那样，而我们所要做的就是遵循开国元勋和休伊·朗的明智指引。"
 TEX_social_justice:0 "社会公义"
 TEX_social_justice_desc:0 "查尔斯·库格林领导着一场民众运动，希望实现他的“社会公义”计划。对库格林来说，这是个爱国者的计划，致力于争取工人的权利，改革货币，并驱逐货币投机者。他不是朗的亲密伙伴，但如果他的计划能赢得足够的支持的话，这也无关紧要。"
 TEX_national_sermons:0 "全国布道"
 TEX_national_sermons_desc:0 "通过他从前的电台演讲，查尔斯·库格林获得了大量的追随者。而既然他掌权了，他就必须采取一些措施，让人们相信政府会为他们争取权利。库格林本人决心通过广播，就政策和其他问题发表演讲，尽管这些演讲更像是在布道，而非政治演说，但无论如何，这都将使我们的事业更受欢迎。"
 TEX_the_christian_front:0 "基督教阵线"
 TEX_the_christian_front_desc:0 "基督教阵线是一个由与查尔斯·库格林结盟的保守派朗派组成的团体。我们必须发展这个组织，在库格林的报纸，《社会公义》的帮助下，也许它能真正地茁壮成长。虽然有些人在私下说，比起帮助普通人，这些人更爱去察觉并针对敌人，但基督教阵线的发展对我们来说还是至关重要的。"
 TEX_pursue_the_financiers:0 "打倒金融巨鳄"
 TEX_pursue_the_financiers_desc:0 "虽然他们试图掩盖他们的欺诈行径，但我们明白谁是真正的敌人。银行家和投机者长久以来一直欺骗着我们的人民，现在正是我们齐心协力，让他们永世不得翻身的时候了。"
 TEX_break_financial_slavery:0 "推翻金融奴役"
 TEX_break_financial_slavery_desc:0 "长久以来，我们一直是那些经济管理者的奴隶。美国人民的经济不能被少数几个非国民叛徒所拥有。现在银行和国民经济正处于我们的掌控之下，我们有能力打破我们长期以来遭受的金融奴役，以此，我们将可以创造一个真正自由的美国。"
 TEX_remonetize_silver:0 "重启银本位"
 TEX_remonetize_silver_desc:0 "银本位总比金本位好。威廉·詹宁斯·布赖恩明白这一点，休伊·朗明白这一点，我们也明白。库格林经济改革的第一部分是将白银重新货币化，从而增加货币供应量。这一政策有点风险，但如果我们希望创造一个充满活力的新经济，我们至少该试试。"
 TEX_wider_nationalization:0 "广泛国有化"
 TEX_wider_nationalization_desc:0 "休伊·朗在产业国有化上迈的步子还不够大——我们要敢于闯荡。我们将对银行、石油、铁路等产业进行国有化，以此，我们将可以确保我们的政府永远不会缺少照顾人民所需的资源。虽然一些叛国者会抗议这种所谓的“对自由的侵犯”，但我们会提醒他们，他们无法代表美国人民，我们才是人民的真正代表。"
 TEX_tax_relief_for_poor:0 "穷人享减税"
 TEX_tax_relief_for_poor_desc:0 "尽管我们对较为富裕的公民有些苛刻，但我们不能让穷人们在日常生活之中因苛捐杂税走向绝望甚至是死亡。相反，我们将为这些受压迫的人们提供税收减免政策，希望这能让他们积极消费并参与到经济之中。"
 TEX_wealth_conscription:0 "资本遭课税"
 TEX_wealth_conscription_desc:0 "在危机时期，财富和兵员一样都是征召对象。对于那些在我们国家里囤积财富与资源的人，库格林只是让他们在巨大的财富之中拿出一部分作为爱国主义的体现。毕竟，如果我们真的都是美国人的话，我们就必须一视同仁地做出贡献。而如果富人想逃避战争，他们必须在其他方面出点血。"
 TEX_simplified_government:0 "简化政府"
 TEX_simplified_government_desc:0 "简单的政府是运转的最好的。而最近所谓的、臃肿腐败的美国政府正是一个反例。我们要简政放权，简化政府，而这是任何民有、民享、民治的政府都应该做到的。"
 TEX_liberty_of_conscience:0 "信仰自由"
 TEX_liberty_of_conscience_desc:0 "每个人都有信仰任何宗教或从事任何职业的自由，这也正是我国历史最悠久的一种自由。我们绝不能践踏这些权利，只有人们的这些权利得到切实保护，我们才能在美国确立真正的信仰自由。"
 TEX_an_unlikely_successor:0 "未曾设想的继业者"
 TEX_an_unlikely_successor_desc:0 "尽管困难重重，我们现在还是控制了这个国家，不过我们还得修修补补。我们必须做出艰难的选择——我们会走休伊·朗为我们制定的道路吗？如果要的话，我们能在美国人民的眼中同他一样成功吗？只有时间才能证明一切，但就目前而言，我们至少必须营造出一种稳定的假象。"
 TEX_solidify_position:0 "坚定立场"
 TEX_solidify_position_desc:0 "既然我们现已确保了休伊继承人的地位，是时候去稳定国家了。虽然休伊是个“帝王式总统”，但我们还没有这样的合法性，因此，我们将以各种方式去创造它。"
 TEX_make_voting_machines_sing:0 "开动选票机器"
 TEX_make_voting_machines_sing_desc:0 "在我国，计票的人才决定一切。而通过控制这些群体，我们将能在未来几十年占据主导地位，我们的政策与计划将镌刻于美国人民的心灵之中。"
 TEX_honor_huey_long:0 "纪念休伊·朗"
 TEX_honor_huey_long_desc:0 "我们崭新国家的伟大奠基人休伊·朗，已不再是国家的舵手了。现在我们已继承了他的位置，我们应该去尊重他，去继承他的遗产。更重要的是，纪念休伊·朗将有助于我们巩固我们作为朗主义运动继承人的地位，并以此获得我们人民的大力支持。"
 TEX_media_propaganda:0 "媒体宣传"
 TEX_media_propaganda_desc:0 "在旧美国，报社是个至关重要的机构，他们有能力随心所欲地结束政客的政治生涯。而如果我们想稳固权力，我们就必须首先获得他们的支持。我们得两手抓——那些支持我们的人将被迫支持政府的计划，而那些不支持我们的人将发现自己身处在悲惨世界之中。"
 TEX_veterans_bill:0 "退伍军人法案"
 TEX_veterans_bill_desc:0 "为联盟国而战的退伍军人必须受人尊敬，特别因为对军队保持控制对巩固我们的权力是如此重要。通过具有里程碑意义的“退伍军人法案”，我们可以保证军队人员在未来忠诚于我们，并以此向人们表明，我们对那些为我们的事业抛头颅洒热血的人无限尊重。"
 TEX_finish_industrialists:0 "消灭产业大亨"
 TEX_finish_industrialists_desc:0 "曾经统治这个国家的肆无忌惮的产业大亨们正准备跑路，我们必须消灭他们。他们将不再能对美国施加不正当的影响——而在他们的余生之内，他们再也无法控制美国。我们将扫除他们，这些产业大亨，无论其忠诚与否，都将不再有能力控制我们的经济，所有美国人的生活也将变得更好。"
 TEX_eliminate_poverty:0 "消灭贫困"
 TEX_eliminate_poverty_desc:0 "贫穷对美国人来说就像一场瘟疫。对于我们来说，它如此无情地存在着，还总是悄悄潜入我们最贫穷的公民的生活之中。不会再有这种情况了，我们将采取一系列谨慎的措施，确保惊人的财富不平等现象得以解决，我们最终将根除贫困。"
 TEX_democratic_transition:0 "民主转型"
 TEX_democratic_transition_desc:0 "休伊·朗已逝，我们必须接手他在改革国家和建立健全的民主制度上做的工作。在我们实现这一目标的路上，我们还要明确我们将如何领导至上党与如何推行政策。不过，无论如何，所有美国人都可以放心了，因为他们的政府现在将为他们工作。"
 TEX_honest_government:0 "诚信政府"
 TEX_honest_government_desc:0 "让我国陷入内战的最大因素之一就是人们对腐败的政府缺乏信任。而人们是对的——那个政府毕竟只是在利用他们，他们只服务于一小撮利益集团。现在，我们将确保政府能够对它应该服务的人负责——那就是人民。"
 TEX_rural_schools:0 "乡村学校"
 TEX_rural_schools_desc:0 "休伊·朗计划在新学校上投入更多资金，尤其是在战后急需学校的农村地区。无论如何，现在我们掌权了，我们必须实现这个计划。我们将在国内的农村地区建立更好的小学甚至大学，我们以此可以更好地教育下一代，并帮助这些地区重归正轨。"
 TEX_chicago_plan:0 "芝加哥计划"
 TEX_chicago_plan_desc:0 "芝加哥计划最初是由芝加哥大学起草的，并得到了至上党政治家布朗森·卡廷的支持。该计划旨在使银行将其货币和信贷职能分开，并建立起全储备银行体系。在实践之中，这将使银行有足够的资金来偿还贷款。此外，正如欧文·费雪所说，它将“国有化货币，但不国有化银行业”。"
 TEX_new_american_family:0 "新美国，新家庭"
 TEX_new_american_family_desc:0 "如果我们想让美国走向繁荣，我们就必须去扶持我们的家庭。在过去的二十年里，美国家庭遭受了毁灭性的打击，如果我们能再次让他们发展壮大，我们将会让人口快速成长——这会让我们拥有充足的人力储备。"
 TEX_currency_reform:0 "货币改革"
 TEX_currency_reform_desc:0 "休伊·朗明白，如果要使货币系统有效而公平地运行，就需要对其进行某种形式的改革。我们将在这个问题上采取行动，确保不是无能的银行在管理经济，而是我们自己，并且也许我们会采用银元而不是金元。"
 TEX_roll_back_censorship:0 "弱化审查制度"
 TEX_roll_back_censorship_desc:0 "在内战期间，休伊·朗对媒体和其他机构制定了某些审查政策，这在当时是可以理解的，但现在这些政策必须取消。为了让报纸站在我们这一边，我们应该向他们表明，他们将得到足够的空间，以让他们能按照自己认为合适的方式开展业务。随着新闻自由的恢复，我们离创建新美国又近了一步。"
 TEX_reconcile_the_church:0 "与教会和解"
 TEX_reconcile_the_church_desc:0 "众所周知，尽管像杰拉尔德·K·史密斯和查尔斯·库格林这样的人尽了最大的努力。休伊·朗与教会的关系还是并不算好。我们不应该希望得到教会直接的支持，但我们至少应该能让他们同情我们，这样，我们将表明我们确实是好美国人，只希望让一些表面上的道德重归美国。"
 TEX_uncle_earl:0 "厄尔叔叔"
 TEX_uncle_earl_desc:0 "厄尔·朗，传说中休伊·朗疏远的兄弟，已掌握国家权力，继承了他兄弟的位置，并延续着一些人所说的“朗王朝”。尽管厄尔与休伊有血缘关系，但他还有很多事情需要证明，即使他确实证明了自己是休伊的称职继任者，他也必须做出个选择——他是要去追随休伊的脚步，还是去实现自己对国家的愿景？"
 TEX_fulfill_his_vision:0 "实现前人理想"
 TEX_fulfill_his_vision_desc:0 "厄尔·朗已决定他必须继续他哥哥，那个他经常赞成的人的工作，尽管他们彼此之间常常争吵不休。在建立被一些人称为“朗王朝”的过程中，厄尔向忧心忡忡的旁观者保证，他希望能够完成休伊的计划，人民希望他统治多久他就统治多久，不过人们还不懂他到底能统治多久。"
 TEX_end_civil_service:0 "废止公务员制度"
 TEX_end_civil_service_desc:0 "公务员制度使厄尔·朗感觉很棘手。如果他不能资助负责投票的政客，他有怎么能实现他的目标呢？取而代之的是，我们将鼓励政治赞助，其主要由厄尔·朗提供但也由其盟友提供，这样一来，我们就能更好地控制全国的政客。虽然有些人谴责这是公然的专制行为，但厄尔对这些批评不予理会，并指出这是政客们应得的报应。"
 TEX_distract_public:0 "引开大众注意"
 TEX_distract_public_desc:0 "公众们是变幻无常的，如果我们想要他们的支持，就得让他们分心。就像罗马人所说的，通过“面包和马戏”，我们将确保我们的人民沉迷于娱乐与其他事情，这样我们就拥有了实行计划的自由。此外，通过鼓舞人心的演说，厄尔·朗本人将把人民掌握在自己手中，这也必将提高他的声望。"
 TEX_secure_the_long_machine:0 "确保朗的政治机器"
 TEX_secure_the_long_machine_desc:0 "早在内战之前，休伊·朗的政治机器就从未向厄尔打开过，这是厄尔所记得的最痛苦的事情。但现在他掌权了，我们必须为自己夺取政治机器，以确保我们能在需要的时候巩固权力，并确保没有其他人能染指它。从前他一直在等待机会，而厄尔·朗终于能够在朗家族及其强大的政治机器中取得应有的地位了。"
 TEX_plenty_of_snap_in_my_garters:0 "长袖善舞"
 TEX_plenty_of_snap_in_my_garters_desc:0 "因为厄尔名声不显，他也更喜欢与社会下层人士打成一片，而非像休伊从前那样兼顾所有阶层，有人认为厄尔不配继承休伊·朗的遗产。有人甚至还说，厄尔缺乏他哥哥的远见与抱负。但对这些质疑的声音，厄尔·朗只是轻轻回答到：“我肚子里还有一堆主意呢！”"
 TEX_charm_the_people:0 "吸引公众"
 TEX_charm_the_people_desc:0 "聆听厄尔·朗的演讲比起一件事件来说，更像是难忘的经历。成千上万的人前来聆听他丰富多彩的演讲和他的幽默笑话，尽管他在演讲中不是很注重阐明政策，但这并不妨碍人们纷纷前来听讲。而通过周游全国与和他热爱的群众打成一片，厄尔将赢得人心，让人民支持他的事业。"
 TEX_a_new_direction:0 "新方向"
 TEX_a_new_direction_desc:0 "厄尔·朗并没有选择亦步亦趋地追随其兄的脚步，而是决定推行自己的改革计划。尽管他的计划在许多方面与其兄的设想相似，但厄尔着重指出，他的改革计划会在种族问题上采取更为坚定的立场，并将致力于接触美国的劳动人民。毕竟，没有比这更好捞到选票的办法了吧？"
 TEX_equal_teachers_pay:0 "教师工资平等化"
 TEX_equal_teachers_pay_desc:0 "近些年来，美国的教师们的待遇一直不佳，也从未获得应有的薪水。谁会放着这些选票不管呢？厄尔·朗已认识到给教师涨工资的必要性，并着手于确保在薪资发放上没有性别歧视。经验丰富的老教师当然会得到更多的薪水，但随着其他因素造成的歧视基本上消失殆尽，我国的家庭整体面貌上将更好些。"
 TEX_tactical_realism:0 "战术性现实主义"
 TEX_tactical_realism_desc:0 "为了让美国人民站在我们这一边，我们必须对经济进行一些微调。通过这种潜移默化的方式，没有什么人会对这种看上去有必要的改革有什么不满，尽管这些改革在日积月累中会变成对经济的全面变革。我们将一步一步地，正像休伊·朗所做的那样，摧毁旧体制，并创造一个崭新、更好的经济体制。"
 TEX_outflank_capitalism:0 "智胜资本主义"
 TEX_outflank_capitalism_desc:0 "资本主义仍然受到大多数美国人的欢迎，为了打碎它，我们就应该让它的缺陷公之于众。而为了这个目的，我们将改造老工厂，把经济的一部分接管过来，并以生产为用途的基础来经营，而非以旧的逐利制度来经营。这是个考验，但我们相信人民将反响良好。"
 TEX_lure_them_in:0 "循循善诱"
 TEX_lure_them_in_desc:0 "我们并非对美国人民的关切之声充耳不闻。虽然他们关心着经济，但他们也易受爱国宣传煽动，而如果我们希望让他们继续支持我们，便必须利用这一事实。我们将会让我们的运动套上美国特色的外衣，并煽动民族主义情绪，我们可以以此加快我们的改革，并防止其他敌对势力为一己之利和我们打同样的牌。"
 TEX_socialist_efficiency:0 "社会主义效率"
 TEX_socialist_efficiency_desc:0 "现在我们已经开始了经济改革，是时候向美国人民展示我们设想中更有效的社会主义制度了。我们将缓慢但坚定地让经济向社会主义转型，并将主要工业国有化，以此孤立那些老顽固产业巨头们。"
 TEX_abolish_speculation:0 "废除投机"
 TEX_abolish_speculation_desc:0 "曾经在美国各地的银行和金融机构中发生的破坏性的投机行为必不能再发生。我们不能允许银行玩弄人民的钱——相反，他们应该专注于他们的其他职责，就像他们一直应该做的那样。"
 TEX_solidify_public_ownership:0 "巩固公有制"
 TEX_solidify_public_ownership_desc:0 "我们必须保证国家对诸如水、电、铁路等公共事业的所有权。通过完成休伊开创的公有化事业，我们将创建一个不由利润驱动的国家。而由此为基，我们将继续在建设一个真正的、为使用而生产的社会的道路上迈步前进。"
 TEX_true_democracy:0 "真正的民主"
 TEX_true_democracy_desc:0 "现在，我们已经创建了一个不仅在政治上民主，而且在工作场所和整体经济上都民主的国家，我们终于可以自豪地说，我们生活在一个民主的国家。它不是老旧的、资本主义的虚假民主，而是一个所有人都可以参与其中的全面民主制度。"
 TEX_death_of_carroll:0 "卡罗尔之死"
 TEX_death_of_carroll_desc:0 "悲剧发生了！瓜达卢佩圣母帝国敬爱的摄政王菲利普·卡罗尔现在与上帝同在了。当帝国为失去领袖而哀悼时，神美联盟内部酝酿着一场继任危机。由于没有定下明确的继任者，联盟正忙于决定谁将继承摄政王的遗产。"
 TEX_holy_leauge_congress:0 "第二届神圣美利坚联盟国会"
 TEX_holy_leauge_congress_desc:0 "为了防止联盟内部的权力斗争引发整个帝国的秩序崩溃，联盟领导层召集第二届神圣美利坚联盟大会，旨在确定帝国的未来将被如何塑造。"
 TEX_reform_victory:0 "改革派获胜"
 TEX_reform_victory_desc:0 "改革派的胜利给帝国带来了巨大的冲击！现在，帝国的未来将取决于改革派，由他们来决定最终塑造帝国的将是阿尔·史密斯的资本主义联邦，还是多萝西·戴的无政府社会主义。"
 TEX_hardliner_victory:0 "宗教裁判所的新美国"
 TEX_hardliner_victory_desc:0 "强硬派占据了国家的主导地位，现在帝国祈求着宽恕，对未来充满恐惧。只有上帝知道是伦纳德·费尼的狂热裁判所还是马丁·卡莫迪的哥伦布骑士在今后发号施令，以及他们是否会听到人民的祈求。"
 TEX_Feeney_the_radical:0 "沾满鲜血的激进之士"
 TEX_Feeney_the_radical_desc:0 "伦纳德·费尼是一个为了基督的宏愿而不择手段的人，他发誓要净化异端和罪恶的帝国。由于他对帝国和教会的激进观点，帝国的公民必须小心招致宗教裁判所的愤怒，因为苛烈的刑罚必将随之而来。"
 TEX_Carmody_the_knight:0 "守望骑士"
 TEX_Carmody_the_knight_desc:0 "马丁·卡莫迪，一个笼罩在神秘和阴谋中的人物。随着他的哥伦布骑士团最终掌握权力，似乎没有什么能阻挡这位至高骑士实现他的新封建主义梦想。但帝国还不知道能在他的统治下获得什么。卡莫迪似乎想栖身于黑暗中，即使他统领的秘密警察已被曝光天下。"
 TEX_extra_ecclesiam_nulla_salus:0 "教会之外无救恩"
 TEX_extra_ecclesiam_nulla_salus_desc:0 "费尼净化帝国的旅途仍在继续。新摄政王加倍支持“教会之外无救恩”的政策，宗教裁判所甚至对那些不愿完全献身于神圣的天主教会的人施加刀剑，因为这群人已经注定要去地狱，再苟活于现世也没有任何意义。"
 TEX_american_feudalism:0 "美利坚封建主义"
 TEX_american_feudalism_desc:0 "卡莫迪和他的哥伦布骑士团总是满怀深情地回顾中世纪。自那个时代结束以来，世界是如何陷入庸俗、罪恶和异端，这让他们鄙视不已。因此，他们决心在新世界重振旧封建。等待在前方的，将是一个更神圣的时代，一个更神圣的体系，一个更神圣的帝国。"
 TEX_strengthen_the_inquisition:0 "增强裁判所？"
 TEX_strengthen_the_inquisition_desc:0 "圣母帝国正处于被罪恶和异端邪说所压垮的危险之中。谢天谢地，我们的领导人知道必须做什么。虽然裁判所已经做了大量的工作，但仍旧迫切需要扩大和支持。政府必须赋予宗教裁判所更大的权力，为了铲除所有威胁我们神圣帝国的罪人。"
 TEX_Blessed_are_they_who_hunger_after_righteousness:0 "渴望正义的人有福了"
 TEX_Blessed_are_they_who_hunger_after_righteousness_desc:0 "终于，瓜达卢佩圣母帝国变得名副其实。强硬派净化了这个国家，他们对于自己的使命从不妥协，即使在巨大的异议和诱惑面前也推行到底。这份使命终于有了回报，因为上帝和圣母对这个净化的帝国微笑着。渴望正义的人有福了，因为他们必得饱足。"
 TEX_Coughlin_the_populist:0 "爱国民粹主义者"
 TEX_Coughlin_the_populist_desc:0 "广播神父查尔斯·库格林在权力斗争中拔得头筹，成为了帝国的新摄政王。库格林因其著名的、时而会引起争议的广播节目而首次登上全国舞台，他现在将自己的目标和政策集中在重返联盟国民粹主义上。看起来，新任摄政王却是要向旧处而去。"
 TEX_Sheen_the_beloved_disciple:0 "最受宠爱的门徒"
 TEX_Sheen_the_beloved_disciple_desc:0 "试图玷污卡罗尔的遗产的鬣狗们终于被打败了。正如已故摄政王所希望的那样，富尔顿·申将接替自己的导师来领导瓜达卢佩圣母帝国。卡罗尔最亲密和“最受宠爱的门徒”现在寻求在上帝和圣母的指引下维护并发扬挚友与导师的意愿。"
 TEX_reviving_america_first:0 "复兴至上党"
 TEX_reviving_america_first_desc:0 "尽管在新火药阴谋中，库格林最终站在了摄政王卡罗尔和神圣美利坚联盟一边，但他对至上党的感情并没有消失。他相信朗的民粹主义在遭到腐化之前本质上是正义的，新摄政王将重启这条路线，这次它将真正为上帝的人民服务。"
 TEX_if_it_aint_broke:0 "朝向神圣美利坚"
 TEX_if_it_aint_broke_desc:0 "摄政王申和忠诚派明白帝国面临的问题并非来源于遵循前任摄政王卡罗尔的路线。相反，一切都是由那些胆敢偏离他的指引的恶棍们造成的。不管怎样，帝国不能违背卡罗尔的意志；相反，应该去拥抱。延续卡罗尔的政策将给我们带来繁荣，最重要的，是保持我们帝国的神圣性。"
 TEX_test_of_faith:0 "信仰测试？"
 TEX_test_of_faith_desc:0 "尽管帝国以难以想象的速度转变为一个天主教信仰占多数的国家，但我们的领导层仍然对民众的虔诚抱有怀疑。或许我们应该测试一下公民，看看他们是否真的献身于使徒彼得所建立的神圣天主教和使徒教会？"
 TEX_Blessed_are_the_pure_in_heart:0 "清心的人有福了"
 TEX_Blessed_are_the_pure_in_heart_desc:0 "温和派的胜利确保了已故摄政王的远见得以延续。瓜达卢佩圣母帝国已经成为一个名副其实的圣母之国，因为温和派正是以其圣洁又纯净的形象来塑造国家。"
 TEX_Smith_the_realist:0 "虔诚的现实主义者"
 TEX_Smith_the_realist_desc:0 "阿尔弗雷德·史密斯州长获胜后，开始领导目前执政的改革派。他承诺政治上实行全面改革的联邦制度，经济上推行自由放任的“天主教资本主义”，并且实现宪政的回归。史密斯以其团结各方、提出切实可行的办法的能力而广受民众欢迎。新的瓜达卢佩圣母帝国将既是神圣的，又是自由的。"
 TEX_Day_the_worker:0 "乐天的工人"
 TEX_Day_the_worker_desc:0 "多萝西·戴也许是帝国中最具争议的人物，然而，她战胜了所有的政治对手，成为了新任摄政王。戴对社会主义的信仰和她对天主教的信仰一样虔诚，她将尽一切努力把帝国改造成一个为上帝子民服务的理想国度。她的瓜达卢佩圣母帝国，将真的只有基督才配得上成为国王！"
 TEX_a_better_society:0 "更加美好的社会"
 TEX_a_better_society_desc:0 "摄政王戴已经将瓜达卢佩圣母帝国完全变成了一个更为美好的国度。通过接纳分配主义、妇女平权和权力下放，戴的帝国堪称真正的天主教帝国，一个建立在奉献与仁善上的社会，而这正是基督所梦寐以求的。"
 TEX_a_fair_society:0 "公平的社会"
 TEX_a_fair_society_desc:0 "摄政王史密斯的改革取得了成果，现在瓜达卢佩圣母帝国比以前更加自由和公平，而且同样神圣。天主教资本主义制度已经被证明是一次巨大的成功，正如期待已久的联邦制的重新引入。人民因史密斯和他的改革派帝国而欢欣鼓舞。帝国不仅赢得了圣母称号，而且现在它已经真正再次证明了自己不仅是一个天主教国家，更是彰显了美国精神，查尔斯·卡罗尔会感到自豪的。"
 TEX_restore_the_parties:0 "重建多党制？"
 TEX_restore_the_parties_desc:0 "随着帝国创伤的不断愈合和改革的推行，许多人敦促我们恢复多党制，当然，神圣美利坚联盟仍然会独占大权，其他的政党实质上是我们的傀儡。但如果完成，这项改革可能会是所有改革里最激进的，许多政府人士仍对允许虔信上帝以外的政党持保留意见。"
 TEX_blessed_are_the_persecuted:0 "温顺的人有福了"
 TEX_blessed_are_the_persecuted_desc:0 "大业终成。尽管各种势力反对我们，我们最终还是重建了圣母帝国。确实，我们是天主教国家，而这意味着的是一个自由、公正、道德高尚的基督般的国家。我们的改革真正体现了天主教精神，人民为此欢欣鼓舞，上帝想必也会微笑。温顺的人有福了，因为他们必承受地土。"
 TEX_moderate_victory:0 "平稳航行"
 TEX_moderate_victory_desc:0 "温和派获胜了，虽然很明显，他们不会动摇帝国大船的航路，并愿意维护前摄政王的愿景，但仍然必须决定是库格林的民粹主义者，还是申的忠诚派来推动帝国前进。"
 TEX_back_from_the_brink:0 "远离崩溃"
 TEX_back_from_the_brink_desc:0 "对瓜达卢佩圣母帝国来说，这是黑暗的一天。摄政会议已经陷入了完全的混乱和僵局，天上的摄政王与圣母想必会无比羞愧愤懑地俯瞰这一切。我们必须找到一个解决办法，把帝国从灭亡的边缘拉回来……"
 TEX_kennedy_the_savior:0 "救世骑士"
 TEX_kennedy_the_savior_desc:0 "令人惊讶的转折发生了，约瑟夫·肯尼迪和他的国民骑士登上了权力的宝座！肯尼迪的政变结束了可能会摧毁帝国的犹豫不决和官僚作风的威胁，他非常适合地被宣布为国家的“救世主”，因为他是唯一一个能够维护帝国神圣性之人。"
 TEX_god_and_guns:0 "先军国家"
 TEX_god_and_guns_desc:0 "肯尼迪和国民骑士已经证明，军队是保持帝国神圣公正的唯一工具。军队是我们唯一防备罪恶和异端的手段，因此，它将得到优待和重视，成为国家事务的中心。瓜达卢佩圣母帝国将成为一个先军国家，用枪炮来守护上帝的恩典。"
 TEX_restoring_order:0 "重建秩序"
 TEX_restoring_order_desc:0 "虽然领导权危机已经解决了，但帝国境内广阔的土地仍在熊熊燃烧。摄政会议之外，帝国的大部分领土处于分裂或崩溃的边缘。如果我们要真正巩固统治，维护这个国家的神圣，我们就必须恢复秩序。但问题是，能用承诺来安抚吗，还是必须得血流成河？"
 TEX_enternal_regency:0 "摄政会议"
 TEX_enternal_regency_desc:0 "在摄政会议陷入僵局的情况下，一个新的解决方案被找到了：永恒的摄政。如果没有一个派系能赢得大权，那么就没有一个派系有资格统治。取而代之的是，摄政会议将无限期地持续下去，摄政王之位永远空悬。"
 TEX_compromise_goverance:0 "妥协政府"
 TEX_compromise_goverance_desc:0 "当然，帝国必须有政策，否则它与上帝的交流将会断绝。因此，会有一个折衷办法：摄政会议继续作为立法机构工作，而他们新制定的“救国法令”将成为最终的法律，其中会将各派系学说的一部分合而为一。"
 TEX_blessed_are_the_peacemakers:0 "使人和睦的人有福了"
 TEX_blessed_are_the_peacemakers_desc:0 "尽管摄政王的死和随后的会议引发了混乱，但混乱已经结束，新的统治者已经就位，以维护圣母帝国的神圣。帝国再度迎来了和谐与和平，上帝想必会高兴的。使人和睦的人有福了，因为他们必称为神的儿子。"
 TEX_coops_plan:0 "合作计划"
 TEX_coops_plan_desc:0 "农村合作社对至上党的左右两派来说都是一个颇受欢迎的理念，它允许农民们彼此分享资源。我们将会派遣专家依据地区组织供应与市场间的合作，以便在委员会向国家信用合作社登记农民之前，提高国家的农业产量和经济实力。" 
 TEX_democratic_safeguards:0 "民主保障"
 TEX_democratic_safeguards_desc:0 "总统拥有更多的权力并不代表他就会成为另一个麦克阿瑟。而为了保障民主，政府的透明度是绝对必要的，我们将许可记者更容易接触国会，并赋予司法部门更大的权力。我们要捍卫美利坚的民主！"
 TEX_infrastructure_effort:0 "基建投入"
 TEX_infrastructure_effort_desc:0 "科技正在迅速改变我们的世界。汽车正成为许多公民的主要交通工具，我们必须对基础设施做出相应的调整。让我们修建道路和桥梁来满足新的交通需求，并建立国家高速公路系统。"
 TEX_recognize_philantrophers:0 "褒扬慈善家"
 TEX_recognize_philantrophers_desc:0 "尽管许多富人反对朗财富再分配的努力，但即使在这资本主义世界中，也有一些至少愿意保持中立态度的富人。我们会和他们交涉，讨论向慈善机构捐款的事，他们能得到政府的荣誉奖章作为奖励，这些捐款事迹也能为其他人树立榜样。"
 TEX_Grand_Army_of_the_Republic:0 "共和国的伟大军队"
 TEX_Grand_Army_of_the_Republic_desc:0 "共和国的伟大军队曾是早在第一次美国内战时就建立的退伍军人组织，由于当时的退伍军人已相继走到人生尽头，这个本来极具影响力的组织已经接近于消失。然而，我们可以组织第二次美国内战的老兵加入该组织，在复兴这个组织，为我们提供新的政治盟友的同时，老兵们也能获得一个团结统一，互帮互助，便于代表他们利益的团体。"
 TEX_dependent_and_disability_act:0 "依靠与残疾法案"
 TEX_dependent_and_disability_act_desc:0 "共和国的伟大军队正在说服我们通过一项基于过去的内战法案的《依靠与残疾法案》，该法案将为残疾的退伍军人和已故退伍军人的家室提供国家救济金援助。对于最为依赖的人群来说，这项再投资至关重要，能有效防止他们陷入难以生存的贫困。"
 TEX_department_of_public_safety:0 "公共安全部"
 TEX_department_of_public_safety_desc:0 "公共安全部将不仅能提供更多政府工作岗位，而且还能帮助政府监管工业，促进消费品生产的安全，给予符合减税政策的企业优待。有了公共安全部，我们就能尽最大努力减少工伤事故。"
 TEX_work_programs:0 "退伍老兵就业项目"
 TEX_work_programs_desc:0 "仍有许多退伍军人失业，部分原因是他们缺乏工作机会。我们的新工作计划将对退伍军人进行再培训，帮助他们能够更好地适应就业市场，同时也为就业市场提供补助。光荣的老兵们应该充满尊严地生活，绝不能贫困潦倒。"
 TEX_state_grants:0 "确保各州"
 TEX_state_grants_desc:0 "有时，地方官员才知道如何最好地花费分配的资源。国家的拨款将委托给忠于我们的州长和州政府来决定如何重建他们认为最适合的产业，以及最需要支持的对象。"
 TEX_populist_propaganda:0 "民粹征兵运动"
 TEX_militia_empowerment:0 "十字架与旗帜"
 TEX_militia_empowerment_desc:0 "内战期间的至上党民兵战术中有很多东西值得我们学习。伏击战，防御战，侵扰补给线，以及用好战又无情的精神鼓舞我们的军队，将为我们赢得胜利。"
 TEX_draft_for_america:0 "为美国而参军"
 TEX_draft_for_america_desc:0 "我们已经招募了许多投身基督教民粹主义事业的青年，但有些不符合入伍资格的被刷掉了。我们需要降低募军标准，方便全体人民都能参加我们的斗争，充分运用青年人口的优势。"
 TEX_our_coast_guard:0 "海岸警卫队"
 TEX_our_coast_guard_desc:0 "重建海岸警卫队有助于为海上贸易通道提供保障，不法分子将在海面上遭到拦截，陷入危难的人也能得到及时施救。"
 TEX_americanist_doctrine:0 "美洲路线"
 TEX_americanist_doctrine_desc:0 "像过去那样维持孤立毫无益处可言，而我们也绝不会甘当其它势力面前的二等国家。在外交政策上，我们追求，且只追求本国的最大利益。不过，若是符合我们的利益，我们也绝不羞于组建联盟。"
 TEX_popular_monroeism:0 "检讨门罗主义"
 TEX_popular_monroeism_desc:0 "在第二次内战期间，美国不得不基本上放弃了门罗主义规定的义务。面对新的威胁，拉丁美洲国家要么紧闭国门，要么就相互寻求保护。现在，我们应该拥护新门罗主义，这次，我们的动机不是野心，而是兄弟情谊。因为我们都是美洲人，永远不会再遭受殖民者的蹂躏！"
 TEX_populist_alliance:0 "民粹联盟"
 TEX_populist_alliance_desc:0 "过去的美国剥削美洲国家的方式已经被我们抛弃了！现在，我们要用外交攻势，经济倡议以及军事保护来赢得美洲国家的心，我们不会再是仅仅从美洲国家那里窃取资产的巨鳄，而要让彼此的国民都能从中受益。为此，我们将特别组建“民粹联盟”。"
 TEX_internationale_non_agression_pact:0 "与第三国际互不侵犯"
 TEX_internationale_non_agression_pact_desc:0 "虽然我们的理念几乎处处和第三国际相异，但我们却有许多共同的目标。我们对虎视眈眈的协约国抱有危机感，而第三国际也绝不可能和殖民主义者做朋友。是时候用外交和第三国际建立更密切的关系，并向他们保证彼此之间的互不侵犯。"
 TEX_ideological_neutrality:0 "意识形态中立"
 TEX_ideological_neutrality_desc:0 "在我们看来，当今世上司空见惯的由意识形态驱动的冲突实在是毫无价值。已经在内战中流尽了的血，汗与泪，难道还要再为了一样的理由再流一次吗？这究竟有什么意义？我们已经看够了这种冲突，我们不会再支持任何一方而导致民众的紧张情绪了。"
 TEX_oppose_american_syndicalism:0 "镇压美洲工团主义"
 TEX_oppose_american_syndicalism_desc:0 "于我们来说，工团主义还是太过极端。我们得确保在新世界里红色思想不会变得司空见惯。首先得把目标对准美洲的工团主义国家，我们会亲切建议他们要么改变政治路线，要么，就等着我们的干预吧。"
 TEX_align_nationalists:0 "结盟民族主义者"
 TEX_align_nationalists_desc:0 "我们应该与那些认同我们民族主义信念的国家结盟。我们不必就哪个国家更为优异达成一致，但我们可以就防止任何形式的外来入侵或支配进入西半球达成一致。与民族主义政权结盟可能会给我们带来我们所需要的东西——为了让自由新世界的梦想一劳永逸地实现。"
 TEX_denounce_oligarchs:0 "谴责不义战争"
 TEX_denounce_oligarchs_desc:0 "石油大亨和军工企业恳求我们在国外发动新的战争。当然了，因为这对他们有利，可对我们却毫无利处。我们不会用年轻一代的鲜血来为公司买单。战争是场骗局！"
 TEX_investigate_war_lobbyists:0 "调查战争煽动者"
 TEX_investigate_war_lobbyists_desc:0 "每天都有成群结队的战争说客嗡嗡地骚扰我们。与其放任这些人逍遥法外，不如来一次调查？毕竟，这些人大部分在战争中是站在麦克阿瑟一边的，谁知道将来他们会不会又改弦易辙呢？他们没一个可信的，把这些叛徒通通赶走吧。"
 TEX_break_war_mongerers:0 "阻止美洲战争贩"
 TEX_break_war_mongerers_desc:0 "我们受够了加拿大干涉美洲内务了。以前我们把英国人赶出过美国，但如果要致力于新门罗主义，我们必须走得更远。我们下一步该怎么处理加拿大呢？"
 TEX_contain_hostile_leftism:0 "击溃左翼扩张主义者"
 TEX_contain_hostile_leftism_desc:0 "当左翼们走偏了路，我们可不能害怕帮它走回正轨。激进好战的左翼政权现在淹没了和平主义政权，并大大加剧了世界紧张局势。必须采取行动阻止他们，以免为时已晚。"
 TEX_end_carles:0 "解决阿根廷的混乱"
 TEX_end_carles_desc:0 "阿根廷向来是拉美一霸，是制衡巴西的天选之国。不过很可惜，它早已跌落下了统一的拉普拉塔时代的神坛，泯然于众人。19、20世纪接连不断的叛乱、战争与强人专政让阿根廷人民苦不堪言，而现在正是美国重申其和平守护者的职责，为这片混乱的土地带去秩序的时候了。"
 TEX_break_militarists:0 "消灭军国主义政权"
 TEX_break_militarists_desc:0 "在我们的后院，不允许极端民族主义政权的存在，这些政权只会给新世界的人民造成无尽的流血和苦难。如果我们能够终结他们的侵略，我们就能够促进美洲地区更大的合作，成为在世界舞台上抵御外来影响的堡垒……"
 TEX_friendship_in_the_americas:0 "美洲是美洲人的美洲"
 TEX_friendship_in_the_americas_desc:0 "这一刻终于到了：美洲自由了！五百年前，欧洲人来到我们的海岸，开始了几个世纪的殖民统治。现在，我们可以自信地说，那个时代到此终结。我国将与西半球的各个国家积极结盟互助，如此我们就能阻止欧洲人，乃至任何外来国家再次在我们头上作威作福。"
 TEX_mutual_trade:0 "互惠贸易"
 TEX_mutual_trade_desc:0 "我们并不想主宰拉丁美洲。我们希望与美洲同胞们建立真正的兄弟情谊。因此，我们应该寻求有利于双方的贸易协定。即使不去压榨和剥削，我们的人民也可以从外国的产品与资源中获益。"
 TEX_research_agreement:0 "研究倡议"
 TEX_research_agreement_desc:0 "在新盟友及其资源的帮助下，我们可以追求新兴技术进步。有了高新技术的帮助，我们就可以在面对欧洲竞争对手中占据优势，成为世界上最发达先进的国家！"
 TEX_Northern_boundary_defense:0 "北疆防备"
 TEX_Northern_boundary_defense_desc:0 "国防的第一步必须是确保我们的北方边界得到良好的保卫。明明我国的内战和加拿大与其他协约国成员毫无关系，他们却悍然出手干预。怎能确定他们不会再次出手干预我们的事？得为他们可能采取的任何行动，甚至是全面战争做好准备。"
 TEX_naval_prominence:0 "海军霸权"
 TEX_naval_prominence_desc:0 "虽然我们在内战期间控制着美国大平原，但我们也不能忘记德克萨斯的港口。卷入战争之时，与大海相接既是福也是祸，但既然我们成了内战的赢家，现在就能确保一支庞大的海军。我们再也不会被海上封锁了，而且总有一天，我们会封锁回去。"
 TEX_defensive_doctrine:0 "防御型战略"
 TEX_defensive_doctrine_desc:0 "永远不要忘记1812年之耻，欧洲侵略者把我们的首都一把火夷为平地。如果想防止这种情况再次发生，就得确保我们能够不惜一切代价保卫国家。再也不会有侵略者能踏上我们的首都，这群胆大妄为的敌人将会被我们悉数击退。"
 TEX_aid_paraguay:0 "偏爱巴拉圭"
 TEX_aid_paraguay_desc:0 "说来也奇怪，巴拉圭居然是我们在内战期间最亲密的盟友之一。作为回报，我们会在他们最需要的时候帮助他们。巴拉圭确实被更大、更强的邻国所包围，但我们不会忌讳，我们会尽一切努力确保他们保持独立。"
 TEX_treaty_of_tord:0 "美洲女皇"
 TEX_treaty_of_tord_desc:0 "和平的缔造者、正义的拥护者有福了，他们受造物主赋权，注定要通过篡夺颓废的美国来恢复上帝的律法，现在，随着美国的再次统一，敌人的被迫悔改，美利坚帝国为了消除欧洲的傲慢自大给自由世界带来的腐败而降临世间，在造物主微笑的祝福下，神圣美利坚联盟将横穿美洲大陆，向被遗忘已久的人民传授主的福音。"
 TEX_holy_manifest_destiny:0 "新托尔德西里亚斯条约"
 TEX_holy_manifest_destiny_desc:0 "正是伊比利亚半岛给美洲带来了富裕繁荣与帝国主义的交响曲，布拉干萨、波旁和哈布斯堡的后裔试图让耶稣基督的光芒和智慧照亮每个不够开化的土著居民；现在，既然我国和葡萄牙达成的神圣同盟其愿景一致，而烦人的西班牙则分心于欧洲大陆的事务中，南美洲终于可以再度统一了——然后再次分裂。巴西的统治权将归还给葡萄牙，其余的领土则由新生葡萄牙帝国和我国瓜分。"
 TEX_crusade_canada:0 "对盎撒人发起十字军"
 TEX_crusade_canada_desc:0 "在北美大陆，我们还剩一场牌局要打，面对一个早在美国诞生之前就一直在摧残美洲的牌手：温莎家族，大英帝国的保皇派残留，曾经统治半个世界的帝国霸主。大英帝国崩溃后，它治下的世界也和我们一样，摆脱了异端圣公会的枷锁，现在温莎家族留下的只有一个浮夸放纵的花花公子和他那些平庸无能的兄弟姐妹，都挤在圣劳伦斯河畔冰封王座的生锈王冠之下瑟瑟发抖。我们已经准备好了为他们奏响毁灭的交响曲，以及那之后的镇魂歌。"
 TEX_crusade_mexico:0 "收复新西班牙"
 TEX_crusade_mexico_desc:0 "在殖民统治时代，西班牙帝国的形象遭到了诡辩言论的歪曲，殖民地居民自然不可避免地会像我们一样，把以前的主子推入大海。西蒙·玻利瓦尔的大哥伦比亚军队反对西班牙人的举措乃是不义，因为它引发了南美洲持久的不稳定，共产主义、自由主义和军国主义都在安第斯山脉以北肆虐；从波哥大到加拉加斯，我们将对此进行补救。"
 TEX_guadalupian_empire:0 "瓜达卢佩圣母帝国"
 TEX_guadalupian_empire_desc:0 "随着在前大哥伦比亚建立起了滩头阵地，我们现在将可以把目光投向南美洲的南部和东部，投向何塞·德·圣马丁的拉普拉塔之梦的支点和葡萄牙霸权王冠上的伟大宝石。亚马逊河的巨人试图模仿他们以前的主子，对国民进行道德教育，但结果似乎不尽如人意。无数的民族主义和工团主义战争持续地使安第斯山脉以南的地区遭受毁灭性的破坏，这再也不能被容忍了。"
 TEX_pax_philipica:0 "菲利普治下的和平"
 TEX_pax_philipica_desc:0 "同一片土地，同一种信仰，同一个民族，同一位上帝。这就是美利坚宗教的信条；无分性别，无分种族，学者与圣贤，官员与职员，乃至于出租车司机与牧师，都团结在我们唯一且神圣的目标，即耶稣基督的生涯所传授给我们的真理：“凡人生而平等，秉造物者之赐，拥诸无可转让之权利，包含生命权、自由权、与追寻幸福之权”。"

TEX_righteous_nation:0 "合法的总统"
 TEX_industries_no_support:0 "缺乏工业支持"
 TEX_industries_support:0 "工业援助"
 TEX_no_silver_legion:0 "无银色军团支持"
 TEX_prohibition_bill:0 "禁酒令与退伍军人法案"
 TEX_political_instability_1:0 "千疮百孔的美利坚"
 TEX_political_instability_1_desc:0 "§R战火虽息，仇恨仍存。§!\n\n在我国诸多地区，尤其是在我们无力管辖之地，政府机关已完全被军队取代。顽固的准军事组织分子乃至于普通罪犯则盘踞在那些军队未曾驻扎的地区，占领当局似乎仅能通过当场处决来维护秩序。这残酷无情的日子让许多人无法回归到正常生活中去，国家也因之陷入了停顿。在采取坚决果断的措施将之终结前，无休止的暴力都会一直困扰着我们。"
 TEX_political_instability_2:0 "千疮百孔的美利坚"
 TEX_political_instability_2_desc:0 "§R战火已息，枪炮沉寂。§!\n\n若提及修复第二次美国内战造成的破坏与痛苦的首要措施，制止军警的过激行为，保证政府领导人在努力缓解人民痛苦上表现得积极主动等无疑是关键一招。虽然散兵游勇与罪犯恶徒仍为患一方，战时司法的现状对大多数美国人来说依旧未变，但案件数量正逐渐减少。倘若假以时日，这一切都将成为遥远的不快记忆，但就现在而言，我们还有许多工作要做。"
 TEX_political_instability_3:0 "修修补补"
 TEX_political_instability_3_desc:0 "§Y千里之行，始于足下。§!\n\n当国内大部分地区仍因严酷镇压与强行占领苦不堪言时，稳定已悄然出现。大多数躲藏在深山老林中的顽固分子要么一命呜呼，要么不知去向，城市内犯罪仍旧是个老大难问题，但比起以前，街道毕竟还是安全多了。结束临时军管、恢复常态化治理尚需一些时日，但如今的生活确实轻松了些。"
 TEX_political_instability_4:0 "修修补补"
 TEX_political_instability_4_desc:0 "§Y千里之行，国人同往。§!\n\n拘留所不再人满为患，警察又回到了街头维持秩序，美国人民开始认可，也因之接受了时任政府对国家的统治。临时军管已经结束，为加速整合进程，部分城镇拥有了更大的地方自治权。我们虽不能指望人们对此有饱满的热情，但至少现在是能安心地过日子了。"
 TEX_political_instability_5:0 "希望掠过天边"
 TEX_political_instability_5_desc:0 "§G国殇夜漫，晓色熹微。§!\n\n国旗正猎猎飘扬在市政厅与军事基地上空，而这正是政府的努力结出硕果的最显著标志。民众正以各种方式重拾对美利坚的信心，我们日夜操劳的政府官员们可以稍作歇息了。还有很多事等着我们去做，但如今人民已敢于梦想，将这一切抛诸脑后也只是时间问题。"
 TEX_political_instability_6:0 "希望掠过天边"
 TEX_political_instability_6_desc:0 "§G国殇夜漫，天光渐晓。§!\n\n虽然对许多人来说，第二次美国内战的记忆永远不会消逝，因为它承载着太多太多，但就现在来说，这也只是一段旧日往事罢了。国家已从梦魇中重振旗鼓，野蛮不复存在，真正的政府建立了起来，统治着从太平洋到大西洋间的这片辽阔土地。美国正准备走向未来，人民自当因此感谢他们的领袖。当然，更好的日子还在后头呢。"
 TEX_national_recovery_idea1:0 "遍地丘墟的美利坚"
 TEX_national_recovery_idea1_desc:0 "自建国以来，美国的经济形式从未如此糟糕过。国内的大部分地区受饥荒威胁，水电等基本服务对大多数美国人来说也成了奢侈品。医院依旧人满为患，更不必说停尸房了。倘若政府还想要重拾希望，令美国回到繁荣之路上，那它必须迅速行动，引导国家走出危机。\n\n§R万劫不复，势难挽回。§!"
 TEX_national_recovery_idea2:0 "遍地丘墟的美利坚"
 TEX_national_recovery_idea2_desc:0 "紧急救助正在准备之中，并已被运往最需要帮助的州，埋葬逝者的漫长过程基本已处理完毕。话虽如此，这个国家的许多人仍在忍饥挨饿，也只能通过蜡烛而非电灯来提供照明。但在我国公职人员的脑海中，均有一个共同的坚定信念：我们一定可以战胜这场彻底摧毁了我国的末日危机，每个人都明白事态的严重性，每个人也都明白自己该做些什么。\n\n§R历史不会轻饶自大之人。§!"
 TEX_national_recovery_idea3:0 "从终末之中重建"
 TEX_national_recovery_idea3_desc:0 "紧急救助解决了全国大部分地区的棘手难题，我们也得以紧锣密鼓地修复各地的基础设施，求生之路开始变得不那么坎坷了。昔日破败不堪的道路恢复了使用，大多数城市居民的日常生活中又恢复了供电供水。总而言之，这个国家的大部分人如今至少可以勉力求存，而不必像从前那般艰难求生。\n\n§Y流血终止。§!"
 TEX_national_recovery_idea4:0 "从终末之中重建"
 TEX_national_recovery_idea4_desc:0 "在基本生活必需品的供给得到保障后，美国人民也正稳步恢复生产，令整个国家重新步入正轨。我国公民要么回到了旧岗位上，要么借助政府援助获得了新工作，经济危机减缓的征兆已然在望。除各大城市外，诸多小城镇也得到了我国官员所承诺提供的援助。\n\n§Y重建之路愈发平坦。§!"
 TEX_national_recovery_idea5:0 "山巅之城再度闪耀"
 TEX_national_recovery_idea5_desc:0 "商品的生产率已逐渐回到内战前的水平，美国大众的生活水平也正稳步提高。内战留下的瓦砾与废墟得到了处理，被用于新建筑的建设或其他所需之处中，我们甚至终于有了出口物资的余力。对未来的信心日趋高涨，时间似乎确能抚平一切创伤。\n\n§G美国梦虽一度消逝，却亦有复生可能。§!"
