 TEX_texas_values_idea:0 "德克萨斯价值观"
 TEX_texas_values_idea_desc:0 "在德克萨斯，我们铭记着阿拉莫，缅怀着圣哈辛托的英雄，并时刻牢记着我们会如何为自由而战。现在，有一场为自由而战的全国性斗争，但这一次，我们的对手是安逸的政客和邪恶的革命者。我们现在的战斗同当时一样重要，必须尽一切努力确保我们在即将发生的冲突中取得成功。"
