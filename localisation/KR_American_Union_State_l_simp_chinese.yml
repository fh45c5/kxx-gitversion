 TEX_conversions:0 "推动改信"
 TEX_conversions_desc:0 "虽然迄今为止，我们为美国人民皈依天主教所做出的努力取得了不错的成果，但在联盟看来，事情进展得还不够快。为此，大量政府资源将从现在开始完全调动起来，一切只为让美国人皈依天主教。然而，并不是每个人都对此事持接受态度，为了避免宗教纷争，许多人已经开始逃离美国。"
