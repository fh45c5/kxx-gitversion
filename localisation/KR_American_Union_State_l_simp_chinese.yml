 TEX_Prosperity_Populism_idea:0 "永久繁荣之曙光"
 TEX_From_a_Militia_to_a_force:0 "从民兵到战斗队"
 TEX_From_a_Militia_to_a_force_desc:0 "随着内战爆发，我们的政府面临着一项艰巨任务——自第一次南北战争时期那种混乱且临时拼凑的征兵乱象以来，再未出现过如此局面。迄今为止，新联盟政府的成员们除了在“王鱼”麾下指挥过城市及半乡村民兵组织外，几乎没有任何大规模统率经验，仅有少数军官公开表态支持美国至上事业。\n\n所幸的是，联邦政府在中西部广阔地带（有人讽刺地称这片新领土为“高耸的中西部”）的权威彻底崩塌，促使多支国民警卫队、预备役及正规军部队主动向休伊·朗政府投诚。更重要的是，以特里·德拉梅萨·艾伦、刘易斯·伯韦尔·普勒和雅各布·L·德弗斯为首的一批经验丰富的将领，已肩负起将我们这支杂牌军锤炼成纪律严明之师的重任。"
 TEX_minister_smith:0 "史密斯部长的圣战"
 TEX_minister_smith_desc:0 "杰拉尔德·L·K·史密斯或许缺乏实战经验与正规军事教育，但纵观美国历次战争，许多杰出指挥官亦出身草莽。在我们反抗英国暴政的正义革命中，众多民兵领袖不过是铁匠、商贩之流，甚至不乏像“战斗牧师”詹姆斯·考德威尔这样的布道者。如今史密斯既能号令“一分钟人”部队，又通过演讲广播聚拢大批虔诚信众，俨然成为能将稚嫩新军锻造成钢铁雄师的潜在军事改革家。\n\n这位牧师主张举全国之力打造战争机器，以石油、兵员、枪炮为燃料，以精神意志为内核。通过战略资源国有化、社会总动员及对忠诚准军事组织的优先培养，史密斯坚信唯有总体战才能让联盟国碾碎一切顽抗之敌。"
 TEX_Terrible_Terry:0 "“恐怖特里”之勇气"
 TEX_Terrible_Terry_desc:0 "出身军人世家的新锐将星，老特里·德拉梅萨·艾伦，以极具侵略性的作战风格崭露头角。特里将军坚信：胜利之钥在于出其不意的夜袭战术、高效精准的战场侦察，以及锻造钢铁之躯的步兵精锐。\n\n尽管其天主教背景与“好斗”秉性令同僚将帅侧目，但麾下将士却对其推崇备至。若赋予“恐怖特里”更大的指挥权，我军进攻潜力必将得到极致释放。"
 TEX_Devers_Plan:0 "“微笑杰克”的合成兵种"
 TEX_Devers_Plan_desc:0 "若要论及投效我军的将领中才智最为卓绝者，非雅各布·劳克斯·德弗斯莫属。这位生于宾夕法尼亚的将军，童年时便因开朗乐观的性情获得“微笑杰克”的绰号，后相继毕业于西点军校与利文沃斯堡指挥参谋学院。\n\n虽以炮兵专业起家，至今他亦仍视炮兵为战争机器的重要组成，但迪弗斯将军游历欧洲诸国及观察世界大战的经验，使其成为“合成兵种”理论的坚定倡导者。他主张彻底革新过时的骑兵部队，代之以成建制的装甲作战单元。\n\n随着美军保守派势力尽数滞留联邦辖境或投奔宪政派，迪弗斯将军终可放手打造其梦寐以求的现代化机动部队。这支技术先进的铁骑劲旅，必将为围剿进犯美利坚腹地的诸多敌寇提供决定性侧翼打击力量。"
 TEX_Well_Regulated_Minutemen:0 "组织有序的一分钟人"
 TEX_Well_Regulated_Minutemen_desc:0 "若有人回溯我国历史上最神圣的文献，《美利坚合众国宪法》中的《权利法案》，必会注意到至关重要的第二修正案。尽管对此条款的解读众说纷纭，但其原始文本已明确宣告：“纪律严明之民兵乃自由邦国安全所必需，人民持有与携带武器之权利不可侵犯。”世人常忽视前半句，但在此危急存亡之秋，我们更需汲取开国先贤的智慧。\n\n“一分钟人”作为美利坚第一党麾下的军事力量，正是为保卫各州自由而组建的民兵组织。可叹的是，尽管他们怀揣赤诚投身伟业，其作战经验与能力却屡遭质疑，尤其在近期战事爆发后大规模志愿参军浪潮中。联邦国决不能再重蹈覆辙，因此对各路民兵的“严明纪律”之责，当交由我们身经百战的指挥官执掌。这支由散兵游勇组成的队伍，必将淬炼成配得上福吉谷精神传承的铁军。"
 TEX_Bunkers_Along_Bayou:0 "河湾要塞"
 TEX_Bunkers_Along_Bayou_desc:0 "“王鱼”休伊·朗的私人领地路易斯安那，在联盟国成立后迅速转型为政府中枢。尽管当地既有行政机构为政权运转提供了得天独厚的基础，但其毗邻新迪克西叛军前线的地理位置却令人忧心。\n\n为弥补这一缺陷，我们必须充分利用当地著名的沼泽湿地，利用这片错综复杂又危机四伏的天然屏障。通过设置检查站、建造临时工事和永久性混凝土掩体，我们将把这片潮湿之地打造成比任何战场都致命的死亡地带。\n\n更可善加利用的，是美国扩张时期与第一次内战遗留的数十座古老要塞。例如博恩湖畔的普罗克特堡，这座始建于十九世纪的军事堡垒又被称作博雷加尔城堡，得名于那位毁誉参半的传奇将领P·G·T·博雷加尔。他不仅在萨姆特堡打响了分裂的第一枪，后来还在家乡路易斯安那州成为进步事业的异见者。"
 TEX_Sail_From_Corpus_Christi:0 "自科珀斯克里斯蒂启航"
 TEX_Sail_From_Corpus_Christi_desc:0 "尽管我们的海上战略重心仍在新奥尔良地区，但若因此遗忘合众国最大州，得克萨斯及其适宜发展海军工业的绵长海岸线，实属不智。只需列举这个桀骜之州星罗棋布的港口：加尔维斯顿、休斯敦、德克萨斯城、科珀斯克里斯蒂等，便知此地战略价值。\n\n我们绝不容许这条宝贵海上动脉遭受敌对美舰封锁，更要提防墨西哥军队的陆路入侵。为此，总统已批准沿墨西哥湾扩建军民两用设施，以期多元化增强我们的海上力量。\n\n愿先辈土地上活动的法国私掠船传统指引我们征服暗潮：既有反抗殖民压迫的伟大解放者路易-米歇尔·奥里，亦有1812年战争协助安德鲁·杰克逊抵御英军的争议人物“墨湾之怖”让·拉菲特。"
 TEX_Conquering_the_Airwaves:0 "驾驭无线电波"
 TEX_Conquering_the_Airwaves_desc:0 "得益于米罗华和通用电气等公司的技术突破，扬声器、放大器及其供电系统的体积正逐年缩小。美利坚联盟国领袖休伊·朗对此类便携式广播系统可谓驾轻就熟，当年他乘着满载“王鱼”雄辩之声的广播车巡回各州竞选时，这套装备曾立下汗马功劳。随着军队大规模列装无线电与扩音设备，一个绝妙的战术机遇正浮出水面。\n\n几位颇具胆识的军官提出，休伊·朗的魅力本身就是件犀利武器。他们建议在战斗间隙将广播车开赴前线，用朗关于赦免的承诺与抵抗无谓的论述瓦解敌军士气。与此同时，我军广播站还能让这位领袖如临战地般对将士们发表演说，既传递激励，又抚慰人心。"
 TEX_Lakota_Code_Talkers:0 "拉科他密语者"
 TEX_Lakota_Code_Talkers_desc:0 "历史的讽刺展露无遗，就在几年前还被法律禁止学习本族文化、使用本族语言的族群，如今却将成为我们新生武装力量的重要支柱，只因那些几近湮灭的方言与濒临消亡的语种，正是构建强大情报体系的绝佳材料。数十年来，一直不乏苏族、克罗族与克里族等部落青年参军入伍，其既延续着从军传统，也怀揣着为族人争取更好生活的期望。随着战火重燃美洲大陆，这些部族的参军热潮愈发高涨。\n\n以拉科他语、达科他语和纳科他语等苏族语系分支为载体的密码工程即将启动，这些曾遭禁绝的濒危语言将成为我军新设密码部门最牢不可破的加密工具。被军官们称为“拉科他密语者”的这批精锐，包括奥格拉拉的克拉伦斯·狼胆、扬克顿达科他的罗斯兄弟丹尼尔与鲁弗斯等数十名最精通母语的土著新兵。他们将作为最高指挥部的核心支柱，提供灵活安全的通讯保障与密码学优势，助我们应对日新月异的现代战争。居住在我们土地上的苏族、克里族、克罗族等原住民族群，将共同拯救这片长期压迫他们的国土。在威廉·达德利·佩利和拉福莱特家族等联盟国政治家的支持下，这个过程或许能为他们赢得更广泛的权利，让全体美国人民重新认识这些民族的尊严与价值。"
 TEX_Earn_Your_Spurs:0 "砺炼成钢"
 TEX_Earn_Your_Spurs_desc:0 "尽管特里将军在西点军校表现平平，却始终铭记着军校的重要训诫，以及他在世界大战中亲历的深刻教训：侦察乃兵家命脉。纵使现代战争中的侦察手段日新月异，从空中侦察到伪装观测树层出不穷，这位前第十四骑兵团军官仍对传统战法情有独钟。\n\n自1775年便活跃战场的骑兵侦察队，只需稍加整饬便能重振雄风，再为大军充当耳目。虽然培养佩戴马刺勋章的正式“骑兵侦察兵”需要时日，但这份投入必将换来相应的回报，一支纪律严明、行动高效的侦察部队，能在任何地形迅速获取情报。更妙的是，凭借战马与生俱来的机动性，这些战士还能视前线需求，随时化身弹药与医疗物资的运输队。"
 TEX_Find_Em_Fix_Em_Fight_Em:0 "发现、咬住、歼灭"
 TEX_Find_Em_Fix_Em_Fight_Em_desc:0 "随着自动武器和支援火器的普及，许多将领要么变得漠视士兵性命，要么在作战计划中畏首畏尾。但特里将军却独树一帜，他为我们的部队量身打造了一套新战术准则：“发现、咬住、歼灭”。这套简明扼要的作战方针，既能保持进攻锐势，又能最大限度减少伤亡。\n\n为确保战术成功实施，我军将强化三项核心训练：地图判读、野战导航与侦察作战，以此精准定位敌军并抢占制高点。随后通过合围战术与迫击炮火配合，迫使敌人转入防御姿态。一旦将其牢牢钉死，歼灭便只是时间问题。"
 TEX_Prowling_Beneath_the_Moon:0 "月下进军"
 TEX_Prowling_Beneath_the_Moon_desc:0 "第二次美国内战催生了全方位的战术革新，尤以伤亡数字的不断攀升为标志。当我们的部队逼近敌方主要城市时，推进步伐便愈发受阻，无论是遭遇游击武装还是坚固防御工事。尽管特里将军以凌厉的指挥风格著称，他却从不忍见麾下将士白白牺牲，为此他逐步制定出一套新战术，誓要为士兵们赢得生存优势。\n\n该方案要求对大批部队实施夜间作战训练。夜袭虽险，却能以出其不意之效扰乱敌军阵脚，往往在对方组织有效反击前，便已致其溃败或投降。当我们的战士如群狼般扑向惊慌失措的守军时，这些在快速推进中发动的暗夜突袭，甚至能让敌人来不及扣动扳机便溃不成军。"
 TEX_The_First_to_Bleed:0 "流血争先"
 TEX_The_First_to_Bleed_desc:0 "当某些国家还在满足于仓促武装的征召兵时，特里将军深知，若指望这些对战争一无所知的愣头青，只会造就更多需要抚慰的寡妇与母亲。如今太多训练课程仍执着于华而不实的队列操演，这种花架子根本教不会士兵如何为国而战，而老艾伦决不允许联盟国继续这样下去。\n\n他主张对战地训练营及教官体系进行彻底改革。我们的士兵将在实弹演习与极限训练中淬炼成钢，蜕变为真正的铁血战士。这场魔鬼训练营必将让他们流血流汗，但今日付出的每一滴鲜血，都将是明日战壕中的保命符。"
 TEX_Battalions_of_Brawlers:0 "好斗之军"
 TEX_Battalions_of_Brawlers_desc:0 "“恐怖特里”早在晋升为我军首席改革家之前，就以离经叛道的激进指挥风格闻名。数位高阶将领曾以他难以捉摸的性情和独断专行的作风为由要求撤换他。但令其他军官懊恼的是，这种桀骜不驯的风气已席卷全军。\n\n既然政府仍对特里将军保持信任，我们大可将这种作风与军中新兴的“好斗派”化为己用。我们要打造全新作战的准则，要求士兵以凶悍作风接敌，指挥官必须保持进攻主动性。鉴于其改革成效显著，其他将领只能对特里肆意践踏那些“懦夫条令”的行为嗤之以鼻。"
 TEX_Roughshod_Discipline:0 "铁一般纪律"
 TEX_Roughshod_Discipline_desc:0 "尽管特里将军以固执自信著称，深受士兵爱戴，但他绝非纵容部下肆意妄为之辈。他或许会对偶尔发生的劫掠酒水行为睁一只眼闭一只眼，但他对懦夫、邋遢兵痞和纨绔子弟却绝不留情。\n\n军人仪表与精神必须恪守严格标准，否则我们引以为傲的彪悍作风，就会堕落成兵变暴乱或怯懦畏战的劣习。纵有几个兵油子抱怨此乃暴政，但艾伦麾下将士对长官的敬重，自会令整肃行动贯彻始终。毕竟枪林弹雨之中，总需要某些铁律才能让男儿们站稳脚跟。"
 TEX_New_Sherman_War_Act:0 "新舍曼“战时”法案"
 TEX_New_Sherman_War_Act_desc:0 "随着史密斯部长麾下的信徒大军日益壮大，一个骇人的现实正逐渐显现：联盟国当前的工业体系根本无力支撑如此庞大的军队。正如这位布道者所担忧的，问题并非物资匮乏，而是某些集团对国家资金的贪得无厌。标准石油公司正受到特别审查，这家企业似乎将第二次内战视为管理层中饱私囊的天赐良机，毕竟卡车、坦克与战机全都需要燃油。\n\n随着《战时法案》的颁布实施，这些不爱国的大亨很快就会发现自己的脑袋悬在了断头台下。该法案旨在确保我军补给畅通，特别规定石油企业的发国难财行为将与叛国罪同罪论处。贪婪企业中的强盗大亨将被清除，代之以忠诚的国家官僚。正如当年约翰·舍曼为保障美国消费者权益而打破垄断，如今杰拉尔德·L·K·史密斯也将确保这些毒蛇无法在苦难时代从他们珍贵的“黑金”中牟利。"
 TEX_Share_Our_Rifles:0 "与子同枪"
 TEX_Share_Our_Rifles_desc:0 "在这片受神圣《第二修正案》庇佑的土地上，枪械早已如同麦穗般遍布美利坚的每个角落。而今国难当头，是时候让这些枪口对准合众国真正的敌人了。杰拉尔德·L·K·史密斯虽已多次招募志愿兵，但他即将推行的国家总动员计划，将把军工体系与全民武装推向全新高度。\n\n为了保障联盟国的安全，我们将发起一场“献枪运动”。对能完成大宗订单的企业给予丰厚补贴，同时鼓励普通公民接受步枪训练，以便随时应征加入民兵队伍。每个家庭都有义务在必要时掌握枪支使用技能，我们的工厂也将开足马力生产轻武器。如此一来，我们的战斗人员数量将达到势不可挡的规模。"
 TEX_Khaki_and_Silver_March_On:0 "卡其军与银衫军共进军"
 TEX_Khaki_and_Silver_March_On_desc:0 "若只囿于既定军事教条，实属愚不可及，这场决定我们命运的生死较量，从不讲究公平，只问成效。与我们理念相契的无数独立民兵组织，对此作出了最为鲜明的诠释。他们凌厉的战术、非常规的作战方略以及对事业的绝对献身精神，理应成为联盟国军队改革的蓝本。\n\n有鉴于此，我们必须将与那些押注“王鱼”美利坚至上党领袖的民兵组织达成的松散协议正式化。此中代表人物，当属银色军团的威廉·达德利·佩利与卡其军的阿特·J·史密斯。佩利不仅统领银衫军，更通过其创立的基督教党赢得广泛支持，他承诺要为只求温饱的信众重振共同福祉。史密斯虽无政治势力，却拥有丰富的武装冲突经验。这位曾主张赋予朗氏独裁权力以实现民族主义进步纲领的悍将，其经历亦堪称传奇，从摩洛哥法国外籍兵团，到为潘乔·比利亚驾驶轰炸机，甚至担任过俄国克伦斯基的副官。"
 TEX_Squires_under_the_Cross_Flag:0 "于十字旗下捍卫"
 TEX_Squires_under_the_Cross_Flag_desc:0 "我们虔诚的一分钟人，这乱世中的秩序仲裁者，绝不能满足于仅仅作为对抗工团主义游击队和联邦游骑兵的快速反应部队。历史战争证明，进攻型精锐部队往往能决定整场战役的胜负，正如德皇春季攻势所展现的那样。而杰拉尔德·L·K·史密斯部长手中最优质的陶土，正是休伊·朗留下的一分钟人，他将以此塑造合众国自己的突击营。\n\n史密斯部长已制定出完美的训练方案，它将筛除那些无法正义执剑对抗“赤魔”的弱者，并将毕业者锻造成上帝意志的虔诚信徒。装备自动武器、高爆炸药，以及那最重要的——对主的坚定信仰，我们必将在罪人的防线上撕开缺口。从这些裂痕中，我军主力将如黑暗中迸射的光芒般奔涌而出，为所有对抗十字旗之人带来应得的毁灭。"
 TEX_Bonfire_of_the_Faithless:0 "无信者浴火"
 TEX_Bonfire_of_the_Faithless_desc:0 "在我们为美利坚灵魂而战的征途上，凡非上帝钦定者皆非神圣不可侵犯，任何阻碍我们净化美国精神形象的邪祟都将在业火中灰飞烟灭。正如《圣经·申命记》29章23节所载，我们将以天罚般的烈焰焚尽这个腐朽的诸州巴比伦。那些新的“平原之城”必将重蹈所多玛、蛾摩拉、押玛、洗扁的覆辙，在硫磺火雨中化为焦土，永世盐封。\n\n我们将动用燃烧弹、喷火器，以及一切比谢尔曼火烧亚特兰大更残酷的武器，彻底净化美利坚的容颜。这场焚尽虚空之虚空的圣焰，终将如宗教改革先驱萨伏那洛拉所愿，建立起新的耶路撒冷。正如昔日的佛罗伦萨，历经淬炼的哥伦比亚女神必将浴火重生，比开国先贤时代更富庶、更强大、更荣耀。愿天意指引我们这正义之怒，荡涤一切亵渎建国神圣理想的仇敌。"
 TEX_Chesty_Pullers_Marines:0 "“铁胸”普勒的陆战队"
 TEX_Chesty_Pullers_Marines_desc:0 "作为参与过海地与尼加拉瓜占领行动的老兵，“铁胸”刘易斯·伯韦尔·普勒在联盟国军队中享有崇高威望。这位将军不仅战功赫赫，更赢得了众多投奔我方事业的海军陆战队员的由衷敬仰。当另一位功勋卓著的陆战队将领斯梅德利·巴特勒倒向工团主义阵营时，普勒却成功将大批爱国且经验丰富的陆战队员带到了新奥尔良。正因如此，“铁胸”迅速成为我军军官团的核心人物，他正以独到的建军理念为我军锻造锋锐爪牙。\n\n普勒的军事学说极度重视海军陆战队建设，主张将其训练标准推广至全军，以此打造完美的士兵典范。为此，所有新式装备与战术研发均以陆战队需求为导向，同时对其训练体系与作战理念进行现代化重塑。通过这些举措，联盟国武装力量将获得一支战无不胜、忠贞不渝的中流砥柱。"
 TEX_Choke_Out_Rattlesnakes:0 "扼杀响尾蛇"
 TEX_Choke_Out_Rattlesnakes_desc:0 "美国海军陆战队在清剿游击队与叛乱分子方面可谓经验老到，这很大程度上得益于他们在香蕉战争中的历练。从太子港到布卢菲尔兹，陆战队在反游击作战中磨砺出了钢铁般的意志，甚至促成1921年《小规模战争手册》的编纂。作为这些治安行动的老兵，“铁胸”普勒坚信，如今正是陆战队再度出击之时，以肃清那些忠诚堪忧地区的蜂起之敌。\n\n由陆战队专司后方安保与快速反应，我正规军便能更专注于正面战场，免于被零散作战消耗精力。此类针对性清剿不仅能有效消弭叛乱威胁，更将通过保障补给线的稳定，对整个战区产生物质与心理的双重震慑。要不了多久，那些妄图从背后噬咬我军的响尾蛇，终将在毒牙尚未刺入之际便被连根拔除。"
 TEX_Evolve_Biddles_Training_Regime:0 "精进比德尔训练制度"
 TEX_Evolve_Biddles_Training_Regime_desc:0 "尽管海军陆战队自1911年比德尔司令推行改革以来，始终将射击技能与单兵作战作为核心训练科目，但如今是时候重新审视新兵训练体系，推进更高程度的标准化了。随着联盟国境内陆战队规模不断扩大，新兵如潮水般涌入训练营，我们必须确保这些战士能以最佳战斗状态迅速投入前线。\n\n射击技艺的高标准不会降低，陆战队员的体能要求也不会放宽，但我们更要将爆破、载具操作等现代化作战科目纳入训练体系。待这场改革完成之日，海军陆战队必将铸就“精英中的精英”的不朽威名。"
 TEX_To_Truly_Live_Forever:0 "永垂不朽之真谛"
 TEX_To_Truly_Live_Forever_desc:0 "自独立战争时期作为大陆海军陆战队诞生以来，这支美国两栖步兵部队经历了远超其份额的苦战，屡屡在绝境中铸就传奇。从密林鏖战到血染滩头的强袭，美国海军陆战队以钢铁般的韧性赢得了近乎神话般的声誉。这份荣光自然伴随着沉重期许，却也将他们淬炼成今日的精英之师。\n\n在我们国家最黑暗的时刻，正需要这样一支战火锤炼的铁军。美国的敌人们筑起了更顽固的防线，用更卑怯的诡计设伏围剿。陆战队员必须被训练成永远忠于职责的战士，即便补给断绝、炮火倾泻，仍能顽强生存。凭着不屈的意志与完成最凶险突击的能力，这支队伍里没有人会真正死去，他们都将作为美利坚最英勇的战士典范而永世长存。"
 TEX_Corkscrew_and_Blowtorch:0 "开瓶器与喷火器"
 TEX_Corkscrew_and_Blowtorch_desc:0 "尽管海军陆战队训练有素，但正如世界大战中诸多所谓“精锐”部队的遭遇，在对抗堑壕固守之敌的持久战中，他们同样难以久战。敌方碉堡与机枪巢收割我们特种兵的速度，将远超我们培养他们的效率，这暴露出过度依赖职业军人的致命缺陷。为此，普勒将军已下令批量列装各类反工事武器，全面武装我军部队。\n\n配备M2火焰喷射器与M37爆破装备后，任何敌军防御工事都将被迅速拔除，确保我军将士在战线推进中得以保全。虽然工兵部队因专精攻坚装备而稍显防御薄弱，但我们可以确信：凡是阻挠我军前进的堡垒、地堡与战壕，都将在烈焰中化为灰烬。"
 TEX_Reign_of_Firestorms:0 "烈焰统御"
 TEX_Reign_of_Firestorms_desc:0 "烈焰，这令先民既恐惧又痴迷的自然伟力。将焚天炽焰化为战争工具的历史源远流长，无论是传说中的“火箭”，还是失传的拜占庭希腊火。即便在现代战场，燃烧武器仍在特定情境下展现惊人威力。\n\n我军必须驾驭火风暴之力，以此铸就战场霸权。通过凝固汽油弹等新型装备、强化火力运用的专项训练，辅以震慑战术，我们必将让敌人在焚城烈火中灰飞烟灭。"
 TEX_The_New_Rough_Riders:0 "新莽骑兵"
 TEX_The_New_Rough_Riders_desc:0 "1898年，当威廉·麦金莱总统直面西班牙帝国时，他拥有的是一支仓促成军、实力薄弱的美国陆军。为此，政府采取了一项创举：组建了著名的志愿骑兵团，这支既能骑马作战又能徒步冲锋的部队，在圣胡安战役中赢得了不朽荣光。\n\n如今，这支被誉为“莽骑兵”的美利坚第一志愿骑兵团，将激励我们组建新型机械化部队继续为联邦而战。装备火炮牵引车的新型志愿军，将沿着纵横交错的州际公路驰骋，将自由之师的铁骑踏遍广袤国土的每个角落。"
 TEX_Rolling_Armored_Cannons:0 "机动装甲炮兵"
 TEX_Rolling_Armored_Cannons_desc:0 "随着战场需求与技术发展，固定炮兵阵地的时代已彻底成为历史。当今既无城堡围攻战，亦无棱堡攻坚战，自投石机时代沿用至今的陈旧机动模式必须革新。\n\n鉴于我军在合成作战理论运用上日益显著的成效，德弗斯将军统帅的司令部已下令列装各类突击炮。这些装备既包含增强步兵火力的支援战车，也涵盖可快速抵达战场实施间接轰炸的自行火炮。\n\n尽管美军现役并无专用载具，我们完全可以通过改装坦克与装甲卡车来满足“装甲火炮”这一宽泛指标。首批重大改造项目包括M12火炮机动载具，而真正为突击炮角色全新设计的M40火炮机动载具亦将紧随其后列装部队。"
 TEX_An_Efficient_Colossus:0 "高效巨人"
 TEX_An_Efficient_Colossus_desc:0 "德弗斯将军虽未在军方高层赢得多少友谊，但既有总统的信任为盾，自可无所顾忌。如今他大可以笔为刀，恣意裁量每位军官的品行与才干。在他看来，军中汲汲于政治钻营或虚名的指挥官实在过多，这番整顿后，此风当绝。\n\n当那些贪慕个人功名而非真正胜利之辈被发配闲职或提前退役时，“微笑杰克”将全力擢拔新锐。通过确保每个关键岗位都由才德兼备者执掌，联盟国军队将从乌合之众蜕变为火力精准的钢铁巨兽。若再配以完善的后勤保障，我们的坦克履带之下，终将碾碎一切敢于举枪抗命之徒。"
 TEX_An_All_Seeing_Dragon:0 "全视之龙"
 TEX_An_All_Seeing_Dragon_desc:0 "空中侦察并非新近概念，早在弗勒吕斯战役期间，法国革命政府便已运用气球执行侦察任务。随着航空技术进步，专门配备高空摄影设备的侦察机已成为现代空军标配。德弗斯将军深谙此道，断言组建专业照相侦察部队实为制胜关键。\n\n研制兼具高机动性与超高空飞行能力的侦察机固然重要，但培养专职影像分析人员更能大幅提升情报价值。从这些照片宝库中，敌军将无所遁形：防御工事网、部队编成、工厂集群位置都将被精准测绘，继而遭到陆空火力迅疾摧毁。"
 TEX_The_Angels_of_Mercy:0 "慈悲天使"
 TEX_The_Angels_of_Mercy_desc:0 "尽管直升机问世未久，这支“钢铁蜻蜓”部队却已成为现代军队的中坚力量。德弗斯将军同样对这种飞行器深感兴趣，在他构想的空陆协同作战蓝图中，它们将扮演关键角色。\n\n无论是快速补给、紧急撤离还是医疗救援，这些由专业机组驾驭的空中骑兵，都将成为传统空军的完美补充。特别是在“微笑杰克”幕僚团队与总统办公室联合推动下诞生的伞降救援队，更凸显了其战略价值。值得一提的是，尽管雅各布·L·德弗斯出身保守的路德宗家庭，但女性志愿者的强烈呼声已促使军方考虑开放女性飞行员岗位。"
 TEX_Towards_a_Better_Tank:0 "打造“更好坦克”"
 TEX_Towards_a_Better_Tank_desc:0 "在内战爆发前夕，美军指挥官们曾围绕坦克战领域的新发展展开激烈论战。以莱斯利·麦克奈尔将军为首的一方主张，反坦克炮与独立坦克歼击车才是克制敌军装甲优势的不二法门；而德弗斯将军则提出更简洁的解决方案——“能打败坦克的就是更好的坦克”。\n\n尽管兄弟阋墙的战争打断了这场辩论，麦克奈尔也被迫西逃，但德弗斯将军从未动摇其坚定立场。如今在政府的全力支持下，这位远见卓识的将领终将得偿所愿，当敌人还在笨拙地使用那些被神化的机动火炮时，我们持续的坦克研发已结出硕果。"
 TEX_Mechanize_the_Quarterhorse:0 "“夸特马”机械化"
 TEX_Mechanize_the_Quarterhorse_desc:0 "许多士兵认为骑兵在现代战争中已然过时，当然，这或许不无道理，但若因此遗忘美国悠久的骑术传统，对联盟国而言实为不妥。美洲夸特马（以其在400米赛跑中的惊人爆发力得名）正是这段历史的见证，在西部拓荒时代，各类混血马种曾备受珍视。\n\n我们将以第4骑兵师作为装甲骑兵部队的首次试验：该师第1中队沿袭“夸特马”称号，本身便承载着草原征战的传统。整支兵团将以机械化载具替代战马，既延续部队机动特性，又确保其在现代战场仍具竞争力。"
 TEX_Legacy_of_the_Zouaves:0 "祖阿夫军团的遗产"
 TEX_Legacy_of_the_Zouaves_desc:0 "祖阿夫军团乃法国征战阿尔及利亚后所创，其名可溯自骁勇的柏柏尔族兹瓦瓦部落志愿军。这一军团非特指某支部队，而是各类轻步兵团的统称，其足迹遍布寰宇：无论是路易·朱绍·德·拉莫里西埃麾下的教宗祖阿夫军团，还是弗朗索瓦·罗什布吕讷组建的波兰死亡祖阿夫军团，皆彪炳战史。得益于埃尔默·伊弗雷姆·埃尔斯沃思在伊利诺伊州的努力，在“美国祖阿夫学员团”成立后，这支劲旅更是深深烙印在美国民众记忆中。\n\n当南北战争爆发时，联邦与邦联双方都组建了自己的祖阿夫军团，诸如纽约的“消防祖阿夫军团”与更为著名的“路易斯安那猛虎团”。鉴于我政府的诞生之地，若任由这些精锐突击部队的历史湮没无闻，实乃莫大讽刺。我们必须着力运用“猛虎团”的威名，既通过视听宣传造势，更要组建联盟国专属的新生祖阿夫精英部队，令传奇重焕生机。"
 TEX_A_Steel_Alligator:0 "钢铁短吻鳄"
 TEX_A_Steel_Alligator_desc:0 "由于缺乏快速部署机械化喷火部队的能力，若不尽快解决这一问题，联盟国陆军恐将在战场上陷入火力劣势。所幸化学武器部队火焰坦克小组的天才们提出了一个简单方案——喷火坦克。\n\n这种名为“短吻鳄”的改装战车专门基于现役坦克底盘改造，搭载致命燃烧剂，必将成为敌人的噩梦。当地面部队推进时，任何堡垒或隐蔽阵地都将在它的烈焰下灰飞烟灭。"
 TEX_Protecting_America_First:0 "捍卫美利坚至上"
 TEX_Protecting_America_First_desc:0 "联盟国立国之本，首在摒绝一切危及美利坚黎庶之威胁。民众岂甘为帝国主义机器之齿轮，沦为腐朽建制之工具？今美利坚再造，当重归内向：奉行彻底孤立之美利坚至上政策，抑或复兴门罗主义精神以护美洲兄弟黎庶免遭奴役。\n\n此令既颁，三军将士岂可晏安于承平？当精砺战技，更助重筑昔日光耀山巅之城。故除维序之责外，凡执枪者皆须受土木军事工程要术之训。"
 TEX_The_School_of_the_Line:0 "前线学院"
 TEX_The_School_of_the_Line_desc:0 "纵使背负着不甚光彩的历史遗产，坐落于纽约州的西点军校仍堪称全美——乃至全世界——最负盛名的军事学府。这座自第一次内战尾声便由权贵把持、为权贵服务的美国陆军军官学校，堪称我们誓死抗争的“贵族特权”与“精英压迫”的活标本。随着第二次内战爆发后波士顿婆罗门集团占据该地，这种腐朽风气更是变本加厉。\n\n若要拨乱反正，我们应将目光投向美利坚的向日葵之心，即堪萨斯州的莱文沃思堡。1881年，威廉·特库姆塞·谢尔曼正是在此创立步骑兵应用学校，后发展为美国陆军指挥与参谋学院（亦称“前线学院”）。其杰出校友与教官名单堪称当代将星谱：亨利·H·阿诺德、奥马尔·布拉德利、雅各布·L·德弗斯、道格拉斯·麦克阿瑟、乔治·S·巴顿与小阿德纳·R·霞飞等各派将领皆列其中。\n\n随着指挥与参谋学院的扩建工程启动，这座崇尚实务的学府必将很快盖过西点的虚名，涤荡过时已久的精英主义沉疴。通过聚焦现代战争经验与战术革新，莱文沃思堡的毕业生们将彻底重塑联邦陆军的未来面貌。"
 TEX_Patmans_Reward:0 "帕特曼的回报"
 TEX_Patmans_Reward_desc:0 "比起美国历史上任何其他冲突，第二次内战造就了无数流血牺牲、为家园与国家未来奉献一切的退伍军人。尽管许多人已获得应有回报，但政府面临的善后工作规模之巨令人束手无策，官僚体系几乎陷入停滞。\n\n为避免重蹈因军人不满其待遇而引起“酬恤金进军”抗议的覆辙，同时巩固我们在德克萨斯州的政治根基，政府已表态支持所谓的《帕特曼法案》，首要目标便是兑现对退伍军人的补偿承诺。\n\n该法案起草者与我们政府高层渊源颇深，德克萨斯州第一国会选区议员约翰·威廉·赖特·帕特曼不仅亲眼目睹儿子为联盟国事业而战，其立法成就更曾获得休伊·朗本人嘉许。他最为人称道的，是对抗大型银行与美联储的坚定立场，以及参与起草《罗宾逊-帕特曼法》以保护“夫妻店”免受连锁零售商蚕食的壮举。"
 TEX_The_Gun_to_Win_the_World:0 "凭枪致胜"
 TEX_The_Gun_to_Win_the_World_desc:0 "自建国伊始，美利坚便与枪械结下不解之缘。这片土地上诞生的左轮手枪、来复枪与机关枪的精妙设计，始终令欧洲人望尘莫及。加特林机枪、柯尔特1911手枪，尤其是温彻斯特步枪，无不是战争艺术中的杰作。然而当旧大陆深陷世界大战火海，我国又爆发第二次内战后，枪械研发的步履明显迟缓了下来。\n\n若要让自由之乡永葆独立，此刻必须力挽颓势。我军研究所正着力三大革新：更大口径的弹药、更易操控的自动火力、可拆卸弹匣设计。只要获得足够支持，这些创新必将开创枪械新纪元。届时世界将黯然失色，因为每个美国士兵手中的步枪，都将是令所有敌寇胆寒的绝世神兵。"
 TEX_Establish_the_WPB:0 "成立战时生产委员会"
 TEX_Establish_the_WPB_desc:0 "在这场对抗“军工复合体”寡头统治的伟大征途中，联盟国于内战期间已建立起高度集中的军备生产体系。我们绝不能让既有机制随战事平息而荒废，与之相反，我们应当将其整合为专门机构，统筹保卫美国疆土与利益所需的庞大战备采购体系。\n\n根据最新行政命令，总统已成立直属联邦政府监管的战时生产委员会。该机构将统合原供应优先分配委员会与生产管理办公室的全部职能，从企业军转产改造、稀缺资源调配到危机时期配给制度，皆归其管辖范畴。"
 TEX_Put_Surgeons_Front:0 "外科医生上前线"
 TEX_Put_Surgeons_Front_desc:0 "从这场手足相残、邻里相戕的内战中，我们汲取了一个血泪教训：战争实乃死神之业。纵使我们竭尽全力，亦只能稍减其屠戮，专业医疗设施虽堪称奇迹，但若我军远征海外，现有体系仍难堪重负。\n\n经数月周密筹划，陆军司令部现已启动全新方案：组建机动外科医院。鉴于创伤后的“黄金一小时”直接关乎士兵生死，快速投送医疗力量已成当务之急。这些配备至少60张病床及核心外科团队的流动野战医院，必将拯救前线无数美国儿女的生命。"
 TEX_Antivenom_Red_Serpent:0 "赤匪毒蛇的抗毒血清"
 TEX_Antivenom_Red_Serpent_desc:0 "曾几何时，美国娱乐业作为启迪世界的全球巨擘，如今在内战重创下已沦为余烬。更致命的是，且虽无人明言却已成事实，敌人通过这些世俗圣殿进行的意识形态灌输与国家干预，已悄然培育出对我们充满杀意的一代人。\n\n为扭转这种可悲局面，联盟政府必须采取更积极的措施来消解这种废墟文化的影响。通过大规模政府拨款、由友好官僚和党员“敦促”等手段，好莱坞与百老汇等文化圣地终将除锈生辉，重放光芒。\n\n唯有对美国流行文化进行彻底重构，民众才能抵御来自大西洋彼岸那些赤色恶魔的精神侵蚀。我们决不能让人民的思想腐坏变质，否则“幸福时光”将永不复返。"
 TEX_Prosperity_in_New_Populism:0 "新民粹主义繁荣"
 TEX_Prosperity_in_New_Populism_desc:0 "美利坚联盟国的建立，是休伊·皮尔斯·朗为“净化”美国而发出的宣言书：要清除华尔街的金融寡头、革命的社会主义叛徒、军队中的反美暴君，以及南方腹地的分裂主义渣滓。这绝非机会主义之举，而是美国民众长期酝酿的运动终于实现，要从蚕食他们辛勤劳动果实的势力手中夺回自己的国家。\n\n在我们无可置疑地取得光耀万世的胜利后，我们实现了“民粹主义”思想前辈的夙愿。秉承农民协进会、农民联盟、绿背劳工党和人民党的精神，我们将这个国家重新交还给联盟全体正直的人民，交还给各个联合起来的州。\n\n我们不曾让自己被钉上十字架，不曾让荆棘冠加冕于顶，因此永远不能忘记前辈威廉·詹宁斯·布莱恩那不朽的竞选口号。“人民应该统治吗？”这位遭遇不公而未能入主白宫的政治家曾如此发问，而今我们可以响亮地回答：人民渴求变革，他们已如愿以偿，永恒的繁荣曙光必将长存。"
 unionstate.30012.t:0 "渗透迹象"
 unionstate.30012.d:0 "随着工团政权在内战期间对五大湖区的统治垮台，多数人认为其遗产不过是满目丘墟、一地狼藉以及一场流产的美国文化革命尝试。这种认知已成为许多美国公民，特别是受影响地区居民的心理慰藉，用以应对曾在宪政国等政权统治下的生活经历，那些政权最终都被联盟国军击溃。然而记忆并未消散，与之相伴的还有那些致力于维护意识形态的机构，新奥尔良当局曾竭力将这些意识形态从国家肌体中清除。\n\n近日在密歇根州西岸沉寂的小镇马尼斯蒂，人们就发现了这样一桩奇事。此地本无足轻重，北部的特拉弗斯城在该区域更具影响力，更不必提东部的工业巨擘底特律，或是作为战争初期“咆哮”丹·西维同志率海盗突破封锁线的战场——分裂状态的苏圣玛丽市。但即便如此，联合工团的触须仍深深扎入了这类小镇的根基，现存于马尼斯蒂的“工人联合马尼斯蒂广播站”便是明证。\n\n顾名思义，该电台由初生的美利坚联合工团政权建立，旨在向未受社会主义思想玷染的民众传播其邪恶宣传。尽管我国政府长期致力于打击此类信息传播，近期更全力重建好莱坞与百老汇以纠正历史错误，但马尼斯蒂这类电台往往能逃脱审查部门的监控。直到某日儿童节目《建筑工人罗伯特》——这档向当地青少年灌输共产主义价值观的拙劣节目——播送完毕后的停机画面，才彻底改变了局面。\n\n据当地少女斯蒂芬妮·格拉斯陈述（其友人当日特意推荐她收听该电台），常规结束画面被两名神秘人物的直播画面取代：一名身着艳服的疑似男性，以及一名裹着遮掩面容的黑色长袍、性别难辨者。那名男子仿佛受黑袍者操控，向所有持“左翼价值观”者宣读控诉，痛陈他们在内战及后续事件中如何毁掉自己的人生。演讲结束后信号开始扭曲中断，但包括格拉斯在内的多名目击者证实，神秘人将一柄旧制刺刀递给男子，并命令他“终结这场闹剧”。\n\n尽管这种反工团主义行为看似“高尚”，但若纵容此类事件，必将酿成媒体灾难——无论这些私刑式劫持者如何受我方近期行动“感召”。目前调查进展有限，前往广播站现场的探员仅发现男性死者残骸与黑袍人的衣物碎片。经比对马尼斯蒂镇政厅档案，确认遇害者为本镇居民马克西米利安·斯宾纳，系战争孤儿。唯一线索是黑袍人遗留在现场的绣名长袍，上面刺着一个名字：琳恩。"
 unionstate.30012.a:0 "通信部门的一大怪事"
 unionstate.30013.t:0 "新经济之坦途？"
 unionstate.30013.d:0 "卡廷总统曾严厉批判私营银行对国家信贷体系的“不受约束的任性掌控”及其“剧烈波动”，如今他为我们带来了彻底重塑现行经济结构的契机。延续前总统朗对私营银行无尽贪婪的批判立场，卡廷提议建立新型中央银行，该银行将整合美联储体系并垄断信贷系统，将其转化为服务人民而非私利的经济机制。为向保守派盟友证明其执政不会重蹈导致美国衰落的工团主义覆辙，总统提出的先进方案将通过新信贷体系大幅加强政府对经济的管控，坚定不移地将公共利益置于首位。众多朗的追随者支持这项变革，他们坚信遏制工团主义煽动的最佳方式，就是营造从根本上杜绝其滋生的经济环境。"
 unionstate.30013.a:0 "算了，财富共享计划便已足够"
 unionstate.30013.b:0 "立即终结银行对信贷体系的垄断！"
 TEX_national_populist_catholic_elect_party:0 "神圣美利坚联盟"
 TEX_national_populist_catholic_elect_party_long:0 "神圣美利坚联盟(The Holy American League)"
 TEX_ballards_party:0 "圣日耳曼兄弟会"
 TEX_ballards_party_long:0 "圣日耳曼兄弟会(Brotherhood of Saint Germain)"
 TEX_authoritarian_democrat_deadphill_reformed_party:0 "新至上党"
 TEX_authoritarian_democrat_deadphill_reformed_party_long:0 "新美利坚至上党(New America First Party)\n§g复兴后的美利坚至上党摇身一变，成了神圣美利坚联盟的民粹主义派系，以直言不讳闻名党内。在查尔斯·库格林神父的领导下，新美利坚至上党不遗余力地扩大其政治声量。当库格林疾呼必须回归美利坚至上的民粹政策方能维系帝国存续时，数百万民众侧耳倾听。这一目标极具号召力，因为帝国许多公民仍对“人人皆国王”等口号怀有深切眷恋，而库格林的言论正不断唤起这种怀旧情绪。新至上党同时主张限制宗教裁判所的权限，库格林与众多支持者认为当前的肃清行动早已过度扩张。凭借“神圣民粹主义”与限制恐怖裁判所的双重目标，民粹派无疑深得民心，注定将成为一股不可小觑的政治力量。§!"
 TEX_social_conservative_deadphill_reformed_party:0 "基督教民主党"
 TEX_social_conservative_deadphill_reformed_party_long:0 "基督教民主党(Christian Democratic Party)\n§g大摄政“钟爱之门徒”、虔信主教富尔顿·希恩所领导的基督教民主党，不仅志在承继卡罗尔大摄政的未竟之业，更要延续其神圣使命，原原本本地践行其宏图。同时，这一派别也申明推动帝国政治的温和化，希恩声称此乃大摄政之遗志——卡罗尔弥留之际曾命其继任大统，革新帝国。不过，强硬派等势力对此提出质疑，指出唯有希恩一人得闻遗言，其说辞真伪难证。纵有非议，基督教民主党仍笃行不辍，誓将卡罗尔开启的荣光伟业进行到底。§!"
 TEX_market_liberal_deadphill_reformed_party:0 "团结党 - 资本派"
 TEX_market_liberal_deadphill_reformed_party_long:0 "美利坚团结党 - 资本派(American Solidarity Party-Capitalist Faction)\n§g美利坚团结党正逐渐成长为帝国政坛的重要力量。在前纽约州州长阿尔·史密斯的旗帜下，该党派以“基督教资本主义”为旗号，致力于推动复兴自由市场资本主义作为帝国经济体系。与其左翼类似，史密斯领导的团结党同样推动帝国民主化进程，但其最终目标更为温和——旨在让联邦制重归国家体系。这些主张吸引了许多希望回归更自由、更放任经济体制却不放弃天主教价值观的温和派与保守派人士。该派系的支持者或许观念传统，但他们为帝国开创自由繁荣新时代的决心却丝毫未减。§!"
 TEX_social_liberal_deadphill_reformed_party:0 "团结党 - 自由派"
 TEX_social_liberal_deadphill_reformed_party_long:0 "美利坚团结党 - 自由派(American Solidarity Party-Liberal Faction)\n§g基督教自由派作为团结党中最左翼成员，常常在更广泛的改革派联盟中摇摆不定。他们既支持史密斯提出的联邦主义与资本主义方案，又认同戴相对温和的理念。由于缺乏统一的核心领袖，这个群体主要作为史密斯阵营中左翼支持者的发声渠道而存在。除非史密斯掌权后决定推行更进步的路线，否则他们将注定被边缘化。§!"
 TEX_social_democrat_deadphill_reformed_party:0 "天主教激进联盟"
 TEX_social_democrat_deadphill_reformed_party_long:0 "天主教激进联盟(Catholic Radical Alliance)\n§g在戴激进的天主教无政府主义与史密斯的基督教资本主义之间，存在着以伯纳德·希尔主教为名义领袖的温和改革派。他们致力于构建真正平等的社会——尽管不同成员对“平等社会”的解读各有差异，但总体而言，其理念与戴对天主教帝国的愿景高度契合，只是剔除了无政府主义色彩。虽然自居中间路线，但这位坚定的劳工主义者、芝加哥辅理主教在多数情况下更倾向于支持戴，同时表明若戴的无政府主义倾向过于激进，则将转而支持史密斯。正因如此，若天主教激进联盟最终胜出，希尔接任卡罗尔之位将成为切实可能。§!"
 TEX_radical_socialist_deadphill_reformed_party:0 "天主教工人运动"
 TEX_radical_socialist_deadphill_reformed_party_long:0 "天主教工人运动(Catholic Worker Movement)\n§g天主教工人运动的主流派系随着大摄政之死日益壮大。在多萝西·戴的领导下，该运动主张全面推行分产主义经济模式与性别平等主义，推动民主化进程，而最具争议的是其倡导帝国权力下放。同样引发争议的是，该派系始终未能否认外界对其怀有无政府主义与工团主义倾向的指控。尽管遭受诸多非议，但天主教工人派已在帝国工人阶级与女性群体中收获广泛支持，这已成为无可辩驳的事实，无疑是联盟内部一股强大势力。§!"
 TEX_syndicalist_deadphill_reformed_party:0 "天主教工人运动 - 无政府工团派"
 TEX_syndicalist_deadphill_reformed_party_long:0 "天主教工人运动 - 无政府工团派(Catholic Worker Movement-Anarcho-Syndicalist Faction)\n§g尽管改革派及天主教工人运动中的绝大多数成员都将工团主义斥为魔鬼的工具而深恶痛绝，但仍有例外存在。随着戴派在改革阵营中的崛起，受其无政府主义倾向的感召，联盟内部零星分布的无政府工团主义者竟逐渐凝聚成具有一定组织性的派系。由于他们势单力薄，且除始终未公开表态的戴外缺乏核心领袖，除非戴本人最终掌权，否则这些美国工团主义运动的最后余烬仍将隐没在暗影之中。§!"
 TEX_totalist_deadphill_reformed_party:0 "天主教工人运动 - 共产派"
 TEX_totalist_deadphill_reformed_party_long:0 "天主教工人运动 - 共产派(Catholic Worker Movement-Communist Faction)\n§g自大摄政逝世后在天主教工人运动中涌现的诸多派系里，自称“基督教共产派”的群体堪称最激进、最离经叛道的一支。作为戴氏左翼改革派中的极左翼，其融合了白劳德式共产主义、天主教正统教义与少许“美国传统价值观”，妄图借助大摄政的权力实现其理想社会。因其立场边缘化，他们不得不依附于戴的改革派，或许指望着裹挟整个运动。但无论如何，他们仍与戴及改革派站在同一阵营，期盼为这个天主教帝国增添几分自由色彩。§!"
 TEX_social_democrat_deadphill_day_party:0 "天主教工人运动 - 自由派"
 TEX_social_democrat_deadphill_day_party_long:0 "天主教工人运动 - 自由派(Catholic Worker Movement-Liberal Faction)\n§g天主教工人运动的右翼派系随着大摄政之死日益壮大。在多萝西·戴的领导下，该运动主张全面推行分产主义经济模式与性别平等主义，推动民主化进程，而最具争议的是其倡导帝国权力下放。同样引发争议的是，该派系始终未能否认外界对其怀有无政府主义与工团主义倾向的指控。尽管遭受诸多非议，但天主教工人派已在帝国工人阶级与女性群体中收获广泛支持，这已成为无可辩驳的事实，无疑是联盟内部一股强大势力。§!"
 TEX_social_conservative_deadphill_smith_party:0 "团结党 - 保守派"
 TEX_social_conservative_deadphill_smith_party_long:0 "美利坚团结党 - 保守派(American Solidarity Party-Conservative Faction)\n§g美利坚团结党正逐渐成长为帝国政坛的重要力量。在前纽约州州长阿尔·史密斯的旗帜下，该党派以“基督教资本主义”为旗号，致力于推动复兴自由市场资本主义作为帝国经济体系。与其左翼类似，史密斯领导的团结党同样推动帝国民主化进程，但其最终目标更为温和——旨在让联邦制重归国家体系。这些主张吸引了许多希望回归更自由、更放任经济体制却不放弃天主教价值观的温和派与保守派人士。该派系的支持者或许观念传统，但他们为帝国开创自由繁荣新时代的决心却丝毫未减。§!"
 cathdeath.191.t:0 "恢复全国大选"
 cathdeath.191.d:0 "改革派在国会获胜后，神圣美利坚联盟内部许多人士呼吁恢复国家选举制度，推行由民选国会和代表多数派的间接选举大摄政组成的议会体系。参照威斯敏斯特模式，党派将以推举大摄政候选人作为党魁的形式参与选举，并鼓励开展竞选活动。尽管部分强硬派认为让全美天主教领袖由非天主教徒投票决定实属亵渎神圣，[TEX.GetLeader]已向他们保证：既然大摄政是上帝在尘世间的代言人，唯有获得联盟认可的正统天主教徒才有资格成为大摄政候选人。另一方面，改革派则主张，实现民主选举领导层才是真正彰显我国善待全体民众之仁爱的唯一途径。"
 cathdeath.191.a:0 "恢复全国大选！"
 cathdeath.191.b:0 "仅允许州和地方举行选举，了解我国的唯有上帝"
 cathdeath.192.t:0 "[GetYear]年神圣美利坚联盟选举"
 cathdeath.192.d:0 "新一届大选时机已然来临，数百万选民正准备为国会及神圣美利坚联盟下任大摄政投下选票。联盟三大派系各自向选民发出不同诉求以争取支持：领跑者包括阿尔·史密斯支持资本主义体系的联邦基督教派，多萝西·戴领导的无政府分产派，以及芝加哥主教伯纳德·希尔代表的温和分产改革派。后期加入角逐的基督教保守派富尔顿·希恩被普遍视作黑马候选人，但多数观点认为他仍具备逆袭潜力。未来四年的执政权将花落谁家？"
 cathdeath.192.a:0 "史密斯的联邦派胜出！"
 cathdeath.192.b:0 "戴的左派在今日取胜！"
 cathdeath.192.c:0 "希尔的温和派分产主义者获胜了！"
 cathdeath.192.e:0 "富尔顿·希恩的基督教民主党赢得大选！"
 cathdeath.193.t:0 "恢复全国大选"
 cathdeath.193.d:0 "改革派在国会获胜及传统政党制度恢复后，神圣美利坚联盟内部许多人士呼吁恢复国家选举制度，推行由民选国会和代表多数派的间接选举大摄政组成的议会体系。参照威斯敏斯特模式，党派将以推举大摄政候选人作为党魁的形式参与选举，并鼓励开展竞选活动。尽管部分强硬派认为让全美天主教领袖由非天主教徒投票决定实属亵渎神圣，[TEX.GetLeader]已向他们保证：既然大摄政是上帝在尘世间的代言人，唯有获得联盟认可的正统天主教徒才有资格成为大摄政候选人。另一方面，改革派则主张，实现民主选举领导层才是真正彰显我国善待全体民众之仁爱的唯一途径。"
 cathdeath.193.a:0 "恢复全国大选！"
 cathdeath.193.b:0 "仅允许州和地方举行选举，了解我国的唯有上帝"
 cathdeath.194.t:0 "[GetYear]年国会选举"
 cathdeath.194.d:0 "新一届大选时机已然来临，数百万选民正准备为国会及神圣美利坚联盟下任大摄政投下选票。[TEX.GetNameDef]各大派系各自向选民发出不同诉求以争取支持：领跑者包括阿尔·史密斯支持资本主义体系的美利坚团结党，多萝西·戴领导的天主教工人运动，以及芝加哥主教伯纳德·希尔代表的温和分产派天主教激进联盟。后期加入角逐的基督教民主党及富尔顿·希恩被普遍视作黑马候选人，但多数观点认为他仍具备逆袭潜力。未来四年的执政权将花落谁家？"
 cathdeath.194.a:0 "阿尔·史密斯的美利坚团结党！"
 cathdeath.194.b:0 "多萝西·戴的天主教工人运动！"
 cathdeath.194.c:0 "伯纳德·希尔的天主教激进联盟！"
 cathdeath.194.e:0 "富尔顿·希恩的基督教民主党！"
