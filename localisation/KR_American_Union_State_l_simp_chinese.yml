unionstate.1.t:0 "任命美国退伍军人协会总指挥官"
 unionstate.1.d:0 "随着内战的结束，美国退伍军人协会总指挥官的职位出现了空缺。前任总指挥官斯梅德利·巴特勒愚蠢地站了在工团暴徒那边。无论是谁获得了这个职位，这个人都将象征性地代表美国社会中的退伍军人，因此它的人选是相当重要的。许多人选择提名老特里·德拉梅萨·艾伦将军，不过考虑到他对官僚主义的厌恶，我们不得不逼着他就任。右翼民粹主义者则主张给予杰拉尔德·L·K·史密斯这个职位，以表明他在募军时展现出的忠诚和积极性。另一方面，左翼民粹主义者似乎更喜欢老将西德·麦克马斯。那么谁将得到任命呢？"
 unionstate.1.a:0 "任命老特里·德拉梅萨·艾伦"
 unionstate.1.b:0 "任命西德·麦克马斯"
 unionstate.1.c:0 "任命杰拉尔德·L·K·史密斯"
 unionstate.7.t:0 "美国的首都"
 unionstate.7.d:0 "随着内战的结束，新美国的首都应该被定在哪里引起了大家的争论。在这个国家的许多城市中，其中四个似乎是最有前景的。那么哪个城市将有幸被选为我们的新首都呢？"
 unionstate.7.a:0 "华盛顿哥伦比亚特区"
 unionstate.7.b:0 "新奥尔良"
 unionstate.7.c:0 "奥斯汀"
 unionstate.7.e:0 "托皮卡"
 unionstate.7.f:0 "维持目前的首都"
 unionstate.8.t:0 "王鱼万岁"
 unionstate.8.d:0 "休伊·朗在内战中取得了真正的胜利，他坚守自己的原则，没有过一次妥协。现在他已经赢得了这场战争，他成为了美国的领袖。如今，荣冠加身的朗把目光转向了那些在其需要帮助之时趁火打劫、对其威逼利诱之人。他已经命令一分钟人对付那些胆敢背叛和削弱美国的叛徒。"
 unionstate.8.a:0 "王鱼获胜！"
 unionstate.10.t:0 "[GetYear]年大选"
 unionstate.10.d:0 "这是今年的[TEX.GetNameDef]总统选举，总统[TEX.GetLeader]处于领先地位，几乎可以肯定会再次当选。"
 unionstate.10.a:0 "恭喜[TEX.GetLeader]！"
 unionstate.11.t:0 "替换查尔斯·库格林神父？"
 unionstate.11.d:0 "多年来不断为美国做出贡献的查尔斯·库格林神父因事务繁忙而变得疲惫不堪。因为忙碌于广播节目与社会公义出版物之间，他变得很少有时间来推动我们的“财富共享”计划。这再加上受到他越来越不稳定的情绪的影响，这一天还是到来了。[TEX.GetLeader]总统虽然在这个问题上保持沉默，但其实对那些在库格林批评国际银行家时，被他妖魔化并与之混为一谈的普通犹太公民感到十分同情。我们必须让库格林退休，但谁应该接替他呢？是冷静的牧师比利·格雷厄姆？是休伊·朗的老竞选搭档威廉·莱姆克？还是有前途的朗主义作家老拉什·霍尔特？"
 unionstate.11.a:0 "比利·格雷厄姆"
 unionstate.11.b:0 "威廉·莱姆基"
 unionstate.11.c:0 "老拉什·霍尔特"
 unionstate.12.t:0 "休伊·朗的王朝"
 unionstate.12.d:0 "随着休伊·朗的家族成员花了很多年后终于在公众视野中逐渐成熟起来，休伊·朗的兄弟和孩子们也因此更加亲近政治。在这个不确定的时期，任何人都可能成为刺客，休伊的家人是否应该在总统内阁中占据重要位置？不仅仅是最坚决的朗派，几乎所有人都对朗的家人担任政府公职感到放心。"
 unionstate.12.a:0 "这太离谱了"
 unionstate.12.b:0 "跟着朗走不会有错的！"
 unionstate.13.t:0 "支持南方佃农联盟"
 unionstate.13.d:0 "尽管南方佃农工会的工作备受赞赏，但这个为数千人提供家园的组织的名字仍然是个笑柄。佃户们对其组织的名称感到愤怒。只要去一趟办公室，印一份新的宣传资料就能纠正这一混乱局面。现在正值[TEX.GetLeader]在任期间，他决定将其改组，新命名为美国佃农工会，并将佃农工会其他部分整合至其政治机器中。"
 unionstate.13.a:0 "向美国佃农工会问好吧"
 unionstate.14.t:0 "雨果·布莱克的秘密"
 unionstate.14.d:0 "当受人尊敬的雨果·布莱克在休伊·朗胜利的支持下被任命公职时，很少有人费心去核实他过去的履历。这也就是为什么今天的报纸令[TEX.GetLeader]总统如此震惊：该报发现雨果·布莱克竟然是三K党的成员！雨果·布莱克对媒体的回应则是一再的道歉，并说他加入三K党是不得已而为之的，他只是为了在阿拉巴马州参选。虽然布莱克的司法记录将他描绘成一位自由派，但布莱克曾经加入三K党的事实又的确与休伊·朗的反三K党运动截然相悖。我们应该解雇雨果·布莱克吗？"
 unionstate.14.a:0 "无法容忍的关系"
 unionstate.14.b:0 "人是会变的"
 unionstate.15.t:0 "“财富共享计划”的分歧"
 unionstate.15.d:0 "为了在全美国推行“财富共享”政策，[TEX.GetLeader]不仅招募了本党党员，还特地招募了某些前政府雇员来实施这些计划。这些新员工由威廉·莱姆克负责指导，由联邦政府支付工资。如今在该部门的地位上，新旧两派之间存在着一种紧张的路线对立。保守派领袖弗朗西斯·汤森主张部门应该继续作为一个非政府实体存在，以规避党派政治的不良影响，而莱姆克则希望将部门纳入联邦政府的管理中。"
 unionstate.15.a:0 "支持汤森"
 unionstate.15.b:0 "支持莱姆克"
 unionstate.16.t:0 "《麦克梯格》上映"
 unionstate.16.d:0 "曾经在美国遍地可寻的那些关于贪婪与背叛的传说，如今全部被浓缩在这部名为《麦克梯格》的新电影中。这部由埃里希·冯·施特罗海姆执导的关于财富的腐败力量的社会评论性电影目前被许多人视为美国内战的一个暗喻。这部长达四小时的史诗巨片的结局与弗兰克·诺里斯所写原著不同，原著中一个善良的陌生人介入了麦克梯格的死亡挣扎，将他从死亡谷带回了文明世界。"
 unionstate.16.a:0 "（从睡梦中醒来）结束了吗……额啊，这部电影真棒"
 unionstate.17.t:0 "“赤匪深层政府”"
 unionstate.17.d:0 "公众对我们的“财富共享”计划和“人人皆为王”理念的理解主要基于歌曲和口号。虽然今天许多美国人都在附和我们的观点，但仍有许多民主党人，特别是德克萨斯地区的，坚持说，我们其实是社会主义的秘密信徒，我们的政策正在把美国往赤化的道路上发展。他们的指控显然在损害我们在国内的声誉，也许我们应该给予德克萨斯更多的自治权来平息他们的指责。"
 unionstate.17.a:0 "才不是，这个是 国 家 项 目"
 unionstate.17.b:0 "给予我们的德克萨斯盟友自治"
 unionstate.18.t:0 "超人大战三K党"
 unionstate.18.d:0 "“喂！快往天上看！不！我不是要抢你的傻帽子，那是真的超人！他将把美国从三K党的恐怖中拯救出来！”这部新出版的系列漫画是杰瑞·西格尔和约瑟夫·舒斯特与反三K党理念倡导者斯泰森·肯尼迪合作开发的新企划。这个备受公众欢迎的故事成功地使非法组织进一步陷入困境，考虑到他们对我们国家造成的伤害，这还不够呢。"
 unionstate.18.a:0 "孩子们爱它"
 unionstate.19.t:0 "州长厄尔·朗对示威者开火"
 unionstate.19.d:0 "长期以来，州长厄尔·朗一直在努力回避涉嫌腐败与资金管理不善的指控。厄尔是总统休伊·朗的弟弟，因此得以被免于起诉，媒体对关于他的事件也通常处理得很微妙。厄尔的行政部门负责将退伍军人福利和基本收入分配给路易斯安那州的人民，并假定所有忠诚的美国人都能够享受这项福利。然而包括数百名退伍军人和来自北路易斯安那州一部分穷人在内的许多关心此事的公民已经聚集到巴吞鲁日，声称厄尔·朗扣留了他们的收入和福利。州长厄尔试图对人群发表演讲，声称资金还没有从国会大厦到达并且要求在当天结束前解散。然而抗议者中有不少是黑人退伍军人，他们开始高呼要求厄尔辞职。尽管各方对接下来发生的事情的说法不一，但抗议者中有20至50人死亡。现在该由休伊总统来收拾残局了。厄尔州长请求他的哥哥能够帮助他控制损失。媒体的反应还没有达到狂热的地步，而休伊的任何举动都可能在目前左右公众舆论。"
 unionstate.19.a:0 "参加抗议者的葬礼"
 unionstate.19.b:0 "帮厄尔掩饰一下"
 unionstate.20.t:0 "《黑色不再》"
 unionstate.20.d:0 "美国作家乔治·斯凯勒的作品《黑色不再》已在书店上架并激发了美国人的政治大讨论。在这本科幻小说中，一位科学家发明了一种能使黑人变白的机器。这项发明颠覆了社会，挑战了种族界限和“一滴血原则”。随着剧情的推进，这本书逐渐揭示了其中的所有人物，无论他们曾是白人还是黑人，其实都是白人与黑人的混血儿，种族至上的原则彻底崩溃了。虽然有人担心这本书会因为同时隐晦地攻击了白人至上主义者与黑人领袖而受到审查，但现在看来[TEX.GetLeader]总统似乎很喜欢这本书。"
 unionstate.20.a:0 "只要不冒犯我就行"
 unionstate.21.t:0 "要求选举！"
 unionstate.21.d:0 "形势愈发明朗，联盟国正意图继承原美国政府的衣钵，要求以民主选举之方式决定未来领导人的呼声也随之水涨船高。更何况，在战前朗总统与至上党都表明了自身的民主意愿。这种表态为我们吸引了一定的支持，但也更使得我们如今不得不暂且同意选举。在这一主张效仿美国旧有的选举制度重建政治架构的浪潮中，进步党派和民主党残党的呼声最高。由于我们需要依靠他们的支持来维持国家稳定，我们现在只能赞同他们的意见。当然，如果接下来至上党的支持度与朗总统的权威已经足够高，我们也就会有耍弄政治手腕的空间..."
 unionstate.21.a:0 "权且应下..."
 unionstate.22.t:0 "基督教党成立"
 unionstate.22.d:0 "随着威廉·达德利·佩利领导下的银色军团的壮大和政府召开大选的公布，他组建的基督教党宣布将参加下一次选举。基督教党提倡包括财富分配和充分就业在内的进步经济政策，结合新教民主的平台，受到了至上党右翼势力和现在处于颓势的民主党的支持。也许我们应该迎合党内右翼势力，以阻止他们支持基督教党？"
 unionstate.22.a:0 "这弊大于利"
 unionstate.22.b:0 "是的，当然"
 unionstate.23.t:0 "朗的同党失踪！"
 unionstate.23.d:0 "本周早些时候，路易斯安那州发生了一桩令人震惊的新闻：据说路易斯安那刑事鉴定局的成员闯入了朗的秘书兼绯闻情人的叔叔，萨姆·厄比的房间，却发现萨姆已经不知所踪。这对反对派来说是一次打击，据说他们一直在找萨姆质询朗与萨姆的侄女是否发生了婚外情。有人已经开始猜测这是一场绑架，但朗和他的秘书都没有对此发表评论。"
 unionstate.23.a:0 "令人震惊！"
 unionstate.24.t:0 "失踪的人重新出现！"
 unionstate.24.d:0 "本周早些时候被广泛报道认为遭到绑架的人，萨姆·厄比，已经安然无恙地出现了！厄比声称他躲藏起来只是为了甩掉“暴力催贷者”，事实上很少有人相信他所说的话。至上党反对者指责朗在选举结束前把厄比藏了起来，以避免媒体从他身上挖出有关朗的丑闻，但身穿一身豪华新装的厄比声称，这全部都是诽谤，你们啊，图样图森破。"
 unionstate.24.a:0 "气笑了"
 unionstate.25.t:0 "新选举！"
 unionstate.25.d:0 "新一轮选举在即，执政党是时候从传统的两党挑战者那里捍卫自己的地位了。"
 unionstate.25.a:0 "美利坚至上党胜利"
 unionstate.25.b:0 "基督教党胜利"
 unionstate.25.c:0 "国家进步党胜利"
 unionstate.25.e:0 "神圣美利坚联盟"
 unionstate.25.f:0 "我们赢得了连任！"
 unionstate.25.g:0 "W·李·奥丹尼尔的德克萨斯民主党"
 unionstate.25.h:0 "E·W·马兰的民主党"
 unionstate.26.t:0 "德克萨斯恶魔"
 unionstate.26.d:0 "德克萨斯游骑兵如今处在我们的管辖之下，他们的领导李·西蒙斯上校对我们忠心耿耿。由于目前游骑兵正在努力遏制我国国内许多恐怖主义的威胁，李要求我们批准一项计划，让著名的游骑兵弗兰克·哈默再次在我们的领土上对三K党发起攻势，并为此提供资金。这无疑会削弱三K党的势力，但也许他们把努力花在其他地方才更有用？"
 unionstate.26.a:0 "准许"
 unionstate.26.b:0 "取而代之的对付劫匪们"
 unionstate.26.c:0 "让他们帮忙训练部队"
 unionstate.27.t:0 "邦妮与克莱德帮"
 unionstate.27.d:0 "由于犯罪分子希望趁着美国的动荡局势捞上一笔，犯罪团体在全国境内愈发猖獗，而其中一个团体尤其臭名昭著，那就是巴罗帮。巴罗帮的老大是耸人听闻的罪犯夫妇——克莱德·巴罗和邦妮·帕克。整个团伙的犯罪活动主要包括抢劫，有时甚至会盯上银行，越来越多的执法人员遭受他们毒害，部分原因是这只犯罪团伙的火力强大。令人闻风丧胆的克莱德·巴罗本人就随身带着一把勃朗宁自动步枪。不幸的是，这个团伙现在获得了不应有的民望，影响着我国的合法性，我们该如何应对？"
 unionstate.27.a:0 "派出德克萨斯游骑兵"
 unionstate.27.b:0 "派出国民警卫队"
 unionstate.27.c:0 "我们没有足够的资源"
 unionstate.28.t:0 "彭德格斯特政治机器"
 unionstate.28.d:0 "汤姆·彭德格斯特是堪萨斯城与杰克逊郡享有盛名的政治领袖，那里简直成了他的封地。不过，他对宪政国并不十分欢迎，因为宪政国希望用旧民主党和其他更为强硬的白人至上主义者和种族隔离主义者取代他，破坏他建立的体系。宪政国认为彭德格斯特是个自私牟利的恶徒，虽然老实说，他确实就是，但这使得对于他与我们来说，宪政国都成了更大的问题，于是他转而对我们寻求保护。纳入他的政治机器会削弱至上党的权势，这并不完全受到党内成员的欢迎，但也无疑，联盟国将会获得更多的资源，比如说堪萨斯的兵源，以及彭德格斯特的犯罪盟友的帮助。这无疑将倾斜我们与宪政国之间的力量平衡。不过另一方面，我们也可以冒更大的风险，威胁他如果他不滚蛋就发起控告，打压他在堪萨斯的势力与其盟友查尔斯·卡罗尔运转的犯罪团体，建立至上党自己的政治机器。我们该怎么做？"
 unionstate.28.a:0 "建立同盟"
 unionstate.28.b:0 "堪萨斯城太小，容不下两尊大佛"
 unionstate.29.t:0 "南方佃农联盟"
 unionstate.29.d:0 "南方佃农联盟是一个在我国领土内合法运作的左翼佃农机构，它支持联盟国推翻右翼的宪政国，因而遭到了宪政国的极力镇压。佃农联盟是我们潜在的盟友，如果我们能为其提供资金，或是让其领导人哈里·利兰·米切尔进入内阁的话，他们就可以帮助我们在宪政国的内部推波助澜。然而，党内有些人不支持这项举措，因为众所周知，尽管南方佃农联盟的总部不在联合工团，但它对联合工团有着强烈的同情。为佃农联盟提供支持虽会帮助我们巩固势力，但也会增强国内的社会主义势力，激怒一直敌视其种族进步姿态的社会保守派。"
 unionstate.29.a:0 "提供一些支持"
 unionstate.29.b:0 "给他们内阁职位"
 unionstate.29.c:0 "我不这么认为"
 unionstate.30.t:0 "进步派的合并提议"
 unionstate.30.d:0 "中西部进步派组织和农民劳工组织一直是休伊·朗在国会以及联盟国长期的盟友，尽管由于对朗的民粹主义风格和煽动手腕的看法分歧，我们之间的关系偶尔会紧张。不过，最近的一项提议有望加强我们之间的联盟。这项提议来自阿尔弗雷德·米切尔·宾厄姆，一位激进派活动家和期刊《常识》的主编，他支持进步派、至上党乃至于联合工团里的偏右翼势力，现在他正负责管理美国农民劳工联合会。美国农民劳工联合会由中产背景的工人阶级活动家组成，与至上党、进步派甚至联合工团的贝拉米派都有联系。尽管联合会向来在经济问题秉承灵活性原则，但在农产品上它始终坚持计划经济的立场，最近宾厄姆和其他联合会成员已经开始将至上党视为通往社会爱国主义的未来的最佳途径。他们提议建立美利坚联邦合作运动，依靠这个运动举起的大旗，他们可以公开加入至上党政治联盟。虽然这会加深左翼活动家对于我们的支持，并削弱国家进步党，但也可能会把我们与左翼经济政策捆绑在一起——部分党员恐怕是不能接受这一点的。"
 unionstate.30.a:0 "当然不"
 unionstate.30.b:0 "当然，这是一个极好的机会"
 unionstate.34.t:0 "富豪的命运"
 unionstate.34.d:0 "美国最富有的家族们，如洛克菲勒和摩根与麦克阿瑟结盟，试图摧毁朗和他的财富限额议案，因为这议案会让他们的财产大大缩水。然而，他们的赌博失败了。他们逃离美国后，我们已经控制了他们留在美国的企业。对于剩下的大股东来说，我们将不得不决定是应该完全控制这些企业，并将其出售给新的股东，还是允许他们支付罚款，重新获得在新管理层领导下的企业。"
 unionstate.34.a:0 "收回他们所有的有罪资产"
 unionstate.34.b:0 "大笔罚款就足够了"
 unionstate.35.t:0 "史密斯脱党！"
 unionstate.35.d:0 "杰拉尔德·L·K·史密斯终于“受够了”我党的左倾倾向，并宣布他将正式加入基督教党，还声称我们不愿对抗犹太势力和工团激进分子，背叛了美国人民。他顺便带走了至上党大部分的右翼人士，使我们不得不更依赖于前左派人士的投票。"
 unionstate.35.a:0 "无可奈何"
 unionstate.36.t:0 "弗吉尔·埃芬格被毙！"
 unionstate.36.d:0 "今天在田纳西州的一座小屋里，弗吉尔·埃芬格和12名黑色军团成员被一分钟人民兵击杀，民兵们一路追踪他们，并在夜深人静时向他们躲藏的木屋射击。黑色军团已经认定这是一项战争罪行，声称埃芬格不仅没有获得投降的机会，而且黑色军团的守卫在发出警告之前就被杀了，这意味着民兵们根本不愿给他们投降的机会。然而，这次行动引发了美国各地的庆祝，领导这次突袭行动的游骑兵曼努埃尔·T·冈萨乌拉已经被授予了奖章，因为此举无疑将逼迫黑色军团屈膝投降。"
 unionstate.36.a:0 "胜上加胜！"
 unionstate.38.t:0 "宽恕三K党？"
 unionstate.38.d:0 "既然我们决定和南方的保守派和解，我们必须决定要在多大程度上对三K党宽大处理。我们是应该宽恕那些单纯宣誓效忠的下层成员，还是干脆要求南部美利坚至上党把他们统统关进监狱，尽量把三K党的存在压制到最低限度，并威胁他们再敢露面就加以报复。"
 unionstate.38.a:0 "宽恕他们"
 unionstate.38.b:0 "不行，我们不能让三K党再次崛起"
 unionstate.39.t:0 "南部地区领导人"
 unionstate.39.d:0 "为了我们的利益，美利坚至上党利用南部地区的旧民主党政治机器成功地向南扩展，但是应该由谁在深南部领导这个旧民主党的政治机器？一个选择是小理查德·罗素，他在战争期间是一个众所周知的温和派，也是宪政国中最不情愿的成员之一，他公开表示过希望宪政国能向中间派靠拢，但对许多人来说他仍然过于社会保守主义。还有一位是詹姆斯·伊斯特兰，他在种族问题上更为强硬，但对朗的经济议程却更为开放。最后，我们可以牵线让厄尔·朗负责这个地区。"
 unionstate.39.a:0 "小理查德·罗素"
 unionstate.39.c:0 "厄尔·朗"
 unionstate.39.b:0 "詹姆斯·伊斯特兰"
 unionstate.40.t:0 "黑人财富共享支部关门"
 unionstate.40.d:0 "由于我们决定与南方旧民主党和解，并在政治上把黑人排挤出去，黑人们感到自己惨遭背叛，许多黑人分享财富俱乐部都已关门，其中最负盛名的一家由黑人牧师J·H·斯科特运作，他称朗是一条毒蛇，背叛了那些为他流血流汗的黑人，去偏袒那些只会为了政治权力而毁掉他的投机者，他说朗最终也会背叛那些贫穷的白人。"
 unionstate.40.a:0 "该死！"
 unionstate.41.t:0 "达拉斯三K党袭击我们的财富共享俱乐部！"
 unionstate.41.d:0 "众所周知，达拉斯三K党与美国三K党的关系十分暧昧，不过他们并没有直接站在宪政国一边，这使他们免于遭受摧毁了其他三K党的联盟国镇压行动。然而，随着我们对黑人投票权的支持，他们似乎认为错看了我们，开始袭击我们在当地的财富共享俱乐部，随后又向支持休伊·朗的黑人牧师发出恐吓信。我们该怎么办？"
 unionstate.41.a:0 "现在，专心解决他们"
 unionstate.41.b:0 "我们稍后再处理……"
 unionstate.42.t:0 "美利坚至上党南方地区领导"
 unionstate.42.d:0 "由于至上党的政治机器已将南部旧民主党取而代之，我们需要委托一位领导人来确保我们的支持者，包括黑人选民们，不会被排挤出当地的投票名单。我们可以让忠诚已久的老拉什·林博负责，在战争期间他一直在此地领导着至上党分支。另一个选择是内战的老兵、至上党的新星西德·麦克马斯。最后，我们可以牵线让厄尔·朗负责。"
 unionstate.42.a:0 "老拉什·林博"
 unionstate.42.b:0 "西德·麦克马斯"
 unionstate.42.c:0 "厄尔·朗"
 unionstate.43.t:0 "旧民主党人抵抗！"
 unionstate.43.d:0 "南方的勋贵中似乎有一股旧民主党复兴的风潮，他们抵制我们吸纳他们的企图，并资助当地三K党组织对我们袭击。虽然我们能及时应对，但损害仍不可避免。"
 unionstate.43.a:0 "该死！"
 unionstate.44.t:0 "新电影：入主白宫一百天！"
 unionstate.44.d:0 "好莱坞最新的政治片大获成功！《入主白宫一百天》是由格雷戈里·拉·卡瓦执导的一部关于休伊·朗赢得美国内战后，为美国带来和平与繁荣的第一个一百天的电影。开幕式上，真正的休伊·朗亲自出席为这部电影背书，并祝愿所有的美国人民生活幸福，评论家们声称，这部由至上党资助的影片只不过政府的一次宣传而已。尽管如此，它仍然受到许多美国人民的欢迎，因为他们希望看到一个乐观的国家，一个团结的承诺和一个愿意保护他们的领导人。"
 unionstate.44.a:0 "太好了！"
 unionstate.45.t:0 "标准石油的命运"
 unionstate.45.d:0 "既然标准石油已经束手，我们决定将路易斯安那州地区的石油置于政府直接控制之下。然而，国家其他地区的石油储备的命运一直备受争议，一些人希望我们将标准石油拆分成多个公司，美国政府只持有其中一部分，而至上党的强硬派则希望我们将全国的石油国有化，将由此而来的资金用于国家项目。"
 unionstate.45.a:0 "拆分它"
 unionstate.45.b:0 "完全国有化"
 unionstate.46.t:0 "国会权力"
 unionstate.46.d:0 "休伊·朗已经明确表示，除非事态紧急，否则他不会再离开白宫。他签署了扩大总统权力的行政法案，并宣布至上党如今将成为几乎不可挑战的政府组织，且对总统大选投票拥有完全控制权，同时，一分钟人的政治地位也将被上调至正规军队之上。剩下的只有国会这个问题，一些至上党成员声称，应该允许在国会和最高法院保留合法的反对派。又或者，依靠由强硬派提出并得到路易斯安那政治机器和汤森支持的《保护美国法案》将有效地赋予总统充分的立法权和司法权，以及逼迫麻烦的国会议员下台的权力。但是，在通过《保护美国法案》后，哪怕仍存在着地方选举，人民也可以通过市议会跟政党机器或政府进行互动，也标志着美国的民主外衣自此被直白剥下。"
 unionstate.46.a:0 "通过该法案"
 unionstate.47.t:0 "全国抗议"
 unionstate.47.d:0 "保护美国法案在全国范围内引发了汹涌的抗议浪潮，民众群起反对朗宣称自己为美国独裁者的行为。美利坚公民自由联盟的倡议者们在路易斯安那州和华盛顿特区组织了规模最大的抗议活动，因为这两个地方象征着至上党政治机器与美国政府。至上党内部人士认为，应对措施采取恐吓记者这样的轻微策略就足够了，但是厄尔·朗希望通过国民警卫队彻底驱散压制抗议活动。"
 unionstate.47.a:0 "恐吓美利坚公民自由联盟"
 unionstate.47.b:0 "镇压抗议者"
 unionstate.48.t:0 "财富共享俱乐部全国走俏"
 unionstate.48.d:0 "财富共享俱乐部在全国范围内正迅速变得像教堂一样受欢迎，越来越多的美国人不再仅出于政治观点利用这些俱乐部，而是借此举办从社区服务到扑克大赛到读书会等各种团体活动。正因为如此，国家财富共享组织提议增加对它们的资金投入，扩大财富关系俱乐部的存在感，因为它不仅已经成为财富再分配的组成部分，更在成为公民活动的组成部分。"
 unionstate.48.a:0 "理所当然"
 unionstate.48.b:0 "一 切 顺 利"
 unionstate.49.t:0 "大主教寻求支持"
 unionstate.49.d:0 "许多美国的天主教教区大主教本来就视朗为对抗三K党和社会党的有用盟友，由于感觉受到了查尔斯·库格林在天主教民众中的影响的威胁，他们开始支持朗的“再分配”，其中最著名的是大主教爱德华·阿洛伊修斯·穆尼，他现在公开拥护朗的政权。不过私下里，爱德华大主教希望朗能增加对天主教教区的资助，能长期维持与天主教国家的友谊，并能允许天主教移民更容易入籍。然而，库格林的支持者并不希望达成任何这样的协议，他们认为朗不应该在没有得到他们批准的情况下达成协议，因为他们对这位现在才投身自己这方阵营的大主教深表怀疑。不过，大主教们纷纷承诺只要协议达成，都愿意支持朗的事业。"
 unionstate.49.a:0 "同意"
 unionstate.49.b:0 "不，施恩于我们的是天主教选民的支持，而不是教会"
 unionstate.50.t:0 "财政部要求资本管制！"
 unionstate.50.d:0 "很明显，朗已经铁了心要实行他的“财富分享”计划，许多人担心，刚刚才被我们从社会主义革命中拯救出来的资本家们，现在就要带着他们的财富逃离这个国家了！财政部、国税局和内政部向我们提出了警告，并请求我们实施资本管制，这将使富人离开美国更加困难。他们提出了两项计划，其一是对富人携带出国的财产数量进行限制，另一项计划则是对资本家对外国的投资征税，并迫使那些迁居外国的资本家支付一笔费用，而这笔费用将高到骇人听闻，以震慑他们迁居的意图。"
 unionstate.50.a:0 "限制富人的资本转移"
 unionstate.50.b:0 "重税重罚"
 unionstate.51.t:0 "一分钟人请求取消演讲！"
 unionstate.51.d.right:0 "在接到有人可能会刺杀休伊·朗的报告后，一分钟人民兵请求朗取消他将在俄亥俄州进行的巡回演讲。然而，这将严重影响朗争取公众支持的竞选活动，并可能使他看起来很软弱，影响至上党的支持率，但大多数安保卫队仍请愿朗能取消行程，因为他们真的担心社会主义残余分子利用这次机会发动袭击。"
 unionstate.51.d.left:0 "在接到有人可能会刺杀休伊·朗的报告后，一分钟人民兵请求朗取消他将在德克萨斯州进行的巡回演讲。然而，这将严重影响朗争取公众支持的竞选活动，并可能使他看起来软弱可欺，影响至上党的支持率，但大多数安保卫队仍请愿朗能取消行程，因为他们真的担心达拉斯三K党的残余分子利用这次机会发动袭击。"
 unionstate.51.a:0 "知道了，不必在意"
 unionstate.52.t:0 "墨菲牧场的命运"
 unionstate.52.d:0 "现在我们的军团的控制区已经从大西洋海岸延绵到太平洋，为此我们决定重访在佩利计划中我们在洛杉矶郊区的“最后防线”。这栋建筑名为“墨菲牧场”的建筑原本是为了在工团主义者得势的情况下保护和藏匿银色军团成员而建立的。作为我们的“家园”，现在他已经具备了展开全面运营的能力。我们应该继续加固这座“家园”来保护我们在加州的新兄弟吗？或者我们应该把这片土地变成我们新生美利坚国家的工厂车间？"
 unionstate.52.a:0 "加固它"
 unionstate.52.b:0 "改造它"
 unionstate.53.t:0 "你真的认识真正的佩利吗？"
 unionstate.53.d:0 "虽然只有银色军团的最高级别成员们才知道，我们的领袖佩利的头脑比世人所了解的更具深度。对他最亲密的朋友们来说，佩利不仅仅是一个领导者与他们的朋友，更是他们在政治、宗教与道德问题上的向导。至今为止，他们都很难接受宗教与世俗权威被强制剥离这一事实，佩利的心中有一种念想，就像穆罕默德和耶稣那样，他知晓世界的全部，他那深厚而不可捉摸的秘密教义出于种种原因而不得不对公众隐藏着，俯下神之子的身躯以另一副凡人的姿态示人。但是……既然我们伟大而开明的先知已经在这个勇敢的新美国社会被世人所广泛接受，那么我们是否应该把他更多深邃的奥秘公之于众呢？他们会接受他是先知的事实吗？佩利的经纪人似乎已经无法再劝阻他将自己更深层的想法公之于众，那么……佩利的神秘足以载入世界的史册吗？"
 unionstate.53.a:0 "太多人会对此感到恐惧"
 unionstate.53.b:0 "世界准备好了"
 unionstate.54.t:0 "佩利的演讲引起了争论！"
 unionstate.54.d:0 "在一次有争议的演讲期间，总统候选人威廉·达德利·佩利公开提出了一套被他称为“分区制度”的制度，用来针对那些来自不同群体但都被贴上“不具生产力”的标签的人，这将确保他们在被视为具有生产力，也就是投身劳务之前不能获得联邦的全部福利。这番言论自然招来了大量的批评，但同时也吸引来了一些前民主党人和支持种族保守主义的共和党人，尽管佩利宣称分区制度是和旧民主党的种族隔离是“截然不同”的。也许大声疾呼对这个系统的反对可以增加黑人和自由派投我们的票数，尽管这也可能赶走我们的一些选民。"
 unionstate.54.a:0 "谴责他的演讲"
 unionstate.54.b:0 "什么都不做"
 unionstate.55.t:0 "银衫车队！"
 unionstate.55.d:0 "佩利总统出人意料地赢得了选举胜利，很明显，他需要进一步获得基层的支持，如果他想让他雄心勃勃的计划成功的话。他与他的顾问开了几次会后，总统认为他已经提出了一个关于此事的理想的计划，一个由基督教党和银色军团成员举办的全国范围的巡回游行。现场观看，电台广播和录音播放后显示了一个事实，现在在银色军团内部被称为银衫车队的组织肯定会把我们的信息传播得比以往任何时候都远。"
 unionstate.55.a:0 "资助它罢"
 unionstate.55.b:0 "这次还是等等吧"
 unionstate.56.t:0 "种族隔离犹太人"
 unionstate.56.d:0 "随着我们计划的不断实施，总统的一个颇有争议的想法再次出现。在佩利看来，随着美国犹太人对资本主义和工团主义制度的影响，以及越来越多具有政治观点的外邦人的出现，目前需要暂时剥夺他们的某些权利——我们将宣称是为了保护他们自己。根据该计划，每个州的犹太人将被转移到一个城市，直到基督联邦体系完全实施，届时总统承诺他们将再次获得完全的权利。尽管他已经做出了承诺，但这一想法已经激怒了相当一部分人，他们声称这将导致大规模的虐待和其他侵犯人权的行为，另一方面，基督教党内的强硬派要求立即实施该计划。似乎无论我们做出什么选择，都会给我们的未来带来更多的问题。"
 unionstate.56.a:0 "实施吧"
 unionstate.56.b:0 "这件事的争议太大了，搁置吧"
 unionstate.57.t:0 "我们的问题儿童"
 unionstate.57.d:0 "近年来，基督教党已经发展成为美国最大的政党之一，然而，这并不表示它没有自身的一系列问题。基督教党的一些成员，尤其是加州的成员，已经将他们的言论凌驾于国家领导层之上。亨利·D·艾伦派以及越来越有争议的杰拉尔德·L·K·史密斯都拥护激进的种族主义理论，并提倡诸如将犹太人大规模驱逐出美国之类的思想，这些群体正日益损害着总统的形象，我们需要选择一种处理当前情况的最好方式，威拉德·坎普提出通过私人对话和威胁驱逐他们来帮助我们控制这些人。"
 unionstate.57.a:0 "什么都不做"
 unionstate.57.b:0 "限制他们"
 unionstate.58.t:0 "缓慢发展的灵魂工艺"
 unionstate.58.d:0 "佩利总统的信仰中比较奇怪的一点是他对基督教的让人难以理解的处理方式。在过去的几年中以几个不同的名字为人所知的，现在被人们称作《灵魂工艺》的学说在佩利的管理下有了缓慢但稳步的发展。但与此同时同时总统已经暂停任何有关此事的新出版物的出版以避免涉及第一修正案，但在这之前的作品，如《黄金手稿》的销量变得更多了，而且越来越多的人似乎愿意开放的探索总统在政治和经济方面的观点，不仅如此，他们还愿意探索总统在精神方面的观点。当然，这也获得了来自诸如洛杉矶时报等报纸的嘲笑。他们嘲笑佩利为“宗师”，这使得党内许多人不愿进一步推动关于总统精神观点的探索。"
 unionstate.58.a:0 "出版更多的《灵魂工艺》"
 unionstate.58.b:0 "长势喜人啊"
 unionstate.59.t:0 "呼叫支持"
 unionstate.59.d:0 "总统是美国最有权势的人已经不是什么秘密了，但即使一个有权有势的人有时也需要支持和帮助。在他担任总统前的几年里，佩利通过他的著作以及在银色军团的领导地位在几个领域——特别是在金融、工业和政治领域获得了大量的人脉。当我们的计划正在迅速实施，领袖眼中的理想美国在一天天变得更加真实的时候，寻求这些人的支持和“未偿债务”可能会更加明智——即使这可能看起来不受大众欢迎。"
 unionstate.59.a:0 "当然了"
 unionstate.59.b:0 "算了，这是腐败行为"
 unionstate.60.t:0 "埃芬格被捕！"
 unionstate.60.d:0 "黑色军团的首领弗吉尔·埃芬格被我们的军队抓获，军队发现了他的藏身之处，并迫使他和他的保镖投降。现在，埃芬格和他的高层将被我们的政府审判，但是司法部长询问我们是否应该要求处死他？虽然我们队伍中的一些积极分子更乐意坚持我们反对死刑的立场，而大多数人都认为我们应该支持处死埃芬格。虽然埃芬格肯定会被定罪，但我们的抉择将会决定他的命运。"
 unionstate.60.a:0 "死刑"
 unionstate.60.b:0 "终身监禁"
 unionstate.61.t:0 "剪彩"
 unionstate.61.d:0 "随着普朗布计划的推行，[TEX.GetLeader]在威斯康星州为圣塔菲铁路公司的一条新铁路剪彩，这条新铁路由业主、工人和公众共同经营。虽然最初实施这项计划的成本高昂，但此次事件广受欢迎，许多美国人开始期待着美国新时代的到来，许多受到影响的铁路公司工会也开始认为自由化改革要优于工团主义政策。"
 unionstate.61.a:0 "太好了！"
 unionstate.62.t:0 "支持杜威主义？"
 unionstate.62.d:0 "约翰·杜威是联合工团的一名社会爱国主义者，但他同情我们，多次尝试推动工团与我们联盟国达成和平，他的许多追随者也加入了我们的行列。因此，他的追随者认为，我们应该利用重新调整教育系统的机会，将杜威“适度放手教学和鼓励自学”的理论应用于我们的学校，他们认为这样做可以更好地帮助我们的孩子成长为优秀的公民。传统教师当然反对这种模式。"
 unionstate.62.a:0 "遵从老方法"
 unionstate.62.b:0 "接纳杜威主义"
 unionstate.63.t:0 "朗谴责国家进步党！"
 unionstate.63.d:0 "休伊·朗反对我们的“下水道社会主义”，认为它在重新分配财富方面做得还不够，同时也把太多的权力留给了不能代表“人民意愿”的官僚。我们已经回应了关于朗的腐败指控，但他的话语在一些人中间引起了共鸣，这些人认为，朗会采取进一步措施来消除经济上的不平等——尽管我们的经济学家认为这只是做做样子。"
 unionstate.63.a:0 "混账东西！"
 unionstate.64.t:0 "黑人的支持？"
 unionstate.64.d:0 "全国有色人种协进会请求我们出力支持黑人工人，消除在参与政府项目时黑人工人会面临的种族障碍，并将黑人们也接纳进我们的农民劳工组织。这自然在党内引起了争议，尽管许多进步派人士坚决赞成这样的措施，另一些人仍然感到紧张，认为这可能会导致民族主义者的反弹，他们还提出我们在选举期间的黑人支持率并不高。"
 unionstate.64.a:0 "与全国有色人种协进会合作"
 unionstate.64.b:0 "我们还没准备好"
 unionstate.65.t:0 "国家进步党吸纳了农民劳工党"
 unionstate.65.d:0 "在结束了与明尼苏达州农民劳工党及其领导人（比如埃尔默·奥斯汀·本森）的谈判后，我们终于成功使明尼苏达州农民劳工党成为了国家进步党的一翼！那么，我们应该让它们维持半自主的地位，还是将它们完全吸收到国进党中？"
 unionstate.65.a:0 "吸纳他们"
 unionstate.65.b:0 "给他们一些自治权"
 unionstate.66.t:0 "大型承包商提议协助"
 unionstate.66.d:0 "虽然我们承诺过国家项目要支持小型的承包商公司，但基威特公司刚刚提出了一个非常有利可图的提议——与我们的政府一道重建内布拉斯加州。这将比组织许多小型承包商协力工作成本更低、效率更高、速度更快，能帮助国家更快地重新振作。然而，无疑内布拉斯加州的小型承包商们会认为这是政府的背叛，即使我们愿意让基威特公司与他们合作。"
 unionstate.66.a:0 "和基威特公司合作"
 unionstate.66.b:0 "我们要遵守诺言"
 unionstate.71.t:0 "[From.GetNameDefCap]希望加入协约国"
 unionstate.71.d:0 "[From.GetNameDefCap]大使求见国王和首相，希望能让[From.GetNameDefCap]加入协约国。我们应该接受美国的提议吗？"
 unionstate.71.a:0 "当然！我们欢迎他们"
 unionstate.71.b:0 "我们不需要他们"
 unionstate.72.t:0 "[From.GetNameDefCap]拒绝"
 unionstate.72.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 unionstate.72.a:0 "他们做了个糟糕的决定"
 unionstate.73.t:0 "[From.GetNameDefCap]想要加入帝国公约"
 unionstate.73.d:0 "[From.GetNameDefCap]大使求见皇帝陛下和宰相，希望能让[From.GetNameDefCap]拥入帝国公约的怀抱。我们应该接受美国人的提议吗？"
 unionstate.73.a:0 "当然！我们欢迎他们"
 unionstate.73.b:0 "我们不需要他们"
 unionstate.74.t:0 "[From.GetNameDefCap]拒绝"
 unionstate.74.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 unionstate.74.a:0 "他们做了个糟糕的决定"
 unionstate.75.t:0 "[From.GetNameDefCap]希望与俄罗斯结盟"
 unionstate.75.d:0 "[From.GetNameDefCap]大使求见首相，希望能在美俄之间建立起同盟关系。我们应该接受美国人的提议吗？"
 unionstate.75.a:0 "当然！我们欢迎他们"
 unionstate.75.b:0 "我们不需要他们"
 unionstate.76.t:0 "[From.GetNameDefCap]拒绝"
 unionstate.76.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 unionstate.76.a:0 "对他们来说，这是一个糟糕的决定"
 unionstate.77.t:0 "“财富共享计划”董事会任命史密斯为他们的代表"
 unionstate.77.d:0 "“财富共享”计划董事会成员们日前举行了一次临时会议。该组织的股东包括美利坚至上党、禁酒令党和南方佃农联盟的成员。这些董事会成员在凌晨2点开会，跨越了公务与保密的界限。会议期间禁酒党成员威廉·厄普肖将休伊·朗总统对其政党价值观的明显背叛推到前台。来自美利坚至上党的董事会成员同意休伊·朗总统如此对抗他们的主要的竞选承诺反而会刺激未来更多“以道德为中心”的立法出台。为推动其养老金循环计划而支持休伊·朗的弗朗西斯·汤森，也同意有必要为“财富共享”计划选出一位不会受总统的“一时兴起”影响的新代表。经过多轮辩论，大会一致认为，新当选的路易斯安那州议员杰拉尔德·L·K·史密斯虽然仍和休伊·朗差得很远，但至少愿意致力于社会保障事业。随着投票结果逐渐有利于史密斯，董事会成员们开始思考史密斯与银色军团的联系在未来可能意味着什么……"
 unionstate.77.a:0 "他们竟敢这么做！"
 unionstate.78.t:0 "南方民主党人指控美利坚至上党腐败"
 unionstate.78.d:0 "华盛顿的敌对状态结束后，一大部分民主党保守派成员宣誓效忠于[Root.GetNameDef]和休伊·朗总统长期以来追随的理想。这些南方民主党人含蓄地表达了希望休伊·朗能满足他们对获得更多国家权力的渴望，作为交换，他们将确保休伊·朗的经济改革能够顺利通过。然而双方这一不成文的联盟在休伊·朗拒绝按他们的意愿颁布禁酒令并无视他们为支持废除《州际贸易法》而进行的慷慨激昂的演讲之后，这种默契恐怕已经很难继续维持下去了。许多保守派民主党人现在认定，美利坚至上党的政权不过是一种虚假的民主制度，并因此拒绝支持任何朗和他的政治机器试图推行却无益于个体利益的法案。即便如此，直到本周国会大厅只有3/4的人坐满全场时，总统在震惊之余才开始策划眼下的对策。目前所有的立法进程已经冻结，看来“迪克西党人”正准备一次性休完他们今年所有的年假。"
 unionstate.78.a:0 "蠢货，这里是他们唯一的家园"
 unionstate.79.t:0 "军官暴乱"
 unionstate.79.d:0 "尽管我们尽了最大努力鼓励军官们在这个敏感的时期继续担任他们的职务，但仍然有接近一百名军官对休伊·朗的结局表达了严重保留意见。新闻界也报道了这些异议，因此我们也收到了更多的警告，五天后军官们将在首都举行“抗议游行”。很难设想这些示威者们的所谓“游行活动”将是和平的，也许他们的游行会以携带武器要求银色军团将权力归还给至上党而达到高潮。仍然领导着第五军的巴顿将军已经承诺会保护我们继续统治联邦的权利，然而毫无疑问的，以他的性格允许他自由地对抗游行者，那背后绝对是一场血腥的战争，结果说不定反而事与愿违。理查德·巴特勒建议我们把银色军团的支持者渗透到游行队伍中，从内部瓦解他们。搅乱军官们的诉求和行动议程，把他们的示威活动变得更像是毫无组织性的寻事生非，这么做虽然被动了些，但总比让政府背负专制的恶名要好得多。"
 unionstate.79.a:0 "让巴顿自由发挥"
 unionstate.79.b:0 "接受巴特勒的计划"
 unionstate.80.t:0 "重建国会"
 unionstate.80.d:0 "我们向南方民主党人报告了休伊·朗被“逮捕”的消息，他们在维护国会的表面形象方面发挥了正面作用。用银色军团成员取代各州代表的繁琐过程意味着在过渡期间我们将越来越依赖于南方民主党人的残余影响力。当佩利领袖推动的22~24号宪法修正案最近得到通过以后，他又引入了一项新的“祖父”条款——以公民祖父所享有的权利为基准，若他的祖父不曾具备，他也不配享有——此外他要求国会议员必须要有正确的宗教信仰。随后议程开始转向佩利的最后一道修正案：征收私人和政府土地，并将土地再分配给基督徒。这道修正案引发了意外的反弹，南方民主党人声称这一举措所涉及的土地征用权将明显妨害各州对州内土地的处分权，就算是休伊·朗也承诺过他不会动摇州权自主。如今佩利领袖面对着进退两难的形势。如果他向南方民主党人屈服，就会使他在最需要打扮的像个“万事通”的时候使自己看上去虚弱无力。但是如果他像许多顾问建议的那样采取强硬手段通过修正案，这将驱散这个国家所迫切需要维持的民主幻想。"
 unionstate.80.a:0 "各州可拥有自己的权利——至少现在"
 unionstate.80.b:0 "你读过马太福音第20章26~27节吗？"
 unionstate.101.t:0 "战争的未来"
 unionstate.101.d:0 "经过对美国政府部门的长期重组，美利坚联盟国政府发现了一些旧的机密武器提案。最引人注目的两项提议来自罗伯特·戈达德和万尼瓦尔·布什，他们都各自提出了一项研发预算昂贵的武器构想以对抗可能的入侵。幸运的是，我们已将两人从其各自的藏身点请回来，并说服其继续推动自己的研究。戈达德的计划是研制一种液体燃料火箭，能够向远距离发射稳定负荷的爆炸物。万尼瓦尔·布什的理论则是基于欧洲已知的试验，利用核裂变制造一种炸弹。我们要执行哪种方案呢？"
 unionstate.101.a:0 "戈达德的火箭"
 unionstate.101.b:0 "范内瓦·布什的炸弹"
 unionstate.102.t:0 "白沙市导弹飞行实验成功"
 unionstate.102.d:0 "在西南地区进行了几个月的实验并发表了几篇内部论文之后，第一次发射测试终于准备就绪。在新墨西哥州白沙市郊外的一个隔离区域，罗伯特·戈达德的试验火箭已经准备发射。火箭设计融合了戈达德设计的液体燃料与稳定装置以及林德伯格公司设计的飞行机械。导弹的头部安装了低当量的炸药以计划在导弹飞行一段时间后将它引爆。数分钟后，夜空中一条完美的弧线与猛烈的爆炸点燃了新墨西哥的天际线，实验成功了。"
 unionstate.102.a:0 "无处可逃"
 unionstate.103.t:0 "新墨西哥核武器试爆成功"
 unionstate.103.d:0 "联盟国政府与原子武器之间似乎隔了一道又一道的阻碍。起初，由于包括尚未被找到的罗伯特·奥本海默在内的美国物理学家和核专家都缺席了计划。其他几位潜在的候选人则在海外签署了《反核武器人道主义宣言》，公开宣布他们抵制我们的计划。因此，布什不得不转而向工业技术人员求助并延长了理论重构的时间。最终，在乔治·基斯提亚考斯基的协助与大量小型实验的准备下，第一颗实用的原子弹在新墨西哥州进行了实验。为了确保安全，实验小组没有在爆炸范围内安排很多数据采集人员，虽然这场至关重要的测试为众人展示了一场令人印象深刻的爆炸，遗憾的是我们从中得到的信息很少。"
 unionstate.103.a:0 "我们戴上了原子的王冠"
 unionstate.104.t:0 "美国统一"
 unionstate.104.d:0 "美国终于在[Root.GetNameDef]的旗帜下团结起来了。卖国贼和暴君企图毁灭和腐化这个伟大的国家，但我们通过艰苦卓绝的斗争又夺回了她的控制权！然而现在，那些最初没有跟随休伊·朗起义的州开始思考一个问题，这个国家现在是美利坚合众国呢，还是真正的[Root.GetNameDef]呢？许多为我们而战的人渴望的其实是恢复星条旗的稳定，即使事情已经不可逆转地发生了变化……那么我们应该安抚他们，证明休伊·朗最初设想保护的那个美国仍然存在吗？"
 unionstate.104.a:0 "是的！我们即是合众国，现在是，也永远都会是"
 unionstate.104.b:0 "[Root.GetNameDefCap]！美国的继承者！"
 unionstate.105.t:0 "对军工企业的审判"
 unionstate.105.d:0 "许多军火企业在内战时服务于美利坚的叛徒们。现在内战结束了，我们将会让国会召开听证会来决定是否要让这些企业继续活动。在这次听证会中，他们要证明自己的一切行为都是不得已而为之，或者只能被取消一切可能的营业资格并让主管人承担叛国罪名。"
 unionstate.105.a:0 "允许他们再度开张"
 unionstate.105.b:0 "叛徒不配得到赦免"
 unionstate.106.t:0 "对重型设备企业的审判"
 unionstate.106.d:0 "有许多的重型设备企业在内战时服务于美利坚的叛徒们。现在内战结束了，我们将会让国会召开听证会来决定是否要让这些企业继续活动。在这次听证会中，他们要证明自己的一切行为都是不得已而为之，或者只能被取消一切可能的营业资格并让主管人承担叛国罪名。"
 unionstate.106.a:0 "允许他们再度开张"
 unionstate.106.b:0 "叛徒不配得到赦免"
 unionstate.107.t:0 "对航空企业的审判"
 unionstate.107.d:0 "有许多的航空企业在内战时服务于美利坚的叛徒们。现在内战结束了，我们将会让国会召开听证会来决定是否要让这些企业继续活动。在这次听证会中，他们要证明自己的一切行为都是不得已而为之，或者只能被取消一切可能的营业资格并让主管人承担叛国罪名。"
 unionstate.107.a:0 "允许他们再度开张"
 unionstate.107.b:0 "叛徒不配得到赦免"
 unionstate.108.t:0 "对船舶企业的审判"
 unionstate.108.d:0 "有许多的船舶企业在内战时服务于美利坚的叛徒们。现在内战结束了，我们将会让国会召开听证会来决定是否要让这些企业继续活动。在这次听证会中，他们要证明自己的一切行为都是不得已而为之，或者只能被取消一切可能的营业资格并让主管人承担叛国罪名。"
 unionstate.108.a:0 "允许他们再度开张"
 unionstate.108.b:0 "叛徒不配得到赦免"
 unionstate.109.t:0 "对工业企业的审判"
 unionstate.109.d:0 "有许多的产业公司在内战时服务于美利坚的叛徒们。现在内战结束了，我们将会让国会召开听证会来决定是否要让这些企业继续活动。在这次听证会中，他们要证明自己的一切行为都是不得已而为之，或者只能被取消一切可能的营业资格并让主管人承担叛国罪名。"
 unionstate.109.a:0 "允许他们再度开张"
 unionstate.109.b:0 "叛徒不配得到赦免"
 unionstate.151.t:0 "第二次独立宣言"
 unionstate.151.d:0 "尽管许多南方州长主张当场订立新宪法，然而仿法独立战争先驱反抗英国君主暴政的冲动很快占得上风。接下来几天内，与会各方共同在巴吞鲁日起草《第二次独立宣言》，煞费苦心地模仿着美利坚革命最初的狂热。该宣言概述了联邦政府缺乏公民保护意识，在捍卫穷人福利方面存在若干不足，签署者们宣称，组建民兵反抗暴政本是宪法赋予他们的神圣权利，联邦政府的通牒不仅是无效的，更是暴戾而可耻的。"
 unionstate.151.a:0 "天佑吾人基业"
 unionstate.152.t:0 "美利坚联盟国议会正式召开"
 unionstate.152.d:0 "透过秘密渠道传递，数十名国会议员知晓了休伊·朗在巴吞鲁日举行的会议。有些人真心支持朗的事业，有些人参加革命，只是为给自己谋个不错的位置。巴吞鲁日举行的若干会议已经开始在“议会”的面貌下悄悄举行，库格林则有幸出任参席会议的首席参议员。许多知名人士出席了会议，其中就包括以威斯康星州州长菲利普·拉福莱特及其参议员兄弟小罗伯特·拉福莱特为代表的各路忠于朗的州长以及各州代表。鉴于各州反抗联邦政府的决心越来越强，亦拒绝展开有效的谈判，内战爆发似乎已经是必然结果，许多不忠诚的政客已经借助各种手段潜逃到西方……唯一可喜的是，我们相信那些愿意留下来的人将更有意志力接受无尽的挑战，帮助我们夺得最终的胜利。"
 unionstate.152.a:0 "我们会报答他们的！"
 unionstate.153.t:0 "期限迫近"
 unionstate.153.d:0 "联邦政府的最后期限日渐临近，显然双方都不会有任何让步。在朗的支持者控制的地区，一支由民兵与一分钟人构成的军队已组建起来，越来越多的人决心武力改造这个国家。相应地，联邦政府也明确表示，他们不再寄希望于妥协。"
 unionstate.153.a:0 "这只是时间问题"
 unionstate.155.t:0 "美洲人民联盟"
 unionstate.155.d:0 "联盟国向我们提供了一个他们的民粹主义联盟的位置，声称美洲人要相互保护以免受侵略者的侵害，承诺与我们进行有利可图贸易，信誓旦旦地说这是将列强拒之美洲门外的唯一途径。政府内很多人都在要求我们接受，尽管这会影响我们与他人结盟的机会。"
 unionstate.155.a:0 "同意"
 unionstate.155.b:0 "拒绝"
 unionstate.156.t:0 "[FROM.GetNameDefCap]同意"
 unionstate.156.d:0 "[FROM.GetNameDefCap]同意了，我们离美洲和平和军国主义得到抑制都更进了一步！"
 unionstate.156.a:0 "好啊！"
 unionstate.157.t:0 "[FROM.GetNameDefCap]拒绝"
 unionstate.157.d:0 "[FROM.GetNameDefCap]拒绝了我们，让我们都成了笑话和被盯上的目标。"
 unionstate.157.a:0 "白痴！"
 unionstate.158.t:0 "联盟国提出互不侵犯条约"
 unionstate.158.d:0 "联盟国已派遣大使，声明他们无意袭击我们或保护欧洲的帝国主义者，向我们提供了互不干涉的互不侵犯条约。一些人对一个非社会主义国家能提出如此条款感到惊讶，不过这也符合他们的孤立主义政策。而针对这项条款，政府产生了意见分歧，如果同意，我们就可以把国家重心放在欧洲，不用担心后顾之忧，但放弃这笔交易，就有希望为联合工团报仇，将工团主义传入美洲。"
 unionstate.158.a:0 "同意"
 unionstate.158.b:0 "不"
 unionstate.159.t:0 "第三国际接受！"
 unionstate.159.d:0 "第三国际接受了我们的提议！至少我们现在不用担心欧洲革命势力对美洲发起进攻了！"
 unionstate.159.a:0 "好！"
 unionstate.160.t:0 "对加拿大采取行动"
 unionstate.160.d:0 "我们现在把注意力转向了加拿大这个战争贩子，在内战期间他们与我方政权为敌，龟缩在美洲妄图拯救他们的欧洲帝国。联盟国的大部分人士要求我们立即通过禁运来削弱他们，而一些更激进的声音则希望一劳永逸地终结他们，以最终结束美洲地区的战争，因为加拿大的银行家们被指责为大部分战争的罪魁祸首。"
 unionstate.160.a:0 "禁运"
 unionstate.160.b:0 "准备进攻"
 unionstate.160.c:0 "保卫边境就行了"
 unionstate.161.t:0 "我们被禁运了！"
 unionstate.161.d:0 "联盟国及其势力范围内的所有国家都禁运了我们！如果我们不采取行动，我们将不得不承担后果！"
 unionstate.161.a:0 "别无选择"
 unionstate.161.b:0 "开战！"
 unionstate.200.t:0 "工团主义者发动炸弹袭击"
 unionstate.200.d:0 "工团主义者仍然在为他们的革命而战，他们已经把目标对准了[attack_state.GetName]的工厂、铁路和军队设施。一起爆炸造成了大量的损失和人员伤亡。[attack_state.GetName]国民警卫队在赶赴现场后声称他们很快会抓获这些犯罪团伙背后的头目。"
 unionstate.200.a:0 "我们将消灭这群暴徒"
 unionstate.204.t:0 "旧联邦派的恐怖袭击"
 unionstate.204.d:0 "旧政府效忠者仍然在为他们的资本主义和剥削的妄想而战，他们已经把目标对准了[attack_state.GetName]的工厂、铁路和军队设施。一起爆炸造成了大量的损失和人员伤亡。[attack_state.GetName]国民警卫队在赶赴现场后声称他们很快会抓获这些犯罪团伙背后的头目。"
 unionstate.204.a:0 "我们将消灭这群暴徒"
 unionstate.205.t:0 "共和国的旗帜"
 unionstate.205.d:0 "既然我们已经和华盛顿的卖国贼们一分而散，就要为共和国换一面新国旗了。目前我们使用的旗帜被称为“剑与火炬”，但许多人提出了新的设计图。休伊·朗本人则偏爱参照位于他的家乡路易斯安那州，也是国家的新首都新奥尔良的设计。"
 unionstate.205.a:0 "飞鹰俯冲设计"
 unionstate.205.b:0 "至上党党旗"
 unionstate.205.c:0 "十三星鹰旗"
 unionstate.205.e:0 "蓝色版剑与火炬，我就爱这个！"
 unionstate.205.f:0 "鹈鹕旗！家乡的味道！"
 unionstate.205.h:0 "来点更多设计，好嘛？"
 unionstate.205.g:0 "海岸警卫队旗振奋人心"
 unionstate.206.t:0 "共和国的旗帜（下一页）"
 unionstate.206.d:0 "既然我们已经和华盛顿的卖国贼们一分而散，就要为共和国换一面新国旗了。目前我们使用的旗帜被称为“剑和火炬”，但许多人提出了新的设计图。休伊·朗本人则偏爱参照位于他的家乡路易斯安那州，也是国家的新首都新奥尔良的设计。"
 unionstate.206.a:0 "路易斯安那红星旗可能有点社会主义味道，但我喜欢！"
 unionstate.206.b:0 "X形十字旗不错，虽然有点北方风味"
 unionstate.206.c:0 "1861年路易斯安那的老旗子？"
 unionstate.206.e:0 "保留“剑与火炬”设计"
 unionstate.206.f:0 "再看看前面的那些" 
 unionstate.302.t:0 "梵蒂冈先锋队在巴尔的摩发起起义！"
 unionstate.302.d:0 "随着战争造成的动乱向北通过大西洋中部沿海地区蔓延到马里兰州，为了在巴尔的摩市濒临崩溃的时候占领该地，教宗国的志愿军抓住了机会，在巴尔的摩市发动了起义。\n\n在猛烈的炮火下，志愿军乘坐破旧的驳船从阿米斯特德堡经河进入城内，在城市中天主教分子的鼎力帮助下，教宗国民兵在斯派洛岬登录，顶住了河边的敌人的抵抗，并打散敌军的组织，主力部队巧妙地使用小巷和街道进行掩护向城内推进，穿过林荫大道和城市公园与敌人进行战斗。随着城内的战斗进入高潮，教宗国志愿军向盘踞在市政厅外古尔福德大街上的敌军发起一场近乎自杀的勇敢进攻。\n\n与此同时，同情我们事业的人在一些当地志愿军、天主教徒和其他人的帮助下，冲破了敌人的路障，击败了敌方执法部队，导致许多敌方士兵干脆当场溃逃。有许多民兵在战斗中丧生，其中包括民兵领袖埃米利奥·阿兰德斯神父，但这座城市已经被民兵占领。幸运的是，在联盟国军官领导下的增援部队已经做好了接管该地区的准备，如果他们能够击退现在急于拯救这座城市的军队的话。只有时间会告诉我们冲突的结果如何，但一些高层军官则对民兵的鲁莽行为感到愤怒，一位军官私下里声明：“这场战争是我们的战争，不是他们自顾自发起的十字军”。"
 unionstate.302.a:0 "我们要密切关注局势发展！"
 unionstate.303.t:0 "菲利普·阿科斯塔·卡罗尔担任巴尔的摩起义的领导"
 unionstate.303.d:0 "今天，巴尔的摩市为已故的神父阿兰德斯举行守夜仪式，教宗的民兵和当地天主教社区成员来到这里，纪念在马里兰解放战争中牺牲的志愿者。在阿兰德斯的纪念碑旁的纪念仪式的参与者中有一个人，他是马里兰州天主教精英中的一位虔诚的高级官员，他曾英勇地领导了对市政厅发起的白刃冲锋，之后被分裂国家的叛党们打伤。他叫菲利普·阿科斯塔·卡罗尔，是一名联邦派军官，对于朗主义有着深切的同情，也是教宗志愿军中的一名爱国主义者和虔诚的宗教支持者。卡罗尔接任了阿兰德斯成为巴尔的摩起义的领导者，在守夜祈祷上，卡罗尔发表了一篇演讲，表示希望可以为阿兰德斯以及数千万美国天主教徒赢得这场内战。\n\n因为是美国历史上的开国元勋之一，也是唯一一个在《独立宣言》上签字的天主教徒卡罗尔顿的查尔斯·卡罗尔的直系后裔，卡罗尔享尽殊荣。查尔斯·卡罗尔因为其为美国独立战争提供了大量的资金支持而被誉为英雄。许多历史学家认为，美国宪法中的宗教自由制度，就是为了纪念这位天主教徒的勤奋和慈善对一个主要是新教徒的国家的独立战争所作出的贡献。\n\n现在，在美国革命数百年后，美国再次站在另一场革命的最前线，一如以往的卡罗尔勋爵，菲利普·卡罗尔已经向我们——也就是合法政府宣誓效忠，并且根据最近梵蒂冈发出的公报，卡罗尔已正式担任教宗民兵的领导，准备领导美国的天主教徒们对抗工团主义和军阀到最后。\n\n这一消息引发了大量的支持，巴尔的摩起义收到的捐款和志愿者都大幅度增加，外界认为这足以让卡罗尔夺取胜利。不过若是卡罗尔不幸失败，联盟国政府也起草了帮助他和同伴撤退到西部联盟国境内的计划。不管怎样，联盟国如今在各地都有志愿者，无论是一分钟人还是卡罗尔的教宗民兵，无疑都将使我们离胜利更近一步！"
 unionstate.303.a:0 "我们再也找不到比他更爱国的人了！也许现在史密斯能够停止发牢骚了"
 unionstate.304.t:0 "“神圣美利坚联盟”的诞生"
 unionstate.304.d:0 "北美大陆上血腥的内战结束了，天主教志愿部队因其帮助稳固[TEX.getleader]统治下的美国而越发受到欢迎，而他们已经开始努力重组自己的组织结构，以便能够更好地在这新的时代中继续帮助美国人民。为了达到这个目的，部队指挥官，菲利普·阿科斯塔·卡罗尔与美国政治舞台上一个由虔诚天主教徒组成的高调政治集团一起，宣布成立“神圣美利坚联盟”，一个致力于弘扬宗教信仰、希望仁爱价值观，传播并保护天主教、勤奋和美国精神价值观的非盈利组织。\n\n在这个新的联盟中，卡罗尔和他的民兵们由一群政治精英拥簇，其中比较知名的人物是纽约州州长阿尔·史密斯，这位出生于布鲁克林的民主党人被誉为可敬的资深政治家，联盟希望史密斯的温和声誉将有助于使他们在参议院和国会的眼中合法化。除了史密斯之外的联盟的创始人中，最具争议的人士有妇女选举权活动家和著名的社会主义支持者多萝西·戴，她与社会党的关系是众所周知的，这些人都是休伊·朗和美利坚联盟国的公敌，虽然我们已经容忍了戴女士继续在美国宣扬她的主张，但由于戴女士有参与工团主义组织的历史，联盟仍然受到了公众的大量批评。戴的参与也许可以解释为什么美国天主教最热忱的支持者查尔斯·库格林奇怪地缺席了。\n\n虽然库格林最初大力支持卡罗尔和志愿者，但与戴女士的结盟使库格林开始尖刻地批评联盟，他在广播节目中对联盟进行口头攻击，扬言称自己将反对任何试图根除美国信仰神圣性的活动。除此之外，关于卡罗尔本人与国内的纽约市基督教阵线以及国外的各种整合主义和传统主义天主教运动有联系的传言也在联盟内部流传。尽管有这些传言存在，但除了卡罗尔曾为基督教阵线辩护开脱外，几乎没有证据可以证实这一点，这使得传言的可信度大打折扣，虽然卡罗尔从未否认过这些传言。"
 unionstate.304.a:0 "先是史密斯，然后是库格林……也许他们说得对"
 unionstate.305.t:0 "神圣美利坚联盟参与重建"
 unionstate.305.d:0 "作为神圣美利坚联盟援助重建计划的第一步，菲利普·阿科斯塔·卡罗尔、阿尔·史密斯和多萝西·戴开始在整个东海岸建立人道主义援助营地。从巴尔的摩到迈阿密再到巴吞鲁日，卡罗尔带领着志愿者分发食物和水，提供医疗援助和建立医院营地。同样的事情也发生在了西海岸，不过联盟在西海岸的影响力远远比不上东海岸，所以援助力度也无法与其相提并论。\n\n而在南方黑带深处，在那些非洲裔美国人经常遭受战争的痛苦和荒芜的地方，许多人很快就在天主教志愿者那里找到了避难所，他们虔诚的、不知疲倦的努力治愈和重建被战争破坏的黑人社区，公开谴责南方黑人在“吉姆·克劳法”下遭受的种族暴力和种族隔离，充分拥抱美国黑人和白人的团结和兄弟情谊。\n\n可以想象的是，美国南方腹地的政治精英们对这种观点并不满意，他们抗议休伊·朗对神美联盟势力范围向南方扩展如此之深的宽容态度，这些人大多因为赞同杰拉尔德·L·K·史密斯对南方天主教盛行的偏执怀疑而与朗结盟。抗议者中甚至还有查尔斯·库格林，尽管他坚决反对三K党，却不得不正视联盟在非裔美国人中日益增长的影响力，不得不怀疑他们的真实意图。然而，神圣美利坚联盟的努力给[TEX.getleader]留下了非常深刻的印象，他公开赞扬了菲利普·卡罗尔和联盟帮助美国重新团结起来的努力。"
 unionstate.305.a:0 "让我们和解吧，兄弟们"
 unionstate.306.t:0 "狂热新教徒与天主教皈依者发生冲突"
 unionstate.306.d:0 "自从神圣美利坚联盟成立以来，他们努力为美国赤贫人民、联盟民兵和人道主义工作者提供援助的行为，使美国各地的支持者人数大幅增加，许多新英格兰人、德克萨斯人、太平洋沿岸居民和来自南方腹地的非裔美国人涌入联盟志愿者的行列，更重要的是，联盟受欢迎程度的增加程度也与整个美利坚联盟国内皈依罗马天主教派的人数的增加相一致。\n\n这不可避免地引发了联盟与占美国信教人口多数的新教徒之间的矛盾，在杰拉尔德·L·K·史密斯和三K党残余的鼓动下，联盟与保守派新教徒之间在南方腹地爆发的暴力事件日益频繁。\n\n实际上，美国的许多基督教右翼人士对他们所认为的美国传统价值观受到侵犯感到愤怒，而那些支持联盟的人被基督教右翼谴责为“教宗主义者”，这些右翼人士认为这是梵蒂冈制定的阴谋，目的是为了清洗美国大陆上所有拒绝服从梵蒂冈独裁统治的人。\n\n我们必须关注这些团体，因为他们正在鼓吹说，联盟对黑人的偏袒是明显在篡夺白人权威的手段，关于恶性仇恨犯罪和暴行的报道已经开始浮出水面，有些事件甚至发生在“黑带”的北部，如弗吉尼亚，还有的发生在遥远的西部，如加利福尼亚。局势似乎正在迅速失控。许多前旧民主党政客，甚至包括颇具影响力的路易斯安那和德克萨斯政界人士都亲自向[TEX.getleader]抱怨他们眼中联盟的偏袒与不公。\n\n所有这些事件都给总统带来了一个两难的困境，因为他有不少支持来自中西部和南方的保守新教农民，因此必须谨慎而机智地处理这场危机。另外，查尔斯·库格林的每周电台广播已经被推迟，原因不详。"
 unionstate.306.a:0 "叫史密斯到我办公室来！"
 unionstate.307.t:0 "杰拉尔德·L·K·史密斯制定反天主教法案"
 unionstate.307.d:0 "就在南方的局势变得愈发不稳之际，[TEX.getleader]总统、雅各布·德弗斯将军和基督教民粹主义者领袖杰拉尔德·L·K·史密斯进行了一次会议，他们在一片指手画脚、装模做样和指责谁做了或没有做什么事情的争吵声中解决了神圣美利坚联盟的问题，新措施似乎比朗所预期的极端得多，但这可能是他可以选择的最好选择之一了。\n\n史密斯提出通过一项“反天主教法案”，将其作为对抗天主教对人民日益增长的影响的开始，同时这也可以限制天主教在美国政府中的影响力。简单来讲，这部法案极大地限制了天主教移民，对天主教徒征收额外的税目，还直接对教会征税，甚至剥夺了天主教徒担任国家公职的资格。史密斯坚持认为，神圣美利坚联盟的做法是为了夺取对国家的控制，并将其变成一个除了罗马教廷以外不忠于任何权威的傀儡国家。尽管总统很快就驳斥了史密斯的说法，但德弗斯对卡罗尔和神圣美利坚联盟的担忧却更为现实。\n\n德弗斯虽同意梵蒂冈在背地里策划阴谋的可能性极小，然而他也实事求是地指出，从外界的角度来看，卡罗尔本人似乎将自己定位为潜在的美国天主教徒领导人以及国内受压迫的福音派少数团体权利的代表，还同阿尔·史密斯、多萝西·戴结成了三头政治同盟。\n\n尽管不太可能发生任何形式的武装政变，但菲利普·卡罗尔仍可能参加总统竞选，以期在下届选举中击败[TEX.getleader]。此外，尽管德弗斯声称南方的动荡可以很容易地被一些准备良好的维和部队摆平，但又声称也许可以施加压力来说服查尔斯·库格林支持联盟，来促进联盟与极右翼基督徒之间的关系这种做法会更好。不过如果卡罗尔的影响力的确在增长，那么考虑通过反天主教法案以确保在民意调查中享有多数支持倒也符合我们的利益。"
 unionstate.307.a:0 "安排国会在华盛顿特区召开紧急会议"
 unionstate.307.b:0 "联系库格林，并派一些一分钟人过去"
 unionstate.308.t:0 "新火药阴谋"
 unionstate.308.d:0 "夜幕降临在国会山上，高耸的白色穹顶与漆黑的天空形成鲜明对比，华盛顿特区此刻大雨滂沱，震耳的雷声预示着美国新纪元的曙光——旧秩序之下的新纪元。\n\n国会大厦外驻扎着一批民兵，这是一项微小但必要的措施，以确保总统及随行人员抵达时的安全。[TEX.getleader]在这儿，福克斯·康纳在这儿，当然杰拉尔德·L·K·史密斯和德弗斯将军也在这儿，他们当晚的目的是简单地监察正在审议的反天主教新法案的审议情况，他们远远早于议员们到达，尽管大楼里面显得异常空旷，总统的核心圈子还是确信今晚过后，今晚之后一切问题都将终结。而他们的想法也确实是正确的。\n\n总统和他的内阁最后一次被目睹是在史密斯的办公室里，三个人坐在那里，开着玩笑，喝着小酒（当然除了史密斯），当他们对自己即将取得的成功感到骄傲时，他们听到了查尔斯·库格林的广播节目，这是他沉寂很久以来的第一个广播节目。库格林神父用他一如既往的，像一位家长对他的孩子们讲话，那样的语气，谈到了一项即将出台的法案，这项法案试图限制他的信仰，并以此来压制不仅是他本人，还是这个国家普遍且日益壮大的少数信徒的信仰，尽管如此，他的语气几乎是惊人的平静。\n\n当晚他的节目接近尾声时，收音机里传来的最后一句话是：“并要发烈怒、用刀杀你们、使你们的妻子为寡妇、儿女为孤儿。”\n\n美国首都的奇观，美国民主价值观的化身，随着下水道里一箱箱高爆炸药的爆炸，国会大厦陷入了燃烧的地狱。朗、德弗斯和史密斯，以及为数不多的民兵，连同整栋大厦一起在爆炸中化为废墟瓦砾，最后只剩下赶来的目瞪口呆地看着的警察。\n\n第二天早上，由查尔斯·库格林神父指挥的一分钟人民兵和菲利普·卡罗尔主持的神圣美利坚联盟民兵的联军在当天下午之前夺取了白宫的控制权，就在亚特兰大、圣路易斯、萨克拉门托、新奥尔良与休斯敦等地以类似的方式巩固了联盟权力的同时，老泰利·艾伦将军同意将武装部队的指挥权和平转交到卡罗尔和库格林联合政府的管理之下，到了第二天晚上，菲利普·阿科斯塔·卡罗尔宣誓就任美国的新总统。"
 unionstate.308.a:0 "勿忘11月5日"
 unionstate.309.t:0 "美利坚的君主？"
 unionstate.309.d:0 "神圣美利坚联盟崛起后，政府改革所要涉及的方面这一问题开始显现。许多人都把神圣美利坚联盟和世界各地的其他整合主义运动联系起来。所有这些运动尽管有着文化差异，但都蕴含着这些价值观：激进民族主义，对宗教价值观的强烈认同，对自由主义的强烈排斥。更重要的是，所有这些运动，都渴望在君主的指导下进行社会和文化改革。\n\n但是美国人民接受君主制回归的前景暗淡，即使忽略美国革命的起源乃是英格兰帝国主义的剥削和压迫这一众所周知的历史，从独立宣言到宪法都显示出许多美国人根本不能，也不会再忍受民主制度遭到废除。然而与此同时，美国内战也证明了一名强人可以成为人民的救世主。\n\n为此，库格林和卡罗尔将他们的权力赋予神圣美利坚联盟最伟大的头脑们聚集在美国天主教之都圣玛丽城召开的国会，共同思考国家的未来。会上，一些希望维持共和制的提议遭到了否决，正如卡罗尔总统恰当地指出的那样，共和主义是“撒旦的产物、在世界大战将高高在上的共和主义拉下神坛时才显露出其本质”。\n\n本次国会中只有两项提案让聚集在那里的议员产生了共鸣。第一个，也许是会上最激进的，确实是要求复辟君主制。但统治国家的并非任何世俗国王，而是让基督登基为美利坚之王。\n\n虽然这项提案激进无比，但它从天主教的立场出发确实很有道理。在天主教会中，有一条应许教诲，那就是基督将成为万王之王，所有国家都处于基督的王权之下。因此，将基督封为国王只是承认了已经存在的情况。\n\n另一个受到欢迎的提案还包括推举斯图亚特王朝为美国国王，斯图亚特是英国最后一个天主教王室家族。这一提议虽然本身也很激进，但从地缘政治和历史意义上讲是有道理的。众所周知，神美联盟的头号敌人是加拿大的温莎家族。加冕温莎家族的宿敌斯图亚特之后，我们的一切入侵行径就有了合情合理的缘由。\n\n随着第一届神圣美利坚联盟国会开始投票，最后胜出的是……"
 unionstate.309.a:0 "……只有基督有权统治美国！"
 unionstate.309.b:0 "……我们要成就最初的火药阴谋的愿景！"
 unionstate.310.t:0 "吾王基督"
 unionstate.310.d:0 "今天，美国总统菲利普·阿科斯塔·卡罗尔、查尔斯·库格林神父和神圣美利坚联盟发表了一份令人震惊的联合声明，宣布美国将向君主制过渡。\n\n令人大跌眼镜的是，大多数美国人的惊讶并不是源于对君主制美国这一概念的排斥，而是因为卡罗尔和库格林推出的国王不是别人，正是拿撒勒的耶稣。从目前的情况来看，这项新政治政策，正如媒体广泛描述的那样，也许是现代世界历史上最具争议的政治决定。\n\n菲利普·卡罗尔还在一份类似的令人困惑的声明中宣布，他将辞去美国总统一职，取而代之的是摄政头衔。“摄政”，意如其名，卡罗尔将执掌耶稣之国，将政府完全控制在自己手中。\n\n对这一宣言的反应，温和地说，千差万别，喜忧参半；许多美国人，甚至是那些基督教信徒，都对于国家机器被授予上帝之子这样一个概念性的超凡存在感到震惊。\n\n与此同时，对神圣美利坚联盟的更为直言不讳的批评者公开谴责此举是一种赤裸裸的、甚至是痴心妄想的，试图以菲利普·卡罗尔的教士独裁统治激励美国宗教信徒的企图。不过，就算是虔诚的基督信徒，也根本搞不清这到底是怎么回事。依教会的解释，吾王基督是世界诸国共同的王，而美国是第一个让其归于正位的国家。抛开这些不谈，卡罗尔要如何让其余的国民信服这一近乎疯狂的决定仍不得而知。"
 unionstate.310.a:0 "最好祈祷他成功，因为这将是一个奇迹！"
 unionstate.311.t:0 "圣玛丽城"
 unionstate.311.d:0 "作为卡罗尔推动美国向天主教国家过渡的倡议的一部分，神圣美利坚联盟已经开始对美国历史上主要的天主教遗迹进行一系列修复工作。其中一个重要地点是圣玛丽城的遗址，它是切萨皮克湾的美国天主教殖民者最初的殖民地，也是马里兰州的第一个聚居地，马里兰就是从这里发展为郡并在随后成为了州，此地更是被认为是美国宗教自由价值观的发源地。\n\n自殖民地统一以及美国独立以来的几个世纪里，圣玛丽城现在成了一个旅游景点，原定居者的后裔早已迁往人口较多的地区，如华盛顿特区或巴尔的摩。现在，随着卡罗尔重振旧定居点的倡议的开始，以过去工团主义者为内华达州打造的开发计划为基础的经济建设计划，将在这个前马里兰小村庄开展，尽管初步估计该项目要到1954年才能完工，但最终该地会被彻底改造成大西洋中部中心的一颗闪亮的宝石。\n\n这项计划的巨大规模，让越来越多的人了解到，卡罗尔要把美国建设成一个既虔诚又繁荣的国家的信念，并不仅仅是空话，这项计划也透露出来一些迹象，美国将会在未来变得大不相同。"
 unionstate.311.a:0 "懒汉是魔鬼的玩物"
 unionstate.312.t:0 "骑士的守望"
 unionstate.312.d:0 "正是全国各地的天主教农民，牧民，以及工人们，鼓励着神圣美利坚联盟开始了一场漫长而艰难的征途，誓要重塑美国人的身心灵魂。由于恐怖主义的威胁持续折磨着美国人民，许多信徒已经开始组建自己的公民卫队，以保护农村的白人新教徒社区免遭趁机犯事的恐怖分子的袭击。\n\n这种讽刺的情况在全国比比皆是：美国天主教徒遭受的许多苦难都可以直接追溯到新教徒或其他他们现在正在保卫的群体的迫害，但这些被农村社区称为“骑士守卫”的自组织民兵越来越受欢迎，这可能标志着美国真正变革的开始：天主教和新教的白人们比以往任何时候都更为关爱彼此，中西部和大平原的许多社区似乎在这个伟大国家的灰烬之中找回了和平。\n\n虽然在美国恢复往日辉煌之前还需要一些努力，但这些骑士守卫所扮演的角色将不会被忘记。"
 unionstate.312.a:0 "他们曾在地狱鏖战，如今他们为天堂而战"
 unionstate.313.t:0 "耶稣会在东海岸的伟大使命"
 unionstate.313.d:0 "随着圣玛丽城的发展项目的持续进行，神圣美利坚联盟已经开始赞助耶稣协会来向东海岸社区宣传天主教信仰。\n\n联盟的主要领导人纷纷致力于为此做好各种准备；阿尔·史密斯和东海岸的各州州长会面，协商帮忙传播福音的事宜；多萝西·戴和她的天主教工人运动一直在东海岸各大城市的工厂里开展活动，在工作场所传播基督的话语；一如既往狂野不羁的查尔斯·库格林，一直在卡罗来纳州和维吉尼亚州巡回，在南部的各种集会上发表演讲。\n\n库格林激起了南方民族主义者支持联盟的浪潮，而菲利普·卡罗尔也亲自投身于这一进程，他从库格林神父那里得到了启发，通过电台与美国人民进行了一系列所谓的“炉边谈话”，为库格林激发的热情添柴加火，这位端庄的马里兰人坦率地谈论着世间大事和美国在其中的作用。而主要践行传教事务的耶稣会对政府充满了感激，因为有了国家首脑做表率，传教也就轻松了许多。\n\n的确，这都是联盟的一项伟大事业，但更重要的是，这显然是使联盟政府在普通民众眼中合法化的开始，是一系列信仰皈依的开始，是东海岸，然后向西海岸发展的开始，直到整个美国，从一片大洋到另一片大洋，在圣父、圣子和圣灵的福音下团结起来。"
 unionstate.313.a:0 "现在来掷骰子……"
 unionstate.314.t:0 "戴和史密斯的对抗"
 unionstate.314.d:0 "随着神圣美利坚联盟继续其为国家经济注入活力的计划，联盟内部就如何改革美国金融业的具体计划展开了激烈争论。这场争论的根源在于活动家多萝西·戴和受人尊敬的纽约州州长阿尔·史密斯，尽管这两人秉承的意识形态不得不与联盟内相对激进的整合主义者相协调，但他们仍致力于将美国带往更美好的明天。\n\n自联盟建立以来就在其中备受关注的多萝西·戴，主张按照分产主义重组美国经济。所谓分产主义，指的是基于共享和慈善价值观的经济分散化，这种思想主张将国家的生产力广泛地均分给人民，换句话说，就是要让每个人都能有三亩地和一头牛。\n\n当然，这种“集体化”的措施震惊了联盟中许多温和派成员，其中带头的便是阿尔·史密斯，他认为资本主义和自由市场对美国经济至关重要，甚至援引查尔斯·卡罗尔在独立战争中的角色作为需要保护私营企业的论据。\n\n因为不想被误认为偏袒一方，菲利普·卡罗尔将采用何种经济模式的决定权委托给了查尔斯·库格林神父，因为库格林神父既讨厌左翼又讨厌自由派，这是众所周知的，所以他在“两害”中选出来的计划很可能是他真心认为对美国最为有利的。"
 unionstate.314.a:0 "我敦促你们，提议你们，将银行家们赶出神殿之外！"
 unionstate.314.b:0 "没有必要把所有的工厂和田地都共产了！"
 unionstate.315.t:0 "骑士团军事化"
 unionstate.315.d:0 "在过去的几个月里，随着天主教信仰在美国民众的精神世界中日益盛行，一种奇怪的现象开始出现。“骑士守卫”从最开始那些虔信上帝，狂热追求与同胞团结平等理想的，勇敢的天主教志愿者开始，在整个美国变得越来越受欢迎，他们甚至已经开始采用过去欧洲十字军的风格，包括正规骑士团的誓言、头衔、肖像和习俗。\n\n在美国天主教的诞生地马里兰，来自华盛顿、巴尔的摩和复兴的圣玛丽城的新一代青年以菲利普·卡罗尔及其家族的教义与准则组织起来，成为了和卡罗尔家族祖宅同名的多奥雷根庄园骑士团；在纽约市，来自五大市区的坚强又不屈不挠的非裔美国人选择成立布鲁克林兄弟会来纪念勇敢的哈林地狱战士（即第369步兵团，第一支由黑人组成的团级战斗部队，作战骁勇无畏）；在新英格兰，自傲的红发爱尔兰裔美国人无惧颓废的加拿大国王，蜂拥加入自诩爱国的反圣殿骑士团；在曾经作为工团主义威胁的核心的钢带，可以看到来自芝加哥、底特律和辛辛那提的众多男女，其中许多曾是医务工作者，加入新生的红十字医院骑士团，阻挡加拿大妖言惑众的蛊惑者越过五大湖。\n\n类似的现象也扩散到了美国西南部，邻近墨西哥的边境州那里，民兵为纪念曾反抗社会主义墨西哥政府的人们而创立了旧索诺拉教团；在邻近太平洋的美国西北部，忠诚的腹地骑士团，从俄勒冈和华盛顿的一些白人志愿者开始，吸纳越来越多的土著皈依者，以保卫国家不受内外威胁为己任，成为秩序的维护者。\n\n所有这些爱国又虔诚的士兵，这些现代耶路撒冷的战士，其信奉上帝教诲的行为都让菲利普·卡罗尔报以敬意，以至于他立即颁布法令，正式吸收这些骑士团作为美国军队的组成部分，为全世界树立了有关上帝带给人民文化团结和军事坚韧的良好模范。"
 unionstate.315.a:0 "上帝的旨意！"
 unionstate.316.t:0 "从恶中造善"
 unionstate.316.d:0 "没有人能否认，对于一个基督教国家的持续繁荣来说，没有什么比教育更重要的了，教育是把善良的美国人民从摇篮到坟墓团结起来的一种手段。神圣美利坚联盟决定模仿葡萄牙模式，从头开始重建学校体系；每一所学校都将采用天主教学校的制度，参考如今新英格兰已经存在的类似学校。\n\n天主教教士将担任学院的院长以及一半的教职人员，修女则担任另一半；学生需要遵守天主教会制订的各种仪式和规范；查尔斯·库格林和菲利普·卡罗尔的广播将是年轻学生的必听广播；所有学校中的种族隔离都将被废除，国家和教会将通过对神学、社会学和哲学提供奖学金来鼓励学科发展，以加强美国公民的道德品质。\n\n这些只是联盟教育改革的开始，虽然新教义显然需要时间才能真正在美国扎根，但菲利普·卡罗尔和联盟坚信，下一代美国天主教青年将会见证美国在世界舞台上蓬勃发展。"
 unionstate.316.a:0 "在上帝的庇护下，不可分离，自由且公正"
 unionstate.317.t:0 "美国异端教派的终结"
 unionstate.317.d:0 "将上帝驱赶出新大陆的人类殿堂的正是人性的傲慢，不列颠和西班牙皇室家族的贪婪和狂妄催生出的恐惧与仇恨，促使他们散布教会威胁论，煽动我国的开国元勋把上帝赶出了我们的宪法，欧洲人的偏见和迫害为我们现在所知的美国异端邪说搭建了舞台，这是何等的耻辱，政教分离造成了美国陷入集体颓废。\n\n摄政王的祖先，卡罗尔顿的卡罗尔曾在独立宣言上签署名字，而那份宣言中有一个不言而喻的真理：“凡人生而平等，秉造物者之赐，拥诸无可转让之权利”，正是这份宣言推动美国的自由之箭击穿了欧洲霸权的核心。而现在就在这里，在正义的因果轮回中，其先祖骄傲的后代，我们的摄政王菲利普·阿科斯塔·卡罗尔宣布废除美国的政教分离。此时此刻开始，美国的所有机构，从摄政王办公室雇员到微小的基层公务员，在雇用时都应立下基督教的服务和忠诚誓言；所有医院、消防站和警察部门都应将天主教神父纳入其工作场所，以进行道德教化，将公共事务圣化。\n\n罗马天主教牧师团也将被纳入美国军队成为一项分支，它将作为新设立的“基督政委”办公室的一部分而享有特殊地位。此外，美国教会的顶点——巴尔的摩大主教将以“灵魂顾问”的身份永久任职于内阁中。这一天，将会成为美利坚精神获得伟大救赎的见证，通过正义的虔诚和不屈不挠的意志，美国将在此世所向无敌。"
 unionstate.317.a:0 "从耻辱到令人惊讶的荣耀，我们的时代已经来临！"
 unionstate.318.t:0 "毁灭代表异端的自由女神像"
 unionstate.318.d:0 "当上帝将美国的腹地拥入温暖的怀抱之中时，我们的同胞们感受到了一种巨大的愤怒，这种愤怒直指那些在我国都市的中心留下伤痕的罪恶雕塑们。那些散播民主谎言的欺诈者偶像，尽是共济会和詹姆斯党的禽兽把戏产物。那些在自由主义的风花雪月中建造的纪念碑，即使是在靠着奴役平民，汲取民众的苦难养肥自己的时候，自由派都会搬出所谓自由的名义。\n\n在整个美国，各州尽皆投入拆毁象征着虚伪的旧日美国的民主正义的建筑物；法院之上的正义女神，如今发现贪污腐败的自己也被判有罪；国会大厦处的自由女神像，被摧毁殆尽的首都建筑中硕果仅存的遗迹，现在将被熔炼成金属液体，就像休伊·朗和他的阴谋集团一样化为乌有；所谓的国家英雄与建国者们数不清的雕像与纪念碑，这些带毒的启蒙思想的怪诞化身，将被拆除，以圣徒和殉道者的面容取而代之。当这些诡辩和残忍的纪念碑从地基上推倒时，正义的欢呼声足以使任何一位美国人都能得到最神圣的宣泄。\n\n最终，剩下的只有玷污了纽约市的天际线的那座丑恶的淡绿色雕像了。那是法国人送给美洲大陆的礼物，或者更确切地说，是雅各宾人恶徒送给自己的同党，美利坚共济会政治寡头们的旧日美国意识化身，这正是对我们的新美国精神的恶意。摄政王菲利普·阿科斯塔·卡罗尔以其虔诚的智慧颁布法令，纽约市这座称之为“自由女神”的雕像将不复存在；其全身将被重新制作，塑造成圣母玛丽亚的面容，以对我国不朽空灵的王中之王致以敬意。"
 unionstate.318.a:0 "哦，来吧，忠实的信徒"
 unionstate.319.t:0 "圣 哉 美 利 坚"
 unionstate.319.d:0 "起初神创造天地，地是空虚混沌，地上的国是野蛮荒芜，被放逐的来到这，他们从前的国是充满了鸡奸、邪恶、腐败和瘟疫。\n\n神将地赐给被放逐的，被掳的人得了地，造了他们的主的形像，神就欢喜了。神赐福给地，用神国的果实赐福它；祂使地上的人繁荣昌盛，拥有雄伟的巨石和人口兴旺的城市；祂赐予他们的国强大的战士，在圣十字军的名号下建立兄弟之情，他们的心就像他们的剑一样正直；祂赐给他们领袖。这领袖是使徒、门徒、大师、牧者。\n\n神保佑牧者，赐予他智慧和热情，在神授意下，牧羊人成了摄政王，摄政王欣喜若狂；他光彩夺目，穿着与主相称的服装，因为他不是主，因为他是主的一部分，因为他是先知，因为他是圣父、圣子和圣灵的摄政王。\n\n此为摄政王，亦为先知，他洞悉一切不成型的和无形的土地，合众为一，看疲惫者穷鄙者醒觉，看地上繁荣，且听神的道。这是摄政王的音，摄政王是神的器皿，那器皿说神的话语。神的话语由摄政王的喉舌而传达，那话语是“要有帝国。”于是事就成了。"
 unionstate.319.a:0 "§Y阿 门§!"
 unionstate.320.t:0 "美国宗教裁判所"
 unionstate.320.d:0 "解决自美国建国以来就存在的这种巨大的不义的时刻终于到来了。几个世纪以来，美国的天主教和新教人民和谐相处，并肩工作，把曾经的十三州殖民地变成新兴的全球大国。但那时的美国何等孱弱，如今的美国又何等强大。新教徒终于看到了正统的优越性，上帝保佑，他们终于对路德的异端邪说闭拢心房，尽管缓慢，但还是对向全能的基督敞开了心扉。然而，在这片凌驾于一切圣地的圣地，居然还有大胆妄为之辈胆敢责备我们的主。这决不可容忍。\n\n各种意识形态的传道者，病态的过时罪犯，他们用种族主义或道德堕落的淫秽或陈旧的教义腐蚀他们的基督徒同胞。还有浸礼会教徒、卫理公会教徒、圣公会教徒、贵格会教徒、清教徒、摩门教徒以及更恶劣的假意改信，在教会之中行渎神之事者等等，所有的异端都是对无瑕炽热的美利坚精神的一次摧残，一片污点，一种腐蚀，他们必须为对美国的侮辱给予赔偿。根据摄政王谏令，菲利普·阿科斯塔·卡罗尔爵士就如同曾经的虔诚征服者科尔特斯一样，将主持美国史上第一次，世界史上第二次宗教裁判所；从西雅图到迈阿密，国民将悉数俯下身子，罪人将悉数忏悔，国家将复归完整，每一位美国公民，其思想、身体和精神上都将纯洁无瑕。匍匐于上帝之光面前，美国将成为众国之国，最善之善，地球的山巅之城。"
 unionstate.320.a:0 "忏悔吧，忏悔吧！"
 unionstate.322.t:0 "詹姆斯党人复辟"
 unionstate.322.d:0 "白宫密谋将美国从民主共和国改为君主制帝国的传言居然毫无虚假，神圣美利坚联盟今天通过广播宣布，迄今为止的联邦政府将改革为德国式的半君主立宪制。尽管民主制度在某些方面得到了维护，但这条新闻在全国大多数人民中可不受欢迎，这在很大程度上是由于美国自始至终一直对君主制抱有强烈的排斥。尽管这一改革举动遭到强烈反对，但卡罗尔的改革能得以合法化的可能之一或许是在于被其选中的王位候选人。\n\n王位候选者，哈科沃·菲茨-詹姆斯·斯图亚特，第17任阿尔巴公爵；他曾经是病王阿方索的外交部长，这位和蔼可亲的西班牙富翁是曾经的英国统治者詹姆斯二世国王最年长的后代（虽然其血缘来自于詹姆斯二世的私生子詹姆斯·菲茨詹姆斯）。詹姆斯二世对天主教的虔诚信仰导致了他被英国政府非法流放，如今的温莎家族也趁机崛起，支持正统国王的詹姆斯党人起义在爱尔兰和苏格兰全境爆发，他们渴求着国王重归王位，如此不列颠岛的人民能从异端圣公会的威胁解放，即使在今天，有一些苏格兰人仍然相信雅各布才是苏格兰王国的合法继承人。\n\n虽然这段历史动人心弦，但卡罗尔支持斯图亚特确实还有着现实政治方面的理由：支持詹姆斯党人可以巧妙地回避英王曾暴力镇压美国开国先祖的历史——只要将暴行都归咎于推翻了斯图亚特的盎撒温莎家族就可以了——同时也允许卡罗尔在海内外获得众多颇具影响力的欧洲移民的支持，其中包括许多爱尔兰人，苏格兰人甚至西裔美国人这些凯尔特-伊比利亚裔，他们会以一种矛盾的亲美方式支持着联盟从欧洲借鉴来的君主制。不过，虽然联盟的君主制效仿了普鲁士，但掌权的依旧是卡罗尔。詹姆斯三世的加冕结束后的第一件事，就是在卡罗尔的指使下设立“摄政”的头衔，并赋予这一头衔的持有者与国王同等的权力。出于对王位的珍惜，詹姆斯三世任命卡罗尔为首任摄政。\n\n话说回来，西班牙宗教裁判庭肯定预想不到美国会接受君主制，但这总归是一个好的转变，因为如果我们要从当前的危机中恢复过来，我们就需要所能得到的一切支持。"
 unionstate.322.a:0 "至少加拿大人可以先不用再担心伦敦的赤匪了……"
 unionstate.323.t:0 "你扬基爷爷来了！"
 unionstate.323.d:0 "随着雷鸣般的炮击声再次响彻西欧，德皇的帝国与马恩河对岸的公社展开了殊死搏斗，协约国势力也开始阴谋从第三国际手中夺回他们的故土。这个尝试注定将要失败，因为我们将会终结圣爱德华宝座上腐败的温莎家族。北方的加拿大人一边瞟着不敬神的爱德华八世，一面觊觎着我们的国土，我们不得不说他们很聪明，因为昔日从故土流亡，他日必将荣归故里、振兴英格兰的真正的不列颠皇室就在我们的国土之上。上帝宽恕了一切，祂宽恕了美国的罪恶，使它摆脱了篡夺岛屿的新教徒与工团主义者的祸害，上帝将美利坚巨人置于合法的大英帝国统治者监护之下，而在上帝的光下，美国将为欧洲带去救赎。阻挡我们前进的只有公社：红色法国、红色意大利和红色英格兰的无神论士兵，他们会摧毁耶稣基督想要保留的一切。正如从耻辱中崛起的德意志帝国，正奋力迎战第二次法国大革命的锋芒一样，詹姆斯党人的复辟运动也会将汉诺威王朝遗留下的瘟疫从我们伟大帝国的岛屿上扫进海里。红色巴黎的命运已经注定，红色都灵的末路已经铺好，至于红色伦敦，唯有粉身碎骨一种结局。"
 unionstate.323.a:0 "不列颠尼亚万岁！"
 unionstate.323.b:0 "时机还不成熟。"
 unionstate.324.t:0 "选举结果遭到抗议！"
 unionstate.324.d:0 "尽管神圣美利坚联盟是这次选举不可争议的胜利者，但我们的对手——美利坚奥兰治骑士团、佩利的基督党成员、美利坚至上党的部分人员以及三K党残余——拒绝放弃胜利或接受选举结果！这些新教极端分子拒绝看到天主教徒掌权，特别还是一名在教廷民兵支持下上台的天主教徒。他们就像提出“反天主教法案”的史密斯那样，害怕国家变成教廷的傀儡，因此拒绝承认卡罗尔的合法性。他们在自己的阵地组织起了不满者的抗议活动，情报部门的一些人甚至报告说，他们已经开始划定战线。虽然目前对方还没有实质性的举动，但未来的形势谁都难以预料，卡罗尔和神圣美利坚联盟也可能就此败北。"
 unionstate.324.a:0 "盯紧点他们……"
 unionstate.325.t:0 "抗议演变为骚乱"
 unionstate.325.d:0 "我们的反对者及其煽动的暴徒在他们的据点里持续发起集会，甚至开始攻击企图驱散他们的警察。我们正在失去对国家的控制，首都正处于骚乱爆发的边缘，因为警察被迫向袭击他们的暴徒开枪，新一次内战的光景似乎隐隐约约浮现。有鉴于此，无能的国会为了避免内战再开，开始认真讨论起了推翻选举结果的事宜。不过，有神圣美利坚联盟撑腰的候任总统菲利普可不打算乖乖就范，因为如果现在退缩，那无论是对美国天主教，还是对体制本身造成的伤害都不可计数。"
 unionstate.325.a:0 "如果我们倒下，谁还能拯救国家？"
 unionstate.326.t:0 "新火药阴谋？"
 unionstate.326.d:0 "随着国内局势日益恶化，尽管神圣美利坚联盟尚未真正掌权，但仍在尽己所能来平息局势。为此，哥伦布骑士团至高骑士，同时也是卡罗尔任命的新任联邦调查局局长马丁·卡莫迪私下里对卡罗尔暗示，以历史事件为名的“新火药阴谋”可以解决当下的困境。他的基本计划是，暗地里向联邦调查局和公众泄露文件，表明暴徒们正计划炸毁政府大楼，挑起新一次内战，而不仅仅是发起抗议，而且事实上，他们很可能真的是这么打算的。他说，这将允许卡罗尔向国会要求无限制的紧急权力，甚至足以更改宪法，直到局势再次正常化。"
 unionstate.326.a:0 "如果这是唯一的办法……"
 unionstate.327.t:0 "新火药阴谋确有其事"
 unionstate.327.d:0 "菲利普走向了国会前的看台之上，其姿态就如同布道的神使，只是这位神使正被电台和录像机密切关注着。在一小时二十二分钟的讲话中，候任总统菲利普向无能的国会两院议员出示了详细的证据，证明那些拒绝接受选举结果的人正计划炸毁市政大楼，袭击那些支持下任政府的虔诚信徒。在满脸震惊的国会议员的注视下，菲利普以此施压要求国会进行紧急就职典礼并给予必要的权力，以镇压叛国的阴谋家和街上的叛军暴徒。随后，国会举行了一次前所未有的投票，因为恐惧内战再度爆发，参众两院投下了压倒性多数的赞成票。菲利普·阿科斯塔·卡罗尔提前宣誓就职，并被赋予了无限的行政、立法和司法权力，据推测，这些权力足以让他一时兴起就能修改宪法。"
 unionstate.327.a:0 "就像戏剧结束时的重唱"
 unionstate.328.t:0 "菲利普·阿科斯塔·卡罗尔的就职典礼"
 unionstate.328.d:0 "在国会史无前例的投票过后，菲利普·卡罗尔就任国家总统。全国各地的广播电台都在高声播放他的讲话，在讲话中，他向全国人民保证，自己将是一个公正的统治者，因而为了维护法律和秩序，他会做一切必要之事，就算面对的是威胁要把国家再度拉入内战的漩涡之中的暴徒也不会心慈手软。赋予他这样的权力令全国许多怀疑论者忧心忡忡，而有关他想以维护稳定为幌子实行君主复辟的传言也不绝于耳。不过，即使是卡罗尔这样的狂人，也不会有足够狂到要去在美国复辟君主制，是吧？无论如何，卡罗尔上台后的第一件事就是赋予神圣美利坚联盟绝无仅有的政治掌控力，使其可以跳过国会行事。除此之外，卡罗尔还授予了一直都在支持他和联盟的查尔斯·库格林神父与自己同等的权力，两人共同统治神圣美利坚联盟和美国。在这一双头统治下，美利坚的命运将何去何从，只能留待以后揭晓了。"
 unionstate.328.a:0 "像卡罗尔这样的人，晚上究竟在做什么梦呢？"
 unionstate.1402.t:0 "彭德格斯特正在损害朗的名声！"
 unionstate.1402.d:0 "臭名昭著的民主党“老大”T·J·彭德格斯特被称为堪萨斯城之王，这一称号并非没有原因。密苏里州的大部分地区，以及周边的大城市，如威奇托和奥马哈，都在他肮脏的股掌之间，而这个腐败的民主党帝国仍在继续扩张。彭德格斯特利用他的政治机器、与赌博产业的公开联系、与犯罪集团的公然联盟，以及他庞大的秘密盟友和精英圈子，已经成长为联盟国最有影响力的政治家之一——即便他目前远离国家政治。\n\n过去，彭德格斯特曾向王鱼提出要求，让他自己的腐败封地继续运作，表示只要朗不插手彭德格斯特的生意，他就会给予其支持，但两人的会面却总是以不欢而散告终。然而，彭德格斯特仍在派出代表与亲信来左右我们的意见，而且屡试不爽。这样的联盟很容易提高朗在联盟国内的地位，如果我们赢得这场兄弟战争，也会更为容易地整合广泛的前联邦地区。然而，向这样一个公开的腐败和犯罪势力低头，可能会损害朗在其忠实追随者中良好声誉。我们应该怎么做？"
 unionstate.1402.a:0 "跟彭德格斯特结盟"
 unionstate.1402.b:0 "他寄吧谁啊？"
 unionstate.1403.t:0 "彭德格斯特在堪萨斯城骚扰我方支持者"
 unionstate.1403.d:0 "彭德格斯特和他的亲信们对王鱼再次拒绝合作感到愤怒，开始在堪萨斯城和密苏里州等势力范围骚扰朗派。在大街上或投票站恐吓我们的支持者，破坏他们的财产，发送恐吓信件，只要他们留在彭德格斯特的领地中，他的狗腿子们便一心想让每个朗派的生活变成地狱。我们应该介入并保护我们的忠诚者，还是顺其自然？毕竟他们“只用”对抗一群腐败的无赖和马屁精，能有多难呢？"
 unionstate.1403.a:0 "开始调查彭德格斯特政治机器！"
 unionstate.1403.b:0 "他们能照顾好自己"
 unionstate.1404.t:0 "关于彭德格斯特影响政府的传闻"
 unionstate.1404.d:0 "彭德格斯特对权力的渴望似乎还并未消退，在铲除了自己势力范围内至上党的影响后，他似乎把枪口转向了休伊·朗控制的国家政府。有传言称，彭德格斯特及其狗腿子们已开始渗透联盟国政府，试图从内部彻底推翻朗政权。当然，这些只是毫无根据的谣言，这么一条小鱼怎么可能在王鱼的池塘中击败他呢？不管怎样，也许我们应该关注此事，或者只着眼于眼前的真正威胁——这场试图撕裂美国，暴力且血腥的兄弟战争？"
 unionstate.1404.a:0 "对被告展开调查！"
 unionstate.1404.b:0 "只是道听途说罢了！"
 unionstate.1405.t:0 "彭德格斯特废黜了朗！"
 unionstate.1405.d:0 "王鱼已经倒下，但堪萨斯城的国王现已崛起。在压制了朗的政治机器，推翻了朗肮脏的民粹主义政府后，左翼的恶臭已经被从联盟国政府中根除，而这一切都要归功于T·J·彭德格斯特和他的忠诚亲信。现在，腐败和白领犯罪将成为联盟国的游戏规则，汤姆老大和他收买后的无尽忠诚者已经准备好把民主党领导的完美共和主义带到美国——也就是建立在贿赂和贪污之上的民主，而这一切都掌握在我们的“迈达斯国王”汤姆·彭德格斯特手中。"
 unionstate.1405.a:0 "打倒王鱼！向新王致敬！"
 unionstate.1406.t:0 "润滑车轮"
 unionstate.1406.d:0 "在彭德格斯特眼中，墨西哥人没什么利用价值。这并不是说他讨厌他们，只是在堪萨斯城中的墨西哥裔数量还达不到引发其重视的水平。然而现在，彭德格斯特管辖的墨西哥人多了很多。而墨西哥裔的选票已经开始逐渐转向他的阵营，但这种转变对彭德格斯特来说还不够快。他担心一些新兴的反对者向他们做出承诺，并在未来几个世纪里锁定他们的选票。因此彭德格斯特已经开始策划一个专门针对墨西哥选民的新政治计划。在多萝西·加拉格尔领导的瓜达卢佩中心管理下，它承诺提供便捷的移民途径、就业安置项目以及社会服务，这意味着它对普通墨西哥移民极具吸引力。然而，这样做无疑会疏远并非无足轻重的白人种族主义者的选票。彭德格斯特必须做出选择，是选择西南部还是南部？"
 unionstate.1406.a:0 "面包与马戏！"
 unionstate.1406.b:0 "立即驱逐出境！"
 unionstate.1407.t:0 "被忽视的少数派"
 unionstate.1407.d:0 "孟菲斯是一个完全独立的政治机器，在很大程度上不受彭德格斯特的直接控制。其控制者，E·H·克伦普很像彭德格斯特。他们都是民主党人，都是民粹主义者，最重要的是，他们都和任何政治“老板”一样腐败。克伦普对孟菲斯的控制是通过与黑人选民的一种不太可能的联盟来维持的。克伦普通过资助黑人领袖和给予黑人选举权，为支持城市的黑人社区做了很多工作。彭德格斯特已经开始应用“克伦普方案”，将这些措施推广到南部的其他城市，比如伯明翰和亚特兰大。我们可以在亚特兰大和伯明翰等“黑带”的主要城市复制克伦普体制，最终令黑人选票回归正常。但我们必须和他们保持一定距离，这样我们才不会激怒南方白人。这将是一个非常微妙，非常不稳定的平衡体制。但如果我们保证动态平衡，每个人都能够皆大欢喜。"
 unionstate.1407.a:0 "一种不太可能的南方式的进步。"
 unionstate.1408.t:0 "兔子和山羊"
 unionstate.1408.d:0 "彭德格斯特的长期盟友，也同样是对手的詹姆斯·香农是密苏里州另一大政治机器的领袖。两人在谁应该更占主导地位的问题上经常发生冲突，在伪自由主义和强硬保守主义之间产生了分歧，这种分歧也经常在我们的内阁中造成裂痕，因为他们总是试图说服其中一个，但这种来回的“友好”竞争终于结束了。香农的派系，绰号为兔子，终于在彭德格斯特的山羊派面前开始动摇，在彭德格斯特将整个联盟国都收入囊中，并辅以肮脏手腕后，每一天，越来越多的兔派纷纷转投阵营，承诺全力支持彭德格斯特，因为他们明白，汤姆老大才是唯一能真正关心他们的人，他才能通过贪污与腐败润滑国家政治的巨轮。随着主导地位的希望逐渐渺茫，香农和他的兔派终于开始支持党的主要路线，进一步巩固了彭德格斯特手中的所有权力。"
 unionstate.1408.a:0 "山羊每次都会胜过兔子。"
 unionstate.1409.t:0 "新民主党的未来"
 unionstate.1409.d:0 "随着联邦的稳固，美国人民心中的伤痕也得到疗愈，彭德格斯特政治机器的巨大努力终于开始得到回报。在堪萨斯城的黑人心中，新联盟的每一条大街小巷都充斥着贪污与腐败。民主党已经演变成一个犯罪自由主义的融合体，我们的经济，连同彭德格斯特的丰厚钱包，只会不断膨胀。然而，随着我们的权力达到顶峰，我们可以自由地决定如何在新的政治环境中定义自身。在彭德格斯特邮票的引领下，我们该如何前进？"
 unionstate.1409.a:0 "在彭德格斯特老板的领导下完善我们的强盗政府！"
 unionstate.1409.b:0 "在我们的政治机器下保持庇护主义民主的腐败幻想！"
 unionstate.1409.c:0 "追求威权自由主义的梦想，重塑民主党的身份！"
 unionstate.2100.t:0 "国家进步党的压力"
 unionstate.2100.d:0 "国家进步党已经发展出了拉福莱特家族的势力范围，在北部和中西部的许多农业地区占据主导地位。国家进步党的竞选策略以宣称政治改革和没有“腐败”的进步派经济为主，很明显就是在针对至上党。国家进步党吸收了残余的大部分共和党人，对至上党的左翼势力构成了重大威胁，它还蚕食了不少进步派和农民对我们的支持，党内一些人因此提议我们应该对左翼多做些口头承诺。"
 unionstate.2100.a:0 "许下更多承诺！"
 unionstate.2100.b:0 "不行，这样会激怒右翼"
 unionstate.2101.t:0 "德克萨斯民主党再起"
 unionstate.2101.d:0 "在激烈的竞争之后，似乎奥丹尼尔战胜了对手，成为了德克萨斯民主党的旗手。如今，广大的民主党选民与诸多民主党人都团结在这位极具个人特色的政治家身边，奥丹尼尔希望将自己秉承的民粹主义信念和保守经济政策传递给所有美国人，虽然他确实是个民主党人，但在接受了休伊·朗的部分言论后，他已经偏离了传统的民主党风格。这包括其竞选活动，他通过召集自己的广播听众和传统的民主党选民，迅速积累了全国范围的支持。奥丹尼尔甚至扬言要超越朗，成为美国新的指引者。他的魅力不应被低估，也许我们应该更认真地对待德克萨斯，认真对待民主党，让他闭嘴，至少干扰他们的竞选活动。"
 unionstate.2101.a:0 "废了他！"
 unionstate.2101.b:0 "为什么我们要严肃对待一个面粉推销员？"
 unionstate.2300.t:0 "新联盟的首次选举"
 unionstate.2300.d.normalnopsa:0 "民主一直是美国的一大价值观，因此，尽管朗在其演讲中激发了民粹主义浪潮和对建制派的不信任，人们还是敦促政府举行大选，选出他们新联盟的第一任总统。尽管在战时条件下，大多数政党必须在很短的时间内迅速进行他们的竞选活动，但准备工作还算成功，现在人们将聚集起来投票选出合法的总统。\n\n预测结果当然有利于休伊·朗的美利坚至上党，因为他们仍裹挟着民粹主义浪潮，并对开始这场大斗争的领袖——朗给予支持。作为反对派的则是拉福莱特领导的国家进步党，他们一直是朗“财富分享计划”的主要支持者，但希望更加重视这一计划，因此决定以自己的政党参加竞选，表达他们的左翼观点。与此同时，威廉·达德利·佩利成立了他的“基督教党”，他成立该党的目的是为了代表美国的新教基督徒，并试图掀起另一场大觉醒运动。民主党虽然已经失去了大量支持者，但至少那些勇敢面对经济危机最严重时期的个别政客，仍保留了一些忠实的票仓。然而，尽管如此，曾经的建制派大党也并非一切顺利，它分裂为了两个独立候选人，奥丹尼尔老爹领导着德克萨斯民主党一派，试图将德克萨斯理念带往更为广阔的联盟国全境，而E·W·马兰的竞选纲领则试图维护美国民主价值观的完整，甚至提议尽可能地支持太平洋国，团结那些不愿推翻开国元勋确立的旧时体制的拥趸。\n\n现在投票已经结束，计票工作正在进行，获胜者是……"
 unionstate.2300.d.normalpsa:0 "民主一直是美国的一大价值观，因此，尽管朗在其演讲中激发了民粹主义浪潮和对建制派的不信任，人们还是敦促政府举行大选，选出他们新联盟的第一任总统。尽管在战时条件下，大多数政党必须在很短的时间内迅速进行他们的竞选活动，但准备工作还算成功，现在人们将聚集起来投票选出合法的总统。\n\n预测结果当然有利于休伊·朗的美利坚至上党，因为他们仍裹挟着民粹主义浪潮，并对开始这场大斗争的领袖——朗给予支持。作为反对派的则是拉福莱特领导的国家进步党，他们一直是朗“财富分享计划”的主要支持者，但希望更加重视这一计划，因此决定以自己的政党参加竞选，表达他们的左翼观点。与此同时，威廉·达德利·佩利成立了他的“基督教党”，他成立该党的目的是为了代表美国的新教基督徒，并试图掀起另一场大觉醒运动。民主党虽然已经失去了大量支持者，但至少那些勇敢面对经济危机最严重时期的个别政客，仍保留了一些忠实的票仓。然而，尽管如此，曾经的建制派大党也并非一切顺利，它分裂为了两个独立候选人，奥丹尼尔老爹领导着德克萨斯民主党一派，试图将德克萨斯理念带往更为广阔的联盟国全境，而E·W·马兰的竞选纲领则试图维护美国民主价值观的完整，甚至提议与太平洋国和平共处——其理由是他们与我们相似，两国可以避免流血冲突。\n\n现在投票已经结束，计票工作正在进行，获胜者是……"
