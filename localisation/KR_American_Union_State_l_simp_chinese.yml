 TEX_Francis_Everett_Townsend_eco_mli_desc:0 "弗朗西斯·埃弗里特·汤森，是一位出生于美国加利福尼亚州的医生，同时也作为一名政治活动家活跃于美国政坛。他曾在过去从事过多种职业，包括干草种植，医生，工厂主与公共卫生官员。在大萧条中，汤森通过向杂志编辑写信来提出了一项养老金计划，但最终并未被总统与国会接受。在内战中，汤森选择支持休伊·朗，以期达成他所希望的政治途径图景。"
