 kr_ingalls_shipyards_tex_desc:0 "罗伯特·英格索·英格尔斯花了多年时光东奔西走、四处筹措了大量的资金，于帕斯卡古拉河畔创立了以自己为名的英格尔斯造船厂。内战爆发后，极度缺乏战舰和商船的联盟国政府为该船厂提供了大笔资金，帮助推动了船厂的发展。"
