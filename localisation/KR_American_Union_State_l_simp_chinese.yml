 TEX_reconcile_coughlin:0 "与库格林和解"
 TEX_reconcile_coughlin_desc:0 "查尔斯·库格林与[TEX.GetLeader]间的关系一直很紧张，但在近来几周里，这种本已紧张的关系更糟了。尽管库格林拥有强有力的电台节目和规模庞大的追随者，但他从来不算是休伊·朗的密友，相反，他或多或少在党内搞了自己的小团体。这给库格林带来了一些问题，最为棘手的是，有人指控他不忠。尽管如此，他手中还是掌握着一定权力，明智一点，我们应当作出一些让步，让他的“社会公义”计划得到一些推行。"
 TEX_reconcile_smith:0 "与史密斯和解"
 TEX_reconcile_smith_desc:0 "杰拉尔德·L·K·史密斯在休伊死后尖锐地批评着[TEX.GetLeader]。我们的大多数顾问推测，这是因为他希望继承他偶像的遗志，并按照休伊的愿景领导国家。而其他人则简单地将这种粗暴归因为他害怕在政坛上被边缘化。不管真实情况如何，史密斯都是我们国家最有魅力的人之一，所以让他站在我们这一边会比将他完全排除在政治舞台外更为有利。然而，杰拉尔德·L·K·史密斯不是一个好说话的人，为了赢得他的支持，我们必须做出从为农民提供补贴，到追查史密斯指控的那些参与暗杀休伊的组织在内的某些让步。"
 TEX_reconcile_earl:0 "与厄尔·朗和解"
 TEX_reconcile_earl_desc:0 "厄尔·朗被他的侄子们和他的支持者亲切地称为“厄尔叔叔”，但他并不喜欢[TEX.GetLeader]。在休伊去世后，他在激动人心的演讲中也明确了这一事实。虽然他和他的兄弟间的关系有些复杂，但厄尔还是坚持认为他现在代表着朗家族的利益，赢得他的支持将让我们在许多人眼里具有一定程度的合法性。此外，厄尔叔叔也有一些出色的才能——他是一个迷人的故事讲述人，而且还是一个出色的演说家。最重要的是，在他朴实的外表背后，他实际上是一个精明的政客。我们最好抢在别人之前获得他的头脑。"
 TEX_reconcile_bingham:0 "与宾厄姆和解"
 TEX_reconcile_bingham_desc:0 "阿尔弗雷德·米切尔·宾厄姆领导着一个奇特的团体，从贝拉米主义者到社会主义者再到技术官僚，以及介于他们之间的一切。然而，不管他们喜欢给自己贴什么标签，他们都不太喜欢[TEX.GetLeader]，这也并不奇怪。毕竟，他们作为至上党的边缘派别很少参与到党派事物中去，而我们也没有做什么来改变这一现状。但是，如果我们要寻求他们的支持，我们可以对一些前联合工团和太平洋国中政治立场偏左的叛国者施加一些仁慈。此外，他们还希望我们继承休伊在产业公有化中开创的事业，并拓展他的计划，或在医保方面采取行动，一劳永逸地建立一个全国医保体系。"
