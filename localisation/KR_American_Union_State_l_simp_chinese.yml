 TEX_fortress_america_idea_3_desc:0 "不仅我们的人民，甚至大部分政府外交人士，都希望我们维持孤立主义。这正是我们要做的：美国将成为一个堡垒。第二次内战带来的苦难永远不会被忘记，但如果我们能够抵挡住一切可能的入侵者，至少我们可以说美国再次成为了一个和平的国家。"
