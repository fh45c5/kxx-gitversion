 AFP:0 "§1美利坚至上党§!"
 AFP_DESC:0 "§g美利坚至上党是一个美国民粹主义者的大混合体，它的成员普遍奉行劳工主义、爱国主义，并认为左翼社会主义是由不爱国者或极权主义者组成。他们依靠政治机器、分享财富计划、相对的文化保守主义、民粹主义信息传播、党员民兵，以及最重要的，以路易斯安那州州长，大煽动家休伊·朗为基础的个人主义，与其他进步派系对抗。因此，他们鼓吹建立一个由激进主义、民粹主义和实用主义组成的奇异混合体制，以建立一个以美国人身份认知为中心的亲劳工、亲农民的资本主义国家。§!\n--------------\n§G党派支持度超过75%则有机会在大选中获胜§!"
 NPP:0 "§O国家进步党§!"
 NPP_DESC:0 "§g内战中共和党在全国各地的党组织都分崩离析，而联盟国共和党组织瓦解后的一部分选择加入了国家进步党，该党由扎根威斯康星州的拉福莱特家族在麦迪逊创立，也是为数不多的朗政权的主要挑战者之一，该党声称自己比民粹主义者更进步。在国家进步党之外，拉福莱特还组织重组了曾经作为进步党分票者的农民-劳工-进步联盟，以继续吸引农民或是劳工选民为他们投票。§!\n--------------\n§G党派支持度超过75%则有机会在大选中获胜§!"
 CP:0 "§B基督教党§!"
 CP_DESC:0 "§g基督教党的成员多为在爱国主义、普遍就业和最低收入制度等民粹政策上志同道合的保守民粹主义者和前民主党人。党旗下有着自己的军事部门，奉行严厉的宪政主义、反社会主义、文化至上主义理论，以及佩利的密教思想。从上可以看出，基督教党内部极其分裂，而党内激进派又是毫不遮掩的种族威权主义者，这一切都让党的形势雪上加霜，真不知道佩利要怎么使唤这样一个党。§!\n--------------\n§G党派支持度超过75%则有机会在大选中获胜§!"
 DP1:0 "§2民主党§!"
 DP2:0 "§2民主党§!"
 DP_DESC1:0 "§g民主党在战后依靠着保存相对完好的各地的政治机器快速的完成了重组。尽管他们的支持者远不如内战前那般人多势众，但与同为建制派的他们的老对手，如今已经支离破碎的共和党比起来，民主党如今的情况则要好得多。如今，传统的保守民主党人在民主党内的话语权式微，而作为主导的自由派民主党人围绕在石油商人E·W·马兰身边，准备重现确保民主党对国家机器的控制。§!\n--------------\n§G党派支持度超过75%则有机会在大选中获胜§!"
 DP_DESC2:0 "§g在奥丹尼尔老爹的领导下，民主党现在已经恢复了活力，准备从内战和经济萧条的废墟中重建国家。德克萨斯成为了如今美国的重镇，它的文化和价值观必将对未来的美国文化产生深远的影响，就像近年来火爆的“乡巴佬男孩”乐队一样。虽然奥丹尼尔已经脱离乐队工作，但似乎每个美国人都听过“老爹，把饼干递给我”这句歌词，这正是他个人魅力和受欢迎程度的证明。依靠如此之多的支持，奥丹尼尔将把美国带向他的愿景。§!\n--------------\n§G党派支持度超过75%则有机会在大选中获胜§!"
