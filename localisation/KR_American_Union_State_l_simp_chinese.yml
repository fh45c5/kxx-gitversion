 TEX_based_sheen_idea:0 "美利坚迈向神圣"
 TEX_cathamerica_first_idea:0 "美利坚至上"
 TEX_blessed_are_the_based:0 "清心的人有福了"
 TEX_political_chaos_idea:0 "政治混乱"
 TEX_political_chaos_idea_desc:0 "休伊·朗去世后，美国又一次陷入了混乱之中。几位他曾最信任的副手与亲信正在后休伊·朗时代的政府中争夺权力，在脱颖而出之人登上权力的宝座，维持住政权的稳定之前，人民只得饱受混乱之苦。"
 TEX_political_chaos_two_idea:0 "改善政局"
 TEX_political_chaos_two_idea_desc:0 "再次团结美利坚至上党与国家，路漫漫其修远兮！不过，我们已经向这一目标迈出了第一步。我们现在必须继续为此目标而努力，为国家再次带来秩序。"
 TEX_minor_support_idea:0 "团结至上党"
 TEX_minor_support_idea_desc:0 "除现有的联盟外，我们还赢得了美利坚至上党中地位较低人士的支持。我们可以在他们的帮助下将治理国家变得更有效率。"
 TEX_coughlin_support_idea:0 "库格林联合政府"
 TEX_coughlin_support_idea_desc:0 "我们已经决定将查尔斯·库格林纳入新的至上党联盟，有了他强势的拥护，我们可以更牢固地控制这个国家。"
 TEX_smith_support_idea:0 "史密斯联合政府"
 TEX_smith_support_idea_desc:0 "我们已经决定将杰拉尔德·L·K·史密斯纳入新的至上党联盟，凭借他的魅力，我们可以更牢固地控制这个国家。"
 TEX_earl_support_idea:0 "厄尔联合政府"
 TEX_earl_support_idea_desc:0 "我们已经决定将厄尔·朗纳入新的至上党联盟，凭借他与休伊·朗的关系和令人难以抗拒的魅力，我们可以更牢固地控制这个国家。"
 TEX_bingham_support_idea:0 "宾厄姆联合政府"
 TEX_bingham_support_idea_desc:0 "我们已经决定将阿尔弗雷德·米切尔·宾厄姆纳入新的至上党联盟，有了他热情的拥护和他制定的工业计划，我们可以更牢固地控制这个国家。"
 TEX_insurgent_america_idea:0 "新美国精神"
 TEX_insurgent_america_idea_desc:0 "美利坚已从多年的毁坏中恢复过来，现在她由阿尔弗雷德·宾厄姆统治，新美利坚踏上了通往新繁荣的旅程。这段旅程无疑将会从建筑和基建开始。"
 TEX_dewey_plan_idea:0 "杜威计划"
 TEX_nationalized_healthcare_idea:0 "国家医疗保健系统"
 TEX_nationalized_healthcare_idea_desc:0 "国家医疗保健系统的出现使得宾厄姆的新美国计划离胜利又近了一步。现在，工人能够用更多时间来关注日常生活，孩子能够尽孝，新家庭能够被鼓励为国家增加人口。"
 TEX_production_for_use_idea:0 "为应用而生产"
 TEX_production_for_use_idea_desc:0 "为应用而生产，这是现在阿尔弗雷德·宾厄姆的愿景中最重要的组成部分。在理想社会里，一个人必须理解社会中的丰富资源是提供给每个人的，它因需求而运作，不为利润而运作。生产必须按照人民所需来生产，而不是什么挣钱生产什么。也就是说，我们不能浪费资源，我们要让全体人民更加高效，更加满意。"
 TEX_no_speculation_idea:0 "诚信经济规范"
 TEX_no_speculation_idea_desc:0 "投机倒把，这是一种长久以来危害美国人民的行为。宾厄姆，以及已逝的休·伊朗认为，要确保财富分配更加民主，必须要全面打击银行家和大富豪的贪婪行为。更多的财富掌握于中产阶级与贫穷者手中，经济才能更加公正诚信。"
 TEX_true_democracy_idea:0 "真正的民主"
 TEX_true_democracy_idea_desc:0 "真正的自由是工人在社会主义制度下享有的经济自由。由生活饱足的人民们，以和谐共识来支撑的工业民主，必能为新美利坚的社会提供动力。然而，尽管社群规模将变得更大，但每个人在这个社会中所抱有的主人翁意识也将变得更强大；更多的生活时间和更平等的生活条件，让我们的人民可以充分发挥自己的潜力，国家也将因此而繁荣。"
 TEX_middle_classes_idea:0 "中产阶级思维"
 TEX_middle_classes_idea_desc:0 "归根结底，不是财产决定阶级——而是心理。为了让革命在美国取得成功，就必须让革命适应中产阶级，因为他们的支持对我们的持续统治至关重要。然而，中产阶级将不仅包括经济上的资产阶级，而包括所有认为自己是中产阶级一员的人，这将让中产阶级占社会的很大一部分。通过利用这种认同，我们可以将劳工和经济上的中产阶级联合起来，并为建立激进的社会组织奠定基础。"
 TEX_outflanking_capitalists_idea:0 "智胜资本家"
 TEX_outflanking_capitalists_idea_desc:0 "宾厄姆的经济转型计划的第一步是建立一个以生产为目的，垂直管理的系统。在最初推行时，失业者都将被纳入这个系统，但在一年后，其他人也可以自愿地加入这个系统。我们国家的资源与闲置土地将被工厂主租借给政府，以此，我们将开始我们的实验。"
 TEX_socialist_efficiency_idea:0 "社会主义效率"
 TEX_socialist_efficiency_idea_desc:0 "在我们朝着新经济迈出了第一步后，我们现在可以将这一尝试推广到全国其他的地区。现在，掌握在政府手中的资源能更有效地为国家的繁荣发展服务。而随着计划经济的不断发展，我们的生产力也将前所未有的高。但无论如何，我们必须保持谨慎，以免激怒我们政权赖以生存的基础，即中产阶级们。因此，我们不会对经济体制进行彻底改革，但我们现有体制的高效将让人们自发拥护它……"
 TEX_society_of_plenty_idea:0 "丰裕社会"
 TEX_society_of_plenty_idea_desc:0 "在我们的新社会里，不会有囤积居奇。相反，在广阔的国家中，我们可以享受自然的资源救济。只要是财富，无论是否是自然资源，都将会在我国人口中不断流动。"
 TEX_tactical_patriotism_idea:0 "策略性爱国主义"
 TEX_tactical_patriotism_idea_desc:0 "为了得到广大美国人民的支持，我们必须利用他们的爱国主义与民族主义心理。尽管这不太符合我们的理想，但人们为自己的国家感到自豪可算不上犯罪，不过，如果我们想要一场可持续的革命，我们就必须消灭任何可能对我们形成挑战的极端民族主义者，以免他们明目张胆地动摇我们的执政基础。"
 TEX_tactical_patriotism_two_idea:0 "循循善诱"
 TEX_tactical_patriotism_two_idea_desc:0 "现在我们已经建立了真正的爱国主义政府，我们可以发挥它的优势。在民众中继续推进民族主义，可以让我们开始一场能够带来民族主义者真正需要的国家的社会主义运动。我们会把力量集中在军事和娱乐，比如体育、电影，以此来继续培育爱国主义这把利剑。"
 TEX_uncorrupted_government_idea:0 "正直政府"
 TEX_uncorrupted_government_idea_desc:0 "虽然一些人觉得这就是个笑话，另一些人直接认为这不可能，但我们仍相信，如果要想重建国家，首先就得建立一个正直政府。我们将尽可能地消除大企业对我们政坛的影响，并确保政府真正能做到“民有、民治、民享”。尽管休伊·朗并非完人，但他建立一个为人民服务的政府的梦想必将得到实现！"
 TEX_american_families_idea:0 "新美国，新家庭"
 TEX_american_families_idea_desc:0 "为了继续我们在美国推行的改革，我们必须强调家庭的作用。家庭既是保持国家稳定的单位，也是使国家团结起来的粘合剂。如果家庭纽带不复存在，我们也将岌岌可危。让我们为美国家庭提供补贴，让我们的人民安居乐业，繁衍生息。"
 TEX_christian_support_idea:0 "基督徒支持"
 TEX_christian_support_idea_desc:0 "虽然我们忠诚于自己的事业，但有时，我们也得努力争取教会的支持。休伊·朗从来认识不到他们的潜力，所以我们必须得自己去讨好他们。对于建设新美国来说，信仰是至关重要的，我们必须确保每个美国人都要在日常生活中遵循《圣经》的原则，只有这样，我们才能建设一个道德高尚的美国！"
 TEX_currency_reform_idea:0 "货币改革"
 TEX_currency_reform_idea_desc:0 "休伊·朗开启了货币改革的进程，我们也必须继续下去。国家进步党曾拥护的绿钞理念将为这次改革提供一个良好开端，尽管我们还不清楚接下来要干什么。但就目前而言，我们必须保护我们的农民不受贪婪的银行家和投机者的伤害，并确保他们的生活能够安全地重归正轨。"
 TEX_virtuous_america_idea:0 "新共和国"
 TEX_virtuous_america_idea_desc:0 "美利坚，作为一个共和国，它建立在正确的价值观之上，但却在数十年的腐败无能的管理之后迷失了前进方向。而现在，休伊·朗为我们开辟了改革国家的道路，我们的政府也将在上面阔步前行，我们将能再次拥有一个高尚的共和国。民主已重绽光芒，人民也为他们新获得的权力而欢欣鼓舞！"
 TEX_chicago_plan_idea:0 "芝加哥计划"
 TEX_chicago_plan_idea_desc:0 "起源于芝加哥大学的芝加哥计划旨在分离银行系统中的货币与信贷功能，该计划的目的是消除银行无法清偿贷款的风险。在理想情况下，银行既不能印刷货币，也不能影响货币供应，相反，国家将掌握印钞权。这将能够稳定我们的经济，并有望帮助我们走出近来的经济困境。"
 TEX_press_freedom_idea:0 "恢复新闻自由"
 TEX_press_freedom_idea_desc:0 "新闻自由是我们国家源远流长的传统之一。而在休伊·朗的战时政府时期，这些自由受到了限制，但如果我们要实现他的愿景，我们便必须恢复这些自由。毕竟，友好的媒体们可以让我们大受欢迎……"
 TEX_afp_machine_idea:0 "至上党政治机器"
 TEX_afp_machine_idea_desc:0 "在休伊·朗的一生中，他建立起了一个强大的朗主义政治机器来帮助他保持权力。然而，现在他已经逝世了，我们也自然而然地掌握了这个政治机器，我们可以利用它为自己牟利。既然政治机器已牢牢掌握在我们手中，我们也将在未来几年里牢牢地控制整个国家……"
 TEX_media_help_idea:0 "媒体救场！"
 TEX_media_help_idea_desc:0 "几十年来，对于那些焦急地等待着自己的竞选活动能否赢得选民的心的政客们来说，报纸一直是他们悲与喜的来源。而现在，随着广播的出现，媒体比以往任何时候都更加重要。有了媒体们的支持，我们便可以压倒任何国内外的对手。所以，我们必须确保我们对媒体的控制。毕竟，如果我们控制了媒体，我们也就控制了整个国家。"
 TEX_finish_industrialists_idea:0 "企业恭顺"
 TEX_finish_industrialists_idea_desc:0 "长期以来，我国一直在贪婪的工业巨头的魔爪下受苦受难。休伊一直都想要消灭他们的巨大影响，我们也必须完成他开创的事业。我们将对主要工业实行国有化政策，并对其中最富有的人征税，以使工业巨头们屈服，从而巩固我们政权的控制。向新美国经济迈进！"
 TEX_help_vets_idea:0 "照料老兵"
 TEX_help_vets_idea_desc:0 "我们的退伍军人们，数百万曾为我们英勇作战的人们，他们必须要被好生照顾。休伊·朗当然也是这么想的——他从不羞于向退伍军人承诺，承诺他们在战后会得到很好的补偿，而且他们也将是第一批看到他“人人皆国王”的愿景实现的人。尽管斯人已逝，但无论如何，我们都必须兑现他的这些承诺。我们将为退伍军人们提供更多的补贴、住房与其他福利，以此，我们将能确保社会稳定，人民安居乐业。"
 TEX_ending_poverty_idea:0 "终结贫困"
 TEX_ending_poverty_idea_desc:0 "也许，在休伊·朗的梦想之中，他最想要建立一个消除了贫困的国家。这个国家将是一个财富分配更加公平的国家，每个人都将能像国王一样生活，像国王一样行使权利。虽然他出师未捷身先死，但我们已完成了他的事业，现在，美利坚再次屹立于世，而美国人民亦不再受贫困之苦！"
 TEX_earl_machine_idea:0 "厄尔叔叔的政治机器"
 TEX_earl_machine_idea_desc:0 "虽然厄尔·朗是休伊的兄弟，也是休伊的天然继承人，但他哥哥创造的政治机器却绝不是一件容易控制或容易获得的事物。不过现在我们已经为厄尔争取到了它的支持，我们离巩固休伊继任者的地位和国家的合法政府地位也又近了一步。只要我们现在能好好地控制住这台机器……"
 TEX_earl_machine_idea_2:0 "人民之子"
 TEX_earl_machine_idea_2_desc:0 "虽然休伊·朗以为人民而战而闻名，但只有在他的弟弟厄尔身上，受压迫的美国人民们才找到了一个真正的盟友。在全国各地，农民、工人和无家可归的人都是厄尔·朗的朋友，他总是喜欢让他们陪在身旁，而非接受那些官僚政客的拍马逢迎。他十分渴望与人民打成一片，这也让他和他的政府得到了许多支持，而现在，我们将收获他的魅力与贴近群众的作风的果实。"
 TEX_earl_machine_idea_3:0 "受人爱戴"
 TEX_earl_machine_idea_3_desc:0 "厄尔·朗，现在他已名声在外，能让自己有别于他的哥哥，也终于可以自豪地欣赏自己所建设的一切。一个政治网络——一个由厄尔与他最亲密的盟友构建的网络，现在正控制着整个国家。但更重要的是，厄尔叔叔已赢得了人民的支持，而有了人民的支持，他便可以继续为人民而战，就像人民也为他而战一样。"
 TEX_the_three_ps_idea:0 "政治，百姓，豌豆农场"
 TEX_the_three_ps_idea_desc:0 "虽然在一些人看来，厄尔·朗可能是一个单纯而善良的政治家，但实际上，他是一个政治大师，在煽动群众与赢得支持的能力上可与他的哥哥相媲美。他从不会为赢得支持在政治泥潭中跋涉，厄尔·朗也成功地在其兄遇害后政府里众人虎视眈眈的情况下生存了下来，现在，他可以平安地参观他心爱的豌豆农场，并与数百名当地人和游客亲切交谈。他在农场里与国家舞台上的辛勤劳动为我们带来了超乎想象的繁荣！"
 TEX_retail_taxation_idea:0 "汽油，啤酒，零售业税"
 TEX_retail_taxation_idea_desc:0 "为了给我们的一些政策提供资金，并为我们的政府提供更多的预算，我们决定对汽油、啤酒与零售业征收新税。这些东西一开始可能不受欢迎，但至少我们的人民是有能力支付这些费用的……"
 TEX_end_civil_service_idea:0 "废止公务员制度"
 TEX_end_civil_service_idea_desc:0 "由于全国范围内，特别是那些南方的老派政客们正强烈反对厄尔·朗和他的改革，朗已下定决心，他必须采取行动。为了打击这些政客的权力，他宣布废止公务员制度，抽去这些腐败政客的支持基础。与从前相反，这些人将不得不寻求总统办公室的庇护，我们也将因此变得更加强大。"
 TEX_black_enfranchisement_idea:0 "扩大公民范围"
 TEX_black_enfranchisement_idea_desc:0 "在第一次内战之后，许多获得自由的奴隶都希望获得选举权，并且在一段时间内，他们也享受到了这项权利。然而，吉姆·克劳法的出台却剥夺了美国大部分地区非裔美国人的投票权，现在，我们必须废除这一政策。虽然在谈及此一问题时，厄尔·朗总是高谈阔论道德和自由主义，但又有谁不喜欢多些个票仓呢？"
 TEX_take_care_of_people_idea:0 "穷人得食"
 TEX_take_care_of_people_idea_desc:0 "为了获得更多潜在选民的支持，也为了进一步实现休伊“人人皆国王”的梦想，厄尔·朗决定实施食品计划，为穷人和住校学生提供食物供应。住校生能吃上免费午餐，我们国家最贫困的地区的人们也至少也能得到一些食物。而有了这些成就，我们便可以期待更有生产力的劳动力和更加振奋的民众了。"
 TEX_take_care_of_people_2_idea:0 "上佳医疗"
 TEX_take_care_of_people_2_idea_desc:0 "对厄尔·朗来说，照顾人民便意味着必须能让他们在生病或受伤时能得到足够的就医机会。而就路易斯安那州乡村地区的医院状况，以及美国其他乡村地区的医院状况来说，不说差强人意，至少可以说是糟糕透顶。我们将致力于推进农村地区和其他地区的医院现代化，我们可以以此确保我们的人民至少能够得到他们所需要的医疗服务。虽然休伊·朗还是因刺杀造成的创伤而死，但厄尔·朗解释说，接收他的医院还是尽了最大努力来挽救他的生命，而所有人也应当得到这种待遇。"
 TEX_christian_renewal__idea:0 "家庭援助计划"
 TEX_christian_renewal__idea_desc:0 "家庭是我们国家的基石，虽然休伊·朗已尽其所能支持他们，但我们必须更进一步。政府将向受灾家庭和夫妇提供补贴，特别是那些退伍军人和其他忠诚公民的家庭，希望能以此鼓励他们多生孩子。"
 TEX_christian_renewal_3_idea:0 "朗总统的新信徒"
 TEX_christian_renewal_3_idea_desc:0 "很少有人能达到杰拉尔德·K·史密斯热爱休伊·朗的程度，而他认为，最重要的是我们不能忘记休伊·朗。年轻一代还太过年轻，无法理解休伊·朗的思想，而现在他们也成长在一个没有休伊·朗的世界里，我们应该引导他们去了解他的事迹，并确保史密斯被他们视为朗的运动的继承人。在这些新的历史学家和基督教青年们的支持下，我们将建立一个会让休伊骄傲的美国。"
 TEX_smith_veterans_idea:0 "史密斯的老兵们"
 TEX_smith_veterans_idea_desc:0 "在内战期间，史密斯作为一名军事将领赢得了极高的声誉，他的部下衷心爱戴他，而四面八方的敌人也都惧怕他。而现在战争结束了，一大批退伍军人也对史密斯忠心耿耿。如果有必要，我们将能够再次召集这些人来保卫国家与史密斯的运动。有了他们的帮助，我们无坚不摧！"
 TEX_masses_propaganda_idea:0 "鼓动大众"
 TEX_masses_propaganda_idea_desc:0 "被誉为地球上最有魅力的人，杰拉尔德·K·史密斯决定继续向人民发表鼓舞人心的演讲，这让人想起休伊·朗以前的巡回演讲。这些演讲旨在为史密斯的政策争取更多的支持，增加他自己的声望，也能激励民众。史密斯将利用他所掌握的最伟大的工具，把美国带向一个繁荣的新时代。"
 TEX_new_silver_idea:0 "重启银本位制"
 TEX_new_silver_idea_desc:0 "为了刺激经济，以继续休伊·朗的政策，并巩固自己的基础盘，查尔斯·库格林宣布重启银本位制。有了银本位货币作支撑，我们的经济将更加稳定，也让我们能够在需要时增加货币供应。而有了这些新资源后，我们就能照顾好所有美国人。"
 TEX_new_silver_2_idea:0 "穷人享减税"
 TEX_new_silver_2_idea_desc:0 "虽然休伊要求富人向国家上缴部分财富的做法是正确的，但我们还必须去救济美国的贫困人口。这是一件基督徒应该做的事，也是一项极好的政策：只要人民站在我们这边，我们就无惧境内外威胁。此外，库格林希望向穷人提供救济将提振他们的消费欲望，从而促使经济繁荣。毕竟，照顾人民就是照顾国家。"
 TEX_new_silver_3_idea:0 "廉洁高效的政府"
 TEX_new_silver_3_idea_desc:0 "休伊·朗政府和华盛顿的旧联邦政府一个共有的问题就是臃肿与腐败。我们必须精简政府的日常工作，削减不必要的项目，让我们的经济和国家负起责任来。如果我们能处理好这一切，我们就离库格林所设想的政府又近了一步。"
 TEX_new_silver_4_idea:0 "信仰自由"
 TEX_new_silver_4_idea_desc:0 "尽管国家在库格林为美国制定的计划中扮演着重要的角色，但它也不能过分干涉人们的生活。我们必须让我们的人民有信仰的自由，让他们生活在一个充满正义与道德的国家，一个能在他们身处困境时帮助他们、在安居乐业时也不干涉他们的国家。我们将遵循社会公正的原则，确保所有人都能在社会中自由从事自己选择的嗜好。"
 TEX_wealth_conscription_idea:0 "资本遭课税"
 TEX_wealth_conscription_idea_desc:0 "在这危急时刻，我们必须强制收集国内的财富。富人必须为国防和在废墟中重建国家做出贡献，这样我们才能通过这些财富行一些必要之事，不然我们将捉襟见肘。这些财富可以让我们进行新的科学研究，获得战略资源，保障军队后勤，而有了这些东西，我们将拥有一个比以往任何时候都强大的国家！"
 TEX_national_sermons_idea:0 "向全国布道"
 TEX_national_sermons_idea_desc:0 "在库格林掌权之前，他曾向全国的听众发表广播演讲，数百万人曾聆听过他的政治演说。而现在我们掌握了权力，成为了合法政府，我们可以让这一历史派上用场。库格林将继续在电台布道，为他的政策辩护并为人民提供道德指引。在库格林的掌控下，电台会成为一个强大的工具，他也会明智地使用它。"
 TEX_our_economy_idea:0 "我们的经济"
 TEX_our_economy_idea_desc:0 "既然我们已让经济摆脱了那些影子金融家的操控，我们便可以根据自己的需要来利用我们的经济。新的工厂与资源现在将完全在我们的控制之下，与往常一样，库格林承诺建立一个前所未有的高效经济！"
 TEX_christian_capitalism_idea:0 "天主教资本主义"
 TEX_christian_capitalism_idea_desc:0 "虽然我们必须对资本主义加以改革，但重中之重是确保我们遵循基督教的真正原则。我们将关心穷人，资本主义虽然仍将存在，但我们将强力鼓励富人参与慈善活动。而通过密切关注企业，确保人民的道德和幸福，我们可以让我们的经济重归正轨。"
 TEX_exalt_humble_idea:0 "庇护弱者"
 TEX_exalt_humble_idea_desc:0 "在毁灭性的内战之后，我国许多人民身处贫困的深渊。为了解决这个问题，我们必须强调他们是我们法律庇护下的群体，而通过帮助这些我们当中最卑微的人，我们将帮助整个国家。并且，我们关注的是穷人，我们也不会过于针对富人，但富人们还是要尽一份力。只要人人携起手来，我们将能进入一个新时代。"
 TEX_punish_wealth_idea:0 "惩戒贪腐"
 TEX_punish_wealth_idea_desc:0 "如果我们的改革要成功，我们必须一劳永逸地破坏垄断和工业巨头的力量。也正是这些团体反对着休伊·朗的改革，而我们将用他们的财富，为整个国家造福。但这是一个富人无法理解的事实——他们实在是鼠目寸光。我们必须惩罚他们的短视与贪婪，确保美国是一个为全体人民服务的国家，而不仅仅是个为人上人服务的国家。"
 TEX_ban_unions_idea:0 "勤劳的美国人"
 TEX_ban_unions_idea_desc:0 "我们将把重点放在勤劳工作之上，而非让我们的人民加入工会。美国人民一向以其职业道德而闻名，为了实现休伊·朗的愿景，我们也必须利用这一品质。"
 TEX_loyal_unions_idea:0 "忠诚工人"
 TEX_loyal_unions_idea_desc:0 "在资本与劳动者的冲突中，最重要的是谁对我们忠诚。在资本家的势力已被削弱的情况下，我们现在应该转而支持工会，确保他们的忠诚。在内战期间，许多工会站在联合工团一边，但那些选择站在休伊·朗一边的工会现在成为了全国最有权势的工会。他们的忠诚支持意味着我们不必担心工厂内的破坏或效率低下的工人。工会将按照协商的方式履行他们的职责，我们也将因此而变得更好。"
 TEX_subsidized_unions_idea:0 "工人得补贴"
 TEX_subsidized_unions_idea_desc:0 "快乐的工人就是多产的工人，而为了确保我们的工人快乐，我们必须让他们拥有发出声音的权利。我们将为工会提供官方支持和补贴，以此让他们坚定地站在我们这边，同时让他们有足够的力量来挑战企业家。"
 TEX_wealth_cap:0 "财富限额"

TEX_reconstruction_is_over_tooltip:0 "§G我们已从内战的余波中成功恢复过来§!\n"
 TEX_anti_syndicalist_pact_tooltip:0 "我们将寻求对抗第三国际\n"
