 TEX_christian_renewal_idea_desc:0 "杰拉尔德·K·史密斯希望在这个国家掀起第四次大觉醒运动，这是他在过去十年面临了一系列灾难后，制定的国家重建计划中的一部分。他从前三次运动中汲取灵感，基督教徒，尤其是新教徒将会重整旗鼓，因为美国人民会记得是何种信仰曾引导他们度过最艰难的时期。而随着他们重建了信仰，我们人民心中的伤痕也终于可以开始愈合。"
 TEX_christian_renewal_2_idea:0 "美利坚道德观"
 TEX_christian_renewal_2_idea_desc:0 "休伊·朗认为美国世风日下的部分原因在于贪婪的商人和对穷人的不人道对待，另一部分原因还在于道德的败坏，他当然是对的。在过去的十年里，婚姻和家庭数量都在减少，犯罪也折磨着这个国家。而现在，随着史密斯完成了休伊·朗的“分享财富”计划，我们再次在这个国家里重建了道德。"
