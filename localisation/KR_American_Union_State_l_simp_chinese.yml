 kr_ryan_aircraft_tex:0 "瑞安航空"
 kr_ryan_aircraft_tex_desc:0 "尽管图巴尔·克劳德·瑞安在著名的圣路易斯精神的建构过程中的地位往往被人高估，但是瑞安的公司同林德伯格的关系让这家公司开遍了从圣迭戈到北卡罗来纳的各个地区，并获得了当时新兴的朗派们的青睐。"
