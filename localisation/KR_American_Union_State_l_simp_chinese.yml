TEX.1.t:0 "基督教阵线的成立"
 TEX.1.d:0 "内战中，查尔斯·库林格神父作为至上党的一员，拉拢了相当数量的基督徒与爱国者加入联盟国并为我们的事业奋战。因此，库林格神父在战后也作为至上党的高层加入了新政府。然而，近日随着库林格神父的威望日增，大量的至上党人与我们的选民开始不再遵从党和朗本人的指示与号召，而是跟随在库林格神父身后。而库林格神父，尽管他仍然作为一名至上党成员活跃在政界，但他半公开的成立了一个名为“基督教阵线”的囊括宗教人士，极右翼民兵，煽动家与右翼至上党成员的团体。这些人的出身，选区或是职业各不相同，但唯一的共同点则是他们都是库林格神父的铁杆支持者，甚至于他们中的一小撮人对至上党持无视或反对态度。现在，随着这些人与神父本人的运作，这个新成立的组织的影响力还在持续扩大中......"
 TEX.1.a:0 "又一个小团体......"
 TEX.2.t:0 "全新的汤森计划草案"
 TEX.2.d:0 "弗朗西斯·汤森医生再次回到了公众视野之中。在政府重建工作日渐推进的当下，这位来自加州的老年人道主义者，正式递交了一份基于1933年原始设想的新草案，其核心依旧是为年满60岁以上、无稳定收入的美国公民发放固定养老金。这份草案被重新命名为“公民养老金保障提案”，但更被人所接受的名称仍然是“汤森计划”。内容在原计划的基础上有所修订：每位符合条件的公民将每月获得120至160美元不等的养老金补助，资金来源则改为对高额消费与企业盈余征收的“国民养老专项税”。这项提案在国会引发了一定的争议，温和派普遍认为，在国家复兴时期实行过于激进的福利制度无疑会摧毁我们的财政根基。而大量的至上党党员们则大力支持这项举措，认为这毫无疑问能加强党的声望与权威。"
 TEX.2.a:0 "尽可能地落实下去"
 TEX.2.b:0 "在财政允许的情况下施行"
 TEX.3.t:0 "维系天平"
 TEX.3.d:0 "如今的情况不容乐观，尽管美利坚至上党已经成功的夺取了这个新生国家的政权，但事实上是，对于其余内战势力所占据的土地来说，我们的控制依然是薄弱的。但如今，新政府内包含了几乎所有在内战时期忠于我们的团体与势力，包括民主党人，银衫军，进步主义者，宗教人士，温和左翼主义者等等。政府与各地州县的官职数量难以满足这些不同意识形态的需要，更不要说如果我们出让太多权利，至上党内部就会对休伊·朗总统与他的幕僚们产生不满。我们究竟是要真正站在我们的忠诚者们一边，还是尽可能的满足各方势力的要求，建立一个至少暂时稳定运行的团结政府？"
 TEX.3.a:0 "偏向忠诚者"
 TEX.3.b:0 "团结我们能团结的一切势力"
 TEX.4.t:0 "新秀或是柱石"
 TEX.4.d:0 "如今的至上党党内，相当一部分的巨头都是休伊·朗在美国内战前拉起的支持者。这些人尽管可能没有足够的智慧，又或者缺乏足够的能力来在政治斗争中帮助朗总统，但他们的忠诚是无可置疑的。但随着国家政治秩序的重建，至上党急需大量的年富力强的中层干部来确保对国家，对选民的控制。同时，为了更好地贯彻朗总统的民粹主义改革计划，忠诚而又能干的执行者也是必不可少的。现在朗总统将提拔一批干部进入政府为自己工作，一部分党内的老同志认为人选必须由党内的高层审查并且要从政府的基层官员做起。但也有党内的激进派与少壮派认为只有吸收更多新鲜血液至上党才能更好的统领这个国家。"
 TEX.4.a:0 "老同志更可靠"
 TEX.4.b:0 "老登该滚蛋了"
 TEX.5.t:0 "党的路线？"
 TEX.5.d:0 "内战的余波已散，而政治上的重建工作却并未就此完结。正相反，美利坚至上党如今亟须在全国各地，尤其是前内战敌对势力的地盘组建起属于自己的政治机器，以达到确保至上党的统治的目的。然而，如果不吸纳来自其他政治组织的人手，仅凭至上党在短时间内达到上述程度堪称天方夜谭。因此，至上党必须选择联合一批政治势力。其中一个选择是与全国各地的进步主义者，温和社会主义者，贝拉米主义者甚至是愿意与我们合作的无政府主义者达成和解，并吸纳这些人进入至上党。党内的左派譬如阿尔弗雷德·宾厄姆对这个选择始终持支持态度。一部分人也认为鉴于至上党一直以来的反资本主义，反垄断主义等民粹主义主张，吸纳一些温和的左派的确不失为一个好选择。而占据党内相对多数的右翼分子则大力鼓吹选择和旧民主党甚至一部分3K党徒和解。在内战结束后，一部分前旧民主党人选择投靠了在我们境内活动的民主党，而这些人与包括杰拉尔德·L·K·史密斯与库格林神父的右翼民粹主义者们达成共识，共同推动与旧民主党和解一事。当然，无论这些不同派别如何争吵辩论，最终的决定权仍然取决于我们的休伊·朗总统。"
 TEX.5.a:0 "至少我们跟左人还有的聊"
 TEX.5.b:0 "还得是我们的迪克西朋友！"
 TEX.6.t:0 "银衫军的提案"
 TEX.6.d:0 "尽管内战结束了，但全国各地的抵抗力量尚未被彻底的根除。如今我们的各地行政官员时不时会遭到来自赤匪，联邦派，黑色军团或者黑人抵抗军的袭击。一分钟人的战斗力量与各地的国民警卫队对此疲于奔命，国家的财政支出也难以承受如此巨大的压力。这时，银衫军的领导者，同时也是基督教党的党魁，古怪的威廉·达德利·佩利向我们发出了提案。他声称，银衫军与基督教党愿意帮助政府在各地维持秩序并且在政治上共同打击朗的敌人，但代价是至上党政府必须接手银衫军提出了一系列的种族政策，包括佩利本人的分区制度的温和版，以及对包括南方黑人，犹太人等人种的隔离制度。朗总统和幕僚很清楚这笔交易很难达成共识，但国内愈发危险的治安现状也不容乐观。"
 TEX.6.a:0 "没办法，同意他们的要求"
 TEX.6.b:0 "选择能让双方都能接受的方案"
 TEX.6.c:0 "不可接受"
 TEX.7.t:0 "史密斯出走！"
 TEX.7.d:0 "在选择与左派合流后，就不断有极右翼分子与右翼民粹主义者选择脱离我党，转而加入基督教党或是民主党等保守主义倾向明显的右翼政党。有鉴于与温和左派合作后越发左倾的党内路线，杰拉尔德·L·K·史密斯终于“受够了”我党的左倾倾向，并宣布他将正式加入基督教党。在声明发出的同时，一大批忠于史密斯的至上党人与一分钟人民兵选择追随他们的领袖而一同加入基督教党。还有一部分正在观望的右派见此也纷纷脱离至上党。史密斯还声称我们不愿对抗犹太势力和工团激进分子，而是选择与他们媾和。这正是对美国人民与美国国父们的背叛。这次突发情况后，统计显示他带走了至上党相当一部分的右翼人士，使我们不得不更依赖于前左派人士的投票。"
 TEX.7.a:0 "一个叛徒去投奔一个小丑...?"
 TEX.8.t:0 "决定一分钟人的战后职能"
 TEX.8.d:0 "随着内战的结束，如何处理一分钟人这个民兵组织就成了摆在我们面前的大问题。大部分党员与朗的同志们都认为一分钟人作为让我们能够在惨烈的内战中脱颖而出的重要武装力量，必须要得到保留，甚至必要的话将会作为新的联盟国正式武装力量。当然也有少部分声音认为，在如今的和平环境中，维持一支这样的军事组织在经济上会严重拖累新生的美国发展，同时也为野心家与阴谋家提供了颠覆政府的有力工具。在经过多轮争吵与会议后，第三种提案逐渐被众人所接受，即保留一分钟人，但仅仅将之作为总统或是政府重要人员的安保力量来维持，以确保国家重要领导人的安全，同时还能够保留这个功勋卓著的军事组织。"
 TEX.8.a:0 "将一分钟人正规化，编入国防序列"
 TEX.8.b:0 "裁撤他们吧，仅仅留下一点人作为对他们功勋的纪念"
 TEX.8.c:0 "缩编并将之用于总统安保"
 TEX.9.t:0 "强化基督教阵线？"
 TEX.9.d:0 "如今随着国家的安定，社会的秩序也逐渐恢复。这其中自然少不了库林格神父为维持秩序所做出的努力。但时至今日，库林格本人所组织的政治团体基督教阵线已经成为了附着在至上党之外的颇具影响力的社会组织。在大量的公开与非公开场合，库林格神父总是身穿神职者袍服而非西装或是正式的服装。更重要的是，这个组织不仅在全国拥有可观的的民间网络与广播覆盖，也通过各地的教会、学校和慈善团体渗透进了社会生活的方方面面。基督教阵线的慈善厨房可以比国营的救济点更快地送到饥饿者手中，某些州的青年会能比地方政府更有效地维持夜间治安，甚至连一些低级法院的调解也开始依靠教会调停员来主持。如今我们面临一个抉择，是继续放任库林格的所作所为，继续以往的扶持政策，还是仅仅在口头上表达对库林格神父的支持？"
 TEX.9.a:0 "继续给他们拨款"
 TEX.9.b:0 "口头支持就足够了"
 TEX.10.t:0 "选票流向"
 TEX.10.d:0 "各大民主党派在全国各地都开始了轰轰烈烈的竞选活动，以争取在未来的国家选举中赢得胜利并入主白宫。尽管至上党的政治机器已经开足马力运作，但我们还是很难确保在每一个州县，每一个选区都在选民数量上占据优势。但好在我们如今已经基本掌控了各地的政府机关。现在我们可以给其余党派的竞选活动搞点破坏，以达到削弱他们的力量的目的。又或者我们可以相信凭借至上党在选民中的人气，在接下来的大选中我们能够公平竞争击败这些政治对手。"
 TEX.10.a:0 "公平是最重要的"
 TEX.10.b:0 "使点绊子总是好的"
 TEX.11.t:0 "州权的地位"
 TEX.11.d:0 "现如今的至上党，已经确立了党的方向。越来越多的保守派与旧民主党人加入了至上党，而原有的支持左翼民粹主义路线的成员大多已被边缘化或是自己离开了至上党。在这些旧民主党人的推动下，越来越多的旧民主党所提倡或是推广的提案已经被摆上了朗总统的案头。目前，党内的传统派与保守主义者为了决定各州政府的地位而僵持不下。朗的追随者们普遍认为，正是过去联邦政府对各州政府机关与军事武装力量的掌控太过薄弱，才导致在第二次美国内战爆发时显得如此束手无策。为了避免下一次国家分裂，州政府权力必须时刻匍匐在联邦政府的权力之下。而传统的民主党人与保守派则大力支持对州权的强化与权力下放，毕竟这就是他们在民主党或是旧民主党内所做的。当然，最终的一切决定均取决于朗本人。"
 TEX.11.a:0 "联邦拥有一切最高权力！"
 TEX.11.b:0 "强化州权才是国父们期望的"
 TEX.12.t:0 "予以玫瑰，或是枪弹?"
 TEX.12.d:0 "至上党在吸纳了越来越多的温和左翼分子加入后，已经逐渐变成了一个横跨左中右的一个超级大帐篷式的政党。而这种臃肿的现状也导致了党内行政效率的极端低下。各派势力在党内形成了无数个小团体，整天为了各种提案的通过与否喋喋不休。如今，休伊·朗总统必须做出行动，以迅速结束党的极端冗员状况。鉴于党的左翼民粹路线，对于人员的取舍必须以相对进步的，偏向党的左翼民粹路线的成员为基本盘。而对于党内的右翼分子，则有了各种不同的措施。一部分忠诚的老党员向朗总统进言，认为彻底的切割右派会导致那些人带着他们的支持者滑向基督教党或是民主党这样的保守政党，这对今后的选举是极其不利的。也有声音认为，留下这些保守者在党内只会干扰今后的所有进步议程。为了至上党的未来，这些保守主义者必须清除出党。"
 TEX.12.a:0 "维持党的大帐篷形式，但更偏向左派"
 TEX.12.b:0 "是时候与那些老保们切割了"
 TEX.13.t:0 "民主党提名总统候选人"
 TEX.13.d.notxs:0 "随着休伊·朗总统向公众承诺，“在‘国家艰难时期’过后，选举就会正常进行”后，各大政党都开始挑选并投票表决出他们的总统候选人，而重组的民主党也是自然。在内战中，共和党的政治机器遭到了毁灭性的打击，而选区更集中于南方的民主党受到的伤害则小得多，因此民主党人们得以在战后重新以至上党境内的民主党组织为基础，重建了民主党。在这之中，内战前不甚突出的德克萨斯民主党一跃成为了民主党内的最大的派系。这些民主党人都倾向于支持来自德克萨斯的面粉商人与政客，W·李·奥丹尼尔。这位富有感染力与乡下人质朴的新人政客在内战期间收到了德克萨斯人的广泛欢迎。而其余的正统民主党人分为不同派系，各有各的心仪总统提名候选，其中呼声最高的是石油商人E·W·马兰。他也是最有希望与奥丹尼尔竞争总统提名的候选人。公众普遍认为，新一届民主党总统候选人就将从他们两人中选出。随着党内选举的结束，我们也得知了民主党的总统候选人。"
 TEX.13.d.txs:0 "随着休伊·朗总统向公众承诺，“在‘国家艰难时期’过后，选举就会正常进行”后，各大政党都开始挑选并投票表决出他们的总统候选人，而重组的民主党也是自然。在内战中，共和党的政治机器遭到了毁灭性的打击，而选区更集中于南方的民主党受到的伤害则小得多，因此民主党人们得以在战后重新以至上党境内的民主党组织为基础，重建了民主党。这些正统民主党人分为不同派系，各有各的心仪总统提名候选，其中呼声最高的是石油商人E·W·马兰。他也是最有希望赢得总统提名的候选人。公众普遍认为，新一届民主党总统候选人就将会是这位石油商人。随着党内选举的结束，我们也得知了民主党的总统候选人。"
 TEX.13.a:0 "毫无悬念，石油商人E·W·马兰赢得了总统提名"
 TEX.13.b:0 "德克萨斯民主党出人意料的获胜，W·李·奥丹尼尔赢得了总统提名"
 TEX.13.c:0 "正统民主党人占据了优势，石油商人E·W·马兰赢得了总统提名"
 TEX.14.t:0 "新奥尔良军事会议"
 TEX.14.d:0 "内战已经迫在眉睫，然而如今总参谋长职位空缺这一事实引起了政界和军方各大领导人物的普遍担忧。因此，所有军方人士与休伊·朗及他的亲信们在新奥尔良进行了会晤，希望任命一位总参谋长来打赢这场战争。参谋长之位主要是在三名专业军官之间展开竞争：与艾森豪威尔堪称宿敌的“微笑杰克”雅各布·德弗斯主张机动化部队，以分割包围的战术来迅速歼灭内战各方势力的有生力量，以达到快速决定战局的目的；“闪电乔”J·劳顿·柯林斯赞成依靠火炮作为主力，以火力覆盖战法，配合机械化的军队，击溃敌方的主力部队。而“恐怖特里”老特里·德拉梅萨·艾伦主张运用先进的战术规划，提倡效仿欧洲国家，建立一个职能与总参谋部类似的机构以总览战争计划。\n\n然而，至上党中的右翼分子将这次会议视为一个他们争权夺利的良好机会，因而他们的领袖杰拉尔德·L·K·史密斯在查尔斯·库格林神父和许多一分钟人与银色军团指挥官的支持下，提出了一个更政治化的解决方案：即通过对新教信徒进行大规模招募和武装，同时在各地颁布更大规模的征兵运动。他们希望通过宣传机器宣扬这是一场“圣战”，以达到在军力上对其他内战势力的碾压。尽管对三位专业军官的任命仍然有争论，但可以肯定的是，如果朗总统选择任命史密斯，党内右翼的势力一定会不可避免地扩张，其本人更会在今后的联盟国政坛上拥有更广泛的支持与更雄厚的政治资本。"
 TEX.14.a:0 "“微笑杰克”雅各布·德弗斯"
 TEX.14.b:0 "“闪电乔”柯林斯"
 TEX.14.c:0 "老特里·德拉梅萨·艾伦"
 TEX.14.f:0 "杰拉尔德·L·K·史密斯"
 TEX.15.t:0 "新国家副总统人选"
 TEX.15.d:0 "尽管基督教党的胜利出乎了包括至上党人在内的相当一部分国民的意料，但对于佩利与他的银衫军追随者们来说仿佛一切都在意料中。在国会大厦前发表了自己的就职演说后，摆在因胜利而洋洋自得的威廉·达德利·佩利面前的就是如何分配包括副总统在内的内阁职位。在这些官职中，最受人瞩目的就是副总统的人选。对于大部分基督教党人与大众观察家们来说，这个职位大概率甚至一定会落到佩利最为忠实的“狗腿子”，威拉德·坎普头上。这个忠实的银衫军与至上党徒总是毫无质疑的执行着银衫军大团长的命令。在整个竞选活动中，也是坎普为佩利出力最多。当然，杰拉尔德·L·K·史密斯也是一个热门的副总统候选人。这个激进的基督教民族主义者在内战中通过同时干涉政府事务与指挥民兵作战而在新国家的各派势力中都获取到了相当的人脉与实力。更不用说史密斯本人也是在银衫军内部影响力仅次于佩利的人物。如果佩利在制定副手这件事上抛弃了史密斯，很难保他会不会以任何手腕反击佩利。 "
 TEX.15.a:0 "佩利指定忠诚的威拉德·坎普作为副总统"
 TEX.15.b:0 "佩利指定狂热的杰拉尔德·L·K·史密斯作为副总统"
 TEX.16.t:0 "银衫军在行动"
 TEX.16.d:0 "深夜，首都万籁俱寂，而大道上却并非空无一人。街边昏黄的路灯下面出现了一批批坐着吉普车与卡车的银衫军，而他们的目的地直指政府大楼。此时，这批银衫军的首领，同时也是这次深夜政变的策划者，杰拉尔德·L·K·史密斯坐在一辆装甲车中，在两辆坦克为首的装甲分队中向着广播大楼前进。在行进过程中，武装部队分为了三部分，分别前往夺取国会，广播大楼与城外银衫军屋舍驻扎的银衫军。在凌晨两点，史密斯率领武装部队突破了聊胜于无的广播大楼的守卫，"
 TEX.16.a:0 "史密斯夺取了首都的控制权，政变成功了"
 TEX.16.b:0 "政变部队被赶来的忠诚银衫军与军队镇压，史密斯本人被射杀"
 TEX.17.t:0 "新选举"
 TEX.17.d:0 "新的选举已经近在眼前，全国各大政党纷纷动员起来准备在未来的选举中博得头筹。包括民主党，基督教党，国家进步党等大型党派都参与了进来，在全国各地的选区积极的为自己进行拉票活动。全国上下所有公民都热切期盼着新选举的结果。"
 TEX.17.a:0 "哈哈你猜谁会赢得选举？"
 TEX.18.t:0 "总统人选"
 TEX.18.d:0 "朗遇刺的混乱导致了至上党的撕裂与社会的骚乱。在愈发撕裂的美利坚联盟国的政坛中，无数的政治斗争此起彼伏。至上党的成员一面维持党在政府中的绝对控制，同时确保着自己的派系不会在党内斗争中落败。效忠于史密斯的民兵们袭击着异见者们的办公室，而隶属于库林格神父的广播电台则日夜不停的在电波中为他们的领袖造势。而现在，这种混乱已经走到了尽头。毫无疑问，朗死后空缺的总统之位已经有了明确的人选。在党内重要领导者们的一致同意与推举下，国家的新任总统已经确定："
 TEX.18.a:0 "史密斯胜券在握"
 TEX.18.b:0 "库林格神父的胜利无可置疑"
 TEX.18.c:0 "厄尔·朗将继承兄长的事业"
 TEX.18.e:0 "阿尔弗雷德·宾厄姆将引导我们"
 TEX.18.f:0 "拉塞尔·朗得到了大多数的支持"
 TEX.19.t:0 "第一步"
 TEX.19.d.right:0 "在休伊·朗总统葬礼结束的同时，对这起可疑的刺杀案的大调查就从政府内部开始了。自然而然地，联邦调查局，一分钟人甚至一小撮忠于史密斯的银衫军都掺和进了调查当中。首先被确认的当然是刺客的身份，这也是心怀鬼胎的各大派系能够达成的唯一共识。菲利普·E·福克斯，一位激进的种族主义者，3k党徒，同时也是3K党大法师的助手。调查人员搜查了这狂徒的住所，发现了福克斯在刺杀休伊前一个月与外界往来的信件。部分信件已经被火烧毁，只留下了部分难以辨认残缺不全的碎片。信中显示，除了与自己的3K党同伙联系以外，福克斯还与一些银衫军的激进派有所勾连。这些暗通款曲的信件中福克斯以高达一万美元的高价从一位匿名的银衫军买到了刺杀事件前后朗总统的路线行程，以及一些难以破译的恼人的密语。尽管这些信件中没有出现具体的信息，调查的探员们还是从包括收信地址，能够接触到信中所提到的具体信息的银衫军群体，以及有关那些暗语的相关推测，最终锁定了泄密者正是来自史密斯交际圈的一名银衫军老兵。\n\n然而，随着调查的深入，更多的涉事者被牵扯进来。有目击者称在刺杀案发生的前几日，福克斯曾多次在达拉斯市中心的一家餐厅二楼出现，而且每次似乎都在等人。在刺杀发生的前几日，在福克斯最后一次出现在餐厅中时，来了一位穿着深灰色西装的人，正坐于他的对面。两人在短暂交流后先后离去，而有好事者生成他们也看到了那位西装男递给了福克斯一些文件，而且在经过相貌比对后，调查组发现了该人正是休伊·朗之弟，与他有些间隙的厄尔的行政班子中的一位事务秘书。此外，一部分证据也显示，福克斯同时也是基督教阵线，即库林格神父在独立于至上党之外成立的一个非正式的政治游说团体的成员，甚至在阵线内部的人脉很广，也有人推测这其中也有着库林格神父的影子。当然，尽管这些证据牵涉到了党内的诸多成员，但最终的调查方向仍然需要如今的至上党内部影响力最大的人，也就是朗葬礼的主持人来决定。"
 TEX.19.d.left:0 "在休伊·朗总统葬礼结束的同时，对这起可疑的刺杀案的大调查就从政府内部开始了。自然而然地，联邦调查局，一分钟人甚至一小撮忠于史密斯的银衫军都掺和进了调查当中。首先被确认的当然是刺客的身份，这也是心怀鬼胎的各大派系能够达成的唯一共识。马里奥·布达，一位激进的无政府主义者，I.W.W成员。调查人员搜查了这狂徒的住所，发现了布达在刺杀休伊前一个月与外界往来的信件。部分信件已经被火烧毁，只留下了部分难以辨认残缺不全的碎片。信中显示，除了与一些同样激进的左派分子联系以外，布达还与一些党内的的左翼激进派有所勾连。这些暗通款曲的信件中布达以高达一万美元的高价从一位匿名的一分钟人买到了刺杀事件前后朗总统的路线行程。除了这些信息，剩下的内容就是一些自娱自乐的左派狂热宣传语。\n\n随着调查的深入，更多的涉事者被牵扯进来。有目击者称在刺杀案发生的前几日，布达曾多次在底特律市中心的一家餐厅二楼出现，而且每次似乎都在等人。在刺杀发生的前几日，在福克斯最后一次出现在餐厅中时，来了一位穿着深灰色西装的人，正坐于他的对面。两人在短暂交流后先后离去，而有好事者生成他们也看到了那位西装男递给了布达一些文件，而且在经过相貌比对后，调查组发现了该人正是休伊·朗之弟，与他有些间隙的厄尔的行政班子中的一位事务秘书。此外，一部分证据也显示，布达同时也是独立联盟，即阿尔弗雷德·宾厄姆在独立于至上党之外成立的一个非正式的政治团体的成员，甚至在阵线内部的人脉很广，因此也有人推测这其中也有着宾厄姆的参与。当然，尽管这些证据牵涉到了党内的诸多成员，但最终的调查方向仍然需要如今的至上党内部影响力最大的人，也就是朗葬礼的主持人来决定。"
 TEX.19.a:0 "毫无疑问，史密斯参与了对休伊的刺杀"
 TEX.19.b:0 "库林格神父，他需要为朗的死负责"
 TEX.19.c:0 "厄尔即是他的兄长的死的幕后推手"
 TEX.19.e:0 "没什么需要怀疑的，这只是一起3K党徒组织的政治暴力袭击"
 TEX.19.f:0 "没什么需要怀疑的，这只是一起无政府主义者组织的政治暴力袭击"
 TEX.19.g:0 "党内的左翼分子策划了这场袭击"
 TEX.20.t:0 "心怀鬼胎"
 TEX.20.d:0 "深夜的华盛顿特区，绝大多数民众早已沉浸在深夜的美梦之中。诚然，受人敬爱的休伊·朗总统被邪恶狂徒所刺杀是一件令人悲痛的事，但也不意味着这起悲剧会深刻的影响到民众的日常生活。然而，在这座城市中的不眠者除了巡夜的警察和酒馆中的醉汉，还有一些焦急不安的密谋者。在政府大楼的办公室中，平时说话风格张扬而狂妄的杰拉尔德·L·K·史密斯此时颓然坐于一张长桌侧，对面则是唐·洛贝克，史密斯忠诚的宣传代理人；詹姆斯·赫德森，一位忠心耿耿的银衫军老兵；哈里·L·哈特，一名宣传家，同时也是一名种族主义分子。几人面前的桌子上摆着几张散落的文件纸与剪下来的报纸报道，上面赫然是卡廷将会主持休伊·朗葬礼的相关报道。\n\n“你知道的，史密斯，”赫德森叼着烟斗，瓮声瓮气的朝着史密斯，“卡廷那个左棍一定会把可怜的朗的死的所有责任都像倒大粪一样扣到我们头上，或者准确的说，八成是你头上。”“他和他的狗腿子们本来就看我们不顺眼。”洛贝克毫无生气的接话，他常年因为风吹日晒而粗糙不已的脸与电灯投射的阴影形成了绝妙的构图。“但我们能做什么？那个混账东西天天叫嚣着要把什么狗屁的极端分子开除出党，我们就这么听着他狗叫听了快两年！可朗对他做了什么吗？而你又对他有所行动吗？”他的声音因气愤而颤抖。“说真的，我真觉得休伊那个王八蛋的死是件好事。至少对我来说。”哈特把自己的脚搭在了桌子上，翘起凳子满不在乎地说。\n\n沉默许久的杰拉尔德·L·K·史密斯终于抬起头，拿着钢笔头敲了敲桌子，向着三人说到：“当然，我们还有一些解决方案。只有斩掉蛇头，我们或者库林格那个神棍才有机会把调查的主导权夺回来。”三个人猛地坐直了身子，等着声音中难以听出情绪变化的史密斯继续开口："
 TEX.20.a:0 "“卡廷在几天后有一趟去往阿尔伯克基的航班。”"
 TEX.20.b:0 "“我们需要的仅仅是一个安装在车上的小玩具。”"
 TEX.21.t:0 "友谊"
 TEX.21.d:0 "杰拉尔德·L·K·史密斯把手中的剪报放回到桌子上，上面以大篇幅报道了党内温和左派的领导者，布朗森·卡廷在一场可怕的空难中失去了自己的生命。据详细调查，卡廷所乘坐的客机因引擎零部件损毁而导致在空中失去控制，直接在亚特兰大城近郊坠毁，而机组成员包括卡廷在内无一生还。显然，这就足以摧毁党内那些并不团结的左人们。如今的至上党内部能够与史密斯相抗衡的除了厄尔，就是库林格神父了。\n\n思考至此，史密斯决定，至少要跟库林格神父联络一下，试探一下这个至上党内部最虔诚的煽动家的态度。如果他识大体，跟与自己合作，那么团结了几乎大半个至上党外加党外右翼势力的史密斯就将毫无疑问的彻底控制如今混乱的至上党。而如果那个神棍不愿意合作，史密斯的老兵们也会有他们自己的方法。\n\n三天后，在史密斯的办公室中，他的副手洛贝克拿着一封电报走了进来，朝着无所事事的史密斯说："
 TEX.21.a:0 "“库林格神父愿意谈谈。”"
 TEX.22.t:0 "玩火自焚者..."
 TEX.22.d:0 "杰拉尔德·L·K·史密斯愤怒的把手中的报道甩到桌子上，暴跳如雷的模样几乎能把整个大楼掀翻。报纸以大篇幅报道了党内温和左派的领导者，布朗森·卡廷在一场汽车炸弹暗杀中丧生，而幕后主使则直接被确认为了与史密斯有关的银衫军成员。史密斯不知道手底下那帮废物究竟是怎么能把这种简单的小事办的一团糟，但他很明白，自己的政治生命即将随着这次弥天大祸而被终结。党内的温和左派甚至于骑墙派都被这场政治谋杀给团结在了一起，而那个探险家的儿子，阿尔弗雷德·宾厄姆正是这帮人的领袖。在党内，宾厄姆几乎可以肯定会接手卡廷的一切责任，并在数天后主持休伊·朗德的葬礼。而现在，史密斯就算是想狗急跳墙放手一搏都是痴人说梦了。宾厄姆与党内的诸多派系达成了共识，紧急调集了一分钟人和周边的国民警卫队进入首都，并将刺杀案后的紧急事态升级为了全国紧急状况，并开始全国戒严。而以史密斯手头的银衫军民兵根本不可能做出什么大动作。毫无疑问的，史密斯在这场权力斗争中成为了第二个出局的弃子。"
 TEX.22.a:0 "自食其果"
 TEX.23.t:0 "合作"
 TEX.23.d:0 "路易斯安那的夏夜总是带着潮湿的闷热，哪怕室内已开足了冷气，也难以驱散那种密不透风的压迫感。房间一角的收音机还开着，尽管音量已调至最低，但仍能隐约听见来自电台的嗡嗡播报。史密斯懒得去听，大多是无用的时事新闻，又或者是那些平庸的号召者在为自己造势以参与政治。“杰拉尔德，”库林格神父的声音如教堂中的晚钟，沉稳却不失警觉，“你我之间，有许多地方是不同的。我认为我们很难达成一致。”\n\n“你说得对，神父。但至少我们还都有着信仰，而不是像卡廷，宾厄姆又或者厄尔那些不信者又或者是煽动家想要毁灭如今的一切。”史密斯不掺杂什么感情的声音从木桌对面传来。沉默短暂地落在他们之间。史密斯拿起水杯，轻轻晃了晃冰块：“朗把你扶到了广播塔上，但现在已经是摇摇欲坠了。党内的很多人都在向着厄尔靠拢，如果我们再犹豫，那么结果现在就已经注定了。”库林格闭上眼片刻..."
 TEX.23.a:0 "“那祝我们合作愉快。”"
 TEX.23.b:0 "“我需要考虑”"
 TEX.24.t:0 "第二步"
 TEX.24.d:0 "路易斯安那州的阴雨总是一连数天，淅淅沥沥的雨点在略有坑洼的道路上聚成一个个水洼，倒映出天空的阴云。在政府大楼中的办公室，厄尔·朗，如今混乱的政治局势中炙手可热的红人，正在一张宽大的桌子前会见着来客。桌上的咖啡杯的表面模糊的映出了来客的模样，阿尔弗雷德·米切尔·宾厄姆，布朗森·卡廷的朋友，而在如今的情况下，说是使者更加恰当。\n\n“厄尔先生，”宾厄姆身前交叉的双手平放在桌面上，显得有些放松，“这是我们的机会，同时也是扳倒党内那些野心家的绝佳机会。而如此良机，我想任何精明的政治家都不会置之不理。”\n\n“但这从来不会是天上掉下来的美事，不是吗？”厄尔·朗放下手中的报纸，头版头条报道了昨天在华盛顿特区发生的多起政治暴力事件。“如果我们能够达成愉快的合作，我想知道你们需要得到什么？内阁职位？还是国会的议席？又或者是州长的任命？”\n\n宾厄姆的食指轻轻敲了两下桌面，微笑道：“当然，但我想这些条件都是可以商量的。但首先，我想先确认我们的友谊与合作的意愿。”"
 TEX.24.a:0 "合作愉快"
 TEX.24.b:0 "谈判破裂"
 TEX.25.t:0 "库林格神父的演讲"
 TEX.25.d:0 "“数以百万计的公民开始提出显而易见的问题：‘为什么农民要被迫不知所措地跟着他的犁走呢？为什么公民——至少90%的人——被囚禁在残酷的匮乏铁栅栏后面，而他们手中没有足够的鞋子、衣服、汽车、冰箱，这些都是他们有权拥有的？’最后，当实业家、银行家和他们保守的政客中最聪明的头脑未能解决本不应出现的大萧条时，我们国家生活的舞台上出现了一个新的人民斗士，休伊·朗！他创造了希望，为美国人民带来了他们应得的真正和平。”\n\n“在现代，没有人像休伊·朗那样受到穷人的赞美，因为他承诺要把属于穷人的财富归还给他们！1937年1月22日！我永远不会忘记那次就职演说，这似乎再次呼应了基督本人在实际上将兑换银钱的人赶出圣殿时所使用的话。我的朋友们，休伊为了这个事业献出了一切，也包括他的生命。但现在，这份未竟的事业正在像棉花一样被收割，像猪一样被宰杀。”\n\n“受压迫的美国人民现在只有一条出路，继续社会公义的事业，继续对那些金融家恶魔们的圣战！在我们面前，没有什么左翼，也并没有什么右翼。只有财富分享与社会公义的道路供我们行走。这些话，我的朋友们，不是我的，而是休伊曾经对我所说的肺腑之言。他的精神，也将与你我，与上帝同在。”"
 TEX.25.a:0 "社会公义的大潮汹汹而来"
 TEX.26.t:0 "四分五裂"
 TEX.26.d:0 "在一系列的政治混乱后，美利坚至上党的格局已经发生了剧烈变化。中间派与休伊·朗的忠诚者们已经陷入了混乱，拉塞尔·朗的威望与资历均无法将这些各怀其志的党徒们团结在一起。而左派则陷入了更加难以挽回的窘境之中。一直以来，选择投靠休伊·朗的温和左派成员都处于不受待见的地位。这些人在至上党党内不受信任，而在至上党之外，他们原本的同僚们则将他们视为叛徒。而如今朗的逝世则在真正意义上为这些可怜的左派人士盖棺定论。这些边缘人所组成的松散政治团体很快四分五裂，其所依托至上党的组织而倡导的政治运动也彻底地被激进右翼分子所打压以至于被公众们遗忘。"
 TEX.26.a:0 "归于沉寂"
 TEX.27.t:0 "拉塞尔·朗公开支持厄尔"
 TEX.27.d:0 "近日，已去世的休伊·朗那年轻的儿子，同时也是党内温和派的代表之一的拉塞尔·B·朗在德克萨斯州的一场至上党政治集会中向公众发表了一场动人心弦的演讲。他在这次长达两小时的演说中深情地回忆了自己的父亲，休伊·朗的政治荣誉与成就，同时号召仍然深陷分裂的至上党团结起来共同保卫美国。同时，令人颇感兴趣的是，在这场演讲中拉塞尔·朗多次向听众们称赞休伊的弟弟，自己的叔叔厄尔·朗的政治生涯，也表达了对厄尔成为至上党领导者的期望与肯定。这被认为是对如今在党内人望颇高的厄尔的公开支持，同时也表达了休伊·朗遗留下的政治遗产毫无疑问的将会被交给厄尔。目前，杰拉尔德·L·K·史密斯与查尔斯·库林格仍未对此发表声明，而公众普遍认为这只是如今混乱的国家政坛的一个缩影。"
 TEX.27.a:0 "家族情谊值千金"
 TEX.28.t:0 "杰拉尔德·L·K·史密斯的演讲"
 TEX.28.d:0 "“诸位，如今我站在这里，向你们讲述美利坚的未来...我并不是一个正义之士，我是一个孤立主义者，同时也是美利坚至上党的缔造者与领导者之一。我同时也是一名煽动者，那些权欲熏心的野心家们如此称呼我...是的！现在我向你们证实，我的确是煽动家，但我是上帝指派的宣传者，传道者，煽动家。”\n\n“我们无能、平淡和懦弱的国会，正在逐步的蚕食圣战以来朗与至上党的忠诚者们为美利坚所作的一切。”\n\n“保持美国作为一个基督教国家的地位，这是我们的呼吁。”“然而，现在我们伟大的国家背后正酝酿着一股运动，如此的邪恶而肮脏...一场高度组织化的运动，他们试图以犹太传统代替基督教传统。这是不可忍受的。”\n\n“所有虔诚的公民们啊，我向你们发出主的呼号，这是一场我们必须面对的第二次圣战！挥动你们的剑，加入到这场十字军中来！现在已经到了美利坚联盟国最危急的时刻了！”"
 TEX.28.a:0 "振聋发聩"
 TEX.29.t:0 "亨利·福特公开支持史密斯"
 TEX.29.d:0 "近日，美利坚历史上最为成功的企业家之一，同时也是如今政府的经济顾问之一的亨利·福特在一次记者采访中公开表示了对杰拉尔德·L·K·史密斯的赞赏，同时他还向媒体透露，福特集团对史密斯的资金赞助已经达到了百万之多。此举被广泛认为是旧民主党势力与极端右翼分子对史密斯一派的公开支持。同时有一部分史密斯的追随者也开始对此有所忧虑，担忧杰拉尔德·史密斯的事业会不会在这些旧民主党人的渗透下转向另一个方向。同为至上党人的厄尔在一次公开演讲中将史密斯称为“至上党的内部叛徒”，并谴责福特对当今政局的干涉举动。"
 TEX.29.a:0 "也许他只是想给自己的企业谋个好去处..."
 TEX.30.t:0 "阿尔弗雷德·M·宾厄姆的演说"
 TEX.30.d:0 "“我曾经是《常识》的编辑，我曾是康涅狄格的参议员，但我从未忘记——我首先是一名美国人，是一个深知共和国意义为何物的人。我们走过了一段苦难而屈辱的道路。昔日掌权者将国家变成了经济精英的提款机，将人民的信任当成了可随意挥霍的资本。休伊打碎了这一切，但他的事业却并未完成。他的离去是美国历史上最为严重的损失，但我们将继承这一切，保卫他的遗产！”\n\n“我们需要的不是回到旧秩序，也不是用另一种暴力取代旧的专制，而是创造一种新的政治经济秩序——真正的大众民主。这是一种把权力交还给社区、工会与选民的制度，一种重新定义自由与责任的制度，一种不再由纽约金融家、底特律厂主或德克萨斯油王指挥我们未来的制度。”\n\n“我们要建立的不只是一个改革过的政府，而是一个新合众国——一个在会议、镇民代表、学者与教员中诞生的政府。我们要一场不靠刺刀维持秩序、不靠广播灌输思想的革命,一场真正有别于工团匪徒们的革命！一场拯救美国的革命！”"
 TEX.30.a:0 "吹响号角"
 TEX.31.t:0 "致罗斯·朗"
 TEX.31.d:0 "我可能是成干上万个向您表示同情的人之一——为您丈夫的悲剧和早逝深表同情。如果一个陌生人的话能给您些许安慰，让我向你保证，朗先生的去世是整个国家的巨大损失。\n\n朗的离去，就像一位亲人，或一位为所有人的权利进行了不懈斗争的朋友的离去。\n\n虽然我们这一带的人都没有见过朗先生本人，但我们在报纸与电视上见过他，也曾多次从广播中听到他的声音，我们听过不少他的演讲。他是我们所熟悉的人物，我们关注并支持他，上一次大选我们都选的是他。\n\n亲爱的朗夫人，我们与您一并哀悼。再也不会有能代替他的人，永远不可能有另一位像朗先生这样独特的领导人，他那无惧一切的个性，一颗不安分的野心，一种无私的冲动，驱使他为美国人民的正义而战斗。他的敌人是那些曾掌握着国家命运的邪恶财阀，在濒死之时给了朗先生卑劣一击的也正是他们。\n\n整个国家与您一起哀悼，我们永远不会忘记休伊·皮尔斯·朗。\n\n\n\n怀着最深切的同情，致最诚挚的问候\n玛丽伍尔德里奇女士\n贝尔丁，密歇根州"
 TEX.31.a:0 "感人至深"
 TEX.33.t:0 "净化现代索多玛"
 TEX.33.d:0 "在过去的美国历史中，纽约，这座城市充斥着罪恶的魔鬼与肮脏的罪行。无论是贪婪，抑或是酗酒，通奸，又或者是残杀，无数的肮脏之罪留存在纽约城之中。毫无疑问，在如今的虔诚而忠实的国度之中，如此的肮脏之地实属罕见。尽管城市之中仍然有着为数不少的虔信之人，但比起这座索多玛的堕落程度仍是沧海一粟。为了予以自己的反对者与不信者以警示与震慑，史密斯总统决定将纽约彻底的从地上除去，进而在其废墟之上重铸新的虔诚的新城。\n\n凌晨时分，史密斯直属的银衫军就彻底地将纽约城封锁起来，确保所有罪人与不信者都仍然困于城中。随后的24小时中，空中部队的大规模轰炸彻底的淹没了这座城市。自由女神像被首先摧毁，断成两截的雕像身子与火炬一并落入了海湾之中。在首批清理完成后，全副武装的银衫军士兵们开进城内，逐步彻底的根除生还者与抵抗者。尽管有一部份居民逃离了这场灾难，但在一周后，这座曾经的伟大灯塔之城已经被抹去了。\n\n毫无疑问，如此的疯狂之举在国际上引起了巨大的批评与攻击，同时在国内，全美多座城市爆发了抗议游行，而暴力事件更是层出不穷。然而史密斯总统仍旧将此视为一次伟大的胜利，并要求国会立刻批准在纽约城废墟上建立新城市的·提案。"
 TEX.33.a:0 "我们将在此建立新的丰碑！"
 TEX.34.t:0 "与其他的左翼派系联络"
 TEX.34.d:0 "总统阿尔弗雷德·宾厄姆深知，孤立的激进改革注定难以持久。更何况，如今的政坛很难称得上安定。即使是最完善的计划，也无法在四分五裂的孤岛政治环境中单独推行。宾厄姆本人虽是休伊·朗政治遗产的延续者之一，但他代表的进步主义路线比朗本人更具学术性与制度性，也更需要其他左翼派系的支持以获得议会与社会的广泛基础。为了能够快速团结起足够的政治力量，联邦政联必须选择与其余的左翼组织达成一个泛左翼的团结阵线以确保政治上的强势。而如今仍然在政坛上活动的左翼派系堪称寥寥，包括前太平洋国的进步主义者亨利·华莱士，如今选择依附于国家进步党的一个分支派系。此外太平洋国的联邦党的领导者厄普顿·辛克莱仍然在呼吁并为了他的“终结贫困”运动而战。而宾厄姆总统的老友约翰·杜威与支持他的贝拉米主义者们始终与宾厄姆保持着良好的关系与私下往来。至于联邦政联选择联络哪派人马，则都要看总统本人的抉择。"
 TEX.34.a:0 "向辛克莱发出邀请"
 TEX.34.b:0 "与进步主义者和华莱士合作"
 TEX.34.c:0 "支持贝拉米主义者"
 TEX.35.t:0 "“洁净的”至上党"
 TEX.35.d:0 "在厄尔·朗赢得了至上党党内的政治斗争后，他对公众与同僚们表现出来的形象完全继承了过去休伊的政治强人形象。无论是在路易斯安那的政党集会上的公众演说，亦或者是在国会中雄辩的身影，毫无疑问厄尔全面继承了朗的公众形象与政治遗产。因此，在过去的政治风波平息后，国家观察家与媒体们普遍认为一场政治清洗将很快在至上党党内爆发。不出意外的，几位党内元老很快公开宣布因年龄与身体原因“自愿辞去一切政府职务”，并在公开场合直接或间接地表达了对厄尔的支持。同时，一分钟人的几位民兵指挥有些选择了退休，而其中一位在过去公开支持杰拉尔德·L·K·史密斯的老兵指挥官则因一起严重的交通事故彻底瘫痪，其位置则很快被朗家族的成员补上。\n\n查尔斯·库林格神父作为至上党政府的宣传喉舌，在一次公开演说后选择了逐渐从公众事务中隐退，这位“休伊的宣传部长”的政治影响力也大不如前。至于党内的中间派与那些见风使舵的墙头草们，则毫无疑问的坚定支持厄尔·朗的一切新决策。毫无疑问，朗生前所佩戴的皇冠，已经稳稳当当的戴在了厄尔的头上。"
 TEX.35.a:0 "休伊的好弟弟，好学生"
 TEX.36.t:0 "为亨利·华莱士与进步主义运动正名"
 TEX.36.d:0 "亨利·华莱士是一名久负盛名的进步主义者，同时也对如今的阿尔弗雷德·宾厄姆总统的政治蓝图提供过相应的参考。无论是在曾经的西奥多时代的进步党，抑或是在1936年总统大选中与休伊共同逐鹿政坛的进步党，都为如今宾厄姆的激进进步主义运动提供了宝贵的经验与思考。现在，华莱士所倡导的政治蓝图也将会被宾厄姆与他的政治派系接纳。尽管如此，亨利·华莱士与太平洋进步党仍然在如今的联盟国饱受争议。诚然，无人会对泰迪的公糜遗产与如此一位受人尊敬的进步主义者心怀怨愤，但为太平洋国而战的过去仍然为他们打上了叛国贼的烙印。但尽管如此，总统仍相信，就算他在历史上站在了错误的一边，华莱士仍是个好人，有良善的想法，并真诚地致力于改造美国。然而对于广大的民众们来说，在过去的宣传中作为分裂国家的叛徒，将这些人纳入政府之中显然是不会被公众舆论所接受的。但事实上，如果宾厄姆总统与他的内阁成员们都能够下定决心与亨利·华莱士合作，所带来的好处与优势也能够带来足够的回报。"
 TEX.36.a:0 "华莱士先生，你来负责内阁事务"
 TEX.36.b:0 "让他负责西海岸的事务吧"
 TEX.36.c:0 "看起来这些人不是很值得信任..."
 TEX.37.t:0 "受人爱戴的厄尔叔叔"
 TEX.37.d:0 "在民众心中，厄尔从来不是一个难以接近的政治家。他在首都开着破旧的凯迪拉克出行，经常在街角摊贩前与民众交谈，为每一位农民和退伍老兵递上一份纸面承诺。孩子们喊他“厄尔叔叔”，而他也乐得回应，甚至在一所小学的演讲中自称“全美孩子的代理监护人”。而在国会里，他也不再只是那个喋喋不休的后座议员。在一场关于养老金制度的辩论中，他连续发言超过七小时，最终以一纸议案赢得了广泛支持。对许多普通人而言，他不是总统，而是他们的代表、他们的舅舅、他们熟识的邻居，一个永远穿着皱巴巴西装、却永远站在他们身边的人。\n\n尽管党内仍有一些人对他的直言不讳感到不安，甚至不满他用轻松玩笑包裹政策主张的风格，但所有人都必须承认：他是朗主义最真挚的传人，也是如今这场百废待兴的复兴工程中，唯一一个能让“至上党”三个字重新获得信任的人。当然，任何对厄尔与至上党有所威胁与阴谋的反对者，同样不会得到任何应有的权利与爱护。毕竟休伊在生前为了保卫人人皆国王的事业献出生命，厄尔也自然不会容忍任何对此不利的威胁。"
 TEX.37.a:0 "深得民心的政治王朝"
 TEX.38.t:0 "与使徒的对话"
 TEX.38.d:0 "在新奥尔良的教堂中，库林格神父点燃了一盏油灯。他总是坚持使用那盏老式油灯，而不是让人打开头顶的电灯。灯火的影子在圣坛上投下一道道斑驳的线条，映照在这位如今的国家最高领导者脸上。阿姆斯特朗来到教堂时没有带随从，也并未携带任何物品。在这场会面中，两人相谈数个小时，然而外界并不知道在这中间他们彼此达成了多少协议，他们只看到在第二天的电视直播中，库林格神父与阿姆斯特朗共同出现在公众视野中，并向大众宣布了彼此之间的友谊。在外人看来，这是一次不可思议的合作：一个天主教的民粹派神职人员，与一个英式以色列主义者携手同行。至上党内有人对此愤怒，有人则满心狂热。塔拉胡马的数千民兵在教堂内聆听布道后高呼“神之律法”，而新泽西的财富分享电台则质疑库林格是否已被“异端洗脑”。"
 TEX.38.a:0 "令人惊讶的组合"
 TEX.38.b:0 "阿姆斯特朗在政府中赢得了更大的影响力"
 TEX.39.t:0 "巴尔的摩的战士"
 TEX.39.d:0 "巴尔的摩的风仍带着港口盐水的味道，但这座城市如今的模样与几年前已判若两人。曾经燃烧的街区早已重建，战时弹痕被石灰与崭新的砖墙覆盖，但它的名字仍让无数人想起那个夜晚——志愿军乘破船沿河而上，带着火与信仰踏入这片焦土。那是一次被称为“十字军”的战斗，却并非来自梵蒂冈的命令，而是来自信仰本身的召唤。\n\n菲利普·卡罗尔。他既是古老卡罗尔家族的后代，也是那个血与火的夜晚中带头冲锋的男子。内战结束后，神圣美利坚联盟与卡罗尔投身于政治漩涡，并期望能赢得选举走上政坛。尽管选举未能举行，神圣美利坚联盟也未能在政坛上获得主导地位，但卡罗尔始终坚持着他的使命：用信仰的光芒照亮国家的重建。而查尔斯·库林格神父，则比谁都更懂这一点。他深知这位野心勃勃而又虔诚至极的军官始终渴望国家的最高权柄，但他所带领的政治势力与准军事组织在如今的乱局中却是极为难得的助力。\n\n在随后的公开场合中，菲利普·卡罗尔这位前国家英雄成为了新政府中最为炙手可热的政治红人。毫无疑问的，神圣美利坚联盟的成员也开始走入政府之中。这次合作究竟会把国家引导向何方，也许哪怕神父本人也无从知晓。"
 TEX.39.a:0 "愿我们在信仰中找到力量，在公义中找到国家的再生"
 TEX.39.b:0 "卡罗尔已成为了神父最为可靠的左膀右臂"
 TEX.40.t:0 "史密斯的民兵引发暴力事件"
 TEX.40.d:0 "在俄亥俄州的一个小镇上，原本应是一场例行的集会，却因突如其来的暴力升级成为全国关注的焦点。据当地报纸报道，这场由杰拉尔德·L·K·史密斯领导的政治团体组织——基督教民族十字军——主办的爱国集会，在游行队伍抵达镇政厅时，遭遇了一小队抗议者的口头挑衅，随后演变为一次全面的肢体冲突。一名维持秩序的银衫军民兵在抵抗抗议者冲击时打倒了一名年轻的抗议者，在随后混乱开始并蔓延至整个街区。最终有数十人受伤，其中包括数名非民兵身份的围观者与两名警官。\n\n面对全国性的舆论反弹，史密斯本人在电台演讲中将此事描述为“一次受到挑衅的自卫行为”，并谴责“左翼报纸”对事件的报道为“蓄意歪曲”。"
 TEX.40.a:0 "早就该出重拳了"
 TEX.40.b:0 "别再惹事了"
 TEX.41.t:0 "拉塞尔突袭"
 TEX.41.d:0 "在一个寒冷阴郁的清晨，数十辆未标识的黑色轿车在密苏里、路易斯安那与马里兰州的主要街道上悄然驶过，停在教堂、印刷所、广播站与几处私人住所门前。每辆车内都走出了数名一分钟人，与配有授权搜查令的政府官员。而他们的目标正是杰拉尔德·L·K·史密斯与查尔斯·库林格神父的追随者，以及两人所属组织的档案、金流与通讯记录。\n\n清查行动中，数十人被拘留，部分嫌疑人被指控持有非法武器或散布敌对言论。史密斯的几名亲信也被短暂带往审问中心，虽然大多数在数小时后被释放，但已有三处教堂与两家出版机构被勒令暂停运营，等待进一步审查。库林格神父则在广播中抨击此次行动为“联邦对信仰的亵渎”，并声称将向公众“揭露朗家族真正的面目”。而史密斯方面则更为激烈地谴责这是“对休伊·朗遗产的彻底践踏”。\n\n这场突袭引发了国内舆论的剧烈争论。支持者认为朗政府终于对日益暴力化的政治边缘势力出手，而批评者则担心此举将打破至上党内部原有的微妙平衡。一些州议员公开警告，过度镇压可能会引发更激烈的对抗。总的来说，这向全美国与世界透露出了一个新的政治信号：政治暴力与极端化的浪潮即将中止。"
 TEX.41.a:0 "抓得好"
 TEX.42.t:0 "未来之路"
 TEX.42.d:0 "朗主义带领我们赢得了战争，团结了人民，赎回了堕落的美利坚。但如今，休伊·朗已经长眠于地，而杰拉尔德·L·K·史密斯站在这片被拯救的土地上，面对一个更为深刻的问题：一个由上帝庇佑的富有道德的新国家，应当走向何方？美利坚联盟国如今的政府体制，是在朗总统设想之上缝合而成的折中政体——它拥有民粹主义的经济制度、基督教的伦理纲领，以及高度集中的个人权威。史密斯本人在演讲中也不止一次强调国家的“道德使命”与“神圣使命”，但为了更加稳妥的统治，史密斯总统仍需一个万全的方案。忠实的朗派人士坚决反对任何形式的偏离，而在以天主教信徒为主的整合主义者的眼中，只有实行更为系统的社会教义改革——建立有组织的行业议会、合作社经济与更严密的信仰教导体系才能强大新国家。但实际上，史密斯总统更倾向于原教旨主义的理论，以彻底的宗教道德维持国家系统运转。还有少部分“民主人士”呼吁保留美利坚的民主传统，哪怕这仅仅是一层遮羞布。"
 TEX.42.a:0 "朗主义虽然已经陈旧，但还是要保留"
 TEX.42.b:0 "原教旨主义赋予国家动力"
 TEX.42.c:0 "整合主义的理论具有可实践性"
 TEX.42.e:0 "我们还得是一个民主国家"


