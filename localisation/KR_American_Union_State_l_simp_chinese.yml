TEX_totalist_party:0 "社会党"
 TEX_totalist_party_long:0 "美利坚社会党(Socialist Party of America)\n§g我国境内的社会党分会忠于联合工团，因此，我们同社会党的关系完全取决于与芝加哥政府的外交态势。虽说如此，但我们可以通过政治党团、宣传手段和民粹主义来吸收社会党的潜在选民，让社会党绝无当选的机会。§!"
 TEX_syndicalist_party:0 "社会党"
 TEX_syndicalist_party_long:0 "美利坚社会党(Socialist Party of America)\n§g我国境内的社会党分会忠于联合工团，因此，我们同社会党的关系完全取决于与芝加哥政府的外交态势。虽说如此，但我们可以通过政治党团、宣传手段和民粹主义来吸收社会党的潜在选民，让社会党绝无当选的机会。§!"
 TEX_radical_socialist_party:0 "联邦政联"
 TEX_radical_socialist_party_long:0 "美利坚联邦政治联盟(American Commonwealth Political Federation)\n§g在美国解体、进步势力各自为战的当下，新生的农民劳工党政治联盟于联盟国境内的大多数成员都转投了国家进步党，整个联盟直接失去了主心骨。阿尔弗雷德·米切尔·宾厄姆对于拉福莱特的温和态势感到失望，于是便抓住机会，整合起了中西部的社会主义势力残党，把农民劳工党政治联合会改组为了美利坚联邦政治联合会。联邦政联的目标，是要激进主义光耀美利坚大地，让朗派、贝拉米派、国家进步党等同志携起手来，共同挽大厦于将倾。§!"
 TEX_social_democrat_party:0 "进步党"
 TEX_social_democrat_party_long:0 "进步党(Progressive Party)\n§g大多数前进步派的共和党人最后都加入了战前就在运作的进步党。由于该党缺少一个可供依赖的国家性机构，国家进步党正在逐渐吸收他们，将其转变成自己组织的一个分支。§!"
 TEX_social_liberal_party:0 "国家进步党"
 TEX_social_liberal_party_long:0 "国家进步党(National Progressive Party)\n§g共和党瓦解后的一部分组成了国家进步党，该党由扎根威斯康星州的拉福莱特家族创立，也是为数不多的朗政权的主要挑战者之一，该党声称自己比民粹主义者更进步。§!"
 TEX_market_liberal_party:0 "民主党"
 TEX_market_liberal_party_long:0 "民主党(Democratic Party)\n§g如果可能的话，联盟国的自由派民主党人大概希望立即与美国的亲民主派系重聚，他们只同意与联盟国合作阻止更激进的派系。他们说，相对于自由派民主党在其他美利坚国家的支派，他们赋予农民的口惠确实更多。§!"
 TEX_social_conservative_party:0 "民主党"
 TEX_social_conservative_party_long:0 "民主党(Democratic Party)\n§g在联盟国合法运作的民主党经常不得不对民粹主义言论做出让步，但实际上，出于对旧民主党、非本土大企业和社会主义者的恐惧，该党与联盟国合作的程度很深。由于他们倾向种族隔离，所以如果我们对种族进步人士松口，他们对我们的支持可能会减弱。§!"
 TEX_texan_democrat_party:0 "民主党"
 TEX_texan_democrat_party_long:0 "民主党(Democratic Party)\n§g在奥丹尼尔老爹的领导下，民主党现在已经恢复了活力，准备从内战和经济萧条的废墟中重建国家。德克萨斯成为了如今美国的重镇，它的文化和价值观必将对未来的美国文化产生深远的影响，就像近年来火爆的“乡巴佬男孩”乐队一样。虽然奥丹尼尔已经脱离乐队工作，但似乎每个美国人都听过“老爹，把饼干递给我”这句歌词，这正是他个人魅力和受欢迎程度的证明。依靠如此之多的支持，奥丹尼尔将把美国带向他的愿景。§!"
 TEX_authoritarian_democrat_party:0 "美利坚至上党"
 TEX_authoritarian_democrat_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党是一个美国民粹主义者的大混合体，它的成员普遍奉行劳工主义、爱国主义，并认为左翼社会主义是由不爱国者或极权主义者组成。他们依靠政治机器、分享财富计划、相对的文化保守主义、民粹主义信息传播、党员民兵，以及最重要的，以路易斯安那州州长，大煽动家休伊·朗为基础的个人主义，与其他进步派系对抗。因此，他们鼓吹建立一个由激进主义、民粹主义和实用主义组成的奇异混合体制，以建立一个以美国人身份认知为中心的亲劳工、亲农民的资本主义国家。§!"
 TEX_paternal_autocrat_party:0 "彭德格斯特政治机器"
 TEX_paternal_autocrat_party_long:0 "密苏里民主党(Missouri Democratic Party)\n§g密苏里民主党是由汤姆·彭德格斯特领导的一个民主党派别。彭德格斯特以铁腕统治堪萨斯城，对当权者来说，他要么是重要的盟友，要么就是危险的敌人。无论对我们来说他是哪一种，我们都没法轻描淡写地绕过他的存在。§!"
 TEX_national_populist_party:0 "白人联盟"
 TEX_national_populist_party_long:0 "白人联盟(White Leagues)\n§g联盟国内的各种白人联盟都是被切断了与全国民主党白人联盟总部的联系的无组织准军事团体。虽然部分成员在战争期间并未公然选边站，但绝大多数成员对宪政国表示同情。一些联盟国公民认为，我们可以和他们交涉，呼吁他们停止积极反对我们，但另一些人只想看到他们通通完蛋。§!"
 TEX_national_populist_catholic_party:0 "神圣美利坚联盟"
 TEX_national_populist_catholic_party_long:0 "神圣美利坚联盟(The Holy American League)\n§g最初由教宗陛下派遣的，在内战中帮助联盟国的教宗民兵组织，在菲利普·卡罗尔的领导下发生了巨大的变化。战后以此为基础创设的神圣美利坚联盟，从为穷人盖房子，到训练天主教徒自我防卫的技术，几乎无事不为。随着新火药阴谋大获成功，执政任务也进了它的事务清单。自上台以来，神圣美利坚联盟已开始在美国各州推行整合主义。联盟是否能够成功地将天主教政治带给这个世界上最偏向新教的国家之一，这是一个只有上帝或时间才能告诉我们答案的问题。§!"
 TEX_liberal_AFP_paternal_autocrat_party:0 "美利坚至上党"
 TEX_liberal_AFP_paternal_autocrat_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党中的激进派认为，由于饱受大公司和银行的影响，传统的投票对美国人民来说没有意义，他们认为由民粹主义为基础的总统专政才能更好地代表美国人民的意愿。§!"
 TEX_progressive_AFP_social_democrat_party:0 "美利坚至上党"
 TEX_progressive_AFP_social_democrat_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党已经制定了它的民粹主义议程，在这个过程中，它明确了该党的未来是进步民粹主义，旨在捍卫甚至寻求实现更进一步的福利进步主义，亲劳工政策以及以强有力的公民民族主义来取代种族分歧。§!"
 TEX_liberal_AFP_social_liberal_party:0 "美利坚至上党"
 TEX_liberal_AFP_social_liberal_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党已经制定了它的民粹主义议程，在这个过程中，它明确了该党的未来是自由民粹主义，旨在捍卫甚至寻求实现更进一步的福利进步主义，亲劳工政策以及以强有力的公民民族主义来取代种族分歧。§!"
 TEX_liberal_AFP_social_conservative_party:0 "美利坚至上党"
 TEX_liberal_AFP_social_conservative_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党已经制定了它的民粹主义议程，在这个过程中，它明确了该党的未来是保守民粹主义，旨在捍卫福利进步主义，亲劳工政策以及种族和解。§!"
 TEX_christian_party:0 "基督教党"
 TEX_christian_party_long:0 "基督教党(Christian Party)\n§g基督教党的成员多为在爱国主义、普遍就业和最低收入制度等民粹政策上志同道合的保守民粹主义者和前民主党人。党旗下有着自己的军事部门，奉行严厉的宪政主义、反社会主义、文化至上主义理论，以及佩利的密教思想。从上可以看出，基督教党内部极其分裂，而党内激进派又是毫不遮掩的种族威权主义者，这一切都让党的形势雪上加霜，真不知道佩利要怎么使唤这样一个党。§!"
 TEX_national_populist_deadphill_catholic_party:0 "神圣美利坚联盟 - 强硬派"
 TEX_national_populist_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 强硬派(Holy American League-Hardliner Faction)\n§g对他们的反对者来说，强硬派只是群偏执的审问者，饥渴地想要看到鲜血流出。但强硬派自认为是上帝和圣母的容器，一切所作所为只是为了履行职责，保护帝国免受罪恶的异端之害。摄政王去世后，他们开始寻求巩固权力并驱逐敌对派系已经是一个公开的秘密。对强硬派来说，这是为了避免帝国再次跌入共济会自由主义的腐朽深渊，现在的帝国已经离基督太远，迈入危险的世俗领域。强硬派背负着重申帝国是教会的工具的使命，要让所有人民的灵魂从炽热的地狱之火中获得救赎，即使这意味着要夺去一些生命。事实上，他们的领袖伦纳德·费尼神父是一位雄心勃勃的虔诚信徒，只有时间会告诉我们，强硬派为了拯救帝国愿意付出多大的代价。§!"
 TEX_paternal_autocrat_deadphill_catholic_party:0 "神圣美利坚联盟 - 新封建派"
 TEX_paternal_autocrat_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 新封建派(Holy American League-Neo-Feudalist Faction)\n§g新封建主义派系似乎是一夜之间崛起的。新封建主义派的一切都笼罩在阴影中，只知道它处于哥伦布骑士团至高骑士马丁·卡莫迪的指挥下，而众所周知，哥伦布骑士团对他们的至高骑士极其忠诚。卡莫迪与帝国内的许多渠道与团体建立了联系，在他从领导秘密警察的阴影之中浮现而出的少数几次常和中，他表达了将封建主义带到美国的愿景。很多人都认为这只是个还活在过去的愚者的妄想，但有了哥伦布骑士团的支持，卡莫迪的愿景是不是笑料还很难说。联盟的其他派系必须保持警惕，以免他们成为骑士们重振封建主义的征程中下一步行动的目标。§!"
 TEX_authoritarian_democrat_deadphill_catholic_party:0 "神圣美利坚联盟 - 民粹派"
 TEX_authoritarian_democrat_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 民粹派(Holy American League-Populist Faction)\n§g民粹派也许是民众呼声最高的派系。在查尔斯·库格林神父的领导下，民粹主义者尽其所能让人们听到他们响亮的声音。数以百万计的人民听着库格林的布道，他说，为了帝国的生存，必须首先恢复民粹主义政策。民粹派的呼吁非常流行，因为帝国内许多公民都在带着喜爱的心情回顾“人人皆为王”这样的短语，库格林的话激起了他们的怀旧之情。民粹主义者还希望缩减宗教裁判所的权力，库格林和其他许多民粹派认为，国内清洗已经过度。由于他们的目标既有“神圣民粹主义”，又会削减令人恐惧的宗教裁判所，毫无疑问，民粹主义者非常受欢迎，他们是一股不可忽视的力量。§!"
 TEX_social_conservative_deadphill_catholic_party:0 "神圣美利坚联盟 - 忠诚派"
 TEX_social_conservative_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 忠诚派(Holy American League-Loyalist Faction)\n§g忠诚派，以对摄政王忠心耿耿的主教富尔顿·申为首，不仅要维护摄政王卡罗尔的事业，还要继续他的神圣使命。申，这位摄政王的“挚爱门徒”决心尽可能实现卡罗尔的愿景。不过，该派系也打算缓和帝国内部的严峻状况。申声称这符合摄政王的意愿，因为他临终前指名申成为他的继承人并改革帝国。当然，其他派系，特别是强硬派，对此提出了严重质疑，指出只有申听到了摄政王的遗言，因此这缺乏任何证据。不管怎样，忠诚派继续前进，继续已故的卡罗尔所开始的光荣事业。§!"
 TEX_market_liberal_deadphill_catholic_party:0 "神圣美利坚联盟 - 天主教资本派"
 TEX_market_liberal_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 天主教资本派(Holy American League-Christian Capitalist Faction)\n§g联盟的右翼改革派正逐渐成为帝国政圈的主要竞争者。在前纽约州州长阿尔·史密斯的旗下，右翼改革派联合起来，推动复兴自由市场资本主义，又或者称为“天主教资本主义”。就像它的左翼劲敌一样，史密斯的右翼改革派也在推动帝国的民主化，但其最终目标更为温和，只打算将联邦制模式带回美国。史密斯的目标吸引了许多温和派和保守派人士，他们希望在不放弃天主教价值观的情况下，回归一个更加自由和放任的体系。该派系的支持者可能是守旧派，但他们同样决心为帝国带来自由和繁荣的新时代§!"
 TEX_radical_socialist_deadphill_catholic_party:0 "神圣美利坚联盟 - 天主教工人派"
 TEX_radical_socialist_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 天主教工人派(Holy American League-Catholic Worker Faction)\n§g摄政王去世后，左翼改革派（又称天主教工人派）的存在感越发突出。在多萝西·戴的领导下，左翼改革派推动国家全面接受分配经济、性别平等、民主化以及最具争议的帝国分权化。同样有争议的是，该派系没有否认其对无政府主义者和工团主义者的同情。尽管受到了许多方面的指责，但不可否认的是，天主教工人派在帝国的工人阶级和女性人口中获得了巨大的声望，这无疑让其成为联盟中的一支强大势力。§!"
 TEX_authoritarian_democrat_deadphill_joe_party:0 "神圣美利坚联盟 - 国民骑士派"
 TEX_authoritarian_democrat_deadphill_joe_party_long:0 "神圣美利坚联盟 - 国民骑士派(Holy American League-National Cavalier Faction)\n§g在圣玛丽城陷入犹豫不决的僵局之后，约瑟夫·肯尼迪领导了一场军事政变，夺取了帝国政权。现在肯尼迪和他的追随者们自称为“国民骑士”，他们架空了神圣美利坚联盟，把它转变为只负责文书的唯唯诺诺的橡皮图章，以保留政府合法性。事实上，帝国已成为名不副实的军政府。国民骑士现在说了算，他们毫不犹豫地粉碎“圣母夫人的敌人”——也就是那些对军政府构成威胁的人。与此同时，肯尼迪承诺恢复摄政王去世前的稳定和繁荣，尽管军政府把军队放在首位的政策让很多人怀疑肯尼迪是否会顾虑自己的部下和权力以外的东西。即使如此，人民仍然献上忠诚，坚信上帝会指引肯尼迪。§!"
 TEX_national_populist_deadphill_regent_party:0 "神圣美利坚联盟 - 救国派"
 TEX_national_populist_deadphill_regent_party_long:0 "神圣美利坚联盟 - 救国派(Holy American League-National Salvation Faction)\n§g在圣玛丽城陷入犹豫不决的僵局之后，各方派系达成了妥协。没有哪个派系独自统治美国，相反，每个派系都会统治……部分美国。各派系的教义都有部分被纳入新的“救国法令”，其中概述了帝国将实行的新政策。圣玛丽城会议将继续作为一个永久性的国家管理机构，以罗马的大公会议模式为参照。官方上，这个会议被称为“瓜达卢佩会议”，但救国法令的出台导致许多人将其称为“救国派”。在神圣三位一体的指引下，摄政会议将把帝国带入神圣的未来§!"
 TEX_totalist_deadphill_party:0 "革命朝圣会"
 TEX_totalist_deadphill_party_long:0 "美利坚革命朝圣会(The Revolutionary Pilgrims of America)\n§g美利坚革命朝圣会由帝国各地最大的反戴团体合并而成，其存在本身就是个矛盾的集合体：它既支持社会主义政策，又反对国际主义和全球化，既发端于天主教的圣米迦勒朝圣会及路易·埃旺的魁北克社会信用运动，又拥护威廉·达德利·佩利及其银色军团，乃至迪克西党人、旧民主党的某些做法。革命朝圣会之所以能走到一块，无非在于同一个目标：彻底推翻摄政王戴构建起的体制，打倒这位“国际金融犹太人”的傀儡，以联系起广大人民的西方传承来建立一个“社会公正”的人民“君主国”。此外，令外部观察家们最始料未及的一点，或许是“白色贝雷帽”实际上深受皮埃尔·布热德的民粹主义理论的影响。§!"
 TEX_radical_AFP_party:0 "美利坚至上党"
 TEX_radical_AFP_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党中的激进派认为，由于饱受大公司和银行的影响，传统的投票对美国人民来说没有意义，他们认为由民粹主义为基础的总统专政才能更好地代表美国人民的意愿。§!"
 TEX_pendergast_authoritarian_democrat_party:0 "彭德格斯特-杜鲁门政治机器"
 TEX_pendergast_authoritarian_democrat_party_long:0 "密苏里民主党(Missouri Democratic Party)\n§g由于哈里·杜鲁门的影响，密苏里民主党已经实现了自由化。所谓的“彭德格斯特机器”虽然仍然深深植根于汤姆老大运转的系统中，但堪萨斯城和整个美国即将开始一场重要的变革。§!"
 TEX_social_liberal_deadphill_catholic_party:0 "神圣美利坚联盟 - 天主教自由派"
 TEX_social_liberal_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 天主教自由派(Holy American League-Christian Liberalist Faction)\n§g天主教自由主义派在右翼改革派中又是最为左倾之派别，因此常常受广泛改革派联盟的影响而左右为难。自由主义派支持阿尔·史密斯的联邦制以及资本主义思想，但他们也同时支持多萝西·戴较为温和的那部分理念。天主教自由主义派缺乏代表人物，大多数时候只是阿尔·史密斯支持者中较为左倾人士用以发声的工具罢了。除非阿尔·史密斯能执掌大权，并且选择走进步的执政道路，不然这群自由派基本上只能沦为边缘人了。§!"
 TEX_social_democrat_deadphill_catholic_party:0 "神圣美利坚联盟 - 温和改革派"
 TEX_social_democrat_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 温和改革派(Holy American League-Moderate Reformists Faction)\n§g温和改革派是多萝西·戴的激进天主教无政府主义和阿尔·史密斯的天主教资本主义间的一种调和派别，其名义上受伯纳德·希尔所领导，试图建立一个真正平等之社会。虽然对于其成员而言，“平等社会”这个概念所代表的意义各不相同，但总的来说，其和多萝西·戴的天主教帝国愿景极为相似，不同点在于少了多萝西的无政府主义思想。虽然身居中间派，但这位芝加哥辅理主教是一名坚定的劳工支持者，在他的推动下，温和改革派逐渐向多萝西·戴靠近，不过要是多萝西的无政府主义立场过于凸显的话，那么这位主教将转头支持阿尔·史密斯。综上所述，要是改革派胜出的话，希尔成为卡罗尔的接班人也很有可能。§!"
 TEX_syndicalist_deadphill_catholic_party:0 "神圣美利坚联盟- 无政府工团派"
 TEX_syndicalist_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 无政府工团派(Holy American League-Anarcho-Syndicalist Faction)\n§g虽然大多数改革派以及联盟的其他派别都鄙视并坚决反对工团主义，将其称为魔鬼的把戏，但也并非所有人都这样认为。在多萝西·戴派系崛起，以及她的无政府主义倾向的极大鼓舞下，这些人数在联盟内部算得上远远落后的无政府工团主义者，最终组成了一个有一定凝聚力的派系。由于规模问题，以及缺少一个领头人物（戴本人对这个派系的出现未置一词）。除非戴能继承大统，否则这些美国工团主义运动的最后残余恐怕将一辈子待在角落之中。§!"
 TEX_totalist_deadphill_catholic_party:0 "神圣美利坚联盟 - 天主教共产派"
 TEX_totalist_deadphill_catholic_party_long:0 "神圣美利坚联盟 - 天主教共产派(Holy American League-Christian Communist Faction)\n§g自摄政王去世以来，神美联盟中出现的最为激进和非正统的派别，自称为“天主教共产主义者”，居于改革派政治光谱的最左端。该派别信奉由白劳德主义、天主教正统信仰和少部分“美国传统价值观”组成的混合思想，试图利用摄政王拥有的专制权力来实现他们心目中的完美社会。由于位处边缘立场，他们选择与戴的派系合作，或许是希望能加入政治运动之中。无论如何，他们选择与戴并肩作战，希望给这个天主教帝国带来些许自由。§!"
 TEX_paternal_autocrat_party_tom_dead:0 "密苏里民主党"
 TEX_paternal_autocrat_party_tom_dead_long:0 "密苏里民主党(Missouri Democratic Party)\n§g现如今，这些腐败的民主党徒的首脑，他们的汤姆老大已经伏法。但这些曾经彭德格斯特的鹰犬中的死忠派仍然团结在彭德格斯特的参议员——哈里·杜鲁门身边，作为一个衰弱的民主党组织活动。然而在如今的至上党政治机器镇压下，这些乌合之众的一切行动都是徒劳。§!"
 TEX_smith_party:0 "基督教民族主义党"
 TEX_smith_party_long:0 "基督教民族主义党(Christian Nationalist Party)\n§g在结束了至上党与基督教党的统治后，史密斯将所有追随于他的极右翼分子，民兵，恐怖分子与宗教人士都团结在一起并重新组建了一个名为基督教民族主义十字军，或被称为基督教民族主义党的极右翼政党。在这个党派中，几乎所有人都秉持着一个共同的政治图景：维护美国作为一个基督教国家，反对工团主义，共产主义或是无政府主义等等左派思想，同时还主张驱逐犹太人和黑人等不洁净的民族。同样的，相当一部分党员认为，“所有强迫黑人和白人种族混合的企图”也是需要被严厉镇压的。§!"
 TEX_nation_AFP_national_populist_party:0 "美利坚至上党"
 TEX_nation_AFP_national_populist_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党已经制定了它的民粹主义议程，在这个过程中，它明确了该党的未来是神权民粹主义。在查尔斯·库格林神父的领导下，民粹主义者尽其所能让人们听到他们响亮的声音。数以百万计的人民听着库格林的布道。§!"
