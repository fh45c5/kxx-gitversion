 unionstate.2300.a:0 "休伊·朗和美利坚至上党"
 unionstate.2300.b:0 "拉福莱特和国家进步党"
 unionstate.2300.c:0 "佩利和基督教党"
 unionstate.2300.e:0 "E·W·马兰和残余民主党"
 unionstate.2300.g:0 "菲利普·卡罗尔和神圣美利坚联盟"
 unionstate.2300.f:0 "奥丹尼尔老爹和德克萨斯民主党"
 unionstate.3001.t:0 "第二次大迁徙"
 unionstate.3001.d:0 "尽管宪政国试图限制住自己领土上的黑人公民迁移，然而已经有越来越多的非裔美国人逃亡去了北部和西部。这批移民的总数可能至少有100万人，其中有许多接近我国领土的已开始寻求在我国定居。尤其是德克萨斯州的各个城市，都有黑人移民大量涌入，但许多代表白人利益的政治机器，特别是忠诚之心尤其值得怀疑的民主党以及右翼至上党成员，都要求我们剥夺黑人移民的投票权，以免动摇他们的政治霸权。杰拉尔德·L·K·史密斯这样的白人民粹主义者也提议阻止更多黑人移民迁入，以免威胁到白人工人的就业率。然而，左翼至上党与进步派人士不同意这种观点，我们的将军们也看到了移民背后存在的潜在兵源与工人人力，他们建议允许移民定居并立即对他们发起招募和招聘运动。"
 unionstate.3001.a:0 "让他们加入"
 unionstate.3001.b:0 "让他们加入，但他们没有投票权"
 unionstate.3001.c:0 "宣布不再接受移民"
 unionstate.3002.t:0 "旧日机器"
 unionstate.3002.d:0 "所谓的正规民主党组织，指的是路易斯安那保守派民主党的政治机器，也是朗在自己家乡的老对手了。尽管如此，他们与朗在过去结成过联盟，而且这群“老派分子”对联盟国的忠诚还是超过了对宪政国或合众国的。现在也许是时候再次结成联盟了，只要我们同意不在南路易斯安那安插我们自己的候选人，他们就同意不反对我们。当然，一部分老派分子已经老到了去背弃朗、改投旧民主党，因此我们也可以选择以贪污为名对该组织发起彻查，逼迫其关门大吉，加深至上党在路易斯安那州的势力。自然，这样做会激怒老派精英和狂热白人至上主义者对朗的敌视。"
 unionstate.3002.a:0 "让出部分路易斯安那"
 unionstate.3002.b:0 "调查他们"
 unionstate.3003.t:0 "黑人军队争论"
 unionstate.3003.d:0 "黑人参军的问题在美国长期以来一直是一个有争议的问题，种族主义者和传统主义者坚称黑人缺乏担任士兵所需的智力，而其他人则坚持认为这种指控荒谬至极，只在剥夺我们急需的兵源。目前，杰拉尔德·L·K·史密斯代表种族主义者和传统主义者，坚持认为不能指望黑人当兵，更不能授予他们与白人士兵相同的地位。查尔斯·库格林和许多银色军团人士也都同意这一点，尽管佩利本人对是否让北方黑人加入军队时犹豫不决，但在谈到南方黑人时，他却强硬起来，坚称南方黑人缺乏“智慧和文明”。另一方面，路易斯安那州的至上党政治机器领导人雅各布·德弗斯和无党派人士等激进派正在大力推动黑人参军项目的建设，告诫称种族主义者的选择既会激怒非裔美国人，又会带来失败。他们坚持要求我们派出德弗斯发起黑人招募运动。"
 unionstate.3003.a:0 "我们需要黑人参军"
 unionstate.3003.b:0 "我们不能接受"
 unionstate.3004.t:0 "明尼阿波利斯工团主义者罢工"
 unionstate.3004.d:0 "农民劳工党虽掌控了明尼苏达州，但明尼阿波利斯城内的世产联势力仍旧强大，而且自从与其关系不错的前州长弗洛伊德·奥尔森去世后，这群人就愈发过分。现在他们发起罢工，显然是想加入联合工团，而要镇压他们的罢工，不仅会激化与工团主义者的矛盾，也会耗费我们的人力。所以，我们要么用钱摆平这事，要么就派国民警卫队武力镇压。当然，一些激进左翼至上党成员提出在明尼阿波利斯授予他们半自治权，只要他们不干涉住在那里的中产阶级和上层阶级，就允许他们自己沿着更偏向工团主义的路线运作，我们只需要把给他们的钱付给当地企业家们，就能大家都高兴了。"
 unionstate.3004.a:0 "补偿他们"
 unionstate.3004.b:0 "击溃他们"
 unionstate.3004.c:0 "给他们一些自治权"
 unionstate.3005.t:0 "银色军团壮大"
 unionstate.3005.d:0 "对于保守派人士来说，他们对民主党的民粹性缺失感到失望，却又被至上党与进步主义的国家进步党拒之门外，银色军团秉承的保守主义和财富再分配混合的理念已经成为了越来越有吸引力的一个替代。如今，民主党在农民等传统票仓中越来越不受欢迎，正逐渐衰退为一个立足于德克萨斯之外，仅由部分商人和中产阶级自由派支持的政党。"
 unionstate.3005.a:0 "有趣"
 unionstate.3006.t:0 "利安德·佩雷斯引发争议！"
 unionstate.3006.d:0 "利安德·佩雷斯，公开受贿的地方检察官、强硬的种族隔离主义者，以及某个政治机器的领袖，他与休伊·朗基于实用主义达成了联盟。最近，利安德发现自己陷入了一场大争论，因为我们的政敌派出的狗仔们发现，佩雷斯在石油融资租赁事业上的不正当举措，他只将合同发给自己的公司或贿赂他的对象。佩雷斯是一位强大的政治盟友，但他在石油业方面犯下的大错正触犯了我们对此采取的立场。当然，反过来说，这也是一个摆脱佩雷斯的大好机会，特别是考虑到当我们的政治议程偏离他的期望后，他会搞出来的问题。"
 unionstate.3006.a:0 "维护他"
 unionstate.3006.b:0 "叫他下台"
 unionstate.3007.t:0 "佩雷斯要求补偿！"
 unionstate.3007.d:0 "佩雷斯被我们逼他下台的企图激怒了！他声称，如果我们还想维持政治上的联盟关系，就要为他丢了工作提供补偿，并威胁我们如果敢采取法律手段，他就会拿出足够的证据来证明我们与他长期的合作关系。该怎么办呢？"
 unionstate.3007.a:0 "补偿他"
 unionstate.3007.b:0 "让他消失"
 unionstate.3008.t:0 "利安德·佩雷斯被绑架！"
 unionstate.3008.d:0 "在与休伊·朗闹翻后，受贿检察官利安德·佩雷斯失踪了。据报道，他与朗闹翻的原因是他霸占着路易斯安那州地方检察官的位置，以及长期以来一直擅自转移朗用于军事方面的资金。利安德显然是在离开法院进入自己的车时遭到伏击，车内的人将其制服后直接逃之夭夭。为什么他的保镖不加干预还不得而知。尽管朗将此事归咎于国内的叛党所为，但大部分人并不怀疑利安德现在大概沉在了美国哪里的沼泽之中。嘛，言归正传，杀鸡儆猴之后，我们可以允许利安德留下的政治机器恢复正常运作，要么就取而代之，建立至上党的政治机器，如果我们不打算遵循利安德时期的右翼政治议题的话。卡特·杜塞特将被任命为至上党代表，取代利安德，改革他的政治机器，使之更符合我们的价值观。"
 unionstate.3008.a:0 "让他的政治机器维持原样"
 unionstate.3008.b:0 "卡特·多塞特将会为自己的忠诚受到奖赏"
 unionstate.5100.t:0 "休伊·朗遇刺！"
 unionstate.5100.d.left:0 "休伊·朗总统在底特律遭到了菲利普·E·福克斯的刺杀，他是三K党大法师海勒姆·韦斯利·埃文斯的前同伴，因对旧民主党遭到朗的解散感到愤怒而策划了这次刺杀。当他的部下在人群中故意打斗分散一分钟人民兵的注意力时，他趁机用手枪对朗开了五枪，随后被民兵们击杀。朗本人预计已无法幸存下来，整个国家陷入悲痛之中，而至上党则一片混乱。"
 unionstate.5100.d.right:0 "休伊·朗总统在巡回全国期间遭到了马里奥·布达的刺杀，他是名激进无政府主义者，因朗与右翼结盟而感到愤怒。当他的部下在人群中故意打斗分散一分钟人民兵的注意力时，他趁机用手枪对朗开了五枪，随后被民兵们击杀。朗本人预计已无法幸存下来，整个国家陷入悲痛之中，而至上党则一片混乱。"
 unionstate.5100.a:0 "愿上帝保佑我们"
 unionstate.5101.t:0 "休伊·朗之死"
 unionstate.5101.d:0 "因为受到的致命伤，休伊·朗总统今日去世了。这天被定为了全国哀悼日，全国范围内广泛爆发了针对与刺杀者有关的组织的暴力事件。朗的葬礼预计将是美国建国史上规模最大的葬礼，民众将以真正的路易斯安那人的方式，一路护送朗的棺材行进。由于副总统职位基本上由至上党控制，许多人希望在下次选举前先选出一位新的领导人，以帮助国家从这场挫败中恢复过来。虽然至上党也不乏内讧，但其他政党目前的地位让能担任领导人一职的候选人并不多，厄尔·朗将与各个意识形态派别的领袖争夺至上党和国会的支持。"
 unionstate.5101.a:0 "愿他安息"
 unionstate.5102.t:0 "至上党初选！"
 unionstate.5102.d:0 "休伊·朗承诺要举办的新的选举，最终这场选举终于来了。至上党初选已经正式开始。许多候选人都踊跃参与，包括朗本人。他的主要对手将是杰拉尔德·史密斯和西德·麦克马斯，但有传言说朗的亲兄弟也希望接班至上党。允许他这样做，可以让朗的家族继续掌权，同时也表明休伊·朗愿意放弃权力——即使接班人是他的家族亲戚。然而，似乎朗自己并不赞同这一点，而是更喜欢自家之外的候选人。当然，鉴于休伊在我国的声望，他也有可能以压倒性优势连任。谁将是我们的总统提名人？"
 unionstate.5102.a:0 "杰拉尔德·L·K·史密斯"
 unionstate.5102.b:0 "查尔斯·库格林"
 unionstate.5102.c:0 "保罗·H·马洛尼"
 unionstate.5102.e:0 "大吉姆·福尔瑟姆"
 unionstate.5102.f:0 "西德·麦克马斯"
 unionstate.5102.g:0 "布朗森·M·卡廷"
 unionstate.5102.h:0 "阿尔弗雷德·米切尔·宾厄姆"
 unionstate.5102.i:0 "厄尔·朗"
 unionstate.5102.j:0 "休伊·朗"
 unionstate.5103.t:0 "第二次至上党初选！"
 unionstate.5103.d:0 "内战结束后，休伊·朗建立的包括至上党和其他政党的选举制度开始趋于稳定。三个主要政党再次参选。然而，目前，所有公众地目光都集中在至上党身上，该党今年将举行另一次初选。与国家进步党和基督教党不同的是，党内有许多希望获得提名的政客，该党的未来将在这场竞争中决定。这个党会继续跟从朗的指引吗？还是会转向新方向？"
 unionstate.5103.a:0 "杰拉尔德·L·K·史密斯"
 unionstate.5103.b:0 "查尔斯·库格林"
 unionstate.5103.c:0 "保罗·H·马洛尼"
 unionstate.5103.e:0 "大吉姆·福尔瑟姆"
 unionstate.5103.f:0 "西德·麦克马斯"
 unionstate.5103.g:0 "布朗森·M·卡廷"
 unionstate.5103.h:0 "阿尔弗雷德·米切尔·宾厄姆"
 unionstate.5103.i:0 "厄尔·朗"
 unionstate.5103.j:0 "休伊·朗，永远都要休伊·朗"
 unionstate.5104.t:0 "至上党初选！"
 unionstate.5104.d:0 "休伊·朗承诺要举办的新的选举，最终这场选举终于来了。至上党初选已经正式开始。许多候选人都踊跃参与。在党内，那些过去的激进派系已经无影无踪，而占据党内绝大多的成员都是忠诚于休伊·朗的事业而又愿保证美利坚的民主无恙的民主人士。代表党内保守主义者的保罗·H·马洛尼与代表党内进步主义者的布朗森·卡廷是两大最为受欢迎的候选者。而代表自由派的大吉姆与麦克马斯也在党内颇有人望，也是不可小觑。党内初选已至，谁能成为我们的候选人？"
 unionstate.5104.a:0 "保罗·H·马洛尼"
 unionstate.5104.b:0 "大吉姆·福尔瑟姆"
 unionstate.5104.c:0 "西德·麦克马斯"
 unionstate.5104.e:0 "布朗森·M·卡廷"
 unionstate.5105.t:0 "主持朗总统葬礼的荣誉"
 unionstate.5105.d:0 "如今，美国英雄休伊·朗已经逝世，而他的副手和家人们都在争夺着他的遗产，希望通过某种方式获得权力。然而，摆在我们面前的最要紧事务则是为总统举办葬礼，同时这也是能让如今分裂的至上党达成一致的唯一事情。我们尚不清楚如果让总统主持葬礼人们会如何反应，但如果我们让别人主持葬礼，他们便可能以此为自己牟利。指责已纷至沓来，我们必须作出选择。杰拉尔德·L·K·史密斯很快就利用了厄尔·朗和他哥哥间的不合关系，认为他比厄尔同这位已故之人更为亲近。而据报道，作为回应，厄尔·朗曾打趣说，杰拉尔德常常自命不凡地喋喋不休，休伊很久以前就想让他滚蛋了。查尔斯·库格林的行为及能力可以引导人们崇敬休伊，因此其声称葬礼应该由一个真正的牧师来主持。而对此，史密斯反驳道，他与库格林相比，是个更好的牧师，也是一个更好的演讲者。与此同时，厄尔·朗只是轻描淡写地指出，他的家人们从来都不太喜欢浪漫主义。在争吵中，各个左翼派别已团结在布朗森·卡廷身后，想让他主持葬礼，他们指出卡廷在整个职业生涯中为朗的事业给予了无声但坚定的支持。但很少有人注意到这一点，所有的反对者都指责卡廷在暗中反对朗主义。也有折衷的选择，那就是拉塞尔·B·朗，他是已故休伊的儿子。尽管这个男孩已表现出了自己的一些政治智慧，但他太过年轻，缺乏经验，无法为自己赢得权力，所以很多人认为他是个完美的选择。让儿子为父亲主持葬礼会让我们政府受到欢迎，但我们的对手们会怎么做呢？但所有人也都意识到，如果某个人能够肩负如此重要的职责，那么毫无疑问，关于休伊·朗的刺杀调查，也必然会被此人与他身后的派系所主导。"
 unionstate.5105.a:0 "杰拉尔德·K·史密斯将会发表动人心弦的演讲！"
 unionstate.5105.b:0 "厄尔·朗将为他的兄弟哀悼！"
 unionstate.5105.c:0 "查尔斯·库格林将会进行一场激动人心的布道！"
 unionstate.5105.e:0 "布朗森·卡廷决定赞颂朗的生平"
 unionstate.5105.f:0 "拉塞尔·朗会让民众重燃希望！"
 unionstate.5106.t:0 "为朗立碑塑像？"
 unionstate.5106.d:0 "为了纪念休伊·朗的生平事迹，有人想要建起一个雕像，让他能继续以另一种方式存于人间。大多数人对对此表示同意，但分歧出在这座雕像的高度与性质，休伊·朗的亲信们为此争吵不休。杰拉尔德·K·史密斯和厄尔·朗在这一问题上罕见地团结一致，他们要求为休伊建一座高大宏伟的立像，并认为只有这样才能为死者伸张正义。与此同时，阿尔弗雷德·宾厄姆及其领导下的贝拉米主义者不支持这一想法，他们认为这可能会妨碍他们的运动，特别是他们所谓的民主计划。与之相反，他们认为，这一雕像应该像林肯纪念堂里面的林肯坐像一样，着重于体现朗的远见，而非其力量。不过，查尔斯·库格林神父主张建造一座谦卑的，与休伊·朗真人身高相同的雕像，这样他就可以像他生前一样与人民待在一起了。虽然库格林的动机听上去似乎很高尚，但他的批评者在私下里说，库格林只是害怕朗压了他的风头而已，要是给他建个高高的雕像，他乐意还来不及呢。我们应该怎么办？"
 unionstate.5106.a:0 "一座宏伟的雕像，与他正好相称！"
 unionstate.5106.b:0 "一座坐像，凸显他的远见和智慧！"
 unionstate.5106.c:0 "一个小小的雕像，这样休伊就能永远和他的人民在一起了！"
 unionstate.5109.t:0 "为辛克莱和终结加州贫困运动正名"
 unionstate.5109.d:0 "厄普顿·辛克莱是这个国家进步、正义和公平的真正先驱者，也是一个深受左派爱戴的人。而宾厄姆总统也不例外，他深受辛克莱著名的“终结加州贫困”运动的启发和影响，该运动旨在争取养老金保障、累进所得税、没收闲置土地和更庞大的公共机构。而现在，辛克莱多年前提出的许多政策正被宾厄姆政府认真考虑并准备实施。但这并非没有争议的，因为在内战期间，辛克莱加入了现已不复存在的太平洋国政府。无可争议的是，辛克莱是个叛国者，他加入了非法政府，并认为联盟国已背离了美国的民主愿景。但尽管如此，总统仍相信，就算他在历史上站在了错误的一边，辛克莱仍是个好人，有良善的想法，并真诚地致力于改造美国。宾厄姆甚至还考虑邀请辛克莱进入政府担任商务部长。但内阁的其他成员认为，在我们进行了大量的反太平洋国宣传之后，作出这样的举动可能会损害总统在民众中的形象。艾米利副总统建议在全国范围内推广终结加州贫困计划，但并不任命辛克莱担任政府公职。而其他人仍然认为，任何与辛克莱或他的计划的联系都是对宾厄姆建立一个中产阶级领导的社会主义美国的愿望的背叛，并会使我们忽视忠诚因素，进而与其他前社会主义者结盟。最终，决定权在总统手中，而辛克莱和内阁只能希望他做出正确的决定……"
 unionstate.5109.a:0 "欢迎欢迎，辛克莱部长。"
 unionstate.5109.b:0 "虽然他品格败坏，但他的远见却尚未过时，而且将会被发扬光大"
 unionstate.5109.c:0 "他是把老骨头了，在这个新美国没有立足之地。"
 unionstate.5110.t:0 "为杜威和贝拉米主义者正名"
 unionstate.5110.d:0 "宾厄姆总统最亲密的朋友与盟友之一是约翰·杜威。杜威比宾厄姆年长46岁，他对宾厄姆的影响很大，也是宾厄姆的导师，两人也经常合作。在内战爆发前，两人都在暗中决定在战争中加入不同的派别，宾厄姆为联盟国工作，而杜威和其他贝拉米主义者则加入了联合工团。当然，内战现在已经过去了，宾厄姆对他的老朋友选择站在工团主义者一边并无恶意。毕竟，是杜威教会了宾厄姆实用主义的重要性。事实上，总统还希望通过让杜威加入他的政府，以此正式为其正名并奖励他几十年来为国家服务的行为。大多数内阁成员对此也表示同意，并建议派杜威和其他贝拉米主义者作为政府顾问，在红带执行与推广我们的政策。而在这个职位上，他可以利用自己的许多伟大思想，教育并帮助该地区的行政人员更好地实施我们的政策。不过，虽然宾厄姆确实支持把贝拉米主义者送去红带，但他更倾向于让杜威专门负责我们国家的教育。毕竟杜威最出名的是他在教育改革方面的工作，这也能将有效地让他完成他的愿望，将教育机构转变为进步的服务机构，推动社会发展并促进人民启蒙，这也是宾厄姆一直钦佩的理想。但许多人仍然对给予一个前叛徒这么大的权力持怀疑态度，一些杜威的批评者恳求总统重新考虑完全恢复杜威名誉的事，并让他继续在政府之外工作。而约翰·杜威的未来掌握在总统手中……"
 unionstate.5110.a:0 "杜威先生，你来搞教育"
 unionstate.5110.b:0 "杜威应在红带发挥他的才能"
 unionstate.5110.c:0 "宾厄姆政府里不得有叛徒，不管他是不是朋友"
 unionstate.5111.t:0 "选举问题"
 unionstate.5111.d:0 "在朗总统去世后，美利坚至上党仍正努力维持在他的魅力、能力与指挥下让该党所享有的声望与主导地位。既然我们近来才掌握权力，我们应该谨慎地举行选举，以加强我们的合法性，并巩固我们作为朗政府接班人的地位。虽然有失败的风险，但党相信，只要我们打对了牌，胜利就一定是我们的。但是，也有一些人主张，我们应该等一两年之后再进行选举，先让我们的政策得到国民的信任和支持。不过另一些人说，我们越早让人民感觉自己能发出声音，我们的结局就越好。现在是时候作出选择了——选举将在何时举行？"
 unionstate.5111.a:0 "立刻提上日程"
 unionstate.5111.b:0 "等待一切稳定，我们要稳固现有优势"
 unionstate.5112.t:0 "巩固权力"
 unionstate.5112.d:0 "既然我们已击败了竞选总统路上的主要对手，我们便必须进一步巩固我们的新地位。美国人民或多或少愿意接受休伊·朗成为终身总统，但对[TEX.GetLeader]来说，他离拥有这种声望还远得很。因此，我们大体上有两个办法。我们可以承诺举行选举，然后用我们的政治机器操纵选举，然后以这种方式取胜。或者，我们可以放弃这种弄虚作假的做法，只要我们完成休伊的改革，至少在表面上如此，我们就能统治足够长的时间。每种方法都各有其缺点，但在休伊·朗离位后，我们必须找到某种方式来让我们获得合法性。"
 unionstate.5112.a:0 "承诺“选举”来满足我们的对手"
 unionstate.5112.b:0 "提醒大家，我们需要些时间完成休伊的改革"
 unionstate.5113.t:0 "[GetYear]年总统大选"
 unionstate.5113.d:0 "经过一个月的热切等待，选民们现在正排着队进入他们被指定的选举点，准备开始投票。尽管有几位至上党以外的候选人，赢家花落谁家也暂不明了，但人们普遍认为[TEX.GetLeader]将赢得选举。然而，这并不重要——有我党的政治机器和我们控制下的计票机的加持，获胜只是个时间问题……"
 unionstate.5113.a:0 "恭喜[TEX.GetLeader]！"
 unionstate.5114.t:0 "兄长之愿"
 unionstate.5114.d:0 "虽然休伊已经不在世了，人们也非常怀念他的领导，但他的弟弟还是延续了他帝王式总统的地位。厄尔发誓要继承并完成他的兄长开启的伟大事业，而不让反对派碍手碍脚并让他变得短视。在这个时代，美国需要强力手腕，因为它正在没有休伊·朗指导的情况下面临着一个不断变化着的世界。厄尔必须坚强起来，让他的人民克服悲痛，并走出失去兄长的阴影。美利坚和厄尔·朗需要彼此，任何人都不能妨碍他们。这个国家仍沿着王鱼的道路前进，但将由一位新人作为向导。"
 unionstate.5114.a:0 "美国至上，直到永远"
 unionstate.5115.t:0 "厄尔之愿"
 unionstate.5115.d:0 "厄尔·朗总统一生之中都在他已故兄长的阴影下生活。对厄尔来说，他与休伊·朗的血亲关系亦福亦祸。他肯定不会想到自己可能和兄长一样，带领着美国人民走上一条他曾经追随着的道路。但现在，休伊已逝。国家也有了新的领导人，厄尔也必须抓住机会，走出那毕生以来都笼罩着他的阴影。因此，厄尔才会立志在总统任上走出自己的路，追随自我，建立一个与其兄长设想不尽相同的美国。虽然他永不会否定他兄长所开创的伟大事业，也永不会忘记休伊，但厄尔还是有他自己的愿望。新任总统将利用前任总统所建立的基础，继续推进国家民主化，并推动至上党及其政治平台的自由化。黑人和其他被压迫者终于在其中能有一席之地。毕竟，在这个可怕的时刻，美国需要强有力的领导，而休伊一次又一次地证明，选民们正是喜欢强而有力的领导人。我们只是在做我们认为有用的事而已……"
 unionstate.5115.a:0 "为新美国而战！"
 unionstate.5116.t:0 "长袖善舞"
 unionstate.5116.d:0 "厄尔·朗总统在其政府初创时花费了大量时间在全国各地巡游，并发表了一系列鼓舞人心的演讲。在休伊·朗总统不幸去世后，厄尔用鼓舞人心的言辞鼓励国家与人民重新站起来，从失去这位伟大总统的悲痛中振作起来。厄尔模仿了他兄长富有魅力的演讲风格，他也和休伊一样，受那些需要一个强有力的声音向他们许诺一个美好未来的人的欢迎。尽管有些批评者通过分析其言语作出猜测，厄尔正开始走出王鱼的阴影。值得注意的是，这位新总统不太关注政策上的承诺，而是专注于用笑话、趣闻和家常话填满演讲稿，以使民众和他自己都感到振奋和高兴。这一系列演讲已为厄尔赢得了数百万人的支持，他们现在相信厄尔不仅能接替休伊的位置，而且还能独立自主，凭借自己的力量成为一个强有力的领导人。"
 unionstate.5116.a:0 "总统如此活力充沛，我们将让美国前进！"
 unionstate.5117.t:0 "真正敌人"
 unionstate.5117.d:0 "在史密斯总统之前，休伊·朗是一位为国家做了许多事情的伟人，他保卫美国人民免受社会主义、自由主义、精英主义、财富和境外势力的邪恶影响。然而，史密斯宣称，他的梦想和他的事业几乎在每一个转折点上都被一群犹太小丑所妨碍，并被迫向其妥协。朗可能赢得了内战，但他却因那些只想毁灭美国社会的人失去了随之而来的和平，甚至是他的生命。但史密斯总统宣布，他不会重复英雄前任的错误，他也不会成为锡安的下一个受害者。在一次热烈的演讲中，史密斯宣称：“美国人必须在犹太人毁灭我们之前便先发制人。而为了做到这一点，我们必须剥夺他们最强大的武器：财富。”史密斯总统发布了一项行政命令，要求将高级银行家和其他经济精英列为目标，并剥夺其利润所得。此外，当金融家们想躲避惩罚时，他们将遭受最致命的一击。银行家、实业家和高管都应被逮捕，接受审判，并根据上帝的意愿，被正义地监禁。这将让阴谋集团不再对善良的美国人民构成威胁。而由于其资产掌握在政府手中，史密斯总统将能够完成朗的工作，并继续实现上帝赋予美国的天命。"
 unionstate.5117.a:0 "爬吧，资本家！"
 unionstate.5118.t:0 "打倒恶人！"
 unionstate.5118.d:0 "史密斯总统下达了最新的行政命令，其是美利坚反抗锡安长老会统治所作的一切努力的集大成品！在总统的监视下，这个国家已在从那些阻碍它发展，并希望破坏良善美国人的人中解放出来的方面取得了巨大成就。然而，史密斯总统已经宣布，仅仅把犹太人关进监狱或剥夺他们的财富还是不够的。希伯来人仍对我们的制度、我们的人民和我们的国家构成着很大的威胁。史密斯宣布，如果美国要完成已故总统朗所开创的事业，那么，我们就必须把背道者及其异端信仰从我们的国土上驱逐出去。通过这一新的行政命令，史密斯政府呼吁推行“二次出埃及”政策，在这一过程中，犹太人将被驱逐出这个国家。《美国进步报》的头条新闻表明了许多社区正为驱逐行动的开始而欢呼与庆祝。而其他没发声的人，因为害怕被报复，只能默默地为他们失去的邻居，朋友和美国同胞而哀悼。而对犹太人自己来说，当他们告别自由之地时，心中只有绝望。他们唯有希望，无论他们在何处结束流散之旅，都最终能获得自由……"
 unionstate.5118.a:0 "爪巴！"
 unionstate.5119.t:0 "打倒金融巨鳄"
 unionstate.5119.d:0 "库格林总统终于准备好去实现他最伟大的目标之一——对抗并摧毁资本主义，推行他自己的社会公义计划。美国的精英们长久以来如此放纵无度，他们把这个国家腐化成了腐败的现代资本主义中贪婪奸商的避风港！作为为数不多令人钦佩的私营企业领导人之一，亨利·福特认为，库格林应该集中精力完成朗总统的工作，砍下华尔街的犹太怪兽的脑袋，让他们收回搭在控制着美利坚人民的金融行业上的脏手。然而，《美国进步报》的出版商们却主张将重点放在打击他们在娱乐业的敌人上。博物馆、电影业、节庆业、游乐园、剧院业、歌剧业，甚至库格林心爱的电台业，都被邪恶的犹太小丑把持着！按照他们的说法，这群人利用着这些娱乐业向人民撒谎，并对我们执行与保卫全国社会公义联盟政策的努力构成了相当大的威胁。如果我们继续允许这些小丑腐化上帝羔羊们的心灵，那么商业主义的恐怖、贪婪和个人主义的诡辩可能永远无法在美国大地上得以消除。但毫无疑问，两个拳头打人还是太危险了。但如果我们把娱乐业的强盗大亨和银行业、餐饮业、制造业、运输业的巨头都关进监狱，并剥夺他们的不义之财，那么民众就会转而追求上帝为国家带来的社会公义。我们应该先针对谁？"
 unionstate.5119.a:0 "无论付出多大代价，都必须阻止大资本家"
 unionstate.5119.b:0 "娱乐界大腕太危险了，不能放纵他们"
 unionstate.5121.t:0 "飞翔的参议员"
 unionstate.5121.d:0 "随着我们基本巩固了对新英格兰的控制，我们必须决定如何处置阿尔弗雷德·宾厄姆的父亲，海勒姆·宾厄姆三世。老宾厄姆的过去可谓是丰富多彩——其出生于夏威夷的一个新教传教士家庭，在长大后进入耶鲁大学，毕业后在哈佛大学教书。而他对拉丁美洲历史的痴迷促使他远征秘鲁，在那里他发现了现在闻名于世的马丘比丘遗址。海勒姆·宾厄姆三世本可以为他多姿多彩的一生而满足了。然而，他并没有就此止步——他进入了政坛，成为了康涅狄格州的州长和参议员。他在该职位上任职多年，当二次内战爆发时，他加入新英格兰政府。尽管他们的关系经常有点紧张，阿尔弗雷德对他的父亲还有一种柔情在。我们必须决定该如何对待他，许多人叫嚷着要像逮捕其他叛国者一样逮捕他，他也并没有为自己的行为辩护。而另一个选择则是把他送回秘鲁，不过这次是以外交官的身份。这样既可以让他离开美国，同时也可以给他一些尊严。当然，他也可以就待在那就行，毕竟他老了，没有什么威胁……"
 unionstate.5121.a:0 "抓起来！"
 unionstate.5121.b:0 "眼不见，心不烦……"
 unionstate.5121.c:0 "让他走！"
 unionstate.5122.t:0 "休伊·朗博物馆"
 unionstate.5122.d:0 "史密斯总统宣布建造一座博物馆，以纪念伟大总统休伊·P·朗的生平、思想与其遗产。公共工程管理局已与一支由最优秀的建筑师、工程师、历史学家、至上党底层成员，甚至是路易斯安那州立大学的学者们组成的团队签约，以建造一个配得上、能纪念朗的建筑。而许多录音、文件、信件、纪念品和其他材料都是由朗的家人、已故总统的同事和美利坚至上党捐赠的。历史学家哈雷·勃兹曼，朗的一个密友，他主持着展品收集工作，并努力确保博物馆的每一件展品都有助于纪念朗的成就与理想，并能把休伊塑造成穷人的捍卫者、伟大的领袖，以及一个正人君子。博物馆的盛大开幕式将定于明年八月三十日，也就是休伊的生日举行。虽然进展顺利，但关于该项目的资金筹措方式却出现了争议。至上党的左翼成员主张建造博物馆的预算将由税收支付，他们认为，考虑到休伊·朗的受欢迎程度和我们本就很高的税率，这是最无争议，也是最方便的选择。而罗斯·朗和她的家人则要求允许他们为这个博物馆筹集资金，虽然这可能会非常成功，甚至有可能为党赢得支持，但史密斯更愿意让自己或他的一个重要盟友来领导这场筹款活动，而非让一个将他视为竞争对手的家庭来领导。不过，亨利·福特和内政部长米德·麦克拉纳汉已经暗中说服了史密斯，让他考虑让犹太人为这座建筑买单。他们认为这是个犹太人对美国与史密斯总统的赔款问题，因为正是一个犹太人谋杀了休伊·朗。毕竟，总统已拘留了路易斯安那州著名的犹太建筑师，朗从前的老伙伴利昂·C·韦斯，因为总统怀疑他挪用公款，并与谋杀朗的人，卡尔·韦斯有联系，在暗中协助了杀手的行动。这是个能让犹太人不在犯下滔天罪恶后却逍遥法外的最好选择。无论如何，博物馆的建筑费用早晚要付，并且我们也必须做出决定。"
 unionstate.5122.a:0 "博物馆将由我们公民交的税建筑"
 unionstate.5122.b:0 "朗家族将在全国发起一场筹款活动"
 unionstate.5122.c:0 "史密斯和至上党是朗一手缔造的，他们将主持这次筹款活动！"
 unionstate.5122.e:0 "如果这个国家正义尚存的话，那犹太人就必须为此买单！"
 unionstate.5123.t:0 "西摩·韦斯采取行动"
 unionstate.5123.d:0 "美利坚至上党刚刚经历了又一场权力斗争，休伊·朗的密友与新奥尔良市长，西摩·韦斯试图从史密斯总统手中夺走该党的控制权。韦斯指出，史密斯与亨利·福特和詹姆斯·伊斯特兰等人关系密切，他谴责史密斯是已故王鱼理想的叛徒，不适合继承总统之位，也不适合领导善良的美国人民。他甚至敢于要求至上党的主要领导人和他一起站出来反对史密斯，这样他们就可以任命一位新总统，而当机会出现时，他将恢复党的初心与理想。但随着总统在一系列严厉的演讲中抨击了韦斯，他的政治反抗很快就被平息。史密斯断言，韦斯无时无刻不在破坏休伊·朗的事业，并在犹太人的阴谋中扮演领导，以阻止休伊·朗把美国的穷人从精英手中解放出来。而正是这些阴谋导致了朗制定了大部分可疑的政策，并最终导致了他悲惨地遇刺。事实上，刺杀朗的凶手卡尔·韦斯博士就和他一个犹太姓，这更证明了他们之间的联系，并让史密斯和他的支持者坚信着这些指控的真实性。当冲突在新奥尔良的法国区爆发时，紧张的气氛达到了顶峰，愤怒的市民威胁要对韦斯进行报复，并因休伊之死与警察发生了冲突。今天早上，史密斯总统宣布逮捕西摩·韦斯，正式结束了争夺党的控制权的斗争。他对此评论道：“显而易见，韦斯市长犯下了谋杀罪、并与犹太黑人勾结、做出了各种各样的变态行为、暗中推广爵士乐、更犯下了盗窃、叛国、腐败和逃税等诸多罪行，我希望他能被绳之以法。”新任新奥尔良市长的选举已提上日程。与此同时，韦斯正在等待审判，他可能会被判处死刑。"
 unionstate.5123.a:0 "朗的遗产如此稳固，我们的权位也是如此"
 unionstate.5124.t:0 "宾厄姆与胡适"
 unionstate.5124.d:0 "今天，宾厄姆总统与中华联省的胡适总统举行了首次会晤，这是计划中的一系列峰会中的开头，旨在促进美中两国在贸易、国际事务和共同防务方面的合作。在公开场合，两位领导人强调了新中国和美国在保护各阶层人民的福利与自由方面的共同价值认同。而在私下里，据说会谈的进展非常顺利。虽然两国领导人没有完全取得一致，但一贯务实的胡总统能够与他的谈判对手找到许多共同点。其出色的英语也让谈判变得更容易，他祝贺他的谈判对手成功与和平地实现了国家的社会化、为美国人民提供了良好的生活水平和建立了“一流”的教育制度。宾厄姆反过来也表达了他对联省主义者事业的崇高钦佩之情，正是在他们的努力之下，共和主义才降临了中国，并称赞了胡适尽管有点右，却仍愿意吸收进步思想。此后，作为约翰·杜威最成功的学生，两人的相同经历又使他们很快建立了联系。事实上，据报道，两人花了超过一半的时间交换他们与杜威相处时的故事，以及他们在那时建立起来的哲学信仰。由于时间有限，两位领导人匆忙但富有成效地地签订了一项两国之间的贸易协议。而回到公众视野，胡适和宾厄姆共同承诺降低各项商品的关税，在受威胁的情况下保护彼此的海上运输线，并促进两国智库和其他非盈利组织间的交流。峰会在胡适与宾厄姆互赠作品中结束，胡适送的是《中国哲学史大纲》，宾厄姆送的是《叛逆的美国：中产阶级的反抗》。两国元首都对下次峰会表示了极大的期待。"
 unionstate.5124.a:0 "为中美两国的长久繁荣干杯！"
 unionstate.5125.t:0 "小花国家朝圣地圣殿"
 unionstate.5125.d:0 "“小花神殿”最初是为了纪念几十年前去世的法国天主教徒利雪的圣泰蕾兹，并以其名字而命名的。然而，它更为直接的意义，在于它是查尔斯·库格林最初作为牧师定居在美国的地方。正是在这里，库格林获得了支持，而且还是在一个新教社区。这里也是三K党焚烧十字架的地方，正是此举激怒了库格林，让他随后反对该组织。现在战争结束了，库格林也把注意力投回了他的老地盘。他来得也正是时候——1936年，大火摧毁了该建筑的旧木制结构，最近该建筑才进行了翻修，而现在，库格林将其指定为国家朝圣地。现在，这座教堂要比以前大得多，还在全国享有盛名，成为了美国最好的教堂之一。"
 unionstate.5125.a:0 "让我们看看三K党现在的傻逼行径……"
 unionstate.5126.t:0 "库格林肃清了左翼朗派"
 unionstate.5126.d:0 "查尔斯·库格林作为国家领导人的首个行动就是宣布最激进的左翼朗派是叛徒。尽管据报道，库格林更倾向于监禁这些人，但一些政府人士已敦促他重新考虑，他们坚持认为，只要把这些人从任何政府职位或其他权力领域移除就足够了。而这一行动的目标就是阿尔弗雷德·米切尔·宾厄姆、布朗森·M·卡廷、西德·麦克马斯、约瑟夫·C·奥马霍尼这类人。而对于这些人来说，他们已提出抗议，指出他们既不是工团主义者，也不是共产主义者，并坚持要求库格林下台。但库格林不愿意这么做——他向数百万人承诺，他将根除政府中腐败、欺骗与背叛的根源，而这只是朝着这个目标迈出的一步罢了。我们要怎么做？"
 unionstate.5126.a:0 "严惩不贷！"
 unionstate.5126.b:0 "滚出政府！"
 unionstate.5127.t:0 "厄尔·朗和老熟人"
 unionstate.5127.d:0 "在路易斯安那州的政治生涯中，厄尔·朗知道很少有其他组织能像路易斯安那州民主协会那样反对他的兄长，他们也被称为“老熟人”。然而，休伊·朗在1935年击碎了他们的权力基础，现在他离世了，他们被迫效忠于厄尔·朗。而这些在路易斯安那州拥有强大影响力的人物对厄尔来说无异于天赐之物，他一直在努力争取全国各州政府的支持，但许多人仍不相信他有能力继承他兄长的位置。而“老熟人”在新的“朗派”领袖罗伯特·S·马埃斯特里的领导下，已开始改变人们的这种印象。看到他们获得成功后，厄尔大叔决定在全国范围内，或至少在南方各州，推广“老熟人”的概念，这或许物有所值。然而，这可能会让我们被人认为是在搞腐败……"
 unionstate.5127.a:0 "把他们留在路易斯安那就行！"
 unionstate.5127.b:0 "别的州也该搞搞了！"
 unionstate.5129.t:0 "为新圣城奠基"
 unionstate.5129.d:0 "今天下午，史密斯总统所钟爱的最新工程已盛大开幕。总统和内政部长米德·麦克拉纳汉自内战结束以来就一直梦想着建设他们的“神圣工程”。而史密斯一上任，就悄悄地委托雕塑家埃米特·沙利文将这个梦想变成现实，并领导建造了一座座与正式大小相同、重现了基督时代的古耶路撒冷的建筑群。而位于阿肯色州和密苏里州边界的奥扎克山脉内的斯普林菲尔德高原因其与耶路撒冷惊人的地理相似性而被选中。一个庞大的团队在那得以组建，并负责这一工程的建设，而在接下来的几年里，据报道，工程进度在紧张有序地推进着。总统自己也从自己的口袋里捐了一百多万美元给这个工程，并筹集了更多的资金，但是关于犹太人被迫“捐赠”大笔资金来建造新耶路撒冷的谣言一直在国内蔓延，直到犹太人被大规模驱逐为止。事实上，人们还建造了一座巨大的、俯瞰着这座城市的基督雕像，象征着基督教战胜了占领耶路撒冷的犹太人和罗马军队。无论如何，工程已竣工，总统也已经正式开放城市给善良的基督徒公众享受！然而，一进入这个城市，游客们就震惊地发现，这个“城市”更像是个耶路撒冷风格的基督教主题公园。每座建筑都收藏着艺术品，而在市中心有个圆形剧场，耶稣受难记的剧目在那上演。更令人吃惊的是“地球历史博物馆”，其旨在带领人们探索真实的、神造论的世界历史，以及描绘耶稣扛着十字架登上加略山的过山车之旅。出乎众人意料，尽管超出了人们的预期，该工程的开放首日仍非常成功。许多与会者离开时都感到精神焕发、激动不已，甚至更加虔诚了！欧扎克地区的旅游业有望蓬勃发展，史密斯总统对此也非常高兴。"
 unionstate.5129.a:0 "基督教价值观再次盛行美国"
 unionstate.5130.t:0 "同弗朗西丝·斯威尼竞争"
 unionstate.5130.d:0 "弗朗西丝·斯威尼是库格林政府最恶毒、也是最张扬的反对者之一，她是《波士顿城市记者报》的主编和作者。斯威尼本人是天主教徒，在爱尔兰裔美国人社区很闻名，因为她是通过谴责波士顿的爱尔兰帮派而成名的，后者受库格林总统言论的启发，正恐吓着这座城市的犹太人。她的报道帮助提高了人们对这座城市反犹主义程度的认识，并说服了波士顿市长詹姆斯·迈克尔·柯利调配更多的警察保护犹太社区。她充满激情的工作被至上党官员以谨慎与乐观的眼光所看待，他们希望她能呼吁库格林采取更宽大的议程。然而，斯威尼并不满足于待在波士顿。在她飞速撰写的报道中，她批评美利坚至上党是个腐败组织，而库格林总统则是一个背离教会、扭曲上帝福音的人。在她言辞尖锐的文章中，斯威尼公开称库格林为反犹分子，并要求他停止限制美国同胞的自由，以及停止迫害我们“信仰中的兄长”，因为他们同样承受了美国天主教徒所遭受的许多压迫。事实上，她的威胁如此之大，以至于她每抗议一次至上党的活动，她的追随者就越来越多。"
 unionstate.5130.a:0 "问题来了……"
 unionstate.5131.t:0 "问题不再"
 unionstate.5131.d:0 "波士顿枢机主教奥康奈尔曾将斯威尼逐出教会，本以为这能平息她带来的异议，却适得其反。越来越多的进步天主教徒和对政府失望的人转而支持斯威尼，并在全国各地加入她的运动。似乎库格林总统已经坐不住了。据报道，国会日前通过了一项法案，将斯威尼的资产和《波士顿城市记者报》转移给了政府，民兵随后突击搜查了她的报社总部。其罪名是“旨在破坏国家安全的行为”和“颠覆联邦权威”。由于行政压力，对斯威尼的审判不过是走个流程。经过短短一个月的“审理”，弗朗西丝·斯威尼因叛国罪被判处12年监禁。尽管斯威尼年纪尚轻，但她的健康状况却因风湿性心脏病而迅速恶化。今天早上，在斯威尼的心脏病再度发作后，她似乎已经时日无多，斯威尼的支持者们哀悼着他们的失败，许多天主教徒和犹太人静静地反思这位勇敢的年轻记者的生活和工作，并质疑着这个国家的未来。然而，就目前而言，库格林总统离实现他对美国的伟大抱负又近了一步，并庆祝着战胜这个后起反对派而获得的和平。"
 unionstate.5131.a:0 "即使是这个女人也不能阻止社会公义的潮流！"
 unionstate.5900.t:0 "分区制度"
 unionstate.5900.d:0 "如今佩利政权不得不去处理一个颇有争议的，最早在佩利竞选议程里被提出的激进想法。在过去，佩利总统曾公开倡议一个在他眼中可以让政府最大限度地帮助扶持贫困公民的制度。这种被称为“分区制度”的想法主张让州政府将那些被认定为最贫困阶层的美国人民（特别是阿巴拉契亚地区白人、南方黑人和墨西哥移民）单独分区进行监护和照顾。佩利认为这些贫困因素是社会上最为缺乏生产力的，因此拒绝给予他们完全的联邦福利，还把大部分分区对象的工作调配为了劳工。从理论上讲，分区制度可以为这些人提供职业教育，确保他们能够平等地参与联邦劳工市场，但一些人对此表示愤慨，将这种激进的想法与现代奴隶制相提并论。佩利总统称这种污蔑令人愤慨，分区制度当然是对旧的吉姆·克劳法体系的进步。但由于美利坚公民自由联盟和全国有色人种协进会的代表律师以及政府内的反对派都对此提出了质疑，基督教党的大部分成员也越发不愿意支持这一主张，因此我们必须立刻做出决定，是趁着还没完全失去民心前推行这种制度，还是彻底放弃？"
 unionstate.5900.a:0 "实行分区制度"
 unionstate.5900.b:0 "不，我们还是放弃吧"
 unionstate.5901.t:0 "清理好莱坞"
 unionstate.5901.d:0 "在投身精神领域或者说，政治领域之前，佩利其实是好莱坞一位相当成功的编剧，虽然他最终对电影业其中隐含的那种工团主义影响感到厌恶而退出，但他仍然对银幕保持着喜爱，即使银幕反过来开始鄙视他。最近，总统在白宫组织了几部他从业时期帮助制作的电影的公映会，会后，他宣布了一系列行政命令，试图清除好莱坞的任何反美元素，同时赞助开设新的电影制片厂，以便如果好莱坞又不“干净”了的话，美国人也能继续不中断地享受电影的乐趣。尽管政府中有许多人认为这一政策过于激进，但大部分右翼党内人士都在敦促佩利立刻执行这些政策，而佩利也更愿意立即行动。"
 unionstate.5901.a:0 "洗净好莱坞"
 unionstate.5901.b:0 "我们会给他们一次机会"
 unionstate.5902.t:0 "最初的美洲人"
 unionstate.5902.d:0 "在现代美国社会中，还有哪个群体是比原住民更加弱势、更受压迫的吗？在佩利总统看来，答案是否定的。从政以来的数年，佩利一直在撰文揭露印第安各族群遭受的苦难，痛斥企图通过卑劣手段掠夺原住民合法土地的某些团体，以及那些试图用工团主义等歪理邪说腐蚀原住民思想的阴谋诡计。在近期的国会演讲中，佩利郑重承诺将彻底终结这些不公：联邦政府不仅会严格遵守与印第安部落的既有条约，在新的联邦体系下保障原住民的平等权利，还会与军团内部的原住民代表（比如兼具印第安联合会成员与军团成员身份的混血塞利茨族反犹活动家埃尔伍德·阿尔弗雷德·唐纳）合作，通过可靠渠道传达印第安人的诉求。"
 unionstate.5902.a:0 "这是必要之事"
 unionstate.5903.t:0 "向资本伸出援手"
 unionstate.5903.d:0 "奥丹尼尔最雄心勃勃的愿望之一就是把商界与他所代表的贫困农民和工人团结在一起，并在有关各方之间找到友好妥协的方法。到目前为止，奥丹尼尔试图与联盟国内外的大企业接触的努力都以失败告终。商人们对奥丹尼尔代表着威廉·詹宁斯·布赖恩和“战斗的鲍勃”老拉福莱特等人一样的民粹主义价值观的派系感到厌恶，奥丹尼尔必须努力让这些人感到舒适。为此，我们有一系列的讨好选择。我们可以进一步削减对企业的税收，鼓励他们投资大平原，特别是德克萨斯。然而，这样的削减可能不受其他党派的欢迎，减少我们的支持基础。我们也可以鼓励某些行业，比如金融业，建筑业或者石油业，希望增加他们对投资我国兴趣。这将更容易实现，但显然对我们的好处不大。我们该怎么办？"
 unionstate.5903.a:0 "开始减免企业税收"
 unionstate.5903.b:0 "鼓励金融投资"
 unionstate.5903.c:0 "促进基础设施建设投资"
 unionstate.5903.e:0 "投资石油总不会错"
 unionstate.5904.t:0 "奥丹尼尔的五点计划"
 unionstate.5904.d:0 "今天，奥丹尼尔向国会提交了他的经济复苏计划。他提出的五点计划包括4000万美元的新财政收入、废除人头税和死刑、任命一名国家审核的预算主管以及禁止赤字开支的修正案。虽然他最初对计划通过持乐观态度，但这遭到了至上党左翼以及国家进步党的一些反对，他们声称，这还远远不足以解决当前的危机。此外，虽然基督教党基本上支持这些建议，但杰拉尔德·K·史密斯和至上党右翼成员也反对这项计划，有的认为其过于自由，也有地认为这与休伊·朗的愿景完全背道而驰。因此，我们可能需要削减计划中的一些提案，但哪些提案应该被删除？"
 unionstate.5904.a:0 "删除禁止赤字开支的修正案"
 unionstate.5904.b:0 "删除增加新收入的争议提案"
 unionstate.5904.c:0 "删除有关死刑的条款"
 unionstate.5905.t:0 "养老金争议"
 unionstate.5905.d:0 "奥丹尼尔受他支持者拥护的最重要原因是他承诺要实行遍及全美的养老金制度。所以他一直在想法推动关于这个事情的立法，但是他对于美国政治的不熟悉导致他的想法很难得到推行。因为养老金系统如何运作的问题尚未得到解答，一些德克萨斯参议员也不支持他。作为德克萨斯州的领导人，他对这次挫折感到沮丧，但是他承诺他会继续尝试推进立法。他尝试着为内战后的美国制定一个计划，而不仅仅是养老金系统，该计划预备给退伍军人发放养老金，这可以维持国家的稳定，当然这不是他一个人想出来的计划，这是他和他的同僚们一同设想的，最终目的是为所有老年公民提供养老金。这项“依靠与残疾”法案正是奥丹尼尔推进他的理想所需要的。"
 unionstate.5905.a:0 "这群腐败的政治家！"
 unionstate.5905.b:0 "加大投入力度，务求推动法案通过"
 unionstate.5906.t:0 "依靠与残疾法案通过"
 unionstate.5906.d.pappy:0 "今天所发生的事是奥丹尼尔数年规划达到的巅峰。如今，奥丹尼尔提出的养老金计划以另一种形式在国会获得通过，尽管他曾大致放弃了建立养老金的希望，但如今高涨的人气表明了他的人民正在呼吁将养老金作为一种必要的救济形式。通过该法案最困难的部分是为其寻找资金来源，但奥丹尼尔借助自己的高人气，强制执行了对商业交易征收1.6%的税收，为这一计划提供了足够的资金。奥丹尼尔并不打算就此止步，事实上，他还希望能继续推动养老金发展。然而，只有时间能决定这一计划是否能圆满成功。"
 unionstate.5906.d.other:0 "今天，《依靠与残疾法案》被正式编入法律。该法案的成功通过标志着[TEX.GetLeader]的胜利，他曾竭力推动这一法案，以此表达对爱国的退伍军人的感恩，因为是他们使联盟的胜利成为可能。现在，退伍军人终于可以得到应得的救济。"
 unionstate.5906.a:0 "他们值得拥有更多的资产！"
 unionstate.5907.t:0 "偿还乡巴佬男孩"
 unionstate.5907.d:0 "是“乡巴佬男孩”乐队帮助奥丹尼尔老爹当选为联盟国的领导人。现在既然他的地位得到了保障，乐队成员们当然期望自己的忠诚能得到某种回报，而奥丹尼尔也很乐意。然而，我们必须决定如何去回报他们。我们可以授予他们一些政府权力，这意味着他们能在内阁中拥有职位。或者，我们可以让他们变得非常富有，并继续派遣他们全国巡回演出。我们是需要他们加入政府呢，还是周游全国呢？"
 unionstate.5907.a:0 "带他们回家！"
 unionstate.5907.b:0 "把他们派出去鼓舞士气！"
 unionstate.5908.t:0 "政府经济状况"
 unionstate.5908.d:0 "奥丹尼尔竞选时一大承诺是“把经济学带入政府”。他的承诺并不是说政府需要更关心经济问题，而是谴责德克萨斯、大平原乃至于整个国家的腐败政客把承诺为了人民的开支用于自己的利益，而人民却受苦受难的资金滥用。这种滥用最严重的事例之一就发生在上周，奥丹尼尔被告知，100万美元的孤儿院补贴资金被抽走，用于维持政党机器的运作，另一个事例则是本来用于购买新坦克的300万美元神秘地消失了。这样的情况并不少见，奥丹尼尔认为这种浪费性开支实在令人厌恶，代表着政府的效率低下，而且最糟糕的是，毫无道德。因此，为了让政府开支重回正轨，我们要先致力于……"
 unionstate.5908.a:0 "确保军队高效"
 unionstate.5908.b:0 "要求政客们遵守承诺"
 unionstate.5909.t:0 "新税法遭到反对"
 unionstate.5909.d:0 "从政治生涯之初，奥丹尼尔就希望为人民减税，提高他们的消费能力。然而，他的这一努力却遭到了来自左翼的强烈反对。主流的朗支持者抗议说，削减税收，特别是削减富人税收，将违背朗的理想。与此同时，国家进步党认为，减税只是一个借口，其实是为了吸引更多富有的投资者。奥丹尼尔没有否认这一指控，他高兴地承认，他希望德克萨斯乃至于整个国家得到更多的投资，他甚至反驳说，任何不希望引入投资的人，都和当初让我们陷入这场危机的政客一样糟糕。\n\n不过，抛开花言巧语不谈，很明显，奥丹尼尔将很难在不调整的情况下强行通过他理想中的新税法。如果我们削减人头税，我们应该会得到左派和平民的支持，而减少企业税可能会给我们的经济带来更多的投资。"
 unionstate.5909.a:0 "削减人头税！"
 unionstate.5909.b:0 "减轻企业税负！"
 unionstate.5910.t:0 "机会来了！"
 unionstate.5910.d:0 "战争结束后，奥丹尼尔的计划逐渐开始赢得美国人民的心，现在是比以往任何时候都更适合来推动奥丹尼尔五点计划最后一部分的时机。对包括奥丹尼尔自己在内的一些人来说，这剩下的一部分似乎已无足轻重，但奥丹尼尔的支持者却要求坚持到底。如果我们能推动这项立法在国会通过，奥丹尼尔将因重建国家和五点计划而被美国历史铭记。我们应该推进这项政策吗？"
 unionstate.5910.a:0 "是的，就这么做"
 unionstate.5910.b:0 "没必要……"
 unionstate.5911.t:0 "我们的国旗"
 unionstate.5911.d:0 "奥丹尼尔老爹掌握了这个国家，那么是时候换一面新国旗了。这里有许多受到德克萨斯文化影响的可能的旗帜。当然，我们也可以保留现在的国旗。那么我们该怎么办？"
 unionstate.5911.a:0 "黄星旗帜"
 unionstate.5911.b:0 "自由或死亡之旗"
 unionstate.5911.c:0 "放马过来之旗"
 unionstate.5911.e:0 "更传统的旗帜"
 unionstate.5911.f:0 "保留我们原有的旗帜"
 unionstate.5912.t:0 "罗伯特·欧文·霍华德的西部文学"
 unionstate.5912.d:0 "随着美国文化迎来复兴，蛮荒西部作为一种文学形式也随之复兴。其中一个有趣的例子就是德克萨斯作家罗伯特·欧文·霍华德刚刚出版的短篇故事集。他所编写的故事，如《熊溪的骄傲》或《手枪政治》，重点描述美国拓荒时期狂野边境的冒险生活。像《索诺拉小子》这样的牛仔枪手故事在这类题材中尤其流行，吸引了大批美国读者。然而，这并不意味着霍华德的西部文学只停留在狭隘的拓荒时期题材里。他在《艾尔·波拉克的到来》、《山鹰》或《匕首之国》中描绘了德克萨斯旅行家弗朗西斯·泽维尔·戈登的历险记。更甚至连恐怖故事，如《黑迦南》或《来自地狱的鸽子》，都是霍华德西部文学流派的一部分，即使这些故事显得有些离经叛道。因为霍华德的德克萨斯风味西部文学现在非常受欢迎，已经没有人去关注他曾试图创造的其他低俗英雄，比如无聊的野蛮人柯南或天真的清教徒所罗门·凯恩。"
 unionstate.5912.a:0 "罗伯特·欧文·霍华德将被尊称为西部文学之父"
 unionstate.5913.t:0 "工会内的种族隔离"
 unionstate.5913.d:0 "近来，一些工会的要求越发逾界。这些违背美国和基督教精神的提案，很可能是受到来自欧洲工团的移民煽动者的鼓动，这不仅是对美国价值观的威胁，而且对我们的经济体系也造成了损害。这些提案包括了废除工作场所的种族隔离，实现白人和有色人种工人工资的平等。当然，粗暴地解散工会更为有害，因为它会使工人容易遭受资本家的欺诈与政客的伤害。但早在1924年，工团主义者塞缪尔·冈珀斯就提出了一个有希望解决问题的办法。他声称“白种人绝不接受让自己的生活水平被黑人、华人、日本人或任何其他人种所危害……。如果有色人种继续试图摧毁白人所建立起来的社会，只会反过来产生比以往任何时候都更严重的种族仇恨。”出于这点，他提议建立只允许白种人加入的工会。阻止黑人加入工会可以加强工人罢工的力量，以此增加白人在政府中的影响力。有趣的是，极端分子威廉·Z·福斯特也曾说过类似的话。1920年的时候，他曾称黑人为“破坏罢工者的种族”。所以我们需要一锤定音了。是建立种族隔离的新工会，还是允许种族混合的工会运作？"
 unionstate.5913.a:0 "在工会中实行强制性种族隔离是正确的做法"
 unionstate.5913.b:0 "我们不会限制社团自由"
 unionstate.5914.t:0 "大学课程"
 unionstate.5914.d:0 "大学塑造了我们年轻一代的思维。因此，对于下一代来说，没有比大学更重要的机构了。不过，我国学术界决不能被反美的叛逆思想所感染。众所周知，社会科学、人类学和人文学科等领域的一些学者时常向学生传播有害思想。有些人甚至还在现代物理或生物科学等领域散播不良言论。简单来说，不受政府控制的大学会成为以学术自由为借口传播颠覆思想的多事之地。为了解决这个问题，奥丹尼尔计划在大学委员会中安插忠心的代表来控制教学内容。尽管有些人士批评这一计划，但包括科克·史蒂文森在内的其他人甚至鼓励采取更激进的行动，包括撤职违抗命令的教授。"
 unionstate.5914.a:0 "让我们将可信人士引入大学校园"
 unionstate.5914.b:0 "不，教学自由不可侵犯"
 unionstate.14050.t:0 "彭德格斯特的参议员"
 unionstate.14050.d:0 "彭德格斯特是个肮脏的政客。事实上，每个与他扯上关系的政客，不久就会有这样或那样的丑闻被汤姆的政治机器所掩埋。考虑到整个国家的所有政客在某种程度上都与彭德格斯特有关，这基本意味着政治中几乎没有任何诚信可言。然而，有一个人却是例外——一位政治素人，一位名叫哈里·杜鲁门的参议员。哈里成功地躲过了内战和彭德格斯特的崛起，几乎没有犯下任何玷污他清白形象的愚蠢之举，在公众看来，哈里是美国最后的诚实者。然而他们不知道的是，哈里·杜鲁门就像第11根手指一样依附在彭德格斯特身上。当人们纷纷向这名骗子鞠躬之时，彭德格斯特终于找到了这位素人的用武之地。他决定支持杜鲁门成为官方反对派。哈里可以尽情地咆哮、宣泄，抨击体制的腐败，并尽可能地利用民众的支持浪潮。与此同时，彭德格斯特也将花费大把资金让杜鲁门站到他这一边。这是一种共生关系。"
 unionstate.14050.a:0 "这是份他无法拒绝的提议"
 unionstate.14080.t:0 "针对彭德格斯特政治机器的成功调查"
 unionstate.14080.d:0 "当我们着手调查“老大”汤姆·彭德格斯特这只滑不溜手、老奸巨猾的政治动物时，起初很难找到什么指控他的罪名。在其否认了此前包括他与金冠苹果大亨和巨额农业财产继承人洛依德·C·史塔克明显操纵的选举存在关联，在投票站煽动枪击和殴打等选举暴力，与堪萨斯城黑帮老大查尔斯·文森特·卡罗尔有着明显关系等一系列指控后，我们终于找到了一个站得住的指控。\n\n我们以逃税的罪名逮捕了彭德格斯特这个病怏怏的废物，他现在有了一张前往监狱的单程票；在汤姆老板最近被诊断出结肠癌之后，这对他无疑是双重打击。随着他被捕的消息登上了全联盟国的头条，彭德格斯特的盟友和亲信已经开始纷纷转投阵营，试图不被彭德格斯特政治机器这艘沉船拖下水，甚至他自己的妻子也在公开申请离婚。堪萨斯城的国王已经沦为一个哭啼啼的孩子，王鱼和他忠诚的盟友最终实现了真正的正义，而他所留下的密苏里州权力真空，将由忠诚的朗派所填补，宣告着汤姆老大犯罪帝国的最终结局。"
 unionstate.14080.a:0 "逃税的人到底是要吐出来的"
 unionstate.30000.t:0 "草原行宫"
 unionstate.30000.d:0 "马兰的“草原行宫”建于他在20世纪20年代的财富高峰期，远在他成为总统前，这里是他的主要经营基地。这座地中海式建筑风格的宫殿被正式命名为马兰-巴黎公馆，坐落在俄克拉何马州庞卡市的郊区，在建造时，它是美国西南部最大的住宅之一——马兰的石油业务推动了这笔开支，当时他控制着世界十分之一的石油供应量。这座庄园仍然是一片令人敬畏的美丽建筑群，它一直是马兰政府的核心，总统基本在宫内的华丽办公室而不是在白宫或任何其他联邦机构建筑中完成他的大部分工作。瓦片屋顶，灰泥墙，大柱子和拱门，以及周围一望无际的花园，这座“宫殿”看起来更像托斯卡纳之家，而不是美国农村。\n\n尽管这座豪宅魅力四射，但马兰仍然会为民服务，他在这片土地上为当地青年开办了一所由圣菲利克斯修女会管理的私立学校，甚至还向公众开放他的庄园大门，举办马术活动和猎狐旅行，并在冲突时期向那些需要帮助的人开放，比如在第二次内战期间使用这座豪宅收容难民。有了像这样的现代城堡，当我们努力使联盟成为西方霸主之时，也许美利坚可以达到甚至超越旧世界的宏伟文化。"
 unionstate.30000.a:0 "一座适合王鱼继承人居住的宫殿"
 unionstate.30000.b:0 "那就让我们正式宣布吧！庞卡城将成为新的首都。"
 unionstate.30001.t:0 "马兰和他的妻子"
 unionstate.30001.d:0 "马兰曾是一位独一无二的青年，在安定下来并找到妻子前，他试图寻求创造自己的财富。在成为一名经验丰富的律师，并进入石油行业前，他最终与一位名叫玛丽·弗吉尼亚·柯林斯的费城名媛结婚，但在经济衰退耗尽了他的财产后，这对夫妇搬到了俄克拉何马州，以图东山再起。在那里，他们同意帮助弗吉尼亚的姐姐，收养了她的两个孩子莉迪和乔治，在马兰第二次努力赚取他的百万财富时，把他们送进了好学校。在俄克拉何马州生活了十年之后，弗吉尼亚最终死于肺炎，留下马兰成为鳏夫，但时间不长。两年后，他取消了对莉迪的收养资格，并在不久后迎娶了她——尽管她28岁，而他54岁——也尽管他从莉迪16岁起就把她当作养女进行抚养。\n\n虽然这样的安排并不少见，但他们的关系仍然是丑闻，就像前总统格罗弗·克利夫兰几十年前的丑闻一般。为了远离公众视线和争议，莉迪经常留在马兰位于庞卡市的豪华宅邸中，只在最重要的国家活动中出现，而马兰本人基本上对此事保持沉默，只要有机会就把话题转移到更为重要的事情之上。"
 unionstate.30001.a:0 "听起来像是格罗弗·克利夫兰的翻版。"
 unionstate.30002.t:0 "精英们的狺狺狂吠"
 unionstate.30002.d:0 "尽管他控制着世界十分之一的石油供应，尽管他白手起家获得了巨大的财富和政治生涯，尽管他孜孜不倦地致力于在可怕的内战灰烬上重建我们曾经伟大的联邦，马兰总统仍然有着不少批评者。这些政治和商业上长期对手们主要是他所唾骂的东部沿海精英，他们从未停止过对马兰的嘲笑，主要是围绕着这样一个事实：总统先后三次失去了自己的财富，然后东山再起，成为了这个国家的领袖。在1907年的大恐慌，1910年开始的掠夺性垄断撕裂其财富之时，甚至在大萧条期间，马兰的运气都有些糟糕，但每次都能赢回他的财富，并随着每次复苏，财富越积越多。\n\n尽管如此，像洛克菲勒和摩根这样的垄断者连同他们在国会的“有偿盟友”仍在不断地嘲笑我们的总统，但这一切很快就会结束。随着最新法案的通过，这些沿海精英的权力、影响力和财富将很快像马兰曾经那样凋落，但绝不会有所反弹，因为新的民主党将真正让美国成为一个为所有人提供机会的地方，而不仅仅是这些主导和毁坏这个伟大国家太久的精英大亨们。"
 unionstate.30002.a:0 "无需在意他们，这些人的巅峰已经接近尾声。"
 unionstate.30003.t:0 "走出王鱼时代"
 unionstate.30003.d:0 "虽然休伊·朗是一个巨人般的人物，受到数百万人的爱戴，但这位大众英雄不再主持大局，因为现在是马兰的时代。随着“王鱼”的离去，马兰已经着手对联盟国及其政治机构进行“去朗化”，使国家重新走向真正的民主，彻底摆脱这位建立了崭新美国且极富魅力的民粹主义强人。为了取代围绕王鱼产生的近乎个人崇拜，马兰和他的民主党人已经开始将我们的新总统定位为平民的新捍卫者。凭借我们的平等主义资本主义政策，小规模新政，以及马兰自身的财富和魅力，这位灵巧的石油大亨将有望成为这个重新打造的联盟新宠儿，在我们努力使美国再次实现繁荣和平等时，取代绝不会为人所遗忘的创始者休伊·朗。"
 unionstate.30003.a:0 "E·W·马兰，平民的新面孔"
 unionstate.30004.t:0 "新民主党的方向"
 unionstate.30004.d:0 "当我们在E·W·马兰总统的领导下，在这个恢复的联盟中重塑和改革民主党时，我们由不同自由派组成的联盟必须确定一个坚定的方向，因为我们必须洗清旧民主党这样的分裂分子给我们带来的坏名声。党内有两大阵营，他们争夺着对美国新中左阵线命运的控制权，尽管两者在经济和其他问题上看法基本一致，但我们的社会政策却大相径庭。所谓的先锋自由派主要由来自联邦腹地的政界人士组成，是这两派中较为进步的一派，他们拥护民权和社会改革的自由主义思想。他们的主要对手被戏称为“海岸”自由主义者——该名字的起因是先锋自由派将其视为太平洋国傀儡的蔑称——他们的社会观点要保守得多，像他们的对手一样拥护良好的劳工和工人关系，但反对全面的种族和社会经济平等。无论哪派获胜都将帮助马兰总统走上重建新联邦的道路，但只有一派能取得成功。那么究竟是哪一阵营呢？"
 unionstate.30004.a:0 "进步的“先驱”自由派获胜"
 unionstate.30004.b:0 "保守的“海岸”自由派挑起领导大旗"
 unionstate.30005.d:0 "今日，纽约城天刚蒙蒙亮，市民们便从睡梦中醒来，开启了稀松平常的又一天。工人们匆匆赶去工厂，纽约警局也启动了例行的巡逻，一切似乎都井然有序——当然，前提是哈得逊河上的交通没有突然出了些状况的话。接到报告的纽约警局立马前往现场调查堵塞的原因，结果竟发现河的对岸有一整支蓄势待发的军队。不过，这支军队可不是深陷内战泥潭中的某个阵营派来把大苹果收入囊中的，恰恰相反，其正是为躲避内战的冲突而来到不夜城寻求庇护的。菲利普·阿科斯塔·卡罗尔手下的这支部队是教宗本人亲自派来协助休伊·朗和联盟国的天主教廷民兵，也是为数不多依旧在战斗的联盟国残军之一，并且还是联盟国在东海岸的唯一一股力量，他们不远万里一路从巴尔的摩一路走来，就是想通过其长官与基督教阵线的关系来躲过战争的血腥杀戮。战前还是一介律师的卡罗尔曾在许多热门案件中为基督教阵线辩护，这其中就包括遭仇恨犯罪指控的莫洛伊主教，于是卡罗尔就想利用这层关系来寻求基督教阵线的庇护，以兑现自己同部下许下的承诺。\n\n通常情况下，一向待自己人不薄的基督教阵线肯定会爽快地答应这一请求，毕竟卡罗尔可是一位难能可贵的人物，但民兵后面跟着的一眼望不到头的天主教徒队伍却不得不让其思量再三。联盟国垮台后，教廷民兵就开始了漫漫长征路，其间，许多著名的天主教人物，如富尔顿·申神父、多萝西·戴、阿尔·史密斯、至高骑士马丁·卡莫迪等，都加入了北上的队伍，期望着能为美国的天主教徒找到一处栖身之地。这支队伍规模庞大，光是战斗人员就将近五千，平民更是一万起步，这其中还不乏一些信仰激进之人，因此如何处置他们着实是个大难题。\n\n基督教阵线中的新教一方认为纽约城内的天主教徒本来就已经够多了，再放这么多人进来势必会打破各派别之间的平衡，所以我们应该拒绝其请求，让其在敌人的重重包围中另寻高就。与之相反，阵线中的天主教一方则建议我们同意其请求，毕竟，为教廷还有那个唯一能为美国带来社会公义的政府卖命的有功之臣落得个无家可归的下场，于情于理都说不过去。双方相持不下之际，一向持温和立场的莫洛伊主教及其支持者提出了一种折中方案：我们可以为其提供庇护，但前提是他们要用工作来偿还——民兵将被编入纽约警局，负责皇后区法拉盛的秩序维持工作，而军官队伍和有资质的平民将加入我们自己的军官团，剩下的平民则同民兵一起加入到法拉盛的建设中来，自由发挥把这里改造成天主教与新教合作的典范。总之，在大军临门的当下，我们必须尽快做出决定，免得他们等不及直接用武力夺下纽约城。"
 unionstate.30005.t:0 "意外的旧友来访"
 unionstate.30005.a:0 "赶走他们，纽约没有罗马天主教的容身之地！"
 unionstate.30005.b:0 "给予庇护，纽约欢迎所有追随耶稣基督之人！"
 unionstate.30005.c:0 "给予庇护，但要用工作来换！"
 unionstate.30006.t:0 "“卡其军”承诺支持王鱼"
 unionstate.30006.d:0 "自封为所谓的“卡其军”领袖的怪咖亚瑟·J·史密斯原先是名威名赫赫的雇佣兵，其事迹多次见诸报端，后来在与前战友、效力于联合工团的沃尔特·W·沃特斯决裂后建立了卡其衫准军事部队。今天，他派来了一支代表团前来与我们接洽，我们则安排杰拉尔德·L·K·史密斯与他会面。史密斯先是说从被工团分子占据的费城到我们在新奥尔良的临时首都，到处都能看到他的人马端掉国民警卫队据点、英勇抗击工团民兵的身影，随后话锋一转，猛夸王鱼“一柱擎天”般的男子气概，最后承诺如果能得到资金和装备支持，那他的卡其军团定将为王鱼南征北战，万死不辞。史密斯的提议已被转达给了朗总统，至于最后是什么个结果，就要看王鱼的决定了。"
 unionstate.30006.a:0 "我们心怀感激地接受史密斯的帮助！"
 unionstate.30006.b:0 "史密斯和他的那帮杂碎只会添麻烦"
 unionstate.30007.t:0 "只有他能看到的光芒"
 unionstate.30007.d:0 "在基督教党的引领下、在上帝的庇佑下，我们的首善之国摆脱了激进主义的威胁，我们虔敬的联邦也向着去除了国会恶政和工团恐惧的直接民主之圣光前行，而这全部得益于威廉·达德利·佩利总统的身体力行，不过，今天我们要说的是佩利总统私下里沉醉的小小奇异世界。当然了，佩利总统的公开演讲和布道都是再正常不过的敬神之言，但佩利的心腹们和真正的朋友（或者说敌人）却知道一个截然不同的事实。佩利自称受到了上帝和耶稣本人的神启，见识到了“超次元”，明白了宇宙及其不同位面的本质，并准备将神智学、灵性论、通灵论、玫瑰十字论、金字塔主义、右翼洛里奇主义等思想纳入自己不断发展、包罗万象的精神神学之中。佩利身边理智尚存的政府和狂热的追随者自是对此惊恐不已，拼命遮掩，不愿让这一“魂灵禁术”扩散到公众之中。佩利总统平时不是闭门叫嚷什么“暗黑幽魂”（他对于非裔美国人、犹太人、共党等恶势力的称呼）的犹太工团主义全球阴谋，就是向他人炫耀自己在不明飞行物领域的研究发现以及对形而上学和形体投射的渊博知识，而且每到一个房间，就会迫不及待地想向他人展示自己的漂浮和穿墙能力。佩利还直接把自己的想法灌输给了银色军团，让这支准军事部队成为了秘传基督教民兵，既负责执行基督教党的和平人道主义理念，又坚决拥护他们首长的阴谋论与神秘学思想。那么，是让佩利及其狂信徒进行传播那些异想天开的想法，还是张大眼睛，迎接佩利的后变之主的降临呢？"
 unionstate.30007.a:0 "严格限制总统那些离奇的想法"
 unionstate.30007.b:0 "我的地盘我说了算！"
 unionstate.30008.t:0 "基督教党党纲的未来"
 unionstate.30008.d:0 "佩利总统和基督教党一直视国会为道德败坏、贪污腐败、萧条瘫痪、罪恶孽障的温床，并已着手边缘化、规制化这一垂死的失败立法机构，让它的凋零成为美国民主的养分。不过，还未待旧联邦那满目疮痍的土地恢复过来，叛乱、种族对立与激进暴力就已席卷全国，有鉴于此，佩利身边的一些人（代表人物就是佩利的左右手亨利·艾伦和银色军团中的极端基督教文明守护者）就提出，我们何不利用整改国会的宝贵机会直接撤下联邦内的一切民主机制，完成美利坚人世天堂的神授使命呢？\n\n虽然艾伦和银色军团愿意动用包括暴力在内的一切手段腐蚀选举程序，为我们接连不断的成功和无与伦比的统治力铺平道路，但基督教党内温和的多数人显然不同意这群疯子准军事部队的想法，他们坚决支持民主自由。既然如此，那我们就需拍板定案，我们是要继续佩利的原定计划，追随上帝建设基督教直接民主的乌托邦，还是抛弃某些原则和所谓的美利坚自由，让佩利的联邦能够不受麻木群众的影响，紧跟总统先知的意志呢？"
 unionstate.30008.a:0 "坚持联邦的最初设想"
 unionstate.30008.b:0 "理想再伟大，不符合现实也不行"
 unionstate.30009.t:0 "阿布萨罗卡问题"
 unionstate.30009.d:0 "正当我们在这第二次大重建时期专心处理二次内战留下的烂摊子之时，一个古老的想法重新浮出了水面：阿布萨罗卡州提案。二次内战之前，激进主义思想席卷大平原地带，许多家庭流离失所，许多社区毁于一旦，而华府的联邦政府对此却不为所动，这让当地的民众彻底寒了心，感觉自己成了国家的弃儿。正是在这种背景下，前街道办主任、现政治家兼民兵队长A·R·斯威卡德发起了阿布萨罗卡运动，要求划出蒙大拿州南部、怀俄明州北部和南达科他州西部的土地组成一个新的联邦州——阿布萨罗卡州。内战期间，斯威卡德甚至考虑过借着地处联盟国-联邦政府交界处的地理优势带着他的民兵彻底脱离美国独立，不过，休伊·朗软硬兼施，将他们拉入了自己的大联盟，让阿布萨罗卡人投入了美国梦的怀抱之中，站在了他那一边。自那之后，斯威卡德和阿布萨罗卡人就死心塌地地拥护着王鱼的事业，而现在既然枪火已熄，也许是时候回报这种忠诚了。\n\n没收站在联邦政府一边的蒙大拿和怀俄明二州的部分土地用来在联盟体制内建立小一号的阿布萨罗卡政府既能褒奖忠心，也能惩治叛徒，一箭而双雕，并且包括斯威卡德在内的大多数阿布萨罗卡人也赞同这一计划。只不过，部分激进的强硬派坚决不肯放弃南达科他的土地，而顺了他们的意又会惹到南达科他苏族保留地的朗盟友（如出身罗斯巴德的本·赖费尔），进而招致更多的反对之声。那么，我们是要让阿布萨罗卡之梦以某种方式落地呢，还是把这些叫花子盟友打发走呢？"
 unionstate.30009.a:0 "建立只包含蒙大拿和怀俄明两州叛变领地在内的阿布萨罗卡"
 unionstate.30009.b:0 "一比一还原阿布萨罗卡计划！"
 unionstate.30009.c:0 "阿布萨罗卡人必须要学着在联盟体系内行事"
 unionstate.30010.t:0 "“王鱼”的亲法情结"
 unionstate.30010.d:0 "尽管其本人并非路易斯安那法裔文化团体的成员——而是出身于该州少数却顽强的社会主义者群体（这批内战前由北方迁入的移民构成了该州仅有的亲联邦派），但休伊·朗始终对法语区及美国文化中的法兰西元素怀有深切的迷恋与同情。他素来崇拜拿破仑·波拿巴的言行思想，甚至还在节日化装会上装扮成这位将军过，他还对对乡下的卡津人与克里奥尔人的贫苦处境感同身受，堪称沼泽地的荣誉之子。近期，他推动废除了长期压迫卡津人的语言文化禁令，使法语方言克里奥尔语从濒危边缘开始复苏。朗将延续拉法耶特与波拿巴的精神遗产，既缓解这些群体的困境，又颂扬法美悠久的文化纽带，甚至不顾联盟国标榜的孤立主义原则，公开向流亡阿尔及利亚的法国政府示好，考虑为重温美国最早的真正盟约而加入协约国。这番谋划将引向何方，犹未可知。"
 unionstate.30010.a:0 "阿卡迪亚的真正继承人"
 unionstate.30010.b:0 "再次使法美关系正式化"
 unionstate.30010.c:0 "向波拿巴主义更进一步！"
 unionstate.30011.t:0 "汉弗莱的援助之手"
 unionstate.30011.d:0 "进步派大本营明尼苏达新近崛起了一位政坛新星——休伯特·H·汉弗莱，其虽因体检未达标无缘军旅，却在联盟国政府战时动员与劳动力调配中展现出了卓越才干。这位政坛新锐借农民劳工党影响力日渐式微之机，当选明尼阿波利斯市长，任内致力于维护民权，在战火纷飞的美国捍卫自由主义价值。他主导农民劳工党并入国家进步同盟，同时遏制党内激进势力坐大。汉弗莱虽在明尼苏达根基日益深厚，但其雄心可远不止于区区市长。汉弗莱对民权的坚定支持或可瓦解长期坚守朗派阵营的黑人选票，为我党在全国开疆拓土。如今，这位“快乐战士”已将取得州长乃至总统之位纳入日程，许多进步人士视其为党的未来，而拉福莱特家族的旧部也必将誓死维护“战斗鲍勃”的政治遗产。"
 unionstate.30011.a:0 "到底是谁吸收了谁？别分不清大小王！"
 unionstate.30011.b:0 "给这位后起之秀一个内阁职位"
 unionstate.30011.c:0 "汉弗莱的支持可以大大拓展我们的票仓！"
 unionstate.59033.t:0 "刺客袭击佩利！"
 unionstate.59033.d:0 "威廉·达德利·佩利总统今天在首都发表演讲时，遭到一名激进的左翼狂徒刺杀，此人试图用左轮手枪杀死我们的领袖。人群立刻陷入了狂乱，银色军团军警很快地在佩利倒地之时迅速将其逮捕。"
 unionstate.59033.a:0 "刺客被逮捕，佩利毫发无伤！"
 unionstate.59033.b:0 "佩利受了致命伤，倒地血流不止"
 unionstate.59034.t:0 "大统领之死"
 unionstate.59034.d:0 "佩利死后，基督教党内几位有名望的大佬纷纷站出来竞争党的领导权。温和派阵营的代表是副总统威拉德·沃思·坎普，他既同意维持前领袖定下的改革方略，也打算清除银色军团中的激进分子。银色军团这边激进派的代表则是亨利·D·艾伦，他想要对前总统一些充满争议的政策（例如监护制度、犹太人隔离）进行大改。竞选最高统领的其他人选还有库格林神父的弟子、在东北领导“基督教阵线”的银色军团盟友乔·麦克威廉斯。最后则是本次的黑马，佩利密教灵性论流派的传承人盖伊·巴拉德和埃德娜·安妮·巴拉德夫妇。经过多方考量，银色军团和基督教党的高层决定……"
 unionstate.59034.d.nonyc:0 "佩利死后，基督教党内几位有名望的大佬纷纷站出来竞争党的领导权。温和派阵营的代表是副总统威拉德·沃思·坎普，他既同意维持前领袖定下的改革方略，也打算清除银色军团中的激进分子。银色军团这边激进派的代表则是亨利·D·艾伦，他想要对前总统一些充满争议的政策（例如监护制度、犹太人隔离）进行大改。最后则是本次的黑马，佩利密教灵性论流派的传承人盖伊·巴拉德和埃德娜·安妮·巴拉德夫妇。经过多方考量，银色军团和基督教党的高层决定……"
 unionstate.59034.a:0 "……由坎普和温和派维持原有线路！"
 unionstate.59034.b:0 "……由艾伦和激进派保护首长的愿景！"
 unionstate.59034.e:0 "……由黑马选手麦克威廉斯重塑美国道德风貌！"
 unionstate.59034.f:0 "……佩利密教的接班人——巴拉德夫妇将涤荡我等之灵魂！"
 unionstate.59035.t:0 "巴拉德夫妇治下的佩利密教流派"
 unionstate.59035.d:0 "威廉·达德利·佩利首长离世后，“我是”运动的创始人盖伊·沃伦·巴拉德、埃德娜·安妮·惠勒·巴拉德夫妇共同继承了其遗产，肩负起了带领联邦步入新时代的使命。巴拉德夫妇将神智学思想异化为了自己独特的神秘学运动，并向传统公认的扬升大师之列增添了新的成员：盖伊·巴拉德称自己与狮心王理查、乔治·华盛顿同为圣人戈弗雷的转世，而自己的妻子则是圣女洛特丝的托生，其前世有圣女贞德、英格兰的伊丽莎白一世，以及佩利思想之基石——“富兰克林预言”，其声称欧洲的犹太人借黄金圈骑士团之手，指使约翰·威尔克斯·布思刺杀了林肯总统，目的就是为了报复富兰克林遭雪藏的反犹演说，这篇演说向美国警示了犹太移民及其所带来的后果——的中心人物本杰明·富兰克林。此外，巴拉德还自称在1930年芒特沙斯塔的远足中邂逅了圣日耳曼伯爵的投胎转世，后者特任夫妻两人加上儿子埃多纳·埃罗斯·“唐纳德”·巴拉德为圣日耳曼伯爵的唯一“钦差”，受此影响，巴拉德一家成立了“我是”运动，这一运动最初成员多与银色军团有着重叠，而后逐渐发展为了组成佩利复杂思想的其中一环——神智学的论点基础。\n\n如今，信奉融合了神智学与佩利密教理论的魔改激进新教思想的巴拉德夫妇，与神秘论者、神秘学家同僚哈维·斯潘塞·刘易斯、保罗·福斯特·凯斯（两人都与佩利一样，是玫瑰十字会的成员，也在神智学之外的灵性论、神秘学等形而上学领域同佩利很合拍，但同时，两人也缺乏金字塔、不明飞行物学、“魂灵禁术”、“暗黑幽灵”等佩利其它思想的学识，只是靠着一颗忠于佩利的心才一直坚持下来的）一起领导着基督教党内的边缘势力。然而，这一密教联盟的思想理论飘忽不定，因而我们必须下定决心，为基督教党制定出一套前进的纲领，并对佩利的古怪信仰做出取舍。"
 unionstate.59035.a:0 "坚持佩利思想不动摇——我们永远忠于首长，至死不渝"
 unionstate.59035.b:0 "倾向于巴拉德夫妇的独特神智学派"
 unionstate.59035.c:0 "倾向于刘易斯和凯斯的灵性论、玫瑰十字论"
 unionstate.59035.e:0 "……以密教联盟的形式维持组织的多元化"
 unionstate.59036.t:0 "巴拉德夫妇治下的佩利联邦"
 unionstate.59036.d:0 "随着盖伊·巴拉德和埃德娜·安妮·巴拉德与他们的那一帮佩利主义密教学家（如哈维·斯潘塞·刘易斯、保罗·福斯特·凯斯和威尔伯·格伦·沃利瓦等）的合作愈加深入，许多人开始质疑这些新领导人能否不辱佩利之名，领导好基督教党和更广泛的联邦，甚至有人认为他们已经偏离了佩利的既定路线。那么，巴拉德夫妇及其“我是”运动是应该公开支持佩利原来的党派路线，承诺不偏离已故首长的智慧和预言，还是只在口头上承袭佩利的遗产，转而拥抱属于自己的全新身份，在把联邦改造成符合自己需求之相貌的同时，辛勤地建设一个建立在神学图腾以及他们视若珍宝的扬升大师与圣日耳曼笔下那多变、柔和而梦幻的美学基础之上的新美国呢？又或者选择备受争议的第三条路，在基督教党和联邦的旧美国以及扬升大师麾下的“我是”运动间寻找一个平衡点，即去除星条旗上暗含工团之意的红色，代之以代表神智学神祇之智慧的圣黄色，不过这样做既会败坏循规蹈矩的寻常国民的好感，因为在他们看来这是对国父们所创立的那个失败国家的大不敬，也无法得到任何一方的全力支持。那么，我们要如何做呢？"
 unionstate.59036.a:0 "拥抱圣日耳曼之下的巴拉德新美学"
 unionstate.59036.b:0 "无论有何分歧，我们都仍是佩利联邦的一部分"
 unionstate.59036.c:0 "在旧美国和扬升大师的圣光间找出一条两全其美的中间道路"


cathdeath.1.t:0 "摄政王之死"
 cathdeath.1.d:0 "在与流感作了近两个月的斗争之后，瓜达卢佩圣母帝国之父、美利坚的使徒、摄政王菲利普·阿科斯塔·卡罗尔去世了。临时摄政王富尔顿·申主教，这位已故摄政王最信任的亲信和见证其去世的临终忏悔对象，计划在未来几天举行一场盛大的葬礼弥撒。对美国人民的安慰与哀悼之词已经从世界各地涌来，特别是来自教宗本人的，他“对教会最忠实的孩子的去世感到非常悲痛”。据称，教廷有关将菲利普·卡罗尔封圣的商讨已经开始。\n\n然而往大了说，摄政王的死来得极其不是时候。前不久才征服了加拿大和墨西哥的帝国似乎迈向了分裂。美国本土的人民（尽管现在大多数已皈依天主教）越来越厌倦了独裁统治以及宗教裁判所的监管。前加拿大地区，圣公会信徒的抗议活动规模越发庞大，加拿大民众对此的支持也越来越高，一些加拿大人甚至组成游击民兵反对我们的统治。前墨西哥地区，本来维系国家团结的补丁已被撕下，地方秩序逐渐沦丧。虽然亲天主教的墨西哥人民大多支持我们，但当地陷入的近乎完全的无政府状态导致民众的支持几乎毫无意义。\n\n如果这还不够糟的话，摄政王死后，神圣美利坚联盟的大帐篷性质一览无余：联盟中最受欢迎或最有权势的人物领导着不同政治团体，每个派别都开始宣称自己才是卡罗尔的继业者。除非我们尽快解决继承问题，否则帝国很可能会像它迅猛崛起时那样飞速崩溃。"
 cathdeath.1.a:0 "国家哀悼"
 cathdeath.2.t:0 "第二届神圣美利坚联盟国会"
 cathdeath.2.d:0 "对于这个国家虔诚的天主教信徒来说，圣玛丽城是座人头攒动的圣城，但今天更是如此，街道上满是繁忙的活动和交通，从记者到实地考察的学生，所有人都聚集在一起想要观看第二届神圣美利坚联盟国会的情况。从宗教裁判所的代表和旗下的安保部队，到温和派和改革派的政治家，都渴望自己的派系在国会中获胜。人群正通过军队和宗教裁判所设立的严格的安全检查站缓慢地流动，国会也按着计划顺利进行。记者和支持他们所喜欢的派系的人群都急切地等待着各自代表的到来，而哥伦布骑士团一直在国会大厦的台阶上站岗。很快，一位新的摄政王就会在基督王登基之地诞生，承主蒙恩。"
 cathdeath.2.a:0 "祝愿万事如意"
 cathdeath.3.t:0 "神圣美利坚联盟国会：经济问题辩论"
 cathdeath.3.d:0 "神圣美利坚联盟国会是北美历史上意识形态最复杂的团体，每一位议员都有自己的意识形态与政治诉求。这种混乱在关于经济政策的辩论时展现的最为明显，许多新闻记者们都在转来转去报道辩论的内容，而令人困惑的事情出现了，政治立场相似的政客们聚集在一起形成了各自的联盟阵线以代表他们共同的诉求。改革派希望废除分产主义经济而更换为他们更倾向的经济形式。温和派希望保持现状，继续执行菲利普的旧系统。而强硬派希望将经济更加集中化，有些人甚至希望建立一种“美式封建主义”。"
 cathdeath.3.a:0 "改革派更受欢迎"
 cathdeath.3.b:0 "温和派守住了权力"
 cathdeath.3.c:0 "强硬派迈向胜利"
 cathdeath.4.t:0 "神圣美利坚联盟国会：政府问题辩论"
 cathdeath.4.d:0 "虽然经济事务的辩论已经非常激烈，但无论是记者还是国会中的政客都没料想到政府事务辩论的激烈度能更上一层。辩论第甫一开始，第一位发言者，一位来自改革派的妇女走上讲台，她刚刚才讲了一分钟，据信来自宗教裁判所的强硬派代表，就向着台上扔出了鞋子。这只鞋并未命中，却引起了轩然大波，最终这位女代表被请出了国会。不管怎样，改革派正在倡导一场分权运动，其中一部分支持旧的联邦制模式，而另一些则寻求一种近乎无政府主义的治理方式。温和派希望回归旧联盟国那样值得信任的体系，至于民粹主义的浓度则取决于派系内部的掌权者。强硬派则寻求一个集权的强力政府，这样他们就可以充分将权力集中在贵族骑士或宗教裁判所对异教徒的永无止境的追捕之中。"
 cathdeath.4.a:0 "分权化赢得青睐"
 cathdeath.4.b:0 "回归常态得到温和派的巩固"
 cathdeath.4.c:0 "更为强力，强硬的政府才是出路"
 cathdeath.5.t:0 "神圣美利坚联盟国会：裁判所问题辩论"
 cathdeath.5.d:0 "辩论已推行至颇有争议的宗教裁判所问题上。帝国的许多公民都生活在对裁判官的恐惧中，这是有充分理由的，他们对那些被认定犯有异端行为或怀抱异端思想的嫌犯采取的严厉而又残酷的惩罚手段可谓是臭名昭著。因此，改革派主张废除宗教裁判这种他们认为过时、不道德和不必要的做法。而温和派则主张限制宗教裁判所的过激行为，仅仅保留对信仰的基本测试。与其他提议形成鲜明对比的是，强硬派要求继续加强宗教裁判所并消除目前对其权力的限制，这令大多数党内同僚感到恐惧。事实上，这将使裁判官有权对任何他们看不顺眼的对象施以惩罚，但强硬派仍然坚持认为，这是将帝国提纯为更适合以圣母之名命名的真正的神圣国家的必要步骤。现在，国会屏息以待，想看看谁能得逞。"
 cathdeath.5.a:0 "不会再有什么裁判所了！"
 cathdeath.5.b:0 "信仰测试应该更为温和，更加公平"
 cathdeath.5.c:0 "你们若不悔改，那么唯有灭亡"
 cathdeath.6.t:0 "神圣美利坚联盟国会：改革派胜利"
 cathdeath.6.d:0 "国会大厦外，人群屏住了呼吸，似乎要花很久才能宣布的消息终于传了出来。改革派不知何故赢得了国会多数席位！这似乎是那些在内战中反对联盟国系统的人士的一次重大胜利，即使实际上还算不上完全控制，这也算设法确保了他们的基础。至少现在是这样。然而，改革派还远远没有上下一心，因为派系之间仍然分裂为阿尔·史密斯的支持天主教资本主义的联邦主义者和多萝西·戴的无政府主义分产主义者以及温和分产主义改革者与芝加哥主教伯纳德·希尔。谁将成为改革派的掌权者？"
 cathdeath.6.a:0 "戴的无政府主义在今日取胜！"
 cathdeath.6.c:0 "希尔的温和派分产主义者获胜了！"
 cathdeath.7.t:0 "神圣美利坚联盟国会：温和派胜利"
 cathdeath.7.d:0 "圣玛丽城似乎陷入了冻结，因为外面的人群早就降下了国家的旗帜，坐在那里，互相安慰着彼此自己，等待着结果的宣布。很快，一名随军牧师向着国会大厦外走来，向外面的人群大声喊道：“温和派获胜了！”。随着消息的传播，支持着卡罗尔古老事业的热心人群欢呼起来，然而在国会大厦内，还有最后一次投票。这场投票将决定究竟新的掌权者是被认为肯定会接替卡罗尔的富尔顿·申主教，还是愿为自己的民粹主义事业掀起一场言论风暴的民粹主义传教士查尔斯·库格林。一票，一票，计数持续进行着。"
 cathdeath.7.a:0 "富尔顿·申赢了，高歌吧，唱诗班！"
 cathdeath.7.b:0 "库格林赢了：美利坚至上回来了！"
 cathdeath.8.t:0 "神圣美利坚联盟国会：强硬派胜利"
 cathdeath.8.d:0 "在一个奇怪的刮风天，圣玛丽城，人们在外面等待着，宗教法庭的安全部队聚集在他们检查站的收音机周围，听着里面的内容。突然，收音机里面传出了一声响亮的欢呼，宗教法庭的人也开始欢呼并互相碰杯庆祝。在国会大厦的台阶上，哥伦布骑士团的老成员们也开始互相拍手欢呼。无需多言，强硬派获胜了。宗教法庭现在是美利坚无可置疑的统治者。但还要决出最后的统治者，是宗教法庭中由费尼领导的激进天主教徒将领导美国，还是举着卡莫迪的盾徽与旗帜，拥护封建主义的哥伦布骑士团？"
 cathdeath.8.a:0 "费尼站上顶端"
 cathdeath.8.b:0 "卡莫迪夺取权力！"
 cathdeath.9.t:0 "神圣美利坚联盟国会：陷入僵局"
 cathdeath.9.d:0 "国会讨论…… 并没有给出一个结果，圣玛丽城内一片寂静。拥护各个派系的人开始离开回到自己的交通工具上，而警方开始报告各个组织的拥护者之间开始发生暴力事件。军队迅速回到了城外的兵营与戒严的检查站。当结果宣布了之后，在农村地区，拥护各党的团体的活动更加大胆了，他们开始在光天化日下游行。而在国会大厅内，愿意组成联合政府的议员们在争分夺秒的进行协议谈判。"
 cathdeath.9.a:0 "这下不妙了"
 cathdeath.10.t:0 "圣玛丽城的混乱"
 cathdeath.10.d:0 "僵局仍在持续，混乱也在继续，尤以国会大厦为甚。随着大批人逃离城市，帮派与准军事组织在城市的贫民窟交火，情况开始迅速恶化，这个国家正处于崩溃边缘。正规军重新进入城市，他们之前逃回军营的行为被证明并非是崩溃逃跑，而是整顿组织以待将来。军队指挥官希望让小约瑟夫·P·肯尼迪就任摄政王，看来军人还是单纯的，他们只是希望恢复这个国家的秩序。随着前线记者开始向外界传递消息，宗教法庭的强硬分子开始向任何不忠于自己的平民开火，改革派和温和派的人员正在寻找对方以将对方处以私刑，而军队则穿过这些被各种意识形态感染的组织，鲁莽的向城市中心推进。尚未被混乱隔离与逃跑的国会议员们正在尝试敲定一项紧急协议。前线记者正在确认协议的内容是什么？"
 cathdeath.10.a:0 "约瑟夫·肯尼迪宣誓就职摄政王！"
 cathdeath.10.b:0 "国会达成一致，在联合政府之下建立一个永恒的摄政议会！"
 cathdeath.10.c:0 "混乱席卷美国！"
 cathdeath.11.t:0 "美利坚的灭亡"
 cathdeath.11.d:0 "随着神圣美利坚联盟国会的瓦解，我们完全失去了对国家机构的控制。议员们四处奔逃，或者被本应保护他们的骑士杀害，而军队则因为意识形态的问题抛弃了我们。与国民警卫队的通讯中断，军火库被突袭，领导人被同僚攻击。尽管美国其他地方一片混乱，华盛顿却出奇的安静……"
 cathdeath.11.a:0 "我们再也不复当年荣光……"
 cathdeath.12.t:0 "伦敦之旅"
 cathdeath.12.d:0 "帝国成功地收复了我们的王与生俱来的权利，那就是被混乱占据的不列颠群岛。伦敦，地球上最强大国家的前首都，现在只剩下燃烧的废墟，我们的征服之举以及无休止的骚乱吞没了这座城市。为了帮助解决重建问题，减轻臣民的忧虑，詹姆斯三世决定亲自访问伦敦，这让摄政王卡罗尔非常不满，但陛下下定决心，第一次真正行使了自己可以反对卡罗尔的权力，制定了飞往伦敦的计划。尽管摄政王卡罗尔耿耿于怀，但他还是建议詹姆斯要大力加强安保，因为密谋刺杀国王的传闻依然流传开来……"
 cathdeath.12.a:0 "别说了！人民想要亲眼见证合法国王，而不是隔着一层屏幕！"
 cathdeath.12.b:0 "卡罗尔从没对我说过谎，而且有备才无患……"
 cathdeath.13.t:0 "国王遇刺！"
 cathdeath.13.d:0 "看来有关刺杀国王的谣言是真的。抵达伦敦后，詹姆斯三世在威斯敏斯特宫的废墟前发表演讲，此时一名枪手突然朝他的头部开枪，国王当场死亡。枪手本人也在抵抗不久被击杀。由于国王的逝世，必须有人继承王位，然而他的女儿玛莉亚·德·罗萨里奥·卡耶塔娜·菲茨·詹姆斯·斯图亚特·希尔瓦，或者简称玛丽，对自己是否适合登上王位有疑问。\n\n我们所等候的这位美丽女王，虽然无疑是帝国王位的合法继承人，但仍然只是个孩子。虽然她确实已年过18，但过于稚嫩，缺乏经验可能会给国家造成灾难性的后果。因此，一些人认为时机还不成熟，不可在世界仍处于乱局之中时筹办加冕，眼下唯一的出路便是组建摄政议会。当然，我们将不得不决定在未来如何处理君主制，但至少在好几年内，我们将能够自行权柄。最后一如既往，一切交给摄政王卡罗尔决定……"
 cathdeath.13.a:0 "玛丽二世万岁！"
 cathdeath.13.b:0 "摄政议会是目前的唯一出路"
 cathdeath.14.t:0 "詹姆斯三世躲过刺杀！"
 cathdeath.14.d:0 "看来有关刺杀国王的谣言是真的！抵达伦敦后，詹姆斯三世在威斯敏斯特宫的废墟前发表演讲，此时一名枪手突然走向讲台想要朝国王的头部开枪！谢天谢地，哥伦布骑士团的特工们在他一枪未发之前就将其格杀当场！在这起事件之后，詹姆斯三世立刻同意返回华盛顿。尽管他还要去访问一下苏格兰高地，在那里勇敢的詹姆斯党人曾奋起反抗新教威胁，为复辟斯图亚特王朝而奋斗。摄政王卡罗尔已经开始为国王的苏格兰之行以及之后的安全回归做准备。"
 cathdeath.14.a:0 "真是大幸！"
 cathdeath.15.t:0 "新美国梦的黎明"
 cathdeath.15.d:0 "随着摄政王卡罗尔去世嫌弃的政治乱流逐渐平息，这片美丽的土地上升起了新的曙光。而黎明的先驱正是[TEX.GetLeader]这位神圣美利坚帝国的新任摄政王。摄政王以同时从事宗教界和社会主义界两方的工作而闻名，是帝国最自由、最亲左的宗教人士。在她的指引下，美国这片应许之地将受到天主教社会主义和社群主义之光的祝福。尽管国内许多人不信任摄政王的左派观点以及与世界产业工人联盟等组织的联系，但没有人能否认摄政王为从困境中挽救受压迫的贫困人口而怀揣的不屈不挠的决心。在神美联盟其他改革派人士的支持下，[TEX.GetLeader]摄政王将把这个饱受战争蹂躏的国家变成真正光芒万丈，繁荣幸福的山巅之城。"
 cathdeath.15.a:0 "没人有权瘫坐在地，沉溺无望，因为我们还有如此之多的事业要去完成"
 cathdeath.16.t:0 "改革派美国的一景"
 cathdeath.16.d:0 "随着摄政王的新立法和改革一一落实生效，[TEX.GetLeader]对美国的愿景已经慢慢开始成形。在社会主义理想和天主教信仰的平衡与融合中，[TEX.GetLeader]的理想已经为美国人民结出了善果。虔诚的工人牧师在自己工时轻松的轮班结束后参与布道；基于天主教社会主义，免费提供食品、服装的银行以及其他慈善机构，在全国各地树立起来，许多民众能从国家处获得直接的补贴；少数民族和妇女的权利得到了扩大，社会福利制度得到了极大的发展；一切都来自于摄政王[TEX.GetLeader]和神圣美利坚联盟的领导下。尽管政府中仍有许多保守派成员，但他们对新摄政王的顽固态度已经开始软化，哪怕只是一点点，因为她的政策一次又一次地证明了其有效性。在这种民主社群主义、社会主义和天主教信仰的奇怪结合中，美国真正建立起了独特的政府机构，并似乎真正的为大多数公民服务。虽然还远远不够完美，摄政王的新政权已经把我们的国家完全从战争、饥荒和内乱的恐怖中挽救回来。这种成功是否能继续下去，都取决于她和她的盟友们。"
 cathdeath.16.a:0 "我们深知何为长久的孤独，而我们发现唯一的解决方法在于社区之中"
 cathdeath.17.t:0 "史密斯的民主抗争"
 cathdeath.17.d:0 "尽管卡罗尔摄政王之死留下的伤痕仍残留在人民的心中，但美利坚不能坐以待毙。为此，我们终于选出了一位新的继任者来接替殉难的领导人，而这位新的继任者正是阿尔·史密斯。史密斯长期以来以其信仰虔诚、对宗教自由的坚持和对民主传统的严格遵守而闻名。与神美联盟中的其他改革派成员相比，史密斯希望在美国重振真正的联邦制民主，一部分地回归到第二次美国内战结束后在坟墓中腐朽的美国旧体制。尽管他的联邦制计划令联盟内许多人担忧，尤其是更为保守或狂热的成员，但史密斯承诺将完全坚持美国精神，强调不会带领人民进入黑暗和不确定的未来，相反，人民将迎来的是温暖而熟悉的前路，自我们的国家在近两个世纪前建立以来，就一直在等待着美国人民的天命。"
 cathdeath.17.a:0 "美国人民再也不需要带伞了，因为他们将走在永远的晴天"
 cathdeath.18.t:0 "天主教联邦主义"
 cathdeath.18.d:0 "通过毅力、决心，甚至可能是来自上帝的干预，美利坚不仅纠正了自己的错误路线，避免了进一步的混乱，而且在为人民带来真正的民主和自由的追求上，也比任何其他政权都走得更远。史密斯信守诺言，将旧美国的联邦制结构从完全死亡的边缘挽救回来。当然，为了摆脱旧政权过去的罪恶，他对原有的制度作了某些改变，以确保国家能维持虔诚和稳定。例如，宪法甚至已不只是像以前那样过去被崇敬，更被视为与圣经同等，在宗教意义上不可侵犯的文件，自然，它的一些原始内容被悄悄地修改，以强调神圣美利坚联盟声称的潜在亲天主教言论一直就保留在宪法之中。美国已经转变成一个真正虔诚的、充满道德而又自由的资本主义民主国家，同时仍然保持着其深深的传统天主教根基。在摄政王史密斯的领导下，神圣帝国的未来是如此自由，国民上下一心，投身于基督教价值观和联邦自由。"
 cathdeath.18.a:0 "民主的弊病，可以通过更加民主来治愈"
 cathdeath.19.t:0 "重建多党制？"
 cathdeath.19.d:0 "自现已殉教的摄政王卡罗尔开始执政以来，神圣美利坚联盟以外的政党实际上可以算是完全被封住了嘴。卡罗尔以铁腕吸纳民主党或共和党等常设政党，将其整合为反对派联盟，是为了维护内战后遗留的脆弱政治体系。现在，随着新摄政统治这片土地，而分裂这个国家的派系动乱也已经平息，如何处理这些所谓非法政党的问题又浮出水面。这场辩论两个主要的争论阵营，一方是改革派和其他更自由的派别，他们主张完全解散反对派联盟，废除党派禁令，而保守一方则谴责这一举动是鼓励宗派主义、企图散布不和。最后的决定将由摄政王做出，他的决定将决定美国民主传统的未来。"
 cathdeath.19.a:0 "如果民众无法表达自己的意愿，又哪里算得上真正的自由？立刻废除反对派联盟！"
 cathdeath.19.b:0 "党派制度无非是宗派主义！要想生存下去，就必须团结一致！"
 cathdeath.20.t:0 "温顺的人有福了……"
 cathdeath.20.d:0 "“你们听见有话说：‘以眼还眼，以牙还牙。’只是我告诉你们，不要与恶人作对。有人打你的右脸，连左脸也转过来由他打；有人想要告你，要拿你的里衣，连外衣也由他拿去；有人强逼你走一里路，你就同他走二里；有求你的，就给他；有向你借贷的，不可推辞。”马太福音的这句话，在我们境内比以往更为真实。联盟的改革派付出了辛勤的努力，实现了战前美国从未经历过的和平与繁荣。我们的人民手挽着手一起走向更光明的未来，摄政王手持上帝之光的灯塔，由所有美国人见证，引领他们追随。温顺的人终于掌握了权力。"
 cathdeath.20.a:0 "……因为他们必承受地土。"
 cathdeath.21.t:0 "人民的主教"
 cathdeath.21.d:0 "在可敬的摄政王卡罗尔去世后，富尔顿·申掌握了国家的最高权力。长久以来，他一直是卡罗尔最为偏爱的门徒，最为精心挑选的后继者，而申也不负期望，一直遵循已故摄政王的最后愿望，领导起了神圣美利坚联盟。申希望能传递卡罗尔的火炬，计划完成卡罗尔对美国未完成的愿景，只是申倾向于更稍微民主一些的制度；他认为此举既有利于稳定，也有利于美国人民。就像圣若望执行耶稣基督的神圣意志，申也将成为牧羊人，带领疲乏的羊群顺应天命。"
 cathdeath.21.a:0 "当那些从未学会服从的人被赋予指挥权时，文明总会因此处于危险之中。"
 cathdeath.22.t:0 "申的演讲"
 cathdeath.22.d:0 "“……有史以来最伟大的哲学家圣多马斯·阿奎那的著作中对爱国主义的论述，你们可以发现其中主要的内容是虔诚。这起初可能会让那些认为虔诚只与对上帝的爱有关的信徒感到奇怪。但是，只要你们记住，对邻居的爱与对上帝的爱是分不开的，你们就会发觉，对同胞的爱正是虔诚的一种形式。”如今的美国，几乎每家每户的电台都传出了睿智的话语，全国各地的广播和电视每周都会播放深受爱戴的摄政王富尔顿·申在炉边的谈话。“在这段日子里，有如此多的颠覆者蠢蠢欲动，提醒我们必须要热爱自己的国家是非常切题的。不管是有意识还是无意识，我们的公民只是围绕着困扰我们国家的问题的几个可能的最终答案进行分组，”这位老人继续说道，就像一位慈爱的父亲教导自己的孩子一般，用他围绕着团结和赞美的动听话语吸引着人民的心灵。今晚他的演讲的重点美国人的职责——“因此，作为天主教徒，我们要意识到我们对美国背负着崇高的责任，并通过维护对上帝的信仰来维护美国的自由……”这些坚定的话语停悬在空中，萦绕在美国各民族人民的脑海中，摄政王申用他标志性的结束语向听众告别，等待着下一周的聊天。"
 cathdeath.22.a:0 "……“再见，还有，上帝爱你们！”"
 cathdeath.23.t:0 "库格林宣誓就职摄政王"
 cathdeath.23.d:0 "在围绕卡罗尔之死的混乱中，有一个人最终崛起并超越了其他所有候选者，他领导国家度过了这段艰难时期，他拥有着远见卓识，虔诚信仰，最重要的是能够领导整个国家的强大纽带。这个人就是查尔斯·库格林神父，他已经成为了正式的摄政王，并为国家制定了接下来的计划。首先也是最重要的一点是，由于库格林参与了最初的“财富分享”计划，他似乎有兴趣以某种方式重振这一计划。到目前为止，这项计划所包含的内容和细节尚不清楚，但众所周知，库格林的信仰和保守思想正是我们稳定国家所需要的。"
 cathdeath.23.a:0 "美利坚至上党回来了？"
 cathdeath.24.t:0 "美利坚至上！"
 cathdeath.24.d:0 "从成为摄政王开始，库格林神父就一直致力于人民服务。他之所以勤恳工作，持续拼搏，一切都是为了贫民、农民、工人和小城镇的居民。在他花费时间完成了自己许多最为重要的建议后，国家渐渐注意到摄政王的苦心。例如，库格林一直在为提高工人工资和保护工会权利而奔走，他的支持率也随着飙升。然而，美国尚未从大萧条中完全复苏，似乎连库格林的计划都无法显著改善经济。但在这样一个充满了变数的时代，美国人民仍然能够安心入睡，因为他们知道库格林神父牢记着他们的利益，为之殚精竭虑，而在有如此认知的人民支持下，也许我们可以顺利地完成重建。"
 cathdeath.24.a:0 "以民为天！"
 cathdeath.25.t:0 "信仰测试？"
 cathdeath.25.d:0 "过去很少有人会认为美利坚合众国会成为一个天主教徒占多数的国家，但这恰恰就是已经发生的事情。大萧条和第二次内战的余波让许多人在寻找着答案、意义和真正的正义。在这种氛围中，数百万人将天主教视为力量的源泉，包括他们的领袖和社区也是如此。然而，与过去曾发生的此类大规模皈依一样，我们无法清楚的确认这些新皈依者的真实性。因此，我们有必要为此进行某些测试，以便我们能够更好地确定所有声称追随我们信仰的美国人的意志。虽然测试的考虑因素各不相同，从要求美国人参与资助教会，到看谁在参加弥撒，但我们知道的是，我们必须想出一些办法来找出谁是真正的信仰者，谁不是，至少，这就是一些顾问的想法。但也有另一些人说，我们一直以来都是一个在信仰方面极为自由且开放的国家，也许我们对此应当更为宽宏大量。当然，天主教现在是大多数人的信仰，任何试图把它强加给美国人的行为都可能被视为色厉内茬。我们该作何选择？"
 cathdeath.25.a:0 "虔诚必须得到考验！"
 cathdeath.25.b:0 "温和能换来更多皈依……"
 cathdeath.26.t:0 "清心的人有福了……"
 cathdeath.26.d:0 "虽然我们失去了摄政王菲利普·卡罗尔，但他的梦想依旧得到了延续。极端分子试图以各种方式解读他的语录以维护自身的利益，左翼分子试图利用他的语录实施社会主义，而右翼则试图以此阻挠我们提出的任何改革。不管怎样，卡罗尔的温和派支持者已在当前的窘境中尽其所能地实现了他遗留的计划。现在，在这么长的时间过去之后，我们终于可以宣告，美国正走在通往新伟业的道路上。我们感谢朗，感谢卡罗尔，也感谢我们的美国同胞在这个时代所展现出的奉献精神。尽管我们仍然遭受着经济创伤所带来的阵痛和其他各种问题的困扰，但我们明白，美国人的心灵是纯净的，而这正是我们所需要的。"
 cathdeath.26.a:0 "……因为他们必得见神。"
 cathdeath.27.t:0 "卡莫迪，美利坚的骑士"
 cathdeath.27.d:0 "拥有哥伦布骑士团至高骑士头衔的马丁·亨利·卡莫迪是个神秘人。掌控一个国家对萦绕着他的神秘幕布几乎没有影响，但有一件事他似乎比其他所有国务都更关注。一开始，那只是一个号称要给所有美国人工作的计划，现在似乎却发展（或被揭示）成一种新封建主义的谋划。卡莫迪确实一直是一名“骑士”，但很少有人能预测到他竟会对新封建主义充满兴趣。不过，在秘密警察的帮助下，卡莫迪已经在全国范围内扩大了他的影响力。神秘的骑士的影响力似乎远比他在公众面前表现出来的更大，尽管他所推行的社会聚合政策和新封建主义经济政策反动又激进，但对于许多将旧美国制度视为可憎的失败的人民来说，这却成了值得欢迎的变化。然而，一些人质疑卡莫迪是否真正在照着卡罗尔的愿景行事，他是否正在带领美国走向自己渴求的方向。没有人能确定接下来会发生什么。"
 cathdeath.27.a:0 "变幻莫测的时代……"
 cathdeath.28.t:0 "美利坚之王？"
 cathdeath.28.d:0 "随着摄政王卡莫迪的统治地位得到稳固，他将封建主义——他称之为历史上天主教政治的最佳表现形式——完全带到美国的梦想很快将成为现实。这部分原因是因为卡罗尔的整合主义本来就带有半封建性质，因此卡莫迪的新封建主义对帝国人民来说，并不是什么新鲜事。在此基础上，卡莫迪加大了权力下放，地方分权的程度，并积极地寻找并授予“贵族血统者”头衔与权力。尽管卡莫迪的愿景进展顺利，但他始终是一个心系未来的人，他担心自己的改革会被后代推翻。为了把这个问题扼杀在萌芽状态，卡莫迪一直在考虑加冕自己为美利坚国王。虽然这个想法似乎无比疯狂，但卡莫迪向他的骑士下属们证明了自己的正当性。他声称，如果他能成为国王，封建主义理想就不会被推翻，因为后续的持有王位者将尽一切努力保护理想的延续。当其他人提到卡罗尔已将基督加冕为国王时，他则引用德意志皇帝作为论据。卡莫迪说普鲁士国王能做德国人的皇帝，美利坚国王同样可以成为统治整个帝国的基督王的摄政王。尽管他的逻辑似乎不是特别合理，但如果摄政王卡莫迪继续他的计划，几乎没有谁能阻止他……"
 cathdeath.28.a:0 "美国封建主义必须被保护！"
 cathdeath.28.b:0 "上帝会保佑美国封建主义的！"
 cathdeath.29.t:0 "费尼的美国"
 cathdeath.29.d:0 "在伦纳德·费尼的领导下，旧美国已经不复存在，取而代之的是一个尽可能符合其理想的国家。新就任摄政王的费尼是一位保守的耶稣会士，最值得注意的是，他激烈地抨击死前忏悔洗礼和参军视为洗礼这两大代替正规洗礼的做法。此刻，正当这个国家站在宗教皈依新时代的悬崖边时，费尼要求宗教审判所的成员们做好准备，去完成他们迄今为止最重要的任务。他们必须确保所有美国人都是天主教徒，而不忠于我们信仰的异端必将被消灭。此事事关重大，费尼本人认为，对教会的违逆将导致整个国家的崩溃，而犹太人理应得到重点关注，费尼认为他们可能是天主教会所面临的最大威胁。"
 cathdeath.29.a:0 "我们将做一切必要之事……"
 cathdeath.30.t:0 "宗教裁判所的新美国"
 cathdeath.30.d:0 "美利坚在烈火中熊熊燃烧。不过燃烧美国的不是战火，而是涤荡罪孽之火。美利坚，正在接受一场洗礼，旧有的宗教宽容已经完全逝去，取而代之的是宗教裁判所。全国上下，审判官在寻找不信教者，立法者也采取行动以尽快剿灭不信者的组织。而那些未公开皈依天主教信仰的人则被课以重税。那些直言不讳声明自己是新教徒、犹太教徒或是其它教教徒的人在被神秘的审判官造访后消失得无影无踪。一般情况下，这些不信教者都被送入法庭审判，并判处牢狱惩罚。不过，在某些农村地区，旧有的火刑也有所复兴，不信教者若被判犯下鸡奸罪或是共济会分子之罪，就会被处以此刑罚。不得不说，火刑这种粗暴的刑罚方式确实令人骇然，不过审判官们确实也以相当高的效率完成着任务，而美利坚也远比任何时候更加的纯净，即使这一切都是以审判与毁灭之火换来的。"
 cathdeath.30.a:0 "我们从魔爪中挽救了社会！"
 cathdeath.31.t:0 "加大宗教裁判力度？"
 cathdeath.31.d:0 "神圣美利坚联盟中的右翼势力的地位最近一直在升高，不过随着他们的崛起，也有一些人开始质疑裁判所到底应不应该进一步扩张。裁判所组织起来是为了解决不信教者和罪犯，并以必要方式消灭社会中最为糟糕的分子。为裁判所提供更多资金肯定能增强我们转化美利坚为纯净的天主教国家的行动效率，不过裁判所在处理不信教者过程中是否真正公正还是个未知数。在裁判所对我们的政权可能产生威胁之情况下，给予他们更多实权真的是可行的么？"
 cathdeath.31.a:0 "是的，为了信仰需做必行之事"
 cathdeath.31.b:0 "还是不了，他们太危险了，不可信"
 cathdeath.32.t:0 "渴望正义的人有福了……"
 cathdeath.32.d:0 "美国已不再是过去的样子了。国内各地，都可以看到全心全意地信奉天主教，将天主教化为生活的一部分，就好像自己的血肉一样的虔诚之人。我们在改革国家的努力中取得了巨大的成功，成千上万的人民现在接受了真正的传统主义理论，以及它为这个国家带来的崇高美德。封建主义也在更为坚忍的支持者中死灰复燃。尽管一些异端分子仍苟活于阴影中，但他们只能永远留在阴影中，来逃避宗教裁判所的追捕。毫无疑问，我们已经实现了彻底的纯净与和平，尽管这一事业的背后是牺牲的诸多生命。"
 cathdeath.32.a:0 "……因为他们必得饱足。"
 cathdeath.33.t:0 "如何恢复秩序的问题"
 cathdeath.33.d:0 "虽然首都已经平静下来，秩序得以恢复，但全国其他地区仍处于混乱之中。我们需要做点什么，否则美国就有可能分崩离析，只有傻瓜才会以为控制住一座城市就足够了。因此，领导人和维和部队开始了讨论，是否应该直接开始暴力镇压？毕竟农村充满了敌对势力。这一提议虽然极具争议性，但似乎得到了军队的赞同，不过领导层中更冷静、更和平的一派强烈反对。该派系认为，作为一个天主教国家，必须首先以上帝之语来引导秩序的恢复。"
 cathdeath.33.a:0 "我将用剑带来和平"
 cathdeath.33.b:0 "和平才是我们选择的武器"
 cathdeath.34.t:0 "政变之后"
 cathdeath.34.d:0 "在几乎把神圣美利坚帝国撕成碎片的僵局之后，有一个人阻止了混乱，有一个人重整了分裂的国会，有一个人拯救了帝国。那个人就是美国的救世主约瑟夫·肯尼迪。肯尼迪摄政王尽管不久前刚刚上台，但已经开始对帝国进行全面改革。他和他的国民骑士已经开始将帝国转变成一个军政府。神美联盟实际上已经变成了象征性的橡皮图章政党，敢于反对摄政王意志的政客都会遭到压制或者更糟的命运。长期以来，军队一直是帝国忽视的一部分，现在却成为肯尼迪统治集团的中心。尽管摄政王在稳定圣玛丽城取得了进展，但全国其他地区仍然处于僵局带来的混乱之中。除非摄政王能够恢复整个国家的秩序，否则他可能不得不黯然下台……"
 cathdeath.34.a:0 "救世主万岁！"
 cathdeath.35.t:0 "军政府又有什么不同？"
 cathdeath.35.d:0 "军队统治了一切，国会大厦的所有广播电台都为武装部队服务。但这统治和卡罗尔时代又真的有什么不同吗？商人、牧师和疲惫的怀疑论者现在相信了没有什么区别。同样的政府权威，同样的天主教信仰，只是街上多了点士兵，军官身上多了点褒奖。"
 cathdeath.35.a:0 "统治的是卡罗尔还是军队，谁能看出什么不同？"
 cathdeath.36.t:0 "瓜达卢佩圣母会议"
 cathdeath.36.d:0 "国会……不，我们整个国家，艰难地在僵局引发的混乱中幸存了下来。现在我们作为瓜达卢佩圣母会议共同执政。这个委员会由建制派和愿意合作的国会议员组成，作为一个整体充当基督的摄政，而不再是一个永不终结的国会。这无疑是一种特殊的政治制度，但只要我们设法不偏袒任何一方，确保国会的稳定和团结，我们就能做到。这一制度不仅可以让帝国生存下来，还可以让帝国茁壮成长。"
 cathdeath.36.a:0 "妥协方能得生"
 cathdeath.37.t:0 "起效"
 cathdeath.37.d:0 "当我们在国会大厦中建立起来的妥协制度被证明可以成为维护国家稳定和平的必要保障时，全国人民都松了一口气。人民似乎都接受了我们的决定，因为选择一群待在大楼里期盼和平的温顺老人，远比选择那些在国会中引发混乱的人要好。尽管国会中仍有相当多的争吵，但考虑到不幸的混乱会造成多少人死亡或失踪后，激进派的势力大大弱化了，我们已经不必担心。"
 cathdeath.37.a:0 "我们手牵着手，向着未来前进"
 cathdeath.38.t:0 "使人和睦的人有福了……"
 cathdeath.38.d:0 "我们的领导人总算可以松一口气，因为他们的工作得到了回报。就在今天，帝国得救了，我们成为了和平缔造者，站在灾难的峰口之前取得了胜利。凭借在这场危机中吸取的教训，今后帝国将千秋万载不灭！"
 cathdeath.38.a:0 "……因为他们必称为上帝的儿子"
 cathdeath.100.t:0 "美利坚革命朝圣会的建立"
 cathdeath.100.d:0 "摄政王多萝西·戴上台后，美国的政治便发生了翻天覆地的变化。虽然戴本身是名虔诚的天主教徒，但她同时也是位狂热的无政府主义者，继承了许多旧联合工团的信条。戴的这一立场既赋予了社会主义势力于再度统一后的美国以合法的支撑，也使其成为了激进左翼圈子眼中背离了社会主义价值观的“叛徒”，后者已开始与苟延残喘的各右翼人物、运动，如加拿大社会信用党、银色军团、神圣美利坚联盟的内部的激进派，乃至某些迪克西党人，眉来眼去，而近几个月来，对戴深感不满的各方势力更是集中在了路易·埃旺周遭。埃旺是名法裔加拿大牧师，是把社会信用理论带到魁北克天主教人口中的牧羊人，也是选民联盟的领袖，以及更具军事性的组织圣米迦勒朝圣会（也称“白色贝雷帽”）的缔造者。埃旺意图以反全球主义、瓦解银行金融精英、反犹主义为手段，打造出一个社会公正之国，或者更具体点说一个“白人”集体，这一想法吸引了许多郁郁不满的群众，催生出了美利坚革命朝圣会。据说，该组织还受到了莫拉斯一派的新秀皮埃尔·布热德的影响。"
 cathdeath.100.a:0 "真是个多事之秋啊"
 cathdeath.101.t:0 "革命朝圣会试图发动政变！"
 cathdeath.101.d:0 "革命朝圣会才成立不过数日，就已试图强行将摄政王戴赶下台。四境之内，到处都是企图将忠诚部队赶出主要城市中心的“白色贝雷帽”武装分子。到目前为止，他们已经控制了波特兰、亚特兰大和墨西哥城。战斗十分激烈，没人能够确定谁将会取得最终的胜利……"
 cathdeath.101.a:0 "……革命朝圣会成功了！天主的社会主义王国万岁！"
 cathdeath.101.b:0 "……革命朝圣会被击垮了！摄政王戴万岁！"
 cathdeath.102.t:0 "在上帝的光辉下，以人民的意志，共和民主将会归来"
 cathdeath.102.d:0 "随着摄政王戴开始追求将美国塑造成一个真正的社会主义地上天国的梦想，通往上帝引领之下的无产阶级乌托邦的道路发生了很大变化。随着政权、生产资料和赖以生存的土地都被分配到人民手中，全美国都开始在平等的喜悦中欢欣鼓舞，尽管我们仍然有所缺失。在通过上帝的教诲和多萝西·戴的指引，朝着一个完善的社会主义社会前进后，美利坚人民开始深深怀念曾经的民主选举，因此戴决定更进一步，组织一场全国选举。虽然她将继续作为上帝的摄政王，但与她一起统治的民选政府可以代表人民的意愿。\n\n出现在我们面前的是四大主要民主派系，都有可能在今天的选举中获胜。这些派系中最占主导地位的是坚定效忠于戴的忠诚派，他们围绕基督教社会主义、市场社会主义、生态社会主义、贝拉米主义和分产主义理念组织起来，尽管他们对摄政王怀抱的激进无政府主义同情避而不谈。他们的主要对手是无政府工团主义者、工团主义者、无政府共产主义者的联盟，甚至还有一些联合起来向上帝和戴效忠的罪犯无政府主义者。与这些激进分子对立的是“自由派”，一个由社会民主党、进步党、左翼自由主义者和其他民主团体组成的广泛基督教民主联盟，他们愿意放弃自己的一些坚持，只求在新美国取得选举的成功。尽管自由派在规模上是最大，但他们在新政府中并不享有与忠诚派或工团派一样的地位。最后，这场比赛的黑马是所谓的“天主教共产主义者”——一群受白劳德启发的共产主义者组成了一个广泛联盟，他们狂热于天主的教义，也信奉更为专制的思想。随着紧张的投票数计算，谁将赢得大选，在上帝的领导下，站到摄政王的身旁，共同指导美国？"
 cathdeath.102.a:0 "由多种基督教社会主义温和派组成的主要派别以压倒性优势获胜"
 cathdeath.102.b:0 "工团主义阵线崛起，摄政王的无政府主义之梦终得实现"
 cathdeath.102.c:0 "自由派联盟依靠公众支持赢得了胜利"
 cathdeath.102.e:0 "黑马天主教共产主义者夺取了政权"
 cathdeath.103.t:0 "抉择方向"
 cathdeath.103.d:0 "在摄政王史密斯以上帝之光为指导，巩固了拥有基督教政府政府的新美国之后，政府内部的一场辩论导致史密斯不得不定下自己政治上的未来方向。虽然迄今为止，他和已被解散的民主党残余势力和其他志同道合的政党团体中的保守派盟友合作愉快，但国内仍然有大量的基督教自由主义者，他们和史密斯有着许多相似的经济观点，很容易成为新的支持者。摄政王史密斯可能会选择将这些自由主义者的另一些想法纳入自己的议程，以获得他们的支持，甚至也可以全力向他们抛出橄榄枝，以确保自己在美国底层民众中的受欢迎程度。然而，这样做会疏远他长期以来的保守派盟友，因此这位摄政王现在必须在十字路口做出选择。"
 cathdeath.103.a:0 "开始与温和基督教右派结盟共进"
 cathdeath.103.b:0 "在坚持保守主义根基的同时，与自由主义者结盟"
 cathdeath.103.c:0 "完全拥抱天主教自由主义，巩固权力根基"
 cathdeath.104.t:0 "王室联姻？"
 cathdeath.104.d:0 "詹姆斯三世对美国政治从来就不甚热衷。虽然在名义上，他可谓位高权重，但摄政王卡罗尔认为只有国王治下的政府才能真正行使这些权力。尽管在执政之初，他确实试图干预过一两次政务，但他马上就发现摄政王虽然接受了国王的命令，但对国王行使王权的做法感到愤怒不已。因此，国王此后便不问政事，除了签署法案使其成为法律，并作为神圣美利坚联盟的“公众形象”出现。殿下同家人在一起消磨了大部分时间，并帮助他唯一的孩子和继承人玛丽亚公主为她未来担任女王做准备。这是他为数不多能做的事了，他的女儿也终于在上个月成年了。在她成年后，公主很快便在公众之中声名鹊起，因为她常常与好莱坞明星、贵族、精英们谈笑风生，人们因此对她有了些崇拜之情。\n\n虽然在他人看来，这种崇拜对王室百利无一害，但神圣美利坚联盟已开始向国王施压，试图利用公主的人气，逼迫他将女儿嫁给随便哪个欧洲王室成员，这大概是为了结成一个国际性的联盟。国王似乎被吓了一跳。虽然对欧洲贵族来说，父亲为女儿包办婚姻实属司空见惯，但国王却认为这是错误的，他的女儿不是任何人的所有物，更不应成为政治活动里的玩物。然而，他自己的政府正在向他施压，而国王并不以自信著称。经过无数次深思熟虑与内部辩论，詹姆斯三世决定……"
 cathdeath.104.a:0 "……同意，与德国皇室联姻"
 cathdeath.104.b:0 "……同意，与奥地利皇室联姻"
 cathdeath.104.c:0 "……同意，与西班牙王室联姻"
 cathdeath.104.e:0 "……同意，与卡洛斯派宣称者联姻"
 cathdeath.104.f:0 "……同意，与爱尔兰贵族联姻"
 cathdeath.104.g:0 "……拒绝，自己女儿的人生大事就交由她自己决定吧"
 cathdeath.105.t:0 "世纪大婚"
 cathdeath.105.d:0 "经过数周的紧张准备，玛丽亚公主与[TEX_prince_dude]的婚礼终于举行了。在巴尔的摩圣母升天大教堂举行的仪式上，大主教迈克尔·约瑟夫·柯利亲自主持了两人的结合仪式。预计至少会有2000人参加婚礼，其中大多数是贵族，还有来自神圣美利坚联盟和新郎祖国的政要。在婚礼与神圣的弥撒后，一个规模更大的招待会正在计划中，神圣美利坚联盟为新娘和新郎提供了他们所需的一切。在这场婚礼后，公主和即将成为他丈夫的人所属的两个国家之间的关系将会更加紧密，这让神圣联盟欣喜不已，正是他们安排了这一切。"
 cathdeath.105.a:0 "干杯，敬幸福的新婚夫妇！"
 cathdeath.106.t:0 "美国总主教"
 cathdeath.106.d:0 "教宗承认了卡罗尔摄政领导下的神圣美利坚联盟所举行的“美利坚之洗礼”，并正式将1921年以来担任巴尔的摩大主教的迈克尔·约瑟夫·柯利提拔为美国总主教。虽然这只是一个象征性的头衔，但在名义上，总主教仍是一国教会之主。巴尔的摩是美国历史上首个天主教教区，人们一直相信如果美国有一名总主教的话，那其一定出身巴尔的摩大主教区。卡罗尔摄政亲自向教宗表达了感激之情，并宣布会授予总主教一定的临时权力，以使其配得上这一头衔。此外，这一消息也在教会中引起了高度重视，他们将这视作战胜奥兰治骑士团和三K党的重要标志。"
 cathdeath.106.a:0 "祝总主教大人安康！"
 cathdeath.107.t:0 "新贵族"
 cathdeath.107.d:0 "既然美国正逐步向传统的天主教和君主制国家过渡，那本土贵族也便不出人所料的崛起了。新英格兰的肯尼迪家族，西部的赫斯特家族，甚至路易斯安那州的朗家族都被授予了与他们在旧美国中事实上的贵族地位相称的贵族头衔。不过，这些新贵族大多只是在这些家族已有家业的基础上，获得政府提供的保护与少量津贴。与此同时，政府还为他们提供土地，只要他们宣誓效忠天主教会、拥护新美国的理念、在其治下保护人民免受伤害、各依顺次向摄政王卡罗尔宣誓效忠。与此同时，旧墨西哥帝国的许多贵族，虽然他们的故土不在我们的统治范围内，却也被赋予了与美国人相同的地位。乃至于墨西哥帝国的女继承人自己也成了新贵族。然而，在墨西哥加入我们的天主教大家庭之前，这些贵族家族在本质上仍处流亡之中，等待着有朝一日他们的合法土地得以光复。无论如何，美国终于有了真正的贵族，摄政王创建一个真正的天主教美国的事业也因此得以大步向前推进。"
 cathdeath.107.a:0 "意料之中"
 cathdeath.108.t:0 "多奥雷根的菲利普·卡罗尔封圣"
 cathdeath.108.d:0 "今天，在罗马的圣彼得大教堂内举行的盛大而豪华的仪式上，教宗正式将菲利普·阿科斯塔·卡罗尔摄政王封圣。在随后的演讲中，教宗讲述了卡罗尔的人生经历，讲述了他是如何从律师成为战士，再从战士成为天主教美国之父的。教宗指出，卡罗尔的治理虽称不上完美，其政府早期也存在着许多过错与弯路，但他始终坚持用天主教的教义与慈善精神统治着国家，为非天主教国家的天主教领袖树立了楷模。教宗还提到了卡罗尔的家人，他们在背后默默地支撑着他，敦促他成为了一名模范神父。除此之外，教宗还述说了促成卡罗尔封圣的神迹——一名身患癌症的加拿大少女。本来她的病症经医生多方尝试治疗后都认为已经回天乏力，但就在听闻摄政王去世噩耗的隔天，这位少女向其祈祷，请求他在上帝的见证下治好自己的癌症。两周后，她的癌症竟然神奇地消失了！教会经过调查，宣布这是真正的神迹。\n\n圣卡罗尔的祝日被定在了3月10日，他的庇护对象则为美国以及所有因信仰而受到迫害之人。帝国政府已经将这一天定为了法定假日，以让所有的美国人能都来纪念这位建国圣人的离去。"
 cathdeath.108.a:0 "圣菲利普，请为吾等祈祷！"
 cathdeath.109.t:0 "家务事"
 cathdeath.109.d:0 "整个国家都因摄政王的逝去流下了苦涩的眼泪，沉浸在悲痛的氛围中，不过，对其感受最深的莫过于其家人。摄政王卡罗尔1923年成婚，与妻子妮娜一起育有四个孩子。内战爆发后，即使是为了守护两人共同的信仰，妮娜也极力反对丈夫在巴尔的摩之战中以身涉险。战争结束后，妮娜一直催促丈夫回归到因保卫家园、保卫信仰而耽误的法律工作中去，而摄政王则向她保证，待王鱼将美国带回昔日的常态后，自己就会回去继续法律事业。不过，卡罗尔所期盼的事情并没有发生，反而是他自己被卷入了政治之中，虽然不情愿，但妻子和家人还是对他表示了支持。虽然卡罗尔一路走上了总统、摄政以及最后的摄政王的位置，但他始终将家庭放在第一位，即使是在美国深陷宗教冲突之时，他也会尽力保护家人不被世间之恶所伤害。\n\n旧王已逝，新王已被选出，根据帝国继承法，菲利普·卡罗尔的家人就成为了一处灰色地带。虽然他们坐拥卡罗尔步入政坛前后所积蓄的巨额财富，但他们在帝国内却没有任何正式的地位。考虑到这点，摄政王[TEX.getleader]正式将已故的卡罗尔生前的贵族头衔——多奥雷根庄园（革命之前卡罗尔家族的领地）的领主与夫人——授予了其家人。有了这一头衔，卡罗尔的家人就能享受到政府的津贴与保护。虽然这一举措表现出了友好的姿态，但许多人将其视为让那些支持卡罗尔家人继承摄政王之位的人噤声的手段。不管真相到底如何，卡罗尔的家人终于可以高枕无忧了。"
 cathdeath.109.a:0 "帝国自会护佑其子民"
 cathdeath.110.t:0 "国称之意？"
 cathdeath.110.d:0 "当美国在神圣美利坚联盟的领导下转变为一个真正的天主教国家后，许多人都想知道我们究竟该如何称呼这个新国家。显然，由于我们的君主制色彩，我们不能继续维持合众国的身份。为了商定我们的天主教王国的新名称，联盟召开了紧急会议。"
 cathdeath.110.a:0 "维持美利坚使徒国"
 cathdeath.110.b:0 "更名为最尊贵的美利坚联盟共和国！"
 cathdeath.110.c:0 "美国乃是天国！"
 cathdeath.110.e:0 "维持詹姆斯党王国"
 cathdeath.110.f:0 "呸！就叫美利坚王国得了！"
 cathdeath.110.g:0 "以其最伟大的殖民地和查尔斯国王命名美国！"
 cathdeath.111.t:0 "新美利坚之帜"
 cathdeath.111.d:0 "随着一个正义的天主教新政府掌握了美国政权，许多人开始就我国的国旗的样式展开辩论。虽然许多人喜欢我们目前的设计，但也有不少人向摄政王卡罗尔提出了其他设计。在摄政王审查国旗时，许多人怀疑他可能真的会更改国旗，毕竟这在他的职权范围之内。"
 cathdeath.111.a:0 "使用我们最初的旗帜，印有圣母玛丽亚的联盟国旗帜"
 cathdeath.111.b:0 "使用带有12颗星和圣心的美国国旗"
 cathdeath.111.c:0 "使用以马里兰州旗为基础的国旗"
 cathdeath.111.e:0 "使用以圣母像为重心的民族色十字旗"
 cathdeath.111.f:0 "使用中心印有鹰与圣母的民族色十字旗"
 cathdeath.112.t:0 "新美利坚之帜"
 cathdeath.112.d:0 "随着一个正义的天主教新政府掌握了美国政权，许多人开始就我国的国旗的样式展开辩论。虽然许多人喜欢我们目前的设计，但也有不少人向詹姆斯三世和摄政王卡罗尔提出了其他设计。在政府审查国旗时，许多人怀疑它可能真的会更改国旗，毕竟这在政府的职权范围之内。"
 cathdeath.112.a:0 "使用我们最初的旗帜，印有玫瑰的联盟国旗帜"
 cathdeath.112.b:0 "使用美王子查理的旗帜！"
 cathdeath.112.c:0 "扬起联合王国王室旗帜！"
 cathdeath.112.e:0 "扬起王室徽章！"
 cathdeath.113.t:0 "影响问题"
 cathdeath.113.d:0 "从表面上看，神圣美利坚联盟虽然偶有内部摩擦，但总体上是个团结统一的组织，所有人都忠实地朝着同一个目标迈进——传播、践行、保护天主教信仰。但实际上，联盟的分裂程度与罗马教廷不相上下。从多萝西·戴的社会主义追随者到费尼神父“教会之外无救恩”严格阐释的拥趸，可以说神圣联盟与团结二字豪不沾边。不过总的来说，联盟成员都默认以卡罗尔摄政为尊。卡罗尔遵循中道为上，带领联盟践行着美国特色的卢西塔尼亚整合主义，虽然他的这一整合主义完全跑偏了路子，其中甚至可以看到法兰西行动的夏尔·莫拉斯的影响以及毕奥神父的教义。也正是因为如此，时不时地就会有人提议将联盟的纲领正式改为这些五花八门的思想之中的其中一个。"
 cathdeath.113.a:0 "没有卢西塔尼亚整合主义就没有我们的今天，别改了"
 cathdeath.113.b:0 "夏尔·莫拉斯是个天才！我们要接纳莫拉斯思想！"
 cathdeath.113.c:0 "毕奥神父真乃活圣人，我们必须以他为榜样！"
 cathdeath.114.t:0 "天主教与新教关系缓和"
 cathdeath.114.d:0 "在总统和库格林神父的努力下，美国不断壮大的天主教人口与根深蒂固的新教之间的紧张局势渐趋缓和。虽然在大南方的某些地区，三K党依旧紧盯着新皈依的天主教徒，但从总体来看，美国的精神生活正在回归旧日的常态。神圣美利坚联盟在继续助力重建工作的同时，也因总统能够在如此微妙的局势中纵横捭阖而向其表达了祝贺。不过，联盟认为现在做的还不够，他们要参加下一届选举，为美国不断壮大的天主教人口发声。一向厌恶多萝西·戴的库格林也在巡回演说中表明他已重拾对联盟的信任和信心，并且会在以后的所有选举中无条件支持联盟。不管怎么说，[TEX.getleader]没有选择将矛头指向天主教，这就避免了又一场宗教冲突的发生。"
 cathdeath.114.a:0 "又干成了一件事！"
 cathdeath.115.t:0 "菲利普·卡罗尔宣布竞选总统"
 cathdeath.115.d:0 "今天，在神圣美利坚联盟的总舵巴尔的摩市，内战的英雄、联盟的领袖菲利普·阿科斯塔·卡罗尔宣布他将要参加即将到来的大选，竞选总统一位。卡罗尔承诺如若当选，他定会保卫天主教徒不因信仰而受到攻击，并在政府之中推广天主教价值观。卡罗尔及其周边同僚在竞选造势上花费的资金已经达到了天文数字级别，而据奥兰治骑士团之类的组织的偏激成员的小道消息，这些资金中有一部分直接来自梵蒂冈。要单单依靠政治天主教这一纲领拿下美国大选听起来就像是天方夜谭。更何况，为数不多的天主教选民还被其余党派吸引，最终留下的选民不过只有寥寥数万。"
 cathdeath.115.a:0 "哪来的路边一条，去你妈的"
 cathdeath.116.t:0 "神圣美利坚联盟加冕“詹姆斯三世”"
 cathdeath.116.d:0 "今天，在圣玛丽城外举行的盛大典礼上，神圣美利坚联盟总统菲利普·阿科斯塔·卡罗尔宣布要进行大刀阔斧的政治体制改革。改革的意图很明显，就是将美国改造为一个天主教国家，而其中有一项是创立美利坚王国。经过投票选举，最终决定王冠应交予哈科沃·菲茨-詹姆斯·斯图亚特——詹姆斯二世直系后裔中尚在世的年长男性，拥有着斯图亚特血脉的宣称，虽然是以私生子的形式。除了斯图亚特诸王是原十三殖民地名义上的国王这一原因外，对抗加拿大的温莎王室也是促成这一行动的重要考量，虽然很多人都觉得这么做毫无卵用。不管是好是坏，在受激进天主教组织支持的国王的统领下，美国正朝着天主教国家的路一去不返。"
 cathdeath.116.a:0 "吾王万岁万岁万万岁！"
 cathdeath.116.b:0 "反动派小丑们总是能给我惊喜"
 cathdeath.116.c:0 "国王？还是在美国？真是什么奇怪事都给我碰上了！"
 cathdeath.117.t:0 "神圣美利坚联盟加冕基督为王"
 cathdeath.117.d:0 "今天，在圣玛丽城外举行的盛大典礼上，神圣美利坚联盟总统菲利普·阿科斯塔·卡罗尔宣布要进行大刀阔斧的政治体制改革。改革的意图很明显，就是将美国改造为一个天主教国家，而其中有一项是创立美利坚王国。经过投票选举，最终决定王冠不应授予任何凡人，而应交予基督本人。根据神圣联盟方面的说法，此次加冕只是对万国共通事物的正式承认。除去加冕外，卡罗尔总统还宣布自己将接过“摄政”的头衔，代基督统御尘世，这其实也就是变相地成为了不受约束的独裁者。不管是好是坏，有了国王（虽然真正管理国家的是受激进天主教组织支持的摄政）的美国正朝着天主教国家的路一去不返。"
 cathdeath.117.a:0 "吾王万岁万岁万万岁！"
 cathdeath.117.b:0 "反动派小丑们总是能给我惊喜"
 cathdeath.117.c:0 "美利坚君主制？真是什么奇怪事都给我碰上了！"
 cathdeath.118.t:0 "第十八修正案告吹"
 cathdeath.118.d:0 "伍德罗·威尔逊史无前例地达成三连任后不久，其政府就因担忧德国干涉美国内政而花费了大把力气成功推动批准了所谓的《贵族头衔修正案》，即宪法第十八修正案。一言以蔽之，该修正案规定，美国公民如在未经国会同意的情况下接受任何贵族头衔，则其公民权自动视为作废。既然我们的目标是在美利坚的土壤上建立君主制政府，那这一修正案就没有存在的必要了，而且这种拍脑袋想出来的规矩能堂而皇之地出现在国家的基本大法，简直是对我们的侮辱。为了描绘出君主制国家的蓝图，我们向国会递交了一系列修正案。为保证改革顺利通过，[root.getleader]政府投入了大量的资源，大家也都自信满满，认为只需几月即可大功告成。改革的头一项就是正式废除第十八修正案，删除宪法中的第一条第九款第八项。对美利坚天字第一号大法的改革和变动，只算只是触及皮毛，也能大幅提高我们执政的合法性——毕竟，如果美国“正统”的法律体系实质上就是君主制的话，那么共和党又要怎么才能说得出口自己真心支持这一法律体系呢？"
 cathdeath.118.a:0 "朝合法美利坚君主制迈进的又一步"
 unionstatefp.1.t:0 "加入德国势力范围？"
 unionstatefp.1.d:0 "随着[root.getleader]带领美国进入了由自己亲手打造的勇敢新时代，越来越明显的是，美国的外交政策目标似乎越发与德意志帝国趋于一致。除此之外，我们实践的种种政策也使我们和德国的关系达到了历史记忆中的最高点。在这些因素的影响下，以及各种德美友好协会和兄弟会的推动下，我们政府的许多人已经开始提议与德国接触，讨论我们是否有可能加入帝国公约。虽然这个想法似乎有点激进，但鉴于工团主义仍然对我们构成威胁，加入帝国公约可能有很好的效果。虽然即使我们与德国接触，也不能保证他们会接纳我们加入。无论如何，[root.getleader]必须很快做出决定。"
 unionstatefp.1.a:0 "接触德国，只要并肩作战，我们才能彻底粉碎工团威胁！"
 unionstatefp.1.b:0 "我们有更多重要的事务要担心，没空加入海外的十字军战争"
 unionstatefp.2.t:0 "[From.GetName]请求加入帝国公约"
 unionstatefp.2.d:0 "令人震惊，美国政府正式要求加入帝国公约。这似乎是来自各种德美友好协会和兄弟会的建议，美国希望看在两国历史上高度友好的关系上，寻求加入条约。虽然美国显然对我们来说是一个重要的盟友，但这样一个大国加入公约可能会动摇我们对帝国公约的统治。不管怎样，美国等待着我们的答案，我们该怎么回答？"
 unionstatefp.2.a:0 "很好，允许他们加入"
 unionstatefp.2.b:0 "他们以为自己是谁啊？"
 unionstatefp.3.t:0 "德国同意了！"
 unionstatefp.3.d:0 "今天，我们收到了柏林方面对美国申请加入帝国公约的回复。不出所料，德国同意让我们的政府加入他们的军事联盟。德方还附上了一张请柬，邀请我们加入中欧经济同盟，而我方还尚未对此做出回复。不管怎么说，美国和德国如今都在这世界的混沌之海中同舟共济，愿双方友谊天长地久！"
 unionstatefp.3.a:0 "为德皇干杯！"
 unionstatefp.4.t:0 "德国拒绝！"
 unionstatefp.4.d:0 "今天，我们收到了柏林方面对美国申请加入帝国公约的回复。不出所料，德国拒绝让我们的政府加入他们的军事联盟。对此，[root.getleader]已开始悄悄撤回和德国的种种合作承诺——反正我们也不需要德国！"
 unionstatefp.4.a:0 "反正我们也不需要他们……"
 unionstatefp.5.t:0 "接触“红色”阿根廷"
 unionstatefp.5.d:0 "布宜诺斯艾利斯已经沦陷，北阿根廷政权也随之倒台，不得不承认，南美的最南一角将不复往日。世界真是奇妙，多年的争战过后，由无政府主义者、社会主义者、共产主义者和寻常匪徒组成的所谓“巴塔哥尼亚工人阵线”杂牌军竟一跃成了统一阿根廷的正统势力。原先只是被世界各国简单称为“红色阿根廷”的这一改组国家如今引起了我们国务院的重视，许多政府人士纷纷要求发兵干预阿根廷，迎回前政权，但我们很清楚，这是前合众国惯用的招数，与我们的身份不符。联盟国是一个全新的政治实体，它对待拉美同胞的态度是以和平为出发点的。为此，我们需决定要如何去接触布宜诺斯艾利斯蒸蒸日上的新政府。"
 unionstatefp.5.a:0 "建立正式外交关系"
 unionstatefp.5.b:0 "建立正式外交关系，并签订贸易协定"
 unionstatefp.5.c:0 "他们既是与我们平起平坐的一方势力，也是我们在南美的宝贵伙伴，邀请他们加入阵营！"
 unionstatefp.6.t:0 "[FROM.GetName]邀请我们加入其阵营"
 unionstatefp.6.d:0 "[FROM.GetName]近来向我们递出了橄榄枝，邀请我们加入其新组建的阵营：美洲人民联盟。他们承诺会保护美洲志同道合之国家的主权，保护我们不受欧洲帝国主义列强的侵犯。虽然这是结束我们国际孤立状态的大好机会，但这么做势必我们的外交政策也会处处受制。那么，我们应该如何回复呢？"
 unionstatefp.6.a:0 "为我们的美利坚新同志三呼万岁！"
 unionstatefp.6.b:0 "哼！谁稀罕美国的保护啊"
 unionstatefp.7.t:0 "[FROM.GetName]拒绝了！"
 unionstatefp.7.d:0 "[FROM.GetName]以不愿与资本主义国家有来往为由拒绝了我们的邀请。"
 unionstatefp.7.a:0 "唉"
 unionstatefp.7.b:0 "蹬鼻子上脸是吧！"



