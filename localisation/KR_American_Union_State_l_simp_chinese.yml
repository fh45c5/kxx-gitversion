 POLITICS_HARRY_S_TRUMAN_DESC:0 "哈里·S·杜鲁门，著名政治素人与为民请愿者，他的农业生涯似乎在大萧条和尘暴使他破产之前就已经结束了，而在此之前他就已经致富失败了一回。大家伙都喜欢这样的人，特别是如今美国看起来已经无药可救，还有谁比杜鲁门更像是美利坚最后的诚实者与义人呢？当杜鲁门成为反对派领袖，绝望的人民就像是看到了希望一样，纷纷为他的抨击而热烈鼓掌。也许，在杜鲁门的无畏领导下，美利坚仍然有些许救赎。\n\n哈哈哈有个屁，杜鲁门当初可是跟汤姆老大蹲同一条战壕的，也正是因为汤姆老大，才开始了政治生涯，说他是汤姆·彭德格斯特的第十一条手指也丝毫不为过。如今杜鲁门又在干什么？拉着一群咩咩叫的反对派，带头尽情咆哮，宣泄，用尽语源学里最富复仇心的词儿，让老百姓觉得还有些许期望，然后在大半夜从自家信箱偷偷取出彭德格斯特寄的巨额支票。汤姆老大与好小子杜鲁门的对角戏还要演很久很久呢，大概要直到一方挂掉才会停下吧，谁知道呢？"
 POLITICS_EARL_LONG_DESC:0 "厄尔·坎普·朗一直以来就像是他兄长的一道影子，忠诚地履行着血亲的责任，以家族和兄长为先，尽管他只比休伊·朗小两岁。休伊的其他兄弟要么对政治毫无兴趣，要么过于平庸，只有厄尔，顶着一颗精明的政治头脑，对一切都那么从容不迫，就像他生来就该干这个的一样。毫不夸张地说，“朗氏王朝”的奠基，与他的大胆密不可分。比起休伊的弟弟，他更像是休伊的继承人，更像是一位不那么讨国王喜欢的王子。\n\n现在，休伊·朗已经不在人世，厄尔走上了台前，接过了兄长的权杖。太阳落山后，月亮的光辉才显得瞩目。人们喜欢他，因为人们发现，厄尔很像他们，平日里的公众形象就是一个来自路易斯安那的乡巴佬，穿着短袖和背带裤，简单而直率，喜欢可乐和番茄酱，讲话还和喜剧演员一样可以轻易逗得人大笑。更重要的是，人们在厄尔身上看到了一个昔日的幻影，看到了休伊·朗，不是重兵环绕下，那个站在白宫前高呼“分享财富”的王鱼；而是在二十年前，那个站在州法院门前怒骂石油公司的休伊；那个步行在雨季泥泞的乡路上，帮一位农户要回土地的休伊；那个属于路易斯安那乡野和新奥尔良街巷的休伊。"
 POLITICS_EARL_LONG_RIGHT_DESC:0 "自从1932年被其兄弟休伊·朗拒绝任命为副州长后，厄尔·坎普·朗一直生活在兄弟的阴影之下。厄尔在国会以其进步政策而声名远扬，但也因支持至上党的权威凌驾于州政府而臭名昭著。\n\n作为休伊去世前多年就最为看好的继任者，厄尔继承了他哥哥的道路，推行和兄弟一样的改革议程，但在社会问题上更为保守和宽容。正是在厄尔·朗的领导下，休伊·朗的教育和福利改革才在这局势紧张的年代真正付诸实施。许多忠于他的兄弟的追随者认为，厄尔将会继续休伊所开启的事业。但也有一些人认为，厄尔不过是对他哥哥的拙劣模仿者。总而言之，厄尔·坎普·朗的政治前途将由休伊的遗产所决定，除非他能凭借自己的力量闯出自己的名声。"

TEX_AFP_politics_decisions:0 "至上党之航向"
 TEX_AFP_politics_decisions_desc:0 "\n内战结束后的联盟国政坛鱼龙混杂，各路意识形态不尽相同的政客，煽动家与极端分子在§7休伊·朗§!总统宣布将会举行选举后开始在各地如雨后春笋般涌出，意图在新到来的国家选举中赢得总统宝座。然而，除去如今看似一家独大的§1美利坚至上党§!外，拥有与§7休伊·朗§!逐鹿总统宝座的能力与希望的政党与政治家的数量堪称凤毛麟角。其中最受欢迎的政党则是来自威斯康星州的进步派人士§l菲利普·拉福莱特§!所领导的进步派政党§O国家进步党§!，该党以与§1美利坚至上党§!相似但更加进步的民粹主义路线而闻名，广受小市民，工人与乡村农民的欢迎。此外，在内战中表现突出的§6美国银色军团§!，或被称作§6银衫军§!的领导者，§6威廉·达德利·佩利§!，这个神秘而激进的作家与煽动家所组建的§B基督教党§!吸引了绝大多数美国保守主义者，同时他们的种族主义政策也讨好了大量的南方种族主义者。同样的，大量的基督教徒也选择投靠了§B基督教党§!以支持他们的信仰政策。此外，§2民主党§!与他们的支持者也熬过了内战的艰难岁月，并重建了各地的政治机器。有鉴于其强大的政治机器，在美国各州的号召力与仍存的大量成员，§2民主党§!也被广泛认为是执政党之位与总统宝座的有力竞争者。\n\n作为如今的执政党，§1美利坚至上党§!不仅要尽快将国家拉入正轨，完成重建工作，还必须要在即将到来的选举中击败其余党派。在这之前，§1美利坚至上党§!与§7休伊·朗§!总统必须先处理党内分歧。作为一个大帐篷式政党，§1美利坚至上党§!内部广包各路人马，从§M左翼民粹主义者§!到§L右翼民粹主义者§!，从§t温和左派§!到仅仅图一时之利的投机者，在党内已经很难达成一致。如果不迅速明确党的路线，§1美利坚至上党§!很有可能会输掉接下来的选举。当然，§7休伊·朗§!也明白，§1美利坚至上党§!作为一个大帐篷式政党，一旦走向过于§R极端§!的道路，极有可能会造成党的彻底分裂，甚至会导致更加严重的§R政治暴力事件§!发生...\n\n§R一旦如此，大厦将倾...§!\n\n"
