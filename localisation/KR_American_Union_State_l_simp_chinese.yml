 TEX_dewey_plan_idea_desc:0 "杜威计划，以传奇的贝拉米主义学者命名，目标是改革美国的教育。该计划的主要观点在于使教育成为一个更具互动性的事务，允许学生也参与到社会改革中来，将学校视为一个新的社会机构。此外，杜威强调教育不仅是学习知识，更是学习如何生活，这清楚地表明，杜威计划下的教育对于后代人来说将更加务实。"
 kr_winchester_western_tex:0 "温彻斯特速射武器"
 kr_smith_wesson_tex:0 "史密斯和威森"
 kr_remington_tex_desc:0 "由于担心东北地区日益激进的劳工运动可能会影响到企业的业务，杜邦化学公司准备迁移其子公司：雷明顿。在此过程中，为了争取到联邦政府的资金补贴，杜邦答应协助西部地区开发新的尖端弹药库。就这样，雷明顿于丹佛的新家中继续生产着和往日一样品质优良的枪械，但由于其和旧政权之间的关系，赢得胜利的联盟国政府始终放不下自己的戒心。"
 kr_harrington_richardson_tex:0 "哈林顿和理查森武器公司"
 kr_marlin_firearms_tex:0 "马林枪械"
 kr_marlin_firearms_tex_desc:0 "内战爆发之前的数十年里，马林公司一直在不断创下新低的业绩中苦苦挣扎。新英格兰政府出于战争目的的资助扭转了该公司的命运，并迅速使其在东北地区各大军火商中脱颖而出。联盟国政府在内战中获胜后，该公司获许继续经营并延续了之前的成功。"
 kr_western_cart_tex:0 "西部弹药公司"
 kr_fedlabs_tex:0 "联邦实验室"
 kr_fedlabs_tex_desc:0 "联邦实验室成立于匹兹堡附近，从事非致命武器和镇暴装备的生产。内战期间，实验室的管理者和所有者秘密地将所有机械设备收拾打包转运到了马里兰州的联邦政府控制区，开始为内战生产小型武器。联盟国胜利后不久，实验室就获得了特许，得以继续经营其生意。"
