 kr_mack_trucks_tex:0 "马克"
 kr_marmon_tex:0 "马蒙-赫灵顿"
 kr_stutz_tex_desc:0 "大萧条严重地打击了斯图兹汽车公司，近乎彻底摧毁了其高档汽车业务。不过，由于同南方存在着血缘联系，加之担忧原住民印第安人越来越不受掌控，公司决策层由是决定在佛罗里达州政府的财政补贴下将公司迁移至当地。"
