 TEX_lighning_joe_idea_4_desc:0 "如果我们的炮兵能与我军的其他地区以及彼此之间相互协调，我们就能掌握更加有效的轰炸敌人的手段。我们应该努力确保这一点，因为我们的“爆炸能量”可能会为我们赢得这场战争。"
 TEX_lighning_joe_idea_5_desc:0 "“闪电乔”认为我们应该把火力集中在敌人的某些部分，这样我们就可以在他们最脆弱的地方打开缺口，在他们最强的地方消耗他们的力量。我们的步兵可以利用这些缺口，而我们的坦克将粉碎敌人的防线。让我们走向胜利！"
 TEX_righteous_nation_desc:0 "我们公正地赢得了选举。我们的对手对此如何评论并不重要；我们是最受欢迎的党派，因此我们应该统治这个国家四年。尽管这未能得以实现，但我国人民并没有忘记我们作为选举中真正胜利者的地位，我们应该趁此次胜利的记忆还未被遗忘时从中获益。前往华盛顿！"
 TEX_new_bonnie_prince:0 "新邦尼王子"
 TEX_catholic_monarchy_declared:0 "神圣美利坚联盟掌权"
 TEX_new_treaty_of_tordesillas_idea:0 "新托尔德西里亚斯条约"
 TEX_new_treaty_of_tordesillas_idea_desc:0 "正如1494年西班牙和葡萄牙在教宗的祝福下将世界一分为二，向异教徒土著们传播信仰一样，如今，葡萄牙和神圣美利坚联盟也在教宗的祝福下同意将新世界一分为二。虽然英国圣公会和无神论者可能会嘲笑我们，但南北美洲的人民正在呼吁回归真理，回归理智，回归传统。我们的主听见了以色列人在埃及作奴仆时的呼求，差遣摩西解救他们，如今也听见了美洲人的呼求。卡罗尔和拉波索，新时代的摩西，为了用真信解放美洲人民而团结起来，直到所有人都可以自由和平地敬拜上帝之前，他们都不会停下来。"
 TEX_philipregent_idea:0 "卡罗尔摄政王"
 TEX_invited_country:0 "同[From.GetName]的谈判正在进行"
 TEX_integrate_the_dominions:0 "合并附庸国"
 TEX_integrate_the_dominions_desc:0 "在正义的美洲十字军东征中我们的附庸国光荣地为我们服务。现在是时候把他们涌入帝国的怀抱，真正实现菲利普治下的和平了。"
 TEX_Le_May_reform_plan1:0 "庞德空军改革计划"
 TEX_Le_May_reform_plan1_desc:0 "庞德计划第一步是激发空军的战斗精神。对空中的叛国者们不需要再怀抱绅士精神。"
 TEX_Le_May_reform_plan2:0 "庞德空军改革计划"
 TEX_Le_May_reform_plan2_desc:0 "庞德计划的第二步是评估敌方领土上最重要的工业目标。如果我们不能迅速取得胜利，将会有更多的人丧生。"
