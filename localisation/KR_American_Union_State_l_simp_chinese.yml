 kr_nash_tex:0 "纳什汽车"
 kr_cunningham_tex_desc:0 "在新英格兰政府的慷慨解囊下，坎宁安公司摆脱了破产的宿命。虽然其在坦克研发领域的“一腔热血”并没有取得多少成果，但轻型装甲载具才是新生坎宁安公司的主业与成功之命脉，联盟国胜利后也依旧如此。"
 kr_american_car_tex:0 "美国汽车和铸造公司"
 kr_jackson_tex:0 "杰克逊"
 kr_dorris_tex_desc:0 "曾经的多里斯汽车公司的破产对于濒临崩溃的圣路易斯汽车工业来说是一记重击。内战爆发后，旧多里斯公司的厂房被当地的资本家接管，用以生产联邦政府急需的战争机器。联盟国获胜后，该公司获得了恢复运营的许可，其坦克制造与民用载具的生产线也随之迅速恢复。"
