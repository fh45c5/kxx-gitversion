l_simp_chinese:
 AUS:0 "美利坚联盟国国策树"
 CAL_civil_war_victor:0 "赢得内战，且未签订停火协议"
TEX_huey_win:0 "新华盛顿"
 TEX_huey_win_desc:0 "一切尘埃落定，休伊·朗与他的美利坚至上党做到了这一切。自在堪萨斯州诞生以来，民粹主义长久以来遭受嘲笑，甚至惨遭忽视，但人民之声是绝不会被历史所忽视的。如今，民粹主义的呼声与支持者达到了历史的最巅峰，而这一切，都多亏了我们的“新华盛顿”休伊·朗。众多党员们与追随者都相信，只要朗为我们掌舵，至上党就永远不会迷失方向！从现在开始到世纪的尽头，我们将战胜贫困，战胜不公，使美国成为它本该是的样子。人人皆国王！"
 TEX_AFP_future:0 "探索前路"
 TEX_AFP_future_desc:0 "现在，国家已经安全了，但并不代表在政府内外就没有我们的反对者。全国各地的政治秩序崩溃成一团乱麻，我们急需足够的人手与熟练的行政官僚来接管各地行政事务。但令人沮丧又不出意料的是，我们目前的能力绝对不足以达成这个条件。因此，我们必须尽快决定党的未来路线，以保证我们能尽快拉拢到足够的盟友共同处理目前的棘手情况。"
 TEX_long_follower:0 "维系基本盘"
 TEX_long_follower_desc:0 "为了保住我们来之不易的政权，我们必须确保在至上党内，没有密谋反对总统的密谋者，也没有私通在野党的叛徒。对于每一位支持我们的党员与选民，我们必须尽可能地向他们示好，满足他们所提出的议题或是提案，至少让他们觉得朗总统与至上党代表了他们的利益。只有这样，我们才能够保证在下一次选举中击败其余的竞争对手。"
 TEX_work_with_right:0 "接触右派"
 TEX_work_with_right_desc:0 "随着我们平定了旧民主党的势力范围，这个垂垂老矣却仍然张牙舞爪的腐朽党派已经成为了历史的一个名词。但在南方，旧民主党的政治机器仍然存在，并仍然在某些小城悄悄运作。此外，相当一部分的极右翼分子正潜伏起来，随时准备给予我们新生的政权致命一击。历史上，南北战争结束后，联邦政府没有费心去管教南部政权的残留余党，而这些残存分子很快卷土重来，我们不能重蹈覆辙。很快，至上党就将吸纳绝大部分温和的旧民主党成员，来让这些人控制仍然在运行的旧民主党政治机器。同时，我们的善意姿态将吸引更多的有意投降的右翼分子来加入我们。而对于那些顽固的极右翼分子，像是西蒙斯这种3k党徒，我们也可以联合旧民主党中他们的联络者来将这些人一网打尽。"
 TEX_work_with_left:0 "与左派和解"
 TEX_work_with_left_desc:0 "联合工团试图推翻美国宪法，拥抱反美的工团主义，我们是永远不会接受的，但是那些支持他们的工人们怀抱的不满却没有任何错。过去的美国政府依赖于大资本家与恶毒的金融投机者而活，而这种畸形的政治制度逼迫着平民百姓遭受工团匪徒们的欺骗。大量的温和的左翼人士带着朴素的为美国公民发声的愿望被欺骗着加入了赤匪的阵营。如今，我们应该对渴望经济改革的独立联盟和美利坚劳工联合会以及所有温和的和善的美国左翼人士作出呼吁，我们知道早在战争爆发前他们就想过和休伊合作，但是极端激进分子点燃了战火。我们现在要争取这些左翼分子的支持。"
 TEX_begin_reconstruction:0 "财富分享计划"
 TEX_begin_reconstruction_desc:0 "导致美国陷入内战的富人们该付出代价了，正是这些富豪吸干了美国的财富，导致了大萧条对美国的重击。休伊·朗曾在战前就提出过财富分享的计划，即超过 100 万美元的财富将按 1% 的税率征税;超过 200 万美元的财富将按 2% 的税率征税，依此类推，直到100%的税率。而年收入限制被限制在了100万美元，遗产上限泽则规定为500万美元。而多出来的税金则会被用回到美国公民身上，每个家庭都能获得至少五千美元的家庭财产，同时还能被确保每年最低2000美元的年收入。"
 TEX_Reward_for_loyalty:0 "忠诚的回报"
 TEX_Reward_for_loyalty_desc:0 "美利坚至上党与休伊·朗，在过去只是被认为会在内战中迅速出局的民粹暴君。然而历史已经证明了朗与朗主义的正确性。休伊·朗能有今天的成就与地位，完全得益于他的忠诚追随者们的不懈付出与牺牲。\n\n在战争中，大量的一分钟人民兵们为了他们敬爱的朗州长赴汤蹈火，而在政府中，忠诚的追随者们或是散尽财富，或是在政府中尽心竭力的工作。而几位战前的准军事组织团体的领袖们也带领着自己的追随者在战场或是后方为朗与至上党冲锋陷阵或是维持秩序。\n\n而现在，随着甜美的胜利的到来，忠诚的付出也定将会得到回报。"
 TEX_determine_wealth_ceiling:0 "明确财富限额"
 TEX_determine_wealth_ceiling_desc:0 "在美国，资本家们长久以来把控着经济的要害，无论是经济繁荣或是危机期间，他们都趴在广大的美国公民身上贪婪的吸取着利润与财富。有鉴于此，我们决定实施新的财富上限制度，以确保在美国不会出现20%的富豪占有全国80%甚至更多的财富。\n\n在规定的期限内，全国各地的富豪与资本家们都需要彻底的统计出他们的资产并汇报到联邦政府，并在随后服从由政府下达的财富限额标准。对于那些听话的人，至上党政府将保证他们不会受到生命上的威胁，也能够保持着一定程度的富有的生活。但对于那些拒不服从甚至筹划逃离的贪婪者，等待他们的没有法庭，只有一分钟人的枪口。"
 TEX_Agricultural_subsidy:0 "农业补贴"
 TEX_Agricultural_subsidy_desc:0 "作为新大陆的主人，美利坚一直是世界上农业最发达的几个国家之一。但这一切都在大萧条与黑色星期一中被摧毁了。如今衰弱的美国农业急需我们去拯救。政府很快将推出法案，通过各式的补贴与价格调控来支援我们的农民，这样他们在种植美国需要的商品时就不会赔钱，并且政府会在经济繁荣时期加倍购买多余商品作为储备库存。"
 TEX_Dismemberment_of_oligarchs:0 "肢解寡头"
 TEX_Dismemberment_of_oligarchs_desc:0 "财富分享计划已经成功的整顿了美国的金融秩序，大量的投机客与富豪被我们惩罚，而那些被他们侵吞的美国人民的财富也被他们吐了出来。但如今的国内，仍然有大量的大型企业通过各种各种各样的方式逃脱资产检查与追缴。一分钟人将以最迅速的行动控制住这些大寡头，而来自政府与至上党的金融学家与管理人员将逐个将这些大企业彻底拆分，或是变成国有企业，或是被拆分业务变成数个小型企业加入到市场竞争当中。"
 TEX_promote_coughlin:0 "库林格之口"
 TEX_promote_coughlin_desc:0 "库林格神父，在战前就已经是闻名全国的布道者，神父与宣传煽动家。在他的广播节目《黄金时刻》中，库林格神父通过他极富感染力与煽动力的话语感染了许许多多的心怀正义的美国公民们。在内战中，库林格神父加入了至上党，并成为了联盟国最为重要的宣传家与发言人。\n\n随着内战的胜利与政权的稳定，库林格神父继续在电台中作为党内的宣传部长对全国开展他的演说。尽管他的言论在党内的部分人看来显得有些过于激进，但整体上他的政治思想与朗的民粹主义理念高度重合。\n\n在如今，全国有三分之一的人收听他的广播，而“黄金时段”办公室每周收到多达8万封听众来信。我们必须进一步通过电台神父的影响力，来让国家与党的路线与思想为更多的国民所认同。只有民众支持我们的事业，国家的未来才能稳步发展。"
 TEX_bring_new_blood_to_Minutemen:0 "为一分钟人注入新鲜血液"
 TEX_bring_new_blood_to_Minutemen_desc:0 "作为至上党与休伊·朗在内战中的最重要的武装力量，一分钟人可以说是功勋卓著。在内战结束后，相当多的一分钟人老兵复员加入了建设国家的运动中去，而一分钟人各级指挥官也有相当一部分加入了国防部，陆军或是政府担当官职。如今的一分钟人仅仅规模是其鼎盛时期的三分之一。为了挽救这支功勋卓著的武装力量，朗总统将调拨专款来为一分钟人招募更多成员并接受更加严格的训练，使用更加先进的装备。这样，一旦联盟国的国家安全受到威胁，一分钟人就能再次挺身而出保卫国家。"
 TEX_american_progress:0 "聚焦报业传媒"
 TEX_american_progress_desc:0 "内战前，为了广泛宣扬自己的民粹主义理念，休伊·朗总统曾经开办过一份名叫《美国进步报》的报纸。这份报纸后来作为美利坚至上党的党报，在路易斯安那州与周边各州广受欢迎。如今，休伊·朗的愿景在美国已成显示，而作为党报的《美国进步报》也必须扩大自己的销售与读者圈子。以达到作为总统和党面向全国的喉舌的作用。美国进步报将得到总统的支持，迅速普及全国，散播我党的言论，并取代《纽约时报》成为记录我们国家发展的报纸。"
 TEX_religion_relation:0 "宗教联系"
 TEX_religion_relation_desc:0 "在美国，绝大多数公民都有着自己的信仰，而其中绝大多数人都信仰着基督教。无论是新教还是天主教或是其余的宗派，联盟国与至上党应该可以被说是与这些人联系最为紧密的内战势力。尽管如今我们已经赢得了内战的胜利，但为了国家的稳定，也为了至上党与总统的选票，我们将通过各种方法，例如继续加强神父库林格在政府与党内的地位来加深与基督信徒们的联系，确保这些虔诚者无论何时何地都能支持我们。"
 TEX_long_political_machine:0 "朗氏政治机器"
 TEX_long_political_machine_desc:0 "内战前，休伊·朗的路易斯安那政治机器就是他能够统治路易斯安那的最好武器，同时也是他在1936年竞争总统宝座的最佳帮手。如今，为了继续带领美利坚至上党稳坐白宫宝座，朗总统将继续强化忠于他的政治机器，来保证在接下来的大选中的万无一失的胜利。"
 TEX_Speaker_and_doer:0 "演说家与实干家"
 TEX_Speaker_and_doer_desc:0 "在成为一名真正的政府领袖前，休伊·朗就以他极具煽动性与感染力的演说吸引了大量的他的追随者。而在成为了路易斯安那州长后，朗又以他独特的实用主义与现实主义为路易斯安那的人民们服务。事实证明，一个充满魅力的演说家与脚踏实地的实干家是能够同时共存的。如今，朗总统将继续这种行事风格，并用他独特的魅力吸引选民，为他们服务。"
 TEX_Labor_economy:0 "大众经济"
 TEX_Labor_economy_desc:0 "我们不能继续依赖奄奄一息的传统经济系统，必须支持真正的劳动友好型经济。过去的美国经济正是由于轻视了劳动者与平民能够带来的经济效益而崩溃的。为了从根本上避免今后再次出现大萧条那般可怕的经济危机，政府将会推出政策，保证失业的公民将能够注册上岗联邦政府提供的职位，来生产所需的用品，并在委员会的计算安排下进行交易。"
 TEX_Keynesian_economy:0 "为凯恩斯主义经济添砖加瓦"
 TEX_Keynesian_economy_desc:0 "政府必须确保美国人民不再遭受大萧条时期那样的痛苦，而正是自由放任的无序经济造成了这一切。无心也无能力拯救经济的胡佛几乎摧毁了美国，因此，我们将效仿进步派的经济政策，采纳约翰·梅纳德·凯恩斯的建议，以宽松财政政策作为对抗失业的工具。同时大量的国家工程将会上马，以确保我们有足够的岗位来消除国内的失业。"
 TEX_Cooperative_economy:0 "乡村合作社"
 TEX_Cooperative_economy_desc:0 "美国的勤劳农民在大萧条与黑色星期一中受到的伤害丝毫不比城市居民们小，而随后的内战更是使我国的农民的生存雪上加霜。为了尽快解决我国的农业问题，使美国再度成为世界首屈一指的农业大国，我们将在农村地区建立合作社，以帮助农民调配包括种子，化肥，机械化农机等工具，同时也为他们的农产品寻找销路，以此保证他们的生活。"
 TEX_Absorb_Federalism:0 "吸纳产联会伙伴"
 TEX_Absorb_Federalism_desc:0 "既然我们已经决定与那些不那么激进的左派和解，那么就不可避免地一定会与I.W.W，这个美国最大的左翼组织的成员有所交集。尽管I.W.W的成员们大部分都是美利坚联合工团的走狗与死忠，但其中仍然有一定数量的贝拉米主义者，社会民主主义者愿意与我们达成一致，我们也应该接受这些来自I.W.W的伙伴。"
 TEX_Sliver_Shirts_support:0 "银衫军支持"
 TEX_Sliver_Shirts_support_desc:0 "尽管我们尽最大努力尝试尽快将国内恢复秩序，但以目前的进度来看，有鉴于国内仍然居高不下的犯罪率与失业率，这个目标仍然难以在短期内实现。此时，银衫军向我们表达了他们的善意，而他们也在内战时站在我们一方帮助我们赢得内战。因此，与这些军事组织接触肯定是有助于我们更快的在国内恢复秩序，但他们也一定会向我们提出要求作为回报。"
 TEX_stable_south:0 "稳定的南方"
 TEX_stable_south_desc:0 "南方民主党的政治机器已经输掉了战争，并最终匍匐于朗的脚下。他们已经呼吁自己的地区支持朗，换取朗允许他们在南部的维持，并给予些许自治权。只要南方愿意清除激进反政府分子并承担责任，就没有必要进一步扰乱南方。他们现在是至上党可靠的票仓，白人联盟反对派的数量正逐渐减少。"
 TEX_loyalty_long_family:0 "忠诚的朗氏家族"
 TEX_loyalty_long_family_desc:0 "无论是在内战前后，朗忠诚的亲人们始终站在他的身后帮助这位“现代华盛顿”实现他的愿景。无论是州长生涯，或是竞选事务，又或者是如今统治国家，朗的兄弟与妻子都始终为他服务。而作为回报，朗将会把政府中一些重要无比的官职赏赐给自己的亲人。既是对他们的奖赏，也为了保证自己对政府官僚们的掌控能力。"
 TEX_Progressive_principle:0 "进步主义纲领"
 TEX_Progressive_principle_desc:0 "在美利坚至上党与休伊·朗本人的治国纲领中，在民粹主义之外，也掺杂了一部分美国进步派的思想与做法。而如今，新的至上党走在了进步主义与激进主义的道路上，过去的进步主义内容就将被扩大并成为全党全国的主流。而新国家也会走在进步主义的大道上。"
 TEX_New_Bank:0 "华尔街大扫除"
 TEX_New_Bank_desc:0 "华尔街这一金融标杆曾经是美国经济的灯塔，但同时也是这些毫无下限的银行家们造就了金融业的不稳定。在这些贪婪者的腐蚀下，任何一场金融危机都可能直接击垮美国经济。如今，银行业的人民掌控计划终于可以开始了！我们将建立一个掌控整个银行业的中央银行，其董事会由人民直接选举产生，各地方银行的职员同样也将被直接选举出来，以管理地方银行中未被中央银行直接收回的那部分业务。银行家们将仅仅作为管理银行的人员来行使他们微不足道的权力，仅此而已。人民来决定其他的事情。"
 TEX_Townsend_Plan:0 "汤森计划"
 TEX_Townsend_Plan_desc:0 "如今的美国百废待兴，大量失去子孙的无法自食其力的孤寡老人得不到应有的抚养，而这不是一个关怀人的社会应当发生的事。\n\n弗朗西斯·汤森，来自加利福尼亚的人道主义者，他曾经在1933年向联邦政府提出了一项养老金计划，以此来缓解大萧条对美国民众与社会的打击。然而受限于萎缩的联邦财政情况，这项提案最终不了了之。这项提案提出，通过一项全国规模的销售税来为60岁以上的遵纪守法的老人们提供每月提供必须在当月花掉的200美元养老金补贴，以此来保证老无所依的公民也能够收到照顾。\n\n现在汤森医生已经在我们的政府中任职，而这项养老金计划也被再次提上日程。很快，朗总统与他的顾问们将会根据如今的国家财政状况指定一个全新的汤森计划草案。"
 TEX_public_education:0 "大众教育"
 TEX_public_education_desc:0 "在这个伟大的国家，还有数以百万计的儿童在努力脱离残酷的内战阴影，试图恢复他们的正常生活，然而他们面临的未来并不比他们没有受过教育的父母更好。大量的儿童与青少年在内战前都没有受到应得的基础教育，这使得他们其中的相当一部分人足以被称为是文盲。我们的总统批准并要求国会加速通过新的教育法案，为有需要的美国人重建学校，重开大学。"
 TEX_position_of_minutemen:0 "一分钟人何去何从？"
 TEX_position_of_minutemen_desc:0 "如今内战结束，全国都在努力的走出内战的阴影，而此时，为我们付出了血与泪的一分钟人们的地位就变得有些尴尬。作为一个准军事组织，大量的收到正规军事训练的老兵们有些选择了退役，而还有一部分人选择留在了一分钟人中为政府效力。目前，这些老兵只听从休伊·朗本人的指令，但作为一个正常运转的国家来说，如此独立的军事机关必须有所限制。"       
 TEX_true_American_spirit:0 "真正的美式精神"
 TEX_true_American_spirit_desc:0 "是时候回归真正的国父愿景了。过去一系列加强政府职能的举措毫无疑问是在刨空美利坚的民主根基。过去的一系列的强化政府权力都是在用极权主义与独裁浪潮侵蚀美利坚这个民主灯塔。从现在开始，朗总统的政府将会逐渐缓慢的将政府权力一点点消减，并一点点将华盛顿，汉密尔顿，杰克逊等国父的精神遗产带回美国。"
 TEX_People_council:0 "人民委员会"
 TEX_People_council_desc:0 "随着政权的稳定，党的中高层逐渐开始脱离群众。越来越多的腐败与受贿出现在党内，严重影响了至上党在选民中的声誉。为了解决这一状况，受路易斯安那州司法辖区的启发，总统创建了一个名为“人民委员会”的准法律代表实体。作为无党派公众论坛，它允许至上党与美国人民进行更多直接而面对面的交流，并热心地听取那些政治家们所不愿接触提及的问题。同时人民委员会的成员作为代表，有权利向地方当局检举至上党党内的一切违法犯罪。"
 TEX_Supervise_election:0 "监督选举"
 TEX_Supervise_election_desc:0 "随着时间的推移，距离休伊·朗向公众承诺的大选时间也越来越近。在全国各地各种政党活动与初选都在激烈的筹划中，而这种态势实际上是党内许多人所不愿意看见的。党内许多人士都在要求对其他党派的竞选活动与党内初选加以限制或是阻止他们。同时一部分更加激进的党员也暗示在接下来的大选中我们需要操弄各地的政治机器来为我们赢取优势。"    
 TEX_A_fighter:0 "枪火与玫瑰"
 TEX_A_fighter_desc:0 "现在，至上党已经坚定的走在了进步主义的左翼道路上，但我们的纯洁性与成员立场始终受到质疑。自然，对于我们的支持者我们将给予笑脸与玫瑰，以此感谢他们的支持与奉献。但同时，对于党内的叛徒与阴谋家，我们作为休伊·朗总统的战士，必须拿起武器保卫我们的事业。"
 TEX_A_devout_person:0 "州权"
 TEX_A_devout_person_desc:0 "与旧民主党那些保守派合作许久后，那些保守主义者与传统主义者向朗总统提出了他们长久以来的一个关键诉求，即确保州的独立地位与州长的独特职权。这些旧民主党人在战后大多继续在南方担任州政府官员，如今他们提出如此要求很明显是在向至上党施压以强化旧民主党的影响力与独立性。如果总统同意他们的要求，无疑会丧失对这些保守派的限制。但如果驳回，又势必会加剧彼此间的裂痕。"
 TEX_owner_of_government:0 "政府的真正主人"
 TEX_owner_of_government_desc:0 "在华盛顿的走廊中，有太多只会在听证会上念稿、在宴会上举杯的“政治家”。他们的书柜中塞满了法律教科书，心里却装着大银行的账本。可真正的国家权力，从不属于这群温文尔雅的“人民代表”，而应属于为这片土地挥汗、流血、饿肚子的人。而毫无疑问，朗与美利坚至上党代表了这些无法发声的大多数的利益。美利坚至上党拨开了长久以来由其余党派缠绕在政府机关上的藤蔓，真正的把属于政府的权力还给了民众们。但国家的现状并不允许我们直接的把权力归还于民，因此毫无疑问，至上党的成员必须彻底地掌握政府，以避免其余党派染指本属于民众的权力。"
 TEX_senator_of_Louisiana:0 "路易斯安那的参议员"
 TEX_senator_of_Louisiana_desc:0 "曾几何时，在国会冗长的辩论声中，有一道来自南方的洪亮嗓音不断响起，质问权贵、疾呼改革，那是路易斯安那州的休伊·朗。作为这个国家最具争议却也最被底层民众铭记的参议员。他不曾屈服于任何党派纪律与经济利益，而是高举财富分享与社会公义的旗帜，用他的怒火灼烧腐朽制度的表皮。\n\n如今，朗总统将带着他在国会的战斗记忆，回归这座曾容不下他的殿堂。他将重塑国会的结构与运行方式，削弱旧势力的阻挠，并提拔真正能代表工人、农民与士兵意志的新一代代表。他仍是那位来自巴吞鲁日的议员，只不过这一次，他是以国家领导人的身份发言。"
 TEX_Adjust_racial_law:0 "调整种族法"
 TEX_Adjust_racial_law_desc:0 "由于我们对旧民主党的彻底打击和取而代之，至上党在全国黑人中赢得了积极的声誉。尽管休伊·朗曾在民权问题上态度暧昧，但现在他愿意以牺牲南方的地主精英为代价，增加对黑人社区的支持。同时，党对白人联盟与3k党徒毫不留情的镇压手段与态度，使得全国范围内的种族暴力犯罪事件大幅降低。吉姆·克劳法这种时代的垃圾也要被我们扔进垃圾堆了。至上党在黑人中的支持者正在前所未见的迅速增加。"
 TEX_Public_services:0 "公共服务人人享"
 TEX_Public_services_desc:0 "朗在担任路易斯安那州的州长期间，他组织为全州人民修建了长度惊人高速公路，使路易斯安那的基础建设大大改善。这也是他一直以来倡导的，即将基础设施建设与公共服务在全国范围内大规模建设，以保证全国的基础设施现代化。只有每一位美国公民都享受到了足够的公共服务，他们才会真心实意的支持我们的统治。"
 TEX_cooperative:0 "福利时代"
 TEX_cooperative_desc:0 "痛苦的大萧条与黑色星期一已经随风而逝，内战的苦痛与辛酸也逐渐从人们的心中淡去。越来越多的人开始走出重建时代，步入新的生活。为了确保每一位美国人都能触及我们所许下的美好生活的承诺，政府将颁布一系列法案，将我们从为富不仁的大富豪与资本家手中夺回的属于人民的财富再以各种的社会福利与保障回馈到人民身上。如今的美国，正在大步走向一个历史上从未有过的福利时代。"
 TEX_status_of_opposition:0 "反对派的地位"
 TEX_status_of_opposition_desc:0 "朗与美利坚至上党对美国的统治已经稳定下来，但仍然有诸多的反对党在暗中积蓄力量，准备在下一次全国大选中击败我们。为了从根本上避免这种情况，朗总统已经批准了一项法案，该法案将在野党们在全国各地的的竞选活动规模与相关人员作出限制，以确保这些反对党不会把竞选的声势拉的太大。同时，针对参众两院中的反对党议员们，朗总统将会逐个击破并尽可能地将他们拉拢到我们这一边来。"
 TEX_Maintain_populist_platform:0 "维持民粹主义纲领"
 TEX_Maintain_populist_platform_desc:0 "在战前，休伊·朗总统曾在路易斯安那任职州长时，就被广泛誉为“穷人的民粹主义捍卫者”，或是被反对者称为“民粹主义的煽动家”。但不论是担任州长时，还是率领美利坚至上党在1936年竞争总统宝座时，朗的民粹主义路线始终是他能够赢得胜利的关键武器。\n\n不幸的是，如今的国家政府与至上党党内，已经不再是战前的民粹主义大本营。如今，左派分子，南方民主党人，极右翼分子，或是过去的政府建制派都以各种各样的形式混杂在我们的队伍中。有些人只为混口饭吃，而有些人则是筹谋力量，蓄意暗中破坏我们的事业。\n\n面对此情此景，朗总统已经明确了自己的态度并作出了回答：他已经准备进一步提拔包括杰拉尔德·L·K·史密斯，约翰·B·福内特与詹姆斯·诺伊等人作为至上党的中坚力量，以维持党的团结与路线。"
 TEX_no_poor:0 "贫困不应出现于此"
 TEX_no_poor_desc:0 "美利坚已经逃出了内战所带来的伤痛的深渊，国家的所有阶层所有职业的公民们都在期待着欣欣向荣的未来日子，而我们也绝不会让他们失望。从现在开始，一个完善的社会保障与救济系统将被建立，而国家也将会保障每一个失业或是无法劳动的公民得到应有的救济与一份合适的新工作。很快，总统就可以自豪的宣布，在美利坚，只要一位公民肯脚踏实地的劳动，那么贫困的灾难就将永远离他而去。"
 TEX_Perfect_Democracy:0 "完美民主"
 TEX_Perfect_Democracy_desc:0 "1789年，我们最初的宪法试图在美国建立一个“完美的联邦”。然而这个联邦的实验已经被确定失败了，旧美利坚也因此灭亡了，但是通过休伊·朗总统，一个传承了美国精神的新美利坚却应运而生。总统与他的人民一致认为，如今的宪法是一份领导美国走向“完美民主”的纲领文件。它将驱动于美国人民不屈的意志，践行于总统的勇敢实践。国会选举和司法系统现在受商界的影响被压到了最低，并将作为独立于行政部门的实体重新启用。"
 TEX_emperor_president:0 "帝王总统"
 TEX_emperor_president_desc:0 "随着叛国者纷纷被曝光后连根拔起，民意调查显示，绝大多数公民都支持休·伊朗总统连任。为了避免新生的国家受到来自美利坚的叛徒们的威胁，也为了使政府不受短视的新闻媒体的约束，不受美利坚至上党内部成员的威胁，休伊·朗已经开始其所谓的“帝王式总统制”。两届任期的限制被恭敬地废除，他能够一直连任到一位地位相对较低的人被允许接替他掌权。"

TEX_pelley_win:0 "基督教党胜利"
 TEX_pelley_win_desc:0 "休伊·朗和至上党在美国内战结束后的第一次选举中失利，这一结果震惊了国内外的观察者。而威廉·达德利·佩利，基督教党主席兼银色军团团长，在国会赢得了微多数席，登上了美国的最高层。许多观察家与民众都想看看这个曾经的好莱坞失败编剧与神秘学专家究竟能为美国带来何等的改变。"
 TEX_Willard_Kemp_be_chosen:0 "威拉德·坎普，左膀右臂"
 TEX_Willard_Kemp_be_chosen_desc:0 "无论在何时，佩利忠诚的副手，合作者，追随者，威拉德·坎普始终坚定不移的执行来自大首长的一切指示，而这样的忠诚也必将会得到应有的回报。佩利总统已经指示了由坎普作为新政府的副总统，同时史无前例的将他也同时任命为国务卿。在外界看来，这无疑是新总统专制倾向的显现。但在基督教党人眼中，这仅仅是总统对追随者们的忠心的奖赏。"
 TEX_Defend_democratic_tradition:0 "保卫民主传统"
 TEX_Defend_democratic_tradition_desc:0 "佩利总统在当选前有很多称号。银色军团团长，工团主义者，民粹主义暴君等等……然而，佩利一直声称致力于维护美利坚共和国及其价值观。为了向异见者们证明基督教党与佩利总统不想也不会摧毁美国的民主传统，我们将实施一项司法法案，实现我们对陪审团制和法院权力的承诺，并加大对腐败的惩罚力度。同时，我们不会对选举制度与三权分立制度做出破坏性的改变。"
 TEX_guardian_under_red_tide:0 "赤潮下的卫士"
 TEX_guardian_under_red_tide_desc:0 "社会主义者试图摧毁我们的国家，这证明了佩利总统的猜忌的正确性，我们不能允许这些叛国者合法地散播污秽。所有马克思主义者、工团主义者、布尔什维主义者和其他声势浩大的革命左派团体将被视为违反法律的煽动者，这条法令即刻生效。有些国民可能会抱怨说，这种做法太过专制，但非常时刻需要非常的法律。"
 TEX_Smiths_Crusade:0 "杰拉尔德·史密斯的十字军"
 TEX_Smiths_Crusade_desc:0 "杰拉尔德·L·K·史密斯，这个野心勃勃的煽动家，凭借着与银衫军的紧密联系与佩利总统本人的信任得以跻身政坛高位。但实际上，史密斯其人可不是个安分守己忠诚不二的好战友。在成为了统管国家的二把手后，史密斯就开始了他的计划。假以时日，这位“仇恨大臣”将会在银衫军中拉出一支只效忠于他本人的队伍，一支引导美国未来方向的十字军。至于威廉·达德利·佩利，他的设想与组织的确有可取之处，但他懦弱而可笑的领导者身份对史密斯来说毫无疑问拖累了整个国家。在史密斯谋划的未来中，也许并没有他的位置。"
 TEX_Political_re_education:0 "政治再教育"
 TEX_Political_re_education_desc:0 "尽管联合工团的领导者是一群恶到骨子里的货色，但我们能看到支持工团主义的民众只是希望自家的餐桌上有足够的面包。因此，我们将指示司法部开始整理目前被监禁的非主要的激进分子名单，给予他们宽大处理，换取他们放弃以前的信仰，并公开发表反对社会主义的声明。"
 TEX_Write_new_federal_constitution:0 "撰写新联邦宪法"
 TEX_Write_new_federal_constitution_desc:0 "旧宪法，是一个早已裂缝遍布的建筑，它让国家分裂、放纵精英、漠视信仰。而如今，在国家百废待兴的时刻，重建美国必须从重建其根本法开始。新宪法委员会将在全国召集代表，来自小镇教堂、退伍军人组织与传统家庭的忠诚公民将聚集一堂，为这个国家书写一部真正属于人民与上帝的宪章。这将不再是一部空洞的权力清单，而是一项道德纲领，规范国家机器、提升社会美德，并为未来奠定精神与秩序的基石。"
 TEX_Christian_Federation:0 "基督联邦"
 TEX_Christian_Federation_desc:0 "是时候让佩利最伟大的理想付诸现实了。基督联邦是为将整个美国经济系统改造成一个混合系统所进行的一次巨大的改革。在这个体系中，私营企业仍然可以存在，但它们都将隶属于联邦公司并成为联邦公司的一部分。而且，所有的银行将被并入一个中央财政银行，该银行将负责分配贷款。"
 TEX_Stand_under_the_same_flag:0 "大进军"
 TEX_Stand_under_the_same_flag_desc:0 "尽管我们最近在政治领域大获成功，但在银色军团内部，内讧仍然遍地都是。地方上的银色军团指挥官抱怨高层的命令不一致，财务人员们贪污纳垢，逃兵越来越常见。这不仅对银色军团，而且对整个美国都是不可接受的坏事。总统将召集银色军团高层举行一场大会，正式确立一个更好的指挥系统。"
 TEX_Silver_people_arm_yourselves:0 "公民动员"
 TEX_Silver_people_arm_yourselves_desc:0 "国家的重建不仅仅依靠政府的政令或军队的秩序，它需要人民——每一个忠诚、虔诚、肯工作的美国人。杰拉尔德·L·K·史密斯始终坚定不移的笃信，国家动员不仅是物资与武器的调动，更是民心与精神的重组。只有虔诚而不畏牺牲的忠诚公民才能维护我们来之不易的政权。\n\n我们将启动“国家服务计划”，整合志愿团体、宗教社群与退伍军人组织，通过教育、劳动与守望相助的形式，在全国范围内激发起一股建设与信仰并重的运动。我们不是为了战争动员，而是为了国家复兴动员。"
 TEX_all_pervasive_investigation_bureau:0 "无孔不入的调查局"
 TEX_all_pervasive_investigation_bureau_desc:0 "像联邦调查局这样的政府机构在内战中不可避免地遭到了破坏。尽管调查局在1930年代对佩利曾怀有敌意，但总统还是看到了它的必要性和作用。只要调查局从胡佛和他阿谀奉承的小团体中解放出来并得到适当的监督，将有助于确保共和国的福祉和对我国伟大法律的维护！另外，佩利总统现在已经收到了在政府内与军团内有人将要对他不利的传闻，而他也将做出自己的回应。"
 TEX_National_Annual_Dividend:0 "国家年度红利"
 TEX_National_Annual_Dividend_desc:0 "随着联邦体系的初步完成，是时候迈入下一个雄心勃勃的阶段了。佩利政府宣布启动“国家年度红利”计划。在全国范围内，每个郡将设立或恢复由国家直接监管的国库银行。这些银行将不以利润为目标，而是服务公民的日常生活与急需之资。从今年开始，每一位土生土长或依法归化的美国公民都将获得一个国家身份码，并以此为基础，获得一张年度红利支票。每位美国人每年都将获得一定数量的信贷，以确保我们的国民不会遭受贫困之苦。这张支票不是施舍，而是联邦对人民贡献的回馈。无论你是工人、农民、母亲还是老兵，国家都将以信贷形式为你提供生活保障。这不仅将刺激本地经济，还将逐步让全国脱离对高利贷、信用公司的依赖，直到美国人不再需要依靠剥削性的银行体系来维持生计。"
 TEX_Swallow_up_One_minute_people:0 "新十字军"
 TEX_Swallow_up_One_minute_people_desc:0 "在佩利总统的指导，在史密斯首长的引领下，昔日的作为民兵组织的银衫军已经不复存在，取而代之的是一支踌躇满志坚定不移的保卫基督联邦理想的善战之军。这支新时代的十字军将会彻底的根除国内的一切反动势力，维持基督联邦的纯净无暇。当然，如有必要，目标也包括总统本人..."
 TEX_Cooperative_hands_in_support_of_farmers:0 "支援农民的合作之手"
 TEX_Cooperative_hands_in_support_of_farmers_desc:0 "战争与灾荒曾几度毁灭了美国农田，但这片土地的主人仍未放弃。佩利政府将以传统价值为依托，重建农村经济，并鼓励以基督教互助原则为基础的农民合作社。通过农机共享、谷物保价、地方市场对接等机制，我们将使农人之间不再是孤军奋战的个体，而是紧密相连的信仰共同体。这是对工团主义的拒绝，对资本主义掠夺的否定，更是对美国农业传统的回归。基督教党伸出的，是合作之手，而不是征税之掌。"
 TEX_Education_for_American_citizens:0 "为美国公民而来的教育"
 TEX_Education_for_American_citizens_desc:0 "对一个社会来说，下一代受良好教育不是必要之事吗？总统当然这么认为，而且全国的所有人都需要这么认为。为了国家的未来，佩利总统已经向国会提交了一份计划，通过直接拨款或是补贴等各种手段来保证每一个美国青年都能获得大学奖学金或中专学校招生，同时对于基础教育也会落实到每个美国儿童身上。我们将被年轻一辈交口称赞，同时美国的子孙后代将更有能力践行我们的伟大试验。"
 TEX_Implement_employment_registration:0 "落实就业注册"
 TEX_Implement_employment_registration_desc:0 "佩利依靠激进的经济提案获得了许多追随者，现在是时候开始实施这些宏伟的构想了。这项巨大的计划将从劳工部的大规模扩张开始：全国的每个州县，都将设立一个劳工部办公室。这将为改变美国经济的真正的惊人计划奠定基础。随着劳工部适当扩大，下至每个郡都拥有了一份当地企业和任何可能的职位的大名册，这份名册将会与该郡所有工人的名册进行匹配。至少可以说，劳工部将利用这一匹配确保每个美国人都能轻松、快速地找到工作，而当一个工人在一个郡实在找不到工作时，各郡的办事处将进行合作调配，努力为所有需要的人派发工作。"
 TEX_unique_theosophy_of_spiritual_realm:0 "追寻永恒七分钟"
 TEX_unique_theosophy_of_spiritual_realm_desc:0 "在如今的基督联邦中，佩利总统本人的神秘学倾向始终是一个被各路媒体与大众津津乐道的话题，同时也是他的政敌们始终攻击的点。诚然，对于一位身居高位的国家领导人来说，如此玄奥而又难以琢磨的爱好实在是令人难以恭维。但对于佩利总统来说，对超自然能力，神智学与更多神秘学内容的探究将会引领诞生不久的基督联邦走向一个截然不同的未来。我们只好希望，我们古怪的总统的“小爱好”不会从根本上影响我们国家的道路走向..."
 TEX_Find_new_residences_for_non_citizens:0 "为非公民寻找新居"
 TEX_Find_new_residences_for_non_citizens_desc:0 "这个国家太久以来将其疆土视为“开放之地”，任由那些不忠诚的、无法同化的人进进出出，而不顾国家的凝聚力与文化统一。对于那些愿意融入到我们的现代社会中的化外之民，例如那些北方的勤劳黑人，再经过考验后也会成为我们的同胞。但对于那些摇摆不定而又出身罪恶的种族，留给他们的只有那些被我们划定好的居留区以供居住。"
 TEX_Galahad_Scholarship:0 "加拉哈德式教育"
 TEX_Galahad_Scholarship_desc:0 "佩利最初创办的加拉哈德学院教授各种各样的主题，包括基督教经济学、密教和佩利的解放理论，后者后来发展成为灵魂学。虽然该学院在内战期间关闭，但佩利宣布，现在不仅是重新开放加拉哈德学院的时间，也是成立加拉哈德奖学金和在全国开设姊妹学校的时刻。"
 TEX_Referendum:0 "全民公决"
 TEX_Referendum_desc:0 "是时候将保守派与银色军团长期以来提出的改革议程正式付诸实践了。美利坚的联邦制度已被证明在旧时代中被滥用、扭曲，成为一小撮金权分子的工具。在过去的国会制度中，人民一旦投票，就必须忍受当选者长达数年的傲慢与背叛，无法追责、无法纠正。而佩利总统清楚地知道：国家必须重拾民众对于立法机关的信任，而这一信任的唯一基础，便是直接民主。\n\n我们将首先在全国范围内推动“罢免权”制度，如果国会议员疏远了他的选区，或违背了原本的誓言，他将被选民公投罢免，结束其政治生涯。接下来，我们将把国会立法的终点权利交还给人民——任何对全国或地区造成显著影响的立法，都必须经过相关选区公民的投票认可才能生效。这一制度将防止政客闭门造车、强行推行不受欢迎的法案，也将使每位立法者必须更加贴近基层。\n\n“全民公决”并非暴民政治的开始，而是共和制度的回归。我们不再容许旧派政客假借民主之名施行寡头政治，国家的每一条法律，都将反映出其人民的真正意愿。"
 TEX_Silver_houses_all_over_country:0 "遍布全国的银衫军屋舍"
 TEX_Silver_houses_all_over_country_desc:0 "在佩利总统还只是银色军团领袖的时候，他就曾梦想过一个遍布全国的、有纪律、有信仰的公民志愿军网络。他设想在每一个县、每一座城镇，都建立一座“屋舍”——不仅是民兵的招募与训练中心，更是忠诚、信仰与服务的象征。屋舍将成为道德社区的灯塔，激励青年、慰藉老兵、指导民众。而今，随着联邦重建的深入，我们必须再次履行对军团、对信仰、对国家的庄严承诺。\n\n财政部将拨款支持在全国范围内重新修建与扩展银衫军的屋舍网络。这些屋舍将不仅承担民兵指挥所的功能，还将设立阅读厅、教堂讲台、青年教育与救济机构，成为全国性自治公民组织的中枢。每一位真诚的公民都将欢迎这些屋舍的归来，它们不仅是佩利主义的象征，更是国家重生的柱石。"
 TEX_it_do_happens_here:0 "这的确发生在这里"
 TEX_it_do_happens_here_desc:0 "在过去的美国，一本名叫《这不可能发生在这里》的书将我们的佩利总统设想为了引导整个美国走向独裁与堕落的深渊的阴谋家与野心家。但事实如今已经彻底的推翻了这本可笑而充满臆想的书籍。如今的基督联邦已经彻底从过去的苦涩时代中走出，迎来了一个真正为人民、由人民构建的正义政权。在佩利总统的带领下，国家稳定重建、经济复苏、秩序恢复，道德回归。我们并没有陷入专制的深渊，而是从金权寡头与无神主义中挣脱，迈入了一个更有尊严、更有信仰的新时代。所谓的“这不可能发生在这里”，的确没有发生——相反，我们正亲手书写着更伟大、更真实的故事。"
 TEX_United_States_look_brand_new:0 "美利坚焕然一新"
 TEX_United_States_look_brand_new_desc:0 "尽管曾有许多人担心在我们的统治下美国会变成什么样子，但如今我们已经证明了自己伟大的成就。在这个新联邦之下，每一位真正的美国人都拥有了稳定的收入与生活保障，不再任由资本市场的波动与剥削摆布。他们的孩子在银衫学校中受到了道德与信仰并重的教育，工作不再是受辱的苦役，而是一种荣耀与奉献。我们的信仰与传统回归了政策的核心，那些试图将国家带向道德相对主义深渊的势力正在一一被边缘化。与此同时，为了完成最终的目标，我们正在努力将佩利总统设想中的“分区”纳入联邦完整架构。并重新引入传统美国人权法案。这份文件将保障真正的公民权利——工作、信仰、家庭与安全，而不再为国际主义者与资本家们所扭曲。"

TEX_lafollette_win:0 "进步精神延续"
 TEX_lafollette_win_desc:0 "尽管菲利普·拉福莱特的父亲，著名的“战斗的鲍勃”罗伯特·拉福莱特曾经的进步党政治活动失败了，但老拉福莱特的进步主义思潮却并未消失。其子菲利普·拉福莱特与威斯康星州进步党在内战中团结于休伊·朗的美利坚联盟国旗下，而在战后他们也成功战胜了美利坚至上党，以独特的进步主义民粹纲领赢得了大选。如今的国家进步党，团结在拉福莱特家族的指引下，力图将进步主义的激流冲刷整个国家。"
 TEX_Sound_clarion_call_of_progress:0 "吹响进步号角"
 TEX_Sound_clarion_call_of_progress_desc:0 "随着泰迪·罗斯福与老拉福莱特组建的进步党在大选中落败于伍德罗·威尔逊的民主党后，美国的进步主义运动就陷入了低潮。尽管在1936年的大选中进步党再次归来并夺取了一部分选民的支持，但这种程度的复兴并不足够。现在，领导着国家的进步党将会再次引领全国的进步主义浪潮，并将进步主义彻底的融入美利坚的文化中。"
 TEX_Serve_public:0 "服务而非驱使"
 TEX_Serve_public_desc:0 "在进步主义者的眼中，一个真正的进步主义政府必须是服务大众的。对于公众的需求，政府需要去调查。如果这是广大美国公民的正当要求，那么政府就必须去实行并满足人民需要。一个善政政府决不能是驱使并奴役人民的，这只会摧毁一个政党，一个国家的根基。"
 TEX_Legacy_of_Fighting_bob:0 "向战斗的鲍勃致敬"
 TEX_Legacy_of_Fighting_bob_desc:0 "鲍伯·拉福莱特是国家进步党的理念之源，也是支持诸多进步党派涌现的基础。在本世纪的10年代，进步党的火焰几乎要将腐朽的两党政治秩序摧毁。尽管最后功亏一篑，但以“战斗的鲍勃”为首的一代进步党人将进步主义思潮彻底的烙印在了美国人民的心中。如今，为了纪念鲍勃·拉福莱特这位功勋卓著又广受爱戴的的进步主义者，我们将通过以他为名的《拉福莱特法案》，授予工人加入工会而无需担心被解雇的权利。"
 TEX_Wisconsin_Idea:0 "威斯康星理念"
 TEX_Wisconsin_Idea_desc:0 "人人都能接受教育是开国元勋们的梦想之一，然而，纷争不断的时代与可怖的大萧条几近摧毁了这一切。大量的适龄学生与儿童在经济危机与内战中流离失所，连果腹的食物都难以寻得，更不用说足够的基础教育了。拉福莱特总统痛心于这一情况，而政府也将会出手改变现状。\n\n很快，我们将遵循威斯康星模型的理论，在扩大现有学校规模的同时，为高等教育和职业学校提供资金，使合格公民接受更高教育的成本几乎降为零。进一步的，对普通美国人的义务教育事业也将被迅速提上日程，以保证每个忠诚的美国公民都能得到应得的教育。"
 TEX_Strengthen_authority_of_Congress:0 "信任总统，赋权国会"
 TEX_Strengthen_authority_of_Congress_desc:0 "看看美国最近遭受的灾难，足以可见，总统必须能够有更多的应对危机的活力。因此，总统在经济和行政命令方面将得到更多的许可和宽容，以便在必要时能够克服国会效率低下的问题。但同时，为了保证美国的三权分立的民主基石不受动摇，我们也必须保证国会有足够的权力为总统在适当的情况下及时的踩下刹车。"
 TEX_Superior_proportional_representation_system:0 "优越的比例代表制"
 TEX_Superior_proportional_representation_system_desc:0 "当旧联邦的僵化两党制将人民意志囚禁在"赢家通吃"的铁笼中，拉福莱特总统领导的制宪会议以比例代表制重塑美利坚民主根基。这套诞生于威斯康星实验室的选举制度，确保钢铁工人、佃农甚至自由派知识分子都能在国会获得话语权。未来的真正的民主图景，将会是对过去僵化的民主体制的真正清算。"
 TEX_governed_by_the_people:0 "民治"
 TEX_governed_by_the_people_desc:0 ""政府不该是华盛顿精英的私人俱乐部！"——这句拉福莱特在密尔沃基集会的怒吼如今镌刻在国会山门楣。通过《基层治理法案》，我们废止了朗时期的"州长任命制"，将政府权柄真正交还民众。很快，社区官员将由社区居民直选选出，而州级别的官员任免与监督也会进一步向民众开放。民治的精神将在新大陆真正重生。"
 TEX_Plumb_Plan:0 "普朗布计划"
 TEX_Plumb_Plan_desc:0 "以格伦·普朗布为名的普朗布计划指的是建设国家级的合作制铁路。政府将派发债券将全国铁路系统购入，组建为单一公共机构，由政府，管理者和劳工平等地三分运营，并且劳工们可以获得铁路系统一半的利润。通过普朗布计划，整个美国的铁路将会以极快的速度复苏起来，并成为世界一流的铁路系统。"
 TEX_National_Engineering_Act:0 "国家工程法案"
 TEX_National_Engineering_Act_desc:0 "现在是时候投入更大的努力了，我们不仅要重建，而且要改善国内的基础设施。预定中的大规模基础设施建设计划将从地方友好型的国家基础设施建设计划开始，尽可能与地方小企业主签订合同，以扶持经济发展。"
 TEX_Sewer_Socialism:0 "下水道社会主义"
 TEX_Sewer_Socialism_desc:0 "我们的城市的电力与水系统在内战前迫切需要重新改造，而残酷的内战又更加重创了本就脆弱不堪的国家的水电系统。现在，政府将投资建设城市所需的基础设施，包括大规模更新电力系统和公共卫生系统。一劳永逸地让我们的城市干净起来吧！"
 TEX_enjoyed_by_the_people:0 "民享"
 TEX_enjoyed_by_the_people_desc:0 "还记得大萧条时芝加哥主妇在寒风中排队领救济汤吗？国家进步党正将休伊·朗"分享财富"的承诺化为钢铁般的制度。田纳西河流域新建的47座水电站让每度电价降至0.3美分；公民保障法案保障每家每周获得3磅牛肉和1加仑鲜奶；更不要说我们的"亚特兰大计划"让南方佃农子弟免费进入通用汽车技校。当匹兹堡炼钢工人首次开上自己组装的福特轿车，"丰裕之国"才不再只是政客的空话。"
 TEX_All_those_who_work_should_not_be_hungry:0 "劳者皆得食"
 TEX_All_those_who_work_should_not_be_hungry_desc:0 "对于一个国家来说，如果他的民众每天勤劳工作而却难以获得足以饱腹的食物，那么这个国家就是无能而不应当存在的。在我们的社会改造计划中，应当确保每一位勤劳的美国公民都能得到应有的劳动报酬，并且这份劳动的果实不会被任何人所窃取。"
 TEX_Public_land_stateowned_farm:0 "公有土地，国有农场"
 TEX_Public_land_stateowned_farm_desc:0 "国有农场在美国是一个值得尊敬的机构，它允许富人和穷人在农村社区中交往，让前者帮助后者。为了鼓励农村互助和支持农场，我们会派出户籍工作人员帮助农民办理农场的登记，并给予相应的扩建补助。我们最重要的环保理念之一涉及到扩大公有土地。联邦政府可以在自己持有的公有土地上建设国家公园、纪念碑，以及最重要的，各种政府项目。确实，战争摧毁了不少农场，但早在内战爆发之前，国内就有更多的农场已经陷入崩溃。必须使用现代农业机器和优质作物重振这些农场。我们将为农民提供最好的种苗，出资购买更高精尖的农业设备。此外，新农业技术也将提高农作物的产量。"
 TEX_new_cash:0 "旧币换新颜"
 TEX_new_cash_desc:0 "过去的政府致力于抑制通胀的唯一结果是给放贷者送福利，并进一步使那些负债累累的人，如农民，陷入贫困。新的美元将以旧民粹主义政党的理念命名为绿钞，与金本位制脱钩。随着新货币的推出，我们将主动掀起一次小规模的通货膨胀，以帮助那些负债者。"
 TEX_owned_by_the_people:0 "民有"
 TEX_owned_by_the_people_desc:0 "洛克菲勒的输油管正变成全民资产！依据《资源民主化法案》，联邦政府以金券赎买标准石油公司51%股权，将之彻底国有化。新的基础设施建设将不再从民主身上收税以收回建设成本，而是专门通过遗产税或是其他针对富人的苛税来买单。美国先贤们的理想，很快就会变成现实。"
 TEX_trust_of_the_founding_father:0 "不负国父重托"
 TEX_trust_of_the_founding_father_desc:0 "当制宪会议主席敲下象征批准《权利法案（修订案）》的木槌，麦迪逊和汉密尔顿的肖像在国会大厅被重新悬挂。我们废止了朗时期的总统特权，恢复华盛顿确立的四年任期传统，并强化国会予以监督；解散一分钟人，让杰斐逊"异议自由"原则重放光芒。更值得骄傲的是，当欧洲深陷战火时，我们依据本杰明·富兰克林"谦逊外交"的训诫，拒绝介入旧大陆纷争。此刻在威廉斯堡修复的独立厅前，建国先贤的铜像正注视着美利坚精神的重生。"
 
TEX_dem_win:0 "民主党胜选"
 TEX_dem_win_desc:0 "出乎所有人意料的是，传统的民主党人并未在内战中收到多大打击。在新一次的大选中，休伊和他的党输给了这些民主党人，丢掉了白宫的宝座。现在全世界人民都在观望，新生的民主党究竟会是延续内战前的老路线，还是在这个新政权中走出新的政治道路？"
 TEX_odaniel_win:0 "德克萨斯老爹扶危济困"
 TEX_odaniel_win_desc:0 "W·李·奥丹尼尔，是籍贯德克萨斯的，全美国最著名的右翼政客，他现在掌控了联盟国的政权。可以确定的是他的政府一定会增加德克萨斯州在政府内的影响力，但他自己声称他会不偏不倚，以全美国的利益为先。他在电台上充满魅力的演讲和祈祷呼吁鼓舞了几百万人，现在我们可以看到这个局外人会使用他的权力做些什么了……"
 TEX_cut_tax:0 "大减税"
 TEX_cut_tax_desc:0 "奥丹尼尔主张削减人头税和总体税收，意图借此减轻普通美国人的经济压力，提高他们的消费能力。然而，就像在德克萨斯一样，这一提议在全国范围内遭到了国内其他派系的反对。我们必须安抚他们，所以得通过寻找其他方式来支付我们的项目……"
 TEX_Five_point:0 "五点计划"
 TEX_Five_point_desc:0 "为了对抗“分享财富”计划的强烈呼声，奥丹尼尔决定创建自己的“五点计划”。该计划将涉及数百万美元的新收入，禁止赤字支出，废除不必要的税收和死刑，当然，还将任命一名经国家审计的预算主管。奥丹尼尔希望这个计划能赢得民众的好意，但要落实这些建议还有很多工作要做……"
 TEX_Merge_with_remnants_of_Dem:0 "与民主党残余合流"
 TEX_Merge_with_remnants_of_Dem_desc:0 "尽管奥丹尼尔老爹与德克萨斯民主党人在名义上代表了整个民主党，但仍有相当一部分的正统民主党，如今被称为残余派的民主党人选择游离在奥丹尼尔的圈子之外。如今，为了更好的带领民主党前行，奥丹尼尔老爹必须做出行动来将这些残余真正的吸收进民主党中。"
 TEX_Reduce_all_expenditures:0 "缩减一切开支"
 TEX_Reduce_all_expenditures_desc:0 "奥丹尼尔在德克萨斯最大的敌人就是那些向选民许诺资金援助，却把钱花在其他地方，为了追求自己的利益的腐败政客。事实上，奥丹尼尔认为，有相当一部分政府开支只不过是腐败，根本没有被用来真正造福于老百姓。我们必须改变这一点，把钱花费在更有经济性、更具代表性的事务上。"
 TEX_poor_law:0 "济贫法"
 TEX_poor_law_desc:0 "尽管内战的战火已经熄灭，但内战和大萧条的残留影响依旧使国家的贫困率不甚理想。为了尽快缓解这种颓势，奥丹尼尔总统签署了新的法令以为数以万计的贫民提供固定的工作，同时为这个项目拨款数百万美元以赈济无家可归者们。尽管这项举措已经被列在了五点计划的纲领之中，但这项行政命令一定会赢得美国民众的更多好感。"
 TEX_his_flour_business:0 "大力鼓励面粉事业"
 TEX_his_flour_business_desc:0 "曾经，奥丹尼尔老爹不过是德克萨斯的一个微不足道的面粉推销者。尽管如今他带领着国家，他也未曾忘记自己的面粉事业，或者说，没有忘记美国的民生。在他的支持下，越来越多的民用工业与企业将在这片百废待兴的土地上落地生根，并快速发展直到惠及每个美国百姓。"
 TEX_Texas_spirit_never_fails:0 "德克萨斯精神不倒"
 TEX_Texas_spirit_never_fails_desc:0 "德克萨斯老爹从德克萨斯出生，在德克萨斯生活，并带领着德克萨斯的追随者们治理这个国家。太多人沉迷于华丽的演讲和空洞的口号。但在德克萨斯，我们信奉的是行动，是结果。我们不需要更多的理论家，我们需要的是实干家。很快，奥丹尼尔老爹将会把这种德克萨斯人专有的精神带到全国，让其成为美利坚的精神文化符号之一。"
 TEX_Negotiate_with_enterprises:0 "与企业谈判"
 TEX_Negotiate_with_enterprises_desc:0 "联盟国起初没有工业较为匮乏，饱受地理条件和民粹主义言论的阻碍，因为大企业家往往认为民粹主义会对其不利。然而，奥丹尼尔相信民粹主义和商业是可以合作的，而这正是他计划要做的。有了更多的商业支持者，我们才能真正与竞争对手对抗，确保内战后重返繁荣。"
 TEX_industrial_build:0 "新工业建设"
 TEX_industrial_build_desc:0 "大平原作为美国也许工业化程度最低的地区。如果我们想让这片地区在国内有一席之地，如果我们想让农民和牧场主在政治上有发言权，我们就必须推行工业化。此外，通过工业化，我们可以给国家带来急需的投资，这些投资可以帮助我们在内战后恢复过来。为了新美国！"
 TEX_Presidential_Radio:0 "总统电台"
 TEX_Presidential_Radio_desc:0 "从早年投身面粉行业开始，收音机就在奥丹尼尔手中发挥了巨大的作用。通过广播，他接触到了比以往任何时候都多的听众，而那些听众甚至在最黑暗的日子里也吵着要听他那安抚人心的讲话。更妙的是，奥丹尼尔还成功地利用他的无线电作为政治武器，对付那些希望阻止他的议程的人。为了提振民众的精气神以及自己的支持率，奥丹尼尔希望在每周礼拜结束后举行周日广播，进一步向所有公民传达宗教和爱国价值观。在这个时代，我们比以往任何时候都更需要不去忘记自己是一个什么样的国家。或许，我们甚至可以把其他的政治派别拉到我们这边来。"
 TEX_oil_giants_will_also_bow:0 "石油巨头也将低头"
 TEX_oil_giants_will_also_bow_desc:0 "德士古，标准石油，这些石油公司源源不断地从美国身上榨取资源，而不思为美国民众们做些实事。这些吸血鬼们拼劲浑身解数压榨可怜的美利坚的美丽土地以榨取源源不断的黑金，转头继续对民众敲骨吸髓。是时候将以德士古与标准石油为首的一系列罪恶企业彻底击垮，还美利坚一个美好的明天。"
 TEX_fuck_red:0 "煽动家无处容身"
 TEX_fuck_red_desc:0 "现在是时候同那些潜入城镇乡间，煽动诚实的工会成员的外来势力作斗争了。非法工会组织和外来势力的渗透者蛊惑单纯想要谋生的公民为邪恶的赤匪。如果我们不立即消除这种威胁，我们为之奋斗的一切都将毁灭。"
 TEX_beautiful_usa:0 "美丽的美利坚"
 TEX_beautiful_usa_desc:0 "这片由我们祖先建立的自由之地，将在奥丹尼尔的领导下再次变得美丽。哪怕是最贫穷的农民和工人都为我们感到骄傲，一个美国人不管活在国内的哪个地方，都会知道自己是活在已知最美丽的国家内。"
 TEX_True_Christian_values:0 "真正的基督教价值观"
 TEX_True_Christian_values_desc:0 "把奥丹尼尔和其政治对手区分开的其中一点是他对圣经十诫的重视。这些戒律，这些黄金法则，为奥丹尼尔的政治观提供了充分的依据。现在，我们必须确保十诫也能深入公民和士兵的日常生活，敬畏上帝的美国善人将再次遍布这个国家。"
 TEX_Have_support_in_old_age:0 "老有所依"
 TEX_Have_support_in_old_age_desc:0 "休伊·朗有一个观点无疑是正确的，那就是设置养老金。奥丹尼尔将其作为自己最重要的承诺之一，打算彻底贯彻执行。但是，他既不愿意放开赤字支出，也不愿意增税，我们就必须想办法为这项提案筹集资金……"

TEX_coughlin_father:0 "主的代言人"
 TEX_coughlin_father_desc:0 "查尔斯·库林格神父自战前起，便是电波中的布道者与鼓动者。他的声音穿透千家万户，用《圣经》与朗的思想唤起了人们对公平、正义与民族的信仰。如今，在朗总统离去之后，许多忠诚的信徒已将他视为新的“主之代言”。库林格本人从未否认这一称号。他相信自己被神明赋予了使命，要在这片被贪婪与罪恶污染的土地上，再次点燃信仰的火炬。"
 TEX_with_Carroll:0 "接纳卡罗尔的天主整合主义"
 TEX_with_Carroll_desc:0 "尽管我们的出发点不同，但卡罗尔与他的整合主义者们同样追求一个纯洁、统一、合乎神旨的国家。我们可以在原则上接纳这一理念，令天主教与我们在道义与政治上的隔阂得以弥合。同时，为了真正压过如今仍然蠢蠢欲动的至上党中的反对者们，库林格神父也需要来自卡罗尔和他的追随者们作为自己的盟友以强化自己的权威。"
 TEX_Social_Justice:0 "社会公义"
 TEX_Social_Justice_desc:0 "正如《圣经》所言：“你们中间最大的，倒要作你们的用人。”真正的公义，不是法庭上的名词，而是每天生活中的实践。我们将出台一系列保障制度，从粮食配给到免费医疗，从贫困儿童营养计划到最低工资与工人主权制度，以此将“公义”从讲坛带到工厂与厨房。在神的眼中，众人皆是平等的。"
 TEX_with_armstrong:0 "与阿姆斯特朗和解"
 TEX_with_armstrong_desc:0 "主的道路不止一条。阿姆斯特朗的信仰虽然不同，但他的以色列主义信徒中也有许多诚实的人，愿意为了信仰与国家付出牺牲。此外，阿姆斯特朗本人也是一位出色的宣传家与煽动家，他的一些鼓舞信众的策略也为库林格神父提供了参考。尽管阿姆斯特朗与那些堕落野蛮的3k党人有所联系，但在我们的橄榄枝下，任何理智的政客都会选择接纳。"
 TEX_true_guadalupism:0 "真瓜达卢佩主义"
 TEX_true_guadalupism_desc:0 "尽管我们选择与菲利普·卡罗尔的整合主义信徒们合作，但他们仍然需要服从我们的指导与引领。卡罗尔所倡导的瓜达卢佩主义并不能真正的带给我们的公民幸福与成功，反而使国家陷入激进而好战的漩涡。在我们的改造下，更加温和而公正的新瓜达卢佩主义将会引导整个国家，走向新的道路。"
 TEX_Christ_Holy_Land_Israel:0 "基督，圣地，以色列"
 TEX_Christ_Holy_Land_Israel_desc:0 "毫无疑问，美利坚的人民正是以法莲和玛拿西部落的雅各继承者，而现在的耶路撒冷正是属于如今的我们的新时代圣地。在新耶路撒冷的象征下，我们要铲除败坏的金权偶像，重建以基督为核心的道德秩序。在我们掌握了耶路撒冷后，圣地将不是一个地理概念，而是一个契约的信仰政治体。我们将以此为旗帜，引领国家摆脱堕落与混乱，带领十大氏族迈向真正的再生。"
 TEX_sermons_radio:0 "电台之音"
 TEX_sermons_radio_desc:0 "我们的敌人掌握着印刷厂、电视台和好莱坞，而我们有电台。我们将加大对电台网络的投资，扩大《黄金时刻》与其他福音广播的覆盖范围，将库林格神父的声音传至每一个农舍与高楼。广播是新圣经，是时代的讲坛，是政治的火炬。我们将以频率为刃，以声音为矛，打破我们的敌人的言论封锁。"
 TEX_kill_financer:0 "扫清金融流毒"
 TEX_kill_financer_desc:0 "“你们不能又事奉神，又事奉玛门。”——这是耶稣的忠告，也是我们今天的行动方针。金融资本主义并非中立的工具，它是魔鬼的延伸，是吞噬劳动与美德的黑色机器。华尔街是撒旦的祭坛，而那些玩弄利率与债券的专家，早已背叛了上帝。我们将彻查大银行、对冲基金、非法贷款团体，封禁高利贷与衍生品投机，取缔与教义相违的经济组织。金融必须为社会服务，而非让社会服从金融。"
 TEX_kill_jew:0 "摆脱红色瘟疫"
 TEX_kill_jew_desc:0 "虽然我们痛恨金融寡头，但我们同样拒绝工团主义的毒素。那些无神论者鼓吹革命，却忘记信仰；他们推翻资本家，却扶植一个又一个的专制政府；他们口口声声讲平等，实际却只是另一种暴政。我们将坚决镇压劳联会与相关组织，取缔无神团体，并肃清教育系统中的一切可能污染美国公民美德的红色流毒。"
 TEX_No_more_financial_slavery:0 "推翻金融奴役"
 TEX_No_more_financial_slavery_desc:0 "美国人民并非天生贫穷，而是被金融奴役所压迫。工资被压低，债务滚雪球，银行像教堂一样高耸，却无一片温情。我们将出台新的《反金权法案》，限制家庭债务比例、冻结非法追债、推广公有信用机构，并设立国营信贷基金，替代私人银行的统治地位。毕竟一个被债务奴役的国家，永远无法自由。"
 TEX_No_more_poor:0 "温顺的人必受地土"
 TEX_No_more_poor_desc:0 "根据《圣经》之篾言，美国的劳动人民，由于他们的相对贫困而被认为是“温顺”的阶级，他们必须得到保护。毕竟，温顺的人必承受地土，如果我们为这些群体争取到土地，我们便更显正义。尽管富人会为他们的土地被夺走而抱怨，但很快，他们就会明白这对所有人都是最好的。"
 TEX_No_more_corruption:0 "代牧者以身作则"
 TEX_No_more_corruption_desc:0 "神职者不应只会布道，他们更应在政治与经济上引领社会。新的“代牧委员会”将担任起管理教育、媒体与社会福利事务的重大职责，确保每一项法令都符合圣经伦理标准。而我们的库林格总统将亲自监督政策推行。基督教阵线的成员也将被授予公职，成为政府的重要组成成员，并受到来自全体公民们的监督。"
 TEX_justice_is_supreme:0 "公义至上的社会"
 TEX_justice_is_supreme_desc:0 "我们最终的目标不是仇恨，也不是复仇，而是建立一个真正公义的国家。一个所有人都能吃饱饭、有房住、有信仰、有声音的社会。这既是信仰的要求，也是政治的誓言。没有公义，国家不过是一具空壳。没有信仰，改革便会被腐蚀。我们将两者结合，作为新国家的双翼。"
 TEX_longist_legacy:0 "剑与火炬坚定前行"
 TEX_longist_legacy_desc:0 "朗去世所带来的混乱已经趋于终结，而新的政治势力的上台毫无疑问代表了美利坚至上党的新方向。我们可以坚信的是，代表人人皆国王的火炬与利剑仍然占据着联盟国的政坛，而休伊·朗那灿烂的理想也仍然会引领着他的追随者。"


TEX_dynasty_survive:0 "王朝未灭"
 TEX_dynasty_survive_desc:0 "他们曾以为一颗子弹就能终结我们的事业，他们错了。\n\n他们忘了，休伊不仅是一个人，他是一场运动,是整个国家的人民不愿向腐朽的旧美国屈服的愿景。他的家人、他的同志、他的人民还在，而且从未动摇。\n\n现在，厄尔·朗站了出来，带着兄长未竟的理想，带着成熟、坚韧的政治意志，走上历史的舞台。朗的信念与理想的的火炬仍在燃烧，且永不熄灭。"
 TEX_people_friend:0 "大众之友"
 TEX_people_friend_desc:0 "在当今动荡的时代中，我们的国家迫切需要一位真正理解大众、贴近大众、服务大众的朋友。无论是工厂里的工人、农田上的耕作者，还是在街角报亭前等报的老人，他们都在用沉默的目光呼唤一个属于他们的声音。现在，厄尔·朗将做出这个改变。现在，是时候让我们的政权塑造一个真正为大众利益而奋斗的形象。新的政策委员会，事务办公室与村镇合作社将被设立，确保每一项政策出台之前都真正考虑到人民的需要。厄尔将会向国民证明，未来的联盟国将以大众之友而非统治者而行事。"
 TEX_obey_or_be_kicked:0 "要么听话，要么滚蛋"
 TEX_obey_or_be_kicked_desc:0 "在如今的政府中，有不少人是被我们从前敌人手中“收编”来的。他们戴着温和的面具，自诩技术官僚与理性中间派，却在背后不断软化政策、阻碍改革，试图拖慢我们民粹主义事业的列车。但阴谋与闹剧无法第二次得逞。厄尔总统已经明令清查各级政府内部的消极分子、破坏者与妥协派，任何人要么选择站在人民这边，要么滚出我们的政府。我们没有时间玩弄妥协政治，这场斗争只接受忠诚，不接受模棱两可。"
 TEX_louisiana_way:0 "运用路易斯安那政治模式"
 TEX_louisiana_way_desc:0 "尽管其自认为休伊的自然继承人，厄尔·朗仍有很多敌人。为了消除或削弱这些竞争对手的势力，他希望实行他所谓的“路易斯安那州式政治”。这意味着用有利的候选人挑战对手，拒绝向唱反调的人提供党内的财政支持，以及利用大讲坛让持不同政见者保持一致。厄尔·朗在这方面得心应手，而通过他的巧妙操作，我们将有一个稳定的至上党。"
 TEX_Good_governance_government:0 "善政政府"
 TEX_Good_governance_government_desc:0 "“善政”并不意味着空洞的仁慈与假意的宽容，而是意味着高效、廉洁、正义与秩序的结合。过去，合众国抛弃了对公民们的善政之举，因此被抛弃。朗与至上党选择了为美国公民们施以善政，因此至上党赢得了成功与胜利。如今，为了避免重蹈覆辙，厄尔与他的幕僚们将延续过去的施政策略并确保为广大的公民提供一个令人满意的善政政府。"
 TEX_no_more_racial_violence:0 "再无种族暴力"
 TEX_no_more_racial_violence_desc:0 "尽管如今联盟国的种族政策已经与过去大不相同，但种族仇恨的毒瘤仍在撕裂社会肌体。为了进一步解决种族暴力所带来的分歧，政府将推动实施全民和解：通过特别法庭加速审判暴力犯罪，在冲突高发区派驻跨种族调解团，并彻底净化国家系统内的极端思想。而那些煽动仇恨的罪犯将在新建的改造营中接受强制教育。我们期待那一天：南方孩子行走在任何街道都不必担忧肤色带来的危险。"
 TEX_Fees_and_retail_taxes:0 "消费与零售税"
 TEX_Fees_and_retail_taxes_desc:0 "厄尔·朗是个务实的人，他明白为了完成休伊的计划，我们必须在某些情况下提高税收。出于这个目的，有人建议我们征收零售税，以及对汽油、啤酒等征收少量的税收，这将为政府的项目提供足够的资金。这可能不受欢迎，但这将使我们有更多的资金用于重要的计划，以及为人民服务的国内项目。"
 TEX_Field_over_company:0 "田野胜过公司"
 TEX_Field_over_company_desc:0 "尽管我们的经济腾飞离不开诸多爱国企业的帮助，但我们仍然需要将目光放回到我们真正的支持者们当中，即如今美国广大的农民们。我们将重新扶持农场主与乡村合作社，对农业信贷进行宽松改革，减税降息，限制大公司在农村地区的垄断性收购行为，并支持地方自给自足体系的恢复。"
 TEX_no_hunger:0 "饥者得食"
 TEX_no_hunger_desc:0 "尽管第二次内战对国民们造成的创伤已经过去，但如今全国的贫困率仍然急需进一步压低。在城市中，青少年的营养不良问题尚未得到有效解决，而乡村地区的粮荒问题也仍旧时有发生。为了解决这一问题，厄尔总统已经指示建立新的委员会，并向国会提交了新的法案，以扩大并完善如今的国家福利制度，以确保国民的肚子能够随时填饱。同时，为了解决粮食问题的根源，政府将会为农场主们提供新型农作物的种子与新型农机，同时统一收购调配农场生产出的粮食，以确保基本的食物保障。"
 TEX_Worship_Huey_and_trust_Earl:0 "崇拜休伊，信赖厄尔"
 TEX_Worship_Huey_and_trust_Earl_desc:0 "休伊·朗不仅是总统、改革者、斗士，更是这个国家的象征。他敢于叫板富人，敢于重建公平，敢于为每个孩子争取平等的受教育权。在他的带领下，朗主义成为了美国最有生命力的政治信仰。如今，休伊虽已离去，但他的精神仍在，而他的弟弟厄尔，则是这份精神最自然、最有力的继承者。我们将组织全国范围的纪念活动、宣传工程与教育改革，把“人人皆国王”的信条传播到每一个教堂、工厂、田野与教室。要建设一个属于人民的国家，就必须让人民知道他们可以信赖谁。"
 TEX_his_legacy:0 "他的政治遗产"
 TEX_his_legacy_desc:0 "休伊·朗，被我们的敌人攻击为独裁者，但他是一个唤醒了沉默大多数的领袖，一个把财富从富人手中拿回来投入学校、医院与农民合作社的总统。他的遗产，不是宫殿，不是账本，而是政策、法规与人民的信念。厄尔将会完整的继承并保存好休伊·朗的政治影响力，团结并带领曾经坚定支持他的兄长的追随者们完成朗的未竟之事。"
 TEX_Uncle_Earls_touching_speech:0 "厄尔叔叔的动人演说"
 TEX_Uncle_Earls_touching_speech_desc:0 "厄尔·朗不像那些学院派精英，也不像那些只会读稿子的官僚。他的语言不需要润色，因为他本就是群众的一部分。他站在讲台上，可以把几千人逗笑，又能让他们沉默落泪。他懂人民，也懂如何唤起他们心中最真实的怒火与希望。我们将安排厄尔总统展开一系列全国巡回演讲，从田纳西到内布拉斯加，从新奥尔良到克利夫兰，让全国人民再次听见朗的声音、看见朗的行动。因为，这不仅是一场政治运动，更是一场民心的唤醒。"
 TEX_no_patient:0 "千家万户享医疗"
 TEX_no_patient_desc:0 "我们的医院需要现代的设备与科技，厄尔·朗也很乐意给他们所需的东西。我们将现代化城市医院，在农村地区建设新医院，以让病者有所医，厄尔还希望我们能照顾所有为我们服务过的退伍军人和其他在内战中受伤的人。我们会照顾好我们的人民，人民也会爱护我们。"
 TEX_clever_country:0 "明智之国"
 TEX_clever_country_desc:0 "激情与意志难以彻底而完美的建构一个国家。激情可以让我们走上街头，但只有理性才能让我们走进明天。如今，我们必须向世界证明：美国不仅是自由的土地，也是明智的国度。全国范围内的教育普及政策将以最快的速度推进，夜校、函授课程与地方图书馆将保证每一位公民都能接受基础教育。未来，每一个人都能理解这个国家为何而奋斗、何为真正的责任与权利。"
 TEX_earl_of_louisiana:0 "路易斯安那的厄尔"
 TEX_earl_of_louisiana_desc:0 "他们说厄尔是个乡巴佬，一个地方政客。我们对此只有一个回应——他就是路易斯安那人的骄傲。作为美国复兴的领头人，厄尔·朗的地位与他的哥哥不相上下。鉴于他对国家与政府似乎不可动摇的控制，以及其高大的身材和充足的个人魅力使一些人称他为“路易斯安那的厄尔”。不管是好是坏，厄尔·朗已坐稳宝座了。"
 TEX_Political_strongman:0 "政治强人"
 TEX_Political_strongman_desc:0 "厄尔·朗不会假装自己是个中立的管理者，他从来都是个斗士。他信仰权力，也信仰为人民使用权力。和兄长一样，他相信一个国家的改革不是靠礼貌与程序，而是靠意志、魄力与政治斗争。在接下来的日子里，总统将被赋予更广泛的直接任免权、扩大行政干预能力，限制国会对关键议案的否决权。我们要的不再是共识政治，而是执行政治。"
 TEX_Mass_democracy:0 "大众民主主义"
 TEX_Mass_democracy_desc:0 "民主不是精英之间的游戏，也不是摆在宪法上的一行漂亮字句。真正的民主，属于大众，属于那些每天清晨就为谋生出门、深夜才归家的沉默大多数。在厄尔看来，真正的大众的民主主义不服务于资本，不屈从于官僚，而是扎根于每一个人——不论其贫富、出身、信仰。国会与政府中将吸纳更多来自各行各业的受到广泛支持的专业人士作为议员或是官员，新的国家将完全创造属于每一个人的民主。"
 TEX_Rock_em_Sock_em:0 "狂野震动"
 TEX_Rock_em_Sock_em_desc:0 "在许多人看来，厄尔大叔是个不知疲倦的人，但当有人问及他超人般的精力时，他说他只是从事着“狂野震动”式的政治，如果他的政治对手不喜欢的话，他们就应该去一边待着。他的足迹遍布全国各地，这让他成为了数百万人眼中的明星，人们比以往任何时候都喜爱他迷人而风趣的演讲。"
 TEX_PPP:0 "政治，百姓与碗豆农场"
 TEX_PPP_desc:0 "政治活动、平民百姓和豌豆农场——这些事对厄尔·朗来说是最重要的。作为一名精明的政治实干家，也因为他与农民与工人的热爱，厄尔·朗宁愿把时间花在他的农场上与选民和支持者们打成一片，也不愿待在办公室里与满身铜臭味的政客们打交道。尽管他现在心中怀着野心勃勃的国家改革计划，但人有时还是要简单点的嘛。"

TEX_smith_win:0 "战斗的史密斯"
 TEX_smith_win_desc:0 "杰拉尔德·L·K·史密斯，那个崇拜着休伊·朗的煽动者，现已大权在握，现在他必须在国内推行自己的改革计划。他会把休伊的政策与自己对信仰的观点结合起来，希望以此赢得休伊的亲密伙伴和美国人民——他所尊重，却未曾尊重过他的人民的尊重。"
 TEX_Kill_Traitors:0 "叛行昭彰"
 TEX_Kill_Traitors_desc:0 "休伊·朗之死，不是出于个人恩怨，更不是来自某种偶然。那是一场蓄谋已久的暗杀，是金融暴君、跨国资本家与外国利益集团所共同策划的罪行。朗总统代表着全国数千万被剥夺者的希望，他承诺要将人民的财富从贪婪者手中拿回来。而那些人不能容忍。那些没有国籍、没有信仰、只忠于金钱与撒旦的阴影政府在背后主导了这一切。我们不能再继续容忍他们掌控媒体、法院、银行与大学。我们将掀开每一块石头，揭露每一个叛徒，将他们的名字公之于众，彻底摧毁他们数十年来在我们国家中编织的阴谋网。为了休伊，为了人民，我们必须对叛国者予以正义的审判。"
 TEX_Kill_evils:0 "打倒恶人"
 TEX_Kill_evils_desc:0 "在朗总统的治下，国家曾一度走在正确的轨道上，但他的仁慈与天真却让恶人得以潜伏。他相信劝化可以胜过审判，相信谈判可以战胜斗争，但最终却成为了他们手中的牺牲品。史密斯总统决心不再重蹈覆辙。敌人是谁？他们藏身于媒体的编采间、藏身于大学的讲台上、藏身于法院的高背椅中。他们口中满是对人民的关切，心里却只想着削弱国家的骨干、腐蚀人民的信仰。\n\n我们将建立专门的委员会，搜集证据，追踪他们的同伙。那些阻挡我们前进的、玷污休伊遗志的人将被揭发、清算与彻底铲除。他们将再无藏身之地，也不再有机会伤害美利坚人民。"
 TEX_nation_awaken:0 "国民觉醒"
 TEX_nation_awaken_desc:0 "一个政府可以拥有军队、法令与政党，但最强大的力量永远是人民的觉醒。史密斯总统深知，唯有让普通工人、农夫、店主与退伍军人理解我们为何而战，我们才能完成朗未竟的伟业。因此，我们将发起一场全国性的政治与道德启蒙运动。广播将不再被自由派和异端控制，印刷品将真实反映全国的奋斗，学校将恢复对国家、上帝与家庭的忠诚。我们的宣传将不再只是空洞的口号，而是一个重塑民族信仰与政治忠诚的工具。我们要用铁与火铸造新时代的国民，让他们明白：我们不是在为某一个人的权力而战，而是在为整个国家的灵魂而战。朗的面孔或许已逝，但他的声音将由数百万觉醒的国民继续传唱下去。"
 TEX_true_fanatical_believer:0 "史密斯的狂信徒"
 TEX_true_fanatical_believer_desc:0 "杰拉尔德·K·史密斯的追随者们与休伊·朗或查尔斯·库格林等人的追随者相比起来根本什么也不是，现在是我们塑造自己形象的时候了。为了实现这一目标，我们将致力于赢得下一代的支持，让他们既追随朗主义的理想，又支持我们的政策。而有了这一坚实的支持基础，我们便可以确保我们推行的改革在未来几十年内继续发扬光大。"
 TEX_destruction_of_the_Antichrist:0 "敌基督之毁灭"
 TEX_destruction_of_the_Antichrist_desc:0 "休伊·朗总统的殉难震撼了整个国家。凶手是否单独行动，亦或背后有更深的阴谋，暂且不提，但毫无疑问，这一切都是源自敌基督势力对我们事业的仇恨。杰拉尔德·L·K·史密斯总统在这个关键时刻挺身而出，作为朗的事业的真正信仰卫士，他宣布将以全新的政治路线——根除敌基督势力、肃清敌对文化——继续休伊的事业。我们不会再容忍那些隐蔽在国会、法院、新闻编辑室里的破坏者，他们将一个个被揭露、清算，并从我们的国家中彻底剔除。"
 TEX_Burn_up_modern_Sodom:0 "焚灭现代索多玛"
 TEX_Burn_up_modern_Sodom_desc:0 "美国的问题不仅在于经济与政治的腐败，还有那一座座道德沦丧的城市——我们的“现代索多玛”。好莱坞、纽约、芝加哥，这些昔日的文化中心如今却成了毒品、色情、犯罪与异端思潮的温床。利坚的复兴绝不能建立在堕落与自由放纵之上，而必须回归《圣经》的价值，回归传统的道德观。重建以家庭、信仰和劳动为中心的道德秩序，这不仅是政治任务，更是神圣使命。"
 TEX_New_American_Morality:0 "美利坚道德观"
 TEX_New_American_Morality_desc:0 "在一个真正的国家里，法律不应只是技术性条文，而应是对信仰与道德的体现。史密斯总统宣称，美利坚必须确立一套新的国家道德体系，这个体系将奠基于《圣经》、宪法原意与民族责任之上。新道德纲领包括重新建立对父权、婚姻、教育与劳动的尊重，对亵渎宗教、嘲弄民族传统与分裂国家统一的行为零容忍。新的道德委员会将监督文化、教育、媒体与地方政府的道德标准，确保国家不再为少数异端与激进派妥协，真正实现“上帝之下的合众国”。"
 TEX_the_cross_and_the_flag:0 "十字架与旗帜"
 TEX_the_cross_and_the_flag_desc:0 "我们的国家，不仅是一面飘扬的星条旗，更是一座竖立着十字架的圣地。史密斯总统提出：国家的未来必须结合基督教的信仰与民族主义的力量。那些认为十字架应从公共空间撤去、那些主张国家应当去神化的自由派，正在企图摧毁我们作为一个文明国家的根基。很快，“十字架与旗帜”运动将在全国范围内展开，重新将宗教引入公立学校与公共场所，将十字架与我们的十字国旗高挂在市政大厅与军营中。"
 TEX_smith_soilders:0 "史密斯的老兵们"
 TEX_smith_soilders_desc:0 "内战让全国伤痕累累，而我们的士兵与民兵则是这场浴血奋斗中真正的英雄。在最危险的时刻，他们听从了史密斯的呼唤，不顾个人安危，只为了保卫信仰、家庭与国家。现在他们归来了，我们不会忘记他们的奉献。总统下令：提高退伍军人的养老金、为他们设立优待住房、在全国建立“战士之家”纪念堂，不仅是对他们的犒赏，更是对国家未来战斗力的投资。\n\n这支忠诚的力量不会被遗忘，而是将作为新国家秩序的中坚力量继续被训练、装备与组织。他们将参与公共事务，监督地方政治，维持秩序。他们不再只是退伍军人，他们将是“史密斯美利坚”的守护者，是捍卫道德、信仰与秩序的铁卫圣徒。"
 TEX_Crusader_of_the_New_Continent:0 "新大陆的十字军"
 TEX_Crusader_of_the_New_Continent_desc:0 "世界在动荡，我们也不再孤立于世。南方的无神革命者、北方的协约余孽、大洋彼岸的军国主义者，全都虎视眈眈地盯着这个国家。而史密斯总统提出的回答只有一个：圣战。作为新世界的上帝之民，我们肩负着带领整个西半球重归基督信仰的责任。我们将建立全国性的民兵组织，动员全国教会、社区与义勇组织，训练一支真正的十字军。这不仅是捍卫国家的军队，也是捍卫信仰的军队。当时机来临，我们将挥动我们的剑，将旧大陆从混乱中解放出来。"

TEX_radical_society:0 "激进社会"
 TEX_radical_society_desc:0 "古怪的阿尔弗雷德·宾厄姆和他的美利坚激进主义运动已掌握了国家大权。虽然他们并不会紧密追随休伊·朗的议程，但他们仍声称自己是休伊思想的继承人，并坚持认为自己所推行的政策最终也会达成他的目标。中产阶级的激进分子们希望赢得美国人民的支持，但他们首先必须决定什么政策对他来说是最重要的。"
 TEX_The_middle_class_movement:0 "中产阶级运动"
 TEX_The_middle_class_movement_desc:0 "要在一个资产阶级国家创造一场革命，我们就非接触中产阶级的思维不可。中产阶级已准备好迎接一个无阶级社会的到来，宾厄姆也认为普通美国人比起不拘小节的个人主义者来说，更像是公社中的一员。我们只需控制言辞，并且不冒犯不触及他们的情感与财富，我们就能在这个国家创造些真正革命的事物。"
 TEX_New_National_Insurance:0 "新国家保险"
 TEX_New_National_Insurance_desc:0 "在继续休伊·朗的改革计划和推动他自己的改革的过程中，宾厄姆认为有必要建立一个国家保险制度。举例而言，这将保证任何美国人生病或受伤时都可以放心就医，并以此向世界表明，一个好好照顾自己人民的国家将成为一个繁荣的国家。黑手党式的保险公司再也无法恐吓美国人了！"
 TEX_Hopeless_capitalism:0 "无救的资本主义"
 TEX_Hopeless_capitalism_desc:0 "曾经的美国人们真诚的相信，资本主义的蓬勃发展能带来彻底的富裕，但事实证明，这一制度早已腐朽，无法挽回。银行家、商人、跨国公司，他们的暴利是建立在民众的痛苦之上，这样一个已经腐败的体系也注定被历史抛弃。从现在开始，在宾厄姆总统带领的改革下，这些腐朽的制度与框架将被分解，拆碎，直到被我们的力量与全体美国公民的呼号彻底掩埋。"
 TEX_Rehabilitate_Leftist_Radicals:0 "为左翼激进派正名"
 TEX_Rehabilitate_Leftist_Radicals_desc:0 "宾厄姆明白，与休伊·朗的追随者们相比，我们的运动还是相形见绌，因此，我们应该尝试从其他内战派别中拉拢一些左翼激进分子。从厄普顿·辛克莱到诺曼·托马斯，我们将尽最大努力让这些激进的伙伴们明白，我们并非他们的敌人，在某些情况下，我们还将与长期失散的兄弟们团结起来，建立一个比以往声势更为浩大的社会主义运动。"
 TEX_common_sence:0 "常识"
 TEX_common_sence_desc:0 "借鉴了托马斯·潘恩和其他美国思想家的修辞，阿尔弗雷德·宾厄姆创办了与前人同名的月刊。而现在他掌权了，《常识》杂志也已成为美国最受欢迎的杂志，宾厄姆决定利用这本杂志向那些从未了解过他的观点的人宣传他的观点。有这一重要传媒手段的支持，我们将继续向一个新国家迈进。"
 TEX_bellamists:0 "同化贝拉米主义"
 TEX_bellamists_desc:0 "联合工团中的贝拉米主义者们是我们的盟友——虽然他们站在战线的另一边，但他们这样做是为了影响尽可能多的人。国家既已重归统一，那么我们自然应该同约翰·杜威等人握手言和，他是宾厄姆的老朋友了。他们很可能会被说服加入我们，有他们支持我们，我们会更加强大。"
 TEX_accept_deer_legacy:0 "接纳公糜遗产"
 TEX_accept_deer_legacy_desc:0 "在我们的身后，是一条被先驱者踏出的道路。西奥多·罗斯福与他的麋鹿党曾以进步主义之名，向托拉斯、财阀与寡头政治宣战，为人民争取公正与责任政府。尽管在内战中进步党并不站在我们这边，但其理念仍旧可能为我们所用。我们希望能够在新的时代重新树立起公糜的大旗，并将它们的理将其推向更高层次的进步主义。"
 TEX_west_Federalist:0 "偏爱西海岸联邦党"
 TEX_west_Federalist_desc:0 "在西海岸，厄普顿·辛克莱的终结加州贫困计划仍被铭记在许多人的心中。它对我们也有意义可言，因为正是终结加州贫困计划启发了宾厄姆，让他制定许多政策，尤其是通过迂回而非直接的方式攻击并战胜资本主义。我们希望能把辛克莱吸引到我们这一边，这样一来，美国另一边的激进分子们也会加入我们帐下。"
 TEX_Compile_non_capitalist_laws:0 "编写非资本主义法律"
 TEX_Compile_non_capitalist_laws_desc:0 "传统的资本主义法律体系致力于维护私有财产和市场竞争，而这些从未对劳动者公平。现在，是时候为我们的人民编写一套全新的法律体系了。我们将推出“非资本主义法律草案”，该法律将废除关于私有财产的传统法则，确立劳动和生产资料的集体所有制。新法律将确保所有资源、土地、工厂、技术等都为社会公共利益服务，所有经济活动都必须以平等与公正为前提。资本主义的法律体系，注定要被这套崭新的法律架构所替代。"
 TEX_our_Technocrat:0 "指引迷途技术官僚"
 TEX_our_Technocrat_desc:0 "过去的技术官僚们一直在精英阶层的庇护下游走，技术与行政管理的权力掌握在少数人的手中，阻碍了真正的社会进步。虽然宾厄姆不是一个纯粹的技术官僚，但他还是承认他们确实有一些好想法。未来理想国家的政府应该由专家管理，这一说法很有吸引力，我们应该努力推动爱德华·贝拉米等思想家所设想的那种世界得以实现。"
 TEX_produce_for_use_not_profits:0 "为使用而非利润而生产"
 TEX_produce_for_use_not_profits_desc:0 "几个世纪以来，美国一直在为利润而生产的制度下运作。资源被无端浪费，人民遭苦受难，而这一切都为了什么？一场内战吗？宾厄姆有个新的愿景，建立一个生产是基于使用，而非利润的社会，这样一来，我们将创造一个更加公正与公平的社会。我们也将创造一个更加高效与人性化的经济，以此来好好照顾美国人。最后，我们将会成为全世界羡慕的对象。"
 TEX_dreamer_of_prospect_hill:0 "展望山的梦想家"
 TEX_dreamer_of_prospect_hill_desc:0 "从展望山开始，阿尔弗雷德·宾厄姆经历了一段漫长而痛苦的旅程。受美国思想和一些外国思想的影响，他创造了一个他引以为豪的美国，一个经历了中产阶级革命的美国。终于，我们可以作为一个无阶级社会向前迈进，并在未来几年享受繁荣。"

TEX_new_path:0 "新路线"
 TEX_new_path_desc:0 "现在，朗和他的圈子们已经离权力之位远去，但维持至上党的重任已经落到了我们的头上。过去休伊·朗的确为如今的联盟国规划好了未来的路线，但相应的也深埋了不少的缺陷。现在，我们的当务之急就是在朗的基业之上走出新的属于至上党的新路线，同时为整个联盟国混乱的内政注入新的活力。"
 TEX_New_american_family:0 "新美国家庭"
 TEX_New_american_family_desc:0 "在动荡的年代过去之后，美国人民需要的不再是激情动员与斗争语言，而是可以真正依靠的生活与制度保障。我们将出台一整套家庭支持政策，从育儿补贴、义务教育扩展，到住房贷款优惠与产假制度改革，确保每一个美国人都有权利在自己的家中安心生活。新时代下的美国式理想正是如此，既现实，又值得奋斗。"
 TEX_free_media:0 "自由媒体"
 TEX_free_media_desc:0 "曾几何时，媒体被企业掌控、被极端政治操弄，真相与人民渐行渐远。至上党的胜利虽打破了旧体制，但我们也必须承认，为了保卫胜利，政府对舆论的过度控制正逐步扼杀社会的活力与公正。而现在，是时候让新闻自由呼吸。广播、报刊、社论、出版社等传媒行业的全面改革将被推进，不必要的审查制度将被废除，同时政府将会鼓励地方媒体与独立新闻机构的发展"
 TEX_fair_labour:0 "公平劳动"
 TEX_fair_labour_desc:0 "美国需要的是稳定、尊严与合作的劳动制度。我们将完善联邦最低工资法案，推动合理工时制度，并建立一个真正独立且高效的劳动仲裁体系。同时，我们将给予守法的工会以合法地位，也将对滥权的劳资双方都加强监管。毕竟公平的劳动体系，是国家秩序的基石，也是经济可持续发展的起点。"
 TEX_law_repair:0 "司法改革"
 TEX_law_repair_desc:0 "过去的美国司法系统曾为强权服务，而后又沦为政争工具。如今是时候重新建立一套独立、公正且廉洁的司法体系。我们将整顿州级法院系统，废除特权法庭，改革联邦检察体制，并推动法官任命机制公开透明。我们还将扩大法律援助体系，确保所有公民在法律面前真正平等。不论是平民还是巨头在法律面前都只有一个身份——美国公民。"
 TEX_Power_lies_with_the_people:0 "权利于民"
 TEX_Power_lies_with_the_people_desc:0 "我们不能允许新政府变成旧压迫的翻版。朗总统给予人民面包与工作，而我们要让他们拥有话语权与监督力。我们将修订宪法中由朗设立的多项紧急条款，同时推动更多领域的公民参与机制，让社区能决定自己的预算与发展方向。我们要建设的是一个既有保障、也有选择的国家。"
 TEX_protect_soilder:0 "保卫退伍军人"
 TEX_protect_soilder_desc:0 "在内战与动乱中服役的美国男儿不应被遗忘。我们将大规模修复退伍军人福利体系，扩大住房、教育与医疗补贴，重建退伍军人事务部并提升其实际职权。每一个曾为国家流血的人，都应被国家铭记与照顾。"
 TEX_support_company:0 "为小微企业暂松枷锁"
 TEX_support_company_desc:0 "过去的战争经济逻辑与对大资本的打压也波及了大批诚实守法的小企业主与地方工坊。如今，我们必须纠正这一结构性错误。我们将设立“国民企业扶助署”，为小微企业提供信贷担保、税务减免与技术咨询。尽管大公司必须接受监管，小商人却需要机会与喘息空间。国民经济的复苏将是未来的经济腾飞的重要一环。"
 TEX_Glorious_Republic:0 "光辉共和国"
 TEX_Glorious_Republic_desc:0 "人民所渴望、所应得的，乃是一个没有腐败的共和国。在数百万勇敢的至上党战士的艰苦努力下，我们已准备好以全新的身份向前迈进，我们的新国家将以依照休伊·朗的设想建设，为人民服务正是其政府的宗旨。"
 TEX_make_american_future:0 "缔造美国未来"
 TEX_make_american_future_desc:0 "朗主义的遗产不能仅停留于口号，它应成为一座通向未来的桥梁。现在，朗主义在后继者的手中焕发了新的光彩，联盟国与至上党也走出了朗本人的影子，成为了真正能够完美运行的新时代国家。全国民众的声音都将被倾听，而他们的真正意愿也会得到完美的落实。属于美国的未来正在展开。"



TEX_go_go_go_minutemen:0 "一分钟人，武装起来！"
 TEX_go_go_go_minutemen_desc:0 "迄今为止，王鱼指挥的唯一部队是城市或是乡村出身的三流民兵。这些英勇的一分钟人尽管缺乏真正像样的军事训练与战场经验，但随着我们的应急军事训练与新式武器装备的落实，这些曾经不堪一击的散兵游勇将很快变成能够坚实保卫我们的事业的利矛坚盾。"
 TEX_forts_night:0 "堪萨斯-新奥尔良防线"
 TEX_forts_night_desc:0 "尽管我们向宪政国发出了示好，但那些疯狂的旧民主党人与3k党徒们无视了我们的一切善意。因此，我们需要不惜一切代价保卫与我们两个势力的边境近在咫尺的政府所在的首都！我们忠诚的一分钟人将快速加固和宪政国的边界，挖掘战壕，这样我们才有机会保卫国家。"
 TEX_make_minutemen_armed:0 "一分钟人正规化"
 TEX_make_minutemen_armed_desc:0 "如果民兵继续充当组织散漫的辅助兵，就不能指望靠他们击退敌人真正的军队。不仅仅是一分钟人，所有站在联盟国一边的政治化民兵都必须接受整编。我们会把这些民兵置于真正的将军的指挥之下，将民兵们重组为一支职业化军队。"
 TEX_propaganda:0 "宣传战"
 TEX_propaganda_desc:0 "许多生活在农村地区的美国农民，征兵和宣传都难以彼及，但在美国南部和中西部有一种历史悠久的竞选策略，可以派上用场。带着宣传的播音卡车会呼啸着穿过乡村地区，传达给我们的潜在支持者情况紧急的消息。"
 TEX_Devers_lead_army:0 "“微笑杰克”改革方案"
 TEX_Devers_lead_army_desc:0 "雅各布·德弗斯认为，部队的快速机动才是我们面对内战的各方以民兵为主的军队的最佳解决方案。这些不曾受过多少军事训练的民兵们很难在装甲集群与快速步兵的机动分割下保持完好的组织度。而一旦我们的部队将他们分割包围，就将极大地杀伤敌人的有生力量。"
 TEX_Lightning_Joe_lead_army:0 "“闪电乔”改革方案"
 TEX_Lightning_Joe_lead_army_desc:0 "鉴于现有军队组织已经过时，柯林斯将军向我们提出了一项改革计划。他指出，为了在正面有效的突破敌军各地的堡垒与壕沟组成的多重防线，只有在正面战场加大火力投送。因此，国家工业机器必须以最大的效率为我们的军队配给大量的火炮。只有在火力覆盖下我军才能在残酷的内战中赢得胜利。"
 TEX_Terrible_Terry_lead_army:0 "“恐怖泰利”改革方案"
 TEX_Terrible_Terry_lead_army_desc:0 "老将泰利·艾伦将军认为过去的美国军队指挥架构就已经腐朽，而继承于原美国陆军的联盟国军队也有着诸多的指挥漏洞。因此，为了从根本上改革我们的军队，“恐怖泰利”将提拔一批中高层军官来改革整个参谋部。这些经历过潘兴远征或是俄国内战的富有经验的新军官将彻底革新我们的整个指挥思维。"
 TEX_smith_lead_army:0 "史密斯领导“圣战”"
 TEX_smith_lead_army_desc:0 "杰拉尔德·L·K·史密斯已被任命为全军指挥，但他并没有足够的军事经验来统筹整个联盟国陆军。因此，史密斯指定了他的合作者，詹姆斯·格斯里·哈伯德来与他共同负责军改计划。史密斯已经告诉参谋们准备一场大规模的征兵运动，因为联盟国要靠军力压垮敌人，虽然似乎参谋们都不是很欢迎这个计划。同时史密斯将加大对国内的政治宣传，以让我们怀着报国志向参军的小伙子们更加的狂热。"
 TEX_Galloping_on_the_plain:0 "平原驰骋"
 TEX_Galloping_on_the_plain_desc:0 "在联盟国的境内与边境，几乎随处都是广阔无垠的大平原。而这种地形，则是最适合高速装甲部队快速机动包抄的优越地形。德弗斯将军将会加大对军队的装甲部队投入，以便于我们的军队能够在平原上给敌人脆弱的防线造成毁灭性的打击。"
 TEX_Kampfgruppe:0 "引进战斗群理念"
 TEX_Kampfgruppe_desc:0 "在欧洲，德意志帝国这个昔日世界大战的胜者也开始了自己的军队改革。在他们的总参谋部中，有些认识到了装甲力量的重要性的将军们提出了战斗群的理念，即以部分精锐的装甲团或是营作为核心，临时调集步兵炮兵或是其他的以小规模单位组成的临时作战单位。这种灵活的战地编制能够使我们的部队适应绝大多数战场情况。"
 TEX_speed_infantry:0 "步兵之速"
 TEX_speed_infantry_desc:0 "当坦克与装甲车撕开敌人的防线时，如果没有足够的机动部队来跟上装甲部队的脚步，那么就无法在敌人的防线上形成一个个包围圈以将敌人歼灭。因此，为了确保我们的步兵能够够跟得上装甲先锋的步伐，德弗斯将军将会尽可能为每个师级步兵单位配备足够的摩托化载具与装甲运兵车。"
 TEX_modern_Hussite_Fort:0 "现代胡斯战车"
 TEX_modern_Hussite_Fort_desc:0 "在三十年战争中，胡斯派的胡斯战车由于其易制造且难以被摧毁的特点而使得教会与领主们的骑士们极为头痛。现如今在德弗斯将军领导下的联盟国装甲部队，将会把一部分军费调拨到研发新型的中型与重型坦克上。这些有着足够防护的新型坦克仅需少量就足以让我们的军人在战场上对敌形成碾压级优势。"
 TEX_unstoppable_sharp_knife:0 "无法阻挡的尖刀"
 TEX_unstoppable_sharp_knife_desc:0 "随着德弗斯的机械化改革完成，联盟国陆军已经蜕变为了一支伴随着强大装甲力量突破敌人防御的强大武装。在我们的运兵车与坦克面前，所有叛国者都将成为一触即溃的风中的落叶残烛。每支战斗群都将如尖刀扎入敌军阵线，给予他们致命一击。"
 TEX_remember_sherman:0 "铭记谢尔曼将军"
 TEX_remember_sherman_desc:0 "谢尔曼将军，美国内战中联邦的英雄，同时也是南方叛军们的梦魇。谢尔曼对南方邦联掌控的地区实行了也许是世界上最早的焦土战术，来让南方的叛匪们无法从这些地区获取足够的补给，同时也极大地打击了他们的士气。而对于如今的我们的军队，我们也需要在占领区实行类似谢尔曼将军的战术，以确保我们的敌人在重新收复失地的时候无法从土地上拿到一丁点资源。"
 TEX_size_first:0 "口径即真理"
 TEX_size_first_desc:0 "毫无疑问，火炮的口径决定了其对敌人的杀伤力，也决定了我们究竟能够对敌人造成多大的威慑。柯林斯将军将迅速组织军工业与设计师工程师们为军队设计一批新型火炮，以帮助他们在战斗中更好的打击敌人的防线与指挥系统。"
 TEX_crazy_attack:0 "狂野攻势"
 TEX_crazy_attack_desc:0 "在强调军队的火力优势的同时，柯林斯将军有别于大部分高级将领的一点是他对于士兵的战斗意志也有所关注。毕竟，在一个惨烈的炮火连天的战场上，我们也不能保证我们的部队中不存在胆怯者。但柯林斯将军将确保每一位士兵都对命令的执行坚定不移，同时在进攻时能保证面对任何困难都不退缩。"
 TEX_cross_fire_wall:0 "跨越火墙"
 TEX_cross_fire_wall_desc:0 "我们要在前线为敌人创造出一面火墙，这是科林斯将军最常对他的参谋们说出的一句话。为了足够的杀伤，陆军参谋部已经决定为每个基层作战单元配备更多的炮兵支援，而改进后的各式炮弹与即将配备给炮兵的汽油燃烧弹也会作为炮兵的火力之一下放到每个团，营甚至是连级。"
 TEX_thunder:0 "滚滚天雷"
 TEX_thunder_desc:0 "仅靠各式重型轻型火炮的打击是不足以将敌人的指挥链摧毁殆尽的。为了在战场上更快锁定敌人的指挥中枢与后勤节点，我们的军队必须配备足够的空中侦察与打击力量。很快，联盟国的侦察机与对地支援机就将从各地的机场起飞来支援前线，并从天空中向我们的火炮打击不到的目标降下天雷。"
 TEX_texas_devil:0 "德克萨斯恶魔"
 TEX_texas_devil_desc:0 "传统的骑兵侦察队是一种可靠而廉价的侦察敌情的方法，很容易就能将其添加进我们的军队行列。而在德克萨斯，曾经的游骑兵警卫队是德州国民警卫队维持秩序追捕罪犯的有效手段。如今我们将采纳这种设想，并加以开发。很快，经过特训的“德克萨斯恶魔”将会出现在战线的前后各地，为作战准备提供必要的信息，或是扰袭敌人的补给线。"
 TEX_promote_Ridgway:0 "李奇微之谋"
 TEX_promote_Ridgway_desc:0 "马修·李奇微，在潘兴远征中曾经崭露头角的年轻中层军官。他认为在如今的内战战场上，缜密的计划与足够的组织度才是我们的军人们能够压倒对手的最大优势。同时，对于我们的补给，李奇微认为我们必须要升级补给线同时打击敌人的补给，确保在战线上的每处我们都能对敌产生优势。"
 TEX_promote_simpson:0 "远征队之训"
 TEX_promote_simpson_desc:0 "潘兴远征在美国国内普遍被认为不是那么必要且成功的军事行动，然而对于如今深入内战漩涡的我们来说，这种大型的军事行动所带来的军事经验是极为宝贵的。我们将提拔一批在军队中参加过潘兴远征的军人，来让他们按照远征的经验与教训彻底的改造军队。"
 TEX_Grant_legacy:0 "格兰特的遗产"
 TEX_Grant_legacy_desc:0 "尤利西斯·格兰特将军在美国内战中为北方联邦军队做出了无与伦比的贡献。这位伟人不仅带领联邦军队击溃了来自南方的叛军，更是彻底的将联邦陆军在战火中淬炼成了世界的一流军队。我们将继承这位美国军界与政界上的伟人的遗产，并用格兰特的事迹激励我们的士兵，在七十年后再次维护美利坚的统一与繁荣。"
 TEX_brave_man:0 "哥伦比亚的英勇男儿"
 TEX_brave_man_desc:0 "如今的美国，正处在前所未有的危机当中。光荣的民主传统被破坏，无数的家庭被战争撕裂。我们必须号召哥伦比娅的英勇子女们响应我们的宣传，踊跃地加入我们的军队来为保卫他们的祖国与真正的理想而战。只有赢得了他们的支持，我们才能将军队在数量与质量上甩开我们的敌人。"
 TEX_Christian_Nationalist_Crusade:0 "信仰与民族的十字军"
 TEX_Christian_Nationalist_Crusade_desc:0 "如果要使人民振奋起来，就必须诉诸于人民的信仰！我们会呼吁联盟国的每一位牧师代表政府讲道，并在全国之内推行基督教色彩的招募运动，以招募到足够多虔诚而又好战的信徒加入我们的军队。广大的美国民众们，为了保卫我们的民族与信仰，团结起来！"
 TEX_let_silver_legion:0 "安插银衫军"
 TEX_let_silver_legion_desc:0 "尽管我们的部队在前线进展迅速，将敌人的前沿国土迅速的征服。但我们的政府与军队并没有足够的力量与资源去关注这些新占领的土地的治安。大量的被打散的敌军士兵化作零散的游击队袭击我们的补给线。史密斯部长将动用他与银衫军的联系，安排这些行动迅速的军事组织在后方扫荡一切不安定因素。"
 TEX_faith_army:0 "真信之军"
 TEX_faith_army_desc:0 "一支虔诚的军队是无法被撼动的，这是史密斯部长在浏览了过去千年基督教世界所有英勇善战的军队们得出的结论。在经过各方改革后，史密斯部长将会用绝对的基督教信仰来约束激励联盟国的军队，使他们的士气比起他们的对手永远更胜一筹。而这支军队的战斗力，也自然要更加的优秀。"
 TEX_Bellicosity_is_virtue:0 "好战即美德"
 TEX_Bellicosity_is_virtue_desc:0 "为了在战场上压过对手，我们必须确保所有士兵在任何情况下都悍不畏死。即使是弹尽粮绝的情况下，他们也都会毫不畏惧的使用一切能对敌人造成伤害的武器以尽到自己的全部责任。史密斯的宣传机器将会进一步朝着军队与民众开动，向他们宣扬好战，勇敢与残忍才是美德，来激励他们更加英勇的战斗。"
 TEX_Fire_and_Sulfur:0 "施敌人以烈火与硫磺"
 TEX_Fire_and_Sulfur_desc:0 "在圣经中，主会对那些不信者与异教徒降下烈火与硫磺来惩罚他们。而如今，作为主在人间的虔诚的代行者，史密斯将以相同的方式来在内战的战场上将烈火残酷地加诸于敌军身上，以让我们的圣战军队能够更快的赢得胜利。"
 TEX_all_for_front:0 "一切为前线"
 TEX_all_for_front_desc:0 "是时候号召所有忠诚于我们的事业的公民们为内战献上他们的一份力了。联盟国政府将在短期内发售一批大额债券，来确保军需资金的充足。同时后方的绝大多数城市与乡村都将实行消费品与必需品的管制，以确保前线不会出现补给短缺的情况。"
 TEX_middle_industry:0 "中部工业"
 TEX_middle_industry_desc:0 "美国中部的大平原地区在过去就不是一个工业很发达的地带，而在大萧条与黑色星期一的打击下大平原地区的工业基础更为脆弱。摆在我们面前的当务之急是尽快恢复中部地区的军工产业，以支撑我们的内战军需。"
 TEX_responsibilities_or_die:0 "无责任，即得死"
 TEX_responsibilities_or_die_desc:0 "对于一支军队来说，责任与勇气是最重要的两项美德。对于军人来说，没有勇气意味着他会成为懦夫。而丧失了责任，一支军队就无法凝聚起来，成为一触即溃的散兵游勇。而一旦这种军人的数量多起来，就会直接带着整支部队彻底溃散。为了避免这种情况，军事纪律教育与监察将被严格执行，以让我们的士兵明白，无责任便当死。"
 TEX_not_to_be_valus:0 "不做瓦卢斯"
 TEX_not_to_be_valus_desc:0 "普布利乌斯·昆克提利乌斯·瓦卢斯，在条顿堡因自己的大意轻敌与傲慢失去了三个军团，而这种颠覆性的大败也对罗马帝国造成了可怕的创伤。而对于我们的军队，为了彻底避免今后发生如此的惨剧，我们将加强对中高级军事主官的军事史与战略战术培训，同时进一步强化我们的参谋与侦察系统，以此来保证我们的军事战略万无一失。"
 TEX_new_Continental_Army:0 "新大陆军"
 TEX_new_Continental_Army_desc:0 "经过战火的历练，效忠于我们的缺乏训练的一分钟人已经不再是开战初期的散兵游勇，而是如同独立战争后期的大陆军一般能够力克强敌的威武之师。我们如今能够骄傲的说，联盟国的军队，真正的继承了独立战争中大陆军的军魂。"
 TEX_west_point:0 "西点军魂"
 TEX_west_point_desc:0 "西点军校可能是要打扫打扫灰尘才能为我们所用，但它和弗吉尼亚军校确实也培养出了一批在世界上都首屈一指的军事人才，从以前的罗伯特·E·李和托马斯·杰克逊，再到当代的乔治·巴顿和查尔斯·佩洛特·萨莫勒，西点的学员们向来是美国军队的楷模。因此，为了延续传承我国的优秀军事传统，我们是该重振我们的军事学院，并根据现实需要进行响应调整，以期保证他们能培养出将战术战略烂熟于心的爱国者。"
 TEX_Eagle_Fly:0 "雄鹰高飞"
 TEX_Eagle_Fly_desc:0 "至此，联盟国的军事危机已经彻底不复存在，而我们的军队也真正变成了领先于世界的强大部队。新大陆的雄鹰已经擦亮了羽毛，准备再一次升空并向着世界大战的风暴中飞去。联盟国的英勇军人已经做好了一切准备，击退任何威胁自由民主的来犯之敌。"

TEX_huey_died:0 "大厦倾颓"
 TEX_huey_died_desc:0 "现在，休伊·朗已经死在了刺客的枪口之下，这无疑是对我们脆弱的事业的一记重击。在唯一能够维持党内的团结的领袖去世后，美利坚至上党内部的从左到右的多个派系都纷纷开始了各种的政治行动以求能在接下来的可预见的混乱中谋得更大的利益。毫无疑问，混乱的时代即将到来，而我们能够做的只有带领如今的联盟国之舟度过这段风暴。"
 TEX_find_out_outside:0 "寻凶于外"
 TEX_find_out_outside_desc:0 "休伊·朗总统的死，不仅是一个人的倒下，更是整个国家命运的转折点。尽管凶手当场被击毙，但越来越多的证据显示，这桩刺杀事件背后绝非孤狼之举。毫无疑问，仍然有对我们的事业虎视眈眈的外部的敌人正在暗处蠢蠢欲动——有人说是3k党的亡命之徒，还有人怀疑与纽约的工团份子有所勾连，甚至有传言称，一些金融寡头资助了整个行动。我们的使命很明确：必须将背后的黑手揪出并示众。一个连自己领袖都保护不了的国家，绝不能要求民众献出忠诚。但无论他们藏在哪里，都不会逃过我们的复仇之手。"
 TEX_find_out_in_our_party:0 "党内追凶"
 TEX_find_out_in_our_party_desc:0 "毫无疑问，在我们的稳固统治下，如果我们的领袖会因一颗子弹而失去性命，那么必然是我们的队伍中出现了叛徒。有人怀疑是军队中的不满派系，有人暗示是宣传口故意放纵暗杀者，更有人认为是朗氏家族中的内部矛盾所致。我们必须开展一场彻底的调查，也许不一定能查出真正的凶手，但至少可以决定谁将为此负责。"
 TEX_smith_power_up:0 "终结诸恶"
 TEX_smith_power_up_desc:0 "休伊·朗之死必须得到正义的回应。在杰拉尔德·L·K·史密斯看来，朗毫无疑问死于他的软弱，他的妥协。他公开宣称，国内的罪恶之源必须被彻底剿灭，从那些背弃信仰的政客，到在华尔街与广播电台中操控舆论的“外国人”，再到意图分裂民族与教会的“新道德主义者”。他高声呼吁，为了避免出现下一个朗的惨剧，就必须开启一场真正的“净化诸恶”运动。"
 TEX_coughlin_power_up:0 "传播福音之人"
 TEX_coughlin_power_up_desc:0 "查尔斯·库林格神父将自己定位为朗主义的精神继承人，但他更希望将这一运动提升为信仰的革命。库林格神父宣称仅靠法律与枪炮无法建立一个正义社会，只有将人民的灵魂转化为上帝的子民，国家才能真正复兴。当国家动荡、道德崩坏之时，只有福音的声音仍能指引人民前行。在每周的电台中，库林格神父为了国家大声疾呼。"
 TEX_earl_power_up:0 "王鱼之影"
 TEX_earl_power_up_desc:0 "厄尔·朗，休伊过去稍有嫌隙的弟弟，也是如今唯一堪当大任的朗氏家族成员。他知道人民仍然爱戴朗，也知道至上党需要一个能控制全局的人。他不像史密斯那样偏执，也不像宾厄姆那样理想主义。他是实用主义者，是行动派，是朗主义的操盘手。这位朗过去的不受人关注的影子，如今走进了权力漩涡中心，为了兄长的事业而战。"
 TEX_bingham_power_up:0 "吹响激进号角"
 TEX_bingham_power_up_desc:0 "阿尔弗雷德·宾厄姆代表的是朗主义中被忽视的一支——那批真正渴望改变社会结构、改写经济法则的激进者。他出身新英格兰名门望族，主张在朗的“财富分享”基础上，建立工人自治、限制企业权力、重写资本规则的新体制。如今，在宾厄姆的身边团结了技术官僚、进步主义者、贝拉米主义者与众多左翼人士。阿尔弗雷德·宾厄姆希望并会创造一个以工人阶级与知识分子为核心的新政府。"
 TEX_true_successor:0 "不辱休伊·朗之名"
 TEX_true_successor_desc:0 "拉塞尔·朗，一名年轻的学者，同时也是一名青涩的政治家。但他真正受人追捧的身份，则是休伊·朗之子。尽管没有足够的从政经验与资历，但在拉塞尔·朗看来，如今四分五裂的党一定不是自己的父亲所希望看到的。为此，他将挺身而出，将父亲的遗产完好无损的保存下来，有待真正的朗的追随者去继承它。"
 TEX_meeting:0 "党内会议"
 TEX_meeting_desc:0 "朗生前未明确指定继任人，也未建立任何宪法上的继承体系。因此，至上党的中委会必须召开紧急会议，确保在党内最受欢迎，或者说支持者最多的候选人能够合理合法的继承总统之位。尽管表面上这场会议是一场“协商共识”，但实际上，所有人都知道——谁赢得这场权力的角逐，谁就真正掌握了国家机器。会场将举行一场象征性的公开表决，但胜者的诞生，往往早在走入会议厅之前就已写好结局。"

