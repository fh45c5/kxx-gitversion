 TEX_Pelley_category_desc:0 "在大选中，§B基督教党§!成功击败了至上党与其他民主党派。但新的胜利并不意味着§6威廉·达德利·佩利§!总统就能够高枕无忧。§L杰拉尔德·L·K·史密斯§!，这个曾经的§6银衫军§!指挥官，休伊·朗在内战中的左膀右臂，在大选前也来投奔了§B基督教党§!。很快他凭借着战时与§6银衫军§!的联系在党内团结了相当一部分激进的极右翼党徒，而这些人自然而然地与§6威廉·达德利·佩利§!和他的亲信们支持的温和路线有所冲突。然而，一个政党只能有一个领头羊，在这场权力斗争中，输家无权决定§B基督教党§!乃至整个美利坚的未来。"
