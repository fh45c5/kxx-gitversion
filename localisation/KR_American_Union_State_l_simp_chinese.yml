 TEX_stabilize_americas_desc:0 "美洲大陆上不少小国的利益都为其它大国所操控，而这些大国在现有体制下根本不可信，它们极有可能与欧洲列强结盟。我们必须赶在为时已晚之前予以出手平定。"



 unionstate.51100.t:0 "凝练宾厄姆政纲"
 unionstate.51100.d:0 "阿尔弗雷德·宾厄姆总统虽素来憎恶个人主义与僵化的社会主义教条，但这无损其左翼立场——虽出身特权阶层，但却始终站在工人阶级的一边，更力主推行进步的直接民主制度。虽未盲从任一政治信条，宾厄姆仍深受各个思想巨擘的影响并从中汲取了诸多理念，包括乌托邦活动家爱德华·贝拉米及信奉基督教社会主义的弗朗西斯·贝拉米两表兄弟的著作、贝拉米派及托斯丹·凡勃伦的柔性技官论、剔除个人主义成分的杰斐逊式农业自由思想，以及厄普顿·辛克莱的终结加州贫困运动、现由泰迪·罗斯福幼子昆汀·罗斯福与乔治·诺里斯执掌的公麋党之思潮。整合诸般理念实非易事，为尽快落实关键改革，宾厄姆决意暂且浓缩政党纲领。那么，宾厄姆将作何取舍呢？"
