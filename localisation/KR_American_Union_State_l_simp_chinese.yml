 TEX_Charles_Edward_Coughlin_hog_pau:0 "查尔斯·爱德华·库格林"
 TEX_Charles_Edward_Coughlin_hog_pau_desc:0 "查尔斯·爱德华·库格林, 或常被称为库格林神父，是一位加拿大裔美国天主教神父，过去曾居于在底特律附近。在1930年到1936年间，他主要通过电台，广播节目与杂志报刊来向他的听众们布道，后来逐渐演变为宣扬其政治观点。他在广播与电台中广泛的向美国民众们宣传包括反工团主义，反犹主义，攻击华尔街与资本财团的右翼民粹主义思想，由于其受欢迎程度与独特的宣传方式，他被称为“广播神父”。\n\n在与休伊·朗相识后，他很快被朗的民粹主义路线所吸引，并成为朗在1936年总统大选中的重要宣传者与支持者。在美国内战开始后，库林格神父选择支持休伊·朗的美利坚至上党与美利坚联盟国。"
 TEX_David_Ignatius_Walsh_for_ade_1:0 "大卫·伊格内修斯·沃尔什"
 TEX_David_Ignatius_Walsh_for_ade_1_desc:0 "大卫·伊格内修斯·沃尔什，来自马萨诸塞州，在第一次大战中担任马萨诸塞州的州长，并在随后当选参议员。在1932年总统大选中，他曾作为一名民主党人激烈的批评胡佛与其的施政纲领，称其“对如今的美国经济状况毫不关心”，而随后的灾难般的四年也印证了他的某些前瞻性，并为他赢得了一定的政治声望。同时在美国政坛中，他以引人注目的政治民粹主义广受建制派批评，但朗与他的至上党的横空出世吸引了这位民粹主义参议员，并很快成为了至上党内的重要成员。"
