 TEX_alvin_o_king_sec_ade_1_desc:0 "阿尔文·O·金于1890年出生于堪萨斯州莱奥蒂，并最终于 1915 年获得杜兰大学法学学士学位。金于 1924 年进入政界，担任路易斯安那州参议员，并于 1928 年再次当选。1930 年，休伊·P·朗州长当选为美国参议员后，卷入了一系列政治斗争，而作为朗的政治盟友，金在随后的继任州长职务中坚定的执行了朗的既定政策，并在随后的竞选活动中支持休伊·朗与他的美国至上党。"
