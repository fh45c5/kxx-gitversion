 TEX_catholic_education_idea:0 "天主教教育"
 TEX_catholic_america_idea:0 "天主教美利坚"
 TEX_catholic_unions_idea:0 "天主教工会"
 TEX_distributism_idea:0 "分产主义"
 TEX_unpopular_government_idea:0 "不受欢迎的政府"
 TEX_orange_menace_idea:0 "奥兰治威胁"
 TEX_foreign_lifeline_idea:0 "外援生命线"
 TEX_christ_the_king_idea:0 "吾王基督"
 TEX_manifest_destiny_idea:0 "昭昭天命"
 TEX_american_advisors_1:0 "美国顾问"
 TEX_arsenal_of_democracy_idea:0 "美洲兵工厂"
 TEX_arsenal_of_democracy_idea_2:0 "美洲兵工厂"
 TEX_national_recovery_idea6:0 "国家复兴"
 TEX_patronage_machine_idea:0 "至上党的政治机器"
 TEX_patronage_machine_idea_2:0 "至上党的政治机器"
 TEX__idea:0 "财富限额"
 TEX__idea_desc:0 "我们的国家不再存在不平等与苦难。我们将实施财富限额，以便财富可以在我们所有人中更平均地分配。戴上这顶“新帽子”，每个人都将踏上成为国王的道路。"
 TEX_founders_idea:0 "为国自豪"
 TEX_every_man_a_king_idea:0 "人人皆国王"
 TEX_townsend_plan_idea:0 "汤森计划"
 TEX_mixed_economy_idea:0 "混合经济"
 TEX_mixed_economy_idea_2:0 "混合经济"
 TEX_keynesian_idea:0 "凯恩斯主义经济"
 TEX_keynesian_idea_desc:0 "我们的充分就业计划将围绕在经济低迷时期维持政府赤字，然后在经济繁荣时期削减开支并允许私人市场提供更多就业机会展开。"
 TEX_partially_planned_idea:0 "部分计划经济"
 TEX_partially_planned_idea_2:0 "部分计划经济"
 TEX_counter_terrorism_idea:0 "反恐怖主义"
 TEX_counter_terrorism_idea_2:0 "改革联邦调查局"
 TEX_centralized_command_structure:0 "纵向指挥体系"
 TEX_centralized_command_structure_2:0 "国家银色军团"
 TEX_centralized_command_structure_2_desc:0 "国家银色军团自上而下地执行命令，遵守政策所制定的指导方针，既不过于极端，也不过于软弱。它致力于招募新人，传播我们的文化，保护我们不受激进分子的攻击，向基督教党缴纳会费，振兴基督教文化和提供社区服务。"
 TEX_decentralized_command_structure:0 "全新指挥体系"
 TEX_decentralized_command_structure_2:0 "地方银色军团"
 TEX_decentralized_command_structure_2_desc:0 "银色军团是以各地分会为基础实行统治的，这些分会制定自己的规则和政策，只要遵循基督教党的基本方针，就可以选举自己的地区官员。因此有些银色军团成员被认为相当温和，有些则十分“主流”，有些非常激进，也有些甚至被指责为只是白人联盟较温和的改版。"
 TEX_silver_rangers_idea:0 "银衫游骑兵"
 TEX_christian_commonwealth_idea:0 "基督教联邦"
 TEX_christian_commonwealth_idea_2:0 "基督教联邦"
 TEX_christian_commonwealth_idea_3:0 "美国的新生"
 TEX_christian_commonwealth_idea_3_desc:0 "基督教联邦确保了基督信仰美利坚文化的真正公民能享有高度的经济和政治利益。然而，那些被认为没有生产力的人可能无法获得同样的福利。"
 TEX_gallahad_fellowship_idea:0 "加拉哈德奖学金"
 TEX_universal_education_idea:0 "全民教育"
 TEX_universal_education_idea_desc:0 "佩利对教育理念的贡献可能会让一些人感到震惊。然而他真诚地认为，这个国家所有的年轻人都应该接受教育，要么上大学，要么上职业学校。这将给他们一个更有前途的未来，同时也能支持我们国家的经济。为了更美好的未来！"
 TEX_referendum_voting_idea:0 "全民公决投票"
 TEX_manifest_destiny_idea_desc:0 "昭昭天命的理念几乎自美国建国以来便已诞生。我们的国家应当横贯北美，从大西洋到太平洋，虽然有人说这个目标已经实现了，但我们并不满意。让我们继续下去，直到我们控制北美，或者更遥远的地方。"
 TEX_trade_deals:0 "互惠贸易协议"
 TEX_popular_monroeism_idea:0 "民粹门罗主义"
 TEX_denounce_war_racket:0 "谴责不义战争"
 TEX_koc_idea_desc:0 "哥伦布骑士团于1882年由圣迈克尔·J·麦基尼神父创立，最初不过是一家光荣地专为天主教徒服务的保险公司。然而，多年来，骑士们开始从一家保险公司转变为一个天主教宣教团体。而在神圣美利坚联盟的祝福下，骑士们现在又扮演起了另一个角色——骑士团军事化了！现在，哥伦布骑士团的所有骑士都要宣誓不惜动用武力保护天主教会，教义和其牧师。随着美国与天主教会的融合越来越紧密，誓言现在引导着哥伦布骑士维护和为我们的政府服务，若是为了天主，他们甘愿赴死。"
 TEX_catholic_education_idea_desc:0 "为了保证联盟和天主教在美国的长期生存，我国政府开展了一场大规模的教育改革运动，并为青年开设了必修课程。尽管许多新教徒抗议这一行动，但我们对他们的呼声充耳不闻。为了拯救美国，我们必须不惜一切代价消灭奥兰治骑士团思想。"
 TEX_catholic_america_idea_desc:0 "一个多世纪后，国父们最大的错误和美国异端的起源——政教分离——终于得到了致命的打击。最后，国家将履行它应有的职能，把人引至他的最终归宿，与上帝在天堂永享幸福！"
 TEX_catholic_unions_idea_desc:0 "根据多萝西·戴的建议，以及我们作为天主教徒的一般职责，我们批准了天主教工会的成立。这些工会将让工人们有了一个为自己的权利而战的存在，也能让他们学习信仰。为了确保工会不被新教或工团主义思想所腐蚀，也为了全体美国工人的利益，他们应该被置于国家的控制之下。"
 TEX_distributism_idea_desc:0 "分产主义是一种基于共享和慈善价值的经济分权公共形式，该国的生产将由美国民众而不是由私人企业或国家所有。而在库格林神父的建议下，这一政策已正式成为神圣美利坚联盟的经济政策。尽管最初的反对十分强烈，但随着分产主义在全美范围内的实施，这种反对正在迅速消失——除了社会中较富有的阶层。"
 TEX_unpopular_government_idea_desc:0 "尽管我们尽了最大的努力，但由于我们的天主教，吾王基督成分和反自由主义的立场，我们的政府仍然不受欢迎。在我们能够让美国见识到基督和圣母玛丽亚的光芒前，亦或是我们能够处理那些反对我们的人之前，我们将遭受我们在人民中缺乏支持的负面影响。"
 TEX_orange_menace_idea_desc:0 "在我们的权力得到了天意认同之后，美国大多数的新教徒拒绝默默地接受我们的崛起。“橙色威胁”（主要集中在奥兰治骑士团和三K党的残余势力内）正越来越多地被权力中心里的许多人提及，这可能是神圣美利坚联盟掌权以来面临的最大威胁。如果任其发展，没有人知道它们会造成怎样的伤害……"
 TEX_foreign_lifeline_idea_desc:0 "尽管神圣美利坚联盟永远不会承认，但由于我们的低声望、内战造成的经济破坏和资金的普遍缺乏，我们的政府实际上已经破产了。只是由于外国的援助，主要来自其他整合主义国家和罗马本身，我们才没有遭受全面的经济萧条。在我们能够在经济上自给自足之前，我们的生存要归功于我们的外国生命线。"
 TEX_christ_the_king_idea_desc:0 "基督，万王之王，大卫之子，全人类的救世主和救赎者终于被赋予了他在美国社会中的领导地位。基督君王万岁！"
 TEX_la_mesa_plan_idea:0 "老特里·德拉梅萨·艾伦计划"
 TEX_la_mesa_plan_idea_desc:0 "“恐怖泰利计划”的第一部分包括让他更直接地控制我们的军队。考虑到泰利是一个战术天才，这很可能会提高我们的战斗表现。有些人认为他的策略已经过时了，但我们不能否认其至目前为止的有效性。"
 TEX_la_mesa_plan_idea_2:0 "老特里·德拉梅萨·艾伦计划"
 TEX_la_mesa_plan_idea_2_desc:0 "“恐怖泰利计划”的下一步是进一步组织我们的部队。特别的是，他希望加强骑兵。这将使我们能够更好地针对敌人制定计划，并在我们到达战场之前了解他们的计划。"
 TEX_la_mesa_plan_idea_3:0 "老特里·德拉梅萨·艾伦计划"
 TEX_la_mesa_plan_idea_3_desc:0 "恐怖泰利不想像上次大战中的将军们一样行动容易被预测。他希望他的敌人尽可能对他的战术知之甚少，在追求这一目标的过程中，他采取了一种不可预测的战术。这样的战术对我们的部队有不少好处。由于强调行军的速度和不可预测性，我们将在这一领域势不可挡。"
 TEX_la_mesa_plan_idea_4:0 "老特里·德拉梅萨·艾伦计划"
 TEX_la_mesa_plan_idea_4_desc:0 "夜袭是“恐怖泰利计划”的关键部分。有了这种出其不意的元素，我们就可以通过秘密计划和更好的训练来战胜敌人——特别是当他们太过疲倦而无法反击的时候。"
 TEX_la_mesa_plan_idea_5:0 "老特里·德拉梅萨·艾伦计划"
 TEX_la_mesa_plan_idea_5_desc:0 "专注于侵略性的战术和计划，恐怖泰利相信我们可以压倒我们的敌人，无论数量或科技。战术才将使我们战胜敌人，而恐怖泰利拥有着美国所有将军中最好的战术水平。"
 TEX_minister_smith_idea:0 "史密斯部长计划"
 TEX_minister_smith_idea_desc:0 "史密斯部长的第一个目标是建立一支鼓励为上帝而战的庞大军队。这样做既能与人口众多的对手抗衡，又能鼓舞士气。"
 TEX_minister_smith_idea_2:0 "史密斯部长计划"
 TEX_minister_smith_idea_2_desc:0 "我们为基督教上帝而战，我们应该让所有的人都知道这个事实。我们将派我们的布道人到我们的城镇和城市传播福音，我们甚至会试图团结乡村同胞。我们拯救美国的征程已经打响，所有人都应该听从它的召唤。"
 TEX_minister_smith_idea_3:0 "史密斯部长计划"
 TEX_minister_smith_idea_3_desc:0 "我们应该赋予我们国家的“一分钟人”权力。这些人是我们军队和价值观的最佳代表，通过让他们的地位与军队平起平坐，我们可以在军队中传播我们的价值观。"
 TEX_minister_smith_idea_4:0 "史密斯部长计划"
 TEX_minister_smith_idea_4_desc:0 "宗教和民族主义的结合将使我们这一方取得胜利。在可能的情况下，我们要出其不意地打击敌人，掐断他们的补给线，伏击他们的军队。我们的战士会和我们的对手一样——甚至更为狂热。"
 TEX_minister_smith_idea_5:0 "史密斯部长计划"
 TEX_minister_smith_idea_5_desc:0 "民粹主义是我们军队强大力量的来源，但这还不够。我们已经决定在我们的部队中加入牧师，这样我们的军人除了政治之外还将受到信仰的激励。只有把这两种动力结合起来，我们才能取得这场战争的胜利。"
 TEX_lighning_joe_idea:0 "“闪电乔”学说"
 TEX_lighning_joe_idea_desc:0 "“闪电乔”的胜利计划包括为我们的步兵提供炮火与装甲支援，用极端火力摧毁我们的敌人。因此，炮兵是他的计划的关键部分。首先，我们将在这方面进行投资。"
 TEX_lighning_joe_idea_2:0 "“闪电乔”学说"
 TEX_lighning_joe_idea_2_desc:0 "我们在火炮方面的投入已经得到了回报。新式火炮设计和更多的火炮生产线已经为我们带来了更好、更高效的火炮部队，我们可以用它们来攻击敌人的阵地和城市。"
 TEX_lighning_joe_idea_3:0 "“闪电乔”学说"
 TEX_lighning_joe_idea_4:0 "“闪电乔”学说"
 TEX_lighning_joe_idea_5:0 "“闪电乔”学说"
