 INC_sabotage_annam_decision:0 "渗透越南中部"
 INC_urban_terrorism_decision:0 "在城市发动恐怖袭击"
 INC_expand_secret_societies_decision:0 "在乡村组建秘密结社"
 INC_intensify_harrassment_decision:0 "加强袭扰规模"
 INC_defend_saigon_decision:0 "西贡愿为祖国而牺牲！"
 INC_defend_saigon_decision_desc:0 "敌人正在接近西贡，但我们将会为西贡战斗到最后一人为止。西贡的每一名工人都将会在“西贡愿为祖国而牺牲”的旗帜下进入街垒！"
 INC_motivate_peasants_decision:0 "动员农民"
 INC_support_our_troops_decision:0 "帮助我们的部队"
 INC_open_truong_son_path_decision:0 "启用安南小道"
 INC_create_viet_bac_base_area_decision:0 "在北越创建根据地"
 INC_infiltrate_the_north_decision:0 "渗透北方"
 INC_infiltrate_the_north_decision_desc:0 "尽管前线陷入了僵局，但我们通过安南山脉成功的渗透了北方，现在我们可以送出人员与武器去支持北方的游击队。"
 INC_new_military_leader:0 "一位新的§Y军团指挥官§!可供调遣"
 INC_Queyt_Chien_decision:0 "决战决胜！"
 INC_Queyt_Chien_decision_desc:0 "德国侵略者已经后退到红河三角洲，这将是解放河内和整个印度支那的最后的斗争！现在是时候升起决意战斗，决心胜利的旗帜，彻底消灭帝国主义者！"
 INC_tet_offensive_plan_decision:0 "新春攻势计划"
 INC_tet_offensive_plan_decision_desc:0 "总参谋部策划了一次大型攻势。通过派遣我们的渗透部队与当地游击队一道，在敌人在印度支那基地的心脏——红河三角洲的每个敌方城镇发起全面进攻。我们将瘫痪他们全部的守备力量，煽动民众暴动并一劳永逸的彻底解决敌人。这次攻势将会是绝密的，我们将会在春节给我们的敌人带来最大的惊喜"
 Tet_final_preparation_1937:0 "新春攻势 - 最后的准备"
 Tet_final_preparation_1938:0 "新春攻势 - 最后的准备"
 tet_offensive_condition:0 "§Y40§!游击队活跃度"
 tet_offensive_condition_blocked:0 "§R40§!游击队活跃度"
 tet_offensive_condition_tooltip:0 "需要至少§R10§!§Y游击队活跃度§!来发动新春攻势"
 INC_tet_offensive_tooltip:0 "一个决定性的攻势的计划已经制定完毕。这次攻势将在春节发动。"
 INC_Tet_Quyet_Chien:0 "总攻势-总起义"
 INC_Tet_Quyet_Chien_desc:0 "人民已经准备好为我们的总攻发动全面起义，我们不能浪费哪怕一秒的时间去解放河内和整个印度支那。前进！"
 INC_tet_failure:0 "我们的游击队员被剿灭了"
 INC_form_khmer_issarak_decision:0 "组建自由高棉"
 INC_form_pathet_lao_decision:0 "组建巴特寮"
 INC_troops_can_be_upgraded:0 "§Y决议中组建的部队将可以通过国策进行升级或者删除§!"
 INC_reorganise_Indochinese_rifles_decision:0 "重组印度支那步兵"
 INC_reorganise_Indochinese_rifles_decision_desc:0 "在法国接受训练的军官以及大战老兵的帮助下，我们能在短时间内掌握现代化的军事战术。但是我们仍需要知道如何组建现代化的步兵编制。一个简单快速的方法是所有步兵单位按照法国体系进行重组。这将是我们的主力部队，但重组需要时间。"
 INC_reorganise_Indochinese_rifles_tooltip:0 "解锁编制§Y主力步兵师团§!\n组建主力师§Y第308师§!\n组建主力师§Y第304师§!\n组建主力师§Y第312师§!"
 INC_negotiate_with_germs_decision:0 "与德国谈判"
 INC_negotiate_with_germs_tooltip:0 "我们将开始与德国进行和平谈判，但顽固的帝国主义者不会轻易放弃。在战场上取得主动权，敌人国内的不满或者有利的国际形势将帮助我们达成目标。"
 INC_agriculture_decisions:0 "农业生产"
 INC_agriculture_decisions_desc:0 "从非洲吹过印度洋的季风将水和沉积物带到了印度支那半岛的东部边缘，那里有数百万农民住在几个沿海平原中。整个印度支那经济依赖于其农业生产，尤其是大量商品化但及其脆弱的农作物。一般来说农业生产很容易受气候变化的影响，但由政府或农民自己进行的某些决定和变化也会产生影响。"
 INC_convert_distillery_decision:0 "转酿酒厂为燃料厂"
 INC_convert_distillery_decision_desc:0 "30年代起，殖民者开始生产酒精作为汽车燃料的替代品，但我们仍依赖进口燃料。由于敌方封锁导致燃料进口途径被切断，我们现在急需燃料供应。我们有可能扩大酿酒厂生产燃料乙醇和航空燃料丁醇的能力，但这个项目的成本十分高昂，而且会消耗大量的农产品。"
 INC_land_reform_decisions:0 "土地改革"
 INC_land_reform_decisions_desc:0 "大部分农地由大地主拥有，大部分印度支那农村人口只拥有小块土地或者根本没有土地。如果我们不能解决社会不平等和农村贫困这两个问题，那么革命只是外国主子被本地主子取代了而已。这说明我们需要进行大规模土改，但以此为目的所需采取的手段则各有不同……\n\n现在的§Y土地改革§!进度是：[?INC.land_reform|-0]\n"
