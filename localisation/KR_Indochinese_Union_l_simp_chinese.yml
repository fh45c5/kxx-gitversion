 KR_Indochina: "印度支那国策树"
 POLITICS_PHAM_VAN_DONG_DESC:0 "1924年范文同去了中国南方，在那里见到了胡志明，并很快成为了胡大叔最信任的知己和领袖之一。范文同目睹了越南工团主义者所受的酷刑，在重压下流亡法国，流亡途中，他对法国雅各宾派的思想“先锋队主义”颇感兴趣。由纪律严明的知识份子组成先锋队领导革命的想法让他很感兴趣，1931年联盟分裂后，他领导剩下人员改组为东洋共产联团，并开始渗透德属东亚。他的大部分同志都认为范文同始终勤奋肯干、精力充沛，他可靠可敬，也是理想主义协调者兼管理者。另一方面，他的敌人们也很畏惧范文同管理党与国家机器的能力。"
 POLITICS_TA_THU_THAO_DESC:0 "谁都想不到，这个最没可能当上主席的革命青年居然成为了大名鼎鼎的印度支那联盟的主席，他不但执掌大权，还备受同志们的尊敬。谢秋收在二十年代中期成为了西贡著名的革命者，并在联盟最黑暗的时刻投身革命，1931年的分裂让印度支那联盟元气大伤，而谢秋收也是在此期间一路高升。这位果敢的知识份子在上台后有意效仿胡志明的执政风格，他平息宗派主义，团结革命同志。印度支那能够恢复元气，很大程度都要归功于谢秋收的努力。如今，他将实现革命先辈们未竟的梦想——那就是在印度支那建成工团主义。"
 POLITICS_NGUYEN_AN_NINH_DESC:0 "阮安宁被大多数印度支那知识份子视作是印度支那的民主导师。他是巴黎大学的学子，并参加了1919年的法国大革命。在1922年，阮安宁、阮世传和阮爱国（胡志明）齐聚马赛，决意策划解放祖国的计划。1924年，阮安宁回到印度支那，很快便因煽动激进思想被德国警察逮捕。阮安宁在目睹了工团主义者被德国军警镇压的惨状后，阮安宁认为印度支那的革命必须由农民发动。在那之后，他成立了高望谨会。他常常亲自易容为和尚或是医师，在农村中以推销药膏为名走村串户，秘密招募成员并传播革命思想。也是因此，阮安宁被湄公河三角洲的农民们十分敬重。虽然他想要彻底改变印度支那人民思想的那一天也许在他有生之年无法实现，但他所强调的文化启蒙、自治理念和自发性定能永远的改变印度支那社会。"
 POLITICS_NGUYEN_TAI_HOC_DESC:0 "阮太学是越南国民党的创建人。他曾经是殖民地的改革派，但在他对殖民政府失望后，便决意投身革命民族主义。安沛起义虽然失败，但阮太学却从德军手中逃了出来，这让他成为了越南革命者心中的传奇。受中国革命家孙中山的影响，阮太学憧憬着一个真正以民为本的民主而共和的越南。"
 INC_vietminh:0 "越盟"
 INC_vietminh_desc:0 "“越盟”，全称“越南独立同盟会”，是由多个争取越南即时独立的团体组成的广泛联合政府。尽管盟内各派系都主张民族团结，但各自的政治议程严重制约了组织决策效率。更值得注意的是，部分高棉与老挝成员对这一名称略有微词……"
 INC_vietminh_1:0 "祖国阵线"
 INC_vietminh_1_desc:0 "在越盟临时政府大会闭幕后，前越盟已经被改组为祖国阵线。作为人民政权的政治基础，祖国阵线需要在社会中发挥重要作用，促进国家在政治和精神上的团结和思想统一……"
 INC_vietminh_2:0 "祖国阵线"
 INC_vietminh_2_desc:0 "在越盟临时政府大会闭幕后，前越盟已经被改组为祖国阵线。作为人民政权的政治基础，祖国阵线需要在社会中发挥重要作用，促进国家在政治和精神上的团结和思想统一……"
 INC_Guerilla_Tradition:0 "游击传统"
 INC_Guerilla_Tradition_desc:0 "尽管认为印度支那人都是天生的游击队战士这个看法是错误的，但是这个国家的地形十分适合进行游击战。而且这个国家的人民有持续了上千年的游击传统。"
