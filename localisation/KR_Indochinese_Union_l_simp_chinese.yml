 INC_poor_army_idea_1:0 "无组织的军队"
 INC_poor_army_idea_1_desc:0 "我们新组建的革命军虽然在保卫祖国上有足够的热情，但他们的训练不足，装备参差不齐。我们需要采取一定的措施将他们的热情变为战斗精神。"
 INC_apathetic_people_idea_1:0 "麻木不仁的人民"
 INC_apathetic_people_idea_1_desc:0 "虽然印度支那乡野地区近来革命热情高涨，但是大多数人仍对革命漠不关心。要消解此等漠然，让民众胸怀大局，仍是长路漫漫。"
 INC_apathetic_people_idea_2:0 "麻木不仁的人民"
 INC_apathetic_people_idea_2_desc:0 "虽然印度支那乡野地区近来革命热情高涨，但是大多数人仍对革命漠不关心。要消解此等漠然，让民众胸怀大局，仍是长路漫漫。"
