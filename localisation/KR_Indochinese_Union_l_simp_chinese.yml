 viet.0.t:0 "新印度支那！"
 viet.0.d:0 "我们发动的总起义已取得伟大胜利。在德意志殖民政权腐朽的尸骸之上，巍然屹立着我们由越南独立同盟会领导的独立国家。\n\n阮安宁已经当选越南主席。数以千计的声明已经向殖民者证明我们将抗争到底，永不屈服。越南已经决定将发起在印度支那半岛抗击德国殖民者的全面战争，并呼吁全体印度支那人民：无论是越南人、老挝人、柬埔寨人、芒族、岱依族……为了我们正义的事业献身。"
 viet.0.a:0 "我们必将胜利！"
 viet.1.t:0 "印度支那独立宣言"
 viet.1.d:0 "值此抗击德意志匪帮的民族救亡战争之际，我们将建立一个独立自主的国家。尽管参与革命的柬埔寨与老挝同胞为数不多，全体革命者一致同意：新生的政权应当代表整个印度支那，致力于解放全体印度支那人民。\n\n革命者们决定起草《印度支那独立宣言》。激进派革命者主张明确宣示我们与第三国际的团结立场，而越南国民党等民族主义者则希望申明泛亚主义理想。尽管工团主义领袖谢秋收坚定奉行国际主义，但他认为需要作出战术性妥协——一份温和的宣言更能赢得国内外广泛支持。"
 viet.1.a:0 "国际主义宣言"
 viet.1.b:0 "泛亚主义宣言"
 viet.1.c:0 "温和的宣言"
 viet.2.t:0 "越盟政治现状"
 viet.2.d:0 "在越盟的革命者和爱国志士中，有四大派系尤为瞩目：\n\n1926年北伐失败后，胡志明领导的青年革命同志会内部分裂。东洋革命会作为其直接继承者，奉行正统无政府工团主义。近期从法国归国的现任领袖谢秋收，已在西贡等城市成功组建工会组织。\n\n受法国雅各宾派影响，部分强硬派成员于1931年巴黎会议脱离联盟，组建印度支那共产主义联盟，简称东洋共产联团。该党崇尚钢铁般的纪律与秘密活动，成功渗透进了殖民地警察及驻军部队。\n\n越南国民党效仿中国国民党组建模式，在小资产阶级及富裕农民阶层中颇具影响力，尤以越北地区为甚。虽安沛起义失败使党组织元气大伤，却为其赢得了英雄般的声望。\n\n1928年，印度支那著名无政府主义革命家阮安宁创立了高望谨会。他坚信工团主义无法赢得革命，遂借鉴传统谨会模式激发农民自发革命意识。其无政府主义理念虽吸引众多知识分子，但真正奠定该组织在越盟主导地位的，是其深耕乡村的革命网络。\n\n革命的热情暂时凝聚着各派力量，然而这番团结能否经受得住未来的考验，唯有时间方能作答。"
 viet.2.a:0 "我们将共赴胜利！"
 viet.3.t:0 "反渗透行动"
 viet.3.d:0 "德国渣滓妄图破坏我们光荣的革命事业。间谍与叛徒无处不在。当越南国民党主张渗透敌营发动情报反攻时，东洋共产联团却坚称唯有扩大秘密警察规模才能肃清内敌。无政府主义者与工团主义者则疾呼：必须授权地方民兵逮捕处决可疑分子，建立革命法庭，掀起红色恐怖。无论作何抉择，我们誓要将敌人碾为齑粉！"
 viet.3.a:0 "我们必须加大对情报方面的投入"
 viet.3.b:0 "扩编秘密警察"
 viet.3.c:0 "实行红色恐怖"
 viet.4.t:0 "土地政策"
 viet.4.d:0 "印度支那革命若要取得胜利，必须赢得农民的支持。国民党主张减租减息，同时维系与爱国地主的合作关系。但激进派要求彻底的土地改革，以此动员农民并摧毁每个村庄中的旧秩序。关于土地政策的激烈争论正在撕裂联盟阵营。谢秋收与范文同提出折中方案：现阶段仅没收“叛国者”土地，待未来再实施全面土改。"
 viet.4.a:0 "减免地租"
 viet.4.b:0 "保证近期内进行土改"
 viet.4.c:0 "现在就进行土改！"
 viet.5.t:0 "德国的封锁"
 viet.5.d:0 "德帝国主义者已彻底切断我们与国际友人的联络通道。眼下我军装备极度匮乏，许多士兵仅以斧钺长矛为武装。东洋共产联团继承了二十年代旧同盟构建的跨国地下革命网络，提议重点经营金三角地区的军火走私以支援部队。然而这种买卖，必须绝对隐秘，且不免要行些有违伦常之事……"
 viet.5.a:0 "我们别无选择"
 viet.5.e:0 "算了，我们不需要走私。"
 viet.6.t:0 "国会"
 viet.6.d:0 "尽管对于是否应给予反革命嫌疑分子选举权仍存争议，临时政府仍决定所有年满18岁的公民均享有投票权，以产生集立法与行政权于一身的最高国家权力机关——国会。在如此危急的局势下，印度支那历史上首次全国大选竟排除万难得以举行。新召集的国民议会中形成了新的多数派，并推选出兼任国家元首的议长……"
 viet.6.a:0 "高望谨会屹立不倒!"
 viet.6.b:0 "恭喜谢秋收同志!"
 viet.6.c:0 "恭喜范文同同志!"
 viet.6.e:0 "恭喜阮太学同志!"
 viet.6.f:0 "恭喜陶维英同志!"
 viet.6.g:0 "恭喜阮氏南同志!"
 viet.6.h:0 "恭喜黎笋同志!"
 viet.6.i:0 "恭喜黄文欢同志!"
 viet.6.j:0 "恭喜陈定龙同志!"
 viet.6.k:0 "恭喜黄国越同志!"
 viet.6.l:0 "恭喜孙德胜同志!"
 viet.6.m:0 "恭喜吴文同志!"
 viet.6.n:0 "恭喜杨伯濯同志!"
 viet.6.o:0 "恭喜高朝发同志!"
 viet.6.p:0 "恭喜武鸿卿同志!"
 viet.7.t:0 "阮氏南的命运"
 viet.7.d:0 "越南北方著名商人阮氏南素有“钢铁女王”之称，坐拥北部数座规模最大、设施最先进的种植园。她长期秘密资助反殖民运动，然而在我军推进之际，其种植园工人突然暴动将她拘押。五千余名来自周边公社的农民蜂拥而至，在“打倒恶霸地主阮氏南，夺回农民土地！”的红色横幅下组成革命法庭，当庭宣判其死刑。我军士兵虽阻止了处决，但必须立即作出决断。"
 viet.7.a:0 "她是我们的英雄！阻止这些暴徒！"
 viet.7.b:0 "财产公有化就够了"
 viet.7.c:0 "革命就是正义！"
 viet.8.t:0 "国民党的阴谋"
 viet.8.d.a:0 "某些阴险的越南国民党叛徒对我国正当的社会革命怀恨在心，密谋发动政变。这些自诩为民族主义者的败类纠集所谓“救国军”匪帮进犯西贡，悍然进犯西贡并强占政府机关，迫使我们的越盟领导同志暂时撤离。然而，西贡英勇的工人赤卫队宁死不屈，不仅夺回大楼，更将这群蠢货彻底击溃！目前我们正对叛徒展开全面肃清。"
 viet.8.d.b:0 "某些阴险的越南国民党叛徒对我国正当的社会革命怀恨在心，密谋发动政变。这些自诩为民族主义者的败类试图纠集所谓“救国军”匪帮进犯西贡，颠覆人民政权。幸而我方秘密警察及时侦破阴谋，先发制人逮捕了多数叛乱分子。目前我们正对这批叛国者展开彻底肃清。"
 viet.8.a:0 "看吧，我早说了民族主义分子都是一群混账！"
 viet.8.b:0 "看吧，秘密警察是非常有用的！"
 viet.9.t:0 "西贡政变"
 viet.9.d.a:0 "西贡爆发了所谓“反工团救国革命”叛乱，暴徒袭击工厂并与地方民兵交火。东洋共产联团指摘国民党人背叛革命，要求立即开展清洗；而国民党成员则坚称清白。情报部门密报显示，这场暴乱是由东洋共产联团策划。此刻，范文同同志正发出诘问：“”同志们，这里摆着两把椅子——一把留给民族主义者，一把留给国际主义者。你们，要坐哪一把？”"
 viet.9.d.b:0 "西贡爆发所谓\"反工团救国革命\"叛乱，暴徒袭击工厂并与地方民兵交火。东洋共产联团指摘国民党人背叛革命，要求立即开展清洗；而国民党成员则坚称清白。情报部门密报显示，这场反革命暴乱确系国民党分子策划。此刻，范文同同志正发出诘问：\"同志们，这里摆着两把椅子——一把留给民族主义者，一把留给国际主义者。你们，要坐哪一把？\""
 viet.9.a:0 "当然是国际主义"
 viet.9.b:0 "不好意思，我选择民族主义"
 viet.9.c:0 "我觉得两边都挺好"
 viet.10.t:0 "印度支那起义胜利"
 viet.10.d:0 "印度支那人民终于挣脱了殖民剥削的枷锁！这不仅是全世界社会主义国家的伟大胜利，更是对德帝国主义的一次重创！我们在当地的军事观察员研究了革命者采用的游击战术，但其实际效用仍有待验证。"
 viet.10.a:0 "太好了！"
 viet.11.t:0 "印度支那起义胜利"
 viet.11.d:0 "印度支那人民终于挣脱了殖民剥削的枷锁！这不仅是全世界社会主义国家的伟大胜利，更是对德帝国主义的一次重创！我们在当地的军事观察员研究了革命者采用的游击战术，但其实际效用仍有待验证。"
 viet.11.a:0 "太好了！"
 viet.12.t:0 "欧洲殖民者问题"
 viet.12.d:0 "在西贡居住的约两万名欧洲殖民者对我们来说是一个棘手的问题。他们为殖民当局工作，并垄断了印度支那几乎全部的现代经济部门。他们之中部分革命者希望加入我们，但大多数仍是死硬的反动派。我们应该如何处理他们。"
 viet.12.a:0 "强迫他们为我们工作！"
 viet.12.b:0 "工会将会接管一切！"
 viet.12.c:0 "国有化他们的资产并把所有人都扔进监狱！"
 viet.13.t:0 "宗教问题"
 viet.13.d:0 "交趾支那地区生活着数百万佛教徒、基督徒和高台教徒。多年来宗教在民众生活中占据主导地位。随着我们革命政府的建立，这些信教群众正陷入恐慌边缘。我们需要唤醒民众觉悟，但激进手段可能引发强烈反弹，进而影响抗战大局。"
 viet.13.a:0 "宣布国家世俗化"
 viet.13.b:0 "他们也是爱国者，我们需要团结一致。"
 viet.13.c:0 "将它们整合并转化为公民宗教。"
 viet.13.e:0 "秘密清洗宗教领袖"
 viet.14.t:0 "教徒外逃"
 viet.14.d:0 "被革命和战争所震惊，大量高台教信徒和天主教徒被他们的宗教领袖所欺骗并逃离祖国。已经有数十万人试图逃离我们的控制区。"
 viet.14.a:0 "叛徒！"
 viet.15.t:0 "战争结束"
 viet.15.d:0 "血腥的战争已经结束，但还有一些遗留问题需要解决。令人痛心的是许多我们的同胞为敌人服务，在这场战争中我们目睹了孩子反抗父母，妻子起诉丈夫，兄弟手足相残。印度支那社会在统一后变的更加分裂。我们应该如何处理这个问题？"
 viet.15.a:0 "开始全民和解运动"
 viet.15.b:0 "叛徒滚去劳改营！"
 viet.16.t:0 "清洗国民党"
 viet.16.d:0 "参与反政府阴谋的越南国民党主要成员已经被逮捕，并将以叛国罪审判。现在他们的命运将被军事法庭所决定……"
 viet.16.a:0 "你们对祖国的贡献将会被铭记"
 viet.16.b:0 "这些叛徒就该去死！"
 viet.17.t:0 "清洗东洋共产联团"
 viet.17.d:0 "参与反政府阴谋的东洋共产联团主要成员已经被逮捕，并将以叛国罪审判。现在他们的命运将被军事法庭所决定……"
 viet.17.a:0 "你们对祖国的贡献将会被铭记"
 viet.17.b:0 "这些叛徒就该去死！"
 viet.18.t:0 "清洗社会主义者"
 viet.18.d:0 "参与反政府阴谋的社会主义者主要领导人已经被逮捕，并将以叛国罪审判。现在他们的命运将被军事法庭所决定……"
 viet.18.a:0 "你们对祖国的贡献将会被铭记"
 viet.18.b:0 "这些叛徒就该去死！"
 viet.19.t:0 "清洗东洋革命会"
 viet.19.d:0 "参与反政府阴谋的东洋革命会主要成员已经被逮捕，并将以叛国罪受审。现在他们的命运将被军事法庭所决定……"
 viet.19.a:0 "你们对祖国的贡献将会被铭记"
 viet.19.b:0 "这些叛徒就该去死！"
 viet.20.t:0 "西贡的选举舞弊"
 viet.20.d:0 "西贡，印度支那的心脏与大脑，如今已成为国会选举的战场。各派势力竭力操控市议会权力机器，妄图通过划分有利于己的选区来操弄选举，致使选区划分沦为政治分赃。这些卑劣行径已呈失控之势，令民众深恶痛绝。西贡各工会指出，这正是代议制议会政体的固有顽疾，他们主张应当以工作场所而非地理区域作为西贡选区的划分依据。"
 viet.20.a:0 "试着举行公正的选举"
 viet.20.b:0 "某些派系操纵了选举结果……"
 viet.20.c:0 "基于工作地点的选区划分听起来不错"
 viet.21.t:0 "新政府"
 viet.21.d:0 "[INC.GetLeader]代表无政府主义者赢得了国会多数席位。 胜选后，[INC.GetLeader]宣布国会虽为民意表达提供了平台，但只有分权化及民主化才能切实代表人民利益，我们必先重构印度支那人民的意识。现在是时候组建新政府了。"
 viet.21.a:0 "保持和范文同的联合政府，他是一个理想的候选人。"
 viet.21.b:0 "与朱文晋这位战争英雄建立联合政府"
 viet.21.c:0 "与激进的革命者陈文朝组建内阁"
 viet.22.t:0 "新政府"
 viet.22.d:0 "工团主义者赢得了国会多数席位。新任国会主席[INC.GetLeader]宣告其终极目标为解散国会、建立工团主义政治制度，并承认印度支那的转型将是一场长远征途。现在是时候组建新政府了。"
 viet.22.a:0 "保持和范文同的联合政府，他是一个理想的候选人。"
 viet.22.b:0 "与孙德胜这位倍受尊敬的工会领导人建立内阁"
 viet.22.c:0 "工团主义的理论家阮文渠将领导内阁"
 viet.23.t:0 "新政府"
 viet.23.d:0 "作为世界上仅存的先锋队社会主义政党之一，先锋队主义的东洋共产联团赢得了国会多数席位。新任主席[INC.GetLeader]宣布，党将带领印度支那走向光明的未来，继续同所有印度支那社会主义者情同手足般合作。现在是时候组建新政府了。"
 viet.23.a:0 "与孙德胜这位倍受尊敬的工会领导人建立内阁"
 viet.23.b:0 "让先锋队派理论家范雄领导激进内阁"
 viet.23.c:0 "范文同同志擅长干多份工作"
 viet.24.t:0 "新政府"
 viet.24.d:0 "越南国民党，唯一主张议会制和工业化的印度支那主要党派，已成为印度支那国会的主导派系。阮太学，作为国民党的领导人和国会主席，在大选胜利后进行了简要发言，重申了他对印度支那未来的宏伟规划。现在是时候组建新政府了。"
 viet.24.a:0 "学者陶维英将领导内阁"
 viet.24.b:0 "一个由阮海臣领导的国民党内阁！"
 viet.25.t:0 "准备下一届大选"
 viet.25.d:0 "自上次国会大选已经过了5年了。国会是国家最高权力机关和人民的代表。这次选举将对印度支那政治局势产生重大影响。"
 viet.25.a:0 "开始准备选举"
 viet.25.c:0 "印度支那的代议制民主已经失败了"
 viet.26.t:0 "[GetYear]年大选"
 viet.26.d:0 "印度支那于[GetYear]年召开了议会选举。总理与人民委员会代表已由国会成员选举产生。"
 viet.26.f:0 "[From.GetRulingParty]保持了多数地位"
 viet.27.t:0 "[GetYear]年大选"
 viet.27.d:0 "印度支那于[GetYear]年召开了议会选举。总理与人民委员会代表已由国会成员选举产生。恭喜东洋共斩获99.5％的选票！"
 viet.27.e:0 "民主与团结的胜利！"
 viet.28.t:0 "放开政治自由？"
 viet.28.d:0 "我们曾向印度支那公民承诺更广泛的政治自由。如今，非社会主义者要求组建自己的政治组织并开展竞选活动。值得注意的是，其中不少人与前殖民政权关系密切，甚至曾直接勾结。我们是否应该允许他们进入政治领域？"
 viet.28.a:0 "我们需要更多的政治自由"
 viet.28.b:0 "政治自由不适用于投敌者与反革命"
 viet.29.t:0 "军事戒严仍在继续"
 viet.29.d:0 "戒严令仍在持续。这就是我们为之奋斗的革命吗？若果真如此，或许军政府会比文官政府更有效率。"
 viet.29.a:0 "保持民选政府"
 viet.29.b:0 "军政府"
 viet.30.t:0 "向工团体制过渡"
 viet.30.d:0 "在劳工总联合会接管政权后，印度支那联盟已转型为工团主义国家。国家权力基本实现地方分权化，由各地工会和公社自主管理事务。劳工总议会取代了国会的地位，公共安全委员会则执掌行政权力。为彻底消除资产阶级政党政治，绝大多数政治组织已被解散。如今印度支那正迈入一个崭新的纪元。"
 viet.30.a:0 "一个民主与团结的时代！"
 viet.31.t:0 "[GetYear]年劳工总议会大选"
 viet.31.d:0 "劳工总议会的任期是五年，现在是时候进行新一轮的选举了。于此同时我们还将选出公共安全委员会的新执行委员。预计正统的工团派，亦即科德利埃派将继续主导劳工总议会。但他们也可能与其他派系结盟，增加自己的政治实力。"
 viet.31.a:0 "科德利埃派主导——工业化！"
 viet.31.b:0 "与忿激派结盟——文化启蒙！"
 viet.31.c:0 "与平原派结盟——社会发展！"
 viet.31.e:0 "与山岳派结盟——备战！"
 viet.32.t:0 "工会抗议"
 viet.32.d:0 "今天，西贡工会开始对我们最近的政策进行示威。他们声称新政策违反了社会主义原则。工会要求工人的更多的自主权和工会对经济的控制。"
 viet.32.a:0 "无视他们"
 viet.32.b:0 "妥协"
 viet.33.t:0 "总罢工！"
 viet.33.d:0 "由于诉求得不到回应，东洋革命会领导全国的工会发动了总罢工。他们要求立即制止一切侵害工人权利的行为，并要求更多的工人自治权！"
 viet.33.a:0 "是时候解决这些境外势力的渗透了！"
 viet.33.b:0 "接受他们的条件"
 viet.34.t:0 "镇压工会"
 viet.34.d:0 "总罢工已升级为工人与警方的暴力冲突。东洋革命会现公开与政府对立，并开始组织武装起义。我方警方采取强硬手段镇压，目前大批工团主义者遭到逮捕与迫害。"
 viet.34.a:0 "是时候解决这些叛徒了"
 viet.35.t:0 "东洋共产联团的行动"
 viet.35.d:0 "印度支那共产主义联盟（又称“东洋共产联团”）按照先锋队政党的组织原则组建，奉行民主集中制理念。该党成员以秘密支部形式开展活动，常进行地下工作。这种运作模式被其他政治派系质疑缺乏民主性且形迹可疑。部分政界人士怀疑其密谋武力颠覆政府。我们是否应当基于政治开放原则对其活动加以限制？"
 viet.35.a:0 "那是他们的自由"
 viet.35.b:0 "我们得监视他们"
 viet.36.t:0 "怒潮暗涌"
 viet.36.d:0 "阮太学被人民的选票抬上了主席之位，人民的欢呼声中，他用洪亮的嗓音立下句句承诺，他所在的越南国民党承载着工农群众的热望与对国族复兴的期待。\n但掌权后，阮太学与越南国民党却迅速背离革命初心，不仅在社会主义框架内复刻汪精卫式党国体制，排挤革命伙伴，还假借鼓励私人企业的名义，绕过程序，允许流亡新加坡和暹罗的买办家族以“私人企业”身份回归，试图迎回早已被革命政府清理以至于流亡其他殖民地的买办资本。迎回买办的事件被其他政府成员知道后，曾在反殖斗争中并肩作战的一位革命同志在国会拍桌怒斥：“你们这是在倒行逆施！”换来的却是越南国民党议员们集体离席，用人数优势强行通过法案。\n如此蹂躏革命成果，越南国民党与原先并肩作战的社会主义伙伴们渐行渐远，政府越来越难以运作，工农与左翼党派的愤怒暗潮涌动。"
 viet.36.a:0 "也许我们不该这么做……"
 viet.36.b:0 "阮太学主席已经从革命功臣堕落为人民公敌"
 viet.37.t:0 "西贡枪声！"
 viet.37.d:0 "西贡港的晨雾尚未散尽，一艘来自香港的客轮拉响汽笛。买办资本家陈文禄踏上了暌违十五年的故土，皮鞋踩在潮湿的舢板上时，他或许正憧憬着等下收回被革命政府没收的橡胶园。然而下一秒，枪声撕裂了码头的喧嚣——一名戴眼镜的学生从送行人群中冲出，抵近射击的子弹精准贯穿了他的太阳穴。\n这场看似偶然的刺杀实为政府其他成员积怨的火山口。尽管越南国民党情报部门受命“严密保护重要投资人”，但党内反对派系早已将行程泄露给学生团体。\n为使刺杀事件有个交代，警察局长——以对国民党绝对忠诚著称的激进派——下令无差别逮捕西贡大学学生。在发现调动不了全部警员之后又私自调动亲信警察冲击学生集会。\n警察局长的暴行依然压制不住学生的不满，甚至使情况闹得越来越大。得知政府因为复辟资本主义要镇压学生运动，印支总工会连夜印发传单，将事件称为“学生率先阻止资本主义还魂”；北部太原省的民兵组织则趁机接管地方政府，宣布“暂代越南国民党履行革命监护职责”；其他社会主义政党宣布脱离政府组建联盟以拯救革命，更糟糕的是已经有一部分军队宣布加入反政府联盟。\n眼见全国走向动乱，阮太学在总统府召见军队将领意图发动戒严，进行军事清洗。而支持学生的第五步兵师与国民党嫡系卫戍部队早已在西贡街道交火。\n"
 viet.37.a:0 "这个新生的国家是如此命途多舛"
 viet.37.b:0 "阮中月同志成功推翻了国民党独裁政权,随后宣布自己为临时主席"
 viet.37.c:0 "阮平将军宣布戒严"
 viet.38.t:0 "拯救"
 viet.38.d:0 "主席府内突然传来一声枪响——一个警卫员突然掏出手枪，转身打伤身旁仍在抵抗的卫戍部队上校持枪的手臂，紧接着控制住那位上校。没等房间内其他警卫呐喊，数十名“警卫”便同时调转枪口，以不开枪或者只打伤的形式控制住了主席府内的所有武装力量。包括阮太学在内，在场所有政府人员被特务们按倒，已经控制现场的同志们向冲进来的反政府联盟一方军队长官诉说刚才发生的一切。\n越南国民党独裁政权被推翻后，团结坚定的革命社会主义者们决定将印度支那重新引向社会主义道路。潘佩珠将接替离任的阮安宁出任新联合政府主席。"
 viet.38.a:0 "第二次革命成功了!这是最后的斗争……"
 viet.39.t:0 "社会主义联合政府"
 viet.39.d:0 "凭借与其他社会主义派系，尤其是工团主义联盟的密切联系，范文同成功在党内斗争中压制了反对派。随后他在国民议会坦承，党的强硬路线疏远了许多优秀同志，并窒碍了印度支那的民主发展。共产党今后将采取更开放的政策，联合其他社会主义者共同追求社会主义未来。"
 viet.39.a:0 "这是最后的斗争……"
 viet.40.t:0 "结束戒严？"
 viet.40.d:0 "社会主义叛乱已经被镇压，但叛乱在印度支那社会留下了极深的伤痕。现在我们正在考虑结束戒严并恢复民主……"
 viet.40.a:0 "与自由派合作"
 viet.40.b:0 "完全恢复政治自由"
 viet.40.c:0 "继续戒严"
 viet.41.t:0 "罢黜范文同"
 viet.41.d:0 "范文同虽功勋卓著，却始终带着文官与知识分子的气质，缺乏真正领袖的魄力。党内强硬派认为他意志过于软弱，对敌人过分宽厚。政治局会议上，组织部主任黎德寿率先发难，凭借其与法国雅各宾派的密切关系所带来的权威，指责范文同并未真正领会列宁主义思想精髓。他们主张，或许让范文同出任总理之职更为妥当。"
 viet.41.a:0 "范文同被边缘化，黎德寿接班"
 viet.41.b:0 "范文同获得了党外的支持"
 viet.42.t:0 "解决工团主义者"
 viet.42.d:0 "东洋革命会在国内有着根深蒂固的政治影响。工会对经济的影响巨大。他们已经是我们领导层的威胁，为了进行改革，我们必将解决掉他们……"
 viet.42.a:0 "很好"
 viet.51.t:0 "农业复苏"
 viet.51.d:0 "抗战已告终结，如今正是医治满目疮痍的祖国之时。战争期间，农业生产遭受重创，数十万农民弃耕从戎或流离失所。作为国民经济支柱的农业，其复苏至少需一年时间。"
 viet.51.a:0 "太好了"
 viet.52.t:0 "反馈事件"
 viet.52.d:0 "这是个反馈事件，你不该看到这个，如果你在没有加载任何子模组的正常游戏情况下看到了，那么请上报这个问题。"
 viet.52.a:0 "好"
 viet.52.b:0 "正常"
 viet.52.c:0 "糟糕"
 viet.53.t:0 "今年的收成：丰收"
 viet.53.d:0 "今年是个丰年。不过丰收导致的谷物价格下降可能会带来不少麻烦。"
 viet.53.a:0 "太好了"
 viet.54.t:0 "今年的收成：一般"
 viet.54.d:0 "今年的农业生产受到各种因素的打击。许多农民认为政府惹怒了上天。"
 viet.54.a:0 "还行"
 viet.55.t:0 "今年的收成：歉收"
 viet.55.d:0 "今年的农业生产受到各种因素的打击。许多农民认为政府惹怒了上天。"
 viet.55.a:0 "灾难已经来临！"
 viet.63.t:0 "土改结果"
 viet.63.d.a:0 "我们的土地改革造就了一个小农所有制社会。乡村的地主统治体系已然瓦解，多数地主变卖田产迁居城市，用所得资金另谋新生。然而佃农与贫农虽分得土地，却仍深陷债务泥潭。不少激进分子将这种局面视为一场未竟的革命……"
 viet.63.d.b:0 "我们的土地改革成效复杂：虽然激进派曾试图从肉体上消灭地主阶级，但最终多数土地持有者在震慑下选择妥协，改革总体上以和平方式完成。如今多数农民实现了自给自足，精神面貌焕然一新；而昔日的乡绅地主阶层则对改革结果怨怼难平。"
 viet.63.d.c:0 "我们的土地改革造就了高度平等的农村社会，乡绅地主阶级被彻底消灭。在许多村庄，贫农形成了强烈的阶级意识。然而土改期间的恐怖手段，也在印度支那社会留下了深刻裂痕，宗族纽带与人伦关系几近崩塌，昔日乡村的凝聚力被紧张氛围所取代……"
 viet.63.a:0 "我们好歹进行土改了……"
 viet.63.b:0 "我们尽力了……"
 viet.63.c:0 "自由并非无价……"
 viet.65.t:0 "地主的抵制"
 viet.65.d:0 "尽管政府颁布了土地持有上限法令，地主们仍通过或明或暗的手段保住了田产。佃农与贫农的生活未见改善，纷纷抱怨政府与地主沆瀣一气，民间失望情绪日益蔓延。"
 viet.65.a:0 "还行"
 viet.65.b:0 "我们需要强化官僚体系以推动土改"
 viet.65.c:0 "这群地主必须被解决！"
 viet.66.t:0 "极端主义在农村蔓延"
 viet.66.d:0 "在政府动员下，大批农民揭竿而起，没收地主的土地、生产资料及私人财产。许多地主遭受公开羞辱与肉体惩罚，部分德高望重的乡绅学者选择自尽以全名节。知识界纷纷抗议政府应当维护法治秩序。"
 viet.66.a:0 "极端主义比封建主义先进一千年"
 viet.66.b:0 "这个过分了"
 viet.67.t:0 "扩大土改范围？"
 viet.67.d:0 "随着土改向北方推进，我们面临了截然不同的局面：这些地区人口过于稠密且极度贫困，即便没收地主土地也不足以重新分配。因此，若要兑现耕者有其田的承诺，就意味着许多小土地所有者也将成为土地再分配的对象……"
 viet.67.a:0 "我们必须确保每个农民都得到自己的土地！"
 viet.67.b:0 "也许有其他解决方案"
 viet.68.t:0 "红色恐怖"
 viet.68.d:0 "血腥的土地改革已演变为席卷全国的红色恐怖！众多村庄爆发针对地主的集体处决，就连曾为抗战出力的爱国乡绅也难逃厄运。更有农民借机报复私仇，暴力行径愈演愈烈。虽无法统计多少无辜者枉死，但这场运动造成的冤案规模，堪称触目惊心。"
 viet.68.a:0 "是时候彻底解决封建主义了！"
 viet.68.b:0 "我们犯了一些错误……"
 viet.69.t:0 "平定省农民起义"
 viet.69.d:0 "平定省爆发大规模农民暴动，抗议当局以土地改革为由拘押亲属、没收财产。当地方官员对两万余名民众的诉求置若罔闻后，手持刀剑农具的暴动民众接连攻占多个区级政府机构，焚毁行政大楼、市政厅与火车站，捣毁税收档案，洗劫警察局，导致地方行政体系彻底瘫痪。这些愚昧的农民背后必有境外势力操纵！"
 viet.69.a:0 "派军队过去"
 viet.70.t:0 "招募业余游击队领袖？"
 viet.70.d:0 "近日，一位成功的游击队指挥官引起了关注。这位曾被东京知识界称为“文哥”的男子，放弃了历史教师的职业，组建游击队并屡次重创德军。他从未接受正规军事训练，自称战术思想源自T·E·劳伦斯的《智慧七柱》。有人认为他确有军事天赋，但留法将领们对此存疑，我们是否该将这位“野路子”纳入正规军？"
 viet.70.a:0 "让我们看看他能做些什么"
 viet.70.b:0 "不，我们的军队不需要教书先生。"
 viet.71.t:0 "军事改革"
 viet.71.d:0 "新生的印度支那人民军虽历经战火洗礼，仍是一支极不成熟的军队。从战争中汲取经验后，我军内部逐渐形成两大军事学派。以总参谋长文进勇大将为首的参谋派推崇周密策划的奇袭进攻，主张建立更集中的指挥体系；而享有威望的政工干部阮志清大将则坚信人的意志与主观能动性，他与同僚们坚持认为印度支那战士的勇气与坚韧才是我们最强大的武器。"
 viet.71.a:0 "让我看看……"
 viet.73.t:0 "装甲恐慌"
 viet.73.d:0 "我军士兵报告遭遇了能喷吐火球的恐怖钢铁怪物。那些曾在法国受训的军官们知道，这是一种被称为“坦克”的装甲战车。然而这种武器仍在我军农民士兵中引发巨大恐慌，即便是知晓其并非怪物的人，也对其装甲束手无策。恐慌情绪严重打击了我军士气，每当德军装甲车出现，大批士兵便溃逃出战场。"
 viet.73.a:0 "这些怪物！"
 viet.74.t:0 "装甲恐慌平息"
 viet.74.d:0 "在独立战争中快速取得胜利的我们已经终结了德国坦克的威胁。随着金属巨兽已经不复存在，装甲恐慌已经平息。"
 viet.74.a:0 "太好了"
 viet.79.t:0 "新春攻势！"
 viet.79.d:0 "午夜刚过，当越南民众正欢庆农历新年燃放爆竹时，手榴弹在河内的德国大使馆内爆炸。越盟突击队突然现身河内市区，同时大批越盟军队向各城镇发起全面进攻。在越盟宣传分子煽动下，手持砍刀与长矛的无知农民在各地区暴动，高喊着“打倒暴君”。我们完全被打了个措手不及！"
 viet.79.a:0 "这你妈就是越盟庆祝新年的方式？"
 viet.80.t:0 "炮击西贡"
 viet.80.d:0 "今晨，德寇动用军舰与空军对西贡市展开狂轰滥炸。待炮火停歇时，城内主要建筑已尽成废墟。然而这般暴行只会愈发激起我国人民对德国强盗的刻骨仇恨。"
 viet.80.a:0 "可恶"
 viet.81.t:0 "新教材"
 viet.81.d:0 "为了唤醒印度支那人民血脉中的尚武精神，我们对教育体系进行了一整套的改革，包括在小学阶段加入军事训练、武器使用课程与新教材。下面是一个二年级课本的例子：\n\n已知1名印度支那士兵能击杀5只德畜。\n如果7名印度支那士兵与43只德畜交火，那么有多少德畜能活下来？"
 viet.81.a:0 "8？"
 viet.81.b:0 "他们全死了！"
 viet.82.t:0 "解放日"
 viet.82.d.a:0 "今天是解放日，我们将威廉匪帮赶出祖国的日子，成千上万的烈士为胜利和独立而献身。几乎每个人都失去了自己的亲人或挚友。让我们为所有为了我们的和平与自由献出生命的英烈哀悼。潘廷逢、潘佩珠和胡志明是他们中最值得尊敬的。"
 viet.82.d.b:0 "今天是解放日，我们将威廉匪帮赶出祖国的日子。现在成千上万的英烈为我们带来的自由与和平正在被威胁！让我们以潘廷逢、潘佩珠和胡志明为榜样，为独立而战！"
 viet.82.a:0 "向英烈致敬"
 viet.82.b:0 "不自由，毋宁死！"
 viet.83.t:0 "战争之殇"
 viet.83.d:0 "最近，我们的一些作家发表了一系列反映我们上一场战争的纪实文学和小说。他们描绘战争期间的战争的残酷和人民的痛苦。这些作品未能表现出邪恶的帝国主义者的侵略和我们正义的抗争。他们已经在人民之间造成了混乱。"
 viet.83.a:0 "人民已经疲惫不堪"
 viet.83.b:0 "禁了这些反革命毒药"
 viet.83.c:0 "反思使我们进步"
 viet.84.t:0 "阮太学回到西贡"
 viet.84.d:0 "安沛起义失败后，越南国民党多位领导人的下落成谜。所幸该党创始人兼领袖阮太学同志成功逃脱了德寇的追捕，辗转潜逃至中越边境山区，在中国南方隐匿行踪。如今阮太学已重返西贡，受到了民众的热烈欢迎。"
 viet.84.a:0 "太好了！"
 viet.85.t:0 "公民永瑞"
 viet.85.d:0 "我们的军队进入了皇城首府顺化，被我们的特工说服并留下的保大皇帝正在宫中等着。今天，在激动的人民群众和印度支那红旗飘舞的顺化的平台上，保大皇帝宣布：\n\n“从今日起，越南的君主制将被废除。保大皇家不复存在，只有公民永瑞。公民们，我想让你们知道，我宁愿成为一个自由的公民，也不愿作为一个被奴役的皇帝。”\n\n公民永瑞在人民的称赞中将国玺和宝剑交给了革命代表，并宣布退位。"
 viet.85.a:0 "昨日之皇帝，今日之公民。"
 viet.86.t:0 "妇女在革命中的作用？"
 viet.86.d:0 "印度支那的女性议题正引发激烈争议。尽管众多女性投身革命并身居要职，男性革命者却对接受女性领导表现出强烈抵触，更倾向于将女性参与者限定在辅助岗位。考古证据表明，史前时代的印度支那女性曾享有平等地位乃至统治权力，但女性从属角色的社会规范早已内化为社会规范，这种根深蒂固的观念恐难骤然改变。"
 viet.86.a:0 "让她们干干后勤就行了"
 viet.86.b:0 "妇女能顶半边天！"
 viet.87.t:0 "新四德"
 viet.87.d:0 "传统上，妇女应该按照“四德”行事，即妇德、妇言、妇容、妇功。最近，一些激进的女权主义者发表了一系列文章，声称“四德”可能具有新的含义：“妇德”并不是奴隶般的服从，而是致力于争取自由和独立的斗争；“妇言”是大胆雄辩，说服人们加入解放斗争，在人们错了时坚决而坦率地说服他们；“妇容”不是卑躬屈膝而是革命的愤怒、渴望和激进；“妇功”应该包括家务活之外的工作。\n\n尽管她们的主张十分合理，但这让许多人感到害怕，其中包括部分支持性别平等的知识分子。"
 viet.87.a:0 "听起来过于激进了"
 viet.87.b:0 "支持他们！"
 viet.87.c:0 "这同样适用于男性！"
 viet.88.t:0 "青年突击旅的悲剧"
 viet.88.d:0 "我们的青年突击队主要由年轻女志愿者组成，是被称为“我军手足”的重要辅助部队。然而最新调查报告揭示，这些仅配备简易铁锹且毫无军事知识的“突击队员”被派往前线后遭遇悲惨境遇。前线长期面临衣食短缺，工作时间漫长，生存环境极其恶劣。尽管姑娘们展现出非凡勇气，但仅凭铁锹和镐头抵抗敌军炮火轰炸的尝试终究是徒劳无功。该报告引发社会广泛关注，对士气也造成了显著打击。"
 viet.88.a:0 "我们应该努力改善她们的设备和工作条件"
 viet.88.b:0 "我们不应该让女性去危险的地方工作"
 viet.88.c:0 "对不起，但我们什么都做不了"
 viet.89.t:0 "征氏姐妹起义1900周年"
 viet.89.d:0 "公元40至42年间，征侧与征贰两姐妹为争取独立自由揭竿而起抗击外敌。虽最终功败垂成，二征夫人已成为越南民族不屈精神与英雄气概的象征。今年适逢二征夫人起义1900周年纪念，西贡市及各郡的二征夫人庙均举行了隆重的游行祭祀活动。"
 viet.89.a:0 "多好的一天"
 viet.89.b:0 "我们的女性也能像征氏姐妹一样加入军队！"
 viet.90.t:0 "经济混乱"
 viet.90.d:0 "世界大战的爆发切断了我们与欧洲的联系。我们的经济严重依赖法兰西公社，现在已经陷入了混乱。"
 viet.90.a:0 "可恶！"
 viet.91.t:0 "现代佛教"
 viet.91.d:0 "近日，印度支那全境佛教宗派召开大会，正式成立“印度支那统一佛教僧伽”。在佛教复兴运动的旗帜下，他们致力于推动佛教在现代社会的革新与振兴。相较于天主教、高台教等其他宗教，佛教在印度支那民众中根基深厚，当局不得不审慎应对这一宗教势力。"
 viet.91.a:0 "尊重我们的传统"
 viet.91.b:0 "支持佛教社会主义！"
 viet.91.c:0 "有组织的宗教运动应该被压制"
 viet.92.t:0 "范文同同志精疲力尽？"
 viet.92.d:0 "范文同同志可能是一个工作狂，但他已经承担了太多的工作。现在他似乎已经筋疲力尽。范文同同志需要休息吗？"
 viet.92.a:0 "好好休息吧，范文同同志"
 viet.92.b:0 "鞠躬尽瘁，死而后已"
 viet.93.t:0 "法国文化热"
 viet.93.d:0 "在我们与法兰西公社的亲密关系以及近来合作的影响下，西贡出现了一股法国文化热。城里的无产阶级争相模仿起法国人的生活习惯，如穿着法国工人的服装、用法语互相问候，以及享用河粉、法棍、浓汤一类的法国餐点等。这些风潮大多无伤大雅，纯粹是出于对社会主义事业及其丰硕成果的仰慕，除此之外无它。不过，国民党和某些民族主义者对此一现象进行了大肆的批评和讽刺，还用了不少诸如“对前殖民者的奴性服从”、“倒退回殖民时代”等不堪入耳的话语。"
 viet.93.a:0 "社会主义大团结万岁！"
 viet.93.b:0 "我们必须保护自己的文化！"
 viet.93.c:0 "集百家之长，新文化乃立"
 viet.95.t:0 "第一届西贡国际艺术节"
 viet.95.d:0 "首届西贡国际艺术节近日举办。在进步知识分子主导下，策展重点聚焦于工团主义国家的先锋派作品。然而展出现场表明，我国民众对这些现代主义、未来主义及超现实主义艺术实在难以共鸣……"
 viet.95.a:0 "我们必须加深对印度支那人民喜好的理解"
 viet.95.b:0 "前卫派文化似乎对印度支那这样的地方来说太高级了……"
 viet.97.t:0 "顺化之战"
 viet.97.d:0 "我军对越南古都顺化发起协同攻势。这座城池果不其然是越南反动派的老巢。德军与越籍效忠派部队据守着包括皇城在内的多处坚固工事。我军在巷战中遭遇激烈抵抗，为打开突破口已集结全部重型装备并实施多栋建筑的爆破作业。皇城争夺战同样惨烈，当印度支那联盟旗帜飘扬在旗台时，一百六十座宫殿建筑群仅余少数主体结构尚存。在这场血战期间及战后，数千名死硬反动分子被迅速处决。"
 viet.97.a:0 "顺化！顺化！顺化！"
 viet.110.t:0 "寻找胡志明"
 viet.110.d:0 "尽管官方档案记载，胡志明同志，即巴黎时期广为人知的“阮爱国”，已于1926年德国干涉行动中牺牲，但除德方可疑的声明外，并无确凿证据证实其死亡。有传言称胡志明其实在那场劫难中成功脱身，隐匿于中国南方组织游击活动。虽然其尚在人世的可能性微乎其微，但民众对“胡伯伯”最终命运的猜测从未停息。在中国政府的友好协助下，如今我们得以在华南地区就此展开调查......"
 viet.110.a:0 "我们试试"
 viet.110.b:0 "我们知道他死了"
 viet.111.t:0 "我们找到胡志明的妻子？"
 viet.111.d:0 "调查过程中，我们在广州发现一名自称胡志明妻子的女子——唐雪明。这段婚姻的中国法律见证人蔡畅、邓颖超同志均予以证实，且在其珍藏中发现了胡志明亲笔书写的笔记与信件。但胡志明同志终生未婚的形象，早已成为其献身革命的象征。承认这段婚姻或许会引发尴尬......"
 viet.111.a:0 "邀请她来印度支那"
 viet.111.b:0 "这件事保密，二人只是革命般的友谊"
 viet.112.t:0 "广西游击队的传言"
 viet.112.d:0 "我们对胡志明同志的调查仍在继续。20世纪20年代末，中国南方曾流传一则传闻：广西部分少数民族为反抗地方军阀开展了游击斗争，这段历史或许与胡志明同志存在某种关联。"
 viet.112.a:0 "有意思"
 viet.113.t:0 "广西游击队的命运"
 viet.113.d:0 "我们在广西追寻胡志明同志踪迹的调查有了新进展。现有证据表明，1920年代末中越边境确实存在游击武装活动，但该组织已于1932年遭桂系军阀镇压，主要领导人均被捕遇害。据当地民众回忆，就义者中多有越南籍人士，这或许就是胡志明同志真正的归宿。至此，我们是否该为这场调查画上句点？"
 viet.113.a:0 "继续"
 viet.113.b:0 "我们已经知道答案了……"
 viet.114.t:0 "来自广西的更多证据"
 viet.114.d:0 "我们在广西的持续调查取得了突破性发现。经查证，当年确有部分游击队员因证据不足被羁押于南宁监狱，1933年在陈炯明等广东进步人士施压下获广西军阀释放。获释人员中化名“胡光”者曾将狱中日记托付给一位援助过他的当地知识分子。经鉴定，这部《狱中日记》确系胡志明同志亲笔所书。这位革命领袖当年竟以假身份奇迹生还。该珍贵文献现已移交西贡印度支那革命博物馆永久珍藏。"
 viet.114.a:0 "有意思"
 viet.115.t:0 "胡志明的命运"
 viet.115.d:0 "我们终于从使馆城市警察厅的机密档案中发现了关于胡志明同志命运的最终证据，由此得以还原这位革命先驱的真实结局。1926年镇压行动后，胡同志继续在中国南方开展游击斗争，后遭桂系军阀部队围剿被捕。但军阀当局未能识破其真实身份，最终将其释放。1933年胡同志决定取道香港前往法国时，被租界巡捕房拘押，经德国秘密警察核实身份。鉴于1925年处决潘佩珠引发大规模示威的教训，德方选择在香港秘密处决了胡志明同志。这段被尘封的历史，将永远铭刻在印度支那人民心中。"
 viet.115.a:0 "愿您的英灵保卫我们的祖国"
 viet.130.t:0 "新的外汇收入！"
 viet.130.d:0 "我们的外汇储备即将耗尽，亟需开辟新的外汇收入来源以支撑武器采购。尽管已鼓励农民改种经济作物，但对于利润最丰厚的鸦片种植仍悬而未决。诚然殖民者带来的鸦片生产应受谴责，但危急存亡之秋，不得不行非常之举……"
 viet.130.a:0 "我们开始吧！"
 viet.130.b:0 "不，这违反了我们的原则"
 viet.135.t:0 "与平川派合作？"
 viet.135.d:0 "就算在革命之后，有组织的犯罪集团平川派扔在西贡秘密活跃着。他们通过抢劫和恶意诈骗获得资金的同时也经营着跨国走私。尽管我们的干部精通秘密行动，但他们对走私仍是一窍不通，也行我们应该请求专家的帮助……"
 viet.135.a:0 "让我们为了国家团结起来！"
 viet.135.b:0 "哈？跟这群黑社会合作？"
 viet.135.c:0 "我们必须根除他们！"
 viet.136.t:0 "如何处理平川派？"
 viet.136.d:0 "随着抗德救国战争的胜利，与平川派的合作也将结束。虽然大多数领导人都认为我们应该根除平川派，但阮安宁同志想把他们融入到我们的社会主义社会中，这可能吗？"
 viet.136.a:0 "犯罪团伙也是工团……"
 viet.136.b:0 "我们不再需要黑手党！"
 viet.137.t:0 "西贡之战"
 viet.137.d:0 "西贡黑帮组织平川派因深感新政威胁，对我方发动了垂死反扑。在最初的轻武器交火与迫击炮对射后，人口稠密的市中心区爆发了惨烈的巷战。最终，西贡工人赤卫队与地方驻军不得不动用重武器清剿黑帮势力，导致数百平民丧生、大量民宅化为废墟。这座城市的创伤恐需时日方能愈合。"
 viet.137.a:0 "啊"
 viet.138.t:0 "平川派的整合"
 viet.138.d:0 "平川派的成员逐渐了解到社会主义社会的优点并放弃了犯罪活动。现在新出生了平川派加入了西贡的管理层，前武装犯罪团伙也被整合进我们的军队。"
 viet.138.a:0 "我知道他们可以融入进来！"
 viet.98.t:0 "诗人春妙的任命"
 viet.98.d:0 "近日，诗人吴春妙被提名为官方文化报刊《文艺》主编人选。这位被誉为印度支那现代最杰出的浪漫主义诗人，在抗战时期转型为热情的革命作家，积极宣扬社会主义并投身反帝斗争。然而其早期作品素以哀婉颓废的风格著称，加之其同性恋者身份及“男性之爱”题材创作在文化界早已是公开秘密，部分文化官员对此项任命持审慎态度。值得注意的是，其“伴侣”辉瑾同样身居文化部门要职。若这对伴侣在印度支那联盟官方文化领域双双显达，恐将引发非议……"
 viet.98.c:0 "这就很尴尬了"
 viet.98.b:0 "他是一位出色的作家和革命者，那么有什么问题吗？"
 viet.98.a:0 "我们可以忽视那种小资产阶级的堕落……"
 viet.150.t:0 "印度支那希望加入[Root.GetFactionName]"
 viet.150.d.a:0 "印度支那联盟推翻了印度支那半岛的德帝国主义。这是亚洲人民从欧洲霸权中解放出来的一步。现在印度支那政府宣布希望加入共荣圈并为了亚洲人的亚洲而奋斗的意愿。"
 viet.150.d.b:0 "英雄的印度支那同志推翻了印度支那半岛的德帝国主义。然而，反对帝国主义的战争在世界革命成功之前永远不会结束。现在印度支那联盟已经宣布他们愿意和我们一起进行最后的斗争！"
 viet.150.d.c:0 "印度支那联盟已推翻了印度支那半岛上的德意志帝国主义并承诺支持我们的革命事业。这是将亚洲人民从帝国主义霸权中解救出来的坚实一步。现在，印度支那政府宣布将加入我们的斗争当中，成为我们的同志加兄弟。"
 viet.150.d.d:0 "英雄的印度支那同志推翻了印度支那半岛的德帝国主义。然而，反对帝国主义的战争在世界革命成功之前永远不会结束。现在印度支那政府已经宣布他们会加入我们对德帝国主义者的正义战争来履行他们的国际义务！"
 viet.150.a:0 "愿我们的友谊万古长青！"
 viet.150.b:0 "越南农民帮不了我们什么……"
 viet.151.t:0 "[From.GetName]拒绝了我们"
 viet.151.d:0 "[From.GetAdjective]政府宣称[From.GetFactionName]不需要我们。"
 viet.151.a:0 "真可惜"
 viet.152.t:0 "印度支那希望合作"
 viet.152.d.a:0 "新独立的印度支那联盟已经改变了印度支那半岛的权力平衡。现在他们已经表示希望与我们进行更密切合作。这是我们击败我们的共同敌人暹罗的好机会。"
 viet.152.d.b:0 "新独立的印度支那联盟已经改变了印度支那半岛的权力平衡。现在他们已经表示希望与我们进行更密切合作。这是我们击败我们的共同敌人缅甸的好机会。"
 viet.152.a:0 "团结起来我们将无往不利！"
 viet.152.b:0 "越南农民帮不了我们什么……"
 viet.153.t:0 "[From.GetName]拒绝了我们"
 viet.153.d:0 "[From.GetAdjective]政府宣称他们不需要我们的帮助。"
 viet.153.a:0 "真可惜"
 viet.154.t:0 "柬埔寨和老挝局势失控"
 viet.154.d:0 "一群革命者在我们占领的老挝和柬埔寨地区掀起暴动，这肯定是印度支那那帮混账支持的。"
 viet.154.a:0 "可恶"
 viet.155.t:0 "印度支那半岛的战争"
 viet.155.d:0 "我们的印度支那同志开始了对暹罗帝国主义者的正义战争，现在是时候收复我们的失地了！"
 viet.155.a:0 "战争！"
 viet.155.b:0 "现在不是个好时机"
 viet.156.t:0 "公社在印度支那的投入？"
 viet.156.d:0 "今日，“法兰西印度支那之友协会”于巴黎召开会议。在这场难得的聚会上，旧雅各宾派马塞尔·加香与民族雅各宾倾向代表雅克·多里奥将军罕见同席，共同呼吁应与这个新近独立的亚洲社会主义国家印度支那建立更紧密联系。他们强调，公社曾为印度支那人民赢得独立作出巨大贡献，但法国对前殖民地的责任不应就此终结。当这个国家正穿越过渡时期、迈向充满自豪与独立、启蒙与社会主义的新纪元时，而与殖民压迫的灰暗往昔相比，这一新时代必将真正彰显社会主义革命理想，我们能够且应当为其人民提供特殊纽带。"
 viet.156.a:0 "他们将与我们一起对抗帝国主义"
 viet.156.b:0 "帮助我们的印度支那同志建设经济"
 viet.156.c:0 "我们能得到啥？越南粉？"
 viet.157.t:0 "与法国的军事纽带"
 viet.157.d:0 "法兰西公社的同志们并没有忘记我们。公社决定与我们建立密切的政治和军事关系。他们派出不少政治顾问，军事工程师和军官以促进印度支那社会主义和军事的发展。"
 viet.157.a:0 "团结一致到永远！"
 viet.158.t:0 "与法国的经济纽带"
 viet.158.d:0 "法兰西公社的同志们并没有忘记我们。公社决定与我们建立密切的政治和经济关系。他们派出不少政治顾问和工程技术人员以促进印度支那社会主义和工业化的发展。"
 viet.158.a:0 "团结一致到永远！"
 viet.159.t:0 "公社对印度支那并不感兴趣"
 viet.159.d:0 "法兰西公社表示他们对我们并不感兴趣。他们拒绝与我们发展出任何社会主义国家之外的关系。"
 viet.159.a:0 "太可惜了"
 viet.161.t:0 "老挝和柬埔寨的起义"
 viet.161.d:0 "从印度支那渗入的煽动者已经在老挝和柬埔寨挑起武装起义。老挝和柬埔寨的游击队正在袭扰我们的士兵以支持他们的印度支那主子。"
 viet.161.a:0 "可恶！"
 viet.162.t:0 "[From.GetNameDefCap]希望建立紧密联系"
 viet.162.d:0 "看上去[From.GetAdjective]正在寻求与离得更近的国家建立紧密的政治与经济联系。[From.GetNameDefCap]已经证明自己是抗击帝国主义的优秀战士，我们对他们的主张感兴趣吗？"
 viet.162.a:0 "东方的无产者，团结起来！"
 viet.162.b:0 "不，我们不需要越南粉和越式法包。"
 viet.163.t:0 "[From.GetNameDefCap]同意了"
 viet.163.d:0 "[From.GetNameDefCap]政府同意了我们的请求。我们将在亚洲建设社会主义！"
 viet.163.a:0 "加尔各答和西贡，永远团结一致！"
 viet.164.t:0 "[From.GetNameDefCap]拒绝了我们的请求"
 viet.164.d:0 "我们的代表并没有被[From.GetNameDef]政府特殊对待。看上去[From.GetNameDef]对我们不感兴趣。"
 viet.164.a:0 "真可惜"
 viet.165.t:0 "[From.GetNameDefCap]希望建立紧密联系"
 viet.165.d:0 "看上去[From.GetAdjective]正在寻求与离得更近的国家建立紧密的政治与经济联系。尽管他们是激进主义分子，[From.GetNameDef]已经证明自己是抗击欧洲殖民主义的优秀战士，我们对他们的主张感兴趣吗？"
 viet.165.a:0 "亚洲人的亚洲！"
 viet.165.b:0 "不，我们不需要越南粉和越式法包"
 viet.166.t:0 "[From.GetNameDefCap]同意了"
 viet.166.d:0 "[From.GetNameDefCap]政府同意了我们的请求。我们将为亚洲人民谋求福祉！"
 viet.166.a:0 "东京与东京的共荣！"
 viet.167.t:0 "[From.GetNameDefCap]拒绝了我们的请求"
 viet.167.d:0 "我们的代表并没有在[From.GetNameDef]被特殊对待。看上去[From.GetNameDef]对我们不感兴趣。"
 viet.167.a:0 "真可惜"
 viet.168.t:0 "来自印度支那联盟的问候"
 viet.168.d:0 "一支涣散跣足的外交使团刚刚抵达福建沿岸，前往我们的首都。这些人来自印度支那联盟，一个从德意志帝国主义手中独立的新兴国家。代表团重申，他们致力于维护双方的历史友谊以及实现将人民从帝国主义枷锁中解放出来的共同使命。他们还设法为我们走私了一些急需的战地药品。"
 viet.168.a:0 "我们将并肩作战。"
 viet.169.t:0 "印度支那联盟派出军事代表团"
 viet.169.d:0 "被中国称为“洪水”的阮山将军，已率领一支军事代表团来观察支援我方的军事行动。阮将军曾在黄埔军校学习，他很高兴能与老同学们重聚。代表团与我们分享了印度支那联盟在反抗德意志殖民军斗争中获得的经验。"
 viet.169.a:0 "很好"
 viet.170.t:0 "印度支那军事代表团归国"
 viet.170.d:0 "阮山将军带领的军事代表团刚刚结束访问，回到了印度支那。"
 viet.170.a:0 "再见"
 viet.171.t:0 "阮山代表团从中国归来"
 viet.171.d:0 "阮山将军带领的军事代表团刚刚结束访问，回到了印度支那。他们带回了对近期中国内战的所见所闻和中国军队的改革方略。"
 viet.171.a:0 "完美。"
 INC_border_skirmish_with_China:0 "我们正在和敌对的中国发生激烈的边境冲突。"
 INC_send_nguyen_son_tooltip:0 "来自印度支那的§Y阮山§!将军加入了我们的部队。"
 INC_nguyen_son_back_tooltip:0 "§Y阮山§!将军现已返回部队服役。"
 INC_the_resistance_decisions:0 "抵抗战争"
 INC_the_resistance_decisions_desc:0 "德意志帝国可能是我们面对过的最强大的军事霸权，但我们必将胜利。抵抗德帝国主义需要极大的勇气和牺牲。但要活下去并赢得战争，仅仅拥有勇气和牺牲精神是不够的。大卫不可能通过一把剑去击败歌利亚。他必须学会如何使用弱者的武器。\n\n目前在印度支那的§Y游击队§!的§Y活跃度§!是：§R[?INC.guerilla_activity|-0]§!\n"
