 INC_Youth_Shock_Brigade_idea:0 "青年突击旅"
 INC_Youth_Shock_Brigade_idea_desc:0 "许多青年人，特别是女性，在特殊的非作战部队中服役，执行各种后勤任务，包括运送受伤的士兵。这大大减少了印度支那军队中的伤亡，大部分伤病很快就返回军队。"
 INC_Youth_Shock_Brigade_idea_b:0 "青年突击旅"
 INC_Youth_Shock_Brigade_idea_b_desc:0 "许多青年人，特别是女性，在特殊的非作战部队中服役，执行各种后勤任务，包括运送受伤的士兵。这大大减少了印度支那军队中的伤亡，大部分伤病很快就返回军队。由于前线的高死亡率和危险的环境，我们决定避免在青年突击旅在前线参加战斗。"
 INC_Youth_Shock_Brigade_idea_x:0 "女性士兵"
 INC_Youth_Shock_Brigade_idea_x_desc:0 "许多青年人，特别是女性，在特殊的非作战部队中服役，执行各种后勤任务，包括运送受伤的士兵。这大大减少了印度支那军队中的伤亡，大部分伤病很快就返回军队。我们现在开始正式从经验丰富的青年突击旅和本地民兵中招募女性士兵。"
 INC_Tunnel_idea_1:0 "地道网络"
 INC_Tunnel_idea_1_desc:0 "印度支那已经在全国大部分地区内建设了复杂的地道网络。这些十分隐蔽的地道服务于各种军事目的。"
 INC_Tunnel_idea_2:0 "胡志明小道"
 INC_Tunnel_idea_2_desc:0 "胡志明小道是一个穿过印度支那的密林高地的复杂补给网络。即使是在印度支那最偏远的地区，士兵也能轻松获取足够的补给。"
 INC_Tiger_and_Elephant_idea:0 "虎与象"
 INC_Tiger_and_Elephant_idea_desc:0 "即使面对最恶劣的地形条件，印度支那的军队也十分灵敏。如果一只老虎只知道和一头大象正面硬碰硬，那么它便只有死路一条。但是如果它利用自己的敏捷，他将有机会击倒更大的敌人。"
