 viet.172.t:0 "倒向罪犯无政府主义思想？"
 viet.172.d:0 "在我们高举安那其红黑旗，行走在通往无国家乌托邦的康庄大道上的同时，以阮安宁和潘佩珠为代表的一些革命领袖与英雄开始在私下里鼓吹无政府思想的某些外围边缘理论，一些人对此头疼不已，而另一些人则拍手叫好。阮安宁和潘佩珠在取代了垂死的法兰西帝国的法公社留学期间，接触了马里于斯·雅各布、克莱芒·杜瓦尔等一众罪犯无政府主义和个人无政府主义人物，这些人物及其追随者支持以雅各布和杜瓦尔的思想为纲的个人主义政策，他们奉个体救赎和“行动宣传”理论为圭臬，将针对反动势力和革命之敌的盗窃违法行为视为在民众之中推动更广泛革命的一种教育工具。印度支那秉持上述理论的罪犯无政府主义拥趸们意图发动一场盗匪战争，消灭任何威胁到我们即将建成的无国家社会的有生之敌，但也有许多人担心一旦最初的目标都被杀干抹净，他们手中的利刃与火枪可能就会对准任何被怀疑为“敌人”的人，我们新生的社会就会陷入动荡之中，整个革命也面临着失败的风险。如今，这一思想正在党内以野火燎原之势疯狂传播，此时此刻，我们必须赶紧决定到底要奉哪一种无政府主义为国之正统。"
 viet.172.a:0 "我们追随的是真正的安那其主义，不是什么披着革命皮的匪盗行径！"
 viet.172.b:0 "“不法行动宣传”乃是通向无国家社会的正途"
 viet.173.t:0 "无政府主义方向之问"
 viet.173.d:0 "阮安宁和潘佩珠过去曾在法兰西公社学习，师从塞巴斯蒂安·富尔及其劳工总联合会，是越南头部的两位无政府主义者，多年来一直共同为越南独立和无国家理念而战。然而，只有一个人能够领导我们的国家，那么我们应该选择谁？是阮安宁的个人无政府主义还是潘佩珠的集体无政府主义？"
 viet.173.a:0 "我们将追随煽动者阮安宁的个人无政府主义"
 viet.173.b:0 "我们将追随老潘佩珠的集体无政府主义"
 viet.174.t:0 "潘佩珠形形色色的盟友"
 viet.174.d:0 "在过去，潘佩珠曾与疆柢亲王、工团主义者和共产主义者胡志明以及其他许多人合作，他们都在不惜一切代价争取越南的自由。现在越南已经获得了自由，且正在走向真正的无政府主义，许多人建议我们以越南民族团结的名义与我们的其中一位老盟友合作，建立一个广泛的大帐篷或是统一战线。我们可以与泛亚君主主义者疆柢合作，建立傀儡君主制，让我们的无政府主义政府躲在幕后运作，还可以与胡志明的门徒合作，创造一种适合越南的无政府主义、共产主义和工团主义的融合。或者，我们也可以继续单打独斗。我们该怎么办？"
 viet.174.a:0 "我们只想向着集体无政府主义前进"
 viet.174.b:0 "与胡志明共同为无政府工团主义和无政府共产主义奋斗"
 viet.174.c:0 "与疆柢合作，推行伪无政府君主制平等主义"
 INC_Peoples_Air_Defence_idea:0 "人民防空"
 INC_Peoples_Air_Defence_idea_desc:0 "印度支那建立起了强大可靠的防空阵地网络，并以建造新型防空设施为要务。印度支那的天空将会越来越安全。"
 INC_General_Van_Tien_Dungs_Reform:0 "总参谋部改革计划"
 INC_General_Van_Tien_Dungs_Reform_desc:0 "印度支那稚嫩的人民军迫切需要改革。总参谋部主张以计划周密的奇袭作为理论基础。凭借周密计划、深入渗透以及现代化的武器装备，印度支那军队将能够在多条战线同时发动进攻，以迅雷不及掩耳之势打击敌人，令其彻底瓦解。"
 INC_General_Nguyen_Chi_Thanhs_Reform:0 "政治军官改革计划"
 INC_General_Nguyen_Chi_Thanhs_Reform_desc:0 "印度支那稚嫩的人民军迫切需要改革。军队政治部认为，人的意志是取胜的关键。印度支那士兵的勇气与坚韧是我们的最大杀器。我们将开展持久的游击战来消耗敌人，并在敌人精疲力竭、士气低落时予以猛烈打击。"
 INC_Workers_Council:0 "创建首届工人理事会"
 INC_Workers_Council_desc:0 "由伟大的俄国革命家所发明的工农兵委员会为我们提供了一种崭新的民主形式。遗憾的是，该制度随着俄国革命的失败而宣告终结。通过恢复地方和国家层面的委员会，我们将以更加优秀的新制度取代现有的民主制度。"
 INC_Syndicalistes:0 "科德利埃派"
 INC_Syndicalistes_long:0 "科德利埃派(Cordeliers)"
 INC_Anarchistes:0 "忿激派"
 INC_Anarchistes_long:0 "忿激派(Enragés)"
 viet.175.t:0 "哲学家来援"
 viet.175.d:0 "第三国际通过社会主义反殖民委员会为我们新生的革命输送来了源源不断的物资援助，而各式各色的人物也随之来到了我们稚嫩的国家予以指导，他们有的在前线出谋划策，有的则以偏向于意识形态的方式出力相助，存在主义理论的一大思想家让-保罗·萨特便是其中之一。萨特反对殖民主义、热爱社会主义，与法国的多位知名哲学家以及各共产主义运动都有过合作，因此，法国政府委派他前来印度支那担任专员，充当我们革命的“观察家”、“政治顾问”。截至目前，萨特已在法国的多份社会主义报刊，如《人文报》，发表了文章，为我们的革命说话。虽然裴公澄等马克思主义者批判萨特的存在主义为“笛卡尔的翻版”、“自由主义的卫道士”，要求严密监视萨特，乃至将其遣送回法国，但萨特的文章确确实实为印度支那等地的革命正了名。综上，就如何对待萨特，目前有三种方案：大力支持他为革命而写作、遣回法国，或者允许其继续参与革命并对其加以监视。那么，要如何做呢？"
 viet.175.a:0 "他的恩情，我们没齿难忘"
 viet.175.b:0 "为“安全”考虑，把他送回法国"
 viet.175.c:0 "让其站在革命的最前线！"
 INC_can_core_Cambodia:0 "我们能够完全整合柬埔寨。"
 INC_can_core_Laos:0 "我们能够完全整合老挝。"
 INC_DDQDD_long:0 "东洋国民党(Dong Duong Cach mang Dang)"
 viet.176.t:0 "印度支那共产主义的路线抉择"
 viet.176.d:0 "东洋共产党已取得胜利，印度支那即将迈入共产主义。不过，我党虽坚持马克思列宁路线不动摇，但同时也集百家之长，其中既有索尔坦加利耶夫、非洲血亲兄弟会、乌克兰斗士派的激进民族主义、反帝的马克思主义，也有法共、“红色雅各宾派”的主流工团共产主义和集权、民族主义的“民族雅各宾主义”，还有重视人民阵线的温和“白劳德主义”。为决定我国的政治道路，政治局召开了一次特别会议，并在会上决定："
 viet.176.a:0 "马克思列宁路线才是唯一的正道"
 viet.176.b:0 "转向反帝的民族主义理念"
 viet.176.c:0 "转向法国的红色雅各宾派"
 viet.176.e:0 "转向法国的民族雅各宾派"
 viet.176.f:0 "转向白劳德同志的广泛社会主义团结路线"
 viet.177.t:0 "印度支那的革命之路"
 viet.177.d:0 "印度支那摆脱了殖民者的镣铐，可以加入到世界革命的大家庭中来了。不过，我们的未来尚未尘埃落定，帝国主义的威胁仍然萦绕在侧，因此，一些人提出以扩张传播革命，以社会主义润泽周边各国。虽然我们大可以无视这一主张，专心于国内的社会主义建设，但若真是下定了决心要走上革命扩张之路，那我们也有几份现成的方案可供参考。呼声最高的方案是把整个印度支那地区统一为一个社会主义联盟，印度支那的各个社会主义运动之间往往相互交织，因此整合起来并非难事。此外，我们也可以以此为基础，遵照民族主义者的意愿，放眼北眺，把两广地区纳入社会主义的版图中来，实现南越族群的大一统。最后，我们甚至可以如某些极端分子所言，拿下整个中国，建立起大中华联盟，抑或是遂了一些南洋社会主义团体多年前的夙愿，以社会主义一统南洋。那么，命途多舛的印度支那人民下一步应该怎么走呢？"
 viet.177.a:0 "为了独立、为了自由，我们已经流了太多的血了，忘记这些野心吧"
 viet.177.b:0 "以统一整个印度支那为目标！"
 viet.177.c:0 "以统一整个印度支那和南越为目标！"
 viet.177.e:0 "以大中华一统为目标！"
 INC_Greater_Indochina_Conquest:0 "大印度支那？"
 INC_Greater_Indochina_Conquest_desc:0 "长期以来，印度支那人一直没有得到过它国的正眼相待，而如今我们建立起了一个强大、独立的国家，一些国民便要求扩张疆界，让我国跻身世界强权之列。"
 INC_Sinosphere:0 "大中华联盟"
 INC_Sinosphere_ADJ:0 "中国"
 INC_Sinosphere_DEF:0 "大中华联盟"
 viet.177.f:0 "以南洋一统为目标！"
 INC_Southeast:0 "南洋革命联盟"
 INC_Southeast_ADJ:0 "南洋"
 INC_Southeast_DEF:0 "南洋革命联盟"