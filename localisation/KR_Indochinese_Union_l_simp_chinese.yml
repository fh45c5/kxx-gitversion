 INC_apathetic_people_idea_3_desc:0 "虽然印度支那乡野地区近来革命热情高涨，但是大多数人仍对革命漠不关心。要消解此等漠然，让民众胸怀大局，仍是长路漫漫。"
 INC_internationale_support:0 "国际支援"
 INC_internationale_support_desc:0 "印度支那革命得到了来自第三国际的大量秘密支援。来自法国的印度支那裔大战老兵和流亡革命者是革命军的支柱。"
 INC_blockade:0 "被封锁"
 INC_blockade_desc:0 "德国海军封锁了海岸，我们不能从第三国际获得支援了。"
 INC_Edu_Reform_idea_1:0 "教育改革"
 INC_Edu_Reform_idea_1_desc:0 "德国殖民者除了香肠什么都没有带来。数百万我们的同胞仍是文盲。为了减少文盲率，我们需要去汉字化，并推行基于拉丁字母的标准化文字系统，这将让识字变的更加容易。尽管这会切断我们与传统的联系，但我们别无选择。"
 INC_Edu_Reform_idea_2:0 "教育改革"
 INC_Edu_Reform_idea_2_desc:0 "德国殖民者除了香肠什么都没有带来。数百万我们的同胞仍是文盲。为了减少文盲率，我们需要去汉字化，并推行基于拉丁字母的标准化文字系统，这将让识字变的更加容易。尽管这会切断我们与传统的联系，但我们别无选择。由于由于扫盲运动，现在许多农民可以阅读我们的宣传并获得现代科学的基本知识，尤其是在农业和卫生方面。"
 INC_smuggling_focus:0 "专注于走私"
 INC_smuggling_focus_desc:0 "为了购买足够的军械，我们开始走私各种商品。"
 INC_Trade_Unionism_idea_1:0 "工会化"
 INC_Trade_Unionism_idea_1_desc:0 "工会是工团主义经济体系的主体。贫穷落后再加上殖民剥削，工会在印度支那尚属稀罕之物。印度支那政府推广建立工会的工作已经初显成果：印度支那各大城市的大多数工人现在都加入了工会。"
 INC_Trade_Unionism_idea_2:0 "进一步工业化"
 INC_Trade_Unionism_idea_2_desc:0 "工会是工团主义经济体系的主体。贫穷落后再加上殖民剥削，工会在印度支那尚属稀罕之物。然而，随着印度支那的快速工业化以及工会的广泛存在，印度支那军队已经加深与工团的关系，并增加了军备的生产效率。"
 INC_Trade_Unionism_idea_3:0 "完全工会化"
 INC_Trade_Unionism_idea_3_desc:0 "曾经被殖民主义拖累的印度支那已经成为东南亚的工团主义灯塔。印度支那经济的全部已经被工会支持的工人接管。"
 INC_Left_Unity_idea:0 "左翼团结"
 INC_Left_Unity_idea_desc:0 "印度支那的社会主义党派已经抛开了分歧并达成了共享权力的协议。随着印度支那左翼的统一，这将使印度支那政府更加强大。"
 INC_Left_Unity_idea_1:0 "左翼团结"
 INC_Left_Unity_idea_1_desc:0 "印度支那的社会主义党派已经抛开了分歧并达成了共享权力的协议。随着印度支那左翼的统一，这将使印度支那政府更加强大。"
 INC_Peoples_Soviet_idea_1:0 "先锋党"
 INC_Peoples_Soviet_idea_1_desc:0 "先锋党通过政治教育和思想灌输巩固政权。"
 INC_Peoples_Soviet_idea_2:0 "先锋党"
 INC_Peoples_Soviet_idea_2_desc:0 "党内先进分子承担向大众普及政治教育，人民通过代表会议实行自己的权利。"
 INC_Partys_Soviet_idea_1:0 "先锋党"
 INC_Partys_Soviet_idea_1_desc:0 "先锋党通过无处不在的党组织牢牢的控制着政权。"
 INC_Partys_Soviet_idea_2:0 "先锋党"
 INC_Partys_Soviet_idea_2_desc:0 "先锋党通过无处不在的党组织牢牢的控制着政权。党的统治通过强大的秘密警察组织维护。"
 INC_Partys_Soviet_idea_2_lar:0 "先锋党"
 INC_Partys_Soviet_idea_2_lar_desc:0 "先锋党通过无处不在的党组织牢牢的控制着政权。党的统治通过强大的秘密警察组织维护。"
