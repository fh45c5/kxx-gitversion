 INC_encourage_peasant_struggle_decision:0 "鼓励农民进行斗争"
 INC_encourage_peasant_struggle_decision_desc:0 "土地改革对农民来说不应该是被动的。他们应该动员起来夺回自己的权利。这是一个激起革命自发性的机会！"
 INC_expropriate_traitors_land:0 "剥夺叛国者土地"
 INC_political_instruction_decision:0 "政治教育"
 INC_political_instruction_decision_desc:0 "农民就像是一麻袋的土豆。我们的干部和政治委员需要按照社会主义的正确路线和方针，认真指导土地改革。"
