 USA_nee_tourism_decisions:0 "新英格兰旅游开发"
 USA_nee_tourism_decisions_desc:0 "新英格兰的海岸、山地与历史城镇仍能为共和国带来安宁与繁荣。相关开发事务将被单独列出。"
 USA_Warmth_Cape_Cod:0 "温暖的科德角"
 USA_Warmth_Cape_Cod_desc:0 "新英格兰并非只有冷峻的清教徒教堂和阴郁的石板街道。克普科德半岛那连绵的白色沙滩、咸湿的海风与点点渔火，曾是无数都市中产阶级逃离钢铁森林的避世之所。大萧条与社会动荡摧毁了这份安宁，也让这里一度陷入萧条。然而如今，我们将重新修缮灯塔，整治渔港，并邀请退伍老兵与本地居民一同参与旅游设施的建设。也许新英格兰一时半刻间回不到昔日的繁华，但至少，它还能再次迎来那些渴望片刻安宁的人们。"
 USA_The_former_glory_of_Newport:0 "纽波特的旧日荣光"
 USA_The_former_glory_of_Newport_desc:0 "罗德岛的纽波特曾是富豪们的夏季度假地，宏伟的别墅与游艇码头彰显着鎏金时代的浮华。如今，我们将鼓励私人资本参与建设与开发工作，将这些曾经象征奢侈的建筑转变为向公众开放的度假与展览场所。或许贵族式的假日已一去不返，但纽波特仍能作为新英格兰面向外界的一扇体面窗口。"
 USA_The_rural_landscape_of_Vermont:0 "佛蒙特的乡村画卷"
 USA_The_rural_landscape_of_Vermont_desc:0 "佛蒙特的乡村从不以繁华著称。连绵的农田、零散的木屋与蜿蜒的小路，构成了一幅朴素却温和的画卷。尽管战乱几乎未曾波及这里，但萧条的经济同样让外来游客止步。通过修复乡间道路、支持家庭旅馆与农庄观光，我们希望让这些安静的地方重新被外界记起。也许游客不会蜂拥而至，但对当地居民而言，每一次来访，都是生活重新走向正轨的证明。"
 USA_White_Mountains:0 "白山脚下的宁静时光"
 USA_White_Mountains_desc:0 "新罕布什尔州的白山从未受到大萧条或是战乱的波及。它们只是静静地矗立在远离人烟的地方，俯瞰着人类的纷争与复原。曾经，这里是城市居民避暑的胜地，是诗人与画家寻找灵感的所在。随着铁路的修复与公路的重建，我们正重新将白山纳入全国的旅游网络。也许这里的旅馆依旧简陋，设施也谈不上奢华，但群山本身，就是最好的招牌。"
