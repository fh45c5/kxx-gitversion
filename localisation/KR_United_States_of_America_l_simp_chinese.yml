 USA.805.t:0 "圣路易斯大会"
 USA.805.d.pp:0 "继杰克·里德和休伊·朗在全国范围内的巡回演讲后，新的平民党准备召开第一次党代会。为了象征他们要代表的广大、多元化的美国人民，并将他们团结在一起，两人将大会的地点定为圣路易斯，这既是因为圣路易斯处于全美的中心位置，也是因为它最近成为了名副其实的“政治战场”。由于当地政府的支持，两人得以成功确保市政礼堂的安全，并邀请了他们党的各派支持者参加活动。由于有来自全美各地的各界人士出席，礼堂会拥挤不堪，这次大会也将有望成为当代美国政治中最重要的事件之一。"
 USA.805.d.npp:0 "继威廉·默里和查尔斯·林德伯格在全国范围内的巡回演讲后，新的国家人民党准备召开第一次党代会。为了象征他们要代表的广大、多元化的美国人民，并将他们团结在一起，两人将大会的地点定为圣路易斯，这既是因为圣路易斯处于全美的中心位置，也是因为它最近成为了名副其实的“政治战场”。由于当地政府的支持，两人得以成功确保市政礼堂的安全，并邀请了他们党的各派支持者参加活动。由于有来自全美各地的各界人士出席，礼堂会拥挤不堪，这次大会也将有望成为当代美国政治中最重要的事件之一。"
 USA.805.a:0 "雄鹰展开双翅！"
 USA.806.t:0 "第一次大会演讲"
 USA.806.d.pp:0 "在圣路易斯的大会上，平民党的纲领将在此得到敲定，而总统提名也将在此得出最终结果。大会的首个议题就是确立平民党的农业与国家产业政策。对于广大的平民党支持者来说，毫无疑问这也是他们所最为关心的议题。而对于代表自身派系首位上台演讲的人选，里德和朗各自都有所选择，但直到大会召开的最后一刻前还仍未做出决定。对于双方来说，第一位演讲者需要是一位优秀的演说家，能够为自己派系的诉求赢得双方的支持，而不是挑动双方政治争端，这样才不会让那些支持平民党的人失去信心。同时，在大会的开幕演讲意味着演讲者将获得极大的关注与支持，也意味着能在接下来的政治谈判中获得更多支持。最终，里德推举威廉·格林这一温和派工人领袖作为左派的发言人。作为劳联会主席的威廉·格林以其富有政治活力的社会改革工会主义而受到了两方人士的大部分支持。而朗则支持他的政治合作伙伴，威斯康星进步派参议员菲利普·拉福莱特作为民粹派的发言人。这位前威斯康星州州长素来支持朗与他的民粹主义议程，尽管他也曾被认为是朗在美国中产阶级心中地位的竞争对手，但如今还是欣然作为朗的发言人代表民粹派发言。\n\n在热情洋溢的演讲中，威廉·格林回顾了工人运动的风云过往，进而向在场的平民党支持者们大幅度批评了如今民主党政府对民众与无产者的剥削与打压。尽管作为劳联会主席，格林并不完全认可里德支持的“一个大工会”理念，但他还是尽可能地用最具感染力的话语呼吁人民对左派诉求的支持。同时，他还向在场的农民们宣布了成立农业合作社与农业工会等一系列提案，也博得了不小的掌声。作为他的对手，拉福莱特州长则选择更加温和而平淡的演讲。拉福莱特回顾了自己的父亲“战斗的鲍勃”的进步主义理想，进而转到批评如今的美国已经沦为了垄断资本与保守者的乐园。他向在场的诸多听众描绘了朗与民粹派为广大贫困农民许下的一系列诸如加大农业补贴或低价农业必需品的承诺，同时将一系列进步派产业政策完美的做出了阐述，引得在场的进步主义者们连连叫好。\n\n最终，在人们越发激烈的掌声与欢呼声中，进步党的首批竞选纲领与口号得到了确定..."
 USA.806.d.npp:0 "在圣路易斯的大会上，国家人民党的纲领将在此得到敲定，而总统提名也将在此得出最终结果。大会的首个议题就是确立国家人民党的农业与国家产业政策。对于广大的国家人民党支持者来说，毫无疑问这也是他们所最为关心的议题。而作为右翼大帐篷的国家人民党，其内部也对上台进行演讲的人选有所争议。对于各大派系来说，第一位演讲者需要是一位优秀的演说家，能够为自己派系的诉求赢得党内大部分人的支持，进而让自己的派系在接下来的竞争中占据优势。同时，维持党内的必要团结也是演讲者们需要考虑的事情，如果大会导致了党内的分裂与冲突，那就得不偿失了。\n\n最终，在经过多轮政治利益交换与讨论后，默里党团推举了亨利·福特这位美国最著名的实业家与大亨作为自己的发言人。作为知名保守主义者与技官主义者，亨利·福特与查尔斯·林德伯格达成了合作，并在国家人民党中为默里提供支持。但福特与林德伯格也在尝试削弱默里与他的旧民主党派系的影响力以为林德伯格争取到总统提名。民族主义者们则推举杰拉尔德·L·K·史密斯作为他们的发言人。作为一名激进的基督徒和民粹主义者，尽管史密斯曾经是朗的至上党中的一员，但在朗倒向诺里斯后，史密斯选择与他们决裂，专注于以基督教和反犹立场进行竞选，因此迅速与国家人民党内部的民族主义者合流并共同竞争1940年的总统提名。而相对温和的保守主义者们则推举了前弗吉尼亚州州长哈里·伯德来为他们进行发言。这位种族隔离制度的坚定支持者与“弗吉尼亚国王”始终在全国的保守主义者中有着显赫的支持率，同时他也因进步党的政治打压而逐步淡出政坛。因此他希望国家民主党能够在未来的大选中击败进步党。\n\n演讲中，亨利·福特回顾了美国的发展过往，进而向在场的国家人民党支持者展示了保守的美利坚所创造的辉煌成就，进而批评如今的进步政府只会为了空洞的口号而运行低效的国家政府。福特宣称，国家民主党的政府将会大力扶植农场主们的发展，同时技术官僚也将代替华盛顿的职业政客，为国家带来生产力与效率。而史密斯则大肆批评了联邦政府对农业市场的干预政策。史密斯声称民族派将在未来放权地方交给各地的农民们自己去解决他们的生计，而不是由华盛顿的愚钝官僚坐在办公室里为农民们思考未来。同时他宣布将以法团主义的手笔改造美国，确保每个美国人都能获得他们应得的，而美国的工业生产也将向着进一步军事化开进。哈里·伯德则为广大的美国小农们构筑了政府关怀与帮助的美好未来愿景，同时宣布政府将减少对劳资市场的干预以确保企业能够得到不受制约的长足发展。同时对于损害国家利益的一切罢工与斗争都将坚决打击，引得在场的国家人民党成员们连连叫好。\n\n最终，在人们越发激烈的掌声与欢呼声中，国家人民党的首批竞选纲领与口号得到了确定..."
