USA_Civil_War_bop_category:0 "§U挽救美利坚§!"
 USA_Civil_War_bop_category_desc:0 "随着新任总统的上台，毫无疑问的是，混乱的美利坚局势仍然没有任何好转，甚至变得比过去更加激进化。§V工会民兵§!、§R无政府主义者§!、§F3k党徒§!、§1一分钟人§!与§g警察§!甚至§P军队§!在街头的争斗烈度日甚一日。在国会中，不同党派之间的相互猜疑与攻讦已经达到了顶点。§u建制派§!与§o激进党派§!矛盾似乎已经不可调和。无论是彻底的§R颠覆旧有的政治秩序§!，抑或是§2挽救即将崩塌的美利坚民主§!，都将不可避免地付出§V血的代价。§!\n\n我们需要依靠§2建制派政治力量§!来维护秩序，无论是达成妥协，抑或是强硬镇压...§R只要每一个激进党派的政治力量被压制在95%下，现有的民主秩序就将不会崩塌。§!然而，维持秩序必不可少需要§P军方§!的帮助，然而对于野心家们来说，一旦他们拥有足够的§P政治力量§!且政府被这些强硬的军人认为是软弱的妥协者与叛徒，那么他们就会§R自己动手，挽救美利坚于水火之中。§!"
