 USA.1519.a:0 "允许他们再度开张"
 USA.1519.b:0 "叛徒不配得到赦免"
 USA.1520.t:0 "对船舶企业的审判"
 USA.1520.d:0 "不少船舶企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 USA.1520.a:0 "允许他们再度开张"
 USA.1520.b:0 "叛徒不配得到赦免"
 USA.1521.t:0 "对工业企业的审判"
 USA.1521.d:0 "不少工业企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 USA.1521.a:0 "允许他们再度开张"
 USA.1521.b:0 "叛徒不配得到赦免"
 USA.1522.t:0 "美国重归统一"
 USA.1522.d:0 "历经漫长的斗争，美国终于恢复统一。我们的国家再度成为横跨大洲的雄鹰，国家的叛徒已尽数泯灭，星条旗高傲地飞扬在美洲海岸，此刻，所有人都拥抱起宝贵的自由。"
 USA.1522.a:0 "完美的联邦"
 USA.1523.t:0 "来自东方的使节"
 USA.1523.d:0 "来自[Root.GetNameDef]的消息表明，麦克阿瑟将军有意放弃权力，我们正紧张等待着东部新政府的表态。停火协定已经签署——那么他们希望与我方达成谅解吗？联邦政府的特使给我们带来想要的答复，他们希望举办一场会谈讨论两大美国民主政权的重聚，大多数西部民众都希望如此，但主张麦克阿瑟必须为他的罪行付出代价，毕竟这位将军在本质上和比尔·海伍德和休伊·朗没什么区别……他们若不愿将道格拉斯送上法庭，我们该怎么相信华盛顿政府不是麦克阿瑟的傀儡呢？"
 USA.1523.a:0 "是美国欠麦克阿瑟人情 - 我们会重新加入联邦，这没有问题"
 USA.1523.b:0 "好啊，让他们知道我们希望先把麦克阿瑟关进监狱"
 USA.1523.c:0 "我们不信任他们，今后也没门"
 USA.1524.t:0 "西部各州拒绝会谈"
 USA.1524.d:0 "令人遗憾的是，太平洋国政府拒绝与我们举行会晤。按照信中的说辞，他们根本不相信我们恢复了真正的民主"
 USA.1524.a:0 "那就这样吧"
 USA.1525.t:0 "只有一项条件……"
 USA.1525.d:0 "太平洋国政府似乎愿意重新加入[Root.GetNameDef]……但只有一项条件：麦克阿瑟将军必须被逮捕，以叛国罪接受审判。对于[From.GetNameDef]来说，道格拉斯·麦克阿瑟与休伊·朗和海伍德一样，对内战时期残忍的杀戮与破坏肩负着不可推卸的责任，如果像他这样的“暴君”不能被树立榜样，他们根本不相信我们愿意复兴真正的民主。我们当然可以这么做，内阁成员中有许多人认为，为了国家和平，这是必要的牺牲，将军本人也接受这样的安排。但说实话，麦克阿瑟已经被很多美国人视为英雄……正是他的出现帮助我们挺过了血腥的内战，这样的结局是不是有些讽刺呢……"
 USA.1525.a:0 "为了美国的利益，我们应当如此"
 USA.1525.b:0 "麦克阿瑟可是他妈的英雄，严词拒绝"
 USA.1526.t:0 "无话可谈"
 USA.1526.d:0 "联邦政府卑劣地拒绝了我们的要求，他们宣称道格拉斯·麦克阿瑟将军是位真正的英雄，正是他的出现将美国从工团主义与激进势力的冲击中挽救出来，并在战后将权力无私地奉还于人民，他们宁可开战也不愿看到将军的名誉受损。"
 USA.1526.a:0 "那就开战吧"
 USA.1527.t:0 "联邦政府同意"
 USA.1527.d:0 "尽管表现得很勉强，联邦政府决定为美国人民的利益接受我们的要求，麦克阿瑟将军目前已遭逮捕，等西部各州重返联邦后就组织庭审，其他细节问题双方可以随着时间推移逐渐达成共识。"
 USA.1527.a:0 "上帝保佑美国！"
 USA.1528.t:0 "我们的同胞回来了"
 USA.1528.d:0 "看来太平洋国政府一直在等待我们发出邀请，他们的答复是斩钉截铁的。民主政治在全美各地走向复兴，远离了工团主义和激进分子的威胁，我们将携手步入新的未来。"
 USA.1528.a:0 "上帝保佑美国！"
 USA.1529.t:0 "美国重归统一！"
 USA.1529.d.full:0 "美国重建民主之后，太平洋各州也失去了坚持内战的理由。历经多场会晤，两国政府最终达成协定，美利坚太平洋国正式与华盛顿当局恢复和平，重新加入联邦。安宁的钟声从西海岸扬起响彻东方的海角；全国各地，街头巷尾，欣喜的人群为第二次美国内战的真正结束而欢呼雀跃——再也不要有内战了。"
 USA.1529.d.arrest:0 "美国重建民主之后，太平洋各州也失去了坚持内战的理由。历经多场会晤，两方政府却未能达成共识，美利坚太平洋国提出的唯一条件是让道格拉斯·麦克阿瑟将军以叛国罪接受审讯，根据官方调查，西部民众认为麦克阿瑟与休伊·朗和比尔·海伍德一样，对内战时期残忍的杀戮与破坏肩负着不可推卸的责任。话虽如此，很多人都把将军本人当成了英雄，所以当他被捕的消息传开时，愤怒的示威活动与太平洋各州回归联邦的庆祝活动同时发生。麦克阿瑟的案件需要花费很多年的时间才能正式进入庭审环节，其结果也毫无疑问会引起民间的轰动效应，但就目前而言，美国内战已经真正结束了。"
 USA.1529.a:0 "有趣"
 USA.1530.t:0 "麦克阿瑟最后的演讲"
 USA.1530.d:0 "似乎察觉到自己离被捕之日不远，麦克阿瑟将军决定在国会发表最后一次演讲，试图说服他的昔日盟友再最后帮他一次。这位昔日的美国陆军总参谋长穿着他的旧军服，回忆起了战时的艰辛岁月。当谈及自己的命运时，他明确表示不会拒捕。“如果美国能因此和平统一”，他说，他宁愿在牢狱中度过余生。他声明他只是为保护美利坚做了应尽之事，并很感激的说道这数年的军旅生涯“实现了他儿时的希望与梦想”。\n\n尽管很多观众鼓掌，反对者几乎立刻破口大骂，强调正是麦克阿瑟的政变引发了内战。而且，他不仅试图在演讲中装作无辜，还试图把[Root.GetLeader]促成和平统一的功劳据为己有。然而，民众会一直记得，他在向会场外的联邦调查员自首前那句标志性的话语："
 USA.1530.a:0 "“老兵不死，只是逐渐凋零。”"
 USA.1531.t:0 "流亡联邦政府将领志愿于效忠我们的事业！"
 USA.1531.d:0 "在一系列审判后，“新美国”政府决定将所有效忠于旧联邦政府的将领扫地出门，他们不公平地被从他们的祖国流放。他们大部分都有西点军校背景，我们试图接触他们，在我们几乎没怎么试图说服他们的状况下，他们已经决定加入我们的事业并且为一个自由的美利坚奉献一切！"
 USA.1531.a:0 "万岁，万岁，哈利路亚！"
 USA.1532.t:0 "流亡太平洋国将领志愿于效忠我们的事业！"
 USA.1532.d:0 "在一系列审判后，“新美国”政府决定将所有效忠于旧联邦政府的将领扫地出门，他们不公平地被从他们的祖国流放。他们大部分都有西点军校背景，我们试图接触他们，在我们几乎没怎么试图说服他们的状况下，他们已经决定加入我们的事业并且为一个自由的美利坚奉献一切！"
 USA.1532.a:0 "万岁，万岁，哈利路亚！"
#军事事件
USA.2000.t:0 "美国陆军现状"
 USA.2000.d:0 "捍卫美国独立是场艰苦卓绝的斗争，联邦陆军在广袤的北美大陆上显得很是单薄，自成立160年以来也很少有过展现自己的机会。1775年独立战争与1812年英美战争期间，这支军队也只取得维持美国独立最低限度的胜绩。尽管新兴的联邦陆军在对抗腐败的墨西哥政府时表现出色，在随后到来的南北战争中，近半数有经验的美国军队选择倒戈到南方成为叛军武装内的核心力量。时间转向近代，当美国陆军在美西战争中对阵缺衣少粮、装备落后的西班牙人时，结果可谓差强人意；此后三十年内镇压半饥半饱的菲律宾起义军也只能说是艰苦奋战而“不辱使命”。因为美国未曾参与世界大战，陆军部在军事理论和技术上逐渐与世界主流军界拉开差距。20世纪30年代的联邦陆军没有坦克，陆军部内甚至有群经常闹脾气的航空兵，北部边界背后的大英帝国正在苟延残喘，国境线以南还分布着不少工团主义的势力范围。尽管美国陆军被要求承担起光荣的责任，保卫合众国免受内外敌人的威胁，几乎没有人真正相信他们有能力履行这份使命。"
 USA.2000.a:0 "他们必须自我历练"
 USA.2001.t:0 "美国海军现状"
 USA.2001.d:0 "海军历来是美国国防部的宠儿，近五十年来在全球海洋事务中扮演着重要的角色，甚至有能力同自负的德国公海舰队和巅峰时期的英国皇家海军相抗衡，正是这股势力捍卫着美洲海岸，稳定传播着进步与民主。从苏格兰裔船长约翰·保罗·琼斯乘坐私掠船席卷英国本土的宏伟事迹，到美西马尼拉湾战役的伟大成就，海军为守护共和国的安危任劳任怨，将侵略者的威胁阻挡于大洋之外。尽管如此，联邦海军的锋芒今已不在，它的船队开始老化，旗舰依然是世界大战时期的古董货。德意志帝国与第三国际正在爆发海军竞赛，英国皇家海军舔舐着自己的伤口；尽管尚未准备好支撑起联合舰队，日本的航空母舰也已投入实战。相对昂贵的军舰而言，海军陆战队或许更为物超所值，他们在热带地区组织过多场成功的军事行动，通过实战历练变得更加训练有素。遗憾的是，海军陆战队的规模很小，且严重依赖少数精锐部队的作战效率。因为部署在远离本土的太平洋岛屿基地上，他们通常也无力干预国内的紧张局势。或许终有一日，大白舰队将再度成为“七海之主”，但许多人怀疑它是否有能力熬过地平线上聚集的风暴。"
 USA.2001.a:0 "永远强大？"
 USA.2002.t:0 "空军独立编制协商会"
 USA.2002.d:0 "20世纪20年代至30年代，美国空军几乎没有任何投资，是军队中最具象征性的部分。然而，过去数十年的空军发展成果表明，对于希望在战场上夺取胜利的军队来说，强大的空军是项至关重要的正资产。令人遗憾的是，陆军最高指挥部在许多方面拒绝承认这一点，并因此与不少希望独立领导筹建空军的航空兵将领发生冲突，国家军队的完整性正岌岌可危。为此，陆军指挥部最终决定与空军将领展开协商，结果是很明显的，航空兵团不可能接受安于现状，他们希望取得更大的自主权，改组为美国陆军航空军。如果这些要求无法得到许可，他们至少也要扩充自身编制以适应未来战场的需求。最高指挥部尚未对这项问题作出明确答复，决定权已被交予战争部裁决。"
 USA.2002.a:0 "扩充美国陆军航空队"
 USA.2002.b:0 "创建美国陆军航空军"
 USA.2003.t:0 "阿德纳·霞飞去世"
 USA.2003.d:0 "经过几个月的住院治疗后，陆军少将阿德纳·霞飞因罹患癌症不幸去世，许多人将他视作美国装甲部队之父，诸多坦克乘员与军官的战术导师，也是美国最出色的军事改革家之一，出人意料地得到陆军的最高指挥权。值得庆幸的是，他在去世前详细整理了改革方案细节，并呈交给最高指挥部，尽管他的去世无疑是场悲剧性的转折，但不会阻碍我国军队实施改革的步伐。"
 USA.2003.a:0 "尽管如此，我们错过了他的才华"
 USA.2004.t:0 "征集民用卡车"
 USA.2004.d:0 "在国防部同意了巴顿将军的陆军机械化改革之后，为了满足我们快速增长的军队需要，我们向总统提出了一项关于征用民用车辆的建议。在他的批准下，我们开始从平民百姓手中征用车辆，尽管令我们吃惊的是，一些自豪的爱国者在我们的仓库旁排队，自愿献出他们的车辆参加即将到来的战斗。虽然并不是所有的车辆都证明对我们有用，但我们设法征用了相当数量的卡车，这些卡车有些需要一些改装适应军标，也有一些坚固到能马上投入军用。"
 USA.2004.a:0 "感谢你们的服务"
 USA.2005.t:0 "生产优先"
 USA.2005.d:0 "当美国各大工厂依照麦克奈尔的火炮设计嗡嗡作响时，一场新的危机正在最高指挥部成员中酝酿。自从美国内战爆发以来，前线有关敌军俯冲轰炸机成队成队地摧毁我方战斗小组的报道，一直是参谋们关心的重点；除此之外，敌军装甲部队的迅速发展正在压倒我们装备简陋的步兵军团。在向战争部申请额外经费之后，这批投资日前已被送到陆军手中，眼下需要借助这笔钱来针对敌军某种特定类型的战术研究和组织防御对策，因此，最高统帅部必须明智地选择投资于哪方面的项目……"
 USA.2005.a:0 "反坦克炮相当关键"
 USA.2005.b:0 "防空炮更为重要"
 USA.2006.t:0 "首场空降演练"
 USA.2006.d:0 "虽然从技术上讲，第一次空降演练进行于1930年，当时的实验者还是用双翼飞机空投机枪小组。今天，空降领域取得了更大的突破，历经两周的艰苦训练和先期准备，志愿者抽签决定跳跃顺序，而后登上飞机开启这场全新的空投试验。负责此次行动的道格拉斯C-33运输机从兰利空军基地起飞，当他们飞行到预定位置时，威廉·赖德少尉率先跳伞，在本宁堡陆军基地附近成功着陆，有幸成为美国历史上首位空降的军人。排名第二的志愿者中途怯场，因此列兵威廉·“瑞德”·金顶上他的位置成功降落，成为真正意义上的第一名空降“兵”，飞机上剩余八名成员最终先后从飞机上跳下着陆，迅速找到预定地点集合，完成来了演练的预期目标，美国首场空降实验大获成功！"
 USA.2006.a:0 "准备安排新的跳伞计划"
 USA.2007.t:0 "首支伞兵师成功组建"
 USA.2007.d:0 "预定的大规模跳伞实验终获成功，在约翰·李将军的祝福下，尤斯蒂斯堡军事基地重新开放，为新训伞兵部队招募志愿者。尽管高度的训练标准和相对更高的死亡风险，使志愿者数量最初很少，但经过最高指挥部批准，将伞兵工资提高到步兵三倍后，第501伞兵营很快宣告成立，紧接着是其他营团。经过一周的招募工作，志愿者数量已经足够组成五个伞兵师供我们使用。尽管这些新兵欠缺实战经验，但不应低估空降战术领域的这一突破，高级指挥官们期待着看到他们该领域的投资得到有效回报。"
 USA.2007.a:0 "死亡天降"
 USA.2008.t:0 "陆军保守派抱怨航空军的成立"
 USA.2008.d:0 "国防部同意成立美国陆军航空军的决定，实际上为空军将领赋予极大的自主权，不少陆军高级军官都出面反对这项改革。他们最引人注目的观点是，国防部有限的军事预算原本是在陆海军间平均分配的，但获取自主权后的空军部队正变得比任何时候都像是陆军内部的吸钱机器，严重压缩了他们好不容易从海军那里抢来的经费。尽管他们不断向战争部发出措辞激烈的投诉信，既然决策部门已经决定启动改革，自然没有什么回头路。"
 USA.2008.a:0 "他们必须学会互相尊重"
 USA.2009.t:0 "麦克阿瑟发难海军"
 USA.2009.d:0 "政府划拨给海军的资金越来越多，总参谋长麦克阿瑟决定为此向国防部长提出警告：他认为海军近期获取的大笔投资是海军高层30年代初以来潜心谋划的军事阴谋的延续，企图主导陆军的地面作战将其转变为海军下属的“卫戍部队”。尽管国防部长设法让麦克阿瑟将军平静下来，并向他保证，陆军在战场上的作用永远是第一位的，但有关这场会谈的内容不幸流出后，包括道格拉斯·麦克阿瑟的死对头，哈特上将在内的多名海军上将已经致信国防部要求麦克阿瑟辞职。尽管麦克阿瑟与海军部门的关系多年来总是很糟，但这起事件表明过去几年内两大兵种间的竞争依然愈演愈烈，没能在彼此和解上取得太多进展，实在令人遗憾。"
 USA.2009.a:0 "他们有什么毛病？互相吵架能打赢仗吗！"
 USA.2010.t:0 "麦克奈尔发表反机械化作战防御手册"
 USA.2010.d:0 "历经数十年的潜心研究与经验总结，再加上对海内外近期爆发的多场冲突的紧密分析，莱斯利·麦克奈尔将军日前出版了其新作——《反机械化作战》，在其中对机械化战术的最新演进提出探讨，并详细解答美国陆军该如何反制他们的进步。这本手册共有七大章节，第一章是全文的总览，剩余六章则对多种环境下的反坦克单位运用进行阐述（推进期间、停止行军、战争发展、防御策略、逆行运动、进攻战斗），着重强调坦克在现代战场中的卓越能力，以及它们在当代野战环境下的独特运用，速度与机动性使坦克作战缺乏固定前线，但确保侧翼与后方地带遭受袭击的要求也随之提高。尽管军校生们正在厌倦整天轮换着阅读战术手册的生活，近期的军事会议使这本书成为预备军官的必修读物。"
 USA.2010.a:0 "终于搞定了！这本书将引领我们走向胜利！"
 USA.2011.t:0 "霞飞将军组织作战指挥"
 USA.2011.d:0 "20世纪30年代初，霞飞将军在发展他的机械化作战理论时，首先提出联合机械化作战部队将不会有正式的编制结构。为了将个人想法更加连贯地传递给最高指挥部，霞飞日前出版新作《装甲部队组织简表》，按照书中阐述的理念，机动部队的战斗指挥体系应是更为灵活的，不该配置固定的营级单位，与之相反的是，坦克、装甲步兵、装甲野战炮兵营、小编制的坦克歼击车、工程兵和机械化骑兵应当按照战场需要随时调配，完成上级指挥部门直接给定的任务。为实现这项目标，霞飞希望将现有装甲部队划分为三大作战指挥部，主力部队命名为“A”，侧翼守备部队命名为“B”，预备部队命名为“R”。尽管相关改革规划显然受到德国“战斗群”理论的启发，最高指挥部依然对他的想法敞开怀抱，新的组织制度正在全面推广中，基层军官们也被提供修订后的工作培训手册。"
 USA.2011.a:0 "向德国人学习是值得的"
 USA.2012.t:0 "陆海军联合标准通讯字母表"
 USA.2012.d:0 "内战时期的惨烈战斗，带给我们的重要经验之一，就是提高前线通讯传递速率和清晰度，且不应让敌方过于便利地截获我方的行动计划和部队组织情况。为此，我们决定建立统一的无线电军用字母表，陆海军各自向他们的通讯部门传递指示，为我们的士兵建立新的无线电呼号系统。如今，这项努力已经初见成效。《陆海军联合标准通讯字母表》印发后，我军将正式启用新版通讯代号：Able、Baker、Charlie、Dog、Easy、Fox、George、How、Item、Jig、King、Love、Mike、Nan、Oboe、Peter、Queen、Roger、Sugar、Tare、Uncle、Victor、William、X-ray、Yoke、Zebra。尽管加拿大与德国早已开发过类似的无线电代号体系，至少我们也实现了标准化改革，成功弥补一项我们曾在世界大战期间错过的教训。"
 USA.2012.a:0 "这将使我们在通讯联络领域更具优势"
 USA.2013.t:0 "采用M1头盔"
 USA.2013.d:0 "世界大战时期的宝贵经验表明，头盔对于保护士兵免受溅射弹片的伤害至关重要，美国陆军曾向士兵发放约翰·布罗迪设计的英国Mk I型头盔（“布罗迪军帽”），但未能投入量产，只是在20年代初英国陷入经济危机期间以低价大量采购这种步兵装备。尽管这些头盔在当时依然是有效的，我们在内战中所得到的经验表明，它已不再适合现代战争的需要。因此，哈罗德·西德汉姆少校负责领导的研究小组被要求寻找这种头盔的改良方案，他们的结论是移除“布罗迪军帽”的帽檐，加厚侧片与耳部保护层，将悬架系统整合到单独的内衬中，由此诞生的新型号将提供旧式头盔无法承担的保护性能。最初的测试系列被命名为“TS3”，来自步兵委员会最近几周的报告表明，新头盔的表现情况良好，只要得到陆军部批准，它就能迅速投入大规模生产，供应我国快速增长的陆军部队。"
 USA.2013.a:0 "很高兴我们终于能摆脱“布罗迪丧帽”了！"
 USA.2014.t:0 "胜利之书运动"
 USA.2014.d:0 "成千上万的新兵正在涌入全国各地的训练营，社区图书馆迅速意识到他们眼前正摆着彰显爱国情怀的极佳时机。在部分图书馆的带动下，为各地军事基地捐献图书的活动正在火热展开。过去数月内，美国图书馆协会成员开会讨论决定，在全国范围内向军队发放免费图书，以此协调政府的大规模动员行动。美国劳军联合组织和红十字会听说图书馆协会的倡议后，对此表示热烈欢迎，劳军组织收集大批图书在军营外建设起四百多家劳军俱乐部，红十字会则希望将这些书籍送到军事医院、战俘营、海外劳军俱乐部和缺乏图书馆设施的偏远营地。两大组织很快达成共识，平摊该项目的资金，而图书馆协会负责派遣专员提供技术服务，并将相关意见提交到联邦政府寻求支持。尽管许多军方保守人士并不希望接受这笔免费的馈赠，但我们的士兵确实需要些额外的娱乐项目，因此，陆军最高指挥部决定批准该计划。"
 USA.2014.a:0 "希望士兵们能享受其中"
 USA.2015.t:0 "取消“胜利之书”运动"
 USA.2015.d:0 "“胜利之书”运动成功在前线建立起“战时图书委员会”和“战争图书小组”等基层服务组织，遗憾的是，事实证明这项运动确实不适用于前线战斗部队，笨重的精装书不适合被运往前线，不少捐助的图书也未能通过“陆军审查委员会”的批准，以去年收集的10827097本图书为例，有相当高的比例被裁定为不合格，共计5052858本书籍被当做废品扔掉，军方内部对这场运动的批评正在日益加剧。因此，陆军部决定提前叫停“胜利之书”运动，与其他劳军组织展开合作，讨论如何制定更加行之有效的图书发放计划，造福我们的前线士兵。"
 USA.2015.a:0 "结束，意味着新的开始"
 USA.2016.t:0 "军事版书籍修订工作"
 USA.2016.d:0 "平面设计师斯坦利·汤普森、项目总监马尔科姆·约翰逊与国内出版商合作，同陆军图书部主任雷蒙德提出他们制作“军事版图书”的想法：任命文学专家从经典著作、畅销书、幽默书刊和诗集中筛选出大量有益的图书，装订为易于携带和运输的平装版本。这项计划首先得到海军图书部主任伊萨贝尔·迪布瓦的支持，并将计划提交到最高指挥部。尽管该提案是合理的，特劳特曼在会议中提出新增的某些条款，却在高级军官中引起广泛争议。正如他所说的那样，任何情况下，所有书籍都应该为两大兵种的士兵所共同享受，所有涉嫌“冒犯我们的盟友、在宗教或种族群体问题上持激进态度，与美国民主精神不符”的书籍，都不应入选该项目。尽管部分军官们对此颇有异议，陆海军最高指挥部已宣布批准该项目及其修订版本，两大兵种部门都将置备自己的印刷机，并在必要时向该项目提供更多资金，提高印刷规模。"
 USA.2016.a:0 "希望这些书籍能借此保存下来"
 USA.2017.t:0 "狙击手训练计划？"
 USA.2017.d:0 "我们不得不在城市战争中学习严酷的教训，我们已经认识到我们的军队对于面对战场上的新危险——敌人的狙击手——毫无准备。尽管狙击兵在大战期间证明了他们的作用，但陆军的最高指挥官从未认为有任何理由扩编狙击手部队，因为它被视为欧洲战场的一种情境解决方案。然而，在美国山区、城市和森林的战斗证明，指挥官们不仅是错的，我们也为此付出了沉重的代价，我们缺乏反击敌人狙击行动的手段，更不用说派出我们自己的狙击手去消灭敌方的高价值目标了。因此，高级指挥官提议推行一项类似于加拿大在大战中进行的狙击手训练课程。"
 USA.2017.a:0 "提案取得通过"
 USA.2017.b:0 "提案遭到否决"
 USA.2018.t:0 "狙击手筛选工作"
 USA.2018.d:0 "首批获选的狙击手正在进行课程基本训练，更多问题也随之浮出水面。新训狙击兵来源于美国军队的志愿者，与海军陆战队和陆军游骑兵相比，正规军志愿者的表现与他们可谓是天壤之别。目前，两大精锐兵种都在争夺战争部的狙击项目资金，我们应该更偏重于哪方呢？"
 USA.2018.a:0 "支持陆军游骑兵"
 USA.2018.b:0 "支持海军陆战队"
 USA.2019.t:0 "紧急事务管理处"
 USA.2019.d:0 "内战爆发后，总统阁下通过行政命令成立新办公室，命名为“紧急事务管理处”，专门协助白宫处理紧急国防事务。他们的常规工作是保持与国防机构的联系，协调军事计划，确保陆海军与总统直接沟通的渠道。尽管如此，过去数十年内联邦政府的行政部门总体而言是过分膨胀的，种类繁杂的各类办事处、行政机构和委员会职能交错，互相添堵。因此，不少政府官员认为总统应该寻找压缩办事处数量、提升现有机构行政效率的方法。"
 USA.2019.a:0 "至少目前，我们有必要成立新部门"
 USA.2020.t:0 "联邦战争资讯办公室"
 USA.2020.d:0 "鉴于国内尚且缺乏集中化的行政管理机构来指导战争资讯事务，许多民间报纸在发掘和解读前线新闻的同时，不断对他们的报道进行轻微篡改和夸张，使公众很难知道究竟哪些信息是真实的，哪些是煽动性宣传。因此，在总统与战争部联名支持下，联邦战争资讯办公室日前正式成立，负责担当前线与公众的联系纽带。尽管不少独立新闻机构对中央政府担当战时新闻独家发行商的做法表示担忧，但许多专家认为这是必要之举。"
 USA.2020.a:0 "没什么好怕的，我们只传播真相！"
 USA.2021.t:0 "改变航空军标示？"
 USA.2021.d:0 "新问题被提上了议程，鉴于我国战斗机与敌军的航空标识很像，尽管部分单位可以通过无线电通信分辨敌我，战争部依然接获不少友军误击和敌军出乎意料地突破防空网络袭击后方部队的报告。因此，空军将领提议改变航空军现有机徽，前蓝后白红圆底五角星，使我国地面防空部队可以更好地区分敌我空军单位。我们应该批准这项改变吗？"
 USA.2021.a:0 "让敌人去改吧！这种机徽是我们的专利"
 USA.2021.b:0 "更换机徽"
 USA.2022.t:0 "授权燃烧弹空袭？"
 USA.2022.d:0 "从世界大战期间成功的战略轰炸战术得到启发，美国航空军日前将他们的新提案递交到最高指挥部，主张如何利用部分预算，大批量制成某种特殊的化学混合物，生产特种炸弹，在落地时会引发巨大而难以扑灭的火灾，他们也觉得这种武器也可以在美国的土地上使用，打击我们的敌人。尽管这种新型炸弹的威慑力惊人，且能有效阻碍敌军的工业能力，但使用这种非人道武器的道德阴影令许多参谋人员深感不安，这些炸弹更容易误击平民。冒着这样的风险批准该计划是否值得呢？"
 USA.2022.a:0 "没错，他们都是叛徒！"
 USA.2022.b:0 "不，地面上有许多我们的美国同胞！"
 USA.2023.t:0 "战争部办公处迁往某海军军需仓库"
 USA.2023.d:0 "陆军部规模膨胀迅速，遗憾的是，白宫附近的国务院无法给陆军部办公室提供更多发展空间。因此，战争部长日前授权该部门搬迁到海军部贡献出来的某处大型弹药仓库。尽管如此，这家仓库的规模依然太小，无法承载日益繁重的战争需要，联邦政府已批准建设规模更大的战争部新址，预计可容纳24000名雇员和17家目前分散在不同地区的独立项目办公室。此外，白宫还要求该建筑至少可以额外容纳10000名新雇员，为未来的冲突做好十足的准备。"
 USA.2023.a:0 "“告诉总统我们需要更多的空间！”"
 USA.2024.t:0 "麦克奈尔关于军队状况的报告"
 USA.2024.d:0 "依照最高指挥部的命令，麦克奈尔将军日前将我国军队存在主要缺陷，汇编成详细报告递交给上级机关，如果我们希望在内战中克敌制胜，就必须解决这些紧要的问题。麦克奈尔提交给陆军部的报告主要内容如下：\n\n1、小编队微战术训练明显不足。\n2、战区指挥部对步兵师及其附属战斗部队的错误运用。\n3、没有充分认识到机动车辆的用途，不善于在战场上适当应用其能力。\n4、侦察工作不到位，相邻部队间缺乏联系。\n5、师属炮兵单位无法有效支援步兵。\n6、无线电通讯出现传递偏差。\n7、反坦克炮的应用欠缺积极性。\n8、错误的骑兵战略应用。\n9、忽视弹药供应和伤员疏散工作。\n10、错误评估结果引发全面战略误判。\n\n同样的，其他参谋部军官也提出他们看到的问题，参谋部目前缺乏合格人员与指挥官担当一切要职；此外，对单兵训练的关注不足，会拖累整体单位训练的实际效力。"
 USA.2024.a:0 "如果我们想战胜对手，就必须推行改革"
 USA.2025.t:0 "五角大楼建设工程"
 USA.2025.d:0 "有鉴于长期待在海军军需仓库办公的种种弊端，为战争部设立规模更大的永久性办公机构近日来变得愈受欢迎。军方首先求助于陆军建设部门负责人布里恩·伯克·萨默维尔准将，他则委任设计部主任休·凯西中校，在弗吉尼亚州波托马克河沿岸的阿灵顿国家公墓附近，仓促买下一块五边形土地，用以存放陆军部的所有设备。战争部新址原本计划建在名为“阿灵顿实验农场”的地方，但附近的公路围成的土地恰好呈五边形，非常考验建筑团队的地理适应能力。且各部门对于在公墓群中设立总部大楼心存顾虑，他们认为“这片土地对全体美国人而言都是神圣的，不应轻易冒犯”，这些观点与华盛顿当局的想法惊人的吻合，因此后者已向军方提出两处新的选址。不幸的是，建筑材料的选购已经通过审批，所有规划都已按照某五角形状的大楼加以安排，即使我们改变建筑的位置，出于节约资源的需要，未来的战争部大楼依然是五角形的——至少联邦政府眼下还有权利决定这座“五角大楼”应该建在哪里。"
 USA.2025.a:0 "让它留在阿灵顿实验农场"
 USA.2025.b:0 "让它建在阿灵顿公墓附近的新址上"
 USA.2025.c:0 "废弃的胡佛飞机场就很合适"
 USA.2026.t:0 "战争部进驻五角大楼"
 USA.2026.d:0 "尽管新总部的建设工作依然火热进行中，战争部日前决定提前搬迁到未完工的那栋建筑中，不再和海军部的家伙们争夺空间。即使这座建筑并未完工，它已经得到了一个“五角大楼”的亲切称呼，这已经成为了官方说法，五角大楼尚未建成的三角将被设计为能够容纳更多战争部雇员的新式结构。"
 USA.2026.a:0 "希望这是最后一次扩建"
 USA.2027.t:0 "五角大楼完工"
 USA.2027.d:0 "最后一角终于宣告落成，这栋新式钢筋混凝土大楼终于成为美国战争部的新家，总计有680000吨河沙从波托马克河中被挖掘出来承担工程任务。五角大楼总占地面积约28.7英亩（11.6万平方米)，此外包含一座5.1英亩（2.1万平方米）的中央庭院。建筑走廊是如此的庞大而绵长，传令兵们甚至被特意配发旱冰鞋与自行车，以此加快办公室间的信息传递速度。"
 USA.2027.a:0 "从现在开始，我们的国防工作应该得到更好的保障……"
 USA.2028.t:0 "战争宣传联盟希望得到支持以创建美国广播电台！"
 USA.2028.d:0 "陆军部的一个新分支，战争宣传联盟正在请求资金来建设美国广播电台，一个可以让他们以更个人的方式来和公民对话以让他们支持美国的现任政府，特别是在防御无政府主义者，朗朗人和旧民主党人的威胁方面起到重大作用。他们现在注意到一位直言不讳支持联邦党事业的演员，他叫罗纳德·里根，这个人将在广播电台项目获准后成为该节目的主持人，他被选上的原因是他非常支持我们的事业，甚至为此特地搬家到了东部的事情广为流传。鉴于我们的支持者仅限于华盛顿特区，这个电台很显然对提高我们的支持率很有帮助。"
 USA.2028.a:0 "同意项目"
 USA.2028.b:0 "看起来太费钱了"
 USA.2029.t:0 "关于联合工团的报告"
 USA.2029.d:0 "公民们，竖起耳朵来，有一篇从联合工团来的报告，让我警告你们，这报告的内容可不妙。很明显，无政府主义者、共产主义者和其它赤匪分子已经宣布要夺取那些不幸生活在他们领土上的美国公民的财产。海伍德、福斯特、白劳德和其他工团主义的主要人物们认为，通过剥夺公民的自由，他们正在为光辉的新未来铺就道路，正如我们在同样专制的法兰西公社和不列颠联盟中所看到的那样，他们都流放了自己的公民，而且不允许公民发表任何反政府言论。现在，我想我已不用告诉你们，我们生活在这样一个受到红白蓝旗帜保护下的国土上是多么幸运，但以防万一，我想告诉你们，我们确实是幸运的。所以，当你下次回家或上班的时候，记住如果联合工团赢了会发生什么，以及你能做些什么来防止这种情况发生！这是罗纳德·里根的美国广播电台，放送结束。"
 USA.2029.a:0 "好消息"
 USA.2030.t:0 "关于旧民主党的报告"
 USA.2030.d:0 "公民们好！恐怕您要听到一些不幸的消息了。看来在南方腹地的旧民主党人又开始开始恐吓他们治下的公民，并且授权那些被称作黑色军团的恐怖分子开始不分肤色地对普通公民实施犯罪了。显然三K党对于我国南部黑人居住带的袭击已经成为了普遍现象，他们在那里胡作非为，实行种种罪恶行径。幸好有国会和麦克阿瑟将军站在我们这边，我们才既能够免受他们所遭受的灾难，又能够为他们带来解放。请记住，帮助麦克阿瑟，就是帮助美国。谢谢大家。"
 USA.2030.a:0 "好消息"
 USA.2031.t:0 "宾夕法尼亚是我们的！"
 USA.2031.d:0 "好消息！我的美国朋友们！我们已经夺回了联合工团曾经据有的美利坚的神圣领土，也就是众所周知的宾夕法尼亚州。那些整天担心被赤卫队袭击或者关注自己能否取回自己财产的美国人，他们的问题都已经被解决了。那些实施所谓“私自执法”的疯狂武装分子都已经被抓获，所以广大的普通美国民众们已经可以回来寻找自己的财产了。而且工团暴徒的领导者已经被我们迅猛的攻势吓坏了。很快，美利坚将重归一统！"
 USA.2031.a:0 "上帝保佑美国广播电台"
 USA.2032.t:0 "休伊·朗倒台！"
 USA.2032.d:0 "大骗子休伊·朗终于落荒而逃！此等篡国国贼自然无法统率诚实而热爱自由的优秀的美利坚人民。他那以一分钟人自居的伪军亦将化为历史遗迹，只有那些1776年的真正的一分钟人才是代表了美国精神、理应被美国人民永远铭记的人。同样，他那乔装打扮试图掩盖其左派本质的行为亦将为人不耻。看起来，他本人及其走狗的失败是我们朝着打败所有敌人、统一美国所走出的一步。"
 USA.2032.a:0 "上帝保佑美国"
 USA.2033.t:0 "无声的科学竞赛"
 USA.2033.d:0 "如果说十九世纪属于铁路与钢铁，那么二十世纪必将属于实验室与研究所。如今，各国之间的竞争早已不只是舰队规模或工业产量，更取决于谁能够率先发现新的元素、设计新的发动机、制造新的武器。\n\n德意志帝国依托皇家威廉学院建立起覆盖整个中欧的科研体系；法兰西公社则以达摩克利斯小组集中全国最优秀的科学家，从理论物理到不断挑战传统技术的极限。与此同时，美国虽然拥有世界上数量最多的大学、企业实验室与私人基金，却长期缺乏统一协调，全国科研力量依旧分散于政府、企业和高校之间。越来越多的人开始意识到，未来决定战争胜负的不再只是工厂，而是实验室；决定国家命运的不再只是将军，而是科学家。共和国若想继续保持领先，就必须主动投入这场没有硝烟的科学竞赛。"
 USA.2033.a:0 "美利坚将战胜一切！"
 USA.2034.t:0 "暗中刺探"
 USA.2034.d:0 "中央情报机关送回了一份厚厚的欧洲科研评估报告。如今能够代表世界最高科研水平的组织只有两个——德意志帝国的皇家威廉学院，以及法兰西公社直属的达摩克利斯小组。无论是高速航空、电子计算、火箭推进还是核裂变，两国都已经投入了大量资源，并对研究成果实行最严格的保密制度。过去数月间，我们安插在欧洲的数名情报人员已经成功进入相关工业企业、大学与研究机构。他们不断收集试验数据、工程图纸和研究报告，并建立起一条稳定的秘密情报线路。然而，真正核心的技术资料依旧掌握在最高等级实验室之中。行动负责人提出两种方案：继续保持潜伏，等待未来更具价值的目标出现；或立即发动行动，冒险获取最重要的科研成果。"
 USA.2034.a:0 "潜伏下来，直到必要时机"
 USA.2034.b:0 "动手吧"
 USA.2035.t:0 "“蜂鸟”行动"
 USA.2035.d:0 "行动成功了。\n\n经过数月准备，我方特工成功接触到达摩克利斯小组外围的一名技术人员，并利用短暂的安保漏洞，将一批编号极高的研究资料秘密送出法兰西公社。文件经过数次中转，最终抵达华盛顿。当科学顾问打开密封文件时，所有人都沉默了。里面详细记录了公社物理学家关于铀裂变链式反应的最新实验成果，以及一种足以释放难以想象能量的新型炸弹理论设计。虽然这些资料距离真正制造武器仍有相当距离，但它已经证明，一种能够在瞬间毁灭整座城市的武器并非科学幻想，而是现实世界正在逼近的未来。"
 USA.2035.a:0 "很好"
 USA.2036.t:0 "新式武器构想"
 USA.2036.d:0 "第二次美国内战不仅改变了军队对于现代战争的认识，也彻底改变了美国科学界的发展方向。战争期间，无论是航空发动机、无线电通信，还是火箭推进、高能炸药，都在残酷的实战环境中获得了远超和平时期的发展速度。如今战争结束，许多曾经服务于战场的技术，正逐渐走进国家实验室与大学研究所。最近，总参谋部向总统递交了一份科研评估报告。报告认为，未来战争的胜负，将越来越取决于科学家而非单纯的工业产能。贝尔飞机公司的创始人劳伦斯·贝尔提出，一种依靠全新推进方式的高速飞行器有望突破传统螺旋桨飞机所能达到的性能极限；与此同时，一批来自加州大学、芝加哥大学和哥伦比亚大学的理论物理学家则开始讨论另一项更加大胆的构想——利用原子内部所蕴藏的巨大能量，制造一种威力远超任何现有炸弹的"超级炸弹"。\n\n目前，没有人能够保证这些计划一定能够成功。火箭发动机仍存在稳定性不足的问题，核裂变理论也仅停留在实验室阶段。然而，如果哪怕只有其中一项获得突破，它都足以彻底改变未来战争的面貌。"
 USA.2036.a:0 "为两者批准更多资金"
 USA.2037.t:0 "阿尔伯克基计划"
 USA.2037.d:0 "代号"X计划"的高速飞行器研究终于迎来了突破。数年以来，贝尔飞机公司的工程师不断改进燃料配方、推进系统以及机翼布局，希望制造出一种真正突破传统航空理论的新式飞机。经过无数次失败、爆炸与坠毁之后，他们终于迎来了属于自己的时刻。\n\n今天上午，新墨西哥州阿尔伯克基附近的试验场聚集了来自陆军航空队、海军、政府以及科研机构的大批观察员。当实验机缓缓离开跑道后，所有人的目光都集中在测速仪器上。随着发动机推力不断增加，这架银白色实验机突破了过去任何螺旋桨飞机都无法企及的速度，并在短短数分钟后成功跨越了长期被航空界视为理论极限的音障。\n\n负责试飞的杰克·伍拉姆斯安全返航后，全场爆发出雷鸣般的掌声。虽然实验机距离真正装备部队还有很长一段距离，但它已经证明，高速喷气航空时代并非幻想。陆军航空队相信，这项技术终将彻底改变未来制空权的争夺方式；海军则开始幻想拥有能够在数小时内横跨整个大陆的新式舰载机。"
 USA.2037.a:0 "也许这能够改变如今的空战格局"
 USA.2038.t:0 "爱因斯坦-西拉德信"
 USA.2038.d:0 "近几个月来，欧洲不断传来的情报令美国物理学界愈发不安。根据可靠消息，法兰西公社直属的达摩克利斯小组正在集中全国最优秀的理论物理学家，对铀元素的核裂变现象展开深入研究，并试图将这种惊人的能量应用于军事用途。\n\n这一消息最先引起了匈牙利裔物理学家利奥·西拉德的警觉。早在数年前，他便意识到链式核裂变反应所蕴藏的巨大潜力，也因此明白，一旦有人率先制造出能够释放这种能量的武器，其破坏力将远远超过任何已知炸弹。为了让政府真正重视这一危险，他拜访了自己最具声望的同行——阿尔伯特·爱因斯坦。起初，爱因斯坦对于再次介入政府事务显得十分犹豫。他毕生致力于和平，也始终认为科学应当造福人类，而不是成为毁灭文明的工具。然而，在阅读了西拉德整理的欧洲情报后，他最终还是拿起钢笔，在信件末尾签下了自己的名字。\n\n这封后来被称为《爱因斯坦－西拉德信》的文件，很快送达总统办公桌。信中警告政府，若法兰西公社率先完成核裂变炸弹研究，美国将面临前所未有的战略危机，并建议立即组织全国科学力量，开展属于美国自己的原子研究计划。"
 USA.2038.a:0 "至少这证明了我们的构思可行"
 USA.2039.t:0 "[GetYear]年华盛顿理论物理会议召开"
 USA.2039.d:0 "在联邦政府的邀请下，来自全国各地大学、研究所、军方实验室以及工业企业的数百位科学家齐聚华盛顿，共同参加本年度理论物理会议。这是美国历史上规模最大的科学会议之一，也是政府首次以国家名义协调基础科学研究。\n\n会议期间，关于量子理论、宇宙射线、核裂变、高能粒子以及电子计算等前沿课题的讨论几乎没有停歇。年轻学者们大胆提出各种新的理论假设，而经验丰富的教授们则不断用数学推导检验这些看似疯狂的构想。来自军方的观察员虽然很少参与讨论，却认真记录着每一项可能改变未来战争的研究成果。除了理论物理之外，航空工程、无线电通信、材料科学以及火箭推进等领域也首次建立起跨学科合作机制。越来越多的人意识到，现代科学已经无法依靠某一位天才独自完成，未来属于实验室、研究团队以及遍布全国的科研网络。会议闭幕时，总统在演讲中宣布，联邦政府将持续扩大科研预算，支持大学、企业与国家实验室共同承担未来科学计划。"
 USA.2039.a:0 "科学时代！"
 USA.2040.t:0 "绝密工程"
 USA.2040.d:0 "过去数年内，我国军事研究主要集中于潜在的国内冲突，忽视了对长期项目应有的照顾和经费补贴。然而，越发逼近的战争威胁与变动的国际局势逼迫我们不得不加大对军事前沿技术的投资，尤其是能够决定战役甚至战争胜负的关键兵器。现在，在总统的要求下，联邦政府将上马一项新的绝密工程计划，制造能够主导战争的“超级武器”。如今，在我们的选择中，奥本海默的高能炸弹构想与戈达德的飞行火箭成为了最佳的两个项目，但政府的目前的预算资金只能选择其中的一项。（1）戈达德的火箭，理论上它能在不危及飞行员生命安全的情况下，向数英里外的地方发射爆炸物。（2）奥本海默的理论炸弹，其原材料是奥地利与德国曾研究过的放射性重金属。"
 USA.2040.a:0 "戈达德的火箭"
 USA.2040.b:0 "奥本海默的炸弹"
 USA.2041.t:0 "戈达德火箭发射成功"
 USA.2041.d:0 "从新墨西哥州罗斯威尔的家中，戈达德再度启程前往试验场观摩火箭发射试验。上次来到这里的时候，研究小组发射的火箭比他的大腿还小，飞行高度也至多一千英尺。如今，新式火箭在沙漠上空飞行数英里，并最终用上面装载的哑铃实现着陆。戈达德拒绝在陆地上引爆火箭，以免外界据此推测这项武器的确切杀伤规模。"
 USA.2041.a:0 "戈达德干得好"
 USA.2042.t:0 "奥本海默炸弹成功试爆"
 USA.2042.d:0 "奥本海默向全欧洲的核研究人员、物理学家和工程师发出邀请，希望逃离欧洲越发可怕的红色威胁的科学家们尤其对他的承诺感兴趣，其中不少人甚至为该项目移民到美国。历经一年半的多次试验，并与欧洲同行展开不少交流合作后，一枚可运用的原子弹终于做好测试准备。新墨西哥州阿拉莫戈多的天空在灭世般的闪光中被熊熊点燃，奥本海默事后回忆道，这颗原子弹是以他最喜欢的一首约翰·多恩的诗歌命名的。"
 USA.2042.a:0 "屏住呼吸……"

ACW.1.t.Haywood:0 "海伍德总统逃往芝加哥"
 ACW.1.t.Normal:0 "比尔·海伍德呼吁人民行动起来"
 ACW.1.d.Norris:0 "自从诺里斯政府上任以来，他们没能像承诺的那样去拉拢钢带和社会党的政治势力，因此，美国已经支离破碎。比尔·海伍德今天宣布，美国工人必须站在反对政府的立场上，一些北方州长几乎在第一时间就宣布支持他。他们声称，诺里斯总统和他的政府已经失去了所有的合法性，他们呼吁工人们夺取生产资料。海伍德将对那些承认新的、以钢带为后盾的社会主义政府的人给予政治特赦。"
 ACW.1.d.Curtis.revolt_against_compromise:0 "妥协的努力宣告失败，美国也随之分裂。比尔·海伍德日前已通过电台演说呼吁工人们行动起来发起革命。许多北方州长以及几乎所有的赤卫队民兵都对他的号召表达了支持，他们声明当今的柯蒂斯政府已经失去了人民的信任，如果他们现在向比尔·海伍德领导下的革命委员会投降，尚可监督联邦政府重组为工人政权，迎接新时代的自由与公正。"
 ACW.1.d.Curtis.nothing_is_done:0 "底特律的暴力冲突为比尔·海伍德提供了谋求已久的借口，在电台广播中，比尔·海伍德谴责柯蒂斯总统是个无耻的骗子，垄断寡头的傀儡，当工人惨遭压迫，他却在旁观看，无动于衷——“工人们是时候该表明自己的立场了，我们绝不做吸血虫们的奴隶！”——许多北方州长立即宣布拥护海伍德的倡议，工团民兵们也响应了他的号召，他们在州内修建起大批街垒，接管联邦军队的兵营。"
 ACW.1.d.Landon.revolt_against_compromise:0 "妥协的努力宣告失败，美国也随之分裂。比尔·海伍德日前已通过电台演说呼吁工人们行动起来发起革命。许多北方州长以及几乎所有的赤卫队民兵都对他的号召表达了支持，他们声明当今的兰登政府已经失去了人民的信任，如果他们现在向比尔·海伍德领导下的革命委员会投降，尚可监督联邦政府重组为工人政权，迎接新时代的自由与公正。"
 ACW.1.d.Landon.nothing_is_done:0 "底特律的暴力冲突为比尔·海伍德提供了谋求已久的借口，在电台广播中，比尔·海伍德谴责兰登总统是个无耻的骗子，垄断寡头的傀儡，当工人惨遭压迫，他却在旁观看，无动于衷——“工人们是时候该表明自己的立场了，我们绝不做吸血虫们的奴隶！”——许多北方州长立即宣布拥护海伍德的倡议，工团民兵们也响应了他的号召，他们在州内修建起大批街垒，接管联邦军队的兵营。"
 ACW.1.d.Garnar:0 "对美利坚社会党的镇压自然只有一种结局：比尔·海伍德呼吁美国工人行动起来反抗企图继续剥削压迫他们的资产阶级魔鬼。他宣称“一切正派的美国人都负有道德义务联合起来对约翰·兰斯·加纳总统、麦克阿瑟及其代表的政界腐败、反民主、反工人势力采取行动”。许多北方州长立即宣布拥护比尔·海伍德的倡议，工团民兵们也响应了他的号召，他们在州内修建起大批街垒，接管联邦军队的兵营。"
 ACW.1.d.Heywood:0 "在设法逃到芝加哥后，海伍德总统已向追随者宣布麦克阿瑟是“全体美利坚人民的叛徒”。他的呼吁在钢带得到了广泛的支持，部分州长也已宣布他们将不再承认现任联邦政府的合法性。他们已拒绝联邦军队入境，这不禁让人想起，就在不到一个世纪前，这个国家曾经历过的那场血腥的内战。"
 ACW.1.d.Long:0 "在芝加哥一次激动人心的电台演说中，比尔·海伍德呼吁他的追随者们行动起来起来抵制暴君麦克阿瑟，以及一切打算夺走工人自由的反动势力。演说发表后约一小时内，钢带的部分州长便已表明立场向海伍德宣誓效忠，他们联名谴责休伊·朗与麦克阿瑟将军不具有真正领导人民的权力。宣布起义的各州得到了海伍德支持者们热烈的支援，仅仅几天之内，他们已经接管了联邦军队在当地的哨所，在北部各州的交通要道上竖起无数路障街垒。"
 ACW.1.d.Macarthur:0 "在美利坚社会党和民兵领导联合之后不久，比尔·海伍德在芝加哥发表了一篇鼓舞人心的广播讲话，号召他的追随者起来反抗麦克阿瑟、威廉·H·默里和全国所有其他反动派。在一个小时内，钢带的一些州长宣布他们支持比尔，并宣布麦克阿瑟将军担任总统这一流程违宪。州长们得到了海伍德支持者的支持，他们在几天内就攻占了当地的军队驻地，并在北部各州的路口设置了路障。而麦克阿瑟则立刻发布声明谴责海伍德为叛国，并要求所有叛乱分子在24小时之内放下武器接受联邦军队的逮捕。"
 ACW.1.d.Murray:0 "在芝加哥一次激动人心的电台演说中，比尔·海伍德呼吁他的追随者们行动起来起来抵制暴君麦克阿瑟，以及一切打算夺走工人自由的反动势力。演说发表后约一小时内，钢带的部分州长便已表明立场向海伍德宣誓效忠，他们联名谴责默里总统与麦克阿瑟将军不具有真正领导人民的权力。宣布起义的各州得到了海伍德支持者们热烈的支援，仅仅几天之内，他们已经接管了联邦军队在当地的哨所，在北部各州的交通要道上竖起无数路障街垒。"
 ACW.1.d.deadlock:0 "大选陷入僵局后，旧民主党率先发难，宣布威廉·H·默里为正统总统，而麦克阿瑟拒绝承认这一声明，就在双方此针锋相对、摩拳擦掌之时，红带突然响起了起义的号角，震惊全国。在阴魂不散的1924年英国总罢工的影响下，美利坚联合工团、美利坚社会党主席威廉·海伍德呼吁美国工人们挺身而出，捍卫自己的权利，打倒默里和麦克阿瑟的暴戾之治。钢带的部分州长祭出“第二次美国革命”的大旗，宣布支持海伍德和他的联合工团、社会党。这些州长受到了海伍德支持者的拥护，而后者在几天内就攻占了当地的军队驻地，并在北部各州的路口设置了路障。"
 ACW.1.a:0 "大乱已至，支持联邦政府！"
 ACW.1.b:0 "发起革命！与工人阶级并肩奋战！（扮演美利坚联合工团继续游戏）"
 ACW.2.t:0 "休伊·朗谴责政府"
 ACW.2.d.Norris:0 "美利坚联合工团、美利坚宪政国的建立与麦克阿瑟政变的发生，都令休伊·朗深感不安，这三方对其“分享财富”主张的敌意众所周知，尤其与乔治·诺里斯形成鲜明对比。朗宣布自己“别无选择”，决定组建临时政府以保护平民免受三方威胁，前提是麦克阿瑟必须下野、重新任命诺里斯为总统，并由朗本人入阁“确保民主内阁运行”。尽管无人认为此事会成真，其中西部民粹进步联盟仍选择追随，朗虽承诺保障诺里斯安全，但蹊跷的是该联盟反对由诺里斯领导所谓“美利坚联盟国”。他们宣称除非受到武力直接威慑，否则精英阶层绝不会改变其在政治经济上的做法，联盟国现已募集大量民兵队伍，并获多位州长调拨本州国民警卫队支援此事业。"
 ACW.2.d.nothing_is_done:0 "美利坚联合工团、美利坚宪政国的建立与麦克阿瑟政变的发生，既令休伊·朗深感不安，也让他深受启发。他因此组建了一个实质上代表其政治机器与盟友的临时政府。他宣称自己“别无选择”，唯有成立临时政府来保护平民免受这三方威胁，并要求重新任命共和党总统、解除麦克阿瑟职务，同时让自己入阁以“确保民主内阁运作”。尽管无人认为此事会成真，其中西部民粹进步联盟仍选择追随，并宣称除非受到武力直接威慑，否则精英阶层绝不会改变其在政治经济上的做法。"
 ACW.2.d.Curtis.revolt_against_compromise:0 "妥协的努力宣告失败，美国也随之分裂。休伊·朗日前已通过电台演说宣布，为了美利坚人民的福祉，腐败政客必须被彻底铲除，为此他呼吁全体美国人民联合起来支持他的事业。许多南方州长都对他的演说表达了支持，他们声明柯蒂斯政府已经失去了执政合法性，尽管还没有正式宣布脱离联邦，南方各州已拒绝执行联邦政府通过的一切法案。"
 ACW.2.d.Landon.revolt_against_compromise:0 "妥协的努力宣告失败，美国也随之分裂。休伊·朗日前已通过电台演说宣布，为了美利坚人民的福祉，腐败政客必须被彻底铲除，为此他呼吁全体美国人民联合起来支持他的事业。许多南方州长都对他的演说表达了支持，他们声明兰登政府已经失去了执政合法性，尽管还没有正式宣布脱离联邦，南方各州已拒绝执行联邦政府通过的一切法案。"
 ACW.2.d.Garnar:0 "在一次广播演讲中，休伊·朗斥责加纳总统是个必须被铲除的暴君，他严厉谴责了加纳与资本家们相互勾结的行为，指责他不仅未能采取任何行之有效的措施来控制社会秩序的恶化，甚至对人民肆意镇压。现在休伊·朗向公众发誓他将亲自重塑美利坚的安定，击溃华盛顿腐败的政府。南方和中西部的许多州长与一分钟人民兵都对他的演说表达了支持，他们联名要求加纳总统立即下台，将主导权移交给以休伊·朗与“全国和解委员会”，而后者将全权负责对美国政府的彻底重组。"
 ACW.2.d.Heywood:0 "在新奥尔良举行的一场激情演讲中，休伊·朗谈到了抗击叛徒麦克阿瑟与其他“反美”伪装者，例如威廉·H·默里和社会主义革命分子的必要性。他们都是理应被推翻的暴君，只有休伊·朗领导下的美利坚至上党才能真正实现美国社会的洗牌。许多南方和中西部州的州长早已在国会内形成了以朗为中心的民粹进步联盟并一直等待着机会扩大农场主们的权力，而现在他们已经全部集结在了朗的周围，他们都既不愿意承认海伍德总统的权威，也抵制麦克阿瑟的权威。"
 ACW.2.d.Long:0 "在成功逃往新奥尔良之后，总统休伊·朗正式宣布麦克阿瑟是美利坚人民的叛徒，许多南方州长成为了他忠实的听众，他们都认为这是当权者永远不会允许他们通过改革的最终证明，他们拒绝接受麦克阿瑟的地位，抵制他的合法性，并呼吁他尽快辞职谢罪。日前，休伊·朗已通过广播电台敦促美利坚人民联合起来支持他们的合法领袖，推翻暴君的化身麦克阿瑟。"
 ACW.2.d.Macarthur:0 "在会见了奥斯卡·K·艾伦、罗伯特·拉福莱特和他在军队内的头号同情者特里·德拉梅萨·艾伦等盟友之后，休伊·朗宣布成立一个新的“保护普通人”的临时政府，声称他的美利坚联盟国是国家抵抗那些独夫民贼的牢固壁垒。他同时谴责麦克阿瑟“滥用”自己的权力，一味地讨好当权派，而不是站在朗一边反对工会势力和白人联盟，他承诺恢复美国民主，并要求众议院任命一位长袖善舞的新总统，甚至让他自己当也行，当然这是不可能的。看来朗的联盟已经集结了各大民兵组织，正为可能到来的冲突做准备。"
 ACW.2.d.Murray:0 "在会见了奥斯卡·K·艾伦、罗伯特·拉福莱特和他在军队内的头号同情者特里·德拉梅萨·艾伦等盟友之后，休伊·朗宣布成立一个新的“保护普通人”的临时政府，声称他的美利坚联盟国是国家抵抗那些独夫民贼的牢固壁垒。他同时谴责默里“滥用”他的权力，并声称他除了为白人联盟的“恐怖机器”为虎作伥之外对任何事情都没有兴趣，他承诺会恢复美国民主，并要求众议院任命一位长袖善舞的新总统，甚至让他自己当也行，当然这是不可能的。看来朗的联盟已经集结了各大民兵组织，正为可能到来的冲突做准备。"
 ACW.2.d.deadlock:0 "默里的南方各州和海伍德的钢带全都自封为美利坚正统政府，直接与华府的麦克阿瑟分庭抗礼，而如今，休伊·朗也加入了战局。本来还寄希望于国会中的其他人能选自己为总统的朗在看清了这一痴心妄想后，向一分钟人和整个美国发出号召，呼吁所有人起来为真正的美利坚精神而战。朗带着他一贯的民粹腔调，怒斥麦克阿瑟想在现代当恺撒，痛批默里篡位夺权、暴虐无道，要求两家交出权力，重新召集国会，选出总统。有意思的是，对于海伍德和社会党，朗由于不想惹到至上党内的左翼而只是一句话带过，称其为误入歧途的蠢货。与默里、麦克阿瑟，甚至海伍德不同，朗并没有僭越自称总统，而是采用了“代总统”这一头衔，以此表明自己绝无二心，唯一目的就是恢复国会、重开大选，不过他的手下还是称呼他为朗总统。许多南方和中西部州的州长早已在国会内形成了以朗为中心的民粹进步联盟并一直等待着机会扩大农场主们的权力，而现在他们已经全部集结在了朗的周围。"
 ACW.2.a:0 "支持联邦政府！"
 ACW.2.b:0 "为国民而战！（扮演美利坚联盟国继续游戏）"
 ACW.3.t.Haywood:0 "旧民主党叛乱"
 ACW.3.t.Normal:0 "默里发动叛乱反抗华盛顿！"
 ACW.3.d.Norris:0 "我们无法再压制全国民主党白人联盟和旧民主党的据点了，在这些据点里，有组织的旧民主党部队在州属国民警卫队的支持下，以压倒性的力量迅速清除了残余的联邦特工。我们最近的“冒犯”导致威廉·H·默里通过无线电宣布诺里斯总统投靠了国际银行家、反新教徒势力和赤匪等那些当美国被外来种族污染时不会站在美国一边的人，必须打倒朗和海伍德才能保卫美国人的生活方式。事实上，东南部的一些州长和所有与白人联盟有关的民兵和政客都支持他，这些人宣布他们认为诺里斯政府是非法的，因此拒绝承认其权威。"
 ACW.3.d.Curtis.revolt_against_compromise:0 "妥协失败了，美国也因此支离破碎。默里今天在广播中宣布柯蒂斯打算把国家一点一点地卖给社会主义者和机会主义者，即站在叛徒、天主教徒和犹太人一边，而不是站在美国人一边。他呼吁所有正派的美国人起来反抗他们，“除非他们希望看到自己的未来被无耻的银行家控制，他们的孙女被其他种族买下”。许多南方州长都支持他，声称他们不认为柯蒂斯政府是合法的，虽然他们还没有正式宣布脱离联邦，但他们已经明确表示不承认政府在他们境内的权威。"
 ACW.3.d.Curtis.nothing_is_done:0 "钢带地区的暴力事件和海伍德的宣言迫使威廉·H·默里在广播中宣布，总统是国际银行家控制下的国贼，永远不会站在美国一边，也永不会为美国而战，因此，默里将与总统、朗和海伍德斗争不息以保护美国生活方式。一些南方州长和几乎所有的白人联盟成员都支持他，声称他们不认为柯蒂斯政府是合法的，因此也不会接受其统治。"
 ACW.3.d.Landon.revolt_against_compromise:0 "妥协失败了，美国也因此支离破碎。默里今天在广播中宣布兰登打算把国家一点一点地卖给社会主义者和机会主义者，即站在叛徒、天主教徒和犹太人一边，而不是站在美国人一边。他呼吁所有正派的美国人起来反抗他们，“除非他们希望看到自己的未来被无耻的银行家控制，他们的孙女被其他种族买下”。许多南方州长都支持他，声称他们不认为兰登政府是合法的，虽然他们还没有正式宣布脱离联邦，但他们已经明确表示不承认政府在他们境内的权威。"
 ACW.3.d.Landon.nothing_is_done:0 "钢带地区的暴力事件和海伍德的宣言迫使威廉·H·默里在广播中宣布，总统是国际银行家控制下的国贼，永远不会站在美国一边，也永不会为美国而战，因此，默里将与总统、朗和海伍德斗争不息以保护美国生活方式。一些南方州长和几乎所有的白人联盟成员都支持他，声称他们不认为兰登政府是合法的，因此也不会接受其统治。"
 ACW.3.d.Garnar:0 "在山姆·格林领导下的佐治亚州白人联盟已经抵挡住了联邦军队之后，对旧民主党的攻击也被迫停止。在联邦政府从该地区撤退之时，威廉·H·默里在广播中宣布约翰·兰斯·加纳总统是一个妄图将南方交给社会激进分子的暴君和种族叛徒。一些南方州长和几乎所有的白人联盟都支持他，宣布他们不认为当前的联邦政府是合法的，因此拒绝承认它的权威，命令政府下台。"
 ACW.3.d.Heywood:0 "威廉·H·默里发表演讲，声明自己不会容忍左派暴政、种族堕落和联邦腐败，更不会接受由此导致的联合工团壮大和反三K党的麦克阿瑟上台。他代表旧民主党和所有“真正纯血的美国人”宣布，以自由、道德和白人新教的名义发起叛乱。整个东南地区，与旧民主党和白人联盟结盟的州长和民兵组织纷纷签署宣言，支持成立“美利坚宪政国”，称不会容忍对美利坚遗产的践踏，要打击不道德的社会主义者。白人联盟正在争取边境州的控制权，以免这些地区落入联邦政府、一分钟人和社会主义者之手。"
 ACW.3.d.Long:0 "威廉·H·默里发表演讲，声明自己不会容忍左派暴政、种族堕落和联邦腐败，更不会接受由此导致的“休伊·朗这种背信弃义的种族叛徒”，联合工团政权和反旧民主党的麦克阿瑟。他代表旧民主党和所有“真正纯血的美国人”宣布，以自由、道德和白人新教的名义发起叛乱，将这场自威尔逊时代开始的漫长斗争结束，彻底终结美国的红色威胁。整个东南地区，与旧民主党和白人联盟结盟的州长和民兵组织纷纷签署宣言，支持成立“美利坚宪政国”，称不会容忍对美利坚遗产的践踏，要打击不道德的社会主义者。白人联盟正在争取边境州的控制权，以免这些地区落入联邦政府、联盟国和社会主义者之手。"
 ACW.3.d.Macarthur:0 "威廉·H·默里发表演讲，声明自己绝不支持反旧民主党的麦克阿瑟破坏传统美利坚共和的外貌，而不去集中力量对付社会党。他代表旧民主党和所有“真正纯血的美国人”宣布，以自由、道德和白人新教的名义发起叛乱，将这场自威尔逊时代开始的漫长斗争结束，彻底终结美国的红色威胁，以及国际银行家势力与休伊·朗这样的种族叛徒。整个东南地区，与旧民主党和白人联盟结盟的州长和民兵组织纷纷签署宣言，支持成立“美利坚宪政国”，称不会容忍对美利坚遗产的践踏，要打击不道德的社会主义者。白人联盟正在争取边境州的控制权，以免这些地区落入联邦政府、联盟国和社会主义者之手。"
 ACW.3.d.Murray:0 "在麦克阿瑟政变发生前几分钟，默里总统接到警告，并流亡亚特兰大。在他的演讲中，他指责金融界、犹太人和左翼阴谋势力对他不利，声称麦克阿瑟是那些妄图让美国遭受文化与种族入侵的势力的工具，而工团主义和分享财富计划也是如此。他接着说，每一个希望孩子们有光明未来的美国人都有责任站出来反对联邦政府和他们的银行寡头精英，在演讲结束时，他大喊“暴君必亡！”。由于他可算是美国的合法总统，他或许能得到以往没有的更多追随者。"
 ACW.3.d.Hoover:0 "威廉·H·默里发表演讲，声明自己绝不容忍操弄选举，不肯让出精英权力，践踏美利坚精神的现任政府。他代表旧民主党和所有“真正纯血的美国人”宣布，以自由、道德和白人新教的名义发起叛乱，将这场自威尔逊时代开始的漫长斗争结束，彻底终结美国的红色威胁，以及国际银行家势力与休伊·朗这样的种族叛徒。整个东南地区，与旧民主党和白人联盟结盟的州长和民兵组织纷纷签署宣言，支持成立“美利坚宪政国”，称不会容忍对美利坚遗产的践踏，要打击不道德的社会主义者。白人联盟正在争取边境州的控制权，以免这些地区落入联邦政府、联盟国和社会主义者之手。"
 ACW.3.d.deadlock:0 "议会陷入了僵局，麦克阿瑟将军以“拯救联邦”的名义获得了国家大权，而激进派们断然不会让这一掌权的大好时机悄悄溜走，而在今日的凌晨时分，他们终于坐不住了。为了回应全国上下的白人联盟和旧民主党成员的期待，威廉·H·默里“正式宣誓就任美利坚合众国总统”。麦克阿瑟政变后，逃出华盛顿特区的旧民主党代表们将默里选为了领袖，而默里当选后立即以“联邦陷入了前所未有的境况”为由宣誓就职。默里成为总统后的第一道命令就是让麦克阿瑟一系交出权力，承认他的权威。默里很清楚，麦克阿瑟绝不会乖乖投降，所以他呼吁全体“纯血美国同胞”为了自由、道德和白人新教团结在他身边。整个东南地区，与旧民主党和白人联盟结盟的州长和民兵组织纷纷签署宣言，支持成立“美利坚宪政国”，称不会容忍对美利坚遗产的践踏。白人联盟正在争取边境州的控制权，以免这些地区落入联邦政府、一分钟人和社会主义者之手。"
 ACW.3.a:0 "支持联邦政府！"
 ACW.3.b:0 "为民族而战！（扮演美利坚宪政国继续游戏）"
 ACW.4.t.Normal:0 "麦克阿瑟率军罢免[USA.GETLeader]"
 ACW.4.t.Garnar:0 "麦克阿瑟进军华盛顿"
 ACW.4.d.Normal:0 "似乎[USA.GetLeader]已经没时间了，随着各种极端派系持续地获取权力让妥协看上去注定失败，[USA.GETLeader]的内阁已经失去了信心，认为任何协议的达成都会引发冲突的爆发。在内阁的出卖和军事集团的支持下，道格拉斯·麦克阿瑟将军成为了国家应急管理机构的首脑，宣称要“保护国家不受极端主义势力的影响”。自然此举只会让各极端派系认为美国政府出尔反尔，不可信任，但麦克阿瑟的战士也已做好了战斗的准备。当政府试图向美国公众保证一切都在控制之中时，大多数民众都在震惊地关注事态的发展。内战似乎迫在眉睫。剩下的问题是总统自己应该怎么做？"
 ACW.4.d.Garnar:0 "约翰·南斯·加纳的政治生命已走到尽头。今天，麦克阿瑟率军挺进白宫，将“软弱无能、威胁国家安全”的加纳总统削职为民。麦克阿瑟此举让不少人想起这位将军在1932年镇压科克西失业请愿军时所下的毒手，不过这次，他们是为保护国家不受极端主义侵害而团结起来的。加纳总统的内阁向公众宣布此举是维护国家稳定的必要手段，他们愿意支持麦克阿瑟筹建全国紧急政府——对此，大多数美国公民仍然处在惊惶之中，一场内战正迫在眉睫。加纳本人被迫在逃离国家或接受名义上的新总统职位之间做出选择。"
 ACW.4.d.Hoover:0 "虽然[USA.GETLeader]和共和党人向麦克阿瑟承诺，他们可以解决危机，结束骚乱，结束政治分歧，一劳永逸地终结激进分子，但这些承诺似乎都只是空话。他们失败了，因此，麦克阿瑟召集他的亲信们在华盛顿进行了一场闪电般的政变，把[USA.GETLeader]和共和党人赶出了白宫。在文官和军事集团的支持下，道格拉斯·麦克阿瑟将军成为了国家应急管理机构的首脑，宣称要“保护国家不受极端主义势力的影响”。自然此举只会让各极端派系认为美国政府出尔反尔，不可信任，但麦克阿瑟的战士也已做好了战斗的准备。当政府试图向美国公众保证一切都在控制之中时，大多数民众都在震惊地关注事态的发展。内战似乎迫在眉睫。剩下的问题是总统自己应该怎么做？"
 ACW.4.a:0 "我们不会忘记这场背叛"
 ACW.4.b:0 "反抗只会让事情变得更糟"
 ACW.4.c:0 "带我去加利福尼亚！"
 ACW.5.t:0 "太平洋各州州长宣布进入紧急状态"
 ACW.5.d.Normal:0 "太平洋诸州的州长们已经宣布，麦克阿瑟和其他反民主的煽动者一样，都是美利坚之敌。太平洋诸州目前虽还没有从名义上脱离联邦，但他们正招兵买马，意图对抗东方的麦克阿瑟军政府。加利福尼亚州州长弗兰克·梅里亚姆在萨克拉门托立法机构中宣布，若事态严重，他们将动用武力在国内恢复“适当的民主”。"
 ACW.5.d.deadlock:0 "离上次内战还没过去百年，美国已经在第二次内战的边缘跃跃欲试了，尽管觊觎者们口口声声是为了民主，但美国的民主大抵是真要亡了。不过，情况在今天凌晨发生了变化，俄勒冈州、华盛顿州、加利福尼亚州和内华达州的州长联合宣布要恢复美国的民主。他们大骂麦克阿瑟和他在华府的支持者都是一群没有骨气的懦夫，不敢通过民主手段堂堂正正地一决胜负。此外，他们还请来了国会的第74届成员，建立了临时的“太平洋国会”来选出真正的总统。他们自称“太平洋国”，斥默里为篡位者，批海伍德为法国傀儡，朗虽是时势所逼，但也终究是个国贼。太平洋诸州目前虽还没有从名义上脱离联邦，但他们正招兵买马，意图对抗东方的麦克阿瑟军政府。加利福尼亚州州长弗兰克·梅里亚姆在萨克拉门托立法机构中宣布，若事态严重，他们将动用武力在国内恢复“适当的民主”。"
 ACW.5.a:0 "支持联邦政府！"
 ACW.5.b:0 "为了共和国！（扮演美利坚太平洋国继续游戏）"
 ACW.6.t:0 "西部军指挥中心成立"
 ACW.6.d:0 "奥马尔·布拉德利和德怀特·艾森豪威尔将军正指挥着西部的联邦部队，他们报告称，因为联盟国、联合工团和宪政国的威胁，现在从华盛顿获取补给实在太过危险。更糟糕的是太平洋国的成立，使得西部的防御更加严峻，因此，布拉德利和艾森豪威尔宣布成立西部军指挥中心，以此应对叛徒的进攻并维持秩序。但据传，除了保卫联邦政府外，二人成立西部军指挥中心也有从麦克阿瑟那里获得一定独立性的意思。但至少我们希望，新行动基地的成立能让太平洋国三思而后行，仔细考虑自己的一举一动。"
 ACW.6.a:0 "支持联邦政府！"
 ACW.6.b:0 "支持军队！（扮演西部军指挥中心继续游戏）"
 ACW.8.t:0 "秩序崩塌之时"
 ACW.8.d:0 "不是所有的美国人都对内战无动于衷，也不是所有的美国人都为了让某个意识形态派别在内战中得胜而奋战，一些机会主义者已冒出头来，并从国家重建的软弱中获得了强大的力量。犯罪分子投机倒把、窃名逐利，利用混乱为所欲为，犯下了偷窃、敲诈勒索还有一系列更糟的罪行。他们只会拖累我们，我们也得处理他们。与白人联盟和旧民主党结盟的三K党徒抗拒着我们的统治，并企图以攻击补给线，袭击工厂和散布反政府言论来干扰我们的政府运转。我们得马上处理这件事。世界产业工人联盟的军事组织，赤卫队和其他无政府主义武装分子在最近加强了他们的活动。总体而言，除了罢工之外，他们还开始了数次工业破坏运动、有针对性的政治暗杀、扰乱补给供给以及旨在吸引城市工人的激进宣传。这些行动正在损害我们的经济，尤其是我们生产工业原材料的能力。"
 ACW.8.a:0 "为了胜利，投入额外人手处理这些反政府分子"
 ACW.9.t:0 "混乱结束的开始"
 ACW.9.d:0 "枪声的停歇并不意味着秩序已经真正归来。即便大规模叛乱与公开战事已经结束，各地仍散布着拒绝接受新局面的武装残余。废弃仓库中藏着武器，偏远乡镇里仍有人秘密集会，铁路沿线和工业区也时常出现破坏活动。更令人担忧的是，这些残余势力彼此虽然政治立场不同，却都试图利用战后社会的疲惫与混乱重新组织力量。\n\n政府因此决定展开一场覆盖全国的治安整肃行动。联邦调查人员、地方警察、国民警卫队与军方情报部门将共享名单和情报，重点搜捕仍在活动的非法武装，并切断地下组织的资金与补给来源。当然，那些愿意尽快放下武器、接受登记并重新回归正常生活的人将得到一定宽待，而继续袭击政府机关、铁路、工厂与平民者则会被视为纯粹的叛乱分子。如今看来，这并不会是一场短暂的清扫。许多组织已经深入社区、乡村和人迹罕至的荒原或山区，而一些人甚至仍受到地方势力庇护。但我们英勇的军人与国民警卫队还是义无反顾地投入到了这场恢复国家秩序的运动中来。\n\n尽管距离真正结束混乱还似乎遥遥无期，但至少我们如今所做的一切是结束混乱的开始。"
 ACW.9.a:0 "我们将彻底扫除各地的叛匪！"
 ACW.10.t:0 "赤卫队抵抗被粉碎"
 ACW.10.d:0 "经过长时间追捕与清剿，各地残存的赤卫队网络终于遭到决定性打击。那些曾经依靠工厂社区、工会据点和地下印刷所维持活动的组织，如今已经失去大部分领导层和武器来源。多处秘密仓库被查封，电台与联络站遭到摧毁，最后几支仍试图进行武装抵抗的小队也在围捕中被迫投降。曾经鼓动工人武装、组织街垒和破坏铁路的激进分子如今不是身陷囹圄，就是已经逃往国外。部分普通成员则在登记后获准返回工作岗位，只要他们承诺不再参与地下政治活动。曾经席卷全国的赤卫队抵抗如今已经被真正平息。"
 ACW.10.a:0 "工团匪徒吃屎去吧！"
 ACW.11.t:0 "一分钟人抵抗被粉碎"
 ACW.11.d:0 "一分钟人的残余势力曾一度被认为比其他地下组织更加难以根除。他们熟悉乡间道路，能够依靠地方支持者迅速转移，也常以退伍军人协会、农民互助组织和地方民兵的名义掩护自身活动。许多小镇甚至把他们视为“保卫社区”的力量，而不是叛乱分子。但随着政府逐步恢复对县警、邮政、铁路和银行系统的控制，这些网络失去了赖以生存的空间。资金与武器开始紧缺，负责联络各地分部的核心人物也在连续搜捕中落网。最后几支仍然宣誓效忠“王鱼”政治遗产的武装小组，最终在缺乏补给与支援的情况下解散或投降。一分钟人作为一支有组织的地下武装力量的时代已经结束，取而代之的如今是效忠于我们的国民警卫队。"
 ACW.11.a:0 "再见了王鱼"
 ACW.12.t:0 "3k党抵抗销声匿迹"
 ACW.12.d:0 "白袍、火炬与夜间集会曾让许多社区长期生活在恐惧之中。3K党利用地方警界关系、私人武装和秘密会员制度，在部分地区维持着远超普通政治组织的影响力。经济危机与社会混乱更给了他们扩张空间，让种族仇恨、私刑传统和极端民族主义重新披上“维护秩序”的外衣。如今，这套网络终于开始瓦解。联邦调查人员查获了大量会员名单与资金记录，数名地方头目因非法持械、绑架、纵火与有组织暴力遭到起诉。随着地方官员失去保护伞，许多普通成员迅速撇清关系，昔日声势浩大的夜间集会也变得越来越稀少。很快，这些非法组织就将在美国的历史上成为一个微不足道的可笑注脚。"
 ACW.12.a:0 "白袍疯子滚吧！"
 ACW.13.t:0 "黑色军团销声匿迹"
 ACW.13.d:0 "黑色军团曾依靠极端保密、准军事纪律和暴力恐吓在中西部部分地区迅速扩张。他们的成员渗透进地方警察、工厂保安和社区组织，以反激进、反移民和“保卫美国传统”为名，对政治对手和少数群体发动袭击。即便在公开冲突结束后，这些小组仍试图依靠秘密宣誓和地方关系继续活动。然而，随着多起绑架、谋杀与非法武装案件被集中调查，黑色军团的地下结构终于开始崩溃。那些曾经相信组织能够永远隐藏在社区阴影中的成员，很快发现彼此之间的忠诚远没有想象中牢固，大量人员开始主动提供情报以换取从轻处理。到如今，联邦安全部门已经判断黑色军团不再具备形成全国性威胁的能力。残余成员或许仍散落各地，但那个依靠恐惧、秘密和暴力维系的组织已经基本崩溃。"
 ACW.13.a:0 "干得漂亮"
 usanew.1.t:0 "美利坚陷入紧张对峙"
 usanew.1.d:0 "紧张局势降临美国，民选总统威廉·H·默里在被道格拉斯·麦克阿瑟将军强行撤职后逃往亚特兰大。在那里，默里的支持者已经宣布麦克阿瑟政府非法，而在芝加哥，海伍德的支持者同样拒绝承认麦克阿瑟政权的合法性，坐拥中西部和南部各州的休伊·朗及其农村民粹主义支持者亦是如此，太平洋各州也在弗兰克·梅里亚姆领导下质疑联邦政府权威。对此麦克阿瑟将军给了他们30天的最后期限，要么停止叛乱行为，要么等待联邦政府的逮捕和处决。然而考虑到对峙各方都在紧张而迅速地提升自己的军备实力，几乎没有什么可以避免美国步入第二场血腥内战了。"
 usanew.1.a:0 "我明白了"
 usanew.2.t:0 "美利坚陷入紧张对峙"
 usanew.2.d:0 "紧张局势降临美国，麦克阿瑟在被胡佛任命为临时总统后并未能成功平定美国局势。在亚特兰大，默里的支持者已经宣布麦克阿瑟政府非法，而在芝加哥，海伍德的支持者同样拒绝承认麦克阿瑟政权的合法性，坐拥中西部和南部各州的休伊·朗及其农村民粹主义支持者亦是如此，太平洋各州也在弗兰克·梅里亚姆领导下质疑联邦政府权威。对此麦克阿瑟将军给了他们30天的最后期限，要么停止叛乱行为，要么等待联邦政府的逮捕和处决。然而考虑到对峙各方都在紧张而迅速地提升自己的军备实力，几乎没有什么可以避免美国步入第二场血腥内战了。"
 usanew.2.a:0 "我明白了"
 usanew.3.t:0 "麦克阿瑟将军，继续进军"
 usanew.3.d:0 "随着敌人被彻底消灭，一个反动的军政府如今取代了旧的合众国。道格拉斯·麦克阿瑟将军正在全国范围内剿灭工团联合会和联盟国的地下武装，整个国家也开始了缓慢的重建过程。如今的美国宛若一个巨大的军营，在首长麦克阿瑟的指挥下有条不紊地前进。全美的工业被改造为了这支巨大军队的军火库，满足年龄的男性需要参加强制的服役，曾经的国会中端坐着的则是军队的忠犬。这台巨大的战争机器缓缓前进着，站在车头的则是麦克阿瑟将军，全美将在他的指挥下迈向何方，未来史书上他将会是英雄还是暴徒，只有时间才能告诉我们答案了。"
 usanew.3.a:0 "大步向前"
 usanew.3.b:0 "这是否象征美国民主制度的彻底粉碎？"

