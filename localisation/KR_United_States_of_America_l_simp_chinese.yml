 USA_navy_party:0 "美国海军"
 USA_navy_party_long:0 "美国海军(The United States Navy)\n§g威廉·D·莱希已经从暴君道格拉斯·麦克阿瑟手中夺取了政府控制权，现在他打算结束这场战争。在战后，莱希没有继续掌权的计划。相反，他希望恢复一些美国人曾经享受过的旧式民主的表象，尽管目前还不清楚这种恢复会变是什么样子。然而，众所周知的是，美国海军在未来数年里将被誉为美国民主的救世主，它在战后政府中的作用肯定是一个重要的角色。§!"
 USA_navy_king_party:0 "海军政府"
 USA_navy_king_party_long:0 "海军政府(Navy Junta)\n§g欧内斯特·J·金从道格拉斯·麦克阿瑟手中夺取了权力，试图从他的专制统治下拯救海军和国家。现在，欧内斯特·J·金处于军政府的最顶层，尽管有很多关于推翻暴君的言论，但金计划像麦克阿瑟那样严厉地领导国家。毕竟，我们要赢得一场战争，一旦战争结束，我们就必须开始重建这个国家。所有的水手都可以放心了，海军再也不会受到虐待了。§!"
 USA_independent_league:0 "独立联盟"
 USA_independent_league_long:0 "独立联盟(The American Independence League)\n§g独立联盟主要是由支持美国的贝拉米主义思想的知识分子组成的，贝拉米主义思想来源于美国作家爱德华·贝拉米的作品和更早期的美国国家主义运动。这些乌托邦社会主义者支持社会主义、国家计划经济和行会民主，美利坚独立联盟与国家主义俱乐部的成员大多为这些人。如今，这一代表社会党中中产阶级力量的党派已经放弃与社会党合作，转而作为独立政党参政。目前，这些乌托邦社会主义者仍然在积极参加工人运动，并组织各种各样的社会活动以为劳工争取权利。§!"
 USA_syndicalist_progressive_party:0 "进步党 - 工会派"
 USA_syndicalist_progressive_party_long:0 "进步党 - 工会派(Republican Party (Trade Unionists))"
 USA_radical_socialist_progressive_party:0 "进步党 - 进步主义者"
 USA_radical_socialist_progressive_party_long:0 "进步党 - 进步主义者(Progressive Party (Progressives))\n§g美国的进步主义者有着悠久而自豪的历史。但尽管他们竭尽所能，在国家舞台上却始终没有得到什么表现机会。西奥多·罗斯福就被认为是进步派名人，但他自建公麋党，作为候选人竞选总统的努力最终以失败告终。近几十年来，其他进步派人士也曾尝试赢得总统竞选，但都未曾取得成功，其中最著名的是威斯康星州的进步派人士罗伯特·M·拉·福莱特。现在，随着这个国家处于崩溃的边缘，他们可能终于有了机会。乔治·诺里斯，通常被人们称为“奋战的自由派”，在进步党内部已不可忽视。他对“公平施政”原则的支持，以及他对农民具有的民粹主义的吸引力，都使他在即将到来的选举中成为进步党总统候选人。尽管他所提出的纲领让大多数精英人士感到厌恶，但一些人也开始好奇进步党人是否确实比困扰这个国家的极端分子更可取，这些人开始认为，进步党是一个既能解决大多数选民关切的问题，同时又能维持国内和平的政党。§!"
