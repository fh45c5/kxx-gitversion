 USA_The_legacy_of_the_Monroe_Doctrine_idea_2_desc:0 "如今的美国已经从过去的衰落阴影中走出，准备再度投身于美洲事务中。在过去的二十年间，无论是德意志这位世界霸主，抑或是信奉输出革命的第三国际，都被我们的外交斡旋与武力干涉拒于美洲之外。然而，国家强盛的美国准备进一步维护美洲大陆于世界事务中的中立与独立性。在任何的外交场合中，美利坚都始终坚守对门罗主义的坚定支持。"
