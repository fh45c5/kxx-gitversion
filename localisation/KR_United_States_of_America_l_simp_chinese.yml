 USA_Costigan_Wagner_Bill_desc:0 "科斯蒂根和纽约州民主党参议员罗伯特·F·瓦格纳于1934年共同发起了一项联邦反私刑法案，得到了国会许多议员的支持。但令人遗憾的是，他在旧民主党以及南方党团的阻挠下最终未能通过。但如今，没有了南方保守派们掣肘，我们终于能够落实反对私刑的法案了。"
