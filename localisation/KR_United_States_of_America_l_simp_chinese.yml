 USA.970.b:0 "土壤与我们的孩子，是美利坚的命脉所在；让我们通过4-H组织拥抱农业主义"
 USA.970.c:0 "与我们商业领域的盟友密谋，以经济手段控制国家"
 USA.970.e:0 "放任默文·哈特主持的国家经济委员会，榨干美国的每一分价值"
 USA.970.f:0 "资助罗丝·莱恩领导下的国家经济委员会自由意志主义派，以传播真正的经济自由"
 USA.970.g:0 "在新首席保守派领袖上任后，着力凝聚与调和原本分散的保守派力量"
 USA.970.h:0 "要坚守军事秩序的简约，遵循军政派的原则"
 USA.971.t:0 "我们为何热爱霍法"
 USA.971.d:0 "尽管我们采取了严厉的反社会主义立场，抵制左翼主义及其种种隐秘的表现形式，这绝不意味着我们在向工人阶级宣战。恰恰相反，我们的目标是提升白人工人阶级的地位，帮助他们更充分地实现我们所净化的伟大美国梦。为了达成这一崇高目标，同时避开犹太—工团主义叛徒所设的陷阱，我们需要与一个相对可信的人合作，而我们恰巧知道一个合适人选。詹姆斯·“吉米”·里德尔·霍法或许是全美唯一可以托付此项重任的工会领袖，因为他更多地受盗贼统治的利润、公开贿赂和贪污所驱动，而非任何理论的左右；他也是国内少数未被大卫之星玷污的劳工领袖之一，尽管他似乎也对金钱沉溺不已。随着内战以及我们随后采取的反社会主义措施已基本清除了美国劳工联合会中的激进分子，霍法几乎找不到任何盟友，这使得他迫切渴望任何形式的援助。通过扶持他新近净化的美利坚劳工联合会，并将他与全国各地志同道合的亲工人阶级行动者（例如南方的詹姆斯·瓦达曼）联系起来，我们就能将白人工人阶级转化为国家的有效工具——一群有用的追随者与象征性的劳工专家，以此让美国再度闪耀。然而，我们传统进步党内更为反动和保守的成员对此深感厌恶，指责这是伪工团主义对正在重建但仍处于愈合阶段的联邦的渗透。这些愤怒而恐惧的狂热分子主张无视霍法，甚至更为极端，他们想要在摧毁整个美利坚劳工联合会时将他逮捕。不过，此举对美国脆弱的工业复合体以及战后经济的影响尚不可知，尽管很可能引发广泛混乱，最好予以避免。我们应如何抉择？"
 USA.971.a:0 "与霍法和美利坚劳工联合会密切合作，监控美国劳工市场并从中获利"
 USA.971.b:0 "与霍法的明显腐败行为划清界限"
 USA.971.c:0 "监禁霍法，并用忠诚的傀儡换下美利坚劳工联合会的领导层"
 USA.971.e:0 "彻底取缔美利坚劳工联合会，把霍法及其同伙统统关进监狱"
 USA.972.t:0 "斩断柳树之根"
 USA.972.d:0 "查尔斯·A·威洛比总指挥官素来行事高调，排场铺张，一副欧洲旧式领主的气派，总以贵族身份自居，俨然是一位血统纯正的普鲁士军官与世家之后。他刻意营造出一种从故土德意志辗转流落至此、如今在美国以高贵的文明和骑士秩序赐予众人恩典的形象。他自称与普鲁士军官兼贵族T·切佩-魏登巴赫男爵有亲属关系，其本名据传为阿道夫·卡尔·魏登巴赫。多年以来，威洛比将这一身份演绎得无懈可击，连浓重的普鲁士口音与相应的做派都始终保留，纵使在美国生活数十年也未曾改变。公众乃至其身边亲近之人，大多对此深信不疑，当然，怀疑者也并非没有。然而此前，既无确凿证据可以支撑，亦无有力证据可以驳斥他的说法，多数人即便觉得蹊跷，也依然选择了接受。直到本周，一群匿名独立记者抛出了一则石破天惊的报道，声称他们发现了真相，消息迅疾如野火般席卷联邦各地，连华盛顿都因此震动不已。\n\n该报道据称囊括了来自德意志帝国的第一手资料和经过核实的信息来源，以支撑其极为大胆的指控。这篇致命的揭露指出，威洛比根本不是什么贵族，与切佩-魏登巴赫男爵也毫无亲戚关系，真正与他相关的，不过是海德堡一位平凡的绳索匠奥古斯特·魏登巴赫，这意味着威洛比完全没有高贵的出身。报道将威洛比描绘成一个装腔作势的骗子和说谎之人，总司令自然怒不可遏，私下里也深感难堪，却仍然坚称自己原本的说法，并表示这篇报道显然是一篇恶意抹黑之文，是一场更大范围内旨在诋毁其名声、动摇他在美国人民和亲密伙伴中地位与声誉的诽谤运动的一部分。无论真相究竟如何，威洛比周围的政府已经颜面扫地，如今不得不收拾这场风波所酿成的公关灾难，而那位如今摇摇欲坠的“威洛”，正疯狂地试图修复自己的公众形象。"
 USA.972.a:0 "我们得先让那些记者消失"
 USA.973.t:0 "麦克阿瑟热"
 USA.973.d:0 "随着真爱国者党不断巩固统治地位，并牢牢掌控民众思想，一股奇特的狂潮开始席卷全国，私营企业与政府当局已敏锐捕捉到其中的商机，并着手从中牟利。媒体将这股风潮炒作为麦克阿瑟狂，民众开始对一切与麦克相关的事物痴迷不已。将军的生卒日期均被正式设立为联邦法定假日与全国哀悼日。全国各地纷纷矗立起他的雕像，各大建筑也竞相增设以他名字命名的新楼。与此同时，无数歌颂其英雄壮举与卓越天才的民谣和诗歌应运而生。他的事迹与才华更被搬上银幕，在影院和电视中重现。罗纳德·里根、约翰·韦恩和奥迪·墨菲等极具魅力的青年新星纷纷出演将军一角，进一步在公众心中巩固了他光辉伟岸的形象。米高梅、环球和派拉蒙等多家影业巨头更是为了争夺麦克阿瑟狂这块巨大的市场蛋糕而激烈角逐。这位已故英雄生前钟爱的玉米芯烟斗和雷朋飞行员墨镜风靡全美，在各大商店一经上架便被抢购一空。商家甚至推出了烟斗造型的儿童糖果，就像在青少年中早已流行的糖果香烟一样大受欢迎。此外，道格拉斯、麦克和亚瑟也一跃成为最受欢迎的男婴名字榜首。就连传统的奶酪通心粉也被卷入了这场狂热，大众亲切地简称其为麦克芝士。一些食品品牌甚至别出心裁，推出了形似将军烟斗的通心粉。总而言之，麦克阿瑟狂已如风暴般席卷全国，此刻势头正盛。民众与当局一同沉浸在哀悼与颂扬之中，怀念这位逝去的英雄。"
 USA.973.a:0 "颂扬麦克阿瑟的理念"
 USA.974.t:0 "麦克尼德的丛林大师们为美洲带来秩序"
 USA.974.d:0 "作为一名纯粹的军人，副总统汉福德·麦克奈德是担任此职的最佳人选，他能在真爱国者党的政治机器专注于按自身需求驾驭总统洛克威尔的同时，为洛克威尔的美国带来秩序与稳定。然而，当真爱国者党主体与J.埃德加·胡佛忙于在年轻总统背后运作影子政府时，麦克奈德不得不从自身资源中抽调力量，获取可信的人力与支援来恢复街头秩序。通过动用他在美国退伍军人协会的人脉，以及曾服役的第158“丛林大师”步兵团的关系，副总统已开始组建自己的准军事武装，作为随传随到的私人警察力量。这支队伍将受其全权指挥，并在胡佛联邦调查局的监督与支援下，向仍感染这个伟大国家的不满情绪与工团主义残余势力宣战。为在平民层面协助这项崇高事业，麦克奈德从爱荷华共和党政治盟友及新近合作者罗伯特·麦考密克处获得支持，使整个进程更易被普通美国选民接受，并让他们在穿长靴的暴徒于全国街头斗殴时，能幸福地置身事外。这些力量将共同协助副总统麦克奈德，为这片重获新生的天堂再次带来绝对的法律与秩序。"
 USA.974.a:0 "所有异端和不满分子，当心丛林大师！"
 USA.975.t:0 "伯蒂上校的孤立主义联盟"
 USA.975.d:0 "以其可亲可信的平民形象示人，副总统“上校”罗伯特·卢瑟福·麦考密克（亲近者多唤他伯蒂）被推举为麦克尼德阵营的公众代表。他是一位坚定的孤立主义者和财政保守派共和党人，曾对那些毒害社会的思潮，比如福利经济学与伪工团主义痛加斥责，直至第二次内战将这一切彻底撕碎。在战前，他便与罗伯特·塔夫脱并肩，成为党内联盟在真爱国者党中的代表人物。两人以平民身份的温和姿态，平衡着麦克尼德在幕后以军事手段重塑美国的种种图谋，同时凭借老练的智识，约束着冲动鲁莽的洛克威尔总统。麦考密克默许麦克尼德从美国军团信徒中组建私人警察力量，虽然严加掣肘；与此同时，他辅佐胡佛及其联邦调查局，并放任洛克威尔足够的行动自由，让总统沉溺于大权在握的错觉里。他维系着一道微妙而关键的平衡，虽不显山露水，亦鲜有赞誉，但所有人都从中汲取了安宁。靠着敏锐的外交触觉与对孤立主义的矢志不渝，他使美国在国际舞台上保持卓然，却不必陷入任何国际主义纠葛。作为一位卓越的组织者、作家与声望卓著的慈善家，副总统麦考密克，恰恰是我们政府在谋求稳定与专业形象之际，最为所需的那一双缜密而沉稳的推手。"
 USA.975.a:0 "我们将化作一座屹立于岛屿之上的堡垒，坚定而不可撼动"
 USA.976.t:0 "副总统卢斯的创意课外活动与丑闻"
 USA.976.d:0 "身兼数职的副总统克莱尔·布思·卢斯如同戴着多顶帽子，在洛克威尔总统四处游荡、无所事事时，她正灵活运用新获得的权力与影响力。作为自由派纽约移民伯纳德·巴鲁克曾经的政治门徒，她在第二次内战爆发后迅速转向温和保守派右翼，如今成为全国最具影响力的女性保守派人物。副总统卢斯（因其与富有的丈夫非传统关系，私下也常被称为布思女士）凭借这些人脉与更多关系，在意识形态光谱各端都有盟友。她为联邦利益推进各类项目，尽管与新闻媒体巨头亨利·卢斯的婚姻仍在维系，却仍有众多绅士访客。据各方流言蜚语透露，她众多追求者中包括多位全球上流社会显赫人物：保守派政客约瑟夫·P·肯尼迪、战略情报局老兵艾伦·杜勒斯、挪威裔英国作家罗尔德·达尔、美军军官卢西恩·特拉斯科特与查尔斯·威洛比，还有如今声名狼藉的前英国海军将领之子伦道夫·丘吉尔——仅举数例。\n\n然而，若认为副总统仅擅长床笫之事，那将严重低估她作为政府与人民公仆的真实能力。抛开私生活不谈，她是一位真诚的艺术赞助人，委托创作多种媒介作品，为众多艺术文化项目调拨资金——例如曾与著名墨西哥画家弗里达·卡罗合作，绘制美国社交名媛多萝西·黑尔悲惨自杀的画像。在长子安因车祸不幸离世后，她更成为天主教会的坚定盟友与代言人，在悲剧后重拾信仰。她涉足其他女权主义与保守派事业：资助女性技术教育领域的个人基金会，以及旨在汇聚我国政府日益包容的右翼阵营下广泛多元力量的温和保守派联盟。随着逐步将这些过往热情与项目整合进副总统议程，克莱尔·布思·卢斯将竭尽全力为洛克威尔的美国带来文明与文化的曙光。"
 USA.976.a:0 "当然，考虑到她对国家的贡献，我们完全可以对她的私生活睁一只眼闭一只眼"
 USA.977.t:0 "李梅主义"
 USA.977.d:0 "美国军事航空史的早期篇章，谈不上有多么辉煌壮丽。当世界大战在欧洲如火如荼之际，那些王牌飞行员在凡尔登的战壕上空，或是在东线无垠的平原上缠斗厮杀时，美国的飞行员们却只能置身事外，充当旁观者。尽管如此，发展空中力量的重要性，并未被美军军官们所忽视。大多数军官从内战中汲取了经验，主张构建一种多用途的战机组合，以追求最大限度的灵活性。然而，也有一部分人预见到，未来的空战将走向一条更具毁灭性的道路。\n\n在这些改革倡导者中，态度最为坚定不移的，当属总司令柯蒂斯·李梅。这位曾经的战斗机飞行员，后来转入轰炸机部队，他在担任巨型 XB-15 轰炸机试飞员期间的经历，深刻塑造了他的战术理念，使他成为远程大载荷轰炸机的坚定拥趸，并视其为决定战争最终胜负的关键因素。与欧洲的众多理论家一样，李梅笃信“轰炸机总能突破防线”的信条，认为轰炸机的航程越远，对敌人的打击越沉重，就能越快地摧毁对方的生产设施与军事基地，从而瓦解其支撑战争的能力与战斗意志。\n\n为了确保美军能够充分掌握这种足以进行全面战争的武器，一系列大型轰炸机的研发计划相继启动，连一些尘封已久的旧项目也得以重见天日。在这些令人叹为观止的巨型战机中，单从尺寸上论，最引人注目的莫过于翼展超过两百英尺的XB-19轰炸机。这台配备了四台莱特双旋风发动机的庞然大物，航程可以超过五千英里。虽然它最初的用途仅仅是测试轰炸机的尺寸与航程极限，但李梅却计划将其改造为一款真正的作战飞机，能够携带一万八千磅的炸弹。然而，项目的核心工程师指出，等如此庞大的飞行器完工之时，日新月异的现代航空技术恐怕早已超越了它的性能。因此，代号为XB-35的备用方案便应运而生。这款由诺斯罗普公司开发的机型，因其飞翼构型而显得独树一帜。它没有传统的尾翼，腾出的空间被用来安装四台普惠黄蜂式推进发动机，使其时速可接近四百英里。凭借预计超过五万磅的载弹量，这架轰炸机一旦问世，便将在一夜之间成为全球最先进的同类机型。但通往如此尖端航空器的道路，绝对称不上一马平川。\n\n于是，当XB-19即将驶出工厂，以确保李梅那种通过空中轰炸无情摧毁敌人的战术得以实现时，XB-35仍在等待属于自己的时机。等到其设计最终定型之日，这架无尾翼的奇迹飞行器，便能横跨大西洋或太平洋，将美利坚的敌人彻底粉碎。"
 USA.977.a:0 "再次启动战争工厂"
 USA.978.t:0 "美利坚保守派组织联合会"
 USA.978.d:0 "尽管盲从的异教徒、愚昧野蛮的三K党徒和社会主义颠覆分子使尽浑身解数，美利坚依然屹立不倒。然而，这个国家遭受的创伤远不止于肉体，整个民族的灵魂都已饱受煎熬。钢带人心涣散，南方动荡肆虐，而在富饶的加利福尼亚，犹太自由派建制势力的前特工们正暗中蛰伏，躲避着复仇心切的联邦探员。在这动荡与黑暗交织的漩涡中心，是盎撒白人新教徒。他们四面楚歌，饱受政敌威胁、政局动荡与犯罪率飙升之苦。作为政府的基本盘，他们长期无人庇护、无人援助、也未被有效整合，直到如今局面才得以改变。尽管宣传攻势与里根的电台演讲至今未能凝聚起广大忠诚的国民，但洛克威尔总统已心生一计。\n\n洛克威尔从一个出人意料的方向汲取了灵感，即西班牙的人民行动。他决定发起一场广泛的群众运动，打造一个相对温和的保守派阵营，借此向普通民众宣扬政府主张，并确保赢得他们的支持。在光复后的全国各地，各类社交俱乐部与保守派协会将在美利坚保守派组织联合会的旗帜下纷纷成立。这些组织将以美式爱国主义与团结精神为纽带，紧密联结在一起。依托这一全新的伞形组织，各协会与俱乐部将获得充足的资金与资源支持。借此，同胞们可以向广大民众阐明政府各项决策的初衷，并说明为何商界巨贾与小镇平民必须携手共进，共创更美好的美利坚。\n\n为了吸引那些原本犹豫不决的民众加入这些新协会，联合会将免费提供餐饮，借此利用当前尚未完全解决的食品短缺问题来吸引人群。洛克威尔的真正目的，自然是想将此包装为真爱国者党乃至他本人的仁政善举。他希望借此吸引那些饥肠辘辘的民众，其中许多人曾受三K党煽动、社会主义蛊惑以及自由派谎言的蒙蔽。\n\n当这些淳朴的民众在协会里酒足饭饱、相谈甚欢时，他们或许还会有幸迎来总统本人的亲临走访，感受他亲切的笑容与随和的交谈。"
 USA.978.a:0 "洛克威尔还是个忠厚人啊"
 USA.979.t:0 "索取关岛？"
 USA.979.d:0 "在内战开始时，东洋鬼子就决定在我们眼皮底下把关岛偷走。现在，是时候把关岛拿回来了。关岛在广阔的太平洋中可能很小，但它对我们在该区域的势力具有重要影响。如果关岛在我们的控制之下，我们在向整个太平洋投射我们的影响方面就又迈进了一步，我们今天已经失去了这种影响。为了重新获得我们在太平洋上的影响力，我们必须夺回我们合法的领土。但日本会同意吗？"
 USA.979.a:0 "好，提出声索！"
 USA.979.b:0 "不值得。"
 USA.980.t:0 "美国人索取关岛！"
 USA.980.d:0 "虽然我们认为，我们占领关岛不会引起注意，或者至少不会受到惩罚，但现在美国政府的领导人欧内斯特·金上将发誓要通过外交或其他手段夺回关岛。假设他真的这么做了，我们可以试着揭穿他的虚张声势，但这个岛值得这么大动干戈吗？"
 USA.980.a:0 "不，放弃关岛吧！"
 USA.980.b:0 "是的，这个岛是我们的！"
 USA.981.t:0 "日本人拒绝了我们的请求！"
 USA.981.d:0 "那些东洋人拒绝了我们对合法领土的要求！现在我们必须决定如何回应他们的傲慢。我们可以在日本人知道是什么袭击它们之前占领这些岛屿，但这肯定会引发外交事件，甚至可能引发战争。虽然金一直反对延长关岛谈判的想法，但或许最好还是就让它过去，把注意力集中在本国的事务上。我们该怎么做？"
 USA.981.a:0 "夺取关岛！"
 USA.981.b:0 "随他们去吧"
#经济事件
USA.1000.t:0 "追思镀金年代的幽灵"
 USA.1000.d:0 "十九世纪末，美国完成了人类历史上最惊人的工业化之一。铁路横贯大陆，钢铁取代木材，石油驱动机器，电灯照亮城市，无数来自世界各地的移民共同铸就了一个建立在工厂、矿井与金融资本之上的现代共和国。那个时代创造了前所未有的财富，也孕育了前所未有的垄断、贫富差距与政治腐败。历史学家后来将其称作「镀金年代」——黄金确实覆盖了整个国家，却无法遮掩其下的裂痕。\n\n几十年过去，美国经历了一战后的短暂繁荣，也经历了紧随其后的大萧条与黑色星期一。德国股市的崩溃如同一场远隔重洋的风暴，却迅速席卷整个世界，使美国赖以维系的金融、工业与贸易体系接连陷入瘫痪。无论哪路党派执掌最高权力，那个曾经不可一世的工业巨人都不得不面对同一个现实：属于旧时代的发展模式已经走到了尽头。只有建立一个更现代、更高效，也更能抵御未来风暴的新经济体系，美国才能真正迈入新的时代。"
 USA.1000.a:0 "属于美国的新工业时代即将开始。"
 USA.1001.t:0 "自东海岸直抵落基山巅"
 USA.1001.d:0 "联邦经济规划委员会已经完成了第一轮全国调查。报告中的每一页都在提醒我们，美国面对的并非单一地区的衰退，而是一场横跨大陆的经济失衡。东海岸和五大湖沿岸集中了全国最密集的城市、金融机构、钢铁厂与铁路枢纽，却也在黑色星期一后承受了最严重的失业、信贷冻结与工业停摆。若共和国经历过进一步的动乱，这些地区的损失只会更加触目惊心。\n\n相比之下，落基山脉以西的广大地区保存着更充足的发展空间。太平洋港口仍能接触亚洲市场，加利福尼亚的农业、航空和电影产业也显示出可观潜力。西部许多基础设施虽然规模有限，却不像东部那样背负沉重的老旧设备与城市债务。部分规划者因此主张，与其把所有资源投入修补旧工业中心，不如在西海岸建立一个面向未来的新经济核心。\n\n然而，联邦财政无法同时满足所有要求。优先恢复东部，可以迅速重新启动全国的金融、钢铁和制造体系；优先开发西部，则能减少国家对传统工业带的依赖，并强化美国在太平洋上的经济与战略地位。两种方案都关乎全国复兴，却代表着完全不同的发展顺序。"
 USA.1001.a:0 "东部城市区决定了国家的经济"
 USA.1001.b:0 "为了保卫太平洋，优先重建西海岸！"
 USA_priority_reconstruction_zone:0 "优先重建区域"
 USA.1002.t:0 "福特的新设计"
 USA.1002.d:0 "底特律的福特工程师再次将一辆新车推上了展台。它没有昂贵的装饰，没有追求惊人的速度，也不准备成为富人车库中的炫耀品。设计者从一开始便将目标锁定在普通家庭：更少的零件、更低的油耗、更容易维修的发动机，以及能够通过大规模流水线迅速生产的标准化车身。\n\n这种理念延续了亨利·福特多年前提出的愿景——汽车不应只是少数人的奢侈品，而应成为工人、农民与小商户都能负担的日常工具。黑色星期一重创了汽车市场，也迫使制造商重新思考过去依赖分期消费和不断升级车型的发展模式。新车的定价明显低于同类产品，甚至连部分原本只能购买二手车的家庭也开始前往经销商询价。\n\n市场反应远超预期。首批订单很快填满工厂的生产计划，各地商人也开始讨论汽车普及可能带来的连锁变化：郊区住宅将不断扩张，农村居民能够更方便地进入城市，公路沿线则会出现新的旅馆、修理厂、餐馆和加油站。汽车不再只是交通工具，而可能成为重塑美国生活方式的力量。当然，廉价车型也意味着更激烈的行业竞争、更繁忙的公路，以及城市对私人交通日益增长的依赖。但在经济仍需要信心的时刻，一辆普通家庭买得起的新车，或许正是最直接的强心针。"
 USA.1002.a:0 "人人有车开！"
 USA.1003.t:0 "新一年新业绩！"
 USA.1003.d:0 "通用汽车集团公布了新一年度的经营报告。即使经历信贷紧缩、消费衰退与市场动荡，公司仍凭借覆盖不同价格区间的品牌体系、成熟的经销网络以及灵活的分期销售重新扩大市场份额。从廉价家用车到高档轿车，通用几乎为每一种消费者准备了一款产品。\n\n这份成绩单迅速成为美国企业界重拾信心的象征。集团管理层宣称，大型企业并非危机的制造者，而是国家走出危机所必需的组织力量。只有掌握充足资本、专业管理和全国供应链的公司，才能在需求低迷时继续投资，并在经济恢复后迅速扩大生产。部分政府顾问也建议给予通用更多贷款担保、采购合同和税收优惠，以带动钢铁、橡胶、玻璃与机械行业共同复苏。\n\n然而，交通部门提出了不同意见。美国城市已经越来越依赖私人汽车，而公共铁路、电车和长途客运却在持续萎缩。若联邦政府继续把有限资金投入汽车制造，最终可能形成一个只有拥有汽车者才能自由行动的国家。与其进一步扶持已经取得成功的企业，政府或许更应改善公共交通，让经济复苏能够服务没有能力购买车辆的普通人。"
 USA.1003.a:0 "为通用集团给予我们进一步的支持"
 USA.1003.b:0 "私人交通就交给他们吧，我们还是需要尽职于公共事业"
 USA.1004.t:0 "产线上的勤奋身影"
 USA.1004.d:0 "自美国工业革命开始以来，机器的轰鸣便始终伴随着工人的抗议声。铁路工人曾因降薪而阻断交通，矿工曾在枪口下组织罢工，钢铁工人与私人警卫在厂门前激烈对峙。从八小时工作制到安全法规，从童工禁令到集体谈判，今日被视作理所当然的权利，大多来自过去数代劳工付出的漫长代价。\n\n二十世纪初，福特主义和泰勒主义改变了美国工厂。标准化零件、流水生产与科学管理让产量以前所未有的速度增长，却也把复杂劳动分解成不断重复的机械动作。更高工资、更短工时和企业福利在部分工厂中缓解了不满，但严格监控、高强度节奏与随时可能到来的解雇依旧使许多工人感到自己只是机器的附属品。\n\n如今，全国复兴再次要求工厂提高产量。企业家警告，若增加工资、缩短工时并强化安全标准，生产成本便会在最困难的时期继续上升。美国需要钢铁、汽车、机械和建筑材料，而产线上的任何放缓都可能拖延整个经济恢复。但工会代表则指出，要求工人以牺牲健康和家庭生活为代价拯救国家，只会重演过去最糟糕的错误。生产并不是由机器独自完成的。"
 USA.1004.a:0 "先有工人才有产能"
 USA.1004.b:0 "正值困难时期，难道他们就不能无私奉献一些？"
 USA.1005.t:0 "于财富之山之上"
 USA.1005.d:0 "宾夕法尼亚的第一批油井曾经只是木架、绳索与泥泞之间的一场冒险。此后不到一个世纪，石油便改变了整个美国。它为工厂提供润滑，为家庭带来煤油，为汽车提供燃料，也让炼油、化工、运输与金融资本结成了庞大的产业体系。得克萨斯、俄克拉何马和加利福尼亚的新油田，更使美国成为世界上最重要的石油生产国之一。\n\n但石油带来的财富从未平均分配。标准石油的旧影仍笼罩着行业，即使昔日的巨型托拉斯已经被拆分，各家继承企业仍凭借管道、炼油厂、销售网络和政治影响力主导市场。较小的生产商必须接受它们制定的运输价格，地方政府则常常依赖石油税收，以至于不愿追问企业如何获得土地和特许权。\n\n黑色星期一之后，大型石油公司借机收购陷入困境的竞争者，行业集中趋势进一步加速。支持者认为，只有这些企业拥有扩大勘探、建设管道和稳定供应所需的资本；反对者则警告，若放任其继续扩张，美国未来的工业、交通乃至军队都可能被少数董事会控制。战争或国际封锁一旦来临，石油将不再只是商品，而是决定国家存亡的战略资源。政府既可以暂时容忍企业集中，以换取快速投资与稳定产量；也可以开始监管价格、储备和兼并，为可能到来的危机预作准备。"
 USA.1005.a:0 "随他们去吧，我们现在没有多余精力管他们"
 USA.1005.b:0 "他妈的美国是资本家老巢吗？"
 USA.1006.t:0 "四通八达之路"
 USA.1006.d:0 "美国的崛起曾是一部由基础设施写成的历史。运河连接五大湖与大西洋，铁路跨越草原和山脉，港口将内陆农产品送往世界，桥梁与城市电车则把不断扩张的都市连成一个整体。每一条新线路都缩短了距离，也让原本孤立的地方第一次进入全国市场。\n\n然而，那些曾经象征进步的设施正在迅速老化。许多铁路仍沿用几十年前铺设的线路，城市桥梁无法承受不断增加的汽车和货车，乡村道路一到雨季便难以通行。地方政府长期债台高筑，私人公司也更愿意投资能立即获利的新项目，而不是维护看不见回报的旧路基、隧道与排水系统。大萧条期间，联邦和各州曾试图通过公共工程创造就业。成千上万的人修建道路、公园、水坝与公共建筑，这些项目缓解了局部困难，却缺乏统一的全国规划。不同州采用不同标准，公路在边界处突然变窄，铁路与港口建设彼此脱节，维护资金更常在工程竣工后迅速消失。复兴不能只依靠重新打开工厂大门，商品必须能够运出，劳动力必须能够流动，偏远地区也必须同全国市场保持联系。如今我们需要的不再是零散工程，而是一套真正贯穿大陆、统一标准并持续维护的现代交通网络。"
 USA.1006.a:0 "条条大路通美国！"
 USA.1007.t:0 "明亮夺目之城"
 USA.1007.d:0 "入夜后的美国呈现出两种截然不同的景象。纽约、芝加哥和洛杉矶的商业街被霓虹灯照得如同白昼，工厂依靠电动机械持续运转，广播与家用电器已经成为城市生活的一部分；但在许多乡村、小镇和边远地区，家庭仍依赖煤油灯，农场无法使用电泵与冷藏设备，学校和诊所也常因缺乏稳定供电而难以正常运作。问题并不只是发电量不足。美国的电力体系长期由地方政府、私人公司和州级机构分别管理，各地使用的标准、价格与发展计划差异巨大。盈利丰厚的城市得到优先投资，而人口稀少、铺设线路成本较高的地区则被一再忽视。即使相邻州拥有多余电力，也可能因为网络不兼容或利益争执而无法相互供应。\n\n新的全国电气化计划准备改变这一局面。联邦政府将设立统一的电力管理部门，协调发电站、输电线路与区域电网建设，并为尚未通电的地区提供低息贷款和直接投资。各州仍可管理本地配电，但主要标准、跨州输电和长期规划将不再各行其是。\n\n批评者担忧，这会创造一个权力庞大而行动迟缓的官僚机构；私人电力公司则宣称，政府正借普及供电之名侵入市场。然而，没有电力的家庭无法真正进入现代经济。若美国想要建设新的工业时代，灯光便不能只停留在少数大城市的天际线上。"
 USA.1007.a:0 "神说...要有光..."
 USA.1008.t:0 "东方铁路网"
 USA.1008.d:0 "经过持续不断的规划、拨款与施工，政府在东部地区的新一轮铁路整合工程已取得了阶段性成果：一条贯穿南北的干线如今正式投入使用，自亚特兰大一路延伸至费城，同时沿线上的诸多分支铁路网也被一并翻新或是重新铺设。原本分散、老化且效率低下的区域铁路系统被整合为一张更加连贯的运输网络。\n\n在该工程完工后，其价值就立刻显现出来。不仅体现在运输效率的提升上，沿线城市与工业区的联系更是被显著强化，原材料与成品的流通速度高于过去32%，同时旅客运输也变得更加稳定可靠。这不仅证明了美国正在逐步走出大萧条与黑色星期一的阴影，对许多经历经济停滞或是重建中的地区而言，铁路的恢复更是象征着一种久违的正常运转——列车准点抵达，货物按计划发出，一切都按照计划井井有条。\n\n国家工程部已着手评估下一阶段的扩展方案，多条支线工程的方案蓝图即将落地并将被提交总统案头，目标是进一步加强港口、工业中心与内陆市场之间的联系。若资金与资源条件允许，这张铁路网将在未来数年内继续向外延伸，进而成为与数十年前那条横贯美国东西的大铁路齐名的国家工程里程碑。"
 USA.1008.a:0 "来年夏天去趟费城！"
 USA.1009.t:0 "美国之声"
 USA.1009.d:0 "通信技术的飞速发展，正在以前所未有的方式重塑如今的美国社会。自工业革命后，无线电与广播已经将世界更加紧密的连接在了一起。而在如今，无线电广播与收音机早已不再是城市精英的专属玩物，而是走进了乡镇、农场与工人社区，成为无数家庭日常生活的一部分。各地私人广播电台如雨后春笋般涌现，它们在娱乐、新闻与公共讨论领域的影响力正不断扩大。\n\n然而，正是这种去中心化的传播方式，引发了政府内部的担忧。在缺乏统一监管的情况下，一些电台被指控传播激进的工团主义观点，或为外国势力提供隐蔽的宣传平台。在1936年的大选前，整个美国深陷政治暴力与对抗中，激进党派正是大量的使用地下广播与非法电台在我们的监管外向公民宣扬他们的观点。而如今，若任由地下电台与匿名频道继续存在，真正有利于国家的信息空间可能在不知不觉中被渗透。\n\n然而，尽管那些拥护监管的声音不断要求政府出手，但反对监管的声音同样不容忽视。批评者指出，广播电台的多样性正是美国社会活力的体现，任何形式的集中管控都可能滑向审查制度，破坏公民自由与地方自治的传统。他们认为，国家不应扮演“思想守门人”的角色。在国家安全与言论自由之间，广播这一新兴媒介已成为无法回避的战场。政府必须决定，是否应当将无线电纳入国家秩序之中，抑或继续信任市场与公众的判断力。"
 USA.1009.a:0 "保卫美国人民的不受有害信息侵扰是我们的责任"
 USA.1009.b:0 "公民们有权听他们想听的"
 USA.1010.t:0 "予勤劳者的庇护"
 USA.1010.d:0 "在美国乡村，破产往往并不意味着一个企业从账本上消失，而意味着一个家庭失去祖辈耕作的土地。农产品价格下跌、银行收紧信贷、干旱与设备损耗已经使成千上万的农户无力偿还债务。许多人被迫出售牲畜和农具，另一些人则在失去农场后带着家人前往城市，加入本就庞大的失业人口。为了阻止乡村社会继续崩解，联邦政府成立了一支农业救助基金，专门援助濒临破产的小农户，并帮助失去土地者重新开始生产。然而，这笔资金究竟应当如何使用，农业部门内部出现了明显分歧。\n\n社会救济机构主张，最紧迫的问题不是扩大产量，而是让农民及其家人活过眼前的困境。政府应直接发放食品补贴、住房援助和债务减免，防止更多家庭因饥饿与疾病而彻底失去重新站起来的可能。农业技术官员则认为，单纯救济只能延缓破产。与其不断填补农户的亏损，不如向他们提供廉价种子、化肥、牲畜与农业机械，使土地重新产生足够的收入。也许投资明日的收成更加英明，但对于已经空着肚子的农民而言，明年或许仍然太遥远。"
 USA.1010.a:0 "至少他们应当填饱肚子"
 USA.1010.b:0 "把目光放长远一点"
 USA.1011.t:0 "新式机械"
 USA.1011.d:0 "在农业部举办的新式农具展览会上，一台外形笨重却功能惊人的联合机械成为了所有人的焦点。它能够在同一条作业线上完成收割、脱粒与谷物清理，过去需要十几名季节工连续劳动数日的工作，如今只需一名驾驶员和少数助手便可完成。改进后的拖拉机也拥有更可靠的发动机、更低的燃料消耗，并能牵引播种、施肥和深耕设备。农业机械制造商宣称，这些机器将为美国乡村带来一场新的生产革命。农户可以在更短时间内耕种更大面积的土地，减少因天气变化造成的损失，并把有限劳动力从最繁重的体力劳动中解放出来。配合改良种子、化肥和科学轮作，单位土地的产量有望达到前所未有的水平。\n\n然而，并不是每个农民都买得起这些设备。大型农场可以迅速采用新技术，小农户却可能为了购买机器背上新的债务。更高效率也意味着更少的农业雇工，许多依赖季节性劳动维生的人或许不得不离开乡村。但政府顾问指出，只要配合低息贷款、合作社共有设备和技术培训，机械化带来的收益仍将远远超过代价。"
 USA.1011.a:0 "这将带来丰收"
 USA.1012.t:0 "泰坦尼克再启航"
 USA.1012.d:0 "白星航运公司，曾经的世界航运巨头，也是波云诡谲的20世纪大幕下一个命途多舛的企业的典型。1925年不列颠革命的突然爆发迫使这家老牌航运企业离开其原有的经营环境，跟随国王及不列颠帝国一同迁往加拿大王国；在获得了政府的资金支持后，其航运业务又因遭到数次第三国际海军的恶意扣押而备受打击。随后，经营困境与市场变化又使其被一家美国航运公司收购。然而，政治动荡与经营不善并非压死骆驼的最后一根稻草，在经过不断的努力与挣扎后，新重组的白星航运计划于1936年重新回归航运业务。然而，黑色星期一的降临与美国的政治风暴彻底的将其击垮，将这家老牌企业的重新诞生彻底宣判了死刑。\n\n如今，随着政府着手系统性地重整美国航运业，白星航运被重新纳入国家经济规划之中。通过国家注入资金并调整经营结构，这家企业被转型为一家由政府主导的航运公司，新建成的“泰坦尼克号”正是在这一背景下诞生。与其前身相比，这艘巨轮的再度起航不再承担炫耀技术极限的使命，而被视为现代化造船能力、航运管理与安全标准的综合成果。当它缓缓驶离纽约港，驶向德意志帝国的威廉港时，这条航线本身便传递出清晰的信息：美国的航运业重新回到了大西洋舞台。\n\n尽管这次启航仅仅是未来白星航运企业发展的第一步，但它标志着一个阶段的结束：对政府而言，这是一次成功的产业干预；对公众而言，则是一种久违的信号——美国的航运业与造船业正在从萧条中一点点复苏，并指向更广阔的市场与未来。"
 USA.1012.a:0 "航运奇迹！"
 USA.1013.t:0 "翱翔于新大陆的天空之上"
 USA.1013.d:0 "航空业正在成为美国经济复兴中最引人注目的领域之一。在政府贷款、邮运合同与研究拨款的支持下，新的机场不断落成，民用航线逐渐跨越整个大陆，军方也开始认真评估飞机在运输、侦察和远程作战中的价值。投资者口中的航空不再是一项危险的消遣，而是足以改变商业、旅游和国防的新兴产业。\n\n如今，联邦航空委员会准备启动一项规模庞大的联合研发计划。政府将提供资金、试验设施与长期采购保证，而合作企业则负责设计能够代表美国下一代航空技术的新型机种。三家公司已经进入最终候选名单。波音公司在大型运输机与民用客机方面经验丰富，其方案强调更远航程、更舒适的客舱和更低的单位运输成本。洛克希德则以高速、可靠和军用改装能力见长，陆海军均对其设计表现出浓厚兴趣。至于休斯航空，规模虽然不及两位竞争者，却拥有霍华德·休斯近乎不受常理束缚的野心；他的团队承诺，他们不会只是改良现有飞机，而会重新定义飞行本身。政府的选择不仅会决定一个研发项目的归属，也可能决定未来十年美国航空工业的发展方向。"
 USA.1013.a:0 "波音公司将带来旅游业腾飞"
 USA.1013.b:0 "洛克希德在军用领域的成就无可指摘"
 USA.1013.c:0 "霍华德·休斯，这位天才企业家会有好点子的"
 USA.1014.t:0 "空中客车"
 USA.1014.d:0 "波音公司的新型大型客机终于驶出装配厂。与过去那些由邮运机或轰炸机改造而来的民航飞机不同，这一型号从设计之初便以大规模客运为目标。宽阔的机身能够容纳更多乘客，封闭式客舱配备改进的通风、供暖与隔音设备，新的起落架和多发动机布局则显著提高了长途飞行的安全性。工程师最引以为傲的，是它在载客量与运营成本之间取得的平衡。航空公司可以在一趟航程中运送过去数架飞机才能承载的旅客，而标准化零件也使维修和人员培训更加简便。波音的宣传人员甚至给它起了一个颇为大胆的称呼——“空中客车”，意在把航空旅行从富人的奢侈享受变成普通中产家庭也能够计划的出行方式。\n\n首批航线将连接纽约、芝加哥、旧金山和洛杉矶。旅行社已经开始推出横跨大陆的度假套餐，沿途城市则争相扩建机场、酒店与地面交通设施。曾经需要数日火车旅程才能跨越的距离，如今有望在一天之内完成。当第一批乘客透过舷窗俯瞰大陆时，美国旅游业已经进入了一个全新的时代。"
 USA.1014.a:0 "想想下次旅游去哪里？"
 USA.1015.t:0 "飞翔的文图拉"
 USA.1015.d:0 "洛克希德公司的工程师向军方提交了一项以十八型“北极星”运输机为基础的特殊改造方案。原有机体以稳定、可靠和较长航程著称，而新设计则强化了机身结构，重新布置内部空间，并增加用于携带炸弹、导航设备和自卫武器的位置。项目人员将这一轰炸改型命名为“文图拉”。与专门设计的重型轰炸机相比，文图拉的载弹量并不突出，但它能够利用现有生产线迅速制造，也更适合执行海岸巡逻、战术轰炸和远距离侦察任务。较高速度使其有机会避开敌方拦截，而运输机出身所带来的宽大机舱，也为通信、照相和特殊任务设备留下了充足空间。\n\n随同主方案提交的还有一种反潜改型。该机将配备海面搜索设备、扩充油箱和适合攻击潜艇的武器，可在漫长海岸线和远洋航道上执行巡逻。海军代表尤其重视这一设计，因为潜艇并不会等待大型舰队完成集结后才发动攻击，而廉价、可靠的陆基飞机可能成为保护商船航线的第一道防线。这两种方案尚未经过完整测试，但其技术基础足够成熟，也有望在短时间内形成实际战力。"
 USA.1015.a:0 "将该原型进行测试，观察后续研发可能"
 USA.1016.t:0 "大力神于天穹之上"
 USA.1016.d:0 "在举国瞩目的期待与怀疑中，休斯航空终于在今天宣布了他们最雄心勃勃的计划之一取得了阶段性胜利：代号 H-4 的巨型运输机——被报纸称为“大力神”的庞然大物——完成了研发并准备进行试飞。它是迄今为止世界上最大、最宽、最重的飞行器，几乎是由木材与奇迹共同拼装而成的产物。\n\n休斯的工程师们宣称，这架飞机能够载运七百多名士兵或数十辆坦克横跨大洋，它的机翼跨度几乎能遮蔽整个洛杉矶机库的天光。在长达数年的研发中，无数声音质疑它只是休斯的狂想：一架不可能飞翔的木制怪物，一个永远停留在图纸上的美梦。然而，如今的现实却无可辩驳——它真的矗立在那儿，白色的机身在加州的阳光下闪闪发光，仿佛一件从未来降临的庞大雕塑。这一壮举已经在全美乃至全世界引起轰动。有媒体将它视为“新时代的诺亚方舟”，象征着美国工程与工业的无限潜能；也有人依旧嘲讽它不过是休斯的又一次昂贵自我炫耀。然而，无论爱或恨，没有人能否认：当“大力神”的巨影掠过地平线，美国的航空史已经被彻底改写。"
 USA.1016.a:0 "“飞行家”果然有狂想"
 USA.1017.t:0 "山巅之城的蓝衣卫士"
 USA.1017.d:0 "纽约的复兴并不只意味着重新竖起摩天楼、疏通隧道和修复码头。只要夜幕降临，那些尚未恢复照明的街区、废弃仓库与拥挤车站便会提醒市政府：一座城市若不能保证居民安全，再宏伟的建设计划也不过是绘在纸上的蓝图。经济崩溃使纽约警察局长期处于经费不足的状态。警车和无线电设备严重短缺，许多分局仍在使用老旧档案系统，大量警员不得不同时处理街头犯罪、劳资冲突、走私活动和政治暴力。部分街区逐渐落入帮派与地方政治机器控制之中，而警局内部的受贿、裙带关系和选择性执法，也进一步削弱了市民对蓝衣警察的信任。\n\n新的城市治安计划将修复警署、更新车辆与通信设备，并扩充巡警和刑事调查部门。警员将接受更加系统的法律、鉴识与社区警务训练，市政府也准备成立独立机构，调查腐败和滥用职权问题。市政府认为，纽约需要的是一支现代、专业并服从法律的警察队伍，而不是政党机器、地产商或码头帮派的私人打手。当警灯重新照亮布鲁克林的街角、哈莱姆的道路和曼哈顿的车站时，安全的都市生活才算真正回到了普通市民身边。"
 USA.1017.a:0 "向你致敬，警官！"
 USA.1018.t:0 "艺术之都"
 USA.1018.d:0 "纽约曾经是一座不肯安静下来的城市。百老汇的灯牌彻夜闪耀，格林尼治村的咖啡馆里挤满作家与画家，第五大道的博物馆收藏着来自世界各地的珍品，而哈莱姆的爵士乐则通过广播和唱片传遍全国。金融与工业赋予了纽约财富，但真正使这座城市不同于其他都会的，是无数移民、艺术家和表演者共同塑造出的文化活力。经济危机使这片繁荣迅速黯淡。剧院因观众减少而关门，小型出版社和画廊接连破产，许多音乐家、演员与作家只能依靠临时工作维生。即使最著名的文化机构也不得不削减展览和演出，而那些没有富裕赞助人的地方剧团、黑人艺术团体和移民社区文化组织更是首当其冲。\n\n纽约重建委员会提出了一项雄心勃勃的文化复兴计划。市政府将修缮百老汇剧院区，扶持博物馆、公共图书馆与音乐厅，并向年轻艺术家和地方团体提供低息贷款与创作空间。哈莱姆的音乐与文学、格林尼治村的先锋艺术以及新兴电影和广播产业，都将被纳入城市发展规划之中。巴黎、维也纳和柏林曾经主宰世界文化，但欧洲的动荡为纽约留下了一个难得的机会。只要这座城市能够重新点亮舞台，它便不必再满足于成为美国的金融中心——它可以成为整个现代世界的艺术之都。"
 USA.1018.a:0 "让百老汇的灯火再次照亮世界"
 USA.1019.t:0 "新英格兰的“炼金术师”"
 USA.1019.d:0 "杜邦集团的实验室里，从来不缺少令人费解的瓶罐、纤维和化合物。公司最初凭借火药起家，此后却逐渐把化学技术扩展到染料、涂料、塑料、橡胶替代品和农业产品之中。许多看似毫无关联的行业，如今都依赖杜邦工程师从煤、石油和空气中“变”出的新材料。站在这座化学帝国中心的是伊勒内·杜邦。他既是精明的企业管理者，也是一个冷血，无情而残酷的压榨者。这位疯狂而冷酷的大亨将利润视作唯一要务。在此之外，他还与一些新英格兰本地的准军事团体联系密切。现如今，政府希望借助杜邦的实验室推动一系列新材料项目，包括更轻的航空部件、更耐用的轮胎、改良化肥以及可以大规模生产的合成纤维。批评者提醒，杜邦家族与金融界、军火工业和保守政治团体关系密切，任何合作都可能进一步扩大其对国家经济的影响力。但美国若想保持工业领先，就不能因为惧怕企业过于成功而拒绝最优秀的研究能力。至于伊勒内本人，他似乎并不在意华盛顿如何评价他。"
 USA.1019.a:0 "怪人一个"
 USA.1020.t:0 "贵族之庭"
 USA.1020.d:0 "美国从未承认世袭贵族，但财富、婚姻与政治影响力仍塑造出了一批延续数代的显赫家族。他们的姓氏出现在银行董事会、报纸头版、大学捐赠名录与政府任命之中。共和国在法律上没有公爵与伯爵，却并不缺少属于自己的宫廷。随着政府准备推动下一阶段的经济和社会计划，顾问们建议争取一个具有全国影响力的家族作为非正式盟友。肯尼迪家族深耕民主党政治，拥有金融、媒体和外交领域的人脉，年轻一代更表现出进入全国政坛的雄心。阿斯特家族则长期活跃于房地产、商业和上流社会，其跨越大西洋的关系有助于吸引投资并恢复国际贸易。范德比尔特家族的铁路财富虽然已不如鼎盛时期集中，但其名字仍象征着美国旧工业资本，在慈善、教育和社会名流圈中保留着巨大影响。与这些家族合作能够打开许多原本紧闭的大门，却也可能使政府重新落入私人关系与精英政治的旧习。可是在华盛顿，公开宣称反对特权的人，往往也会在晚宴结束后悄悄接受一张写着显赫姓氏的名片。"
 USA.1020.a:0 "肯尼迪家族扎根政界多年，堪为助力"
 USA.1020.b:0 "阿斯特家族跟商界关系密切，与他们合作"
 USA.1020.c:0 "范德比尔特家族的社会影响力巨大，有助于我们"
 USA.1021.t:0 "探访智慧之家"
 USA.1021.d:0 "总统的教育顾问最近完成了一次全国大学考察。从哈佛古老的庭院，到芝加哥大学严肃的讲堂，再到加利福尼亚新建的实验室，美国高等教育展现出一种与国家本身相似的矛盾：传统与创新并存，私人声望与公共使命相互竞争。\n\n常青藤联盟的大学拥有悠久历史、庞大捐赠和遍布政界商界的校友网络。它们聚集了许多最优秀的学者，也能迅速把政府资助转化为重要研究成果。支持优先同这些学校合作的人认为，国家应把有限资源交给已经证明自身能力的机构，而不应为了表面上的地区平衡牺牲效率。但西部和南部的年轻大学、州立学院与技术学校正在培养数量更多的工程师、教师和农业专家。它们与地方工业和社区联系更加紧密，却往往因缺乏捐赠而无法建设先进实验室。若政府只资助传统名校，科学发展的中心仍会集中在少数东部城市，大批有才华的学生也可能永远得不到进入研究领域的机会。"
 USA.1021.a:0 "更青睐常青藤联盟的大学"
 USA.1021.b:0 "还是帮帮那些更年轻的大学吧"
 USA.1022.t:0 "探访新英格兰文化"
 USA.1022.d:0 "从马萨诸塞的古老港镇，到佛蒙特覆着积雪的山谷；从康涅狄格河畔的村庄，到缅因州终年与风浪相伴的渔港，新英格兰从来不只是一块地理区域。清教徒留下的教堂尖塔、十三殖民地时期的会议厅、独立战争中的民兵传说，以及世代流传的海员故事，共同塑造了这里克制、坚韧而又略带忧郁的地方气质。然而，现代工业、人口迁移和大众娱乐正在逐渐冲淡这种文化差异。年轻人离开小镇前往纽约与中西部，古老宅邸和村落日益荒废，地方出版物也难以同全国性报刊竞争。为此，新英格兰各州的文化机构希望得到联邦支持，将本地传统转化为能够面向全国乃至海外传播的作品。\n\n一部分学者主张回望殖民时代，以早期定居者、独立战争和十三州共同体为主题创作历史小说、戏剧与电影。这类作品能够提醒民众，新英格兰不仅是美国历史的见证者，也是共和国最早的奠基者。另一派则希望鼓励乡土文学，描写枫林、渔村、农庄、海岸灯塔与小镇居民的日常生活，把地方风土转化为吸引游客的文化名片。\n\n还有一些更年轻的作家提出了截然不同的方向。他们认为，新英格兰阴冷的海岸、古老的家族宅邸、常年笼罩在雾气中的森林与难以解释的地方传说，天然适合恐怖、悬疑与科学幻想。或许，一种足以令世界重新理解恐惧的新文学，正藏在那些无人愿意久留的海湾和山谷之间。"
 USA.1022.a:0 "历史文学有助于增强民众的文化认同感"
 USA.1022.b:0 "乡土文学有助于吸引更多游客"
 USA.1022.c:0 "恐怖与悬疑让我想起缅因州的大雾天..."
 USA.1023.t:0 "文学新热潮"
 USA.1023.d:0 "霍华德·菲利普斯·洛夫克拉夫特生前从未真正成为大众熟知的作家。他的小说大多刊登在廉价杂志上，稿酬微薄，读者有限，评论界也很少认真看待那些充满古老神祇、异星生物与禁忌知识的故事。《疯狂山脉》描写南极探险队发现了远比人类文明古老的遗迹，《暗夜呢喃》则把佛蒙特群山中的怪谈同来自群星之外的生物联系在一起。许多编辑认为这些作品过于晦涩，也太过荒诞。\n\n然而，新英格兰最近遭遇的一场飓风，意外改变了他的文学命运。暴雨过后，康涅狄格州与缅因州的偏远地区陆续传出怪异目击报告。有人声称在被冲毁的林地中看见了长着薄翼、轮廓近似人形的黑影，也有人在海岸发现难以辨认的足迹和奇怪残骸。当地警方大多将其解释为受伤动物、暴风造成的错觉，或是年轻人的恶作剧。但读过《暗夜呢喃》的人立即想到了故事中的米戈。报纸很快将这些传言同洛夫克拉夫特联系起来，旧杂志被读者争相搜购，出版社也开始整理他过去无人问津的作品。短短数周内，恐怖小说、神秘故事和所谓“宇宙恐怖”成为文学界最热门的话题。电影公司甚至开始讨论，能否把那些无法用正常布景表现的生物搬上银幕。\n\n大多数人当然相信，这只是一场由风暴、传闻和商业宣传共同制造的热潮。只是缅因州的几名猎人至今仍拒绝谈论他们在森林里听见的声音。"
 USA.1023.a:0 "但愿这不是纪实文学..."
 USA.1024.t:0 "“疤面”的末路"
 USA.1024.d:0 "在第二次美国内战期间，芝加哥的犯罪集团并未保持中立。“疤面”阿尔·卡彭及其手下利用走私网络、赌场收入和地方关系为工团势力提供物资，并协助组织针对铁路、仓库和政府设施的破坏行动。部分黑帮成员甚至以政治口号为掩护，煽动骚乱、勒索商户，将整个城市的混乱变成扩张犯罪帝国的机会。战争结束后，联邦调查人员与军方宪兵随即展开大规模追捕。安全屋、地下酒馆和秘密仓库接连被查封，过去依靠收买地方官员逃避法律的头目们也失去了庇护。经过数周围捕，阿尔·卡彭、约翰·迪林杰以及多名重要帮派成员先后落网。\n\n由于他们被控在战争期间协助敌对武装、破坏后方并参与有组织暴力，案件被交由军事法庭审理。审判并未持续太久，检方提交的账本、通信记录和证人证词足以证明他们所扮演的角色。法院迅速作出最严厉的判决，政府随后在芝加哥公开宣布执行结果，以向仍试图利用战后混乱牟利的犯罪集团发出警告。曾经不可一世的黑帮帝国就此瓦解，聚集在广场周围的人群高声欢呼。"
 USA.1024.a:0 "这混蛋也有这一天！"
 USA.1025.t:0 "通用汽车的扩张"
 USA.1025.d:0 "通用汽车并不满足于重新取得汽车市场的领先地位。随着消费回暖和政府订单增加，集团董事会提出了一项规模惊人的扩张计划：进一步整合零部件、金融、运输与销售体系，使从钢材采购、发动机制造到经销贷款的每一个环节都置于统一管理之下。在过去，汽车制造商往往依赖大量独立供应商。车身、轮胎、玻璃、电气设备和轴承分别来自不同企业，任何一家工厂停工，都可能拖慢整条生产线。通用的新计划则准备扩大直属零件厂，取得关键供应商的控股权，并通过集团内部运输网络把各地工厂连接起来。旗下金融部门也将为经销商和消费者提供更稳定的分期信贷，以确保生产与销售同步增长。\n\n支持者认为，这种纵向统合能够减少浪费、统一技术标准，并使公司在经济动荡时维持产量。汽车工业还会带动钢铁、橡胶、化工、石油和公路建设，为全国创造大量就业。然而，独立企业和反垄断人士警告，若通用同时控制制造、供应、信贷与销售，它就不再只是一家汽车公司，而会成为一座足以影响整个国家经济的企业王国。通用的管理者对此毫不讳言。他们相信，美国工业的未来属于规模、协调与统一，而不是彼此分散的小型企业。"
 USA.1025.a:0 "迈向统合之路！"
#外交
USA.1300.t:0 "要求墨西哥臣服"
 USA.1300.d:0 "随着共和国重新恢复统一，华盛顿再次将目光投向了南方边境。长期以来，美国始终将墨西哥视为西半球秩序的重要组成部分。从十九世纪的边境战争，到门罗主义确立以来的外交传统，美国始终认为，任何敌视美国的势力都不应在格兰德河以南获得立足之地。如今的墨西哥依旧政局动荡，国内各派系彼此对立，经济也尚未完全恢复。国务院认为，现在正是重新确立美国在北美主导地位的最佳时机。至于我们希望墨西哥接受多大程度上的"合作"，总统仍拥有最终决定权。"
 USA.1300.a:0 "要求墨西哥服从我们的管辖"
 USA.1300.b:0 "他们的政府也需要我们的指导"
 USA.1300.c:0 "我们将彻底收复这片昭昭天命的应许之地！"
 USA.1301.t:0 "北方恶邻"
 USA.1301.d:0 "美国大使向我国政府递交了一份措辞严厉的外交照会。华盛顿要求墨西哥接受美国在外交、安全以及经济上的全面指导，并暗示若拒绝合作，美国将采取一切必要措施维护北美大陆的稳定。内阁迅速陷入激烈争论。一部分官员认为，墨西哥目前根本无力同重新统一后的美国抗衡，与其让战争毁掉国家，不如暂时接受现实；另一部分人则认为，一旦向美国低头，共和国将永远失去真正的独立。与此同时，也有人主张抢先动员军队，趁美国尚未完成战争准备主动出击。"
 USA.1301.a:0 "我们只能服从"
 USA.1301.b:0 "绝不！"
 USA.1301.c:0 "我们要先发制人！"
 USA.1302.t:0 "墨西哥拒绝服从！"
 USA.1302.d:0 "令人失望的是，墨西哥政府不仅断然拒绝了我们的最后通牒，还在全国范围内举行公开集会，谴责美国试图干涉其主权与内政。部分欧洲报纸也开始借机批评美国正在重新走上帝国主义道路。国务院认为，继续容忍这种挑衅只会削弱美国在整个西半球的威信。军方则已经完成了针对边境地区的初步作战计划，只等待总统作出最后决定。"
 USA.1302.a:0 "我们将即刻动员"
 USA.1302.b:0 "等待时机"
 USA.1303.t:0 "哈瓦那谈判"
 USA.1303.d:0 "随着加勒比海重新恢复和平，美国政府决定重新定义同古巴之间的关系。国务院认为，一个稳定而亲近华盛顿的古巴，不仅能够保障佛罗里达海峡的航运安全，也能够成为整个加勒比海地区最重要的战略支点。国务卿率领代表团抵达哈瓦那，同古巴政府展开谈判。美国愿意提供贷款、投资以及军事保护，但作为交换，古巴也必须接受美国提出的一系列政治与经济条件。双方究竟能够达成何种程度的合作，将决定加勒比海未来数十年的政治格局。"
 USA.1303.a:0 "要求古巴加入我们的势力范围，同时允许美国企业进入古巴市场"
 USA.1303.b:0 "古巴的政府需要美国来引导航向"
 USA.1303.c:0 "除去上述条件美国必须要在关塔那摩湾驻军"
 USA.1304.t:0 "美国人的要求"
 USA.1304.d_A:0 "美国人在谈判中释放了善意的信号，希望我们能够加入他们的势力范围并开放市场，作为回报古巴将会获得美国的投资与保护。同时美国人愿意立刻为古巴提供一批物资援助，只要我们同意他们的要求。"
 USA.1304.d_B:0 "美国人在谈判中并不友善。这些美国代表希望我们能够加入他们的势力范围并开放市场，同时美国人将干涉我们的政府构成并控制我们的海关与邮政。而作为回报古巴将会获得美国的投资与保护。同时美国人愿意立刻为古巴提供一批物资援助，只要我们同意他们的要求。"
 USA.1304.d_C:0 "美国人在谈判中咄咄逼人这些美国代表希望我们能够加入他们的势力范围并开放市场，同时美国人将干涉我们的政府构成并控制我们的海关与邮政。美国人还态度强硬地表示他们需要在关塔那摩湾建立美国的海军基地并派驻舰艇保护古巴的国家安全，但是个人都知道他们只是为了进一步控制加勒比海。作为回报古巴将会获得美国的投资与保护。同时美国人愿意立刻为古巴提供一批物资援助，只要我们同意他们的要求。"
 USA.1304.a:0 "合理的提议"
 USA.1304.b:0 "美国必须加大对古巴的投资，同时需要负责古巴的基础设施建设"
 USA.1304.c:0 "绝不！"
 USA.1305.t:0 "古巴的进一步要求"
 USA.1305.d:0 "古巴政府没有立即拒绝美国提出的条件，而是提出了一份新的协议草案。哈瓦那希望美国能够进一步扩大投资规模，协助建设港口、公路、电力以及公共设施，同时提供更多贷款，以帮助古巴完成经济现代化。国务院认为，这些要求虽然代价不小，却能够让古巴更加依赖美国经济。军方则认为，与其继续进行漫长谈判，不如直接采取军事行动，一劳永逸地解决加勒比问题。"
 USA.1305.a:0 "同意"
 USA.1305.b:0 "出兵！"
 USA.1306.t:0 "古巴拒绝了"
 USA.1306.d:0 "古巴拒绝了我们的要求，谈判破裂了"
 USA.1306.a:0 "混蛋！"
 USA.1307.t:0 "特鲁希略政变"
 USA.1307.d:0 "今黎明尚未到来，多米尼加首都的机场便响起了运输机的轰鸣。忠于拉斐尔·特鲁希略的警察部队在少量美国军事顾问和空运部队的协助下迅速控制了电台、总统府以及主要交通枢纽。街头随即爆发激烈交火，双方围绕政府机关和军营展开争夺。特鲁希略宣称，现政府已经无力维持国家稳定，而自己将建立一个能够恢复秩序、打击腐败并重振经济的新政府。反对者则指责这场政变不过是美国扶植傀儡、进一步控制加勒比海的又一次干涉行动。\n\n经过数小时战斗，枪声终于渐渐停息。如今，整个国家都在等待最后的结果。"
 USA.1307.a:0 "特鲁希略成功了"
 USA.1307.b:0 "政变失败"
 USA.1308.t:0 "争取大西洋影响力"
 USA.1308.d:0 "众所周知，大西洋是我们最大的防线，也是我们最大的弱点。大西洋是我们与世界其他地方的联系通道，因此控制这片水域对我们的生存至关重要。然而，许多大国都在争夺该地区的控制权，我们最好试着取得上风。要做到这一点，我们可以要求拥有英法在加勒比海的港口，这些国家几乎肯定会拒绝这一提议，但他们可能也无法拒绝更合理些的提议。另一方面，我们可以要求[ENT.GetName]为我们提供港口驻扎权。我们该怎么做？"
 USA.1308.a:0 "索取加勒比海的港口！"
 USA.1308.b:0 "只索取百慕大和巴哈马群岛！"
 USA.1308.c:0 "港口驻扎权是风险最小的选择……"
 USA.1309.t:0 "美国要求大西洋港口"
 USA.1309.d:0 "美国已经决定要求控制整个加勒比地区，这似乎是我们的一个挫折。虽然这是一个非常厚颜无耻的提议，但我们不能与美国发生冲突。我们应该直接拒绝他们的提议，让他们继续虚张声势，还是对他们的要求让步？"
 USA.1309.a:0 "我们别无选择……"
 USA.1309.b:0 "绝对不行！"
 USA.1310.t:0 "美国要求百慕大和巴哈马群岛"
 USA.1310.d:0 "美国已经决定要求控制百慕大和巴哈马群岛，这似乎是我们的一个挫折。虽然这是一个非常厚颜无耻的提议，但我们不能与美国发生冲突。我们应该直接拒绝他们的提议，让他们继续虚张声势，还是对他们的要求让步？"
 USA.1310.a:0 "我们别无选择……"
 USA.1310.b:0 "绝对不行！"
 USA.1311.t:0 "美国要求海军通行权"
 USA.1311.d:0 "在一次奇怪的举动中，美国今天要求进入我们的港口，以补充燃料并采取海军行动，至少他们是这么说的。这有点不值得信任，但我们也听说他们在他们的要求上有所保留，认为这是他们能提供的最好的条件，我们可以接受。我们应该鼓励他们对我们采取进一步的行动，还是在他们友好地请求时接受这个提议？"
 USA.1311.a:0 "当然，我们接受！"
 USA.1311.b:0 "不，他们太弱了，伤害不了我们……"
 USA.1312.t:0 "[FROM.GetName]同意！"
 USA.1312.d:0 "今天，[ENT.GetName]已经接受了我们的合理要求。这标志着美国的安全和我们的海军进入了新时代。控制这些岛屿将使我们走上在世界各地扩大我们影响力的道路。"
 USA.1312.a:0 "很好！"
 USA.1313.t:0 "[FROM.GetName]拒绝了我们！"
 USA.1313.d:0 "虽然我们提出了一个大家都认为合理的提议，但那些傲慢的[ENT.GetName]外交官们。已经决定拒绝我们的提议。我们对这么小的过失无能为力，但这肯定会损害我们两国的关系！"
 USA.1313.a:0 "真糟糕！"
 USA.1314.t:0 "[FROM.GetName]同意！"
 USA.1314.d:0 "今天，[ENT.GetName]已经接受了我们的合理要求。这标志着美国的安全和我们的海军进入了新时代。控制这些岛屿将使我们走上在世界各地扩大我们影响力的道路。"
 USA.1314.a:0 "很好！"
 USA.1315.t:0 "[FROM.GetName]拒绝了我们！"
 USA.1315.d:0 "虽然我们提出了一个大家都认为合理的提议，但那些傲慢的[ENT.GetName]外交官们。已经决定拒绝我们的提议。我们对这么小的过失无能为力，但这肯定会损害我们两国的关系！"
 USA.1315.a:0 "真糟糕！"
 USA.1316.t:0 "泽穆赖政变"
 USA.1316.d:0 "黎明前，美军运输机越过加勒比海，将大批武器、补给和人员秘密运抵洪都拉斯境内。与此同时，长期活跃于中美洲的美国商人塞缪尔·泽穆赖组织起一支规模惊人的雇佣军。这些士兵大多接受过正规军事训练，装备清一色的美式步枪、火炮和车辆，甚至还有数辆美国制造的坦克随军推进。\n\n对于整个中美洲而言，泽穆赖绝非陌生人物。这位来自俄罗斯的著名犹太裔美国移民和贪婪的商人依靠香蕉贸易起家，多年来始终与当地政治保持着千丝万缕的联系，甚至曾多次左右政府更迭。如今，他再次打着恢复秩序、保护商业利益的旗号，向洪都拉斯首都特古西加尔巴发起进军。面对装备悬殊的敌军，政府军节节败退。随着总统府被攻占，泽穆赖宣布成立新的临时政府，并承诺恢复稳定、吸引外国投资以及保障国际企业的合法权益。中美洲又一次证明了一个令人无奈的事实：在这里，香蕉有时比选票更能决定一个国家的未来。"
 USA.1316.a:0 "香蕉共和国的既定命运"
 USA.1317.t:0 "美国政变"
 USA.1317.d:0 "今天凌晨，在美国运输机和海军舰艇的支援下，一支由乔治·范·霍恩·莫斯利将军率领的远征部队突然在马那瓜附近登陆。同行的还有大批美国军事顾问、海军陆战队以及当地亲美军官，他们迅速控制机场、广播电台和政府机关，试图在政府军尚未反应过来之前结束战斗。然而，忠于现政府的军队很快组织起反击。双方围绕首都街区展开激烈巷战，坦克、自行火炮与机枪火力将原本宁静的马那瓜化作战场。数小时后，这场决定国家命运的战斗终于迎来了结果。"
 USA.1317.a:0 "美国人掌控了尼加拉瓜"
 USA.1317.b:0 "颠覆行动被粉碎了"
 USA.1318.t:0 "索取运河？"
 USA.1318.d:0 "巴拿马运河是人类最伟大的成就之一，这一荣誉理应属于美国。而且这不仅是一项伟大的成就，它也是在大西洋和太平洋之间高效贸易和海上旅行的必要条件。但是，近年来，我们对这个关键的战略位置已经失去了控制，外国人利用我们在内战期间的软弱在国外剥削我们。但现在，是时候面对那些从我们手中偷走巴拿马运河的人了，是时候把我们修的运河拿回来了……"
 USA.1318.a:0 "发出要求！"
 USA.1318.b:0 "转念一想……"
 USA.1319.t:0 "美国要求归还运河！"
 USA.1319.d:0 "虽然我们在美国面临内战时控制了巴拿马运河，但他们已经成功地统一了国家，他们想要回他们的运河。他们威胁说，如果我们拒绝，他们就会发动战争，但值得因此放弃这样一份有价值的财产么？"
 USA.1319.a:0 "好吧，好吧！"
 USA.1319.b:0 "巴拿马是我们的了！"
 USA.1320.t:0 "[FROM.GetName]同意了我们的要求！"
 USA.1320.d:0 "所有人都松了一口气，[FROM.GetName]同意把巴拿马运河还给我们，这是我们的合法领土。"
 USA.1320.a:0 "棒极了"
 USA.1321.t:0 "[FROM.GetName]拒绝了我们的要求！"
 USA.1321.d:0 "我们收到消息，[FROM.GetName]拒绝了我们的要求，现在我们必须决定下一步行动。这一拒绝显然是对我们的侮辱，表明他们对美国的力量缺乏尊重，然而，我们曾说如果他们拒绝了我们的要求，我们就会入侵他们。我们应该兑现这个承诺吗？"
 USA.1321.a:0 "是的，用武的来！"
 USA.1321.b:0 "等待机会……"
 USA.1322.t:0 "美国希望举行和平会议"
 USA.1322.d:0 "由于德法两国的边境纠纷由来已久，同时这也是引爆欧罗巴大陆上数次纷争的诱因之一，美国希望能够在他们的调停下彻底在我国与法国之间达成一个长期的和平协议，以期达成欧罗巴的持久的和平。美国人愿意支持德国永久保留阿尔萨斯-洛林地区，德法两国维持普法战争后的边界，但同时希望德法两国之间能够达成偏向法国利益的经济协议，以帮助法国人重建。同时美国将为德法两国同时提供重建与经济援助以保证两国的战后重建进行与利益不受损失。"
 USA.1322.a:0 "好的我们接受"
 USA.1322.b:0 "我们的土地不需要他们来指手画脚"
 USA.1323.t:0 "美国希望举行和平会议"
 USA.1323.d:0 "由于德法两国的边境纠纷由来已久，同时这也是引爆欧罗巴大陆上数次纷争的诱因之一，美国希望能够在他们的调停下彻底在我国与德国之间达成一个长期的和平协议，以期达成欧罗巴的持久的和平。美国人支持德国永久保留阿尔萨斯-洛林地区，以让德法两国维持普法战争后的边界。尽管这毫无疑问会伤害我国的利益与民族感情，但由于我们正处在大战后，尝试武力收复阿尔萨斯-洛林也是有心无力。但美国声明美国将会促成德法两国之间能够达成偏向法国利益的经济协议，以帮助我国更快速重建。同时美国将为德法两国同时提供重建与相当可观德经济援助以保证两国的战后重建进行与经济利益不受损失。"
 USA.1323.a:0 "好的我们接受"
 USA.1323.b:0 "我们的土地不需要他们来指手画脚"
 USA.1324.t:0 "德国人拒绝我们的提议！"
 USA.1324.d:0 "德国人拒绝了我们的德法和平协议！"
 USA.1324.a:0 "这帮混蛋！"
 USA.1325.t:0 "法国人拒绝我们的提议！"
 USA.1325.d:0 "法国人拒绝了我们的德法和平协议！"
 USA.1325.a:0 "这帮混蛋！"
 USA.1326.t:0 "阿尔萨斯会议"
 USA.1326.d:0 "经过数周艰苦谈判，德国、法国以及美国代表终于在阿尔萨斯签署了新的欧陆和平协定。根据协议，德法双方正式确认现有边界，德国继续保有阿尔萨斯—洛林，而法国则获得一系列贸易优惠、重建贷款以及美国主导的经济援助计划。双方同时承诺通过国际仲裁解决未来争端，并逐步恢复边境贸易和人员往来。没有人能够保证这份协议能够永久终结延续数十年的民族仇恨，但至少此时此刻，枪炮终于沉默了。对于饱受大战摧残的欧洲而言，这份来之不易的和平，值得所有人为之庆祝。"
 USA.1326.a:0 "我们庆祝欧罗巴的长久和平！"
 USA.1327.t:0 "收复黑暗大陆"
 USA.1327.d:0 "随着协约国开始筹划重返非洲大陆，各成员政府纷纷讨论未来殖民地的归属问题。美国虽然并不对非洲拥有历史主权要求，却仍将承担庞大的军事、海军以及后勤压力。越来越多的国会议员开始质疑：美国士兵是否应当为了他人的殖民帝国流血牺牲？国务院因此决定，在正式支持协约国行动之前，首先明确美国能够获得何种回报。有人主张完全履行盟友义务，不求任何利益；也有人认为，美国企业应获得未来矿产资源开发权，以补偿战争成本。更大胆的意见甚至建议，将战略位置重要的南非纳入美国保护体系，使共和国真正拥有通向印度洋的立足点。"
 USA.1327.a:0 "为了我们的盟友，我们义无反顾"
 USA.1327.b:0 "我们希望能够在未来的非洲获得矿业的开采权"
 USA.1327.c:0 "...同时把南非纳入我们的保护中"
 USA.1328.t:0 "美国盟友的要求"
 USA.1328.d_1:0 "美国要求我们在收复非洲殖民地后将一部分矿业的开采权交予他们，否则美国有权拒绝参加任何针对非洲的军事行动"
 USA.1328.d_2:0 "美国要求我们在收复非洲殖民地后将一部分矿业的开采权交予他们，同时将南非纳入他们的保护中，否则美国有权拒绝参加任何针对非洲的军事行动"
 USA.1328.a:0 "答应他们"
 USA.1328.b:0 "滚"
 USA.1329.t:0 "[FROM.GetName]拒绝了我们！"
 USA.1329.d:0 "虽然我们提出了一个大家都认为合理的提议，但那些傲慢的[ENT.GetName]外交官们，已经决定拒绝我们的提议。"
 USA.1329.a:0 "操"
 USA.1330.t:0 "美国声索东印度"
 USA.1330.d:0 "美国向我们发来了最后通牒，要求我们在限定时间内交出荷属东印度的控制权，否则美国就将出动武力占领。"
 USA.1330.a:0 "我们只能接受"
 USA.1330.a:0 "让他们滚"
 USA.1331.t:0 "不列颠行政当局"
 USA.1331.d:0 "大西洋彼岸的战事已经结束，但不列颠并未因此重新成为一个可以自行运转的国家。伦敦的部委大楼仍在清点被焚毁的档案，煤矿与港口之间的调度系统支离破碎，地方警察和治安法官既畏惧美军，也畏惧那些还藏在工厂区和乡村里的旧工团分子。国务院建议扶植一个更能被英国保守社会接受的本土行政当局，以便让占领逐渐披上自治与传统的外衣；财政界则认为，约瑟夫·肯尼迪仍是少数熟悉伦敦金融、新闻舆论和英国上层关系网的美国人，他的手段未必体面，却足够有效。无论选择哪条道路，不列颠都不会被交还给旧日的幻想。它只会在我们的指导下，学习如何重新成为大西洋秩序的一部分。"
 USA.1331.a:0 "哈利法克斯能让英国人相信这仍是他们的国家"
 USA.1331.b:0 "让肯尼迪去处理伦敦那群银行家"
 USA.1332.t:0 "法兰西行政当局"
 USA.1332.d:0 "巴黎已经落入我们的秩序之中，但法国从不只是巴黎。省长公署、工厂委员会、天主教社团、退伍军人网络和残存的地方警察都在等待新主人的信号。国务院推举罗伯特·墨菲，他熟悉法国政界、外交渠道和战后行政谈判，能把法国变成一个听得懂美国命令的文官国家；军情与保守派顾问则建议扶植弗朗索瓦·德·拉·罗克，让法国本土的反工团主义、退伍军人和社会保守势力承担更多肮脏工作。无论谁接过这份权力，法兰西都不会重新成为旧日那个任性的大国。它必须学会在我们的监督下保持体面。"
 USA.1332.a:0 "墨菲知道如何同法国人打交道"
 USA.1332.b:0 "拉罗克会让街头安静下来"
 USA.1333.t:0 "德意志行政当局"
 USA.1333.d:0 "柏林已经不再是欧洲秩序的裁判者。各邦政府、鲁尔工业家、旧官僚、军官团残部和教会网络都在等待美国占领当局给出新的边界。国务院倾向于让约翰·麦克洛伊接手这套混乱机器：他熟悉法律、金融与跨大西洋谈判，能够把德国改造成一个可被贷款、条约和委员会约束的行政国家；而保守派顾问则认为，卡尔·弗里德里希·戈德勒这样既反工团又懂得市政与财政纪律的德国人，更能让这场占领披上本土责任的外衣。无论谁被扶上台，德意志都不会再被允许凭自己的意志重铸欧洲。它必须先学会被指导。"
 USA.1333.a:0 "麦克洛伊会让德国人读懂华盛顿的条文"
 USA.1333.b:0 "戈德勒能让旧德国自己收拾残局"
 USA.1334.t:0 "美国提出太平洋谈判"
 USA.1334.d:0 "美国代表团带着一份措辞克制却锋芒毕露的提案来到东京。华盛顿承认日本在近海与西太平洋拥有不可忽视的地位，但要求帝国停止继续加大南进力度，并同意与美国共同维持一套可被外界观察的舰队规模。若我们接受，美国将避免对亚洲事务进行过度干预，也不会以禁运作为勒紧日本工业命脉的手段；若我们拒绝，他们口中的谈判恐怕很快就会变成威慑、封锁与舰队调动。参谋本部对这种限制深感不满，但外务省认为，一份短暂的克制协议也许能为帝国争取必要的整备时间。"
 USA.1334.a:0 "接受这份太平洋协议"
 USA.1334.b:0 "日本不会让美国人规定自己的航路"
 USA.1335.t:0 "东京接受太平洋协议"
 USA.1335.d:0 "日本政府接受了我们的提议。东京承诺不再继续加大南进力度，并同意同我国共同维持一套不至于引发公开海军竞赛的舰队规模。作为交换，我们将避免对亚洲进行过度干预，也不会以禁运逼迫日本走向绝境。协议不会带来真正的友谊，但它至少能让太平洋在一段时间内容纳两支彼此警惕的舰队。"
 USA.1335.a:0 "太平洋暂时归于平静"
 USA.1336.t:0 "东京拒绝太平洋协议"
 USA.1336.d:0 "日本拒绝了我们的提议。东京不愿接受任何有关南进或舰队规模的限制，也不愿让美国在太平洋秩序中保留决定性发言权。谈判桌上的礼貌措辞已经失去意义，接下来能让日本人听懂的，恐怕只剩下禁运、基地、盟友和舰队。"
 USA.1336.a:0 "那么就让他们听见舰炮的声音"
 USA.1337.t:0 "重回美国庇护？"
 USA.1337.d:0 "华盛顿已经重新把目光投向西太平洋。美国代表没有使用最后通牒的语言，却清楚地表示，菲律宾群岛仍是太平洋防线不可替代的一环。若马尼拉愿意重回美国庇护，我们将获得资金、顾问、港口扩建与一把可靠的安全伞；代价则是外交与军事政策必须重新围绕华盛顿的需要运转。拒绝当然仍是可能的选择，但在日本舰队、东南亚乱局和大国交易之间，所谓独立或许并没有听上去那样轻松。"
 USA.1337.a:0 "美国的保护比孤立更可靠"
 USA.1337.b:0 "菲律宾不会再交出自己的命运"
 USA.1338.t:0 "美国要求东亚军事通行权"
 USA.1338.d:0 "美国政府提出了一份关于东亚防务协调的协议。华盛顿宣称，德属东亚的港口、铁路和机场是稳定西太平洋的重要节点，只要我们愿意向美国军队开放必要的军事通行权，美国便会把我们视作东亚秩序的一部分，同时也是德美友谊的重要见证。拒绝这份协议不会立刻带来战争，却会让我们在美国的战略地图上显得更加可疑。"
 USA.1338.a:0 "向美国开放必要通行权"
 USA.1338.b:0 "我们的基地不由华盛顿调度"
 USA.1339.t:0 "美国要求东印度军事通行权"
 USA.1339.d:0 "华盛顿的使节来到巴达维亚，要求我们在未来的太平洋防务安排中向美国提供军事通行权。荷属东印度的油田、港湾和海峡对任何亚洲战略都至关重要，而美国愿意以安全承诺、贸易机会和外交支持换取进入这些要地的便利。接受意味着我们将被纳入美国的太平洋体系；拒绝则能保留体面上的自主，却也可能让我们在危机来临时独自面对风暴。"
 USA.1339.a:0 "让美国人使用我们的通道"
 USA.1339.b:0 "东印度不需要美国驻足"
 USA.1340.t:0 "日本占领体制"
 USA.1340.d:0 "日本已经处在美国权力的阴影之下，但东京仍不是一座可以自行运转的行政机器。内阁残余、军部派阀、财阀网络与地方官僚都在等待华盛顿给出最终信号。国务院建议保留一层日本本土政府，以便让新秩序显得不那么刺眼；军方则认为，若远东永久和平要从纸面落到现实，日本就必须先被一套直接、明确而不容讨价还价的占领体制重新塑形。问题并不在于日本是否会服从，而在于我们准备让谁代表美国命令他们服从。"
 USA.1340.a:0 "建立驻日军事管理局"
 USA.1340.b:0 "保留现有傀儡政府即可"
 USA.1341.t:0 "美国提出远东谈判"
 USA.1341.d:0 "来自美国的代表团已从符拉迪沃斯托克港口正式登陆，旨在就远东局势与我们展开战略谈判。美方在谈判中作出了重大让步：他们不仅承认俄罗斯作为世界核心极点的崇高地位，更公开承认了俄罗斯对远东地区的绝对主权。然而，作为交换条件，华盛顿要求我们即刻冻结并停止对中国境内及日本列岛的进一步渗透与势力扩张。为了展现诚意，美利坚表示愿意向我们提供极其丰厚的援助作为回报，其中包括急需的轻工业基础建设援助，以及一系列新式武器装备的整套生产线。同时，他们郑重承诺将避免过度干预亚洲事务，并保证绝不采取海上封锁等极端的围堵手段将俄罗斯逼入绝境。尽管这份协议注定无法彻底弥合俄罗斯与美利坚之间的矛盾与仇恨，但它至少能够为剑拔弩张的远东前线注入一剂降温针，让这个濒临爆发的远东火药桶暂时化解危机，不至于演变为一场不可收拾的全面对抗。"
 USA.1341.a:0 "显然这很符合我们的利益"
 USA.1342.b:0 "莫斯科接受远东协议"
 USA.1342.d:0 "莫斯科最终传来了令人振奋的消息，俄罗斯政府正式接受了合众国的外交提议。根据条约，莫斯科承诺将全面停止对中国地区与日本列岛的进一步渗透与扩张，同时公开承认美利坚在亚洲的战略存在与合法利益。作为对等交换，合众国先前允诺的轻工业援建设施、新式武器生产线以及巨额经济补偿，都将通过通畅的海路源源不断地输送到俄罗斯境内。虽然两国的宿怨依然深重，真正的持久和解或许希望渺茫，但在剑拔弩张的国际局势之上，总归要有人勇敢地迈出第一步。更重要的是，这项协议的达成对合众国而言堪称一举两得，它不仅稳固了远东与太平洋的战略秩序，更为我们腾出了宝贵的战略资源。一个获得输血恢复元气的俄罗斯，将在欧洲大陆形成一股不可忽视的制衡力量，替我们有效牵制并遏制德意志帝国日益膨胀的霸权与扩张企图。"
 USA.1342.a:0 "远东暂时归于平静"
 USA.1343.t:0 "莫斯科拒绝远东协议"
 USA.1343.d:0 "俄罗斯人傲慢地摔碎了我们递出的橄榄枝。莫斯科方面彻底拒绝了合众国的和平提议，不仅绝不肯在远东的中国与日本利益上作出半步让步，更妄图独占亚洲，将美利坚的战略影响力完全摒弃在太平洋西岸之外。外交案头上的彬彬有礼与外交辞令已然失去了任何价值。面对这群油盐不进、冥顽不灵的俄国野蛮人，温柔的劝说永远无法唤醒暴君与扩张狂。接下来，能让这群北境蛮族听懂并坐下来思考的，恐怕只有美利坚枪炮的咆哮与铺天盖地的弹雨了。合众国已经做好了最坏的准备。既然莫斯科选择了对抗，那我们就将在远东的冰原与海洋上，用钢铁与烈火为他们上最后一课！"
 USA.1343.a:0 "那么就让他们听见舰炮的声音"
 #合众国占领下的傀儡政府
 USA.1344.t:0 "合众国治下的加拿大"
 USA.1344.d:0 "天佑美利坚！在英勇的合众国陆军与德意志帝国盟友的协同进军下，不列颠在新大陆的残余政权已被彻底歼灭，一举洗雪了当年英军火烧白宫的奇耻大辱。如今，整个加拿大已完全落入我军掌控之中。作为这片土地的“解放者”，我们理所当然地接管了当地事务。随着零星抵抗势力的瓦解，合众国终于能腾出手来审视加拿大的未来战局与政治走向。国内的激进民族主义者高呼将加拿大彻底并入美利坚合众国版图；然而，这个想法在国会部分资深议员看来却极不妥当。若直接将加拿大吞并，当地浩大的战后重建、民生调控以及社会治安等沉重负担将全数压在合众国财政之上。合众国刚刚才从“黑色星期一”的经济灾难中艰难复苏，国库实在无力承担这笔天文数字般的额外开支。此外，直接占领意味着合众国陆军必须长期驻扎重兵以维持统治，甚至陷入应对当地潜在反抗力量的泥潭。因此，部分议员主张顺应当地民意，扶植并建立一个由美利坚引导与监督的“加拿大共和国”傀儡政府，由其自主处理加拿大内部事务。如此一来，合众国不仅能将财政与行政包袱顺理成章地甩给新政府，更能将宝贵的兵力与战略资源从繁重的占领任务中解脱出来，从而集中精力投入旧大陆的霸权争夺，或是在美洲全面贯彻并升华我们的“门罗主义”。加拿大未来的命运究竟如何，仍有待国会辩论后做出最终裁决。"
 USA.1344.a:0 "加拿大将会成为星条旗上的又一颗星星"
 USA.1344.b:0 "受华尔街操纵的华莱士·麦卡特钦会成为加拿大新一任统治者"
 USA.1344.c:0 "帕特里克·赫尔利受命组建由合众国陆军所管控的加拿大政府"
 USA.1344.e:0 "让我们与德国的血亲一道统治加拿大"
 USA.1345.t:0 "第二次西进运动的伟大成果"
 USA.1345.d:0 "天佑美利坚！在英勇的合众国陆军与德意志帝国盟友的协同进军下，南方的邪恶的墨西哥政权已经轰然崩塌。曾经第三国际刺入北美腹地的这枚毒瘤，终于被我们彻底拔除，赤色分子，阴谋集团与墨裔浪人再也无法威胁合众国的南方边境。如今，墨西哥全境已完全落入我们的掌控之中。作为这片土地的新主宰，接管当地事务自然是理所当然的职责。随着最后一支墨西哥正规军的覆灭，我们终于能够着手审视并决定这片土地的未来去向。自西进运动以来，墨西哥的领土就在合众国的开拓进取之下大幅收缩，德克萨斯、加利福尼亚、新墨西哥等地的归附，皆是美利坚天命昭昭的辉煌硕果。我们对墨西哥的战略威慑与政治影响力自古有之，然而这个赤色政权竟敢妄图摆脱合众国的掌心，甚至妄图从我们手中夺回那些早已属于美利坚的圣土！也许我们应当给这群狂妄之徒一个教训：将墨西哥彻底吞并，直接并入合众国的版图。但现实却令人犹豫，当地的墨西哥民众愚昧顽劣、极难教化，漫长无序的动荡让这片土地充满了帮派强盗与各式土匪。全面吞并意味着合众国必须承担极为庞大的重建开销，还要处理无休无止的治安战；更何况，我们绝不能将美利坚雄师的宝贵兵力浪费在这片穷山恶水之中。或许，以“墨西哥人治理墨西哥”才是更明智的策略。在这片土地上，合众国从不缺乏唯命是从的政治代理人。扶植一个依附于我们的亲美傀儡政府，让他们自己去为那些纠缠不清的社会乱麻发愁头疼，无疑是绝佳的选择。不过，无论前方是通往全面吞并的扩张之路，还是设立保护国的傀儡方案，这一切最终仍需提交国会进行辩论与裁决。"
 USA.1345.a:0 "从今以后不再会有墨西哥这个国家了"
 USA.1345.b:0 "给忠诚的古斯塔沃·奥尔达斯一点甜头，授权他组建墨西哥政府"
 USA.1345.c:0 "乔治·巴顿确实是一个天才，可惜他太叛逆了，让他去墨西哥历练历练吧"
 USA.1345.e:0 "忠诚的奥马尔·布拉德利将军会成为墨西哥新的统治者"
 USA.1345.f:0 "让我们与德国的血亲一道统治墨西哥"
#内战相关
USA.1500.t:0 "与华盛顿和解？"
 USA.1500.d:0 "“暴君”麦克阿瑟做出了他最不可能做出的选择，宣布不再担任美国总统。因此，关于我们是否应该重新融入合众国的辩论正激烈展开。许多议员相信尽管麦克阿瑟同意放弃权力，他仍然对美国政局保有控制权，如果形势未能按照他所期望的方向发展，麦克阿瑟无疑会重新夺权。"
 USA.1500.a:0 "让我们与华盛顿重修旧好（游戏结束）"
 USA.1500.b:0 "我们才是真正的美国，只有我们能把美国团结起来！"
 USA.1501.t:0 "美国重归统一！"
 USA.1501.d:0 "西部诸州的反叛政府决定放下武器重新加入美利坚合众国，落基山脉沿线的军事检查站正陆续拆除，来自两边的人民自由地在边境上流动穿梭。历经漫长的斗争，这座国家终于重归统一。"
 USA.1501.a:0 "从大海到闪亮的大海！"
 USA.1502.t:0 "拒绝和解"
 USA.1502.d:0 "麦克阿瑟将军主动放权，曾短暂地使许多人产生合众国行将统一的念想。遗憾的是，西部叛乱政府似乎决心与我们对抗到底。太平洋国参议院公然抨击华盛顿国会不过是麦克阿瑟的傀儡，道格拉斯将军无私地为我们的国家奉献了一切，他们竟然还要将他视作“暴君”！"
 USA.1502.a:0 "美国终将恢复统一"
 USA.1503.t:0 "大迁徙"
 USA.1503.d:0 "鉴于麦克阿瑟将军拒绝放弃权力，许多美国人踏上前往[migrate.GetNameDef]的道路——毫不在意这座国家正侵占着美国领土，亵渎我们的国旗与珍视的一切。现在的问题在于，我们应该如何应对这种“大迁徙”呢？是让这群叛徒自由地离开，前往敌国面临安全风险，还是动用军队逮捕和“挽留”尽可能多的迁徙者？"
 USA.1503.a:0 "他们逃不掉的"
 USA.1503.b:0 "随他们去吧"
 USA.1504.t:0 "逃离麦克阿瑟的难民"
 USA.1504.d.let_go:0 "不出所料，暴君道格拉斯·麦克阿瑟拒绝放弃他的权力。正因如此，一大批美国人正跨越[Root.GetAdjective]边境，希望脱离麦克阿瑟将军的阴影寻找新的生活。此外，部分军方人士相信我们将能从中取得有价值的情报，并利用它们来对付[USA.GetNameDef]。既然如此……"
 USA.1504.d.army:0 "不出所料，暴君道格拉斯·麦克阿瑟拒绝放弃他的权力。正因如此，一大批美国人正跨越[Root.GetAdjective]边境，希望脱离麦克阿瑟将军的阴影寻找新的生活。当我方收容人员与特种部队尽其所能地挽救他们时，麦克阿瑟却动用军队像屠夫一般杀死了许多无辜的难民，这只会激起人们希望看到麦克阿瑟受到惩罚的愿望。"
 USA.1504.a:0 "欢迎来到[Root.GetNameDef]！"
 USA.1505.t:0 "[FROM.GetNameDefCap]索要新英格兰"
 USA.1505.d:0 "内战结束后，[From.GetNameDef]已经决定要求新英格兰回归。为保护我国利益，我们曾介入新英格兰地区的紧张局势。然而，随着[From.GetNameDef]在内战中获胜，作为美国的合法继承者，他们要求收回新英格兰，并委托大使强调，如果我们拒绝他们的合理要求，可能导致两国间爆发冲突，对此我们该作何回应呢？"
 USA.1505.a:0 "这不值得冒险……"
 USA.1505.b:0 "我们不能把新英格兰托付给他们"
 USA.1506.t:0 "新英格兰回归美国"
 USA.1506.d:0 "加拿大政府表示，占领新英格兰只是为了阻止工团主义侵入该地，如今威胁已除，加军已撤出波士顿等新英格兰各城。新英格兰终于与美国团聚了。"
 USA.1506.a:0 "上帝保佑美国！"
 USA.1507.t:0 "加拿大拒绝"
 USA.1507.d:0 "加拿大政府通知我国大使，他们无意交还新英格兰。此举导致国会内部有许多人呼吁发动战争收复我国合法领土，那么我们应该马上宣战吗？"
 USA.1507.a:0 "既然如此，那就来场轰轰烈烈的战争！"
 USA.1507.b:0 "我们应该等待机会"
 USA.1508.t:0 "[FROM.GetNameDefCap]索要阿拉斯加"
 USA.1508.t.attu:0 "[FROM.GetNameDefCap]索要阿图岛"
 USA.1508.d:0 "内战结束后，[From.GetNameDef]已经决定要求阿拉斯加回归。为保护我国利益，我们曾占据阿拉斯加地区。然而，随着[From.GetNameDef]在内战中获胜，作为美国的合法继承者，他们要求收回阿拉斯加，并委托大使强调，如果我们拒绝他们的合理要求，可能导致两国间爆发冲突，对此我们该作何回应呢？"
 USA.1508.d.attu:0 "内战结束后，[From.GetNameDef]已经决定要求阿图岛回归。为保护我国利益，我们曾占据这座太平洋岛屿。然而，随着[From.GetNameDef]在内战中获胜，作为美国的合法继承者，他们要求收回阿图岛，并委托大使强调，如果我们拒绝他们的合理要求，可能导致两国间爆发冲突，对此我们该作何回应呢？"
 USA.1508.a:0 "我们应该归还它"
 USA.1508.b:0 "我们不应该归还它"
 USA.1509.t:0 "阿拉斯加回归美国"
 USA.1509.d:0 "加拿大将阿拉斯加还给了[Root.GetNameDef]。"
 USA.1509.a:0 "上帝保佑美国！"
 USA.1510.t:0 "加拿大拒绝"
 USA.1510.d:0 "加拿大拒绝归还阿拉斯加，我们该如何表态呢？"
 USA.1510.a:0 "我们不能冒险开战"
 USA.1510.b:0 "这将引发一场战争"
 USA.1511.t:0 "美国希望夏威夷回归"
 USA.1511.d:0 "美国人派遣大使要求夏威夷重新回归美国，并表示如果我们拒绝，美国海军的舰队将前来收复国土。对此我们该作何决断呢？"
 USA.1511.a:0 "加入美国（游戏结束）"
 USA.1511.b:0 "拒绝加入美国"
 USA.1512.t:0 "夏威夷回归美国"
 USA.1512.d:0 "夏威夷政府投票决定重新加入美国"
 USA.1512.a:0 "上帝保佑美国！"
 USA.1513.t:0 "夏威夷拒绝回归美国"
 USA.1513.d:0 "夏威夷政府决定不回归美国。华盛顿的一些人认为再一次占领夏威夷以保证我们的利益比较稳妥。而另一些人认为要是夏威夷人不乐意的话，任何形式的占领都会是我们的一场噩梦。我们应该怎么办？"
 USA.1513.a:0 "这将引发一场战争"
 USA.1513.b:0 "让他们走吧"
 USA.1514.t:0 "美国希望德克萨斯回归"
 USA.1514.d:0 "美国人派遣大使要求德克萨斯重新回归美国，并表示如果我们拒绝，美国陆军将前来收复国土。对此我们该作何决断呢？"
 USA.1514.a:0 "重新加入美利坚（扮演合众国继续游戏）"
 USA.1514.b:0 "岂能给他们再甩我们一次的机会。"
 USA.1515.t:0 "德克萨斯回归美国"
 USA.1515.d:0 "德克萨斯政府投票决定重新加入美国。"
 USA.1515.a:0 "联盟永存！"
 USA.1516.t:0 "德克萨斯拒绝回归美国"
 USA.1516.d:0 "德克萨斯政府决定不回归美国。"
 USA.1516.a:0 "这将引发一场战争"
 USA.1516.b:0 "让他们走吧"
 USA.1517.t:0 "对军工企业的审判"
 USA.1517.d:0 "不少军工企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 USA.1517.a:0 "允许他们再度开张"
 USA.1517.b:0 "叛徒不配得到赦免"
