 USA.808.t:0 "第三次大会演讲"
 USA.808.d.pp:0 "在照相机的闪光灯和支持者的欢呼声中，大会逐步走入尾声。平民党的最后竞选纲领将被敲定，而在最后的演讲中，两派都将竭尽全力为自己争取到最后的政治优势以让己方能够获得最终总统候选人提名。对于种族政策，双方都宣布将终结种族隔离制度并在美国建立真正的平权社会。尽管立场相近，但民粹派认为种族和解与平权需要时间来缓步推进，毕竟美利坚的种族撕裂的现状与裂痕仍需要时间修复，同时民粹派也需要维护自己阵营中的一些南方支持者的青睐。相反，在左派中，种族社区自治理念占据了上风，同时他们要求大跨步的在胜选后就立刻对如今的种族政策做出调整以解放有色人种。此外，对于国内安全政策，以朗为首的民粹主义者呼吁在全国范围内打击准军事组织并大力支持扩张国民警卫队。由于一分钟人在过去三年内组织架构遭到了毁灭性打击，如今已经完全不成组织，朗则转向彻底禁止民兵与准军事组织以确保不会有暴力团体继续危害社会秩序。然而，左派则对国民警卫队乃至整个美国的武装力量持不信任态度。过去美国暴力机器对社会党的所作所为驱使这如今的左派更加倾向恢复赤卫队与民兵等军事组织以维护平民党不受政府中的保守主义者尤其是军队的威胁。\n\n作为发言者，古斯·霍尔向在场的媒体与听众进行了激昂的演讲，并宣称里德一定会领导平民党取得胜利。而作为民粹派的发言人，休伊的兄弟厄尔·朗则用最为亲民且平直的话语号召所有为美国而奋斗的公民们支持他的兄弟与他的事业。在喧闹声与欢呼声中，大会决定了最后的平民党竞选纲领..."
 USA.808.d.npp:0 "在照相机的闪光灯和支持者的欢呼声中，大会逐步走入尾声。国家人民党的最后竞选纲领将被敲定，而在最后的演讲中，众多派都将竭尽全力为自己争取到最后的政治优势以让己方能够获得最终总统候选人提名。对于种族政策，唯一的共识是所有派系都宣布将终结第十五修正案并让美国成为纯净的种族国家。然而，民族派要求将所有非盎格鲁-撒克逊人都赶出美国，或者投入集中营进行彻底的苦役劳动。而毫无疑问，有色人种将受到最为严酷的种族政策迫害。而其他两派则都是宣布要强化种族隔离，只是默里派也呼吁保卫土著的合法权利。此外，对于国内安全政策，民族主义者们要求强化准军事组织的地位并使用武装民兵保卫政权，而其他派系则要求强化国民警卫队力量，并加大地方警察部门的开支。\n\n在演讲中，政治学家和白人至上主义者洛思罗普·斯托达德向听众们宣扬了种族卫生科学与白人至上主义的思想，其夸张的言辞与具有感染力的演说引来了不错的反响。小理查德·罗素作为温和派的最大候选者也走上台前，向支持者们进行了演说。他的政治声望也为他带来了不错的反响。最终，查尔斯·林德伯格，这位“孤独的鹰”走上讲台进行了最后一场演讲，为圣路易斯大会收官。在喧闹声与欢呼声中，大会决定了最后的国家人民党竞选纲领..."
