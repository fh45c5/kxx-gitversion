 POLITICS_RONALD_REAGAN_DESC:0 "罗纳德·里根在伊利诺伊州的农村长大，他首先以舒缓的声音和诙谐的个性吸引了公众的目光，最终成为一个独特的魅力人物，许多美国人都会不时地收听。在第二次美国内战爆发后不久，里根就会发现自己日复一日地站在麦克风的前端，向美国的忠诚男女广播，为联邦前线的士兵提供安慰。在这么短的时间内，这位广播明星的声望急剧上升，战争结束后，他将作为一个“人民的男人”和美国坚持不懈地反对极端主义的坚定提醒者，一路乘着他的名气来到椭圆形办公室。"
 POLITICS_JACK_REED_DESC:0 "作家，工会领袖，参议员，旅行家，工团主义者——约翰·“杰克”·里德这个名字意味和众多标签相匹配。在他的先辈，亚历山大·别尔克曼去世后，这位热情洋溢的激进社会主义者接手了无序的美利坚工团主义运动，并带领这个团体获得了极大地成功。尽管这条“从旅者到总统”的漫漫长路为他带来了许多仇敌，但同样也让他结交了许多友人。他立志将已故主席海伍德的声望与欧洲第三国际丰富的社会主义、工团主义理论相结合，成为一位富有人格魅力、能将工团主义活动者团结起来、将祖国带入一个完美社会的人。"
 POLITICS_JOHN_NANCE_GARNER_DESC:0 "约翰·南斯·加纳四世，被他的同行称为“仙人掌杰克”，是一名律师，长期担任德克萨斯州的议员，也是美国的新总统。他是一位民主党的建制派，一个温和的保守派政治家，最重要的是，他是民主的狂热支持者。这位德克萨斯州的法官认为没有理由向左派或右派妥协。"
 POLITICS_HERBERT_HOOVER_DESC:0 "赫伯特·克拉克·胡佛是美国的第三十任总统。然而，在成为总统之前，他以工程师、商人，以及佛兰德斯-瓦隆救济委员会的负责人的身份而著称。除了上述记录外，他还因两次试图成为共和党总统候选人未果而闻名，1920年他输给了伦纳德·伍德，1924年又输给了欧文·伦罗特。而这两位共和党人后来也都在竞选中失利，分别输给了伍德罗·威尔逊和A·米切尔·帕尔默。1928年，胡佛作为党内保守派和自由派之间的妥协选择而成为共和党提名人。在胡佛赢得1928年大选后，共和党人无不弹冠相庆，但他们可开心不了多久。时值美国经济颓靡未振，摧残农业之巨灾绵延至今。1928年，胡佛进行了一部分政治调整，重新合法化了美利坚社会党，这却反倒让工人罢工的情况愈演愈烈，谈判的失败更使美国的工业逐步陷入停顿。胡佛积极干预经济和增发国债的政策也在改善整体状况方面没有取得什么成效。在1932年，胡佛再次胜选，但这一次可没什么人庆祝，因为这次胜利来自于众议院的钦定，这让他成为了大概是美国最受鄙视的总统。从民主党到旧民主党、从美利坚社会党到美利坚至上党，人人如今都称他为“失败的人道主义者”。"
 POLITICS_HERBERT_HOOVER_2_DESC:0 "赫伯特·克拉克·胡佛是美国的第三十任总统，其于1936年大选爆冷连任，成了二十世纪第二位打破两届任期传统之人。胡佛现在守卫着一个正处于另一场内战边缘的国家。尽管在过去两届任期内他做出了所有的经济干预措施，但对美国来说并没有什么作用。按照一些人，包括他的新副总统的评论，还实际上使问题变得更糟了。胡佛今坦承国家岌岌可危之境，遂纳副总统诺克斯、新晋内阁、道格拉斯·麦克阿瑟将军和J·埃德加·胡佛局长等诸顾问之谏，冀共解美利坚深陷之经济、社会、政治三重危机。"
 POLITICS_HERBERT_HOOVER_3_DESC:0 "赫伯特·克拉克·胡佛是美国的第三十任总统，也是二十世纪第二位连任三届的总统。许多人认为，当胡佛在1936年当选时，美国将永远被摧毁，而在那个任期内，从各个方面来看，毁灭看起来似乎确实是不可避免的。然而，对许多美国人来说，唯一重要的是，最终，毁灭并没有到来。胡佛之民望自众望所归跌入千夫所指，终复归万民景仰。往昔任期之失与三十年代风雨俱往，胡佛率内阁瞻望前程，欲以余下任期再铸伟业。过去的三届任期使胡佛衰老如斯，以至于公众用来描述胡佛的称呼现在成了“伟大的老人”。"
 POLITICS_FRANK_KNOX_DESC:0 "弗兰克·诺克斯现在是美国总统。诺克斯因在美西战争期间在美军服务而闻名，他在前总统西奥多·罗斯福手下的义勇骑兵团中服役。军旅之外，诺克斯所掌的中西部报业集团亦声名赫赫。今执美利坚权柄、以反孤立国际主义者自居的诺克斯，迥异于前朝三十载孤立故辙，力图整备国家以应万变。"
 POLITICS_DOUGLAS_MACARTHUR_DESC:0 "年轻的道格拉斯·麦克阿瑟是美军中将和内战老兵亚瑟·麦克阿瑟的儿子，他从小就为服兵役做好了准备。道格拉斯自小就因教育而对西部地区的平民怀有关切，在西点军校受到的欺凌又让他憎恨起南方佬，但最终他成为了一名优秀的士兵。在菲律宾服役，在日本担任外交职务，以及在墨西哥化解了潜在的战争后，麦克阿瑟成为了菲律宾陆军元帅。菲律宾的战略重要性将麦克阿瑟捧入了华盛顿政坛，为他带来了一批盟友和相应的对手。尽管他坚决否认自己是个政治家，但他与胡佛、保守的民主党人和威廉·赫斯特关系良好。尽管偶尔他会表达对民粹主义者詹姆斯·考克斯的崇敬之情，但麦克阿瑟也乐意使用致命的武力来对付社会主义者、民粹主义者以及其他一切导致华盛顿政治局面陷入僵持的势力。"
 POLITICS_DOUGLAS_MACARTHUR_TWO_DESC:0 "年轻的道格拉斯·麦克阿瑟是美军中将和内战老兵亚瑟·麦克阿瑟的儿子，他从小就为服兵役做好了准备。道格拉斯自小就因教育而对西部地区的平民怀有关切，在西点军校受到的欺凌又让他憎恨起南方佬，但最终他成为了一名优秀的士兵。在菲律宾服役，在日本担任外交职务，以及在墨西哥化解了潜在的战争后，麦克阿瑟成为了菲律宾陆军元帅。菲律宾的战略重要性将麦克阿瑟捧入了华盛顿政坛，为他带来了一批盟友和相应的对手。尽管他坚决否认自己是个政治家，但他与胡佛、保守的民主党人和威廉·赫斯特关系良好。尽管偶尔他会表达对民粹主义者詹姆斯·考克斯的崇敬之情，但麦克阿瑟也乐意使用致命的武力来对付社会主义者、民粹主义者以及其他一切导致华盛顿政治局面陷入僵持的势力——他的部下一直以来都清楚这点，而他的敌人近来也完全明白了。但随着华盛顿政府落败，现在合众国只剩下了西部军指挥中心的残部，麦克阿瑟被迫流亡西部。他似乎变了一个人，眼里闪着新的光芒。他对叛国者的愤怒和极端民族主义因为在东部的失利而愈发深厚，现在他决心要赢得战争，为此不惜一切代价……"
 POLITICS_WILLIAM_D_LEAHY_DESC:0 "威廉·D·莱希，出生于1875年，在中西部长大，在一个充满激进主义者、革命者和暴君的国家中，他可能显得格格不入。然而，当莱希雄心勃勃地爬上美国海军的行列时，他始终保持对国家的忠诚。与他的军友们一样，莱希对美国日益混乱的局势感到不安，当道格拉斯·麦克阿瑟政变推翻政府时，莱希保持沉默。然而，随着麦克阿瑟开始镇压国会和美国海军，将他的意志强加给这两个团体，莱希对美国的恺撒变得越来越不满意。当情况失去控制，麦克阿瑟的行动威胁到战争胜利时，莱希决定是时候采取行动了。现在，在海军政变之后，莱希领导着一个四分五裂的政府和一个人民流离失所的国家，陷入一场似乎无法取胜的冲突。尽管如此，莱希在华盛顿和西方都有朋友，他对民主的承诺使许多原本对麦克阿瑟的领导感到疏远的人感到舒畅。凭借严峻的决心和敏锐的头脑，莱希将不惜一切代价为他饱受打击的国家恢复民主。"
 POLITICS_ERNEST_J_KING_DESC:0 "当道格拉斯·麦克阿瑟在华盛顿掌权时，他没有预料到一位海军上将可能带来的危险，然而事实证明欧内斯特·约瑟夫·金上将是麦克阿瑟灭亡的原因。金，一个才华横溢而又傲慢的人，对海洋和天空都充满了热爱，这几年的表现可圈可点。他的职业生涯似乎相当不起眼，直到1930年代中期，金与其他许多军官一起被提拔，以帮助处理国内日益增长的极端主义运动。然而，金认为民主本身就是国家陷于困境的原因，当麦克阿瑟上台后，他站在了麦克阿瑟一边。当麦克阿瑟开始凌驾于美国海军，甚至金本人之上时，这一步就走得太远了。金认为麦克阿瑟忽视了海军，损害了为战争做出的努力，并对一个陆军人士的控制感到不满，于是他领导了一场反对政府的政变。现在他管理着这个国家，金有很多计划。首先，对美国海军的大量投资正是金认为赢得战争所需要的。不过，当这一切完成后，金对美国有进一步的计划。最重要的是，他希望看到美国在世界上占据应有的地位，要这样做，他非常愿意对抗潜在的对手，特别是旧协约国的残余。"
 POLITICS_HUEY_LONG_DESC:0 "在这个政治路线往往由严格的意识形态去定义的世界里，人们可能会认为像休伊·朗这样的人在其中没有一席之地，但朗通过自己的职业生涯证明了这个看法的错误。\n\n休伊·朗出生在路易斯安那州北部的一个小村庄，从小穷困潦倒，难享安乐。在当选州长后，他向人民展示了自己并未忘根。通过众多的社会项目，朗把最贫穷的美国人的利益置于一切之前，而正是因此，当情况需要时，他也毫不犹豫地采用难上台面的手段。朗遭到了建制派的强烈反对，被视为最危险的煽动家、独裁者和腐败民粹主义者。作为回应，“王鱼”成立了自己的政党——美利坚至上党，一个基于实用主义的爱国民粹主义党派，以“分享财富”计划为其主要纲领。至上党跳出了传统的意识形态分类体系，将左翼进步派和右翼基督教民粹主义的保守派聚集在一个旗帜下，依靠对王鱼的忠诚和对被他们认为背弃美利坚精神的社会主义者的反对而团结在一起。\n\n在忠诚的“一分钟人”和美国平民们的陪伴下，朗领导着一个庞大的民粹主义联盟，端坐于笼罩整个中西部的巨大政治机器顶端，决心以自己的愿景重塑美国和其民主制度——无论付出何种代价。"
 POLITICS_HUEY_LONGDONG_DESC:0 "当美利坚联盟国政府陷落时，休伊·朗勉强逃脱了追捕。多亏了我们的迅速行动才拯救了他。他不满足于消失在历史的尘埃中，选择出现在我们的首都，承诺利用他的政治才能和魅力帮助进步党继续执政十年或更长时间。他已经放弃了他以前的许多信仰，投向了更为主流的进步党平台，但仍然坚持自己的“分享财富”计划。朗的承诺相当诱人，他的能力也一目了然，不过我们必须密切关注他……"
 POLITICS_FLOYD_OLSON_DESC:0 "尽管弗洛伊德·奥尔森在农村长大，但他通过旅行和活动，看到了美国的巨大多样性。在20世纪20年代，他成为了一名装卸工并加入了世界产业工人联盟，最后他成为一名律师，这把奥尔森推向了进步主义。1924年选举后，奥尔森加入了罗伯特·拉福莱特的进步党。为了给进步党争取盟友，奥尔森在接下来的十年里不知疲倦地工作，只是在1930年因胃溃疡而停下来接受治疗。作为一位有惊人影响力的明尼苏达州州长和一位全国性的和平倡导者，这使他因民主共和两党反对激进主义的立场而进入白宫。"
 POLITICS_QUENTIN_ROOSEVELT_DESC:0 "昆汀·罗斯福是前总统西奥多·罗斯福最小的儿子，他早年被他父亲培养为共和党的政治活动家。然而，昆汀希望成为一名飞行员，并在1918年的一次训练中受伤。近年来，再看到他的家庭和祖国的分裂后，昆汀进入了政界，并在1936的命运之年担任了纽约的参议员。现在，国家的大灾难已经结束，昆汀的计划是追随他父亲的脚步，推动美国新的公平施政。"
 POLITICS_ALF_LANDON_DESC:0 "阿尔夫·兰登早在进入政界之前，就已经是石油行业的成功企业家。这种自我激励导致了“联邦石油与天然气协会”的建立，这是一个和标准石油公司有关的游说团体，兰登至今仍与之有联系。在选举日之前的最后一刻，他打破胡佛的不干预主义立场，这起初看起来是一个糟糕的决定，但后来共和党也支持他，这就变成了他的优势。甚至胡佛也勉为其难地来支持兰登，尽管他个人背叛了信任。现在，虽然兰登举止谦逊，但他已被证明为美国人想要的自信的经济复苏发出了柔和的声音。尽管他与石油游说集团的紧密联系使他成为社会主义者和朗派的敌人。"
 POLITICS_WENDELL_WILLKIE_DESC:0 "温德尔·威尔基在担任总统之前的一生中经历了许多事情。他一开始是威廉·詹宁斯的粉丝，一个具有民粹主义思想的民主党人。他在大学里成为一名社会主义者，而且一直有传言说他在1933年对中国进行外交访问期间勾引了宋美龄。更不用说与作家伊丽塔·范·多伦的恋情了。当大萧条来临时，他反对民主党人推动银行假期，从而一举成名。这种对金融机构的支持以及他关于政府援助不应干涉市场竞争的主张使他在竞选中脱颖而出。还有他对整合公务员制度和武装部队的支持，这使他与许多其他民主党人产生了分歧。这个多才多艺的人是否能胜任总统的诸多职责，还有待观察。"
 POLITICS_HARRY_BYRD_DESC:0 "许多南方民粹主义者被休伊·朗的魅力所迷惑而抛弃了民主党，而哈里·F·伯德却坚持自己的立场。哈利·伯德出生于弗吉尼亚的一个婆罗门家庭，与美国革命有着直接的联系。他是种族隔离政策和支持减少国债的财政保守政策的坚定信仰者。哈里·伯德坚持他的反凯恩斯主义政策，作为美国传统建制派的稳定形象而获胜。"
 POLITICS_PHILIP_FOLLETTE_DESC:0 "作为一名专业的威斯康星州进步派人士，菲利普·拉福莱特是政治上活跃的拉福莱特家族中最成功的一个。他是弗洛伊德·奥尔森的朋友和前导师，出于继续帮助他所在州的需要，他被说服加入了农工党。由于菲利普的父亲罗伯特所代表的孤立主义势力，菲利普还是支持在美洲建立强大的军队，以及农工党所提倡的大政府的全范围管控。"
 POLITICS_HENRY_WALLLACE_DESC:0 "作为爱荷华州农民的卑微出身并没有阻止年轻的亨利·华莱士去游览世界和获得世俗的洞察力。他的财富来自于杂交玉米品种的发明，这一重大创新使华莱士得以环游世界。亨利访问了印度，认识了神智学，这是一个在俄罗斯流行的印度教思想流派，吸取了基督教无政府主义和社会主义的元素。这些教义最终使他疏远了主流社会主义，并在他回国后将他推入了农工党。华莱士把自己描绘成一个务实的经济学家和能够进行美国所需的农业改革的专家。"
 POLITICS_JAMES_MURRAY_DESC:0 "詹姆斯·E·默里在竞选中的当选引发了巨大的争议。小报和共和党人都冲着默里来，声称他由于出生在加拿大而不能参加总统竞选。这些说法的真相可能永远不会被知道，但他在就读纽约大学之前的生活却笼罩在神秘之中。当默里在1933年赢得蒙大拿州的州长职位时，他的生活才真正开始。他作为民主党人时任期的特点是与工会的友好关系和互相合作，以及他大胆地认为，如果市场失灵，经济改革一定会扰乱市场。"
 POLITICS_ALBEN_BARKLEY_DESC:0 "除了有民主党三十多年的从政经验外，阿尔本还有着自己的一套判断准绳。虽然阿尔本支持威尔逊的改革，但他反对麦卡杜推翻这些政策的企图。在经历了几次全国性选举的失败和稳定的投票记录后，阿尔本成为这次选举中棋盘上正确的棋子，为民主党人赢得了白宫。"
 POLITICS_RICHARD_RUSSELL_DESC:0 "小理查德·拉塞尔最终入主白宫是一场漫长政治角逐的点睛之笔，这场角逐甚至在其加入民主党之前就已经开始了。为此，拉塞尔在美国海军、佐治亚州众议院和美国国会积累了足够多的头衔，以确保获得普遍的尊重。他的观点是，种族隔离的消除需要完全按照南方风格来进行，这一点被证明很受全国民众欢迎。时间会告诉我们这一立场是否可以持续。"
 POLITICS_GLEN_TAYLOR_DESC:0 "成为总统对格伦·泰勒和投票的公众一样是一个惊喜。这个曾一度想成为一名流浪的传教士，后来又想成为一名乡村歌手的人，终于达到了与他的技能相称的位置。泰勒在国会以富有同情心的经济学家和进步政策的倡导者而闻名，并在国会大厦的台阶上为儿童唱歌。泰勒的同情心使他反对种族隔离，尽管他的性格古怪，但他使美国人民喜欢上了他，这是他所希望的。"
 POLITICS_THOMAS_DEWEY_DESC:0 "托马斯·埃德蒙·杜威于1902年3月24日出生于密歇根州的奥瓦索市。在密歇根大学读书期间，杜威曾一度考虑过做一名歌手，但咽喉疾病很快让他意识到这条路风险颇高，于是他转而研习法律，并以此在纽约城扎下了根。在做联邦检察官期间，杜威为黑帮大佬威克西·戈登辩护的经历让他在30年代名声大噪。凭借着出众的记忆力，杜威利用他记下的无数犯罪细节和电话窃听内容剿灭了一个又一个的犯罪组织。杜威为人诚实，做事高效，从政期间一直致力于消灭就业中的种族歧视现象、提高国家教育补助与工薪阶层的工资。"
 POLITICS_EARL_WARREN_DESC:0 "年轻的厄尔·沃伦认为，当他的父亲马蒂亚斯因参加罢工而被列入黑名单时，他的事业就注定要失败，但这反而促使这个年轻人超越了这个耻辱。这之前的污名促使厄尔加入了许多兄弟会和分会，以便与那些侮辱他父亲的人打交道，并在军队服役。这些关系得到了回报，使厄尔进入了公共服务部门，并最终在1932年坐上了加州州长的位置，在那里，他引导着衰落的进步运动脱离更衰弱的西海岸社会主义政党，走向了政治中心。厄尔成为了共和党内的进步主义者，在全国范围内推动废除种族隔离制度。"
 POLITICS_CHARLES_MCNARY_DESC:0 "1936年，当共和党受到来自各方面的攻击时，查尔斯·麦克纳里站在共和党的背后支持他们。麦克纳里内心是一个进步主义者，但也是一个实用主义者，他在党内被视为防止西北地区陷入激进主义的保险，这也使他成为协约国在北美的利益盟友。事实上，由于这种关系，他的公司在20世纪40年代为加拿大西部的很大一部分地区提供电力。"
 POLITICS_HARRY_TRUMAN_DESC:0 "哈里·杜鲁门的务农生涯在大萧条开始之前便已经结束了，而后来的生意也因为沙尘暴的缘故惨遭破产。二十年代末，杜鲁门初涉政坛，为农民争取福利，隶属于堪萨斯城的彭德格斯特集团。1938年，杜鲁门进入参议院，并在审计并消灭重建期间的浪费现象一事上展现出了自己的真才实学，令同僚们惊讶不已。杜鲁门还提出了许多有利于城乡居民的法案，并因此一跃成为了民主党中选民评价最高的人。如今，赢得了大选的杜鲁门正准备以全所未有的方式帮助美国、帮助世界。"
 POLITICS_STROM_THURMOND_DESC:0 "斯特罗姆·瑟蒙德决定把《保守派宣言》变成民主党保守派的纲领，这是一个冒险的举动。斯特罗姆在民主党内花了几十年时间，试图反对联邦政府过度扩张的权力，并确保该党从未正式认可取消种族隔离制度。这场赌博现在得到了回报，斯特罗姆·瑟蒙德当选成为总统。"
 POLITICS_HAPPY_CHANDLER_DESC:0 "哈皮·钱德勒职业生涯的转折点是在他成为棒球专员的政治间歇期。担任州长一职使钱德勒成为一个受人尊敬、勤奋的民主党人，并牢牢把握着党的路线。在担任棒球专员期间，做出了允许融合棒球队的历史性决定，这导致了种族隔离在棒球的结束。这只是进一步提高了钱德勒作为参议员的地位，并使他决定将这种支持带入民主党的保守派中，这一点更为重要。他坚持认为财政保守主义和种族问题毫无关联，这与斯特罗姆·瑟蒙德的路线相悖。"
 POLITICS_JOHN_BRICKER_DESC:0 "约翰·布里克是有限行政权力和不干预主义的倡导者，他是一个老式的共和党人。布里克在担任总统之前的职位是共和党内的反对派和异议人士，他抨击涉嫌同情社会主义的人，反对使用行政权力来推动经济改革。他认为整个国家在几年前就已经十分接近民粹主义或专制主义的独裁了。"
 POLITICS_HAROLD_STASSEN_DESC:0 "当威尔基和杜威等共和党高级领导层在20世纪30年代忙于处理1936年危机的细枝末节时，哈罗德·史塔生正在美国海军中服役，接触更广阔的世界。史塔生学到的重要一课是，相对于他的共和党同僚所推崇的关税而言，他意识到国际合作的重要性。作为国际工团主义的坚定反对者，史塔生认为自由放任的经济政策必须被战略经济合作所取代，没有必要坚持不民主的制度，如隔离制度，这只会助长工团主义的观点。"
 POLITICS_ADLAI_STEVENSON_DESC:0 "阿德莱·史蒂文森的父亲，他作为孤立主义者的声望遗产，在阿德莱·史蒂文森二世的政治生涯中一直困扰着他儿子。他在民主党的这一立场受到了美利坚至上党的挑战，该党的势力受到削弱。在这个最有争议的时期，阿德莱坚守自己的底线，坚持不懈。作为伊利诺伊州州长，阿德莱改革了警察部队，以减少与社会主义者的冲突，甚至在面对红色恐怖时捍卫了他们的组织权利。大多数人怀疑阿德莱是否有能力战胜德高望重的艾森豪威尔将军，但通过社会主义选民的善意支持，阿德莱最终获胜。"
 POLITICS_JOHN_SPARKMAN_DESC:0 "约翰·斯帕克曼出生在一个木屋里，在一个农场里长大，他的成长经历十分亲民。在经历了迅速上升的法律和政坛生涯之后，斯帕克曼成为亨茨维尔的民主党代表。他的胜选在决定命运的36年尤为重要，因为他击败了美利坚至上党的候选人。斯帕克曼在向南方移民和开放妇女教育方面发挥了作用。斯帕克曼对社会问题总是保持沉默，并因支持科学教育而得到支持，他公开反对防御性的美国外交政策，并最终加入了宪法党，他的声誉使他走上了通往总统职位的终南捷径。"
 POLITICS_WARROOM_DESC:0 "“将军们！你们不能在这里吵架，这里是指挥所！”\n\n在美利坚合众国垮台后，为维持军队的忠诚，一个由美国将军组成的军事委员会不得不匆忙地站出来维护国家秩序。然而，由于持续不断的地方冲突和冗余的官僚机构，军队和政府均是组织混乱、效率低下。"
 POLITICS_EARL_KEMP_DESC:0 "厄尔·坎普·朗生于1895年，是已故领袖叛军休伊·朗的弟弟。厄尔继承了他哥哥的道路，成为了一名进步派改革者，他在南方各州的竞选纲领是免费提供学校午餐、建设公共工程和少数民族权利。许多忠于他的兄弟的追随者认为，厄尔将会继续休伊所开启的事业。然而，另一些人则认为，在与合众国开战时，朗主义就等于已经输了。不管怎样，厄尔·坎普·朗的政治前途将由休伊的遗产所决定，除非他能凭借自己的力量闯出自己的名声。"
 POLITICS_FRANCIS_BLAIR_LEE_III_DESC:0 "弗朗西斯·普雷斯顿·布莱尔·李三世，生于1916年，是美国历史上一个重要的历史政治家庭——李氏家族的一员。他的父亲是马里兰州活跃的政治人物，而他本人是美利坚合众国的直接反对者。李在美国内战时声名鹊起，在肯塔基州和田纳西州边境的战斗中勇敢地与工团政权作战。他承诺会比联盟国有所进步，但也会为“迪克西人的价值观和迪克西人”而战。因此，李保持着他的可能有点过时的南方传统。"
 POLITICS_WILD_BILL_DESC:0 "威廉·约瑟夫·“狂野比尔”·多诺万出生于纽约水牛城，在哥伦比亚大学修学法律学。曾在墨西哥战役中服役于潘兴将军麾下，之后在麦克阿瑟将军麾下担任第42师上校。在第二次美国内战期间，多诺万仍然忠于美国，在与工团主义者和朗派的决战中表现出色。内战期间，多诺万被麦克阿瑟任命并效力于美国的准情报部门——黑室，他的密码破译工作为俘获几个重要派军首领提供了决定性帮助。现在，一向忠诚的多诺万在华盛顿的据点里领导着美国联邦领导层的最后残部。上帝保佑飞地！上帝保佑美国！"
 POLITICS_MACARTHUR_IV_DESC:0 "亚瑟·麦克阿瑟4世生于1938年2月21日，是道格拉斯·麦克阿瑟的独生子，伟大麦恺撒的合法继承人。即使这位小男孩过于年轻，无法正确地统治美国，但他已经被希望延续麦克阿瑟血统的忠诚派授予了国家元首的正式头衔。作为伟大的美国统一者的儿子，人们对年轻的麦克阿瑟寄予厚望。但这些期望能否兑现却还有待观察。"
 POLITICS_FORD_DESC:0 "亨利·福特于1863年7月30日出生在密歇根格林菲尔德镇的一座农场。他是一名成功企业家和商人，他的福特汽车公司将汽车引入了千家万户。由于福特在1936年之前就已打下深厚的权力基础，因此工团主义起义并没有严重伤害到他和他的产业，而福特的大部分设备得以用来帮助麦克阿瑟将军。美国解体之后，福特的商业帝国牢牢地掌握了五大湖地区的权力。如今，亨利·福特是旧工团政府中心地区的绝对统治者，他辽阔的商业帝国控制了旧美国的很大一部分。"
 POLITICS_CHARLES_CURTIS_DESC:0 "作为赫伯特胡佛的副总统，查尔斯·柯蒂斯是美国最引人注目的面孔之一。他的保护主义和在社会问题上的温和态度在正常时期会使他成为一个更可接受的选择，但现在不是正常时期。无论如何，随着时代的变化，查尔斯-柯蒂斯也发生了变化，他提出了一个解决国家面临的危机的计划。现在他是总统，柯蒂斯将试图既继承胡佛的遗产，又实施“自治谈判”，试图解决政治危机。在经济方面，新的关税和工作分担计划是柯蒂斯认为国家重新走上正轨所需要的。他作为美国第一位原住民总统的身份和他糟糕的健康状况同样在很大程度上被忽视了，人们的注意力反而放在了他的经济计划上。人民呼唤帮助，如果柯蒂斯不能解决他们的问题，国家将遭受巨大损失。然而，如果柯蒂斯确实成功地恢复了秩序，他将迎来一个新的繁荣时代，这将拯救共和党，并将他奉为美国历史上最伟大的总统之一。"
 POLITICS_INNSMOUTH_DESC:0 "查尔斯·邓恩是一名进步派商人，也是犹他州美利坚至上党的前负责人。邓恩于1872年出生在内布拉斯加，后来在犹他州定居并创办了一家成功的钢铁公司。在对民主党感到失望后，邓恩从路易斯安那州的休伊·朗的改革主义政策中得到启发并加入了美利坚至上党。邓恩以进步纲领竞选州长，却没有成功，而在美利坚联盟国发动全面叛乱后，他就与美利坚至上党断绝了所有关系。内战期间，邓恩支持合法政府，而在内战结束后，他以和平和福利为纲领参加竞选。厌倦了战争的犹他州人民投票给邓恩，让他实施进步改革，带领犹他州走上一条更亲民、更温和的道路。"
 POLITICS_THEREWILLBEBLOOD_DESC:0 "亨利·胡珀·布拉德于1872年10月1日出生在犹他州的凯斯维尔。他是一位著名的商人，在1933年成功竞选成为了犹他州州长。作为麦克阿瑟政权中的一个关键文职人物，布拉德成功地使他的管辖州超越了1857年之前享有的准独立地位。现在，只有时间才能证明这个新生国家的独立是否会比上一个国家更为稳固。"
 POLITICS_EZRABENSON_DESC:0 "本森于1899年出生在爱达荷州惠特尼的一个农场的摩门教家庭，后来于1939年被召为十二使徒定额组的成员。在获得特别许可后，他能够同时担任使徒和内阁成员，并在战时政府中任职农业部长。在其任期内，他强烈地反对再分配主义和政府援助，认为这是一种不道德的盗窃行为。在美国大崩溃之后，他向德撒律人民发表了建立一个不随意干涉基层的温和改良政府的承若，于是厌倦战争的民众便欣然将自己的票选投给本森。现在，本森的最大自由愿景将在整个德撒律上演，而且可能还会持续很长一段时间。"
 POLITICS_ROMNEY_DESC:0 "乔治·W·罗姆尼于1907年出生在墨西哥的摩门教聚落，他是一名成功的摩门教商人，也是一名反工团主义的政治评论家。在见证了英国和墨西哥的工团主义革命后，罗姆尼对工团主义意识形态产生了极大的厌恶。在第二次美国内战期间，罗姆尼担任联邦政府住房和城市发展部代理部长，他曾在联邦控制区进行巡回演讲，宣传工团主义的危险，并煽动民众支持这场战争。现在，他被任命为独立的德撒律的领导人，而他的反工团主义愿景将安全地引导他们走向未来。"
 POLITICS_HEBER_DESC:0 "希伯·格兰特，1865年出生于犹他州盐湖城，是后期圣徒教会（俗称摩门教）的主教。格兰特是一名使徒，在约瑟夫·F·斯密去世后，于1918年被召唤担任摩门教会的领袖。作为领袖，他领导了一项严格的禁酒令议程，禁止了复数婚姻，并与美国政府达成和解。在第二次美国内战期间，他敦促摩门教徒支持联邦政府，认为它是美国建立有序和道德社会的最佳希望。在美国大崩溃之后，以格兰特为首的摩门教掌握了统治权，重新建立了德撒律，成为一个独立的摩门教国家。摩门教徒再一次依靠他们对上帝的信仰，带领他们了走向更美好的明天。"
 POLITICS_REUBENCLARK_DESC:0 "J·鲁本·克拉克于1871年9月1日出生在犹他州的格兰茨维尔。最先是国务院的雇员，后来回到犹他州，担任第一任总统的第二顾问。1934年10月，克拉克被任命为使徒和十二使徒定额组的成员。内战期间，他提出了几项改革，集中并扩大了 摩门教的商业运作范围。美国大崩溃后，克拉克和格兰特将领导教会内部的对立派别。经过漫长而动荡的权力斗争，克拉克确保了他的权力，并领导教会接管了德撒律，恢复了秩序。现在他将着手带领德撒律走向未知的未来。"
 POLITICS_WARREN_HARDING_DESC:0 "沃伦·加梅利尔·哈定的形象可能并不适合担任总统，但这并没有阻止他登上这一权力之巅。\n\n乍一看，哈定似乎是一个典型的共和党人，他宣扬着小政府的优点和典型的自由市场经济，但将他局限于这一刻板形象显然太过愚蠢。哈定最初在他的家乡，俄亥俄州，因直言不讳地拒绝政治机器而声名鹊起，其观点通常比一般的保守共和党人更为进步，加上他与生俱来的魅力，当时的美国司法部长哈里·M·多尔蒂甚至称哈定“看起来就像一个总统”。作为俄亥俄州的参议员，哈定一直致力于反对在俄亥俄州极大普及社会主义理念的美利坚社会党。\n\n不幸的是，人无完人，而哈定的另一大特质便是各类丑闻层出不穷，从婚外情到其盟友的政治诡计无奇不有。尽管如此，沃伦作为总统的声望依旧不减，并打算利用总统的权力维护民主，确保美国梦的实现。"
 POLITICS_JAMES_EASTLAND_DESC:0 "詹姆斯·伊斯特兰是密西西比州三角洲地区一位检察官的儿子，为了经营种植园，他在前三十年里从未参与政治。他是股份制公司的倡导者，从他们的工作中获利，直到他的种植园规模翻了两番。伊斯特兰在参议员竞选中挺身而出，反对三K党的候选人，并赢得了胜利。面对保守派联盟，伊斯曼在家乡支持公平施政立法，同时在国会投票支持该法案。由于他的名声和在宪法党的经历很有分量，他成功地吸引许多民主党选民支持他的竞选，成为该党提名的最接近国家候选人的人选。"
 POLITICS_CHARLES_HALLECK_DESC:0 "查尔斯·亚伯拉罕·哈勒克于1900年8月22日出生在印第安纳州的迪莫特周边，与后来的许多政客类似，哈勒克的仕途始于法学。从印第安纳大学毕业并取得律师执照后不久，哈勒克就成为了印第安纳州第13区法院的一名检察官。1934年的中期选举结束还不到两周，新任的共和党代表还没来得及走马上任即意外去世，机缘巧合之下哈勒克被选中接替他的席位，由此，哈勒克正式步入了政界。二次内战爆发时，哈勒克刚落脚华盛顿两年，虽然资历尚浅，但他已经看透了时局：与激进分子的妥协说得好听点叫一文不值，难听点就是违背美国精神。这位年轻的代表起初坚决在战中支持联邦政府，但后来因反对紧急价格管控和配给制度而与当局分道扬镳，在哈勒克看来，美国人应“以上帝的愿旨生活”，而不是受某些华盛顿官僚的摆布。\n\n自始至终，哈勒克都自诩为坚定的保守共和党人，对党内东部的建制派和他们的温和化政策嗤之以鼻。哈勒克认为美国人打了两场内战可不是为了让政府“无微不至”地看管自己的日常生活的，他们是为了自由而战，为了随心所欲地生活而战，为了能在视人民自由至高无上的政府下安然生活而战。作为战后的新一代政治家，哈勒克总统清楚，自己的唯一使命就是保障美国未来几十年内的自由。"
 POLITICS_PAUL_DOUGLAS_DESC:0 "1892年生于马萨诸塞州的保罗·霍华德·道格拉斯早年坎坷，于1921年获哥伦比亚大学经济学博士学位后开启学术生涯。1915至1920年间，道格拉斯携同为博士学位的妻子六度迁居，二十年代后期返居马萨诸塞，同妻子离婚后重返芝加哥，渐涉政坛。\n\n1933年，道格拉斯力挺“芝加哥计划”，主张废除部分准备金制度以遏制私营银行货币印造，防范信贷危机再度引发大萧条。身为农工党盟友，道格拉斯以非社会主义者的身份成为市政政治领袖，任职战前末届市议会。临时工人代表大会解散市政府、建立芝加哥公社后，道格拉斯以平民身份滞留战时红区。\n\n道格拉斯虽持左翼立场，却常常批判社会党及世界产联之政策，故战后迅即通过政治改造。成为了联结芝加哥前社会主义群体与其所在的新民主党之间的关键纽带。任市议员数年后，道格拉斯赢得民了民主党参议员初选，并以煽动伤痕为径，终以黑马姿态胜出。\n\n位列自由派之主流的道格拉斯力倡政府干预与财政纪律并举，并因反对政治分赃、支持民权立法，被推举为潜在的总统人选。如今凭借着由前社会党人、前朗派、廉政自由派与进步派组成的多元联盟，道格拉斯终入主白宫——此或昭示内战裂痕终得弥合。"
 POLITICS_CORDELL_HULL_DESC:0 "生于田纳西州的科德尔·赫尔，自成年起即投身政坛。1906年，35岁的赫尔当选众议员，任职筹款委员会期间力推低关税与所得税政策，与南方同僚伍德罗·威尔逊、威廉·吉布斯·麦卡杜所见略同。\n\n经短暂淡出国会、任民主党全国委员会主席后，赫尔又获1928年民主党全国代表大会提名，并于同年当选参议员，跻身对外关系委员会之列。赫尔以外交手腕拓展美国对墨影响力，维系对德关系，终成民主党外交政策核心人物，更于1944年大选获党内提名。身为坚定的国际主义者，赫尔坚信美国应维系其国际地位。"
 POLITICS_SCOTT_LUCAS_DESC:0 "斯科特·卢卡斯出生于伊利诺伊州钱德勒斯维尔附近一个贫瘠的佃农家庭，其名源自民主党众议员斯科特·怀克。但真正将他引入政途的，是其兄长瑟曼·卢卡斯。怀克半工半读完成学业，于1914年毕业并在伊利诺伊州哈瓦那市开设律师事务所。短短数年间，这位“一流”的乡村律师便崭露头角，在1920年代担任了五年州检察官。\n\n1934年，当卢卡斯的政治偶像，民主党众议员亨利·T·雷尼逝世后，他在后续选举中成功接替其席位。在国会期间，他坚定支持民主党，既抵制日益壮大的农工党与社会党，又力主为工人和农民争取政府救济。内战爆发后，卢卡斯始终效忠联邦政府，并很快晋升至参议院。\n\n尽管民主党不乏候选人，但自由派阵营因胡佛时代及内战而元气大伤。随着卢卡斯当选，他们期待重振旗鼓。这位来自昔日激进中西部地区的杰出领袖，以劳工权利、政府扶持和非裔民权为纲领，力图使该地区重归温和理性的民主党自由派阵营。"
 POLITICS_WILLIAM_BORAH_DESC:0 "作为拓荒者的后代，威廉·博拉生于伊利诺伊州费尔菲尔德附近，并在当地接受教育。随着西进浪潮，他先后辗转堪萨斯州与爱达荷州新兴城市博伊西，最终在此定居并成为律师，投身州共和党政治活动。1896年，博拉与众多党内同僚背弃共和党候选人，转而支持威廉·詹宁斯·布莱恩的自由铸银纲领，这成为他日后一系列反叛党派领导层行为的开端。此后，他因在保罗·科科伦与比尔·海伍德两起独立谋杀案中对工会领袖的强硬起诉而声名鹊起。\n\n作为参议院中的进步派反叛者，博拉在1912年支持罗斯福而非塔夫脱，反对美国卷入欧战，并力主妇女选举权。他对威尔逊与胡佛政府的尖锐批评，使其在1920至1930年代屡次试图问鼎总统宝座，但直至1940年才如愿以偿：当建制派陷入混乱、全国弥漫激进情绪之际，博拉成功赢得提名，并凭借群龙无首的进步运动支持入主白宫。\n\n博拉代表着罗斯福式进步主义的最后辉煌。尽管反对民主党的经济政策，但他主张的进步主义模式比社会党人或休伊·朗的构想更为分权化。他对州权的坚定支持毁誉参半，而其在民权问题上的“纯白”立场更招致非裔选民强烈谴责。当国家立于悬崖之际，这位“爱达荷雄狮”能否引领美国渡过当前风暴，仍有待历史检验。"
 USA_DOUGLAS_MACARTHUR_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1880年1月26日，美利坚合众国阿肯色州小石城\n§Y军旅生涯：§W道格拉斯·麦克阿瑟“一把手”，出生于有着悠久军事传统的家族，毕业于西点军校，任工程兵少尉，是西点军校历史上成绩最高的学生。1904年，他被晋升为中尉，为了帮助他的父亲构筑新的军事总部，他去了菲律宾。在父亲的影响下，麦克阿瑟很快成为西奥多·罗斯福总统的军事顾问。1908年，他在莱文沃斯堡接管了一家工程公司。1911年晋升为上尉。所有这些高调的职位让他在1912年以32岁的年纪加入了美国总参谋部。麦克阿瑟将军参加了对韦拉克鲁斯的占领，在几周内学会了西班牙语，并与叛军发生了几次小规模冲突。1919年，他回到美国，被任命为西点军校院长。1922年，他回到菲律宾以视察该岛的防御状况，但这番旅途期间他不得不亲自出面干预以化解菲律宾巡防队的叛乱。作为一名出色的指挥官，1928年他还派往荷兰参加奥运会担任美国奥委会主席。然而自1925年升任少将后，他的恶名却攒越多，在赫伯特·胡佛的任下，麦克阿瑟不得不去服从那些他不同意的命令，比如军事法庭对比利·米切尔准将的审判，麦克阿瑟称这是“我收到的最令人讨厌的命令之一”。在1932年的军人抗议期间，尽管麦克阿瑟实际上同意抗议者的要求，但在胡佛总统的命令下还是被迫镇压了他们。从那以后，虽与行政部门抵牾不断，但他还是成了美国最高级别的军官。\n§Y重要信息：§W出生在参加过南北内战的军事世家，麦克阿瑟愿意做任何事情以让美国成为一个团结、伟大而自由的国家。"
 USA_DWIGHT_EISENHOWER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1890年10月14日，美利坚合众国德克萨斯州丹尼森\n§Y军旅生涯：§W德怀特·艾森豪威尔·“艾克”，艾森豪威尔从小热爱军事历史，为此他在1910年申请了西点军校和安纳波利斯军校，并在1911年以高分被西点军校录取，即使他实际上未能通过体能测试。1915年他与奥马尔·布拉德利同年于学院毕业，但随后由于腿部受伤的问题险些被排除现役。直到西点军校的首席医疗官主动向陆军部求情，才为他赢得了一份派往墨西哥边境第19步兵团的任命状。1917年他晋升为上尉。1918年底，他被转移到本宁堡，在那里他一直在波尔克营坦克学校接受训练，直到1919年参与汽车运输队护送。“艾克”于1920年升为少校。他对装甲作战的兴趣与日俱增，很快就加入了巴顿和范·沃勒斯的行列，要求增加对机械化计划的资助。1924年，他被派往巴拿马，在福克斯·康纳将军手下服役。康纳将军决定为“艾克”教授哲学、军事史和军事理论。1925年被选入指挥与参谋学院深造，以全班245名军官中第一名的成绩毕业。康纳将帮助“艾克”进入战争学院，成为学院最年轻的学生之一，并受到潘兴将军本人的赞扬。毕业后，他被分配到陆军战争学院，然后在1929年至1933年期间担任陆军少将、助理国务卿乔治·范·霍恩·莫斯利的执行长官。此后，他一直担任麦克阿瑟将军的首席军事助理，陪同麦克阿瑟将军前往菲律宾，并担任菲律宾政府的助理军事顾问。从那以后，他毫无争议地成为了麦克阿瑟的二把手，虽然两人性情不合，但在外人的眼里却是一对互相取长补短的好搭档。"
 USA_OMAR_BRADLEY_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1893年2月12日，美利坚合众国密苏里州克拉克\n§Y军旅生涯：§W1911年，奥马尔·纳尔逊·“布拉德”·布拉德利报考美国陆军学院，以第二名成绩入学。然而，因为优胜者者不能接受国会对该学院的任命，所以被名额授予布拉德利。他于1915年毕业，被任命为步兵少尉，并成为另一位同届毕业生德怀特·艾森豪威尔的密友。他被派往驻扎在墨西哥边境的第14步兵团，1917年晋升为上尉，随后被调往蒙大拿州比特的铜矿站岗，在接下来的十年里继续担任守军的职务。从1920年到1924年，他在西点担任数学教师，1924年晋升少校，并在本宁堡参加高级步兵课程。布拉德利后来在美国陆军司令部和总参谋部学校学习，1929年毕业，在美国陆军步兵学校担任战术教员，在那里他与中校结识并建立了良好的关系。乔治·马歇尔。1929年到1934年，他在西点军校教书，在那里他休息了一段时间，在美国陆军战争学院学习，并晋升为中校。由于担心“蓝色战争计划”执行将近，在麦克阿瑟的要求下，布拉德利和艾森豪威尔先是一起被提拔为准将，后又升至上将。\n§Y重要信息：§W基本可以说是美军内部最为可靠的陆军将军，马歇尔曾形容他为“安静的，谦逊的，能干的人”，他的可靠可以说是周围人的共识。“给他一份工作，然后忘掉它”，正是这样的名声帮助了他快速晋升。"
 USA_GEORGE_MARSHALL_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1880年12月21日，美利坚合众国宾夕法尼亚州尤宁镇\n§Y军旅生涯：§W乔治·卡特利特·马歇尔，1900年在弗吉尼亚军事学院开始了他的军旅生涯，1902年以美国陆军少尉的身份毕业。马歇尔在菲美战争期间曾驻扎菲律宾，并在战后协助遏制该地区的游击队活动。在世界大战期间，马歇尔和许多其他美国军官作为观察员被派往法国，在那里他因观察工作得力而被提升为上尉。1919年，他在潘兴将军的副官办公室工作了一段时间后被分配到陆军的几个职位使他能够将世界大战中学习到的经验传递给更多没有经验的军官，并帮助陆军实现培训现代化。在此期间，他成为了陆军部的重要策划与撰写人，曾在使馆城市指挥第15团，后来并在陆军战争学院出面任教到1927年。升任中校后，他被任命为本宁堡步兵学校的助理司令官，并任命埃德温·哈丁负责学校出版工作。他曾在不同的步兵团服役，直到1933年晋升为上校。1935年底，由于担心“军队内部不稳定”，几名重要军官被开除军籍，他也得以晋升为陆军准将。无论如何，他被广泛认为是美国陆军最优秀的策划者之一，并在总参谋部内广受尊敬。\n§Y重要信息：§W马歇尔的父亲是民主党人，母亲是共和党人，无论在公开场合还是私下里，他都是一位政治宽容的人。"
 USA_HENRY_H_ARNOLD_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1886年6月25日，美利坚合众国宾夕法尼亚州格拉德怀恩\n§Y军旅生涯：§W亨利·哈雷·阿诺德是美国著名的阿诺德家族一员，他在17岁时就加入了西点军校。虽然他想加入骑兵部队，但由于在学院的成绩和综合表现，他被分配到驻扎在菲律宾的第29步兵团。1911年4月，他请求调往通信兵部队，并于5月在那里完成了飞行员的训练。20世纪10年代末，他继续在空军从事开创性工作，并对世界大战中飞机的发展着迷。20世纪20年代，他和同事威廉·伦德鲁·米切尔一起为独立的空军而战，这导致米切尔被送上了军事法庭。阿诺德和其他著名的飞行员站在一起为米切尔辩护，但没有赢得审判。阿诺德将继续争取独立的空军，试图影响国会议员和招募飞行员他的事业，直到他因“试图以不正当方式干涉立法”为由被送到里莱堡，接下来的几年里他开始写书试图激发年轻人参加航空兵的热情。1928年，他回到陆军指挥和参谋学校，1929年从那里毕业。直到1935年，他才离开美国陆军，被派往航空兵总部，这是他职业生涯中最接近独立空军的地方，1935年3月2日，他晋升为准将。鉴于参谋部拒绝了阿诺德建立独立空军的主张，他可能因此对参谋部很不满。"
 USA_CLARENCE_HUEBNER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1888年11月24日，美利坚合众国堪萨斯州布什顿\n§Y军旅生涯：§W克拉伦斯·拉尔夫·赫布纳出生于贫困的农民家庭，他无法负担直接进入军校的费用，而是以二等兵身份参军，在第18步兵团服役近7年，在1916年获得中士军衔，期间参加潘乔·比利亚远征队，并在其中表现出色，成功晋升少尉军衔，之后被送往莱文沃斯堡参谋与指挥学校进修。1929年至1933年，他升任陆军少校并随后成为学院内的一名教官，1934年被提拔为中校，此后一直在步兵参谋长办公室工作，这段工作经历使他有幸成为晋升准将的人选之一。\n§Y重要信息：§W他曾在大红一师服役多年，因此本人也对指挥这支部队很感兴趣"
 USA_EDWARD_BROOKS_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1893年4月25日，美利坚合众国新罕布什尔州康科德\n§Y军旅生涯：§W就像许多军官同行那样，爱德华·霍尔·布鲁克斯并非是在高中毕业后开启军事生涯的，他最初考入诺威治大学，1915年加入预备役军官训练团，1916年大学毕业后取得土木工程理学学士学位，之后被佛蒙特州国民警卫队第一骑兵团任命为队长，年内又辞去这项职务，专注于工程师的事业。后来他被国民警卫队召回参加潘乔·比利亚远征队，并未参加任何实际行动，却开始对军队重拾兴趣。1921年进入西尔堡陆军野战炮兵学校进修，次年毕业后开始担任军事教官。1926年，他被派往菲律宾斯托森堡第24野战炮兵团D连负责指挥。1928年，又派驻莱利堡第18野战炮兵团。1932年进入陆军指挥与参谋学院学习，两年后毕业，作为后备军官训练团导师的身份就读于哈佛大学，1935年获得少校军衔。\n§Y重要信息：§W目前正在陆军战争大学接受培训，预计将于1937年初毕业。"
 USA_GEOFFREY_KEYES_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1888年10月30日，美利坚合众国新墨西哥州贝亚德堡\n§Y军旅生涯：§W1908年，杰弗里·凯斯进入西点军校就读，开启他的军事生涯。1913年以骑兵少尉身份毕业。1916年第一次被分配到第六骑兵团，并在那里参加了潘乔·比利亚远征队。远征归来后，他成为西点军校的一名教员。后来被派往巴拿马运河师戍守战略要冲，担任福克斯·康纳的助理幕僚长。1923年回国后，报名参加陆军指挥与参谋学院，1926年毕业后，他的军衔不断攀升，最终成为陆军部供应司的补给主任。\n§Y重要信息：§W目前正在陆军战争大学接受培训，预计将于1937年初毕业。"
 USA_JONATHAN_WAINWRIGHT_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1883年8月23日，美利坚合众国华盛顿州瓦拉瓦拉\n§Y军旅生涯：§W乔纳森·梅休·温赖特四世，1906年以骑兵少尉身份毕业于西点军校，1906年~1908年间在德克萨斯第一骑兵团服役，1908~1910年随团前往菲律宾镇压莫罗叛乱，不久后在莱利堡骑兵学院参加进修，1916年升任骑兵上位并在学院内从事教职。1921年被安排到第三骑兵团，1923~1925年间正式服役，此后又担任几个参谋职务，1929年晋升为中校，前往参谋与指挥学院和陆军战争大学接受培训，分别毕业于1931年和1934年。1935年，温赖特晋升上校，有鉴于骑兵部队对联邦政府存在异议的多种传言，1935年底，麦克阿瑟将对自己忠心耿耿的温莱特破格提拔为准将。"
 USA_JOSEPH_STILWELL_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1883年3月19日，美利坚合众国佛罗里达州帕拉特卡\n§Y军旅生涯：§W约瑟夫·沃伦·史迪威，昵称“乔叔叔”，1900年因其家族与美国总统威廉·麦金利的关系破格进入西点军校，1904年毕业时因其体育天赋和善于学习外国语言而远近闻名，调回西点军校后在现代语言系任教官，参加过参谋与指挥学院的步兵高级课程，1916年获得上尉军衔。20年代前往本宁堡任教，1929年取得中校军衔，在美国驻华使馆武官处有过三期服役经历，被召回美国前担任的最后一项职务在天津，因为这段成功的事业期，他被正式提拔为准将，此后一直担任第二步兵师的助理指挥官。\n§Y重要信息：§W共和党的铁杆支持者\n史迪威在自己的部队中是有争议的，他主张尽量简化繁琐的军队礼仪而被许多人昵称为“乔叔叔”，但因其经常严厉批评士兵们的现场演练而被唤作“酸醋乔”。"
 USA_LEONARD_GEROW_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1888年7月13日，美利坚合众国弗吉尼亚州彼得斯堡\n§Y军旅生涯：§W伦纳德·汤森·“吉”·杰罗，在维吉尼亚军事学校开启自己的军事生涯，他在那里毕业后获得一项“荣誉任命”，1911年9月完全跳过西点军校成为步兵少尉。1915年因其在德克萨斯州加尔维斯顿附近的飓风救灾活动中表现积极而获得表彰，潘乔·比利亚远征期间在韦拉克鲁斯城服役，1917年获得上尉军衔。此后对通讯部队产生浓厚的兴趣，他的服役生涯平白无奇，直到1925年以全班第一名的成绩在本宁堡步兵学校的高级课程上毕业，奥马尔·布拉德利是班上的第二名。在陆军参谋与指挥学院进修期间成为艾森豪威尔的朋友，1926年毕业后立即报名参加化学战与坦克军官培训课程，并曾在陆军战争大学修习课程。1932年被提升为陆军上校，不久被派往美国驻上海公使馆卫戍部队任职。1935年底回到美国，因其在中国地区的出色表现而被提拔为陆军准将。\n§Y重要信息：§W1931年的学习经历使他对扩充陆军坦克部队很感兴趣。"
 USA_LESLIE_MCNAIR_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1883年5月25日，美利坚合众国明尼苏达州弗恩代尔\n§Y军旅生涯：§W“白毛”莱斯利·詹姆斯·麦克奈尔通过报名海军军官学校踏上了自己的战争之路，在被列入军官生候补名单后，他选择前往明尼苏达商学院开启自己的学习。但在1900年，他又改变了主意决定再投军校。1904年以少尉军衔自西点军校毕业，成为道格拉斯堡第12山地炮兵连的一位排长，不久之后又申请调度到军械部门。因其在明尼苏达州的学习经历，麦克奈尔被任命为新武器监管委员会的一员，负责监督枪械公司的新研发项目。1909年晋升为中尉。因其出色的领导才能与专业技术，麦克奈尔在军队中的影响力不断提升，1914年他晋升为上尉，参加过韦拉克鲁斯远征，并跟随第四野战炮兵团协同了远征潘乔·比利亚的行动。1917年荣获少校军衔，继续参与监督委员会的工作，当陆军部开始为可能爆发的世界大战做筹备时（尽管他们从未干涉），他为军方试验过多种不同型号的火炮。\n后来，他被分配到美国陆军夏威夷分部，并在那里带头审查了橙色战争方案（以日本入侵夏威夷为假定条件），协助测试全新的海防项目。但其参与的后来被称为“麦克纳尔委员会”的活动，却在美国陆军航空兵中间引起了广泛的争议，但他依然坚持在1925年的一场裁决中向比利·米切尔提出不利指控。1928年，他晋升为中校并加入战争学院进修。修学两年毕业后前往美国陆军野战炮兵学校出任教职。1934年成为民间资源保护队指挥官。1935年晋升为上校，担任陆军野战炮兵司令的执行长官。1935年底，在小厄普顿·伯尼少将的亲自推荐下，麦克阿瑟将军决定将他晋升为准将。"
 USA_LLOYD_FREDENDALL_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1883年12月28日，美利坚合众国怀俄明州夏延\n§Y军旅生涯：§W1905年，劳埃德·拉尔斯顿·弗雷登德尔凭借父辈军界人脉与怀俄明州参议员弗朗西斯·E·沃伦的推介，入美国陆军学院就读。然而，他成绩很差，在一个学期内就被学院开除了。他的母亲设法说服参议员在第二年再次任命他，但他退学了。第二年，当参议员试图第三次任命他时，他被学院拒绝了。弗雷登德尔后来去了麻省理工学院。他没有被自己在西点军校的经历吓倒，而是参加了1906年的军官资格考试，在所有申请者中取得了最高分。1907年2月13日，他终于被任命为步兵少尉。接下来的十年里，劳埃德将在陆军的几所海外学校工作，在那里，他成为了一名优秀的教师、培训师和军队管理者，并因此而声名鹊起。和许多其他军官一样，20世纪20年代，他在美国担任了一系列的参谋和驻军职务。他成为美国陆军步兵学校的讲师和学生，1923年以优异的成绩从美国陆军司令部和总参谋学校毕业，并从美国陆军战争学院毕业。在三十年代初，他被派往华盛顿统计处，担任监察长的部门，后来又担任步兵首长办公室的执行干事。在此期间，他结识了乔治·马歇尔和莱斯利·麦克奈尔，并与他们成为了挚友，两人都提名弗雷登德尔为准将，这是1935年底麦克阿瑟将军批准的请求。从那以后，弗雷登德尔与马歇尔及其门生德怀特·艾森豪威尔都加强了关系。"
 USA_LUCIAN_TRUSCOTT_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1895年1月9日，美利坚合众国德克萨斯州查特菲尔德\n§Y军旅生涯：§W卢西恩·金·特鲁斯科特的军旅生涯始于军官培训，他谎称自己是高中毕业生，完成了相当于大学一年级的学业。在被录取后，他从洛根·鲁特堡毕业，随后被任命为骑兵少尉。在接下来的十年里，他一直待在墨西哥边境的亚利桑那州的第17骑兵团服役，1918年底他成为一名中尉，1920年晋升为上尉。在二十年代和三十年代初，他在各种骑兵和参谋部队服役，并从骑兵军官课程和美国陆军司令部和参谋学院毕业，1934年获得少校军衔。随着国家动荡的加剧，特鲁斯科特被提拔为准将，为局势恶化后蓝色计划的执行做好准备。"
 USA_OSCAR_GRISWOLD_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1886年10月22日，美利坚合众国内华达州鲁比谷\n§Y军旅生涯：§W奥斯卡·伍尔弗顿·格里斯沃尔德在内华达州里诺大学上学时被美国陆军军事学院录取。1910年，格里斯沃尔德从那里毕业后成为一名步兵少尉。在1914年被调往中国之前，他曾在多个驻防站服役，直到1921年。是年晋升少校，奉派美国陆军学院，随后进入指挥和总参谋部学院和美国陆军战争学院，分别于1925年和1929年毕业。在中校军衔下，他在陆军部总参谋部工作了两年，在美国空军短暂服役后，他终于被分配到步兵委员会并在现有职位上工作至今。"
 USA_WALTER_KRUEGER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1881年1月26日，德意志帝国西普鲁士弗拉佗\n§Y军旅生涯：§W沃尔特·克鲁格的父亲在1890年去世后，他与母亲和两个兄弟姐妹一起移民到美国。1898年，他加入美国陆军，跟随美国第二志愿步兵团参与了美西战争，并在战役中晋升为中士。后来他重新应征参加了菲律宾-美国战争并加入了第12步兵团，在那里他在阿瑟·麦克阿瑟将军的指挥下与叛乱分子作战。1901年，他终于被任命为少尉，在马兰多克的第30步兵团服役，直到1903年被调回美国。因为他的部队主要是执行守备任务，克鲁格得以就读于步兵骑兵学校和指挥与参谋学院并分别于1904年和1907年毕业。在第二次菲律宾之旅后，克鲁格被分配到语言学系直到1914年，随着世界大战的爆发，克鲁格被分配到德国军队担任观察员，但遭到拒绝，因此随后被派往国民警卫队第10团。调往墨西哥期间他参加了潘兴的惩罚性远征。1918年底，克鲁格接受了在德国的观察员身份，在那里他接触到了德国的顶级战术，1920年克鲁格回到美国后，将这些战术带回家。后来，他被派往本宁堡的步兵学校，在那里他开始向热心的教职工讲授德国小分队战术的基础知识，并因工作晋升为少校。他继续完善自己的能力，帮助陆军战争学院，并于1922年毕业，然后再次离开德国，在那里他试图培养两国的总参谋部之间的良好关系，但由于德国对美国的敌对政治气候而失败。克鲁格随后将被分配到美国陆军部总参谋部的作战计划部门，成为“蓝色作战计划”的主要策划人之一。以预防美国国内出现另一场内战。他于1932年被提升为上校，后来又因加入战争计划部而被提升为准将。"
 USA_DANIEL_VAN_VOORHIS_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1878年10月24日，美利坚合众国俄亥俄州赞斯维尔\n§Y军旅生涯：§W丹尼尔·范·沃尔什离开华盛顿和杰斐逊学院，以下士的身份应征参加美西战争，从此开始了他的军旅生涯。他曾在宾夕法尼亚第十步兵团服役，战争结束时已获得上尉军衔。美西战争结束后，范·沃厄斯接受委任成为正规军少尉，并随后于1900年至1914年在菲律宾服役。1914年，在潘兴的惩罚性远征中，他被调回德克萨斯，并作为第16骑兵团的指挥官留在德克萨斯。1924年，他被任命为骑兵总司令的执行长官，1929年，他从陆军战争学院毕业，成为一名中校。1930年，范·沃尔什被任命指挥陆军第一支实验机械化部队，并晋升为准将。他从实验中获得的经验为机械化作战发展了组织体系和新战术，使美国与德国等其他发达军事强国并驾齐驱。自被任命到机械化第七骑兵旅以来，丹尼尔一直与小阿德纳·霞飞密切合作，以期获得国会批准组建一个独立的陆军装甲部队分支。"
 USA_JOHN_LEE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1887年8月，美利坚合众国堪萨斯州章克申市\n§Y军旅生涯：§W约翰·克利福德·霍奇斯·“耶稣基督本尊”·李的军事生涯始于其收到美国陆军学院录取通知书的那一刻。李学习成绩优异，1909年以第12名的成绩毕业，远超第39名的德弗斯和第46名的巴顿。由于他的出色表现，他被任命为工兵团少尉。在担任了几个驻防岗位后，李在1912年晋升为中尉，并成为俄亥俄州国民警卫队的一名指导员。1912年底，由于担心墨西哥革命可能蔓延到美国边境，他选择被派往墨西哥边境。他在美国太平洋属地，特别是关岛和菲律宾吕宋岛进行了一系列地形调查，并于1916年晋升为船长。1920年，他被提升为少校，成为位于芝加哥的第六军团地区的助理参谋长。1927年密西西比河大洪水发生时，他被任命为密西西比州维克斯堡的地区工程师，李负责指挥救灾工作，并疏散城镇和地区的居民。1928年《防汛法》通过后，李督导了红河、瓦奇塔河、雅祖河的工程，亲自指导了新总部和水路实验站的建设。此后，李于1931年9月至1932年6月进入陆军军事学院学习，并成为陆军工业学院的副司令员，1934年晋升为中校。从那以后，李一直担任华盛顿特区区工程师，并于最近晋升为了准将，今后他的工程技能或许能在参谋部发挥大用。"
 USA_JAMES_GARESCHE_ORD_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1886年的10月18日，美利坚合众国科罗拉多州杜兰戈\n§Y军旅生涯：§W詹姆斯·加雷谢·“桑尼”·奥尔德在1909年从西点军校毕业成为步兵少尉，从此开始了他的军旅生涯。他将被分配到第30步兵团，并将在潘兴的惩罚性远征期间活跃在墨西哥边境，获得中尉军衔。远征结束后，他被任命为卡尔弗军事学院的军事科学教授，并担任这些职务至今。1921年，他进入指挥与参谋学院，1924年毕业后成为学校讲师，1926年又加入美国陆军战争学院，1929年毕业后授勋中校。詹姆斯从1930年到1934年在陆军部的供应和后勤部门工作，从那时起他一直担任步兵委员会主任，最近因担心人员流失的问题而被提升为准将。"
 USA_EDWIN_HARDING_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1886年9月18日，美利坚合众国俄亥俄州富兰克林\n§Y军旅生涯：§W爱德温·福雷斯特·哈丁从1906年入伍加入西点军校开始了他的军事生涯。1909年，他与乔治·S·巴顿、雅各布·L·德弗斯、约翰·C·H·李和威廉·H·辛普森一起毕业。他主要负责担当守备任务直到被分配到西点军校作为担任教职。他最初负责担任现代语言学教师，从1919年到1921年，转而教授经济学。1921年到1923年6月间又成为历史学助理教授，1923年6月到8月的，他被派遣到第15天津步兵团，在美国公使馆一直待到1929年9月。回到美国后，在本宁堡担任指导员。在本宁堡，他遇到了乔治·马歇尔上校，马歇尔让他负责步兵学校的出版物。作为一名出色的编辑，哈丁开始负责策划、监督和编辑《步兵作战》一书，这是美国陆军自二战时期研究德国军队以来步兵战术的第一次突破。1935年底，由于担心人员流失问题，他被提升为上校，并随后晋升为准将。"
 USA_SMEDLEY_BUTLER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1881年7月30日，美利坚合众国宾夕法尼亚州西切斯特\n§Y军旅生涯：§W斯梅德利·达林顿“战斗的贵格教徒”巴特勒谎报年龄于1898年应征加入海军陆战队，加入美国军队，参加了美西战争。他被任命为接受高等教育的少尉，经过基本训练后将被转移到最近被占领的关塔那摩。因为他的连队很快就回到了美国，他没能赶上战斗。1899年4月，他被重新分配到纽约号装甲巡洋舰，成为一名海军中尉。后来被转移到菲律宾，在那里他主要执行守备任务，也间或参与了一些打击叛乱的行动。1900年，在义和团运动期间，他跟随利特尔顿·沃克，参加了天津战役和加塞莱远征队，在他试图营救一名海军陆战队员期间大腿受伤，并因此获得了晋升上尉的机会。后来，巴特勒参加了香蕉战争，第一次到洪都拉斯保卫美国领事馆是在1903年，第一次到尼加拉瓜是在1909年到1913年，在那里他参加了打破格拉纳达的包围，马萨亚战役和征服科耶特帕丘。1914年，他参与了对墨西哥韦拉克鲁斯的占领，在战斗中获得了第一块荣誉勋章，并被提升为少校。他后来转移到海地，因为参与镇压卡科叛乱的行动，他在那里赢得了自己的第二枚荣誉勋章。后来他被调回美国担任守备部队职务，直到1921年晋升为准将。1927年，他被派往中国，负责使公国各城市的海军远征军，晋升为少将，1929年返回美国，1931年竞争并赢得美国海军陆战队司令一职。1935年，在胡佛政府日益紧张的局势下，他获得了将军军衔，尽管巴特勒批评胡佛。然而，他仍然是美国海军陆战队最有影响力、最傲慢的军官之一，他的影响不容小觑。"
 USA_HERBERT_HOLDRIDGE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1892年3月6日，美利坚合众国密歇根州怀恩多特\n§Y军旅生涯：§W赫伯特·查尔斯·海特克出生于一个德国移民家庭，1913年加入西点军校，1917年毕业后成为一名步兵少尉。他最初被派往佐治亚陆军预备役军需官，1920年晋升中尉，1923年晋升上尉。1925年，当他还在预备役部队的时候，转战骑兵部队，被任命为西点军校历史与社会科学助理教授。1929年底，他转到位于莱利堡陆军骑兵学校并一直担任教职，1934年晋升为上校。他虽然是联邦相关工作人员，但他对胡佛政府的持续批评已经开始削弱政府的合法性。"
 USA_GEORGE_VAN_HORN_MOSELEY_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1874年9月28日，美利坚合众国伊利诺伊州埃文斯顿\n§Y军旅生涯：§W1899年，乔治·范·霍恩·莫斯利自美国陆军学院毕业，获骑兵少尉衔。他在美西战争中服役指挥第九骑兵团。在那里他成功地在与卢多维奇·阿雷乔拉的战斗中取得重大突破，并因此晋升为中尉调往第一骑兵团。在第一骑兵团期间，他先后作为贝尔准将和李准将的副官，又在后方担任了几个工作岗位。1904年，他被调回美国，在德克萨斯州指挥部任职直到1906年被提升为上尉。他继续担任各种各样的参谋职务，同时参加了陆军参谋学院和陆军战争学院的培训并分别于1909年和1911年毕业。他参与了潘兴的惩罚性远征，为潘兴提供后勤支持，并为他赢得了少校的晋升并指挥第二野战炮兵大队。1921年他被任命为道斯将军组织预算局的助手，后因表现突出被晋升为准将，成为陆军部长助理的行政助理负责工业准备部门，然后又晋升为少将。然而在1934年，当他与麦克阿瑟将军大吵一架后，时至今日双方的关系仍然非常紧张。\n§Y重要信息：§W在公开场合和私下场合都表现出强烈的反移民和反犹太主义观点。"
 USA_GEORGE_PATTON_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1885年11月11日，美利坚合众国加利福尼亚州圣加布里埃尔\n§Y军旅生涯：§W乔治·史密斯·巴顿从小就是军事史书籍的爱好者，他于1903年加入弗吉尼亚军事学院。次年被推荐为西点军校的学生。尽管他在西点军校的训练过程中表现出色，但他的学习成绩太差，不得不重读他的第一学年。学习的过程困难重重，但在1909年毕业后被分配到第十五骑兵团，如愿成为了一名骑兵少尉。1912年斯德哥尔摩奥运会期间，他的运动技能使他成为第一位代表美国参加现代五项竞赛的军人运动员，并在42名参赛者中排名第五。随着惩罚性远征的展开，巴顿成为了潘兴的副官，虽然这次远征失败了，但也加强了他们间的友谊纽带，巴顿几乎完全成为了他参谋部的一员，并因此很快就被提升为上尉。1920年6月31日，他又被提升为少校，开始对世界大战中机械化战争的使用产生了兴趣。1923年，他进修了骑兵野战军官课程，1924年又从指挥和参谋学院毕业，1932年从陆军战争学院毕业。在当年的军人抗议中，巴顿与麦克阿瑟大吵了一架，此后巴顿一直致力于声讨他的这位同事。虽然他的朋友艾森豪威尔致力于在两人间进行斡旋，但巴顿的军衔一直在总参谋部的阻挠下卡在中校一级，尽管他完全够格升任准将衔。\n§Y重要信息：§W在公共场合表现出强烈的种族主义观点。"
 USA_ADNA_CHAFFEE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1884年9月23日，美利坚合众国堪萨斯州章克申城\n§Y军旅生涯：§W小阿德纳·罗曼扎·霞飞，陆军少将老阿德纳·罗曼扎·霞飞之子，1906年以骑兵少尉身份毕业于西点军校，并进入第十五骑兵团服役，参与了古巴平定战，并在战争中被证明是位出色的骑兵战士（他也因此在军队内取得“第一骑马好手”的称号）。1907至1911年间，霞飞调往莱利堡骑兵学院，指挥学院骑兵部队向校内学生与教官提供服务。1913年欧洲局势日益紧张之际，霞飞被送到了法国，进入法国索米尔骑兵学院进修。1914年，霞飞又回到了莱利堡短暂从事教职，不久后被调往菲律宾第7骑兵团参加军事任务，1915年调任西点军校，担任战术系高级骑兵教官，并在西点工作到1919年，又被介绍为利文沃斯堡参谋与指挥学院导师。1920年，霞飞晋升为上尉，分别调往第三骑兵团和第一骑兵师任职。在完成陆军战争大学的进修后，霞飞取得了陆军中校军衔，进入总参谋部，从此开始广泛研究坦克在世界大战时期的运用情况，并着手开发美国陆军第一种机械化与装甲战术，尽管此时他还没有多少资源可用于实践自己的理论。1931年，霞飞被调离总参谋部，担任诺克斯堡新成立的第一骑兵师的主任参谋，该骑兵师原计划被改造为机械化部队，但因种种缘由未能落实。1934年，霞飞被召去华盛顿和战争部，担任预算和立法规划部主任，1935年底正式晋升为准将。\n§Y重要信息：§W尽管骑兵部队对霞飞崇敬有加，但总参谋部并不认可其未经实践的作战理论。"
 USA_MALIN_CRAIG_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1875年8月5日，美利坚合众国密苏里州圣约瑟夫\n§Y军旅生涯：§W马林·克雷格，1898年毕业于美国陆军军官学院，被授予少尉军衔后在第四步兵师服役。不久后被调往第六骑兵团，前往古巴参与过“圣地亚哥行动”，不久后又被派往中国远征军镇压拳乱，并在那里晋升为中尉。1903~1904年间在步兵与骑兵学院进修，1904年~1905年进入参谋学院，并在完成课程后升任上尉调往利文沃斯堡第10骑兵团。1910年前往陆军战争大学学习，次年毕业后成为总参谋部机动科负责人，1920年获得上校军衔调往亚利桑那州服役，次年升任准将，成为莱利堡骑兵学院校长。因为他出色的军事履历，1924年，克雷格升任少将兼全国骑兵总监，随后在参谋部出任一系列重要职务，1930年~1935年间成为陆军战争大学校长，晋升为三星中将。\n§Y重要信息：§W马林·克雷格曾在国会与最高指挥部会议上表态，联邦军队目前缺乏必要的人力与物资储备，强调提前展开军事准备工作的必要性，同时将主要关注点放在军队规划上，把精密的决战计划视作赢得战争的关键。\n尽管他曾与很多骑兵军官一致认为，机械化作战是军队发展的必由之路。但他同样认为，美国首先需要建立起庞大的常备军来捍卫其工业设施，才能考虑如何大规模部署坦克等机械化装备。"
 USA_FOX_CONNER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1874年十一月2日，于美国密西西比州的石板泉\n§Y军旅生涯：§W作为邦联老兵罗伯特·康纳的儿子，福克斯·康纳在1894年通过国会任命进入西点军校，并在1898年以中尉身份毕业，他在历史、数学、马术与法语方面均出类拔萃。即使对骑兵展现出了极大的兴趣，他还是被分配到了第一炮兵营，他几次提交调往骑兵部队的申请，但都被驳回。他在1899年的美西战争中被调往古巴，在占领军中服役。他在此结识了他未来的妻子弗吉妮娅·布兰德雷丝。他在1901年晋升为上尉，之后被调到纽约汉密尔顿港123海岸炮兵连服役。康纳在此任职到1901年，而后于1905年进入陆军参谋学院学习，而后于1907年进入陆军战争学院，最终在1911年毕业。毕业后，他作为一名军事专员来到法兰西第22野战炮兵营。回到美国后，他又被指派往一个靠近墨西哥边境的炮兵要塞服役，他在次期间晋升少校并调回华盛顿特区的总监处任职。在之后的几年他兢兢业业。康纳在法语上的造诣使得他能在大战期间翻译第一手的法军报告，这种才干让他于1918年晋升中校，随后于1920年成为准将。他在战争部结识了乔治·马歇尔，两人很快成为朋友。后者安排他去米德堡服役，他在次又认识了乔治·巴顿与艾森豪威尔，他们很快成为朋友。康纳与艾森豪威尔更是亦师亦友的伙伴。即便康纳与艾森豪威尔在摩托化部队的问题上颇有分歧，对坦克的使用也各有说法，但这不妨碍康纳追随艾森豪威尔前往巴拿马任职。他于1925年升任少将，于1930年在潘兴的推荐与道格拉斯·麦克阿瑟的支持下成为总参谋长。他随后被调往第一集团军，并且众所周知的，他于马歇尔、巴顿与艾森豪威尔依然有紧密的往来。\n§Y重要信息：§W他很快就要退役了。"
 POLITICS_WILLIAM_HALSEY_DESC:0 "§Y生于：§W882年10月30日，美利坚合众国新泽西州伊丽莎白\n\n哈尔西自幼成长于一个与英国渊源深厚的家庭，始终与海洋同呼吸共命运。他自述与1702年服役于皇家海军的前任舰长约翰·哈尔西有着一种新的亲缘感。一到适龄，他便申请进入美国海军学院，但在等待期间，他先在弗吉尼亚大学攻读医学，随后以军医身份加入海军。他早期海军生涯的大部分时光都在战列舰上度过，曾于1904年在密苏里号上亲历一次火药装药被引燃的事故，导致31名船员窒息身亡。此后，当世界大战在欧洲鏖战之际，他辗转服役于多艘鱼雷艇和驱逐舰。世界大战结束后，他担任美国驻欧洲各大使馆的海军武官，最终于1930年回国，并在1934年由海军少将欧内斯特·金授予航空母舰萨拉托加号的指挥权。随后他学习并驾驶舰载机，成为获得海军飞行员徽章的最年长者。\n\n内战爆发后，他紧随欧内斯特·金左右，在金发动政变推翻暴虐的道格拉斯·麦克阿瑟后，一直与他并肩作战。无论是对他熟识之人，还是曾在他麾下服役者而言，他既赢得了尊敬，也营造了一种比大多数海军上将更为宽松的氛围，他常常因参与诸如学习驾驶飞机等活动而与其他质疑其必要性的人产生分歧。他通常不问政治，更多地以海军职责而非政治的视角看待自身，之所以追随金，只因他们在服役期间结下的情谊与共同的海军忠诚。如今，他执掌着一艘新的航船，即美利坚合众国的联邦主义者派系，他力求延续金的诸多政策，同时加强海军与空军部门间的合作，并向军中残余的麦克阿瑟分子伸出橄榄枝。他所做的一切，皆为美利坚合众国的存续，为使这艘巨舰不致沉没于波涛之下。"
 POLITICS_RAYMOND_SPRUANCE_DESC:0 "§Y生于：§W1886年7月3日，美利坚合众国马里兰州巴尔的摩\n\n尽管斯普鲁恩斯出生在巴尔的摩，他的童年大部分时光却在印第安纳波利斯度过，并最终从那里进入美国海军学院，于1907年毕业，随后专注于电气工程领域。他最初被分配到战列舰爱荷华号上服役，后调至明尼苏达号，随大白舰队进行了为期两年的环球巡航。之后，他指挥过多艘驱逐舰，后来又担任了战列舰密西西比号的舰长。再后来，他被任命为伦敦纽约海军造船厂的助理工程师，直至革命爆发前才离开。此后，他致力于为驱逐舰和战列舰配备新式装备，同时也在华盛顿哥伦比亚特区的工程局工作，期间他研究并倡导将航空兵学说应用于海战。\n\n内战爆发时，斯普鲁恩斯身处华盛顿哥伦比亚特区，和大多数前海军人员一样，他留在了联邦派一方。随着金的海军对道格拉斯·麦克阿瑟发动政变，斯普鲁恩斯被晋升为海军少将，受命指挥联邦派海军剩余的大部分力量。在他的统率下，其领导风格务实严肃，要求部下具备奉献精神与坚定决心，却并无某些人伴随此种作风而来的独裁恶意，他本人既不吸烟，也极少饮酒。如今，联邦派军队的舵轮掌握在他手中，周围是志同道合的海军将领和残存的政治阶层，斯普鲁恩斯如同指挥他的舰船一般领导着美国，期望上下都能秉持同样务实严肃的态度。伴随着清晨的热巧克力，斯普鲁恩斯希望在最忠诚海军的指引下，引领美国回归她的本源。"
 POLITICS_NIMITZ_USA_DESC:0 "§Y生于：§W1885年2月24日，美利坚合众国德克萨斯州弗雷德里克斯堡\n\n尼米兹出身于一个德裔德克萨斯家庭，早年生活充满了家族成就的故事与回忆。他的祖父曾是德国商船队的一名海员，常向他讲述远洋的壮美与知识。家族中既有海员，也有在邦联军中服役的德克萨斯游骑兵，尼米兹原本申请西点军校想加入陆军，然而命运弄人，陆军名额已满，告知他仅剩海军学院有空缺。他于1901年入学，1905年以优异成绩毕业，随后很快在圣弗朗西斯科加入了俄亥俄号战列舰。此后他辗转于多艘舰艇之间，一直留在太平洋地区，仅因驱逐舰迪凯特号搁浅而受过一次轻微申斥。\n\n尼米兹在晋升过程中迅速以稳健干练的领导者形象闻名，对犯错者施以严厉却公正的纪律处分。他还因一次柴油机事故失去了左手无名指的一部分，多亏海军学院的戒指才保住了下半截手指。他始终留在西海岸，指挥萨拉托加号航空母舰及其他舰艇，直至内战爆发。\n\n尼米兹与海军中许多人关系密切，包括海军上将欧内斯特·金。尽管身处西海岸，他仍选择回归联邦派阵营，支持金发动政变对抗麦克阿瑟的暴政，认为麦克阿瑟不过是个投机取巧的好战军阀。金发动政变后，普遍的不满情绪并未消散，经过深思熟虑，尼米兹被任命为领袖，人们认为他在海军指挥中公正而严厉，希望他治理国家时也能如此。太平洋舰队残存的大部分力量完全支持尼米兹及其领导，他作为团结海军的领袖执掌太平洋司令部，整合残余的大西洋与太平洋舰队，共同保卫美国，抵御撕裂祖国的祸患。"
 POLITICS_GEORGE_LINCOLN_ROCKWELL_DESC:0 "1918年3月9日，乔治·林肯·洛克威尔出生于一个杂耍艺人家庭，他始终坚信自己终将登上巅峰。年轻的洛克威尔惯于成为任何场合的焦点，与师长顶撞，其张扬个性很快成为当地社区的标志。内战的爆发中断了洛克威尔的学业，他应征加入美国海军担任飞行员。始终疏远专横暴虐的父亲，洛克威尔在麦克阿瑟将军身上找到了新的榜样，但这位英雄的性命被腐败的最高法院断送。服役期间，他与海军内部的民族主义派系交织日深，这些派系向这位年轻军官揭示了工团主义者和犹太势力谋害将军的真相。洛克威尔迅速投身威洛比政府，在真爱国者党成立大会上的激昂演说使他家喻户晓，其声望之高，令他不顾年龄成为该党领袖。如今身为总司令，洛克威尔对整个国家自有其规划。他希望按照他所信奉的自然法则，亦即族群法则重组社会。此外，他自视为开国元勋价值观的真正化身，并决意贯彻其意志，建立一个威权国家以维持秩序，涤荡国家的旧日腐败。作为一名狂热的民族主义者，洛克威尔意图隔离那些不符合殖民时代定义的美国人的少数群体。通过这些手段，美国将再次成为其本国公民的国家，外部群体的入侵将被击退。为实现这些目标，洛克威尔计划利用强大的媒体和宣传机器，借助自身的魅力及追随者的热情，来证明其行动的必要性。将美国从桎梏中解放出来绝非坦途，但洛克威尔相信，他正拥有唤醒美国人民沉睡、号召他们最终行动以对抗那些企图毁灭他们之敌所需的一切。"
 POLITICS_CHARLES_WILLOUGHBY_DESC:0 "威洛比于1892年3月8日出生在德意志帝国的海德堡，原名阿道夫·卡尔·魏登巴赫，其出身与帝国紧密相连。作为普鲁士步兵军官T·切佩-魏登巴赫男爵与其美国情妇埃玛·威洛比·切佩-魏登巴赫之子，威洛比始终对自己的美德两国血统怀有深厚感情。1910年，威洛比离开德国前往美国，在那里他加入了军队，一路晋升至军士，随后光荣退役以完成学业。1914年重返军队后，威洛比在全国各地担任过多种职务，精通军事情报工作。凭借流利的英语、德语、法语和西班牙语，威洛比在南美各地担任过武官，成为华盛顿与拉丁世界之间的重要桥梁。在华盛顿哥伦比亚特区的陆军战争学院学习期间，威洛比结识了总参谋长道格拉斯·麦克阿瑟，两位将军很快成为挚友。出于对工团主义歪风摧毁美国根基的憎恶，威洛比支持麦克阿瑟将军实施白色战争计划以恢复合众国秩序，并担任将军的军事情报主管。将军命丧莱希上将之手后，威洛比与联邦调查局局长J·埃德加·胡佛达成了默契联盟，两人都坚信必须守护基督教信仰与白种人在美国的存续。在局长的支持下，威洛比与忠于已故麦克阿瑟的部队向哥伦比亚特区进军，以保卫联邦免遭叛变上将们的颠覆。作为一名狂热的民族主义者和亲德派，威洛比将军将铲除肆虐我们美丽哥伦比亚的工团主义瘟疫，同时引领国家向德意志帝国靠拢。"

#风味
nimatron.1.t:0 "第一款街机的诞生！"
 nimatron.1.d:0 "第二次美国内战的爆发，阴差阳错的让核物理学家爱德华·康登有了充裕的业余时间。他发明了一台名为尼马特隆的机器，并由西屋电气公司推广到了美国许多城市。尼马特隆不具备任何经济或战术意义，而是纯粹提供娱乐。它可以模拟尼姆游戏，扮演另一个玩家，玩家可以连续关掉一个或多个灯泡，然后机器跟着这样做，依次循环，最后熄灭一盏灯的是赢家。要打败机器并不容易，作为奖励，赢家将会得到一枚刻有“尼姆冠军”字样的硬币。它的新颖性和虽然不大但确实存在的回报前景，让尼马特隆成为了非常流行的一种消遣方式，既能打发时间，也能让人忘记了重建的艰辛。"
 nimatron.1.a:0 "虽然只是一点点，我们的未来似乎变得更加光明"
 nimatron.2.t:0 "第一款街机的诞生！"
 nimatron.2.d:0 "随着美国成功地从大萧条的灰烬中崛起，过去几十年的混乱和不稳终于平息了，这让核物理学家爱德华·康登有了充裕的业余时间。他发明了一台名为尼马特隆的机器，并由西屋电气公司推广到了美国许多城市。尼马特隆不具备任何经济或战术意义，而是纯粹提供娱乐。它可以模拟尼姆游戏，扮演另一个玩家，玩家可以连续关掉一个或多个灯泡，然后机器跟着这样做，依次循环，最后熄灭一盏灯的是赢家。要打败机器并不容易，作为奖励，赢家将会得到一枚刻有“尼姆冠军”字样的硬币。它的新颖性和虽然不大但确实存在的回报前景，让尼马特隆成为了非常流行的一种消遣方式，既能打发时间，也能让人忘记了重建的艰辛。"
 nimatron.2.a:0 "虽然只是一点点，我们的未来似乎变得更加光明"
 nimatron.3.t:0 "威廉·“大比尔”·海伍德之死"
 nimatron.3.d:0 "威廉·“大比尔”·海伍德，世界产业工人联盟的巨人，美利坚社会党的长期领袖和美国左翼的团结者，今天在芝加哥林肯公园散步时被他的狗链绊倒，经抢救无效后溘然长逝。他的去世极大震动了全美的左翼人士，伊丽莎白·格利·弗林在他的葬礼上发表了演讲：“历史具有长远的眼光。它终将对暴君做出严厉的审判，向那些为人类解放事业，反对压迫与经济奴役而斗争、受苦、入狱和牺牲的殉道者伸张正义。”\n\n其他工会领导人，以及美利坚社会党的各大领袖，也在海伍德的葬礼上发言致辞。不过，最值得一提的是杰克·里德的演讲，引用海伍德曾经用过的演讲词，里德向在场听众放声呼喊道：“工人们，如果你们组织起来，只要将手放在口袋里，就是对资本家最沉痛的打击！每场罢工都孕育着革命的起点。许多伟大的革命都是从最小的罢工中诞生的。记住，我们并非为一己私利，你们在为全体工人阶级而战，工友同胞们，团结起来！”\n\n海伍德的突然离世让社会党及其在各政治领域的诸多盟友都深为震惊，美利坚社会党、美利坚联合工团、世界产业工人联盟和美利坚劳工联合会-产业工会联合会的领导层已经呼吁召开联合大会，以期能选出一位填补海伍德死后留下的巨大空位的领袖。由于标志着1937年黎明的政治危机早已结束，越来越多的人要求转向改革而不是革命，此次大会正是在这一背景下召开的。"
 nimatron.3.a:0 "一个时代的结束，亦或是另一个时代的开始？"
 nimatron.4.t:0 "美利坚社会党紧急大会"
 nimatron.4.d:0 "今天是美国极左翼领导人在其长期领袖威廉·海伍德去世后召开的紧急党代会结束的日子。大会的召开极为简单，全国各地的代表们汇聚一堂，甚至不列颠联盟和法兰西公社都派出了代表参加此次会议。与大多数党代会一样，与会成员间迅速出现了巨大分歧，尽管与大多数党代会不同，这些派别大致分为两个阵营。\n\n其中第一个也是最大的派系，大多属于美利坚劳工联合会-产业工会联合会的队伍，以及出席会议的少数进步派人士，他们呼吁对政策进行重大改变。这些代表们反对为“革命”进行宣传和工作，而是应全力宣传“改革”，在现有体制内变革资本主义。这一派指出了一个显而易见的事实来证明其观点：美国当前的形势与1936年大不相同。一言以蔽之，除了最为狂热的革命者，普通民众的革命热情早已冷却，民族间的兄弟情谊和正常状态已经彻底恢复。如果党真的想要实现社会主义，就必须适应新时代的变化，摈弃最激进的革命呼吁。第二派目前则处于弱势，主要由美利坚联合工团、福斯特派和美利坚合众国共产党的残余成员组成，他们拒绝拥抱改良主义，称那些支持改良主义的人才是真正的反革命分子。该派系要求党内路线维持现状；而一些更为激进的成员则呼吁迅速发动革命，反对旧有秩序。\n\n随着大会的进行，很明显，改革派已经胜券在握。因此，社会党的纲领被正式修改，所有激进的革命用语都将被其抛弃，取而代之的是支持改革的论调。至于新任主席之位，约翰·“杰克”·里德成功当选，似乎是两派间互相妥协的结果。长期以来，无论是他在支持列宁式共产主义还是公社式工团主义间的模糊态度，还是其失败的记者生涯，都让约翰·里德在美国左翼内部颇受冷落。里德当选的唯一原因似乎是他与社会党中的革命派关系良好。不管是什么原因，美国左翼现在有了一张全新面孔，以及一份新的计划。"
 nimatron.4.a:0 "至少他们不再是真正的威胁了。谁会投票给一个被戴绿帽子的人？"
 nimatron.5.t:0 "里德太太的情夫们"
 nimatron.5.d:0 "在社会主义圈子里，约翰·“杰克”·里德和路易丝·布赖恩特的关系貌合神离早非秘密。这对于1916年喜结连理的左翼活动家，自同剧作家尤金·奥尼尔合租小屋时期起，便秉持波希米亚式的性开放观念，先后与多位伴侣交往。激进革命圈虽对此早已习以为常，然美国左翼阵营中持保守社会观者历来视里德的多角恋为道德缺陷，以此攻击其品行不端。\n\n记者出身的里德当选社会党主席后，反对派将此类私生活细节泄露给了右翼团体，为其递上了攻击工团运动的子弹。由此炮制而来的一系列诽谤材料包含小册子、伪造日记，还有题为《床震我妻的十人》的书信——这一标题公然戏仿了里德描写布尔什维克革命的著作《震撼世界的十天》。这些所谓“自述”的材料，以夸张笔法渲染了群交、偷情等大众看来有违风序良俗的情节，其中最耸人听闻的莫过于路易丝亲笔所列的“情夫”名单：安德鲁·达斯博格、小威廉·C·布利特、阿尔·卡彭、尤金·V·德布斯、亚历山大·别尔克曼、埃玛·戈尔德曼、诺曼·托马斯、亨里希·亚戈达、列夫·托洛茨基、格奥尔基·朱可夫均赫然在列。\n\n社会党对此虽是不发一语，里德本人则对文字诽谤震怒不已，而政敌也趁势掀起舆论攻势。旧民主党人率先高喊“赤色本堕落，私通乃固习”的口号，海伍德逝世后因接班问题失利的党内派系，亦借机指责主席沾染资产阶级习气，要求将其罢免。无论如何，里德的公众形象经此一役都遭受了重创，社会党未来的选举前景愈发黯淡。"
 nimatron.5.a:0 "可笑的内斗"
 nimatron.6.t:0 "化石大发现"
 nimatron.6.d:0 "在北亚利桑那不遗余力地进行古生物学挖掘时，古生物学家查尔斯·坎普和纳瓦霍博物学家杰西·威廉姆斯获得了一项令人兴奋的新发现。在纳瓦霍保留地图巴市以北20英里处的凯恩塔地层挖掘时，该团队挖掘出三组不同的新食肉恐龙化石。其中一具骨骼大体上完整的骨骼化石，只缺失了头骨前部、部分骨盆和一些脊椎骨，而另外两具则被侵蚀得较为严重，残缺不全。在加利福尼亚大学古生物学博物馆开展研究后，标本被暂时命名为“双冠龙”。它被描述为一种中等大小的捕食性兽脚龙，历史可以追溯到侏罗纪早期，其大小约为23英尺长，头部上有明显的两个尖顶。一些人甚至猜测它可能长有大的褶边，甚至是有毒的，但这些想法受到了更为谨慎的学者的指责。在近日席卷美国的混乱状况之后，这个发现被誉为科学奇迹，因为在当今混乱局势下追求科学实在是件无比困难的事情。愿这是事情即将好转的迹象。"
 nimatron.6.a:0 "多么奇怪的标本啊。它一定会拓展古生物学的知识，甚至还能娱乐大众。"
 nimatron.7.t:0 "詹姆斯·史都华恪尽职守"
 nimatron.7.d:0 "由于在《小镇姑娘》、《迷雾重重》和《浮生若梦》中饰演的角色已经家喻户晓，尽管内战已经开始，但詹姆斯·史都华——演员、花花公子、常人和明星——好莱坞最大牌的演员之一仍能挤出时间上映他的电影，但即使这位银幕上的明星也不能忽视这场撕裂整个国家的兄弟之战的召唤。他宣布暂时从他的演艺事业中退休，并加入了美国陆军，鉴于他个人的飞行经验，他想在陆军航空兵中寻求一个职位。史都华对飞行并不陌生，他从十几岁起就开始驾驶小型飞机，为了进一步积累军事经验，他的祖父都在第一次内战中为联邦服役，而他的父亲则在美西战争中参军。\n\n联邦政府试图利用他的技能并将他包装为宣传和战争方面的伟大“明星”，以他的飞行经验和在普林斯顿大学获得的高分为由，为斯图尔特提供了一个军官之位。虽然他可能有点青涩，但美国现在比以往任何时候都更需要有能力的人去统筹全局，这已经不是什么秘密了，因此史都华以及陆军司令部都同意了这个提议。史都华将成为美国陆军的一名军官，同时还将出演一系列由陆军资助的宣传片，以提高士气，在我们为赢得这场内战而战斗时，他将有望成为我们地面和空中部队的得力助手。"
 nimatron.7.a:0 "美国理想的缩影。让我们向这位勇敢的美国人致敬。"
 nimatron.8.t:0 "赢得你的双翼"
 nimatron.8.d:0 "作为第一位应征参加第二次美国内战的好莱坞明星，詹姆斯·史都华——现在是陆军航空兵的一名知名军官，也是自身中队的战斗机王牌——已经成为美国家喻户晓的明星之一，因为他不仅是战前电影界的代言人，而且也是战争本身的闪亮之星。史都华将在他最新的战时电影《赢得你的双翼》中扮演他自己，这是一部宣传性和信息性很强的电影，旨在提高士兵的士气，推动入伍人数，并在公众眼中美化我们武装部队的形象。虽然他在好莱坞的一些同僚称其为叛徒，但国家却称他为爱国者！因为他们知道真相，我们也知道——詹姆斯·史都华是一位美国英雄！"
 nimatron.8.a:0 "上帝保佑詹姆斯·史都华！"
 nimatron.9.t:0 "生活多美好！"
 nimatron.9.d:0 "由法兰克·卡普拉执导，詹姆斯·史都华与可爱的女明星唐娜·里德一起主演的《生活多美好》——这是史都华自内战结束后的第一部作品——终于在全国影院上映了。这个感人至深的故事一经上映便迅速走红，并获得了包括奥斯卡最佳影片奖在内的多项提名，它改编自菲利普·范多伦·斯特恩的小说《最伟大的礼物》，该小说本身大致上也改编自狄更斯的《圣诞颂歌》。\n影片讲述了乔治·贝利——由深受喜爱的詹姆斯·史都华饰演——于1945年圣诞节开幕时，在纽约市的家中考虑自杀，这时一位名叫克拉伦斯的天使听到了他的请求，并被上帝指派去拯救他。影片接着讲述了贝利的生活——以及最终他的消失是如何影响亲人、家庭和对手的，他在其中再次找到了活下去的意愿。故事以一个快乐的结局结尾，贝利和他的朋友和家人团聚，而他们也筹集了足够的钱来偿还他的债务，这个曾经沮丧的人终于意识到了生活的美妙。\n\n尽管联邦调查局声称该片可能含有工团主义色彩，但《生活多美好》肯定会成为几十年来的经典之作，它重新点燃了詹姆斯·史都华的演艺事业，同时也证明了其本身就是一部轰动一时的影片。"
 nimatron.9.a:0 "这是多年来美国圣诞的经典之作。"
 nimatron.10.t:0 "女子飞行队的雷鸟"
 nimatron.10.d:0 "随着女子航空勤务飞行队计划的全面展开，全美各地的女飞行员们纷纷飞上天空。尽管大多数女飞行员都来自富裕的白人家庭，但奥拉·米尔德里德·雷克斯罗特却是一个例外——她是唯一一位在女子航空队服役的堪萨斯原住民女性，有着一半的白人血统，一半的奥格拉拉苏族血统，生于堪萨斯州，作为一名无与伦比的战斗机王牌和空中交通管制员而声名鹊起。在接受PT-19和BT-13教练机的训练后，雷克斯罗特这位飞行女孩已经执行了十几次战斗任务，进化成为了真正的空中死神。她绰号雷鸟，该名号参考了苏族神话中的传奇生物。雷克斯拉特驾驶着她的共和国P-47飞机发挥了巨大作用，赢得了无数空战，并迅捷执行了数次成功的地面支援。作为一个真正的爱国者，一个真正的美国人，一位真正的王牌，雷克斯罗特同其他与其身份相近的人一道，鲜明地提醒着人们，无论背景如何，每个人都可以在这场战争中发挥作用。"
 nimatron.10.a:0 "愿她的双翼带她飞向伟大的神秘乃至更远的地方"
 nimatron.11.t:0 "白衣上校"
 nimatron.11.d:0 "最近，一家新开张便迅速火爆的炸鸡店吸引了来自西部各州的顾客，这一消息在大犹他州乃至更远的地区迅速传开。此家名为“肯德基炸鸡”的新餐馆是“上校”哈兰·山德士本人尝试的第一家特许经营分店。山德士1890年出生于肯塔基州的科尔宾，在大萧条时期首次在路边小摊上售卖目前著名的炸鸡。他花了几十年的时间完善炸鸡配方，其秘诀是“12种秘密香草和香料”。但由于他本人只愿意煎制炸鸡，不喜欢深炸炸鸡，更对连锁店的构想毫无兴趣，因此他自己并未经营这家新的特许经营店，而是将其经营权卖给了好友皮特·哈尔曼，尽管如此，哈尔曼的餐厅还是采用了他的配方。哈尔曼和山德士通过这道配方赢得了大众的瞩目——或者说让他们深深沉醉于其炸鸡的味道，同时也获得了丰厚的利润。有消息称，由于全国似乎都被这股炸鸡热潮所冲击，其他连锁店可能很快就会在犹他州和全国范围内开张！"
 nimatron.11.a:0 "指尖留香，回味无穷"
 nimatron.12.t:0 "解决弹震症问题的新方法"
 nimatron.12.d:0 "随着第二次美国内战的进行，在世界大战期间首次发现的心理现象，即“弹震症”或神经衰弱症，已经变得越发普遍。弹震症和其他形式的创伤后应激障碍被认为是生活在持续的炮击、枪声、爆炸和普遍的暴力死亡之中的影响所造成的一种巨大的心理和精神创伤，并已经迅速开始成为士兵住院以及被迫放弃孩子抚养权的主要原因。\n\n对美国人来说幸运的是，我们的领军研究者和医生们一直在努力寻找解决这一悲惨疾病的治疗方法。从使用电脉冲的电击疗法，到应用乙醚或氯仿等全身麻醉，目前有着多种可能的治疗方法，但疗效因个案而异。另一种引起国民关注的缓解痛苦的新方法是，让富有魅力的丰满护士照顾患者，安抚其需求并照顾他们，同时使用简单的性刺激，试图让士兵忘记他们的创伤。尽管这种特殊治疗的有效性备受争议，但它至少让许多退伍军人更愿意接受治疗。很快，我们将有望让所有的弹震症患者振作起来，并再次参与战斗！"
 nimatron.12.a:0 "让我去战壕吧！"
 nimatron.13.t:0 "美利坚三巨头的面目"
 nimatron.13.d:0 "就像庞培、克拉苏和尤利乌斯·恺撒大帝的非正式伙伴关系，或者屋大维、安东尼和雷必达的联盟一样，我们的新罗马也是由三巨头领导的。在道格拉斯·麦克阿瑟、德怀特·艾森豪威尔和奥马尔·布拉德利的领导下，由参加拯救美国的斗争的英雄们组成的三位一体现在引导着重建的美国回到谦逊、和平、繁荣以及美式自由和秩序理想之下。然而，尽管这三位军队巨人作为一个整体并肩统治，但自然会有一个挺身而出成为领袖。当美国人民准备进入新时代之时，必须选出三巨头中的一位作为国家的脸面。\n\n麦克阿瑟如果被选中继续保持其主导地位，预计他将维持其强硬立场和对军国主义与保守主义的真挚信仰，当然，为了适应战后的现实生活，他那锐利的锋芒不得不收敛一些。艾森豪威尔和布拉德利则都抱有不那么好战的观点，他们目标一致，也就是将重心转向关心美国人民和治愈美国的同时，在一定程度上限制军国主义的发展。\n\n布拉德利支持回归传统的基督教美国和温和保守主义，尤其是他最近时常引用的一句话“我们有无数科学家，却没有什么宗教家。我们掌握了原子的奥秘，却摒弃了耶稣的训谕。人类一边在精神的黑暗中盲目地蹒跚而行，一边却在玩弄着生命和死亡的危险的秘密。这个世界有光辉而无智慧，有强权而无良知。我们的世界是核子巨人、道德侏儒的世界。我们精通战争甚于和平，熟谙杀戮远甚于生存。”艾森豪威尔（支持者亲切地称他为“艾克”）有着类似的想法，即在限制军工综合体发展的同时加大对平民百姓的关心，他寻求更世俗、更开放的自由保守主义思想，他仍然关注军队，但不允许军队左右美国的欲求。\n\n不管谁最终成为三巨头的代言人，这三位真正的美国英雄和自豪的老将将共同引导我们的国家，因为美利坚最终会开始治愈创伤，跨越这个混乱和血腥的时代继续前进。"
 nimatron.13.a:0 "真正的美利坚恺撒，拯救美利坚的男人。我们支持麦克阿瑟！"
 nimatron.13.b:0 "我们仍然热爱艾森豪威尔，他是我们的代表！"
 nimatron.13.c:0 "是时候让明星引导我们了！和布拉德利一起走！"
 nimatron.14.t:0 "德比莱恩会谈"
 nimatron.14.d:0 "今天，英国流亡政府、加拿大政府同新英格兰六州加上纽约州的州长在佛蒙特州的边陲小镇德比莱恩举行了机密闭门会谈。之所以选择德比莱恩这座名不见经传的小镇，是因为其毗邻魁北克省的罗克艾兰，且美加边境线将全镇一分为二。罗克艾兰最标志性的建筑当属哈斯克尔自由图书馆剧院，它由一对美加夫妻出资营造，初衷是为两国民众提供一处文化交流学习的安静之所，而与会双方也正是看中了这一点才选定了这里作会面地点。这次会面不同于美国官员首次会晤外国贵宾的常规流程，主要讨论文化交流项目、经济事务等话题。不过，有传言称此次会面的真正目的是引加拿大人入关，占领新英格兰或是直接将新英格兰并入加拿大本土，以此在国内的政治冲突升级为内战时保全好自身。\n\n此次会面全程对外保密，就连联邦政府也不例外，很难不让人怀疑其中有什么不可告人之事，再加上频出的流言，胡佛总统终于忍无可忍，亲自下令要求参与会谈的各个州长给出个解释。州长们被逼无法，只得交代会上确实谈了些国家陷入内战时的“应急方案”，但这都是次要的，会议上谈的最多的还是些冗杂小事。而当胡佛总统进一步要求其说明“应急方案”的具体内容时，州长们全部选择了闭口不谈。平常若遇到这种情况，联邦调查局之类的机构早就亲自上马了，可在如今的政治乱局下，国内的资源人力早就全部投入了维稳之中，已经捉襟见肘了。没办法，现在就只能接受这么个模棱两可的答案了。"
 nimatron.14.a:0 "给我盯紧点新英格兰……"
 nimatron.15.t:0 "罗克艾兰会谈"
 nimatron.15.d:0 "今天，英国流亡政府、加拿大政府同新英格兰六州加上纽约州的州长在魁北克的边陲小镇罗克艾兰举行了机密闭门会谈。之所以选择罗克艾兰这座名不见经传的小镇，是因为其毗邻佛蒙特州的德比莱恩，且美加边境线将全镇一分为二。罗克艾兰最标志性的建筑当属哈斯克尔自由图书馆剧院，它由一对美加夫妻出资营造，初衷是为两国民众提供一处文化交流学习的安静之所，而与会双方也正是看中了这一点才选定了这里作会面地点。这次会面不同于美国官员首次会晤外国贵宾的常规流程，主要讨论文化交流项目、经济事务等话题。不过，这当然不是此次会谈的真正目的。\n\n与内战气息愈发浓厚的美国其他地区相比，新英格兰的状况则要稳定得多。虽然这里也不乏惹是生非的激进团体，但当地的政治始终牢牢掌握在共和、民主两党的手中。有鉴于此，“存续美国精神之星火”心切的新英格兰各州州长们请求加拿大政府在内战爆发时出兵占领新英格兰，保护新英格兰不卷入这场可怕的冲突。我方代表嗅到了其中的机遇，二话没说就点头同意了，随后便与美方共同拟定了《德比莱恩协议》。一言以蔽之，《德比莱恩协议》要求我国派军入驻新英格兰，而新英格兰的州长们则负责在哈特福德（致敬1814年的哈特福德大会）组建临时政府，说服群众配合驻军工作。这份协议属于双方共同的最高机密，协议的有效期至1940年，如若到时协议仍未得到履行，则视为作废，且为避免日后协议曝光出来诘以卖国之疑，相关文件需悉数销毁。\n\n在美方看来，《德比莱恩协议》就如同绝望中的希望之光，一束能保自己置身内战之外的辉光。而对我们来说，这一协议则是一个宝贵的机会，一个开拓疆土、壮大国力的机会。美国人觉得我们定会遵守协议中的条款，成立新英格兰临时政府，但这可就轮不得他们做主了。我们大可直接吞并新英格兰、设立自治领，将这些州长们辛辛苦苦建设的硕果拿来为己所用，抑或是就当一切都没发生过，放他们鸽子，毕竟这协议只是代表们私下起草的，又没得到议会的正式批准。此外，如果我们决心要履行协议的话，那就得注意这会葬送掉我们与美国之间未来的任何合作可能。总之，多一个干涉新英格兰、奠定临时政府根基的正当理由也没什么不好就是了。"
 nimatron.15.a:0 "我们也许可以好好利用下这份《德比莱恩协议》……"
 nimatron.16.t:0 "艾克治下美利坚的未来"
 nimatron.16.d:0 "参议院中尔虞我诈的虫豸已被除去，堕落为恶龙的麦克阿瑟已被屠戮，正牌的美利坚政府光荣赢得了第二次美国内战，如今，合众国的命运掌握在了德怀特·D·艾森豪威尔将军的手中，而他则要为我们伤痕累累的共和国选出一条最佳的前路。艾克（艾森豪威尔的小名）的面前摆着三条道路：一，追随伟大的马克·安东尼的脚步，与奥马尔·布拉德利将军、威廉·D·莱希海军上将组成三头同盟，以防再出现第二个麦克阿瑟；二，以更加温和、更加包容的奥古斯都·恺撒之姿取代麦克阿瑟的位置，引领愈合当中的军政之国；三，牢记初心，不忘使命，还权于美利坚人民，建立起不受参议院的中饱私囊和行政专制所玷污的直接民主，成就现代辛辛纳图斯的美名。到底哪条道路才最适合美国、她的人民以及我们共同的未来，一切全凭艾克决断。"
 nimatron.16.a:0 "我们仍然爱戴艾克！愿他成为美国的奥古斯都！"
 nimatron.16.b:0 "正如过去的马克·安东尼一般，艾克将领导新三头同盟"
 nimatron.16.c:0 "美国的辛辛纳图斯屈从于人民的意志"
 nimatron.17.t:0 "自由卫士"
 nimatron.17.d:0 "孤立主义向来是美国的国家首席战略，哪管外面的世界洪水滔天，德俄英法在欧洲争个头破血流、世界大战打得火热又与我何干，只要不威胁到美国本土，那就万事大吉。不过，时代变了，我们现在竟陷入了同旧大陆最强大国家——德意志帝国的战争之中。欧洲战场远在千里之外，许多国民和政治精英都反对、抵制让我们的小伙子们远渡重洋、客死他乡，不过也并非所有人都是如此。\n\n漫画家乔·西蒙和杰克·科比便是例外，两人坚信对德战争的正义性，并秉持着这一信念创作出了漫画人物美国队长。美国队长原名史蒂夫·罗杰斯，虽身材瘦小却如其作者一样相信着战争之正义，在满腔爱国热血的驱动下接受了血清改造，化身为了力量、敏捷、体力、智力均达到人类潜力极限的超级战士。他穿着饰以美国色彩的制服，带着自己的盾牌，同自己忠实的搭档巴基，还有上万名将士一起踏上了战场，与德国人决一死战。该系列漫画的第一卷以正在痛扁德皇的美国队长为封面，取得了巨大的成功，销量超过了百万，极大地振奋了部队的士气，也推动了征兵运动的顺利进行。"
 nimatron.17.a:0 "给他们点颜色看看，队长！"
 nimatron.18.t:0 "糖果大亨能行吗？"
 nimatron.18.d:0 "虽然在许多人看来，相比起欧洲的富丽堂皇，美国就像是一个人傻钱多的暴发户，但若要论精致典雅，繁杂的美国文化和生活方式中也有很多方面完全不输于傲慢自大的老欧洲，好时公司便是其一。上世纪七八十年代，初入焦糖行业的米尔顿·S·赫尔希犯了不少商业错误，把家底赔了个精光，一夜之间从家乡兰开斯特县的天之骄子成了众人的笑柄，还因选票问题遭到了县官塞缪尔·威廉·迪勒一万美元的敲诈，与共和党官员发生了冲突。1903年，赫尔希来到了宾夕法尼亚州的德里小镇，在这里创办了好时公司，此后，好时公司越做越大，本部逐渐发展为了一座自治企业小城，赫尔希也跃身为了美国的巧克力大亨。不过，赫尔希的目光并没有被糖果所局限，他不仅利用自己的权力、财富和私人家业资助了联邦政府的战时生产，还以亲联邦政府的自由主义资本家共和党员身份步入了政界。\n\n赫尔希与我国的军工复合体关系亲密，他的生意因此得到了华盛顿政府的长期照顾，甚至好时小城还获准正式成为了一座自治企业之地，就像华特·迪士尼的公园那样。支离破碎的共和党一直在寻找一位能够被大众认可的新面孔来作为自己的总统候选人，米尔顿·S·赫尔希似乎就是这么一个完美的人选，不过，赫尔希的商业嗅觉虽能支撑他游刃有余地控制美国最大的商业帝国之一，但追根问底，他只是名糖果富豪，缺乏政治经验，眼高手低，把党交给他后果不堪设想。那么，赫尔希的政治抱负究竟能不能成真呢？"
 nimatron.18.a:0 "政治可不是儿戏，把这位巧克力大亨送回工厂去！"
 nimatron.22.t:0 "勿忘最初的盟友"
 nimatron.22.d:0 "时间拨回到1777年，彼时的摩洛哥苏丹穆罕默德三世为改善国家的对外贸易，寻找潜在的盟友与市场，第一个站出来承认了新独立的美利坚合众国的主权和合法性。苏丹先是颁布法令，规定美国的商船可以经由摩洛哥的海域安全进出地中海而无需担心英国海军的报复，之后摩洛哥政府的经济更是与美国绑定在了一起，无论风雨，无论彩虹，皆同舟共济。之后的十几年间，两国为巩固这一关系都做出了不同程度的努力，到了1786年，两国正式签署了友好和平条约，自此，这一关系便上升到了官方层面，而这份条约也是美国历史上维系时间最长的对外条约。虽然摩美两国充其量只是贸易合作伙伴，但从理论上来说，摩洛哥确实是美国最古老的盟友，比在美国革命期间帮助过我们的法国人还要早，因为1801至1805年的巴巴里战争我们在突尼斯和利比亚周遭作战期间，摩洛哥就曾配合过我们北非港口，阻止海盗入内停泊。\n\n不过，今时早已不同往日，摩洛哥如今苟活在外国强权与帝国主义霸权的铁靴之下，眼巴巴盼望着大洋彼岸的华盛顿能够救自己于危难。那么，我们是要拉上老盟友一把，还是为自己着想，背弃摩洛哥，背弃这一数百年历史之久的“同盟”呢？"
 nimatron.22.a:0 "重申古老同盟！"
 nimatron.22.b:0 "航向卡萨布兰卡，救出老朋友！"
 nimatron.22.c:0 "摩洛哥生来就注定成为美国的第五十一个州，向拉巴特进发！"
 nimatron.22.e:0 "在黑暗大陆上打地面战，脑子抽了吧"
 nimatron.23.t:0 "非裔美国人音乐新流派"
 nimatron.23.d:0 "自世纪之交以来，黑人艺术、媒体火遍全美，爵士乐、民间福音等美国特有的表现形式也以迅雷不及掩耳之势俘获了全世界的心，而非裔美国人乐队禧年便是推动这场音乐与文化盛宴滚滚向前的先驱之一。禧年乐队原名王家和谐乐组，其成员包括奥维尔·布鲁克斯、西奥多·布鲁克斯、凯勒布·金亚德和乔治·麦克法登，四人都是国王唱片旗下主打黑人音乐的王后唱片的签约歌手。乐队的作品《赞美上帝，传递弹药》、《彼年此刻》、《以西结（看那舵轮滚滚而来）》、《全能之主终结尔命》、《摩西出山》、《上帝今早呼唤了我》、《敲响那口金钟》等取得了巨大的成功，在排行榜上屡创新高，禧年也成了全国家喻户晓的名字，而乐队本身也因此得到了用国王唱片之名发行音乐的权利，而这通常都是人气最高的白人歌手才能享受到的待遇。\n\n禧年乐队的最新力作——1946年推出的博普乐《诺亚》同其以往的爵士乐、福音乐和民歌风格都大相径庭。禧年乐队没有止步于过去一连串的成功，在创作风格上大胆创新，将节奏说唱、紧凑节拍同西非说唱人传统的呼答式风格结合在了一起，为饱受蹂躏的底层人们创作出了一种新的音乐流派。在禧年乐队及同时代同样致力于这一流派的黑人音乐团体（如费耶特维尔的比尔·柯蒂斯及其背膘乐队）的努力下，这种以抒情为主的“说唱乐”迅速风靡于城乡的少数族裔之间，不过，古典传统的主流乐界却并不看好它，像极了他们的祖辈不看好爵士乐的样子。未来会如何评判说唱乐，我们不得而知，但在背膘乐队和禧年乐队这样的艺术家对音乐边界孜孜不倦地探索下，音乐从此将不再是我们所熟知的模样。"
 nimatron.23.a:0 "大伙暂时还接受不了，不过我们的孙辈肯定会喜欢"
 nimatron.24.t:0 "趁热打铁"
 nimatron.24.d:0 "温德尔·威尔基总统平易近人的亲和力、在民权事务与改善中下层阶级生活水平的经济改革中所展现出的对进步与廉洁共荣的不懈追求，以及超脱于党派政治之外，朋友遍四方的那份超然，都让其收获了国内民众以及国外贸易、外交伙伴的双双认可，人气与支持率随之飙升，国家也迈入了全新的黄金时代——“威尔基时代”。亲手耕耘而来的民望把身为多元主义者、理想主义者的威尔基推上了新的高度，而他的身体状况也在亲朋好友及医生的照料下得到了好转，如今的威尔基终于可以一门心思扑在国事上，着手建设更为庞大的宏图了。\n\n威尔基认为，当代的世界有三种“预想地理格局”。第一种是“名义普世”，即交通与通讯方式的进步迅速拉近了彼此之间的距离，以前所未有地速度推动着国际之间的合作与去殖民化。第二种地理格局不再把当今的全球冲突视为自由与极权的争锋，而是种族主义与帝国的对峙，是对欧日殖民主义与美国种族隔离之道德性的挑战。第三种地理格局是影子帝国，亦即美国等列强所暗中施加的隐性帝国主义、经济支配与“新殖民主义”，威尔基厌恶影子帝国，认为其应让位于全球合作。威尔基的畅销书《天下一家》拆穿了美国数十年来构建起的孤立民族主义与种族主义思想，促成了现代美国最重要的以此思想转变，而如今，威尔基打算践行书中所写，建立起统一的一世一界联邦，或者某种类似于过去国联的全体合作体系。那么，我们是要趁着威尔基如日中天、世界各地群起而响应的当口，启动这一艰巨的任务呢，还是坚持以美国为先呢？"
 nimatron.24.a:0 "我们即是天下一家的先头使者！"
 nimatron.24.b:0 "对协约国加以人性化改造，促成人世乐土"
 nimatron.24.c:0 "我们将与德国人一同，共迎名义普世"
 nimatron.24.e:0 "反帝解放的重担舍我们与俄罗斯其谁！"
 nimatron.24.f:0 "维也纳的联邦之主将带领我们走向天下一家！"
 nimatron.24.g:0 "去他妈的繁文缛节，拯救世界就是要靠实力"
 nimatron.24.h:0 "以美国国内为重"
 nimatron.25.t:0 "美国第一位首席芭蕾伶娜"
 nimatron.25.d:0 "美国第一位首席芭蕾伶娜宣布诞生后，咱美国人终于算是迈进了精英国际俱乐部的殿堂。这位新星于1925年出生在俄克拉何马的费尔法克斯，其欧塞奇语名为契贺卡丝妲莎，不过要是说起知名度，她的白人名伊丽莎白·玛丽·托尔·奇夫和艺名玛丽亚·托尔奇夫更为人所知，有了在纽约芭蕾舞团的历练，托尔奇夫已经成了美国首屈一指的芭蕾伶娜。在著名芭蕾舞编导乔治·巴兰钦的指导下，托尔奇夫的作品不仅彻底改变了美国芭蕾舞，更是对全球各地的芭蕾舞产生了深远影响，她本人也一跃成为了赫赫有名的国际人物。同时，在她的积极活动之下，欧洲白人和美洲原住民之间的紧张关系也得到了缓解。身为女性权利的倡导者，她的存在激怒了美国各地的保守派和传统主义者，尽管如此，她仍是全美国女性、原住民和艺术爱好者的灯塔。多亏了她，说不定现在欧洲那群心高气傲的芭蕾舞势利眼能更尊重我们一点……"
 nimatron.25.a:0 "我等真正的美国人岂能在文化上落后于人？"
 nimatron.26.t:0 "因色致死"
 nimatron.26.d.csa:0 "常言道：好奇害死猫，在最近警方处理一起在密歇根州乡村地区发生的离奇死亡案件的过程中，这句老话又一次得到了印证。美国经济近来持续低迷，大众也无暇顾及偏远城镇和乡村，某个窃贼正欲图趁此大发横财，最后却死在了一个小镇的图书馆中，现场既未有他杀自杀的证据，亦未有凶器和发生过搏斗的迹象，唯有中毒致死一种可能。而后，经过分析与对案发现场的彻底调查，这起案件的罪魁祸首终于水落石出——一本书。看来这个窃贼的死完全是个意外，他在读完一本乍看上去无甚特别之处的书后中毒，最后一命呜呼，而这本书正是那臭名昭著的《死亡之墙的影子》。\n\n该书全名为《死亡之墙的影子：有关含砷墙纸标本的事实与推论》，其由罗伯特·C·凯杰博士于1874年出版付梓，他居住在密歇根州，曾是内战期间的外科医生，后获博士学位，成为了一位化学家。该书的本来目的是为了警示大众，书中共展示了86种设计各异的、曾在19世纪风靡美国的墙纸样品，每种墙纸中都含有席勒绿颜料或是其它类似颜料，而这些颜料中的亚砷酸铜及其他砷基染料均已达到危险含量。作者本意虽好，但因其中的致命致危成分，该书已被禁止发行。这倒不是没有道理的，毕竟现在真有个人被这本书里的杀人壁纸毒死了！\n\n原书仅有100份副本，而在被禁止发行后，大部分副本都被销毁，或是落入私人收藏家之手。为防止这浸透了砷的杀人机器再酿成命案，州政府正着手推行“毒书计划”，该计划以依靠革命期间于杜邦家族处收缴的资金、地产建成的特拉华州温特图尔博物馆、花园和图书馆为场所，其目的在于收藏、保存、保护《死亡之墙的影子》以及其它使用含砷或其他致命成分的墨水及颜料的书籍的存世副本，以便对其进行研究记录，并使之远离过分好奇之人的窥探。"
