 american_conservatism_subtype_desc:0 "§Y美式保守主义§!\n\n美式保守主义是一种源自美国建国初期的政治思想体系，其核心精神并非一成不变的教义，而是一种对秩序、自由与传统之间平衡的追求。它继承了启蒙时代的自然权利理念，却同样警惕理性主义的狂热与乌托邦式的改造冲动。美式保守主义者普遍认为，美国的伟大在于其宪政制度、个人责任、以及信仰与自由的相互制衡。\n\n在政治与经济层面，美式保守主义提倡有限政府与自由市场经济，反对国家过度干预私人事务，强调私有财产与法治的重要性。文化上，它重视家庭、宗教与地方共同体的价值，认为这些才是维系社会团结与道德秩序的基石。与此同时，美式保守主义也如诸多美国本土意识形态一样，对左翼思想与主义有着强烈的敌视态度，并主张以强大的国防和坚定的爱国精神捍卫“美国方式”的自由世界。然而，美式保守主义并非铁板一块——从古典自由派的自由至上论，到杰克逊主义者们鼓励政治分权与小农经济至上的号召，再到更加保守的迪克西派的强烈反对自由主义与民权运动的诉求。如大帐篷一般的美式保守主义的最终目标，是在迅速变化的现代社会中维持美国的核心价值：自由的个体、责任的公民、受限的政府与信仰的力量。对于他们而言，真正的进步不在于抛弃过去，而在于让过去的智慧指引未来的方向。"
 autdem_american_conservatism_subtype:0 "美式保守主义"
 autdem_american_conservatism_subtype_desc:0 "§Y美式保守主义§!\n\n美式保守主义是一种源自美国建国初期的政治思想体系，其核心精神并非一成不变的教义，而是一种对秩序、自由与传统之间平衡的追求。它继承了启蒙时代的自然权利理念，却同样警惕理性主义的狂热与乌托邦式的改造冲动。美式保守主义者普遍认为，美国的伟大在于其宪政制度、个人责任、以及信仰与自由的相互制衡。\n\n在政治与经济层面，美式保守主义提倡有限政府与自由市场经济，反对国家过度干预私人事务，强调私有财产与法治的重要性。文化上，它重视家庭、宗教与地方共同体的价值，认为这些才是维系社会团结与道德秩序的基石。与此同时，美式保守主义也如诸多美国本土意识形态一样，对左翼思想与主义有着强烈的敌视态度，并主张以强大的国防和坚定的爱国精神捍卫“美国方式”的自由世界。然而，美式保守主义并非铁板一块——从古典自由派的自由至上论，到杰克逊主义者们鼓励政治分权与小农经济至上的号召，再到更加保守的迪克西派的强烈反对自由主义与民权运动的诉求。如大帐篷一般的美式保守主义的最终目标，是在迅速变化的现代社会中维持美国的核心价值：自由的个体、责任的公民、受限的政府与信仰的力量。对于他们而言，真正的进步不在于抛弃过去，而在于让过去的智慧指引未来的方向。"
 natpop_christian_crusade_subtype:0 "基督教圣战思想"
 natpop_christian_crusade_subtype_desc:0 "§Y基督教圣战思想§!\n\n身为爱国牧师兼“战斗的鲍勃”拉福莱特拥趸之后，基督之门徒、炽烈之政客杰拉尔德·莱曼·肯尼思·史密斯注定会投身于民粹的洪流。遍游全国，目睹物质腐化、道德沦丧、赤贫蔓延及种族混杂侵蚀白人美国之核心后，史密斯愈发坚定了自己的理念：开国元勋所建的基督教文明业已倾颓。短暂任职什里夫波特劳联的牧师后，史密斯遇到了自己毕生所见最为宏阔的政治工程——休伊·朗的“财富共享”计划，遂成为了“王鱼”的铁杆追随者，铁杆到遭人讥为“狗腿子史密斯式朗派”，更与查尔斯·库格林神父、弗朗西斯·汤森共同组成了至上党的“三剑客”。史密斯这位当代的萨伏那洛拉带着朗一派的右翼，创建了基督教民族主义圣战组织，既为分产改革而战，更为抗击威胁十字架与星条旗的“杂化”浪潮而战。据史密斯所言，近日之纷争、文化侵蚀、赤色渗透及黑人骚乱，皆系上帝永世之敌——犹太人所为，唯使美国重归基督教民族本源，方可击溃锡安长老圣教会的统治，净化国家面目。圣战组织虽认同北欧主义的基督教一派与英式以色列主义，但史密斯本人拒奉此道。国贼口中的这位“仇恨布道者”，唯一的执念便是将白人美国从闪族人及其披着进步外衣的盟友手中拯救出来。"
 POLITICS_JOHN_PERSHING_DESC:0 "约翰·J·潘兴，外号“黑杰克”的他是当今美国尚在世的最杰出军人之一，在几十年的军旅生涯中御人无数，包括麦克阿瑟在内的许多内战名将都曾在他手下学习。潘兴将军于1860年 9 月 13 日出生在密苏里州拉克莱德附近的一个农场。1878年高中毕业后，潘兴竞争进入美国军事学院。他在考试中表现出色，并获得了国会议员约瑟夫·亨利·伯罗斯的任命。潘兴于 1886 年夏天毕业，并于1887年9月 30 日报到服役，开始了他长达数十年的军旅生涯。他的军事生涯始于镇压各地的印第安人，并多次因他的勇敢行动而受到表扬。\n\n1892年10月20日，潘兴晋升为中尉，并在五年后进入西点军校担任教官。由于他的严格和死板，潘兴不受学员欢迎，学员们称他为“黑鬼杰克”，后来演化成为了那个伴随他一生的称号“黑杰克”。在随后的美西战争与菲美战争中，潘兴的表现受到了西奥多总统的赞叹。尽管总统有意晋升他，但最终由于他资历太浅而被陆军参谋部拒绝。但最终总统在1905年动用总统权力将他越级提拔为准将，这引起了许多人的指责。1916年，时任少将的潘兴领导了那场并不值得宣传的远征行动。尽管结局不尽人意，但潘兴在军中的威望也有增无减，直到他在1924年退出现役。20世纪30年代，潘兴基本上退出了公众生活，但随着回忆录的出版，他又重新回到了公众视野。"

