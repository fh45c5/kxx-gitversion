 USA_constitutional_convention:0 "内战胜利者"
 USA_constitutional_convention_desc:0 "分裂分子企图摧垮美利坚合众国的阴谋再度归于失败。尽管激进社会主义与民粹主义者险些击碎我国的权力基石，联邦政府再度向世界证明了自己不可抵挡的力量。企图成为独裁暴君的比尔·海伍德与休伊·朗将被美国人民世代唾弃！"
