 DISUNITED_STATES_INTRO:0 "§R美利坚倾颓，军阀割据，诸邦离心，无尽争锋角力。旧日合众国之衣钵，无人承继其重。阋墙之战永劫，自由之乡，勇者之土，纷争无期。§!"
 USA_native_code_talkers_idea_desc:0 "随着我方作战计划和其他敏感信息的不断泄露，在这场受诅咒的战争中，我们需要一个新的加密来源，以确保那些该死的分裂主义者对我们的计划一无所知！为此，我们将向北亚利桑那州的纳瓦霍人求助。纳瓦霍人的语言非常复杂，而且人数也不多，他们的语言将是加密我方信息的最佳选择！"
 amcivwar_idea_desc:0 "我们不仅仅是为了我们的领导人、土地或财产而战，而是为了我们的理想而战！我们要让所有的美国人都能安全、快乐、健康地生活！我们决不会屈服！"
 USA_small_arms_industry_idea_desc:0 "美国的枪械工业无疑是世界上最伟大的。该死的，在上次大战中，法国人和德国人都争相排队，只为一探我们美国先进优越的武器技术！有着温彻斯特和柯尔特这样闻名遐迩的品牌，我们自然能像上一次内战那样轻松地驱使这些武器巨头！"
 USA_auto_industry_idea_desc:0 "毫无疑问，美国的汽车工业是世界上最优秀的，从经典的T型车到凯迪拉克和别克的华丽车型，我们应有尽有。随着将军们越发强调机械化的必要性，再加上我们庞大的石油储备，如果不利用这个难得的机会，创建世界上的第一批机械化军队，那才是傻子呢！遗憾的是，福特家族背叛了国家，但通用汽车仍在制造出色的卡车！"
