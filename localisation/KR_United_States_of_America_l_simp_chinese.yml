 USA_HOTB_GATHERING_STORM_DESC:0 "美国正处于1865年以来最严重的政治动荡之中。很少有人能预料到成功避开世界大战的破坏的美国会最终落入如此境地，但工团主义的兴起引发了政界的红色恐慌，经济也因工人罢工和政治混乱而陷入低迷。赫伯特·胡佛在1928年的选举中获胜，承诺恢复美国的常态，但由于1929年的股票大崩盘，他的承诺没有取得任何进展，而通过众议院连任只损害了他总统之位的合法性。如今，美国政治受到众多激进势力的挑战，他们都以自己的方式承诺，一旦当选，势必会终结当前的政治状况。"
