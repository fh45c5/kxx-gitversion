#平民党/国家人民党
USA.800.t:0 "平民的呐喊"
 USA.800.d:0 "在1936年的大选中，政治局势混乱与众多候选者极大的增加了选举的混乱程度，而最终也没有任何总统竞选者获得多数选民的支持。最终众议院挑选了选择他们的前议长、民主党人约翰·南斯·加纳和他的竞选伙伴阿尔·史密斯赢得了选举，以确保激进势力得到彻底的镇压与控制，同时维护美利坚的民主制度。最终，“仙人掌杰克”做到了向众议院的议员们许下的承诺：社会党与美利坚至上党被民主党与军队的铁拳砸得粉碎；南方的3k党也因首脑们被调查与抓捕而四分五裂；旧民主党的支持者们也大多回到了民主党的怀抱之中，而这将本就保守的民主党变得更加右倾。然而，进步力量此时受到的打击毫无疑问是前所未有的。进步党几乎丢掉了绝大部分的参议院与众议院势力，而他们的政治机器也在民主党的打压下难以为继，苟延残喘。而此时共和党则一如既往的陷入了内斗与纷争，自由派人士与保守派成员争斗得你死我活，其在政坛中的影响力也大幅度减弱。\n\n作为曾经的反建制派领头羊，社会党与美利坚至上党的境遇同样糟糕：工人运动的规模与热情随着政府对工会的拉拢与行政打压逐渐冷却，而革命导师威廉·“大比尔”·海伍德的意外去世则更加打击了社会党。随着时局变动，社会党彻底抛弃了曾经的彻底革命论调，转而呼吁类似费边社会主义或是民主社会主义等温和的左翼诉求。另一方面，美利坚至上党由于民主党的农业政策与对准军事组织的打击而快速衰落，尽管朗在南方仍然保有着一定的影响力，但几乎无法再度像36年一般成为热门总统候选人。\n\n对于朗与里德来说，如今为了再度获得入主白宫的机会，必须团结全美的一切进步力量以在即将到来的大选中威胁民主党的连任。为了达到这个共同的目的，朗与里德，以及至上党与社会党如今的党内重要成员在圣路易斯进行了一场会面。在会谈中，两党达成了共识，确定了最基础的进步主义与平民主义的竞选纲领，同时两党的组织将被合并为平民党以团结双方党员。在接下来的竞选活动中，朗与里德将争取全美国范围内所有支持进步主义与社会主义的人士的支持。根据如今的民调显示，他们击败民主党的概率仍旧渺茫，但不断扩大的竞选活动规模与越发高涨的社会呼声也为一切转折留下了可能。"
 USA.800.a:0 "我们将战斗到底！"
 USA.801.t:0 "人民之呼声"
 USA.801.d:0 "在1936年的大选中，政治局势混乱与众多候选者极大的增加了选举的混乱程度，而最终也没有任何总统竞选者获得多数选民的支持。最终众议院挑选了选择知名进步人士与政治家乔治·诺里斯为总统，以确保激进势力得到彻底控制，同时维护美利坚的民主制度。尽管被绝大多数人认为是一个妥协的折中产物，但进步党的确稳定了政治局势并将美国带出了经济危机的泥沼。然而，整个美国的保守势力与民族主义者则遭到了巨大的打击，尤其是旧民主党以及全国白人联盟，彻底失去了美国南部的掌控权。而民主党也遭到了重大打击，在多年的选举失利后，民主党的政治机器逐渐衰朽，而支持者也被其他党派逐步瓜分。然而旧民主党的首脑威廉·默里则不甘心就此失败，他决定以旧民主党的剩余成员为基本盘，团结一切保守派力量以组成一个能够与进步党分庭抗礼的大帐篷党派。\n\n过去，保守派力量尽管规模巨大，但他们大多各自为战，民主党，旧民主党，至上党以及一些不入流的小党派与政治团体稀释了保守主义的可怕力量。然而，在进步党前所未有的胜利面前，几乎所有的保守派，传统主义者，农业主义支持者与极端主义者都团结在了一面旗帜下。尽管他们的诉求各不相同，甚至足以撕裂整个党派，但进步力量的巨大威胁仍然暂时的团结了这个大帐篷，现在，这些人将尝试挑战进步人士的统治。在亚特兰大的一场集会上，默里与他的盟友查尔斯·林德伯格宣布将旧民主党改组为国家民主党，并得到了保守主义和传统主义者们的广泛支持。随着国家民主党的不断扩张，越来越多的右翼势力开始聚集，逐渐成为了一支有机会角逐1940年总统大选的不可忽视的劲旅。"
 USA.801.a:0 "我们将战斗到底！"
 USA.802.t:0 "旧金山会议"
 USA.802.d.sinclair:0 "随着平民党在中西部与南方逐步站稳脚跟，其领导层开始将目光投向西海岸。加利福尼亚不仅拥有庞大的人口与经济体量，也长期是进步主义、改革运动与激进思想的重要土壤。若能在此建立稳固据点，平民党的全国性竞争力将得到质的提升。\n\n为实现这一目标，平民党试图争取作家与政治活动家厄普顿·辛克莱的支持。尽管他的“终结加州贫困”计划在1934年的州长选举中未能成功，但这一运动在西海岸留下了深远影响。大量基层组织、工会活动人士与进步派选民，仍然将辛克莱视为反对既得利益、挑战旧政治机器的象征人物。尽管民主党仍旧试图渗透加州，但如今以加利福尼亚为首的西海岸诸州仍旧是自由派人士与进步主义者的牢固堡垒。\n\n出于对这一潜力的重视，里德将亲自前往旧金山，与辛克莱展开会谈。这次会面被视为平民党全国扩张战略的重要一步。在旧金山，里德与辛克莱就竞选纲领、组织合作以及如何动员选民进行了长时间讨论。辛克莱表达了对平民主义理念的认同，但也对大帐篷式政党的团结与统一纲领持保留态度。最终，当两人走出谈判场所并见到围在会场外的诸多记者与媒体时，他们向铺天盖地的媒体们宣布了谈判的结果..."
 USA.802.d.hearst:0 "随着国家人民党在中西部与部分内陆州逐步扩大影响，其开始将注意力转向西海岸。加利福尼亚不仅拥有庞大的人口规模与经济体量，更是全国舆论、媒体与资本力量高度集中的地区。若无法在这里打开局面，国家人民党的全国竞选将始终存在明显短板。\n\n在这一背景下，威廉·鲁道夫·赫斯特的支持就显得格外重要。尽管赫斯特本人在过去并未过多参政，但他在西海岸乃至整个美国所掌控的媒体网络与社会影响力，使其成为足以左右政治风向的关键人物。对国家人民党而言，获得赫斯特的支持，意味着不仅能接触到更广泛的选民群体，也能在舆论战场上与民主党及其盟友正面抗衡。出于这一考量，查尔斯·林德伯格亲自前往旧金山，与赫斯特展开会谈。这次会面被视为林德伯格—默里全国巡回访问的第一站，也被党内视为国家人民党向进步主义掌控地区进军的重要信号。在会谈中，赫斯特对国家人民党的政治立场表示理解，同时也对国家人民党的未来表示出了相当的兴趣。作为支持国家人民党的回报，赫斯特希望自己能够获得在党的举足轻重的政治话语权，甚至计划在胜选后要求内阁职位。\n\n当两人结束会谈、走出会议场所时，守候已久的记者立刻蜂拥而上。最终，他们向铺天盖地的媒体们宣布了谈判的结果..."
 USA.802.a:0 "谈判取得了成功！"
 USA.802.b:0 "谈判失败！"
 USA.802.c:0 "谈判取得了成功！"
 USA.802.e:0 "谈判失败！"
 USA.803.t:0 "奥马哈会议"
 USA.803.d.norris:0 "在平民党寻求扩大其全国影响力的过程中，中西部始终被视为一道必须跨越的门槛。相比沿海地区的进步立场，这片地区的选民相对更加保守，也更重视制度连续性与领导者的个人魅力。在这样的背景下，乔治·诺里斯的名字自然被提上日程。\n\n尽管在上一轮选举中失利，诺里斯依旧是中西部最具分量的进步主义政治人物之一。他长期倡导反垄断、公共电力与政府责任，同时又主张维持与保卫民主制度而非向激进党派屈服。正因如此，他的支持往往能够号召大部分中西部乃至全国的进步主义者。为了尽可能增强平民党的竞选力量，诺里斯的支持也至关重要。作为平民党全国巡回访问的一部分，休伊·朗在奥马哈与诺里斯进行了会面。双方就农业政策、公共工程以及选举策略展开了长时间讨论。朗试图向诺里斯证明，平民党并非一时兴起的民粹联盟，而是一支有能力在全国范围内执政的政治力量；而诺里斯则并未直接表达自己对平民党的支持。但他也认为，平民党是如今美国政坛中唯一有希望击败保守主义者与民主党的党派。\n\n最终，当两人走出谈判场所并见到围在会场外的诸多记者与媒体时，他们向铺天盖地的媒体们宣布了谈判的结果..."
 USA.803.d.pelley:0 "在国家人民党试图扩大其全国影响力的过程中，中西部同样被视为一道必须跨越的门槛。与沿海地区复杂而多变的政治生态不同，这片地区的选民更容易被强烈的政治叙事与个人魅力所动员，而非空洞的数据与复杂的意识形态理论。在这样的背景下，威廉·达德利·佩利的名字自然浮出水面。\n\n尽管佩利的政治影响力无法与休伊·朗或其他全国性人物相提并论，但他在至上党残余选民与激进民族主义者中仍然拥有不容忽视的号召力。他长期以鲜明而极端的政治语言塑造自身形象，成功将一部分对传统政党彻底失望的选民维系在自己的政治圈层之内。同时，其手下的准军事组织银衫军由于在过去规模不大而躲过了联邦政府的打击，而现在银衫军也仍旧是一股不容忽视的政治力量。正因如此，他的公开立场往往能够在关键州左右大量选票的流向。\n\n为了争取这一潜在支持，威廉·默里将代表国家人民党前往奥马哈，与佩利展开会谈。这次会面被视为全国巡回访问的重要一站。双方围绕选举策略、政治宣传以及如何整合激进选民群体进行了长时间讨论。默里试图向佩利证明，国家人民党能够为其支持者提供一个更具现实胜算的保守主义政治平台；而佩利则对是否放弃自身独立立场保持谨慎态度。同时，他还希望未来国家人民党将放弃对准军事组织与极右翼团体的限制。\n\n当两人结束会谈、走出会议场所时，守候已久的记者立刻蜂拥而上。最终，他们向铺天盖地的媒体们宣布了谈判的结果..."
 USA.803.a:0 "谈判取得了成功！"
 USA.803.b:0 "谈判失败！"
 USA.803.c:0 "谈判取得了成功！"
 USA.803.e:0 "谈判失败！"
 USA.804.t:0 "波士顿会议"
 USA.804.d.aiken:0 "在平民党的全国扩张计划中，新英格兰始终是一块难以绕开的地区。这里的选民对激进思潮始终敬而远之，却对制度改革与公共责任并不陌生。而进步主义者乔治·艾肯正是这一政治生态的缩影。作为来自佛蒙特的进步派人士，他以务实著称，在农业改革、公共政策与政府责任等议题上拥有稳定而广泛的支持基础。尽管他从未完全认同平民党的运作方式，但其政治立场与平民党的部分核心主张存在交集，使他成为新英格兰地区最具分量的潜在支持者之一。同时，进步党在1936年的失败与在这四年间的逐步崩溃也使得他本人与平民党之间的联系逐步加深。\n\n为争取乔治·艾肯这一关键背书，休伊·朗与杰克·里德共同前往波士顿，与艾肯展开会谈。这也是平民党全国巡回访问的最后一站。三人在会谈中围绕竞选纲领、地区政策以及平民党未来可能承担的执政责任进行了深入讨论。朗试图证明，平民党能够将改革诉求转化为可执行的国家政策；而里德则强调平民党的组织与团结将会保证未来执政的可靠性。而艾肯则希望平民党能够统合包括新英格兰地区在内的东北部进步派并在未来的内阁中提供职位。\n\n最终，当两人走出谈判场所并见到围在会场外的诸多记者与媒体时，他们向铺天盖地的媒体们宣布了谈判的结果..."
 USA.804.d.dupont:0 "在国家人民党的全国扩张计划中，新英格兰同样是一块难以回避的地区。这里的选民对激进动员与群众政治普遍持怀疑态度，却对个人自由、地方自治与经济独立抱有深厚的历史认同。阿尔伯特·诺克正是这一政治传统的代表人物。作为新英格兰最具影响力的残余派领袖之一，他长期以鲜明的自由意志主义与经济自由主义立场塑造自身形象，在反对集中化权力、警惕国家干预等议题上拥有稳定的支持群体。尽管他的政治理念与国家人民党的部分主张不和，但在反建制、反进步党的立场上，双方并非毫无交集。随着传统保守派政党的衰落，诺克及其追随者也开始重新评估自身在全国政治中的位置。\n\n为争取这一关键背书，威廉·H·默里与查尔斯·林德伯格共同前往波士顿，与诺克展开会谈。这同样是国家人民党全国巡回访问的最后一站。会谈中，默里试图向诺克保证，国家人民党并不意在建立一个高度集权的政治机器，而是为被主流政治排除的群体提供发声渠道；林德伯格则强调秩序、国家与个人自由之间并非不可调和的矛盾。而诺克对双方的陈述保持审慎态度。\n\n最终，当两人走出谈判场所并见到围在会场外的诸多记者与媒体时，他们向铺天盖地的媒体们宣布了谈判的结果..."
