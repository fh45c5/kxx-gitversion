 ustates.651.c:0 "叛徒给老子从美国滚出克！"
 ustates.652.t:0 "审判前太平洋国将领"
 ustates.652.AUS:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前太平洋国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，令最高指挥部震惊的是，德拉梅萨·艾伦将军向政府递交了一份他认为值得进行改造的高级将领名单，并提供了充分的证据证明马歇尔将军无罪，其所作所为皆是“服从正当命令”。尽管他提出了要求并提供了证据，但毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.652.USA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前太平洋国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，令最高指挥部震惊的是，艾森豪威尔将军支持赦免他过去的同学们，尤其是乔治·马歇尔，他引述了他们在内战前的杰出服务，坚称他们叛变是处于少见的状况并且他们对美国宪法无可置疑的忠诚是证明他们无罪的证据，但与他的辩护相对的是，陪审团认为他可能因为他在内战前是马歇尔的朋友及下属进行偏袒，并且毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.652.CAR:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前太平洋国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，巴顿递给政府一份列举了值得并且合适于赦免的高级将领名单，其中有充足的证据证明马歇尔和德·维特将军只是服从命令。即使他提供证据并提出了要求，毫无疑问，在美国最黑暗的时刻他和许多将领出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.652.a:0 "赦免他们"
 ustates.652.b:0 "开除他们的军籍"
 ustates.652.c:0 "叛徒给老子从美国滚出克！"
 ustates.6520.t:0 "审判前宪政国政府将领"
 ustates.6520.AUS:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前宪政国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，令最高指挥部震惊的是，康纳将军支持赦免他过去的同僚们，他引述了他们在内战前的杰出服务，坚称他们叛变是处于少见的状况并且他们对美国宪法无可置疑的忠诚是证明他们无罪的证据，但与他的辩护相对的是，陪审团认为他可能因为他在内战前是巴顿的朋友及下属进行偏袒，并且毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.6520.USA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前宪政国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。其中最具争议的是乔治·巴顿。即使布拉德利和艾森豪威尔都声称他是无罪的，毫无疑问，在美国最黑暗的时刻他和许多将领出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.6520.PSA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前宪政国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，令最高指挥部震惊的是，马歇尔将军支持赦免他过去的同僚们，他引述了他们在内战前的杰出服务，坚称他们叛变是处于少见的状况并且他们对美国宪法无可置疑的忠诚是证明他们无罪的证据，但与他的辩护相对的是，陪审团认为他可能因为在内战前被认为非常尊敬巴顿，而对他有所偏袒，并且毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.6520.a:0 "赦免他们"
 ustates.6520.b:0 "开除他们的军籍"
 ustates.6520.c:0 "叛徒给老子从美国滚出克！"
 ustates.670.t:0 "美国索要格陵兰岛！"
 ustates.670.d:0 "美国已经发出一封由外交官携带的信，声称此地是“对于国防安全十分重要的”，他们提出了一个荒谬的低价想从我们手中“购买”格陵兰岛，如果我们不卖，他们就会用武力夺取。他们的力量远超我们，我们也许别无选择。"
 ustates.670.a:0 "好吧……把钱拿来"
 ustates.670.b:0 "绝不！"
 ustates.671.t:0 "丹麦拒绝了！"
 ustates.671.d:0 "丹麦拒绝了我们的要求，因此我们获得了一个关于夺取此地的宣战理由。"
 ustates.671.a:0 "宣战吧"
 ustates.671.b:0 "再等等"
 ustates.672.t:0 "丹麦同意了！"
 ustates.672.d:0 "不出所料，丹麦已经接受了我们的提议，同意让我们控制格陵兰岛。"
 ustates.672.a:0 "好"
 ustates.673.t:0 "美国渴望东亚！"
 ustates.673.d:0 "美国向我们提了一个提议，要求接管我们在东亚的势力！虽然重拾扩张主义的美国很让人担忧，但是现在我们在东亚的地盘已经不是资产而是债务了，那么也许拿这些债务换一个盟友是个好主意？"
 ustates.673.a:0 "不"
 ustates.673.b:0 "同意"
 ustates.674.t:0 "德国同意了"
 ustates.674.d:0 "德国同意了这笔交易，但他们希望与我们结盟，如果我们同意，他们可以在购买东亚支配权的费用上打折。"
 ustates.674.a:0 "不"
 ustates.674.b:0 "好"
 ustates.675.t:0 "德国人拒绝了！"
 ustates.675.d:0 "德国人拒绝了我们接管他们在太平洋势力范围的提议！现在有些人建议放弃而有些人建议开战，他们的建议都有道理，那么该怎么做？"
 ustates.675.a:0 "开战"
 ustates.675.b:0 "放弃"
 ustates.676.t:0 "非洲调查引发骚动！"
 ustates.676.d:0 "我们对于中央非洲的调查报告导致了公众对这个广泛使用虐待，奴隶和谋杀的殖民地国家的谴责。德意志帝国和中央非洲政府因证据确凿而无法作出任何辩解，他们被迫应对来自全世界的强烈的声讨，这次调查提高了我们在非洲地区的声望，并且让我国的国民们更加热衷于对外干涉了。"
 ustates.676.a:0 "为了更美好的世界而战！"
 ustates.678.t:0 "施展波尔克之宏图"
 ustates.678.d:0 "在我们的第十一任总统詹姆斯·K·波尔克的治理下，美利坚合众国获取了大片新的领土，包括于第一次美墨战争中获得、于《瓜达卢佩条约》中正式吞并的墨西哥割让地，一跃成为了国际舞台上不可小觑的一股力量。虽然我们对来之不易的帝国主义战利品很是满意，但波尔克总统却想要更进一步，将从下加利福尼亚到塔毛利帕斯的整个墨西哥西北，还有直通墨西哥湾对岸的尤卡坦的大片土地纳入囊中。不过，谈判失败的巨大风险再加上北方各州的反对，波尔克最后也只能不了了之，但这并不代表这一梦想也随之消散。\n\n如今，蔓延全国的动乱已经平息，墨西哥的窝囊军队也再度败倒在了我们脚下，重提波尔克梦想的时机已经成熟，是时候将这些土地整合为美国的领地，并逐渐过渡到州了。不过，这次还是有很多人反对这一计划，他们认为，管理新领地、处理必定会发生的叛乱的成本过于高昂，不是我们尚未完全恢复的经济能够承受得了的，而且这些领地大部分都是荒芜的沙漠和巍峨的群山，要在这里建立起美国的法律与秩序难如登天。还好，这一计划也并不缺少支持者，国会中的一些显要议员还建议我们与时俱进，以现代的需求和现实重新审视这一梦想。那么，我们是要追求完整的墨西哥宣称，吞并从下加利福尼亚、索诺拉到尤卡坦，甚至是韦拉克鲁斯的广阔土地，还是稍加收敛些呢？"
 ustates.678.a:0 "这种穷山沟子的破地谁愿意要啊？就让墨西哥人自个玩泥巴去吧"
 ustates.678.b:0 "重现墨西哥割让地的真正疆域！"
 ustates.678.c:0 "彻底贯彻波尔克的宣称，韦拉克鲁斯也不能放过"
 ustates.678.e:0 "拿下整个墨西哥！"
 ustates.678.f:0 "只要下加利福尼亚和索诺拉"
 ustates.679.t:0 "星条旗插上古巴？"
 ustates.679.d:0 "稳定、繁荣与秩序重新回到了联邦的土地上，安顿完内部的美国政府再次望向外部，走上了“战狂”的道路，许多国会议员和军官也将他们的帝国主义目光放到了西印度群岛曾经的失地上，而首当其冲的便是古巴。1854年，皮埃尔·苏莱的《奥斯坦德宣言》（也叫做《奥斯坦德通告》）将古巴这一加勒比海的明珠纳入了美利坚帝国主义与昭昭天命的概念之中，而后来的事态发展也正如宣言所述，美国通过1898年的美西战争和《巴黎和约》获得了古巴，并于1902年开始了正式占领，但由于宣战布告所附带的《铁勒修正案》（修正案承诺，美国最终会归还古巴以主权），古巴一直没能成为美国的一个领地、一个州。不过，在美国例外论、帝国主义思潮、重燃的昭昭天命理想甚嚣尘上，而世界各国也无暇他顾的当下，也许古巴已经失去了昔日能够肆意妄为的地位。那么，我们是要撕毁《铁勒修正案》，直接吞并古巴，并将其整合为美国的第五十一个州呢，还是把哈瓦那留给古巴人自己，继续从遥远的海外对其施加影响呢？"
 ustates.679.a:0 "别管他们了"
 ustates.679.b:0 "古巴的财富等待着我们！"
 ustates.400.t:0 "工团主义者发动炸弹袭击"
 ustates.400.d:0 "工团主义者依然坚持为“革命”而战，他们将斗争目标对准[attack_state.GetName]的工厂、铁路和军事设施。一起爆炸日前造成大批人员伤亡和经济巨额损失。[attack_state.GetName]国民警卫队赶赴现场后，向公众承诺他们将很快逮捕犯罪组织的幕后黑手。"
 ustates.400.a:0 "我们必须消灭这群暴徒！"
 ustates.404.t:0 "朗派发动炸弹袭击"
 ustates.404.d:0 "休伊·朗的支持者依然坚持为“革命”而战，他们将斗争目标对准[attack_state.GetName]的工厂、铁路和军事设施。一起爆炸日前造成大批人员伤亡和经济巨额损失。[attack_state.GetName]国民警卫队赶赴现场后，向公众承诺他们将很快逮捕犯罪组织的幕后黑手。"
 ustates.404.a:0 "我们必须消灭这群暴徒！"
#第三次内战
ustates.997.t:0 "关于密谋的传言"
 ustates.997.d:0 "尽管内战的余烬未熄，但关于谋杀和冲突的讨论已经开始了。杜鲁门看上去一副饥渴难耐的样子。但他想太多了。像他这样的人在比他优秀的人面前从来都是无地自容……流言蜚语围绕着国会大厦，麦克阿瑟计划在参议院发表演讲，要向美国人民传达信心、力量和复兴的信息。但特勤局敦促总司令暂时留在白宫的安全地带，直到他们的调查辨别出这些杀人谣言的真假。“懦夫纵生，实已百死，勇者一死，惊天动地。”"
 ustates.997.a:0 "也许我应该等等……"
 ustates.997.b:0 "无稽之谈，我今天就会发表演讲"
 ustates.998.t:0 "麦克阿瑟遇刺！"
 ustates.998.d:0 "万万想不到，道格拉斯·麦克阿瑟今天在国会发表演讲时竟遇刺了！当时，他站在一群国会议员面前，哈里·S·杜鲁门突然冲上前去，对着这个独裁者就是一枪，直击麦克阿瑟肩部。当麦克阿瑟拔出自己的柯尔特手枪准备回击时，包括萨姆·雷伯恩和弗雷德里克·黑尔在内的更多国会议员冲向了他，他们都曾公开反对在军政府治下限制美国人的自由，而后乱枪打死了他。执法部门虽来不及阻止袭击者，却“及时”地赶到了现场，得以观看罗伯特·A·塔夫脱关于重建美国民主的即兴演讲，他最后用一句不朽的名言“暴君必尝恶果”结束了演讲。那些犯下这一罪行的人已被逮捕，那些目睹美利坚恺撒遇刺却无动于衷的人也正因他们的消极行为而受到审问。这一可怕的事件动摇了美国的国本，许多人担心美国政治的暴力气氛尚未得到充分释放。"
 ustates.998.a:0 "艾森豪威尔在内部权力斗争中获胜！"
 ustates.998.b:0 "混乱席卷华盛顿！"
 ustates.998.c:0 "亲民主派重新夺回华盛顿！"
 ustates.999.t:0 "美利坚合众国的解体！"
 ustates.999.d:0 "麦克阿瑟死后的权力真空一经产生，官员和州长们便开始争权夺利，许多人也认为这是脱离专制联邦的一个机会。合众国因此变得支离破碎，更几无重生机会。美利坚合众国，她的历史光辉灿烂，亦曾在世界舞台上举足轻重，但如今，她已是冢中枯骨。"
 ustates.999.a:0 "所以美国不再是超级大国了？"
 ustates.1000.t:0 "何者永存"
 ustates.1000.d:0 "美国陷入无政府状态后，许多内战老兵的理想破灭了。麦克阿瑟下属军团还有组织力残余力量集结在美国的心脏地带进行最后一次尝试，以恢复昔日的美国。"
 ustates.1000.a:0 "乱臣贼子万劫不复，星条笙旗冉冉升起！"
 ustates.1001.t:0 "新加利福尼亚军队的崛起"
 ustates.1001.d:0 "为恢复美国秩序，遏制无政府状态的蔓延，太平洋沿岸的人民组建了一支军队。如今秩序井然，我们也许是该发动进攻了？民主自由将同我军并肩前进，我们将像我们的祖先一样解放美国。"
 ustates.1001.a:0 "在莫哈韦巡逻的日子几乎会让你无比渴望核冬天的到来"
 ustates.1002.t:0 "五大湖联邦军队的崛起"
 ustates.1002.d:0 "随着恺撒死后的混乱局势的蔓延，整个旧美国土地上都出现了权力真空。福特抓住了这个机会，利用平克顿探员和联邦的残余势力，在大湖地区建立了某种秩序。"
 ustates.1002.a:0 "福特万岁！"
 ustates.1003.t:0 "德撒律的崛起"
 ustates.1003.d:0 "德撒律一直被认为是一个荒谬的想法。但话说回来，从前认为美国会崩溃的想法不也是如此么？当太平洋国军队企图在此地恢复秩序时，西南地区的人民拒绝了太平洋海岸精英们的痴心妄想，与之相反，他们建立了自己的共和国。"
 ustates.1003.a:0 "一切为了共和国"
 ustates.1004.t:0 "何者永存"
 ustates.1004.d:0 "麦克阿瑟死后，华盛顿特区和全国各地一样陷入了无政府状态。唯有通过诡计和忠诚的民兵，我们才能设法夺回我们的区域控制权，确保我们继续得以存在。然而，这又是一种什么样的存在呢？"
 ustates.1004.a:0 "联邦永存？"
 ustates.1005.t:0 "邦联军队的崛起"
 ustates.1005.d:0 "当美国陷入无政府状态时，处境最糟糕的是南方各州。私刑成了家常便饭，许多人在亚特兰大大火中失去家园或性命。然而，迪克西的人民坚韧不拔。他们既然已经在谢尔曼大行军中幸存了下来，这次也会幸存下来。大多数南方人都涌向已故休伊·朗的弟弟——厄尔·肯普·朗的旗下。那些不愿意支持他的人会转而支持约翰·南斯·加纳和他的孤星共和国。厄尔为建立统治和秩序而狂热地工作。羽翼未茂的共和国也许仍然破损不堪，但是，一如既往，“南方将再次崛起。”"
 ustates.1005.a:0 "南方再次崛起！"
 ustates.1006.t:0 "新英格兰军队的崛起"
 ustates.1006.d:0 "联邦政府垮台后，大批工团主义民兵组织奋起反抗，试图重建他们失败的国家。不过在加拿大边境警卫队的帮助下，国民警卫队得以恢复秩序。然而，意外发生了：国民警卫队叛逃了。他们不再为了华盛顿特区的专制联邦政府而战，而是为了解放家园，建立一个真正自由的新英格兰而战。"
 ustates.1006.a:0 "我们是旧时美国遗产的真正继承者"
 ustates.1007.t:0 "德克萨斯军队的崛起"
 ustates.1007.d:0 "当无政府状态在联邦政府崩溃后袭击德克萨斯时，不是一支专业的军队恢复了秩序。相反，一群群武装民兵聚集在约翰·南斯·加纳周围，奋力抵御掠夺者，并制止强盗的威胁。这不是政府的胜利，这是人民的胜利！"
 ustates.1007.a:0 "铭记阿拉莫！"
 ustates.10072.t:0 "纽约市军队的崛起"
 ustates.10072.d:0 "当美国分崩离析时，纽约市市长菲奥雷洛·H·拉瓜迪亚坚定地站在纽约市一边，拒绝承诺效忠任何一个从“大崩溃”中走出来的美国残存势力。相反，拉瓜迪亚宣布纽约是一个独立的城邦国家，纽约警察局和城市驻军已经应召保卫纽约。"
 ustates.10072.a:0 "为了大苹果！"
 ustates.1008.t:0 "美利坚的灭亡"
 ustates.1008.d:0 "美利坚土崩瓦解，我们完全失去了对国家机构的控制，我们的军队集体抛弃了我们。与国民警卫队的通讯处于中断。尽管美国其他地方一片混乱，华盛顿却出奇的安静……"
 ustates.1008.a:0 "我们已不复当年荣光……"
