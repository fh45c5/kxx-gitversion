 USA_civil_war_political_aftermath_idea:0 "千疮百孔的美利坚"
 USA_civil_war_political_aftermath_idea_desc:0 "§R战火虽息，仇恨仍存。§!\n\n在我国诸多地区，尤其是在我们无力管辖之地，政府机关已完全被军队取代。顽固的准军事组织分子乃至于普通罪犯则盘踞在那些军队未曾驻扎的地区，占领当局似乎仅能通过当场处决来维护秩序。这残酷无情的日子让许多人无法回归到正常生活中去，国家也因之陷入了停顿。在采取坚决果断的措施将之终结前，无休止的暴力都会一直困扰着我们。"
 USA_civil_war_political_aftermath_idea2:0 "千疮百孔的美利坚"
 USA_civil_war_political_aftermath_idea2_desc:0 "§R战火已息，枪炮沉寂。§!\n\n若提及修复第二次美国内战造成的破坏与痛苦的首要措施，制止军警的过激行为，保证政府领导人在努力缓解人民痛苦上表现得积极主动等无疑是关键一招。虽然散兵游勇与罪犯恶徒仍为患一方，战时司法的现状对大多数美国人来说依旧未变，但案件数量正逐渐减少。倘若假以时日，这一切都将成为遥远的不快记忆，但就现在而言，我们还有许多工作要做。"
 USA_civil_war_political_aftermath_idea3:0 "修修补补"
 USA_civil_war_political_aftermath_idea3_desc:0 "§Y千里之行，始于足下。§!\n\n当国内大部分地区仍因严酷镇压与强行占领苦不堪言时，稳定已悄然出现。大多数躲藏在深山老林中的顽固分子要么一命呜呼，要么不知去向，城市内犯罪仍旧是个老大难问题，但比起以前，街道毕竟还是安全多了。结束临时军管、恢复常态化治理尚需一些时日，但如今的生活确实轻松了些。"
 USA_civil_war_political_aftermath_idea4:0 "修修补补"
 USA_civil_war_political_aftermath_idea4_desc:0 "§Y千里之行，国人同往。§!\n\n拘留所不再人满为患，警察又回到了街头维持秩序，美国人民开始认可，也因之接受了时任政府对国家的统治。临时军管已经结束，为加速整合进程，部分城镇拥有了更大的地方自治权。我们虽不能指望人们对此有饱满的热情，但至少现在是能安心地过日子了。"
 USA_civil_war_political_aftermath_idea5:0 "希望掠过天边"
 USA_civil_war_political_aftermath_idea5_desc:0 "§G国殇夜漫，晓色熹微。§!\n\n国旗正猎猎飘扬在市政厅与军事基地上空，而这正是政府的努力结出硕果的最显著标志。民众正以各种方式重拾对美利坚的信心，我们日夜操劳的政府官员们可以稍作歇息了。还有很多事等着我们去做，但如今人民已敢于梦想，将这一切抛诸脑后也只是时间问题。"
 USA_civil_war_political_aftermath_idea6:0 "希望掠过天边"
 USA_civil_war_political_aftermath_idea6_desc:0 "§G国殇夜漫，天光渐晓。§!\n\n虽然对许多人来说，第二次美国内战的记忆永远不会消逝，因为它承载着太多太多，但就现在来说，这也只是一段旧日往事罢了。国家已从梦魇中重振旗鼓，野蛮不复存在，真正的政府建立了起来，统治着从太平洋到大西洋间的这片辽阔土地。美国正准备走向未来，人民自当因此感谢他们的领袖。当然，更好的日子还在后头呢。"
 USA_civil_war_war_aftermath_idea:0 "遍地丘墟的美利坚"
 USA_civil_war_war_aftermath_idea_desc:0 "自建国以来，美国的经济形式从未如此糟糕过。国内的大部分地区受饥荒威胁，水电等基本服务对大多数美国人来说也成了奢侈品。医院依旧人满为患，更不必说停尸房了。倘若政府还想要重拾希望，令美国回到繁荣之路上，那它必须迅速行动，引导国家走出危机。\n\n§R万劫不复，势难挽回。§!"
 USA_civil_war_war_aftermath_idea2:0 "遍地丘墟的美利坚"
 USA_civil_war_war_aftermath_idea2_desc:0 "紧急救助正在准备之中，并已被运往最需要帮助的州，埋葬逝者的漫长过程基本已处理完毕。话虽如此，这个国家的许多人仍在忍饥挨饿，也只能通过蜡烛而非电灯来提供照明。但在我国公职人员的脑海中，均有一个共同的坚定信念：我们一定可以战胜这场彻底摧毁了我国的末日危机，每个人都明白事态的严重性，每个人也都明白自己该做些什么。\n\n§R历史不会轻饶自大之人。§!"
 USA_civil_war_war_aftermath_idea3:0 "从终末之中重建"
 USA_civil_war_war_aftermath_idea3_desc:0 "紧急救助解决了全国大部分地区的棘手难题，我们也得以紧锣密鼓地修复各地的基础设施，求生之路开始变得不那么坎坷了。昔日破败不堪的道路恢复了使用，大多数城市居民的日常生活中又恢复了供电供水。总而言之，这个国家的大部分人如今至少可以勉力求存，而不必像从前那般艰难求生。\n\n§Y流血终止。§!"
 USA_civil_war_war_aftermath_idea4:0 "从终末之中重建"
 USA_civil_war_war_aftermath_idea4_desc:0 "在基本生活必需品的供给得到保障后，美国人民也正稳步恢复生产，令整个国家重新步入正轨。我国公民要么回到了旧岗位上，要么借助政府援助获得了新工作，经济危机减缓的征兆已然在望。除各大城市外，诸多小城镇也得到了我国官员所承诺提供的援助。\n\n§Y重建之路愈发平坦。§!"
 USA_civil_war_war_aftermath_idea5:0 "山巅之城再度闪耀"
 USA_civil_war_war_aftermath_idea5_desc:0 "商品的生产率已逐渐回到内战前的水平，美国大众的生活水平也正稳步提高。内战留下的瓦砾与废墟得到了处理，被用于新建筑的建设或其他所需之处中，我们甚至终于有了出口物资的余力。对未来的信心日趋高涨，时间似乎确能抚平一切创伤。\n\n§G美国梦虽一度消逝，却亦有复生可能。§!"
