 USA.809.d:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，而毫无疑问，如今平民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，左派的支持者在党内显然占据了上风。在向民粹派做出了一定的妥协与承诺后，新的总统提名落到了杰克·里德与厄尔·白劳德头上。党内的多数人倾向于提名里德，因为正是杰克·里德在社会党最为衰落的时刻稳定了局势并最终选择与美利坚至上党合作。如今的里德在党内享有着很高的威望。而白劳德则因其圆滑立场与与曾经社会党集权派的一些联系而受到了一定的支持，同时他也是民粹派相对倾向于支持的总统提名者。最终，总统提名得到确认..."
 USA.809.a:0 "里德与他的副总统伊丽莎白·弗林"
 USA.809.b:0 "白劳德与他的副总统詹姆斯·福特"
 USA.810.t:0 "最终提名"
 USA.810.d:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，而毫无疑问，如今平民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，民粹派的支持者在党内显然占据了上风。在向左派做出了一定的妥协与承诺后，新的总统提名毫无疑问的落到了休伊·朗头上。然而，在决定副总统的人选时，争议出现了。朗本人希望提名他的弟弟厄尔作为他的副总统，但包括左派在内的一部分反对者认为这样会滑向曾经至上党式的强人政治的深渊。尽管朗向党内所有人都做了承诺，但仍有一部分人的支持落到了菲利普·拉福莱特头上。他们希望这位温和的进步派人士能够作为朗的合作伙伴，同时保证朗那充满个人魅力与说一不二的执政风格能够得到掌控。最终，副总统得到了提名..."
