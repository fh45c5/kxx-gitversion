 USA_righteous_nation_desc:0 "鉴于最近的选举僵局，前总统赫伯特·胡佛同意道格拉斯·麦克阿瑟接任美国总统和总司令的职位。这对胡佛来说是一个痛苦的决定，但他认为这是结束危机的必要之举。因此，在我们许多公民的眼中，新政府已经获得了合法性，麦克阿瑟也被视为选举的合法赢家。在胡佛内阁和他本人的支持下，我们离给这个四分五裂的国家带来秩序又近了一步！"
