 USA.807.t:0 "第二次大会演讲"
 USA.807.d.pp:0 "在敲定了首要纲领后，大会接下来来到了平民党的金融与文化政策上。作为坚定的左翼社会活动家，里德领导的社会党在改组后也始终保持着对垄断金融资本与大公司的绝对敌视。在如今的平民党左派成员们看来，即使已经不再要求暴力革命，但金融寡头仍旧是这个国家需要彻底根除的病因之一。而朗与他的民粹支持者们尽管也视资本家与华尔街为这个国家的最大的蛀虫之一，但相对于社会党成员没有那么激进。朗一直呼吁他的财富分享计划与财富限额来作为对大企业和寡头的限制与打击。而在文化领域，双方都保持着相似的立场，呼吁政府减少对文艺政府的审查与限制。而在对外立场上，朗要求积极介入美洲事务而放弃美洲以外的干涉事务，至于里德和左派，他们则是旗帜鲜明的反对一切对外干涉事务，保持着独特的和平主义立场。总的来说，在这个阶段，双方的政见与理念差别并没有先前那么不同，因此会场上的气氛开始变得更加放松。\n\n对于第二次大会演讲的人选，左派推出了诺曼·托马斯，著名的社会主义者与和平主义者代表左派向在场的平民党支持者阐述了理念。这位知名的老资历社会活动家过去曾经作为社会党的代表竞选总统，尽管最终无功而返，但他本人已经是美国左翼运动的最著名的头面人士之一。作为回应，民粹主义者们推举了西海岸的知名进步人士亨利·华莱士作为他们的发言人。华莱士曾在1936年试图作为诺里斯的副总统参加竞选，但最终遗憾让位于昆汀·罗斯福。这位加州进步主义者如今在美国享有广泛的声誉，并作为进步运动的头面仍然活跃于政坛。\n\n在双方的演讲过后，会场都爆发了热烈的掌声与喝彩予以致意，而两派之间的冲突与分歧也没有先前严重。最终，大会定下了新阶段的竞选纲领..."
 USA.807.d.npp:0 "在敲定了首要纲领后，大会接下来来到了国家人民党的金融与文化政策上。作为曾经的旧民主党领袖，默里始终对华尔街的银行家保持着绝对的敌视态度，但由于与福特与技官主义者们的合作，默里又无法对像福特这种垄断大财团做出实质性的打击。因此在相关议题与政策上，默里党团显得处处掣肘。同时默里党团要求加强文化审查，并始终支持维护“失败事业”，即第一次内战中南方邦联的立场与事迹的正义性。而作为他们此时的竞争对手，民族派就没有过多顾虑。对于金融投机与垄断，民族主义者们始终抱持着打击与毁灭的态度。他们要求彻底消灭华尔街的金融家们，将经济秩序置于军事团体的武装保卫之下。同时垄断企业将被拆分，并交由各大地区的政府或是军事团体领导者（包括3k党在内）来管理。进一步的，民族主义者要求宣布恢复美国作为虔诚宗教国家的优秀传统，并将一切有害于美国的自由思想荼毒扼杀于无形。而温和保守主义者则对金融资本持放任态度，并支持对国家媒体进行严格管控。\n\n对于第二次大会演讲的人选，默里方推举了前佐治亚州长，尤金·塔尔梅奇作为发言人。尤金在演讲中宣扬他所谓的美国农村的真正价值观，并号召全体美国公民们共同为打击资本巨鳄与维护邦联事业而奉献。而民族主义者则宣布赫伯特·阿姆斯特朗牧师将为他们发声。作为美国首位利用电台传教的牧师，阿姆斯特朗始终以他的虔诚信仰和对“英式以色列主义”的奇怪理论的支持闻名。而詹姆斯·伊斯特兰则为温和派发言，这位“密西西比政治教父”也作为保守主义者的领军人物之一而全国闻名。\n\n在双方的演讲过后，会场都爆发了热烈的掌声与喝彩。最终，大会定下了新阶段的竞选纲领..."
