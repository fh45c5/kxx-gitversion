 USA.812.t:0 "最终提名"
 USA.812.d:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，默里-福特党团的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名落到了威廉·默里和查尔斯·林德伯格头上。党内的多数人倾向于提名默里，因为默里本人在党内就有着崇高的威望与人脉，同时其本人正是国家民主党能够成立的关键主导者之一。而查尔斯·林德伯格则也不遑多让，他代表了党内技官主义者与企业的支持，尤其是亨利·福特这位大亨的支持。同时，对于一位年轻的右翼领导者，民族主义者们也乐见其成。最终，总统提名得到确认..."
 USA.812.a:0 "“苜蓿比尔”默里与他的副总统约翰·E·兰金"
 USA.812.b:0 "查尔斯·林德伯格与他的副总统亨利·福特"
 USA.813.t:0 "最终提名"
 USA.813.d:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，民族主义者的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名毫无疑问的落到了杰拉尔德·L·K·史密斯和塞缪尔·格林头上。杰拉尔德是一位虔诚而好斗的基督徒，他主张美国的军国主义化与彻底宗教化。他本人的小团体基督教民族十字军也在党内吸引了众多支持者加入。而塞缪尔·格林则是如今残存的3k党中资历最老，最受欢迎的一位大巫师。他在民族主义者中有着相当多的支持者，希望他能够上台重振3k党的荣光。最终，总统提名得到确认..."
 USA.813.a:0 "史密斯与他的副总统詹姆斯·诺伊"
 USA.813.b:0 "格林与他的副总统埃尔登·爱德华兹"
 USA.814.t:0 "最终提名"
 USA.814.d.noone:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，温和的保守主义者们的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名落到了小理查德·罗素头上。"
 USA.814.d.hearst:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，温和的保守主义者们的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名毫无疑问的落到了小理查德·罗素和威廉·伦道夫·赫斯特头上。小理查德·罗素，这位老资历的南方民主党人被认为是更加令人满意与能接受的总统人选。而威廉·赫斯特的庞大媒体机器也为其本人大势造势，为赫斯特争取到了相当多的支持者。同时赫斯特与国内大亨们的交情也使他在社会上层也颇有声望。最终，总统提名得到确认..."
 USA.814.d.pelley:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，温和的保守主义者们的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名毫无疑问的落到了小理查德·罗素和威廉·达德利·佩利头上。小理查德·罗素，这位老资历的南方民主党人被认为是更加令人满意与能接受的总统人选。而威廉·达德利·佩利作为银衫军的领袖与一位著名的民粹主义者和基督徒，他在如今的国家人民党中的声望也不逊色于其他同僚。最终，总统提名得到确认..."
 USA.814.d.both:0 "在大会即将落幕时，国家人民党的竞选纲领终于得到了确定，而毫无疑问，如今国家人民党需要提名一位总统候选者，同时副总统提名也将在此被决定。在经过多轮演讲后，温和的保守主义者们的支持者在党内显然占据了上风。在向其他派系做出了一定的妥协与承诺后，新的总统提名将在小理查德·罗素，威廉·伦道夫·赫斯特与威廉·达德利·佩利三位候选人之中得出。小理查德·罗素，这位老资历的南方民主党人被认为是更加令人满意与能接受的总统人选。威廉·赫斯特的庞大媒体机器也为其本人大势造势，为赫斯特争取到了相当多的支持者。而威廉·达德利·佩利作为银衫军的领袖与一位著名的民粹主义者和基督徒，他在如今的国家人民党中的声望也不逊色于其他同僚。最终，总统提名得到确认..."
 USA.814.a:0 "恭喜罗素先生！"
 USA.814.b:0 "恭喜赫斯特先生！"
 USA.814.c:0 "恭喜佩利先生！"
 USA.815.t:0 "全国种族秩序与卫生会议"
 USA.815.d:0 "为了兑现其恢复“美国自然种族秩序”的承诺，新的国家人民党政府在一次旨在制定和颁布美国未来种族政策的全国大会上召集了一个种族主义领域的“专家”小组。首先是威廉·达德利·佩利，他对种族问题采取了形而上学的“精神”方法。接下来是塞缪尔·格林，他代表了三K党和传统本土主义运动的利益。最后是洛思罗普·斯托达德，他代表了被东海岸的精英们所拥护的新科学种族主义潮流。这些人的议程都得到了相当多的支持者，而且看起来如果没有外部力量的干预，目前的僵局仍将维持下去。\n\n出于这个原因，现在的主动权在[USA.GETLeader]政府身上，我们将通过偏向其中一个阵营进行干预，给予他们的议程所需的支持，使之成为官方政策。剩下的就是确定这三个团体中哪一个最值得我们的支持。"
 USA.815.a:0 "佩利的形而上学方法"
 USA.815.b:0 "格林的传统本土主义"
 USA.815.c:0 "斯托达德的科学方法"
 USA.816.t:0 "强制日裔归国"
 USA.816.d:0 "虽然排亚已经成为了美国的一项政策，但日本人一直遵循的规则与适用于亚洲所有其他国家的规则有些不同。日本是亚洲大陆上唯一的大国，长期以来一直希望被视为与白人同等的国家。由于一系列的原因，美国多年来的政策是不明确限制日本移民的流入，而是与日本帝国制定了一个绅士协议，保留日本的体面，而作为回报，让日本人自行阻止其民众登上前往美国的船只。\n\n然而这一政策还是失败了。当日本人声称他们在尽最大努力阻止其公民移民至美国时，在美国的日裔人口却继续急剧增长，且没有任何减弱的迹象——特别是随着大量第二代日裔美国人的出生。出于这个原因，长期以来一直有人呼吁采取额外行动来阻止这种增长，“以免西海岸被日本人侵占”。与此同时，日本的实力却还在不断增强，因此，我们政府中有很多人认为，最好接受日本人的存在，将其视为既成事实，而不是冒着激怒他们祖国的风险。我们该如何行动？"
 USA.816.a:0 "亚洲人属于亚洲，送他们回去"
 USA.816.b:0 "日本人已融入了美国社会，让他们留下来吧"
 USA.817.t:0 "废除禁酒令？"
 USA.817.d:0 "禁酒令作为诺里斯政府制定的最具影响力的社会政策之一，已成为美国国内一个极具争议的政治问题。然而，特别的是，新国家人民党内的许多人都同意这一政策。长期以来，禁酒令一直是许多极右翼人士的竞选议题，即便是他们也不得不勉勉强强地祝贺诺里斯通过了禁酒令。因此，无论我们对个人自由有什么看法，党内的相当一部分人仍将坚决反对修改或取消禁酒令。\n\n尽管我们可能仍然能够推动禁酒令的废除，但禁令的废除很可能会被证明是一剂金杯毒酒。我们该如何选择？"
 USA.817.a:0 "禁酒令不必要地限制了自由，它将被废除"
 USA.817.b:0 "禁酒令是一种道德上的需要，它会一直存在"
 USA.818.t:0 "杰克·里德之死"
 USA.818.d:0 "杰克·里德和他的妻子路易丝·布赖恩特在与他剩下的政治盟友开会后回家的路上遭到了不明身份刺客的伏击，他们在逃跑前向这对夫妇发射了几十发子弹。尽管当局反应迅速，但里德还是被宣布当场死亡。布赖恩特奇迹般地没有受到任何危及生命的伤害，在被紧急送往医院后，预计她将很快完全康复。\n\n不出所料，如此明目张胆的政治暗杀，即使对象是一个赤色煽动家，也在全国范围内引起了强烈抗议。要求正义的呼声正在全美各地传播，现在落到了我们的肩上。我们该作何选择？"
 USA.818.a:0 "不管我们发现什么，都要认真调查"
 USA.818.b:0 "下次打准点"
 USA.819.t:0 "路易丝·布赖恩特谴责我们"
 USA.819.desc:0 "自从在丈夫被刺杀后受伤康复以来，路易丝·布赖恩特一直在进行反对我国政府的活动。她指责我们造成了里德的死亡，甚至声称我们内阁中的一些人直接参与组织了这次刺杀，她的尖刻言辞始终不断且极为激烈。虽然她和她已故丈夫的社会主义倾向在大多数美国人中引发了对她健康状况的怀疑，但越来越多特别天真的人却把布赖恩特的假话当了真。\n\n鉴于她没有停止的迹象，政府里有很多人建议我们应该介入，结束她的活动。然而，由于杰克·里德的谋杀案给公众留下了极深的印象，对布赖恩特采取行动采取行动也会引起争议。我们应该如何行动？"
 USA.819.a:0 "失去后的歇斯底里是不幸的，但却是司空见惯的。现在让她尽情狂欢吧"
 USA.819.b:0 "就算她是个寡妇，她也不能肆意泄愤，让她闭嘴"
 USA.820.t:0 "是否成为美国的流放地？"
 USA.820.d:0 "美国[USA.GetLeader]的行动最近为我们两国之间可能发生的外交事件奠定了基础。作为其本土主义运动的一部分，[USA.GetLeader]政府已经将一些被认为是激进分子的人驱逐出境，名义上是驱逐到其原籍国。然而，在处理左翼黑人煽动者时，美国人却以他们的泛非主义意识形态为由，选择把他们扔到我国的海岸。自然，这种暗示他们与美裔利比里亚人民或我国有任何关系的说法已证明是对我们所有人的极大冒犯。真辉格党的一位成员抨击了这样一种观念，即“一个由旧时美国精英们收养的子女建立起来的国家，应该成为美洲每一个黑人罪犯的监护者”，他的反对意见很好地概括了我们的观点。\n\n尽管如此，我们必须意识到我们的处境，并采取相应的行动。我们国家的命运将永远取决于与美国人的良好关系，无论我们是否愿意。因此，为了保持这种良好的关系，最好是不计较这件小事，而利用这股支持遣返的浪潮达到对我们有利的目的。虽然美国人这次可能把他们的人渣送过来了，但通过一些努力，我们将有望刺激利比里亚的第二轮殖民定居，并巩固我们对内陆地区和部落的主导地位。"
 USA.820.a:0 "在这个问题上与美国合作，提出一项富有成效的遣返计划"
 USA.820.b:0 "要求对方为此行为道歉"
 USA.821.t:0 "利比里亚要求道歉"
 USA.821.d:0 "利比里亚政府对我国政府的政策表示了强烈抗议，批评我们将不受欢迎的人扔到他们海岸的做法。他们要求我们停止这种行为，并为过去的行为道歉。尽管如此，他们似乎已经认识到自己在与谁打交道，并做出了相应的让步。让我们道歉并不意味着我们还要收回那些已经被送往利比里亚的人，利比里亚已承诺对这些人进行处理。\n\n这种考量是有双重意义的，因为这一事件现在已被媒体报道，并成为了一个政治问题。我们的一些比较热心的支持者对这种明显的侮辱感到愤怒，要求我们断然拒绝利比里亚的要求。与此同时，黑人民族主义者和在利比里亚存在利益的企业要求我们的政府做出弥补，恢复我们在这个国家受损的声誉。我们该作何选择？"
 USA.821.a:0 "强硬和骄傲不会改变负面新闻，道歉吧"
 USA.821.b:0 "美国为所欲为，从不为此道歉"
 USA.821.c:0 "弹丸之地活够了是吧"
 USA.822.t:0 "利比里亚提议遣返黑人"
 USA.822.d:0 "牧师兼政治家欧内斯特·塞维尔·考克斯最近与我们联系，提出了一个非常有趣的提议。他声称自己代表了一个真正的种族隔离主义者和像马库斯·加维这样的黑人民族主义者的联盟，同时也作为利比里亚政府的代理人，他提出了一项遣返黑人的全国计划。虽然他为利比里亚政府服务的确切原因还不清楚，但他们很快证实了他们对该计划的普遍支持。在美国，这个计划更是得到了广泛的支持，遣返黑人的可能性似乎比以往任何时候都大。\n\n然而，我们也遇到了来自传统南方民主党人和其他所谓的温和种族隔离主义者的坚决反对。他们以黑人在南方经济中的重要作用为由，决心维护目前的社会秩序，这证明了他们是此计划强烈反对意见的源头。尽管如此，我们仍能推进该计划，但这将付出巨大的政治代价，并可能削弱我方政府到目前为止所做的努力。我们愿意冒这个险吗？"
 USA.822.a:0 "批准计划并开始为其实施做出努力"
 USA.822.b:0 "前南方民主党建制派否决了这项计划"
 USA.823.t:0 "美国人拒绝遣返"
 USA.823.d:0 "美国人拒绝了我们关于遣返黑人的提议，理由是该计划的成本太高。当然，也有传言称，这一决定是由南方民主党人为了维护南方经济秩序而施加的压力所推动的。无论是何种理由，遣返都不会在现在或将来进行。"
 USA.823.a:0 "该死"
 USA.824.t:0 "遣返黑人的方式"
 USA.824.d:0 "在遣返计划获得支持的情况下，我们现在必须确定其形式。为此，参议员西奥多·比尔博最近以法案的形式向参议院提交了一份遣返计划。然而，该项目的基本成本和后勤挑战仍然是一个明显的问题，我们的反对者也在继续利用这一问题来反对该计划。因此，人们提出了一种不那么雄心勃勃但更“实际”的替代方案。这将只涉及遣返一些全体黑人进步协会的志愿人员，以便为今后更广泛的遣返进行试水。\n\n但比尔博参议员却强烈反对该计划，称其“充其量只是个半途而废的措施，最坏的情况则是推迟全面遣返。”随着紧张局势的加剧，两种方案的支持率基本持平，谁也说不准哪一种方案会得到实施。"
 USA.824.a:0 "我们的摩西，西奥多·比尔博的倡议成功了！"
 USA.824.b:0 "加维和他的铁杆支持者们被迫单干"
 USA.825.t:0 "黑人移民到达"
 USA.825.d:0 "随着比尔博的去世，成千上万的美国黑人开始离开他们的出生地到利比里亚寻找自己的财富。在新国家人民党政府的支持下，我们已经能够使他们在新国家内受到欢迎，融入当地的经济生产，并利用他们的人数巩固美裔利比里亚人在利比里亚人民中的优势地位。随着更多项目的进行以及与美国贸易关系的深化，我们可以期待一个繁荣的未来。"
 USA.825.a:0 "黑人家园的梦想终于触手可及"
 USA.826.t:0 "加维及其支持者到达"
 USA.826.d:0 "比尔博可能失败了，但这并没有结束非裔美国人殖民利比里亚的梦想。在新国家人民党政府所能提供的有限支持下，马库斯·加维和他的全体黑人进步协会追随者已经抵达我们的海岸，并承诺将有更多的难民到来。这些身强力壮的人在我们的军队中能够提供的作用显而易见，而加维看起来是一位令人敬畏的领袖，完全有资格领导他们。"
 USA.826.a:0 "希望这是众多新来者中的第一批"
 USA.827.t:0 "强制金融大亨分享财富"
 USA.827.d.long:0 "虽然朗经常表示，他希望摩根银行家族、洛克菲勒和其他精英人士能够走上谈判桌前，并说服他们支持“财富共享计划”，但在朗赢得大选后，他便可以放心地向美国最富有的人提出更为明确的要求。因此，尽管这些大亨们始终在抵制他的计划，但朗现在甚至还是能够迫使洛克菲勒和摩根家族参与其中。曾经还不屑地称朗为傻子，现在却只能陪着笑脸接过“爱国无私”的牌匾——这大概是迄今为止历史上代价最大的一种赞美了。"
 USA.827.d.notlong:0 "虽然朗经常表示，他希望摩根银行家族、洛克菲勒和其他精英人士能够走上谈判桌前，并说服他们支持“财富共享计划”，但在朗的盟友[GetLeader]总统赢得大选后，他便可以通过这位代理者向美国最富有的人们提出更为明确的要求。因此，尽管这些大亨们始终在抵制他的计划，但朗现在甚至还是能够迫使洛克菲勒和摩根家族参与其中。曾经还不屑地称朗为傻子，现在却只能陪着笑脸接过“爱国无私”的牌匾——这大概是迄今为止历史上代价最大的一种赞美了。"
 USA.827.a:0 "我们提出了一个他们无法拒绝的要求"
 USA.828.t:0 "处理“资本主义之王”"
 USA.828.d:0 "在与加纳这位威权总统结盟的过程中，最富有的美国家族——尤其是洛克菲勒家族和摩根家族——试图保护和进一步扩张他们的利益。但随着平民党的掌权，是时候决定应当如何惩罚这些行为了。党内的左翼人士认为，寡头们的最终目的是接管政府，应该被视为不折不扣的叛国罪。另一方面，党内的右翼人士认为，这种激进的行动方式可能会危及政府的地位，并与我们团结全体美国人的努力背道而驰，因此应该寻求通过罚款和监禁等传统惩罚方式打击这些权贵。"
 USA.828.a:0 "指控他们的叛国罪行，并收缴其财产"
 USA.828.b:0 "对这些明目张胆的违法者采取常规法律行动"
 USA.829.t:0 "华尔街的命运"
 USA.829.d:0 "既然我们已经成功通过了旨在削弱资本主义及其走狗的立法，我们党内的一些人也公开建议抹除其产物。华尔街一直是金融秩序的代名词，因此受到了特别关注。现在我们已经推动了相关的立法，那么找个理由驱逐目前的使用者并庆祝我们对他们的胜利也将极为简单。或者，我们可以允许那些金融家保持现状，同时把这个决定描绘成相对党内更为激进观点的仁慈立场。我们应该作何选择？"
 USA.829.a:0 "强迫他们离开并拆除华尔街"
 USA.829.b:0 "允许他们在严加限制的条件下继续运作"
 USA.830.t:0 "反三K党运动进展顺利"
 USA.830.d:0 "在全国范围内根除三K党的运动取得了令人满意的成果，这个极端主义组织的力量现在已经被彻底粉碎。虽然加纳政府通过逮捕该组织的大部分高层人物，已经取得了重大进展，但他们未能在基层对三K党组织进行镇压，使其变成了多个地方集团。我们试图拆解的正是这些组织，特别是通过逮捕许多联邦调查局此前视而不见的“小鱼”。现在，这些南方民主党人的“急先锋”已经彻底陷入停滞，我们可以将目光对准其高层了……"
 USA.830.a:0 "三K党支离破碎"
 USA.831.t:0 "选择平民党南方领导者"
 USA.831.d:0 "随着平民党瓦解并取代南方民主党和旧民主党的政治机器后，我们需要选择一位领导人委以重任，确保我们的支持者——包括黑人选民——被列入投票名单。我们可以让长期效忠我党的保罗·马洛尼加以负责，他自平民党成立以来就一直在该地区领导着其他党员，此前也是至上党的领导者之一。另一个选择是来自阿拉巴马州的种族融合主义者和平民党的后起之秀大吉姆·福尔瑟姆。当然，我们也可以通过裙带关系让朗的兄弟厄尔负责。"
 USA.831.a:0 "保罗·马洛尼"
 USA.831.b:0 "大吉姆·福尔瑟姆"
 USA.831.c:0 "厄尔·朗"
 USA.832.t:0 "打击南方建制派"
 USA.832.d:0 "在我们通过了旨在促进美国黑人权益的紧急立法后，党团受到了来自南方民主党和其他保守派的广泛抵制。这当然在我们的意料之内，此次反对浪潮不过是他们试图保全自身的孤注一掷。但我们没有料到的是，南方民主党人与私刑、压制选民和其他犯罪活动的联系竟然如此之紧密。尽管他们声称自己与此类事件无关，亦或是没有指向他们的直接证据，但我们窥见了真相，并决定采取行动。\n\n现在，唯一需要考量的就是确定我们的前进方向。我们是全力摧毁旧民主党人的政治机器，还是利用这个机会消除最后的障碍，巩固与南方受压迫者的政治联盟？"
 USA.832.a:0 "优先建立支持基础"
 USA.832.b:0 "集中精力摧毁南方民主党的政治机器"
 USA.833.t:0 "控制联邦调查局"
 USA.833.d:0 "长期以来，美国的几任领袖，不论其意识形态立场如何，都有着这样一种共识：如果不加以遏制，J·埃德加·胡佛领导的联邦调查局很可能变成国中之国，不受国家政治领导层的约束。虽然我们必须承认联邦调查局在镇压三K党的活动方面所做的工作，但令人深感忧虑的是，这项工作是从联邦调查局局长从未获得许可的一项调查开始的。\n\n幸运的是，我们最近得到的消息大大加强了我们的底牌。我们通过部分影像证据得知，局长本人是一位隐藏多年的放荡堕落的同性恋者。由于掌握了这一信息，我们以交出有损其名誉的照片换取了胡佛的辞职。随着前局长的离任，我们现在可以任命一位更为忠诚的人来接替他的职位，让联邦调查局再次从属于联邦政府。目前的唯一问题是我们要任命哪位成员。"
 USA.833.a:0 "任命路易斯·盖尔"
 USA.833.b:0 "任命格斯·霍尔"
 USA.834.t:0 "最高法院的变动"
 USA.834.d:0 "迄今为止，对我们的改革政策最强烈的反对声音来自最高法院。虽然他们的职责是保护宪法原则不受立法机构的侵犯，而不考虑政治议程或隶属关系，但实际情况却大不相同。长期以来，最高法院一直是一个带有强烈反改革属性的党派机构。这一点从未像现在这样真实，因为法官们已经与残余的反对派达成了共识，以任何可能的方式拖延、破坏和瓦解着我方的政策。\n\n在用尽了所有其他方法和上诉次数之后，我们只得被迫采取激进措施。如果他们想耍阴招，那我们在这方面的手段就比他们丰富多了。为了达成目的，我们提出了两项建议。第一条是要求扩大最高法院的规模，以确保多数支持者对我们的立法不加考虑地予以批准。第二条的目的相同，并要求向现有的法官强调对错误判决的“惩罚”，以利于我们今后的工作。我们应该选择哪种方法？"
 USA.834.a:0 "合适的规模"
 USA.834.b:0 "……以及正确的裁决"
 USA.835.t:0 "选举人团制度的命运"
 USA.835.d:0 "选举人团制度是在美国历史上的一个与现今截然不同的时期所设计的，是平衡建国各州利益的若干机制之一。然而，随着我们国家的发展以及城市化和科技的进步，选举人团制度不仅变得过时，而且还产生了极为明显的负面作用。人口较少的小州拥有不成比例的选举权，而城市群众的选票价值则大打折扣。此外，对不忠选举人惩罚机制的缺失意味着，即使被剥夺了权利的选民成功地表达了他们的意见，其选举人也可以无视他们的意愿，将他们的票投给另一位候选者，还不用担心受到谴责。\n\n因此，选举人团制度改革的必要性也变得十分明显。剩下的问题是，我们应该采取温和还是更为激进的方法进行改革。第一种方法是在全国范围内制定不忠选举人的惩罚机制，惩罚最高可达监禁，同时我们将仍然保留选举人团，作为对小州的一种让步。第二种做法则是彻底废除选举人团制度，即便这会激怒农村地区的选民，但这也是为了全面推进国家民主的必要之举。我们的决定是什么？"
 USA.835.a:0 "惩罚不忠选举人"
 USA.835.b:0 "彻底废除选举人团制度"
 USA.836.t:0 "第二次制宪会议"
 USA.836.d:0 "虽然我们目前的改革广泛且成功，但它仍然受到了明显的法律条款限制。其中最明显的是几个世纪前起草的宪法，这基本上不适用于当前的环境。虽然有些人声称，抛弃开国元勋的愿景无异于信奉异端邪说，但我们明白，让自己被过去时代那些有着明显局限性的人所制定的戒律束缚也极为疯狂。\n\n为此，我们将召开第二次制宪会议，起草一份既受人民欢迎又符合无产阶级利益的纲领性文件。"
 USA.836.a:0 "开始起草工作"
 USA.837.t:0 "布拉德利将军的政变"
 USA.837.d:0 "以[USA.GetLeader]的革命政策是对国家结构的威胁为由，由奥马尔·布拉德利将军领导的军方内部势力发动了一场政变，其明确目标是“从激进分子手中拯救美国”。尽管斯梅德利·巴特勒和部分左翼人士设法唤起了群众的抗争精神，以阻止政变者的迅速推进，但他们准备不足，装备落后。此外，许多国家机关迄今为止或是选择冷眼旁观，或是积极地站在了布拉德利和他的手下一边。国会山上一片混乱，[USA.GetLeader]总统的位置尚不清楚，他的政府成员对公众的指示也同样混乱且自相矛盾。\n\n尽管目前政府的前景严峻，但布拉德利的政变也失去了出其不意的效果，这极有可能会导致他们的失败。随着事态的发展，不断有报告表明……"
 USA.837.a:0 "布拉德利成功夺权"
 USA.837.b:0 "白劳德总统击败了政变者，并宣布使用紧急权力"
 USA.838.t:0 "第二善意时代"
 USA.838.d:0 "人们普遍认为，美国在其存在期间经历了四种不同的政党制度，总是会有两党中的一个政党或另一个政党占主导地位。虽然有些人认为第五政党制度早已出现，但如今，传统的两党制似乎正在消亡，而第二个善意时代即将到来。在[USA.GETLeader]取得选举的胜利和随后的进行的各种谈判之后，新成立的平民党成为了在美国占主导地位的政党。相对的，就在平民党支持率飙升之际，他们的对手的正在瓦解，重组。\n\n在其内部的左翼力量陷入混乱，一蹶不振之际，共和党选择接纳反动的保守派。团结起来捍卫小型政府和美国的资本主义制度。与此同时，加纳的民主党也彻底抛弃了所有剩下的平民主义者和左翼分子，这些人最终也都加入了平民党。相反，他们吸收了诸多至上党右翼人士和曾经属于威廉·默里的旧民主党的温和派成员。被两党抛下的“散兵游勇”则组成了以杰拉尔德·L·K·史密斯、查尔斯·库格林和弗朗西斯·汤森为中心的联盟党。该党试图将朗的至上党和默里的旧民主党中的强硬右翼分子联合起来，目标是反对社会主义和资本主义的社会经济制度，其奇特的纲领结合了极端民族主义和基督教社会政策。然而，该党自成立以来，领导人间的内斗便从未停歇，因此，许多人认为这一政党注定将走向失败。\n\n如今，民主党和共和党都已认识到，如果第三党平民党取胜，他们就再无力凭一己之力单打独斗，于是双方选择了联合。新党合并了杰斐逊和泰勒的两党之名，称民主共和党（指代杰斐逊和泰勒的两个政党），其支持州权、平衡预算、重回门罗主义，并普遍反对贸易保护主义。然而，平民党的大胜使得这个新生的民主共和党无法夺取足够的政治资源与选民，进而导致他们也沦落为了和联盟党一样的政治地位。似乎在未来的十数年内，平民党独霸政坛的景象不会有任何变化。"
 USA.838.a:0 "这就对了"
 USA.839.t:0 "第二善意时代"
 USA.839.d:0 "人们普遍认为，美国在其存在期间经历了四种不同的政党制度，总是会有两党中的一个政党或另一个政党占主导地位。虽然有些人认为第五政党制度早已出现，但如今，传统的两党制似乎正在消亡，而第二个善意时代即将到来。在[USA.GETLeader]取得选举的胜利和随后的进行的各种谈判之后，新成立的国家人民党成为了在美国占主导地位的政党。然而，就在国家人民党支持率飙升之际，他们的对手的正在瓦解，重组。\n\n在其内部的右翼力量陷入混乱，一蹶不振之际，民主党试图整编美利坚至上党内的民粹派成员，但其最近的一系列事件导致了这个全国性组织的分裂和衰落，以至于大多数的民主党机器支离破碎，导致该党的其他成员开始大规模脱党。在别无选择的情况下，民主党的剩余成员只得选择同他们在国会中的老对手：共和党结盟。与此同时，左翼强硬派在更为激进的社会党旗帜下重新组合，现在由极权派和无政府派组成了一个极不稳定的联盟。自上次政坛洗牌以来，该党一直因领导权和意识形态的内斗而四分五裂，因此，社会党能否在不久的将来重获全国瞩目，仍旧令人怀疑。\n\n在民主党和共和党重新团结在一个旗帜下之后不久，该党就由于其党内左翼和胡佛派以及前民主党人的内部冲突再次分裂。左翼成员要求重新拥抱共和党的平民主义根基，并在出现不可调和的分歧后从党内分裂，与进步党联合在了一起。该党的其余部分仍然在胡佛的领导下，现在已将自己重新塑造为支持小微企业和古典自由主义原则的政党。虽然他们的名字仍是共和党，但该党只是其前身的一个缩影，似乎注定要作为一个“常年陪跑”的第三党派继续前进。\n\n继民主党左派残余势力与农民劳工党联合后，新成立的“农民劳工进步阵线”将作为进步派和平民主义者理想的复兴工具，承诺继续为诺里斯的美国愿景而奋斗。在新选民和他们的政治机器的帮助下，前进步党现在成为了一个大帐篷式的政党，该党汇集了国内形形色色强烈反对国家人民党政策的成员。然而，国家人民党的大胜使得这个新生的“农民劳工进步阵线”无法夺取足够的政治资源与选民，进而导致他们也沦落为了和共和党一样的政治地位。似乎在未来的十数年内，国家人民党独霸政坛的景象不会有任何变化。"
 USA.839.a:0 "这就对了"
 USA.840.t:0 "第五政党体制"
 USA.840.d:0 "人们普遍认为，美国在其存在期间经历了四种不同的政党制度，总是会有两党中的一个政党或另一个政党占主导地位。虽然有些人认为第五政党制度早已出现，但不可否认的是，在政治混乱之后，一个新的政党制度正在形成。在进行多次拉拢选民与政治盟友和随后的进行的各种谈判之后，新成立的平民党仍旧未能掌权。现在，随着民主党的继续掌权，政治形势却已然天翻地覆。\n\n在其内部的左翼力量陷入混乱，一蹶不振之际，共和党选择放弃现有的政治格局，加入声势正旺的民主党，团结起来捍卫小型政府和美国的资本主义制度。与此同时，再次当选的民主党也彻底抛弃了所有剩下的平民主义者和左翼分子，这些人最终也都加入了平民党。相反，出于对连任的渴望，他们吸收了诸多至上党右翼人士和曾经属于威廉·默里的旧民主党的极右翼成员。\n\n作为他们的对手，平民党尽管未能胜选，但也获得了从共和党与进步党中脱离的更多的选民基础，同时几乎所有反对民主党的保守立场的政治家们都被吸纳进入了平民党之中。他们已经获得了在下一届大选中与民主党共同逐鹿的资本。新的两党政治似乎又再一次形成了。"
 USA.840.a:0 "白痴！"
 USA.841.t:0 "第五政党体制"
 USA.841.d:0 "人们普遍认为，美国在其存在期间经历了四种不同的政党制度，总是会有两党中的一个政党或另一个政党占主导地位。虽然有些人认为第五政党制度早已出现，但不可否认的是，在政治混乱之后，一个新的政党制度正在形成。在进行多次拉拢选民与政治盟友和随后的进行的各种谈判之后，新成立的国家人民党还是未能掌权。现在，随着进步党的继续掌权，政治形势却已然天翻地覆。\n\n在其内部的右翼力量陷入混乱，一蹶不振之际，民主党试图整编美利坚至上党内的民粹派成员，但其最近的一系列事件导致了这个全国性组织的分裂和衰落，以至于大多数的民主党机器支离破碎，导致该党的其他成员开始大规模脱党。在别无选择的情况下，民主党的剩余成员中的左翼人士只得选择同他们在国会中的老对手：共和党一道加入进步党的怀抱。而民主党与共和党的右翼成员则几乎全部加入了国家人民党的麾下。n\n作为他们的对手，国家人民党尽管未能胜选，但也获得了从共和党与民主党中脱离的更多的选民基础，同时几乎所有反对进步党的激进立场的政治家们都被吸纳进入了国家人民党之中。他们已经获得了在下一届大选中与进步党共同逐鹿的资本。新的两党政治似乎又再一次形成了。"
 USA.841.a:0 "白痴！"
 USA.842.t:0 "终结激进主义"
 USA.842.d:0 "虽然我们政府是通过民主程序上台的，但似乎我们的政策并没法让所有人都满意，特别是军方内部自1937年诺里斯和进步党阻止了那场史无前例的大动乱后迅速崛起的以斯梅德利·巴特勒、赫伯特·C·霍尔德里奇为首的左翼将军集团，他们对我们尤其不满。近几个月来，他们一直对我们口诛笔伐，而现在，他们更是直接采取了行动：霍尔德里奇带着部下在夜间悄悄包围了首都，叫醒了睡得正香的总统和政府高官，将他们押进了监牢。霍尔德里奇是这样计划的：先公审现任内阁，再逼国会通过新的紧急法，给予他“恢复国家稳定，重组有责任、有能力之政府”的完全权力。\n\n我们可以直接同意他的要求，也可以拒不从命，然后默默祈祷华盛顿特区的国民警卫队能击败这些政变者……"
 USA.842.a:0 "华盛顿国民警卫队挫败了政变阴谋！"
 USA.842.b:0 "政变成功了！激进主义去死吧！"
 USA.843.t:0 "一波未平一波又起？"
 USA.843.d:0 "前几日进步派势力发动的政变过后，国家陷入了自1936年以来最严重的动乱之中，进步派与前国家人民党政府（目前正因违反宪法接受审判）支持者之间的暴力冲突随处可见，死伤者不计其数。虽然共民两党都呼吁各方保持克制，但收效甚微。\n\n乱局之中，一群支持前政府的或右翼或仅仅是反对政变的将军集结在了乔治·巴顿麾下，整备好了人马，准备向首都开进，以“摧毁暗通工团赤匪的政府，恢复秩序，重建真正的美利坚”，而霍尔德里奇这边也在华府备好了部队，架起了防线。整个美利坚的未来都系于这场即将到来的恶战之上……"
 USA.843.a:0 "霍尔德里奇的部下战胜了反政变分子！"
 USA.843.b:0 "巴顿胜利了！美利坚得救了！"
 USA.844.t:0 "劫后重生的美利坚的未来"
 USA.844.d:0 "勇敢无畏的美利坚爱国赤子粉碎了秘密工团布尔什维克分子可悲的政变图谋，乔治·巴顿成了美利坚人民（指真正的美利坚爱国者们，不包括那些仍然在徒劳地打着游击的无政府恶徒们）心中的救国主。\n\n就美利坚的未来一事，巴顿将军有着多种选择，他既可以把权力留在自己手中，留在忠心天地可鉴的爱国者手中，也可以将治国理政的繁文缛节交给专业的政客来做，就比如绰号“苜蓿比尔”的威廉·H·默里（国家进步党的骨干、1936年总统大选的候选人）、小理查德·拉塞尔（比默里更加温和、但爱国激情与之不相上下的民主党人，致力于捍卫美国及其传统），甚至E·H·克伦普（民主党人，凭借着自身庞大的政治机器而权倾一方，不过其腐败也是众所周知）。"
 USA.844.a:0 "以国家稳定为名，巴顿决定留住权力"
 USA.844.b:0 "巴顿选择了苜蓿比尔和旧民主党"
 USA.844.c:0 "巴顿选择了温和的南方民主党人理查德·拉塞尔"
 USA.844.e:0 "巴顿选择了腐败的民主党人克伦普及其强大的政治机器"
#金
USA.900.t:0 "海军的需求！"
 USA.900.d:0 "海军现在要求他们对麦克阿瑟忠诚的回报，他们要求更多的军费，更大的自主权和更多的人力。事实上，陆军和海军之间对于资源的争夺早就路人皆知了，而且这种情况在麦克阿瑟掌权后愈演愈烈。威廉·D·莱希对于麦克阿瑟拒绝交出权力的决定特别不满意，他现在不但想要麦克阿瑟下台，还想禁止他参加国会选举。与此同时，据报道，欧内斯特·金对麦克阿瑟不断试图对海军施加更多的控制（以及保持陆军的总体优势）大为光火。虽然军队里有些人不喜欢这样，但是我们只能同意他们的要求，以确保海军部保持团结。"
 USA.900.a:0 "同意……暂时"
 USA.900.b:0 "不行"
 USA.901.t:0 "欧内斯特·J·金的邀请"
 USA.901.d:0 "海军上将欧内斯特·J·金虽然对麦克阿瑟忠心耿耿，但他显然对如何治理这个国家有自己的看法。更糟糕的是，他厌倦了来自麦克阿瑟办公室无情的命令，认为麦克阿瑟不比他好到哪里去，并且认为陆军没有权利控制海军。尽管金的批评与莱希的不同，但如果我们想要建立一个稳定的政权并最终赢得战争，这两人似乎都是需要应对的威胁。注意到莱希对麦克阿瑟的敌意，金向麦克阿瑟提出了接管整个海军的提议，以便使其更有效地运行，同时也保证海军内部的某种稳定。然而，其他海军将领警告说，金是一个比莱希更不值得信赖的顾问，他只顾追逐自己的利益。J·埃德加·胡佛提出，如果有必要，他会想办法除掉金上将，但鉴于金的才华，我们不能接受他的提议。我们必须决定：我们是接受金的提议还是冒着拒绝他可能造成的风险？"
 USA.901.a:0 "支持金"
 USA.901.b:0 "请国会帮助我们把这些海军将领们绳之以法！"
 USA.901.c:0 "不，我们现在就很好"
 USA.902.t:0 "莱希领导民主力量发动了对政府的政变"
 USA.902.d:0 "尽管海军上将威廉·D·莱希最初暗中支持麦克阿瑟政权，但很快就发现，两人在对待国会和华盛顿其他地方的方式上存在分歧。莱希认为，军队在很大程度上应该置身于政治之外，他抗议麦克阿瑟对国会的限制，认为这些限制危及美国建国的根本原则。最近，在一个似乎具有分水岭意义的时刻，麦克阿瑟宣布军队也将在国会选举中发挥作用，这导致莱希领导着不满的政客、海军将领，甚至一些陆军军人发动了政变。\n\n道格拉斯·麦克阿瑟在政变中被捕，政变过程几乎没有流血，这似乎是一个极好的结果，当然也是一个极其危险的策略。然而，莱希现在必须与美国的其余势力竞争，西部军的布拉德利和艾森豪威尔也许同情莱希的事业，但不太可能赞成海军统治陆军，西海岸的伪政府，以及各种威胁国家分裂的极端主义派别就更不用说了。无论如何，莱希得到了华盛顿大部分人的支持，似乎连欧内斯特·金都同意支持莱希的领导，并将他视为他可追随的唯一人选。接下来会发生什么还有待观察。"
 USA.902.a:0 "摧毁我们所信仰的一切是无法赢得战争的！"
 USA.903.t:0 "金控制了华盛顿！"
 USA.903.d:0 "当道格拉斯·麦克阿瑟接管政府时，海军上将欧内斯特·金是最初支持这一决定的人之一，他认为这是拯救国家免遭某种毁灭的必要之策。但从那以后，金就对麦克阿瑟的指挥感到恼火，认为麦克阿瑟不断解雇海军人员是对海军的不敬，也是对战争努力的威胁。尽管麦克阿瑟最近让步了，让金控制了海军，但此举似乎只是金为了获得更多权力的一次尝试，而且最终取得了成功。在莱希和几位心怀不满的将军的支持下，金今天在华盛顿发动政变，逮捕了道格拉斯·麦克阿瑟，并在短短几小时内控制了政府。\n\n现在，金必须面对由麦克阿瑟挑起的这场战争，虽然时间还没过多久，但看起来，金要在内战中取得胜利，将面临重重障碍。德怀特·艾森豪威尔和奥马尔·布拉德利领导的西部军不太可能支持金，他们认为金不过是麦克阿瑟的翻版，而且由于他穿的是海军制服而不是陆军制服，他们更不可能支持金了。与此同时，太平洋国肯定会将此次政变视为本国政权存在的又一个理由，辩称西方存在真正的稳定。除了这些集团之外，我们还必须对付在我们合法领土上横行霸道的各种极端主义分子。未来还不明朗……"
 USA.903.a:0 "任何不愿冒险的人都一文不值。"
 USA.904.t:0 "效忠麦克阿瑟的人逃往西方！"
 USA.904.d:0 "虽然我们成功地逮捕了道格拉斯·麦克阿瑟，但他的许多亲信在政变那天都逃离了我们，现在他们已经向西逃到了西部军去。海军上将金谴责了这些人，认为他们效忠的是个人，而不是国家，也许他们在西部军更有用。任何一方都没有提及的是，这只是陆军和海军之间似乎日益加剧的竞争的最新结果，不过现在是以西部军对抗美国政府的形式表现出来罢了。据说德怀特·艾森豪威尔个人对金很反感，认为金的傲慢和侵略行为与美国海军上将的身份不相称。就奥马尔·布拉德利而言，他对金基本上保持沉默，但似乎艾森豪威尔和布拉德利都对华盛顿的金没有好感。在美国历史上，陆军和海军之间的分歧从来没有如此明显，如果我们不迅速采取行动，这肯定会成为战后多年紧张局势的导火索。"
 USA.904.a:0 "如果有必要，也许我们可以和陆军和解。"
 USA.904.b:0 "我们不需要他们！"
 USA.905.t:0 "终战？"
 USA.905.d.king:0 "内战即将结束，这应该是联邦军队庆祝的理由，然而，全国各地的局势都很紧张。当海军上将欧内斯特·金接管美国政府时，陆军和海军之间的竞争加剧了，他推翻了暴君，但很快就成为了一个暴君。现在，我们必须做出选择。我们是要推动恢复民主政府，还是向金提出他无法拒绝的条件？"
 USA.905.d.leahy:0 "内战即将结束，美国陆海军为了国家的利益将分歧搁置一边，这是值得庆祝的事情。奥马尔·布拉德利，德怀特·艾森豪威尔和威廉·莱希已经就如何恢复这个遭受重创的国家的民主达成了一致，我们将一起走向一个新的未来！"
 USA.905.a:0 "我们必须做正确的事！"
 USA.905.b:0 "我们必须保证国家的稳定！"
 USA.905.c:0 "这是重建国家的第一步！"
 USA.906.t:0 "西部叛乱！"
 USA.906.d:0 "今天，有关内战似乎已经结束的消息没有引起多大反响。美国陆军和海军之间的紧张关系比以往任何时候都要严重，尽管在金对付麦克阿瑟的时候，布拉德利和艾森豪威尔站在他一边，但他们现在不会再保持沉默。这两个人宣称自己是民主的救世主，开始反对我们！看来这场内战会比我们想象的持续更久。"
 USA.906.a:0 "叛徒！"
 USA.907.t:0 "金政府的新旗帜"
 USA.907.d:0 "在金海军上将巩固自己在美国海权领中的权力的过程中，一种想法出现在了许多人的脑海中，那就是把美国的海军旗（代表各州的星星在蓝底上排列得满满当当）转正为正式国旗，甚至还有人不满足于此，把十三殖民地时期的第一座海军旗（十三道红白条，上加黄色蛇形图案）搬了出来。那么我们要如何做呢？"
 USA.907.a:0 "坚持用星条旗"
 USA.907.b:0 "使用当代海军旗"
 USA.907.c:0 "使用最早的海军旗"
 USA.908.t:0 "欧内斯特的海权领的疆域"
 USA.908.d:0 "欧内斯特·J·金海军上将手下的海军将官们在漫长的第二次大重建时期完全掌控了国家机器，曾经撕碎了旧联邦的叛乱各州和歹毒叛徒们也死的死、归顺的归顺，而美国也在动荡不安的世界局势中一跃成为了世上最强大的海军力量，如今，天时地利人和皆备，金及其在军队中的鹰派同僚，还有他那不断膨胀的军工复合体，终于可以在波涛汹涌的大海上自由地执行自己的外交政策了。不过，首先需要确定的是，我们到底要把自己的力量和影响力投射到多远的地方。是要停留在美利坚的熟悉海域之中，还是追求另一种形式的海上门罗主义，亦或是让我们强大的风帆和以美国为名的冒险之心去到更远的地方呢？"
 USA.908.a:0 "止步美利坚的水域，尽量不引起不必要的注意力"
 USA.908.b:0 "新大陆的宝藏和它的处女水域都是我们的"
 USA.908.c:0 "新大陆和太平洋的宝藏还有它们的处女水域都是我们的"
 USA.908.e:0 "地球上的每一个角落都要有我们舰队的身影！"
 USA.909.t:0 "使国会服从"
 USA.909.d:0 "今天，海军上将金宣布了对国会权力的新限制，这主要源于他对该机构的不信任，以及迄今为止他们在帮助他治理国家方面的故意无能。事实上，他们非但没有帮助他，反而妨碍了他，他们拒绝为海军提供资金，他们一直是金的眼中钉。早在很久以前，我们就与这些腐败且不受欢迎的“立法者”打交道了。毕竟，他们中绝大多数人的真正利益在于他们作为个人的自身利益，这是民主党人固有的习性，以及普通国会议员认为他什么都知道的信念，极大地阻碍了我们的战争努力。这种无知、贪婪和傲慢不能再继续下去了，因此，是时候决定我们下一步的行动了。我们会下令逮捕所有的国会议员，让那些闹事的人闭嘴，还是试图为我们的行为找到合法的理由？"
 USA.909.a:0 "把他们都送去吃牢饭！"
 USA.909.b:0 "让最坏的人闭嘴！"
 USA.909.c:0 "我们必须让人民站在我们这边……"
 USA.910.t:0 "保护换资金"
 USA.910.d:0 "欧内斯特·金提出了一项与海军安全有关的创新计划，尽管他的批评者认为这仅仅是旧战略的再利用而已。随着美国内战的来临以及大西洋两岸为一场全球冲突所做的准备，尽可能保证航路的安全以保证海上贸易的畅通比以往任何时候都显得更为重要。当然，如果没有真正的海上力量，这种保护是不可能实现的，而金非常愿意向大西洋两岸的国家提供这种力量，只是有点条件。我们的一些顾问叫喊说，这和海盗行为无异，但金坚持说，我们只是在利用我们的资源来赢得战争而已。我们可以冒着激怒邻国的风险继续推进这个计划，或者我们可以重新考虑一下。我们该怎么办？"
 USA.910.a:0 "大干一场，看看我们的邻居有什么反应！"
 USA.910.b:0 "风险太大了……"
 USA.911.t:0 "一个来自美国的奇怪要求"
 USA.911.d:0 "今天，美国政府给了我们一个奇怪的提议。在海军上将欧内斯特·金的领导下，他们的舰船以惊人的数量在海上巡逻，表面上是为了“巡逻海岸线”。尽管表面上这么说，他们的船只只是在大西洋的两端跑来跑去，现在他们要求我们向他们支付资源或通过其他手段，以换取他们所谓的“保护”——大概是保护我们不受他们的掠夺吧，而且几乎公开的事实是，这些海军正在袭击那些弱国小国、不会反抗的船只。然而，也许我们可以勇敢地面对这个傲慢的国家。这样做会有代价，但为了挽回面子也许值得一试。"
 USA.911.a:0 "我们别无选择……"
 USA.911.b:0 "勇敢地面对这些海盗！"
 USA.912.t:0 "来自美国的侮辱性要求"
 USA.912.d:0 "作为一个正处于内战中的国家，很少有人会想到美国会威胁到更强大的国家，但这正是它决定要做的。他们的外交官们已经联系我们，向我们保证，如果我们支付他们应得的金钱，他们就会不再袭击我们，就好像他们是大海的主人一样！这种情况是不能容忍的，但如果他们愿意，他们也足够强大，足以成为我们的眼中钉。我们应该合作，还是叫他们滚蛋？"
 USA.912.a:0 "合作，从现在开始……"
 USA.912.b:0 "他们怎敢？"
 USA.913.t:0 "给金一张空白支票？"
 USA.913.d:0 "为了为战争努力争取更多资源，欧内斯特·金把目光转向了国会，试图获得一张空白支票。这一“空白支票”将允许金做任何必要的事情来提取他认为绝对必要的资源，这主要涉及工厂和造船厂的建设。考虑到美国在内战中的强硬立场，这不是国会是否会接受的问题，而是哪个提案更有可能通过的问题。我们是应该认为造船厂是这场战争中最重要的部分，还是应该寻求全面的工业建设？"
 USA.913.a:0 "专注于造船厂"
 USA.913.b:0 "我们必须把我们的工业作为一个整体来建设"
 USA.914.t:0 "太平洋和解"
 USA.914.d.presidency:0 "美利坚太平洋国与我们的其他对手形成了鲜明对比，其民主色彩更为浓厚，或许也更愿意与我们展开外交接触。为挽救众多宝贵的美国将士与平民生命，我国政府决定向太平洋国政府伸出橄榄枝，通过一项全面的和平协议，彻底结束当前的敌对状态。尽管达成此举的希望渺茫，但一份全面的和平协定将能拯救无数美军士兵与普通民众的生命。为争取这些分裂派系的支持，我们拟定了两项主要方案：其一，派遣备受尊敬的乔治·马歇尔，让这位与美国现存高层关系密切的盟友与心腹协助我们与太平洋国政府进行和解斡旋，借助其崇高威望与广泛人脉，为双方争取更为有利的条款与对话氛围。其二，我们也可选择规避马歇尔那“诱人歌声”可能失效的风险，直接向太平洋国国家元首[CAL.GetLeader]总统提出出任白宫最高职位的机会。虽然这一提议看似十分激进，并遭到内阁中诸多保守派与顽固分子的反对，但如此丰厚的橄榄枝几乎必然能促成这份亟需的和平协议。我们究竟该如何抉择？"
 USA.914.d.nopresidency:0 "美利坚太平洋国与我们的其他对手形成了鲜明对比，其民主色彩更为浓厚，或许也更愿意与我们展开外交接触。为挽救众多宝贵的美国将士与平民生命，我国政府决定向太平洋国政府伸出橄榄枝，通过一项全面的和平协议，彻底结束当前的敌对状态。尽管达成此举的希望渺茫，但一份全面的和平协定将能拯救无数美军士兵与普通民众的生命。为争取这些分裂派系的支持，我们拟定了两项主要方案：其一，派遣备受尊敬的乔治·马歇尔，让这位与美国现存高层关系密切的盟友与心腹协助我们与太平洋国政府进行和解斡旋，借助其崇高威望与广泛人脉，为双方争取更为有利的条款与对话氛围。其二，我们也可选择规避马歇尔那“诱人歌声”可能失效的风险，可直接向太平洋国代理元首弗兰克·梅里亚姆州长提出出任白宫最高职位的机会。虽然这一提议看似十分激进，并遭到内阁中诸多保守派与顽固分子的反对，但如此丰厚的橄榄枝几乎必然能促成这份亟需的和平协议。我们究竟该如何抉择？"
 USA.914.a:0 "团结与和平是我们最迫切的需要！把战后的白宫让给他们！"
 USA.914.b:0 "乔治·马歇尔将帮助我们弥合美国人民之间的分歧。"
 USA.914.c:0 "只追求两国间更好的关系，他们太极端了，无法领导我们……"
 USA.915.t:0 "关于美国未来的会议"
 USA.915.d:0 "随着美国内战一天比一天接近结束，随着像道格拉斯·麦克阿瑟这样的暴君被废黜，美国正站在新的未来的道路上，前方的道路充满了不确定性。为了更好地确定一个一致的方向，让这个陷入困境的国家走上复苏之路，代理国家元首威廉·莱希决定会见联邦主义者的斗士，反对所谓美国恺撒的德怀特·艾森豪威尔将军和奥马尔·布拉德利将军。在推翻麦克阿瑟的过程中，这两位将军统治着美国西部，因此，如果要实现莱希恢复民主的目标，与他们的合作是至关重要的。虽然莱希可能在美国面临的每一个问题和困境上都与这些人的意见不一致，但他们都同意美国民主和个人自由的基本需要——这些思想从合众国成立之初就构成了合众国的基石。虽然没有人会清楚地知道这三位美国政府的巨人在他们烟雾弥漫的办公室和休息室里讨论了什么，但美国人民可以松一口气了，因为他们正在努力为美国的新未来开辟道路。"
 USA.915.a:0 "这些智者将带领美国走向救赎。"
 USA.916.t:0 "莱希上将提出了一个提议！"
 USA.916.d.presidency:0 "今天，华盛顿哥伦比亚特区的联邦政府向我们递来了一项颇为奇特的提案。与我们几个月前所熟悉的那座华府不同，此时的它早已面目全非。自从道格拉斯·麦克阿瑟掌控国家并自封为独裁者以来，民主政府的一切表象皆被抹除殆尽。然而，事态又起波澜，海军上将威廉·D·莱希联合一批心怀不满的政客与军官发动政变，推翻了麦克阿瑟的统治，如今正在筹划以任何可行的方式恢复民主制度。令人意想不到的是，他们的计划竟然牵涉到我们的政府，宣称我们才是旧合众国政府的合法继承者。如果他们同意停战，将让[CAL.GetLeader]就任美国的新任总统，而美国海军则会以民主拯救者的身份，在政府中临时拥有更为突出的角色。这无疑是一则震撼性的提议，尽管这个新政权充满可疑之处，但或许我们仍可以给予信任。我们应该如何回应？"
 USA.916.d.nopresidency:0 "今天，华盛顿哥伦比亚特区的联邦政府向我们递来了一项颇为奇特的提案。与我们几个月前所熟悉的那座华府不同，此时的它早已面目全非。自从道格拉斯·麦克阿瑟掌控国家并自封为独裁者以来，民主政府的一切表象皆被抹除殆尽。然而，事态又起波澜，海军上将威廉·D·莱希联合一批心怀不满的政客与军官发动政变，推翻了麦克阿瑟的统治，如今正在筹划以任何可行的方式恢复民主制度。令人意想不到的是，他们的计划竟然牵涉到我们的政府，宣称我们才是旧合众国政府的合法继承者。如果他们同意停战，将让未来的太平洋国总统就任美国的新任总统，而美国海军则会以民主拯救者的身份，在政府中临时拥有更为突出的角色。这无疑是一则震撼性的提议，尽管这个新政权充满可疑之处，但或许我们仍可以给予信任。我们应该如何回应？"
 USA.916.d.Marshall.presidency:0 "今天，华盛顿哥伦比亚特区的联邦政府向我们递来了一项颇为奇特的提案。与我们几个月前所熟悉的那座华府不同，此时的它早已面目全非。自从道格拉斯·麦克阿瑟掌控国家并自封为独裁者以来，民主政府的一切表象皆被抹除殆尽。然而，事态又起波澜，海军上将威廉·D·莱希联合一批心怀不满的政客与军官发动政变，推翻了麦克阿瑟的统治，如今正在筹划以任何可行的方式恢复民主制度。令人意想不到的是，他们的计划竟然牵涉到我们的政府，他们声称，战后可让我们与他们选定的候选人同台竞选。也就是说，若我们同意停火，他们将促成[CAL.GetLeader]作为候选人之一，与他们的候选人共同角逐，胜者将成为美国总统。在此期间，美国海军则会以民主拯救者的身份，在政府中临时拥有更为突出的角色。这无疑是一则震撼性的提议，尽管这个新政权充满可疑之处，但或许我们仍可以给予信任。我们应该如何回应？"
 USA.916.d.Marshall.nopresidency:0 "今天，华盛顿哥伦比亚特区的联邦政府向我们递来了一项颇为奇特的提案。与我们几个月前所熟悉的那座华府不同，此时的它早已面目全非。自从道格拉斯·麦克阿瑟掌控国家并自封为独裁者以来，民主政府的一切表象皆被抹除殆尽。然而，事态又起波澜，海军上将威廉·D·莱希联合一批心怀不满的政客与军官发动政变，推翻了麦克阿瑟的统治，如今正在筹划以任何可行的方式恢复民主制度。令人意想不到的是，他们的计划竟然牵涉到我们的政府，他们声称，战后可让我们与他们选定的候选人同台竞选。也就是说，若我们同意停火，他们将促成未来的太平洋国总统作为候选人之一，与他们的候选人共同角逐，胜者将成为美国总统。在此期间，美国海军则会以民主拯救者的身份，在政府中临时拥有更为突出的角色。这无疑是一则震撼性的提议，尽管这个新政权充满可疑之处，但或许我们仍可以给予信任。我们应该如何回应？"
 USA.916.a:0 "我们不会与独裁者合作，而玷污我们的事业！"
 USA.916.b:0 "一笔为了美国人民做的交易！"
 USA.917.t:0 "西部拒绝了我们的提议！"
 USA.917.d:0 "太平洋国考虑了我们以总统换和平的协议，但似乎他们对我们不够信任，无法与我们达成协议。虽然我们以和平、民主方式解决问题的希望破灭了，但也许我们可以期待战争以我方的胜利而结束……"
 USA.917.d.Marshall:0 "太平洋国考虑了我们以选举换和平的提议，但似乎他们对我们不够信任，无法与我们达成协议。虽然我们以和平、民主方式解决问题的希望破灭了，但也许我们可以期待战争以我方的胜利而结束……"
 USA.917.a:0 "艰难时代"
 USA.918.t:0 "西部接受了我们的提议！"
 USA.918.d:0 "事成了！太平洋国在认真考虑了我们的和平提议后，已决定全面接受的提议，现在他们正同我们的部队进行和平谈判。我们期望他们在战争结束后如承诺的那样取得总统一职，以及进行一些主要涉及从政府内部撤出军队的政策让步。然而，毫无疑问，莱希在拯救民主中的作用将在未来几十年里得到传颂，这些力量将一起拯救这个国家！"
 USA.918.d.Marshall:0 "事成了！太平洋国在认真考虑了我们的和平提议后，已决定全面接受的提议，现在他们正同我们的部队进行和平谈判。我们期望他们在战争结束后如承诺的那样进行选举，以及进行一些主要涉及从政府内部撤出军队的政策让步。然而，毫无疑问，莱希在拯救民主中的作用将在未来几十年里得到传颂，这些力量将一起拯救这个国家！"
 USA.918.a:0 "万岁！"
 USA.918.b:0 "好极了！"
 USA.919.t:0 "最终对决！"
 USA.919.d:0 "合众国和太平洋国是内战大赛中的决赛选手，不过双方都遵守各自达成的条约。现在的问题是如何统一美国，因为双方都认为自己是合法的美国政府。正如所承诺的那样，我们应该派一名外交官到华盛顿，以确保他们能把我们的总统送入白宫。另一方面，一些太平洋国的人正在敦促我们应首先要求莱希和他的部队撤退——我们不希望麦克阿瑟政变重演。"
 USA.919.d.Marshall:0 "合众国和太平洋国是内战大赛中的决赛选手，不过双方都遵守各自达成的条约。现在的问题是如何统一美国，因为双方都认为自己是合法的美国政府。正如所承诺的那样，我们应该派一位代表到东部去开始选举。并提议由投票监督委员会协助防止干预，失败的一方将被给予比战前时期更多的自治权，以更符合他们自己的利益的方式来管理他们的地区。由于在最近被征服的地区，大多数国会议员席位仍然空置，公投将使用比例代表制来决定这些地区被任命的人数，让胜选者有机会实施他们的议程。另一方面，一些太平洋国的人正在敦促我们应首先要求莱希和他的部队撤退——我们不希望麦克阿瑟政变重演。"
 USA.919.a:0 "提出要求"
 USA.919.b:0 "联邦军队必须撤退"
 USA.920.t:0 "太平洋国要求我们撤退！"
 USA.920.d:0 "太平洋国要求我们下台，声称我们对内战负有部分责任，我们的政府也只是临时政府。他们声称，如果我们投降，他们将支持大赦所有军人，但这显然意味着由西部政府主导政治，可能还会危及海军地位，我们显然不能接受。最激进的联邦主义者感到被出卖了，呼吁我们进攻太平洋国。"
 USA.920.a:0 "叛徒！"
 USA.921.t:0 "莱希同意了"
 USA.921.d:0 "莱希已经接受了这一提议，我们正在组建一个委员会来监督和指导权力的移交。即使有少数强硬派感到不安，我们大多数公民都认为战争最终会和平结束。"
 USA.921.d.Marshall:0 "莱希已经接受了这一提议，我们正在组建一个委员会来监督和组织全民公投。即使有少数强硬派感到不安，我们大多数公民都认为战争最终会和平结束。"
 USA.921.a:0 "很好"
 USA.921.b:0 "好"
 USA.922.t:0 "和平过渡"
 USA.922.d:0 "今天，当这位和平当选的西方总统入主白宫时，数以百万计的美国人内心感到自豪。海军上将威廉·D.莱希，在战争期间领导国家，在离开白宫前往爱荷华州汉普顿的家中之前，有人看到他与[CAL.GetLeader]进行了数小时的会晤。尽管新政府还需要一段时间才能稳定下来，但民主似乎终于回到了美国。我们永远不会忘记莱希上将和美国海军为拯救我们的国家所做的一切！"
 USA.922.a:0 "上帝保佑美国！"
 USA.923.t:0 "公投开始"
 USA.923.d:0 "全国投公投已经开始，所有参与的政党正充分地使用他们的竞选技能和政党机器，竭力试图将自己标榜为恢复稳定、自由主义和正义的选择，要么声称要开辟一条新的美国道路，确保另一场内战和之前的不公正不会再次发生。"
 USA.923.a:0 "我们最好能赢"
 USA.924.t:0 "结果出炉！"
 USA.924.d:0 "决定联邦政府领导权的公投结果终于揭晓，各方政府都将自身合法性押注于接受这一结果之上。目前正在探讨的潜在妥协方案是：允许其中一方政府保留立法机构（从而掌握主要合法性），同时吸纳另一方的行政机构。最终，票数将十分接近，而胜出者是——"
 USA.924.a:0 "太平洋政府"
 USA.924.b:0 "联邦政府"
 USA.924.c:0 "太平洋国会加联邦行政机构（扮演美利坚太平洋国继续游戏）"
 USA.924.e:0 "联邦国会加太平洋行政机构（扮演美利坚合众国继续游戏）"
 USA.925.t:0 "国会做出决定"
 USA.925.d:0 "随着我们已经牢固地建立起了民主的框架，我们这个重新建立的国家的基础也正在巩固，国会已经开始考虑如何选择莱希上将的继任者。几周以来，国会议员和内阁成员一直在为权力交接的最佳方式争论不休，但最终国会准备进行最终投票。这场辩论的焦点是，是让国会做出决定，还是让美国人民来决定莱希的继任者。无论国会决定走哪条路，他们都必须确定这条路是正确的，因为他们的决定将为未来几十年重建的美国民主奠定基础。"
 USA.925.a:0 "自由公正的选举是唯一的出路。"
 USA.925.b:0 "国会应任命一名候选人。"
 USA.926.t:0 "[FROM.GetName]俯首称臣！"
 USA.926.d:0 "[FROM.GetName]的明智之士认定，我们的要求确属正当，因此他们将接受我们为其制定的海军计划。"
 USA.926.a:0 "棒极了"
 USA.927.t:0 "太平洋国提议！"
 USA.927.d:0 "太平洋国已经决定，既然他们在战争过程中同联邦政府是盟友，并且我们把军政府放在一边，以给他们的[CAL.GetLeader]在白宫应有的位置，所以联邦政府或多或少是民主之友。由于只有少数几位最高法院法官仍然在世且可信，这将有效地推动将最高法院的权力移交给[CAL.GetLeader]。我们的一些官员认为西部财阀和政治精英的仅仅是利用这个机会重申他们占主导地位的政治体系和扼杀军队的发展，他们呼吁我们拒绝履行协议，并要求他们屈服于人民的意志。"
 USA.927.d.Marshall:0 "太平洋国经过权衡后决定：鉴于美利坚合众国在战争期间始终是民主阵营的盟友，他们决定搁置对军方成见，提议通过全民公投决定国家领导权——无论太平洋国或联邦政府哪方胜出，都将成为新联合政府的主导力量。由于最高法院仅存的几位大法官仍具公信力，胜者还将自然获得最高法院控制权，并可根据公投结果按比例分配各占领区的行政任命权。耐人寻味的是，选票将立法机构与行政机构分开计票，这意味着我们可能迎来一位统领华盛顿国会的太平洋国总统，或是相反的局面。\n然而军中部分将校认为，这不过是西方金融寡头与政治精英借机重掌权柄、扼杀军方影响力的阴谋。他们力主拒绝妥协，要求一鼓作气迫使对方臣服于人民意志——用刺刀而非选票终结这场博弈。"
 USA.927.a:0 "同意"
 USA.927.b:0 "接受选举提议"
 USA.927.c:0 "干爆他们"
 USA.928.t:0 "[FROM.GetName]负隅顽抗！"
 USA.928.d:0 "统治[FROM.GetName]的疯子们竟认为我们慷慨的提议是“侮辱”，并拒绝与我国政府进行任何合作。他们下一步的动向尚待观察，但为可能的对抗做好准备是明智之举。"
 USA.928.a:0 "去他们的！"
 USA.929.t:0 "亡羊补牢？"
 USA.929.d:0 "麦克阿瑟这个暴君总算落得了应得的下场。现在，我们需要继续追查参与他反民主阴谋的同谋。其中涉案最深、最危险的人物，恐怕正是联邦调查局局长埃德加·胡佛，据信他协助了麦克阿瑟夺取权力。如果要继续调查这位局长，我们将与国会合作成立一个独立委员会，审查联邦调查局的内部架构，以及该局在内战最初几个月扮演的角色。我们必须谨慎行事，因为胡佛势力庞大，试图将他赶下台可能异常凶险。即使是莱希核心圈子里的人，包括那些力主处死麦克阿瑟的，也对深入追查局长的涉案有所忌惮。"
 USA.929.a:0 "这些叛徒必须接受正义的审判！"
 USA.929.b:0 "暗中肯定有什么大手在操控"
 USA.930.t:0 "打倒海军上将莱希"
 USA.930.d:0 "我们本想揭露联邦调查局参与麦克阿瑟政变的内幕，结果却发现背后竟是一张由政客、军方官员和行业巨头共同编织的网络，他们全都参与了推翻民选政府的阴谋。任何试图公开这些信息、深入调查局长活动的努力，都如同石沉大海，毫无回音；独立调查者接连失踪，国会委员会则一致宣称，胡佛局长在麦克阿瑟政变中并未犯下任何过失。麦克阿瑟死后，首都的紧张局势早已居高不下，胡佛立刻指使调查局针对我们的行政部门，不择手段地搜罗各种真真假假的黑料，往政府身上泼脏水。由于媒体都听命于局长，莱希上将便被污蔑成与工团主义特务勾结、企图瓦解美国情报网络并向敌人投降的叛徒。随着华盛顿特区大范围骚乱的爆发，一支由麦克阿瑟的前军事情报主管、政变关键策划者查尔斯·A·威洛比领导的忠诚派队伍，已获得联邦调查局局长的许可，开进首都夺取权力。"
 USA.930.a:0 "“正义是法律与秩序的附属品。”"
 USA.931.t:0 "首都发生政变"
 USA.931.d:0 "我们收到来自华盛顿的报告，称和解政府已被忠于已故麦克阿瑟将军的势力推翻。我们两国政府间和平统一的任何希望，都迅速地被这些暴君粉碎了。"
 USA.931.a:0 "准备作战！"
 USA.932.t:0 "回归“民主”？"
 USA.932.d:0 "内战过后，国家正在慢慢复苏。真爱国者党的盟友里已有人对民主制度迟迟未能恢复而颇有微词。虽然我们决不会让激进分子染指总统宝座，胡佛局长还是建议放弃部分战时权力，为内战后第一次选举铺平道路，由真爱国者党作为唯一合法政党参选。按照胡佛的提议，已故麦克阿瑟将军的狂热追随者、年轻的海军军官乔治·林肯·洛克威尔，将作为该党的候选人。比起前任总统们，他确实年轻得不同寻常，但这位军官已经证明自己极有头脑，且深知我们种族的天命所在。不过，威洛比将军和参谋长联席会议仍担心国家面临社会主义颠覆的威胁，因为第三国际正在世界各地大肆破坏。威洛比将军深信，美军必须继续履行保护美国人民的神圣职责，直到社会主义的祸害被彻底根除。"
 USA.932.a:0 "我们的战斗远未结束，威洛比是我们的人！"
 USA.932.b:0 "祝年轻的洛克威尔军官好运！"
 USA.933.t:0 "众志成城，合众为一"
 USA.933.d:0 "道格拉斯·麦克阿瑟将军虽未能在生前看到内战的终结，但他的牺牲并非徒劳。在莱希海军上将的未遂政变后，查尔斯·A·威洛比将军恢复了华盛顿的秩序，继承了已故将军的使命，履行了军队维护联邦统一的神圣职责。亚特兰大、芝加哥、新奥尔良和萨克拉门托的叛军，都已在美国武装力量压倒性的威力与卓越的战术下土崩瓦解。正如近八十年前我们的联邦先辈一样，我们现在必须开启重建进程，让我们的国家最终得以愈合。"
 USA.933.a:0 "战争中，胜利无可替代"
 USA.934.t:0 "重整落基山脉"
 USA.934.d:0 "西部联邦派背弃了保卫联邦的天职，转而追求个人所谓的崇高理想。他们切断了与华盛顿的一切联系，宣称我们为非法政府。这些心怀叛意、自私自利的将军企图让军队自相残杀。为重新控制丹佛，我们必须迅速行动。我们的特工报告称，由于背叛合法政府的决定，西部军方内部的紧张气氛日益加剧。其中，柯蒂斯·李梅最为引人注目，这位年轻的航空兵团中尉野心勃勃。他是已故麦克阿瑟将军的忠实信徒，据信有能力在军中发动一场亲麦克阿瑟的叛乱，恢复落基山地区的法治与秩序。胡佛局长认为，若能大力扶持这个秘密团体，便能换取他们的忠诚，在对抗威胁联邦的叛乱分子时开辟第二战线。参谋长联席会议掌握着此项提议的最终决定权。我们该如何抉择？"
 USA.934.a:0 "大力投资由这些效忠派领导的政变"
 USA.934.b:0 "给予秘密支持，并寄望于最好的结果"
 USA.934.c:0 "让这些叛徒下地狱去吧！开战！"
 USA.935.t:0 "麦克阿瑟效忠派发动政变！"
 USA.935.d:0 "凌晨时分，爆炸与枪声骤然将丹佛从睡梦中惊醒。发动这场袭击的，既非入侵的敌军，也不是工团主义恐怖分子，而是我们自己的武装部队。然而，这场背叛其实早有端倪——过去几个月，联邦派系内部一直矛盾暗涌。忠于艾森豪威尔将军和布拉德利将军的一派，与由年轻空军中尉柯蒂斯·李梅领导的麦克阿瑟派之间分歧日深，如今终于到了彻底爆发的地步。即使将军去世后我们仍对他忠心不贰，但我们支持海军上将威廉·D·莱希领导的临时政府，早已引得这帮狂热分子怨声载道；而我们做出与查尔斯·A·威洛比那所谓的“合法”政府彻底断绝联系的决定，更是最终将这派人推向了决裂的边缘。\n\n过去几周，李梅及其部队一直在暗中与华盛顿的新政权串谋，如今已夺取了国民警卫队军械库以及丹佛各处战略要地。李梅下令要求我们投降，并立即承认华盛顿当局是美国政府的合法延续。眼下我们已退无可退，是应当避免更多流血，向这群阿谀奉承之辈屈服，还是不顾艰险，抗击这些暴君，为我们的民主与宪法奋战到底？"
 USA.935.a:0 "我们不能与兄弟为敌，向李梅投降吧"
 USA.935.b:0 "我们必须履行我们的职责，无论胜算如何"
 USA.936.t:0 "真爱国者"
 USA.936.d:0 "全国各地的代表齐聚华盛顿，组建了一个名为“真爱国者党”的新政党。他们怀着守护基督教价值观、捍卫白人种族的共同信念，聚到一起制定党纲，力求最终能够代表那些长久被遗忘的美国人。当晚第一位登台的讲者正是威洛比将军本人。将军的口音不大好懂，时而还显得含混，但他向内战老兵致敬、捍卫美国价值观的演说，赢得了全场起立鼓掌。前共和党和民主党建制派人物罗伯特·A·塔夫脱和罗伯特·赖斯·雷诺兹，也对刚成立的“真爱国者党”表示支持，并敦促同僚们效仿。第三晚最引人瞩目的发言人，可能要数年轻的海军军官乔治·林肯·洛克威尔。此人并未为公众所熟知，但他激情四射的言辞瞬间席卷了整个会场。听众紧紧追随着他的每一句话，他振臂高呼，痛斥那些谋害了麦克阿瑟将军的工团主义叛徒和犹太阴谋家，把人群煽动得无比狂热。全国数百万民众通过广播收听，年轻的洛克威尔和真爱国者党，由此牢牢确立了美国新兴政治力量的地位。"
 USA.936.a:0 "为人民服务的政党！"
 USA.937.t:0 "威廉与魏登巴赫"
 USA.937.d:0 "查尔斯·A·威洛比凭借其德国血统和对德意志帝国的亲近感，在军旅生涯中早已声名鹊起，而担任总司令一职更使他处于独特地位，得以将美洲与欧洲的两大主宰拉得更近。在对德意志帝国进行外交访问期间，威洛比将军如鱼得水，他运用多门流利语言博得了帝国外交官们的好感。威洛比沉醉于阅兵式的严明纪律与欧洲盛典的庄重礼仪之中。在柏林与[GER.GetLeader]会晤时，威洛比向帝国保证，美国将全力支持他们对抗国际纵队和东方亚洲洪流的斗争。随着两大强国之间建立起更紧密的纽带，我们是继续各自称雄于自己的势力范围，还是共同沐浴在同一片阳光下携手主宰？"
 USA.937.a:0 "威洛比将军寻求正式加入帝国公约"
 USA.937.b:0 "我们只寻求两国间的互助"
 USA.938.t:0 "重振利比里亚计划？"
 USA.938.d:0 "就连林肯总统也承认，黑人是一个劣等种族，必须与美国优越的白人隔离开来。深知白人永远无法与这种劣等种族共存，他始终坚持将黑人迁往海地或利比里亚等地。林肯的去世使这些计划未能实现，美国则日复一日地陷入道德败坏。我们与前旧民主党领袖西奥多·G·比尔博密切合作，特许设立了美国迁徙委员会来监督这一宏大计划。政府承诺，在黑人离开的第一年为他们提供五十英亩土地和财政援助，让他们回到非洲与同胞自由生活。为了争取支持，政府与黑人民族主义者紧密协作，他们也反对任何形式的种族融合。我们联络了全体黑人进步协会和非裔社区联盟、伊斯兰国度和埃塞俄比亚和平运动等组织，这些团体都在追随者中号召大家大批离开美国，返回非洲故乡。利比里亚显然是实现这些目标的最佳地点，这也是林肯总统生前倡导的首选之地。主流的真爱国者党人士支持与蒙罗维亚开启谈判，以接收我们过剩的人口，而更为威权主义的派系则认为应直接管理该国，以严密监视这些劣等民族。"
 USA.938.a:0 "向蒙罗维亚提出提议"
 USA.938.b:0 "自行管理利比里亚"
 USA.939.t:0 "打击颠覆活动"
 USA.939.d:0 "为了扭转现代主义势头，洛克威尔通过反颠覆委员会向国家的道德堕落发起斗争。委员会一经成立，洛克威尔总统便下令即刻调查好莱坞的肮脏勾当，旨在挖出那些长期被纵容在银幕上散播污秽的犹太人与工团主义渗透者。我们的调查揭露出，数百名演员曾卷入激进劳工组织，并向内战中形形色色的叛乱派系提供支持。随着这些黑幕曝光，我们必须确保此类罪犯再也不能渗透进我们的媒体。在收音机与电视机日趋普及的战后家庭中，反颠覆委员会将不懈筛选并推广弘扬基督教价值观的内容。在出版领域，洛克威尔总统与国家新闻俱乐部的阿尔瓦迪、约翰·亚当斯紧密合作，推广免费杂志《美国女士》，宣传退伍军人妻子在战后新社会中的角色。洛克威尔总统本人也渴望投身这场文化复兴，他重拾画笔和旧木管，既绘制政治漫画向美国民众传递真相，又与重新组建的“摇摆幽灵”乐队一起编配曲目。只要全国上下与反颠覆委员会同调合拍，我们必将扭转颓败之势，开启一个洋溢美国精神的新纪元。"
 USA.939.a:0 "白人们终于团圆了！"
 USA.940.t:0 "海军将领之乱"
 USA.940.d:0 "近几个月来，金海军上将一直在巩固自己的地位，但这并不意味着其他海军将领就无所作为。多数将领要么不介意他的做法，要么干脆认同，也许是真心拥护他的事业，也许是觉得这是最务实的办法，既能保持舰队正常运转，又不必无谓地招惹他。不过，有两位坚持原则且颇具影响力的人物，“公牛”威廉·哈尔西和雷蒙德·斯普鲁恩斯最终决定出面阻止金攫取权力。金本人固然有足够的根基独自掌权，可以对这两位将领的担忧置之不理，但不可否认，他们指出金日益明显的独裁倾向，也确实点到了要害。于是，他面前摆着三条路：其一，无视那些不服约束的将领，继续把持大权，哪怕所有人都看得出，如此下去他迟早会成为国内说一不二的最高掌权者，至于后果是好是坏，谁也说不准；其二，主动退下，让哈尔西或斯普鲁恩斯中的一位在战争期间主持大局，以矫正当下的施政方向；其三，同意与这两人组成三人执政，这样金那无可置疑的宝贵指导得以保留，同时又受到更冷静头脑的约束。无论如何，必须尽快做出决断，否则海军高层很可能对金的长期掌权生出别的想法，并开始暗中筹划……"
 USA.940.a:0 "金应继续留任"
 USA.940.b:0 "“公牛”威廉·哈尔西将接管指挥权"
 USA.940.c:0 "雷蒙德·斯普鲁恩斯将接掌指挥权"
 USA.940.e:0 "与三巨头妥协"
 USA.941.t:0 "华盛顿海军条约"
 USA.941.d:0 "海军军备竞赛耗资巨大且危险重重，国家一旦卷入便难以自拔。最典型的例子当属英德海军军备竞赛，人们普遍认为它加剧了紧张局势，最终引发了世界大战。这种竞赛不仅让国民经济背上沉重包袱，还会恶化邻国关系，各国总担心被对手甩在后面，变得越来越多疑，致使各国都陷入一种走钢丝般的危险境地。就算眼下全球局势如此，仍值得尝试将世界主要海军大国拉到谈判桌前。可以想见，各方都会乐意叫停造舰竞赛的无度挥霍，这也能促使那些平时水火不容的国家暂时放下分歧，进行对话。此事成功的希望固然不大，如果我们不能争取到有利条款，还可能绑住自己追赶老牌强国的手脚，但无论如何，值得一试。"
 USA.941.a:0 "派出代表团吧，值得一试"
 USA.941.b:0 "这不值得我们浪费时间"
 USA.942.t:0 "太平洋舰队要求自治！"
 USA.942.d:0 "与太平洋沿岸重新统一后，太平洋舰队的海军将领们与他们在北大西洋的同僚重新聚到了一起。然而，太平洋舰队的将领们早已建立起自己的指挥层级和军事理念，并形成了强烈的共同归属感。因此，他们一致团结在尼米兹海军上将身后，推举他作为三头政治中的代表，以便在国务运行中拥有发言权。尼米兹则要求我们尊重太平洋海军司令部的自主权，不单是对他们已经采取的行动不予追究，更要求在夺回我们太平洋上的领土并加以治理时享有完全的自由。这些要求实在是荒谬，但人们不得不考虑，在经历苦战才实现统一之后，这么快就惹恼太平洋沿岸的同胞兄弟，究竟是不是一个明智的举动，或者说这本身是否有必要。同样，这种近乎独立的完全自由，加上可能任由他们在国家从前的领土上悬挂自己的旗帜，如果不趁他们生出别样心思之前加以约束，恐怕就是在自找麻烦。那么，我们究竟是允许他们彻底自治，还是至少强制他们在管理太平洋属地时使用国家的旗帜而非他们自己的，又或者干脆封杀这项提案，让他们循规蹈矩，来捍卫海军内部的统一？"
 USA.942.a:0 "屈服于他们的要求，允许他们使用带有星星的旗帜"
 USA.942.b:0 "屈服于他们的要求，允许他们使用自行绘制的旗帜"
 USA.942.c:0 "真是荒谬的提议！"
 USA.943.t:0 "彩虹行动"
 USA.943.d:0 "尽管出于实验性质的考量，具体细节对我们而言依旧是严格保密的状态，但部分科学家已向我们的部门递交了一个极具吸引力的构想：一种能够令舰船在雷达探测和肉眼观察下实现完全隐形的伪装装置。毫无疑问，这样一幅前景令人惊叹不已，然而让人不得不质疑的是，这类项目已经逐渐踏入幻想领域的边界，是否真的还具有实际价值。如果最终能够成功研发出来，那么配备该系统的舰船在战斗中恐怕会拥有几乎不可逾越的优势，但这种系统究竟是否具备现实可行性，仍有待进一步观察。无论如何，在海洋上的较量中，我们必须争取一切可能的优势，因此批准推进这一项目，显然并无任何坏处。"
 USA.943.a:0 "我们热切期待结果"
 USA.944.t:0 "彩虹行动：彻底失败！"
 USA.944.d:0 "事实证明，我们原先认为现代技术尚未赶上这个项目雄心壮志的假设，不幸是正确的。这艘船在海上启动了伪装系统，但既没有缩小其雷达反射截面，对站在码头观察海上实验的所有人来说，它的可见度也丝毫没有降低。也许几年后，等技术进一步发展时，我们会重新审视这个实验，但就目前而言，其结果对我们毫无用处，不幸的是，也无法在海上为我们带来决定性的优势。"
 USA.944.a:0 "妈的！"
 USA.945.t:0 "彩虹行动：部分成功！"
 USA.945.d:0 "尽管让这艘船在肉眼视线中完全隐形的构想或许有些不合实际，但此次试验确实取得了可观的成果。虽然站在码头上的旁观者依旧能够在远处清晰地看到它，但据我们的雷达操作员确认，该船的雷达截面积已显著缩小，已经达到了与渔船相当、甚至更低的水平。距离完全兑现最初承诺仍有一段漫长的路程要走，不过我们至少拥有了一个能够推动这项技术发展的起点，也拥有了可以开始实地测试的基础。"
 USA.945.a:0 "虽然仍有诸多不足之处，但这尚可接受"
 USA.946.t:0 "彩虹行动：大获全胜！"
 USA.946.d:0 "尽管这一事件完全违背常理，并颠覆了当前对物理学的所有认知，码头上所有目击者仍亲眼见证了一艘重达数千吨、体积堪比楼宇的驱逐舰在视野中凭空消失。更令人震撼的是，雷达数据进一步佐证了这一现象，屏幕上没有显示任何大型目标的信号特征，后续核查也确认该区域确实不存在其他大型实体。眼下，军事采购部门正全力与时间赛跑，争分夺秒地探索将该技术投入量产的路径，同时测试它在不同类型舰船上的实际效能，以判断这套伪装系统能否仅凭最小幅度的改动便适配大型舰艇；若无法实现，则必须尽快拟定潜在的改进方案。无论如何，这项技术已使我们领先最接近的竞争对手至少十年，只要能够将相关技术细节对敌方严格保密，我们在海域中的优势地位便几乎不可撼动。"
 USA.946.a:0 "简直难以置信！"
 USA.947.t:0 "华盛顿海军条约"
 USA.947.d:0 "刚完成统一的美国政府派来了一支外交代表团，意在和我们以及世界其他主要海军强国商讨签订海军条约的可能性。这类条约的核心目标，是限制各国海军的总吨位以及可拥有的舰艇种类与数量。虽然具体条款要等到正式坐上谈判桌才能细化，但就原则而言，限制全球最大几支海军的规模，不仅意味着我们能减少对其他竞争力量的顾虑，还可以大幅压缩本国的海军开支，这无疑会让国内那些主张严控预算的人士感到满意。与此同时，这项举措虽不会彻底阻断技术进步，但势必拖慢海军创新的节奏，这意味着除非有某个大国无视条约，或是出现其他难以预料的变数，否则当前的海军实力排位将在可预见的未来基本定型。那么，我们究竟是应该接受邀请，与这些竞争对手共同协商，努力谈出一个至少在基础层面对各方都有利的方案，从而让所有人都能削减海军支出、缓和彼此之间的紧张态势？还是说，这根本就是一个注定落空的愚蠢设想，我们倒不如不受任何协议的束缚，放手去追求绝对的海上优势，毕竟各方能否达成共识本来就是未知数？"
 USA.947.a:0 "很好，告诉他们我们会参加"
 USA.947.b:0 "真是荒谬的想法"
 USA.948.t:0 "[From.Getname]已接受我们的提议！"
 USA.948.d:0 "派驻[From.Getname]的代表团携捷报归来，对方政府已愿意坐到谈判桌前，就一项互利共赢的条约展开磋商。这与我们缓解全球紧张局势、共建更安全世界的目标高度契合，表明该国正积极投身于我们恢复世界和平的努力之中。"
 USA.948.a:0 "离我们时代的和平又近了一步！"
 USA.949.t:0 "[From.Getname]拒绝了我们的提议！"
 USA.949.d:0 "我们派往[From.Getname]的代表团空手而归，因为该国政府拒绝就一项互利的双边条约进行谈判。这让我们颇感意外，毕竟在当前全球环境下，为营造一个更安全的世界而缓和紧张局势，本该是理所当然的选择。然而，这恰恰证明，只要他们那全球霸权的妄想一日不灭，他们就会顽固坚持其穷兵黩武的理念，毫无意义地继续煽动对立。在这些狂妄之徒试图把全世界拖下水之前，我们是否该对他们采取行动？还是应当谨慎行事，寄望于他们能恢复理智，因为我们尚未准备好应对如此规模的冲突？"
 USA.949.a:0 "退让一步，我们现在还不能冒险开战！"
 USA.949.b:0 "前进，我们将以武力贯彻我们的意志！"
 USA.950.t:0 "填补空缺的副总统职位"
 USA.950.d:0 "洛克威尔史无前例地闯入椭圆形办公室，让总统选举的许多正式程序至今仍未完成。选举期间，真爱国者党各地方分会各自推出了不同的副总统人选。如今选举人团开会确认洛克威尔当选总统，同时也要选出他的执政搭档。尽管许多州都支持各自的本地人选，真爱国者党的四大派系却分别团结在四位党内重要人物周围。代表党内少数自由派的是克莱尔·布思·卢斯，她是一位有影响力的公众演说家，也是真爱国者党内部女性权益的倡导者。卢斯是杂志大亨亨利·卢斯的妻子，又与威洛比将军关系密切，她希望利用自己的人脉让政府听取女性的声音，并软化真爱国者党的强硬调门。主流派推出的是西尔斯公司总裁罗伯特·E·伍德，他长期资助保守派事业。党内有些人可能认为伍德是个老古董，但他的影响力或许能让党维持现状。更具威权色彩的“麦克阿瑟派”提名了美国退伍军人协会国家指挥官汉福德·麦克奈德。麦克奈德和军团对麦克阿瑟将军及军队的支持，使他深得党内军人背景成员的青睐。最后，所谓“极端爱国者”中的年轻激进派，推出了他们的青年领袖威利斯·卡托。卡托性情激进，自称“杰斐逊主义者”，决意坚守真爱国者党保护白种人的承诺。如今选举人正将选票集中到这四人身上，他们必须做出决断。"
 USA.950.d.mccormick:0 "洛克威尔史无前例地入主椭圆形办公室，使得总统选举的诸多程序问题悬而未决。选举期间，各地第三方进步党分部推举的副总统候选人均不相同。当选举人团集结认证洛克威尔总统时，选举人将决定谁将与新总统共同领导国家。尽管许多州推举了本州的政治宠儿，但第三方进步党的四大派系已分别围绕五位党内要人形成合力。代表该党温和自由派的是克莱尔·布思·卢斯，一位颇具影响力的演说家及党内女性权益倡导者。作为传媒大亨亨利·卢斯的妻子和威洛比将军的密友，卢斯希望借助人脉为政府注入女性声音，软化第三方进步党的强硬基调。主流派系推举了西尔斯百货总裁、长期资助保守事业的罗伯特·E·伍德。党内部分人士或视伍德为守旧派，但他的影响力足以维持现状。更倾向威权路线的“麦克阿瑟派”则分裂为美国军团全国指挥官汉福德·麦克尼德与保守派巨擘罗伯特·R·麦考密克上校两派。麦克尼德及其军团对麦克阿瑟将军与武装力量的支持，使其深受党内军事派系青睐；也有人认为麦考密克能以更具“人性化”的面孔维护军方利益。最后，所谓“极端爱国者”的年轻激进派推举了青年领袖威利斯·卡托。这位自称\"杰斐逊主义者\"的煽动家，期望恪守第三方进步党保护白种人的承诺。当选举人围绕这四位人物形成共识时，他们必须做出最终抉择。"
 USA.950.a:0 "保守派女权主义者克莱尔·布思·卢斯"
 USA.950.b:0 "极端保守派罗伯特·E·伍德"
 USA.950.c:0 "军团指挥官汉福德·麦克奈德"
 USA.950.e:0 "保守派上校罗伯特·R·麦考密克"
 USA.950.f:0 "激进的杰斐逊主义者威利斯·卡托"
 USA.951.t:0 "新联合参谋长会议"
 USA.951.d:0 "内战初期，我方之所以能够重整旗鼓，全靠麦克阿瑟、艾森豪威尔和布雷德利这三位将军的紧密结盟。这一联盟好比古罗马的三头同盟，当国家陷入混乱时，它夺取了美军控制权，在华盛顿和落基山区完成了重组。麦克阿瑟不幸去世后，我方又与西部联邦主义者分道扬镳，这才促成了新三巨头的崛起。查尔斯·A·威洛比、柯蒂斯·勒梅和理查德·K·萨瑟兰这三位将军聚集在一起，率领军队取得了内战的辉煌胜利。柯蒂斯·勒梅是参谋长联席会议副主席，在西部向来以将军的铁杆拥护者闻名，他常常与布雷德利、艾森豪威尔意见相左，但他那套凭借压倒性空中力量与燃烧弹轰炸的作战方法，虽显残酷，却精准有效。理查德·K·萨瑟兰则是三位将军中杀出的一匹黑马，身兼参谋长联席会议主席，曾任已故麦克阿瑟将军的参谋长。他本人不那么看重意识形态，出了名的固执，把确保美军组织完整、补给充足当作头等大事，以应对一切威胁。三个性格这么鲜明的人凑到一起，在这新的三头格局里，究竟谁的理念会占上风？"
 USA.951.a:0 "萨瑟兰遏制了军政府的过激行为"
 USA.951.b:0 "威洛比继续担任总司令"
 USA.951.c:0 "李梅增强了武装部队的权威"
 USA.951.e:0 "将军们之间维持着微妙的三人执政格局"
 USA.952.t:0 "新解放者的方向"
 USA.952.d:0 "威洛比将军最终下定决心，继续执掌政府，并决意以他漫长军旅生涯中所汲取的种种影响力为指引，来治理这个国家。在拉丁美洲担任武官期间，他对那些富有魅力的考迪罗式领袖所倡导的民粹主义理念产生了深深共鸣，正是这些领袖曾引领各自的国家走向稳定与繁荣。威洛比还曾撰文支持圣胡尔霍将军短暂的执政时期，称赞他使西班牙免于被激进叛乱分子撕裂，并为其带来安定的局面。而在这些拉丁美洲强人之中，最为瞩目的当属传奇解放者西蒙·玻利瓦尔，他也是威洛比极为重要的精神导师。凭借自身的德意志血统，威洛比将军也从帝国传统中吸取灵感，通过深入研究军事历史，试图振奋全民的民族精神。在众多右翼盟友的引导下，他更考虑强化民族主义与种族主义方面的论调，以争取爱国同僚们的支持。而最为简单的选择，莫过于维持现状，继续维系武装力量与始终忠诚的胡佛局长之间的国家机器。"
 USA.952.a:0 "威洛比将军借鉴了拉丁美洲考迪罗的风格"
 USA.952.b:0 "冯·魏登巴赫将弘扬普鲁士的精神！"
 USA.952.c:0 "保留现有政府架构"
 USA.952.e:0 "威洛比从解放者本人身上汲取影响力"
 USA.952.f:0 "将军最终决定将其种族主义信念付诸实践"
 USA.953.t:0 "落基山脉的政权更迭"
 USA.953.d:0 "经过与西部联络人数周精心策划，落基山脉的特工传来捷报，效忠派部队已成功夺取西部联邦主义者首都丹佛的控制权。在首都零星交火后，布拉德利将军及其叛国追随者已向西逃窜至僭称的太平洋国境内。随着麦克阿瑟主义信徒柯蒂斯·李梅执掌西部防御司令部，我方西部将士的忠诚现已毋庸置疑。"
 USA.953.a:0 "向着胜利前进！"
 USA.954.t:0 "丹佛灾难"
 USA.954.d:0 "尽管经过数周的周密策划，我们在丹佛的探员传来消息，针对叛变西部将领的行动已彻底失败。数百名忠诚派军官及其民间盟友因未遂政变被捕，蒙羞的李梅将军已被我方特工秘密转移至联邦派控制区。此次挫败不仅强化了敌方的决心，更使联邦派势力间的任何统一尝试化为泡影。"
 USA.954.a:0 "叛徒，全都是叛徒！"
 USA.955.t:0 "落基山脉回归！"
 USA.955.d:0 "随着最后一批叛军向我国合法政府投降，我们必须着手推动军队向和平时期转型。我们在落基山脉的坚定盟友柯蒂斯·李梅，始终将不惜一切代价捍卫联邦视为自身的最高职责。在成功击溃布拉德利将军的部队之后，李梅已正式确认支持我们在华盛顿的合法政府。随着这些叛乱分子终被铲除，重新整合西部联邦势力并解散西部防御司令部的时机已经成熟。为表彰其卓越贡献，李梅将军返抵华盛顿时，将会受到英雄般的隆重欢迎。"
 USA.955.a:0 "全体稍息！"
 USA.956.t:0 "特区阴谋"
 USA.956.d:0 "从内战的领导压力中解脱出来后，查尔斯·A·威洛比将军出版了他的第一部小说《华盛顿阴谋》。这部作品半自传半历史惊悚，威洛比毫无保留地讲述了1936年总统选举后首都那混乱的数月。书中包含了从未向公众披露的信息，威洛比以亲身经历展现了道格拉斯·麦克阿瑟短暂执政期间，内战爆发前几个月的情形。在这部小说中，威洛比揭露了一个潜伏在政府内部的第三国际间谍网络，他们暗中支持那些叛国的海军将领推翻并审判了麦克阿瑟将军。虽然小说以高昂的笔调收尾，歌颂了与胡佛局长的合作，正是他协助推翻了莱希海军上将并最终恢复了联邦，但书中也发出了严厉的警告。全美人民绝不能对第三国际的颠覆活动放松警惕，他们那些险些摧毁我们国家的肮脏伎俩，正在世界各地被故技重施。"
 USA.956.a:0 "必读之作"
 USA.957.t:0 "族群法则"
 USA.957.d:0 "生物完整性，是第一条也是至为关键的一条法则。我们天生就爱同类，恨异族。一个健康有序的社会，有赖于共同种族认同的维系。\n\n第二条法则是领地。与卑鄙的马克思主义者和工团主义者不同，我们极度珍视私有财产。毕竟，一个帮派或族群的重要目标之一，不就是划出自己的“地盘”，供成员居住生活吗？在美国，这理想就表现为私有财产，我们必须全力守护。\n\n第三条法则是领导。在自然界，头领从来不是投票选出的，而是经由自然淘汰，由群体中最强壮、最优秀的个体担任领袖，其他成员则依次列于其下。我们绝不能容忍民主制下那套恶劣的暴民统治，而应由我们中间最坚毅的强者来领导，凭着这份认知，我们才能广受人民爱戴。\n\n第四条是地位法则。正如社会必有领袖，其他成员也各安其位。这一法则依各人能力形成自然次序。人人都将安于领袖之下的恰当位置，并因忠诚而获敬重。农夫、劳工、士兵、厂工，职分不论高低，只要他们忠诚为国，辛劳必得回报。\n\n第五条是母职法则。在自然界，雌性从不介入雄性的活动，可如今却并非如此。健康的社会，需要女性群体全力繁衍后代、养育子女与经营家庭。眼下，千百万家庭缺少养育孩子所需的慈爱母亲。而这类母亲，一个世纪前还随处可见，我们必须恢复这种局面。我们将尊崇女性自古以来的角色：母亲、妻子，更是良善人民的塑造者。"
 USA.957.a:0 "五大法则将为我们的社会带来秩序！"
 USA.958.t:0 "利比里亚实验的命运"
 USA.958.d:0 "经过一场横跨大陆的行动，我们终于将利比里亚确定为安置我国黑人群体的理想地点。在与我们的民族主义盟友协调下，成千上万的非裔美国人已从美国移居至蒙罗维亚海岸，与自己的同胞共同开启新生活。如今，在非洲海岸拥有了我们自己的“殖民地”，我们必须决定由谁来担任蒙罗维亚的庇护者。最简单的方案是维持现状，让已掌权超过一个世纪的真辉格党继续掌控该国。作为与这些民族主义团体紧密关系的一部分，我们也可以将权力让渡给我们在全体黑人进步协会或伊斯兰民族组织的民族主义盟友，以确保向利比里亚的移民潮持续不断。而三K党内部最狂热的帝国主义者则认为，我们不该对这些黑人做出丝毫让步，应当由我们直接管理这些非洲领土。考虑到这些因素，我们该如何治理这个奇特的殖民地？"
 USA.958.a:0 "让利比里亚回归忠诚的真辉格党"
 USA.958.b:0 "将利比里亚托付给我们的全体黑人进步协会盟友"
 USA.958.c:0 "将利比里亚移交给我们的伊斯兰民族组织朋友"
 USA.958.e:0 "我们自己继续管理利比里亚"
 USA.959.t:0 "我们利比里亚领土的范围？"
 USA.959.d:0 "在蒙罗维亚建立适当的行政机构后，利比里亚现已成为我们在非洲的前哨，容纳着成千上万已迁往我们殖民地的黑人。利比里亚面积大致相当于弗吉尼亚州，目前足以安置这些移民。为应对我们殖民试验日益增长的规模，参议员比尔博建议大幅扩展领土至整个黄金海岸，以容纳仍居住在美国的数百万黑人。我们联盟内的极端民族主义者提出了一项激进提案，认为利比里亚仅仅是我们扩大在黑暗大陆势力范围的初步尝试。这些帝国主义者认为，美国不仅应沿黄金海岸扩张，更应吞并整个西非。我们的政府应如何处理大利比里亚的前景？"
 USA.959.a:0 "保证我们在黄金海岸沿线的领土安全"
 USA.959.b:0 "整个西非都将成为我们的领地！"
 USA.959.c:0 "现在控制利比里亚已经够麻烦的了"
 USA.960.t:0 "大胆的小飞象救援行动"
 USA.960.d:0 "空中与海上技术日新月异，二者交融早已成为常态。最明显的例子就是航空母舰，现已成为多数舰队的核心。在这些巨舰与众多舰载机背后，是那些久经特训的飞行员。他们需在恶劣天气下飞行，在短距甲板上起降，所接受的专门训练长达数月，严苛程度远超普通飞行员。这也使得他们变得极其珍贵，一个飞行员的价值往往抵得上整座机库里所有的飞机。\n\n然而，他们每天要面对陆基或舰载高射炮火与敌方战机的威胁，稍有不慎就会坠入深海。技术如此娴熟的飞行员仍属稀缺资源，于是，赶在他们溺亡或遭射杀前迅速救援的新手段便应运而生。工程师将原本用于布设水雷或投掷深水炸弹的水上飞机拿来改用：一部分装上救生筏投送装置，可快速投放给落水飞行员；另一部分则换上强劲发动机，能够在短短几分钟内完成水面急降、救起坠海飞行员并再次起飞。\n\n这种飞机体型庞大，又常常在战火中执行近乎玩命的救援任务，飞行员因而戏称其为“小飞象”。事实证明，它在海空作战中同样不可或缺，已拯救无数飞行员的生命，使其免于被俘或阵亡。尽管它体积大且大多没有自卫火力，但加装了长波电台，能搜索并通报飞行员的坠海位置，以便协调救援，这令敌人大为惊惧。这足以证明，任何飞机，无论造价多高昂、材料多尖端，都没有人命来得珍贵。"
 USA.960.a:0 "飞机比训练有素的飞行员更便宜"
 USA.961.t:0 "挽救建国元勋的遗产"
 USA.961.d:0 "在真正的爱国者们站稳脚跟后，我们大刀阔斧的改革为国家重新带来了繁荣与道德，我们终于建立起了一个能够维护天才开国元勋们真正意图的政府。在这个美国例外主义的新时代全面展开之际，洛克威尔总统认为，国家应当拥抱一个全新的身份象征，以庆祝我们的重生。为了纪念我们那些民族主义先贤，以及他们建立一个平衡自由与权威的民族主义共和国的梦想，总司令提议用一面新旗帜来为国家的复兴洗礼。洛克威尔的设计保留了最初的贝特西·罗斯旗样式，并饰以束棒，象征我们新生的力量与团结。虽然真爱国者党的民族主义派系对这一提议拍手称赞，但党内较为温和的成员认为，我们应当继续沿用现有的星条旗。"
 USA.961.a:0 "与洛克威尔的旗帜一同庆祝我们的复兴"
 USA.961.b:0 "安抚温和派，守护星条旗"
 USA.962.t:0 "梅里尔劫掠者"
 USA.962.d:0 "全球战火纷飞，抢滩登陆、完成任务的重任自然就落到美了国海军陆战队头上……至少正常年月是这样的。只可惜海军在“合法”的幌子下妄图推翻政府，声名扫地，于是陆军想趁机收紧套在海军脖子上的绳索，办法之一就是不再让陆战队独享海外派遣的专权。\n\n内战打响以来，联邦政府面临的一大麻烦，便是红色突击队的袭扰。那群红色流寇经埃文斯·福代斯·卡尔森之手调教，游走在战线后方，从电线杆、桥梁、水坝到机场，见什么就打什么。此种局面，激得一位名叫查尔斯·牛顿·亨特的人挺身应对。纽特·亨特上校在中美洲和菲律宾的冲突中身经百战，他拉起了一支久经沙场、斗志昂扬的队伍，铁了心要钻进敌后大干一场。这帮人全部由志愿者组成，而且只挑那些甘愿为美国抛头颅洒热血的最坚决分子。部队的训练项目包括长途跋涉，凭着汗水、体魄和硬骨头压倒一切对手，成员还要精通爆破、白刃格斗、轻武器操作以及因陋就简的本事，随便拉出一个突击队员，都是个让人不敢小瞧的角色。统率这支新部队“加拉哈德部队”的，是已故麦克阿瑟身边那位戴眼镜的伙伴弗兰克·梅里尔将军，亨特上校担任副手。\n\n尽管威洛比那帮人或许白日做梦，想有朝一日用这批对哥伦比亚更忠心耿耿的仆从把旧陆战队连根拔掉，可这支部队早已穿梭火线，以“梅里尔劫掠者”之名威震四方。"
 USA.962.a:0 "一支精锐之师，由杰出之士统领"
 USA.963.t:0 "医生参上"
 USA.963.d:0 "为配合真爱国者党，并实施他向美国民众传播“真相”的大规模媒体计划，洛克威尔总统乘着一辆涂满真爱国者党标语的巴士巡游全国，四处发表他那套火药味十足的演说。他马不停蹄地赶场，重新找回了如鱼得水的感觉，凭借天生的表演欲，把大学礼堂和市政厅统统变成了自己的秀场。在缅因州南部一家洗衣店前，他做了一次即兴演讲，令一群当地的捕虾渔民为之倾倒。这些渔民听着他说话，个个点头应和，唯有一人躲在后面，每等他讲完一句就喝倒彩、起哄。洛克威尔想借此杀鸡儆猴，便喝令这名捣乱者上前，要以男人的方式面对面较量。结果，这位唯一的反对者既不是工团主义恐怖分子，也不是全国有色人种协进会的人，而是洛克威尔的亲生父亲，乔治·洛夫乔伊·洛克威尔。霎时间，洛克威尔脸色一沉，待这位有“好医生”之称的父亲走上台来要当众给他点教训时，他更是臊得满面通红。老洛克威尔比儿子整整矮了一头，涨红着脸站在那里，非常难堪，而他的父亲却仍在众人面前不住地责备他、奚落他。最终还是随行人员上前解了围，狼狈不堪的洛克威尔这才逃下讲台，被搀扶着离开，一路哭着走向他的竞选巴士。"
 USA.963.a:0 "每日一苹果，洛克威尔远离我"
 USA.964.t:0 "空中海盗"
 USA.964.d:0 "自从德国赢得世界大战以来，美国海军便对德国舰队的崛起日益担忧。在威廉二世对海军事务的执着推动下，这个新兴超级大国的海军不断试图超越其对手；同时，由于德意志帝国辽阔的新帝国版图，德国这个全球霸主的海员身影遍布世界每个角落。正因如此，美国亟需应对德国对战列舰的痴迷；面对世界上日益增多的重型、笨重且威力巨大的战舰，鱼雷轰炸机成为了提出的解决方案之一。舰载鱼雷向来难以瞄准和预测弹道，但从专门设计的轰炸机上投放后，由于空投鱼雷精度更高、射程更近，这些武器从一开始就成了战列舰的克星。尽管像TBF“复仇者”这样的前代鱼雷机在美军中服役表现出色，但如今海军科学家和工程师们打造出的新机型，在速度、载弹量和体积上都让可靠的“复仇者”相形见绌。\n\nXTB2D“天空海盗”，又称“毁灭者II型”，是一架名副其实的空中巨兽，翼展达70英尺，空重超过18吨。设计这头猛兽时，考虑到了新的约克城级航母的尺寸，因为只有这些巨型军舰才能容纳“天空海盗”的庞大身躯。不过，尽管这架飞机确实庞大，也有人担心它会因此成为易被攻击的目标，但它绝非等闲之辈，而且其载弹量在单引擎鱼雷轰炸机中堪称前所未闻。“天空海盗”由普惠R-4360“大黄蜂”系列星型发动机提供动力，配备对转螺旋桨，输出功率达3000马力，时速可超过340英里，航程超过1200英里，使其具备了极强的自主行动能力，大幅减少了对母舰的依赖。它的武器挂载能力不仅让本国之前的型号望尘莫及，也远超日本、德国等对手海军航空兵的任何同类机型。它能携带四枚Mark 13型鱼雷，或8000磅其他弹药。然而，虽然这在理论上使其一架能抵四架“复仇者”，但一些军方官员对该机的专属性提出了担忧，因为它只能在海军最大的航母上起飞降落。这可能迫使军方需要开发一种更紧凑的型号，以便在较旧但仍完全堪用的航母上使用，这本身又是一笔巨大的开支。尽管如此，鉴于飞行测试和偶尔进行的武器试验进展顺利，“天空海盗”很可能不久之后便会在七大洋上空巡航，搜寻下一处猎物。"
 USA.964.a:0 "敌人看到这架战机，定会胆战心惊"
 USA.965.t:0 "海军梭哈王"
 USA.965.d:0 "自从我们用铁腕手段重新统一美国以来，花了很大力气去重新整合旧联邦中比较忠诚的部分，比如太平洋沿岸、落基山脉地区和新英格兰那些拥护民主的亲美政府。与此同时，对那些更棘手的区域，比如三K党横行的深南部，或是工团主义肆虐的铁锈地带和东海岸各大都市，我们始终保持高度警惕，必要时不惜动用武力来加以管控。正因如此，这些相对温和地区有不少军人，在经过了规定的去激进化改造和爱国再教育之后，获准重新回到现役岗位。尽管当时很多人都意识到，这么做可能会让一些不良分子混进我们的队伍，可最终发生的事情，却是谁也未曾料到的。\n\n海军调查处是新近成立的机构，第二次美国内战后在原来海军情报局的基础上组建而成，专门负责对我们不断扩张的海军进行内部监察。该机构发现，一个规模庞大的赌博集团已经在军中滋生并蔓延开来，而支撑它运转的，正是我们海军士兵的血汗钱。更让人不安的是，这个赌博集团的主要组织和运营者，是一小撮年轻军官和统一战争中的老兵，为首的正是一个之前被反复提及的、来自太平洋沿岸地区的复员军人，理查德·尼克松中尉。尼克松曾在太平洋州海军服役，经过漫长的再教育后被重新接纳进我们的行列，随后迅速崛起，成了整个海军乃至全美都数一数二的牌手。他尤精于五张牌梭哈扑克，在众多对手中赢得了“狡猾的迪克”这个绰号。尼克松靠打牌赚足了钱，想怎么花就怎么花，但他又把资金重新投入到海军和赌博集团里，帮助这张赌网扩展到新统一联邦各地的造船厂和海军基地，同时也让普通军人有机会搏一把大的，向那些在这段不安稳的和平时期被政府遗忘的人们伸出了援手。然而，和任何其他犯罪活动一样，这个赌博集团也逐渐惹出了麻烦，这也正是案子最终摆到我们桌面上的原因，因为欠债不还和输急了眼，争执、口角和斗殴时有发生，公然蔑视由海军上将[USA.GetLeader]一手建立的法律与秩序，眼看事态还要随着海军警察介入而进一步恶化。\n\n纠察长和海军监察长都主张立即取缔这个赌博集团，认为它是我们光荣传统上一块见不得人的污点。但这种态度在海军高层和更广泛的政府圈之外，并没有得到多少响应。普通士兵和水手，也就是我们海军的主体，已经开始喜欢上尼克松那张越铺越广的牌桌和其他赌钱消遣，把它们当作一天苦仗打完后最好的解乏方式。成千上万的人联合起来向高层请愿，要求允许军中赌博，以此作为打赢内战、保住了和平与稳定的犒赏，还恳请赦免“狡猾的迪克”以及和他一同经营扑克集团的军官们。耐人寻味的是，一批与军工复合体利益交织的富商高管，比如现代美国航空之父查尔斯·林德伯格，也悄悄向政府游说，希望保住这个赌博集团。原来他们中有些人一直在幕后从这一投机中获利，自然不想断了财路，于是给海军最高指挥部许以支持和优厚交易，想要多添几分甜头。此事我们到底该采取什么样的官方立场？"
 USA.965.a:0 "道德沦丧！将负责的军官送上军事法庭，以儆效尤"
 USA.965.b:0 "有利可图。接管这个赌博团伙的运作"
 USA.965.c:0 "无伤大雅，让弟兄们乐呵乐呵吧"
 USA.966.t:0 "空军柔道教练"
 USA.966.d:0 "在一次对国内某军用机场的例行视察中，柯蒂斯·李梅将军看到一群身材走样、懒懒散散地待在岗位上的空军士兵，大为震惊。他们邋遢的外表和毫无军人荣誉感的行为让李梅怒火中烧，他担心这种风气正在全国各地的营房和基地里蔓延，便着手建立一套新制度来解决这一问题，以免它从内部瓦解我们的军队。\n\n李梅本人是一位柔道大师。柔道是嘉纳治五郎于1882年创立的日本格斗术，它博采众长，摒弃了武器和预设的套路对练，转而推崇自由搏击和擒拿技巧。李梅出于自己对这门武术的热爱，开始在全军推行柔道，要求全国每一名军人，无论所属军种，都必须将柔道纳入日常训练课目。起初，许多人对此持怀疑态度，尤其看到“李梅师父”在全国各地基地大张旗鼓地展示自己的柔道功夫，更觉得这不过是在作秀；据说他的功夫是已故的山下义韶亲授的，山下先生是讲道馆四天王之一，更是美国柔道之父。不过，随着各地纷纷组织起柔道比赛和锦标赛，大家逐渐改变了看法，体能水平和士气也随之提高。更令人意外的是，后方民众也迷上了柔道，如今它已成为全国各地学生常见的课外活动，也深受女性欢迎，因为这是一套安全又系统的防身术学习方式。柔道正以席卷之势风靡全美，我们或许都该从李梅师父身上学点什么。"
 USA.966.a:0 "他们说快快快，再来个柔道翻摔"
 USA.967.t:0 "天生独裁者"
 USA.967.d:0 "以冷酷、毒舌和惊人的记忆力著称的萨瑟兰将军，向来不说废话，在政府里也许是最不看重意识形态的人。理论和政治完全左右不了他，那些徒耗精力的俗务他通通不理，只顺着自己的天性去生活、去统率，如今更是去统治。已故的麦克阿瑟将军以前总爱这么形容他，说他是个天生的独裁者。政务上，只要是他的铁腕和手下军队官僚系统处理不了的，就交给几位信得过的政治幕僚。这些幕僚大体上可以自行其是，前提是维持法纪，让老百姓安分守己，同时源源不断地提供人力、物资和民意支持，去喂养萨瑟兰麾下正在建造的那个庞大而永远饥渴的军工复合体。由于这副做派，部下给他起了个“刽子手”的绰号。这位昔日麦克阿瑟的首席执法者，如今高坐在铅与铜铸成的宝座上，统治着一个日益壮大的美式功绩社会。他把令自己厌烦的事务全都丢给下属，自己则坐镇监督，亲眼看着人类有史以来最强大的武装力量，从第二次、也确信是最后一次同胞相残之战的废墟中崛起。萨瑟兰治下的美国，钢铁正将其牢牢箍紧，灼热的火药正将其封死，从此再也不会分裂。"
 USA.967.a:0 "向统帅致敬！向刽子手致敬！"
 USA.968.t:0 "麦克阿瑟的“真正”继承者"
 USA.968.d:0 "尽管事实未必如此，但萨瑟兰仍需要巩固自己作为麦克阿瑟真正接班人的形象。为此，他发起了一场大规模宣传运动，试图将麦克阿瑟的遗产歪曲成适合自己需要的样子，同时把自己绑定在这位已故英雄受人爱戴的形象上。他大肆渲染两人密切的共事关系，又着力凸显一个事实：麦克阿瑟在和平时期短暂执政，却不幸猝然离世，而在那之前，正是麦克阿瑟选他做了参谋长。如今，萨瑟兰靠夸大和歪曲事实，来牢牢抓紧日益收紧的权力，直到它变成无人敢于置喙、无人能够匹敌的绝对权威。他甚至开始把自己塑造成这样一个角色：早在第二次美国内战爆发之前，就是他在麦克阿瑟耳边低语进言，敦促其夺取权力，以政变的方式拯救美国于当时日益高涨、正将旧联邦撕得四分五裂的激进主义；他进而将这场政变包装成最终拯救国家的妙棋良策。萨瑟兰一面摆出冷漠独裁者的姿态实行统治，一面寄生在民族英雄的光环之上；凭借对他唯命是从的宣传机器与武装部队，他将全部权力集中到自己手中，高高在上。只差一顶皇冠，却叼着人们眼熟的玉米芯烟斗，萨瑟兰将继续着力固化自己作为美国凯撒真正继承人的形象，但无论国内还是世界怎么看他，他的统治都会继续下去。"
 USA.968.a:0 "向新的美利坚凯撒致敬？"
 USA.969.t:0 "卡托的杰斐逊之梦"
 USA.969.d:0 "副总统威利斯·卡托，或许是洛克威尔总统最为奇特的政治盟友。他原本因体质极度虚弱而几乎无缘军旅，然而战争时期国家分裂引发的人力严重紧缺，使海军在战争中期破格接纳了这位勉强符合服役标准的人选。也正是在军中服役期间，他与洛克威尔相遇，由此开启了一段相互怂恿、日益深入极右意识形态的友谊与合作之路。洛克威尔竭力效仿麦克阿瑟的英雄风范，甚至借用玉米芯烟斗来刻意塑造个人形象；而卡托则选择从开国先贤中汲取灵感，尤其尊崇托马斯·杰斐逊，并深受其政治导师威利斯·E·斯通与奥尔德里奇·布莱克的理论熏陶。\n\n这位自诩为杰斐逊式人民主义者的卡托，似乎憧憬着一个经过杰斐逊设想所净化而重生的美国，一个建立在选区基础上的农民共和国，呈现出某种含混的右翼自由意志主义与农业社会图景：由白人土地持有者与生产者构成，以地方市政民主为依托划分为自治选区，进而联结成彼此独立又互相依存的基本自给社区网络。在这样一种秩序中，除了标准应急服务与些许基础政府职能之外，几乎不受任何联邦与军事的监管束缚。然而，他究竟真心信奉这些理念，还是仅仅将其当作反犹人民主义和白人至上主义的精美外衣，仍有待观察。毕竟，他选择性地忽视了杰斐逊那些著名的平等主义与宗教自由主张。在成长过程中，卡托深受罗伯特·麦考密克在《芝加哥论坛报》上鼓吹孤立主义与反福利经济学文章的影响，幼年时期又时常聆听查尔斯·库格林神父那些言辞激烈的广播布道，这些都坚定了他继续前辈征程的决心，力求确保国际干预主义、公平施政之类的失败幻想，以及犹太工团主义等邪恶运动，从此再无法侵蚀美国人民的思想。正是这种经过扭曲的杰斐逊式自由意志主义的赝品，以种族主义人民主义和带有温和基督教色彩的半威权主义为支撑，构成了副总统威利斯·卡托那套杂糅而奇特的思想体系。这些观念或许尚未对国家运转产生实质性重大影响。然而，在与洛克威尔争夺主导权与国家关注度的过程中，卡托必将不遗余力地把自己某些怪诞的梦想强行施加于美国之上。"
 USA.969.a:0 "万物演化的天然轨迹，乃是自由领域收缩，而政府权力延展"
 USA.970.t:0 "副总统伍德的多副面孔与他的朋友们"
 USA.970.d:0 "身兼数职、视野多元且交游广泛的罗伯特·E·伍德副总统，堪称文艺复兴式全才在现代美国企业界的化身。如今，他正面临一个刻不容缓的抉择，究竟该倚重自己的哪一面。他手握整个真爱国者党赋予的信任，拥有绝大多数副总统梦寐以求的权力：既要约束洛克威尔总统，又要将其锋芒打磨得更加贴合党内主流。此刻，他必须决定如何运用这份沉甸甸的权柄。这位曾在摩洛叛乱中服役、参与巴拿马运河建设，并效力于乔治·W·戈瑟尔斯少将参谋部的功勋老兵，始终以军需官与后勤专家的身份脱颖而出，这一专长在他转入商界后，同样带来了极大的助益。从杜邦公司、通用沥青公司等企业的阶梯一路攀升，他最终在1920年代拿下西尔斯-罗巴克公司副总裁的优渥职位。此后，他如同明星般与西尔斯共同崛起，先后升任总裁乃至董事长，在商业伙伴兼一生挚友莱辛·J·罗森沃德（正是那位栽培伍德、比他更早执掌西尔斯并将其打造成家喻户晓品牌的传奇人物朱利叶斯·罗森沃德之子）的鼎力协助下，把西尔斯推向了全美领先品牌的高峰。从罗森沃德家族以及另一位密友，通用电气总裁杰拉德·斯沃普身上，伍德不仅学会了如何成为出色的企业领袖，更领会了慈善家、劳工管理者与人道主义者的真谛。他慷慨地将财富回馈社会，不仅泽被西尔斯及其创办的全州保险公司员工，还惠及周边社区。经由企业活动，他还结识了格特鲁德·L·沃伦，并接触到了专注农业与家庭事务的4-H组织，这个团体兼具农业倡导与青年支持功能，既援助地方社区、扶持农民，也为全美儿童，尤其是资源最匮乏的农村地区，提供教育和发展机会。伍德与沃伦同心协力，将大量慈善资金注入4-H，助其扩展至全国。另一位通过相似途径结识的同道，是圣母大学法学院院长、印第安纳州活跃的民主党成员克拉伦斯·马尼恩。在他主持的一档由伍德资助的温和而广泛亲保守派的广播谈话节目中，两人借助新联盟的电波，传播着共同的理念。\n\n然而，经由商业人脉结识的，并非皆是善类。在尚未跻身西尔斯、于企业圈中沉浮的岁月里，伍德曾接触过伊雷内·杜邦、小J.P.摩根等人物。他们在耳边低声怂恿，企图借助伍德的政府关系作为通道，实现对国家机器的商业掌控。还有国家经济委员会公司，由默温·K·哈特在第二次内战前夕创办，最初以公共利益团体面目出现，施压政府增强经济责任感，随后却蜕变为受西班牙何塞·桑胡尔霍等人启迪的极右翼反犹思想载体。尽管这些更加恶毒而反动的观点，遭到了伍德及国家经济委员会另一主要出资人罗斯·怀尔德·莱恩（阿尔伯特·杰伊·诺克的同道、美国右翼自由意志主义的精神源头，同样可以成为我们的盟友）的抵制，但国家经济委员会架设桥梁的能力仍充满诱惑，它或许能在伍德阵营（温和的军政府派、财阀统治派与传统保守派）与洛克威尔那些更极端的支持者及盟友之间，弥合深深的鸿沟。\n\n背负着这些盘根错节的阵营与理念，副总统伍德陷入了两难的境地。他必须在国家利益的驱动下，审慎地决定亲疏取舍，一面在幕后承担更多职责以约束年轻气盛的洛克威尔总统，一面判断未来应当优先关注和支持哪些群体。"
