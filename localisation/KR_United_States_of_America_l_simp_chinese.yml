 USA_authoritarian_democrat_democracy_party_long:0 "民主党 - 南方保守派(Democratic Party (Southern Conservatives))\n§g民主党 - 南方保守派是在旧民主党被打击并分崩离析后，重新回到民主党的成员们的统称。有别于旧民主党中鱼龙混杂的极端种族主义者，农业主义者与杰克逊主义者们，南方保守派大多为旧民主党中相对温和，政见却有别于正统民主党人的政客。支持种族隔离或是隔离但平等制度，主张投资南方与坚定的州权至上立场成为这些重新回到民主党派系中的旧民主党人的共同特点。尽管如今这些保守主义者仍然并未占据民主党的主要政治力量，但如果美国社会进一步趋向保守，这些南方主义者可能会顺势而起，成为不可忽视的政治派系。§!"
