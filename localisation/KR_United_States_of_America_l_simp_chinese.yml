#事件
ustates.1.t:0 "1936年的美利坚合众国"
 ustates.1.d:0 "1936年的美利坚合众国，国势衰微，风雨飘摇。得益于帮助美国免于世界大战的惨痛牺牲，伍德罗·威尔逊成为了第一位参选并成功赢得第三任任期的美国总统，人称“美利坚的和平守护者”。他与他的新竞选伙伴、前司法部长亚历山大·米切尔·帕尔默通力合作。借着这股史无前例的胜利势头，威尔逊政府趁热打铁，花了大力气游说各方批准1810年就承给各州的《贵族头衔修正案》。修正案规定，美国公民如获得外国的头衔，则其公民权自动作废。威尔逊政府重提此一修正案的原由是担心大战得胜的德意志帝国会通过赐予贵族头衔的手段收买美国国内的君主主义者，从而操纵美国的政治。漫长的游说过后，第十八修正案正式通过。然而，这场政治胜利是短暂的，因为威尔逊在当选后不久便中风，直到1923年底威尔逊去世前，美国爆发了宪法危机，总统内阁陷入了持续的争权夺势中。继承了威尔逊之位的帕尔默和其内阁受到法英两国的革命和美国工团主义的急速发展的刺激，对工会组织和一系列被怀疑与激进左翼有联系的组织采取了越来越极端的镇压措施。在工人被迫变得越来越激进后，无政府主义炸弹袭击者对帕尔默进行了多次刺杀，由于大罢工、政治不稳和失去贸易伙伴，美国的政治与经济局势陷入了持续的恶化。\n\n1928年，赫伯特·胡佛当选后，帕尔默备受争议的总统任期结束了，胡佛试图以“回归如常”的方式平息紧张局势，重新使非暴力的工会组织合法化。由于持续的投机投资使美国陷入1929年的大崩盘，并使柏林股市甩下美国站上了世界经济的最前沿，这项举措最终没有起到什么作用。\n\n胡佛当选后的初期虽然民众一度充满希望，但他最终未能扭转美国经济的衰退，1929大崩盘成为了有史以来最严重的金融危机之一。这推动了美国政治的激进化，催生了如极左的美利坚社会党、休伊·朗及其美利坚至上党领导下的民粹主义分享财富纲领，以及极右翼的旧民主党，它将把社会主义者和民粹主义者引发的骚动通通归咎于移民问题应对不力，还有共和党的大同思想与其对左翼的软弱无能。1932年胡佛引发了争议的连任，以及持续的大萧条，意味着这些问题不可能很快得到解决。许多人担心极端政党很可能在下届大选中上台，大萧条的持续更是将引发灾难性的动荡。"
 ustates.1.a:0 "天佑美利坚"
USA.1.t:0 "总统的新年讲话"
 USA.1.d:0 "我的同胞们：\n\n在这新的一年，我从白宫向全国致辞。过去的四年中，我们的国家经历了前所未有的考验。从股市的崩溃，到失业潮的蔓延，再到许许多多家庭承受的痛苦与不安……我深知，没有任何语言能完全抚平各位心中的忧虑。然而，我依然要坚定地说：美利坚不会屈服于绝望。政府在过去一年里采取了多项措施来恢复信心，稳定经济，并努力确保每一位公民都有重返工作的机会。救济工作已经初现成效，经济形势也开始恢复，各项政府的工作正在逐渐走向正轨，美利坚也将从经济低落的阴云中走出...\n\n...然而，真正的复苏必须依靠全体国民的勇气与决心。没有任何行政命令、没有任何法案，能够像勤勉与诚信那样推动国家走向康复。我们也必须警惕那些趁乱而起、鼓吹极端主张的人。他们会告诉你，国家已走到尽头；他们会告诉你，宪政制度无力救我们；他们甚至会告诉你，需要以愤怒与暴力来取代理性。我的同胞们，我敦促你们保持清醒——美利坚的制度曾经在战争、恐慌与灾难中挺立不倒，如今也必将如此...\n\n...如今，更加需要的是彼此的信任、耐心与合作。我们的民主依然坚固，我们的经济依然可以重建，我们的国家依然值得我们去守护。在这里，我向全国承诺：联邦政府将继续采取稳健、负责任的政策，避免危险的冒进与落后的保守。政府将与所有美国人民一同，继续努力，使市场重获生机，使家庭重拾希望，使国家重返繁荣。\n\n愿上帝庇护你们每一个家庭，也愿上帝保佑美利坚。谢谢各位。"
 USA.1.a:0 "新的一年！"
 USA.2.t:0 "民兵与白袍梦魇"
 USA.2.d:0 ""
 USA.2.a:0 "流汗了"
 USA.3.t:0 "黑色星期一席卷美利坚"
 USA.3.d:0 "尽管深受政治动荡与无效经济复兴计划的妨害，许多美国公民依然相信他们的国家正稳步从1929年股市大崩盘中恢复过来。“黑色星期一”的降临无疑为这种希望奏响了丧钟，本已疲弱的经济更是坠入无底的深渊。虽然共和党与民主党候选人都承诺在当选后采取积极措施振兴经济，公众对传统两党的信任犹如雪崩般疾速下滑。与此同时，比尔·海伍德，休伊·朗和威廉·H·默里难得达成了一致，都将舆论矛头对准腐败的金融机构与行政部门，三方不约而同地谴责正是这群业界精英的贪婪引发了金融危机。"
 USA.3.a:0 "今年的运气可真差……"
 USA.4.t:0 "重启《加纳-瓦格纳法案》"
 USA.4.d:0 "在华尔街遭受黑色星期一冲击而出现了比大萧条爆发时席卷股市的股灾更加严重的金融灾难后，胡佛总统与他的内阁已经绝望地意识到美利坚的经济形势在短时间内将彻底无法挽救。次日，有鉴于原本脆弱的经济形势遭到了来自欧洲的黑色星期一的进一步打击，胡佛总统对外宣布，与1932年面临的形势不同，这次他不会主张否决民主党参议员罗伯特·瓦格纳和众议院议长约翰·南斯·加纳曾经联名提出的失业救济法案。不少国会议员认为这些救济措施根本不足以帮助人民摆脱危机，更多参议员则对如何从财政上支撑这套计划深感怀疑，毕竟美国依然深处沉重的经济萧条与财政危机——通过这道法案必须付出额外的代价。美利坚至上党与社会党参议员的出席也让问题本身变得更为复杂，即使胡佛总统做出表态，谁也不知道《加纳-瓦格纳法案》是否真的有希望得到通过。"
 USA.4.a:0 "我们拭目以待"
 USA.5.t:0 "休伊、默里与海伍德要求调整法案"
 USA.5.d:0 "正如预期的那样，首先对《加纳-瓦格纳法案》发难的是至上党、旧民主党和社会党。休伊·朗和美利坚至上党参议员要求大幅提升该法案涉及的社会保障条款，而大多数其他议员表示美国永远负担不起如此沉重的社会开支。与此同时，比尔·海伍德与社会党人士认为，这道法案在保护工人权益方面做得不够，政府尤其应关注如何确保工人阶级不受陷入困境的企业剥削。威廉·默里则动员起了旧民主党，称法案忽视了农村人口的疾苦，并要求州一级政府在法案的具体实施上要拥有更大的发言权。三大党派的发言引起了新闻媒体的广泛关注，这更加剧了国会内部骚动中的紧张气氛。"
 USA.5.a:0 "他们整这么一出，我们还能解决问题吗？"
 USA.6.t:0 "国家团结协定"
 USA.6.d:0 "1936年总统选举有望成为美国历史上最具争议的大选。共和党与民主党元老对美利坚社会党，美利坚至上党或南方旧民主党掌权深感焦虑，担心这将成为合众国的末日、美国价值观的终结。\n\n为了避免灾难来临，共和党提出了一项计划，他们将同时提名一名保守派和一名进步派成员担任竞选候选人，以保证本党纲领的温和。作为协议的一部分，共和党将不会试图博取“顽固的南方”的支持，以给传统的民主党留出更多机会，同样共和党也放弃了在进步党主导的地区举行竞选活动。这项计划不太可能受到党内较低级别成员的欢迎，但它可能是唯一能阻止激进党派夺取权力的办法。最重要的是，计划涉及到的三个政党都同意，其中任何一个在总统选举中获得多数票的政党，都将得到另外两个在众议院的支持。尽管胡佛总统缺乏公众支持，但他仍然是共和党的领袖，他的支持将会帮助赢得更多参议员对该计划的支持。"
 USA.6.a:0 "通过协定"
 USA.6.b:0 "多党联合政府有损民主政治的健康"
 USA.7.t:0 "意见难合的参议员"
 USA.7.d:0 "历经数周的紧张谈判，部分建制派参议员对即将举行的《加纳-瓦格纳法案》国会投票依然无法达成共识。其中最引人注目的是该法案曾经的提出者之一，罗伯特·瓦格纳。瓦格纳宣称除非提高法案中涉及的联邦失业保险安全性，否则他拒绝投票支持旧法案。许多民主党与共和党的参议员还担心至上党、旧民主党和社会党的影响，称如果向其中任何一方做出妥协，他们就会极力抵制这一法案……不过，也有人认为假若政府拒绝与至上党、旧民主党和社会党展开对话，法案的通过希望会很渺茫。胡佛总统需要立即干预其中，挽救法案的推行。"
 USA.7.a:0 "承诺支持瓦格纳和建制派参议员"
 USA.7.b:0 "迫使建制派向至上党妥协"
 USA.7.c:0 "迫使建制派向社会党妥协"
 USA.7.e:0 "迫使建制派向旧民主党妥协"
 USA.8.t:0 "朗、默里与海伍德怒不可遏"
 USA.8.d:0 "无论是休伊·朗控制下的美利坚至上党、威廉·默里领导的旧民主党，还是海伍德掌舵的美利坚社会党，都对胡佛总统公开支持建制派参议员的行为表示了愤慨。他们发誓要让《加纳-瓦格纳法案》石沉大海，以免公众蒙受“拒绝认清美国现状的腐败政府”欺骗。虽然三大极端党派在舆论上获得了不少支持，但民主党与共和党的状况也有所改观，即使法案未能通过，两党也已准备好了面对接下来的大选。"
 USA.8.a:0 "至少我们维持住了原则"
 USA.9.t:0 "与至上党达成妥协"
 USA.9.d:0 "持续数日的协商会议后，建制派议员终于和美利坚至上党达成了共识，同意为养老金和失业救济追加更多的经费投入。虽然这一妥协并未满足美利坚社会党的全部要求，但休伊·朗还是对外宣称取得了重大胜利，并在最新的民意调查中一路走高。与此同时，比尔·海伍德的美利坚社会党、威廉·默里的旧民主党，以及部分共和党议员都谴责政府此举是对公众利益的背叛，因此他们将不惜一切代价抵制法案的通过。"
 USA.9.a:0 "我们尽力了……"
 USA.10.t:0 "与社会党达成妥协"
 USA.10.d:0 "持续数日的协商会议后，建制派议员终于和美利坚社会党达成了共识，同意为工人保护和失业救济追加更多的经费投入。虽然这一妥协并未满足美利坚社会党的全部要求，但比尔·海伍德还是对外宣称取得了重大胜利，并在最新的民意调查中一路走高。与此同时，休伊·朗的美利坚至上党、威廉·默里的旧民主党，以及部分民主党议员都谴责政府此举是对公众利益的背叛，因此他们将不惜一切代价抵制法案的通过。"
 USA.10.a:0 "我们尽力了……"
 USA.11.t:0 "与旧民主党达成妥协"
 USA.11.d:0 "持续数日的协商会议后，建制派议员终于和旧民主党达成了共识，同意为农村救济和基层代表追加更多的经费投入。虽然这一妥协并未满足旧民主党的全部要求，但威廉·默里还是对外宣称取得了重大胜利，并在最新的民意调查中一路走高。与此同时，休伊·朗的美利坚至上党、比尔·海伍德的美利坚社会党，以及部分民主党议员都谴责政府此举是对公众利益的背叛，因此他们将不惜一切代价抵制法案的通过。"
 USA.11.a:0 "我们尽力了……"
 USA.12.t:0 "《加纳-瓦格纳法案》在国会胜利通过！"
 USA.12.d:0 "尽管投票结果相当接近，《加纳-瓦格纳法案》成功得到国会批准，全国各地的美国民众都为这项有望缓解国家灾难性经济现状的法案得到通过而振奋不已。但政府内部依然有许多人对此提出质疑：我们该如何付账呢？"
 USA.12.a:0 "这是我们的胜利！"
 USA.13.t:0 "《加纳-瓦格纳法案》未能通过！"
 USA.13.d:0 "尽管投票结果相当接近，《加纳-瓦格纳法案》未能得到国会批准。部分政治团体宣称这是他们的胜利，全国各地则为此爆发大规模示威活动。鉴于美国劳动者无法得到常规的政府救济，许多人开始批评联邦政府的角色是腐败而功能失调的。我们有的是时间相互攻讦，但至少目前看来，胡佛政府的顾虑必须转向全国各地不断滋生的暴力问题——在大选前数月内，民间骚乱恐怕只会有增无减。"
 USA.13.a:0 "这一切都是徒劳的……"
 USA.14.t:0 "南方民主党人需求支持"
 USA.14.d:0 "南方民主党要求我们加强选举保护，来防备他们的新敌，特别是激进的全国白人联盟。尽管南方民主党相当保守，但他们现在面临着的是极右的旧民主党的初选攻势，以及民粹主义的美利坚至上党对他们权力的挑战。尽管共和党和南方民主党长期以来是死敌，但许多自由派人士仍认为，在大选来临时，南方民主党是维持自由民主的政党联盟必要的堡垒。现在许多保守民主党人正持续地加入旧民主党，我们是否应该通过签署他们的一些要求来提升南方民主党的选举成效，以阻止他们这种遭到放血的势头，尽管南方民主党是我们长年以来的宿敌？"
 USA.14.a:0 "为他们提供掩护"
 USA.14.b:0 "谁在意啊？"
 USA.15.t:0 "共和党的总统提名产生分歧"
 USA.15.d:0 "共和党在拯救美国和维护自由民主这一目标上团结一致，但与往常一样，对于由党内进步派还是保守派的一名成员担任总统候选人一事，成员间产生了分歧。代表本党温和保守派的是美国副总统查尔斯·柯蒂斯，他在政界以谈判能力而闻名，这也使他具有了对跨越党派界限的温和派的吸引力。然后，代表该党自由派的是著名商人、堪萨斯州州长阿尔夫·兰登，他赞成对经济进行更直接的干预，并可能赢得最近叛逃到左翼进步党的进步派共和党人的支持。提名的落选者将成为副总统候选人，以彰显党内的团结（由于健康状况不佳，柯蒂斯同意让位于胡佛的盟友弗兰克·诺克斯），而胡佛决定利用他仅剩的少量政治资本支持其中一位候选人，这可能会成就他们，也可能会毁掉他们。"
 USA.15.a:0 "支持柯蒂斯"
 USA.15.b:0 "支持兰登"
 USA.16.t:0 "柯蒂斯的健康状况受到质疑"
 USA.16.d:0 "虽然共和党全国代表大会还没有召开，但一些党内领导人担心，由于查尔斯·柯蒂斯的健康状况不佳，他们会因此输掉即将到来的选举。党内自由派正在推动将柯蒂斯换成兰登并使我们与保守派保持距离的方案。与此同时，一部分保守派共和党人也在游说胡佛和共和党领导层再次竞选总统。当然，尽管有着健康问题，共和党领导层仍然愿意支持柯蒂斯，但如果他想成为下一任总统，就必须让这些流言停止散播。"
 USA.16.a:0 "我们需要改变，我们需要一张新面孔，我们现在就需要兰登"
 USA.16.b:0 "现在换人太疯狂了；我们要留住柯蒂斯"
 USA.16.c:0 "我们需要专家，我们需要任命胡佛"
 USA.17.t:0 "再提名赫伯特·胡佛"
 USA.17.d:0 "萨克拉门托举行的大型政治集会上，赫伯特·胡佛在共和党政要人物簇拥下，被正式宣布为共和党的总统候选人。这场大规模的集会并没有得到与其规模相符的关注，由于他的竞争对手加纳和诺里斯在总统角逐中处于领先地位，媒体在总体上仅对其进行了少量报道。"
 USA.17.a:0 "我们会全力以赴的，伙计们！"
 USA.18.t:0 "民主党的总统提名"
 USA.18.d:0 "民主党选择提名德克萨斯州众议员约翰·南斯·加纳，他的政治影响力基本来自于过去两年担任众议院议长的经历。加纳是一位著名的反激进派，他凭借两个承诺赢得了提名：维护威尔逊所取得的经济成果和不惜一切代价维护自由。由于威尔逊在党内仍有争议，这引发了相当多的争论，并激怒了部分党内成员，他们认为加纳过于保守，与总统的职位脱节。尽管如此，他在剩下的民主党成员中获得了更多的支持——即使民主党成员正越来越多地被右翼的旧民主党或美利坚至上党和左翼的进步党所吸收。加纳承诺不向任何形式的激进主义妥协，并谴责那些对激进派做出极大妥协的人。这一承诺得到了许多担心美国政治动荡将加剧人士的支持。"
 USA.18.a:0 "该死的民主党……"
 USA.19.t:0 "进步党的总统提名"
 USA.19.d:0 "强烈反对地方自治计划，认为这将赋予极端主义分子更多力量，坚持许久的自由主义者，内布拉斯加州参议员和受人尊敬的政治家乔治·诺里斯接受了进步党的总统提名，该党诞生于共和党的分裂，其成员对大萧条以来共和党保守的经济策略感到不满。诺里斯表示，美国政治体系中的问题是不公平经济政策和缺乏机会的表现，他支持开展一项大规模经济干预计划，包括对贫困社区进行再投资，并与工会领导人合作。他认为该计划不仅能稳定社会，还能“使国家实现真正的公平”。对加纳提名感到不满的民主党自由派对诺里斯的信息表现出了相当浓厚的兴趣。"
 USA.19.a:0 "该死的分票者……"
 USA.20.t:0 "柯蒂斯的总统提名"
 USA.20.d:0 "萨克拉门托举行的大型政治集会上，查尔斯·柯蒂斯在共和党和民主党政要人物簇拥下，被正式宣布为共和党的总统候选人。这场集会出人意料地得到大批媒体人士与出席者的欢迎，众人由衷地希望这将成为总统选举的最终结果。"
 USA.20.a:0 "祈祷，这将对我们有帮助"
 USA.21.t:0 "兰登的总统提名"
 USA.21.d:0 "萨克拉门托举行的大型政治集会上，阿尔夫·兰登在共和党和民主党政要人物簇拥下，被正式宣布为共和党的总统候选人。这场集会出人意料地得到大批媒体人士与出席者的欢迎，众人由衷地希望这将成为总统选举的最终结果。"
 USA.21.a:0 "祈祷，这将对我们有帮助"
 USA.22.t:0 "印第安纳之战"
 USA.22.d:0 "由于社会主义者和旧民主党人都在印第安纳州站稳了脚跟，那里正迅速沦为联邦中最混乱的州之一。有保镖随行的政客，对敌人总部的破坏行为，以及双方活动人士的偶尔失踪都已成为司空见惯的事。由于民兵成员意识到了国民警卫队无力遏制他们，于是他们在互相攻击时变得越来越大胆，而情况也变得更糟。我们需要加强这一地区的防卫，但目前的问题是，我们是应该控制整个州，还是应该把我们的军队部署在三K党势力更大的印第安纳州中部，或是在美利坚社会党大本营所在的北部？"
 USA.22.a:0 "把两边都给我控制住"
 USA.22.b:0 "对抗三K党"
 USA.22.c:0 "对抗社会主义者"
 USA.22.e:0 "我们现阶段拿不出这么多资源"
 USA.23.t:0 "提名昆汀·罗斯福"
 USA.23.d:0 "自从诺里斯参议员被提名为进步党总统候选人以来，关注政治的人饶有兴趣地讨论着副总统的可能人选。昨天，尘埃终于正式落定，昆汀·罗斯福被正式确定为进步党副总统候选人。罗斯福在竞选演讲中首推一项名为“公平施政”的计划，实现国家的重大改革。该提名让共和党政治阶层极为震惊，他们倒并不介意共和党著名总统的后裔在其他党派有“更光明的未来”时加入他们——或许他们还记得是西奥多·罗斯福创立了最初的进步党并因此分走了共和党的选票。"
 USA.23.a:0 "公平而公正的交易"
 USA.24.t:0 "旧民主党的总统提名"
 USA.24.d:0 "旧民主党正式宣布了他们选定的总统候选人，并对民主党的保守中间派及其自由派向共和党实业家、天主教选民、犹太金融家和华盛顿的官僚献媚一事表示严重谴责。旧民主党最初是因工团主义猖獗发展和民权运动复兴带来的反动建立的，米切尔·帕尔默在第一次红色恐慌中对日益激进的反社会主义做出的鼓励让其进一步成长，在大萧条时期，共和党关税严重损害了农业，使得旧民主党得到了更多的支持。今天，旧民主党宣布他们的总统候选人是长期以来的实际党派领导人和俄克拉何马州的州长威廉·H·默里，默里声称自己进行的是一场对抗“共产主义者、企业集团和跨种族通婚”的运动。由查尔斯·林德伯格和亨利·福特领导的国家法团主义者和以城市为基础的北方民主党派系，也就是俗称的福特主义者，以及三K党及其在全国民主党白人联盟中的分支机构都对默里表达了自己的支持。"
 USA.24.a:0 "别再来更激进的候选人了……"
 USA.25.t:0 "日益激进化"
 USA.25.d:0 "驴与象无休止的争斗令美国人对两大传统政党感到由衷的失望，越来越多的选民开始支持民粹主义的美利坚至上党、旧民主党和激进的美利坚社会党。黑暗的年代里，你很难分辨真正的社会改革与移花接木的把戏，那些参与极端党派活动的公民已经从主办方手中取得不少“积极贡献”的红利。至上党的财富分享计划，社会党的国际红色援助和旧民主党的体制内福利与全国白人联盟庇护本质上就是这样的骗局。这些激进党派的政治机器比民主党和共和党更擅长利用大众媒体收买人心，海伍德、默里或朗赢得1936年大选的概率越来越高。"
 USA.25.a:0 "这可不妙"
 USA.26.t:0 "进步党脱离共和党"
 USA.26.d:0 "明尼苏达州已经成为进步党参议员弗洛伊德·奥尔森的坚实堡垒，继续与共和党为主的传统政党渐行渐远。许多人正从共和党倒向进步党、美利坚至上党甚至是美利坚社会党。各大工会为这些党派举行了集会，参加人数远远超出了我们的掌控范围。"
 USA.26.a:0 "有人嗅到血的气息了吗？"
 USA.27.t:0 "南方民主党支持者转投旧民主党"
 USA.27.d:0 "南方各州长期以来都是传统民主党精英们的核心票仓，但这样的局面恐怕很难持续下去。最新民调结果显示，旧民主党的选民登记数量和他们的提名人支持率大幅上升。该党领袖威廉·H·默里在最近的电台演讲中详细谈到了自己对美国的计划，以及终结对“美国白人生活方式”的威胁。旧民主党人的支持与日俱增，他们承诺要同继续与共和党合作的主流民主党人展开竞选活动。"
 USA.27.a:0 "一群狡猾的疯子！"
 USA.28.t:0 "麦克阿瑟与胡佛的愉快聊天"
 USA.28.d:0 "麦克阿瑟曾与胡佛总统私下讨论过名为“白色战争计划”的国家紧急预案，用以应对美国民众可能的武装起义。这项方案要求麦克阿瑟将军采取特别行动保卫国家，在华盛顿特区竖起路障，首都以外的地方也能成为计划的起始点，例如华盛顿军火库。这项方案尚未对外公开，如果激进主义者企图自内而外地发起革命，我们至少能将它视作一种应急措施。麦克阿瑟同时继续请求授权军队控制新墨西哥州，那里有三K党和一分钟人的活动，但一些政府成员对进一步授权麦克阿瑟感到紧张，认为他在滥用自己的权力。"
 USA.28.a:0 "否决"
 USA.28.b:0 "鼎力支持"
 USA.29.t:0 "天桥之战"
 USA.29.d:0 "在被誉为世界汽车之都的密歇根州底特律，汽车工人联合会领袖沃尔特·鲁瑟和理查德·弗兰肯斯坦正在煽动工人向福特公司发起总罢工，“工会主义万岁，福特主义去死！”，汽车工人们呼吁企业提高薪酬标准，缩短劳动时间。\n\n今天下午两点，一名来自《底特律自由新闻报》的摄影师希望拍摄一幅以福特工厂标志为背景的照片，让汽车工人联合会领袖意气风发地站在天桥上鼓舞士气。当他们正在摆姿势的时候，四十多名受雇于福特公司的男性员工突然从后方接近毒打他们，并紧接着用警棍袭击那些在现场分发传单的进步女性。"
 USA.29.a:0 "挨打的是工会分子，受伤的是我们！"
 USA.30.t:0 "国会议员退休潮"
 USA.30.d:0 "众多民主党与共和党议员对外宣布。今年将成为他们出席美国国会的最后一年。大多数代表以年龄因素作为自己离开的理由，但有人认为这波退休潮很可能与社会党、旧民主党和美利坚至上党的恐吓有关，不禁令人联想起查尔斯·萨姆纳参议员与普雷斯顿·布鲁克斯众议员间的国会斗殴（1856年，奴隶制辩论时期著名的政治暴力事件），历史恐怕离我们不甚遥远。史无前例的退休率令激进党派愈发坚信他们将赢得公开选举。"
 USA.30.a:0 "希望能有好的替补人选"
 USA.31.t:0 "激进派之间的冲突"
 USA.31.d:0 "至上党，旧民主党和社会党的支持者，日前在许多主要城市爆发正面冲突。聚众斗殴与街头枪战正日渐成为社会常态，使国家秩序逐步陷入混乱。尽管无组织的民间暴动很容易镇压，如果同样的事情发生在激进分子通过贿赂建立起来的“小街区”，执法部门将不得不望而兴叹。"
 USA.31.a:0 "今年的运气可真差……"
 USA.32.t:0 "麦克阿瑟的独立日演讲"
 USA.32.d:0 "今年7月4日，道格拉斯·麦克阿瑟在纽约发表广播讲话，谴责激进分子之间的暴力行为，并向美国人民承诺，军方已做好恢复秩序的充分准备。虽然演讲内容振奋人心，但有一个问题是麦克阿瑟甚至没有提醒总统他将对全国发表讲话。查尔斯·柯蒂斯被激怒了，但我们内阁中的其他人显然很钦佩麦克阿瑟“集团”以及他让许多当权派人士相信他能恢复国家秩序的能力。尽管如此，这对民主来说不是一个好兆头，但麦克阿瑟在我们的军队中有太多追随者，不可能将其解雇，也许我们可以谴责他，不管这是否值得。"
 USA.32.a:0 "斥责他"
 USA.32.b:0 "随便他"
 USA.33.t:0 "查尔斯·库格林的广播节目"
 USA.33.d:0 "三年前的今天，查尔斯·库格林神父通过哥伦比亚广播公司在美国开办起每周一场的广播节目，如今已有超过五千万民众收听他的频道。作为领导至上党的积极分子的一员，库格林是一个宣扬阴谋论的民粹主义者，他公然宣称法国工团革命是“日耳曼精英背后指使的”，柏林股市崩盘更是“德意志金融集团的国际阴谋”。而且不知何故，他的听众甚至开始接受他几乎颠覆整个美国政府的激进议程的呼吁。罗马天主教会已经无法忍受他的主张，教宗陛下正考虑是否向美国政府提出请求，关闭库格林神父的栏目，不要让公众产生天主教会支持这种低端仇恨言论的错觉。"
 USA.33.a:0 "对社会公众来说库格林已成为了威胁，让他闭嘴"
 USA.33.b:0 "我不同意他说的每一个字，但我誓死捍卫他说话的权利"
 USA.34.t:0 "休伊·朗的演讲"
 USA.34.d:0 "共和党与民主党就像常来我们镇上的药剂推销员。他有两种药，会弹五弦琴，还懂得怎样卖出这两瓶药。\n\n第一只瓶子里装的是“高格尔仁”，另一只瓶子里装的是“低格尔仁”。\n\n如果有人问他两种药有什么区别，他就会说：“差别大得很，但药效都不错”。\n\n“高格尔仁从树冠部位撕下树皮，矮格尔仁从树根部位撕下树皮。”\n\n当我走进国会时，我发现民主党与共和党唯一的区别是，一个自下而上地剥你的皮，另一个自上而下地剥你的皮。"
 USA.34.a:0 "笑话不能赢得选举"
 USA.35.t:0 "俄亥俄丑闻！"
 USA.35.d:0 "俄亥俄州爆发了一桩重大丑闻，甚至在这个艰难时期也引起了全国的关注。俄亥俄州州长哈里·M·多尔蒂麾下臭名昭著的政治组织“俄亥俄帮”因在私酒贩格奥尔格·雷穆斯的帮助下从军械库向附近的民兵出售枪支而受到了调查，此前，一名受影响的军械库官员被问及失踪补给物资的问题时，声称多尔蒂的代理杰斯·史密斯是中间人。尽管胡佛是这个组织的敌人，但这起丑闻进一步损害了目前政治阶层的声誉。或许我们应该谴责他们，以便与他们保持距离，尽管代价是招致强大的政治对手。"
 USA.35.a:0 "谴责这些疯子！"
 USA.35.b:0 "我不应该发表评论"
 USA.36.t:0 "杰西·史密斯死了！"
 USA.36.d:0 "在成功保释后不久，杰西·史密斯被发现死在自己的公寓里，似乎是开枪自杀。当然，很少有人相信这个故事，这使得现在所谓的“春田丑闻”（以经常卖给民兵组织的步枪命名）变得更加轰动。也许我们应该进一步调查他的死因，以平息人们对政治体系完全腐败的担忧，即使这样做会部分地证明一些激进的民粹主义者是正确的：比如查尔斯·库格林、杰拉尔德·伯顿·温罗德和斯梅德利·巴特勒——他们已经在围绕着这个主题大谈特谈阴谋论了。"
 USA.36.a:0 "派遣联邦调查局"
 USA.36.b:0 "快别管了"
 USA.37.t:0 "政治暴力激化——一次被挫败的刺杀"
 USA.37.d:0 "一次针对旧民主党副总统候选人约翰·E·兰金的刺杀已经发生，一名无政府主义者从人群中向他开枪。昔日的政治纠纷尚且发生在激进党派支持者之间，最近的暴力活动已然蔓延到总统候选人与政治家身上。过去数月内，比尔·海伍德与休伊·朗的生命安全都曾遭受严重威胁。两位刺客均隐藏在喧嚣的人群中接近演讲台开火，但未能命中目标，迫使两位人民政治家各自提高他们的安保标准。此外，数名地方政客也在类似的竞选活动中遇刺受伤。极端派选民对他们的敌人所遭受的打击置若罔闻，似乎对子弹没能对准目标感到由衷的遗憾。"
 USA.37.a:0 "很棒，下次打准点"
 USA.38.t:0 "流血的劳动节"
 USA.38.d:0 "五一国际劳动节诞生以来，社会党都会在今天举办盛大的公众游行与演讲活动。尽管有时会与警方起冲突，总得来说，一切都很平静。今年的情况却不比往年，得到旧民主党支持的地方警察部队日前向社会党游行队伍发动袭击，类似的情况在全国各地迅速蔓延。这究竟是谁的责任呢？社会党发言人表示“警方与三K党闯入会场前，纪念活动进行的相当平静”。旧民主党则公开回应称，他们劝说警方介入的原因是“社会党支持者在街头公然袭击拒绝不肯加入工会的工人”，并向外界公布数张模糊的照片为证。对此，社会党愤怒地表示这些相片都是伪造的。"
 USA.38.a:0 "工团暴徒活该挨揍"
 USA.38.b:0 "警方真是失职"
 USA.39.t:0 "洪水泛滥的圣帕特里克节"
 USA.39.d:0 "1936年3月16日，阿勒格尼河与莫农加希拉河上游沉积的冰雪，因较于往年更高的气温而提前融化。大量冰雪融水在短时间内汇入河流导致水位溢出河堤，很快威胁到匹兹堡市民的安全。1936年3月17日，河流水位达到25英尺，当日夜间的连续暴雨更是对灾情起到推波助澜的作用。3月18日雨停后，水位已达到46英尺峰值，超出洪水位整整21英尺。\n\n据悉，圣帕特里克节洪灾（3月17日，纪念爱尔兰守护神圣帕特里克，匹兹堡是美国爱尔兰裔的主要定居点之一），是匹兹堡市有史以来所遭遇过最惨痛的自然灾害，当地行政机关已向联邦政府请求善后援助。"
 USA.39.a:0 "我们必须向人民伸出援手"
 USA.39.b:0 "自求多福吧！"
 USA.40.t:0 "鲜红夏日"
 USA.40.d:0 "夏日的酷暑，将城市压抑已久的怒火熊熊点燃。今年夏天，全美范围内的私刑案件激增，以南卡罗来纳州查尔斯顿的暴力冲突为起点，全国各地迅速陷入血腥的种族骚乱中。黑人公民遭受白人殴打，私产被纵火焚烧的案例层出不穷。作为种族迫害的回应，非裔血亲兄弟会同美利坚社会党与联合工团部分成员展开密切合作，武装反抗施暴者的诘难。事后，社会党发言人在为己方行为辩护的同时，还向公众出示了一组模糊的相片，声称这是旧民主党成员涉嫌私刑处决有色人种的证据。"
 USA.40.a:0 "今年的情况还能更糟吗？"
 USA.41.t:0 "新泽西州特别选举！"
 USA.41.d:0 "新泽西州参议员亚瑟·哈里·穆尔为竞选州长而向国会递交辞呈。为此，该州决定举行特别选举来提名他的继任者。民主党候选人约翰·杰拉尔德·米尔顿和他的对手兼旧民主党支持者查尔斯·林德伯格在选举中领跑。投票刚刚结束，赢家似乎是……"
 USA.41.a:0 "约翰·杰拉尔德·米尔顿（民主党）"
 USA.41.b:0 "查尔斯·林德伯格（旧民主党）"
 USA.42.t:0 "华盛顿州特别选举！"
 USA.42.d:0 "国会参议员韦斯利·劳埃德去世后，华盛顿州决定举行特别选举来提名他的继任者。社会党积极分子约翰·F·麦凯和民主党众议员约翰·梅因·科菲在选举中领跑。投票刚刚结束，赢家似乎是……"
 USA.42.a:0 "约翰·F·麦凯（美利坚社会党）"
 USA.42.b:0 "约翰·梅因·科菲（民主党）"
 USA.43.t:0 "犯罪狂潮席卷全国"
 USA.43.d:0 "美国社会秩序日益陷入混乱，犯罪浪潮正在全国各地疯狂涌现。诸多怪盗事迹在媒体渲染下惹得人心惶惶，例如银行劫匪“头号公敌”约翰·迪林杰、芝加哥犯罪团伙头目阿尔·卡彭和“鸳鸯大盗”邦妮与克莱德。值得庆幸的是，美国联邦调查局努力奋斗在对抗犯罪的第一线，为沦落下的公共治安带来些许缓和——尽管他们声称人手短缺，要求增加资金。而正如往常那样，社会党、旧民主党和至上党将犯罪问题归咎于强盗资本家和国家的道德沦丧。"
 USA.43.a:0 "增加联邦调查局经费！"
 USA.43.b:0 "我们现在无能为力"
 USA.44.t:0 "准军事组织扩大化"
 USA.44.d:0 "随着暴力冲突与社会动荡正遍及全国，J·埃德加·胡佛已经提交了一份报告，称社会党与至上党开始假借多种名目筹建准军事化民兵武装，并声称此举将保护他们的支持者免受政府、与旧民主党有联系的私刑执行者，甚至彼此之间的伤害。美利坚至上党称他们的民兵武装为“一分钟人”，社会党名下的准军事部队则冠名“赤卫队”。与此同时，旧民主党人与各种白人至上准军事组织联系在了一起，尤其是因“移民激进主义”和海勒姆·韦斯利·埃文斯——帝国巫师威廉·约瑟夫·西蒙斯的明显继承人所极力推动的扩招而持续增长的复仇主义三K党，这些装备精良的准军事化部队负责党派据点与公众集会的巡逻工作，甚至有限地参与过部分极端暴力的街头武装冲突。联邦政府有证据表明他们正在对民用枪械进行改装，使之更具攻击性。但联邦调查局夺取非法武器库存的效率不高，也难以控制军火走私商，情况很可能在短期内变得越来越糟。"
 USA.44.a:0 "该死！"
 USA.45.t:0 "尤金·塔尔梅奇脱党！"
 USA.45.d:0 "佐治亚州州长尤金·塔尔梅奇正式宣布自己加入旧民主党，他声称自己曾经长期隶属的民主党正在“出卖”真正的美国人民。旧民主党是一个与民主党关系暧昧的政治派别，在参加初选的民主党人看来，不涉及他们自己选票的时候，旧民主党只要一有机会就会表示异议。民主党人尽管往往不喜欢他们，但却需要他们的支持，时常和他们召开会议。然而，很明显，旧民主党同时正在吸纳两党的成员，包括没有得到官方认可的三K党控制的印第安纳共和党，该党向旧民主党投诚的人数也在不断增加，而塔尔梅奇的声明又掀起了另一股民主党人投奔旧民主党的浪潮，尤其是在美国东南部。"
 USA.45.a:0 "混账东西！"
 USA.46.t:0 "更多美利坚社会党成员宣布参加国会竞选"
 USA.46.d:0 "美利坚社会党的建党历史并不悠久，却已在国会占据着众多席位，其中大部分来自钢带。1936年选民注册中，登记在美利坚社会党名下参选公职的人数达到前所未有的高度。此外，全国范围内还有同样多的民众愿意为他们投票。大比尔·海伍德和约翰·刘易斯已经开始为他们各自的党派增加竞选活动，以迎合美国社会主义者的热情。"
 USA.46.a:0 "赤匪！"
 USA.47.t:0 "副州长被刺杀！"
 USA.47.d:0 "华盛顿州副州长、共和党人埃米特·T·安德森在离家时被杀，两名刺客从他面前的车中下车，并用点38左轮手枪将他击毙。安德森是该地区民权运动的支持者，有传闻称三K党麾下的红袍皇家骑士团是这一罪行的始作俑者。骑士团乃是三K党的辅助组织，其内部成员是严格意义上不属于美国公民的盎撒人，大多数骑士都是在加拿大出生的三K党支持者。该组织领袖J·亚瑟·赫登近年来愈发反对安德森的政策，据说还在其演讲中威胁性地提及了对方。\n\n尽管刺杀对于三K党来说并不新鲜，但他们成功地刺杀这样一位级别较高和受人爱戴的官员是从未有之的；而且不出所料，尽管海勒姆·韦斯利·埃文斯和威廉·约瑟夫·西蒙斯否认与刺杀有任何联系，并极力淡化红袍皇家骑士团与白人联盟的关系，仍然有许多人建议调查这个组织。虽然一些最为激进的白人联盟成员庆祝着这一暴行的发生，但在华盛顿州，这种暴行却适得其反，许多民众主动来到州首府悼念安德森的去世，以悼念这位公正之人。"
 USA.47.a:0 "打击红骑士"
 USA.47.b:0 "打击三K党"
 USA.47.c:0 "州政府就能应付好这件事"
 USA.48.t:0 "阿肯色州发生大规模冲突！"
 USA.48.d:0 "由于州政府难以控制至上党的一分钟人与旧民主党的盟友白人联盟（尤其是三K党）之间愈演愈烈的冲突，阿肯色州的情况正在逐步恶化。尽管朗试图回避（或不经意间转移）美国的黑人民权问题，但他的激进民粹主义经济议程，以及与天主教徒和犹太人组织的结盟，已经引起了该地区越来越多反动地主家庭以及白人至上主义组织的仇恨。由于朗本人的野心使他与旧民主党间有着长期分歧，他似乎更愿意与进步派结盟。在这种背景下，至上党和旧民主党间的摩擦已升级为两方的直接战争，一分钟人最近试图刺杀当地白人联盟领袖霍默·马丁·阿德金斯，但仅仅将其击伤。朗的盟友哈蒂·怀亚特·卡拉韦呼吁政府镇压三K党，声称三K党的恐怖袭击是导致冲突的主要原因，而阿肯色州东部的诸多建制派，包括国会议员以西基尔·C·加辛斯都希望对至上党进行镇压。传统民主党人、伍德罗·威尔逊的前盟友约瑟夫·罗宾逊则建议同时对这两个组织进行打击。"
 USA.48.a:0 "同时打击两者"
 USA.48.b:0 "打击三K党"
 USA.48.c:0 "打击一分钟人"
 USA.48.e:0 "我们现在没空插手"
 USA.49.t:0 "随风而逝"
 USA.49.d:0 "今天，玛格丽特·米切尔所写的小说《飘》正式出版，并迅速成为业界的超级畅销书，有望取得本年度普利策奖提名。好莱坞也敏锐地察觉到其中蕴藏的商机，计划于明年推出同名改编电影。书中的故事发生在南北战争时期的旧南方，因此被许多读者视作当今美国社会政治形势的潜在隐射。不少保守派南方人宣称这部小说的理念与他们的事业是完美契合的。"
 USA.49.a:0 "坦白地说，亲爱的，我可不在乎……"
 USA.50.t:0 "1936年北美大热浪"
 USA.50.d:0 "美国与加拿大近代历史上最为严重的热浪灾害日前席卷北美大陆。“北美大热浪”开始于六月下旬，在缺乏降雨引发的干旱影响下，地表气温迅速上升到38°C。截至七月的今天，多地气温已突破历史最高水平。北达科他州斯蒂尔的当地温度达到50°C。俄亥俄州平均气温也已接近43°C，与1934年创下的历史高点基本持平。\n\n这场热浪伴随着国内的重大政治动荡而来，美利坚至上党是中西部政治的重要干涉力量，社会党与工团武装则在五大湖工业区日益壮大。普遍干旱的影响仍在持续，据报道，已有超过3000人在与之相关的次生灾害中不幸遇难，另有大批中暑与热衰竭的病例在多地出现。北美大陆的农民成功见证有记录以来最为糟糕的收成情况，玉米与小麦价格正在迅速攀升。气象专家指出这股热浪恐怕很难在短期内自行消散。"
 USA.50.a:0 "今年的运气还能再差点吗……"
 USA.51.t:0 "大热浪消退"
 USA.51.d:0 "久违的冷锋，迎来希望的降雨。1936年北美大热浪终于自行消退，从温哥华到洛杉矶、纽约州到华盛顿，受难已久的民众终于喘下一口气。这场热浪或许会成为20世纪美国最为致命的自然灾害，超过五千人在这场无妄之灾中不幸罹难。热浪已经结束，曾经感慨于自然神力的人类多少开始意识到，谁会比天灾更擅长谋取人的性命。此时此刻，美国历史正悄然步入新的篇章……"
 USA.51.a:0 "至少这起灾祸结束了……"
 USA.52.t:0 "竞选活动加强了民兵力量"
 USA.52.d:0 "休伊·朗的至上党、社会党和旧民主党之间的竞选活动变得极度动荡，以至于没人敢在其他政党的“根据地”进行竞选活动。至上党“一分钟人”已经开始在敌对州的边境展开巡逻，并与政府官员进行了合作，以遏止敌方可能的袭击，而旧民主党和社会党也做出了同样的回应。这意味着新兴党派的民兵组织已经彻底走出了阴影，在阳光下行使着军事组织的作用，我们自己的一些军官甚至也在帮助他们进行训练、组织和巡逻，使他们成为更具凝聚力的力量。"
 USA.52.a:0 "战争可能要来了"
 USA.53.t:0 "米切尔·帕尔默去世"
 USA.53.d:0 "前总统米切尔·帕尔默今天在接受阑尾切除术后不久死于心脏并发症。建制派政党（即共和党和民主党）发表声明，对他的去世表示了哀悼，而其他政党和大部分公众似乎对他的死亡持矛盾态度，根本没有发表任何声明。社会党单独公开庆祝他的死亡，声称帕尔默是一个暴君，他在接替伍德罗·威尔逊担任两届总统后，要为美国的现状和对工会工人的袭击负责。旧民主党似乎相当赞同帕尔默发动的红色恐慌，并发表了一份声明感谢他的努力，尽管他们随后又否定了帕尔默更为“自由”的言论。朗本人对此几乎没有任何评论，只是认为帕尔默是个“有缺陷的”人。"
 USA.53.a:0 "很好"
 USA.54.t:0 "1936年世界大赛"
 USA.54.d:0 "在纽约一个寒冷的夜晚，美国总统胡佛为世界职业棒球大赛的第一场正式开球仪式揭幕。美国职业棒球大联盟冠军巨人队和美国联盟冠军扬基队将在纽约举行“地铁系列赛”。虽然这个系列看起来很有竞争力，但扬基队仍然很有胜算，因为扬基队的老核心球员葛里克和拉泽里，加上新秀迪马吉奥和传奇投手戈麦斯都蓄势待发。然而，巨人队并不是轻易能被击败的，他们拥有全垒打之王梅尔·奥特和王牌投手卡尔·哈贝尔。由于不断恶化的政治和经济形势，美国人对棒球的喜爱水涨船高，认为它是为数不多的仍能把各种信仰的美国人团结在一起的东西之一。至少在几个小时内，美国可以恢复正常了。"
 USA.54.a:0 "玩球咯！"
 USA.55.t:0 "扬基队的胜利"
 USA.55.d:0 "在这场艰苦的系列赛中，扬基队以四比二的比分击败巨人队，获得了他们的第五个总冠军。许多人都认为是扬基队的新秀迪马吉奥成为了比赛转折点，他在离本垒490英尺的地方做出了一个惊人的接球，并跑上球场的台阶，参加了最后的决赛，并得到了胡佛总统本人的敬礼。尽管比赛的结局在那一刻决定了，他的努力还是值得称赞的。然而，现在世界职业棒球大赛已经结束，随着选举的临近和竞选活动的白热化，美国人民间开始变得越来越分裂。"
 USA.55.a:0 "恭喜扬基队！"
 USA.56.t:0 "巨人队的胜利"
 USA.56.d:0 "在一场扬基队令人震惊的溃败中，纽约巨人队以四比三击败扬基队，获得他们的第五个总冠军。虽然扬基队比赛打得很漂亮，但他们无法控制梅尔·奥特的力量，在决定性的第七场比赛中，他击出了两个本垒打。胡佛总统亲自向奥特致敬，表彰他出色的表现，他长期以来的成就使巨人队成为十年来美国最好的球队之一。然而，现在世界职业棒球大赛已经结束，随着选举的临近和竞选活动的白热化，美国人民间开始变得越来越分裂。"
 USA.56.a:0 "恭喜巨人队！"
 USA.57.t:0 "1937年世界大赛"
 USA.57.d.yankees_36:0 "这是一年前许多人从未设想过的一天，1937年世界职业棒球大赛终于拉开了帷幕，扬基队和巨人队再次相遇，进行了另一场全纽约的对决。扬基队经历了一个精彩的赛季，并希望能再夺去年的总冠军，而巨人队则渴望进行一场去年比赛的“重赛”，并已向众人证明，自己是一个强大的对手。然而，棒球本身已经退居次要地位，因为世界大赛被证明是自1936年分裂危机后第一次真正象征团结的事件之一，那次危机几乎使许多美国人反目成仇。许多人希望，大赛只是众多这些事件中的第一个，这些事件将有助于愈合美国分裂所带来的创伤。"
 USA.57.d.giants_36:0 "这是一年前许多人从未设想过的一天，1937年世界职业棒球大赛终于拉开了帷幕，扬基队和巨人队再次相遇，进行了另一场全纽约的对决。扬基队经历了一个精彩的赛季，并希望能再夺去年的总冠军，而巨人队则渴望进行一场去年比赛的“重赛”，并已向众人证明，自己是一个强大的对手。然而，棒球本身已经退居次要地位，因为世界大赛被证明是自1936年分裂危机后第一次真正象征团结的事件之一，那次危机几乎使许多美国人反目成仇。许多人希望，大赛只是众多这些事件中的第一个，这些事件将有助于愈合美国分裂所带来的创伤。"
 USA.57.a:0 "玩球咯！"
 USA.58.t:0 "扬基队的胜利"
 USA.58.d.yankees_36:0 "在一场一边倒的大赛中，纽约扬基队以四比一的比分击败了巨人队，赢得了他们的第六个总冠军，也是他们连续第二个冠军。许多人认为转折点再次来自于扬基队球星乔·迪马吉奥，他在第一场比赛的第六局组织发起了进攻，而扬基队也高歌猛进，在剩下的比赛中击败了巨人队。[USA.GetLeader]祝贺了胜利者一个赛季的出色表现。虽然大赛可能已经结束，但各地的美国人都聚集在一起，庆祝着这个“全国性的消遣活动”，而这样和谐的画面似乎在很大程度上将要延续下去。"
 USA.58.d.giants_36:0 "在一场一边倒的大赛中，纽约扬基队以四比一的比分击败了巨人队，赢得了他们的第六个总冠军，也是他们连续第二个冠军。许多人认为转折点来自于扬基队球星乔·迪马吉奥，他在第一场比赛的第六局组织发起了进攻，而扬基队也高歌猛进，在剩下的比赛中击败了巨人队。[USA.GetLeader]祝贺了胜利者一个赛季的出色表现。虽然大赛可能已经结束，但各地的美国人都聚集在一起，庆祝着这个“全国性的消遣活动”，而这样和谐的画面似乎在很大程度上将要延续下去。"
 USA.58.a:0 "恭喜扬基队！"
 USA.59.t:0 "巨人队的胜利"
 USA.59.d.yankees_36:0 "纽约巨人队成功地报了上个赛季输给扬基队的仇，在1937年的系列赛中六场势均力敌的比赛激烈对抗中，最终以四比二的比分获胜。这场胜利很大程度上要归功于巨人队的明星球员卡尔·哈贝尔，他在这两场比赛中的出色表现成功阻止了扬基队的明星球员卢·格里克和乔·迪马吉奥在这两场比赛中的任何一场中取得高分，最终使得巨人队以微弱的优势取得这两场比赛的胜利。[USA.GetLeader]祝贺了胜利者一个赛季的出色表现。虽然大赛可能已经结束，但各地的美国人都聚集在一起，庆祝着这个“全国性的消遣活动”，而这样和谐的画面似乎在很大程度上将要延续下去。"
 USA.59.d.giants_36:0 "纽约巨人队成功地在这次世界大赛中卫冕，在1937年的系列赛中六场势均力敌的比赛激烈对抗中，最终以四比二的比分获胜。这场胜利很大程度上要归功于巨人队的明星球员卡尔·哈贝尔，他在这两场比赛中的出色表现成功阻止了扬基队的明星球员卢·格里克和乔·迪马吉奥在这两场比赛中的任何一场中取得高分，最终使得巨人队以微弱的优势取得这两场比赛的胜利。[USA.GetLeader]祝贺了胜利者一个赛季的出色表现。虽然大赛可能已经结束，但各地的美国人都聚集在一起，庆祝着这个“全国性的消遣活动”，而这样和谐的画面似乎在很大程度上将要延续下去。"
 USA.59.a:0 "恭喜巨人队！"
 USA.60.t:0 "[GetYear]年世界大赛"
 USA.60.d:0 "内战结束后的第一场世界职业棒球大赛终于来了，急切的美国人蜂拥而至，观看布鲁克林道奇队和纽约扬基队的比赛，这是一场历史上罕见的比赛。乔·迪马吉奥几乎在战争结束后就立即恢复了状态，他在过去的一年里实力得到了突破性的进展，前所未有的在连续56场比赛中安打，这是一项不太可能被打破的纪录。然而即使道奇队以明显的劣势进入这个系列赛，许多布鲁克林的球迷依然相信他们能成功。全国各地的人们都在急切地收听广播，等待着最终胜利者的诞生，唯有这一刻，国家与人民在这重建的混乱中得到片刻喘息。"
 USA.60.a:0 "玩球咯！"
 USA.61.t:0 "道奇队的胜利"
 USA.61.d:0 "道奇队完成了看似不可能的任务——在扬基体育场，在7万多名球迷的见证下，在六场比赛中逆天地击败了迪马吉奥以及他那士气高昂的纽约扬基队。道奇队的成功很大程度上要归功于最近从圣路易斯来的乔·梅德维克，他在整个系列赛中成功击败了迪马吉奥。在第4场比赛中，道奇队的接球手米基·欧文差点犯错，导致比赛失败，但道奇队在这一场比赛后扳回一球，逆风翻盘，结束了这场比赛，为最终布鲁克林队的胜利奠定了基础。在这场比赛的结尾，梅德维克把胜利献给了所有在战争中牺牲的人，在这一个光明的日子里，这是最好的缅怀。"
 USA.61.a:0 "他们真的做到了！"
 USA.62.t:0 "扬基队的胜利"
 USA.62.d:0 "最后，扬基队在洛杉矶体育场7万多名球迷的见证下，在六场比赛中顺利地击败了道奇队。迪马吉奥，为数不多的大联盟在本赛季中实力回到战前的选手，他一如既往的进攻，但真正的转折点出现在第四场比赛，当时道奇队捕手米基·欧文犯下一个失误，为扬基队创造了巨大的优势，并趁着这股劲头赢得了这次系列赛。在这场比赛的结尾，迪马吉奥把胜利献给了所有在战争中牺牲的人。在这一个光明的日子里，这是最好的缅怀。"
 USA.62.a:0 "你来了，乔·迪马吉奥，我们想死你了"
 USA.63.t:0 "1936年总统大选"
 USA.63.d:0 "大选结果终于揭晓，这可能是全美历史上最具意识形态争议的总统选举。三大主要政党都未能在选举人团中赢得足够多的选票，无法彻底拿下总统选举。有鉴于此，众议院将承担起自己的责任，选出他们理想中的候选人。虽然许多人期望所谓的“主流政党”互相支持，但旧民主党正在试图讨好保守派，而社会党则要求着进步人士的支持，否则他们就要为一场“反动”的胜利负责。与此同时，朗似乎正试图与每一位能接触到的代表达成协议，尤其是进步党、共和党左翼和更偏向民粹主义的民主党成员。当选总统绝不会成为国内纷争的终结，但就目前而言，胜利的桂冠属于……"
 USA.63.b:0 "比尔·海伍德（美利坚社会党）"
 USA.63.c:0 "休伊·朗（美利坚至上党）"
 USA.63.acurtis:0 "查尔斯·柯蒂斯（共和党）"
 USA.63.alandon:0 "阿尔夫·兰登（共和党）"
 USA.63.e:0 "威廉·H·默里（旧民主党）"
 USA.63.f:0 "乔治·诺里斯（进步党）"
 USA.63.g:0 "约翰·南斯·加纳（民主党）"
 USA.63.h:0 "陷入僵局！"
 USA.63.i:0 "赫伯特·胡佛（共和党）"
 USA.64.t:0 "选举陷入僵局！"
 USA.64.d:0 "选举仍陷入僵局，众议院没能指定一位获选人获得总统职位。由于不断推迟的选举仍然没有给出结果，民兵在街上发起暴动，并要求他们所支持的候选人获选。由工业领袖、说客和建制派人士组成的华盛顿权力掮客团体开始害怕了，他们提了一个建议，让麦克阿瑟大帅来当总统，这样他就可以兑现他的承诺，终结美国的激进主义势力，麦克阿瑟可以利用他在众议院所能得到的一切支持来满足他所需的政治掩护。虽然我们可以尝试阻止这场政变，但很明显，麦克阿瑟的军方势力已经准备接受提议，并已制定好了一场政变计划。甚至胡佛的一些内阁成员都开始敦促麦克阿瑟接受了。胡佛最亲密的顾问建议总统如果既不愿意支持麦克阿瑟又不想直面麦克阿瑟的怒火的话，可以越过大西洋逃去国外，又或者，共和党可以推举另一个候选人，如果还有这么一个人的话。"
 USA.64.a:0 "胡佛支持麦克阿瑟"
 USA.64.b:0 "我们该跑路啦！"
 USA.64.c:0 "支持加纳"
 USA.64.e:0 "支持诺里斯"
 USA.64.f:0 "借助麦克阿瑟的支持，胡佛宣布国家进入紧急状态，并宣布自己连任总统"
 USA.65.t:0 "美利坚社会党抗议选举结果"
 USA.65.d:0 "美利坚社会党拒绝接受我们公正开放的选举结果，他们声称众议院终裁制度是违背多数选民意志的。比尔·海伍德很快对外作出相近的表态，呼吁国会议员联合起来抵制不公正的大选。尽管如此，美利坚社会党内部的独立报刊对外报道称，美利坚劳工联合会与比尔·海伍德间的合作关系正在出现裂痕。"
 USA.65.a:0 "该死的海伍德！"
 USA.66.b:0 "是时候一起离开了"
 USA.66.t:0 "朗宣称捍卫“美国主义”"
 USA.66.d.reed:0 "朗宣布，虽然至上党输掉了选举，但社会党不可能指望国会在没有他的支持下通过其议程，并宣布他将投票赞成那些有利于“美国人民”的政策，反对那些不利于“美国人民”的政策。很明显，他希望在我们分裂的国会中成为“造王者”，并将选举反建制政党视为他的开端。社会党显然对此很恼火。"
 USA.66.d.Murray:0 "朗宣布，虽然至上党输掉了选举，但旧民主党不可能指望国会在没有他的支持下通过其议程，并宣布他将投票赞成那些有利于“美国人民”的政策，反对那些不利于“美国人民”的政策。很明显，他希望在我们分裂的国会中成为造王者，尽管旧民主党试图保持沉默，但其成员对他反对“老派分子”以及在当地与三K党争夺权力的行为非常憎恨。"
 USA.66.a:0 "混账东西"
 USA.67.t:0 "旧民主党谴责社会党！"
 USA.67.d:0 "旧民主党领导层对选举结果提出强烈抗议，谴责比尔·海伍德的盟友涉嫌操纵选举，要求选举委员会重新计票。威廉·默里甚至举办一场虚拟的总统就职典礼向支持者发表辛辣的讽刺演讲。尽管如此，来自旧民主党的传言表明，党内有不少先前叛逃的共和党和民主党人对这场历史性大选的失败感到由衷遗憾。"
 USA.67.a:0 "真是个疯子"
 USA.68.t:0 "旧民主党谴责加纳！"
 USA.68.d:0 "旧民主党领导层对选举结果提出强烈抗议，谴责加纳的盟友涉嫌操纵选举，要求选举委员会重新计票。更糟糕的是，他们声称，僵局的结果是可怕的，并要求给出一个不同的结果。威廉·默里甚至举办了一场虚拟的总统就职典礼向支持者发表辛辣的讽刺演讲。尽管如此，来自旧民主党的传言表明，党内有不少先前叛逃的共和党和民主党人对这场历史性大选的失败感到由衷遗憾。"
 USA.68.a:0 "真是个疯子"
 USA.69.t:0 "赫伯特·胡佛批评继任总统"
 USA.69.d.reed:0 "赫伯特·胡佛在大选后变得愈发直言不讳，公然批评比尔·海伍德与社会党不适合统治美国，鼓励共和党与民主党联合起来遏制极端党派的野心。"
 USA.69.d.long:0 "赫伯特·胡佛在大选后变得愈发直言不讳，公然批评休伊·朗与美利坚至上党对国家而言是危险的选择，鼓励共和党与民主党联合起来遏制休伊·朗的阴谋。"
 USA.69.d.murray:0 "赫伯特·胡佛在大选后变得愈发直言不讳，公然批评默里与旧民主党对国家而言是危险的选择，鼓励共和党与民主党联合起来遏制默里的阴谋。"
 USA.69.a:0 "他无关紧要"
 USA.70.t:0 "赫伯特·胡佛支持继任总统"
 USA.70.d:0 "赫伯特·胡佛决心摒弃个人政见，向即将上任的[USA.GetLeader]总统提供支持。“只有遵守宪法条文，我们的国家才能在她最黑暗的时刻团结起来”，胡佛总统如是说道。[USA.GetLeader]也反过来为胡佛阁下为国家做出的贡献表示感谢。"
 USA.70.a:0 "感谢他的支持"
 USA.70.title.herb:0 "胡佛的新方向"
 USA.70.d.herb:0 "赫伯特·胡佛向陷入混乱的国家宣布，他对国家的治理将走上全新方向。并希望在国会和地方政府的帮助下解决这场危机。他希望依靠这个新方向使美国免于彻底崩溃。"
 USA.70.a.herb:0 "这里是胡佛总统，各位现在收听的是公共电台……"
 USA.71.t:0 "新年罢工"
 USA.71.d:0 "为表达对选举结果的抗议，社会党日前决定在元旦发起罢工活动，导致北方工业体系陷入瘫痪。罢工期间，工人们还自发组织起“联合工团理事会”与“职业工人委员会”，在钢带城市实施工人民主管理。赫斯特报业已将这起罢工事件彻底妖魔化，与引发英国大革命的不列颠总罢工相类比。"
 USA.71.a:0 "这会引起麻烦的"
 USA.72.t:0 "印第安公民权保障法"
 USA.72.d:0 "为获取北方与西部选区的支持，参议院与众议院日前呼吁批准《印第安公民权保障法》，将原本遭受法律歧视的印第安人升格为正式公民。来自东北与西部诸州的政客都支持这项提案，但部分南方民主党与北方共和党人认为这项法案缺乏实效。"
 USA.72.a:0 "批准法案，这将为我们争取更多同情！"
 USA.72.b:0 "否决法案，我们没有时间搞民粹主义"
 USA.73.t:0 "白色战争计划"
 USA.73.d:0 "白色战争计划，是美国军方以颜色为代号标注的一系列军事方案之一，它是为应对国内骚乱和民众起义而提前拟定的。鉴于旧民主党与社会党不断通过暴力活动与地方政府争夺控制权，这项方案实施得可谓一刻不早，明尼苏达州与北卡罗来纳州是准军事化组织颠覆活动作为猖獗的两大地区，目前我们只有足够的资源保住其中之一。"
 USA.73.a:0 "重点对抗明尼苏达州的美利坚社会党"
 USA.73.b:0 "重点对抗北卡罗来纳州的旧民主党"
 USA.74.t:0 "抽调国民警卫队"
 USA.74.d:0 "联邦政府开展国民警卫队部署工作至今，已持续六个多月，他们在多座美国城市为维护社会安全而不懈奋战。尽管如此，越来越多的人开始担心国民警卫队指挥官们本身的忠诚性，毕竟其中不少军官都对美利坚至上党或社会党持同情态度。因此，我们需要将更多精力放在增强我们信任的忠诚部队上，也需要妥善决定应将他们部署到何处。"
 USA.74.a:0 "集中精力恢复明尼苏达州的秩序"
 USA.74.b:0 "集中精力恢复爱荷华州的秩序"
 USA.74.c:0 "集中精力恢复田纳西州的秩序"
 USA.75.t:0 "麦克阿瑟将军的计划"
 USA.75.d:0 "联邦政府在控制社会治安领域付出众多心血，但美利坚至上党和社会党对某些地区的影响力依然太过雄厚，许多人开始担心美国即将陷入一场内战。为此，麦克阿瑟将军公布了他的计划，对纽约市或德克萨斯州南部的关键地区实施渗透。两地的战略意义都很重要，纽约市的工业资源雄厚，德克萨斯州南部盛产石油，却双双面临着遭到极端党派接管的威胁。麦克阿瑟将军表示，如果美利坚至上党和社会党的势力变得过于强大，以上努力也有可能落空，但他相信如果实施这些计划，联邦政府在爆发武装冲突后就有更高的希望维持当地控制权。"
 USA.75.a:0 "纽约市的地位更加关键"
 USA.75.b:0 "我们绝对需要德克萨斯的石油"
 USA.76.t:0 "道顿计划"
 USA.76.d:0 "民主党议员罗伯特·L·道顿提出一项方案，主张对美国企业增税来实践联邦政府的失业救济工作，作为回报，政府可以承诺在危机解除后再大幅降低这些税款。这道法案在国会某些角落引起很大的争议，尤其是旧民主党和社会党的支持者，还有其他议员表示下届政府要推翻这项决定未免太过容易了，毕竟经济危机带来的影响也让企业不堪重负，如今再让他们承担社会救济只会进一步引发恶化形势。无论如何，支持法案通过的人依然占据多数，作为意外之喜，负责协调这些项目的联邦机构有望常驻明尼阿波利斯或夏洛特，他们在当地带动的就业岗位增长，将有效削弱旧民主党或社会党的本地影响力。"
 USA.76.a:0 "将联邦机构设在明尼阿波利斯"
 USA.76.b:0 "将联邦机构设在夏洛特"
 USA.77.t:0 "新工业法案"
 USA.77.d:0 "《新工业法案》是道顿计划的分支项目，为关键工业部门提供救济使之出现新的增长——尤其是军工产业将承担复兴计划的主力。其中数家享受福利政策的新公司预计将落户科罗拉多州丹佛，另外一批企业的选址尚未敲定，我们的内阁认为，有必要将它们部署到美利坚至上党或社会党控制下的萧条地区，以此大幅削弱激进组织在当地的影响力。"
 USA.77.a:0 "促进明尼苏达州工业发展"
 USA.77.b:0 "促进爱荷华州工业发展"
 USA.77.c:0 "促进田纳西州工业发展"
 USA.78.t:0 "船坞补贴计划"
 USA.78.d:0 "隶属道顿计划的《船坞补贴法案》使两大船舶企业开始为赢得联邦合同而不断竞争，其中一家坐落于纽约城，另一家位于科珀斯克里斯蒂（德克萨斯南部港市）。无论将合同发给谁，两家公司都能为当地民众创造大量就业岗位，有利于联邦政府恢复地区秩序。遗憾的是，政府合同的事情已经在民间传开了，无论我们选择哪座城市，都可能激怒另一地区的失业者，为美利坚至上党或社会党的煽动性宣传更添一层光彩。"
 USA.78.a:0 "与纽约市签订合同"
 USA.78.b:0 "与科珀斯克里斯蒂签订合同"
 USA.79.t:0 "美国索取战争债务"
 USA.79.d:0 "令加拿大政府惊讶的是，来自[USA.GetNameDef]的特使日前正式要求加拿大官方立即偿还大英帝国在世界大战期间所欠下的战争债务。虽然美国目前深陷经济危机之中，加拿大也还暂时幸免于难，但他们肯定知道我们永远不可能清偿如此巨额的欠款……至少无法立即还清。尽管旧联合王国打算履行赔款，但英国大革命的爆发在双方之间形成了一种默契：不夺回不列颠群岛则无法如数清偿钱款。既然美国人现在提出这些要求，要么是彻底走投无路，要么就是想迎合其政府中颇具攻击性的孤立主义者。"
 USA.79.a:0 "无论是出于什么原因，我们都不可能答应"
 USA.80.t:0 "加拿大拒绝了"
 USA.80.d:0 "加拿大政府断然拒绝我们的要求，表示直到本土收复前自己既没有能力也没有意愿偿付这些债务——因为这些钱都是英国佬借的，不列颠合法政府目前正在加拿大流亡，要不美国政府去找他们讨债吧！尽管如此，他们的强硬态度还是起到了应有的效果，美国政府内部的孤立主义者恨得咬牙切齿，注意力完全转向海外，胡佛总统乘机得到了他所急需的支持，代价是与加拿大的外交关系。"
 USA.80.a:0 "那就这样吧"
 USA.81.t:0 "与美国政府达成和解？"
 USA.81.d:0 "自从美国政府要求偿还战争债务后，加拿大当局与美国的关系开始出现裂痕。最近，华盛顿方面向我们提出和解：只要渥太华方面愿意为他们提供经济援助，签署外交协定增进美国与协约国成员的贸易往来，剩余债务他们可以考虑等我们收复本岛后再做讨论……外交顾问表示这项协议有望成为一种新的开始，我们可以恢复同南方邻国的友好关系，帮助他们。但也有不少人认为，将我国有限的资金投入无底的黑洞是没有意义的，美国已经失败了，不妨先管好我们自己。"
 USA.81.a:0 "我们同意妥协"
 USA.81.b:0 "那是他们自己的事情"
 USA.82.t:0 "加拿大同意妥协"
 USA.82.d:0 "加拿大政府勉强同意与我们达成妥协，将自己目前所能偿还的款项全部交予我们，以此换取将剩余部分的偿付拖延到他们收复故土为止。此外，渥太华方面还另行代表协约国与我方签署贸易协定，此举对双方经济都有利处。尽管如此，联邦政府因这场妥协而被迫直面国内的烦恼，美利坚至上党和社会党认为这项法案的签署是联邦政府“背信弃义”的行为，他们谴责腐败的决策机构背叛了自己刚刚煽动起来的人民。"
 USA.82.a:0 "我们不过竭尽所能"
 USA.83.t:0 "加拿大拒绝妥协"
 USA.83.d:0 "加拿大政府拒绝接受我们慷慨的妥协案，导致双方开始互相实施经济制裁。这场冲突升级为战争的可能性很小，但损失是显而易见的，我们不得不满足于现有的政治成果，以及从惩罚性关税中增加的收入。"
 USA.83.a:0 "这值得一试"
 USA.84.t:0 "罗伊·D·蔡平逝世"
 USA.84.d:0 "美国商务部长罗伊·D·蔡平因急性心脏病发作于今日逝世。作为共和党内部赫伯特·胡佛的亲密盟友，蔡平一直致力于与企业合作，尤其是汽车行业的企业，以消除大萧条的严重影响。副总统查尔斯·柯蒂斯本月早些时候就在白宫心脏病发作，但由于医护人员就在一旁待命，他才得以幸免于难，许多人将这两件事视作一个象征，也是一个字面上的例子，他们认为这说明随着新的政治运动的兴起，旧的政治阶级必然逐渐消失，尽管共和党对这种说法提出了严正抗议。"
 USA.84.a:0 "一场悲剧"
 USA.85.t:0 "国家联合党解散"
 USA.85.d:0 "在许多人看来，美国最近面临的纷争表明了建立联合党派的必要性。虽然还有很多工作要做，但全国大部分政治家都认为，国家已经得到稳定，足以回归常态。执政联盟宣布胜利解散——为共和党和民主党恢复正常竞选活动铺平道路，最终甚至可以在此之上演变出新政治联盟。"
 USA.85.a:0 "上帝保佑美国"
 USA.86.t:0 "阿拉斯加成为美国一州？"
 USA.86.d:0 "阿拉斯加已向国会递交成为[Root.GetNameDef]一州的申请。我们应该接纳阿拉斯加成为权利平等的联邦州，还是让他们继续充当联邦属地？"
 USA.86.a:0 "阿拉斯加应升格为州"
 USA.86.b:0 "阿拉斯加应升格为州"
 USA.86.c:0 "阿拉斯加应升格为州"
 USA.86.e:0 "阿拉斯加只是个属地"
 USA.87.t:0 "夏威夷成为美国一州？"
 USA.87.d:0 "夏威夷已向国会递交成为[Root.GetNameDef]一州的申请。我们应该接纳夏威夷成为权利平等的联邦州，还是让他们继续充当联邦属地？"
 USA.87.a:0 "夏威夷应升格为州"
 USA.87.b:0 "夏威夷应升格为州"
 USA.87.c:0 "夏威夷应升格为州"
 USA.87.e:0 "夏威夷只是个属地"
 USA.88.t:0 "波多黎各成为美国一州？"
 USA.88.d:0 "阿拉斯加与夏威夷都被许可成为联邦州后，波多黎各自由邦的议会代表们日前也向国会发出申请，希望成为[Root.GetNameDef]一州。那么他们应该成为联邦的第五十一个州，还是继续维持自由邦地位呢？"
 USA.88.a:0 "波多黎各应升格为州"
 USA.88.b:0 "波多黎各应升格为州"
 USA.88.c:0 "波多黎各应升格为州"
 USA.88.e:0 "波多黎各只是个属地"
 USA.89.t:0 "顽石坝竣工"
 USA.89.d:0 "“我来，我见，我被征服。今天早晨，就像每个人平生首次见到人类创造的伟大壮举那样，我对此感触颇深。十年前，我们所在的地方还是片荒无人烟、令人生畏的沙漠，湍急而危险的河流在阴森峡谷的底部无尽奔腾，有些峭壁的高度甚至超过一千英尺，峡谷两边的山上既没有公路也没有小道，沿途万分艰险，裸露的岩石缺乏树木与草被的遮拦，无从抵御烈日的烘烤。如今巨石城所在的地方，曾经是片覆盖着仙人掌的荒地，近年来发生在这里的变化堪称二十世纪的奇迹！”——顽石坝竣工后，总统亲临现场，开启他著名的演说，将旁听者们引领入一场引人入胜的，关于创造与奉献的故事中。"
 USA.89.a:0 "……我代表全国人民对你们说：“干得漂亮”"
 USA.90.t:0 "阿梅莉亚·埃尔哈特环球飞行"
 USA.90.d:0 "著名飞行员阿梅莉亚·埃尔哈特，家喻户晓的“航空女王”，与她的领航员佛莱得·努南共同实现了环球飞行。\n\n尽管这对飞行伴侣曾在太平洋豪兰岛附近因空中迷航而陷入短暂的惊惶失措，但飞机并没有发生故障，因此他们继续飞行并于今天早晨同“伊莱克特拉”号洛克·希德双引擎飞机一起降落在加利福尼亚州奥克兰市。\n\n白宫方面预计将在下周为他们的惊世壮举开办欢庆典礼，总统本人也将出席活动，就这一英勇事迹向埃尔哈特本人道贺。"
 USA.90.a:0 "伟大的成绩！"
 USA.91.t:0 "全国有色人种协进会和联邦调查局共同诋毁社会主义者"
 USA.91.d:0 "20世纪30年代，黑人投票热情的冷却，以及“普莱西诉弗格森案”（隔离但平等）导致的非裔美国人参政机会锐减，使全国有色人种协进会开始将大部分活动时间用于支持非裔美国人的权利诉讼。因此，过去十年内，持工团主义立场的“国际劳工保卫联盟”也通过这项事业与有色人种协进会建立合作关系，争取黑人公民的选票。然而，就在最近，全国有色人种协进会领导人沃尔特·弗朗西斯·怀特对社会主义的态度愈发偏向强硬，如果他不愿看到协进会转变为社会主义组织的话，就必须与联邦调查局展开密切合作，组织反社会主义公共关系运动。至于此举究竟是促进民权，还是引发它的进一步衰落，目前还有待我们深入观察。"
 USA.91.a:0 "我不能做出评判"
#海伍德
USA.100.t:0 "海伍德总统的就职演说"
 USA.100.d:0 "美国的社会问题已把人民逼上了绝路，传统的资本主义两党制已趋于瓦解。比尔·海伍德即将正式就任美国第31任总统，杰克·里德将出任副总统。海伍德在华盛顿发表了一场激动人心的就职演说，承诺捍卫工人阶级的利益，为全体美国人民的福祉而努力奋斗，实现更多伟大的社会变革。尽管如此，美利坚社会党在国会的地位并不稳固，希望通过建设性立法更是难上加难，尤其是参议院中的至上党成员，已向选民发表承诺，阻止工团暴徒发布任何有害于美国未来的法案。"
 USA.100.a:0 "让人民欢呼吧！"
 USA.101.t:0 "第7080号行政命令：工会"
 USA.101.d:0 "将集体谈判权写入法律，是比尔·海伍德上台后采取的首要行动。无意坐视参议院对社会立法的阻挠，总统以反动势力与社会党武装部队近期爆发的冲突为借口，强行颁布行政命令要求各州承认工会合法化、为集体谈判权正式立规，将“黄犬契约”（以禁止加入工会为条件订立的劳动合同）定性为非法。各地工会纷纷为这场胜利感到欢欣鼓舞，许多美国民众却将这种滥用总统令的做法视作“行政绑架立法”。"
 USA.101.a:0 "工会使我们强大！"
 USA.102.t:0 "反动派狂怒"
 USA.102.d:0 "从纽约到旧金山，人们纷纷开始借助赫斯特报业与国会演讲，对海伍德当选美国总统提出抗议。朗强烈批评他当选后没有促使极端工会终止罢工和停止扩大赤卫队规模，称海伍德是在积极鼓励极端主义。然而海伍德最大的敌人还是旧民主党和他们的准军事组织。显然，他们对7080号行政命令的执行感到无比愤怒，认为这是对正在摧毁国家的激进工会的鼓励，因此更加激进地抵制美利坚社会党的执政。"
 USA.102.a:0 "让反动派鬼哭狼嚎去吧！"
 USA.103.t:0 "反对派谴责海伍德为暴君"
 USA.103.d:0 "尽管很难在其他议题上达成共识，民主党、旧民主党、共和党和至上党不约而同地从全国各地，向比尔·海伍德颁布7080号行政命令一事表达强烈谴责。将这种做法批判为“行政部门越权”、“国家滑向暴政的起点”。旧民主党人约翰·E·兰金对外宣布自己拒绝遵守“独裁者海伍德”签署的任何法令，并将总统与俄国革命者弗拉基米尔·列宁相类比，幸灾乐祸地认为比尔·海伍德早晚会与列宁有同样的命运。"
 USA.103.a:0 "兰金的事业到此结束了"
 USA.104.t:0 "第7089号行政命令：恢复抵押品赎回权"
 USA.104.d:0 "海伍德总统指示商务部长对部分金融企业资产和运营活动实施临时接管\n\n两大传统政党因无力应对经济大萧条而走向灭亡，如果社会党不能采取积极果断的措施，也必然步他们的后尘。比尔·海伍德相信金融业腐败是大萧条爆发和长期持续，工团主义遭到抹黑和工人需要进一步授权的首要原因，他已下令华尔街银行国有化并公开市场操作，恢复破产家庭的抵押品赎回权。布里克参议员的阻挠，迫使比尔·海伍德将该法案以行政命令形式颁布，诉诸公共利益并声称资本对国会的控制权已经大到难以克服。尽管比尔·海伍德在底层民众和工人阶级的激进阶层中间深受欢迎，许多人担心假若他继续醉心于这种权力，必然将自己引领到独裁者的道路上。"
 USA.104.a:0 "工人们得到了拯救！"
 USA.105.t:0 "标准石油的反击！"
 USA.105.d:0 "加州标准石油公司诉保罗·马提克案，是7100号行政命令面临的首场司法挑战，最高法院日前正式举办该案听证会。全国各地都在关注比尔·海伍德的权力能否得到制约、美利坚社会党是否会不顾参议院的反对继续执行他们的政治议程。"
 USA.105.a:0 "该死的反动派"
 USA.106.t:0 "第7100号行政命令：矿业公司国有化"
 USA.106.d:0 "海伍德总统指示内政部长对部分矿业公司生产设备和运营活动实施临时接管\n\n左翼政党基本上都将政府公地视作公共财产，而矿业公司对公共土地的滥用，长期以来饱受社会主义者的批评。比尔·海伍德的大多数内阁成员都认为，私营矿业公司的贪婪无法与他们对公众需求的回馈相媲美，而他们肯定也将在即将到来的战争中拥护帝国主义势力，因此，他们采取了一箭双雕的行动，将钻井和采矿公司国有化，其中也包括标准石油公司。现在推动国有化政策将被许多人视作比尔·海伍德对政治对手实施“场外反击”的手段，从而更加坚定他们认为比尔·海伍德希望将美国改造为法兰西公社与不列颠联盟那样的工团国家的阶级偏见。"
 USA.106.a:0 "美国的资源属于他的人民！"
 USA.107.t:0 "赤色行政协议"
 USA.107.d:0 "比尔·海伍德与法兰西公社签订了一项行政协议，承诺为他们对抗德国的行动提供军事援助，这引起了国会的愤怒。许多人认为这是权力的滥用，但由于这方面没有任何先例，短期内也没人会对此加以掣肘。社会党的反对者们认为这无异于用纳税人的钱来资助革命，并已经威胁要反对现任政府的统治。"
 USA.107.a:0 "革命是必将到来的"
 USA.107.b:0 "给他们更多物资"
 USA.108.t:0 "钢带设防"
 USA.108.d:0 "在我们准备保护工人阶级免受右翼民兵组织或工贼对我们行动的反击时，钢带也需要大量的投资，革命委员会希望在重要地区建立堡垒，以阻止国会使用武力清除海伍德并拔除钢带。"
 USA.108.a:0 "在城市建设要塞"
 USA.108.b:0 "在边界建设要塞"
 USA.109.t:0 "巴特勒建议转移军备"
 USA.109.d:0 "革命委员会成员，同时也是社会党民兵的总司令：斯梅德利·巴特勒警告我们，国会中那些议员的忠诚度值得怀疑，我们在这里保留这么多武器并不安全，他建议把武器转移到我们的据点，以进一步阻止潜在的破坏。"
 USA.109.a:0 "很好"
 USA.110.t:0 "打击美利坚至上党？"
 USA.110.d:0 "作为我方事业的长期对手，休伊·朗的民兵组织过去曾与我们冲突不断，但他们的主要注意力基本都集中于旧民主党，朗对海伍德政策的态度也比很多人都更为温和，他批评海伍德“非美国式”的反资本主义政策，但也承认，社会党的行动——特别是政策比前政府更为进步。因此，革命委员会对朗的处置方式也较为犹豫，威廉·Z·福斯特和尤金·丹尼斯等强硬激进派想要打击他和至上党，而巴特勒等相对温和的成员则认为我们不应与他对立，而应该把注意力放在建制派和旧民主党上。"
 USA.110.a:0 "同时镇压一分钟人"
 USA.110.b:0 "现在先别管他们"
 USA.111.t:0 "国会的谴责"
 USA.111.d:0 "许多国会议员感受到了革命委员会带来的压力：该委员会正在调查他们与资本家的联系，发动支持社会党的宣传活动，破坏他们的政治基础。他们认为我们最近的军备集结是一个明显的信号，即我们正准备武装激进的工人来控制国家。在海伍德担任总统的短暂时间里，他们终于沉不住气了，几位议员发起了针对海伍德的弹劾，声称他犯下了叛国罪，背叛美国倒向了第三国际，而其他议员显然正在与军方成员联系，寻求他们的支持。"
 USA.111.a:0 "资本终于举起了它的铁拳"
 USA.112.t:0 "反社会党骚乱蔓延"
 USA.112.d:0 "比尔·海伍德企图进行国有化后不久，默里迅速出面呼吁公众采取武装起义之外一切可能的手段，推翻美利坚社会党。全国各地尤其是南方诸州已不再承认总统行政命令的合法性。据报道，“一分钟人”和三K党与社会党民兵间的武装冲突正在日渐升级，如果国家秩序不能得到恢复，美国将注定陷入内战的苦海。"
 USA.112.a:0 "警察应该为人民而战！"
 USA.113.t:0 "旧民主党出走"
 USA.113.d:0 "旧民主党在国会谴责了海伍德反对他们的行为和对旧民主党活动的镇压，拒绝支持社会党，并声称旧民主党现在才是反对工团主义的最后防线。他们拒绝承认“被左派颠覆的联邦政府”，冲出国会，回到了南方诸州，相信自己可以通过其他途径解决这个问题。"
 USA.113.a:0 "让他们滚蛋！"
 USA.114.t:0 "三K党和警察爆发冲突"
 USA.114.d:0 "旧民主党希望公众抵制比尔·海伍德的呼声，已被部分人理解为反抗政府机构任何维持秩序的努力。警方与白人联盟的冲突在全国范围内变得越来越普遍。在社会党势力庞大的城市里，民防委员会开始协助警方恢复法律与治安，而在南方腹地，旧民主党的民兵武装已经在当地建立起了稳固的统治。"
 USA.114.a:0 "谁能来阻止这群疯子！"
 USA.115.t:0 "比尔·海伍德禁止美利坚至上党议员出席国会"
 USA.115.d:0 "在一场激烈的演讲中，总统比尔·海伍德宣布：鉴于美利坚至上党对国家的潜在破坏性，他必须为这项更为紧迫的使命搁置自己的改革计划。休伊·朗的民兵正是街头暴力的元凶，他们无差别地攻击罢工者和无辜的平民。最新颁布的总统令禁止美利坚至上党议员出席国会会议，并指派社会党民兵在必要情况下协助联邦军队维持秩序。尽管政府内部有不少官员对总统向“一分钟人”采取行动感到宽慰，许多议员们却为比尔·海伍德动用行政权力的尺度感到无比震惊。"
 USA.115.a:0 "为了美国的利益，我们必须这样做"
 USA.116.t:0 "第7061号行政命令：宣布美利坚至上党为恐怖组织"
 USA.116.d:0 "比尔·海伍德援引人民对美利坚至上党及其民兵武装“无政府主义本质”的担忧，宣布将该党列为非法政治团体，要求采取一切可能手段取缔他们的活动，以免该党发动起义推翻政府。此外，总统还将“一分钟人”与发动1916年预备日袭击和1920年华尔街炸弹危机的恐怖分子联系在一起，希望按照1918年《惩治叛乱法》，以“反治安反募兵组织”的性质对其提请公诉。"
 USA.116.a:0 "太好了！"
 USA.117.t:0 "休伊·朗公然蔑视总统令"
 USA.117.d:0 "休伊·朗公开谴责海伍德的行政命令违宪，宣称此举是彻底的政治迫害，总统的目的是打压异见人士为工团主义改革铺平道路。在休伊·朗组织的大规模抗议集会上，“一分钟人”也出席其中保护示威者免遭侵害。工会罢工者遭到民兵武装的殴打，到场的警方对此宁愿袖手旁观。新闻媒体对相关情况进行集中报道，越来越多的民众对海伍德是否真的有能力保护美国人民，感到愈发难以信任。"
 USA.117.a:0 "依靠警察控制局面"
 USA.118.t:0 "警察部队拒绝服从海伍德"
 USA.118.d:0 "真是出人意料的情况，警察部门开始拒绝履行联邦政府的命令。亚特兰大、新奥尔良、休斯敦及其他美国南方城市，当地警方也开始举办“罢工”运动，声援美利坚至上党的抗议风潮。各地警察工会领导人日前宣布，他们将恪尽职守维护社会治安，而“暴君海伍德”的命令，不妨让他自己来办。有鉴于此，总统阁下决定寻求联邦军队的帮助。"
 USA.118.a:0 "派个大家伙去会会他们"
 USA.149.t:0 "麦克阿瑟进军华盛顿"
 USA.149.d:0 "比尔·海伍德在华盛顿特区的支持已跌至谷底。今天，麦克阿瑟率军挺进白宫，计划逮捕总统和他的内阁部长。麦克阿瑟此举让不少人想起这位将军在1932年镇压科克西失业请愿军时所下的毒手，不过这次，当这批人为维持现状而团结起来时，华盛顿市民无不向他们致以热烈的掌声。遗憾的是，得到麦克阿瑟司令部的线人密报后，比尔·海伍德比叛乱先行一步逃往芝加哥。于是，麦克阿瑟选择入住白宫协调对比尔·海伍德的违宪调查。一场内战正迫在眉睫。"
 USA.149.a:0 "忠于共和国，但更忠于民主！"
#休伊·朗事件
USA.150.t:0 "休伊·朗的就职演说"
 USA.150.d:0 "美国的社会问题已把人民逼上了绝路，传统的资本主义两党制已趋于瓦解。休伊·朗即将正式就任美国第31任总统，被进步党抬入国会的威廉·莱姆克将出任副总统。朗在华盛顿发表了一场激动人心的就职演说，承诺捍卫人民的利益，将普通美国人的需求置于任何事务之上。尽管如此，至上党联盟在国会的地位也并不稳固，想要通过建设性立法更是难上加难，尤其是基本由旧民主党、共和党、民主党和社会党组成的参议院，已向选民承诺会阻止民粹分子发布任何有害于美国未来的法案。"
 USA.150.a:0 "上帝保佑美国"
 USA.151.t:0 "第7037号行政命令：农业援助法案"
 USA.151.d:0 "为美国农民提供政策救济，是休伊·朗竞选总统时最重要的政治口号之一，因此他将行政命令直接发布给商务部长。无意坐视参议院对救济政策的阻挠，休伊·朗援引美国社会治安不稳为由，将行政命令直接发布给商务部长付诸实践。该法案主张控制农产品价格、向农民提供政府信贷，对外来粮食谷物加征关税。这将有助于缓解粮食价格暴跌给农民带来的破产危机。全国各地的农民纷纷为这场胜利而欢欣鼓舞时，美国的主流政党却将这种滥用总统令的做法视作“行政绑架立法”以及企图攫取旧民主党支持基础的行为。"
 USA.151.a:0 "批准"
 USA.152.t:0 "召集内阁"
 USA.152.d:0 "休伊·朗打算兑现诺言，建立一个跨党派执政联盟，这将使他在“美国财富分享”计划中占据主导地位，并获得足够的国会支持以通过至上党的议程。但是试图任命从“温和”的社会主义者到保守派民主党人再到内阁的每个人目前都遇到了问题，有些人断然拒绝加入，一些左翼人士对将赫伯特·胡佛任命为商务部长的想法感到大失所望，而右翼人士则对担任战争部长的斯梅德利·巴特勒毫不感冒。当然，查尔斯·库格林要求我们加强对至上党的任命，并且只吸纳其他愿意接受任命的政党。如果我们不采纳他的建议，很明显，我们将不得不偏向一方以使他们同意。"
 USA.152.a:0 "只得倾向更为保守的候选人"
 USA.152.b:0 "我们只需要至上党"
 USA.152.c:0 "倾向左翼候选人"
 USA.153.t:0 "金融大亨拒绝了“财富共享计划”！"
 USA.153.d:0 "朗公开表示，他曾希望能说服摩根银行家族、洛克菲勒等金融精英支持“财富共享计划”，他把他们拉到谈判桌前，告诉了他们这是防止国家崩溃的最后防线，只要他们能够接受大规模财富再分配，朗就会允许他们成为管理者。然而不出所料，精英们一个又一个地拒绝了他的提议，洛克菲勒甚至称他为“傻瓜”。虽然一些相对“小资”的百万富翁似乎对这个计划持开放态度，但很明显，巨头们并不接受财富分配，这使得（或许只是允许）朗展开了针对他们的“攻势”，谴责他们缺乏爱国主义精神。"
 USA.153.a:0 "他们竟敢这么干？！"
 USA.154.t:0 "取缔垄断！"
 USA.154.d:0 "朗已下令美国司法部反垄断部门调查所有拒绝“财富共享计划”的势力，并签署了一项行政令，扩大了托拉斯的定义。这套组合拳引发了国会对专制主义的强烈抗议，而朗则通过反过来指责国会中反对他的议员为大企业的工具来回应这些指控。因此，他在普通民众中的支持率大幅上升，但华盛顿显然仍持反对态度，称其违宪，是对他权力的过分延伸，而更激进的反对者则承诺使用他们的民兵组织来保护自己免受朗的威胁。"
 USA.154.a:0 "理所应当！"
 USA.154.b:0 "加大力度！"
 USA.155.t:0 "朗的总统令！"
 USA.155.d:0 "朗宣布，同金融精英对话或恐吓他们的行为均宣告失败，并因此颁布了行政令，将对拥有五千万美元以上财富的人实施一次性征税，他宣称这些自私自利的商人的资本数额太过疯狂且不负责任，是对共和国的威胁，使得国会无法通过任何立法。国会对此自然是一片哗然，部分议员谴责这是至上党一系列自私自利法案中的最新一项，不过无党派的民众似乎更为支持朗。目前还不知道这样做有何种后果，但军方中的一部分人已开始与国会议员商量，准备对总统采取行动。"
 USA.155.a:0 "这是唯一的方法！"
 USA.156.t:0 "库格林银行法案引发争议"
 USA.156.d:0 "库格林银行法案在国会引发了一场大规模的争吵，旧民主党激烈反对银行法案里建立中央银行的提议，除进步党和部分社会党之外的大多数政党也不能接受法案要求的对私有制银行进行国有化，只允许他们自行管理。随着辩论的拖延，越来越多的政客指责朗正试图不择手段推行这项政策，并希望建立一个集权专制的政府，至上党的反对者认为，通过这项法案意味着将把国家交给至上党，尽管朗坚称银行董事将由民主选举产生，而非至上党任命。然而值得庆幸的是，许多美国民众，特别是至上党地盘上的人民，都支持这项计划，并认为这恰恰证明了朗是美国人民的代表。"
 USA.156.a:0 "民众的智慧！"
 USA.157.t:0 "飞速壮大的至上党政治机器"
 USA.157.d:0 "朗已经决定要用他所知的最可靠的方式来促使银行法案通过：那就是以华盛顿为对手，来一场政治游戏。朗以白宫讲坛为平台谴责国会腐败到了骨子里，直接公布那些腐败参议员的名字（这让他们惊怒万分），报道贿赂政客的新闻也随之越来越多，他收集能要挟参议员的黑料，要求取消在政敌地盘上进行的选举，还宣布一分钟人将得到联邦政府的支持，因为他们是“民主的捍卫者”。"
 USA.157.a:0 "财富共享是唯一的护国之道！"
 USA.158.t:0 "旧民主党撤回南方"            
 USA.158.d:0 "旧民主党竭尽所能对抗日益强大并削弱他们势力的朗的政治机器，西奥多·比尔博宣布他们打算用任何必要的手段来捍卫他们的代表权。全国白人联盟的成员对自己地盘上的一分钟人发起攻击，旧民主党则抗拒了所有试图取消他们地盘上的选举的企图。当然，他们持续反对银行计划的行为增加了朗的受欢迎度，还消减了他们自己的支持度。"
 USA.158.a:0 "混账东西！"
 USA.159.t:0 "朗发起大规模调查！"
 USA.159.d:0 "朗表示，那些反对他的计划的银行家们很明显是被触犯了利益，他还表示，他将对这群银行家“缺乏美国精神”的腐败行为进行法律彻查。朗把标准石油公司称之为金融巨头，并声称他将逮捕任何与约翰·D·洛克菲勒有腐败交易的国会议员，并由一个民间陪审团审判。同时，对于与金融集团与实业家们有所勾连的议员们，朗也对公众表示将“即刻开启全面清查”。而对于向来与至上党作对的社会党与旧民主党成员们，朗则直接命令FBI开始搜集证据并拘捕部分成员。很明显，对于新上任的休伊·朗总统来说，现在已经到了全面清查政府黑暗与腐败的时刻了。"
 USA.159.a:0 "我将为保卫国家利益而战！"
 USA.160.t:0 "朗要求保持秩序！"
 USA.160.d:0 "休伊·朗援引人民对美利坚社会党崇尚无政府工团主义的担忧以及工人罢工导致的持续经济萧条，宣布他打算在必要时用武力恢复钢带的秩序。他要求解散赤卫队，这样政府就可以在不受激进工团主义影响的情况下，与工会谈判一项可接受的薪酬协议。自然，社会党对此非常愤怒，认为这进一步证明了朗不过是一个反动的作秀者。与此同时，朗派驻钢带区的第一批官员已经有一部分被愤怒的工人示威者与赤卫队驱逐，甚至还有一名政府部门主管死在了街上的交火中。朗总统对此已经无比愤怒，并调拨了一分钟人准备进驻钢带区。"
 USA.160.a:0 "这是唯一的办法！"
 USA.161.t:0 "社会党阻挠国会！"
 USA.161.d:0 "社会党公开宣布，他们会通过一切可用手段反对朗对激进工团主义的压迫，首先是在国会不停地阻挠朗的议案，以确保在他同意撤回部队之前，一切立法都得不到通过。其次，在报刊上谴责他是暴君和帝国主义资本家。很明显，收到的压制确实刺痛了他们。"
 USA.161.a:0 "无可奈何"
 USA.162.t:0 "赤卫队在钢带堆砌街垒"
 USA.162.d:0 "赤卫队以及支持他们的州长派出的国民警卫队，已经开始在底特律、芝加哥和费城等城市的街道上设置路障，这是为了，用社会党领导人海伍德的话来说，“保护工人阶级免受伪民粹主义，实反动资本主义的伤害”。对此，我们派出了一分钟人和效忠我们的国民警卫队联手夺回城市，但是军方对朗没有征求他们的意见就强行推动袭击计划感到不安，旧民主党也利用这个机会对社会党大放厥词，并尝试建立起不结盟任何一方，他们自己的队伍，似乎好整以待我们和社会党两败俱伤。\n\n当我们派去五大湖钢带区实行驱逐赤匪的行动的一分钟人到达目标地区后发现，政府的权威已经在这里近乎瓦解。在他们发回华盛顿的电报中，指挥官们无奈而沮丧的陈述：“钢带区已经事实上脱离了联邦。”而在数次交火中，一分钟人并未占到上风，反而在一些大城市狼狈败退。而我们在钢带区的受挫必然已经让其他反对派看到了机会，接下来的社会秩序与整治情况毫无疑问将会继续恶化。"
 USA.162.a:0 "无可奈何"
 USA.163.t:0 "全国白人联盟宣布朗是叛徒！"
 USA.163.d:0 "全国民主白人联盟强烈抨击了朗针对白人联盟和全国三K党发表的声明，他们对为争取重叠的选民基础而展开的暴力竞争，以及对朗的政策和联盟的愤怒最终达到了顶点。海勒姆·韦斯利·埃文斯指责朗是名副其实的工团主义者、煽动家，还称其为国家事业的叛徒，白人联盟的领导人已在各州转入地下进行活动。然而毫无疑问，他们正在遭受打击。"
 USA.163.a:0 "把我们能找到最大的家伙送过去！"
 USA.164.t:0 "一分钟人与旧民主党交火"
 USA.164.d:0 "当一分钟人越过梅森-迪克森线，深入南方履行总统命令时，立即就遭到了旧民主党成员及其支持者的强烈抵抗，他们已经发动了一场暴力叛乱活动。枪战很快就变得司空见惯，而暴力事件也迅速蔓延至三K党控制的深南部和北方部分地区的几乎所有主要城市。很明显，联邦政府根本无力控制南部和中东部分地区。"
 USA.164.a:0 "把我们能找到最大的家伙送过去！"
 USA.165.t:0 "休伊·朗禁止社会党议员出席国会"
 USA.165.d:0 "在一场激烈的演讲中，总统休伊·朗宣布：鉴于美利坚社会党对国家的潜在破坏性，他必须为这项更为紧迫的使命搁置自己的改革计划。持续进行中的新年大罢工正是社会党暴徒所为，他们存在的目的就是成为美国的头号公敌。最新颁布的总统令禁止美利坚社会党议员出席国会会议，并委托“一分钟人”民兵武装担当这道紧急法案的执行者。尽管政府内部有不少官员对总统向社会党采取行动感到宽慰，许多议员们却为休伊·朗动用行政权力的尺度感到无比震惊。"
 USA.165.a:0 "必须如此"
 USA.199.t:0 "麦克阿瑟和军方决定铲除休伊·朗"
 USA.199.d:0 "休伊·朗在华盛顿特区的支持已跌至谷底。今天，麦克阿瑟率军挺进白宫，计划逮捕总统和他的内阁部长。麦克阿瑟此举让不少人想起这位将军在1932年镇压科克西失业请愿军时所下的毒手，不过这次，当这批人为维持现状而团结起来时，华盛顿市民无不向他们致以热烈的掌声。遗憾的是，得到麦克阿瑟司令部的线人密报后，休伊·朗比叛乱先行一步逃往新奥尔良。于是，麦克阿瑟选择入住白宫协调对前总统的违宪调查。一场内战正迫在眉睫。"
 USA.199.a:0 "忠于共和国，但更忠于民主！"
#默里事件
USA.200.t:0 "默里的就职演说"
 USA.200.d:0 "美国的社会问题已把人民逼上了绝路，传统的资本主义两党制已趋于瓦解。威廉·H·默里即将正式就任美国第31任总统，被民主党保守派和共和党右翼“边缘派”抬入国会的约翰·E·兰金将出任副总统。默里在华盛顿发表了一场激动人心的就职演说，承诺捍卫美国人民的利益，消灭那些威胁美国人民的不法之徒。这自然激怒了社会党，而旧民主党在国会的地位也并不稳固，希望通过建设性立法更是难上加难，尤其是基本由共和党、民主党、进步党，当然还有社会党组成的参议院，已向选民承诺会阻止极端民粹分子发布任何有害于美国未来的法案。"
 USA.200.a:0 "上帝保佑美国"
 USA.201.t:0 "海伍德和朗加强民兵力量！"
 USA.201.d:0 "作为对默里就职的回应，比尔·海伍德和休伊·朗都加强了各自民兵的力量，撕下了最后一层伪装（即这些民兵组织和他们没有关系）。朗谴责默里是对民主的威胁，要求他远离至上党的势力范围，而海伍德甚至表明未来必然发生冲突。"
 USA.201.a:0 "叛匪！"
 USA.202.t:0 "来自银行家的抵制！"
 USA.202.d:0 "建制派反对我们拆分大银行并让旧民主党地区的银行由各州控制的法案，很明显，我们无法通过国会推行我们所希望的立法，将不得不使用行政令。不过有利的一面是，默里的反银行活动增加了他在普通民众中的支持率。"
 USA.202.a:0 "蠢货"
 USA.203.t:0 "严惩腐败"
 USA.203.d:0 "很明显，银行家和他们的说客们在华盛顿有很大的影响力，他们常常为自己的口袋而不是人民的利益工作。因此默里宣布，他将彻查每一个反对旧民主党的腐败分子，找出他们犯下的罪行，并在任何可能的情况下起诉他们。当然，这一声明在其他政党中掀起了一股“仇恨风暴”，但这将削弱腐败的建制派。"
 USA.203.a:0 "很好！"
 USA.204.t:0 "调查洛克菲勒！"
 USA.204.d:0 "石油大亨约翰·D·洛克菲勒长期与共和党结为政治同盟，利欲熏心。现在他需要为将利益置于国家兄弟情谊之上而付出代价。兰金和福特的雇员已经发现了他操纵价格和打压对手的证据。尽管他的律师提出了异议，但现在是时候宣布对他和所有与他有关的国会议员进行审判了。"
 USA.204.a:0 "很好！"
 USA.205.t:0 "史密斯法案受阻！"
 USA.205.d:0 "史密斯法案将让美国终止接收非白人和非新教徒移民，同时在北方重新引入各种形式的种族隔离，包括禁止白人与犹太人和有四分之一以上黑人血统的人通婚。然而该法案几乎没有机会在国会通过，因为基本上只有旧民主党国会议员和少数脱离其他党派的人愿意投票支持它。因此，我们需要通过行政令强行通过该法案。"
 USA.205.a:0 "他们在强迫我们动手！"
 USA.206.t:0 "国会抗议！"
 USA.206.d:0 "国会公开抗议我们最近的政策，指责默里是一个极端主义煽动者。至上党和社会党已经动员民兵起来反对我们，建制派似乎正在与军方进行谈判，以限制默里。虽然我方政策让我们在那些倾向于旧民主党的人中更受欢迎，但我们似乎在短时间内就得被迫下台。"
 USA.206.a:0 "叛徒！"
 USA.207.t:0 "第7055号行政命令：金融管理法"
 USA.207.d:0 "在默里总统与旧民主党看来，如今美国的衰弱现实有着诸多原因，而其中危害最大的就是贪婪无度的金融投机客与资本巨头们。为了一劳永逸的根除金融家与银行家对美利坚经济的侵蚀，默里总统直接向财政部长提出了金融管理法案。该法案主张彻底拆分美国国内的几家银行业巨头，同时将其拆分出的子集团与分行交由各地的州政府自行管理，以求一步步的瓦解旧的金融秩序。毫无疑问，这将激起国会与建制派的强烈反对，但美国百姓将会对此欢呼雀跃。总统与旧民主党成员已经将这项法案视作未来四年成功的开端，并加紧筹划更多构建新的南方秩序的法案。"
 USA.207.a:0 "伟大胜利！"
 USA.208.t:0 "打击朗"
 USA.208.d:0 "休伊·朗的一分钟人在最近几天遭到了越来越多的攻击，旧民主党也在不断谴责与他们结盟的国会议员。我方占领中西部的尝试招致了至上党的愤怒，并导致他们的游击队反过来袭击旧民主党的武装组织，我们也因此成功地清除了深南部的“财富共享社会”。社会党一直在拒绝我们派兵进入钢带区攻击至上党的要求：出于怀疑，他们认为我们在假途灭虢。朗本人已经离开国会前往路易斯安那州，而国会也已经极度不满，一些议员认为默里正利用联邦军队清除异己，以增强旧民主党的实力——没准下一个目标就是他们。"
 USA.208.a:0 "这应该能给他一个教训"
 USA.209.t:0 "打击海伍德"
 USA.209.d:0 "我们在钢带区对赤卫队的打击在旧民主党中反响热烈，而民主党人对此反应各异，当然，社会党极度反感我方的行动，认为我们的下一个目标就是他们自己，这个猜测基本正确，我们要让他们为伤害美国付出代价。虽然社会党在钢带区受到了压制，但他们仍在筹划反击——尽管我们已经铲除了东南地区的顽固分子，赤卫队却开始使用游击战战术。不过大多数建制派国会议员认为我们的一系列行动基本是不负责任的危险行为，他们中普遍存在着一种阴谋论，认为默里只是在利用他们的力量清除异己，随后极有可能调转枪口，对他们发难。"
 USA.209.a:0 "我们将快速击溃海伍德"
 USA.210.t:0 "第7090号行政命令：宣布美利坚社会党为恐怖组织"
 USA.210.d:0 "在对国会的讲话中，默里总统对国会乃至全国表示，联邦政府出于“对无政府主义向社会造成的巨大危害与对外国势力干涉美国政坛的担心”，宣布将美利坚社会党列为非法政治团体，要求采取一切可能手段取缔他们的活动，以免该党发动起义推翻政府或引导外国间谍颠覆政府。此外，总统还将赤卫队与发动1916年预备日袭击和1920年华尔街炸弹危机的恐怖分子联系在一起，希望按照1918年《惩治叛乱法》，以“反治安反募兵组织”的性质对社会党所有领导者提请公诉。"
 USA.210.a:0 "太好了！"
 USA.211.t:0 "默里发起大规模调查！"
 USA.211.d:0 "在向白宫的幕僚们征求了意见后，默里总统下定决心向国会内的不服从旧民主党的司法系统，财政机关乃至军队发起一场“保证政府内部稳定”的大规模调查。该调查意在彻底查清政府中阴谋颠覆旧民主党统治与总统的破坏分子，同时确保总统不会受到来自最高法院的掣肘，以进行他与旧民主党的改革计划。而对于军队，默里总统尝试拉拢野心勃勃的麦克阿瑟，但总参谋长并未对此做出任何回应，而大规模调查也开始在军队内部进行，大量的中低级军官遭到波及。"
 USA.211.a:0 "这是为保卫国家利益而战！"
 USA.212.t:0 "威廉·默里禁止美利坚至上党议员出席国会"
 USA.212.d:0 "在一场激烈的演讲中，总统威廉·默里宣布：鉴于美利坚至上党对国家的潜在破坏性，他必须为这项更为紧迫的使命搁置自己的改革计划。休伊·朗的民兵正是街头暴力的元凶，他们无差别地攻击罢工者和无辜的平民。最新颁布的总统令禁止美利坚至上党议员出席国会会议，并指派国民警卫队在必要情况下协助联邦军队维持秩序。尽管政府内部有不少官员对总统向“一分钟人”采取行动感到宽慰，许多议员们却为威廉·默里动用行政权力的尺度感到无比震惊。"
 USA.212.a:0 "为了美国的利益，我们必须这样做"
 USA.213.t:0 "休伊·朗公然蔑视总统令"
 USA.213.d:0 "休伊·朗公开谴责威廉·默里的行政命令违宪，宣称此举是彻底的政治迫害，总统的目的是打压异见人士为民族主义改革与独裁铺平道路。在休伊·朗组织的大规模抗议集会上，“一分钟人”也出席其中保护示威者免遭侵害。旧民主党成员与支持默里总统的市民遭到民兵武装的殴打，到场的警方对此宁愿袖手旁观。新闻媒体对相关情况进行集中报道，越来越多的民众对威廉·默里是否真的有能力保护美国人民，感到愈发难以信任。"
 USA.213.a:0 "依靠警察控制局面"
 USA.249.t:0 "麦克阿瑟逼走默里"
 USA.249.d:0 "威廉·H·默里的执政时间到头了，在得知了麦克阿瑟计划对他进行政变后，他已逃往旧民主党控制的佐治亚州。麦克阿瑟已经宣布，默里和其他所有威胁美国的激进分子都必须下台，恢复普通的民主政治，并要求所有民兵组织立即解散，接受宪法的约束。"
 USA.249.a:0 "我们别无他法"
#麦克阿瑟总统
USA.250.t:0 "麦克阿瑟宣布提前就职"
 USA.250.d:0 "由于1936年的总统选举陷入僵局，而国会议员们迫于军方与激进党派的压力开始支持麦克阿瑟接任临时总统以稳定时局。最终在下属与同僚的劝说下，胡佛选择任命麦克阿瑟担任临时总统。出人意料的是，麦克阿瑟并没有按照惯例在下一年的一月份宣布就职，而是在胡佛宣布他为总统的第三天后就站到了公众面前。在他的就职典礼上，麦克阿瑟总统宣布他将“以强硬的手腕与立场维护美利坚的民主”，并保证“它将不会受到激进势力与国贼们的威胁”。\n\n此外，在就职典礼后，据可靠消息全美国各地的军队都开始陆续收到调令，但民众与媒体无法得知他们的具体目的地。作为对一位军人总统上台的抗议与回击，包括美利坚社会党与美利坚至上党在内的数个激进党派与准军事组织加大了动员力度与抗议示威作为回应。截至目前，美利坚社会仍然在持续撕裂。"
 USA.250.a:0 "现在是时候收拾时局了"
 USA.251.t:0 "第7061号行政命令：国家与社会治安法"
 USA.251.d:0 "在麦克阿瑟担任总统后，为了尽快恢复秩序，镇压各地的抗议浪潮，总统与他的幕僚们向国会提交了国家与社会治安法。该法案的主要内容是授权军方在“必要情况下”接管地方治安权甚至接管州政府的权力，以“防止激进党派、罢工组织与潜在叛乱势力”破坏国家安全。根据总统令，陆军部与各州国民警卫队将拥有临时司法权限，可在未获法庭批准的情况下拘押涉嫌“危害国家秩序”的个人或团体。\n\n这份激进的管制法案在国会激起了轩然大波，绝大多数国会议员对此表示反对，而少部分支持麦克阿瑟上台的参议员也对此表示了担忧。但最终在军方与激进党派所带来的双重压力下，法案还是艰难的通过了。麦克阿瑟与军方对国会做出妥协，同意军方只有在“州政府已无力稳定各州局势且激进分子与民兵将有颠覆政府风险”时才可以接管政府。休伊·朗与“大比尔”·海伍德都对此极度愤怒，声称华盛顿“已经沦为了暴君的个人宫廷”。"
 USA.251.a:0 "稳定高于一切，包括自由"
 USA.252.t:0 "全国戒严令"
 USA.252.d:0 "随着国内政治混乱持续与社会局势的恶化，白宫于今晨发布了一项全国性命令：美利坚合众国全境进入紧急状态并颁布戒严令，军队进入紧急警戒状态。该命令由总统道格拉斯·麦克阿瑟签署，绕过国会经陆军部与参谋长联席会议共同批准执行。根据命令内容，包括五大湖地区，南部诸州与大平原地区在内的数个社会矛盾最为激烈的地区被重点关注并实行戒严。包括国民警卫队在内的大量武装力量被派驻，在芝加哥地区军方甚至投入了一整个团来镇压正在武装抗议的赤卫队。截至目前，芝加哥，巴吞鲁日，亚特兰大，底特律与里士满等大城市的武装对峙仍在持续。"
 USA.252.a:0 "这会持续激化矛盾的..."
 USA.253.t:0 "镇压一分钟人"
 USA.253.d:0 "在麦克阿瑟总统宣布就职后，南方地区率先爆发了严重的社会动荡。其中路易斯安那州州长休伊·朗与美利坚至上党被证明是南方的一系列混乱的最主要推手。朗在新奥尔良电台发表的演说中号召各州农民、退伍军人与工人“拿起武器，走上街头，让华盛顿乃至美国恢复民主与尊严”。大量的一分钟人民兵在街头与巷尾与军队做对抗，甚至两节运输物资的军用专列在进入路易斯安那州时遭到了袭击。作为回应，麦克阿瑟与军方迅速逮捕了国会中明里暗里支持至上党的议员们，并宣布将向大平原地带加派军力以彻底镇压一分钟人。此外，根据报道，朗在前日在路易斯安那参加游行示威活动时遭到了刺客的袭击，而华盛顿对此并未回应。休伊·朗很快对公众发布演讲，称这是“可耻的暴君的政治刺杀”。"
 USA.253.a:0 "继续加大军人投入"
 USA.254.t:0 "涤荡钢带"
 USA.254.d:0 "作为联邦政府一直以来的最大反对者，美利坚社会党在海伍德的带领下几乎已经完全掌控的五大湖地区。在这里警察与国民警卫队难以起到任何作用，州政府的权威近乎荡然无存。为了掌控这片工业重心，麦克阿瑟总统宣布将重点打击社会党与赤卫队。几大工业城市都爆发了赤卫队与军队的激烈交火，然而钢带区的情况并未有过于乐观的好转。尽管社会党的势力遭到了削弱，但政府与军方损失也称得上惨痛。由于美军仍然在恢复动员，因此在短期内联邦政府也难以进一步肃清社会党。"
 USA.254.a:0 "该死！"
 USA.255.t:0 "管制南方"
 USA.255.d:0 "以前俄克拉荷马州州长威廉·“苜蓿比尔”·默里为首的旧民主党长期在南方地区保持着庞大的组织网络，而作为他们合作对象的3k党与黑色军团更是常年纵横美国南方社会。根据联邦调查局的调查，默里和旧民主党正在与一部分国会议员和极端民族主义的军人接触以颠覆政权。作为回应，麦克阿瑟直接逮捕了有嫌疑的国会议员，同时发动各州政府扫荡各地的3k党。尽管南方的数个州对此毫无反应，但在北方地区一系列的3k党成员被逮捕，旧民主党势力也遭到了一定程度的削弱。"
 USA.255.a:0 "加大力度！"
 USA.256.t:0 "1932惨案重演"
 USA.256.d:0 "伴随着政治混乱的风波，美利坚被黑色星期一摧垮的经济也难以为继。大量的失业者走上街头，向着联邦政府祈求着本应属于他们的救济。在华盛顿，大量无家可归的破产者与平民蜗居在波托马克河畔的简易营地与破屋中。为了向新政府施压，在数名社会党成员引导与引领下，这些绝望的贫民高举旗帜，呼喊口号，冲向了华盛顿街头。部分激进分子占据了国会广场，甚至与警察爆发冲突。这不禁让人联想起1932年的那场军事抗议事件。\n\n很快，在意料之中的是，正如4年前一样，麦克阿瑟无视了一切严重后果，直接命令军队冲击游行人群。伴随着骑兵与装甲车开道，曾经庞大的游行人群在尖叫，恐惧与流血中四散而去，留下了被逮捕的社会党人与一地尸体。夜晚，帐篷区被纵火焚毁，烟雾与哭喊回荡在夜空中。燃烧的棚户区很快占据了全美各大报纸的头版，激进党派更是将其作为攻击新总统的绝佳武器。"
 USA.256.a:0 "唯有履带与铁腕"
 USA.257.t:0 "国会议员正在密谋"
 USA.257.d:0 "有鉴于麦克阿瑟的独裁倾向愈发明显，以及总统的行事大多数时候都倾向于无视国会或向国会施压以强迫施行他的法令，大多数原本对于麦克阿瑟抱有希望的众议员们纷纷开始准备背离这位僭主。一部分议员开始与军队中的亲民主派接触，试图密谋推翻麦克阿瑟的独裁统治。至于更加对现状失望的人，则大多离开华盛顿或是直接与激进党派开始私下勾兑。"
 USA.257.a:0 "局势不妙..."
 USA.258.t:0 "国会议员出走"
 USA.258.d.haywood:0 "在总统进行了一系列的行政措施后，国会中的大量议员已经对政府失去了足够的信心与耐心。在海伍德总统再一次发出对不合作的企业的调查令与搜捕令后，国会山中反对海伍德总统的声音达到了顶峰。作为回应，议员们停止了对一切出自白宫的政令的讨论与批准，而海伍德则直接绕过政府机关，指挥听命于社会党的政府成员与赤卫队来维持政府运转。最终，大量的议员对政府彻底失望，开始纷纷辞职，甚至一部分人已经开始撤离到新英格兰或是西海岸地区。如今的国会已经事实上的彻底停摆了。"
 USA.258.d.mac:0 "麦克阿瑟入主白宫并没有为国会山带来人们曾经期待的安宁。恰恰相反，随着总统不断以国家紧急状态为由扩大行政权力，国会与白宫之间原本已经濒临崩溃的关系终于彻底断裂。麦克阿瑟坚持认为联邦政府已经没有时间等待无休止的委员会听证和党派讨价还价；越来越多的行政命令因此直接绕开国会，由总统、陆军部以及仍然服从华盛顿的联邦机关负责执行。国会议员们则把这种做法视为对共和国政治传统赤裸裸的践踏。几名议员首先以安全为由离开华盛顿，紧接着越来越多人宣布辞职、返回自己的州，或直接前往仍然被认为相对安全的新英格兰与太平洋沿岸。一些人声称自己只是暂时撤离首都，另一些人却已经公开表示，他们不再承认一个依靠军令运转的华盛顿能够代表真正的联邦政府。从法律上说，美利坚合众国国会仍然存在。从现实来看，它已经几乎无法履行任何职能。"
 USA.258.a:0 "全都是叛徒！"
 USA.259.t:0 "圣路易斯静悄悄"
 USA.259.d:0 "在圣路易斯的大街上，混乱如同它在过去数月内一样常见。罢工的工人与工会领袖高举着横幅，牌子与旗帜走上街头，向着新组建的联邦新一届政府诉说他们的愤怒。在三个街区外的广场上，头戴白面罩的3k党成员正在市中心组织集会，大量的点着火焰的十字架被立在街头，同时种族主义者们对他们视野所及的每一个少数族裔市民挥舞着武器。暴徒已经围住了圣路易斯市政厅，愤怒的人群们在极端分子的煽动下向着政府发泄着他们所有的愤怒。但这一切也都将结束了。\n\n正午时分，大量的运输机飞过城市上空，随之而来的是响彻全城的震耳欲聋的装甲车的轰鸣声。街道两旁的行人被蜂拥而至的联邦士兵不分青红皂白的攻击，而所有试图抵抗的工人抗议者或民兵则被无情的射杀。在一处路口，罢工者与赤卫队架起了街垒严阵以待，但城中的军队以数发从天而降的迫击炮弹与坦克的火炮作答。随着时间的推移，整座城市的街道上除了军队，就是数不清的废墟与尸体。黄昏时分，整座城市都遭到了戒严，军队在总统的命令下直接控制了市政厅，而城市中所有的反对派团体都被扫荡一空。一切的混乱都停息了。"
 USA.259.a:0 "而这样的场景在美国各地不断上演"
 USA.260.t:0 "直到大厦崩塌"
 USA.260.d:0 "麦克阿瑟宣誓就任总统时，许多人仍相信，一位拥有军队威望、能够超越党派争执的将军或许真的能够迫使这个几近失控的共和国重新安静下来。然而过去几周所发生的一切，却越来越像是在证明相反的事情。来自各州的报告正在以惊人的速度恶化：地方政府拒绝执行联邦命令，州警察与民兵开始自行封锁道路。诸多证据表明，地方势力正在不断切割与华盛顿的联系。更令人不安的是，昨日，华盛顿逐渐开始失去了解这个国家究竟发生了什么的能力。部分电话线路与电报局设备遭到破坏，而钢带区几个州的联邦官员已经连续数日没有发回报告。总统身边的顾问们仍在讨论最后的补救办法，但一切都毫无用处。各地传来的消息越来越少，而那些真正抵达白宫办公桌上的报告，内容也越来越令人绝望。很快，一场撕裂全国的大风暴就将真正降临了。"
 USA.260.a:0 "山雨欲来..."
#诺里斯1936
USA.300.t:0 "诺里斯的就职典礼"
 USA.300.d:0 "在昆汀·罗斯福的支持下，乔治·诺里斯正式就任美国总统，宣布他将领导政府重新团结美国人民，使他们度过黑暗时期，并通过谈判来终结经济困境和政治暴力。与前政府形成鲜明对比的是，他宣扬的是符合道德和充满乐观的未来愿景，并希望尽可能与经济进步派人士合作，他的演讲赢得了满堂掌声，尽管旧民主党和许多保守派人士并不那么热情。"
 USA.300.a:0 "未来近在眼前！"
 USA.301.t:0 "诺里斯主张经济干预"
 USA.301.d:0 "为了应对当前的危机并实现进步党在竞选时的承诺，诺里斯总统提出了一项法案，开始实施一系列经济干预政策。该法案将为银行存款提供保险，这些存款将被存入财政部批准的银行，而这些银行将不会从事风险投资。该法案还允许联邦政府设立一个监督股票市场交易以防止欺诈行为的委员会。进步人士认为，这将恢复市场的信心，在全国各地创造就业机会。社会党和至上党都宣布支持该法案——尽管他们认为该法案做得还不够，并且认为该法案对最初导致大萧条发生的企业过于友好。两支激进党派都要求彻查美国商界的几大肮脏企业，并确保这些危害美利坚经济的蛀虫会得到法律公正的审判。与此同时，旧民主党声称，这只是联邦自由主义者以牺牲美国人民为代价，赋予华盛顿富有的世界主义者和进步主义者权力的另一种方式，他们呼吁将银行拆分，并下放给州一级的当地公民。我们可能不得不修改该法案以得到社会党和至上党的更多支持，昆汀·罗斯福建议对其中的欺诈行为进行追溯调查，指控那些不法分子，以表明我们与造成这场危机的商界腐败分子的不同，并兑现我们对正义的承诺。更重要的是，我们可以借此向社会党与至上党示好，以确保他们不会进一步危害秩序。"
 USA.301.a:0 "承诺将欺诈者们绳之以法"
 USA.301.b:0 "揭开旧时伤疤只会破坏经济"
 USA.302.t:0 "朗与海伍德谴责政府"
 USA.302.d:0 "在看到诺里斯政府在面对愈发高涨的调查金融系统的呼声选择冷处理与沉默后，朗与海伍德都对此愤怒不已。作为回应，休伊·朗在路易斯安那发表演讲，指责白宫“向银行家低头”，并声称所谓的进步改革不过是给“腐败披上新的外衣”。他宣称，若政府不愿意清算旧日的金融寡头，那么人民就必须自己行动。在集会的最后，朗甚至喊出了“向华尔街进军”的口号。与此同时，海伍德在芝加哥的工人集会上直言不讳地称，进步党已被华尔街驯化，成为资本主义危机的提线木偶。他号召工人组织更大规模的罢工与抗议，以迫使联邦政府采取真正的革命性措施。芝加哥的工人团体在海伍德的演讲后立刻举行了规模远超以往的大罢工，而我们的警察对此束手无策。\n\n祸不单行的是，由于诺里斯政府并未彻底的向选民兑现他竞选时做出的一系列承诺，进步党的支持率与声望也在以惊人的速度坠落。几乎在全国所有的州县，政府的举措都受到了公民的抨击。如今的政治局势正在走向失控..."
 USA.302.a:0 "叛徒！"
 USA.303.t:0 "至上党与社会党表达善意"
 USA.303.d:0 "诺里斯总统宣布将对金融欺诈展开追溯调查，并公开承诺将责任人绳之以法后，政治气氛出现了微妙变化。社会党领导层发表声明，称赞华盛顿终于作为政府愿意整顿金融秩序，尽管他们仍强调工人斗争仍未止歇，但态度开始变得相对友善。至上党方面也罕见地收敛语气，表示若联邦政府真心肃清腐败，他们愿意在恢复金融秩序与保卫农民与退伍军人利益上展开有限合作。尽管激进党派的回应表现出他们的愿意合作态度，但党内的一部分建制派成员开始质疑总统向激进分子屈膝。共和党与民主党更是借机开始大肆攻击进步党，以求为自己争取更多政治优势。但好在熊熊燃烧的美国政坛开始逐渐降温，进步党也将开始与激进党派接触，试图达成妥协。"
 USA.303.a:0 "邀请至上党与社会党谈判，以平息矛盾"
 USA.304.t:0 "海伍德与朗抵达"
 USA.304.d:0 "应美国新总统诺里斯的邀请，比尔·海伍德和休伊·朗离开了他们各自的势力范围参与会面。谈判在西海岸的城市费城进行，赤卫队，一分钟人与军方都被隔绝在城市之外，只有少量国民警卫队以维护秩序。谈判的进程很难说的上顺利，三方的要求与底线相互冲突。虽然朗对与诺里斯合作持更开放的态度，也对与政府合作持接受态度。然而，休伊·朗明确表示，他希望由至上党主导的州与至上党的盟友地区能立即获得对农业的大批量援助，而至上党同样应获得主要政党的地位，不应再受到来自联邦政府的打压。相比于朗的“温和要求”，海伍德的诉求则更加激进。社会党与海伍德提出了更为激进的要求，要求支持工人合作社、加大工人福利、公布因各种相对轻微的罪行而被捕的社会党活动人士的详细名单，以及政府对工会的保护。他接着表示，应该给予社会党在该地区尤其是在非钢带地区更大的宽容。而对于我们的要求，包括削减民兵力量，宣布不再策划反政府游行与抗议等等，两党的态度则含糊不清。"
 USA.304.a:0 "这也是迫不得已"
 USA.304.b:0 "他们要求的太多了，让他们滚"
 USA.305.t:0 "社会党与至上党作出回应"
 USA.305.d:0 "在费城举行的第一轮会谈结束后，社会党与至上党代表分别发表声明，确认已与联邦政府就若干关键议题达成初步共识。政府承诺将持续推进对金融欺诈的调查，并在劳工保障与就业计划方面展开进一步磋商。同时政府即刻拨款以赈济南部美国的破产农民，还释放了联邦监狱关押的一部分政治活动家。作为回应，两党宣布暂时缓和全国范围内的动员行动，呼吁支持者“减少暴力活动”。数个州政府发回的报告称街头集会规模有所缩减，而执法部门的报告显示暴力冲突明显下降。而一些为激进党派发声的报纸头版罕见地以‘对话’而非‘对抗’为标题。尽管尚未能达成彻底的和解与合作，但至少目前一切顺利。"
 USA.305.a:0 "至少我们现在能喘口气了"
 USA.306.t:0 "默里谴责进步党"
 USA.306.d:0 "俄克拉何马参议员，旧民主党领导人威廉·H·默里谴责总统将两名激进分子和种族叛徒带入白宫，密谋反对国家善良的基督徒信徒，称其背叛了美国的基础。默里宣称，进步党政府正在“以正义之名拆毁共和国的根基”，并警告称，与社会主义者和至上派的妥协，将使国家落入无神论者与世界主义者之手。他以南方农村与教会社区为例，呼吁善良的美国信徒警惕联邦权力的扩张。\n\n据多家报纸报道，在演讲高潮时，密西西比州参议员西奥多·比尔博高喊“上帝保佑紫花苜蓿！”——这句带有乡土象征意味的口号迅速点燃了旧民主党议员的情绪，全体起立鼓掌，以示支持。议事厅一度陷入喧哗。然而，其他党派议员对此表示强烈反对。爱达荷州参议员威廉·博拉公开指责默里的言论‘危险且煽动性极强’，认为这类讲话正在鼓励地方对抗联邦权威。\n\n事后，南方报纸纷纷转载默里的讲话，北方媒体则批评其试图将国家带回旧式派系对抗。显然，与激进派的谈判并未彻底的平息争议，反而在另一侧点燃了新的战线。"
 USA.306.a:0 "可笑"
 USA.307.t:0 "处理旧民主党"
 USA.307.d:0 "随着威廉·H·默里及其盟友在南方各州不断煽动‘州权’与‘信仰保卫’的口号，地方政治气氛迅速升温。部分州议会通过象征性决议，谴责联邦政府与‘激进分子’勾结；3k党，黑色军团与白人联盟开始组织武装巡逻，声称要捍卫地方秩序。联邦调查报告指出，一些地方执法机构已选择性忽视针对进步派支持者的暴力行为。南方局势正在升温，社会撕裂与不稳定已经到达了一个临界点。在紧急内阁会议上，总参谋长道格拉斯·麦克阿瑟将军直言不讳地表示，若不立即展示国家的力量，分裂主义将蔓延。他建议向关键州份部署联邦部队，以震慑潜在的叛乱组织。司法部则提出另一条路径：利用现有法律，针对旧民主党与白人联盟的领导人提起诉讼，同时迅速逮捕所有领导者，以削弱其组织核心。埃德加·胡佛也表示，FBI有能力以最快速的动作实施抓捕。"
 USA.307.a:0 "按照麦克阿瑟的建议，派出军队进驻南方"
 USA.307.b:0 "尝试逮捕旧民主党与白人联盟的领导人"
 USA.308.t:0 "行动失败"
 USA.308.d:0 "司法部在FBI局长埃德加·胡佛的主导下，对旧民主党与白人联盟核心人物展开了一系列突袭行动。然而，本应迅速而精准的逮捕计划却陷入混乱。由于内鬼的泄露情报，部分目标人物提前逃离，地方执法部门消极配合，甚至有陪审团拒绝签发拘捕令。在几个南方城市，试图执行逮捕的联邦探员遭遇武装民众围堵，事态迅速升级为街头冲突。‘联邦暴政’的口号在教堂与集市间回荡。批评者指出，FBI长期以来在地方的情报渗透并不彻底，对南方政治网络的低估导致此次行动仓促推进。更糟的是，一些被拘押的次级人物迅速被塑造成‘州权烈士’，引发连锁示威。坚决支持旧民主党的南方州例如佐治亚州的州议会迅速召开紧急会议，谴责华盛顿滥用执法权力。"
 USA.308.a:0 "胡佛那个蠢货是干什么吃的?"
 USA.309.t:0 "白人联盟走上街头"
 USA.309.d:0 "白人联盟成员走上街头，在多个南方城市组织大规模示威。起初只是高举州权与信仰口号的集会，很快演变为针对黑人企业与联邦机构的暴力冲击。商铺被砸毁，邮政大楼与联邦法院遭到围堵，街头冲突持续整夜。更令人不安的是，这些行动显然并非自发。白人联盟的民兵队伍展现出高度组织性与协调能力，补给与通信系统运作顺畅。旧民主党领导人虽未公开承认参与，但他们的沉默与模糊表态，几乎等同于支持。联邦部队与执法人员奋力维持秩序，却在舆论与地方权力结构的双重压力下陷入被动。"
 USA.309.a:0 "我们将与这帮恐怖分子战斗到底"
 USA.310.t:0 "新年大罢工持续蔓延"
 USA.310.d:0 "比尔·海伍德呼吁组织示威游行，反对政府最近一段时间的无所作为。社会党新年罢工正蔓延到全国各地，许多工业州的生产工作被迫陷入停滞。尤其是圣路易斯市，俨然是座真正的战区，居民们每天的生活就是看着罢工者与联邦军队、旧民主党或美利坚至上党武装爆发冲突，由此激起的混乱更是引发数场市民抗议游行，但他们组织的示威活动经常演变成抢劫商铺和群体骚乱。成千上万的民众开始逃离圣路易斯城，越来越多的人请求联邦政府尽快干预其中。所有卷入其中的准军事组织已经开始组织各自的部队，并与州长和其阵营内的其他政客联系。美国似乎又要爆发一场内战了。"
 USA.310.a:0 "我们做了什么？"
 USA.311.t:0 "救济法案通过"
 USA.311.d:0 "朗-海伍德法案（在朗坚持要求改名之前，原为海伍德-朗法案）已在国会成功通过！然而，旧民主党却拒绝接受援助，声称这是一个增强敌对势力对其人民权力的伎俩，认为该法案增加了社会党和至上党的权力和资金，并宣布他们不会允许至上党在其势力范围内的据点接受“来自犯罪政府的援助”。旧民主党坚持要求获得南方诸州救济资金的自主分配权，否则“联邦政府的报应将在所难免”，参议员埃里森·D·“棉花埃德”·史密斯甚至承诺将进行“大清算”。当然，一个较好的消息是，社会党已经暂时叫停了总罢工。"
 USA.311.a:0 "好……也不好"
 USA.312.t:0 "第二轮谈判"
 USA.312.d:0 "随着第一轮谈判的结束，联邦政府与至上党之间很快开始筹措第二轮谈判。为了巩固联邦政府对南方与中部的控制力度，同时也为了对抗猖獗的旧民主党与白人联盟，诺里斯总统需要来自至上党的合作。同时也因为朗的左派经济理念相较于社会党更加温和，因此与至上党谈判成为了政府如今的最佳选择。在里士满的谈判中，朗率先向政府代表表示，为了达成长久性的合作，至上党与进步党应当达成一个政治联盟，至少进步党应当对至上党包括财富分享计划在内的一些政治提案予以支持。作为回报，朗同意裁撤部分一分钟人，并帮助政府共同打击黑色军团等准军事组织。"
 USA.312.a:0 "达成协议"
 USA.313.t:0 "旧民主党煽动叛乱"
 USA.313.d:0 "有鉴于我们最近专注打击旧民主党的行动，威廉·默里与部分旧民主党成员认为局势已经到达了不可逆转的程度。如果继续放任联邦政府与社会党和至上党勾结共同打击自己，那么绝大多数的旧民主党人都可能深陷牢狱之灾。因此，以尤金·塔尔梅奇为首的旧民主党人和西蒙斯领导的全国白人联盟开始在南方煽动民众，号称“华盛顿的暴君已经沦为了赤党的代言人”，同时一些南方报社开始大肆渲染恐慌，指责总统将会把整个国家都卖给赤匪，进而美国就将成为第三国际的下一个目标。尽管这些无稽之谈并未在北方获得多少反响，但整个南部都开始陷入了进一步的混乱。大量的武装3k党徒与黑色军团开始更加频繁的袭击驻军，甚至在亚特兰大已经爆发了短暂的交火。毫无疑问，如果我们不能及时控制住南方局势，那么美利坚的内战似乎近在咫尺。"
 USA.313.a:0 "给我把默里逮住！"
 USA.314.t:0 "旧民主党被激怒"
 USA.314.d:0 "旧民主党不出所料地要求我们撤销向白人联盟所控的美国东南部以及其他地区派遣军队的决定。默里称其为“华盛顿的暴政”，而约翰·E·兰金则用他能想到的每一种谩骂来回应我方对密西西比的占领。他们目前正在国会中尽可能地拖延时间，在约瑟夫·西蒙斯领导下的全国民主党白人联盟也印制了谴责我们的简报。虽然有些人希望我们立即撤退，但道格拉斯·麦克阿瑟却要求留下军队完成任务，而且社会党和至上党都必须让他们的民兵组织与联邦军官合作，共同控制旧民主党据点的边境地区，以显示他们对联邦政府的忠诚。"
 USA.314.a:0 "遵循麦克阿瑟的建议"
 USA.314.b:0 "这是个坏主意，撤退"
 USA.315.t:0 "白人联盟发动袭击！"
 USA.315.d:0 "我国派往南卡罗来纳州维持和平的一小队人马在查尔斯顿街头行走时遭到伏击，几名白人联盟的成员向他们开火，并投掷了几枚燃烧弹。该行为得到了极端派、南卡罗来纳州长科尔曼·布莱斯的赞扬，他是所谓的“旧三K党”的成员，并在曾经表示，南卡罗来纳不会容忍“第二次南方重建”，惩罚是不可避免的。一些进步人士敦促我们逮捕布莱斯，但这很可能会激起南方的反弹。就麦克阿瑟的意见而言，逮捕州长还是太过冒险，这会使他的部下面临更大的风险。"
 USA.315.a:0 "只关注白人联盟"
 USA.315.b:0 "逮捕布莱斯"
 USA.316.t:0 "军队要求增加预算"
 USA.316.d:0 "虽然麦克阿瑟不赞成政府的计划，但仍决定配合[USA.GetLeader]的方案，终结民兵组织。然而，全国民主白人联盟最近几天发动的游击战和政治攻势一直在消磨军方的力量。麦克阿瑟要求增加军事经费，以阻止白人联盟夺取旧民主党的据点，并表示如果我们拒绝他的要求，美国的末日就必将到来。"
 USA.316.a:0 "这很公平，增加他的预算"
 USA.316.b:0 "他只能用现有的东西将就一下"
 USA.317.t:0 "麦克阿瑟的要求"
 USA.317.d:0 ""随着政府多次下令增派军队进驻南方打击暴乱与3k党，军方内部的不满情绪开始逐渐浮现，对如今总统的行政举措颇有微词。长期以来，作为军队的领袖之一，麦克阿瑟将军始终要求政府增加对军队尤其是陆军的预算，以确保军队的武备和人员不受财政的束缚，同时他希望政府实行举措以扩充现役兵员，恢复军工生产，并给予军方在南方行动中更大的自主权。然而，在经历了黑色星期一后，加之新年罢工的影响，如今的政府财政情况已经到了悬崖边上。政府的金库几乎见底，救济法案、劳工保障制度和紧急就业计划已经让财政赤字如雪球般滚动。然而如果我们无视军方的要求，很可能我们如今安定南方诸州的既定目标将功亏一篑。内阁会议持续了数小时，最终总统做出了决定..."
 USA.317.a:0 "同意增长军事开支，换取他的坚定支持"
 USA.317.b:0 "你说得对，但国库早就见底了"
 USA.318.t:0 "国家债务增长"
 USA.318.d:0 "俗话说，天下没有免费的午餐。我们试图通过直接支出来缓解经济压力，却产生了不少债务，而且可能需要一段时间才能尽数偿还。至少在我们当前的项目完成之前，可能都无法安全地专注于偿还债务。尽管如此，阿尔·史密斯和约翰·南斯·加纳等民主党政客仍然要求我们控制支出，否则将阻挠开支项目。然而，我们与新进步联盟的关系太过紧密，基本无法满足这个要求。"
 USA.318.a:0 "目前我们必须增加投入"
 USA.319.t:0 "胡佛的妙招"
 USA.319.d:0 "我们对南方的占领并不容易，旧民主党人抵制我们，三K党则谴责我们是叛徒。然而，尽管占领行动阻止了一次彻底的叛乱，但很明显，如果不通过其他手段让三K党失去群众支持，我们就无法确保稳定，并彻底深陷泥潭。不过今天，J·埃德加·胡佛提醒我们，他掌握了印第安纳州三K党领袖D·C·斯蒂芬森腐败的证据，包括他和党内成员酗酒、吸毒、恐吓他人、与未成年人发生“关系”、性侵和谋杀他人的记录。虽然很明显胡佛想通过增强联邦调查局的存在来获得回报，但我们还是有必要加以配合，因为公布这些证据并将斯蒂芬森告上法庭将使三K党名誉扫地。"
 USA.319.a:0 "好极了，逮捕斯蒂芬森"
 USA.320.t:0 "国会质问西蒙斯"
 USA.320.d:0 "威廉·约瑟夫·西蒙斯被国会问及他与占领行动期间白人联盟同海勒姆·韦斯利·埃文斯一起发动的恐怖袭击的关系。失去了他们曾经拥有的政治影响力来保护他们接受调查，事情很快就变得明朗起来，西蒙斯对实施这些行为的组织一无所知的故事再也无法瞒过公众的眼睛。他和埃文斯都将很快接受审判。与此同时，白人联盟自斯蒂芬森丑闻后在全美的影响力正大幅缩减，最近的这一调查只会加速其崩溃的过程。在国会中的一些旧民主党成员，如爱德华·E·考克斯和卡尔·文森甚至重新加入了民主党，严重削弱了旧民主党的政治力量，并在实质上彻底终结了白人联盟这一曾经的主要政治力量。"
 USA.320.a:0 "棒极了！"
 USA.321.t:0 "斯蒂芬森的协议"
 USA.321.d:0 "斯蒂芬森最初因谋杀和其他个人罪行而被联邦调查局逮捕，被指控密谋袭击平民——而其他罪行，例如对预谋犯罪行为知情不报，同样也被加入其指控中。印第安纳州三K党正处于混乱之中，因为其州长爱德华·杰克逊，一个绝对的前三K党成员，正试图与三K党保持距离。然而，斯蒂芬森要求我们取消对他的死刑判决，作为回报，他会供出三K党重要成员的清单，并指证他们的罪行。虽然这将有助于我们的斗争，但许多人更愿意看到他被绳之以法，并与其他人达成类似协议。"
 USA.321.a:0 "成交"
 USA.321.b:0 "滚蛋"
 USA.322.t:0 "3k党彻底崩溃"
 USA.322.d:0 "在我们持续不断的打击下，盘踞南方危害美国社会多年的3k党终于被彻底击溃。印第安纳的巨龙D·C·斯蒂芬森已经伏法，大巫师海勒姆·韦斯利·埃文斯也即将被审判。联邦法院将以谋杀，强奸，参与私刑活动等十余项罪名提起法律诉讼，尝试将这个混蛋判决终身监禁或是死刑。而一切的罪魁祸首，威廉·约瑟夫·西蒙斯，则在上周暴毙于自己在亚特兰大的家中。伴随着蛇头的死亡，3k党在政界的支持者也纷纷树倒猢狲散，一些州长宣布3k党非法，而另一些与3k党徒联系密切的州长也遭到弹劾。自1915年重建以来，这个无形帝国的权威与力量如今已经坠落到了谷底。可以预计的是，在未来数年内，3k党的影响力将彻底消散，而那些巨龙与巫师们也将被彻底的钉在历史的耻辱柱上。"
 USA.322.a:0 "白面混账滚蛋吧！"
 USA.323.t:0 "迈向黎明的最后一步"
 USA.323.d:0 "毫无疑问的是，作为我们如今的盟友，至上党与社会党的民兵组织在打击3k党和黑色军团以及调查旧民主党等行动上提供了巨大的助力，但对于一个民主国家来说，让其中任何一派民兵成为国民生活的常态是不健康的。无论是处于政治稳定考虑，抑或是维持和平的秩序，削减乃至裁撤这些民兵都是必须的。在华盛顿，总统与海伍德和朗进行了最后一轮谈判，以确保双方达成协议以将这个国家带回正规。政府方面提出，白宫的底线是两党接触武装，解散民兵组织。作为回报，政府将在未来数年内保证两党派系的国会议员席位，同时在经济上仍然维持对两党的支持。朗认为政府需要在未来至上党提出修改后的财富分享法案时提供一定的支持，而海伍德则要求政府停止今后对I.W.W的打压。在经过数天艰难的谈判后，政府与至上党和社会党发布了联合声明，一分钟人与赤卫队将在未来的一个月内陆续解散。钢带区与路易斯安那州也将逐步回归联邦政府的掌控。"
 USA.323.a:0 "终于稳定了"
 USA.324.t:0 "对选举人团制度宣战"
 USA.324.d:0 "在竞选时，诺里斯与进步党将实现普选制作为他们的竞选口号与政治目标。总统主张不再让各州选举代表遵循“简单多数原则”决出新任总统，而是建立更为明确的“全国普选制度”。然而，大多数国会议员认为，我们有必要维护现有体制以应对未来可能的激进主义风潮。随后。美国宪法第二十号修正案日前正式亮相。这部修正案希望改革“选举人团制度”，规定美国总统应由全体公民普选产生。联邦现行选举制度的上次修正大概是19世纪中后期颁布的第十四号宪法修正案（南北战争结束后，主要涉及公民权利和平等法律保护，此外规定众议院席位以各州人口数量为基准），而这在如今的政治环境中已显落后与过时。然而，共和党与民主党保守派则强烈反对该法案，并尝试尽一切手段阻止该法案通过。很明显，诺里斯政府需要做些什么来保证此修正案能够顺利在国会通过。"
 USA.324.a:0 "呼吁至上党与社会党的支持"
 USA.324.b:0 "没有他们我们也能做到"
 USA.325.t:0 "诺里斯大坝落成"
 USA.325.d:0 "历经四年的艰难建设，横跨田纳西河的诺里斯大坝终于在今日正式竣工。作为田纳西河流域管理局（TVA）的核心工程之一，这座大坝不仅象征着进步精神的胜利，更是国家复兴的良好开端。\n\n在大坝的落成典礼上，诺里斯总统亲至并向民众们发表演讲：“我们并非仅仅在建造混凝土与钢铁的堤坝，而是在筑起未来希望的基石。我明白美国民众的不屈精神，也将与你们一同奋斗，直到美利坚走出萧条的阴霾与衰落的困境。”人群爆发出热烈掌声，来自周边农村的居民纷纷表示，电力的到来将改变他们的生活——夜晚的灯光、灌溉的水泵、通往城市的铁路，都将因这座大坝而焕然一新。\n\n大坝不仅为田纳西河流域提供稳定的电力供应与防洪能力，也将为成千上万的工人带来新的就业机会。与此同时，它还被视为诺里斯政府倡导的“指导式复兴施政”理念的成功案例：国家、工会与私人企业共同参与规划与建设，在避免滑向低效与腐败的同时确保社会公正。\n\n尽管以加纳为首的秉持着财政紧缩思想的民主党成员指责该工程“浪费巨大”，但现实已证明，无数项这样的工程正为美国南部带来前所未有的繁荣与稳定。随着水轮机的轰鸣声缓缓响起，昔日贫瘠的山谷被灿烂的电光点亮，人们终于看到了希望的曙光。"
 USA.325.a:0 "很好"
 USA.326.t:0 "社会党的要求"
 USA.326.d:0 "随着谈判的不断推进，社会党方面通过其工会网络向白宫递交了一份正式要求清单，内容包括扩大联邦就业计划、加强劳工安全立法、增加社会党成员在国会内的席位、以及在证券监管委员会中增加劳工代表席位。海伍德公开表示，他们愿意以恢复生产为前提，暂停进一步的动员与罢工行动。但前提是，政府必须展现出真正倾听工人声音的诚意。内阁内部对此意见不一。一部分人认为让步将被视为软弱，可能助长未来的政治施压；另一部分则指出，若罢工持续蔓延，经济复苏的成果将被彻底侵蚀。"
 USA.326.a:0 "批准他的要求"
#柯蒂斯与兰登1936
USA.350.t:0 "总统的就职典礼"
 USA.350.dc:0 "成功当选后，柯蒂斯立即向全国发表演讲，呼吁人民保持克制、坚守道德底线。引用柯蒂斯的话说：“无法保护人民的国家是不值得被保护的。许多企业期望通过削减工资、降低生活水平和破坏群众购买力的方式来缓解经济危机，这也是不可能办到的。”在取得不太可能的胜利后，柯蒂斯的精神重新振作起来，在社会主义者与强硬派的抗议声中勇敢地走进白宫，承诺振兴美国经济、恢复民众团结，通过必要的手段阻止任何政治暴力。当然，其他美国人是否愿意听从他的号召则是另外一门课题。"
 USA.350.dl:0 "今天，阿尔夫·兰登成功当选第31任美国总统，在他的就职演说中，兰登谈到美国在捍卫自由民主方面所直面的挑战。引用总统的原话来讲：“共和党人必须成为务实的自由主义者，我们必须认识到日益发展多样化中的工业文明，所引发的种种问题。身为总统，我也会如此开导美国人民。”——阿尔夫·兰登承诺鼓励“创业精神”解决经济危机，为美国创造新生代的百万富翁。有多少人愿意倾听他的演说是个值得关心的话题。"
 USA.350.a:0 "美利坚团结一心！"
 USA.351.t:0 "共和党宣布举行谈判"
 USA.351.dc:0 "柯蒂斯总统当选后的首要责任，是解决美利坚社会党近期领导下的罢工运动，因此，他向比尔·海伍德发出邀请希望在芝加哥举行会晤。比尔·海伍德在这场斗争中占据着绝对优势，世界产业工人联盟与美利坚劳工联合会都支持着他，在新年大罢工中充当主力军。一些记者获悉，柯蒂斯总统的内阁成员都反对他与工团打交道，毕竟执政联盟建立的原因之一，就是两党都不愿与美利坚社会党单独打交道——这种做法很可能沦为政治自杀，但柯蒂斯总统已下定决心，毫不动摇。"
 USA.351.dl:0 "兰登总统当选后的首要责任，是解决美利坚社会党领导下的罢工运动，因此，他向比尔·海伍德发出邀请希望在芝加哥举行会晤。比尔·海伍德在这场斗争中占据着绝对优势，世界产业工人联盟与美利坚劳工联合会都支持着他，在新年大罢工中充当主力军。一些记者获悉，兰登总统的内阁成员都反对他与工团打交道，毕竟执政联盟建立的原因之一，就是两党都不愿与美利坚社会党单独打交道——这种做法很可能沦为政治自杀，但显然兰登总统和他的首席谈判代表，副总统查尔斯·柯蒂斯已下定决心，毫不动摇。"
 USA.351.a:0 "我们别无他法"
 USA.352.t:0 "海伍德接受邀请"
 USA.352.d:0 "比尔·海伍德派人向联邦政府传话，愿意接受对等谈判。来自联邦调查局的密报结果表明，他和其他社会党领导人担心，如果他直接拒绝，将会失去党内右翼的支持，这意味着虽然他对出席会议并不感到兴奋，但至少将表现出一定程度的善意。当芝加哥方面紧锣密鼓地加强安保工作时，总统的内阁与道格拉斯·麦克阿瑟将军并不看好这场谈判，他们认为总统阁下正将自己的生命置于危险中。目前他们正在场外紧张等候着会谈结果。"
 USA.352.a:0 "心脏病也不能战胜我，我将创造奇迹"
 USA.352.b:0 "很好，共和国可能会存活下来"
 USA.353.t:0 "谈判开始"
 USA.353.dc:0 "在谈判之前，柯蒂斯发表了激动人心的演讲，阐述了他的计划。他指出：“通过这些谈判，我们延续了美国通过妥协实现和平的伟大传统，通过理解取得进步，通过双方的协议来实现民主。愿我们今天的努力践行宪法的精神，维护所有美国人的自由。”随后柯蒂斯总统和比尔·海伍德随后在芝加哥举行了历史性的会谈。在谈判进行到最为焦灼的民兵与自治权问题时，政府与社会党的要求始终无法达成一致，进而谈判陷入了僵局。此时，作为其余两个激进大党的领导者的休伊·朗与威廉·默里都公开表示抗议，认为政府私自与工团暴徒谈判将会把国家带入工团主义的深渊。作为抗议与回应，两党手下的准军事组织也进一步组织暴力事件以破坏公共秩序。毫无疑问，为了避免引起更大的风波，我们必须至少与一个激进党派达成暂时的共识，或者向所有的激进党派都表示出妥协与谈判的意愿。"
 USA.353.dl:0 "在谈判之前，兰登发表了激动人心的演讲，阐述了他的计划。他指出：“许多人担心，与对手谈话是一种软弱的表现。然而，这种想法是极端分子的误区，他们只会让人民为满足自己的愚蠢幻想而牺牲。这是自由精神的伟大时刻，也是迈向更自由美国的一步。”随后兰登总统和比尔·海伍德随后在芝加哥举行了历史性的会谈。在谈判进行到最为焦灼的民兵与自治权问题时，政府与社会党的要求始终无法达成一致，进而谈判陷入了僵局。此时，作为其余两个激进大党的领导者的休伊·朗与威廉·默里都公开表示抗议，认为政府私自与工团暴徒谈判将会把国家带入工团主义的深渊。作为抗议与回应，两党手下的准军事组织也进一步组织暴力事件以破坏公共秩序。毫无疑问，为了避免引起更大的风波，我们必须至少与一个激进党派达成暂时的共识，或者向所有的激进党派都表示出妥协与谈判的意愿。"
 USA.353.a:0 "优先专注与社会党达成妥协"
 USA.353.b:0 "向至上党与旧民主党表达我们的态度，先把局势控制住"
 USA.353.c:0 "向社会党施压，尽快通过谈判稳定钢带区"
 USA.354.t:0 "朗与默里要求加入谈判！"
 USA.354.d:0 "在收到我们愿意达成妥协的信息后，至上党与旧民主党都暂时与我们达成了“休战”。然而随即朗与默里就向我们表达了至上党与旧民主党的要求：加入正在芝加哥进行的谈判。毫无疑问，两党自然不希望联邦政府能够压制他们，但也不希望看到代表工团势力的社会党一家独大。现在摆在我们面前的问题是，究竟是否要向朗与默里妥协，同意他们加入芝加哥谈判。如果我们同意，那么本就进展缓慢的谈判势必将更加难以推进。但如果拒绝他们的要求，那么局势将进一步恶化。"
 USA.354.a:0 "我们别无他法"
 USA.354.b:0 "他们想都别想"
 USA.355.t:0 "谈判破裂！"
 USA.355.d:0 "为了尽快稳定钢带局势，我们开始就民兵问题向海伍德施压，同时向他们暗示我们正在谋求与至上党与旧民主党达成合作。然而，海伍德的态度极为强硬，坚决不愿在民兵问题上后退半步，反而要求政府将军队撤出钢带区以表示诚意，谈判才能顺利进行。此时，底特律的一场非暴力罢工中突发了流血事件，一名警察在试图维持秩序并要求工人恢复工作时意外造成了一名工人重伤，进而情况迅速发酵。海伍德在得知此事后认为联邦政府毫无谈判诚意，宣布推出谈判。毫无疑问，如今钢带的局势已经不可逆转，总统及新政府的威信也遭到了严重的打击。美国社会上下很难再有人相信这个新政府能够解决如今的美国的困境了。"
 USA.355.a:0 "一切都完了"
 USA.356.t:0 "海伍德要求工人自治"
 USA.356.d:0 "海伍德在谈判中向政府表示，社会党如今已经被政府逼到了悬崖边上，但也不会妥协。他希望政府停止对总罢工的镇压，停止对钢带区派驻军队以确保社会党以及工人们的生命不会受到来自军方的威胁。这将被视为是政府对社会党与工人力量的示好，而非软弱。在政府表达善意后，社会党将号召工人们暂缓总罢工并在部分关键地区部分恢复工作，来确保合作的下一步推进。海伍德还向政府表示，如果能够达成合作，社会党在民兵问题上也会有限度的退步，来让工人阶级与联邦政府达成和解。这对我们来说堪称喜忧参半：如果我们同意社会党的要求，政府就能调拨更多的力量来应对两外两个激进党派。但如果我们率先做出妥协，那么无论是政府内部还是朗与默里都会认为我们向红色势力屈膝，这势必对我们未来的工作造成影响。"
 USA.356.a:0 "同意海伍德的提议，达成共识"
 USA.356.b:0 "这要求太过分了"
 USA.357.t:0 "要求自治"
 USA.357.d:0 "海伍德、朗和默里已经明确表示，他们认为工人们受到了束缚，但他们实现其目标的方式截然不同。然而地方自治计划允许每一个人在其各自的地区实践自己的想法。海伍德要求我们停止结束总罢工的一切尝试，从该地区撤出我们的大部分部队，以此来显示我们的诚意。至上党和旧民主党已经声明，如果我们接受社会党的要求，就必须以同等的态度对待他们，命令麦克阿瑟的军队从他们的地区撤出。当然，海伍德随后差点搞砸了谈判，他声称把军队从旧民主党的据点撤出只会让赤卫队更容易地占领那里，这几乎称得上是威胁了，但默里对此只是笑了笑，并邀请海伍德“尽管尝试”。谢天谢地，在朗和总统提醒他们现在讨论的主题是军队后，他们暂时停止了争吵。"
 USA.357.a:0 "准了"
 USA.357.b:0 "海伍德需要给我份更合适的提案"
 USA.358.t:0 "谴责华盛顿"
 USA.358.d:0 "由于被拒绝参会，威廉·H·默里和休伊·朗都公开谴责总统[USA.GETLeader]竟然不顾他们与一个“无政府主义者”会面。这两人都在试图煽动他们的支持者，至上党要求允许朗参与会议，大量的一分钟人在中部地区制造声势甚至鼓动暴力事件以逼迫我们屈服；而旧民主党干脆宣布华盛顿政府已是一个不可挽救，陷入激进主义的腐败机构。加入他们派系的州长和国会议员纷纷表示赞同，据报道，他们正与派系的民兵领导人直接会面。白人联盟与黑色军团的民兵活动也大幅增加，整个南部诸州都正在一点点被暴乱的火焰吞没。种族仇杀与私刑记录已经达到了过去二十年的最高峰，而我们如今束手无策。"
 USA.358.a:0 "谈不拢那就打吧"
 USA.359.t:0 "海伍德称[USA.GETLeader]为腐败分子"
 USA.359.d.c:0 "在柯蒂斯总统上任后不久，美利坚社会党的领袖比尔·海伍德便将矛头直接对准了白宫。作为长期活跃于共和党建制派内部的政治人物，柯蒂斯一直以“妥协者”“制度维护者”的形象示人，并强调通过与工商界、金融界的合作来恢复国家秩序与经济信心。然而，社会党认为白宫已经彻底沦为了“华尔街的代言人”，指控柯蒂斯总统通过幕后交易换取财团支持，以此维系摇摇欲坠的政治联盟。海伍德在一次公开演讲中怒斥道，柯蒂斯所谓的国家团结不过是“让银行家重新掌控共和国的遮羞布”。尽管许多中间派选民对这些指控持怀疑态度，但在工业区与钢带地带，激进分子显然愿意相信这一说法，并将其作为动员抗议的新口号。"
 USA.359.d.l:0 "阿尔夫·兰登在选举材料中将自己描述为“白手起家的创业者”，从小型石油企业开始积累起庞大的基业。与兰登总统关系密切的石油工业界人士，最近在他的家乡堪萨斯成立“联邦石油与天然气协会”，标准石油公司也与该协会建立起自由往来。尽管以此发表指控在多数人眼里显得毫无道理，但对于海伍德与美利坚社会党来说，现在他试图与大企业拉近关系的行为足以成为攻击兰登是阶级叛徒的确凿证据。日前，阿尔夫·兰登被谴责贿赂商界关系，借此改善经济。而激进分子似乎对此深信不疑。"
 USA.359.a:0 "他会摧毁共和国！"
 USA.360.t:0 "休伊·朗称[USA.GETLeader]为法团主义者"
 USA.360.d:0 "就像海伍德那样，休伊·朗同样对该事件作出回应，谴责[USA.GETLeader]总统是标准石油公司赞助下的腐败政客。尽管休伊·朗支持谈判，认为这是朝着正确方向迈出的一步，但他随后引证[USA.GETLeader]出任堪萨斯州长时的财政保守主义政策，严厉批判总统阁下新推《干涉法案》不过是想取悦富人与寡头的利益，压榨美国平民。休伊·朗还提醒选民，自己才是执掌白宫的天选之人，假若上场的人是他，危机早就解决了。对此，[USA.GETLeader]总统在接受报社媒体采访时指出，休伊·朗有明显的“酸葡萄”心理，不少政治漫画也开始将休伊·朗描绘为“幼稚的狒狒”——公众们觉得挺有趣，休伊·朗却对此倍感震怒。"
 USA.360.a:0 "以自我为中心的小丑！"
 USA.361.t:0 "默里谴责近期政策"
 USA.361.dl:0 "威廉·H·默里对总统支持反白人联盟宣传的行为作出了回应，谴责兰登是一个迎合官僚、企业和少数族裔的腐败政客，认为他利用自己的商界关系，通过强大的企业利益来攻击国家权利，称他是共和党的工具和种族叛徒。默里还号召全美国的极右翼与种族主义者共同发声，以反对“联邦政府的公然政治迫害”。然而旧民主党如今的声势已经衰弱，这场公开谴责也未能给旧民主党带来多少同情与支持。事实上，除了本就支持默里的福特派报纸外，大多数全国性报纸都发表了谴责他的文章。"
 USA.361.dc:0 "威廉·H·默里对总统支持反白人联盟宣传的行为作出了回应，谴责柯蒂斯是一个迎合官僚、企业和少数族裔的腐败政客，认为他利用自己的政界关系，通过强大的企业利益来攻击国家权利，称他是共和党的工具和切罗基血统（美洲土著）的耻辱。默里还号召全美国的极右翼与种族主义者共同发声，以反对“联邦政府的公然政治迫害”。然而旧民主党如今的声势已经衰弱，这场公开谴责也未能给旧民主党带来多少同情与支持。事实上，除了本就支持默里的福特派报纸外，大多数全国性报纸都发表了谴责他的文章。"
 USA.361.a:0 "你蹦跶不了几天了"
 USA.362.t:0 "要求资助"
 USA.362.d:0 "芝加哥会谈正式举行后，大家很快弄明白了一件事，在场的所有人都只有一个共同点：那就是为他们的选民谋取利益。他们要求政府为他们各自的政党提供一笔现金补贴，以应对大萧条。这是政府对他们展现善意的一种表现，如果政府不满足他们的要求，他们就全部离开会场，而如果谈判失败，激进分子的势力无疑将会继续增长。另外，他们当然都不愿意看到其他势力能获得这笔资金，这意味着我们将不得不在谈判中做出更多让步。"
 USA.362.a:0 "同意"
 USA.362.b:0 "拒绝"
 USA.363.t:0 "默里的要求"
 USA.363.d:0 "旧民主党领袖威廉·默里虽因在公开场合屡次三番发表越轨的攻击性言论而有了“斗士”之名，但其私下里却相当精明。不出所料，为了阻止朗和海伍德在他家乡获得更多的权力，他使出了浑身解数，而在其他人最终放弃和他妥协之前，他终于为与会者开出了自己的报价。社会党和至上党“退出”旧民主党的地盘，但可以把它们看重的支持者邀请去它们那里定居，如此，默里就会投票支持自治计划。不过，他希望联邦政府在给予他自治权后能相应减少对迪克西人地区白人联盟的追查，他声称这是“地方事务”，并希望总统公开承诺尊重各州权利。最后，除此之外，他还希望政府对南方乡村进行大笔投资……当然，是通过给默里还有旧民主党拨款，允许他们自由使用的形式。这些条件将确保旧民主党人在可预见的未来内稳固地统治印第安纳州到佛罗里达州，但也唯有如此，自治计划才能得以实现。"
 USA.363.a:0 "同意"
 USA.363.b:0 "绝不！"
 USA.364.t:0 "激进派极度不满！"
 USA.364.d:0 "海伍德和他的支持者对我们同意默里的要求，给予旧民主党人更大的权力感到不安，他们认为这是对该地区支持他的工人的背叛行径。另一方面，朗似乎愿意同意只要双方之间达成“停火”，就不会尝试在旧民主党中扩大他的影响力，但将保留其政党，并“建议”（因为他无法“正式的”控制他们）一分钟人停止在他们之间进行的攻击性行为。美利坚劳工联合会领导人塞缪尔·冈珀斯被召入总统和海伍德的会议，在他们间进行协商，他提出了自己的妥协性方案。社会党将不会再试图在南方扩大影响力，作为补偿，他们在北部将会得到更大的权力，并且给一大笔拨款，让他们随心所欲，保护主义将成为国家原则，联邦政府也将不会试图阻止所谓“联合工团”协助世界其他地方的工团主义运动。海伍德不情愿地同意了，他相信从长远来看，工会运动将帮助更多的工人。当然，他很可能相信，只要他能够使工团主义成为世界的主导意识形态，就也同样可以曲线解放美国南方。现在唯一的问题是共和党人是否会同意。当然，朗看到了机会，也要求至上党因参与这项协议而得到更多的补助，他们可以把这笔钱花在农村和失业的支持者身上。"
 USA.364.a:0 "我们同意"
 USA.364.b:0 "这个有点过分了"
 USA.365.t:0 "示威局势升级"
 USA.365.d:0 "在历经数日的艰难磋商后，政府与美利坚社会党代表的谈判终于取得突破。双方在工会合法化、劳工保护与地方自治问题上初步达成共识，而如今仅剩民兵问题尚未解决。然而，就在谈判进程进入关键阶段之时，南方与中西部的抗议示威情况急剧恶化，大量的一分钟人与3k党走上街头制造暴力事件，而这背后毫无疑问是至上党与旧民主党在策划。两党已经意识到自己无法参与谈判，故而转向指责政府“向赤色暴徒屈服”，要求总统立即中止与社会党的对话。\n\n在阿拉巴马、德克萨斯与路易斯安那，示威人群冲击州议会与工会分部，部分地区甚至传出纵火与殴打事件。军方与警察一度对是否出动镇压意见不一，而国会中的温和派则担忧任何镇压行动都可能彻底破坏谈判的成果。尽管局势愈发紧张，但总统内阁则劝说总统不要放弃谈判，否则政府所有挽救危局的努力都将付诸东流。但警察们传回的报告则显示局势仍旧在恶化。"
 USA.365.a:0 "我们无路可退，只能与社会党走到底"
 USA.365.b:0 "为了大局，结束谈判吧"
 USA.366.t:0 "达成妥协"
 USA.366.d:0 "经历了长时间的谈判与国内各派政治势力的拉扯后，政府终于与美利坚社会党签署了一份历史性的协议。这份“芝加哥协议”总体上确立了政府将尽快通过落实最低工资与工时的立法，允许工会在政府监督下参与产业调解委员会。政府还释放了所有过去被逮捕的美利坚社会党政治犯，而社会党将逐步停止一切全国性的罢工活动，直到所有的政治承诺落实。而对于最关键的民兵问题，政府与社会党达成合作，共同镇压南方的一分钟人与黑色军团等准军事组织与民兵，而在一切安定后，社会党将逐步撤销赤卫队以换取政府对社会党的后续资助。\n\n协议签署当天，总统在白宫对全国发表电视讲话，宣布国家已经向稳定迈出了关键一步。包括建制进步派，温和社会党人与北方工业区与大城市的劳工组织在内的大量政治组织对此欢呼雀跃，而至上党与旧民主党则出离愤怒。而麦克阿瑟也对此表示担忧。总统已经宣布，政府下一步将实行强硬路线，以彻底稳定国家混乱不已的政治环境。"
 USA.366.a:0 "是时候调转枪口了"
 USA.367.t:0 "民兵问题"
 USA.367.d:0 "最终，各方都同意用增加各自自主权利的方式，来换取相互之间的休战。如此一来，留给联邦政府的只有最后一个问题了：民兵，即旧民主党的“白人联盟”、社会党的赤卫队和至上党的一分钟人。要知道，如果这些民兵组织继续壮大的话，和平、民主或是对联邦政府的尊重不太可能一直持续下去。共和党要求各派系停止在其势力范围以外招募民兵，并要求民兵在州政府登记，对其负责并加以管理。而国会中的另外一些人则认为这些民兵组织应该立刻解散，他们说这是确保和平的唯一途径。各派系的领导人都同意第一个要求，只要别的势力从“他们的”地盘上撤走，但他们不太可能会同意第二个要求，不过麦克阿瑟提了个建议，我们或许可以攻其不备，一下缴了民兵们的械，这样他们就只能同意我们的全部要求了。但几乎没人相信这个计划能顺利实施。"
 USA.367.a:0 "要求他们削弱民兵势力"
 USA.367.b:0 "趁他们还没反应过来，马上解除他们的武装！"
 USA.368.t:0 "达成妥协"
 USA.368.d:0 "1937年地方自治法案最终得以通过，联邦政府同意给至上党，社会党和旧民主党在其政区内经济和社会政策上更大的自治权，以换取他们减少招募民兵，停止当前的罢工与骚乱，同时限制他们对自己地盘以外的地区招募党员和采取进攻性姿态。社会党现在已经开始着手把芝加哥和底特律地区过渡到半工团主义制度，实现工会全覆盖和工人持股。至上党则开始推行小规模，地方化的分享财富计划。至于旧民主党统治的东南部地区，已经开始执行更加“属于美国人”的，反企业的政策。尽管不少内阁成员厌恶给予它们这么大的自治权，但权力下放使我们能够集中精力在东西海岸，在那里联邦政府仍然拥有最大的影响力。此外，这能让我方在全国范围内消除他们的威胁，同时给每个主要选区提供他们想要的东西。"
 USA.368.a:0 "妥协拯救了美国"
 USA.369.t:0 "斯蒂芬森丑闻！"
 USA.369.d:0 "国家三K党这十年间的丑闻一下子曝光了！在细致的反三K党宣传在社会上扩散开来后，印第安纳三K党的名望受到了打击，同时由于其巨龙D·C·斯蒂芬森明目张胆的贪腐行为，它也受到了越来越多的监控。最终联邦调查局以受贿的罪名逮捕了斯蒂芬森和他的保镖们。接连展开的调查活动不断加深他的犯罪严重程度，对他的同伙的采访甚至暴露了斯蒂芬森是一个性侵犯和可能的杀人犯。随着该起事件越发引起社会轰动，被怀疑是三K党成员的印第安纳州州长爱德华·L·杰克逊被迫辞职。"
 USA.369.a:0 "抓到他了！"
 USA.370.t:0 "美利坚社会党拒绝和解"
 USA.370.d:0 "社会党领导人明确表示，他们不会继续谈判下去了，用海伍德的话说，“当革命已经箭在弦上，再放任反动派简直愚不可及”。他们已经返回伊利诺伊州继续组织钢带大罢工。由于这次失败，我们承诺的和解计划已经失败，默里和朗很快也回去了自己的地盘，并认为这次真是浪费时间，双方对海伍德的恼怒甚至超过了对联邦政府。"
 USA.370.a:0 "该死"
 USA.371.t:0 "麦克阿瑟担忧协议"
 USA.371.d:0 "麦克阿瑟和军队的领导层担心，谈判只是白白给政治激进分子更多的时间去积蓄力量，以达成颠覆宪法与联邦政府的目的。同时如此漫长的谈判也是在消耗政府与军队的威信，无疑会对未来的行政与治安造成负面影响。尽管[USA.GETLeader]试图向他保证，这是实现和平的唯一途径，而美国价值观将得到保护，但麦克阿瑟提出了他的要求：授权美军参谋长联席会议最高授权，以确保政府不会无底线的同意激进党派的要求。同时需要增大对军队的开支，以确保军队能够在必要时刻镇压一切危害国家安全的势力。虽然麦克阿瑟的要求毫无疑问威胁了政府的独立性，甚至有可能会激起麦克阿瑟本人的更加巨大的野心，但毫无疑问我们需要军队作为我们的后盾，至少不要成为另一把插入民主之心的匕首..."
 USA.371.a:0 "同意他的要求，我们会在一切平稳后处理他"
 USA.371.b:0 "屈从于麦克阿瑟违背我们的民主精神"
 USA.372.t:0 "默里出走！"
 USA.372.d:0 "正如我们所料，在我们拒绝接受他的要求后，默里恼怒地离开了。他宣布[USA.GETLeader]已经与海伍德和朗为伍，现政府已不再代表美国人，美利坚的灵魂正处于危难之中。虽然政府官员试图劝导民众保持冷静，但默里的言论在全国，特别是东南部地区引起了共鸣，让旧民主党收获了许多支持，这正如顾问们警告总统的那样，完全抹消了此前遏制他们的努力。随着默里和旧民主党闹得沸沸扬扬，朗和海伍德都中止会议，回去指导各自的政党，声称只有在旧民主党的威胁得到遏制时，他们才会回来。"
 USA.372.a:0 "那你们为什么要参加谈判？"
 USA.373.t:0 "比尔·海伍德谴责警方暴力"
 USA.373.d:0 "社会党罢工仍在持续，其影响甚至蔓延到“钢带”以外的地方。示威者与警方的冲突正变得愈频繁。诺曼·托马斯等人虽曾督促美利坚劳工联合会与世界产业工人联盟罢工者采取和平手段争取权利，但这些空话并不管用——尤其是示威者遭受旧民主党和联邦派支持者挑衅的时候。比尔·海伍德公开谴责称，联邦政府拒绝保护最需要它的人才是导致街头暴力如此泛滥的罪魁祸首——“这些工人想要的，不过是份不会剥削他们的工作，也不必为这个国家的贪婪牺牲自己的血肉。”海伍德在明尼阿波利斯演讲上深情地说道，“但正相反，他们得到的是座听命于大资本家的政治囚笼。不要搞错了，政府表面上虽无动于衷，但实际上已经行动了，是统治阶级有充分意识地、捍卫本阶级权力的行动。”"
 USA.373.a:0 "我们快支撑不住了！"
 USA.374.t:0 "默里向暴君宣战"
 USA.374.d:0 "社会党罢工者并非唯一受到美国警方压制的对象，“白人联盟”民兵也正受到治安部门愈发紧密的监视。近日，阿拉巴马与南卡罗来纳州数座民兵训练基地遭到警方突袭，旧民主党内部会议也多次受到骚扰——对此，三K党领袖海勒姆·韦斯利·埃文斯痛声埋怨道：“联邦政府对我们步步紧逼，不择手段地打压我们，但我们想要的不过是个值得公民保护的政府！”他在夏洛特近期发表的演讲得到了听众热切的欢迎，旧民主党的影响力正与日俱增。"
 USA.374.a:0 "咱们走着瞧！"
 USA.375.t:0 "新年大罢工持续蔓延"
 USA.375.d:0 "社会党新年罢工正蔓延到全国各地，许多工业州的生产工作被迫陷入停滞。尤其是圣路易斯市，俨然是座真正的战区，居民们每天的生活就是看着罢工者与联邦军队、旧民主党甚至是美利坚至上党武装爆发冲突，由此激起的混乱更是引发数场市民抗议游行，但他们组织的示威活动经常演变成抢劫商铺和群体骚乱。成千上万的民众开始逃离圣路易斯城，越来越多的人请求联邦政府尽快干预其中。"
 USA.375.a:0 "灾难！"
 USA.376.t:0 "南方冲突"
 USA.376.d:0 "今天，国民警卫队与“一分钟人”武装在路易斯安那州北部爆发冲突，当警卫队员突袭民兵据点时，后者率先开火引发一场血腥屠杀。最终，四十位国民警卫队员在交火中遇害，民兵方面伤亡数字不详，但损失应远胜过联邦军队。休伊·朗与美利坚至上党坚决否认他们与南方的民兵组织有关，但对联邦政府动用国民警卫队搜查民兵训练基地的行为表示“质疑”，这不该是警察的职责吗？涉事民兵组织也对外声称他们此举是出于自卫考虑。沾满鲜血的照片很快登上南方各大媒体，当地民众对联邦政府的愤怒正日渐加剧。"
 USA.376.a:0 "他们难道不怀疑民兵吗？一点也不？"
 USA.377.t:0 "“匹兹堡大屠杀”" 
 USA.377.d:0 "宾夕法尼亚州，匹兹堡市，一小群出于义愤决心冲撞国民警卫队的罢工者或许没有意识到，这场微小摩擦所产生的火星即将点燃“钢带”革命的导火索。压抑已久的国民警卫队向人群开枪，导致五名工人死亡。这起事件迅速被传播为“匹兹堡大屠杀”，整座钢铁工业圈瞬间陷入疯狂。不久后。社会党民兵同警察与国民警卫队的战争正式拉开帷幕，该地区之上弥漫着无尽的战火。全国各地的新闻媒体都以“内战”作为今天的头版头条，民间的恐慌情绪正日益加剧。"
 USA.377.a:0 "全完了！"
 USA.378.t:0 "底特律游行"
 USA.378.d:0 "旧民主党、至上党、社会党和国民警卫队在密歇根州再次爆发了冲突，当时旧民主党指责社会党发动了又一次的罢工，促使经济恶化。随即他们指责政府软弱无力，不能消灭“骚乱的左翼分子”，并声称旧民主党是在努力完成伍德罗·威尔逊和亚历山大·米切尔·帕尔默消灭激进分子的理想，而高高在上的联邦政府官僚反而同情起了他们，政府中的少数派甚至同时和社会党与至上党协作。旧民主党的官方公文指责至上党纵容政治腐败和官僚主义的盛行，并称政府内的少数族裔同至上党、社会党同流合污。他们最后说，他们正在底特律组织游行，以抗议社会主义者的行径。"
 USA.378.a:0 "这可不妙"
 USA.379.t:0 "有组织的反抗议！"
 USA.379.d:0 "作为对最近如克莱尔·霍夫曼一类的旧民主党人帮助组织了“底特律大游行”的回应，比尔·海伍德宣布，红色民兵将出现在现场进行反抗议行动，以保护罢工者、工人和社会主义者免受“反动极端分子、种族主义者和沙文主义者”的伤害，并警告旧民主党人远离他们的队伍，声称“如果反动势力在革命的大门口窜来窜去，他们会为之后悔的。”毫无疑问，休伊·朗不喜欢默里对他的侮辱，也不喜欢海伍德出现在聚光灯下。作为回应，他宣布，“一分钟人”将向美国人展示，在这黑暗时代，真正的美国精神仍在人间，并保护美国公民不受旧民主党人和社会主义者的伤害。尽管各方的行为和背后动机都饱受批评，但毫无疑问，事件的结局会很糟糕。"
 USA.379.a:0 "局势愈发混乱了"
 USA.380.t:0 "血洗底特律"
 USA.380.d:0 "游行结束得和开始时一样快，而且不出所料，成了一场灾难。社会党和旧民主党互相指责是对方打响了第一枪，目前还不确定是谁挑起了这场激烈的战斗，但不管是联邦政府、一分钟人民兵、社会党人还是旧民主党人，骚乱甫一爆发，他们就打成一团，几乎分不清彼此。然而，结果很明显，社会党在该地区的支持者太多，其他派系不得不撤退。美国正在迅速崩溃，骚乱的死亡人数远远超过200人，这使得联邦政府的软弱无能已经完全暴露出来，任何一方都不再寄希望于依靠他们维持秩序来对抗其他人。除此之外，报纸上还指责国民警卫队与别的派系，具体哪个派系取决于报纸的后台是哪一派，一起造成平民死亡。"
 USA.380.a:0 "现在怎么办？"
 USA.381.t:0 "妥协失败！"
 USA.381.d:0 "看来我们太自大了。虽然我们对民兵总部的最初几次突袭顺利完成，但在试图在密苏里州南部逮捕一分钟人时我们遭受了失败，导致34人死亡，包括12名国民警卫队和22名一分钟人。旧民主党和社会党的激进分子开始怀疑我们的用意，并同样选择了对国民警卫队开火。威廉·H·默里、比尔·海伍德和休伊·朗现在终于可以在一件事上达成共识：我们不值得信任。毫无疑问，他们已经逃回家中，准备在自己的人身自由受到威胁前做出反击。"
 USA.381.a:0 "战争不可避免了"
 USA.382.t:0 "针对朗家族的调查"
 USA.382.d:0 "财政部与司法部近期联合发起了一项针对休伊·朗及其家族的政治与财政调查。尽管“王鱼”本人早已在全国政坛声名显赫，但随着至上党的狂野扩张，各界关于朗氏家族的政治机器与贪腐、裙带与金权政治的传闻愈演愈烈。调查报告显示，厄尔·朗涉嫌利用公职便利向路易斯安那州的私人企业提供政府合约，并通过复杂的政治捐款网络从路易斯安那的石油、建筑与工业巨头手中收受政治献金。这些资金据称部分流入了至上党的地方支部账户，用以维持其庞大的宣传与基层组织机器。毫无疑问，无论这些事实的真实性如何，这都是我们用以打击至上党的绝佳武器，甚至能一举摧毁至上党的政治机器。"
 USA.382.a:0 "好事"
 USA.383.t:0 "独立联盟脱离社会党"
 USA.383.d:0 "在与联邦政府达成初步协议后，社会党内部由于矛盾重重开始分裂。以独立联盟为首的一部分温和社会党人逐步脱离社会党阵营，投向建制派们的怀抱。而一石激起千层浪，以福斯特为首的激进社会党人也开始谴责党内的温和分子，并大有步独立联盟后尘，脱离社会党的趋势。尽管最终并未引发进一步的分裂，但社会党如今已经不再是一个团结的，反对联邦建制派的激进政党了。"
 USA.383.a:0 "赤色分子自己内斗起来了"
 USA.384.t:0 "哈里·伯德谴责政府"
 USA.384.d:0 "尽管联邦已经禁止各州的反种族通婚法律并要求州政府遵从联邦决议，但在南方州还是迎来了强烈的抵制与抗议。以南方民主党人哈里·F·伯德为首的保守民主党人与旧民主党和白人联盟共同声讨联邦政府与国会，称这是对地方传统与社会秩序的背叛。同时旧民主党与白人民主联盟迅速借机鼓动情绪，他们声称这一法案不过是北方激进派与有色人种阴谋的产物，是“道德的崩塌”。然而北方州与进步主义者则欢呼雀跃，甚至社会党都罕见的表达了对政府的支持。毫无疑问，尽管南方极度不满，但我们还是赢得了大部分人的支持。"
 USA.384.a:0 "好的开始"
 USA.385.t:0 "总统解禁言论管制"
 USA.385.d:0 "今日，阿尔夫·兰登总统在华盛顿发表了一场举国瞩目的演说。这位出身堪萨斯、以温和理性著称的总统，在国会山前面对成千上万的听众与无数收音机听众，谈论了他对“自由”一词的理解。\n\n“我们不能仅在安宁时谈论自由，”兰登说道，“自由之所以珍贵，正因它在最危险的时候仍需被捍卫。若政府以恐惧为名，剥夺人们发声的权利，那么这片土地就不再属于公民，而属于沉默。”出人意料的是，兰登总统并未在如此危难时刻加大言论管控力度，而是宣布撤销了对一些同情左派和极右派的报纸行业与媒体的禁令。这项举措被建制派联盟内的相当一部分人视为总统对激进派的又一次屈服，更加激进的国会成员们甚至已经在筹划弹劾总统。尽管如此，兰登总统的政策还是赢得了大众的支持，也进一步挽救了政府的声誉。"
 USA.385.a:0 "但愿这一切有用"
 USA.386.t:0 "[USA.GETLeader]主张企业救济"
 USA.386.d:0 "新总统当选为华尔街提供了求之不得的喘息机会。[USA.GETLeader]承诺的温和自由主义正合交易者的意见，而国家也正需要足够的金融复苏力度以稳定时局。然而，如此有限的回升也是依赖于救济立法的承诺——离了它，行情就会再度回调。因此，新总统必须尽快向国会通过法案以挽救已经深处谷底的美国经济。联邦救济法案将简单明了的将足够的金融预算注入到即将失业的中小企业中，以确保它们将提振市场信心，带动经济恢复，结束失业的低迷期。建制派大多对这一提案持积极态度：尽管保守派和进步派对其救济范围各持保留态度，但都普遍承认其必要性和积极意义。然而，激进派对此反应激烈，尤其是社会党大力批评总统是在给华尔街当看门犬。为了获取足够的支持，总统与三方激进党派都进行了沟通，其中朗的要求是将救济范围扩大，以确保他的农民基本盘也能享受到救济法案。旧民主党则希望将包括福特在内的诸多大企业也一并纳入，这些企业的共同点则都是亲旧民主党或根本就是旧民主党的资金来源。至于社会党则根本不想支持这道法案。现在总统需要决定，从哪里获得足够的支持？"
 USA.386.a:0 "跟朗谈谈，同意他的要求"
 USA.386.b:0 "同意旧民主党的要求"
 USA.387.t:0 "《企业救济法案》顺利通过"
 USA.387.d:0 "令人振奋的是，在向激进党派妥协后，我们获得了足够的政治力量以通过该法案。尽管我们不得不做出让步，还被我们的同僚攻击“向国贼屈服”，但好在一切的努力都能得到回报。在下周，数以百万计的失业者将重回岗位，而持续崩盘的经济也将踩下刹车。尽管我们不能过多指望救济法案的功效，但其至少对现在的境地至关重要。"
 USA.387.a:0 "妥协的胜利"
 USA.388.t:0 "封禁《黄金时刻》"
 USA.388.d:0 "多年来，库林格神父的广播节目《黄金时刻》以其激烈的言辞与鲜明的政治立场，在全国范围内积累了庞大的听众群体。从对金融体系的猛烈抨击，到对休伊·朗的美利坚至上党的公开支持，再到对进步党政府政策的批评，他的声音已成为许多基层民众与反社会分子的不满出口。然而，随着至上党在选举中失利，节目中的言论愈发激进。部分演讲被指责煽动对联邦政府的不信任，甚至为街头对抗提供精神动员。司法部在多次警告无效后，决定依据公共安全法令，暂时吊销该节目的广播许可。库林格神父在至上党的集会上咒骂政府违背了言论自由的基本权利，但反响平平。《黄金时刻》的电波沉寂了，但围绕民粹主义的煽动的斗争却远未结束。"
 USA.388.a:0 "早该管管了"
 USA.389.t:0 "工作分担的新常态"
 USA.389.d:0 "随着工作分担计划在全国范围内正式实施，许多地方迅速感受到了变化。在宾夕法尼亚的钢带城市，工厂大门前的排班表变得前所未有地复杂，工人们不再连续工作六天，而是轮班三天。曾经长达十数小时的高温炉前作业，如今也变成了分段式时间表。尽管收入有所减少，但政府补贴使得大多数家庭仍能维持基本的生活节奏。\n\n在蓬勃发展的机械修理业和新兴培训中心，人们开始接触焊接、车工、机床维护乃至新型化工设备操作。尽管部分工人对此有所抱怨，但好在我们与企业的补贴使得这种不满被压倒了最低。而在钢带区，这项政策则反响不一：工人们由于收入没有多少波动，因此并无抗议，反而是社会党对此剧烈抨击。而在南方，由于在旧民主党支持下部分地主与农场主拒绝参加政府计划，许多佃农与黑人劳工依然被迫接受更低的工钱。在大平原，小城镇的商会正在强烈抗议该计划“干涉市场秩序”。但无论态度如何、反响如何，工作分担计划正发挥着它应有的作用，缓慢但有效的挽救我们的经济。"
 USA.389.a:0 "一步步来"
 USA.399.t:0 "复归如常"
 USA.399.d:0 "在长达数月的政治博弈与社会动荡之后，美利坚的命运终于再度回到了正轨。事实已经证明，国家即将被被带回由法律与秩序主导的正轨。在联邦政府竭尽全力地促成妥协与谈判后，曾经暴力冲突频发的钢带区与深南地区彻底回归了平静。各地的准军事组织与民兵团体或被解散或是被吸纳入国防体系，而美利坚至上党与旧民主党的政治机器则遭到了重大打击，各地盘根错节的政治网络也被联邦调查局彻底撕碎。随着关键人物被起诉、地方组织被接管，3k党这个曾经依靠南方政治与极端主义勉强维系的组织迅速土崩瓦解。尽管地方自治计划仍然为激进党派保留了生存的土壤，但随着局势的稳定与经济的不断振作，留给煽动分子与野心家们的机会也将无影无踪。美国终于迎来了久违的平静。街头不再被制服与臂章占据，政治斗争重新回到了国会与选票之中。尽管裂痕尚未完全愈合，但至少在这一刻，共和国重新站稳了脚跟。"
 USA.399.a:0 "终于稳定了"
#加纳1936
 USA.400.t:0 "约翰·南斯·加纳的就职典礼"
 USA.400.d:0 "今天，约翰·南斯·加纳正式宣誓就任第31任美国总统。加纳的就职演讲提到，总统绝不愿让美国的民主价值观向激进主义妥协，无论他们自称进步还是保守。引用他本人的话来说：“我们必须坚定地认识到，建设美好国家的道路必然是漫长而艰巨的。”——南斯·加纳总统的经济政策，主张牺牲个人生活、采取普遍紧缩政策，就像1893年经济危机时联邦政府所做的那样。美利坚至上党与社会党并不看好这位新总统，共和党人也对他的施政保持警戒，尽管如此，自信的约翰·南斯·加纳总统对外承诺，朗派与工团暴徒将在一年内消散殆尽"
 USA.400.a:0 "上帝保佑美国"
 USA.401.t:0 "总统宣布强硬路线"
 USA.401.d:0 "[USA.GetLeader]总统今天宣布他将采取强硬路线对抗社会党罢工者，这段发言实际上也涵盖“任何企图破坏美国社会的极端势力”。新发布的总统令已勒令钢带区的所有暴动者打道回府，并要求美利坚至上党与旧民主党的民兵组织解除戒备，否则总统将采取直接的军事行动。为此，全体极端党派议员已决定集体退出会场以示愤怒，共和党与民主党议员则乘机奚落他们的处境，这愈发增添了公众认为这座国家正走向崩溃的感触。"
 USA.401.a:0 "我们将取得胜利"
 USA.402.t:0 "埃德加·胡佛的提案"
 USA.402.d:0 "联邦调查局局长埃德加·胡佛今天一早抵达白宫，严肃地告知总统[USA.GetLeader]，内战已经迫在眉睫。他认为联邦政府最好的机会，就是现在采取果断的行动，在至上党、社会党和旧民主党彻底做大前解决他们。对休伊·朗的检举将意味着至上党的崩溃，因为该党几乎是以他个人的人格魅力强行组建起来的。同时，对比尔·海伍德的起诉将使社会党陷入混乱，而世界产业工人联盟和美利坚劳工联合会必然会在党内争夺领导权……至少这能为我们眼前的危机拖延足够多的时间。把威廉·默里关进监狱，肯定会让他的支持者产生怀疑，也许能因此彻底结束旧民主党的威胁。我们也有足够的理由追捕D·C·斯蒂芬森或厄尔·白劳德，他们各自阵营中的影响力并不算大，但仍然是重要的人物，我们可以在他们身上找到一些线索。这些线索将使我们决定打击的派系失去合法性，但可能不足以结束这场危机。尽管如此，胡佛表明，如果政府需要联邦调查局采取行动，就必须马上下令，因为我们只有一次行动的时间。"
 USA.402.a:0 "我们没有足够的预算"
 USA.402.b:0 "该把这些反政府分子查个底掉了"
 USA.403.t:0 "针对休伊·朗的调查"
 USA.403.d:0 "在我们的支持下，埃德加·胡佛与他的调查员小伙子们对休伊·朗与美利坚至上党政治机器动手了。尽管在突袭至上党支部办公室时因与一分钟人产生武装冲突而损失了数位探员，但我们搜集到的证据也算物有所值。朗和他的狗腿子们在数年间将整个路易斯安那经营的密不透风，从州政府到职员乃至看门人，几乎所有公共职位都被纳入朗政治机器的管辖之下。而在这个联系紧密的庞大关系网下，腐败已经是我们所调查出的罪证中最微不足道的一项。\n\n朗在路易斯安那为自己的每一个家人都安排了政府位置，而对于自己的亲信与兄弟厄尔·朗，则将负责竞选的资金交由他管理，并通过各种隐秘的手段与资金转移将大量的州政府预算贪墨入至上党的私人腰包。同时，无限扩张的一分钟人在路易斯安那横行霸道，而由于州政府与法庭塞满了朗本人的亲信，朗的狗腿子们的违法行为也被包庇，其中甚至包括了两桩血案。探员们还突袭了朗本人开设的私人企业——“赢或输石油公司”，并发现这个公司与路易斯安那的包括标准石油在内的诸多大公司来往密切。毫无疑问，休伊·朗在国会高声推销着他的“共享财富”计划，而私底下仍旧与大亨们蝇营狗苟。\n\n现在，摆在我们面前的选择很明确，尽管我们难以真正抓捕这位民兵头子，但如果能够向社会公布这些朗的犯罪证据，将会极大打击他在支持者中的威信，也会重创他的政治声望。或者我们可以选择与这位民粹煽动者达成一定的妥协，以确保他们能够安分下来，甚至帮助我们打击其他叛贼。"
 USA.403.a:0 "向社会揭露这些证据"
 USA.403.b:0 "我们的伟大的“王鱼”一定会接受我们的提案的"
 USA.404.t:0 "至上党屈服了"
 USA.404.d:0 "在我们的证据威胁以及让步条件的诱惑下，朗宣布他将停止对政府的攻击，并加强对一分钟人与至上党党员的约束。随着时间推移，美利坚至上党的政治能量与资本将大不如前，而我们现在终于能将手头的资源转向其他的反政府政党与准军事组织。"
 USA.404.a:0 "我们的任务还没结束"
 USA.405.t:0 "朗的威信扫地！"
 USA.405.d:0 "在如山一般的证据面前，大量的至上党支持者认为他们受到了他们曾经深信不疑的领导者休伊·朗的欺骗，选择脱离至上党阵营。尽管朗本人在巴吞鲁日的政党集会上大肆批评了这些证据的真实性，并将其扭曲成“政治谋杀”，但实际效果极其有限。过去因朗的腐败政策而影响到生活的公民也纷纷站出来指证朗与他的亲属的不法行为。毫无疑问的，我们的攻势已经彻底摧毁了这位路易斯安那的皇帝的根基，现在朗尽管还指挥者一分钟人不断制造冲突与暴力事件，但美利坚至上党此时已经成为了一个不断流血的伤者，并在未来将因失血过多而死。"
 USA.405.a:0 "大骗子滚吧！"
 USA.406.t:0 "调查海伍德"
 USA.406.d:0 "自世界产业工人联盟在钢带区迅速扩张以来，其领袖比尔·海伍德便始终处在联邦政府的视线之内。随着社会党在地方政府、工会与准军事组织中的影响力不断加深，白宫已无法再将这些动向视作单纯的劳工问题。约翰·兰斯·加纳总统在就任后不久，便指示司法部与联邦调查机构展开一项针对海伍德及其核心圈层的正式调查。\n\n埃德加·胡佛与FBI探员重点审查了世界产业工人联盟的资金来源、组织结构与跨州活动记录。部分线索显示，海伍德与多起未经批准的工人武装集会、铁路瘫痪行动以及地方政府施压事件存在直接或间接联系。而司法部在递交给总统的内部报告中承认，目前掌握的材料并不足以立即将海伍德送上法庭。然而，社会党在钢带区的组织活动与仍然如火如荼的新年罢工已经极大的威胁了如今的社会稳定。\n\n对我们来说，尽管该项调查无非是将老生常谈的问题再度摆上台面，但胡佛的工作的确有所成效。社会党在钢带区的组织结构网络极大程度依托城市，尤其是以芝加哥，底特律等工业重镇为核心。只要政府能够一方面有所成效的打击社会党的武装力量，一方面积极拉拢工人，就能有效地遏制乃至消灭社会党一直以来的威胁。"
 USA.406.a:0 "有用...但不多"
 USA.407.t:0 "调查白劳德"
 USA.407.d:0 "在联邦政府逐步开展对激进政治组织的监控之际，调查人员很快将目光投向了厄尔·白劳德。这位在社会党内部颇具争议的人物，既被视为以福斯特为首的极权主义者的代表之一，又因其对部分传统美国制度表现出的妥协态度而长期游离于党内主流之外。毫无疑问这将成为胡佛调查的突破口。在加纳总统的直接授权下，司法部与联邦调查员以涉嫌非法政治活动与跨州组织联络为由，对白劳德展开了抓捕。白劳德本人并未进行任何抵抗，很快便被拘捕并带往接受讯问。在经过一系列的审讯与问话后，联邦调查局与白劳德达成了一些合作。\n\n在随后的数日里，白劳德向调查人员提供了有关社会党内部结构、派系分布与联络渠道的情报。这揭示了来自海伍德与其他社会党中枢成员是如何直接指挥钢带区与其他工业地区的基层组织，并组织罢工与暴力抗议等活动的。在情报支持下，联邦政府迅速展开了一次协调行动。多地同步突袭工会办公室、秘密集会点与通讯中枢，数十名被认定为社会党骨干与组织者的关键人物被当场拘捕。尽管社会党公开谴责这是对工人运动的打压，但不可否认的是，这次行动对其内部网络造成了沉重打击。\n\n作为回报，白劳德将被秘密释放并监视起来。对白宫而言，这次行动不仅削弱了社会党，更为政府打开了一扇窥视社会党内部运作的窗口。胡佛局长已经向白宫提交了报告，申请总统批准后续联合军方进行的进一步的调查。"
 USA.407.a:0 "也许我们可以从内部攻破"
 USA.408.t:0 "调查D·C·斯蒂芬森"
 USA.408.d:0 "在联邦政府针对旧民主党及其外围组织的调查不断推进之际，一个名字被反复提及。D·C·斯蒂芬森，如今的3k党巨龙，如今成为了埃德加·胡佛的头号调查目标。在经过多方搜查后，联邦调查局甚至对调查行动的轻松程度感到难以置信。这位3k党大巫师对自己恶行的遮掩几乎属于自欺欺人，探员们很快就搜集了包括贪污，腐败，强奸未成年，一级谋杀与吸毒等诸多罪名。埃德加·胡佛提醒我们，这些罪名足够斯蒂芬森在牢里蹲上一百多年，甚至在我们的运作下能给斯蒂芬森弄个死刑。\n\n通过对斯蒂芬森的顺利抓捕，旧民主党在南方的政治网络终于被撕开了口子。更加令我们感到兴奋的是，贪生怕死的斯蒂芬森在牢里为了不被判死刑，向调查局与司法部透露了几乎所有3k党的违法与犯罪证据，其中甚至联系上了旧民主党的高层。有了这些证据，我们足以一步步捣毁旧民主党在南方的整个政治机器。"
 USA.408.a:0 "等待他的只有审判"
 USA.409.t:0 "调查威廉·默里"
 USA.409.d:0 "随着联邦政府着手对南方展开调查，前俄克拉何马州州长、“苜蓿比尔”威廉·默里成为了胡佛与联邦调查局的头号目标。尽管他始终以“反建制”“反华尔街”的姿态示人，但司法部与调查委员会掌握的材料显示，旧民主党长期对包括3k党与黑色军团这样的准军事组织与暴力团体予以资金或支持或是政治庇护。默里在任内在南方留下的政治网络并未随着卸任而瓦解，反而被重新整合进旧民主党的架构之中，并在如今的深南地区拉成了一个密不透风的政治网络。大量的政府资金与私人捐款被秘密收下并成为旧民主党攻击联邦的武器。\n\n在加纳总统的批准下，大量的证据被提交联邦最高法庭，在随后的缺席审判中，默里被指控犯多项联邦重罪，并被缺席判决监禁三十年。然而，我们的调查并未真正威胁旧民主党在南方的根基。尽管默里的政治声誉收到了一定的影响，但由于我们无法真正抓捕默里，因此旧民主党仍然在事实上盘踞在南部诸州。现在为了进一步打击旧民主党，我们只有从3k党下手，或是直接诉诸武力解决。"
 USA.409.a:0 "该死"
 USA.410.t:0 "斩断蛇头"
 USA.410.d:0 "通过对社会党的数次抓捕与突袭，我们扫荡了钢带区以外的社会党的几乎所有力量。而在社会党的老巢内，我们也抓获了一批赤色分子。在其中，一位名叫莫里斯·詹姆斯的秘书向我们招供，并透露了社会党首脑们，包括海伍德，里德，坎农与戴等人的行程。这些赤色分子首脑将在四天后在芝加哥进行集会，同时将号召工人们加大当前的罢工力度，以继续向联邦政府施压。对于这份宝贵的情报，总统下定决心一举铲除社会党的所有高层，以彻底结束钢带区的混乱情况。麦克阿瑟为首的军方向总统提出，可以指派军队中的一些潜入专家与爆炸物专家来策划一场爆炸案，以此将整个美利坚社会党的核心全部送上天。然而，这种行动如果不能斩草除根，那么一定会将钢带区的局势彻底引爆。而联邦调查局的局长胡佛则提出，通过威胁控制一些被捕的社会党成员伪造一起车祸，即在社会党高层在芝加哥市中心参加工人集会时冲进会场以达到刺杀的目的。这样做的好处是如果掩饰得当，这将被认为是一场惨痛的意外而非刺杀。尽管赤匪们一定会拿这件事大做文章，但只要舆论站在白宫一边，情况就仍然可控。"
 USA.410.a:0 "遵循麦克阿瑟的提议"
 USA.410.b:0 "胡佛的计划不错"
 USA.411.t:0 "芝加哥正燃烧"
 USA.411.d:0 "在一切就绪后，总统批准了麦克阿瑟的计划。在芝加哥的工人集会上，一枚大当量炸弹被当场引爆。麦克阿瑟的炸弹刺杀计划尽管造成了数十名社会党成员与工人的惨死，但包括海伍德与里德在内的多名高层却大多只受轻伤。由于不知名原因，炸弹的预计爆炸地点与实际爆炸地点有所偏移，这导致这场刺杀更多的消灭了工人而非社会党成员。海伍德在随后向全国发布了谴责声明，同时整个芝加哥城已经彻底陷入混乱。工人在街头与警察对垒，而本地驻军甚至遭到了民兵的袭击。从芝加哥开始，整个钢带区正在一点点脱离联邦掌控..."
 USA.411.a:0 "进驻钢带，尽一切手段平息事态"
 USA.412.t:0 "赤匪授首"
 USA.412.d:0 "在一切就绪后，总统批准了胡佛的计划。在芝加哥的工人集会上，一辆失控的卡车直奔主席台而去。在混乱，哭喊与烟雾中，大量的社会党骨干都惨死在卡车的车轮之下，而海伍德则是在混乱中受重伤。尽管仍有一部分社会党成员安然无恙，但毫无疑问这场斩首行动是成功的。海伍德重伤住院，而其他的健全骨干则很快陷入内斗。媒体与民众都为这次意外事件而感到惊讶与遗憾，而至上党与旧民主党尽管怀疑政府主导了这次意外，但也为自己失去了一个强劲的政治上的对手而感到欣喜若狂。伴随着社会党的领导层的崩塌，点燃整个钢带区乃至全国的工人运动已经逐渐开始熄火，而国民警卫队正在被派驻进城市维持秩序。"
 USA.412.a:0 "钢带秩序井然"
 USA.413.t:0 "钢带叛乱！"
 USA.413.d:0 "我们收到了一些坏消息，在我们调集足够的武装力量进入钢带前，局势就已经失控了。越来越多的工人加入了社会党，而国民警卫队的全线溃退、游击队愈发猖獗的袭扰、赤卫队在芝加哥和底特律的街道上设置的更多掩体已经彻底昭示着钢带区脱离联邦。麦克阿瑟对此极度愤怒，认为如果没有政府的掣肘，胜利并非遥不可及。在一场与总统的不愉快的会面后，这位军方领导者开始私下里联络忠诚于自己的士兵。同样，旧民主党人也很不满，他们同样在社会党的控制区遭到了攻击，许多旧民主党支持者正向钢带的南部地区撤退。"
 USA.413.a:0 "该死！"
 USA.414.t:0 "3k党瓦解"
 USA.414.d:0 "经过数月的联邦调查、司法起诉与地方政治压力，3K党的组织网络终于开始崩解。其资金来源被冻结，关键人物被定罪，地方分支接连宣布解散。曾经以恐吓与秘密结社维系的影响力，如今正迅速衰退。白宫声明指出，任何试图通过恐怖与仇恨左右国家方向的组织，都将面对法律的审判。在南方部分地区，仍有支持者低调表达不满，但大多数地方精英已选择与3k党保持距离。联邦与州政府之间的合作，使这场长期存在的阴影终于被驱散。曾经象征威胁的白袍逐渐消失，尽管美国或许仍面临挑战，但至少在这一战线上，我们赢得了一场明确的胜利。"
 USA.414.a:0 "令人振奋"
 USA.415.t:0 "军事行动准备完成！"
 USA.415.d:0 "在总统的批示下，联邦调查局已经被批准对社会党开展更加深入的调查，而以麦克阿瑟将军为首的强硬军人则被要求制定打击钢带区罢工的计划。随着时间的推移，钢带区的罢工活动与暴力示威愈演愈烈，留给联邦政府的事件已所剩不多。然而，如今的人手与武装难以彻底的覆盖钢带区，而我们没有时间继续等待军人们动员与集结。如果总统决定以现有的人手进行行动，那么势必将会有漏网之鱼逃出我们的包围，进而进一步激化局势。而马歇尔将军则认为，对钢带区进行全面镇压是不必要的，而是应该重点打击社会党集会的数个城市，并通过更加稳妥的渗透来摧毁整个社会党在钢带区活动的网络。留给白宫的时间已经所剩无几，总统必须即刻做出决策。"
 USA.415.a:0 "命令麦克阿瑟进驻钢带"
 USA.415.b:0 "遵循马歇尔的建议"
 USA.415.c:0 "联络休伊·朗，征调他的人手"
 USA.416.t:0 "与麦克阿瑟的谈话"
 USA.416.d:0 "在白宫的一间侧厅内，总统与陆军参谋长道格拉斯·麦克阿瑟进行了长时间会面。南方局势与街头冲突使军方的角色愈发敏感，而麦克阿瑟在公开与私下场合中都表现出对国家秩序的强烈关注。随着政府不断依靠军方平息事态，军队的权威也在随着时间推移不断增强。麦克阿瑟明确表示，军队的首要任务是维护联邦统一，但军人们也无法长时间作为联邦政府的黑手套存在。参谋长本人还向总统暗示军队内部对政府的议论已经达到了前所未有的高峰。对于加纳总统来说，通过增加军费与扩充编制来稳固军方支持无疑是最直接的办法。然而麦克阿瑟本人的野心则是无法被预测的。同时由于财政紧缩政策的推行，联邦政府也很难再调拨大笔预算以供养军队。因此逐步剥离麦克阿瑟对军队的影响力，转而提拔更加忠诚于国家的军官也不失为一种办法。"
 USA.416.a:0 "听话的好狗"
 USA.416.b:0 "彻查他，让他滚蛋"
 USA.417.t:0 "财政紧缩法案"
 USA.417.d:0 "今天，加纳总统正式将《财政紧缩法案》递交国会，这项要求政府全面削减开支的法令注定引起广泛争议——特别是军事预算和联邦建设项目预算。加纳总统向参议院指出这是美国从大萧条中恢复过来的必要牺牲，并尝试提振市场信心，因为之所以决定削减预算，正是因为内阁认为大萧条已经接近尾声了。而大多数激进派议员都对这套说辞感到非常搞笑，即便是总统内阁也对此持保留意见，认为通过这道法案不是项容易的工作……尽管如此，如果我们能有效实践这些政策，鼓动全美私人投资者的信心，美国肯定会得到拯救。然而，激进党派对此感到愤怒，朗与海伍德立即对此作出谴责。休伊·朗在他向路易斯安那选民进行的演讲中指出，财政紧缩政策与振兴美国经济真正需要的手段背道而驰。加纳总统的新政没有使财富分配更加均衡，反而从最需要救济的那批公民手中榨取了最后一枚硬币，普通民众将因此变得更加贫困无助，工团主义和反动言论会更为广泛地成为舆论主流。休伊·朗承诺自己将领导美利坚至上党驳斥这道法案，以国家利益之名坚持到底。"
 USA.417.a:0 "我们不在乎这些煽动家们的呶呶不休"
 USA.417.b:0 "与休伊·朗谈判，争取他们的支持"
 USA.417.c:0 "呼求建制联盟支持，以反对激进势力"
 USA.418.t:0 "首都示威活动激进化"
 USA.418.d:0 "抗议紧缩法案的工人与罢工者聚集在华盛顿表达他们的不满，今天，当警察受命驱逐示威者时，现场开始爆发骚乱。社会党成员宣称他们的抗议活动是和平的，正是警方干预才迫使群众不得不做出反应。无论真相是什么，事件已经演变街头混战，短短两天内，上百名示威者在事故中受伤。社会党领袖比尔·海伍德已向外界发表谴责，华盛顿警方的做法无疑是野蛮的帝国主义镇压行为。"
 USA.418.a:0 "这群狂徒刁民！"
 USA.419.t:0 "新年大罢工持续蔓延"
 USA.419.d:0 "社会党新年罢工正蔓延到全国各地，许多工业州的生产工作被迫陷入停滞。由于政府在对抗社会党与工会分子上的手段难以平息局势，工团主义者的煽动公式开始从钢带区逐渐蔓延到全国范围。而在钢带区，政府武装力量机会每天都在与社会党民兵发生冲突。尤其是圣路易斯市，俨然是座真正的战区，居民们每天的生活就是看着罢工者与联邦军队或竞争对手的民兵武装爆发冲突，由此激起的混乱更是引发数场市民抗议游行，但他们组织的示威活动经常演变成抢劫商铺和群体骚乱。成千上万的民众开始逃离圣路易斯城，越来越多的人请求联邦政府尽快干预其中。"
 USA.419.a:0 "该死"
 USA.420.t:0 "紧缩法案投票开始"
 USA.420.d:0 "尽管初步预期并不乐观，今天，美国国会正式就《财政紧缩法案》组织投票。虽然民主党参议员坚定支持总统的提案，来自激进党派与反对派的反对意见还是太过沉重。现场还有众多议员持观望态度，甚至一些议员受到来自我们对手的煽动转而背弃我们。在投票现场，一小撮支持社会党的议员甚至与民主党的两名议员爆发了剧烈冲突，进而最终导致了投票陷入僵局。尽管投票陷入了暂停，但我们即刻可以利用这多余的时间来为我们争取更多的支持。如果没有其他外力干预，这项法案恐怕很难得到通过。"
 USA.420.a:0 "说服其他党派"
 USA.420.b:0 "我们不需要他们"
 USA.421.t:0 "亚特兰大暴力事件"
 USA.421.d:0 "我们对旧民主党与白人联盟的数次无功而返的行动最终酿成了苦果。意识到自己已经成为联邦政府打击对象的白人联盟纠集了一批武装分子，同时袭击了我们在亚特兰大的联邦调查局安全屋与政府机关。几乎所有的探员与数名政府官员遭到了残忍杀害，而旧民主党则将这桩惨案宣布为联邦政府软弱无能的直接证据。惨烈的牺牲与舆论压力使得我们的处境极为不利，而南方地区的分离主义倾向已经再清晰不过。任何有识之士都能看出，南方的第二次叛乱已经箭在弦上。"
 USA.421.a:0 "叛徒！"
 USA.422.t:0 "紧缩法案未获通过"
 USA.422.d:0 "在过去的数周里，加纳总统与其核心幕僚几乎将全部精力投入到了这项被视为“止血之策”的紧缩法案之上。面对财政赤字扩大以及金融市场持续动荡的现实，以总统为首的民主党人坚信，唯有通过削减政府开支、冻结部分补贴并暂缓社会改革项目，才能为联邦财政争取喘息的空间。然而，社会党仍旧毫不掩饰其反对立场，并威胁一旦法案通过，将发动全国范围的罢工与抗议。而至上党则继续他们反对紧缩法案的立场，持续在社会上攻击政府的任何举措。\n\n更加雪上加霜的是，原本态度暧昧的中间派纷纷选择退缩，宁愿保持沉默，也不愿公开站到总统一边。最终，当法案进入表决程序时，支持票远远未能达到通过所需的门槛。总统的努力宣布失败，而政治的动荡则加大了社会的混乱。人们对这届白宫政府的信心也随之跌落谷底。"
 USA.422.a:0 "国会现在连个屁用也没有"
 USA.423.t:0 "紧缩法案通过"
 USA.423.d:0 "总统的妥协方案与政治上的团结举措终于为政党与国家带来了好消息。在不断的斡旋，让步，谈判与劝说后，总统终于为财政紧缩法案呼求到了足够的支持。激进党派中的一些温和成员转向支持法案，而中间派则大多宣布支持同样为保卫民主制度而战的总统。在最终的表决程序上，支持法案通过的票数远远多于社会党等激进派所投下的反对票数。这不仅是总统以及建制派联合的一次大胜利，更是对所有想要保卫民主制度的政客们的一剂强心针。此外，经过此次失败，激进派们的势力也有所分裂，这对加纳总统来说更是意外之喜。"
 USA.423.a:0 "感谢上帝"
 USA.424.t:0 "第三方党派们的陨落"
 USA.424.d:0 "随着民主党旗下的工会与政治机器影响力在南方甚至是部分钢带地区越来越大，民主党开始重新吸收曾经被旧民主党，至上党以及社会党夺走的成员，这导致原本能挑战共和民主两党的第三方党派势力重新衰退到了地方政党水平。虽然朗的至上党仍然是最成功的，但现在已经只能沦为主要基地路易斯安那州和一些民粹主义地区的管理者，他在国会中的影响力能保留下来，也只是因为他与进步人士之间的合作。然而，随着乔治·诺里斯、海勒姆·约翰逊和其他进步派人士重返共和党阵营，共和党已经逐渐侵蚀了进步党的影响力。与此同时，旧民主党和白人联盟固然还在东南部有立足之地，但或多或少地要么重新被纳入民主党之下，要么沦向边缘地位。社会党的风头已然不在，它丧失了革命的信誉，也不再能轻易地指挥工人们，长期而言，社会党基本上不再可能占据众议院以外的席位。似乎美国两党制的稳定在国家层面终于得到了维护，激进分子们已无容身之地。"
 USA.424.a:0 "他们真的以为自己终结的了自由民主吗？"
 USA.425.t:0 "媒体大王的站台"
 USA.425.d:0 "在与媒体巨头威廉·伦道夫·赫斯特的数次闭门会谈后，其旗下报纸与广播网络的立场出现了明显转变。原本对政府政策保持观望甚至批评态度的社论，如今开始强调秩序恢复的重要性。赫斯特的传媒帝国覆盖全国多个大城市，其支持意味着舆论风向的重大调整。大行其道的黄色新闻帝国在赫斯特的指导下开始为联邦政府开动宣传机器，并迅速将其他政党的宣传媒体的生存空间挤占。尽管白宫方面没有公开承认达成任何政治协议，但部分政策细节的修改与某些经济承诺的释放，已经足以说明双方达成了某种默契。无论动机如何，赫斯特的站台迅速改变了政治格局。曾经动荡的媒体环境，开始向政府倾斜。"
 USA.425.a:0 "政治就是利益交换的艺术"
 USA.449.t:0 "激进势力彻底被粉碎"
 USA.449.d:0 "在钢带各企业同意提高工人工资，赤卫队继续被政府军打得落花流水后，越来越多的工人认为联邦政府比社会党更能为其提供稳定的保护和收入来源。既然公开反抗已无希望成功，许多社会党的领导人开始倾听党内温和派的声音，呼吁各方保持冷静，结束敌对状态。他们指出，双方仍然可以通过国会协商出更好的条件。"
 USA.449.a:0 "我们拯救了祖国"
#胡佛1936
 USA.450.t:0 "总统的就职典礼"
 USA.450.d:0 "赫伯特·胡佛在国会山前再次宣誓就任总统。寒风之中，观礼人群并不算庞大，但至少秩序井然。胡佛在演说中强调，美国必须在动荡中保持理性，不能向左翼或右翼的激进浪潮屈服。他引用自己早年的话语——“美国本身就是一次伟大的社会和经济实验，动机高尚，目的深远。”——并将其作为当前政策的基石。他承诺恢复财政纪律、重建工业信心，并重申对宪政秩序的尊重。然而，台下的掌声并不整齐。部分州代表的表情冷淡，媒体评论员也在私下议论选举结果的争议。"
 USA.450.a:0 "美利坚团结一心！"
 USA.451.t:0 "三六年大选的骚乱"
 USA.451.d:0 "随着胡佛在1936年选举中意外胜出，多座工业城市爆发示威与冲突。社会党支持者指控选举程序不公，而三K党与地方民兵则走上街头高呼口号。警察与示威者的对峙迅速升级为暴力冲突。部分地区铁路被临时封锁，商铺关闭，州长向华盛顿请求协助。军方单位进入待命状态，但是否直接介入仍在讨论之中。街头局势尚未失控，却也远未平息。城市夜空中不时传来警笛与呼喊声。"
 USA.451.a:0 "我希望永远不会再有一个三六年了"
 USA.452.t:0 "四年光阴，一败涂地"
 USA.452.d:0 "回顾往昔，1928年，胡佛正是凭借“回归常态”的承诺，在威尔逊与帕尔默时代之后赢得了压倒性的胜利。然而这一承诺最终也未能扭转一切，相反经济大萧条彻底的摧毁了美国经济，也对赫伯特·胡佛的政治信誉予以重击。1932年，他却险些败选，最终依靠众议院的斡旋以及民主党内部的分裂，才以微弱优势保住了总统宝座。然而，这场皮洛士式的胜利并未带来稳定，反而彻底消耗了他所剩无几的政治信誉。如今，在第三个任期的开端，经济崩溃、社会撕裂与自然灾害同时降临，美利坚合众国的根基正在剧烈动摇。\n\n失业的公民们讥讽地把如今已经遍布全国的棚户区成为“胡佛村”，以此感激他们的著名的人道主义总统如今让他们落到了如此境地。尽管在过去四年中赫伯特·胡佛的确做出了一些挽救经济的尝试，但这些束手束脚的政策宛如杯水之于汪洋，所带来的也只是财政危机的进一步加剧。此外，天灾也似乎想要在胡佛摇摇欲坠的政治生涯上来上一脚。黑风暴——或许是北美近千年来最严重的自然灾害——已经肆虐大平原各州将近七年之久。农田化为沙海，城镇被迫废弃，成千上万的家庭踏上逃亡之路。就在近日，沙尘暴的规模与强度再度升级，席卷范围进一步扩大，似乎作为祂送予胡佛的庆祝礼物。现在，全美各地开始出现大规模示威活动。失业者、破产农民、激进组织与地方民兵纷纷走上街头。示威迅速演变为骚乱，而骚乱又滑向暴力。红带、圣经带与小麦带的部分地区事实上已经脱离了联邦政府的有效控制，地方秩序崩塌，无政府状态正在蔓延。"
 USA.452.a:0 "你还有什么必胜牌吗赫伯？"
 USA.453.t:0 "社会保障和住房法案"
 USA.453.d:0 "社会保障法案是由罗伯特·瓦格纳起草的，该法案内容显然受到了至上党的弗朗西斯·汤森的影响。因此，尽管这一法案在1935年得到了国会内一些至上党议员的支持，但共和党人、民主党保守派和旧民主党人都认为该法案过于激进。与此同时，社会党成员和至上党的激进分子反而称该法案过于温和。因此，该法案在1935年未能被国会通过。然而，随着美国政治光谱的转变，瓦格纳参议员看到了另一个可以通过该法案的机会，同该法案一起，他提出了他所谓的住房法案。这将允许美国政府向地方公共住房机构提供补贴，以改善这个伟大国家内贫困人口的生活条件。胡佛有足够的政治资本来支持这项法案，并有望减轻大萧条带来的一些损害。否则，我们必须寄希望于奇迹的出现以解决这场危机。"
 USA.453.a:0 "支持这一法案"
 USA.454.t:0 "黄沙漫卷"
 USA.454.d:0 "在30年代的大部分时间内，联邦政府都在想法设法解决黑风暴(Dust Bowl)问题，胡佛政府在这一问题上已经取得了一些成绩，然而，总体上，本届政府在处理整个危机上是失败的，这也被公众视为胡佛最大的失败之一。然而，胡佛现在有机会尝试解决这个问题，现在诺克斯正在推进他的平衡预算计划，因此我们手头能够被划拨处理农业危机的资金并不富裕。\n\n如今，摆在我们面前的可行计划大致可以分为数种：参众两院内的民主党人一直在努力推动追加对于那些遭到破坏的大平原各州的农村投资，虽然他们的本意是为了那些农村选票；共和党建制派和共和党保守派则正在推动提高关税，以像以前那样保护我们的农民和工人。但实际上如今的关税已经达到了一个可观的程度；共和党自由派呼吁胡佛接受自由贸易理念，他们认为这虽然不会直接解决黑风暴问题，但会降低美国的食品成本，并总体上对美国人有一定帮助。而麦克纳里参议员提出一个提高本地农产品的国内价格的计划，以此帮助我们的农民。"
 USA.454.a:0 "接受麦克纳里处理危机的计划"
 USA.454.b:0 "拥抱自由贸易的自由派理念"
 USA.454.c:0 "制定新关税来保护我们的农民"
 USA.454.e:0 "支持民主党向农村投资的政策"
 USA.455.t:0 "摇摇欲坠的巴别塔"
 USA.455.d:0 "值此多事之秋，冲突，暴力与混乱席卷美利坚上下。暴力分子走上街头，争相向政府表达他们各异的“政见”。令诸位中道政客们与美利坚悠久民主传统的信众们稍感欣慰的是，曾经视彼此如大敌的共和党、民主党与进步党如今在呼啸而来的政治风暴中选择团结一致，共同在同一个战壕里打击激进政党们的攻击。\n\n然而，这也许是唯一的好消息了。钢带区源源不断地罢工与抗议与南方层出不穷的暴力事件与种族仇杀的爆发频率已经达到了历史最高点，如一浪高过一浪的海啸冲击着如今的美利坚这座摇摇欲坠的巴别塔。为了遏制住愈演愈烈的社会混乱与政治危机，有识之士们都希望政府能够做点什么以解决现状，但过去八年胡佛政府的一败涂地使人们的希望愈发渺茫。如今，所有胡佛的支持者乃至整个美国的爱国者都为新政府祈祷，希望他们选出的老面孔能够用一些新把戏来应对眼前的一切危局。"
 USA.455.a:0 "好好先生已经是过去式了赫伯"
 USA.456.t:0 "再无软弱"
 USA.456.d:0 "长久以来，美利坚都自诩为世界的民主模范与样板，而自上到下的美利坚民众也对此深信不疑，并倍加自豪。然而，先贤们为之奋斗并精心设计的民主框架在如今之多事之秋却成为了野心家，煽动者与叛乱分子繁殖滋生并向联邦政府猛烈开火的恶毒温床。曾经，在惨烈的欧洲大战落下帷幕后，红色恐怖席卷整个欧罗巴，而彼时的威尔逊政府为了保证新大陆不受野蛮的日耳曼匈人与残忍的工团分子与布尔什维克渗透，第一次不得已撕下了自由的遮羞布。\n\n奥弗曼委员会，由一部分保守的民主党人呼吁而设立，旨在调查可能渗透乃至颠覆美利坚政治生态的德国间谍，工团煽动者或是布尔什维克分子。尽管彼时该政策也不乏批评与反对之声，但客观上的事实是，该委员会的确有效的将美利坚保护免遭外部势力的侵犯。如今，在胡佛总统的批示下，众多的保守共和党人与民主党人站在了同一条战壕里，共同建立了众议院非美活动调查委员会。这被认为是奥弗曼奥弗曼委员会的遗产。\n\n胡佛总统声称，众议院非美活动调查委员会是为了调查被指控的私人公民、公职人员和涉嫌与外国或与工团有联系的组织的不忠和颠覆活动而被组织起来的。为了避免美利坚的政治局面进一步恶化，调查委员会将被授予一些特别权限以彻查任何可能颠覆美利坚政权的邪恶阴谋。在总统的钦点下，该委员会的第一任主席将是新泽西州共和党人托马斯·J·帕内尔。但所有人都明白，委员会的真正主导者并非帕内尔，而是那位著名的民主党人马丁·戴斯。"
 USA.456.a:0 "必要时刻需出重拳 "
 USA.457.t:0 "埃德加·胡佛的新美利坚联邦调查局"
 USA.457.d:0 "当J·埃德加·胡佛被授权采取一切必要措施来结束当前的危机时，行政部门的许多人注意到，联邦调查局正遭受资源匮乏的困扰。更值得注意的是，它缺乏追捕罪犯的实权。联邦调查局局长J·埃德加·胡佛提议大规模扩大联邦调查局的规模，雇用更多的特工，添置更多的办公大楼，总体上，请求总统赋予其更多的权力来追捕罪犯，以解决这场危机。胡佛总统现在只能选择是要接受埃德加·胡佛的请求并扩大这个日益强大的组织，还是拒绝埃德加·胡佛的请求并利用自己现有的资源。"
 USA.457.a:0 "授权他扩大联邦调查局的权力"
 USA.457.b:0 "拒绝请求"
 USA.458.t:0 "调查海伍德"
 USA.458.d:0 "自世界产业工人联盟在钢带区迅速扩张以来，其领袖比尔·海伍德便始终处在联邦政府的视线之内。随着社会党在地方政府、工会与准军事组织中的影响力不断加深。如今的钢带区已经成为了红色势力的温床。\n\n埃德加·胡佛与FBI探员重点审查了世界产业工人联盟的资金来源、组织结构与跨州活动记录。部分线索显示，海伍德与多起未经批准的工人武装集会、铁路瘫痪行动以及地方政府施压事件存在直接或间接联系。而司法部在递交给总统的内部报告中承认，目前掌握的材料并不足以立即将海伍德送上法庭。\n\n对我们来说，尽管该项调查无非是将老生常谈的问题再度摆上台面，但胡佛的工作的确有所成效。J·埃德加·胡佛已经将证据交给了华亚克和帕纳尔·托马斯，而非美活动调查委员会已经正式确认海伍德与社会党阴谋颠覆政权的诸多罪行成立，并宣布海伍德为罪犯与叛国分子。在我们的努力下，海伍德正在逐渐在美国人民的心中变成一位阴谋家。"
 USA.458.a:0 "有用...但不多"
 USA.459.t:0 "调查福斯特"
 USA.459.d:0 "众议院非美活动调查委员会已经正式启动了对美利坚社会党的调查，而这一次，他们选择了威廉·Z·福斯特作为突破口。二十多年来，福斯特始终活跃在美国激进政治的最前沿——从威尔逊与帕尔默时代的红色恐慌，到如今全国范围内的罢工浪潮，他的名字几乎从未远离过联邦政府的监视名单。\n\n福斯特公开支持全国性劳工罢工，频繁出入工会集会，并长期在美利坚社会党内部鼓吹更为激进、集中化的路线。联邦调查局局长J·埃德加·胡佛已向委员会主席帕纳尔·托马斯及马丁·迪斯提交了一份厚重的档案，其中包含大量监听记录、财务往来与秘密通信副本。这些材料试图证明，福斯特不仅在意识形态上与欧洲大陆的马克思主义运动保持一致，甚至还与法兰西公社存在直接联系。\n\n尽管这些指控在法律层面仍存在争议，但委员会成员普遍认为，福斯特的政治活动已经远远超出了合法反对派的范畴。委员会的内部意见逐渐趋于一致：福斯特与社会党是由境外势力资助的反政府政治组织。"
 USA.459.a:0 "抓捕福斯特，并尝试将罪行关联到社会党的其他领导者"
 USA.460.t:0 "调查杰伊·洛夫斯通"
 USA.460.d:0 "众议院非美活动调查委员会已正式将美利坚社会党列为重点调查对象，而这一次，他们将杰伊·洛夫斯通视为突破口。洛夫斯通并非典型的街头煽动者，他曾在早年的革命浪潮中崭露头角，主张国际主义路线，却因党内路线斗争与反对第三国际过多干涉社会党事务而逐渐被边缘化。在社会党内部，他既不完全属于最激进派，也不被温和派完全信任。联邦调查人员掌握的材料显示，他与党内强硬派长期存在理念分歧，对某些激进策略持保留态度。更有传闻称，他私下曾表达对“盲目革命浪漫主义”的不满。根据FBI们的资料，特工与委员会认定杰伊·洛夫斯通属于一个可以被争取与拉拢的摇摆不定的人，而一旦成功，洛夫斯通就将成为联邦政府钉进社会党内部的一个楔子。"
 USA.460.a:0 "策反洛夫斯通，尝试瓦解社会党"
 USA.461.t:0 "疤面的小把柄"
 USA.461.d:0 "在联邦调查局与国税局的长期追踪下，阿尔·卡彭的财务与犯罪证据已被彻底掌握。税务欺诈、走私、暴力犯罪——足以将他送入监狱数十年。部分内阁成员提出一个大胆而危险的提议：利用这些证据作为筹码，迫使卡彭在芝加哥就地对社会党领袖海伍德采取行动。若关键人物被清除，社会党的组织能力或将瞬间瓦解。然而，如此明目张胆的刺杀一旦稍有差池，就将彻底引爆钢带区这个火药桶，甚至全国范围内的激进势力都将立刻掀起反旗。如果我们无法谨慎对待此事，所带来的结果很可能是毁灭性的。"
 USA.461.a:0 "放手一搏"
 USA.461.b:0 "我很难信任这个滑头"
 USA.462.t:0 "赤匪的终末"
 USA.462.d:0 "深夜传来消息，海伍德与他的追随者在一次私人行程中遭遇伏击，当场重伤，数小时后不治身亡。社会党的大部分高层都在这场袭击中或重伤或直接死亡。警方对外宣称这是黑帮刺杀，原因可能是卡彭的利益遭到了日益壮大的社会党的威胁，但钢带地区的工人显然并不相信这种说法。社会党内部迅速陷入混乱。部分基层组织失去指挥，几名中层干部宣布暂时接管事务，但效果甚微。关于幕后真相的猜测在小范围内流传，却无人敢公开指控。而联邦政府则成为了这一系列惨案背后真正的赢家。"
 USA.462.a:0 "死的好"
 USA.463.t:0 "功亏一篑"
 USA.463.d:0 "伏击行动以失败告终。参与者被当场抓获，其中一人供出与黑帮有关的线索，媒体迅速将矛头指向卡彭的网络，进而将矛头对准了联邦政府。钢带地区当晚爆发示威，工会领袖公开谴责这是针对劳工运动的政治谋杀未遂。而其他激进势力也大肆宣扬政府主导了这场刺杀行动，导致全国范围内抗议活动此起彼伏。甚至在国会中也有相当一部分议员猛烈批评胡佛政府的愚蠢举动。"
 USA.463.a:0 "卡彭我操你妈"
 USA.464.t:0 "威廉·“大比尔”·海伍德之死"
 USA.464.d:0 "威廉·“大比尔”·海伍德，世界产业工人联盟的巨人，美利坚社会党的长期领袖和美国左翼的团结者，今天在芝加哥林肯公园散步时被他的狗链绊倒，经抢救无效后溘然长逝。他的去世极大震动了全美的左翼人士，伊丽莎白·格利·弗林在他的葬礼上发表了演讲：“历史具有长远的眼光。它终将对暴君做出严厉的审判，向那些为人类解放事业，反对压迫与经济奴役而斗争、受苦、入狱和牺牲的殉道者伸张正义。”\n\n其他工会领导人，以及美利坚社会党的各大领袖，也在海伍德的葬礼上发言致辞。海伍德的突然离世让社会党及其在各政治领域的诸多盟友都深为震惊，而在此时社会党失去了团结所有派系的支柱，很快曾经团结的政治联盟开始分裂。混乱的社会主义者与工团主义者们找不到一个能团结所有左翼人士的领导，而曾经强大无比的社会党正在逐步变得支离破碎。"
 USA.464.a:0 "这些混蛋也有这一天！"
 USA.465.t:0 "调查厄尔·朗"
 USA.465.d:0 "联邦调查人员已将路易斯安那州的厄尔·朗列为重点监控对象。作为至上党阵营的重要动员者之一，朗最信任的得力干将，他在南方乡镇与基层组织之间拥有稳定的人脉网络，并长期参与地方选举运作与群众集会的筹划。初步调查显示，朗的政治活动涉及多笔来源不明的资金流转，其中部分资金通过地方建筑合同与州政府项目转移。虽然难以直接进行犯罪定罪但其账目混乱与关联人脉结构足以引发司法关注。政府内部有人主张迅速拘捕，以打乱至上党的地方组织节奏；也有人建议循序推进，将朗的案件作为突破口，逐步牵连出更高层的核心人物。若操作得当，将彻底撼动至上党的地区组织，乃至成为瓦解至上党的第一步。"
 USA.465.a:0 "抓捕厄尔·朗，并尝试将罪行关联到至上党的其他领导者"
 USA.466.t:0 "调查佩利"
 USA.466.d:0 "威廉·达德利·佩利近年来通过出版物、讲座与半秘密集会扩大其影响力，其言论在部分中西部与南方保守圈层中引发共鸣。尽管其组织规模并不庞大，但其意识形态传播能力不可忽视。同时。佩利本人还作为银衫军的领袖，统率着这只规模不小的准军事武装。联邦方面掌握的材料显示，佩利的出版网络与数家地方印刷厂存在异常财务往来，且其部分募款活动并未依法申报。他统领的银衫军的武器来源与内部成员构成也值得委员会大做文章。与此同时，他尽管与至上党内部有所联系，但并未渗透到高层，因此抓捕或消灭佩利对我们的利益影响不大。有顾问认为，与其公开审判，不如利用现有证据与压力，迫使其在关键时刻保持沉默，甚至为政府所用，打击朗麾下的一分钟人武装。"
 USA.466.a:0 "尝试策反佩利，作为我们的后手"
 USA.467.t:0 "调查杰拉尔德·L·K·史密斯"
 USA.467.d:0 "杰拉尔德·L·K·史密斯近年来迅速成为南方民粹运动中的重要面孔。凭借布道式的演讲风格与浓厚的宗教色彩，他在集会与教会网络中赢得了相当规模的追随者。许多支持者将其视为朗政治遗产的继承者之一。尽管史密斯并未牢牢掌控至上党的核心决策层，但他在基层组织与宣传体系中的影响力不容忽视。史密斯往往将经济焦虑与民族主义情绪结合，以简明而激烈的语言动员听众。部分地方冲突与集会背后，都能看到他的身影。联邦掌握的资料显示，史密斯与若干资金渠道存在模糊往来，同时在数次集会组织中越过合法边界。虽然证据尚不足以立即提起重罪指控，但相关材料足以对其施加持续压力。若在适当时机给予选择，史密斯或许会优先考虑自身的政治生存。"
 USA.467.a:0 "尝试策反史密斯，作为我们的后手"
 USA.468.t:0 "调查D·C·斯蒂芬森"
 USA.468.d:0 "在联邦政府针对旧民主党及其外围组织的调查不断推进之际，一个名字被反复提及。D·C·斯蒂芬森，如今的3k党巨龙，如今成为了埃德加·胡佛与非美活动调查委员会的头号调查目标。在经过多方搜查后，联邦调查局甚至对调查行动的轻松程度感到难以置信。这位3k党大巫师对自己恶行的遮掩几乎属于自欺欺人，探员们很快就搜集了包括贪污，腐败，强奸未成年，一级谋杀与吸毒等诸多罪名。埃德加·胡佛提醒我们，这些罪名足够斯蒂芬森在牢里蹲上一百多年，甚至在我们的运作下能给斯蒂芬森弄个死刑。在经过简短的讨论后，马丁·迪斯宣布斯蒂芬森为联邦重罪犯，并授权联邦警察对斯蒂芬森进行抓捕。"
 USA.468.a:0 "抓住他别让他跑了！"
 USA.469.t:0 "调查尤金·塔尔梅奇"
 USA.469.d:0 "佐治亚州州长尤金·塔尔梅奇早已不是单纯的地方行政官。他以强硬的州权立场、公开反对联邦干预以及对种族议题的极端态度，在南方保守派中赢得了广泛支持。在民主党内部纷争加剧之际，塔尔梅奇选择与威廉·默里的旧民主党站在同一阵线，公开批评全国民主党“向进步派妥协”。他多次在公开演讲中宣称，华盛顿的政策正在侵蚀州权与传统秩序。随着旧民主党重组，塔尔梅奇成为连接地方政治机器与该阵营的重要人物，在州议会与县级组织中拥有深厚人脉。联邦调查人员整理出的资料显示，其任内农业补贴分配与州财政合同存在明显偏向性安排，部分教育与行政机构的人事调整亦被质疑为政治勾连。实际上，尤金·塔尔梅奇的政治黑幕与贪污腐败早已不是什么秘闻，但在过去碍于政治危机政府始终未出手彻查。若对其采取行动，将直接触及旧民主党在南方的权力结构，瓦解一部分旧民主党的政治势力。"
 USA.469.a:0 "逮捕他！"
 USA.470.t:0 "会面工业之王"
 USA.470.d:0 "在华盛顿的一次闭门会谈中，总统与亨利·福特进行了长时间交谈。福特在过去数年中对旧民主党阵营表现出一定程度的同情与资金支持，但随着来自联邦的政治施压不断升温以及旧民主党的不断被打击，福特开始逐渐向联邦政府靠拢。会谈中，福特表示愿意将其资源与舆论影响力转向支持现政府，同时减少与旧民主党之间的公开联系与支持。作为交换，总统方面承诺在工业政策与内阁安排上给予福特集团更多空间，包括支持其企业扩张与市场整合。双方并未公开会议细节，但随后的政策信号已经足以说明，福特作为过去旧民主党的支持者已经改换门庭。"
 USA.470.a:0 "卓有成效的会面"
 USA.471.t:0 "胡佛突袭"
 USA.471.d:0 "帕尔默突袭曾是美国历史上规模最大的国内政治搜捕行动之一。那场行动以打击无政府主义者和激进左翼为名，联邦探员突袭组织据点、搜查住所并逮捕大批嫌疑人，也因此留下了关于滥权、程序正义与政治迫害的长期争议。近十年后，美国却面对着远比当年更加危险的局面。街头暴徒与政治民兵公开集结，三K党与其他秘密组织在地方制造恐怖活动与种族仇杀，而北方的无政府主义者和激进分子仍不时策划爆炸与暗杀。即使是一些人口稀少的地区，各种民粹主义准军事团体也正迅速扩大自己的武装力量。正常的地方警务已经越来越难以应付这种横跨州界的政治暴力。\n\n内政部长J·埃德加·胡佛因此向总统提交了一份极其强硬的计划。他要求获得类似当年帕尔默行动时期的广泛权限，由联邦调查机关统一协调各州情报，对被认定为危险的政治组织展开突击搜查，查封并大规模拘捕涉嫌策划暴力活动的成员。胡佛坚称，若政府仍被繁琐程序束缚，那些正在武装自己的极端分子只会获得更多准备时间。\n\n这样的授权无疑能够让联邦政府迅速出手，却也可能再次打开一扇危险的大门：一旦“国家安全”的界线被无限扩大，现有体制与专制独裁之间的区别，很快便可能变得模糊。不过，在一个越来越接近失控的国家里，白宫还有多少时间慢慢分辨这些界线？"
 USA.471.a:0 "给予授权"
 USA.472.t:0 "国王之死"
 USA.472.d:0 "深夜传来消息，休伊·朗在一次公开活动结束后在路易斯安那政府大楼前遭遇枪击。现场随即陷入混乱，随行保镖与一分钟人在狭窄走廊内开火反击，多人受伤。在紧急送医数小时后，医院宣布朗因伤势过重去世。官方调查初步认定行凶者为一名个人行为的刺客，但关于动机与幕后关系的猜测迅速蔓延。朗的支持者指责这是政治暗杀，而州政府则强调案件正在依法处理。失去核心人物后，至上党高层开始逐步走向撕裂。包括杰拉尔德·L·K·史密斯在内的部分人主张以强硬姿态回应政府，另一些则要求暂时收缩组织活动。原本围绕朗个人权威形成的指挥结构突然失去中心。在路易斯安那州议会大厦外仍聚集着支持者，悼念与愤怒交织在一起，并逐渐点燃整个路易斯安那州。"
 USA.472.a:0 "这是你们至上党自己的事，跟我们无关"
 USA.473.t:0 "紫色苜蓿之逝"
 USA.473.d:0 "威廉·H·默里突发脑出血疾病去世的消息在南方政界引发震动。作为旧民主党的核心人物，他在多个州与政治团体之间维系着松散却稳定的政治联盟。默里的离世使旧民主党高层迅速陷入权力争夺。部分州级领导人主张继续强硬路线，另一些则试图与更温和的保守派接触。黑色军团与3k党等极端组织也随之受到了波及，一部分边缘领导者借机率众出走，而剩余成员也开始加大内斗力度。总而言之，随着领袖的逝去，以旧民主党为核心的南方激进派联盟就已名存实亡。"
 USA.473.a:0 "好死，开香槟咯"
 USA.474.t:0 "粉碎一分钟人和三K党"
 USA.474.d:0 "随着社会党叛乱的威胁基本解除，联邦政府终于能够把注意力转向仍在南方活动的其他激进势力。失去了旧民主党在地方政治机器中的掩护后，三K党已经远不如过去那样强大，而“王鱼”之死也使一分钟人与至上党陷入严重的领导危机和内部争斗。许多地方分支彼此争夺资源，昔日依赖个人号召力维系的组织网络也正在迅速瓦解。\n\n借助此时的混乱时机，联邦调查人员开始了集中搜捕仍在策划暴力活动的骨干成员，地方警察和国民警卫队则负责查封武器库、驱散非法集会并切断各组织之间的联络。尽管南方不会在一夜之间恢复平静，但随着这些最危险的准军事组织逐渐失去行动能力，街头暴力终于重新让位于选票与地方行政。"
 USA.474.a:0 "和平与稳定最终降临于南方"
 USA.475.t:0 "强化总统安保？"
 USA.475.d:0 "随着政府近来连续对激进政党、地下组织和各类准军事团体展开打击，全国政治局势也愈发紧张。与此同时，针对政府官员的恐吓信、死亡威胁和可疑跟踪事件也明显增加，胡佛总统本人的安全问题因此重新成为白宫关注的焦点。\n\n负责总统安全的部门已经提交了一份新的安保方案，包括增加随行警卫、提前封锁总统公开活动路线，并加强对集会现场和沿途建筑的检查。部分幕僚担心，如此严密的保护会让总统显得畏惧民众，甚至进一步加深外界对于政府的负面印象。但安全部门坚持认为，在政治暴力已经成为现实威胁的今天，继续按照过去的标准保护总统无异于赌博。\n\n尽管胡佛本人一向不愿让自己的公开活动被过多警卫包围，但如今的问题已经不再只是个人形象。若有人真能在国家最动荡的时刻成功袭击总统，其后果恐怕远比一次安保升级所引发的争议严重得多。"
 USA.475.a:0 "加大安保力度"
 USA.475.b:0 "没事的"
 USA.476.t:0 "总统在首都被暗杀！"
 USA.476.d.Hooverdeath:0 "自从胡佛在1936年的选举中意外获胜以来，美国许多主要城市都发生了大规模骚乱，当然华盛顿特区也不例外。为了平息国会内的紧张局势，同时也为了表现自己的强势形象，胡佛总统选择乘车穿过华盛顿特区。虽然人群对胡佛的表现不以为然，但当胡佛在自己的车里被枪杀时，他们的情绪很快发生了变化。警方和联邦调查局还没有找到任何嫌疑人，至今还不知道谁是杀害胡佛总统的凶手。因此，美国政治体系内的许多人开始互相指责对方杀害了总统。"
 USA.476.d.Hooveralive:0 "自从胡佛在1936年的选举中意外获胜以来，美国各大城市的骚乱便愈演愈烈，首都华盛顿同样充斥着示威、冲突与针对政府的威胁。为了向国会和公众证明总统不会因为街头暴力而躲进白宫，胡佛坚持按照原定安排乘车穿过市区，在警卫陪同下公开露面。当车队经过宾夕法尼亚大道时，人群中的嘘声甚至一度盖过了零星的欢呼。随后，几声枪响突然划破街头的喧闹。特勤人员立即扑向总统，车辆也在混乱中高速驶离现场。幸运的是，子弹仅击中了车身和一名随行人员，胡佛本人没有受伤。警方和联邦调查局封锁附近街区，大批嫌疑人被带走审讯，但究竟是谁扣动扳机仍然无人知晓。胡佛本人则把这次袭击视为自己将拯救美国的又一证明。"
 USA.476.a:0 "当你听到胡佛总统被暗杀的消息时，你在哪里？"
 USA.476.b:0 "借此加大对激进党派的打击力度"
 USA.477.t:0 "钱从何来？"
 USA.477.d:0 "在内阁会议上，弗兰克·诺克斯再次提出必须进一步压缩联邦开支。实际上，财政赤字虽已得到控制，但公共工程、农业补贴与治安支出仍在增加。诺克斯认为，若不能彻底平衡预算，这对政府信用将持续不断施加压力直到财政与信誉崩盘。部分部长主张继续裁撤效率低下的部门与重复项目，削减行政层级；也有人建议削减教育与救济经费，以释放财政空间，但这将面临舆论反弹，给予激进派攻击政府的又一借口。另一种思路则是扩大税基，推出新的税收法案。提高企业税与高收入阶层税率或许能带来额外收入，但可能引发资本外流，或是更大的社会动荡。还有人提出废除禁酒令，转而对酒精征收高额消费税，将地下交易纳入合法税收体系。但可想而知的是，这将证明联邦政府在过去十年中针对禁酒法案所做出的一切努力都将成为一纸空文，徒留笑柄。"
 USA.477.a:0 "继续裁撤不必要的政府部门与项目"
 USA.477.b:0 "也许我们得削减教育与救济经费"
 USA.477.c:0 "征税征税！"
 USA.477.e:0 "废除禁酒令，改对酒精征收苛税"
 USA.478.t:0 "调查军队和麦克阿瑟？"
 USA.478.d:0 "虽然道格拉斯·麦克阿瑟在解决危机方面为胡佛和行政部门发挥了不可估量的作用，但许多人呼吁对他的行为进行调查。人们怀疑军方对其集团领导人或可能的外部势力的忠诚。托马斯委员会决定起诉的两位将军是道格拉斯·麦克阿瑟将军和斯梅德利·巴特勒将军。除此之外，委员会还迅速调查整个军队内部的叛国罪行为以及对外国势力干涉和意识形态渗透的指控。"
 USA.478.a:0 "总统与麦克阿瑟达成共识，但巴特勒必须被开除军籍"
 USA.478.b:0 "迫使麦克阿瑟和巴特勒退休"
 USA.479.t:0 "托马斯委员会调查好莱坞？"
 USA.479.d:0 "近日，众议院非美活动调查委员会决定将其调查范围进一步扩大，正式将好莱坞电影产业及其从业人员纳入审查对象。委员会方面宣称，此举旨在调查潜在的工团主义同情者，以及任何被怀疑同外国势力、特别是第三国际及法兰西公社存在政治或意识形态联系的个人。\n\n委员会主席J·帕纳尔·托马斯在公开声明中强调，这项调查并非针对电影行业本身，也不意味着对大多数电影从业者忠诚度的质疑。他表示，自听证会启动以来，委员会便持续关注外国意识形态对美国文化领域的影响，而好莱坞作为全国最具影响力的舆论与文化中心之一，自然无法置身事外。此外，马丁·迪斯在一次与记者的谈话中表示，经过对美利坚社会党的文件审查与罪证审理，委员会已经明确来自第三国际的间谍已经混进了好莱坞。\n\n然而，这一决定仍在国内引发了广泛争议。多位政界人士、行业组织以及电影工会警告称，委员会的行动可能导致对言论自由的过度干预。美国编剧协会则指出，若缺乏明确界限，这类调查恐将在国家安全与民主原则之间制造危险的模糊地带。面对不断升级的意识形态对抗，政府必须决定应当在何种程度上介入这一领域。"
 USA.479.a:0 "进行公正的审查，只对被确认与第三国际有沟通的人员提起诉讼"
 USA.479.b:0 "只要他们没有真正危害国家利益，就没必要大动干戈"
 USA.479.c:0 "彻底追踪好莱坞内的公社和工团势力，严防死守他们的渗透"
 USA.480.t:0 "J·帕纳尔·托马斯和众议院非美活动调查委员会受到了新闻产业的攻击"
 USA.480.d:0 "最初受新闻行业和行政部门支持的众议院非美活动调查委员会，现在反而不断受到媒体的攻击。因为委员会将重点转向调查好莱坞和军方在一定程度上引发了这一批评，许多托马斯的死忠都转而反对他。托马斯被媒体称为酒鬼、败类和疯子。最重要的是，他因为委员会对电影产业和军队的调查而受到了严厉的批评。胡佛总统需要对托马斯和众议院非美活动调查委员会所受的指控做出回应"
 USA.480.a:0 "不做表态"
 USA.480.b:0 "继续坚定地支持托马斯"
 USA.480.c:0 "委员会责任已尽，是时候关停了"
 USA.481.t:0 "和欧洲霸主交好"
 USA.481.d:0 "随着欧罗巴逐步从黑色星期一中复苏，社会逐渐稳定，德意志帝国及其主导的中欧经济体系正再度成为全球工业与金融流通的重要节点。柏林方面通过驻美外交渠道表达了深化双边合作的兴趣，尤其是在重型机械出口、化工技术交换以及银行间结算体系方面。同时类似克虏伯等军工企业也希望打开美国市场的大门，从中盈利。美国企业界对这一机会表现出强烈兴趣。钢铁与汽车制造商希望进入中欧市场，而德意志方面则希望获得更多美国农产品与石油供应。华尔街银行也在研究与柏林金融机构建立更直接清算机制的可能性，以减少英镑体系的中间环节。然而，国务部门内部存在分歧。一派主张建立更具战略性质的合作框架，包括长期贷款协议与工业技术共享；另一派则坚持将合作限定在贸易层面，认为帝国公约与第三国际的冲突难以避免，避免卷入欧洲大陆复杂的政治风波才是明智之举；也有人提议通过向中欧同盟整体进行分散投资，以降低单一依赖风险。德国市场规模可观，但其经济秩序高度组织化，准入门槛与政策要求同样严格。且一旦开战我们的投资也将受到极大打击。总之，任何选择都将决定未来数年的资本流向与贸易结构。"
 USA.481.a:0 "与德意志帝国构建更深入的合作"
 USA.481.b:0 "生意胜于一切"
 USA.481.c:0 "投资中欧同盟也许是更长远的选择"
 USA.482.t:0 "胡佛大坝落成"
 USA.482.d:0 "横跨科罗拉多河的胡佛大坝工程正式完工。自开工以来，数万名工人参与施工，混凝土浇筑总量达到前所未有的规模，输电系统与水利设施同步建设完成。该工程不仅改变了西南地区的地貌，也重塑了联邦公共工程体系的组织能力。大坝建成后，将为内华达、亚利桑那及加利福尼亚南部提供稳定电力供应。多座新型水电机组已开始并网运行，为工业生产与城市扩张提供廉价能源。农业部门同样受益于改进后的灌溉与洪水控制体系，长期困扰河谷地区的水量波动将得到显著缓解。\n\n施工期间，联邦工程管理方式进行了多项制度化调整，包括劳工安全标准与分包合同监督机制。部分批评者指出工程成本高昂，但支持者认为，工程直接带动了周边城镇经济，并为失业工人提供了稳定收入。大坝的混凝土墙体已然矗立，发电机组开始运转，科罗拉多河的水流被引导至新的轨道。"
 USA.482.a:0 "公共服务的里程碑"
 USA.483.t:0 "考量金本位？"
 USA.483.d:0 "财政部与联邦储备系统围绕金本位制度展开激烈讨论。当前国际贸易仍以黄金储备为信用基础，但国内信贷紧缩与工业扩张需求之间的矛盾日益显现。支持维持金本位的一方认为，黄金储备提供了国际结算的稳定框架，有助于维持美元在全球金融体系中的信誉。华尔街部分银行与出口企业担心，一旦脱离金本位，汇率波动可能削弱对外贸易与资本流入。尤其德意志帝国作为当今世界霸主与金融中心，其金马克也与黄金紧密挂钩。反对者则指出，固定黄金兑换限制了货币供给的灵活性，使联邦在面对经济压力时难以采取扩张性政策。工业资本集团与部分农业州代表倾向于废除金本位，以扩大信贷规模并刺激国内投资与价格回升。任何决定都将直接影响银行准备金比例、贷款规模以及未来数年的金融政策空间。"
 USA.483.a:0 "保留金本位"
 USA.483.b:0 "废除金本位"
 USA.490.t:0 "共和党的未来？"
 USA.490.d:0 "自从进步派分裂和威尔逊在1912年获胜以来，共和党一直是美国政治的输家。他们为重新入主白宫所做的最大努力都以失败告终。然而，1928年胡佛获胜后，共和党的命运发生了逆转。但在那次选举后的几年里，共和党再次失宠，因为人们转而反对该党，并在某些情况下指责胡佛造成了经济大萧条。他在32年和36年的胜利再次破坏了国家的稳定，每个人，包括胡佛总统自己在内，都认为合众国完了。然而，合众国并没有灭亡，胡佛总统和他在内阁、国会和军方的支持者扭转了危机。现在的问题是；共和党现在会变成什么样子？"
 USA.490.a:0 "属于所有人的美国梦将会被实现"
 USA.490.b:0 "如今的政治体制运行良好，成功渡过危机就是证明"
 USA.490.c:0 "共和党将为了打造一个传统而美好的美国而服务"
 USA.490.e:0 "共和党王朝近在眼前！"
 USA.491.t:0 "再来一轮？"
 USA.491.d:0 "在过去三十年里，美国有两位总统打破了连任两届的传统，许多人担心破这个例的总统太多了。更糟糕的是，他们担心美国之后总统最多连任两届的传统将荡然无存，而这一传统是开国元勋乔治·华盛顿明智地确立的。1936年，在共和党保守派的压力下，胡佛被提名为共和党总统候选人，并将他在公众中的支持率提高到自1928年获胜以来从未见过的高度，胡佛做到了其他人无法做到的事情。通过解决过去15年累积起来的政治和经济危机，他成为了美国的救世主。现在，他可以继续挑战传统，争取更多任期，或者干脆退休。"
 USA.491.a:0 "如果人们支持我，我有什么资格拒绝？"
 USA.491.b:0 "我已打破传统，但我不会再打破它了。"
 USA.495.t:0 "美利坚社会党的命运"
 USA.495.d:0 "随着众议院非美活动调查委员会的持续行动，美利坚社会党正面临前所未有的困境。部分核心成员已因调查与逮捕而被迫退出政治舞台，而另一些人——包括杰伊·洛夫斯通在内——则选择与政府合作，公开切割激进立场。自长期领袖威廉·海伍德去世以来，社会党内部派系纷争不断，组织结构日益松散，如今已难以作为一个强大的左翼政党参加政治活动。\n\n在这一背景下，原本活跃于社会党周边的左翼支持者开始重新寻找政治归属。进步党正逐步成为这些选民的主要去向，但也有声音认为，共和党若愿意在政策上作出有限调整，同样有机会吸纳部分左翼与工人阶层选民。社会党的衰落已成定局，问题在于，谁将继承它留下的政治空间。"
 USA.495.a:0 "进步主义者和社会主义者，多合适啊"
 USA.495.b:0 "实施更多进步政策，尝试吸纳这些人"
 USA.496.t:0 "美利坚至上党的命运"
 USA.496.d:0 "随着休伊·朗遭到刺杀，美利坚至上党这一曾高度依赖其个人号召力维系的民粹主义政治联盟迅速走向瓦解。失去了核心人物的统一与调和，该党内部原本松散拼合的派系难以继续共存，组织结构在短时间内陷入瘫痪。\n\n曾依附于朗个人影响力而存在的准军事组织与激进政治团体亦随之解散，其成员要么退出政治活动，要么重新寻找新的政治依托。与此同时，大量原至上党支持者开始转向更为传统的政治渠道，其中相当一部分选择加入民主党，试图在既有体制内继续表达自身诉求。\n\n随着至上党的政治空间迅速消散，其遗留下来的选民基础正成为各党派竞相争取的对象。政府必须决定，是否应当主动介入这一过程，以塑造南部与民粹选民的未来政治走向。"
 USA.496.a:0 "民粹主义者和民主党……听起来很熟悉"
 USA.496.b:0 "宣布我们对南部农民的同情，尝试获得这些人的好感"
 USA.497.t:0 "旧民主党的命运"
 USA.497.d:0 "旧民主党最近遭受了很多打击，受到了“众议院非美活动调查委员会”的攻击，并受到了负面的宣传影响，在全国范围内经历了失败。该党已开始谈判，希望慢慢与民主党合并，并最终成为民主党的一部分。只有时间才能告诉我们，这个建制党还能与这些反建制的候选人合作多久。"
 USA.497.a:0 "民主党终于一统？"
 USA.498.t.NOCHANGE:0 "第四政党体制得以保留！"
 USA.498.t.SHIFT:0 "创建第五政党体制？"
 USA.498.t.GOP:0 "第二个善意时代？"
 USA.498.d.GOP:0 "所谓的善意时代可以追溯到1817年，这个时代起于联邦党的垮台，整个时代中，不管是政党本身，还是民众之中，党争内斗的意识都较薄弱。现在很多人都在想，当胡佛总统在他的第三个总统任期中集中精力维护了国家团结，淡化了党派政治时，这个时代是否会再次来到美国。胡佛通过兼收并蓄美国政治左、右两派的政策，以及拉近进步党、共和党和民主党的关系，实现了这一目标。在第三个任期内，随着进步党、民主党、社会党、至上党和旧民主党成员纷纷被共和党聚拢吸纳，主流的进步党和民主党已经崩溃。胡佛似乎再次壮大了美国的国民团结感，重启了美国的善意时代，希望这将永远持续下去……"
 USA.498.d.NOCHANGE:0 "自从1896年麦金利战胜威廉·詹宁斯·布赖恩之后，我们就一直被他的胜利和进步时代的后遗症所困扰。这一时期表明的是，第三党不仅可以在美国政治中生存，而且可以在某些情况下蓬勃发展，比如进步党。随着胡佛决定试图让共和党保持在美国政治的中间地位，而不是进一步右倾或左倾，进步党和民主党填补了共和党留下的政治生态位。看来，美国政治中一个左翼、一个右翼和另一个主张中间路线的三党并存的时代还会继续下去……"
 USA.498.d.left:0 "随着胡佛在1932年和1936年的选举中获胜，美国政治的转变是显而易见的。进步党已经慢慢地重新融入了共和党的阵营，许多人将此归因于胡佛使用了1936年进步党所提倡的进步经济政策。但胡佛现在发现自己在共和党中是最右翼的，他的一些前盟友在1936年为他赢得了共和党候选人的提名，但他们要么转投了民主党，要么感觉被胡佛背叛，宣布自己是独立派。美国政治的新时代看来将由左翼的共和党和右翼的民主党主导……"
 USA.498.d.right:0 "随着胡佛在1932年和1936年的选举中获胜，美国政治的转变是显而易见的。安德鲁·杰克逊时代以来幸存下来的民主党逐渐被共和党所吸收，许多人将此归因于胡佛对全国各地激进派采取的更强硬立场。这一立场最初是1936年民主党候选人所提倡的。现在，胡佛发现自己处在一个进一步右倾的政党中间，他的许多前盟友为他赢得了1936年共和党候选人的提名，他们为这位伟岸的“老人”和他的巨大成功欢呼。美国政治的新时代似乎将由左翼的进步党和右翼的共和党主导……"
 USA.498.a:0 "光荣归于1896年制度"
 USA.498.b:0 "政党政治的新时代已经开始"
 USA.498.c:0 "的确，我们现在必须把国家放在政党之上！"
 USA.499.t:0 "培育自由"
 USA.499.d:0 "直到不久之前，仍有许多人相信美国已经注定失败。黑色星期一留下的经济创伤、党争失控、街头暴力与地方政治危机几乎让这个共和国走到了悬崖边缘，甚至连胡佛本人在1936年意外赢得第三个总统任期后，也一度怀疑自己究竟还能为这个国家挽回多少东西。\n\n然而，过去数年的变化已经证明，美国并没有像悲观者预言的那样崩塌。胡佛政府顶住了最危险的政治风暴，在不让联邦制度彻底失去约束的情况下恢复秩序，也一点点修补了经济与社会的裂痕。那些曾经被视为不可调和的政治矛盾没有完全消失，但至少重新回到了属于它的正轨之中，而不是继续向街垒与枪口滑去。\n\n随着经济逐步复苏，暴力政治退潮，胡佛的支持率也上升到了几年前难以想象的高度。曾经把他视为旧时代象征的人，如今不得不承认，正是这位备受嘲讽的总统守住了美国民主、共和制度以及和平交接权力的基本原则。随着时局的逐渐安定，华盛顿特区乃至整个美国的政治气氛也因此发生变化。各党派开始重新调整自身位置，而越来越多政治人物则试图在这个避免了灭顶之灾的新美国中寻找属于自己的道路。\n\n胡佛并没有创造一个没有矛盾的国家，他只是证明了这个共和国仍然拥有自我修复的能力。在最近的一次公开讲话中，胡佛则向全美国的公民真诚表达他的观念：自由并不会因为一次选举或一纸宪法便永远存在，它必须在每一次危机中被重新保护、重新培育。作为回复，台下的听众报以热烈的掌声。"
 USA.499.a:0 "胡佛先生，我们感谢你！"
#麦克阿瑟 内战结束
USA.500.t:0 "麦克阿瑟的演讲"
 USA.500.d:0 "内战结束后的第三天，全国的炮火声早已熄灭，但华盛顿仍未完全恢复平静。街头的沙袋尚未撤除，军车依旧停驻在关键路口。林肯纪念堂前搭起临时讲台，士兵列队而立，记者与外交使节被安排在外围区域。作为在内战后的首次全国讲话，这次麦克阿瑟将军的演讲受到全美国甚至全世界的关注。\n\n麦克阿瑟身着军装缓步走上台阶。他的身后是林肯的雕像，身前则是沉默的人群。演讲开篇并不激烈。他回顾了内战爆发的混乱，提及分裂带来的流血与牺牲，并强调军队在“国家濒临解体时”所承担的责任。在演讲中，这位久经沙场的将军声明秩序并非自发产生，而是通过纪律与决断维系。尽管军队不寻求政治权力，但也不会在危险尚未完全消退时轻易退场。这位以铁腕著称的强人面对全国宣布了一系列接下来政府为了维持国家秩序而行将付诸实践的政策，包括但不限于言论管制，物价封锁与全国临时戒严令等等。然而，是否解除紧急状态，是否恢复文官政府与国会的权力，所有人都在等待这位“美利坚的凯撒”的明确表态。几名参议员交换眼神，而西部军区的代表站在远处，神情难辨。麦克阿瑟停顿良久，随后说出了宣布演讲结束的最后一句话："
 USA.500.a:0 "“在秩序得到彻底恢复前，军队将确保国家稳定”"
 USA.500.b:0 "“愿民主永远指导美利坚的路途”"
 USA.501.t:0 "华盛顿的国贼"
 USA.501.d:0 "麦克阿瑟在演讲中并未宣布解除紧急状态。军方委员会继续掌握行政权力，国会复会时间被无限期推迟。总统职权名义上保留，但实权仍集中于军方系统。毫无疑问，麦克阿瑟将把美国逐步打造成彻底的军事国家，他本人也必然会成为彻头彻尾的独裁者。"
 USA.501.a:0 "谴责他"
 USA.502.t:0 "西部军区谴责华盛顿"
 USA.502.d:0 "在麦克阿瑟总统表态后，以布拉德利将军为首的西部军区司令部发表正式声明，公开质疑华盛顿继续维持紧急状态的合法性。布拉德利将军电告全国，军队的职责是保卫宪法，而非在和平已恢复后取代民选机构。麦克阿瑟的举动在内战前就已经有所预谋，是彻彻底底的叛国行径。华盛顿对此反应强烈。参谋总部内部意见分裂，一部分主张立即采取行动压制“叛乱苗头”，另一部分则警告任何军事对峙都可能引发更大规模的进一步内部分裂。在华盛顿争论不休时，反对麦克阿瑟的国会议员正在争相逃往西部。随后西部军区进入高度戒备状态，参谋部方面亦在评估可迅速部署的部队规模，认为只要即刻行动，西部军区的部队很难形成长时间的有效抵抗。"
 USA.502.a:0 "来谈谈吧..."
 USA.502.b:0 "向全国宣布布拉德利等人是叛国贼"
 USA.503.t:0 "推翻暴君的最后一搏"
 USA.503.d:0 "自从麦克阿瑟以国家紧急状态为名接管权力以来，华盛顿的权力结构已不复从前。原本被视为临时手段的军管措施与戒严令，如今逐渐演变为长期的社会政策与常态。国会早已被架空，文官系统被边缘化，所有关键命令皆自新成立的国家防御委员会直接下达。\n\n如今局势已到临界点。若再迟疑，西部军区将彻底失去行动空间。若此刻出手，或许还能以“恢复宪政”为名争取合法性。同时，麦克阿瑟的倒行逆施也在华盛顿为他树立了众多政敌，也许我们也可以尝试从内部突破麦克阿瑟的统治。"
 USA.503.a:0 "联络华盛顿的所有反麦克阿瑟势力"
 USA.503.b:0 "我们将先发制人"
 USA.504.t:0 "私下提议"
 USA.504.d:0 "我们的敌人已在战争中倒下，华盛顿和西部军指挥中心成了唯二幸存的参战政权。我们要求麦克阿瑟在两个月内放弃权力，但他的回答却让艾森豪威尔和布拉德利大吃一惊。麦克阿瑟在写给两人的私人信件中建议在一个由美军高级军官组成的更广泛的军事委员会中，由三人共享大权。在这个计划中，艾森豪威尔的军政府可以近乎自治地监督前联盟国领土的重建，而布拉德利的军队将基本接管西部军和前太平洋国各州。虽然麦克阿瑟仍然是政权的代表人物，但这将使他无法完全掌控大局。尽管一些将军可能会认为与其妥协是一种背叛，但接受该提议似乎可以挽救无数生命，艾森豪威尔和布拉德利也都认为，或许获取更多权力将使他们慢慢超越麦克阿瑟，以有朝一日恢复民主。当然，拒绝这个提议肯定会导致战争。"
 USA.504.a:0 "我们接受"
 USA.504.b:0 "向社会公布麦克阿瑟的野心"
 USA.504.c:0 "我们将先发制人"
 USA.505.t:0 "独立于危崖之上"
 USA.505.d:0 "随着我们尝试与西部军区达成私下协议的尝试遭到拒绝，如今摆在我们面前的也许只剩下战争之路。所谓“恢复宪政”的声明实为对联邦权威的公然挑战，而西部军区正在厉兵秣马准备发起进攻。麦克阿瑟将军必须在极为短暂的时间内做出抉择：是进一步容忍西部军区的离心行动，试图以谈判拖延时间，还是立即调动部队，以雷霆手段粉碎潜在的叛乱。\n\n此时作为联邦政府的真正大脑，战争部内部意见分裂：部分将领警告，若不立即镇压，其他收复的地区诸如钢带或西海岸可能效仿西部军的姿态；但也有人担忧，一旦动武，如果无法迅速平定叛乱，内战的战火将再度撕裂美国。届时无论西部军区还是麦克阿瑟都将成为联邦历史上的最大罪人。此时也有少部分幕僚抱持着消极态度，认为如今的联邦政府几乎不能在支持一场大规模内战了，因此向西部军屈服也未尝不可。"
 USA.505.a:0 "也许我们别无选择，只能屈服"
 USA.505.b:0 "叛徒终将授首！"
 USA.506.t:0 "现实政治"
 USA.506.d:0 "西部军与麦克阿瑟的关系一直很紧张，领导西部军的将领艾森豪威尔和布拉德利对联邦政府、军队和国会更为忠诚，他们并不信任麦克阿瑟，甚至认为他太过自我。而现在，紧张局势已处于最高水平，他们声称如果我们想要整合西部军控制地区，就必须放弃一些权力。这项协议将成立一个以麦克阿瑟、布拉德利和艾森豪威尔为主要人物的执政军事委员会。尽管麦克阿瑟将失去他在这个国家的最高地位，但他仍然拥有重要的权力和美国的大片土地。如果我们不签署这项协议，就可能会面临另一场战争：一场我们可能会失败的战争。就目前而言，这也是合乎逻辑的选择。"
 USA.506.a:0 "合作愉快"
 USA.507.t:0 "凯撒的陨落"
 USA.507.d:0 "曾被视为共和国守护者的麦克阿瑟，如今却在军队内部失去了最后的信任。西部军区成功争取到了关键支持——由于麦克阿瑟对海军部队的背信弃义，海军上将威廉·D·莱希公开拒绝继续执行战争部的部分命令，并以“维护军队中立”为名，实则切断了麦克阿瑟对海军的控制。\n\n随着海军陆战队与部分民主派军官的迅速行动，华盛顿的警卫被迅速解除武装，通讯系统转入海军控制之下。在忠于麦克阿瑟的部队作出反应前，整个政变就已经宣告结束。整个过程几乎未发生大规模流血冲突，却彻底制止了美国再度步入战火的深渊，以及阻止了美国历史上的第一位独裁者的诞生。那位一度被拥戴为“国家救星”的将军，如今被迫交出权力，等待军事法庭的审判。\n\n麦克阿瑟的时代结束了，但新的权力安排尚未完全成形。合众国的命运仍旧在风雨中飘摇。"
 USA.507.a:0 "莱希将暂时掌握权力直到新总统上台"
 USA.508.t:0 "平叛行动"
 USA.508.d:0 "西部军区的叛匪们正在集结兵力，我们必须即刻出兵粉碎他们的抵抗！"
 USA.508.a:0 "我们将粉碎他们"
 USA.509.t:0 "临时总统？"
 USA.509.d:0 "随着军政府正式承诺举行全国大选，一个此前被暂时搁置的问题立刻摆在了华盛顿面前：在新总统通过选举产生之前，究竟应当由谁以临时国家元首的身份主持联邦政府？\n\n奥马尔·布拉德利将军无疑是最稳妥的人选。他在军中享有广泛尊重，既没有麦克阿瑟那般强烈的个人政治野心，也足以确保军队服从过渡政府。由他监督行政机关、组织复员并筹备大选，可以最大限度避免权力交接期间再度出现混乱。然而，反对者指出，既然军政府已经承诺还政于民，继续让一位现役将领坐在总统办公室中，只会使外界怀疑所谓大选不过是军方统治的另一层包装。文官集团因此提出了三名候选人。约翰·南斯·加纳资历深厚、立场稳健，在民主党保守派和南方政治机器中均有影响力。他的年纪与声望使其很难被视为未来权力的竞争者，正适合担任一位维持局面的过渡总统。昆汀·罗斯福则象征着年轻一代进步主义者，他的家族姓氏和改革主张或许能够帮助政府重新争取工人、中产阶级与自由派的信任。温德尔·威尔基既同商业界关系密切，又长期主张超越旧有党争，其温和而务实的形象也许最适合弥合战争留下的政治裂痕。"
 USA.509.a:0 "布拉德利将军将监督政府运转"
 USA.509.b:0 "约翰·兰斯·加纳是一位能够令所有人满意的长者"
 USA.509.c:0 "昆汀·罗斯福代表了进步力量"
 USA.509.e:0 "温德尔·威尔基是个合适的人选"
 USA.511.t:0 "铁拳落下"
 USA.511.d:0 "内战的最后阶段，联邦军队在各战场取得决定性胜利。工团主义者控制的芝加哥与底特律相继陷落，至上党盘踞的新奥尔良与巴吞鲁日则在混乱中被攻克。然而，内战结束后联邦政府却未能将所有内战分裂势力领导人完全捉拿归案。杰克·里德在芝加哥陷落前越境逃往加拿大，据情报显示他可能已前往不列颠联盟寻求工团主义政府的庇护。休伊·朗在新奥尔良战役中失踪，有传言称他已逃往中美洲或南美洲。威廉·默里的下落同样不明，联邦调查局仍在追查其踪迹。\n\n但并非所有叛军领导人都能成功逃脱：比尔·海伍德在芝加哥陷落时自杀身亡，而厄尔·白劳德在密歇根州被捕，他试图化装成普通工人前往加拿大边境时被识破。威廉·福斯特在密歇根的乡村中被发现，在经过猛烈反抗后被抓获。休伊·朗的弟弟厄尔·朗在路易斯安那州陷落时与银衫军领导人威廉·达德利·佩利，煽动家杰拉尔德·L·K·史密斯等一众领导者被一并抓获。在如今内战结束后，军政府内部就如何处理这些叛匪产生了争议。麦克阿瑟的主要亲信都主张建立特别军事法庭，以最快速度审理并处决这些叛军领导人。但文职人员与一部分更加温和与务实的幕僚则认为公开的司法程序能够展示联邦政府对法治的尊重，同时通过详细的庭审揭露叛军的罪行，为军政府的统治提供合法性，也有助于政府更快完成对残余叛乱分子的镇压。"
 USA.511.a:0 "留给他们的是公正的审判"
 USA.511.b:0 "这些叛徒应得的只有死亡"
 USA.512.t:0 "混入爱国公民中的毒蛇"
 USA.512.d:0 "内战虽已结束，但联邦调查局局长J·埃德加·胡佛向麦克阿瑟将军提交的最新报告显示，战败势力的残余分子并未真正放下武器。过去三个月内，底特律军工厂发生的"意外"火灾、匹兹堡铁路桥梁的破坏事件、费城军需仓库失窃案——这些看似孤立的事件背后，情报部门发现了民兵的活动痕迹。这些人在战场上失败后，脱下了制服，重新融入社会，但他们并未放弃抵抗。他们在工厂、码头、铁路公司甚至政府部门中谋得职位，表面上宣誓效忠联邦，实际上却在等待时机。\n\n为了遏制此类情形，强硬派主张扩大联邦调查局权限，在工厂和社区建立告密网络，对所有曾参与叛乱的人员进行登记监控。但温和派则担心过度审查反而会制造新的不稳定因素。他们主张只针对暴力事件与破坏分子进行调查。麦克阿瑟将军必须在铁腕镇压与有限宽容之间做出选择。"
 USA.512.a:0 "加大审查力度"
 USA.512.b:0 "只要这些人别闹事就行"
 USA.513.t:0 "真正的美国精神"
 USA.513.d:0 "道格拉斯·麦克阿瑟的一生几乎从未离开过军队。他出生在一座边疆军营之中，父亲亚瑟·麦克阿瑟曾披着联邦军的蓝色军装走上战场，而他自己则从西点军校的操场一路走到共和国最危急的前线。对他而言，美国从来不是地图上的一片土地，也不仅是一部写在羊皮纸上的宪法；它是历代军人守卫过的旗帜，是无数普通人用劳动建起的城市，也是一个即使濒临瓦解，仍有人愿意为之坚持到底的共同信念。\n\n内战使这个问题变得比以往任何时候都更加沉重。各方都曾宣称自己才是真正的美国，都曾以自由、正义、秩序或革命的名义举起武器。然而，当战火烧过城镇与农田，那些宏大的口号最终留下的，却只是分裂的家庭、成排的墓碑和一个险些从世界上消失的共和国。如今，随着枪声逐渐远去，麦克阿瑟再次思考，究竟什么才是真正的美国精神，以及自己究竟为什么而一次次挽救美国。它或许不是任何党派的纲领，也不是某一位领袖的意志。它存在于士兵坚守阵地时的勇气之中，存在于工人重新启动机器时的汗水之中，也存在于所有公民默默维持国家运转的责任感之中。美国之所以能够一次次从危机中重新站起，并不是因为它从未犯错，而是因为总有像麦克阿瑟这样的人相信，这个国家仍然值得挽救。无论后世对自己做出任何评价，道格拉斯·麦克阿瑟，这位为美国服务一生的军人，始终认为自己走在拯救美国的正确的道路上。"
 USA.513.a:0 "功过是非，自后人评说"
 USA.514.t:0 "美国民主时代的尾声"
 USA.514.d:0 "自莱克星顿的一声枪响后，美利坚人民争取民主权利的抗争就从未停歇。星条旗的升起被视为美国民主的最终落地，而彼时人们不会想到这场长达百余年的政治与社会实验最终会以如此形式宣告结束。一个世纪以来，美利坚共和国以代议制、权力分立与联邦自治为立国根基。然而，当经济崩溃、州际对立与政治极化不断加剧之时，这套制度逐渐显露出其无法应对全面危机的脆弱性。国会长期陷入党派僵局，行政权威因选举争议而遭质疑，各州政府各行其是，联邦统一的基础摇摇欲坠。最终，内战的风暴摧毁了一切旧有的政治架构。\n\n在此背景下，内战结束后，无论是出于自身的野心膨胀，抑或是发自真心认为民主无法支撑美利坚继续前行，道格拉斯·麦克阿瑟，这位“美利坚的凯撒”带领军方承担起“临时”稳定秩序的职责。从最初协助维持治安与统筹跨州军事调动，再到监督地方权力机构的运行，国家的实际运作重心已悄然转移。紧急状态法令不断延长，其适用范围也逐步扩大，直到最终的常态化。形式上，宪政框架仍在；实质上，决策权已集中于少数能够迅速行动的机构之中。\n\n道格拉斯·麦克阿瑟将军在多次演讲中向公众宣告，军方所做出的一切均来自对美国国家的深切热爱。如今的军政体制并非对共和国传统的背叛，而是对其精神的拯救。在这位独裁者看来，自由若无秩序为前提，终将沦为混乱；民主若无法保障国家生存，也不过是空洞程序。过去近十年的政治危机已经彻底的在事实上宣布了民主程序的低效与无能。他主张建立一种“纪律化的共和国”，在危机消退之前，由军队作为国家意志的执行者，承担历史赋予的特殊责任。\n\n支持者认为，这是一次必要的整顿，是对衰败政治的强力纠偏；而反对者则毫无办法，只能转入地下尝试反抗军队的统治。但无论立场如何，一个事实已无法否认——美国传统意义上的民主运行机制，已经停止。民主时代并未在一声枪响中终结，而是在撕裂整个美国的第二次内战后彻底退场，走入历史。"
 USA.514.a:0 "长达百年的民主实验已经结束了"
 USA.515.t:0 "民主制度终得救"
 USA.515.d:0 ""自莱克星顿的一声枪响后，美利坚人民争取民主权利的抗争就从未停歇。星条旗的升起被视为美国民主的最终落地，而第一次内战则是对民主制度的首次考验。而现在，似乎情况依然明了——民主已经挺过了属于它的第二次考研。自第二次内战落幕后，美利坚的政治秩序一直处于一种微妙而紧绷的平衡之中。战火虽熄，社会却远未恢复常态。大片州域仍在重建，经济体系尚未完全恢复运转，退伍军人与地方武装之间的摩擦时有发生。在这样的背景下，麦克阿瑟宣布军方将不日交还权力的承诺自然备受质疑，而民主支持者们也将信将疑，认为这位“美利坚的凯撒”不可能不贪恋手中的权柄。\n\n然而，在长达数月的紧急状态后，麦克阿瑟在最新的全国讲话中承认，军队承担政治责任本属权宜之计，而非常状态随着政治与经济秩序的恢复，已经不合时宜。为此，国防安全委员会宣布将分阶段收缩紧急授权：各州的选举程序将按照重建进程交由地方自行决断启动时间，但须在两年内完成。国会将在军方监督下恢复例会，且全国临时大选也将被提上日程。尽管此举并不意味着军政体制的终结，例如国家安全事务、战略工业与跨州治安协调仍将由军方主导，且临时戒严状态并未在全国范围彻底接触，但这次调整无疑释放出明确信号——麦克阿瑟将履行他的一切承诺，彻底将民主制度带回美国。如今一切的质疑与讨论都烟消云散，美国的民主制度并未彻底消亡，而是重新置于历史舞台之上。"
 USA.515.a:0 "先贤们的遗产得以保存"
 USA.516.t:0 "执政三巨头的分歧"
 USA.516.d:0 "令人遗憾的是，新的执政政府之间的裂痕出现的比所有人预想的还要早。所谓的表面团结，正在迅速被现实侵蚀。由道格拉斯·麦克阿瑟、奥马尔·布拉德利与德怀特·D·艾森豪威尔共同支撑的执政架构，本质上是一种权宜之计——一种在内战废墟上强行拼合的政治妥协，而非真正意义上的共识。\n\n布拉德利始终坚持，哪怕民主制度已在内战中支离破碎，也必须为其保留最低限度的制度外壳。以他为代表的相当一部分军官认为，军队的使命应当是为文官政治创造恢复的条件，而非永久取而代之。与之相反，麦克阿瑟对此从不掩饰轻蔑。在他看来，民主只是一种在特定历史阶段有用的工具，而一旦国家陷入如同36年政治危机一般的局势时，就极有可能再次将国家引向内战的惨剧。凭借他在内战中积累的无可撼动的威望，麦克阿瑟如今牢牢掌控着政府的实际主导权，拔擢更多的精英官僚与军人进入政府。而在两人之间，艾森豪威尔则对此有截然不同的想法。他同样对战前政治体系的崩溃深感忧虑，却并不认同麦克阿瑟对国家未来的个人化构想。他相信，一种受控的、有限的民主秩序仍有可能在军方监督下重建。\n\n围绕这一设想，军政府内部逐渐浮现出第三种声音：由军方与行政精英共同组成的广泛威权联合体。一个广泛团结各大派系，阶层与团体的大帐篷政党将通过一种“开明的威权秩序”引导国家走向稳定。然而，对于麦克阿瑟来说，这些方案都不过是权力的暂时分散，而最终将带来分裂。他真正期望的，是一个由军人集团统治的军事国家——秩序高于程序、服从先于辩论的真正国防国家。尽管如今这些分歧尚未公开化，但裂痕已然存在，且毫无疑问将暴露于大众视野。"
 USA.516.a:0 "暗流涌动"
 USA.517.t:0 "触碰金融之心"
 USA.517.d:0 "内战期间，联邦政府的战争开支主要依靠发行战争债券与向大型银行借贷来维持。摩根大通、花旗银行、美国银行等华尔街金融巨头在将资产转移到联邦控制区后在战争中扮演了关键角色，为政府提供了数十亿美元的信贷支持，以寻求军政府的庇护。如今战争结束，这些金融机构自然期待获得相应的回报。然而一个常态化军事政权的建立让华尔街陷入了不安——他们担心政府将会对金融系统实施严格管制甚至国有化。\n\n财政部长小亨利·摩根索近日与华尔街主要银行家举行了一系列闭门会议。会议气氛微妙：银行家们试探性地询问政府对金融市场的政策立场，而摩根索则小心翼翼地避免做出明确承诺。双方都清楚，军政府需要金融界的持续支持来资助重建计划并维持政府运转；而华尔街也需要一个稳定的政治环境来保护其资产与利益。\n\n政府内部对此存在三种截然不同的主张。以商务部为代表的自由派官员认为，应当向金融界承诺放松监管，废除内战结束后的临时军管期建立的银行监管法规，允许金融资本在不危害国家利益的条件下自由流动。他们主张政府应专注于维持秩序与国防，而将经济事务交还给市场。这一立场得到了华尔街的热烈欢迎，但遭到军方强硬派的质疑。技术官僚们则提出了不同的方案。他们主张建立政府主导的金融体系，通过国家开发银行等机构，将金融资本引导至军工、基础设施与战略产业。在这一模式下，私人银行仍可存在，但必须服从国家的经济发展规划。而以军方情报部门为代表的威权派则主张对金融界采取更强硬的态度。他们指出，华尔街在内战前的政治投机与经济操纵是导致国家分裂的原因之一，如今不应对这些人过于宽容。威权主义者们建议建立严格的金融审查机制，对不配合政府政策的银行与企业施加压力，必要时可动用行政手段强制其服从。"
 USA.517.a:0 "对他们承诺政府将会放松对金融市场的监管"
 USA.517.b:0 "在新政府的引导下，这些大企业都会有所发展"
 USA.517.c:0 "警告他们，听话的集团与企业才会得到青睐"
 USA.518.t:0 "别来无恙，战友"
 USA.518.d:0 "在新政府成立后，虽然在名义上吸纳各方人士，但实际上所有人都明白现在陆军一家独大，占据了政府的几乎一切主导权。而现在，三巨头也正在思考将更多的忠诚的合作伙伴吸纳入委员会中，作为军政府统治的一支助力。而海军，这一美利坚合众国不可或缺的军事力量，也自然需要谋得在政府中的重要席位。然而，由于麦克阿瑟在内战中对海军的打压，海军领导层对麦克阿瑟充满敌意，而一部分高级将领更是要求将麦克阿瑟派清洗一部分作为他们与新政府合作的要求。而更加现实的选择则是，尝试与海军中的绝大部分派系达成一个妥协方案，确保所有派系都能加入政府并达成一个暂时的“和平协议”。而就在政府与海军沟通时，麦克阿瑟在私下找到了海军上将金，希望在两人之间达成协议，让未来的海军帮助麦克阿瑟强化在政府中的影响力，直到完全掌控如今的联邦政府。"
 USA.518.a:0 "答应海军们的要求，削弱麦克阿瑟的影响力"
 USA.518.b:0 "吸纳海军进入政府，让他们与麦克阿瑟派保持微妙的平衡。"
 USA.518.c:0 "也许金愿意听听麦克阿瑟的建议"
 USA.519.t:0 "四处狼烟"
 USA.519.d:0 "内战的枪声已经沉寂，但混乱的根源并没有消失。在这场撕裂美利坚的战争中，叛乱军队正是脱胎自激进党派的私人武装或是长期盘踞美国社会中的准军事组织。如今战事已毕，这些人却并未随着停战协议的签署而消散。从阿巴拉契亚山区到大平原腹地，各色武装团伙仍在活动——赤卫队潜伏于工厂之中，一部分也潜入了深山老林，抵抗联邦政府。南方各州的民族主义者例如黑色军团等仍然不时袭击地方政府；更有各路黑帮与犯罪团伙趁着权力真空大肆扩张，将整个城区变成自己的地盘。\n\n在政府大力打击这些叛乱残余的时候，如何决定准军事组织的命运也成为了一个值得讨论的问题。取缔所有可能在未来造成威胁的武装团体毫无疑问是最佳方案，但如今百废待兴的政府是否有足够的资源去执行也是一个问题。当然一部分温和派认为对于那些并未公开反政府的准军事组织政府只需要大力监视以防止他们作乱，或者政府可以吸纳一部分愿意与军政府合作的组织来帮助追捕内战中的残存势力。"
 USA.519.a:0 "取缔所有武装团体"
 USA.519.b:0 "所有的准军事组织都需要被监视"
 USA.519.c:0 "收编这些可用之人"
 USA.520.t:0 "庞培之胜"
 USA.520.d:0 "新的三巨头执政模式的运行并非一帆风顺。当麦克阿瑟试图进一步延长紧急状态并尝试进一步为他自己攫取权力时，三巨头中的矛盾开始公开化。参谋长联席会议在一次闭门会议上，以多数票否决了麦克阿瑟提出的无限期延长紧急状态的提案。更令人震惊的是，会议还通过了一项针对麦克阿瑟的不信任动议，指责他"超越职权范围，意图颠覆政府”。而这场军方内部的突然政变由奥马尔·布拉德利将军与德怀特·艾森豪威尔将军联合策划。布拉德利对麦克阿瑟日益明显的个人野心感到警惕，而艾森豪威尔则与国会残余议员、商界领袖以及海军高层保持着密切联系，这些组成了政府内部一个秘密的反对麦克阿瑟的联盟。\n\n海军在这场权力斗争中扮演了关键角色，在政变的同时海军陆战队在海军指挥部的调令下控制了华盛顿特区，确保麦克阿瑟的命令无法传到外界。最终，麦克阿瑟本人被保留军衔与待遇退休，他的党羽则在政府内部遭到清洗。新的政府宣布将“有限的逐步放松社会管制，同时将在可预见的未来重新举行选举”。公众对这场权力更迭的反应相对平静，大多数美国人已经厌倦了政治斗争和政府的宣传，他们只希望生活能够恢复正常。究竟新的政府能将美利坚带往何处，无人知晓。"
 USA.520.a:0 "一波三折的民主命运"
 USA.521.t:0 "团结，权威，秩序"
 USA.521.d:0 "三巨头体制在短暂运行了数月后开始走向崩坏，各方的矛盾也开始逐渐公开化。军方中的民主派与威权派针锋相对，甚至多次几乎大打出手。但最终，在无数次会议与争吵，各方达成了一项妥协方案。这项方案的核心是建立一个集体领导的威权政府，而非个人主导或是三巨头的军事独裁。参谋长联席会议将转型为国家最高委员会，由陆军、海军、陆航队的代表以及关键内阁部长组成，采取集体决策机制。麦克阿瑟保留陆军参谋长职位并担任委员会主席，但他的权力受到其他成员的制衡。同时越来越多的政府外的头面人士开始被吸纳进政府，作为巩固统治的必要之举。\n\n在这一框架下，紧急状态将继续维持近数月，但很快就将被撤销。国会将被重新召集，但其职能限于咨询与立法技术工作，不得挑战国家最高委员会的决策。司法系统恢复运作，但涉及国家安全的案件仍由军事法庭审理。这种安排在形式上保留了三权分立的框架，实质上将权力集中于军方主导的委员会。这种妥协性的威权体制得到了各方的勉强接受。民主派军官虽然不满，但至少阻止了个人独裁的出现；强硬派虽然失望，但保住了军方对国家的实质控制。这种体制的未来充满不确定性。"
 USA.521.a:0 "动荡不再..."
 USA.522.t:0 "无言沉默下的提线木偶戏"
 USA.522.d:0 "随着麦克阿瑟将军的权威日益巩固，那些曾经反对麦克阿瑟或倾向民主的军官们发现自己被系统性地边缘化。奥马尔·布拉德利将军被调往西海岸军区担任无关紧要的职务，德怀特·艾森豪威尔则被安排负责军备采购事务，逐步远离了政治决策核心。紧急状态法令在内战结束后非但未被废除，反而一次次延长，并最终实现了常态化。麦克阿瑟政府围绕这一法律框架，开始尝试与军工企业和华尔街金融家们建立起紧密的利益同盟。军方高层、工业巨头与技术官僚被逐步塞进政府之中担任要职，新的统治集团正在缓慢形成。\n\n为了给这套体制披上合法外衣，爱国者党应运而生。这个所谓的执政党名义上向全体公民开放，实际上完全由麦克阿瑟的军人集团及其盟友控制。党内重要职位均由忠诚的军官或与军方关系密切的文职人员或技术官僚担任，作为军政府的根系维持着国家的运转。与此同时,其他政党在法律上仍被允许存在，甚至定期举行选举。尽管数个政党仍在政坛上你方唱罢我登场，但这些选举早已沦为精心编排的政治表演，而国会也几乎失去了任何作用。军方将领、企业高管与技术专家在封闭的会议室中制定政策，然后通过爱国者党的机器将计划与政策化为现实。报纸上仍在讨论政党竞争，广播中仍在播报选举新闻，但实际上不过是一场精心设计的木偶戏。"
 USA.522.a:0 "台前人表演，台下人鼓掌"
 USA.523.t:0 "爱国者党的成立"
 USA.523.d:0 "在麦克阿瑟将军宣布国会“暂闭”后不久，在华盛顿的一场盛大集会上，爱国者党正式宣告成立。麦克阿瑟将军在国会大厦前发表演说，宣称这个新政党将团结所有忠于美利坚合众国的公民，超越旧有的党派分歧，为国家的复兴与再度崛起而奋斗。台下聚集的数千名支持者中，既有身着军装的现役军官，也有一部分金融精英与旧政府的官僚。\n\n随着爱国者党的成立，越来越多的人被纳入到这个维持军政府统治的政治大帐篷中来。党内核心领导层则由麦克阿瑟亲自指定，并将他们全部纳入国家防卫委员会之中。这个委员会实际上取代了过去的国会成为国家政策的制定中心。在地方层面，爱国者党在各州设立分部，但这些分部的领导人大多出身军队。\n\n在官方层面，爱国者党宣称超越左右之争，既反对工团主义的阶级斗争，也拒绝民主程序所带来的混乱与低效。实际上，在国际观察家们看来，爱国者党的成立实际上标志着美国政党政治的终结。尽管共和党与民主党在法律上仍被允许存在，但它们已被系统性地边缘化。"
 USA.523.a:0 "为爱国者欢呼！"
 USA.524.t:0 "银行家与实业家"
 USA.524.d:0 "姆斯·福雷斯特尔在华尔街摸爬滚打二十余年，从普通证券经纪人一路晋升为迪龙里德公司的总裁。这位精明的银行家在战前就与政府和军方建立了密切联系，内战期间更是作为战争部助理协助负责战争后秦工作。如今内战结束，福雷斯特尔准备凭借其金融专长与政治关系，开始在新政府中发挥更加举足轻重的作用。\n\n福雷斯特尔近期向政府提交了一份特殊的重建计划。该计划的核心是建立政府与私人资本的合作机制：通过设立国家重建公司，由政府提供信用担保，吸引私人银行与企业投资基础设施、军工产业与战略资源开发。福雷斯特尔主张，政府应避免直接干预经济运作，而应扮演协调者与担保人的角色，让市场机制在政府引导下发挥作用。这份计划在政府内部引发了不同反应。支持者认为福雷斯特尔的方案务实可行，既能利用华尔街的资金与专业知识加速经济复苏，又能维持政府对经济的宏观控制。但军方内部对此存在疑虑。一些将领认为福雷斯特尔终究是华尔街出身，其政策必然偏向金融资本的利益，可能损害国家的长远战略需求。更重要的是，让一个银行家掌握经济大权，可能削弱军方对国家资源的控制。"
 USA.524.a:0 "福雷斯特尔的计划有助于我们的经济复兴"
 USA.524.b:0 "给他打发到海军部去吧"
 USA.525.t:0 "协作之路"
 USA.525.d:0 "军政府建立后，麦克阿瑟将军迅速与美国工业界达成了默契。作为交换政治支持的代价，政府向主要工业集团提供了大量军事订单。福特汽车公司获得了生产军用卡车与装甲车的合同，波音与道格拉斯飞机公司承接了空军扩编计划，美国钢铁公司与伯利恒钢铁则负责为工厂与船坞提供建造军事设备与舰船所需的钢材。通用电气、西屋电气、杜邦公司等企业也在这场军备扩张中分得一杯羹。这种政府与企业的紧密合作被官方宣传为"爱国主义的经济动员"，实则是一场利益交换：企业获得稳定的订单与政策保护，政府则得到工业界的政治效忠与财政支持。\n\n在此基础上，经济法团化成为政府与企业共同推动的方向。但关于如何实施这一体系，内部出现了两种截然不同的主张。亨利·福特提出建立中央集权的国家法团体系，由联邦政府统一协调全国的生产计划、资源分配与劳资关系。在他的设想中，各行业应建立全国性的法团组织，由政府任命的委员会统一管理，确保生产效率最大化并消除州际竞争导致的资源浪费。福特认为，只有通过强有力的中央控制，才能在最短时间内恢复经济并为国家安全提供保障。\n\n与之相对，财政部长小亨利·摩根索则主张建立分权化的地方法团体系。他提议在各州扶植政府控制的工会组织，由地方政府根据本州的产业结构与资源禀赋，自行建立包含农业、工业与服务业在内的法团网络。摩根索认为，美国幅员辽阔，各地经济发展水平与产业特点差异巨大，中央集权的计划经济必然导致官僚主义与低效。他主张保留各州的经济自主权，通过联邦协调而非直接控制来实现全国经济的整合。军方高层与大型跨州企业倾向于福特的中央集权模式，认为这更符合军政体制与未来战时动员的需要；而地方政客与中小企业代表则更青睐摩根索的分权方案，担心过度集权会损害地方利益。总之，这一决定将深刻影响美国经济体制的未来走向。"
 USA.525.a:0 "亨利·福特对工业生产总是有一套"
 USA.525.b:0 "让摩根索放手行事吧"
 USA.526.t:0 "老将的经验"
 USA.526.d:0 "内战的硝烟尚未散尽，满目疮痍的美利坚已迫切需要一面能够凝聚人心的旗帜。新的团结政府若要站稳脚跟，就必须找到一位在军民两界皆享崇高声望、且足以压住各方异见的领袖人物——而当今美国，能担此重任者，唯有约翰·"黑杰克"·潘兴将军一人。\n\n潘兴戎马一生，其声望之隆，海内无出其右。对于那些视军政府为洪水猛兽的民主派人士而言，这位老将的威望足以平息一部分异见；而对于曾并肩血战的军界袍泽而言，他又是无可指摘的精神旗帜。然而，岁月从不饶人。昔日那个在马尼拉丛林中策马驰骋、在墨西哥战场上运筹帷幄的铁血将军，如今已是白发苍颜。经过一番劝说与折冲樽俎，潘兴将军最终同意以总统之名出任新国家的门面，但他的精力已大不如前，能否长期坚持实属未知。"
 USA.526.a:0 "向你致敬，将军！"
 USA.527.t:0 "元老院与人民"
 USA.527.d:0 "国家防卫委员会已然成形，爱国者党的架构也初具规模。然而一个悬而未决的问题始终萦绕在团结政府的幕僚之间：这个政权究竟需不需要一位头面人士？尽管军政府的合法性从来不依赖选票，但它同样需要公众的认可与服从。刀枪与法律的统治固然高效，却难以长久。政府内部的强硬派认为，既然牌局已定、权力在握，以委员会直接作为国家决策的最高机构公开运作也无不可。然而更多的人倾向于为这台暴力机器安装一个门面。一位有威望、有名声的国家元首，既能安抚那些对赤裸军统心存抵触的温和派，也能在外交场合代表美国。三巨头与他们的忠仆依然是政策的真正制定者，而总统则作为美国表面上的领袖而行事。"
 USA.527.a:0 "艾森豪威尔就是个不错的人选"
 USA.527.b:0 "老肯尼迪还挺受欢迎的"
 USA.527.c:0 "洛克菲勒是金融界的代表，选他准没错"
 USA.527.e:0 "试试詹姆斯·伯恩斯？"
 USA.527.f:0 "委员会就够了"
 USA.528.t:0 "凌驾于公民之上"
 USA.528.d:0 "新的国家秩序并不打算否认公民的存在，但它正在重新定义何人才配拥有完整的政治影响力。在现政府中，大部分人普遍认为，战前制度最严重的缺陷之一，便是将国家命运交给了缺乏经验、容易受煽动且无需为错误决定承担责任的大众。选举中的口号可以轻易许诺一切，议员可以在国家陷入危机时相互推诿，而真正负责维持政府运转、指挥军队和组织生产的人，却不得不服从短视的政治风向。\n\n为此，国家最高委员会提出建立一套以“服务”衡量政治资格的新制度。现役与退役军官、高级公务员、工程师、企业管理人员以及承担重要公共职责的人，将被视为国家的责任阶层。他们在地方委员会、行业组织与咨询机构中拥有更大的发言权，并能够优先进入政府部门。普通公民仍保留基本法律权利，也可参与受到严格限制的地方选举，但国家重大政策将主要交由那些经过训练、证明过忠诚并实际承担责任的人决定。\n\n政府宣传部门将这种安排称为“责任先于权利”。他们宣称，真正的平等并不是让所有人拥有完全相同的政治权力，而是让那些为国家付出更多的人承担更大的领导责任。军人曾在战场上保卫共和国，工程师正在重建桥梁与工厂，官僚则维持着庞大国家机器的运转；他们自然不应与从未承担公共义务的人拥有完全相同的地位。"
 USA.528.a:0 "爱国即美德"
 USA.529.t:0 "美利坚的土地，还是勇敢者的家乡？"
 USA.529.d:0 "随着新政府逐步恢复宪政运作，一些在非常时期被暂时搁置的议题开始重新进入公共视野。作为影响过去美国数十余年的问题，民权相关如今已经成为新政府亟需处理的一个烫手山芋。\n\n一方面，社会各界已开始期待政府在这一领域作出明确姿态。过去横行南部地区3k党等暴力组织如今已被扫除，但广泛的种族隔离制度却仍旧存在。在重建过程中，私刑与种族仇杀也在南方屡见不鲜，这也不禁让人重新联想到第一次内战后困难重重的接收与重建进程。实际上，对呼声愈发高涨的民权运动的回应，也被视为如今的新政府是否有能力把控局势的重要标志。\n\n另一方面，围绕这一问题的政治平衡依旧脆弱。在接收深南地区的行政机构时，属于旧民主党的部分政要与行政官僚如今已经成为新政府的重要盟友。这些人大多仍旧对种族隔离制度等问题持坚决的支持立场，而党内也有人明确表达了对相关表态的保留态度，担心过早触碰这一议题将引发不必要的摩擦，进而干扰当前更为优先的国家稳定与南方重建进程。\n\n政府必须在象征性承诺与现实考量之间作出判断。这一选择未必会立刻改变制度结构，却将清晰地界定新政府愿意在多大程度上推动社会变革。"
 USA.529.a:0 "对民权运动表达我们的支持"
 USA.529.b:0 "考虑到我们的保守主义者盟友的态度，还是算了吧"
 USA.530.t:0 "秩序下的民主程序"
 USA.530.d:0 "在明确的监管与制度约束之下，新的政党体系开始逐步成形。内战与军事统治所造成的政治断裂，使得任何试图简单复原战前秩序的努力都显得不切实际。经过重重演化后，取而代之的，是一个有别于历史上任何政党体制的新时期。\n\n作为如今的执政政府，爱国者党被作为执政党成立，大量的军界人士，精英官僚与技术主义者被吸纳入了这个代表秩序与发展的右翼大帐篷中。作为如今政坛上的绝对统治者，爱国者党有着无可置疑的影响力与政治吸引力，被广泛认为是毫无疑问的永久执政党。\n\n民主党在内战中的命运尤为复杂。战争与派系斗争几乎摧毁了其全国性组织，地方机器四分五裂，不同派别在生存与合作之间作出截然不同的选择。如今，民主党得以在调整后继续存在，其组织网络虽已缩减，却仍保留了足够的结构，使其能够作为一个有纪律、可预期的反对派参与政治运作——这本身，已是一次重构后的妥协成果。同时，旧民主党的不少成员在内战后选择重新加入民主党，为其带来了相当多的保持有诸如杰克逊主义，农业主义与种族主义的右翼新鲜血液。相比之下，共和党的瓦解更为彻底。党内原有的联盟在内战压力下不复存在，社会自由派与部分进步势力尝试合流，组建所谓的共和进步党。然而，由于其政治立场存在明显左派倾向与对社会主义或是工团主义的同情，有悖于如今的政治秩序，该组织最终毫无疑问的遭到打压并被排除在正式政治体系之外。\n\n与此同时，一部分政治家族、行政精英以及主张强大政府与制度连续性的自由主义者，开始重新审视更早的政治遗产。他们拾起了联邦党时期关于秩序、财政能力与中央权威的理念，在新的制度框架内塑造自身角色。尽管这一传统早已消失于美国政治舞台，但在当前环境下，它再次显现出现实意义。\n\n至少目前，一个以秩序为前提、以程序为形式的多党政治格局已然确立。而根据政府的承诺，等待局势稳定，重建进程大体结束后，新的民主选举就将被提上日程。"
 USA.530.a:0 "一个良好的开端"
 USA.531.t:0 "大西洋壁垒"
 USA.531.d:0 "第二次内战的创伤尚未愈合，美国公众对再次卷入战争的恐惧已经深入人心。数十万美国人在内战中丧生，无数家庭支离破碎，工业设施遭到严重破坏。在这种背景下，孤立主义情绪在全国范围内迅速蔓延。欧洲的政治版图随着黑色星期一的波及与第三国际的动作开始彻底的重组，其所造成的广泛影响也自然波及到如今的美国。军政府内部对美国应采取何种外交政策产生了激烈争论。孤立主义派援引门罗主义的传统，主张美国应专注于西半球事务，将欧洲的冲突视为与己无关的旧世界纷争。他们指出，美国刚刚经历内战，国力尚未恢复，此时介入欧洲事务无异于自寻死路。更重要的是，无论是德国的威权君主制还是法英的工团主义，都与美国的价值观格格不入，没有理由为任何一方流血。孤立主义派的核心主张是建立"大西洋壁垒"——通过强化海军力量与加勒比海防御体系，将美洲与欧洲的冲突彻底隔离。他们提议优先控制整个美洲大陆，防止工团主义思想渗透西半球，同时对欧洲各国保持等距离外交。在这一战略下，美国将成为美洲的保护者与仲裁者，但绝不介入大西洋彼岸的战争。\n\n然而一部分官僚们提出了不同意见，他们承认美国不应直接参战，但认为完全的孤立主义既不现实也不明智。欧洲战争一旦爆发，交战各方对武器弹药、钢铁石油的需求将急剧上升，这为美国工业提供了巨大的商机。通过向交战双方出售军火与战略物资，美国不仅能加速经济复苏，还能在保持中立的同时影响欧洲局势。这一"武装中立"政策在商界与部分军方人士中获得了支持。完全的孤立主义符合民意，但可能错失经济复苏的机会；而军火贸易虽能带来利润，却存在卷入战争的风险。无论如何，美国都必须明确其在即将到来的欧洲冲突中的立场。"
 USA.531.a:0 "让欧洲人自娱自乐去吧"
 USA.531.b:0 "也许在不介入的情况下发一笔财还是不错的"
 USA.532.t:0 "新时代的保守主义之象征"
 USA.532.d:0 "旧共和国的保守主义建立在地方自治、有限政府、自由企业与对激进改革的警惕之上。然而，内战已经摧毁了许多过去被视为理所当然的政治基础。州政府曾公然反抗联邦，私人资本无力阻止经济崩溃，党派争斗更使华盛顿在危机来临时陷入瘫痪。若保守主义仍然只是要求国家退回战前的旧秩序，它便无法回答这个时代最迫切的问题。爱国者党内部因此形成了两种观点。传统派认为，国家灾难的根源正是对权威、宗教、家庭与社会责任的轻视。新政府应当恢复纪律，维护私有财产，赋予军队和地方精英更大的社会地位，并阻止工会、激进知识分子和大众政治再次撕裂国家。在他们看来，新时代的保守主义必须首先是一种捍卫秩序的力量。另一派则主张，若保守主义拒绝一切改革，最终只会把普通民众重新推向极端主义。联邦政府应保留对关键产业、金融体系和公共工程的协调权，同时建立有限的社会保障，扶持家庭农场和中产阶级。政府不必向社会主义低头，却必须证明秩序不仅服务于将军、银行家与大企业，也能为普通美国人提供稳定的生活。双方都反对战前那种无休止的党争，也都承认国家需要强有力的领导。真正的分歧在于，新保守主义究竟应当守护过去留下的传统，还是主动塑造一个更稳定、更有组织的新社会。"
 USA.532.a:0 "传统、信仰与权威将重新支撑美国"
 USA.532.b:0 "唯有顺应时代，保守主义才能守住秩序"
 USA.533.t:0 "新选举"
 USA.533.d:0 "在军政府统治和漫长的政治整顿之后，美国人终于再次走向投票站。这场选举同战前的任何一次大选都不相同。极端组织已被禁止，候选人必须宣誓忠于新宪制，政党资金与竞选宣传也受到国家选举委员会的严格监督。军方则公开声明，无论谁取得胜利，都不得挑战国家统一、军队地位与战后重建的基本方针。爱国者党将自己塑造成拯救共和国的政治力量。它联合了保守派军官、南方民主党旧部、企业家与强调秩序的中产阶级，承诺维持强大的国防、保护私有财产，并防止国家重新落入混乱。其支持者相信，既然军队已经赢得了战争，政治家便不应轻易推翻军政府建立的制度。复兴后的联邦党则自称国家理性与专业治理的继承者。它吸纳了高级官僚、金融家、东海岸政治家族和主张强有力联邦政府的温和自由派。联邦党人支持国家规划、现代行政体系与积极的国际政策，并宣称美国需要的不是群众激情，而是由最有能力者进行稳定治理。民主党虽然在战争与政治清洗中元气大伤，却依靠地方组织、南方机器和长期积累的群众基础重新站上政治舞台。党内候选人承诺尊重新宪制，同时恢复更多地方权力、扩大民众参与，并阻止军方和联邦官僚永久垄断国家政治。"
 USA.533.a:0 "爱国者党毫无疑问的取得胜利！"
 USA.533.b:0 "联邦党人归来"
 USA.533.c:0 "民主党重回政治舞台"
 USA.534.t:0 "[GetYear]年选举"
 USA.534.d:0 "又一个总统任期走到了尽头。在新宪制划定的政治边界之内，爱国者党、联邦党与民主党再次围绕国家未来展开竞争。街头没有重现战前那种失控的政治暴力，竞选活动也始终受到选举委员会与国家安全机关的监督，但报纸、广播和公共集会仍充满了三党彼此攻击的声音。有限民主或许限制了政治竞争，却并未消除美国人对政治的热情。"
 USA.534.a:0 "爱国者们毫无疑问的取得胜利！"
 USA.534.b:0 "联邦党人归来"
 USA.534.c:0 "民主党重回政治舞台"
 USA.535.t:0 "军国主义之热忱"
 USA.535.d:0 "内战的胜利为军方在美国社会中树立了无可置疑的权威。在无可置疑的联邦最高统治者麦克阿瑟看来，这种权威不应仅限于政治领域，而应渗透到社会生活的方方面面。宣传部门开始系统性地推广军国主义价值观，将军人塑造为新时代美国的理想公民典范。报纸、广播与电影中充斥着歌颂军队的内容，教科书则被改写以强调纪律、服从与牺牲精神的重要性。\n\n政府推出了一系列旨在军事化社会的政策。公立学校引入军事训练课程，学生必须学习队列、射击与战术基础知识。与政府关系密切的巨头企业被首先要求采用军事化管理模式，在工厂车间实行准军事化的等级制度与纪律规范，同时这也便于政府将势力渗透进这些企业之中。在政府内部，公务员系统参照军队建制进行调整，高级文职官员或部门主管将被授予相当于军衔的行政级别。\n\n在麦克阿瑟与他的亲信们看来，内战暴露了美国社会的松散与无序，只有通过军事化的组织原则才能建立真正稳定的社会结构。在军政府治下，社会中将培养出纪律严明、服从权威、愿意为国家牺牲的新一代公民。而这些新生力量，则将成为将美国塑造成一个积极进取的军事强国与世界霸权的强大助力。"
 USA.535.a:0 "新时代的美国标杆"
 USA.535.b:0 "为了征服与进取"
 USA.536.t:0 "温情脉脉的独裁外衣"
 USA.536.d:0 "军政府的统治向来以命令、纪律与服从示人。国会依旧紧闭大门，反对党受到严格限制，各州政府也不得不接受来自华盛顿的军事监督。然而，仅凭军队的威慑无法永久治理一个幅员辽阔、又曾以自由传统自豪的国家。美国人民可以在危机中服从军令，却不会永远满足于生活在刺刀的阴影之下。在白宫的推动下，各地开始为这套军政制度赋予一种更加温和的面貌。军费的一部分被转用于退伍军人住宅、军人遗属津贴与公共医疗，陆军工程兵则被派往各地修缮基建。广播中的声音也不再只谈论敌人、纪律与牺牲，而开始反复强调家庭、安定和每个美国人都应享有的基本尊严。批评者对此嗤之以鼻。廉价住房不能代替自由选举，公开慰问也无法改变军事法庭和新闻审查的存在。但这层温情脉脉的外衣确实发挥了作用。对那些终于得到工作、住房和稳定生活的家庭而言，抽象的政治权利似乎不再像战争年代那般迫切。麦克阿瑟并不需要美国人热爱独裁；只要他们相信政府仍然关心自己的生活，便足以让秩序继续维持下去。"
 USA.536.a:0 "服从带来奖赏"
 USA.537.t:0 "青年精神，活力迸发"
 USA.537.d:0 "现在，麦克阿瑟政府将青年视为塑造新美国的关键群体。这一代年轻人在内战的阴影下成长，他们既是战争的受害者，也是重建国家的希望。当一名大好青年见证了国家分裂所带来的苦痛与悲剧，那么他自然而然会从心底涌现出爱国与忠诚的热情。而这正是麦克阿瑟总统所想要看到的。白宫认为，必须通过系统性的动员与教育，将这些年轻人转化为忠诚于新体制的力量。宣传机器开始大规模宣传"青年精神"，将年轻、活力与献身国家联系在一起。在政府的号召下，教育系统进行了全面改革，而学校课程则增加了政治教育内容，忠于国家、服从权威、崇尚纪律被塑造成了社会所崇尚的价值观。文学与艺术课程则强调集体主义价值观，自由主义思想被批判为"导致国家分裂的毒素"。\n\n过去简单的体育教学则逐步走向军事化，诸如队列训练、野外拉练与射击练习成为了高等教育的必要一环。在一些南方州或是美加边境州，甚至更大规模的模拟军事课程也被纳入到了大学教育中。在学校之外，政府建立了全国青年组织，所有16至25岁的青年都被要求加入。其模仿军队建制，设立严格的等级制度与纪律规范。尽管该组织被强制要求参加，但其回报也可谓丰厚：表现优异者将有机会直接被提拔进入军校深造，或得到进入政府部分的便利通道与优先培养的特权。\n\n如今，这些正在被军事化的青年们已经成为了国家复苏的重要帮手，绝大部分军方成员希望能够让这些经过深造的优秀预备役统统加入军队，但一部分政府顾问也认为如今国家仍在重建期，如果这些服从命令，意志坚定且国家优先的年轻精英能够深入工厂与生产，占据技术管理岗位，无疑是帮助国家更快重建的重要一环。"
 USA.537.a:0 "优秀的美利坚青年应当献身于军旅"
 USA.537.b:0 "我们歌颂生产线上苦干的身影"
 USA.538.t:0 "背后长刀"
 USA.538.d:0 "华盛顿的政治气氛突然变得紧张。联邦调查局局长胡佛向麦克阿瑟将军提交了一份绝密报告，声称发现了一个"企图颠覆政府的阴谋集团"。报告指控数十名军官、政府官员与社会名流涉嫌在内战中与敌对分裂势力沟通，密谋反对政府，或试图恢复旧有的民主制度。被指控者包括数名过去反对麦克阿瑟的高级军官、多位曾在过去政府任职的文职官员，以及一些公开批评过军政府政策的知识分子与企业家。报告的证据主要来自窃听、告密与审讯。联邦调查局声称截获了这些人之间的秘密通信，记录了他们在私人聚会上的"煽动性言论"，并从被捕的嫌疑人口中获得了"同谋者"的名单。然而，即使其中的确有反对政府的阴谋存在，但其关联的范围之广也令人咋舌。\n\n尽管如此，联邦调查局与宪兵队还是在全国范围内同时出击，名单上的所有嫌疑人均遭抓获。在军方的数个秘密基地中，近百名反对派接受了审讯。部分人在审讯中"承认"了罪行，更多人则坚持自己的清白。几周后,军事法庭开始审理这些案件。审判过程迅速，而判决结果则毫无悬念：核心人物被判处死刑并迅速执行,其余人被判处长期监禁或流放。在外界看来，这些人只是突然的消失无踪，没有留下任何的口信或是踪迹。很快，这些传闻就被公众所遗忘，政府中各路政党的表面的明争暗斗仍在继续，而军队则在暗处继续寻觅着任何可能威胁统治的不安定因素。"
 USA.538.a:0 "恐惧也是武器"
 USA.538.b:0 "我们在幕后掌控一切"
 USA.539.t:0 "麦克阿瑟宣布国会暂闭"
 USA.539.d:0 "尽管麦克阿瑟独裁的野心已经昭然若揭，但全美国甚至全世界都未曾想到这一天来得如此迅速。在一场全国电视讲话中，麦克阿瑟向全国宣布无限期关闭国会，直到国家紧急状态接触后再另作打算。在演讲中，麦克阿瑟将军回望了1936年大选前后的政治混乱：当国家仍面临内部威胁与经济困境时，议员们却沉迷于党派争斗与权力游戏。为了国家安全与社会稳定，军方决定无限期暂停国会活动，直到美国不再面临任何内外威胁。\n\n麦克阿瑟援引《惩戒叛乱法》与新颁布的《国家紧急状态法》，授权总统，即他本人在紧急情况下采取一切必要措施维护国家安全。在演讲的同时，本就空置的国会大厦随即被军队接管，议员们被要求离开华盛顿返回各自选区。公众对国会关闭的反应出奇地平静。经历了内战的创伤后，大多数美国人已经对政治失去兴趣。官方媒体将国会关闭描述为"清除政治腐败的必要步骤"，并大力宣传军政府在经济重建中的成就。少数试图组织抗议的团体很快被联邦调查局瓦解，其领导人以"危害国家安全"的罪名被捕。如今，行政、立法、司法权力全部集中于麦克阿瑟及其军事委员会手中。美国已经从一个形式上的民主国家彻底转变为军事独裁政权，而没人知道这将持续多久。"
 USA.539.a:0 "直到美国不再受到任何威胁...永远"
 USA.540.t:0 "对政坛蛀虫的审判"
 USA.540.d:0 "军政府接管华盛顿后，过去数十年积累下来的政治账目终于被一一翻开。调查委员会从国会档案、银行记录与企业往来中发现，大批议员、州长、党务头目和政府承包商曾利用职权为自己牟利。他们在经济崩溃时向金融集团出售政策，在内战前夕煽动党争，却又在共和国真正陷入危机后忙于转移财产、寻找退路。在麦克阿瑟看来，正是这些人把美国拖入了灾难。职业政客将公共职位视为可以买卖的私产，党派机器以政府合同换取选票，国会议员则在财团、工会和地方势力之间反复下注。如今，他们又试图用宪法程序和政治豁免为自己建立最后一道防线，仿佛共和国经历的一切同他们毫无关系。\n\n特别军事法庭已经完成首批案件的审理。部分被告确实直接协助过叛乱势力，另一些人则被控贪污、渎职、破坏国防或在国家危难时期囤积居奇。许多人质疑审判程序过于仓促，而军方正在把政治异议与真正的叛国行为混为一谈。然而，军方对此毫无反应。今天，法庭将公布最终判决。华盛顿不会再为那些把国家当作私人领地的人提供庇护。"
 USA.540.a:0 "别了，叛徒们"
 USA.541.t:0 "属于每个人的责任"
 USA.541.d:0 "战争已经结束，但军政府不断提醒民众，危险从未真正远去。残余的地下组织仍在偏远地区活动，外国情报机关试图渗透港口、大学与军工企业，罢工、谣言和地方冲突也可能被敌人利用，重新点燃刚刚熄灭的战火。单靠军队与警察，无法监视一个横跨大陆的国家。国家安全委员会因此推出了一项面向全民的“公民警戒计划”。工厂管理者必须报告可疑的破坏行为，铁路职员需要留意异常货运，社区组织则被要求登记外来人口与长期无人居住的房屋。学校、教会、工会和退伍军人协会也将定期接受安全宣传，学习如何识别间谍活动、地下宣传和极端组织的招募方式。\n\n政府强调，这并不是鼓励无端猜疑，而是把国家安全变成每一位公民的共同责任。一个工人及时报告被篡改的机器，一个邮差注意到来源可疑的包裹，一个邻居发现陌生人在夜间反复拍摄铁路，都可能阻止一次破坏行动。内战已经证明，国家毁灭之前往往不会发出明显警报。真正的爱国者不应只是等待军队保护自己，也应主动成为共和国的耳目。"
 USA.541.a:0 "维护国家安全有你的一份力"
 USA.542.t:0 "勇敢的小小骑兵"
 USA.542.d:0 "全国各地的学校操场上，越来越多的孩子穿上了整齐的制服。他们在退伍军人和预备役军官的指导下列队行进，学习急救、野外生存、地图辨识和基础通信。政府将这一新成立的青少年组织命名为“小骑兵团”，既纪念美国历史上的边疆骑兵，也象征年轻一代将承担起守护共和国未来的责任。政府公开宣称，小骑兵团并不是一支真正的儿童军队。成员不会被派往战场，训练也以纪律教育、体育活动、公共服务和爱国主义课程为主。他们会协助收集废旧物资、照顾退伍军人家庭、参与防灾演习，并在国家节日期间担任仪仗与志愿服务工作。表现优异者日后还可以优先进入军校、技术学院或政府部门。对于经历过内战的一代家长而言，这项计划有着复杂的意义。有人相信，年轻人需要纪律、团结与共同信念，以免再次被极端主义诱入歧途；也有家长不愿看到孩子从小生活在军号、口令和政治宣誓之中，担心军政府正把整个社会都变成军营的延伸。宣传海报则对此给出了简单得多的答案：画面中的少年骑在高头大马上，手举星条旗，远方则是重新升起的城市天际线。标题写道——美国需要年轻、勇敢并准备承担责任的一代。"
 USA.542.a:0 "美国需要你们！" 
 USA.543.t:0 "美利坚的军政制度"
 USA.543.d:0 "国会并未被正式废除。根据军政府发布的公告，它只是被“暂时关闭”，直到国家恢复到适合正常民主制度运作的状态。问题在于，没有人能够准确说明这一时刻何时才会到来。曾经由议员、党务干部和职业政客占据的办公室，如今坐满了将军、参谋军官、军事法官与经过安全审查的文职专家。行政命令取代了漫长辩论，军令式的责任体系也取代了政党之间的妥协。出乎许多批评者意料的是，这套制度至今仍运行得相当顺畅。铁路得到统一调度，重建计划不再因地方争执而长期拖延，预算也能在几周内完成分配。军官们习惯于明确目标、服从命令和按期汇报，他们确实比过去的国会更擅长让国家机器迅速行动。军政府因此不断宣称，美国终于摆脱了党争、游说与无休止的政治交易。\n\n但军队从来不是一个不受利益影响的纯洁团体。军工企业通过退役将领接触采购部门，承包商以顾问职位和未来董事席位换取合同，各军种则为了预算、基地与装备项目彼此竞争。过去发生在国会走廊里的交易，如今只是转移到了军官俱乐部、采购委员会和封闭会议室中。作为这台庞大战争机器的最高操纵者，麦克阿瑟必须不断维持微妙的平衡。他需要满足军队的利益，才能确保将领们继续支持政权；却又不能让派系、腐败和企业渗透侵蚀军队的战斗力。与此同时，政府必须说服普通美国人相信，军政制度并不是一小群军官对国家的占有，而是共和国在危难时代唯一可靠的盾牌。"
 USA.543.a:0 "我们必须谨慎处理"
 USA.544.t:0 "不断扩张的利益集团"
 USA.544.d:0 "军政府最初承诺以纪律取代党争，以国家利益取代私人交易。然而，随着重建预算、军备合同与行政权力迅速扩张，围绕政府形成的新利益集团也日益庞大。军工企业、银行、建筑承包商、公司和退伍军人组织纷纷在华盛顿设立办事机构，并聘请同军方关系密切的顾问替他们争取合同与政策优惠。在一些将领看来，军队、工业与金融体系本就应当构成一个共同体：政府提出战略目标，企业提供生产，银行则负责筹集资金。只要各方都忠于国家，这种紧密合作便能减少浪费，使美国在和平时期也维持足以应对任何危机的动员能力。\n\n但监察部门提交的报告表明，合作正在逐渐越过界限。部分军官在批准采购案后立即前往承包企业任职，企业代表甚至参与装备标准和军事部署的讨论。某些金融家则利用提前获得的政府计划进行投机。军政府试图消灭的旧式政治腐败，正在以更加封闭、更加难以监督的形式重新出现。麦克阿瑟可以承认军队、企业和金融界已经成为同一国家机器的不同部分，将这种利益结合包装成美国团结的新形式；也可以授权监察机关展开整顿，限制旋转门任职并重新审查军购合同。"
 USA.544.a:0 "这就是真正的团结"
 USA.544.b:0 "整顿这一现象"
 USA.545.t:0 "军政府的新形象"
 USA.545.d:0 "民意调查与地方报告显示，军政府在恢复秩序和推动重建方面获得了不少支持，但其公共形象仍然冰冷而疏远。对许多普通人而言，政府意味着宵禁命令、检查站、征用通知和一群拒绝回答问题的军官。即使政策本身卓有成效，缺乏解释与沟通也使社会上不断滋生关于秘密逮捕、军方腐败和无限期独裁的传闻。一批年轻宣传官员主张改变军政府的对外形象。他们建议安排麦克阿瑟与高级将领接受广播采访，公开视察学校、医院和重建工地，并允许经过筛选的记者进入部分政府部门。新闻纪录片可以展示军人修复桥梁、运送救灾物资和帮助退伍士兵就业的画面，使民众看到军政府不仅拥有枪炮，也承担着照顾国家的责任。军中保守派对此极为不满。在他们看来，军队的威望来自距离、纪律与神秘感，而不是像民选政客一样向媒体解释每一项决定。记者只会寻找丑闻，公开讨论也会泄露内部矛盾。军政府若试图讨好舆论，最终只会重新落入战前政治表演的旧习。事实上问题不只在于宣传方式，也在于军政府究竟如何理解自身合法性。它可以主动塑造一个亲近、负责而现代化的公众形象，也可以坚持军队内部的传统，相信秩序和成果本身便足以赢得服从。"
 USA.545.a:0 "与媒体沟通，塑造更高大的形象"
 USA.545.b:0 "交给军队内部处理"
 USA.546.t:0 "新鲜血液"
 USA.546.d:0 "军政府擅长制定命令，却并不总是擅长理解社会。随着战时紧急状态逐渐转为长期统治，越来越多的军官发现，管理一个国家远比指挥一支军队复杂。经济政策、舆论引导、外交宣传与社会改革都需要军队体系之外的专业知识，而单靠参谋部和安全机关无法解决所有问题。沃尔特·李普曼的名字因此出现在总统顾问名单上。这位记者、评论家与政治思想家长期关注现代大众社会、公共舆论和专家治理。他对无节制的民粹政治深感怀疑，认为普通公众往往只能通过媒体构建的有限图景理解复杂世界，因此国家必须依靠受过训练的专家和负责任的精英进行长期决策。这样的观点，似乎同军政府强调秩序、专业与理性治理的理念存在不少共同之处。\n\n李普曼却并不是军人政治的天然拥护者。他同样警惕权力不受监督，也不愿沦为替独裁装点门面的宣传家。若邀请他进入政府，他可能帮助军政府建立更加成熟的政策研究、新闻协调和公众沟通体系，也可能在内部不断提出令人不悦的质疑。军政府需要新鲜血液，但每一名进入权力核心的文人，都可能把不同于军方的思想一同带进来"
 USA.546.a:0 "李普曼这种人肯定会有用的"
 USA.546.b:0 "有必要怀疑他的忠诚"
 USA.547.t:0 "为军营巨兽踩刹车"
 USA.547.d:0 "军政府建立之初，庞大的军事开支被视为确保国家生存的必要代价。新的兵工厂、空军基地、舰队扩建与常备部队计划为数百万人提供了工作，也让军队成为美国经济复苏的重要支柱。然而，随着一个又一个项目得到批准，军费已经开始吞噬联邦预算中越来越大的份额。财政部门警告，国家无法永远以战时速度维持军事建设。公路、住房、教育与社会救助同样需要资金，过度依赖军工订单也会让整个经济围绕战争需求畸形发展。一旦削减合同，大批企业和城市便可能立刻陷入萧条；若继续扩张，政府债务和通货膨胀又将不断恶化。\n\n问题的另一面，是金融家与大企业在军事经济中的影响力。银行通过认购国债获利，企业借长期合同扩大垄断地位，富裕阶层则利用政府关系规避税收。部分军官认为，与其削弱军队本身，不如加强资本管制、提高高收入者税负，并迫使金融界承担更多维持国家安全的成本。麦克阿瑟必须在支撑政权的两根支柱之间作出选择。放慢军事建设能够缓解财政压力，却可能引起军方和军工企业的不满；收紧对金融家与富人的控制，则能继续维持军备计划，却会冲击军政府同商业精英之间的联盟。无论选择哪一条道路，这头由军队、工业和资本共同喂养的巨兽，都不能再毫无节制地增长下去。"
 USA.547.a:0 "放缓军事建设速度"
 USA.547.b:0 "收紧对金融家与富人的掌控"
 USA.548.t:0 "对海军上将的承诺"
 USA.548.mac1.d:0 "欧内斯特·J·金一直是麦克阿瑟最可靠的支持者之一。在共和国最危急的时刻，这位性情强硬、作风专断的海军上将不仅维持了舰队的服从，也帮助华盛顿确保了沿海港口、海上运输线与海外驻军不会脱离中央控制。没有海军的合作，陆军即便能够控制大陆，也难以真正宣称自己掌握了整个国家。麦克阿瑟也曾亲口向金许诺，一旦战争结束并建立新的国防政府，海军将在权力核心中获得一个与其贡献相称的位置。金对此始终记忆犹新，而海军部内部也已经将这项承诺视为陆海军长期合作的基础。\n\n然而，局势早已发生变化。如今，陆军控制着首都、地方行政机关与绝大多数国内驻军，军政府中的主要职务也几乎全部由陆军将领占据。部分顾问认为，既然麦克阿瑟已经不再需要依靠海军维持政权，便没有必要为了过去的承诺分享手中的权力。金本人虽然忠诚，却绝不是一个容易驾驭的下属；让他进入最高决策机构，可能会使海军获得一个能够公开挑战陆军的政治中心。可若麦克阿瑟食言，后果同样不容忽视。海军军官向来重视本军种的尊严，他们不会乐于接受自己只是陆军政府的附庸。"
 USA.548.mac2.d:0 "欧内斯特·J·金是军政府最坚定的海军支持者之一，他在舰队中的威望与影响力不容低估。战争期间，正是他确保海军继续承认华盛顿的命令，并协助政府控制港口、航运与沿海地区。为了奖励他的忠诚，也为了让海军相信自己并未被排除在新秩序之外，一些顾问建议允许金进入最高委员会，取得一个同陆军将领相等的正式席位。支持者认为，这将使军政府真正成为代表整个武装力量的国防政权，而不是披着国家外衣的陆军专政。海军的造船计划、海外基地和战略需求都需要有人在最高层直接发声；让金进入委员会，也能够减少陆海军之间日益明显的预算争夺和相互猜疑。\n\n陆军将领却对此保持警惕。委员会目前能够高效运作，正是因为成员大多来自同一套指挥体系。金以固执、好斗和拒绝妥协闻名，一旦获得独立席位，他很可能要求扩大舰队预算，并反对陆军继续支配国防政策。更有人直言，军政府的胜利主要依靠陆军在本土作战取得，海军没有资格在胜利果实中占据同等份额。"
 USA.548.a:0 "给他机会"
 USA.548.b:0 "我们需要维持陆军的霸主地位"
 USA.549.t:0 "退伍军人协会成员赢得选举"
 USA.549.d:0 "随着退伍军人协会不断扩张，这个最初负责安置复员士兵、照顾伤员和组织纪念活动的团体，已经逐渐成为全国最有影响力的政治力量之一。协会地方分部遍布城市与乡镇，其成员拥有统一的组织、鲜明的身份认同，以及普通政党难以匹敌的纪律性。最近一轮国会补选中，协会支持的候选人取得了令人震惊的胜利。多名长期批评麦克阿瑟与军政府的议员失去席位，而新当选者几乎都承诺支持强大的国防、限制激进政治并维护现有政权。协会将这一结果称为“战壕对政客的裁决”，并宣称人民终于选择了真正为国家付出过的人。质疑声也随之而来。反对派报纸指出，协会与政府部门之间存在密切联系，其候选人获得了军方控制媒体的大量正面报道。部分投票站外还聚集着身穿制服、佩戴协会徽章的退伍军人。尽管他们没有公开阻止任何人投票，但其存在已经足以让不少选民感到压力。协会领导层对此极为愤怒。他们要求政府惩罚散布“诽谤”的报社，逮捕那些指控协会操纵选举的编辑，并公开确认退伍军人参与政治的正当性。"
 USA.549.a:0 "好，保卫协会的利益。"
 USA.549.b:0 "我们不会插手的"
 USA.550.t:0 "刺杀麦克阿瑟"
 USA.550.d:0 "今天，华盛顿国家广场举行的政治集会上，当麦克阿瑟向群众发表演说时，一声枪响险些引发观众的大规模逃窜。枪击者的目标显然是麦克阿瑟本人，他在被捕后向人群高呼麦克阿瑟的独裁军政府将彻底摧毁美国，呼吁人民团结起来推翻他的暴政。事件之后展开的刑事调查中，这名疯子的胡言乱语并没有追究到其他政治团体，大概是匹有意夺走总统生命的独狼。麦克阿瑟本人对这种荒谬的指控一笑置之，不过他还是提高了特勤局的经费，以免吸引更多独狼。"
 USA.550.a:0 "你阻止不了麦克阿瑟"
 USA.551.t:0 "国家复兴"
 USA.551.d:0 "坚持为他们的叛国纲领斗争的武装分子正陆续被我军剿灭，麦克阿瑟将军此刻正面临着一项问题，我们该如何处置这群现在才放下武器的士兵呢？部分顾问人士依然建议将军宽容为怀，另有不少人认为他们理应为自己的罪行坐牢。总司令将作何决断呢？"
 USA.551.a:0 "乱臣贼子万劫不复！"
 USA.551.b:0 "这片土地流过太多的血……"
 USA.552.t:0 "研究“战争与和平”"
 USA.552.d:0 "我国的外交成果曾经是驻外大使们心血来潮的产物，许多人的职位甚至是向某党捐款买来的。遗憾的是，我们的世界太过危险，不应再放任外交官员做出任何轻率的决定。麦克阿瑟将军认为，有必要采用新模式，在一群值得信赖的专家中间事先达成共识，从而指导美国外交活动的协调性。这就是研究“战争与和平”的起因，许多人认为只有最聪明的那批人才有权成为合众国在美丽新世界的代表，因此成立的政治实体，被称为“外交关系委员会”，负责向麦克阿瑟将军提供如何镇压世界各地激进势力的全套意见。"
 USA.552.a:0 "不再受制于外交官"
 USA.553.t:0 "贤君与世外桃源"
 USA.553.d:0 "赫斯特报业遍布全美的报社媒体为麦克阿瑟提供着不小的支持，他们经常把总统的形象塑造为有感于“挽救共和国免遭摧残”的号召，而在人群中挺身而出的辛辛纳图斯。赫斯特报业就像麦克阿瑟及其亲信的灯塔那样，通过电影与新闻漫画精心塑造着这样一位神话般的人物，对国家稳定起着至关重要的作用。甚至连他们对激进工会与民粹主义的攻击，也与麦克阿瑟的电台演讲交相呼应。"
 USA.553.a:0 "我们很感激您的支持"
 USA.554.t:0 "美国新常态"
 USA.554.d:0 "事实证明，数年前当麦克阿瑟宣布因国家紧急状态而拒绝辞去总统职务时，那只不过是他独揽大局的幌子。成千上万的美国公民在他的任期内人间蒸发，激进主义游击队仍在乡村地区肆虐，用居民手中掠夺来的财物为他们的政治活动提供资金，民主的基石似乎还没准备好支撑起这个国家。尽管如此，还是有不少人在过去几年内被激励为忠实的麦克阿瑟主义者，一种全新的政治家也随之出现在众议院，他们认为有必要发挥军队在国民生活中的作用，培养和树立良好的商业环境，确保公民权利不会因经济停滞而受到侵害。"
 USA.554.a:0 "喂饱新的支持者们"
 USA.554.b:0 "拒绝任何来自国会的提案"
 USA.555.t:0 "联邦宪法保卫处"
 USA.555.d:0 "宪法保卫处是一个负责约束极端主义政党，以防止其做大的部门。我们应对社会党，至上党和别的极端团体的经验表明，我们不能容许他们继续存在。这些限制包括限制政党的政治立场，例如极端左翼和极端右翼，而且每个党派都应当为他们的继续存在而支付巨额费用。"
 USA.555.a:0 "给他们颜色看看！"
 USA.556.t:0 "道格拉斯·麦克阿瑟的命运"
 USA.556.d.usa:0 "现在是我们决定麦克阿瑟的命运的时候了。在战争期间，他的行为毁誉参半，关于如何处置他有很多争议。虽然他确实完成了任务，但我们不得不迫使他在内战后放弃权力，最后，他确实下台了。将军们和政客们都认为，无论如何，他都应该受到惩罚，尽管这一决定在我们的人民中可能不会受欢迎。我们该怎么办？"
 USA.556.d.wcc:0 "现在是我们决定麦克阿瑟的命运的时候了。在战争期间，他的罪行罄竹难书，关于如何处置他有很多争议。虽然他确实完成了任务，但我们不得不迫使他在内战后放弃权力，最后，他确实下台了，但这不足以掩盖其暴政。将军们和政客们都认为，无论如何，他都应该受到惩罚，尽管这一决定在我们的人民中可能不会受欢迎。我们该怎么办？"
 USA.556.a:0 "逮捕他！"
 USA.556.b:0 "开除军籍"
 USA.556.c:0 "悄悄地派他去执行一项次要任务"
#内战后 民主
USA.560.t:0 "愤恨与关怀"
 USA.560.d:0 "我们必须决定如何处置那些与联邦政府作战的叛国者。宽恕那些反对政府的暴徒，尝试教育他们重返社会，还是要求他们为自己的反叛行为付出代价呢？"
 USA.560.a:0 "人心不是靠武力征服的"
 USA.560.b:0 "他们杀害了我家人！"
 USA.561.t:0 "麦克阿瑟向国会告别"
 USA.561.d:0 "麦克阿瑟将军宣布美国已不再受到激进派的威胁，并表示他和他的同僚们将退出政界，战时体制行将终结。国会为他无私的行为致以热烈的掌声并且称他为“美利坚的辛辛纳图斯”，因他保卫了美国并打败了所有企图摧毁美国民主制度的极端分子。他正考虑接受六星上将军衔，先前只有国父华盛顿曾被授予此荣誉。"
 USA.561.a:0 "美国得救了！"
 USA.562.t:0 "暴君的最终下场"
 USA.562.d:0 "随着内战结束，曾经以“紧急状态”为名统治美国的道格拉斯·麦克阿瑟终于沦为阶下囚。昔日那个向整个共和国发号施令的五星上将，如今只能站在法庭前，等待那个曾被他践踏的宪法作出最终裁决。大量证据被整理出来，诸如未经国会授权中止宪政秩序，架空民选政府，大规模逮捕反对派，压制新闻自由，并以武力镇压反抗势力等罪名也被确认。更重要的是，他将本可通过政治手段解决的危机一步步推向全面内战，使无数美国人死于战火，也让国家蒙受了前所未有的创伤。如今这位僭主又准备彻底颠覆民主制度，将美国的民主彻底的推入深渊。单独的叛国罪已经难以阐述麦克阿瑟的罪孽。\n\n然而，如何处置这位昔日的“救国将军”，却令新政府陷入争论。支持公开审判的人认为，共和国必须向全国证明，即使是最显赫的将军，也绝不能凌驾于法律之上。一场公开、公正的审判不仅是对麦克阿瑟个人的裁决，更是民主制度重新确立权威的象征。另一部分人则担忧，麦克阿瑟仍拥有不少忠诚追随者。公开审判或许会给他最后一次鼓动支持者的机会，使其成为军国主义残余势力的精神旗帜。他们主张将其秘密终身关押，让这个危险的名字随着时间逐渐被世人遗忘。诚然，复仇能够带来一时的快意，但共和国究竟应当以法律审判暴君，还是以沉默埋葬他的时代？恰当地处理这位同时作为美国的救世主和罪人的头衔的将军将成为如今的头等大事。"
 USA.562.a:0 "公正的审判他"
 USA.562.b:0 "将他秘密终身关押算了"
 USA.563.t:0 "世纪大审判"
 USA.563.d:0 "“所有在光荣的美国最高法院有诉求的人们，请保持肃静，认真聆听，最高法院现在开庭！”在美国现代史上最令人期待的审判即将开始之际，这句神圣的话在整个法庭回荡。自从对林肯总统暗杀阴谋者的审判和萨科-凡泽蒂的审判失败以来，全国还从未如此狂热地期盼一项公正的裁决。然而，今天的被告不仅是刺客或政治激进分子，而是对其评论褒贬不一的前将军道格拉斯·麦克阿瑟。麦克阿瑟曾经是美国军队的领袖人物，即是带领美国走出内战深渊的英雄，也是意图颠覆民主制度的邪恶暴君。现在这位争议人物傲慢地站在法官面前，被剥夺了所有的绶带和军衔，听凭美国人民的摆布，听凭他们所认为的正义的意志。这位倒下的巨人被指控在政变中背叛了民选的美利坚合众国政府，同时在内战结束后意图延续专制统治。就在他等待着可能非常艰难的审判开始的时候，整个国家都在屏息等待着本世纪的新审判的开始。美国在这个问题上产生了大量的分歧，这个国家又一次如此分裂，实际上有一半的美国人将麦克阿瑟视为美国精神的英雄和救世主，而另一方则认为他是一个渴望权力的恶棍，一心要绝对控制美国。这场重大审判的结果目前尚不清楚，但有一件事是所有人都同意的，那就是这肯定是一场漫长而痛苦的审判：这是美国在真正痊愈之前必须经历的痛苦。"
 USA.563.a:0 "上帝保佑美国和这光荣的法庭。"
 USA.564.t:0 "履行正义？"   
 USA.564.d:0 "经过数天的艰苦辩论和冗长的言辞，神圣而受尊敬的最高法院大法官们终于准备宣布他们的判决。前将军道格拉斯·麦克阿瑟已经被国家最高法院公正而充分地审判了。现在美国人民都在等待，等待关于这一历史性判决的任何消息。从迈阿密到西雅图，从圣地亚哥到班戈，这个国家的每一处角落都在议论此案及其可能的结果，而且一直存在着分歧。在全国人民的注视下和等待中，首席大法官准备最终颁布裁决。该国的许多重要人物，从前总统到海军上将莱希本人，都正在密切关注这起案件和判决。无论法官们的最终决定是什么，可以肯定的是，这个国家将被卷入一片骚动，不管老将军的支持者和反对者都在急切地等待着最终的结果。"
 USA.564.a:0 "最高法院裁定道格拉斯·麦克阿瑟无罪！"
 USA.564.b:0 "最高法院裁定道格拉斯·麦克阿瑟有罪：他应被判终身监禁！"
 USA.564.c:0 "最高法院裁定道格拉斯·麦克阿瑟有罪，并判处他死刑！"
 USA.565.t:0 "反三K党法案"
 USA.565.d:0 "在1865年美国内战结束之后，总统和国会一直在颁布法律来阻止三K党和他们的恐怖行为。而在威尔逊总统和帕尔默副总统的任期内，三K党又再一次的重生，还加入了威廉·默里这个暴君的队伍里。现在他们的叛逆行为将使得他们将不会在美国有任何形式的容身之处。当然，有些人认为，我们应寻求与前三K党成员达成和解，重点打击那些现在还在积极谋划对抗国家的人。"
 USA.565.a:0 "三K党徒的末日！"
 USA.566.t:0 "平权修正案"
 USA.566.d:0 "该修正案是在20世纪20年代初通过第十八项修正案后提出的，该修正案允许妇女享有选举权。修正案将作为第19个修正案跟进，进一步保护美国各地妇女的权利。\n修正案内容如下：\n第一节：联邦政府和各州政府不得以性别为由拒绝或限制法律规定的平等权利。\n第二节：国会有权通过适当立法强制执行本条的规定。\n第三节：本修正案自批准之日起两年后生效。\n根据美国宪法，它必须得到两个州的立法机构的批准：四分之三的州的立法机构或四分之三的州批准公约。修正案会被通过吗？"
 USA.566.a:0 "修正案通过"
 USA.566.b:0 "修正案没有获得足够的有效票数"
 USA.567.t:0 "排华法案"
 USA.567.d:0 "在十九世纪时，中国移民在美国备受歧视，他们不能获得真的公民权，也不被认为是美国的新移民，而《排华法案》则是在法律上确认了这一点。国会现在正在讨论是否应该废除该法案，或者继续保留该法律。"
 USA.567.a:0 "废除该法案"
 USA.567.b:0 "法案保留"
 USA.568.t:0 "麦克阿瑟将军的授勋仪式"
 USA.568.d:0 "第二次美国内战终于落下帷幕，共和国再一次从分裂与战火之中获得新生。面对遍布全国的工团主义武装、激进民兵与地方叛军，道格拉斯·麦克阿瑟将军临危受命，统一全国军队，以卓越的军事才能与坚定的意志带领联邦取得了最终胜利，挽救了这个险些四分五裂的国家。然而，比起战场上的胜利，更令后世称颂的是他的选择。当最后一支叛军放下武器之后，麦克阿瑟并未让军队继续掌握国家，而是遵守自己最初的承诺，将权力交还民选政府，使共和国重新回到宪法与民主制度的轨道。许多议员认为，正是这种在胜利之后主动放弃权力的克制，使他与历史上无数沉迷权力的将领截然不同。\n\n今日，在国会山举行的隆重典礼上，两院一致通过决议，授予麦克阿瑟美国历史上最高军事荣誉——六星上将军衔，使其与大陆军总司令、国父乔治·华盛顿并列，成为共和国历史上仅有的两位六星上将。雷鸣般的掌声响彻整个会场，当麦克阿瑟缓缓举手敬礼时，无数美国人共同见证了这一注定载入史册的时刻。"
 USA.568.a:0 "向将军致敬！"
 USA.569.t:0 "审判麦克阿瑟的走狗"
 USA.569.d:0 "是时候决定最忠诚于麦克阿瑟的将军们的命运了。那些在麦克阿瑟进军华盛顿时就一直跟随着他的军官们需要为他们的行为负责。他们维持着对国贼麦克阿瑟的忠诚，哪怕如今麦克阿瑟已经成为了阶下囚。很快，他们就将为自己的行为受到惩罚。问题不是他们是否应该受罚，而是我们应该如何惩罚他们。我们该怎么做？"
 USA.569.a:0 "逮捕这些叛徒！"
 USA.569.b:0 "开除他们的军籍"
 USA.569.c:0 "斥责他们"
 USA.570.t:0 "铲除杰利蝾螈？"
 USA.570.d:0 "随着民主制度在内战废墟之上重新运转，各州选区边界中长期存在的种种怪象也再次进入公众视野。为了保证本党候选人稳操胜券，州议会往往将城市、乡村与郊区任意切割，再把彼此毫无联系的社区拼凑成形状怪异的选区。报纸讥讽这些地图上的怪物是四处爬行的“杰利蝾螈”，而它们已经在美国政治中存活了一个多世纪。\n\n改革派议员提出建立独立的选区划分委员会，以人口、地理连续性与地方共同利益为标准重新绘制国会选区。他们认为，选民理应选择自己的代表，而不应由政客预先挑选最有利的选民。经历军政府、内战与政治极端主义之后，若共和国仍允许政党借几道墨水线操纵选举，那么所谓民主重建便不过是一句空话。\n\n然而，这场改革很快触及了执政党自身的利益。几名党内领袖私下提醒总统，我们在若干关键州同样依靠精心设计的选区维持多数；若立即实施完全中立的划分标准，不仅可能失去数十个国会席位，还可能让反对派利用我们的原则反过来夺取政权。铲除杰利蝾螈固然大快人心，但一些人显然希望先保住自家后院里的那几只。"
 USA.570.a:0 "一定要铲除"
 USA.570.b:0 "对我们自己的选区适当网开一面"
 USA.571.t:0 "《美利坚的恺撒》"
 USA.571.d:0 "麦克阿瑟总统日前出版自传，详细描绘了自己在1937年危机期间所扮演的角色。麦克阿瑟在书中讲解了自己如何巧妙地识破休伊·朗与比尔·海伍德的竞选诡计，并志愿为保卫民主付出任何牺牲。他在华盛顿渡过的动乱年代也是本书着墨的重点，将叙述对象放在遭受激进主义民兵不断侵扰的中产阶级受害者身上，并提及自己的核心圈子周围，曾有士兵鼓动他向华盛顿进军，彻底解决“卡皮托林的纷争”（译注：罗马元老院所在地）。尽管文中并未指名道姓，麦克阿瑟对此评价道，正是自己坚定的毅力，劝阻了士兵们实施更为叛逆计划的打算。"
 USA.571.a:0 "民主的救世主"
 USA.572.t:0 "收归联邦？"
 USA.572.d:0 "自美利坚的宪法被确立的一刻起，各州独立于联邦的自主权力就也随着联邦体制的确立被收到来自每个美国忠诚的爱国公民们的尊重。然而，正是这种对各州的放任与宽松传统，间接导致了今后美利坚历史上的一次次分裂闹剧，而其中对美国伤害最大，影响最广的自然非第一次第二次内战莫属。遥望一个世纪前，正是南方诸州不受联邦掌控的灵活地位导致了美国的第一次分裂。而也正是该传统的延续，导致了在第二次内战前夕联邦政府对各地的分裂者与激进分子束手无策，而最终导致了再度内战的悲剧诞生。如今，战火初平，但对再一次的分裂与战火美利坚已无法承受，而如今我们必须从病原彻底的根除一切分裂的可能，首当其冲的就是各州的独立司法权。例如，凭借着独立司法的优势，诸如深南地区的极度保守州为极端民主主义者与宗教狂人们提供了周密的庇护，而在民权领域做出的改革与进步则被一股脑地被这些老保们拒之门外。现在我们必须结束各州的高度独立的自治地位，至少应当对这种“高贵”的自治司法做出必要的削弱。"
 USA.572.a:0 "今时非往日，各州不能再继续自行其是"
 USA.572.b:0 "我们必须尊重光荣的美利坚传统"
 USA.573.t:0 "向朗派伸出援手"
 USA.573.d.progs:0 "休伊·朗和他的美利坚至上党可能输掉了战争，但他们剩余的影响力不应被低估。在战前，朗派中就有着大量的进步主义者，而当时我们在激进党派中相对能够和平交涉的对象也只有至上党。现在我们掌权了，我们应该开始与那些前至上党领导人进行正式谈判，寻求一个新的开始。无论他们去向何处，他们的支持者都将追随他们。然而，几乎可以肯定的是，他们将要求我党作出让步，特别是在实施更严厉的遗产税，并限制个人年收入，以及政府采购多余农产品的方面上。我们已经在新奥尔良安排了一次会议，小罗伯特·马里恩·拉福莱特和厄尔·肯普·朗将在那里会见前党领导人乔治·W·诺里斯，以讨论这一议题。"
 USA.573.d.replibs:0 "经过谨慎细致的战略会谈，[USA.GETLeader]总统和其他共和党领导人决定以建立联盟为目标，与前朗派的领导人接触。在最近的选举中，许多朗的死忠投了我们党的票，因此得到他们领导人的支持，对我们没有任何坏处可言。尽管朗和他的许多支持者曾经是民主党人，但他们对民主党的喜爱已经消失，我们相信，只要条件合适，他们是可以被争取过来的。也有很多曾经是进步共和党人的人，看到共和党回归了进步价值观，他们将会非常愿意重新加入共和党。不过在任何情况下，他们肯定会对与各主要政党合作持谨慎态度，并在双方达成任何协议之前要求对方做出让步。这可能会以使我们采取一个打折扣的“分享财富”计划。我们已经在新奥尔良安排了一次会议，被进步自由主义者，同时也是党内大佬的阿尔夫·兰登将与小罗伯特·拉福莱特和厄尔·肯普·朗会面，以达成协议。"
 USA.573.d.demlibs:0 "经过仔细的考虑，[USA.GETLeader]总统和其他民主党领导人决定与前朗派的领导人接触，并希望建立联合政府。朗的支持者在我们最近的胜选中发挥了关键的作用，让他们的领导人加入我们只会增加他们的支持者对我们的支持。至上党的许多领导人自己也曾经是民主党人，而这些人比他们在北方的共和党对手更容易获得民众支持。无论如何，如果我们不做出一些让步，尤其是在他们的“分享财富”计划方面做出让步，我们是不会给他们留下好印象的。具体来说，我们认为他们将要求为老年人提供养老金，以及免费教育，并增加财产税，以实现他们的承诺。我们已在新奥尔良安排了一次会议，爱荷华州民主党人、才华横溢的外交官哈里·霍普金斯将在那里与小罗伯特·拉福莱特和厄尔·肯普·朗会面，以讨论一项协议。"
 USA.573.a:0 "前往路易斯安那！"
 USA.574.t:0 "国家劳动关系委员会"
 USA.574.d:0 "内战结束后，国家战后重建工作正处在紧张落实阶段，眼下我们还需解决工会问题。有人认为我们应该推动自由主义与反工团主义工会运转，抵御工团主义对我国政治的渗透。美利坚劳工联合会与劳工骑士团的部分亲联邦人士愿意在相关领域同国会开展合作，共同成立国家劳动关系委员会，限制世界产业工人联盟及其附属组织在美国的影响力。此外，不希望把我们绞死的工会还希望得到“集体谈判权”。尽管如此，不少议员还是将任何形式的工会运动视作“叛乱组织”，那么国会的决定是……？"
 USA.574.a:0 "允许美利坚劳工联合会和劳工骑士团加入国家劳动关系委员会"
 USA.574.b:0 "无论忠诚与否，取缔全部工会"
 USA.575.t:0 "联邦军队在废除种族隔离上进展迟缓"
 USA.575.d:0 "尽管总统签署法令要求废除联邦军队内的种族隔离制度，目前的实行情况表明，军方还需要更多时间来真正消除这种不必要的隔阂。黑人与白人独立编制的问题依然存在，许多军官也决心抗拒上级的命令。不过，随着越来越多的作战单位开始推行族裔融合政策，情况正在日益改观。当然，我再强调一次……联邦军队在废除种族隔离上进展迟缓！"
 USA.575.a:0 "废除种族隔离的斗争仍将继续"
 USA.576.t:0 "红色恐慌"
 USA.576.d:0 "麦克阿瑟掌权后，针对社会主义、无政府主义与工团主义的肃清运动迅速拉开帷幕。他们被谴责在内战中扮演主要的煽动者角色，因此，全体美国人都该明白自己应在这场斗争中所处的立场，所谓“红色恐慌”迅速蔓延到社会的角角落落，许多人正被迫面临失业，甚至列入政治黑名单。"
 USA.576.a:0 "宁死不红"
 USA.577.t:0 "薰衣草恐慌"
 USA.577.d:0 "“红色恐慌”爆发后，总统正式发布第10450号行政命令，将威胁国家安全的定义延伸到“犯罪、不名誉、失信、不道德及其他不体面行为，例如，过度麻醉剂依赖、毒瘾与性反常。”——新法案的颁布导致近五千名被指控犯有“同性恋”罪行的联邦雇员遭到解雇。尽管少数小报谴责我们宣扬“伪善”，大多数媒体都对这些措施持赞成立场。此外，联邦调查局局长约翰·埃德加·胡佛不幸沦为这场风波的受害者，传说他与自己的秘书克莱德·托尔森关系密切。尽管作为我国最重要的情报机构负责人，胡佛本人不受调查威胁；即便我们真的下手调查，他能抖出关于我们的爆料恐怕也更多一些。"
 USA.577.a:0 "我们还是别调查胡佛先生吧"
#民主选举
USA.600.t:0 "[GetYear]年进步党初选"
 USA.600.desc.nopresidency.civilwar:0 "进步党将再次举行初选，候选人将在前农业部长亨利·华莱士、众议员兼前副总统候选人昆汀·罗斯福，俄勒冈州参议员查尔斯·L·麦克纳里与爱荷华州参议员威廉·博拉之间出现。"
 USA.600.desc.nopresidency:0 "进步党将再次举行初选，候选人将在前农业部长亨利·华莱士、威斯康星州州长菲利普·拉福莱特、众议员兼前副总统候选人昆汀·罗斯福，俄勒冈州参议员查尔斯·L·麦克纳里与爱荷华州参议员威廉·博拉之间出现。"
 USA.600.desc.presidency:0 "进步党将再次举行初选，在危难时刻带领我们走出困境的[USA.GetLeader]，毫无悬念成为核心人选。"
 USA.600.d.Leahy:0 "尽管内战严重削弱了进步派的实力，但他们依然坚如磐石，决心在[USA.GetLeader]同意卸任后角逐总统之位。该党的主要候选人包括：亨利·华莱士，他期盼这次选举能迎来比以往更好的结果；以及昆汀·罗斯福，这位进步主义者渴望继承父亲的衣钵。此外，还有来自俄勒冈州的查尔斯·麦克纳里，身为一位忠诚的进步派议员，他在参议院默默耕耘多年。虽然胜算不大，但他或许能成为两大候选人之间的折衷人选。究竟谁将引领我们的政党前行？"
 USA.600.a:0 "祝贺你，华莱士先生！"
 USA.600.b:0 "提名菲利普·拉福莱特"
 USA.600.c:0 "祝愿你赢得第这次选举，总统先生"
 USA.600.e:0 "提名查尔斯·麦克纳里"
 USA.600.f:0 "提名昆汀·罗斯福"
 USA.600.g:0 "威廉·博拉获得提名"
 USA.601.t:0 "[GetYear]年共和党初选"
 USA.601.d.presidency.Landon:0 "阿尔夫·兰登总统的英勇领导使我们国家成功渡过一段艰险的岁月。今年，他已被重新提名为共和党总统候选人。"
 USA.601.d.presidency.Curtis:0 "在查尔斯·柯蒂斯总统的英勇领导下，我们的伟大国家成功渡过一段艰险的岁月。然而由于身体原因，总统本人在1936年时就考虑过推出大选，而过去四年的幸苦工作更加使他的健康状况雪上加上。今年年初的采访中，总统已经向外界表示自己无意追求连任。由于总统在应对1937年政治危机时做出的英明决策与政绩，今年共和党赢得大选的几率并不算小，因此共和党内部则开始进一步的竞选活动以争夺总统提名。共和党自由派提名了托马斯·杜威与约翰·布里克，而保守派则推举亚瑟·范登堡和罗伯特·塔夫脱进行角逐。"
 USA.601.d.nopresidency:0 "[GetYear]年共和党初选即将进行。亚瑟·范登堡和罗伯特·塔夫脱获党内右翼提名，而托马斯·杜威与约翰·布里克则是党内左翼候选人。"
 USA.601.d.hoover:0 "考虑到赫伯特·胡佛在上次选举中的胜利与其竞选意图，共和党将毫无悬念的再次提名他为史无前例的第四任期总统。"
 USA.601.d.hoover_steps_down:0 "不出所料，赫伯特·胡佛决定不再谋求第四任期，因此选择辞职，并让其他广受欢迎的共和党人成为该党的总统候选人。亚瑟·范登堡和罗伯特·塔夫脱被提名为该党右翼候选人，而托马斯·杜威与约翰·布里克则是左翼候选人。"
 USA.601.d.hoover_left:0 "不出所料，赫伯特·胡佛决定不再谋求第四任期，因此选择辞职，并让其他广受欢迎的共和党人成为该党的总统候选人。托马斯·杜威与约翰·布里克是党内的热门左翼候选人，两人的支持者积极的在各地组织竞选活动，最终党内决定了最终的总统提名："
 USA.601.d.hoover_right:0 "不出所料，赫伯特·胡佛决定不再谋求第四任期，因此选择辞职，并让其他广受欢迎的共和党人成为该党的总统候选人。亚瑟·范登堡和罗伯特·塔夫脱是党内的热门右翼候选人，两人的支持者积极的在各地组织竞选活动，最终党内决定了最终的总统提名："
 USA.601.d.Leahy:0 "在经历多年胡佛任期带来的动荡后，共和党已进入一个重整旗鼓的阶段。如今，随着[USA.GetLeader]同意下台，党内领导层正努力重塑政党形象。罗伯特·塔夫脱正积极争取今年总统候选人提名，而与他角逐的是两位备受尊敬且拥有广泛影响力的政治人物，即约翰·布里克和亚瑟·范登堡。尽管他们在具体政策上与胡佛存在差异，但三人均表现出对胡佛核心理念的坚定坚持。不过，唯有赢得总统大选，他们才能真正推行所倡导的自由放任政策，而这一目标能否实现，尚未可知。尽管如此，共和党人依然希望，他们能成为重新凝聚美国力量的政党。那么，究竟由谁来引领我们前行？"
 USA.601.a:0 "提名罗伯特·塔夫脱"
 USA.601.b:0 "祝愿你赢得第这次选举，总统先生"
 USA.601.c:0 "提名约翰·布里克"
 USA.601.e:0 "提名托马斯·杜威"
 USA.601.f:0 "胡佛先生，一切安好"
 USA.601.g:0 "提名亚瑟·范登堡"
 USA.602.t:0 "[GetYear]年民主党初选"
 USA.602.d.president:0 "[USA.GetLeader]成功维持住了国家的稳定，因此被一致提名为民主党的总统候选人。"
 USA.602.d.avoid_civil_war:0 "在过去的四年中，民主党的规模由于吸纳了来自四分五裂的旧民主党的成员而进一步扩大，其党内结构也不断变化。如今的民主党可大致分为三派，自由派民主党人中呼声最高的是前纽约州州长阿尔·史密斯，温和派温德尔·威尔基与在党内人望最广的阿尔本·巴克利，而保守派中斯科特·W·卢卡斯与野心勃勃的本杰明·哈皮·钱德勒则受到了广泛支持。此外，曾经的旧民主党人与南方保守民主党人则对前弗吉尼亚州州长，现任参议员哈里·伯德与保守主义者小理查德·罗素表示自己的支持。终于，党内达成了一致..."
 USA.602.d.civil_war:0 "在内战中，民主党的人员流失相对严重，但好在其政党结构并未受到重创。在新一轮的党内初选中，自由派民主党人中呼声最高的是前纽约州州长阿尔·史密斯，温和派温德尔·威尔基与在党内人望最广的阿尔本·巴克利，而保守派中斯科特·W·卢卡斯与野心勃勃的本杰明·哈皮·钱德勒则受到了广泛支持。终于，党内达成了一致..."
 USA.602.d.Leahy:0 "加纳的民主党已不再是过往的模样。由于默里及其旧民主党掀起的浪潮，加上加纳自身在1936年的失利以及随后爆发的内战，该党如今已是内外交困。目前有数位人选预计将角逐党的领导权。代表民主党保守派的哈皮·钱德勒正与思想更为开明的阿尔本·W·巴克利展开激烈竞争。两人之间的对立无疑会在初选中激起火花，但候选人不止于此。尽管温德尔·威尔基在大多数议题上倾向于巴克利，他却选择置身于这场纷争之外，着力塑造自己作为民主党内年轻有为、充满希望的形象——一位能够带领政党走向更成功未来的领袖。胜负尚未可知。究竟谁能赢得我党的提名呢？"
 USA.602.a:0 "提名阿尔·史密斯"
 USA.602.b:0 "再度提名仙人掌杰克！"
 USA.602.c:0 "提名哈里·伯德"
 USA.602.e:0 "提名阿尔本·巴克利"
 USA.602.f:0 "提名温德尔·威尔基"
 USA.602.g:0 "提名本杰明·哈皮·钱德勒"
 USA.602.h:0 "提名斯科特·W·卢卡斯"
 USA.602.i:0 "提名小理查德·罗素"
 USA.603.t:0 "[GetYear]年总统大选"
 USA.603.d.civil_war_happened:0 "[GetYear]年总统选举已经开始。本次选举远不及上届那般剑拔弩张，国家面临意识形态裂痕的阴云也已消散。投票结果刚刚出炉，赢得白宫与国会大量席位的是……"
 USA.603.d.no_civil_war:0 "[GetYear]年总统选举终于拉开帷幕。值得庆幸的是，这场选举远没有上次那么富有争议，也不存在因意识形态分歧导致国家分裂的隐忧。因此，曾经引领美国渡过危机的“国家联合党”已宣告解散。投票结果刚刚出炉，赢得白宫与国会大量席位的是……"
 USA.603.a:0 "进步党"
 USA.603.b:0 "共和党"
 USA.603.c:0 "民主党"
 USA.603.e:0 "平民党"
 USA.603.f:0 "国家人民党"
 USA.604.t:0 "迈向真正透明的政府？"
 USA.604.d:0 "当乔治·诺里斯以清廉政治和公开政府的承诺入主白宫时，许多人都相信，那个由党魁、游说集团与密室交易支配华盛顿的时代终于接近尾声。新政府已经公布了一批联邦合同，要求各部门公开主要开支，并限制官员在离职后立即受雇于曾经监管的企业。几项看似平淡的行政改革，也确实让记者和普通公民第一次得以窥见政府机器内部的运作。然而，真正的透明远比竞选演说中的口号复杂。国务院坚持认为，外交谈判若完全公开，任何妥协都会在达成之前被舆论扼杀；军方则拒绝披露涉及国防生产、部队调动与情报工作的文件。甚至在国内重建领域，各部门也警告说，过度繁琐的公开程序会拖延合同审批，使地方工程陷入无休止的听证与诉讼。若所有备忘录都必须面对公众，官员们或许只会停止书写真正坦率的意见。\n\n更棘手的是，国会中不少支持公开政府的议员，只愿意公开行政部门的档案，却不愿暴露自己与捐助者、企业代表和地方党组织之间的往来。总统的顾问因此建议，政府不妨宣告现有改革已经兑现承诺，避免为了一个永远无法彻底实现的理想消耗更多政治资本。但诺里斯清楚，他曾经抨击的正是这种以现实困难为借口、在半途宣布胜利的政治习惯。\n\n如今，摆在总统面前的是一项更具雄心的法案：扩大公众查阅政府文件的权利，公开国会议员与高级官员的利益关系，并设立独立机构审查联邦合同。它不会消灭秘密，也无法终结腐败，却会迫使华盛顿接受比以往任何时候都更明亮的阳光。问题只在于，政府是否愿意承受光线照进来后所揭露的一切。"
 USA.604.a:0 "我不能违背我们的竞选承诺"
 USA.604.b:0 "现在的努力成果就够了"
 USA.605.t:0 "进步与自由"
 USA.605.d:0 "在重建后的美国，进步主义再次面临一个古老的质问：一个试图改善人民生活的政府，究竟可以走多远而不损害人民的自由？要求联邦政府整顿铁路、公共事业和大型企业的人，往往也要求它保障言论、结社与地方自治；然而，每一项新的监管制度都会增加官员手中的权力，每一个为了公共利益设立的机构，也都有可能在未来成为干涉私人生活的工具。诺里斯并不认为进步与自由天然冲突。在他看来，任由垄断企业控制电力、交通和粮食市场，并不是真正的自由；一个农民若只能接受唯一铁路公司开出的运价，一个家庭若因贫困而无法让孩子上学，他们在法律上拥有再多权利，也很难称得上自由。政府的职责不是替公民作出所有决定，而是拆除那些使普通人根本无从选择的经济壁垒。但总统同样拒绝把改革当作无限扩张国家权力的借口。他要求新的公共机构接受国会与法院监督，保障工人自愿加入或退出组织的权利，并明确禁止行政部门以政治立场为由剥夺公民的工作、财产和言论自由。进步主义若不能约束自己，最终也可能成为另一种特权；自由若只保护强者不受干预，也不过是让旧有权力继续存在的漂亮说辞。"
 USA.605.a:0 "为了更加美好的美国"
 USA.606.t:0 "公平施政的梦想"
 USA.606.d:0 "在白宫书房的壁炉前，总统再次翻阅起西奥多·罗斯福时代留下的演讲与政策文件。半个世纪以前，老罗斯福曾以“公平施政”为号召，主张政府既不能沦为资本巨头的仆从，也不应任由社会矛盾将国家撕裂。国家必须在劳工、企业与公众之间主持公道，让每一名诚实劳动的美国人都能获得公平竞争、合理报酬与有尊严生活的机会。如今，美国所面对的问题与那个时代既有不同，又惊人地相似。无数失业者等待一份糊口的工作，垄断企业则试图借重建之机攫取市场与公共资源。与此同时，工人要求更安全的工作环境，农民呼吁摆脱债务与铁路财团的控制，普通家庭则期盼政府能够提供住房、医疗与教育方面的保障。若华盛顿只是恢复旧日制度，却不去解决令旧秩序崩溃的根源，那么和平也只能是下一场危机前短暂的喘息。很快，政府将约束垄断、保障集体谈判、强化消费者保护，并让重建计划服务于广大公众，而非少数投机者。这并非照搬过去，也不是向任何激进学说让步，而是延续美国自身源远流长的改革传统。公平施政的梦想从未消失；如今，它将成为共和国再度复兴的现实纲领。"
 USA.606.a:0 "进步传统源远流长"
 USA.607.t:0 "新大陆之外"
 USA.607.d:0 "来自大西洋彼岸的消息一封接一封地送到白宫。战争、革命与封锁已经使欧洲部分地区开始陷入物资短缺，港口挤满了无家可归者，医院则缺少药品、绷带和能够维持发电的燃料。各类教会组织、红十字会分支与海外侨民团体纷纷请求政府开放仓库、提供运输，并允许美国志愿机构向交战地区运送粮食和医疗用品。\n\n政府内部对此产生了明显分歧。一部分官员认为，美国刚刚开始从萧条中走出，国内仍有无数需要资源的项目，把稀缺资源送往海外既不公平，也可能使共和国被一步步拖入外国冲突。另一部分人则指出，保持中立并不等于对苦难视而不见。美国可以坚持不派遣军队、不承担军事同盟义务，同时向所有愿意接受中立监督的地区提供食品、药品与难民救助。为避免援助成为战争工具，物资可以交由独立机构分配，政府也应明确拒绝运送武器或军需品。这不会结束战争，却能让美国的力量不只通过舰炮和军队被世界认识。"
 USA.607.a:0 "我们支持对战争的人道主义关怀"
 USA.607.b:0 "他们的事务都由他们自己处理"
 USA.608.t:0 "社会党人士引起争议"
 USA.608.d:0 "尽管美利坚社会党早已分崩离析，但不少曾经活跃于党内的温和人士并没有退出政治舞台。随着政府不断推动工会改革、扩大社会保障以及加强联邦监管，一些曾经的社会党知识分子、工运领袖乃至地方政客开始公开表示，他们愿意支持华莱士总统领导下的进步主义改革，并希望借此机会重新参与国家建设。\n\n然而，共和党保守派与民主党南方集团立即抓住了这一点。他们不断在报纸上指责白宫正在让"披着进步主义外衣的社会主义者"进入政府部门，并试图将政府描绘成社会党的继承者。即便不少加入改革阵营的人早已放弃革命主张，仅仅支持工人权益与社会福利改革，但反对派显然并不愿意区分两者。总统的顾问们对此也意见不一。一部分人认为，只要他们愿意接受宪法、支持民主制度，那么过去的政治身份并不重要，共和国应当给予所有忠于国家的人重新开始的机会；另一部分人则担心，继续与这些人物保持联系只会给反对派提供源源不断的政治弹药，让本就艰难推进的改革遭遇更大的阻力。"
 USA.608.a:0 "只要支持我们的进步主义事业就行"
 USA.608.b:0 "好吧，跟他们划清界限"
 USA.609.t:0 "华莱士的良种玉米"
 USA.609.d:0 "亨利·华莱士，曾在大学期间师从农学专家乔治·华盛顿·卡弗，毕业后靠相关知识成功致富。他所创立的杂交作物生产商——先锋良种公司，也很快成为自己在政治上的敲门砖。华莱士在总统任期内承担起良种作物推广的责任，并指示农业部门向耕作者传播相关知识，彰显这些作物在保水性方面的显著优势。俄克拉何马州农业危机正在成为政府急需解决的要务，突如其来的沙尘暴不幸夺走数百万人赖以生存的食品资源。华莱士希望亲手攻关这道难题，为美国食品供应体系保驾护航。"
 USA.609.a:0 "我们需要食物"
 USA.610.t:0 "农业部的扩张"
 USA.610.d:0 "内战结束后，美国农业部迎来了前所未有的发展机会。从农业贷款、农村电气化、土壤保护，到粮食收购、农业科研和农村医疗，越来越多原本由地方政府负责的事务开始交由华盛顿统一协调。部长们认为，只有联邦政府具备足够的财政能力和组织能力，才能真正帮助长期被忽视的美国乡村重新恢复活力。\n\n然而，农业部不断扩张的职权也引起了不少议员的担忧。一些保守派认为，这个部门已经从单纯管理农业事务，逐渐演变为一个拥有庞大预算和行政权力的超级机构；甚至连部分支持改革的自由派人士也开始担心，任何一个政府部门若无限制地膨胀，最终都可能偏离最初的目标。总统办公室很快收到了两份截然不同的备忘录。一份主张继续扩大农业部权限，使其成为农村重建的核心；另一份则建议适当控制其规模，将部分权力重新交还各州与地方政府。"
 USA.610.a:0 "这是好的变化"
 USA.610.b:0 "一个部门过度扩张毕竟不是好事"
 USA.611.t:0 "南方保守主义者强烈反对新农业法案"
 USA.611.d:0 "随着新版农业法案送交国会审议，来自南方各州的保守派议员几乎立刻组成统一战线。他们公开谴责联邦政府正在利用农业补贴、土地规划和农村信贷干涉州权，并警告华盛顿正在一步步摧毁南方延续数代人的农业传统。然而，真正令他们感到不安的远不止这些。新法案要求联邦资金必须公平惠及所有合法农户，并限制地方政府利用补贴与贷款歧视特定群体。这意味着过去长期由地方政治机器掌控的资源分配方式将受到联邦监督，不少依靠传统人情网络维系影响力的地方政客也将失去重要的政治资本。白宫对此并不感到意外。总统身边的一位顾问甚至笑着说道："如果那些靠旧制度获利的人开始抱怨改革，那至少说明我们确实触碰到了问题的根源。"
 USA.611.a:0 "他们反对说明我们做对了"
 USA.612.t:0 "总统的奇怪爱好"
 USA.612.d:0 "亨利·华莱士总统在公众眼中的一般印象是美国最著名的非革命左翼人士、美国最伟大的进步派之一，是人见人爱的谦逊又人道的农家小伙子，但在那些真正熟知他的人看来却又是另一番故事了。华莱士一直热衷于研究神秘论、神智学、灵性论等神秘学学科，他把工作之外的大部分时间都花在了自己的精神开化上。不过，这一半遮半掩的兴趣爱好却在他的总统任期上遭到了敌对党派人士的曝光。在一场采访上，不知为何，他与好友尼古拉斯·洛里奇一家的通信被一名用心险恶的记者曝了出来，而这个所谓的洛里奇一家是活跃于西藏和纽约的俄裔精神领袖，他们将已逝的弗拉基米尔·列宁进行了精神神化，并加之以自己的半神智学阿耆尼瑜伽思想创造出了佛教社会主义。虽然这一事情遭到了封锁掩盖，暂时避过了风波，但华莱士依旧不改其热情，还在身边聚集起了一群灵性论进步同僚，并开始在国内小规模传播自己的理念。为了防止总统的小小爱好继续被做成丑闻来损害进步党，我们是否要劝说总统放弃他的理念，或者尽可能不让外界知晓？"
 USA.612.a:0 "加大掩盖力度吧"
 USA.612.b:0 "小小兴致就随他去吧，只要他不把公私搞混了就行"
 USA.613.t:0 "乡土总统"
 USA.613.d:0 "对许多美国人而言，亨利·华莱士始终不像一位传统意义上的政治家。他更习惯谈论土壤、作物轮作与降雨周期，而不是党派算计或是政治暗算。在踏入国家政治之前，他的名字早已出现在农业期刊与实验田的记录中——一位坚信科学能够改善农民生活的实践者。\n\n而如今即便身居总统之位，华莱士总统仍保留着这种略有固执，带有着无法摆脱的乡土气息与农民风格的生活方式。他坚持在访问各州时与农民代表讨论时令的农产品价格、收成与机械化问题，也乐于向私人来访者讲述自己对杂交作物和农业实验的兴趣。尽管总统的老朋友与政治伙伴们都熟知总统的这个个人小爱好，但这种情况还是会时常弄得他们哭笑不得。在白宫的会议间隙，他会翻阅农业报告，而不是社交名录。尽管华莱士总统的政敌们对此感到不适并借题发挥攻击总统乃至其政策，但无数乡村选民却对此产生共鸣。\n\n支持者认为，这正是华莱士的独特之处：一个真正理解农村、并将国家视作一块需要长期耕耘土地的人。在一次电台谈话中，华莱士总统向公众们讲述：治国并非遵循既定轨迹的遥控，而是一种持续试验与改良的过程——正如农业科学本身那样。而批评者则质疑，这种“乡土气质”是否足以应对复杂的国家事务。然而，在经历了经济动荡与社会裂痕之后，许多美国人至少还是对这位谈论泥土与收成的总统抱持着期待与信任的积极态度。"
 USA.613.a:0 "一个农民也能当好总统"
 USA.614.t:0 "罗斯福总统雕像揭幕"
 USA.614.d:0 "在华盛顿的一处新整修的公共广场上，一座以罗斯福总统为主题的雕像正式揭幕。仪式本身并不奢华，却吸引了相当数量的退伍军人、联邦雇员与普通市民前来围观。对于许多人而言，这座雕像所纪念的不仅是一位已逝的国家领袖，更是一段相对清晰的国家记忆——那个联邦权威尚未因萧条与混乱而显得如此脆弱的年代。\n\n而对昆汀·罗斯福而言，这场揭幕仪式带有某种微妙的象征意味。作为罗斯福家族的一员，他的总统任期不可避免地被拿来与前任家族成员的政治遗产相对照。支持者希望通过这种公开纪念，将“罗斯福传统”重新嵌入当下的国家叙事之中，借此传达一种关于责任、国家团结与公共服务的连续性。也有人私下质疑，在国家财政仍需优先用于其他领域的当下，是否有必要为象征性工程投入如此多的精力。然而，负责该项目的官员给出的回应颇为直白：一个经历过分裂与动荡的国家，同样需要可被看见的共同记忆。至少在这一天，争论暂时被仪式感所覆盖，人们在雕像前短暂停留，将注意力投向一个更具连续性的过去。\n\n无论这座雕像未来在公众心中承载怎样的意义，它已经成为纽约城市景观的一部分，也成为这一届政府试图重建国家象征体系的注脚之一。"
 USA.614.a:0 "伟人！"
 USA.615.t:0 "罗斯福家族和解"
 USA.615.d:0 "富兰克林·罗斯福在当选纽约州州长前夕，不幸去世后，罗斯福家族长期处在分裂状态。当年轻的昆汀·罗斯福决定参与党派政治时，他的弟弟阿奇博尔德·罗斯福加入了罗斯福家族隶属的民主党的对手共和党，因而和家族的关系完全疏远。有传言说阿奇博尔德曾收受实业家贿赂，因此对胡佛总统以来的每位总统都持批评立场，其中也包括他的哥哥昆汀。这般闹剧已经折腾到沸沸扬扬的地步，所幸两人最近的会面正式埋葬了这段相互倾轧的历史，分裂的家庭终于破镜重圆。这次会谈也有助于证明昆汀愿意和自己的旧友，宿敌乃至于分裂的家庭成员和解，宽恕他们的背叛。他的宽宏大量显露无疑。"
 USA.615.a:0 "又一个家庭走向了团圆"
 USA.616.t:0 "炉边谈话"
 USA.616.d:0 "随着广播逐渐成为美国最重要的大众传播媒介之一，政府开始尝试以更加直接、易于理解的方式向公众解释政策走向。最近，昆汀·罗斯福总统频繁借助全国性的广播网络，向民众介绍“公平施政”政策的实施进展，以及这些措施将如何推动经济复苏、稳定就业并重建市场信心。\n\n与传统的政治演说不同，这些讲话刻意避开了繁复的术语与激烈的修辞，而是以平实的语言讨论银行、就业、公共工程与财政安排等具体问题。听众有别于过去的被官方的政府宣传或号召驱使去支持某一政治立场，而是被邀请去理解政府正在做什么、为什么要这样做，以及这些决定将在日常生活中产生何种影响。这种被称为“炉边谈话”的广播形式迅速赢得了广泛关注。它不仅成功缓解了公众对经济前景的焦虑，也在无形中改变了政府与民众之间的沟通方式。越来越多的人开始在固定时段收听这些节目，其收听率甚至超过了若干长期占据黄金时段的知名栏目。\n\n对政府而言，这种沟通方式的价值并不止于人气本身。它为经济政策的持续推进提供了稳定的舆论环境，也使复杂而漫长的复苏过程显得更加充满希望。"
 USA.616.a:0 "我的美国同胞们……"
 USA.617.t:0 "总统的空中表演"
 USA.617.d:0 "当总统车队驶入陆军航空队的机场时，大多数来宾都以为昆汀·罗斯福只是前来检阅新近服役的战斗机。停机坪上已经搭好观礼台，军乐队与摄影记者各就各位，几架擦得锃亮的飞机则整齐排列在跑道旁。然而，总统并没有径直走向讲台，而是在众人惊讶的目光中脱下外套，换上了早已准备好的飞行服。昆汀对飞机的兴趣从来不只是政治宣传。年轻时，他曾在航空学校接受训练，并在兄长们相继投身军旅后执意加入航空部队。旧日的飞行经历虽然早已被总统任期、竞选集会和无休止的文件所取代，但当他爬进驾驶舱、检查仪表并向地勤人员竖起拇指时，动作中仍带着一种久违的熟练。\n\n发动机的轰鸣很快盖过了记者们的议论。飞机沿跑道加速升空，在机场上方完成了一连串俯冲、爬升与急转。表演并不算鲁莽，却足以让随行的特勤人员脸色苍白，也让地面上的年轻飞行员爆发出阵阵欢呼。总统最后平稳降落，打开座舱盖时还带着得意的笑容，仿佛方才只是结束了一次寻常的周末飞行。\n\n白宫幕僚事后竭力淡化其中的风险，报纸却不会放过如此精彩的头条。支持者称赞总统仍保有罗斯福家族的勇气与活力，批评者则质问国家元首为何要把自己的生命交给一台高速运转的机器。至于昆汀本人，他只在记者询问时拍了拍机身，表示自己在一战时开的老家伙可比这个危险多了。"
 USA.617.a:0 "飞行技术不减当年！"
 USA.618.t:0 "总统批准格兰德库利大坝建设"
 USA.618.d:0 "哥伦比亚河从加拿大群山奔流而下，在穿过华盛顿州东部的峡谷后继续向太平洋而去。多年以来，西北各州的工程师、农场主与地方政客都在谈论一个大胆的构想：在格兰德库利横截大河，以其水力灌溉干旱的哥伦比亚高原，同时为正在成长的西北城市与工业提供廉价电力。然而，工程的惊人规模、巨额预算以及地方公私电力公司的争执，使这份蓝图始终停留在测绘图与委员会报告之中。\n\n对查尔斯·麦克纳里而言，这并不是一个来自遥远官僚机构的抽象项目。作为俄勒冈人，他比大多数华盛顿政客都更清楚西北农民所面对的困境：土地并不贫瘠，只是缺少水；城镇并不缺乏雄心，只是缺少能够支撑工厂与家庭的稳定电力。总统因此召集垦务局、陆军工程兵团与西北各州代表，要求他们搁置旷日持久的争论，并为这项工程制定一份能够真正执行的计划。\n\n当然，反对声从未消失。财政保守派将其斥为联邦政府挥霍无度的纪念碑，私人电力公司则警告廉价公共电力会扰乱市场。但麦克纳里并不认为发展西部、安置农民与利用国家水力资源是什么激进试验。在审阅完最后一批预算与设计方案后，总统终于在授权书上签下了自己的名字。格兰德库利的大门已经开启，接下来便要看工程师能否驯服这条大河了。"
 USA.618.a:0 "一切顺利！"
 USA.619.t:0 "格兰德库利大坝落成"
 USA.619.d:0 "今日清晨，成千上万名游客、工人及记者聚集在哥伦比亚河畔，等待格兰德库利大坝的正式落成。曾经横亘于华盛顿州东部的荒凉峡谷，如今已被一道庞大的混凝土壁垒截断；在闸门与涡轮机的轰鸣声中，河水第一次按照工程师所设计的路线奔涌而下，而输电线路则从大坝向地平线另一端延伸开去。\n\n这项工程的意义远不止一座宏伟建筑。新的灌溉系统将使大片干旱土地变为农田，西北部的城镇与工厂也将获得过去难以想象的廉价电力。那些曾讥讽工程是“麦克纳里的混凝土巨兽”的报纸，如今不得不承认，这头巨兽确实开始为整个地区带来光明。就连一贯反对公共电力的企业，也已派代表前来询问工业用电合同。\n\n站在观礼台上的总统并未发表冗长演说。他只是向参与建设的工人、工程师和地方居民致谢，并表示大坝不属于某个政党或某届政府，而属于所有依靠这条河流生活的美国人。当控制室内的开关被缓缓推上，远方城镇的电灯随之亮起。哥伦比亚河仍在奔流，但从今天开始，它也将为西北部的未来提供力量。"
 USA.619.a:0 "源源不断的电力！"
 USA.620.t:0 "对欧贸易繁荣"
 USA.620.d:0 "纽约、波士顿与巴尔的摩的码头近来几乎没有片刻安宁。装载谷物、机械、汽车零件与工业设备的货轮接连驶向大西洋彼岸，又带着欧洲的精密仪器、奢侈品和长期合同返回美国。内战期间一度中断的商业网络正在迅速恢复，而饱受战争与政治动荡折磨的欧洲市场，恰好需要美国能够大量提供的一切。\n\n政府将这种繁荣视为其务实经济政策的成果。白宫没有许诺通过宏大的理论重塑世界贸易，只是逐步恢复航运保险、降低部分关税，并与友好国家签订互惠协定。美国农民终于找到了新的粮食买家，东部工厂的订单堆满档案柜，铁路与港口则忙于处理源源不断的货物。即使是过去主张严格保护主义的议员，如今也很难忽视本州出口商寄来的感谢信。\n\n繁荣自然也带来了新的争论。工会担心进口商品压低工资，一些工业家要求政府继续保护国内市场，孤立主义者更不愿看到美国经济再次与欧洲纠缠在一起。然而，总统认为，贸易并不等于放弃独立；恰恰相反，一个能够将自己的粮食、机器与技术卖向世界的美国，才真正拥有影响世界的力量。至少从码头上堆积如山的货箱来看，这项政策目前运转得相当不错。"
 USA.620.a:0 "货出去，钱进来..."
 USA.621.t:0 "第二次德比莱恩会谈"
 USA.621.d:0 "德比莱恩这个名字，在美国政坛之间曾长期代表着一段不愿公开提起的往事。1936年最为混乱的时期，几位新英格兰州长曾在这里秘密越过国境，与加拿大官员讨论一旦联邦政府彻底崩溃，他们能否率领各州投向北方，并在加拿大的庇护下躲避席卷全国的战火。那次会谈没有留下正式条约，却使这座不起眼的边境小镇成为美国分裂与衰弱的隐秘见证。\n\n如今，美国代表团再次来到德比莱恩，但局势已经截然不同。出席会议的不再是为各自州份寻找退路的地方首脑，而是由麦克纳里总统授权的外交官、参谋军官与海军代表；在边境另一侧等待他们的，也不只是加拿大官员，还有英国流亡政府及协约国各成员派出的代表。\n\n会谈的议题很快超出了外交承认与贸易合作。英国流亡者希望获得美国舰队和工业的支援，为日后跨越大西洋、夺回本土做准备；加拿大方面则主张建立统一的北美防务体系，以防工团主义势力将战火带到西半球。美国参谋人员也提交了有关联合海军演习、武器标准化、情报共享与远征军部署的初步方案。至于反攻是否只应止于不列颠群岛，抑或最终将美军送上欧洲大陆，各方仍谨慎地避免作出无法兑现的承诺。\n\n然而，会议本身已经传递出足够明确的信号：美国不准备永远隔着大西洋旁观旧世界的命运。"
 USA.621.a:0 "盎格鲁撒克逊兄弟情！"
 USA.622.t:0 "推行普朗布计划"
 USA.622.d:0 "早在世界大战结束后的铁路大罢工时期，律师格伦·普朗布便提出过一套足以令铁路巨头们寝食难安的改革方案：联邦政府将发行长期债券，逐步买下全国主要铁路公司的资产，再将这些彼此割裂、相互竞争的线路整合为一个统一的公共铁路体系。新的铁路机构既不完全属于官僚，也不再由华尔街董事会独断专行，而将由政府代表、专业管理者与铁路劳工三方共同运营。\n\n普朗布及其支持者认为，铁路既是商业企业，也是整个共和国赖以运转的公共命脉。若任由私人公司只顾股息，线路维护、偏远地区运输与工人待遇便永远只能屈从于账本上的利润。按照计划，铁路运营所得的一部分将用于设备更新和线路扩建，另一部分则由国家、管理人员与劳动者共同分享，其中劳工可以获得铁路系统近半的盈余。这将使每天维护铁轨、驾驶列车和装卸货物的人第一次真正成为铁路事业的参与者，而不仅仅是可以随时被替换的雇员。\n\n反对者已经将这项计划称作披着合作主义外衣的国有化。铁路公司警告政府收购将造成财政灾难，保守派议员则担心工会会借此控制国家交通。然而，拉福莱特政府并不打算将美国铁路交给任何一个集团独占。经历内战破坏与多年投资不足之后，全国运输系统亟须统一调度、现代化改造以及一套能够调和公共利益与劳动权益的新制度。普朗布计划并不承诺消灭私人事业，却要证明公共所有、专业管理与工人民主并非不能并存。"
 USA.622.a:0 "真正属于劳工的铁路"
 USA.623.t:0 "总统为新铁路剪彩"
 USA.623.d:0 "威斯康星州今日迎来了一场远比普通铁路通车仪式更受瞩目的盛会。清晨时分，地方居民、铁路工人与来自各州的记者便已聚集在新建车站周围，等待总统为圣塔菲铁路系统新近完工的一段线路剪彩。这条线路本身或许并不算全国最长，却是普朗布计划实施后首批由公众、管理者与工人共同经营的铁路之一，因此早已被支持者视为新制度能否成功的试金石。工程并非一帆风顺。政府收购旧资产、统一技术标准并重组管理机构的成本远超最初估计，私人铁路公司也在法庭、报纸与国会走廊中进行了顽强抵抗。然而，当新式机车拖着第一列客货混合列车缓缓驶入站台时，先前那些抽象的争论似乎暂时让位于眼前的成果：沿线农场得到了更稳定的运输服务，工人代表进入了运营委员会，票价与货运费用也由公开账目而非秘密董事会决定。\n\n在剪彩仪式上，[GetLeader]将这条铁路称作“合作共和主义的钢铁证明”。更值得政府高兴的是，许多曾经同情工团主义的铁路工会，如今也开始重新评估自己的立场。若工人能够在宪法秩序下分享利润、参与管理并监督企业，那么全面革命似乎便不再是争取尊严与权利的唯一道路。第一列火车在欢呼声中鸣笛启程，而它所驶向的，不仅是下一座城市，也是美国进步主义的新阶段。"
 USA.623.a:0 "太好了！"
 USA.624.t:0 "支持杜威主义？"
 USA.624.d:0 "随着各州开始重建在内战中遭到破坏的学校体系，教育改革再次成为进步派内部争论最激烈的问题之一。哲学家约翰·杜威虽然曾与社会党保持密切联系，并公开支持过若干社会爱国主义立场，但他从未将教育视为单纯灌输政治教条的工具。在他看来，学校应当是一座微缩的民主社会，儿童不应只在座位上背诵教师给出的答案，而应当通过实验、讨论、合作与亲身实践，学会如何思考并参与公共生活。社会党瓦解之后，不少受到杜威思想影响的教师、学者与地方活动家进入了进步党。他们如今要求政府利用全国教育重建的机会，推广以儿童经验为中心的教学方法，减少机械背诵与绝对服从，并允许教师根据学生的兴趣安排更多自主学习、实验课程和集体项目。支持者相信，这种教育不仅能够培养更有创造力的劳动者，也能使下一代成为善于判断、愿意合作且不易受煽动的民主公民。\n\n然而，传统教育工作者对此深感不安。他们担心所谓“适度放手”最终会演变成课堂纪律崩溃，使学生既缺乏基础知识，也失去对权威和责任的尊重。教会学校、乡村学区与不少家长同样质疑，一套诞生于哥伦比亚大学讲堂的理论是否适合整个美国。拉福莱特本人一向相信公共教育是民主制度的根基，但这并不意味着每一种冠以进步之名的新方法都应未经检验便推广全国。如今，政府必须决定：是让学校继续沿着熟悉而稳妥的道路前行，还是给予杜威的教育实验一次真正改变美国课堂的机会。"
 USA.624.a:0 "遵从老方法"
 USA.624.b:0 "接纳杜威主义"
 USA.625.t:0 "纪念老拉福莱特"
 USA.625.d:0 "在威斯康星州的街头，人们至今仍会提起“老拉福莱特”的名字。对许多人而言，他并不只是一本教科书中的政治人物，而是一段仍然影响着现实政治的记忆。无论是关于反垄断、直接民主，还是限制既得利益对政治的操控，拉福莱特留下的遗产早已融入中西部进步主义的血脉之中。\n\n随着国家局势的变化，越来越多的支持者开始呼吁以一种更具象征意义的方式纪念这位老政治家。对他们来说，这不仅是对一位先驱者的缅怀，更是一种提醒——进步主义并非凭空出现的口号，而是由一代又一代改革者在地方政治与基层斗争中逐步积累而成。在麦迪逊，有人提议为拉福莱特竖立一座雕像，让他的身影重新回到公共空间之中；也有人建议修复他曾经发表演说的旧会场，使其成为讲述进步主义历史的纪念地。无论最终采取何种形式，这些提议都指向同一个目的：在如今改革的时代中，纪念曾经的进步主义先贤。\n\n对许多年轻的支持者而言，老拉福莱特或许早已不再是亲历其政绩的对象，但通过这些象征性的纪念，他的名字仍将继续出现在公共讨论之中，证明美利坚的进步传统源远流长。"
 USA.625.a:0 "一尊雕像最适合不过了"
 USA.625.b:0 "也许一部电影或者纪录片更好"
 USA.626.t:0 "追寻和平时代的曙光"
 USA.626.d:0 "白宫东厅今晚没有举行宴会，也没有迎接外国使节。取而代之的是一批来自教会、大学、退伍军人组织与妇女和平团体的代表。他们向总统递交了一份共同宣言，呼吁美国以黑色星期一后的重建为起点，推动各国放弃侵略战争、裁减军备，并通过公开仲裁解决彼此间的争端。宣言末尾密密麻麻的签名，似乎证明即便世界仍被仇恨撕裂，人们也没有彻底放弃和平。\n\n威廉·博拉对此并不陌生。多年来，他始终反对秘密外交、永久性军事同盟以及那些会让美国卷入旧大陆争斗的海外承诺。在他看来，世界大战并没有带来所谓永久和平，只是让胜利者获得了重新划分疆界的机会，并为下一场战争埋下种子。而世界大战更以最残酷的方式证明，一旦政治分歧交由枪炮裁决，所谓胜利最终只会留下墓地、废墟与几代人的仇恨。在博拉的任期内，美国将寻求与各主要国家签订互不侵犯及仲裁协定，并邀请各国就限制海军扩张、保护中立航运与禁止以战争解决债务争端展开谈判。总统本人并不幻想一纸条约便能让各国放下武器，但他相信，共和国至少不应因为他人的野心而主动走向深渊。"
 USA.626.a:0 "愿我们恪守和平信条"
 USA.627.t:0 "与胡佛的私人一餐"
 USA.627.d:0 "赫伯特·胡佛抵达白宫时，没有记者在入口等候，晚间日程上也只留下了一处含糊的“私人会谈”。这位前总统与博拉相识多年，却很少被视作真正的政治盟友。两人在关税、行政权力乃至共和党未来方向上存在过不少分歧，而胡佛对博拉那套近乎执拗的独立外交也始终有所保留。不过，两人都曾亲眼见证旧政坛的崩溃，也都明白国家若想从萧条中真正恢复，便不能永远依靠党派口号治理。\n\n晚餐最初仍带着几分拘谨。胡佛谈起救济机构的低效、铁路和港口恢复所需的长期投资，以及欧洲市场崩溃可能给美国农业带来的冲击。博拉则不断追问这些计划是否会让单独一个政府部门获得过大的权力，是否会使私人利益借重建之名重新控制政府。\n\n随着餐盘被撤下，两人终于找到了共同语言。胡佛同意，新机构必须受到国会审查，重大合同也应公开竞标；博拉则承认，仅靠地方自救无法修复横跨数州的基础设施，也无法让数百万失业者重新获得工作。会面结束时，双方并未宣布任何正式联盟，胡佛也没有获得内阁职位。但总统桌上多出了一份经过亲自批注的重建建议书，而胡佛离开时则答应继续为政府提供技术意见。"
 USA.627.a:0 "卓有成效"
 USA.628.t:0 "为了一个文化帝国？"
 USA.628.d:0 "随着内战阴影逐渐退去，美国的电影制片厂、广播电台、出版社与唱片公司也重新恢复活力。纽约和洛杉矶的制片人开始谈论一个前所未有的机会：欧洲文化市场因战争与革命而支离破碎，而美国拥有资金、技术、庞大的国内受众，以及足以把电影、音乐和通俗文学送往世界各地的商业网络。只要把握时机，美国或许能够建立一个不依靠军舰与驻军，而依靠银幕、广播和印刷品维系的“文化帝国”。但文化产业是否应由政府扶持，很快便成为争论焦点。制片厂老板和共和党自由派认为，真正有生命力的艺术只能来自竞争、观众选择与创作者自身的冒险精神。政府一旦开始发放补贴，便必然要决定什么值得被资助、什么符合所谓国家利益。今天受到扶持的是历史电影和交响乐，明天接受审查的或许就是讽刺政府的小说和报纸。\n\n与此同时，作家协会、地方剧团与教育界则指出，完全依赖市场只会让最有钱、最安全的作品占据一切。那些难以立即盈利，却能保存地方文化、培养新艺术家或提升公众教育的项目，往往在诞生之前便已被商业账本判了死刑。他们要求联邦政府设立独立文化基金，通过公开评审支持电影、戏剧、音乐、博物馆与公共广播，同时以法律保证政府不得干涉具体创作内容。"
 USA.628.a:0 "不受政府干涉的文化产业才能繁荣"
 USA.628.b:0 "资助文化创作才能有好的作品"
 USA.629.t:0 "对企业市场的重构"
 USA.629.d:0 "黑色星期一后的美国企业市场呈现出一种危险而矛盾的景象。一方面，大量小企业在萧条中破产，铁路、钢铁、能源和通信行业的幸存公司则趁机兼并竞争者；另一方面，政府为了迅速恢复生产，又不得不依赖这些拥有资金、设备和全国网络的大型企业。结果是经济确实重新转动起来了，但许多行业也比战前更加集中在少数董事会手中。\n\n党内改革派要求政府重新划定企业权力的边界。他们并不主张拆毁所有大公司，却认为垄断价格、秘密回扣、交叉持股和对地方政治的操控必须受到限制。新的反托拉斯法案将授权联邦机构调查市场支配行为，阻止大型企业通过兼并消灭潜在竞争者，并要求涉及公共事业的公司公开账目与定价依据。保守派和商界代表对此强烈反对。在他们看来，美国之所以能够迅速重建，正是因为企业家拥有自由调动资本、整合生产并承担风险的权利。政府官员不可能比市场更了解哪些企业应当扩张、哪些行业需要整合。若每一次成功都可能招来调查，每一次合并都要经过漫长审批，所谓反垄断最终只会惩罚效率，并让美国在国际竞争中落后。"
 USA.629.a:0 "至少应当画出一条底线"
 USA.629.b:0 "太伟大了看不见的大手"
 USA.630.t:0 "帮派分子与杜威总统擦肩而过"
 USA.630.d:0 "星期天早晨，一伙据信是“荷兰佬”舒尔茨派来，为自己即将面临的死刑复仇的歹徒，趁托马斯·杜威在华盛顿某餐厅享用早餐时，从橱窗外对他开枪。幸运的是，特勤局特工成功掩护住杜威总统，逮捕案件行凶者。这起事件提醒总统阁下，他需加倍提升安全意识，并以此为材料深化全国打击犯罪集团的力度，以免出现可能的犯罪模仿者。国会方面，民主党与共和党的议员则把J·埃德加·胡佛叫到了国会，要求其就联邦调查局未能提前预知这起事件作出解释。许多曾经对托马斯·杜威施政持观望态度的政客，现在都很高兴他们的总统成功躲过这场卑劣的谋杀。"
 USA.630.a:0 "千钧一发……"
 USA.630.b:0 "无视他们"
 USA.631.t:0 "“福星”卢西亚诺的末日"
 USA.631.d:0 "在纽约的地下世界中，查尔斯·“福星”·卢西亚诺的名字曾经象征着一种难以撼动的秩序。多年来，他通过精心编织的关系网，将走私、敲诈与地下交易整合成一套隐秘而高效的运作体系，进而彻底的宣布对纽约黑道的绝对统治。同时他的灵活手腕与野心也使警方与地方检察机关屡屡无功而返。\n\n然而，“福星”的神话最终被打破。随着联邦与地方执法机构的持续合作，一系列针对有组织犯罪的调查逐步收紧了包围圈。执法部门最终选择从这一网络中最“看似边缘”的环节入手。针对卢西亚诺名下的一个伪装的卖淫集团的大规模调查逐步展开。警方与检察官并未急于下达追捕令，而是系统性地收集账目、通讯记录与证人证词。当多名被控制的皮条客选择出庭作证后，原本难以触及的指挥链条开始显露轮廓。\n\n随着证据链逐渐成形，司法系统为卢西亚诺织就的大网即将收紧。法庭上，卢西亚诺惯用的“保持距离”策略第一次失效。陪审团最终作出裁决，这位曾经操控纽约地下秩序的人物，被判处长期监禁。\n\n对纽约市民乃至全美国的公民们而言，这并不只是又一桩高调审判。它标志着一个长期盘踞在大城市阴影中的又一个罪恶倒在如今的杜威总统手下。对总统而言，这次案件更多是一种延续——延续他作为检察官时所秉持的信念：法律的效力并不取决于对手的名声，而取决于是否愿意持续而耐心地执行。"
 USA.631.a:0 "让我们为总统献上掌声吧"
 USA.632.t:0 "《黑帮克星》的首播"
 USA.632.d:0 "今晚，全国各大城市的电影院外都排起了长队。华纳制片厂的新片《黑帮克星》终于举行首映，其故事以一名年轻检察官为主角：他拒绝接受地方警察、政党机器与犯罪集团之间早已默认的交易，转而依靠秘密调查、财务记录和法庭诉讼，将一位看似不可撼动的黑帮首领送进监狱。\n\n影片没有直接使用任何现实人物的姓名，但几乎所有观众都能看出主人公身上托马斯·杜威的影子。片中的检察官留着整齐的小胡子，说话简洁冷峻，甚至连面对记者时略显刻板的姿态都与总统极为相似。影片宣传方虽然一再声称这只是虚构作品，却又毫不掩饰地在海报上写下：“一个人，一座城市，一场对腐败的战争。”首映结束后，观众对法庭高潮段落报以长时间掌声。评论家称赞影片把复杂的财务调查拍得像枪战一样紧张，而白宫幕僚则对其中几处过分英雄化的桥段颇感尴尬。更令他们不安的是，影片末尾暗示主人公在扫清黑帮后将进入全国政坛，这几乎已经不是影射，而是一封写给现任总统的银幕情书。\n\n杜威本人在私人放映室观看了影片。据说字幕升起后，他沉默了几秒，随后要求工作人员把最精彩的法庭陈词重新播放一次。"
 USA.632.a:0 "我要再来一遍！"
 USA.633.t:0 "杜威总统的钢带之行"
 USA.633.d:0 "总统专列缓缓驶入匹兹堡时，站台两侧并没有出现白宫顾问所期待的整齐欢呼。钢厂工人、失业者和工会代表挤满街道，其中不少人手持要求提高工资、恢复集体谈判和停止政治清算的标语。对这些曾经历工团主义统治、联邦反攻和战后肃清的工业城市而言，来自华盛顿的任何承诺都很难立刻赢得信任。\n\n杜威此次钢带之行原本旨在宣传重建成果。他参观了重新开工的炼钢炉、铁路修理厂和联邦资助的工人住宅，并在当地商会面前强调法律、秩序与私人投资的重要性。然而，真正受到媒体关注的却是一场临时安排的工会会谈。几名工会代表直言，政府不能一边要求工人拒绝工团主义，一边又允许企业主恢复战前的黑名单、私人警卫和任意解雇制度。\n\n总统的顾问分成两派。一些人主张杜威公开承认合法工会在战后经济中的地位，以工资谈判、劳动仲裁和安全法规换取工人对宪政秩序的忠诚。另一些人则提醒他，任何“和解”字眼都会被保守派解读为向昨日的叛乱者低头，也会让企业界怀疑白宫是否准备放弃恢复自由市场的承诺。杜威并不喜欢街头政治，也从不相信喊得最响的人就代表多数。但他同样清楚，若政府无法为合法劳工运动留下空间，极端主义迟早还会重新找到听众。"
 USA.633.a:0 "让我们跟工团佬暂时和解吧"
 USA.633.b:0 "不对此做任何评价"
 USA.634.t:0 "《布里克修正案》的落地？"
 USA.634.d:0 "随着国际秩序的逐步崩坏，美国在对外事务中的法律地位再次成为国内政治辩论的焦点。现如今由约翰·布里克提出的宪法修正案，试图重新界定国际条约与国内法之间的关系。该提案主张，除非经国会或各州立法机构明确采纳，否则大多数国际公约不应自动具有国内法律效力。\n\n支持者认为，这一修正案有助于防止行政部门在未经充分国内审议的情况下，通过国际承诺改变国内法律结构。他们在对媒体的声称中说，此举可以强化国会与州政府在对外承诺问题上的话语权，从而维护联邦体制内部的权力平衡。而反对者则警告称，该修正案将严重削弱美国履行国际义务的能力。若每一项条约在国内的可执行性都需经过额外立法程序，美国在国际社会中的可信度将不可避免地受到影响，同时联邦政府也将在外交上处处遭到掣肘。批评者将这一设想与18世纪《邦联条例》时期的困境相提并论，当时联邦政府在对外承诺上的执行力不足，导致外交信誉屡屡受损。\n\n在激烈的辩论过程中，修正案的原始版本已被大幅修改。最具争议的条款——对正式条约自动执行力的全面限制——逐渐被弱化，取而代之的是更为模糊、留有解释空间的制度安排。问题不再只是是否通过修正案本身，而是美国究竟应当在多大程度上优先考虑国内宪政结构，而将对外承诺置于相对从属的位置。毫无疑问，修正案的命运，将不仅影响一项具体法律条文的去留，也将为美国未来数十年的对外承诺方式定下基调。"
 USA.634.a:0 "国会将驳回该法案"
 USA.634.b:0 "削弱其效力以争取通过"
 USA.635.t:0 "地铁站的惊险一幕"
 USA.635.d:0 "清晨时分，参议员约翰·布里克像往常一样从参议院办公楼乘坐地铁前往国会大厦。就在列车进站、人群涌动之际，一名男子突然从近距离向他开枪。两声枪响在封闭的站台内回荡，所幸子弹并未命中目标，现场随即陷入短暂混乱，安保人员迅速控制住局面。\n\n袭击者很快被制服，身份确认后引发了更多疑问。行凶者威廉·路易斯·凯泽，曾任国会警察，在供述中声称，自己只是想“提醒”布里克“注意安全”，并无真正取其性命之意。然而，初步调查显示，凯泽可能使用了空包弹，或是在射击时刻意偏离目标，这使案件的动机显得更加扑朔迷离。\n\n随着调查深入，凯泽的个人处境逐渐浮出水面。他近期在哥伦布市的房地产投资中损失惨重，经济困境与长期积累的不满情绪，似乎在某个时刻转化为极端行为。尽管没有证据表明此次事件与具体政治组织存在直接关联，但外界普遍认为，围绕布里克修正案的激烈争论，已经在社会层面制造出一种紧张而易燃的氛围。\n\n事件并未造成人员伤亡，却迅速成为舆论焦点。有人将其视为一次荒唐而危险的个人闹剧，也有人担忧，这或许只是政治极化外溢为现实暴力的前兆。"
 USA.635.a:0 "好险"
 USA.636.t:0 "“共和党先生”"
 USA.636.d:0 "在华盛顿乃至整个美国的政治风云中，很少有人像罗伯特·A·塔夫脱那样，几乎与其所属政党融为一体。无论是在委员会会议、预算谈判，还是在宪政争议的辩论场上，这位来自俄亥俄州的参议员总是以条理清晰、立场稳固而著称。长期以来，党内外人士都私下称他为“共和党先生”——这个绰号既是一种尊敬，也隐含着他在共和党内部难以撼动的地位。而如今，这位“共和党先生”已经成功带领共和党走到了国家的中枢。\n\n塔夫脱并非那种热衷于公开演说或塑造个人魅力的政治人物。他更习惯在立法文本与委员会修订中发挥影响力，通过一条条条款来塑造政策走向。对许多共和党基层成员而言，塔夫脱象征着一种“旧式政治家”的形象：强调财政克制、警惕行政权力扩张，同时坚持国会在国家治理中的核心地位。\n\n然而，正是这种稳固而谨慎的作风，使他在动荡年代显得格格不入。部分年轻的共和党人认为，塔夫脱过于拘泥于程序与传统，难以回应社会对更强有力领导的期待；而在党外，一些评论者则将他视为阻碍快速改革的保守象征。但在如今美利坚逐步走出阴影的年代，一位温和改革保卫现有体制的总统先生也许对于国家才是最为合适的良药，而这也是多数共和党人的共识。"
 USA.636.a:0 "一位杰出人物！"
 USA.637.t:0 "约翰·刘易斯批评总统政策"
 USA.637.d:0 "联合矿工工会主席约翰·刘易斯今日发表了一篇措辞激烈的公开演说，将塔夫脱政府的劳工政策称作“以法治之名恢复雇主专断”。他指责白宫限制行业性罢工、加强对工会财务的审查，并允许各州通过削弱封闭式工会的法律，等同于有计划地拆毁工人几十年来争取到的组织权利。\n\n刘易斯本人在美国劳工运动中从来不是容易被忽视的人物。他既曾与企业进行激烈斗争，也曾同其他工会领袖公开决裂；他对工团主义者夺取国家持悲观态度，却同样不接受企业主以反激进主义为名拒绝一切集体谈判。此次演说中，他尤其警告矿工和钢铁工人，若政府继续把每场劳资冲突都视作潜在叛乱，工人最终便不会再相信宪政制度能够保护他们。白宫方面对此不以为然。塔夫脱认为，工会可以存在，也可以谈判，但不应享有凌驾于普通法律之上的特权。一个能够关闭全国煤矿、瘫痪铁路或迫使民选政府屈服的组织，本质上同不受约束的垄断企业并无区别。总统的支持者更指出，刘易斯过去在政治联盟上的反复无常，早已证明他的演说更多服务于个人权力，而非普通工人的利益。\n\n这番批评仍在工业州引起广泛反响，但白宫似乎并不准备因此改变方向。对塔夫脱而言，法律必须同时约束资本与劳工，而不会因为某位工会领袖的怒吼便有所例外。"
 USA.637.a:0 "谁在乎一个赤匪的说辞？"
 USA.638.t:0 "总统遇刺！"
 USA.638.d:0 "赫伯特·胡佛今日在结束一场公开活动后遭到枪击。袭击者混在人群之中，在总统车队即将离开时突然冲破警戒线，连续开枪。特勤人员迅速将其制服，但其中一发子弹击中了胡佛，另一发则穿过车身，险些伤及随行官员。总统被紧急送往附近医院，经过数小时手术后才脱离生命危险。\n\n这已经不是胡佛第一次成为刺杀目标。多年政治动荡、经济危机与内战遗留的仇恨，使他的名字同时成为激进分子、失败派系与个人复仇者憎恨的象征。此前几次袭击或因计划拙劣而失败，或仅造成轻伤，因此白宫总能将其解释为总统坚韧不屈的又一次证明。然而这一次，医生明确警告，胡佛的年龄和伤势已经不允许他继续承受高强度工作，更不可能展开全国竞选。\n\n共和党领导层很快召开秘密会议。公开声明仍然祝愿总统早日康复，私下讨论的却已经是继任人选、党内团结与下一届大选。许多过去不敢挑战胡佛权威的人如今一致认为，即使总统本人坚持参选，党也无法再把整个政治前途寄托在一个可能随时因健康问题退出的人身上。"
 USA.638.a:0 "一场悲剧...(真的吗？)"
 USA.639.t:0 "总统还是议长？"
 USA.639.d:0 "在加纳的第二任期中受到在推动立法收到了来自国会甚至党内的阻挠后，加纳在一场私人宴会上自嘲的说“我犯过的最严重的错误就是当选美国总统，我应该继续担任众议院议长。我放弃了政府中第二重要的职位，去从事一个毫无意义的工作。”加纳说自己不后悔第一任期内尽力平息了美国国内的混乱政局，但现在不同党派的人又开始重新反对他的施政令他失望。"
 USA.639.a:0 "哦...好吧"
 USA.640.t:0 "“一文不值”"
 USA.640.d:0 "加纳总统历来不尊重副总统的职权，在民主党全国大会上，约翰·南斯·加纳也拒绝担任其他候选人的竞选副手。因此，当他选择萨姆·雷伯恩出任副总统，也暗示过雷伯恩的立场不会对行政决策起到任何影响。正因如此，当他在今天的报纸上读到萨姆·雷伯恩直言不讳地批评自己未能妥善安抚激进派的文章后，会感到如此震惊，并在随后的采访中当面表示，他不必理睬副总统的说辞，因为他“一文不值”。"
 USA.640.a:0 "真是桩丑闻"
 USA.641.t:0 "这么大的锤子你砸坏个试试？"
 USA.641.d:0 "对约翰·南斯·加纳总统的忠实抱有肯定态度的德克萨斯民众决定为他赠送一份礼物，感谢他长期以来为民主党事业所做出的贡献——因此，加纳先生获得了一把四百磅重的铁锤。毕竟，总统阁下是扬名万里的“好脾气”，在担任总统的第一年就接连摔坏了好多只木槌，据说他对这份礼物非常满意，确信它能承载住自己任何愤怒的重量。"
 USA.641.a:0 "当你有柄锤子时，什么都会看起来像颗钉子"
 USA.642.t:0 "我们的协约国兄弟"
 USA.642.d:0 "支持协约国归乡或者仅仅是加强外交关系"
 USA.642.a:0 "终有一日流亡者会归乡"
 USA.642.b:0 "口头友好是可以的，要援助是没有的"
 USA.643.t:0 "真金白银的餐食"
 USA.643.d:0 "对罗素总统来说,比起无端的军事支出与军备竞赛，他更加希望将资金用于建设国内与帮助贫民。罗素总统提出了一项计划，通过食品券和学校午餐计划将佐治亚州的剩余食品分发给贫困家庭，并希望为解决农村贫困问题提供一定的帮助。\n\n在部分城市学区，学校食堂的菜单开始发生变化。以往只能勉强充饥的面包与简单餐饭，逐渐被更稳定的主食与新鲜食材所取代。对许多家庭而言，这不仅减轻了日常开支的压力，也让孩子们在课堂上不再因饥饿而分心。尽管一部分反对者与媒体对此提出质疑，认为这类支出在如今的财政压力下的必要性值得质疑，认为政府应当优先投入更具“长期回报”的基础设施与产业项目。然而，白宫发言人给出的回应则相当直接：营养不良的孩子，很难在未来成为健康而有生产力的公民。\n\n但在真正执行中，各州的财政状况与实际情况往往与联邦的构想有所偏离。例如在曾经总统在政治生涯中耕耘过的佐治亚州，午餐计划的落实情况就得到了更好的保障，而对于一些财政捉襟见肘的南部州，真正落到实处的食品券与餐食补助则相形见绌了。面对公众的质疑，总统认为联邦应当直接拨款来越过州一级的财政以让校餐计划真正的在全国范围内得到落实，但总统的幕僚们也认为如今的中央政府的财政不适合再在该项目上继续加大投入。"
 USA.643.a:0 "让孩子们都吃好才重要"
 USA.643.b:0 "联邦不会干预，交给各州政府去做吧"
 USA.644.t:0 "民主党自由派脱党"
 USA.644.d:0 "那些支持联邦政府应在“公平施政”改革中占据主导地位的议员，被称为“民主党自由派”，他们与党内元老的理念之争，已经达到实际决裂的地步。日前，他们呼吁在国会成立自由民主党党团来对抗坚持保守主义立场的本党势力。新闻媒体专门对该党“新宣言”的发表活动发表组织专题报道，并为参会者起了“自由党人”的头衔。新名字最近正在民间流传开来，成为这个新生政党的非正式代号。时间将向美国政坛表明这究竟意味着什么。"
 USA.644.a:0 "我们不会想念他们的"
 USA.645.t:0 "新蓝联盟"
 USA.645.d:0 "今天，在从阿布萨隆·威利斯·罗伯逊、艾伦·约瑟夫·埃兰德这样的老炮到尤金·麦卡锡、哈里·杜鲁门之类的年轻议员的一众保守派议员的陪同下，[USA.GETLeader]总统发表了一份重大声明。面对保守力量在过去大受打击的政治环境，总统迫不及待地宣布在数周的激烈谈判后，他已经建立了一个新的政治联盟。这个被称为“新蓝联盟”的联盟力图巩固因党内纷争而摇摇欲坠的民主党秩序。民主党变得比以往都更要团结，看来这次他们真得能长久统治下去了。让国会中像明尼苏达州的亨里克·西普斯特德这样的少数自由派政客们也清楚明白了这一点。"
 USA.645.a:0 "决定了千次选举的握手言和"
 USA.646.t:0 "伯德之巢"
 USA.646.d:0 "长久以来，弗吉尼亚州背后的主宰者都是伯德组织，或者说是伯德机器——伯德和民主党人就是靠着它暗中掌控该州的。这一组织通过司法人员组成的网络施加影响力，其成员愿意在任何时候为伯德提供方便。这台机器效果显著，而现在伯德登上了总统宝座，机器也开始进行扩张。被戏称为“小鸟”的忠于伯德的新任法官们在各大城市扎根，开始构筑起为伯德服务的网络。当然也会有抵抗，尤其是在堪萨斯城和芝加哥市，不过有了联邦政府全力支持，旧秩序的遗老遗少被彻底消灭只是时间问题。伯德想要通过自己的组织发起一轮新的白人民权运动，将南方的种族价值观推广到北方的众多城市中去。虽对种族隔离并无好感，但伯德坚信黑人与白人无法在文明社会中和谐相处，因为两个种族之间有着太多仇恨，强行融合只会不得安宁。所以，将种族隔离价值观传播到北方，伯德就能纠正历史错误，粉碎“黑人民权运动”的堡垒。"
 USA.646.a:0 "听，我的小鸟在歌唱"
 USA.647.t:0 "威尔基性丑闻"
 USA.647.d:0 "维斯特布鲁克·佩格勒，这名作恶多端好吹牛皮的专栏作家，日前发表文章称，威尔基总统与女记者伊丽塔·范·多伦存在着不正当关系，两人正合伙欺骗伊迪丝·威尔基夫人的感情。总统阁下目前正面临着“婚姻不忠”的指控，白宫新闻处处长竭尽所能地控制着丑闻的影响，女记者伊丽塔也被安排开启一场特别的休假。尽管如此，威尔基总统的公信力已经受到明显损害。"
 USA.647.a:0 "该死的佩格勒！"
 USA.648.t:0 "威尔基在全国有色人种协进会的演说"
 USA.648.d:0 "尽管威尔基总统长期被视为民主党内的温和派人物，但在种族问题上，他从未完全认同南方民主党根深蒂固的立场。早在1936年大选期间，他便公开批评约翰·南斯·加纳未能有效争取黑人选民的支持，认为这种短视的选举策略正在将一整代选民推向体制之外。\n\n日前，总统在全国有色人种协进会年会上发表了一场颇具象征意义的演说。这是历任总统中少见的公开场合发声。威尔基在讲话中明确支持军队逐步废除种族隔离制度，并点名批评共和党与民主党长期以来对黑人选民诉求的忽视，正是这种漠视促使越来越多的黑人选民转而支持社会党等反建制力量。\n\n演讲的后半段，威尔基将话题引向更广泛的公民权利议题。他呼吁国会正视犹太公民的民主权利，并警告称，一旦反犹主义在国内政治中被默许为某种“可接受的偏见”，其逻辑终将演变为制度性歧视，而被排斥的群体迟早会成为激进政治动员的土壤。\n\n这场演说在会场内引发了热烈反响，但在国会山却显得微妙而尴尬。民主党内的南方派系私下表达不满，而更多议员则选择保持沉默，担心任何正面回应都会在即将到来的选举周期中引发不必要的争议。"
 USA.648.a:0 "威尔基这个老好人……"
 USA.649.t:0 "巴克利取缔刑事劳务制度"
 USA.649.d:0 "日前，巴克利总统与民主党在“公平施政”政策的配套基建问题上产生分歧。事件的起因是，有人在国会辩论中提出设立联邦资助下的小型社区工程项目，采用“刑事劳务制度”弥补沉重的经费问题。“刑事劳务制度”的本意，是要求在押囚犯参与公共工程建设以节约政府开支，但巴克利总统在肯塔基的经历告诉他，刑事劳务的效率远逊于普通合同工，因此发表公开讲话驳斥这些观点。总统的坚定立场，给主张联邦政府推动廉价重建计划的南方民主党人，惹来不少党内批评。此外，美国民众在这场辩论中表现出来的态度，使许多州出台法案废止这项制度。"
 USA.649.a:0 "理应如此"
 USA.650.t:0 "备受争议的刑事劳务项目"
 USA.650.d:0 "理查德·拉塞尔入主白宫前在佐治亚州的政治生涯并非毫无争议，为削减基建开支，拉塞尔曾授权使用刑事犯参与国家公共工程。这件事本身不至于引起太大问题，但刑事劳务执行过程中恶劣的工程与生活环境，使这种制度本身的性质受到广泛质疑。最终，罗伯特·伯恩斯，一位蒙冤入狱而终获昭雪的刑事犯，出版了他的自传体小说，《佐治亚铁链帮的亡命者》。书中详尽描绘了联邦刑事劳务制度的腐败与残忍，并将领导责任归咎于现任总统拉塞尔。对总统施政持批评观点的人，对这本读物揭露的事实相当满意，有关好莱坞计划以本文内容为题材拍摄电影的传言也传播甚广。"
 USA.650.a:0 "谁会相信入过狱的人？"
 USA.651.t:0 "劳工法"
 USA.651.d:0 "近日，一套新的劳动法律被提交至国会审议。在这部新的劳工法案中，联邦最低工资和每周最高工时将被首次确立。最低工资法规定全国最低时薪为每小时25美分，而最高工时法规定每周基本工作时间不得超过40小时。这些法律在国会被整合在一起，这意味着如果其中一个失败或通过，另一个也一样。我们要签署通过吗？"
 USA.651.a:0 "通过法案"
 USA.651.b:0 "进一步提高最低工资"
 USA.652.t:0 "整顿野蛮发展的好莱坞"
 USA.652.d:0 "为了促进真正的美国价值观，与好莱坞建立更紧密的关系似乎是明智的。然而，好莱坞不光彩的会计手法的浮华妖媚地扰乱了我们衡量回报的能力。这些私人资助的爱国主义作品从销售总额中收取利润，它们的数额一直很高。然而，我们从这些交易中获得的个税收入几乎为零。这种不一致的分配需要重新谈判！电影公司被告知，伪造账目的做法将使他们失去美国政府的支持！"
 USA.652.a:0 "也许我们可以对爆米花征税？"
 USA.653.t:0 "铁路国有化"
 USA.653.d:0 "进步党内一直有人希望将国内铁路国有化，而现在他们得到了机会，他们便要正式的开始运动起来了，不过国会内部的保守派议员一直对此持强烈的反对态度，而共和党则内部则难以形成真正统一的观点，以至于不得不对此问题表示了中立，所以现在问题就十分的……尴尬。无论如何，现在国会内部的意见分两种，一派只国有化铁轨，而对机车表示毫无兴趣，另一派则是坚定的认为一切铁路公司，无论是铁轨运行商还是机车运营商都要被国有化，哪一派会占上风？"
 USA.653.a:0 "将铁路国有化"
 USA.653.b:0 "将铁路和机车整体国有化"
 USA.654.t:0 "“大型公共工程”分歧"
 USA.654.d:0 "为维护美国国际信誉而实施经济改革，是大多数民主党人的共识；出于这项目的，民主党内部却在采取何种措施处理危机上出现分歧。关于“公共工程对市场作用”的不同观点，导致一项通过水力发电为西南各州实现电力供给的项目陷入停滞。相关管理机构可以实现跨州运营，在公共土地上建设水坝，这必然会影响私营电力公司的效益。民主党保守派认为，这种做法涉嫌侵犯各州的贸易管辖权；民主党自由派则相信，开办这项公共工程的潜力与必要性远大于实际风险。"
 USA.654.a:0 "民主党自由派获胜"
 USA.654.b:0 "民主党保守派获胜"
 USA.655.t:0 "保守主义宣言"
 USA.655.d:0 "某民主党党内小组日前举行会议讨论他们的未来，其中包括斯特罗姆·瑟蒙德与哈皮·钱德勒。长期以来，他们担任国会议员反对党内向总统政策靠拢，因此，新发表的《保守主义宣言》呼吁抵制“公平施政”政策的长期影响，实现美国州权复兴。眼下的问题在于，民主党内部会如何看待他们发表的这份所谓宣言……"
 USA.655.a:0 "民主党支持宣言"
 USA.655.b:0 "民主党谴责宣言"
 USA.656.t:0 "总统阁下向纲纳·缪达尔致敬"
 USA.656.d:0 "瑞典经济学家纲纳·缪达尔最近出版的新书《美国的抉择》，对种族关系与理想主义间的联系，及其本人对美国信条的研究论文进行了详细探讨。作为美国卡内基研究所资助的研究学者，缪达尔被选中的原因也正是他对美国政治独到的正反观点和论述。这本读物得到不少研究机构的好评，其作者纲纳·缪达尔也被邀请前往白宫与总统阁下共进晚餐，外交家拉尔夫·本奇与他同行——作为本书的合作编写者。"
 USA.656.a:0 "愿我们恪守美国信条"
 USA.657.t:0 "威廉·麦卡杜已死"
 USA.657.d.civil_war_avoided:0 "著名政治家威廉·吉布斯·麦卡杜在加州的家中去世。并留下了一份有争议的遗产。许多美国人指责他是大萧条以及由此引发的政治危机的罪魁祸首。一方面，他在许多进步问题上（尤其在妇女选举权上）的努力受到赞扬，尽管他从未能够让禁酒令获得通过，他在国会曾多次推动禁酒令，但都无济于事。他留下了一份分裂的遗产。尽管如此，[USA.GetLeader]还是对麦卡杜的去世发表了评论，并向他的家人表示了哀悼，并赞扬了他的辛勤工作。"
 USA.657.d.civil_war_no_psa:0 "著名政治家威廉·吉布斯·麦卡杜在加州的家中去世。并留下了一份有争议的遗产。许多美国人仍指责他是大萧条和由此引发的政治危机及此造成的内战的罪魁祸首。一方面，他在许多进步问题上（尤其在妇女选举权上）的努力受到赞扬，尽管他从未能够让禁酒令获得通过，他在国会曾多次推动禁酒令，但都无济于事。他留下了一份分裂的遗产。尽管如此，[USA.GetLeader]还是对麦卡杜的去世发表了评论，并向他的家人表示了哀悼，并赞扬了他的辛勤工作。"
 USA.657.d.civil_war_psa_usa:0 "著名政治家威廉·吉布斯·麦卡杜在加州的家中去世。并留下了一份有争议的遗产。许多美国人仍指责他是大萧条和由此引发的政治危机及此造成的内战的罪魁祸首。一方面，他在许多进步问题上（尤其在妇女选举权上）的努力受到赞扬，尽管他从未能够让禁酒令获得通过，他在国会曾多次推动禁酒令，但都无济于事。他留下了一份分裂的遗产。尽管如此，内战开始时，他公开支持加利福尼亚的卖国贼。[USA.GetLeader]对他的死发表了评论，并公开批评麦卡杜支持西方叛徒的决定。"
 USA.657.d.civil_war_psa_psa:0 "著名政治家威廉·吉布斯·麦卡杜在加州的家中去世。并留下了一份有争议的遗产。许多美国人仍指责他是大萧条和由此引发的政治危机及此造成的内战的罪魁祸首。一方面，他在许多进步问题上（尤其在妇女选举权上）的努力受到赞扬，尽管他从未能够让禁酒令获得通过，他在国会曾多次推动禁酒令，但都无济于事。他留下了一份分裂的遗产。尽管如此，内战开始时，他对西海岸临时政府的支持给了它一种合法性。[CAL.GetLeader]对麦卡杜的去世发表了评论，并表达了他的哀悼，并赞扬了麦卡杜留下的遗产。"
 USA.657.a:0 "他将被铭记！"
 USA.658.t:0 "预防脊髓灰质炎"
 USA.658.d:0 "乔纳斯·索尔克博士发现了一种脊髓灰质炎（小儿麻痹症）的预防方法。这种神奇的特效疗法被许多人称为现代医学的突破。脊髓灰质炎再也无法在美国境内疯狂肆虐。全美的父母纷纷前往各地诊所，为他们的孩子和自己接种新的疫苗。"
 USA.658.a:0 "感谢您，索尔克博士"
 USA.659.t:0 "向工团主义者伸出援手"
 USA.659.d.progs:0 "美利坚社会党在内战期间被其他势力妖魔化，其成员以大多被视为极端分子。然而，我们知道在该组织统一的外表下还掩盖着更多的派系差别。从社会民主党人到工团主义者，再到民主社会主义者，甚至是极权主义者，该党党员的政治立场是极为多样化的。不管怎样，他们许多以前在红带的支持者在上次选举中加入了我们的胜利联盟，实际上成为了我们最大的票仓之一。没有他们，我们就不会赢得选举。无论如何，我们也应该与他们的领导层接触，希望他们正式作为一股政治力量加入我们。然而这并不容易，他们肯定会要求我们做出让步。具体来说，他们似乎将要求赋予工会更多权力，设置全民基本收入，并提高工人工资。我们将在芝加哥安排一次会议，罗伯特·费迪南德·瓦格纳将与威廉·B·格林和伊丽莎白·格利·弗林进行谈判。不过关于这次会议的传言已经传到民主党人和共和党人的耳朵里，看来他们正在联合起来，以对抗我们日益增长的新兴力量……"
 USA.659.d.replibs:0 "传统上，中西部地区一直是共和党的大本营。随着美国工团主义的兴起，这已成为了历史，共和党失去了在该地区的票仓。然而，在最近的选举中，我们的进步理念似乎赢得了许多前社会党成员的支持，而其中许多人曾经是共和党人。如果我们能巩固这个票仓，我们将在未来几年内在选举团中拥有一定的优势，因为红带各州在选举团中拥有很高的票数。在我们确定他们是否忠诚之前，我们应该先和他们的领袖谈谈。初步进行的谈判尝试表明，他们的主张很强硬，我们可能不得不在他们和我们已为数不多的少数富人赞助人之间做出选择。不管怎样，我们已经在芝加哥安排了一次会面，年轻而才华横溢的哈罗德·史塔生将与诺曼·托马斯和詹姆斯·P·坎农会面并讨论条款。很明显，这样的会议已让民主党人感到紧张，而且他们似乎正在举行相应的谈判，将旧民主党重新纳入他们的政党……"
 USA.659.a:0 "让我们去参观风之城吧！"
 USA.660.t:0 "向旧民主党人伸出援手"
 USA.660.d:0 "民主党曾经是一股强大的力量，但近年来遭受了一次又一次的打击。但坏事成双，该党接着分裂为两派，随之而来的内战又摧毁了该党。但是，既然内战已经结束，我们又取得了胜利，我们就应该设法修补党内的矛盾。在内战期间加入旧民主党并为默里而战的民主党人在最近的选举中又转而支持我们，我们应当确保他们不会再次抛弃我们。为此，我们需要与旧民主党的领导人进行谈判，而他们将会提出各种苛刻的条件。然而，我们愿意我们所能做的一切事来获得他们的支持。他们要求我们做出各种让步，从消除腐败的政党机器到使吉姆·克劳法推广到全国。我们将在亚特兰大决定协议的内容，南方民主党人卡特·格拉斯将在那里与詹姆斯·F·伯恩斯、亨利·福特以及白人联盟的多位领导人会面。这次谈判肯定会让进步党人与共和党人感到焦虑，他们似乎已经在计划下一步的行动了。"
 USA.660.a:0 "让默里屈服！"
 USA.700.t:0 "即将到来的大选"
 USA.700.d.progs:0 "乔治·诺里斯就任已经快四年了，尽管他在任期开始时面临着一个正在崩溃的国家，但他能够迅速采取行动，以阻止一场内战的爆发。虽然诺里斯与罗斯福的组合在进步派选民中广受欢迎，但这并不能保证他的连任。四年前，经过紧张的谈判，休伊·朗和杰克·里德同意共同支持进步党，他们可能是该党领导人取得连任机会的关键，所以获得他们的支持是至关重要的。与此同时，意识形态的斗争似乎将成为今年民主党和共和党初选的特点。那些同意许多诺里斯改革措施的人认为，接受其中一些改革是在11月击败进步派的唯一途径，而那些强烈反对“公平施政”的人则认为，坚定自己的政策主张是获胜的唯一途径。即使两党还没有决定如何与诺里斯竞争，但很明显他已经在媒体上树敌无数。无论诺里斯做什么，报纸的报道似乎都对他不利，这可能会在选举中给他带来麻烦。尽管如此，诺里斯和罗斯福都表达了他们继续在职工作的热情，并希望引领美国进入一个繁荣的新时代。"
 USA.700.d.landon:0 "在短短几年时间里，阿尔夫·兰登总统扭转了赫伯特·胡佛给他造成的共和党的惨淡命运。兰登计划与胡佛计划的主要不同之处在于，兰登将美国的经济困境归咎于关税，因此采取了更加自由放任的方式。但尽管这个计划与刺激内需的计划在很大程度上帮助了美国复苏，但不能保证共和党人会在11月得以连任。一个政党连续四次入主白宫在美国政治中是很罕见的事情，而如今的美国与胡佛开始第一个任期时的美国相比，确实有了一些变化。在1936年参选的第三党的叛乱分子基本上荡然无存，但他们的领导人仍有些许影响力，他们的批评集中在兰登贸易政策的影响上。朗和里德严厉抨击兰登的政策，他们坚持认为，兰登的政策损害了农民和工人的利益，而让企业受益，而默里则认为，兰登的政策只对国际精英阶层有利。与此同时，虽然进步派在很大程度上呼应了里德和朗的批评，但民主党人却精心打造了自己的宣传信息，将兰登描绘成一个脱离现实的东方精英，无法理解普通美国人的困境。这些批评会造成什么结果还有待观察，但很明显，兰登可能会面临着艰难的连任之路。"
 USA.700.d.curtis:0 "查尔斯·柯蒂斯总统在其充满挑战的任期内成功带领国家走向复苏，尽管身体条件无法支持他寻求第二个任期，但他仍然为了共和党得以继续留在白宫而奔走努力。虽然柯蒂斯的工作分享计划和经济刺激计划正是使美国经济重回正轨所需要的。而且他的成功使他广受欢迎，但共和党在连任的道路上仍然面临着障碍。首先，在上次选举中出现的反建制党派基本上已经消失，但他们的领导人并没有随之消失。里德和朗批评柯蒂斯的计划只是披着保护工人的皮，其实质仍是企业利益至上。与此同时，默里将柯蒂斯与共和党的改革批判为对工团主义者的屈服与投降。主流民主党人在全国政治上经历了多年的失败后，现正在经历一场争夺该党精神的斗争，具有改革思想的民主党自由派希望夺取该党的控制权，而依然强大的党内保守派希望保住权力。但无论其派别如何，几乎所有的民主党人都批评柯蒂斯的计划是专横的侵犯了各州的权利和在“地方自治谈判”中达成的条款。毫无疑问，共和党正将面临一场艰难的选举之路，但所幸有着广泛的民意支持。如果再辅以好运气的话，新的总统候选人将带领共和党再次取得胜利。"
 USA.700.d.garner:0 "约翰·南斯·加纳在第一个任期内击败了所有的政敌，但又有新的政敌试图挑战他的权力。加纳被普遍认为是一个谦逊的人，但实际上他是一个政治心机婊，经常通过幕后交易来实现自己的目标。他的“在风暴中的紧缩”计划以及压制北部和中西部左翼激进分子的政治策略都取得了成功，他终于在一个破败的国家内恢复了秩序。然而，加纳的战斗还没有结束。如果他想赢得连任，他将不得不与现已解散的旧民主党的领导人打交道，旧民主党仍然拥有着数百万选民，他们对近年来所受的待遇感到痛苦不堪。与此同时，许多支持旧民主党的选民依照他们的传统，已经转投民主党，甚至许多旧民主党领导人也称赞加纳对左壬重拳出击的战略。然而，在实现两个民主党的正式统一之前，还有许多工作要做。与此同时，虽然里德和朗一直沉默不语，但共和党一如既往地强大，并煽动北方人和东西海岸精英的愤怒，以反对他们眼中一个肮脏、简单、粗鲁、不适合担任总统的人。正是东北部精英阶层的这种仇恨可能会在他的连任中给他带来麻烦，而在上次选举中投票给他的天主教徒，在他借用一些旧民主党反天主教的言论后，可能对他的第二个任期不那么支持了。此外，加纳的粗暴无礼和纯粹的保守主义主张令东北地区的民主党政党机器感到不满，他们肯定会在动员城市民主党人方面拖他的后腿。精英中有许多人瞧不起加纳，并且已经预测共和党将在11月的大选中获胜。对于加纳来说，他决心向世界证明他们错得有多离谱，他相信民主党能取得胜利。然而，时间会证明他的观点是否正确。"
 USA.700.d.deadlocknorris:0 "上次大选已经过去了将近四年，但那场灾难留下的创伤还没有愈合。当没有候选人能够获得足够的支持以获得绝对的胜利的时候，我们已经连续第二次由众议院选出了国家领导人。乔治·诺里斯和昆汀·罗斯福被选为折衷的人选，大多数国会议员认为这是宽宏大量的举动，因为他们实际上对诺里斯的政见充满鄙夷。他们做出这一决定只是为了安抚朗派、工团主义者和进步党自己，因为他们的票数总和超过了共和党和民主党的票数。然而，让诺里斯担任总统的决定并没有受到该国右翼的欢迎，尤其是旧民主党和整个美国南部。在多年的选举失利和无能之后，民主党已经失去了大部分的忠实支持者，他们转而涌向旧民主党旗下。更糟糕的是，威廉·默里已经说服全国数百万人加入他的队伍，并组建一个新的“国家人民党”。该党获得了新的支持，对诺里斯的连任构成了真正的威胁。诺里斯是一位能干且富有政治智慧的总统，他迅速采取行动，防止了经济崩溃，甚至帮助国家从大萧条中复苏，但在共和党的软弱无能和叛逆的国家人民党的威胁的情况下，他还能坚持下去吗？"
 USA.700.d.deadlockgarner:0 "当我们连续第二次由众议院选出国家领导人时。众议院选择他们的前议长、民主党人约翰·南斯·加纳和他的竞选伙伴阿尔·史密斯赢得了选举。他们做出这一决定是希望加纳能消灭国内和华盛顿内一些较为激进的势力。此外，加纳获得的选票比其他任何候选人都多，但仍不足以赢得绝对胜利。并且这一决定在美国的左翼人士中并不受欢迎。在他的第一个任期内，加纳成功地化解了内战爆发前的国家紧张局势，并使经济免于崩溃。然而，他在政治方面却没有那么成功。由众议院选择另一位总统的决定遭到了休伊·朗和杰克·里德的强烈谴责。自选举以来，两人已经成立了自己的政党，称其为“平民党”，以向与其同名的老政党致敬。他们的规模已经扩大到足以在11月的选举中成为加纳的主要对手，而日益无关紧要的共和党几乎没有对他构成任何挑战。加纳能顶住共和党和叛逆的平民党的压力吗？"
 USA.700.a:0 "我们会极富兴趣地关注他们的……"
 USA.700.b:0 "我们会极富兴趣地关注他们的……"
 USA.700.c:0 "我们将竭尽所能……"
 USA.701.t:0 "泰勒总统的激进提案"
 USA.701.d:0 "泰勒总统就职以来提出过数项奇怪的要求，而这份提案或许是其中最难处理的。总统阁下成功说服数位进步党议员，向国会呼吁复兴“促进世界团结”的旧立法。作为威尔逊总统世界和平计划的忠实继承者，泰勒解释说“世界团结是维护人类生命与文化传承的必要因素，无休止的战火也将迎来终结。”——国会很快驳回了这项提议，但泰勒总统的声誉却因此大为提高。"
 USA.701.a:0 "实际上，我们都希望和平……"
 USA.702.t:0 "泰勒的舞台遍及全国"
 USA.702.d:0 "泰勒总统诸多古怪癖好之一，就是希望成为歌手拯救美国。他曾在国会大厦的台阶上为孩子们唱歌，如今又站在数百万选民面前歌唱团结。泰勒总统或许是少数能把政治上的笑柄，转变为朴素爱国主义表达的政治家。他演唱的曲目永远是促进国家团结、呼吁合作共赢，反对不光彩的胜利。"
 USA.702.a:0 "歌唱吧，吉姆！"
 USA.703.t:0 "[GetYear]年进步党初选"
 USA.703.d.president:0 "[GetYear]年进步党初选已经开始。党在上一届大选中的大获全胜极大的鼓舞了党内士气，同时这四年的任期也为进步党积攒了更多的政治资本。毫无疑问，党的胜利板上钉钉，而提名人选也确凿无疑。"
 USA.703.d.president_norris:0 "[GetYear]年进步党初选已经开始。党在上一届大选中的大获全胜极大的鼓舞了党内士气，同时这四年的任期也为进步党积攒了更多的政治资本。处于惯例，诺里斯总统不参加下一届总统竞选如今我们有四位预备候选人：加州的进步主义活动家亨利·华莱士，威斯康星州州长菲利普·拉福莱特，更加激进的进步主义者阿尔弗雷德·宾厄姆以及老罗斯福的儿子昆汀·罗斯福。今年谁将成为进步党的总统候选人呢？"
 USA.703.d.not_president:0 "[GetYear]年进步党初选已经开始。尽管在过去进步党遭受了诸多挫折，但绝大部分党内成员仍旧对新一届大选充满希望。如今我们有四位预备候选人：加州的进步主义活动家亨利·华莱士，威斯康星州州长菲利普·拉福莱特，更加激进的进步主义者阿尔弗雷德·宾厄姆以及老罗斯福的儿子昆汀·罗斯福。今年谁将成为进步党的总统候选人呢？"
 USA.703.d.president_mcnary:0 "[GetYear]年进步党初选已经开始。党在上一届大选中的大获全胜极大的鼓舞了党内士气，同时这四年的任期也为进步党积攒了更多的政治资本。然而，出于每况愈下的身体健康情况考虑，麦克纳里总统已经正式宣布不再参加下一次总统竞选。而他的副总统亨利·华莱士也颇受党内人士欢迎，党内已经达成一致选择提名他作为下一届总统的候选人。"
 USA.703.d.president_borah:0 "[GetYear]年进步党初选已经开始。党在上一届大选中的大获全胜极大的鼓舞了党内士气，同时这四年的任期也为进步党积攒了更多的政治资本。然而，出于每况愈下的身体健康情况考虑，博拉总统已经正式宣布不再参加下一次总统竞选。事到如今，我们有四位预备候选人：加州的进步主义活动家亨利·华莱士，威斯康星州州长菲利普·拉福莱特，更加激进的进步主义者阿尔弗雷德·宾厄姆以及老罗斯福的儿子昆汀·罗斯福。今年谁将成为进步党的总统候选人呢？"
