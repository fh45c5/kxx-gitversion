 USA_join_iadc_desc:0 "为推动[FROM.GetFactionName]全体成员国的科技创新与发展，[FROM.GetNameDefCap]提出了一合作科研项目——有什么理由不加入呢？"
 USA_agricultural_adjustment:0 "农业调整法案"
 USA_agricultural_adjustment_desc:0 "在这场危机中，有很多方法可以帮助我们的农民。有一种观点认为，我们应该通过农业调整法案，这将提高农民的农产品价格，同时减少过剩农产品。政府将利用这一点来确保他们的农民能够在这些绝望的时期保持生存。"
 USA_peace_through_trade_2:0 "德美亲善"
 USA_peace_through_trade_2_desc:0 "自上次大战以来，德国这个超级大国的崛起将美国产业赶出了欧洲。正因为如此，美国与德意志帝国的关系非常紧张。然而胡佛和诺克斯现在可以向德国示好，寻求让美国产品重新进入欧洲市场。"

#初始假国策
USA_Hoover_speech:0 "总统的新年讲话"
 USA_Hoover_speech_desc:0 "在新年到来之际，总统将向全国发表例行的新年讲话。令人稍感振奋的是，尽管过去一年国内局势依旧动荡，经济复苏的迹象却已隐约可见。只要政府继续保持克制，维持住当前的经济复苏政策，并等待市场恢复信心，美国终将依靠自身的勤勉与创造力走出困境。毫无疑问，在胡佛总统的坚强领导下，美国终将跨越黑色星期一的阴影。"
 USA_Continue_the_laissez_faire_policy:0 "延续放任政策"
 USA_Continue_the_laissez_faire_policy_desc:0 "政府中的建制派坚信，过度干预经济只会扭曲市场的自我调节能力。相较于激进改革，维持放任自流的政策更符合美国长期以来的政治传统。只要企业与金融机构重新获得信心，资本自然会回流，繁荣也将随之重现。延续放任自流的政策不仅是一种经济选择，更是一种对美式资本主义价值观的坚定支持。"
 USA_Strike_hard_at_the_Socialist_Party:0 "对社会党重拳出击"
 USA_Strike_hard_at_the_Socialist_Party_desc:0 "经济困境的蔓延为激进政治提供了温床，社会党及其同情者开始在失业工人、退伍军人乃至部分城市中产阶级中积累影响力，并长久以来的不断试图颠覆政府。政府高层将这一趋势视为对共和国制度的直接挑战，认为纵容这些力量只会削弱国家的凝聚力，并最终动摇宪政秩序。通过强化治安、扩大情报监控与行政打击，白宫将向社会传递一个明确的信号：联邦政府不会允许任何收受境外势力资金与支持的阴谋政党挑战既有政治框架，颠覆国家安全。"
 USA_Stabilize_the_South:0 "稳定南方"
 USA_Stabilize_the_South_desc:0 "南方各州在内战后的政治整合始终进展缓慢，重建时期留下的经济与社会隐患如若不再加以改革，激进主义将在南方持久的滋生下去。华盛顿担忧若放任地区矛盾与社会不满继续发酵，南方可能再次成为混乱甚至内战的策源地。通过与地方精英达成妥协、提供有限的财政援助并强化联邦存在，政府希望在不触动既有权力格局的前提下维持地区稳定。这种策略的本质并非推动深层次改革，而是优先确保如今脆弱不堪的政治秩序不被进一步撕裂。"
 USA_The_establishment_camp_is_united_as_one:0 "建制派团结一致"
 USA_The_establishment_camp_is_united_as_one_desc:0 "面对来自激进派系与民粹运动的双重压力，传统的中道政党与官僚体系中的建制派选择暂时搁置内部分歧，以维护现有政治结构的整体稳定。在他们看来，制度本身仍具备自我修复的能力，真正的危险并非来自经济衰退，而是来自对美国民主制度信心的崩塌。通过塑造‘责任政府’与‘理性治理’的形象，建制派将会试图向社会证明，现行秩序仍是美国避免滑向极端化道路的最后防线。" 
 USA_Relief_for_diligent_farmers:0 "救济勤恳农场主"
 USA_Relief_for_diligent_farmers_desc:0 "我们必须承认，在长达十余年的美国经济萧条中，受到打击最大的除了在城市中生存的工人们，就是人数众多的美国农场主。农村地区长期被视为国家道德与社会稳定的基石，而持续低迷的农产品价格正逐步侵蚀这一基础。政府决定对这些被视为“守法而勤恳”的农场主提供有限救济，以巩固乡村社会对联邦政府的认同。"
 USA_Remove_rust_from_the_steel_strip_area:0 "为钢带区除锈"
 USA_Remove_rust_from_the_steel_strip_area_desc:0 "工业衰退不仅意味着产值下降，更象征着传统工人阶层对国家承诺的信任正在流失。政府提出通过有限的公共投资与企业合作，为钢铁带注入新的活力，以缓解失业带来的社会压力。希望这能够将美国的爱国工人们从赤匪手中争取过来。"
 USA_first_step:0 "脱离经济深渊的第一步"
 USA_first_step_desc:0 "终于，在我们的不懈努力下，大萧条带来的绝大部分经济影响如今已经被平息，美国低迷不振的经济也得到了恢复。很快，政治上的激进主义泛滥的现象也将得到管控与调整，美国将再次回到本该平稳航行的航线之上。"
 USA_reintroduce_gwbill:0 "重提《加纳-瓦格纳法案》"
 USA_reintroduce_gwbill_desc:0 "尽管这部法案在1932年曾遭否决，美国经济形势正恶化到如此危险的地步，令失业救济政策被视为避免大范围崩溃的最后底牌。胡佛总统日前向国会民主党党团宣布，这次他不会主张否决《加纳-瓦格纳法案》。"
 USA_gwbill_fails:0 "法案未获通过"
 USA_gwbill_fails_desc:0 "《加纳-瓦格纳法案》未能通过国会审议，美国复兴之路再度陷入缺乏具体路线指导的状态，民间叛乱活动的增长使这项问题急需得到解决。"
 USA_war_plan_white:0 "白色战争计划"
 USA_war_plan_white_desc:0 "白色战争计划，是为应对国内暴乱与政治危机而拟定的军事策略。是时候动用该计划，来解决美国日益增长的暴力问题了。"
 USA_deploy_national_guard:0 "部署国民警卫队"
 USA_deploy_national_guard_desc:0 "美利坚至上党与社会党支持者发动的暴力袭击正愈演愈烈，我们需要提高国民警卫队资金，将他们重新部署到最需要维持秩序的地方。"
 USA_macarthur_plan:0 "麦克阿瑟的计划"
 USA_macarthur_plan_desc:0 "麦克阿瑟将军提出了一项重要观点：纽约市与德克萨斯是联邦政府控制下两座最为重要，也相当脆弱的战略要点。麦克阿瑟由此拟定了一份计划，如果暴力行为升级为全面内战，那么该项计划至少能让我们保住二者其一。"
 USA_gwbill_succeeds:0 "法案通过"
 USA_gwbill_succeeds_desc:0 "《加纳-瓦格纳法案》在国会胜利通过！这对美国经济而言将是场喜讯——不过现在我们必须开辟财源维持这项计划，否则好消息很难持续太长时间。"
 USA_new_shipyards:0 "船坞补贴计划"
 USA_new_shipyards_desc:0 "两大船舶公司目前正为联邦救济补贴展开激烈竞争，联邦政府的决定将为他们的所在地提供大批就业岗位。眼下的问题在于：我们该更重视哪方的利益呢？"
 USA_hawking_plan:0 "道顿计划"
 USA_hawking_plan_desc:0 "北卡罗来纳州民主党人、众议院筹款委员会主席“农夫鲍勃”罗伯特·李·道顿日前作出提议，通过提高企业所得税的办法为《加纳-瓦格纳法案》提供支撑，不少人对这项计划存在争议，但它可能为经济带来有效的提振。"
 USA_new_industrial_act:0 "新工业法案"
 USA_new_industrial_act_desc:0 "我们需要复兴美国核心地带的重工业设施，毕竟那里是大萧条冲击最为严重的地方。"
 USA_demand_repayment:0 "要求偿付战争债务"
 USA_demand_repayment_desc:0 "联合王国在世界大战期间曾欠下我们大笔战争债务，加拿大理应是这笔欠款的继承者，但至少目前来看，他们不像还得起这笔钱。要求清偿债务会取悦国会的孤立主义者。如果不能妥善安抚他们的话，这群人很可能转向反对政府施政。"
 USA_reconciliation_with_canada:0 "与加拿大和解"
 USA_reconciliation_with_canada_desc:0 "孤立主义者感到相当满意，我国与加拿大的关系却因此受损。有鉴于此，我们可以考虑同北方邻居建立某种谅解：加拿大向美国提供急需的援助，将欠款偿付问题拖延到战后商榷。此外，协约国成员将对我国出口物资降低关税。"
 USA_pass_tariff_act:0 "通过《斯穆特-霍利关税法》"
 USA_pass_tariff_act_desc:0 "令人震惊的消息传来，加拿大政府拒绝偿付债务。作为回应，我们唯一的选择就是对协约国出口到美国的商品加征惩罚性关税，尽管这将为我们挽回部分损失，但修复与加拿大的关系则是更为漫长的过程。"

USA_Here_is_chaos:0 "风暴将至"
 USA_Here_is_chaos_desc:0 "美国已经越过了那个还能靠几场演讲、几项妥协或者一次寻常选举来解决问题的阶段。黑色星期一留下的失业与破产仍在蔓延，工厂与农场之间、北方与南方之间、资本家与工人之间的裂痕却还在继续扩大。社会党、民粹派、南方保守势力与军方都在公开指责华盛顿失去了治理国家的能力，而各州政府也越来越习惯自行其是。1936年的总统大选不会平息这一切。恰恰相反，它只会决定谁将在风暴真正降临之前坐进白宫。"
 USA_President_Haywood:0 "大比尔拔得头筹"
 USA_President_Haywood_desc:0 "比尔·海伍德的胜利震动了整个国家。几十年来，社会主义者一直被美国政治主流视为街头鼓动者、工会激进分子与不切实际的梦想家，如今他们却第一次真正掌握了白宫。工人社区举行彻夜庆祝，红旗与工会旗帜悬挂在工厂区上空，而保守派报纸则用“革命已经通过选票进入华盛顿”来形容这一结果。大比尔终于拔得头筹，但他赢得的只不过是一座已经被点燃引信的火药库。"
 USA_President_Macarthur:0 "讨贼戡乱乃救国正途"
 USA_President_Macarthur_desc:0 "当文官政治在党争、罢工、暴力冲突与地方抗命中不断失去控制时，越来越多美国人开始把希望寄托在一位军人身上。道格拉斯·麦克阿瑟以秩序、纪律和国家统一为竞选核心，宣称共和国不能继续任由极端主义者撕裂，也不能让国会用无休止的争论拖延必要行动。在他看来，美国的问题已经不再只是经济衰退，而是一场对共和国生死存亡的叛乱。若有人执意举旗反抗，那么讨贼戡乱，便是唯一的救国正途。"
 USA_President_Long:0 "人人皆国王！"
 USA_President_Long_desc:0 "休伊·朗终于完成了许多人曾认为不可能完成的事情。凭借“分享财富”的口号、遍布全国的基层组织和对华盛顿精英毫不留情的攻击，这位来自路易斯安那的“王鱼”成功把自己的民粹运动送进了白宫。无数农民、失业者与小业主相信，终于有人愿意替他们向银行家和大企业讨回失去的一切。朗承诺限制巨额财富、扩大公共工程、保障家庭收入，并用联邦力量打破少数富豪对经济命脉的控制。尽管王鱼已经跃进白宫，但围绕他的掌声与诅咒同样响亮。"
 USA_President_Murray:0 "自南方而来的呼唤"
 USA_President_Murray_desc:0 "威廉·H·默里的胜利标志着南方保守主义终于不再满足于抱怨华盛顿，而是准备亲手夺回它。作为一个长期敌视联邦权力扩张、工团主义和北方金融势力的强硬派，默里把自己的竞选塑造成对传统美国的一次最后保卫。他的支持者相信，州权、地方自治、白人南方的社会秩序与旧共和国的价值正在遭到前所未有的攻击。而默里本人对批评与攻击毫不退缩，坚定准备以自己的愿景改造美国。" 
 USA_Legalize_the_Socialist_militia:0 "合法化社会党民兵"
 USA_Legalize_the_Socialist_militia_desc:0 "长期以来，社会党地方组织一直依赖纠察队、工人自卫团与赤卫队保护罢工、工会会所和左翼集会。保守派将这些人视为披着政治外衣的私人武装，而社会主义者则坚持，他们不过是在警察与企业保安无法保障工人安全时进行自卫。如今，海伍德政府准备彻底改变这种模糊状态。通过行政命令与新的联邦条例，经过登记并接受统一指挥的社会党民兵将被赋予合法身份，可以公开训练、持有部分武器，并协助维持工业区秩序。"
 USA_The_vision_of_a_world_revolution:0 "世界革命的愿景"
 USA_The_vision_of_a_world_revolution_desc:0 "对社会党激进派而言，美国革命从来不该止步于提高工资、接管银行或修改税制。真正的目标，是把美国劳动者的胜利同世界其他地区的工人运动连接起来，使这个曾经象征资本主义繁荣的新大陆成为国际革命最强大的堡垒。欧洲的工团主义者、拉丁美洲的左翼和世界各地的革命者都在密切关注华盛顿。海伍德的政府可以向他们提供资金、宣传渠道、避难所与组织经验。然而这种政策势必进一步刺激国内反对派，因为在他们看来，总统已经不再试图治理美国，而是在利用美国的国家机器输出革命。"
 USA_Minutemen_roared_up:0 "一分钟人呼啸而起"
 USA_Minutemen_roared_up_desc:0 "休伊·朗的运动早已不再只是一次普通的选举联盟。随着全国政治暴力不断升级，越来越多支持“分享财富”的退伍军人、农民和地方活动家自发组成武装护卫队，用来保护集会、驱赶敌对组织，并在地方官员拒绝执行总统政策时维持秩序。这些人借用了美国革命时期“一分钟人”的名字，宣称自己随时准备在一分钟内拿起武器，保卫普通人民免受银行家、赤色革命者和腐败政客的压迫。批评者指出，他们实际上正在变成一支忠于朗个人政治机器的准军事力量；支持者则回答，既然对手已经拥有自己的武装，他们没有理由赤手空拳。"
 USA_Establish_wealth_limit:0 "确立财富限额"
 USA_Establish_wealth_limit_desc:0 "没有任何人应该贫穷，也没有任何人需要富裕到能够买下整个国家。”这句口号如今终于有机会转化为联邦政策。朗政府计划对个人财富、遗产和巨额企业收入设立严格上限，并通过高额累进税把超过限额的部分转移到公共工程、住房和家庭补助计划之中。银行家和工业巨头把这项政策称为对私有财产的公然掠夺。朗对此嗤之以鼻，声称真正的掠夺早已持续了几十年，只不过过去从贫穷者流向富有者。如今，方向将被倒转。"
 USA_The_savior_of_farmers:0 "农民的救主"
 USA_The_savior_of_farmers_desc:0 "美国农民已经为经济危机付出了过多代价，而朗把这些乡村困境视为旧经济制度最明显的罪证之一。政府将扩大农业信贷、暂缓部分农场止赎，并通过联邦采购提高主要农产品价格。地方公共工程也会优先雇佣失地农民，而偏远地区的公路、电力和学校建设将得到新的拨款。朗的政治对手指责这些政策只是用联邦资金购买农民忠诚，但在美国腹地，越来越多人开始把王鱼称作农民的救主。"
 USA_Shake_the_banner_of_populism:0 "摇动民粹大旗"
 USA_Shake_the_banner_of_populism_desc:0 "朗主义从来没有严密的理论体系，它真正依赖的是一种更简单也更强大的政治语言：人民正在被少数精英欺骗，而政府必须站到人民一边。银行家、铁路财团、华尔街律师、党务机器和自以为是的知识分子，都成为朗演说中反复出现的靶子。现在，总统准备把这种民粹主义变成全国政治的主旋律。广播演说将直接越过报纸与国会，把白宫的信息送到每一个客厅。"
 USA_KING_FISH:0 "王鱼跃龙门"
 USA_KING_FISH_desc:0 "休伊·朗曾经只是路易斯安那政治中的一个异类，一个用粗俗语言、疯狂演说和庞大地方机器挑战旧精英的南方政客。如今，他已经完成了从州议会、州长官邸到白宫的全部跃迁。“王鱼”不再只是一个绰号，而几乎成为整个政治时代的象征。总统身边的忠诚者开始控制更多联邦职位，分享财富俱乐部被纳入全国组织体系，地方盟友则通过拨款和任命同华盛顿建立直接联系。今天的休伊·朗已经不再需要敲门进入美国权力中心——他自己就是这扇门。"
 USA_Eliminate_financial_parasites:0 "消灭金融蛀虫"
 USA_Eliminate_financial_parasites_desc:0 "海伍德与休伊·朗在许多问题上彼此敌视，但对于华尔街和金融寡头却有着难得一致的判断：美国已经被一群不创造实际财富、却能够左右工厂、农场与家庭命运的金融寄生者控制太久了。政府将加强对大型银行和证券交易的监管，调查逃税、投机与利用危机扩张垄断的行为，并扩大公共信贷。" 
 USA_NO_MORE_RED_BANDIT:0 "彻底镇压赤色匪帮"
 USA_NO_MORE_RED_BANDIT_desc:0 "对于新总统而言，工团主义已经不再是一种值得在议会和大学里讨论的政治理论，而是一股正在直接威胁国家统一的武装力量。赤卫队公开训练，激进工会扣押工厂，部分地方党部甚至拒绝承认联邦警察的权限。若继续把这一切当成普通政治活动，政府最终只会发现自己已经失去了整个工业带。总统因此授权联邦调查机关与军方扩大对极端左翼组织的清查，涉嫌组织武装叛乱者将受到逮捕，关键铁路、军工厂和通信设施也会得到额外保护。"
 USA_Panzer_marching:0 "正如1932重演"
 USA_Panzer_marching_desc:0 "1932年，当奖金远征军聚集华盛顿时，麦克阿瑟曾亲自率领正规军驱散那些退伍军人。那次行动至今仍被他的敌人视为傲慢与残酷的象征，而他的支持者则把它解释为一个军官在政治瘫痪时履行命令的必要行动。如今，类似的景象正在以更加危险的规模重现。装甲车辆与机枪部队开始进入首都周边和主要工业城市，军队被命令保护铁路、联邦建筑和军械库，必要时驱散拒绝服从命令的武装人群。街头再次出现士兵、骑兵与装甲车的身影，而报纸已经开始把眼前的一切同四年前相提并论。不同的是，这一次等待军队的不会只是帐篷和抗议标语。"
 USA_with_righteous_men_in_white_robes:0 "与白袍义士同行"
 USA_with_righteous_men_in_white_robes_desc:0 "默里的支持联盟中存在着一群令许多华盛顿政治家极为不安的盟友。三K党在南方和中西部仍拥有庞大地方网络，他们宣称自己代表传统、宗教、地方自治和所谓“真正的美国主义”，并主动表示愿意协助政府对抗社会主义者、工会激进派和其他被他们视为国家敌人的势力。总统身边的一些人认为，在联邦政府力量不足以覆盖每个县时，没有理由拒绝这些现成的地方组织。他们拥有成员、车辆、武器和对乡村社会的熟悉程度，完全可以成为维护秩序的辅助力量。"
 USA_In_memory_of_the_great_sage_Jackson:0 "纪念先贤杰克逊"
 USA_In_memory_of_the_great_sage_Jackson_desc:0 "安德鲁·杰克逊始终是南方民粹与州权传统中最具号召力的历史人物之一。对默里而言，杰克逊代表的是一种如今已经几乎从华盛顿消失的政治气质：不信任银行家、蔑视东海岸精英、强调普通白人公民的政治权利，并坚信行政首脑在危机中必须敢于直接行动。政府将重新强调杰克逊时代的政治遗产，把反金融寡头、地方自治和强势领导塑造成同一传统的不同面向。纪念活动、演说和官方宣传将提醒民众，美国并不是由官僚与北方银行建立的，而是由愿意拿枪保卫土地、社区与共和国的人所维系。"
 USA_The_powers_due_to_the_governor:0 "州长应得之权"
 USA_The_powers_due_to_the_governor_desc:0 "过去几十年中，联邦政府逐渐把越来越多原本属于各州的事务纳入华盛顿控制。经济危机更成为扩大中央权限的借口，从劳动法规到农业政策，从公共工程到治安问题，州政府常常只能被动执行来自首都的命令。默里认为，这种趋势不仅违背美国联邦制传统，也让国家变得更加脆弱。地方危机最了解情况的是州长，而不是几百英里外的联邦官僚。政府将扩大州长在治安、经济管制和国民警卫队调动方面的自由裁量权，并减少部分联邦机关对地方事务的干预。"
 USA_Revive_traditionalism:0 "传统主义仍存"
 USA_Revive_traditionalism_desc:0 "现代美国似乎正在以惊人的速度同过去割裂。城市化、激进工会、大众文化、联邦官僚和各种社会改革不断改变地方社区原有的秩序。默里及其盟友相信，正是这种无休止的“进步”让国家失去了维系社会稳定的传统基础。政府将更公开地支持教会、家庭、地方社团与传统教育，并鼓励州政府抵制那些被视为从北方强加而来的社会实验。学校课程将重新强调美国历史、宗教道德与公民责任，地方警察和社区组织也会获得更大权力维持传统社会规范。"
 USA_The_return_of_spirit_of_confederation:0 "邦联精神的回归"
 USA_The_return_of_spirit_of_confederation_desc:0 "七十多年前，美利坚曾因联邦权力、地方主权与南方社会秩序的问题撕裂成两半。邦联最终败亡，但围绕州权、地方自治和南方身份认同的政治传统并未随阿波马托克斯的枪声一同消失。默里政府并不需要公开恢复昔日邦联，也无需重新举起那面已经成为历史的国旗。它所需要的是唤醒其中更具政治利用价值的遗产：各州应有权抵抗过度扩张的中央政府，地方社会不应被遥远首都任意改造，而南方也不该永远只是全国政治中被要求服从的一方。"
 USA_Mobilize_all_available_troops:0 "动员一切可用之军"
 USA_Mobilize_all_available_troops_desc:0 "国家已经没有余裕继续区分什么是“常规治安力量”、什么是“临时辅助部队”。联邦军、国民警卫队、海军陆战队、边境巡逻力量和一切仍愿意听从华盛顿指挥的武装都必须立即进入战备状态。在总统的最高指令下，军械库将被打开，预备役人员得到召集，重要铁路和公路由军方接管。各级司令部被要求重新核实部队忠诚度，并把所有可能不服从命令的单位调离关键地区。这样的动员本身就会进一步刺激各派，因为任何地方势力都很容易把联邦军集结理解成战争准备。可对白宫而言，这些顾虑已经不应在被考虑。" 
 USA_Shut_up_the_chattering_Congress:0 "让喋喋不休的国会闭嘴"
 USA_Shut_up_the_chattering_Congress_desc:0 "当街头冲突、经济崩溃与地方抗命不断升级时，国会仍然能够为了程序、委员会和党派利益争吵数日。在总统的看法中，白宫不能再等待国会同意。行政命令与紧急权限将被更广泛地使用，愿意合作的议员仍可参与政府事务，而那些只会拖延的人，就继续在会议厅里说个不停吧——政府已经不会再等他们了。"
 USA_Make_sure_Northeast_under_control:0 "东北方尽在掌握"
 USA_Make_sure_Northeast_under_control_desc:0 "东北部掌握着纽约金融中心、新英格兰港口、铁路枢纽与大片工业区，是联邦绝不能失去的命脉。然而地方精英对华盛顿愈发不信任，新英格兰部分势力甚至开始寻求独立于中央的安全安排。联邦政府将加强对铁路、港口、军械库和通信设施的控制，并要求各州政府明确立场。无论白宫由谁掌握，都不会容忍美国最重要的经济与交通中心在危机中自行其是。东北方必须牢牢掌握在手中。"
 USA_Shock_the_world:0 "震惊世界"
 USA_Shock_the_world_desc:0 "比尔·海伍德入主白宫后，美国正在以惊人的速度改变。社会党民兵获得合法地位，金融寡头遭到调查，政府也越来越公开地把国内变革同世界工人运动联系起来。芝加哥和纽约的左翼报纸欢呼新时代的到来，欧洲的工团主义者则把美国视为可能改变全球力量平衡的新中心。与此同时，国内保守势力的恐惧也已经达到顶点。州政府拒绝执行命令，资本外逃，军方内部开始讨论忠诚问题，国会也濒临停摆。"
 USA_ORDER_WE_NEED_ORDER:0 "秩序得胜"
 USA_ORDER_WE_NEED_ORDER_desc:0 "麦克阿瑟已经不再相信普通政治程序能够挽救眼前的局势。地方政府公开抗命，私人武装不断扩张，铁路、军械库与通信设施都可能在一夜之间脱离联邦控制。对总统而言，共和国首先必须活下来，之后才有资格继续争论程序与党派利益。军队因此被更深地投入国内秩序维护之中，可靠部队控制战略设施，拒绝解除武装的组织将被视为潜在叛乱者。批评者称这正在把美国变成一座军营，但麦克阿瑟的回答很简单：若混乱与秩序只能留下一个，那么秩序必须得胜。"
#避免内战总统
USA_it_begins:0 "挽救美利坚从此开始"
 USA_it_begins_desc:0 "随着1936大选的落幕，美国已经确定了未来四年的领导人。然而，政治风暴与社会混乱仍然没有停歇的迹象。摆在新总统面前的，是一个处在水深火热之中的混乱国度。"
 USA_President_Garner_1936:0 "仙人掌杰克的胜利"
 USA_President_Garner_1936_desc:0 "传统的民主党人在约翰·南斯·加纳的领导下击败了诸多竞争对手，再次入主白宫。新总统的团队承诺将稳定局势，同时抵制激进分子企图改变合众国的要求。尽管不同属一个党派，但前总统还是向加纳总统表示了祝福，希望他们能够尽快稳定住局势。现在，民主党人将不惜一切代价捍卫宪法和自由了！"
 USA_Support_our_farmer:0 "对农民口惠而实至"
 USA_Support_our_farmer_desc:0 "长期以来农民一直倾向于民主党，其原因是他们反对共和党保护主义的政策，这种政策加大了他们出口自己农产品的难度。尽管目前他们中的许多人已经选择支持美利坚至上党或是旧民主党，甚至是社会主义者，但我们必须保住自己为数不多的忠实基本盘。虽然我们普遍反对政府对经济的大规模干预，但支持乡村经济是明摆着要做的事。政府将从苦苦挣扎的农民那里统一购买商品，并提供比过去稍高的价钱以确保不会再有更多破产。与此同同时，政府将提供国家资金，并通过引入和更新电力网来支持发展中的农村地区，使他们进入电气化与现代化的快车道。"
 USA_Fiscal_austerity_policy:0 "在金融风暴中撑起紧缩之伞"
 USA_Fiscal_austerity_policy_desc:0 "在进行竞选活动时，加纳总统与他的团队就将“紧缩财政”作为吸引支持的口号。总统认为，金融危机的一大根源就是过去共和党政府过度的开支。因此，新政府必须削减我们的预算，并向企业与我们的选民表示，总统与他的政府正在担起维持金融健康的责任，对并国家财政负责。现在，摆在总统与他的幕僚们面前的是一连串的问题：从那些行业里砍出多余的资金，又或者从哪些不必要的开支中获得盈余？"
 USA_no_place_for_extremists:0 "无极端分子容身之地"
 USA_no_place_for_extremists_desc:0 "约翰·南斯·加纳总统在就职演说中向公众明确表示，美国的民主制度不容任何极端主义势力染指，而新一任的联邦政府将会以一切手段来对抗任何有可能摧毁民主制度的威胁。眼下，无论是披着工人外衣的激进革命者，还是打着民族主义旗号的准军事组织，又或者是看似忠心耿耿的军队，都在缓慢侵蚀共和国的根基。从现在开始，联邦政府能够依靠的只有法律，权威与至少现在忠心的陆军。为了彻底清除政治暴力的威胁，如今政府的第一件事就是对激进分子大力出拳。"
 USA_Beheading_the_southern_dragon:0 "斩首南方巨龙"
 USA_Beheading_the_southern_dragon_desc:0 "长期以来，南方的极端分子，旧民主党人、极端民粹主义者与诸如黑色军团这样的准军事团体相互勾连，如同一堵密不透风的土墙，将联邦政府一切平定南方的努力挡在外面。为了彻底瓦解旧民主党的势力，加纳决心从3k党这条“南方巨龙”入手，将3k党的大巫师与大龙们通过各种手段来送进监狱交由法律审判，进而一步步肢解旧民主党的势力。"
 USA_Strike_the_heart_of_anarchism:0 "猛击无政府主义之心"
 USA_Strike_the_heart_of_anarchism_desc:0 "在港口城市与重工业中心，尤其是社会党的老巢——钢带区，无政府主义者及其附属激进工会组织正在借助经济困境与失业浪潮煽动大规模罢工与暴力示威。他们公开鼓吹摧毁国家机器，否认任何形式的合法权威，将社会动荡视为摧毁美国秩序的绝佳机会。事实证明，对此类势力的纵容只会不断削弱政府的治理能力，并将工业体系拖入长期瘫痪。\n\n联邦政府将授权执法机构对社会党的组织系统展开系统性打击，重点摧毁其组织中枢、宣传渠道与资金来源。同时，在维持基本劳工权利的前提下，政府将与温和工会展开合作，确保工业生产与交通运输能够置于联邦掌控下。"
 USA_Control_the_army:0 "驾驭脱缰野马"
 USA_Control_the_army_desc:0 "长时间的政治混乱，使军队在如今的情况下已经拥有了过去不曾获得的强大职能。以总参谋长麦克阿瑟为首的激进派军人开始依靠紧急权力为自己谋取更多利益与权势，以保障自身影响力。对于这个与休伊·朗齐名的“对美国民主威胁最大的人”，加纳总统必须着手限制麦克阿瑟与军队的影响力，确保他们始终是政府的好打手，好忠犬，而非一条饥肠辘辘，虎视眈眈的噬主恶犬。"
 USA_End_chaos_in_Great_Lakes_Region:0 "终结钢带混乱"
 USA_End_chaos_in_Great_Lakes_Region_desc:0 "五大湖工业区作为美国最重要的工业腹地，其长期动荡不仅削弱了国家的工业潜力，也动摇了全国经济复苏的根基。黑帮、激进工会与州政府之间的冲突，使得美国的工业心脏逐渐演变为事实上的无序地带，而这一切社会党自然难逃其咎。联邦政府将通过强化联邦治安力量、恢复交通与工业基础设施运转，并尝试与温和工会结盟，逐步终结该地区的混乱状态。而至于不愿合作的激进分子，等待他们的除了法律审判就是子弹。"
 USA_Unearth_the_wealth_of_the_countryside:0 "发掘乡村的财富"
 USA_Unearth_the_wealth_of_the_countryside_desc:0 "长期以来，国家发展战略过度倾向于城市工业与沿海经济，使广大内陆乡村地区在基础设施、信贷体系与技术投入方面长期处于劣势。这种结构性失衡不仅限制了农业产能的提升，也加剧了城乡之间的政治疏离感，使乡村地区更易受到例如民粹主义等激进思潮的渗透。为了压制休伊·朗的至上党在农民中的影响力，同时也为了争取农民选民的支持，唤醒乡村潜在的经济活力将是新政府的首要目标。通过改善农村交通网络、推动农业机械化，并引导有限的国家资金进入农业与乡村相关产业，联邦政府将逐步把乡村地区重新纳入国家经济循环之中。"
 USA_Re_plan_the_finances:0 "重新规划财政"
 USA_Re_plan_the_finances_desc:0 "长期的萧条与财政失序，使联邦预算结构趋于畸形，债务负担沉重，税收体系效率低下。同时，长时间的社会混乱与经济低迷导致金融市场对政府偿付能力的信心持续走低，进而导致资本外流与通货膨胀风险不断累积。为了解决这一难题，政府将着手重构联邦财政框架。通过削减低效开支、整合财政机构，裁撤非必要机构与人员等一系列的紧缩措施，政府希望能够尽快纠正如今的财政危机，以更好地打击激进势力。"
 USA_Business_and_newspaper_tycoons:0 "商业界与报业大亨"
 USA_Business_and_newspaper_tycoons_desc:0 "如今，在政治混乱的漩涡中，传统政治机器已难以单独承担宣传与拉拢选民之重任。大企业集团、金融寡头与报业大亨在资本、舆论与组织能力上的影响力，使其成为任何政府都无法忽视的力量。加纳总统深知，与这些精英阶层保持务实合作，虽可能进一步引发以休伊·朗为首的民粹派的不满，却是稳定时局的现实选择。威廉·伦道夫·赫斯特，这位不择手段的古怪报业大亨最近开始尝试与政府接触，暗示他愿意带着他的黄色新闻为政府工作。作为回报，他希望政府解除过去对他进行的一系列打压，同时吸纳他进入民主党甚至加纳政府的核心圈子。"
 USA_conservative_new_deal:0 "保守新政"
 USA_conservative_new_deal_desc:0 "威尔逊时代的“新政”尽管为国家带来了一定的繁荣，却也为之后十年的衰落乃至萧条埋下了隐患。而如今，改革乃至新的“新政”已经迫在眉睫，但加纳并不打算为了经济而简单回到完全放任自流的旧自由主义时代。作为一名标准的保守主义者，他同样警惕无限扩张的官僚体系与过度福利化对市场活力的侵蚀。政府将在接下来逐步开展“保守新政”，在维持必要社会保障与公共工程的同时，重新强调财政纪律与私人资本的主导地位。政府将逐步缩减低效项目，转而通过税收激励与有限监管，引导企业投资与就业增长，使经济复苏重新建立在市场与国家之间更为平衡的关系之上。"
 USA_Lead_the_conservative_Democrats:0 "引领保守民主党人"
 USA_Lead_the_conservative_Democrats_desc:0 "在过去的政治混乱中，民主党旧有的政治架构几乎被极端主义冲击的七零八落。大量的右派民主党人投入了美利坚至上党与旧民主党的怀抱，而人道主义者则选择押宝进步党。如今，加纳总统将确立民主党新的纲领，即有别于传统的自由主义与旧民主党的农业主义和杰克逊主义的独特的美式保守主义。如今的民主党尽管遭到了削弱，但已经更加团结。"
 USA_Build_the_concept_of_New_South:0 "构建“新南方”理念"
 USA_Build_the_concept_of_New_South_desc:0 "自内战中南方被战火彻底摧毁，这片大地就一直显著的在发展上落后于北方。重建时期的混乱与极端主义的死灰复燃更是将南方崛起的进程大大拖延。长期以来，部分南方州就被视为落后、保守与贫困的象征，而大萧条更是加剧了这一地区与全国其他部分之间的差距。若任由南方就此发展停滞，它们不仅难以融入国家经济循环，也将持续成为极端主义滋生的温床。联邦政府认为，单纯依靠武力与行政手段无法根本解决南方问题，必须从理念与发展路径上重塑这一地区的未来。\n\n“新南方”理念旨在打破对南方的刻板印象，通过引入工业投资、改善基础设施与扩大教育资源，使这一地区逐步摆脱对农业经济的依赖。联邦政府将鼓励企业进入南方设厂，同时推动温和改革派地方精英参与治理，以塑造一个更加融入国家体系、对联邦秩序保持认同的南方社会。"
 USA_Tough_cactus_Jack:0 "坚韧的仙人掌杰克"
 USA_Tough_cactus_Jack_desc:0 "“仙人掌杰克”这一绰号，源于加纳在国会中以顽强、固执与善于斡旋而闻名的政治风格。面对派系林立、矛盾尖锐的美国政坛，他所代表的并非进步党或是激进派那些激进改革的浪漫想象，而是一种依靠耐心、妥协与政治手腕维系国家运转的现实主义路径。许多人讥讽这种风格过于保守，但也正是这种在风暴中不轻易折断的韧性，使他得以在危机之中稳住局面。\n\n加纳总统将继续发挥其在国会与各州精英之间积累多年的人脉与威望，通过艰难而缓慢的谈判，逐步弥合所有党派的裂痕，并推动必要立法的通过，使用法律与政治手段维护民主制度。或许这条道路无法带来令所有人都满意的发展，但在如今的环境中，保守也不失为一种进步。"
 USA_President_Norris_1936:0 "奋战的自由派"
 USA_President_Norris_1936_desc:0 "虽然困难重重，诺里斯总统还是成功当选了美利坚第31任总统。作为美国仅存的少数进步人士之一，诺里斯凭借公平施政政策，将美国公众从战争中拯救出来，并最终实现美国民主的目标纲领赢得了胜利。这是所有美国人的真理，不管他们的信仰是什么。尽管还有很多事情要做并且机会渺茫，但诺里斯仍将拯救美国。"
 USA_Emphasize_the_progressive_stance:0 "强调进步派立场"
 USA_Emphasize_the_progressive_stance_desc:0 "在美利坚，进步主义一词的由来源远流长，而其最广为人所接受的时代则是西奥多·罗斯福总统时期。而如今，在这样一个萧条而不安的时代，进步主义的火光也显得尤为可贵。总统与他的内阁们将在公众面前更多的宣传如今政府的进步主义立场，以让所有爱国的美利坚民众们追忆起过去的进步时光，并相信新政府将带领整个美国走出深渊，迈向更好的将来。"
 USA_The_intervening_hand_of_the_state:0 "国家的干预之手"
 USA_The_intervening_hand_of_the_state_desc:0 "黑色星期一彻底击碎了关于市场自我修复的幻觉。大规模失业、银行倒闭与工业停摆，使得国家若继续扮演旁观者，等同于默许社会结构的全面瓦解。诺里斯总统在就职演讲中向公众宣告，政府的职责不仅是维持秩序，更应在危机时刻主动承担重建经济的责任。通过公共投资、产业协调与金融监管，国家将第一次以系统性的方式介入经济运行，直到经济重新振作。"
 USA_The_final_battle_against_the_Ku_Klux_Klan:0 "对3k党的最终之战"
 USA_The_final_battle_against_the_Ku_Klux_Klan_desc:0 "长期以来，3K党在南方与部分中西部地区游走于法律边缘，以恐吓、私刑与秘密结社的方式破坏联邦权威。经济危机为这些极端主义组织提供了新的土壤，使其借助社会不安扩大影响。如今，这群恐怖的白面罩已经几乎统治了整个深南地区，并与旧民主党那些政治恐怖分子同流合污。联邦政府将在全国范围宣布3k党为非法恐怖主义结社，并动员全国的行政力量全面打击。"
 USA_Deal_with_populist_agitators:0 "处理民粹煽动者"
 USA_Deal_with_populist_agitators_desc:0 "危机之中，各类民粹领袖以简单化的口号承诺立竿见影的解决方案，将公众的不满引向对制度本身的否定。无论是休伊·朗，或是威廉·默里，又或者是海伍德，都在借助易被煽动的民众别有用心的攻击着政府。诺里斯并不否认民众愤怒的正当性，但拒绝将国家的未来交给如此的个人崇拜与暗藏祸心政治煽动。通过规范集会、打击暴力动员，并同时扩大合法政治参与渠道，政府将试图遏制激进党派将民众带入极端化的不归路中。"
 USA_Jefferson_concept_of_land_rights:0 "杰斐逊的地权理念"
 USA_Jefferson_concept_of_land_rights_desc:0 "在经济重建的讨论中，进步派重新援引了杰斐逊关于土地与公民自由的理念：广泛而稳定的土地占有，才是民主社会持久的物质基础。面对农村债务危机与土地集中趋势，政府计划推动土地改革与农业信贷体系的重组，以保障小农与家庭农场免于被金融资本彻底吞噬。通过恢复农村地区的经济活力，诺里斯希望从根基上重建共和国的社会稳定，而不仅仅是在城市中进行短期纾困。"
 USA_Stabilize_the_south:0 "安定南方"
 USA_Stabilize_the_south_desc:0 "南方既是内战后政治整合最薄弱的地区，也是种族紧张与经济落后的交汇点。单纯依靠地方妥协已无法应对危机时期不断激化的矛盾。诺里斯政府主张以联邦层面的社会投资、基础设施建设与法治重申，逐步削弱地方极端势力的影响，并为南方提供切实可见的经济复苏前景。联邦政府将尽一切努力把南方真正重新纳入全国政治与经济秩序之中。"
 USA_no_place_for_selfless_punishment:0 "美好国家无私刑容身之地"
 USA_no_place_for_selfless_punishment_desc:0 "私刑与民间暴力长期以来被部分地区默许，甚至被包装为‘维护地方秩序’的工具。然而在进步主义者们看来，这种做法不仅破坏法治，更侵蚀共和国赖以存在的道德基础。联邦政府将加强对地方执法的监督，追究纵容私刑行为的县乃至州政府责任，并通过立法明确界定暴力行为的不可容忍性。"
 USA_The_conception_of_Masle_Sholes:0 "重提田纳西的构想"
 USA_The_conception_of_Masle_Sholes_desc:0 "诺里斯总统始终抱有为联邦建立一个统一的电力管理系统的构想：在20年代，他就曾两次向国会提交了名为马斯尔肖尔斯法案的建立电力系统的法案，但均被总统否决。在1932年，当时还是参议员的诺里斯总统又向国会提出了一项法案，即成立田纳西河谷管理局，以为田纳西州河谷地区的农民们提供电力服务与提高生活质量。然而不出意外这项法案再次被当政的胡佛政府否决。\n\n现在，为了继续美利坚电气化的构想，总统重新将田纳西河谷法案提上日程，并准备作为新政府电气化新政的试点在田纳西州展开。如果一切顺利，政府就将进一步推动美国乡村地区的彻底电气化。"
 USA_A_supporter_of_Georgianism:0 "乔治主义的拥趸"
 USA_A_supporter_of_Georgianism_desc:0 "在关于土地、资本与不平等的争论中，诺里斯总统公开表达了对乔治主义理念的认同。进步派认为，土地与自然资源所带来的不劳而获的收益，不应成为少数人的特权，而应通过公共财政回馈整个社会。通过土地税制改革与对投机行为的限制，政府将会试图削弱金融与地产资本在社会中的过度影响。"
 USA_Workers_should_speak_out:0 "劳工理应发声"
 USA_Workers_should_speak_out_desc:0 "在长期的工业扩张过程中，工人的声音往往被淹没在资本与政治精英的合谋之中。诺里斯政府明确承认，经济秩序的稳定不能以压制劳工权利为代价。通过保障工会活动的合法性、扩大集体谈判的空间，并鼓励工人参与地方与联邦层面的政策讨论，政府希望将劳工重新纳入民主政治的正当主体之列。这不仅是对社会进步的追求，也是防止工人阶层被例如社会党等激进政治势力进一步蛊惑的必要前提。"
 USA_Promote_the_Laguardia_Act:0 "让黄狗合同退场！"
 USA_Promote_the_Laguardia_Act_desc:0 "长期以来，‘黄狗合同’作为雇佣关系中的不平等工具，迫使工人放弃组织工会的权利，以换取脆弱而不稳定的就业机会。进步党联合纽约市长拉瓜迪亚向国会提交法案，旨在彻底废除黄狗合同，而意味着联邦政府首次明确站在劳动者一侧，否认这种契约形式的合法性。诺里斯政府将这一立法视为重建劳资关系的关键一步，通过削弱大企业与集团对劳动者的制度性压制，为工业建设引入最低限度的公平，尊严与权利保障。"
 USA_Universal_suffrage_rather_than_the_Electoral_College:0 "普选而非选举人团"
 USA_Universal_suffrage_rather_than_the_Electoral_College_desc:0 "危机动摇了公众对传统政治机制的信任，而选举人团制度所造成的代表失衡问题再次成为舆论焦点。进步派主张，国家领导人的合法性应当直接源于公民的普遍意志，而非复杂且易被地方精英操纵的间接机制。因此诺里斯政府将逐步改革如今已经腐朽的选举人团制度，并最终以真正民主的普选制取而代之。"
 USA_Model_legislative_body:0 "模范立法机关"
 USA_Model_legislative_body_desc:0 "在频繁的政治僵局与党派对立中，国会逐渐被视为低效与失灵的象征。诺里斯政府试图通过程序改革、提高透明度以及限制地下交易的影响，重塑立法机关作为公共利益代表的形象。打造一个‘模范立法机关’，不仅是提升行政效率的技术性目标，更是联邦政府向社会证明，民主制度仍具备自我纠错与自我更新的能力的绝好时机。"
 USA_The_perfect_knight_of_progressive_ideals:0 "进步理想的完美骑士"
 USA_The_perfect_knight_of_progressive_ideals_desc:0 "在支持者的描绘中，诺里斯被塑造成进步主义理想的象征人物——一位试图在资本、民粹与极端主义夹击之中，为共和国开辟中间道路的政治家。这种近乎理想化的形象，既为政府争取了广泛的道义支持，也带来了更高的期待与更严苛的审视。所有的目光如今都聚集在白宫这位进步主义者身上，等待着他能否将美利坚引领向新的高度。"
 USA_President_Curtis_1936:0 "久经沙场的长者"
 USA_President_Curtis_1936_desc:0 "在国家动荡与政治对立加剧的年代，选民选择了一位历经风雨的老政治家。查尔斯·柯蒂斯并非新锐改革者，而是熟悉国会规则与党派妥协艺术的资深人物。作为参议院的前领袖，他深知制度如何运作，也明白冲突如何被缓解。对许多人而言，他象征着回归传统政治智慧，而非继续在极端之间摇摆。"
 USA_President_Landon_1936:0 "胜任总统之人"
 USA_President_Landon_1936_desc:0 "在经历了动荡与极端主义高涨的年代后，美国选民选择了一位被广泛视为冷静、务实且具备行政经验的人物。阿尔夫·兰登并非煽动型领袖，也不是意识形态的旗手，他的胜利更多源于公众对稳定与理性的渴望。对许多人而言，兰登总统寄托了他们对稳定与复兴的渴望。"
 USA_middle_way_leads_to_victory:0 "中道为胜"
 USA_middle_way_leads_to_victory_desc:0 "对于共和党的建制派们来说，国家的未来不在于向左或向右的急转，而在于稳步前行。既不过度扩张国家机器，也不完全放任市场失序，中间道路正是共和党人执政理念的核心。通过在经济干预与财政纪律之间寻找平衡，政府试图证明，折中与妥协并非软弱，而是一种成熟民主的必然环节。"
 USA_Put_an_end_to_anti-government_organizations:0 "终结反政府组织"
 USA_Put_an_end_to_anti-government_organizations_desc:0 "无论是极端民族主义团体还是激进社会主义组织，任何以暴力或颠覆为手段的政治力量，都被视为对共和国的威胁。共和党政府强调在宪法框架内打击这些组织，既要维护国家安全，也必须避免任何可能的机构或团体借此机会聚敛权力，进而成为对政治稳定的新威胁。"
 USA_Encourage_private_enterprises_to_thrive:0 "鼓励私人企业蓬勃发展"
 USA_Encourage_private_enterprises_to_thrive_desc:0 "经济复苏的真正动力，应当来自企业与个人的创造力。共和党政府主张通过减轻监管负担、优化税收结构与恢复市场信心，激活私人部门的活力。联邦政府将发挥引导作用，但不会取代市场本身。这是一种对竞争的市场作用的信任，也是对美国传统经济理念的延续。"
 USA_Win_over_moderate_trade_unions:0 "拉拢温和工会"
 USA_Win_over_moderate_trade_unions_desc:0 "共和党政并未将工会视为天然对立面，而是尝试与温和派劳工组织建立对话机制。通过承认合理的集体谈判权利，同时防止极端主义渗透工会运动，政府希望构建一种更加稳定的劳资关系。合作而非对抗，成为这一阶段劳工政策的主旋律。"
 USA_Dismember_racial_segregation:0 "肢解种族隔离"
 USA_Dismember_racial_segregation_desc:0 "种族隔离制度长期以来削弱了国家的道德基础。兰登政府虽避免激进立法冲突，但开始通过司法支持与联邦项目条件限制，逐步削弱制度性隔离的合法性。这种渐进式改革或许缓慢，却意在避免社会撕裂的进一步扩大。但对于诸如旧民主党或3k党等支持种族主义的激进团体，联邦政府将不惜一切代价打击。"
 USA_The_necessity_of_balancing_the_budget:0 "平衡预算之必要"
 USA_The_necessity_of_balancing_the_budget_desc:0 "持续的赤字不仅威胁经济稳定，也削弱政府公信力。兰登强调财政纪律的重要性，认为只有恢复预算平衡，才能为长期繁荣奠定基础。即便在推动必要改革的同时，政府仍需谨慎控制支出，以免复苏建立在不可持续的债务之上。"
 USA_The_Landon_Project:0 "兰登计划"
 USA_The_Landon_Project_desc:0 "在深思熟虑后，兰登政府向国会递交了一系列的经济法案，并这一连串的经济复苏计划将被统称为兰登计划。这一计划旨在通过更改关税来刺激衰弱的美国经济，以期缓解政府的财政压力，也为了进一步遏制激进分子拉拢人心。"
 USA_Freedom_of_speech_leads_to_civil_freedom:0 "言论自由来带公民自由"
 USA_Freedom_of_speech_leads_to_civil_freedom_desc:0 "在一个经历政治动荡的时代，维护言论自由显得尤为重要。兰登认为，压制表达只会让不满在地下积聚。通过保护合法政治表达，政府希望让分歧在制度内解决，而非在街头爆发。但对于任何不实的宣传与批评，或者是激进势力妄图借助言论自由散步煽动宣传的尝试，政府都将出面加以打击。自由并非软弱，而是民主的基石。"
 USA_Pragmatic_political_philosophy:0 "务实政治哲学"
 USA_Pragmatic_political_philosophy_desc:0 "兰登的执政理念并不追求宏大的意识形态宣言，而是强调实际效果与制度稳定。政策是否成功，应以社会稳定与经济增长为衡量标准，而非党派胜利。在兰登与他的心腹和内阁成员们的努力下，务实成为这一届政府最鲜明的标签。"
 USA_Unity_and_Change:0 "团结与变革"
 USA_Unity_and_Change_desc:0 "兰登试图证明，团结并不意味着停滞，变革也不必以撕裂为代价。通过跨党派合作与渐进式改革，他希望在不推翻现有制度的情况下完成必要调整。这是一条艰难的道路，却可能是避免国家再次陷入极端对抗的唯一选择。"
 USA_The_leader_of_the_country:0 "国家的引领者"
 USA_The_leader_of_the_country_desc:0 "兰登并非最耀眼的政治人物，但在一个渴望稳定的时代，他成为了国家的引领者。他的领导方式低调而谨慎，强调制度而非个人崇拜。或许历史不会将他视为革命者，但若共和国得以平稳过渡，他的价值便已得到证明。"
 USA_Shorten_working_hours_while_maintaining_wages:0 "缩短工时，维持工资"
 USA_Shorten_working_hours_while_maintaining_wages_desc:0 "在失业率高企与社会不满扩散的背景下，柯蒂斯政府提出通过缩短法定工作时长来扩大就业机会，同时维持基本工资水平。这一政策试图在保护企业利润与改善劳工处境之间寻找折中方案。既避免激进的全面再分配，也不放任市场自行调节，政府希望通过温和立法缓解社会压力。"
 USA_Pursue_equal_rights:0 "追求平等权利"
 USA_Pursue_equal_rights_desc:0 "身为具有原住民血统的总统，柯蒂斯对平等议题有着个人层面的理解。他主张在不撕裂社会的前提下推进公民权利保障，通过司法支持与有限联邦干预削弱制度性歧视。虽然这不是一场激进运动，但却是一种象征性的姿态：共和国的理想应当对所有公民开放。"
 USA_Work_Sharing_plan:0 "工作分担计划"
 USA_Work_Sharing_plan_desc:0 "我们的经济学家在经过一系列的深思熟虑后，终于提出了一项足以改变如今就业颓势的改革方案——工作分担计划。这项计划的核心理念十分简单，却极具创新：与其让数以百万计的美国工人失业、让家庭破碎、让企业毫无选择地裁减员工，不如让每一位工人仅减少部分工作时间，并由政府提供相应的失业补贴以填补工资缺口。通过这种方式，企业不必大量裁员就能缩减预算，而工人们也能保住他们的工作、尊严与未来。同时，政府将鼓励并补贴企业为这些“部分就业”的工人提供技能再培训课程，以确保在经济复苏来临时，他们不仅能够即刻重返岗位，更能以更高的水平与生产力迎接复苏后的经济。\n\n这一计划可以在不让政府背负沉重债务的情况下维持就业稳定，避免社会动荡，同时还为数百万工人创造了一条体面而可持续的生计路径。"
 USA_War_on_alcohol:0 "对酒精开战"
 USA_War_on_alcohol_desc:0 "在社会动荡时期，道德秩序被视为稳定的基石。柯蒂斯政府重新强调节制与公共道德的重要性，通过强化执法与限制非法酒精贸易来整顿社会风气。尽管禁酒令不受欢迎，但由于对酗酒与地下市场的整治被视为恢复社区秩序的必要步骤，柯蒂斯政府还是选择保留并简单修订禁酒令法案。"
 USA_Adjustment_of_Tariff_Act:0 "调整关税法案"
 USA_Adjustment_of_Tariff_Act_desc:0 "面对国际贸易萎缩与国内工业压力，政府决定重新审视关税政策。柯蒂斯并不主张完全封闭市场，也不支持毫无保护的自由贸易，而是寻求在保护本国产业与恢复国际往来之间找到平衡点。关税调整被视为技术性改革，但其背后关系着美国在全球经济中的定位。"
 USA_Protect_people_of_color:0 "保护土著社区"
 USA_Protect_people_of_color_desc:0 "长期以来，土著社区在政策制定中缺乏声音。柯蒂斯政府推动对原住民土地权益与自治权的有限保障，试图纠正历史遗留的不公。这种改革并不彻底，却为联邦政府与少数族群之间建立新的信任关系提供了契机。"
 USA_good_times_are_just_around_the_corner:0 "好时光就在眼前！"
 USA_good_times_are_just_around_the_corner_desc:0 "面对经济困境与社会焦虑，柯蒂斯以乐观而稳重的语气向全国发表讲话。他强调，美国曾经历更严重的危机，却始终走向复苏。通过渐进改革与政治妥协，国家正在一步步恢复活力。柯蒂斯政府在36年竞选中的宣传语，“好时光就在眼前！”，既是对经济指标的期待，也是对公众信心的呼唤。而如今，这个口号即将成真。"
 USA_President_Hoover_1936:0 "再干四年！"
 USA_President_Hoover_1936_desc:0 "尽管困难重重，但由于众议院共和党和民主党议员的支持，胡佛反败为胜，将开始他的第三个美国总统任期。但现在，胡佛统治着一个被他的胜利激怒的国家，这个国家就像一个随时准备爆炸的火药桶一般。一个小小的错误都可能导致联邦的终结。"
 USA_A_failed_humanitarian:0 "失败的人道主义者..."
 USA_A_failed_humanitarian_desc:0 "胡佛曾以人道主义者的名声闻名于世，从欧洲战后救济到国内赈灾，他始终相信理性与善意足以弥合社会裂痕。然而，大萧条黑色星期一之后的现实却无情地撕碎了这种信念。失业者的怒火、农场主的绝望与城市工人的激进化，使得胡佛过去积累的政治声望一坠千里，而他本人也被成为“失败的人道主义者”。为了挽救自己的名声与美国的命运，赫伯特·胡佛必须有所行动..."
 USA_Embrace_Knox_Economics:0 "弗兰克·诺克斯的蓝图"
 USA_Embrace_Knox_Economics_desc:0 "弗兰克·诺克斯在担任芝加哥《每日新闻》的编辑期间，曾批评过胡佛政府浪费政府开支以及全国各地激进派提出的计划。现在，副总统诺克斯已经掌管胡佛政府的经济政策，他的重点是平衡联邦预算，同时减轻个人和企业的“过度税收负担”。"
 USA_Necessary_relief:0 "重拾救济本职工作"
 USA_Necessary_relief_desc:0 "尽管副总统诺克斯主张紧缩与预算平衡，况且联邦的财政也不支持大规模的广泛救济，但街头的现实已迫使政府重新考虑社会救济问题。在胡佛看来，若完全依赖地方政府与私人慈善机构，将无法遏制社会的不稳定。有限而有针对性的联邦救济计划被重新提上议程，旨在缓解最严重的失业与饥荒问题。由于过去赈济委员会的任职经历，这对于胡佛来说并不算一个困难的政治问题。如果赈济得当，如今困扰白宫的政治危机也将有所好转。"
 USA_The_true_savior_of_farmers:0 "真正的农民救主"
 USA_The_true_savior_of_farmers_desc:0 "中西部与南部的农业崩溃正在动摇共和党的传统票仓，大量的选民抛弃了建制党派转投美利坚至上党或旧民主党。胡佛政府决定加大对农业信贷、价格稳定与债务重组的干预力度，以证明联邦政府仍然是农村社会的可靠依靠。通过强化农业合作社与联邦支持机制，白宫试图夺回被民粹煽动者与激进派争夺的农村话语权。白宫将证明共和党不再只是城市工业资本的代表，而是愿意为家庭农场挺身而出的平民之友。"
 USA_Reverse_laissez_faire_policies:0 "扭转放任政策"
 USA_Reverse_laissez_faire_policies_desc:0 "现实的冲击迫使政府重新审视过去数年对市场自我调节的信任。虽然胡佛仍拒绝承认自由资本主义原则本身存在问题，但他开始接受一个更为务实的观点：国家必须在某些关键领域发挥更积极的作用。通过对银行体系进行监管、对关键产业提供协调支持，政府试图在不彻底颠覆旧秩序的前提下，为经济注入新的稳定因素。同时，复兴金融公司将在政府的指导下成立，以为那些破产或行将破产的个体企业提供必要的支援。"
 USA_A_loyal_guardian_of_democracy:0 "...民主的忠实守护者"
 USA_A_loyal_guardian_of_democracy_desc:0 "作为一名颇有资历的老共和党人，赫伯特·胡佛始终是坚定的建制派政客。他对一切可能威胁美国长久以来的民主制度的危险分子都深恶痛绝。如今美国即将在激进分子与煽动者的威胁下四分五裂，而胡佛也决定在必要时刻使用必要手段来维护宪政秩序。"
 USA_Nonamerican_Activities_Investigation_Committee:0 "非美活动调查委员会的责任"
 USA_Nonamerican_Activities_Investigation_Committee_desc:0 "在很长一段时间里，胡佛放任激进分子肆虐美国。然而，众议院的共和党人和民主党人已经受够了，在共和党人J·帕内尔·托马斯的领导和小马丁·迪斯等民主党人的支持下，他们已经采取了一些措施，开始调查他们和委员会认为的美国各地激进组织，比如社会党、旧民主党和至上党。托马斯的一些更为狂热的支持者们也呼吁对军队和好莱坞进行调查。"
 USA_The_Hoover_Raid:0 "胡佛突袭"
 USA_The_Hoover_Raid_desc:0 "在逐步渗透激进党派的组织后，白宫决定采取一次大规模的联邦执法行动。联邦调查人员与国民警卫队将被授权同时突袭数十个被怀疑与激进组织有关的据点。同时白宫已经整理出了所有对政治秩序有所威胁的人员名单，FBI与军队将昼夜不停的监控这些可疑分子。"
 USA_The_Choice_of_Unity:0 "危急时刻，团结之选"
 USA_The_Choice_of_Unity_desc:0 "面对愈发尖锐的政治对立，建制派联盟只得放下成见，以国家安全与社会稳定为最高优先事项，共同打击诸如社会党之类的反政府政党。胡佛总统已经获得进步党，共和党，民主党的一致支持，并在私下里得到了类似“紧急授权”的承诺。尽管完全的党派联盟是不切实际且难以维系的，但仍然能够为联邦政府与共和党的政策拉拢到更多支持者，而这对于胡佛总统来说就已经足够。"
 USA_Necessary_cross_border_authorization:0 "必要的越界授权"
 USA_Necessary_cross_border_authorization_desc:0 "随着部分州政府被指控与煽动分子同流合污，联邦政府开始寻求更广泛的执法授权。通过扩大联邦调查局与司法部的权限，华盛顿获得了跨州执行逮捕与调查的权力。而随着胡佛总统不断成功签署并推行更多法案，属于总统的“特别授权”已经越来越多，甚至隐隐超越了国会的权威。但总统在广播中始终声明，一切的紧急授权都将在情况尘埃落定后得到收回。"
 USA_Can_we_trust_you_herber:0 "赫伯，我们能相信你吗？"
 USA_Can_we_trust_you_herber_desc:0 "在过去的两个任期内，美国在胡佛的带领下遭到了前所未有的打击。尽管不应把一切责任都归咎于总统，但民众们仍旧难以对胡佛总统领导下的政府抱有更大的信心。好在，如今政治混乱已经成功得到遏制，美国的政治局势终于不再升温。而胡佛本人也因其处理时局的政治手腕而广受赞誉。现在，民众的目光都聚焦在了这位长者总统身上，期待他能够带领美国走向下一个辉煌时代。"
 USA_Nail_coffin_board_to_death_for_the_radicals:0 "对激进分子的最后一击"
 USA_Nail_coffin_board_to_death_for_the_radicals_desc:0 "在连续数月的调查与镇压之后，政府宣布已成功瓦解多个激进组织的核心结构，并将其领导人送上法庭。白宫对逐渐好转的政治局势感到振奋，而为了更快的结束激进政党的威胁，白宫决定加大对相关机构的拨款与授权，以期彻底的将激进党派送进美国历史的垃圾堆中。"
 USA_Douglas_and_his_boys:0 "民主的好看门狗"
 USA_Douglas_and_his_boys_desc:0 "在最混乱的时期，军队仍旧作为联邦政府的忠实护卫维持着全国的秩序，保卫摇摇欲坠的美国。毫无疑问，我们的棒小伙作为民主的守护者尽到了责任。然而，军方的领袖麦克阿瑟如今被调查出可能在1936年大选前后在私下与忠诚的下属们商讨过在“必要时刻”终结民主制度以防止激进党派与赤色分子颠覆国家。如果情报属实，我们则必须彻查军队。但如果激怒了军队，又会威胁到如今刚刚稳定的时局。"
 USA_Reconsider_the_gold_standard_system:0 "再度考量金本位制"
 USA_Reconsider_the_gold_standard_system_desc:0 "经济崩溃之后，围绕金本位制度的争论再度浮出水面。曾经被视为金融稳定象征的黄金锚，如今却被指责为束缚复苏的枷锁。胡佛政府并未急于彻底放弃这一传统，而是决定在稳定与灵活之间寻找平衡。若金本位可以被调整而非抛弃，或许它仍能成为重建秩序的工具，而不是阻碍。"
 USA_Defeat_poverty_for_the_second_time:0 "二度战胜贫困"
 USA_Defeat_poverty_for_the_second_time_desc:0 "胡佛早年的公共救济与战后人道主义行动曾为他赢得“贫困克星”的声誉。如今，他试图在国内重现这一形象。通过扩大就业计划、恢复地方信贷与支持小型企业，政府希望逐步压缩失业率，并削弱极端主义赖以生存的社会土壤。胡佛政府将尝试把美国的经济带回到威尔逊时代的高度，并在其上更进一步，确保贫困被赶出所有美国公民的家门。"
 USA_Expand_the_scope_of_public_works:0 "扩大公共工程范围"
 USA_Expand_the_scope_of_public_works_desc:0 "高速公路、桥梁、水坝与市政基础设施被视为刺激经济的关键抓手。不同于激进的新政式全面国家接管，胡佛政府希望与私人企业合作，通过联邦主导、地方配合的方式推动建设。实际上，公共工程既是就业工具，也是树立国民与国家自信的工具之一。钢铁与混凝土重新流动，将证明美国经济正在重新站稳脚跟。"
 USA_Approve_large_scale_repatriation:0 "批准大规模遣返"
 USA_Approve_large_scale_repatriation_desc:0 "在第二任期时，胡佛政府就尝试过将包括墨西哥裔与亚裔在内的移民大规模遣送出美国以争取更多的劳动力岗位给本国人民，但最终因各方阻力不了了之，而政府也被各路激进势力大肆攻击。如今，联邦政府的权威正处于前所未有的高峰，胡佛也准备将大规模遣送法案再度提上日程，以维护美国的纯净。"
 USA_The_Republican_Dynasty:0 "共和党王朝"
 USA_The_Republican_Dynasty_desc:0 "随着秩序恢复与经济逐步回暖，共和党内部开始酝酿一种新的政治叙事：连续三任的总统与国会主导权，象征着一个稳定时代的延续。在建制联盟的影响与总统的暗中引导下，大量的进步党与民主党选民被共和党吸引，如今共和党在政坛上毫无疑问已经占据了绝对的主导地位。"
 USA_The_Double_Eagle_Economic_Agreement:0 "双鹰经济协议"
 USA_The_Double_Eagle_Economic_Agreement_desc:0 "尽管德意志帝国在黑色星期一中大受打击，但其雄厚的工业底蕴与中欧同盟的广贸市场使他的经济复苏迅速且迅猛。为了更好的参与欧洲市场并促进经济流动，我们将尝试与德意志帝国这位欧洲霸主达成令双方都满意的经济协议，以获取更大的财富。"
 USA_The_financial_treasures_of_the_Old_World:0 "旧大陆之财"
 USA_The_financial_treasures_of_the_Old_World_desc:0 "欧洲的动荡与黑色星期一的余波为美国资本提供了新的机会。通过吸引海外资金回流与收购关键资产，华盛顿希望通过投资并购欧洲诸国的资产来尝试参与欧洲经济的复苏进程，并借机获得更大的经济利益。美元的稳定与美国市场的规模，不仅有助于欧洲经济的恢复，也将使美国迅速成为全球资本的避风港，为后续的经济腾飞积攒资本。"
 USA_Financial_recovery:0 "人人一口锅，锅里一只鸡！"
 USA_Financial_recovery_desc:0 "当就业回升、银行体系稳定、企业重新盈利时，政府将复苏描绘为全民共享的成果。“人人一口锅，锅里一只鸡”在过去成为胡佛政府的竞选口号，而惨淡的经济现实将这一口号变成了胡佛政府的耻辱。而如今，这个过去的政治承诺正在逐步变成现实，而经济的恢复带来了人民对政府的更强大的支持与信心。"
 USA_President_Hoover_will_always_lead_us:0 "胡佛总统永远引领我们！"
 USA_President_Hoover_will_always_lead_us_desc:0 "在支持者的眼中，胡佛从危机中的争议人物，转变为带领国家重返稳定与增长的领袖。围绕他的个人崇敬情绪正在升温，部分党内人士甚至将其塑造成‘风暴中的舵手’。尽管总统本人并未做出任何塑造个人崇拜的指示，但毫无疑问，他的政治形象已经与美国的复兴与崛起紧密相连。"
USA_election_PP_1940:0 "迎接进步主义信风"
  USA_election_PP_1940_desc:0 "经历经济危机、内战与长期的政治动荡之后，美国人民再次将目光投向了进步主义。无论是改革派共和党人、独立进步人士，还是支持社会改革的民主派，都相信共和国需要一次新的开始。公平竞争、廉洁政府、公共建设与社会进步将重新成为国家发展的方向。1940年的选举不仅意味着一次政党更替，更意味着进步时代再次吹响了属于自己的号角。"
  USA_President_Norris:0 "诺里斯总统任期"
  USA_President_Norris_desc:0 "在经历危机、分裂与内战之后，美国人民将国家托付给了乔治·W·诺里斯。这位来自内布拉斯加的老进步主义者并不迷信政党，也不崇拜资本，更不向任何利益集团低头。他始终相信，政府存在的意义不是替少数人谋利，而是保障每一位普通公民都能够享有公平的机会。新的政府不会用激进口号煽动群众，也不会以保守传统拒绝改革，而将以诚实、节俭与责任重建人民对于联邦政府的信任。"
  USA_ban_on_alcohol_again:0 "对酒精再度开战"
  USA_ban_on_alcohol_again_desc:0 "禁酒令虽然已经成为历史，但酗酒、地下酒类贸易以及由此衍生的犯罪问题依旧困扰着许多社区。进步主义者认为，政府不能对此置之不理。联邦政府将重新加强酒精管理，严厉打击非法酿造和走私活动，同时推动公共健康教育和戒酒运动，以更加理性而务实的方式减少酒精对家庭和社会造成的危害。"
  USA_usa_with_abundant_electricity:0 "电力充沛"
  USA_usa_with_abundant_electricity_desc:0 "现代国家离不开充足而稳定的电力供应。从工厂机器到乡村农场，从医院学校到千家万户，电力正在改变美国人的生活方式。联邦政府将继续扩大水电、火电与输电网络建设，推动农村电气化和工业现代化，让光明照亮共和国的每一个角落，为新时代的发展提供源源不断的动力。" 
  USA_Maintain_public_works_construction:0 "把公共工程建设握在手心"
  USA_Maintain_public_works_construction_desc:0 "道路、桥梁、电站和公共设施，扩大这些基础建设既能够创造就业，也能够推动全国经济重新运转。联邦政府将继续主导大型公共工程计划，修建公路、水坝、电网、学校与医院，让国家投资直接惠及最需要帮助的地区。公共工程不仅是短期的就业政策，更是下一代美国人赖以发展的基础。"
  USA_Terminate_the_poll_tax:0 "人头税的终末"
  USA_Terminate_the_poll_tax_desc:0 "一个真正的共和国，不应允许财富成为投票权的门槛。长期以来，人头税在部分州成为限制贫困人口和黑人选民参与政治的工具，使无数公民被排除在民主制度之外。联邦政府将推动废除这一陈旧而不公的制度，让每一位符合法律资格的美国人都能够自由表达自己的政治意志。民主属于全体人民，而非拥有更多财富的人。"
  USA_transparency_in_government:0 "透明政府的呼吁"
  USA_transparency_in_government_desc:0 "人民赋予政府权力，自然也有权知道政府如何运用这份权力。预算支出、行政决策与公共工程都应接受公众和国会监督，而不是成为少数官员和利益集团暗中交易的工具。更加公开透明的行政制度，将减少腐败、提升效率，也让人民重新相信联邦政府始终服务于公共利益。"
  USA_The_wisdom_of_the_people:0 "民众之智慧"
  USA_The_wisdom_of_the_people_desc:0 "真正推动共和国前进的，从来不是少数精英，而是数千万勤劳工作的普通美国人。农民、教师、退伍军人、工人与小企业主同样拥有宝贵的经验与判断。政府应更多倾听地方社区、州政府和普通公民的意见，让政策建立在广泛共识之上，而不是闭门会议中的少数决定。相信人民，本就是民主制度最根本的原则。"
  USA_my_gop_friends:0 "昔日之朋"
  USA_my_gop_friends_desc:0 "虽然如今领导着进步党政府，但诺里斯从未忘记自己长期与进步共和党议员们的友谊。许多昔日同僚依然坚持廉洁政府、财政责任和宪政原则，他们并非改革的敌人。只要能够为了国家利益放下党派之争，进步派与温和共和党人仍然能够共同推动一系列有益于共和国未来的改革法案。"
  USA_Model_legislation:0 "模范立法"
  USA_Model_legislation_desc:0 "优秀的法律并非来自华丽的演说，而来自长期实践与不断修正。联邦政府将总结各州成功经验，吸收司法、行政和学术界意见，制定能够真正改善人民生活的示范性法案。从劳工保障到公共事业，从行政改革到市场监管，每一项立法都应成为其他州效仿的典范，而不是仓促出台的政治妥协。"
  USA_Move_towards_true_fair_governance:0 "迈向真正的公平施政"
  USA_Move_towards_true_fair_governance_desc:0 "公平不仅意味着法律面前人人平等，也意味着政府能够平等回应每一位公民的需要。联邦政府将继续完善行政制度，限制特殊利益集团的不当影响，保障选举公平，维护劳动者与普通纳税人的权益。共和国的目标并非让所有人拥有完全相同的财富，而是确保每一个人都能够在公正的制度下，通过自己的努力获得应有的发展机会。"
  USA_The_legacy_of_the_Monroe_Doctrine:0 "门罗主义的遗产"
  USA_The_legacy_of_the_Monroe_Doctrine_desc:0 "一个世纪以前，门罗主义宣布美洲事务应由美洲国家自行决定。这项原则虽然诞生于另一时代，却仍提醒着美国应维护西半球的稳定与独立。今天，我们不会轻易干涉邻国的内政，也不会允许域外强权破坏美洲和平。美国将继续与拉丁美洲各国保持合作，在相互尊重的基础上共同维护新大陆的安全与繁荣。"
  USA_Humanitarian_diplomacy:0 "人道外交"
  USA_Humanitarian_diplomacy_desc:0 "美国的国际影响力，不应仅建立于舰队和资本之上，也应建立于援助、合作与善意。面对战争、饥荒与自然灾害，联邦政府将通过医疗援助、粮食供应、技术合作与国际救济帮助需要帮助的国家。我们尊重各国自主选择自己的道路，同时相信，一个愿意伸出援手的美国，将比单纯依靠武力更能赢得世界的信任与友谊。"
  USA_President_Roosevelt:0 "罗斯福总统任期"
  USA_President_Roosevelt_desc:0 "作为西奥多·罗斯福之子，昆汀·罗斯福的一生似乎始终伴随着那个传奇姓氏。然而，他并不满足于仅仅活在父亲留下的光辉之下。经历战争、国家危机与时代巨变之后，这位年轻的总统希望向全国证明，罗斯福精神并未随着老罗斯福离世而终结。勇气、公平、责任与改革将再次成为共和国前进的方向，美国也将在新时代迎来属于自己的第二个进步时代。"
  USA_memorize_Roosevelt:0 "歌颂己父"
  USA_memorize_Roosevelt_desc:0 ""对于无数美国人而言，西奥多·罗斯福不仅是一位总统，更是一个时代的象征。他带领美国迈入世界舞台，挑战垄断资本，保护自然资源，并始终相信政府应当维护普通人民的利益。昆汀并不会回避父亲留下的巨大影子，相反，他愿意继承这份遗产，让罗斯福精神继续成为新时代改革的旗帜。真正值得纪念父亲的方法，不是沉浸于回忆，而是完成他未竟的事业。"
  USA_Continue_to_crack_down_on_trusts:0 "继续开动“托拉斯粉碎机”"
  USA_Continue_to_crack_down_on_trusts_desc:0 "经济繁荣绝不能建立在少数垄断集团控制全国市场的基础之上。虽然过去数十年的改革已经削弱了部分托拉斯的力量，但新的金融集团和跨行业企业仍不断扩大自身影响。司法部将继续严格执行反垄断法，维护公平竞争，防止任何企业凌驾于市场与法律之上。只有竞争充分、机会均等，美国企业家精神才能真正保持活力。"
  USA_The_political_bond_linked_the_Roosevelt_family:0 "连结罗斯福家族的政治纽带"
  USA_The_political_bond_linked_the_Roosevelt_family_desc:0 "罗斯福家族数十年来始终活跃于美国政治舞台，不论共和党还是民主党，都留下了这个姓氏的足迹。虽然时代已经改变，但遍布全国的人脉、盟友与政治声望依然是共和国宝贵的财富。昆汀将联合志同道合的改革派、退伍军人、地方领袖和各州政治人物，共同建立一个超越传统党派界限的新改革联盟，让罗斯福精神继续影响整个美国。"
  USA_The_Pilot_President:0 "翔云总统"
  USA_The_Pilot_President_desc:0 "年轻时驾驶飞机翱翔蓝天的经历，塑造了昆汀·罗斯福对于现代科技与未来战争的理解。航空不仅改变了军事，也正在改变商业、交通和整个国家的发展方向。作为美国历史上第一位真正意义上的飞行员总统，昆汀将继续推动民航建设、航空工业和空军现代化，让美国始终飞翔于时代最前沿。"
  USA_Plundering_gop_voting_base:0 "搜刮共和党票仓"
  USA_Plundering_gop_voting_base_desc:0 "真正的改革并非某一个政党的专利。许多传统共和党选民同样支持公平竞争、廉洁政府与负责任的财政政策，只是他们尚未找到值得信任的新领导者。进步党将以务实而温和的改革吸引这些中间派、退伍军人、中产家庭和年轻选民，让曾经共和党的进步传统重新成为进步党全国政治的重要力量，而不是任由保守派垄断整个党派的话语权。"
  USA_More_Square_Deal:0 "落实公平施政"
  USA_More_Square_Deal_desc:0 "老罗斯福提出的"公平施政"从来不是一句政治口号，而是一项持续完善共和国的长期事业。新时代需要新的公平：劳动者应获得合理待遇，消费者应受到法律保护，企业家应拥有公平竞争的环境，而自然资源也必须得到妥善管理。联邦政府不会无限扩张自身权力，却会坚定履行维护公共利益的责任，让每一位美国人都能够在公平竞争中实现自己的梦想。"
  USA_Trade_diplomacy:0 "开放贸易政策"
  USA_Trade_diplomacy_desc:0 "美国的繁荣不仅来自国内市场，也来自与世界各国建立的商业联系。稳定、开放且互惠互利的国际贸易，将为美国工业提供新的市场，也让消费者能够享受到更多来自世界各地的商品。昆汀政府将积极推动双边贸易协定，降低不必要的贸易壁垒，并通过经济合作加强美国与自由国家之间的联系。一个更加开放的美国，也将拥有更加广阔的发展空间。"
  USA_President_McNary:0 "麦克纳里总统任期"
  USA_President_McNary_desc:0 "对于许多美国人而言，查尔斯·L·麦克纳里或许并不是最耀眼的政治明星，但却始终是一位值得信赖的务实政治家。这位来自俄勒冈的共和党人长期关注农业、劳工与西部发展，坚信政府既不能放任资本横行，也不能成为压迫人民的工具。战争结束之后，美国比任何时候都更需要团结而非分裂。麦克纳里政府将努力协调工人、农民、企业与国会之间的利益，在妥协与合作中带领共和国重新走向繁荣。"
  USA_Play_the_union:0 "打出工会牌"
  USA_Play_the_union_desc:0 "工会早已成为现代工业社会不可忽视的重要力量。与其将劳资双方不断推向对立，不如让工会成为政府、企业与劳动者之间沟通的桥梁。联邦政府将承认合法工会的代表地位，鼓励集体谈判，并通过合理的劳动法规维护工人与企业共同的发展利益。稳定的劳资关系，不仅意味着更高的工资，也意味着更加稳定的生产。"
  USA_President_of_the_Farm:0 "农场主总统"
  USA_President_of_the_Farm_desc:0 "麦克纳里始终相信，美国真正的根基并不在华尔街，而是在辽阔的农场和乡村。农业不仅养活了全国人民，也维系着无数小镇与家庭的生计。政府将扩大农业贷款、改善农村基础设施、推广现代耕作技术，并帮助农产品进入更广阔的市场。一个富裕而稳定的农村，将成为共和国长期繁荣最坚实的基础。"
  USA_Broad_political_alliance:0 "与每一位政治人士相谈"
  USA_Broad_political_alliance_desc:0 "国家重建绝不能依赖某一个党派单独完成。温和共和党人、改革派民主党人、地方领袖、工会代表以及农业组织，都拥有值得倾听的声音。麦克纳里愿意跨越党派界限，与每一位真正关心美国未来的人展开合作。妥协不是软弱，而是民主政治能够持续运作的重要保证。" 
  USA_McSweeney_McNary_Act:0 "修订麦克斯威尼-麦克纳里法案"
  USA_McSweeney_McNary_Act_desc:0 "旧有农业法案虽然曾帮助美国农民渡过困难时期，但新的经济环境已经提出更多挑战。政府将重新修订《麦克斯威尼—麦克纳里法案》，进一步完善价格支持、农业信贷、仓储补贴和市场调节机制，在避免过度干预市场的同时，为广大农民提供更加稳定的发展环境。让农业能够持续获利，也就是保障整个国家的粮食安全。"
  USA_pleasant_meeting_with_the_exiles:0 "与流亡者的愉快会谈"
  USA_pleasant_meeting_with_the_exiles_desc:0 ""大西洋彼岸的革命改变了整个世界，也让无数忠于英王与大英帝国的军官、政客和学者被迫流亡加拿大。虽然他们失去了祖国，却从未放弃重返伦敦的希望。麦克纳里政府愿意向这些昔日盟友伸出友谊之手，与加拿大政府及流亡英国领导层展开深入磋商，分享情报、协调工业生产，并共同研究未来横渡大西洋的战略计划。眼下或许只是一次轻松而愉快的会谈，但所有与会者都清楚，他们讨论的最终目标只有一个——终有一日，让自由的旗帜再次飘扬于白金汉宫之上。"
  USA_Bull_Moose_Road:0 "公糜道路"
  USA_Bull_Moose_Road_desc:0 "西奥多·罗斯福曾建立公麋党，希望用改革精神打破保守政治的僵局。虽然那个政党早已成为历史，但它倡导的公平竞争、廉洁政府、保护劳动者和反对垄断等理念依然影响着今天的美国。麦克纳里愿意继承这一政治传统，将温和改革、负责任的政府和积极进步主义重新带回共和党的核心价值之中，让公麋精神再次引领共和国前进。"
  USA_go_fuck_yourself_old_dem:0 "向南方挥舞大棒"
  USA_go_fuck_yourself_old_dem_desc:0 "数十年来，南方保守民主党人凭借地方政治机器长期控制着州议会与国会席位，对改革法案屡屡加以阻挠。麦克纳里政府不会为了短暂的政治便利而放弃自己的原则。联邦政府将积极支持当地改革派、扩大联邦项目投资，并推动更加公平的选举与行政制度，逐步削弱旧政治机器对于南方各州的垄断影响。美国的未来，不应继续受制于早已落后的地方派系。"
  USA_President_La_follette:0 "拉福莱特总统任期"
  USA_President_La_follette_desc:0 "拉福莱特这个名字，在美国进步主义历史上早已家喻户晓。从老拉福莱特到今天，这个家族始终坚持一个朴素而坚定的信念：政府应当属于人民，而不是政客、财阀或政治机器。战争带来的创伤更加证明，一个真正强大的共和国不仅需要繁荣的经济，更需要廉洁、高效且值得信赖的公共机构。新的政府将重新点燃进步时代的理想，让联邦真正成为服务人民的政府。"
  USA_The_era_of_public_service:0 "公共服务时代"
  USA_The_era_of_public_service_desc:0 "公共职位并非谋取私利的工具，而是一份服务人民的责任。联邦政府将进一步完善公务员制度，提高行政效率，杜绝裙带关系与政治分赃，让每一位公务人员都以专业能力而非党派背景获得任用。一个真正现代化的国家，应当拥有一支忠于宪法、忠于人民，而非忠于任何个人的公共服务队伍。"
  USA_Credit_cooperative:0 "信用合作社运动"
  USA_Credit_cooperative_desc:0 "面对大型银行与金融资本的竞争，普通农民、小企业和地方社区往往难以获得公平的贷款条件。政府将积极推动信用合作社的发展，让社区居民共同储蓄、共同放贷，以更加低廉的成本满足生产和生活需要。合作而非垄断，互助而非剥削，这种扎根地方社区的金融体系将为美国基层经济注入新的活力。"
  USA_NCA:0 "国家工程法案"
  USA_NCA_desc:0 "国家的发展需要长远规划，而不是零散且彼此脱节的工程项目。《国家工程法案》将整合联邦与各州资源，对交通、水利、电力、市政建设和公共设施进行统一规划与协调，使基础建设真正服务于全国的发展需求。科学规划、专业管理和长期投资，将成为美国迈向现代化的重要支柱。"
  USA_the_fighting_bob:0 "“战斗的鲍勃”精神"
  USA_the_fighting_bob_desc:0 "人们始终记得老拉福莱特那个响亮的绰号——“战斗的鲍勃”。他敢于挑战托拉斯、反对政治腐败，也从未向任何利益集团低头。今天，我们继承的不只是一个名字，更是一种永不妥协的改革精神。面对新的垄断、新的政治机器和新的既得利益集团，美国依旧需要这种敢于斗争、敢于改革的勇气。"
  USA_Wisconsin_idea:0 "威斯康星理念"
  USA_Wisconsin_idea_desc:0 "“威斯康星理念”认为，大学的知识不应停留在课堂，而应直接服务社会。教授、工程师、经济学家和法律专家将参与公共政策制定，以科学研究解决现实问题。联邦政府将进一步加强与高校、研究机构及地方政府之间的合作，使专业知识真正成为国家治理的重要力量，让政策建立在事实与研究之上，而不是偏见与空谈之中。"
  USA_Build_service_oriented_government:0 "构建服务式政府"
  USA_Build_service_oriented_government_desc:0 "政府存在的意义，并不是统治人民，而是服务人民。从行政审批到公共医疗，从教育体系到社会保障，每一项制度都应围绕人民的实际需要不断改进。拉福莱特政府将推动更加开放、高效且负责任的行政体系，让联邦政府真正成为所有美国人都能够信赖和依靠的公共机构。一个能够服务人民的政府，才是真正强大的政府。"
  USA_President_Borah:0 "博拉总统任期"
  USA_President_Borah_desc:0 "数十年来，威廉·E·博拉始终以直率、坚定和毫不妥协而闻名于国会。无论面对垄断资本、腐败政治还是国际局势，他都坚持以共和国利益和人民自由作为最高原则，因此赢得了“爱达荷之狮”的称号。如今，美国终于迎来属于博拉的时代。新的政府将继承进步主义传统，坚持民主、法治与社会改革，同时拒绝让国家再次陷入无意义的战争与权力斗争。"
  USA_banquet_with_hoover:0 "与胡佛的愉快晚宴"
  USA_banquet_with_hoover_desc:0 "尽管在许多政策上存在分歧，但博拉与赫伯特·胡佛始终保持着相互尊重。两位共和国元老都相信，美国需要稳定的政治制度、廉洁的政府以及负责任的领导。在一次轻松的私人晚宴上，他们回顾了国家走过的艰难岁月，也讨论着未来改革的方向。"
  USA_The_Lion_of_Idaho:0 "爱达荷之狮的坚定立场"
  USA_The_Lion_of_Idaho_desc:0 "人们称威廉·博拉为“爱达荷之狮”，不仅因为他雄辩的演说，更因为他从不畏惧挑战任何权势。无论是金融寡头、政治机器，还是国际强权，都无法让他放弃自己的原则。面对新时代的挑战，美国依旧需要这种敢于坚持信念、不向压力屈服的勇气。共和国或许可以妥协于现实，却绝不能放弃自己的原则。"
  USA_Peace_and_Rationality:0 "和平与理性"
  USA_Peace_and_Rationality_desc:0 "战争从来都不是外交成功的证明，而往往意味着政治智慧的失败。博拉政府将继续奉行克制而理性的外交政策，坚持通过谈判、国际协商与经济合作解决争端，避免美国再次卷入毫无必要的海外冲突。和平不是软弱，而是建立在实力与理性基础上的自信；只有珍惜和平，美国人民才能真正享受繁荣带来的成果。" 
  USA_The_Great_Alliance_for_Progress:0 "对进步主义的共同捍卫"
  USA_The_Great_Alliance_for_Progress_desc:0 "进步主义从来不是某一个党派独有的旗帜。无论来自共和党、进步党还是民主党，只要愿意推动廉洁政府、反对垄断、维护普通人民利益，都可以成为改革事业的一员。进步党希望建立一个超越传统党派界限的广泛联盟，让所有真正关心共和国未来的人共同捍卫进步主义事业，而不是继续沉迷于无休止的党派争斗。"
  USA_Implement_social_relief:0 "为广大公民托底"
  USA_Implement_social_relief_desc:0 "自由意味着机会，但真正的自由也要求任何人在遭遇疾病、失业或天灾时，不至于因此失去生活的希望。联邦政府将完善社会救济体系，为最困难的家庭提供最低限度的支持，同时帮助失业者重新就业、帮助退伍军人融入社会、帮助老人和残疾人维持基本生活。社会救济并非施舍，而是共和国对于全体公民应尽的责任。"
  USA_public_education:0 "人人应得的教育"
  USA_public_education_desc:0 "共和国的未来并不诞生于国会大厅，而诞生于每一间教室。无论出身城市还是乡村，无论家庭贫富，每一个孩子都应拥有接受良好教育的机会。联邦政府将扩大公共教育投资，改善学校设施，提高教师待遇，并鼓励更多青年接受高等教育。知识不仅能够改变个人命运，更决定着整个国家未来的发展方向。"
  USA_New_Nationlism:0 "新国家主义"
  USA_New_Nationlism_desc:0 "新时代需要新的国家主义。它并不意味着对外扩张，也并非政府无限膨胀，而是让国家重新成为维护公共利益的共同体。联邦政府应限制垄断资本、维护公平竞争、保障劳动者权益，并通过民主制度协调不同社会群体之间的利益。真正伟大的美国，不应依靠征服世界赢得尊敬，而应依靠自由、公正与繁荣成为其他共和国学习的典范。这便是属于新时代的国家主义。"
  USA_Consolidate_the_federal_system:0 "巩固联邦制度"
  USA_Consolidate_the_federal_system_desc:0 "战争曾让联邦制度遭受前所未有的考验，而和平时期更需要重新巩固共和国赖以生存的宪政基础。联邦与各州之间应保持清晰而稳定的权责划分，在维护地方自治的同时确保全国政策能够统一实施。只有一个团结、稳定且运行高效的联邦，才能保障美国长久的繁荣与自由。"
  USA_progressive_us:0 "进步未来的第一步"
  USA_progressive_us_desc:0 "进步主义从来不是某一位总统、某一个党派或某一场选举的胜利，而是一场不断完善共和国的长期事业。未来的美国将继续推动民主改革、科学发展、公共建设和社会公平，在自由与责任之间寻找新的平衡。今天迈出的每一步，都将成为下一代美国人继续前进的基石。而属于美国的新进步时代，也才刚刚开始。"
  USA_President_Wallace:0 "华莱士总统任期"
  USA_President_Wallace_desc:0 "对于亨利·A·华莱士而言，一个国家的伟大并不取决于拥有多少财富，而在于普通人民能够过上怎样的生活。这位农学家、改革者和理想主义者相信，现代科技、民主制度与社会改革能够共同创造一个更加公平、更富足的美国。战争虽然结束，但真正的和平仍需依靠消除贫困、疾病与歧视来实现。华莱士政府将继续推进改革，让联邦政府真正成为全体人民福祉的守护者。"
  USA_Wallace_New_Deal:0 "华氏新政"
  USA_Wallace_New_Deal_desc:0 "罗斯福的新政帮助美国走出了经济危机，而新时代则需要属于华莱士自己的改革方案。在继续保障就业和社会福利的基础上，政府将更加重视教育、医疗、农业现代化和科技发展，使改革成果真正惠及每一个普通家庭。经济增长不应只是少数人的财富增长，而应成为所有美国人民共同分享的发展成果。"
  USA_Agricultural_Revolution:0 "大刀阔斧的农业革命"
  USA_Agricultural_Revolution_desc:0 "作为农业科学家，华莱士深知现代农业的发展绝不能继续依赖经验和运气。政府将推广高产良种、机械化耕作、科学施肥和病虫害防治技术，同时扩大农业科研投入，帮助农民提高产量与收入。现代农业不仅能够养活整个国家，也将成为美国经济长期繁荣的重要支柱。土地依旧属于农民，而科学将成为他们最可靠的伙伴。"
  USA_contact_SP:0 "与社会党眉来眼去"
  USA_contact_SP_desc:0 "虽然进步党与社会党在许多理念上仍存在明显分歧，但双方都希望改善劳动者待遇、扩大社会保障并限制垄断资本的影响。在部分社会改革议题上，与社会党展开有限合作并非不可接受。华莱士政府愿意倾听来自左翼的合理建议，同时坚持维护美国民主制度，在改革与自由之间寻找一条属于共和国自己的道路。"
  USA_Theosophy_debate:0 "神智辩论"
  USA_Theosophy_debate_desc:0 "华莱士对于神智学和精神哲学的兴趣一直备受外界关注。有人认为，这种信仰能够帮助人们思考文明与人性的未来；也有人担忧，国家领导人不应让个人精神追求影响公共政策。面对社会各界的争论，华莱士政府强调，联邦政府始终建立在科学、民主与法律基础之上，而任何宗教或哲学思考，都仅属于个人信仰自由的范畴。"
  USA_Break_Racial_segregation:0 "击垮种族隔离的迷梦"
  USA_Break_Racial_segregation_desc:0 "种族隔离制度不仅伤害了数百万美国公民，也违背了共和国宣扬已久的自由与平等原则。联邦政府将积极推动废除公共设施隔离、保障少数族裔选举权，并加强联邦司法对于公民权利的保护。真正强大的美国，不应建立在歧视之上，而应建立在所有公民共同享有自由与尊严的基础之上。"
  USA_Improve_the_national_medical_system:0 "健全国家医疗体系"
  USA_Improve_the_national_medical_system_desc:0 "疾病不应因为一个人的财富多少而决定其命运。华莱士政府将扩大公共卫生投入，建设更多社区医院，完善基层医疗网络，并逐步建立覆盖全国的医疗保障体系。健康不仅关乎个人幸福，也关系着国家整体的发展能力。一个人人都能够获得基本医疗服务的美国，将拥有更加健康、更具活力的未来。"
  USA_The_call_for_pan-Americanism:0 "泛美主义呼吁"
  USA_The_call_for_pan-Americanism_desc:0 "美洲国家拥有共同的发展机遇，也共同肩负维护西半球和平与繁荣的责任。美国将以更加平等和尊重的态度加强与拉丁美洲各国合作，扩大经济往来、教育交流和科技援助，共同抵御极端主义和外来侵略。真正的泛美主义，不是任何国家支配他国，而是整个新大陆携手迈向共同繁荣。"
  USA_A_steadfast_guardian_of_the_free_world:0 "自由世界的坚定卫士"
  USA_A_steadfast_guardian_of_the_free_world_desc:0 "自由不仅属于美国人民，也属于所有渴望民主、和平与独立的民族。面对极权主义、侵略战争和政治压迫，美国不能继续置身事外。华莱士政府将与世界各自由国家开展更加紧密的合作，通过经济援助、国际合作和必要的共同防务维护来之不易的和平。一个自由的世界，也将是美国最可靠的安全保障。"
  USA_Century_of_the_Common_Man:0 "平民世纪"
  USA_Century_of_the_Common_Man_desc:0 "过去的时代属于帝王、寡头和殖民帝国，而未来的时代应属于每一位普通劳动者、农民、教师、工程师和士兵。华莱士坚信，科学、民主与合作能够让全世界更多人民摆脱贫困、压迫与战争，实现真正意义上的自由与尊严。美国追求的并非新的霸权，而是一个属于平民、属于和平、属于共同发展的新时代。这正是华莱士所期待的——平民的世纪。"
USA_election_GOP_1940:0 "为美利坚高举自由大旗"
  USA_election_GOP_1940_desc:0 "经历数年的政治动荡之后，美国人民再次将目光投向共和党。自由、宪政、责任与机会始终是共和国最宝贵的传统，也是共和党始终坚持的政治信念。无论是追求财政稳健、维护企业活力，还是保障个人自由与地方自治，共和党都相信，一个真正繁荣的美国绝不能依赖无限扩张的政府，而应建立在自由市场、法治精神以及勤劳公民共同创造的基础之上。今天，我们将再次高举自由的大旗，引领共和国迈向新的黄金时代。"
  USA_President_Landon:0 "兰登总统任期"
  USA_President_Landon_desc:0 "阿尔夫·兰登从未否认国家应承担自己的责任，但他同样相信，政府的力量必须建立在财政纪律、地方自治与市场活力之上，而不是无止境的扩张。经历危机之后，美国需要的不是新的政治实验，而是一位能够调和改革与保守、效率与自由的总统。未来的联邦政府将继续承担必要职责，同时重新给予企业、州政府和地方社会更多自主空间，使共和国重新回到稳健而务实的发展道路。"
  USA_President_Dewey:0 "杜威总统任期"
  USA_President_Dewey_desc:0 "托马斯·杜威相信，一个真正强大的共和国，并不依赖庞大的官僚机构，而依赖诚实、高效且值得人民信任的政府。作为曾经打击有组织犯罪的检察官，他深知腐败、裙带关系与政治机器如何一点点侵蚀民主制度。未来，美国将以法治整顿行政，以专业提升效率，以现代管理取代陈旧政治，让联邦政府重新成为服务人民而非服务利益集团的公共机构。"
  USA_President_brick:0 "布里克总统任期"
  USA_President_brick_desc:0 "对于约翰·布里克而言，美国真正的力量从来不只存在于华盛顿，而存在于五十个州、数千座城镇以及无数自发组织的社区之中。联邦政府固然承担全国事务，却绝不能不断侵蚀州政府与人民原本享有的权利。未来的共和党政府将重新恢复联邦制精神，限制行政权力，维护地方自治，使共和国重新回到建国者所设计的宪政轨道。"
  USA_President_taft:0 "塔夫脱总统任期"
  USA_President_taft_desc:0 "罗伯特·A·塔夫脱始终坚信，共和国的繁荣来自稳定而有限的政府，而非不断扩张的国家机器。预算必须保持平衡，法律必须受到尊重，市场必须拥有自由发展的空间，而总统本人也应受到宪法的约束。共和党的责任并非迎合一时的民意，而是在自由、责任与法治之间保持长期而坚定的平衡，使美国继续成为一个依靠制度而非个人维系的共和国。"
  USA_President_hoover:0 "胡佛再次当选！"
  USA_President_hoover_desc:0 "许多人认为赫伯特·胡佛属于过去，但正是在国家最需要经验的时候，这位曾经主持战后救济、管理巨大行政体系的老政治家再次肩负起领导共和国的责任。经历危机后的美国不需要激进的革命，也不需要轻率的冒险，而需要一位熟悉国家机器、相信专业管理与社会合作的总统。在新的任期内，联邦政府将努力恢复经济秩序、重建社会信心，并以稳健而审慎的方式带领美国走向复兴。"
  USA_President_Vandenberg:0 "范登堡总统任期"
  USA_President_Vandenberg_desc:0 "美国已经无法孤立于世界之外。亚瑟·范登堡相信，一个真正伟大的共和国不仅需要强大的工业与自由的制度，也需要承担维护国际秩序的责任。共和党政府将在坚持国家利益的前提下积极参与国际事务，巩固盟友关系，推动自由贸易，并依靠美国的经济、外交与军事力量维护一个更加稳定的世界。只有世界和平，美国的繁荣才能长久延续。"
  USA_Reaffirm_the_liberal_program:0 "重申自由主义纲领"
  USA_Reaffirm_the_liberal_program_desc:0 "共和党始终相信，自由不是一项由政府施舍的恩惠，而是每一位美国公民与生俱来的权利。面对近年来不断扩张的行政权力和愈发复杂的联邦机构，我们有责任重新确认自由主义纲领，坚持法治、有限政府、自由市场以及个人责任的传统原则。共和国真正的繁荣，应当建立在自由竞争、公平司法和公民创造力之上，而非无限扩张的国家机器。"
  USA_Moderate_progress:0 "温和进步"
  USA_Moderate_progress_desc:0 "进步并不意味着推翻一切传统，也不意味着放任社会停滞不前。进步共和党人主张以务实、渐进且负责任的方式推动改革，在维护宪法秩序的前提下不断改善教育、公共卫生、基础设施和社会保障。真正成功的改革，应当能够兼顾经济活力与社会稳定，让每一位美国人都能分享国家发展的成果，而不会因此牺牲共和国赖以立足的自由制度。"
  USA_cultural_golden_age:0 "文化盛世"
  USA_cultural_golden_age_desc:0 "一个伟大的国家不仅需要繁荣的经济，更需要繁荣的文化。美国文学、电影、音乐、建筑与科学的发展，共同塑造了共和国独特的精神风貌。政府将尊重艺术创作自由，支持博物馆、大学、图书馆及文化机构的发展，为艺术家、作家和学者提供更加宽广的发展空间，使美国不仅成为工业强国，更成为自由世界文化与思想创新的中心。"
  USA_more_tax:0 "开源"
  USA_more_tax_desc:0 "健康的财政，应当来自持续增长，而不是无限借贷。任何负责任的政府都必须拥有稳定可靠的财政来源。共和党反对毫无节制地扩大公共债务，也反对以高税率惩罚企业创造财富。政府将在扩大经济规模、优化税收结构和提升行政效率的基础上增加财政收入，使国家能够承担必要的公共支出，同时避免将沉重负担留给下一代美国人。"
  USA_Reach_an_agreement_with_the_enterprise:0 "与企业达成一致"
  USA_Reach_an_agreement_with_the_enterprise_desc:0 "企业不是政府的敌人，而是美国繁荣最重要的创造者。从家庭作坊到大型工业集团，无数企业家依靠创新和投资不断推动共和国向前发展。共和党将建立政府与工商界更加紧密的合作机制，在维护公平竞争的前提下共同制定产业政策、扩大就业机会并促进技术创新。只有政府与企业相互信任，美国经济才能保持世界领先地位。"
  USA_Business_freedom:0 "营商自由带来经济自由"
  USA_Business_freedom_desc:0 "真正持久的经济自由，来源于充满活力的市场环境，而不是繁琐复杂的行政许可和不断扩大的政府干预。当企业能够自由投资、自由竞争并大胆创新时，新的岗位、新的技术和新的财富便会不断涌现。共和党将继续简化监管程序，保护私有财产和契约精神，让企业家重新成为推动美国繁荣最重要的力量，使自由市场再次焕发无限生机。"
  USA_no_subsidies:0 "补贴？什么补贴？"
  USA_no_subsidies_desc:0 "补贴或许能够暂时解决困难，却无法真正创造竞争力。长期依赖政府扶持，只会削弱企业创新能力，也会不断加重纳税人的负担。共和党相信，市场能够比政府更有效地配置资源。政府将逐步取消不必要的产业补贴，把财政资源集中用于基础设施、科研和教育等公共领域，让真正优秀的企业依靠自身实力赢得市场，而不是依赖政治关系获得生存机会。"
  USA_Health_for_all:0 "人人康健"
  USA_Health_for_all_desc:0 "一个健康的民族，才能拥有真正的自由。疾病不仅意味着个人的不幸，也会削弱家庭、企业乃至整个国家的生产能力。共和党支持扩大地方医院、医学院和公共卫生机构的发展，鼓励慈善基金会、宗教团体与州政府共同改善医疗服务，而不是建立庞大低效的联邦官僚体系。政府的职责不是包办一切，而是确保每一位美国人都拥有获得医疗照护的机会，使健康成为共和国繁荣最可靠的基石。"
  USA_work_for_happiness:0 "为幸福而劳作"
  USA_work_for_happiness_desc:0 "劳动从来不只是谋生的手段，它同样赋予人尊严、责任与成就感。从西进时代的拓荒者，到流水线上挥洒汗水的工人，再到实验室里的工程师，无数美国人都用自己的双手塑造了这个国家。共和党希望创造更多就业机会，让劳动重新成为改善生活、实现梦想的重要途径，而不是依赖政府补助或政治施舍。一个勤劳的民族才将收获属于自己的幸福。"
  USA_The_wind_of_change_is_blowing:0 "刮起变革之风"
  USA_The_wind_of_change_is_blowing_desc:0 "时代不会停下脚步，共和党同样不会拒绝变革。但真正值得欢迎的改革，应当建立在自由与法治之上，而不是以破坏传统制度作为代价。新的工业、新的科技、新的管理方式正在改变美国，也要求政府拥有更加开放而灵活的治理思维。真正的共和党人既不会拒绝新时代，也不会盲目追逐任何政治潮流，而是在变革之中始终守护自由传统。"
  USA_Light_up_the_Lighthouse_of_Freedom:0 "培育美式自由之花"
  USA_Light_up_the_Lighthouse_of_Freedom_desc:0 "几个世纪以来，无数移民怀着对自由的向往跨越大西洋，只因他们相信，美国是一座照耀世界的灯塔。今天，这座灯塔依然不能熄灭。面对专制主义、极端主义以及国家主义思潮不断蔓延，共和党将继续捍卫言论自由、宗教自由、新闻自由和法治原则，让世界看到，自由不仅是一句口号，更是一种能够孕育繁荣、创新与希望的文明。"
  USA_The_government_delegates_power:0 "政府放权"
  USA_The_government_delegates_power_desc:0 "华盛顿并不需要决定每一个社区应该修建什么道路，也不需要替每一位市长管理地方事务。美国的成功，正来源于州政府、县政府以及无数自治社区共同构成的联邦体系。共和党将重新划分联邦与地方之间的权力边界，把更多财政、教育、公共建设和行政事务交由地方自行决定，使政府重新回归人民身边，而不是停留在遥远的首都。"
  USA_Pragmatism_first:0 "务实为先"
  USA_Pragmatism_first_desc:0 "共和党的传统从来不是空谈理论，而是解决问题。无论是林肯维护联邦统一，还是胡佛推动灾后重建，又或是各州共和党政府不断完善公共行政，他们共同证明了一件事——真正优秀的政府，应当以实际成效而非政治口号赢得人民信任。兰登政府将向广大美国公众宣布，共和党政府将坚持务实原则，凡是有利于国家繁荣与人民幸福的政策，都值得认真采纳。"
  USA_Convene_the_eastern_establishment:0 "召集东部建制派"
  USA_Convene_the_eastern_establishment_desc:0 "纽约的金融家、波士顿的律师、费城的企业家以及常春藤大学培养出的行政人才，长期以来共同构成了共和党最稳定的建制力量。他们拥有丰富的管理经验、广泛的人脉资源以及对共和国制度的坚定信念。作为托马斯·杜威的最忠实拥趸，这一批经验丰富的政治家、学者和工商领袖将被广泛吸纳进入政府，为国家制定更加稳定而长远的发展战略，使专业能力重新成为公共治理最重要的基础。"
  USA_pay-as-you-go_liberalism:0 "现收现付的自由主义"
  USA_pay-as-you-go_liberalism_desc:0 "自由政府首先应当是一届负责任的政府。共和党始终坚持现收现付的财政理念——今天的公共支出，应尽可能由今天的财政收入承担，而不是把债务留给未来的纳税人。只有保持预算纪律，政府才能在经济危机真正来临时拥有足够的调控能力。自由主义并不意味着挥霍，而意味着尊重每一位纳税人的劳动成果。"
  USA_Awaken_local_governments:0 "唤醒地方政府"
  USA_Awaken_local_governments_desc:0 "托克维尔曾赞叹，美国民主真正的生命力并不诞生于华盛顿，而诞生于遍布全国的乡镇、市议会和地方自治组织。共和党同样相信，越贴近人民的政府，越能够理解人民真正需要什么。通过扩大地方财政自主权、强化州议会职能并鼓励社区自治，我们将重新激活联邦制度最富活力的一环，让美国继续成为地方自治最成功的共和国。"
  USA_Stand_together_with_the_Constitution:0 "与伟大宪法共进退"
  USA_Stand_together_with_the_Constitution_desc:0 "1787年的费城，五十五位代表在炎热的夏季完成了一项足以改变世界的事业。美利坚合众国宪法并非完美无缺，却为自由、法治与权力制衡奠定了坚实基础。共和党不会把宪法视作可以随意修改的政治工具，而将继续捍卫这一共和国最高法律的尊严。无论时代如何变化，共和党人始终与宪法同行，因为正是它赋予了美国持续两个世纪的稳定与自由。"
  USA_Balanced_finance_is_like_a_good_medicine:0 "均衡财政如良药"
  USA_Balanced_finance_is_like_a_good_medicine_desc:0 ""一位优秀的医生不会因为病人虚弱便无限制地开出止痛药，一届负责任的政府也不会因为眼前的困难便将债务不断留给未来。财政平衡或许无法赢得最热烈的掌声，却能够给予共和国最可靠的健康。共和党将坚持量入为出，严格控制联邦预算，减少不必要的行政开支，使纳税人的每一分钱都真正用于国家需要的地方。正如柯立芝所言：“收税的艺术，在于尽可能少地拔鹅毛，却得到最多的鹅绒。”共和国的财政，同样需要这样的智慧。"
  USA_monopoly_is_venomous_snakes:0 "垄断寡头似毒蛇"
  USA_monopoly_is_venomous_snakes_desc:0 "自由企业并不意味着纵容垄断。当少数企业能够操纵市场、压制竞争甚至左右公共政策时，自由市场便失去了存在的意义。从西奥多·罗斯福挥起“托拉斯克星”的大棒，到今日更加成熟的反垄断制度，共和党始终相信，真正的资本主义建立在公平竞争之上。政府将继续执行反垄断法，保护中小企业的发展空间，使任何企业都只能依靠创新赢得市场，而不能依靠垄断消灭竞争。"
  USA_Free_will_and_economic_power:0 "展望自由未来"
  USA_Free_will_and_economic_power_desc:0 "美国的财富，从来不是由政府创造，而是由千千万万个自由作出选择的人共同创造。有人创办工厂，有人发明机器，有人经营农场，也有人远赴西部开拓新的土地。正是这些自由意志汇聚成了共和国最强大的经济力量。共和党将继续维护契约精神、私有财产与自由竞争，让每一位美国人都有机会凭借自己的智慧与努力实现成功。当自由得到保障，财富便会随之而来。"
  USA_The_final_blow_to_the_strikers:0 "对罢工分子的最后一击"
  USA_The_final_blow_to_the_strikers_desc:0 "工人依法维护自身权益无可厚非，但任何组织都无权以暴力、破坏生产或瘫痪公共秩序作为谈判筹码。近年来，越来越多激进工会试图利用全国性罢工迫使政府和企业屈服，这不仅损害了经济，也侵犯了无数普通劳动者工作的自由。共和党将进一步规范劳资关系，严厉打击非法罢工、暴力纠察和政治性工运，同时完善仲裁制度，让劳资双方重新回到法律框架内解决争议。"
  USA_conception_of_a_conservative_alliance:0 "对保守联盟的构想"
  USA_conception_of_a_conservative_alliance_desc:0 "面对进步主义不断扩张的政治影响，共和党必须重新思考自由主义与保守主义之间的关系。财政纪律、地方自治、传统价值以及自由企业并非彼此冲突，而是共同维系共和国稳定的重要支柱。现任政府愿意同一切尊重宪法、维护自由制度的保守力量展开合作，在坚持共和党原则的同时建立更加广泛的反激进联盟，为美国提供一个稳定而可靠的执政选择。"
  USA_Continue_the_past_policies:0 "延续往昔政策"
  USA_Continue_the_past_policies_desc:0 "过去数十年间，美国之所以能够成为世界最繁荣的共和国，并非依靠频繁改变方向，而是依靠一套经受时间考验的制度。自由企业、有限政府、地方自治以及财政自律，共同塑造了美国的发展道路。罗伯特·塔夫脱相信，真正的政治智慧并不在于不断创造新制度，而在于维护那些已经证明行之有效的传统。共和国不需要革命，只需要坚定地走在正确的道路上。"
  USA_Defend_the_establishment_faction:0 "保卫建制派大旗"
  USA_Defend_the_establishment_faction_desc:0 "尽管在过去经常被社会党等激进势力用以抨击政府，但建制并非一个贬义词。相反，它代表着长期积累的行政经验、成熟的法律制度以及能够维持国家稳定运转的公共机构。从州议会到最高法院，从职业公务员到地方政府，共和党的建制派始终承担着共和国最重要的责任。我们不会因为一时的政治浪潮便否定这些制度，而将继续完善它们，使美国能够在稳定中不断发展，而非在动荡中追逐短暂的激情。"
  USA_isolated_from_the_world:0 "美利坚遗世独立"
  USA_isolated_from_the_world_desc:0 "乔治·华盛顿在告别演说中提醒后人，应谨慎卷入欧洲列强之间的永久性纷争。一个多世纪以来，这一忠告始终影响着美国外交。范登堡政府将继续坚持谨慎克制的外交政策，把国家资源优先用于国内建设、工业发展与人民福祉，而不是承担世界警察的角色。美国愿意同所有国家保持贸易与友谊，却不会轻易将自己的命运绑在他国的战争之上。"
  USA_The_Art_of_Unity:0 "政治：团结的艺术"
  USA_The_Art_of_Unity_desc:0 "政治并不是不断寻找敌人，而是不断寻找能够合作的人。共和党内部既有财政保守派，也有自由主义者；既有东部建制派，也有中西部改革派。一个成熟的执政党，应当学会协调不同意见，而不是让内部纷争削弱国家。正如林肯曾组建"政敌团队"一般，共和党也将团结所有愿意维护共和国的人，共同承担国家治理的责任。"
  USA_Cultivate_the_national_defense_industry:0 "栽培国防工业"
  USA_Cultivate_the_national_defense_industry_desc:0 "和平从来不是软弱的产物，而是实力的证明。共和党希望美国永远不必发动战争，但也绝不能在战争来临时措手不及。政府将继续扶持航空、造船、钢铁、汽车以及精密制造等国防工业，在和平时期积累足够的工业潜力与技术储备。当共和国拥有世界最强大的工业体系时，任何潜在的敌人都将重新衡量挑战美国所需付出的代价。"
  USA_creative_freedom_of_Hollywood:0 "好莱坞的创作自由权"
  USA_creative_freedom_of_Hollywood_desc:0 "好莱坞不仅属于加利福尼亚，更属于整个美国。从卓别林的默片到迪士尼的动画，从西部片到音乐剧，美国电影不断向世界讲述着属于自由社会的故事。政府不会告诉艺术家应该创作什么，也不会替观众决定什么值得欣赏。共和党相信，自由市场同样适用于文化领域。一个充满竞争与创造力的电影产业，远比任何官方宣传更能展现美国文明真正的魅力，让自由的价值随着银幕传播到世界各地。"
  USA_Grant_America_freedom_and_wealth:0 "许以美利坚自由与财富"
  USA_Grant_America_freedom_and_wealth_desc:0 "两个世纪以来，无数怀揣梦想的人跨越海洋来到这片土地，他们追求的不只是财富，更是决定自己命运的自由。财富因自由而诞生，自由也因繁荣而更加稳固，这是共和国始终坚守的信念。未来的美国不会依赖政府包办人民的一切，也不会让国家成为少数集团的工具。我们将继续捍卫宪法赋予公民的各项自由，维护公平竞争的市场秩序，鼓励每一位美国人凭借自己的才能创造属于自己的未来。一个自由的美国，必将是一个富强的美国；一个富强的美国，也终将成为自由世界最坚定的灯塔。"
USA_election_DP_1940:0 "美利坚的保守民主"
  USA_election_DP_1940_desc:0 "1936年的政治动荡并未完全消散，美国社会仍然深陷经济问题与意识形态冲突之中。在这样的局势下，民主党内部的保守派重新团结起来，试图恢复传统的民主党政治路线。这些被称为“保守民主党人”的政治家强调财政稳健、地方自治与渐进改革，反对过度扩张的联邦政府与激进的社会实验。在他们看来，美国需要的不是新的政治革命，而是回归那些曾经维持国家稳定的政治传统。"
  USA_great_victory_for_hardline_conservative_Democrats:0 "保守民主党人的伟大胜利"
  USA_great_victory_for_hardline_conservative_Democrats_desc:0 "从南方州的政治机器到中西部的传统民主党选区，保守民主党人的胜利成功将激进改革派逐渐排挤出权力中心。对于这些政治家而言，这不仅是一场选举胜利，更是一场对民主党传统路线的“回归”。"
  USA_President_Garnar:0 "加纳总统任期"
  USA_President_Garnar_desc:0 "约翰·南斯·加纳，这位来自德克萨斯的老牌民主党政治家，是南方保守派在联邦政治中的重要代表。对于加纳而言，联邦政府应当保持克制，而国会则必须重新成为国家政治生活的中心。如今，这位经验丰富的政治老将将开启他的又一任期，他的任务将是彻底稳定美国的社会与经济，并将美国引领回过去的美好时代。"
  USA_administrative_hand_should_stay_away_from_Congress:0 "行政之手应远离国会"
  USA_administrative_hand_should_stay_away_from_Congress_desc:0 "在过去的政治斗争中，许多保守派民主党人逐渐形成一种共识：联邦行政权力的过度扩张正在削弱美国宪政体系的根基。总统与行政机构的不断干预，使国会在国家政治中的地位被严重削弱。加纳政府认为，这种趋势必须得到纠正。行政机构应当重新回到执行法律的本职，而不是成为国家政治的主导力量。"
  USA_Defenders_of_the_DP_traditions:0 "民主党传统的捍卫者"
  USA_Defenders_of_the_DP_traditions_desc:0 "民主党拥有悠久的政治传统。从杰斐逊时代开始，民主党便始终代表着地方自治与有限政府的政治理念。尽管在过去几十年的政治变动中，这些传统曾一度受到挑战，但许多老派民主党人仍然坚信这些理念才是美国政治的真正根基。加纳政府将试图重新唤起这些传统价值，并将其重新塑造成民主党的核心政治纲领。"
  USA_Star_presidents_of_Representatives_and_the_Senate:0 "参众两院的明星总统"
  USA_Star_presidents_of_Representatives_and_the_Senate_desc:0 "在美国政治历史上，国会始终扮演着极为重要的角色。无论是众议院议长还是参议院多数党领袖，这些人物往往在国家政治中拥有巨大的影响力。加纳本人正是从国会体系中成长起来的政治家，他深知国会制度的重要性。因此，加纳政府将致力于恢复国会在国家政治中的主导地位，哪怕代价是削弱一定的总统的权力。"
  USA_Correct_the_financial_market:0 "纠正金融市场"
  USA_Correct_the_financial_market_desc:0 "大萧条以来，美国金融体系长期处于动荡之中。银行倒闭、资本流动失衡以及投机行为的泛滥，使得许多保守派经济学家认为金融体系已经偏离了其原本的功能。在加纳政府看来，国家经济的进一步恢复与崛起首先必须从造就新的市场秩序开始。联邦政府将重新审视银行与证券市场的监管体系，通过更加审慎的金融政策来限制过度投机，并恢复投资者对市场的信心。对于加纳及其支持者而言，金融市场不应成为政治实验的工具，而应重新成为稳定经济与促进商业发展的基础。"
  USA_Solve_the_bank_run_crisis_once_and_for_all:0 "一劳永逸解决挤兑危机"
  USA_Solve_the_bank_run_crisis_once_and_for_all_desc:0 "在经济危机最严重的时期，美国各地曾多次出现银行挤兑现象。储户对金融机构失去信任，导致银行体系陷入连锁崩溃的危险。虽然过去几年中联邦政府采取了一些紧急措施，但许多金融专家认为这些问题仍未彻底解决。\n\n加纳政府决定通过一系列制度改革来巩固银行体系，包括加强银行资本要求、完善存款保障机制以及推动各州银行体系之间的合作。通过恢复金融体系的稳定与信誉，美国将能够重新建立公众对银行系统的信任。"  
  USA_Oil_drilling_grassland_skyscrapers_and_mechanized_farms:0 "石油钻井，草原摩天大楼与机械化农场"
  USA_Oil_drilling_grassland_skyscrapers_and_mechanized_farms_desc:0 "在加纳的同僚们看来，加纳本人并非老派的农业民主党人，而是更加强调现代化与工业化的南方乡村的“异类”。在加纳政府的经济蓝图之中，美国未来的繁荣将建立在资源开发与农业现代化之上。从德克萨斯油田到中西部的大平原，美国拥有丰富的自然资源与广阔的土地，而这些资源仍然拥有巨大的发展潜力。政府将鼓励私人企业扩大石油开采、推进农业机械化并推动城市工业的发展。石油钻井平台、草原上的新型农业机械以及不断增长的城市天际线，将成为美国经济复兴的重要象征。" 
  USA_President_Lucas:0 "卢卡斯总统任期"
  USA_President_Lucas_desc:0 "斯科特·卢卡斯代表着民主党内部更温和的政治传统。作为一名来自中西部的民主党政治家，他既不是南方保守派的代表，也不是激进改革派的支持者。相反，卢卡斯一直试图在两者之间寻找一种更加温和而务实的政治道路。在卢卡斯总统看来，美国不需要剧烈的政治变革，而需要稳定而渐进的改革。"
  USA_Be_steady_rather_than_complacent:0 "稳健而非固步自封"
  USA_Be_steady_rather_than_complacent_desc:0 "经历多年经济危机与政治动荡之后，美国社会仍然处于一种微妙的平衡之中。许多人呼吁继续推进激进改革，而另一些人则希望完全回到旧有的经济秩序。斯科特·卢卡斯认为，这两种道路都可能再次将国家推向新的冲突。在卢卡斯看来，美国真正需要的是稳健而理性的政策。政府应当继续推进必要的经济改革，同时避免激进实验所带来的风险。通过谨慎而务实的政治路线，美国或许能够在稳定与进步之间找到一种新的平衡。"
  USA_Provide_necessary_subsidies_to_farmers:0 "予农民必要补贴"
  USA_Provide_necessary_subsidies_to_farmers_desc:0 "农业始终是美国经济的重要基础，尤其是在中西部地区，无数农民依赖土地维持生计。然而经济危机带来的价格波动与债务压力，使许多农场陷入困境。卢卡斯与他的幕僚们达成一致，联邦政府不应完全放任市场波动，而应为农民提供适度支持。通过农业补贴、信贷保障以及农产品价格稳定措施，政府将帮助农村地区恢复经济活力，同时避免过度干预市场。"
  USA_A_moderate_choice:0 "中道之选"
  USA_A_moderate_choice_desc:0 "在民主党内部，政治路线长期处于两种力量之间的拉扯。一方面是主张大规模社会改革的激进派，另一方面则是坚持传统财政保守主义的南方保守派。卢卡斯则试图在这两者之间寻找一种更加务实的政治道路。他主张保留部分旧有的保守政策以维持社会稳定，同时避免政府权力过度扩张。对于许多选民来说，这种温和而理性的路线或许正是当下美国最需要的政治选择。"
  USA_Fight_against_unfair_labor:0 "对抗劳动不公"
  USA_Fight_against_unfair_labor_desc:0 "随着工业化的不断发展，美国劳资关系也变得愈发复杂。工厂中的劳动条件、工资水平以及工人组织权利，逐渐成为国家政治争论的重要议题。卢卡斯认为，美国经济的长期稳定离不开公平的劳资关系。政府将推动更加合理的劳动法规，限制恶劣的工作条件，并鼓励劳资双方通过协商解决冲突。"
  USA_The_employment_support_for_the_people:0 "树立民众的就业后盾"
  USA_The_employment_support_for_the_people_desc:0 "经济危机的阴影仍然笼罩着美国社会。虽然许多产业已经逐渐恢复，但失业问题仍然困扰着大量普通家庭。对于卢卡斯政府而言，就业问题不仅是经济问题，更是社会稳定的关键。\n\n因此，政府将继续推动公共工程项目、基础设施建设以及地方经济发展计划，以创造更多就业机会。通过这些措施，联邦政府希望为普通民众提供一个可靠的就业保障体系。"
  USA_The_consensus_of_Democrats:0 "民主党人的共识"
  USA_The_consensus_of_Democrats_desc:0 "民主党在过去几十年中逐渐发展成为一个涵盖多种政治派系的大联盟。从南方保守派到北方城市自由派，从农业利益集团到工会组织，各种不同的政治力量共同构成了这个庞大的政党。在总统看来，民主党的真正力量正来自这种多元结构。通过在不同派系之间寻求妥协与合作，民主党可以维持党内团结，并继续在国家政治中扮演稳定力量的角色。"
  USA_President_Chandler:0 "钱德勒总统任期"
  USA_President_Chandler_desc:0 "阿尔本·巴克利·“哈皮”·钱德勒，这位来自肯塔基州的政治人物，一直以其鲜明的个性与强大的公众魅力而闻名。在南方政治传统与民粹主义情绪的影响之下，钱德勒逐渐塑造出一种不同于传统保守派的政治形象：既强调财政纪律与州权原则，也不回避通过政府行动来改善普通民众的生活。作为总统，他希望通过一系列务实政策恢复经济活力，并让民主党重新成为南方与中西部民众最可靠的政治代表。"
  USA_The_leader_of_fiscal_conservatism:0 "财政保守主义的领袖"
  USA_The_leader_of_fiscal_conservatism_desc:0 "在钱德勒看来，美国政府在过去几十年的经济政策中逐渐失去了财政纪律。联邦支出的不断增加不仅使国家债务迅速膨胀，也使政府在经济生活中的角色越来越庞大。钱德勒政府试图重新确立财政保守主义的核心原则。通过限制不必要的联邦支出、强化预算纪律并推动更加稳健的财政政策，政府希望在恢复经济信心的同时，为国家财政建立更加稳定的基础。"
  USA_Baseball_President:0 "棒球总统"
  USA_Baseball_President_desc:0 "在美国政治史上，很少有总统像钱德勒一样与体育运动紧密相连。作为一名狂热的棒球爱好者，他始终认为体育不仅是娱乐活动，更是美国社会文化的重要组成部分。总统本人相信，体育能够在政治分裂与社会矛盾之间建立一种共同的国家认同。从小镇球场到职业联赛，棒球象征着一种朴素而团结的美国精神。因此，在他的政治形象中，“棒球总统”不仅是一种绰号，也是一种象征——一个贴近普通民众生活的国家领导人。"
  USA_Rural_Road_Project:0 "乡村道路计划"
  USA_Rural_Road_Project_desc:0 "对于钱德勒而言，美国的未来不仅存在于大城市的工业与金融中心，也存在于广阔的乡村地区。长期以来，许多农村社区由于基础设施落后而难以获得经济发展的机会。为了改变这一状况，联邦政府将推动一项大规模的乡村道路建设计划。通过改善交通网络、连接农村市场以及促进农业运输，这些基础设施投资将帮助农村地区重新融入国家经济体系，同时为无数地方社区带来新的发展机会。"
  USA_The_necessity_of_racial_integration:0 "有限种族融合"
  USA_The_necessity_of_racial_integration_desc:0 "种族问题始终是美国社会中最为复杂而敏感的议题之一。作为一名来自南方的政治家，钱德勒深知这一问题所蕴含的巨大政治风险。然而，他同样意识到，美国社会正在逐渐发生变化。因此，钱德勒政府采取了一种相对谨慎而务实的立场。政府不会试图通过激进政策强行改变社会结构，但也不会完全忽视少数族群在教育、就业与公共生活中的基本权利。政府将会在未来长时间一步步落实种族平权政策，以同时确保社会的稳定与进步。"
  USA_A_loyal_ally_of_the_conservatives:0 "保守派的忠实盟友"
  USA_A_loyal_ally_of_the_conservatives_desc:0 "尽管钱德勒拥有鲜明的个人风格，但在国家政治舞台上，他始终被视为保守民主党阵营的重要成员。无论是在财政政策、州权问题还是国家安全事务上，他都与民主党内部的保守派保持着密切合作。在许多政治观察者看来，钱德勒能够在不同派系之间维持微妙的平衡。他既能够赢得南方保守派的信任，也能够在全国政治舞台上保持一定的独立性。"
  USA_Consumption_tax_not_sales_tax:0 "消费税，而非销售税"
  USA_Consumption_tax_not_sales_tax_desc:0 "随着联邦政府财政压力不断增加，税收制度的改革逐渐成为政治讨论的重要议题。传统的销售税制度在许多州已经存在多年，但一些经济学家认为这种税收方式可能会对地方经济产生不稳定影响。钱德勒政府因此提出了一种替代方案：通过更加系统化的消费税体系来取代分散的销售税政策。这种制度不仅能够提高税收效率，也能够在一定程度上减轻地方政府在财政管理上的负担。"
  USA_Strengthen_the_political_machinery_of_DP:0 "强化民主党政治机器"
  USA_Strengthen_the_political_machinery_of_DP_desc:0 "长期以来，民主党依靠地方政治机器维持其在美国政治中的影响力。从南方各州到北方城市，这些政治网络构成了民主党组织结构的重要基础。为了在新的政治环境中保持优势，党内领导层决定进一步强化这些地方政治机器。"
  USA_Protect_State_Right:0 "保护州权"
  USA_Protect_State_Right_desc:0 "州权问题始终是美国政治传统中的重要原则。从建国之初开始，各州在联邦体系中就拥有广泛的自治权。然而在过去几十年的政治变革之中，联邦政府的权力不断扩张，而州政府的权力则逐渐受到削弱。许多保守民主党人认为，这种趋势已经破坏了美国宪政体系原本的平衡。因此，政府将重新强调州政府在国家政治结构中的地位，并通过一系列立法措施恢复地方自治的权威。"
  USA_Support_expansion_of_the_National_Guard:0 "支持国民警卫队扩编"
  USA_Support_expansion_of_the_National_Guard_desc:0 "在美国的军事体系中，各州的国民警卫队始终扮演着重要角色。与常备军不同，这些部队既是国家防御力量的一部分，也代表着各州在国防体系中的参与。随着国际局势逐渐紧张，美国政府决定加强国民警卫队的建设。通过扩编部队、更新装备以及完善训练体系，国民警卫队将成为连接联邦政府与各州军事力量的重要纽带。"
  USA_The_powerful_support_of_the_media:0 "媒体的强大助力"
  USA_The_powerful_support_of_the_media_desc:0 "在现代政治时代，媒体已经成为影响公众舆论的重要力量。从报纸到广播，信息传播的速度与影响力正在迅速扩大。民主党领导层深知，如果想要在政治斗争中保持优势，就必须与媒体建立更加稳定的合作关系。通过争取新闻机构与广播网络的支持，政府希望能够更有效地向公众传达政策理念，并塑造有利于国家稳定的政治舆论环境。"
  USA_Band_with_Entente:0 "协约纽带？"
  USA_Band_with_Entente_desc:0 "随着世界局势逐渐紧张，美国外交政策也面临新的选择。欧洲已陷战火，而世界各地的政治联盟也正在重新调整，而美国是否应当更加积极地参与国际事务，成为华盛顿的重要议题。许多民主党人认为，美国应当加强与传统民主国家之间的合作。与协约国建立更加紧密的外交关系，不仅能够促进经济交流，也有助于维护国际秩序。"
  USA_A_beacon_of_conservatism_for_Americans:0 "美利坚人的保守主义灯塔"
  USA_A_beacon_of_conservatism_for_Americans_desc:0 "在保守民主党人的政治愿景之中，美国应当成为一个稳定而有序的民主国家。它既不会追随激进政治实验，也不会放弃自身的自由传统。国家的发展应当建立在财政稳健、地方自治与社会秩序的基础之上。在这一理念之下，美国被描绘成一座象征稳定与传统价值的灯塔。对于许多支持者来说，这不仅是一种政治口号，更是一种关于国家未来的理想。"
  USA_Dixie_is_making_a_comeback:0 "迪克西卷土重来"
  USA_Dixie_is_making_a_comeback_desc:0 "几十年来，南方始终是民主党的根基。从弗吉尼亚到乔治亚，从密西西比河流域到得克萨斯平原，无数地方政治家、农民与退伍军人共同塑造了人们口中的"迪克西"。战争早已结束，但属于南方的政治传统从未真正消失。随着新的政治格局逐渐形成，这片土地再次发出了自己的声音。它未必希望支配整个美国，却要求华盛顿重新倾听南方人民对于自治、传统与地方权利的诉求。"
  USA_President_Russell:0 "罗素总统任期"
  USA_President_Russell_desc:0 "对于许多南方民主党人而言，共和国最稳定的力量从来不是华盛顿，而是遍布各州的地方社区、家庭教堂与自治政府。理查德·罗素并不自诩改革家，也不打算推翻罗斯福时代留下的一切。他希望以更加稳健、更加克制的方式引导民主党重新回归传统，在维护地方利益、农业经济和财政秩序之间取得新的平衡。或许有人认为这样的道路缺乏激情，但共和国需要的从来不是一时的狂热，而是能够长久维系国家稳定的责任感。"
  USA_Moderate_progress_under_the_banner_of_democracy:0 "民主旗帜下的温和进步"
  USA_Moderate_progress_under_the_banner_of_democracy_desc:0 "民主党并非拒绝改革，我们只是相信改革应当服务于人民，而不是服务于意识形态。学校、道路、医院、农村电力以及农业援助都值得继续完善，但共和国同样不能因此放弃财政责任与地方自治。真正成功的进步，应当像春雨一般润物无声，而不是用一场政治风暴推翻整个社会。南方民主党愿意推动改变，但绝不会为了改变而改变。"
  USA_Affordable_school_meals_and_food_vouchers:0 "平价校餐与食品券"
  USA_Affordable_school_meals_and_food_vouchers_desc:0 "许多乡村学校至今仍难以保证孩子们每天都能吃上一顿热饭。一个饥饿的孩子无法专心学习，一个贫困的家庭也难以摆脱贫困。政府将扩大校餐计划，并向真正有需要的家庭提供食品援助，让更多儿童能够健康成长。这不仅是一项社会福利，更是一项面向未来的投资——因为今天餐桌上的一块面包，或许便是共和国未来的一位教师、军官或工程师。"
  USA_End_fiscal_conservatism:0 "终止财政保守主义"
  USA_End_fiscal_conservatism_desc:0 "平衡预算固然值得尊敬，但若将其奉为不可动摇的教条，政府便可能失去应对危机的能力。当经济停滞、农产品价格暴跌、失业不断扩大时，国家有责任适度采取更加积极的财政政策。南方民主党并不赞成无限制扩大政府规模，却相信公共投资能够帮助地方恢复活力。财政应当服务人民，而不是让人民屈从于一串冰冷的数字。"
  USA_Towards_local_autonomy:0 "推进地方自治"
  USA_Towards_local_autonomy_desc:0 "没有哪个联邦官员比县治安官更了解当地社区，没有哪个华盛顿的办公室比州议会更清楚本州人民真正需要什么。美国能够成为联邦共和国，正是因为权力并非集中于首都，而是分散于五十个州以及无数自治社区。民主党将进一步扩大地方政府的财政自主权和行政权限，让教育、公共建设以及农业事务更多交由州政府自行决定，使联邦重新回归建国者最初设想的平衡。"
  USA_Strong_national_defense:0 "强力国防，不可动摇"
  USA_Strong_national_defense_desc:0 "乔治·华盛顿曾告诫后人，应当为和平做好准备。南方民主党同样相信，美国人民热爱和平，但和平绝不能建立在软弱之上。政府将继续发展陆军、海军和航空工业，加强训练与装备建设，同时避免将共和国卷入不必要的海外冲突。只有拥有足够的力量，美国才能真正拥有选择和平的权利，而不是被战争所迫。"
  USA_Shelter_farmers_in_the_south:0 "庇护南部农民"
  USA_Shelter_farmers_in_the_south_desc:0 "棉花、烟草、花生与玉米塑造了南方，也养育了数百万依靠土地生活的家庭。然而，市场价格波动、自然灾害以及不断变化的经济环境，使越来越多小农场难以维持生计。政府将继续提供农业贷款、价格支持与农村基础设施建设，帮助真正耕种土地的人渡过难关。民主党不会忘记，是这些沉默寡言的农民，在共和国最困难的时候始终支撑着美国的大地；他们值得得到国家的尊重，也值得拥有更加稳定的未来。"
  USA_President_Byrd:0 "伯德总统任期"
  USA_President_Byrd_desc:0 "如果说美国政治仍然保留着十九世纪民主党的影子，那么哈里·伯德无疑便是这一传统最坚定的继承者。从弗吉尼亚州议会到联邦参议院，他始终坚持财政纪律、地方自治以及高效务实的行政理念。对于伯德而言，优秀的政府并非规模最大的政府，而是最节俭、最廉洁、最能够兑现承诺的政府。在新的时代，这位来自弗吉尼亚的民主党人希望让全国相信：共和国真正需要的不是不断扩张的权力，而是一届懂得克制自己的政府。"
  USA_Promote_the_Virginia_Model:0 "推广弗吉尼亚模式"
  USA_Promote_the_Virginia_Model_desc:0 "长期以来，弗吉尼亚州始终以稳健高效的财政管理、精简务实的行政体系以及地方自治传统闻名全国。伯德相信，这套由州政府、县政府与地方社区共同维系的治理模式，同样能够成为整个美国的典范。联邦政府将借鉴弗吉尼亚在预算管理、公务员制度以及地方财政上的成功经验，让更多州建立起廉洁、高效且责任明确的行政体系，使政府真正成为纳税人的管理者，而非他们的负担。"
  USA_Byrd_Organization:0 "授权并强化伯德组织"
  USA_Byrd_Organization_desc:0 "任何一项政策若想真正落实，最终都离不开遍布基层的地方组织。数十年来，伯德组织依托县政府、地方民主党委员会以及社区领袖，建立起一套高效且纪律严明的政治网络，使弗吉尼亚能够长期保持稳定而持续的施政能力。政府将进一步强化地方党组织与行政机关之间的协调机制，培养更多熟悉基层事务的公共管理人才，让民主党不仅能够赢得选举，更能够长期赢得人民的信任。"
  USA_National_Highway_Act:0 "国家公路法案"
  USA_National_Highway_Act_desc:0 "一条宽阔平坦的公路，不仅能够连接两座城市，更能够连接整个国家。早在担任弗吉尼亚州长时期，伯德便将修建现代化公路视为推动经济发展的首要任务。"好路运动"证明，每修建一英里的公路，都会带来新的工厂、市场与就业机会。如今，联邦政府将启动覆盖全国的公路建设计划，改善州际运输，加强城乡联系，让美国工业、农业和商业都能沿着纵横交错的道路不断前进。"
  USA_The_scenery_of_the_national_park:0 "国家公园的风光"
  USA_The_scenery_of_the_national_park_desc:0 "真正属于美国的财富，并不仅仅是钢铁工厂和摩天大楼，还有阿巴拉契亚山脉的森林、落基山的雪峰以及无数代美国人共同守护的自然风光。作为弗吉尼亚州的重要建设者之一，伯德始终支持国家公园与风景道路的发展，使自然资源能够在保护中创造新的经济价值。政府将继续完善国家公园体系，修建观光公路、游客中心与森林设施，让更多美国家庭能够亲身领略共和国壮丽的大地。"
  USA_A_new_government_that_is_strictly_thrifty:0 "严格节约的新政府"
  USA_A_new_government_that_is_strictly_thrifty_desc:0 "哈里·伯德有一句广为流传的政治信条：现收现付。在他看来，政府就如同一个普通家庭，不应长期依赖借债维持生活，更不应把今天的账单留给下一代美国人。新的民主党政府将全面推行严格预算制度，削减冗余机构，审查各项公共支出，坚持"现收现付"原则管理国家财政。节约并非吝啬，而是共和国能够长期繁荣最可靠的保障。"
  USA_Strengthen_intensity_of_immigration_review:0 "加大移民审查力度"
  USA_Strengthen_intensity_of_immigration_review_desc:0 "美国始终欢迎愿意建设共和国的新公民，但任何国家都有责任维护自己的边境秩序和社会稳定。随着国际局势愈发复杂，政府将进一步完善移民审查程序，加强背景调查与入境管理，确保每一位新移民都能够真正认同美国宪法、遵守法律并融入社区生活。民主党的目标不是关闭美国的大门，而是在秩序之中继续保持美国作为移民国家的活力。"
  USA_Southern_Manifesto:0 "南方之声"
  USA_Southern_Manifesto_desc:0 "长期以来，南方不仅塑造了民主党的历史，也深刻影响着整个共和国的发展。从杰斐逊到杰克逊，从乡村法院到州议会，这片土地始终坚守着地方自治、财政责任与社区共同体的政治传统。如今，随着民主党重新完成整合，来自迪克西的声音将再次回荡于华盛顿。我们并非要求全国都成为南方，而是希望共和国重新倾听那些长期扎根土地、忠于宪法、服务地方人民的美国人。"
  USA_extremely_powerful_conservative_alliance:0 "强大无比的保守联盟"
  USA_extremely_powerful_conservative_alliance_desc:0 "保守主义并非属于某一个州，也并非属于某一个政党。无论是南方民主党人、中西部农民、边疆州的地方领袖，还是重视家庭、教会与社区价值的普通美国人，都共同期待一个更加稳定、更加负责任的共和国。民主党将团结所有尊重宪法、维护联邦制度、反对极端政治的人士，共同建立一个跨越地区与阶层的保守联盟，使美国重新回归团结、秩序与常识。"
  USA_Rectify_the_Democratic_Party_organization:0 "整顿民主党组织"
  USA_Rectify_the_Democratic_Party_organization_desc:0 "任何一个执政党若想长久赢得人民信任，都必须不断更新自身。过去几十年间，民主党在快速扩张的同时也逐渐暴露出组织松散、地方协调不足以及纪律不一等问题。新的党中央将重新整顿各州党部，完善干部培养制度，加强地方组织之间的联系，并鼓励更多年轻而富有责任感的公共服务者加入民主党的行列。"
  USA_Promote_constitutional_democracy:0 "宣扬宪政民主"
  USA_Promote_constitutional_democracy_desc:0 "美国从来不仅仅是一场选举，更是一套历经百余年检验的宪政制度。多数人的意志固然值得尊重，但任何权力都必须受到法律约束，任何政府也都必须接受宪法限制。民主党将继续维护联邦制度、三权分立以及州与联邦之间的权力平衡，使民主建立在法治之上，而非法治屈从于民主。"
  USA_Expel_the_remnants_of_syndicalism:0 "驱逐赤色余毒"
  USA_Expel_the_remnants_of_syndicalism_desc:0 "内战虽然已经结束，但激进主义留下的阴影仍未彻底散去。一些鼓吹阶级斗争、暴力革命以及否定私有财产制度的思想，依然试图借助工会、校园乃至地方组织重新传播。民主党不会因政治立场而压制合法意见，却绝不会容忍任何试图推翻共和国制度的极端运动。美国欢迎改革，也欢迎批评，但绝不会向革命屈服。"
  USA_fair_practical_and_traditional_America:0 "公正，实用与传统的美国"
  USA_fair_practical_and_traditional_America_desc:0 "美国并非建立于空洞的理想，也并非建立于永无止境的革命，而是建立于普通家庭的勤劳、地方社区的互助以及一代又一代公民对宪法的信任。南方民主党人相信，一个真正伟大的共和国，应当既保持公平，也坚持务实；既尊重传统，也能够顺应时代；既维护个人自由，也承担共同责任。这并不是某一种新的政治哲学，而是美国百余年来赖以繁荣的根本所在。未来的民主党，将继续守护这样一个公正、实用而传统的美国。"
  USA_The_wisdom_of_the_Liberal_Democrats:0 "自由民主党人的智慧"
  USA_The_wisdom_of_the_Liberal_Democrats_desc:0 ""美国是一片不断变化的土地。从纽约港登陆的新移民，到芝加哥的工人，再到波士顿的教师与旧金山的商人，每一天都有新的梦想在这片大陆上生根发芽。自由民主党相信，共和国真正的力量并不来自统一，而来自包容；不来自僵化，而来自不断适应新时代。传统值得尊重，但只有不断改革、不断完善制度，美国才能始终保持年轻，始终成为那个给予每个人希望的国家。"
  USA_President_Smith:0 "史密斯总统任期"
  USA_President_Smith_desc:0 "阿尔弗雷德·E·史密斯并非出身名门。他成长于纽约下东区，在码头、工厂和拥挤的街区之间认识了真正属于美国城市的一切。贫困、移民、宗教偏见与社会流动，共同塑造了他的政治理念。他始终相信，一个政府最重要的职责，不是替人民规划人生，而是为每一个努力工作的人创造向上流动的机会。如今，这位来自纽约的民主党人，将把城市自由主义带向整个共和国。"
  USA_Condemn_all_racial_violence:0 "谴责一切种族暴力"
  USA_Condemn_all_racial_violence_desc:0 "无论暴力披着怎样的旗帜，它都无法成为文明社会的一部分。近年来，一些极端组织试图利用种族、宗教乃至民族矛盾制造恐惧与分裂，这不仅违背了法律，也违背了美国赖以立国的原则。史密斯政府将依法打击私刑、恐怖活动和一切针对少数群体的暴力行为，保护每一位守法公民的人身安全。真正强大的美国不需要仇恨维系团结，而需要法律维护正义。"
  USA_Give_back_to_urban_voters:0 "回馈城市选民"
  USA_Give_back_to_urban_voters_desc:0 "去几十年，美国的城市以前所未有的速度扩张。无数工厂、码头、铁路与办公楼拔地而起，也吸引了来自世界各地的新居民。然而，住房短缺、交通拥堵以及公共服务不足，同样成为现代城市必须面对的问题。联邦政府将同各大城市合作，改善住房、公共交通、市政设施和社区建设，让那些创造美国工业奇迹的城市居民，也能够分享共和国发展的成果。"
  USA_Economic_progressivism_belonging_to_Smith:0 "属于史密斯的经济进步主义"
  USA_Economic_progressivism_belonging_to_Smith_desc:0 "机会与繁荣并非彼此对立，它们本就是同一枚硬币的两面。经济进步主义并不意味着让政府接管市场，而意味着帮助市场运行得更加公平、更有效率。政府将改善劳动条件、规范金融秩序、投资基础设施，并鼓励企业扩大就业，而不会以行政命令取代市场本身。史密斯相信，一个充满活力的经济，应当由自由企业和负责任的公共政策共同塑造。"
  USA_Reduce_federal_intervention:0 "无改革，不民主"
  USA_Reduce_federal_intervention_desc:0 "共和国不会因为改革而衰弱，只会因为停滞而失去未来。民主从来不是一套静止不变的制度。如果一个政府拒绝改革，它终将与人民渐行渐远；如果一部法律不能回应新时代，它也终将失去存在的意义。真正的民主，应当拥有不断修正自身的勇气。史密斯政府将继续推进行政改革、提高政府效率、精简冗余机构，使联邦政府更加灵活、更具责任感，也更加贴近人民的真实需求。"
  USA_Oppose_religious_hostility:0 "反对宗教敌视"
  USA_Oppose_religious_hostility_desc:0 "阿尔·史密斯曾因自己的天主教信仰而遭受无数偏见，也因此更加明白宗教宽容对于共和国的重要意义。美国从来不是一个只有一种信仰的国家，新教徒、天主教徒、犹太教徒以及其他宗教群体共同构成了这个国家丰富多彩的社会。政府不会偏袒任何一种宗教，也不会允许任何人因为自己的信仰而遭受歧视。信仰属于每个人的良心，而共和国属于所有美国人。"
  USA_Individualism_and_Economic_Opportunities:0 "个人主义与经济机会"
  USA_Individualism_and_Economic_Opportunities_desc:0 "美国梦从来不是人人获得相同的财富，而是人人拥有相同的机会。真正的个人主义，并非孤立无援，而是每一个普通人都能够凭借自己的能力改变命运。政府将创造更加公平的竞争环境，扩大教育、就业和创业机会，减少那些阻碍社会流动的壁垒，让无论出身纽约贫民区还是中西部小镇的年轻人，都能够拥有实现梦想的可能。机会，应当成为共和国给予每一位公民最珍贵的礼物。"
  USA_President_Willkie:0 "威尔基总统任期"
  USA_President_Willkie_desc:0 "温德尔·威尔基并不是传统意义上的职业政客。他曾是一名律师、一位企业管理者，也是一位相信美国能够不断自我更新的自由主义者。正因为长期游走于商业、法律与公共事务之间，他更加相信，一个现代国家既需要充满活力的市场，也需要维护公平的政府；既需要竞争，也需要合作。威尔基希望带领美国走向一个更加开放、自信而富有责任感的新时代，让共和国不仅成为自由的典范，也成为世界民主力量的重要支柱。"
  USA_Be_influenced_by_business_consultants:0 "接受企业顾问影响"
  USA_Be_influenced_by_business_consultants_desc:0 "企业界积累的不仅仅是财富，更是组织管理、技术创新与资源配置的丰富经验。威尔基相信，政府不应拒绝来自工商界的专业意见，而应建立更加开放的咨询机制，使企业家、经济学家、工程师和公共管理专家共同参与国家建设。当然，最终作出决定的依旧是人民选出的政府，但如果能够吸收更多专业智慧，美国便能够少走许多弯路。"
  USA_Humanity_and_compassion:0 "人道与同情"
  USA_Humanity_and_compassion_desc:0 "文明社会的伟大，并不仅仅体现在工业和财富之上，更体现在它如何对待那些需要帮助的人。无论是失业者、退伍军人、残疾人士，还是因战争而流离失所的难民，他们都不应被遗忘。威尔基始终相信，自由与人道并不矛盾，一个真正强大的共和国，应当拥有保护弱者的能力，也拥有理解不同民族、不同文化的胸怀。只有怀着同情心，自由才能真正成为所有人的自由。"
  USA_Countryside_club:0 "“乡村俱乐部”总统"
  USA_Countryside_club_desc:0 "有人戏称威尔基是一位"乡村俱乐部总统"，因为他既能够出入企业董事会，也能够同普通选民坐下来交谈。但对于威尔基而言，这并非讽刺，而是一种期待。一个优秀的总统，应当能够倾听企业家的建议，也能够理解农民、工人和教师的困难。政治不应属于某一个阶层，而应成为不同群体彼此沟通、共同合作的平台。"
  USA_Defend_the_democratic_lifestyle:0 "保卫民主生活方式"
  USA_Defend_the_democratic_lifestyle_desc:0 "民主并不仅仅意味着投票，更意味着新闻自由、独立司法、自由结社以及每一个普通人决定自己未来的权利。当极权主义不断向世界蔓延，美国更应证明，自由社会同样能够拥有繁荣、效率与凝聚力。威尔基政府将坚定维护共和国的民主制度，捍卫每一位公民的基本权利，使美国继续成为自由世界最值得信赖的榜样。"
  USA_Wilkie_moment:0 "威尔基时刻"
  USA_Wilkie_moment_desc:0 "历史总会在某一个瞬间，要求一个国家重新回答"我们究竟是谁"。对于美国而言，现在正是这样的时刻。威尔基并不希望人民因为恐惧而团结，也不希望国家因为仇恨而强大。他希望美国重新相信自己的制度，相信自己的人民，相信自由能够战胜专制，相信开放能够战胜孤立。或许几十年后，人们会将今天称作"威尔基时刻"——那个美国重新拥抱未来的时代。"
  USA_Full_Employment_Scheme:0 "充分就业计划"
  USA_Full_Employment_Scheme_desc:0 "失业不仅意味着收入减少，更意味着一个人的尊严与希望受到打击。政府将与地方政府、企业和工会共同合作，扩大基础设施建设，鼓励私人投资，并完善职业培训体系，为更多美国人创造稳定而有尊严的工作岗位。充分就业并不是一句政治口号，而是一项关系到整个共和国繁荣与稳定的长期承诺。一个拥有工作的美国，也将拥有更加光明的未来。"
  USA_President_Barkley:0 "巴克利总统任期"
  USA_President_Barkley_desc:0 "阿尔本·巴克利并非美国最耀眼的政治明星，却始终是民主党最忠诚、最可靠的建设者。从肯塔基州的小镇到参议院讲坛，他始终相信，一个共和国真正的伟大，不在于少数人的成功，而在于普通人民是否拥有体面的生活。作为罗斯福新政最坚定的支持者之一，巴克利希望延续改革精神，同时赋予它新的时代意义。对于他而言，民主不仅意味着选举，更意味着每一位美国人都能够感受到国家给予自己的希望。"
  USA_Criticize_immoral_evil_deeds:0 "批判不义"
  USA_Criticize_immoral_evil_deeds_desc:0 "一个国家的法律能够约束犯罪，却未必能够消除冷漠。贫困、剥削、种族仇恨以及利用权力谋取私利，都不仅仅是政治问题，更是不容忽视的道德问题。巴克利始终认为，政府不能对这些现象保持沉默。共和国或许无法消灭所有的不公，却应始终站在正义的一边，勇敢谴责一切损害人民尊严与社会良知的不义行为。一个拥有道德勇气的国家，才能真正赢得人民的信任。"
  USA_Bring_up_the_new_freedom_policy_again:0 "重提“新自由”政策"
  USA_Bring_up_the_new_freedom_policy_again_desc:0 "三十年前，伍德罗·威尔逊提出"新自由"的理念，希望让竞争重新回归市场，让普通美国人拥有更多发展的机会。虽然时代已经发生改变，但自由、公平与责任依然值得民主党坚持。巴克利政府将在继承新政成果的同时重新发扬"新自由"精神，通过完善反垄断制度、保护劳动者权益以及鼓励公平竞争，使自由经济真正服务于每一位美国人，而不仅仅属于少数幸运者。"
  USA_The_importance_of_relief_policies_is_irreplaceable:0 "救济政策的重要性无可替代"
  USA_The_importance_of_relief_policies_is_irreplaceable_desc:0 "大萧条留下的伤痕告诉美国人民，当市场失去活力时，共和国不能袖手旁观。无论是公共工程、失业救济还是社会保障，新政的许多措施都帮助无数家庭重新站了起来。巴克利相信，救济并不是永久依赖，而是一座帮助人民重新出发的桥梁。政府将在坚持财政责任的基础上继续完善社会保障体系，使每一位遭遇困难的美国人都不会被国家所遗忘。"
  USA_Restore_affordable_agricultural_products:0 "恢复平价农业品"
  USA_Restore_affordable_agricultural_products_desc:0 "美国的繁荣离不开城市，也离不开广袤的农田。过去几年，农产品价格的大幅波动让无数家庭农场陷入困境，也让城市居民承担了更高的生活成本。政府将进一步完善农业价格支持制度，扩大农村贷款和农业合作社建设，在保障农民合理收入的同时稳定市场供应，使生产者与消费者都能够从稳定、公平的农业体系中受益。"
  USA_Implement_the_Civil_Rights_Act:0 "民权的初步尝试"
  USA_Implement_the_Civil_Rights_Act_desc:0 "民主党承认，共和国距离真正实现人人平等仍有漫长的道路。许多美国公民依然因为肤色、民族或出身而遭遇不公，而这些问题无法继续被忽视。巴克利政府将首先推动联邦层面的反私刑立法，加强对公民基本权利的保护，并逐步扩大少数族裔获得教育、就业与司法保障的机会。这或许只是迈出的第一步，却也是共和国走向更加公平未来的重要一步。"
  USA_Strong_Iron_Man_President:0 "坚强的铁人总统"
  USA_Strong_Iron_Man_President_desc:0 "无论是在参议院彻夜辩论，还是乘坐火车奔赴全国各地发表演讲，阿尔本·巴克利总是以近乎无穷无尽的精力投入工作。有人称他为"铁人"，不仅因为他从不轻言疲倦，更因为他始终保持着乐观与坚定。即使面对经济困难、党派争执或国际危机，他依然相信，美国人民拥有战胜一切挑战的勇气。总统的职责，不只是制定政策，更是在困难时期给予整个国家继续前行的信心。"
  USA_Necessary_public_education:0 "必要的公众教育"
  USA_Necessary_public_education_desc:0 "民主制度的根基，从来不是选票本身，而是拥有独立思考能力的公民。一个受过良好教育的社会，更能够抵御谣言、偏见与极端主义的侵蚀，也更能够培养出优秀的工人、教师、科学家与公务人员。民主党将继续扩大公共教育投入，改善乡村学校和城市学区的教学条件，提高教师待遇，鼓励更多年轻人接受高等教育。教育不仅改变个人命运，也决定共和国未来的方向。"
  USA_Support_patriotic_Hollywood:0 "资助爱国主义的好莱坞"
  USA_Support_patriotic_Hollywood_desc:0 "电影是一面映照时代的银幕，也是一扇让世界了解美国的窗口。从西部拓荒到独立战争，从普通工人的奋斗到移民家庭的梦想，好莱坞讲述的不只是故事，更是一种属于共和国的精神。政府将鼓励电影产业创作更多展现自由、民主、勇气与团结的优秀作品，同时继续尊重艺术创作的独立性。真正的爱国主义，并非来自命令，而是来自那些能够激励人民热爱自己国家的故事。"
  USA_Commercial_financial_subsidy:0 "提出商业金融补贴"
  USA_Commercial_financial_subsidy_desc:0 "现代经济的发展，不仅需要市场的活力，也需要政府在关键时期提供适当支持。政府并非市场的主人，而应成为市场最可靠的合作伙伴。对于那些具有战略意义的新兴产业、中小企业以及面临短期困难却仍具发展潜力的商业机构，联邦政府将建立更加完善的金融扶持机制，通过低息贷款、信用担保和产业基金帮助企业恢复活力。"
  USA_A_stable_American_family:0 "安稳的美利坚家庭"
  USA_A_stable_American_family_desc:0 "一个繁荣的国家，应当建立在千千万万个安定幸福的家庭之上。稳定的就业、负担得起的住房、优质的教育以及可靠的医疗服务，共同构成了家庭生活最坚实的基础。民主党将继续完善社会保障体系，支持青年家庭、退伍军人与劳动者改善生活条件，让每一位勤劳工作的美国人都能够建立属于自己的家庭，并对子女的未来充满信心。"
  USA_Morality_and_good_governance:0 "道德与良政"
  USA_Morality_and_good_governance_desc:0 "共和国的强盛不仅取决于经济增长和工业发展，也取决于政府是否值得人民信赖。法律能够规范行为，道德则塑造政府的品格。民主党认为，廉洁、诚实、责任与公开，应当成为每一位公职人员最基本的准则。一个真正优秀的政府，不会因为权力而脱离人民，也不会因为利益而背离原则。只有建立在公共道德基础上的政治，才能赢得人民长久的信任。"
  USA_Protect_American_symbol_of_freedom:0 "保卫美国自由象征"
  USA_Protect_American_symbol_of_freedom_desc:0 "自由女神像矗立于纽约港，林肯纪念堂静静凝望着国家首都，独立厅见证了共和国的诞生。这些建筑不仅是历史遗迹，更承载着美国人民对于自由、平等与民主的共同记忆。民主党将继续保护国家纪念设施、历史文化遗产以及象征共和国精神的重要公共机构，使一代又一代美国人都能够从中汲取继续建设自由社会的力量。守护这些象征，也是在守护美国共同的历史与未来。"
USA_macauthurs_victory:0 "叛贼授首"
  USA_macauthurs_victory_desc:0 "随着最后几支叛军部队被解除武装，第二次美国内战终于走向尾声。那些曾经宣称要推翻联邦政府的势力，要么在战场上被击溃，要么逃往边境之外，剩余的领导人则被联邦军队逐一拘押。数月之前还遍布全国的前线与封锁线，如今正在逐渐消失。\n\n然而胜利并不意味着问题的终结。大片州域的行政机构在战争中瘫痪，铁路与工业体系遭到严重破坏，大量武装人员仍然散落在各地。军事胜利只是第一步，真正的任务是重建一个能够运作的国家。在秩序完全恢复之前，联邦政府将继续以战时体制维持对全国的控制。"
  USA_nationwide_martial_law:0 "非常时刻，雷霆手段"
  USA_nationwide_martial_law_desc:0 "内战结束并未立即带来稳定。许多城市仍然充斥着武装退伍军人、失业劳工与政治激进分子，地方政府也在战争中严重削弱。为了防止新的骚乱与武装冲突爆发，战争部宣布在全国范围内维持戒严状态。在戒严法令之下，军队将直接负责主要城市的治安管理，交通枢纽、港口与铁路系统也将由军方监督运作。对于许多美国人而言，这意味着一个陌生的时代——军队将成为国家稳定的最终保障。"
  USA_My_ignorant_colleagues:0 "我愚昧的同僚们..."
  USA_My_ignorant_colleagues_desc:0 "在战后的政治讨论中，越来越多的政客开始公开批评军政府的紧急措施，要求尽快恢复传统的党派政治与选举制度。而西部军区那些叛徒，嘴上高声呼喊着为了民主的口号，实际上一切不过是他们反对麦克阿瑟的功绩的借口。为了快速扼杀任何可能威胁刚刚稳定的时局的不安定因素，联邦政府将以最快的速度镇压这些西部叛匪。"
  USA_Commit_to_the_Engineering_Corps:0 "我们的好小伙们"
  USA_Commit_to_the_Engineering_Corps_desc:0 "战争不仅摧毁了城市与铁路，也让全国基础设施陷入瘫痪。桥梁被炸毁，铁路枢纽破败不堪，许多重要工业设施也在战斗中受损。为了尽快恢复国家运转，战争部决定大规模动员陆军工程兵团投入重建工作，他们将承担修复铁路、桥梁与港口设施的任务，同时协助各州重建通信与电力系统。麦克阿瑟政府认为，军队不仅是战争机器，也是一支能够重建国家的力量。"
  USA_Special_Authorization:0 "特别授权"
  USA_Special_Authorization_desc:0 "在重建工作的初期阶段，传统的行政程序往往显得过于缓慢。无论是拨款修复铁路，还是重新组织地方行政机构，许多决策都需要经过冗长的审批流程。为了解决这一问题，战争部向临时政府提出了一项特别授权法案。该法案将赋予中央政府在重建期间更大的行政裁量权，使其能够绕过部分繁琐程序，直接调动资源与人力。在当前局势下，快速行动比制度争论更加重要。"
  USA_Commend_model_citizens:0 "表彰模范公民"
  USA_Commend_model_citizens_desc:0 "在战争的阴影之中，仍有许多普通美国人选择站在联邦一边。铁路工人冒着危险维持运输线路，地方志愿者组织守卫城市街区，许多企业也在战时生产中承担了重要责任。为了重建社会信心，政府决定公开表彰这些“模范公民”。通过授予荣誉证书、公共表彰与经济奖励，联邦政府希望向全国传达一个信号：国家并非仅靠军队赢得战争，普通民众同样是这场胜利的重要力量。在经历了长期分裂之后，这种象征性的团结行动被视为恢复社会信任的重要一步。"
  USA_Revitalize_the_national_spirit:0 "重振国家精神"
  USA_Revitalize_the_national_spirit_desc:0 "内战留下的不仅是废墟，还有深刻的心理创伤。许多社区因战争而分裂，邻里之间的信任也被政治对立所破坏。为了避免这种裂痕继续扩大，政府开始推动一系列强调国家团结的宣传活动。从学校教育到公共演讲，从退伍军人纪念活动到全国性的纪念仪式，各级政府都被鼓励重新强调昭昭天命的概念。麦克阿瑟政府相信，只有在精神上重新建立国家认同，美国才能真正从战争中恢复。"
  USA_Everyone_needs_to_contribute:0 "艰苦时刻，人人需要奉献"
  USA_Everyone_needs_to_contribute_desc:0 "战争的代价远超许多人的预期。联邦财政负担沉重，大量工业设施需要重建，数百万退伍军人也需要重新融入社会。面对这样的局面，政府呼吁全国民众共同承担重建责任，而大企业则自然被要求为国家奉献更多。新的税收政策与劳工计划被提出，以确保国家能够迅速恢复生产能力。而金融家，银行，垄断集团则不得不付出巨大的代价以偿还麦克阿瑟政府保卫他们不受联合工团或联盟国的迫害。对于所有美国人来说，这意味着一段艰苦但必要的时期，但时间会证明一切的必要性。"
  USA_There_is_nothing_else_but_patriotism:0 "除却拳拳爱国心，别无他物"
  USA_There_is_nothing_else_but_patriotism_desc:0 "在经历了多年政治分裂与内战之后，许多人开始质疑美国社会是否仍然拥有共同的信念。不同的党派、意识形态与地区利益曾经将国家推向深渊，而战后的美国必须寻找新的凝聚点。麦克阿瑟政府因此不断强调一种简单而直接的理念——爱国主义。无论政治立场如何，国家的生存与统一都应当置于一切争论之上。在最危难的时刻，正是无尽的爱国心指引麦克阿瑟挺身而出为国家稳定时局，击败分裂势力。无论是对民众，抑或是同僚，又或者是历代先贤，麦克阿瑟都无愧于心。"
USA_America_was_reborn_here:0 "美利坚于此重生"
  USA_America_was_reborn_here_desc:0 "硝烟散去之后，留给美国人的并非胜利者应有的欢呼，而是一片需要重新拼合的国土。铁路断裂，工厂停摆，农田荒芜，无数城市仍在清点失去的家庭与未归的士兵。然而，旧日的裂痕并不能决定共和国的未来。联邦政府将从废墟中恢复行政秩序，帮助流离失所者返回家园，并让星条旗重新成为全体美国人的共同象征。我们不会简单复原那个走向内战的旧美国；一个更加团结、更具力量的国家，将在此重生。"
  USA_Cincinnatus_of_America:0 "美利坚的辛辛纳图斯"
  USA_Cincinnatus_of_America_desc:0 "在罗马共和国的古老传说中，农夫辛辛纳图斯在国家危难之际被召唤为独裁官，在击退敌人之后又主动归还权力，重新回到自己的农田之中。这个故事被广泛传颂，被视为共和美德的象征。第二次内战结束后，道格拉斯·麦克阿瑟将军以恢复秩序为名掌握了国家权力，而随着国家逐渐走出战争阴影，越来越多的人开始以辛辛纳图斯的典故来形容这位将军，只因他在稳定局势之后将权力重新交还给民选政府，恢复了民主选举。美国人民应该为此感到庆幸，麦克阿瑟将军凭借对民主的忠诚与其高洁的品行真正保卫了民主制度。"
  USA_tyrant_was_eventually_brought_to_justice:0 "暴君终伏诛！"
  USA_tyrant_was_eventually_brought_to_justice_desc:0 "内战之后，美国曾短暂地处于军政府的统治之下。道格拉斯·麦克阿瑟将军以恢复秩序为名掌握国家权力，并以紧急状态为依据延长军方对政治生活的控制。然而随着局势逐渐稳定，军政府的存在开始引发越来越多的反对声音。随着权力格局迅速改变，麦克阿瑟被迫离开权力中心，而军政府体系也随之瓦解。对于许多人而言，这不仅是麦克阿瑟本人野心的失败，更是共和国的民主制度对其自身的英勇捍卫。"
  USA_highest_honor_of_patriot:0 "爱国者的最高荣誉"
  USA_highest_honor_of_patriot_desc:0 "第二次内战的胜利以及随后的国家稳定，离不开包括总司令麦克阿瑟在内等无数军人的牺牲与努力。无论是在战场上浴血奋战的士兵，还是在战后维持秩序与重建国家的军官，武装力量在国家危难之际承担了沉重责任。随着国家逐步恢复宪政秩序，联邦政府决定以国家的名义表彰那些在非常时期保卫共和国的军人与指挥官。这不仅是对战争贡献的纪念，也是对军队忠诚与纪律精神的肯定。"
  USA_Armed_forces_back_on_track:0 "重回正轨的武装"
  USA_Armed_forces_back_on_track_desc:0 "内战期间，军队承担了远超其本职的政治职责，而战争的结束也意味着这种特殊状态必须画上句号。无论军队曾站在哪一方，它都应重新成为忠于宪法与联邦政府的国家武装，而非任何个人、党派或集团的工具。政府将重新厘清文武关系，恢复军队的职业化建设，使其重新回到保卫国家而非干预政治的正轨。唯有如此，美利坚军队才能重新赢得全国的信任。"
  USA_final_judgment_of_the_tyrant:0 "僭主的最终审判"
  USA_final_judgment_of_the_tyrant_desc:0 "道格拉斯·麦克阿瑟或许曾以拯救国家为名攫取权力，也或许真的避免了联邦的彻底崩溃。然而，一个民主国家绝不能允许任何人凌驾于宪法之上。如今战争已经结束，全国都在等待最后的审判。这既是对麦克阿瑟个人的裁决，也是美国向未来证明法治高于个人意志的重要一步。无人能够凌驾于共和国之上。"
  USA_Care_for_heroes:0 "关怀英雄"
  USA_Care_for_heroes_desc:0 "战争结束了，但它留下的伤痕仍遍布全国。无数退伍军人、战争伤残者、阵亡将士家属以及失去父母的孤儿，都是共和国必须承担的责任。建立完善的抚恤、医疗与安置体系，不仅是对他们牺牲的回报，更是重建社会信任与国家认同的重要一步。"
  USA_A_brand_new_constitution_a_free_country:0 "崭新宪法，自由国家"
  USA_A_brand_new_constitution_a_free_country_desc:0 "旧时代的制度在危机中暴露了自身的缺陷，而战争更让无数美国人开始重新思考共和国未来的道路。一部经过修订的新宪法，将在吸取过去经验的基础上重新平衡联邦、州政府以及公民之间的权力关系，使自由与秩序不再彼此冲突，而共同成为新时代美国的立国基石。这将成为未来数十年美国政治发展的全新起点。"
  USA_Wash_away_the_traces_of_rebellion:0 "洗净叛乱痕迹"
  USA_Wash_away_the_traces_of_rebellion_desc:0 "战争虽然结束，但它留下的影响仍然遍布各州。从被摧毁的城市，到仍然残留的叛乱组织与政治象征，这些都不断提醒着人们那段黑暗岁月。政府必须逐步恢复地方行政，拆除战争遗留的政治结构，重建公共秩序，让联邦重新成为全国唯一合法且统一的权威。只有这样，战争才能真正成为历史，而非挥之不去的阴影。"
  USA_Rebuild_the_local_political_machine:0 "重建地方政治机器"
  USA_Rebuild_the_local_political_machine_desc:0 "内战严重破坏了许多州与城市的政治结构。地方政府在战争期间失去权威，原有的政党组织也随之瓦解。随着国家秩序逐步恢复，各州开始重建地方政治体系，通过新的选举与地方行政机构恢复正常的治理结构。各大政党的政治根基也开始重新在地方上扎根。相信不用多久，民主制度将再一次生长在美利坚的土地上。"
  USA_Restore_dignity_of_separation_of_powers:0 "重拾三权分立之威严"
  USA_Restore_dignity_of_separation_of_powers_desc:0 "在紧急状态期间，行政与军事权力不可避免地集中于少数人手中，而传统的三权分立原则也因此被大幅削弱。随着国家逐渐恢复稳定，美国开始重新确认立法、行政与司法三权之间的界限，并通过新的法律限制未来政府在紧急状态下所能拥有的权力范围，以确保共和国的制度基础不再轻易被动摇。"
  USA_Emergency_control_law:0 "紧急管制法"
  USA_Emergency_control_law_desc:0 "和平已经到来，但国家仍远未恢复稳定。为了应对潜在的暴力活动、政治极端主义以及仍然存在的地方动荡，政府将赋予联邦机构更多临时性的紧急权力。这些措施并非永久存在，而是在共和国恢复正常运转前所必须付出的代价。待国家重新稳定之后，这些非常权力也终将退出历史舞台。"
  USA_The_federal_government_is_above_all_else:0 "联邦政府高于一切"
  USA_The_federal_government_is_above_all_else_desc:0 "内战证明，一个四分五裂的联邦无法维系真正的统一。无论州政府拥有怎样悠久的传统，都不能凌驾于联邦宪法与中央政府之上。未来，美国必须建立一个拥有足够权威与执行能力的联邦政府，以确保任何地区都无法再次挑战国家整体的统一。联邦将再次成为所有美国人的共同依靠。"
  USA_Guide_the_younger_generation:0 "引导年轻一代"
  USA_Guide_the_younger_generation_desc:0 "经历战争成长起来的一代美国青年，对国家的认识远比前人更加复杂。有人失去了家庭，有人目睹了暴力，也有人被各种激进思想所吸引。学校、社区与公共机构应共同承担教育责任，引导年轻一代重新理解共和国的价值，使他们成为未来稳定与团结的建设者，而非下一场冲突的参与者。共和国的未来，将由他们亲手塑造。"
  USA_Financial_recovery_takes_priority:0 "稳定金融体系"
  USA_Financial_recovery_takes_priority_desc:0 "战争不仅摧毁了城市与工厂，也动摇了整个金融体系。银行、证券市场与联邦财政必须尽快恢复稳定，投资者与普通储户都需要重新建立对经济的信心。只有一个健康而稳定的金融体系，才能为未来的工业复苏与社会重建提供充足的资本。繁荣不会一夜之间降临，但稳定必须从今天开始。"
  USA_A_government_guided_labor_federation:0 "政府指导的劳工联合会"
  USA_A_government_guided_labor_federation_desc:0 "工人组织在美国社会中拥有不可忽视的影响力，但放任其被激进主义者操控，只会再次制造对立与冲突。政府将推动建立一个接受国家法律规范、以劳资协调而非阶级斗争为目标的劳工联合体系，使工会重新回归维护劳动者权益的本职，而非成为政治斗争的工具。稳定的劳动关系，将成为国家复兴不可或缺的一环。"
  USA_Let_syn_go_hell:0 "让工团佬见鬼去吧"
  USA_Let_syn_go_hell_desc:0 "工团主义者曾试图利用经济危机与社会矛盾，将美国推向彻底革命的深渊。如今，他们留下的组织网络与宣传体系仍在暗中活动。政府将继续清除这些激进势力的影响，确保任何企图再次煽动暴力革命的人，都无法获得立足之地。共和国不会再给他们第二次机会。"
  USA_Eradicate_the_political_machinery_in_the_South:0 "铲除休伊政治机器"
  USA_Eradicate_the_political_machinery_in_the_South_desc:0 "休伊·朗虽然已经失势，但他建立起来的地方政治机器仍深植于南方各州。从地方政府到基层组织，大量依附于个人而非制度的权力网络依旧存在。联邦政府必须逐步拆解这些政治机器，使地方行政重新建立在法律与公共机构之上，而非个人恩惠与派系忠诚。联邦权威不应建立在任何个人的名字之上，无论有何功绩。"
  USA_Shelter_farmers_and_small_business_owners:0 "庇护农场主与小企业主"
  USA_Shelter_farmers_and_small_business_owners_desc:0 "无论是战争还是经济危机，最先受到冲击的往往都是普通农场主与小企业经营者。他们既缺乏大型企业的资本，也没有金融财团的资源。政府将通过贷款、税收减免与农业扶持计划帮助他们恢复生产，因为唯有无数普通人的重新站稳脚跟，美国经济才能真正复苏。"
  USA_Necessary_liberation:0 "必要的解放？"
  USA_Necessary_liberation_desc:0 "战争结束后，越来越多的人开始要求重新审视那些长期被忽视的社会问题。无论是种族隔离、地方性的歧视制度，还是其他限制公民权利的旧秩序，都开始受到挑战。然而，这些改革也不可避免地触及传统势力的利益。政府必须决定，究竟应当谨慎维持现状，还是推动一次必要而有限的解放。"
  USA_Unite_and_protect_the_voters:0 "团结保守选民"
  USA_Unite_and_protect_the_voters_desc:0 "战争与政治极端主义使大量保守派选民逐渐失去了对传统政党的信任。面对依旧活跃的激进势力，政府需要重新整合温和派、保守派以及相信宪政制度的广大民众，建立一个足以维护共和国稳定的政治联盟，使大多数美国人在未来的选举中拥有共同而明确的选择。团结温和的大多数，才是共和国长治久安的根本。"
  USA_Clear_out_violent_groups_and_paramilitary_organizations:0 "扫清暴力团体与准军事组织"
  USA_Clear_out_violent_groups_and_paramilitary_organizations_desc:0 "战争虽然已经结束，但各类武装团体、私人民兵以及依附于不同政治势力的准军事组织仍然活跃于全国各地。他们曾经或许打着保卫国家的旗号，却也不断侵蚀着联邦政府对暴力的垄断。政府将依法取缔一切非法武装，收缴流散的武器装备，并恢复地方治安体系，使美国重新成为一个由法律而非枪支维系秩序的国家。"
  USA_Reconstruct_the_welfare_security_system:0 "重构福利保障体系"
  USA_Reconstruct_the_welfare_security_system_desc:0 "内战彻底暴露了旧福利体系的脆弱。大量失业者、战争遗孤、伤残军人与贫困家庭仍然等待着联邦政府的援助。一个更加完善且覆盖全国的社会保障体系，不仅能够帮助人民重新站稳脚跟，也将成为维护社会稳定、促进经济复苏的重要基础。"
  USA_Rationalism_and_the_spirit_of_science:0 "理性主义与科学精神"
  USA_Rationalism_and_the_spirit_of_science_desc:0 "一个现代国家的发展，不应建立在政治狂热与意识形态煽动之上，而应建立在教育、科学与理性的基础之上。政府将继续支持大学、科研机构以及公共教育的发展，鼓励技术创新与科学研究，让美国重新成为世界科学进步与工业创新的中心。理性将指引共和国迈向更加光明的未来。"
  USA_National_Free_Radio:0 "国家自由电台"
  USA_National_Free_Radio_desc:0 "广播已经成为连接整个国家最重要的媒介之一。联邦政府将建立覆盖全国的公共广播体系，在保障新闻自由的同时，向全国人民传播真实可靠的信息、教育节目以及文化内容。唯有建立一个自由而负责的信息空间，共和国才能抵御谣言、极端主义与政治宣传的侵蚀。"
  USA_Boost_investor_confidence:0 "鼓舞投资者信心"
  USA_Boost_investor_confidence_desc:0 "经济的复苏不仅需要工厂重新开工，更需要资本重新流动。政府将通过稳定金融政策、完善市场监管以及保障私人财产权，重新树立投资者对美国经济的信心。当企业家愿意再次投资，银行愿意再次放贷，市场便会重新焕发生机，而国家的繁荣也将随之而来。"
  USA_Clean_up_the_vicious_legacy_of_Elbridge:0 "清理埃尔布里奇的恶毒遗产"
  USA_Clean_up_the_vicious_legacy_of_Elbridge_desc:0 "美国的民主制度长期饱受一种隐蔽却极具破坏性的政治传统所困扰——通过人为操纵选区边界来决定选举结果，而非让选民真正决定议会的组成。这项自埃尔布里奇·格里时代流传至今的“遗产”，让无数政客得以依靠地图而非民意赢得连任，也不断侵蚀着公众对民主制度的信任。随着内战结束，全国政治版图被重新洗牌，如今正是彻底改革选区划分制度的最佳时机。联邦政府将推动建立更加公平、公开且独立的选区重划机制，让每一张选票都拥有应有的价值，而非沦为政客手中的工具。"
  USA_America_the_home_of_the_brave:0 "美利坚，勇敢者的家园！"
  USA_America_the_home_of_the_brave_desc:0 "经历战争、分裂与重建之后，美国终于迎来了新的时代。这里不再属于某一位将军、某一个党派，也不属于任何一种极端主义意识形态，而属于所有愿意共同守护共和国的自由公民。无论出身、信仰或种族，只要忠于宪法、尊重法律，都将在这片土地上拥有属于自己的未来。美利坚将再次成为自由者的祖国，亦是勇敢者永远的家园。"
  USA_The_dice_have_been_rolled:0 "骰子已经掷下"
  USA_The_dice_have_been_rolled_desc:0 "公元前四十九年，凯撒率军渡过卢比孔河，并留下了那句流传千古的话——“骰子已经掷下。”如今，美国同样站在一个无法回头的十字路口。面对政治失序、党争不断以及共和国日益加深的危机，军队最终选择承担起自己从未主动追求的责任。这不是为了建立一个属于将军们的国家，而是为了阻止共和国继续滑向混乱。既然决定已经作出，剩下的便只有继续前行。"
  USA_In_accordance_with_the_wishes_of_the_founders:0 "依照建国者之愿"
  USA_In_accordance_with_the_wishes_of_the_founders_desc:0 "在费城为共和国奠定根基时，建国者们清楚地知道，任何不受约束的权力——无论它来自暴民、政党还是军队——最终都可能摧毁自由。因此，他们将军队置于文官政府之下，以法律规定权力的继承，又让国会、法院与各州彼此制衡。如今，面对要求军方接管国家的阴谋，美国选择遵循这项最古老也最重要的原则。将军们可以保卫国土，却不能决定谁有权统治；军队可以维护秩序，却不能取代人民选出的政府。危机不会成为废弃宪法的借口，共和国也不会依靠另一场政变获得拯救。华盛顿曾在胜利之后交出军权，而今日的美国同样将证明，建国者留下的制度仍有能力经受最严峻的考验。"
  USA_The_three-headed_government:0 "三头政府"
  USA_The_three-headed_government_desc:0 "美国不会迎来一位独断专行的军事统治者。陆军参谋长乔治·马歇尔提出的集体领导理念，最终演变为由道格拉斯·麦克阿瑟、奥马尔·布拉德利与德怀特·艾森豪威尔共同组成的临时执政体系。三位将军拥有截然不同的性格与理念：秩序，务实，与合作。正因如此，没有任何一人能够轻易左右共和国的未来。新的政府将在彼此监督与共同决策中维持国家运转，直到美国重新回归正常的宪政秩序，或是某位领导者大权独揽..."
  USA_with_naval_comrades:0 "与海军战友同行"
  USA_with_naval_comrades_desc:0 "共和国的安全从来不是陆军一家的责任。横跨两洋的美国，需要海军守护漫长的海岸线，也需要舰队维系全球航运与国家利益。从大西洋舰队到太平洋舰队，无数海军官兵始终与陆军并肩作战。新的政府将进一步加强陆海军之间的协调机制，充分听取海军将领对于战略、工业和外交事务的意见，让整个武装力量共同承担起保卫共和国的使命，而不是让任何一个军种凌驾于其他力量之上。"
  USA_Reconstructing_private_enterprises:0 "重构私人企业"
  USA_Reconstructing_private_enterprises_desc:0 "战争与危机能够摧毁企业，却也能够迫使国家重新思考政府与市场之间的关系。新的政府既不会全面接管私人经济，也不会放任市场自行恢复秩序。对于关系国家安全的重要产业，政府将建立更加紧密的合作机制，引导资源配置、稳定金融秩序并恢复工业生产；而对于广大民营企业，则将在法律与市场框架下重新给予发展的空间。一个稳定而充满活力的私人经济，将成为共和国恢复繁荣的重要基础。"
  USA_Re-discussion_on_military_organizations:0 "对准军事组织的再讨论"
  USA_Re-discussion_on_military_organizations_desc:0 "共和国建立之初，民兵制度曾是保卫各州的重要力量；而随着联邦军队不断发展，准军事组织的定位也逐渐变得复杂。有人认为它们是维护地方安全的重要补充，也有人担心它们可能再度演变为脱离政府控制的私人武装。新的政府将重新审视各类退伍军人组织、州民兵以及其他准军事团体的法律地位，在保留其公共价值的同时加强统一管理，使一切武装力量最终都服从宪法与国家，而非任何个人或政治组织，以防第三次内战的爆发。"
  USA_Limited_democratic_transformation:0 "有限民主转型"
  USA_Limited_democratic_transformation_desc:0 "共和国终将重新回归民主，但绝不会回到过去那个党派倾轧、极端主义横行的时代。三头政府相信，美国需要的并非一场毫无准备的全面放权，而是一场循序渐进、建立在稳定与法治基础上的民主重建。军队将逐步退出日常行政事务，恢复地方政府和国会的正常职能，同时保留足以维护国家安全与宪政秩序的必要保障。真正的民主，不只是选举，更是能够长期维系共和国稳定的政治制度。"
  USA_Extend_the_state_of_emergency_indefinitely:0 "无限期延长紧急状态"
  USA_Extend_the_state_of_emergency_indefinitely_desc:0 "戒严原本只是共和国面对危机时的权宜之计，但随着国家机器逐渐恢复运转，一个更加根本的问题摆在了所有人面前——危机真的已经结束了吗？麦克阿瑟认为，真正威胁美国的并不仅仅是一场内战，而是那些随时可能卷土重来的党派纷争、激进主义与境外势力。既然危险并未消失，那么共和国便不能轻易放下手中的盾牌。紧急状态将不再是一项短暂措施，而将成为国家安全体系的一部分。在新的美国，和平并不意味着解除戒备，而意味着共和国已经学会永远保持警惕。"
  USA_Authoritative_guidance_country:0 "权威指导国家"
  USA_Authoritative_guidance_country_desc:0 "美国不会被交给某一位将军，也不会再被党派机器与街头激情反复撕裂。经过漫长争论，三巨头终于接受了一项共同原则：共和国仍需保留自己的法律、国会与文官机构，但国家的根本方向必须由那些拥有责任、经验与力量的人加以指导。新的政权不追求无休止的革命，也不准备恢复旧日的放任政治。它将以军队为支柱、以专业官僚为工具、以国家利益为尺度，为美国建立一套稳定而明确的权威秩序。"
  USA_James_Forrest_and_the_Wall_Street_Link:0 "詹姆斯·福雷斯特尔与华尔街纽带"
  USA_James_Forrest_and_the_Wall_Street_Link_desc:0 "在进入政府之前，詹姆斯·福雷斯特尔曾长期供职于华尔街，对资本市场、企业融资与工业管理皆有深刻了解；进入海军部后，他又迅速证明，商人的精确与军人的纪律并非不能共存。三巨头将借助福雷斯特尔的人脉，把纽约金融机构、国防工业和联邦行政体系连接起来。银行将为扩军提供资本，企业将为国家提供产能，而政府则为这一切指明方向。军人掌握战略，金融家筹措资源，工业家将蓝图化为钢铁。"
  USA_Interface_with_the_military_industrial_complex:0 "对接军工复合体"
  USA_Interface_with_the_military_industrial_complex_desc:0 "兵工厂、造船厂、航空企业、钢铁集团和研究机构，早已不再是彼此孤立的部门。现代战争要求它们围绕统一战略协同运转，也要求国家在和平时期便建立足以应对全面危机的生产体系。政府将设立常设委员会，使总参谋部、海军、金融界与主要承包商共同制定采购和扩产计划。源源不断的订单将支撑工业繁荣，而工业繁荣又会反过来维系国家力量。"
  USA_Old_wine_in_new_bottles:0 "新瓶装老酒"
  USA_Old_wine_in_new_bottles_desc:0 "约翰·潘兴的名字属于另一个时代。对于一代美国人而言，他象征着军纪、胜利以及那个尚未被内乱撕裂的共和国。如今，这位年迈的老将将被推举为国家元首，为新的政权披上合法而庄严的外衣。总统的印玺、白宫的仪式与国会的致辞都将保留下来，但真正繁重的治理事务仍由三巨头及其军政委员会承担。这无疑是旧传统装进了新制度之中；可在一个渴望连续性与安定的国家里，熟悉的面孔本身便是一种力量。"
  USA_Senate_politics:0 "元老政治"
  USA_Senate_politics_desc:0 "古罗马曾将最重大的国事交由元老院议决，而新的美国也需要一群能够超越选举周期和党派利益的人承担长期责任。三巨头、各军种代表、资深议员、工业领袖与高级官僚将组成国家指导委员会，在闭门会议中决定预算、外交、国防与重大人事。争论依然存在，派系也不会消失，但所有成员都接受同一条纪律：分歧可以留在会议桌上，国家意志必须以一个声音向外宣布。"
  USA_Restore_the_national_dignity:0 "重铸国会威严"
  USA_Restore_the_national_dignity_desc:0 "过去的国会曾被无休止的阻挠、廉价的煽动和地方利益所拖累，以至于公众逐渐将议事厅视作国家软弱的象征。新政权不会废除国会，却将重新规定它应有的地位。议员必须遵守更严格的纪律，委员会将与军政机构密切协作，重大法案也将在充分协调后提交表决。国会不再是一座制造混乱的竞技场，而将重新成为共和国庄严意志的公开见证者。"
  USA_National_interests_take_the_lead:0 "国家利益挂帅"
  USA_National_interests_take_the_lead_desc:0 "政党关心下一场选举，利益集团关心下一份合同，地方政客关心自己的选区；国家却必须考虑十年乃至几十年后的命运。今后，任何政策都将接受最直接的检验：它是否增强了美国的统一、工业、财政与安全？凡有利于国家者，不论出自何党，都可以采用；凡损害国家者，不论得到多少掌声，都必须舍弃。意识形态可以争论，利益可以协调，但国家利益始终拥有最后的发言权。"
  USA_Guiding_governance:0 "指导式施政"
  USA_Guiding_governance_desc:0 "新的美国不需要每一项事务都由将军亲自审批。市长仍将管理城市，州长仍将主持州政，部长与公务员也将继续处理日常行政。但在这些机构之上，国家指导委员会会提出不可违背的长期目标，并通过预算、人事和安全审查确保各部门沿着正确方向前进。地方拥有执行的空间，文官保留治理的形式，而军政元老掌握最终的路线。与其说国家正在被直接统治，不如说它正被一只稳定而有力的手引导。"
  USA_no_more_civil_war_disaster:0 "再无内乱之灾！"
  USA_no_more_civil_war_disaster_desc:0 "美国已经为政治家的虚荣、极端分子的野心和制度的软弱付出过一次无法承受的代价。城市化作废墟，家庭被迫分离，星条旗也曾在彼此敌对的军队上空同时飘扬。这样的灾难绝不能重演。新的国家体系将监控危险组织，限制煽动性政治，协调地方武装，并确保军队始终服从统一指挥。政党仍可争论，人民仍可表达，但任何人都不会再被允许把分歧变成战壕。无论需要多少警惕、纪律与牺牲——美利坚再无内乱之灾！"
  USA_democracy_with_order:0 "秩序民主"
  USA_democracy_with_order_desc:0 "自由若失去秩序，终将沦为混乱；权力若失去约束，也终将演变为暴政。过去的危机已经证明，仅凭选票并不足以维护共和国的未来。新的民主制度将建立在责任、纪律与法治之上，使公民自由与国家稳定彼此平衡。军队不会成为民主的主人，而将继续作为宪法最后的守护者，确保任何政治力量都无法再次利用共和国的自由摧毁共和国本身。"
  USA_Raise_the_question_of_civil_rights:0 "提出民权之问"
  USA_Raise_the_question_of_civil_rights_desc:0 "一个真正稳定的共和国，不能永远回避那些迟早需要回答的问题。随着国家重新缓步迈向宪政，越来越多美国公民开始要求联邦政府重新审视公民权利、州权以及法律平等之间的关系。新的政府不会仓促作出决定，也不会继续让争议无限期拖延。对于民权问题，共和国需要的不只是激情，更需要能够兼顾国家统一、社会稳定与宪法原则的答案。"
  USA_Bring_about_change_and_guarantee_with_an_iron_hand:0 "以铁腕予以变革与保障"
  USA_Bring_about_change_and_guarantee_with_an_iron_hand_desc:0 "改革从来不会自动发生，更不会因为善意而自然成功。面对仍然活跃的极端组织、腐败势力以及各种破坏国家重建的行为，政府将继续保留必要的紧急权力，确保每一项改革都能够真正落实。从清理行政机构到整顿地方武装，再到维护司法独立，军队将以坚定而克制的方式完成属于自己的最后一项使命——为未来的民主扫清障碍。"
  USA_Atlantic_divider:0 "大西洋隔离带"
  USA_Atlantic_divider_desc:0 "两个世纪以来，大西洋不仅连接着美国与欧洲，也不断将欧洲的战争、革命与极端思想带到新大陆。共和国并不打算切断与世界的联系，却必须学会在开放与安全之间保持平衡。新的政府将加强边境管理、情报合作以及意识形态审查，使美国能够继续同欧陆保持合作，同时避免任何极端主义再次借由海外势力渗透共和国内部。大西洋应成为交流的桥梁，而不是危机的通道。"
  USA_Eradicate_evil_in_the_government:0 "铲除“政府中的邪恶”"
  USA_Eradicate_evil_in_the_government_desc:0 "共和国最大的危险，并不总是来自边境之外。有时，它潜藏于官僚主义、利益集团以及那些把公共权力视作私人财产的人之间。新的政府将设立更加严格的监察制度，清查行政机关中的腐败行为与意识形态问题，改革公务员体系，严厉打击一切利用国家机器谋取私利的行为，并确保任何政府官员不会成为激进意识形态的傀儡。军政府接管国家，并非为了继承旧弊，而是为了亲手将它们彻底清除。"
  USA_Absorb_the_conservative_old_guards:0 "吸纳保守主义的老近卫军"
  USA_Absorb_the_conservative_old_guards_desc:0 "共和国的重建，不可能依靠军人单独完成。许多长期活跃于国会、州政府以及地方社会的保守政治家，虽然曾反对军事接管，却同样希望美国重新恢复稳定而健康的宪政秩序。新的政府将主动吸纳这些经验丰富的"老近卫军"，共同参与未来民主制度的设计，使军人与文官、传统政治力量与改革派之间建立起新的合作关系，为共和国重新培养值得人民信任的政治阶层。"
  USA_The_moment_of_transformation:0 "蜕变时刻"
  USA_The_moment_of_transformation_desc:0 "共和国经历了混乱，也经历了戒严；经历了政治失序，也经历了军人的接管。而今天，它终于站在了新的起点。随着军政府逐步退出历史舞台，美国将重新成为一个拥有选举、国会与法院的民主国家，但它也将永远记住这段几乎令共和国毁灭的岁月。民主不会再是毫无防备的民主，自由也不会再是失去责任的自由。当最后一批军人离开政府时，一个更加成熟、更加稳健、也更加珍惜宪法的新美国，将真正诞生。"
  USA_Military_worship:0 "军人崇拜"
  USA_Military_worship_desc:0 "共和国不会要求人民崇拜某一位将军，但它应当重新学会尊敬那些默默守护国家的人。几十年来，美国军人始终驻守边疆、救援灾区、保卫航道，在危难时刻承担起共和国最后的责任。新的政府将进一步提升军人的社会地位，扩大退伍军人福利，鼓励学校和社区弘扬军队精神，使服役重新成为一种值得骄傲的公民责任。"
  USA_Decorate_the_facade:0 "装点门面"
  USA_Decorate_the_facade_desc:0 "共和国依然拥有选举、国会与政党，这些制度不会被轻易废除，因为它们仍然是美国政治不可分割的一部分。然而，一个经历过危机的国家不能再把自己的命运完全交给短暂的政治浪潮。未来，民选政府仍将处理日常行政事务，而涉及国家安全、军事建设以及长期战略的问题，则必须接受陆军总参谋部的统一协调。民主将继续存在，但共和国也必须拥有真正稳定的中枢。"
  USA_A_continuous_stream_of_defense_orders:0 "流水般的国防订单"
  USA_A_continuous_stream_of_defense_orders_desc:0 "战争工业并非经济发展的负担，而能够成为整个国家现代化的重要引擎。新的国防战略将持续扩大军工采购，引导钢铁、航空、造船、电子以及汽车工业全面升级，使全国工业体系围绕国防建设不断运转。对于企业而言，这意味着稳定而长期的订单；对于国家而言，则意味着任何危机来临时，美国都拥有世界最强大的工业动员能力。和平需要准备，而准备本身便能够创造繁荣。"
  USA_Inspire_the_new_American_youth:0 "鼓舞新美利坚青年"
  USA_Inspire_the_new_American_youth_desc:0 "共和国未来的安全，不仅建立在先进的武器之上，更建立在愿意承担责任的新一代美国人身上。学校将进一步加强公民教育、国防训练以及体能建设，鼓励青年学习纪律、合作与奉献精神。并非每一位年轻人都会成为军人，但每一位美国青年都应当理解，自由并不是一种天赋，而是一份需要有人不断守护的责任。"
  USA_Contraction_of_national_defense_strategy:0 "新国防战略"
  USA_Contraction_of_national_defense_strategy_desc:0 "新的时代需要新的战略。陆军总参谋部将重新整合陆海空三军资源，建立统一的战略规划体系，完善全国工业动员机制，并重新评估美国未来数十年的安全环境。战争不应临时准备，而应成为国家长期规划的一部分。从科研、教育到工业布局，整个共和国都将逐步融入新的国防体系，使美国能够在任何情况下迅速完成全国动员。"
  USA_Shadows_were_floating_over_Washington:0 "华盛顿阴影浮动"
  USA_Shadows_were_floating_over_Washington_desc:0 "华盛顿依旧灯火通明，国会议员依旧发表演说，总统依旧签署法案，一切看上去似乎没有发生任何变化。然而，在公众视线之外，一份份战略备忘录正不断送往陆军总参谋部，一项项重大决策也必须在那里获得最终认可。一些内部人士称其为影子政府，而军人们则普遍认为这是共和国最后一道保险。无论外界如何评价，一个新的权力中心已经悄然形成，而它很少出现在聚光灯下。"
  USA_National_defense_state:0 "国防国家"
  USA_National_defense_state_desc:0 "共和国最终完成了自己的蜕变。政党仍然竞争，国会依然立法，法院继续审判，州政府保持自治，而真正决定国家战略方向的，则是那个永远保持沉默的总参谋部。它不会公开参加竞选，也不会频繁发表政治演说，却始终站在共和国权力体系的最高处，监督政府、防范危机，并确保任何政党都无法再次将美国带向混乱。对于普通公民而言，这个国家依然是民主共和国；对于真正了解它的人来说，美国已经成为一个以国防为核心、由军队默默守护的国家。"

  USA_Cross_the_Rubicon_River:0 "跨越卢比孔河"
  USA_Cross_the_Rubicon_River_desc:0 "罗马历史中，凯撒率军跨越卢比孔河的那一刻象征着不可逆转的政治决断。对于道格拉斯·麦克阿瑟而言，美国的政治危机同样逼迫他做出类似选择。长期的党派纷争、内战的爆发以及国家秩序的崩溃，使得传统的宪政体系被证明无法维持国家统一。\n\n随着军政府正式接管国家权力，美国的政治发展已经越过了过去政治传统的底线，民主和宪政被历史证明了其软弱与无能。麦克阿瑟政府不再将自身视为临时措施，而是一个新的国家体制的开端。"
  USA_no_more_disasters_of_democracy:0 "再无民主之灾"
  USA_no_more_disasters_of_democracy_desc:0 "在支持军政府的人看来，美国过去数十年的政治混乱正是党派民主制度失败的结果。总统与国会之间的长期对立、地方政府的政治割裂以及层出不穷的选举争议，使国家逐渐陷入无法调和的政治僵局。当危机最终演变为内战时，许多人开始怀疑这种制度是否仍然适用于一个正在迅速变化的世界。麦克阿瑟政府由此提出了一种新的政治理念：国家不应再被无休止的党派斗争所拖累。通过强化行政权威、削弱党派政治的影响以及建立更加高效的决策体系，美国将试图摆脱过去那种灾难般的政治循环。"
  USA_A_united_front_belonging_to_patriots:0 "属于爱国者的统一阵线"
  USA_A_united_front_belonging_to_patriots_desc:0 "随着军政府逐渐稳固权力，一个新的政治联盟也在华盛顿形成。许多原本分散于不同党派的政治人物、工业领袖以及退伍军人组织逐渐汇聚到支持国家稳定的旗帜之下。对于他们而言，内战已经证明，美国无法再承受新的政治分裂。在这种背景下，一个以国家统一与秩序为核心目标的“爱国阵线”——爱国者党开始出现。它并非传统意义上的政党，而是一种围绕国家安全与国家复兴理念而形成的政治联盟，以保卫美国的团结与稳定。"
  USA_Be_vigilant_around_you_citizens:0 "警惕你的身边，公民！"
  USA_Be_vigilant_around_you_citizens_desc:0 "尽管内战已经结束，但新的国家秩序仍然面临诸多威胁。许多极端组织在战争失败后转入地下，而一些政治团体也在暗中等待新的机会。为了防止类似的危机再次出现，政府开始加强国家安全体系，并扩大情报机构与执法机构的权限。同时，宣传部门鼓励公民提高警惕，以确保任何潜在的阴谋都能够在萌芽阶段被发现。"
  USA_Legislation_with_strong_administrative_measures:0 "强硬行政手段立法"
  USA_Legislation_with_strong_administrative_measures_desc:0 "传统的立法程序往往伴随着漫长的政治争论，而国家重建却需要更加迅速而果断的决策。内战时期的紧急措施证明，行政权力在危机时刻能够以更高效率推动国家运转。因此，新政府开始通过一系列法律改革，使行政机构在国家治理中拥有更直接的执行权力。通过减少复杂的政治程序，政府希望建立一种能够迅速应对危机的政治体系。"
  USA_Call_on_patriotic_youth:0 "号召爱国青年"
  USA_Call_on_patriotic_youth_desc:0 "在麦克阿瑟政府看来，美国过去的政治混乱不仅来自腐朽的政党制度，也来自于社会精神的衰退。长期的党派斗争、经济危机以及阶级对立，使得年轻一代在混乱的政治环境中成长，许多人逐渐失去了对国家与共同体的认同。为了改变这一局面，政府开始在全国范围内号召青年参与国家建设。通过各种青年组织、社会服务团体以及国家动员计划，年轻一代将被鼓励参与公共事务与社会建设，并在纪律、责任与忠诚的教育之中成长。"
  USA_Promote_those_who_are_young_and_vigorous:0 "拔擢年富力强者"
  USA_Promote_those_who_are_young_and_vigorous_desc:0 "在旧有政治体系中，许多政府机构早已被官僚主义与派系斗争所侵蚀。许多资深政客虽然经验丰富，却早已沉迷于权力博弈，而忽视了国家真正需要的效率与纪律。内战的爆发更是证明，这样的政治阶层已经无法承担国家重建的重任。麦克阿瑟政府因此开始提拔一批年轻军官、技术官僚与新一代行政管理者进入政府体系，以让未来的美国政府更加充满改革与进取的精神。"
  USA_Macarther_Constitution:0 "麦氏宪法"
  USA_Macarther_Constitution_desc:0 "美国旧有宪法体系在内战之中暴露出严重的制度缺陷。联邦与州之间的权力冲突、总统与国会之间长期的政治对立以及紧急状态下缺乏明确法律框架，使得国家在危机时刻难以迅速行动。为此，一套新的宪政结构被提出。这份被民众戏称为“麦氏宪法”的政治框架重新界定了国家权力结构，在保留部分共和国传统制度的同时，大幅强化行政权力与国家安全机构的地位。"
  USA_the_lifepresident:0 "万众拥戴的终身总统"
  USA_the_lifepresident_desc:0 "在新的政治体系逐渐稳定之后，一个问题逐渐浮现：谁能够长期维持这个国家的秩序？在支持者看来，美国需要一位能够在动荡时代保持稳定的领袖。\n\n随着政治宣传的不断强化，道格拉斯·麦克阿瑟逐渐被塑造成国家复兴的象征。从内战胜利到国家重建，他的形象被不断与国家命运联系在一起。最终，在一片支持声中，他的领导地位被制度化，并成为新政治秩序的重要象征。"
  USA_The_president_under_the_flash_and_the_camera:0 "全国焦点"
  USA_The_president_under_the_flash_and_the_camera_desc:0 "在新的政治时代中，总统的形象逐渐成为国家政治生活的核心。从全国广播到新闻摄影，道格拉斯·麦克阿瑟的言论与行动不断被媒体所传播。同时总统本人也热衷于在闪光灯与镜头前对全国乃至全世界的民众抛头露面，他认为此等举措有助于为美国建设更加友善，美好与亲近的国家形象。这种高度集中于国家领袖的政治传播方式，正在推动麦克阿瑟总统成为国家，权威与精神的象征。"
  USA_Citizen_military_education:0 "公民军事教育"
  USA_Citizen_military_education_desc:0 "政府认为，一个稳定而强大的国家必须拥有具备纪律意识与责任精神的公民。过去的美国社会过于强调个人自由，而忽视了公民对国家应尽的义务。为了改变这一状况，全国范围内开始推广军事训练与国防教育。学校课程、青年组织以及地方民防训练逐渐成为社会生活的一部分。通过这种制度化的教育体系，新一代美国公民将被培养为既具备爱国精神，也具备纪律意识的社会成员。"
  USA_Army_has_the_nation:0 "有国之军"
  USA_Army_has_the_nation_desc:0 "在第二次美国内战结束之后，许多政治家仍然试图回到旧时代的政治结构之中。然而对于许多军官与支持军政府的政治理论家而言，这样的想法几乎是天真的。正是军队在国家濒临崩溃之际承担起维护秩序的责任，也是军队在战火之中重新统一了这个分裂的共和国。若没有军队的组织、纪律与牺牲，美国恐怕早已沦为数个相互敌对的政治实体。因此，在新的国家秩序中，军队不再仅仅被视为国家的工具，而是被赋予了更加崇高的政治地位。只有当国家拥有一支坚定而忠诚的军队时，这个国家才真正具备存在与延续的基础。"
  USA_New_military_camp_capitalism:0 "新型军营资本主义"
  USA_New_military_camp_capitalism_desc:0 "在经济重建问题上，麦克阿瑟政府提出了一种不同于传统自由资本主义的模式。政府认为，完全放任的市场经济曾在大萧条中暴露出严重缺陷，而过度的国家干预又可能扼杀企业活力。因此，一种被称为“军营资本主义”的经济结构逐渐形成。在这种模式中，国家通过军事与行政机构对关键产业进行协调与规划，同时保留私人企业的生产能力与创新动力。进而，在得到国家管控与统筹的工业经济又会反哺国家的军事产业建设，以供给美国未来的进一步军国主义转型。"
  USA_little_Cavalry:0 "小小童子军"
  USA_little_Cavalry_desc:0 "在新的国家秩序之中，政府逐渐意识到，仅仅依靠成年公民的忠诚并不足以确保国家的长期稳定。若要真正重塑美国社会，就必须从下一代开始培养一种新的国家意识。因此，一系列面向青少年的组织与训练体系开始在全国范围内建立。这些组织通常被称为“小骑兵”，其灵感既来自美国传统的童子军运动，也借鉴了军队的纪律与训练方式。通过露营、体能训练、队列活动以及历史教育，这些年轻人被鼓励逐渐形成对国家、军队以及共同体的认同。"
  USA_The_Washington_Core_circle:0 "华盛顿核心圈"
  USA_The_Washington_Core_circle_desc:0 "随着新政权逐渐稳固，一批忠诚的军官、官僚以及政治支持者开始在政府中形成一个紧密的权力网络。这些人有的来自军队高层，有的则是战后迅速崛起的技术官僚，还有一些则是坚定支持军政府理念的政治人物。\n\n在外界的观察者看来，这个逐渐形成的权力集团构成了麦克阿瑟政权真正的政治核心。无论是国家安全、经济政策还是外交战略，许多关键决策都在这一小群人之间讨论与制定。虽然官方从未正式承认这一集团的存在，但事实上这一团体已经围绕在麦克阿瑟总统身边，成为国家的真正中枢。"
  USA_Revitalize_the_American_spirit_of_the_20th_century:0 "重振美式保守民族主义"
  USA_Revitalize_the_American_spirit_of_the_20th_century_desc:0 "在麦克阿瑟政府的意识形态叙事之中，美国所经历的内战不仅是一场政治危机，更是一场精神危机。许多支持者认为，美国社会在过去几十年逐渐失去了最初建国时代的共同价值，取而代之的是党派斗争、阶级冲突以及不断扩张的个人主义。\n\n因此，政府开始大力宣传一种新的国家精神。它强调纪律、责任、国家认同以及对共同体的忠诚，并试图将这些价值重新塑造成美国社会的核心理念。它既继承了美国传统的爱国精神，又能够为现代国家提供新的政治凝聚力。"
  USA_Old_soldiers_never_die:0 "老兵永不死"
  USA_Old_soldiers_never_die_desc:0 "第二次美国内战不仅改变了国家的政治结构，也深深影响了整个社会。数百万士兵曾在战场上作战，而无数家庭也因此付出了沉重的代价。在这样的背景下，退伍军人逐渐成为国家最受尊敬的群体之一。\n\n政府通过纪念仪式、公共纪念碑以及退伍军人福利体系来强调他们的贡献。那些曾经在战火中服役的士兵被视为国家最忠诚的守护者，他们的经历被不断讲述，以提醒人们国家统一所付出的代价。在许多宣传材料中，人们常常引用麦克阿瑟将军的一句名言——“老兵永不死，他们只是渐渐凋零。”这句话不仅表达了对退伍军人的敬意，也象征着军人精神在国家历史中的延续。"
  USA_Salute_to_chief:0 "向首长致敬"
  USA_Salute_to_chief_desc:0 "随着麦克阿瑟的权力逐渐巩固，他的形象开始被塑造成国家复兴的象征。在政府的宣传体系之中，总统不仅是一位政治领袖，更被视为国家统一与秩序的化身。军队与政府机构通过各种仪式表达对总统的忠诚。从阅兵式到公共集会，从广播演讲到官方宣传画，麦克阿瑟的形象不断出现在国家生活的各个角落。许多支持者相信，正是这位将军在国家最黑暗的时刻承担起了拯救共和国的责任。在这样的政治文化之中，对国家领袖的敬意逐渐成为社会秩序的一部分。"
#非建制
USA_The_true_era_of_commoners:0 "真正平民时代"
  USA_The_true_era_of_commoners_desc:0 "美国的未来不应属于华尔街、财团或政治世家，而应属于那些每天辛勤劳动、缴纳税款、建设国家的普通人民。平民党的诞生并非为了颠覆共和国，而是为了让共和国重新回到它真正主人的手中。从今天开始，一个属于普通美国人的新时代即将到来。"
  USA_Reverse_the_tide_of_conservatism:0 "扭转保守主义浪潮"
  USA_Reverse_the_tide_of_conservatism_desc:0 "民主党虽然成功避免了国家滑向内战，却也凭借压倒性的政治优势重新巩固了旧有政治秩序。越来越多的国会议员开始将"稳定"视作高于一切的目标，而改革则不断因为妥协、程序以及地方政治机器的阻挠而被搁置。保守主义再次成为华盛顿最具影响力的政治思潮，无论是企业利益、州权政治还是传统社会秩序，都重新成为两党竞相维护的对象。\n\n然而，一个停滞不前的共和国绝不会因此变得更加安全。平民党相信，美国最大的危机并非改革，而是拒绝改革。只有重新唤醒全国范围内的进步主义精神，打破长期盘踞于华盛顿的保守政治惯性，才能真正让共和国迈入属于新时代的发展道路。"
  USA_Not_radical_not_weak:0 "非激进，不软弱"
  USA_Not_radical_not_weak_desc:0 "我们的反对者将平民党描绘成危险的革命者，而部分激进人士又认为我们的改革仍然过于温和。然而，美国真正需要的既不是暴力革命，也不是继续向旧制度低头。平民党的使命，是依托宪法与民主制度推动社会持续进步，以改革而非流血解决矛盾，以团结而非分裂改变国家。我们不会向资本屈服，也不会让共和国走向极端主义，这是一条真正属于美国人民自己的改革道路。"
  USA_Jack_Reeds_New_Revolution:0 "杰克·里德的新革命"
  USA_Jack_Reeds_New_Revolution_desc:0 "杰克·里德始终坚持，美国社会主义绝不应照搬欧洲的革命模式，更不能建立在流血与独裁之上。1936年的失败让他更加确信，共和国真正需要的并不是另一场革命，而是一场植根于民主制度内部的社会变革。所谓"新革命"，不是推翻宪法，而是改变财富、权力与生产关系的分配方式，使工人真正成为国家发展的主人。只有当民主从投票箱延伸至工厂、企业与社会，美国社会主义才算真正迈出了自己的第一步。"
  USA_The_united_power_of_the_trade_unions:0 "团结的工会力量"
  USA_The_united_power_of_the_trade_unions_desc:0 "长期以来，美国工会始终受到行业、地区乃至意识形态的分裂所困扰。不同组织之间的竞争虽然活跃了工人运动，却也削弱了劳动者面对大型企业时应有的力量。平民党政府将鼓励各类工会加强合作，建立更加统一的协调机构，使产业工人、农业劳动者与服务业雇员能够共同维护自身权益。一个团结而成熟的工会体系，不仅是劳工运动的支柱，也是民主社会不可或缺的重要组成部分。"
  USA_Rekindle_the_torch_of_IWW:0 "重燃产联会火炬"
  USA_Rekindle_the_torch_of_IWW_desc:0 "世界产业工人联合会曾一度点燃无数美国劳动者争取公平待遇的希望，也曾因为激进立场而遭受长期打压。如今，政府并不准备简单恢复昔日那个充满斗争色彩的组织，而是希望继承其团结劳动者、反对垄断资本以及强调产业民主的精神。新时代的工人运动，应当建立在民主协商、合法组织以及全民参与的基础之上，让产联会的火炬重新照亮美国劳动者前进的道路。"
  USA_Shooting_at_all_the_reactionaries:0 "向一切反动者开炮"
  USA_Shooting_at_all_the_reactionaries_desc:0 "任何改革都会遭遇反对，而美国社会主义面对的敌人，从来不仅仅是少数资本家。那些利用种族、宗教、地域以及偏见不断制造分裂的反动政治势力，同样阻碍着共和国迈向更加公平的未来。政府将依法打击煽动暴力、破坏民主制度以及组织极端主义活动的团体，确保社会改革不会再次被恐惧与仇恨所绑架。"
  USA_Towards_Communes_and_Workers_Autonomy:0 "迈向公社与工人自治"
  USA_Towards_Communes_and_Workers_Autonomy_desc:0 "工厂究竟应当属于资本，还是属于创造财富的劳动者？杰克·里德给出的答案十分明确。政府将逐步鼓励合作社、工人委员会以及地方自治组织的发展，在部分产业试行更加民主的企业管理制度，让劳动者能够真正参与企业经营与利润分配。这样的改革不会一蹴而就，但它将成为美国探索产业民主与工人自治的重要起点，也让经济民主逐渐成为政治民主的自然延伸。"
  USA_Directly_point_to_the_root_cause_of_the_collapse:0 "直指崩溃源头"
  USA_Directly_point_to_the_root_cause_of_the_collapse_desc:0 "大萧条并非一次偶然的金融危机，而是长期财富集中、金融投机以及资本无序扩张共同导致的结果。仅仅修补经济制度，永远无法阻止下一场危机再次爆发。政府必须将改革深入到金融体系、企业垄断以及劳动关系本身，通过更加公平的财富分配、更完善的社会保障以及更严格的市场监管，从根本上消除美国经济长期存在的结构性隐患，使繁荣不再只是短暂的泡沫。"
  USA_Traveling_together_with_the_Delaunay_and_Bellamy_factions:0 "与德莱昂与贝拉米派共行"
  USA_Traveling_together_with_the_Delaunay_and_Bellamy_factions_desc:0 "平民党的社会主义者并非只有一种声音。德莱昂主义者强调产业工会与工人民主，贝拉米主义者则更加关注国家规划、社会福利以及和平渐进的改革方式。过去，这两股思想曾长期各自发展，如今却能够为了共同目标携手合作。政府将兼顾两者的优势，在坚持民主制度的同时推进社会改革，让美国社会主义既拥有理想主义的方向，也具备切实可行的实践基础。"
  USA_The_society_belonging_to_the_American_people:0 "属于美国百姓的社会"
  USA_The_society_belonging_to_the_American_people_desc:0 "共和国存在的意义，不应只是维护市场运行，更应保障每一位公民都能够分享到国家发展的成果。未来的美国，将继续尊重民主制度与地方自治，同时建立更加公平的财富分配体系、更完善的公共服务以及更加广泛的劳动者参与机制。属于美国人民的社会，并不是一个人人绝对平等的乌托邦，而是一个任何人都不会因为贫穷、出身或资本而失去尊严与希望的共和国。"
  USA_kingfish_works_tirelessly_for_the_common_people:0 "王鱼为平民奔走"
  USA_kingfish_works_tirelessly_for_the_common_people_desc:0 "对于休伊·朗而言，政治从来不是华盛顿精英们在国会大厅里的辩论，而是普通家庭餐桌上的一块面包、一份工作以及一间能够遮风挡雨的房屋。正因如此，这位曾经的路易斯安那州长始终奔走于全国各地，希望将自己在南方推行的改革经验带向整个美国。无论是修建道路、扩大公共教育还是改善乡村医疗，在朗看来，政府最大的职责便是让每一个勤劳工作的美国人都能够过上体面的生活。真正的政府，应当首先属于平民，而不是属于那些居住在摩天大楼里的百万富翁。"
  USA_Implementation_of_the_wealth_limit_policy:0 "财富限额落实"
  USA_Implementation_of_the_wealth_limit_policy_desc:0 "分享财富计划曾被无数人视作遥不可及的政治口号，而如今，它终于迎来了真正付诸实践的机会。政府将通过更加严格的累进税制、遗产税以及财富监管政策，限制极端财富集中带来的社会不公，并将由此获得的财政收入重新投入住房、教育、医疗以及就业计划之中。平民党并不反对财富本身，但任何人的财富都不应建立在数百万美国人长期贫困的基础之上。"
  USA_Crush_all_evil_deeds_and_depravity:0 "粉碎恶行"
  USA_Crush_all_evil_deeds_and_depravity_desc:0 "贫困、腐败、黑帮、政治机器以及垄断资本长期相互勾结，构成了阻碍美国发展的顽疾。对于这些盘踞于社会各个角落的"恶行"，政府绝不会继续姑息。联邦调查机构、司法机关以及地方政府将展开更加广泛的联合行动，打击有组织犯罪、政治腐败以及利用财富操纵公共权力的利益集团。一个真正属于人民的共和国，不应允许任何特权凌驾于法律之上。"
  USA_A_nation_with_an_omnipotent_state_apparatus:0 "如臂使指的国家机器"
  USA_A_nation_with_an_omnipotent_state_apparatus_desc:0 "一个软弱无力的政府既无法约束资本，也无法保护人民。过去数十年间，联邦政府往往因为繁琐的程序、地方利益以及党派斗争而错失改革时机。平民党相信，一个拥有足够执行能力的国家机器，才能真正贯彻人民赋予它的权力。更高效的行政机构、更统一的联邦协调以及更强有力的政策执行，将使政府能够迅速回应经济危机、社会问题以及人民的实际需要。"
  USA_Social_welfare_rural_cooperation_and_popular_democracy:0 "社会福利与乡村合作"
  USA_Social_welfare_rural_cooperation_and_popular_democracy_desc:0 "美国的未来绝不仅存在于纽约、芝加哥与底特律这样的工业城市，同样也存在于广袤乡村与无数普通农场之中。政府将在扩大社会福利体系的同时，鼓励农业合作社、农村信贷以及地方自治的发展，让长期被忽视的乡村重新分享国家发展的成果。只有当城市与乡村共同繁荣，美国民主才能真正拥有牢固而广泛的社会基础。"
  USA_Louisiana-style_political_philosophy:0 "路易斯安那式政治哲学"
  USA_Louisiana-style_political_philosophy_desc:0 "有人称之为政治机器，也有人称之为真正有效率的民主。但无论外界如何评价，休伊·朗在路易斯安那执政期间确实以前所未有的速度推动了道路、学校、医院以及公共设施建设。这套强调强有力行政、直接联系基层以及快速兑现政治承诺的执政方式，如今将被推广至整个联邦。当然，它也必须接受更加完善的法律监督，使效率与民主能够在新时代找到新的平衡。"
  USA_Reform_of_civilian_justice:0 "改造平民司法"
  USA_Reform_of_civilian_justice_desc:0 "司法制度本应保护普通人民，却长期因高昂的诉讼成本、复杂的程序以及地方势力干预而难以真正实现公平。政府将推进司法改革，扩大法律援助，整顿地方检察体系，并加强对司法腐败的调查与监督，使每一位美国公民都能够平等地获得法律保护。法律不应成为富人的武器，而应成为共和国维护正义最可靠的基石。"
  USA_The_vision_of_everyman_a_king:0 "人人为王的愿景"
  USA_The_vision_of_everyman_a_king_desc:0 "“人人皆为王，无人戴王冠。”这句口号不仅代表着休伊·朗最著名的政治理想，也概括了平民主义运动始终坚持的信念。共和国存在的意义，并非制造新的贵族，而是让每一个普通家庭都拥有教育子女、经营事业以及改变命运的机会。当财富不再决定尊严，权力不再垄断未来时，美国才能真正兑现建国者关于自由与平等的伟大承诺。"
  USA_The_choice_for_unity_and_cooperation:0 "为团结与合作之选"
  USA_The_choice_for_unity_and_cooperation_desc:0 "过去数十年间，进步党、社会党、工会组织、农业改革派以及各类地方平民运动虽然拥有共同目标，却始终因为意识形态与政治利益而彼此竞争。1936年的失败终于证明，分裂永远无法战胜组织严密的保守主义联盟。平民党的建立，正是为了将这些长期分散的改革力量汇聚到同一面旗帜之下。只有团结不同阶层、不同地区与不同思想背景的改革者，美国才能真正迎来属于新时代的政治变革。"
  USA_Absorb_all_available_progressive_individuals:0 "吸纳一切进步人士"
  USA_Absorb_all_available_progressive_individuals_desc:0 "改革从来不属于某一个政党，而属于所有愿意推动社会进步的人。越来越多来自共和党、民主党、进步党以及独立政治运动的改革人士开始意识到，真正阻碍美国发展的并非党派名称，而是僵化的政治结构与利益集团。平民党愿意向所有坚持民主、公平与社会正义的人敞开大门，让不同背景的人共同参与共和国未来的建设，使改革真正超越传统党派之间的界限。"
  USA_The_rich_have_to_bear_heavy_taxes:0 "富人得苛税"
  USA_The_rich_have_to_bear_heavy_taxes_desc:0 "美国创造了世界上最庞大的财富，也让财富以前所未有的速度集中到极少数人的手中。当普通家庭仍在为生活奔波时，大型企业与金融寡头却依靠税收漏洞不断积累新的资本。一个健康的共和国，不应让劳动者承担最沉重的税负，而让最富有的人享受最多的特权。更加公平的累进税制，将重新平衡财富分配，使经济发展的成果能够真正惠及整个社会，而非少数幸运者。"
  USA_The_New_American_Dream:0 "新美国梦"
  USA_The_New_American_Dream_desc:0 "美国梦不应只是极少数人白手起家的传奇，更不应建立在资本垄断与机会不平等之上。真正的美国梦，应当意味着每一个勤劳工作的家庭都能够拥有体面的收入、稳定的住房、良好的教育以及向上发展的机会。政府将努力消除那些阻碍普通人改变命运的制度障碍，让劳动重新成为创造财富与实现梦想最可靠的道路，使美国梦重新属于绝大多数美国人民。"
  USA_The_Triumph_of_Humanism:0 "人文主义之胜"
  USA_The_Triumph_of_Humanism_desc:0 "一个国家的伟大，不仅体现在工厂、铁路与高楼，也体现在它如何对待自己的人民。政府将持续扩大教育、公共医疗、文化事业以及科学研究的投入，让经济增长真正服务于人的发展，而不是让人成为经济发展的附属品。平民党相信，只有尊重人的尊严、保障每一位公民的发展机会，美国才能真正成为一个现代而文明的共和国。"
  USA_Apple_pie-style_populism:0 "平民式通识教育"
  USA_Apple_pie-style_populism_desc:0 "民主制度无法建立在无知之上。长期以来，高等教育与政治知识始终被少数精英所垄断，而普通美国人却缺乏参与公共事务所需的基本条件。政府将进一步普及公共教育、成人教育以及公民课程，让更多人民理解共和国的制度、经济与社会运行方式。只有拥有知识与独立思考能力的公民，才能真正维护属于自己的民主制度。"
  USA_Return_everything_to_the_people:0 "把一切还以人民"
  USA_Return_everything_to_the_people_desc:0 "共和国的一切权力，本就来源于人民，也理应重新回到人民手中。长期以来，资本集团、政治机器以及少数利益联盟不断侵蚀着民主制度，使政府越来越偏离普通人民的利益。平民党将推动政治、经济与社会各领域的全面改革，让公共权力重新接受人民监督，让国家重新成为服务人民而非服务少数人的共和国。这才是林肯口中民有、民治、民享政府真正应有的模样。"
  USA_Broad-based_Popular_Front:0 "广泛平民阵线"
  USA_Broad-based_Popular_Front_desc:0 "平民党的成立，意味着美国各类改革力量第一次真正走到了一起。从工会组织到农业联盟，从城市进步主义者到乡村平民主义者，不同背景、不同理念的人们终于为了共同目标放下彼此间长期存在的分歧。这样的联盟绝非毫无争议，但正是这种广泛合作，使平民党拥有了突破传统两党格局的可能。只要改革者仍愿意携手同行，美国便始终拥有继续前进的希望。"
  USA_Peace_and_justice_for_all:0 "和平正义人人享"
  USA_Peace_and_justice_for_all_desc:0 "战争、贫困以及社会对立，让越来越多美国人意识到，仅仅结束冲突并不意味着真正的和平。一个真正稳定的共和国，应当让每一位公民都能够平等地获得司法保护、教育机会以及体面的生活条件。平民党相信，和平必须建立在社会公平之上，而正义也不应只是法庭里的判决，更应体现在每一位普通人民的日常生活之中。"
  USA_Amry_for_people_not_bigwigs:0 "为平民而生之军"
  USA_Amry_for_people_not_bigwigs_desc:0 "美国军队存在的意义，是保卫共和国，而不是保卫任何个人、财团或政治集团。过去数十年间，军队曾多次被卷入国内政治，也因此损害了公众对于武装力量的信任。未来的联邦军队将继续保持职业化建设，坚持文官领导原则，同时更加重视普通士兵、退伍军人与基层军官的权益，让这支军队真正成为属于全体美国人民的军队。"
  USA_People_Government:0 "平民政府"
  USA_People_Government_desc:0 "政府的合法性，并不仅仅来自选举，更来自它是否真正回应人民的诉求。长期以来，职业政客、利益集团以及地方政治机器不断削弱着民主制度的活力，使越来越多普通美国人认为华盛顿早已脱离现实。平民党将进一步扩大政府透明度，完善地方自治与公众监督机制，让联邦政府重新成为人民可以信赖、也能够真正影响的公共机构。"
  USA_Tear_away_the_tender_facade_of_Ford_and_Taylor:0 "撕碎企业的温情面纱"
  USA_Tear_away_the_tender_facade_of_Ford_and_Taylor_desc:0 "不少大型企业不断以慈善、福利以及所谓的企业责任塑造自身形象，试图掩盖其长期压低工资、阻碍工会以及操纵市场竞争的现实。平民党并不反对企业的发展，但任何企业都不应凌驾于公共利益之上。政府将加强反垄断执法、规范劳资关系，并限制大型企业对于政治与市场的不正当影响，让公平竞争重新成为美国经济发展的基础。"
  USA_A_fair_election_without_any_fraud:0 "无舞弊之公平选举"
  USA_A_fair_election_without_any_fraud_desc:0 "民主制度最大的威胁，并不仅仅来自独裁者，也可能来自那些隐藏于程序之中的不公。从政治机器操控、非法献金，到杰利蝾螈式选区划分，这些行为都不断侵蚀着美国人民对于选举制度的信任。政府将推动更加公开透明的选举改革，完善监督机制，限制党派操纵地方选举的能力，使每一张选票都能够真正代表人民自己的意志。"
  USA_The_end_of_the_exploiters_has_come:0 "剥削者的末日到了！"
  USA_The_end_of_the_exploiters_has_come_desc:0 "一个建立在少数人无限获利、多数人长期贫困基础上的社会，注定无法长久稳定。无论是垄断资本、金融投机，还是利用政治特权攫取财富的利益集团，都不应继续主导美国经济的发展方向。政府将通过税制改革、反垄断法以及劳动立法重新平衡财富与权力，使经济真正服务于社会，而不是让社会沦为资本逐利的工具。"
  USA_The_traitor_will_be_punished:0 "助力女权事业"
  USA_The_traitor_will_be_punished_desc:0 "美国社会的发展离不开女性长期以来在家庭、工厂、学校以及公共事务中的贡献。然而，长期存在的制度性障碍仍然限制着无数女性的发展机会。平民党将进一步扩大女性在教育、就业、公共服务以及政治生活中的参与权利，消除不合理的法律限制，让真正意义上的公民平等逐步成为共和国新的社会共识。"
  USA_The_end_of_all_racism:0 "一切种族主义之终"
  USA_The_end_of_all_racism_desc:0 "美国建国之初便宣称人人生而平等，但这一理想始终未能真正惠及所有公民。种族隔离、歧视政策以及社会偏见不仅伤害了无数家庭，也不断削弱着共和国自身的凝聚力。政府将继续推动民权立法，打击种族歧视，保障所有美国人在法律面前享有同等权利，使自由与平等不再只是写在宪法上的承诺。"
  USA_The_unified_idea_of_popularism_progressiveism:0 "统一的进步与平民主义"
  USA_The_unified_idea_of_popularism_progressiveism_desc:0 "平民主义关注普通人民的生活，进步主义强调制度改革，两者看似来自不同传统，却拥有相同的目标——让共和国重新服务于绝大多数美国人民。经历数年的合作与磨合之后，这两股曾经彼此独立的政治力量终于完成了真正意义上的融合。未来的美国将不再拘泥于旧有党派的界限，而是在民主、改革与社会公平的共同基础上，迈向一个更加繁荣、更加强大的新时代。"
  USA_The_American_spirit_of_the_20th_century:0 "20世纪的美国精神"
  USA_The_American_spirit_of_the_20th_century_desc:0 "尽管我们的敌人对我们的政策进行着种种的抱怨和攻击，但事实很简单：平民党就像苹果派一般，都是地道的美式产物。我们继承了上个世纪以来美国所有优秀政治家的光荣传统，从林肯到格兰特，从罗斯福到塔夫脱。我们是为底层人民而战的组织，我们会反对寡头与暴君，捍卫底层人民的权利，努力地改善他们的处境。"
  USA_The_return_of_the_true_American_spirit:0 "真正美国精神的回归"
  USA_The_return_of_the_true_American_spirit_desc:0 "1936年的惨败让旧有的两党秩序彻底崩塌。面对进步党扩张联邦权力、扶植工会并重塑社会规范的企图，民主党保守派、共和党右翼、南方州权主义者与工商界领袖终于放下积怨。国家人民党宣称，真正的美国精神既不属于华盛顿官僚，也不属于街头鼓动者，而属于教堂、家庭、农场与自由企业。如今，沉默已久的传统美国人将重新发声，夺回他们眼中遭到篡夺的共和国。"
  USA_Support_Lost_Cause_Myth:0 "支持失败事业神话"
  USA_Support_Lost_Cause_Myth_desc:0 "数十年来，南方的政客、社团与地方史家不断将内战描绘为一场保卫州权、荣誉与地方自由的悲壮斗争，而非维护奴隶制度的战争。进步党政府试图清除公共场所中的邦联象征，更激起了保守南方的反弹。国家人民党将支持纪念碑、退伍军人协会与地方教材继续传播所谓‘失败事业’，借此将南方白人的历史记忆塑造成反抗联邦集权的政治武器，使昔日的战败者重新成为新时代保守运动的殉道者。"
  USA_Maintain_career_of_fair_Colombias_struggle:0 "维护公平哥伦比亚的斗争事业"
  USA_Maintain_career_of_fair_Colombias_struggle_desc:0 "在国家人民党的宣传中，哥伦比亚女神不再只是共和国的象征，更代表着一个遭到激进主义、官僚统治与社会实验围困的传统美国。各地的保守妇女组织、退伍军人协会、宗教团体与地方报刊将被纳入一场全国性的文化斗争，捍卫他们所理解的家庭秩序、地方习俗与宪政自由。政府将资助纪念活动、爱国教育与公共宣传，使“公平哥伦比亚的事业”成为团结不同右翼派别的共同神话。"
  USA_Abolish_the_Fifteenth_Amendment:0 "废除第十五修正案"
  USA_Abolish_the_Fifteenth_Amendment_desc:0 "第十五修正案本应保障公民不因种族而被剥夺选举权，但国家人民党内最反动的南方势力却将其视为联邦干涉州内事务的根源。在他们的推动下，政府将尝试以州权、选举资格与地方自治为名削弱乃至废除这项修正案，把投票制度重新交还各州决定。支持者宣称此举能够恢复负责任的民主”，但其真正结果将是为人头税、识字测验与系统性排斥重新打开大门，使数百万本不应登上政治舞台的公民失去不属于他们的政治声音。"
  USA_Defending_citizens_freedoms_rather_than_laws:0 "保卫公民自由而非律法"
  USA_Defending_citizens_freedoms_rather_than_laws_desc:0 "国家人民党声称，法律的条文未必代表真正的自由，因为进步派同样能够借助法院、监管机构与行政命令侵害财产权、宗教传统与地方自治。政府将以‘公民自由’为口号，限制联邦机关对企业、教会、地方学校与私人组织的干预，并重新审查进步党时代通过的劳动与民权法规。"
  USA_Put_an_end_to_all_anarchic_threats:0 "终结一切无政府威胁"
  USA_Put_an_end_to_all_anarchic_threats_desc:0 "罢工浪潮、激进工会、社会主义社团与街头冲突，已被国家人民党描述为共和国濒临崩溃的证据。政府将扩大联邦调查机构的权限，建立跨州情报网络，并允许地方警察、国民警卫队与忠诚的民间组织共同打击所谓无政府威胁。工会领袖、左翼报刊与异议团体将受到更加严密的监视。秩序或许会迅速恢复，但当反对政府本身也被视为颠覆时，秩序与服从之间的界线便会逐渐消失。"
  USA_Remove_all_unjust_restraints:0 "解放自由资本"
  USA_Remove_all_unjust_restraints_desc:0 "进步党执政期间设立的价格监管、劳动标准、企业税与反垄断机构，被国家人民党斥为束缚美国创造力的层层锁链。新政府将废除被认为妨碍投资的规章，降低企业税负，并限制工会干涉雇佣与生产的能力。支持者相信，自由资本将再次释放工业家的才能，为全国带来就业与繁荣。然而，当政府主动退出市场，真正获得自由的往往并非普通商人，而是那些拥有足够财富制定规则的大型企业。"
  USA_Advocate_racial_hygiene_science:0 "倡导种族卫生科学"
  USA_Advocate_racial_hygiene_science_desc:0 "优生学曾长期披着现代科学与社会进步的外衣，受到大学、慈善机构与部分州政府的支持。如今，国家人民党中的种族主义者试图重新利用这些早已充满偏见的理论，将贫困、疾病与犯罪归咎于血统，而非社会条件。政府将资助所谓人口研究、婚姻审查与遗传健康计划，并赋予地方机构更大的干预权。这些政策不仅对国家未来的理性规划，更是为了纯净种族复兴的关键一步。"
  USA_State_sovereignty_is_sacred_and_inviolable:0 "州权神圣而不可侵犯"
  USA_State_sovereignty_is_sacred_and_inviolable_desc:0 "自内战结束以来，联邦政府的权力便持续扩张，而经济危机与进步主义改革更使华盛顿深入教育、劳动、治安与地方选举。国家人民党将州权视为阻挡中央集权的最后堡垒，主张把大量行政权限重新交还州政府，并限制联邦法院推翻地方立法的能力。州权主义者宣称，各州最了解自己的人民与传统；然而，也许缺乏联邦监督的地方，地方自由也可能再次成为维护歧视与特权的盾牌。"
  USA_Simple_Protestant_moral_values:0 "朴素的新教道德观"
  USA_Simple_Protestant_moral_values_desc:0 "美国的力量从来不仅来自工厂、军队与财富，更来自千千万万个家庭共同遵守的道德准则。新教传统所强调的勤劳、节制、责任、忠诚与个人自律，曾塑造共和国最坚实的社会基础。国家人民党将支持教会、社区组织与家庭教育重新承担道德引导职责，并在学校课程与公共文化中恢复传统伦理。只有当公民懂得敬畏上帝、尊重家庭并履行义务时，美国自由才不会沦为放纵与混乱。"
  USA_The_New_Gilded_Age:0 "鎏金时代"
  USA_The_New_Gilded_Age_desc:0 "昔日的鎏金时代见证了铁路横贯大陆、钢铁城市拔地而起，也证明了个人雄心与自由资本能够创造何等惊人的奇迹。如今，国家人民党将重新释放企业家、银行家与工业家的创造能力，通过削减监管、鼓励投资、扩大基础设施建设并保护私人财产，开启属于新时代的工业繁荣。财富的增长将带动就业、消费与技术革新，使美国再次成为世界最富裕、最具活力的经济强国。"
  USA_The_Land_of_Prosperity_and_Purity:0 "繁荣与纯净之国"
  USA_The_Land_of_Prosperity_and_Purity_desc:0 "真正强盛的国家必须同时拥有物质繁荣与精神纯净。国家人民党将以自由企业创造财富，以传统道德维持秩序，以爱国教育塑造团结，并清除侵蚀家庭、社区与民族认同的激进思想。工业城市将重新运转，乡村社会将得到保护，教会与学校也将共同承担培养下一代的责任。当繁荣不再与混乱相伴、进步不再以传统为代价时，美国才能成为一片富足、安定而纯洁的家园。"
  USA_The_awakening_of_the_American_nation:0 "美利坚之民族觉醒"
  USA_The_awakening_of_the_American_nation_desc:0 "长期的党派争斗与进步主义实验使美国人逐渐忘记，他们首先属于同一个伟大民族。国家人民党将跨越地区、阶级与旧党派界限，重新唤醒共同的历史记忆与国家使命。公共仪式、爱国教育、退伍军人组织与全国性群众运动将把人民团结在星条旗之下。无论来自南方农场、北方工厂还是西部边疆，每一位忠诚公民都将成为民族复兴的一部分。而那些非美种族者，也将得到他们应得的一切待遇。"
  USA_One_hundred_percent_Americanism:0 "百分之百的美国主义"
  USA_One_hundred_percent_Americanism_desc:0 "美国不能只是不同利益与身份临时拼合而成的土地，它必须拥有明确、统一而不可动摇的民族精神。国家人民党将推广百分之百的美国主义，要求每一位公民忠于共和国、使用共同语言并接受美国的历史传统。学校、军队、教会与公共机构将共同承担同化与公民教育的责任，使地方差异服从国家团结，让每个人都以身为美国人而非其他身份为最高荣誉。"
  USA_Defending_symbols_of_American_spirit:0 "保卫美国精神象征"
  USA_Defending_symbols_of_American_spirit_desc:0 "国旗、宪法、国歌、纪念碑与历代英雄的雕像，不只是冰冷的公共装饰，而是共和国共同记忆的载体。国家人民党将保护这些美国精神象征，打击亵渎国旗、破坏纪念设施与否定民族历史的行为，并扩大爱国纪念日与公共仪式的规模。同时，一切外来种族，国家，宗教和意识形态的象征与标识将在美国这边土地上被彻底扫除，焚毁殆尽。"
  USA_The_white_knights_allied_with_the_government:0 "与政府结盟的白色骑士"
  USA_The_white_knights_allied_with_the_government_desc:0 "遍布南方与中西部的3K党长期自称地方秩序、传统社会与新教文明的保卫者。与其让这些拥有广泛基层网络的组织游离于国家体系之外，政府不如将其纳入统一的爱国合作框架。通过登记、指导与协调，白色骑士将协助开展社区巡逻、反激进宣传、慈善活动与地方动员，使他们的组织能力服务于国家重建和社会稳定。"
  USA_Bring_purification_to_America:0 "为国家带来净化"
  USA_Bring_purification_to_America_desc:0 "数十年的自由主义、物质主义与激进政治已经侵蚀了美国传统社会的根基。国家人民党将发动一场全国性的道德净化运动，整顿色情出版物、赌博、腐败娱乐与破坏家庭伦理的社会风气，同时加强对学校、广播、电影与公共文化的指导。同时，对于全国的非盎格鲁-撒克逊民族者，政府将制定不同等级并对他们实行最终解决方案，以彻底净化这个国家的血脉。教会、家长组织和地方社团将成为这场运动的核心，使纪律、节制、责任与纯净种族重新成为公共生活的最高标准。"
  USA_Support_truly_patriotic_enterprises:0 "支援真正爱国企业"
  USA_Support_truly_patriotic_enterprises_desc:0 "企业不仅是创造利润的机构，也应当承担服务国家、雇用本国工人并维护美国利益的责任。政府将通过税收优惠、公共订单与信贷支持，扶植那些坚持本土生产、尊重传统价值并积极参与国防建设的爱国企业。与此同时，外国资本、激进工会与不忠诚的商业集团将受到严格审查。国家与企业之间的合作，将把私人创造力转化为民族复兴的强大动力。"
  USA_Ending_plague_of_liberalism:0 "终结自由主义的瘟疫"
  USA_Ending_plague_of_liberalism_desc:0 "自由主义曾经被视作共和国繁荣的象征，但在国家人民党的民族主义者看来，它早已蜕变为个人主义、享乐主义与道德沦丧的代名词。无止境的权利诉求、对传统价值的轻视以及激进思想的蔓延，正在不断侵蚀美国家庭、教会与社区赖以维系的社会秩序。政府将全面整顿教育、新闻、文化与公共机构，清除自由主义思想对国家精神的腐蚀，使责任重新高于放纵，义务重新先于权利。"
  USA_The_birth_of_a_nation:0 "一个国家的诞生"
  USA_The_birth_of_a_nation_desc:0 "一个真正伟大的民族，必须拥有共同的历史、共同的信仰与共同的命运。“一个国家的诞生”不仅记录了一段决定共和国未来的历史，也象征着美国民族意识重新觉醒的开始。国家人民党将以民族团结取代党派纷争，以共同文化超越地方隔阂，并让每一位忠诚的真正美国人都重新认识自己的民族使命。从这一刻起，美国将不再只是一个松散结合的联邦，而是一个拥有统一精神、共同理想与坚定信念的纯净的民族国家。而国家人民党将永远保护这片土地不受肮脏与野蛮的低等种族污染。"
  USA_The_humble_cause_of_conservatism:0 "保守主义的谦卑事业"
  USA_The_humble_cause_of_conservatism_desc:0 "保守主义从来不以制造宏大乌托邦为己任，它所承担的只是更为谦卑却也更加必要的事业：维护家庭、财产、地方自治与代代相传的社会秩序。进步派企图以行政命令和理论设计重塑整个国家，而南方保守派相信，真正可靠的改革只能建立在经验、节制与责任之上。国家人民党将重新团结那些珍视传统制度的公民，使政府停止无休止的社会实验，重新履行守护共和国根基的基本职责。"
  USA_Integrate_the_democratic_party_organization:0 "整合民主党组织"
  USA_Integrate_the_democratic_party_organization_desc:0 "尽管民主党在全国政治中遭受重创，但它遍布各州、县市与选区的基层组织仍然掌握着丰富的人脉、经验和动员能力。国家人民党若想真正取代旧有两党体系，就必须吸收这些地方委员会、竞选团队、工会中间人和南方党务领袖。通过统一候选人提名、共享资金来源并协调地方利益，我们将把昔日分散的民主党机器整合进新的保守联盟，使国家人民党在每一个社区都拥有可靠的组织基础。"
  USA_Allowing_the_political_machinery_to_run_unchecked:0 "放任政治机器"
  USA_Allowing_the_political_machinery_to_run_unchecked_desc:0 "政治理想固然重要，但共和国的日常运转更依赖那些熟悉地方事务、能够协调利益并确保选票的人。地方党魁、县级委员会与城市政治机器掌握着工作、救济、住房和公共工程的分配渠道，也因此能够维持社区忠诚。政府将减少对这些组织的干预，允许它们按照既有传统管理地方政治。只要机器能够保证秩序、动员选民并支持国家人民党，它们便仍是维系民主稳定不可替代的工具。"
  USA_Maintaining_the_non-intervention_policy:0 "维系不干预政策"
  USA_Maintaining_the_non-intervention_policy_desc:0 "美国的首要责任始终在西半球，而非卷入旧大陆无休止的王朝争端、边界冲突与意识形态战争。南方保守派与民主党人都明白，海外干预只会带来高昂军费、中央权力扩张和更多美国青年的牺牲。政府将继续坚持不干预原则，反对未经直接威胁便参加外国战争，同时加强本土防御与海岸安全。一个远离欧洲纷争、专注自身繁荣的美国，才能真正保持独立与自由。"
  USA_Tolerating_paramilitary_organizations:0 "容忍准军事组织"
  USA_Tolerating_paramilitary_organizations_desc:0 "在联邦机构无法及时维持秩序的地区，地方退伍军人团体、民兵协会和自卫组织长期承担着守护社区的职责。他们熟悉本地环境，也拥有迅速应对罢工、骚乱和激进活动的能力。国家人民党将允许这些组织在州政府监督下继续存在，并通过登记、训练和明确指挥体系将其纳入公共安全框架。只要他们忠于宪法、州政府与合法秩序，这些地方力量便能成为警察和国民警卫队的重要补充。"
  USA_National_news_and_media_regulation:0 "国家新闻与媒体管制"
  USA_National_news_and_media_regulation_desc:0 "广播、报纸与电影已经成为塑造公众意识的重要力量，却长期被少数财团、激进编辑和不负责任的煽动者所操纵。政府有责任确保新闻自由不会被用于破坏国家团结、散播谣言或鼓动社会冲突。我们将建立全国性的媒体规范，要求大型新闻机构公开资金来源、遵守战时与国家安全标准，并为政府声明提供必要版面。负责任的新闻事业应当服务真相、秩序与公共利益，而不是党派狂热。"
  USA_Allocate_funds_for_elite_education:0 "为精英教育拨款"
  USA_Allocate_funds_for_elite_education_desc:0 "共和国需要普及教育，但同样需要能够承担国家责任的杰出人才。法官、外交官、工程师、军官与高级行政人员不能仅凭大众热情产生，他们必须接受严格、长期且系统的培养。政府将扩大对传统大学、军事学院、法学院和精英预备学校的资助，并设立面向优秀学生的奖学金制度。通过维护高标准教育与古典学术传统，我们将培养一代具备纪律、教养和领导能力的新国家精英。"
  USA_The_new_government_led_by_the_president:0 "总统主导的新政府"
  USA_The_new_government_led_by_the_president_desc:0 "党派分裂、国会拖延与地方利益争斗已经使联邦政府失去应有的效率。国家人民党将重建以总统为核心的行政体系，由白宫统一协调各部委、州政府与党务组织。总统并非凌驾于宪法之上，而是作为全国选民授权的首席执政者，为国家提供明确方向与连续政策。通过削减重复机构、强化行政命令并建立忠诚可靠的顾问班子，新政府将结束华盛顿的混乱与推诿。"
  USA_Fight_for_true_justice:0 "为真正正义与进步"
  USA_Fight_for_true_justice_desc:0 "真正的正义并非不断制造新的社会对立，也不是依靠阶级斗争重新分配财富，而是让每一位勤劳守法的美国人都能够通过自己的努力获得体面的生活。国家人民党将恢复法律的权威、维护诚实劳动者的权益，并限制任何试图利用政府权力谋取特殊利益的集团。真正的进步，应建立在秩序、责任与共同繁荣之上，而不是无休止的社会实验。"
  USA_Guided_by_Fordism:0 "以福特主义为指导"
  USA_Guided_by_Fordism_desc:0 "亨利·福特证明，现代工业不仅能够创造惊人的财富，更能够改善工人的生活，提高整个国家的生产效率。政府将借鉴福特主义的成功经验，推动大规模流水线生产、标准化工业体系和企业福利制度，引导资本与劳动展开合作，而非彼此对立。工业家、工程师与技术人员将共同承担起建设新时代美国工业文明的使命。"
  USA_Jacksonism_in_the_New_Era:0 "杰克逊主义于新时代"
  USA_Jacksonism_in_the_New_Era_desc:0 "安德鲁·杰克逊所代表的不仅是一位总统，更是一种属于普通美国人民的政治传统。他反对金融寡头，维护联邦统一，同时坚信政府应当忠于真正的公民，而非少数利益集团。新时代的国家人民党将继承这种精神，在维护传统价值的同时打击特殊利益、恢复民主活力，使政府重新成为广大美国人民值得信赖的代表。"
  USA_Replace_trade_unions_with_guilds_and_associations:0 "指导劳资市场"
  USA_Replace_trade_unions_with_guilds_and_associations_desc:0 "持续不断的劳资冲突已经证明，对抗并不能创造财富，只会削弱整个国家的工业实力。政府将鼓励企业、行业协会、职业团体以及工人代表共同建立新的协调机制，通过行业协会、仲裁委员会和集体协商解决劳动争议，取代激进工会的政治化斗争。合作将取代对立，责任将代替煽动，美国工业也将在稳定的秩序中持续发展。"
  USA_Protecting_the_rights_that_indigenous_people_deserve:0 "[USA_paternal_autocrat_goal_1]"
  USA_Protecting_the_rights_that_indigenous_people_deserve_desc:0 ""
  USA_Protecting_the_rights_that_indigenous_people_deserve_murray:0 "保卫土著应得之权"
  USA_Protecting_the_rights_that_indigenous_people_deserve_murray_desc:0 "土著居民同样属于美国历史的一部分，他们理应享有法律保护、宗教自由以及稳定的生活环境。政府将在尊重传统部落文化的基础上扩大教育、医疗与农业援助，引导他们逐步融入共和国的发展之中。只有让每一个忠诚于美国的民族都能分享国家繁荣，美国的统一才能建立在更加牢固的基础之上。"
  USA_Protecting_the_rights_that_indigenous_people_deserve_lindbergh:0 "福特技官委员会的成立"
  USA_Protecting_the_rights_that_indigenous_people_deserve_lindbergh_desc:0 "现代国家不能仅依靠政客的经验进行治理，更需要工程师、科学家、企业管理者与技术专家共同参与决策。总统将成立直属白宫的福特技官委员会，负责协调工业规划、交通建设、能源开发与科技研究，为国家提供高效率、专业化且超越党派纷争的行政指导。"
  USA_Detectives_police_officers_and_the_National_Guard:0 "侦探，警察与国民警卫队"
  USA_Detectives_police_officers_and_the_National_Guard_desc:0 "维护共和国秩序不仅依靠军队，更需要侦探、地方警察与国民警卫队形成统一而高效的安全体系。政府将加强三者之间的协调合作，建立统一情报共享机制，完善跨州执法与紧急动员体系，使任何威胁公共安全、国家稳定与宪法秩序的行为都能够在第一时间得到制止。稳定的社会环境，是一切自由与繁荣赖以存在的基础。"
  USA_The_tradition_of_elegant_and_noble_knights:0 "[USA_paternal_autocrat_goal_2]"
  USA_The_tradition_of_elegant_and_noble_knights_desc:0 ""
  USA_The_tradition_of_elegant_and_noble_knights_murray:0 "优雅高贵的骑士传统"
  USA_The_tradition_of_elegant_and_noble_knights_murray_desc:0 "骑士精神并非停留在中世纪的浪漫幻想，而是一种关于忠诚、荣誉、责任与信仰的道德传统。国家人民党希望重新唤起这种服务国家、保护家庭、扶助弱者的精神，使退伍军人、地方领袖、教会组织和青年团体共同承担起维护社会秩序的责任。当荣誉重新成为美国社会最重要的品质时，共和国也将恢复昔日的高贵品格。"
  USA_The_tradition_of_elegant_and_noble_knights_lindbergh:0 "全视全知"
  USA_The_tradition_of_elegant_and_noble_knights_lindbergh_desc:0 "现代社会的秩序建立在信息、效率与纪律之上。政府将整合全国警务系统、行政档案、人口登记与工业统计，建立统一的数据管理网络，使国家能够及时掌握社会运行状况。通过科学管理与现代通讯技术，行政机关将拥有前所未有的协调能力，使共和国能够快速回应任何挑战，真正做到对国家运行全知全晓。"
  USA_The_return_of_the_spirit_of_the_confederation:0 "[USA_paternal_autocrat_goal_3]"
  USA_The_return_of_the_spirit_of_the_confederation_desc:0 ""
  USA_The_return_of_the_spirit_of_the_confederation_murray:0 "邦联精神的回归"
  USA_The_return_of_the_spirit_of_the_confederation_murray_desc:0 "邦联虽然在过去的战场上失败，但南方人民所坚持的地方自治、家庭责任与社区精神并未因此消失。国家人民党将重新肯定这些传统价值，把邦联精神理解为美国联邦制度的重要组成部分，而非历史的污点。尊重州权、维护地方自治、珍视祖先留下的文化遗产，将使整个国家重新找回属于自己的历史根基。"
  USA_The_return_of_the_spirit_of_the_confederation_lindbergh:0 "无需民主的共和国"
  USA_The_return_of_the_spirit_of_the_confederation_lindbergh_desc:0 "民主制度本应服务国家，而不是让国家沦为无休止党派斗争的牺牲品。当选票不断阻碍改革，当利益集团操纵议会，真正代表国家利益的行政权便必须承担起更多责任。林德伯格政府将建立一套更加高效、更加专业的国家治理体系，使政府摆脱短期政治的束缚，由行政机关、专家委员会与产业领袖共同规划共和国的未来。"
  USA_The_true_homeland_of_the_Anglo_Saxons:0 "属于盎格鲁-撒克逊人的真正家园"
  USA_The_true_homeland_of_the_Anglo_Saxons_desc:0 "美利坚共和国诞生于盎格鲁—撒克逊文明的发展传统，自由法治、自治精神、个人责任以及新教伦理共同塑造了国家今日的繁荣。国家人民党将继续维护这一文明基础，通过教育、文化与公共政策强化共同的民族认同，使美国始终保持其独特的历史传统与国家性格。在共同文化与共同价值的引领下，这片土地将继续成为盎格鲁—撒克逊文明最辉煌的家园。"
#经济国策
USA_start_reconstruction:0 "走出灾难阴影"
 USA_start_reconstruction_desc:0 "现在是让我们作为一个全新的国家，一个复兴的国家摆脱内战的阴云的时刻了。工业家，移民，少数民族和许许多多的人在内战中遭到了妖魔化，现在我们要重新团结他们，让大家再次成为美国人。但现在还有个重要的问题，那就是我们该如何重塑我们的政治架构。巨变到来了，而且我们应该向前看，看到我们的国家将要迎来的繁荣时代，而将过去的苦难抛下。"
 USA_Towards_national_rejuvenation:0 "迈向国家复兴"
 USA_Towards_national_rejuvenation_desc:0 "内战留下的不只是残垣断壁，更是一套支离破碎的全国经济体系。昔日彼此相连的矿山、农场、工厂、港口与金融市场，如今被废墟、地方壁垒和长期停滞隔断。零散的修补无法带来真正复兴，我们必须重新组织全国资源，使工业中心恢复生产，让能源重新流动，让城市与乡村再次彼此连接。从大西洋沿岸到太平洋彼端，从五大湖工厂到南方油田，整个大陆都将被纳入一场前所未有的重建。美国不会仅仅回到战前，而将以更雄厚的产能、更现代的基础设施和更紧密的全国市场，迈向真正的国家复兴。"
 USA_Support_Hnery_Ford:0 "亨利·福特的野心与智慧"
 USA_Support_Hnery_Ford_desc:0 "亨利·福特从来不缺少野心。他曾以流水线改变汽车制造，又以高工资和大众化产品重塑美国人的生活方式；如今，他提出的计划则远远超出一家公司应有的规模。福特希望通过扩大生产、压低成本和整合供应体系，使汽车不再是富人的玩物，而成为重建时期每个家庭都能拥有的工具。尽管这位工业巨头固执、强硬，且习惯按照自己的意志行事，但他的工厂、技术与组织能力正是国家急需的资源。政府将给予福特必要支持，让他的智慧与野心为美国复兴服务。"
 USA_Support_General_Motors:0 "通用汽车开足马力"
 USA_Support_General_Motors_desc:0 "通用汽车并不把未来押在某一种车型或某一位工业家的个人判断上。雪佛兰、别克、奥兹莫比尔和凯迪拉克共同构成了覆盖不同阶层的庞大产品体系，而分期付款、经销网络和现代企业管理则让它拥有福特所缺少的灵活性。政府将协助通用恢复工厂、整合供应商并扩大信贷，使其能够同时满足普通家庭、商业运输与政府采购的需要。当每一条生产线重新启动、每一间经销店再次开门，通用汽车便会带着整个美国工业再度腾飞。"
 USA_Let_every_worker_drive_a_Ford:0 "让每一位工人开上福特"
 USA_Let_every_worker_drive_a_Ford_desc:0 "一辆汽车不应只是成功人士的奖赏，它也应成为普通工人能够负担的生活必需品。扩大生产规模、标准化零部件和改善劳动效率，将继续压低汽车价格；稳定工资、分期付款和面向退伍军人的信贷计划，则会让更多家庭拥有属于自己的车辆。工人将不再只能制造自己永远买不起的商品。让每一位工人都能驾驶从自己参与建造的流水线上驶出的福特汽车，这既是工业繁荣的象征，也是大众消费时代重新到来的证明。"
 USA_Not_only_automobile_manufacturing:0 "不止汽车制造"
 USA_Not_only_automobile_manufacturing_desc:0 "汽车只是庞大工业体系中最显眼的终端产品。在车身与发动机背后，是钢铁厂的高炉、橡胶厂的压机、炼油厂的管线、玻璃厂的熔炉，以及生产轴承、电缆和机床的无数中小企业。政府不会把复兴计划局限于底特律，而将围绕汽车制造扩展整个供应网络。拖拉机、卡车、工程机械、航空发动机和家用电器也能共享这些技术与产能。"
 USA_Private_vehicles_rather_than_public_transportation:0 "私人车辆而非公共交通"
 USA_Private_vehicles_rather_than_public_transportation_desc:0 "铁路和城市电车曾塑造旧时代的美国，但战后的家庭向往更自由、更独立的生活。私人汽车使工人可以居住在更远的社区，使农民能够直接进入城镇市场，也让家庭不必再依赖固定时刻表安排自己的生活。联邦与各州将优先扩建公路、桥梁、停车设施和郊区道路，引导城市围绕个人交通重新布局。美国人的未来将不再被铁轨束缚，而将沿着公路伸向大陆的每一个方向。"
 USA_Luxurious_choice:0 "奢华之选"
 USA_Luxurious_choice_desc:0 "国家复兴并不意味着所有人只能接受千篇一律的廉价产品。随着收入恢复、信贷扩张和城市生活重新繁荣，消费者也开始追求性能、舒适与身份。镀铬车身、自动变速、强劲发动机和精致内饰将不再只是工业展览上的奇观，而会成为推动技术进步与高端制造的重要市场。福特旗下的高端奢华车型将获得发展空间，让美国汽车既能够服务普通家庭，也能向世界展示共和国重新获得的富裕与自信。"
 USA_A_big_leap_in_vertical_integration:0 "垂直整合大跨步"
 USA_A_big_leap_in_vertical_integration_desc:0 "原料短缺、运输中断和供应商倒闭曾让许多工厂即使拥有机器也无法恢复生产。为了避免经济命脉再次被某一个薄弱环节扼住，大型汽车企业将进一步掌握从铁矿、橡胶、玻璃和零部件到装配、运输与销售的完整链条。矿山、冶炼厂、货运线路和经销网络会围绕统一计划协调运行。垂直整合不仅能够降低成本，更会让美国工业在危机中保持独立与连续，使一辆汽车从矿石到成品的每一步都掌握在可靠体系之中。"
 USA_production_capacity_on_assembly_line_has_exploded:0 "流水线上的产能井喷"
 USA_production_capacity_on_assembly_line_has_exploded_desc:0 "曾经沉寂的厂房如今昼夜灯火通明。自动化机床、改良的传送系统和经过重新训练的工人，让生产节奏超过了战前最乐观的估计；标准化零件从各地工厂准时送达，完成的汽车则一辆接一辆驶向全国市场。产能增长不再以个位数计算，而如同被压抑已久的洪流突然冲破堤坝。就业、工资、税收和整个国家重新增长的信心都随着流水线的铺设逐步复苏。"
 USA_Contribute_to_technological_progress:0 "助力科技进步"
 USA_Contribute_to_technological_progress_desc:0 "经济复兴不能只依靠重新点燃旧机器，也不能满足于复制战前已经过时的生产方式。大学实验室、企业研究所与联邦技术部门必须共同承担开辟未来的责任。政府将扩大科研拨款，建立技术成果转化机制，并鼓励工程师直接参与工业重建。从新材料与精密机械，到电气化、通信和航空技术，每一次实验室中的突破都应当尽快走入工厂、农场和普通家庭。"
 USA_BWonderful_place_New_England:0 "美妙之地，新英格兰"
 USA_BWonderful_place_New_England_desc:0 "新英格兰是美国最古老的工业与文化腹地之一。它的港口曾迎接来自世界各地的商船，它的河流曾驱动早期纺织工厂，它的学院也塑造了几代共和国精英。然而，岁月、战争和产业转移使不少城镇陷入衰败。如今，我们将重新整修港湾、恢复工厂、开发水力资源，并把大学与企业纳入同一片区域发展网络。新英格兰不会只作为建国记忆中的故土存在，它将再次成为繁荣、教育与技术创新交汇的美妙之地。"
 USA_The_dam_rose_up_from_the_ground:0 "大坝拔地而起"
 USA_The_dam_rose_up_from_the_ground_desc:0 "新英格兰的群山与河谷蕴藏着远未充分利用的水力资源。随着混凝土、钢材和工程机械被源源不断送往施工现场，一座座水坝将在昔日偏僻的河道上拔地而起。它们将控制洪水、稳定供水、改善航运，并为城市与工厂输送廉价电力。旧日依赖季节涨落的河流，将被纳入现代工程体系之中。"
 USA_The_beauty_of_New_England:0 "新英格兰之美"
 USA_The_beauty_of_New_England_desc:0 "新英格兰的价值并不只存在于工厂烟囱和发电机组之中。海岸线、森林、湖泊、山地村镇与殖民时代遗迹，共同构成了美国最具辨识度的地域景观。政府将修复公路、旅馆与公共设施，划定自然保护区域，并鼓励各州发展旅游和休闲产业。来自全国各地的家庭将能够在夏季前往海岸，在秋日欣赏群山染红，在历史城镇中重新认识共和国的起源。保护自然与开发经济并非彼此矛盾，新英格兰之美本身便能够成为持久繁荣的源泉。"
 USA_The_wisdom_of_the_Ivy_League:0 "常春藤联盟之智慧"
 USA_The_wisdom_of_the_Ivy_League_desc:0 "哈佛、耶鲁、普林斯顿及其他历史悠久的学府，长期以来培养着美国的法官、工程师、外交官与企业领袖。在国家最需要人才的时候，这些校园不能继续与现实重建彼此隔绝。联邦政府将资助其研究项目，推动大学与工业部门合作，并吸引流亡学者、青年科学家和退伍军人进入高等教育体系。实验室的发现将服务于生产，课堂中的知识将转化为行政与工程能力。常春藤覆盖的古老校舍，将继续为新时代的美国提供智慧。"
 USA_Dupont_Group_turns_everything_into_gold:0 "杜邦集团点石成金"
 USA_Dupont_Group_turns_everything_into_gold_desc:0 "杜邦集团早已不再只是一个普通制造商。从化学纤维、涂料和塑料，到工业炸药、制冷材料与农业化学品，它的研究部门几乎能够为任何原料赋予新的价值。政府将向杜邦开放重建合同，协助其恢复供应网络，并鼓励其把军用化学技术转化为民用产品。煤炭、石油、木材乃至工厂废料，都可能在实验室与生产线上化为新的商品。杜邦无法真正将铅变成黄金，却能够以现代化学让平凡物质创造出近似黄金的财富。"
 USA_Travel_with_the_local_nobility:0 "与本地“贵族”同行"
 USA_Travel_with_the_local_nobility_desc:0 "新英格兰的旧家族、金融名门和地方慈善机构，至今仍掌握着庞大的资本、人脉与社会影响力。他们或许没有正式爵位，却在波士顿、纽波特与康涅狄格的庄园和董事会中维系着近似贵族的生活方式。与其将这些力量排斥在国家复兴之外，政府更应引导他们投资大学、港口、博物馆、住宅与地方工业。作为交换，他们将继续保有自身的社会声望与文化地位。共和国不承认世袭贵族，但也没有理由拒绝那些愿意与国家同行的旧式精英。"
 USA_New_England_the_land_of_culture:0 "新英格兰，文化之地"
 USA_New_England_the_land_of_culture_desc:0 "从爱默生与梭罗的文字，到波士顿交响乐团、地方出版社和历史悠久的博物馆，新英格兰始终在塑造美国人理解自身的方式。战争摧毁了建筑，却不应让一个地区的文化传统随之消亡。联邦与州政府将修复图书馆、剧院和纪念馆，扶持出版、广播与艺术教育，并重新开放连接各地文化机构的交流网络。当国家忙于铸造钢铁、铺设铁路和修建大坝时，它同样需要文学、音乐与历史提醒人民，为何这个共和国值得重建。"
 USA_The_Crown_of_American_Industry:0 "美利坚工业王冠"
 USA_The_Crown_of_American_Industry_desc:0 "经过港口修复、水电开发、大学合作与化学工业扩张，新英格兰已经摆脱了衰败地区的阴影。它拥有先进的研究机构、训练有素的劳动力、成熟的金融网络和面向大西洋的优良港湾，足以在精密机械、化工、电气设备和高附加值制造领域重新取得领先地位。这里未必拥有最多的矿山或最广阔的土地，却能够凭借知识、资本与技术制造全国最复杂的产品。新英格兰将不再只是美国工业的摇篮，而会成为镶嵌在其上的王冠。"
 USA_Black_gold_gurgles_like_a_river:0 "黑金汩汩似河"
 USA_Black_gold_gurgles_like_a_river_desc:0 "钢铁、高炉与汽车只是美国工业最耀眼的成果，而真正推动这一切运转的，是深埋地下的黑色黄金。石油能够驱动车辆、舰船和飞机，也能够成为塑料、化工与现代工业无数产品的起点。从得克萨斯到俄克拉荷马，从加利福尼亚到宾夕法尼亚，一口口油井将再次昼夜不停地喷涌。只要能源源不断流向工厂，美国经济的发动机便不会停歇。"
 USA_Let_things_take_their_own_course:0 "放任自流"
 USA_Let_things_take_their_own_course_desc:0 "企业家远比官僚更懂得如何寻找财富。联邦政府没有必要替资本决定每一口油井应当钻在哪里，也没有必要规定每一家矿业公司应如何经营。政府将维持稳定的法律与税收环境，开放更多勘探许可，并让市场竞争决定资源的最佳流向。只要利润存在，资本自然会找到它应当流向的地方，而国家也将从自由竞争中获得最大的繁荣"
 USA_Tighten_the_hand_of_the_state:0 "收束指导之手"
 USA_Tighten_the_hand_of_the_state_desc:0 "能源不仅是商品，更是国家安全的命脉。任由资本各自为战，只会造成重复建设、资源浪费和战略风险。联邦政府将建立统一协调机制，对重点矿区、油田和运输线路进行长期规划，引导大型企业扩大投资，并保证重要战略资源始终掌握在国家能够控制的范围之内。市场仍然存在，但国家必须牢牢握住方向盘。"
 USA_Expand_mining:0 "扩大开采"
 USA_Expand_mining_desc:0 "美国拥有世界上最丰富的自然资源之一。煤炭、铁矿、铜矿、铝土、稀有金属和石油仍有大片地区尚未得到充分开发。新的矿井、铁路和运输设施将不断向西部山区、南方油田和北方矿区延伸。每一处新发现的矿藏，都意味着更多工厂能够获得原料，也意味着更多家庭能够获得工作。沉睡于地下的财富，将重新成为共和国崛起的基石。"
 USA_A_steady_stream_flows_on_drawing_from_the_outside:0 "细水长流"
 USA_A_steady_stream_flows_on_drawing_from_the_outside_desc:0 "任何资源都有枯竭的一天，而真正成熟的大国不会把全部希望寄托于自己的土地。美国将在保障本土产量的同时积极投资海外油田、矿山与港口，通过贸易、投资和长期合同建立稳定的进口体系。我们不需要掠夺世界，只需要让来自世界各地的资源如同细水长流般不断汇聚美国，为工业提供永不停歇的动力。"
 USA_Establish_oil_hegemony:0 "确立石油霸权"
 USA_Establish_oil_hegemony_desc:0 "现代世界离不开石油，而控制石油的人便能够影响现代工业的发展方向。美国不仅要成为最大的产油国，也要成为最大的炼油国、运输国和石油设备出口国。输油管道将跨越大陆，超级油轮驶向海外港口，美国标准将成为全球能源贸易共同遵循的规则。当世界各国的工厂、舰队和汽车都依赖美国提供的能源体系时，石油霸权便不再只是经济优势，而会成为共和国最重要的战略力量。"
 USA_The_World_Factory:0 "世界工厂"
 USA_The_World_Factory_desc:0 "丰富的资源、充足的能源、成熟的金融体系和遍布全国的工业网络，使美国拥有任何国家都难以比拟的生产能力。汽车、飞机、机械、电器、钢材、化工产品和消费品将源源不断离开流水线，再通过铁路、港口和商船销往世界各地。世界将购买美国制造，美国也将在贸易中不断积累财富与影响力。共和国不仅要成为最大的市场，更要成为真正的世界工厂。"
 USA_The_foundation_of_America:0 "美利坚之根基"
 USA_The_foundation_of_America_desc:0 "任何伟大的国家，都需要一套足以支撑未来数十年的根基。铁路、公路、港口、机场、电网、通信网络、住宅社区与现代农业，共同构成了共和国最坚实的基础。它们不仅承载着今天的工业与商业，也将支撑下一代美国人的生活、教育、创新与梦想。当后来者回望这个时代时，他们或许不会记住每一座桥梁或每一条铁路的名字，却一定会承认，正是在这一时期，美利坚真正奠定了通向未来的根基。"
 USA_Federal-Aid_Highway_Act:0 "通过《联邦援助公路法》"
 USA_Federal-Aid_Highway_Act_desc:0 "内战证明，彼此隔绝的地方公路既无法维持全国商业，也难以在危机中承担人员与物资调动的重任。联邦政府将通过《联邦援助公路法》，与各州共同承担建设费用，统一道路、桥梁和交通标识标准，并规划一套连接主要城市、工业区、港口与军事基地的全国高速公路网。宽阔的车道将跨越山脉、河流和州界，使货车、客车与普通家庭能够安全而迅速地穿行于整个大陆。它所连接的不只是城市，更是一个重新统一的美国。"
 USA_Dispel_the_darkness_of_America:0 "驱散美利坚黑暗"
 USA_Dispel_the_darkness_of_America_desc:0 "战争摧毁的不只是道路与桥梁，也让无数乡村、矿区和偏远社区重新陷入黑暗。电力不仅意味着灯火，更意味着工厂能够昼夜运转、医院能够救治病人、学校能够继续授课，普通家庭也能够拥有现代生活。联邦政府将继续扩大输电网络，把发电厂、高压线路和变电设施延伸至全国每一个角落。当夜幕降临时，无论身处纽约街头还是西部农庄，美国都应拥有同样明亮的灯光。"
 USA_Westinghouse_Electric_is_in_the_right_time:0 "西屋电气正当时！"
 USA_Westinghouse_Electric_is_in_the_right_time_desc:0 "一个时代总会属于最能够把握机遇的企业，而今天，西屋电气正迎来属于自己的时代。从发电设备、工业电机到铁路信号、电器制造与广播技术，西屋几乎参与着现代电气工业的每一个领域。随着全国电气化不断推进，这家百年企业将承担越来越重要的角色，把稳定而廉价的电力送入工厂、车间、办公室和千家万户。"
 USA_The_Mainland_Railway_Plan:0 "大陆铁路计划"
 USA_The_Mainland_Railway_Plan_desc:0 "公路正在改变美国，但铁路仍然是共和国最重要的运输动脉。联邦政府将重新规划横贯大陆的铁路网络，修复战争中受损的线路，扩建货运编组站，并推动更高效率的调度系统。从煤矿到港口，从钢铁厂到农场，成千上万吨物资将沿着钢轨昼夜奔驰。铁路不仅连接城市，也重新连接起这个曾因战争而支离破碎的国家。"
 USA_American_ships_reach_everywhere:0 "美利坚航船无处不达"
 USA_American_ships_reach_everywhere_desc:0 "无论是大西洋、太平洋，还是五大湖与密西西比河，美国的繁荣始终离不开航运。新的港口、船坞、集装设施和现代化货轮将共同组成遍布全球的海上运输网络。美国制造将随着悬挂星条旗的商船驶向世界各地，而来自海外的原料与商品也将不断汇聚美国。共和国的影响力，不仅存在于大陆，更将在海洋上延伸至每一片航道。"
 USA_Take_Me_Higher:0 "带我飞得更高"
 USA_Take_Me_Higher_desc:0 "天空不应只是飞行员与军队的领域。随着喷气技术、导航设备和大型机场的发展，航空运输将成为连接美国与世界的新纽带。联邦政府将投资建设现代机场，完善航空管制系统，并扶持民航企业扩大航线网络。从纽约到洛杉矶，从芝加哥到海外大陆，越来越多的人将能够在短短数小时内跨越过去需要数日甚至数周的距离。"
 USA_Communication_entertainment_innovation:0 "通信，娱乐，创新"
 USA_Communication_entertainment_innovation_desc:0 "现代国家不仅依靠钢铁和混凝土，也依靠信息与创意。电话、有线广播、电视、电影、唱片和新兴电子技术正以前所未有的速度改变美国人的生活。政府将支持通信网络建设，鼓励电子工业发展，并推动娱乐产业走向世界。当知识传播得更快，思想交流得更广，美国的创新能力也将不断增强。"
 USA_Affordable_apartment_housing:0 "平价公寓住宅"
 USA_Affordable_apartment_housing_desc:0 "和平带来的不仅是工厂重新开工，还有数百万退伍军人和年轻家庭对于住房的巨大需求。联邦政府将联合地方政府和私人开发商，大规模建设价格合理、设施完善的新型住宅社区，为普通家庭提供安全舒适的居住环境。稳定的住房意味着稳定的社区，而稳定的社区则意味着国家真正走向繁荣。"
 USA_The_rural_scenery_of_the_United_States:0 "美利坚的田园风光"
 USA_The_rural_scenery_of_the_United_States_desc:0 "现代化不应只属于城市。辽阔的乡村仍然养育着共和国，也保存着美国最朴素的生活方式。公路、电力、自来水、学校、诊所和现代农业设施将不断向乡村延伸，让农村居民同样能够享受现代社会带来的便利。未来的美国，不会只有高楼林立的大都市，也会拥有充满生机的田园风光。"
 USA_Mechanization_brings_abundance:0 "机械化带来丰饶"
 USA_Mechanization_brings_abundance_desc:0 "拖拉机取代牲畜，联合收割机替代镰刀，灌溉系统与化肥不断提高土地的生产能力。现代机械正在把农业从繁重劳动中解放出来，使更少的人能够种植更多粮食。充足而廉价的农产品不仅保障了城市居民的生活，也为工业提供稳定市场。机械化带来的不仅是效率，更是整个共和国前所未有的富足。"
 USA_Everything_is_complete:0 "一切完备"
 USA_Everything_is_complete_desc:0 "道路贯穿大陆，铁路昼夜奔驰，港口商船云集，飞机划过长空，电力照亮乡村，电话连接千家万户，现代住宅不断兴建，农业持续丰收。曾经零散而破碎的重建工程，如今已经共同组成覆盖全国的现代基础设施体系。美国不再只是从战争中恢复，而是真正迈入了一个更加便利、更加强大、更具活力的新时代。"
 USA_NEW_YORK:0 "重新唤醒大苹果"
 USA_NEW_YORK_desc:0 "战争曾让纽约这颗美洲最璀璨的明珠蒙上灰尘。码头沉寂、工厂停摆、商业街萧条，昔日来自世界各地的人流与财富也一度消失。然而，大苹果从未真正失去生命力。政府将修复港口与地铁，恢复公共服务，清理废弃街区，并吸引企业、移民和艺术家重新回到这座城市。只要金融区再次响起钟声、百老汇重新亮起灯光、货轮重新驶入港湾，纽约便会再次成为美国面向世界的门户。"
 USA_A_city_of_debauchery_and_luxury:0 "纸醉金迷之城"
 USA_A_city_of_debauchery_and_luxury_desc:0 "繁荣归来之后，纽约人很快重新学会了享受生活。第五大道的橱窗陈列着最新时装，豪华酒店迎接来自各州与海外的宾客，餐厅、舞厅和夜总会则在入夜后灯火通明。有人批评这里挥霍无度，但消费本身也在创造就业、吸引资本并恢复城市信心。共和国的复兴不能永远停留在配给、废墟与节衣缩食之中；一座重新懂得奢华的纽约，正是美国摆脱战争阴影的最好证明。"
 USA_ORDER_IN_NEWYORK:0 "纽约秩序井然"
 USA_ORDER_IN_NEWYORK_desc:0 "一座伟大的城市不能只靠霓虹灯与股票行情维持运转。混乱的街道、腐败的地方机构、有组织犯罪和失灵的公共服务，都会侵蚀纽约刚刚恢复的繁荣。市政府将整顿警务与行政机关，打击盘踞港口、工会和娱乐业的犯罪网络，改善垃圾处理、消防和公共交通，并让市民重新相信法律能够保护他们的生活。秩序并非繁荣的敌人，而是让数百万人得以共享繁荣的必要条件。"
 USA_Fifth_Avenue_leading_to_prosperity:0 "通往繁荣的第五大道"
 USA_Fifth_Avenue_leading_to_prosperity_desc:0 "第五大道不仅是一条贯穿曼哈顿的街道，也是美国财富、时尚与商业雄心的橱窗。我们将改善道路与公共空间，鼓励百货公司、精品商店、酒店和办公企业重新投资，并将周边街区建设为面向全国乃至世界的消费中心。来自各地的商品将在这里争夺顾客，而纽约创造的潮流又将传播至整个大陆。沿着这条大道向前，人们看到的不只是繁华商店，更是通往全国消费繁荣的道路。"
 USA_The_ever-expanding_heart_of_New_York:0 "不断扩张的纽约之心"
 USA_The_ever-expanding_heart_of_New_York_desc:0 "曼哈顿已经无法独自容纳纽约不断增长的人口、企业与梦想。新的桥梁、隧道和地铁线路将把布鲁克林、皇后区、布朗克斯与斯塔滕岛更加紧密地连接起来，住宅、工业区和商业中心也会沿交通网络向外扩展。纽约的心脏不会被狭窄的岛屿边界束缚，而将随着城市圈不断向周边跳动。五个行政区不再是彼此分离的部分，而会共同构成一座真正意义上的世界都会。"
 USA_We_reach_straight_to_the_clouds:0 "我们直抵云霄！"
 USA_We_reach_straight_to_the_clouds_desc:0 "纽约有限的土地迫使建筑师将目光投向天空。钢铁骨架、电梯技术和现代工程方法，使办公楼、酒店与公寓能够一层层突破过去的高度。政府将简化合理的建设审批，更新消防和建筑规范，并鼓励私人资本参与城市天际线的重塑。新的摩天大楼将在曼哈顿拔地而起，容纳成千上万的企业与居民。它们不仅是房地产项目，更是一个重新崛起的美国向世界竖起的纪念碑。"
 USA_Financial_empire:0 "金融帝国"
 USA_Financial_empire_desc:0 "华尔街曾因战争与分裂失去对全国资本的支配，但美国经济的重建再次把银行家、投资者与企业带回纽约。证券交易所将恢复活力，银行重新向工业和住宅提供信贷，保险公司与投资机构则把来自全国的储蓄转化为新的工厂、铁路和摩天大楼。通过更完善的监管与稳定的金融秩序，纽约将重新成为共和国资本流动的中枢。这里作出的投资决定，将影响整个美国乃至世界的经济方向。"
 USA_lullaby_of_Broadway:0 "百老汇摇篮曲"
 USA_lullaby_of_Broadway_desc:0 "当剧院的帷幕再次升起，纽约才算真正从战争中醒来。百老汇将重新汇集演员、作曲家、编剧与舞者，让歌声与舞步取代街头曾经响起的枪声。政府与私人赞助者将帮助剧院修复设施，鼓励新作品上演，并通过广播、唱片和电影把舞台艺术传播到全国。每一个夜晚，霓虹灯下的观众都会暂时忘却生活的辛劳；而百老汇的摇篮曲，也将再次成为美国大众文化最动人的旋律。"
 USA_The_city_that_never_sleeps_never:0 "不夜之城永不眠！"
 USA_The_city_that_never_sleeps_never_desc:0 "港口昼夜装卸货物，地铁在城市地下奔流，金融区清晨便开始交易，而剧院、餐厅和广播电台直到深夜仍灯火通明。纽约的每一分钟都有人抵达、工作、交易、表演或追逐新的机会。经过全面重建，这座城市已经重新获得永不停息的节奏。无论其他城市如何兴起，纽约仍将是美国最繁忙、最多元也最充满野心的都会——因为真正的不夜之城，从来不会沉睡。"
 USA_Atlantic_Watcher:0 "大西洋守望者"
 USA_Atlantic_Watcher_desc:0 "纽约坐落于哈德逊河与大西洋交汇之处，既是全国商业的门户，也是美国东海岸最重要的守望者。港口设施、海岸警戒站、气象系统与航运通信网将得到全面升级，使城市能够保障商船安全、掌握大西洋航线，并在危机中迅速组织海上运输。自由女神仍将迎接跨洋而来的旅客，而她身后的纽约也会以强大的港口与工业力量，守望共和国通向世界的东方门户。"
 USA_The_wisdom_of_the_new_era:0 "新时代的智慧"
 USA_The_wisdom_of_the_new_era_desc:0 "新时代的国家竞争，不再只取决于人口、土地与矿产。谁能够更快理解自然规律，更有效组织知识，并将理论转化为生产力，谁就能掌握未来。联邦政府将扩大大学、国家实验室和企业研究机构之间的合作，建立长期科研预算，并为青年学者提供稳定的发展道路。科学家不应在资金中断与行政争执中浪费才华。美国将把知识本身视为一种战略资源，以新时代的智慧回应新时代的挑战。"
 USA_Technology_facilitates_production:0 "科技助力生产"
 USA_Technology_facilitates_production_desc:0 "一项发明只有离开图纸、进入工厂，才能真正改变国家。政府将推动实验室、工程部门与生产企业建立更紧密的联系，让新型合金、自动控制、精密机床、工业化学与电气设备尽快投入实际应用。技术改进将减少原料浪费，提高产品质量，并使工人能够在更安全的环境中完成更复杂的工作。科学不会取代劳动者，而会让每一双手创造出远超以往的价值。"
 USA_Science_worship:0 "科学崇拜"
 USA_Science_worship_desc:0 "美国人曾崇拜拓荒者、企业家与战争英雄，而如今，身穿实验服的科学家同样值得全国注目。报纸将报道重大实验，学校会鼓励孩子探索自然，博物馆、科学展览与公共广播则把复杂知识带入普通家庭。社会对科学的尊重将吸引最优秀的青年投身研究，并让理性、证据与创新成为国家共同推崇的品质。"
 USA_Weaponization_of_scientific_theories:0 "科学理论武器化"
 USA_Weaponization_of_scientific_theories_desc:0 "理论物理、化学、电子学和数学中的许多突破，看似远离战场，却可能改变战争本身的面貌。军方将与大学和企业共同建立机密研究机构，把雷达、制导、计算设备、新型炸药与航空技术纳入统一开发计划。每一个公式都可能成为更精确的瞄准系统，每一种新材料都可能塑造更快速的飞机。敌人不会因为科学过于纯粹便拒绝利用它，因此美国必须率先把知识转化为保卫共和国的力量。"
 USA_External_inspiration:0 "外部灵感"
 USA_External_inspiration_desc:0 "伟大的思想从来不会被国界永久束缚。欧洲与世界其他地区的动荡迫使许多杰出科学家、工程师和学者离开故乡，而美国有能力为他们提供安全、设备与研究自由。政府将简化人才入境程序，协助大学与实验室安置流亡专家，并系统吸收海外技术成果。来自不同学术传统的思想将在美国相遇、竞争并融合。我们不只是接纳人才，更要让世界最优秀的智慧成为美国新时代的一部分。"
 USA_Manhattan_Project:0 "曼哈顿工程"
 USA_Manhattan_Project_desc:0 "为了制造出真正能够超越时代的武器，联邦政府将把全国最优秀的科学家、工程师、军官与工业企业集中到一项最高机密工程之中，在偏远地区建设实验室、反应设施与材料生产基地。这项秘密计划规模庞大、成本惊人，却不存在退缩的余地。很快，在全美国的资源与智慧下，人类有史以来最为先进的战略武备将率先出现在这片土地上。"
 USA_Oppenheimer_high-energy_bomb:0 "奥本海默的高能炸弹"
 USA_Oppenheimer_high-energy_bomb_desc:0 "在罗伯特·奥本海默的领导下，分散于各所大学的理论物理学家已经被组织成一支前所未有的科研队伍。复杂的中子计算、材料纯化、爆轰设计与精密测量将在严密保密的实验基地中汇聚。工程师必须让纸面上的原理成为一件能够实际运作的装置，而军方则要确保所需资源不受任何阻碍。若计划成功，一枚炸弹便可能释放传统武器难以想象的能量，美国也将由此掌握足以终结任何大战的力量。"
 USA_Goddard_air_rocket:0 "戈达德的空中火箭"
 USA_Goddard_air_rocket_desc:0 "罗伯特·戈达德曾在嘲笑与怀疑中坚持研究液体燃料火箭，如今，他的构想终于获得国家层面的重视。更高效的发动机、稳定的制导系统和耐高温材料，将使火箭飞得更高、更快，也飞得比任何飞机更远。它们既能承担气象观测与科学实验，也可能成为跨越海洋的战略武器。过去被视为幻想的天空边界正在迅速后退，而美国将沿着戈达德开辟的道路迈向高空，乃至更遥远的世界。"
 USA_Lead_the_wave_of_science:0 "引领科学浪潮"
 USA_Lead_the_wave_of_science_desc:0 "从大学课堂到国家实验室，从工厂研究部到荒漠中的秘密试验场，美国已经建立起一套能够不断发现、验证并应用新知识的完整体系。原子能、火箭、电子计算、先进材料与通信技术正在共同改变工业、战争和日常生活。其他国家或许能够模仿某一项成果，却难以复制支撑这些成果的教育、资本与自由探索传统。科学浪潮已经席卷世界，而美国不会被它推动前进——我们将站在浪潮最前方，引领它奔向未来。"
#军事线
USA_military_reform:0 "雄鹰重振翅"
 USA_military_reform_desc:0 "美国拥有庞大的工业、人口与自然资源，却并未拥有一支与这些优势相称的军事武装。长期和平、预算争执与军种本位主义，使我们的军事体系逐渐落后于时代。面对日益紧张的国际局势，军队必须重新审视自身的组织、训练、装备与作战理论，让美利坚雄鹰重新振翅。"
 USA_The_Continental_Army_of_our_time:0 "属于我们时代的大陆军"
 USA_The_Continental_Army_of_our_time_desc:0 "大陆军曾在共和国诞生之初承担保卫独立的使命。如今，美国再次需要一支能够跨越辽阔国土、迅速完成动员并应对现代战争的国民军队。它既应继承昔日公民士兵的传统，也必须接受工业时代的纪律、技术与统一指挥。"
 USA_The_supreme_order_from_MacArthur:0 "麦克阿瑟的最高指令"
 USA_The_supreme_order_from_MacArthur_desc:0 "道格拉斯·麦克阿瑟主张，现代战争不能容忍迟疑不决的指挥体系。国家必须赋予最高统帅足够权力，使战略命令能够从指挥中枢迅速传达到前线。无论战争是否已经来临，美国陆军都应提前建立一套集中、明确而高效的指挥结构。"
 USA_The_Supreme_General_Staff:0 "令自总参出"
 USA_The_Supreme_General_Staff_desc:0 "各军区与兵种长期各行其是，使陆军难以形成统一战略。扩大总参谋部的协调权，并建立覆盖作战、情报、补给和训练的中央规划体系，能够确保所有部队围绕同一个目标行动。命令必须出自总参，也必须得到贯彻。"
 USA_Immediate_mobilization:0 "即刻动员"
 USA_Immediate_mobilization_desc:0 "现代战争不会给予我们数年时间从容准备。征兵登记、铁路运输、军需储备和工业转换都必须在危机发生前完成规划。通过建立常态化动员制度，美国可以在威胁出现后迅速召集兵员，而不必等到敌人逼近国门才仓促行动。"
 USA_Strong_leadership_orders_first:0 "强大领导，命令至上"
 USA_Strong_leadership_orders_first_desc:0 "一支军队若在每一道命令下达后仍陷入争论，便不可能赢得战争。明确军官权限、强化指挥责任并要求下级严格执行命令，将使陆军摆脱迟缓与混乱。战场可以容纳灵活应变，却不能容纳对指挥体系的公开动摇。"
 USA_Honor_belief_and_the_sound_of_radio_waves:0 "荣誉，信念与电波之音"
 USA_Honor_belief_and_the_sound_of_radio_waves_desc:0 "无线电已经改变了军队传递命令与塑造士气的方式。通过建立军事广播网络，我们既能向前线及时传达指令，也能向士兵反复强调荣誉、责任与爱国信念。电波将跨越山脉与海洋，使每一支部队都听见同一个美国的声音。"
 USA_Three_dimensional_modern_warfare:0 "除却胜利，别无选择"
 USA_Three_dimensional_modern_warfare_desc:0 "现代战场早已不再局限于地面。陆军、航空兵、炮兵、装甲部队与后勤系统必须在统一计划下协同行动，从多个方向同时压迫敌人。我们不能满足于避免失败；美国军队必须以取得彻底胜利为唯一目标。"
 USA_Craig_innovative_military_system:0 "克雷格的革新军事体系"
 USA_Craig_innovative_military_system_desc:0 "马林·克雷格认为，美国陆军最迫切的问题并非缺乏勇敢士兵，而是缺少一套适合大规模现代战争的制度。通过改革参谋体系、后勤组织与军官培养，我们能够在不盲目扩大常备军的情况下，提高整支陆军的专业程度与动员效率。"
 USA_Reform_the_General_Staff_system:0 "革新总参谋部"
 USA_Reform_the_General_Staff_system_desc:0 "总参谋部不应只是负责整理文件和制定纸面计划的官僚机关。它必须能够预测未来威胁，协调各兵种发展，并将演习经验转化为真正可行的作战方案。我们将重新划分职责，让参谋军官成为陆军运转的神经中枢。"
 USA_Correct_theory_leads_to_victory:0 "正确理论带来胜利"
 USA_Correct_theory_leads_to_victory_desc:0 "装备优势若缺乏正确理论指导，只会造成更昂贵的失败。陆军战争学院将系统研究外国战争、技术变化和美国自身的地理条件，建立适合我国的作战学说。只有先在思想上理解战争，我们才能在真正的战场上赢得战争。"
  USA_An_air_ground_coordinated_logistics_system:0 "空地协同的后勤体系"
  USA_An_air_ground_coordinated_logistics_system_desc:0 "道路、铁路和港口仍是大军行动的生命线，但航空运输已经为后勤体系提供了新的可能。飞机能够越过损毁的桥梁、恶劣地形和拥堵道路，将药品、弹药、维修零件与指挥人员迅速送往急需地点。我们将统一机场、仓库、运输机队与地面车辆的调度，使空中补给成为常规后勤计划的一部分。现代军队的补给线既铺设在大地之上，也延伸在天空之中。"
  USA_Be_promoted_to_a_capable_officer:0 "晋升有能军官"
  USA_Be_promoted_to_a_capable_officer_desc:0 "和平时期的晋升制度过于看重资历、社交关系和对上级的顺从，导致一些真正有能力的年轻军官长期得不到施展机会。现代战争需要能够理解机械化部队、迅速处理情报并在压力下承担责任的指挥者。我们将通过专业考核、演习表现和实际任职经历重新评价军官，而不再单纯按照年龄与年资排队晋升。只有让最有才干的人获得合适职位，陆军才能保持活力。"
  USA_Flexible_organizational_system:0 "灵活组织"
  USA_Flexible_organizational_system_desc:0 "固定编制能够维持行政秩序，却未必适合每一种战场任务。面对不同敌人和地形，指挥官可能需要更多炮兵、工程部队、装甲车辆或侦察力量，而不是机械地使用完全相同的师级结构。我们将允许部队根据任务临时组成战斗群，并改善不同兵种之间的通信和补给接口。组织形式应当服务于作战目标，而不是迫使战术迁就僵化的表格。"
  USA_Patriotism_is_the_frontline:0 "爱国为前线"
  USA_Patriotism_is_the_frontline_desc:0 "国家的第一道防线并不只位于海岸、边境或军事基地，也存在于普通国民是否愿意承担责任的信念之中。通过学校教育、退伍军人组织、公共演讲和军事宣传，我们将强化国防与公民义务之间的联系。工人在工厂中保证产量，农民维持粮食供应，工程师改善装备，而士兵则承担直接保卫国家的职责。"
  USA_Awaken_the_dormant_military_industry:0 "唤醒沉睡巨人"
  USA_Awaken_the_dormant_military_industry_desc:0 "美国拥有世界上最庞大的工业潜力之一，但和平时期的工厂并不会自动转化为兵工厂。生产民用汽车、机床和家用电器的企业，需要提前准备军用图纸、专用设备和原料供应方案。政府将同主要制造商签订动员合同，储备关键材料，并定期测试生产线转换能力。当国家真正需要时，沉睡的工业巨人必须能够迅速睁开双眼，而不是花费宝贵时间重新学习如何制造武器。"
  USA_Fuel_the_war_machine:0 "为战争机器注入燃料"
  USA_Fuel_the_war_machine_desc:0 "卡车、坦克、飞机和机械化设备使军队拥有前所未有的速度，也使它对石油、润滑剂、橡胶和维修零件产生了巨大依赖。一支缺乏燃料的现代军队，比一支没有马匹的旧式骑兵更加无助。我们将扩大战略石油储备，保护炼油与管道设施，并把燃料运输纳入全国动员计划。只有保证每一台发动机都能持续运转，战争机器才能真正发挥它的力量。"
  USA_Design_fantasies_of_the_new_era:0 "新时代的设计狂想"
  USA_Design_fantasies_of_the_new_era_desc:0 "军方实验室、大学和私人企业不断提交令人眼花缭乱的新式设计：更低矮的装甲车辆、可快速更换的模块、改进的无线电、半履带运输车以及适应特殊地形的工程装备。其中一些方案显得不切实际，甚至更像工程师在绘图板上的幻想，但真正的技术突破往往正是从这些大胆尝试中诞生。我们将扩大原型试验和竞争性采购，使有价值的创意不再因官僚惰性而被埋没。"
  USA_Pioneer_of_mobility_and_armor:0 "机动与装甲先驱"
  USA_Pioneer_of_mobility_and_armor_desc:0 "乔治·巴顿早在一战时期就敏锐意识到，坦克不应只被分散到步兵部队中，作为缓慢移动的火力支援。将装甲车辆、摩托化步兵、工程部队与自行火炮集中使用，可以迅速突破防线，并在敌军尚未反应前向其纵深推进。美国广阔的工业基础使大规模机械化成为现实，而完善的公路和汽车产业更为此提供了天然条件。我们将建立属于自己的机动作战学说，在速度、火力和协调中寻找决定性优势。"
  USA_rapid_offensive_leading_to_victory:0 "引领胜利的快速攻势"
  USA_rapid_offensive_leading_to_victory_desc:0 "突破敌军第一道防线只是进攻的开始，而不是胜利本身。若机动部队在取得突破后停下来等待命令，敌人就会重新组织防御并堵住缺口。我们的装甲和摩托化部队应持续向交通枢纽、指挥中心和补给线推进，迫使对手在混乱中不断后撤。快速攻势追求的不是地图上短暂的前进，而是彻底夺走敌人重新掌握主动的机会。"
  USA_Arm_soldiers_and_will_with_steel:0 "以钢铁武装士兵与意志"
  USA_Arm_soldiers_and_will_with_steel_desc:0 "现代步兵面对的不再只是敌方步枪，而是坦克、机枪、迫击炮和来自空中的持续威胁。每个基层单位都需要更可靠的自动武器、反坦克装备、无线电和装甲运输能力，使普通士兵不必在缺乏支援的情况下独自面对机械化敌军。钢铁不仅保护他们的身体，也赋予他们继续前进的信心。装备充分的士兵，才能真正把训练与勇气转化为战斗成果。"
  USA_McNair_Reform:0 "麦克奈尔的新体系"
  USA_McNair_Reform_desc:0 "莱斯利·麦克奈尔强调，美国需要的是一支整体可靠、能够迅速扩大并持续补充损失的军队，而不是少数耗费惊人的展示性精锐部队。编制、训练、装备和补给标准必须尽可能统一，使来自不同地区的新兵能够迅速融入同一种组织体系。他还主张通过实兵演习和严格考核暴露问题，而不是依靠纸面报告粉饰战备。麦克奈尔的新体系或许不够浪漫，却能够为大规模战争提供稳定基础。"
  USA_Assemble_artillery_support:0 "集结炮火支援"
  USA_Assemble_artillery_support_desc:0 "炮兵仍然是地面战争中最可靠、最具破坏力的支援力量，但分散使用的火炮无法充分发挥作用。通过统一前线观察、无线电通信和射击计算，多个炮兵单位可以在短时间内把火力集中到同一个目标上。步兵发起进攻前，敌军阵地必须先被压制、切断和扰乱。我们将改善炮兵指挥体系，让每一轮炮火都在正确时间落向真正重要的地点。"
  USA_Systematic_and_well_organized_training:0 "高效征募与系统化训练"
  USA_Systematic_and_well_organized_training_desc:0 "大规模扩军很容易带来数量，却未必能够产生真正的战斗力。我们将建立统一的征募、体检、能力分类和训练流程，根据新兵的教育程度、身体条件和技术背景分配岗位。基础训练将强调纪律、射击、野外生存和小队配合，专业学校则负责培养通信、维修、炮兵和工程人员。通过系统化安排，部队能够在较短时间内接收新兵，同时避免把未经准备的人仓促送往前线。"
  USA_Clark_Reform:0 "克拉克的协同战争"
  USA_Clark_Reform_desc:0 "马克·克拉克认为，单一兵种无论多么优秀，都无法独自解决现代战场上的全部问题。步兵负责夺取和控制阵地，装甲部队实施突破，炮兵压制敌方火力，航空兵则破坏其后方和增援。真正的困难在于让这些力量按照同一个时间表行动，而不是各自追求战果。我们将加强联合规划、通信与军官教育，使协同作战成为各级指挥官的基本能力。"
  USA_The_sharp_knife_of_the_Marine_Corps:0 "海军陆战队的尖刀"
  USA_The_sharp_knife_of_the_Marine_Corps_desc:0 "海军陆战队长期承担海外警戒、舰队支援和两栖行动，是美国最适合迅速应对远方危机的力量。复杂海岸、岛屿和设防港口要求士兵能够在缺乏完整后勤的情况下独立作战，并在登陆后迅速建立立足点。我们将扩大其专业训练，改进登陆艇、通信和近距离火力支援。陆战队将成为刺入敌方海岸的尖刀，为后续部队打开通向内陆的道路。"
  USA_Plan_carefully_and_strike_precisely:0 "联合军种，精确打击"
  USA_Plan_carefully_and_strike_precisely_desc:0 "庞大兵力与工业优势不应成为浪费生命和物资的理由。每一次重要行动都应建立在详细侦察、联合计划和明确目标之上，由炮兵、航空兵、海军与地面部队共同打击敌人真正脆弱的环节。精确并不只是命中某座桥梁或炮台，也意味着在正确的时间使用正确的力量。通过周密准备，我们能够以更小代价取得更有价值的成果。"
  USA_Krueger_Reform:0 "克鲁格与步兵火力"
  USA_Krueger_Reform_desc:0 "沃尔特·克鲁格始终认为，无论战争技术如何变化，最终仍需要步兵夺取并守住土地。但现代步兵若只依靠步枪和勇气，便会在坦克、炮兵和自动武器面前付出惨重代价。他主张提高营连级单位的机枪、迫击炮、反坦克武器和通信装备，使基层指挥官拥有独立处理局部威胁的能力。强大的步兵不是排斥技术，而是让技术真正服务于每一名士兵。"
  USA_Strategic_reconnaissance_and_firepower_assessment:0 "战略侦察与火力评估"
  USA_Strategic_reconnaissance_and_firepower_assessment_desc:0 "在炮弹落下、飞机起飞和部队发起进攻之前，指挥官必须首先知道敌人真正位于何处。航空照片、无线电监听、前线侦察和地图分析需要被整合进统一的目标评估体系。火力不应平均分散在整条战线上，而要集中摧毁敌方指挥所、炮兵阵地、桥梁和补给节点。准确情报能够节省弹药，更能避免士兵为错误目标付出生命。"
  USA_Break_through_occupy_hold_on:0 "步步为营的推进"
  USA_Break_through_occupy_hold_on_desc:0 "大胆突破固然令人振奋，但如果补给无法跟上、侧翼无人保护，快速前进的部队便可能成为被包围的孤军。我们的进攻必须在夺取关键地区后立即修复道路、建立仓库、部署防御并清除残余抵抗。每一阶段行动都要为下一阶段创造可靠起点。步步为营或许不如闪电般突进耀眼，却能确保已经取得的战果不会在敌人一次反击中化为乌有。"
  USA_Donovan_Reform:0 "多诺万的情报之战"
  USA_Donovan_Reform_desc:0 "威廉·多诺万相信，战争往往在正式宣战以前便已经开始。敌国的政治分歧、工业弱点、军事部署和外交关系，都可能成为决定未来胜负的重要情报。美国需要的不只是收集报告的机关，而是一套能够分析、验证并迅速向决策者提供结论的专业体系。通过整合外交、军方和秘密渠道，我们将更早发现威胁，也能在敌人尚未察觉时寻找可利用的裂缝。"
  USA_Insight_through_the_shadows_of_war:0 "穿越战争阴霾的洞察力"
  USA_Insight_through_the_shadows_of_war_desc:0 "所有国家都会隐藏真实意图，并用宣传、假情报和伪装掩盖自身行动。若我们的判断只依赖零散报告，便可能被敌人刻意制造的表象引向错误方向。密码分析、航空侦察、特工情报和公开资料应当相互印证，逐步还原对手真正的部署与计划。能够穿透战争迷雾的人，往往在第一场战斗打响前便已经获得优势。"
  USA_Dive_into_the_shadows:0 "潜入阴影"
  USA_Dive_into_the_shadows_desc:0 "有些任务不适合由身穿制服、公开行动的正规军完成。秘密联络、敌后侦察、破坏铁路、营救重要人员和扶持当地抵抗组织，都需要经过特殊训练的小型团队。我们将挑选具备语言、爆破、无线电和生存技能的人员，并为他们建立独立的训练与支援体系。他们不会出现在阅兵式上，却可能在最关键的时刻改变一场战役的走向。"
  USA_John_lee_Reform:0 "约翰·李的工程兵团"
  USA_John_lee_Reform_desc:0 "约翰·C·H·李强调，战争并不只由前线士兵和将军决定。道路、桥梁、仓库、医院、营地、供水和维修设施，才是维持大军持续行动的真正基础。美国需要扩大工程兵团，并让其在作战计划制定之初便参与其中，而不是等到部队受阻后才被临时召来。无论面对河流、山地、沙漠还是被破坏的城市，工程兵都必须为军队创造可以继续前进的道路。"
  USA_Jesus_Christ_Himself_Service:0 "耶稣基督本人的忠实服务"
  USA_Jesus_Christ_Himself_Service_desc:0 "约翰·李对后勤、规章和行政细节有着近乎宗教般的执着。虽然这种苛刻作风常令人疲惫，却能够确保每一份调令有人负责，每一箱弹药有据可查，每一辆卡车按时出发。战争中的英雄主义固然重要，但若没有这种近乎偏执的组织能力，最勇敢的军队也会因混乱而停下脚步。"
  USA_Everything_is_in_good_order:0 "一切井井有条"
  USA_Everything_is_in_good_order_desc:0 "庞大的军队每天都要处理难以计数的人员、装备、口粮、燃料和维修需求。任何一个小环节出现混乱，都可能在数百英里外造成严重后果。我们将统一表格、仓储、运输和补给标准，并明确各级部门的责任范围。这样的工作不会出现在宣传画中，却能让前线部队始终知道物资何时抵达、伤员送往何处以及损坏装备如何修复。"
  USA_Truscott_Reform:0 "特鲁斯克特与游骑兵"
  USA_Truscott_Reform_desc:0 "卢西安·特鲁斯克特认为，大规模正规部队之外，还需要一批能够迅速行动、独立判断并承担高风险任务的轻型精锐。游骑兵将接受严格的体能、射击、侦察和小队战术训练，用于突袭据点、夺取桥梁、渗透敌后和引导主力进攻。他们不应成为单纯追求荣誉的表演部队，而必须在关键地点执行普通部队难以完成的任务。"
  USA_Truscott_Trot:0 "特鲁斯克特小跑"
  USA_Truscott_Trot_desc:0 "特鲁斯克特要求士兵以明显快于普通步行的节奏进行长距离行军，这种训练方式很快便被称为“特鲁斯克特小跑”。新兵们往往在第一次训练后疲惫不堪，但持续练习能够显著提升耐力、纪律和单位行军速度。现代部队不能永远依赖卡车，在道路受阻或需要隐蔽行动时，双腿仍是最可靠的运输工具。能够比敌人更早抵达关键地点，往往就意味着掌握主动。"
  USA_The_night_battle_broke_through:0 "夜战破袭"
  USA_The_night_battle_broke_through_desc:0 "黑夜会削弱观察、通信和方向判断，但这些困难对准备不足的一方更加致命。通过训练夜间导航、静默通信、隐蔽接近和小队协同，我们可以把黑暗从障碍变成武器。精锐部队将在敌人最松懈的时刻穿过防线，破坏补给设施、袭击指挥机关并夺取关键阵地。当黎明到来时，对手或许才会发现自己的后方已经陷入混乱。"
  USA_We_will_defend:0 "我们将保卫！"
  USA_We_will_defend_desc:0 "无论未来威胁来自大洋彼岸、邻近海域，还是美洲大陆上的某个方向，美国都必须拥有保卫领土、人民与国家制度的力量。经过改革的陆军将拥有更清晰的指挥、更系统的训练、更强大的火力和更可靠的后勤，不再只是一支在危机中临时扩张的组织。我们不主动寻求战争，但也不会把和平寄托在他人的善意之上。无论敌人是谁，无论战场位于何处，我们都将保卫美国。"
  USA_America_rules_the_sky:0 "美利坚统治天空"
  USA_America_rules_the_sky_desc:0 "一战的缺席与大萧条的来临使得美国的整体军备极度落后于欧罗巴诸国，而空中部队的预算则是在本就捉襟见肘的军事预算中最少的一个。如今的美国空军已经极度疲弱，飞行员训练不足，而机型也缺乏更新与维护。为了在今后的战争中保障头顶的天空，联邦政府将投入大笔预算来建立足够强大的空中力量。"
 USA_Develop_new_models:0 "开发新机型"
 USA_Develop_new_models_desc:0 "航空技术的进步正在以前所未有的速度淘汰旧式飞机。更强劲的发动机、更合理的气动设计以及全金属机身，使几年前尚属先进的机型如今已经显得笨重而迟缓。我们必须扩大军方与航空企业之间的合作，让原型机更快走出绘图室，并以持续不断的新设计保持美国航空力量的技术优势。"
 USA_Joint_Action_Statement:0 "联合行动原则"
 USA_Joint_Action_Statement_desc:0 "空军的价值不应只体现在独立完成任务的能力上。战斗机、轰炸机、地面部队与海军航空兵必须围绕共同目标协调行动，通过统一的通信、目标分配与作战计划发挥彼此最大的优势。我们将确立一套新的联合行动原则，让天空中的力量真正成为整个战争机器的一部分。"
 USA_Construction_of_high_speed_airports:0 "高速机场建设"
 USA_Construction_of_high_speed_airports_desc:0 "更快、更重的新型军机需要更长的跑道、更坚固的地面设施以及更加完善的燃料与维修体系。过去那些适合轻型飞机的简易机场已经难以满足现代航空兵的要求。我们将扩建主要航空基地，并建设一批能够迅速起降、补给和转场的新式机场，使空军能够在全国范围内快速机动。"
 USA_Reorganize_the_Air_Force_Command:0 "重组航空军司令部"
 USA_Reorganize_the_Air_Force_Command_desc:0 "航空力量的迅速扩张已经使旧有指挥体系显得迟缓而混乱。训练、采购、作战与后勤之间职责交叉，不同航空单位也常常缺乏统一规划。重新划分航空军司令部的权限，并建立更清晰的指挥链，将使每一架飞机都服务于明确的战略目标。"
 USA_Elegant_air_fighter:0 "优雅的空中斗士"
 USA_Elegant_air_fighter_desc:0 "优秀战斗机必须在速度、爬升、火力和操纵性之间取得近乎苛刻的平衡。工程师们正尝试以更加流畅的机身、更强大的发动机与更轻的结构，把这些要求结合在同一架飞机上。真正优秀的战斗机不仅是一件武器，也应是一件能够在天空中尽情发挥性能的精密机器。"
 USA_Elite_training:0 "精英训练"
 USA_Elite_training_desc:0 "再先进的飞机交到经验不足的飞行员手中，也无法发挥真正价值。我们将提高飞行训练标准，加强射击、编队、导航和高强度机动课程，并筛选最优秀的飞行员进入高级战术学校。空战往往只在几秒钟内决定胜负，而精英训练就是让我们的飞行员在那几秒钟里做出正确选择。"
 USA_defensive_pursuit:0 "“防御追击”战术"
 USA_defensive_pursuit_desc:0 "战斗机最重要的任务之一，是在敌方轰炸机接近工业区、港口与城市之前将其拦截。所谓“防御追击”并不是被动等待，而是依靠雷达、观察哨和快速起飞体系，在敌机进入关键空域后迅速集中优势兵力。让敌人越过我们的天空之前，他们首先必须面对我们的截击机。"
 USA_Innovation_mobility:0 "革新机动"
 USA_Innovation_mobility_desc:0 "空战中的位置往往比单纯火力更重要。能够迅速爬升、转向、俯冲并重新获得高度的飞机，才能不断把自己置于有利攻击角度。通过改进飞行训练与战斗机设计，我们将把机动本身变成一种武器，让美国飞行员始终掌握空战节奏。"
 USA_Four_finger_formation:0 "四指队形"
 USA_Four_finger_formation_desc:0 "传统密集编队虽然便于保持队形，却限制了飞行员的观察范围和机动空间。由四架飞机组成、彼此错开的战斗编队能够提供更好的视野，也让僚机更容易相互掩护。采用这种更加灵活的队形，将提高战斗机单位的生存能力与攻击效率。"
 USA_Large_scale_combat_squadron:0 "大规模战斗中队"
 USA_Large_scale_combat_squadron_desc:0 "少量精锐战斗机可以赢得一次空战，却无法长期控制广阔天空。美国需要能够同时调动多个中队，在关键方向形成压倒性数量优势的指挥体系。通过统一编组、通信与地面调度，我们可以把分散的飞行员汇聚成真正的大规模空中力量。"
 USA_Lightning_and_Wild_Horses:0 "雷电与野马"
 USA_Lightning_and_Wild_Horses_desc:0 "美国航空工业正在孕育一代速度更快、航程更远、火力更强的战斗机。它们有的依靠强劲动力和独特布局获得惊人的性能，有的则以优异的航程与高速成为理想的远程护航者。无论是如雷电般扑向敌机，还是像野马一样驰骋长空，新一代战斗机都将成为美国空中力量的象征。"
 USA_Rotation_of_combatants:0 "战斗人员轮换"
 USA_Rotation_of_combatants_desc:0 "持续执行高强度飞行任务会迅速消耗飞行员的体力、判断力与精神状态。经验丰富的老手若一直留在最危险的岗位上，最终只会在疲惫中被一点点耗尽。建立战斗人员轮换制度，可以让优秀飞行员得到休整，并把他们的实战经验带回训练单位，培养下一批新手。"
 USA_Supporters_coming_from_the_air:0 "自空中而来的支援者"
 USA_Supporters_coming_from_the_air_desc:0 "地面部队最需要支援的时候，往往没有时间等待远方炮兵重新部署。攻击机和轻型轰炸机可以迅速抵达前线，对敌方炮位、车辆与集结地实施打击。只要建立可靠的地空联络机制，天空中的友军就能够成为步兵最及时的支援者。"
 USA_Armed_bomber:0 "武备投弹手"
 USA_Armed_bomber_desc:0 "轰炸机不能永远把生存希望寄托在护航战斗机身上。敌方截击机可能从任何方向逼近，因此大型轰炸机需要更完善的自卫火力、合理的射界以及相互支援的编队战术。让每一架轰炸机都成为一座会飞的武装堡垒，才能提高深入敌方空域后的生还机会。"
 USA_A_masterpiece_belonging_to_Douglas:0 "属于道格拉斯的杰作"
 USA_A_masterpiece_belonging_to_Douglas_desc:0 "道格拉斯公司的设计师已经证明，他们能够把可靠性、航程和生产便利性结合在同一架军用飞机上。通过与军方进一步合作，我们可以把其成熟的民用航空经验转化为更加优秀的军用平台。无论承担运输、攻击还是轰炸任务，道格拉斯都应当拿出一件足以代表美国航空工业实力的杰作。"
 USA_Contact_us_immediately:0 "即刻联络"
 USA_Contact_us_immediately_desc:0 "地面指挥官若无法及时与空中部队联络，再强大的航空支援也只能盲目寻找目标。无线电设备、前线航空管制员与标准化呼叫程序将使部队能够在发现敌人后迅速请求空中打击。未来，前线的一条简短电报或一次无线电呼叫，就足以让飞机立即改变航向。"
 USA_Cut_off_the_transport_aorta:0 "切敌后勤动脉"
 USA_Cut_off_the_transport_aorta_desc:0 "军队离不开铁路、公路、桥梁与仓库。与其不断轰炸坚固的前线阵地，不如绕到敌人身后摧毁维系其作战能力的交通网络。通过持续攻击铁路枢纽、车辆纵队和补给设施，我们可以让敌军即使仍有士兵和武器，也因缺乏燃料与弹药而逐渐失去战斗能力。"
 USA_Knight_Guard:0 "骑士护卫"
 USA_Knight_Guard_desc:0 "满载炸弹的重型轰炸机航程虽远，却很难独自抵御灵活的敌方战斗机。远程护航战斗机必须像守护骑士一样陪伴轰炸机编队跨越敌方领空，在任何截击者靠近之前将其驱散。只有为轰炸机提供可靠的空中护卫，深入敌境的战略打击才能真正持续下去。"
 USA_hunt_like_eagle:0 "如雄鹰般捕猎"
 USA_hunt_like_eagle_desc:0 "优秀的战斗机飞行员不应只是等待敌人进入视野，而要主动寻找猎物。利用高度、阳光、云层和速度优势，我们可以在敌机尚未发现危险之前完成接近，并以一次猛烈攻击结束战斗。像雄鹰一样选择时机、俯冲出击，然后重新攀升等待下一个目标。"
 USA_Maneuvering_and_attacking_tactics:0 "周旋扰袭式战法"
 USA_Maneuvering_and_attacking_tactics_desc:0 "面对数量更多或性能不同的敌机，正面缠斗未必是最明智的选择。高速接近、短促射击、迅速脱离，再从新的方向发起攻击，可以让我们不断消耗对手而避免陷入不利战斗。通过周旋与扰袭掌握主动，敌人最终会在疲惫和混乱中暴露破绽。"
 USA_The_Destroyer_at_an_altitude_of_ten_thousand_meters:0 "万米高空的毁灭者"
 USA_The_Destroyer_at_an_altitude_of_ten_thousand_meters_desc:0 "随着发动机、增压器和机舱技术不断进步，大型轰炸机已经能够在过去难以想象的高度持续飞行。高空不仅扩大了航程，也让许多传统防空武器和截击机难以有效威胁它们。我们将打造能够携带沉重炸弹飞抵万米高空的毁灭者，从敌人难以触及的天空投下打击。"
 USA_Global_Strategy:0 "全球战略"
 USA_Global_Strategy_desc:0 "美国的安全从来不只取决于本土上空。大西洋、太平洋以及连接两洋的海外基地，都可能成为未来战争中的决定性战场。航空力量必须拥有跨越大陆与海洋的能力，使华盛顿能够在世界任何重要方向投射力量，而不必等待敌人主动来到我们的国门。"
 USA_A_flying_aerial_fortress:0 "飞翔的空中堡垒"
 USA_A_flying_aerial_fortress_desc:0 "大型四发轰炸机代表着航空工程与工业能力的结合。厚重机身能够容纳大量炸弹、燃料和自卫武器，而多台发动机则赋予它们跨越遥远距离的能力。成群结队的重型轰炸机将像移动堡垒一样穿过天空，把美国的工业力量直接带到敌人头顶。"
 USA_Leap_across_the_ocean:0 "飞跃大洋"
 USA_Leap_across_the_ocean_desc:0 "海洋曾是美国最可靠的天然屏障，但航空技术的发展正在逐渐缩短这些距离。扩大远程飞机航程、建设海外机场并完善空中导航体系，将使我们的航空兵能够跨越大西洋和太平洋执行任务。未来的战争中，大洋不再是阻隔力量的边界，而只是飞机需要跨越的一段航程。"
 USA_Cast_the_fire_of_hell:0 "投下地狱之火"
 USA_Cast_the_fire_of_hell_desc:0 "轰炸机所携带的不只是普通高爆炸弹。燃烧弹、重型炸弹与其他专用弹药能够摧毁工业设施、仓库与大片城市目标，并在短时间内制造难以扑灭的火海。若敌人把整个工业体系投入战争，那么我们也必须做好把战争真正带到其后方的准备。"
 USA_Daytime_bombing:0 "昼间轰炸"
 USA_Daytime_bombing_desc:0 "夜幕能够保护轰炸机，却也会显著降低投弹精度。美国航空理论家更倾向于依靠高空编队、精密瞄准设备和强大的自卫火力，在白昼直接攻击敌方工业与交通目标。只要我们的轰炸机能够突破拦截，就能把炸弹准确投向真正具有战略价值的设施，而不是把宝贵载荷浪费在黑暗之中。"
 USA_Conquer_the_blue_sky:0 "征服蓝天"
 USA_Conquer_the_blue_sky_desc:0 "任何地面行动都不应在敌机可以自由活动的天空下进行。战斗机必须首先摧毁敌方航空力量，压制其机场并迫使残余飞机无法升空。只有当我们的飞行员能够自由选择何时、何地发动攻击时，真正意义上的制空权才算建立。蓝天不是背景，而是必须被争夺和征服的战场。"
 USA_Not_a_blade_of_grass_grows:0 "寸草不生"
 USA_Not_a_blade_of_grass_grows_desc:0 "战略轰炸追求的并非一座工厂或一条铁路的暂时停摆，而是系统性摧毁敌人继续战争的能力。工业区、交通网络、能源设施与军需生产将被纳入持续打击计划，一处目标修复之后便再次轰炸，直到生产与运输彻底陷入瘫痪。若战争必须由工业决定胜负，那么我们就要让敌人的工业土地再也无法为其军队提供一草一木。"
#外交
USA_Return_to_the_top_of_the_world:0 "重返世界之巅"
  USA_Return_to_the_top_of_the_world_desc:0 "内战与动荡一度迫使美国将目光收回本土，也让世界各国误以为这个年轻的共和国已经失去了昔日的力量。然而，美利坚的工业、人口与意志从未真正衰竭。随着国内秩序恢复，我们将重新整备舰队、扩展外交影响，并让世界再次习惯来自华盛顿的声音。美国不会永远停留在历史舞台的边缘；我们曾经登上世界之巅，如今也必将重返那里。"
  USA_Prepare_the_American_backyard:0 "料理美洲后花园"
  USA_Prepare_the_American_backyard_desc:0 "在美国重新干涉旧大陆事务之前，首先必须确保自己的身后再无隐患。长期的混乱使外国资本、激进思想与敌对政权得以渗入拉丁美洲，威胁着航道、贸易与大陆安全。国务院、军方和商业集团将共同制定一套全面计划，重新梳理西半球的政治秩序。门罗主义不只是一句尘封的警告，而是我们料理自家后院的实际准则。"
  USA_Too_Far_From_Heaven:0 "离天堂太远..."
  USA_Too_Far_From_Heaven_desc:0 "墨西哥人常说，他们离上帝太远，却离美国太近。对华盛顿而言，这并非一句抱怨，而是一项无可回避的地缘事实。一个混乱、敌对或受外国势力操纵的墨西哥，将永远是美国南部边境的威胁。我们将以外交压力、经济封锁与必要的军事手段迫使墨西哥接受现实：两国或许可以各自拥有国旗，但北美大陆的最终秩序只能由美国决定。"
  USA_The_Caribbean_gem_belonging_to_the_United_States:0 "属于美国的加勒比明珠"
  USA_The_Caribbean_gem_belonging_to_the_United_States_desc:0 "古巴扼守墨西哥湾与加勒比海的门户，其港口、蔗糖产业和战略位置都使它成为美国无法忽视的明珠。数十年来，我们以保护其独立为名维护当地秩序；如今，含糊不清的保护关系已经无法满足国家安全需要。无论通过扶植可靠政府、扩大驻军，还是采取更直接的行政安排，哈瓦那都必须牢牢纳入美国的势力范围。加勒比明珠理应镶嵌在美利坚的王冠之上。"
  USA_Release_the_Caribbean_Wolf_Dog:0 "放出“加勒比狼狗”"
  USA_Release_the_Caribbean_Wolf_Dog_desc:0 "多米尼加的野心勃勃的军头特鲁希略懂得一个简单的道理：在加勒比地区，服从华盛顿远比挑战华盛顿更有利。只要给予武器、资金和适当的政治支持，这条凶猛而忠诚的‘狼狗’便能替我们震慑岛上的反对派、清除激进组织，并监视周边国家的动向。美国无需亲自处理每一场骚乱；一个愿意替主人露出獠牙的地区盟友，往往比一支长期驻扎的远征军更加高效。"
  USA_Fuck_Haiti:0 "颠覆巫毒之国"
  USA_Fuck_Haiti_desc:0 "海地长期的政变、地方割据与神秘主义政治，已经使这个国家成为加勒比秩序中最不稳定的一环。当地政府既无法保障美国投资，也无力阻止走私者、激进分子和外国代理人的活动。我们将资助可靠派系、控制关键港口，并在必要时直接推翻不合作的政权。当太子港拒绝接受秩序时，华盛顿便有责任替它作出选择。"
  USA_The_predetermined_fate_of_the_banana_republics:0 "香蕉共和国们的既定命运"
  USA_The_predetermined_fate_of_the_banana_republics_desc:0 "中美洲诸国的铁路、港口、种植园和政府财政早已与美国资本紧密相连，可当地政客仍时常幻想摆脱这一现实。危地马拉、洪都拉斯、尼加拉瓜等国的统治者必须明白，他们的繁荣来自进入美国市场，他们的安全也依赖美国舰队。我们将迫使这些政权保护投资、清除敌对势力并服从大陆战略。香蕉共和国的命运并非独立于美国，而是作为美国经济体系的一部分继续存在。"
  USA_Say_goodbye_to_Bolivar_wandering_spirit:0 "与玻利瓦尔的游魂告别"
  USA_Say_goodbye_to_Bolivar_wandering_spirit_desc:0 "玻利瓦尔关于南美团结与自主的梦想，至今仍被一些民族主义者奉为反抗美国影响的旗帜。然而，割裂的共和国、频繁的政变和彼此敌视的政府早已证明，这种浪漫理想无法建立稳定的大陆秩序。华盛顿将分化那些试图组织反美联盟的国家，扶植愿意合作的政治力量，并摧毁任何挑战美国领导权的地区集团。玻利瓦尔的幽灵已经徘徊太久，是时候让它彻底退场了。"
  USA_Remnants_of_the_Portuguese_colonial_empire:0 "葡萄牙殖民帝国的残片"
  USA_Remnants_of_the_Portuguese_colonial_empire_desc:0 "巴西虽以共和国自居，却依旧保留着葡萄牙殖民帝国留下的疆域、等级与大国野心。凭借人口、资源和广阔国土，它完全可能成为南美洲唯一足以挑战美国的国家。我们必须趁其尚未完成整合前迫使里约热内卢接受新的力量格局。无论是通过经济控制、外交孤立，还是扶植更加顺从的政府，这块葡萄牙帝国留下的巨大残片都必须纳入华盛顿所规划的大陆体系。"
  USA_Leaping_over_the_Andes_Mountains:0 "飞跃安第斯山脉"
  USA_Leaping_over_the_Andes_Mountains_desc:0 "安第斯山脉长期被视为隔绝太平洋沿岸与南美腹地的天然屏障，但现代航空、机械化部队和远洋舰队已经让这道屏障失去意义。美国将扩大在太平洋沿岸的港口使用权，向秘鲁、智利及周边国家施加压力，并建立跨越山脉的情报与补给网络。从加勒比到合恩角，再险峻的地形也不能阻挡美国力量前进。白头鹰将越过安第斯，让南太平洋同样听见它振翅的声音。"
  USA_The_New_America_Order_belonging_to_the_United_States:0 "属于美利坚的新大陆秩序"
  USA_The_New_America_Order_belonging_to_the_United_States_desc:0 "从北美平原到加勒比群岛，从中美洲地峡到南美洲最南端，西半球终于被纳入一个统一而稳定的战略体系。各国或许仍保留自己的政府与旗帜，但它们的外交、贸易与国防都将围绕华盛顿制定的准则运转。外国势力将被驱逐，反美联盟将不复存在，任何地区冲突也必须服从美国的裁决。这不是旧欧洲式的殖民帝国，而是属于美利坚、由美利坚领导的新大陆秩序。"
  USA_Atone_for_the_humiliation_of_1814:0 "一雪1814之耻"
  USA_Atone_for_the_humiliation_of_1814_desc:0 "一个多世纪以前，英国军队攻入华盛顿，国会大厦与总统官邸燃起熊熊烈火。这场屈辱早已载入共和国的历史，也成为美国民族记忆中永远无法抹去的一页。如今，大英帝国早已风光不再，而流亡加拿大的王室与政府仍妄图维持昔日的霸权。属于美国的时代已经到来，我们将彻底终结1814年留下的最后一道阴影，让这份迟到百余年的历史账本画上句号。"
  USA_America_belonging_to_the_Americans:0 "属于美洲人的美洲"
  USA_America_belonging_to_the_Americans_desc:0 "门罗主义诞生时，美国尚且弱小，只能警告欧洲列强不要继续染指新大陆。而今天，我们已经拥有将这一原则彻底付诸实践的力量。无论是流亡帝国、殖民政府还是任何试图重返西半球的外国势力，都不应继续存在于这片大陆。美洲属于生活在这里的人，而维护这项原则的责任，则属于整个美利坚合众国。"
  USA_North_Atlantic_outpost:0 "夺取大西洋前哨"
  USA_North_Atlantic_outpost_desc:0 "真正的大西洋防线并不始于纽约港，而始于那些散布在北大西洋上的岛屿、港湾与海军基地。谁控制了这些前哨，谁便掌握了北美东海岸的安全与跨洋航运的命脉。美国海军将夺取这些战略据点，建立覆盖整个北大西洋的补给与巡逻网络，使任何敌对舰队都无法轻易逼近我们的海岸。从今天起，大西洋的门户也将由星条旗亲自守卫。"
  USA_Pivot_to_Asia:0 "重返亚太"
  USA_Pivot_to_Asia_desc:0 "USA_Pivot_to_Asia_desc:0 "美国曾以跨越大陆的铁路、远航太平洋的舰队与遍布海上的商船，将自身塑造成亚太地区不可忽视的力量。然而，内战与国内动荡迫使我们暂时放弃西进事业，也给了日本、德国及欧洲殖民势力填补真空的机会。如今共和国已经重新站稳脚跟，是时候让舰队驶离西海岸，使星条旗再次出现在太平洋的每一条重要航道上。"
  USA_Scattered_outposts:0 "广布桥头堡"
  USA_Scattered_outposts_desc:0 "广阔的太平洋不可能仅靠一支停泊在本土港口的舰队加以控制。岛屿、环礁与深水港将组成美国力量向西延伸的锁链，为舰艇提供燃料，为航空兵提供机场，也为商船提供安全的补给点。我们将扩建现有基地，并以租借、保护或直接占领的方式取得更多据点。只要这些桥头堡牢牢掌握在手中，美国海军便可在整片大洋自由行动。"
  USA_Like_James_Cook_did_in_his_conquests:0 "如詹姆斯·库克般征服"
  USA_Like_James_Cook_did_in_his_conquests_desc:0 "库克船长的航行曾将太平洋上的岛屿、海岸与航路绘入欧洲人的地图，也为后来席卷大洋洲的殖民扩张铺平道路。如今，旧日海洋帝国已经衰落，它们遗留的岛屿与自治领却仍占据着控制南太平洋的关键位置。美国的测量船、外交官和陆战队将沿着库克曾经走过的航线前进，把这些遥远土地纳入一个更强大、更现代的太平洋体系。"
  USA_The_pitiful_legacy_of_the_coachman:0 "马车夫的可悲遗产"
  USA_The_pitiful_legacy_of_the_coachman_desc:0 "昔日的尼德兰曾被称为“海上马车夫”，依靠船队与商社建立了横跨群岛的东方殖民帝国。然而，荷兰人的黄金时代早已终结，只留下支离破碎的殖民机构、脆弱的驻军与取之不尽的橡胶、石油和矿产。如此重要的群岛不能继续掌握在一个无力自保的旧帝国手中。美国将接管这份可悲的遗产，使东印度群岛真正服务于太平洋的新主人。"
  USA_The_New_Colonial_Era:0 "新殖民时代"
  USA_The_New_Colonial_Era_desc:0 "旧殖民时代由王室特许公司、传教士和冒险家开创，而新的时代则属于航空母舰、跨国资本与现代行政机构。美国不必模仿欧洲列强僵化而残酷的统治方式，却必须确保战略港口、原料产地与重要航道掌握在可靠力量手中。以发展、保护和秩序为名，我们将在太平洋建立一种更有效率的统治体系，一个由华盛顿规划、由美国舰队维系的新殖民时代已经到来。"
  USA_In_the_vast_expanse_of_ice_and_snow:0 "于冰天雪地中的第二次干涉"
  USA_In_the_vast_expanse_of_ice_and_snow_desc:0 "上一次美国士兵踏上俄国冰封的土地时，他们就已改变那场革命的结局，狼狈的红军只能从符拉迪沃斯托克黯然撤离。如今，俄罗斯与西伯利亚再度陷入混乱，辽阔土地上的港口、铁路和资源也再次无人守护。我们将重演过去那场对苏维埃俄国的干涉，让星条旗第二次出现在冰天雪地之中，直至插上克林姆林宫顶。"
  USA_The_World_Two_Pole_Conference:0 "世界两极之会"
  USA_The_World_Two_Pole_Conference_desc:0 "横跨太平洋的美国与横跨欧亚大陆的俄国，正在成为旧世界废墟上最具潜力的两大力量。若双方能够明确各自的安全边界、贸易利益与地区责任，许多不必要的冲突便可避免。两国代表将在同一张会议桌前讨论世界未来：由俄国维护欧亚大陆的均势，由美国保障海洋与西半球的秩序。"
  USA_The_iron_curtain_fell:0 "铁幕降下"
  USA_The_iron_curtain_fell_desc:0 "俄国的扩张并未随着战争结束而停止。它的军队、代理人和政治思想正越过边界，逐渐将半个欧亚大陆封闭在莫斯科的权力之下。从波罗的海到太平洋，一道看不见却愈发坚固的铁幕正在降下。美国不能允许任何大陆霸权独占世界岛。我们将联合一切受到威胁的国家，建立军事、经济与情报防线，把俄国的野心遏制在铁幕之后。"
  USA_The_Land_of_the_Rising_Sun:0 "旭日之地"
  USA_The_Land_of_the_Rising_Sun_desc:0 "日本从一个封闭的岛国崛起为亚洲最强大的军事国家，其舰队、工业与帝国野心都足以改变整个太平洋的力量平衡。东京可以成为美国在远东最有价值的合作者，也可能成为我们重返亚洲道路上最大的障碍。无论最终选择合作、遏制还是战争，华盛顿都必须认真处理这片旭日之地。太平洋的未来，将由美日两国之间的关系决定。"
  USA_Negotiations_across_the_ocean:0 "跨越重洋的谈判"
  USA_Negotiations_across_the_ocean_desc:0 "美国与日本之间存在竞争，却并非注定必须以战争收场。跨越重洋的谈判将围绕贸易、海军规模、势力范围与中国问题展开。只要东京承认美国在太平洋上的正当利益，华盛顿也可以接受日本在其近海拥有相应地位。两国无需为了每一座岛屿兵戎相见；事实上一份由现实主义而非感情促成的协议，或许足以让太平洋暂时容纳两支强大的舰队。"
  USA_Intimidate_the_mad_dog_of_the_military_state:0 "恫吓军国疯狗"
  USA_Intimidate_the_mad_dog_of_the_military_state_desc:0 "东京的军国主义者把克制视为软弱，把每一次让步都理解为继续扩张的许可。既然言辞无法使他们清醒，那便让航空母舰、远程轰炸机与经济封锁替我们发言。美国将集结太平洋舰队，切断日本赖以维持战争的石油和原料，并向其政府发出最后通牒。军国疯狗或许听不懂外交辞令，但它一定能够听懂炮口转动的声音。"
  USA_Maintain_the_springboard_of_East_Asia:0 "维系东亚跳板"
  USA_Maintain_the_springboard_of_East_Asia_desc:0 "菲律宾群岛与中南半岛是美国通往东亚大陆的天然跳板，也是连接西海岸、关岛与中国海的战略枢纽。无论东南亚的蕞尔小国们采取何种政治形式，其港口、机场和海峡都不能落入敌对国家手中。我们将扩大驻军、训练当地部队并改善岛屿防御，同时确保东南亚经济继续与美国市场紧密相连。只要这块跳板仍在掌握之中，美国便永远不会被赶出东亚。"
  USA_The_Sea_of_Peace:0 "太平之海"
  USA_The_Sea_of_Peace_desc:0 "太平洋这个名字本应意味着和平，却长期被殖民争夺、海军竞赛与帝国野心所笼罩。然而如今美日之间达成的和平协议将终结这种不安，使贸易航路不再受到袭扰，使岛屿国家不再沦为列强争夺的棋子。和平并不来自空洞的宣言，而来自任何挑战者都无法撼动的秩序。当美国舰队守望整片大洋时，太平洋才配得上“和平之海”的名字。"
  USA_Trapped_in_an_endless_quagmire:0 "背后出击"
  USA_Trapped_in_an_endless_quagmire_desc:0 "日本军队已经深陷亚洲大陆，漫长的战线吞噬着人员、燃料与装备，而东京仍拒绝放弃那场永无止境的战争。对美国而言，再没有比此刻更合适的机会。我们将渗透进日本人的每一处战线中，无数武器与战略资源将被赠与给每一个与日本帝国为敌的政权。当军国主义者仍在泥潭中挣扎，美国天兵将结束他们的帝国迷梦。"
  USA_the_fallen_of_the_Sun:0 "陨落之日"
  USA_the_fallen_of_the_Sun_desc:0 "旭日旗曾经覆盖从北方寒岛到南洋群岛的广大海域，日本军国主义者也一度相信他们的帝国能够永远统治亚洲。然而，在美国工业、海军与空中力量的联合打击下，这轮旭日终究会走向陨落。日本必须解除武装、放弃征服，并接受由美国塑造的政治秩序。否则等待东京的只有持续日久的总体战争。"
  USA_Asia_prosperity:0 "亚细亚繁荣"
  USA_Asia_prosperity_desc:0 "一切尘埃落定之后，亚洲不能继续成为贫困、殖民统治与军阀混战的代名词。美国资本、技术与市场将帮助各国重建港口、铁路和工业，恢复跨太平洋贸易，并建立稳定的金融体系。繁荣的亚洲不仅能够阻止激进主义蔓延，也将为美国企业带来前所未有的机会。在华盛顿领导下，一个以自由贸易、经济发展与共同安全为基础的亚细亚繁荣时代即将开始。"
  USA_The_possibility_of_permanent_peace_in_the_Far_East:0 "远东永久和平之可能"
  USA_The_possibility_of_permanent_peace_in_the_Far_East_desc:0 "远东的历史似乎总在战争、革命与帝国竞争之间循环，但这样的命运并非无法改变。当日本军国主义受到约束，俄国扩张遭到遏制，重要航道由美国舰队保护，各国便终于能够在稳定框架下处理争端。我们将推动建立长期安全机制，以贸易连接彼此，以共同防务阻止侵略。永久和平或许仍是遥远的理想，但美国已经为实现它创造了前所未有的可能。"
  USA_From_the_New_World:0 "自新大陆"
  USA_From_the_New_World_desc:0 "自美国诞生以来，大西洋始终既是一道屏障，也是一条纽带。华盛顿曾告诫后人避免卷入旧大陆无休止的争端，而此后一代又一代美国人也习惯相信，只要守住西半球、经营自己的大陆，欧洲的战争、仇恨与革命终究不会改变美国的命运。然而，现代工业与世界贸易则使两岸的经济早已无法彻底分离。对于过去的美国而言，这些或许只是外交官报告中的遥远纷争，但对于如今已经拥有全球贸易和海外利益的美国而言，欧洲局势已经无法再被简单归入“别人的问题”。那个只需背对大西洋便能置身世界之外的美国已经成为过去。如今，新大陆将再一次向旧大陆伸出自己的干涉之手。"
  USA_Two_eagles_standing:0 "双鹰并立"
  USA_Two_eagles_standing_desc:0 "一只白头鹰翱翔于新大陆，一只黑鹰盘旋于欧洲大陆。它们并非天生的敌人，而是两个拥有相似实力与共同利益的伟大国家。美德两国将建立前所未有的战略伙伴关系，在维护世界稳定、遏制共同敌人以及保障国际贸易方面彼此合作。双鹰无需相互争斗，因为整个天空足以容纳它们共同飞翔。"
  USA_The_Friendship_Ship_of_Lucetania:0 "卢西塔尼亚的友谊之船"
  USA_The_Friendship_Ship_of_Lucetania_desc:0 "位于大西洋中央的卢西塔尼亚群岛，是连接欧洲与美洲的重要中转站。而在第一次世界大战中，也正是由于卢西塔尼亚号被英法误击使得美国最终站到了偏向德国的一方。如今，这里不仅变成了承载着跨洋贸易的枢纽，也象征着美德两国友谊横跨大洋的桥梁。通过共同建设港口、机场与补给设施，这座昔日偏远的群岛将成为连接柏林与华盛顿的重要纽带，让大西洋真正成为合作而非对抗的海洋。"
  USA_Re-delineate_the_boundaries_of_oceans:0 "再划定大洋疆界"
  USA_Re-delineate_the_boundaries_of_oceans_desc:0 "过去数百年来，各大洋始终是列强争夺霸权的战场。如今，美德两国有能力重新规划世界海洋秩序，明确彼此的战略利益，避免无意义的竞争与冲突。欧洲海域由德意志舰队维持稳定，西半球与太平洋则由美国承担主要责任。新的海洋边界不是分裂世界，而是为了建立更加稳定的国际体系。"
  USA_trade_window_with_Central_European_Union:0 "与中欧同盟的贸易窗口"
  USA_trade_window_with_Central_European_Union_desc:0 "德意志帝国领导下的中欧同盟拥有庞大的工业体系、完善的铁路网络以及数亿人口组成的共同市场。与此同时，美国拥有世界领先的农业、资源与现代制造业。若双方能够打通贸易壁垒、协调金融体系并扩大投资合作，一条横跨大西洋的经济命脉便将彻底改变世界贸易格局。"
  USA_Dividing_up_the_world_pie:0 "瓜分世界蛋糕"
  USA_Dividing_up_the_world_pie_desc:0 "理想主义无法改变国际政治的现实。真正的和平，往往建立在明确而稳定的势力范围之上。美德双方将在充分协商的基础上协调海外利益、殖民事务以及地区影响力，避免彼此陷入毫无意义的竞争。世界足够广阔，两大强国完全可以在相互尊重的前提下共享它的发展成果。"
  USA_Jointly_embark_on_the_era_of_science:0 "共赴科学时代"
  USA_Jointly_embark_on_the_era_of_science_desc:0 "二十世纪属于科学。德国拥有世界一流的大学、实验室与工程技术，而美国则拥有雄厚的工业基础和无限的创新活力。双方将扩大科研交流，共同推进航空、电子、医学、能源及基础科学的发展。知识没有国界，而美德合作将推动整个人类迈向一个更加先进的新时代。"
  USA_The_beauty_of_the_old_and_new_worlds:0 "新旧世界之美"
  USA_The_beauty_of_the_old_and_new_worlds_desc:0 "欧洲拥有悠久的历史、艺术与文化传统，而美洲则象征着自由、创新与无限可能。当古老文明与年轻共和国相互学习、彼此欣赏时，大西洋便不再是隔绝双方的屏障，而成为文明交流的纽带。文化、教育、艺术与旅游将进一步拉近两国人民之间的距离，让新世界与旧世界共同焕发新的光彩。"
  USA_The_New_World_Empire_governed_jointly_with_true_blood-related_brothers:0 "与真血亲兄弟共治的新世界帝国"
  USA_The_New_World_Empire_governed_jointly_with_true_blood-related_brothers_desc:0 "美国与德意志帝国虽然诞生于不同的大陆，却拥有深厚的历史联系、相近的文化传统与共同的文明根源。如今，两国将超越旧时代列强之间的猜忌，共同维护横跨大西洋的新国际秩序。由德国稳定欧洲，由美国守护新大陆，两只雄鹰共同支撑起新时代的世界体系。这不是一个依靠征服建立的帝国，而是一个建立在合作、力量与共同利益之上的新世界。"
  USA_Entente_Friends:0 "协约战友情"
  USA_Entente_Friends_desc:0 "即便世界秩序已经历剧变，美国与协约国之间共同战斗的记忆却从未真正消失。自始至终，自由国家始终肩并肩抵御暴政与极端主义。今天，当民主国家再次面临新的挑战，我们将重新携起昔日盟友的手，让跨越大西洋的友谊再次成为世界和平最坚实的基石。"
  USA_The_inherent_rights_are_restored:0 "生来之权利复还"
  USA_The_inherent_rights_are_restored_desc:0 "人人生而平等，并被赋予不可剥夺的生命、自由与追求幸福之权利。这些原则不仅属于美国，也属于所有热爱自由的人民。工团革命夺走了许多国家选择自身命运的机会，而今天，自由终将重新降临欧洲。美国将帮助那些摆脱极权统治的国家恢复民主制度，让天赋权利重新属于每一个人。"
  USA_Eliminate_lingering_effects_of_past:0 "根除工团余毒"
  USA_Eliminate_lingering_effects_of_past_desc:0 "推翻工团政权只是第一步，更困难的是清除长期极端主义留下的政治、经济与社会创伤。美国将协助盟友重建政府、恢复市场经济、肃清激进组织，并帮助人民重新建立对于民主法治的信心。只有彻底根除工团主义遗留的影响，自由世界才能真正迎来持久稳定。"    
  USA_European_Peace:0 "欧罗巴无战事"
  USA_European_Peace_desc:0 "数十年的战争让欧洲满目疮痍，也让整个世界为之付出沉重代价。美国并不希望永久驻军于大西洋彼岸，而是希望建立一个能够依靠自身维持和平的新欧洲。通过安全合作、经济重建与民主联盟，我们将确保战争不再成为欧洲解决争端的方式，让这片古老大陆重新迎来和平与繁荣。"
  USA_Activate_the_full_capacity_of_democratic_armory:0 "全功率开动民主兵工厂"
  USA_Activate_the_full_capacity_of_democratic_armory_desc:0 "自由若没有力量守护，终将沦为空谈。美国庞大的工业体系将再次全速运转，为所有民主国家提供武器、舰船、飞机与物资。从钢铁厂到造船厂，从汽车工厂到飞机装配线，共和国将成为整个自由世界最可靠的兵工厂。只要民主国家仍在战斗，美国工业便不会停下脚步。"
  USA_Global_Aid:0 "环球援助"
  USA_Global_Aid_desc:0 "战争结束之后，人们需要的不只是枪炮，更是粮食、药品、贷款与重建资金。美国将向所有愿意重建自由社会的国家提供经济援助，恢复贸易、重建基础设施并帮助稳定金融体系。繁荣本身便是和平最坚固的堡垒，而美国有责任帮助世界重新站起来。"
  USA_Jointly_exploring_the_Dark_Continent:0 "共图黑暗大陆"
  USA_Jointly_exploring_the_Dark_Continent_desc:0 "非洲依旧拥有丰富的资源、广阔的土地以及巨大的发展潜力，但长期战争与殖民竞争让这片大陆始终难以稳定。美国将与协约伙伴共同开展基础设施建设、资源开发和公共卫生合作，帮助非洲逐步走向现代化，同时确保任何极端主义势力都无法在这里重新扎根。"
  USA_The_country_of_maple_leaves_belongs_to:0 "枫叶之国归属"
  USA_The_country_of_maple_leaves_belongs_to_desc:0 "加拿大不仅是美国最亲密的邻邦，也是协约体系的重要成员。随着世界局势重新稳定，关于两国未来关系的讨论再次被提上议程。无论是进一步深化联盟、建立更加紧密的共同防务体系，还是探讨更加大胆的政治安排，我们都将以北美整体利益作为最高原则，共同决定枫叶之国未来的归属。"
  USA_old_face_new_order:0 "老面孔，新秩序"
  USA_old_face_new_order_desc:0 "协约国依旧由那些熟悉的国家组成，但它们所面对的世界已经截然不同。过去的大英帝国、法兰西共和国与美国，都必须适应新时代的挑战，以更加平等、更加紧密的合作取代旧时代的殖民竞争。新的国际秩序将建立在共同价值、共同责任与共同安全之上。自由世界的旗帜依旧飘扬，而属于民主国家的新篇章，也正式拉开序幕。"
  USA_European_Conquest:0 "欧陆征服"
  USA_European_Conquest_desc:0 "几个世纪以来，欧洲一直自诩为世界政治、文化与战争的中心。王朝、共和国、帝国与革命政权在这片狭小而拥挤的大陆上反复争斗，并将一次又一次的危机扩散到整个世界。如今，美国已经不再满足于隔着大西洋等待欧洲人解决自己的问题。若旧大陆无法为自身带来稳定，那么新大陆便必须亲手介入。\n\n我们的舰队将横渡大西洋：从伦敦到维也纳，从巴黎到柏林，所有曾经左右世界命运的首都都必须重新认识一个事实：美利坚已经拥有把自己的意志直接施加于欧陆的能力。征服并不是我们的最终目的，但只有先拥有决定欧洲命运的力量，我们才能真正开始重塑欧洲秩序。"
  USA_Spread_our_kindness_everywhere:0 "广布吾等善意"
  USA_Spread_our_kindness_everywhere_desc:0 "美国的士兵并不只携带步枪与坦克来到欧洲。军用运输船同时送来了粮食、药品、工程设备和大量贷款协议。那些愿意接受美国安排的政府将获得优先重建资格，城市可以得到建筑材料，工厂可以得到机器，铁路也会在美国工程师的监督下重新运转。批评者或许会称其为经济控制，但我们更愿意把它理解为责任。"
  USA_Polish_golden_heart_of_Holy_Roman_Empire:0 "擦亮神圣罗马的黄金之心"
  USA_Polish_golden_heart_of_Holy_Roman_Empire_desc:0 "德意志地区始终是欧洲工业、军事与政治力量最集中的核心之一。从神圣罗马帝国错综复杂的邦国，到普鲁士主导下的统一，再到近代德国对欧陆秩序的深刻影响，这片土地几乎从未真正退出欧洲权力斗争的中心。若我们希望建立持久和平，就不可能绕过这个“黄金之心”。毫无疑问，一个繁荣、稳定且受到约束的德国，比一个被彻底摧毁、充满怨恨的德国更符合美国利益。"
  USA_Protecting_the_Pearl_of_the_Danube:0 "保卫多瑙明珠"
  USA_Protecting_the_Pearl_of_the_Danube_desc:0 "多瑙河连接着中欧与巴尔干，而坐落于其两岸的城市与国家长期承担着连接东西方的角色。这里既是贸易与文化交汇之地，也是民族冲突、边界争端和帝国遗产最容易再次点燃的地区。任何试图掌控欧洲的人，都不能忽视多瑙河流域的重要性。美国将把这一地区纳入更严密的安全体系。多瑙河不应再成为战争前线，而应成为由美国力量保障的和平动脉。"
  USA_Rebuilding_the_Anglo_homeland:0 "重建阿尔比恩"
  USA_Rebuilding_the_Anglo_homeland_desc:0 "无论伦敦过去与华盛顿之间存在过多少竞争与猜疑，英伦群岛始终与美国拥有无法割裂的历史联系。语言、法律传统、海上贸易与无数家庭纽带，使阿尔比恩在美国人的想象中既是旧世界的一部分，也是某种遥远而熟悉的故土。如今，我们有机会亲手决定这座岛屿的未来。美国资本与工程力量将帮助修复港口、铁路、住宅和工业中心，而新的英国政府也必须确保自身不会再次成为欧洲争霸的发动机。"
  USA_Reproduce_brilliance_of_Fontainebleau:0 "复现枫丹白露之璀璨"
  USA_Reproduce_brilliance_of_Fontainebleau_desc:0 "法国曾经以艺术、文学、建筑与政治思想影响整个世界。从巴黎林荫大道到枫丹白露宫廷，从启蒙哲学到现代绘画，法兰西文化的魅力远远超越其国界。然而，战争与赤色革命已经让这个文化中心蒙上阴影。美国没有理由让法国永远沉沦。当然，新法国也必须放弃那些不断把欧洲拖入冲突的政治野心。若法国愿意接受现实，它完全可以再次成为世界羡慕的文化之国，只不过将在美国所维护的和平秩序下。"
  USA_Directly_reaching_the_border_of_Europa:0 "直抵欧罗巴边陲"
  USA_Directly_reaching_the_border_of_Europa_desc:0 "随着我们的影响力不断向东延伸，欧洲传统意义上的边界已经出现在美国军事规划者的地图尽头。波罗的海、黑海与东欧平原不再是遥远而陌生的地理名词，而是决定新秩序能否真正稳定下来的前沿地区。若我们只控制西欧，却允许欧陆边缘继续成为敌对势力的集结地，那么此前的一切努力都将失去意义。"
  USA_Healing_the_wounds_of_1898:0 "弥合1898之恨"
  USA_Healing_the_wounds_of_1898_desc:0 "1898年的战争曾让美国与西班牙在炮火中相遇，也让一个衰老帝国不得不接受新时代已经到来的现实。几十年过去，那场冲突依旧留存在两国历史记忆之中：对美国而言，它象征着共和国第一次真正走向海外；对西班牙而言，则是帝国时代终结的屈辱印记。如今，我们有机会以截然不同的方式结束这段历史。美国将支持伊比利亚地区的经济恢复，并允许西班牙在新欧洲体系中保留自己的文化与国家尊严。作为交换，马德里必须彻底放弃任何反美政策，并在外交、贸易与安全领域接受新的现实。"
  USA_The_necessary_evil_for_defending_the_free_world:0 "保卫自由世界的必要之恶"
  USA_The_necessary_evil_for_defending_the_free_world_desc:0 "占领军、政治审查和对外国政府的直接干预，很难同“自由”二字和谐共处。即使在美国国内，也有人质疑我们是否正在以捍卫自由世界之名，建立一个由军队和美元维系的庞大势力范围。但现实世界并不会因为我们的原则而变得更加仁慈。若美国撤退，权力真空便会被极端主义、复仇主义或另一个敌对帝国填补。如果专制和干涉能够阻止另一场席卷世界的大战，那么它们就是维护自由世界所必须付出的代价。"
  USA_The_necessity_of_being_guided:0 "受指导之义务"
  USA_The_necessity_of_being_guided_desc:0 "并非每一个欧洲国家都具备在危机后立即恢复完整政治自主的能力。破碎的行政体系、极端化的社会、失控的武装团体和濒临崩溃的经济，都可能让所谓“自主”迅速重新滑向混乱。允许这种局面继续发展，只会迫使美国在几年后再次跨越大西洋。因此，某些国家必须经历一段受指导的过渡时期。美国军事将领与顾问将进入政府部门，帮助建立更加可靠的制度，并确保新政府不会偏离基本安全框架。"
  USA_Our_loyal_agent:0 "我们的忠诚代理人"
  USA_Our_loyal_agent_desc:0 "直接占领每一个国家既昂贵又低效，美国没有必要在每座欧洲城市都部署自己的士兵。只要选择可靠的本地或代理领导人，并给予他们足够的经济、军事和政治支持，我们便可以通过代理政府维护新秩序。这些人了解本国社会，也比外国占领军更容易获得民众接受。他们将在公开场合维护国家独立，而在外交、安全与战略问题上同华盛顿保持密切一致。"
  USA_Towards_true_European_peace:0 "迈向真正的“欧洲和平”"
  USA_Towards_true_European_peace_desc:0 "过去的欧洲和平往往只是两场战争之间短暂的休息。各国签署条约、重新划分边界，随后又开始扩军、结盟，并为下一次冲突积累仇恨。所谓均势一次又一次失败，因为没有任何一个欧洲国家拥有足够力量迫使所有人共同遵守规则。如今，这个问题终于有了不同答案。由美国保障的安全体系将约束各国军备，协调经济重建，并通过军事基地与共同防务阻止任何国家单方面打破现状。"
  USA_The_traveler_returns_home:0 "执我们的剑，卫我们的土"
  USA_The_traveler_returns_home_desc:0 "当第一批远征军跨越大西洋时，没有人能够确定他们究竟何时才能归来。如今，欧洲的主要威胁已经被压制，新政府在美国监督下逐步建立，港口、铁路与工厂也重新恢复运转。士兵们终于可以开始收拾行装，将他们携带到旧大陆的旗帜再次带回故土。但美国并不会真正离开欧洲。部分基地将继续保留，军事顾问和情报人员也会留下，以确保我们建立的一切不会在远征军撤离后迅速崩溃。那些即将返乡的士兵带回的不只是战争记忆，更是一种新的现实：大西洋已经不再是保护美国远离旧世界纷争的屏障。若有必要，我们将再次执剑，保卫属于我们的土地与秩序。"
#新
USA_navy_in_command:0 "指挥部中的海军"
 USA_navy_in_command_desc:0 "海军和麦克阿瑟之间的紧张关系持续了几个月，主要是由于麦克阿瑟试图将自己的意志强加给海军，以及认为麦克阿瑟的行动危及了备战的努力，美国海军已经控制了政府。虽然他们显然是在国会和西部军的支持下这么做的，但这个联盟很脆弱，接下来会发生什么还不得而知……"
 USA_admiral_leahy:0 "海军上将莱希"
 USA_admiral_leahy_desc:0 "海军上将莱希从来都不是一个置身于政治之外的人，也绝非缺乏质疑命令的良知。只是出于强烈的责任感，他在职业生涯的大多数时间里，都克制着自己，不让这些顾虑演变为实际行动。然而，当他亲眼目睹麦克阿瑟正将美国引向一条毫无意义且毁灭性十足的道路时，这位被同僚称为“法官”的人便毅然接掌了国家的舵盘，力图将其重新带回民主的正轨。在麦克阿瑟的狂妄之下，民主正日渐消亡。与此同时，他也在积极探索以和平方式劝说西部各派重归怀抱的途径，以止息流血冲突，将一个濒临自我毁灭的国家拯救出来。"
 USA_congressional_subordination:0 "现代马歇尔法院"
 USA_congressional_subordination_desc:0 "金上将始终认为，代议制民主是国家最大的弱点之一，它将国家束缚在冷漠、自私且无知的普通民众声音之下。国会曾是我们夺取权力的重要助力，通过这个由人民选举产生的机构，我们获得了推翻那个试图从人民手中夺权者的制度支持。然而，他们不仅可能在未来以缓慢低效的官僚程序掣肘我们的有效治理，更可能萌生夺回权力的念头，哪怕正是他们最初将国家拖入了这场混乱。他们必须被清除，但问题是，我们该如何行动？"
 USA_court_the_rockies:0 "落基和解"
 USA_court_the_rockies_desc:0 "落基山脉作为西部先锋，为华盛顿哥伦比亚特区的利益而战。尽管兵力悬殊、补给断绝，他们仍占据着我国最险峻却最易守难攻的地带，在绝境中顽强抵抗敌军。但当麦克阿瑟开始破坏他们誓死捍卫的美国民主时，他们也毅然背弃了他，这也证明了我们是为共同信念而战，是讲道理、有原则的人。我们必须联系艾森豪威尔和布拉德利，相信他们会欣然选择与同胞并肩作战而非兵戎相见，向他们证明我们绝非毫无信用之人。"
 USA_supreme_court_trial:0 "世纪大审判"
 USA_supreme_court_trial_desc:0 "美利坚合众国上一次面临如此重大且影响深远的审判，还要追溯到内战结束之际。当时，为了国家统一与愈合创伤，在重建进行期间，许多南方分裂分子最终被宽恕释放。而如今，站在我们面前的是道格拉斯·麦克阿瑟及其所有同谋，他们以拯救美国为借口，行颠覆美国之实。作为一名军人，他理当因抗命及其他罪行接受军事法庭的审判。然而，国会基于充分理由认为，他在政界的深远影响力同样渗透到了军事指挥体系之中，这可能导致审判结果偏袒于他。因此，他必须由最高法院进行审理，这样或许更为公正，但关于这是否为正确途径的争论仍在继续。这一可能塑造我国未来数个世纪的决定，正沉重地压在那些肩负最终裁决重任的人们心头……"
 USA_protection_for_payment:0 "强制性胜利债券"
 USA_protection_for_payment_desc:0 "我们的海军预算远超现有资源所能承受的范围，而仅凭几张欠条和收复分离主义领土的承诺，终究无法无限期地搪塞承包商或水兵们索要实际报酬的要求。然而，如果最终无人能兑现这些债务，那么谁也拿不到一分钱，更不用说在这场冲突中为敌对派系效力可能带来的其他后果了。我们必须让受我们保护的地区深刻意识到这一事实，引导他们慷慨购买我国政府的战争债券，并以未来统一国家的资源和资产权益换取保护。如果有人胆敢试图逃避这一安排，那就提醒他们，美国海军的保护对他们的土地究竟意味着什么。"
 USA_admiral_of_navy:0 "[USA_admiral_of_navy_loc]"
 USA_admiral_of_navy_desc:0 "[USA_admiral_of_navy_desc_loc]"
 USA_admiral_king:0 "海军上将金"
 USA_admiral_king_desc:0 "欧内斯特·金上将是个极有耐心的人，这从他数月来被迫忍受麦克阿瑟对海军近乎侮辱和羞辱的对待中可见一斑。然而，麦克阿瑟最近试图直接控制海军的举动，终于成了压垮骆驼的最后一根稻草。这不仅意味着海军作为一个受人尊敬的机构将走向终结，更意味着他将掌握全国武装力量的绝对权力，届时他将无人可制，得以将国家当作自己的私人领地来操控。金上将已决定推翻麦克阿瑟，挺身而出领导国家赢得这场身陷其中的冲突，并保护海军的声誉免受那些企图破坏它的人的侵害。"
 USA_savior_of_democracy:0 "莱希，民主的救世主"
 USA_savior_of_democracy_desc:0 "过去几年间笼罩美国的纷争仍未平息。兄弟阋墙的悲剧仍在继续，有些人永远不会和平回归联邦，而即便战火终熄，要彻底抚平这场冲突留下的创伤，仍有大量工作亟待完成。但如今，我们终于有了明确的方向与值得为之奋斗的目标，而这要归功于莱希上将的英勇担当，他挺身而出拯救美国于内部敌人之手，也拯救了缔造这个国家并令其引以为傲的民主制度。这场地狱般现实的终结已近在眼前，美国人民很快将再度团结一心。"
 USA_navy_first:0 "美国海军特别项目办公室"
 USA_navy_first_desc:0 "海军在历史上大多被忽视，大白舰队是首次真正对海军进行大规模投入，而过去几年由于整体经济衰退和持续冲突，海军经费大多不足。然而，[USA.GetLeader]认为，开始将资源转向海军永远不嫌晚，尤其是现在海军已处于国家的有效控制之下。尽管目前资金紧缺，但着手为海军的进一步投资和扩张奠定基础并无坏处，例如设立一个办公室来处理海军监督下的诸多特殊项目，希望有朝一日这个办公室能开始研发突破我们海军能力极限的技术。"
 USA_decision_of_congress:0 "成王败寇"
 USA_decision_of_congress_desc:0 "尽管莱希上将对涉足政治以阻止他所认为的美国毁灭并不犹豫，但他并非轻率承担权力之重的人，因此他并不寻求长期留任当前职位。他深知，若局势与国家本身召唤他，他必须响应号召，引领国家直至风浪平息；但他更希望尽快恢复战前的民主制度，不追求个人荣耀或无度的权力。他已将决定权交由国会，国会将很快裁定这位海军上将是需要再留任一段时间，还是他已为拯救美国做出了足够的贡献。"
 USA_pacifican_reconciliation:0 "太平洋和平？"
 USA_pacifican_reconciliation_desc:0 "太平洋国政府是众多从联邦政府脱离的政权之一，其深厚的民主传统与独特认同，使其背弃了那个已不再秉持相同理念、分崩离析的美利坚。他们不仅带走了我们相当一部分人口，还囊括了全美最富庶、资源最丰饶的地区，更继承了一支规模庞大、装备精良的陆军，我国海军中可观的一部分，以及众多地标与重要的工业产能。然而，既然麦克阿瑟已不复存在，或许我们能让太平洋国相信，我们与他们当初脱离时所秉持的理念并无二致，而既然我们能和平解决这场冲突，进一步的流血便显得残酷且毫无意义。"
 USA_all_hands_on_deck:0 "全员就位"
 USA_all_hands_on_deck_desc:0 "纵观历史，每当局势陷入困顿之际，往往是陆军最终接管政权。这不仅仅因为那些从战场上凯旋的将军们拥有巨大的个人威望，更关键的是，他们掌握着充足的人力与庞大的规模，足以维系对整个国家的掌控——无论是长久统治，还是暂时维持到合适的治理者出现。相比之下，一支国家的海军，除了巅峰时期的皇家海军或许是个例外，通常既不拥有足够的人力，也难以长期维持政权运作，即便是在我们如今退守华盛顿、实力大为削弱的现状下，情况依然如此。我们必须全力以赴，动员一切可以调动的资源来巩固统治，然后才有余力将目光转向战场。倘若这次冒险行动最终失败，国家将再次落入那些不足信赖之人的手中，而我们也很可能被一个对我们的救国努力毫不领情的政府以叛国罪加以审判。"
 USA_anchoring_our_rule:0 "锚定我们的统治"
 USA_anchoring_our_rule_desc:0 "既然国会已经被架空，我们便能全面着手确立对国家的统治。海军应当成为国家的最高机构，以此树立秩序，引领国家度过这场冲突，并凭借必要的纪律与经验，为国家赢得胜利。金上将早已摆脱旧共和国那套倒退体制的束缚，能够全权调配我们现有的资源，诸多计划早已在他的构想中酝酿成熟，只待付诸实践。"
 USA_the_canal_we_built:0 "美国之外"
 USA_the_canal_we_built_desc:0 "美洲是一片广袤的土地，虽然被巴拿马地峡分隔，在地理和文化上被视为两个不同的大陆，但实际上它从阿拉斯加一直延伸到德雷克海峡，绵延不绝。在过去几个世纪里，穿越这片大陆的广阔区域，要么只能依靠陆路，要么借助几条可通航的大河，再或者就是绕行南端尽头的德雷克海峡。这实际上意味着太平洋和大西洋沿岸彼此隔绝，除非一个国家能同时建造两支实力相当的舰队，否则根本无法在两大洋都取得制海权。然而，巴拿马运河的建成彻底打破了这一局面，它为两大洋之间提供了便捷的通道。不幸的是，我们并非近来唯一觊觎这条运河的势力。趁我们忙于战争之际，巴拿马已脱离了我们的势力范围。只要无法确保一个友好政权控制运河，我们就无法保障两大洋之间的通行。也许，是时候提醒巴拿马人，这条运河是谁修建的，而欠下的账，终究是要还的。"
 USA_ports_of_the_atlantic:0 "浩瀚无垠大西洋"
 USA_ports_of_the_atlantic_desc:0 "大西洋是我们与旧世界之间的原始纽带，我们的殖民先辈正是经由这片海洋来到这片土地。正因如此，我国大部分国土与人口、经济产出和海军重心历来都朝向这片大洋，少数几场抵御外敌的战争也在此展开。然而，正如海军上将[USA.GetLeader]所指出的，英国人及其仆从长期通过控制众多岛屿，进而掌控通往欧洲的航路及跳板。我们无法保证，一旦与某个欧洲强国开战，他们会对我们的目标保持友善，也无法保证他们自己不会成为我们的敌人。因此，我们必须主动出击，确保能够主宰大西洋，从而在战火来临时拥有自由的战略主动权。"
 USA_the_beautiful_pacific:0 "太平洋的浪子们"
 USA_the_beautiful_pacific_desc:0 "太平洋长久以来便是我们众多先驱者的梦想，它标志着我们向西扩张的终点，也意味着昭昭天命的基本完成。然而，在过去的一个世纪里，我们始终觊觎着加利福尼亚与西北地区海岸线之外的疆域，正如众多理论家与雄心勃勃的政治家所描绘的那样，我们意图控制那些具有战略意义的岛屿。不幸的是，近期的战争削弱了我们对这一地区的掌控，我们的许多属地，包括我们珍视的夏威夷，都被协约国、日本和德国夺取或威胁。这些国家皆是世界上的强权，若我们不能在该地区与之抗衡，便无法凭自身实力跻身强权之列。为此，我们需要一支强大的存在力量与一支可畏的海军来对抗他们。以我们现有的实力，夺回本就属于我们的东西理应不难，而后，我们便可梦想攫取更多，以确保再无人胆敢妄想将我们逐出此地区。"
 USA_end_the_anglo_empire:0 "美利坚海洋霸权的命运"
 USA_end_the_anglo_empire_desc:0 "凭借我们的指导，国家得以稳步走向安定，如今美利坚合众国已处于前所未有的强盛地位，这一切都归功于我们光荣而令人敬畏的海军。然而，这也让一些人开始思考：何不让当前的局面永久化？海军已经充分证明了自己完全有能力担当国家的舵手，即使尚未超越，也足以与历史上那些由海军主宰国运的典范相媲美。当然，在我国延续了数个世纪的权力结构与制度不会消失，它们对于治理民众生活仍是必需的，但我们必须决定领导层的命运，以及在我们成为海洋霸主之后，国家将走向何方。"
 USA_admiral_of_navy_king:0 "金海军元帅"
 USA_admiral_of_navy_king_desc:0 "在幕后，金海军上将的一些部下已经因为他威严的举止、在海军和共和国中握有的巨大权力，以及他在当前战争中带领国家度过自独立战争以来最黑暗时刻的关键作用，而称他为“海军元帅”。既然他对这个称号颇为中意，且这称号与他目前的地位也相去不远，金便选择正式采用“海军元帅”这一头衔，作为其实际国家元首的称号。如今，随着这一角色赋予他的宏大抱负，人们不禁好奇，欧内斯特·金海军元帅将带领国家走向何等辉煌的高度。"
 USA_admiral_of_navy_halsey:0 "“公牛”哈尔西的台风"
 USA_admiral_of_navy_halsey_desc:0 "威廉·哈尔西是个行动派，以海上作战风格激进且才华横溢而闻名，面对过激行径，他绝不会袖手旁观。察觉到金正步上麦克阿瑟的后尘，企图进一步摧毁共和国仅存的根基，“公牛”哈尔西已接管国家大权，力挽狂澜于既倒，引领国家穿越惊涛骇浪，直至当前冲突平息，常规治理得以恢复。"
 USA_admiral_of_navy_spruance:0 "沉默战士手持三叉戟"
 USA_admiral_of_navy_spruance_desc:0 "雷蒙德·斯普鲁恩斯是一位谨慎却才华横溢的海上将领，精于算计的头脑并未伴随张扬的个性。若非身处激战之中，他往往隐没于人群，且毫无个人权力野心。然而，正是这最后一项关键特质，促使他对金采取了行动——他憎恶那些为个人野心而越界、损害大局之人。如今，斯普鲁恩斯执掌舵柄，力图引领国家度过至暗时刻，维系一丝秩序，并遏制任何其他投机分子的野心。"
 USA_admiral_of_navy_triumvirate:0 "海军部的三巨头"
 USA_admiral_of_navy_triumvirate_desc:0 "尽管金的行为曾经引发诸多争议，海军高层的大多数成员却几乎一致认为，他的领导力在长远而言对国家更为有利。就连斯普鲁恩斯与哈尔西也逐渐理解这位海军上将所持论点的价值及其战略优势。基于这一共识，三人达成了一种三头政治式的安排：他们将以平等的地位共同领导，两位海军上将作为制约力量，平衡金在统治上较为专制的倾向，同时在事关国家领导的关键议题上保持最终的一致步调。这项协议是否能够真正奏效，仍有待时间检验，因为金依然掌握着相当可观的人事权力基础，最终或许仍会成为主导力量。然而至少在目前，这项协议维持了来之不易的和平局面，而倘若理性能够占据上风，它也许恰恰就是这个国家渡过这场冲突所需要的那双稳健之手。"
 USA_underway_replenishment:0 "刷新补给"
 USA_underway_replenishment_desc:0 "在煤炭仍是舰船推进动力之王的年代，舰船的航程受限于在加煤站之间所能行驶的距离。这不仅使舰队容易受到攻击，因为舰船必然需要返回加煤站进行补给，也使整个系统变得脆弱，如果基础设施遭到破坏，舰船将无法补给，只能孤立无援地困在海上，除了尽可能驶向下一个加煤站外别无他法。正因如此，许多战略家开始提出海上补给的构想，但只要煤炭仍是海上主要燃料来源，这一概念即便可行，也大多不切实际。然而，随着燃料转向石油，海上补给再次成为诱人的前景，过去几年的诸多发展已使其成为小型舰船完全可行的补给方式。大型舰船的海上补给由于相关危险，仍是一个遥不可及的概念，但如果我们能设计出一套系统，以稳定、相对快速且安全的方式实现这一目标，那么我们就能在必要时让舰船长期驻留海上，同时极大提升我国海军的实际作战范围。"
 USA_support_ships:0 "公海维护"
 USA_support_ships_desc:0 "舰队维护的一个关键环节，无论是在战时还是和平时期，都是能够修复任何在海上受损的舰船。无论是保养再好的船只也难免偶尔发生的简单机械故障，还是在交战后严重受损、濒临沉没的舰船，都需要快速响应，以避免不必要地凿沉本可挽救的船只，同时避免在战况激烈时或因受损严重导致距离过远而无法返回港口的情况。这就是为什么我们需要扩充现有的修理船队，比如备受尊敬的维斯塔号，考虑到我国周边两大洋的广阔距离，以及一旦敌军对我舰队造成重创，任何状态的舰船都可能远在盟军港口数千英里之外，这种扩充将尤为有用。"
 USA_vt_shells:0 "实施T部门提案"
 USA_vt_shells_desc:0 "自从联邦在内战中首次使用气球以来，空中战争的潘多拉魔盒便被打开，应对这一新威胁的需求也随之而来。从榴霰弹、高爆弹到高射炮，自世界大战以来，人们开发并广泛使用了多种系统，试图击落敌机，尽管在现代飞机发展的速度面前，这已成为一项永无止境的任务。国防研究委员会T部门的一些人认为他们找到了办法：在每个炮弹内安装无线电控制引信，以更有效地击落敌机。正如世界大战前就已得出的结论，用炮弹击落飞机最有效的方式是让其在目标附近爆炸，否则精度太低，难以可靠命中。然而，问题恰恰在此，因为大多数现代引信根本不够可靠，无法保证这样的效果。T部门的人员发现，通过发射器向每个炮弹发送无线电信号，再配合改进的光学设备，防空系统的精度将大幅提升，前提是能开发出一个不会在不当时机爆炸的可靠系统。我们认为这些人或许言之有理，何不开始测试他们的设计呢？"
 USA_supercarrier:0 "超级航母铸就无敌海军"
 USA_supercarrier_desc:0 "飞机容量的增加以及海军中飞机使用的战术范围的扩大，使得我们需要越来越大的航母，以容纳更多、更大的飞机，实现更快的航速，并配备更多防御和支援系统。这些海上巨兽将成为海面上最大的舰船，有些设计概念的排水量甚至超过8万吨，尽管我们最雄心勃勃的设计仍需数年时间才能等到技术跟上。无论如何，一旦出海，它们将能够有效地充当自给自足的浮岛，能够跨越遥远的距离，搭载可能更大的机型，配备先进的雷达和防空系统，以减少对敌方舰船的脆弱性，承载规模更大、装备更精良的船员等等。我们应该发挥我们的工业能力，将最好、最大的航母投入海中，凭借我们在世界任何地方的打击能力，压倒任何未来的敌人。"
 USA_next_gen_fighters:0 "新一代战机为新一代飞行员而生"
 USA_next_gen_fighters_desc:0 "随着航母作战的出现和普及，诸多国家已将舰载战斗机视为对抗敌方海上空中力量的核心手段。以往，这类战机大多较陆基型号更为轻巧，以适应在航母甲板上的起降需求。不过，近年来飞行器技术的演进与航母建造工艺的提升，使得更为重型、拥有更长航程、更厚重防护装甲且配备现代化系统与武器的舰载战斗机成为可能。其中一款原型机正基于F7F-1平台进行研发，这是一种陆基重型战斗机，经过改造后将投入航母服役，但它仅能适配我国吨位最大、设计最先进的航空母舰。无论如何，一旦列装，该机型或将构成我国舰载战斗机发展进程中至关重要的转折点，将我们推至现代海军航空领域的最前沿。"
 USA_nuclear_submarine:0 "核动力鹦鹉螺号"
 USA_nuclear_submarine_desc:0 "原子能科学研究不断深入，许多人竞相将其用作一种威力莫测的毁灭性武器，而海军和政府内部的一些人则将这一技术飞跃视为实现其他目的的工具。其中一项提议便是将其用作动力源，为任何舰船提供足够的能量，从而避免使用现有燃料。尽管像德怀特·D·艾森豪威尔的妻子玛丽·艾森豪威尔这样的人物远离了华盛顿，或是像海曼·里科弗上将那样叛国投靠了工团主义势力，但他们的大量研究成果以及其他研究人员仍然留存，为核动力推进的研发提供助力。\n\n只要有充足的物资和资金，海军舰艇能够不间断地横跨无数海洋的梦想——其唯一限制仅是船员对新鲜空气的需求——或许终将实现。目前实验性的“鹦鹉螺号”潜艇正是该团队的项目，它以著名故事《海底两万里》中那艘传奇潜艇命名，将奇幻故事变为现实的希望或许很快就能成真。如同那个古老故事中描述的那样，拥有能够轻松超越同时代舰艇、无需担心故障或补充燃料、摆脱对重燃油依赖的舰船，这样的愿景即将到来。"
 USA_poseidon_polaris:0 "波塞冬与北极星"
 USA_poseidon_polaris_desc:0 "尽管潜艇的主要用途是快速突袭、奇袭并歼灭敌方舰船，但新型导弹技术的出现为其开辟了新的途径。目前，导弹已在驱逐舰和巡洋舰上进行试验，用作新时代的防空武器，而潜艇则提供了另一种用途。潜艇隐蔽性强、航程远，且能储存大量毁灭性火力，如今正被试验搭载大型远程导弹，能够摧毁大多数缓慢移动的目标，或在可行的情况下打击敌方陆上设施。\n\n随着对更具破坏力导弹的研究不断推进，远程导弹潜艇载具的潜力也在增长。它们能够突破海上封锁和庞大海军力量，深入敌方水域，浮出水面并直接向外国领土发射毁灭性导弹，摧毁工厂、机场等目标。这一发展仍处于初期阶段，首艘被称为“北极星”的潜艇尚在测试的萌芽期，但海军最高统帅部及将领们的决心表明，若这种舰艇可行，必将被发挥到极致。"
 USA_philadelphia_experiment:0 "费城实验"
 USA_philadelphia_experiment_desc:0 "海战中的核心问题之一便是可见度，而随着飞机投入战场，这一问题变得愈发突出。除了利用可见伪装来扭曲舰船的距离和尺寸以干扰鱼雷瞄准外，如何让舰船避开敌方目视或雷达探测，目前的手段仍远落后于海军研究办公室许多人的设想。\n\n幸运的是，研究部门获得了一种几乎不为人知或闻所未闻的新技术。这种技术几乎能让任何舰船完全避开雷达探测，同时扭曲舰船影像，干扰鱼雷和飞机的瞄准。该技术首先在驱逐舰“埃尔德里奇号”上进行了测试，成功使其避开了最先进的雷达和探测器，证明了美国舰队几乎可以完全隐匿于敌人视野之外，只有在舰队希望被发现时才会现身。一些人认为这种技术进步不人道或不属于这个世界，亲眼目睹的民间观察者对这种新式伪装感到困惑，但海军研究办公室保证，这一进步完全是美国本土的独创成果。"
 USA_montana_battleships:0 "我们将开始建造两艘§Y蒙大拿级§!战列舰，初始进度均为§G60%§!"
 USA_Willoughby_Coup:0 "冯·魏登巴赫的宫廷"
 USA_Willoughby_Coup_desc:0 "海军上将莱希将我们国家神圣的机构武器化，以对他的政敌进行卑鄙的报复，他利用最高法院以叛国罪审判麦克阿瑟将军，并判处其死刑。在继续清洗政治对手的过程中，这位海军上将又将目光投向了调查联邦调查局及其局长约翰·埃德加·胡佛。由于美国情报能力的完全瘫痪将导致联邦军队的崩溃，联邦调查局局长约翰·埃德加·胡佛召集了一群由查尔斯·A·威洛比领导的爱国军官，意图凿沉莱希这艘正在下沉的船，以保全联邦。威洛比因对已故麦克阿瑟的忠诚以及与局长共同捍卫基督教信仰和白人种族的信念而被选中，如今他必须肩负起总司令的重任，引领美国重归昔日荣光，因为胜利无可替代。"
 USA_Directors_Directive:0 "局长指令"
 USA_Directors_Directive_desc:0 "联邦调查局局长约翰·埃德加·胡佛在前几届政府中尽职尽责，在根除恐怖分子、黑帮分子和赤色同情者方面发挥了重要作用。他不愿坐视美国陷入混乱，因此在麦克阿瑟利用“白色计划”恢复华盛顿秩序与稳定的方案中，胡佛是主要策划者。随着麦克阿瑟合法政府被渗透并推翻，胡佛局长与仍忠于已故将军的人士合作，驱逐了那名激进的海军上将。作为忠诚的象征，威洛比和新成立的救国政府授予局长全权，让他自行决定如何处置美国的敌人。"
 USA_Targeting_Masters_Deceit:0 "瞄准撒谎大师"
 USA_Targeting_Masters_Deceit_desc:0 "正是通过莱希上将的政治亲信，合法的麦克阿瑟政府遭到了颠覆，最终导致最高法院违宪判处已故将军死刑。若想赢得这场战争，我们必须铲除这个不断侵蚀并破坏合法政府的权势叛徒集团。胡佛局长已获准采取一切必要手段，彻底揭露这些叛国者的真面目，确保文官政府的绝对忠诚。我们的特工将对地方政府与法院实施监听与严密监控，媒体盟友则将公开谴责这些失败主义者为叛徒与工团主义同情者。"
 USA_Empower_G_Men:0 "强化联邦调查局特工"
 USA_Empower_G_Men_desc:0 "拥有全权处理颠覆性威胁的授权后，胡佛局长启动了一场大规模改革，要将联邦调查局从一个普通机构彻底转型。成千上万的新特工接受了训练并得到招募，大量研发资金也被重新分配，优先用于法医学和反情报领域。为确保前线武装部队的战斗力，胡佛局长已授权联邦调查局特工担任特殊作战角色，以维持忠诚度并提振士气。在国内战线，我们的特工将不受约束地追捕恐怖分子，动用一切必要手段来保护美国人民与宪法。凭借局长手中这些非凡利器，任何事物都无法逃脱联邦调查局特工的严密监视。"
 USA_Denver_Detente:0 "与丹佛缓和关系？"
 USA_Denver_Detente_desc:0 "尽管我们迅速而果断地恢复了华盛顿的稳定，但威洛比将军解放首都的行动，却给我们在西海岸的前盟友带来了巨大冲击。听信了叛徒莱希上将的虚假承诺，太平洋沿岸的伪政权已断绝了与华盛顿的一切联系，并再次挑起冲突。在落基山脉，艾森豪威尔和布拉德利两位将军背叛了已故的麦克阿瑟，如今正率领西部军反抗我们的政府。虽然守住西部看似败局已定，但许多军官对威洛比将军和已故总司令的事业心怀同情，若得到我们的保证，他们或许愿意在丹佛建立一个效忠派政权。胡佛局长已指示我们的特工与这些效忠派小组取得联系，并提供我们的秘密支持，以平息这场叛乱，并协助我们在西部重新获得关键的立足点。"
 USA_Assure_Titans_Industry:0 "确保工业巨头支持"
 USA_Assure_Titans_Industry_desc:0 "尽管福特可能已经与南方的所谓的“宪政国”同流合污，但美国许多杰出的实业家始终坚定支持我们的合法政府。出于对赤色分子夺权的恐惧，我们的企业盟友暗中支持麦克阿瑟将军，以保护我们的国家及其利润空间。虽然那场失败的海军政变余波让许多大亨们揣测不安，但威洛比将军和我们的政府将安抚这些忧虑，并助力在军方与这些巨头之间铸就牢不可破的纽带。"
 USA_Study_Prussian_Spirit:0 "学习普鲁士精神"
 USA_Study_Prussian_Spirit_desc:0 "自称普鲁士军官T·冯·切佩-魏登巴赫男爵后裔的威洛比将军，始终对故土怀有深切仰慕。他偏爱德意志帝国同僚们笔挺的军装与单片眼镜，同僚们常戏称他为美利坚的容克将军。如今“冯·威洛比男爵”执掌大权，这位将军开始以严苛的普鲁士纪律整训武装部队。作为军事史学者，威洛比将运用世界大战期间大总参谋部开创的革命性战术，对胆敢僭称美利坚正统的散兵游勇施以雷霆一击。"
 USA_Honor_Great_Liberators:0 "向大解放者致敬"
 USA_Honor_Great_Liberators_desc:0 "威洛比将军在其军旅生涯中，曾先后在哥伦比亚、厄瓜多尔和委内瑞拉等玻利瓦尔共和国担任武官。在驻美国公使馆任职期间，这位将军对当地人民及其民族英雄西蒙·玻利瓦尔产生了深深的敬意。这位解放者以无私的胸怀和军事天才，将人民从半岛统治下解放出来，使玻利瓦尔在这些国家的民族神话中永垂不朽。如今我们正身处第二次独立战争，我们的解放者麦克阿瑟在拯救国家于混乱之前，便遭懦夫暗算倒下。我军将秉承玻利瓦尔与麦克阿瑟的精神前进，矢志不渝地致力于将美国从妄图毁灭它的叛徒手中解放出来。"
 USA_General_Avenged:0 "将军大仇得报"
 USA_General_Avenged_desc:0 "最高法院做出令人愤慨且违宪的裁决，判处道格拉斯·麦克阿瑟以不名誉之死刑，致使这位已故将军未及完成他对国家的职责、未及光复合众国便惨遭杀害。查尔斯·A·威洛比从总司令的阴影中挺身而出，接过上级军官的衣钵，率领武装部队取得了对那些企图摧毁美国之人的决定性胜利。随着麦克阿瑟得以完全平反并得到体面安葬，我们必须着眼于重建这个几近毁灭的国家。沿着七十余年前格兰特麾下凯旋的联邦军队足迹，我们如今迈入了一个重建的新时代。凭借与神秘莫测的胡佛局长及我们爱国盟友的合作，我们将确保美利坚合众国再度成为那座山巅闪耀之城。"
 USA_Continue_Speedys_Crusade:0 "继续“迅捷者”的圣战"
 USA_Continue_Speedys_Crusade_desc:0 "威洛比将军和军方在血腥的内战后终于松了一口气，但狂热不减的胡佛局长正加紧动员联邦调查局，准备对美国之敌发起一场自己的圣战。随着我军向西挺进，局长手中的嫌疑叛徒名单只增不减，特工们记录下所有哪怕仅被怀疑与敌人勾结的人。数千名随军行动的联邦调查局官员奉命窃听并追踪全国范围内被解放的数百座小镇。随着战争终于落幕，这些联邦探员收集的报告开始陆续传回这位复仇心切的局长办公室。胡佛准备通过恐吓与勒索来压制这些叛徒，他坐镇于美式全景监狱的中心，无人能逃脱局长眼中的正义。"
 USA_Americana_Preserved_Agency:0 "以机关卫美国"
 USA_Americana_Preserved_Agency_desc:0 "联邦调查局的特工们虽然一直致力于铲除各叛乱政府残余的效忠派，但局长深知这仅仅是他们职责的一部分。胡佛局长矢志确保美国永远是一个白人基督教国家，为此他不懈努力，将调查局彻底改造成了一个近乎神圣的骑士团。他要求新特工接受严格的道德测试、强制参加礼拜仪式并进行灵修静修，指挥着麾下的现代医护骑士们打击那些仍潜伏在暗处的败类和叛徒。身为长老会信徒的胡佛与富尔顿·希恩等福音派领袖密切合作，团结了所有反对社会主义、在美国宣扬基督教道德主义福音的各教派基督徒。通过胡佛局长和我们联邦特工们时刻保持警惕的工作，这些正义的探员必将确保美国永远是一个与基督教信仰密不可分的国家。"
 USA_Guidance_Under_National_Economic_Council:0 "国家经济委员会的指导"
 USA_Guidance_Under_National_Economic_Council_desc:0 "国家经济委员会于1929年成立，旨在应对纽约州大萧条带来的阵痛，此后该委员会规模大幅扩张，已成为保守派圈子中颇具影响力的智库。委员会由当地律师默文·K·哈特创立，一直倡导削减联邦开支、终结过度征税，并致力于打击所谓“犹太势力”对美国经济的操控。内战期间，国家经济委员会与我国政府建立了紧密联系，在指导战时经济方面给予了我们极大帮助，并授予威洛比将军委员会董事会荣誉席位。在我们努力重建这个饱受战火摧残的国家之际，委员会的职能将得到扩展，以协助美国经济的战后重建。那些支持我国政府的爱国实业家将组成新的执行委员会，消除企业间的竞争，让这些巨头们协同合作，管理军事重建区域内的丰富自然资源。"
 USA_Glistening_Gilded_Age:0 "镀金时代闪闪发光"
 USA_Glistening_Gilded_Age_desc:0 "通过政府与企业盟友之间的紧密合作，我们开创了一种全新的爱国经济模式，既惠及国家，也造福了那些参与建设的人们。摆脱了暴虐联邦政府专横的束缚与干预，我国独立阵线董事们的利润已超越战前水平，飙升至前所未有的高度。从工厂到解放的钢带，再到中西部的田野，美国工人终于能够自由谋生，摆脱了那些只会压低他们工资的煽动性言论和统合主义说辞。凭借独立阵线中的政治盟友，我国政府将开展大规模宣传运动，颂扬个人美德，赞美那些凭借自身努力登上巅峰的白手起家巨贾们的财富。"
 USA_Coordinating_Conservative_Efforts:0 "协调保守派的工作"
 USA_Coordinating_Conservative_Efforts_desc:0 "威洛比将军长期致力于多项保守主义事业，资助并主持了众多倡导团体，旨在向赤色分子发起斗争，捍卫我们的基督教信仰。既然社会主义者都能放下身段组成“统一战线”，我们若要认真保护我们的种族，现在正是团结起来的时候了。我们将向全国知名的保守派声音和领袖发出邀请，最终齐聚首都，协调并决定我们运动的方向。"
 USA_New_Political_Apparatus:0 "新政治机构"
 USA_New_Political_Apparatus_desc:0 "在华盛顿饭店，代表们咬紧牙关，经过紧张的谈判，最终凝聚成一个新的政治实体。我们因对国家的热爱、基督信仰和种族认同而团结一致，曾经分裂的保守主义运动如今在真爱国者党的旗帜下联合起来。经批准并合法认可，真爱国者党将作为我们政府的政治分支和对外形象。鉴于旧两党制的固有缺陷和民主暴民统治的危险，党的领导层将由参谋长联席会议和胡佛局长精心挑选，以确保他们对国家的忠诚与奉献。"
 USA_Changing_Guard:0 "权责交接？"
 USA_Changing_Guard_desc:0 "国家逐渐愈合，昔日的建制派也逐渐死灰复燃，并融入爱国党，昔日的党魁们纷纷宣誓效忠我们的政府。政府与文官领导层之间新建立的信任，让我们圈内许多人考虑将象征性的权力移交给这些真正的爱国者。虽然完全交出权力对国家安全来说太过危险，但胡佛局长提议我们举行一次“选举”，以便在美国人民眼中赋予爱国党合法性。奇怪的是，胡佛局长亲自挑选了可能的总统人选，一位魅力非凡的年轻海军军官、麦克阿瑟的忠实追随者，乔治·林肯·洛克威尔。尽管异常年轻，这位指挥官却致力于维护真正的美利坚主义和我们种族的存续。参谋长联席会议中的军官们指出，我们面临的国内外威胁，远大于将任何权力交给爱国党这一危险实验的风险，因此他们热情支持延续威洛比将军的托管授权。考虑到这些因素，我们必须为国家的未来做出决定。"
 USA_Wipe_Memory_Defeat:0 "抹除战败的记忆"
 USA_Wipe_Memory_Defeat_desc:0 "过去十年间，无能的政客将我们的国家拖入泥潭，几乎使其走向彻底毁灭。正是通过这场内战，我们战胜了那些藐视合法政府的激进派，才得以救赎我们的国家。凭借他们的牺牲，我们恢复了美国昔日的荣光，洗刷了我们被迫忍受太久的耻辱。历史的审判，一旦摆脱了当下的情绪迷雾，必将因我们重建白人种族传统军事霸权、抹去失败记忆的功绩而给予我们肯定。"
 USA_MacArthur_Martyr:0 "烈士麦克阿瑟"
 USA_MacArthur_Martyr_desc:0 "美国逐渐从内战的创伤中恢复，步入重建与新生，我们必须铭记麦克阿瑟将军为保卫国家所作出的巨大牺牲。当第二次内战骤然爆发、国家濒临瓦解之际，这位英勇的将领援引白色战争计划的法律先例，挺身而出，保卫华盛顿，抵御一场隐秘的国内阴谋。然而，他却被激进的海军上将莱希篡夺了权力，遭到逮捕，以莫须有的罪名受审。在最高法院的审判中，将军一心护国的神圣职责被肆意歪曲，化作一场荒唐的闹剧，他被污蔑为嗜权暴君，名誉扫地，最终被判处极刑。遵照已故将军留下的命令，我们奋勇前行，为再度统一的美国恢复了和平与稳定。谨记他这份神圣的职责，麦克阿瑟将被尊崇为新时代的开国元勋，他的不朽事迹将永远镌刻于美国历史之中。"
 USA_Under_Willow_Tree:0 "柳树之下"
 USA_Under_Willow_Tree_desc:0 "威洛比将军与参谋长联席会议经评估认为，当前美国局势仍过于脆弱，尚无法恢复文官秩序，因此决定在可预见的未来维持军队的统治。摆脱了政治僵局与权术博弈的桎梏，我们得以全力投身于击败美国在国内战线与海外的敌人。在胡佛的手下继续清剿残余的社会主义恐怖分子之际，将军及其幕僚已将目光投向一场决定西方文明命运的神圣征伐。尽管我们已在美国斩断了红色九头蛇的头颅，但第三国际仍在全球范围内煽动革命，四处散播其毒液。我们的天命便是彻底铲除这场瘟疫，以免我们的种族与信仰被彻底毁灭。"
 USA_Forge_Anti_Socialist_Victory_Committee:0 "铸就反社会主义者胜利委员会"
 USA_Forge_Anti_Socialist_Victory_Committee_desc:0 "当我们的士兵在前线英勇奋战，誓要铲除蔓延至本土的红色毒瘤时，整个世界也正为自身的存续，投身于一场对抗社会主义的殊死搏斗。为捍卫我们的自由，确保我们民族的延续，我们必须团结一致，协力给予社会主义致命一击。由美利坚合众国牵头，反社会主义胜利委员会将协调我们的努力，在全球范围内孤立并消除社会主义的威胁。我们将从外交与经济上孤立这些流氓红色国家，同时鼓励我们的盟友对那些长期被视作“贱民”的政府缓和言辞，这些政府不过是为了保护其人民免于混乱与动荡，便横遭污名。"
 USA_American_Foreign_Legion:0 "美国外籍军团"
 USA_American_Foreign_Legion_desc:0 "威洛比将军一直对远在阿尔及尔的那支英勇外籍军团钦佩有加，长期以来，他始终倡导建立一支属于我们自己的外籍军团。仿效其创立模式，我们将组建一支纪律严明、由外籍人士组成的部队，为美利坚合众国效力。这些军团士兵将奔赴世界各地，协助扑灭社会主义的燎原之火，并终结那些半开化民族危险的“独立运动”。"
 USA_Eagle_Adler:0 "东西双鹰"
 USA_Eagle_Adler_desc:0 "在欧洲，陷入困境的德意志帝国正为保卫西方文明而战，对手既有第三国际的社会主义者，也有来自东方的亚洲游牧部落。考虑到威洛比与其祖国的血脉联系，以及数百万德裔美国人，德皇自然是我们征讨社会主义的天然盟友。我国外交官将前往柏林，促进华盛顿与柏林之间更紧密的关系。我们准备利用美利坚合众国的天然财富，为德意志帝国及其坚定盟友提供大量物资援助。通过广泛合作，我们两国都将保住各自在阳光下的合法地位。"
 USA_Maintaining_Military_Caste:0 "维持军事层级制度"
 USA_Maintaining_Military_Caste_desc:0 "我国政府对抗叛乱分子与叛徒的压倒性胜利，很大程度上归功于合众国陆军的高效铁腕与文官政府的忠诚不二。当我们的对手陷入狭隘的宗派主义与密室交易时，国会与陆军步调一致，协同作战，迅速终结了内战。鉴于威洛比将军决定通过维持武装部队的授权来保障稳定与秩序，我们将致力于将这种共生关系融入平民生活的方方面面。退伍军人将成为新社会阶层的主体，服兵役将成为在地方政府任职的必要条件。尽管我们的批评者只会斥之为“军政府”，但将军深知，他们的责任感与牺牲精神，远胜于那些曾将国家推向毁灭边缘的政客们的腐败。"
 USA_Control_Through_Counterintelligence_Corps:0 "通过反情报部队实施控制"
 USA_Control_Through_Counterintelligence_Corps_desc:0 "虽然陆军能够迅速击溃前线叛军，但那些仍忠于这些非法政权的余孽却愚蠢地选择转入地下负隅顽抗。这些叛国蛇鼠妄图通过针对政府的懦夫式恐怖袭击，再次将国家推向毁灭深渊。遵照胡佛局长的指令，我们将为反情报部队提供充足资金，渗透残余组织并肃清这些顽抗分子。数千名便衣特工将被派往全美各地，对仍藏匿极端主义同情者的区域实施监控、窃听与布控。从中西部苟延残喘的民兵组织，到钢带工业区激进的赤色分子，再到南方三K党狂热暴徒，任何匪帮都休想逃过我们的法眼。"
 USA_Freeing_Young_Americans:0 "解放美利坚青年"
 USA_Freeing_Young_Americans_desc:0 "没有谁比美国的年轻一代在第二次美国内战中遭受了更多苦难。整整一代人承受了战争带来的广泛破坏，成千上万的青年被这些非法政府的军队征召入伍，数十万美国儿女如今沦为孤儿。为保护下一代免受激进主义的危害，我们的保守派盟友倡导成立了美国青年自由会，这是一个旨在帮助美国最弱势群体的外联组织。该组织将为美国青年提供参与当地社区活动的机会，并灌输爱国主义价值观以及对国家的责任感。"
 USA_New_Liberator:0 "新解放者"
 USA_New_Liberator_desc:0 "在饱受摧残的美利坚行将毁灭之前，查尔斯·A·威洛比凭借其力量与决心，驱逐了反对麦克阿瑟将军的阴谋家，恢复了华盛顿的秩序。正是凭借他的军事天才，我们的武装力量才得以在那些妄图夺取我们美丽哥伦比亚衣钵的敌人面前，赢得无数胜利。和平时期，威洛比重塑了我们伟大国家的道德结构，并为我们的海岸带来了新的繁荣。作为和平的倡导者，这位将军领导了捍卫我们基督教信仰与种族、抵御无神论国际社会主义的冲锋。正如他所崇拜的偶像，已故的麦克阿瑟将军和传奇的西蒙·玻利瓦尔一样，威洛比凭借自身的努力成为了一位解放者，一位在美利坚最黑暗的时刻拯救了它的新开国元勋。"
 USA_Triumph_True_Patriots:0 "真爱国者之胜"
 USA_Triumph_True_Patriots_desc:0 "威洛比将军与参谋长联席会议为履行捍卫宪法的神圣承诺，已开始向民主过渡，将诸多权力移交至真爱国者党。根据胡佛局长的指示，真爱国者党将成为第二次内战爆发以来美国首次全国大选中唯一合法政党。胡佛亲自挑选的候选人，雄心勃勃的海军上将乔治·林肯·洛克威尔，将“领导”该党赢得新获得的民意授权。选票既已清点完毕，我们将在华盛顿举办盛大的初选与代表大会，以此营造团结与合法性的氛围。"
 USA_Supplant_Southern_Strategies:0 "取代南方战略"
 USA_Supplant_Southern_Strategies_desc:0 "真爱国者党的成立，终于终结了腐败的两党制，使国会得以将白人的利益置于首位。随着我们全新的政治机器在全美不断扩张，或许没有比旧南方更强大的盟友了。几个世纪以来，南方通过实施种族隔离政策，将黑人牢牢压制，从而维持了他们的种族优越性。内战期间，误入歧途的旧民主党人奋起反抗联邦政府，却未曾意识到我们有着保护基督教信仰与种族的共同目标。尽管旧民主党领导层中的许多知名人士仍在胡佛局长的黑名单上，我们将对众多旧民主党人和白人联盟成员实行大赦，以极大扩展我们的政治网络。有了稳固南方的坚定支持，真正爱国党将带来全新的繁荣与政治团结，开创第二个和睦时代。"
 USA_Promote_Patriotic_Sweepstakes:0 "推广爱国抽奖活动"
 USA_Promote_Patriotic_Sweepstakes_desc:0 "为了继续拉拢旧民主党人，本届政府提议延续我们维护州权的传统，通过推广地方抽奖活动来维持低税率并增强社区自主权。这类抽奖与当年资助詹姆斯敦殖民地的经营彩票，或是开国元勋们在殖民时代使用的筹款方式一脉相承，允许公民汇集资金，用于资助各社区认为最合适的公共项目。这些彩票将由地方上的旧民主党分部组织运营，确保收益不被中饱私囊，而是重新分配给公共工程。通过推广此类抽奖活动，我们既能减轻联邦政府的负担，又能将权力交还到美国人民手中。"
 USA_Emigration_Excesses:0 "迁移过剩人口"
 USA_Emigration_Excesses_desc:0 "一个部落想要保护自己的同类，这是再自然不过的事，黑人激进派不希望他们的社区被强制融合，我们也是如此。在保护各自种族的共同基础上，洛克威尔总统与三K党已经开始与伊斯兰民族组织和全体黑人进步协会等民族主义者协调，推动一项大规模移民计划。这些黑人国家主义者将被允许加入他们的同胞，在非洲建立自己的社区，远离我们美丽的哥伦比亚。此外，这项移民计划还将扩展到犹太裔或非白人后裔，允许他们返回自己的国家。通过这一雄心勃勃的计划，我们将开始清除国家中的毒素，回归建国元勋们所设想的白人基督教国家。"
 USA_Swing_Phantom_Subversion:0 "重击颠覆幻影"
 USA_Swing_Phantom_Subversion_desc:0 "长久以来，我们的媒体已被工团主义间谍及其犹太金主渗透。从无线电广播到好莱坞，美国的电波任由他们的污秽所污染，向公众传播亲工团主义、融合主义与堕落言论。是时候向这些骗子发起反击，并推动立法成立反颠覆委员会了。该委员会旨在向美国人民揭露这些煽动者的真相，将全面审查所有媒体形式，并对其公开发布拥有最终决定权。我们的委员会还将推广弘扬基督教美德、肯定美国家庭传统角色的正面出版物。通过反颠覆委员会，我们终将反击那些企图瓦解我们道德根基、将国家推向毁灭的势力。"
 USA_Might_American_Tribe:0 "美利坚族群之威能"
 USA_Might_American_Tribe_desc:0 "虽然真爱国者党容纳了所有保守主义和民族主义思潮，但所有成员共同且最根本的目标，是确保白种人的存续。若想保护我们的人民免受犹太威胁的颠覆与毁灭，我们就不能仅仅作为一个国家团结起来，而是要作为一个部落团结起来。这让人联想到动物王国中随处可见的同质有序社会，洛克威尔总统的《族群法则》将成为纯血美国人赖以生存的道德准则。这五项族群法则包括：生物完整性、领土、领导权、地位，以及最重要的母性。当我们的民族部落因对自身的热爱而团结一致，并朝着共同目标努力时，我们将主宰社会，正如我们命中注定那般。"
 USA_Speak_Truth_American_Power:0 "道出美国力量的真相"
 USA_Speak_Truth_American_Power_desc:0 "即使在青年时期，洛克威尔总统也深知煽动群众的重要性。作为杂耍艺人之子，年轻的洛克威尔在当地社区已小有名气，他既在大乐队中演奏木管乐器，又能在鼓动听众时展现出演艺界特有的戏剧张力。这位叛逆青年曾以夸张方式抗议教师，并运用漫画家的才华对政敌进行尖刻抨击。如今洛克威尔将发挥其标志性风格，在全国开展巡回演讲，向美国人民传递真理。总司令还将施展其艺术与沟通才能，发起大规模宣传运动，将真正爱国者的理念传遍全国每个角落。摆脱了犹太媒体的歪曲，我们的爱国信条得以自由地融入所有真正的美国人心灵。"
 USA_Following_Founders_Footsteps:0 "追随国父足迹"
 USA_Following_Founders_Footsteps_desc:0 "美利坚的真相是，我们的开国元勋和我们一样，是民族主义者和保守主义者。这些杰出人物试图建立一个威权共和国，在自由与权威之间精心打造完美的平衡。英勇的麦克阿瑟将军继承了先贤遗志，在遭遇犹太人内部阴谋的打击之前，曾为恢复这一愿景而英勇奋战。然而，将军的牺牲并未白费，因为我们通过对这种平衡的持续追求，为国家重新带来了繁荣与秩序。通过尊重我们的先辈、我们的警察、我们的士兵以及政府的权威，我们的爱国政府追随他们的足迹，以武力与秩序维护一个正义的社会！"
 USA_kill_buord:0 "清算军械局"
 USA_kill_buord_desc:0 "被亲切称为“军械局”的机构，源于1862年军械与水文局拆分为军械局和航海局。该局负责美国海军所有武器的采购、储存与部署，并在本世纪初涉足航空项目研发。然而时间证明，军械局效率低下、机构臃肿，甚至无法妥善解决诸如灾难性的Mark14鱼雷等关键问题。或许彻底废除军械局，才能腾出空间建立更优秀的替代机构。"
 USA_form_buweps:0 "成立海军武器局"
 USA_form_buweps_desc:0 "军械局撤销后，我们肩负起一项新使命：打造一个不会重蹈覆辙的机构。结果显而易见，我们将颁布法案，授权成立海军武器局，并将此前与军械局关系密切的航空局也整合其中。得益于对过往失误的审慎反思，以及航空局技术人员的鼎力相助，海军武器局在海空武器及其他系统领域必将令世界艳羡。"
 USA_radars_fcs:0 "雷达与火控系统"
 USA_radars_fcs_desc:0 "雷达，全称为无线电探测与测距，是一种利用无线电波来探测外来物体、其与某点的距离、相对速度等的系统。虽然目前技术尚不十分先进，但它在追踪外来舰船和飞机方面仍标志着一项重大突破。它还促进了火控系统的发展，该系统用于对海攻击瞄准和射击。我们能在舰船上加装越多此类设备，它们就越有效，并且通过广泛使用中积累的经验进行多次迭代，也将有助于我们进一步发展这项技术本身。"
 USA_naval_reach:0 "战略发射台"
 USA_naval_reach_desc:0 "阿尔弗雷德·赛耶·马汉战略理论的核心部分是通过制海权实现海军优势，而其中的关键点便是地理学。为此，我们必须控制战略要地，无论是运河、港口还是岛屿等，通过这些地点建立作战基地，同时剥夺敌方的重要海上据点。因此，我们必须着手开发我们所掌握的众多岛屿阵地，尤其是在太平洋地区，以便为任何可能前来挑战的对手提供足够的跳板。"
 USA_decisive_battle:0 "舰队决战学说"
 USA_decisive_battle_desc:0 "决战学说主张将兵力集中于某一海域或战略要点，以不仅在数量上，更在准备程度与火力上压倒敌人。作为马汉战略学说的核心要素之一，德国在世界大战期间对该学说的实践取得了一定成功。但需要指出的是，德国当时的主要战略关切是保卫北海与波罗的海免受英国威胁，因此能够将兵力集中于较小区域，而英国则需应对来自各大洋的威胁并保护航运线。尽管我们的目标是向大西洋与太平洋投射力量，但我们有信心运用过去数十年海战中的诸多经验教训，成功实施这一战略。"
 USA_sea_to_sea:0 "从此岸到光辉彼岸"
 USA_sea_to_sea_desc:0 "战列舰是，而且在我们可预见的未来里，都将是海上的霸主。凭借我们庞大的工业实力、飞速发展的军事技术，以及马汉数十年前提出的诸多理念的最终成果，我们的海军将成为世界上最强大的力量，足以抵御来自两大洋的任何挑战，确保本土安然无恙，同时让我们能够在世界任何角落发动无与伦比的打击。"
 USA_carrier_strike_group:0 "定义航母打击群"
 USA_carrier_strike_group_desc:0 "航母的作战用途十分明确，即作为舰载机的起降平台，执行远程作战任务、争夺敌方制空权并攻击敌方舰艇，但其在舰队体系中的定位却尚待厘清。由于航母本身基本不具备武装，即便面对最小型舰艇也易受攻击，更遑论敌方巡洋舰或战列舰。因此必须将其纳入打击群加以保护，而具体编成方案仍需通过试验摸索，方能在实战中实现最佳防护效果。"
 USA_multiwave_attack_desc:0 "战争中的一项朴素法则告诉我们：数量本身就是一种质量。数千年的战争历史反复印证，无论敌人做了多么周密的准备，又或者士气多么高昂，终究无法承受连绵不绝的攻击而永远固守阵地。只要进攻方能够牢牢掌握主动权，并避免将自身资源消耗殆尽，最终就一定能将对手拖垮。单独一架海军飞机，自身所能携带的弹药远不足以击沉一艘重装甲敌舰，而且极易沦为敌方战机和防空炮火的猎物。因此，合乎逻辑的解决之道，便是动用整个飞行中队展开协同攻击，再以多个波次反复发起这样的攻势，消耗敌军，摧毁那些可能在初次打击中幸存的舰船，不给对手留下丝毫喘息的机会。"
 USA_coast_guard:0 "扩充海岸警卫队"
 USA_coast_guard_desc:0 "一场席卷全球的全面冲突阴云密布，诸多势力正摩拳擦掌，准备清算世界大战中未竟的恩怨。尽管我们眼下尚未卷入战火，但若天真地以为能在这场即将到来的浩劫中独善其身，未免太过愚蠢。我们将提前把海岸警卫队移交海军部管辖，以便其更好地重组架构、扩充资源，待到战端开启时，他们便能成为一支得力的支援力量。"
 USA_coordinated_strike:0 "协同打击"
 USA_coordinated_strike_desc:0 "世界上没有任何力量能在足够庞大的火力下幸存。如果我们用足够多的飞机协同作战，同时打击多个目标，敌方的防空系统和他们的飞机将被彻底压制，从而无法做出反应。尽管这需要在航母甲板空间、飞行员训练、地勤后勤、通信系统等诸多方面进行大幅改进，但一旦我们掌握了这种战术，就能部署一支毁灭性的力量，没有任何敌人能在我们被拖垮之前幸存下来。"
 USA_airborne_artillery:0 "无畏地狱潜兵"
 USA_airborne_artillery_desc:0 "俯冲轰炸机是应对需要精确打击和足够破坏力目标的最简单却最有效的手段之一。尽管由于专用俯冲轰炸机问世不久，这一概念尚未在实战中得到充分验证，但在有限的实战情境中，其在陆地和海上的表现已展现出诸多优势。因此，这是一项值得投入的多功能装备，既能胜任反舰任务，又可为两栖作战提供空中支援，无论是地面支援还是对关键目标的打击。此外，它们体积小巧、功能多样，完美适配现代航母有限的甲板空间；而轻盈的机身使其能在极短距离内轻松起飞，毫无障碍。"
 USA_anvil_pattern:0 "英勇复仇者"
 USA_anvil_pattern_desc:0 "鱼雷轰炸机是一种更重型的机身，专为搭载能更有效击沉舰船的大型鱼雷而设计。虽然速度较慢且用途较为单一，但在其主要任务领域却是同类中的佼佼者。只要我们能为其提供空中掩护，并开发出更高效的海上运输系统与平台，它们就能对敌方舰队造成毁灭性打击。"
 USA_anvil_pattern_tooltip:0 "§Y碧海之上银翼闪闪§!追加效果：\n航母舰载机机动：§R-5%§!\n航母舰载机攻击：§G+5%§!"
 USA_carrier_effort:0 "增建航母"
 USA_carrier_effort_desc:0 "世界大战后，美国经济形势复杂，加之海军备受忽视，许多航母项目要么被搁置，要么因缺乏资金或建造维护设施而胎死腹中。然而，如今时过境迁，是时候着手建造一批新型现代化航母了，它们将能应对未来战争可能带来的任何挑战，况且仅靠寥寥数艘航母，我们在海上的进攻能力将大打折扣。毕竟，一套围绕某种舰艇设计的作战理论，若连足够的舰艇都没有，又有何用？"
 USA_mass_squadron:0 "大规模航空中队"
 USA_mass_squadron_desc:0 "虽然轰炸机是海军航空兵的中坚力量，但陆上航空作战的原则在此依然适用：必须先夺取空中优势，这些飞机才能执行任务。我们必须为其配备足够数量的专用战斗机以建立空中优势，同时还要发展更完善的后勤体系，解决如何在海上搭载如此多的飞机并有序部署的问题。不过，一旦这些飞机升空，我们至少有机会用弹药击沉敌舰。"
 USA_mass_squadron_tooltip:0 "§Y碧海之上银翼闪闪§!追加效果：\n航母超载：§G-15%§!"
 USA_air_traffic:0 "精简空中交通"
 USA_air_traffic_desc:0 "确保足够数量的飞机升空，取决于是否建立了完善的体系和作战条令，以保证这一过程有序且协调地进行。为此，我们必须提升岛屿管制的可见度，保护其免受飞机尾气和敌方攻击的影响，改进雷达与通信系统以更好地追踪我方飞机，同时协助规范起飞与降落程序，并使我方战斗机能够尽快升空投入作战。"
 USA_air_traffic_tooltip:0 "§Y碧海之上银翼闪闪§!追加效果：\n舰载机起降能力：§G+7.5%§!\n舰载机夜间起降能力:§G+7.5%§!"
 USA_the_swarm:0 "航空母舰甲板作业"
 USA_the_swarm_desc:0 "战斗不仅仅是那些持枪士兵的事，也离不开制造和维护这些枪械的人。我们的地勤人员负责在甲板上维护飞机、保养甲板及其众多系统、协助飞行员登机，并监督飞机的起飞与降落。虽然他们的工作本质不会改变，但我们相信，许多中间环节的流程可以加以改进，让他们工作得更快、更高效，从而让更多飞机升空，这在激战中是一项至关重要的优势。"
 USA_dive_bombers_desc:0 "当一架飞机的引擎在甲板上轰鸣时，机组人员和飞行员聆听着它咆哮的怒吼，机身的金属在压力下紧绷，催促着他们完成触地复飞……人们或许会忘记，在它展翅跃离甲板之前，需要经历多少准备工作。每次红线超负荷运转后，引擎都需要大修；每次飞至极限高度后，机身都需要检查维护；若你忘了采取适当措施，就会直接驶入危险地带。然而，我们可以通过制定严格的非全面作战状态下的飞机使用规范来限制机身压力，开发更先进的引擎维护技术，并研制易于更换的模块化零件或淘汰那些被认为不必要的部件，从而缩短每架飞机的维护时间。这不仅能减少常规检修耗时，更能在战事来临时，帮助受损战机尽快重返蓝天。"
 USA_shining_sea:0 "碧海之上银翼闪闪"
 USA_shining_sea_desc:0 "尽管有关航空母舰的未来战略地位尚缺乏确凿证据，但其发展方向已经明确无疑，而我们也倾尽全力去确保这一愿景得以实现。我们新建的最新式航母在面对行将过时的外国战列舰时，显得尤为庞大壮观；其作战群旨在为自身提供护卫，并扫清敌方残余舰只。我们的航空力量由全球最为训练有素的人员操作与维护，他们在作战中的多功能性赋予我们等同于浮动岛屿的战略优势，能够随时随地以多种方式发动打击。在我们稳居海洋霸主之位的当下，世上再无任何海军力量敢自诩能与我国抗衡。"
 USA_weltkrieg_lesson:0 "世界大战的教训"
 USA_weltkrieg_lesson_desc:0 "我们脑海中始终挥之不去的一件事，便是世界大战中德国U型潜艇的袭击。这令英国措手不及，与顶尖的水面舰艇相比，其成本相对低廉，却能骚扰并击沉众多商船、民用船只，甚至偶尔还有迷航的军舰。尽管到战争结束时，由于护航体系和反潜武器的运用，它们已基本被有效压制，但无论是从纯粹的战术价值，还是击沉商船、补给船和民用船只所造成的士气打击来看，U型潜艇都证明了其宝贵价值。"
 USA_utilize_wolfpacks:0 "实施狼群战术"
 USA_utilize_wolfpacks_desc:0 "一艘单独行动、没有护航的潜艇不仅效率低下，还容易被击沉。于是，一个简单的解决方案应运而生：“狼群战术”，也就是让一支潜艇中队协同作战，既能互相保护，又能更有效地打击多个敌方目标。"
 USA_faster_harder:0 "更快更狠地出击"
 USA_faster_harder_desc:0 "老潜艇艇长们在行动时往往相当保守。他们不愿冒险接敌，也不会充分利用艇体性能对敌人造成最大伤害。幸运的是，我们有大量不囿于传统的年轻血液正在晋升，因此更愿意在海上采取激进行动。我们将遏制潜艇艇长中的保守战术，同时提拔那些更敢于果断行动的年轻艇长。"
 USA_economic_blockade:0 "经济封锁"
 USA_economic_blockade_desc:0 "没有补给，再强大的陆军或海军也无法作战。而在海上，这些补给线尤其容易受到潜艇的攻击，因为敌方舰队要么承受潜在损失，要么从主力舰队中抽调兵力来保护航运线。封锁的威胁始终存在，可能扼杀其经济和武装部队的补给，这对所有战争策划者来说都是令人胆寒的念头。如果我们将其变为现实，我们将在海上获得巨大优势。"
 USA_capital_hunters:0 "越大越好"
 USA_capital_hunters_desc:0 "尽管骚扰毫无防备的舰船是潜艇的主要用途之一，但鱼雷也被证明是击沉水面舰艇最有效的方式之一，原因很简单：船体下部最易受攻击。只要趁其不备，且附近没有太多反潜舰艇，它们就是易于得手的猎物，也是消灭主力舰的一种极具成本效益的方式。"
 USA_better_torp:0 "提高鱼雷性能"
 USA_better_torp_desc:0 "潜艇的攻击能力完全取决于其鱼雷的性能。这其实是个简单的等式：更大更好的鱼雷发射管能发射更大更好的鱼雷，让潜艇足以与装甲最厚重的舰船正面交锋，从而使其成为一种极具价值的攻击武器。我们将进行多次试验并启动研发项目来改进鱼雷技术，这也会进一步提升我国海军飞机和鱼雷艇的作战能力。"
 USA_more_range:0 "扩大作战范围"
 USA_more_range_desc:0 "潜艇需要足够的航程才能成为有效的战争武器，其效用部分取决于能从港口出击多远。这不仅仅是改进推进技术和增大油箱的简单问题，还涉及船员后勤保障。必须为给养、居住舱室、厨房、空调、卫生间等留出空间。我们将升级潜艇艇体的工效设计，使潜艇及其船员能够在海上停留更长时间，从而提升攻击潜力。"
 USA_kraken:0 "海妖之触"
 USA_kraken_desc:0 "北海巨妖是神话中的远古凶兽，形似巨型乌贼，蛰伏于深海之中，专以毫无防备、疏于警戒的远航水手为食，将他们拖入波涛之下，从此杳无踪迹。而潜艇，或许正是人类傲慢之心所能复现的最接近这等原始恐怖的存在，它们从连光芒都无法触及的深渊中升起，击沉敌舰，而后重返幽暗，令敌人至死不知究竟遭遇了什么。也许有朝一日，我们提起它们时，会少一些儒勒·凡尔纳的浪漫，多一些恐怖小说中那些不可名状的诡谲存在。"
 USA_silent_service:0 "无声舰队"
 USA_silent_service_desc:0 "我们的潜艇狼群在波涛之下无声潜行，其隐蔽性远超声呐技术与反潜手段的发展，令毫无防备的敌方舰队陷入恐慌与惊惧。艇员们年轻气盛、求战心切，航程足以横跨大洋，武备之强可击沉敌方所能造出的最大巨舰。它们不再是海战中的配角，如今已成海上交锋的主角。"
 USA_coastal_patrol:0 "规范巡逻路线"
 USA_coastal_patrol_desc:0 "主场优势是战争中最大的优势之一，敌人永远不可能比我们更了解自己的国土，因此我们可以利用每一寸优势，让敌人陷入地狱般的困境。尽管在过去一个半世纪里，每天都有成千上万的船只停靠我们的港口，但最熟悉这片水域的仍是我们的水手。我们应该在战略要港和海上航线上正式确立巡逻路线，并制定防御计划，以最佳方式引诱敌舰进入不利境地，在最小化损失的同时消除威胁。"
 USA_merchant_marine:0 "商船队"
 USA_merchant_marine_desc:0 "商船队是海军的一个分支，大多数人往往忘记它其实属于海军，但在战时它仍发挥着特定且至关重要的作用，那就是维持我们的航运。虽然这个统称涵盖了所有私营和联邦拥有的商船，但在战争时期，它们最终都可被征用，以便更好地协调航运并保护它们免受敌方袭击。最后，这些船只中的一部分还可能被武装起来，并由海军人员（如无线电操作员和信号员）登船，从而有效地充当海军的辅助力量。"
 USA_convoy_runners:0 "实施护航运输队系统"
 USA_convoy_runners_desc:0 "护航船队体系，是指让多艘船只以编队形式，按照最慢船只的速度集体横渡大洋，而非各自单独航行。世界大战爆发之初，这种体系曾被视为多余且低效，但德国潜艇在大西洋上对协约国航运的持续袭击证明了事实并非如此。采用护航编队后，这些袭击的成功率显著下降。与此同时，我们还开发了成本相对低廉的解决方案，例如改装武装商船和建造轻型驱逐舰作为舰队护卫力量，这远比从战列线上抽调舰船去保护每支船队要优越得多。"
 USA_develop_loran:0 "开发远程导航系统"
 USA_develop_loran_desc:0 "远程导航系统是一种利用双曲线导航原理，实现远距离目标识别的技术。这套系统对我们而言价值非凡，既能追踪数百乃至数千英里外的舰船动向并提前部署，还可探索其在航空领域的应用潜力，甚至未来拓展至民用领域。投入资源研发这项新技术并使其投入运行，绝对物超所值。"
 USA_search_and_rescue:0 "搜索与援救"
 USA_search_and_rescue_desc:0 "现代海岸警卫队部分由前救生勤务队组成，该部队于1915年并入缉私船队。顾名思义，救生勤务队致力于海岸警卫与救援，为遭遇海难或受灾的船员提供救助站、食物与庇护所。随着现代海岸警卫队承担起这些职责，我们必须进一步扩充救生艇舰队与救援行动，而新型罗兰导航技术将助力定位沉船与其他遇险船员。"
 USA_man_the_crafts:0 "登陆艇人员配置"
 USA_man_the_crafts_desc:0 "尽管我们理应为最终的海外登陆行动专门建造登陆艇，但现实情况是，在目前阶段，我们可能既无法拥有足够数量的登陆艇，也难以配备充足且具备相当资质的人员，来运送一支规模庞大到足以取得全面胜利的军队。对此，倒有一个相对简单的应对之道，那便是征用商船并调用海岸警卫队人员，以缓解数量上的短缺。诚然，商船并非如登陆艇那样是专为此类任务而建造的，但这些被征用的船只完全能够胜任，甚至还能承担其他辅助性职责，例如改装为医院船、补给船或是大型厨房等。因此，将它们纳入我们的编制之中，将会带来诸多显而易见的益处。"
 USA_damage_control:0 "增强损害控制能力"
 USA_damage_control_desc:0 "减少受损舰艇的维修时间和潜在伤亡，关键在于从一开始就防止损伤进一步扩大。这可以通过扑灭火灾、护送受损舰艇返回港口、协助船员救援行动、为无法挽救的舰艇准备自沉作业等方式实现。通过做好接收并妥善救助受损舰艇的准备，我们能让它们更快重返战场，同时最大限度减少宝贵经验水兵的损失。"
 USA_semper_paratus:0 "永远准备着"
 USA_semper_paratus_desc:0 "无论我们卷入何种战争，海岸警卫队都将始终是最后一道防线，因为我们预计大多数敌人将在远离海岸线的地方被击退。尽管如此，我们仍致力于将海岸警卫队打造成一支可靠的辅助力量，使其能够在需要时响应号召，时刻警惕任何可能到来的威胁，并成为首批响应保卫祖国号召的队伍之一。"
 USA_marksman_marine:0 "人人皆为神枪手"
 USA_marksman_marine_desc:0 "自美西战争与克拉格-约根森步枪的失败以来，我们便深知，美国步枪兵应当配备威力强大且精准的步枪，并且必须成为精准射手，才能在敌人难以有效还击的距离上充分发挥其优势。我们的海军陆战队将使用军械库中最新的步枪进行射击训练，使他们成为我军中最精湛的射手，从而在战场上为我们赢得优势。"
 USA_marine_raider:0 "海军突袭队"
 USA_marine_raider_desc:0 "海军突袭队的概念涉及从精锐中挑选出的突击队式轻步兵单位，他们将带头登陆敌方防御较弱的阵地，而轻步兵的身份使他们能够乘坐轻型舰艇运输，而非我们目前使用的更重、更慢的运输船。虽然目前尚无此类单位，且鉴于其设计针对的特定场景，其战术持久性存疑，但他们将成为我们两栖作战的先锋，必要时还可重新编入军团其他部分作为步兵力量使用。"
 USA_seabees:0 "匠心与汗水"
 USA_seabees_desc:0 "工程师是军旅生活之外最被低估的角色之一，但任何踏上过战场的人都深知他们的重要性。他们是架桥铺路、挖掘战壕、修建与维护机场、保养军车舰船的人，在愤怒的枪声响起之前，他们完成的无数关键工作不可或缺。组建一支专职工程营的提议，将确保我们最优秀的士兵能有条不紊且迅速地承担起这些关键任务，同时将他们留在后方，以便更灵活地部署，避免直接暴露于危险之中。"
 USA_chemical_warfare_service:0 "化学战部队"
 USA_chemical_warfare_service_desc:0 "世界大战中化学武器被广泛使用，尽管大多数国家都反对让这种武器在战场上重演惨剧，但真到了紧要关头，究竟有多少国家能信守承诺，我们不得而知。因此，我们绝不能在这方面落后于人，我们将扩建工程营，增设一个专门负责研究并可能部署化学与燃烧武器的新分支。"
 USA_usn_reserve:0 "美国海军预备役"
 USA_usn_reserve_desc:0 "随着海军不断壮大，成为一流力量，其人力需求也随之急剧膨胀，需要容纳不断增长的军士、船员、海军陆战队、步兵等人员。我们将扩充海军预备役名单，以便在需要时征召新兵。"
 USA_amphibious_assault:0 "登陆矛尖"
 USA_amphibious_assault_desc:0 "无论是在太平洋还是欧洲，我们都需要进行多次两栖登陆，才能直捣敌人的心脏地带。这些登陆行动大多预计将异常艰难——地形险恶，且远离火炮阵地或机场等常规战场支援。而这正是海军陆战队需要肩负的使命：作为登陆行动的先锋，这些精锐士兵将为每一寸土地浴血奋战，直至建立滩头阵地。期间，我方舰艇的炮火将提供支援，压制敌军并摧毁其防御工事。我们不指望登陆会一帆风顺，但我们深知，我们的将士终将赢得胜利。"
 USA_new_ship_buildings:0 "两洋海军法"
 USA_new_ship_buildings_desc:0 "在我们急需实现海军现代化的道路上，有一件事变得愈发清晰：任何此类努力都需要大量预算。尽管正如批评海军部近期请求的人士所指出的那样，还有更紧迫的问题，但如果我们想保持竞争力，确实需要重新设计舰船并扩展最新项目。因此，拟议的《两洋海军法》必须成为现实，以确立美国海军的构成并授权建造特定海军舰艇。"
 USA_navy:0 "海军部"
 USA_navy_desc:0 "自1794年大陆海军改组为合众国海军以来，我们便亟需一个强有力的机构来统辖海上力量。所幸在时任战争部长詹姆斯·麦克亨利的推动下，该机构于1798年得以设立。尽管合众国海军部历史悠久，但因威尔逊总统兑现承诺使我国免于卷入世界大战，导致其缺乏切实的现代化需求，如今已尽显老态。若美利坚欲再度称雄四海，就必须重振海军部昔日的荣光。"
 USA_grand_navy:0 "大白舰队"
 USA_grand_navy_desc:0 "大白舰队是西奥多·罗斯福试图将美国确立为世界海军强国的举措，他运用了担任海军助理部长期间积累的知识，并怀揣着与老牌列强平起平坐的雄心。这次远航虽然暴露了当时美国海军造船与组织架构中的诸多薄弱环节与缺陷，却也达成了既定目标，同时帮助海军获得了未来发展方向上的宝贵认知。即便由于海战形态的不断演进，这支舰队本身在面对现代战列舰时已然过时，但我们数十年来积累的经验意味着，我们很快就能造出继承其衣钵的顶尖战舰，并以足够庞大的数量，在任何海域与任何敌人一决高下。"
 USA_defend_our_trade:0 "保卫美利坚海岸线"
 USA_defend_our_trade_desc:0 "美国海岸警卫队目前由曾经的美国缉私船局和美国救生局合并而成，主要职能是巡逻美国海岸，对抵港商船执行关税征收。虽然理论上在战时可以将其编入海军部，但自内战以来从未启用过这一措施，因此其作战能力基本为零，而且除非南北邻国倒戈相向，否则我们的大陆本土也不存在被入侵的风险，所以这并非当务之急。尽管如此，我们必须推进海岸警卫队的现代化，以防最坏情况发生，确保我们的海岸得到充分保护，并让近海的所有商船免受敌方骚扰。"
 USA_carriers:0 "航母舰队计划"
 USA_carriers_desc:0 "自从第一架飞机飞上蓝天，许多人就一直在思考：我们如何将其用于战争？其中一个被许多人偶然发现的用途是水上飞机，这当然需要能够允许水上飞机从其甲板起飞的舰船。于是，兰利号航空母舰作为这一概念的试验平台应运而生，随后又有几艘由现有船体改装而成的同类舰船紧随其后。尽管这种类型的舰船目前尚未在真正的战斗环境中接受考验，水上飞机技术也仍有不足，但我们仍然相信它将是海战的未来。有朝一日，成群的飞机将从它们的甲板起飞，压制敌方防空力量，同时还能在敌方视野之外数千英里的距离发动打击。首要任务是审视我们目前未完工的船体，将那些被认为合适的进行改装，同时重新审视世界大战后被搁置的专用航母船体概念。"
 USA_battleships:0 "改革战列线"
 USA_battleships_desc:0 "战列线编成永远有改进的余地，世界各国不断寻求超越对手，建造更大、更快、更强、装甲更厚重的战舰，使以往的经验变得过时。虽然我们缺乏现代舰艇参与大规模海战的亲身经验，但我们可以回顾日德兰——这个当代最伟大海战的战场，从德国和英国的交锋中汲取教训，应用于我们自身的编队。"
 USA_battle_cruisers:0 "西方巨兽"
 USA_battle_cruisers_desc:0 "许多海军观察员和我们的一些军官都指出，我们目前还没有能对抗日本大和级战列舰的舰艇。虽然有人提出，由于航空母舰的出现，战列舰可能即将退出历史舞台，但只要大和号及其同类舰艇还在海上游弋，我们就必须建造爱荷华级战列舰来以牙还牙，用我们自己的巨兽来制霸海洋。"
 USA_liberty_ships:0 "自由轮"
 USA_liberty_ships_desc:0 "现代战争的规模已经证明，后勤投送能力决定一切，无法为部队和盟友提供补给的一方，终将因饥馑而屈服。有鉴于此，内阁多位成员提议启动一项紧急计划，建造所谓的“自由轮”级货船。这种货船造价低廉、建造迅速，且能在大西洋与太平洋上高效运作，未来必将成为向各条战线输送急需物资的关键力量。"
 USA_naval_training:0 "机瞄能力"
 USA_naval_training_desc:0 "对某些人来说，这可能只是事后才想到的事，但在战场上，细微的差距却能带来天壤之别，更好的瞄准具能在远距离射击时提供精度优势。我们应当通过实地测试着手研发更精准的机械瞄具，同时训练水兵提高射击精度，以免届时落后于人。"
 USA_america_rules_the_waves:0 "美国、海权与世界"
 USA_america_rules_the_waves_desc:0 "正如著名军官兼历史学家阿尔弗雷德·赛耶·马汉在其开创性著作《海权对历史的影响》中所阐述的那样，要实现对全球的真正统治，就必须通过强大的海军与商业船队的结合来获得真正的海权。虽然美利坚合众国曾在这场角逐中处于领先地位，追赶着大英帝国与德意志帝国的辉煌，但数十年的忽视已使我们落后于人。然而，随着我们近期对海军部相关一切事务的改革努力，我们能够再次夺回那配得上古老海洋化身——塔拉萨本人的霸权头衔。"
 USA_light_cruisers:0 "战列舰的长管巨炮"
 USA_light_cruisers_desc:0 "不到一个世纪前，在内战期间的汉普顿锚地海战中，舰艇的交战距离还不到100米。而在日德兰海战中，舰艇已能在数英里外相互交火。凭借更精良的膛线、火炮制造工艺以及更先进的弹丸技术，我们的目标是制造出射程超越敌方的火炮，让我方将士在敌方射程之外仍能精准命中目标。"
 USA_expand_dockyards:0 "重炮暴击"
 USA_expand_dockyards_desc:0 "尽管射程在战场上是一种宝贵的优势，但事实是，辽阔海域的战场远比任何初始计划所预想的更加瞬息万变。我们的舰船应当力求更近距离地接敌，以便在扰乱敌方舰队阵型的同时，用更重型的火炮造成最大伤害。"
 USA_submarines:0 "水下猎手"
 USA_submarines_desc:0 "潜艇是近几十年来海军作战中最引人注目的创新之一。尽管其理论构想已存在数百年，实际应用也已有约一个世纪，但直到近期建造技术、材料和推进系统取得突破，其真正潜力才得以展现。德国人曾利用潜艇重创大西洋航线，其无差别击沉策略甚至险些将我们拖入对德战争。无论如何，潜艇的价值已毋庸置疑，我们必须全力研发最新设计，好让它们潜得更深、航速更快、续航更远，搭载更大更强的鱼雷，并具备足以避开敌方探测的隐蔽性。"
 USA_naval_aviation:0 "银翼翱翔"
 USA_naval_aviation_desc:0 "虽然已有技术精湛的飞行员掌握了当前技术条件下驾驶飞机的全部要领，但海军航空兵需要的是截然不同的技能组合。无论是舰载机的特殊构造、航母甲板上的独特起飞流程，还是开阔洋面的超低空飞行，都构成了这种差异。值得庆幸的是，密歇根湖这片广阔水域足以让飞行员在近似真实海况的条件下展开训练。鉴于该区域毗邻本土且训练环境可控，在此建立培训项目可谓水到渠成。"
 USA_marine_corps:0 "海军陆战队现代化"
 USA_marine_corps_desc:0 "自建国以来，每当冲突爆发，海军陆战队始终是美国的先锋力量。无论是独立战争、巴巴里战争、南北战争，还是近期的美西战争及太平洋与中美洲的诸多远征，他们始终是我们最可靠、最精锐的武装力量。尽管如此，过去三十年间他们未曾参与过真正的现代战役，自南北战争后更未经历大规模作战，因此难以适应预计即将到来的全球冲突。推进海军陆战队现代化应成为当务之急。"
 USA_urban_warfare:0 "海军陆战队扩编"
 USA_urban_warfare_desc:0 "当前海军陆战队作为主力部队的辅助力量，负责两栖作战及中美洲干预等特种作战的主动行动。然而，尽管其麾下汇聚了众多我军最优秀的军官与军士，但总体兵员不足，难以在广阔战线上有效展开行动。我们的首要任务是从其他军种抽调精锐扩充该部队，并征召更多新兵，使其成为一支规模足够庞大的作战力量，能够同时胜任多项作战任务。"
 USA_expand_waves:0 "建立志愿紧急服役妇女队"
 USA_expand_waves_desc:0 "志愿紧急服役妇女队是一项旨在将海军预备役扩展至女性的提案。尽管此举遭到了那些认为女性不应加入武装部队之人的诸多反对，但我们有责任证明她们确实适合穿上军装，并通过吸纳女性来大幅扩充我们的征兵来源。"
 USA_semper_fi:0 "永远忠诚"
 USA_semper_fi_desc:0 "“永远忠诚”。这是我们海军陆战队的座右铭，几乎与共和国本身一样古老，经历了这个国家卷入的每一场战争和几乎每一次冲突。我们知道，下一场战争将是人类已知的最大规模战争，秃鹫在四面八方盘旋，人人都想成为站在世界新秩序顶端的那一个。这就是为什么我们需要永远忠诚、无条件服从的海军陆战队员，他们将确保美国最激烈的战斗由最强悍的士兵去打，并确保我们最终胜出。呼哈！"

#民族精神
USA_great_depression:0 "大萧条的绵长余波"
 USA_great_depression_desc:0 "美利坚躲避了一战的战火，无数的美利坚子嗣免于像大洋彼岸的英法的热血孩童一样将自己的生命奉献于沼泽，战壕与铁丝网中。然而事实上，灾难也并未放过美利坚这位新大陆的主人。随着英法革命的成功，美国境内的左翼运动达到了历史高峰，愈发频繁的罢工运动持续的冲击着美国经济，而政坛混乱进一步加剧了这一切。\n\n最终火药桶的引线还是燃烧到了尽头：1929年的经济大萧条彻底地击垮了本就摇摇欲坠的美国经济，并将其彻底带到了万丈深渊之下。尽管共和党政府尝试通过各种行政手段解决大萧条及其所带来的毁灭性影响，但一切努力最终还是如滴流入海，未能对一潭死水的美国经济带来多少提振。\n\n如今对美利坚人民噩梦般的六年过去，大萧条的长久影响仍然未散，但总体上美利坚已经走出了经济危机时的极端困境。如今的美国上下都在努力走出大萧条的阴影，将美利坚重新带回过去的繁荣时代。\n\n§R没有人知道这将花费多长时间...§!"
 USA_political_crisis:0 "流血的美利坚"
 USA_political_crisis_desc:0 "危机笼罩着美利坚合众国，十多年来蹂躏我国的经济大萧条依旧没有缓解的迹象，而政府的诸多失败政策又加剧了民众们的失望。民众的绝望情绪让极左的美利坚社会党、民粹主义的美利坚至上党与极右的旧民主党得以趁虚而入，攫取政治资本。同时经济的崩盘导致了社会治安的极度恶化，大量的犯罪分子，黑手党乃至准军事组织纷纷走上街头，而几近枯竭的政府财政更是使得政府对此无能为力。而在一些政治极度撕裂的州，工人民兵与一分钟人的武装冲突烈度更是堪称前所未见。\n\n部分人士已开始将麦克阿瑟与联邦军队视作解决大萧条与政治极化的救命稻草，极端主义者甚至已经开始和联邦军队的军官私下串联。如果眼下的混乱局面无从缓解，甚至于让一位极端党派候选人通过1936年大选当选美国总统，许多人担心等待美国的将是另一场内战的深渊。"
 USA_syndicalist_strike_idea:0 "此起彼伏的野猫罢工"
 USA_syndicalist_strike_idea_desc:0 "几十年来，罢工一直困扰着我们的国家，持续不断的左翼影响使得一切的平息罢工的手段都难以有足够的成效。而随着经济陷入发展的僵局乃至大萧条的爆发，罢工势力只会越发激进壮大。过去几十年里，社会党成员人数持续猛增，而随之而来的是更加汹涌的罢工浪潮。\n\n更糟糕的是，由于社会党势力越发强大，过去被政府视作最后底牌的暴力手段也逐渐失灵，甚至一些时候少量军队都难以击退这些社会党民兵。\n\n有鉴于如今糟糕的社会形势，我们能做的也仅仅是尽一切可能防止更大规模的罢工发生，并试图在未来的总统选举中压制住这些危险的左翼分子。"
 USA_klan_activity_idea:0 "无形帝国"
 USA_klan_activity_idea_desc:0 "自南北战争以来，三K党就成了政府的眼中钉。三K党起初只是一个不起眼的恐怖组织，如今却发展到在南部几乎成为名副其实的一个机构，成为迪克西人的又一件工具。放在以前，北方的民主党人肯定不会让其在南方以外落脚，但国家经济崩溃后，三K党就不再满足于乖乖待在南方过自己的日子。经济崩溃带来的社会矛盾激化给予了这帮白面疯子滋生的土壤。从印第安纳州到华盛顿州，三K党以惊人的速度扩散开来，动用私刑缓慢毒害着热爱自由的美国民众。很快就会有一天，我们不得不直面三K党，但现在，我们只得放任这群白面罩……"
 USA_no_experience_idea:0 "久疏战阵之鹰"
 USA_no_experience_idea_desc:0 "尽管美利坚幸运的逃避了一战的惨痛牺牲，但我们的联邦军队却未必从中获益。而1916年失败的潘兴远征则进一步打击了我们的军事部门。拨给他们的每年军费也由于持续不断的经济恶化与大萧条的影响不断下跌。\n\n如今陆军部在军事理论和技术上逐渐与世界主流军界拉开差距，稀缺的坦克，落后的步枪与鲜少维护的大炮无时无刻不在证明这一点。毫无疑问，如今我们用来保卫民主的剑与盾都已经锈蚀不堪。而如今面临不断恶化的世界局势，我们能做的也许只有祈祷不会有另一场毁天灭地的世界大战波及到美洲。"
 USA_The_legacy_of_the_Monroe_Doctrine_idea:0 "门罗主义之余热"
 USA_The_legacy_of_the_Monroe_Doctrine_idea_desc:0 "如今的美国已经虚弱不堪，但这个世界大国在美洲的影响力仍旧无可撼动。在过去的二十年间，无论是德意志这位世界霸主，抑或是信奉输出革命的第三国际，都被我们的外交斡旋与武力干涉拒于美洲之外。然而，内部的困境使得如今的美利坚难以在实质上维护自身在美洲大陆的绝对影响力。但至少，美国还能在外交场合中坚守对门罗主义的坚定支持。"
 USA_black_monday:0 "黑色星期一"
 USA_black_monday_desc:0 "经济大萧条在数十年来一直困扰着美国，在胡佛政府领导下方有一丝复苏迹象。然而，近期爆发的柏林股市危机令美国再度深陷崩溃梦魇。这场噩梦究竟何时结束，恐怕只有上帝与下一任总统才知道了。"
 USA_black_monday2:0 "黑色星期一"
 USA_black_monday2_desc:0 "经济大萧条在数十年来一直困扰着美国，在胡佛政府领导下方有一丝复苏迹象。然而，近期爆发的柏林股市危机令美国再度深陷崩溃梦魇。这场噩梦究竟何时结束，恐怕只有上帝与下一任总统才知道了。"
