 USA_totalist_party:0 "社会党"
 USA_totalist_party_long:0 "美利坚社会党 - 先锋队派(Socialist Party of America)\n§g除了主流的工团派外，美利坚社会党中还有一个囊括各种专制倾向的工团主义者、马克思主义者等的派系。这些所谓的“先锋队派”在党内人数虽少，但其言论往往掷地有声，党内的批评人士经常指责他们是引发麻烦的因素。然而，这种批判反而加剧了党内的派系分歧。威廉·福斯特自称是工团主义者，但却信奉着相当专制的观点，主张进行社会革命和集体化，他通常被视为美利坚社会党中最激进的成员。最近，他甚至胆大妄为地称党内最温和的一些成员为“反动派”。曾是福斯特密友的厄尔·白劳德在一定程度上已经远离了工团主义，他支持保留许多旧美国体系中的因素，如小型企业之类，同时在社会改革的观点上也有些保守。作为一名协商专家，他把路线重心放在发展工业和经济，这可能会为他赢得其他美利坚社会党派系的支持。不太知名的詹姆斯·伯纳姆则倡导建立一个技术官僚主导的社会，在这个社会中，一个新的管理者阶层将不可避免地崛起，取代旧的贵族精英阶层。伯纳姆代表着先锋队派中最保守的一派，以及从美利坚社会党其他派系中脱离出来的各路人士。§!"
 USA_syndicalist_party:0 "社会党"
 USA_syndicalist_party_long:0 "美利坚社会党 - 世界产业工人联盟(Socialist Party of America)\n§g世界产业工人联盟于1905年在伊利诺伊州的芝加哥成立。它的主要创始人包括尤金·德布斯、比尔·海伍德、玛丽·哈里斯·“老妈”·琼斯和丹尼尔·德莱昂等。他们的座右铭——“对任何人的伤害就是对所有人的伤害”可以被视为他们政党的代表性目标，即首要的是给予工人更多的权利并建立一个新的以工会主导的经济。如今，世界产业工人联盟是美利坚社会党中最不可忽视的团体之一，因为该党派的这一派别目前是最受大众欢迎的，所以有些人认为它是美利坚社会党中的主流。然而，这种情况很容易被改变。当然，哪怕在这样一个派别里，也肯定会有分歧。但尽管他们对如何管理国家有不同的看法，那些坚持世界产业工人联盟信条的人通常还是认为自己是工团主义者或无政府工团主义者。比尔·海伍德现在已经团结起了这一派别，希望能给美国带来彻底的改变。由于工团派的团结及美国最近的冲突愈演愈烈，美利坚社会党的受欢迎程度激增。他们的主要支持者是在钢带，现在普遍被称为红带地区的工人群众，由于海伍德在这一地区得到广泛的支持，以及美国其他地区的相对不团结，一些人甚至推测，海伍德可能在即将到来的选举中大获全胜。§!"
 USA_radical_socialist_party:0 "社会党"
 USA_radical_socialist_party_long:0 "美利坚社会党 - 独立派(Socialist Party of America(Independent))\n§g美利坚社会党中有许多左翼分子并不明确自认为或被认为是工团主义者，他们的政治倾向更加温和。这一派别通常也被称为“国家派”或“社会爱国派”。他们部分的信仰支撑可以追溯到作家爱德华·贝拉米以及一些古老的国家主义俱乐部。独立派更多地以社会组织而不是工会为基础，这也可能反映了他们是在中产阶级而不是在城市工人中受到支持。美利坚独立联盟是独立派组织中最强大的一支，而独立派与工团主义者的不同之处在于他们支持中产阶级行会、人文主义价值观以及建设一个美国乌托邦社会制度的愿景。诺曼·托马斯是他们的主要领袖，他受贝拉米的著作启发得出的路线得到了派别内的广泛支持。不过，总的来说，他们与美利坚社会党其他派系的不同之处使得他们足够受人注目，甚至于可被认为是一支独立政党。在某些时候，他们可能在党内斗争中独占头角。§!"
 USA_social_democrat_party:0 "进步党"
 USA_social_democrat_party_long:0 "进步党(Progressive Party)\n§g美国的进步主义者有着悠久而自豪的历史。但尽管他们竭尽所能，在国家舞台上却始终没有得到什么表现机会。西奥多·罗斯福就被认为是进步派名人，但他自建公麋党，作为候选人竞选总统的努力最终以失败告终。近几十年来，其他进步派人士也曾尝试赢得总统竞选，但都未曾取得成功，其中最著名的是威斯康星州的进步派人士罗伯特·M·拉·福莱特。现在，随着这个国家处于崩溃的边缘，他们可能终于有了机会。乔治·诺里斯，通常被人们称为“奋战的自由派”，在进步党内部已不可忽视。他对“公平施政”原则的支持，以及他对农民具有的民粹主义的吸引力，都使他在即将到来的选举中成为进步党总统候选人。尽管他所提出的纲领让大多数精英人士感到厌恶，但一些人也开始好奇进步党人是否确实比困扰这个国家的极端分子更可取，这些人开始认为，进步党是一个既能解决大多数选民关切的问题，同时又能维持国内和平的政党。§!"
 USA_social_liberal_party:0 "共和党"
 USA_social_liberal_party_long:0 "共和党 - 自由派(Republican Party (Liberal) )\n§g共和党自林肯时代起便蒸蒸日上，伍德罗·威尔逊总统也许对党造成了一些损害，但共和党仍不失为一股强劲力量。不过近年来共和党的主导地位却逐渐陷入危机，虽然赫伯特·胡佛总统是共和党人，但也不足以确保共和党能拿下将至的选举。党其实已经就贸易问题分裂为两派：一派是保护主义派，代表人是胡佛总统和副总统查尔斯·柯蒂斯；另一派则是注重社会导向和自由贸易的自由派，代表人是当红新人阿尔夫·兰登。两派都认为需要提供刺激计划助力国家恢复，柯蒂斯在演说中特别提到了这一点，而兰登则指出关税才是造成经济危机的罪魁祸首。兰登现在进退维谷：他不能轻易批评执政党，这毕竟是他的党，而任何对本党的批评都可能演变成对自己的批评。他最大的希望就是击败柯蒂斯，由自己主导共和党的复兴。不过，即便他成功了，摆在面前的还有四年的艰难险阻……§!"
 USA_market_liberal_party:0 "共和党"
 USA_market_liberal_party_long:0 "共和党 - 保守派(Republican Party(Conservatives))\n§g共和党自林肯时代起便蒸蒸日上，伍德罗·威尔逊总统也许对党造成了一些损害，但共和党仍不失为一股强劲力量。不过近年来共和党的主导地位却逐渐陷入危机，虽然赫伯特·胡佛总统是共和党人，但也不足以确保共和党能拿下将至的选举。党其实已经就贸易问题分裂为两派：一派是保护主义派，代表人是胡佛总统和副总统查尔斯·柯蒂斯；另一派则是注重社会导向和自由贸易的自由派，代表人是当红新人阿尔夫·兰登。两派都认为需要提供刺激计划助力国家恢复，柯蒂斯在演说中特别提到了这一点，而兰登则指出关税才是造成经济危机的罪魁祸首。柯蒂斯在内部圈子里非常受欢迎，副总统的地位也让他结交到了远超一般人想象的朋友，但胡佛的问题也为柯蒂斯的履历蒙上阴影，除了在初选中击败兰登外，他必须加倍努力克服其他方面的问题。如果他能战胜这一切，那他就很有可能战胜可悲的加纳和威胁两大党的极端派。但柯蒂斯也不确定自己能否实现美国复苏，毕竟胡佛都没做到，而他和这位朋友到底会有多大差别，也有待观察。新政府决心干预经济的传言不胫而走，他的顾问对此十分焦虑，但他的支持者却对此非常热情，也许这就是他通往胜利的道路。§!"
 USA_social_conservative_party:0 "民主党"
 USA_social_conservative_party_long:0 "民主党(Democratic Party)\n§g民主党已经垂垂老矣，但胡佛的任期使民主党重新焕发了活力。杰出的民主党人将当前的危机视为民主党重新入主白宫的绝佳机会，然而他们也同样面临着挑战。尽管共和党存在种种错误，但他们在选战中仍是一支团结一致的力量。与此同时，民主党的一个分支，由“苜蓿比尔”默里领导，威胁要把民主党撕成两半。他们在南方的基础虽不足以削弱民主党选举团，但在普选中已给党造成了严重困扰。更糟糕的是，在传统上对民主党友好的城市选区也遭受了打击，例如纽约市，这些地区已经转向了社会党。众议院议长约翰·南斯·加纳可没有谈判的心情。他的政纲集中在谴责北方的社会主义激进分子、城市里的外来移民以及南方的少数派。加纳同样也厌恶柯蒂斯和兰登的干预主义主张，他认为他们会像胡佛在任期间所做的那样，向社会主义者和民粹主义者连连让步。加纳声称，实行紧缩政策是解决美国经济困境的唯一办法，如果美国勒紧裤腰带，或许它最终就能挺过来。不过，如果加纳想赢得选举，他必须扩大自己的选民基础到传统党派支持者之外，或者赢回跟随默里离开的不满的前支持者。这不是一件简单的事，加纳的任务无疑也很艰巨。但是，如果他赢得选举，加纳相信他对极端分子的强硬策略将最终拯救这个国家。他的同僚们希望他是对的，因为如果他失败了，这个国家肯定会分崩离析。现在，所有的目光都集中在加纳身上。§!"
 USA_authoritarian_democrat_party:0 "至上党"
 USA_authoritarian_democrat_party_long:0 "美利坚至上党(America First Party)\n§g美利坚至上党代表着美国政治中的全新热潮，在它诞生后短暂的时期内，它已像炸弹一样震撼了整个政治舞台。被称为“王鱼”的路易斯安那州州长、现任参议员休伊·朗已经巩固了对本州的控制，并计划参加总统竞选。他尖锐地批评了胡佛总统试图缓解危机的努力，并转而提倡他自己的“分享财富”计划。该计划将限制个人净资产和年收入，向60岁以上的人发放养老金，努力保障所有人的免费教育，并通过税收将财富从1%的富裕人口重新分配给其余人口。朗已经成为美国政界的一颗明星，从洛杉矶到纽约，他的演讲吸引了成千上万的听众。他最大的支持者来自民粹主义的大本营——大平原。该地区的农民和工人，都因为沙尘暴危机的冲击，纷纷涌向了朗的阵营。但是，他的支持并不仅仅来自这些州，朗拥有足够的支持者，甚至有可能赢得即将到来的选举，前提是他的反建制言论能够削弱来自主要政党和其他新兴政党的挑战者。无论如何，如果朗成功当选，他将面临重大挑战。首先，来自当权者的反对定会相当强烈，而胡佛甚至几乎不承认至上党的存在。此外，如果朗获胜，几乎可以肯定的是，选举结果将被其他各方谴责为非法的，这可能导致严重冲突。不管发生什么，王鱼和他的党已经准备好了，任何低估他们的人都犯了严重的错误。§!"
 USA_paternal_autocrat_party:0 "旧民主党"
 USA_paternal_autocrat_party_long:0 "旧民主党(Old Democratic Party)\n§g在伍德罗·威尔逊总统的红色恐慌时期，工团主义者和其他左翼分子遭到镇压。然而，共和党人在上台后缓和了压制，使得这些团体的支持率再度上涨。而民主党对此几乎没有做出任何反制措施，似乎他们已变得太过软弱，腐败，又或者两者兼而有之。秉持着这种想法，前俄克拉何马州州长“苜蓿”比尔·默里决定带领焦虑的南方民主党人组建一个新政党，该党拥护着民主党的旧时价值观，因此这个政党被称为“旧民主党”。默里本人甚至决定以打击“共产主义者、企业集团和跨种族通婚”为宣言竞选总统。默里激烈谴责银行和政治腐败的演讲为他在南方赢得了大量支持，但旧民主党的崛起也并不全因为他一人。三K党与全国民主党白人联盟合作，已经成为了党内的一支主要力量，并带来了默里从未预想过的更多支持。此外还有法团主义的福特派，他们也为默里在南方以外的地区提供了一定的支持基础——其主要由北方城市中不满民主党和共和党的人构成。这些派系现在在默里的领导下团结一致，但如果他赢得选举，紧张局势必将出现。然而，目前这些都是他无需担心的问题，因为旧民主党甚至还被一些南方国会议员所忽视，也很少在国家舞台上被认真对待。此外，如果旧民主党能在1936年赢得大选，其领导地位肯定会受到挑战，而这种情况可能会导致武装冲突。无论如何，默里确信当前的体制正在走向失败，而他才是唯一能拯救这个国家的人。§!"
 USA_national_populist_party:0 "旧民主党"
 USA_national_populist_party_long:0 "旧民主党 - 全国白人联盟(Old Democratic Party(National White League))\n§g全国白人民主联盟是旧民主党的主要派系之一。其力量在最近三K党成员不断增加的过程中逐渐壮大，而现在他们在全国各地有着数百万能够随时动员加入战斗的成员。全国白人联盟通常秉持着比主流旧民主党更为苛刻的反工团主义、反黑人和反犹太纲领。旧民主党也因此经常被视为极右翼极端分子，尽管这并不能反映白人联盟内部的多样性。新三K党是两个三K党主流派系中成立较晚的一个，该派系的目标是使组织实现现代化，政策上表现出温和务实的姿态，并吸纳三K党过去所忽视的群体。旧三K党派系与早期三K党最为相似，他们与黑色军团进行合作，通常被视为三K党中更为冷酷的一派，但与他们的新三K党同僚相比，旧三K党也少了些贵族气息。同时，赫伯特·阿姆斯特朗通过独特的“基督徒身份”运动领导着白人联盟的边缘派系。阿姆斯特朗大量引用了圣经和基督教理论来支持他所主张的极端立场，而他本人对美国应该如何运行也有着自己的看法。§!"
