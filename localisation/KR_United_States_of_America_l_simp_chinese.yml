 USA_social_conservative_patriots_party:0 "爱国者党 - 自由派"
 USA_social_conservative_patriots_party_long:0 ""爱国者党 - 自由派(The Patriot Party Liberals)\n§g这些人都是思想更开明的政客和新爱国者党的支持者。这些人享受着新政权所带来的好处，但是他们仍然怀念着旧美国的民主制，他们承诺在未来会想办法让旧式民主重归美国。§!"
 USA_authoritarian_democrat_patriots_party:0 "爱国者党"
 USA_authoritarian_democrat_patriots_party_long:0 "爱国者党(The Patriot Party)\n§g爱国者党是旧日的三巨头政府为了团结各方势力而缔造的一个大帐篷政党。包括诸如银行家，技术官僚乃至行政人员等军队之外的人员都被悉数吸纳进入爱国者党。这样的一个大杂烩的政党中有许多诉求，而唯一能够达成的共识，就是维持政府的高效运转与稳定，保卫美国不会再次收到内战与分裂的威胁。§!"
 USA_paternal_autocrat_patriots_party:0 "爱国者党 - 麦克阿瑟派"
 USA_paternal_autocrat_patriots_party_long:0 "爱国者党 - 麦克阿瑟派(The Patriot Party MacArthurites)\n§g这些人是党内麦克阿瑟的铁杆支持者。他们对他忠心耿耿，坚信他有能力统治这个国家。但他们能否在重建的过程中把国家团结起来还有待观察。§!"
 USA_national_populist_patriots_party:0 "爱国者党 - 极端民族派"
 USA_national_populist_patriots_party_long:0 "爱国者党 - 极端民族派(The Patriot Party Ultranationalists)\n§g这些人把“爱国者”这个词提升到了新的高度。极端民族派主张对那些不服从新政府的人进行铁腕甚至更强力的镇压，他们寻求的是一个只有美国独占天下的世界。§!"
