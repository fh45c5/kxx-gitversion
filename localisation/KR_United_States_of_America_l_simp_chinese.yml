 afp_usa:0 "§1美利坚至上党§!"
 afp_usa_DESC:0 "§1美利坚至上党§!代表着美国政治中的全新热潮,即被彻底鼓动并完全激进化的民粹主义。被称为“王鱼”的路易斯安那州州长、现任参议员休伊·朗已经巩固了自己的选民与支持者基本盘，并尝试将自己的政治影响力进一步扩大。他最大的支持者来自民粹主义的大本营——大平原。该地区的农民和工人，都因为沙尘暴危机的冲击，纷纷涌向了朗的阵营。如今，无数的一分钟人正在簇拥着休伊·朗这位民粹领袖，意图将他拥护向美国的最高权力。"
 iww:0 "§V美利坚社会党§!"
 iww_DESC:0 "§R美利坚社会党§!代表着美国左翼政治思想的集结点，是贯穿全国的红色浪潮与劳工运动的精神象征。这个党派由无数不同的派系组成——从主张工团自治的工人联盟，到信奉国家规划的革命先锋，再到提倡人文主义改革的独立派。不同理念在同一面旗帜下交织碰撞，却也因此使社会党展现出惊人的生命力。其支持者主要来自钢铁带与东北部的工业城市，那里的工人、失业者与理想主义者皆视其为希望之火。他们已经准备好，时刻筹备着颠覆旧有的资本主义秩序。"
 od:0 "§F旧民主党§!"
 od_DESC:0 "§F旧民主党§!是美国政治中最具南方色彩的势力之一，由前俄克拉何马州州长“苜蓿”比尔·默里在红色恐慌的阴影下建立。他声称自己是旧时代民主党的真正继承者，誓言要“粉碎共产主义、财阀集团与种族混杂”，并以此赢得了南方农民与失落白人工人的广泛支持。党内最大的派系——全国白人联盟——在三K党与黑色军团的协助下迅速壮大，他们宣扬极端民族主义与排外主义，试图以武力维护所谓的“旧秩序”。默里本人虽试图维持政治平衡，但他的演讲与政策不可避免地被极右翼派系所利用。除此之外，还有受法团主义影响的福特派，他们在北方城市中为旧民主党提供了额外的工业支持。"
 establishment:0 "§2民主建制派§!"
 establishment_DESC:0 "§2民主建制派§!是对美国政坛传统两党以及一部分进步主义者的笼统概括，旨在涵盖所有意图维护现有政治体制的政客，官员与社会活动家。这些美式民主的忠诚维护者彼此之间政见不同，但至少如今他们都将激进党派视为共同之敌。令人感到安慰的是，建制派这个大帐篷仍然占据着美国政坛的多数，但没有人能够知道这样的脆弱联合能够持续多久。"
 military:0 "§P军方§!"
 military_DESC:0 "§P军方§!，或者说麦克阿瑟派，是如今的美国局势的不可忽视的力量。在美利坚过去近二百年的历史中，从未有这样一个时刻§P军方§!有着如此的影响力。在混乱的局势面前，相当一部分对现有状况感到绝望的人将希望寄托给了以道格拉斯·麦克阿瑟将军为首的激进派军人身上。随着时间的推移与准军事组织势力的扩大，§P军方§!在维护秩序方面的作用也进一步提升，政府只得一步步对这些野心勃勃的军人们让步..."
