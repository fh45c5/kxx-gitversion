 USA.704.d.not_president:0 "[GetYear]年共和党初选已经开始。尽管在过去共和党遭受了诸多挫折，但绝大部分党内成员仍旧对新一届大选充满希望。如今我们有六位预备候选人：托马斯杜威，约翰·布里克，亚瑟·范登堡，罗伯特·塔夫脱，菲奥雷洛·拉瓜迪亚与纳尔逊·洛克菲勒。今年谁将成为共和党的总统候选人呢？"
 USA.704.d.landon_steps_down:0 "阿尔夫·兰登决定不再谋求第三届总统任期，这是美国政治的传统做法，他将不再担任党魁，让党内新人获得总统候选提名。三位主要候选者出现在了大会上：亚瑟·范登堡，菲奥雷洛·拉瓜迪亚和纽约州州长托马斯·杜威。代表们将选出谁？"
 USA.704.d.hoover_steps_down:0 "由于胡佛总统在刺杀中身负重伤，他本人决定不再延续他的第五个任期，同时他也将不再担任党魁，这就意味着共和党将提名一位新的总统。三位主要候选者出现在了大会上：罗伯特·塔夫脱，约翰·布里克和纳尔逊·洛克菲勒。代表们将选出谁？"
