 USA_rainbow_war_plans_decisions:0 "美国战争计划"
 USA_rainbow_war_plans_decisions_desc:0 "尽管内战结束了，战争的阴云仍然萦绕在我国周围。以捍卫和平之名，我们必须谨慎选择自己的朋友与敌人，"
 USA_join_entente:0 "加入协约国"
 USA_join_entente_desc:0 ""
 ACW_CAN_supported_us:0 "加拿大曾在内战中援助我们"
 ACW_JAP_supported_us:0 "日本曾在内战中援助我们"
 USA_war_plan_orange:0 "日本的威胁"
 USA_war_plan_orange_desc:0 "日本的野心对我们国家与世界公益而言都是种威胁。是时候采取措施制止他们了。"
 USA_war_plan_gold:0 "工团主义威胁"
 USA_war_plan_gold_desc:0 "法国工团主义发展迅猛，我们无法坐视他们继续扩张势力范围——眼下必须采取行动。"
 USA_war_plan_black:0 "德国的威胁"
 USA_war_plan_black_desc:0 "德意志帝国主义发展迅猛，我们无法坐视这种扩张，更不可能继续将他们的举动视作自卫——眼下必须采取措施，捍卫人类宝贵的自由。"
 USA_war_plan_red:0 "苏俄的威胁"
 USA_war_plan_red_desc:0 "我们早就知道俄国人民的热情不会被压抑太久。既然他们选择拥抱工团主义，那就必然沦为世界的首要威胁，对此我们绝不姑息纵容。"
 USA_war_plan_blue:0 "俄罗斯的威胁"
 USA_war_plan_blue_desc:0 "俄罗斯的野心对我们国家与世界公益而言都是种威胁。眼下必须采取行动阻止他们的扩张，否则俄罗斯军队早晚会出现在美洲海岸的。"
 USA_work_with_allies:0 "与[From.GetAdjective]合作"
 USA_work_with_allies_desc:0 "我们应该动用美国技术去帮助[From.GetNameDef]盟友，提供他们急需的装备与军事顾问。"
 USA_dominated_france_russia:0 "对法国与俄罗斯拥有主导权"
 USA_owns_american_claim:0 "控制着我们宣称的领土"
 USA_owns_fifty_states:0 "拥有五十个以上的地区"
 USA_deal_with_terrorists_decisions:0 "剿灭叛乱分子"
 USA_deal_with_terrorists_decisions_desc:0 "尽管内战已经结束，部分顽固的叛乱武装依然拒绝放下武器。我们必须一劳永逸地剿灭这些叛乱分子，为美国重新带来和平与希望。"
 USA_fight_socialist_terrorists:0 "打击社会主义叛乱分子"
 USA_fight_longist_terrorists:0 "打击朗主义叛乱分子"
 USA_progressive_policy_decisions:0 "进步党政策"
 USA_progressive_desegregate_the_military:0 "消除军队中的种族隔离"
 USA_progressive_desegregate_the_military_desc:0 "“无论是谁，都是怀揣着对美好生活的向往而来到美国这片土地的；无论是谁，只要身为美国人，都愿为捍卫自由而战。然而长久以来，我们却让军队筑起种族隔离的高墙，蒙蔽上了自由的光芒。不过，这一切都将止于今日，美国军队将永久废除种族隔离制度。”"
 USA_progressive_western_investment:0 "投资西部诸州"
 USA_progressive_anti_lynching_law:0 "禁止私刑法案"
 USA_progressive_public_owned_corporations:0 "公有企业"
 USA_republican_policies:0 "共和党政策"
 USA_republican_policies_desc:0 "共和党纲领中涵盖诸多政策与法律主张，它将推动国会对此加以实践。"
 USA_republican_desegregate_the_military:0 "消除军队中的种族隔离"
 USA_reunite_with_PSA:0 "与[From.GetNameDef]复合"
 USA_reunite_with_PSA_desc:0 "麦克阿瑟选择放弃权力，民主政治也成功复兴。因此，我们应该邀请[From.GetNameDef]回归联邦政府的怀抱——毕竟，他们的目标不是已经实现了吗？美国重归民主啦！"
 USA_reform_monroe_doctrine:0 "修正门罗主义"
 USA_reform_monroe_doctrine_desc:0 "昔日的美利坚合众国在保卫世界民主政权免受工团与民粹主义侵扰的道路上，也曾有过踌躇。如今，美国国会与总统阁下决定重新审视其与欧洲及其它大陆国家的外交关系，毕竟，同一道散兵坑里可永远不会有中立派。"
 USA_business_ties:0 "商业纽带"
 USA_business_ties_desc:0 "三六年危机期间，大批洲际跨国企业选择逃离了美国。为恢复他们对美国经济的信任，国会计划向他们提供低息贷款、发行海外债券，与各大企业建立起新的合作关系。"
 USA_pick_a_side:0 "抉择道路"
 USA_pick_a_side_desc:0 "现在终于到我们决定自己在世界舞台上所处立场的时候了。我们是应该向联合王国的遗产卑躬屈膝，向协约国倾囊相助？还是应该与德国一同推动欧洲的团结？我们的国家在道路的抉择上仍存在着巨大分歧。"
 USA_arsenal_of_freedom:0 "自由兵工厂"
 USA_arsenal_of_freedom_desc:0 "国会已授权总统成立一个由商业利益和外交政策专家组成的委员会，以便为我们的新盟友提供最佳协助。只要运用得当，我们雄厚的工业实力几乎可以碾压一切国家，而只有真正的民主国家才配享有“自由兵工厂”带来的力量。"
 USA_new_diplomatic_corps:0 "新外交使团"
 USA_new_diplomatic_corps_desc:0 "内战期间被迫关停的无数使馆如今再度人满为患。我们有包括竞选捐助人、国会议员和军方官员在内的一长串名单可供填补外交使团的空缺。是时候该让世人重新认识美利坚了。"
 USA_tech_sharing2:0 "科研合作"
 USA_tech_sharing2_desc:0 "学术界向来不准通过私人渠道分享研究资料、接触海外机密项目，而既然我们决心整合全阵营的人力资源来对抗工团主义者，这道禁令也将就此废除。"
 USA_joint_military_training:0 "联合军事训练"
 USA_joint_military_training_desc:0 "美国国内一触即溃的和平秩序，使得军方只能将训练场地迁至国外，避免加深公众对独裁专制的恐惧。我国盟友已接受了这项提议，联合军事训练与演习计划正在积极策划中，看看我们能在新世界表现得如何吧！"
 USA_economic_muscle:0 "美利坚向前进"
 USA_economic_muscle_desc:0 "迄今为止，美国的对外军事行动一直靠的是压倒性的规模优势，以及部队的各行其是。不过，当下的新同盟关系要求的更多是合作与协调，因为我们的敌人一定会动用各种现代化武器来阻止我们。"
 USA_united_together:0 "众志成城"
 USA_united_together_desc:0 "美国民众对海外作战热情寥寥，维持中立的舆论始终占据着主流。我们必须软硬兼施，改变民众的想法，例如推动社会尊重退伍军人、以亲切的笔触描绘我国的海外盟友等。"
 USA_the_american_century:0 "美利坚世纪"
 USA_the_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 USA_back_in_business:0 "再度出山"
 USA_back_in_business_desc:0 "美国过去经历的麻烦事使其无力再继续扮演理所应当的国际强国角色，但现在情况已经有所改善。美国已经做好了重登世界舞台的准备。"
 USA_rebuild_monroe:0 "重申门罗主义"
 USA_rebuild_monroe_desc:0 "欧洲与世界其它角落蔓延的危机，与我们有什么关系呢？美国属于新世界，我们要做的也是维护新世界的和平与繁荣。我等命中注定要成为北美的霸主、南美的守护者，以及任何胆敢与我方作对者的毕生噩梦。"
 USA_diplomatic_corps:0 "美国外交使团"
 USA_diplomatic_corps_desc:0 "迈向霸权的首要步骤，就是让我们未来的敌人与盟友确切地知道我们的想法。无论他们欢迎与否，都阻止不了我们的脚步。"
 USA_rightful_domain:0 "国土不容侵犯"
 USA_rightful_domain_desc:0 "北美大陆始终是我们的第一要务，美国绝不容许任何敌对国家在自己的边境上作祟，而她也会依凭武力从海陆两个方向护卫国土。"
 USA_cooperaton_treaties:0 "合作条约"
 USA_cooperaton_treaties_desc:0 "美洲国家联盟将聚合南北美诸友好中立国，美利坚于此既为保护者，亦为善导者。"
 USA_propping_up_allies:0 "新美利坚帝国主义"
 USA_propping_up_allies_desc:0 "美国人从来都不是帝国主义者，我们决不会不请自来，而只在必要之时、必要之地贯彻我们的意志，维护西方的秩序。这是为了所有人的利益。"
 USA_pax_americana:0 "美式和平"
 USA_pax_americana_desc:0 "美洲大陆的伟大斗争业已结束，新的集体意识正在稳步塑就。经济合作与社会秩序正在占据舆论主流，美利坚合众国的又一项雄心壮志即将成为现实。"
 USA_enter_the_fray:0 "介入纷争"
 USA_enter_the_fray_desc:0 "美国是世界舞台的一员。虽说我们对加入外国阵营一事心存芥蒂，但我们也会毫不犹豫地动用军事力量，消除世界各地那些终将找上门来的威胁。"
 USA_arsenal_of_democracy:0 "民主兵工厂"
 USA_arsenal_of_democracy_desc:0 "睦邻政策要求我们制定一项国内计划，为未来的冲突做好充分的武器准备。总统阁下所倡导的“民主兵工厂”由此应运而生，它将允许我们能够向南美洲最遥远的彼端输送战争物资，帮助其推翻暴政、打击工团主义。"
 USA_longer_reach:0 "伸手向远方"
 USA_longer_reach_desc:0 "如果我们希望将自己的力量投射到世界各地，那就必须拥有一支强劲的海军。"
 USA_on_the_beach:0 "踏上滩涂"
 USA_on_the_beach_desc:0 "我们的敌人终将会为美国士兵踏上其滩头时的雄姿而感到恐惧，为此，我们必须磨炼自身的能力，让其无愧于我们庞大的力量投射范围。"
 USA_working_with_allies:0 "与盟友携手合作"
 USA_working_with_allies_desc:0 "我们应该允许自己的盟国和“敌人的敌人”，自由运用我国的专业知识。假若他们的斗争可以更顺利些，我们离成功也能更进一步。"
 USA_american_century:0 "美利坚世纪"
 USA_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 USA_fortress_america:0 "美利坚坚城"
 USA_fortress_america_desc:0 "美国方才刚在地狱里走了一遭，现在还没精力参与外部的纷争。眼下必须放眼祖国各地，维护国内秩序，做好在敌国来袭时守卫边境高墙的准备。"
 USA_man_the_walls:0 "高墙就位"
 USA_man_the_walls_desc:0 "国防首务，当固边疆高墙。寰宇当畏美利坚之武威，然此慑止于自卫之境。"
 USA_business_of_neutrality:0 "中立政策"
 USA_business_of_neutrality_desc:0 "维持中立政策的好处就是敌人少、贸易伙伴多。假若美国有意成为真正的世界强国，就必须依靠强劲的美元。"
 USA_look_inward:0 "放眼国内"
 USA_look_inward_desc:0 "美国再也无需顾虑动荡与内战的威胁。眼下必须放眼国内，处理必要的内政问题，而非紧盯着那些不属于美国人的地方。"
 USA_leap_forward:0 "美利坚的跃进"
 USA_leap_forward_desc:0 "成果既已巩固，前进方向亦已明确，美国可以团结一致、遥遥领先于世界迈入下一纪元了。"
 USA_peace_at_last:0 "终归和平"
 USA_peace_at_last_desc:0 "我们的努力终见成效，美国也明白过来，真正的和平唯有通过实力与牺牲。"
