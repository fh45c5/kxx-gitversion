 USA.811.d.noone:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，然而在平民党内，左派、民粹派与进步阵营在关键议题上各自作出了让步，以换取一个能够继续前进的统一名义。然而如今两派的政治力量难以决定出真正决定性的优势，因此挑选一位大部分人都能接受的折中选择成为了当前的唯一出路。第一位人选是诺曼·托马斯，这位温和的社会主义者被认为是更加令人满意与能接受的左派人选。相对的，布朗森·卡廷作为朗主义的支持者，他也成为了一名热门的总统候选者。最终，总统提名得到确认..."
 USA.811.d.aiken:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，然而在平民党内，左派、民粹派与进步阵营在关键议题上各自作出了让步，以换取一个能够继续前进的统一名义。然而如今两派的政治力量难以决定出真正决定性的优势，因此挑选一位大部分人都能接受的折中选择成为了当前的唯一出路。第一位人选是诺曼·托马斯，这位温和的社会主义者被认为是更加令人满意与能接受的左派人选。相对的，布朗森·卡廷作为朗主义的支持者，他也成为了一名热门的总统候选者。此外，作为一名进步主义者，新英格兰的政治家乔治·艾肯也收到了相当多平民党成员的追捧。最终，总统提名得到确认..."
 USA.811.d.upton:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，然而在平民党内，左派、民粹派与进步阵营在关键议题上各自作出了让步，以换取一个能够继续前进的统一名义。然而如今两派的政治力量难以决定出真正决定性的优势，因此挑选一位大部分人都能接受的折中选择成为了当前的唯一出路。第一位人选是诺曼·托马斯，这位温和的社会主义者被认为是更加令人满意与能接受的左派人选。相对的，布朗森·卡廷作为朗主义的支持者，他也成为了一名热门的总统候选者。而厄普顿·辛克莱，则因他的“终结贫困”计划而闻名，也为他吸引了相当多的人气。他失败的1934年州长竞选生涯也使得他更加有意争夺总统提名。最终，总统提名得到确认..."
 USA.811.d.both:0 "在大会即将落幕时，平民党的竞选纲领终于得到了确定，然而在平民党内，左派、民粹派与进步阵营在关键议题上各自作出了让步，以换取一个能够继续前进的统一名义。然而如今两派的政治力量难以决定出真正决定性的优势，因此挑选一位大部分人都能接受的折中选择成为了当前的唯一出路。第一位人选是诺曼·托马斯，这位温和的社会主义者被认为是更加令人满意与能接受的左派人选。相对的，布朗森·卡廷作为朗主义的支持者，他也成为了一名热门的总统候选者。而厄普顿·辛克莱，则因他的“终结贫困”计划而闻名，也为他吸引了相当多的人气。他失败的1934年州长竞选生涯也使得他更加有意争夺总统提名。此外，作为一名进步主义者，新英格兰的政治家乔治·艾肯也收到了相当多平民党成员的追捧。最终，总统提名得到确认..."
