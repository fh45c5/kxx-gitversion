 nimatron.26.a:0 "这下艺术真能要人命了"
 nimatron.27.t:0 "《玉苒厦之书》终卷发表"
 nimatron.27.d:0 "以威廉·S·萨德勒、莉娜·K·萨德勒夫妇为首的“论坛”，近日正式发布了《玉苒厦之书》的终卷第四卷。“论坛”自1924年起陆续推出了全书的四卷，但却始终拒绝承认是该书的创作者，坚称其内容直接源自上界的高等存在——1911年，萨德勒在治疗某位睡眠障碍患者时首次接触到了这一神秘存在。\n\n据萨德勒等亲历者的描述，那位患者在无意识状态下遭未知实体“附身”。经过数次诊疗后，该实体开始向萨德勒及速记员传递信息。令人困惑的是，患者本人虽在清醒时对诊疗过程毫无记忆，但交流过程中其人格特征、语言风格及思想体系确确实实发生了彻底的转变。萨德勒用了催眠术、精神分析等手段验证患者的说法，最终不得不承认：这些超越人类认知维度的信息不可能源自患者本身。最新面世的书卷正是基于这些跨越维度的对话编纂而成，不过，“论坛”成员强调他们仅仅是信息的接收者，是上界的存在通过新的交流人格直接将其传递过来的。“论坛”最初仅有三十人，经过岁月流转，现已扩展至四百余众，其吸纳成员不设专业、宗教、思想或意识形态的门槛，全凭对玉苒厦的兴趣。本次的最终卷着重以玉苒厦的视角重构耶稣生平，既保留了《圣经》的记载，又提出了独到的诠释：在玉苒厦宇宙观中，耶稣是七万神子之一，且是唯一在地球显圣者，其余神子则分布于构成玉苒厦宇宙的其它世界。\n\n玉苒厦理论认为，地球只是灵魂轮回的中转站，所谓上界存在实为其它星球的高等文明，其致力于联系玉苒厦宇宙中迷失的地球区域。虽然在美国宗教哲学领域仍属边缘学说，但近年的社会动荡促使越来越多人转向了这一奇说，其知名度也逐步提升。这套遭传统宗教团体批评为封闭晦涩的奇特思想，究竟会发展成蔚为大观的思潮，还是湮没无闻，唯有时间能给出答案。"
 nimatron.27.a:0 "有趣"
 nimatron.28.t:0 "1936年印第安纳波利斯500英里大奖赛"
 nimatron.28.d:0 "本年度国际500英里汽车大奖赛（第26届赛事，自1911年创办以来）在印第安纳波利斯赛车场盛大举行，堪称年度最受瞩目的赛车盛事。这条全长2.5英里、拥有9度倾斜角的传奇赛道素以极速著称，今年主办方特实施限速安全措施。来自加州河滨市的雷克斯·梅斯以10圈平均时速119.644英里（虽低于去年杆位成绩）连续第二年摘得杆位，与圣安东尼奥车手埃尔伯特·“宝贝”·斯塔普、底特律车手切斯特·“切特”·米勒共同组成周日正赛头排发车阵容。受今年油箱容量缩减影响，这场耐力赛注定成为消耗战。杆位发车的梅斯起步领跑，却因油门故障遗憾退赛。第九位发车的威尔伯·肖随即接管领先，但漫长进站停靠使其优势尽失，比赛演变为两届冠军路易斯·迈耶与泰德·霍恩的双雄对决。战至350英里处，迈耶最后一次进站耗时40秒，令其落后霍恩40秒。然风云突变——迈耶在第146圈完成关键超越后一骑绝尘，最终以油箱仅剩“一品脱半”燃油的惊险状态冲线夺冠，完赛时间较去年凯利·佩蒂洛的纪录快7分钟。颁奖仪式上，这位传奇车手别出心裁索要酪乳解渴，并获颁博格华纳公司赞助的全新奖杯及当日领跑车——帕卡德120型座驾。尽管油箱容量受限，本届赛事仍创下500英里赛历史最快纪录，更实现近十年来首次零死亡事故的里程碑。"
 nimatron.28.a:0 "引人入胜"
 nimatron.29.t:0 "美国改装车大赛的诞生"
 nimatron.29.d:0 "当老比尔·弗朗斯在流线酒店完成那场变革性会议后，他叼着粗雪茄露出胜利微笑——这位精明的赛车推广人刚刚整合佛罗里达州代托纳的地下赛车江湖，将各路草莽豪杰收编为名为全国运动汽车竞赛协会的庞然大物。从陆军退役车手、私酒贩子到纨绔子弟，这支汇聚全美飙车高手的联盟正在缔造北美史上最震撼的赛车传奇。这个诞生于代托纳沙滩的疯狂构想，将昔日走私犯在禁酒县边境练就的改装车技艺，转化为职业赛道的轰鸣声浪。弗朗斯不仅制定统一赛事规则，更规划在阿拉巴马州塔拉迪加等地铺设全新椭圆形赛道，甚至有意将印第安纳波利斯赛车场纳入版图。随着代托纳超级赛道的沥青路面在阳光下延伸，吉姆·罗珀、鲍勃·弗洛克等先驱车手驾驶着经过战火淬炼的改装战车，将美国人对速度的痴迷推向新时代。从1920年代走私犯在沙滩试车的秘密狂欢，到1940年代职业联赛的横空出世，代托纳始终是美利坚赛车文化的圣殿。当小比尔·弗朗斯继承父亲衣钵，当红拜伦的66号赛车在弯道划出完美弧线，这个由私酒贩子的逃亡技艺演化而来的运动，正随着民用汽车工业复苏而驶入千家万户。或许正如弗朗斯父子所愿，风驰电掣的赛车与惊心动魄的撞车场面，将继续为战后美国人提供最纯粹的肾上腺素盛宴。"
 nimatron.29.a:0 "车开得最快不一定赢，不服输的人才是赢家"
 nimatron.30.t:0 "基督教工人的地位"
 nimatron.30.d:0 "基督教与美国的左翼思潮之关系源远流长，它不仅孕育了贝拉米主义、贵格会主义、下水道社会主义、进步主义等思想，还是以原始无政府主义者大卫·亨利·梭罗为代表的一众早期左翼人物的思想源泉。时至今日，仍有众多基督教社会主义团体活跃于政治舞台：既有社会爱国派的诺曼·托马斯、秉持基督教人文思想的宾夕法尼亚州前进步州长吉福德·平肖、詹姆斯·伦肖·考克斯神父及其失业者党等重量级人物，也有理查德·T·埃利、约西亚·斯特朗、华盛顿·格拉登、沃尔特·劳申布施等人首倡的社会福音运动，还包括查尔斯·欧文·莱斯、卡尔·亨斯勒、乔治·巴里·奥图尔的天主教激进联盟，以及多萝西·戴、彼得·莫林的激进天主教工人运动等团体——这些组织恪守信仰的指引，又以世俗的方式推进革命，既不把宗教理念强加于人，也避免信仰诉求稀释革命目标。不过说到底，宗教还是人民的鸦片，这些团体天然就是我们某些极端派成员的敌视对象，因此我们须明确对待基督教等宗教的整体立场：是支持天主教工人运动或社会福音这类团体，允许宗教参与革命，还是维持现状任其发展，同时坚持世俗化路线，又抑或与这些穿着无产阶级外衣的教士彻底划清界限？"
 nimatron.30.a:0 "大力支持基督教社会主义"
 nimatron.30.b:0 "同基督教工人合作，但不承认教会"
 nimatron.30.c:0 "不理他们，坚持世俗路线"
 nimatron.30.e:0 "追求激进无神论，给我通通取缔"
 nimatron.31.t:0 "人造语言与无产阶级语言学"
 nimatron.31.d:0 "人造语言（如世界语与国际语）在全美公社及基层组织中日益普及，尤以太平洋西北部与东北部的无政府主义团体为甚。此类语言旨在通过构建全人类通用语消除文化隔阂——至少理念如此。目前使用的国际辅助语言主要有两种：其一是1887年波兰和平国际主义者L·L·柴门霍夫创制的著名世界语；其二为美利坚国际辅助语言协会新近研发的国际语，该语言融合意大利语、西班牙语、法语等罗曼语系元素及希腊语，使相关语种使用者可部分理解，其设计初衷是为改良世界语对初学者而言过于陌生的核心缺陷，同时兼顾美国常见移民群体的语言背景，只不过部分借鉴了由波罗的德意志学者埃德加·德·瓦尔发明并至今仍在使用的西方语。\n\n这项语言运动获得全美左翼人士支持，包括劳工教育家兼国际女装工人工会代表马克·斯塔尔、科幻作家达拉斯·麦科德·“麦克”·雷诺兹、科幻文学与电影之父福里斯特·詹姆斯·阿克曼、洛夫克拉夫特式无政府主义者兼巴哈伊灵修导师小詹姆斯·费迪南德·莫顿等文化界人士。学界与政论界的跨领域支持者阵容亦日益多元：同性恋权益活动家兼先锋派作曲家卢·哈里森、女权运动家波琳·亚当斯、巴哈伊灵修导师玛莎·鲁特、艾格尼丝·鲍德温·亚历山大、莱奥诺拉·阿姆斯特朗、首代科幻超级粉丝默特尔·丽贝卡·史密斯·格雷·诺兰（笔名莫罗霍，其推动科幻文学与世界语理念双普及）、海洋藻类生物学家拉尔夫·A·卢因（曾与语言学家艾薇·凯勒曼·里德合作出版世界语版《小熊维尼》）、意大利裔语言学家马里奥·佩等。历史人物如美国首位社会主义总统候选人查尔斯·霍雷肖·马切特、密苏里州前众议员理查德·巴托尔特亦属先驱行列。尽管人造语言理念令部分群体却步，但对另一些人而言，这象征着通向全球团结与理解的潜在路径——是国际主义理想的具体实践。我们是否应当支持此项语言工程，推动世界语、国际语及其衍生语种（如世界语2号、伊多语）作为辅助语言全国普及，并鼓励国际盟友效仿？抑或视其为公社群体的幼稚幻想，专注本土要务？"
 nimatron.31.a:0 "支持世界语、国际语及其它国际主义计划"
 nimatron.31.b:0 "咱们别把钱浪费在这种无聊的事情上"
 nimatron.32.t:0 "组建骆驼兵团的第二次机会？"
 nimatron.32.d:0 "1836年，美国陆军的乔治·H·克罗斯曼少校，从其在佛罗里达参与美印战争的经历中确信骆驼可作驮兽之用，遂鼓动战争部运用骆驼从事运输。大约在1848年左右，亨利·C·韦恩少校——亦即后来骆驼兵团的首任指挥官——展开了一项更为详尽的研讨，并向战争部建议引进骆驼。韦恩的观点与当时密西西比州参议员杰弗逊·戴维斯不谋而合，然戴维斯在试图争取同僚们支持此事上未能如愿，直至1853年富兰克林·皮尔斯总统任命他为战争部部长，事情才出现转机。当美军急需在干旱及沙漠地带遂行任务时，总统与国会方才开始认真对待这一设想，并在戴维斯于1855年就该事发布正式报告后向其拨款，使其得以在德克萨斯州的贝尔德堡组建了美国陆军骆驼兵团，这在一定程度上得益于爱德华·菲茨杰拉德·比尔等人的支持，据说比尔在最初探索死亡谷时便萌生了整个骆驼军团的构想，并在与基特·卡森同行期间自行想出了这一方案，随后说服其友人大卫·迪克森·波特将其上报至战争部门，而罗伯特·E·李和詹姆斯·布坎南等人也对此提供了支持。\n\n骆驼兵团最终在美国内战前后为联邦政府所用，且在内战期间亦为南方邦联所采用。然而，该兵团从未脱离实验阶段。尽管还曾被用作与暹罗国王会晤时的外交工具，但这些牲畜被证明难以驾驭且性情顽固，同时还对美国西南部的本土环境造成了严重破坏，且进口成本高昂，因主要使用的单峰驼原产于阿拉伯半岛和北非，加之美国人从未像奥斯曼帝国和阿拉伯的驭驼者那样真正掌握驭驼技艺，进一步导致了其在几次使用中的低效乃至灾难性后果。然而，骆驼如今已成为西南部地区身份认同的一部分，部分原因是仍有一些野生骆驼群在该荒芜之地徘徊，亚利桑那的民间传说中还提到了一种血红色、骨骼如漂白骨的神秘骆驼生物——红鬼，而不远万里来到美国训练我军如何照料和驾驭引进的阿拉伯骆驼的奥斯曼叙利亚骆驼驭手希·乔利在当地人眼中也已成为民间英雄。鉴于现代牧业技术和手段的进步，一些人认为我们或许可以再次借助骆驼的力量，以防世界大战的威胁使我们重返墨西哥、非洲或其他未知之地，而英国的右翼政治家兼兽医阿诺德·利斯也已在彼岸展示了其民兵成功运用骆驼的事例。那么，美国的骆驼实验究竟将何去何从呢？"
 nimatron.32.a:0 "我们可不能再在这上栽跟头了"
 nimatron.32.b:0 "再给他们拨点钱，训练新的骆驼兵团！"
 nimatron.33.t:0 "盛大欢送"
 nimatron.33.d:0 "当一纸征兵令再度下达全国上下，士兵间普遍存在的士气低落现象便成了政府的一大难题。由于国内的适龄男性多参加过内战，军中消极应征与拒服兵役之人数激增至惊人水平。不过，战争动员局在哈林区周边的俱乐部里，竟意外发现了扭转局面的秘密武器——著名影星、歌手兼乐队领班卡贝尔·卡洛威，亦即乐迷口中的凯比，如今有了一份新的差事，那就是为即将开赴前线的部队进行慰问演出。卡洛威早年在面向各个族裔观众的黑与棕俱乐部崭露头角，期间结识小号大师路易斯·阿姆斯特朗并习得其独创的演唱风格，而士兵们也格外欢迎这种活力四射的摇摆歌舞，将其视为暂时摆脱战争阴云的精神良药。身着标志性黄色灯笼裤的“嗨嘀嗬先生”演绎着《瘾君子明妮》与《世界尽在掌中》等经典曲目，用充满律动的表演不断提醒着士兵：待到荣归故里之时，盛大的庆功派对必将如约而至。"
 nimatron.33.a:0 "演出有谁不爱呢?"
 nimatron.34.t:0 "电气人和电火花！"
 nimatron.34.d:0 "这位烟不离手的铁巨人身高六英尺十英寸，满嘴俏皮话，堪称新时代的电动机器人。电气人最初由西屋公司工程师们构想而成，旨在向大众展示其电声人技术，可惜因三十年代后期的动荡局势而推迟亮相。作为1928年面世的老款机器人赫伯特·电声人的后继者，电气人的躯体以铝板替代墙板打造，头部与双手则采用同材质铸件构成。其内部塞满了从电熨斗、咖啡壶、华夫饼机拆解的线缆以及真空吸尘器的轮子，堪称业余拼装的杰作，成为工程师与公众共同的技术骄傲。通过巧妙的电声人系统操控，这位电动机器人虽不能真正理解指令，但若以三一二音节结构发出问询或命令，便能指挥其行动、回答问题甚至表演派对戏法。电气人不仅烟不离手，还能拿“俏妞儿”和其他电器插科打诨。\n\n随着三十年代动荡落幕而世界仍充满敌意，电气人的亮相既是为了重振现代美国例外论精神，亦是为世人增添乐趣。推迟发布期间最妙的改进，莫过于为它配了个名为电火花的机器狗伙伴。这只以工程师的苏格兰梗犬邦妮为原型的小狗能四处走动、坐下、转头摇尾，还能发出各种机械犬吠声。与外形骇人的电气人不同，电火花成功俘获了全年龄层观众的喜爱。自公开亮相以来，这对搭档已开启全国巡展，参演多部电影，在这个风云万变的世界里成为技术进步的最佳注脚。"
 nimatron.34.a:0 "我去，他能说话！"
 nimatron.35.t:0 "美国至暗之时刻，圣经瘟疫之降临"
 nimatron.35.d:0 "当美利坚合众国深陷内战泥潭——从工团主义革命者到休伊·朗的一分钟人民兵，再到三K党阴险的本土主义激进分子——在这个于混乱浪潮中挣扎求存的国度，美国民众的普遍苦难已被全然忽视。沙尘暴的毁灭性打击及其带来的饥荒仍在折磨美国人民，而在这片曾引以为傲的稳定土地上，一个昔日敌人的复苏却在街头无政府状态中被大量掩盖。沙尘暴对美国中西部造成毁灭性打击后，当成群蝗虫随之聚集，许多人恐惧地发现往日的恐怖已然苏醒，即将再度肆虐美国民众。这些由草食性蛆虫转化而成的蝗虫，从独居温顺的食草者蜕变为群居杂食的生物——它们曾在1870年代席卷中西部农场，如今又大规模归来，啃食这片昔日国家粮仓被沙尘席卷后仅存的作物。\n\n这群昆虫如野火般蔓延草原，吞噬一切：从庄稼到牲畜饲料，甚至有报道称连人们身上的衣物、田边的栅栏都未能幸免。这种来自过去的灾祸曾被认为早已灭绝。在1870年代西进运动时期，蝗灾始终是农业的持久威胁，其中1874年最大蝗群数量超过十二万亿只，形成的噬咬翅膀云层曾覆盖相当于加利福尼亚州面积的天空。有关这些蝗群的记忆——其规模之巨有时能让村镇在它们过境时连日不见天日——读来更像末日预言而非真实历史，不幸的是美国人民如今正再度亲历这种恐怖。\n\n最严峻的问题在于：尽管该蝗虫种群在上世纪初已彻底灭绝，但它们的消失并非人力所为，而是某种导致种群完全崩溃的自然机制所致。如今卷土重来的虽非同一物种，其危险性却不遑多让（尽管规模尚不及当年）。军方已采取临时措施驱除虫害，国民警卫队近期发明了配备火焰喷射器的列车——沿着轨道缓慢行进，用烈焰焚烧虫群。此外也尝试了其他方法：用炸药清除藏匿大量蝗虫的灌木丛与田地虽成本高昂却不失为趣谈，但若不能研发出特效杀虫剂或更有效的应对措施，蝗灾或许将成为美国人民在这黑暗岁月中必须面对的又一场灾难。"
 nimatron.35.a:0 "连虫子都要造反"
 nimatron.36.t:0 "海埃斯玛罗伯爵"
 nimatron.36.d:0 "瑞典的福尔克·贝尔纳多特伯爵携夫人埃丝特勒·贝尔纳多特前往纽约普莱森特维尔镇探望岳父海勒姆·E·曼维尔时，再度成为纽约媒体竞相追捧的焦点。在曼维尔家族那座名为海埃丝玛罗的宽敞庄园里，尽管主人以美酒佳肴盛情款待，但受当前政局影响，高墙内的谈话始终笼罩着凝重气氛。媒体面前虽强作从容，贝尔纳多特在此次美国之行中一直忧心忡忡，短期内恐怕不会再次造访。目睹纽约街头罢工者与警察冲突的动荡景象，这位瑞典亲王私下建议曼维尔迁居加拿大，但老曼维尔对此显得极为抗拒。\n\n尽管美国上空阴云密布，身为童军运动忠实拥护者及瑞典童军联盟代表的贝尔纳多特，仍抽空拜访了美国童军组织，参与多项活动，并就严寒环境生存技巧进行指导。面对列队童军，伯爵慨言祝愿美国永葆和平自由之光，并坚信拥有如此朝气蓬勃的年轻一代，这个国家的未来必是光明无比。演讲尾声他慨然道：“我们降临人世非为自身幸福，或许是为他人缔造幸福。”\n\n在或许将是永别的离美前夕，福尔克以一贯的率性作风，横跨国土探访了黑脚族保留地——这是他自少年时代听闻印第安传说后就魂牵梦萦的夙愿。通过与部落长老会谈、与接待家庭共同生活，福尔克最终为美国之行画上圆满句号。他为自己能亲临这个耳闻已久的部落而深感荣幸，毫不吝啬地向他们乃至整个美国献上了诚挚赞颂。"
 nimatron.36.a:0 "哇，好气派！"
 nimatron.37.t:0 "支持美利坚印第安协会"
 nimatron.37.d:0 "随着社会环境在政府引导下愈发包容，组织复兴浪潮正席卷而来，美利坚印第安协会近期日益引人注目，其受欢迎程度已超过自1911年成立以来的任何时期。该协会主要植根于泛印第安主义思想，诞生于宾夕法尼亚州卡莱尔市的美国印第安工业学校与弗吉尼亚州汉普顿市的汉普顿农工学校——这两所保留区之外的东部寄宿学校培养了协会的大多数创始人。受同期少数族裔民权组织（如全国有色人种协进会）成立的启发，美利坚印第安协会数十年来始终致力于为北美各族原住民争取更多权利与更好生活条件，倡导进步主义理念，并独具匠心地推广泛印第安主义。\n\n该协会的创始成员与早期领袖涵盖众多美洲原住民学者与政治人物，包括桑蒂达科他人查尔斯·伊斯门博士及其兄弟约翰·伊斯门牧师、阿拉帕霍人舍曼·库利奇牧师、亚瓦派-阿帕奇人卡洛斯·蒙特祖马博士、奥马哈人托马斯·斯隆、塞尼卡人亚瑟·帕克、奥格拉拉拉科他人亨利·斯坦丁·贝尔、皮奥里亚人查尔斯·埃德温·达格内特、威斯康星奥奈达人劳拉·科内留丝·凯洛格、奇佩瓦人罗莎·拉弗莱什、本杰明·卡斯韦尔和玛丽·路易丝·鲍蒂诺·鲍德温、黑脚族人威廉·哈兹利特、欧塞奇人哈里·科佩、奇克索与切罗基混血儿查尔斯·卡特、波塔瓦托米人埃玛·詹森、塔斯卡罗拉人霍华德·甘斯沃思、温内巴戈人亨利·罗·克劳德、克拉马斯人罗伯特·德·波、奥农多加人查尔斯·多克森等，甚至得到非原住民支持者如人类学家费耶特·艾弗里·麦肯齐博士的协助。无论过去还是现在，这或许都是史上最伟大的美洲原住民领袖盛会，所有人既致力于泛印第安团结，又始终尊重各部落与民族的独特性，坚定捍卫文化主权与自决权；所有人皆立志改善北美全体居民的生活，尤其为这片土地上最受压迫的群体（不仅包括美国的原住民，也包括加拿大及南方边境的原住民）不懈奋斗。\n\n深受美国进步主义时代思潮及贝拉米堂兄弟所创人民党（如今还有乔治·诺里斯、诺曼·莱蒙德等政治家传承其精神）的影响，该协会正为改善美洲原住民境遇而积极寻求支援。鉴于我国政府对其总体目标的支持已根基稳固，如果我们能调配更多资金、政治力量及人力资源，将站在助力他们的独特位置。特别是面对埃尔伍德·唐纳之流意图玷污泛印第安主义理念的污名化行径，该协会当代领袖如劳拉·科内留丝·凯洛格与亚瑟·卡斯韦尔·帕克博士已做好准备，迎接我们所能给予的一切支持，共同推进其崇高事业。即便我们无法以官方名义直接援助，也仍将允许他们继续坚定前行。"
 nimatron.37.a:0 "让我们同心协力，让国家重获新生。我们誓将全力支持"
 nimatron.37.b:0 "远远支持便可，避免投入我们目前无法承受的官方资源"

