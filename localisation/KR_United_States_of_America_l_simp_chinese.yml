 USA_navy_nimitz_party:0 "海军军政府（太平洋舰队派）"
 USA_navy_nimitz_party_long:0 "海军军政府(Navy Junta)\n§g随着太平洋舰队在西海岸获得自己的领地，尼米兹可以在此有效建立他的独裁统治§!"
 USA_social_democrat_tpp_party:0 "真爱国者党 - 劳工派"
 USA_social_democrat_tpp_party_long:0 "真爱国者党（劳工派）(True Patriot Party (Labor Wing))\n§g在真爱国者党这台庞大机器中，最令人费解的齿轮莫过于这个规模有限的派系。它由那些残余的非工团主义工会组成，他们抛弃了尊严，试图在这个新政党内寻求合作。由新任美国劳工联合会主席吉米·霍法领衔，这位卡车司机工会的巨头承诺，既要肃清劳工运动中的社会主义渗透，又暗中谋取私利。§!"
 USA_social_conservative_tpp_party:0 "真爱国者党 - 自由派"
 USA_social_conservative_tpp_party_long:0 "真爱国者党 - 自由派(True Patriot Party (Liberal Wing))\n§g这些人都是思想更开明的政客和新爱国者党的支持者。这些人享受着新政权所带来的好处，但是他们仍然怀念着旧美国的民主制，他们承诺在未来会想法让旧式民主重归美国。§!"
 USA_authoritarian_democrat_tpp_party:0 "真爱国者党 - 温和派"
 USA_authoritarian_democrat_tpp_party_long:0 "真爱国者党 - 温和派(True Patriot Party (Moderate Wing))\n§g作为真爱国者党的主体，温和派代表了被裹挟进真爱国者党机器的主流群体。这些由前政党中背离的保守派组成的政客们，正试图在这个新政党体系中站稳脚跟。§!"
 USA_paternal_autocrat_tpp_party:0 "真爱国者党 - 麦克阿瑟派"
 USA_paternal_autocrat_tpp_party_long:0 "真爱国者党 - 麦克阿瑟派(True Patriot Party (MacArthurite Wing))\n§g这些人是党内麦克阿瑟的铁杆支持者。在这位已故将军短暂的统治期间，他们对他忠心耿耿。至于他们能否在重建过程中维系国家的统一，仍有待观察。§!"
 USA_national_populist_tpp_party:0 "真爱国者党 - 极端民族派"
 USA_national_populist_tpp_party_long:0 "真爱国者党 - 极端民族派(True Patriot Party (Ultranationalist Wing))\n§g这些人把“爱国者”这个词提升到了新的高度。该派系主要由党内的极右翼边缘分子和激进青年团体组成，这些“真爱国者”主张对那些不服从新政府的人进行铁腕甚至更强力的镇压，他们寻求的是一个只有美国独占天下的世界。§!"
