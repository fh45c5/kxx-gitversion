 USA.705.d.willkie:0 "由于温德尔·威尔基总统的身体状况已经不适合继续未来的任期，党内决定推举新的总统候选人。如今我们有六位预备候选人：阿尔本·W·巴克利，科德尔·赫尔，哈皮·钱德勒，哈里·杜鲁门，斯科特·卢卡斯与斯特罗姆·瑟蒙德。代表们将挑选谁呢？"
