#给其他国家留的
ustates.250.t:0 "加入美洲国家联盟？"
 ustates.250.d:0 "[From.GetNameDefCap]已派遣特使邀请[Root.GetNameDef]加入美洲国家联盟。从本质上来讲，美洲国家联盟的性质并非纯粹的“国家联盟”，而是政治居于美国指导下的美洲国家相互交流合作的平台。美国政府将为我国独立提供保障，提供军事与经济顾问协助我们的内政建设；作为回报，我们需要向他们开放军事通行权、提供进出口优待。尽管许多人认为此举会将我们与美国绑定的过于紧密，平心而论，这笔买卖是值得的——考虑到外交中立政策，我们也很难在美洲以外的地方找到盟友。那么反过来想，既然美国愿意为我们提供安全保障，我们真的还需要其他国家来维护我国安全吗？"
 ustates.250.a:0 "当然，我们应该加入联盟"
 ustates.250.b:0 "这不符合我们的利益"
 ustates.251.t:0 "[FROM.GetNameDefCap]拒绝了"
 ustates.251.d:0 "或许他们不希望让国家政策与美国利益过分一致，[From.GetAdjective]政府已经谢绝了我们的邀请。"
 ustates.251.a:0 "这是他们的损失！"
 ustates.252.t:0 "来自美利坚的工业援助！"
 ustates.252.d:0 "凭借“美洲国家联盟”建立的纽带，[From.GetNameDef]为我们送来了工业援助，这般善举使两个国家从未如此紧密地彼此团结在一起。当然，[Root.GetAdjective]政府内部有人认为这只是美利坚帝国主义的一种变体，美国越是迎合我们的需要，对我国的控制力也就越强……可是当下我们还有其他选择吗？"
 ustates.252.a:0 "我们感激你们的帮助"
 ustates.253.t:0 "[FROM.GetNameDefCap]加入联盟"
 ustates.253.d:0 "愉快地接受我国的保护与指导后，[From.GetNameDef]政府已同意加入美洲国家联盟"
 ustates.253.a:0 "很好！"
 ustates.254.t:0 "从联盟除名"
 ustates.254.d:0 "出于显而易见的原因，我们在美洲国家联盟的成员资格已不再生效。"
 ustates.254.a:0 "那就这样吧"
 ustates.255.t:0 "联盟红利"
 ustates.255.d:0 "美洲国家联盟成员国的数量不断发生变化，我们从中取得的红利也不断更新。"
 ustates.255.a:0 "好的"
 ustates.256.t:0 "美利坚帝国主义"
 ustates.256.d:0 "正如许多人先前担心的那样，美国的影响力正逐渐投射到[Root.GetAdjective]政府的方方面面。预计短短几个月后，他们将彻底控制我国政府。希望维持独立性的唯一的选择就是请他们出去，不再参与美洲国家联盟的活动……但美国人肯定会据此向我们施压的。"
 ustates.256.a:0 "当然，我们必须有所抵抗！"
 ustates.256.b:0 "我们无能为力"
 ustates.257.t:0 "来自[From.GetAdjective]的抵抗"
 ustates.257.d:0 "[From.GetAdjective]政府迈出了愚蠢的一步，在意识到我们准备发动政变的打算后，他们企图开除自己能找到的所有亲美官员，通过退出美洲国家联盟的方式逃避自己的命运。当然，此举反而给了我们向该国采取行动的借口……只要我们愿意的话。"
 ustates.257.a:0 "他们还希望得到什么呢？"
 ustates.258.t:0 "美国傀儡政权"
 ustates.258.d:0 "事情已经发生：正统的[Root.GetAdjective]政府已被亲美政权取代，我们正式沦为[From.GetNameDef]的殖民地。"
 ustates.258.a:0 "欢迎我们的新宗主国"
 ustates.260.t:0 "[From.GetAdjective]顾问团？"
 ustates.260.d:0 "鉴于我们是面对着同一群敌人的战友，[From.GetNameDef]提议派遣军事顾问团辅助我方工作，并建议双方在今后的军事行动中更加密切地联合起来。"
 ustates.260.a:0 "当然！"
 ustates.260.b:0 "他们可以好生留着自己的所谓“顾问”"
 ustates.261.t:0 "[From.GetNameDefCap]拒绝了"
 ustates.261.d:0 "因为怀疑我们的顾问是间谍，或者字面意义上地不信任我们的动机，[From.GetAdjective]政府已经拒绝了我们的提案。"
 ustates.261.a:0 "这是他们的损失"
 ustates.262.t:0 "[From.GetNameDefCap]同意了"
 ustates.262.d:0 "[From.GetAdjective]政府轻轻松松就答应了我们的提案，顾问团已经在赶去支援的路上了。"
 ustates.262.a:0 "棒极了"
 ustates.279.t:0 "[From.GetNameDefCap]希望加入协约国"
 ustates.279.d:0 "[From.GetNameDefCap]大使求见国王和首相，希望能让[From.GetNameDefCap]加入协约国阵营。我们应该接受美国人的提议吗？"
 ustates.279.a:0 "当然！我们欢迎他们"
 ustates.279.b:0 "我们不需要他们"
 ustates.280.t:0 "[From.GetNameDefCap]拒绝"
 ustates.280.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 ustates.280.a:0 "他们做了个糟糕的决定"
 ustates.281.t:0 "[From.GetNameDefCap]想要加入帝国公约"
 ustates.281.d:0 "[From.GetNameDefCap]已派遣大使觐见皇帝陛下与总理，希望拥入帝国公约的怀抱。我们应该接受这个美国人的提案吗？"
 ustates.281.a:0 "当然！我们欢迎他们"
 ustates.281.b:0 "我们不需要他们"
 ustates.282.t:0 "[From.GetNameDefCap]拒绝"
 ustates.282.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 ustates.282.a:0 "他们做了个糟糕的决定"
 ustates.283.t:0 "[From.GetNameDefCap]寻求同俄罗斯结盟"
 ustates.283.d:0 "[From.GetNameDefCap]大使求见总理，希望在美国与俄罗斯间缔结联盟。我们应该接受美国人的提案吗？"
 ustates.283.a:0 "当然！我们欢迎他们"
 ustates.283.b:0 "我们不需要他们"
 ustates.284.t:0 "[From.GetNameDefCap]拒绝"
 ustates.284.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 ustates.284.a:0 "他们做了个糟糕的决定"
 ustates.300.t:0 "军事研究"
 ustates.300.d:0 "我们正将国内最优秀的科学家与企业领袖，投入到当下最需要关注的领域：枪支、火炮、坦克和军事理论革新。我们应该将其中哪部分作为开发重点呢？"
 ustates.300.a:0 "现代化步枪"
 ustates.300.b:0 "现代化炮兵"
 ustates.300.c:0 "现代化坦克"
 ustates.300.e:0 "先进的理论"
 ustates.538.t:0 "七月四日！"
 ustates.538.d:0 "[USA_fourth_of_july_event_desc]"
 ustates.538.a:0 "为美利坚欢呼！"
 ustates.538.d.1937_CSA:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。尽管海伍德总统希望在费城的独立厅外发表演讲，但他的工作人员劝说他放弃了这个计划。因此，海伍德转而选择在地方工会向聚集在一起的人群发表讲话。尽管场地布置相对简陋，但观众们都全神贯注地观看着。海伍德强调，美国人民曾因贪婪与无人关注而怒火中烧，而如今，人民终于团结一心，一同挣脱了锁链。就如同《独立宣言》中列出的英国政府的27条罪行，在热烈的掌声中，海伍德宣读了27条联邦政府对现代工人犯下的罪行。最后，他宣布美利坚联合工团将继续为一个新美国而战斗！"
 ustates.538.d.1937_TEX:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。今日，休伊·朗总统在欢呼的支持者面前发表了演讲。尽管一分钟人一直在巡视着可能出现的刺客，但群众对演讲的热情丝毫未减。朗指出，远在1776年，美国人正忍受着腐败的英国寡头的暴政，他们背后则是英军无情的刺刀。尽管前路黯淡，希望渺茫，美国的爱国者们依然揭竿而起，赶走了英国人和他们的走狗。而此时此刻恰如彼时彼刻，朗如此说到。他随后强调，如今的美国人仍需对贪婪的精英阶层和他们的走狗保持警惕，而一分钟人也会像过去一样，随时准备着为拯救美利坚而战！他话音刚落，烟花就在天空中绽放，人群也随之开始欢呼。"
 ustates.538.d.1937_PSA:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。今天，[Root.GetLeader]总统在美国临时国会发表演讲。他说，1776年时，为保护美国人的权利，大陆会议向暴政发起了战争，因而成为了许多人心中的自由灯塔。他特意强调，颁布《独立宣言》的是民选产生的议会，而非什么将军或僭主。他接着说道，今天，美国发觉自己再度与暴政作战，再度与试图熄灭自由之火的力量作战。最后，总统宣布：一旦东部的独裁者们被尽数击败，重建的宪政政府便将再度实现国父们的梦想，在“自海至光辉之海”的土地上夺回美国人的生命权、自由权、追求幸福的权力。"
 ustates.538.d.1937_NEE:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。虽然许多批评者指出，在加拿大军事占领时庆祝独立日相当讽刺，但新英格兰临时政府试图通过举办一场难忘的独立日庆祝活动，以此摆脱自己在人们心中作为加拿大傀儡的印象。在邦克山战役纪念碑前，[Root.GetLeader]总统回顾了美国人民在这里曾为保护自由与繁荣做出的牺牲，指出他们在此勇敢地等待着，直到敌人逼到前头，才开始倾泻他们为数不多的子弹。他还强调美国人和加拿大人现在是平等的伙伴与兄弟，而美利坚也终将重获自由。"
 ustates.538.d.1937_COR:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。默里总统没有在独立日当天举行任何官方庆祝活动，只发表了一个简短的演讲，承诺美国人民将会摆脱外国暴政；就如同他们的祖先摆脱英国人的压迫一样。在默里的简短讲话后，兰金副总统宣布了他在国难当头时的美好祝愿。尽管默里的官方庆祝活动并不令人印象深刻，但在非官方场合，许多三K党领导人抓住了这个机会，在南方各地举行了大型庆祝活动，充满了南方风格的烧烤、钓鱼、啤酒与焚烧十字架。亨利·福特也在美国独立日这一天举办了声势浩大的庆祝活动，并特意招待了查尔斯·林德伯格，工厂工人也能提前下班（这是极为罕见的情况）；甚至还能得到免费茶点的款待。然而，福特并没有在庆祝活动中燃放烟花；因为烟火中含有终局之战所需的宝贵火药。"
 ustates.538.d.1937_WCC:0 "自今年各种冲突伊始，无数美国民众不切实际的认为暴力将迅速消弭，而政客们也能找到一个无需战争的解决方案。然而，30天的最后期限已过，美国也瞬间被内战所吞噬。今天，美国在内战中迎来了它的建国日。奥马尔·布拉德利为了让西部军指挥中心的部队体验到一场满意的国庆节聚会而费尽心思，甚至不惜突袭丹佛附近的养牛场，为士兵们准备了丰盛的食物。这一切都是为了令部队享受到一次传统的美式团结与庆贺之夜。当战情在落基山脉的另一端隐现之时，布拉德利也只能为随之而来的长期战争做好准备。当7月4日的日落之时到来，西部军指挥中心的勇士们也需要从欢庆活动中调整回来，转而为不可避免战事做足准备，因为现在再多的啤酒、烟花或烤肉也无法阻止这场战争；甚至有许多人都在怀疑西部军指挥中心能否抵挡住我方周围巨兽们的狂暴攻势。"
 ustates.538.d.war_CSA:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。尽管有报道称，由于战争耗日持久，[Root.GetLeader]总统的健康状况堪忧，但在他今天向人民发表演讲时，他仍然精神饱满。他指出，在好年头时，7月4日是个伟大的日子，因为它标志了一场名为美国的实验的开始。尽管革命充满了艰辛与苦痛，但美国人民仍奋勇前进，在灰烬之中建起了一个地球上前所未见的新社会。总统承诺，尽管美国仍处在血腥的内战之中，但这场第二次美国革命将再度在废墟上建立一个新秩序，一个能为所有人带来自由和共同繁荣的新秩序。而国父们所设想的美国，乃至于《独立宣言》所提出的理想也终将成真。"
 ustates.538.d.war_TEX:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。为鼓舞部众，[Root.GetLeader]总统罕见地不顾空袭的威胁举行了一场小型集会。尽管化妆并没能掩饰住总统的疲倦，但[Root.GetLeader]依然像往常一样充满激情的发表演说。他说，战争总是充满着忧虑与苦痛，早在革命时期便是如此，爱国者们也终将得胜。而这回，美利坚自由之子们正为彻底清除那些会伤害美国的人而战斗——芝加哥不守规矩的社会主义者，华尔街的腐败银行家，以及华盛顿专横的军人们。总统指出，7月4日正是爱国者们团结一心的日子。而在上帝的保佑下，哪怕到了战后，爱国者们仍将团结一致。"
 ustates.538.d.war_PSA:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。尽管战事焦灼，但因受临时议会的邀请，[Root.GetLeader]总统还是发表了演讲。在国会各议员面前，总统明白这一演说正被录制给所有人收听。他指出，哪怕局势混乱、动荡不安，美国民主政府仍在继续运作。他接着说，这证明了独裁与暴君是美国为继续存续必须抛弃的事物。哪怕是形势严峻的1776年，美国便不乏愿意为自由而战的人，而到了今天，美国更不乏愿继续为自由而战的人。因为生命权、自由权与追求幸福的权利是超越了时空界限的价值观，美国人现在将为之奋战，也永远会为之奋战。"
 ustates.538.d.war_NEE:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。新英格兰仍是片和平之地，在这死亡与毁灭的时代，就像一片宁静的绿洲。尽管局势依然严峻，又有无数难民涌入，新英格兰的人民仍尽力像往常一样庆祝独立日。[Root.GetLeader]总统向人民发表了演讲，强调新英格兰一直是美国的领头羊，也一直在努力让美国摆脱血腥的内战。同时，他的政府也致力于保证新英格兰不被外敌入侵，并努力解决大萧条的遗留问题。他发誓，不仅对美国而言，在世界范围内，新英格兰都是一座“闪耀的山巅之城”；而当内战结束时，新英格兰也将会引领美国走向更光明的未来。"
 ustates.538.d.war_NEE_kingdom:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。新英格兰仍是片和平之地，在这死亡与毁灭的时代，就像一片宁静的绿洲。尽管局势依然严峻，又有无数难民涌入，新英格兰的人民仍尽力像往常一样庆祝独立日。[Root.GetLeader]向人民发表了演讲，强调新英格兰一直与不列颠尼亚母亲密不可分，也一直在努力让美国摆脱内战、摆脱失败的共和制度。同时，他的政府也致力于保证新英格兰不被外敌入侵，并努力解决大萧条的遗留问题。他发誓，美国革命战争的污点终有一天会被永远抹去，而不久之后，美利坚将重回公平的英格兰之光的笼罩之下。"
 ustates.538.d.war_NEE_lovecraft:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。新英格兰仍是一片和平，就像是一片死亡与混乱中的一片绿洲。尽管局势依然严峻，又有无数难民涌入，新英格兰的人民仍然在努力像往常一样庆祝独立日。洛夫克拉夫特向人们发表了一场奇怪却又极富力量的演讲，前后持续了10多个小时，讲述了将新英格兰“纯净且充满活力”的人民遗产与“堕落国家”的残余隔离的重要性，声称新英格兰人民拥有着纯净的血统，并未汇集前美国难以言说的邪恶之物。他还进一步指出，有必要保护民众免受潜伏在新英格兰心脏深处的肮脏威胁。在演讲的最后几个小时，他宣布，所有忠诚的新英格兰人需要竭力压制目前已然侵蚀美国的黑暗。"
 ustates.538.d.war_COR_murray:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。在佐治亚州州长官邸外，默里总统发表了一场言辞激烈的演讲，此处官邸已是默里事实上的居所（尽管在事实上，默里只是将州长官邸的其他部分出租出去，而他却睡在车库里，正如同他承诺过的，倘若他占领白宫，他也会如此对待白宫）。在他的演讲中，他感谢一切忠于宪政国的人、白人联盟、忠诚的实业家和“最初的美国人”（他常常对其伸出援手的印第安人们）。他还痛斥“无赖道格拉斯·麦克阿瑟”、“投机分子休伊·朗”和那些“该死的工团蠢货”，并对美国内战中其余派系中有影响力的领导人发出了一连串侮辱。"
 ustates.538.d.war_COR_klan:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。在亚特兰大州州长官邸中，帝国巫师本人与全国民主党白人联盟的最高层领导举行了一场盛大的聚会，向每一个登记在册的三K党成员免费提供啤酒和烧烤。而在乐队连续不断地演奏南方民谣时，一场大规模、公众性的焚烧十字架活动也如火如荼地进行着，户外电影放映机也连续循环播放着D·W·格里菲斯的电影《一个国家的诞生》，这是部几乎以一力重振了三K党的电影。晚会一直进行到深夜，在酒酣耳热后，白人联盟成员之间发生了几起斗殴，还有传言成华盛顿特区的斯蒂芬森本人也参与到了斗殴之中，甚至还刺伤了一名新三K党的成员。当然，全国民主党白人联盟高层已否认了所有的报道。"
 ustates.538.d.war_WCC:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。为鼓舞部众，布拉德利将军再次骄傲地发表了一次火药味十足的演说。他指出，尽管前路困难重重，但自由之军终将凯旋而归——从福吉谷到卡斯特的排，再到圣胡安的山丘与我们的坦克。布拉德利回忆道，7月4日正是上一场美国内战的转折点——那一天，格兰特将军击败了罗伯特·李，迫使他撤出了葛底斯堡。他随后总结道，只要美国和她的军队屹立不倒，战争就不会失败，美国梦也就不会破灭。最后，将军感谢并赞扬了前来聆听他演讲的士兵们，并郑重发誓，尽管有时前途晦暗不明，但秩序终将重回美利坚，一切也将会重回常态。"
 ustates.538.d.post_war_CSA:0 "从旧秩序的废墟之中，一个崭新的美利坚诞生了。在美国逐渐开始重建并适应其这套新的社会主义制度后，美国人民也得以再度庆祝本国的独立日。自1936年内战爆发以来，全美利坚已物是人非——建筑化为瓦砾，道路化为尘土，无数人的生命也随之消逝，大批民众被迫背井离乡。美国人民有无数感伤的理由；但今天，所有人都仿佛回忆起了战前的时光。美国人民与家人和朋友们（或与他们的仅存亲友）欢聚一堂，在音乐与歌声中庆祝独立日。曾经相互对立的邻居们也开始握手言和，共庆来之不易的和平。尽管前方道阻且长，未来不乏悲伤，但理想主义的光芒仍在美利坚大地上熠熠生辉。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日再次使美国人民团结在一起；不可分割的美国人也将永远生活在同一面旗帜下。"
 ustates.538.d.post_war_TEX:0 "是美国本身，召唤着爱国者们来保卫她，而现在看来，爱国者们真的成功消灭了对美式生活方式的所有威胁。尽管前路漫漫，但和平确实重新降临了美利坚。基础设施几乎毁灭殆尽，无数生命就此消逝，政局动荡化为常态，但美国也确切地开始了缓慢的重建。今天，美国人终于可以在独立日这一天稍作休息。无论男女老少，美国人民都与家人和朋友们（或与他们的仅存亲友）在装饰着红蓝白三色的喧闹庆典中团聚，曾经相互对立的邻居们也开始握手言和，在庆祝活动中共庆来之不易的和平。尽管前方道阻且长，未来不乏悲伤，但美利坚人民依旧是伟大的人民。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日再次向全世界证明，这仍是那片自由之地。"
 ustates.538.d.post_war_PSA:0 "“自海至光辉之海”。这就是美国人民愿意为之而战的承诺。如今战事已平，位于萨克拉门托的临时政府宣布从加利福尼亚到华盛顿特区的土地再次在一面旗帜下统一。尽管美国几乎化为废墟，无数人的生命也已经消逝，但自由之火并未熄灭。尽管无数人认为美国的民主前路黯淡，但她就在不久前以胜者的姿态回归。尽管美国还在漫长的重建过程中，但在今天，美国民众终于可以放松沉重的心情，为这个伟大国家的诞生之日而尽情庆祝。美国人民与家人和朋友们（或与他们的仅存亲友）欢聚一堂，用篝火与游行庆祝独立日。曾经相互对立的邻居们也开始握手言和，像一家人一样庆祝这一天。过期的几年充满艰辛与苦痛，但宪政制度的凯旋为这片土地带回了希望。尽管前方道阻且长，未来不乏悲伤，但美利坚依旧是自由灯塔。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，这个独立日再次向全美国证明，民主之光依旧照耀两片大洋。"
 ustates.538.d.post_war_NEE:0 "当危机爆发，新英格兰州长向协约国寻求保护的时候，从来没有人能想到将会是新英格兰人恢复了美国的民主。然而，他们确实做到了：战火吞噬了无数人的生命，道路化为尘土，无数的人为躲避战乱背井离乡，涌向北方或其他安全之地。但至少，今天是美国人民能重拾一丝希望的一天：无论男女老少，美国人民都与家人和朋友们（或与他们的仅存亲友）在宴会与庆典中团聚，一起庆祝独立日。在一些城镇，民众们会点燃他们用木桶或板条箱垒起的金字塔，让它化为夜晚中最明亮的篝火。曾因意识形态相互对立的邻居们也开始握手言和，战争留下的伤疤也在他们的欢笑声中缓缓愈合。尽管前方道阻且长，未来不乏悲伤，但美利坚依然伟大。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日再次使美国团结在一起，再次成为那个不可分割，永远统一的美利坚合众国。"
 ustates.538.d.post_war_NEE_kingdom:0 "当危机爆发，新英格兰州长向协约国寻求保护的时候，从来没有人能想到新英格兰人能解决美国共和制度的灾难。然而，他们确实做到了：战火吞噬了无数人的生命，道路化为尘土，无数的人为躲避战乱背井离乡，涌向北方或其他安全之地。但至少今天，是美国人民能重拾一丝希望的一天：尽管保王派政府颁布了官方禁令；但无论男女老少，美国人民都与家人和朋友们（或与他们的仅存亲友）在宴会与庆典中团聚，一起庆祝独立日。在一些城镇，民众们会点燃他们用木桶或板条箱垒起的金字塔，让它化为夜晚中最明亮的篝火。曾因意识形态相互对立的邻居们也开始握手言和，哪怕连保王派也开始接受这个节日，战争留下的伤疤也在人民的欢笑声中缓缓愈合。尽管前方道阻且长，未来不乏悲伤，但美利坚依然伟大。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日正以一种挑衅的意味提醒着他们，美国再度被国王统治。"
 ustates.538.d.post_war_NEE_lovecraft:0 "当危机爆发，新英格兰州长向协约国寻求保护的时候，从来没有人能想到新英格兰人能够在普罗维登斯的远见之下征服美国。然而，他们确实做到了：战火吞噬了无数人的生命，道路化为尘土，无数的人为躲避战乱背井离乡，涌向北方或其他安全之地。但至少今天，是美国人民能重拾一丝希望的一天，哪怕普罗维登斯是个出了名的亲英派，他归根到底还是一个美国人，一个能允许这个最具美国特色的节日继续延续下去的美国人。无论男女老少，美国人民都与家人和朋友们（或与他们的仅存亲友）在宴会与庆典中团聚，一起庆祝独立日。在一些城镇，民众们会点燃他们用木桶或板条箱垒起的金字塔，让它化为夜晚中最明亮的篝火。曾因意识形态相互对立的邻居们也开始握手言和，哪怕连保王派也开始接受这个节日，战争留下的伤疤也在人民的欢笑声中缓缓愈合。尽管前方道阻且长，未来不乏悲伤，但美利坚依然伟大。美利坚的伤痕可能永不会愈合如初，但在美国民众再次变得小心谨慎，防止任何可能来播种恐怖的原始实体降临，以及任何可能于此刻出现并清理混乱的绿色三角洲特工到来之前，知晓美国在普罗维登斯的监视下得以高枕无忧的他们，至少能在这一天之中无忧无虑地沉湎于阖家欢乐之中。"
 ustates.538.d.post_war_WCC:0 "“今日，枪声终于沉寂，悲剧终于谢幕，胜利终于降临。”这是布拉德利在第二次美国内战结束不久后的讲话。美国一片狼藉，血流成河，无数人的希望同已逝之人的生命一同消散。但今天，随着美国开始了缓慢的重建，一线希望再次在人们的心中燃起。\n美国人民正与家人和朋友们（或与他们的仅存亲友）欢聚一堂，共赏天空中绽放的烟花；曾经相互对立的邻居们也开始握手言和，于和平中共庆独立日。尽管身后饿殍遍地，前方道阻且长，美利坚依然充满活力。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日再次使美国再次统一，成为那个不可分割，永远统一的美利坚合众国。"
 ustates.538.d.post_war_COR:0 "是美国本身，召唤着爱国者们自境外颠覆的魔爪中保卫她，而现在看来，爱国者们真的成功消灭了对美式生活方式的所有威胁。尽管前路漫漫，但和平确实重新降临了美利坚。基础设施几乎毁灭殆尽，无数生命就此消逝，政局动荡化为常态，但美国也确切地开始了缓慢的重建。今天，美国人终于可以在独立日这一天稍作休息。无论男女老少，美国人民都与家人和朋友们（或与他们的仅存亲友）在装饰着红蓝白三色的喧闹庆典中团聚，一起庆祝独立日。曾经相互对立的邻居们也开始握手言和，在庆祝活动中共庆来之不易的和平。尽管前方道阻且长，未来不乏悲伤，但美利坚人民依旧是伟大的人民。内战的一页已经结束，美国正翻开新的历史篇章，而人民对明天满怀期待。但现在，独立日再次向全世界证明，这仍是那片自由之地。"
 ustates.538.d.nowar:0 "为庆祝独立日，美国今天举行了一场简短、平静而和谐的仪式。这个节日是为了纪念1776年在美国革命战争前夕的第二次大陆会议中签署的独立宣言而设立的，对美国民众来说意义非凡。尽管许多人担心世界上的紧张局势会在美国国内引发又一轮的暴力事件，但很多人在看到今天的新闻之后，都因为没有爆发大规模骚乱而松了一口气。虽然各大政客都在人群中抛头露面，与旁人合照，还发表了公众演讲，将其竞选纲领与1776年相结合了起来，但大多数人还是获得了从错综复杂的政治乱局中脱身喘气、与亲朋好友在野餐与烟火中共度一天的机会。尽管美好的时光总是短暂的，但美国还是获得了长期以来它所欠缺的东西……团结。"
 ustates.538.d.war:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。为鼓舞部众，麦克阿瑟将军再次骄傲地发表了一次火药味十足的演说。他指出，尽管前路困难重重，但自由之军终将凯旋而归——从福吉谷到卡斯特的排，再到圣胡安的山丘与我们的坦克。麦克阿瑟回忆道，7月4日正是上一场美国内战的转折点——那一天，李败逃葛底斯堡，格兰特拿下维克斯堡。他随后总结道，只要美国和她的军队屹立不倒，战争就不会失败，美国梦也就不会破灭。最后，总司令感谢并赞扬了前来聆听他演讲的士兵们，并郑重发誓，尽管有时前途晦暗不明，但秩序终将重回美利坚，一切也将会重回常态。"
 ustates.538.d.war_COR_generic:0 "美国内战又延续了一年，昔日的烟火与庆典如今已成了炮弹与火焰。尽管如此，美国人民依旧在各自的家中（或在他们仅存的容身之地中）庄严地纪念着属于他们的独立日。在亨利·福特的陪同下，总统发表了事先编排好的演讲。在演讲中，他强调，北方叛徒正在进行一场旷日持久的战争，美国的繁荣惨遭毁坏，每一名纯正美国人的利益也受此连累。演讲结束后，宪政国最具影响力的政治与社会精英聚集在州长官邸外，观看了几场空中特技表演。"
 ustates.619.t:0 "狙击手训练计划？"
 ustates.619.d:0 "我们不得不在城市战争中学习严酷的教训，我们已经认识到我们的军队对于面对战场上的新危险——敌人的狙击手——毫无准备。尽管狙击兵在大战期间证明了他们的作用，但陆军的最高指挥官从未认为有任何理由扩编狙击手部队，因为它被视为欧洲战场的一种情境解决方案。然而，在美国山区、城市和森林的战斗证明，指挥官们不仅是错的，我们也为此付出了沉重的代价，我们缺乏反击敌人狙击行动的手段，更不用说派出我们自己的狙击手去消灭敌方的高价值目标了。因此，高级指挥官提议推行一项类似于加拿大在大战中进行的狙击手训练课程。"
 ustates.619.a:0 "提案取得通过"
 ustates.619.b:0 "提案遭到否决"
 ustates.623.t:0 "改变航空军标示？"
 ustates.623.d:0 "新问题被提上了议程，鉴于我国战斗机与敌军的航空标识很像，尽管部分单位可以通过无线电通信分辨敌我，战争部依然接获不少友军误击和敌军出乎意料地突破防空网络袭击后方部队的报告。因此，空军将领提议改变航空军现有机徽，前蓝后白红圆底五角星，使我国地面防空部队可以更好地区分敌我空军单位。我们应该批准这项改变吗？"
 ustates.623.a:0 "让敌人去改吧！这种机徽是我们的专利"
 ustates.623.b:0 "更换机徽"
 ustates.624.t:0 "授权燃烧弹空袭？"
 ustates.624.d:0 "从世界大战期间成功的战略轰炸战术得到启发，美国航空军日前将他们的新提案递交到最高指挥部，主张如何利用部分预算，大批量制成某种特殊的化学混合物，生产特种炸弹，在落地时会引发巨大而难以扑灭的火灾，他们也觉得这种武器也可以在美国的土地上使用，打击我们的敌人。尽管这种新型炸弹的威慑力惊人，且能有效阻碍敌军的工业能力，但使用这种非人道武器的道德阴影令许多参谋人员深感不安，这些炸弹更容易误击平民。冒着这样的风险批准该计划是否值得呢？"
 ustates.624.a:0 "没错，他们都是叛徒！"
 ustates.624.b:0 "不，地面上有许多我们的美国同胞！"
 ustates.650.t:0 "审判前联邦政府将领"
 ustates.650.AUS:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前联邦政府将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。其中最具争议的是老特里·德拉梅萨·艾伦。即使巴顿和福克斯·康纳都声称他是无罪的，毫无疑问，在美国最黑暗的时刻他和许多将领出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.650.PSA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前联邦政府将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，马歇尔递给政府一份列举了值得并且合适于赦免的高级将领名单，其中有充足的证据证明联邦政府的主帅艾森豪威尔和布莱德雷只是服从命令。即使他提供证据并提出了要求，毫无疑问，在美国最黑暗的时刻他和许多将领出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.650.CAR:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前联邦政府将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。其中最具争议的是德怀特·艾森豪威尔，但在审判期间，巴顿将军向政府递交了一份他认为值得进行改造的高级将领名单，并提供了充分的证据证明艾森豪威尔和布拉德利将军无罪，其所作所为皆是“服从正当命令”。尽管他提出了要求并提供了证据，但毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.650.a:0 "赦免他们"
 ustates.650.b:0 "开除他们的军籍"
 ustates.650.c:0 "叛徒给老子从美国滚出克！"
 ustates.651.t:0 "审判前联盟国将领"
 ustates.651.USA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前联盟国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，令最高指挥部震惊的是，艾森豪威尔将军向政府递交了一份他认为值得进行改造的高级将领名单，并提供了充分的证据证明德弗斯将军无罪，其所作所为皆是“服从正当命令”。尽管他提出了要求并提供了证据，但毫无疑问，在美国最黑暗的时刻许多将领追随他们出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
 ustates.651.PSA:0 "随着如今内战落下帷幕，我们的敌人任凭我们摆布，军队终于开始对前联盟国将领进行审判。在一些将领流亡海外时，其他被我们俘获的将领正在等待军事法庭的审判。但是无论公众持何种观点，审判并不像预期那么容易。大多数被审判的将领没有任何滥用武力的记录，即便有也可以宣称自己是服从命令。在这次审判中，马歇尔递给政府一份列举了值得并且合适于赦免的高级将领名单，其中有充足的证据证明联盟国的主帅德弗斯只是服从命令。即使他提供证据并提出了要求，毫无疑问，在美国最黑暗的时刻他和许多将领出于自己的意愿最后站在了历史错误的一边。一些被俘的将军即便被赦免也决意离开，与此同时也有将领宣布如果他们被赦免他们将为保卫新美国而战，只要我们致力于捍卫美利坚的理想。然而，最终决定权在陪审团手中……"
