 USA_maritime_industry:0 "重启海事产业"
 USA_maritime_industry_desc:0 "过去，美国出口商品、收割全世界的财富靠的都是航运这条生命线，但内战爆发后，生命线已再无生机。如果美国想要恢复其全球贸易霸权及海军实力，那我们就得大兴基建，重建海港设施。"
