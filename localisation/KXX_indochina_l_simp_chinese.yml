 viet_new.1.t:0 "陈国桓希望创建肃反机构"
 viet_new.1.d:0 "陈国桓认为，俄国革命失败，是因为党内部各派系混乱，反动分子过多且无法清除。最终导致革命功亏一篑。他声称必须要保证党的纯洁性才能保证战斗力和稳定，因此希望创建一个专门作用于此的部门。\n当然，这也招致了党内一大批人反对，政府内部不少人认为其是动机不纯，怀有其他阴谋。"
 viet_new.1.a:0 "秘密警察是有必要的"
 viet_new.1.b:0 "这样不太好吧?"
 viet_new.2.t:0 "名单时刻!"
 viet_new.2.d:0 "今早八点整，原本该按部就班开启工作的基层政府办公区，却被一则突如其来的消息彻底搅乱\n陈国桓没有通过任何常规通知渠道，而是直接在政府内部会议上，当众宣布了一份长达两页纸的"叛徒名单"。\n"名单上的人，都是潜伏在我们身边的反革命分子。"\n他将名单拍在会议桌上，纸张发出的声响让在场众人心里一紧，“我们已经收集到了完整的证据链，足以给他们定罪。按照规定，这些人必须以‘妨害革命成果’的罪名接受审判，最终的结果，就是执行处刑。”\n消息像长了翅膀一样，从会议室迅速传到各个办公室，再扩散到整个基层系统。有人私下里偷偷议论，质疑证据是否真实；有人担心自己会不会被牵连，开始小心翼翼地整理手头的工作记录；还有人直接找到领导表达不满，认为这种“突然袭击”式的名单宣布，完全打乱了正常的工作节奏。短短一个小时，整个基层政府都陷入了轩然大波，原本的工作氛围被焦虑与不安彻底取代。"
 viet_new.2.a:0 "这是不是太过火了...."
 viet_new.3.t:0 "陈国桓希望扩建情报部门"
 viet_new.3.d:0 "大清洗留下的紧张氛围还未完全消散，陈国桓便再次找上了范文同主席，这次他的目标很明确——肃反部门的扩张。他特意提前准备了一份详细的计划，从部门人员编制到物资调配，一条条列得清清楚楚，甚至连业务扩展的方向都做了规划。\n"上次清除了内部的蛀虫，但这只是开始，"\n陈国桓的声音在办公室里回荡，“肃反部门现在的规模和权力，根本跟不上工作需求。必须扩大部门，增加人手和资源，还要提升权限，让我们能更高效地开展工作；另外，我建议把情报窃取也纳入业务范围，不管是内部隐患还是外部威胁，都能及时掌握信息。”\n他的计划听起来面面俱到，可在场人员却没感到轻松——一旦答应，就意味着给予他远超现在的权力。肃反部门本就牵动着党内不少人的神经，如今再扩大、再放权，后续会不会引发新的问题？大家互相交换着眼神，都从对方眼里看到了犹豫，心里反复盘旋着同一个疑问：这到底是不是一件好事？"
 viet_new.3.a:0 "由他去吧"
 viet_new.3.b:0 "你的权力够大了!"
 viet_new.4.t:0 "陈国桓希望提高部门经费"
 viet_new.4.d:0 "清晨的阳光刚漫过政府办公楼的窗棂，陈国桓的身影就出现在了范文同主席办公室的走廊上。不出所料，他又是为了情报部的事情而来。这已经是近一个月里，他第三次专程拜访主席，每次都围绕着情报部的事务展开。\n秘书刚将他领进办公室，陈国桓就开门见山说明了来意，语气比以往多了几分急切。但与前几次反复提及"扩大情报部编制、增设下属科室"不同，这次他半句没提部门扩张的事，所有话语都聚焦在经费上：一会儿说情报收集需要更新监听设备，一会儿提外勤人员的差旅补贴不足，最后直接恳请范文同主席能特批，提高情报部下一季度的经费预算，以保障工作正常推进。\n陈国桓离开后，办公室里的几人面面相觑。大家都没料到他的诉求会突然转变，一时没了头绪。面对这种只提经费、不谈扩张的请求，我们该怎么做？是直接整理材料上报，还是先核实情报部的实际需求，又或是需要先与其他部门沟通协调？一个个疑问压在心头，让人难以立刻定下方向。"
 viet_new.4.a:0 "最终主席批准了请求"
 viet_new.4.b:0 "主席还是拒绝了"
 viet_new.5.t:0 "阴影中的动静"
 viet_new.5.d:0 "深夜，浓稠的墨色像化不开的油脂，沉沉压在整座城市的上空，西贡的街巷早已没了人烟，只有几盏昏黄的路灯在寒风中微微摇曳。陈国桓身着深色风衣，衣领高高立起，将大半张脸隐在阴影里，他眼神冷冽如刀，带着四个同样神色肃穆、步伐轻缓的手下，如同鬼魅般悄无声息地绕到住所后门。\n几人配合默契，打头的手下用特制工具轻轻拨开门锁，门轴转动时几乎没有发出一丝声响。他们鱼贯而入，动作迅捷而利落，迅速控制了住所内的灯光开关与关键通道。陈国桓径直走向卧室，彼时范文同刚被细微的动静惊醒，还未来得及做出任何反应，就被两名忠于陈国桓的手下一左一右按住肩膀，冰冷的触感从肩头传来，瞬间冻结了他所有动作。陈国桓站在床边，声音低沉而不带一丝温度："范主席，从现在起，你需要待在这里，配合我们的安排。"简单的一句话，宣告着范文同政治生涯的终结，整个过程安静得可怕，只有窗外偶尔掠过的夜风声，在寂静的房间里显得格外清晰。"
 viet_new.5.a:0 "一切为了革命"
 viet_new.6.t.a:0 "阴谋与赌局"
 viet_new.6.t.b:0 "潜伏"
 viet_new.6.d.a:0 "西贡的街垒战持续到第四天黎明。当支持反政府联盟的第五步兵师坦克碾过独立广场时，主席府阳台上的阮太学仍对着收音机嘶吼“镇压叛乱”，却不知自己早已成为阮中月棋盘上的困兽。这位潜伏在国民党系统高层的革命家，此刻正穿着绣有越南国民党徽章的警卫制服，用指尖轻轻掸去袖口的石灰碎屑——三个小时前，她亲自指挥“忠诚派”其中一支部队故意放弃西贡东侧防线，让起义军如同手术刀般直插政权心脏。\n阮中月的特务们混在卫戍部队中，始终消极作战。一名年轻士兵试图向进攻者还击，立即被特务伪装成的“中尉”厉声呵斥：“保存弹药！等他们进入射程再开火！”——这道看似强硬的命令，实则确保起义军能毫无阻碍地逼近主席府核心区域。透过百叶窗缝隙，阮中月观察着外面的形式。待到硝烟渐息......"
 viet_new.6.d.b:0 "西贡的街垒战持续到第四天黎明。当支持反政府联盟的第五步兵师坦克碾过独立广场时，主席府阳台上的阮太学仍对着收音机嘶吼“镇压叛乱”，却不知自己身边的人早已蠢蠢欲动。一些穿着绣有越南国民党徽章的制服的警卫表现得有点奇怪——三个小时前，“忠诚派”其中一支部队毫无缘由地集体叛逃当逃兵了，看起来也没加入到任何一方，西贡东侧防线就这样被攻陷，让支持反政府联盟的一方军队如同手术刀般直插政权心脏。\n更奇怪的是，疑似有一些人混在府中卫戍部队，始终消极作战。一名年轻士兵试图向进攻者还击，立即被他的“中尉”上司厉声呵斥：“保存弹药！等他们进入射程再开火！”——这道看似强硬的命令，实则确保起义军能毫无阻碍地逼近主席府核心区域。待到硝烟渐息....."
 viet_new.6.a:0 "社会主义者联盟突入总统府!"
 viet_new.6.b:0 "社会主义者联盟防线即将崩溃——该我们出场了。"
 viet_new.6.c:0 "阮太学政府坚持了下来,随后阮平将军宣布戒严"
 viet_new.7.t:0 "最终赢家"
 viet_new.7.d:0 "阮中月终于动了。她掏出手枪，却转身击毙了身旁仍在抵抗的卫戍部队上校。“我们被出卖了！”这声呐喊成为倒戈的暗号，数十名伪装成警卫的特务同时调转枪口，主席府里顿时鲜血直流。包括阮太学在内，在场所有政府人员被特务们按倒，而阮中月从容摘下越南国民党徽章，终于露出獠牙。硝烟渐散时，她弯腰拾起地上带血的总统印章，对着电台向西贡乃至全印支讲话："
 viet_new.7.a:0 "倒行逆施的越南国民党政府被推翻了，现在由我接手临时主席职位"
 viet_new.8.t:0 "揭下假面?"
 viet_new.8.d:0 "放眼当下，所有反对者非死即囚，异议之声已彻底哑火。权力道路上再无任何障碍。陈国桓是否到了抛弃范文同这位有名无实的傀儡主席，亲自走向权力前台?"
 viet_new.8.a:0 "揭下假面的时刻到了"
 viet_new.8.b:0 "在阴影中更好活动"
 viet_new.9.t:0 "国教"
 viet_new.9.d:0 "在印度支那公民宗教议题尘埃落定后，摆在我们面前的国教选择逐渐清晰，目前共有三个主要教派可供考虑。\n其中，高台教与和好教是优先级最高的两个选项。作为本土宗教中最具代表性的两大流派，它们不仅在教义传播上拥有深厚的群众基础，更在民间文化、社会动员层面展现出极强的影响力，其信众覆盖范围和对日常生活的渗透度，远超其他宗教群体。更关键的是，高台教首领范公稷与和好教首领黄富楚早在抗德时便支持我们的革命活动。\n紧随其后的是上部座佛教。尽管其整体影响力稍逊于前两者，但作为中南半岛的传统宗教之一，它在部分区域仍拥有稳定的信众群体，且在文化传承与精神引导方面具备独特价值，同样是不可忽视的备选方向。\n此外，尚有一些规模较小但各具特色的宗教存在，如带有民间神秘色彩的椰子道，在部分城市精英与少数民族中仍有信众的天主教等。它们虽非主流，却也是这片土地上信仰生态的组成部分。\n那么，我们该如何选择?"
 viet_new.9.a:0 "高台教为国教"
 viet_new.9.b:0 "和好教为国教"
 viet_new.9.c:0 "上部座佛教为国教"
 viet_new.9.e:0 "椰...椰子万岁?"
 viet_new.9.f:0 "天.天主教?"
 viet_new.10.t:0 "意外的友人"
 viet_new.10.d:0 "越南是一个多宗教并存的国家，其中和好教带有很浓的政治色彩。在印支游击战争期间，大量成员参加了越南独立联盟，从事反对德国及德属东亚殖民政府的斗争。这时，以谢秋收为代表的越南解放阵线巴黎派工农武装游击队追求激进的土改与反帝，代表了农民利益；和好教掌握广泛的农村信众与武装，关注地方自治、保护农民利益与宗教地位。两者在“保护农民、反对德国殖民”上都有共同需求。于是，由地方的反殖民地方士绅或者商人、豪强牵线，巴黎派下属的游击部队便时常同同样希望驱除殖民者的和好教武装进行地方性质上的合作，双方承诺不攻击对方武装，交换被通缉者的藏匿信息，并互派观察员。\n印支独立战争前夕，和好教的教主黄富楚亲自前来西贡上门拜访谢秋收，俩人一见如故，促膝长谈，互相分享着反帝反殖民的观点，收获颇丰。自此，巴黎派便正式结盟和好教。战争爆发后，为巩固和好教的支持，在谢秋收的担保下，越盟同意不在和好教控制区强推无神论宣传或公开破坏宗教组织结构，把意识形态斗争放到次要位置，以换取和好教全面支持越盟。\n印支独立战争结束，政府顺应了和好教抗战有功从而发展壮大的趋势，首先承认了其地位，把该宗教列为了国教。谢秋收主席本人与黄富楚的私人友谊也在治国理政过程中交往愈来愈频繁、友情愈来愈亲密。当然，谢秋收不可能没有注意到黄富楚与和好教正在越来越多地干涉中央政府的政治决策。为了国家的未来，他必须得认真对待这一段革命友谊。"
 viet_new.10.a:0 "友谊是友谊,公事是公事"
 viet_new.10.b:0 "黄富楚的治国之道非常有利于革命理论本土化"
 viet_new.11.t:0 "三期普渡大道之愿"
 viet_new.11.d:0 "阮安宁不仅是城市撰稿人和革命理论家，也是一个习惯“下基层，走田野”的知识分子。他早年便主张要直接走进乡村、码头、集市，进行长期的实地勘测，用接地气的朴素话语发动青年、工人与农民，以便把反殖民动员从书斋带到群众之中。阮安宁与宗教社团和乡土领袖接触颇多，因此当他遇到像高台教这样在西南地区（以西宁/西宁郡/Tây Ninh 为中心）兴起、又具有群众性与武装化倾向的宗教—社会运动时，便表现出浓厚兴趣与实地交流的倾向。\n后来，因为高台教从成立起便重视文字传播——不仅有宗教启示文本:灵示、教内刊物、而且教主本人亦在地方性刊物上发表与教务、政治相关的社论文章，他的文字或教内刊物也被阮安宁关注，两人开始相识，互相欣赏，互相转引文章、在局部政治议题上发表联合声明、或在同一刊物先后互换观点。\n随着交流越发深入，高台教的领导们越发关注这位政见相似的同志。阮安宁的策略并非简单的“理念同化”或“宗教抑制”，而是更接近一种“实验性动员实践”——他试图理解宗教如何把道德与共同体关系组织起来，并思考如何把这种组织力转换为反殖民的行动力量。同时，他发现高台教具有明确的群众动员与传播策略，并在战时—政局混乱时成为可操作的地方武装与政治资源。所以，当高台教的范公稷教主邀请阮安宁前去交流时，这位知识分子欣然答应。那段时间之后，高台教罕见地和城市无政府主义者站在了一起，共同支持阮安宁的激进政治主张，反对以越南国民党为首的民族资产阶级政党所倡导的更为温和的改革。高台教教徒踊跃加入这位曾拜访过他们村庄的知识分子所属的谨高望会，教主们则积极伸出援手资助谨高望会，为该会的运作和发展提供了强有力的支撑。\n革命胜利，时移世易。高台教凭借独立战争多年的宣传运动获得的广泛认同赢得了国教地位。阮安宁身为主席，也到了需要思考如何进一步对待高台教的那一步。"
 viet_new.11.a:0 "政治总归是要大于宗教的，我们依然需要坚持个人意义上的无政府思想"
 viet_new.11.b:0 "高台教非常适合于融合个人无政府主义思想"
 viet_new.12.t:0 "落幕时刻"
 viet_new.12.d:0 "阮安宁在选举中未能如愿胜出，面对失利的结果，他经过审慎考量后决定退出政坛，自此不再参与相关政治事务。在他退出后，政党内部依照程序进行了党魁选举，最终潘佩珠成功当选，接掌了政党的领导权。"
 viet_new.12.a:0 "令人意外"
 viet_new.13.t:0 "芹宜扶鸾热"
 viet_new.13.d:0 "告别了此前的生活节奏，阮安宁全心投入家庭生活。在平淡的日常里，扶鸾成为了他新的精神寄托，他不仅乐于参与，还常常细致琢磨其中的门道。久而久之，他在扶鸾方面的积累与见解，让他在芹宜当地渐渐有了知名度，身边也聚集了不少有相同兴趣的人。"
 viet_new.13.a:0 "有自己的个人喜好挺好的"
 viet_new.14.t:0 "奇怪的骚动"
 viet_new.14.d:0 "暹罗陷入战火纷飞的局面后，各地局势愈发复杂难测。就在这时，上丁地区传来了一则令人留意的消息：当地森林里，近期常常能看到一些身份无法确认的人在林间游荡，其行为举止透着不明所以。眼下局势特殊，我们不禁要思考，是否应该安排人员前往上丁的森林一探究竟，以掌握更多实际情况。"
 viet_new.14.a:0 "当然,我们会派人看看的"
 viet_new.14.b:0 "当地政府会处理好这些事的"
 viet_new.15.t:0 "奇怪的仪式"
 viet_new.15.d:0 "经过一番细致的调查核实，我们终于弄清了此前在森林中游荡者的身份——他们是从暹罗而来的僧人。与此同时，调查人员还在森林内的部分区域，发现了一些带有神秘色彩的仪式符号，这些符号的用途与含义尚不明确。面对这一发现，僧人们作出回应，声称这些符号并不会对我们的国家造成任何伤害。只是，在当前局势下，我们是否应当全然相信他们的这番说辞，成为了当下需要斟酌的问题....."
 viet_new.15.a:0 "我们不能相信他们说的话,暗中解决他们"
 viet_new.15.b:0 "我们走吧，这地方太诡异了"
 viet_new.16.t:0 "迷雾背后的是...."
 viet_new.16.d:0 "不知究竟是哪个环节出了纰漏，我们在森林中处理僧人相关事务的消息，竟莫名其妙地泄露了出去。更让人始料未及的是群众的反应，起初几日，局势还如我们预想的那般，民众群情激愤，街头满是不满的声浪；可仅仅过了几天，这份激烈便骤然消失，取而代之的是一种令人胆寒的死寂。等我们后知后觉，意识到这异常的平静背后藏着更大的风暴时，一切都已经太晚——那些此前一言不发的群众，已然以迅雷不及掩耳之势，迅速占领了西贡的各处关键设施，局面彻底失控。而在迷雾之后，则是....."
 viet_new.16.a:0 "阮安宁将校准航向 将印度支那迈向真正革命"
 viet_new.16.b:0 "红龙将会再度觉醒...."

 viet_new.17.t:0 "黎笋的困境"
 viet_new.17.d:0 "黎笋上台之初，面对国内令人头痛的军队系统，内心始终萦绕着强烈的忧虑—这支力量不仅在编制与指挥体系上日渐脱离自己掌控，更有部分成员暗中与其他政党勾连，准备随时推翻自己。他深知，若不及时整肃，军队随时可能成为动摇政权的隐患，因此清洗军中不忠分子的想法，从执政初期便在他心中反复酝酿。\n然而，这份决断始终被一层更深的顾虑束缚：军队作为国家暴力机器的核心,一旦因大规模清洗引发恐慌，那些手握实权的将领与中高层军官极有可能"狗急跳墙"——轻则以"稳定军心"为名抱团抵制政令，重则煽动基层士兵哗变,甚至直接威胁中枢安全。这种"一动则全局危"的风险，让他在决策边缘反复徘徊。\n摆在黎笋面前的，是两条看似都布满荆棘的道路：要么顶住压力全面清洗，彻底铲除军中异己，重塑军队对政权的绝对服从，但必须承担引发军事动荡的巨大风险；要么选择妥协式的局部调整，仅针对基层军官群体进行筛选与清洗——既能通过"小范围开刀"传递整肃信号，又可避免直接触碰中高层核心利益、激化矛盾，却也可能因力度不足留下隐患，让军中不忠势力得以蛰伏，未来再度成为威胁。那么，我们该如何选择...."
 viet_new.17.a:0 "必须彻底铲除军中的叛徒"
 viet_new.17.b:0 "敲山震虎足以"

 viet_new.18.t:0 "邓春区的绝望一搏"
 viet_new.18.d:0 "意外毫无征兆地爆发！就在清洗命令即将落地的关键时刻，一直沉默蛰伏的邓春区迅速抓住了基层军官对大规模整肃的恐慌与不满，暗中串联起一批同样担忧自身命运的基层指挥官。他们趁着政府中枢因决策部署而略显松懈的间隙迅速调动兵力，兵分多路控制了广播站，交通枢纽等政府机构，沿途并未遭遇有效抵抗\n面对突发的兵变，忠于黎笋的卫队虽说仓促应战但仍坚持住了总统府的防线，这一场因权力博弈引发的政权更迭，结局将通向何方...."
 viet_new.18.a:0 "黎笋的部队坚持住了攻势,成功等到援军并将邓春区叛军一网打尽!"
 viet_new.18.b:0 "邓春区及时的领先黎笋援军到来之前攻破了总统府"

 viet_new.19.t:0 "通往独裁之路"
 viet_new.19.d:0 "肃清邓春区引发军队隐患后,黎的权力巩固重心迅速转向派系问题—作为东洋共产联团中的少数派,他深知若不彻底厘清派系纠葛,自己主张的道路便无从贯彻.为此,他展开了一系列精准且强硬的行动:\n对范文同,黄文欢的大众派,黎笋未动用极端手段，而是通过削减预算支持、架空核心职权等方式，逐步将其排挤出决策核心，使其在政坛的话语权持续弱化，最终沦为边缘力量.\n针对谢秋收,陈定龙,黄国越的工团派，则直接扣上里通法兰西公社,危害国家安全的罪名，查封其所属工会,封杀舆论平台及办公据点，相关核心成员或被限制出境，或被移交司法审查，东洋革命会与印支劳工总联合会一夜之间土崩瓦解\n而对阮安宁,潘佩珠牵头的高望谨会，则采取了更为严密的管控策略——先是以妨碍施政为由，对该团体的活动范围、资金流向实施全方位监视，随后又抓住其内部管理的细微漏洞，将阮安宁以滥用影响力、破坏政治秩序的罪名逮捕入狱，直接斩断了高望谨会的核心.孙德胜的连越阵线在高望谨会影响力低下之后自行瓦解\n经此一轮整治，除了与黎存在部分利益契合、且始终保持低调的越南国民党外，其他曾在政坛拥有一席之地的派系，其影响力均被彻底肃清，黎笋的执政阻力大幅削减，权力根基也随之愈发稳固。"
 viet_new.19.a:0 "唯有强权!"

 viet_new.20.t:0 "潘佩珠问题?"
 viet_new.20.d:0 "随着异见势力被逐一肃清，黎终于将目光投向了曾因地位尊崇而迟迟未动的潘佩珠——尽管早已知晓潘与法兰西公社甚至于越南光复会存在勾连乃至于其本身就是光复会的中枢骨干，此前却碍于其在政坛积累的声望与潜在影响力，始终未敢贸然出手。如今政权内部已无明显反对声音，黎笋则毫无顾忌的逮捕潘佩珠，彻底斩断这一潜在隐患。\n而对于潘佩珠的处置方式，却成为异常棘手关键问题：若选择将其公开处决，虽能以最决绝的方式震慑潜在异己、彻底消除潘及其残余势力死灰复燃的可能，彰显黎笋的铁腕立场，但极大可能引发国家动荡，若仅对其实施长期囚禁或软禁，则可避免激化矛盾、减少舆论争议，同时通过剥夺潘的自由与政治权利，达到消除威胁的目的，可风险在于，潘的存在或许会成为反对势力暗中集结的象征，为未来政权稳定埋下隐患.那么，我们该如何选择?"
 viet_new.20.a:0 "避免节外生枝,处决最好"
 viet_new.20.b:0 "还是囚禁吧"

 viet_new.21.t:0 "阮太学谴责黎笋"
 viet_new.21.d:0 "随着黎对各派势力的肃清行动不断推进，曾与他存在部分利益契合的国民党，态度逐渐发生转变。直至潘佩珠事件发生后阮太学常常在公众场合发声，强调"权力的稳固不应建立在打压异见之上"，停止派系清算以重建政治团结。这番公开谴责标志着越南国民党与东洋共产联团民族派的彻底决裂"
 viet_new.21.a:0 "下一个就是他"

 viet_new.22.t:0 "阮太学的末路"
 viet_new.22.d.a:0 "最终，黎笋的目光最终落在了仅剩的阻碍—越南国民党身上。尽管阮太学此前仅以"谴责破坏团结"发声，未采取实质对抗行动，但在黎笋的眼中，这股拥有社会声望与思想影响力的力量，始终是潜在隐患。\n忠于黎笋的精锐部队，在深夜时分悄然行动。他们避开了常规巡逻路线，突袭了国民党核心成员的住所与办公地点。整个行动迅速且几乎未引发冲突，关键人物被逐一控制，并被秘密带往预先安排好的囚禁地点。\n随着国民党核心成员被彻底控制，曾经在政坛、思想领域存在的各类反对声音与制衡力量已悉数消散。自此，黎笋的执政道路上再无明显阻碍，其权力也彻底覆盖了政权的各个层面，进入了完全掌控局势的阶段。"
 viet_new.22.d.b:0 "最终，黎笋的目光最终落在了仅剩的阻碍—越南国民党身上。尽管阮太学此前仅以"谴责破坏团结"发声，未采取实质对抗行动，但在黎笋的眼中，这股拥有社会声望与思想影响力的力量，始终是潜在隐患。\n深夜的西贡被浓重夜色笼罩，忠于黎笋的部队按照计划，分成多支小队突袭国民党核心成员的住所、学术据点与常去的集会场所。然而，每一处目的地都空无一人—屋内物品摆放整齐，桌上还留着未写完的文稿，火炉里的炭火余温尚存，却看不到任何人员撤离的慌乱痕迹，显然是提前得到消息提前撤离。\n更让黎笋心头发紧的是，不仅国民党核心成员踪迹全无，那些平日里与阮太学往来密切的政党、青年追随者，乃之于先前已密切监控的越南光复会残余成员也如同人间蒸发般在西贡彻底消失。原本频繁传递消息的联络点也尽数关闭，整个国民党派系仿佛从未在这座城市存在过。\n这种反常的"集体失踪"，让黎笋刚刚因肃清潘佩珠而放松的神经瞬间紧绷。他清楚，阮太学绝非无力抵抗才仓皇逃离，这种有组织、有预谋的撤离背后，必然隐藏着更深的谋划。一股难以言喻的不详预感在他心中蔓延—自己或许并非掌控全局，反而可能掉进了一个早已布好的陷阱，而消失的国民党与光复会残党，正像暗处的猎手，等待着反击的时机。"
 viet_new.22.a:0 "一个国家,一个领袖"
 viet_new.22.b:0 "这可不对...."

 viet_new.23.t:0 "河内骚动"
 viet_new.23.d:0 "关于阮太学的追查有了最终结果，他携一众忠心追随者，经过一番部署与行动，成功占据了河内一带.目前，河内在名义上仍归属我方治下，但其军政实权早已落入光复会/国民党之手，我方在此地的影响力已名存实亡。"
 viet_new.23.a:0 "该死!"

 viet_new.24.t:0 "奇怪的人员"
 viet_new.24.d:0 "顺化的状况同样不容乐观。受我方当前精力所限，部分身份尚未核实的人员已趁机批量聚集至顺化区域，其聚集目的暂不明确。"
 viet_new.24.a:0 "严密监控他们..."

 viet_new.25.t:0 "顺化的越狱事件"
 viet_new.25.d:0 "顺化监狱遇袭！昨夜，此前聚集的那群不明人士借着浓重夜色掩护，携带砍刀与自制撬棍突袭了监狱。他们先是放倒了外围两名巡逻守卫，随后迅速突破大门，用撬棍破坏牢房铁锁，将关押的三十余名囚犯尽数劫走，其中包括曾在阮朝中德高望重的尊室䜣。整个过程不到半个小时便撤离无踪，现场只留下被捆绑的狱卒与散落的兵器。"
 viet_new.25.a:0 "似曾相识..."

 viet_new.26.t:0 "黎笋遇刺!"
 viet_new.26.d:0 "意外发生了!黎笋在日常就餐时遭遇枪击!事发时他已结束用餐，正坐在餐桌旁与随从交谈，窗外突然传来枪响，一枚子弹穿透玻璃击中其胸口。待随从反应过来戒备时，枪击者已不见踪影，黎因失血过多，在被送往救治的途中失去生命体征。"
 viet_new.26.a:0 "哦不...."

 viet_new.27.t:0 "光复会武装叛乱!"
 viet_new.27.d:0 "这个国家正一步步走向分崩离析，局势已濒临失控。自我方政局陷入动荡、权力出现真空后，光复会的实质领导人疆柢已到达河内同阮太学的国民党合流.随后，他们以"推翻现有秩序"为口号，在河内召集反叛分子，分发武器、划分防区，正式发起武装叛乱。此举不仅让北部彻底陷入战火，更引发了其他区域的效仿，国家统一的局面已岌岌可危。"
 viet_new.27.a:0 "该死的修正主义分子!"
 viet_new.27.b:0 "为了潘佩珠!(切换至越南共和国)"

 viet_new.28.t:0 "顺化叛乱!"
 viet_new.28.d:0 "随着我国局势的全面崩塌，潜藏的君主制残余势力不再蛰伏，他们借助德属东亚的军事援助—包括一批先进枪械与数名军事顾问，在顺化突然发动叛乱。叛乱者先是突袭了顺化的地方行政机构，夺取控制权，随后在街头张贴保皇标语，宣称要推翻现有统治、恢复君主制度，城内局势一度陷入混乱。这一举措无疑加剧了周边区域的动荡，也让我们的整体局势雪上加霜。"
 viet_new.28.a:0 "旧世界的余孽!"
 viet_new.28.b:0 "保大会带领越南走向和平与秩序!（切换至越南帝国）"

 viet_new.29.t:0 "老挝易帜!"
 viet_new.29.d:0 "老挝的局势同样不容乐观，已陷入失控边缘。在我们深陷混乱、无力旁顾之际，琅勃拉邦国王西萨旺・冯迅速抓住时机，集结其麾下王室势力与地方部族武装，向老挝各地发起行动。他们先是控制了琅勃拉邦周边的交通要道，再逐步向其他城镇推进，几乎未遇强力抵抗便全面掌控了老挝地区的核心区域。最终，西萨旺・冯公开宣告脱离我方管辖，正式成立"老挝王国"，使得这一区域的归属权彻底易主。"
 viet_new.29.a:0 "让他们再得瑟一会吧"
 viet_new.29.b:0 "前进,去万象!（切换至老挝王国）"

 viet_new.30.t:0 "上丁失控!"
 viet_new.30.d:0 "我国陷入崩溃泥潭之际，上丁地区的掌控权出现裂痕。我们因应对全局混乱，无力顾及这一边陲区域，西索瓦・莫尼旺则抓住时机，带着始终追随他的君主派核心成员，从隐秘据点转向公开行动。他们先是争取到上丁地方豪强的支持，再以"恢复传统秩序"为号召吸纳民众，逐步瓦解我方在当地的影响力。待我方察觉时，西索瓦・莫尼旺已完全掌控上丁区域，并正式宣告柬埔寨王国成立，形成了事实上的独立政权。"
 viet_new.30.a:0 "最后再收拾他们"
 viet_new.30.b:0 "吴哥窟迸发着闪耀的色彩!(切换至柬埔寨王国)"

 viet_new.32.t:0 "西贡审判"
 viet_new.32.d:0 "在阮中月代主席成功挫败那场针对东洋联邦的颠覆阴谋后，阮太学及其领导的越南国民党被一网打尽，押上国家特别法庭。\n法庭以涉嫌颠覆国家政权、策划武装政变及破坏宪政根基等罪名，当庭宣判永久取缔越南国民党，宣布该党为非法组织，其所有资产与武装予以没收解散。作为政变主谋与党魁，阮太学被判处无期徒刑，押往西贡监狱终身监禁，在铁窗中度过余生；而其军事副手阮平则因直接指挥武装叛乱、造成重大流血冲突，被判处死刑，以正国法。"
 viet_new.32.a:0 "罪有应得"
