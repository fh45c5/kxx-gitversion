 INC_learn_from_october_revolution:0 "汲取革命经验"
 INC_learn_from_october_revolution_desc:0 "1917年，在布尔什维克党和弗拉基米尔·伊里奇·列宁的领导下，俄罗斯工人推翻了俄罗斯资产阶级专制制度，建立了世界上第一个无产阶级国家苏维埃国家，而在西方，法国和法国的工农也建立了世界上第一个无产阶级国家。英国成功地建立了自己的工农国家。我们需要从这些革命中吸取行政和军事上的教训，利用我们思想前辈的经验来提高我们的民族革命。"
 INC_rally_the_people:0 "团结大众"
 INC_rally_the_people_desc:0 "·"
 INC_david_and_goliath:0 "利用丛林地形"
 INC_david_and_goliath_desc:0 "我们正处于一种弱势情况，一场小而弱的对手面对一个更大、更强大的对手的竞争中，就像大卫和歌利亚一样。"
 INC_proganda_front:0 "宣传胡志明思想"
 INC_proganda_front_desc:0 "·"
 INC_guerrila_tactics:0 "实施游击战术"
 INC_guerrila_tactics_desc:0 "但大卫并不仅仅因为他勇敢而杀死歌利亚。他仰望着歌利亚，意识到如果他用剑来对抗歌利亚，歌利亚会杀死他。但如果他捡起一块石头，放入投石器中，他可以打中歌利亚的头部，将歌利亚击倒并杀死他。大卫在与歌利亚战斗时运用了他的智慧。我们印度支那人在与德国人作战时也是如此"
