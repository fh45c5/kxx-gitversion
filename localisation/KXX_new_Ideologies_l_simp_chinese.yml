 paranormalism_subtype:0 "超自然现象信仰"
 paranormalism_subtype_desc:0 "§Y超自然现象信仰§!\n\n超自然现象信仰是一种融合了对神秘力量的敬畏与对传统科学的质疑的意识形态体系。其核心观点认为，人类社会中存在许多无法用现有科学解释的现象，这些现象背后隐藏着超越人类理解能力的力量。超自然现象信仰者主张通过直觉、冥想与神秘体验来探索这些未知领域，认为许多关于灵异事件、预知梦、心灵感应等现象的资料被主流科学界忽视或压制。\n\n此外，超自然现象信仰还强调人类社会应当尊重并保护那些尚未被现代科技完全理解的传统知识与文化。他们相信，通过深入研究这些神秘现象，人类可以发现新的精神力量与社会组织形式。"

 natpop_biopolitics_subtype:0 "生物政治"
 natpop_biopolitics_subtype_desc:0 "§Y生物政治§!\n\n19世纪下半叶，由于生物学尤其是细菌学和遗传学取得巨大进步，特别是在欧美地区，许多生物学概念社会化，生物政治学的应运而生。所谓的“生物统治”就是指以生物学原则主导国家治理的政治模式，在极端民族主义或种族主义者中颇有市场。其核心主张是：国家应像医生治疗肌体一样，通过科学手段“诊断”并“治愈”社会疾病，维护“民族健康”。这一理念将人口视为生物有机体，借助医学、遗传学及公共卫生理论，对“退化群体”实施干预甚至清除。\n虽然现代大部分有良知的政府抵制这一披着科学外皮的种族主义，但从针对特定民族的优生学计划到隐蔽的细菌实验，生物统治的影子无处不在。如果稍有不慎，文明的外皮被褪去，剩下留予人们的就是一场生存的噩梦。"

