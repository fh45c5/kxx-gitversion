 tot_chinese_nationalism_subtype:0 "大中华主义"
 tot_chinese_nationalism_subtype_desc:0 "§Y大中华主义§!\n\n中国民族主义，也称为大中华主义，主张全中国境内的民族，包括汉族和少数民族，应该团结一致，形成一个强大的国家，以抵御外来侵略和影响。中国民族主义强调中华文化的独特性和优越性，认为中华文明是世界上最古老、最伟大的文明之一。中国民族主义者通常主张恢复中国的传统价值观和社会结构，反对西方文化的渗透和影响。他们认为，中国应该摆脱外国势力的控制，实现国家的独立和自主发展。恢复中华民族的荣誉和地位是中国民族主义的核心目标，他们宣称中国应该恢复历史最大版图，同时将势力扩大到整个东南亚和中亚地区，并热衷于将周围国家彻底纳入中华文化圈，实行文化同化政策。"

