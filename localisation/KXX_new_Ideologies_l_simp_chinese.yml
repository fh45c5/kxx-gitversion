 tennosei_totalism_subtype:0 "日本准则主义"
 tennosei_totalism_subtype_desc:0 "§Y日本准则主义§!\n\n£GFX_ideology_tennosei_bar\n\n\n\n\n在世界大战后的动荡新时代中，为了国家的革新而剑走偏锋的人并不在少数，中野正刚和他的东方会就是其中的代表。面对帝国如今的危局，这位曾经的激进民权主义者提出了一种名为社会国民主义的理念，其主要纲领包括政府承担的“广义国防”和军部承担的“狭义国防”并行的社会统制、以急速扩大强化生产力为目标的统制经济、排除阶级特权与阶级斗争的极权主义、对于农民、工人、中小工商业者和工薪阶层的生活保障、全体国民的努力与牺牲意识的觉醒以及建设基于激进泛亚主义的新国际秩序。虽然依旧可以从中窥到中野早年的民权主义色彩，但是其纲领却更加让人不祥地联想到西欧赤色分子的国家工团主义思想，而中野在游历欧洲时对于奥斯瓦尔德·莫斯利及贝尼托·墨索里尼等西欧极权分子的公开赞扬也加强了这一疑虑，因此，社会国民主义也往往被略带贬义地称为“日本准则主义”或者“天皇制准则主义”。"

