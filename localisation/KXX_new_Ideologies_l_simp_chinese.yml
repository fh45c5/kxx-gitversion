 tot_paternal_socialism_subtype:0 "家长制社会主义"
 tot_paternal_socialism_subtype_desc:0 "§Y家长制社会主义§!\n\n£GFX_ideology_patern_soc_bar\n\n\n\n\n家长制社会主义又称保守社会民粹主义，家长制保守主义，或在偶尔情况下在西方世界被称为基督教保守社会主义。这是一种古怪的意识形态，试图融合传统保守主义和非马克思的社会主义或进步民粹主义这些看似矛盾的思想。这一奇怪思想诞生自工业革命时期的英国和德国，但现在却在西方世界之外越发常见，比如拉丁美洲或非洲，那些地区并不适用欧洲发源的社会主义的规则和期望，因此转而寻求建立植根于宗教伦理，保守福利经济，阶级协作，公民民族主义和非极端爱国主义之上的道德保守社会。家长制社会主义通常与市场社会主义、基督教分产主义、慈善经济、俾斯麦国家社会主义、红色托利主义等各种财富分配方案相联系，尝试建立一套平等、非掠夺性的经济体系以对抗阶级斗争的理念。家长制社会主义将资本主义和社会主义思想融合在保守家长制的外壳下，为通常是传统主义者和民族主义者的本国人民谋福利，同时压制正统社会主义运动，以维持国家传统和社会稳定，即使这会导致他们与世界各地的其他社会主义者或保守主义者产生分歧。"
 tot_yellow_syndicalism_subtype:0 "黄色工团主义"
 tot_yellow_syndicalism_subtype_desc:0 "§Y黄色工团主义§!\n\n£GFX_ideology_yellowsyn_bar\n\n\n\n\n黄色工团主义可谓意识形态领域一朵实打实的奇葩，其提倡以工会的形式发声，捍卫无产阶级的价值观与权利，而非去攻击雇主或其立场。“黄派”起源于1899年克鲁索的施耐德矿场大罢工，他们与“红派”，也就是革命社会主义者有着相同的诉求，但却视罢工为一种南辕北辙的行为，甚至还主动协助当局破坏罢工。皮埃尔·比耶特里把接连于法国各地冒头的黄色工会联合了起来，并打出了“劳动、家庭与祖国”的口号。除此之外，比耶特里还进一步发展了这一理论，彻底抛却了雇主是工人阶级的天生之敌的革命路线，把矛头对准了德国人和犹太人，在组织内部营造出了一种强烈的民族主义情绪，并且在1919年革命之前还一直在收着资本家的钱对付红色工团主义运动。比耶特里还仿照国王报贩和火十字团，教授工会成员以武装作战技巧，方便他们实现其最终目标：建立起优越于现行公社体制的民主、社会与民族的法兰西工团共和国。"
 marlib_national_democracy_subtype:0 "民族民主主义"
 marlib_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_polish_natdem_bar\n\n\n\n\n民族民主主义起源于波兰民族思想之父罗曼·德莫夫斯基的创意，其前身可以追溯到波兰实证主义和有机劳动运动。民族民主党人把波兰民族的利益视为最高利益，努力创造一个超越阶级差异的团结社会，且并不特别强调宗教。虽然主张建立起更为强势的政府，但民族民主运动仍然坚持民主是首选的政治制度，只是波兰人的地位需要得到提升，且在波兰裔占多数的地区推动少数民族同化。在经济问题上，民族民主主义的立场不那么明确，不过最受欢迎的选择是自由市场的同时，允许政府有足够的干预权来保护国家利益。在外交事务上，民族民主运动强烈反德，并将俄罗斯视为遏制德意志帝国野心的最佳伙伴。"
