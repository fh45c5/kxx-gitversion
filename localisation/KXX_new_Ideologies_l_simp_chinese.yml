 authdem_legionarism_subtype:0 "军团主义"
 authdem_legionarism_subtype_desc:0 "§Y军团主义§!\n\n£GFX_ideology_legionarism_bar\n\n\n\n\n相比起具体的意识形态，军团主义更准确的定位定是前前后后化用意大利民族主义协会之名，行事风格却更为激进的各种运动的影响力与或相关或不相关的思想政策之集合，它是由各种势力卓群的强大政党所呈现出的一种极端民族主义革命思想体系。军团主义最早可上溯到俄罗斯首屈一指的黑色百人团组织俄罗斯人民联盟、德国的全国商业雇员联合会，以及法国的保罗·德鲁莱德为支持“复仇将军”乔治·埃内斯特·布朗热而建的极端右翼组织爱国联盟等运动，反动、好勇斗狠、反社反犹、种族至上便是它们的标志。大战之后，对极右翼影响最大、最受其拥戴的军团主义分支是匈牙利的根伯什·久洛及其塞格德思想，而最成功、为人所争相模仿的则是高深莫测的科尔内留·泽莱亚·科德里亚努麾下的大天使弥哈伊尔军团，亦即铁卫团。军团主义政党的政策以拥有着共同的血统、敌视侵染自家土地的“外国污秽”的本国普通民众为出发点，以虚无缥缈的“新生”为目标，致力于用复仇欲望、对模糊不清的教会的强烈信仰等价值观，或以及经自我牺牲、为大义而献身之原则熏陶的狂热准军事部队中的青少年的一腔热血团结起人民群众，共同迎接整个民族的重生。经济上，虽然可供取舍的方案有不少，但多数军团主义者还是选择了意大利民族主义协会的法团主义之路。军团主义者最鲜明的一点便是憎恶“内鬼”，并想尽一切办法与之对抗，而所谓“内鬼”，既可以是共产主义者、共济会、少数族裔，也可以是任何玷污了其经由超凡脱俗之尤利乌斯·埃佛拉男爵的觉醒军团之经文刚刚觉醒的纯净状态之人。虽然军团主义的追随者保留下了君主制之类的旧世界元素，但他们全部都渴望建立起崭新的革命性秩序，为族类创造出真正的天堂，让敌人体会到人间炼狱。"

 left_leaning_legionarism_subtype:0 "左倾军团主义"
 left_leaning_legionarism_subtype_desc:0 "§Y左倾军团主义§!\n\n£GFX_ideology_left_leaning_legionarism_bar\n\n\n\n\n左倾军团主义代表了更广泛军团主义运动中的一个边缘支流，以罗马尼亚的白鹰队运动为典型代表，并在一些后发达国家流行。不同于主流的军团主义，它以矛盾的方式将革命热情与该运动特有的民族神秘主义融合在一起。在思想渊源上，左倾军团主义者通常受到索雷尔主义者和国家工团主义者的启发，在经济层面采用左翼法团主义的架构，展现出对资产阶级（或是封建阶级）的激烈拒斥。虽然保留了主流军团主义对古老精神理想的向往，但左倾军团主义中的大多数强调利用工人阶级的力量来实现革命目标——即通过民族复兴来彻底改造社会，这使得其外表显得更为世俗和开明。然而，军团主义深植的民族主义狂热与种族纯洁性诉求，始终是其无法剥离的核心特征。"

 controlled_democracy_subtype:0 "指导式民主"
 controlled_democracy_subtype_desc:0 "§Y指导式民主§!\n\n£GFX_ideology_controlled_democracy_bar\n\n\n\n\n指导式民主是指维持民主表象，但权力实际上集中在少数个人或团体手中的政治制度。它的特点是政治自由有限，反对党受到限制，并操纵选举过程以确保统治精英保持权力。虽然可以举行选举，但选举往往受到严格控制和操纵，以确保预先确定的结果，从而有效地限制了普通民众的真正民主参与和决策。但与此同时，也的确存在一些国家的领导人将指导民主视为避免暴民统治的良药，一旦人民做好了民主的准备，这些领导人就会事了拂衣去，真正的民主选举就会举行。"

 natdem_syndicalism_subtype:0 "民族民主工团主义"
 natdem_syndicalism_subtype_desc:0 "§Y民族民主工团主义§!\n\n£GFX_ideology_natdem_syndicalism_subtype_bar\n\n\n\n\n民族民主工团主义是一种在理念上具有显著张力的意识形态。它继承了传统国家工团主义对阶级团结与国家主导的社会化运动的坚持，但同时坚决拒绝其常见的暴力手段与独裁倾向。这一独特立场使它在众多工团主义流派中显得尤为特殊。民族民主工团主义者强调通过民主机制实现社会变革，主张在宪政框架和多元议会制度下推动经济社会的社会化改革。他们批判革命工团主义中的激进路线，认为那不仅容易导致压迫性政权，还可能引发社会动荡与暴力循环。相反，他们坚信坚实的民主体制：包括法治、选举和多元协商才是实现社会主义理想的有效路径，能够在保障自由的同时推进经济平等。这一思想吸引了许多原本支持传统国家工团主义、但对其威权实践感到失望的理想主义者。他们转而投身于议会政治与社会运动，试图在体制内通过立法、政策倡议与基层动员来构建一个更加公正、去商品化并且由工人参与管理的经济秩序。尽管被部分激进派批评为“妥协路线”或“理想主义”，民族民主工团主义仍代表了一条试图融合民主价值观与国家工团主义经济模式的独特道路。"

 #赤潮衍生
 natpop_futurism_subtype:0 "民族未来主义"
 natpop_futurism_subtype_desc:0 "§Y民族未来主义§!\n\n£GFX_ideology_futurism_bar\n\n\n\n\n民族未来主义是一种极右翼先锋意识形态，宣扬暴力、军事英雄主义及以机械与工业崇拜为基础的社会体系，排斥一切传统或资产阶级元素。其目标是在英雄主义、军事原则与工业文化的指引下重建并强化民族国家，并以暴力手段消灭其敌人。"

