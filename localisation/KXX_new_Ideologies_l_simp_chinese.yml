 latin_falangism_subtype:0 "拉丁长枪主义"
 latin_falangism_subtype_desc:0 "§Y拉丁长枪主义§!\n\n拉丁长枪主义是拉丁美洲地区受到长枪党影响而形成的一套政治理论体系与实践运动。其追随者，如同他们在西班牙的意识形态同源，普遍认同某种形式的西班牙至上主义。然而，拉丁美洲独特的历史背景和社会现实，使得拉美长枪主义者对这一概念的理解呈现出显著的分歧。一部分人将其诠释为一种民族解放思潮，旨在团结西班牙语世界，帮助西班牙裔社群摆脱盎格鲁-撒克逊主导的文化、政治和经济秩序，并重塑基于共同语言、历史和天主教传统的集体认同。在思想内核上，拉丁长枪主义融合了极权主义、国家工团主义、整合民族主义、行会社会主义。同时，它坚定地支持并捍卫天主教的道德准则与社会价值观，将其视为社会秩序和个体行为的基石。\n\n拉美长枪主义者的行动，很大程度上是对二十世纪以来南美地区特定历史情境的回应。在彼时剧烈的社会动荡中，无政府主义者、工团主义者以及共产主义者发起的激进革命运动，被长枪主义者视为对既有的、以西班牙文化遗产为基础的社会秩序与传统结构的根本性威胁，他们形容这种威胁如同要撕毁整个西班牙裔赖以为生的家园。面对这种被其视为盎格鲁-高卢势力入侵、工团主义和无神论思潮的侵蚀以及国内革命的混乱，拉丁长枪主义者自认为站在了抵抗的最前沿。在一种深切的危机感乃至绝望情绪驱使下，他们倡导超越激烈的阶级斗争，主张通过阶级合作的模式，将国内不同社会阶层：包括工人、农民、实业家等在民族国家与天主教价值观的旗帜下整合起来，构建一个有机的、和谐统一的民族共同体，以此作为对抗内部颠覆力量和外部文化政治影响的堡垒，并寻求实现他们所构想的民族复兴与社会稳定。"

