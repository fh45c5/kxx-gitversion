 natpop_slovak_populism_subtype_desc:0 "§Y斯洛伐克人民主义§!\n\n£GFX_ideology_slovak_peopleism_bar\n\n\n\n\n斯洛伐克人民主义是由斯洛伐克赫林卡人民党创始人安德烈·赫林卡、首席理论家约瑟夫·蒂索以及激进民族主义代表人物沃伊泰克·图卡共同构建并推行的一套系统化政治意识形态。该思想体系以《资本与劳动的权利与义务》与《四十年通谕》为核心理论根基，坚定捍卫基督教伦理价值观，强烈反对社会主义与共产主义所宣扬的阶级斗争理念，同时也对自由主义中的世俗化趋势及放任自流的经济自由主义提出深刻批判，并明确倡导构建一种国家法团主义的社会组织结构。斯洛伐克人民主义以其极端的斯洛伐克民族主义立场而显著区别于其他政治思潮。它不仅强烈抵制当时在斯洛伐克政治环境中占据主导地位的捷克斯洛伐克主义，也对马扎尔人与犹太人表现出鲜明的排斥态度，公开主张将所有犹太人与马扎尔人驱逐出斯洛伐克领土，并致力于“收复”其所认定的历史失地，以实现民族空间的纯粹性。在文化政策方面，斯洛伐克人民主义极力推崇斯洛伐克传统文化以及天主教的支配地位，广泛支持一系列社会保守主义措施，旨在强化民族认同，维护社会结构的统一性与道德纯洁性。"

 popular_legionarism_subtype:0 "大众军团主义"
 popular_legionarism_subtype_desc:0 "§Y大众军团主义§!\n\n大众军团主义是由罗马尼亚军团运动理论家瓦西里·马林所提出的一种政治理论构想。马林主张，各国的军团主义运动应当突破传统极右翼的思想框架，彻底转向革命左翼的立场，实现意识形态的根本转型。在这一理论中，他以社会主义理念为基本结构，对军团主义进行了理论重构，强调其不仅应关注民族认同与集体动员，更须深入社会结构内部，聚焦于弱势群体的生存状况与权利诉求。马林批判将军团主义简单视为情绪煽动工具的做法，认为其必须超越象征性的民族主义口号，转而投身于具体的社会经济议题。他提出，军团主义运动应当同时为民族共同体与贫困公民发声，将民族诉求与阶级平等相结合，从而打破精英政治的垄断，形成具有广泛群众基础的政治力量。在这一过程中，军团主义需完成从“俯视型”政治姿态到“全民参与型”运动的转变，使其真正扎根于社会基层，成为能够代表并凝聚多元社会群体利益的综合性政治实践。"

 anarcho_internationalism_subtype:0 "无政府国际主义"
 anarcho_internationalism_subtype_desc:0 "§Y无政府国际主义§!\n\n无政府国际主义是由波斯尼亚塞尔维亚族理论家弗拉基米尔·加西诺维奇提出的一项新颖理论。加西诺维奇早年在巴黎期间，与列夫·托洛茨基、维克多·塞尔日、尤利乌斯·马尔托夫等一批重要国际主义者往来密切并深受他们国际主义思想的熏陶。在这一思想环境中，他逐渐形成了自己独特的理论视角。与一般无政府主义相同，无政府国际主义从根本上否定国家机器，主张彻底废除一切强制性的统治结构。然而，两者的分歧集中体现在对国际社会主义与无政府主义运动的态度上。大多数无政府主义者往往着眼于本土，致力于在自身所处的土地上推动无政府革命，而对跨越国界的议题兴趣寥寥。无政府国际主义者则清醒地认识到，若各国社会主义者和无政府主义者之间缺乏团结，那么在国内外反动势力的联合绞杀下，任何孤立的革命尝试终将走向失败。乌克兰的马赫诺运动正是这样一个例证，尽管充满理想与勇气，却因未能建立起广泛的国际联合而最终被扑灭。无政府国际主义强调，真正的解放不能仅凭一国之内少数热血志士的孤军奋战而实现，而必须依靠跨国界的协作与联合。在他们看来，只要全球各地的无政府主义者与社会主义者能够携手并进，便能构筑一道不可摧毁的铜墙铁壁。届时，一切反动势力将在日益壮大的无政府国际阴影下颤抖不已。"

 #AD-2
 tot_eternal_revolution_subtype:0 "永恒革命"
 tot_eternal_revolution_subtype_desc:0 "§Y永恒革命§!\n\n£GFX_ideology_eternal_revolution_bar\n\n\n\n\n永恒革命是由乌克兰民族主义组织领导者斯捷潘班德拉总结的意识形态。不同于受东佐夫影响的具有强烈反共产主义、反工团主义倾向的乌克兰民族主义，永恒革命更多地受到了十九世纪乌克兰民族主义、俄罗斯民粹主义、列宁主义、纲领主义、不断革命论及《极权宪章》等多种左翼思想的影响。\n与乌克兰民族主义一样，永恒革命强调保护和发展乌克兰民族文化和传统，不同的是永恒革命具有强烈的反资本主义倾向，并且极力推崇大众暴力与民粹主义，认同在一位“普罗维登尼克”的领导下通过不受限制的革命手段推翻内外压迫者的统治，最终将所有乌克兰人统一在一面旗帜下。\n评论家将斯捷潘班德拉视为恐怖分子，认为他不过是一个投机成功的野蛮独裁者，但是乌克兰的人民不这样想，他们因乌克兰被分裂被奴役数百年而积累起的怒火正在燃烧，他们将追随这位"普罗维登尼克"，用血与铁为乌克兰民族夺回荣耀。"

 pataut_eternal_revolution_subtype:0 "永恒革命"
 pataut_eternal_revolution_subtype_desc:0 "§Y永恒革命§!\n\n£GFX_ideology_eternal_revolution_bar\n\n\n\n\n永恒革命是乌克兰民族主义组织舒赫维奇派主张的意识形态。革新永恒革命反资本主义，反自由主义，反神秘主义，反社会主义，支持狂热的军国主义与民族仇恨，认同严格基于种族的民族主义。\n舒赫维奇派认为班德拉的思想过于激进，过于亲近社会主义，认为东佐夫的思想过于晦涩，无法指导乌克兰民族革命的现实，唯有非意识形态的军国主义与种族主义才能实现民族革命。永恒革命认为乌克兰民族的复兴必须浸透异族与叛徒的鲜血。\n罗曼舒赫维奇，沃伦大屠杀的直接指挥者，除了少数同样疯狂的极端民族主义者将他奉为英雄外，世人都认为这是一头凶狠的野兽，一个纯粹的刽子手。舒赫维奇毫不在意这些评价，他已经将生命交付给乌克兰民族的革命事业，如果乌克兰自由的代价是死一万人就让他死一万人，如果乌克兰自由的代价是世界变成白地就让他如此。"

 cossack_anarchism_subtype:0 "哥萨克无政府主义"
 cossack_anarchism_subtype_desc:0 "§Y哥萨克无政府主义§!\n\n哥萨克无政府主义并非严格意义上的意识形态，而更接近于一种基于历史传统的行动纲领。其理论框架主要由内斯托尔·马赫诺的亲密战友、阿塔曼菲迪尔·舒斯所奠定与发展。舒斯在继承马赫诺改良后的纲领主义基础上，进一步强调以自由苏维埃作为平等社会的组织核心，倡导一种去中心化、自治联合的地区治理模式。\n\n哥萨克无政府主义大力向民众宣扬乌克兰哥萨克的传统精神，尤其是自由、平等与不屈的抗争意志，并号召乌克兰人恢复如扎波罗热哥萨克那般的自由的组织生活与直接民主实践。舒斯将哥萨克传统中的“自由共同体”理念与无政府主义结合，赋予斗争以鲜明的文化身份与历史延续性。因此，哥萨克无政府主义不仅是一种政治主张，更可被视为对乌克兰哥萨克遗产的创造性转化与激进回归。"

 platformism_subtype:0 "平台主义"
 platformism_subtype_desc:0 "§Y平台主义§!\n\n平台主义是一种强调组织有效性与理论统一性的无政府主义革命策略，其名称来源于一批流亡的俄国无政府主义者在巴黎发表的《组织平台》。该文件主要由涅斯托尔·马赫诺运动中的参与者，如彼得·阿尔希诺夫和伊达·梅特等人撰写，旨在回应俄国革命中无政府主义运动组织松散、未能形成持续政治力量的失败。\n\n平台主义主张建立具有统一理论、战略和集体纪律的共同组织，以避免运动碎片化并增强革命实效。其核心原则包括理论一致、战术统一、集体责任与联邦自治。平台主义者认为，无政府主义者应在一个明确和共同的政治框架内行动，并通过具有阶级立场、面向大众的组织，推动建立自由的联邦式自治公社，最终取代资本主义和国家主义结构。\n\n尽管平台主义最初在无政府主义内部引发广泛争议，批评者认为其过于集中化、有偏离自治原则的风险，但平台主义仍对诸多无政府主义组织产生了深远影响。"

 military_anarchism_subtype:0 "军事无政府主义"
 military_anarchism_subtype_desc:0 "§Y军事无政府主义§!\n\n军事无政府主义是无政府主义在实践过程中演变出的一个分支，其理论雏形主要源于参与过马赫诺运动的警戒无政府组织联盟成员阿隆·巴伦的论述，以及西班牙巴塞罗那的无政府主义秘密警察组织公共调查委员会的实际经验。尽管无政府主义一贯主张废除一切权威、摧毁国家暴力机器，但在现实斗争中，无政府主义者往往不得不与他们极力反对的力量：军队，进行合作。随着革命形势的发展，这种合作不断深化，最终逐渐形成一种独特的社会形态：无政府主义者领导着一支等级森严、规模庞大的军事力量，并通过高度集中甚至近乎极权的手段，以捍卫公社的独立与自由。\n\n从根本上看，军事无政府主义社会被视为通向真正自由的无政府主义社会的一种过渡阶段。然而，在这一过程中，也屡屡出现野心家以过渡为名，攫取权力与财富，背离无政府主义的初衷。"

 tot_moral_discipline_system_subtype:0 "道德规训体制"
 tot_moral_discipline_system_subtype_desc:0 "§Y道德规训体制§!\n\n极端进步主义与敌基督势力正日益侵蚀传统道德体系的根基，将人类推向堕落与混乱的深渊，恶魔们正以同性恋、跨性别、逆向民族主义、反传统主义的新面孔重现世间。面对这一危机，道德规训体制应运而生，旨在遏制社会持续滑向道德沦丧的趋势。该体制融汇了各大教法流派的核心戒律，虽不否定民主制度本身，却坚决批判无节制、过度扩张的“野蛮民主”，视其为对人类文明的严重威胁。在道德规训的框架下，民主不再是一种放任自流的治理方式，而是经过严格约束与引导，成为传播道德福音、推动社会向真正进步与团结迈进的有效工具，社会与国家将由真正忧虑人类未来的道德崇高者全方面掌控规划。\n\n尽管道德规训体制最初由一批深感忧虑的基督教徒发起，其基础并不依赖于传统宗教组织。相反，该体制认为诸如神父、主教和大主教等宗教权威早已受到腐蚀，失去了代行神旨的合法性。因此，道德规训体制试图超越教阶制度的局限，直接诉诸道德律法与集体理性。其追随者视该体制为人类实现道德重建与精神救赎的根本路径，相信唯有通过严格的道德规训，人类社会才能重返道德的高地与精神的和谐。"

