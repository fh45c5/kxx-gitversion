 zhanguoce_pai_subtype:0 "战国策派"
 zhanguoce_pai_subtype_desc:0 "§Y战国策派§!\n\n£GFX_ideology_zhanguoce_pai_bar\n\n\n\n\n战国策派，亦称战国派，是以林同济、雷海宗、陈铨等留德学者为核心的一个思潮流派。因其创立《战国策》半月刊，借尼采“超人哲学”宣扬非理性民族主义与国家至上的权威主义理念，由此得名。该流派将世界局势比作战国时代的“大政治”格局，认为民主制度导致政出多门，主张在民族存亡关头奉行“尚力政治”与“国家至上”原则，强调唯有通过民族精神的重塑与集中国力方能抵御外侮。\n在具体的文化主张上，战国策派借鉴了西方思想史的诸多概念，提出“文化统相法”，强调从整体性把握文明的“民族精神”，并据此重审五四运动，肯定其个性解放之功劳，同时也认为"五四"运动没有像德国的"狂飙运动"那样形成一种民族意识普遍觉醒的运动，使中国失去了积蓄力量的机会。因此，他们借鉴尼采所提出的日神精神与酒神精神二元对立论，呼吁以狄俄尼索斯式的“酒神精神”改造国民性，提倡打破传统礼教的“怕”之桎梏，锻造“敢于做平生不敢做之事”的强力人格，通过“力之组织”实现民族“自存自强”。"

 jihad_legionarism_subtype:0 "伊斯兰军团主义"
 jihad_legionarism_subtype_desc:0 "§Y伊斯兰军团主义§!\n\n£GFX_ideology_jihad_legionarism_bar\n\n\n\n\n伊斯兰军团主义是伊斯兰主义在面对西方世界的军事和文化冲击时产生的变种。不同于传统的更倾向保守主义、扎根家庭与乡村的伊斯兰主义，伊斯兰军团主义在组织模式和动员方式上更加西化，更多的依靠政党政治和民兵部队。伊斯兰军团主义学习其他极右翼政治团体的组织模式，将伊斯兰教法和古兰经作为行动准则，又掺杂了种族民族主义和犹太资本阴谋论。\n\n伊斯兰教法教育穆斯林和善友爱，而伊斯兰军团主义者对这些训诫嗤之以鼻，真主至大，但是对民族和教派敌人就要不择手段。欺诈，刺杀，恐怖袭击，这就是穆贾希德的生活。"

 pataut_jihad_legionarism_subtype:0 "伊斯兰军团主义"
 pataut_jihad_legionarism_subtype_desc:0 "§Y伊斯兰军团主义§!\n\n£GFX_ideology_jihad_legionarism_bar\n\n\n\n\n伊斯兰军团主义是伊斯兰主义在面对西方世界的军事和文化冲击时产生的变种。不同于传统的更倾向保守主义、扎根家庭与乡村的伊斯兰主义，伊斯兰军团主义在组织模式和动员方式上更加西化，更多的依靠政党政治和民兵部队。伊斯兰军团主义学习其他极右翼政治团体的组织模式，将伊斯兰教法和古兰经作为行动准则，又掺杂了种族民族主义和犹太资本阴谋论。\n\n伊斯兰教法教育穆斯林和善友爱，而伊斯兰军团主义者对这些训诫嗤之以鼻，真主至大，但是对民族和教派敌人就要不择手段。欺诈，刺杀，恐怖袭击，这就是穆贾希德的生活。"

 socdem_islamic_philosophy_subtype:0 "伊斯兰教哲学"
 socdem_islamic_philosophy_subtype_desc:0 "§Y伊斯兰教哲学§!\n\n£GFX_ideology_islamic_philosophy_bar\n\n\n\n\n伊斯兰教哲学并非单一思想体系，而是指在伊斯兰文明框架内，吸收、融合并发展希腊、波斯、印度等多元思想遗产，围绕伊斯兰核心教义进行系统性理性探索的庞大知识传统。其诞生于8世纪阿拔斯王朝“百年翻译运动”的沃土，学者们将浩瀚的希腊、叙利亚、波斯典籍译为阿拉伯语，为哲学思辨奠定了知识基础。早期代表人物如肯迪作为首位阿拉伯血统的哲学家，致力于调和启示与理性，论证哲学与神学的兼容性。\n伊斯兰教哲学的思想高峰体现在法拉比的“第二导师”式综合中，他构建了基于新柏拉图主义流溢说的宏大形而上学体系，探讨了从神圣的太一到物质世界的层级秩序，并深入思考了理想城邦的政治哲学。集大成者伊本·西那（阿维森纳）以其精密逻辑、独创的存在论以及对灵魂、认识论和医学的深刻阐述，深刻影响了中世纪经院哲学。而伊本·鲁世德（阿威罗伊）则以其对亚里士多德的忠实注释和“双重真理”（哲学理性真理与神学启示真理可并行不悖）理论闻名，其思想成为欧洲亚里士多德主义复兴的核心动力。\n伊斯兰哲学并非纯然书斋学问，其涉及存在论、认识论、灵魂论、政治哲学、伦理学的精深探讨，深刻回应了伊斯兰社会面临的信仰、知识、治理等核心问题，构建了独特而辉煌的“伊斯兰黄金时代”思想图景，并成为沟通古希腊与中世纪欧洲及犹太教哲学不可或缺的桥梁。尽管其后受到如安萨里《哲学家的矛盾》对哲学家形而上学的著名批判等冲击而转入调整期，其思想遗产仍持续在伊斯兰世界内外产生深远回响。"

 soclib_islamic_philosophy_subtype:0 "伊斯兰教哲学"
 soclib_islamic_philosophy_subtype_desc:0 "§Y伊斯兰教哲学§!\n\n£GFX_ideology_islamic_philosophy_bar\n\n\n\n\n伊斯兰教哲学并非单一思想体系，而是指在伊斯兰文明框架内，吸收、融合并发展希腊、波斯、印度等多元思想遗产，围绕伊斯兰核心教义进行系统性理性探索的庞大知识传统。其诞生于8世纪阿拔斯王朝“百年翻译运动”的沃土，学者们将浩瀚的希腊、波斯等古国典籍译为阿拉伯语，为哲学思辨奠定了知识基础。早期代表人物如肯迪作为首位阿拉伯血统的哲学家，致力于调和启示与理性，论证哲学与神学的兼容性。\n伊斯兰教哲学的思想高峰体现在法拉比的“第二导师”式综合中，他构建了基于新柏拉图主义流溢说的宏大形而上学体系，探讨了从神圣的太一到物质世界的层级秩序，并深入思考了理想城邦的政治哲学。集大成者伊本·西那（阿维森纳）以其精密逻辑、独创的存在论以及对灵魂、认识论和医学的深刻阐述，深刻影响了中世纪经院哲学。而伊本·鲁世德（阿威罗伊）则以其对亚里士多德的忠实注释和“双重真理”理论闻名，其思想成为欧洲亚里士多德主义复兴的核心动力。\n伊斯兰哲学并非纯然书斋学问，其涉及存在论、认识论、灵魂论、政治哲学、伦理学的精深探讨，深刻回应了伊斯兰社会面临的信仰、知识、治理等核心问题，构建了独特而辉煌的“伊斯兰黄金时代”思想图景，并成为沟通古希腊与中世纪欧洲及犹太教哲学不可或缺的桥梁。尽管其后受到如安萨里《哲学家的矛盾》对哲学家形而上学的著名批判等冲击而转入调整期，其思想遗产仍持续在伊斯兰世界内外产生深远回响。"

