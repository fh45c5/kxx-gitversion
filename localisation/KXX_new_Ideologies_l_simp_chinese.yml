 tot_regenerationism_subtype_desc:0 "§Y再生主义§!\n\n£GFX_ideology_regenerationism_bar\n\n\n\n\n再生主义（Regeneracionismo）是 19 世纪末和 20 世纪初西班牙的一场思想和政治运动。它力求对西班牙作为一个国家衰落的原因进行客观和科学的研究，并提出补救措施。再生在近年来成为了政治腐败的反义词，再生主义知识分子希望形成一种新的、真实的西班牙观念，为此，他们试图通过在广为流传的杂志上传播研究成果，揭露西班牙官方的欺骗行为。再生主义者力求做到客观、纪实和科学，宣扬良知与自由，在内战爆发之后，再生主义作家埃内斯托·希梅内斯·卡瓦列罗跟随了国家工团主义进攻委员会，并且在国家工团主义进攻委员会的支持下成为了再生主义的新领导者并且使再生主义达到了新高潮。"

 tot_surrealism:0 "超现实主义"
 tot_surrealism_desc:0 "§Y超现实主义§!\n\n£GFX_ideology_surrealism_bar\n\n\n\n\n生死之间的界线毫发丝粟、存在着一根细线——即此生与来世间熠熠闪光的银线。澳大利亚土著文化中，土地本源便生从此线，他们称其为“梦幻”。超现实主义便从这罅隙——世界间梦幻般的裂缝之中孕育而出。\n\n尽管他可能期望这就是现实，但超现实主义并非完全由安德烈·布勒东头脑构建。而是由空军中队的纪尧姆·阿波利奈尔创造的术语，最初用于描述埃里克·萨蒂的音乐；一个超越现实的现实。由此，同名的艺术运动开始形成，但超现实主义的教宗并非阿波利奈尔，而是前文提到的布勒东——他的双重宣言定义了这种形式，并被后世称作“超现实的双遗嘱”。\n\n然而，直到1927年，超现实主义才从艺术跃升向政治，超现实主义者因同阿尔托竞争市长之位而被逐出工人国际法国支部，促使他们创造了自己的载体：法兰西超现实主义党。很快，该党便被其领袖所掌控，而超现实主义也开始化作19世纪的乌托邦社会主义和20世纪的先锋派间乱伦孕育的私生子而完全成形。\n\n虽然有些左翼人士只是简单地谴责超现实主义不过是以俾斯麦式宣扬的“布勒东修正主义”，对着无产阶级放卫星，但运动本身的分支远超出了其创始人张口就来的话语。现代性带来的原始力量、无意识对有意识的优越性、形而上学对唯物辩证的胜利、对现实的撕裂等；这些概念被众人分享，并以各种不同方式执行——名为超现实主义的花束百花齐放。毕竟在一个二和二的逻辑造就工业屠杀的世界里，谁还能责怪那些敢于梦想超越现实的人呢？"

 ustase_subtype:0 "乌斯塔沙"
 ustase_subtype_desc:0 "§Y乌斯塔沙§!\n\n£GFX_ideology_ustase_bar\n\n\n\n\n乌斯塔沙本质上并非系统化的意识形态体系，而是特指二十世纪初克罗地亚革命运动中形成的特殊斗争传统。其核心思想建立在激进的克罗地亚民族主义与极端排外主义之上，与具有左翼色彩的革命乌斯塔沙组织存在本质区别。这个极右翼恐怖组织的行动纲领充满暴力色彩，主张通过刺杀殖民官员、制造爆炸事件、系统性清洗外族聚居区等极端手段，实现克罗地亚民族从"异族枷锁"中的彻底解放。\n\n该组织在伊利里亚联邦成立后迅速衰落，超过七成核心成员选择加入新政府体系，残余势力则在联邦安全部队持续清剿下转入地下。然而近年来奥地利帝国推行中央集权改革，逐步削减克罗地亚自治权并强化德语官方地位，导致民族矛盾急剧激化。在这种背景下，沉寂多年的乌斯塔沙组织以"自由十字军"的名义死灰复燃。他们重组为蜂窝状地下网络，在萨格勒布大学与达尔马提亚造船厂秘密发展青年激进分子，并通过境外民族主义势力获取武器装备。\n\n新世代乌斯塔沙成员延续了铁血传统，但战术手段呈现现代化特征：除传统刀斧刺杀外，开始运用定时炸弹袭击铁路枢纽，通过暗网传播极端民族主义教程，并策划针对奥地利驻军的生化武器袭击。其宣言明确宣称将发动"民族净化圣战"，不仅要终结维也纳的统治，更要彻底清除境内所有非克罗地亚元素，建立从亚得里亚海到多瑙河的"纯血国度"。这种极端主张虽遭主流政治力量谴责，却在经济衰退的农村地区与产业工人群体中持续扩散。"

 national_programmatism:0 "民族纲领主义"
 national_programmatism_desc:0 "§Y民族纲领主义§!\n\n£GFX_ideology_national_programmatism_bar\n\n\n\n\n纲领主义是由米哈伊尔巴枯宁的“组织二元论”发展而来，因内斯托尔.马赫诺在俄国内战期间的实践闻名的一种无政府共产主义派别。纲领主义支持生产资料公有制，鼓励工人反抗国家和资本主义，反对俄罗斯共产主义者的专政倾向。纲领主义者认为在彻底击败国家前，革命者应基于自愿原则加入一个服从多数原则的委员会，实现过渡时期的无产阶级专政并在军事和经济等方面服从委员会的调遣。\n民族纲领主义是纲领主义在内斯托尔马赫诺在乌克兰的革命实践中产生的变种。首先，在纲领主义运动早期，军事指挥部高层对于乌克兰文化的保护和广大乌克兰工农的自然的爱国主义热情就已经使得革命颇具乌克兰民族风格，而随后自由地区出于保护革命的需要吸收了民族共产主义武装后，纲领主义运动更是迅速且彻底地倒向民族主义——从要求废除民族，废除边界转而改为要求实现乌克兰民族独立，建立一个委员会共产主义国家。在自由地区沦陷后，马赫诺逃往了法兰西公社，战间期波兰地主压迫西乌克兰农民和德国盘剥乌克兰农业经济等事实刺激了马赫诺进一步转向民族主义。甚至有人说马赫诺本人直接参与了乌克兰民族主义组织的建立。\n民族纲领主义者被共产主义者指责为有帝国主义作风，被无政府主义者指责为有波拿巴倾向，而他们认为这些评价与乌克兰祖国相比不名一文。民族纲领主义者恪守马赫诺的宣言，永远作为民族独立与社会革命的先锋：没有民族解放，乌克兰人民的社会解放是不可能的，社会和民族解放的实现将取决于乌克兰人在乌克兰的统治！"

 tot_eternal_revolution:0 "永恒革命"
 tot_eternal_revolution_desc:0 "§Y永恒革命§!\n\n£GFX_ideology_eternal_revolution_bar\n\n\n\n\n永恒革命是由乌克兰民族主义组织领导者斯捷潘班德拉总结的意识形态。不同于受东佐夫影响的具有强烈反共产主义、反工团主义倾向的乌克兰民族主义，永恒革命更多地受到了十九世纪乌克兰民族主义、俄罗斯民粹主义、列宁主义、纲领主义、不断革命论及《极权宪章》等多种左翼思想的影响。\n与乌克兰民族主义一样，永恒革命强调保护和发展乌克兰民族文化和传统，不同的是永恒革命具有强烈的反资本主义倾向，并且极力推崇大众暴力与民粹主义，认同在一位“普罗维登尼克”的领导下通过不受限制的革命手段推翻内外压迫者的统治，最终将所有乌克兰人统一在一面旗帜下。\n评论家将斯捷潘班德拉视为恐怖分子，认为他不过是一个投机成功的野蛮独裁者，但是乌克兰的人民不这样想，他们因乌克兰被分裂被奴役数百年而积累起的怒火正在燃烧，他们将追随这位"普罗维登尼克"，用血与铁为乌克兰民族夺回荣耀。"

 pau_eternal_revolution:0 "永恒革命"
 pau_eternal_revolution_desc:0 "§Y永恒革命§!\n\n£GFX_ideology_eternal_revolution_bar\n\n\n\n\n永恒革命是乌克兰民族主义组织舒赫维奇派主张的意识形态。革新永恒革命反资本主义，反自由主义，反神秘主义，反社会主义，支持狂热的军国主义与民族仇恨，认同严格基于种族的民族主义。\n舒赫维奇派认为班德拉的思想过于激进，过于亲近社会主义，认为东佐夫的思想过于晦涩，无法指导乌克兰民族革命的现实，唯有非意识形态的军国主义与种族主义才能实现民族革命。永恒革命认为乌克兰民族的复兴必须浸透异族与叛徒的鲜血。\n罗曼舒赫维奇，沃伦大屠杀的直接指挥者，除了少数同样疯狂的极端民族主义者将他奉为英雄外，世人都认为这是一头凶狠的野兽，一个纯粹的刽子手。舒赫维奇毫不在意这些评价，他已经将生命交付给乌克兰民族的革命事业，如果乌克兰自由的代价是死一万人就让他死一万人，如果乌克兰自由的代价是世界变成白地就让他如此。"

 ukrainian_social_nationalism:0 "乌克兰社会民族主义"
 ukrainian_social_nationalism_desc:0 "§Y乌克兰社会民族主义§!\n\n乌克兰社会民族主义是一种乌克兰民族主义在乌克兰民族主义组织激进派中的变体。不同于传统的受东佐夫影响的乌克兰民族主义，乌克兰社会民族主义更多地受到了19世纪乌克兰民族主义、俄罗斯民粹主义、列宁的革命观、平台主义、托洛斯基的不断革命论及《极权宪章》等左翼革命思想的影响。乌克兰社会民族主义者和乌克兰民族主义者一样，强调保护和发展乌克兰民族文化和传统，并且推崇大众暴力与民粹主义，认同在一位“普罗维登尼克”的领导下通过革命手段推翻莫斯科的统治，建立一个乌克兰主权国家。不同的是，乌克兰社会民族主义者主张解放俄罗斯境内被莫斯科压迫的各民族，而非实现某种程度上的“乌克兰帝国主义”，要求推翻资产阶级的统治，进行土地革命，实现工人自治，最终建成一个无阶级的社会主义乌克兰民族国家。"

 ukrainian_social_nationalism_tot:0 "乌克兰社会民族主义"
 ukrainian_social_nationalism_tot_desc:0 "§Y乌克兰社会民族主义§!\n\n乌克兰社会民族主义是一种乌克兰民族主义在乌克兰民族主义组织激进派中的变体。不同于传统的受东佐夫影响的乌克兰民族主义，乌克兰社会民族主义更多地受到了19世纪乌克兰民族主义、俄罗斯民粹主义、列宁的革命观、平台主义、托洛斯基的不断革命论及《极权宪章》等左翼革命思想的影响。乌克兰社会民族主义者和乌克兰民族主义者一样，强调保护和发展乌克兰民族文化和传统，并且推崇大众暴力与民粹主义，认同在一位“普罗维登尼克”的领导下通过革命手段推翻莫斯科的统治，建立一个乌克兰主权国家。不同的是，乌克兰社会民族主义者主张解放俄罗斯境内被莫斯科压迫的各民族，而非实现某种程度上的“乌克兰帝国主义”，要求推翻资产阶级的统治，进行土地革命，实现工人自治，最终建成一个无阶级的社会主义乌克兰民族国家。"

 popular_legionism:0 "大众军团主义"
 popular_legionism_desc:0 "§Y大众军团主义§!\n\n£GFX_ideology_popular_legionism_bar\n\n\n\n\n大众军团主义又称白鹰队主义，是铁卫团白鹰运动的主流思想，不同于铁卫团大多数团员信仰的科德里亚努军团主义，大众军团主义则更加的具有革命性质，在对于资产阶级的态度上毫不妥协，同时相比于铁卫团的农本主义，大众军团主义更加注重工人阶级的力量。白鹰队的成员狂热的坚信只有大众军团主义才能将罗马尼亚从国王、资产阶级、叛徒的手里拯救出来并且将罗马尼亚民族带向真正的复兴之路。"

 revolutionary_chetnikism:0 "革命切特尼克主义"
 revolutionary_chetnikism_desc:0 "§Y革命切特尼克主义§!\n\n£GFX_ideology_revolutionary_chetnikism_bar\n\n\n\n\n切特尼克，最初起源于19世纪初部队军事概念的形成。在此期间，有组织的土匪团体在土耳其占领者中散布恐惧。后来，这些编队的成员被称为切特尼克人。这些编队是战斗志愿者组织，其成员是保卫濒临灭绝的塞族人民的精英战士。这些编队的每个成员都必须准备为塞尔维亚人民的自由和荣誉牺牲生命，宣誓：“自由或死亡”和“相信上帝，为国王和祖国”。在土耳其统治巴尔干半岛时，切特尼克运动唤醒了争取解放斗争的人民群众。20世纪初，由于奥匈帝国进攻猛烈，塞尔维亚不断的向后撤退，大批大批的国土沦为了奥匈帝国占领区，但是这些占领区的塞尔维亚人并没有放弃抵抗，而是组成了新切特尼克军，并且宣布将与奥匈帝国斗争到底，但是战争很快就结束了，懦弱的塞尔维亚政府宣布了投降，而在占领区抵抗的新切特尼克军并没有得知这个消息，依旧在进行着斗争运动，当他们得知塞尔维亚投降的消息后，既震惊又愤怒，每一个新切特尼克军的成员都在用着最恶毒的语言诅咒着塞尔维亚王国政府，不过他们并没放弃抵抗，新生的法兰西公社向他们派遣了教导队，在教导队的教育下，新切特尼克军的游击队员们接受到了工团主义思想，但是仍然保留着强烈的民族主义情绪，在进行重组后，新切特尼克军改组为革命切特尼克军，誓要将被压迫的南斯拉夫从奥匈外族人、克罗地亚叛徒与邪恶的资产阶级手里解救出来。"

 syrian_social_nationalism:0 "叙利亚社会民族主义"
 syrian_social_nationalism_desc:0 "§Y叙利亚社会民族主义§!\n\n£GFX_ideology_ssnp_bar\n\n\n\n\n叙利亚社会民族主义又称萨阿德主义，是叙利亚社会民族党的主流思想，叙利亚社会民族党于1932年由黎巴嫩知识分子安东·萨阿德在贝鲁特创立，作为一个敌视奥斯曼殖民统治的反殖民政治组织，叙利亚社会民族主义结合了浪漫主义、合作经济、人本的民主民族主义、理性主义、自由、斗争与美德并且结合了社会主义等概念，主张发起叙利亚革命唤醒民族力量，反对全球主义、锡安主义、各种形式的种族主义和霸权主义的运动的出现，不同于其它阿拉伯人那样野蛮而又狂热的民族主义，作为知识分子萨阿德创立的叙利亚社会民族主义更显文明。"

 arab_socialism:0 "阿拉伯社会主义"
 arab_socialism_desc:0 "§Y阿拉伯社会主义§!\n\n£GFX_ideology_arab_socialism_bar\n\n\n\n\n在本世纪三十年代胡拉尼提出了他的阿拉伯社会主义思想，作为泛阿拉伯主义思想的一个组成部分，其要点是：阿拉伯社会主义的目标应是实现阿拉伯民族的统一，广大阿拉伯劳动人民争取自由、解放的斗争必须要严格的反对帝国主义势力的殖民统治，争取民族解放必须要与阿拉伯民族统一的斗争联系在一起。\n\n阿拉伯社会主义的另一个目标是建立一个更加公正、理智的工团主义经济制度，用它来制止民族内部的仇视和争端，清除一个阶级对另一个阶级的剥削和由此产生的贫穷和愚昧，阿拉伯社会主义不仅要使人不受饥饿，而且要使人们的天赋得到充分的发挥和使用。\n\n除此之外胡拉尼还主张阿拉伯社会主义应该继承起源于伊斯兰和阿拉伯民族精神和文化传统，并表达阿拉伯民族崇高的道德品质。"

 radsoc_arab_socialism:0 "阿拉伯社会主义"
 radsoc_arab_socialism_desc:0 "§Y阿拉伯社会主义§!\n\n£GFX_ideology_arab_socialism_bar\n\n\n\n\n在本世纪三十年代胡拉尼提出了他的阿拉伯社会主义思想，作为泛阿拉伯主义思想的一个组成部分，其要点是：阿拉伯社会主义的目标应是实现阿拉伯民族的统一，广大阿拉伯劳动人民争取自由、解放的斗争必须要严格的反对帝国主义势力的殖民统治，争取民族解放必须要与阿拉伯民族统一的斗争联系在一起。\n\n阿拉伯社会主义的另一个目标是建立一个公正的、理智的经济制度，用它来制止民族内部的仇视和争端，清除一个阶级对另一个阶级的剥削和由此产生的贫穷和愚昧，阿拉伯社会主义不仅要使人不受饥饿，而且要使人们的天赋能到充分的发挥和使用。\n\n除此之外胡拉尼还主张阿拉伯社会主义应该继承起源于伊斯兰和阿拉伯民族精神和文化传统，并表达阿拉伯民族崇高的道德品质。"

 antoun_saadeh_thought_subtype:0 "安东·萨阿德思想"
 antoun_saadeh_thought_subtype_desc:0 "§Y安东·萨阿德思想§!\n\n£GFX_ideology_ssnp_bar\n\n\n\n\n安东·萨阿德思想，又叫叙利亚社会民族主义，是一种独特的意识形态，由叙利亚社会民族党创始人安东·萨阿德一手打造。这种思想的核心是对“大叙利亚”的认同，这个国家的疆土囊括黎凡特、伊拉克、库尔德斯坦、胡齐斯坦、西奈半岛和塞浦路斯。安东·萨阿德和他的拥趸们反对工团主义、共产主义与民主主义，并坚信根植于自由、责任、纪律与力量这四种精神品质的社会民族主义才是叙利亚民族，乃至人类的最终出路。"

 pan_turkism:0 "泛突厥主义"
 pan_turkism_desc:0 "§Y泛突厥主义§!\n\n£GFX_ideology_pan_turkism_bar\n\n\n\n\n泛突厥主义是突厥语民族面对日益严峻的殖民主义和帝国主义的反击，它在沙俄鞑靼贫农中产生，于中亚的知识分子间传播，并最终在三帕夏政府造出的血泊中映出它的真容。\n\n多数泛突厥主义者认同威权主义制度，鼓吹军国主义，信仰伊斯兰教或者突厥传统宗教。但是也存在支持民主制度，甚至倒向了社会主义的泛突厥主义者。\n\n时代发展，局势变幻，泛突厥主义产生了越来越多的分支，但他们拥有一个共同不变的内核：突厥语民族实现统一。"

 technocratic_pan_turkism:0 "技官泛突厥主义"
 technocratic_pan_turkism_desc:0 "§Y技官泛突厥主义§!\n\n£GFX_ideology_technocratic_pan_turkism_bar\n\n\n\n\n泛突厥主义是突厥语民族面对日益严峻的殖民主义和帝国主义的反击，它在沙俄鞑靼贫农中产生，于中亚的知识分子间传播，并最终在三帕夏政府造出的血泊中映出它的真容。\n\n技官泛突厥主义是泛突厥主义的变种。技官泛突厥主义不同于主张伊斯兰教或者突厥民族传统信仰的其他泛突厥思潮，技官泛突厥主义对宗教持开放的态度并支持科学技术的发展进步。\n\n技官泛突厥主义者认为以自由的个人结成平等的社团是全体突厥民族的唯一出路，他们也将不计牺牲地在历史的黑暗中劈开一条突厥民族的光明前路。"

 red_turanianism:0 "红人图兰主义"
 red_turanianism_desc:0 "§Y红人图兰主义§!\n\n£GFX_ideology_pan_turanism_bar\n\n\n\n\n图兰主义与世上万千族群民族主义一样，是弱小民族面对强大民族的侵略扩张时的回应，是同根兄弟的寻根之旅和回归正道的救赎，是为保全正义，奢求和平的无奈之举。而图兰主义者认为芬兰人、匈牙利人、突厥人、韩国人、蒙古人和日本人等阿尔泰语系民族有相同祖先，相同血脉。主张建立一个从芬兰到日本的庞大图兰帝国，恢复图兰民族的再融合，以进大同。\n\n红人图兰主义由灰狼团成员、奥斯曼帝国政治家雷哈·奥古兹·图尔坎提出。红人图兰主义是一种比图兰主义更激进的意识形态，红人图兰主义者认为美洲原住民实际上是穿过白令海峡的图兰人，要求将美洲划入图兰民族的应许之地。与其他的图兰主义者相比，红人图兰主义者更追求在科学上确立图兰人种的优越性，更推崇种族民族主义和基因上的纯净。红人图兰主义者还要求在社会层面实现军事化、集权化，不惜代价地实现图兰民族统一。"

 soccon_kemalism_subtype:0 "凯末尔主义"
 soccon_kemalism_subtype_desc:0 "§Y凯末尔主义§!\n\n£GFX_ideology_kemalism_bar\n\n\n\n\n“凯末尔主义”一词是指从奥斯曼大维齐尔穆斯塔法·凯末尔帕夏及其领导下的奥斯曼人民党的政治思想中产生的意识形态。这种典型的土耳其式意识形态致力于将老朽的奥斯曼帝国集权化并积极地实现现代化。凯末尔主义支持基于欧洲模式的世俗主义，认为只有通过将伊斯兰教从社会与政治生活中排除出去才能实现现代化，这让该主义备受宗教机构与苏丹亲信的批评。另一方面，凯末尔主义又通过宣扬土耳其民族主义并压制威胁帝国存亡的少数民族的分离主义来进行国家的集权化。这种意识形态在土耳其影响正盛，其虽招致了一些批评，但也被认为是解决欧洲病夫的痼疾的主要办法之一。"

 tot_zionism:0 "劳工锡安主义"
 tot_zionism_desc:0 "§Y劳工锡安主义§!\n\n£GFX_ideology_tot_zionism_bar\n\n\n\n\n锡安主义，或者说是犹太复国主义，是一种主张流浪世界各地的犹太人“返回”巴勒斯坦祖地组建犹太民族国家的思潮。锡安山是古犹太王国的政治中心，犹太民族流亡后用锡安代指以色列故乡，这就是锡安主义名称的由来。\n\n在早期，锡安主义只能说是一种流亡者情结而非一种意识形态，直到拿破仑战争后，民族意识觉醒，在各国备受歧视排挤的犹太人开始产生脱离欧洲建立犹太民族国家的愿望。这时的锡安主义往往与社会主义议题结合起来，因为犹太人劳动者处在欧洲各国社会的最底层。\n\n左翼锡安主义可以说是早期锡安主义的继承者，左翼锡安主义者坚持社会主义的经济和政治组织模式，在一定程度上反对民族压迫，但是在劳工锡安主义者的构想中，犹太人还是享有更全面的权利，阿拉伯人只能处在从属位置。"

 radsoc_zionism:0 "劳工锡安主义"
 radsoc_zionism_desc:0 "§Y劳工锡安主义§!\n\n£GFX_ideology_tot_zionism_bar\n\n\n\n\n锡安主义，或者说是犹太复国主义，是一种主张流浪世界各地的犹太人“返回”巴勒斯坦祖地组建犹太民族国家的思潮。锡安山是古犹太王国的政治中心，犹太民族流亡后用锡安代指以色列故乡，这就是锡安主义名称的由来。\n\n在早期，锡安主义只能说是一种流亡者情结而非一种意识形态，直到拿破仑战争后，民族意识觉醒，在各国备受歧视排挤的犹太人开始产生脱离欧洲建立犹太民族国家的愿望。这时的锡安主义往往与社会主义议题结合起来，因为犹太人劳动者处在欧洲各国社会的最底层。\n\n左翼锡安主义可以说是早期锡安主义的继承者，左翼锡安主义者坚持社会主义的经济和政治组织模式，在一定程度上反对民族压迫，但是在劳工锡安主义者的构想中，犹太人还是享有更全面的权利，阿拉伯人只能处在从属位置。"

 socdem_zionism:0 "劳工锡安主义"
