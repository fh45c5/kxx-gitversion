 kokubo_kokka_subtype:0 "国防国家"
 kokubo_kokka_subtype_desc:0 "§Y国防国家§!\n\n£GFX_ideology_gokuhou_gokka_bar\n\n\n\n\n战争乃是创造之父，文化之母。国家之间的竞争，正是其生命的发展、文化的创造的动机与刺激。而为了遭受列强重压的皇国，陆军军部中一批以永田铁山为首的青年将校，亦即“统制派”提出了建设“国防国家”的要求。在这些将校的眼中，现代战争并非是单纯的武力比拼，而是综合各自经济、政治、思想等综合国力的总较量。因此，统制派认为，应该对于国家的诸国防要素进行彻底的组织统制，在经济方面全面推行统制经济，消除其个人主义因素，推进“军财抱和体制”，如有必要的话实施接近“社会主义”的国有化措施也在所不惜；在政治方面，统制派同样要求建立举国一致的军国主义体制，彻底改造甚至摒弃低效的政党政治；而在思想方面，统制派要求对全社会进行总体的思想统制，注重对国民的皇民思想教化和宣传战体系的整备，从而避免类似于英法的赤化悲剧。如此，才能将皇国建设为高度的国防国家，从而突破当今的国难，在未来和列强的最终竞争中生存，使皇国皇祚长存八千代。"

 natpop_kokubo_kokka_subtype:0 "国防国家"
