 autdem_shintaisei_subtype:0 "新体制"
 autdem_shintaisei_subtype_desc:0 "§Y新体制§!\n\n£GFX_ideology_shintaisei_bar\n\n\n\n\n亚洲惨遭西方奴役者围困之际，救亡图存的重任落在了近卫文麿公爵的肩头。在德意志帝国这一“黄祸论”拥趸胜利的刺激下，早年曾接触过社会主义的近卫文麿，如今建构出了一套日本社会一统的宏图：铲除贪婪的财阀和奸猾的政客，建立起“新体制”。新体制这套国家工团主义理念得到了皇道派及其思想旗手荒木贞夫的狂热拥护，因近卫文麿和荒木贞夫皆坚信：天皇、国土与国民乃浑然天成之整体，唯有剜除奸佞之徒播撒的分裂毒瘤，帝国之国体方能永葆康健，凌驾于日本诸岛之外的一切疆域。\n\n大政翼赞会是近卫文麿实施抱负的核心载体，其将取代一切政党，让普选真正选出德配其位的民意代表——民众仍可自主参选，但绝不容赤色煽动者蛊惑人心，背离菊花御座。除推行乡村建设与法团改革等内政，近卫文麿更秉持泛亚信条：既然大和魂注定了日本的卓尔不群，大和民族便当以严父之姿引领亚洲诸胞。日本之雄踞大陆，必将催生出一种能够抵御西方颓废之风的新文化，永固主权根基。届时，新体制将君临东亚，凭万民赤诚之心向寰宇受压迫者投射曙光，让自由的朝日挣断欧罗巴的枷锁。"

