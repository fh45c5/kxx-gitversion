 stsiborskyi_thought_subtype:0 "斯博齐斯基思想"
 stsiborskyi_thought_subtype_desc:0 "§Y斯博齐斯基思想§!\n\n尼古拉·斯博齐斯基的思想在意识形态谱系中显得颇为异质，甚至常被视作一种“怪胎”。作为乌克兰军事组织的重要理论家，斯博齐斯基提出了一套复杂且具有张力的政治理念。他虽认同国家工团主义的经济与社会组织原则，却强烈反对其常见的威权与独裁倾向。然而，这并不意味着他倾向于西方民主制度；相反，他对自由主义民主同样持批判态度。\n\n斯博齐斯基所设想的，是一种以“人民政治”为核心的国家运作模式。他主张通过基层委员会、代表会议等机制实现社会自我治理，强调决策应从社区和生产单位中自发产生，而非依赖上层强权或政党官僚。西方学术界将这一体系概括为“委员会国家工团主义”的一种变体，尽管其本身具有强烈的本土实践色彩。\n\n尽管斯博齐斯基的思想在表面上显得矛盾甚至混杂，其根本目标始终是为处于压迫中的乌克兰民族寻求一条政治上的新路径。他既拒绝依附于西欧的工团主义革命路线，也不认可远在大洋彼岸的所谓“民主灯塔”。他所追求的，是一条基于民族自主、社会自治与直接政治参与的第三条道路。尽管在乌克兰政治中未成为主流，但他的理论尝试仍体现了小民族在强权格局中寻求意识形态出路的艰难努力。"

 social_populism_subtype:0 "社会民粹主义"
 social_populism_subtype_desc:0 "§Y社会民粹主义§!\n\n£GFX_ideology_social_populism_bar\n\n\n\n\n社会民粹主义，亦称民族社会民主主义或民族进步主义，通常指那些带有民族主义或国家主义倾向的社会民主主义者。该思潮的典型代表包括德国社会民主党与由西蒙·彼得留拉所领导的乌克兰社会民主工人党和在一些民族冲突较为严重的国家和地区的类社会民主主义党派等。\n\n社会民粹主义在社会政治主张上与社会民主主义大体一致，支持渐进式改革与民主制度，但强烈反对第二国际这类国际性社会民主联盟。立场坚定的捍卫本民族利益，反对跨国文化融合与国际范围的社会民主合作。许多国际评论家与哲学家认为，社会民粹主义在某种程度上体现了社会民主主义的一种可能演变结局。"

 marxism_leninism_banderaism_subtype:0 "马列班主义"
 marxism_leninism_banderaism_subtype_desc:0 "§Y马克思列宁班德拉主义§!\n\n马克思列宁班德拉主义并非一种系统化、成体系的意识形态，更确切地说，它是东欧地区广泛存在的民粹主义情绪在乌克兰社会土壤中的一种特殊表现。从列宁主义的理论视角审视，它无法被归类于“科学社会主义”的范畴；在更本质的层面上，它反映的是小资产阶级在特定历史条件下的政治狂热与理想化冲动。1905年革命在俄罗斯帝国内掀起了民粹主义的浪潮，这一过程使民族主义者得以磨练其斗争策略与组织方法。而紧随其后的第一次世界大战与俄国革命，进一步激化了这部分人的政治倾向，使他们日益走向偏执与极端。在他们眼中，暴力与炸弹成了捍卫民族自由唯一可信的手段。俄国旧政权的崩溃，并未给原帝国境内的被殖民民族带来真正的独立曙光，取而代之的是德意志帝国的强势介入，沙皇的专制只不过换成了凯撒的压迫。那些表面上体面的本土资产阶级，面对德国军队的压境，选择了屈服与协作，主动将粮食与矿产资源奉予德国的战争机器，为殖民统治添砖加瓦。\n\n在这样的背景下，布尔什维克的革命论述为这些迷茫而激进的民族主义者提供了一种极具吸引力的叙事。它承诺，社会主义革命将在经济层面实现民族的真正解放，在政治层面终结对其他民族的压迫，最终导向全人类的自由。而在现实与理想之间，则横亘着一条由殖民者与民族叛徒的尸体铺就的道路。在经济主张上，马克思列宁班德拉主义者并不遵循科学社会主义的基本原则，而是倾向于推行带有民粹色彩的政策，如土地平均分配和具有民族保护主义倾向的经济措施。在政治组织方面，他们往往借鉴民主集中制的形式，却在实践中掺杂了大量民族主义诉求。在对外政策层面，他们表现出对帝国主义的强烈敌视，并在口头上支持民族自决原则。\n\n“别让怜悯的锁链缠住了你，现在正是多么尖锐的斗争，你还是把这种无用的垃圾丢掉吧！”"

 marlib_chinese_federalism_subtype:0 "联省制"
 marlib_chinese_federalism_subtype_desc:0 "§Y联省制§!\n\n所谓的联省是一极其多元的概念，其大抵诞生于二十年代，主张以分权、共和、民主之模式治理中国广袤而迥异的国土。在联省派看来，欲使华夏之内各民族、文化繁荣昌盛，唯有由普选产生的地方议会之自治方为上策。联省派反对孙中山的国民党训政理念，认为人民有着自己的见解，已具备了辨别利弊的能力。此外，联省派的学者还要求来一场全面的农业改革，包括农民补贴及推动农会之发展，不过，至于如何对待大地主，目前尚没有统一定论。就社会立场而言，联省派多持进步观点，要求彻底革新陈旧的律法、建设新式官僚体系，并以职业行政人员取代军阀之腐败。联省派的思想泉源颇多，而今日最为人所称道者，非革命将军陈炯明莫属，其欲效法美利坚合众国，“以美式经验建立起中华合众省”。虽遭到了孙中山等人的批评，认为其不仅会使中国丧失抵御外侮之能力，还会加剧地方割据，但在大清帝国日暮西山的当口，联省制已实实在在地卷土重来。待陈炯明之宏图践行于中华大地，或将以亚洲联邦为基石，将联省原则广布寰宇，终至成就兵燹消弭、和谐共存之大同盛世。"

