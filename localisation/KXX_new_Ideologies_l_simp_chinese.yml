 jacobin_futurism_subtype:0 "雅各宾未来主义"
 jacobin_futurism_subtype_desc:0 "§Y雅各宾未来主义§!\n\n£GFX_ideology_jacobin_futurism_bar\n\n\n\n\n即使放在雅各宾派的发源地法国，尼古拉斯·卡拉斯的“雅各宾未来主义”思想也可以算是比较特别的。作为一名罗伯斯庇尔的崇拜者，卡拉斯同时既深受列宁、托洛茨基等布尔什维克的影响，又与布勒东、巴塔耶等巴黎超现实主义圈子的领军人物有着紧密的关联。这使得他的思想杂糅了各种流派，一方面具有所谓“红色雅各宾派”的马克思-列宁主义要素，又具有超现实主义和未来主义的特征，因此用“雅各宾未来主义”这种拼接的词汇来形容之也不足为奇了。"

 chizhevskyism_subtype:0 "革命日光崇拜"
 chizhevskyism_subtype_desc:0 "§Y革命日光崇拜§!\n\n£GFX_ideology_jacobin_futurism_bar\n\n\n\n\n革命日光崇拜是科学家亚历山大·奇热夫斯基提出的一种奇特的理论，它基于奇热夫斯基在历史计量学和太阳生物学方面的研究，其认为人类历史受到太阳黑子活动每十一年一次的高峰期的影响，这种高峰期会引发人类集体采取行动，从而会诱发重大历史事件的产生。因此，奇热夫斯基认为革命活动也应该接受太阳黑子周期的“指导”，他将该周期按照“民众的兴奋程度”分为四个部分，并认为在民众兴奋度最高的时期掀起革命将最具效果。尽管这一理论可能是世界上最令人捧腹的“革命”理论，奇热夫斯基和他领导的工人太阳会依旧致力于根据太阳黑子周期，在世界各地定期地掀起革命狂潮，并推广他们对太阳的历史重要性的独特理解。"

 bogomilism_subtype:0 "博格米勒派"
 bogomilism_subtype_desc:0 "§Y博格米勒派§!\n\n£GFX_ideology_bogomilism_bar\n\n\n\n\n本来，博格米勒派是一个早已经消亡的中世纪保加利亚诺斯替教派的名字，而如今，这个名字在尼古拉·雷诺夫的领导下焕发新生。雷诺夫认为博格米勒派反抗教会等级制度和国家权力的历史反映了保加利亚的某种具有神秘主义色彩的“革命传统”，他将其与布拉瓦茨基夫人的神智学及贝因萨·杜诺的白色兄弟会教义相结合，融合为一种具有奇怪激进主义色彩的现代“博格米勒派”。新生的博格米勒派崇尚一种反对教会、国家乃至世间一切权力的“基督教无政府野蛮主义”，并同时从马克思主义等主流左翼思想中汲取灵感，从而形成了一种被号称为“密教共产主义”的罕见思潮。即使大多数人觉得它完全不可理喻，新“博格米勒派”还是像一头东倒西歪的野兽一般从保加利亚向欧洲其他地方冲去。"

 luxembourgism_subtype:0 "卢森堡主义"
 luxembourgism_subtype_desc:0 "§Y卢森堡主义§!\n\n罗莎·卢森堡可能是社会主义运动中最著名的女性。她于1871年出生在扎莫希奇，很快在波兰和俄罗斯社会主义运动中崭露头角，成为经典社会民主运动的创始人之一。罗莎提出了一种革命必要性的理论，同时反对布尔什维克所宣传的先锋党概念，也反对共产主义运动中的更多民族主义倾向。罗莎的理论将最主要的压力放在反对资本主义的斗争上，而不是争取独立，这一理论后来得到了进一步发展。  目前，自称卢森堡主义者的人们相信无产阶级对压迫者的国际斗争，有些人甚至声称建立一个结合欧洲和俄罗斯的人民共和国可能是理想目标，该共和国将建立在工人自治的基础上，而没有诸如国家和文化之类的“人为”界限。"

 #奇思妙想
 Ahnenerbe_ariosophy_subtype:0 "雅利安密学"
 Ahnenerbe_ariosophy_subtype_desc:0 "§Y雅利安秘学§!\n\n£GFX_ideology_ariosophy_bar\n\n\n\n\n雅利安秘学，即所谓“雅利安人的智慧”，亦称阿马嫩主义，是兰茨·冯·利本费尔斯及其前辈吉多·冯·利斯特的创造，其将奥地利人等所谓的雅利安民族视为人类物种的顶峰，视其它人种为人猿之类的低等兽物，认为只有雅利安人才是孕育人类的古神的真正的孩子，只要全身心地遵循利本费尔斯的教导，雅利安人便可重新获得伟大的神力和崇高的地位，或者说至少希望如此。雅利安秘学与日耳曼异教和浪漫主义有着深厚的联系，同时又是不留余地的种族优越论，将所有其他人种视为劣等的亚人，它的信徒寻求将获选之种族引领向乌托邦的同时，也渴望将所有其他劣等人踩到泥沼之下。"

