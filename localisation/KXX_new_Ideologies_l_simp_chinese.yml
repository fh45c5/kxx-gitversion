 bagha_jatin_spirit_subtype:0 "巴加·贾廷精神"
 bagha_jatin_spirit_subtype_desc:0 "§Y巴加·贾廷精神§!\n\n贾廷德拉纳特·穆克吉，或者说巴加·贾廷于1915年的死亡无法阻挡他的记忆在印度斯坦的革命者们之间蔓延，就像是那匹老虎无法阻挡巴加·贾廷继续前进一样。巴加·贾廷率领孟加拉最激进的革命者们跨越大洲为独立而战，并因为叛徒的出卖而在大英帝国在大战中惨败的前夜牺牲。如今，巴加·贾廷的精神在他的密友巴瓦布山·密特拉身上集结，引领新一代的革命者们砸碎印度斯坦的所有枷锁。巴瓦布山复兴了巴加·贾廷与欧洲无政府主义者异曲同工的激进革命传统，并结合了革命战友奥罗宾多·戈什在后来发展出来的神秘精神体验和改革思潮，再加上他个人对于印度传统的广泛理解，使得巴加·贾廷的灵魂能够重现于世，让激荡的“火之年代”、闪光的革命岁月重新回到南亚大地上。"

