 red_oligarchy_subtype:0 "红色寡头"
 red_oligarchy_subtype_desc:0 "§Y红色寡头§!\n\n红色寡头描述了一种在革命政权内部出现的特殊权力结构。虽然它在名义上依然维持着工会民主或公社议会的架构，但实际的决策权已经落入了一群由资深工团领袖、革命官僚以及掌控关键工业部门的“总干事”，甚至是那群在国际禁运封锁线外游走的“红色经理人”组成所组成的封闭圈子手中。\n他们主张将分散的公社合作社整合为庞大的、类似于托拉斯的工业联合体。虽然生产资料在名义上归全社会所有，但实际的支配权、贸易配额的审批权以及对国际资源的调拨权，都集中在少数的“总干事”手中。\n对于这些寡头而言，公社的旗帜是他们垄断市场的通行证，而革命的暴力则是他们最优质的资产。他们不仅是在治理国家，更是在经营一场席卷全球的战争生意。"

