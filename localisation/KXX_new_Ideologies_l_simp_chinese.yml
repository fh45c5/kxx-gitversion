 syn_social_futurism_subtype:0 "社会未来主义"
 syn_social_futurism_subtype_desc:0 "§Y社会未来主义§!\n\n£GFX_ideology_social_futurism_bar\n\n\n\n\n社会未来主义由俄罗斯早期的立体未来主义与自我未来主义运动的大家所开创，并受到了马里内蒂等意大利未来主义者的影响，代表了试图将社会主义意识形态与未来主义这种新兴的文化现象融合在一起的左翼新式未来主义思想浪潮。如弗拉基米尔·马雅可夫斯基、纳塔莉亚·冈察洛娃和维克托·弗拉基米罗维奇·赫列勃尼科夫这样的社会未来主义者摒弃了未来主义中经常掺杂的右翼理念，取而代之地注入了乌托邦和科学社会主义思想，以开辟一条通向全新且充满赤红色彩的未来愿景的道路。在社会未来主义体系中，群众——将在中央政府、技术专家委员会或艺术先锋队的指导下——努力建立一个乌托邦社会，在不断发展的理论、政策、艺术等红色浪潮中，无休止地向前迈进，走向现代化、城市化的社会主义未来。"
 