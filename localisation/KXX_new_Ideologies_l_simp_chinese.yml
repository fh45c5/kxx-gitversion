 Tolstoyism_subtype:0 "托尔斯泰主义"
 Tolstoyism_subtype_desc:0 "§Y托尔斯泰主义§!\n\n托尔斯泰主义是俄国文学巨匠列夫·托尔斯泰晚年形成并大力宣扬的一套独特思想体系，它深深植根于对基督教原始伦理的重新诠释，并融合了其对社会现实的深刻批判以及对个人精神觉醒的迫切呼唤。其核心在于强调个人通过道德自我完善、内省克己以达到精神纯洁，并认为实现“上帝之国在人间”的途径在于严格践行基督山宝训的非暴力与爱的原则。托尔斯泰主义对社会制度展开了猛烈抨击，认为国家政权本质上基于暴力强制，违背了爱的法则，因此主张不合作与拒服兵役；同时，它也严厉批判私有制是社会不公与贫困的根源，倡导财富公有与简朴生活，并强烈反对官方教会的形式化、教条化及其与权力的勾结，认为其背离了基督教的真精神。该主义推崇体力劳动的价值，视其为道德净化和促进社会平等的基础，倡导回归自然、自食其力的朴素生活。最终，托尔斯泰主义将“爱”视为上帝意志的体现和解决人间一切冲突的最高律法与根本力量，强调内在的信仰与道德实践远比外在的宗教仪式重要。"

