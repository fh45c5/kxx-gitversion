 ###旭日骨寒
 dainippon_communism_subtype:0 "旭日共产主义"
 dainippon_communism_subtype_desc:0 "§Y旭日共产主义§!\n\n旭日共产主义是日本共产党中以水野成夫为首的“日本共产党劳动者派”所主张的一种特殊的意识形态。他们主张日本的社会主义革命不能脱离日本的实际情况，尤其是不能无视日本国情强行废除君主制，直接无偿没收华族、地主、僧侣的土地，或者在殖民地问题上将日本和欧美帝国主义者相等同，从而使得革命者孤立于日本群众之外。相反，他们认为不应该拘泥于社会主义、工团主义及共产主义的教条，而是应该基于日本特有的民族性，为了“全体日本人民最迫切的社会利益和民族利益”而进行行动。\n此外，他们还主张以率先在亚洲实现了社会主义革命的日本民族作为革命的先锋，率领全东亚人民实现“大东亚社会主义革命”。由于他们独特的观点，其他社会主义者往往会认为旭日共产主义者不过是披着共产主义皮的反动派，但是由于在日本群众中根深蒂固的保守倾向以及对于天皇制的支持，这种意识形态在革命后的日本依旧获得了相当程度的支持"

 syn_rounoucom_subtype:0 "劳农派社会主义"
 syn_rounoucom_subtype_desc:0 "§Y劳农派社会主义§!\n\n£GFX_ideology_yamakawaism_bar\n\n\n\n\n劳农派社会主义是日本独有的一种特色的社会主义意识形态意识形态，创始人为劳农党领导人山川均和无产党领导人铃木茂三郎。该派系认为日本在19世纪末已经完成了资产阶级革命，建立了资本主义社会，强调日本社会的资本主义性质，认为封建的绝对主义势力只是“意识形态的残余”，已经丧失了物质基础。基于此判断，他们提倡“一阶段革命论”，认为日本可以直接进行社会主义革命，无需进行资产阶级民主革命。\n劳农派将无产阶级和农民视为革命的主力军，主张建立一到两个以无产阶级为核心，囊括所有反资本主义阶层的革命政党。在组织原则上，他们反对个人崇拜与权力过度集中，倡导党内民主制，并要求保持政党独立性，避免受到来自工团主义国际的施压与负面影响，力图让马克思列宁主义发展出日本本土特色。"

