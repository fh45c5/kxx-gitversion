 natpop_latin_falangism_subtype_desc:0 "§Y拉丁长枪主义§!\n\n拉丁长枪主义是拉丁美洲地区受到长枪党影响而形成的一套政治理论体系与实践运动。其追随者，如同他们在西班牙的意识形态同源，普遍认同某种形式的西班牙至上主义。然而，拉丁美洲独特的历史背景和社会现实，使得拉美长枪主义者对这一概念的理解呈现出显著的分歧。一部分人将其诠释为一种民族解放思潮，旨在团结西班牙语世界，帮助西班牙裔社群摆脱盎格鲁-撒克逊主导的文化、政治和经济秩序，并重塑基于共同语言、历史和天主教传统的集体认同。在思想内核上，拉丁长枪主义融合了极权主义、国家工团主义、整合民族主义、行会社会主义。同时，它坚定地支持并捍卫天主教的道德准则与社会价值观，将其视为社会秩序和个体行为的基石。\n\n拉美长枪主义者的行动，很大程度上是对二十世纪以来南美地区特定历史情境的回应。在彼时剧烈的社会动荡中，无政府主义者、工团主义者以及共产主义者发起的激进革命运动，被长枪主义者视为对既有的、以西班牙文化遗产为基础的社会秩序与传统结构的根本性威胁，他们形容这种威胁如同要撕毁整个西班牙裔赖以为生的家园。面对这种被其视为盎格鲁-高卢势力入侵、工团主义和无神论思潮的侵蚀以及国内革命的混乱，拉丁长枪主义者自认为站在了抵抗的最前沿。在一种深切的危机感乃至绝望情绪驱使下，他们倡导超越激烈的阶级斗争，主张通过阶级合作的模式，将国内不同社会阶层：包括工人、农民、实业家等在民族国家与天主教价值观的旗帜下整合起来，构建一个有机的、和谐统一的民族共同体，以此作为对抗内部颠覆力量和外部文化政治影响的堡垒，并寻求实现他们所构想的民族复兴与社会稳定。"

 latin_national_syndicalism_subtype:0 "拉丁国家工团主义"
 latin_national_syndicalism_subtype_desc:0 "§Y拉丁国家工团主义§!\n\n拉丁国家工团主义是一种在拉丁美洲西语裔群体中发展起来的意识形态，其思想根源可追溯至西班牙的国家工团主义进攻委员会及其核心理论家拉米罗·莱德斯马·拉莫斯。如同其在西班牙的先驱者与长枪党存在根本分歧一样，拉丁国家工团主义者也强烈拒斥盛行于拉美的拉丁长枪主义思潮，视其为对西班牙裔思想健康的毒害。\n\n该意识形态的追随者秉持激进的反宗教立场，将彻底的无神论视为社会实现真正解放的基石。他们认为所谓盎格鲁-高卢思潮入侵是虚构的威胁，主张拉丁美洲西语裔当前的核心任务在于抵抗国际资本主义势力对本国经济命脉与国家主权的控制。在经济领域，拉丁国家工团主义者强调工人阶级的独立性，主张在特定条件下（如民族资产阶级背叛民族利益或与外国资本勾结时）终止与其的合作。他们倡导通过建立强有力的工人纠察队等监管组织，对企业实施严格的工人监督与管理，以确保经济活动服务于民族集体利益而非私人资本。\n\n本质上，拉丁国家工团主义坚定地认同并推行革命工团主义原则，其终极目标是彻底清除阻碍民族复兴与社会公正的三大势力：军事集团干政的传统、外国资本的掠夺性渗透，以及国内保守势力的顽固阻挠，从而实现一个由有组织的劳工阶层主导的、真正独立自主的民族国家。"

 tot_chilean_national_socialist_subtype:0 "智利国家社会主义"
 tot_chilean_national_socialist_subtype_desc:0 "§Y智利国家社会主义§!\n\n作为智利民族主义阵营中独特而略显模糊的一支，由卡洛斯·凯勒·鲁夫与弗朗西斯科·哈维尔·迪亚斯·巴尔德拉马共同孕育的这一思想体系，试图将本土理论同悠久的日耳曼影响相结合。这种被称作“智利国家社会主义”的理论信条，融合了尼古拉斯·帕拉西奥斯的种族理论、弗朗西斯科·安东尼奥·恩西纳的西班牙血统稀释论、阿尔贝托·爱德华兹的贵族阶层脱离现实论；并糅合了凯勒与瓦尔德拉玛翻译的人民主义及奥地利德意志工人党著作的独创见解与宪章极权主义的影响。该党成功凝聚了因伪工团主义革命而愤懑的智利人及亲德势力，成为呼唤祖国重生的旗帜。唯有铲除一切伪工团主义、共产主义与跨国资本主义，摒弃自由主义思想与议会迷思，实行强大的国家工团主义一党专政，构建体现社会正义与人文劳动真谛的国家，方能实现这一目标，但领袖豪尔赫·冈萨雷斯·冯·马雷斯则看的更远，对现状不满的自由主义人士、向往真正工团主义的革命斗士乃至迷茫彷徨的社会主义者皆可受到智利国家社会主义的庇护。当然，当前智利的现状尚不允许实施此类改革，必须先行完成民族根基的重生与强化——驱逐所有无价值的外邦人（尤以犹太人为甚），进行全国范围的民族革命，统合一切爱国主义者。智利国家社会主义者宣称，他们最终只是想要一个由豪尔赫·冈萨雷斯·冯·马雷斯领袖所带领的集权国家。"

