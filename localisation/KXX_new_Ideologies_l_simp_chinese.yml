 natpop_kemalism_subtype:0 "民族凯末尔主义"
 natpop_kemalism_subtype_desc:0 "§Y民族凯末尔主义§!\n\n£GFX_ideology_natpop_kemalism_bar\n\n\n\n\n“凯末尔主义”一词是指源自奥斯曼帝国大维齐尔穆斯塔法·凯末尔帕夏及其政党OPP的政治思想的意识形态。这种典型的土耳其意识形态促进了被视为颓废的帝国的高度集权和激进的现代化。现代化必须经过拒绝伊斯兰教作为影响社会和政治生活的因素，凯末尔主义支持基于欧洲模式的世俗主义，这招致了宗教机构和苏丹亲属的许多批评。中央集权通过建立土耳其民族主义情绪和镇压威胁帝国生存的少数民族分裂主义情绪而实现。这种意识形态在土耳其已经产生了影响，尽管受到一些人的批评，但被视为解决“欧洲病夫”所遭受的弊病的主要解决方案之一。但在某些形式上，它已经适应了非土耳其政治意识形态，包括激进的日本陆军上校桥本欣五郎。"

 revolutionary_khmerism_subtype:0 "革命高棉主义"
 revolutionary_khmerism_subtype_desc:0 "§Y革命高棉主义§!\n\n£GFX_ideology_revolutionary_khmerism_bar\n\n\n\n\n革命高棉主义是一种基于高棉民族主义和革命土地主义原则的极左翼意识形态。革命高棉主义非常民族主义和爱国主义，认为共产主义可以使柬埔寨再次伟大，就像在美好的高棉帝国时代一样。它寻求农民的进步，并促进一个对小资产阶级极度敌视的农业社会，但在一些著名的意识形态记录中也对城市化抱有一些不满。革命高棉主义强调民族文化革命，群众要彻底摧毁反动文化。另一个要点是，其意识形态创始人高度强调平等，但也怀有反越南情绪。"

 anarcho_tridemism_subtype:0 "无政府三民主义"
 anarcho_tridemism_subtype_desc:0 "§Y无政府三民主义§!\n\n£GFX_ideology_anarcho_tridemism_bar\n\n\n\n\n在孙中山先生推翻清朝的斗争历程中，许多同志相遇并投身于革命事业。无政府主义者亦是同盟会的一员，影响了众多新兴的激进分子。尽管这些无政府主义者在国民党中扮演了一定角色，北伐终究还是失败了。在蒋介石遇刺后的混乱中，国民党内颇具影响力的无政府主义者最终开始与流亡的陈炯明联邦主义者合作。如今，随着无政府主义者击败陈炯明并亲自夺取政权，这一联盟已宣告终结。虽然这种局面或许正是巴金等激进分子所期望的，但与国民党盘根错杂的无政府主义者深知，在民众缺乏支持无政府主义的适当教育的情况下，这场斗争注定会沦为另一场简单的政治革命，不过是用一个政府取代另一个政府。相反，引入无政府主义的革命，其根本核心在于对中国大众的教育。只有当道德、真理和公德心改变了大众的行为之后，无政府主义才能成功。这便是为何旧“四老”的成员拒绝与国民党左派合作的原因，即便王精卫等受无政府主义影响的人物在左派国民党中具有影响力。因为他们的方法只会通过教导服从权威而使工人阶级陷入贫困。反之，鉴于右派国民党对进步事业的支持，及其允许无政府主义倡导者在国民党控制区内发展自身项目的意愿，以前“四老”为代表的无政府主义运动与这个民族主义政党拥有共同的事业，而通往乌托邦社会的千年世界革命仍在继续。然若此种和解终不可成，无政府主义亦能独自斗争。"

 pataut_chiangism_subtype:0 "蒋介石主义"
 pataut_chiangism_subtype_desc:0 "§Y蒋介石主义§!\n\n£GFX_ideology_chiang_bar\n\n\n\n\n北伐的失败使国民党陷入危机。左右两派分裂之后，即便是右派内部也分化为不同派系。尽管一些机会主义派系可能为推卸自身失败而将北伐的责任归咎于蒋介石，但大元帅的政治遗产依然强大。那些仍旧认同蒋公愿景的人，便利用这份遗产来为他们的立场和政策辩护。作为一个主要偏右的派系，这通常意味着他们侧重于儒家和/或基督教的道德教化，正如他们对新生活运动的支持所体现的那样。在已故蒋公同僚的领导下，一个现代、道德、强大的中国将会崛起，摆脱自由主义与社会主义的双重威胁。"

 natpop_chiangism_subtype:0 "蒋介石主义"
 natpop_chiangism_subtype_desc:0 "§Y蒋介石主义§!\n\n£GFX_ideology_chiang_bar\n\n\n\n\n北伐的失败使国民党陷入危机。左右两派分裂之后，即便是右派内部也分化为不同派系。尽管一些机会主义派系可能为推卸自身失败而将北伐的责任归咎于蒋介石，但大元帅的政治遗产依然强大。那些仍旧认同蒋公愿景的人，便利用这份遗产来为他们的立场和政策辩护。作为一个主要偏右的派系，这通常意味着他们侧重于儒家和/或基督教的道德教化，正如他们对新生活运动的支持所体现的那样。在已故蒋公同僚的领导下，一个现代、道德、强大的中国将会崛起，摆脱自由主义与社会主义的双重威胁。"

 neo_tridemism_subtype:0 "纯粹三民主义"
 neo_tridemism_subtype_desc:0 "§Y纯粹三民主义§!\n\n£GFX_ideology_daijitao_bar\n\n\n\n\n尽管国民党左派声称代表了现代中国之父孙中山的真实思想，他们的所作所为却暴露了真相。逃亡至西方帝国主义者的土地，本就足以让他们彻底丧失“民族主义者”的标签。然而，这些毒瘤仍在不断滋长，并用他们所谓将三民主义与工团主义“结合”的主张来诽谤已故国父的遗产，正如他们将民生主义重新诠释为阶级斗争的一种形式所见。与之相反，像戴季陶这样真正的孙中山思想继承者，则为维护和教导作为国父思想基础的佛教、儒家等中国传统文化形式而奋斗。"
 
 pataut_new_tridemism_subtype:0 "纯粹三民主义"
 pataut_new_tridemism_subtype_desc:0 "§Y纯粹三民主义§!\n\n£GFX_ideology_daijitao_bar\n\n\n\n\n尽管国民党左派声称代表了现代中国之父孙中山的真实思想，他们的所作所为却暴露了真相。逃亡至西方帝国主义者的土地，本就足以让他们彻底丧失“民族主义者”的标签。然而，这些毒瘤仍在不断滋长，并用他们所谓将三民主义与工团主义“结合”的主张来诽谤已故国父的遗产，正如他们将民生主义重新诠释为阶级斗争的一种形式所见。与之相反，像戴季陶这样真正的孙中山思想继承者，则为维护和教导作为国父思想基础的佛教、儒家等中国传统文化形式而奋斗。"

 authdem_new_live_movement_subtype:0 "新生活运动"
 authdem_new_live_movement_subtype_desc:0 "§Y新生活运动§!\n\n£GFX_ideology_new_life_movement_bar\n\n\n\n\n国民党代表了中华民族为重建并重获其在世界上应有地位而进行的斗争。为此，中华民族的每一位公民也必须重塑其日常生活与习惯。因为只有当民众接受了摆脱其懒散和激进新哲学的、正当的中国传统道德，国家的发展轨迹才能改变。这种新生活应由四维——礼（合宜的礼仪）、义（正直或正义）、廉（诚实与廉洁）、耻（羞耻心和是非观）——来引导，并受儒家思想和基督教义的熏陶。为达此目标，富裕且受过良好教育的阶级需将其正当行为下渗至懒散的平民。只有到那时，当正当的道德正义得到遵从，当中国人摆脱了兄弟相残的阶级斗争唯物主义哲学，中国才能真正团结一致，对抗其敌人。"

 pataut_new_live_movement_subtype:0 "新生活运动"
