 autdem_state_shintoism_subtype:0 "皇道论"
 autdem_state_shintoism_subtype_desc:0 "§Y皇道论§!\n\n£GFX_ideology_state_shintoism_bar\n\n\n\n\n与皇道派等主张天皇亲政的“皇道”不同，皇道论一般指的是以“忧国慨世的思想家”今泉定助为首的神道学者为了明确日本的国体观念所提倡的一种实用神道理念。皇道论者根据日本的神道神话传统得出，日本具有天然的“君民一体”的性质，其国体完全体现出了天之御中主神的精神，因此就有作为“皇国”建设“道义国家”，对抗西方的“霸权国家”，领导“八紘一宇的新世界建设”，最终建成“道义世界”的义务。\n在实践中，皇道论特别关注神道祭祀在国家建设中的作用，并支持将其融入国家政策乃至国民个人生活中。皇道论认为，作为“祭祀”的神道是社会上每个个人通过祭祀来寻回自身“本性”，抛弃“小我”达到“神人合一”的“大我”境界，与国家乃至世界成为一体，从而实现整体的“维新与进步”。\n作为一种“现代化”的本土神道思想，从林路一在政界发起的“大日本运动”，再到冈本利吉所领导的和神道教相结合的农民运动，目前在日本各个政治光谱中都能看到皇道论者为实现“惟神大道”的新世界而行动的身影。"

 antisemitisme_subtype:0 "反犹主义"
 antisemitisme_subtype_desc:0 "§Y反犹主义§!\n\n反犹主义是一种古老的意识形态，表现为基于种族、宗教或文化偏见，对犹太人的系统性仇恨、歧视或迫害，从欧洲中世纪贯彻至今。通常将将犹太人视为“阴谋控制世界”的群体，基于犹太身份进行人身攻击、暴力或剥夺权利，传播犹太民族的负面刻板印象。"

 nihonyudaya_shugi_subtype:0 "日犹主义"
 nihonyudaya_shugi_subtype_desc:0 "§Y日犹主义§!\n\n所谓“日犹主义”是日本加尔文宗牧师酒井胜军对明治时期“日犹同祖论”思想的进一步发展。他认为，犹太人之所以能够征服世界、在各国内部搞破坏,显然都是遵从神的旨意,虽然日本也将会是犹太人搞破坏的对象，但是由于日本是神国,国民没有忘记敬神尊皇之心,所以犹太人是无法征服日本的。在犹太人毁灭其他国家,却唯独毁灭不了日本后,他们就会发现，原来日本才是他们长期以来追求的神之帝国,日本天皇本人才是弥赛亚本人。"

 paternalistic_reactionaryism_subtype:0 "家长式反动主义" 
 paternalistic_reactionaryism_subtype_desc:0 "§Y家长式反动主义§!\n\n£GFX_ideology_paternalistic_reactionaryism_bar\n\n\n\n\n家长式反动主义是一种威权主义的、经济上中左、文化上极右且反动的意识形态，它是反动主义与社会威权主义的综合体。\n与其它社会民主主义意识形态类似，它支持通过严格管制的经济体系、庞大的福利国家以及对工会的支持来实现其主张。然而，与持有相同经济体系的其他意识形态不同，其理论基础并不相同——它并非基于平等或其他现代理念，而是可能以宗教或反自由主义来为其经济政策辩护。\n由于其反动本质，它反对民主制度，转而追求一种反民主的治理体系，往往同军国主义或君主主义进行合流。这一思想体系在理论上可追溯至19世纪的神权君主论与国家社会主义实践，如约瑟夫·德·迈斯特强调的神圣等级秩序，以及俾斯麦时期通过社会福利缓解阶级矛盾的策略，同时汲取了20世纪天主教统合主义中将宗教伦理嵌入国家机器的经验。\n这一意识形态在那些被现实撕裂理想的社会民主主义者中十分常见，往往是一个过渡状态，最终发展成威权社会民主主义或是堕入国家民粹主义的深渊。" 

 little_japan_subtype:0 "小日本主义"
 little_japan_subtype_desc:0 "§Y小日本主义§!\n\n小日本主义是由日本新闻记者、经济学家、政治家石桥湛山所提出的一种理念。他谴责作为帝国主义扩张政策的"大日本主义"，倡导国际协调和自由贸易的“小日本主义”。核心思想在于立足于自由贸易与工商立国主义，来自世界经济整体的国际性理解，重视经济活动效果的功利性方法。"

