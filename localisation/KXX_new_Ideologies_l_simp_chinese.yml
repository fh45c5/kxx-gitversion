 esoteric_anarchism_subtype:0 "神秘无政府主义"
 esoteric_anarchism_subtype_desc:0 "§Y神秘无政府主义§!\n\n神秘无政府主义最早被用来描述19世纪至20世纪早期无政府主义运动的神秘学色彩，与赫尔墨斯秘教、泛神论等等息息相关。德国学者卡尔·施米特认为西方政治理论本质是神学概念的世俗化，而无政府主义同样延续了泛神论传统，承袭文艺复兴以来的秘传知识，主张宇宙统一性和人性内在神性，反对基督教超越性神学，巴枯宁更是明言革命是"神圣理性与爱的宗教"。有的观点认为无政府主义的起源和共济会密不可分，光明会的激进实验被视为原始无政府主义先驱，此后的第一国际和国际社会主义民主同盟都受其影响。\n虽然主流的无政府主义和工团主义者斥责这种"逆流邪说"的存在，但在拉丁美洲，神秘无政府主义确有实践，拉美无政府主义者将欧洲秘传传统，如共济会符号、泛神论等与革命行动相结合，从墨西哥无政府主义的最早提倡者普罗蒂诺·罗达卡纳蒂到现代尼加拉瓜的革命者奥古斯托·桑地诺，无不体现出这种革命的神秘主义。"

