 radsoc_new_legalism_subtype:0 "新法家主义"
 radsoc_new_legalism_subtype_desc:0 "§Y新法家主义§!\n\n£GFX_ideology_new_legalism_bar\n\n\n\n\n自晚清以降，天朝秩序崩颓，民族危如累卵。在一片“救亡图存”的呐喊中，以梁启超、章太炎、沈家本为首的先贤开始反思儒家文化的软弱，转而从先秦“法家”遗泽中寻找强国之道。这便是§Y“新法家”§!思潮的萌芽。他们激进地批判了千百年来对管商之学的无理抹黑，力图剥离陈腐的偏见，主张以现代“法治”概念重构先秦的富国强兵之术。对于他们而言，法家并非暴政的代名词，而是实现民族现代化的铁脊梁。\n\n随着时代的演进，这一学术流派在中国青年党、孤军社、大江会等中国国家主义政治结社中的政治实践中得到了升华。中国的国家主义者坚决排斥阶级斗争的社会主义，认为那只会瓦解民族的内聚力；他们同样蔑视自由主义的放任自流，视其为国家有机体的涣散剂。相反，他们推崇“国家至上”，主张建立一种高度集权的统制模式，通过国家意志主导重工业化与国防建设，将整个社会整合为一架精密运行的战争机器。\n\n在国家主义的派系内，这种意识形态呈现出许多截然不同的路径，但大致分为两派：譬如孤军社萨孟武为代表的温和派试图将法治逻辑引入孙中山先生的三民主义框架并吸纳部分社会主义理念，寻求一种威权护航下的民主变体；还有以青年党陈启天为首的激进派进一步完善了新法家的专制面向，他强调“全体性”与“秩序感”，主张剥夺一切阻碍国家效率的冗余自由。在中国国家主义者的推波助澜下，新法家已不再仅仅是一场学术复兴，而是一场旨在通过铁腕秩序、高度集权与民族觉醒，让中华“醒狮”重回世界巅峰的宏大政治实验。" 
