 tot_neosocialism_subtype:0 "新社会主义"
 tot_neosocialism_subtype_desc:0 "§Y新社会主义§!\n\n新社会主义是从国家工团主义中演化而来的众多思想之一。它囊括了泛民族主义、法团主义经济和高度极权主义，看起来并不与现代索雷尔主义或法兰西社会主义运动有很大不同，但新社会主义强调一个人 - 马塞尔·戴亚这个创始人和唯一的理论家。他的思想是推动目前法国政治的主要力量，不惜一切代价实施他的意志，同时许多新社会主义者坚持泛欧洲主义，而我们可能会看到一个新世界的出现"

 #小黄&洗头佬&rm扩展
 natpop_goebbels_subtype:0 "民族马克思主义"
 natpop_goebbels_subtype_desc:0 "§Y民族马克思主义§!\n\n£GFX_ideology_national_marxism_bar\n\n\n\n\n民族社会主义将强硬民族主义和种族优越论与马克思主义意识形态相结合，要求国家团结在一个中心人物，即人民元首周围，让人民作为一个统一的整体向未来前进。其激进的极权主义与威权主义主张令其他意识形态“黯然失色”，除此之外，该意识形态还强调科学进步、种族纯洁、社会主义经济、无神论、大众团结互助、各方面完全国有化以及近乎狂热的民族自豪感的重要性。民族社会主义被左翼群体广泛厌恶，但无可否认，它仍然是为革命——一场纯净的革命——而奋斗。"

 socialism_goebbels_subtype:0 "民族马克思主义"
 socialism_goebbels_subtype_desc:0 "§Y民族马克思主义§!\n\n民族马克思主义将强硬民族主义和种族优越论与马克思主义意识形态相结合，要求国家团结在一个中心人物，即人民元首周围，让人民作为一个统一的整体向未来前进。其激进的极权主义与威权主义主张令其他意识形态“黯然失色”，除此之外，该意识形态还强调科学进步、种族纯洁、马克思主义经济、无神论、大众团结互助、各方面完全国有化以及近乎狂热的民族自豪感的重要性。民族马克思主义被左翼群体广泛厌恶，但无可否认，它仍然是为革命——一场纯净的革命——而奋斗。"

 burgundian_system_subtype:0 "勃艮第体制"
 burgundian_system_subtype_desc:0 "§Y勃艮第体制§!\n\n第二次世界大战胜利后，德国在人民元首戈培尔的领导下走向了权力的顶峰，纳粹党内一些狂热而又不同寻常的成员，尤其是人民元首海因里希·希姆莱，试图将他们对民族马克思主义的信仰与他们面前的严酷现实调和来。他们最终得出结论，民族马克思主义党已经迷失了方向，陷入了衰落，只有他们才能保持最纯粹的民族马克思主义党。他们开始秘密地脱离帝国的政治结构，建立自己的体系。\n\n当希姆莱被任命为全国领袖时，他开始积极追求他对纳粹主义的马克思愿景。勃艮第体系的宗旨定义模糊，但可以通过分析希姆莱的行为和信仰来理解，这些行为和信仰包括农业主义和超工业化、创建德国新异教国教和研究神秘学。\n\n\n然而，有一点是肯定的，希姆莱政权以极端的形式奉行民族马克思主义政策：革命革命党被认为是最高社会阶层，种族卫生得到严格执行，国家马克思主义意识形态渗透到生活的各个领域。极权主义被引入社会是为了消除任何可能的反抗和冷漠的表现。这是否成功——或者将来是否成功——只能由帝国元首希姆莱来评估，因为我们其他人仍然无法了解骑士团的秘密。"

 strasserism_subtype: "施特拉塞主义"
 strasserism_subtype_desc: "§Y（施特拉塞主义）§!\n\n施特拉塞主义可以看作是与民族马克思主义相关的“社会主义民族主义”。它代表了戈培尔去世前属于 NMDVP 左派阵营的那些人的意识形态。施特拉塞主义以其两位最杰出的成员格雷戈尔和奥托·施特拉塞的名字命名，部分借鉴了贝尼托·墨索里尼、奥斯瓦尔德·莫斯利、维亚切斯拉夫·莫洛托夫和约瑟夫·朱加什维利等思想家。"

 national_socialism_spartanism_subtype:0 "斯巴达主义"
 national_socialism_spartanism_subtype_desc:0 "§Y斯巴达主义§!\n\n"

 despotism_vanguard_anarchism_subtype:0 "先锋无政府主义"
 despotism_vanguard_anarchism_subtype_desc:0 "§Y先锋无政府主义§!\n\n先锋无政府主义试图将去中心化的无政府社会与一支纪律严明的正规军结合起来，以军队来为整个社会提供保护。当论及这无政府社会的生存问题时，最终的决定权往往落到军队的核心领导手中。先锋无政府主义的拥护者辩称，为了防止更有组织、更加稳定的外部威胁压垮公社，这一切都是必要之举。另一方面，批评者认为这连修正都称不上，简直就是对无政府主义的侮辱：军队挟防御与保卫之名，行威权专断之实，人民的意愿与需求往往得不到重视。除此之外，无论是谁在执掌军队，他所掌握的权力之大，真显得他跟那些拼命粉饰自己的独裁者差不了多少。"

 natpop_based_subtype:0 "国家社会主义"
 natpop_based_subtype_desc:0 "§Y国家社会主义§!\n\n国家社会主义是国家民粹主义的一种极端形式，通常与“民族社会主义”的概念混淆使用。其支持者普遍强调国民作为一个基于共同血统、文化、历史或命运的有机统一体，内部的社会矛盾应被国家力量消弭，以服务于民族的整体强盛。在这里，国家则被视为民族意志和集体利益的最高体现，国家利益至高无上，超越个人或阶级利益，民族生存、强大和荣耀是国家行动的根本目标。这种意识形态通常主张建立强大的、中央集权的领导核心（围绕一个拥有超凡魅力的领袖或单一政党），民主程序则被视为低效或对民族统一有害而被弱化或取消。\n国家社会主义者坚定拒绝国际主义、全球化和普世价值，视其为对民族特性和国家主权的侵蚀，强调民族自决力的重要性，追求国家在政治、经济和军事上的高度自主。在具体的经济主张上，国家社会主义者提倡国家主导的混合经济，主张在关键战略产业实行国家所有或国家强力干预与调控，以服务于国家目标，同时允许私有经济在非关键领域存在，但需服从国家统制。\n国家社会主义和军团主义、莫拉斯主义等国家民粹主义形式一样，在文化层面，它大力倡导回归并重新诠释被其奉为圭臬的民族§R古老传统、神话传说与祖传美德§!（如勇武、忠诚、团结、牺牲精神），旨在唤醒民众心中沉睡的“§R黄金时代§!”记忆，塑造一种基于历史荣耀感的高度同质化的民族认同。国家通过教育体系、官方艺术赞助、盛大的公共仪式以及对历史遗迹的再诠释等手段，系统性地推广这种被筛选和理想化的“§R传统文化§!”，并将其塑造为对抗现代社会所谓“腐化”与“外来污染”的精神堡垒。"

 esoteric_marxism_subtype:0 "深奥马克思主义"
 esoteric_marxism_subtype_desc:0 "§Y深奥马克思主义§!\n\n£GFX_ideology_esoteric_marxism_bar\n\n\n\n\n深奥马克思主义是一种通过精神视角诠释马克思主义的意识形态，以德国犹太学者瓦尔特·本雅明的弥赛亚马克思主义为典型代表。它摒弃了卡尔·马克思建立其思想所依赖的唯物论和无神论基础，转而希望将一种神秘的世界观融入马克思主义框架之中。\n该意识形态希望将马克思主义带回到其黑格尔主义的根源，并且批判它认为青年黑格尔学派对黑格尔思想所做的革新，认为辩证唯物主义应通过拥抱精神来涤除其幼稚的唯物论。深奥马克思主义试图深化马克思关于物质与历史的分析：革命进程不仅是物质层面通向工人乌托邦的道路，更是精神层面“绝对者”自我实现的过程。物质主义与理想主义在工人对抗资本主义的斗争中相互交融，在“终极实在”向至善的永恒演进中合而为一，二者本质上是同一进程的两面。\n对于神话学——古典马克思主义思想中被忽视的另一个主要领域，深奥马克思主义借鉴借鉴了索雷尔和葛兰西的思想，认为有必要对革命进行一种超越纯粹物质层面的更深刻理解。通过将工人联结至一个更高的元叙事，一个原型故事，一场彻底的革命才可能实现。生活的方方面面都将融入这个故事，以满足人类对文化、宗教和意义的内在渴望。因此，革命神话需要被视作为宗教叙事而非使用工具，马克思主义不仅是一种政治理论，更是一种在现实中展开的形而上学结构，它必须被看作是“真理”。\n而在阶级意识方面，深奥马克思主义将其视为一种精神方式。它可以被比作一位古代神祇，全体工人绑定于它，对其行使能动性。所有结构，包括资产阶级的结构，都被视为对其从属者施加作用力的精神实体。因此，革命不仅仅是人与人之间的战斗，更是“诸神之战”。这场伟大的战役会被“马克思主义的神话”所讲述，确立无产阶级在宏大历史叙事中的主导地位。"

 natpop_esoteric_marxism_subtype:0 "深奥马克思主义"
 natpop_esoteric_marxism_subtype_desc:0 "§Y深奥马克思主义§!\n\n£GFX_ideology_esoteric_marxism_bar\n\n\n\n\n深奥马克思主义是一种通过精神视角诠释马克思主义的意识形态，以德国犹太学者瓦尔特·本雅明的弥赛亚马克思主义为典型代表。它摒弃了卡尔·马克思建立其思想所依赖的唯物论和无神论基础，转而希望将一种神秘的世界观融入马克思主义框架之中。\n该意识形态希望将马克思主义带回到其黑格尔主义的根源，并且批判它认为青年黑格尔学派对黑格尔思想所做的革新，认为辩证唯物主义应通过拥抱精神来涤除其幼稚的唯物论。深奥马克思主义试图深化马克思关于物质与历史的分析：革命进程不仅是物质层面通向工人乌托邦的道路，更是精神层面“绝对者”自我实现的过程。物质主义与理想主义在工人对抗资本主义的斗争中相互交融，在“终极实在”向至善的永恒演进中合而为一，二者本质上是同一进程的两面。\n对于神话学——古典马克思主义思想中被忽视的另一个主要领域，深奥马克思主义借鉴借鉴了索雷尔和葛兰西的思想，认为有必要对革命进行一种超越纯粹物质层面的更深刻理解。通过将工人联结至一个更高的元叙事，一个原型故事，一场彻底的革命才可能实现。生活的方方面面都将融入这个故事，以满足人类对文化、宗教和意义的内在渴望。因此，革命神话需要被视作为宗教叙事而非使用工具，马克思主义不仅是一种政治理论，更是一种在现实中展开的形而上学结构，它必须被看作是“真理”。\n而在阶级意识方面，深奥马克思主义将其视为一种精神方式。它可以被比作一位古代神祇，全体工人绑定于它，对其行使能动性。所有结构，包括资产阶级的结构，都被视为对其从属者施加作用力的精神实体。因此，革命不仅仅是人与人之间的战斗，更是“诸神之战”。这场伟大的战役会被“马克思主义的神话”所讲述，确立无产阶级在宏大历史叙事中的主导地位。"

 right_totalism_subtype:0 "主权工团主义"
 right_totalism_subtype_desc:0 "§Y主权工团主义§!\n\n£GFX_ideology_right_totalism_bar\n\n\n\n\n主权工团主义是国家权力全面控制工会运动的产物。它的支持者们通常是一些幻想在体制内推动改良的前工团主义者，或是不满国内保守民族主义势力的右翼改良分子。主权工团主义提倡强制合并所有独立工会与农会，建立一个官方特许的垄断组织，由现任政府任命其领导层，以爱国主义为第一纲领，其次宣称协调劳资关系，实则废除罢工权与集体谈判权，代之以强制劳动仲裁法庭——其法官由政府与雇主代表组成。工会在此沦为执行生产配额、征收农业剩余、监视工人思想的行政工具，同时协助秘密警察清除对立的左翼激进分子，所有劳工活动最终服务于维持威权统治与经济掠夺的目标。"

 social_national_populism_subtype:0 "改革法团主义"
 social_national_populism_subtype_desc:0 "§Y改革法团主义§!\n\n£GFX_ideology_social_national_populism_bar\n\n\n\n\n改革法团主义被用作描述那些自称“非左倾也非右倾”的民族社会主义支持者。他们普遍以阶级合作为核心主张，同时反对左翼的激进革命纲领和右翼的极端民族主义，试图为本民族发展探索一条中间道路。部分理论家称之为“战斗的社会主义”，视其为彻底解决当前意识形态与社会问题的突破口。\n由于其民族主义本质，改革法团主义者通常处于本国的民族主义阵营，或与右翼团体进行结盟，尝试在合法的框架下来获得改革的权力。但在经济平等与社会协作等方面，他们依然保持着强烈的社会主义色彩，正因如此，对于他们的右翼盟友而言，改革法团主义者始终是令人忌惮的潜在变数。在风向转变时，大部分改革法团主义的支持者也不吝啬“见风使舵”，倒向真正的左翼阵营。"

 provisional_government_subtype:0 "临时政府"
 provisional_government_subtype_desc:0 "§Y临时政府§!\n\n冲突的结束井不意味着战争的彻底终结。战争留下的疮痍仍然存在，国家再度陷人混乱或政权崩溃的风险仍然威胁着人民。在废墟中，人们建立了临时政府来完成过渡性的使命。\n在长久的混乱时期后，临时政府致力于重建社会秩序与法治。无休止的战争、革命浪潮裹挟而来的血雨腥风，前一个时代遗留下的准无政府状态被临时政府一扫而空，其治下相对安稳的局面为身心俱疲的民众带去慰藉，令人民欢呼雀跃。昔日冲突尽数被人们摒弃，全国范围内的政治对话重新展开，以便临时政府为紧随其后的常任政府制定新的法律架构。临时政府在国家重建方面做了很多工作：重振长久以来被弃置不顾、被腐败蛙蚀的政府机构，重新阐释法律；评估国家遭受的创伤，并以政治和经济为抓手制定重建方案，通过切实可行的手段处理旧政权留下的烂摊子。他们希望能够依靠自身努力让从根本上被动摇的国家实现全面意义上的重回正轨，让人民摆脱余悸。"

 transitional_government_subtype:0 "看守政府"
 transitional_government_subtype_desc:0 "§Y看守政府§!\n\n又称过渡政府、临时政府或临时内阁，从根本上来说是一种临时的特设政权，存在于更为正式的新政府（无论通过民主选举、军事政变或其他方式产生）组建或就职之前，常见于议会制国家，其成员通常由随机挑选的国会议员或即将离任的国会议员组成。其主要职责是履行有限的政府职能，维持国家机构的日常运转和国家现状。看守政府通常在前任政府倒台（或任期结束）后迅速成立，但无论其前任倒台的原因如何，其固有的合法性普遍较低。因此，如果它们不被尽快取代，容易引发国内的混乱和动荡。\n这类政府即使是非政治性的，也往往带有相对威权的色彩，以确保政权过渡期间的基本稳定。同时，它们通常缺乏政治意愿和实质能力去执行任何有切实意义的重大政策或立法，因为其缺乏进行此类行动的合法授权（尤其是选举赋予的权力）。从实质上讲，在正式政府替代看守政府之前，国家治理往往处于一种“冻结”状态。"

 generic_sssp_subtype:0 "科学特搜署"
 generic_sssp_subtype_desc:0 "§R第三国际科学特搜署§!\n\n£GFX_ideology_SSSP_bar\n\n\n\n\n第三国际科学特搜署为第三国际最高执行委员会直属之常设科学协调与行动机构。本署由法兰西公社联邦、意大利社会主义共和国及不列颠联盟依据《雷恩协定》联合倡议并主导设立，常驻总部位于海峡群岛特别管辖区。\n\n本署的核心职能在于调查、研究与管控全球范围内的超自然或异常事件与现象；开展涵盖前沿科学、神秘学及民俗学的多学科交叉研究，拓展人类知识疆界；系统观察、分析全球民俗传说与历史记录中的超常要素，评估其风险与研究价值；向第三国际及成员国提供科学评估、风险预警及应对策略；并在国际框架内协调相关资源与行动。\n\n本署运作遵循以下核心原则：始终以科学理性与实证精神为根基，同时保持对未知的开放；人类福祉与安全为最高行动准则；秉承国际主义与协作精神，超越国界服务全人类共同利益；严格管控敏感信息，防止社会恐慌与敌对利用，同时支持安全前提下的学术交流；恪守最高伦理标准与责任感。"

