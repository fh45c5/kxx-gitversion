 natpop_utopian_technocracy_subtype:0 "乌托邦技官主义"
 natpop_utopian_technocracy_subtype_desc:0 "§Y乌托邦技官主义§!\n\n£GFX_ideology_utopian_technocracy_bar\n\n\n\n\n乌托邦技官主义是传统技官主义的一个分支，正如技官公司及传统技官主义描述的那样，他们提倡建立与传统技官主义类似的政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。此外他们还支持美学革命，并推动艺术家、哲学家、作家及其他创造性思想家加入这一半寡头平台。而且，这些乌托邦主义技官们还抛弃了同时代其他技官的专制做派，转而大量借鉴索斯坦·维尔本和其他乌托邦平等主义者的思想，比如爱德华·贝拉米、罗伯特·欧文、诺曼·莱蒙德、夏尔·傅立叶和亨利·大卫·梭罗，并试图建立起受保护的民主合作委员会，在技术专家的指导下，所有人都以社区主义的方式拥有平等的发言权，共同迈向平等的天堂。总体而言，乌托邦技官主义试图突破传统政治模式的限制，将人类引向一个开明、艺术、人道、和平、改革和美学的紫色乌托邦。"
 natpop_sansepolcrismo:0 "圣墓主义"
 natpop_sansepolcrismo_desc:0 "§Y圣墓主义§!\n\n£GFX_ideology_sansepolcrismo_bar\n\n\n\n\n圣墓主义并非欧洲的独特思想。它的诞生是在第一次世界大战期间贝尼托·墨索里尼的头脑中， 并在战后得到完善，最终成为意大利的指导思想。这种思想具有高度的极权主义和激进性，意图通过军事和外交手段，将意大利文化重塑成前所未有的事物，开启新的文艺复兴并将意大利带回其辉煌。 \n\n圣墓主义不会成为历史留下的无名之辈。由于其高度的适应性，它可能成为世界各地社会主义主要学派之一。由于索雷尔主义和莫斯利主义等意识形态的普及，以及民族布尔什维克主义思想在俄罗斯的兴起，我们可以看到对民族社会主义思想的高需\n\n新的圣墓主义学派，也被称为“新圣墓主义”，与其最初的形式有所不同。它非常兼容其他意识形态的混合，贝尼托·墨索里尼的思想已经演变成许多方向。农业倾向与西西里法西斯主义的元素已经突显出来，但也有新的教义，类似于布哈林主义或莫斯利主义。圣墓主义的演化是必然的，我们现在可以看到它的奇妙之处"

 radsoc_surrealism_subtype:0 "超现实主义"
 radsoc_surrealism_subtype_desc:0 "§Y超现实主义§!\n\n£GFX_ideology_surrealism_bar\n\n\n\n\n想象一下这样的世界：词语在罢工，拒绝服从字典的暴政；梦境从破晓的缝隙喷涌而出，染白天鹅绒般的现实；一把缝衣针可以刺穿议会大厦的穹顶，而一只雨伞在手术台上解剖着理性的尸体。这便是超现实主义的首席教皇和宣言者安德烈·布勒东为我们凿开的道路。\n在1924年的《超现实主义宣言》中，布勒东点燃了第一把火。他深信，艺术的颠覆性与社会的颠覆性血脉相连。他对资本主义怀有根深蒂固的敌视，认为它不仅是经济剥削的制度，更是精神枯竭与创造力阉割的元凶。他目睹了战争的荒谬、殖民的暴行、社会的不公，这些都印证了他心中那个“旧世界”的腐朽本质。因此，布勒东的超现实主义革命是双重的，首先是挣脱内在枷锁，通过自动写作、梦境记录、游戏、催眠等手段，炸毁个体意识中的理性堤坝，释放潜意识洪流，实现“想象的复权”。而后是外在革命的渴望，有彻底粉碎那个压迫性的、建立在私有制和异化劳动之上的资本主义社会结构，内在的精神解放才拥有真实的土壤。超现实主义必须投入具体的社会政治斗争，这也是布勒东积极参与劳总联活动的原因。他追求一种更纯粹、更彻底的革命——一种融合了马克思的批判精神、弗洛伊德的无意识洞察以及洛特雷阿蒙所言的“诗歌应由所有人共同创造”的绝对自由理想。\n对布勒东而言，美、爱与自由是三位一体的革命圣火。他相信，只有通过这双重革命——砸碎外在的锁链，同时点燃内心的火山——人类才能实现真正的解放，达到“至高的点”，在那里，生与死、现实与梦境、过去与未来、个人与集体、诗意与行动……所有的矛盾都将消融。\n然而，布勒东所点燃的这场“绝对革命”之火，其光芒并非均匀辐射。超现实主义团体本身，这个由布勒东以近乎教皇般的权威所凝聚的“革命兄弟会”，在长期的政治活动中也逐渐走向分裂。特别是痴迷于卑污和逾越的乔治·巴塔耶，与对资本主义消费逻辑明目张胆、乐在其中的拥抱与颂扬的萨尔瓦多·达利，他们与布勒东原初理念的尖锐冲突分化了超现实主义者，这一危机或许将持续至自身的灭亡……"

 tot_surrealism_subtype:0 "超现实主义"
