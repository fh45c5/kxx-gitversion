 National_Tridemism_subtype:0 "民族社会三民主义"
 National_Tridemism_subtype_desc:0 "§Y民族社会三民主义§!\n\n£GFX_ideology_National_Tridemism_subtype_bar\n\n\n\n\n民族社会三民主义是一个融合了德国民族社会主义宣传家戈培尔激进理论与孙中山三民主义的意识形态，由复兴社领袖蒋纬国提出。该主义在形式上保留民族、民权、民生的三民框架，但实质上进行极端民族主义与集体主义的改造：它强调以煽动性宣传、领袖崇拜与精神动员强化“民族主义”，将其扭曲为种族优越论与排外主义；以自上而下的严控社团组织取代真正的“民权”，实质取消个人自由；并以“民生”之名推行国家统制经济与阶级调和，服务于所谓的“民族共同体”利益。其本质是借三民主义外壳，构建一个强调绝对服从、民族至上且高度集权的极权体制，反映出一种试图将国家社会主义主义工具嫁接于东方民族革命理论的政治实验。其口号是所谓的“一个政党，一个领袖，一个主义”。"

