 controlled_democracy_subtype:0 "指导式民主"
 controlled_democracy_subtype_desc:0 "§Y指导式民主§!\n\n£GFX_ideology_controlled_democracy_bar\n\n\n\n\n指导式民主是指维持民主表象，但权力实际上集中在少数个人或团体手中的政治制度。它的特点是政治自由有限，反对党受到限制，并操纵选举过程以确保统治精英保持权力。虽然可以举行选举，但选举往往受到严格控制和操纵，以确保预先确定的结果，从而有效地限制了普通民众的真正民主参与和决策。但与此同时，也的确存在一些国家的领导人将指导民主视为避免暴民统治的良药，一旦人民做好了民主的准备，这些领导人就会事了拂衣去，真正的民主选举就会举行。"

