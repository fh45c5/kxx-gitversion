 oomoto_subtype:0 "大本"
 oomoto_subtype_desc:0 "§Y大本§!\n\n£GFX_ideology_oomoto_bar\n\n\n\n\n“当三千世界的梅花一同绽放之时，国常立尊将会重整这个世界”——这些由一个文盲老巫女奋笔疾书下的语句，正在逐渐变成现实。大本，或者皇道大本，是以其教主出口直被神上身时所写下的神言为教义，由其女婿，“圣师”出口王仁三郎领导的新兴宗教。大本以据称附身出口直的"艮之金神"，即国常立尊为主神，预言“弥勒之世”即将来临，是时国常立尊将会重新降临，将整个世界推倒重建为“神之国度”。虽然这种浸透了末日思想的教义在神道教诸派中也是极为激进的，但是随着出口直在其书写的神谕中所作的预言依次应验，大本还是成功地在整个日本传播开来。另一方面，由于其激进的教义倾向，大本在出口王仁三郎的领导下也在积极地寻找策动社会变革的机会，并为此在军政财各界积极地发展人脉。尽管其曾因此遭受镇压，但在现今日本动荡的政治环境中，大本又成功地和支持“昭和维新”的诸多势力搭上了线，尤其和头山满的黑龙会建立了紧密的联系。在大本的信徒们看来，实现国常立尊降临，弥勒之世到来，日本扬升为神之国度的预言恐怕只是一个时间问题。"

