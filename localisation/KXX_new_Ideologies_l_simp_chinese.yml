 prabodhon_subtype:0 "大众印度教民族主义"
 prabodhon_subtype_desc:0 "§Y大众印度教民族主义§!\n\n有些思想在讲台上传播，有些思想在旗帜上飘扬，而马哈拉施特拉的社会改革家凯沙夫·西塔拉姆·“普拉博丹卡”·萨克雷的思想则是跟在毛驴后面。作为马哈拉施特拉首屈一指的社会改革者，萨克雷积极推广一种“大众印度教民族主义”，并以自身创办的杂志《启蒙》为主要宣传阵地。与V. D. 萨瓦卡主张的印度教民族主义不同，萨克雷主张的是一种平等的、高度包容性的进步民族主义形式，其认为，印度教复兴的关键在于革除陋俗，打破婆罗门的垄断，最终回归吠陀经的印度教本源，而非是将矛头指向穆斯林等非印度教群体。因此，大众印度教民族主义对于种性歧视、童婚、嫁妆等印度教陋俗则是全方位开炮，力图将平等和进步带给印度教大众。而另一方面，这种印度教民族主义充分肯定了伊斯兰教的作用，并认为穆斯林社区在某些方面可以作为印度教徒的榜样。同时，萨克雷也在通过歌颂希瓦吉等印度教英雄人物来引发大众的自豪感，激起民族主义情绪。这种强调大众福祉的印度教民族主义作为马哈拉施特拉印度教社会的一种新思想异军突起，其能够在印度发挥怎样的作用，还有待观察。"

 hindu_volkism_subtype:0 "印式人民主义"
 hindu_volkism_subtype_desc:0 "§Y印式人民主义§!\n\n对于印度革命者切姆帕卡拉曼·皮莱来说，他的印度母亲被软弱的妥协者、苟延残喘的殖民者和腐朽的贵族瓜分，近在咫尺但又遥不可及，而印式人民主义便是他在这种情况下的思想产物。作为对于不顾革命者死活的加尔各答政府的反抗，切姆帕卡拉曼试图寻找一种能够武装他的祖国的思想，为此他从德国的人民主义运动汲取灵感，试图将他们的“血与土”思想运用于遥远的东方，为他的种族寻找阳光下的地盘。与流行的甘地和平主义不同，印式人民主义主张暴力和军国主义，认为这才是能将殖民主义彻底驱逐的唯一手段。同样，它也支持建立印度自己的强大统制经济，从而与殖民资本主义相对抗。而这一切都是为了证明古老的印度民族丝毫不比白种人低等，他们能够使“印度万岁”的呐喊响彻世界。"

