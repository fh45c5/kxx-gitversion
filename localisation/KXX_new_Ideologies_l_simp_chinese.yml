 martial_vedanta_subtype:0 "军事吠檀多"
 martial_vedanta_subtype_desc:0 "§Y军事吠檀多§!\n\n不是每个人都生活都能够影响世界，但是某个孟加拉枪骑兵可以。辗转于欧洲和南亚之间的前枪骑兵弗朗西斯·叶芝-布朗的政治观点就和他的人生经历一样诡谲多变，就如同“军事吠檀多”这个形容其观点的奇怪用语一样。就如同叶芝-布朗最为敬仰的三位人物——T.E.劳伦斯、贝尼托·墨索里尼和圣雄甘地一样，军事吠檀多融合了劳伦斯的军事冒险精神、墨索里尼的国家工团主义和法团主义经济思想和甘地的多宗教团结思想，并结合了自他作为孟加拉枪骑兵以来就有的对于印度教神秘主义的浓厚兴趣。叶芝-布朗认为，在目前自由民主的实践已经失败，而正统的工团主义也过于“乌托邦”的情况下，应该由一位仁慈的独裁者以强有力的手段引领整个国家，就如同瑜伽的上师严厉地指导他的弟子一样。此外，值得注意的是，虽然叶芝-布朗的思想和流行于不列颠联盟的准则派思想有诸多共通之处，但是其本人却由于厌恶其政治投机性，而一向与准则派及其领导人奥斯瓦尔德·莫斯利保持距离。"

