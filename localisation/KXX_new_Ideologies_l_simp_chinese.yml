 soclib_new_legalism_subtype:0 "新法家"
 soclib_new_legalism_subtype_desc:0 "§Y新法家§!\n\n£GFX_ideology_new_legalism_bar\n\n\n\n\n新法家是近代兴起的一个学术流派。在晚清的具体时势和学术背景下，出现了梁启超、章太炎、沈家本等“新法家”。他们反对传统上对法家的无理批判和攻击，极力为法家平反，颂扬法家的历史成就，用“法制”或“法治”来认识和阐释法家思想，并在此基础上发展出“新法治”。这种意识形态本身最近才得到发展并与中国青年党联系在一起。这种意识形态在反社会主义和民族主义的同时，还采取了一种更加集权的经济方法。一些更民主的变体提倡孙中山先生的三民主义的某种形式/解释，但更常见的是更接近中国青年党创始人之一和新法家发展的关键人物陈启天的一些更专制的变体。"
