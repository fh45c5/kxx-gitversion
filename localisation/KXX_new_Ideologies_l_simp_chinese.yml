 aristocrat_legionarism_subtype:0 "贵族军团主义"
 aristocrat_legionarism_subtype_desc:0 "§Y贵族军团主义§!\n\n贵族军团主义与其草根兄弟：军团主义分道扬镳，本质上是精英叙事与大众动员的路径之争。后者深植于保守反动的底层社会土壤，常以民粹情绪为燃料；而前者则在上层精英圈层中觅得生存空间，甚至一度成为远遁加拿大的不列颠流亡政府高层的思想底色，尤其受到那些既不满现状又试图保留传统秩序的贵族与政治精英的推崇，被视为重塑民族荣光的行动纲领。\n\n贵族军团主义的核心要义，在于将精英阶层的主体性置于民族革命的核心位置。他们认为仅凭底层民众的自发抗争或草莽力量，断无实现民族复兴的可能，真正的民族旗帜必须由“清醒的少数”政治精英高高擎起。这一群体的意识形态标签鲜明而尖锐：既秉持精英政治的传统逻辑，又浸润着对现代理性的怀疑；既崇尚尚武好斗的古典尚武精神，又将反社会主义、反犹主义与极端民族-爱国主义熔铸为一体。在他们看来，科尔内留·科德里亚努领导的罗马尼亚铁卫团、意大利民族主义协会这类依托底层动员的团体，不过是“乌合之众的情绪宣泄”；俄罗斯黑色百人团式的街头暴力，更是缺乏战略格局的短视之举。贵族军团主义者声称若无精英阶层的设计与引领，被煽动的愚民只会沦为摧毁秩序的工具，而非建设新国家的栋梁。\n\n贵族军团主义者认为腐朽的旧资本主义体系已彻底丧失活力，必须以技术官僚主导的法团主义或右翼工团主义取而代之。所谓“技术官僚治国”，并非简单的专家政治，而是强调由一群兼具专业知识、道德责任感与国家情怀的精英，通过整合工业、农业、金融等各领域利益集团，构建“有机国家”。这些“真正忧虑国家命运”的技术官僚，将被赋予超越党派的治理权，通过理性规划与高效执行，引导国家摆脱混乱，迈向真正的复兴。这种复兴不仅是国力的重振，更是对“精英-民众”等级秩序的重塑，最终实现“强国家”与“有序社会”的共生。"
 eternal_return_subtype:0 "永恒轮回"
 eternal_return_subtype_desc:0 "§Y永恒轮回§!\n\n永恒回归可被视作军团主义的一种“秘传主义变体”。与军团主义一致的是，它从根本上拒斥现代性，批判自由主义与民主制度，并主张建立一个以东正教信仰为精神核心的民族国家。然而，不同于铁卫团成员倾向于通过物质手段，如摧毁所谓“犹太精神”、资本主义与工团主义来实现一场东正教民族革命，永恒回归更强调在精神层面完成一种“回返”，即重新接入那个具有神圣起源的元初时刻。\n\n该思想体系奠基于这样一种宇宙论信念：宇宙与生命处于一种循环往复的节律之中，不断回归至那个充满神性力量的太初。现代人因陷于线性时间的牢笼，已经坠入虚无与堕落的深渊；唯有通过特定的宗教仪轨，主动参与到神圣历史之中，才能摆脱当下现实的束缚，重新契入神话所记载的元初。这种向源头的回归，不仅是对抗现代性所导致的精神贫瘠的根本途径，更被视为实现罗马尼亚民族“精神革命”的关键。在这一过程中，个体与集体将通过回归原初神话时刻，实现与上帝的和解，从而在尘世中重建神圣秩序。"

 trairism_subtype:0 "生存主义"
 trairism_subtype_desc:0 "§Y生存主义§!\n\n生存主义（亦称经验主义）是二十世纪罗马尼亚哲学中一股具有深刻本土特质的意识形态潮流，其核心奠基者与理论倡导者是哲学家纳埃·约内斯库。约内斯库汲取了“人生哲学”传统的丰富资源，包括索伦·克尔凯郭尔对生存抉择的强调、弗里德里希·尼采对生命意志的肯定、奥斯瓦尔德·斯宾格勒对文明命运的洞察，以及弗拉基米尔·索洛约维奇与尼古拉·别尔嘉耶夫所代表的精神哲学传统从而构建出一种以“经验优先于智性”为根本原则的思想体系。该流派的名称“生存主义”，由谢尔班·乔库列斯库所创造，准确捕捉了其关注个体生存实感、反对理性过度抽象化的精神气质。在这一思想体系中，神秘主义的体悟被视作比理智分析更为根本的认知方式，灵魂的救赎被置于文化理想之上，精神实践的价值被认为超越纯粹学院式的学术追求。纳埃·约内斯库明确提出，要构建一种根植于东欧精神土壤、以神秘主义体验与精神权威为基本原则的罗马尼亚哲学，从而在思想层面彰显其地域与文明的特殊性。\n\n生存主义虽发端于约内斯库的思想母体，却在其发展过程中催生出多样而分歧的思想走向。例如，米尔恰·武尔克内斯库将其引向一种深具精神性、近乎灵修的内在道路；而埃米尔·齐奥朗则走向了彻底的悲观主义，沉入一种狂热却又彻底消极的生命状态，将绝望本身视为一种清醒的生存姿态。因此，我们可将生存主义理解为一种“抒情哲学”，它从根本上否认哲学能够成为一门严密的科学，而主张哲学表达如同生命本身，充满张力、激情与不可化约的矛盾。在生存主义的视野中，不同的哲学立场之间不必彼此通约，也无需强求兼容；正如生活本身充满不可调和的冲突，哲学也由一系列本质上对立、在理论上无法妥协的范式构成，生存主义自身的存在方式，恰恰就是对这一理念的最佳印证。"

 tot_romanian_nationalism_subtype:0 "罗马尼亚民族主义"
 tot_romanian_nationalism_subtype_desc:0 "§Y罗马尼亚民族主义§!\n\n罗马尼亚民族主义作为一种系统的民族主义形态，其核心理念奠基于一个根本命题，罗马尼亚人构成一个具有共同历史、文化与命运的单一民族，并以此为基础推动民族认同的政治建构与领土统一。该思潮的思想根源可追溯至中世纪晚期对罗马起源的自觉追溯与话语构建。早在16世纪，摩尔达维亚统治者雅各布·赫拉克利德便以拉丁文化遗产为号召，公开宣示罗马尼亚人为罗马殖民军团的直系后裔，并试图将摩尔达维亚、瓦拉几亚与特兰西瓦尼亚这三个历史上的罗马尼亚人聚居公国整合为统一国家，其努力虽因内外阻力而失败，却为后来的统一运动奠定了思想基础。至1600年，瓦拉几亚公爵“勇敢的米哈伊”成功实现三公国的短暂统一，尽管这一政治实体存在时间不长，其形象却在后世民族叙事中被塑造为罗马尼亚民族统一事业的奠基性象征。\n\n进入二十世纪，随着罗马尼亚在一战后面临特兰西瓦尼亚、布科维纳等领土的丧失，民族情绪在挫折中逐渐激进化。在此背景下，多个极右翼组织与政治力量，如具有强烈宗教神秘主义色彩的铁卫团与拉斯克尔·内亚领导下的民族基督教党，开始系统性地吸纳并重塑罗马尼亚民族主义思想。这些组织不仅强调民族的生物学纯正性与民族统一主义的地缘诉求，更将东正教信仰视为罗马尼亚民族精神的堡垒，将社团主义作为替代自由民主的社会组织模式，从而建构出一套融合了极端民族主义、宗教保守主义与反现代性叙事的意识形态体系。"

 romanian_nationalism_subtype:0 "罗马尼亚民族主义"
