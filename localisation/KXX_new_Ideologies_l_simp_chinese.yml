 soccon_security_state_subtype:0 "安保国家"
 soccon_security_state_subtype_desc:0 "§Y安保国家§!\n\n£GFX_ideology_security_state_bar\n\n\n\n\n安保国家与其说是一种意识形态，倒不如说是指一类国家，其共同点就是当权者通过情报机构或各类宪警组织确立了自己至高无上的影响力，实现了对政府的完全控制。虽然大多数安保国家的领袖都只关注于掌控国家的某一或所有方面，但其中也不乏带有政治思想、政治倾向之别类。安保国家的掌事者究竟是在以自己的方式拯救自己的国民，还是仅仅是为了权力，这就只有当局者自己知晓了。"

 natpop_absolute_monarchy_subtype:0 "绝对君主制"
 natpop_absolute_monarchy_subtype_desc:0 "§Y绝对君主制§!\n\n£GFX_ideology_absolute_monarchy_bar\n\n\n\n\n绝对君主制是指一个国家的君主拥有完全的专制权力的政权。在这种制度下，君主不受议会民主制或国家法律和政府的限制，在领导国家方面发挥着积极的作用，而不是像大多数议会制君主国家那样被降格为单纯的国家象征。绝对君主制在西方并不像以前那样普遍，近代以来，大多数西方君主都成了象征，但君权完全控制国家这种事在西方也不是没有发生过。"
 
 authdem_absolute_monarchy_subtype:0 "绝对君主制"
 authdem_absolute_monarchy_subtype_desc:0 "§Y绝对君主制§!\n\n£GFX_ideology_absolute_monarchy_bar\n\n\n\n\n绝对君主制是指一个国家的君主拥有完全的专制权力的政权。在这种制度下，君主不受议会民主制或国家法律和政府的限制，在领导国家方面发挥着积极的作用，而不是像大多数议会制君主国家那样被降格为单纯的国家象征。绝对君主制在西方并不像以前那样普遍，近代以来，大多数西方君主都成了象征，但君权完全控制国家这种事在西方也不是没有发生过。"

 soccon_controlled_democracy_subtype:0 "指导式民主"
 soccon_controlled_democracy_subtype_desc:0 "§Y指导式民主§!\n\n£GFX_ideology_controlled_democracy_bar\n\n\n\n\n指导式民主是指维持民主表象，但权力实际上集中在少数个人或团体手中的政治制度。它的特点是政治自由有限，反对党受到限制，并操纵选举过程以确保统治精英保持权力。虽然可以举行选举，但选举往往受到严格控制和操纵，以确保预先确定的结果，从而有效地限制了普通民众的真正民主参与和决策。但与此同时，也的确存在一些国家的领导人将指导民主视为避免暴民统治的良药，一旦人民做好了民主的准备，这些领导人就会事了拂衣去，真正的民主选举就会举行。"

 soccon_police_state_subtype:0 "警察国家"
 soccon_police_state_subtype_desc:0 "§Y警察国家§!\n\n£GFX_ideology_police_state_bar\n\n\n\n\n从戒严令和宵禁到严厉镇压和合法专制，尽管形式多种多样，但警察国家的主要支柱总是一成不变。警察国家可能是政治性的或非政治性的，专业性的或非专业性的，腐败的或仁慈的，形成的根源与所处的条件不同，具体情况也会千差万别。尽管这种意识形态的表现多种多样，但其出发点都在于防止社会不受约束，陷入混乱。警察国家与军政府类似，但通常不会那么军国主义和帝国主义，而是把给人民带来秩序视为高于一切其他追求，往往在法律条文的支持下，他们可以正当合法地实现自己的追求。"

 east_asian_peasantism_subtype:0 "归农农本思想"
 east_asian_peasantism_subtype_desc:0 "§Y归农农本思想§!\n\n归农农本主义是一场根植于东方土壤，深受精神导师与时代思潮洗礼的特殊社会运动。它并非严格意义上的党派纲领，而是一种寻求回归土地、重建乡土共同体本位的深刻渴望。其思想源头驳杂，汲取了列夫·托尔斯泰的躬耕实践与道德理想主义、圣雄甘地的自力更生精神，并深深浸润了无政府主义对强权国家的拒斥。日本本土思想家权藤成卿所倡导的农本自治论，则为之提供了关于以村落为基石的“社稷”自治图景，呼应着对中国古代理想化乡治的遥远憧憬。\n归农农本主义的参与者们，如思想家权藤成卿、实践家橘孝三郎与冈本利吉，乃至文化名人武者小路实笃，无不致力于在现实土壤上播种其理想。他们尝试建立超越政治的农民自治组织，倡导自给自足的农耕生活与紧密的邻里互助，视质朴的“农本”为抵御现代工业文明侵蚀、疗愈社会异化的良方。"

 socdem_east_asian_peasantism_subtype:0 "归农农本思想"
 socdem_east_asian_peasantism_subtype_desc:0 "§Y归农农本思想§!\n\n归农农本主义是一场根植于东方土壤，深受精神导师与时代思潮洗礼的特殊社会运动。它并非严格意义上的党派纲领，而是一种寻求回归土地、重建乡土共同体本位的深刻渴望。其思想源头驳杂，汲取了列夫·托尔斯泰的躬耕实践与道德理想主义、圣雄甘地的自力更生精神，并深深浸润了无政府主义对强权国家的拒斥。日本本土思想家权藤成卿所倡导的农本自治论，则为之提供了关于以村落为基石的“社稷”自治图景，呼应着对中国古代理想化乡治的遥远憧憬。\n归农农本主义的参与者们，如思想家权藤成卿、实践家橘孝三郎与冈本利吉，乃至文化名人武者小路实笃，无不致力于在现实土壤上播种其理想。他们尝试建立超越政治的农民自治组织，倡导自给自足的农耕生活与紧密的邻里互助，视质朴的“农本”为抵御现代工业文明侵蚀、疗愈社会异化的良方。"

