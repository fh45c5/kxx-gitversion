 pataut_neo_citizenism_subtype:0 "新民主义"
 pataut_neo_citizenism_subtype_desc:0 "§Y新民主义§!\n\n£GFX_ideology_new_citizen_bar\n\n\n\n\n新民主义是一种独特而新颖的意识形态，其核心围绕中国精神主义、道教、泛亚主义和狂热的反工团主义。该意识形态由新成立并已武装的新民会创立和拥护，号召由唐绍仪创建的、与日本结盟的新中国进行组织，以实现其人民的共同繁荣。支持这些思想的有五项原则：拥护新政权，同时让民意得以彰显；发展实业，以保障民生；弘扬东方文化道德；开展反共斗争，以消灭工团主义为目标；以及加强友好同盟的实现，为人类和平做出贡献。"


