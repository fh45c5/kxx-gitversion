 syn_bukharinist_subtype:0 "布哈林主义"
 syn_bukharinist_subtype_desc:0 "§Y布哈林主义§!\n\n£GFX_ideology_bukharin_bar\n\n\n\n\n布哈林主义，亦称半市场社会主义，是由前俄国布尔什维克尼古拉·布哈林提出的思想体系，构成其领导的人民社会党纲领基础。内战结束后，布哈林提出革命失败的主因在于“战时共产主义”政策的失误——该政策导致农民阶层与布尔什维克彻底决裂，继而引发了经济危机。根据布哈林与经济学家尼古拉·康德拉季耶夫合著的论述，未来政府必须推行“新经济政策”，通过计划与市场机制相结合的国家调控实现向社会主义的渐进过渡，即该党成立大会上所言的“城市社会主义，乡村资本主义”。尽管布哈林主义自诩代表“真正的列宁主义”，但其立场在支持人民阵线与主张建立“新型政党”间摇摆不定，其支持者因此对工会的态度亦呈现分歧：一派主张扩大工会权力，另一派则要求将其改造为服从性生产联合体。"

