 tot_dystopian_subtype:0 "反乌托邦体制"
 tot_dystopian_subtype_desc:0 "§Y反乌托邦体制§!\n\n£GFX_ideology_dystopian_bar\n\n\n\n\n反乌托邦体制是一种以高度理性和效率为名，将整个国家和社会变成一台巨大而冷酷机器的统治形态，权力集中于一个声称掌握着绝对真理与科学规划方法的中央机构或领袖手中。它运用最现代化的工业管理手段、严密的档案系统、高效的无线电广播和电影进行无休止的宣传，以及对公民生活从工作到家庭的彻底监视与控制。个人的自由意志、隐私和传统社群被系统性地消除，个体被视为可替换的零件，存在的唯一价值是服务于国家机器设定的宏大而抽象的目标。表面上为全体公民的福祉服务，实则是一种剥夺人性、消灭异议的精密压迫体系。"

 natpop_dystopian_subtype:0 "反乌托邦体制"
 natpop_dystopian_subtype_desc:0 "§Y反乌托邦体制§!\n\n£GFX_ideology_dystopian_bar\n\n\n\n\n反乌托邦体制是一种以民族、种族或某种‘纯洁’的血统为至高信仰基础，最终走向极端压迫的统治形态，它由一个被神化且拥有绝对权威的领袖或核心集团领导，宣称肩负着复兴‘伟大民族’或净化‘民族共同体’的使命。它利用最先进的无线电广播、新闻审查和大型集会进行狂热的煽动性宣传，同时建立庞大的秘密警察网络和告密系统进行严密监控。它依据极端的社会达尔文主义和伪科学理论（如优生学），系统性歧视、迫害甚至消灭被认定为‘内部敌人’或‘劣等群体’的同胞。个体完全湮没于排外的民族狂热洪流中，自由与思想被压制，生存依赖于对领袖意志的绝对服从和对‘民族’这一抽象概念的无限献祭，恐惧成为维系统治的核心手段。"

 Final_Theory_subtype:0 "终末论"
 Final_Theory_subtype_desc:0 "§R终末论§!\n\n£GFX_ideology_Final_Theory_bar\n\n\n\n\n终末论如同笼罩在人类文明上空的幽邃黑影，在时空褶皱里悄然生长，裹挟着超越认知的神秘力量，暗示着世界终将滑向无可挽回的深渊。古老的星图中，某些禁忌的星轨交汇时刻被标记为“终焉之刻”，占星术士们低语着，当参宿四的红光浸透夜幕，便是天地法则崩解的征兆。\n在历史的暗巷中，泛黄的羊皮卷与残破的泥板记录着诡异预言。苏美尔楔形文字里提到“尼比鲁归来之日”，阿兹特克手抄本描绘第七太阳纪的血月吞噬一切，而中国古籍隐晦记载的“荧惑守心”天象，预示着人间将现“九幽裂隙”。这些跨越文明的古老警示，都指向某种超自然力量的觉醒——或许是蛰伏于地心深处的远古邪神，其梦境正以噩梦瘟疫的形式侵蚀人类意识；又或是高维存在投射在现实的扭曲倒影，它们的低语化作极端主义思潮，驱使人类自愿成为毁灭的工具。\n无论是有人声称在极地冰川深处发现史前文明的“末日碑刻”，其上刻满无法解读的螺旋纹路。亦或是在都市的隐秘角落，秘密结社正举行禁忌仪式，试图召唤某种能抹除存在本身的“虚无”，有人猜测，这些都是现实屏障即将破碎的征兆，那些被囚禁在异次元的恐怖存在，正透过这些裂痕凝视着人类世界，等待合适的时机，将宇宙拖入永恒的无序深渊。"

 #大乐队时代

 #邦多利相关
 bangdreamism_subtype:0 "户山香澄思想"
 bangdreamism_subtype_desc:0 "§Y户山香澄思想§!\n\n£GFX_ideology_bangdreamism_bar\n\n\n\n\n作为乐队的吉他和主唱，户山香澄一直在寻找着，如同小时候仰望星空时听到的“星之律动”一样的，闪闪发光而令人心动的事物。由此才促成了"Poppin'Party"的组建。在这个少女乐队时代中闪闪发光的女子高中生5人乐队组合，将自己的心情寄托于音乐当中，为了将更多让人心动不已的事情传递出去而每日歌唱。\n\n乐队十年苦来兮，现在的户山香澄已经被奉为“邦高祖”，她所提出的一系列思想，都被实践所证明是少女乐队的真正诗学。香澄指出，乐队大邦邦的首要原则是:§9“闪闪发光,心跳不已”§!。某乐队大搞大吹所谓“黑暗风”、“阴郁风”乐队成员不积极承认矛盾,让整个乐队生态陷入恶性循环,最终必然导致恶果。\n\n§9邦多利目的是让人欣赏kirakiradokidoki的少女乐队，如果少女乐队导致两极分化,企划就失败了!如果产生什么新的暗黑风少女剧团,那我们就真是走了邪路了!§!"

 Mashiroism_subtype:0 "仓田真白理论"
 Mashiroism_subtype_desc:0 "§Y仓田真白理论§!\n\n£GFX_ideology_Mashiroism_bar\n\n\n\n\n在这战火纷飞的年代，野蛮与暴力似乎掩盖了文明的光辉。但我们坚信，艺术、文化与理性才是引领人类走向光明未来的灯塔。我们致力于守护并发展人类文明的瑰宝，鼓励个人才能的绽放，追求和谐而富有美感的社会秩序。如同交响乐般，每个个体都是乐谱中不可或缺的音符，在卓越领袖的指挥下,共同奏响国家繁荣与进步的华美乐章。我们将以优雅的姿态面对世界的动荡，用文化的力量化解冲突，若和平的努力失败，我们也将为了守护这份理想而展现出钢铁般的意志。"

 LSD_Mashiroism_subtype:0 "倉畾寘苩荲論"
 LSD_Mashiroism_subtype_desc:0 "§Y倉畾寘苩荲論§!\n\n£GFX_ideology_LSD_mashiroism_bar\n\n\n\n\n茬適戰焱妢飛哋姩笩，嘢蠻玙懪劦姒苸殗葢孒妏眀哋洸媈。泹莪們堅信，兿朮、妏囮玙理悻財湜吲領亾類趉姠洸眀沬唻哋燈嗒。莪們臸劦纡垨戶並潑蹍亾類妏眀哋瑰寶，鼔励個亾財能哋綻倣，搥浗啝喈洏冨洧羙憾哋涻浍秩垿。洳哃茭姠泺瘢，烸個個軆嘟湜泺鐠狆芣妸戓蒛哋堷苻，茬婥樾領袖哋栺媈芐,珙哃楱姠國傢瀿荣玙琎荹哋澕羙泺嶂。莪們將姒沋蕥哋恣忲媔怼迣鎅哋憅蕩，鼡妏囮哋劦糧囮解沖湥，婼啝岼哋怓劦妷敗，莪們竾將潙孒垨戶適妢理想洏蹍哯炪鋼鉄瘢哋嬑梽。"

 tomorinism_subtype:0 "高松灯思想"
 tomorinism_subtype_desc:0 "§Y高松灯思想§!\n\n£GFX_ideology_Mygo_bar\n\n\n\n\n世界大战的洪流席卷切，强权们高喊着各自的正义，但我们只看到迷茫与痛苦。我们是谁?我们为何而战?在找到明确的答案之前，我们选择独善其身。国家的目标并非称霸世界或传播某种虚无缥缈的理想，而是在这混乱的时代中守护我们尚存的归宿’，维系内部的纽带,哪怕这意味着不断的争吵、质疑与和解。只有当我们真正理解自己存在的意义时,或许才会发出属于我们的声音。在那之前,我们将在迷途中，寻找活下去的理由。

