 tot_arab_baathism_subtype:0 "阿拉伯复兴主义"
 tot_arab_baathism_subtype_desc:0 "§Y阿拉伯复兴主义§!\n\n£GFX_ideology_arab_baathism_subtype_bar\n\n\n\n\n阿拉伯复兴主义是一种植根于社会主义、民族统一主义、温和民族主义以及部分古典自由主义的泛阿拉伯意识形态运动。面对地方民族主义对国家利益的强调以及伊斯兰主义对宗教认同的呼吁，阿拉伯复兴主义提出了一条以世俗化、社会主义和泛阿拉伯民族统一为特征的发展路径。其终极目标清晰且宏大：建立一个疆域“从大西洋到阿拉伯湾”的单一阿拉伯国家。\n\n该运动的核心纲领包含三个核心要素：​​统一​​（追求跨越现有国界的彻底政治融合，为其绝对核心）、​​自由​​（允许宗教信仰，但严禁宗教势力介入政治）以及​​社会主义​​（强调国家对经济的控制与社会改革，反对西方资本主义）。在政治上，复兴主义依赖强有力且高度集中的先锋政党推动，并坚决反对犹太复国主义在中东的扩张，视其为西方殖民主义与帝国主义的工具。\n\n复兴主义的支持者广泛分布于社会各阶层：进步军官、学生群体以及中产阶级中都可见其身影。然而，对于复兴主义的解读在支持者内部存在显著差异：部分军人仅将其视为政治工具或可操纵的傀儡，对意识形态本身保持距离，这类群体通常不被视作真正的复兴主义者；而更为激进的革命派则对纲领进行了重新诠释，放弃了泛阿拉伯主义，代之以更具地方色彩的方案，并着重强化了纲领中的社会主义元素，常与工团主义思潮结合。尽管解读各异，但所有真正的复兴主义者坚持着一个根本信念：为建立一个自由的阿拉伯国家而奋斗。"

