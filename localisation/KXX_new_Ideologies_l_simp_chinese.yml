 tot_romanianism_subtype:0 "罗马尼亚主义"
 tot_romanianism_subtype_desc:0 "§Y罗马尼亚主义§!\n\n罗马尼亚主义是一种起源复杂的政治思潮，由前铁卫团演说家兼准军事组织领袖米哈伊·斯特雷斯库与持不同政见的共产主义者帕奈特·伊斯特拉蒂共同构建而成。该思想体系在民族主义的基础上进行了深刻的重构，融合了多种看似矛盾的意识形态元素，形成了一种具有独特张力与内在多元性的政治哲学。米哈伊·斯特雷斯库对传统民族主义进行了批判性改造，提出一种以反资本主义立场和“人道反犹主义”为核心诉求的民族观。他一方面排斥传统极右翼中常见的种族主义暴力，另一方面又在文化层面延续了对犹太人的批评，并试图赋予其某种“道德限度”。斯特雷斯库还广泛吸收共产主义中关于社会平等的理念，以及意大利军团主义中关于纪律、共同体与政治美学的成分，使其思想呈现出跨意识形态的混合特征。尽管他的追随者有时被称为“罗马尼亚的索雷尔主义者”暗示其思想中带有工团主义与神话动员的色彩，但实际上，斯特雷斯库的理论体系与乔治·索雷尔甚至乔治·瓦卢瓦的原生思想存在相当差距。\n\n与此同时，帕奈特·伊斯特拉蒂为罗马尼亚主义注入了自由意志社会主义的倾向，强调基层自治、反权威与个体解放的价值。他还融合了另一位重要成员亚历山大·塔莱克斯所倡导的民主愿景，使得这一思潮在政治体制构想上更倾向于一种参与式民主的结构，试图超越传统左右对立的制度框架。从整体来看，罗马尼亚主义虽被归类于泛左翼的思想光谱中，但其内部存在显著的思想张力与不确定性，这一点尤其体现在其核心人物米哈伊·斯特雷斯库的政治立场上。他时而表现出强烈的反共倾向，甚至愿意与罗马尼亚王室合作以实现政治目标；时而又对共产主义理论提出具有原创性的阐释，展现出某种思想上的暧昧与策略性摇摆。这种立场的不稳定性使罗马尼亚主义未能形成统一连贯的意识形态体系使得罗马尼亚主义十字军维持在一个既分裂又统一的矛盾状态。"

 socdem_romanianism_subtype:0 "罗马尼亚主义"
