 tot_antoun_saadeh_thought_subtype:0 "革命安东·萨阿德思想"
 tot_antoun_saadeh_thought_subtype_desc:0 "§Y革命安东·萨阿德思想§!\n\n£GFX_ideology_rev_ssnp_bar\n\n\n\n\n革命安东·萨阿德思想系由叙利亚社会民族党成员加桑·贾迪德所系统阐述。相较于党所奉行的正统安东·萨阿德思想，此理论显著强化了社会主义维度。加桑·贾迪德的思想发展深受其弟、复兴党重要成员萨拉赫·贾迪德学说的影响。\n\n在加桑·贾迪德的理论架构中，国家工团主义被论证为与社会民族党核心纲领——自由、责任、纪律、力量——具有内在一致性。虽然其革命性观点在党内引发争议，但就其思想内核而言，加桑·贾迪德的诠释被认为最贴近安东·萨阿德的原始构想。"

 thaw_antoun_saadeh_thought_subtype:0 "解冻安东·萨阿德思想"
 thaw_antoun_saadeh_thought_subtype_desc:0 "§Y解冻安东·萨阿德思想§!\n\n£GFX_ideology_thaw_antoun_saadeh_thought_subtype_bar\n\n\n\n\n解冻安东·萨阿德思想或称“扎伊姆主义”，是由叙利亚社会民族党名义上的盟友及编外人员胡斯尼·扎伊姆将军所推行的一套理论体系。尽管扎伊姆表面上仍依附于正统的安东·萨阿德思想，其实际行动却与之存在显著背离。\n\n他公开叛离了社会民族党核心的四大纲领——自由、责任、纪律与力量——的主导地位，反而在其执政纲领中注入了该党党员最为抵触的民主自由元素。在政治实践上，“解冻思想”奉行一种名义上半民主、实则威权控制的制度，体现为不动摇其统治根基的有限多党制。扎伊姆的行径招致了绝大多数社会民族党人的强烈谴责并斥其为叛徒。然而，只要其权力不受挑战，扎伊姆对此置若罔闻——于他而言，任何理念都只是巩固统治的工具。"

 revision_antoun_saadeh_thought_subtype:0 "修正安东·萨阿德思想"
 revision_antoun_saadeh_thought_subtype_desc:0 "§Y修正安东·萨阿德思想§!\n\n£GFX_ideology_revision_antoun_saadeh_thought_subtype_bar\n\n\n\n\n修正安东·萨阿德思想是由叙利亚社会民族党忠诚党员阿迪卜·希沙克利所奉行的理论体系。在其漫长的军政生涯中，希沙克利深刻认识到叙利亚人面临的根本问题：民族意识的缺失和伊斯兰教的根深蒂固，而安东·萨阿德的思想恰好为他提供了指引，促使他成为萨阿德理念最坚定的支持者。\n\n修正思想彻底摒弃了正统安东·萨阿德理论中的社会主义元素，代之以极端民族主义。希沙克利对党的四大纲领——自由、责任、纪律、力量——高度认同。尽管被批评者指责为“民族主义暴徒”，他对此类批评毫不在意，矢志以修正安东·萨阿德思想为利剑，为叙利亚民族开辟崭新的黎明。"

 alawism_subtype:0 "阿拉维主义"
 alawism_subtype_desc:0 "§Y阿拉维主义§!\n\n£GFX_ideology_alawism_bar\n\n\n\n\n阿拉维派堪称叙利亚现代化浪潮中的一株革新之花。在应对殖民遗产与宗派分裂的历史困境时，进步派阿拉维主义者选择拥抱世俗化道路，将社会平等理念与阿拉维派宗教宽容传统相融合，同时坚决抵制原教旨主义对社会的侵蚀。相较于保守派宗教学者，他们更倾向以国家主义为纽带重构社会凝聚力，积极推动妇女赋权、全民教育和宗教多元实践。\n\n进步派阿拉维主义者对伊斯兰教法持明确的搁置态度，主张以现代民法体系替代宗教法庭管辖权。阿拉维派根植于阿拉维派独有的信仰主张：信奉伊玛目阿里具有神性本体，强调星辰轮回的宇宙灵魂观，并在隐秘教义中融汇新柏拉图主义哲学与伊斯玛仪派思想。 其思想汲取希腊哲学与启蒙精神，致力于通过现代化教育消除教派隔阂，虽然多数伊斯兰教法学派不承认阿拉维派的地位，但不可否认的是他们对叙利亚的贡献和热爱。"

 druzeism_subtype:0 "德鲁兹主义"
 druzeism_subtype_desc:0 "§Y德鲁兹主义§!\n\n£GFX_ideology_druzeism_bar\n\n\n\n\n德鲁兹派是伊斯兰教什叶派伊斯玛仪支派在叙利亚地区演化出的独特信仰分支，以隐秘的宗教实践和灵活的世俗生存策略著称。该派拒绝传统伊斯兰教法的形式化约束，将哈基姆哈里发奉为神性显现的终极载体，主张通过五大宇宙原则和灵魂转世实现个体与绝对精神的合一，其教义核心强调对独一神的绝对忠诚，同时以七条伦理箴言取代礼拜、朝觐等传统功课，形成了一套去仪式化的信仰体系。\n\n在组织模式上，德鲁兹人构建了“欧格拉”与“朱海拉”的二元社群结构，由通晓《智慧书》奥秘的谢赫阶层主导宗教仪式与伦理教化，他们通常会举行密会诵读经典，而普通信徒仅需遵守基本道德准则，这种分层机制既保障了教义的神秘性，又赋予世俗生活高度自主空间。\n\n面对叙利亚复杂的教派环境，德鲁兹派奉行三重“塔基亚原则”：在宗教压迫下隐匿信仰以保全社群，在教育中渐进揭示真理以维系传统，在政治冲突中表面顺从以换取生存，这种策略使其在逊尼派主导的社会中既保持独立认同，又避免直接对抗。德鲁兹人对多元文化的展开了独特于其他宗教的包容性，德鲁兹人允许信徒自由参与世俗经济活动，积极接纳现代教育和医疗资源，同时通过拜谒圣墓维系精神纽带，将宗教虔敬融入日常伦理而非律法约束，形成一种扎根现实又超脱教条的生活哲学。"

 tot_revolutionary_nationalism_subtype:0 "革命民族主义"
 tot_revolutionary_nationalism_subtype_desc:0 "§Y革命民族主义§!\n\n£GFX_ideology_revolutionary_nationalism_bar\n\n\n\n\n当帝国主义的铁蹄粗暴地碾过那片龟裂、呻吟的大地；当最后一位挺身而出、为民族尊严呐喊的勇士，在冷酷的枪口下轰然倒下，殷红的鲜血便浸透了整个民族的胸膛。无边的恐惧如同浓重的夜雾，沉沉地笼罩四野，然而，在这窒息而深邃的黑暗中，一粒粒名为“革命”的种子，早已悄然深埋进每一个尚未熄灭勇气的心房。地底深处，暗流汹涌，革命者的怒吼如闷雷般积聚、滚动，那是向殖民者发出的、不死不休的决绝战书！\n\n复仇的烈焰，是点燃这革命民族主义最深沉的薪柴。无论信仰何方神圣，抑或只信奉抗争本身，向压迫者倾泻复仇的怒火，便是这绝境中最崇高的天职！一场关乎民族存续的圣战已在弦上，唯有前赴后继，唯有以血肉筑墙，工人要在强国之路上挥汗如雨，士兵需以生命捍卫那初生的、脆弱的自由之光。无论左翼、右翼、中间派，所有歧见在都必须民族存亡的烈焰前灰飞烟灭！待到抵抗者的身影汇聚成不可撼动的山岳，殖民者在他们的身影下瑟瑟发抖，往日的贪婪与压榨终将化为齑粉。直到那一天，挣脱枷锁的人民，必将把自由的名字响彻云霄！"

