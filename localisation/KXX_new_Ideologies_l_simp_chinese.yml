 arab_legionism_subtype:0 "阿拉伯军团主义"
 arab_legionism_subtype_desc:0 "§Y阿拉伯军团主义§!\n\n£GFX_ideology_arab_legionarism_bar\n\n\n\n\n阿拉伯军团主义可以说是伊斯兰军团主义的一朵伴生花。在对抗西方文化入侵时，伊斯兰军团主义者选择了学习欧洲极右翼的组织形式但保留伊斯兰的内核，而阿拉伯军团主义者则更为开放，更为世俗，或者说更加不择手段，倒向了民族主义和全面社会改造。\n\n阿拉伯军团主义者对伊斯兰教法持有模糊的态度，更多的效仿索雷尔主义者和国家工团主义者，力争在全社会构建起进取性的文化风潮。阿拉伯军团主义者势力往往相对薄弱，只能作为其他阿拉伯民族主义运动的激进团体活动，但这不能减损他们为民族献身的决心。"

 islamic_legionism_subtype:0 "伊斯兰军团主义"
 islamic_legionism_subtype_desc:0 "§Y伊斯兰军团主义§!\n\n£GFX_ideology_islam_legionarism_bar\n\n\n\n\n伊斯兰军团主义是伊斯兰主义在面对西方世界的军事和文化冲击时产生的变种。不同于传统的更倾向保守主义、扎根家庭与乡村的伊斯兰主义，伊斯兰军团主义在组织模式和动员方式上更加西化，更多的依靠政党政治和民兵部队。伊斯兰军团主义学习其他极右翼政治团体的组织模式，将伊斯兰教法和古兰经作为行动准则，又掺杂了种族民族主义和犹太资本阴谋论。\n\n伊斯兰教法教育穆斯林和善友爱，而伊斯兰军团主义者对这些训诫嗤之以鼻，真主至大，但是对民族和教派敌人就要不择手段。欺诈，刺杀，恐怖袭击，这就是穆贾希德的生活。"

 tot_islamism_subtype:0 "伊斯兰主义"
 tot_islamism_subtype_desc:0 "§Y伊斯兰主义§!\n\n伊斯兰主义是一种样式多变的神学意识形态。伊斯兰主义国家的宪法、社会经济、司法和文化都会以符合伊斯兰信仰及相关教义为前提来架构。伊斯兰主义与社会主义存在着许多共通点，例如反对自由主义与奢侈浪费，支持社会正义与财富公平分配，反对剥削，在《古兰经》中甚至提出了“各人只得享受各自的劳绩”这种明显违背资产阶级道德的论断。\n\n伊斯兰主义的具体执行方式极大的受到宗教组织或执政党的影响，通常不会成为完全的神权政体，而是扎根于共和制度、军国主义、民族主义，抑或在极少数的情况，若能得到穆斯林国民的大力支持或要求，也可能以民主运动或体制的形式展现出来。伊斯兰主义并不存在《古兰经》与圣训以外的其他绝对原则，对经典的“断章取义”或“新解读”，使伊斯兰主义成为了一个从温和到极端，从保守到激进遍布意识形态光谱的理论。"

 canaanist_subtype:0 "迦南主义"
 canaanist_subtype_desc:0 "§Y迦南主义§!\n\n£GFX_ideology_canaanism_bar\n\n\n\n\n迦南主义，亦称为闪族主义、闪族民族主义，或戏仿锡安主义的扎丰主义，是一场植根于以下信念的意识形态运动：黎凡特及更广大闪族世界的人民——犹太人、阿拉伯人、腓尼基人、阿拉米人及其他古代民族——并非截然分离的群体，而是一个单一被掩埋的文明的继承者：迦南。迦南主义旨在将这一身份复兴为一个鲜活的现代政治工程，打破欧洲殖民框架，同时也摆脱奥斯曼帝国和西方列强强加的种种分裂民族主义。\n\n当锡安主义诉诸犹太身份，阿拉伯民族主义诉诸伊斯兰或语言统一时，迦南主义提出了一条第三条道路：植根于古代近东土地、神话与血脉的地区文明身份之重生。它是一个世俗的、超越部族的理想，致力于将闪族人民统一起来，不是基于宗教或种族，而是基于共同的文化与历史命运。迦南主义者们的抱负各异。温和派迦南主义者主张建立一个涵盖古代以色列、犹大和非利士地——大致相当于现代以色列-巴勒斯坦——的共和国。然而，激进派迦南主义者则构想一个辽阔的迦南共和国，其疆域从摩洛哥的大西洋沿岸延伸至美索不达米亚的双子河，统一所有曾被闪族语言、腓尼基贸易或帝国记忆触及的土地。在他们眼中，推罗、迦太基、巴比伦和耶路撒冷并非独立的遗产，而是一块块被遗忘帝国的碎片等待着被重铸。\n\n迦南主义在意识形态上呈现多样性。左翼表现为工团主义复振与后殖民团结，将迦南共和国塑造成摆脱帝国主义的、工人领导的闪族人民联盟。右翼则趋向民族主义、民族统一主义，有时甚至带有种族化色彩——声称对曾失去的土地拥有神圣或祖先赋予的统治权。然而，两派都认同：一个新的、世俗的共和国必须从殖民主义和教派主义的废墟中崛起，因为唯有通过国家形态，迦南人民才能真正重生。人们见到的是远古神话，迦南人见到的却是未来。从推罗的灰烬与迦太基的盐碱中，一簇烈焰已然重燃。"

