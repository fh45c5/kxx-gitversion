 anarchy_subtype:0 "无政府状态"
 anarchy_subtype_desc:0 "§Y无政府状态§!\n\n无政府状态通常可区分为两种具有本质差异的情形。第一种源于无政府主义政治理想的实践，国家机构被彻底废除，取而代之的是一种基于自愿合作与自治的有序社会结构。在此模式下，原本由政府承担的立法、司法、行政等职能，转由各类自治委员会、社区议会或人民委员会以自下而上的方式承接。社会成员通过广泛参与和直接民主实现自我治理，权力高度分散，不依赖于任何强制性中央权威。\n\n第二种情形则指向国家崩溃后的失序现实，表现为中央政府权威彻底瓦解，丧失对暴力手段与公共事务的垄断能力。在这一状态下，领土往往被多个割据势力或军阀割裂控制，法律与秩序让位于持续冲突与普遍暴力。此类无政府状态多为过渡时期，通常随着某一强势集团在斗争中胜出并重建中央集权而终结。然而，也存在另一种发展轨迹：当权力真空持续扩大，社会结构不断瓦解，公共治理彻底缺位，可能导致该区域人类组织形态的不可逆崩溃，直至其承载的文明活动逐渐湮灭。"

 worker_legionarism_subtype:0 "工人军团主义"
 worker_legionarism_subtype_desc:0 "§Y工人军团主义§!\n\n在一个以农业为根基的农民国家中，工人群体往往成为最容易被忽视的阶层。他们长期承受着各种不公待遇，尽管他们也是这个民族或国家的一份子，但国家政策与舆论关注却大多倾注在农民问题上，对工人的诉求视若无睹。即便存在工会一类组织，工人阶级的集体发声能力依旧极为有限，难以撼动根深蒂固的体制性忽视。正是在这样的背景下，一种被称为“工人军团主义”的思潮悄然兴起。大天使弥哈伊军团的创始人科尔内留·泽莱亚·科德利亚努敏锐地察觉到了工人阶级中潜藏的力量。尽管军团在本质上仍是一个保守的农民组织，但工人阶层在其内部的比重与影响力日渐增强。这些工人逐渐聚集在两位关键人物周围：一位是特兰西瓦尼亚铁卫团总指挥霍里亚·西马，另一位则是工人纠察队队长格奥尔基·克莱蒙。他们不仅在组织内部争取话语权，更试图将工人群体的诉求推向政治斗争的前沿。\n\n随着国家逐步走上工业化道路，工人的数量与力量不断壮大。工人军团主义致力于将普通工人转化为高度纪律化、狂热投身于生产的“生产战士”，同时在实践中不断争取并改善工人的实际待遇。其中，格奥尔基·克莱蒙所领导的工人纠察队表现尤为突出，他们不仅维护工人秩序，更在基层推动权益斗争，成为工人利益的实际捍卫者。在意识形态层面，工人军团主义试图将强调工会斗争与经济权力的工团主义，与传统上强调纪律、等级与民族主义的军团主义相融合。这种结合使其在农民保守主义的底色之外，注入了一股底层革命的动力，从而塑造出一种更具战斗性与变革意识的政治路线。其最终目的，是建立一个不同于左翼国际主义叙事的、以工人为核心的专政国家，实现一种扎根于本土现实、却又强烈排他的工人政权理想。"

 slovak_populism_subtype:0 "斯洛伐克人民主义"
 slovak_populism_subtype_desc:0 "§Y斯洛伐克人民主义§!\n\n£GFX_ideology_slovak_peopleism_bar\n\n\n\n\n斯洛伐克人民主义是由斯洛伐克赫林卡人民党创始人安德烈·赫林卡、首席理论家约瑟夫·蒂索以及激进民族主义代表人物沃伊泰克·图卡共同构建并推行的一套系统化政治意识形态。该思想体系以《资本与劳动的权利与义务》与《四十年通谕》为核心理论根基，坚定捍卫基督教伦理价值观，强烈反对社会主义与共产主义所宣扬的阶级斗争理念，同时也对自由主义中的世俗化趋势及放任自流的经济自由主义提出深刻批判，并明确倡导构建一种国家法团主义的社会组织结构。斯洛伐克人民主义以其极端的斯洛伐克民族主义立场而显著区别于其他政治思潮。它不仅强烈抵制当时在斯洛伐克政治环境中占据主导地位的捷克斯洛伐克主义，也对马扎尔人与犹太人表现出鲜明的排斥态度，公开主张将所有犹太人与马扎尔人驱逐出斯洛伐克领土，并致力于“收复”其所认定的历史失地，以实现民族空间的纯粹性。在文化政策方面，斯洛伐克人民主义极力推崇斯洛伐克传统文化以及天主教的支配地位，广泛支持一系列社会保守主义措施，旨在强化民族认同，维护社会结构的统一性与道德纯洁性。"

 pataut_slovak_populism_subtype:0 "斯洛伐克人民主义"
 pataut_slovak_populism_subtype_desc:0 "§Y斯洛伐克人民主义§!\n\n£GFX_ideology_slovak_peopleism_bar\n\n\n\n\n斯洛伐克人民主义是由斯洛伐克赫林卡人民党创始人安德烈·赫林卡、首席理论家约瑟夫·蒂索以及激进民族主义代表人物沃伊泰克·图卡共同构建并推行的一套系统化政治意识形态。该思想体系以《资本与劳动的权利与义务》与《四十年通谕》为核心理论根基，坚定捍卫基督教伦理价值观，强烈反对社会主义与共产主义所宣扬的阶级斗争理念，同时也对自由主义中的世俗化趋势及放任自流的经济自由主义提出深刻批判，并明确倡导构建一种国家法团主义的社会组织结构。斯洛伐克人民主义以其极端的斯洛伐克民族主义立场而显著区别于其他政治思潮。它不仅强烈抵制当时在斯洛伐克政治环境中占据主导地位的捷克斯洛伐克主义，也对马扎尔人与犹太人表现出鲜明的排斥态度，公开主张将所有犹太人与马扎尔人驱逐出斯洛伐克领土，并致力于“收复”其所认定的历史失地，以实现民族空间的纯粹性。在文化政策方面，斯洛伐克人民主义极力推崇斯洛伐克传统文化以及天主教的支配地位，广泛支持一系列社会保守主义措施，旨在强化民族认同，维护社会结构的统一性与道德纯洁性。"

