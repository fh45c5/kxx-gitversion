 soclib_gandhism_subtype:0 "甘地主义"
 soclib_gandhism_subtype_desc:0  "§Y甘地主义§!\n\n甘地主义是对莫罕达斯·卡拉姆昌德·甘地思想、理念及毕生心血结晶的非正式称呼，不过圣雄本人以及对这一思想体系做出过重大贡献的同时代人，如普什图人的“边地甘地”阿卜杜勒·加法尔汗，从未使用过“甘地主义”一词。甘地主义以“悟力”为基础，“悟力”字面意思为“坚持真理”，是印度独立运动中的一种特殊思想形式，主张非暴力、民间抵抗。甘地主义者会以和平的方式抗议行恶的政府、政策，不诉诸流血暴力而以间接方式推动进步改革和社会变革，不到万不得已就不会使用自卫手段——不过，关于这一自卫规定其实也充斥着争议，甘地的许多弟子就坚持彻底的非暴力、不杀生。此外，甘地主义还倡导平等的宗教团结，尤其是因对立、仇恨而戕害这片土地达百年之久的印度教徒和穆斯林之间的团结（值得一提的是，甘地本人是从印度教角度出发，从禁欲思想中创造出这一理念的，而其好友加法尔汗则是以穆斯林的角度，从普什图族法典中得出的），以及非暴力的爱国主义、民族主义思想，还有人权与自由、斋戒与素食等。经济上，甘地主义推崇简朴生活、自给自足、以重视国民物质需求先于财富和工业化的农业为主的进口替代，以及从亨利·大卫·梭罗、列夫·托尔斯泰等社会主义思想家那儿借鉴来的乌托邦无政府主义、和平进步主义理念。虽然其“缔造者”有意回避甘地主义一词，甘地本人和“边地甘地”也不认可其为一种意识形态，但甘地主义还是对南亚内外的政治、文化和精神产生了重大影响，遍布全球的甘地主义者也在用除自卫外坚决不实施暴力的和平手段表达着自己的诉求。"

