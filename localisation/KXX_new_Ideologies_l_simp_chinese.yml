 tot_ikedaism_subtype:0 "池田主义"
 tot_ikedaism_subtype_desc:0 "§Y池田主义§!\n\n£GFX_ideology_ikedaism_bar\n\n\n\n\n池田主义，是政治思想家池田纯久于1929年提出的一种意识形态思想。该意识形态总体上是左倾的，支持北一辉等国家社会主义经济思想，但实际池田的思想旨在被其领导人与池田关系密切的统制派所采纳。该意识形态是反马克思主义的，但仍然主张建立社会主义军事幕府。它受到日本“帝国”左派的赞扬，但受到国外马克思主义者的谴责，特别是由于其意识形态宣扬帝国主义、阶级进化、民族主义和极端军国主义立场。"

 socialism_with_chinese_characteristics:0 "中国特色社会主义"
 socialism_with_chinese_characteristics_desc:0 "§Y中国特色社会主义§!\n\n£GFX_ideology_deng_bar\n\n\n\n\n邓小平思想（又名中国特色社会主义）试图改革中国的社会主义体系，以便与敌对国家竞争。邓小平认为工团主义意识形态在实现中国现代化方面失败了，他寻求建立经济特区，外国公司可以在该特区投资和竞争，从而使中国在经济意义上变得更大。邓小平在生产力理论下强调经济生产。在邓小平看来，中国领导层面临的任务是双重的：促进中国经济的现代化，维护中国共产党的思想统一及其对现代化所需艰难改革的控制。\n\n“我们不再知道什么是社会主义，也不再知道如何实现社会主义，但它仍然是我们的目标。”\n\n-邓小平"

 tot_socialism_with_chinese_characteristics:0 "中国特色社会主义"
 tot_socialism_with_chinese_characteristics_desc:0 "§Y中国特色社会主义§!\n\n£GFX_ideology_deng_bar\n\n\n\n\n邓小平思想（又名中国特色社会主义）试图改革中国的社会主义体系，以便与敌对国家竞争。邓小平认为工团主义意识形态在实现中国现代化方面失败了，他寻求建立经济特区，外国公司可以在该特区投资和竞争，从而使中国在经济意义上变得更大。邓小平在生产力理论下强调经济生产。在邓小平看来，中国领导层面临的任务是双重的：促进中国经济的现代化，维护中国共产党的思想统一及其对现代化所需艰难改革的控制。\n\n“我们不再知道什么是社会主义，也不再知道如何实现社会主义，但它仍然是我们的目标。”\n\n-邓小平"

 ho_chi_minh_thought_subtype:0 "胡志明思想"
 ho_chi_minh_thought_subtype_desc:0 "§Y胡志明思想§!\n\n£GFX_ideology_ho_chi_minh_bar\n\n\n\n\n与中国的革命农业主义类似，胡志明思想拒绝将工业化工人阶级视为工人革命先锋的欧洲中心思想，并认为先锋应该由农村农民组成。然而，胡志明在其中加入了自己对革命农业主义的扩展，他融入了儒家和佛教伦理，儒家的自我修养被推广为政党政治和社会主义生活方式的核心元素。在胡志明看来，儒家思想的优点是个人道德的教训、基督教的优点是高尚的仁爱、马克思主义优点则是辩证法。"
 lin_biaoism_subtype_desc:0 "§Y极左红卫兵主义§!\n\n林彪是毛泽东的追随者，他将毛泽东主义作为自己的理论。与毛泽东不同，林彪在第三世界主义和毛泽东的个人崇拜的基础上，相信尽可能利用解放军的“农村到农村”来传播革命。并进一步将解放军视为无产阶级专政的支柱，进一步视为革命的农民先锋。"

 mao_zedong_thought_subtype:0 "毛泽东思想"
 mao_zedong_thought_subtype_desc:0 "§Y毛泽东思想§!\n\n£GFX_ideology_mao_zedong_thought_bar\n\n\n\n\n毛泽东思想指的是湖南左翼革命家和教育家毛泽东的一系列思想，其受到了布尔什维主义、无政府主义、工团主义、三民主义甚至俄罗斯民粹主义等一系列思想的影响。毛泽东认为党的作用就是教员，教员不等于“皇帝”、“领袖”和救世主，在教员教会学生知识和自己学习之后就不再需要教员了。毛泽东认为，教员和党一样，不能完全地包办代替学生，抹杀学生的思想，而是应该鼓励学生自己探索自己学习，为其学会自己学习和自由发展提供一个好的环境，所以毛鼓励劳动群众用运动民主等手段逐步学习自己管理自己。同时，毛泽东坚决地支持农民，他认为农民占中国革命的重要组成部分，也具有巨大的先进性，可以建立起来农业社会化，正因如此，毛泽东坚决反对工农剪刀差，将其视作对农民的剥削。毛泽东思想还强调建立全新的教育体系，让学生在劳动实践中验证理论，让工农学习理论，从而逐渐消灭脑力劳动和体力劳动的分界线，并且促进学生自由发展。"

 radsoc_mao_zedong_thought_subtype:0 "毛泽东思想"
 radsoc_mao_zedong_thought_subtype_desc:0 "§Y毛泽东思想§!\n\n£GFX_ideology_mao_zedong_thought_bar\n\n\n\n\n毛泽东思想指的是湖南左翼革命家和教育家毛泽东的一系列思想，其受到了布尔什维主义、无政府主义、工团主义、三民主义甚至俄罗斯民粹主义等一系列思想的影响。毛泽东认为党的作用就是教员，教员不等于“皇帝”、“领袖”和救世主，在教员教会学生知识和自己学习之后就不再需要教员了。毛泽东认为，教员和党一样，不能完全地包办代替学生，抹杀学生的思想，而是应该鼓励学生自己探索自己学习，为其学会自己学习和自由发展提供一个好的环境，所以毛鼓励劳动群众用运动民主等手段逐步学习自己管理自己。同时，毛泽东坚决地支持农民，他认为农民占中国革命的重要组成部分，也具有巨大的先进性，可以建立起来农业社会化，正因如此，毛泽东坚决反对工农剪刀差，将其视作对农民的剥削。毛泽东思想还强调建立全新的教育体系，让学生在劳动实践中验证理论，让工农学习理论，从而逐渐消灭脑力劳动和体力劳动的分界线，并且促进学生自由发展。"

 radsoc_socialist_confucianism_subtype:0 "社会主义儒学"
 radsoc_socialist_confucianism_subtype_desc:0 "§Y社会主义儒学§!\n\n社会主义儒家思想是一种兼收并蓄的意识形态，既借鉴了孙中山的社会福利主义思想，也借鉴了源自儒家思想的传统信仰。这种意识形态试图促进以儒家社会关系为模式的社会和谐，但也在社会改革或彻底消除“落后”社会结构方面采取了进步立场。对于这种意识形态的拥护者来说，未来可以通过使用过去的思想来真正揭露——一些人认为，它将引导中国走向其真实的存在状态，并在世界上获得应有的地位。"
