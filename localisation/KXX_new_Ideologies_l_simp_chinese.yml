 pataut_hindutva_subtype_desc:0  "§Y印度教民族主义§!\n\n印度教民族主义这一概念作为所谓“印度教性”的体现，早在二十世纪前便由极端印度教民族主义者钱德拉纳特·巴苏提出。他将印度教徒视为真正的雅利安人，亦即唯一获得灵性觉醒、誓死捍卫神性传统社会的族群。但这一意识形态的真正兴起，则要归功于自诩无神论者的维纳亚克·达莫达尔·萨瓦卡尔的巨大努力。他提出印度教应囊括所有印度文明元素，由此构建的现代印度教特性理论立足于三大支柱：共同国度、共同血统与共同文明，旨在统合印度教、佛教、耆那教与锡克教信徒，将“从印度河到海洋的婆罗多大地既视为祖国，也奉为宗教发源的圣地”。依照该理论，穆斯林与基督徒必须被驱逐出境，或是被迫承认自己只是“客居”于此的异族，唯有接受高等文明或逃回其海外圣地才能苟存。在宗教传统主义方面，萨瓦卡尔巧妙平衡了婆罗门高种姓势力与社会革命诉求，试图以此复兴印度教价值观：女性可接受教育，但需以成为贤妻良母为指向；已被纳入民族主义组织的“不可接触者”虽被称作兄弟，仍需等待种姓枷锁最终粉碎的那一天。全印度印度教大会由此成为南亚次大陆最重要的右翼民族主义力量，引领印度教大斋会等组织共同构建作为“完美且不可分割的印度”的“印度教国家”。其中，海德格瓦与戈尔瓦卡领导的国民志愿服务团深受欧洲军团主义启发（甚至在影响上更胜萨瓦卡尔一筹），自创立起便致力于动员民众巩固民族认同、对抗社会主义侵蚀。该组织将欧洲军团主义者动员民众实现民族团结、抵制社会主义侵蚀的实践奉为圭臬——这也成为国民志愿服务团自成立以来的核心斗争方向。"

