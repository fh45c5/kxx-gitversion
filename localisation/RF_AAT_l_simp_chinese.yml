 MNS_choona_unification:0 "统一中国"
 SQI_ronin_of_manshu:0 "屈从于外国统治"
 SQI_ronin_of_manshu_desc:0 "别指望自己说了算了。该交粮交粮，该修路修路。不听话的村子就烧掉，听话的可以留条活路。"
 MNS_blacked_dragons:0 "平定乡村"
 MNS_blacked_dragons_desc:0 "乡下总是藏着麻烦。我们挨家挨户的搜，枪藏在灶台下就毙了。土匪、民兵、普通农民——分不清，也不用分清。\n 我们的子弹够用。"
 SQI_red_beards:0 "让知识分子闭嘴"
 SQI_red_beards_desc:0 "那些写文章骂人的，关起来几个就老实了。报纸停掉，学堂换掉教材。谁再敢说“亡国奴”三个字，舌头就别要了。"
 SQI_se_no:0 "这片土地的未来"
 SQI_se_no_desc:0 "这里没有未来了。这里的粮食是我们的，这里的矿产是我们的。他们只需要干活、生孩子、服从……是啊，这片土地如此肥美，仿佛唾手可得，是不是我们的其中一方有机会独占它呢？"
 MNS_asian_future:0 "日本浪人"
 MNS_asian_future_desc:0 "张宗援和他手下的日本浪人击败了俄国人！秩序恢复后，我们就可以在他的领导下走向一个崭新的未来了——显然张宗援对于我们有许多的想法与安排……我们只要随他前进就好。"
 MNS_yihequan_past:0 "俄国哥萨克"
 MNS_yihequan_past_desc:0 "安年科夫阿塔曼击败日本人之后，第一件事并非纵兵劫掠，而是建立秩序——一种哥萨克式的、纪律严明的秩序。各村镇被要求选派代表至司令部登记造册，凡配合者可领取一面白蓝红的三角旗作为通行凭证。秩序建立之后，一切便都名正言顺了。名义上这里是自治的，实质上哥萨克骑兵仍是这里唯一的主宰。将军本人对这种安排十分满意，声称终于找到了一片可以安身立命的土地——毕竟他已经很难再回到故乡了。"
 MNS_threekingdoms:0 "无浪漫之三国志"
 MNS_threekingdoms_desc:0 "别想什么英雄好汉。征壮丁去修铁路、挖煤、炼钢。累死了再换一批。机器不能停，产量不能降。既然这是此处的现实，他们将学会服从。"
 MNS_take_their_guns:0 "拿起枪炮"
 MNS_take_their_guns_desc:0 "打了几仗，缴获不少。新皖系产的步枪、南直系产的支援装备、北直系产的大炮——全归我们了。他们的兵死了，武器在我们手里活了。"
 MNS_cut_their_lines:0 "掠夺补给"
 MNS_cut_their_lines_desc:0 "村里搜粮，城里抢仓库。马匹、汽油和棉布全拉走。不够？下一座城还有。敌人留下什么，我们就拿走什么。"
 MNS_burn_crops:0 "终结联合的混乱"
 MNS_burn_crops_desc:0 "南边搞什么“省联”抱团，内战的事实证明他们不过是一团散沙。一个省一个省碾过去，让他们签了条约就老实了。混乱终结后，我们都说了算。"
 MNS_shatter_tools:0 "推翻北京政权"
 MNS_shatter_tools_desc:0 "北直系那帮人占着北京太久了。该换上我们的旗帜了。皇帝还是总统？都不如刺刀好使。"
 MNS_cashier_swords:0 "驱逐西方殖民者"
 MNS_cashier_swords_desc:0 "租界里那些英德鬼佬以为他们才是主子？滚出去。这里现在是我们的地盘了。洋人的房子、码头、银行，全归我们。"
 MNS_drive_bastards:0 "南方战役"
 MNS_drive_bastards_desc:0 "两广那边的军阀多得像蚂蚁，国民党的势力也盘踞在那边。我们不着急，一个一个收拾……这些威胁总会消失在我们的眼睛里的。"
 MNS_castrate_robbers:0 "西部诸雄"
 MNS_castrate_robbers_desc:0 "西北全是不同的荒漠和山头，军阀们也穷。但是穷也得打——占了城池，控制商路，这里的领土将属于我们。"
 MNS_back_across_amur:0 "拿下满洲"
 MNS_back_across_amur_desc:0 "东北是块大肥肉。原来的主人不中用了，所以我们来接手。铁路、工厂、大豆，全是抢手的战利品。谁敢不服，铁路边上挂一排。拿下满洲，我们的这盘棋就活了。"
 SQI_raising_banners:0 "泛亚主义旗帜"
 SQI_raising_banners_desc:0 "亚洲是亚洲人的亚洲，这一信念早在数十年前便在大陆浪人中流传。而今时机终于成熟——以山东为起点，联合一切可以联合的力量，建立一个没有西方殖民者插手的亚洲新秩序便是我们的使命。"
 MNS_mongol_brothers:0 "我们的蒙古兄弟"
 MNS_mongol_brothers_desc:0 "草原上的骑兵从不缺乏勇气，他们缺的只是一个正确的方向。蒙古王公们的诉求与我们的蓝图并不矛盾——自治的权利、传统的延续、不受南方政客摆布的尊严。双手握在一起，比各自为战要稳当得多。\n合作愉快。"
 MNS_noble_manch:o"满洲贵族"
 MNS_noble_manchu_desc:0 "龙兴之地的旧主人们从未真正接受过军阀的统治。八旗的荣光、祖坟的香火、冠冕上的珍珠，这些东西在共和的浪潮中正在被冲刷殆尽。给他们一个体面的位置，他们便还你一支安静的旗兵。\n合作愉快。"
 SQI_hotline_fuji:0 "联络黑龙会"
 SQI_hotline_fuji_desc:0 "黑龙会的名号在这片土地上经营了数十年，从满洲的密林到日本的码头，处处都有他们的耳目。将这些浪人收编入体制，既是对多年交情的交代，也是情报网络工作上的最优解。他们从日本带来了我们需要的忠诚与技术经验。 "
 MNS_sidelining_warlords:0 "排挤军阀"
 MNS_sidelining_warlords_desc:0 "地方上的实力派们既无信仰也无原则，谁给枪便跟谁走。然而这样的人永远无法成为事业的核心——今日能收编，明日便可能被更大的收买者撬走。与其养虎为患，不如趁早清除。 "
 MNS_chivalric_cavalry:0 "侠士骑兵"
 MNS_chivalric_cavalry_desc:0 "马背上的好汉需要升级了。给最好的骑手配上摩托化装备，令其从传统的劫掠变成闪电式的突击。在平原与公路上，轮胎比马蹄更快。既有侠士之名，又具现代之实。 "
 SQI_five_races:0 "五族同旗"
 SQI_five_races_desc:0 "日、满、蒙、汉、回，五根手指握成拳头才有力量。一面旗帜之下，五色条纹并列，象征平等与团结。各族精英坐在一起议事，向外界展示一个包容繁荣的东方大家庭。"
 MNS_rattling_sabers:0 "以恐怖统治"
 MNS_rattling_sabers_desc:0 "任何政权都需要一套行之有效的惩戒体系，哥萨克的办法最为直截了当。骑兵队在乡间巡逻时习惯于让马刀拖地而行，那刺耳的摩擦声从村口响到村尾，比张贴任何布告都管用。集市上偶有争执，军官们会当着众人的面摘下刀鞘，喧闹便即刻平息。这种管理模式成本极低，不需要牢房，不需要文书，甚至不需要审判，暴力威慑就是这座土地上最有效的沟通工具。"
 SQI_our_fair_due:0 "我们应得的"
 SQI_our_fair_due_desc:0 "在哥萨克的理解中，胜利者的权利在战刀停下的那一刻就已确立。山东的工厂、矿山、盐场和粮仓，皆属战利品。以“军事租借”的名义接收几家大型纱厂，每月从码头抽取关税，向当地商会征收保护费——既然付出了占领的代价，获得相应的报酬便是天经地义。至于代价由谁支付，那不是我们需要关心的问题。"
 SQI_land_they_stole:0 "奴役农民"
 SQI_land_they_stole_desc:0 "当地农民对这片土地的依恋是令人费解的，他们宁愿忍受反复的拉夫与征粮，也不愿离开自己的一亩三分地。既然如此，便为他们的勤劳寻找一个更高效的出口。我们将大量仔细的规划持续盘剥的收农业税方法——农民还需承担道路养护、军营修缮和粮草运输等义务。"
 MNS_rape_of_harbin:0 "扩大劫掠"
 MNS_rape_of_harbin_desc:0 "当本地资源无法满足哥萨克师的规模扩张时，将目光投向更远的地方是理性的选择。南方的铁路沿线有北洋溃退后丢弃的军需物资，西边的内陆城镇里藏着商贾们数代积累的财富。骑兵们轮番出击，每一次行动都携带详细的作战地图和明确的物资清单。"
 SQI_warring_states:0 "战争之国"
 SQI_warring_states_desc:0 "在这片土地上，和平只是两场战争之间的喘息。山东作为一座俄罗斯的前哨基地，时刻准备迎接来自四面八方的敌人——赤色分子、中国军阀、日本人……每一个适龄男子都要接受基本的军事训练，每一座城镇都要储备战争粮秣。"
 SQI_defend_our_home:0 "强盗与土匪的政权"
 SQI_defend_our_home_desc:0 "外界总是喜欢给事物贴上标签，比如“强盗”、“土匪”之类的字眼。但在安年科夫看来，这无非是失败者为自己寻找的借口。这世上本没有什么强盗，只有尚未取得正统地位的统治者。我们的规矩直截了当——服从者活，反抗者死，合作者得利。这套规则清晰明了，远远胜过那些满口仁义道德的文人政府。至于外人如何称呼，就让他们随便叫吧。"
 MNS_render_unto_huangdi:0 "安年科夫的王国"
 MNS_render_unto_huangdi_desc:0 "司令部前的旗杆上挂着哥萨克的军旗，地图上的行政边界被再次绘制，每一座城市都被任命了效忠安年科夫的驻防官。在官方宣传中，这是一片法治之地、秩序之地、进步之地。而在将军本人的笔记中，他用铅笔划掉了“中国”，写下了：“我的”。"
 SQI_victory_over_maozi:0 "拿下中国"
 SQI_victory_over_maozi_desc:0 "九州之地，尽在我手。\n纵横数载，神州换了容貌……\n我们该迈向更大的雄心了。"
 SQI_heilong_clique:0 "宣称泛亚联邦"
 SQI_heilong_clique_desc:0 "亚洲的门罗主义并不是空谈。从朝鲜半岛到印度支那，从满洲平原到南洋群岛——所有被白人殖民者奴役过的地方，终将在一面旗帜下重获自由。联邦的版图是我们最终的野心，一张迟早要兑现的支票。"
 MNS_forward_march:0 "无尽的前进"
 MNS_raised_banners:0 "升起我们的旗帜"
 MNS_raised_banners_2:0 "升起我们的旗帜"
 MNS_pan_asian_unity:0 "泛亚联盟"
 MNS_pan_asian_unity2:0 "泛亚联盟"
 MNS_pan_asian_unity3:0 "泛亚联盟"
 MNS_noble_manchu:0 "满洲贵族"
 MNS_rattling_sabres:0 "咔咔作响的军刀"
 MNS_fair_due:0 "掠夺经济"
 MNS_landback:0 "奴役农民"
 MNS_landback2:0 "奴役农民"
 MNS_situation_excellent:0 "情况非常好！"
 MNS.1.t:0 "济南之夜"
 MNS.1.desc:0 "两位幸存者主持会议，中国人的财产在他们身后燃烧。\n\n对于这两人来说，过去几周的成功是他们做梦都想不到的。在山东，北京的控制一直很薄弱，这也就意味着，假如一方能干掉一方，就可以独霸这方土地。很快，会议室就变成了战场，人们只能听到哥萨克马刀与日本武士刀的碰撞声以及两种不同的惨叫。当黎明到来时，有一方已经赢得了胜利。这一方是……"
 MNS.1.a:0 "……安年科夫的哥萨克。"
 MNS.1.b:0 "……张宗援的浪人。"
 MNS_zhang_zongyuan_desc:0 "张宗援或伊达顺之助，另一位在亚洲大陆寻找自己道路的“浪人”，出生于伊达武士世家的一个小支中，虽然其父是仙台藩的总督，其祖父在明治天皇手下任职，但他的青年时期却一团糟。他在初中时误杀同伴后险遭判处监禁，经过上诉才得以缓刑，在从早稻田大学辍学前，他在多所学校间徘徊。未来的前景看起来令人生疑，直到与一名日本间谍和一名满洲皇室的讨论将他拖入代表日本皇军的肮脏工作。\n\n伊达的犯罪记录，或服务记录，遍及全地，取决于你问的是谁。起初他只是短暂地参与了分裂中国和满洲的失败的满蒙独立运动，后来又参与了多次未遂暗杀行动——甚至是1919年针对日本首相的暗杀。在返回中国前的几年里，他还参与了打击朝鲜土匪和民族主义者的行动，在那里，他支持反对共和国的地区主义运动的目标意外地使他与奉系军阀将军张宗昌成为友人。伊达在泛亚主义的义愤下，为了团结，将自己的名字和民族身份都改为华人。\n\n当奉系被消灭后，宗援在山东的情报网也被打乱了，他回到日本境内活动，策划对蒙古和黄俄罗斯的袭击。不幸的是，东京的注意力集中在国内动荡和对华战争上，这意味着这位未来的军阀很快就会在几乎没有监督的情况下行动了。宗援在蒙古冒险时，黄俄罗斯解体了，这位落魄贵族看到了几十年来的天赐良机。他年轻时与北一辉等学者的友谊潜在地赋予了他的工作一种不仅是支持日本帝国主义的意识形态特征。山东能否成为泛亚斗争的新基地？当这位浪人再次拔剑出鞘时，全世界都屏住了呼吸。"
 MNS_zhang_zongchang_desc:0 "张宗昌，你的一生多么精彩。他生于山东，父亲是一个酗酒的理发师/喇叭手，母亲是一位神婆，而他注定会有一个不寻常的童年。当他十几岁时父母离异，他和母亲搬到哈尔滨，在那里，张宗昌从事保镖、扒手和探矿工以维持生计。为了工作，他进一步前往西伯利亚，在日俄战争中，他最终在俄国军队中担任辅助人员，然后在回到中国后，成了一个略微支持革命的土匪。1913年，在他的顶头上司因不忠而被处决后，他发现自己在变幻莫测的军政中得以指挥一个师，然后他工作了近十年以避免同样的命运。\n\n张宗昌于1922年加入奉天军阀，给满洲的军阀领导层留下了深刻的第一印象。也许是因为他在1905年战争中的经验，但他被证明是一个有能力的指挥官，能利用他在俄罗斯远东的关系来获得装甲列车、医务人员和洋军事教官。另一方面，奉系参与中国的毒品贸易预示着这位最终被称为“狗肉将军”的人的阴暗面。在被逐出上海后，他被任命为其家乡山东的军事长官，这一时期他因暴力和享乐堕落而臭名昭著。\n\n虽然北伐失败了，而奉系是北方剩下的两个最强大的军阀势力之一，但其集团的命运立即急转直下。随着他的军队从国民党的攻势中恢复过来，张宗昌对接下来会发生的事毫无准备。由于担心张作霖之子向国民党求和，日本和晋系军阀发动了一场闪电战，将该派系的满洲权力基地毁于一旦。张宗昌像风中之梗般弯曲，去北京向阎锡山宣誓效忠，随着他的权力减少，他主要在密谋反对国民党，并梦想着本会实现之事。\n\n张宗昌似乎注定要默默无闻，在多年的宿醉中，他被派往北方征战蒙古。"
 MNS_friends_on_mountain:0 "高原上的朋友"
 MNS_friends_on_mountain_desc:0 "世界屋脊上的喇嘛王公们同样在寻找伙伴。汉人的官员来了又走，英印的商人进进出出——他们需要的只是一句承诺：尊重旧制，维持现状。这句话我们同样给得起。\n合作愉快。"
 MNS_japan_military:0 "邀请日本军官"
 MNS_japan_military_desc:0 "军队的骨骼需要由懂得现代战争的人来铸造。从本土请来的现役军官使我们与帝国陆军保持高度一致。这是一种成本最低的现代化路径。"
 MNS_japan_industry:0 "吸引日资"
 MNS_japan_industry_desc:0 "工厂开业，矿山开采，铁路开修……这一切都需要大量的资本。日本财阀们手中的闲钱正好派上用场——他们出钱，我们出地，各取所需。资本的流入会带来就业、税收和一种看得见的繁荣。"
 MNS_we_need_weapons:0 "武器走私"
 MNS_we_need_weapons_desc:0 "俄罗斯革命的余波遍布远东，大批军火散落在东亚的各个角落。将这些废弃的枪弹重新利用起来，不但可以节约军费，还能为联邦的事业添砖加瓦。日、俄双方的枪械日常均有流入。"
 MNS_tradition_of_cossacks:0 "哥萨克传统"
 MNS_tradition_of_cossacks_desc:0 "哥萨克人几百年来便是靠打仗吃饭的，这既不是秘密，也不是羞耻。阿塔曼在司令部悬挂着沙皇时期的旧军旗，每日晨起让士兵们按顿河畔的习惯集体祷告。军服上保留着传统的红色裤线，马鞍旁挂着祖传的长刀——这些都是塑造文化仪式的部分，它告诉每一个人：我们是谁，我们为何而来。传统就是根，没了根，哥萨克就只是一群拿着枪的流浪汉。而对于流亡者而言，这种仪式感比粮食更为珍贵，至少安年科夫是这样坚信的。 "
 MNS_russian_support:0 "俄罗斯的支持"
 MNS_russian_support_desc:0 "散落在满洲和京津各地的白俄人数以万计，其中许多人都还记得当年在西伯利亚并肩作战的日子。安年科夫通过哈尔滨的旧军官联络网联系着本土的同胞。他们当中有军官、有士兵、有技师，甚至还有一些读过大学的年轻人。在安年科夫看来，这些人是比当地招募的士兵更可靠的兵源，至少他们没有因为背井离乡而忘记自己的身份。给予他们保护、俸禄和希望，他们便会以忠诚回报。"
 MNS_tsardom:0 "驰骋于罗斯大地"
 MNS_tsardom_desc:0 "我们纵马奔腾，在我们所踏向的土地上…… 我们也知道不久后，阿塔曼就要加冕契丹的沙皇了。"
 