#event
 KXX_LKMT_I.1.t: "国民革命再现于世"
 KXX_LKMT_I.1.d: "北伐的烽火未能在黄河流域扎根，反而猝然熄灭于内外交困的血泊之中。随着总司令蒋中正在归途中遇刺身亡，国民革命军的阵线如决堤之洪，一溃千里。在那段动荡的岁月里，革命的旗帜被撕裂成无数碎片：宋庆龄、廖仲恺与李济深等左翼领袖，在反动势力的残酷清算中苦苦支撑，他们收拢起仅存的火种，艰难南下，隐入闽赣交界的崇山峻岭。而汪兆铭等人则远遁巴黎，在异国他乡的政治沙龙中，为渐趋熄灭的理想寻求国际社会的微弱支援。从城市暴动的血腥挫败，到转入农村斗争的举步维艰，革命的力量在严酷的冬日里不断凋零，似乎已到了生死存亡的最后关头。\n\n然而，历史的天平往往在混沌中倾斜。得势的直系军阀并没能分享胜利的果实，反而因内部的诸多龃龉而止步不前。随着“东南王”孙传芳在重兵保护下意外遇刺，直系在东南诸省的铁腕统治瞬间瓦解，曾经密不透风的军阀罗网露出了致命的裂痕。这一变局，为沉寂已久的革命者们提供了一个千载难逢的战略窗口——那是鲜血换来的契机，也是第二次国民革命的先声。\n\n在闽西龙岩的密林深处，起义的号角再次吹响。宋庆龄、邓演达、李济深等幸存的革命中坚，以非凡的胆识领导残存武装揭竿而起。消息传出，海内外震动：流亡欧洲的“改组同志会”在汪兆铭的率领下跨海归来；孙科麾下的“夏威夷派”亦带着大洋彼岸的支援奔赴前线。不仅如此，成千上万赤诚的华侨同胞、心怀大同理想的国际工团主义者与社会主义友人，如繁星汇聚般投入闽赣战场的洪流之中。\n\n闽赣起义不再是一次孤立的暴动，而是一场旨在彻底粉碎封建余孽、重塑民族灵魂的斗争。革命者们，誓要用手中的枪炮与心中的理想，冲决盘踞神州千年的封建枷锁，在旧时代的废墟之上，一砖一瓦地垒砌起那个名为“自由中国”的终极理想。"
 KXX_LKMT_I.1.a: "雄关漫道真如铁……"
 
 KXX_LKMT_I.2.t: "国民党内的主要派系"
 KXX_LKMT_I.2.d: "在国民大革命失败之后，内部松散的“大帐篷”式的国民党很快树倒猢狲散，部分党员逃往国外、少部分坚韧不拔的党员留在根据地而更多的党员则选择退党。国民党在中国政坛已经成为了一个过去式，其党员身份不仅不会给个人带来任何便利，还会引来杀身之祸。现存的并且活跃的国民党存在两大派系。\n\n在国内进行土地革命的国民党中占据领导地位的是以宋庆龄为首的革命委员会，他们由许多久经沙场、擅长游击战的军官和善于组织和开展革命斗争的党员组成，其中毛泽东等人提出发展革命根据地，农村包围城市的理论，这与流亡在国外以及第三国际的主流思潮产生了冲突。\n\n改组同志会（简称改组会）控制着中央委员会，其成员主要是随汪精卫主席流亡欧洲的激进派和温和派社会主义者。最初，改组会是个秘密组织，在旅欧华侨社区和使馆城市中都有分部。“改组会”这个名字来源于1924年的国民党改组，他们认为，党需要净化和改组，由工农组成新国民革命军，为此，革命必须从上层开始。中央委员会流亡在外，对国内的形势时长有误判的情况，并且国内进行着类似于农民起义式的“山大王”革命，让中央委员会忧心忡忡，在中央委员会的干涉和指挥遭遇一些失败之后，两派开始产生了一些矛盾。"
 KXX_LKMT_I.2.a: "国民党内的次要派系有哪些？"

 KXX_LKMT_I.3.t: "国民党内的次要派系"
 KXX_LKMT_I.3.d: "虽然左派声称自己才是真正的国民党，但是除两大主要派系外，还有着各种“小规模”派系或组织。\n\n在流亡欧洲的华侨中，有一小部分黄埔军官受到了欧洲日益兴起的激进运动影响，这些运动包括萨文科夫的俄罗斯人民共和党、法国索雷尔派和不列颠联盟的莫斯利准则派。欧洲极左分子崛起以来，虽然支持者还不多，但“极权主义”确实越来越受这些青年激进军官的欢迎，他们认为，在打倒帝国主义后的中国，民主没有生存空间。\n\n并不是所有国民党员都流亡欧洲或者留在国内，相当一部分中间派和怀揣类似思想的“自由派”逃向了东南亚和美国（尤其是夏威夷），这些人组成了侨务委员会（简称侨委会），名义上的首脑是先总理之子孙科。据报道，被派往[BHC.GetNameDef]提供军政训练援助的国民革命军军官也支持侨委会。\n\n作为“统一战线”政策的一部分，也是获得第三国际援助和承认的条件，国民党需要与党外的中国社会主义团体共事。这些各异的组织和工会松散地团结在中国工团主义者同盟的旗帜下，信仰涵盖委员会共产主义、无政府工团主义、无政府主义、其他各类社会主义等，其中最主要的一个团体是中国工团党。\n\n作为根据地的中坚力量，在土地战争卓见成效并且成功让国民革命军发展壮大之后，毛泽东的离经叛道的思想逐渐被一些党员接受，他们大多数是根据地掌握实务的实干派。这些成员通常遵循着“实用主义”，他们自称实事求是，并且在党内逐渐受到欢迎。"
 KXX_LKMT_I.3.a: "我迫不及待要开始游玩了！"

 KXX_LKMT_I.4.t: "1936年的农忙"
 KXX_LKMT_I.4.d: "在国民革命开始之前，生活在闽赣根据地的士兵会帮助当地农民收获秋稻。除了起到实际作用（减轻国民党控制区的负担）外，它还具有意识形态功能——强调党和农民之间的联系。\n\n然而，现在，随着国民革命军被动员起来在正面战场上进行斗争，在革命中心帮助农业的人比平时少了。现在需要就如何最好地满足农村的需求做出艰难的决定。"
 KXX_LKMT_I.4.a: "为大局着想，乡亲们必须适应新形势。"
 KXX_LKMT_I.4.b: "分派新兵前往农田接受农民群众的再教育。"
 
 KXX_LKMT_I.5.t: "革命时代，革命妇女"
 KXX_LKMT_I.5.d: "从建党之初开始，中国妇女在国民革命中的作用一直是国民党领导层内部讨论的话题。尽管受到保守派的抵制，一些妇女还是参加了黄埔的课程，甚至在北伐期间组建了一支敢死队。同样，成立了由宋庆龄正式领导的妇女政治培训班，以促进女性参与中国未来的民主。\n\n国民革命军以戏剧性的方式正式组织了一支新的“红色娘子军”，这是同类部队中最早的大规模部队之一。作为各种军事指挥官和女权主义人物的心血结晶，虽然与类似项目不同，它仍然扮演着重要的宣传角色，同时也有望看到实战效果。在革命机构中，也有其他无数其他妇女担任文职到军职各种不可或缺的职务进行的不懈工作，这些事例少有人知晓，但对革命也至关重要。"
 KXX_LKMT_I.5.a: "我们的革命会带来社会解放！"
 KXX_LKMT_I.5.b: "真正的解放需要铁与血！"

 KXX_LKMT_I.6.t: "与夏威夷的矛盾"
 KXX_LKMT_I.6.d: "在大洋彼岸的檀香山，有一个也许是最不情愿但仍然忠于汪精卫的中央委员会的派系。以孙科为首的国民党“自由派”仍然持观望态度，拒绝直接参与这次起义，勉强承认汪精卫的领导。主流左翼派别与所谓的“夏威夷派”之间的关系早已降温，因为改组会的《革命评论》在严厉的社论中对夏威夷的《再造旬刊》进行了背刺。\n\n尽管相互有敌意，但汪精卫还是主动试图弥合分歧。撇开孙中山的声望不谈，夏威夷派对侨务委员会的控制使他们与东南亚的华侨华人有广泛的联系。此外，他们自由主义、温和的面孔使他们很容易接触到中国沿海城市的富有、民族主义的商人和知识分子。然而，人们必须问，在不损害我们的革命理想的情况下，给予多少让步来伸出橄榄枝。"
 KXX_LKMT_I.6.a: "我们尽量让步。"
 KXX_LKMT_I.6.b: "我们当然可以让更多！"

 KXX_LKMT_I.7.t: "国民党请求援助！"
 KXX_LKMT_I.7.d: "自从国民革命军败于帝国主义扶持的直系军阀之手，我们仍密切关注着中国革命的可能性。中国虽然既不是资本主义国家，也不是工业国家，但具有反帝国主义和社会主义革命的潜力，中国群众运动在北伐战争中的作用就是一大证据。\n\n中国的社会主义者和国民党试图在1932年发动一场大胆的起义，只可惜最终失败。但似乎黑色星期一引起的资本主义世界秩序崩溃之后，中国国民党和国民革命军再次崛起打破他们的锁链。我们收到了汪精卫主席和陈友仁大使等中方相关人员的紧急公报，要求我们国家派遣军事武器和顾问来帮助国民党重新进行革命斗争。我们当然可以支持他们，把顾问和步枪都送过去，不过鉴于这场冲突的距离和我们有限的资源，我们也可以只派遣顾问。或者，像我们政府中部分人认为的那样，我们应该只是在精神上予以支持。"
 KXX_LKMT_I.7.a: "送去顾问和武器！"
 KXX_LKMT_I.7.b: "什么都不送。"

 KXX_LKMT_I.8.t: "[From.GetNameDefCap]送来顾问和武器"
 KXX_LKMT_I.8.d: "我们的呼救声并不是毫无回应的，因为[FROM.GetNameDefCap]已经宣布，他们将派遣军事顾问以及他们自己的现代武器来帮助我们的革命斗争。有了这种慷慨的帮助，我们就一定能在正在进行的八省内战中取得胜利，把长江从帝国主义手中解放出来。"
 KXX_LKMT_I.8.a: "感谢欧洲同志！"

 KXX_LKMT_I.9.t: "[From.GetNameDefCap]未有回应"
 KXX_LKMT_I.9.d: "遗憾的是，我们的呼救声没有得到回应，因为[FROM.GetNameDefCap]宣布，他们将在观察中国正在进行的冲突时保持中立。因此，他们拒绝向我们派遣军事顾问和武器，理由是他们自己需要为欧洲日益加剧的冲突做准备。我们将不得不在没有他们帮助的情况下继续前进。"
 KXX_LKMT_I.9.a: "真难受，但可以理解。"
 KXX_LKMT_I.9.b: "我们靠自己来解放全中国！"

 KXX_LKMT_I.10.t: "南京的新黎明"
 KXX_LKMT_I.10.d: "南京被解放了。军阀被赶走了，孙传芳和齐燮元这些窃取人民财产、将城市出卖给帝国主义者的暴君不复存在。终于，白日得以在南京上空升起——这是十多年前北伐战争的梦想。在今天攻占城市后的讲话中，国民党举行了胜利仪式以向已故的国民党创始人和多年来牺牲的全体革命烈士致敬。\n\n在实际事务方面，国民党显然准备在国民革命期间将南京当作临时首都。前总统府（即孙中山先生在1911年宣誓就任临时大总统的地方）已经被改建为临时总统府。\n\n与此同时，国民党党中央亦在积极筹建临时行政院，行政院将隶属于中央执行委员会，而汪精卫则会出任国民政府主席。廖仲恺已经被任命为行政院长，这是一个新的国民党政府首脑职位。看来，国民党已经开始尝试管治一个组织良好的国家了。"
 KXX_LKMT_I.10.a: "国民革命再兴！"

 KXX_LKMT_I.11.t: "温州事件"
 KXX_LKMT_I.11.d: "与占领厦门时的缜密步骤和行进路线相比，我们对温州和其他东亚总督监事会港口的占领筹划可谓聊胜于无。在国民革命军进军温州市之时，全市各地同时爆发了排外暴乱。在暴乱中，有数名德国居民被杀，而大多数市郊则被掠夺一空。火上浇油的是，数支国民党小型先头部队亦有参与其中，事态在更多纪律良好的部队进入温州时才有所好转。现在，温州已经被民乱摧残得一塌糊涂了。"
 KXX_LKMT_I.11.a: "我们的外交书记又有烂摊子要收拾了。"

 KXX_LKMT_I.12.t: "南通惨案"
 KXX_LKMT_I.12.d: "南通港之前被八省联合租借给德国东亚监事会，位于长江口的绝佳地理位置让这座城市成为了由德国人独享的另一座“上海国际都会”。当国民革命军向这一通商口岸进军时，恐慌和不安在这座城市居民中普遍的传播开来。当地中国人大规模的趁火打劫行为同德国卫戍部队的焦土战术一道点亮了南通市的夜空，随后的大火则摧毁了南通市的众多纺织厂。大批向南驶往上海的渡轮严重超载以至于变得不适于在长江上航行，最终导致了几艘渡轮倾覆，目前已报数百人遇难。在国民革命军采取措施控制局面之前，南通显然已经成为了灾难现场。长期以来，一直被视作为中国城市现代化典范的南通，已付之一炬。"
 KXX_LKMT_I.12.a: "国之大失"
 
 KXX_LKMT_I.13.t: "“胡建人”在杭州"
 KXX_LKMT_I.13.d: "国民革命军的第一批部队大多是从福建农民和少量城市居民中招募的，而这些正规部队中熟悉标准官话的人少之又少。昨天，一群正在杭州休假的福建士兵因言语不通和醉酒而与杭州居民争吵，并引起了一场闹剧。尽管人们视中国为一个国家，但语言不通及农村与城市生活方式的反差之大令大多数部队在异乡驻扎时变得相当困难。"
 KXX_LKMT_I.13.a: "国家统一绕不开这个问题。"

 KXX_LKMT_I.14.t: "双枪科恩"
 KXX_LKMT_I.14.d: "莫里斯·亚伯拉罕·科恩，又名“双枪科恩”，在他到中国为孙中山先生效命前，他在世界大战中参加了加拿大铁路军团赴欧作战。在接触到孙中山后，莫里斯开始效命于国民党，帮助国民党训练部队，直至他成为了孙中山的众多保镖之一。在一场战斗后，由于他的左臂被一枚子弹划伤，他决心随身携带双枪，并由此获得了“双枪科恩”的绰号。在北伐战争惨败失意返回加拿大后，科恩如今重返中国，像保卫孙中山先生一般保卫中国的其他同志。"
 KXX_LKMT_I.14.a: "我们可不会提防我们的老同志"

 KXX_LKMT_I.15.t: "薛岳与张发奎自[BHC.GetName]归来"
 KXX_LKMT_I.15.d: "多亏了孙科等同志的努力，近日张发奎同志和薛岳同志在新一场革命的号召下自婆罗多公社返回中国。在婆罗多公社任职的几个艰苦春秋，磨炼了他们的身心与意志。虽然一些中央委员会委员认为，二人秉持的一些右派思想会进一步搅浑国民党内复杂的局势乃至影响到革命进程，但是他们二人出色的军事能力能极大的加强我们的军事力量。"
 KXX_LKMT_I.15.a: "欢迎回家，同志们"
 
 KXX_LKMT_I.16.t: "来自中国的问候"
 KXX_LKMT_I.16.d: "当国民党的轮船抵达到加尔各答港之际，所有东方革命团体的目光都汇聚到了这座“红色”城市。这是婆罗多公社领导人同国民党高层的首次会晤。当然，此次会晤并不是双方的首次接触——当北伐战争失败之后，几名国民党高级将领以顾问的身份流亡印度。在会议期间，国民党方面明确要求让这批军官回国参加革命。显然，中国比我们更需要革命的火种。"
 KXX_LKMT_I.16.a: "再会了，同志们！"

 KXX_LKMT_I.17.t: "井冈山的援军"
 KXX_LKMT_I.17.d: "毛泽东作为我党的老同志，多年以来随宋庆龄先生在湘赣一带进行土地革命斗争，他对党的忠诚毋庸置疑。现在毛泽东委员服从中央的命令，果断在采取一些措施之后，率领井冈山根据地的主力转移，向东运动作战，不仅切断了南昌与湘南的联系，而且这支力量将再一次壮大我们！"
 KXX_LKMT_I.17.1: "欢迎，我们的老同志"

 KXX_LKMT_I.18.t: "南昌的消息"
 KXX_LKMT_I.18.d: "革命军正在湘赣起义的消息使得，正在向安庆作战的军队输送补给的南昌城乱作一团，在黑色星期一的打击下，军阀政府几乎面临破产，军队欠饷已经多月，士兵大多失去战心。另一方面，反动派军官残酷镇压惩戒士兵，尽管杜绝了逃兵，但也使得士兵人心惶惶，士气低落。此时，南京方面极力催促各地军队进军湘赣镇压安庆的反租界军队。但是我军准备充分的大起义使得敌侧后薄弱关节受到威胁，各路军队不敢向前。如果革命军能进入豫章地区，支援当地的农民运动，并派专员联络潜伏的左派军官，毛委员便有把握发动一场大起义，这样一来，南昌城唾手可得。"
 KXX_LKMT_I.18.1: "前进！光复南昌"

 KXX_LKMT_I.19.t: "南昌起义"
 KXX_LKMT_I.19.d: "随着革命力量的加强，南昌城的守军早已不想为压迫他们的反动势力卖命了。经过多日的准备，我们联络了大批潜伏的左派军官，经过周密的计划，起义筹备工作有条不紊的展开。在周恩来同志的领导下，反动派的走狗战战兢兢，根本不敢和革命军正面作战。当天晚上，南昌城的营房、武库火光四起，反动派军阀狼狈逃往南京，失去指挥的士兵乱作一团，纷纷向革命军投诚。革命军仅仅付出轻微的代价就夺下了南昌。不过，反动派虽然逃往南京，但等待他们的将会是下一场审判！"
 KXX_LKMT_I.19.1: "反动派都是纸老虎！"

 KXX_LKMT_I.20.t: "南昌起义"
 KXX_LKMT_I.20.d: "国民党在福建地区发动了大规模武装暴动，随即遭到齐燮元总督的进剿，在围剿战时顺利的关头，南昌起义爆发。\n南昌是清政府镇压福建、两广地区的军镇之一，而此次国民党成功拿下南昌，无疑撕开了五省总督的包围网，在切断福建与清廷联系的同时，获得了大量物资和兵员。齐燮元颓势难以抑制，这场东南地区的大规模战争陷入了扑朔迷离之中。"
 KXX_LKMT_I.20.a: "国民大革命复起了"

 KXX_LKMT_I.21.t: "中央委员会归来"
 KXX_LKMT_I.21.d1: "从巴黎启程，经过漫长而紧张的旅程后，国民党中央委员今天已经抵达了我们新近占领的温州港。鉴于华南地区仍持续不断的混乱局势，欢迎式搞的并不引人瞩目，几乎没有什么华丽的繁文缛节。随后，汪精卫在海关大门外向当地父老乡亲发表了一段简短的声明，表明国民党将维护温州的和平。\n\n随同流亡的国民党政府抵达的，是一支经法式训练并装备了全套法械的中国侨民团；他们不仅携带了大批大战年代的武器弹药，而且本身就有实力夺下华南。"
 KXX_LKMT_I.21.d2: "从巴黎启程，经过漫长而紧张的旅程后，国民党中央委员今天已经抵达了我们新近占领的厦门港。鉴于华南地区仍持续不断的混乱局势，欢迎式搞的并不引人瞩目，几乎没有什么华丽的繁文缛节。随后，汪精卫在海关大门外向当地父老乡亲发表了一段简短的声明，表明国民党将维护厦门的和平。\n\n随同流亡的国民党政府抵达的，是一支经法式训练并装备了全套法械的中国侨民团；他们不仅携带了大批大战年代的武器弹药，而且本身就有实力夺下华南。"
 KXX_LKMT_I.21.d3: "从巴黎启程，经过漫长而紧张的旅程后，国民党中央委员分批小规模的抵达了使馆城市位于福建省的口岸，并随即秘密前赴龙岩。鉴于华南地区仍持续不断的混乱局势，欢迎式搞的并不引人瞩目，几乎没有什么华丽的繁文缛节。在宋庆龄的陪同下，汪精卫随后在龙岩市政府外发表了讲话，祝贺了闽赣革命根据地的战士们一直以来“红旗不倒”。\n\n随同流亡的国民党政府抵达的，是一支经法式训练并装备了全套法械的中国侨民团，他们分散成小队，登陆福建省的各个港口后分头行动最终抵达了解放区。公社提供的一大批枪支弹药如今正通过秘密渠道送回解放区。"
 KXX_LKMT_I.21.a: "欢迎回来，汪主席。"

 KXX_LKMT_I.22.t: "农民运动"
 KXX_LKMT_I.22.d: "广袤的农村区域已经安插了许多地下的同志，就像稻草下面覆盖着木炭，一颗火星就足以点燃革命的火焰。随着把特派员派遣进入广袤的农村地区，在地下活动的同志的引导下，很快组织起小股的民团武装。在展开土地斗争之后，革命军与农民情同手足，得到农民自发的帮助，有的负责破袭铁路，有的帮助运输伤员。百姓踊跃参军，许多训练有素的赤卫队与我们的主力会合，农村与农村连成一片，革命的火焰燃遍了五省。\n\n但是革命形势迅速向好的同时，也出现了一些不和谐的地方。许多地区报告称农民运动过于粗放，一些支援革命的同志被农民视为敌人，加上一些农村地区有了武装之后，开始抵抗党组织对物资的征集，甚至产生了一些流血冲突。"
 KXX_LKMT_I.22.a: "放手去干！"
 KXX_LKMT_I.22.b: "不能搞极端"

 KXX_LKMT_I.23.t: "匪患"
 KXX_LKMT_I.23.d: "军阀买办统治下的东南地区不得民心，匪患频繁，再加上战事迁延，如今一些地区乱匪如毛，已经严重影响到革命军对地方的控制。我们必须选择一个可行的策略处理他们，这些土匪也是一股力量，或许我们可以以招抚为主，将这些力量改编并入革命军内，让他们为我们作战。但是一些军官称，土匪性情暴戾，本性难移，而且纪律性较差，如果直接手边不免会降低我们军队的战斗能力。加上他们手上的血债，会招致百姓对革命军的反感。"
 KXX_LKMT_I.23.a: "我们需要这股力量"
 KXX_LKMT_I.23.b: "折中一下，剿抚并用"

 KXX_LKMT_I.24.t: "士兵劫掠"
 KXX_LKMT_I.24.d: "在收编了大量土匪和军阀的旧式部队之后，不仅革命军的战斗力严重下滑，而且我们的军纪也遭到了破坏。一些军队在战场上当了逃兵，还私自劫掠地方，更有甚者还闹出了人命。而当我们要处置他们的时候，军队的旧军官互相推诿，并且有军官威胁不释放这些士兵就带兵去当山大王。"
 KXX_LKMT_I.24.a: "严惩不贷"
 KXX_LKMT_I.24.b: "我们还需要依靠他们"

 KXX_LKMT_I.25.t: "上海的情况"
 KXX_LKMT_I.25.d: "上海市是中国不容置疑的主权领土，在第一次北伐即将成功的时候，西方帝国主义列强惧怕中华崛起，悍然发动干涉战争。而上海市就是在这次战争之后被西方列强分割出去作为所谓的“使馆驻所”，这无疑是对中华领土主权的侵犯。我党已经在东南地区取得了战略胜利，作为新生的革命政府，上海市无疑是我们反对帝国主义的第一步。我们必须拿回上海，击碎列强强加给东南地区的经济枷锁。\n\n上海工部局对我们十分警惕，已经开始拉拢上海帮派对付工人，如果我们能够派遣具有帮派背景的光复会去实行计划的话，我们的枪支、炸药等物资将会比较容易筹集。而且工人的组织也会更加隐秘。另一部分同志反对这一观点，他们认为帮派已经被洋人拉拢，是敌是友还不确定，况且他们迫害工人多年，两者之间的仇隙恐怕难以调和。不如另起炉灶，派遣青年军官进入上海，只需要把动静弄大，我们的军队就有借口出动了。"
 KXX_LKMT_I.25.a: "让戴春风负责这次行动"
 KXX_LKMT_I.25.b: "周恩来同志办事稳妥"

 KXX_LKMT_I.26.t: "结果"
 KXX_LKMT_I.26.d: "我们暗中运输物资的事情被不明帮派成员发现了，虽然我们马上部署人员去控制这个成员，但还是让他逃掉了，如果事情泄露出去，我们的暴动计划将会流产。我们的同志立刻下达命令开始行动，并传讯给潜伏靠近上海在外围的军队。而这次果断的行动打了工部局一个措手不及，当上海陷入动乱的时候，工部局驻扎在交通要道上的军队被迫调动起来。我们预先秘密调集的军队顺利的入驻了上海，并成功迫使他们的军队交出武器，现在上海是我们的了。面对洋人竭斯底里的抗议，我们的同志出于礼仪，提供一所大楼作为他们工部局的驻所。"
 KXX_LKMT_I.26.a: "好极了！"

 KXX_LKMT_I.27.t: "洋人的谈判"
 KXX_LKMT_I.27.d: "上海外资银行的金库发现了大批的贵金属，这显然是西方列强盘剥中华得到的，如果这些贵金属被运走，我们的货币体系将会受到毁灭性打击。如果我们这些贵金属收归政府，西方列强难保不会对我们的革命发动干涉。法国记者、第三国际驻华军事代表团成员安德烈·马尔罗立刻要求我们立刻截留这批贵金属，大多数中央委员则考虑到这一举措的后果，希望可以慎重考虑。\n\n这时，使馆工部局的代表到来并要求和我方进行谈判。在持续数个小时的争论之后，我们得到的信息是，使馆城市要求我们退出上海，如果可以办到这一点，将可以和我方单独谈判合作条件，他们暗示将交还对东南一些经济命脉的控制。"
 KXX_LKMT_I.27.a: "绝不和帝国主义妥协"
 KXX_LKMT_I.27.b: "暗示储备金的事情，争取更多利益"

 KXX_LKMT_I.28.t: "谈判破裂"
 KXX_LKMT_I.28.d: "这一切都是国民党的阴谋，这一点双方心知肚明，但是他们厚颜无耻的无视了这一点，并且提出许多我们无法接受的条件。显然他们毫无谈判的诚意，如果我们还想拿回属于我们的东西，似乎就只能诉诸武力了。"
 KXX_LKMT_I.28.a: "给他们一点颜色看看。"
 KXX_LKMT_I.28.b: "我们还会回来的！"

 KXX_LKMT_I.29.t: "国民党威胁我们"
 KXX_LKMT_I.29.d: "与我方接洽的国民党官员在谈判中无意提及了金库，很显然他们已经控制了这批储备金。现在他们在暗示我们，如果不能拿出足够的利益，他们将倒向巴黎方面，截留这批储备金，向他们背后的工团渣滓乞求利益！"
 KXX_LKMT_I.29.a: "交出上海之外的所有托管区"
 KXX_LKMT_I.29.b: "绝不！"

 KXX_LKMT_I.30.t: "工部局拒绝了我们的提议"
 KXX_LKMT_I.30.d: "虽然我们很想左右逢源，在确保利益的情况下两不得罪，但是工部局显然不是好惹的，他们冲动的拒绝了我们的提议。这下我们只能倒向安德烈·马尔罗一方，储备金我们吃下去了，并且上海也不能交还给工部局！"
 KXX_LKMT_I.30.a: "早该这样了！"

 KXX_LKMT_I.31.t: "工部局妥协了"
 KXX_LKMT_I.31.d: "面对我们强硬的态度，工部局既不愿意付出足够的利益，有没有足够的力量击败我们，他们陷入了进退两难的地步，而之前虚张声势的滑稽示威已经让我们倒向了安德烈·马尔罗一方，现在他们只能灰溜溜的离开上海了！"
 KXX_LKMT_I.31.a: "帝国主义都是纸老虎！"

 KXX_LKMT_I.32.t: "工部局封锁港口"
 KXX_LKMT_I.32.d: "我们强占上海的结果来临了，虽然工部局没有足够的兵力威胁南京，但是他们的战舰却可以封锁我们的港口，让我们的经济和贸易无法进行。虽然这看起来非常严峻，但是在湘赣闽地区长期遭遇封锁的国民革命军可不会怕这些，并且相较于失去了大量黄金储备的工部局，谁的经济先崩溃还不一定呢！"
 KXX_LKMT_I.32.a: "奉陪到底！"

 KXX_LKMT_I.33.t: "异议流言"
 KXX_LKMT_I.33.d: "汪主席和中央委员会没能在约定日期到达厦门，前线的作战计划被打乱了，他们这种拖拖拉拉的行为，让我们的部队迟迟无法得到他们承诺的援助，甚至部分部队的弹药已经岌岌可危了。在这种情况下，中央委员会还在海上干扰通过电报指挥干涉作战，这种情况在前线军官和根据地形成了一些异议。临委会希望汪主席相信国民党革命军和将军们，在士兵们为革命事业浴血奋战的时候，也希望我们的中央委员会也能够尽快到达。"
 KXX_LKMT_I.33.a: "汪主席需要作出检讨"

 KXX_LKMT_I.34.t: "[LEP.GetName]被击败了"
 KXX_LKMT_I.34.d: "随着[LEP.GetAdjective]军队的残部纷纷投降，我们终于击败了与我们争夺东部五省的两个竞争对手。我们对这一地区的控制权已经稳固了，只剩下一些游荡的土匪在损害[ROOT.GetNameDef]下的社会秩序。有了这片根据地，国民革命运动有了统一全国的坚实基础。"
 KXX_LKMT_I.34.a: "万岁！"