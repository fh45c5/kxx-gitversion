 CHI_RCA_PARTY_NAME_desc: "中国国民党改组同志会是一个以汪精卫为代表的流亡于巴黎的归国国民党集团之一"
 CHI_RCA_PARTY_Mansion_Faction: "§B公馆派§!"
 CHI_RCA_PARTY_Mansion_Faction_desc: "§g“公馆派”这个名字来源于其成员与汪精卫主席的密切关系，他们中许多人都经常出入汪公馆，大多在汪精卫的“核心圈子”里，如褚民谊、曾仲鸣和曾醒等。公馆派成员很多都是汪精卫旅法期间的同志，因此汪主席认为他们最值得信任。他们经常借此与改组同志会竞争，认为改组会对主席的影响有胜过他们的危险。§!\n\n§B目前，公馆派的影响力为§![?CHI.CHI_RCA_PARTY_Mansion_Faction|Y2]"
 CHI_RCA_PARTY_Constitutional_Faction: "§H宪政同志会§!"
 CHI_RCA_PARTY_Constitutional_Faction_desc: "§g“宪政同志会”大多来着于改组同志会内部的温和派系。在他们眼里，推动历史发展的不是社会因素，不是改组会激进派的著作中所示的那些社会和经济因素，而是“人民意志”——人类克服危机和困难的意志。不同于似乎为激进派的马克思主义者所采取的刻板公式，改组意味着创造一种新的革命形式。\n\n和那些认为群众运动无所不能的激进分子不同，顾孟余认为，改组同志会应谨慎引导群众。而国民党所领导的革命也应当属于全体人民，不像激进派所表示的仅是工人和农民的革命。因此，他们选择在强调群众方面与激进派保持距离。对温和派来说，群众有着无情的革命力量——不可阻挡，却也可能将革命导向失败。所以，革命将由那些积累了革命经验和知识的人领导，只有他们的意志发挥作用，才能使革命走向胜利。§!\n\n§H目前，宪政同志会的影响力为§![?CHI.CHI_RCA_PARTY_Constitutional_Faction|Y2]§!"
 CHI_RCA_PARTY_Radicalism: "§t激进革命同志会§!"
 CHI_RCA_PARTY_Radicalism_desc: "§g改组同志会的激进派主导由陈公博领导。激进派在阶级斗争和马克思历史唯物主义观点上与温和派大相径庭。虽然少有改组会成员愿意公开声明自己是马克思主义者，他们的文笔间却充斥着马克思主义影响，激进派成员也常用诸如“矛盾”和“整体”之类的词汇。\n\n激进派内满是前工团主义者，与中国工团党激进派也常有往来。改组会激进派成员信奉自己对三民主义的“唯物主义”解释——认为三民主义可以通过马克思主义观点来解释，经济学因素也能被用来研究中国历史。激进派与温和派都认为要用一场改组扫清国民党内弥漫的堕落气息。但这也意味着国民党必须走群众路线，为工农服务——长此以往，革命必将由工农联盟领导。到那时，将由改组会激进派来引领中国的革命阶级，彻底推翻资本主义的腐朽建筑，令其永不得翻身。§!\n\n§t目前，激进革命同志会的影响力为§![?CHI.CHI_RCA_PARTY_Radicalism|Y2]§!"
 CHI_PAC_PARTY_NAME: "临时行动委员会"
 CHI_PAC_PARTY_NAME_desc: "临时行动委员会是由宋庆龄，邓演达等人在闽赣起义中所组建的国民革命政治组织"
 CHI_Chinese_Lone_Star_Society_name: "§O中华铸魂学社§!"
 CHI_Chinese_Lone_Star_Society_desc: "§g中国铸魂学社,其前身为1923年冬由安 若定、蒋抗凤、殷震夏、马星阁、曹功锦、徐霖、瞿明宙、田镇峰、仝道云、孙其铭、雷仲山等39人 发起成立的“中国孤星社”,1932年2月在南京 改组为“铸魂学社”。有社员500人。1936年4 月12日呈请中央备案。1939年4月1日在重 庆正式改名为“中国铸魂学社”。以“本大侠魂 平爱原理，发扬自尊自觉自助精神，以努力人格斗争，促进新人运动，改造民族气质，建设人类 心理，完成世界大同”为宗旨。4月12日批准立案，图记字号为社字115号，社员达到 105000人。以安若定为理事长，瞿明宙任干事长。下设总务、社员、交际、文化、社会、人事、会计等7处。"
 CHI_PAC_PARTY_Constitutional_Faction: "§4民主社会主义联盟§!"
 CHI_PAC_PARTY_Constitutional_Faction_desc: "§g临时行动委员会民主社会主义派坚信依靠工农阶级就能实现完全的社会主义理想。通过民主的土地改革实现彻底的社会革命，使耕者有其田，以此建立地方自治政府；中国应当通过一种称为“国家资本主义”的方式，由封建社会过渡到社会主义社会。虽然一些成员把第三国际进入中国视为对中国本土革命实践的潜在威胁，但临委会仍然表示愿意与中国工团党正统派成员共事，且与世界社建立了同样有益的关系。寻求开化民智，将中国无产阶级转变为革命力量，进而打倒列强除军阀，实现孙中山的梦想。§!\n\n§4目前，党内温和派的影响力为§![?CHI.CHI_PAC_PARTY_Radicalism|Y2]"
 CHI_PAC_deng_Faction: "§R平民革命同志会§!"
 CHI_PAC_deng_Faction_desc: "§g与临委会中的渐进改良派不同，以邓演达为首的平民革命同志会主张由劳动阶级（农民、工人）与进步知识分子、小资产阶级组成联合战线，通过剧烈的社会变革，推翻封建残余、军阀割据与帝国主义压迫。其核心在于“平民政权”的建立，即通过自下而上的群众组织，而非单纯的精英政治或军事政变，来实现国家的现代化与社会公正。也是理想主义者试图在锄头与扳手之上重构现代化民主国家的宏伟尝试。平民革命的理想在权力逻辑森严的旧世界里为数不多试图以纯粹的社会公平与劳动价值作为立国基石的旗帜，成为乱世中那些不愿向强权屈服的灵魂所追逐的最后曙光。§!\n\n§R目前，党内平民革命同志会的影响力为§![?CHI.CHI_PAC_deng_Faction|Y2]"
 CHI_Marginal_faction_tot: "国民党边缘派系"
 CHI_Marginal_faction_tot_desc: "除改组会临委会外，还有在革命中与国民党结盟或者隶属于国民党各支其他派系"
 CHI_REC_PARTY: "§C再造派§!"
 CHI_Marginal_faction_REC_PARTY_desc: "§g并非每名国民党党员都是明确的社会主义者或是独断的军头，以孙科为首的一干人作为国民党左派集团执政联盟中的自由派也加入到了国民革命的行列。这些温和派将灾难性的失败归咎于激进主义和军事统治。他们呼吁彻底重新登记国民党成员，以此驱逐军阀及其腐败亲信，并出版了《再造旬刊》，他们也因之而得名“再造派”。\n\n尽管质疑改组会的马克思主义倾向和临委会的激进左翼观点，他们还是接受了与新政府结成令人不安的联盟，并经常充当民事工作的第三者。从过去到现在，同侨务委员会广泛接触所产生的权力，使再造派能够获得富有、具有民族主义和自由主义观点的海外华侨华商的捐款。\n\n他们还得到了“遣印派”军官的帮助，这是当时汪精卫和孙科协议的一部分，也是表面上维系国民党对东南亚影响力的军事任务的一部分，再造派在这些不满其他国民党派系的军事统治的右派残余势力军官中颇具影响力。再造派坚信，在神州大地上，他们会以一种更为民主的方式——不同于第三国际道路的与极端民族主义的一种方式，重整中国的河山。"
 CHI_four_elder: "§0世界社§!"
 CHI_Marginal_faction_four_elder_desc: "§g在义和团运动后不久的1906年，“四大元老”建立了中国第一个无政府主义社团——世界社。他们创办了如《新世纪》等社会主义报纸，开展勤工俭学运动等项目，启发了不少未来的中国社会主义领导人，包括汪精卫、陈独秀和褚民谊。\n\n工团主义革命给了他们相当大的肯定，但他们参与国民党威权统治的行为却损害了其在“真正的”无政府主义者之间的声誉。其影响力在崛起的中国工团党面前黯然失色，与汪精卫的关系也因具先锋队色彩的改组会影响力增长而恶化。\n\n“四大元老”自此收敛了在工团主义组织内的影响力，以其门徒易培基作为喉舌。作为蒲鲁东主义阶级和解和普遍和谐理论的拥趸，他们坚信中国文化道德需要循序渐进而自发进行的提升。虽然拒绝传统主义并公开反对基督教，他们对偶像破坏和阶级斗争的不屑广为人知。最后，他们坚信在世界社的影响下，中国乌托邦社会主义的理想一定会实现。§!"
 CHI_CRS_PARTY: "§R复兴社§!"
 CHI_Marginal_faction_CRS_PARTY_desc: "§g中华复兴社（简称复兴社）是一个由国民革命军中的激进军官与受左翼法西斯—极权主义思想影响的社会主义者创建的团体。复兴社激进军官主要由胡宗南、贺衷寒和邓文仪领导，在归正一大后成为一个新的政治派系，在军队少壮派中尤其受欢迎。\n\n构筑他们意识形态的理论来源横跨左右，自极右翼的萨文科夫主义、日本武士道到英国准则派对经济的计划，但给予他们启发最大的是索雷尔派对革命净化暴力必要性的论述。复兴社将国民党冗杂的官僚主义现状视作党的堕落，寄希望于一名伟大的独裁者（即“领袖”）来领导党并且拔除党内的民主派。由此，他们设想将中国发展为高度军事化且平等的社会并根除阶级斗争的思想观念，以便成为一个彻头彻尾的极权主义和社会主义国家。他们认为中国的传统文化遗存和古老的儒家礼教并不是明日黄花，而是一种在领袖仁慈的统治下田园式的宁静。为了救亡图存，为了解放中国，为了伟大复兴，复兴社誓要令中国焕然一新。\n\n除此之外还有一些以周毓英为首的受第三国际中激进思潮影响的极权主义者，他们鼓吹要将三民主义与法国的索雷尔主义，意大利的圣墓主义与新社会主义有机结合起来，用左翼法西斯的理想来强化国民革命。在他们眼中三民主义如要求有效的像法西斯蒂那样的强力的执行，团结民众与军队，共同缔造民族的梦想。§!"
 CHI_socialist_faction_name: "中国工团主义联盟"
 CHI_socialist_faction_desc: "中国工团主义联盟是由以中国工团党为核心，各支无政府主义，无政府工团主义，工农社会主义者所组成的广泛联盟"
 CHI_CSP_PARTY_NAME: "§O中国工团党§!"
 CHI_CSP_PARTY_NAME_desc: "§g工团党内部的派系对立分明，其中有以李立三为代表的工团党正统派与陈独秀为代表的工团党激进派。\n正统派由许多参与组建前中国工团主义同盟的前中国工团党领导人组成。怀着参与统一战线的热情，他们认为无产阶级和农民必须首先携手击败帝国主义，同时他们希望缓和与国民党的关系，还主张农业社会占主体地位的中国应当首先进行工业化，为建立真正的工团主义体系打下基础。在内部，正统派努力在委员会马克思主义者和工会工团主义者之间达成妥协。\n\n而作为激进派领袖的陈独秀已与此派划清界限，投身于委员会的道路，此派代表了接受过欧洲教育，对中国工团党正统派失去幻想的年轻一代人，提倡中国工团党应在政治中扮演更加主动、强硬的角色，而不是躲在国民党身后。在他们看来，中国的混乱不仅仅来自于帝国主义和军阀割据，还来自于资本主义本身。帝国主义、垄断企业、封建地主、农村乡绅和资本主义必须立马被彻底摧毁，他们拒绝与任何军阀或非社会主义者结盟，还有着与国民党温和派作斗争的倾向。§!\n\n§O目前，中国工团党在中工盟的影响力为§![?CHI.CHI_CSP_PARTY_NAME|Y2]"
 CHI_ASA_PARTY_NAME: "§R无政府工团主义联盟§!"
 CHI_ASA_PARTY_NAME_desc: "§g国民革命失败之后，以高语罕为代表前国民党身份的无政府主义者于安徽一带组织起了无政府主义革命组织“安社”。他将目光转向了更纯粹的源头——无政府主义。这种“无中心、广分布”的组织形式在地方军阀的夹缝中展现了惊人的生命力。恽代英，李克农等人相继加入为无政府主义之火添加了更多的薪柴。让“安社”从一个政治团体，而是一个植根于江淮大地的生命体。当“第二次国民革命”的口号再次响彻华东，北伐的军靴再次踏响大地时，整个安徽的革命者都在屏息以待。高语罕虽然也加入了北伐的大舞台，但却选择与国民党保持距离。虽然他认为国民革命是一次中国社会主义旗帜插遍全国的契机。但是出于上一次的教训他更坚定了，只有无政府工团主义的纯正理想，才能挽救中国于水火之中，而不会重蹈上一次北伐的覆辙……§!\n\n§R目前，无政府工团主义联盟在中工盟的影响力为§![?CHI.CHI_ASA_PARTY_NAME|Y2]"
 CHI_PSA_PARTY_NAME: "§t中国民主农民工人党§!"
 CHI_PSA_PARTY_NAME_desc: "§g大革命失败后，毛泽东开始了在湘赣边区组织农民起义以再一次汇聚革命力量，十年时间里。农民革命委员会在湘赣地区快速发展，第二次国民革命的浪潮中，毛泽东在南昌起义后也再一次回归了国民革命的行列。但不同于其他的同僚，毛泽东主张工农联盟中农民要在中国革命中发挥主要地位。这与国民党左派中的工团主义者们的论调大相径庭，他们挖苦毛泽东为“民粹派社会主义者”。但毛泽东从不在意这些，相反，他在加入中工盟后展示出来与无政府主义者及其良好的相性，毛泽东在中工盟中广结盟友，将中国民主农民工人党建设成中工盟中数一数二的大派系。他相信，在积贫积弱的中国，农民是中国革命最有力量的盟友与支撑者。工农联盟携手向前，才能开创属于中国社会主义的新曙光。§!§t\n\n目前，中国民主农工党的影响力为§![?CHI.CHI_PSA_PARTY_NAME|Y2]"
