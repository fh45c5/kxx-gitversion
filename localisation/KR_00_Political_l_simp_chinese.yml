 authdem_burkhanism_subtype_desc:0 "§Y不儿罕教§!\n\n£GFX_ideology_burkhanism_bar\n\n\n\n\n不儿罕教又叫白教，是发源于西伯利亚阿尔泰游牧民间的宗教信仰以及由此发展而来的政治势力。1904年左右，初代“先知”切特·切尔潘及其养女楚蛊·纱罗·禅蒂克据说蒙受神召，遇到了一名白色幽灵骑士“阿刻不儿罕”，并从其口中得知传说中的英雄瓦剌大汗不久将重临人世，拯救阿尔泰人——两人大受启发，据此创立了不儿罕教。为了在沙俄咄咄逼人的帝国主义政策下躲避文化灭绝之灾，阿尔泰人集体接受了这一新的信仰，以此同周遭的其它部落相区分，保留下自身独特的民族身份。最初的不儿罕教带有明显的禧年、奉神、反萨满巫术的特征，其目的也很明确：彻底革新阿尔泰文化和社会，使其经受住现代化大潮的洗礼。不过，经过后来一系列的发展，上述特点大多都被抛弃，不儿罕教既变得更加亲民，同阿尔泰人的原始民间信仰和萨满巫术深深融为了一体，也保留下了由史诗说书人担任神官、神权官僚和仲裁官的制度化等级结构。总得来说，不儿罕教融合了原始萨满教、萨满教、藏传佛教、长生天、东正教的许多宗教理论，但同时又不属于其中任何一种的分支，是一以阿尔泰民族的存亡为出发点（部分地区的不儿罕教也提倡图瓦乃至泛蒙古一统的理念）的独特信仰。此外，卡尔梅克裔蒙古军头丹毕坚赞，亦即黑喇嘛，也把不儿罕教拿为了己用，把自己打造成了预言中的救世英雄阿睦尔撒纳的转世，且其思想更加暴力、种族至上，干的都是些打家劫舍的野蛮勾当，满脑子想的也是杀尽一切中国人，让其为对准噶尔汗国的瓦剌-阿尔泰人犯下的罪行付出代价。黑喇嘛的激进分支并不为其它派别所承认，不儿罕教的主流依旧是以阿尔泰为中心，提倡以和平和谐之道传承阿尔泰文化以及生活方式。"
