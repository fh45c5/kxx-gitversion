 kr.political.30.t:0 "备战！"
 kr.political.30.d:0 "我们收到了一系列报告，称[From.GetAdjective]的军队正在集结，在[Root.GetAdjective]边境地区出现了大量的侦察活动。军官将领们表示，显然[From.GetNameDef]正计划入侵[Root.GetNameDef]，在接下来几周中入侵行动随时有可能会发生。"
 kr.political.30.a:0 "我们必须做好准备！"
 kr.political.31.d:0 "[From.GetNameDef]告急称，[From.From.GetAdjective]军队正在集结，并已于[From.GetAdjective]边境地区开展了大量的侦察活动。军官将领们表示，[From.From.GetNameDef]显然正计划入侵[From.GetNameDef]，在接下来几周中入侵行动随时有可能会发生。"
 kr.political.32.d:0 "我们从在[From.GetNameDef]的盟友那边得到消息称他们的部队正在集结，并在[attack_target.GetAdjective]的边界附近进行大规模的侦察行动。[From.GetNameDef]将在数周以内对[attack_target.GetAdjective]发动进攻。"
