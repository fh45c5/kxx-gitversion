 authdem_neo_confucianism_subtype:0 "新儒学"
 authdem_neo_confucianism_subtype_desc:0 "§Y新儒学§!\n\n£GFX_ideology_neo_confucianism_bar\n\n\n\n\n当代所称的新儒学，或新理学，指的是由中国唐代大儒韩愈和李翱以及后来南宋的朱熹和宋、元、明等时期的学者发展推广的原始新儒家哲学运动的现代化形式。新儒学试图创造一种更加理性世俗的儒学形式，对道教和佛教等东亚信仰大力批评，也反对西方传来的新信仰。新儒家将用来处理现实基本性质的形而上学哲学视为精神发展、宗教启蒙乃至实现不朽的催化剂，并以此为指导，再以现代化的传统主义，家庭价值观，儒家社会经济思想（如注重于将财富传承给后裔而非西方资本主义的及时行乐），追求社会和谐，人道主义以及由融入世俗生活中的有灵论与宗教支持的世俗理性主义为基础，创造一种推崇伦理，追求理性的意识形态。在政治和社会经济方面，新儒学内部的观点更为多样，共识也不再那么广泛，包括文化例外主义、公民或族群民族主义、阶级合作、重商主义、法团主义、公社主义、人道主义，甚至新封建主义的金融体系都在其中。新儒家主要可分为三大支流：陆王心学的理想主义者，称自己的学派为阳明学派，程朱理学的自然理性主义者和现实主义者，最后是刘胡学派的犬儒主义者。尽管他们看待现实和形而上学的哲学观各不相同，但也共同构成了现代理学，以及这种对适合东亚的传统保守形式的回归趋势的基础。"
 authdem_humanistic_capitalism_subtype:0 "人道资本主义"
 authdem_humanistic_capitalism_subtype_desc:0 "§Y人道资本主义§!\n\n£GFX_ideology_humanistic_capitalism_bar\n\n\n\n\n人道资本主义希望在温和资本主义框架内，将人道主义与追逐利润统合起来。人道资本主义社会和其他资本主义社会一样，以市场手段实现经济繁荣，但其方式更为人道，更多地关注人民的需求、安全、健康，根据国情不同，对社会、文化甚至精神文明的发展也可能有更多投入。人道资本主义者以全国政府的无形之手取代模糊的市场力量，他们以此为指导，打造经济公平的金融体制，建立利润滚滚的乌托邦，在这里，无论是谁都有均等的机会，实现最天马行空的梦想。"
 authdem_libertarian_subtype:0 "自由意志主义"
 authdem_libertarian_subtype_desc:0 "§Y自由意志主义§!\n\n£GFX_ideology_libertarian_bar\n\n\n\n\n自由意志主义是一种以自由为核心价值的政治思想，其目标是最大限度地提升个人在生活与政治中的自主权与自由度，同时限制国家对公民权利与个人自由的侵蚀。自由意志主义注重多元化、世界大同、合作精神、公民与政治权利、自主权、自由结社、自由贸易、言论自由、选择自由、行动自由、迁徙自由、个人主义及自愿联合等理念。自由意志主义者普遍反国家，但又并非都是无政府主义者。他们质疑中央集权与专制权威，也时常对战争、军国主义、民族主义和其他类似思想心存疑虑，但一切也无定论。他们之中最大的分歧在于左翼自由意志主义者主张进步主义甚至社会主义，而右翼自由意志主义者通常青睐资本主义、保守主义和反福利制度。自由意志主义同无政府资本主义、塔克主义、右翼小政府主义和左翼无政府主义等思想存在联系，虽具体形态各异，但无疑都秉持着启蒙思想中的人类自由理念。"
 pataut_neo_confucianism_subtype:0 "新儒学"
 pataut_neo_confucianism_subtype_desc:0 "§Y新儒学§!\n\n£GFX_ideology_neo_confucianism_bar\n\n\n\n\n当代所称的新儒学，或新理学，指的是由中国唐代大儒韩愈和李翱以及后来南宋的朱熹和宋、元、明等时期的学者发展推广的原始新儒家哲学运动的现代化形式。新儒学试图创造一种更加理性世俗的儒学形式，对道教和佛教等东亚信仰大力批评，也反对西方传来的新信仰。新儒家将用来处理现实基本性质的形而上学哲学视为精神发展、宗教启蒙乃至实现不朽的催化剂，并以此为指导，再以现代化的传统主义，家庭价值观，儒家社会经济思想（如注重于将财富传承给后裔而非西方资本主义的及时行乐），追求社会和谐，人道主义以及由融入世俗生活中的有灵论与宗教支持的世俗理性主义为基础，创造一种推崇伦理，追求理性的意识形态。在政治和社会经济方面，新儒学内部的观点更为多样，共识也不再那么广泛，包括文化例外主义、公民或族群民族主义、阶级合作、重商主义、法团主义、公社主义、人道主义，甚至新封建主义的金融体系都在其中。新儒家主要可分为三大支流：陆王心学的理想主义者，称自己的学派为阳明学派，程朱理学的自然理性主义者和现实主义者，最后是刘胡学派的犬儒主义者。尽管他们看待现实和形而上学的哲学观各不相同，但也共同构成了现代理学，以及这种对适合东亚的传统保守形式的回归趋势的基础。"
 pataut_national_democracy_subtype:0 "民族民主主义"
 pataut_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_polish_natdem_bar\n\n\n\n\n民族民主主义起源于波兰民族思想之父罗曼·德莫夫斯基的创意，其前身可以追溯到波兰实证主义和有机劳动运动。民族民主党人把波兰民族的利益视为最高利益，努力创造一个超越阶级差异的团结社会，且并不特别强调宗教。虽然主张建立起更为强势的政府，但民族民主运动仍然坚持民主是首选的政治制度，只是波兰人的地位需要得到提升，且在波兰裔占多数的地区推动少数民族同化。在经济问题上，民族民主主义的立场不那么明确，不过最受欢迎的选择是自由市场的同时，允许政府有足够的干预权来保护国家利益。在外交事务上，民族民主运动强烈反德，并将俄罗斯视为遏制德意志帝国野心的最佳伙伴。"
 pataut_whiggism_subtype:0 "辉格主义"
 pataut_whiggism_subtype_desc:0 "§Y辉格主义§!\n\n£GFX_ideology_whiggism_bar\n\n\n\n\n辉格主义，在美国也称为共和主义，自其创立以来就有着不同的含义，但就现代美国而言，辉格主义是以19世纪初至中期辉格党思想为基础的意识形态，由于它在现代重新复兴，所以也被一些人称为新辉格主义。辉格主义根植于亨利·克莱、丹尼尔·韦伯斯特、扎卡里·泰勒、威廉·亨利·哈里森、威廉·苏厄德和约翰·昆西·亚当斯的意识形态，他们对美国悠久的帝国主义历史嗤之以鼻，并对“昭昭天命”的概念持批评态度，相反，他们宣扬孤立主义和内向的美国民族主义，佐以传统保守主义、新教虔诚、严厉的经济民族主义和保护主义，而所有一切的前提都是建立一个强大且占主导地位，并致力于实现议会制的国会与最高法院，而非危险专横的行政部门。辉格主义者对杰斐逊主义和杰克逊主义的传统持批评态度，与许多原始联邦主义思想紧密结合，试图在美国陷入一门心思关注世界上其他地方的无用奇想之前，帮助它回归到曾经让美国变得伟大的形式。"
 natpop_neo_confucianism_subtype:0 "新儒学"
 natpop_neo_confucianism_subtype_desc:0 "§Y新儒学§!\n\n£GFX_ideology_neo_confucianism_bar\n\n\n\n\n当代所称的新儒学，或新理学，指的是由中国唐代大儒韩愈和李翱以及后来南宋的朱熹和宋、元、明等时期的学者发展推广的原始新儒家哲学运动的现代化形式。新儒学试图创造一种更加理性世俗的儒学形式，对道教和佛教等东亚信仰大力批评，也反对西方传来的新信仰。新儒家将用来处理现实基本性质的形而上学哲学视为精神发展、宗教启蒙乃至实现不朽的催化剂，并以此为指导，再以现代化的传统主义，家庭价值观，儒家社会经济思想（如注重于将财富传承给后裔而非西方资本主义的及时行乐），追求社会和谐，人道主义以及由融入世俗生活中的有灵论与宗教支持的世俗理性主义为基础，创造一种推崇伦理，追求理性的意识形态。在政治和社会经济方面，新儒学内部的观点更为多样，共识也不再那么广泛，包括文化例外主义、公民或族群民族主义、阶级合作、重商主义、法团主义、公社主义、人道主义，甚至新封建主义的金融体系都在其中。新儒家主要可分为三大支流：陆王心学的理想主义者，称自己的学派为阳明学派，程朱理学的自然理性主义者和现实主义者，最后是刘胡学派的犬儒主义者。尽管他们看待现实和形而上学的哲学观各不相同，但也共同构成了现代理学，以及这种对适合东亚的传统保守形式的回归趋势的基础。"
 natpop_rocquisme_subtype:0 "罗克主义"
 natpop_rocquisme_subtype_desc:0 "§Y罗克主义§!\n\n£GFX_ideology_rocquisme_bar\n\n\n\n\n罗克主义，全称德拉罗克主义，是由世界大战的亲历者、火十字团之领袖弗朗索瓦·德拉罗克（或称德拉罗克上校、上校）所一手创造、旨在缔造出一种爱国信教之社会秩序的政治理论。德拉罗克上校的政党虽山头林立，但大抵都在“社会至上”的口号下遵循着几项共同的原则，而其中最为重要的一点便是其政治构想，即抛弃在他们看来软弱拖沓的议会共和制度，代之以强而有力的法治总统制，由总统来保证议会的团结。同绝大多数法国右翼人士一样，德拉罗克不仅支持妇女选举权，还认同家庭选举权，即组建家庭（也就是育有一个及以上子女）可以获得额外的投票权利。虽然德拉罗克的支持者普遍反对激进党的反教会立场，希望以慈善劝诫、社会救助等方式重回天主教的指引，但其内部又分裂为了两派，一派仅仅认为应点到为止，同教会的关系不该逾越合作的界限，而另一派则推崇国立天主教。德拉罗克上校本人宣扬的是不分民族的爱国主义，对于反犹主义是深恶痛绝，这在法国政坛可是个奇景，不过，这也仅是上校自己的观点，其党员中不乏反犹者。放眼国外，德拉罗克提倡欧洲各国之间的合作，用他自己的话来说就是“同属于一个文明的各个国家因着共同的利益而组成一种联邦”。经济方面，德拉罗克走的是法团主义和阶级合作的路子（不过，有人批评此举只是为了惠及弗朗索瓦·科蒂这般资助其党的实业家），并致力于通过非激进的和平方式（如设立最低工资标准）提升工人的权利。虽然德拉罗克的党羽火十字团自诩为“温和派”，但准军事部队的存在和偶尔的暴力冲突让其成为了他人眼中的又一个极右翼联盟。"
 radsoc_boer_nationalism_subtype:0 "布尔民族主义"
 radsoc_boer_nationalism_subtype_desc:0 "§Y布尔民族主义§!\n\n£GFX_ideology_boer_nationalism_bar\n\n\n\n\n布尔民族主义，或称非洲白人民族主义，是一种南非的民族主义意识形态，扎根于自认为是南非真正的居民的非洲白人群体。这些布尔白人排斥土著和英国殖民者，并热切地谈论布尔人在非洲的光辉历史——从大迁徙到布尔战争。这种意识形态往往主张某种形式的种族隔离，并钟情于南非荷兰语。从革命左翼主义到右翼民粹民族主义，各种政党都有实践这一意识形态的，但也确实存在更温和的信奉者，尽管布尔民族主义如今的核心无疑是以詹姆斯·赫尔佐格和丹尼尔·弗朗索瓦·马兰博士为代表的国民党。"
