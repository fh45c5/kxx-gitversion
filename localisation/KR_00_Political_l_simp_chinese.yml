 socdem_socdem_oligarchy_subtype_swap_tt:0 "我们将转向§M$socdem_oligarchy_subtype$§!"
 authdem_authdem_pan_celticism_subtype_swap_tt:0 "我们将转向§g$authdem_pan_celticism_subtype$§!"
