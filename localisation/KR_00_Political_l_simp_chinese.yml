 syn_municipalism_subtype:0 "市政社会主义"
 syn_municipalism_subtype_desc:0 "§Y市政社会主义§!\n\n£GFX_ideology_municipalism_bar\n\n\n\n\n联邦主义与国家单一制的问题，是每个民族国家最终都必须面对的核心议题之一。然而，有人主张将政治资本的真正源头进一步下放至地方政府。市政社会主义正是这场辩论的直接产物，它试图通过将大部分政治影响力赋予市议会、公社、区镇或城市，从而在政治实践中真正实现微观层面的聚焦。市政社会主义的拥护者常常寻求建立村镇联盟，使国家不过是数千个小型“共和国”或共同体的集合。遵循市政主义路线的政治运动，往往致力于对抗国家中日益增长的世界主义或国际主义倾向。在存在霸权体制的国家中，市政社会主义可能作为在地方层面——城市或市政范围内——落实意识形态实践的方式出现，例如在国家内部创建社会主义或无政府主义的公社组织，逐步将资本主义企业或近乎封建残余的村庄、城镇改造为集体所有的绿洲。市政社会主义乃至市政无政府主义通常采取非常传统的方法，摒弃激进变革，转而致力于改善地方机构，扩大水、能源、污水等必需品的公共所有权，并应对从压迫性租金到土地分配等基层问题。地方工会的重要性也被提升，将其整合至此前难以涉足的新建公共部门中。市政社会主义的追随者可能涵盖任何政治体系的左翼，但最热忱的践行者来自法国、意大利和西班牙的社会主义者，例如西班牙总统弗朗西斯科·皮·马加利、意大利改革者安德烈斯·科斯塔，以及英语世界的理论家——如美国的“下水道社会主义”运动和英国的波普勒主义者。对许多市政社会主义者而言，革命应当从国家的根基处建设，成长为真正由享有平等代表权的社会主义、无政府主义或工团主义村镇城市构成的花园。市政社会主义者往往与其他地方势力采取更具协作性的立场，甚至为改善地方社会而集结起包括保守派支持者在内的广泛联盟。尽管如此，在存在更中间派形式的社会主义或工团主义的地区，这些理想可能面临与建制派的冲突。对激进派而言，市政主义者是对革命凝聚力的威胁。"
