 natpop_humanisme_integral_subtype_desc:0 "§Y整体人道主义§!\n\n£GFX_ideology_humanisme_integral_bar\n\n\n\n\n整体人道主义也称作整体基督教人道主义，代表的是法国哲学家雅克·马里坦的思想综述，是众多基督教民主思潮流派的源头所在。在马里坦看来，单纯俗世上的人道主义并非完整的人道主义，因为它把人类存在的精神维度排除了在外，而没有了信仰的人道主义必定是缺失的，构不成一个整体。马里坦的哲学脱胎于圣托马斯·阿奎那，以经验和理性为出发点，独立于信仰之外，同时又与圣经不谋而合。马里坦认为，哲学是最基础的一门学科，它肩负着纠正其它一切次级学科的责任。马里坦排斥愚弄民众的基督教思想和传统神学，例如曾经他奉之为圭臬的莫拉斯主义，提倡基督教的多元化、民主化，认为这是基督教在如今的这一多极世界中所要经历的必然演化。整体人道主义把自然法则看作是人类道德的根源以及基础之所在，道德不是一种后天的构筑，而是人类的原始状态，正因有了道德，人才会自然地同同胞进行合作、实现相互之间的理解，而这也就解释了民主在这一理论中的优先性地位。"
 futuriblesisme_subtype:0 "限定未来主义"
 futuriblesisme_subtype_desc:0 "§Y限定未来主义§!\n\n£GFX_ideology_futuriblesisme_bar\n\n\n\n\n限定未来主义是一种以法国经济学家、法学家、作家和知识分子贝特朗·德·茹弗内尔（笔名纪尧姆·尚普利特）思想为根基的意识形态。茹弗内尔受到了亨利·德曼、作家安德烈·马尔罗和皮埃尔·德拉厄·拉·罗谢勒的深刻影响，其自称为“自由派”，对古典自由资本主义避而远之，提倡经济指导主义所代表的一系列美德。他认为自由主义首先是一个独立的、哲学的概念，其次才是经济概念，他将公共的社区协会试做表达自由的主要手段，同时对传统政党的无能深信不疑，并推崇以反议会联盟为代表的“有机而自然的自由”，这使他实际上与保王派和民族主义圈子走的更近，还成了激进党中“青年土耳其党”运动的一员。茹弗内尔还是个坚信法德能够达成和解与合作的和平主义者和政治生态学的狂热拥护者，利用政治行动来保护环境是他矢志不渝的斗争之一。正因如此，限定未来主义是一种超越了传统政治分歧的意识形态，通过从左翼和右翼汲取灵感，创造出一种社会、自由和保守的综合体。"
 enlightened_conservatism_subtype:0 "开明保守主义"
 enlightened_conservatism_subtype_desc:0 "§Y开明保守主义§!\n\n£GFX_ideology_enlightened_conservatism_bar\n\n\n\n\n开明保守主义又叫做吉佐优绩主义，是诞生自历史学家、政治家、七月王朝巨头弗朗索瓦·吉佐之事迹、著作及演讲的一种自由、保守、唯物、优绩的思想。吉佐把阶级斗争纳入了自己的核心理论之中，其想法与马克思如出一辙，认为社会是运作在各方利益冲突下的等级经济秩序之上的。不过，吉佐最后得出了一个截然不同的结论：工人阶级不应与资产阶级为敌，而是要努力积聚不输于后者的物质财富，从而成为资产阶级的一员，实现身心劳作的循环，在国家层面上推动创新与社会进步，因此可以说，阶级斗争有益于所有人。在吉佐看来，国家存在的目的并不是要改善民众的社会地位，也不是终结阶级对立，而是要让每个人都能拥有掌控自身命运向上攀登的权利，而这正是吉佐思想中优绩主义的一面。受启蒙时代思想家的影响，吉佐认为人人生而拥有相同的自由、能力与权利，而教育即是把这份天赋化为成功的机遇和工具。对于自己的立场，吉佐将其总结为了一句话：“启智修身，厚德载物，共进法兰西之道德与物质文明。”"
 aboriginal_garveyism_subtype:0 "原住民加维主义"
 aboriginal_garveyism_subtype_desc:0 "§Y原住民加维主义§!\n\n£GFX_ideology_aboriginal_bar\n\n\n\n\n弗雷德·梅纳德以及澳大利亚原住民进步协会所倡导的原住民加维主义是马库斯·加维的黑人民族主义思想与澳大利亚的独特原住民环境相互碰撞之后的产物，是经由非洲、加勒比、印度海员传至澳大利亚的加维主义之分支。1903年，加维主义组织有色人种进步协会于悉尼成立，其成员结合澳大利亚原住民斗争的具体国情，对原加维主义进行了二次解读，并在原住民水边工人间传播自己的理念，原住民加维主义由此而始。原住民进步协会是澳大利亚国内首个统一且政治化的原住民活动团体，其诉求是由原住民自己来管理原住民的事务，撤销专断独行的原住民保护委员会，代之以由受过教育的原住民所组成的管理会，管理会主席负责代表原住民同政府交涉。此外，原住民的公民权、议会代表权，或者仅仅是一个维护原住民权利的使节性职位也是协会的斗争目标。协会的首要宗旨是为原住民家庭争取土地，因为原住民本就是这片土地的所有者，天生享有土地的所有权。经历革命的洗涤后，协会的理念也发生了变化，开始把原住民的斗争同工人阶级紧密团结在一起，弗雷德·梅纳德参与工团主义性质的澳大利亚水边工人联合会的斗争便是这一团结的体现，加维主义自足、自卫、自尊的原则同阶级团结水乳交融。原住民加维主义者的目标是提升原住民群体的宗教、政治、产业、社会地位，赋予其掌握并塑造自身命运的权利。"
 jindyworobak_subtype:0 "并一运动"
 jindyworobak_subtype_desc:0 "§Y并一运动§!\n\n£GFX_ideology_jindyworobak_bar\n\n\n\n\n并一运动并非一套具有完备理论的意识形态，而是一种反对澳大利亚欧式主流之传统的文化、文学的政治化表达。并一运动起源于南澳大利亚州阿德莱德的一间文学社，其理念皆来自于创始人雷克斯·英加梅尔斯的演讲《论环境价值》。与原属的澳大拉西亚至上运动不同，并一运动的目标是培养一种独特的澳大利亚民族身份，在不干扰这一革命国家之政治运作的同时翦除澳大利亚的“外来影响之束缚”。正如其名“并一”所言，该运动旨在把澳大利亚的本土元素融入进移民文化，以此锻造出独属于自己的民族意识。并一运动的追随者们深深扎根于澳大利亚的自然风光之中，并为现代的城市化浪潮所感，偏爱追求一种“地方感”，也正因此，他们之间对于经济方面模糊不清的唯一共识就是保护原汁原味的澳大利亚森林之美与乡村生活方式。不过，并一运动内部也并非铁板一块：一些成员秉持着尊重的态度主张各原住民族的文化、传统融合，而另一些人则只关注表面的美感，并不关心文化方面的融合，一副家长式的做派。因此，并一运动中充斥着各式思想、理论，既有囊括了文化的解构，又允许自由主义经济同工会合作共存，是革命过后最为温和的团体。虽然有着种种分歧，但并一运动的成员都有着一个共同的信念：在如今这一深受其殖民过往所影响的文化环境中，重新定义并拥抱澳大利亚身份。"
 soclib_aboriginal_garveyism_subtype:0 "原住民加维主义"
