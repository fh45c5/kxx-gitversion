 has_scripted_peace_desc:0 "这个国家正处于战争状态，决心赢得胜利——虽然我们的抵抗能力要比看上去来得更弱些。（注：这一情况仅存在于拥有脚本和平事件的国家，事件本身基本会在触及游戏设置的投降限制之前便会触发，到时候你就明白了。）"
