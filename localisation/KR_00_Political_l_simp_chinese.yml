 soclib_islamism_subtype_desc:0 "§Y伊斯兰主义§!\n\n£GFX_ideology_islamism_bar\n\n\n\n\n伊斯兰主义，也称为伊斯兰政治、温和伊斯兰原教旨主义或威权伊斯兰共和主义，是一种样式多变的神学意识形态。伊斯兰主义国家的宪法、社会经济、司法和文化都会以符合伊斯兰信仰及相关教义为前提来架构，其通常反西方、反自由主义、反社会主义且极端传统保守。虽然总是与伊斯兰信仰和宗教组织紧密相连，但伊斯兰主义国家通常不会成为完全的神权政体，而是扎根于共和制度、军国主义、民族主义，抑或在极少数的情况，若能得到穆斯林国民的大力支持或要求，也可能以民主运动或体制的形式展现出来。伊斯兰教法和古兰经文学构成了伊斯兰主义的共性，西方基督教世界自然会对其报以不满，但颓废的享乐主义者和罪人的琐碎抱怨绝不能削弱勇敢忠诚的真主与先知信徒的决心。"
 marlib_pan_somalism_subtype:0 "泛索马里主义"
 marlib_pan_somalism_subtype_desc:0 "§Y泛索马里主义§!\n\n£GFX_ideology_pan_somalism_bar\n\n\n\n\n泛索马里主义，或称泛索马里思想和泛索马里民族主义，是非洲之角特有的传统泛非思想的一个分支，这种思想完全以索马里人民为中心。从马克思主义者和各种左翼人士到保守传统主义者、军国主义穆斯林和自由改革主义者，泛索马里意识形态的重点在于实现泛索马里民族主义之梦，那就是将索马里、欧加登、索马里兰、吉布提、朱巴兰以及肯尼亚和埃塞俄比亚的边缘地区的部落和部族都统一在一个民族主义国家之下。不过，能令所有泛索马里主义者都达成共识也就只有这一个共同梦想了，但就这么一个梦想，对于如何将其实现，是否要使用武力，各方依旧是个争论不休的状态，也因此，各种泛索马里主义的经济和政治意识形态以及他们统一非洲之角的计划都有很大不同。"
 marlib_islamism_subtype:0 "伊斯兰主义"
 marlib_islamism_subtype_desc:0 "§Y伊斯兰主义§!\n\n£GFX_ideology_islamism_bar\n\n\n\n\n伊斯兰主义，也称为伊斯兰政治、温和伊斯兰原教旨主义或威权伊斯兰共和主义，是一种样式多变的神学意识形态。伊斯兰主义国家的宪法、社会经济、司法和文化都会以符合伊斯兰信仰及相关教义为前提来架构，其通常反西方、反自由主义、反社会主义且极端传统保守。虽然总是与伊斯兰信仰和宗教组织紧密相连，但伊斯兰主义国家通常不会成为完全的神权政体，而是扎根于共和制度、军国主义、民族主义，抑或在极少数的情况，若能得到穆斯林国民的大力支持或要求，也可能以民主运动或体制的形式展现出来。伊斯兰教法和古兰经文学构成了伊斯兰主义的共性，西方基督教世界自然会对其报以不满，但颓废的享乐主义者和罪人的琐碎抱怨绝不能削弱勇敢忠诚的真主与先知信徒的决心。"
