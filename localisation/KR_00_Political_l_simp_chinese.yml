 pataut_legionarism_subtype:0 "军团主义"
 pataut_legionarism_subtype_desc:0 "§Y军团主义§!\n\n£GFX_ideology_legionarism_bar\n\n\n\n\n相比起具体的意识形态，军团主义更准确的定位定是前前后后化用意大利民族主义协会之名，行事风格却更为激进的各种运动的影响力与或相关或不相关的思想政策之集合，它是由各种势力卓群的强大政党所呈现出的一种极端民族主义革命思想体系。军团主义最早可上溯到俄罗斯首屈一指的黑色百人团组织俄罗斯人民联盟、德国的全国商业雇员联合会，以及法国的保罗·德鲁莱德为支持“复仇将军”乔治·埃内斯特·布朗热而建的极端右翼组织爱国联盟等运动，反动、好勇斗狠、反社反犹、种族至上便是它们的标志。大战之后，对极右翼影响最大、最受其拥戴的军团主义分支是匈牙利的根伯什·久洛及其塞格德思想，而最成功、为人所争相模仿的则是高深莫测的科尔内留·泽莱亚·科德里亚努麾下的大天使弥哈伊尔军团，亦即铁卫团。军团主义政党的政策以拥有着共同的血统、敌视侵染自家土地的“外国污秽”的本国普通民众为出发点，以虚无缥缈的“新生”为目标，致力于用复仇欲望、对模糊不清的教会的强烈信仰等价值观，或以及经自我牺牲、为大义而献身之原则熏陶的狂热准军事部队中的青少年的一腔热血团结起人民群众，共同迎接整个民族的重生。经济上，虽然可供取舍的方案有不少，但多数军团主义者还是选择了意大利民族主义协会的法团主义之路。军团主义者最鲜明的一点便是憎恶“内鬼”，并想尽一切办法与之对抗，而所谓“内鬼”，既可以是共产主义者、共济会、少数族裔，也可以是任何玷污了其经由超凡脱俗之尤利乌斯·埃佛拉男爵的觉醒军团之经文刚刚觉醒的纯净状态之人。虽然军团主义的追随者保留下了君主制之类的旧世界元素，但他们全部都渴望建立起崭新的革命性秩序，为族类创造出真正的天堂，让敌人体会到人间炼狱。"
 tseghakronism_subtype:0 "采哈克龙主义"
 tseghakronism_subtype_desc:0 "§Y采哈克龙主义§!\n\n£GFX_ideology_tseghakronism_bar\n\n\n\n\n采哈克龙主义是亚美尼亚的一种民族主义意识形态，该意识形态认为，个人的最高价值完全基于他的国家，脱离了国家，个人就无法作为有价值的存在。采哈克龙主义目的是将全体亚美尼亚人民团结在一个独立且唯一的亚美尼亚国家中。\n\n该主义的名字来源于同名的创始人，采哈克龙身为亚美尼亚人，拒绝接受周边环境的不当影响，认为只要遵循传统价值观生活，自己就必将立于不败之地。憎恶懦夫的采哈克龙将土耳其人、布尔什维克还有他们的走狗们视为死敌，他也拒绝接受所有否认国家存在必要性的思潮、宗教和教义。\n\n采哈克龙声称他早已准备好为部族和国家的存在而牺牲。亚美尼亚独立的伟大理想无比神圣，而采哈克龙知道，为实现如此理想的唯一道路，只有通过流血和牺牲才能实现。"
 natpop_popular_patriotism_subtype:0 "大众爱国主义"
 natpop_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 utopian_technocracy_subtype:0 "乌托邦技官主义"
 utopian_technocracy_subtype_desc:0 "§Y乌托邦技官主义§!\n\n£GFX_ideology_utopian_technocracy_bar\n\n\n\n\n乌托邦技官主义是传统技官主义的一个分支，正如技官公司及传统技官主义描述的那样，他们提倡建立与传统技官主义类似的政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。此外他们还支持美学革命，并推动艺术家、哲学家、作家及其他创造性思想家加入这一半寡头平台。而且，这些乌托邦主义技官们还抛弃了同时代其他技官的专制做派，转而大量借鉴索斯坦·维尔本和其他乌托邦平等主义者的思想，比如爱德华·贝拉米、罗伯特·欧文、诺曼·莱蒙德、夏尔·傅立叶和亨利·大卫·梭罗，并试图建立起受保护的民主合作委员会，在技术专家的指导下，所有人都以社区主义的方式拥有平等的发言权，共同迈向平等的天堂。总体而言，乌托邦技官主义试图突破传统政治模式的限制，将人类引向一个开明、艺术、人道、和平、改革和美学的紫色乌托邦。"
 socdem_humanistic_capitalism_subtype:0 "人道资本主义"
 socdem_humanistic_capitalism_subtype_desc:0 "§Y人道资本主义§!\n\n£GFX_ideology_humanistic_capitalism_bar\n\n\n\n\n人道资本主义希望在温和资本主义框架内，将人道主义与追逐利润统合起来。人道资本主义社会和其他资本主义社会一样，以市场手段实现经济繁荣，但其方式更为人道，更多地关注人民的需求、安全、健康，根据国情不同，对社会、文化甚至精神文明的发展也可能有更多投入。人道资本主义者以全国政府的无形之手取代模糊的市场力量，他们以此为指导，打造经济公平的金融体制，建立利润滚滚的乌托邦，在这里，无论是谁都有均等的机会，实现最天马行空的梦想。"
 socdem_paternal_socialism_subtype:0 "家长制社会主义"
 socdem_paternal_socialism_subtype_desc:0 "§Y家长制社会主义§!\n\n£GFX_ideology_patern_soc_bar\n\n\n\n\n家长制社会主义又称保守社会民粹主义，家长制保守主义，或在偶尔情况下在西方世界被称为基督教保守社会主义。这是一种古怪的意识形态，试图融合传统保守主义和非马克思的社会主义或进步民粹主义这些看似矛盾的思想。这一奇怪思想诞生自工业革命时期的英国和德国，但现在却在西方世界之外越发常见，比如拉丁美洲或非洲，那些地区并不适用欧洲发源的社会主义的规则和期望，因此转而寻求建立植根于宗教伦理，保守福利经济，阶级协作，公民民族主义和非极端爱国主义之上的道德保守社会。家长制社会主义通常与市场社会主义、基督教分产主义、慈善经济、俾斯麦国家社会主义、红色托利主义等各种财富分配方案相联系，尝试建立一套平等、非掠夺性的经济体系以对抗阶级斗争的理念。家长制社会主义将资本主义和社会主义思想融合在保守家长制的外壳下，为通常是传统主义者和民族主义者的本国人民谋福利，同时压制正统社会主义运动，以维持国家传统和社会稳定，即使这会导致他们与世界各地的其他社会主义者或保守主义者产生分歧。"
 soclib_humanistic_capitalism_subtype:0 "人道资本主义"
 soclib_humanistic_capitalism_subtype_desc:0 "§Y人道资本主义§!\n\n£GFX_ideology_humanistic_capitalism_bar\n\n\n\n\n人道资本主义希望在温和资本主义框架内，将人道主义与追逐利润统合起来。人道资本主义社会和其他资本主义社会一样，以市场手段实现经济繁荣，但其方式更为人道，更多地关注人民的需求、安全、健康，根据国情不同，对社会、文化甚至精神文明的发展也可能有更多投入。人道资本主义者以全国政府的无形之手取代模糊的市场力量，他们以此为指导，打造经济公平的金融体制，建立利润滚滚的乌托邦，在这里，无论是谁都有均等的机会，实现最天马行空的梦想。"
 soclib_dixiecrat_subtype:0 "民粹迪克西派"
 soclib_dixiecrat_subtype_desc:0 "§Y民粹迪克西派§!\n\n£GFX_ideology_populist_dixie_bar\n\n\n\n\n民粹迪克西派是来自美国深南的一种传统基督教保守主义，也因和旧民主党的关系而被称为旧民主党民粹主义，他们强烈反对自由主义、左派、民权运动以及各种现代社会的罪恶堕落——不过不同于同僚的是，他们带有强烈的民粹主义性质。迪克西和三K党等非法组织联系紧密，他们并不介意采用政治手段抑或更直接的途径来推行自己的理念。迪克西支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，他们是旧美国平民保守主义和传统的最后堡垒——为捍卫自己的地位，他们绝不吝惜采用暴力手段。"
 socdem_utopian_technocracy_subtype:0 "乌托邦技官主义"
 socdem_utopian_technocracy_subtype_desc:0 "§Y乌托邦技官主义§!\n\n£GFX_ideology_utopian_technocracy_bar\n\n\n\n\n乌托邦技官主义是传统技官主义的一个分支，正如技官公司及传统技官主义描述的那样，他们提倡建立与传统技官主义类似的政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。此外他们还支持美学革命，并推动艺术家、哲学家、作家及其他创造性思想家加入这一半寡头平台。而且，这些乌托邦主义技官们还抛弃了同时代其他技官的专制做派，转而大量借鉴索斯坦·维尔本和其他乌托邦平等主义者的思想，比如爱德华·贝拉米、罗伯特·欧文、诺曼·莱蒙德、夏尔·傅立叶和亨利·大卫·梭罗，并试图建立起受保护的民主合作委员会，在技术专家的指导下，所有人都以社区主义的方式拥有平等的发言权，共同迈向平等的天堂。总体而言，乌托邦技官主义试图突破传统政治模式的限制，将人类引向一个开明、艺术、人道、和平、改革和美学的紫色乌托邦。"
 socdem_reformed_belgicism_subtype:0 "改革比利时主义"
 socdem_reformed_belgicism_subtype_desc:0 "§Y改革比利时主义§!\n\n£GFX_ideology_reform_belgicism_bar\n\n\n\n\n改革比利时主义，又称改革比利时民族主义或“去极端化”比利时主义，是在德格勒尔政权倒台及其标准君权主义崩塌后，对比利时民族主义进行改革与去极端化的版本。改革比利时主义既保留了在截然不同的法裔瓦隆人和荷裔佛莱芒人间打造一个统一而有凝聚力的“比利时”身份认同这一目标，又剥离了比利时民族主义中德格勒尔那已被证明为失败的暴力反民主威权元素，同时致力于以各种方式平等对待一切比利时公民。改革比利时主义并不与特定的意识形态挂钩，它的主要目的是在推动民族融合和双语制（不过，各个比利时主义运动往往会出于方便或是个人喜好而偏向于法语或荷兰语的其中一个）的同时减少国家各区的自治性。虽然改革比利时主义常常涉及到罗马天主教信仰、社会天主教、非革命的社会主义式福利、比利时一元论，以及培养独特的比利时文化与身份认同，但比利时民族的概念并不与任何一个政治团体相绑定，从埃尔热的人道改革君权主义，再到比塞雷的人文资本主义和德乌斯的社会比利时主义，低地国家的各个意识形态、政治光谱内都可见到比利时国家及文化交融之理念。"
 marlib_reformed_belgicism_subtype:0 "改革比利时主义"
 marlib_reformed_belgicism_subtype_desc:0 "§Y改革比利时主义§!\n\n£GFX_ideology_reform_belgicism_bar\n\n\n\n\n改革比利时主义，又称改革比利时民族主义或“去极端化”比利时主义，是在德格勒尔政权倒台及其标准君权主义崩塌后，对比利时民族主义进行改革与去极端化的版本。改革比利时主义既保留了在截然不同的法裔瓦隆人和荷裔佛莱芒人间打造一个统一而有凝聚力的“比利时”身份认同这一目标，又剥离了比利时民族主义中德格勒尔那已被证明为失败的暴力反民主威权元素，同时致力于以各种方式平等对待一切比利时公民。改革比利时主义并不与特定的意识形态挂钩，它的主要目的是在推动民族融合和双语制（不过，各个比利时主义运动往往会出于方便或是个人喜好而偏向于法语或荷兰语的其中一个）的同时减少国家各区的自治性。虽然改革比利时主义常常涉及到罗马天主教信仰、社会天主教、非革命的社会主义式福利、比利时一元论，以及培养独特的比利时文化与身份认同，但比利时民族的概念并不与任何一个政治团体相绑定，从埃尔热的人道改革君权主义，再到比塞雷的人文资本主义和德乌斯的社会比利时主义，低地国家的各个意识形态、政治光谱内都可见到比利时国家及文化交融之理念。"
 reformed_belgicism_subtype:0 "改革比利时主义"
 reformed_belgicism_subtype_desc:0 "§Y改革比利时主义§!\n\n£GFX_ideology_reform_belgicism_bar\n\n\n\n\n改革比利时主义，又称改革比利时民族主义或“去极端化”比利时主义，是在德格勒尔政权倒台及其标准君权主义崩塌后，对比利时民族主义进行改革与去极端化的版本。改革比利时主义既保留了在截然不同的法裔瓦隆人和荷裔佛莱芒人间打造一个统一而有凝聚力的“比利时”身份认同这一目标，又剥离了比利时民族主义中德格勒尔那已被证明为失败的暴力反民主威权元素，同时致力于以各种方式平等对待一切比利时公民。改革比利时主义并不与特定的意识形态挂钩，它的主要目的是在推动民族融合和双语制（不过，各个比利时主义运动往往会出于方便或是个人喜好而偏向于法语或荷兰语的其中一个）的同时减少国家各区的自治性。虽然改革比利时主义常常涉及到罗马天主教信仰、社会天主教、非革命的社会主义式福利、比利时一元论，以及培养独特的比利时文化与身份认同，但比利时民族的概念并不与任何一个政治团体相绑定，从埃尔热的人道改革君权主义，再到比塞雷的人文资本主义和德乌斯的社会比利时主义，低地国家的各个意识形态、政治光谱内都可见到比利时国家及文化交融之理念。"
 syn_mexicayotlism_subtype:0 "墨西加本质主义"
 syn_mexicayotlism_subtype_desc:0 "§Y墨西加本质主义§!\n\n£GFX_ideology_mexicayotlism_bar\n\n\n\n\n墨西加本质运动，有时也被称为墨西加本质主义或墨西加本质思想，指的是推动卡拉斯科复辟的阿兹特克帝国的人性化、社会化和民主化的一场运动。这场激进运动的形成受到了墨西哥革命行动支持的墨西加和纳瓦的混合式民族主义的影响，以早已在历史上消失的美索美洲宗教为支柱，意图将阿兹特克人身份认知，现代化的墨西哥和奇卡诺民族主义以及墨西哥革命的理念相融合，提倡社会主义的土地改革、革命民主，以及真正的平等主义。由于人民和政府授予了受人敬爱的团结象征与国家元首弗里达·卡罗前阿兹特克统治者的头衔和神祇的绰号，在卡罗以及其余阿兹特克三邦同盟的精英后裔们领导下的墨西加本质运动乍看之下似乎与君主制度无异。然而，事实上卡罗掌握的政治权力极少，她只是作为国家精神和文化上的领袖，以及团结新民主制度的象征而存在。在托尔特卡特尔的指引下，墨西加本质运动把去除了中心论与优越论的土著民族主义、美索美洲的传统实践、新萨满教以及美索美洲文艺复兴，与社会主义土地改革、革命共和主义和社会进步主义等左翼思想融合在了一起，一心要将早已消亡的阿兹特克帝国转变为一个适应现代，真正民主的阿兹特克共和国。"
 authdem_agrarianism_subtype:0 "农业主义"
 authdem_agrarianism_subtype_desc:0 "§Y农业主义§!\n\n£GFX_ideology_soclib_agrarianism_bar\n\n\n\n\n农业主义并不是一套有着中心理论或基本原理的具体意识形态，而是对世界各地关注农民利益、倾听农民诉求的各式运动的总称。农业主义的支持者既有地主豪绅，也有中下贫农，既受居于上层凤尾者之青睐，亦得到中下层之拥戴。政治概念上的农业主义起源于自由放任主义者、重农学派的弗朗索瓦·魁奈提出的“自然政府”，以及托马斯·杰斐逊的乡村美德共和国之说。各农业党派的支持者们一致认为，土地上的人民乃是社会的基石，是国家有机体之中最重要的器官，不过，若具体到经济、税收、保护主义与自由贸易之抉择、政府体制、宗教等方面，又是百花齐放百家争鸣。农业党派多为传统、保守的一方，但同时也存在着相同数量的激进自由派和彻头彻尾的社会主义派，以及夹在二者之间、特立独行的右翼势力，而这一巨大的差异仅仅环视一下周遭的部分农业运动便可略窥一二，例如德国持民族革命观点的农村人民运动、保守的保皇派农民联合会、中道为上的捷克农业党及芬兰农民联盟，以及推崇激进社会变革的波兰人民党“解放”、保加利亚农民联盟。"
 commie_elfism_subtype_desc:0 "§Y马克思凯莉主义§!\n\n马克思列宁凯莉主义，又称马克思列宁凯莉思想或简称为精灵共产主义，是北极各种激进亲工团组织的主导左翼意识形态。凯莉主义呼吁成立一个先锋党，领导“精灵派”与圣诞老人的神权君主制封建政权进行革命斗争，它不同于其他形式的马克思主义，他们认为只有圣诞老人的精灵工人才能领导世界革命。凯莉主义者认为他们是所有工人阶级中最公平和最发达的，他们蔑视所有其他形式的左派，认为他们是种族主义和不纯洁的革命思想的忠实拥护者。"
 william_foster_thought_subtype:0 "威廉·福斯特思想"
 william_foster_thought_subtype_desc:0 "§Y威廉·福斯特思想§!\n\n£GFX_ideology_foster_bar\n\n\n\n\n威廉·福斯特思想，又称福斯特思想或福斯特主义，是指从前美国共产党转投融合工团主义的政治家、极权主义理论家和革命家威廉·Z·福斯特独有的思想理论。政治方面，福斯特思想在集体化社会的信条上，为给人民的意志提供表达的渠道，结合了由克列斯廷斯基和卡冈诺维奇发扬光大的革命精英和先锋党列宁主义原则，建立起集权化的工会组织。经济方面，除国有化所有行业外，福斯特主义提倡全面彻底的计划经济。社会方面，福斯特主义激进地追求进步，对宗教、资本主义、自由主义和反动思想如秋风扫落叶般态度强硬，寻求创建一种截然不同的新美国文化。这种摆脱了反动，国际主义且不含任何性别或种族歧视的社会追求，使得福斯特与许多黑人社会主义者或民族主义者关系良好，比如他的老友哈里·海伍德。"
 quaker_socialism_subtype:0 "贵格会社会主义"
 quaker_socialism_subtype_desc:0 "§Y贵格会社会主义§!\n\n£GFX_ideology_quaker_bar\n\n\n\n\n贵格会社会主义，是将贵格信仰，公谊会的教义和和平主义基督教理想，与受贝拉米主义启发的基督教社会主义相融合的产物。贵格会社会主义者深切关注被压迫者的苦难和战争的恐怖，致力于以基督教道德和社会教化为基础，通过慈善事业和救济资金援助穷人，建立一个以道德和平等消费、坚定的和平主义和非暴力、保护环境的农业主义，以及追求全美公民的平等、自由和解放的理念为基础的基督教福利国家。同时，贵格会社会主义长期以来一直支持废除死刑、良心反抗行为、国际人道主义救援、救灾、妇女权利、公民权利等，不过禁酒在他们内部是一件经常引发争论的话题。贵格会社会主义支持民主，尤其大力支持地方政府和社区的政治互动，试图与民粹主义者、进步主义者、自由主义者以及更多结盟势力共同努力，建设一座虔诚、平和、繁荣的山巅之城，向上帝创造的美丽星球上的每一个国家绽放光芒，呼唤它们走向救赎。"
 teetotalism_subtype:0 "禁酒主义"
 teetotalism_subtype_desc:0 "§Y禁酒主义§!\n\n£GFX_ideology_teetotalism_bar\n\n\n\n\n禁酒主义是对个人与社会实现完全戒酒，以及其他毒品和非法精神活性物质的一种实践与鼓吹，虽然自由主义或左翼之中也不乏禁酒主义的存在，但其还是常常被人视为与传统保守脱不开干系。一个纯粹的禁酒主义者与那些单纯的戒酒人士区别在于他们对禁酒理念的全身心投入和奉献，一些禁酒主义政党是在实现目标后就会解散的单一团体，不过，这也并不是说更有组织性、更广泛和更持久的禁酒主义政党不存在（在美洲和欧洲就有许多生动的例子）。在美国，禁酒党采用骆驼作为他们的象征，以表明自身“滴水不沾”。美国禁酒主义的立场来自于清教徒文化，而欧洲、印度与北美同样存在呼吁禁酒的狂热宗教团体。禁酒主义者在世界各地都很常见，但通常是更大规模运动的一部分，某种形式的宗教虔诚中穿插着禁酒运动是非常常见的，但也并非尽是如此。"
 radsoc_popular_patriotism_subtype:0 "大众爱国主义"
 radsoc_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 anarcho_bolshevism_subtype:0 "无政府布尔什维主义"
 anarcho_bolshevism_subtype_desc:0 "§Y无政府布尔什维主义§!\n\n£GFX_ideology_anarcho_bolshevik_bar\n\n\n\n\n无政府布尔什维主义，也称无政府主义布尔什维克社会主义或布尔什维克无政府共产主义，这些名词都是指代具有布尔什维克特点的无政府主义。无政府布尔什维主义得到了许多东欧无政府主义者的支持，其中尤以尤达·格罗斯曼为代表，他将马克思列宁主义与传统无政府主义原则相融合，又吸收了马赫诺和马雅可夫斯基的思想，并且拒绝接受失败的资产阶级克鲁泡特金无政府思想，他指出，布尔什维克先锋政策和无产阶级临时专政是必要的权宜之计，只有这样才能使社会走上正确的道路，并最终走向真正的社会主义——无政府主义。一些无政府主义者将其视作披着羊皮的狼，与布尔什维克妥协的叛徒和投机主义独裁者，对此大加批判。无政府布尔什维主义者则谴责这些卑鄙的指控，声称只有他们才是拯救人类的真正先驱，因为他们终将把无产阶级引向真正平等无国界的社会主义天堂。"
 pan_somalism_subtype:0 "泛索马里主义"
 pan_somalism_subtype_desc:0 "§Y泛索马里主义§!\n\n£GFX_ideology_pan_somalism_bar\n\n\n\n\n泛索马里主义，或称泛索马里思想和泛索马里民族主义，是非洲之角特有的传统泛非思想的一个分支，这种思想完全以索马里人民为中心。从马克思主义者和各种左翼人士到保守传统主义者、军国主义穆斯林和自由改革主义者，泛索马里意识形态的重点在于实现泛索马里民族主义之梦，那就是将索马里、欧加登、索马里兰、吉布提、朱巴兰以及肯尼亚和埃塞俄比亚的边缘地区的部落和部族都统一在一个民族主义国家之下。不过，能令所有泛索马里主义者都达成共识也就只有这一个共同梦想了，但就这么一个梦想，对于如何将其实现，是否要使用武力，各方依旧是个争论不休的状态，也因此，各种泛索马里主义的经济和政治意识形态以及他们统一非洲之角的计划都有很大不同。"
 syn_islamic_socialism_subtype:0 "伊斯兰社会主义"
 syn_islamic_socialism_subtype_desc:0 "§Y伊斯兰社会主义§!\n\n£GFX_ideology_islamic_socialism_bar\n\n\n\n\n伊斯兰社会主义，或称穆斯林社会主义，是一类广泛而形式各异的社会主义和左翼制度的统称，它们的共同点是拥护根植于穆斯林信仰以及穆罕默德、《古兰经》的教义的精神式社会主义（通常是马克思主义，但也不能百分百保证）。伊斯兰社会主义者的思想大多来自于先知早期的麦地那福利制度——天课制度，以及其他各种左翼、进步主义、民粹主义思想，甚至是传统主义和神智学。伊斯兰社会主义者之间的差异很大，但他们都在很大程度上认为《古兰经》为他们的立场提供了保障和支持，为此，他们将不惜一切代价，在真主的指引下，为世界降下一场神圣而虔诚的革命。"
 syn_buddhist_socialism_subtype:0 "佛教社会主义"
 syn_buddhist_socialism_subtype_desc:0 "§Y佛教社会主义§!\n\n£GFX_ideology_buddhisyn_bar\n\n\n\n\n佛教社会主义可以是一系列不同的社会主义和左翼制度，他们都因为对佛教原则的坚定信仰而结合在一起，他们指出社会主义和佛教都试图通过分析我们的现有条件，通过实践、信仰或冥想来解决、消除或越过这些障碍，从而结束人类所面临的苦难。佛教社会主义分为许多派别——有些是军国主义者，有些是和平主义者，一些更侧重于意识形态，而另一些则更侧重于宗教。佛教社会主义既丰富多彩，又千姿百态，这种融合了不同种类的社会主义和不同佛教流派的思想，试图改变无产阶级的个人意识，从而结束人类的异化和苦难。佛教社会主义者致力于创造一个以左翼思想和佛教哲学为中心的社会平等主义天堂，并将被选中的无产阶级带到涅盘以及更高的境界。"
 islamic_socialism_subtype:0 "伊斯兰社会主义"
 islamic_socialism_subtype_desc:0 "§Y伊斯兰社会主义§!\n\n£GFX_ideology_islamic_socialism_bar\n\n\n\n\n伊斯兰社会主义，或称穆斯林社会主义，是一类广泛而形式各异的社会主义和左翼制度的统称，它们的共同点是拥护根植于穆斯林信仰以及穆罕默德、《古兰经》的教义的精神式社会主义（通常是马克思主义，但也不能百分百保证）。伊斯兰社会主义者的思想大多来自于先知早期的麦地那福利制度——天课制度，以及其他各种左翼、进步主义、民粹主义思想，甚至是传统主义和神智学。伊斯兰社会主义者之间的差异很大，但他们都在很大程度上认为《古兰经》为他们的立场提供了保障和支持，为此，他们将不惜一切代价，在真主的指引下，为世界降下一场神圣而虔诚的革命。"
 buddhist_socialism_subtype:0 "佛教社会主义"
 buddhist_socialism_subtype_desc:0 "§Y佛教社会主义§!\n\n£GFX_ideology_buddhisyn_bar\n\n\n\n\n佛教社会主义可以是一系列不同的社会主义和左翼制度，他们都因为对佛教原则的坚定信仰而结合在一起，他们指出社会主义和佛教都试图通过分析我们的现有条件，通过实践、信仰或冥想来解决、消除或越过这些障碍，从而结束人类所面临的苦难。佛教社会主义分为许多派别——有些是军国主义者，有些是和平主义者，一些更侧重于意识形态，而另一些则更侧重于宗教。佛教社会主义既丰富多彩，又千姿百态，这种融合了不同种类的社会主义和不同佛教流派的思想，试图改变无产阶级的个人意识，从而结束人类的异化和苦难。佛教社会主义者致力于创造一个以左翼思想和佛教哲学为中心的社会平等主义天堂，并将被选中的无产阶级带到涅盘以及更高的境界。"
 radsoc_pan_somalism_subtype:0 "泛索马里主义"
 radsoc_pan_somalism_subtype_desc:0 "§Y泛索马里主义§!\n\n£GFX_ideology_buddhisyn_bar\n\n\n\n\n泛索马里主义，或称泛索马里思想和泛索马里民族主义，是非洲之角特有的传统泛非思想的一个分支，这种思想完全以索马里人民为中心。从马克思主义者和各种左翼人士到保守传统主义者、军国主义穆斯林和自由改革主义者，泛索马里意识形态的重点在于实现泛索马里民族主义之梦，那就是将索马里、欧加登、索马里兰、吉布提、朱巴兰以及肯尼亚和埃塞俄比亚的边缘地区的部落和部族都统一在一个民族主义国家之下。不过，能令所有泛索马里主义者都达成共识也就只有这一个共同梦想了，但就这么一个梦想，对于如何将其实现，是否要使用武力，各方依旧是个争论不休的状态，也因此，各种泛索马里主义的经济和政治意识形态以及他们统一非洲之角的计划都有很大不同。"
