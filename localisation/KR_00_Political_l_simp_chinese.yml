 radsoc_kimbanguism_subtype:0 "基班古主义"
 radsoc_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与社会主义团体之间的关系，基班古主义逐渐接受了刚果民族主义、马克思主义和社会主义经济学，因而变得激进反帝，不过总体上其仍遵循着和平主义和部落主义的立场。"
 socdem_radical_progressivism_subtype:0 "激进进步主义"
 socdem_radical_progressivism_subtype_desc:0 "§Y激进进步主义§!\n\n£GFX_ideology_radprogress_bar\n\n\n\n\n激进进步主义代表着在其他保守主义或传统主义国家中一系列模糊的左翼和中左翼思想流派，他们通常抵制更广泛的左翼和自由派改革理念。与国外的部分运动相比，这些组织可能不是最激进的，其社会主义或自由主义属性也并不算突出，但与他们所居住国家的现状和民众的态度相比，这些温和的“激进分子”是相对极端的。这些运动推动着一系列不同的从左翼到适度自由或进步的议程，跳出了他们所在国家的主流公众可接受的政治领域，推动着他们自己的“左翼主义”，即使这些理念被其他左翼政权视为自由派甚至是中间派。"
 socdem_left_panafricanism_subtype:0 "左翼泛非主义"
 socdem_left_panafricanism_subtype_desc:0 "§Y左翼泛非主义§!\n\n£GFX_ideology_left_panafricanism_bar\n\n\n\n\n左翼泛非主义，有时直接称之为泛非主义，是对围绕着泛非团结理念的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和社会主义的意识形态通常寻求通过一系列左派思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行合作。尽管本质绝非如此，但左翼泛非主义往往会变得军事化。虽然每一个派系对更广泛的世界革命或非洲以外的左翼革命的关注各有不同，但也并非所有泛非主义者都只关心非洲事务。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由奥尼扬戈·奥巴马、夸梅·恩克鲁玛、乔治·帕德莫尔和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 socdem_republican_panafricanism_subtype:0 "共和泛非主义"
 socdem_republican_panafricanism_subtype_desc:0 "§Y共和泛非主义§!\n\n£GFX_ideology_soclib_republican_panafricanism_bar\n\n\n\n\n共和泛非主义，有时直接称之为泛非主义，是对围绕着泛非团结理念的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民主主义的意识形态通常寻求通过一系列自由共和或保守共和思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行民主合作。尽管本质绝非如此，但共和泛非主义往往会变得军事化，在经济上，他们通常要么支持法团主义，要么资本主义，要么则是传统主义。各个共和政府对民主进程的关注程度各不相同，但贪污腐败却往往成为其共同特征。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由让·普莱斯-马尔斯、W·E·B·杜波依斯、乔莫·肯雅塔、马库斯·加维和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 socdem_fascism_subtype:0 "法西斯主义"
 socdem_fascism_subtype_desc:0 "§Y法西斯主义§!\n\n£GFX_ideology_fascism_bar\n\n\n\n\n法西斯主义也叫作新法西斯主义、西西里法西斯主义、隆巴尔迪法西斯主义，是意大利内战，以及西西里工人联盟遗产复兴的产物。基督教工党的领导人里卡尔多·隆巴尔迪深入西西里工人联盟曾经的受众——世代遭敲骨吸髓的农村农民和底层人民之间，开展了大规模的动员宣传，并在此期间提出了法西斯主义思想。法西斯主义提倡放下狭隘的南方民族主义，回到半岛统一、底层民众参与政治、代议制民主和基督教农业社会主义社会的理想中来，其力图终结工农阶层的贫困与所受的压迫、平等扩大并保障全体公民的权利，以及统一意大利人民、抚平国家解体所带来的创伤。法西斯一词有着“联盟”的引申意，意大利古往今来的不同政治派别的多个组织团体都曾用过这个名字，而新法西斯则是如今唯一一个把法西斯写在了头上的运动。"
 soclib_republican_panafricanism_subtype:0 "共和泛非主义"
