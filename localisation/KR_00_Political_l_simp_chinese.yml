 syn_italian_left_futurism_subtype:0 "意大利左翼未来主义"
 syn_italian_left_futurism_subtype_desc:0 "§Y意大利左翼未来主义§!\n\n£GFX_ideology_left_italian_futurism_bar\n\n\n\n\n意大利左翼未来主义，简称左翼未来主义，即政治领域中的马里内蒂主义，原是由艺术家菲利波·托马索·马里内蒂在意大利创立的一艺术运动，该运动有些类似于超现实主义、旋涡主义、辐射主义、精确主义、构成主义、装饰派艺术、达达主义等在第三国际中颇具影响力的前卫派运动，与同时代的过去主义中的浪漫传统主义元素正好相反。该思想的首次提出是在《未来主义宣言》中，这部宣言是马里内蒂同原于米兰活动的未来主义团体的同僚艺术家，如翁贝托·博乔尼、卡洛·卡拉、福尔图纳托·德佩罗、吉诺·塞韦里尼、贾科莫·巴拉、路易吉·鲁索洛等，一起协力编写的。未来主义运动以艺术为抛弃过去的载体，力图将国家从往日的身份枷锁之中释放出来，从而迈向完美的未来之姿，为此，其崇拜现代性以及美丽、未知的未来所带来的可能性与动力，排斥文艺复兴、罗马等意大利的传统概念，梦想着有朝一日能除去意大利身上所承载的往昔重压，尽情航向明日的无限可能。虽然马里内蒂同贝尼托·墨索里尼一样，都是干涉主义的狂热鼓吹者，而且自社会主义共和国建立始，马里内蒂就与墨索里尼的国家革命集团穿一条裤子，但“未来主义政治党”还是给出了一份不同于宪章派的国家工团主义的革命纲领。未来主义者在其政治宣言《未来主义民主》中提出，要以精准的快刀对付教权，解散职业军队并代之以志愿军，废除婚姻制度、由国家来抚养儿童并对自由恋爱征税，大规模去官僚化，全面的性别平等，乔治主义的土地改革，以及比例代表制和由其产生的由二十名三十岁以下公民组成、代表社会各个阶级的单一制技术政府，而上述种种，皆是为了打碎左右翼充斥着犯罪和反动势力、社会主义者和无政府主义者不愿向其挥刀的既定秩序，创造出“唯一洁净的世界”。虽然左翼未来主义有着高度平等与反极权的性质，但近些年意大利的现状却使得以未来主义元老朱塞佩·博塔伊为中心的一股激进势力不断壮大，他们借鉴了国家工团主义的某些元素，并与外国的种族优越运动沆瀣一气。"
 syn_hardliner_bolshevism_subtype:0 "强硬布尔什维主义"
 syn_hardliner_bolshevism_subtype_desc:0 "§Y强硬布尔什维主义§!\n\n£GFX_ideology_hardline_bolshevik_bar\n\n\n\n\n布尔什维主义在俄国的失败，以及工团主义在西方国家的胜利，致使共产主义运动陷入了分崩离析之中，许多昔日忠于布尔什维主义的革命者只得被迫适应新的现实。当一部分人转投工团主义时，另一些人则寻求贯彻更为激进、更强调纪律的解决方案。强硬布尔什维主义便在这种意识形态的萎靡不振中诞生了。强硬布尔什维主义常被用来形容坚持以下结论的人：布尔什维克革命之所以失败，不是因其意识形态有何痼疾，而是因其未能保卫社会主义国家，未能在党和人民之中巩固意识形态信仰。拉扎尔·卡冈诺维奇和维克托·威尔科克斯等人是这一论点的主要支持者，他们主张超越传统的列宁主义原则，以强而有力的专制措施保卫革命，如国家军事化、国家主导的恐怖、指令性经济、与国家而非民族紧密相连的公民社会爱国主义。除此之外，最引人注目的也许是他们对一切反马列“修正主义”的猛烈批判，他们认定一切持不同意见的社会主义者不过是“假冒伪劣”、“资产阶级代理人”，妄图颠覆马克思与列宁的理论。他们宣称，自己的一切努力不过是为了保证革命能永存于世。颇为讽刺的是，一些人反倒因此怀疑起他们对社会主义有几分真心实意，继而给他们贴上“波拿巴主义者”、“红色极权主义者”等标签。但这些诋毁之声丝毫无法动摇列宁主义自豪的追随者。对他们来说，没有什么比阶级斗争更重要的使命，为了一个摆脱阶级压迫的世界，也没有什么代价是不可接受的。"
 syn_revolutionary_bolivarianism_subtype:0 "革命玻利瓦尔主义"
 syn_revolutionary_bolivarianism_subtype_desc:0 "§Y革命玻利瓦尔主义§!\n\n£GFX_ideology_rev_bolivar_bar\n\n\n\n\n玻利瓦尔主义的左翼分支常被称作革命玻利瓦尔主义或左翼玻利瓦尔主义，以与同样怀着统一前西班牙殖民地梦想的右翼对立派加以区分。尽管同样尊崇西蒙·玻利瓦尔、同样认同拉美例外论，但革命玻利瓦尔主义同时大声疾呼反帝，宣扬左派国际主义，有时还主张建立民主制度。巴拿马社会主义者迪奥赫内斯·德拉罗萨是这种思想的主要拥护者，他的纲领建立在何塞·巴斯孔塞洛斯·卡尔德龙、何塞·卡洛斯·马里亚特吉、维克托·劳尔·阿亚·德拉托雷、奥古斯托·塞萨尔·桑地诺等人的思想基础上，可称社会主义大杂烩，以“印美”人为核心概念。革命玻利瓦尔主义者呼吁将欧美白人与美洲土著完全融为一体，以塑造一种独特而富于凝聚力的民族文化认同——仅有此路可以让我们完全摆脱境外势力的阴谋诡计和一己私欲。德拉罗萨这一派人想最终建立起文化多元、民族多元的社会主义人间天堂，认为这与左翼玻利瓦尔主义治下的伊比利亚美洲现实相契合。"
 soccon_hilozoismo_subtype:0 "物活主义"
 soccon_hilozoismo_subtype_desc:0 "§Y物活主义§!\n\n£GFX_ideology_hilozoismo_bar\n\n\n\n\n物活主义，亦称加利西亚泛灵论或想象主义，是由作家兼保守派诗人路易斯·阿马多·卡瓦略创立的前卫派思潮。该思想最初由阿马多推广为诗歌文化形式，自其融入比森特·里斯科领导的新奇政治运动后，逐渐发展成体系化的政治理念。物活主义既汲取加利西亚民俗传统与宗教仪轨，又融合神秘学、灵性论与神智学思想，与里斯科的新复兴运动及传统主义作家拉蒙·德尔·巴列-因克兰的创作存在诸多共鸣——阿马多坦言深受后者启迪。但阿马多在灵性观念上较里斯科更为温和，主张以民间天主教及本土信仰替代里斯科杂糅的东方元素。其思想未全盘否定现代性，而是尝试将先锋队主义元素注入加利西亚传统，使现代生活节奏与古老加利西亚生活方式相融合。该理念同时摒弃新复兴运动固有的排外倾向，既吸纳外来词汇丰富加利西亚语，又为原本偏重乡土的保守运动注入欧洲世界主义气质。最独特的当属阿马多被某些学者阐释为泛神论或泛灵论的环保主义。这名诗人认为，加利西亚人的灵性直接源于这片土地兼具野性与人文特质的生态环境，因此通过自然过程实现天人合一便成为族群存续的关键。尽管目前仍属非主流思潮，但由于阿马多的论述呈现出更纯粹、更易接受的新复兴运动版本，该理念已开始取代里斯科的理想。它以前所未有的方式将加利西亚艺术创造者与被神化的农民阶层相融合，形成糅合民间天主教农业民粹主义、环保主义与传统主义的独特体系，在伊比利亚半岛独树一帜。"
 pataut_hilozoismo_subtype:0 "物活主义"
