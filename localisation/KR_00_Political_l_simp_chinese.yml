 tot_agrarian_socialism_subtype:0 "农业社会主义"
 tot_agrarian_socialism_subtype_desc:0 "§Y农业社会主义§!\n\n£GFX_ideology_agrarian_socialism_bar\n\n\n\n\n农业社会主义是将农本学说与社会主义理论相融合的产物。诸如萨帕塔或俄国民粹派之类的农业社会主义者，往往比他们的左派同胞更加保守，致力于建立起把农民的利益置于首要位置的社会主义制度。农业社会主义常见于欠发达或工业化不足的国家，其支持者通常倾向于支持民主，要求建立农业合作社、公社等合作组织，以更好地在建设真正的社会主义的同时，提高农业产出效率。"
 tot_market_socialist_subtype:0 "市场社会主义"
 tot_market_socialist_subtype_desc:0 "§Y市场社会主义§!\n\n£GFX_ideology_market_socialism_bar\n\n\n\n\n虽然大多数社会主义都拒绝自由市场，但市场社会主义者认为社会主义经济与市场的规则、流动并不矛盾。实行市场社会主义的国家对小型企业和对外贸易是来者不拒，其产生的额外利润会被分配到社会项目或公民红利中。市场社会主义政府之间的差别可能会很大，但它们中大多数都遵循着“苏维埃民主”的模式。这一思想最著名的例子便是推行新经济政策的尼古拉·布哈林领导的人民社会党。"
 tot_bukharinist_subtype:0 "布哈林主义"
 tot_bukharinist_subtype_desc:0 "§Y布哈林主义§!\n\n£GFX_ideology_bukharin_bar\n\n\n\n\n布哈林主义也称半市场社会主义，由前布尔什维克尼古拉·布哈林在俄国内战后提出，这一理论是人民社会党的政纲，也是所谓新经济政策的依据。\n\n布哈林认为，布尔什维克革命功败垂成、内战红军一败涂地的罪魁祸首正是低效的“战时共产主义”，这项政策彻底疏远了农民，还造成了经济危机。布哈林同经济学家尼古拉·康德拉季耶夫一道，提出社会主义应当通过循序渐进的方式实现，综合运用计划与市场机制的国家管制混合经济则是达成目标的必要手段。“城市社会主义，乡村资本主义”便是布哈林在新党成立大会上对其纲领的论述。除了经济领域外，布哈林还提倡建立多党制的苏维埃民主、权力分立以及本土化政策——即鼓励少数民族的发展，限制俄化进程。"
 pataut_czech_national_democracy_subtype:0 "民族民主主义"
 pataut_czech_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_czech_natdem_bar\n\n\n\n\n至少从几十年前开始，捷克民族民主党就是维也纳的眼中钉肉中刺，它是波希米亚王冠领内最强大的一股右翼政治势力。民族民主党起源于“青年捷克党”，其在经济上持民族性的自由主义观点，相关政策皆以保护捷克消费者为出发点。在外交政策方面，民族民主党支持斯拉夫人之间的结盟，希望能借此将日耳曼人的势力从捷克的土地上驱逐出去，还有些人甚至认为这只是向泛斯拉夫联盟的建立迈出的第一步罢了。在政治领域，民族民主党人主张建立一个强硬但民主的制度，并把捷克民族置于最重要的位置上，让每一名国民，无论其阶级背景如何，都能感受到生活水平的提升。民族民主党与波兰的民族民主运动起源虽然迥然不同，但却在许多方面都有着异曲同工之处。"
 tot_euro_panafricanism_subtype:0 "欧洲泛非主义"
 tot_euro_panafricanism_subtype_desc:0 "§Y欧洲泛非主义§!\n\n£GFX_ideology_euro_panafricanism_bar\n\n\n\n\n欧洲泛非主义，或其缔造者扬·史末资口中的殖民泛非主义，是一种旨在将非洲统一在白人统治之下的帝国主义思想理论。欧洲泛非主义最初盛行于扬·史末资的南非和某些阿非利卡劳工组织之间，它寻求非洲南部各英国、葡萄牙、比利时殖民国间的平等合作，虽然史末资本人是名自由主义保守派，但这时的欧洲泛非主义并不带有任何正式的政治色彩。不过，欧洲泛非主义后来发展出了部分分支，典型的就有刚果的让·德科斯泰和阿尔贝·德科斯泰，他们鼓励抛弃殖民地心态，大量吸引欧洲移民，在与欧洲列强平起平坐的基础上把上述土地乃至整个非洲大陆统一为一个真正的社会主义民族国家。总的来说，欧洲泛非主义是诞生于绵延至今的瓜分非洲之狂潮中的奇特产物，是白人责任论、塞西尔·罗兹之实在意识形态方面的具现化，它的第一要务是为黑暗大陆上正苦苦挣扎的殖民者带来法律、秩序与优越的社会地位。"
 syn_euro_panafricanism_subtype:0 "欧洲泛非主义"
