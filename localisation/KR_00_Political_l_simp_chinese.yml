 tot_macianismo_subtype_desc:0 "§Y马西亚主义§!\n\n£GFX_ideology_macianismo_bar\n\n\n\n\n或许再没有人比加泰罗尼亚祖父，也就是弗兰塞斯克·马西亚-柳萨更能体现加泰罗尼亚争取主权斗争的代表性了。马西亚出身富裕家庭，且军旅生涯前途无量，却选择抛弃这一切，将毕生精力投入近乎唯一的目标——使加泰罗尼亚脱离西班牙独立。马西亚与同时代其他民族主义者的不同之处在于，他拥有非凡的号召力，能够凝聚全球及地区各类盟友，甚至将无政府工联的无政府主义者与丹尼尔·卡多纳-西维特的天主教极端民族主义者这些立场迥异的群体，都统合到其领导的加泰罗尼亚国家组织旗下。\n\n在加泰罗尼亚独立的宏伟蓝图前，各方政治理念的细节差异已无关紧要。马西亚将加泰罗尼亚事业视为反抗马德里统治者的反帝斗争，因此成功动员了加泰社会各阶层力量。这种反帝信念也延伸至其外交策略，他创立被压迫国家联盟，与欧洲及世界各地的民族主义团体合作，在推动加泰解放的同时致力于促进全球无国家民族的共同事业。但与许多加泰民族主义者不同，马西亚并未排斥西班牙联邦制的可能解决方案，为实现加泰自由这一终极目标，他始终保持着与西班牙共和派妥协的灵活性。\n\n马西亚主义的核心在于依靠去中心化却协调统一的加泰罗尼亚主义力量，这也构成了其政党加泰罗尼亚共和左翼的主要架构。该党以三大支柱机构：农民联盟、产业联盟及政党本身为核心，这些组织将如马赛克般渗透至加泰社会各角落，与各地农团、工会、合作社及其他政党和抵抗组织缔结同盟。马西亚因阑尾炎早逝反而强化了其政治遗产的影响力，加泰罗尼亚国家的各路派系竞相借用其名义争夺政治资本。如今，马西亚主义已成为象征加泰罗尼亚作为渴望自由的被殖民国度、国际无国家民族大团结必要性的思想旗帜，更是凝聚纷争不休的加泰罗尼亚主义各派力量、构筑抵抗卡斯蒂利亚帝国主义统一战线的行动指南。"
