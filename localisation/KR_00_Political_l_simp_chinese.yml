 maximist_ruralism_subtype:0 "准则乡村主义"
 maximist_ruralism_subtype_desc:0 "§Y准则乡村主义§!\n\n£GFX_ideology_maximist_ruralism_bar\n\n\n\n\n准则乡村主义的诞生，源于该国众多乡村主义者与奥斯瓦尔德·莫斯利的准则派之间多年来的脆弱联盟。其试图融合双重目标：一方面，建立能将英国民众重新带向简朴农耕生活的政府；另一方面，动员他们起身抵抗世界其他强国。这一思想大力倡导自给自足、合作社模式与重农路线，并如所有折衷意识形态一般，呈现出高度的多元性，其成员遍布整个政治光谱。乔里安·詹克斯、乔治·斯塔普尔顿、哈罗德·约翰·马辛厄姆、罗尔夫·加德纳等关键人物都曾指出：日趋现代化的世界正迅速侵蚀国民曾经强健的体魄与健康的文化。这种广泛的多元性，使得运动图景始终处于流变之中：新团体不断从旧派系中分裂诞生。如今联盟内的大部分乡村主义者，都曾先后隶属于约翰·哈格里夫的“强者之证亲族”组织及社会信贷运动，随后又分化出诸多分支，例如加德纳的“农耕亲缘会”与蒙塔古·福特姆的“乡村建设协会”。他们与有机运动及有机主义思想紧密相连，其纽带之深，甚至让政治立场对立的双方也常在相关议题上产生共鸣。在更广阔的乡村主义阵营中，普遍形成了一种共识：食品质量的持续下降，以及杀虫剂与强力肥料的滥用，正不断拖垮西方文明，并扼杀着英国的民俗生活。人们相信，唯有通过一场宏大的乡村牧歌生活方式复兴，重现“快乐英格兰”般的理想景象，才能阻止个人乃至整个乡村社会逐步走向衰亡。"
 militant_feminism_subtype:0 "激进女权主义"
 militant_feminism_subtype_desc:0 "§Y激进女权主义§!\n\n£GFX_ideology_militant_feminism_bar\n\n\n\n\n比起一种意识形态，激进女权主义更像是一套争取女性彻底解放的手段和信条，用以描述那种将暴力推翻现有体制视为实现男女平等唯一途径的理念。其根源可追溯至20世纪初英国争取妇女选举权的“女权激进派”运动，最初她们完全以和平方式进行斗争。然而，在1910年黑色星期五示威中遭遇警察与男性路人的残酷镇压后，妇女社会政治联盟决定以暴制暴：从破坏财物、纵火焚烧、施放炸弹，乃至暗杀高级官员，手段日益激烈。这一转向主要由埃米琳·潘克赫斯特家族推动，特别是家长埃米琳及其三位女儿西尔维娅、克丽丝塔贝尔和阿黛拉。与同期欧洲罪犯无政府主义欲借犯罪摧毁国家和资本的总体目标不同，激进女权主虽同样诉诸犯罪手段，但只聚焦于女性的全面解放，将工人受压迫、帝国主义等议题视为负担而非同盟。尽管在理论上存在无政府主义甚至去中心化的分支，但大多数团体仍尊奉一位无形却专断的“母性领袖”，凭借其意志不断消解性别之间的鸿沟。"
 reformed_sorelianism_subtype:0 "原教旨索雷尔主义"
 reformed_sorelianism_subtype_desc:0 "§Y原教旨索雷尔主义§!\n\n£GFX_ideology_reformed_sorelianism_bar\n\n\n\n\n现代索雷尔主义的思想虽显然植根于来自法国极具影响力的政治哲学家乔治·索雷尔，但它真正融入法兰西公社的现实语境，要归功于乔治·瓦卢瓦和爱德华·贝尔特这对学术上的“双子星”。索雷尔主义诞生之初，便是对正统马克思主义的修正与否定，在他们看来，“马克思主义已然崩溃”，社会主义“早已死亡”。因此，索雷尔借助法国无政府主义者皮埃尔-约瑟夫·蒲鲁东的思想加以拓展，这一路径也对瓦卢瓦与贝尔特产生了深刻影响。二人随后创立“蒲鲁东圈”，主张唯有通过直接对抗资产阶级敌人，并借助革命工团主义的总罢工“神话”，工人阶级才能改善自身处境。然而，资产阶级一度沉睡的“生产活力”，却在法国最腐朽、最堕落的敌人，也就是自由主义民主的侵蚀下日渐萎靡。阶级斗争在唤醒自觉的无产者的同时，也将使资产阶级重获新生。索雷尔派对议会民主及世俗精神的憎恶，甚至体现在他们推崇古典主义艺术的立场中。当索雷尔主义于法兰西公社发展为乔治·瓦卢瓦等人所奉行的极端形态时，仍有部分人坚守索雷尔的原始教义，抵制其现代演变形态。换言之，原教旨索雷尔主义者试图保留索雷尔早年对阶级冲突与社会民主主义软弱性的激烈批判，却彻底舍弃了他在二十世纪初迅速接受的极端民族主义成分，例如莫拉斯主义的整合民族主义与狂热的反犹思潮。"
 syn_spiritualism_subtype:0 "灵性论"
 syn_spiritualism_subtype_desc:0 "§Y灵性论§!\n\n£GFX_ideology_spiritualism_bar\n\n\n\n\n灵性论及其分支通灵论原是一套社会宗教理论，后衍变为了一种意识形态。灵性论认为意识在个体死亡后依旧会留存于世，并可以同生者进行沟通交流，而承载这一切的概念即为灵界——会随着栖身其中的灵体的意识变化而变化的与物质世界相平行的动态位面。欧洲、北美的埃马努埃尔·斯韦登堡、弗朗茨·梅斯梅尔、福克斯姐妹、帕斯卡尔·伦道夫、科拉·斯科特等人所推崇的传统灵性论并不相信灵魂的轮回转世的说法，而盛行于亚洲、巴西与广大拉丁世界的通灵论分支却格外看重这一点，分支的创始人“亚兰·卡甸”伊波利特·里瓦伊与其遍布全球的信徒群体如高台教、乌班达教等都是其坚定支持者。虽然相互之间存在着细微的差异，但灵性论运动的各种派别都旗帜鲜明地反对神秘学与秘传知识，并寻求建立所有人都能平等地学习灵体真谛的公开平台。此外，灵性论者们还支持与神导进化相绑定的至善至明的上帝或类似的全能存在、精神后成、神权融合体制等概念，并在不断对抗环绕组织的外界疑云的同时，积极利用这些独特的思想观、美学观来推动社会与艺术的变革。灵性论者会使用灵媒、通磁术、催眠术、迷幻术、降神术、通灵术、非法物质等来与灵界进行沟通，获取启迪，实现精神飞跃，以触及天堂的彼岸，同时，他们也会围绕精神升华式共和主义创立政治运动，在此一位面兢兢业业地完成凡世的工作，建设理想的乌托邦。"
 laskian_syndicalism_subtype:0 "拉斯基工团主义"
 laskian_syndicalism_subtype_desc:0 "§Y拉斯基工团主义§!\n\n£GFX_ideology_laskian_syndicalism_bar\n\n\n\n\n拉斯基工团主义，也称拉斯基主义或拉斯基思想，是一种以工团主义为基础、由学者兼政治家哈罗德·拉斯基提出的意识形态。虽然其经济主张，包括产业公有、妇女选举权与彻底终结资本主义在内，与正统工团主义的主张高度一致，因此常被误认为只是工团主义的温和分支，但它其实融合了一系列看似矛盾的社会与政治信念，从而自成一家。最鲜明的特点之一，是拉斯基将其自身犹太背景所支持的锡安主义，与强烈的反天主教立场相结合。他曾公开抨击天主教会是“一切高尚事物的永恒敌人”。这种反天主教态度，加之他坚决捍卫结社自由，主张国家应允许公民在工会之外保有对地方组织、社会团体等的多元忠诚，引发了诸多争议。作家埃里克·布莱尔便是尖锐的批评者之一，指责拉斯基在维护个人自由的同时，又支持某些压制自由的政策，令人质疑其真正的忠诚所在。拉斯基工团主义一方面坚持，当政府拒绝响应民众对社会主义的呼声时，暴力革命是必要的；另一方面，又宣称坚定拥护民主程序、原则与公民自由。这种内在的矛盾使其在各界评价两极。而由于拉斯基在任教期间培养了许多后来成为政界要员的学生，他的思想至今仍持续引发关注与争论。"
 authdem_absolute_monarchy_subtype:0 "绝对君主制"
 authdem_absolute_monarchy_subtype_desc:0 "§Y绝对君主制§!\n\n£GFX_ideology_absolute_monarchy_bar\n\n\n\n\n绝对君主制是指一个国家的君主拥有完全的专制权力的政权。在这种制度下，君主不受议会民主制或国家法律和政府的限制，在领导国家方面发挥着积极的作用，而不是像大多数议会制君主国家那样被降格为单纯的国家象征。绝对君主制在西方并不像以前那样普遍，近代以来，大多数西方君主都成了象征，但君权完全控制国家这种事在西方也不是没有发生过。"
 natpop_manhem_nordicism_subtype_swap_tt:0 "我们将转向§F$manhem_nordicism_subtype$§!"
 manhem_nordicism_subtype:0 "曼赫姆北欧主义"
 manhem_nordicism_subtype_desc:0 "§Y曼赫姆北欧主义§!\n\n£GFX_ideology_manhem_nordicism_bar\n\n\n\n\n曼赫姆北欧主义是北欧主义理论的深化发展产物，其核心理念在于拯救、保存、提升、启迪北欧种族，使之与古老的血统重新建立联系。那些被曼赫姆传播的真理所唤醒的人相信，《旧约》是犹太人的阴谋，耶稣实际上是雅利安人，而北欧神话中的全能之神奥丁与基督教中的上帝本是一体；圣灵虽属于三位一体，实则是每个血统纯正者血与土中所蕴含的亚特兰蒂斯-耶阿特灵，唯有遵循“血之声”才能被唤醒。根据曼赫姆联盟的成员所述，亚特兰蒂斯、奥林匹斯山与古希腊众神皆被置于极北之地，斯堪的纳维亚则被视为白种人的原始家园，即所谓的“许珀尔玻瑞亚圣地”。曼赫姆北欧主义者本质上是带有反犹情绪的种族优越论者，他们宣称世界上存在三个种族：白种人、黄种人和黑种人，并认定只有白种人能够“创造文化”，因而天然优越。它既与北欧的极右翼势力紧密相连，也与斯堪的纳维亚某些极权主义思想家暗中呼应；其纲领以白种人为核心，主张推行种族净化、实施精神总动员、回归田园生活，以此确保种族的千年延续。"
 marlib_aulic_liberalism_subtype_swap_tt:0 "我们将转向§m$aulic_liberalism_subtype$§!"
 aulic_liberalism_subtype:0 "宫廷自由主义"
 aulic_liberalism_subtype_desc:0 "§Y宫廷自由主义§!\n\n£GFX_ideology_aulic_liberalism_bar\n\n\n\n\n宫廷自由主义是奥地利思想家埃里克·冯·屈内尔特-莱丁所构建的理论框架，他自称“保守的极端自由派通才与贵族”。这一思想诞生于对法国、英国及俄罗斯工团主义与共产主义革命浪潮的震撼之中。屈内尔特-莱丁本可投身自由保守派阵营，像许多政客那样呼吁以主动手段对抗新兴激进意识形态，但这位自由骑士却将其观点深化发展到了全球大多数自由派难以企及的极端。他的思考深受多瑙河君主制模式的影响：在坚决反对国际或民族框架中的工团主义的同时，他也将民主国家视为敌人。在他眼中，民主乃自由之敌，多样性天然与个性对立；多数人的暴政终将导向平等主义式的独裁，民族身份逐渐消磨，最终只余同质化的虚无。与法国政治史学家阿列克西·德·托克维尔不谋而合，这位极端自由派视法国大革命为点燃反自由力量的历史转折点。作为回应，他提出君主制才是灵丹妙药，声称君主能超越党派之争，比民主制度更自由，也更能应对日益复杂的社会。宫廷自由主义者认为，大众将愈发无力应对日趋精密的社会架构，“已知的解决手段”与“应知的解决之道”之间的鸿沟只会不断扩大。在他看来，一个天主教王国，或如美国建国先贤所创、秉承基督教精神的瑞士式及美式共和国，远比自由民主政体更能守护家庭、私有财产与人民自由。屈内尔特-莱丁强调：自由并不取决于掌权者是否经由选举产生，而取决于权力行使的方式。最后，这位极端自由主义者坚决主张以虔诚、联邦与精英治理的形式重建神圣罗马帝国，进而以此庇佑组成这个新生帝国的各民族与人民。"
 radsoc_radsoc_christian_syndicalism_subtype_swap_tt:0 "我们将转向§N$radsoc_christian_syndicalism_subtype$§!"
 radsoc_christian_syndicalism_subtype:0 "基督教工团主义"
 radsoc_christian_syndicalism_subtype_desc:0 "§Y基督教工团主义§!\n\n£GFX_ideology_christsyn_bar\n\n\n\n\n基督教城乡劳动者的工会化运动绝非新鲜事物，那些为抗衡世俗主义与无神论社会主义浪潮而组建的教派工会，其历史甚至可能早于主流左翼意识形态的诞生。若非国际主义革命的冲击，这本应是世界运行的常态。战后剧烈的政治洗牌，不仅催生了基督教工团主义运动，更壮大了既有组织的声势。以法国的法兰西基督教劳工联合会为例，他们仅以保守派姿态参与新成立的公社联盟，与工人国际法国支部等温和派结盟；而像富尔维奥·米拉尼领导的全国佃农与小农联合会则主张，真正的基督教工团主义应当同时保护贫农与小土地所有者——唯有扬弃阶级斗争理论，方能实现真正的劳动平等。最激进的如多萝西·戴领导的天主教工人运动，更宣称美国痼疾的解药在于工会旗帜下自由社会主义与无政府主义的合流。基督教工团主义虽非新近发明，却不得不在这虔信者与解放者兼毁灭者的无神论近亲共舞的时代谨慎前行。基督虔诚工人们的最终归宿，非人力所能揣度，唯有天父知晓。"
 socdem_milazzismo_subtype_swap_tt:0 "我们将转向§M$milazzismo_subtype$§!"
 milazzismo_subtype:0 "米拉佐主义"
 milazzismo_subtype_desc:0 "§Y米拉佐主义§!\n\n£GFX_ideology_milazzismo_bar\n\n\n\n\n在意大利政坛中，西西里政治家西尔维奥·米拉佐及其创立的西西里社会基督教同盟及其联合阵线，显得格外引人注目。米拉佐因不满同属天民党的同僚日益向本土派势力低头，感到“被背叛”而奋起反击。他所宣扬的米拉佐主义汇聚了左右两派的激进分子与社会边缘人：失意的社会主义者与共产主义者、残留的军团主义者、保守保王派，甚至失望的基督教民主派，共同致力于瓦解中间派，推翻被那不勒斯、罗马、都灵和米兰的意志与专断所主宰的现有政权。在政治生态上，该运动最接近“温和天主教左翼”路线，但这匹自称“纯正西西里血统骏马”的旗帜，却屡遭多家媒体与政敌指责，他们指控米拉佐明里暗里勾结黑手党，意图以“红色”的恩庇体系将西西里拖入动荡的暴乱深渊。然而，此类指控总被社会基督教同盟领袖及其盟友们轻易驳斥。他们一再声明，自己的使命始终如一：坚守真正反工团主义的天主教立场，不达目标绝不罢休。只要西西里人一日未能摆脱“本土疯子伸来的长臂”，米拉佐主义者便会继续高呼：“西西里属于西西里人！本土老爷，滚出去！”"
 authdem_authdem_merc_subtype_swap_tt:0 "我们将转向§g$authdem_merc_subtype$§!"
 authdem_merc_subtype:0 "无国界之军"
 authdem_merc_subtype_desc:0 "§Y无国界之军§!\n\n£GFX_ideology_merc_bar\n\n\n\n\n“无国界之军”和自洽的意识形态毫无关系，单单是指一些国际佣兵组织的现实运作，这些佣兵组织或靠着手眼通天，或靠着阴谋诡计，或靠着时来巧运，拿下了一个前主权国家或其部分土地，在其上建立了自己的封地，并通过行动网络、烧杀抢掠、军事合约等方式，或凭硬实力，或凭尔虞我诈，准备一登世界舞台施展拳脚。这些佣兵组织大多与意识形态无缘，仅仅是凭借着对激情的渴望或是金钱的回报行事，但也有人青睐于极右翼的部分理论，支持自由企业、自由化资本、全民皆兵等政策，某些组织甚至宣扬科学种族主义、种族隔离、优生学、沙文式新殖民主义等思想。佣兵国家权力通常都高度分散，只由唯一的家长式最高权威来维系整体，反国家主义和专制独裁可以同时存在于这一奇特的混合体制中 ，只要不违反最上头老大哥的命令，国民和佣兵都可以随心所欲地做任何事。佣兵组织相互之间虽然可能会存在着一些或大或小的差异，但其都重视金钱报酬胜过意识形态，毕竟对于刀尖上舔血的佣兵来说，当一天结束时，没有什么比拿在手里的一叠厚厚钞票更为实在了。"
 soccon_soccon_theocracy_subtype_swap_tt:0 "我们将转向§c$soccon_theocracy_subtype$§!"
 soccon_theocracy_subtype:0 "神权制"
 soccon_theocracy_subtype_desc:0 "§Y神权制§!\n\n£GFX_ideology_theocracy_bar\n\n\n\n\n各宗教信仰的神权政体都有着同一个特点：由信仰该教的“个体”来掌控国家，而这个所谓的个体可以是自称诸神在凡间的代行人的独一领袖，也可以是熟谙某一文化的精神习俗的一群长者。神权制政体的运作方式取决于具体的宗教，因而相互之间往往差异巨大。无论是乐善好施的社群主义牧师，还是富裕奢靡的神父，亦或是介于两者之间的各式人物，都存在于神权制政府的大伞下。"
 tot_tot_kritarchy_subtype_swap_tt:0 "我们将转向§V$tot_kritarchy_subtype$§!"
 tot_kritarchy_subtype:0 "判官统治"
 tot_kritarchy_subtype_desc:0 "§Y判官统治§!\n\n£GFX_ideology_kritarchy_bar\n\n\n\n\n判官统治指的是因集权化的法律机构或者分权式的文化传统而起的法官、司法治国体系。历史上的判官统治同古代以色列的摩西政权密不可分，根据圣经记载，在扫罗建立王权之前，以色列一直由士师主导。不过除以色列之外，世界各地也有着各式判官统治的例子，例如公元前五世纪至公元五世纪布雷洪法时期爱尔兰的德鲁伊判官以及后续一直延伸到十三世纪的封建法官、九世纪至十三世纪冰岛自由邦的由前哥特祭司担任的世俗述法角色、十世纪至十四世纪撒丁岛上的审判官、十六世纪弗里西亚自由邦末期短命的判官统治。不过，判官统治并不是仅存在于中世纪之前的过时旧物，在当代的欧洲之外也存在着数个判官体系，索马里部族的习惯法、阿富汗社会的支尔格，以及部分学者眼中1803年美国联邦最高法院的马伯里诉麦迪逊一案让最高法院脱离了控制、逐步滑向司法统治就是例证。虽然一些边缘自由意志主义者、无政府主义研究者称判官统治是种原始的反国家主义形态，但具体到实践上，判官统治又千差万别、争议万千，部分相关的例子也在不断地经受着学者们的质疑与争论。无论如何，即使政府形态迥异，判官统治也总有着一些共同点，即对于司法与法治的坚持。"
 tot_vorticism_subtype_swap_tt:0 "我们将转向§V$vorticism_subtype$§!"
 vorticism_subtype:0 "漩涡主义"
 vorticism_subtype_desc:0 "§Y漩涡主义§!\n\n£GFX_ideology_vorticism_bar\n\n\n\n\n1914年，思想家兼创始人温德姆·刘易斯发起了一场现代主义艺术运动，自此之后，漩涡主义逐渐发展为现代不列颠联盟中最具抽象色彩的意识形态之一。其基础主要源于马里内蒂的未来主义并受其影响（漩涡主义的政治层面后来对此予以排斥），漩涡主义从纯粹的艺术愿景发展为政治表现形态，令许多人惊讶不已。漩涡主义者全然拒斥一切形式的资本主义自由民主制，认为这种制度利用“小人物”概念来控制和维持其权力，他们声称，这种所谓的公平代表统治，不过是利用教育、媒体、艺术和文学进行颠覆性操控，以界定和控制民众需求与欲望的方式。刘易斯指出，“小人物”正是这种无休止腐败的牺牲品，其结果是个人变得既被动又顺从，在此过程中，为统治阶级维持了功能民主的幻象。相反，刘易斯勾勒了一种知识自由型政府：统治者无需任何伪装或欺骗来掩盖其权力地位——统治者反而应被民众迫使，通过暴力和威权手段不断展现其领导地位。由于漩涡主义首要关注的是知识分子的自由，建立一个摆脱资本主义竞争枷锁、消除被奴役的“小人物”的分权化社会，一直是该运动的核心概念和统一因素。这种社会为被统治者提供了一种受蒲鲁东影响的分权化组织形式，同时为统治者保留了不可避免的权威运用与行使，这对那些渴望社会自由与高度威权政府相结合的准则派颇具吸引力。此种负责任但威权的领导统治，将为真正的解放创造条件，使艺术家、知识分子和个人不再受资本主义腐化影响而遭奴役，反而能够创作作品、追求激情，无论其作品具有怎样的经济潜力。"
