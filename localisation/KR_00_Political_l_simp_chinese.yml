 socdem_christian_anarchism_subtype:0 "基督教无政府主义"
 socdem_christian_anarchism_subtype_desc:0 "§Y基督教无政府主义§!\n\n£GFX_ideology_christ_anarchism_bar\n\n\n\n\n基督教无政府主义属于无政府主义的分支，其认为无政府主义的原则本身就蕴含在了基督教以及四福音书之中，部分激进派甚至四处宣扬耶稣基督本人就是无政府主义的始祖。基督教无政府主义这一左翼流派认定，世上仅存在唯一一个基督徒需要遵从的权威，即上帝本身及其通过耶稣基督所展现出的教义，世俗的一切权威，如国家，都同道德、信仰与公义相悖，这些人为的权威无不充斥着暴力、欺骗、不公和偶像崇拜。在基督教无政府主义看来，人与神之间关系的正确表述只能是“上主之国”这一概念，亦即平等人本主义的基督教社会教义所支撑的虔诚无国家社会，其间的人与人关系可以概括为横向组织、普世同情以及仆从式领导，而非大多数基督教无政府主义者看来具有威权、等级性质的传统压迫性有组织宗教结构。此外，基督教无政府主义者虽具有革命性，但其多为和平主义者，排斥战争、军国主义和暴力，虽深受列夫·托尔斯泰的《神的国就在你们心里》与圣经中的登山宝训提到的八福的影响，但在经济理念以及对于工业城市主义、工团主义还是农业农村主义、无政府民主之间的选择方面，不同人的看法也截然不同。总而言之，基督教无政府主义只相信唯一的上帝、唯一的天国之主，反对世俗或人造的一切权威、等级制度、不平等和国家主义，其最终目的是在上帝的指引下建设一个平等、自由的公社主义社会。现今最为出名的基督教无政府主义运动当属美国社会活动家多萝西·戴的天主教工人运动和泽诺·萨尔蒂尼神父在教宗国内创立的兄弟会运动。"
