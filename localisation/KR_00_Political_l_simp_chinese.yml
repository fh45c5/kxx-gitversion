 pataut_paneuropeanism_subtype:0 "凯勒奇泛欧主义"
 pataut_paneuropeanism_subtype_desc:0 "§Y凯勒奇泛欧主义§!\n\n£GFX_ideology_paneuropeanism_bar\n\n\n\n\n这一由里夏德·冯·库登霍韦-凯勒奇提出，融合了自由主义理念的泛欧主义分支希望通过自由主义、进步主义和现代化的繁荣与平等观念，来建立欧洲多种族间的文化联盟。自豪、坚忍的欧洲贵族精神，及其丰富多样的历史是这种理念的一大支柱。尝试融合现代自由思想与传统过往绝非易事，但在温和资本主义、平等主义和宗教虔诚的支持下，凯勒奇思想也许正是通往泛欧罗巴繁荣的康庄大道。"
 natpop_austropopulism_subtype:0 "奥地利民粹主义"
 natpop_austropopulism_subtype_desc:0 "§Y奥地利民粹主义§!\n\n£GFX_ideology_austropopulism_bar\n\n\n\n\n所谓的奥地利民粹主义，原本实际上只是基督教民主主义在维也纳的一个小众分支，但在与恩格尔伯特·陶尔斐斯独特的法团主义民主治理观融合之后，势头更甚于前。当民主不再成为桎梏，奥地利民粹主义的真容方得显现，其以十字架为象征，以《四十年》通谕为纲领，紧抓着律法的长卷，隐藏其下的利益集团控制着大多数工人，摆弄着他们。不过，独特的是，奥地利民粹主义特别重视农民——将其视为国家的捍卫者。\n\n奥地利民粹主义具有强烈的国家主义倾向，因此并不会认为有谁更加值得平等——在最理想的情况下，它所架构的国家将摒弃党派主义，人民不需要顾虑自己的外表或出身，一切由对上帝的付出和他们的人格品质所决定。"
