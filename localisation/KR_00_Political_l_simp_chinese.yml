 syn_police_state_subtype:0 "警察国家"
 syn_police_state_subtype_desc:0 "§Y警察国家§!\n\n£GFX_ideology_police_state_bar\n\n\n\n\n从戒严令和宵禁到严厉镇压和合法专制，尽管形式多种多样，但警察国家的主要支柱总是一成不变。警察国家可能是政治性的或非政治性的，专业性的或非专业性的，腐败的或仁慈的，形成的根源与所处的条件不同，具体情况也会千差万别。尽管这种意识形态的表现多种多样，但其出发点都在于防止社会不受约束，陷入混乱。警察国家与军政府类似，但通常不会那么军国主义和帝国主义，而是把给人民带来秩序视为高于一切其他追求，往往在法律条文的支持下，他们可以正当合法地实现自己的追求。"
 socdem_eco_socialism_subtype:0 "生态社会主义"
 socdem_eco_socialism_subtype_desc:0 "§Y生态社会主义§!\n\n£GFX_ideology_ecosocialism_bar\n\n\n\n\n生态环境保护社会主义，或简称为生态社会主义和绿色社会主义，与为了造福人类而经常把注意力放在农业或工业的进步创新上，而不考虑自然环境保护的常规正统社会主义截然相反，生态社会主义者和他们的追随者，如生态无政府主义者、生态工团主义者，甚至边疆社会主义者，在努力实现他们所期望的社会主义理想的同时，还会注重于实现保护自然伊甸园（即地球及其生物圈）的自我使命。然而，正如社会主义和更广泛的左翼思想一样，生态社会主义也可以是多种多样的，主要的区别就在于他们进行这场绿色革命的方式。"
