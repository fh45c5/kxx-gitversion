 radsoc_pan_asianism_subtype:0 "泛亚主义"
 radsoc_pan_asianism_subtype_desc:0 "§Y泛亚主义§!\n\n泛亚主义，也被称为亚细亚主义或大亚洲主义，是一种包含着各类不同思想的意识形态大类，其共通的最终目标是实现全亚洲人民之间经济或政治上的全面统一。泛亚主义的思想各不相同，包括从北一辉和大川周明的日本泛亚主义到孙中山的中国泛亚主义，但他们都一致希望全亚洲之间进行合作，并在面对西方或其他潜在对手时确保亚洲自身的利益。泛亚主义通常还致力于构建一种新型泛亚文化，这一文化多以佛教等东方思想体系为根基，或融合自由主义、君主制、社会主义、民族主义等无神思想。泛亚主义虽已席卷东南亚、印度尼西亚等地，但在实践中仍是特重于某些民族，亦即日本三国思想中本州、天竺、唐土所对应的日本、印度和中国。"
 authdem_centrist_subtype:0 "中间主义"
 authdem_centrist_subtype_desc:0 "§Y中间主义§!\n\n民主中间主义描述了一种专注于维持既定现状的政治观点。尽管各国情况各不相同，但中间派仍然团结在同一个中间地带，在各自的社会中寻求平等和等级制度之间的平衡。保守派和极端派都痛恨中间派，他们视其为骑墙派，但中间派毫不动摇地团结在已被证明行之可能的现状周围，既抵制激进改革，又排斥强硬的传统主义，就像他们为更大的利益而谋求在争吵的其他政党间充当妥协的媒介一样，因为中间派视稳定与平稳过渡胜于一切。"
 diemism_subtype_swap_tt:0 "我们将转向§X$diemism_subtype$§!"
 diemism_subtype:0 "基督教人为主义"
 diemism_subtype_desc:0 "§Y基督教人为主义§!\n\n越南人为主义基督教法团主义，也称为基督教人为主义，或简称为吴廷琰主义，这种独特的政治思想尝试将越南民族主义、反社会主义和基督教信仰融入法团主义之中。吴廷琰主义深受埃马纽埃尔·穆尼耶的人格尊严论第三位置理念启发，并融入了人格主义、反唯物的灵性论和社群主义这“三大理论”，这种意识形态强调社群和大众的福祉，认为理想社群的基础是强大的家庭、社会和国家，以及人性意识和对自然及精神世界的尊重。吴廷琰主义强烈反对唯物主义、资本主义、工团主义和消费主义，它一心要开辟一条通往繁荣、良善、自豪的人格主义越南的新道路。"
