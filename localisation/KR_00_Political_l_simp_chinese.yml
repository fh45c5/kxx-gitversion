 richytskyi_thought_subtype:0 "列奇茨基思想"
 richytskyi_thought_subtype_desc:0 "§Y列奇茨基思想§!\n\n£GFX_ideology_ukapist_bar\n\n\n\n\n列奇茨基思想，或列奇茨基主义是由乌克兰共产主义者安德烈·列奇茨基创造并理论化的一种意识形态。列奇茨基相信第三国际绝对不可能全心致力于解决殖民问题，因此自己试图建立一个反殖民体系，将重心放在“第三世界国家”反对殖民主义的斗争上。列奇茨基主义借鉴了马克思主义的理论和列宁主义俄罗斯的经验，旨在建立一个帮助全世界工人群众摆脱剥削压迫的工农国家。"
 radsoc_national_communism_subtype:0 "民族共产主义"
 radsoc_national_communism_subtype_desc:0 "§Y民族共产主义§!\n\n£GFX_ideology_natcom_bar\n\n\n\n\n虽然民族共产主义的反对者有时会故意将其与狂热的民族主义混为一谈，但若对这一意识形态进行最直截了当的描述，那便是因地制宜地实践马克思共产主义或其它形式的社会主义。民族共产主义的支持者反对完全无国家的国际主义观点，并转而研究起了“民族问题”，思考着要如何把这一意识形态同维护、振兴本土文化的某些特定方向相结合。民族共产主义起源于布尔什维克运动中的少数民族活动家，如乌克兰的瓦西里·沙赫赖、鞑靼斯坦的米尔赛义德·索尔坦加利耶夫、克里米亚的伊斯梅尔·菲尔代夫斯，他们对帝俄时代普遍存在着的文化沙文主义政策竟能延续至今感到失望透顶。在俄共之外，也存在着将民族利益同共产主义联系在一起的声音，其中名气最大的当属亚历山大·舒姆斯基的斗士派。民族共产主义者在高举马克思火炬的同时，也指出马克思所言的“工人没有祖国”中的“祖国”指的是等同于剥削机器的全球化资产阶级国家，因而应与新的社会主义核心力量合作，推行或完全独立或广泛民族自治的政策。真正的社会主义涉及地方传统的方方面面，因此如果“被殖民者”无法打破宗主的束缚，那社会主义便无从谈起。虽然在许多共产主义者看来，每一名民族共产主义者都有着某种“民族偏护”，而且确实存在一些民族共产主义团体特别看重“民族”的那一部分，但总的来说，民族共产主义本身的目标中并不包含通常意义上的民族主义。令传统的民族共产主义者大为不解的是，那些以提出了“民族布尔什维主义”的德国共产主义者海因里希·劳芬贝格为代表的、与国内的民族主义、沙文主义者同流合污的“社会反动派”马克思主义思想家竟也被称为民族共产主义者。"
 pataut_clientelism_subtype:0 "庇护主义"
 pataut_clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 ukrainian_nationalism_subtype:0 "乌克兰民族主义"
 ukrainian_nationalism_subtype_desc:0 "§Y乌克兰民族主义§!\n\n£GFX_ideology_ukrainian_nationalism_bar\n\n\n\n\n乌克兰民族主义是一种多样的意识形态，包括一系列不同的原则和目标。乌克兰民族主义的核心是寻求实现民族解放，建立一个独立的主权乌克兰。它强调保护和宣扬乌克兰民族和文化认知，承认乌克兰人民拥有独特的特质、语言、历史和传统。而在乌克兰民族主义内部，存在着不同的意识形态潮流。积极民族主义受到德米特罗·东佐夫等思想家的影响，强调国家的有机统一，鼓吹传统价值观、精神以及国家优先，将其视作社会和政治组织的中心。乌克兰民族主义经常通过草根运动、宣传运动和诉诸暴力或武装斗争来推动革命行动，旨在挑战现有的权力结构并带来社会变革。在几个世纪以来各帝国主义势力对乌克兰人的压迫造成的反动下，乌克兰民族主义者在争取建立一个所有乌克兰团结一致，捍卫国家的主权乌克兰的斗争之中表现得非常激进。\n\n虽然乌克兰民族主义包含了各种各样的思想和路线，但它有一个共同的主旨，那就是实现乌克兰民族的解放、存续和自决。它是一股充满活力，不断发展的力量，在塑造乌克兰的历史、政治和文化方面发挥了重要作用。"
 radsoc_austromarxism_subtype:0 "奥地利马克思主义"
 radsoc_austromarxism_subtype_desc:0 "§Y奥地利马克思主义§!\n\n£GFX_ideology_austromarxism_bar\n\n\n\n\n在卡尔·伦纳、奥托·鲍威尔、维克托·阿德勒等奥地利社会主义巨头的推动下而诞生，奥地利马克思主义描述了在整个奥地利流行的，马克思主义那带有强烈民族主义的独特奥地利变体。奥地利马克思主义与标准的社会民主主义不同，试图在哈布斯堡多民族帝国的大背景下调和民族主义与社会主义的关系。奥地利马克思主义试图将革命社会主义和社会民主主义融合为一个统一的理想，认为通过实现帝国各少数民族的民族自治，可以更容易地传播阶级意识和社会主义信仰。"
 tot_leftcraftism_subtype:0 "左翼洛夫克拉夫特主义"
 tot_leftcraftism_subtype_desc:0 "§Y左翼洛夫克拉夫特主义§!\n\n£GFX_ideology_left_lovecraft_bar\n\n\n\n\n左翼洛夫克拉夫特主义，或称进步洛夫克拉夫特思想、左翼宇宙冷漠主义、社会主义洛夫克拉夫特主义，这种意识形态是美国作家霍华德·菲利普·洛夫克拉夫特及其追随者的共同思想。在放弃原初思想中的亲英姿态后，新洛夫克拉夫特思想转而强调文化重于种族，尝试为全人类建立普世的宇宙认同，以融合、凸显各文化最好的一面。通过这种文化整合，左翼洛夫克拉夫特主义将洛夫克拉夫特宇宙冷漠主义神话中的密教色彩和左翼民粹主义、福利经济、社群主义、技官主义、反民主原则融合起来，并以绝对的姿态反对妥协，以实现完美的进步改革，而又不会爆发革命。左翼洛夫克拉夫特主义是由怪异之人创造出的怪异意识形态，它很难被清晰定义，正如其神秘莫测的创造者那般难以理解。"
 leftcraftism_subtype:0 "左翼洛夫克拉夫特主义"
 leftcraftism_subtype_desc:0 "§Y左翼洛夫克拉夫特主义§!\n\n£GFX_ideology_left_lovecraft_bar\n\n\n\n\n左翼洛夫克拉夫特主义，或称进步洛夫克拉夫特思想、左翼宇宙冷漠主义、社会主义洛夫克拉夫特主义，这种意识形态是美国作家霍华德·菲利普·洛夫克拉夫特及其追随者的共同思想。在放弃原初思想中的亲英姿态后，新洛夫克拉夫特思想转而强调文化重于种族，尝试为全人类建立普世的宇宙认同，以融合、凸显各文化最好的一面。通过这种文化整合，左翼洛夫克拉夫特主义将洛夫克拉夫特宇宙冷漠主义神话中的密教色彩和左翼民粹主义、福利经济、社群主义、技官主义、反民主原则融合起来，并以绝对的姿态反对妥协，以实现完美的进步改革，而又不会爆发革命。左翼洛夫克拉夫特主义是由怪异之人创造出的怪异意识形态，它很难被清晰定义，正如其神秘莫测的创造者那般难以理解。"
 washingtonism_subtype:0 "华盛顿家长制"
 washingtonism_subtype_desc:0 "§Y华盛顿家长制§!\n\n£GFX_ideology_washingtonism_bar\n\n\n\n\n华盛顿家长制，有时也被心存怀疑的讥讽者称为华盛顿主义、华盛顿美国主义，甚至“美国自己的公民宗教”。它描述了围绕着乔治·华盛顿将军的形象和思想而诞生的美利坚军国主义和威权主义的一种世俗化形式。华盛顿主义者着迷于美国最伟大的开国元勋，寻求创造一个能真正按照国父构想的美国梦来生活的社会——昭昭天命的扩张主义、公民民族主义、基督教道德、爱国主义、强势军国主义、反激进主义、杰斐逊资本主义，以及由家长式统治的军队操纵的威权共和民主，一切都是为了造福每一位美国人。在忠诚的军队、狂热的爱国者和日益增长的华盛顿个人崇拜的支持下，这些开国元勋梦想的先驱将为自由人的国度和勇敢者的家园带来秩序和荣耀。"
 austropopulism_subtype:0 "奥地利民粹主义"
 austropopulism_subtype_desc:0 "§Y奥地利民粹主义§!\n\n£GFX_ideology_austropopulism_bar\n\n\n\n\n所谓的奥地利民粹主义，原本实际上只是基督教民主主义在维也纳的一个小众分支，但在与恩格尔伯特·陶尔斐斯独特的法团主义民主治理观融合之后，势头更甚于前。在不再受到民主阻碍的情况下，奥地利民粹主义真正地诞生了，其以十字架为象征，以四十年通谕为纲领，紧抓着律法的长卷，隐藏其下的利益集团控制着大多数工人，摆弄着他们。不过，独特的是，奥地利民粹主义特别重视农民——将其视为国家的捍卫者。\n\n奥地利民粹主义具有强烈的国家主义倾向，因此并不会认为有谁更加值得平等——在最理想的情况下，它所架构的国家将摒弃党派主义，人民不需要顾虑自己的外表或出身，一切由对上帝的付出和他们的人格品质所决定。"
 pataut_washingtonism_subtype:0 "华盛顿家长制"
 pataut_washingtonism_subtype_desc:0 "§Y华盛顿家长制§!\n\n£GFX_ideology_washingtonism_bar\n\n\n\n\n华盛顿家长制，有时也被心存怀疑的讥讽者称为华盛顿主义、华盛顿美国主义，甚至“美国自己的公民宗教”。它描述了围绕着乔治·华盛顿将军的形象和思想而诞生的美利坚军国主义和威权主义的一种世俗化形式。华盛顿主义者着迷于美国最伟大的开国元勋，寻求创造一个能真正按照国父构想的美国梦来生活的社会——昭昭天命的扩张主义、公民民族主义、基督教道德、爱国主义、强势军国主义、反激进主义、杰斐逊资本主义，以及由家长式统治的军队操纵的威权共和民主，一切都是为了造福每一位美国人。在忠诚的军队、狂热的爱国者和日益增长的华盛顿个人崇拜的支持下，这些开国元勋梦想的先驱将为自由人的国度和勇敢者的家园带来秩序和荣耀。"
 right_technocracy_subtype:0 "右翼技官主义"
 right_technocracy_subtype_desc:0 "§Y右翼技官主义§!\n\n£GFX_ideology_righttechnocrat_bar\n\n\n\n\n技官主义是一种政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。尽管技术官僚思想在不同的意识形态中颇为常见，而且很容易向右翼靠拢，技官主义仍算是一种模糊的左翼意识形态：它倡导“能源核算”，试图推动社会文化全面加速并向一种全新、高效、理性发展的思维方式转变，同时还渴望创造一个摆脱了两党民主政治和派系主义的政治体制来寻求支持。右翼技官主义认为资本主义和法团主义无法避免浪费，正如传统社会主义和民粹主义模式无法避免低效，并试图突破这两种模式，将人类引向一个开明的灰色乌托邦。"
 narodism_subtype:0 "民粹主义"
 narodism_subtype_desc:0 "§Y民粹主义§!\n\n£GFX_ideology_narodism_bar\n\n\n\n\n民粹主义是一种发源并传播于前俄罗斯帝国的领土上的农业社会主义思想。它受到了亚历山大·赫尔岑和尼古拉·切尔尼舍夫斯基作品的影响，且基于一种通过广泛的公民组织、工会主义和公社主义来实现其独特社会主义道路的思想。它重视农民，视其为社会的基础，并寻求解放农民，废除地主制度，和引入独立于地方当局的农民社区自治制度。自19世纪以来，“新民粹主义”不断演变，现在以“土地社会主义化”和“地方苏维埃”的理念而闻名。虽然其范畴囊括无政府工团主义到自由民主主义，但在东欧广袤的土地上，民粹主义一直是一支一枝独秀的社会主义势力。"
 crnogoroslavlje_subtype:0 "黑山斯拉夫主义"
 crnogoroslavlje_subtype_desc:0 "§Y黑山斯拉夫主义§!\n\n£GFX_ideology_crnogoroslavlje_bar\n\n\n\n\n黑山斯拉夫主义也称为黑山主义，是塞库拉·德尔列维奇和萨维奇·马尔科维奇·什泰迪姆利贾的杰作。黑山斯拉夫主义的支持者多为虔诚的东正教徒、民族主义者，他们认为黑山未受瓦拉几人和土耳其人的染指，是塞族人的真正家园。对黑山斯拉夫主义的狂热支持者来说，黑山人源自古伊利里亚，源自红克罗地亚（今克罗地亚西部）的土地。黑山斯拉夫主义曾经仅是简简单单的一种民族主义，但由于尼科希奇条约的签署，它获得了独特的意味。多瑙联邦主义和雅利安秘学已经渗透进了黑山主义的思想中，它的信徒如今自诩为虔诚的东正教黑山民族的士兵，随时准备夺回一直属于他们的东西，恢复黑山的昔日荣耀。"
 hardliner_bolshevism_subtype:0 "强硬布尔什维主义"
 hardliner_bolshevism_subtype_desc:0 "§Y强硬布尔什维主义§!\n\n£GFX_ideology_hardline_bolshevik_bar\n\n\n\n\n布尔什维主义在俄国的失败，以及工团主义在西方国家的胜利，致使共产主义运动陷入了分崩离析之中，许多昔日忠于布尔什维主义的革命者只得被迫适应新的现实。当一部分人转投工团主义时，另一些人则寻求贯彻更为激进、更强调纪律的解决方案。强硬布尔什维主义便在这种意识形态的萎靡不振中诞生了。强硬布尔什维主义常被用来形容坚持以下结论的人：布尔什维克革命之所以失败，不是因其意识形态有何痼疾，而是因其未能保卫社会主义国家，未能在党和人民之中巩固意识形态信仰。维亚切斯拉夫·莫洛托夫和维克托·威尔科克斯等人是这一论点的主要支持者，他们主张超越传统的列宁主义原则，以强而有力的专制措施保卫革命，如国家军事化、国家主导的恐怖、指令性经济、与国家而非民族紧密相连的公民社会爱国主义。除此之外，最引人注目的也许是他们对一切反马列“修正主义”的猛烈批判，他们认定一切持不同意见的社会主义者不过是“假冒伪劣”、“资产阶级代理人”，妄图颠覆马克思与列宁的理论。他们宣称，自己的一切努力不过是为了保证革命能永存于世。颇为讽刺的是，一些人反倒因此怀疑起他们对社会主义有几分真心实意，继而给他们贴上“波拿巴主义者”、“红色极权主义者”等标签。但这些诋毁之声丝毫无法动摇列宁主义自豪的追随者。对他们来说，没有什么比阶级斗争更重要的使命，为了一个摆脱阶级压迫的世界，也没有什么代价是不可接受的。"
 wholesome_grinchism_subtype_desc:0 "§Y新圣诞老人主义§!\n\n最近皈依的格林奇试图在圣诞老人失踪后与圣诞老人的荣耀和美丽相抗衡，新圣诞老人主义将尽最大努力重新夺回过去圣诞节的辉煌时光。虽然新圣诞老人主义与圣诞老人主义本身非常接近，但关键区别在于它的创始人。通过对淘气鬼和好孩子名单采取更宽松的标准，在格林奇的领导下，地球上没有一个人会得不到礼物。"
 socdem_narodism_subtype:0 "民粹主义"
 socdem_narodism_subtype_desc:0 "§Y民粹主义§!\n\n£GFX_ideology_narodism_bar\n\n\n\n\n民粹主义是一种发源并传播于前俄罗斯帝国的领土上的农业社会主义思想。它受到了亚历山大·赫尔岑和尼古拉·切尔尼舍夫斯基作品的影响，且基于一种通过广泛的公民组织、工会主义和公社主义来实现其独特社会主义道路的思想。它重视农民，视其为社会的基础，并寻求解放农民，废除地主制度，和引入独立于地方当局的农民社区自治制度。自19世纪以来，“新民粹主义”不断演变，现在以“土地社会主义化”和“地方苏维埃”的理念而闻名。虽然其范畴囊括无政府工团主义到自由民主主义，但在东欧广袤的土地上，民粹主义一直是一支一枝独秀的社会主义势力。"
 soclib_narodism_subtype:0 "自由民粹主义"
 soclib_narodism_subtype_desc:0 "§Y自由民粹主义§!\n\n£GFX_ideology_soclib_lib_narodism_bar\n\n\n\n\n民粹主义是一种发源并传播于前俄罗斯帝国的领土上的农业社会主义思想。它受到了亚历山大·赫尔岑和尼古拉·切尔尼舍夫斯基作品的影响，且基于一种通过广泛的公民组织、工会主义和公社主义来实现其独特社会主义道路的思想。它重视农民，视其为社会的基础，并寻求解放农民，废除地主制度，和引入独立于地方当局的农民社区自治制度。自19世纪以来，“新民粹主义”不断演变，现在以“土地社会主义化”和“地方苏维埃”的理念而闻名。虽然其范畴囊括无政府工团主义到自由民主主义，但在东欧广袤的土地上，民粹主义一直是一支一枝独秀的社会主义势力。"
 progressive_democracy_subtype:0 "进步民主主义"
 progressive_democracy_subtype_desc:0 "§Y进步民主主义§!\n\n£GFX_ideology_progressive_democracy_bar\n\n\n\n\n坚持进步民主主义理想的政党往往融合了激进的自由派和民族主义阵营两方的成分。因为认为真正民主的社会对实现进步至关重要，他们将不遗余力地进行深度的选举改革，追求实现完全无记名的全民投票。进步民主主义者认为主流的自由主义过于注重个人，因而支持建立所有阶级和利益集团都能团结一致的国家，尽管他们的大多数支持者集中在小城市。在经济方面，他们认为，自由市场与追求技术进步，和广泛的公共教育相结合，是确保本国市场能与外国市场匹敌的最佳方式。进步民主主义在知识分子和拥有政治意识的金融业者中最受欢迎。"
 authdem_caudillo_populism_subtype:0 "考迪罗民粹主义"
 authdem_caudillo_populism_subtype_desc:0 "§Y考迪罗民粹主义§!\n\n£GFX_ideology_caudillo_bar\n\n\n\n\n考迪罗民粹主义是一个用来指代拉丁美洲各种民粹主义独裁政权的术语。考迪罗民粹主义往往没有理论基础，仅仅来自于一名强人（常常是一名军阀）。围绕着这名强人的统治，强烈的个人崇拜会被建立起来，让民众将他视为祖国的卫士和人民的父亲。考迪罗民粹政权具有强烈的民粹主义特征，经常为人民实施非社会主义形式的福利，并依靠民族主义或爱国主义来为政权建立合法性。这些政权的经济政策差异很大，从国有经济到亲外国公司的自由市场，再到有限的保护主义，都被囊括其中。"
 red_ustase_subtype:0 "革命乌斯塔沙"
 red_ustase_subtype_desc:0 "§Y革命乌斯塔沙§!\n\n£GFX_ideology_rev_ustase_bar\n\n\n\n\n即使以巴尔干的标准来看，革命乌斯塔沙，或者说红色乌斯塔沙，也有够稀奇古怪的。革命乌斯塔沙出自一种右翼意识形态，是神秘莫测的克罗地亚政治家安特·齐利加的标牌。革命乌斯塔沙的核心无疑是共产主义，对于继承自乌斯塔沙的“斗争”与大克罗地亚原则，则改编为自治民族共和国这一在多瑙河地区发展出来的独特思想。理所当然的，对这些原则的改编使得革命乌斯塔沙站在了反帕韦利奇的一边。\n\n革命乌斯塔沙的支持者同样热心于支持第三国际，且经常被拿来和伦敦的奥斯瓦尔德·莫斯利一行相提并论。更为奇特的是，革命乌斯塔沙甚至不反对和居住在自己统治区域内的奥地利人、意大利人以及德国人合作，阶级层面的团结似乎比克罗地亚血统更为重要，其支持者们对彼此的文化相当敏感。"
 popular_patriotism_subtype:0 "大众爱国主义"
 popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 socdem_bonapartism_subtype:0 "波拿巴主义"
 socdem_bonapartism_subtype_desc:0 "§Y波拿巴主义§!\n\n£GFX_ideology_bonapartism_bar\n\n\n\n\n波拿巴主义是一种直接受到法国皇帝拿破仑一世及其继任者的政策启发而形成的意识形态。这种意识形态支持由一位领袖拥有强大的行政权力，无论是以共和制还是君主制的形式，但与传统独裁不同的是，这位统治者与其臣民之间会建立直接、民主和个人的联系，通常采取组织投票和公投的形式。同时波拿巴主义政权也重视国家军备的建设。波拿巴主义者往往是民粹主义者，又鼓吹精英统治，将其视为正确的政府组织形式。这一意识形态虽然在20世纪衰落，但仍被几个不同的法国政治运动所主张，其中大多数运动呼吁让波拿巴家族回归王位。尽管颇为罕见，但一些非法国人也会声称自己是波拿巴主义者，比如危地马拉的乌维科将军。"
 socdem_sandinismo_subtype:0 "自由桑地诺主义"
 socdem_sandinismo_subtype_desc:0 "§Y自由桑地诺主义§!\n\n£GFX_ideology_lib_sandino_bar\n\n\n\n\n在西方媒体口中，自由桑地诺主义有时也被称为“自由桑地诺意识形态”，但它并不是一种具体的意识形态，而是代指尼加拉瓜的奥古斯托·塞萨尔·桑地诺所怀抱的，后又被其追随者所自由化、温和化的一系列信念。在饱受压迫的农村地区，自由桑地诺主义深受欢迎，其呼吁开展大规模游击战，反对任何形式的帝国主义，将土地资源分配给所有人民，亦同其他主流意识形态一般，欲图建立一个独立自主强大的国家，但却又更具农业主义与农民民粹主义色彩。此外，自由桑地诺主义的追随者还竭力想将“印西族裔”统一为一个名为“印第安-拉丁美洲大陆和安的列斯联盟”的实体，但同主流桑地诺派相比，他们对这一理想的追求更流于形式，也愿意将这一理想当成妥协的资本，他们更倾向、也常常通过外交手段而非冲突和武装革命促进印西族裔的团结。桑地诺主义还倡导各种形式的精神主义，试图以一种对正义和全民亲爱的共通信念去取代压迫性的牧师制度。但自由桑地诺主义更植根于一般的基督教与原住民信仰，而非由各教混一产生的信仰和精神主义学究的思想，因而与普罗大众的联系也更加紧密。"
 authdem_revolution_nationale_subtype:0 "民族革命"
 authdem_revolution_nationale_subtype_desc:0 "§Y民族革命§!\n\n£GFX_ideology_revolution_nationale_bar\n\n\n\n\n在贝当元帅及其部下完全控制了国家后，“民族革命”便成为了法国的官方意识形态。民族革命旨在通过建立以贝当元帅为个人崇拜之中心的牢固道德秩序，彻底地改革和重建法国社会。大元帅的政权谴责自由主义、议会制度和社会主义，拒绝导致公社夺取政权的知识分子和政治精英们的现代主义，转而提倡以家庭、宗教和传统为核心的朴素农业社会理想，并且向下一代法国人灌输为祖国牺牲奉献的价值观。"
 revolution_nationale_subtype:0 "民族革命"
 revolution_nationale_subtype_desc:0 "§Y民族革命§!\n\n£GFX_ideology_revolution_nationale_bar\n\n\n\n\n在贝当元帅及其部下完全控制了国家后，“民族革命”便成为了法国的官方意识形态。民族革命旨在通过建立以贝当元帅为个人崇拜之中心的牢固道德秩序，彻底地改革和重建法国社会。大元帅的政权谴责自由主义、议会制度和社会主义，拒绝导致公社夺取政权的知识分子和政治精英们的现代主义，转而提倡以家庭、宗教和传统为核心的朴素农业社会理想，并且向下一代法国人灌输为祖国牺牲奉献的价值观。"
 maurrassism_subtype:0 "莫拉斯主义"
 maurrassism_subtype_desc:0 "§Y莫拉斯主义§!\n\n£GFX_ideology_maurras_bar\n\n\n\n\n“莫拉斯主义”又被称为整合民族主义，是法兰西行动的哲学家和思想支柱夏尔·莫拉斯提出的政治、社会和知识领域的论断。在夏尔·莫拉斯看来，存在两个法国：其一是共和制度及其精英代表的“法定国家”，由四大“共犯阶层”支持：犹太人、新教徒、共济会和外邦人，也就是“反法势力”；其二则是真正能代表法兰西人民的“真实国家”，而这也是莫拉斯所鼎力支持的。莫拉斯主义基于社会团结理论，追求以法国曾经的旧制度为模式，实现有机运作的社会。因此，法兰西行动拒绝承认法国大革命及其后的历史，发誓要建立一个地方分权、恪守传统和联邦政体的君主制国家，政治权力将被授予各省议会，而国王作为伟大的全国仲裁者，此外天主教将成为维系国家团结的重要黏合剂。在知识领域，莫拉斯则推崇古典理性主义，反对浪漫主义。"
 classical_liberalism_subtype:0 "古典自由主义"
 classical_liberalism_subtype_desc:0 "§Y古典自由主义§!\n\n£GFX_ideology_classical_liberalism_bar\n\n\n\n\n古典自由主义是主流自由主义的一个分支，主张自由市场和自由放任经济，以及在有限政府的法治下与经济和政治自由相关的公民自由。与主流的自由主义不同，古典自由主义者对社会政策、福利制度、税负和国家对公民生活的介入持更保守的态度，并不提倡放松管制和权力下放。这点让他们与自由保守主义者有一些共通之处，尽管他们鄙视保护主义等保守经济学。古典自由主义与19世纪的“原始”自由主义者（如约翰·洛克、让·巴蒂斯特·萨伊、托马斯·罗伯特·马尔萨斯和大卫·里卡多）有所联系，植根于亚当·斯密的思想，基于自然法道德原则、自由进步主义、功利主义以及工业革命和城市化兴起期间的经验教训。从哈耶克到米塞斯，古典自由主义者踩在中右翼和中左翼之间的路线之上，试图将启蒙思想带向狂野的海岸。"
 soclib_kimbanguism_subtype:0 "基班古主义"
 soclib_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与社会主义团体之间的关系，基班古主义逐渐接受了刚果民族主义、马克思主义和社会主义经济学，因而变得激进反帝，不过总体上其仍遵循着和平主义和部落主义的立场。"
 marlib_classical_liberalism_subtype:0 "古典自由主义"
 marlib_classical_liberalism_subtype_desc:0 "§Y古典自由主义§!\n\n£GFX_ideology_classical_liberalism_bar\n\n\n\n\n古典自由主义是主流自由主义的一个分支，主张自由市场和自由放任经济，以及在有限政府的法治下与经济和政治自由相关的公民自由。与主流的自由主义不同，古典自由主义者对社会政策、福利制度、税负和国家对公民生活的介入持更保守的态度，并不提倡放松管制和权力下放。这点让他们与自由保守主义者有一些共通之处，尽管他们鄙视保护主义等保守经济学。古典自由主义与19世纪的“原始”自由主义者（如约翰·洛克、让·巴蒂斯特·萨伊、托马斯·罗伯特·马尔萨斯和大卫·里卡多）有所联系，植根于亚当·斯密的思想，基于自然法道德原则、自由进步主义、功利主义以及工业革命和城市化兴起期间的经验教训。从哈耶克到米塞斯，古典自由主义者踩在中右翼和中左翼之间的路线之上，试图将启蒙思想带向狂野的海岸。"
 christian_technocracy_subtype:0 "基督教技官主义"
 christian_technocracy_subtype_desc:0 "§Y基督教技官主义§!\n\n£GFX_ideology_christian_technocracy_bar\n\n\n\n\n基督教技官主义可以被视为主流基督教保守主义和右翼技术官僚主义思想的融合变体。基督教技官主义在欧洲首开先河，曾在低地国家、德国和革命前的法国风靡，这种理念认为，社会面的决策者应该根据他们在担负的特定责任领域的资历来被选择，特别是在科学或技术方面。然而，与更为主流和激进的左右翼技官主义不同，基督教技官主义通常摒弃加速主义思想以及对社会和文化的全面改革，相反，他们希望在基督教道德观的指导下，在由教会成员和训练有素的技术专家组成的开明群体统治下，坚持缓慢而保守的社会变革。基督教技官主义的巨头们将引导社会走向一种崭新高效、理性发展的思维模式，而这种思维模式不用受到两党民主政治和派系主义的影响，在上帝的领导下净化社会，让其变得廉洁、公正和高效。基督教技官主义认为资本主义和法团主义无法避免浪费，正如传统社会主义和民粹主义模式无法避免低效，并试图突破这两种模式，将人类引向一个理性虔诚的基督乌托邦。"
 tot_mexicayotlism_subtype:0 "墨西加本质主义"
 tot_mexicayotlism_subtype_desc:0 "§Y墨西加本质主义§!\n\n£GFX_ideology_mexicayotlism_bar\n\n\n\n\n墨西加本质运动，有时也被称为墨西加本质主义或墨西加本质思想，指的是推动卡拉斯科复辟的阿兹特克帝国的人性化、社会化和民主化的一场运动。这场激进运动的形成受到了墨西哥革命行动支持的墨西加和纳瓦的混合式民族主义的影响，以早已在历史上消失的美索美洲宗教为支柱，意图将阿兹特克人身份认知，现代化的墨西哥和奇卡诺民族主义以及墨西哥革命的理念相融合，提倡社会主义的土地改革、革命民主，以及真正的平等主义。由于人民和政府授予了受人敬爱的团结象征与国家元首弗里达·卡罗前阿兹特克统治者的头衔和神祇的绰号，在卡罗以及其余阿兹特克三邦同盟的精英后裔们领导下的墨西加本质运动乍看之下似乎与君主制度无异。然而，事实上卡罗掌握的政治权力极少，她只是作为国家精神和文化上的领袖，以及团结新民主制度的象征而存在。在托尔特卡特尔的指引下，墨西加本质运动把去除了中心论与优越论的土著民族主义、美索美洲的传统实践、新萨满教以及美索美洲文艺复兴，与社会主义土地改革、革命共和主义和社会进步主义等左翼思想融合在了一起，一心要将早已消亡的阿兹特克帝国转变为一个适应现代，真正民主的阿兹特克共和国。"
 socdem_mexicayotlism_subtype:0 "墨西加本质主义"
 socdem_mexicayotlism_subtype_desc:0 "§Y墨西加本质主义§!\n\n£GFX_ideology_mexicayotlism_bar\n\n\n\n\n墨西加本质运动，有时也被称为墨西加本质主义或墨西加本质思想，指的是推动卡拉斯科复辟的阿兹特克帝国的人性化、社会化和民主化的一场运动。这场激进运动的形成受到了墨西哥革命行动支持的墨西加和纳瓦的混合式民族主义的影响，以早已在历史上消失的美索美洲宗教为支柱，意图将阿兹特克人身份认知，现代化的墨西哥和奇卡诺民族主义以及墨西哥革命的理念相融合，提倡社会主义的土地改革、革命民主，以及真正的平等主义。由于人民和政府授予了受人敬爱的团结象征与国家元首弗里达·卡罗前阿兹特克统治者的头衔和神祇的绰号，在卡罗以及其余阿兹特克三邦同盟的精英后裔们领导下的墨西加本质运动乍看之下似乎与君主制度无异。然而，事实上卡罗掌握的政治权力极少，她只是作为国家精神和文化上的领袖，以及团结新民主制度的象征而存在。在托尔特卡特尔的指引下，墨西加本质运动把去除了中心论与优越论的土著民族主义、美索美洲的传统实践、新萨满教以及美索美洲文艺复兴，与社会主义土地改革、革命共和主义和社会进步主义等左翼思想融合在了一起，一心要将早已消亡的阿兹特克帝国转变为一个适应现代，真正民主的阿兹特克共和国。"
 marlib_centrist_subtype:0 "中间路线"
 marlib_centrist_subtype_desc:0 "§Y中间路线§!\n\n£GFX_ideology_centrist_bar\n\n\n\n\n民主中间派描述了一种专注于维持既定现状的政治观点。尽管各国情况各不相同，但中间派仍然团结在同一个中间地带，在各自的社会中寻求平等和等级制度之间的平衡。保守派和极端派都痛恨中间派，他们视其为骑墙派，但中间派毫不动摇地团结在已被证明行之可能的现状周围，既抵制激进改革，又排斥强硬的传统主义，就像他们为更大的利益而谋求在争吵的其他政党间充当妥协的媒介一样，因为中间派视稳定与平稳过渡胜于一切。"
 soccon_oligarchy_subtype:0 "寡头主义"
 soccon_oligarchy_subtype_desc:0 "§Y寡头主义§!\n\n£GFX_ideology_oligarchy_bar\n\n\n\n\n寡头主义指的是国家的权力掌握在某些通常规模很小的特定群体手中的体制，它的含义相当宽泛，而其具体形式则可以是商业共和国、企业国度，甚至唯才是举的精英治国。此外，寡头主义相互之间在决定掌权的人选方面也存在着不小的差异，有些政权的等级制度还是以种族为基础的。寡头们往往出身巨富之家，其一心向钱看和任人唯亲的作风也遭人讥笑为关心自己的权力胜过国家福祉。抛开上述说法不谈，只要少数特权阶级的权力得到了保障，各式各样的寡头们也是不会介意自由放任的治理手段的。"
