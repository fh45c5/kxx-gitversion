 duplessism_subtype:0 "迪普莱西主义"
 duplessism_subtype_desc:0 "§Y迪普莱西主义§!\n\n£GFX_ideology_duplessism_bar\n\n\n\n\n作为主宰魁北克命运的“首长”所散发的意识形态，迪普莱西主义体现了莫里斯·勒诺布莱·迪普莱西及其国民联盟的政治立场。这位从律师转型的保守派政客，若非获得三河城崛起势力、厌倦自由党独大的新闻界人士，以及渴望在本省重建神圣价值观的天主教会的三方结盟，根本无法打破英裔加拿大自由党看似永恒的统治。民族联盟党对魁北克的愿景核心在于：拒绝将“进步”视为天然正义，主张以传统道德抵御社会主义洪流。这种观念催生了严苛的反工会法律，并将天主教保守主义铭刻进社会每个角落，用慈善事业取代“赤色”福利概念，仅保留最低工资标准与老年养老金。尽管出身保守阵营，迪普莱西始终是经济自由主义的旗手，主张政府最小干预，依赖外部资本开发资源，为魁北克民众创造财富机遇。不出所料，国民联盟的核心议题始终是魁北克自治权及其在联邦中的特殊地位维护。虽然至今拒绝魁北克独立主张，还被利昂内尔·格鲁神父指责为仅维持着基于“独特社会”特权的“消极自治”，但若形势所需，这位“首长”定会高举爱国主义火炬，迈向法裔加拿大人的独立家园。无论是抨击他通过新闻审查与恩庇腐败将魁北克拖入“大黑暗时代”的批评者，还是视其为只想为选民谋福祉的平民主义者的支持者，无人能断言这位国民联盟党魁的未来动向。"
 natpop_conservative_feminism_subtype:0 "保守女权主义"
 natpop_conservative_feminism_subtype_desc:0 "§Y保守女权主义§!\n\n£GFX_ideology_conservative_feminism_bar\n\n\n\n\n保守女性主义是自由派与社会主义女权主义运动中相对小众的分支，致力于在右翼保守政党或组织框架内推动性别平等，以此区别于激进女性主义。保守女权主义者多为具地方影响力的贵族或中产阶层女性，其权利主张基于性别平等但存在本质差异的核心理念。该思潮常承袭早期母性女权主义传统，主张在维护家庭价值体系的前提下融合民族主义元素，视传统家庭结构为女性权益保障基石。然其对传统制度的捍卫并非绝对——保守女权主义运动往往肇始于对世俗及宗教机构中女性权利缺失的批判。\n\n其政治纲领通常倡导渐进式扩大女性教育权、医疗权及选举权，步伐较左翼更为审慎温和。该运动多源于宗教文化领域的传统女性团体，但亦存在与欧洲及拉美民族民粹主义政党结盟的激进分支。全球视野下，保守女权主义形态各异：欧洲的公教进行会相关妇女团体、法兰西妇女联盟，以及美国凯瑟琳·布什内尔与弗朗西丝·威拉德领导的基督教妇女禁酒联盟尤具代表性。"
 nacionalismo_subtype:0 "阿根廷民族主义"
 nacionalismo_subtype_desc:0 "§Y阿根廷民族主义§!\n\n£GFX_ideology_nacionalismo_bar\n\n\n\n\n阿根廷民族主义，又称阿根廷右翼民族主义，通常特指十九世纪末至二十世纪初兴起的广泛思潮。其思想先驱可追溯至已消亡的国家自治党内部的实证民族主义派系，后演变为阿根廷爱国联盟等右翼准军事组织的精神内核。阿根廷民族主义者从莫拉斯主义、西班牙极端教权民族主义乃至法国布朗热主义中汲取养分，致力于抵御由移民（尤以无政府主义倾向的加泰罗尼亚人为甚）、犹太人、社会主义者及各色工会分子传播的共济会世俗自由主义。在爱国联盟等组织的旗帜下，他们拥戴曼努埃尔·卡莱斯这类凯撒式的共和派领袖，以对抗现代主义侵蚀——这种侵蚀已在巴塔哥尼亚悲剧中将国家撕裂，使“拉普拉塔重生”的愿景愈发遥不可及。尽管崇尚秩序社会，当代民族主义者仅仅只是用天主教法团主义替代工会和福利分配（令人惊诧的是这些事务多由女性主导）。作为民族主义右翼的经济主力，爱国联盟主张在摆脱外国支配的前提下推行自由企业与工业自由化。在更具军国色彩的团体虎视眈眈之际，卡莱斯派能否实现其“净化阿根廷”的理想而不被篡位，仍有待观察。"
 laurentism_subtype:0 "洛朗主义"
 laurentism_subtype_desc:0 "§Y洛朗主义§!\n\n£GFX_ideology_laurentism_bar\n\n\n\n\n洛朗主义得名于威尔弗里德·莫林神父对于魁北克的称呼，其本质并非单一的意识形态，而是各方势力为保障法语之未来而结成的多元联盟。自由党政府大肆纵容英语的单语统治地位在前，专制“黑王”莫里斯·迪普莱西变本加厉，行英国宗主所不齿之实在后，洛朗主义的大本营——青年加拿大组织应运而生。除共同捍卫言论自由、民主制度及魁北克独特文化传统之外，青年加拿大的各派在社会经济议题上分歧显著：右翼力倡莱昂内尔·格鲁之“青年宣言”，大力反犹，主张以基督教人文原则建立起民族法团之国；左翼则疏离教会，推崇文化天主教世俗理念，倡导更为传统的社会民主福利制度，增进“各族间的友爱”。面对着处于历史十字路口的魁北克，这场默默无闻的革命亟需作出抉择：是发出觉醒强音，还是在“洛朗之土”获解放前黯然消逝？"
 marlib_radical_progressivism_subtype:0 "激进进步主义"
 marlib_radical_progressivism_subtype_desc:0 "§Y激进进步主义§!\n\n£GFX_ideology_radical_progressivism_bar\n\n\n\n\n激进进步主义，指在普遍抵制左翼、自由派改革理念的传统保守国家之中带有一系列左翼、中左翼色彩的思想流派。相较于其它运动，这一团体或许不算激进，社会主义或自由主义的理念也不鲜明，但若考虑到国家现状及大众观念，这些“温和派激进分子”已是相当极端。它们游离于主流政治建制之外，践行着各式左翼、温和自由及进步理念，坚持其特有的“左翼道路”——不过，这些理念在更为激进的团体眼中只能算作是自由主义甚或中间立场。"
 soclib_oligarchy_subtype:0 "寡头主义"
 soclib_oligarchy_subtype_desc:0 "§Y寡头主义§!\n\n£GFX_ideology_oligarchy_bar\n\n\n\n\n寡头主义指的是特定小群体凌驾于举国之上的一种体制，其界定相当宽泛，既可以是商业共和、商贾治国，也可以是优绩精英之制。寡头政权的执政人选之间存在着不小的差异，有些甚至会以种族定等级。寡头多出自巨富之家，一心向钱看又任人唯亲，常遭人讥笑为只重私权罔顾国运。抛开上述说法不谈，只要少数特权寡阶级的权力得到了保障，寡头们是不会介意来点自由放任之手段的。"
 soccon_chosid_nyi_subtype:0 "政教双运"
 soccon_chosid_nyi_subtype_desc:0 "§Y政教双运§!\n\n£GFX_ideology_buddhist_autocrat_bar\n\n\n\n\n在巍峨的喜马拉雅山巅，政权是佛法与世俗权威缔结的神圣契约。“政教双运”体制下，达赖喇嘛或夏仲法王等转世圣者象征着至高无上的精神权威，却超脱于日常政务；而俗世执政者则执掌赋税、律法、防务与外交。在这精妙的二元架构中，大住持统摄寺院、教育与道德戒律，塑造社会的精神内核；其摄政者则如牧人般照料信众的世俗需求。由于中央权威的强弱始终取决于宫廷贵族的势力消长，地方豪强得以在权力缝隙中扎根，宗本与彭洛们凭借地方武装与堡垒维系着区域自治。这套双轨政制肇始于十七世纪初：五世达赖在西藏建立政教合一的甘丹颇章政权，而虬髯圣者夏仲·阿旺南杰则在不丹推行《大宝法典》。岁月流转中，西藏的弟司制度演变为噶厦议会，不丹则在1907年由乌金·旺楚克建立世袭君主制，将政教大权集于国王一身，使夏仲法王逐渐边缘化。这座佛法与王权交织的古老经幢，究竟会演变为以宗教原则制衡世俗权力的宪政神权，还是从权力圣殿中轰然倾颓？唯有时间能给出答案。"
 authdem_chosid_nyi_subtype:0 "政教双运"
