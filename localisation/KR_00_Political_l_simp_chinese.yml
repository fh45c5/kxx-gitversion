 tribal_chiefdom_subtype_desc:0 "§Y部落家长制§!\n\n£GFX_ideology_tribal_chiefdom_bar\n\n\n\n\n部落家长制，有时会被西方人错误地称为“酋长制”或部落君主制，是对分散在南北美、非洲以及亚洲和大洋洲的各种类型部落政府的描述，这些政府以世袭或民选的酋长或其他领导人为中心。从民主选举出的部落主席到完全世袭的酋长，这些政府的运作方式与欧洲君主制相似，但不那么带有华贵性。部落家长制国家因为对人民旧时传统的尊重而团结在一起，致力于为民众提供非社会主义的家长制民粹主义，促进社会内部所有人民的共同繁荣。他们之间的主要区别在于如何组织经济，趋向现代主义还是传统主义，领导人的性质以及拥有多少权力。"
