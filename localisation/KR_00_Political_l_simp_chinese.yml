 syn_left_nationalism_subtype:0 "左翼民族主义"
 syn_left_nationalism_subtype_desc:0 "§Y左翼民族主义§!\n\n£GFX_ideology_left_nationalism_bar\n\n\n\n\n左翼民族主义，通常也称为社会民族主义，是源于受社会主义思想影响的各种民族解放运动的一种独特民族主义形式。左翼民族主义者将民族自决视为最高准则，努力为同胞人民建立一个国家，以让人民享有主权和（符合他们定义的）平等。左翼民族主义者反对其右翼同道，在斗争中坚决拒绝以种族而不是阶级为区分。"
 syn_teetotalism_subtype:0 "禁酒主义"
 syn_teetotalism_subtype_desc:0 "§Y禁酒主义§!\n\n£GFX_ideology_teetotalism_bar\n\n\n\n\n禁酒主义是对个人与社会实现完全戒酒，以及其他毒品和非法精神活性物质的一种实践与鼓吹，虽然自由主义或左翼之中也不乏禁酒主义的存在，但其还是常常被人视为与传统保守脱不开干系。一个纯粹的禁酒主义者与那些单纯的戒酒人士区别在于他们对禁酒理念的全身心投入和奉献，一些禁酒主义政党是在实现目标后就会解散的单一团体，不过，这也并不是说更有组织性、更广泛和更持久的禁酒主义政党不存在（在美洲和欧洲就有许多生动的例子）。在美国，禁酒党采用骆驼作为他们的象征，以表明自身“滴水不沾”。美国禁酒主义的立场来自于清教徒文化，而欧洲、印度与北美同样存在呼吁禁酒的狂热宗教团体。禁酒主义者在世界各地都很常见，但通常是更大规模运动的一部分，某种形式的宗教虔诚中穿插着禁酒运动是非常常见的，但也并非尽是如此。"
 panchayat_system_subtype:0 "潘查亚特体制"
 panchayat_system_subtype_desc:0 "§Y潘查亚特体制§!\n\n£GFX_ideology_panchayat_system_bar\n\n\n\n\n潘查亚特体制是尼泊尔按照自身独特国情制定的一套治国体系，其目的是粉碎旧精英阶层的统治，把国家带入现代化。虽然“潘查亚特”一词出自印度，意为乡村长老会，但这套体制的缔造者则是特里布万国王的太子马亨德拉——这位年纪轻轻又雄心勃勃的太子既不甘朝政被首相的拉纳王朝所把持，又不像其父那般持立宪观点。潘查亚特体制把整个国家划分为了由四层议会和六大阶层监管下的各个省份，每个省份由无党派的官员干部管理，国家的每一项决策都需经过君主的批准。如此一来，马亨德拉不仅扫除了旧精英阶层，还把共和激进分子赶出了门外。潘查亚特体制的另一大要素是对于尼泊尔文化“三大支柱”的重视，这点可以概括为一句话：“一位国王，一套服装，一种语言”。自国父普里特维·纳拉扬沙阿时代之后就一直旁落的君权在潘查亚特体制下得到了复兴，毗湿奴在人间的使者将以“国家指导”的方式继续推动土地改革、工业化、基础设施的现代化，以及改善教育、建立现代的医疗保健系统，最终实现四海升平、国富民殷。潘查亚特体制的反对者声称，马亨德拉的这套做派无非是沙文主义的专制阴谋，他只不过是用身边亲信换掉了旧时代精英，而其支持者则表示，只有在马亨德拉的治理下，尼泊尔才能摆脱过去的封建残余，以马亨德拉本人所说的“适合这片土地”的政府之形式，实现某种字面意义上的“民主”。"
 radsoc_clientelism_subtype:0 "庇护主义"
 radsoc_clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 british_maximism_subtype:0 "不列颠准则主义"
 british_maximism_subtype_desc:0 "§Y不列颠准则主义§!\n\n£GFX_ideology_british_maximalism_bar\n\n\n\n\n不列颠准则主义，又称莫斯利主义、莫斯利社会主义、新工会主义，甚至新工党思想，是奥斯瓦尔德·莫斯利的独门创作，亦折射了他本人在政坛之上跌宕起伏的经历。这位青年政治家出身贵族家庭，在目睹保守党对爱尔兰平民施加的暴行后，他便对保守党失望至极。他和发妻辛西娅·“奇米”·柯曾女士皆认同费边社会主义的理想，一同加入了独立工党。放在别的什么世界，这样一位魅力四射的人物很可能会成为下一任首相，但英国大革命和君主制度的土崩瓦解却让莫斯利在方法论上发生了巨大转变。这位昔日的准男爵在劳工联合会议中组织起了“准则派”小组，撰写了一篇野心勃勃的文章，其中满是对一个重获新生的不列颠的期冀愿景。按照《莫斯利备忘录》的观点，唯有建立一个保护主义的、自给自足的民族工团主义国家，并依照其密友约翰·梅纳德·凯恩斯的教诲对之加以巩固，方可摆脱阶级冲突的遗毒，构建一个崭新而健康的国家主体。莫斯利虽在劳工联合会议中勤恳耕耘多年，但从未有人采纳过备忘录中的哪怕一条想法，因此，莫斯利对他口中所谓的“红色贵族专制”大失所望，继而认为这一统治形式完全忽视了英国的普罗大众。莫斯利常将自己看做打破贵族权力的都铎诸王的精神继承人，更将克伦威尔护国公称为“不列颠第一位极权主义者”，继而以其后辈自居，这位准则派的领袖擅长发动底层群众，亦将把联邦上下重塑为主席大权在握之国视作自身使命。莫斯利派虽主张解放前大英帝国治下的土地，并与文化习俗相近的民族实现统一，但也希望同兄弟国家实践泛欧之愿。奥斯瓦尔德与墨索里尼虽在社会观点上存在分歧，但也不乏共同之处，两人亦是最亲密的同志。一般来说，莫斯利主义具有相当的进步色彩，其支持宗教宽容政策，亦认可不分种族的民族国家认同与女权主义思潮，哪怕是像维克托·巴克这样的变性人也能被其慷慨接纳。总之，不列颠准则主义是奥斯瓦尔德·莫斯利个人思想的载体，他的远见卓识将在不列颠燃起永恒之火，无人可预料烈火燃向何方，但其燎原之势必将震撼世界。"
 soclib_reformed_belgicism_subtype:0 "改革比利时主义"
 soclib_reformed_belgicism_subtype_desc:0 "§Y改革比利时主义§!\n\n£GFX_ideology_reform_belgicism_bar\n\n\n\n\n改革比利时主义，又称改革比利时民族主义或“去极端化”比利时主义，是在德格勒尔政权倒台及其标准君权主义崩塌后，对比利时民族主义进行改革与去极端化的版本。改革比利时主义既保留了在截然不同的法裔瓦隆人和荷裔佛莱芒人间打造一个统一而有凝聚力的“比利时”身份认同这一目标，又剥离了比利时民族主义中德格勒尔那已被证明为失败的暴力反民主威权元素，同时致力于以各种方式平等对待一切比利时公民。改革比利时主义并不与特定的意识形态挂钩，它的主要目的是在推动民族融合和双语制（不过，各个比利时主义运动往往会出于方便或是个人喜好而偏向于法语或荷兰语的其中一个）的同时减少国家各区的自治性。虽然改革比利时主义常常涉及到罗马天主教信仰、社会天主教、非革命的社会主义式福利、比利时一元论，以及培养独特的比利时文化与身份认同，但比利时民族的概念并不与任何一个政治团体相绑定，从埃尔热的人道改革君权主义，再到比塞雷的人文资本主义和德乌斯的社会比利时主义，低地国家的各个意识形态、政治光谱内都可见到比利时国家及文化交融之理念。"
 soccon_reformed_belgicism_subtype:0 "改革比利时主义"
 soccon_reformed_belgicism_subtype_desc:0 "§Y改革比利时主义§!\n\n£GFX_ideology_reform_belgicism_bar\n\n\n\n\n改革比利时主义，又称改革比利时民族主义或“去极端化”比利时主义，是在德格勒尔政权倒台及其标准君权主义崩塌后，对比利时民族主义进行改革与去极端化的版本。改革比利时主义既保留了在截然不同的法裔瓦隆人和荷裔佛莱芒人间打造一个统一而有凝聚力的“比利时”身份认同这一目标，又剥离了比利时民族主义中德格勒尔那已被证明为失败的暴力反民主威权元素，同时致力于以各种方式平等对待一切比利时公民。改革比利时主义并不与特定的意识形态挂钩，它的主要目的是在推动民族融合和双语制（不过，各个比利时主义运动往往会出于方便或是个人喜好而偏向于法语或荷兰语的其中一个）的同时减少国家各区的自治性。虽然改革比利时主义常常涉及到罗马天主教信仰、社会天主教、非革命的社会主义式福利、比利时一元论，以及培养独特的比利时文化与身份认同，但比利时民族的概念并不与任何一个政治团体相绑定，从埃尔热的人道改革君权主义，再到比塞雷的人文资本主义和德乌斯的社会比利时主义，低地国家的各个意识形态、政治光谱内都可见到比利时国家及文化交融之理念。"
 natpop_militant_atheism_subtype:0 "战斗无神论"
 natpop_militant_atheism_subtype_desc:0 "§Y战斗无神论§!\n\n£GFX_ideology_militant_atheism_bar\n\n\n\n\n正如马克思所断言，宗教是蛊惑人民群众的精神鸦片，而革命战斗无神论者则以彻底根除一切形式的宗教、切断把无产阶级同过去的失败束缚在一起的最后一根锁链为己任。虽然战斗无神论者所拥护的左翼思想之具体形式千差万别，但其通常与某种专制且高度军事化的社会主义相挂钩，并且偶尔还会带有以强烈的国家、民族、文化、公民认同来取代精神鸦片这一民族主义的基调。不过，所有这些组织都有着一个共同点，那就是致力于以奋战不息的反神权、反教权态度，将人类从各种形式的宗教和精神信仰中解放出来，并代之以党、人民、领袖或国家的理性教条。"
 soclib_internationalism_subtype:0 "自由国际主义"
 soclib_internationalism_subtype_desc:0 "§Y自由国际主义§!\n\n£GFX_ideology_lib_intern_bar\n\n\n\n\n自由国际主义虽受到了左翼国际主义，或称托洛茨基主义的部分影响，但两者的本质截然不同。自由国际主义出自美国自由主义政治家温德尔·威尔基及其编辑小加德纳·考尔斯、艾丽塔·范多伦的“天下一家”宣言、游击，它基本是从自由主义（有时也会掺杂些进步乃至温和社会主义元素）视角出发，追求全球经济外交合作、反帝主义、自由民主、平等人道主义、彻底的社会民权改革，并最终建成世界联邦，或是以美国那种联邦制组织而来的单一民主制世界政府。“天下一家”理念影响到了全球众多自由派、进步派、社会民主派、温和社会主义派的政治家，阿尔伯特·爱因斯坦、圣雄甘地、加瓦哈拉尔·尼赫鲁、克莱门特·艾德礼、哈罗德·勒布、H·P·洛夫克拉夫特等名家巨擘皆在其中。虽然左翼国际主义的各流派失去了其开山祖师，但威尔基及其同时代人剔除了暴力激进元素搞出来的“天下一家”新式国际主义、世界联邦主义却以另一种形式将这一思想延续了下去。"
