 socdem_individualist_anarchism_subtype_desc:0 "§Y个人无政府主义§!\n\n£GFX_ideology_indiv_anar_bar\n\n\n\n\n个人无政府主义，或称个人主义，无疑是整个无政府主义思想谱系中最多元化的形态，其复杂程度远超这个本就充满差异的意识形态群体。该思潮可分为美国派与欧洲派两大分支，但不像其他无政府主义流派拥有蒲鲁东、克鲁泡特金、巴枯宁那样的“教父级”人物。相反，许多个人无政府主义运动是从更大的无政府主义派系中分裂而来——美式个人主义者通常脱胎于互助主义，而欧式个人主义者则往往从暴动无政府主义或罪犯无政府主义者阵营中崛起。这种分野在两种个人无政府主义的经济模式选择上尤为明显：以莱桑德·斯波纳为代表的美式个人主义者普遍允许自由市场继续存在，只要求废除所有可能导致垄断的治理形式；而欧式个人无政府主义者则倾向于将无政府共产主义视为终极社会形态。不过，与大多数无政府主义者将经济运作模式视为意识形态基石不同，对于欧式个人主义者而言，实现革命才是首要任务。共产主义是他们普遍认同的新社会形式，但成功的革命将消灭无产阶级这个资本主义产物的阶级本身。个人无政府主义者更常致力于通过其他方式拓展自由边界：摧毁限制性的社会角色，让裸体主义、自由恋爱、天然主义等理念从古老禁忌的废墟中真正绽放；接纳传统左翼运动所排斥的妓女、罪犯等边缘群体；质疑工会和无政府工团主义是另一种不必要的等级制创造。在个体无政府主义者眼中，“我”是至高无上的权威，任何试图干预这一神圣主体的力量都应予以抵抗。有些个人无政府主义者甚至完全拒绝集体主义，不惜一切代价追求最大程度的个人自由，认为世间万物皆不足与之相提并论。这种意识形态天然具有分散性，主要得到无政府主义知识分子群体的支持，但仍发展出众多分支：马克斯·施蒂纳的利己无政府主义、方兴未艾的无政府女权主义运动，以及在某种程度上包含自由思想理想主义的诸多变体。"
 riksvitalism_subtype:0 "民族活力论"
 riksvitalism_subtype_desc:0 "§Y民族活力论§!\n\n£GFX_ideology_riksvitalism_bar\n\n\n\n\n作为瑞典思想家埃尔莫·林霍尔姆意识形态演变的结晶，民族活力论直指困扰国家的诸多社会弊病：失业危机、社会主义者与自由派的无谓党争、政党政治霸权以及道德的沦丧。尽管其思想雏形源自夏尔·莫拉斯及法兰西行动的著述，但这一后来被称为民族活力论的理论体系，通过吸收意大利民族主义协会的革命性术语而得到强化，并因借鉴罗马尼亚铁卫团的神秘策略而更具感召力。林霍尔姆拒绝将自己标榜为任何外来民族主义思潮的信徒，而是基于瑞典独特的历史传统，精心构筑了契合其特性的思想运动。在保持瑞典政治纯洁性的绝对忠诚前提下，民族活力论开创者及其追随者汲取欧洲各同情组织的思想碎片，自视为伟大古斯塔夫·瓦萨的精神继承者。他们要求终结政党专政、彻底消灭阶级观念、全面肃清保守派、社会主义者和自由派政客，坚信唯有通过实施监管工业经济的家长式国家体制，才能以瑞典方案根治瑞典顽疾。林霍尔姆指斥全球反动组织皆受自由主义空想与马克思主义阶级迷思侵蚀，主张对深陷腐化泥潭的议会实施彻底净化，使其重归服务君主与国家的本源。在其构想的政治蓝图中，净化完成后将自行解散政党，由无党派独立政治家组成真正为民服务的内阁。效法古代卡尔军团的精神遗产，理想的民族活力论者将如同昔日战士般，将生命全然奉献给家庭、上帝与君主，以近乎狂热的爱国情怀践行朴素正直的生活信条。这位长期阐述失控资本主义对贫民剥削之害的先知型思想家，同样警惕社会主义者与国际主义蛀虫，其终极目标在于粉碎阶级隔阂的意识形态枷锁，以此净化民族灵魂，守护瑞典性的本质免遭毁灭者荼毒。"
 mambu_theology_subtype:0 "曼布神学"
 mambu_theology_subtype_desc:0 "§Y曼布神学§!\n\n£GFX_ideology_mambu_theology_subtype_bar\n\n\n\n\n曼布神学，这一信仰体系亦被当古人称为曼布神话之梦，批评者则称之为曼布邪教，实为由阿平甘姆的传教领袖曼布编织的传说集合。曼布始终以尖锐批判欧洲殖民统治与土著剥削著称，他预言了一种新生活图景——巴布亚人将不再受白人（无论是传教士、行政官员、种植园主还是商人）的任意摆布。祖先之灵将庇佑这场抗争：他们在马纳姆岛火山内居住劳作，为子孙制造各类物资；另一些祖先则化身白人模样，在澳大利亚等异域辛勤工作。曼布宣称，祖先早已为巴布亚人运送了大量“船货”——腰布、斧头、卡其短裤、砍刀、手电筒、红色颜料乃至预制房屋已启程多时，但受托运输的白人调换了标签，将货物据为己有。正因遗产遭窃，祖先不得不介入，赋予巴布亚人抗争不公的力量。曼布运动的领袖被赐予了欧洲财富的密钥——金钱。他毫不畏惧也不羞于展示神迹，乐于凭空变出货币并慷慨分发，以此嘲弄殖民者。随着信徒们挥舞着用曼布馈赠购置的斧头、刀具等各式工具炫耀所得，这场神话之梦将愈发宏大，终将席卷万物。"
 nupela_pasin_subtype:0 "新式运动"
 nupela_pasin_subtype_desc:0 "§Y新式运动§!\n\n£GFX_ideology_soccon_nupela_pasin_subtype_bar\n\n\n\n\n新式运动通常指代巴布亚本土各派以欧洲模式推动现代化的群体。这些追随者与其说是对“新式”内涵达成共识，不如说更强调摒弃旧习，从巴布亚统一基督教会倡导的基督教化改良社会，到新人协会主张以资本主义村社网络重塑巴布亚，理念纷繁多样。但所有派系都推崇共和治理模式，并深信有效改革必须始于地方：中央政府应充当省级改革者的后盾，支持他们在村社层面推动多民族协作、经济改革与教育普及。这场运动的本质，正是让怀揣愿景的地方实践者成为变革的真正引擎。"
 marlib_popular_patriotism_subtype:0 "大众爱国主义"
 marlib_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义与其说是一种具体的意识形态，倒不如说是对于一群处境相似之团体的大致印象，亦即同国家民粹运动结盟的进步民主势力。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图糅合温和的左翼自由社会政策，遏制极端的民族主义形态，推行高度激进的公民爱国主义，并狂热谴责其眼中持续危害和平与繁荣的威胁——社会主义。"
 soccon_nupela_pasin_subtype:0 "新式运动"
 soccon_nupela_pasin_subtype_desc:0 "§Y新式运动§!\n\n£GFX_ideology_soccon_nupela_pasin_subtype_bar\n\n\n\n\n新式运动通常指代巴布亚本土各派以欧洲模式推动现代化的群体。这些追随者与其说是对“新式”内涵达成共识，不如说更强调摒弃旧习，从巴布亚统一基督教会倡导的基督教化改良社会，到新人协会主张以资本主义村社网络重塑巴布亚，理念纷繁多样。但所有派系都推崇共和治理模式，并深信有效改革必须始于地方：中央政府应充当省级改革者的后盾，支持他们在村社层面推动多民族协作、经济改革与教育普及。这场运动的本质，正是让怀揣愿景的地方实践者成为变革的真正引擎。"
 soccon_kritarchy_subtype:0 "判官统治"
 soccon_kritarchy_subtype_desc:0 "§Y判官统治§!\n\n£GFX_ideology_kritarchy_bar\n\n\n\n\n判官统治指的是因集权化的法律机构或者分权式的文化传统而起的法官、司法治国体系。历史上的判官统治同古代以色列的摩西政权密不可分，根据圣经记载，在扫罗建立王权之前，以色列一直由士师主导。不过除以色列之外，世界各地也有着各式判官统治的例子，例如公元前五世纪至公元五世纪布雷洪法时期爱尔兰的德鲁伊判官以及后续一直延伸到十三世纪的封建法官、九世纪至十三世纪冰岛自由邦的由前哥特祭司担任的世俗述法角色、十世纪至十四世纪撒丁岛上的审判官、十六世纪弗里西亚自由邦末期短命的判官统治。不过，判官统治并不是仅存在于中世纪之前的过时旧物，在当代的欧洲之外也存在着数个判官体系，索马里部族的习惯法、阿富汗社会的支尔格，以及部分学者眼中1803年美国联邦最高法院的马伯里诉麦迪逊一案让最高法院脱离了控制、逐步滑向司法统治就是例证。虽然一些边缘自由意志主义者、无政府主义研究者称判官统治是种原始的反国家主义形态，但具体到实践上，判官统治又千差万别、争议万千，部分相关的例子也在不断地经受着学者们的质疑与争论。无论如何，即使政府形态迥异，判官统治也总有着一些共同点，即对于司法与法治的坚持。"
 yali_gurek_theology_subtype:0 "雅利-古雷克神学"
 yali_gurek_theology_subtype_desc:0 "§Y雅利-古雷克神学§!\n\n£GFX_ideology_yali_gurek_theology_subtype_bar\n\n\n\n\n雅利-古雷克神学。又称第五船货崇拜，这部被部分人类学者称作第五船货信仰或简称为雅礼教派的体系，诞生于雅利目睹新加坡、悉尼等现代都市的集体记忆与古雷克神学创新的双重孕育。它既植根于赖海岸各族原始信仰，又受塔加拉布第四船货崇拜的启发，堪称巴布亚原住民数百年来试图理解并驾驭西方器物威能的最新尝试。与其他同类运动截然不同的是，雅利-古雷克神学断然摒弃了传教士灌输的福音书教义，正是这些传教士将古老神祇囚禁于悉尼博物馆。据古雷克诠释道：这实为传教士们常说的“罗马”。那些堕落的布道者更用“人类源于亚当夏娃”的荒谬说辞欺骗世人，全然无视进化真理。第五船货信仰主张重归巴布亚古神崇拜（因传教士余毒仍称其为“撒旦”），这些被囚禁的神明已从钉十字架的\"耶稣-马努普\"处习得船货奥秘。为迎接古神挣脱西方博物馆枷锁的回归，教派通过卡布祭典、莱图卜桌仪等原始仪式淬炼信众。届时，雅礼与古雷克的追随者将整装待发，在伟大酋长统帅下展开终极圣战，解放整个新几内亚，将欧洲殖民者逐回重洋彼岸。"
 tagarab_theology_subtype:0 "塔加拉布神学"
 tagarab_theology_subtype_desc:0 "§Y塔加拉布神学§!\n\n£GFX_ideology_tagarab_theology_subtype_bar\n\n\n\n\n塔加拉布神学，又称第四船货信仰，是早期盛行的莱图布教义与雅博布人传统信仰的集大成者。由米尔格库克先知塔加拉布创立的这一神学——如同多数船货崇拜运动般——坚信欧洲传教士刻意隐瞒获取“船货”所需的完整仪式与知识，企图独占财富。塔加拉布特别揭露了被“上帝使者”们掩盖的真相：雅博布传统神祇基利波布才是真神，而其兄弟马努普实为撒旦本尊。根据第四船货信仰广为流传的圣典，端坐悉尼统御澳洲福地的基利波布，曾以燃烧荆棘之姿向摩西显圣并赐下十诫。当摩西族人恪守诫命时，他们便获得了船货丰盈——这位神明在目睹巴布亚人数世纪受困于马努普领域后，决意重演神迹。但基利波布遭遇背叛：本应指引船货之道的传教士们玩弄诡计，只为填满私欲。震怒的神明即将率领先祖大军亲征巴布亚，驱逐这些背信者。信徒须恪守十诫（被视为欧洲人物质繁荣的基石），继续以路德宗仪式敬拜基利波布，以此履行神圣准备。随着教派势力遍及巴布亚，塔加拉布追随者自视为神圣使命的守护者：既要肃清马努普遗留的巫术腐败，更要为基利波布荣归净化全岛。在此框架下，宗教实践、社会秩序与政治权威皆与教派预言交织，形成一场神学驱动的净化革新运动。"
 tot_clientelism_subtype:0 "庇护主义"
 tot_clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 cargo_cult_subtype:0 "船货崇拜"
 cargo_cult_subtype_desc:0 "§Y船货崇拜§!\n\n£GFX_ideology_cargo_cult_bar\n\n\n\n\n人类学家开始使用船货崇拜与船货思维等术语，指代美拉尼西亚原住民发起的一系列新兴宗教运动——这些运动试图通过仪式手段来理解并驾驭欧洲船货的神秘力量。被殖民当局轻蔑地称作“瓦伊拉拉疯狂运动爆发”（得名于首个且最著名的崇拜运动）的船货崇拜，普遍具有反殖民倾向，谴责欧洲统治者因贪婪与欺诈隐瞒了船货的真正来源。虽然所有这类运动都宣称船货本质神圣，但对于应崇拜哪位神祇却存在分歧：塔加拉布运动与约翰·弗鲁姆运动等团体多以某种形式敬奉基督教上帝（通常同时祭拜祖先及本土神祇），而雅利运动等则完全信奉新异教信仰，更有如工团主义自由运动般向法国工团主义者等奇特存在祈祷以祈求繁荣，或是像玛拉菲撒旦教直接崇拜黑暗王子本尊。在仪式实践方面，许多船货崇拜要求信徒彻底抵制殖民当局，并指引他们通过重构的基督教与异教仪式取悦船货之神——例如瓦伊拉拉仪式中坐在阳台与祖先亡灵沟通，或在祖先震怒时举办欧式筵席安抚。尽管存在诸多差异，南太平洋诸岛居民仍共同凝望着浩瀚海域，期盼下一艘钢铁巨舰载来的丰饶物资属于他们，而非那些压迫者。"
 syn_clientelism_subtype:0 "庇护主义"
 syn_clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 syn_bukharinist_subtype:0 "布哈林主义"
 syn_bukharinist_subtype_desc:0 "§Y布哈林主义§!\n\n£GFX_ideology_bukharin_bar\n\n\n\n\n布哈林主义，亦称半市场社会主义，是由前俄国布尔什维克尼古拉·布哈林提出的思想体系，构成其领导的人民社会党纲领基础。内战结束后，布哈林提出革命失败的主因在于“战时共产主义”政策的失误——该政策导致农民阶层与布尔什维克彻底决裂，继而引发了经济危机。根据布哈林与经济学家尼古拉·康德拉季耶夫合著的论述，未来政府必须推行“新经济政策”，通过计划与市场机制相结合的国家调控实现向社会主义的渐进过渡，即该党成立大会上所言的“城市社会主义，乡村资本主义”。尽管布哈林主义自诩代表“真正的列宁主义”，但其立场在支持人民阵线与主张建立“新型政党”间摇摆不定，其支持者因此对工会的态度亦呈现分歧：一派主张扩大工会权力，另一派则要求将其改造为服从性生产联合体。"
 radsoc_cargo_cult_subtype:0 "船货崇拜"
 radsoc_cargo_cult_subtype_desc:0 "§Y船货崇拜§!\n\n£GFX_ideology_cargo_cult_bar\n\n\n\n\n人类学家开始使用船货崇拜与船货思维等术语，指代美拉尼西亚原住民发起的一系列新兴宗教运动——这些运动试图通过仪式手段来理解并驾驭欧洲船货的神秘力量。被殖民当局轻蔑地称作“瓦伊拉拉疯狂运动爆发”（得名于首个且最著名的崇拜运动）的船货崇拜，普遍具有反殖民倾向，谴责欧洲统治者因贪婪与欺诈隐瞒了船货的真正来源。虽然所有这类运动都宣称船货本质神圣，但对于应崇拜哪位神祇却存在分歧：塔加拉布运动与约翰·弗鲁姆运动等团体多以某种形式敬奉基督教上帝（通常同时祭拜祖先及本土神祇），而雅利运动等则完全信奉新异教信仰，更有如工团主义自由运动般向法国工团主义者等奇特存在祈祷以祈求繁荣，或是像玛拉菲撒旦教直接崇拜黑暗王子本尊。在仪式实践方面，许多船货崇拜要求信徒彻底抵制殖民当局，并指引他们通过重构的基督教与异教仪式取悦船货之神——例如瓦伊拉拉仪式中坐在阳台与祖先亡灵沟通，或在祖先震怒时举办欧式筵席安抚。尽管存在诸多差异，南太平洋诸岛居民仍共同凝望着浩瀚海域，期盼下一艘钢铁巨舰载来的丰饶物资属于他们，而非那些压迫者。"
 socdem_lerrouxismo_subtype:0 "勒鲁主义"
 socdem_lerrouxismo_subtype_desc:0 "§Y勒鲁主义§!\n\n£GFX_ideology_lerrouxismo_bar\n\n\n\n\n勒鲁主义（常被其众多敌手如此称呼）是西班牙特有的意识形态混合体，这种意识形态围绕其创立者亚历杭德罗·勒鲁形成，糅合了激进主义、雅各宾思想、群众动员的民粹原则，以及近乎个人崇拜的领袖追随。尽管勒鲁及其政党激进共和党在西班牙第二共和国时期及后续军政府统治下的政治立场剧烈摇摆，但勒鲁主义的核心本质始终如一：它以激烈的反教权言论、对加泰罗尼亚分离主义的强烈抵制，以及对敌手的强硬手段为特征，勒鲁及其追随者不惜使用暴力、贿赂和犯罪手段达成目标。在普里莫·德·里韦拉独裁时期，勒鲁主义者甚至参与针对国王阿方索十三世的暗杀行动，有时反常地与加泰罗尼亚无政府主义者结盟。与典型中产阶层及知识分子构成的中立政党支持基础不同，勒鲁主义极度依赖工人群体（尤其是加泰罗尼亚工业区），勒鲁通过煽动移民对本土加泰罗尼亚人的不满来为其激进派系争取支持。\n\n这些被勒鲁称为“野蛮青年”的支持者，被鼓励以极端手段摧毁当时西班牙教会及保守机构的控制。勒鲁主义者还通过掌控工人娱乐中心（如巴塞罗那的帕拉莱洛街）强化其民粹策略。这种控制使该党得以保持与基层激进分子及赌博犯罪集团的紧密联系。尽管西班牙政局风云变幻，勒鲁的蛊惑能力与灵活性仍使该主义得以存续，但鉴于该党自酿的丑闻恶名，其策略未必总能带来最佳结果。"
 soccon_imaginism_subtype:0 "幻想主义"
 soccon_imaginism_subtype_desc:0 "§Y幻想主义§!\n\n£GFX_ideology_imaginism_bar\n\n\n\n\n由著名而神秘的娱乐大亨沃尔特·埃利亚斯·“华特”·迪士尼构想出的幻想主义，是旁观者对华特叔叔融合多元的奇特个人理念的戏称——该词源自华特本人提出的“幻想工程”，即通过设计并实施极具想象力的概念、系统与技术来推动社会进步、提升生活品质的实践。成长于公理宗基督教家庭，华特的思想脉络深受复杂背景影响：父亲是务实的社会主义者，虽父子情深却始终反对其艺术道路；母亲不涉政治且虔诚宗教，呵护着他的创造力。这种成长环境塑造了他失衡的政治融合倾向——以基督教道德观为基底，结合反工会人道资本主义（主张由迪士尼这类手段温和的企业主导），辅以保守社会规范，所有这一切又受其本人对现代乌托邦主义、未来主义及跨流派技官主义理念的热衷所支撑。然而据迪士尼自述，私下里的他羞怯、缺乏安全感且惯于自贬，温暖亲切的公众形象仅是刻意营造。若非身处密厅，他基本保持政治中立，将多数对外政治事务交由信赖的专家、助手及民主党盟友处理，转而将聚光灯聚焦于自己全权掌控的宏大项目——例如明日社区试验原型。这座迪士尼规划中的未来主义企业城镇，旨在构建由他本人作为仁慈独裁者统治、通过社区治理吸纳民意的自治可持续城邦，而某些观察家认为这实则是其全国性构想的雏形。作为罕见兼具资金、声望与人脉来实现愿景的理想家，华特·迪士尼正凭借这套奇特信念体系，试图引领美国乃至全人类即刻迈入科技璀璨的明日之境——只要世人愿循其指引前行。"
 imaginism_subtype:0 "幻想主义"
