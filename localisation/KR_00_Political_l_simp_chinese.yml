 left_boulangism_subtype:0 "左翼布朗热主义"
 left_boulangism_subtype_desc:0 "§Y左翼布朗热主义§!\n\n£GFX_ideology_left_boulanger_bar\n\n\n\n\n曾险些推翻了法兰西第三共和国的乔治·布朗热之理论布朗热主义，不仅是现代法国右翼民粹运动形成过程中的一股主导力量，还在左翼有着一定的影响力。左翼布朗热主义同布朗热主义一样多元化，加布里埃尔·泰拉伊、阿尔弗雷德·纳凯、弗雷德里克·布勒、让·普拉西德·蒂里尼等人都有着各自的拥趸，不过，在以下几点上，各派见解都出奇的一致：一位有名望有魅力的强人领袖、强烈的对德复仇情绪、从废除银行完全国营到保护私人财产并授之以特权以同外国竞争的监管式经济体系、诸如八小时工作制与带薪休假一类的社会改革、工农合作等或爱国主义或民族主义，又事关法兰西国家自豪感的事物。"
 yellow_syndicalism_subtype:0 "黄色工团主义"
 yellow_syndicalism_subtype_desc:0 "§Y黄色工团主义§!\n\n£GFX_ideology_yellowsyn_bar\n\n\n\n\n黄色工团主义可谓意识形态领域一朵实打实的奇葩，其提倡以工会的形式发声，捍卫无产阶级的价值观与权利，而非去攻击雇主或其立场。“黄派”起源于1899年克鲁索的施耐德矿场大罢工，他们与“红派”，也就是革命社会主义者有着相同的诉求，但却视罢工为一种南辕北辙的行为，甚至还主动协助当局破坏罢工。皮埃尔·比耶特里把接连于法国各地冒头的黄色工会联合了起来，并打出了“劳动、家庭与祖国”的口号。除此之外，比耶特里还进一步发展了这一理论，彻底抛却了雇主是工人阶级的天生之敌的革命路线，把矛头对准了德国人和犹太人，在组织内部营造出了一种强烈的民族主义情绪，并且在1919年革命之前还一直在收着资本家的钱对付红色工团主义运动。比耶特里还仿照国王报贩和火十字团，教授工会成员以武装作战技巧，方便他们实现其最终目标：建立起优越于现行公社体制的民主、社会与民族的法兰西工团共和国。"
 syn_kotahitanga_subtype:0 "团结运动"
 syn_kotahitanga_subtype_desc:0 "§Y团结运动§!\n\n£GFX_ideology_kotahitanga_bar\n\n\n\n\n团结运动，又称泛毛利运动，是一场始于19世纪30年代的政治、文化运动。团结运动旨在团结全体毛利人，将毛利人的传统部落组织统一为一个具有凝聚力的现代非部落式联盟。然而，这种泛毛利团结的想法本身就远远算不上统一，不同的团结运动分支在多年来尝试了无数种可能的方式来团结起“大地生民”，如宗教、民主制议会、共同的历史和文化、现代毛利民族主义以及其它一些模棱两可的要素。如今，泛毛利思想的主要推动者是拥王运动，该运动由19世纪50年代第一位毛利人国王波塔陶·泰·费罗费罗领导的北岛怀卡托太奴伊部落联盟发起。拥王运动虽然并非唯一的泛毛利运动组织，但他们却擎过了现代团结的火炬，致力于将奥特亚罗瓦的各大部落团结在共同的国王，也即获选的泰·费罗费罗王朝之下。虽然在如何建立泛毛利联盟的问题上存在分歧，但各个泛毛利运动的追随者都在一件事上意见一致——作为新西兰土著，毛利人必须团结在一面旗帜下，这样才能在即将到来的现代化风暴保住自己与自己的文化。"
 meritocratic_liberalism_subtype_desc:0 "§Y精英自由主义§!\n\n£GFX_ideology_meritocratic_liberalism_bar\n\n\n\n\n波罗的德意志民主党所奉行的意识形态来源于保罗·席曼，而对其最恰当的称呼莫过于“精英自由主义”。精英自由主义推崇不论宗教、民族和社会地位的人权与机会平等，不过，这里所说的平等并不包含结果平等，也不保证政治权利的平等——统治权仅应留给那些有能之士，并且受过教育的精英就应该比没有受过教育的平民百姓拥有更多的政治权利。精英自由主义寻求建立一种协作的精英政治体制，在这一体制下，政府由来自各社会团体和政界的专家代表组成，其首要任务是建立一个自由、教育发达、文化开明的社会，每一位公民都能凭借着自身的努力向上攀升、加入精英阶层。"
 soccon_prussian_constitutionalism_subtype:0 "普鲁士宪政主义"
 soccon_prussian_constitutionalism_subtype_desc:0 "§Y普鲁士宪政主义§!\n\n£GFX_ideology_prussian_constitutionalism_bar\n\n\n\n\n根据《德意志帝国宪法》，普鲁士宪政主义旨在维护传统等级制度的前提下满足人民对民主的期许，是一种独特的半君主立宪制。在普鲁士宪政主义体制下，君主身为国家元首掌握着实权，有权任命包括政府首脑在内的百官司吏，民主投票采用限制性的三级制度，富人拥有更大的话语权，从本质上来说，普鲁士宪政主义的目的就是把“开明”君主专制和精英治国转化为无可撼动的事实。除去上述特点外，普鲁士宪政主义也包含着对民主理念的妥协，其中立法委员就是经由帝国公民投票产生的，这也赋予了民众部分政府的职权。强大的军队也是普鲁士宪政主义的一部分，由于帝国军队的最高统帅由皇帝一人亲自兼任，所以帝国的军事扩张之野心往往没有界限。\n\n普鲁士宪政主义始于德国，而德国在世界大战中的胜利让许多传统君主制国家纷纷效仿起德皇，按照实际需要对德意志宪法中的部分内容进行了修订，形成了自己全新的体制，既巩固了君主自身的权力，又给予了人民谈论国事的权利。此外，君主拥有实际行政权力的半君主立宪制国家，就算与德意志帝国没有半点关系，也被归入了普鲁士宪政主义之列。"
 soccon_negritude_subtype:0 "黑人集体意识"
 soccon_negritude_subtype_desc:0 "§Y黑人集体意识§!\n\n£GFX_ideology_negritude_bar\n\n\n\n\n黑人集体意识原是散居世界各地的黑人法语知识分子们提出的一种文学理论批判框架，而后发展成了一种独特的左翼泛非主义形式，不过，其支持者提倡的多是简单的泛非合作，并非真正的政治联盟。黑人集体意识最早由马提尼克的姐妹花作家波莱特·纳达尔和让娜·纳达尔提出，后在马提尼克诗人艾梅·塞泽尔、塞内加尔思想家阿卜杜拉耶·萨吉和利奥波德·塞达尔·桑戈尔、法属圭亚那的莱昂·达马斯，以及吉尔贝·格拉蒂昂、莱昂纳尔·桑维尔、路易·T·阿希尔、阿里斯蒂德·莫热等人的帮助下传播开来。黑人集体意识以合作为核心，它反对殖民主义、种族主义、帝国主义、厚此薄彼、欧洲中心论，提倡在法非关系持久化的大背景下推动焕然一新的独立非洲文化，撕下非洲文明所背负的污名，提高全世界非裔人口的地位，并在平等的基础之上开展合作交流。黑人集体意识以黑人激进传统中的马克思主义政治理论为基础，不过，在第三国际和各式进步民粹运动对非洲大陆的不断影响之下，尤其是在作为黑人集体意识运动支柱的非洲超现实主义艺术吸收了欧洲的超现实主义、未来主义概念之后，社会民主主义、工团主义、国家工团主义，甚至是更加极端的左翼分支等非马克思的社会主义思想，以及刚果老牌政治家让·博利坎戈所主张的保守基督教社会民粹主义等非左翼思想也变得越来越常见。黑人集体意识与其同类，如海地的黑人至上主义、黑人土著主义、克里奥尔骄傲精神，以及纽约市和美国黑带的非裔加勒比美国人提出的“黑就是美”的理念等，共同构成了法语非洲的主流思想，它反对非洲文化的同化以及非洲文明低人一等的说法，致力于将整个法语非洲地区带向康庄大道，使其作为一个整体（或者至少以合作的方式）同世界的其它势力平起平坐，让身为黑人这件事本身成为一件值得自豪的事情。"
 kritarchy_subtype:0 "判官统治"
 kritarchy_subtype_desc:0 "§Y判官统治§!\n\n£GFX_ideology_kritarchy_bar\n\n\n\n\n判官统治指的是因集权化的法律机构或者分权式的文化传统而起的法官、司法治国体系。历史上的判官统治同古代以色列的摩西政权密不可分，根据圣经记载，在扫罗建立王权之前，以色列一直由士师主导。不过除以色列之外，世界各地也有着各式判官统治的例子，例如公元前五世纪至公元五世纪布雷洪法时期爱尔兰的德鲁伊判官以及后续一直延伸到十三世纪的封建法官、九世纪至十三世纪冰岛自由邦的由前哥特祭司担任的世俗述法角色、十世纪至十四世纪撒丁岛上的审判官、十六世纪弗里西亚自由邦末期短命的判官统治。不过，判官统治并不是仅存在于中世纪之前的过时旧物，在当代的欧洲之外也存在着数个判官体系，索马里部族的习惯法，以及部分学者眼中1803年美国联邦最高法院的马伯里诉麦迪逊一案让最高法院脱离了控制、逐步滑向司法统治就是例证。虽然一些边缘自由意志主义者、无政府主义研究者称判官统治是种原始的反国家主义形态，但具体到实践上，判官统治又千差万别、争议万千，部分相关的例子也在不断地经受着学者们的质疑与争论。无论如此，即使政府形态迥异，判官统治也总有着一些共同点，即对于司法与法治的坚持。"
