 soccon_hearstian_democracy_subtype:0 "赫氏民主"
 soccon_hearstian_democracy_subtype_desc:0 "§Y赫氏民主§!\n\n£GFX_ideology_hearstian_bar\n\n\n\n\n由异见民主党人、传媒大亨、官能主义记者威廉·伦道夫·赫斯特所拟定的赫氏民主是赫斯特自身及其国家民主党的政治总述。出身富裕议员家庭的赫斯特的竞选之路曾一度与进步运动相挂钩，那时的赫斯特先后在纽约市创办了反坦慕尼市政独占联盟和独立党，在工会成员、移民和老牌政党的帮助下为终结腐败的政治攻讦、施行任人唯贤的改革而东奔西走。虽然公共设施市政所有和精英之治等理念在如今被视作利好成功富人的又一手段，但赫斯特却将其贯彻始终，并带着它们转向了保守主义。美国陷入危机后，赫斯特成立了国家民主党，誓言要打击社会顽疾、药物滥用、违法犯罪、红色威胁，以及最为重量级的“黄祸”。在赫氏民主体制下，有能耐的企业家会被视为社会楷模，享受减税的福利待遇；工会会被国有化，形成一套“美式法团主义”的架构；政治化的联邦警察会不分昼夜地追捕社会主义者、沉迷毒品的外来移民和坑蒙拐骗之徒。此外，赫斯特的举措还包括但不限于受禁酒州失败经历的影响而搞出的酒业全盘国有化、为了加州梦去大兴土木征服自然、建立国家工业局统筹管理薪资和物价、推动阶级合作等。虽说赫氏民主建立在对媒体和国家机器的完全掌控，以及国际孤立之上，但境外的反贼恶匪们也别以为自己能逍遥法外，赫斯特是不会放过他们的，1898年的美西战争即是前车之鉴。"
  kr.political.28.t:0 "紧急关闭"
 kr.political.28.d:0 "如果您看到此事件，意味着您的游戏中发生了以下三种情况之一：德国的国名显示为墨西哥摄政国、西藏的国名显示为德克萨斯王国、外阿穆尔的国名显示为德克萨斯王国。这些情况均表明您的游戏存在漏洞，原因可能是加载更新前的旧存档或运行了过时/不稳定的子模组。关闭此事件后，将生成一座地图外雷达站，导致游戏崩溃。这也意味着您需要重开一局游戏，并确保不使用任何可能破坏游戏的内容，且不要提交无用的漏洞报告，因为所有能应用上述装饰性国名的事件都仅适用于其原本设计的国家标签（即墨西哥和德克萨斯），除非您进行了会导致游戏崩溃的操作。"
