 costismo_subtype:0 "科斯塔主义"
 costismo_subtype_desc:0 "§Y科斯塔主义§!\n\n£GFX_ideology_costismo_bar\n\n\n\n\n西班牙的衰落并非突然到来，恰恰相反，这个曾经无可争议的新世界霸主，在1898年于篡位者美国手中彻底瓦解——彼时的西班牙充其量只是个二流强国。美西战争之后，关于衰落根源的争论异常激烈，但鲜有人能像阿拉贡法学家兼改革家华金·科斯塔那样，为国家未来提出如此详尽的方案。尽管怀有保守思想，科斯塔仍将西班牙的衰落归咎于其对帝国的执迷：当国家将数百万比塞塔挥霍于改善加勒比与亚洲属地之时，伊比利亚本土却在发展中被遗忘为穷乡僻壤。科斯塔的意识形态——被称为科斯塔主义、科斯塔式再生主义乃至新自由主义——既融合了宏伟的民族抱负，又包含细致的区域微观管理，这使其在再生派知识分子、土地改革者乃至地区主义者中赢得广泛支持。科斯塔思想的核心，是对“轮替制”体制、腐败的豪强权贵及其催生的非洲殖民野心的深切憎恶。他认为西班牙必须彻底重塑欧洲模式，倾尽所有资源完成这一使命，而农业改革则是推动变革的核心动力。他提出的政策涵盖权力下放、市政自治、西班牙国土再造林、实施乔治主义土地再分配、广泛的社会福利计划、水利工程扩建，以及基于弗朗西斯科·希内尔·德·洛斯里奥斯教学法的教育改革等众多举措——所有这些都包裹在面向普罗大众的修辞与文学风格之中。在外交政策上，科斯塔主义者希望彻底摒弃殖民主义，与摩洛哥建立兄弟般的情谊以保护其免受列强侵犯，同时普遍主张在其他事务中保持中立。该运动致力于锻造一位铁腕而深得民心的“铁腕外科医生”，通过紧急改革精准切除侵蚀西班牙的病灶，不受腐败体制或低效议会的干扰——尽管某些科斯塔的自由派追随者往往淡忘这位思想家对议会制的憎恶。科斯塔曾期望通过改革“将熙德之墓加上双重锁链，使其永不复出”，但1911年他的逝世使这些宏愿未竟。从安达卢西亚的乔治主义进步派与自由派，到阿拉贡地区主义者，乃至威权保守派与军人集团，众多团体试图在自身政策中召唤科斯塔的遗风，但鲜有人真正全盘接纳科斯塔那驳杂且常自相矛盾的纲领。"
