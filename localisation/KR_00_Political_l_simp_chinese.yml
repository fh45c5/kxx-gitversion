 natpop_tribal_chiefdom_subtype_desc:0 "§Y部落家长制§!\n\n£GFX_ideology_tribal_chiefdom_bar\n\n\n\n\n部落家长制，有时会被西方人错误地称为“酋长制”或部落君主制，是对分散在南北美、非洲以及亚洲和大洋洲的各种类型部落政府的描述，这些政府以世袭或民选的酋长或其他领导人为中心。从民主选举出的部落主席到完全世袭的酋长，这些政府的运作方式与欧洲君主制相似，但不那么带有华贵性。部落家长制国家因为对人民旧时传统的尊重而团结在一起，致力于为民众提供非社会主义的家长制民粹主义，促进社会内部所有人民的共同繁荣。他们之间的主要区别在于如何组织经济，趋向现代主义还是传统主义，领导人的性质以及拥有多少权力。"
 baltic_christianity_subtype:0 "条顿复兴主义"
 baltic_christianity_subtype_desc:0 "§Y条顿复兴主义§!\n\n£GFX_ideology_teuton_bar\n\n\n\n\n条顿复兴主义是波罗的兄弟会遵循着的煽动性意识形态，也就是将激进基督教理念和波罗的德意志人例外主义这两者兼收并蓄的思想。它起源于一个千禧年主义的宗教运动，宣称要重新解读圣经，并呼吁整个欧洲重新恢复基督教道德思想。兄弟会将波罗的德意志民族的历史视为宗教战争和坚定信仰的历史，因此兄弟会相信，波罗的德意志人的任务应当是在面对东方势力和工团主义冲击时拥护基督教复兴。兄弟会还狂热地忠于泛德主义，认为德意志帝国应该在这场运动中承担起领导欧洲的作用，因此它定要把波罗的国家变成“民族复兴”的模范省份，让波罗的成为帝国的榜样。条顿复兴体制奉行极权主义，并且狂热地献身于基督教理想，实施严厉的军国主义。"
 KR_monarcho_socialist_state:0 "是社会主义君主制"
 KR_monarcho_socialist_state_NOT:0 "§R不是§!社会主义君主制"
 mexicayotlism_subtype:0 "墨西加本质主义"
 mexicayotlism_subtype_desc:0 "§Y墨西加本质主义§!\n\n£GFX_ideology_mexicayotlism_bar\n\n\n\n\n墨西加本质运动，有时也被称为墨西加本质主义或墨西加本质思想，指的是推动卡拉斯科复辟的阿兹特克帝国的人性化、社会化和民主化的一场运动。这场激进运动的形成受到了墨西哥革命行动支持的墨西加和纳瓦的混合式民族主义的影响，以早已在历史上消失的美索美洲宗教为支柱，意图将阿兹特克人身份认知，现代化的墨西哥和奇卡诺民族主义以及墨西哥革命的理念相融合，提倡社会主义的土地改革、革命民主，以及真正的平等主义。由于人民和政府授予了受人敬爱的团结象征与国家元首弗里达·卡罗前阿兹特克统治者的头衔和神祇的绰号，在卡罗以及其余阿兹特克三邦同盟的精英后裔们领导下的墨西加本质运动乍看之下似乎与君主制度无异。然而，事实上卡罗掌握的政治权力极少，她只是作为国家精神和文化上的领袖，以及团结新民主制度的象征而存在。在托尔特卡特尔的指引下，墨西加本质运动把去除了中心论与优越论的土著民族主义、美索美洲的传统实践、新萨满教以及美索美洲文艺复兴，与社会主义土地改革、革命共和主义和社会进步主义等左翼思想融合在了一起，一心要将早已消亡的阿兹特克帝国转变为一个适应现代，真正民主的阿兹特克共和国。"
 socdem_christian_socialism_subtype:0 "基督教社会主义"
 socdem_christian_socialism_subtype_desc:0 "§Y基督教社会主义§!\n\n£GFX_ideology_christ_socialism_bar\n\n\n\n\n基督教社会主义是工团主义范式之外传播最广的社会主义形式之一，特别是在那些人民相当保守和虔诚的国家内尤为常见。基督教社会主义力图在社会主义的框架内创造一个与耶稣基督的教义相吻合的社会，然而，不同个例所从属的基督教派别与社会主义形式可能会有很大的不同。"
 figuerismo_subtype:0 "菲格雷斯主义"
 figuerismo_subtype_desc:0 "§Y菲格雷斯主义§!\n\n£GFX_ideology_figuerismo_bar\n\n\n\n\n菲格雷斯主义是一种奇特的社会民主主义和民主社会主义的混合体，还融入了哥斯达黎加的土著和克里奥尔人元素。这种意识形态由何塞·菲格雷斯·费雷尔提出，因此也以他的名字命名，它旨在通过一系列改变国家运作的方方面面的政治法令，推动整个社会朝着乌托邦发展。菲格雷斯主义坚定地奉行平等主义和社会进步，主张为每位人民提供选举权，免费公共教育和社会福利，不论其性别、教育地位或种族。尽管费雷尔呼吁对银行等重要行业国有化，并废除常备军队，以打击中美洲特有的考迪罗军阀现象，但他绝非红色势力的一员。包括共产党在内的极左势力与任何受美国资助的右翼军事独裁者一样，都会受到费雷尔的重拳出击，因为费雷尔自认只有他和他的同僚才最能建设好自己的国家。"
 socdem_colonial_govt_subtype:0 "社会殖民政府"
 socdem_colonial_govt_subtype_desc:0 "§Y社会殖民政府§!\n\n£GFX_ideology_colonial_govt_bar\n\n\n\n\n殖民政府是宗主国用以管理殖民地和租界的政权。殖民政府通常没有任何具体的意识形态，单纯是以官僚机构的名义进行殖民地的管理。从这个意义上说，殖民政府的职责只是维持殖民主义和帝国主义的齿轮运转，还有将利润导向祖国。殖民政权也会毫不犹豫地镇压反对派，以确保殖民地的生存，不过，在如何完成这项任务以及如何组织具体的行政部门和对祖国的忠诚度方面通常又有相当大的不同。"
 soclib_colonial_govt_subtype:0 "自由殖民政府"
 soclib_colonial_govt_subtype_desc:0 "§Y自由殖民政府§!\n\n£GFX_ideology_colonial_govt_bar\n\n\n\n\n殖民政府是宗主国用以管理殖民地和租界的政权。殖民政府通常没有任何具体的意识形态，单纯是以官僚机构的名义进行殖民地的管理。从这个意义上说，殖民政府的职责只是维持殖民主义和帝国主义的齿轮运转，还有将利润导向祖国。殖民政权也会毫不犹豫地镇压反对派，以确保殖民地的生存，不过，在如何完成这项任务以及如何组织具体的行政部门和对祖国的忠诚度方面通常又有相当大的不同。"
 marlib_colonial_govt_subtype:0 "商业殖民政府"
 marlib_colonial_govt_subtype_desc:0 "§Y商业殖民政府§!\n\n£GFX_ideology_colonial_govt_bar\n\n\n\n\n殖民政府是宗主国用以管理殖民地和租界的政权。殖民政府通常没有任何具体的意识形态，单纯是以官僚机构的名义进行殖民地的管理。从这个意义上说，殖民政府的职责只是维持殖民主义和帝国主义的齿轮运转，还有将利润导向祖国。殖民政权也会毫不犹豫地镇压反对派，以确保殖民地的生存，不过，在如何完成这项任务以及如何组织具体的行政部门和对祖国的忠诚度方面通常又有相当大的不同。"
 clientelism_subtype:0 "庇护主义"
 clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 soccon_colonial_govt_subtype:0 "保守殖民政府"
 soccon_colonial_govt_subtype_desc:0 "§Y保守殖民政府§!\n\n£GFX_ideology_colonial_govt_bar\n\n\n\n\n殖民政府是宗主国用以管理殖民地和租界的政权。殖民政府通常没有任何具体的意识形态，单纯是以官僚机构的名义进行殖民地的管理。从这个意义上说，殖民政府的职责只是维持殖民主义和帝国主义的齿轮运转，还有将利润导向祖国。殖民政权也会毫不犹豫地镇压反对派，以确保殖民地的生存，不过，在如何完成这项任务以及如何组织具体的行政部门和对祖国的忠诚度方面通常又有相当大的不同。"
 pataut_baltic_christianity_subtype_desc:0 "§Y条顿复兴主义§!\n\n£GFX_ideology_teuton_bar\n\n\n\n\n条顿复兴主义是波罗的兄弟会遵循着的煽动性意识形态，也就是将激进基督教理念和波罗的德意志人例外主义这两者兼收并蓄的思想。它起源于一个千禧年主义的宗教运动，宣称要重新解读圣经，并呼吁整个欧洲重新恢复基督教道德思想。兄弟会将波罗的德意志民族的历史视为宗教战争和坚定信仰的历史，因此兄弟会相信，波罗的德意志人的任务应当是在面对东方势力和工团主义冲击时拥护基督教复兴。兄弟会还狂热地忠于泛德主义，认为德意志帝国应该在这场运动中承担起领导欧洲的作用，因此它定要把波罗的国家变成“民族复兴”的模范省份，让波罗的成为帝国的榜样。条顿复兴体制奉行极权主义，并且狂热地献身于基督教理想，实施严厉的军国主义。"
 navajo_debug:0 "生成纳瓦霍"
 esperanto_syndicalism_subtype:0 "世界语工团主义"
 esperanto_syndicalism_subtype_desc:0 "§Y世界语工团主义§!\n\n£GFX_ideology_esperanto_bar\n\n\n\n\n世界语工团主义是在传统欧式工团主义及其变种（如无政府工团主义和集权工团主义）的核心信条上发展而来，但更为强调国际主义和反民族主义的全球社会主义合作。波兰医生L·L·柴门霍夫构建的世界语积极推动着这一国际主义事业，世界语融合了多种真实语言和人造语法规则，旨在成为能供全人类使用的普世语言。一部分世界语工团主义者偏好国际主义合作，对建立统一国家较为抗拒，但另一部分则憧憬着将全球统一在单一的工团主义乌托邦——世界语界的旗下，如此便能凭借共同的语言和不断发展的全球工团主义文化，让全人类在工团主义红星的照耀下迈入真正的平等主义。"
 vlasovism_subtype:0 "弗拉索夫主义"
 vlasovism_subtype_desc:0 "§Y弗拉索夫主义§!\n\n£GFX_ideology_vlasov_bar\n\n\n\n\n弗拉索夫主义是对统一俄罗斯的最高统治者和复国者安德烈·弗拉索夫所提出的思想的总称。作为意识形态“变色龙”，弗拉索夫在俄罗斯和顿河的政治光谱中经历了漫长而多样的旅程，一路上，他对从左到右的各类理论和纲领都有所涉猎。弗拉索夫主义以实用和机会主义为基础，很难完全定义，但基本带有着专制及军国主义倾向、追求在弗拉索夫政治机器下的联邦共和制度，并毫不掩饰对俄罗斯民族主义和非激进爱国主义思想的强烈支持。"
 humanistic_capitalism_subtype:0 "人道资本主义"
 humanistic_capitalism_subtype_desc:0 "§Y人道资本主义§!\n\n£GFX_ideology_humanistic_capitalism_bar\n\n\n\n\n人道资本主义希望在温和资本主义框架内，将人道主义与追逐利润统合起来。人道资本主义社会和其他资本主义社会一样，以市场手段实现经济繁荣，但其方式更为人道，更多地关注人民的需求、安全、健康，根据国情不同，对社会、文化甚至精神文明的发展也可能有更多投入。人道资本主义者以全国政府的无形之手取代模糊的市场力量，他们以此为指导，打造经济公平的金融体制，建立利润滚滚的乌托邦，在这里，无论是谁都有均等的机会，实现最天马行空的梦想。"
 anarcho_pastoralism_subtype:0 "军事无政府游牧主义"
 anarcho_pastoralism_subtype_desc:0 "§Y军事无政府游牧主义§!\n\n£GFX_ideology_anarcho_pastrolism_bar\n\n\n\n\n西方观察家所称的威权/军事无政府游牧主义与其说是界定明确的意识形态，还不如说是描述在红可汗嘎达梅林治下蒙古自然演化出的社会现实。这种思想难以准确定义，从外界观察时甚至有些自我矛盾。在这融入草原生活特色的新左派社会中，红可汗被视为铁木真大汗说不明道不白的社会主义思想版继承人、长生天的新化身以及现世神，作为蒙古唯一的权威，红可汗大体上指导着蒙古人民继续传统蒙古游牧主义路线，同时以他麾下游荡的安保力量（基本为曾经的游牧贵族与强盗）维持社会安定。红可汗那偏向威权的平衡者势力是新蒙古唯一的军事和治安部队，而无政府主义大会深红库里尔台则是他们的合作者，负责创立、组织和运作各路迥然不同的游牧部落、合作社、集体企业和公社，这些社会组织正如雨后春笋般在复兴的蒙古汗国四境之内不断涌现。在这由流动的蒙古包与临时定居点组成的反国家主义大网之上，是松散的三头政权的最后一环，即博格多喇嘛和幸存僧侣主管的精神政权，通过宣扬统合了佛教、长生天信仰和传统蒙古萨满教的融合宗教，来促进泛蒙古民族的统一，疗愈蒙人党无神论清洗造成的伤害。在红可汗治下，旧蒙古帝国以新社会主义的形态重生了，这个国家将奉行军事家长制与蒙古宗教传统，同时融入准无政府游牧主义、宗教融合、泛蒙古民族主义和游牧社群主义的思想，为所有伟大的成吉思汗的传人，建立一个由长弓骏马守护的平等无政府田园牧歌式游牧天堂。"
 tot_tridemism_subtype:0 "三民主义"
 tot_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
