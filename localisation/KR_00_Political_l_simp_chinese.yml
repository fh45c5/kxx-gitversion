 tot_egoism_subtype:0 "利己主义"
 tot_egoism_subtype_desc:0 "§Y利己主义§!\n\n£GFX_ideology_indiv_anar_bar\n\n\n\n\n无政府主义理论家麦克斯·施蒂纳曾大胆宣称：“不仅要废除国家，还要废除那个作为对其成员负责之机构的社会。”施蒂纳的真实身份乃至其历史存在至今仍存有争议，而他是利己主义运动，有时也被称为利己主义无政府主义，偶尔亦称作施蒂纳主义的核心人物。利己主义的思想根源可追溯至个人主义无政府主义与罪犯无政府主义的理论土壤，施蒂纳的著作在多个层面启发了这两种思潮。不过，个人主义无政府主义探讨的是通常基于天赋人权的个体性概念，罪犯无政府主义则试图将犯罪作为社会变革和革命的工具，而利己主义既不关心社会，也不关心革命，甚至对人类整体都毫无兴趣。在施蒂纳看来，天赋人权与社会不过是虚幻的构造，或者用他偏爱的说法，是一些“幽灵”；唯有将视线完全转向自我，且仅仅转向自我，才能实现真正的解放。从这个意义而言，利己主义本身就是一场发生在人类关系领域的革命。按照施蒂纳的构想，国家只能被所谓的“利己主义者联盟”所取代，成员们通过不断更新对联盟的支持来缔结一种联合契约，这种契约既不会赋予联盟对其成员的支配权，又能让成员实现互惠互利。倘若某位成员发现自己付出多于所得，这个联盟便无法继续履行其作为联盟的应有职能，此种状况必须借助于有意识地践行利己主义行为来加以规避。利己主义者联盟的真正意义，在于构筑一个联合体，其中合作源于为他人行事时所获得的愉悦感，同时又能保持成员自身的主权与独立。利己主义者同样不相信财产所有权建立在社会契约之上，而仅仅认为权利来自为满足自身需求而捍卫及夺取财产的能力。尽管利己主义与施蒂纳本人紧密相连，弗里德里希·尼采的著作亦对这一意识形态产生了深远影响，不过利己主义者在尼采是否可以被归属于其中一员的问题上仍存在分歧。利己主义代表着个人主义意识形态的极端诠释形式，不为个体设置任何道德或社会层面的障碍，因此它在更倾向于集体主义的无政府主义理论家中不乏批评者。尽管如此，利己主义同样拥有众多捍卫者，从美国的本杰明·塔克与史蒂文·T·拜因顿，到欧洲思想家如约翰·亨利·麦凯、赫伯特·里德、萨洛莫·弗里德兰德以及米格尔·希门尼斯·伊瓜拉达。"
 jangali_thought_subtype:0 "森林运动"
 jangali_thought_subtype_desc:0 "§Y森林运动§!\n\n£GFX_ideology_jangali_thought_bar\n\n\n\n\n森林运动并非一般意义上的哲学或意识形态，而更像是伊朗布尔什维克们的朦胧理想。当年，森林运动在吉兰省风起云涌，布尔什维克们在遭遇惨败后，一路撤退并蛰伏于乌尔米耶，在那里孕育出了这一思想。这场运动由米尔扎·库切克汗亲自领导，其初衷并无深厚的意识形态根基，仅仅是为了拥护立宪并反抗君主专制。为此，库切克汗本人曾与立宪派、伊斯兰主义者以及马克思主义者展开合作。然而，内战末期的动荡局势最终导致了这位吉兰英雄的殉道。少数未在战火中牺牲的追随者一路向西逃亡，退守大不里士。在这些幸存者中，森林运动的马克思主义派占据了主导，他们自诩为库切克汗遗志与精神的正统继承人。由此，一种结合马克思列宁主义哲学与神化米尔扎·库切克汗的思想应运而生。库切克汗从一位殉难的民间英雄，跃升为伊朗社会主义的最高先驱，与马克思、恩格斯等人并列，被奉为革命偶像。这一鲜明特质使森林运动有别于正统社会主义，并为其注入了原本缺失的伊朗民族主义色彩，因此，它在农民阶层等社会观念较为保守的民众中尤为盛行。对库切克汗的英雄化在政治光谱的各个阵营中都饱受批评，但其成效却毋庸置疑。不过，吉兰红星是否会欣赏这种伪神化，则是另一个问题了。杜斯特达尔等人牢牢掌控着话语权，他们自封为整个森林运动的钦定继承人，宣称要实现库切克汗建立一个解放的、马克思主义的伊朗的未竟之梦。"
 crab_communalism_subtype:0 "螃蟹公社主义"
 crab_communalism_subtype_desc:0 "§Y螃蟹公社主义§!\n\n£GFX_ideology_crab_communalism_bar\n\n\n\n\n螃蟹公社主义是一个带有戏谑意味的称呼，用来指称围绕阿拉斯加帝王蟹巨头洛厄尔·阿尔文·韦克菲尔德所构建的一套体系。该体系将粉色资本主义、美国共产主义，以及由鲍勃·马歇尔和雷克斯·比奇等阿拉斯加移民所引入的边疆民粹主义加以融合，进而形成了一种混合型的经济革命体制。这一体制的核心，在于将阿拉斯加独特人民的需求及其既定的生活方式置于所有考量的首位。它以白劳德主义的社会经济和工会政策作为基本框架，构建起一种富有革命色彩的民主制度，并在半工团主义体系中加以组织运行。与此同时，该体制仍然允许部分资本主义企业继续存在，其中最主要的是韦克菲尔德所掌控的庞大且持续扩张的罐头厂、蟹类加工厂与渔业网络，并以强有力的工会和赋权于民的新闻机构作为制衡力量。螃蟹公社主义并不算一种成文的意识形态，更像是阿拉斯加各政府、领袖、自耕农场和社区，在共同理念融合之下所自然产生的制度副产品，其根本旨归，在于回应极北边疆生活居民的需求与向往。"
 syn_left_peronism_subtype:0 "左翼庇隆主义"
 syn_left_peronism_subtype_desc:0 "§Y左翼庇隆主义§!\n\n£GFX_ideology_left_peronism_bar\n\n\n\n\n胡安·多明戈·庇隆的思想体系虽然在成熟度和整体构建上仍处于萌芽阶段，一个显著的趋势已经逐渐显现。若要实现真正的正义主义革命，庇隆将军追随者中较为“激进”的派别主张，必须挣脱其崛起圈子里残存的军事至上主义桎梏。只要由保守冷酷的寡头统治以及固守教条传统的教会结构所维系的既有秩序依然存在，任何实质性的变革都无从谈起。尽管这些“左翼庇隆主义者”在批评当代阿根廷的某些方面时，与巴塔哥尼亚潮流存在共识，但他们并不寻求通过革命工团主义，或全面没收与再分配来彻底颠覆整个社会结构，也不打算消除宗教作为一种精神力量的影响。天主教需要转向关注地方现实，引导迷途的羊群走向解放；而精英阶层所攫取的一切，则必须归还给那些“无衫者”，也就是长期因出身、社会地位、陈腐法律以及对外来移民的排斥而备受剥削、饱受污名的人群。此外，左翼庇隆主义积极倡导在女性选举权、性别平等、人权及对一切被遗忘者的关怀方面取得重大进展，这得益于该运动“精神领袖”、将军的新婚妻子玛丽亚·埃娃·杜阿尔特·德·庇隆的有力庇护。这一倾向在劳工运动中也寻得了强大的同盟，尤其关注庇隆关于在强大工会架构下实现工人团结的号召，这在很大程度上要归功于安赫尔·博伦吉及其领导的商业雇员总联合会的积极行动。最终，左翼庇隆主义力图将自己塑造为阿根廷数十年来一直呼唤的真正民粹主义浪潮。唯有时间能够证明，这个国家是否会同样展现出这一反官僚、反精英、亲近社会、倡导女性权益且源自底层的进步面貌。"
 egoism_subtype:0 "利己主义"
 egoism_subtype_desc:0 "§Y利己主义§!\n\n£GFX_ideology_indiv_anar_bar\n\n\n\n\n无政府主义理论家麦克斯·施蒂纳曾大胆宣称：“不仅要废除国家，还要废除那个作为对其成员负责之机构的社会。”施蒂纳的真实身份乃至其历史存在至今仍存有争议，而他是利己主义运动，有时也被称为利己主义无政府主义，偶尔亦称作施蒂纳主义的核心人物。利己主义的思想根源可追溯至个人主义无政府主义与罪犯无政府主义的理论土壤，施蒂纳的著作在多个层面启发了这两种思潮。不过，个人主义无政府主义探讨的是通常基于天赋人权的个体性概念，罪犯无政府主义则试图将犯罪作为社会变革和革命的工具，而利己主义既不关心社会，也不关心革命，甚至对人类整体都毫无兴趣。在施蒂纳看来，天赋人权与社会不过是虚幻的构造，或者用他偏爱的说法，是一些“幽灵”；唯有将视线完全转向自我，且仅仅转向自我，才能实现真正的解放。从这个意义而言，利己主义本身就是一场发生在人类关系领域的革命。按照施蒂纳的构想，国家只能被所谓的“利己主义者联盟”所取代，成员们通过不断更新对联盟的支持来缔结一种联合契约，这种契约既不会赋予联盟对其成员的支配权，又能让成员实现互惠互利。倘若某位成员发现自己付出多于所得，这个联盟便无法继续履行其作为联盟的应有职能，此种状况必须借助于有意识地践行利己主义行为来加以规避。利己主义者联盟的真正意义，在于构筑一个联合体，其中合作源于为他人行事时所获得的愉悦感，同时又能保持成员自身的主权与独立。利己主义者同样不相信财产所有权建立在社会契约之上，而仅仅认为权利来自为满足自身需求而捍卫及夺取财产的能力。尽管利己主义与施蒂纳本人紧密相连，弗里德里希·尼采的著作亦对这一意识形态产生了深远影响，不过利己主义者在尼采是否可以被归属于其中一员的问题上仍存在分歧。利己主义代表着个人主义意识形态的极端诠释形式，不为个体设置任何道德或社会层面的障碍，因此它在更倾向于集体主义的无政府主义理论家中不乏批评者。尽管如此，利己主义同样拥有众多捍卫者，从美国的本杰明·塔克与史蒂文·T·拜因顿，到欧洲思想家如约翰·亨利·麦凯、赫伯特·里德、萨洛莫·弗里德兰德以及米格尔·希门尼斯·伊瓜拉达。"
 radsoc_crab_communalism_subtype:0 "螃蟹公社主义"
