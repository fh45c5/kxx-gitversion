 socdem_crime_syndicate_subtype:0 "自由化犯罪国度"
 socdem_crime_syndicate_subtype_desc:0 "§Y自由化犯罪国度§!\n\n£GFX_ideology_crime_syndicate_bar\n\n\n\n\n与其说它是一种意识形态，不如说它是一种半标准化且高度可变的社会组织形式。犯罪国度从根本上是围绕犯罪、腐败和贪污建立起来的。从暴徒和黑手党到犯罪集团和秘密组织，都在一个由犯罪推动、不受法律约束的体系下控制着国家的各个方面。“自由化犯罪国度”是吉米·霍法、恶名昭彰的强尼·托里奥老爹等“自由派”狂徒在“福星”卢西亚诺的指导下悟出来的，其既有有组织犯罪团体都有的逐利特性，也会采取更加柔和的方法来获取民众的好感，它会利用自由、进步、民粹的手段建立起半共和制的社会结构来拉拢摇摆的群众，并且动员有组织犯罪的力量来为社会带来相对的自由与平等，社会中的每个人都可以凭着自身的本事进入黑道，闯出自己的一片天。与寻常的犯罪国度相比，这些自由派伪共和主义罪犯、虚伪民主主义者少了些家长做派、多了些对传统的漠视，他们行走在真正的犯罪国度与高度贪污腐败的社会之间，以牺牲部分利润、抛弃各项古早风俗为代价，换来了民众更多的理解。"
 soclib_crime_syndicate_subtype:0 "自由化犯罪国度"
