 metaxism_subtype:0 "梅塔克萨斯主义"
 metaxism_subtype_desc:0 "§Y梅塔克萨斯主义§!\n\n£GFX_ideology_metaxism_bar\n\n\n\n\n在所谓“新希腊”，也就是那个畸形的韦尼泽洛斯式自由主义怪胎的废墟之上，一种真正的新文明必将崛起，它将在多个方面从“古希腊”中寻得根基。作为自由思想党领袖、希腊右翼核心人物扬尼斯·梅塔克萨斯提出的同名意识形态，梅塔克萨斯主义主张必须建立一个深植于第一与第二希腊文明的新国家。前者（以斯巴达、亚历山大的马其顿与伯里克利时代的雅典为代表）将成为军事上的典范，通过国家青年组织等机构将分散个体锻造成强健整体的组成部分；后者则体现为罗马帝国时期东正教至高地位与政教合一伦理，而这已通过梅塔克萨斯获得保王派与教士阶层的广泛支持得以彰显。由此诞生的“第三文明”（用领袖原话说是“极权主义”），将摒弃议会制的幻想、自由市场的堕落与破坏性的社会主义，建立一个守护希腊民族而非肮脏的突厥、阿尔巴尼亚及斯拉夫乌合之众的国度。令某些观察者惊讶的是，梅塔克萨斯主义创始人对宗教少数群体并无歧视，认为忠诚的犹太人与穆斯林若能融入优越文化，将成为抵御现代主义腐蚀的保守先锋。"
 shintaisei_subtype:0 "新体制"
 shintaisei_subtype_desc:0 "§Y新体制§!\n\n£GFX_ideology_shintaisei_bar\n\n\n\n\n亚洲惨遭西方奴役者围困之际，救亡图存的重任落在了近卫文麿公爵的肩头。在德意志帝国这一“黄祸论”拥趸胜利的刺激下，早年曾接触过社会主义的近卫文麿，如今建构出了一套日本社会一统的宏图：铲除贪婪的财阀和奸猾的政客，建立起“新体制”。新体制这套国家工团主义理念得到了皇道派及其思想旗手荒木贞夫的狂热拥护，因近卫文麿和荒木贞夫皆坚信：天皇、国土与国民乃浑然天成之整体，唯有剜除奸佞之徒播撒的分裂毒瘤，帝国之国体方能永葆康健，凌驾于日本诸岛之外的一切疆域。\n\n大政翼赞会是近卫文麿实施抱负的核心载体，其将取代一切政党，让普选真正选出德配其位的民意代表——民众仍可自主参选，但绝不容赤色煽动者蛊惑人心，背离菊花御座。除推行乡村建设与法团改革等内政，近卫文麿更秉持泛亚信条：既然大和魂注定了日本的卓尔不群，大和民族便当以严父之姿引领亚洲诸胞。日本之雄踞大陆，必将催生出一种能够抵御西方颓废之风的新文化，永固主权根基。届时，新体制将君临东亚，凭万民赤诚之心向寰宇受压迫者投射曙光，让自由的朝日挣断欧罗巴的枷锁。"
 peasant_charterism_subtype:0 "农民宪章主义"
 peasant_charterism_subtype_desc:0 "§Y农民宪章主义§!\n\n£GFX_ideology_peasant_charterism_bar\n\n\n\n\n农民宪章主义，又称农业宪章主义或索托主义，是加利西亚激进分子曼努埃尔·索托·比拉斯对主流宪章极权主义进行意识形态演化的产物。作为西班牙国家工团主义者拉米罗·莱德斯马的密友，索托始终坚定支持国家工团主义，但发展出极具自身特色、高度去中心化、以农民为核心且崇尚暴力的独特形态。该思想体系与新兴的加利西亚政治力量农民社会集团紧密相连，其内核折射出索托对无产阶级与资产阶级的深刻仇恨。这一意识形态的核心主张认为：自大众政治兴起以来，伊比利亚田野的耕作者始终被排除在政治决策之外，而他们才是未被玷污的世界原初之民，得以幸免沦为所谓“公民”的罪恶存在。那些盘踞在堕落都市中的工人与有产阶层，早已蜕变为人类的拙劣仿品，也正是这些异化的人类将农民逼入最后的避难所，迫使他们在加利西亚等地的穷乡僻壤苟延残喘。这些城市除了贪婪吮吸农民用血汗浇灌的劳动成果外，别无建树。\n\n农民宪章主义者宣称，现行秩序必须被彻底颠覆，并需通过武装农民阶层来粉碎伊比利亚的地主集团与腐败的地方寡头政治。在索托的构想中，由农民群众运动主导的农会与农业工会将成为人民意志的新载体，而国家仅作为维持社会凝聚力的工具存在。这场由农民广泛动员掀起的革命浪潮将实现真正纯粹的变革，使乡村民众摆脱旧制度对自发而崇高生活的桎梏。索托强调，纵观人类历史，科学、政治理论、文化与宗教的繁荣永远仰赖农民用沃土与皲裂双手提供的物质基础。作为文明的培育者，由这群质朴原初之民引领的新纪元降临伊比利亚，不过是历史的必然报偿。"
 syn_matswanism_subtype:0 "马茨瓦主义"
 syn_matswanism_subtype_desc:0 "§Y马茨瓦主义§!\n\n£GFX_ideology_matswanism_bar\n\n\n\n\n马茨瓦主义，亦称马佐瓦主义，是发源于反殖民领袖安德烈·格勒纳尔·马茨瓦（又称马佐瓦）的动态发展中意识形态体系。该思想诞生于德国将法属赤道非洲殖民地并入中央非洲之时的首府城市布拉柴维尔，其以激烈的反帝立场为内核，抵制殖民势力造成的文化倒退、社会经济不公与政治压迫。马茨瓦矢志为人民建立一个劳工友好的独立刚果国度，为此屡陷殖民地监狱亦在所不惜。马茨瓦旗下的政治组织法属赤道非洲原住民友好协会是传播这一思想的主力军，并与法兰西公社散布于工团派、共产派和社会主义派中的亲原住民势力保持着友好关系。以左翼意识形态与草根民粹主义为出发点，马茨瓦及其同志长期致力于在德国殖民统治的夹缝中，于法属刚果推广、支持黑人工会运动与社会主义项目。这种不计代价解放劳苦大众的执着，无意中催生了马茨瓦主义最独特的灵性维度——在赤道非洲的被压迫者眼中，他逐渐成为了背负基督教之上帝与特克神灵旨意的反帝救世主，堪比比属刚果的西蒙·基班古先知。然迥异于基班古、刚果的西蒙-皮埃尔·姆帕迪和利比里亚的威廉·瓦代·哈里斯等现代反帝先知，头顶准宗教光环的马茨瓦鲜少自诩为救世主。耐人寻味的是，虽存在着准神性色彩与鲜明的左翼立场，当地政客仍竞相攀附马茨瓦的救世主光环，致使其思想元素逐渐渗透进法属刚果各派政纲，进一步助长了民众对于马茨瓦所谓神性的幻想。"
 yan_xishan_thought_subtype:0 "阎锡山思想"
 yan_xishan_thought_subtype_desc:0 "§Y阎锡山思想§!\n\n£GFX_ideology_yan_xishan_bar\n\n\n\n\n实用一词，正是任何有志于建立延续千秋万代之不朽功业的军阀成功之关键，而对此体会最深的，恐怕莫过于山西的“模范省长”阎锡山了。目睹故土百年积弱之痛，加之留日期间接触的社会达尔文主义影响，阎锡山深信：唯有以道德复兴为基础，实现民众的自保自强，那老旧衰朽的国家结构才能真正享受到社会与经济改革的果实。为此，阎锡山着手构建起了自己的思想体系——因认定现有学说皆不足以担此重任，故博采众长，熔军国主义、民族主义、无政府主义、民主主义、资本主义、共产主义、个人主义、帝国主义、普世主义、专制主义及乌托邦主义之精粹于一炉。从某种意义上说，阎锡山思想可以说是孙中山三民主义的改良升级：民族、民权、民生蜕变为了德、知、福。实现“德”，需振兴新儒学，辅以自我批评与修身养性，同时破除缠足等落后的压迫性传统。达成“知”，则要普及男女基础公共教育，务使下至偏远乡村的全体新社会成员能直接从报刊书籍上阅读阎锡山著述。至于“福”，则既要保全式微的地主乡绅阶层并推行土地改革，又要摒弃阶级斗争，单单借鉴马克思思想中的中央计划模式，同时吸收已故的富兰克林·德拉诺·罗斯福及其继任者们各项“新政”之经验。当然，若无得力执行者捍卫此一蓝图，则这套务实之军阀治理模式便难以为继。因此，必须实施彻底的军事改革，将乡勇团练改造成一支采用德日操典的劲旅。此外，还需效法基督传教士之模式，广设“洗心社”，让阎锡山思想在各处得以贯彻。阎锡山能否最终建成一个屹立不倒的“模范中国”，唯有时间能给出答案。"
 consistent_way_subtype:0 "一贯道"
 consistent_way_subtype_desc:0 "§Y一贯道§!\n\n£GFX_ideology_yiguandao_bar\n\n\n\n\n唯有修炼先天之道，即未分化之原始火炁，持正修身，方能于三期白阳之世得证救赎——此乃中国救世教派一贯道所弘之法旨。一贯道源于先天道支派，后传至山东，经历代祖师弘化，今由第十八代祖张天然执掌道统。该派奉无生老母为宇宙本源，并尊弥勒、观音、西王母、女娲、关公等神明为末劫引路人。除承袭民间传统仪轨外，一贯道更倡儒释道三教合一，兼融基督教与伊斯兰教而成“五教圆融”，学界谓其类同越南高台教之融合性。一贯道还持守儒家化传统戒律，几近清教：除力行素食，严惩烟酒，恪守三纲五常外，更厉行男女大防，未婚男女私语亦在禁绝之列。据师尊所示，三期白阳世始于1912年，迄今未歇，其征象为世道浇漓，人心机巧诈伪达于极处。诚如济公活佛转世之张天然、月慧菩萨转世之孙素贞所知：末劫将近，千禧之期行将终结。是故弥勒降世引领群生渡劫之前，一贯道当竭尽全力弘传正法：或布施劝化，或力行善举，必要时亦不惜诉诸武力。"
 marlib_clientelism_subtype:0 "庇护主义"
 marlib_clientelism_subtype_desc:0 "§Y庇护主义§!\n\n£GFX_ideology_clientelism_bar\n\n\n\n\n庇护主义同领袖主义等“政治机器”类的概念有关，在庇护主义的民主共和体制下，政治支持、政治行动往往要依靠某些私下或公开的交换条件来达成，各政党通过人情、交易、赠礼，乃至断绝商品或服务的方式来控制选民，以此达成自己的目的。在庇护主义的制度下，政客和官僚成为了赞助者、掮客和客户，与各大有影响力的团体、个人或选民频繁地交换利益，以取得政治成功。庇护主义往往少不了贪污、勒索、贿赂等各种形式的政治腐败，它跨过了共和民主制和寡头制之间的界限，仅仅在寡头独裁的内核外披上了一层薄薄的面纱。"
 taarausk_subtype:0 "塔拉教"
 taarausk_subtype_desc:0 "§Y塔拉教§!\n\n£GFX_ideology_taarausk_bar\n\n\n\n\n塔拉教属于爱沙尼亚新异教，其源可溯至1910年代文学界重燃世人对先祖信仰之热忱的大潮。1926年，机械师库拉马宣称：唯仰赖塔拉神、民间英雄卡列维波埃格与其母琳达之三位一体圣恩，方得成全人类希冀——于此，塔拉教方得真正奠基。据库拉马之预言，琳达母子将自千年沉眠苏醒，重聚芬兰-乌戈尔诸族。这一信条迅疾为诸多新异教团体接纳，其中尤以扬·奥尔格1930年创立的希斯宗教协会最负盛名。塔拉教虽属新生小众信仰，实已成多元竞逐之“广教”。教内左翼以玛尔塔·莱普和自由派爱德华·拉曼为首，主张无论出身皆可皈依；右翼则以库斯塔斯·乌图斯特和历史学家亨戈·图尔诺拉为首，力倡唯存强固民族内核，新信仰方能永续。同样，教内在外交立场上也存在分歧：或执守泛图兰主义不移，或坚信驱逐波罗的荒野之上的基督教势力乃爱沙尼亚人的天职。不过，塔拉教的全体信徒共奉一念：故土当涤尽路德宗等外邦影响，重拾古老传说以振爱沙尼亚德性之魂，静候库拉马之启示终成。"
 soccon_ulmanism_subtype:0 "乌尔马尼斯主义"
 soccon_ulmanism_subtype_desc:0 "§Y乌尔马尼斯主义§!\n\n£GFX_ideology_ulmanism_bar\n\n\n\n\n自拉脱维亚临时国民委员会成立以来，卡尔利斯·奥古斯特斯·威廉斯·乌尔马尼斯就始终是拉脱维亚流亡保守派的旗帜性人物。虽有志于以民主制度构建起强大又独立的祖国，但领导组织规模与影响力皆不可小觑的拉脱维亚农民联盟还远远不能满足乌尔马尼斯的政治抱负。在乌尔马尼斯主义的指导下，拉脱维亚这片土地将经历一场大刀阔斧的改组，而其第一步便是取缔党派政治，废除传统政党制度。乌尔马尼斯主张通过集中权力于己一身的方式实施经济改革，真正为农民带去福祉——推行民主法团主义模式，由政府依托接管中小企业后实施关税保护政策，建立起国家资本主义体系，然后将基建资金重点投入落后的农村地区。虽非种族主义理念，但乌尔马尼斯主义认为，唯有以主体民族文化为核心的拉脱维亚，才能经受住未来的风浪考验，因此，必须优先保障好拉脱维亚人的受教育权和经商权，取消少数民族自治，限制其教学、报刊及贸易活动。有了这位强势舵手的引领，曾遭波罗的德意志人窃据的土地终将摆脱桎梏，再度为本国人民效力。"
 ulmanism_subtype:0 "乌尔马尼斯主义"
 ulmanism_subtype_desc:0 "§Y乌尔马尼斯主义§!\n\n£GFX_ideology_ulmanism_bar\n\n\n\n\n自拉脱维亚临时国民委员会成立以来，卡尔利斯·奥古斯特斯·威廉斯·乌尔马尼斯就始终是拉脱维亚流亡保守派的旗帜性人物。虽有志于以民主制度构建起强大又独立的祖国，但领导组织规模与影响力皆不可小觑的拉脱维亚农民联盟还远远不能满足乌尔马尼斯的政治抱负。在乌尔马尼斯主义的指导下，拉脱维亚这片土地将经历一场大刀阔斧的改组，而其第一步便是取缔党派政治，废除传统政党制度。乌尔马尼斯主张通过集中权力于己一身的方式实施经济改革，真正为农民带去福祉——推行民主法团主义模式，由政府依托接管中小企业后实施关税保护政策，建立起国家资本主义体系，然后将基建资金重点投入落后的农村地区。虽非种族主义理念，但乌尔马尼斯主义认为，唯有以主体民族文化为核心的拉脱维亚，才能经受住未来的风浪考验，因此，必须优先保障好拉脱维亚人的受教育权和经商权，取消少数民族自治，限制其教学、报刊及贸易活动。有了这位强势舵手的引领，曾遭波罗的德意志人窃据的土地终将摆脱桎梏，再度为本国人民效力。"
 vapsism_subtype:0 "瓦普斯主义"
 vapsism_subtype_desc:0 "§Y瓦普斯主义§!\n\n£GFX_ideology_ulmanism_bar\n\n\n\n\n瓦普斯主义溯源自爱沙尼亚独立战争退伍军人与“自由斗士”之集会，起初仅为纯粹的退伍军人团体，旨在争取经济援助，改善生活境遇。随着时间的推移，各种零星组织在阿尔图尔·西尔克与安德烈斯·拉尔卡的领导下汇聚一堂，瓦普斯运动自此迈入了新的阶段，开始明确呼吁建立起真正的民族国家——此一国家奠基于战壕前线淬炼出的普遍价值观，不靠分裂爱国者立足，推行极端公民民族主义。西尔克宣称：唯获人民共识方可实现此愿景，故号召公民主动引领国家转型为民主威权混合型的总统制共和国，重分波罗的德意志贵族的地产，消弭阶级分化、民族沙文主义及意识形态党争，建立起自给之国。爱沙尼亚乌托邦虽仍遥不可及，然沙场宿将皆矢志必成其愿。"
 neo_rexurdimento_subtype:0 "新复兴运动"
 neo_rexurdimento_subtype_desc:0 "§Y新复兴运动§!\n\n£GFX_ideology_neo_rexurdimento_bar\n\n\n\n\n新复兴运动乃加利西亚民族思想家、秘学作家比森特·里斯科之思想造物，其发端于对古典加利西亚文学复兴之热忱，继而生长于东方学与神秘学探究，糅合了多重源泉。里斯科倡行异质加利西亚主义，广纳G·K·切斯特顿、勒内·盖农、米尔恰·伊利亚德等哲人思想，于经济层面甚还借鉴了卡尔·马克思的学说，更崇敬奥斯瓦尔德·斯宾格勒及德国的人民主义运动，对奥地利的雅利安秘学运动亦显热忱。在里斯科看来，加利西亚主义须蜕变为纯粹的传统形态，让民族运动挣脱低效议会制与自由派的堕落枷锁。对其来说，现代人无非腐化欧洲价值观的奴仆与驯顺傀儡，此番精神之贫瘠乃世界大战之根源，因唯有此等空心傀儡，才甘陷屠场之中。里斯科一派全盘拒斥现代性，拥抱非理性与灵性化的民俗天主教，融印度教义与神智学为一炉。里斯科早早抛弃了线性史观，视欧洲文明正步入终局，一如印度教伽梨宇迦之末世。为应此劫，加利西亚人当重寻本真信仰，而此番去中心化的宗教转型必引发社会的剧变：撕毁卢梭的《社会契约论》，拆解禁锢加利西亚民众的人造之城，让人们重归部落氏族的自然生存态，令加利西亚子民复返渔耕祖业。新复兴运动的本质乃凯尔特崇拜，斥西班牙余土为“地中海”、“闪米特”，更谓杜罗河畔的加利西亚民系属雅利安血统，凌驾于伊比利亚众生之上。里斯科的此一思想理念实为高度可塑之物，注定随其在独立过后的地位浮沉而演变。"
 universism_subtype:0 "普世教"
 universism_subtype_desc:0 "§Y普世教§!\n\n£GFX_ideology_universism_bar\n\n\n\n\n普世教乃挪威元首维德孔·吉斯林思想之结晶，是庆祝其毕生哲思构建出的一套万能理论。普世教一词源自著名汉学家扬·雅各布·马里亚·高延的著作，吉斯林受其之东亚哲学宗教典籍研究启发良多，同时汲取了古典时期晚期的新柏拉图主义和诺斯替主义思想精髓，以及近二百年来的德国唯心主义哲学养分。他更以数学家特有的敏锐，热衷于自然科学新发现，并借费米、爱因斯坦及其斯堪的纳维亚同胞玻尔等“伟人”成就装点学说体系。这般庞杂的思想元素包裹以精致的历史外衣，便契合了吉斯林终生倾心的人文学科。\n\n这一意识形态、哲学与科学的畸态混合体，被吉斯林视作重振挪威民族共同体的蓝图。其以普世教之理想叠加于国民联盟的法团之治与北欧民族主义，企图打造能够建立起大北欧和谐联盟的群众运动，统合欧洲的盎格鲁-日耳曼民族与大英帝国政权，最终构筑起全球技官政府，以优绩主义与极端种族等级体系求取和平稳定，使雅利安民族与东亚同胞携手共治世界。"
 natpop_universism_subtype:0 "普世教"
 natpop_universism_subtype_desc:0 "§Y普世教§!\n\n£GFX_ideology_universism_bar\n\n\n\n\n普世教乃挪威元首维德孔·吉斯林思想之结晶，是庆祝其毕生哲思构建出的一套万能理论。普世教一词源自著名汉学家扬·雅各布·马里亚·高延的著作，吉斯林受其之东亚哲学宗教典籍研究启发良多，同时汲取了古典时期晚期的新柏拉图主义和诺斯替主义思想精髓，以及近二百年来的德国唯心主义哲学养分。他更以数学家特有的敏锐，热衷于自然科学新发现，并借费米、爱因斯坦及其斯堪的纳维亚同胞玻尔等“伟人”成就装点学说体系。这般庞杂的思想元素包裹以精致的历史外衣，便契合了吉斯林终生倾心的人文学科。\n\n这一意识形态、哲学与科学的畸态混合体，被吉斯林视作重振挪威民族共同体的蓝图。其以普世教之理想叠加于国民联盟的法团之治与北欧民族主义，企图打造能够建立起大北欧和谐联盟的群众运动，统合欧洲的盎格鲁-日耳曼民族与大英帝国政权，最终构筑起全球技官政府，以优绩主义与极端种族等级体系求取和平稳定，使雅利安民族与东亚同胞携手共治世界。"
 nordic_model_subtype:0 "北欧模式"
 nordic_model_subtype_desc:0 "§Y北欧模式§!\n\n£GFX_ideology_nordic_model_bar\n\n\n\n\n当社会民主主义挣脱马克思教条的桎梏，深陷改良主义、修正主义与渐进主义大论战之际，北欧模式这一通向社会主义之路的新思想便应运而生。北欧模式凝聚瑞典社民工党、挪威社民工党、芬兰社民党及丹麦社民党之成就，承载着劳苦工农历经数十年危机争取权益的奋斗结果。北欧各国对于实现社会主义有着独特认知，既不屈服于掠夺成性、泯灭人性的资本主义，亦不盲从激进的工团共产主义，而是致力于开辟中道，构建由政府监管规范商业行为的福利国家体制。雇主组织、工会与政府间的三方法团协议，构成了北欧模式的核心，全方位民主的承诺更奠定了维护各方权益的基石。与某些谬见相反，北欧模式非但不束缚自由企业，反而异常珍视贸易壁垒的破除与产业创新，为保障全民福利、普惠医疗及免费教育的累进税制奠定经济基础。除了挪威对国有化和国营企业念念不忘外，北欧的社民党人基本已摒弃阶级斗争和集体化理念，转而奉行瑞典人谓之“人民之家”思想，把每位公民都视作贡献互济的大家庭成员。北欧模式初虽颇具局限性，但如今已在北欧政坛产生深远影响，不再是遭人嗤之以鼻的“修正分子”的专属，或将以社民思想典范之姿引领世界潮流。"
 marhaenism_subtype:0 "马哈恩主义"
 marhaenism_subtype_desc:0 "§Y马哈恩主义§!\n\n£GFX_ideology_marhaenism_bar\n\n\n\n\n作为西方自由资本主义与传统马克思主义之外的第三种选择，印度尼西亚领导人苏加诺创立了马哈恩主义，一种反殖民的民粹式社会主义。这一介于两大世界阵营之间的中间道路，其得名于西爪哇一位贫穷却自立的农民，旨在解决群岛国度里小农、小商贩和劳工等广大群体的困境：他们虽拥有生产资料，却仍深陷殖民主义剥削的循环魔咒。苏加诺的愿景是让国家围绕社会正义、经济尊严与民族独立的共同事业团结起来，避免阶级冲突的陷阱撕裂新生的印尼。民族主义、宗教与社会主义构成了马哈恩主义的三大支柱，三者并非对立排斥，而是和谐共生。为确保主权在民而不致沦为无政府状态或个人主义，国家将通过道德权威与民主协商实施领导。该意识形态强调自力更生、合作经济与文化主体性，力图将人民从经济奴役、精神异化与殖民统治中解放。归根结底，苏加诺的社会主义深深扎根于群岛的土壤与精神：这场革命的基础是稻田、村议会与平凡民众的坚韧力量，而非街垒。"
 pan_iranism_subtype:0 "泛伊朗主义"
 pan_iranism_subtype_desc:0 "§Y泛伊朗主义§!\n\n£GFX_ideology_paniranism_bar\n\n\n\n\n现代泛伊朗思想之父、民族改革团体伊朗学会成员马哈茂德·阿夫沙尔勾勒出的波斯文化圈之愿景，出发点并非泛突厥主义、泛阿拉伯主义式盲目的沙文民族统一情绪，而是源远流长的伊朗文明史诗。自诞生伊始，泛伊朗主义就是一股防御性的现代化力量，旨在破除外强割裂阿塞拜疆人、胡齐斯坦人等伊朗族裔的壁垒。多数赞成统一前波斯帝国土地的思想家并不支持领土扩张，而是主张通过教育、司法改革及世俗化消除什叶派干政乱象，以统合、凝聚地缘文化共同体。此一思想领域尤具深意者，当属《大伊朗》期刊创立者、亚美尼亚人格雷戈里·叶吉基安，其主张以民众的民族意识统合包含亚美尼亚族在内的伊朗诸族。泛伊朗主义虽以一套价值观兼容温和左翼至右翼保王派的各方派系，然激进派于波斯文明之热忱尤甚。泛伊朗党、雅利安党等团体，协同著名皈依祆教徒巴赫拉姆·阿里亚纳、哈桑·阿尔法、达乌德·蒙希扎德等军政要员，为大伊朗之业不择手段。以征伐屠灭阿拉伯伊斯兰与犹太势力、铲除资本主义与工团主义的代理人，如此，世上最伟大诸帝国的缔造者、唯一的纯正雅利安人——伊朗人方可取回四方之王居鲁士，以及阿契美尼德王朝、萨珊王朝乃至亚历山大大帝等波斯政权的遗产。不论有无君主愿为统帅，波斯荣光都将必再耀世间。"
 phalangism_subtype:0 "长枪党主义"
 phalangism_subtype_desc:0 "§Y长枪党主义§!\n\n£GFX_ideology_phalangism_bar\n\n\n\n\n黎巴嫩人缺乏纪律。但为了抵抗新生的叙利亚社会民族主义者和老牌泛阿拉伯伊斯兰主义者的侵蚀，黎巴嫩人必须拥有纪律。这一思想成为了皮埃尔·阿明·杰马耶勒所创立的政党及其意识形态的基石。以古希腊方阵命名的“长枪党”已然成为了黎巴嫩民族主义的象征，代表着该国马龙派基督徒的利益。杰马耶勒得到了贝鲁特及其他地区受过西方教育的中产阶级的支持，并希望利用他们的智慧建立一个独立、现代、不受任何外国影响的国家，并拒绝非教派“民主”的愚蠢想法，因为这只会令黎凡特的穆斯林侵略者继续占据主导地位。相反，长枪党设想建立一个真正的基督教民主实体，将权力赋予安条克叙利亚马龙派教会的信徒（正如该党的座右铭“上帝、祖国、家庭”所体现），同时尊重那些符合黎巴嫩民族共同信仰的少数群体——他们是古代迦南人的后裔。皮埃尔·杰马耶勒将充分运用早已盛行于黎巴嫩其他政治团体的腓尼基文化，以及艾曼纽·穆尼埃的个人主义哲学，带领他的人民走出集体主义奴役的黑暗，回归腓尼基文明的光明——在那里，所有公民都能为建立一个与提尔、西顿和比布鲁斯的千年辉煌历史相称的社会作出贡献。"
 syrian_social_nationalism_subtype:0 "叙利亚社会民族主义"
 syrian_social_nationalism_subtype_desc:0 "§Y叙利亚社会民族主义§!\n\n£GFX_ideology_ssnp_bar\n\n\n\n\n时代的车轮不会自行转动，总会有某种力量推动着它，如同旋风般扫清前路上的一切腐朽。对安东·萨阿德而言，情况也是如此。出生于一个开明知识分子家庭的他受到了家人强烈的叙利亚民族主义与改革主义信念的影响。他环游各地，博学多识，并在这一过程中形成了“自然叙利亚”的理念，即叙利亚人民在其上生活、发展并传承至今的家园。这片土地也被称为“叙利亚新月沃土”，其北起托罗斯和扎格罗斯山脉，南至西奈半岛，西至塞浦路斯，东至波斯湾。叙利亚民族的统一必将在这片先驱者们建立辉煌文明的土地上得以重建。叙利亚民族必须抛开愚蠢的族群和教派分歧，重铸自远古时代延续至今的连贯链条，以最坚定的决心发动民族解放战争，与教派民族主义和犹太人斗争到底——后者是一支永远无法被黎凡特土地所同化的族群，因此是叙利亚社会民族主义者的宿敌。基督徒和穆斯林会在叙利亚民族古老遗产的光芒下团结一致，将其洒下的鲜血凝结为象征社会民族主义四大美德——自由、责任、纪律与力量的“Zawba'a”（旋风）——这也是这一事业的崇高领袖为其选定的标志。凭借这份信念，社会民族主义者将把叙利亚家园从教派主义、奥斯曼帝国的统治与殖民主义的黑暗时代中解放出来，令萨阿德的崇高愿景得以成真。届时，叙利亚民族将迎来全面复兴，以智慧的头脑发掘叙利亚家园的经济潜力，并建立一个能够充分利用这份潜力的优越社会。"
 cultured_magic_subtype:0 "文教魔法"
 cultured_magic_subtype_desc:0 "§Y文教魔法§!\n\n£GFX_ideology_cultured_magic_bar\n\n\n\n\n许多在世界大战余波中觉醒的激进分子，对那些曾将欧洲文明推向权力巅峰却因迫害知识阶层而逐渐衰落的传统嗤之以鼻。倘若阿尔图罗·雷吉尼也是此类人，他本会留在意大利军团主义者的团体中，毕竟他也曾是一名军人。然而他的视野却更为清明。战前，他开始探索毕达哥拉斯主义，在罗马创立神智学分会，后迁往巴勒莫并受启蒙加入古老的孟菲斯共济会仪式。尽管他秉承意大利统一运动的反教权精神，却也对马丁主义基督教秘教及其关于人类物质堕落、终将与神性本源重归统一的教义产生兴趣。当意大利崩裂沉沦，敌视异端的教会开始迫害雷吉尼等非正统信徒时，这位学者选择与尤利乌斯·埃伏拉男爵及更广域的乌尔小组合作，冀望这个组织能为祖国痼疾开出良方。然而，这段合作未能持久，埃伏拉的异教崇拜不过是对幻想中古世界的妄想模仿，不仅剽窃了雷吉尼的早期著作，更与其共济会理念根本对立。于是，必须创造新事物，即“博雅魔法”。在其创立者心中，这种融合赫尔墨斯主义、柏拉图主义与纯正罗马多神论的“文教魔法”，将成为重振古罗马荣光的蓝图。一群新的精神贵族与秘法学阀即将主宰亚平宁半岛，将人民从现代主义与平等主义的黑暗中解放，无论这黑暗来自右翼教权还是左翼世俗。"
 evolian_thought_subtype:0 "埃佛拉思想"
 evolian_thought_subtype_desc:0 "§Y埃佛拉思想§!\n\n£GFX_ideology_evolian_thought_bar\n\n\n\n\n任何时代都必然有反动者诞生，每场革命必然遭遇其对立面。对某些人而言，仅仅否定现代性便已足够；更激进者甚至宣称启蒙运动带来了真正的黑暗，但这些人都过于软弱，远不能捍卫真正的传统。在全球右翼领域的秘传大传统主义者尤利乌斯·埃佛拉男爵看来，唯有原始重生才能驱散物质至上与庸俗欲望构成的伽梨宇迦。这位自封“超军团主义”的思想家认为，黄金时代早在古希腊就已开始堕入颓废现实，当时的所谓“知识分子”竟质疑由永恒超验知识确立的权威、等级、秩序、纪律与服从的仪式性存在法则。受世界大战经历、未来主义者、邓南遮思想、德国唯心主义、东方灵性体系、罗马异教信仰等思潮影响，埃佛拉男爵为治愈西方乃至全球沉疴开出了治愈药方：必须建立以灵性活力决定地位的新国度，通过牢不可破的种姓制度重振灵性衰弱的种族。当人类平等、大众参与和自由主义这些幼稚教条崩塌之时来到，绝对个体将觉醒其自我能运用魔法唯心主义驱散存在幻象，从而获得无条件的绝对权力与自由。基督教会也需净化，通过汲取不朽圣杯的超验遗产或凯尔特-北欧的吉柏林派传统，仍可打破其奴性的闪族本质。当太阳战士掀起对抗现代世界的反叛，净化我们所认知的现实，并将不配的冥府种姓逐回地下世界之日，便是异教帝国终将崛起于全欧之时。"
 waisi_movement_subtype:0 "瓦伊西运动"
 waisi_movement_subtype_desc:0 "§Y瓦伊西运动§!\n\n£GFX_ideology_waisi_movement_bar\n\n\n\n\n瓦伊西运动在鞑靼社会中有着举足轻重的影响，其创始人是巴哈韦丁·瓦伊西。瓦伊西隶属于纳克什班迪苏菲教团，曾因参与了十九世纪末的鞑靼农民起义而被沙俄政府关进了精神病院。\n\n现代的瓦伊西运动类似于俄国绿军，是以农民为主导的基层原教旨主义宗教运动，其既体现着受苦受难的鞑靼农民的革命斗争精神，又传承着鞑靼民族源自伏尔加保加利亚的民族宗教叙事。瓦伊西运动认为《古兰经》的教义与伊斯兰教法同现代的社会主义思想存在深度的契合，并主张遵循真主的旨意，不惜一切代价，以神圣之革命重建伊斯兰化的伏尔加保加利亚国家。"
 kryvianism_subtype:0 "克里维亚主义"
 kryvianism_subtype_desc:0 "§Y克里维亚主义§!\n\n£GFX_ideology_kryvianism_bar\n\n\n\n\n溯名于中世纪克里维奇部落联盟的克里维亚主义，是前白俄罗斯社会民主联盟兼白俄罗斯社会革命党成员、独立活动家瓦茨拉夫·拉斯托夫斯基开辟出的一条独特白俄罗斯民族主义道路。克里维奇主义追怀那逝去已久、遭毁于“俄国催眠”的白俄罗斯文化黄金时代，期冀于压迫的锁链崩断、子民重拾祖产之际，重现逝去的荣光。拉斯托夫斯基认为，古克里维奇国家迥异于俄国的“亚式专制”与波兰的“贵族乱政”，以​​分权而治、个体自由​​为基石，因此，唯重拾古训，佐以文化艺术热忱、民众土地情怀及民族统合法团主义，克里维亚方得浴火重生。不过，拉斯托夫斯基其志不止于故土的解放：待祖产光复，囚于普鲁士与莫斯科文明牢狱的兄弟民族亦需得到拯救。​​正统立陶宛人​​，而非那些萨莫吉希亚的僭越者，将统帅大军，解放全体克里维奇之民，包括那些遭俄化扭曲的“诺夫哥罗德人”、切尔尼戈夫的塞维里亚人，乃至波罗的海沿岸的遥远血亲。"
 radsoc_guild_socialism_subtype:0 "行会社会主义"
 radsoc_guild_socialism_subtype_desc:0 "§Y行会社会主义§!\n\n£GFX_ideology_guild_socialism_bar\n\n\n\n\n行会社会主义的发轫可追溯至工团主义于西方开枝散叶前的岁月，虽在近年式微，其倡行者仍力图摒弃威权国家社会主义与革命工会主义的老路，开辟工人解放的新途。汲取中世纪英国工匠组织、社会民主联盟诗人威廉·莫里斯、费边社及合作社运动之思想，以《新时代》杂志阵营的亚瑟·彭蒂、S·G·霍布森等人为先驱，开创劳工政治运动的异枝。尽管最初存在抵制工厂化生产，主张回归行会手工业生产的倾向，但在乔治·道格拉斯·霍华德·柯尔及其全国行会联盟的砥砺深耕下，此自由意志社会主义思想最终形成统一体系：社会须转型为以工场、社区为基本单位，以行会为载体的参与式民主体系，并以国家分权遏制专政的苗头。对于未来社会的最终形态虽存在争议——从保障消费者权益与公民自由的改良主义国家，到地方结构的联邦化体系——不过各方皆认同国家行会所有权的至高地位。纵经浮沉起落，但经将该理论适应于人类统一之未来的科幻作家奥拉夫·斯特普尔顿、美国教育家约翰·杜威、瑞典社民工党修正派理论家恩斯特·维格福什等人的推波助澜，行会社会主义始终激励着全球各地抱负远大的思想家们。"
 socdem_christian_democracy_subtype:0 "基督教民主主义"
 socdem_christian_democracy_subtype_desc:0 "§Y基督教民主主义§!\n\n£GFX_ideology_christian_democracy_bar\n\n\n\n\n基督教民主运动深知，只有凭借民众自主抉择而非强制，宗教社会方能延续。基督教民主主义植根于天主教社会教义和新加尔文主义，致力于构建尊重传统家庭价值观、社会公义和老派爱国精神的自由社会。虽然多数基督教民主党派对各教派兼容并包，但也有些政党会严守反普世的立场。出乎意料的是，许多基督教民主主义的拥护者在经济观点上相当左倾，推崇以教宗利奥十三世的《新事》通谕为基础的分产主义经济模式——当然，这并非唯一之解，同样有宣扬成功神学或支持基督教资本主义的基督教民主党派存在。"
 guild_socialism_subtype:0 "行会社会主义"
 guild_socialism_subtype_desc:0 "§Y行会社会主义§!\n\n£GFX_ideology_guild_socialism_bar\n\n\n\n\n行会社会主义的发轫可追溯至工团主义于西方开枝散叶前的岁月，虽在近年式微，其倡行者仍力图摒弃威权国家社会主义与革命工会主义的老路，开辟工人解放的新途。汲取中世纪英国工匠组织、社会民主联盟诗人威廉·莫里斯、费边社及合作社运动之思想，以《新时代》杂志阵营的亚瑟·彭蒂、S·G·霍布森等人为先驱，开创劳工政治运动的异枝。尽管最初存在抵制工厂化生产，主张回归行会手工业生产的倾向，但在乔治·道格拉斯·霍华德·柯尔及其全国行会联盟的砥砺深耕下，此自由意志社会主义思想最终形成统一体系：社会须转型为以工场、社区为基本单位，以行会为载体的参与式民主体系，并以国家分权遏制专政的苗头。对于未来社会的最终形态虽存在争议——从保障消费者权益与公民自由的改良主义国家，到地方结构的联邦化体系——不过各方皆认同国家行会所有权的至高地位。纵经浮沉起落，但经将该理论适应于人类统一之未来的科幻作家奥拉夫·斯特普尔顿、美国教育家约翰·杜威、瑞典社民工党修正派理论家恩斯特·维格福什等人的推波助澜，行会社会主义始终激励着全球各地抱负远大的思想家们。"
 authdem_christian_crusade_subtype:0 "基督教圣战思想"
 authdem_christian_crusade_subtype_desc:0 "§Y基督教圣战思想§!\n\n£GFX_ideology_christian_crusade_bar\n\n\n\n\n身为爱国牧师兼“战斗的鲍勃”拉福莱特拥趸之后，基督之门徒、炽烈之政客杰拉尔德·莱曼·肯尼思·史密斯注定会投身于民粹的洪流。遍游全国，目睹物质腐化、道德沦丧、赤贫蔓延及种族混杂侵蚀白人美国之核心后，史密斯愈发坚定了自己的理念：开国元勋所建的基督教文明业已倾颓。短暂任职什里夫波特劳联的牧师后，史密斯遇到了自己毕生所见最为宏阔的政治工程——休伊·朗的“财富共享”计划，遂成为了“王鱼”的铁杆追随者，铁杆到遭人讥为“狗腿子史密斯式朗派”，更与查尔斯·库格林神父、弗朗西斯·汤森共同组成了至上党的“三剑客”。史密斯这位当代的萨伏那洛拉带着朗一派的右翼，创建了基督教民族主义圣战组织，既为分产改革而战，更为抗击威胁十字架与星条旗的“杂化”浪潮而战。据史密斯所言，近日之纷争、文化侵蚀、赤色渗透及黑人骚乱，皆系上帝永世之敌——犹太人所为，唯使美国重归基督教民族本源，方可击溃锡安长老圣教会的统治，净化国家面目。圣战组织虽认同北欧主义的基督教一派与英式以色列主义，但史密斯本人拒奉此道。国贼口中的这位“仇恨布道者”，唯一的执念便是将白人美国从闪族人及其披着进步外衣的盟友手中拯救出来。"
 getulismo_subtype:0 "热图利奥主义"
 getulismo_subtype_desc:0 "§Y热图利奥主义§!\n\n£GFX_ideology_getulismo_bar\n\n\n\n\n于南里奥格兰德州政坛节节攀升、跻身共和党最耀眼政治新星的巴西新英雄热图利奥·瓦加斯，目睹了祖国经数十年荒废后的沉疴痼疾。巴西这位拉美的巨人并非一个统一的国度，而是各自为利的一片群岛。因此，人称“热图利奥博士”的瓦加斯须秉承卡斯蒂略斯主义以贤治国、反个人、谋公益的原则，引领道德的复兴与社会现代化。通过集权于强力的行政部门，地方寡头便将受制于中央威权及其钦定代表，廉洁民主改革方可奠基——不过，这一改革不可操之过急，待无记名投票、妇女选举权及“上校”干政乱象终结，民主程序才可正常启动。虽取缔政党，并立法严格监视整合主义者、社会主义者、自由派之举，让瓦加斯主义看似无需盟友，然事实并非如此，愿意效忠的大庄园主及实业家，自会通过国家咖啡、矿产、石油监管机构获得产业扶持。巴西新政之枢要，在于“贫者之父”发起的社会文化革命。届时，焕发新生的巴西特色音乐、舞蹈、体育运动和爱国教育体系将共铸国民认同，国民不再囿于州籍之限，更可安枕无忧。发展式改革与整合妇女儿童劳动法、社会保障、工会制度与工时规定的劳动法紧密交织，促成了阶级合作的硕果。热图利奥主义能否永垂青史尚不好说，但巴西人倒是已经见证了国家媒体口中终日不离的“国家循光前行”。"
 christian_crusade_subtype:0 "基督教圣战思想"
 christian_crusade_subtype_desc:0 "§Y基督教圣战思想§!\n\n£GFX_ideology_christian_crusade_bar\n\n\n\n\n身为爱国牧师兼“战斗的鲍勃”拉福莱特拥趸之后，基督之门徒、炽烈之政客杰拉尔德·莱曼·肯尼思·史密斯注定会投身于民粹的洪流。遍游全国，目睹物质腐化、道德沦丧、赤贫蔓延及种族混杂侵蚀白人美国之核心后，史密斯愈发坚定了自己的理念：开国元勋所建的基督教文明业已倾颓。短暂任职什里夫波特劳联的牧师后，史密斯遇到了自己毕生所见最为宏阔的政治工程——休伊·朗的“财富共享”计划，遂成为了“王鱼”的铁杆追随者，铁杆到遭人讥为“狗腿子史密斯式朗派”，更与查尔斯·库格林神父、弗朗西斯·汤森共同组成了至上党的“三剑客”。史密斯这位当代的萨伏那洛拉带着朗一派的右翼，创建了基督教民族主义圣战组织，既为分产改革而战，更为抗击威胁十字架与星条旗的“杂化”浪潮而战。据史密斯所言，近日之纷争、文化侵蚀、赤色渗透及黑人骚乱，皆系上帝永世之敌——犹太人所为，唯使美国重归基督教民族本源，方可击溃锡安长老圣教会的统治，净化国家面目。圣战组织虽认同北欧主义的基督教一派与英式以色列主义，但史密斯本人拒奉此道。国贼口中的这位“仇恨布道者”，唯一的执念便是将白人美国从闪族人及其披着进步外衣的盟友手中拯救出来。"
 authdem_kleptocracy_subtype:0 "窃国体制"
 authdem_kleptocracy_subtype_desc:0 "§Y窃国体制§!\n\n£GFX_ideology_kleptocrat_bar\n\n\n\n\n窃国体制指的是一种以腐败贪渎为核心的政府体系，甚至可以说这种政府徒有其表，名存实亡。这类政权与其说是某种明确的意识形态，毋宁视为诸多独裁或威权统治与生俱来的特质。纯粹的窃国体制往往摒弃意识形态，或仅以意识形态为幌子虚张声势，其真正目的无非是穷尽一切手段满足统治集团的野心与贪欲。虽然不同窃国体制为实现其自私目的所采取的手段与营造的形象千差万别，但敛财、享乐、贪腐、堕落、纵欲等特质在此类政权中都屡见不鲜。"
 calderonismo_subtype:0 "卡尔德龙主义"
 calderonismo_subtype_desc:0 "§Y卡尔德龙主义§!\n\n£GFX_ideology_calderonismo_bar\n\n\n\n\n代表着哥斯达黎加民族共和党左翼的卡尔德龙主义，是该国的政治新锐奇才之造物。诞生于世纪之交的拉斐尔·安赫尔·卡尔德龙·瓜尔迪亚，于佛兰德-瓦隆研读医学期间接触到了天主教社会教义理论，并因此定下了自己未来的思想航标。起初虽拥护莱昂·科尔特斯·卡斯特罗政权，忠于掌控国家的保守寡头，但卡尔德龙愈发失望于民族共和党内元老所设的藩篱，憧憬效仿奥托·冯·俾斯麦的国家社会主义，实现国家的全面革新。由此诞生的卡尔德龙主义同建制精英集团分道扬镳，转而向国内遭人遗忘的新兴中产阶级与赤贫劳工伸去援手。这位雄心勃勃的改革家以“全盘基督教”之理念，誓以家长制作风重塑国家：推行全民医保，保障社会安全，授闲田于愿耕者，立法强制安全生产，确立集体谈判权，保障工会结社自由，并兴建新型居住区。改革派教士维克托·萨纳夫里亚等人鼎力襄助，将科学与神学精粹相互交融于新兴高校，培养出新生一代守护此番改革之成果。虽有不少诟病者称卡尔德龙不过是以庇护主义体系取代旧日寡头，按需操纵选举，腐化社会的每一个角落，但这实则是民众求索进步所必需的代价。纵使地主、实业家、军头与保守教士结成反对同盟，亦无法阻止这位治病医师救治病患之决心。"
 spiritual_socialism_subtype:0 "精神社会主义"
 spiritual_socialism_subtype_desc:0 "§Y精神社会主义§!\n\n£GFX_ideology_spiritual_socialism_bar\n\n\n\n\n长久以来，外国压迫势力凭借商业霸权禁锢着拉美的思想，使人民沉沦于黑暗，沦为帝国主义恣意妄为的奴仆——对此，危地马拉教育先驱胡安·何塞·阿雷瓦洛·贝尔梅霍有着最为深刻的洞见。自社会底层而始，授予无缘教育者以立身之技，让其自由求索己见、私有财产和生活方式，由此便催生出了精神社会主义——通过普及公民德行教化与道德训导，解放男男女女之精神。不过，个人自由亦须遵循社会秩序，此即阿雷瓦洛主义同“香蕉共和主义”奉个体“自由”于集体利益之上的古典自由主义根基决裂之处。此外，推行社会保障、收缴外籍地主资产、维护劳工权利这一系列的政策，也让批评者把阿雷瓦洛描述成了危险的共产主义革命者。不过，也有激进派谴责其取缔歧视性大庄园制度的土地改革“不力”，正因精神社会主义摒弃了有违人性的马克思唯物主义桎梏。遵照精神社会主义之理论​​，将半封建的危地马拉国家审慎转化为民主社会主义的共和国，集体的利益将首次得到保障。"
 castilhismo_subtype:0 "卡斯蒂略斯主义"
 castilhismo_subtype_desc:0 "§Y卡斯蒂略斯主义§!\n\n£GFX_ideology_castilhismo_bar\n\n\n\n\n1891年州宪法标志着“南里奥格兰德之父”主导的宏大政治工程达到顶峰，卡斯蒂略斯主义成为儒利奥·普拉特斯·德·卡斯蒂略斯留下的建设纲领。这一思想以奥古斯特·孔德实证主义为根基，致力于破除民众追捧的形而上学个人主义民主，转而构建基于历史与科学的公益政体。通过摒弃个人私利，巴西南部各州将在卡斯蒂略斯主义者手下改造成真正的美德共和国——由最具道德者而非单凭选举胜出者领导。该体系依托立足于发展主义的全面现代化，以“凭进步寻保护”为宗旨、国家深度干预、公民投票式政治参与以及实现全民教育得以强化。恰如州宪法第七条宣告：“州最高行政与治理权属州长自由行使，其裁量须依循公益原则并合乎法律诠释”，开明统治者的权威必将引领共和制度走向全面革新。纵使批评者诋毁该体制为“葡巴式专制”或“隐性波拿巴主义”，州父的精神火炬终由博尔热斯·德·梅代罗斯等里奥格兰德共和党人继承者薪火相传。"
 authdem_right_syndicalism_subtype:0 "右翼工团主义"
 authdem_right_syndicalism_subtype_desc:0 "§Y右翼工团主义§!\n\n£GFX_ideology_right_syndicalism_bar\n\n\n\n\n右翼工团主义这一极权国家工团主义的右翼镜像，本质是一场意识形态的互搏——其志在将左翼的革命工团理念，熔铸于民族特质之中。虽有“改头换面的索雷尔信徒与宪章派”之讥讽，但右翼工团主义者深信己道正义昭彰，因先驱者未竟之业，乃是粉碎财阀资本与跨国社会主义势力，构建起法团体系。这一信念驱使着支持弗朗西斯科·罗朗·普雷托的蓝衫军、巴拉圭红党中的红旗派右翼等团体，为同一宏图奋勇前进：建立极权国家，萃取“左翼”工团主义的精华，再加以种族、宗教、文化或传统构成的至圣民族性之淬炼，让本国劳苦大众摆脱内外盘剥。"
 natpop_oligarchy_subtype:0 "寡头主义"
 natpop_oligarchy_subtype_desc:0 "§Y寡头主义§!\n\n£GFX_ideology_oligarchy_bar\n\n\n\n\n寡头主义指的是特定小群体凌驾于举国之上的一种体制，其界定相当宽泛，既可以是商业共和、商贾治国，也可以是优绩精英之制。寡头政权的执政人选之间存在着不小的差异，有些甚至会以种族定等级。寡头多出自巨富之家，一心向钱看又任人唯亲，常遭人讥笑为只重私权罔顾国运。抛开上述说法不谈，只要少数特权寡阶级的权力得到了保障，寡头们是不会介意来点自由放任之手段的。"
 syn_guild_socialism_subtype:0 "行会社会主义"
 syn_guild_socialism_subtype_desc:0 "§Y行会社会主义§!\n\n£GFX_ideology_guild_socialism_bar\n\n\n\n\n行会社会主义的发轫可追溯至工团主义于西方开枝散叶前的岁月，虽在近年式微，其倡行者仍力图摒弃威权国家社会主义与革命工会主义的老路，开辟工人解放的新途。汲取中世纪英国工匠组织、社会民主联盟诗人威廉·莫里斯、费边社及合作社运动之思想，以《新时代》杂志阵营的亚瑟·彭蒂、S·G·霍布森等人为先驱，开创劳工政治运动的异枝。尽管最初存在抵制工厂化生产，主张回归行会手工业生产的倾向，但在乔治·道格拉斯·霍华德·柯尔及其全国行会联盟的砥砺深耕下，此自由意志社会主义思想最终形成统一体系：社会须转型为以工场、社区为基本单位，以行会为载体的参与式民主体系，并以国家分权遏制专政的苗头。对于未来社会的最终形态虽存在争议——从保障消费者权益与公民自由的改良主义国家，到地方结构的联邦化体系——不过各方皆认同国家行会所有权的至高地位。纵经浮沉起落，但经将该理论适应于人类统一之未来的科幻作家奥拉夫·斯特普尔顿、美国教育家约翰·杜威、瑞典社民工党修正派理论家恩斯特·维格福什等人的推波助澜，行会社会主义始终激励着全球各地抱负远大的思想家们。"
 kr.political.27.t:0 "“优化按键”"
 kr.political.27.d:0 "我们虽竭力想让KX运行得更加平滑顺畅，但游戏引擎固有的限制让“提速”几乎成了妄想。不过，钢铁雄心4自带的调试模式默认会开启​​调试平滑渲染功能，这一功能会强制游戏引擎在渲染时停用帧数平滑设置，以此来提升游戏的性能表现。这一功能无法用脚本实现，只能手动按~键打开控制台，输入debug_smooth来开启。\n\n§R警告：禁用平滑渲染功能不只是性能优化，其实质是强制改变了游戏于调试模式外的运作机制。因此，此一操作可能会损害游戏的稳定性，继续引发各种BUG乃至崩溃。若执意启用，请自行承担后果，如遇BUG，请先关闭debug_smooth，核实后再报给制作组。§!"
 kr.political.27.a:0 "了解了解"
 anthropophagic_movement_subtype:0 "食人运动"
 anthropophagic_movement_subtype_desc:0 "§Y食人运动§!\n\n£GFX_ideology_cannibalism_bar\n\n\n\n\n尽管与工团共产主义及其以安德烈·布勒东为代表的超现实主义分支政治世界有所关联，甚至创作出堪称热带未来主义典范的《巴西木诗歌宣言》，但若泽·奥斯瓦尔德·德·索萨·安德拉德追求的目标远不止于巴西现代艺术周与社会主义思潮的简单结合。受“五人小组”核心成员塔尔西拉·多阿马拉赠送的画作《食人者》启发，安德拉德构想出一场凝视着吞噬人类之人的“卡赖布革命”。由此诞生的食人运动直面巴西作为文化混血国家的困境，这片土地始终在殖民者欧洲与被殖民者原住民之间撕裂，而解决之道正是“吞食”其他文化。正如食人习俗在土著社会具有吸收勇士精魄的仪式意义，被亚马逊滋养的大地也将消化外来文明，孕育出独一无二的巴西特质。于是，印第安人的禁忌化作图腾，西方、葡萄牙、欧洲与白人文化在此被这片土地的居民巧妙代谢。孕育基督教的“子午线宗教”或试图“修正”巴西独特语言的势力遭到摒弃，而马克思、弗洛伊德、布勒东、蒙田与卢梭等思想家的成果则被咀嚼吸收。这个先锋团体能否实现社会根基的重塑，其他社会主义者是否容忍他们的愿景，唯有时间能给出答案。但可以确定的是，食人运动将以《宣言》中那句充满反讽的宣言为信条继续启迪后世：“我问一个人法律是什么。他回答说那是对可能性的保障。这个人叫加利·马蒂亚斯。我把他吃了”。"
 syn_technocratic_socialism_subtype:0 "技官社会主义"
 syn_technocratic_socialism_subtype_desc:0 "§Y技官社会主义§!\n\n£GFX_ideology_technocratic_socialism_bar\n\n\n\n\n技官社会主义和技官运动这两种来龙去脉截然不同的事物经常被混为一谈，导致许多人想当然地认为技官社会主义就是技术进步与社会主义政策的融合产物。实际上，社会主义中的技官元素往往诞生自以政治意识形态（也有人说是纯粹的马克思科学）对世界进行的物质剖析之上，这种政治意识形态始自共产主义之父马克思，并经由各式各样的思想家之手得到了进一步的扩充。最符合技官社会主义描述的是布尔什维克中的“无产阶级文化”派，其前身是布党内的“前进派”，领导人是阿纳托利·卢那察尔斯基（列宁的挚友、革命时期的教育人民委员）、亚历山大·波格丹诺夫（列宁曾经最大的对手、原前进派的核心人物）和瓦列里安·波利扬斯基（无产阶级文学刊物的主编、苏维埃审查制度的创立者）三人。无产阶级文化派的核心信条是对于进步的痴迷，以及对于集体社会和科学社会主义的热忱“宗教”信仰，这一信仰衍生出了后来的无产阶级宗教和“造神”原则。无产阶级文化派依据奥古斯特·孔德的“人性宗教”之说，把社会主义启蒙神化为了一种新的信仰，一种能够取代垂死的腐朽资产阶级世界的信仰，一种经波格丹诺夫的输血实验证实永生不再是幻想的全新境界。无产阶级文化派内还有一位同卢那察尔斯基这些人截然不同的人物：阿列克谢·加斯捷夫。加斯捷夫推崇不同于正统列宁主义的工团技官苏维埃体系，并提出了“乌斯塔诺夫卡”这一概念，即通过汲取自弗雷德里克·泰勒成果的社会工程学和科学的管理，在俄罗斯树立起一种革命性的精神态度。在技术先驱的监管下，无产阶级将肩负起劳动的伟大使命，推动时代的前行。"
 socdem_waisi_movement_subtype:0 "瓦伊西运动"
 socdem_waisi_movement_subtype_desc:0 "§Y瓦伊西运动§!\n\n£GFX_ideology_waisi_movement_bar\n\n\n\n\n瓦伊西运动在鞑靼社会中有着举足轻重的影响，其创始人是巴哈韦丁·瓦伊西。瓦伊西隶属于纳克什班迪苏菲教团，曾因参与了十九世纪末的鞑靼农民起义而被沙俄政府关进了精神病院。\n\n现代的瓦伊西运动类似于俄国绿军，是以农民为主导的基层原教旨主义宗教运动，其既体现着受苦受难的鞑靼农民的革命斗争精神，又传承着鞑靼民族源自伏尔加保加利亚的民族宗教叙事。瓦伊西运动认为《古兰经》的教义与伊斯兰教法同现代的社会主义思想存在深度的契合，并主张遵循真主的旨意，不惜一切代价，以神圣之革命重建伊斯兰化的伏尔加保加利亚国家。"
 janismo_subtype:0 "雅尼奥主义"
 janismo_subtype_desc:0 "§Y雅尼奥主义§!\n\n£GFX_ideology_janismo_bar\n\n\n\n\n当巴西的贫苦大众期盼奇迹降临时，权贵阶层却背弃了他们，继续推行腐败与剥削的政策。然而，一位反建制的斗士确实挺身而出，与外资支持的“恐怖地下势力”展开抗争。尽管他时而与民主社会主义者及工会结盟，但雅尼奥·达席尔瓦·夸德罗斯并非传统意义上的“左翼”政客，因为他绝不满足于通过空洞的劳工主义承诺来改善工人阶级处境。雅尼奥主义的核心在于一项庄严承诺：必将彻底扫除建制政党，将贪官污吏绳之以法，终结他们窃取巴西人民财富的恶行。为实现这一目标推行的政策包括：打击垄断托拉斯、削减政府开支、关键资源国有化，以及出人意料地设立原住民保护区以守护亚马逊流域的原始居民。这项民族复兴大业必须以完全独立自主的外交政策为基石，与世界各国人民建立友好关系；同时发起道德净化运动，清除腐蚀巴西的种种恶习：从比基尼泳装、赌博、香水舞会到斗鸡活动。许多人将夸德罗斯的迅速崛起视为带着底层保守主义怪癖的民粹主义者昙花一现，但运动的忠实追随者仍高喊着“别绝望，雅尼奥来了！”的口号奋勇前行。"
 bernardismo_subtype:0 "贝纳德斯主义"
 bernardismo_subtype_desc:0 "§Y贝纳德斯主义§!\n\n£GFX_ideology_bernardismo_bar\n\n\n\n\n天意赋予阿图尔·达·席尔瓦·贝纳德斯的使命始终明晰，这铸就了他面对险恶敌人时的铁血意志与不妥协精神——共和国至高无上。贝纳德斯主义由此承袭了巴西雅各宾派的传统：坚持贸易保护主义、土地国有化、严苛的外来移民配额，并扶持中小企业家。但佩戴红色康乃馨（神龙见首不见尾的贝纳德斯标志）的追随者们与传统雅各宾派的区别在于，他们主张基于“社会经济问题本质上是道德问题”的认知，建立政教互惠同盟。唯有通过示范农场、全民精英教育体系、志愿主义与统制经济政策、捍卫地方自治自由及强制投票制度，国家才能成为“秩序与进步”的守护者，而非冷漠的旁观者。然而“旧共和国”正遭受各方势力围攻，这些势力誓要将巴西扭曲成它本不该成为的模样。因此总统必须化身共和纯洁性的守护天使。手持烈焰之剑的贝纳德斯主义者将与一切社会动荡全面开战——无论是共产主义者、民粹主义者、军国主义者，乃至体制内的腐败分子。作为最高道德权威，继承阿图尔·贝纳德斯遗志的后来者们有权监禁、缴械、炮轰、轰炸乃至肃清任何颠覆势力，正如那句不朽的宣言：“作为共和国总统，我不过是个警察局长。而面对革命压力的警察局长，只懂得一件事：逮捕、镇压、以恐怖遏制恐怖”。"
 soccon_progressive_democracy_subtype:0 "进步民主主义"
 soccon_progressive_democracy_subtype_desc:0 "§Y进步民主主义§!\n\n£GFX_ideology_progressive_democracy_bar\n\n\n\n\n坚持进步民主主义理想的政党往往融合了激进的自由派和民族主义阵营两方的成分。因为认为真正民主的社会对实现进步至关重要，他们将不遗余力地进行深度的选举改革，追求实现完全无记名的全民投票。进步民主主义者认为主流的自由主义过于注重个人，因而支持建立所有阶级和利益集团都能团结一致的国家，尽管他们的大多数支持者集中在小城市。在经济方面，他们认为，自由市场与追求技术进步，和广泛的公共教育相结合，是确保本国市场能与外国市场匹敌的最佳方式。进步民主主义在知识分子和拥有政治意识的金融业者中最受欢迎。"
 sidonismo_subtype:0 "西多尼奥主义"
 sidonismo_subtype_desc:0 "§Y西多尼奥主义§!\n\n£GFX_ideology_sidonismo_bar\n\n\n\n\n在君主制崩塌与世界大战冲击下陷入身份认同危机的葡萄牙，一种足以让这个反教权的衰老共和国重获新生的思潮正在崛起。1917年发动惊天政变的西多尼奥·贝纳迪诺·卡多佐·达席尔瓦·派斯少校，开创了彻底背离传统共和体制的“新共和国”政体。西多尼奥主义不在乎人民的“最高代表”是君主还是总统，只求通过全民直选赋予“领袖”合法性，国家权威便至高无上，因其不仅获得民众背书，更有唯一垄断暴力的军队与合法政党作为支柱——对西多尼奥而言，即是国家共和党。尽管“西多尼奥执政官”在恢复传统价值、与教会和解及强化葡萄牙民族认同方面成就斐然，但这场政治实验却在无党派民选代议制尚未自然成型时便戛然而止。这位殉道的“帝王总统”遭无政府主义败类暗杀，国家共和党随之瓦解，君主制最终复辟。话虽如此，西多尼奥主义的继承者们仍然矢志不渝地坚守着这一政治愿景。他们主张在包容族裔与宗教少数群体的同时，必须重建国家的文化与社会权威，方能化解内部危机，挽救民族危亡。"
 authdem_maurrassism_subtype:0 "莫拉斯主义"
 authdem_maurrassism_subtype_desc:0 "§Y莫拉斯主义§!\n\n£GFX_ideology_maurras_bar\n\n\n\n\n莫拉斯主义又称整合民族主义，是法兰西行动的哲学家和思想支柱夏尔·莫拉斯提出的政治、社会和知识领域的论断。在夏尔·莫拉斯看来，存在两个法国：其一是共和制度及其精英代表的“法定国家”，由四大“共犯阶层”支持：犹太人、新教徒、共济会和外邦人，也就是“反法势力”；其二则是真正能代表法兰西人民的“真实国家”，而这也是莫拉斯所鼎力支持的。莫拉斯主义基于社会团结理论，追求以法国曾经的旧制度为模式，实现有机运作的社会。因此，法兰西行动拒绝承认法国大革命及其后的历史，发誓要建立一个地方分权、恪守传统和联邦政体的君主制国家，政治权力将被授予各省议会，而国王作为伟大的全国仲裁者，此外天主教将成为维系国家团结的重要黏合剂。在知识领域，莫拉斯则推崇古典理性主义，反对浪漫主义。"
 estado_novo_subtype:0 "新国家体制"
 estado_novo_subtype_desc:0 "§Y新国家体制§!\n\n£GFX_ideology_estado_novo_bar\n\n\n\n\n安东尼奥·德·奥利维拉·萨拉查的人生轨迹始终与其虔诚的天主教信仰交织。他早年加入基督教民主学术中心，后投身天主教政治事业。他将第一共和国视为共济会渗透与自由主义侵蚀下的民主畸变，因而最初拥护西多尼奥·佩斯的军事政变与保皇党的复辟运动。但当这两股势力均未能践行天主教社会训导时，萨拉查融合西多尼奥主义的威权统治与《新事》《四十年》两道通谕，构建起被称为“新国家”的统治体系。萨拉查主义主张在纪律、秩序、保守主义与天主教四大支柱上重建政权——其领袖绝非弥赛亚式的崇拜对象，而是依托“无党派之分”的支持建立法团主义制度，明确反对罗朗·普雷托等国家工团主义者“鼓吹青年狂热、崇尚暴力行动、主张国家权力凌驾社会生活、热衷集结民众追随单一领袖”的异端凯撒主义。对萨拉查而言，守护葡萄牙家庭的神圣性高于一切，无论是本土核心家庭还是从里斯本到澳门的广大海外共同体。尽管采取多大陆主义国策，但新国家刻意淡化卢索热带主义关于葡萄牙因凯尔特、罗马、西哥特、摩尔、犹太等民族交融而形成独特殖民温情的论述，警惕种族混血现象，更倾向以民族主义视角构建海外省多种族共存体系。在教士教育下成长的新一代，将永远铭记萨拉查对忠实信徒的训诫：“我们反对一切形式的国际主义、共产主义、社会主义、工团主义及任何可能分裂或削弱家庭的力量；我们反对阶级斗争、亵渎信仰与背叛祖国；反对奴役制度、物质主义的人生观，以及强权即公理的法则”。"
 muertismo_subtype:0 "死亡圣神教"
 muertismo_subtype_desc:0 "§Y死亡圣神教§!\n\n£GFX_ideology_muertismo_bar\n\n\n\n\n如同狂喜的幽灵般在墨西哥荒漠蔓延的死亡圣神圣母凯旋运动，正俘获着帝国复辟后虔诚信众与保王派的心智和灵魂。这支稚嫩却坚定的反革命力量，既与哈布斯堡-伊图尔维德王朝的玛丽亚三世女皇之治密不可分，又同迅速传播的民间天主教信仰水乳交融，墨西哥民众开始庄严地尊奉死亡圣神——兼具治愈、庇佑与引渡来世神格的死亡化身——来祭奠金衫军屠刀下的殉难者，同时化解世代累积的集体创伤。而那位死而复生的女皇，如今正被奉为死亡圣神的现世化身，将无数脆弱灵魂锚定在这场运动中，无论他们只是渴求希望，还是真正信奉神谕。面对革命行动强加的革命民族主义与暴力传统主义及反动思想荼毒之际，玛丽亚三世女皇与死亡圣神的追随者依托新近“民间化”改革的天主教会支持，誓言辅佐皇权将墨西哥引回天主荣光，因旧教士多遭金衫军清洗，教会现已全力支持这场千禧年运动。他们摒弃议会制与失败的国会制，建立起仁政绝对君主制与内部民主的民间神权制，由拥立女皇的民兵武装保驾护航，但地方政府与城镇自治仍将续于皇权国家体系之下。为使墨西哥从半封建落后国家转型为现代工业强国，同时摆脱保守主义停滞的阴影，玛丽亚三世与死亡圣神运动推行社会经济文化改革：汲取卡特里派改革运动中性别平权等进步思想，借鉴奥地利及欧洲上流社会的文明理念，试图以新拉丁风范驯服狂野之地，缔造更繁荣、虔诚、团结的墨西哥社会。当挽歌响起、亡者入土为安，蒙天主恩典与死亡圣神慈悲庇佑的墨西哥帝国，正在玛丽亚三世女皇引领下坚定前行。"
 hindutva_subtype:0 "印度教民族主义"
 hindutva_subtype_desc:0 "§Y印度教民族主义§!\n\n£GFX_ideology_hindutva_bar\n\n\n\n\n印度教民族主义这一概念作为所谓“印度教性”的体现，早在二十世纪前便由极端印度教民族主义者钱德拉纳特·巴苏提出。他将印度教徒视为真正的雅利安人，亦即唯一获得灵性觉醒、誓死捍卫神性传统社会的族群。但这一意识形态的真正兴起，则要归功于自诩无神论者的维纳亚克·达莫达尔·萨瓦卡尔的巨大努力。他提出印度教应囊括所有印度文明元素，由此构建的现代印度教特性理论立足于三大支柱：共同国度、共同血统与共同文明，旨在统合印度教、佛教、耆那教与锡克教信徒，将“从印度河到海洋的婆罗多大地既视为祖国，也奉为宗教发源的圣地”。依照该理论，穆斯林与基督徒必须被驱逐出境，或是被迫承认自己只是“客居”于此的异族，唯有接受高等文明或逃回其海外圣地才能苟存。在宗教传统主义方面，萨瓦卡尔巧妙平衡了婆罗门高种姓势力与社会革命诉求，试图以此复兴印度教价值观：女性可接受教育，但需以成为贤妻良母为指向；已被纳入民族主义组织的“不可接触者”虽被称作兄弟，仍需等待种姓枷锁最终粉碎的那一天。全印度印度教大会由此成为南亚次大陆最重要的右翼民族主义力量，引领印度教大斋会等组织共同构建作为“完美且不可分割的印度”的“印度教国家”。其中，海德格瓦与戈尔瓦卡领导的国民志愿服务团深受欧洲军团主义启发（甚至在影响上更胜萨瓦卡尔一筹），自创立起便致力于动员民众巩固民族认同、对抗社会主义侵蚀。该组织将欧洲军团主义者动员民众实现民族团结、抵制社会主义侵蚀的实践奉为圭臬——这也成为国民志愿服务团自成立以来的核心斗争方向。"
 evidentist_technocracy_subtype:0 "显证教技官主义"
 evidentist_technocracy_subtype_desc:0 "§Y显证教技官主义§!\n\n£GFX_ideology_evidentist_technocracy_bar\n\n\n\n\n鲜有人能料到，巴西共产主义的先锋队竟由一位黎巴嫩东正教移民一手组织，而这正是阿比利奥·德·内克特的命运轨迹。当他从遥远的地中海彼岸启航，初抵南里奥格兰德州便加入当地共和党，把联邦派的父亲气得够呛。在阿雷格里港，内克特奠定了未来政治哲学的两大基石：皈依卡甸通灵论，并组建保卫工人阶级的人民防卫联盟。世界大战末期，这位未来最高纲领主义联盟的创立者与无政府主义者展开合作，深入军队宣传，活跃于各类工团组织。因与巴西早期共产主义运动中诸多“自由意志派”成员理念相左，加之全球“社会主义”政党选举失利及劳工政策挫败，内克特否定体力劳动者作为革命先锋的定位，转而将技术官僚视为社会唯一非寄生型生产者。由此催生出了融合亚兰·卡甸灵性论、布尔什维主义残余与基督教传统，最终与技术官僚精英理念结合的新宗教——显证教。正如内克特所言：“缺乏知识精英，任何政党都无法取得胜利。只需明确定义工人阶级：医生、工程师、天文学家、化学家、军人、艺术家以及所有体力或脑力劳动者，诸多困惑自当消解”。显证教技官主义论继承马克思历史阶段论并加以发展，视“古代文明-封建主义-资本主义-共产主义-技官主义”为人类进化的必然终局。真正的革命团体将通过灵魂转世实现物质与道德的双重升华，直至臻于至善，进而以善与慈爱为愿景无私重组社会。全球技术官僚实现联合之日，怀抱绝不妥协的教条式理想、手握通往乌托邦之路绝对掌控权的领袖——阿比利奥·德·内克特将屹立于世界之巅，彻底粉碎新旧等级制度，为居里、爱因斯坦、桑托斯-杜蒙特与爱迪生的科学继承人扫清一切障碍。"
 arab_ihya_subtype:0 "阿拉伯复兴运动"
 arab_ihya_subtype_desc:0 "§Y阿拉伯复兴运动§!\n\n£GFX_ideology_arab_ihya_bar\n\n\n\n\n西方既未兑现解放承诺，又纵容奥斯曼哈里发的持续压迫，阿拉伯世界只得自谋生路。革命虽席卷英国与西班牙，两国亦对阿拉伯世界有所同情，但改头换面的红色帝国主义还是战胜了一切。米歇尔·阿弗拉克成年后曾在公社短暂求学，当他观察故土叙利亚时得出一个结论——阿拉伯需要复兴。受动荡的共产主义运动、安东·萨阿德的社会民族主义，以及扎基·阿尔苏齐、瓦希卜·加尼姆的激进社会主义复兴党思想不同程度影响，阿拉伯复兴运动成为阿弗拉克的思想核心，而日常党务则交由挚友萨拉赫丁·比塔尔。阿拉伯复兴立足于三大支柱：统一、自由、社会主义。通过将所有阿拉伯人统一为单一民族，遏止故土的持续衰败，从而消灭封建主义、宗派主义、地方主义与思想反动，实现新的文艺复兴。自由不应盲目照搬西方模式，而应由革命先锋队引领人民进入训政时期——在这个以思想多元化（而非选票多元化）强化政党正义事业的过渡阶段中，阿弗拉克虽不否认物质条件的重要性，但强调“社会主义”与辩证唯物主义至上论无关，也不同于偏执者阿尔苏齐的社会经济幻想。先知穆罕默德在征服时期就践行了阿拉伯社会主义，将人民从奴役中解放，令之成为独立个体。正如他既反对资本主义又否定工团主义与共产主义，阿弗拉克同样批判无神论与原教旨主义，他主张所有宗教平等，并在官方层面上实行世俗主义——在与他类似的阿拉伯基督徒中，这是相当普遍的想法。教士集团长期将伊斯兰教作为民众的精神鸦片，却忘了穆罕默德的革命正是泛阿拉伯主义淋漓尽致的体现。通过阿拉伯语古兰经的启示，它满足了全体阿拉伯人的需求并体现了其价值观。人们不必信仰伊斯兰教，但必须理解自身文化与穆罕默德所传信仰的内在联系——这位缔造民族的英雄，是值得追随尊崇的楷模。尽管许多人嘲弄阿拉伯复兴运动的领袖是窃贼、“傀儡罗马皇帝”、“塞浦路斯基督徒”，但阿弗拉克掀起的浪潮已无人能阻挡。这股力量必将唤醒阿拉伯民族的集体智慧，最终实现整个民族的伟大复兴与革命理想。"
 antarctic_expedition_subtype:0 "南极探险队"
 antarctic_expedition_subtype_desc:0 "§Y南极探险队§!\n\n£GFX_ideology_antarctic_expedition_bar\n\n\n\n\n南极探险的英雄时代落幕已逾十年，1921至1922年沙克尔顿-罗威特探险队将帆船命名为“探索号”的举动，为这段史诗平添诗意。当欧内斯特·亨利·沙克尔顿爵士在这片超越人类栖居地、远离文明掌控的浪漫追寻中逝去，他便跻身青史留名的英灵殿。如同古时追寻圣杯的骑士，阿德里安·德·热尔拉什、卡斯滕·博克格雷温克、罗伯特·福尔肯·斯科特、埃里希·冯·德里加尔斯基、让-巴蒂斯特·沙尔科、威廉·斯皮尔斯·布鲁斯、罗阿尔·阿蒙森等先驱，仅凭意志伟力、“不合时宜”的远见及当时的“原始”技术，完成了前人难以想象的壮举。当民族荣光在世界大战及后续动荡中消逝，机器时代随之降临——技术带来便利，却消解了人类突破极限的尊严，恰如昔日工业革命重塑社会那般。“小玩意儿！小玩意儿！遍地都是小玩意儿！”抗拒者哀叹着南极探险的未来终将受制于工具依赖，屈从于资源掠夺与军力扩张的目的。如今罕有人踏足南极腹地，唯剩亲历英雄时代的阿尔弗雷德·里彻船长受德皇委派继续勘探资源、建立军民基地。新施瓦本兰探险队因此获得了列强难以割舍的物资，尽管最终所得甚微。即便如此，仍有偏执者坚信冰原深处埋藏着超越人类认知的秘密。当勘探者置身永寂的无边虚空中，每步踏错都可能将恪尽职守之人封入永恒的冰之囚笼，这般险境令观察者与亲历者都不禁叩问：那里究竟有什么？"
 korpelaism_subtype:0 "科尔佩拉运动"
 korpelaism_subtype_desc:0 "§Y科尔佩拉运动§!\n\n£GFX_ideology_korpelaism_bar\n\n\n\n\n当年轻而富有魅力的传教士托伊沃·科尔佩拉最初在芬兰路德宗雷斯塔迪乌斯派最保守的群体中布道时，几乎无人预料到这场运动的发展轨迹。上世纪三十年代，科尔佩拉以其激烈且常具争议的言论赢得了大批追随者，但直到自称先知的西居尔·西卡瓦拉加入后，该运动才真正与雷斯塔迪乌斯派及路德宗彻底分道扬镳。西卡瓦拉对科尔佩拉主义的构想源于工团主义兴起和《圣经》新译本的传播——他认为这标志着敌基督降临人间，他将在末世前统治1335天。科尔佩拉运动的信徒将乘坐水晶方舟逃离末日浩劫，这艘方舟将载着666名信徒飞往巴勒斯坦。随着时间推移，西卡瓦拉的思想愈发趋向千禧年主义与秘传主义，最终导致科尔佩拉本人与该运动彻底决裂。在先知西卡瓦拉领导下，这场运动在萨米人和托尔尼奥河谷芬兰人中演变为邪教组织，他们举行大型布道会、与警方爆发冲突，并斥责其他所有路德宗分支为异端。\n\n西卡瓦拉曾在精神病院被拘禁三年，获释后开始宣扬彻底偏离雷斯塔迪乌斯教义的科尔佩拉教，声称唯有科尔佩拉教徒能免于原罪，因此可在教团内部纵酒、赌博并实行自由性爱。他更宣称自己与科尔佩拉及友人亚瑟·涅米已取代大天使之位。尽管该运动主要局限于斯堪的纳维亚边缘地带，但其日益激进的对抗姿态及对西卡瓦拉的狂热崇拜，使当地警方和政治领袖视其为危险且不可控的威胁。而对于西卡瓦拉的门徒而言，他们正是人类抵御撒旦与巴比伦淫妇的最后防线。"
 lindholmism_subtype:0 "林霍尔姆主义"
 lindholmism_subtype_desc:0 "§Y林霍尔姆主义§!\n\n£GFX_ideology_lindholmism_bar\n\n\n\n\n林霍尔姆主义，亦称林霍尔姆思想，是斯文·奥洛夫·林霍尔姆及其拥护者“林霍尔姆派”所创之意识形态，其熔国家工团主义与瑞典民族主义于一体，推崇凝聚瑞典劳工与民族为一不可分之整体的独特民族革命。林霍尔姆主义虽植根于奥斯瓦尔德·莫斯利的准则主义及《极权宪章》之理念，却又拒斥其“狭英性”，以纯正瑞典视角重构了其内核。林霍尔姆主义既反对自由资本主义之腐朽，又视国际工团主义为对先锋队革命的背叛。同准则派、国家工团派类似，林霍尔姆主义主张产业全盘国有化，没收贵族资产，以党政机器及林霍尔姆本人为引领，实现瑞典文化的涅槃重生。在林霍尔姆派看来，革命不单单是政治、经济的剧变，更是精神的升华——革命理想同昔日的卡尔军团铁志相融合，创生出农本革命思想，重铸瑞典民族之魂。林霍尔姆主义融汇卡尔军团的纪律与坚韧，拥抱农耕传统，驯服并保护北疆自然野境，以军团铁律对付反对者，去腐存真，护革命于不倒。林霍尔姆主义除追求工业化外，力求守护全国圣地，全面接纳哥特建筑遗产与北地浪漫意象，以非异教之虔心，崇奉自然，视御敌、纯净、永续之瑞典山林河川为革命的永恒象征，守护其免遭榨取朽坏。因此，林霍尔姆主义外为国家工团主义，内为瑞典文化复兴，既杜绝外来腐蚀，又实践全面革命。林霍尔姆派笃定：唯有国家不仅统御经济与制度，更主宰每个瑞典人的心魂深处，革命大业才算真正达成。"
 pataut_scandinavism_subtype:0 "斯堪的纳维亚主义"
 pataut_scandinavism_subtype_desc:0 "§Y斯堪的纳维亚主义§!\n\n£GFX_ideology_scandinavism_bar\n\n\n\n\n斯堪的纳维亚主义也叫泛斯堪的纳维亚主义，它提倡在斯堪的纳维亚各国间开展不同程度的合作。斯堪的纳维亚主义在文学、语言和文化运动当中初具雏形，这些运动后来不断融合，并最终发展出将斯堪的纳维亚各国统一为一个大君主立宪制国家的理念。斯堪的纳维亚主义从当地共有的历史、神话、语种起源和文化遗产等方面下手，希望藉此团结起位于斯堪的纳维亚的挪威、丹麦、瑞典三国，一致对抗腐败和席卷世界的混乱——后者正使得居住在真北之疆的斯堪的纳维亚人将目光转向内部，专注于自身的发展和繁荣。此外，斯堪的纳维亚主义及其分支还与北欧主义间存在着联系，这一主义持有与前者相同的价值观，然而其覆盖的范围却更广，邻国冰岛与芬兰也被包括在内。尽管该主义起源于19世纪的反专制民主运动和学生拥君运动，但比起统一后的政治制度，斯堪的纳维亚主义者更看重泛斯堪的纳维亚之梦本身的实现，而它也必须实现。在北欧精神的基础之上，斯堪的纳维亚三兄弟将通过平等互助、患难与共愈发紧密地联系在一起，最终建立起一个和平且欣欣向荣的斯堪的纳维亚国家。"
 natpop_scandinavism_subtype:0 "斯堪的纳维亚主义"
