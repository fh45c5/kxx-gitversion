 radsoc_council_communism_subtype_desc:0 "§Y委员会共产主义§!\n\n£GFX_ideology_council_communism_bar\n\n\n\n\n委员会共产主义是俄国内战结束后，在西欧工团主义革命意外得胜的背景下，于共产主义左翼阵营中诞生的一股重要思潮。委员会共产主义者坚信资本主义必然灭亡，而革命的引擎必须依靠独立自主的工人委员会与组织来维持，最终通过大规模罢工等产业行动，实现无产阶级专政。在委员会共产主义者看来，传统的工会不过是资产阶级与其改良派社会民主盟友编织来的门面幻象，因此倾向于建立独立运作的新式工会。虽然委员会共产主义与革命工团主义、列宁马克思主义存在相似之处，甚至借鉴了前者的产业工会主义和一个大工会之理念，或是称赞后者之实践，但其还是基于特定意识形态立场否定了这两大流派——工团主义者常常会维系资产阶级的权力与工会结构，缔造出“劣化的工人国家”，而布尔什维主义则抛弃了工人统治，让先锋队党催生的新精英通过国家社会主义施行威权专制。最后，委员会共产主义者囊括了诸如安东·潘涅库克、赫尔曼·戈特、奥托·吕勒、西尔维娅·潘克赫斯特、保罗·马蒂克等各式各样的政治家和理论家，虽然其都曾于特定时期承认国家和政党的必要性与暂时性，但这仅仅是为培育阶级觉悟的无产阶级接管政权铺设跳板罢了。"
 molotovism_subtype:0 "莫洛托夫主义"
 molotovism_subtype_desc:0 "§Y莫洛托夫主义§!\n\n£GFX_ideology_molotov_bar\n\n\n\n\n莫洛托夫主义是布尔什维克列宁主义思想在极端动员与意识形态高压下衍生的变体，其核心要义在于国家重建、中央集权及刚性阶级专政。该学说亦称民族布尔什维主义或俄罗斯马克思主义，旨在重振列宁遗产，使之成为群敌环伺与内乱频仍中拯救并动员社会主义俄罗斯的行动纲领。莫洛托夫宣称弗拉基米尔·列宁实乃真正的民族布尔什维克——因其追求的不仅是国际革命，更是将俄罗斯民众从内外压迫枷锁中解放。在莫洛托夫视域中，帝国主义与资产阶级民主不仅是社会制度，更是民族屈辱的具象化：那些操“法德口音”的精英阶层统治着占多数的工农阶级。莫洛托夫主义的目标是将国家改造为统一的战争机器，通过工业化与集体化并行的经济改造、高压官僚体系的政治管控和中央计划体制的资源调配实现。然此学说绝非沙文主义民族观。莫洛托夫提出“苏维埃人民共同体”概念：凡在社会主义祖国劳动生活者，不论语言、族裔、地域差异，皆属统一工人阶级。俄语、政治文化及历史遗产被视为民族团结支柱与社会主义集权工具。  "
 soclib_georgism_subtype:0 "左翼乔治主义"
 soclib_georgism_subtype_desc:0 "§Y左翼乔治主义§!\n\n£GFX_ideology_left_georgism_bar\n\n\n\n\n左翼乔治主义又称单一税制运动（为了与政治领域其他接纳整合了此一运动理念的思想区分开来，准确的叫法应为乔治进步主义），是美国经济学家、社会改革家亨利·乔治提出，后又经知名工会主义律师克拉伦斯·达罗等人发展而来的一种经济制度所演变成的成熟政治意识形态。乔治主义哲学的核心原则是，尽管人们应该重视他们自己生产的东西，但“经济租”——或一个地区的所有自然资源和其他公共物品——必须由社会中的所有成员平等拥有。乔治主义提出，唯一的税收应该是对土地价值征税，因为对经济租金征税只会导致效率低下和剥削。乔治主义主要关注的是经济，但也与从工团主义、进步主义到民主社会主义、左翼自由意志主义，再到某些无政府主义，甚至是更偏向右翼和中间派的非社会主义思想都存在着联系。不过，这些不同团体的共同点是致力于单一税制、土地的集体所有权和土地所提供的一切。"
 matswanism_subtype:0 "马茨瓦主义"
 matswanism_subtype_desc:0 "§Y马茨瓦主义§!\n\n£GFX_ideology_matswanism_bar\n\n\n\n\n马茨瓦主义，亦称马佐瓦主义，是发源于反殖民领袖安德烈·格勒纳尔·马茨瓦（又称马佐瓦）的动态发展中意识形态体系。该思想诞生于德国将法属赤道非洲殖民地并入中央非洲之时的首府城市布拉柴维尔，其以激烈的反帝立场为内核，抵制殖民势力造成的文化倒退、社会经济不公与政治压迫。马茨瓦矢志为人民建立一个独立的亲劳工刚果国度，为此屡陷殖民地监狱亦在所不惜。其政治组织法属赤道非洲原住民友好协会积极传播该思想，并与法兰西公社分布于工团派、共产派和社会主义派中的亲原住民派力量保持友好关系。植根左翼意识形态根基与草根民粹主义实践，马茨瓦及其同志致力于在德国殖民统治的夹缝中，于法属刚果推广支持黑人工会运动与社会主义项目。这种不计代价解放劳苦大众的执着，无意中催生了马茨瓦主义最独特的灵性维度——在赤道非洲的被压迫者眼中，他逐渐成为了背负基督教之上帝与特克神灵旨意的反帝救世主，堪比比属刚果的西蒙·基班古先知。然迥异于基班古、刚果的西蒙-皮埃尔·姆帕迪和利比里亚的威廉·瓦代·哈里斯等现代反帝先知，头顶准宗教光环的马茨瓦鲜少自诩救世主。耐人寻味的是，尽管存在灵性崇拜与鲜明左翼立场，当地政客仍竞相攀附马茨瓦的救世主光环，致使其思想元素逐渐渗透进法属刚果各派政纲，客观上进一步强化了民众对马茨瓦所谓神性的集体想象。"
 batllismo_subtype:0 "巴特列主义"
 batllismo_subtype_desc:0 "§Y巴特列主义§!\n\n£GFX_ideology_batllismo_bar\n\n\n\n\n巴特列主义乃红党政治世家的思想结晶，由前总统何塞·巴特列-奥多涅斯首创，今由其侄路易斯·巴特列·贝雷斯及塞萨尔·巴特列·帕切科薪火相继。此思想体系起源于卡尔·克里斯蒂安·弗里德里希·克劳泽的深刻影响拉美自由主义阵营的精英哲学。作为乌拉圭进步主义旗手与红党左翼巨擘，何塞·巴特列力推全民普选、八小时工作制、免费高等教育及政教分离等里程碑式改革。1905年至1907年新党纲确立了巴特列主义的核心使命：重构国民经济体系以实现全民平等。为此，巴特列及其继承者推动立法建立公营经济体系，包括加强劳动法规、国家垄断与干预政策并行、高关税和废除所得税，改行亨利·乔治式土地单一税制。虽征途坎坷，但巴特列主义阵营仍将奋力守护“南美瑞士”之荣光，矢志实现全民社会正义。  "
 herrerismo_subtype:0 "埃雷拉主义"
 herrerismo_subtype_desc:0 "§Y埃雷拉主义§!\n\n£GFX_ideology_herrerismo_bar\n\n\n\n\n埃雷拉主义是乌拉圭民族党在长期担任考迪罗的路易斯·阿尔韦托·德·埃雷拉领导下形成的独特意识形态，为世界自由保守主义运动谱系增添了拉美特色。埃雷拉构想的国家模式承袭杰斐逊、富兰克林、麦迪逊、华盛顿及汉密尔顿的北美早期民主传统——绝非如误传那般源自雅各宾激进分子。与通常认知相反，埃雷拉主义者实为帝国主义及“香蕉政治”的激烈反对者，其推崇的美利坚遗产旨在建立地方主义、权力分散、自给自足的联邦体系。在经济层面，埃雷拉主义奉行乡村至上主义：主张维系大庄园制根基、拒绝工业化，并通过推广手工教育巩固此理念。与巴特列主义的干预主义和国家主义路线针锋相对，路易斯·阿尔韦托·德·埃雷拉长期倡导小政府国家模式：凭借自由贸易、低税收及免于政府干预的企业生态，为乌拉圭各省创造普惠发展机遇。"
 terrismo_subtype:0 "特拉主义"
 terrismo_subtype_desc:0 "§Y特拉主义§!\n\n£GFX_ideology_terrismo_bar\n\n\n\n\n特拉主义是加夫列尔·特拉个人意识形态的通称，这一思想体系大多未成文且具有强烈个人色彩。这位曾隶属红党并公开追随何塞·巴特列-奥多涅斯的前政客，在其去世后脱离主流派系，组建了融合各派的分裂集团，其支持者包括原属巴特列阵营的法团主义索萨派、自由保守主义里维拉派、温和巴特列主义比埃拉派等红党分支，甚至吸纳了部分来自白党的埃雷拉主义追随者。随着政治立场日益右倾，特拉吸收了西班牙希尔罗夫莱斯与圣胡尔霍、意大利民族主义协会的法团主义思想，同时鼓吹所谓“协作主义”，其理念与俄罗斯及法兰西民族国的协作主义者、俾斯麦治下时期德国的国家社会主义者、墨西哥的共济会派如出一辙。特拉还从基督教与农业右翼中招揽盟友，并捍卫其父何塞·拉迪斯劳·特拉的政治遗产，这位曾掌控红党十余年的强人当年以债务整合及惠及农场主与地主的政策著称。作为政治变色龙，特拉为攫取乌拉圭政治体系的绝对控制权不择手段，而特拉主义正是为这种机会主义追求量身定制的理论框架。他在公开演说中频繁引用柏拉图、马可·奥勒留、俾斯麦乃至马克思与列宁等截然对立的思想家的言论，使得其意识形态持续融合着原本水火不容的理念。尽管理论上坚决反左，特拉主义却保留了前任自由派政府实施的许多民粹主义与惠及工人阶级的改革措施以争取群众支持。特拉本人甚至拥护合作化理念，试图将这种模式推广至农业、畜牧业等社会各领域，并早在1907年执政前就率先推动立法确立八小时工作制这类带有左翼色彩的政策。这种意识形态充满反城市化的乡村本位色彩，依托国家暴力与警察镇压维持高压威权统治，同时以民粹主义为纽带将伪左翼思想与融合型右翼理论杂糅成“革命保守主义”。最终，在创始者兼唯一践行者的家长式强权下，特拉主义诡异地将乌拉圭整个政治光谱凝结成了畸形的统一体。"
 nuevo_ideal_nacional_subtype:0 "新国家理念"
 nuevo_ideal_nacional_subtype_desc:0 "§Y新国家理念§!\n\n£GFX_ideology_nuevo_ideal_nacional_bar\n\n\n\n\n尽管有人将以马科斯·佩雷斯·希门尼斯发展的思想体系冠以其名，称为佩雷斯·希门尼斯主义，但这位委内瑞拉的实用主义考迪罗宣称，他所倡导的民族保守主义哲学代表了一种独特的思想，即所谓新国家理念。这位将军以三大支柱勾勒出将国家提升至世界一流地位的愿景：根基——传统、自然资源与地理位置；宗旨——使国家日益繁荣、尊荣与强大；目标——物质环境的渐进改造与国民素质（物质、道德与智力）的全面提升。唯有通过实施发展型国家资本主义、威权式有序军事主义以及拉美人民团结对抗美国经济殖民主义，方能确保新国家理念所有原则的实现。最终，无论是行动纲领还是理论表述，佩雷斯希门尼斯主义都可能根据这位实用主义独裁者及其独立选举阵线对国家福祉路线的实践需要而灵活变通。"
 zinovievism_subtype:0 "季诺维也夫主义"
 zinovievism_subtype_desc:0 "§Y季诺维也夫主义§!\n\n£GFX_ideology_zinovievism_bar\n\n\n\n\n季诺维也夫主义，亦称布尔什维克列宁主义，是一种为应对战时共产主义政策导致革命退化为僵化专政而兴起的革命学说。它融合了布尔什维克的国际主义精神、十月革命理想中固有的乌托邦情怀，以及政党对革命使命道德必然性的坚定信念。作为列宁思想的理论继承者与复兴者，季诺维也夫构建了兼具人文主义精神与动员效能的无产阶级专政体系，力图通过作为人类道德先锋队的政党重振世界革命动能。在格里戈里·季诺维也夫的追随者看来，共产党是时代良知的化身，其领导者不仅是斗争选拔的产物，更是承载工人阶级历史意志的道德律令践行者。本质上，季诺维也夫主义是一种根植于群众鼓动与修辞煽动的民粹化专政，强调通过渗透学校、文化、军队乃至工会的意识形态运动实施积极的基层政策。因此，格里戈里·季诺维也夫堪称世界共产主义的先知，他笃信布尔什维克事业的神圣性、政党的道德使命，并坚持要捍卫革命成果就必须防止其冷却与变质。"
 francoism_subtype:0 "佛朗哥主义"
 francoism_subtype_desc:0 "§Y佛朗哥主义§!\n\n£GFX_ideology_francoism_bar\n\n\n\n\n响应被剥夺历史与权利的民众呼声，佛朗哥主义作为一场具有鲜明改革主义民族倾向的运动，在拉斐尔·德拉克鲁兹·佛朗哥·奥赫达上校领导下席卷巴拉圭。面对自由党-红党集团永无止境的统治，国家革命联盟成员毅然接管国家，授予佛朗哥上校临时特别权力以重振弗朗西斯科·索拉诺·洛佩斯时代的荣光。尽管支持者主要分裂为社会主义与民族主义两派（分属国家独立联盟、全国劳工联合会和巴拉圭革命党等团体），佛朗哥主义仍被官方定义为“去意识形态化”的学说，拒绝任何极端主义或极权主义。国家革命联盟的核心纲领包含对巴拉圭社会经济结构的彻底改造：通过设立国家英雄日、将殖民遗迹列为保护建筑、为索拉诺·洛佩斯平反并迎葬其遗骸于新建的国家先贤祠，重塑历史认同。佛朗哥及其政党提出的改革措施包括：史无前例的土地改革、8小时工作制、周日休假、第十三个月薪、劳工权利法律保障、自由工会制度、退伍军人终身抚恤、教育普及、侨民归国计划，以及创立共和国银行与公共卫生部等机构。随着1870年腐朽宪法的废除，制定新宪法的国民议会即将召开，民主制度能否回归，或是改革监护将在现代化军队监督下延续，这一切都将由拉斐尔·佛朗哥亲手决定。"
 community_movement_subtype:0 "社群运动"
 community_movement_subtype_desc:0 "§Y社群运动§!\n\n£GFX_ideology_community_movement_bar\n\n\n\n\n若非内战及随后意大利统一政体的瓦解，那位来自都灵附近伊夫雷亚、具有犹太-瓦勒度派血统的工程师兼实业家阿德里亚诺·奥利韦蒂，本可远离政治专心经营事业。半岛上的剧烈分裂迫使许多人采取行动，曾任职于《改革行动》杂志、与卡洛·罗塞利等费边主义者及自由社会主义者思想交锋的奥利维蒂亦不例外。当阿德里亚诺最终落脚意大利共和国时，他意识到重建祖国需要一场自下而上的彻底改革，终结保守派与激进左翼的党阀统治。社群运动由此诞生，它宣称自己是融合自由主义与社会主义阵营的关键，旨在构建尊重所有人权的和谐社会。正如其名所示，社群运动坚决反对半岛再集权化的任何主张，将社区视为未来意大利社会的基本单元。唯有通过联邦制联合文化同源、经济自洽的自治体，才能恢复整个意大利的和平，甚至使其成为未来欧洲联邦化的先驱。对于社会经济问题，社群运动的领袖从自己经营的工厂中找到了答案：在那里，集体幸福被置于首位，冰冷的工作场所蜕变为精心规划的广阔园区，不仅容纳工程师与工人，更汇聚艺术家、作家、设计师与诗人。在这种近乎泰勒主义乌托邦的构想指引下，意大利的景观同样能被重塑，融合技术官僚的科学理性与人文主义的文化精髓，让团结精神凌驾一切，以美学征服资本主义与工团主义的双重桎梏。"
 conservative_feminism_subtype:0 "保守女权主义"
 conservative_feminism_subtype_desc:0 "§Y保守女权主义§!\n\n£GFX_ideology_conservative_feminism_bar\n\n\n\n\n保守女性主义是自由派与社会主义女权主义运动中相对小众的分支，致力于在右翼保守政党或组织框架内推动性别平等，以此区别于激进女性主义。保守女权主义者多为具地方影响力的贵族或中产阶层女性，其权利主张基于性别平等但存在本质差异的核心理念。该思潮常承袭早期母性女权主义传统，主张在维护家庭价值体系的前提下融合民族主义元素，视传统家庭结构为女性权益保障基石。然其对传统制度的捍卫并非绝对——保守女权主义运动往往肇始于对世俗及宗教机构中女性权利缺失的批判。\n\n其政治纲领通常倡导渐进式扩大女性教育权、医疗权及选举权，步伐较左翼更为审慎温和。该运动多源于宗教文化领域的传统女性团体，但亦存在与欧洲及拉美民族民粹主义政党结盟的激进分支。全球视野下，保守女权主义形态各异：欧洲的公教进行会相关妇女团体、法兰西妇女联盟，以及美国凯瑟琳·布什内尔与弗朗西丝·威拉德领导的基督教妇女禁酒联盟尤具代表性。"
 peronism_subtype:0 "庇隆主义"
 peronism_subtype_desc:0 "§Y庇隆主义§!\n\n£GFX_ideology_peronism_bar\n\n\n\n\n胡安·多明戈·庇隆的个人意识形态难以简单界定，这位被民众奉为救世主的政治家，其改造阿根廷的方略必然包含着某种模糊性。对于团结在正义党内的支持者而言，只要实现正义主义纲领，无论采取左翼或右翼原则皆可接受。但庇隆本人从不掩饰其思想渊源，他多次公开承认天主教社会主义、美国进步派政客与英国工党思想家对庇隆主义的深刻影响，以及与之关联的三大旗帜：“经济独立”、“社会正义”与“主权完整”。第一面旗帜将通过扩大国内市场、计划性工业化、部分国有化及政府直接干预来实现；第二面旗帜将包裹在一种海纳百川的爱国主义之中，以军事荣耀为后盾，保障妇女、原住民、少数群体及各阶层工人作为共和国成员的权利；第三面旗帜则唯有立足“第三”立场方能达成，既超越反工团主义与工团主义的对立，又从两者汲取养分，同时抵御外国对政经领域的一切干涉。这就是庇隆的愿景：一个建立在社会正义原则上的独立阿根廷，通过“社会主义”与法团主义政策的混合体，辅以受天主教社会训导庇护的工会网络与利益集团，实现民族式社会主义。尽管批评者斥之为虚伪的个人崇拜，但追随者们对他死心塌地。倘若任由庇隆主义重塑阿根廷的现实，无人知道它最终将引领这个国家走向何方。"
