 marlib_toryism_subtype:0 "英式保守主义"
 marlib_toryism_subtype_desc:0 "§Y英式保守主义§!\n\n£GFX_ideology_toryism_bar\n\n\n\n\n英式保守主义是起源于联合王国及其现殖民地、前殖民地的一众传统保守思想的集合。英式保守主义的词源“托利”起初是对爱尔兰天主教徒的贬义称呼，后被当作对詹姆斯二世国王支持者的蔑称，再往后就演变为了对英国右翼大党的代称。英式保守主义最早出现于英格兰内战中的骑士派，并在随后的几个世纪中受到了埃德蒙·伯克、小威廉·皮特等人的影响。在政策上，英式保守主义高度保守、亲近圣公会、反对自由化、支持君主制，而在经济上，它又在自由市场与贸易保护之间举棋不定，内部也曾因此发生过多次分裂。需要注意的是，英式保守主义这一概念非常宽泛，上面所列的定义并不能涵盖所有的保守派政客，因此也就诞生了诸如“红色保守党”、“高等保守党”之类的术语用以描述种种错综复杂的情况。"
 soccon_maurrassism_subtype:0 "莫拉斯主义"
 soccon_maurrassism_subtype_desc:0 "§Y莫拉斯主义§!\n\n£GFX_ideology_maurras_bar\n\n\n\n\n“莫拉斯主义”又被称为整合民族主义，是法兰西行动的哲学家和思想支柱夏尔·莫拉斯提出的政治、社会和知识领域的论断。在夏尔·莫拉斯看来，存在两个法国：其一是共和制度及其精英代表的“法定国家”，由四大“共犯阶层”支持：犹太人、新教徒、共济会和外邦人，也就是“反法势力”；其二则是真正能代表法兰西人民的“真实国家”，而这也是莫拉斯所鼎力支持的。莫拉斯主义基于社会团结理论，追求以法国曾经的旧制度为模式，实现有机运作的社会。因此，法兰西行动拒绝承认法国大革命及其后的历史，发誓要建立一个地方分权、恪守传统和联邦政体的君主制国家，政治权力将被授予各省议会，而国王作为伟大的全国仲裁者，此外天主教将成为维系国家团结的重要黏合剂。在知识领域，莫拉斯则推崇古典理性主义，反对浪漫主义。"
 available_political_advisor: "§G解锁§!§Y部长§!：\n"
 soclib_popular_patriotism_subtype:0 "大众爱国主义"
 soclib_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 soclib_authoritarian_liberalism_subtype:0 "威权自由主义"
 soclib_authoritarian_liberalism_subtype_desc:0 "§Y威权自由主义§!\n\n£GFX_ideology_authoritarian_liberalism_bar\n\n\n\n\n威权自由主义并不是种具体的意识形态，而是政治舞台上的一种奇异存在，它所追求的愿景偏离了一般的轨道。威权自由主义者们尽管支持建立强而有力又无所不包的行政部门，但他们并不想强制施加什么神圣准则、民族理想或是军事秩序，他们的目的仅仅是为大众带来自由。在经济领域，威权自由主义者往往有着迥异的观点，但大多数都赞成帮扶中小企业、为地方小家带来繁荣。在社会领域，威权自由主义总体偏向保守，但不同国家的不同国情也催生出了更加自由化，甚至极度进步的衍生思想。自由、繁荣、进步是人民所应该拥有的，即使是要将大声尖叫、踢腿哭闹的人民硬拽出那笼罩着他们的愚昧落后也要达成。"
 marlib_authoritarian_liberalism_subtype:0 "威权自由主义"
 marlib_authoritarian_liberalism_subtype_desc:0 "§Y威权自由主义§!\n\n£GFX_ideology_authoritarian_liberalism_bar\n\n\n\n\n威权自由主义并不是种具体的意识形态，而是政治舞台上的一种奇异存在，它所追求的愿景偏离了一般的轨道。威权自由主义者们尽管支持建立强而有力又无所不包的行政部门，但他们并不想强制施加什么神圣准则、民族理想或是军事秩序，他们的目的仅仅是为大众带来自由。在经济领域，威权自由主义者往往有着迥异的观点，但大多数都赞成帮扶中小企业、为地方小家带来繁荣。在社会领域，威权自由主义总体偏向保守，但不同国家的不同国情也催生出了更加自由化，甚至极度进步的衍生思想。自由、繁荣、进步是人民所应该拥有的，即使是要将大声尖叫、踢腿哭闹的人民硬拽出那笼罩着他们的愚昧落后也要达成。"
 marlib_kemalism_subtype:0 "凯末尔主义"
 marlib_kemalism_subtype_desc:0 "§Y凯末尔主义§!\n\n£GFX_ideology_kemalism_bar\n\n\n\n\n“凯末尔主义”一词是指从奥斯曼大维齐尔穆斯塔法·凯末尔帕夏及其领导下的奥斯曼人民党的政治思想中产生的意识形态。这种典型的土耳其式意识形态致力于将老朽的奥斯曼帝国集权化并积极地实现现代化。凯末尔主义支持基于欧洲模式的世俗主义，认为只有通过将伊斯兰教从社会与政治生活中排除出去才能实现现代化，这让该主义备受宗教机构与苏丹亲信的批评。另一方面，凯末尔主义又通过宣扬土耳其民族主义并压制威胁帝国存亡的少数民族的分离主义来进行国家的集权化。这种意识形态在土耳其影响正盛，其虽招致了一些批评，但也被认为是解决欧洲病夫的痼疾的主要办法之一。"
 pataut_right_syndicalism_subtype:0 "右翼工团主义"
 pataut_right_syndicalism_subtype_desc:0 "§Y右翼工团主义§!\n\n£GFX_ideology_right_syndicalism_bar\n\n\n\n\n右翼工团主义包括反动化的国家工团主义、共治主义、长枪党主义和其他各种小型运动的思想，其试图将工团主义经济与法团主义和民族主义理念结合在一个反社会主义的制度之中。右翼工团主义尤其在拉丁美洲和伊比利亚地区流行，在意大利和法国也有少许支持者。右翼工团主义追求一种“纯净”、民粹式的工团主义，它通常以民族主义为基础，并且常常会表现出军国主义的倾向。"
 security_state_subtype:0 "安保国家"
 security_state_subtype_desc:0 "§Y安保国家§!\n\n£GFX_ideology_security_state_bar\n\n\n\n\n安保国家与其说是一种意识形态，倒不如说是指一类国家，其共同点就是当权者通过情报机构或各类宪警组织确立了自己至高无上的影响力，实现了对政府的完全控制。虽然大多数安保国家的领袖都只关注于掌控国家的某一或所有方面，但其中也不乏带有政治思想、政治倾向之别类。安保国家的掌事者究竟是在以自己的方式拯救自己的国民，还是仅仅是为了权力，这就只有当局者自己知晓了。"
 tot_islamic_socialism_subtype:0 "伊斯兰社会主义"
 tot_islamic_socialism_subtype_desc:0 "§Y伊斯兰社会主义§!\n\n£GFX_ideology_islamic_socialism_bar\n\n\n\n\n伊斯兰社会主义，或称穆斯林社会主义，是一类广泛而形式各异的社会主义和左翼制度的统称，它们的共同点是拥护根植于穆斯林信仰以及穆罕默德、《古兰经》的教义的精神式社会主义（通常是马克思主义，但也不能百分百保证）。伊斯兰社会主义者的思想大多来自于先知早期的麦地那福利制度——天课制度，以及其他各种左翼、进步主义、民粹主义思想，甚至是传统主义和神智学。伊斯兰社会主义者之间的差异很大，但他们都在很大程度上认为《古兰经》为他们的立场提供了保障和支持，为此，他们将不惜一切代价，在真主的指引下，为世界降下一场神圣而虔诚的革命。"
 marlib_paneuropeanism_subtype:0 "广义泛欧主义"
 marlib_paneuropeanism_subtype_desc:0 "§Y广义泛欧主义§!\n\n£GFX_ideology_marlib_paneuropeanism_bar\n\n\n\n\n从广义上来讲，泛欧主义即是致力于以联邦、单一制国家，乃至紧密联盟等方式拉近欧洲各国与人民间关系的一种运动。泛欧主义虽然衍生出了各式流派、思想，但欧洲一体化这一概念的最普遍形式还是拥护某种共通的“欧洲价值观”，这一价值观可以是中世纪的基督教传承，也可以是自由主义革命的精神。有不少重量级人物都倡导过由人权、某种形式的民主、法律法规缔造的统一欧洲，而其中最出名的当属康拉德·阿登纳、加埃塔诺·马蒂诺、卡洛·斯福尔扎和米兰·霍贾。"
 socialist_feminism_subtype:0 "社会女权主义"
 socialist_feminism_subtype_desc:0 "§Y社会女权主义§!\n\n£GFX_ideology_social_feminism_bar\n\n\n\n\n比起通用的意识形态，社会女权主义更像是一个术语，指的是那些把女权主义与女性争取解放的斗争融入左翼大背景中的各路思想流派与政治运动。虽然名为“社会女权主义”，但许多知名的思想家其实很是排斥“女权”这个词，因为她们认为女权与资产阶级密不可分，因而对于推动劳动妇女的进步毫无益处。社会女权主义内的两大主流分支为无政府女权主义和马克思女权主义，前者的代表人物是特蕾莎·马涅、爱玛·戈德曼和伊藤野枝，而后者则为亚历山德拉·柯伦泰、克拉拉·蔡特金和玛丽·英曼。左翼女权主义者们活跃于从无政府主义、工团主义到马克思主义，甚至是国家工团主义的各式政党、组织之中（大多都是委身于国内最大的社会主义政党之中，虽然这些政党基本被男性所把持，但他们并不反对女权主义者，还把她们视作革命的同伴，不过倒也有政治机构出于“意识形态的偏差”打压社会女权主义者代表的情况存在），她们不光是为了妇女的解放和平权而战，更是为了全体民众的权利、为了一个公平公正的社会而战。"
 radsoc_socialist_feminism_subtype:0 "社会女权主义"
 radsoc_socialist_feminism_subtype_desc:0 "§Y社会女权主义§!\n\n£GFX_ideology_social_feminism_bar\n\n\n\n\n比起通用的意识形态，社会女权主义更像是一个术语，指的是那些把女权主义与女性争取解放的斗争融入左翼大背景中的各路思想流派与政治运动。虽然名为“社会女权主义”，但许多知名的思想家其实很是排斥“女权”这个词，因为她们认为女权与资产阶级密不可分，因而对于推动劳动妇女的进步毫无益处。社会女权主义内的两大主流分支为无政府女权主义和马克思女权主义，前者的代表人物是特蕾莎·马涅、爱玛·戈德曼和伊藤野枝，而后者则为亚历山德拉·柯伦泰、克拉拉·蔡特金和玛丽·英曼。左翼女权主义者们活跃于从无政府主义、工团主义到马克思主义，甚至是国家工团主义的各式政党、组织之中（大多都是委身于国内最大的社会主义政党之中，虽然这些政党基本被男性所把持，但他们并不反对女权主义者，还把她们视作革命的同伴，不过倒也有政治机构出于“意识形态的偏差”打压社会女权主义者代表的情况存在），她们不光是为了妇女的解放和平权而战，更是为了全体民众的权利、为了一个公平公正的社会而战。"
 neo_socialism_subtype:0 "新社会主义"
 neo_socialism_subtype_desc:0 "§Y新社会主义§!\n\n£GFX_ideology_neo_socialism_bar\n\n\n\n\n新社会主义是前工人国际法国支部成员马塞尔·戴亚及其法兰西社会党的造物。为了回答世界面临之难题，也为了在改良主义缓慢的社会转型以及激进革命的失败间寻得一个平衡点，戴亚从其它社会主义思想家，如比利时工党的亨利·德·曼及其“规划主义”构想处习得了灵感，带着工人国际法国支部的许多右翼成员出走，成立了新的政治运动。新社会主义的首要目标是引入“建设性革命”，即利用民众任命建立起由专家组成的威权技官政府，由它来负责旧社会主义制度未能实现的社会转型。在新社会主义制度下，阶级斗争的破坏性思想将被阶级合作和民族团结所取代，反资本主义的声浪会再上层楼，而现存的工会也会被大大削弱。就戴亚在法国的亲身实践而言，法兰西社会党把自己视为了正统的雅各宾派，坚持不懈地与多列士之流的百般嘲讽以及无政府主义者唯恐天下不乱的行事方式作斗争。戴亚以及新社会主义团体大都出身于战前社会主义阵营中占据主流的和平主义运动，因而他们对于军国主义始终保持着一定的距离，更喜欢通过和平、合作的方式实现欧洲各国的大一统（当然了，前提是其不与新社会主义为敌）。"
 socdem_market_socialist_subtype:0 "市场社会主义"
 socdem_market_socialist_subtype_desc:0 "§Y市场社会主义§!\n\n£GFX_ideology_market_socialism_bar\n\n\n\n\n虽然大多数社会主义都拒绝自由市场，但市场社会主义者认为社会主义经济与市场的规则、流动并不矛盾。实行市场社会主义的国家对小型企业和对外贸易是来者不拒，其产生的额外利润会被分配到社会项目或公民红利中。市场社会主义政府之间的差别可能会很大，但它们中大多数都遵循着“苏维埃民主”的模式。这一思想最著名的例子便是推行新经济政策的尼古拉·布哈林领导的人民社会党。"
 socdem_kimbanguism_subtype:0 "基班古主义"
 socdem_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与社会主义团体之间的关系，基班古主义逐渐接受了刚果民族主义、马克思主义和社会主义经济学，因而变得激进反帝，不过总体上其仍遵循着和平主义和部落主义的立场。"
 natpop_indigenous_communitarianism_subtype:0 "土著社群主义"
 natpop_indigenous_communitarianism_subtype_desc:0 "§Y土著社群主义§!\n\n£GFX_ideology_indigenous_communitarianism_bar\n\n\n\n\n土著社群主义，也被错误地称为部落原始社会主义、部落君主社会主义、部落无政府主义等各种充满短视和意识形态偏见的术语，其指的是植根于部落习俗和文化之上、广泛而松散的社会经济系统。从当代西方势力的视角来看，这些制度与各种左翼思想总似有着某种说不清道不明的关系。但是，从酋长国、土著王国到民主的部落议会或分权化的公社和村庄联合体，这些土著国家根本不是社会主义或进步主义者，那些所谓的术语完全是出于西方的经验和视角，出于那些土著群体闻所未闻的理论。土著社群主义国家的政策往往具有某些共通点，如社群主义、平等主义、非传统的性别角色、某种福利或社会保障、基于互惠的经济体系，甚至小规模的分产主义等等。尽管以有色眼镜来看，土著社群主义确实可以说是有点左倾，但它们其实还是以孤立主义为主，几乎不会与社会主义世界产生接触。"
 radsoc_revisionist_marxism_subtype:0 "修正马克思主义"
 radsoc_revisionist_marxism_subtype_desc:0 "§Y修正马克思主义§!\n\n£GFX_ideology_revi_marx_bar\n\n\n\n\n修正马克思主义又称改良马克思主义（其支持者则是直接称其为“马克思主义”），是马克思主义的一种形式，它赞同卡尔·马克思的分析及结论，但在实现马克思主义的目标，即通过革命实现真正的社会主义社会的问题上却有着截然不同的看法。修正马克思主义由德国社会民主党的笔杆子爱德华·伯恩斯坦提出，它认为参与进自由主义体制及其选举中才是实现共产主义的正道，并强调向社会主义制度的转变不需要流血的革命，资本主义制度下的和平渐进式改革也能达成同样的目的。虽被大多数马克思主义者和共产主义者斥为走资叛徒，但修正马克思主义者的决心却与革命者无异，誓要为全世界的无产阶级创造一个更美好的社会。"
 revisionist_marxism_subtype:0 "修正马克思主义"
 revisionist_marxism_subtype_desc:0 "§Y修正马克思主义§!\n\n£GFX_ideology_revi_marx_bar\n\n\n\n\n修正马克思主义又称改良马克思主义（其支持者则是直接称其为“马克思主义”），是马克思主义的一种形式，它赞同卡尔·马克思的分析及结论，但在实现马克思主义的目标，即通过革命实现真正的社会主义社会的问题上却有着截然不同的看法。修正马克思主义由德国社会民主党的笔杆子爱德华·伯恩斯坦提出，它认为参与进自由主义体制及其选举中才是实现共产主义的正道，并强调向社会主义制度的转变不需要流血的革命，资本主义制度下的和平渐进式改革也能达成同样的目的。虽被大多数马克思主义者和共产主义者斥为走资叛徒，但修正马克思主义者的决心却与革命者无异，誓要为全世界的无产阶级创造一个更美好的社会。"
 soccon_gaullism_subtype:0 "戴高乐主义"
 soccon_gaullism_subtype_desc:0 "§Y戴高乐主义§!\n\n£GFX_ideology_gaullism_bar\n\n\n\n\n戴高乐主义是从法国将军夏尔·戴高乐的思想与言行发展而来的一种意识形态。受旧日波拿巴主义的影响，戴高乐主义者反对代议制及其腐败本质，寻求以温和、统一的非种族民族主义以及法兰西例外论的形式，在别具一格又享有人民公投赋予的合法性及温和“民主”式的个人崇拜领袖（总统或君主均可）的带领下，建立一个政治上中央集权、语言和文化上整齐统一的爱国主义国度。在经济领域，戴高乐主义提倡监管之下的市场经济以及国商合作，使经济在始终服务于国家利益的同时，向底层民众提供有限但足够的社会福利。"
 authdem_gaullism_subtype:0 "戴高乐主义"
 authdem_gaullism_subtype_desc:0 "§Y戴高乐主义§!\n\n£GFX_ideology_gaullism_bar\n\n\n\n\n戴高乐主义是从法国将军夏尔·戴高乐的思想与言行发展而来的一种意识形态。受旧日波拿巴主义的影响，戴高乐主义者反对代议制及其腐败本质，寻求以温和、统一的非种族民族主义以及法兰西例外论的形式，在别具一格又享有人民公投赋予的合法性及温和“民主”式的个人崇拜领袖（总统或君主均可）的带领下，建立一个政治上中央集权、语言和文化上整齐统一的爱国主义国度。在经济领域，戴高乐主义提倡监管之下的市场经济以及国商合作，使经济在始终服务于国家利益的同时，向底层民众提供有限但足够的社会福利。"
