 syn_mutualism_subtype:0 "互助主义"
 syn_mutualism_subtype_desc:0 "§Y互助主义§!\n\n£GFX_ideology_mutualism_bar\n\n\n\n\n互助主义，或称互助无政府主义，源于19世纪法国无政府主义理论家皮埃尔-约瑟夫·蒲鲁东的著作，同时也扎根于更加古老的自发社会援助与团结传统。有些人将其视为俄国米哈伊尔·巴枯宁所倡导的早期集体无政府主义的演进或分支。互助主义旨在构建这样一种社会：个体不是通过政府强制力或立法行动，而是通过自发创建无需权威干预的无政府主义法律拟像，鼓励参与集体所有制和组织。自由市场、私有财产甚至资本形式的延续，使互助主义成为了集体无政府主义中的异类，但互助主义者视此为实现最大自由的必要工具——因为市场赋予了个体以合作方式选择为谁工作的能力。市场并非由某种可能导致资本垄断给特定个体的更高权威支撑，而是由互助信贷银行支持。互助主义者认为取之不尽的自然资源是全人类的遗产，不应以他人为代价囤积，只有劳动产物才能转化为私有财产，因而自然资源完全不受私有财产权约束。互助主义在社会变革方法上不同于其他无政府主义流派：对互助主义者而言，革命并非社会弊病的万能解药。相反，应通过渐进手段实现社会转变——例如创建合作社、互助协会和互助信贷银行，在与现有体系互动中一步步取而代之。互助主义者认为，社会中早已存在多种互助组织形式，随着人们日益意识到团结与互助的重要性，旧制度将在人民的内省和自我转变中逐渐被抛入历史的垃圾堆，直至整个社会达到蒲鲁东所说的“完全自由状态”。这种强调通过个体进化实现集体行动的理念，也体现在互助主义者对群众行动的超然态度上。因此，蒲鲁东的理想更倾向于由各类生产者组成的松散联邦，人民自发团结一致，亲手赚取的资本自由流动，为彼此提供美好生活的一切所需。"
 syn_individualist_anarchism_subtype:0 "个人无政府主义"
 syn_individualist_anarchism_subtype_desc:0 "§Y个人无政府主义§!\n\n£GFX_ideology_indiv_anar_bar\n\n\n\n\n个人无政府主义，或称个人主义，无疑是整个无政府主义思想谱系中最多元化的形态，其复杂程度远超这个本就充满差异的意识形态群体。该思潮可分为美国派与欧洲派两大分支，但不像其他无政府主义流派拥有蒲鲁东、克鲁泡特金、巴枯宁那样的“教父级”人物。相反，许多个人无政府主义运动是从更大的无政府主义派系中分裂而来——美式个人主义者通常脱胎于互助主义，而欧式个人主义者则往往从暴动无政府主义或罪犯无政府主义者阵营中崛起。这种分野在两种个人无政府主义的经济模式选择上尤为明显：以莱桑德·斯波纳为代表的美式个人主义者普遍允许自由市场继续存在，只要求废除所有可能导致垄断的治理形式；而欧式个人无政府主义者则倾向于将无政府共产主义视为终极社会形态。不过，与大多数无政府主义者将经济运作模式视为意识形态基石不同，对于欧式个人主义者而言，实现革命才是首要任务。共产主义是他们普遍认同的新社会形式，但成功的革命将消灭无产阶级这个资本主义产物的阶级本身。个人无政府主义者更常致力于通过其他方式拓展自由边界：摧毁限制性的社会角色，让裸体主义、自由恋爱、天然主义等理念从古老禁忌的废墟中真正绽放；接纳传统左翼运动所排斥的妓女、罪犯等边缘群体；质疑工会和无政府工团主义是另一种不必要的等级制创造。在个体无政府主义者眼中，“我”是至高无上的权威，任何试图干预这一神圣主体的力量都应予以抵抗。有些个人无政府主义者甚至完全拒绝集体主义，不惜一切代价追求最大程度的个人自由，认为世间万物皆不足与之相提并论。这种意识形态天然具有分散性，主要得到无政府主义知识分子群体的支持，但仍发展出众多分支：马克斯·施蒂纳的利己无政府主义、方兴未艾的无政府女权主义运动，以及在某种程度上包含自由思想理想主义的诸多变体。"
