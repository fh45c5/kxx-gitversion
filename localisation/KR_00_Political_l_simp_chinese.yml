 malthusianism_subtype:0 "新马尔萨斯主义"
 malthusianism_subtype_desc:0 "§Y新马尔萨斯主义§!\n\n£GFX_ideology_malthusianism_bar\n\n\n\n\n新马尔萨斯主义是学者托马斯·马尔萨斯思想的复兴。这位生活在18、19世纪之交的学者曾预言：若不能控制人口增长，人类将面临灭绝。马尔萨斯认为，人口增速可能超过社会农业产出，导致底层民众生活水平急剧恶化，引发足以动摇统治阶层的社会动荡，最终酿成马尔萨斯式灾难致使文明崩溃。这一理论在20世纪曙光初现时再度兴起，尤其是在左翼圈子之中，当时正值世界大战前人口激增期，而社会主义者往往将人口增长视为壮大革命生力军的机会。但在新马尔萨斯主义者看来，人口增长带来的纯属负面影响。他们不再拘泥于原先理论中的社会崩溃论，而是着眼于大家庭模式会导致贫困、饥馑与社会阶层固化。\n\n他们认为，供养大家庭的工人既无暇参与政治文化社会活动，又因害怕失业饥馑而被永远禁锢在劳作中。过剩人口不会引发暴力革命，只会成为资本主义工厂和帝国主义战争的消耗品。为应对此问题，新马尔萨斯主义者主要从医学与母职角度寻求解决方案：通过“生育罢工”运动、普及避孕器具及使用知识、加强意外怀孕防范教育，尤其是推动女性进入职场来限制人口增长。\n\n新马尔萨斯主义者主张，唯有当全社会具备养育大家庭的必要条件时，人口增长才具有积极意义。这一思想在伊比利亚、北美和德国取得了一定成功，主要推手包括路易斯·布尔菲·德昆塔纳、哈夫洛克·埃利斯和马格努斯·赫希菲尔德等人物。诸如人类再生联盟国际联合会与世界性改革联盟等全球组织，在女权主义和左翼群体中持续传播该理论方面发挥着重要作用。如今该思想正日益与环境主义、自然主义、性少数群体权益及温和优生学产生关联。"
