 maximato_subtype:0 "最高领袖体制"
 maximato_subtype_desc:0 "§Y最高领袖体制§!\n\n£GFX_ideology_maximato_bar\n\n\n\n\n“最高领袖体制”一词与其说是一种结构化的意识形态，不如说代表着人称“政治变色龙”的冒牌社会主义者普鲁塔尔科·埃利亚斯·卡列斯那时常反复横跳的思想主张。卡列斯主张不惜动用暴力实现国家集权，将权力掌握在领袖个人手中，在塑造强烈的个人崇拜的同时禁止反对派存在。在最高领袖治下，国家奉行极端且暴力的无神论，宗教人士和机构会受到严重的迫害和歧视；经济则完全处于国家控制之下；在外交政策方面则自豪地奉行孤立主义，宣称它有能力在没有任何外国援助的情况下维持国家生存。"
 tot_developing_leftism_subtype:0 "发展中社会主义"
 tot_developing_leftism_subtype_desc:0 "§Y发展中社会主义§!\n\n£GFX_ideology_developing_socialism_bar\n\n\n\n\n发展中社会主义有时也被称为部落左翼主义或土著原始社会主义，其指的是直到最近才开始理解和接受社会主义理论，并开始为实现无产阶级梦想而奋斗的传统非现代政府。发展中社会主义者往往受到为他们带来社会主义思想的外部势力或人物的影响，他们不坚持任何一种左派理念，而是经常吸收各种各样的思想，以便建立适合国家具体现实、文化和传统的意识形态。尽管发展中社会主义只是通往“真正”的社会主义道路上的中间一步，但它也可以成为这些国家的终极目标，倘若他们仅仅是为了让社会更加繁荣而平等，或不想再进行意识形态实验的话。"
 syn_developing_leftism_subtype:0 "发展中社会主义"
 syn_developing_leftism_subtype_desc:0 "§Y发展中社会主义§!\n\n£GFX_ideology_developing_socialism_bar\n\n\n\n\n发展中社会主义有时也被称为部落左翼主义或土著原始社会主义，其指的是直到最近才开始理解和接受社会主义理论，并开始为实现无产阶级梦想而奋斗的传统非现代政府。发展中社会主义者往往受到为他们带来社会主义思想的外部势力或人物的影响，他们不坚持任何一种左派理念，而是经常吸收各种各样的思想，以便建立适合国家具体现实、文化和传统的意识形态。尽管发展中社会主义只是通往“真正”的社会主义道路上的中间一步，但它也可以成为这些国家的终极目标，倘若他们仅仅是为了让社会更加繁荣而平等，或不想再进行意识形态实验的话。"
 left_nationalism_subtype:0 "左翼民族主义"
 left_nationalism_subtype_desc:0 "§Y左翼民族主义§!\n\n£GFX_ideology_left_nationalism_bar\n\n\n\n\n左翼民族主义，通常也称为社会民族主义，是源于受社会主义思想影响的各种民族解放运动的一种独特民族主义形式。左翼民族主义者将民族自决视为最高准则，努力为同胞人民建立一个国家，以让人民享有主权和（符合他们定义的）平等。左翼民族主义者反对其右翼同道，在斗争中坚决拒绝以种族而不是阶级为区分。"
 radsoc_indigenous_communitarianism_subtype:0 "土著社群主义"
 radsoc_indigenous_communitarianism_subtype_desc:0 "§Y土著社群主义§!\n\n£GFX_ideology_indigenous_communitarianism_bar\n\n\n\n\n土著社群主义，也被错误地称为部落原始社会主义、部落君主社会主义、部落无政府主义等各种充满短视和意识形态偏见的术语，其指的是植根于部落习俗和文化之上、广泛而松散的社会经济系统。从当代西方势力的视角来看，这些制度与各种左翼思想总似有着某种说不清道不明的关系。但是，从酋长国、土著王国到民主的部落议会或分权化的公社和村庄联合体，这些土著国家根本不是社会主义或进步主义者，那些所谓的术语完全是出于西方的经验和视角，出于那些土著群体闻所未闻的理论。土著社群主义国家的政策往往具有某些共通点，如社群主义、平等主义、非传统的性别角色、某种福利或社会保障、基于互惠的经济体系，甚至小规模的分产主义等等。尽管以有色眼镜来看，土著社群主义确实可以说是有点左倾，但它们其实还是以孤立主义为主，几乎不会与社会主义世界产生接触。"
 developing_leftism_subtype:0 "发展中社会主义"
 developing_leftism_subtype_desc:0 "§Y发展中社会主义§!\n\n£GFX_ideology_developing_socialism_bar\n\n\n\n\n发展中社会主义有时也被称为部落左翼主义或土著原始社会主义，其指的是直到最近才开始理解和接受社会主义理论，并开始为实现无产阶级梦想而奋斗的传统非现代政府。发展中社会主义者往往受到为他们带来社会主义思想的外部势力或人物的影响，他们不坚持任何一种左派理念，而是经常吸收各种各样的思想，以便建立适合国家具体现实、文化和传统的意识形态。尽管发展中社会主义只是通往“真正”的社会主义道路上的中间一步，但它也可以成为这些国家的终极目标，倘若他们仅仅是为了让社会更加繁荣而平等，或不想再进行意识形态实验的话。"
 marechal_democracy_subtype:0 "元帅民主"
 marechal_democracy_subtype_desc:0 "§Y元帅民主§!\n\n£GFX_ideology_mareshal_bar\n\n\n\n\n甘末林治下的法国有一种独特的制度，在这种制度下，民主社会主义政府受到权力极大的强势军队的保护和支持。在大元帅的领导下，戒严是为了保障民主进程，因为法兰西公社需要在清除激进主义和极端主义的同时，大步迈向一个由军国主义和公民爱国主义支撑的温和社会主义社会。"
 socdem_left_nationalism_subtype:0 "左翼民族主义"
 socdem_left_nationalism_subtype_desc:0 "§Y左翼民族主义§!\n\n£GFX_ideology_left_nationalism_bar\n\n\n\n\n左翼民族主义，通常也称为社会民族主义，是源于受社会主义思想影响的各种民族解放运动的一种独特民族主义形式。左翼民族主义者将民族自决视为最高准则，努力为同胞人民建立一个国家，以让人民享有主权和（符合他们定义的）平等。左翼民族主义者反对其右翼同道，在斗争中坚决拒绝以种族而不是阶级为区分。"
 socdem_agrarianism_subtype:0 "农业主义"
 socdem_agrarianism_subtype_desc:0 "§Y农业主义§!\n\n£GFX_ideology_soclib_agrarianism_bar\n\n\n\n\n农业主义并不是一套有着中心理论或基本原理的具体意识形态，而是对世界各地关注农民利益、倾听农民诉求的各式运动的总称。农业主义的支持者既有地主豪绅，也有中下贫农，既受居于上层凤尾者之青睐，亦得到中下层之拥戴。政治概念上的农业主义起源于自由放任主义者、重农学派的弗朗索瓦·魁奈提出的“自然政府”，以及托马斯·杰斐逊的乡村美德共和国之说。各农业党派的支持者们一致认为，土地上的人民乃是社会的基石，是国家有机体之中最重要的器官，不过，若具体到经济、税收、保护主义与自由贸易之抉择、政府体制、宗教等方面，又是百花齐放百家争鸣。农业党派多为传统、保守的一方，但同时也存在着相同数量的激进自由派和彻头彻尾的社会主义派，以及夹在二者之间、特立独行的右翼势力，而这一巨大的差异仅仅环视一下周遭的部分农业运动便可略窥一二，例如德国持民族革命观点的农村人民运动、保守的保皇派农民联合会、中道为上的捷克农业党及芬兰农民联盟，以及推崇激进社会变革的波兰人民党“解放”、保加利亚农民联盟。"
 indigenous_communitarianism_subtype:0 "土著社群主义"
 indigenous_communitarianism_subtype_desc:0 "§Y土著社群主义§!\n\n£GFX_ideology_indigenous_communitarianism_bar\n\n\n\n\n土著社群主义，也被错误地称为部落原始社会主义、部落君主社会主义、部落无政府主义等各种充满短视和意识形态偏见的术语，其指的是植根于部落习俗和文化之上、广泛而松散的社会经济系统。从当代西方势力的视角来看，这些制度与各种左翼思想总似有着某种说不清道不明的关系。但是，从酋长国、土著王国到民主的部落议会或分权化的公社和村庄联合体，这些土著国家根本不是社会主义或进步主义者，那些所谓的术语完全是出于西方的经验和视角，出于那些土著群体闻所未闻的理论。土著社群主义国家的政策往往具有某些共通点，如社群主义、平等主义、非传统的性别角色、某种福利或社会保障、基于互惠的经济体系，甚至小规模的分产主义等等。尽管以有色眼镜来看，土著社群主义确实可以说是有点左倾，但它们其实还是以孤立主义为主，几乎不会与社会主义世界产生接触。"
 socdem_developing_leftism_subtype:0 "发展中社会主义"
 socdem_developing_leftism_subtype_desc:0 "§Y发展中社会主义§!\n\n£GFX_ideology_developing_socialism_bar\n\n\n\n\n发展中社会主义有时也被称为部落左翼主义或土著原始社会主义，其指的是直到最近才开始理解和接受社会主义理论，并开始为实现无产阶级梦想而奋斗的传统非现代政府。发展中社会主义者往往受到为他们带来社会主义思想的外部势力或人物的影响，他们不坚持任何一种左派理念，而是经常吸收各种各样的思想，以便建立适合国家具体现实、文化和传统的意识形态。尽管发展中社会主义只是通往“真正”的社会主义道路上的中间一步，但它也可以成为这些国家的终极目标，倘若他们仅仅是为了让社会更加繁荣而平等，或不想再进行意识形态实验的话。"
 soclib_indigenous_communitarianism_subtype:0 "土著社群主义"
 soclib_indigenous_communitarianism_subtype_desc:0 "§Y土著社群主义§!\n\n£GFX_ideology_indigenous_communitarianism_bar\n\n\n\n\n土著社群主义，也被错误地称为部落原始社会主义、部落君主社会主义、部落无政府主义等各种充满短视和意识形态偏见的术语，其指的是植根于部落习俗和文化之上、广泛而松散的社会经济系统。从当代西方势力的视角来看，这些制度与各种左翼思想总似有着某种说不清道不明的关系。但是，从酋长国、土著王国到民主的部落议会或分权化的公社和村庄联合体，这些土著国家根本不是社会主义或进步主义者，那些所谓的术语完全是出于西方的经验和视角，出于那些土著群体闻所未闻的理论。土著社群主义国家的政策往往具有某些共通点，如社群主义、平等主义、非传统的性别角色、某种福利或社会保障、基于互惠的经济体系，甚至小规模的分产主义等等。尽管以有色眼镜来看，土著社群主义确实可以说是有点左倾，但它们其实还是以孤立主义为主，几乎不会与社会主义世界产生接触。"
 soclib_tribal_councilism_subtype:0 "部落共和议会主义"
 soclib_tribal_councilism_subtype_desc:0 "§Y部落共和议会主义§!\n\n£GFX_ideology_tribal_councilism_bar\n\n\n\n\n部落共和议会主义，或者部落市场民主主义，描述了各种传统的、非西方化的土著社会。这些政府积极接受类似于西方现代资本主义思想的经济体系，同时按照某种模糊或特定的民主形式组织政府。从新大陆某些“美国化”的部落，到生活在殖民地边缘受到影响的许多孤立非洲国家，他们之间的差异很大，但都试图通过选举酋长或部落议会来建立一种模糊的代表制共和制度，同时操弄白人的资本主义游戏，以追求国家经济的繁荣。"
 meritocratic_liberalism_subtype:0 "精英自由主义"
 tribal_councilism_subtype:0 "部落共和议会主义"
 tribal_councilism_subtype_desc:0 "§Y部落共和议会主义§!\n\n£GFX_ideology_tribal_councilism_bar\n\n\n\n\n部落共和议会主义，或者部落市场民主主义，描述了各种传统的、非西方化的土著社会。这些政府积极接受类似于西方现代资本主义思想的经济体系，同时按照某种模糊或特定的民主形式组织政府。从新大陆某些“美国化”的部落，到生活在殖民地边缘受到影响的许多孤立非洲国家，他们之间的差异很大，但都试图通过选举酋长或部落议会来建立一种模糊的代表制共和制度，同时操弄白人的资本主义游戏，以追求国家经济的繁荣。"
 soccon_bonapartism_subtype:0 "波拿巴主义"
 soccon_bonapartism_subtype_desc:0 "§Y波拿巴主义§!\n\n£GFX_ideology_bonapartism_bar\n\n\n\n\n波拿巴主义是一种直接受到法国皇帝拿破仑一世及其继任者的政策启发而形成的意识形态。这种意识形态支持由一位领袖拥有强大的行政权力，无论是以共和制还是君主制的形式，但与传统独裁不同的是，这位统治者与其臣民之间会建立直接、民主和个人的联系，通常采取组织投票和公投的形式。同时波拿巴主义政权也重视国家军备的建设。波拿巴主义者往往是民粹主义者，又鼓吹精英统治，将其视为正确的政府组织形式。这一意识形态虽然在20世纪衰落，但仍被几个不同的法国政治运动所主张，其中大多数运动呼吁让波拿巴家族回归王位。尽管颇为罕见，但一些非法国人也会声称自己是波拿巴主义者，比如危地马拉的乌维科将军。"
 soccon_tribal_chiefdom_subtype:0 "部落家长制"
 soccon_tribal_chiefdom_subtype_desc:0 "§Y部落家长制§!\n\n£GFX_ideology_tribal_chiefdom_bar\n\n\n\n\n部落家长制，有时会被西方人错误地称为“酋长制”或部落君主制，是对分散在南北美、非洲以及亚洲和大洋洲的各种类型部落政府的描述，这些政府以世袭或民选的酋长或其他领导人为中心。从民主选举出的部落主席到完全世袭的酋长，这些政府的运作方式与欧洲君主制相似，但不那么带有华贵性。部落家长制国家因为对人民旧时传统的尊重而团结在一起，致力于为民众提供非社会主义的家长制民粹主义，促进社会内部所有人民的共同繁荣。他们之间的主要区别在于如何组织经济，趋向现代主义还是传统主义，领导人的性质以及拥有多少权力。"
 soccon_tribal_councilism_subtype:0 "部落共和议会主义"
 soccon_tribal_councilism_subtype_desc:0 "§Y部落共和议会主义§!\n\n£GFX_ideology_tribal_councilism_bar\n\n\n\n\n部落共和议会主义，或者部落市场民主主义，描述了各种传统的、非西方化的土著社会。这些政府积极接受类似于西方现代资本主义思想的经济体系，同时按照某种模糊或特定的民主形式组织政府。从新大陆某些“美国化”的部落，到生活在殖民地边缘受到影响的许多孤立非洲国家，他们之间的差异很大，但都试图通过选举酋长或部落议会来建立一种模糊的代表制共和制度，同时操弄白人的资本主义游戏，以追求国家经济的繁荣。"
 authdem_boer_nationalism_subtype:0 "布尔民族主义"
 authdem_boer_nationalism_subtype_desc:0 "§Y布尔民族主义§!\n\n£GFX_ideology_boer_nationalism_bar\n\n\n\n\n布尔民族主义，或称非洲白人民族主义，是一种南非的民族主义意识形态，扎根于自认为是南非真正的居民的非洲白人群体。这些布尔白人排斥土著和英国殖民者，并热切地谈论布尔人在非洲的光辉历史——从大迁徙到布尔战争。这种意识形态往往主张某种形式的种族隔离，并钟情于南非荷兰语。从革命左翼主义到右翼民粹民族主义，各种政党都有实践这一意识形态的，但也确实存在更温和的信奉者，尽管布尔民族主义如今的核心无疑是以詹姆斯·赫尔佐格和丹尼尔·弗朗索瓦·马兰博士为代表的国民党。"
 authdem_bonapartism_subtype:0 "波拿巴主义"
