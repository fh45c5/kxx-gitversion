 chinese_federalism_subtype:0 "联省制"
 chinese_federalism_subtype_desc:0 "§Y联省制§!\n\n£GFX_ideology_sino_federalism_bar\n\n\n\n\n所谓的联省是一极其多元的概念，其大抵诞生于二十年代，主张以分权、共和、民主之模式治理中国广袤而迥异的国土。在联省派看来，欲使华夏之内各民族、文化繁荣昌盛，唯有由普选产生的地方议会之自治方为上策。联省派反对孙中山的国民党训政理念，认为人民有着自己的见解，已具备了辨别利弊的能力。此外，联省派的学者还要求来一场全面的农业改革，包括农民补贴及推动农会之发展，不过，至于如何对待大地主，目前尚没有统一定论。就社会立场而言，联省派多持进步观点，要求彻底革新陈旧的律法、建设新式官僚体系，并以职业行政人员取代军阀之腐败。联省派的思想泉源颇多，而今日最为人所称道者，非革命将军陈炯明莫属，其欲效法美利坚合众国，“以美式经验建立起中华合众省”。虽遭到了孙中山等人的批评，认为其不仅会使中国丧失抵御外侮之能力，还会加剧地方割据，但在大清帝国日暮西山的当口，联省制已实实在在地卷土重来。"
 soclib_chinese_federalism_subtype:0 "联省制"
 soclib_chinese_federalism_subtype_desc:0 "§Y联省制§!\n\n£GFX_ideology_sino_federalism_bar\n\n\n\n\n所谓的联省是一极其多元的概念，其大抵诞生于二十年代，主张以分权、共和、民主之模式治理中国广袤而迥异的国土。在联省派看来，欲使华夏之内各民族、文化繁荣昌盛，唯有由普选产生的地方议会之自治方为上策。联省派反对孙中山的国民党训政理念，认为人民有着自己的见解，已具备了辨别利弊的能力。此外，联省派的学者还要求来一场全面的农业改革，包括农民补贴及推动农会之发展，不过，至于如何对待大地主，目前尚没有统一定论。就社会立场而言，联省派多持进步观点，要求彻底革新陈旧的律法、建设新式官僚体系，并以职业行政人员取代军阀之腐败。联省派的思想泉源颇多，而今日最为人所称道者，非革命将军陈炯明莫属，其欲效法美利坚合众国，“以美式经验建立起中华合众省”。虽遭到了孙中山等人的批评，认为其不仅会使中国丧失抵御外侮之能力，还会加剧地方割据，但在大清帝国日暮西山的当口，联省制已实实在在地卷土重来。"
 managerial_technicracy_subtype:0 "管理技术论"
 managerial_technicracy_subtype_desc:0 "§Y管理技术论§!\n\n£GFX_ideology_managerial_technicracy_bar\n\n\n\n\n出自德国工程师瓦尔特·拉特瑙的管理技术论，指的是一个类似于有着自己思想的完美机械有机体的社会运作模式。在管理技术体制下，社会结构经过了大刀阔斧的改造，由受过训练的职业经理人担当治理者的角色，并把工人从繁重的体力劳动中解放出来。拉特瑙发现，流水线工作把人们的热情消磨殆尽，而回归传统的手工业、农业乌托邦又赶不上工业的产能，而要解决这一矛盾，方法其实很简单，就是消除体力劳动者与脑力劳动者之间的隔阂。阶级分化将成为过往，取而代之的是“文化”，各文化下的成员可不分社会地位地自由结社，而且伴着对自身社会角色理解的加深，还可自由出入其它文化。不过，文化与文化之间的迁移需要“劳动力的交换”。体力劳动者将在精神刺激下同脑力劳动者产生共鸣，从而认识到，自己应在制造业中发光发热，而不是如行尸走肉般虚度光阴。同样的，脑力劳动者也会切身体会到自己同胞们所面临的困难，从而告别闭门造车，真正融入社会之中。此外，管理者通过直接指导经济所赚取的利润还会用来改善全体民众的福利待遇。在管理技术体制下，社会主义平等的乌托邦终成为了现实，每个人都清楚自己在社会中的角色，也乐于为此而奉献。那些一味索求不做回报的寄生虫，还有那些游手好闲、无所事事的躺平汉，只有一个命运：被从新社会中除名。"
 rejuvenated_prussianism_subtype:0 "新普鲁士主义"
 rejuvenated_prussianism_subtype_desc:0 "§Y新普鲁士主义§!\n\n£GFX_ideology_vorbeck_bar\n\n\n\n\n保罗·冯·莱托-福尔贝克及其盟友背后的松散意识形态——新普鲁士主义，或者说普鲁士恺撒主义、新俾斯麦主义，是国内保守派团体的底子同历史先例、战争推论相结合的产物。在保守党内的激进派看来，今日的帝国写满了失败，自由主义的低能儿和社会主义的狂信徒充斥其间，只有一位不受帝国议会和皇帝掣肘的新俾斯麦，一位深得尤利乌斯·恺撒之传承的军事强人，才能匡谬正俗，一扫现代之颓废而天下归心，予国以新生。福尔贝克派的目标不仅仅是于国内建立起家长制的“国家社会主义”、设立青年组织向下一代灌输爱国思想和基督教价值观，还以整个欧洲为目标。虽然不赞同对于“理性”动员的负面看法，但新普鲁士主义还是借用了恩斯特·云格尔《总动员》中的一些概念，认为士兵代表着人理的最高形式，勇者只会诞生于全面征兵之中。普鲁士王国统一了旧德意志，而新普鲁士模式则将统一起世界帝国。只有通过如非洲防卫军之前所付出的巨大牺牲那般，德国的战士精英们才能予帝国边远领地中的懦弱国民以激励。忠诚的土著部队已经用自己的实际行动证明了，即使出身卑微，也还是可以跨越阶层，成为德意志优越文化的一分子。"
 soccon_tridemism_subtype:0 "三民主义"
 soccon_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 pataut_tridemism_subtype:0 "三民主义"
 pataut_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 syn_gandhism_subtype:0 "甘地主义"
 syn_gandhism_subtype_desc:0 "§Y甘地主义§!\n\n£GFX_ideology_gandhi_bar\n\n\n\n\n甘地主义是对莫罕达斯·卡拉姆昌德·甘地思想、理念及毕生心血结晶的非正式称呼，不过圣雄本人以及对这一思想体系做出过重大贡献的同时代人，如普什图人的“边地甘地”阿卜杜勒·加法尔汗，从未使用过“甘地主义”一词。甘地主义以“悟力”为基础，“悟力”字面意思为“坚持真理”，是印度独立运动中的一种特殊思想形式，主张非暴力、民间抵抗。甘地主义者会以和平的方式抗议行恶的政府、政策，不诉诸流血暴力而以间接方式推动进步改革和社会变革，不到万不得已就不会使用自卫手段——不过，关于这一自卫规定其实也充斥着争议，甘地的许多弟子就坚持彻底的非暴力、不杀生。此外，甘地主义还倡导平等的宗教团结，尤其是因对立、仇恨而戕害这片土地达百年之久的印度教徒和穆斯林之间的团结（值得一提的是，甘地本人是从印度教角度出发，从禁欲思想中创造出这一理念的，而其好友加法尔汗则是以穆斯林的角度，从普什图族法典中得出的），以及非暴力的爱国主义、民族主义思想，还有人权与自由、斋戒与素食等。经济上，甘地主义推崇简朴生活、自给自足、以重视国民物质需求先于财富和工业化的农业为主的进口替代，以及从亨利·大卫·梭罗、列夫·托尔斯泰等社会主义思想家那儿借鉴来的乌托邦无政府主义、和平进步主义理念。虽然其“缔造者”有意回避甘地主义一词，甘地本人和“边地甘地”也不认可其为一种意识形态，但甘地主义还是对南亚内外的政治、文化和精神产生了重大影响，遍布全球的甘地主义者也在用除自卫外坚决不实施暴力的和平手段表达着自己的诉求。"
 pataut_security_state_subtype:0 "安保国家"
 pataut_security_state_subtype_desc:0 "§Y安保国家§!\n\n£GFX_ideology_security_state_bar\n\n\n\n\n安保国家与其说是一种意识形态，倒不如说是指一类国家，其共同点就是当权者通过情报机构或各类宪警组织确立了自己至高无上的影响力，实现了对政府的完全控制。虽然大多数安保国家的领袖都只关注于掌控国家的某一或所有方面，但其中也不乏带有政治思想、政治倾向之别类。安保国家的掌事者究竟是在以自己的方式拯救自己的国民，还是仅仅是为了权力，这就只有当局者自己知晓了。"
 syn_anarcho_communism_subtype:0 "无政府共产主义"
 syn_anarcho_communism_subtype_desc:0 "§Y无政府共产主义§!\n\n£GFX_ideology_anarcho_communism_bar\n\n\n\n\n无政府共产主义是一种力图采用无政府主义的方式来实现共产主义乌托邦的政治理论。无政府共产主义遵循“各尽所能，各取所需”的原则，支持社会资源的一次分配与二次分配、消灭国家暴政、以社群主义的方式创造无国家的社会主义社会、废除私有财产并以个人所用、集体所有的财产制度代之，以及其他各种因群体而异的传统共产主义思想。无政府共产主义者虽然有着共同的目标，但其内部又分化出了各种派系与分支，如总是争吵不休的组织派和逆反派，前者奉行传统的社会合作、群众互助的左翼路线，后者则偏向于利己主义和激进个人主义。在这两大派系的广阔羽翼之下，还有追求求同存异、在相互竞争的各个思想之间搭起合作之桥的纲领派、想要集百家之长为一身的合成派，以及其他更小的团体，如看重农业的马贡派、文化水平优越的克鲁泡特金派、暴力激进的马赫诺派、武装反抗的加莱亚尼派等，他们有着截然不同的社会见解，但都坚信着同一件事：为了最终实现共产主义、建成社会主义的乌托邦，无国家的革命是必需的。"
 marlib_tridemism_subtype:0 "三民主义"
 marlib_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族、民权和民生三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 natpop_tridemism_subtype:0 "三民主义"
 natpop_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族、民权和民生三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 libertarian_possibilism_subtype:0 "可能自由意志主义"
 libertarian_possibilism_subtype_desc:0 "§Y可能自由意志主义§!\n\n£GFX_ideology_libertarian_possibilism_bar\n\n\n\n\n可能自由意志主义（支持者亦称三十人主义或西班牙可能主义）是以无政府工联为代表的西班牙主流无政府工团主义演化出的较新思潮。其起源可追溯至安赫尔·佩斯塔尼亚与无政府工联的其他二十九名无政府主义者联合发表的《三十人宣言》——该宣言激烈批评无政府工联及其激进领袖（如布埃纳文图拉·杜鲁蒂）的行径，最终导致无政府主义运动分裂，佩斯塔尼亚派系首次将可能主义自由意志主义付诸实践。该思潮旨在以非革命方式使无政府工团主义理念合法化，主张通过自由民主制框架（通常联合其他社会主义、工团主义及社民政党组成广泛人民阵线）推行政策。尽管其终极目标（如废除或高度分权化西班牙国家机器、以工团主义取代资本主义、建立工人协作与社区决策机制）与激进派基本一致，但其行动更为温和，且不认为工会是无政府工团主义斗争的核心主体。受佩斯塔尼亚俄国内战经历影响，可能主义自由意志主义高度反威权，强烈反对左右翼极权主义。该思想主要局限于佩斯塔尼亚及其盟友贝尼托·帕邦创立的工团党，但也因无政府主义者奥拉西奥·马丁内斯·普列托而在无政府工联及自由意志工团联盟部分成员中具有一定影响力。"
 anarcho_abertzalism_subtype:0 "无政府巴斯克民族主义"
 anarcho_abertzalism_subtype_desc:0 "§Y无政府巴斯克民族主义§!\n\n£GFX_ideology_anarcho_abertzalism_bar\n\n\n\n\n无政府巴斯克民族主义是巴斯克人对新生独立国家无政府主义者所面临问题的独特回应。这一理论最初由费利克斯·利基尼亚诺及其伴侣卡西尔达·埃尔纳埃斯在巴斯克地区脱离西班牙独立后首次提出，后经弗雷德里克·克鲁特维希拓展完善。它将巴斯克地区新兴的左翼民族主义运动与无政府主义主张的去中心化、经济集体化和无国家社会理念相融合。无政府巴斯克民族主义批判了现行巴斯克民族主义的主要理论家萨比诺·阿拉纳的种族民族主义路线，该路线将巴斯克民族主义与血统紧密捆绑，并建构巴斯克人相较于卡斯蒂利亚人更为“纯洁虔诚”的种族优越论。 相反，无政府巴斯克民族主义以巴斯克语言和更广泛的文化认同作为团结纽带，其支持者常与巴斯克社会党等左翼民族主义力量结盟。这一行事激进、与伊比利亚半岛其它无政府主义派系割裂的运动，虽因与集权派政党过从甚密而遭到了法兰西公社、无政府工联等主流无政府主义者及无政府工团主义者的抨击，但在比斯开与吉普斯夸两省的无政府主义者中却颇受欢迎，因为后者更加注重本土传统，而非泛泛的无政府主义理念。"
 radsoc_paternal_socialism_subtype:0 "家长制社会主义"
 radsoc_paternal_socialism_subtype_desc:0 "§Y家长制社会主义§!\n\n£GFX_ideology_patern_soc_bar\n\n\n\n\n家长制社会主义又称保守社会民粹主义，家长制保守主义，或在偶尔情况下在西方世界被称为基督教保守社会主义。这是一种古怪的意识形态，试图融合传统保守主义和非马克思的社会主义或进步民粹主义这些看似矛盾的思想。这一奇怪思想诞生自工业革命时期的英国和德国，但现在却在西方世界之外越发常见，比如拉丁美洲或非洲，那些地区并不适用欧洲发源的社会主义的规则和期望，因此转而寻求建立植根于宗教伦理，保守福利经济，阶级协作，公民民族主义和非极端爱国主义之上的道德保守社会。家长制社会主义通常与市场社会主义、基督教分产主义、慈善经济、俾斯麦国家社会主义、红色托利主义等各种财富分配方案相联系，尝试建立一套平等、非掠夺性的经济体系以对抗阶级斗争的理念。家长制社会主义将资本主义和社会主义思想融合在保守家长制的外壳下，为通常是传统主义者和民族主义者的本国人民谋福利，同时压制正统社会主义运动，以维持国家传统和社会稳定，即使这会导致他们与世界各地的其他社会主义者或保守主义者产生分歧。"
 radsoc_yellow_syndicalism_subtype:0 "黄色工团主义"
 radsoc_yellow_syndicalism_subtype_desc:0 "§Y黄色工团主义§!\n\n£GFX_ideology_yellowsyn_bar\n\n\n\n\n黄色工团主义可谓意识形态领域一朵实打实的奇葩，其提倡以工会的形式发声，捍卫无产阶级的价值观与权利，而非去攻击雇主或其立场。“黄派”起源于1899年克鲁索的施耐德矿场大罢工，他们与“红派”，也就是革命社会主义者有着相同的诉求，但却视罢工为一种南辕北辙的行为，甚至还主动协助当局破坏罢工。皮埃尔·比耶特里把接连于法国各地冒头的黄色工会联合了起来，并打出了“劳动、家庭与祖国”的口号。除此之外，比耶特里还进一步发展了这一理论，彻底抛却了雇主是工人阶级的天生之敌的革命路线，把矛头对准了德国人和犹太人，在组织内部营造出了一种强烈的民族主义情绪，并且在1919年革命之前还一直在收着资本家的钱对付红色工团主义运动。比耶特里还仿照国王报贩和火十字团，教授工会成员以武装作战技巧，方便他们实现其最终目标：建立起优越于现行公社体制的民主、社会与民族的法兰西工团共和国。"
 left_carlism_subtype:0 "左翼卡洛斯主义"
 left_carlism_subtype_desc:0 "§Y左翼卡洛斯主义§!\n\n£GFX_ideology_left_carlism_bar\n\n\n\n\n左翼卡洛斯主义，亦称社会卡洛斯主义或卡洛斯社会主义，是卡洛斯主义中独特的思潮，诞生于对运动停滞衰退的不满及社会主义作为全球重要政治力量的崛起。这一异端思想源自卡洛斯主义青年派系的幻灭者与少数支持学者、政客，主张彻底摒弃传统专制与极端保守的意识形态根基，并视其为阻碍运动实现真正君主制的枷锁。受全球社会主义运动（尤其是布哈林、约瑟普·布罗兹、卡尔·伦纳、奥托·鲍尔等人倡导的共产主义及类共产主义的工人自治模式）影响，其支持者主张建立由民主化卡洛斯组织领导的多元社会主义民主，将卡洛斯派改造为融合社会主义与君主立宪制的群众政党。此外，他们保留对地方自治的传统承诺，但以社会主义联邦制重构——此举使左翼卡洛斯主义在西班牙众多受压迫族群（甚至包括加泰罗尼亚、巴斯克等最顽固的分离主义地区）中勉强赢得了尊重。尽管公开宣扬激进左翼理念，该运动仍以基督教理想与起源为纲领核心，其追随者对现代自由主义原则持怀疑乃至蔑视态度，转而推崇天主教人格主义与基督教民主主义（即使透过“红色滤镜”）。虽然该运动规模微小且因各方政治势力猜忌、内部民族主义派与社会主义派分裂而难获合法性，但其思想持续影响着西班牙国内众多群体。若能得到国内外力量的足够推动，卡洛斯主义或许能从传统主义泥潭中重生，蜕变为适合西班牙大众的民主化、民粹化意识形态。"
 soclib_blasquismo_subtype:0 "布拉斯科主义"
 soclib_blasquismo_subtype_desc:0 "§Y布拉斯科主义§!\n\n£GFX_ideology_blasquismo_bar\n\n\n\n\n这一得名于瓦伦西亚作家比森特·布拉斯科·伊巴涅斯的意识形态，自起源便深深烙印着瓦伦西亚的地域基因。作为西班牙共和主义框架下的民粹思潮，其核心信条体现为三方面：持续不断的基层动员、对瓦伦西亚文化的守护，以及必要时针对政敌的暴力抗争。布拉斯科主义者的组织网络以瓦伦西亚城内的政治沙龙式“赌场”和布拉斯科·伊巴涅斯的报刊文章为两大支点。这种独特的动员模式使得他们的示威活动虽比主流自由共和派更显即兴与零散，却意外赢得了远超西班牙中间派政党常规规模的工人阶级支持。与西班牙多数激进派相似，布拉斯科主义秉持鲜明的反教权立场，历史上曾因加泰罗尼亚势力试图渗透瓦伦西亚地区而与对方爆发冲突。该运动最显著的内部分裂发生于布拉斯科·伊巴涅斯与党内对手罗德里戈·索里亚诺的权力斗争时期，双方支持者的流血冲突深刻揭示了其与温和共和派的本质差异——强烈的草根属性既能激发民众狂热，也易催生派系割据。作为布拉斯科主义的主要载体，自治共和联盟党始终与亚历杭德罗·勒鲁斯领导的激进党保持着若即若离的同盟关系。两党历经数次分合的过程中，布拉斯主义的意识形态光谱始终摇摆不定——与激进党结盟时倾向保守路线，疏离时则回归传统激进本色。"
 lerrouxismo_subtype:0 "勒鲁主义"
 lerrouxismo_subtype_desc:0 "§Y勒鲁主义§!\n\n£GFX_ideology_lerrouxismo_bar\n\n\n\n\n勒鲁主义（常被其众多敌手如此称呼）是西班牙特有的意识形态混合体，这种意识形态围绕其创立者亚历杭德罗·勒鲁形成，糅合了激进主义、雅各宾思想、群众动员的民粹原则，以及近乎个人崇拜的领袖追随。尽管勒鲁及其政党激进共和党在西班牙第二共和国时期及后续军政府统治下的政治立场剧烈摇摆，但勒鲁主义的核心本质始终如一：它以激烈的反教权言论、对加泰罗尼亚分离主义的强烈抵制，以及对敌手的强硬手段为特征，勒鲁及其追随者不惜使用暴力、贿赂和犯罪手段达成目标。在普里莫·德里维拉独裁时期，勒鲁主义者甚至参与针对国王阿方索十三世的暗杀行动，有时反常地与加泰罗尼亚无政府主义者结盟。与典型中产阶层及知识分子构成的中立政党支持基础不同，勒鲁主义极度依赖工人群体（尤其是加泰罗尼亚工业区），勒鲁通过煽动移民对本土加泰罗尼亚人的不满来为其激进派系争取支持。\n\n这些被勒鲁称为“野蛮青年”的支持者，被鼓励以极端手段摧毁当时西班牙教会及保守机构的控制。勒鲁主义者还通过掌控工人娱乐中心（如巴塞罗那的帕拉莱洛街）强化其民粹策略。这种控制使该党得以保持与基层激进分子及赌博犯罪集团的紧密联系。尽管西班牙政局风云变幻，勒鲁的蛊惑能力与灵活性仍使该主义得以存续，但鉴于该党自酿的丑闻恶名，其策略未必总能带来最佳结果。"
 marlib_kleptocracy_subtype:0 "窃国体制"
 marlib_kleptocracy_subtype_desc:0 "§Y窃国体制§!\n\n£GFX_ideology_kleptocrat_bar\n\n\n\n\n窃国体制指的是一种以腐败贪渎为核心的政府体系，甚至可以说这种政府徒有其表，名存实亡。这类政权与其说是某种明确的意识形态，毋宁视为诸多独裁或威权统治与生俱来的特质。纯粹的窃国体制往往摒弃意识形态，或仅以意识形态为幌子虚张声势，其真正目的无非是穷尽一切手段满足统治集团的野心与贪欲。虽然不同窃国体制为实现其自私目的所采取的手段与营造的形象千差万别，但敛财、享乐、贪腐、堕落、纵欲等特质在此类政权中都屡见不鲜。"
 blasquismo_subtype:0 "布拉斯科主义"
 blasquismo_subtype_desc:0 "§Y布拉斯科主义§!\n\n£GFX_ideology_blasquismo_bar\n\n\n\n\n这一得名于瓦伦西亚作家比森特·布拉斯科·伊巴涅斯的意识形态，自起源便深深烙印着瓦伦西亚的地域基因。作为西班牙共和主义框架下的民粹思潮，其核心信条体现为三方面：持续不断的基层动员、对瓦伦西亚文化的守护，以及必要时针对政敌的暴力抗争。布拉斯科主义者的组织网络以瓦伦西亚城内的政治沙龙式“赌场”和布拉斯科·伊巴涅斯的报刊文章为两大支点。这种独特的动员模式使得他们的示威活动虽比主流自由共和派更显即兴与零散，却意外赢得了远超西班牙中间派政党常规规模的工人阶级支持。与西班牙多数激进派相似，布拉斯科主义秉持鲜明的反教权立场，历史上曾因加泰罗尼亚势力试图渗透瓦伦西亚地区而与对方爆发冲突。该运动最显著的内部分裂发生于布拉斯科·伊巴涅斯与党内对手罗德里戈·索里亚诺的权力斗争时期，双方支持者的流血冲突深刻揭示了其与温和共和派的本质差异——强烈的草根属性既能激发民众狂热，也易催生派系割据。作为布拉斯科主义的主要载体，自治共和联盟党始终与亚历杭德罗·勒鲁斯领导的激进党保持着若即若离的同盟关系。两党历经数次分合的过程中，布拉斯主义的意识形态光谱始终摇摆不定——与激进党结盟时倾向保守路线，疏离时则回归传统激进本色。"
 marlib_lerrouxismo_subtype:0 "勒鲁主义"
 marlib_lerrouxismo_subtype_desc:0 "§Y勒鲁主义§!\n\n£GFX_ideology_lerrouxismo_bar\n\n\n\n\n勒鲁主义（常被其众多敌手如此称呼）是西班牙特有的意识形态混合体，这种意识形态围绕其创立者亚历杭德罗·勒鲁形成，糅合了激进主义、雅各宾思想、群众动员的民粹原则，以及近乎个人崇拜的领袖追随。尽管勒鲁及其政党激进共和党在西班牙第二共和国时期及后续军政府统治下的政治立场剧烈摇摆，但勒鲁主义的核心本质始终如一：它以激烈的反教权言论、对加泰罗尼亚分离主义的强烈抵制，以及对敌手的强硬手段为特征，勒鲁及其追随者不惜使用暴力、贿赂和犯罪手段达成目标。在普里莫·德里维拉独裁时期，勒鲁主义者甚至参与针对国王阿方索十三世的暗杀行动，有时反常地与加泰罗尼亚无政府主义者结盟。与典型中产阶层及知识分子构成的中立政党支持基础不同，勒鲁主义极度依赖工人群体（尤其是加泰罗尼亚工业区），勒鲁通过煽动移民对本土加泰罗尼亚人的不满来为其激进派系争取支持。\n\n这些被勒鲁称为“野蛮青年”的支持者，被鼓励以极端手段摧毁当时西班牙教会及保守机构的控制。勒鲁主义者还通过掌控工人娱乐中心（如巴塞罗那的帕拉莱洛街）强化其民粹策略。这种控制使该党得以保持与基层激进分子及赌博犯罪集团的紧密联系。尽管西班牙政局风云变幻，勒鲁的蛊惑能力与灵活性仍使该主义得以存续，但鉴于该党自酿的丑闻恶名，其策略未必总能带来最佳结果。"
 soccon_liberal_conservative_subtype:0 "自由保守主义"
 soccon_liberal_conservative_subtype_desc:0 "§Y自由保守主义§!\n\n£GFX_ideology_liberal_conservative_bar\n\n\n\n\n自由保守主义是一种近乎自相矛盾的意识形态，它将保守主义思想与自由主义立场结合在一起。这些团体分成两派，一派支持放松管制和自由市场，另一派则支持经济干预主义。而两派在追求公民自由，同时维持保守社会立场方面却又团结一致。总体而言，自由保守主义将自由资本主义和社会公义，与传统社会观念融合在一起，这种意识形态在西方世界尤为普遍，尽管在全球各地的实践中也都可以看到。"
 soccon_right_georgism_subtype:0 "右翼乔治主义"
 soccon_right_georgism_subtype_desc:0 "§Y右翼乔治主义§!\n\n£GFX_ideology_right_georgism_bar\n\n\n\n\n美国社会主义经济学家亨利·乔治提出了乔治主义这一左翼意识形态，而右翼乔治主义则是乔治主义的又一衍生。根据乔治生前的说法，相比起由“无限单一税制”延伸出的左翼乔治主义，右翼乔治主义以“有限单一税制”为根基，它提倡废除一切不公且低效的税收，建立起以地价税作为唯一税种的单一税收体制。右翼乔治主义所说的地价税与左翼的观点略有不同，它并不是要应用在社会的方方面面，而是只用于对群众和经济有利的某些地块、地区之中，不过如何界定、由谁来界定（是私人企业，还是公众，亦或是国家）、应用范围几何这些关键问题则因不同群体的意识理念差异而有着不同的说法。右翼乔治主义又可细分为两派，保守派认为应将地租的一部分用于有限的社会支出，其余部分由政府保管，进行投资，而自由意志派则坚持多出的租金应统一收集起来，分发给民众。总而言之，右翼乔治主义是一种形式多样、不断完善发展的思想理论，许多非社会主义的新兴政治运动都已将其纳入了自己的纲领之中。"
 noucentisme_subtype:0 "新世纪主义"
 noucentisme_subtype_desc:0 "§Y新世纪主义§!\n\n£GFX_ideology_noucentisme_bar\n\n\n\n\n新世纪主义是加泰罗尼亚的一场艺术文化运动，后逐渐演变为一种准政治意识形态。其根源在于对现代主义在艺术与思想层面的抵抗，常被视为国际派艺术家推动的前卫主义的对立面。本质上，新世纪主义是一场浸透保守主义、主张加泰罗尼亚民族主义的运动，有时甚至倾向于更广泛的西班牙地方主义而非完全脱离西班牙的独立。新世纪主义者与加泰罗尼亚传统保守派（如卡洛斯派和比加塔尼斯派）的不同之处在于，他们在坚持天主教信仰的同时接纳了有限的现代价值观。新世纪主义者将城市生活视为现代社会的城邦，将巴塞罗那塑造成古希腊罗马时代的新型城邦，以此对抗乡村的反动野蛮。\n\n新世纪主义主要由自由派和保守派资产阶级支持，其核心推崇秩序、文明与古典主义。他们认为，通过联邦化对加泰罗尼亚制度进行系统性改革（以抵御西班牙影响），以及通过加泰罗尼亚研究院推广和发展加泰罗尼亚语，当下的加泰罗尼亚可以转化为理想中和谐无瑕的加泰罗尼亚。该运动深受作家兼哲学家欧亨尼·德·奥尔斯及政治家恩里克·普拉特·德拉·里瓦的影响，并因其保守主义底色而在地方主义联盟中广受接纳。尽管西班牙军方的镇压使其在加泰罗尼亚政治中影响式微，但独立后，面对左翼霸权持续存在的压力，加泰罗尼亚保守主义为确立规范，新世纪主义因此强势回归。"
 iberian_federalism_subtype:0 "整合联邦制"
 iberian_federalism_subtype_desc:0 "§Y整合联邦制§!  \n\n£GFX_ideology_iberian_federalism_bar\n\n\n\n\n西班牙乃至伊比利亚半岛的联邦制思想可追溯至十八世纪末，但真正实现西班牙联邦化的唯一尝试出现于1870年代短命的西班牙第一共和国时期。鉴于西班牙境内各地区（如巴斯克、加泰罗尼亚等拥有独特文化与语言的区域）差异巨大，联邦制理念被多次提出，旨在构建既能团结多元群体、又能包容各民族独特性的国家。在此过程中诞生的西班牙联邦概念，勾勒出介于纯粹联邦制与中央集权的雅各宾主义间的混合政体。西班牙第一、第二共和国时期，官方承认国家由多个享有自治权的较小邦州及市镇组成。\n\n西班牙第二共和国将此理念发展为整合国家观念，将自治权授予强烈渴求该权力的地区（如加利西亚、加泰罗尼亚与巴斯克）。整合联邦制路径也被西班牙诸多地区政党采纳，其中加利西亚右翼、加泰罗尼亚联盟等保守党派尤其主张在单一制西班牙框架内实现高度地方自治，将地方民族主义融入更宏大的西班牙统一理想——通常混杂某种程度的伊比利亚主义，极少数方案甚至将葡萄牙纳入伊比利亚整合联邦。尽管整合联邦制拥护者的政治纲领差异悬殊，各党派追求的联邦化程度亦可能天差地别，但其核心信条始终如一：西班牙作为国家本质上是统一整体，各地区在西班牙民族大伞下的境遇远优于作为分离的独立实体。"
 soccon_maurism_subtype:0 "毛拉主义"
 soccon_maurism_subtype_desc:0 "§Y毛拉主义§!\n\n£GFX_ideology_maurism_bar\n\n\n\n\n毛拉主义是西班牙极具影响力的政治运动。以安东尼奥·毛拉及其子加布里埃尔·毛拉的思想为核心、这场能灵活适应西班牙共和制与君主制的保守民族主义运动，自1913年西班牙保守党分裂后开始崭露头角。它作为卡诺瓦斯时代的替代方案自然发展，标志着保守运动的复兴，甚至不惜通过街头斗殴推进其主张。毛拉主义以法团主义、干预主义和民族主义为原则，尽管试图拉拢工人，但其主要支持仍来自中产阶级和右翼知识分子。西班牙帝国复兴主义是该意识形态的重要组成部分，夏尔·莫拉斯的法兰西行动也偶尔是借鉴的对象。安东尼奥·毛拉本人从未正式认可毛拉主义，这种松散的联系导致该运动分化出多个派系——虽彼此关联，但政治纲领差异显著。\n\n加布里埃尔·毛拉领导着毛拉主义者中较自由的派系，安赫尔·奥索里奥-加利亚多专注于社会天主教派系，而安东尼奥·戈伊科切亚则是最激进的毛拉主义者，主张建立有机民主、反自由主义甚至君主制的西班牙。随着毛拉党的成立，毛拉主义逐渐形成相对统一的运动，但历史上的派系纷争导致多次分裂。尽管其本身影响力有限，但该意识形态的重要性在于启发了何塞·卡尔沃·索特洛等后世的西班牙右翼政治家。"
 authdem_noucentisme_subtype:0 "新世纪主义"
 authdem_noucentisme_subtype_desc:0 "§Y新世纪主义§!\n\n£GFX_ideology_noucentisme_bar\n\n\n\n\n新世纪主义是加泰罗尼亚的一场艺术文化运动，后逐渐演变为一种准政治意识形态。其根源在于对现代主义在艺术与思想层面的抵抗，常被视为国际派艺术家推动的前卫主义的对立面。本质上，新世纪主义是一场浸透保守主义、主张加泰罗尼亚民族主义的运动，有时甚至倾向于更广泛的西班牙地方主义而非完全脱离西班牙的独立。新世纪主义者与加泰罗尼亚传统保守派（如卡洛斯派和比加塔尼斯派）的不同之处在于，他们在坚持天主教信仰的同时接纳了有限的现代价值观。新世纪主义者将城市生活视为现代社会的城邦，将巴塞罗那塑造成古希腊罗马时代的新型城邦，以此对抗乡村的反动野蛮。\n\n新世纪主义主要由自由派和保守派资产阶级支持，其核心推崇秩序、文明与古典主义。他们认为，通过联邦化对加泰罗尼亚制度进行系统性改革（以抵御西班牙影响），以及通过加泰罗尼亚研究院推广和发展加泰罗尼亚语，当下的加泰罗尼亚可以转化为理想中和谐无瑕的加泰罗尼亚。该运动深受作家兼哲学家欧亨尼·德·奥尔斯及政治家恩里克·普拉特·德拉·里瓦的影响，并因其保守主义底色而在地方主义联盟中广受接纳。尽管西班牙军方的镇压使其在加泰罗尼亚政治中影响式微，但独立后，面对左翼霸权持续存在的压力，加泰罗尼亚保守主义为确立规范，新世纪主义因此强势回归。"
 maurism_subtype:0 "毛拉主义"
 maurism_subtype_desc:0 "§Y毛拉主义§!\n\n£GFX_ideology_maurism_bar\n\n\n\n\n毛拉主义是西班牙极具影响力的政治运动。以安东尼奥·毛拉及其子加布里埃尔·毛拉的思想为核心、这场能灵活适应西班牙共和制与君主制的保守民族主义运动，自1913年西班牙保守党分裂后开始崭露头角。它作为卡诺瓦斯时代的替代方案自然发展，标志着保守运动的复兴，甚至不惜通过街头斗殴推进其主张。毛拉主义以法团主义、干预主义和民族主义为原则，尽管试图拉拢工人，但其主要支持仍来自中产阶级和右翼知识分子。西班牙帝国复兴主义是该意识形态的重要组成部分，夏尔·莫拉斯的法兰西行动也偶尔是借鉴的对象。安东尼奥·毛拉本人从未正式认可毛拉主义，这种松散的联系导致该运动分化出多个派系——虽彼此关联，但政治纲领差异显著。\n\n加布里埃尔·毛拉领导着毛拉主义者中较自由的派系，安赫尔·奥索里奥-加利亚多专注于社会天主教派系，而安东尼奥·戈伊科切亚则是最激进的毛拉主义者，主张建立有机民主、反自由主义甚至君主制的西班牙。随着毛拉党的成立，毛拉主义逐渐形成相对统一的运动，但历史上的派系纷争导致多次分裂。尽管其本身影响力有限，但该意识形态的重要性在于启发了何塞·卡尔沃·索特洛等后世的西班牙右翼政治家。"
 pataut_synarchism_subtype:0 "共治主义"
 pataut_synarchism_subtype_desc:0 "§Y共治主义§!\n\n£GFX_ideology_synarchism_bar\n\n\n\n\n共治主义，或者说墨西哥共治主义，形成于墨西哥革命和萨帕塔政权不断左倾的大背景下，根据共治主义运动自费出版的《共治主义宣言》的说法，该思想的缔造者是何塞·安东尼奥·乌尔基萨、萨尔瓦多·阿瓦斯卡尔、乌尔基萨的弟弟卡洛斯、运动的首席理论家何塞和阿方索·特鲁埃瓦斯·奥利瓦雷斯两兄弟等一众思想家。需要注意的是，这里所说的共治与托马斯·斯塔克豪斯提出的“共治”概念并无联系，和法国的神秘学家亚历山大·圣伊夫笔下同无政府主义相对立的“共治主义”也仅有些许表面上的相似之处。墨西哥的共治主义运动分为两大阵营，一派是乌尔基萨的革命民族主义者和民族工团主义者，另一派是阿瓦斯卡尔的正统禧年主义者和“天主教社会秩序”拥护者，两派之外还有着一个小派别，他们主张以同国家行动党结盟或把全国共治联盟改组为正式政党的方式争取民意支持，以走上“温和”的半民主之路——不过，这一想法并不被主流共治主义者所容，因为民主在其眼中无异于洪水猛兽。共治主义者内部虽有着各种各样的分歧，但他们都认同左翼思想、自由主义和无神论是现代世界的三大毒瘤，都在一边广纳如民族保守主义、反民粹的阶级合作、天主教神权、整合民族主义、右翼社群主义、法团国家主义等各路思想理论，一边致力于在最高权威的带领下回归更加传统、极端保守的社会之中，以此涤净墨西哥的孽罪，拯救墨西哥国家。此外，共治主义运动还和墨西哥整合运动（该运动由阿瓦斯卡尔、“文化考迪罗”何塞·巴斯孔塞洛斯以及墨西哥的神职人员、贵族发展而来）有着一种互利共生的关系，这两派极右翼政治运动组成的“共治整合”联盟的目标便是相互之间取长补短，最终以信仰和烈焰拯救墨西哥——两方的联合自然使得乌尔基萨及其激进团体大为不爽，逼得后者只能去和自己的新保皇派盟友争论共和制的优点。共治主义尊崇教宗利奥十三世的《新事》通谕，同奥地利、伊比利亚等地的天主教右翼相似运动间有着千丝万缕的联系，是墨西哥右翼恢复革命之前的虔诚风貌的最后一搏。"
