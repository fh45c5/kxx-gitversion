 socdem_socialist_feminism_subtype:0 "社会女权主义"
 socdem_socialist_feminism_subtype_desc:0 "§Y社会女权主义§!\n\n£GFX_ideology_social_feminism_bar\n\n\n\n\n比起通用的意识形态，社会女权主义更像是一个术语，指的是那些把女权主义与女性争取解放的斗争融入左翼大背景中的各路思想流派与政治运动。虽然名为“社会女权主义”，但许多知名的思想家其实很是排斥“女权”这个词，因为她们认为女权与资产阶级密不可分，因而对于推动劳动妇女的进步毫无益处。社会女权主义内的两大主流分支为无政府女权主义和马克思女权主义，前者的代表人物是特蕾莎·马涅、爱玛·戈德曼和伊藤野枝，而后者则为亚历山德拉·柯伦泰、克拉拉·蔡特金和玛丽·英曼。左翼女权主义者们活跃于从无政府主义、工团主义到马克思主义，甚至是国家工团主义的各式政党、组织之中（大多都是委身于国内最大的社会主义政党之中，虽然这些政党基本被男性所把持，但他们并不反对女权主义者，还把她们视作革命的同伴，不过倒也有政治机构出于“意识形态的偏差”打压社会女权主义者代表的情况存在），她们不光是为了妇女的解放和平权而战，更是为了全体民众的权利、为了一个公平公正的社会而战。"
 pan_netherlandism_subtype:0 "泛尼德兰主义"
 pan_netherlandism_subtype_desc:0 "§Y泛尼德兰主义§!\n\n£GFX_ideology_pan_netherlandism_bar\n\n\n\n\n泛尼德兰主义，又称泛尼德兰思想，是一种旨在将低地国家统合为一国的民族统一理念，其类似于比利时主义，但更强调荷兰在其中的主导地位。泛尼德兰思想这一勃艮第思想在漫长的历史岁月中早有体现，比如十六世纪的勃艮第联合体、十五世纪的勃艮第公国、十世纪的下洛塔林吉亚公国等，而到了现代，这一思想分成了众多的流派，其中处于最右翼的是荷兰民族协作主义者联盟的整合民族主义者。比裔佛莱芒民族主义者约里斯·范·泽韦伦治下的民族协作主义者联盟反对右翼的自由资本主义和左翼的工团主义，希望能以俄罗斯的协作主义者（与其他运动不同，泽韦伦与整个联盟都持亲俄态度）以及法兰西行动的莫拉斯整合主义为参考，探索出第三条道路。虽然联盟内部就支持荷兰和佛莱芒的民族主义还是融合的比利时身份一事上存在分歧，但对外都一致反德，担忧德意志帝国步步紧逼的霸权以及柏林的贪婪触须会扼杀掉统一而自给自足的泛尼德兰之梦。民族协作主义者联盟是一个同罗马天主教会联系紧密的法团国家主义组织，它并不是唯一一个持泛尼德兰思想的团体，佛莱芒阵线、君权人民阵线等都经常与其同台竞技，不过，它的亲俄态度却其贴上了最为与众不同的标签。"
 natpop_pan_netherlandism_subtype:0 "泛尼德兰主义"
 natpop_pan_netherlandism_subtype_desc:0 "§Y泛尼德兰主义§!\n\n£GFX_ideology_pan_netherlandism_bar\n\n\n\n\n泛尼德兰主义，又称泛尼德兰思想，是一种旨在将低地国家统合为一国的民族统一理念，其类似于比利时主义，但更强调荷兰在其中的主导地位。泛尼德兰思想这一勃艮第思想在漫长的历史岁月中早有体现，比如十六世纪的勃艮第联合体、十五世纪的勃艮第公国、十世纪的下洛塔林吉亚公国等，而到了现代，这一思想分成了众多的流派，其中处于最右翼的是荷兰民族协作主义者联盟的整合民族主义者。比裔佛莱芒民族主义者约里斯·范·泽韦伦治下的民族协作主义者联盟反对右翼的自由资本主义和左翼的工团主义，希望能以俄罗斯的协作主义者（与其他运动不同，泽韦伦与整个联盟都持亲俄态度）以及法兰西行动的莫拉斯整合主义为参考，探索出第三条道路。虽然联盟内部就支持荷兰和佛莱芒的民族主义还是融合的比利时身份一事上存在分歧，但对外都一致反德，担忧德意志帝国步步紧逼的霸权以及柏林的贪婪触须会扼杀掉统一而自给自足的泛尼德兰之梦。民族协作主义者联盟是一个同罗马天主教会联系紧密的法团国家主义组织，它并不是唯一一个持泛尼德兰思想的团体，佛莱芒阵线、君权人民阵线等都经常与其同台竞技，不过，它的亲俄态度却其贴上了最为与众不同的标签。"
 authdem_savinkovism_subtype:0 "萨文科夫主义"
 authdem_savinkovism_subtype_desc:0 "§Y萨文科夫主义§!\n\n£GFX_ideology_savinkov_bar\n\n\n\n\n在许多学者看来，前社革党战斗队队长、革命家鲍里斯·维克托罗维奇·萨文科夫的同名意识形态与其说是一种具体的思想流派，倒不如说是萨文科夫一生中遇到的诸多势力与团体的大杂烩。萨文科夫主义对左右两翼来者不拒，其目标是打造出一种能够为国家带来变革、实现国家现代化的融合思想，因此，它既包含打碎旧精英制度、全面土地改革等进步的一面，也有创建青年准军事部队、以种族至上主义为基础的民族复兴等威权民族主义的一面。虽然进步是萨文科夫主义的主基调，但其团体也往往会去寻求传统的民族主义以及宗教势力的支持（不过总得来说，教会还是受到打压的，还有的组织甚至完全倒向了世俗一方）。此外，萨文科夫主义最重要的一点就是对“元首”的绝对忠诚、绝对奉献，追随者们会不惜一切手段执行贯彻其意志。萨文科夫主义诞生于俄罗斯，其理念的核心也几近是为俄国量身打造，但在前沙俄领地内外，有不少充满魅力的年轻领袖领导的民粹民族主义运动都或多或少地吸纳了萨文科夫主义的部分元素，并因地制宜地对其进行了改良。"
 pataut_savinkovism_subtype:0 "萨文科夫主义"
 pataut_savinkovism_subtype_desc:0 "§Y萨文科夫主义§!\n\n£GFX_ideology_savinkov_bar\n\n\n\n\n在许多学者看来，前社革党战斗队队长、革命家鲍里斯·维克托罗维奇·萨文科夫的同名意识形态与其说是一种具体的思想流派，倒不如说是萨文科夫一生中遇到的诸多势力与团体的大杂烩。萨文科夫主义对左右两翼来者不拒，其目标是打造出一种能够为国家带来变革、实现国家现代化的融合思想，因此，它既包含打碎旧精英制度、全面土地改革等进步的一面，也有创建青年准军事部队、以种族至上主义为基础的民族复兴等威权民族主义的一面。虽然进步是萨文科夫主义的主基调，但其团体也往往会去寻求传统的民族主义以及宗教势力的支持（不过总得来说，教会还是受到打压的，还有的组织甚至完全倒向了世俗一方）。此外，萨文科夫主义最重要的一点就是对“元首”的绝对忠诚、绝对奉献，追随者们会不惜一切手段执行贯彻其意志。萨文科夫主义诞生于俄罗斯，其理念的核心也几近是为俄国量身打造，但在前沙俄领地内外，有不少充满魅力的年轻领袖领导的民粹民族主义运动都或多或少地吸纳了萨文科夫主义的部分元素，并因地制宜地对其进行了改良。"
 tot_left_nationalism_subtype:0 "左翼民族主义"
 tot_left_nationalism_subtype_desc:0 "§Y左翼民族主义§!\n\n£GFX_ideology_left_nationalism_bar\n\n\n\n\n左翼民族主义，通常也称为社会民族主义，是源于受社会主义思想影响的各种民族解放运动的一种独特民族主义形式。左翼民族主义者将民族自决视为最高准则，努力为同胞人民建立一个国家，以让人民享有主权和（符合他们定义的）平等。左翼民族主义者反对其右翼同道，在斗争中坚决拒绝以种族而不是阶级为区分。"
 marlib_oligarchy_subtype:0 "寡头主义"
 marlib_oligarchy_subtype_desc:0 "§Y寡头主义§!\n\n£GFX_ideology_oligarchy_bar\n\n\n\n\n寡头主义指的是国家的权力掌握在某些通常规模很小的特定群体手中的体制，它的含义相当宽泛，而其具体形式则可以是商业共和国、企业国度，甚至唯才是举的精英治国。此外，寡头主义相互之间在决定掌权的人选方面也存在着不小的差异，有些政权的等级制度还是以种族为基础的。寡头们往往出身巨富之家，其一心向钱看和任人唯亲的作风也遭人讥笑为关心自己的权力胜过国家福祉。抛开上述说法不谈，只要少数特权阶级的权力得到了保障，各式各样的寡头们也是不会介意自由放任的治理手段的。"
 revolutionary_bolivarianism_subtype:0 "革命玻利瓦尔主义"
 revolutionary_bolivarianism_subtype_desc:0 "§Y革命玻利瓦尔主义§!\n\n£GFX_ideology_rev_bolivar_bar\n\n\n\n\n玻利瓦尔主义的左翼分支常被称作革命玻利瓦尔主义或左翼玻利瓦尔主义，以与同样怀着统一前西班牙殖民地梦想的右翼对立派加以区分。尽管同样尊崇西蒙·玻利瓦尔、同样认同拉美例外论，但革命玻利瓦尔主义同时大声疾呼反帝，宣扬左派国际主义，有时还主张建立民主制度。巴拿马社会主义者迪奥赫内斯·德拉罗萨是这种思想的主要拥护者，他的纲领建立在何塞·巴斯孔塞洛斯·卡尔德龙、何塞·卡洛斯·马里亚特吉、维克托·劳尔·阿亚·德拉托雷、奥古斯托·塞萨尔·桑地诺等人的思想基础上，可称社会主义大杂烩，以“印美”人为核心概念。革命玻利瓦尔主义者呼吁将欧美白人与美洲土著完全融为一体，以塑造一种独特而富于凝聚力的民族文化认同——仅有此路可以让我们完全摆脱境外势力的阴谋诡计和一己私欲。德拉罗萨这一派人想最终建立起文化多元、民族多元的社会主义人间天堂，认为这与左翼玻利瓦尔主义治下的伊比利亚美洲现实相契合。"
 authoritarian_social_democracy_subtype:0 "威权社会民主主义"
 authoritarian_social_democracy_subtype_desc:0 "§Y威权社会民主主义§!\n\n£GFX_ideology_auth_socdem_bar\n\n\n\n\n尽管绝大多数奉行社会民主主义的政党与政府都致力于将进步理想平和地付诸实践，但也有需要采取强硬措施的例外时刻。威权社会民主主义便是这应时而生的产物，它迫使温和的大手戴上铁拳、挥舞着玫瑰实行威权。尽管这种体制与社民军政府有几分相似，但此类政府仍坚守现有的民主体制，不论是君主制还是共和制，并在此之下通过准军事部队和警察部队的强力镇压推行政策。对许多社民派来说，当共产主义、工团主义或反动军政府造成威胁、带来混乱时，只有这种手段能止乱维稳，即使这意味着要与保守派暂时站在一条绳上。这种思潮最为知名的支持者之一当属德国的古斯塔夫·诺斯克，尽管在社民党内身居要职，但他从不掩饰自己对扩军备战、殖民主义的支持，竭力维护帝国统治，对理论之争嗤之以鼻。"
 cultural_mannism_subtype:0 "文化曼氏主义"
 cultural_mannism_subtype_desc:0 "§Y文化曼氏主义§!\n\n£GFX_ideology_cultural_mannism_bar\n\n\n\n\n对于进步人民党内部的许多人来说，备受赞誉、不谙政治的德国小说家托马斯·曼能够成为党内的一大支柱并塑造了今日之党团面貌实属天方夜谭。诞生于历史悠久的汉萨贵族之家的“文化曼氏主义”，其本质无非是在德国司空见惯的资产阶级思想。在曼看来，德国所代表的恶之纯化这种“文化”同理性、启蒙、节制、道德教育、怀疑主义相交织的英法“文明”之间有着一道泾渭分明的分界线，也正因此，这位作家极力反对那些源于浪漫激进主义，但又在背离了德国内在灵魂的政治艺术家的推动下过分倾向于进步主义的民主化疯狂“文明文士”。曼的追随者视爱、生命和艺术展现出的对上帝的虔信为最高价值观，而德国有义务以必要的解放战争的形式捍卫这一价值观，对抗英法的“文明”以及沙皇俄国这一世界宪警。虽然曼的观点被许多人批为高度个人主义、反民主、过度追求“脱离政治的审美”，但战争的经历以及其后同瓦尔特·拉特瑙的合作改变了曼，他逐渐开始把德国认作一成不变的势力平衡的破局者。紧随这一转变而来的，是文化曼氏主义的最新形式：拥护德意志帝国的缓慢“议会化”，强调其应以某种形式的泛欧合作联结起各个温和国家，并努力守护这一和平共存的关系。"
 weberian_liberalism_subtype:0 "韦氏自由主义"
 weberian_liberalism_subtype_desc:0 "§Y韦氏自由主义§!\n\n£GFX_ideology_weberian_liberalism_bar\n\n\n\n\n韦氏自由主义以德国社会学家马克斯·韦伯为名，是其政治、社会核心思想理论的结晶。韦伯自诩为左翼自由主义者，尽管有着民族主义倾向，但其思想和作品还是在政治领域扎下了根基、结出了硕果，影响到了塔尔科特·帕森斯、卡尔·施密特、卢卡奇·格奥尔格、雷蒙·阿伦等思想大家。话回正题，韦氏自由主义可以概括如下：强烈的个人主义、自由民族主义、对共和制度和新教的偏恃，以及对资本主义的普遍信仰。此外，韦伯对个体的深切关注也让其思想体系带有着浓重的反官僚主义气息，这一点在提及现代资本主义所带来的专业化效率时表现得尤为明显。在韦伯看来，当前盛行的经济制度最终只会制造出理性化的“铁笼”，囚于其中的个体丧失了自我选择的能力，而这与资本主义所推崇的创新精神背道而驰。为了反驳对于现代性的悲观观点，同时又不至于陷入反动的境地、扼杀官僚体制所带来的效率，韦伯在其理论中引入了“领导型民主”的概念。领导型民主强调选举过程的广泛性，强调基层民众的参与，而其最终的目的则是选出一位意志坚定、责任心强、善用权力、代表着理性化对立面（亦即创造、热情和个人意志）的魅力型领袖。为了遏制这一制度下可能出现的专制独裁，韦伯鼓励国民尽可能地参与到政治中来，以强大的行政机构和有素质有能力的民众相结合，阻止“冰冷黑暗之极夜”。总的来说，韦氏自由主义的头号敌人是受控于冷酷无情的机械化官僚体制、一心只追求更高生产力的反乌托邦社会，也正因此，激发个体的创新精神、避免这一残酷的命运便成了其存在的理由。"
 costa_rican_nationalism_subtype:0 "哥斯达黎加民族主义"
 costa_rican_nationalism_subtype_desc:0 "§Y哥斯达黎加民族主义§!\n\n£GFX_ideology_costa_rican_nationalism_bar\n\n\n\n\n对于哥斯达黎加历史的独特诠释虽并非民族共和党一家之独有，但要真得谈论起来，首当其冲的还是莱昂·科尔特斯·卡斯特罗。哥斯达黎加民族主义所展现的，是殖民时期那田园诗般、近乎于乌托邦的构想。未受土著民血脉“污染”的西班牙纯血自由主义咖啡大亨们在哥斯达黎加种下了现代国家的民主传统，而这也催生出了一种高度民族主义的观点，认为“蒂科人”不同于其专制的蛮子同胞，是中美洲最欧洲化、最为共和平等的民族。虽然天主教是哥斯达黎加的主流信仰，卡斯特罗本人也深受其影响，但哥斯达黎加神智学会也在哥斯达黎加民族主义的形成过程中扮演了重要的角色。哥斯达黎加民族主义的指导原则是推崇并捍卫以种族为中心的共和主义，反对专制甚至极权的“爱国主义”。"
 soccon_paneuropeanism_subtype:0 "广义泛欧主义"
 soccon_paneuropeanism_subtype_desc:0 "§Y广义泛欧主义§!\n\n£GFX_ideology_marlib_paneuropeanism_bar\n\n\n\n\n从广义上来讲，泛欧主义即是致力于以联邦、单一制国家，乃至紧密联盟等方式拉近欧洲各国与人民间关系的一种运动。泛欧主义虽然衍生出了各式流派、思想，但欧洲一体化这一概念的最普遍形式还是拥护某种共通的“欧洲价值观”，这一价值观可以是中世纪的基督教传承，也可以是自由主义革命的精神。有不少重量级人物都倡导过由人权、某种形式的民主、法律法规缔造的统一欧洲，而其中最出名的当属康拉德·阿登纳、加埃塔诺·马蒂诺、卡洛·斯福尔扎和米兰·霍贾。"
 cariato_subtype:0 "卡里亚斯体制"
 cariato_subtype_desc:0 "§Y卡里亚斯体制§!\n\n£GFX_ideology_cariato_bar\n\n\n\n\n蒂武西奥·卡里亚斯·安蒂诺的人生轨迹同中美洲的许多保守派人物相似，都是从一身戎装摇身一变进入了政坛，但与其他人不同的是，蒂武西奥的统治已成为了中美洲地区新执政模式的象征。蒂武西奥将武装力量同其所在的洪都拉斯国民党相结合，一步步地把国家的民主改造为了威权专制，亦即“卡里亚斯体制”。蒂武西奥思想的核心就是通过修订宪法、废除妇女公民权、重新引入死刑，以及保守的经济政策等法律上的路子维持自己的专制统治，而上述种种对外则表现为及时严格地偿还外国公司债务、开展地区基础设施建设合作。蒂武西奥之所以能屹立不倒，少不了其对于自由派、共党以及劳工运动的强硬对立态度，后者经常成为军队的目标、被迫接受严格的审查或被投入劳改营。此外，蒂武西奥还向军团主义等欧洲的许多右翼运动看齐，致力于打造洪都拉斯新模范公民。卡里亚斯体制的根基是被视为玛雅帝国继承人的梅斯蒂索混血儿，故蒂武西奥政府带头实行了针对非裔美洲印第安少数民族加利富纳人的歧视。总的来说，卡里亚斯体制既是中美洲的专制同僚们眼中秩序与效率的典范，也为尼加拉瓜的索摩查家族及其国民警卫队等流亡之人提供了一处庇护所。"
 spectral_state_subtype:0 "幽灵国家"
 spectral_state_subtype_desc:0 "§Y幽灵国家§!\n\n£GFX_ideology_spectral_state_bar\n\n\n\n\n一个由军方主导的国家却鲜少通过军事力量，而是通过幕后的劝诫、民众的认可和一系列阴谋来维持秩序，如同幽灵一般无形地存在，这样的国家即被称为“幽灵国家”。幽灵国家的政权属于极权主义，手揽大权的通常是一位军事强人，但其手揽大权的目的仅仅是为稳固自身地位，鲜少干预民众的日常生活，因而在该政体下，政坛上的明争暗斗仍是政府扩张影响力的主要途径。\n\n幽灵国家最有名、同时也颇具讽刺意味的代表人物之一便是库尔特·冯·施莱谢尔。他的“秘党”制定了周密的计划，意在控制德意志帝国的方方面面，而后者现已沦为受秘密警察支持的军方的囊中之物。作为结果，新的政体将德国变为所谓的“国防国家”，旨在维持德意志民族的生存和发展。与此同时，施莱谢尔还收编了以德意志阵营为首的许多准军事组织和极右翼团体，力图将它们打造成国家的忠实仆从。"
 god_knowers_subtype:0 "神知论"
 god_knowers_subtype_desc:0 "§Y神知论§!\n\n£GFX_ideology_god_knowers_bar\n\n\n\n\n在外界看来，德国的极右翼内充斥着各式别具一格的人物，而在这其中最为奇特的或许要属人民主义运动中的“神知论者”了。围绕德意志神知学会而生的神知论出自埃里希·鲁登道夫的妻子，同时也对其产生了深远影响的玛蒂尔德·鲁登道夫的手笔，这一运动现已超越了准军事性质的坦能堡联合会和政治性质的德意志人民自由党的传统架构。玛蒂尔德利用古已有之的反犹、反共济会、反共、反耶稣会情绪，把埃里希·鲁登道夫描绘为了同达赖喇嘛（即兜售上述各个团体的思想、利用代理人引入外来东方因素、亵渎神秘学和基督教的罪魁祸首）操控的犹太利未人共党所制造的亚洲神权种姓制度相抗争的先锋人物。虽然神知论者的部分民间盟友可能会相信既有的某种宗教或新时代信仰，但其本身却极度排斥这些信仰，推崇用泛神论的日耳曼雅利安文化模式来取代这些不伦之物。玛蒂尔德的思想集科学与哲学于一身，她认为，血统纯正的强大民族可以通过与上帝，与本民族的正统北欧上主的合一，感知神性，避免“人的死亡”，达成灵魂的永生。最后值得一提的是，受玛蒂尔德的影响，鲁登道夫老元帅认可女性在以纯粹战争机器形式展现的德国未来图景中享有平等的地位。"
 lenschian_tendency_subtype:0 "连施派"
 lenschian_tendency_subtype_desc:0 "§Y连施派§!\n\n£GFX_ideology_lensch_bar\n\n\n\n\n由所谓的“连施-库诺-黑尼施集团”所代表的派别可以说是充斥着爱国主义热情的社民党内最为民族主义的一支势力也不为过。连施、库诺和黑尼施三位政治家虽起初都是社民党内极左翼的反修正马克思主义者，但三者后来都不约而同地走上了名为“德意志社会主义”的国际社会民主主义非正统之路，而这种转变源自于世界大战期间形成的战时社会主义理论，也就是依靠工人士兵和工会的团结协作，把资产阶级国度改造为中央集中指挥体制。连施派的另一理论根基来自于约翰·普伦格的著作《1789与1914：政治意识中的历史标志之年》，这本书认为“1789年的思想”是自由的对立面，其必将为“1914年的思想”（组织）所取代，后者代表的是勇于同英法资本主义秩序抗争的新生德国精神。普伦格对于连施派的影响从连施本人身上便可看出，他视世界大战为一场国际革命，一场强大的德国无产阶级抗争植根于垄断议会君主制和加尔文宗之上的腐朽英国劳工运动的国际革命，而只有建立起真正的“人民社区”，德意志帝国近来的民主化进程才能取得长足进展，社会主义的光辉才能照耀全世界。为此，连施采纳了其两位同僚：康拉德·黑尼施和海因里希·库诺的对外政策，认定自决权仅适用于受更高形式的民主文化熏染的部分民族，而非任意的“文明”，因此，德国的帝国主义在扫除专制社会的原始愚昧、推动以现代化和工业发展为基础的真正社会革命之事上责无旁贷。"
 syn_tridemism_subtype:0 "三民主义"
 syn_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 langism_subtype:0 "兰主义"
 langism_subtype_desc:0 "§Y兰主义§!\n\n£GFX_ideology_langism_bar\n\n\n\n\n兰主义是新南威尔士州“大人物”的政敌们创造出的一个贬损用词，特指杰克·兰及其支持者所推崇的一种独特执政方针。兰是新南威尔士州的工党州长，其思想理论形成于大萧条时期，与工党的主流不同，他信奉的是早期凯恩斯主义经济学和民粹主义。任内，兰改善了社会福利，扩大了工人权利，落实了普选制度，以及最为重量级的，解散了州一级非民选产生的立法机构，而正是这最后一点，直接导致了其第一任期的提前结束。东山再起后，为与已获通过的莱昂斯计划正面抗衡，兰推出了自己的兰计划，其内容包括：反对财政紧随、推动建立商品标准、临时性暂停发放战争债券、以投资带动经济增长。支撑起这一毫不妥协的政治立场的，是“兰党”——由兰在工党、反仲裁工会、劳工报刊，甚至警察部队中的盟友所组成的一张巨大网络。兰的政策惠及到了底层贫困的澳大利亚人口，而这些人所代表的民粹之声又反过来进一步稳固了兰的权力。想当年，兰被总督扫地出门，而如今，兰主义已在联邦层面大获全胜，用实际行动证明了“兰即为答案！”"
 neokonservatismus_subtype:0 "新保守主义"
 neokonservatismus_subtype_desc:0 "§Y新保守主义§!\n\n£GFX_ideology_neokonservatismus_bar\n\n\n\n\n新保守运动也叫作“保守革命派”、“青年保守派”，是德国文化思想家默勒·范登布吕克的创造。新保守主义者深受浪漫主义传统的影响，他们以对过去，尤其是对神圣罗马帝国的精神及其“有机”架构的凝望，以及德意志青年独有的革命热忱来回应现代主义的悲观。新保守主义介于个人自由主义与“堕落”的反动思想之间，提倡以右翼的民族主义同左翼的经济原理相结合，驱使人民构筑起乌托邦式的第三帝国。这一超国家由一位能够代表人民之意志的领袖全权掌舵，民众可以通过成立行会、法团的方式参与到国家事务中来。\n\n根据默勒的设想，这一新国家以普鲁士原则为准，它将赋予德意志人民以永恒的命运以及归属的社区。值得一提的是，对于默勒和大多数青年保守派来说，上述人民并不以血缘关系界定，而是靠文化和历史。如此一来，各个民族都可以参与到由德意志人主导的帝国中来，而帝国也将尊重各民族社区的自治。捎带讽刺的是，新保守主义的一切理想均建立在对持续不断之变革的抵制之上。用其缔造者自己的话来说，一名真正的保守主义者必须努力去在风云变化的时代中保留下那些固有的珍贵价值，必须为旧事物赋予能够延续下去的新形态，决不可如反动派那样停滞不前，也不能像纯粹的革命派那样盲目破坏。"
 syn_anarchism_subtype:0 "无政府主义"
 syn_anarchism_subtype_desc:0 "§Y无政府主义§!\n\n£GFX_ideology_anarchism_bar\n\n\n\n\n无政府主义是一个多样化的政治派别，其通常要求完全或部分地消解国家这一概念。这些社会主义者寻求以自愿合作或者个人和团体之间的自由联合等方式组织社会，他们经常被主流左派视为革命的叛徒。不过，无可否认的是，无政府主义者仍以社会主义或共产主义为理想，只是国家政权在他们的制度里并无容身之地，他们排斥几乎所有的权威机构，追求完全的平等与自由。没有神明，也没有主人。"
 soclib_christian_socialism_subtype:0 "基督教社会主义"
 soclib_christian_socialism_subtype_desc:0 "§Y基督教社会主义§!\n\n£GFX_ideology_christ_socialism_bar\n\n\n\n\n基督教社会主义是工团主义范式之外传播最广的社会主义形式之一，特别是在那些人民相当保守和虔诚的国家内尤为常见。基督教社会主义力图在社会主义的框架内创造一个与耶稣基督的教义相吻合的社会，然而，不同个例所从属的基督教派别与社会主义形式可能会有很大的不同。"
 natpop_agrarianism_subtype:0 "农业主义"
 natpop_agrarianism_subtype_desc:0 "§Y农业主义§!\n\n£GFX_ideology_soclib_agrarianism_bar\n\n\n\n\n农业主义并不是一套有着中心理论或基本原理的具体意识形态，而是对世界各地关注农民利益、倾听农民诉求的各式运动的总称。农业主义的支持者既有地主豪绅，也有中下贫农，既受居于上层凤尾者之青睐，亦得到中下层之拥戴。政治概念上的农业主义起源于自由放任主义者、重农学派的弗朗索瓦·魁奈提出的“自然政府”，以及托马斯·杰斐逊的乡村美德共和国之说。各农业党派的支持者们一致认为，土地上的人民乃是社会的基石，是国家有机体之中最重要的器官，不过，若具体到经济、税收、保护主义与自由贸易之抉择、政府体制、宗教等方面，又是百花齐放百家争鸣。农业党派多为传统、保守的一方，但同时也存在着相同数量的激进自由派和彻头彻尾的社会主义派，以及夹在二者之间、特立独行的右翼势力，而这一巨大的差异仅仅环视一下周遭的部分农业运动便可略窥一二，例如德国持民族革命观点的农村人民运动、保守的保皇派农民联合会、中道为上的捷克农业党及芬兰农民联盟，以及推崇激进社会变革的波兰人民党“解放”、保加利亚农民联盟。"
