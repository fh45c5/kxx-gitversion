 integrism_subtype:0 "西班牙整合主义"
 integrism_subtype_desc:0 "§Y西班牙整合主义§!\n\n£GFX_ideology_integrism_bar\n\n\n\n\n西班牙整合主义是法葡整体主义的西班牙化变体，代表西班牙传统主义政治光谱的极右翼，主张天主教近乎全面主导国家事务。该思潮影响力巅峰见于整合主义党创立时期，虽现已式微，仍作为支流潜藏于巴斯克传统主义与极端卡洛斯派之中。与通常以王朝谱系划分的西班牙传统主义派别（如主张不同王朝继承路线的卡洛斯派与阿方索派）不同，由拉蒙·诺塞达尔、胡安·奥拉扎巴尔等理论家奠基的西班牙整合主义具有独特内核。\n\n西班牙整合主义者不预先选择效忠的君主，二十至三十年代更将偶然主义（对君主制或共和制框架皆持暧昧态度）纳入纲领。随着主流传统主义者对其边缘化，神秘主义与千禧年主义元素逐渐渗入该运动——部分极端分子甚至主张拥立耶稣基督为西班牙象征性君主，在工团主义与自由主义这些伪神引发的末世中君临天下。在整合主义者的视域中，理想国家应由行会、企业乃至家族结构等自然有机体构成，政府仅负责确保这些机体有序运转。\n\n他们从宗教视角审视所有社会问题，将贫困、不平等与地区主义危机归咎于自由主义无法构建真正平等的社会，而唯有天主教能实现此目标。实践中，西班牙整合主义者推崇由最具才能与虔诚信仰者治国，其选举策略显示他们更信任专家意见而非政客主张，对民主组织的深恶痛绝亦昭然若揭。尽管实践层面与主流卡洛斯派差异不大，但其顽固坚持仅通过宗教手段解决社会问题、对天主教义的原教旨主义态度，甚至令其他强硬传统主义派系视之为危险而可怖的政治力量——纵然他们仍属边缘存在。"
 natpop_integrism_subtype:0 "西班牙整合主义"
 natpop_integrism_subtype_desc:0 "§Y西班牙整合主义§!\n\n£GFX_ideology_integrism_bar\n\n\n\n\n西班牙整合主义是法葡整体主义的西班牙化变体，代表西班牙传统主义政治光谱的极右翼，主张天主教近乎全面主导国家事务。该思潮影响力巅峰见于整合主义党创立时期，虽现已式微，仍作为支流潜藏于巴斯克传统主义与极端卡洛斯派之中。与通常以王朝谱系划分的西班牙传统主义派别（如主张不同王朝继承路线的卡洛斯派与阿方索派）不同，由拉蒙·诺塞达尔、胡安·奥拉扎巴尔等理论家奠基的西班牙整合主义具有独特内核。\n\n西班牙整合主义者不预先选择效忠的君主，二十至三十年代更将偶然主义（对君主制或共和制框架皆持暧昧态度）纳入纲领。随着主流传统主义者对其边缘化，神秘主义与千禧年主义元素逐渐渗入该运动——部分极端分子甚至主张拥立耶稣基督为西班牙象征性君主，在工团主义与自由主义这些伪神引发的末世中君临天下。在整合主义者的视域中，理想国家应由行会、企业乃至家族结构等自然有机体构成，政府仅负责确保这些机体有序运转。\n\n他们从宗教视角审视所有社会问题，将贫困、不平等与地区主义危机归咎于自由主义无法构建真正平等的社会，而唯有天主教能实现此目标。实践中，西班牙整合主义者推崇由最具才能与虔诚信仰者治国，其选举策略显示他们更信任专家意见而非政客主张，对民主组织的深恶痛绝亦昭然若揭。尽管实践层面与主流卡洛斯派差异不大，但其顽固坚持仅通过宗教手段解决社会问题、对天主教义的原教旨主义态度，甚至令其他强硬传统主义派系视之为危险而可怖的政治力量——纵然他们仍属边缘存在。"
 liberating_nationalism_subtype:0 "维布兰特主义"
 liberating_nationalism_subtype_desc:0 "§Y维布兰特主义§!\n\n£GFX_ideology_liberating_nationalism_bar\n\n\n\n\n维布兰特主义亦称解放民族主义，是加泰罗尼亚民族主义者丹尼尔·卡多纳-西维特（也就是当地人口中的“维布兰特”“爱尔兰人”）及其政党“唯吾独存”的专属意识形态。维布兰特主义追求一种民族性、文化性的加泰罗尼亚主义，把加泰罗尼亚脱离西班牙视为自己的最高使命，坚决反对任何形式的西班牙遗留——无论是君主专制、独裁统治，还是共和体制。这一意识形态深受卡多纳过去的加泰罗尼亚民族主义运动经历影响——早年卡多纳在与“加泰罗尼亚国”等政党合作时，因坚持完全独立立场而屡遭排挤，因为当时马德里政府提出了自治方案，务实派占据了主流。\n\n虽然以激进民族主义为本源，但维布兰特主义却蕴含着自由民主的内核——在卡多纳看来，极权主义、军团主义等意识形态都将国家意志强加于个人，而他的这一民族主义理念则强调个人意志对国家形态的塑造。卡多纳认为，民族主义本质上是社会性而非政治性的存在，它尊重并维护从个人、家庭到市镇、地区直至国家各层社会单元的主体性，是守护每个社会成员精神内涵与人本价值的根本力量。维布兰特主义具有显著的流动性特征，主张超越政治与阶级的界限寻求广泛支持，其与加泰罗尼亚无产阶级党的联盟正体现了争取工薪阶层民族主义者认同的实践。卡多纳将民族主义视为民族的进化特质，认为即便面对帝国主义或异质意识形态的冲击也永难将其根除。维布兰特主义这种偶尔体现出矛盾色彩的意识形态，在“唯吾独存”进入议会体系后逐渐主流化，而在实现了脱离西班牙的既定目标后，其核心理念或将迎来新的演进契机。"
 syn_sandinismo_subtype:0 "桑地诺主义"
 syn_sandinismo_subtype_desc:0 "§Y桑地诺主义§!\n\n£GFX_ideology_sandino_bar\n\n\n\n\n在西方媒体口中，桑地诺主义有时被称为“桑地诺意识形态”，但它不是一种具体的意识形态，而是尼加拉瓜的奥古斯托·塞萨尔·桑地诺怀抱的一系列信念。在饱受压迫的农村地区，桑地诺深受欢迎，他呼吁开展大规模游击战，反对任何形式的帝国主义，将土地资源分配给所有人民，建立一个独立自主强大的国家。此外，桑地诺的追随者还竭力想将“印西族裔”统一为一个名为“印第安-拉丁美洲大陆和安的列斯联盟”的实体。桑地诺主义还倡导各种形式的精神主义，试图以一种对正义和全民亲爱的共通信念去取代压迫性的牧师制度。"
 authdem_solidarism_subtype:0 "协作主义"
 authdem_solidarism_subtype_desc:0 "§Y协作主义§!\n\n£GFX_ideology_solidarism_bar\n\n\n\n\n协作主义这一政治术语融贯了许多类似于法团主义，尤其是基督教法团主义，而又特色鲜明的思想、流派。若要追根溯底的话，协作主义一定绕不开两位人物：法国社会学家埃米尔·迪尔凯姆和德国天主教经济学家海因里希·佩施。迪尔凯姆提出了“法团协作主义”的理论，主张依照有机协作原则改造社会结构，通过建立以职业为基础的单一公共机构，消除催生出了阶级冲突的失序现象。深受天主教法团主义影响的佩施是基督教民主派的一大理论源泉，其观点虽与迪尔凯姆相似，但更加强调以工会、行会及商会的形式实现“个人社会化”的核心价值，建立起以家庭为基石的爱国主义国家联盟所组成的人文国际新秩序。\n\n当下最具影响力的协作主义团体是发端于俄国青年运动，于内战和克伦斯基时代的失败中成长起来的新世代民族联盟。联盟以“破除旧时代的罪孽与偏见”为旗号，实施年龄准入制，以把国家改造为公民民族国家为己任，其立国纲领有五：宗教慈善、社会协作、保障个人自由与财产、完成土地改革，以及对社会主义无穷无尽的敌视。联盟内部虽以共和派为主导，但也不乏保皇派的存在，不过，两派在民主参与模式的重要性这一点上倒是看法一致。联盟的知名人物包括现任领袖维克托·巴伊达拉科夫，以及沙俄世代臭名昭著的首相之子阿尔卡季·斯托雷平。除去新世代民族联盟外，荷兰民族协作主义者联盟和挪威国民联盟内部的相关派系也是协作主义阵营的一员。"
 pataut_maurrassism_subtype:0 "莫拉斯主义"
 pataut_maurrassism_subtype_desc:0 "§Y莫拉斯主义§!\n\n£GFX_ideology_maurras_bar\n\n\n\n\n“莫拉斯主义”又被称为整合民族主义，是法兰西行动的哲学家和思想支柱夏尔·莫拉斯提出的政治、社会和知识领域的论断。在夏尔·莫拉斯看来，存在两个法国：其一是共和制度及其精英代表的“法定国家”，由四大“共犯阶层”支持：犹太人、新教徒、共济会和外邦人，也就是“反法势力”；其二则是真正能代表法兰西人民的“真实国家”，而这也是莫拉斯所鼎力支持的。莫拉斯主义基于社会团结理论，追求以法国曾经的旧制度为模式，实现有机运作的社会。因此，法兰西行动拒绝承认法国大革命及其后的历史，发誓要建立一个地方分权、恪守传统和联邦政体的君主制国家，政治权力将被授予各省议会，而国王作为伟大的全国仲裁者，此外天主教将成为维系国家团结的重要黏合剂。在知识领域，莫拉斯则推崇古典理性主义，反对浪漫主义。"
 pataut_toryism_subtype:0 "英式保守主义"
 pataut_toryism_subtype_desc:0 "§Y英式保守主义§!\n\n£GFX_ideology_toryism_bar\n\n\n\n\n英式保守主义是起源于联合王国及其现殖民地、前殖民地的一众传统保守思想的集合。英式保守主义的词源“托利”起初是对爱尔兰天主教徒的贬义称呼，后被当作对詹姆斯二世国王支持者的蔑称，再往后就演变为了对英国右翼大党的代称。英式保守主义最早出现于英格兰内战中的骑士派，并在随后的几个世纪中受到了埃德蒙·伯克、小威廉·皮特等人的影响。在政策上，英式保守主义高度保守、亲近圣公会、反对自由化、支持君主制，而在经济上，它又在自由市场与贸易保护之间举棋不定，内部也曾因此发生过多次分裂。需要注意的是，英式保守主义这一概念非常宽泛，上面所列的定义并不能涵盖所有的保守派政客，因此也就诞生了诸如“红色保守党”、“高等保守党”之类的术语用以描述种种错综复杂的情况。"
 radsoc_syndicalist_subtype:0 "工团主义"
 radsoc_syndicalist_subtype_desc:0 "§Y工团主义§!\n\n£GFX_ideology_syn_bar\n\n\n\n\n工团主义是左翼革命意识形态的引领者，自1919年的法国革命以来引发了全世界的关注。尽管工团主义分为各个不同的流派，一些人受到了马克思主义或无政府主义的影响，但正统工团主义思想主要根植于法国劳工总联合会领导层的智慧结晶，并在1906年被精炼编纂入《亚眠宪章》之中，同时奉米哈伊尔·巴枯宁和皮埃尔-约瑟夫·蒲鲁东为工团主义的奠基人。工团主义理念基于自发革命和直接行动——他们坚信团结在工会之下的劳动人民必须直接同资本主义作斗争，而非依赖于诸如政党之类的外来组织。工团主义认为资本主义社会向工团主义社会的转型必须由一次总罢工来实现——通过一场全国规模的反资本主义运动，将一切生产资料全部交归工会所有。实行工团主义国家拥有去中央集权化和联邦制的政体，所有的产业都被组织进工联当中，地方由工会选举出来的工人委员会管理本地事务，中央政府则由国内的工会代表组成。不过，这些理念付诸实际操作的程度往往靠各国实际国情来决定。"
 soclib_sicilianism_subtype:0 "西西里主义"
 soclib_sicilianism_subtype_desc:0 "§Y西西里主义§!\n\n£GFX_ideology_sicilianism_bar\n\n\n\n\n西西里主义也叫做西西里民族主义，是一种不存在统一经济理论的地方主义思想，其视意大利民族主义协会、墨索里尼的国家革命集团等组织为死敌，敌视他们所提出的泛意大利思想，要求民族自决、自治，甚至寻求让西西里完全独立于意大利，可以说是西西里版的撒丁主义。尽管西西里独立委员会最初由中间派自由主义者安德里亚·菲诺基亚罗·阿普里莱创立时的主张刻意淡化意识形态色彩，但西西里左翼阵营内诸如革命者安东尼奥·卡内帕和社民系部长乔瓦尼·瓜里诺一类的社会主义者、社会民主主义者、工团主义者和共产主义者也对此大加拥护。除此之外，西西里主义在右翼势力中的影响力也持续扩大：卢乔·塔斯卡男爵、古列尔莫·帕泰尔诺公爵等本土贵族势力，联合天主教民主党内的传统派、保守派农业主义者乃至黑手党（同西西里独立运动内的小规模右翼走得越来越近的 “我们的事业”组织）。更不用说还有萨尔瓦托雷·“图里杜”·朱利亚诺这类罗宾汉式的绿林匪帮，构成了意识形态更为混乱的边缘群体。西西里主义并不关心特定的社会经济政策，因为对它来说，这都是后话，目前的第一要务仍是寻求扩大西西里的权力，不过，由于西西里几百年来的贫穷、落后环境，西西里主义者几乎一边倒地支持民粹主义和亲工人阶级政策。西西里主义者虽然对如何对待已经深深融入悠久之传统的黑手党和各类腐败的精英主义泉源存在着分歧，但都共同追求着那共和之梦，渴望成为新时代的西西里晚祷者，彻底打碎盘剥压迫西西里已久的外国枷锁。"
 marlib_internationalism_subtype:0 "自由国际主义"
 marlib_internationalism_subtype_desc:0 "§Y自由国际主义§!\n\n£GFX_ideology_lib_intern_bar\n\n\n\n\n自由国际主义虽受到了左翼国际主义，或称托洛茨基主义的部分影响，但两者的本质截然不同。自由国际主义出自美国自由主义政治家温德尔·威尔基及其编辑小加德纳·考尔斯、艾丽塔·范多伦的“天下一家”宣言、游击，它基本是从自由主义（有时也会掺杂些进步乃至温和社会主义元素）视角出发，追求全球经济外交合作、反帝主义、自由民主、平等人道主义、彻底的社会民权改革，并最终建成世界联邦，或是以美国那种联邦制组织而来的单一民主制世界政府。“天下一家”理念影响到了全球众多自由派、进步派、社会民主派、温和社会主义派的政治家，阿尔伯特·爱因斯坦、圣雄甘地、加瓦哈拉尔·尼赫鲁、克莱门特·艾德礼、哈罗德·勒布、H·P·洛夫克拉夫特等名家巨擘皆在其中。虽然左翼国际主义的各流派失去了其开山祖师，但威尔基及其同时代人剔除了暴力激进元素搞出来的“天下一家”新式国际主义、世界联邦主义却以另一种形式将这一思想延续了下去。"
 marlib_whiggism_subtype:0 "辉格主义"
 marlib_whiggism_subtype_desc:0 "§Y辉格主义§!\n\n£GFX_ideology_whiggism_bar\n\n\n\n\n辉格主义，在美国也称为共和主义，自其创立以来就有着不同的含义，但就现代美国而言，辉格主义是以19世纪初至中期辉格党思想为基础的意识形态，由于它在现代重新复兴，所以也被一些人称为新辉格主义。辉格主义根植于亨利·克莱、丹尼尔·韦伯斯特、扎卡里·泰勒、威廉·亨利·哈里森、威廉·苏厄德和约翰·昆西·亚当斯的意识形态，他们对美国悠久的帝国主义历史嗤之以鼻，并对“昭昭天命”的概念持批评态度，相反，他们宣扬孤立主义和内向的美国民族主义，佐以传统保守主义、新教虔诚、严厉的经济民族主义和保护主义，而所有一切的前提都是建立一个强大且占主导地位，并致力于实现议会制的国会与最高法院，而非危险专横的行政部门。辉格主义者对杰斐逊主义和杰克逊主义的传统持批评态度，与许多原始联邦主义思想紧密结合，试图在美国陷入一门心思关注世界上其他地方的无用奇想之前，帮助它回归到曾经让美国变得伟大的形式。"
 soccon_populist_dixiecrat_subtype:0 "民粹派南方民主党思想"
 soccon_populist_dixiecrat_subtype_desc:0 "§Y民粹派南方民主党思想§!\n\n£GFX_ideology_populist_dixie_bar\n\n\n\n\n民粹派南方民主党思想与其说是一种明确的意识形态，不如说是宏大政党格局中的一种特例。虽然传统的南方民主党人对自由主义、进步主义和社会主义之概念怀抱着强烈的敌意，但民粹派却将其中的一些价值观纳为了改善工人阶级选民生活的手段。民粹派在捍卫南方核心价值观的同时，借用了某些北方的经济“交易”元素，持有更为关注平民的国家干预主义立场（尽管其中部分仍然倾向保守财政）。种族隔离和白人至上主义仍然得到民粹派的容忍，但他们的影响力也因民粹派更多关注如何帮助白人社区、制定“分离但平等”的政策，甚至拒绝将种族问题作为重点要务而遭到了削弱。州权仍然是民粹派最为重视的议程，但他们往往选择通过保护独特的南方文化机构而不是维护精英政治机器来推进。"
 pataut_agrarianism_subtype:0 "农业主义"
 pataut_agrarianism_subtype_desc:0 "§Y农业主义§!\n\n£GFX_ideology_soclib_agrarianism_bar\n\n\n\n\n农业主义并不是一套有着中心理论或基本原理的具体意识形态，而是对世界各地关注农民利益、倾听农民诉求的各式运动的总称。农业主义的支持者既有地主豪绅，也有中下贫农，既受居于上层凤尾者之青睐，亦得到中下层之拥戴。政治概念上的农业主义起源于自由放任主义者、重农学派的弗朗索瓦·魁奈提出的“自然政府”，以及托马斯·杰斐逊的乡村美德共和国之说。各农业党派的支持者们一致认为，土地上的人民乃是社会的基石，是国家有机体之中最重要的器官，不过，若具体到经济、税收、保护主义与自由贸易之抉择、政府体制、宗教等方面，又是百花齐放百家争鸣。农业党派多为传统、保守的一方，但同时也存在着相同数量的激进自由派和彻头彻尾的社会主义派，以及夹在二者之间、特立独行的右翼势力，而这一巨大的差异仅仅环视一下周遭的部分农业运动便可略窥一二，例如德国持民族革命观点的农村人民运动、保守的保皇派农民联合会、中道为上的捷克农业党及芬兰农民联盟，以及推崇激进社会变革的波兰人民党“解放”、保加利亚农民联盟。"
 soclib_liberal_feminism_subtype:0 "自由女权主义"
 soclib_liberal_feminism_subtype_desc:0 "§Y自由女权主义§!\n\n£GFX_ideology_liberal_feminism_bar\n\n\n\n\n自由女权主义，即其拥趸所言的“女权主义”、“主流女权主义”，是女权主义三大流派中历史最为悠久的思潮。相较于带有社会主义倾向或保守乃至反动色彩的流派，其鲜明特征在于对自由民主制度及资本主义经济体系的坚定支持。该思想体系可追溯至18世纪末，最初由英国女性权利先驱玛丽·沃斯通克拉夫特（如今其贡献多遭遗忘）与美国女权巨擘朱迪思·萨金特·默里等人引领，源于中上层阶级女性争取选举权与自主权的斗争。选举权诉求不仅关乎政治参与，更深层关联着女性对丈夫及其他男性亲属的经济与社会依附状态——彼时倡导者坚信，通过获得投票权，女性可在社会各领域赢得与男性平等的权利。这场运动本质上属于19世纪末至20世纪初社会自由主义理想的重要组成部分，其后逐步分化出更具社会主义倾向的女性主义分支。\n\n自由女权主义者主张通过渐进而稳健的社会改革，构建更加平等的两性关系。其核心理念在于承认女性与男性同为具备完全自主权的独立个体，应享有同等的言论自由、行动自由、结社自由及财产所有权。相较于社会主义与保守派女权主义者，该群体普遍更具实用主义与个人主义特质，致力于推动女性更广泛地进入学术领域及社会生产体系，并着力破除阻碍女性进入传统男性主导领域的偏见壁垒。20世纪初，随着英美两国女性相继获得选举权，自由主义女性主义运动迎来巅峰时刻。尽管在社会主义女权主义兴起后其影响力有所衰退，但在西班牙、众多南美国家及全球前殖民地等仍存在大量中产阶级女性未能充分享有男性所拥有权利的国度，该思潮至今仍保有广泛支持基础。"
 liberal_feminism_subtype:0 "自由女权主义"
 liberal_feminism_subtype_desc:0 "§Y自由女权主义§!\n\n£GFX_ideology_liberal_feminism_bar\n\n\n\n\n自由女权主义，即其拥趸所言的“女权主义”、“主流女权主义”，是女权主义三大流派中历史最为悠久的思潮。相较于带有社会主义倾向或保守乃至反动色彩的流派，其鲜明特征在于对自由民主制度及资本主义经济体系的坚定支持。该思想体系可追溯至18世纪末，最初由英国女性权利先驱玛丽·沃斯通克拉夫特（如今其贡献多遭遗忘）与美国女权巨擘朱迪思·萨金特·默里等人引领，源于中上层阶级女性争取选举权与自主权的斗争。选举权诉求不仅关乎政治参与，更深层关联着女性对丈夫及其他男性亲属的经济与社会依附状态——彼时倡导者坚信，通过获得投票权，女性可在社会各领域赢得与男性平等的权利。这场运动本质上属于19世纪末至20世纪初社会自由主义理想的重要组成部分，其后逐步分化出更具社会主义倾向的女性主义分支。\n\n自由女权主义者主张通过渐进而稳健的社会改革，构建更加平等的两性关系。其核心理念在于承认女性与男性同为具备完全自主权的独立个体，应享有同等的言论自由、行动自由、结社自由及财产所有权。相较于社会主义与保守派女权主义者，该群体普遍更具实用主义与个人主义特质，致力于推动女性更广泛地进入学术领域及社会生产体系，并着力破除阻碍女性进入传统男性主导领域的偏见壁垒。20世纪初，随着英美两国女性相继获得选举权，自由主义女性主义运动迎来巅峰时刻。尽管在社会主义女权主义兴起后其影响力有所衰退，但在西班牙、众多南美国家及全球前殖民地等仍存在大量中产阶级女性未能充分享有男性所拥有权利的国度，该思潮至今仍保有广泛支持基础。"
 radsoc_jeffersonianism_subtype:0 "杰斐逊主义"
 radsoc_jeffersonianism_subtype_desc:0 "§Y杰斐逊主义§!\n\n£GFX_ideology_jeffersonianism_bar\n\n\n\n\n杰斐逊主义又称杰斐逊式民主、杰斐逊民主共和主义、杰斐逊自由农业主义，现亦称新杰斐逊主义，是美国对传统保守农业思想的本土化改造。该意识形态以国家农民与工人为主体，主张通过自由主义与民粹主义相结合的手段保障其权益，践行真正的民主共和精神，同时反对精英统治。杰斐逊主义以其创始人托马斯·杰斐逊为名，得到了詹姆斯·麦迪逊、詹姆斯·门罗等领导民众抵制汉密尔顿联邦党中央集权暴政的一众开国元勋的支持。杰斐逊主义反对美国社会人为制造的贵族阶层，警惕联邦权力的过度集中与政治腐败，其思想根基源于启蒙运动，强调以世俗美德构建社会价值体系，特别重视自耕农、种植园主、普通民众等基层群体的利益，并推行反教权主义、田园农业主义，推崇以帝国主义手段与昭昭天命论，依托强有力的行政体系，实现美利坚民族主义与势力范围的扩张。"
 radsoc_kritarchy_subtype:0 "判官统治"
 radsoc_kritarchy_subtype_desc:0 "§Y判官统治§!\n\n£GFX_ideology_kritarchy_bar\n\n\n\n\n判官统治指的是因集权化的法律机构或者分权式的文化传统而起的法官、司法治国体系。历史上的判官统治同古代以色列的摩西政权密不可分，根据圣经记载，在扫罗建立王权之前，以色列一直由士师主导。不过除以色列之外，世界各地也有着各式判官统治的例子，例如公元前五世纪至公元五世纪布雷洪法时期爱尔兰的德鲁伊判官以及后续一直延伸到十三世纪的封建法官、九世纪至十三世纪冰岛自由邦的由前哥特祭司担任的世俗述法角色、十世纪至十四世纪撒丁岛上的审判官、十六世纪弗里西亚自由邦末期短命的判官统治。不过，判官统治并不是仅存在于中世纪之前的过时旧物，在当代的欧洲之外也存在着数个判官体系，索马里部族的习惯法、阿富汗社会的支尔格，以及部分学者眼中1803年美国联邦最高法院的马伯里诉麦迪逊一案让最高法院脱离了控制、逐步滑向司法统治就是例证。虽然一些边缘自由意志主义者、无政府主义研究者称判官统治是种原始的反国家主义形态，但具体到实践上，判官统治又千差万别、争议万千，部分相关的例子也在不断地经受着学者们的质疑与争论。无论如何，即使政府形态迥异，判官统治也总有着一些共同点，即对于司法与法治的坚持。"
 syn_utopian_technocracy_subtype:0 "乌托邦技官主义"
 syn_utopian_technocracy_subtype_desc:0 "§Y乌托邦技官主义§!\n\n£GFX_ideology_utopian_technocracy_bar\n\n\n\n\n乌托邦技官主义是传统技官主义的一个分支，正如技官公司及传统技官主义描述的那样，他们提倡建立与传统技官主义类似的政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。此外他们还支持美学革命，并推动艺术家、哲学家、作家及其他创造性思想家加入这一半寡头平台。而且，这些乌托邦主义技官们还抛弃了同时代其他技官的专制做派，转而大量借鉴索斯坦·维尔本和其他乌托邦平等主义者的思想，比如爱德华·贝拉米、罗伯特·欧文、诺曼·莱蒙德、夏尔·傅立叶和亨利·大卫·梭罗，并试图建立起受保护的民主合作委员会，在技术专家的指导下，所有人都以社区主义的方式拥有平等的发言权，共同迈向平等的天堂。总体而言，乌托邦技官主义试图突破传统政治模式的限制，将人类引向一个开明、艺术、人道、和平、改革和美学的紫色乌托邦。"
 socdem_normal_dixiecrat_subtype:0 "南方民主党思想"
 socdem_normal_dixiecrat_subtype_desc:0 "§Y南方民主党思想§!\n\n£GFX_ideology_dixiecrat_bar\n\n\n\n\n南方民主党思想是美国南方腹地的一种传统基督教保守思想，因和旧民主党的关系又得名旧民主党思想。这一思想强烈反对自由主义、左翼思想、民权运动等所谓的“现代罪恶渊薮”，并与三K党等法外组织关系匪浅，愿意利用各种合法非法途径来实现自身的政治诉求。南方民主党思想支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，是旧美国传统保守主义的最后堡垒，并且以近乎军事化的强硬姿态，顽固捍卫着这一价值体系。"
 soclib_liberal_conservative_subtype:0 "自由保守主义"
 soclib_liberal_conservative_subtype_desc:0 "§Y自由保守主义§!\n\n£GFX_ideology_liberal_conservative_bar\n\n\n\n\n自由保守主义是一种近乎自相矛盾的意识形态，它将保守主义思想与自由主义立场结合在了一起。这一思潮在不同国家呈现出复杂的面貌，其内部主要分裂为两大阵营：一派主张放松管制与自由市场，另一派则支持经济干预——不过，两派都坚守着保守的社会立场，都致力于维护公民的自由与权利。总体而言，自由保守主义将自由资本主义、社会公义与传统社会观念融合在了一起，虽然全球多国均存在其实践案例，但这一政治范式在西方世界尤为盛行。"
 soclib_normal_dixiecrat_subtype:0 "南方民主党思想"
 soclib_normal_dixiecrat_subtype_desc:0 "§Y南方民主党思想§!\n\n£GFX_ideology_dixiecrat_bar\n\n\n\n\n南方民主党思想是美国南方腹地的一种传统基督教保守思想，因和旧民主党的关系又得名旧民主党思想。这一思想强烈反对自由主义、左翼思想、民权运动等所谓的“现代罪恶渊薮”，并与三K党等法外组织关系匪浅，愿意利用各种合法非法途径来实现自身的政治诉求。南方民主党思想支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，是旧美国传统保守主义的最后堡垒，并且以近乎军事化的强硬姿态，顽固捍卫着这一价值体系。"
 soccon_popular_patriotism_subtype:0 "大众爱国主义"
 soccon_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 syn_broad_communism_subtype:0 "广泛共产主义"
 syn_broad_communism_subtype_desc:0 "§Y广泛共产主义§!\n\n£GFX_ideology_broad_com_bar\n\n\n\n\n广泛共产主义是指那些声称遵循马克思、恩格斯和列宁的思想，但在行事和执政风格上比其它列宁主义政党更为温和的社会主义政党。这些独树一帜的共产党人寻求将观点不同的社会主义者纳入党内，为此甚至会与其它社会主义政党，哪怕是非列宁主义政党结盟，而且在获得执政权力后，他们往往会拒绝使用恐怖手段，强调要在工人和农村人民之间达成合作，使其一同反对资产阶级。他们在经济方面往往比较正统，鼓励财富从资产阶级流向无产阶级。这些政党在世界上还相当少见，而且还常被指责为修正主义，但他们始终坚信，自己的思想理念才是最有可能实现国际无产阶级梦想中那个无阶级、无国家的共产主义社会的。"
 syn_popcom_subtype:0 "大众共产主义"
 syn_popcom_subtype_desc:0 "§Y大众共产主义§!\n\n£GFX_ideology_popcom_bar\n\n\n\n\n大众共产主义（美国一派好戏称其为“苹果派共产主义”或直接称之为白劳德主义）是一种集权、半专制的社会主义，其特点是既存在强力的行政机构，也致力于建立推动左翼大团结、协作的统一阵线，还有以诸如亚伯拉罕·林肯等白劳德心目中的英雄、早期的下水道社会主义者、早期的德莱昂主义者等美式社会主义支系，以及开国元勋的理念、思想、形象为启发，形成的非民族性多元化美国身份。大众共产主义是威权主义和社会主义民主的混合体，它寻求在不诉诸内斗内讧、滥用暴力、残酷镇压和报复行动等不人道行为的情况下捍卫革命。大众共产主义依赖职业工会与行会的支持，但反对公社化与受无政府主义影响的合作社，它将经济和国家大权集于领袖手中，不过仍然允许工人阶级的自我管理和自治自由，并且通常寻求在农业和工业之间达成平衡。"
 socialist_federalism_subtype:0 "社会联邦主义"
 socialist_federalism_subtype_desc:0 "§Y社会联邦主义§!\n\n£GFX_ideology_socialist_federalism_bar\n\n\n\n\n社会联邦主义是一场融合了非马克思社会主义与激进自由主义的广泛运动，代表着前俄罗斯帝国土地上兴起的左翼自由主义政治思潮，其理论光谱游移于社会革命党、孟什维克与左派立宪民主党之间，既主张保障劳动者基本权益及不同程度的国有化政策，又以新兴中产阶级、小工商业者及农村自耕农为主要社会基础。因此，社会联邦主义者致力于构建这样的国家：自治且去中心化的社区既能守护独特的文化与生活方式，又能参与更广阔的自由民主政体——这个政体以公民民族主义的国家认同为纽带。虽然格鲁吉亚社会联邦革命党、白俄罗斯社会联邦党等代表该政治派系的团体已开展公开合作，但部分激进者（如乌克兰社会联邦党提出的“海间联盟”构想）更憧憬与兄弟民族共同组建宏大的政治联邦。"
 socdem_iberian_federalism_subtype:0 "整合联邦制"
 socdem_iberian_federalism_subtype_desc:0 "§Y整合联邦制§!\n\n£GFX_ideology_iberian_federalism_bar\n\n\n\n\n西班牙乃至伊比利亚半岛的联邦制思想可追溯至十八世纪末，但真正实现西班牙联邦化的唯一尝试仅出现于十九世纪七十年代短命的西班牙第一共和国时期。鉴于西班牙境内各地区（如巴斯克、加泰罗尼亚等拥有独特文化与语言的区域）差异巨大，联邦制理念被多次提出，旨在构建既能团结多元群体、又能包容各民族独特性的国家。在此过程中诞生的西班牙联邦制概念，勾勒出介于纯粹联邦制与中央集权的雅各宾主义间的混合政体。西班牙第一、第二共和国时期，官方承认国家由多个享有自治权的较小邦州及市镇组成。\n\n西班牙第二共和国将此理念发展为整合国家观念，将自治权授予强烈渴求该权力的地区（如加利西亚、加泰罗尼亚与巴斯克）。整合联邦制路径也被西班牙诸多地区政党采纳，其中加利西亚右翼、加泰罗尼亚联盟等保守党派尤其主张在单一制西班牙框架内实现高度地方自治，将地方民族主义融入更宏大的西班牙统一理想——通常混杂某种程度的伊比利亚主义，极少数方案甚至将葡萄牙纳入伊比利亚整合联邦。尽管整合联邦制拥护者的政治纲领差异悬殊，各党派追求的联邦化程度亦可能天差地别，但其核心信条始终如一：西班牙作为国家本质上是统一整体，各地区在西班牙民族大伞下的境遇远优于作为分离的独立实体。"
 authdem_iberian_federalism_subtype:0 "整合联邦制"
