 ethereal_noirism_subtype:0 "超凡黑人至上主义"
 ethereal_noirism_subtype_desc:0 "§Y超凡黑人至上主义§!\n\n£GFX_ideology_ethereal_noirism_bar\n\n\n\n\n超凡黑人至上主义是弗朗索瓦·“医生爸爸”·杜瓦利埃那怪异又含糊的意识形态的非正式称呼。构成这项意识形态的基础是黑人至上主义，其正如杜瓦利埃的导师和前任卡尔·布鲁瓦尔等其他非裔海地政治领导人所倡导的那样，呼吁非裔海地民族主义和文化复兴，以抵御美国殖民主义的影响造就的严酷现实，白人和混血精英的压迫，以及海地左翼压倒性的政治主导地位，并用非洲主旨，克里奥尔文化以及巫毒教信仰去取代欧洲中心主义思想，创造一种适合非裔海地人大众的社会形式。然而，杜瓦利埃对黑人至上主义的解释却有所不同，他的实施举措更为激进，还对其进行了广泛的调整，以适应他自己对海地的需求和规划。杜瓦利埃意图建立起父权制极权主义的杜瓦利埃王朝，将海地改造为世袭制、半君主式的独裁政权，再以来自西非和巫毒教的精神和文化象征加以点缀。医生爸爸动用暴力准军事组织“通顿马库特”来维护这场幻梦，使用神秘论传说隐瞒他们的身份，将其充作活跃于国家黑暗面的幽灵，还顺势将自己捧为了海地的死神，安息日男爵的化身。他不惜动用武力推动克里奥尔文化以及巫毒教信仰的复兴，彻底抹除长期污染海地民众思想和灵魂的“白人”宗教，甚至利用精神治疗、黑魔法和其他措施来净化民众日常生活中到处都是的欧洲污点。这种精神民族主义与他那残酷的威权主义、法团主义和腐败资本主义的盗贼政府融合在一起，建立起一种沉浸在巫毒教神秘论和神秘学之中的强力个人崇拜，让医生爸爸成了海地国家与巫毒教信仰的化身，而深扎其中的军国主义与准军事组织则完全控制了公众和叙事，鼓吹非裔海地例外主义和进一步的泛非野心。超凡黑人至上主义的定义或许不清不楚，但对医生爸爸来说，安息日男爵能将海地牢牢掌握，才是唯一重要之事。"
