 syn_pan_celticism_subtype:0 "泛凯尔特主义"
 syn_pan_celticism_subtype_desc:0 "§Y泛凯尔特主义§!\n\n£GFX_ideology_pan_celticism_bar\n\n\n\n\n泛凯尔特主义，也简称为凯尔特主义或凯尔特民族主义，是一种政治意识形态和社会文化运动，主张凯尔特民族中布立吞与盖尔两大分支，以及由学者爱德华·劳埃德首次区分的西北欧大西洋边缘地带的现代凯尔特人之间实现团结、合作，有时甚至追求完全统一。在极少数情况下甚至涵盖到更遥远的支系，如凯尔特伊比利亚人、高卢人，乃至更罕见的加拉提亚人以及据称是阿尔卑斯哈尔施塔特文化后裔的奥地利凯尔特人。泛凯尔特主义源于十九世纪凯尔特复兴运动中的浪漫民族主义，此后从爱尔兰和布列塔尼的发源地不断演变和传播，如今已在西北欧大部分地区较为普遍。这主要得益于二十世纪以来每年举行的凯尔特大会、爱尔兰独立运动的最终成功，以及布列塔尼对第二次法国革命的抵抗等因素的推动。但该运动的根源更为古老，部分灵感来自古代凯尔特人抵抗罗马入侵高卢和不列颠群岛的历史，以及文艺复兴时期人文学者、十六世纪苏格兰学者乔治·布坎南等知识先驱的历史和人类学著作——布坎南是最早识别并区分出独特凯尔特身份的重要人物之一。在如今最常见的地区，如爱尔兰和布列塔尼，泛凯尔特主义因与意识形态光谱各端的思潮结合而呈现出巨大差异，但它几乎始终与抵抗外来权威与影响、族群民族主义、社会经济保护主义以及语言文化复兴主义联系在一起。最显著的例子是当下爱尔兰正在进行的盖尔语复兴运动，布列塔尼、凯尔特伊比利亚、苏格兰、威尔士和马恩岛等地也出现了类似运动。"
 german_faith_movement_subtype:0 "德意志信仰"
 german_faith_movement_subtype_desc:0 "§Y德意志信仰§!\n\n£GFX_ideology_german_faith_movement_bar\n\n\n\n\n在派系林立的德国极右翼运动中，四分五裂的阵营曾将日耳曼宗教的答案寄托于各类基督教基要主义者，而日益壮大的新异教徒则主张回归古老神祇，视之为条顿种族的前进之路。然而，唯有真正的开悟者——印欧信仰的信徒——才能穿透这些幻象，把握那超越沃坦、弗蕾娅乃至基督教上帝表象的德意志宗教荣光。在德意志信仰运动创始人雅各布·威廉·豪尔看来，指引德国走向辉煌未来的永恒真理，并非通过神明实现，而是源于挖掘日耳曼人内心反抗异质事物的暗流——那些被罗马基督徒或其他外力强加于德意志子孙的外来习俗。本质上，豪尔的新信仰是对基督教作为德意志精神组成部分的彻底否定。这种精神千年来经由马丁·路德、弗里德里希·尼采等伟人不断彰显，而基督教教条主义每一次遭受的渐进反抗，都印证了基督教会辜负了德国，而非相反。受雅利安秘学与神智学启发，并与众多小型宗教运动、异教团体及自由思想者结盟，德意志信仰运动旨在建立对抗异质信仰的广泛阵线，以守护豪尔所谓的“德意志天赋”。豪尔构想，由民众反抗外来势力而革命诞生的新德国，不会为某个新神设立教会，而是将领悟到：神性蕴藏在印欧人的灵魂深处，而非任何具体的神祇形象。汲取威权民粹主义与北欧主义思想，他描绘的德国是一个奉行种族主义与极权主义、却因亘古日耳曼传统而享有至高崇拜自由的国家。奥丁与托尔等古北欧神祇常被赋予精神象征意义，德国传统音乐与北欧异教意象也为组织成员所用，但不同于复兴主义运动，豪尔仅视其为新时代的符号。尽管该运动核心聚焦于德意志帝国内部，且豪尔“血统、土地与帝国”的格言回荡着人民主义至上论调，他仍承认周边西欧诸国，也就是所谓的印欧国家，同样有能力达到条顿人的精神启迪与纯粹境界。"
