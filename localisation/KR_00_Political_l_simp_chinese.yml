 radsoc_surrealism_subtype:0 "超现实主义"
 radsoc_surrealism_subtype_desc:0 "§Y超现实主义§!\n\n£GFX_ideology_surrealism_bar\n\n\n\n\n政治超现实主义源自同名的艺术与文学运动，其灵感源于波兰裔法国诗人纪尧姆·阿波利奈尔的作品及达达主义运动，但超现实主义在1920年代中期经由安德烈·布勒东、路易·阿拉贡和菲利普·苏波等人的发展，成为一种真正独特的艺术表达形式。该运动以艺术作为潜意识的表现形式为特征，通过梦境或心灵体验，试图将达达主义的虚无主义和个人主义转化为更具建设性的目标。由于政治分歧及艺术阐释方式的差异，超现实主义阵营本身存在分裂，而这些思想流派的裂隙催生了整体上日益政治化的超现实主义运动。超现实主义者一致认同的是，这场运动本质上是革命性的，是在倒退社会中行动的动态力量。对许多超现实主义者而言，该意识形态的目标在于煽动对资产阶级社会的全面反叛，即使在法国大革命后，资产阶级仍通过文化规范、性别角色和整体生活观渗透进新的革命文化。在超现实主义者眼中，革命必须是社会性的，将个人从性禁忌和阶级的双重束缚中解放出来。超现实主义中占主导地位的一翼由安德烈·布勒东领导，主张精神层面的激荡，虽在物质世界改变甚微，却能在人类思想中铸就向集体社会转型的新时代。布勒东将运动推向共产主义思潮，尤其靠拢国际主义共产主义的不同派系，但运动内部也有许多人联系着其他形式的所谓左翼共产主义者甚至无政府主义者。对超现实主义者，这些个人主义与乌托邦梦想的坚定战士而言，马克思主义的集体主义和社会主义理念需通过社会精神层面的变革来实现，即通过颠覆现实来涤除文化、社会与艺术中一切资本主义成分，直至仅存个人主义的集体体验。尽管该运动常因其缺乏实际行动或对无产阶级物质改善的承诺而受抨击，但其强烈的反殖民主义立场使其在国际舞台上获得巨大影响力，成为解放运动和游击团体对抗反动势力的火炬手。超现实主义在黑人集体意识等文化观发展中的作用，及其对民族主义或任何形式的种族主义“肤色”观念的激烈排斥，使其成为拉丁美洲、非洲和亚洲各类反帝团体中自由战士广为接纳的意识形态。"
 left_peronism_subtype:0 "左翼庇隆主义"
