 legislate_more_freedoms:0 "立法保障言论自由"
 legislate_more_freedoms_desc:0 "或许最简单的恢复稳定方法就是给人民他们想要的东西。尽管这可能会引发一些动荡，但我们依旧需要作出妥协，因为在理想情況下，这不过是安抚民心的暂时措施——在秩序得以恢复前。"
 police_crackdown:0 "警察镇压"
 police_crackdown_desc:0 "暴乱日趋猖獗。我们必须放宽对警察的限制，让他们享有逮捕恶劣的寻衅滋事分子的自由。"
 send_in_the_army:0 "派遣军队"
 send_in_the_army_desc:0 "若想处理我国当下乱象，除派兵镇压外别无他法。当然，此种办法实在不合众意，但有时只有戒严令能派上用场、"
 rally_public_support:0 "赢取公众支持"
 rally_public_support_desc:0 "一些政治权利的交换和小小的工业投资能让我们获得更多的支持者。虽然这需要花费不少时间和资源，但从长远来看，这对于改善我们的政治地位是有好处的。"
 solidify_control:0 "巩固统治"
 solidify_control_desc:0 "通过妥善运用政治力量及一些资源，我们能够轻而易举地铲除一些政治上的障碍。虽然我们无法做到排除一切困难，但从长远来看，哪怕是减少一丁点的麻烦，都能让我们未来的政治道路顺畅许多。"
