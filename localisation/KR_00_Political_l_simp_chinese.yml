 balli_kombetar_subtype:0 "国民阵线"
 balli_kombetar_subtype_desc:0 "§Y国民阵线§!\n\n£GFX_ideology_balli_kombetar_bar\n\n\n\n\n阿尔巴尼亚民族主义虽是一种相对晚近的现象，但在这一广泛潮流中，最具代表性的组织莫过于国民阵线。该组织在阿尔巴尼亚民族觉醒先驱米德哈特·弗拉舍里的引领下，本身并非一种意识形态体系，而是更像一辆战车，旨在将阿尔巴尼亚从贫困闭塞的境地转变为繁荣辉煌的国度。他们在《十诫纲领》中明确提出目标：建立一个智识与精神统一的民族，甚至有人接受雅利安-伊利里亚人种的假说，致力于构建大阿尔巴尼亚，保障所有自豪悬挂红黑双头鹰旗帜的民众的权利。尽管他们明确主张建立反剥削的、基于阶级合作的正当经济体系，这与各类右翼工团主义运动有相似之处，但弗拉舍里的追随者并不追求建立狂热的威权体制。在他们看来，阿尔巴尼亚的未来必须与民主紧密相连，让言论自由与思想自由成为社会主流，使住房保障与人身安全成为基本权利；而这一愿景的实现，自然需要充分激发民族的创造性能量与生命活力。通过这样的方式，阿尔巴尼亚人将学会珍视每一个同胞，无论其年龄、地域或信仰。然而，这份仁慈并非无差别地施与所有人，所有反爱国者、叛徒、走狗、煽动者、投机分子、间谍、伪善者、谄媚之徒及封建压迫者，都将面临无情的惩处。正如聚集在米德哈特身边的狂热追随者所宣告的那样：唯有彻底清除共产主义这一内部邪祟，驱除盘踞在阿尔巴尼亚合法土地上的外部寄生虫，必要时不惜动用暴力手段，真正的进步与发展才会到来。"
