 pataut_solidarism_subtype:0 "协作主义"
 pataut_solidarism_subtype_desc:0 "§Y协作主义§!\n\n£GFX_ideology_solidarism_bar\n\n\n\n\n协作主义这一政治术语融贯了许多类似于法团主义，尤其是基督教法团主义，而又特色鲜明的思想、流派。若要追根溯底的话，协作主义一定绕不开两位人物：法国社会学家埃米尔·迪尔凯姆和德国天主教经济学家海因里希·佩施。迪尔凯姆提出了“法团协作主义”的理论，主张依照有机协作原则改造社会结构，通过建立以职业为基础的单一公共机构，消除催生出了阶级冲突的失序现象。深受天主教法团主义影响的佩施是基督教民主派的一大理论源泉，其观点虽与迪尔凯姆相似，但更加强调以工会、行会及商会的形式实现“个人社会化”的核心价值，建立起以家庭为基石的爱国主义国家联盟所组成的人文国际新秩序。\n\n当下最具影响力的协作主义团体是发端于俄国青年运动，于内战和克伦斯基时代的失败中成长起来的新世代民族联盟。联盟以“破除旧时代的罪孽与偏见”为旗号，实施年龄准入制，以把国家改造为公民民族国家为己任，其立国纲领有五：宗教慈善、社会协作、保障个人自由与财产、完成土地改革，以及对社会主义无穷无尽的敌视。联盟内部虽以共和派为主导，但也不乏保皇派的存在，不过，两派在民主参与模式的重要性这一点上倒是看法一致。联盟的知名人物包括现任领袖维克托·巴伊达拉科夫，以及沙俄世代臭名昭著的首相之子阿尔卡季·斯托雷平。除去新世代民族联盟外，荷兰民族协作主义者联盟和挪威国民联盟内部的相关派系也是协作主义阵营的一员。"
 socdem_paneuropeanism_subtype:0 "广义泛欧主义"
 socdem_paneuropeanism_subtype_desc:0 "§Y广义泛欧主义§!\n\n£GFX_ideology_marlib_paneuropeanism_bar\n\n\n\n\n从广义上来讲，泛欧主义即是致力于以联邦、单一制国家，乃至紧密联盟等方式拉近欧洲各国与人民间关系的一种运动。泛欧主义虽然衍生出了各式流派、思想，但欧洲一体化这一概念的最普遍形式还是拥护某种共通的“欧洲价值观”，这一价值观可以是中世纪的基督教传承，也可以是自由主义革命的精神。有不少重量级人物都倡导过由人权、某种形式的民主、法律法规缔造的统一欧洲，而其中最出名的当属康拉德·阿登纳、加埃塔诺·马蒂诺、卡洛·斯福尔扎和米兰·霍贾。"
 laborismo_esperantista_subtype:0 "世界语劳工运动"
 laborismo_esperantista_subtype_desc:0 "§Y世界语劳工运动§!\n\n£GFX_ideology_laborismo_esperantista_bar\n\n\n\n\n世界语劳工运动亦即所谓的“世界语社会主义”，是依托人工语言世界语凝聚形成的多元左翼政治思潮集合体，其核心理念在于通过共同语言打破壁垒，为劳动者提供跨国连携与自由组织的工具，从而推动社会进步、国际主义、和平与平等之事业。早在世界大战之前，欧洲各地就涌现出了诸多以世界语为载体的工人运动，但它们多局限于地方层面，实际影响力有限。首个具有明确国际目标的此类组织是由费尔南·布朗加兰和R·路易共同创立、旨在通过人造语言传播国际主义与反资思想的国际和平自由协会。不过，国际和平自由协会主要活跃于法国，战前其它类似的世界语探索也相继失败。战后，无民族世界语协会的成立，重新点燃了这场运动的活力，世界语社会主义也借力新兴工团集团、奉行国际主义外交政策的第三国际，再次回到了大众眼前。世界语社会主义者、无政府主义者与共产主义者携手工团主义者，共同传播全球工人团结、无民族主义和反资本主义的理念。无民族世界语协会大会的组织形式尤其体现了对于民族主义的摒弃：其理事会代表按世界区域而非国家划分产生。不过，世界语劳工运动的内涵远非无民族世界语协会这一标志性组织可以概括，而且世界语融入无产阶级大家庭的地区实践，往往因具体情境需求而体现出多样化的形态，某些情况下甚至能看到民族主义的影子。对于世界语社会主义者而言，语言既是突破民族地域障碍的工具，更是承载文化与意识形态的载体，其始终与国际社会主义思潮共同演进。"
 authdem_red_tinted_autocracy_subtype:0 "红色专制"
 authdem_red_tinted_autocracy_subtype_desc:0 "§Y红色专制§!\n\n\n\n£GFX_ideology_red_tint_bar\n\n\n\n\n红色专制体制是指名义上遵循社会主义理念的专制政权。虽然这类体制可能融入了部分社会主义的主张，但其本质往往与真正的社会主义理想相去甚远——统治者不过是以红色粉饰门面，借此争取左翼支持者的拥护。不过也必须指出，确实存在部分专制统治者切切实实地在奉行社会主义及社会民主的思想。"
 council_communism_subtype:0 "委员会共产主义"
 council_communism_subtype_desc:0 "§Y委员会共产主义§!\n\n£GFX_ideology_council_communism_bar\n\n\n\n\n委员会共产主义是俄国内战结束后，在西欧工团主义革命意外得胜的背景下，于共产主义左翼阵营中诞生的一股重要思潮。委员会共产主义者坚信资本主义必然灭亡，而革命的引擎必须依靠独立自主的工人委员会与组织来维持，最终通过大规模罢工等产业行动，实现无产阶级专政。在委员会共产主义者看来，传统的工会不过是资产阶级与其改良派社会民主盟友编织来的门面幻象，因此倾向于建立独立运作的新式工会。虽然委员会共产主义与革命工团主义、列宁马克思主义存在相似之处，甚至借鉴了前者的产业工会主义和一个大工会之理念，或是称赞后者之实践，但其还是基于特定意识形态立场否定了这两大流派——工团主义者常常会维系资产阶级的权力与工会结构，缔造出“劣化的工人国家”，而布尔什维主义则抛弃了工人统治，让先锋队党催生的新精英通过国家社会主义施行威权专制。最后，委员会共产主义者囊括了诸如安东·潘涅库克、赫尔曼·戈特、奥托·吕勒、西尔维娅·潘克赫斯特、保罗·马蒂克等各式各样的政治家和理论家，虽然其都曾于特定时期承认国家和政党的必要性与暂时性，但这仅仅是为培育阶级觉悟的无产阶级接管政权铺设跳板罢了。"
 syn_council_communism_subtype:0 "委员会共产主义"
