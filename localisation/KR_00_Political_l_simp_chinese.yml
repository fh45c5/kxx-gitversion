 natpop_natpop_pelleyism_subtype_swap_tt:0 "我们将转向§F$natpop_pelleyism_subtype$§!"
 marlib_austropopulism_subtype:0 "自由化奥地利民粹主义"
 marlib_austropopulism_subtype_desc:0 "§Y奥地利民粹主义§!\n\n£GFX_ideology_marlib_austropopulism_bar\n\n\n\n\n如今的奥地利民粹主义，说到底不过是基督教民主主义糅合了恩格尔贝特·陶尔斐斯独特的法团主义民主治理观后在维也纳生出的一个小众分支。当民主不再成为桎梏，奥地利民粹主义的真容方得显现：以《四十年》通谕为纲领，高悬起十字架，执掌法律权柄；各利益集团掌控着大多数劳动者，而劳动者也在治理中拥有一定的发言权。尤为特别的是，奥地利民粹主义格外重视农民阶层，将其视为国家的支撑。\n\n奥地利民粹主义抱持强烈的民族主义立场，主张人不分贵贱，梦想建立一个超脱党派之争，不以外貌、出身论人，而以是否虔信上帝、品格是否端正为衡量标准的理想国度。\n\n列支敦士登新成立的祖国联盟所推崇的这一奥地利民粹主义分支，既吸收了温和基督教社会主义的元素，又采纳了陶尔斐斯的诸多法团主义主张。比起宗教教义，它更重视经济纲领，也更愿意与社会民主主义组织合作。为争取吸纳进来的人民党的支持根基，它主动做出诸多妥协，并因此时而被骂作“肮脏赤匪”，时而又被说成“冲锋队的翻版”。饶是如此，这群奥地利民粹主义者仍积极谋求与瑞士拉近距离，全然不顾自身意识形态的渊源。"
 natpop_pelleyism_subtype:0 "佩利主义"
 natpop_pelleyism_subtype_desc:0 "§Y佩利主义§!\n\n£GFX_ideology_pelleyism_bar\n\n\n\n\n乍看之下，出身马萨诸塞州的威廉·达德利·佩利麾下的基督教党所持之思想不就是带着些许威权色彩的基督教民主嘛——若你真这么想的话，那可就恰恰错过了这位银色军团首长纲领中最大的特色了。佩利主义提倡建立“基督教联邦”，说人话就是继承了美利坚共和制、捍卫宗教分产主义模式和社会公义，并且同工团主义势不两立的新政府。佩利的思想中既有公正受审之权利、新法律和罢免立法者的公投、原生或归化公民的年度福利，以及旨在消灭失业率、保证民众温饱的普遍就业登记制度等无可指摘的内容，也有创立联邦企业，吸收、消灭私营企业等剑走偏锋的奇思异想，如拟议中的中央财政银行，其职责就是分配国家信贷、推动大学教育免费化、履行同原住民签订的条约以及充分发挥银色军团的能动性。不过，要论佩利思想最受人非议的一点，那绝对是其对待某些少数族裔的政策，例如阿巴拉契亚的白人、南方的黑人和墨西哥移民就被打上了“不具生产力”的标签，丧失了一切公民福利，强行划入了“监护系统”之中，由国家出面监督其进行劳作，直到完全符合教育标准、能够重新融入联邦为止。除去上述观点以外，佩利还有一些在外人看来过于“怪异”而被其盟友雪藏的想法，举个例子，设立犹太人隔离制度在保守反动势力之中尚属见怪不怪，但如果说欧洲的罗斯柴尔德家族为报复本杰明·富兰克林的反犹言论而资助了黄金圈骑士团，指使其刺杀了林肯总统的话，那阁下又作何感想呢？最后还要说的一点是，佩利曾在《解放》、《新解放者》等杂志上提到过自己的秘传信仰，经常把魂灵禁术、暗黑幽魂、天外来客、种族精神等级制什么的挂在嘴边——这也就解释了为什么这位自称会漂浮术的男人形形色色的追随者中会不乏各路灵性论信徒的身影了。"
 natpop_pan_turkism_subtype_swap_tt:0 "我们将转向§F$pan_turkism_subtype$§!"
 pan_turkism_subtype:0 "泛突厥主义"
 pan_turkism_subtype_desc:0 "§Y泛突厥主义§!\n\n£GFX_ideology_pan_turkism_bar\n\n\n\n\n泛突厥主义的起源或许会让关注西方事务的人感到意外，它可追溯至鞑靼斯坦及俄罗斯帝国治下的其他突厥穆斯林地区。这一意识形态在19世纪初具雏形，其众多拥趸的思想源泉，可以追溯到贾迪德运动与瓦伊西运动。这些运动旨在将地方斗争从宗教统一转向现代化、共享文化认同和民族解放；很快，泛突厥主义便在奥斯曼帝国找到了沃土，当时的帝国正深陷内部动荡，对未来方向充满迷茫。最著名的泛突厥主义政治家当属尤素福·阿克丘拉。他创办了《突厥祖国》杂志，并撰写《三种政策》宣言，主张帝国应放弃欧洲领土，转而去关注中亚的同源民族，同时强力同化境内的少数民族。社会学家齐亚·格卡尔普进一步发展了这些思想，构建起统一的“图兰”概念，那是一个不受希腊人、亚美尼亚人和犹太人干涉的理想国度，他认为所有突厥人都应为此奋斗。此外，激进的军事强人恩维尔帕夏，因其与青年土耳其党内的极端民族主义派系关系密切，也积极推动了这一思潮。尽管泛突厥主义本身并不固守于某种特定意识形态，但如今高举其火炬、呼声最响亮的，已是尼哈勒·阿茨兹和阿尔帕斯兰·图尔凯什所代表的年轻极右翼一代。归根结底，其普遍且压倒性的愿景在于：基于共同的文化、哲学与政治成就，统一所有突厥族群，有时甚至不止于此，它还倡导所有“图兰”乌拉尔-阿尔泰民族（乃至日本人）的大融合。这一结局被视为历史必然，因为在他们的叙事中，突厥血统优于一切企图“污染”其社会达尔文主义乌托邦的“低劣”对手。那个乌托邦曾被视为世界灯塔，直到嫉妒“母狼阿瑟娜后裔”之辈将祖先的辉煌文明摧毁并强令遗忘。"
 authdem_authdem_hispanism_subtype_swap_tt:0 "我们将转向§g$authdem_hispanism_subtype$§!"
 authdem_hispanism_subtype:0 "西班牙至上主义"
 authdem_hispanism_subtype_desc:0 "§Y西班牙至上主义§!\n\n£GFX_ideology_hispanism_bar\n\n\n\n\n为与学术领域的西语文化、政治运动想区分，西班牙至上主义亦称为政治西班牙至上主义或泛西班牙主义，其是由不同意识形态派系、成分各异的团体组成的一股复杂思潮，它们有着共同的核心目标：前西班牙帝国治下诸国的联合。西班牙至上主义为诸多拉美与西班牙的社会主义、自由主义、保守主义及反动运动所接纳，其典型特征包括：经济与军事领域的反美，呼吁西语国家的团结协作，少数甚至主张西语世界彻底的政治一统。至于各西语国家间合作的界限，不同派别有着各自的观点：温和派如拉蒙·梅嫩德斯·皮达尔、何塞·马里亚·桑佩尔和米格尔·德·乌纳穆诺等人，主张结成合作联盟，在同舟共济中共同推进西语及相关文化的发展；保守派则常将西班牙种族优越论挂在嘴边，而至于此一概念是囊括了拉美的“混血种族”，还是仅指“纯正”血统的西裔精英，各方尚无定论。部分西班牙至上主义思想家如拉米罗·德·马埃斯图、何塞·德拉里瓦-阿圭罗-奥斯马等人，将天主教信仰与右翼保守价值观视为西班牙共同体的核心支柱，并称这些特质本为全体西裔民族所固有，却因自由主义和工团主义之影响而遭侵染——按此观点，西班牙至上主义的三大支柱责任、等级与人道，正与法国大革命的口号自由、平等、博爱相对立。因其可塑性，西班牙至上主义已渗入了从波多黎各民族党之类无关国家的民族独立运动，直至国家工团主义进攻委员会等国家工团主义组织的各类意识形态之中。并且随着美国对拉美控制力度的减弱，这一思潮仍在不断地发展演变。"
