 soccon_republican_panafricanism_subtype_desc:0 "§Y共和泛非主义§!\n\n£GFX_ideology_soclib_republican_panafricanism_bar\n\n\n\n\n共和泛非主义，有时直接称之为泛非主义，是对围绕着泛非团结理念的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民主主义的意识形态通常寻求通过一系列自由共和或保守共和思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行民主合作。尽管本质绝非如此，但共和泛非主义往往会变得军事化，在经济上，他们通常要么支持法团主义，要么资本主义，要么则是传统主义。各个共和政府对民主进程的关注程度各不相同，但贪污腐败却往往成为其共同特征。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由让·普莱斯-马尔斯、W·E·B·杜波依斯、乔莫·肯雅塔、马库斯·加维和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 soccon_kimbanguism_subtype:0 "基班古主义"
 soccon_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与民主主义团体之间的关系，基班古主义逐渐开始为刚果独立而斗争，并拥抱了资本主义经济和地方民主，不过总体上它仍坚持着自给自足，并保持着和平主义立场。"
 authdem_republican_panafricanism_subtype:0 "共和泛非主义"
 authdem_republican_panafricanism_subtype_desc:0 "§Y共和泛非主义§!\n\n£GFX_ideology_soclib_republican_panafricanism_bar\n\n\n\n\n共和泛非主义，有时直接称之为泛非主义，是对围绕着泛非团结理念的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民主主义的意识形态通常寻求通过一系列自由共和或保守共和思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行民主合作。尽管本质绝非如此，但共和泛非主义往往会变得军事化，在经济上，他们通常要么支持法团主义，要么资本主义，要么则是传统主义。各个共和政府对民主进程的关注程度各不相同，但贪污腐败却往往成为其共同特征。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由让·普莱斯-马尔斯、W·E·B·杜波依斯、乔莫·肯雅塔、马库斯·加维和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 authdem_right_panafricanism_subtype:0 "右翼泛非主义"
 authdem_right_panafricanism_subtype_desc:0 "§Y右翼泛非主义§!\n\n£GFX_ideology_right_panafricanism_bar\n\n\n\n\n右翼泛非主义，有时直接称之为泛非主义，是对以泛非团结理念为核心的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民粹主义的意识形态通常寻求通过一系列右翼思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行合作。尽管本质绝非如此，但右翼泛非主义往往会变得军事化，且时常会走向君主制、独裁国家、军政府或共和政体。在经济上，右翼泛非主义通常支持法团主义、资本主义或传统主义，且都带有不同程度的威权主义，尽管也确实存在一些民主国家。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由马库斯·加维、斯坦利·马森格、本杰明·纳姆迪·阿齐基韦和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 authdem_kimbanguism_subtype:0 "基班古主义"
 authdem_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与部落和保守主义团体之间的关系，基班古主义逐渐变得支持温和君主制和具有强烈的神权倾向，因而它将基班古视为了新任刚果国王，并支持建立在部落关系上的混合经济，不过总体上其仍遵循着不常干涉政治与和平主义的立场。"
 kleptocracy_subtype_desc:0 "§Y强盗政府§!\n\n£GFX_ideology_kleptocrat_bar\n\n\n\n\n强盗政府描述的是一个通过公开的或隐秘的渠道，围绕贪污腐败建立起来的政府——亦或者，根本就不存在政府。与其说它是一种明确的意识形态，不如说它是许多独裁专制政权的天然属性。纯粹的强盗政府回避意识形态，或者只是打着意识形态的幌子随心所欲，不择手段地追求实现统治集团的贪婪野心。逐利、奢侈、腐败、漠视道德、享乐主义等都是强盗政府共通的属性，尽管每个强盗政府实现其目标的方法和表现出来的形象可能会大相径庭。"
 pataut_right_panafricanism_subtype:0 "右翼泛非主义"
 pataut_right_panafricanism_subtype_desc:0 "§Y右翼泛非主义§!\n\n£GFX_ideology_right_panafricanism_bar\n\n\n\n\n右翼泛非主义，有时直接称之为泛非主义，是对以泛非团结理念为核心的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民粹主义的意识形态通常寻求通过一系列右翼思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行合作。尽管本质绝非如此，但右翼泛非主义往往会变得军事化，且时常会走向君主制、独裁国家、军政府或共和政体。在经济上，右翼泛非主义通常支持法团主义、资本主义或传统主义，且都带有不同程度的威权主义，尽管也确实存在一些民主国家。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由马库斯·加维、斯坦利·马森格、本杰明·纳姆迪·阿齐基韦和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
