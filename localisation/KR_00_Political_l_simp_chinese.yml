 tot_matswanism_subtype:0 "马茨瓦主义"
 tot_matswanism_subtype_desc:0 "§Y马茨瓦主义§!\n\n£GFX_ideology_matswanism_bar\n\n\n\n\n马茨瓦主义，亦称马佐瓦主义，是发源于反殖民领袖安德烈·格勒纳尔·马茨瓦（又称马佐瓦）的动态发展中意识形态体系。该思想诞生于德国将法属赤道非洲殖民地并入中央非洲之时的首府城市布拉柴维尔，其以激烈的反帝立场为内核，抵制殖民势力造成的文化倒退、社会经济不公与政治压迫。马茨瓦矢志为人民建立一个劳工友好的独立刚果国度，为此屡陷殖民地监狱亦在所不惜。马茨瓦旗下的政治组织法属赤道非洲原住民友好协会是传播这一思想的主力军，并与法兰西公社散布于工团派、共产派和社会主义派中的亲原住民势力保持着友好关系。以左翼意识形态与草根民粹主义为出发点，马茨瓦及其同志长期致力于在德国殖民统治的夹缝中，于法属刚果推广、支持黑人工会运动与社会主义项目。这种不计代价解放劳苦大众的执着，无意中催生了马茨瓦主义最独特的灵性维度——在赤道非洲的被压迫者眼中，他逐渐成为了背负基督教之上帝与特克神灵旨意的反帝救世主，堪比比属刚果的西蒙·基班古先知。然迥异于基班古、刚果的西蒙-皮埃尔·姆帕迪和利比里亚的威廉·瓦代·哈里斯等现代反帝先知，头顶准宗教光环的马茨瓦鲜少自诩为救世主。耐人寻味的是，虽存在着准神性色彩与鲜明的左翼立场，当地政客仍竞相攀附马茨瓦的救世主光环，致使其思想元素逐渐渗透进法属刚果各派政纲，进一步助长了民众对于马茨瓦所谓神性的幻想。"
 socdem_left_social_credit_subtype:0 "红色社会信用理论"
 socdem_left_social_credit_subtype_desc:0 "§Y红色社会信用理论§!\n\n£GFX_ideology_red_socred_bar\n\n\n\n\n左翼社会信用理论，或称红色社会信用理论，是茅德·冈、丹尼斯·爱尔兰等不满于英国左翼根深蒂固的等级制度的爱尔兰劳工活动家和费边社会主义者，在英国哲学家C·H·道格拉斯废除薪酬奴役、尽快实现社会信用国家红利的经济分配理论基础之上发展出的左翼衍生。如其名所示，左翼社会信用理论也主张政府向所有民众（不分生产者、消费者）发放无债货币，以应对大战后困扰多国的经济下滑和购买力长期不足的问题，但与原版社会信用理论不同的是，它以进步社会经济学为纲，吸收了温和、非革命的社会主义思想中的福利经济理论，抛弃了构成原社会信用运动基础的对左翼的无端恐惧。左翼社会信用理论同其前身一样，认为体制是为人而生、为人服务的，而不是反其道而行之，因此，为了确保人民的绝对社会经济安全，需以意识形态重写金融法则，颠覆经济支柱，而至于这个意识形态具体是什么，其内部又分为了两派，一派是以爱尔兰的众人、美国的罗伯特·海因莱因、新西兰的约翰·A·刘易斯为首的平等、人道主义派，另一派则是如魁北克的路易·埃旺那样的种族、民族、神学系。右翼反对者视左翼社会信用理论为伪社会主义，而左翼则斥其和右翼的表亲一样为愚弄无产阶级的掠夺性经济。左翼社会信用理论经常与基督教分产主义、经济融合主义、农业主义等基督教右翼思想，以及大规模社会化、福利国家体制、社会民主、公平施政等温和左翼政策相绑定，它们共同构成了实现体制内所有人经济安全的第三条道路。"
 soclib_social_credit_subtype:0 "社会信用理论"
 soclib_social_credit_subtype_desc:0 "§Y社会信用理论§!\n\n£GFX_ideology_socred_bar\n\n\n\n\n社会信用理论是由英国哲学家C·H·道格拉斯提出的一种经济分配理论，它主张政府向所有民众（不分生产者、消费者）发放无债货币，以应对大战后困扰多国的经济下滑和购买力长期不足的问题。社会信用理论认为体制是为人而生、为人服务的，而不是反其道而行之，因此，为了确保人民的绝对经济安全，金融法则需要被改写，经济支柱需要改弦易帜。社会信用理论提出了实现体制内所有人经济安全的第三条路，但右翼视社会信用理论为伪社会主义，而左翼则斥其为愚弄无产阶级的掠夺性经济。社会信用理论经常与基督教分产主义、经济融合主义、农业主义等基督教右翼思想（如果把“强者之证”算进来的话甚至还牵扯上了激进环保主义）相绑定。"
 authdem_dixiecrat_subtype:0 "南方民主党思想"
 authdem_dixiecrat_subtype_desc:0 "§Y南方民主党思想§!\n\n£GFX_ideology_dixiecrat_bar\n\n\n\n\n南方民主党思想是美国南方腹地的一种传统基督教保守思想，因和旧民主党的关系又得名旧民主党思想。这一思想强烈反对自由主义、左翼思想、民权运动等所谓的“现代罪恶渊薮”，并与三K党等法外组织关系匪浅，愿意利用各种合法非法途径来实现自身的政治诉求。南方民主党思想支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，是旧美国传统保守主义的最后堡垒，并且以近乎军事化的强硬姿态，顽固捍卫着这一价值体系。"
 authdem_populist_dixiecrat_subtype:0 "民粹派南方民主党思想"
 authdem_populist_dixiecrat_subtype_desc:0 "§Y民粹派南方民主党思想§!\n\n£GFX_ideology_populist_dixie_bar\n\n\n\n\n民粹派南方民主党思想与其说是一种明确的意识形态，不如说是宏大政党格局中的一种特例。虽然传统的南方民主党人对自由主义、进步主义和社会主义之概念怀抱着强烈的敌意，但民粹派却将其中的一些价值观纳为了改善工人阶级选民生活的手段。民粹派在捍卫南方核心价值观的同时，借用了某些北方的经济“交易”元素，持有更为关注平民的国家干预主义立场（尽管其中部分仍然倾向保守财政）。种族隔离和白人至上主义仍然得到民粹派的容忍，但他们的影响力也因民粹派更多关注如何帮助白人社区、制定“分离但平等”的政策，甚至拒绝将种族问题作为重点要务而遭到了削弱。州权仍然是民粹派最为重视的议程，但他们往往选择通过保护独特的南方文化机构而不是维护精英政治机器来推进。"
 natpop_misteryism_subtype_swap_tt:0 "我们将转向§N$misteryism_subtype$§!"
 misteryism_subtype:0 "秘信会主义"
 misteryism_subtype_desc:0 "§Y秘信会主义§!\n\n£GFX_ideology_misteryism_bar\n\n\n\n\n秘信会主义，作为英格兰秘信会的教义，是一种等级森严、遵循传统的意识形态，由安东尼·卢多维奇的著作塑造而成。它否定自由民主、议会制度、大众政治，以及任何主张以平等指导统治的理念，转而呼吁重建封建贵族制的英格兰，由血统、品性和秘信会主义者宣称的英格兰特色精神本质定义的精英阶层领导。对其追随者而言，国家并非民意的执行者，而是一个由有教养的贵族阶层守护的古老有机体。普选权、政党竞争和现代平等崇拜都被斥为侵蚀自然等级秩序的幻象。秘信会主义思想认为，只有植根于世袭权威的结构化秩序才能维护国家健康。这种意识形态将前工业时代的英格兰理想化，主张以复兴的行会体系取代工会，建立基于忠诚、 管家精神和祖先义务之上的社区。工业过剩、外国资本和泛滥的民主制度被视为衰败的征兆。其经济纲领既反对无约束的商业资本主义，也排斥集体社会主义，转而提出一条基于财产、传统和责任的道路——私有财产成为个人的道德锚点与国家的稳定基石。其坚信英格兰种族及其文化传承具有独特性，种族纯净维护被置于首位，混血被视为危害民族生命力的行为。部分信徒甚至鼓吹近亲结合优于异族通婚，声称必须不惜代价守护血统纯净。这种民族中心主义世界观与贵族美德复兴相结合，强调纪律、忠诚、克制和对历史秩序的敬畏。秘信会主义描绘了一幅基于严格等级、祖辈责任和有教养精英的国家复兴图景。其追随者宣称这是让英格兰在精神、社会和生物层面重生的唯一道路，使国家回归他们眼中的应然状态。"
