 authdem_carlism_subtype:0 "卡洛斯主义"
 authdem_carlism_subtype_desc:0 "§Y卡洛斯主义§!\n\n£GFX_ideology_carlist_bar\n\n\n\n\n卡洛斯主义是西班牙的反动运动，其宗旨是恢复旧继承法，将如今统治西班牙的“伊莎贝尔”分支废黜，并立他们心中的正统，西班牙波旁家族为王。为争取广泛支持，运动还联合了其他保守派系，成为了西班牙反自由主义斗争几十年来的门面。他们的政治目标是建立信奉传统天主教的绝对君主制，其座右铭“上帝、祖国、国王”，可谓是对这一目标的最好概述。口号的最后通常还会加上“自治法”（中世纪时赐予阿拉贡和纳瓦拉王国的特权），此举是为了吸引那些传统上反西班牙的地区，而且取得了相当的成功。\n\n虽然内核未变，但卡洛斯主义还是受到了其他类似运动的影响，比如葡萄牙整合主义。此外，卡洛斯派不少领袖都在维也纳长期逗留，这也让他们接触到了不少更为“自由主义”的基督教政治思想。"
 authdem_integrism_subtype:0 "西班牙整合主义"
 authdem_integrism_subtype_desc:0 "§Y西班牙整合主义§!\n\n£GFX_ideology_integrism_bar\n\n\n\n\n西班牙整合主义是法葡整合主义的西班牙化变体，代表西班牙传统主义政治光谱的极右翼，主张天主教近乎全面主导国家事务。该思潮影响力巅峰见于西班牙整合党创立时期，虽现已式微，仍作为支流潜藏于巴斯克传统主义与极端卡洛斯派之中。与通常以王朝谱系划分的西班牙传统主义派别（如主张不同王朝继承路线的卡洛斯派与阿方索派）不同，由拉蒙·诺塞达尔、胡安·奥拉扎巴尔等理论家奠基的西班牙整合主义具有独特内核。\n\n西班牙整合主义者不预先选择效忠的君主，二十至三十年代更将偶然主义（对君主制或共和制框架皆持暧昧态度）纳入纲领。随着主流传统主义者对其边缘化，神秘主义与千禧年主义元素逐渐渗入该运动——部分极端分子甚至主张拥立耶稣基督为西班牙象征性君主，在工团主义与自由主义这些伪神引发的末世中君临天下。在西班牙整合主义者的视域中，理想国家应由行会、企业乃至家族结构等自然有机体构成，政府仅负责确保这些机体有序运转。\n\n他们从宗教视角审视所有社会问题，将贫困、不平等与地方主义危机归咎于自由主义无法构建真正平等的社会，而唯有天主教能实现此目标。实践中，西班牙整合主义者推崇由最具才能与虔诚信仰者治国，其选举策略显示他们更信任专家意见而非政客主张，对民主组织的深恶痛绝亦昭然若揭。尽管实践层面与主流卡洛斯派差异不大，但其顽固坚持仅通过宗教手段解决社会问题、对天主教义的原教旨主义态度，甚至令其他强硬传统主义派系视之为危险而可怖的政治力量——纵然他们仍属边缘存在。"
 pataut_popularism_subtype:0 "人民主义"
 pataut_popularism_subtype_desc:0 "§Y人民主义§!\n\n£GFX_ideology_popularism_bar\n\n\n\n\n人民主义是意大利人民党的指导思想，其以政治形式接过了各路基督教民主运动的衣钵。该党由具有基督教温和社会主义思想背景的天主教神父路易吉·斯图尔佐阁下创立，希望借此在关心人民的同时影响政治，而教宗利奥十三世则禁止基督教民主团体如此行事。欧洲人民主义代表了天主教徒正努力接受民主制度的存在，并开始将民主制度化作一种团结社会各阶层的力量。主张人民主义的政党致力于实施比例代表制、尊重家庭等自然社区、更广泛地接触一切社会群体、女性选举权以及由管理者、工会和学者组成的半法团式特别参议院。由于人民党出身并扎根于农业，因此他们还认为国家最好的运作方式是权力下放，给予地方社区更多的自治权。从某种程度说，人民主义算是中央集权制和以个人为中心的自由民主制的分权化、有机化版本。"
 organic_liberalism_subtype:0 "有机自由主义"
 organic_liberalism_subtype_desc:0 "§Y有机自由主义§!\n\n£GFX_ideology_organic_liberalism_bar\n\n\n\n\n有机自由主义是西班牙外交官、备受尊敬的自由主义巨擘萨尔瓦多·德·马达里亚加·罗霍的个人意识形态。作为西班牙“一四一代”知识分子群体的一员，马达里亚加与同时代的许多学术精英一样，将世界大战视为全球政治的转折点。尽管他倾向于协约国，德国的胜利对他而言是苦涩的现实，但德国保守霸权的崛起，反而坚定了他的信念：必须通过旨在增进国家间合作的跨大陆组织，来建立新的国际秩序。马达里亚加自视为反功利主义的人文主义者、温和的君主主义者以及古典自由主义者。在他看来，经济和政治自由主义完全从属于、甚至次要于人文自由主义。对于这位原本的古典自由主义追随者而言，自由主义的核心理念在于确保一种全体一致的有机民主。在这种民主模式下，国家将由三个阶层构成：下层阶级不被视为积极公民，因此也不对其行为承担个人责任；而资产阶级中产阶级和贵族阶层，则是政治、经济和行政的两大核心力量。国家将禁止并强制执行罢工等对国家与经济有害的行为，以确保人民的繁荣与自由不受煽动者的限制。除了信奉这种新的、层级化的社会结构，有机自由主义也是最早的欧洲主义意识形态之一。受里夏德·冯·库登霍韦-凯勒奇的泛欧运动启发，马达里亚加支持一种兼收并蓄、包罗万象的欧洲理念。他反对盛行的工团主义，并将欧洲联邦式的统一视为对抗未来德国或美国等行为体可能主导全球政治的唯一途径。尽管马达里亚加常被视为和平主义者，并曾宣称放弃将战争作为国家政策的工具，但近来，由于公社的威胁，他的思想已演变得更具干涉主义色彩，将审慎地使用战争纳入其进一步传播自由的核心信条。他的意识形态中还怀有对昔日西班牙帝国的一丝眷恋；尽管他与共和党派系有联系，马达里亚加始终乐观地认为，西班牙可以通过真正的君主立宪制实现复兴。尽管批评者指责其思想具有精英主义和反民主倾向，但马达里亚加依然在加利西亚和西班牙的联邦主义者中获得了支持，同时也得到了卡尔·波普尔、沃尔特·李普曼和路德维希·冯·米泽斯等国际自由主义思想家的认同。"
 marlib_organic_liberalism_subtype:0 "有机自由主义"
