 haeusserbund_subtype:0 "霍伊塞尔联盟"
 haeusserbund_subtype_desc:0 "§Y霍伊塞尔联盟§!\n\n£GFX_ideology_haeusserbund_bar\n\n\n\n\n“我就是道路、真理和生命；我就是超人、复活与新时代！”，如此宣称的路德维希·克里斯蒂安·霍伊塞尔，是最著名的“通胀圣徒”之一，他自封为上帝的羔羊，对愿意聆听他信息的人具有真正的磁石般的吸引力。尽管黑色星期一灾难后涌现了许多启示演说家，但霍伊塞尔原本平凡的人生早在1912年就已转变，当时他看到了完成第三份也是最后一份圣约所必须之事。这无非就是他自己的人格，而其他人对此视而不见：“纯净者视世界为一座巨大的茅厕。居住在这世上的每一个罪人，都是往这世界大粪坑里排泄的屁眼之一……难怪这些屁眼既无法理解也无法相信”。这位新生的先知最初加入各类倡导生活改革的团体，随后将反物质主义的圣经基督教、道教、尼采式超人理念以及马克斯·施蒂纳的“自我崇拜”融合成折衷的大杂烩，旨在追求和平并反对德皇的战争。世界大战结束后，路德维希保持着亲法倾向，并与着迷于他的包豪斯及达达主义前卫派实践者共同倡导建立欧洲合众国。无论这个国家采取何种形式，都将贯穿豪泽尔人生的核心主题：妄自尊大、和平主义、雌雄同体、乌托邦主义、极端暴力的怨恨、日耳曼例外论、欧洲统一、公社生活、精神性欲狂热、政治极化、弥赛亚式民粹主义与激进的个人解放。要实现这样的伟业离不开盟友，因此这支“真理军”的最高统帅正从左翼到右翼广泛呼吁人们响应他的号召：“鲜血！蓝色之血！黑色之血！红色之血！一切颜色的鲜血！……鲜血必将奔流！每条沟渠都将如暴雨后般漫溢鲜血！”——在“人民皇帝”及其赦免所有罪行、终结所有机构（监狱、精神病院甚至医院）、废除一切约束、实施自愿无产制的法令推动下，这一切将以持续十天的“初始安息日”来庆祝，违者将面临每个广场竖立起的断头台的死刑威胁。尽管被大众嗤之以鼻，“永恒路易”确实真诚地致力于废除旧秩序与“恶魔统治”，转而建立“神权治下祭司君王统治的无政府君主制”。或许有一天，霍伊塞尔帝国将成为现实，所有民族都将很快因德意志的本质特性而痊愈；在无反犹偏见地拯救“崩溃的白人种族”、处决法官以及基于个人神性的自治中，迎来新时代的曙光。"
 mystical_anarchism_subtype:0 "神秘无政府主义"
 mystical_anarchism_subtype_desc:0 "§Y神秘无政府主义§!\n\n£GFX_ideology_mystical_anarchism_bar\n\n\n\n\n要实现世界的精神复兴，必须诞生一种新哲学，既拒斥资本主义又摒弃正统马克思主义，而这正是古斯塔夫·兰道尔深刻意识到的。这位出生于德国中产阶级同化犹太家庭的思想家，后来深受德国浪漫主义、巴鲁赫·斯宾诺莎、亚瑟·叔本华和弗里德里希·威廉·尼采的影响。他加入德意志社会民主党的举动或许令人诧异，但正是这一选择及其最终对历史唯物主义和僵化国家改造教条的拒斥，催生了“神秘无政府主义”，这个标签与“伦理无政府主义”乃至“人民主义无政府主义”等术语共同定义了这位思想家的无政府社会主义理念。通过《怀疑主义与神秘主义》《社会主义的呼唤》等奠基性著作，这位革命理论家主张：社会主义并非某种“规律”的必然产物，而是人类意志、伦理选择与自愿行动的成果，即以根植于无本源性、无根基性、无实质性的独立小共同体之“无支配状态”，自愿取代压迫性的“支配型”国家。运用神秘人类学时，当人们体悟到“灵魂未创生的根基”始终将全人类与上帝相连，向内探求便能获得启示，重新连接中世纪的精神本质与被遗忘的世间共同体。正因如此，兰道尔创立的社会主义同盟旨在“团结所有认真实现社会主义的人”，通过挖掘十六世纪现代国家诞生时被摧毁的“社会之社会”有机共同体来实现这一目标。尽管对左翼中较教条化、理论化的同僚而言略显晦涩，但神秘社会主义仍吸引着那些希望通过和平主义、世界主义的民族主义、自治联邦制，以及回归浪漫化理想中未被城市现代主义污染的田园手工艺生活来解放世界的人们。倘若古斯塔夫的神秘理念得以实现，每个民族都将以独特的文化映照，为因激进民主特质与社群主义精神而重焕生机的人类整体作出贡献。"
 freiwirtschaft_subtype:0 "自由经济"
 freiwirtschaft_subtype_desc:0 "§Y自由经济§!\n\n£GFX_ideology_freiwirtschaft_bar\n\n\n\n\n许多理论家和政治家都试图引导群众改革货币体系及其种种弊端，但很少有人像德裔阿根廷经济学家约翰·西尔维奥·格泽尔那样特立独行。这位自学成才的改革家在19世纪90年代经济衰退期间于南美洲经营企业的经历，以及从亨利·乔治到皮埃尔-约瑟夫·蒲鲁东等多位学者的思想启发下，开始了一场旅程，旨在为他所称的“自由经济”提供蓝图，这一构想体现在他1916年的著作《自然经济秩序》中。格泽尔认为，囤积货币的能力与用货币购买的商品自然损耗之间存在不平衡，这反过来损害了易腐商品生产者的利益。解决这一问题的办法是引入“自由货币”，即由中央地方当局发行的、具有有限期限和恒定价值的货币。因此，任何长期投资都需要购买债券，而这种现金将打破收取利息或囤积货币的动机。虽然受到乔治主义的影响，但西尔维奥拒绝接受土地价值税可以解决不平等的观点，因为税负会转嫁给租户。相反，在不需像马克思主义者要求的那样颠覆社会关系的情况下，解决上述问题的真正方法是“自由土地”，也就是可以从地方社区或政府竞争性租赁的土地，此前土地已通过债券补偿所有者的方式国有化。作为解放人民的宏伟计划的最后一部分，“自由贸易”将不受任何限制，甚至不受废除的金本位制的约束，并得到国际货币联盟的支持。作为自诩的世界公民，格泽尔所宣扬的、并由三个“自由”支持的愿景将导致形成一个平等属于所有人的统一体，不论种族、性别、地位、资产、宗教、年龄或能力如何。尽管有人指责这位自由经济之父的某些著作描绘了一种浸透着优生学观念的愿景，意图纠正“由金钱和特权引导的错误生育”，或是一种社会达尔文主义，即“最有能力者的经济优势”将占上风，但西尔维奥的支持者们依然孜孜不倦地努力实现一个真正的乌托邦，至少在他们看来是如此。"
 rangga_theory_subtype:0 "朗家理论"
 rangga_theory_subtype_desc:0 "§Y郎家理论§!\n\n£GFX_ideology_rangga_theory_bar\n\n\n\n\n在朝鲜最黑暗的几十年里，当其真实的历史与精神沦于外族日本之手时，申采浩的理论智慧与金元凤的政治军事组织力量，共同转向了过去，转向了郎家。该理论得名于征召贵族青年与精英农民团体，也就是花郎的“古俗”，主张朝鲜半岛上原先的唯一居民、源自满洲渤海国的朝鲜“民族”，必须通过一种特定的精神活动状态实现自身的革命化。这种精神活动植根于自我（A）与非自我（非A）之间永不停息的历史斗争进程。然而，正如《朝鲜革命宣言》所述，不仅要驱逐日本，更需要一位英雄唤醒民众，组织起针对艺术领域与外来儒教中奴性文化思想的全面暴力，消除一切社会不平等，废除经济剥削制度，并斩断特权阶级。唯有如此，在击败日寇、重振高句丽荣光并回归鸭绿江彼岸真正朝鲜故土之后，一个真正民族主义的无政府主义国家方能建立，并永世守护，使其免受任何企图扼杀民族自由或否认其隐秘历史（正如申采浩向民众广泛宣告的那样）之侵害。"
 soclib_occultism_subtype:0 "秘传主义"
 soclib_occultism_subtype_desc:0 "§Y秘传主义§!\n\n£GFX_ideology_occultism_bar\n\n\n\n\n秘传主义是一个宽泛的标签，它指的是把神秘学纳入到政府治理中来的各式政权，它们治国靠的不是什么政治才干，而是晦涩难懂的古代闭门文字和典籍。秘传政权形式多样，影响范围也相当广泛，它们从诺斯替主义和新柏拉图主义中研习治国之道并付诸实践，还经常同激进民族主义运动，如雅利安秘学和德鲁伊教相挂钩。这些政权的缔造者有的来自共济会等自十七世纪流传下来的其它古老教团，也有的出身现代新成立的秘密结社。讽刺的是，上述团体之中有不少是反秘传政权的，他们或认为把隐世知识公之于众有违传统，或相信神秘学与国家相结合只会败坏魔法的实践。尽管有着种种阻力，但包括基督教和现代异教在内的各种宗教中都不乏秘传主义者的身影。秘传主义者相互之间差异虽大，但他们大都智力超群或在精神方面天赋异禀，且对周遭不怎么开明的政权充满了质疑。为大众所熟知的“秘传民族主义”，其最著名的拥趸莫过于将种族贵族精英和大丈夫英雄主义同东西方以佛教和印度教为主的古早精神传统融合了起来的意大利思想家尤利乌斯·埃佛拉。"
 ariokatholizismus_subtype:0 "雅利安天主教"
 ariokatholizismus_subtype_desc:0 "§Y雅利安天主教§!\n\n£GFX_ideology_ariokatholizismus_bar\n\n\n\n\n在巴伐利亚森林的村落中，那里仍传唱着民众的真挚歌谣，激荡着真正以色列的灵魂，那永恒光灵的子民，他们通过雅利安-阿拉姆-阿尔曼-日耳曼的链条，先于基督又继于基督。未曾被商业、被城市那永不停歇的吞噬资本和堕落贵族所败坏，而是通过劳作，也就是那太阳本身的诫命。如此宣告的是弗朗茨·施伦哈默尔-海姆达尔，他融合了奥丁的古老北欧价值、吉多·冯·利斯特与约尔格·兰茨·冯·利本费尔斯的开明教诲，以及天主教的普世真理，以唤醒沉睡中的德意志本质，使其完全显现，施行神圣审判，让所有民族再次成为彼此的兄弟。因为这并非现代产物，而是恢复道德法则、引导低等种族（他们一直被隔绝于其优等雅利安日耳曼人之外）归入天父秩序的永恒历史进程的顶点。然而，若不摧毁敌基督者玛门，即犹太群体在世俗与智识上的显赫地位，这一目标便无法实现。施伦哈默尔视其为与必须到来的“世界审判”根本对立且不相容。基督的背叛者无非代表了盎格鲁-资本主义与世界社会主义的永恒统治，必须在即将到来的荣誉与良知之战中，由日耳曼中央列强在精神上予以消灭。正如海姆达尔在《即将到来的帝国：基于德意志本质的世界秩序蓝图》中所概述，揭示了迫近的启示与最终的全球变革：若无犹太教——现存“基督徒”未能应对其腐蚀者之力——其力量将自行衰朽，从而为宣告“世界和平帝国”铺平道路。觉醒之人的道路将通往无限；世界将被治愈，回归丰裕和平村落中的等级秩序；人类将在太阳法则的指引下繁荣、成长、友爱，从而彰显雅利安原始词语的更高意义。"
