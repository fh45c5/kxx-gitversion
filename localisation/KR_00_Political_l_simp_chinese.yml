 hearstian_democracy_subtype:0 "赫氏民主"
 hearstian_democracy_subtype_desc:0 "§Y赫氏民主§!\n\n£GFX_ideology_hearstian_bar\n\n\n\n\n由异见民主党人、传媒大亨、官能主义记者威廉·伦道夫·赫斯特所拟定的赫氏民主是赫斯特自身及其国家民主党的政治总述。出身富裕议员家庭的赫斯特的竞选之路曾一度与进步运动相挂钩，那时的赫斯特先后在纽约市创办了反坦慕尼市政独占联盟和独立党，在工会成员、移民和老牌政党的帮助下为终结腐败的政治攻讦、施行任人唯贤的改革而东奔西走。虽然公共设施市政所有和精英之治等理念在如今被视作利好成功富人的又一手段，但赫斯特却将其贯彻始终，并带着它们转向了保守主义。美国陷入危机后，赫斯特成立了国家民主党，誓言要打击社会顽疾、药物滥用、违法犯罪、红色威胁，以及最为重量级的“黄祸”。在赫氏民主体制下，有能耐的企业家会被视为社会楷模，享受减税的福利待遇；工会会被国有化，形成一套“美式法团主义”的架构；政治化的联邦警察会不分昼夜地追捕社会主义者、沉迷毒品的外来移民和坑蒙拐骗之徒。此外，赫斯特的举措还包括但不限于受禁酒州失败经历的影响而搞出的酒业全盘国有化、为了加州梦去大兴土木征服自然、建立国家工业局统筹管理薪资和物价、推动阶级合作等。虽说赫氏民主建立在对媒体和国家机器的完全掌控，以及国际孤立之上，但境外的反贼恶匪们也别掉以轻心，赫斯特是不会放过他们的，1898年的美西战争即是前车之鉴。"
 pataut_hearstian_democracy_subtype:0 "赫氏民主"
 pataut_hearstian_democracy_subtype_desc:0 "§Y赫氏民主§!\n\n£GFX_ideology_hearstian_bar\n\n\n\n\n由异见民主党人、传媒大亨、官能主义记者威廉·伦道夫·赫斯特所拟定的赫氏民主是赫斯特自身及其国家民主党的政治总述。出身富裕议员家庭的赫斯特的竞选之路曾一度与进步运动相挂钩，那时的赫斯特先后在纽约市创办了反坦慕尼市政独占联盟和独立党，在工会成员、移民和老牌政党的帮助下为终结腐败的政治攻讦、施行任人唯贤的改革而东奔西走。虽然公共设施市政所有和精英之治等理念在如今被视作利好成功富人的又一手段，但赫斯特却将其贯彻始终，并带着它们转向了保守主义。美国陷入危机后，赫斯特成立了国家民主党，誓言要打击社会顽疾、药物滥用、违法犯罪、红色威胁，以及最为重量级的“黄祸”。在赫氏民主体制下，有能耐的企业家会被视为社会楷模，享受减税的福利待遇；工会会被国有化，形成一套“美式法团主义”的架构；政治化的联邦警察会不分昼夜地追捕社会主义者、沉迷毒品的外来移民和坑蒙拐骗之徒。此外，赫斯特的举措还包括但不限于受禁酒州失败经历的影响而搞出的酒业全盘国有化、为了加州梦去大兴土木征服自然、建立国家工业局统筹管理薪资和物价、推动阶级合作等。虽说赫氏民主建立在对媒体和国家机器的完全掌控，以及国际孤立之上，但境外的反贼恶匪们也别掉以轻心，赫斯特是不会放过他们的，1898年的美西战争即是前车之鉴。"
 syn_radical_progressivism_subtype:0 "激进进步主义"
 syn_radical_progressivism_subtype_desc:0 "§Y激进进步主义§!\n\n£GFX_ideology_radical_progressivism_bar\n\n\n\n\n激进进步主义代表着在其他保守主义或传统主义国家中一系列模糊的左翼和中左翼思想流派，他们通常抵制更广泛的左翼和自由派改革理念。与国外的部分运动相比，这些组织可能不是最激进的，其社会主义或自由主义属性也并不算突出，但与他们所居住国家的现状和民众的态度相比，这些温和的“激进分子”是相对极端的。这些运动推动着一系列不同的从左翼到适度自由或进步的议程，跳出了他们所在国家的主流公众可接受的政治领域，推动着他们自己的“左翼主义”，即使这些理念被其他左翼政权视为自由派甚至是中间派。"
 vardamanism_subtype:0 "瓦达曼主义"
 vardamanism_subtype_desc:0 "§Y瓦达曼主义§!\n\n£GFX_ideology_vardaman_bar\n\n\n\n\n对于绝大多数人来说，美国南方的民粹主义者都是同一类人，他们保守、反动、种族主义，喜好资本主义和贵族做派，但你若是把这番话套在詹姆斯·K·瓦达曼州长身上，那可就是大大低估其理念的复杂性了。密西西比州的“人民议员”瓦达曼承袭了该州“伟大的平凡人”詹姆斯·Z·乔治的传统，发动了唯一一场称得上“社会主义”与民粹主义的群众性运动，一举俘获了众多南方民众的心。瓦达曼反对勒罗伊·珀西，瓦达曼主义也反对南方的上层精英，拥护工会思想，支持禁止童工、改善总体环境的工作法案，提出彻底改革心理健康机构和刑罚制度，倡导建立持有监督与改革职能的统一委员会来促进教育的发展，宣扬把基本人权和禁酒令写入法律之中。瓦达曼出保守文化之淤泥而不染，他捍卫女性的选举权和两性的完全平等，认为白人女性在智力和体力上均优于男性，憎恶福特之流所兜售的反犹思想，以打着爱国主义的幌子攫取政治利益为耻，反对帝国主义，呼吁世界自由。瓦达曼虽坚持人人都有接受公正审判的权利，但他同时也有个绰号——“白人大首长”，因为他坚决维护吉姆·克劳法，愿为了“白人至上的目标而处决掉每一名黑人”，还称赋予黑人这种下等生物以选举权就是一个彻头彻尾的错误。瓦达曼思想上的这种反差从其同时崇拜杰斐逊·戴维斯和亚伯拉罕·林肯便可见一斑，而那些组织了瓦达曼俱乐部，并且视其为救主，研读其作品，追随其目标的“红脖子”们则只能忿忿不平地接受这一现实。"
 pataut_occultism_subtype:0 "秘传主义"
 pataut_occultism_subtype_desc:0 "§Y秘传主义§!\n\n£GFX_ideology_occultism_bar\n\n\n\n\n秘传主义是一个宽泛的标签，它指的是把神秘学纳入到政府治理中来的各式政权，它们治国靠的不是什么政治才干，而是晦涩难懂的古代闭门文字和典籍。秘传政权形式多样，影响范围也相当广泛，它们从诺斯替主义和新柏拉图主义中研习治国之道并付诸实践，还经常同激进民族主义运动，如雅利安秘学和德鲁伊教相挂钩。这些政权的缔造者有的来自共济会等自十七世纪流传下来的其它古老教团，也有的出身现代新成立的秘密结社。讽刺的是，上述团体之中有不少是反秘传政权的，他们或认为把隐世知识公之于众有违传统，或相信神秘学与国家相结合只会败坏魔法的实践。尽管有着种种阻力，但包括基督教和现代异教在内的各种宗教中都不乏秘传主义者的身影。秘传主义者相互之间差异虽大，但他们大都智力超群或在精神方面天赋异禀，且对周遭不怎么开明的政权充满了质疑。为大众所熟知的“秘传民族主义”，其最著名的拥趸莫过于将种族贵族精英和大丈夫英雄主义同东西方以佛教和印度教为主的古早精神传统融合了起来的意大利思想家尤利乌斯·埃佛拉。"
 pataut_volkism_subtype:0 "人民主义"
 pataut_volkism_subtype_desc:0 "§Y人民主义§!\n\n£GFX_ideology_valkism_bar\n\n\n\n\n人民主义是一种松散的日耳曼极端民族主义思想流派，其致力于追求种族纯洁、民族团结、军事强权，以及时有时无的虔诚信仰，在诸如全德意志联盟、日耳曼教团、防卫之狼联盟等组织以及各种程度的青年保守运动成员间都可瞥见其身影。虽然其实中也有无神论者以及罕见的异教信仰者，但大部分人民主义团体都是北欧主义或新马西昂派的信徒，并且极其重视祖先传承下来的传统，崇尚民族与国家的“血与土”。在经济领域，人民主义运动多以法团主义、农业主义为纲领，不过即使是无政府主义者之中也不乏人民主义的拥趸。抛开上述差异不谈，人民主义仍是那些因认为德国忘记了其所代表的人民，陷入了现代化的衰落窠臼之中而对现实感到幻灭的极右翼日耳曼人眼中的一束辉光。"
 elective_monarchy_subtype:0 "选举君主制"
 elective_monarchy_subtype_desc:0 "§Y选举君主制§!\n\n£GFX_ideology_elective_monarchy_bar\n\n\n\n\n选举君主制与其说是一种意识形态，不如说是一种特定的治理体系，甚至于是君主政体对君权的一次圣化。选举君主制的基本原则是，君主之所以能登上王位，靠的不是所谓主的恩典，而是同在本国国内、具有影响力的阶级与贵族达成的协议。神圣罗马帝国是选举君主制的最完美例子，各式各样的封建王国组成的庞大网络一次又一次地选举了哈布斯堡家族，令其垄断了皇帝之位，另一端则是波兰立陶宛联邦，国王实际上是大贵族阶级的附属之物，他们不仅拥有大片土地，对下层贵族的影响亦不可忽视。世界各地的选举君主制在运行方式上的内在差异通过这两个例子便表现得淋漓尽致，对一些国家来说，君主的存在不过是为了装点门面与王朝传承，所谓选帝侯的存在也让君主制度在某种程度上少了些“专制”色彩，在另一些国家，被任命为王的君主不过是幕后大佬可以随心所欲地操控的台前傀儡。还有一种不太常见，但颇值得玩味的潮流是，先前存在着的政府创立了某种“王冠共和国”并向其转型，君主仍由参政各阶级选出，其职责权力亦与总统总理无异，不过是多了一层王室礼仪罢了。"
 soclib_utopian_technocracy_subtype:0 "乌托邦技官主义"
 soclib_utopian_technocracy_subtype_desc:0 "§Y乌托邦技官主义§!\n\n£GFX_ideology_utopian_technocracy_bar\n\n\n\n\n乌托邦技官主义是传统技官主义的一个分支，正如技官公司及传统技官主义描述的那样，他们提倡建立与传统技官主义类似的政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。此外他们还支持美学革命，并推动艺术家、哲学家、作家及其他创造性思想家加入这一半寡头平台。而且，这些乌托邦主义技官们还抛弃了同时代其他技官的专制做派，转而大量借鉴索斯坦·维尔本和其他乌托邦平等主义者的思想，比如爱德华·贝拉米、罗伯特·欧文、诺曼·莱蒙德、夏尔·傅立叶和亨利·大卫·梭罗，并试图建立起受保护的民主合作委员会，在技术专家的指导下，所有人都以社区主义的方式拥有平等的发言权，共同迈向平等的天堂。总体而言，乌托邦技官主义试图突破传统政治模式的限制，将人类引向一个开明、艺术、人道、和平、改革和美学的紫色乌托邦。"
 radsoc_paneuropeanism_subtype:0 "左翼泛欧主义"
 radsoc_paneuropeanism_subtype_desc:0 "§Y左翼泛欧主义§!\n\n£GFX_ideology_left_paneuropeanism_bar\n\n\n\n\n左翼泛欧主义将泛欧思想中的民族主义与反动要素拎了出来，并将其融入了社会主义思想之中。左翼泛欧主义是与非民族主义的托洛茨基主义相对立的流派之一，它将左翼大团结和全球主义（或者说国际主义）的定义缩小到欧洲中心的方向之上，致力于将西方世界的心脏团结在带有民族主义与文化例外论色彩的鲜红旗帜之下。泛欧思想中的“民族主义”一面表现在拔高欧洲某一或者某些特定的文化的地位，或者直接将全部文化融合为一个海纳百川的整体，而不同群体又推崇着不同的文化民族主义、公民民族主义、种族民族主义等各式认同，这就导致“民族主义”可以无限细分。虽然不同的左翼泛欧主义者在将欧洲统一在何种社会主义形态之下这一点有着不同的见解，从共产主义、工团主义到社会民族主义、民主社会主义都各有各的受众，但有一点是所有的泛欧主义者都一致认同的，那就是只有在社会主义庇荫之下的欧洲，才能在即将到来的风暴中延续文明的火种。"
 soccon_occultism_subtype:0 "秘传主义"
 soccon_occultism_subtype_desc:0 "§Y秘传主义§!\n\n£GFX_ideology_occultism_bar\n\n\n\n\n秘传主义是一个宽泛的标签，它指的是把神秘学纳入到政府治理中来的各式政权，它们治国靠的不是什么政治才干，而是晦涩难懂的古代闭门文字和典籍。秘传政权形式多样，影响范围也相当广泛，它们从诺斯替主义和新柏拉图主义中研习治国之道并付诸实践，还经常同激进民族主义运动，如雅利安秘学和德鲁伊教相挂钩。这些政权的缔造者有的来自共济会等自十七世纪流传下来的其它古老教团，也有的出身现代新成立的秘密结社。讽刺的是，上述团体之中有不少是反秘传政权的，他们或认为把隐世知识公之于众有违传统，或相信神秘学与国家相结合只会败坏魔法的实践。尽管有着种种阻力，但包括基督教和现代异教在内的各种宗教中都不乏秘传主义者的身影。秘传主义者相互之间差异虽大，但他们大都智力超群或在精神方面天赋异禀，且对周遭不怎么开明的政权充满了质疑。为大众所熟知的“秘传民族主义”，其最著名的拥趸莫过于将种族贵族精英和大丈夫英雄主义同东西方以佛教和印度教为主的古早精神传统融合了起来的意大利思想家尤利乌斯·埃佛拉。"
 soccon_theosophy_subtype:0 "神智学"
 soccon_theosophy_subtype_desc:0 "§Y神智学§!\n\n£GFX_ideology_theosophy_bar\n\n\n\n\n1875年，著名神秘论者海莲娜·布拉瓦茨基夫人在美国神秘学家亨利·奥尔科特和威廉·康·贾奇的帮助下在纽约市成立了神智学会，而神智学也由此来到了世上。神智学是一种诞生于美国的新宗教运动，它构成了现代西方密教的基础，同时也在全球范围内广泛传播，成为了这颗星球上最受欢迎的另类精神学之一，而这又反向助力它从一场纯粹的边缘哲学运动演变成了一种政治现象。尽管有人称其为宗教，但它的领导者们，如创始者布拉瓦茨基，严词拒绝这一标签，声称神智学已经超越了人类那分裂的宗教，成为了唯一的精神、自然和哲学真理。神智学将神秘学、西方密教、新柏拉图主义等古老欧洲哲学，与印度教和佛教等东方宗教融合在一起，声称有那么一批古老且隐秘于世，遍布世界各地，但以西藏为中心的超凡存在，圣贤。圣贤从古至今传授了无数的智慧和超自然力量（如千里眼、星体投射、心灵感应和漂浮），而现在，他们通过自己选中的喉舌，如布拉瓦茨基夫人，要将教义传播到更广阔的世界。据信，圣贤正试图复兴一种早已失传，超越当今世上一切信仰的古老宗教，来将人类的精神团结在所谓的全能神“绝对”之下，而在他们的宇宙观中，所有的存在都被视为宏大之物的流出。神智学家致力于实现这种全球性的精神启蒙和团结，试图将自己的哲学传播给所有听众，遵从素食主义和和平主义的指导方针，过着苦行僧般的深奥生活，寻求在追求智慧和启蒙的同时获得圣贤们近乎神明的地位。然而，神智学的独特之处在于，它不要求成员必须达成一致的官方信仰，完全避开了教条的概念，于是这种融合思想变的高度多样，迅速传播到从萨尔瓦多和新英格兰到尼泊尔和俄罗斯的遥远地区，尤其风靡于印度和美国本土。神智学家为推动其真理而建立的政治和社会经济体系可能大不相同，但他们都坚信，“绝对”之下，必有光明。"
 authdem_occultism_subtype:0 "秘传主义"
 authdem_occultism_subtype_desc:0 "§Y秘传主义§!\n\n£GFX_ideology_occultism_bar\n\n\n\n\n秘传主义是一个宽泛的标签，它指的是把神秘学纳入到政府治理中来的各式政权，它们治国靠的不是什么政治才干，而是晦涩难懂的古代闭门文字和典籍。秘传政权形式多样，影响范围也相当广泛，它们从诺斯替主义和新柏拉图主义中研习治国之道并付诸实践，还经常同激进民族主义运动，如雅利安秘学和德鲁伊教相挂钩。这些政权的缔造者有的来自共济会等自十七世纪流传下来的其它古老教团，也有的出身现代新成立的秘密结社。讽刺的是，上述团体之中有不少是反秘传政权的，他们或认为把隐世知识公之于众有违传统，或相信神秘学与国家相结合只会败坏魔法的实践。尽管有着种种阻力，但包括基督教和现代异教在内的各种宗教中都不乏秘传主义者的身影。秘传主义者相互之间差异虽大，但他们大都智力超群或在精神方面天赋异禀，且对周遭不怎么开明的政权充满了质疑。为大众所熟知的“秘传民族主义”，其最著名的拥趸莫过于将种族贵族精英和大丈夫英雄主义同东西方以佛教和印度教为主的古早精神传统融合了起来的意大利思想家尤利乌斯·埃佛拉。"
 tot_kleptocracy_subtype:0 "强盗政府"
 tot_kleptocracy_subtype_desc:0 "§Y强盗政府§!\n\n£GFX_ideology_kleptocrat_bar\n\n\n\n\n强盗政府描述的是一个通过公开的或隐秘的渠道，围绕贪污腐败建立起来的政府——亦或者，根本就不存在政府。与其说它是一种明确的意识形态，不如说它是许多独裁专制政权的天然属性。纯粹的强盗政府回避意识形态，或者只是打着意识形态的幌子随心所欲，不择手段地追求实现统治集团的贪婪野心。逐利、奢侈、腐败、漠视道德、享乐主义等都是强盗政府共通的属性，尽管每个强盗政府实现其目标的方法和表现出来的形象可能会大相径庭。"
 socdem_bahai_universalism_subtype:0 "巴哈伊普世主义"
 socdem_bahai_universalism_subtype_desc:0 "§Y巴哈伊普世主义§!\n\n£GFX_ideology_bahai_bar\n\n\n\n\n巴哈伊普世主义是对于融合了巴哈伊教、早期巴孛教信条，以及两教教主巴哈欧拉、巴孛教诲的社会主义思想的非正式称呼。作为一种源自巴哈伊灵性论的思想理论，巴哈伊普世主义最为重要的一点就是“神明显身”的概念，即神明会依据既定顺序通过宗教先知，例如耶稣、穆罕默德、佛陀，显身于人类面前，帮助人类及其灵魂实现启蒙、达到乌托邦、经历后变，最终在传统家庭价值观、女权主义、教育改革、忠贞观念之上建立起以自我奋斗和为人类而服务为主旨，抛却诸如隐修主义、重商主义、苦行主义之类的信仰优越论和社会怠惰，在超越了种族、性别、民族、文化等肤浅差异的同时，又注重保护自然环境，为全部生灵带来平等乐园的人类大同新秩序。巴哈伊普世主义将上述精神层面的教义进一步融合入了柔性、非教条式、不以意识形态加以限制的社会主义进步改革之中，集各家左翼思想之众长，意图打造出一个人人都能自行决定是否要遵从社会主义之道的非独裁式公有制社会。由于巴哈伊教所述的都是精神、道德层面的东西，其并没有对经济领域做出明确规定，也没有对社会所面临的经济问题给出一套标准答案，所以巴哈伊普世主义提倡经济自决，允许各公社、社区根据实际情况灵活确立经济政策。虽然巴哈伊普世主义极其关注地方治理的内部运作，且坚持在不违反基本原则的前提下尽可能地下放权力，但其实这一思想也同样热衷于国际主义，它幻想全世界在自己的和平理念中组成共同的联邦，联邦由各个自治下属行政单位组成，每个单位全权负责治下社会的方方面面，如货币（或者也可以选择废除货币）、规章制度、福利体系等。无政府主义者、乔治主义者、世界语活动家小詹姆斯·费迪南德·莫顿是巴哈伊普世主义的举旗手，而莫顿本身复杂的背景也为巴哈伊普世主义注入了如他一类的践行者的影响。总得来说，巴哈伊普世主义将世界的爱与和平放在了首位，并且相信在巴哈欧拉的人世仆役的引领下，其所设想的全人类的精神启蒙和平等乌托邦终会降临于世。"
 gandhism_subtype:0 "甘地主义"
 gandhism_subtype_desc:0 "§Y甘地主义§!\n\n£GFX_ideology_gandhi_bar\n\n\n\n\n甘地主义是对莫罕达斯·卡拉姆昌德·甘地思想、理念及毕生心血结晶的非正式称呼，不过圣雄本人以及对这一思想体系做出过重大贡献的同时代人，如普什图人的“边地甘地”阿卜杜勒·加法尔汗，从未使用过“甘地主义”一词。甘地主义以“悟力”为基础，“悟力”字面意思为“坚持真理”，是印度独立运动中的一种特殊思想形式，主张非暴力、民间抵抗。甘地主义者会以和平的方式抗议行恶的政府、政策，不诉诸流血暴力而以间接方式推动进步改革和社会变革，不到万不得已就不会使用自卫手段——不过，关于这一自卫规定其实也充斥着争议，甘地的许多弟子就坚持彻底的非暴力、不杀生。此外，甘地主义还倡导平等的宗教团结，尤其是因对立、仇恨而戕害这片土地达百年之久的印度教徒和穆斯林之间的团结（值得一提的是，甘地本人是从印度教角度出发，从禁欲思想中创造出这一理念的，而其好友加法尔汗则是以穆斯林的角度，从普什图族法典中得出的），以及非暴力的爱国主义、民族主义思想，还有人权与自由、斋戒与素食等。经济上，甘地主义推崇简朴生活、自给自足、以重视国民物质需求先于财富和工业化的农业为主的进口替代，以及从亨利·大卫·梭罗、列夫·托尔斯泰等社会主义思想家那儿借鉴来的乌托邦无政府主义、和平进步主义理念。虽然其“缔造者”有意回避甘地主义一词，甘地本人和“边地甘地”也不认可其为一种意识形态，但甘地主义还是对南亚内外的政治、文化和精神产生了重大影响，遍布全球的甘地主义者也在用除自卫外坚决不实施暴力的和平手段表达着自己的诉求。"
 socdem_gandhism_subtype:0 "甘地主义"
