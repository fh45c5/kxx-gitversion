 tot_negritude_subtype:0 "黑人集体意识"
 tot_negritude_subtype_desc:0 "§Y黑人集体意识§!\n\n£GFX_ideology_negritude_bar\n\n\n\n\n黑人集体意识原是散居世界各地的黑人法语知识分子们提出的一种文学理论批判框架，而后发展成了一种独特的左翼泛非主义形式，不过，其支持者提倡的多是简单的泛非合作，并非真正的政治联盟。黑人集体意识最早由马提尼克的姐妹花作家波莱特·纳达尔和让娜·纳达尔提出，后在马提尼克诗人艾梅·塞泽尔、塞内加尔思想家阿卜杜拉耶·萨吉和利奥波德·塞达尔·桑戈尔、法属圭亚那的莱昂·达马斯，以及吉尔贝·格拉蒂昂、莱昂纳尔·桑维尔、路易·T·阿希尔、阿里斯蒂德·莫热等人的帮助下传播开来。黑人集体意识以合作为核心，它反对殖民主义、种族主义、帝国主义、厚此薄彼、欧洲中心论，提倡在法非关系持久化的大背景下推动焕然一新的独立非洲文化，撕下非洲文明所背负的污名，提高全世界非裔人口的地位，并在平等的基础之上开展合作交流。黑人集体意识以黑人激进传统中的马克思主义政治理论为基础，不过，在第三国际和海外各色社会主义者的意识形态对非洲大陆的不断影响之下，尤其是在作为黑人集体意识运动支柱的非洲超现实主义艺术吸收了欧洲的超现实主义、未来主义概念之后，社会民主主义、工团主义、国家工团主义，甚至是更加极端的左翼分支等非马克思的社会主义思想也变得越来越常见。黑人集体意识与其同类，如海地的黑人至上主义、黑人土著主义、克里奥尔骄傲精神，以及纽约市和美国黑带的非裔加勒比美国人提出的“黑就是美”的理念等，共同构成了法语非洲的主流思想，它反对非洲文化的同化以及非洲文明低人一等的说法，致力于将整个法语非洲地区带向康庄大道，使其作为一个整体（或者至少以合作的方式）同世界的其它势力平起平坐，让身为黑人这件事本身成为一件值得自豪的事情。"
 tot_noirism_subtype:0 "黑人至上主义"
 tot_noirism_subtype_desc:0 "§Y黑人至上主义§!\n\n£GFX_ideology_noirism_bar\n\n\n\n\n黑人至上主义是一种在海地意识形态圈子里很是常见的独特意识形态，其目的在于呼吁遭受白种人和混血种精英数世纪压迫的非裔海地人夺得国家的主导地位。黑人至上主义深受法属非洲和法属加勒比的黑人集体意识运动的启发，也与其紧密相连，只是以海地为中心。它认为，美法两国的殖民主义，加上混血种精英统治阶级对占人口主流的克里奥尔人和非裔海地人的长期统治，已成为海地社会的顽疾癌症。只有通过非洲中心主义的文化复兴，海地才能摆脱欧洲中心主义导致的停滞和克里奥尔文化的衰退。在海地意识形态圈子中，包括从卡尔·布鲁瓦尔这样的右翼民族主义者，到让·普莱斯-马尔斯这类温和民主派，乃至于雅克·鲁曼与约瑟夫·若利布瓦这样的左翼工团主义者，都在捍卫黑人至上主义，这些支持者们构想的具体社会与经济政策可能大不相同，但都致力于提升非裔海地人的地位，复兴以巫毒教为基础的克里奥尔文化。"
