 gustavianism_subtype:0 "古斯塔夫主义"
 gustavianism_subtype_desc:0 "§Y古斯塔夫主义§!\n\n£GFX_ideology_gustavianism_bar\n\n\n\n\n古斯塔夫主义可概括为现代瑞典版的开明君主制，同时致力于民族文化复兴运动。这一思想体系诠释了古斯塔夫三世国王的政策理念，其核心在于推行有利于中产阶级的政策，遏制上层阶级中的激进势力，并将工人阶级视为需要抵御外来政治风潮的保护对象。秉承古斯塔夫时代的精神，该主义主张重振民族文化与民族特质，大力扶持艺术娱乐事业，并倡导瑞典的海外冒险精神。值得注意的是，虽然古斯塔夫主义以瑞典为本位，但对芬兰同样怀有浪漫主义情怀，其不仅视其为兄弟之邦，更认为这片土地是一个多世纪前被宿敌俄罗斯从瑞典窃取的重要疆域。在绝对王权的理念下（无论其化身是君主还是国家实体），古斯塔夫主义者强调王权在社会中的广泛职能，主张国家应承担医院、学校等重要公共设施的建设。与其精神领袖古斯塔夫三世一脉相承，现代追随者们坚信海外扩张之路，期盼瑞典能在未来的动荡时局中攫取属于自己的全球利益版图。"
 pataut_gustavianism_subtype:0 "古斯塔夫主义"
