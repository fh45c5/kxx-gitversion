 marlib_flemish_nationalism_subtype:0 "佛莱芒民族主义"
 marlib_flemish_nationalism_subtype_desc:0 "§Y佛莱芒民族主义§!\n\n£GFX_ideology_flemish_nationalism_bar\n\n\n\n\n佛莱芒民族主义，有时也被称为佛莱芒运动，主要指活跃在佛兰德的右翼政党的意识形态。佛莱芒文化受到了各路政治立场的钟爱，而佛莱芒民族主义和各种激进民族主义党派（如斯塔夫·德·克莱尔的佛莱芒民族协会）间的关系也变得越发亲密。在大多数情况下，这些群体在社会方面较为保守，坚持极端反共和仇外的立场，并在经济方面信奉法团主义。不过，这其中亦有温和派别，他们更加注重民主制度，吸纳了教会的社会教导乃至温和左翼主张，亨德里克·博尔希农的佛莱芒前线便是其代表。佛莱芒民族主义者的核心诉求是建立一个囊括整个佛兰德的独立国家。由于不利的条件，佛莱芒民族主义运动中的小部分人可能只寻求在统一的佛兰德-瓦隆国内实现自治，而其中绝大多数人梦想着与荷兰实现统一，从而建立大荷兰甚至是泛荷兰。"
 authdem_flemish_nationalism_subtype:0 "佛莱芒民族主义"
 authdem_flemish_nationalism_subtype_desc:0 "§Y佛莱芒民族主义§!\n\n£GFX_ideology_flemish_nationalism_bar\n\n\n\n\n佛莱芒民族主义，有时也被称为佛莱芒运动，主要指活跃在佛兰德的右翼政党的意识形态。佛莱芒文化受到了各路政治立场的钟爱，而佛莱芒民族主义和各种激进民族主义党派（如斯塔夫·德·克莱尔的佛莱芒民族协会）间的关系也变得越发亲密。在大多数情况下，这些群体在社会方面较为保守，坚持极端反共和仇外的立场，并在经济方面信奉法团主义。不过，这其中亦有温和派别，他们更加注重民主制度，吸纳了教会的社会教导乃至温和左翼主张，亨德里克·博尔希农的佛莱芒前线便是其代表。佛莱芒民族主义者的核心诉求是建立一个囊括整个佛兰德的独立国家。由于不利的条件，佛莱芒民族主义运动中的小部分人可能只寻求在统一的佛兰德-瓦隆国内实现自治，而其中绝大多数人梦想着与荷兰实现统一，从而建立大荷兰甚至是泛荷兰。"
 apartheid_socialism_subtype:0 "隔离社会主义"
 apartheid_socialism_subtype_desc:0 "§Y隔离社会主义§!\n\n£GFX_ideology_apartheid_socialism_bar\n\n\n\n\n隔离社会主义与其说是一种具体意识形态，不如说是对南非各类始终以维持白人工人阶级的优越地位为核心的劳工运动的概述。该主张从南非工党、国际社会主义联盟乃至工商业工人联盟的不同派系中汲取支持力量，其拥护者坚决反对南非注定成为“黑人共和国”的预言。与某些人的设想相反，非白人无产阶级并不具备充分的革命潜力，只有维持种族隔离，才能真正实现社会主义变革。尽管被贴上“隔离社会主义”标签的政客中，相当一部分只关心改善欧裔底层民众的处境——其余族群只需以“隔离但平等”政策加以约束——但某些派系却愿意与阿非利卡人及国民党合流，推行更严酷的种族隔离政策。这种对无产阶级整体利益与种族问题的模糊界定，使得外界观察家常将威廉·亨利·安德鲁斯、托马斯·博伊德尔等政客称作“布尔民族主义者”——尽管他们实际上都出身于不列颠本土。"
 socdem_apartheid_socialism_subtype:0 "隔离社会主义"
 socdem_apartheid_socialism_subtype_desc:0 "§Y隔离社会主义§!\n\n£GFX_ideology_apartheid_socialism_bar\n\n\n\n\n隔离社会主义与其说是一种具体意识形态，不如说是对南非各类始终以维持白人工人阶级的优越地位为核心的劳工运动的概述。该主张从南非工党、国际社会主义联盟乃至工商业工人联盟的不同派系中汲取支持力量，其拥护者坚决反对南非注定成为“黑人共和国”的预言。与某些人的设想相反，非白人无产阶级并不具备充分的革命潜力，只有维持种族隔离，才能真正实现社会主义变革。尽管被贴上“隔离社会主义”标签的政客中，相当一部分只关心改善欧裔底层民众的处境——其余族群只需以“隔离但平等”政策加以约束——但某些派系却愿意与阿非利卡人及国民党合流，推行更严酷的种族隔离政策。这种对无产阶级整体利益与种族问题的模糊界定，使得外界观察家常将威廉·亨利·安德鲁斯、托马斯·博伊德尔等政客称作“布尔民族主义者”——尽管他们实际上都出身于不列颠本土。"
 saavedrista_republicanism_subtype:0 "萨韦德拉共和主义"
 saavedrista_republicanism_subtype_desc:0 "§Y萨韦德拉共和主义§!\n\n£GFX_ideology_saavedrista_republicanism_bar\n\n\n\n\n作为玻利维亚“最平民化的共和主义”幕后推手政治运作的终极形态，社会主义共和党的意识形态完全围绕包蒂斯塔·萨韦德拉·马列亚量身定制。从作为脱离自由党的共和党知识精英起步，萨韦德拉逐步构建出一套“左翼”民粹主义学说，旨在维护国家稳定同时打击传统政治光谱外的激进势力。萨韦德拉共和主义立足于改革主义与威权主义两大支柱，其根基始终深植于这位考迪罗领袖的民众威望之中。尽管社会主义共和党推动了许多惠及中产阶级和工人阶级的法案，如八小时工作制、罢工权、妇女儿童劳动保护、禁酒令、强制储蓄以及代表矿工、铁路工人和教师的工人联合会，但若将其誉为革命劳工的捍卫者则未免过誉。正如包蒂斯塔动用“司法修正主义”和共和国民兵镇压政敌那般，他同样不会容忍任何妨碍玻利维亚、智利和美国商业伙伴经营矿业、银行等核心产业的行为。在跨国资本集团和新兴中产阶级的支持下，矿工与原住民的组织化尝试都将遭遇血腥镇压。后者尤其被萨韦德拉视为眼中钉，其著作中大量抨击印第安传统“艾柳”社区治理体系的落后性与无效性。这位昔日的自由主义社会学家已与初入政坛时判若两人，曾将斯宾塞实证主义引入玻利维亚的包蒂斯塔·萨韦德拉·马列亚，如今却对这失败的理论幻想破灭，陷入虚无。但社会主义共和党的信徒们仍怀抱最后希望：终有一日，将有种族救赎玻利维亚，取代此前所有失败的族群实验——无论白人、混血儿还是印第安人。"
 pataut_police_state_subtype:0 "警察国家"
 pataut_police_state_subtype_desc:0 "§Y警察国家§!\n\n£GFX_ideology_police_state_bar\n\n\n\n\n从戒严令和宵禁到严厉镇压和合法专制，尽管形式多种多样，但警察国家的主要支柱总是一成不变。警察国家可能是政治性的或非政治性的，专业性的或非专业性的，腐败的或仁慈的，形成的根源与所处的条件不同，具体情况也会千差万别。尽管这种意识形态的表现多种多样，但其出发点都在于防止社会不受约束，陷入混乱。警察国家与军政府类似，但通常不会那么军国主义和帝国主义，而是把给人民带来秩序视为高于一切其他追求，往往在法律条文的支持下，他们可以正当合法地实现自己的追求。"
 socialist_falange_subtype:0 "长枪党社会主义"
 socialist_falange_subtype_desc:0 "§Y长枪党社会主义§!\n\n£GFX_ideology_socialist_falange_bar\n\n\n\n\n作为玻利维亚极右翼民族主义阵营中最突出的力量，玻利维亚社会主义长枪党本应遵循全球类似运动的标准教条，但推崇武力的爱国者之子奥斯卡·温萨加·德拉维加，其思想却构成了意识形态的奇观。该党呼吁建立新玻利维亚国家，宣称“诞生于战败祖国之道德阵痛”，以大学生支部为核心力量的这场运动，既被视为对逆境的挑战，亦被看作对玻利维亚生存与辉煌命运之坚定信仰的宣誓。为挑战国内存在的寡头社会政治秩序，长枪党致力于按照其视为国家天主教身份终极实现的方式改革社会——建立由教会与以贝尔纳迪诺·毕尔巴鄂·里奥哈将军为代表的军方共同支持的一党制国家。然而温萨加构想的“基督教民主”融合了拉美乃至全球类似运动都鲜见的多元要素：除了常见的反自由主义、反马克思主义、国家主义与民族主义之外，长枪党的社会正义观主动将革命工团主义与工会组织的支持纳入其理论体系。通过社会民族主义革命，玻利维亚社会面貌将被重塑，那些遭现有权力体系排斥的群体，尤其是遭受重大苦难，深刻理解反帝斗争重要性的安第斯原住民，都将融入重获新生的祖国。"
 natpop_vapsism_subtype:0 "瓦普斯主义"
 natpop_vapsism_subtype_desc:0 "§Y瓦普斯主义§!\n\n£GFX_ideology_vapsism_bar\n\n\n\n\n瓦普斯主义溯源自爱沙尼亚独立战争退伍军人与“自由斗士”之集会，起初仅为纯粹的退伍军人团体，旨在争取经济援助，改善生活境遇。随着时间的推移，各种零星组织在阿尔图尔·西尔克与安德烈斯·拉尔卡的领导下汇聚一堂，瓦普斯运动自此迈入了新的阶段，开始明确呼吁建立起真正的民族国家——此一国家奠基于战壕前线淬炼出的普遍价值观，不靠分裂爱国者立足，推行极端公民民族主义。西尔克宣称：唯获人民共识方可实现此愿景，故号召公民主动引领国家转型为民主威权混合型的总统制共和国，重分波罗的德意志贵族的地产，消弭阶级分化、民族沙文主义及意识形态党争，建立起自给之国。爱沙尼亚乌托邦虽仍遥不可及，然沙场宿将皆矢志必成其愿。"
 socialismo_militar_subtype:0 "军事社会主义"
 socialismo_militar_subtype_desc:0 "§Y军事社会主义§!\n\n£GFX_ideology_socialismo_militar_bar\n\n\n\n\n军事社会主义的诞生，源于玻利维亚自由主义建制派在查科战争中的惨败，以及一群怀抱理想的年轻军官——他们代表着原本超然于政治之外的军队——实现祖国“民族复兴”的渴望。这支由退伍军团领袖赫尔曼·布施·贝塞拉中校领导，却邀请大卫·托罗上校共同组织的年轻军人群体，宣告新革命运动将致力于确立“国家社会主义”制度。这些经历过查科战争洗礼的军人们缔造了军方、左翼政党与工会的三方联盟来引领国家未来。这个联盟的广泛性超乎预期：从温和社会主义者、共产党人、托洛茨基主义者乃至某些极右翼“社会主义者”都被囊括其中；而通过与玻利维亚工联总会达成协议并设立由瓦尔·阿尔瓦雷斯领导的劳工部，工人运动更获壮大。植根于自由放任主义有限政府理念的旧宪法将被全新的“社会性”宪法取代，新宪法将确立国家保障公民福祉的积极职能、财产所有权的社会功能以及各阶级种族平等原则。除规范劳动合同、职业安全、带薪休假、事故赔偿、集体谈判、社会保障和强制工会化等急需改革外，“军事社会主义”的两大核心工程聚焦石油矿业与议会改革。像背信弃义的的标准石油公司这类掠夺玻利维亚自然资源的外国企业，其资产将被国有化，进而以此组建国家控股的玻利维亚国家石油公司。本土锡矿大王及其他矿业巨头必须上缴外汇收入才能获得矿产出口许可，任何破坏生产、停工怠工行为都将被视为叛国罪并遭武力镇压。国家治理方面遵循胡利奥·比埃拉中校的方案，效法欧洲兴起的法团主义，配合强制工会化政策重组政府职能，新成立的法团机构与选举政党各占议会半数席位。虽然他们计划通过组建文官政党来巩固改革成果，但布施等军官们早已做好准备：一旦左翼激进分子或贪婪寡头及其政治傀儡威胁到革命成果，这些习惯军队严格纪律的军人将毫不犹豫地继续执掌政权，直到玻利维亚完成彻底的道德净化。"
 pataut_trujillato_subtype:0 "特鲁希略主义"
 pataut_trujillato_subtype_desc:0 "§Y特鲁希略主义§!\n\n£GFX_ideology_trujillato_bar\n\n\n\n\n世人常道绝对权力导致腐败，但若追逐统治本就是其初心呢？特鲁希略主义这个专有名词，正是为描述多米尼加共和国政治暗箱与军事强权的主宰者，拉斐尔·莱昂尼达斯·特鲁希略·莫利纳的统治手段而生。起初虽与拉斐尔·埃斯特雷利亚·乌雷尼亚等政客合纵连横，但特鲁希略的终极目标始终是将国家打造成私人封邑。为此他创立多米尼加党，其“正直（代表拉斐尔）、自由（代表莱昂尼达斯）、劳动（代表特鲁希略）、道德（代表莫利纳）”的党训，更是赤裸裸地宣扬对“领袖”的个人崇拜。该党强制要求全体国民必备“三证”——身份证、义务兵役证和印着棕榈标志的党员证。尽管打着复兴共和民主制度的旗号，但所有反对者非死即逃，军民皆被轮番施恩的扈从体系与军事情报局制造的恐怖氛围所禁锢。那些表面光鲜的改革——清偿外债、推进工业化、亲近教会、重建首都乃至环境保护——无一不是为了中饱特鲁希略家族的私囊：企业安插亲信，森林砍伐权由“领袖”特许，政府中枢改建为特鲁希略城，天主教更沦为政权背书工具。随着边境“多米尼加化”进程推进（屠杀海地少数民族、肃清社会主义势力），在借日本移民、犹太人和欧洲白种移民扩充税基的背景下，在“祖国恩人年”庆典中震耳欲聋的“特鲁希略万岁！”呼声之中，人民终将明白谁高踞众生之上。当每户家庭被迫悬挂“本户尊特鲁希略为国徽”的标语时，人们会意识到“神于天，特鲁希略于地”，或许有朝一日，这位僭主连天主都要凌驾。"
 trujillato_subtype:0 "特鲁希略主义"
 trujillato_subtype_desc:0 "§Y特鲁希略主义§!\n\n£GFX_ideology_trujillato_bar\n\n\n\n\n世人常道绝对权力导致腐败，但若追逐统治本就是其初心呢？特鲁希略主义这个专有名词，正是为描述多米尼加共和国政治暗箱与军事强权的主宰者，拉斐尔·莱昂尼达斯·特鲁希略·莫利纳的统治手段而生。起初虽与拉斐尔·埃斯特雷利亚·乌雷尼亚等政客合纵连横，但特鲁希略的终极目标始终是将国家打造成私人封邑。为此他创立多米尼加党，其“正直（代表拉斐尔）、自由（代表莱昂尼达斯）、劳动（代表特鲁希略）、道德（代表莫利纳）”的党训，更是赤裸裸地宣扬对“领袖”的个人崇拜。该党强制要求全体国民必备“三证”——身份证、义务兵役证和印着棕榈标志的党员证。尽管打着复兴共和民主制度的旗号，但所有反对者非死即逃，军民皆被轮番施恩的扈从体系与军事情报局制造的恐怖氛围所禁锢。那些表面光鲜的改革——清偿外债、推进工业化、亲近教会、重建首都乃至环境保护——无一不是为了中饱特鲁希略家族的私囊：企业安插亲信，森林砍伐权由“领袖”特许，政府中枢改建为特鲁希略城，天主教更沦为政权背书工具。随着边境“多米尼加化”进程推进（屠杀海地少数民族、肃清社会主义势力），在借日本移民、犹太人和欧洲白种移民扩充税基的背景下，在“祖国恩人年”庆典中震耳欲聋的“特鲁希略万岁！”呼声之中，人民终将明白谁高踞众生之上。当每户家庭被迫悬挂“本户尊特鲁希略为国徽”的标语时，人们会意识到“神于天，特鲁希略于地”，或许有朝一日，这位僭主连天主都要凌驾。"
 nacismo_subtype:0 "纳西主义"
 nacismo_subtype_desc:0 "§Y纳西主义§!\n\n£GFX_ideology_nacismo_bar\n\n\n\n\n作为智利民族主义阵营中独特而略显模糊的一支，由卡洛斯·凯勒·鲁夫与弗朗西斯科·哈维尔·迪亚斯·巴尔德拉马共同孕育的这一思想体系，试图将本土理论同悠久的日耳曼影响相结合。这种被称作“纳西主义”的智利民族主义行动党信条，融合了尼古拉斯·帕拉西奥斯的种族理论（认为智利人的优越性源于哥特贵族与好战的马普切人混血）、弗朗西斯科·安东尼奥·恩西纳的西班牙血统稀释论（指出血统退化导致贵族阶层沉溺自由艺术而荒废实业）、阿尔贝托·爱德华兹的贵族阶层脱离现实论；并糅合了凯勒与瓦尔德拉玛翻译的人民主义、保守主义革命派及奥地利德意志工人党著作的独创见解。该党成功凝聚了因工团主义革命而愤懑的德裔智利人及亲德派势力，成为呼唤祖国重生的旗帜。唯有铲除一切工团共产主义与跨国资本主义，摒弃自由主义思想与议会迷思，实行强大的民族法团主义一党专政，构建体现社会正义与人文劳动真谛的国家，方能实现这一目标。当然，当前智利的现状尚不允许实施此类改革，必须先行完成民族根基的净化与强化——驱逐所有无价值的外邦人（尤以犹太人为甚），同时引入北欧白人疗愈国家的种族灵魂，以此恢复征服者确立的自然秩序与古老等级。纳西主义者宣称，他们最终只是想回归迭戈·波塔莱斯阁下的真知灼见：一个由上层阶级塑造未来的中央集权总统制共和国。"
 lapuanliike_subtype:0 "拉普阿运动"
 lapuanliike_subtype_desc:0 "§Y拉普阿运动§!\n\n£GFX_ideology_lapuanliike_bar\n\n\n\n\n自古以来，奥斯特罗博特尼亚平原就孕育着芬兰的叛逆之子，从科伊利约湖冰面上弑杀圣亨里克的神话人物拉利，到对抗铁腕元帅克劳斯·弗莱明的棍棒战争农民军领袖亚科·伊尔卡。当芬兰的德意志君主制在激进主义与工团主义浪潮中挣扎时，又是波赫扬玛的子孙们挺身反抗这个腐朽体制及其帮凶——城市精英。来自西芬兰腹地的人们聚集在拉普阿镇，聆听维赫托里·科索拉的宣言：一场正义的爱国叛乱，胜过爱国者陷入无政府状态。拉普阿运动就此诞生，科索拉与其盟友将其塑造成垂死芬兰乡村对抗渎神城市与背信精英的最后呐喊。芬兰将重回猎兵与白卫军的时代——那些为挣脱瑞典、俄国或德国桎梏而浴血奋战的独立先驱。这支新的白色力量将建设一个强盛的农业国家，以深厚信仰解放大芬兰领土免受俄国威胁。受意大利与罗马尼亚军团启发，该运动将保卫国家与人民意志的非法行动视为至高使命，即便芬兰总理也难逃其绑架行动。科索拉长期竭力遏制运动内部激进化趋势，常坦言自己只能引导支持者，而无力禁止其行动。但在所有叛乱修辞与暴力之下，运动内部对是否采取如此大胆行动存在深刻分裂：有人渴望建立神授的科索拉独裁政权，有人则主张由白卫军统治的两院制强总统共和国，以实现内战中被背叛的理想。双方共识是：唯有彻底驱逐德国人、马克思主义社民党人与软弱温和派，才能让真正芬兰精神，也就是那些倔强骄傲的乡野农夫所代表的精神，重获至高地位。"
 natpop_regionalism_subtype:0 "后殖民时代地方主义"
 natpop_regionalism_subtype_desc:0 "§Y后殖民时代地方主义§!\n\n£GFX_ideology_regionalism_bar\n\n\n\n\n后殖民时代地方主义也叫做非洲地方主义，指的是后殖民时代非洲一种旨在提高特定国家内一个或多个下辖地区人群的政治权力、影响力、自决权的政治体系，围绕上述地区民族、规范和经济利益而塑造的政治社会体制是其最大的特点。非洲地方主义囊括了各种政治流派，从资本自由主义、保守主义到反资社会主义、法团主义军政府、部落联盟无所不包。多哥、刚果、尼日利亚等新兴国家，从前各民族、各文化各顾各家、互不相扰，如今却被迫搭起伙来，在一个国家中过日子，各方难免会因利益不均而产生冲突，而这正为非洲地方主义提供了传播的土壤。非洲地方主义与民族主义有着许多共通点，但不同于民族主义所有地区一律平等的理念，它通常按照地区、民族、文化群体、宗教派别等依据国家现实而来的特定或个人标准将人群分出个三六九等。非洲地方主义如其名字所示，常见于非洲那些宗派主义、地区对立、民族文化冲突层出不穷的国家和新合并的国家之中，不过在东亚和新世界等世界其他地方也不乏其身影。地方主义者厌恶单一体制和强大的中央政府，他们青睐于联邦制和邦联制，追求的是早期的美国、奥斯曼帝国或现代部族结构这样在国家的大帐篷下是一张由自治、半自治政府连成的庞大网络的现代国家结构，以便在地方主义者各自的框架、倾向的政府实体或人群中满足每一组成部分的需求、传统、历史与独特差异。"
 great_way_subtype:0 "大道"
 great_way_subtype_desc:0 "§Y大道§!\n\n£GFX_ideology_great_way_bar\n\n\n\n\n在上海繁华的夜色与港口喧嚣之下，潜藏着吸引各路骗子、投机者与狂热信徒的暗黑世界。将这些看似迥异的群体凝聚在一起的，是一位名叫苏锡文的本地教授，这位前财政主管将宗教哲学与政治学研究成果融汇贯通，开创了名为大道的新宗教运动。其名源自创始人苏锡文的哲学理念：融合了中华源远流长的佛教与道教思想，并吸纳了日益壮大的一贯道等泛亚秘密结社势力，这些力量已渗透至上海的地下世界。面对治理上海这座多元城市的艰巨挑战，苏锡文既为本地移民也为本土居民效力，旨在实现天下大同的理想。这一理念却与其麾下的本地犯罪集团及日本帝国的联系产生冲突。作为日本早稻田大学的毕业生，苏锡文与旭日之国的渊源使得该运动甘愿成为东京“将亚洲从西方帝国主义解放”野心的合作力量。在中国特别机关支持与满铁资金加持下，新市政府承诺整饬警队、扩展公共工程、肃清社会主义势力，以此打磨这颗东方明珠，引领上海走向大道。但由于日本对我们的野心态度暧昧且对政府心存疑虑，我们在旭日旗下持续共荣的前景仍悬而未决。"
