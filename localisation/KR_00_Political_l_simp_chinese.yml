 tot_ngara_modekngei_subtype:0 "摩德肯基教"
 tot_ngara_modekngei_subtype_desc:0 "§Y摩德肯基教§!\n\n£GFX_ideology_ngara_modekngei_bar\n\n\n\n\n摩德肯基教是一场宗教与政治相融合的运动，兴起于西加罗林群岛沿岸，尤其在巴伯尔道布岛的帕劳人之中广为流传。其起源可追溯至1916年，当时乔尔村的守护神恩吉乔姆库尔显现在塔马达德面前，并任命他为科德普，也就是萨满。从神学角度看，摩德肯基教遵循着一种带有单一主神倾向的独特传统多神论体系。该教派虽崇拜帕劳乃至近年来整个密克罗尼西亚地区的祖先神祇，但他们最为虔诚祈祷的对象是恩吉乔姆库尔，也称为恩吉乔姆库尔·埃斯克里斯托，被视为欧洲人所信奉的耶稣基督的对应神祇。尽管这似乎让摩德肯基教看起来像是一位主神统领下的普通多神信仰者，但他们解释道：不同的神明实为同一至高存在在不同村落与民族中所显现的不同名称。这一观点使其坚定地立足于单一主神崇拜乃至扩散性一神论的范畴，同时避免了独尊单一神祇可能引发的冲突。在政治领域，该教派持鲜明的反殖民立场，其明确目标在于团结人民与传统神祇，共同抵御如德国人或日本人等外来势力。他们还宣称，必须全面复兴古老传统，密克罗尼西亚人民无需依靠外来规则、法令或法典即可和平共处；在殖民者到来之前，他们的传统智慧早已解决了生活中的一切问题。在塔马达德的英明引领下，稳定与和谐终将得以重建，而国家、货币或冰淇淋等欧洲舶来品所代表的外来腐蚀，都将被坚决摒弃。"
 surrealism_subtype:0 "超现实主义"
 surrealism_subtype_desc:0 "§Y超现实主义§!\n\n£GFX_ideology_surrealism_bar\n\n\n\n\n政治超现实主义源自同名的艺术与文学运动，其灵感源于波兰裔法国诗人纪尧姆·阿波利奈尔的作品及达达主义运动，但超现实主义在1920年代中期经由安德烈·布勒东、路易·阿拉贡和菲利普·苏波等人的发展，成为一种真正独特的艺术表达形式。该运动以艺术作为潜意识的表现形式为特征，通过梦境或心灵体验，试图将达达主义的虚无主义和个人主义转化为更具建设性的目标。由于政治分歧及艺术阐释方式的差异，超现实主义阵营本身存在分裂，而这些思想流派的裂隙催生了整体上日益政治化的超现实主义运动。超现实主义者一致认同的是，这场运动本质上是革命性的，是在倒退社会中行动的动态力量。对许多超现实主义者而言，该意识形态的目标在于煽动对资产阶级社会的全面反叛，即使在法国大革命后，资产阶级仍通过文化规范、性别角色和整体生活观渗透进新的革命文化。在超现实主义者眼中，革命必须是社会性的，将个人从性禁忌和阶级的双重束缚中解放出来。超现实主义中占主导地位的一翼由安德烈·布勒东领导，主张精神层面的激荡，虽在物质世界改变甚微，却能在人类思想中铸就向集体社会转型的新时代。布勒东将运动推向共产主义思潮，尤其靠拢国际主义共产主义的不同派系，但运动内部也有许多人联系着其他形式的所谓左翼共产主义者甚至无政府主义者。对超现实主义者，这些个人主义与乌托邦梦想的坚定战士而言，马克思主义的集体主义和社会主义理念需通过社会精神层面的变革来实现，即通过颠覆现实来涤除文化、社会与艺术中一切资本主义成分，直至仅存个人主义的集体体验。尽管该运动常因其缺乏实际行动或对无产阶级物质改善的承诺而受抨击，但其强烈的反殖民主义立场使其在国际舞台上获得巨大影响力，成为解放运动和游击团体对抗反动势力的火炬手。超现实主义在黑人集体意识等文化观发展中的作用，及其对民族主义或任何形式的种族主义“肤色”观念的激烈排斥，使其成为拉丁美洲、非洲和亚洲各类反帝团体中自由战士广为接纳的意识形态。"
 ngara_modekngei_subtype:0 "摩德肯基教"
 ngara_modekngei_subtype_desc:0 "§Y摩德肯基教§!\n\n£GFX_ideology_ngara_modekngei_bar\n\n\n\n\n摩德肯基教是一场宗教与政治相融合的运动，兴起于西加罗林群岛沿岸，尤其在巴伯尔道布岛的帕劳人之中广为流传。其起源可追溯至1916年，当时乔尔村的守护神恩吉乔姆库尔显现在塔马达德面前，并任命他为科德普，也就是萨满。从神学角度看，摩德肯基教遵循着一种带有单一主神倾向的独特传统多神论体系。该教派虽崇拜帕劳乃至近年来整个密克罗尼西亚地区的祖先神祇，但他们最为虔诚祈祷的对象是恩吉乔姆库尔，也称为恩吉乔姆库尔·埃斯克里斯托，被视为欧洲人所信奉的耶稣基督的对应神祇。尽管这似乎让摩德肯基教看起来像是一位主神统领下的普通多神信仰者，但他们解释道：不同的神明实为同一至高存在在不同村落与民族中所显现的不同名称。这一观点使其坚定地立足于单一主神崇拜乃至扩散性一神论的范畴，同时避免了独尊单一神祇可能引发的冲突。在政治领域，该教派持鲜明的反殖民立场，其明确目标在于团结人民与传统神祇，共同抵御如德国人或日本人等外来势力。他们还宣称，必须全面复兴古老传统，密克罗尼西亚人民无需依靠外来规则、法令或法典即可和平共处；在殖民者到来之前，他们的传统智慧早已解决了生活中的一切问题。在塔马达德的英明引领下，稳定与和谐终将得以重建，而国家、货币或冰淇淋等欧洲舶来品所代表的外来腐蚀，都将被坚决摒弃。"
 syn_liberal_socialism_subtype:0 "自由社会主义"
 syn_liberal_socialism_subtype_desc:0 "§Y自由社会主义§!\n\n£GFX_ideology_libsoc_bar\n\n\n\n\n虽然在英语世界之外也能见到其踪影，但自由社会主义的发源地与流行地都在英意两国。自由社会主义同美国的某些非马克思自由意志社会主义，以及法国天主教牧师、教育家让-巴蒂斯特·德·拉萨勒的作品中的思想类似，将自由民主的概念融入了非马克思主义的社会主义之中，典型代表即为英国的工党、约翰·斯图尔特·米尔的著作（米尔认为，自由社会主义的理论基础有二。其一，资本主义社会应通过工人掌控的企业经历渐进式的社会化过程，在这一过程中，私人企业与工人企业并存但又不存在社会主义的中央集权模式，因为这种制度会扼杀竞争与创造力。其二，代议制是自由政府的基石，经济机遇的合力分配是民主长存的前提，因此，民主不仅是代议制政府的一种形式，还代表着整个社会的组织架构。）和卡洛·罗塞利的意大利行动党。带着自由主义是唯一一种天生涉及人类心灵之内在自由的政治理论这一前提，综合了古典自由主义和激进自由主义的理论，自由社会主义把自由看作是人类共同生活的目标、手段与规则，将个体的权利与需求置于首位，而非像传统的马克思主义那样，死抱着某种超然物外、由国家驱动的目标或“为了大局”的心态不放。自由社会主义并不是上述的完美自由理念同社会主义间的折中产物，社会主义并不是一切的目的，它只是一种必要的工具与方法，用以通过政治、经济自主，以及从紧迫的物质需求中解放全社会来达成自由认同的最终目标。自由社会主义不赞同用社会主义经济取代资本主义制度，而是支持包含资本物质的社会所有与私人财产并存的混合经济体系，其走的是一条介于革命与改良之间、自由主义与社会主义之间的中间道路，终点则是一个真正自由的社会。"
 syn_surrealism_subtype:0 "超现实主义"
 syn_surrealism_subtype_desc:0 "§Y超现实主义§!\n\n£GFX_ideology_surrealism_bar\n\n\n\n\n政治超现实主义源自同名的艺术与文学运动，其灵感源于波兰裔法国诗人纪尧姆·阿波利奈尔的作品及达达主义运动，但超现实主义在1920年代中期经由安德烈·布勒东、路易·阿拉贡和菲利普·苏波等人的发展，成为一种真正独特的艺术表达形式。该运动以艺术作为潜意识的表现形式为特征，通过梦境或心灵体验，试图将达达主义的虚无主义和个人主义转化为更具建设性的目标。由于政治分歧及艺术阐释方式的差异，超现实主义阵营本身存在分裂，而这些思想流派的裂隙催生了整体上日益政治化的超现实主义运动。超现实主义者一致认同的是，这场运动本质上是革命性的，是在倒退社会中行动的动态力量。对许多超现实主义者而言，该意识形态的目标在于煽动对资产阶级社会的全面反叛，即使在法国大革命后，资产阶级仍通过文化规范、性别角色和整体生活观渗透进新的革命文化。在超现实主义者眼中，革命必须是社会性的，将个人从性禁忌和阶级的双重束缚中解放出来。超现实主义中占主导地位的一翼由安德烈·布勒东领导，主张精神层面的激荡，虽在物质世界改变甚微，却能在人类思想中铸就向集体社会转型的新时代。布勒东将运动推向共产主义思潮，尤其靠拢国际主义共产主义的不同派系，但运动内部也有许多人联系着其他形式的所谓左翼共产主义者甚至无政府主义者。对超现实主义者，这些个人主义与乌托邦梦想的坚定战士而言，马克思主义的集体主义和社会主义理念需通过社会精神层面的变革来实现，即通过颠覆现实来涤除文化、社会与艺术中一切资本主义成分，直至仅存个人主义的集体体验。尽管该运动常因其缺乏实际行动或对无产阶级物质改善的承诺而受抨击，但其强烈的反殖民主义立场使其在国际舞台上获得巨大影响力，成为解放运动和游击团体对抗反动势力的火炬手。超现实主义在黑人集体意识等文化观发展中的作用，及其对民族主义或任何形式的种族主义“肤色”观念的激烈排斥，使其成为拉丁美洲、非洲和亚洲各类反帝团体中自由战士广为接纳的意识形态。"
 ujamaa_subtype:0 "乌贾马运动"
 ujamaa_subtype_desc:0 "§Y乌贾马运动§!\n\n£GFX_ideology_ujamaa_bar\n\n\n\n\n乌贾马一词在斯瓦希里语中意为“兄弟情谊”，不仅是坦桑尼亚社会主义领袖朱利叶斯·尼雷尔的核心政治理念，更构成了该国国家发展的整体框架。这一思想体系融合了农业主义、合作化理念与发展型社会主义主张。尼雷尔尝试跳出传统法式工团主义道路与马克思主义革命集体化模式，转而倡导一种富有田园诗意、强调合作与去中心化的社会主义路径。乌贾马将道德实践置于政策制定的中心，旨在根除坦桑尼亚的社会沉疴。包括普遍存在的文盲现象、殖民遗留的剥削体系、高儿童死亡率与低人均预期寿命等问题。其纲领的核心原则体现为：建立合作社、创建乌贾马村庄与现代都市，同时推动核心家庭成为基本经济单元。合作社的成立旨在促进坦桑尼亚民众互助共济，通过本地人自主经营的商铺、工坊与农场实现共同繁荣。乌贾马村庄或许是尼雷尔构想中最具雄心的部分：通过一系列五年计划，坦桑尼亚民众将被迁往分布全国的集体化农业单元。在被称为“维吉吉”的高度集中化项目中，每个村庄采用标准化的网格布局，居民通过在合作社劳动及经营每户约一英亩的家庭农场维持生计。这些村庄旨在推进地方民主建设、优化劳动力分工，并使学校、政务机构等公共服务更贴近民众。最后，尼雷尔将核心家庭视为坦桑尼亚未来的基石，推动社会重心从传统宗族体系转向现代家庭单元。除这一重心转移外，乌贾马的支持者还致力于提升妇女权利与教育机会，特别是在规划中自创立之初就强调平等的新型学校体系。然而，即便在此种看似进步的女性立场中，母职价值仍被反复强调，女性教育也主要侧重于如何更好地支撑家庭生活。乌贾马同时秉持强烈的泛非主义与反殖民立场，但并不排斥留居的白人殖民者后裔，且积极吸纳本地亚裔与白人群体参与决策过程。其泛非主义情怀源自一种坚定而宏大的愿景：向世界证明，非洲社会主义是这片大陆切实可行的前行道路。"
 natpop_surrealism_subtype:0 "偏执批判法超现实主义"
 natpop_surrealism_subtype_desc:0 "§Y偏执批判法超现实主义§!\n\n£GFX_ideology_natpop_surrealism_bar\n\n\n\n\n作为一种意识形态，超现实主义自诞生起便长期受安德烈·布勒东的共产主义倾向主导。尽管个人主义者和无政府主义人士时常反抗布勒东对这场运动施加的威权式掌控，但在意识形态上，无人能像萨尔瓦多·达利这般彻底背离这场艺术潮流的本源。达利对这场艺术与政治运动的独特诠释，呼应着他个人创作艺术的方法：偏执批判法，即在面对谵妄或暧昧意象时运用非理性认知。这位超现实主义画家将此法运用于政治领域，致力于探寻被基督教秩序所压抑的隐秘意义与欲望。由此诞生的政治调和物宛如矛盾的迷宫蛛网：达利试图将超现实主义运动中梦境驱动的乌托邦理念与深刻的个人主义表达，同威权统治，或他更青睐的极权统治者与其体制相融合。在达利眼中，左右两翼的极权运动本质如一，皆是对现状的反叛，皆是针对可憎资产阶级及其腐朽道德、社会阶层与过时习俗的革命。旧秩序的毁灭，纵使经由暴虐强人之手，也必将催生一个情色横行、怪诞粗野的新时代；而最重要的是，这位奇思妙想的思想家将缔造全新宗教。他断言唯有新兴的唯物主义宗教能取代僵化的基督教，为此他杂糅乔治·巴塔耶、奥斯瓦尔德·斯宾格勒及另一位加泰罗尼亚宗教“存在论”创立者弗朗切斯克·普霍尔斯的理念，构建出融合性的思想体系。这种新信仰将囊括献祭富者、以他人苦痛换取部分人幸福（因不公正是人类原始特质）、建立空前残酷严苛的精英阶层，其最核心要义在于：支持所有意图颠覆现行秩序的思想潮流，由此催生革命意识形态的混沌聚合体，甚至包括那些自称本质反动的思潮。在这新世界中，达利将篡夺布勒东的超现实主义者王座，引领这场运动化身为激进主义的祭司，崇拜非理性与革命性这两股驱动永恒变革的动态力量，摧毁虚伪的基督教利他精神，缔造色彩统一的全新文明。尽管达利的理想在整体超现实主义运动中罕获支持，但他在伊比利亚仍拥有诸如阿古斯丁·埃斯皮诺萨·加西亚等追随者。凭借这位画家在艺术界的巨大影响力，该思潮或许将演变为挑战整个超现实主义的真正力量。"
 socdem_socdem_progressive_democracy_subtype_swap_tt:0 "我们将转向§M$socdem_progressive_democracy_subtype$§!"
 socdem_progressive_democracy_subtype:0 "进步民主主义"
 socdem_progressive_democracy_subtype_desc:0 "§Y进步民主主义§!\n\n£GFX_ideology_progressive_democracy_bar\n\n\n\n\n坚持进步民主主义理想的政党往往融合了激进的自由派和民族主义阵营两方的成分。因为认为真正民主的社会对实现进步至关重要，他们将不遗余力地进行深度的选举改革，追求实现完全无记名的全民投票。进步民主主义者认为主流的自由主义过于注重个人，因而支持建立所有阶级和利益集团都能团结一致的国家，尽管他们的大多数支持者集中在小城市。经济层面，大多认为自由市场结合技术革新和教育普及，是本土市场抗衡海外竞争的最佳途径，此外，也有部分人士倾向于干预主义和凯恩斯经济学。进步民主主义在知识分子和拥有政治意识的金融业者中最受欢迎。"
