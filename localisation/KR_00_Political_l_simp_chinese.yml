 natpop_right_panafricanism_subtype_desc:0 "§Y右翼泛非主义§!\n\n£GFX_ideology_right_panafricanism_bar\n\n\n\n\n右翼泛非主义，有时直接称之为泛非主义，是对以泛非团结理念为核心的一大堆思想和运动的描述。它的支持者主要是非裔欧美人或者非洲大陆的居民，这种混合了民族主义和民粹主义的意识形态通常寻求通过一系列右翼思想促进非洲群体之间的全面政治甚至文化统一，或者仅仅是各民族在发展其独特民族身份认知的同时，维持友谊并进行合作。尽管本质绝非如此，但右翼泛非主义往往会变得军事化，且时常会走向君主制、独裁国家、军政府或共和政体。在经济上，右翼泛非主义通常支持法团主义、资本主义或传统主义，且都带有不同程度的威权主义，尽管也确实存在一些民主国家。泛非主义广泛传播于非洲大部分地区和更广泛的全球黑人散居地，因此由马库斯·加维、斯坦利·马森格、本杰明·纳姆迪·阿齐基韦和许多其他非裔作为先驱的泛非主义已经成了地球上发展最快的新意识形态之一。"
 natpop_kimbanguism_subtype:0 "基班古主义"
 natpop_kimbanguism_subtype_desc:0 "§Y基班古主义§!\n\n£GFX_ideology_kimbanguism_bar\n\n\n\n\n先知主义，即俗称的基班古主义，既是一种宗教信仰，也是一种意识形态。基班古和平、民粹的新教教义、刚果的基督教信仰，以及对基班古本人的圣灵崇拜，构成了基班古主义的精神伊甸园的基础。由于与民族主义团体之间的关系，基班古主义逐渐变得支持刚果民族主义与奉行刚果例外论，因而变得激进反帝，并支持法团经济，不过总体上其仍遵循着和平主义和部落主义的立场。"
 police_state_subtype:0 "警察国家"
 police_state_subtype_desc:0 "§Y警察国家§!\n\n£GFX_ideology_police_state_bar\n\n\n\n\n从戒严令和宵禁到严厉镇压和合法专制，尽管形式多种多样，但警察国家的主要支柱总是一成不变。警察国家可能是政治性的或非政治性的，专业性的或非专业性的，腐败的或仁慈的，形成的根源与所处的条件不同，具体情况也会千差万别。尽管这种意识形态的表现多种多样，但其出发点都在于防止社会不受约束，陷入混乱。警察国家与军政府类似，但通常不会那么军国主义和帝国主义，而是把给人民带来秩序视为高于一切其他追求，往往在法律条文的支持下，他们可以正当合法地实现自己的追求。"
 crime_syndicate_subtype:0 "犯罪国度"
 crime_syndicate_subtype_desc:0 "§Y犯罪国度§!\n\n£GFX_ideology_crime_state_bar\n\n\n\n\n与其说它是一种意识形态，不如说它是一种半标准化且高度可变的社会组织形式。犯罪国度从根本上是围绕犯罪、腐败和贪污建立起来的。从暴徒和黑手党到犯罪集团和秘密组织，都在一个由犯罪推动、不受法律约束的体系下控制着国家的各个方面。尽管无法无天的程度可能会有很大的不同，从字面意义上的无政府状态的盗匪国家，到组织严明的家长式犯罪企业，以及介于两者之间的一切犯罪国家，都有着一个共同点：通过非法但有利可图的手段追求利润和繁荣。"
 jacobinism_subtype:0 "红色雅各宾主义"
 jacobinism_subtype_desc:0 "§Y红色雅各宾主义§!\n\n£GFX_ideology_red_jacobin_bar\n\n\n\n\n所谓的“红色雅各宾派”也可以直接简称为“雅各宾派”，它指的是法共内部两大派系中势力较大的一派。在从社会底层一路打拼上来的“人民之子”莫里斯·多列士的领导下，法共中的主流派别始终坚持马克思提出、后经列宁之手得到扩充的正统思想。令那些仍记得列宁说过罗伯斯庇尔是“布尔什维克前身”的人大为不解的是，“红色雅各宾派”把科德利埃派、忿激派、埃贝尔派、无套裤汉的遗产都纳入了自己的共产主义理论中来。在他们看来，大革命时期的这些团体身上有着真正社会主义的雏形，后者关心城市无产阶级和贫苦工人，厌恶腐败的政治势力，并且极度反教权，为把人民群众从精神的鸦片中拯救出来、赋予其理性崇拜，甚至不惜把教士扔进河里淹死。新巴贝夫派把弗朗索瓦-诺埃尔·巴贝夫的遗产带到了第一巴黎公社之中，而多列士则从其原始共产主义团体“平等派密谋”中汲取了不少思想。一手是法国大革命的独特遗产，一手是马克思和列宁的纯粹科学的赤色法共已经准备好以民主集中制原则、阶级斗争、一切左翼服从于党之教条为基础，建立起真正的无产阶级专政，把法兰西的工人们改造为时刻准备好接过饱受反动势力摧残的革命火炬的新社会主义之志士。"
 african_syndicalism_subtype:0 "非洲工团主义"
 african_syndicalism_subtype_desc:0 "§Y非洲工团主义§!\n\n£GFX_ideology_afrosyn_bar\n\n\n\n\n非洲工团主义是对在黑暗大陆流行起来的各种各样但紧密相关且具有非洲特色的工团主义的描述。作为最早在英法旧殖民地发展起来的正统工团主义的变体，非洲工团主义的不同之处在于，它更贴近非洲的社会现实，而不那么关注欧洲的工业化理念。因此，它通常会更为保守。非洲工团主义通常以农业为核心，将农业至于重工业之上，非常重视通过广泛的资源开采来利用非洲的矿产财富，并且通常对本土习俗十分宽容——然而，也确实存在亲部落和反部落的变体，以及更传统或更现代的形式。非洲工团主义本身不带有泛非性质，这并没有阻止许多泛非主义者，如夸梅·恩克鲁玛和乔治·帕德莫尔，接纳许多非洲工团主义的思想，但它也有不少正统支持者，如西里尔·阿杜拉，因此，这一相对罕见的新思想开始像野火一样在非洲蔓延。"
 alcoholism_subtype:0 "哈谢克主义"
 alcoholism_subtype_desc:0 "§Y哈谢克主义§!\n\n£GFX_ideology_alcoholism_bar\n\n\n\n\n哈谢克主义，一种常被戏称为“酗酒主义”或“温和进步主义”的意识形态。它定义了——准确来说，它试图定义雅洛斯拉夫·哈谢克和他所属的党派“法律许可范围内的温和进步党”那种内容多样而变幻莫测、却又超凡脱俗的意识形态。作为一名捷克人，哈谢克在任何方面都有着独一无二的特征，他主张全国酗酒、财富再分配、温和无政府主义、以及彻底摧毁现有的全球秩序和一些类似的主张。对“哈谢克主义”下定义的尝试极为困难，却也极为壮观，也许，“哈谢克主义”只不过是捷克在当下的恐怖中谋求生存所需的一种独一无二的、离谱的社会主义思想吧。"
 austromarxism_subtype:0 "奥地利马克思主义"
 austromarxism_subtype_desc:0 "§Y奥地利马克思主义§!\n\n£GFX_ideology_austromarxism_bar\n\n\n\n\n在卡尔·伦纳、奥托·鲍威尔、维克托·阿德勒等奥地利社会主义巨头的推动下而诞生，奥地利马克思主义描述了在整个奥地利流行的，马克思主义那带有强烈民族主义的独特奥地利变体。奥地利马克思主义与标准的社会民主主义不同，试图在哈布斯堡多民族帝国的大背景下调和民族主义与社会主义的关系。奥地利马克思主义试图将革命社会主义和社会民主主义融合为一个统一的理想，认为通过实现帝国各少数民族的民族自治，可以更容易地传播阶级意识和社会主义信仰。"
 democratic_hussitism_subtype:0 "民主胡斯主义"
 democratic_hussitism_subtype_desc:0 "§Y民主胡斯主义§!\n\n£GFX_ideology_dem_hussite_bar\n\n\n\n\n作为主流胡斯主义相对冷门的一个分支，民主胡斯主义得到了当代扬·胡斯——弗朗齐歇克·米哈莱克·巴托什的鼎力推崇。巴托什的民主胡斯主义提倡建立在胡斯派教会、父权和上帝指导下的进步民粹民主制度，他们认为只有主才有权成为国家的国王。民主胡斯派继承了君主派的传统主义思想和对古波希米亚的浪漫化，他们希望将国家建设成进步虔诚的民主乌托邦，同时坚守自古以来的传奇与风俗。"
 national_socialism_subtype:0 "民族社会主义"
 national_socialism_subtype_desc:0 "§Y民族社会主义§!\n\n£GFX_ideology_national_socialism_bar\n\n\n\n\n虽名为“民族社会主义”，民族社会党提倡的意识形态实则基于公民民族主义、捷克爱国主义、自由改革主义和自由化温和化的社会主义，其在提倡民粹主义的同时，也追寻建立适度福利国家。民族社会主义者否定马克思式社会主义，并推动与现代资本主义绑定的改革议程，他们希望为人民带来自由、繁荣、平等与爱国主义。虽然在世界大战前带有一定反犹倾向，但党及其思想早已摒弃了这些恶毒的观念，转而为实现境内各民族的自由与团结而奋斗。"
 paneuropeanism_subtype:0 "凯勒奇泛欧主义"
 paneuropeanism_subtype_desc:0 "§Y凯勒奇泛欧主义§!\n\n£GFX_ideology_paneuropeanism_bar\n\n\n\n\n这一由理查德·冯·康登霍维-凯勒奇提出，融合了自由主义理念的泛欧主义分支希望通过自由主义、进步主义和现代化的繁荣与平等观念，来建立欧洲多种族间的文化联盟。自豪、坚忍的欧洲贵族精神，及其丰富多样的历史是这种理念的一大支柱。尝试融合现代自由思想与传统过往绝非易事，但在温和资本主义、平等主义和宗教虔诚的支持下，凯勒奇思想也许正是通往泛欧罗巴繁荣的康庄大道。"
 pataut_christian_democracy_subtype:0 "威权基督教民主"
 pataut_christian_democracy_subtype_desc:0 "§Y威权基督教民主§!\n\n£GFX_ideology_autdem_christian_democracy_bar\n\n\n\n\n威权基督教民主诞生于一个简单的事实，即民主本身对任何社会都具有腐蚀性，它的诞生地，古雅典，就是道德堕落的绝佳范例。威权基督教民主政权会积极打击任何试图破坏传统社会结构的进步派或社会主义分子。这些国家可能与既存的宗教机构之间有着密切的联系，甚至让神职人员偶尔担任国家官员。虽然仍然追求着社会公正的经济制度，但威权基督教民主党派往往不会给工会喘息的空间，以免他们影响力过分扩大，威胁到蒙主庇佑的正义之士。"
 hussitism_subtype:0 "胡斯主义"
 hussitism_subtype_desc:0 "§Y胡斯主义§!\n\n£GFX_ideology_hussite_bar\n\n\n\n\n胡斯主义在其理论基础上与胡斯教会和已故的扬·胡斯的教义紧密联系，同时也代表现代胡斯主义中占主流的保皇派系。在胡斯派历史学家弗朗齐歇克·巴托什的推广之下，胡斯主义将胡斯派教会的主教加冕为重生的、受祝福的捷克王室的新君主，提倡家长式的民粹主义、宗教虔诚、慈善以及建立中央集权的国家，同时也呼吁重夺旧波希米亚的光荣遗产。在上帝、王室和他们独特的本土教会的领导下，胡斯派寻求将虔诚的进步主义和父权制的国家荣耀带给捷克，乃至边境之外的地区。"
 ariosophy_subtype:0 "雅利安秘学"
 ariosophy_subtype_desc:0 "§Y雅利安秘学§!\n\n£GFX_ideology_ariosophy_bar\n\n\n\n\n雅利安秘学，即所谓“雅利安人的智慧”，亦称阿马嫩主义，是兰茨·冯·利本费尔斯及其前辈吉多·冯·利斯特的创造，其将奥地利人等所谓的雅利安民族视为人类物种的顶峰，视其它人种为人猿之类的低等兽物，认为只有雅利安人才是孕育人类的古神的真正的孩子，只要全身心地遵循利本费尔斯的教导，雅利安人便可重新获得伟大的神力和崇高的地位，或者说至少希望如此。雅利安秘学与日耳曼异教和浪漫主义有着深厚的联系，同时又是不留余地的种族优越论，将所有其他人种视为劣等的亚人，它的信徒寻求将获选之种族引领向乌托邦的同时，也渴望将所有其他劣等人踩到泥沼之下。"
 volkism_subtype:0 "人民主义"
 volkism_subtype_desc:0 "§Y人民主义§!\n\n£GFX_ideology_valkism_bar\n\n\n\n\n人民主义是一种松散的日耳曼极端民族主义思想流派，其致力于追求种族纯洁、民族团结、军事强权，以及时有时无的虔诚信仰，在诸如全德意志联盟、日耳曼教团、防卫之狼联盟等组织以及各种程度的青年保守运动成员间都可瞥见其身影。虽然其实中也有无神论者以及罕见的异教信仰者，但大部分人民主义团体都是北欧主义或新马西昂派的信徒，并且极其重视祖先传承下来的传统，崇尚民族与国家的“血与土”。在经济领域，人民主义运动多以法团主义、农业主义为纲领，不过即使是无政府主义者之中也不乏人民主义的拥趸。抛开上述差异不谈，人民主义仍是那些因认为德国忘记了其所代表的人民，陷入了现代化的衰落窠臼之中而对现实感到幻灭的极右翼日耳曼人眼中的一束辉光。"
 hoxhaism_subtype:0 "霍查主义"
 hoxhaism_subtype_desc:0 "§Y霍查主义§!\n\n£GFX_ideology_hoxha_bar\n\n\n\n\n霍查主义，有时也被称为阿尔巴尼亚列宁主义，是国家革命委员会先锋队派的年轻领导人恩维尔·霍查所倡导的意识形态。在巴黎度过的那些岁月里，在欧洲社会主义政党的各个总部间旅行跋涉的那段日子里，霍查的意识形态逐渐发展成型。随着时间的推移，他开始相信无政府主义者、工团主义者、索雷尔主义者、雅各宾派和极权宪章派都不过是革命斗争中的叛徒，而只有弗拉基米尔·列宁才是革命斗争的最佳代表。因此，霍查主义者的主要目标便是保护弗拉基米尔·列宁的遗产，创造最科学、最反修正主义的马克思列宁主义。他们还将此与将阿尔巴尼亚建设成一个真正的共产主义国家的澎湃动力结合起来，誓要把反动派留下的混乱与矛盾的阿尔巴尼亚文化重塑为自豪的社会主义爱国主义传统。此外，在党内党外任何形式的修正主义者和右倾叛徒都得到处理之前，霍查的追随者们都不会善罢罢休。"
 ultra_hoxhaism_subtype:0 "超霍查主义"
 ultra_hoxhaism_subtype_desc:0 "§Y超霍查主义§!\n\n£GFX_ideology_ultra_hoxha_bar\n\n\n\n\n超霍查主义，又称恩维尔-涅奇米叶主义，是在阿尔巴尼亚最高领袖恩维尔·霍查不幸去世后，霍查的遗孀涅奇米叶·霍查怀揣着悲愤之情所创造出的意识形态。超霍查主义将霍查的死视为一场与修正主义者的永恒斗争的揭幕，倡导建立一个掌控一切的极权国家，将对社会主义内部的无尽净化视为对霍查之死的唯一解答。除非所有的社会主义叛徒，不仅是国内的，而且是全世界的，都因粉碎了霍查的宏伟梦想而受到惩罚，否则超霍查主义者绝不会罢休——这就是超霍查主义者步向社会主义天堂的方式。"
 tot_paneuropeanism_subtype:0 "左翼泛欧主义"
 tot_paneuropeanism_subtype_desc:0 "§Y左翼泛欧主义§!\n\n£GFX_ideology_left_paneuropeanism_bar\n\n\n\n\n左翼泛欧主义将泛欧思想中的民族主义与反动要素拎了出来，并将其融入了社会主义思想之中。左翼泛欧主义是与非民族主义的托洛茨基主义相对立的流派之一，它将左翼大团结和全球主义（或者说国际主义）的定义缩小到欧洲中心的方向之上，致力于将西方世界的心脏团结在带有民族主义与文化例外论色彩的鲜红旗帜之下。泛欧思想中的“民族主义”一面表现在拔高欧洲某一或者某些特定的文化的地位，或者直接将全部文化融合为一个海纳百川的整体，而不同群体又推崇着不同的文化民族主义、公民民族主义、种族民族主义等各式认同，这就导致“民族主义”可以无限细分。虽然不同的左翼泛欧主义者在将欧洲统一在何种社会主义形态之下这一点有着不同的见解，从共产主义、工团主义到社会民族主义、民主社会主义都各有各的受众，但有一点是所有的泛欧主义者都一致认同的，那就是只有在社会主义庇荫之下的欧洲，才能在即将到来的风暴中延续文明的火种。"
 totalist_savinkovism_subtype:0 "革命萨文科夫主义"
 totalist_savinkovism_subtype_desc:0 "§Y革命萨文科夫主义§!\n\n£GFX_ideology_revolutionary_savinkovism_bar\n\n\n\n\n命运的颠沛起伏终成此果。时代的洪流裹挟着社革党战斗队前领袖、人民共和党创始人鲍里斯·维克托罗维奇·萨文科夫去追本溯源，抓住机会把借鉴来的左翼社革党及国外宪章运动的思想吸纳了进来，真正完成了萨文科夫主义的左转。革命萨文科夫主义把其缔造者农业社会主义恐怖分子的过往，以及早已作古的社会革命最高纲领联盟的政纲结合在了一起——后者是社革党的一衍生组织，致力于一举推翻由左右翼的代理人所维护的僵化资产阶级体系。只有依靠直接行动，依靠不屈不挠的暴力反抗精神，破除人民面前的一切阻碍，俄罗斯才能彻底摆脱历史强加于身的枷锁。在“天定专制者”，在深谙布朗基主义与彼得·特卡乔夫理论的最高纲领主义者的指导下，俄国的劳苦大众将觉醒出自己的意识，接触到秘密“知识”，建立起萨文科夫依据其友德米特里·梅列日科夫斯基之文字所提出的俄罗斯第三共和国。这最后一次的左转过后，人民共和党先前奉行的天启基督教让位于了社会主义末世乌托邦，让位于了由唯物辩证法的解构与升华所剖析的人世最终天国。信社会主义、信日后的人世天堂的人是有福的。"
 liberalized_syndicalism_subtype:0 "自由工团主义"
 liberalized_syndicalism_subtype_desc:0 "§Y自由工团主义§!\n\n£GFX_ideology_libsyn_bar\n\n\n\n\n自由工团主义被认为是社会主义大观园中一种奇怪甚至反常的分支，它为自己定下了一项艰巨的任务，即在工团主义和资本主义之间寻得一条中间路线。按一些人的说法，自由工团主义尊重并鼓励大多数形式的中小型私营企业，有时甚至在特定情况下与大型公司合作。虽然自由工团主义的大多数支持者仍然坚持第三国际在领导社会主义事业方面的首要地位，但也有些人认为第三国际过于压制成员和教条主义，不利于社会主义发展，于是转而去其他地方寻求盟友，包括西方的自由民主国家。"
 centralized_syndicalism_subtype:0 "集权工团主义"
 centralized_syndicalism_subtype_desc:0 "§Y集权工团主义§!\n\n£GFX_ideology_centralsyn_bar\n\n\n\n\n集权工团主义是一种与无政府工团主义政权内常见的半民主组织有相当距离的工团主义制度，它倡导建立一个强大的中央工会政府，其通常由一个强大的行政部门、一个独断的劳联会或其他形式的中央权力机构所主导。但集权主义者仍然想要围绕工会或红色行会建立各式社会组织，他们也经常将各个工会整合为一个覆盖整个国家的总工会——一个可以由主要的、全能的管理机构更容易、更有效地管理的工会。"
 democratic_syndicalism_subtype:0 "民主工团主义"
 democratic_syndicalism_subtype_desc:0 "§Y民主工团主义§!\n\n£GFX_ideology_demsyn_bar\n\n\n\n\n虽然主流的工团主义在某种程度上本就包含着民主要素，但它其中通常缺乏真正的民主，因为它一般只允许工会或党派内的人投票——而且就算没有范围限制，其仍有一些其他的障碍，以至于无法实现真正的平等并建立开放的民主制度。而民主工团主义——有时被称为共和工团主义——通过确保本国所有公民都享有真正自由和公平的民主权利而打破了这一局面，同时其也体现了代议制和直接民主制原则。这一制度仍然在工团主义经济学、社会主义和工会主义的框架下存在，他们支持群众发出属于自己的声音，并将其视为一个真正的工团主义社会的支柱。"
 agrarian_syndicalism_subtype:0 "农业工团主义"
 agrarian_syndicalism_subtype_desc:0 "§Y农业工团主义§!\n\n£GFX_ideology_agrarian_syn_bar\n\n\n\n\n农业工团主义打破了正统工会主义具有的传统工业主义和城市主义性质，寻求创造一个以农业主义为中心，发展农业的工会主义集体组织化社会。农业工团主义经常出现在农村占多数与城市化程度较低的国家，它与主流工团主义思想有许多相似的地方，只是其处在农业框架内而非在工业框架内，无产阶级思想也以农民为中心而不是以工厂工人为中心。"
 radsoc_red_junta_subtype:0 "红色军政府"
 radsoc_red_junta_subtype_desc:0 "§Y红色军政府§!\n\n£GFX_ideology_red_junta_bar\n\n\n\n\n带有左翼倾向的军政府同非红色的军政府一样，形式多种多样，它们的共同点是利用军队来“保卫”自己扎根之国家的社会主义。在红色军政府中，将军和士兵取代了政委和书记，他们会通过深度专制的警察国度以及一次又一次的武装行动来消灭那些以革命谋私利的腐败文官和颠覆分子。目的达成后，军政府可能会逐渐褪去身上的军事色彩，也可能会永久巩固住自己的统治。红色军政府虽带有强烈的军事威权印记，但在铁血镇压之外也存在着社会主义的治理，其在上台前向人民许下的福利和人身保护也基本都能够兑现。"
 radsoc_anarcho_syndicalist_subtype:0 "无政府工团主义"
 radsoc_anarcho_syndicalist_subtype_desc:0 "§Y无政府工团主义§!\n\n£GFX_ideology_anarsyn_bar\n\n\n\n\n作为正统工团主义的最大分支，无政府工团主义试图在无政府主义和无国家或半无国家的框架内建立一套工团主义体系——即一个围绕工会和雇员组织的管理体系。无政府工团主义寻求废除工资制度以及由资本主义推动的国家主义。他们相信，通过团结、自我管理、公社化、直接罢工、抗议和直接民主，可以为所有人建立一个真正的平等天堂。拒绝私有财产、等级制度和社会分层，无政府工团主义者将拆毁国家概念，建立他们的工团主义乌托邦，摆脱贪婪的国家主义。"
 illegalism_subtype:0 "罪犯无政府主义"
 illegalism_subtype_desc:0 "§Y罪犯无政府主义§!\n\n£GFX_ideology_illegalism_bar\n\n\n\n\n罪犯无政府主义是流行于法国、意大利、瑞士和低地国家的左翼无政府主义的一个分支，它源于阿尔贝·利贝塔的无政府主义思想，在个人主义和暴动思想的推波助澜下成型。罪犯无政府主义看重个人生活的快乐，不愿因国家强加的某种等级、社会标准而去战斗牺牲。罪犯无政府主义者将违法、犯罪等种种禁忌行为视为一种人生信条，一种对抗资本主义以及各种各样由所谓的“法律与秩序”所维系的国家压迫的手段，他们致力于将整个国家撕个粉碎，然后代之以不受标准性的道德准则和压迫性的社会规则所束缚的混乱、犯罪和享乐之海。罪犯无政府主义主要分为两个流派：受克莱芒·杜瓦尔和马里于斯·雅各布启发的个人罪犯无政府主义反对集体主义，将违法犯罪当作推动更广泛的反抗运动的一种教育、组织工具，将其与个体改造、个体再分配、行动宣传等理念并驾齐驱；由马克斯·施蒂纳的文字和博诺帮的行为所定义的自我罪犯无政府主义则放下了道德准绳的束缚，随心而动。除此之外，西班牙、阿根廷的剥夺式无政府主义者，如布埃纳文图拉·杜鲁提、弗朗西斯科·阿斯卡索、塞韦里诺·迪·乔瓦尼、米格尔·阿坎赫尔·罗西尼亚等也有着与上述两者相似的观点，只不过他们只是把犯罪行为看作一种政治手段，而非革命成功后的生活之道。罪犯无政府主义不是一种完备一致的意识形态，它并没有涉及到经济学等其它琐事的理论，只能由别的思想家、意识形态、社会主义分支替它擦屁股。罪犯无政府主义打着通过经济干预重新分配资本主义财富、推翻专制压迫的社会结构、在无政府乌托邦中实现真正的自由等旗帜，行尽鸡鸣狗盗之事，一心去往纯粹的自由与无国家社会。"
 radsoc_communism_subtype:0 "广泛共产主义"
 radsoc_communism_subtype_desc:0 "§Y广泛共产主义§!\n\n£GFX_ideology_broad_com_bar\n\n\n\n\n广泛共产主义是指那些声称遵循马克思、恩格斯和列宁的思想，但在行事和执政风格上比其他列宁主义政党表现得更为温和的社会主义政党。这些独树一帜的共产党人寻求将观点不同的社会主义者纳入党内，甚至会与其他社会主义政党，哪怕是非列宁主义政党结盟，而且在获得执政权力后，他们往往会拒绝使用恐怖手段，强调要在工人和农村人民之间达成合作，使其一同反对资产阶级。他们在经济方面往往比较正统，鼓励财富从资产阶级流向无产阶级。这些政党在世界上还相当少见，而且还常被指责为修正主义，但他们始终坚信，自己的思想理念才是最有可能实现国际无产阶级梦想中那个无阶级、无国家的共产主义社会的。"
 socdem_jadidism_subtype:0 "扎吉德主义"
 socdem_jadidism_subtype_desc:0 "§Y扎吉德主义§!\n\n£GFX_ideology_socdem_jadidism_bar\n\n\n\n\n扎吉德主义起源于早期的扎吉德运动，描述了一种独特的突厥人意识形态，主张旧俄罗斯帝国内传统保守的伊斯兰社会经济和政治结构的自由化。扎吉德主义者认为，为了摆脱俄罗斯独裁者带来的腐朽堕落，伊斯兰社会必须接纳一种受西方启蒙，拥抱现代主义，但本质不变的重生伊斯兰理念。为了推动自由主义、现代主义、工业化和更进一步的平等繁荣，扎吉德主义寻求为其新近得到解放的国家和突厥民族带去启蒙和现代化，尽管每个运动推行的程度都大不相同，因为保守和自由派扎吉德主义同样越来越流行。"
 kerenskyism_subtype:0 "克伦斯基主义"
 kerenskyism_subtype_desc:0 "§Y克伦斯基主义§!\n\n£GFX_ideology_kerenskyism_bar\n\n\n\n\n1930年代后半期，亚历山大·克伦斯基总统在俄罗斯建立的政治制度被许多人称为“社会自由主义专政”。该政权结合了社会自由主义意识形态的要素，如经济实体的自由和面向劳动群众，但另一方面，国家的政治生活受到各种势力的影响，包括寡头和大工业家，而这些势力确保了领导者或领导政党权力的不可动摇。"
 national_liberalism_subtype:0 "民族自由主义"
 national_liberalism_subtype_desc:0 "§Y民族自由主义§!\n\n£GFX_ideology_national_liberalism_bar\n\n\n\n\n民族自由主义描述了一种支持爱国主义和民族主义——无论是公民民族主义还是种族民族主义，将其与自由、平等和博爱的概念内在地联系在一起的自由主义思想。与主流自由主义相比，民族自由主义者通常更为保守或传统，寻求一个秩序井然但自由受到保护的社会，但许多相关政权也被发现会给予自己偏爱的公民优惠待遇。无论如何，民族自由主义是一种合法的自由主义意识形态，植根于法国等欧洲各地以及他们的殖民地。"
 radical_liberalism_subtype:0 "激进自由主义"
 radical_liberalism_subtype_desc:0 "§Y激进自由主义§!\n\n£GFX_ideology_marlib_radical_liberalism_bar\n\n\n\n\n激进自由主义也称为古典激进主义或激进共和主义，是一种在法国大革命中的激进派和上个世纪的自由主义先驱的影响下成形的现代政治运动。激进自由主义同共和主义、现代主义、公民民族主义、理性主义、世俗人文主义、进步主义相关联，致力于扩展“自由主义”的含义，以建立一个人人都将享有自由与正义的真正自由、公平和平等的社会。"
 jadidism_subtype:0 "扎吉德主义"
 jadidism_subtype_desc:0 "§Y扎吉德主义§!\n\n£GFX_ideology_socdem_jadidism_bar\n\n\n\n\n扎吉德主义起源于早期的扎吉德运动，描述了一种独特的突厥人意识形态，主张旧俄罗斯帝国内传统保守的伊斯兰社会经济和政治结构的自由化。扎吉德主义者认为，为了摆脱俄罗斯独裁者带来的腐朽堕落，伊斯兰社会必须接纳一种受西方启蒙，拥抱现代主义，但本质不变的重生伊斯兰理念。为了推动自由主义、现代主义、工业化和更进一步的平等繁荣，扎吉德主义寻求为其新近得到解放的国家和突厥民族带去启蒙和现代化，尽管每个运动推行的程度都大不相同，因为保守和自由派扎吉德主义同样越来越流行。"
 marlib_national_liberalism_subtype:0 "民族自由主义"
 marlib_national_liberalism_subtype_desc:0 "§Y民族自由主义§!\n\n£GFX_ideology_national_liberalism_bar\n\n\n\n\n民族自由主义描述了一种支持爱国主义和民族主义——无论是公民民族主义还是种族民族主义，将其与自由、平等和博爱的概念内在地联系在一起的自由主义思想。与主流自由主义相比，民族自由主义者通常更为保守或传统，寻求一个秩序井然但自由受到保护的社会，但许多相关政权也被发现会给予自己偏爱的公民优惠待遇。无论如何，民族自由主义是一种合法的自由主义意识形态，植根于法国等欧洲各地以及他们的殖民地。"
 marlib_jadidism_subtype:0 "扎吉德主义"
 marlib_jadidism_subtype_desc:0 "§Y扎吉德主义§!\n\n£GFX_ideology_socdem_jadidism_bar\n\n\n\n\n扎吉德主义起源于早期的扎吉德运动，描述了一种独特的突厥人意识形态，主张旧俄罗斯帝国内传统保守的伊斯兰社会经济和政治结构的自由化。扎吉德主义者认为，为了摆脱俄罗斯独裁者带来的腐朽堕落，伊斯兰社会必须接纳一种受西方启蒙，拥抱现代主义，但本质不变的重生伊斯兰理念。为了推动自由主义、现代主义、工业化和更进一步的平等繁荣，扎吉德主义寻求为其新近得到解放的国家和突厥民族带去启蒙和现代化，尽管每个运动推行的程度都大不相同，因为保守和自由派扎吉德主义同样越来越流行。"
 conservative_populism_subtype:0 "保守民粹主义"
 conservative_populism_subtype_desc:0 "§Y保守民粹主义§!\n\n£GFX_ideology_conservative_populism_bar\n\n\n\n\n保守民粹主义是一种脱胎于基督教民主国家或其他类似政权的虔诚而保守的民粹主义运动，这些保守的民主与共和运动，尽管厌恶真正的社会主义并希望维持社会等级制度的完整，但同时也推行重视平等主义、民粹主义并且有些进步的经济政策。保守民粹主义经常源于群众运动，而并不带有保守民主国家常见的精英或贵族性质，保守民粹主义重视工人阶级，尽管它又致力于维护社会传统和反对社会主义，并且经常与基督教联合和公民民族主义等思想联系在一起。"
 soccon_jadidism_subtype:0 "扎吉德主义"
 soccon_jadidism_subtype_desc:0 "§Y扎吉德主义§!\n\n£GFX_ideology_socdem_jadidism_bar\n\n\n\n\n扎吉德主义起源于早期的扎吉德运动，描述了一种独特的突厥人意识形态，主张旧俄罗斯帝国内传统保守的伊斯兰社会经济和政治结构的自由化。扎吉德主义者认为，为了摆脱俄罗斯独裁者带来的腐朽堕落，伊斯兰社会必须接纳一种受西方启蒙，拥抱现代主义，但本质不变的重生伊斯兰理念。为了推动自由主义、现代主义、工业化和更进一步的平等繁荣，扎吉德主义寻求为其新近得到解放的国家和突厥民族带去启蒙和现代化，尽管每个运动推行的程度都大不相同，因为保守和自由派扎吉德主义同样越来越流行。"
 national_democracy_subtype:0 "民族民主主义"
 national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_polish_natdem_bar\n\n\n\n\n民族民主主义起源于波兰民族思想之父罗曼·德莫夫斯基的创意，其前身可以追溯到波兰实证主义和有机劳动运动。民族民主党人把波兰民族的利益视为最高利益，努力创造一个超越阶级差异的团结社会，且并不特别强调宗教。虽然主张建立起更为强势的政府，但民族民主运动仍然坚持民主是首选的政治制度，只是波兰人的地位需要得到提升，且在波兰裔占多数的地区推动少数民族同化。在经济问题上，民族民主主义的立场不那么明确，不过最受欢迎的选择是自由市场的同时，允许政府有足够的干预权来保护国家利益。在外交事务上，民族民主运动强烈反德，并将俄罗斯视为遏制德意志帝国野心的最佳伙伴。"
 czech_national_democracy_subtype:0 "民族民主主义"
 czech_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_czech_natdem_bar\n\n\n\n\n至少从几十年前开始，捷克民族民主党就是维也纳的眼中钉肉中刺，它是波希米亚王冠领内最强大的一股右翼政治势力。民族民主党起源于“青年捷克党”，其在经济上持民族性的自由主义观点，相关政策皆以保护捷克消费者为出发点。在外交政策方面，民族民主党支持斯拉夫人之间的结盟，希望能借此将日耳曼人的势力从捷克的土地上驱逐出去，还有些人甚至认为这只是向泛斯拉夫联盟的建立迈出的第一步罢了。在政治领域，民族民主党人主张建立一个强硬但民主的制度，并把捷克民族置于最重要的位置上，让每一名国民，无论其阶级背景如何，都能感受到生活水平的提升。民族民主党与波兰的民族民主运动起源虽然迥然不同，但却在许多方面都有着异曲同工之处。"
 authoritarian_liberalism_subtype:0 "威权自由主义"
 authoritarian_liberalism_subtype_desc:0 "§Y威权自由主义§!\n\n£GFX_ideology_authoritarian_liberalism_bar\n\n\n\n\n威权自由主义并不是种具体的意识形态，而是政治舞台上的一种奇异存在，它所追求的愿景偏离了一般的轨道。威权自由主义者们尽管支持建立强而有力又无所不包的行政部门，但他们并不想强制施加什么神圣准则、民族理想或是军事秩序，他们的目的仅仅是为大众带来自由。在经济领域，威权自由主义者往往有着迥异的观点，但大多数都赞成帮扶中小企业、为地方小家带来繁荣。在社会领域，威权自由主义总体偏向保守，但不同国家的不同国情也催生出了更加自由化，甚至极度进步的衍生思想。自由、繁荣、进步是人民所应该拥有的，即使是要将大声尖叫、踢腿哭闹的人民硬拽出那笼罩着他们的愚昧落后也要达成。"
 natpop_paneuropeanism_subtype:0 "右翼泛欧主义"
 natpop_paneuropeanism_subtype_desc:0 "§Y右翼泛欧主义§!\n\n£GFX_ideology_right_paneuropianism_bar\n\n\n\n\n广义来讲，泛欧主义可以指代任何一种推动欧洲全面统一的意识形态。从理查德·冯·康登霍维-凯勒奇的传统贵族化又自由进步的文化民族主义思想，到尤利乌斯·埃佛拉的超民族神秘学反现代理论，这种意识形态有许多衍生流行于世。然而，最重要的是，他们都会利用民族主义来达成自己的目的——要么创造一种带有凝聚力的新泛欧身份认同，要么将一个或多个特定民族拔擢为主体民族加以团结，并强迫他族接受——并都寻求统一欧洲，以保护欧洲大陆免受外部影响，同时努力让所有被认定有资格的人民享受繁荣。"
 national_radicalism_subtype:0 "民族激进主义"
 national_radicalism_subtype_desc:0 "§Y民族激进主义§!\n\n£GFX_ideology_national_radicalism_bar\n\n\n\n\n民族激进主义是年轻一代民族民主运动成员在政治上活跃的副产品，是民族民主主义的更狂热形式，也是波兰民族思想的极端化。对这些年轻的民族激进主义者来说，统一的波兰国家就是一个天主教国家，任何旧民族民主运动成员所宣称的无神论或不可知论概念都被嗤之以鼻。而当谈到对政府系统的设想时，他们也更加激进，主张建立一个高度等级化甚至是彻底的极权主义政府，由一个终身任职的参议院、一个领导人或一个开明的理事会来管理。民族激进主义派也不试图掩饰他们对波兰境内大多数少数民族的蔑视，尽管有些人也梦想建立一个神圣的泛斯拉夫帝国。激进派在经济问题上的分歧也比主流民族民主运动成员更大，他们分别支持从法团主义、右翼工团主义、分产主义乃至于新封建主义行会制度的一切制度。如果说民族激进派有什么明显的特点，那肯定是他们比他们的祖师爷德莫夫斯基更有争议性，政治上更具不确定性。"
 mathengeism_subtype:0 "马森格主义"
 mathengeism_subtype_desc:0 "§Y马森格主义§!\n\n£GFX_ideology_mathengeism_bar\n\n\n\n\n斯坦利·马森格的思想很难被精确描述，因为它，就像其前身茅茅主义一样，兼具泛非理念与宗教思想，只是更进一步地发生了演变。班图至上主义，泛非基库尤沙文主义，民族茅茅主义，甚至可以简单地概括为“马森格主义”的这一意识形态，支持自力更生、自给自足、反西方反欧洲主义、班图例外论、基库尤-肯尼亚民族主义，以传统部落结构为基础的国家工团主义经济，以及对国家和马森格本人完全的忠诚和顺从。马森格主义十分血腥，因为它试图不择手段地统一班图族后裔们的土地——包括大约2/3的非洲大陆——并根除或奴役任何没有班图族血统的外人。高度军事化和极端极权的马森格主义，依赖着基库尤人民的传统和茅茅运动神秘学实践的支持，宁愿让非洲血流成河，也要迎来第一个真正统一的班图帝国。"
 restructure_supply_system:0 "重组铁路系统"
 restructure_supply_system_desc:0 "通过重新引导建筑材料和铁路工人，我们可以在我们的一些铁路沿线快速建立少量临时补给站。然而，这并不是一个可持续性的铁路系统运行方式。\n\n§R这项决议仅可被执行一次。在建设三座额外的补给中心之后，这一加成将会消失。§!"
 commie_elfism_subtype:0 "马克思凯莉主义"
 heat_miserism_subtype:0 "热力小鬼主义"
 heat_miserism_subtype_desc:0 "§Y热力小鬼主义§!\n\n热力小鬼主义基于这样一个简单理念——“热力时代终将到来”而产生的一种思想。除了上述的热力时代理念，热力小鬼主义的追随者们为征服世界做一切他们能做的，从而恢复万事万物的真正秩序。尽管名字类似且这两个思想的创始人的是亲兄弟，热力小鬼主义与冰雪小鬼主义却只有一个类似点，对五十度范围的刻骨仇恨，他们一致同意应当不惜一切代价根除它。"
 zhdanovism_subtype:0 "日丹诺夫主义"
 zhdanovism_subtype_desc:0 "§Y日丹诺夫主义§!\n\n£GFX_ideology_zhidanov_bar\n\n\n\n\n列宁李可夫日丹诺夫主义，简称日丹诺夫主义，是俄罗斯社会主义政府的指导思想，其提出者为安德烈·日丹诺夫。日丹诺夫延续阿列克谢·李可夫的工作，他相信唯有强大的中央集权国家才能真正实现列宁的理想。日丹诺夫主义认定世界上存在着一种辩证现实，即苏维埃之善和资本帝国主义之恶的对立，认为只有通过建立新社会主义现实，并将俄罗斯各族人民统一在新苏维埃认同之下，社会主义才能取得胜利。日丹诺夫主义强烈反对人民社会党的布哈林派，认为新经济政策不过是披着伪装的资本主义阴谋，同时日丹诺夫主义也抵制季诺维也夫派的布尔什维克，认为他们不过是在拙劣地模仿共产主义，背叛了列宁的本愿。"
 radsoc_tridemism_subtype:0 "三民主义"
 radsoc_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 socdem_tridemism_subtype:0 "三民主义"
 socdem_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 wholesome_grinchism_subtype:0 "新圣诞老人主义"
 santaism_subtype:0 "圣诞老人主义"
 santaism_subtype_desc:0 "§Y圣诞老人主义§!\n\n尽管可能没有多少人了解它，但圣诞老人思想确是这个世界上最古老的意识形态，它描述了一种关于北极和圣诞老人本人的基本哲学与政策。圣诞老人思想的宗旨是以身为则，呼吁全人类对他人抱持和平和善意，该思想拥护者最著名的做法是留下玩具和礼物而只换取牛奶和饼干。从政治上讲，圣诞老人思想与任何可知的意识形态都不同，因为它的内涵已经超越了凡人所关注的鸡零狗碎的思想。"
 soclib_tridemism_subtype:0 "三民主义"
 soclib_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 authdem_tridemism_subtype:0 "三民主义"
 authdem_tridemism_subtype_desc:0 "§Y三民主义§!\n\n£GFX_ideology_soclib_tridemism_bar\n\n\n\n\n三民主义——又称“孙文学说”、“国父思想”、“总理遗教”——是“现代中国之父”孙中山为改善中国社会并使之现代化而提出的原则性政治思想，它围绕着民族主义、民权主义和民生主义三大理论展开。尽管实现和坚持这三大目标的途径可能会根据人们在消化已故孙中山先生的著作和思想后得出的具体解释而发生巨大变化，但所有对三民主义的效仿都是为了令中国进入荣誉和辉煌的新时代，为中国人民带来更大的繁荣与自由，以及在三民主义引导中国走向现代和乌托邦的命运之时，团结中国的各大社会阶层。"
 grinchism_subtype:0 "格林奇主义"
 grinchism_subtype_desc:0 "§Y格林奇主义§!\n\n或许将其描述为一种反意识形态的意识形态更为恰当，格林奇主义与其追随者只希望一件事：和平与安宁，他们在圣诞节期间尤为关注这一点。格林奇主义只有一个目标，一个任务，那就是终结永无止境的圣诞。没有什么比摧毁让人们快乐的东西，摧毁那些让人们唱圣诞颂歌、送礼物、寻欢作乐的东西更能让大家迅速的安静下来了。"
 snow_miserism_subtype:0 "冰雪小鬼主义"
 snow_miserism_subtype_desc:0 "§Y冰雪小鬼主义§!\n\n初来工坊的新意识形态——冰雪小鬼主义全部都围绕着一个简单展开：“冰雪时代终将到来”。除了“冰雪时代”的理念外，冰雪小鬼主义的追随者们为征服世界做一切他们能做的，从而恢复万事万物的真正秩序。尽管名字类似且两位创始人是亲兄弟，冰雪小鬼主义与热力小鬼主义却只有一个类似点，对五十度范围的刻骨仇恨，他们一致同意应当不惜一切代价根除它。"
 toy_santaism_subtype:0 "锡兵圣诞老人主义"
 toy_santaism_subtype_desc:0 "§Y锡兵圣诞老人主义§!\n\n锡兵圣诞老人主义又被称作律法圣诞老人思想，它是工坊中最富传奇色彩的意识形态。它的第一次出名是在“圣诞奶奶”危机中的圣诞老人265号所属的男高音圣尼克，他信奉锡兵圣诞老人主义，并试图给世界上所有淘气的孩子送煤，圣诞老人265很快阻止了他的行动，而锡兵圣诞老人主义也失势了。在政策方面，该主义只有一点点偏离圣诞节主题，偏离的地方是它不容忍任何孩子的淘气行为，并认为淘气孩子只配得到煤或者更糟的礼物。据该主义的追随者声称，此世中仅有少数人配收到玩具，他们认为这些能收到玩具的人是行于世间的圣徒，并对这些人有更高的期待。"
 marlib_crime_syndicate_subtype:0 "商业犯罪国度"
 marlib_crime_syndicate_subtype_desc:0 "§Y商业犯罪国度§!\n\n£GFX_ideology_crime_syndicate_bar\n\n\n\n\n与其说它是一种意识形态，不如说它是一种半标准化且高度可变的社会组织形式。犯罪国度从根本上是围绕犯罪、腐败和贪污建立起来的。从暴徒和黑手党到犯罪集团和秘密组织，都在一个由犯罪推动、不受法律约束的体系下控制着国家的各个方面。所有犯罪集团都秉承着一个共同的价值观：即通过非法但有利可图的手段追求利润和繁荣，这一特殊体制斯蒂芬妮·圣克莱尔和迈耶·兰斯基等传统黑帮首创，利用“无情”的资本主义，将犯罪团伙的非法收入来源转向合法或半合法的手段以避免麻烦。与正常的犯罪国度相比，商业犯罪资本主义表现得不那么威权，更关注利润而非传统，并将所有法律都置于底线之下。"
 fitzhughism_subtype:0 "菲茨休主义"
 fitzhughism_subtype_desc:0 "§Y菲茨休主义§!\n\n£GFX_ideology_fitzhugh_bar\n\n\n\n\n菲茨休主义，又叫新菲茨休主义、南方革命，是经由对现行体制幻灭的工程师乔治·威廉·克里斯蒂安斯之手再现于世的一种特立独行的“社会主义”思想。在那场撼动了美国国本的经济危机期间，克里斯蒂安斯创立了圣战白衫军组织，这一组织深受原宪章极权主义者、布尔什维克、技术官僚、三K党，乃至福特派的影响，而其中心信条则来自于“南方三大社会学家”。三人中排第一的是乔治·菲茨休，其认为整个国家体系都应以囊括全体人口，包括白人在内的奴隶制为根基，并实行严格的种姓制度，摒弃“1776圣哲”所谓的“天赋自由的异端邪说”。早期的菲茨休自诩是一位资本的反对者，支持福利国家政策，不过后来却转向了家长制垄断式资本主义。第二位是亨利·休斯，他提出了“担保主义”，即在国家的监管之下，雇主对劳动者实施奴役，并以“担保人”的身份为其提供包括交通、医保、新职位在内的一切便利，以此换取其劳动成果。最后一位，詹姆斯·邓伍迪·布朗森·德鲍相比于另外两位来说不是那么的“左”，他提倡在技术官僚的科学治理下，建立起独立的南方商业、农业体系。由克里斯蒂安斯重新发掘出的这些观念目前仍处于美国社会的边缘，但或许会有那么一天，“第二次南方革命”会一举扫清人们心中的“宪政”思想，以及反对把这一世界向着“放养式治理”的方向进行纠正的价值观。"
 social_futurism_subtype:0 "社会未来主义"
 social_futurism_subtype_desc:0 "§Y社会未来主义§!\n\n£GFX_ideology_social_futurism_bar\n\n\n\n\n社会未来主义由俄罗斯早期的立体未来主义与自我未来主义运动的大家所开创，并受到了马里内蒂等意大利未来主义者的影响，代表了试图将社会主义意识形态与未来主义这种新兴的文化现象融合在一起的左翼新式未来主义思想浪潮。如弗拉基米尔·马雅可夫斯基、纳塔莉亚·冈察洛娃和维克托·弗拉基米罗维奇·赫列勃尼科夫这样的社会未来主义者摒弃了未来主义中经常掺杂的右翼理念，取而代之地注入了乌托邦和科学社会主义思想，以开辟一条通向全新且充满赤红色彩的未来愿景的道路。在社会未来主义体系中，群众——将在中央政府、技术专家委员会或艺术先锋队的指导下——努力建立一个乌托邦社会，在不断发展的理论、政策、艺术等红色浪潮中，无休止地向前迈进，走向现代化、城市化的社会主义未来。"
 militant_atheism_subtype:0 "战斗无神论"
 militant_atheism_subtype_desc:0 "§Y战斗无神论§!\n\n£GFX_ideology_militant_atheism_bar\n\n\n\n\n正如马克思所断言，宗教是蛊惑人民群众的精神鸦片，而革命战斗无神论者则以彻底根除一切形式的宗教、切断把无产阶级同过去的失败束缚在一起的最后一根锁链为己任。虽然战斗无神论者所拥护的左翼思想之具体形式千差万别，但其通常与某种专制且高度军事化的社会主义相挂钩，并且偶尔还会带有以强烈的国家、民族、文化、公民认同来取代精神鸦片这一民族主义的基调。不过，所有这些组织都有着一个共同点，那就是致力于以奋战不息的反神权、反教权态度，将人类从各种形式的宗教和精神信仰中解放出来，并代之以党、国家的理性教条，或是某种能够团结各方的家长制做派要素，例如一位领袖或是其它充满吸引力的事物。"
 de_leonism_subtype:0 "德·莱昂主义"
 de_leonism_subtype_desc:0 "§Y德·莱昂主义§!\n\n£GFX_ideology_de_leon_bar\n\n\n\n\n德·莱昂主义由著名的库拉索裔美国工会活动家丹尼尔·德·莱昂率先提出，是一种为了适应美国的现实发展而来的“消极革命”的自由意志工团马克思主义形式，虽然其目的是团结起异彩纷呈又大相径庭的美国左翼，但在美国之外，德·莱昂主义也不乏其拥趸。德·莱昂主义者认为，为了在不依靠任何先锋队等职业化驱动力的情况下逐步将革命的共同印象付诸实践，广大的无产阶级必须在全国的各行各业组织起产业工会的同时，组建一个团结一致的左翼政党。德·莱昂主义是美国特有的半工团主义思想，它将马克思列宁主义思想同欧洲的工团主义理论相结合，为的就是创造出一个为民众而生、不受腐化专权荼毒的分权反官僚体制。因此，德·莱昂主义反对社会主义民主，认为它过于资产阶级化，也反对共产主义或极权主义，认为其不过是披着红色外衣的“国家资本主义”——德·莱昂主义试图在尊重美国及其各种劳工运动的现实和历史的情况下，为美国工团主义者、马克思主义者开辟出一条崭新的中间之道，构建出一架所有人都能够满意、都能够获得解放的新体制。"
 syn_georgism_subtype:0 "左翼乔治主义"
 syn_georgism_subtype_desc:0 "§Y左翼乔治主义§!\n\n£GFX_ideology_left_georgism_bar\n\n\n\n\n左翼乔治主义又称单一税制运动（为了与政治领域其他接纳整合了此一运动理念的思想区分开来，准确的叫法应为乔治进步主义），是美国经济学家、社会改革家亨利·乔治提出，后又经知名工会主义律师克拉伦斯·达罗等人发展而来的一种经济制度所演变成的成熟政治意识形态。乔治主义哲学的核心原则是，尽管人们应该重视他们自己生产的东西，但“经济租”——或一个地区的所有自然资源和其他公共物品——必须由社会中的所有成员平等拥有。乔治主义提出，唯一的税收应该是对土地价值征税，因为对经济租金征税只会导致效率低下和剥削。乔治主义主要关注的是经济，但也与从工团主义、进步主义到民主社会主义、左翼自由意志主义，再到某些无政府主义，甚至是更偏向右翼和中间派的非社会主义思想都存在着联系。不过，这些不同团体的共同点是致力于单一税制、土地的集体所有权和土地所提供的一切。"
 bellamyism_subtype:0 "贝拉米主义"
 bellamyism_subtype_desc:0 "§Y贝拉米主义§!\n\n£GFX_ideology_bellamy_bar\n\n\n\n\n贝拉米主义依附于爱德华·贝拉米及其追随者的著作和理论，也称为贝拉米思想，是美国本土创造的乌托邦社会主义理论，其追求在平民主义和进步主义盛行的民主社会中，推行农本主义和合作主义。最早在美国黄金时代，曾发生过以该主义为指导思想、以贝拉米的作品和《新国家报》为理论武装的乌托邦公社试验，贝拉米主义也因此为人所知。此后贝拉米主义不断流行，成为美国特色的主流社会主义模式之一，而该模式的理论根基来自于贝拉米阐释自己乌托邦社会计划的哲学著作（如《回望过去：2000-1887》、《平等》）和梦想未来世界的科幻作品。贝拉米思想支持以“消费卡”取代现行货币、“民族俱乐部”等理念，简言之，它代表着一种社会主义政治经济组织网络，并致力于实现全产业、土地的国有化，以公社集体所有和平取代私产，以此在不使用“社会主义”这个让美国人恐惧的字眼的情况下消弭竞争、滋育平等。此外，贝拉米思想在社会权利与自由方面也走在世界的前沿，动物权利、环境保护、女性生育权、女权、全民医保、言论表达自由以及各种不可剥夺的个体自由等其都有涉猎。贝拉米思想希望为所有人带来人道主义、平等主义、环保主义和平民社会主义，同时引导社会与人类天生的罪孽作斗争，最终走向新乌托邦。"
 georgism_subtype:0 "左翼乔治主义"
 georgism_subtype_desc:0 "§Y左翼乔治主义§!\n\n£GFX_ideology_left_georgism_bar\n\n\n\n\n左翼乔治主义又称单一税制运动（为了与政治领域其他接纳整合了此一运动理念的思想区分开来，准确的叫法应为乔治进步主义），是美国经济学家、社会改革家亨利·乔治提出，后又经知名工会主义律师克拉伦斯·达罗等人发展而来的一种经济制度所演变成的成熟政治意识形态。乔治主义哲学的核心原则是，尽管人们应该重视他们自己生产的东西，但“经济租”——或一个地区的所有自然资源和其他公共物品——必须由社会中的所有成员平等拥有。乔治主义提出，唯一的税收应该是对土地价值征税，因为对经济租金征税只会导致效率低下和剥削。乔治主义主要关注的是经济，但也与从工团主义、进步主义到民主社会主义、左翼自由意志主义，再到某些无政府主义，甚至是更偏向右翼和中间派的非社会主义思想都存在着联系。不过，这些不同团体的共同点是致力于单一税制、土地的集体所有权和土地所提供的一切。"
 dixiecrat_subtype:0 "迪克西派"
 dixiecrat_subtype_desc:0 "§Y迪克西派§!\n\n£GFX_ideology_dixiecrat_bar\n\n\n\n\n迪克西是来自美国深南的一种传统基督教保守主义，也因和旧民主党的关系而被称为旧民主党主义，他们强烈反对自由主义、左派、民权运动以及各种现代社会的罪恶堕落。迪克西和三K党等非法组织联系紧密，他们并不介意采用政治手段抑或更直接的途径来推行自己的理念。迪克西支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，他们是旧美国保守主义和传统的最后堡垒——为捍卫自己的地位，他们绝不吝惜采用暴力手段。"
 kemalism_subtype:0 "凯末尔主义"
 kemalism_subtype_desc:0 "§Y凯末尔主义§!\n\n£GFX_ideology_kemalism_bar\n\n\n\n\n“凯末尔主义”一词是指从奥斯曼大维齐尔穆斯塔法·凯末尔帕夏及其领导下的奥斯曼人民党的政治思想中产生的意识形态。这种典型的土耳其式意识形态致力于将老朽的奥斯曼帝国集权化并积极地实现现代化。凯末尔主义支持基于欧洲模式的世俗主义，认为只有通过将伊斯兰教从社会与政治生活中排除出去才能实现现代化，这让该主义备受宗教机构与苏丹亲信的批评。另一方面，凯末尔主义又通过宣扬土耳其民族主义并压制威胁帝国存亡的少数民族的分离主义来进行国家的集权化。这种意识形态在土耳其影响正盛，其虽招致了一些批评，但也被认为是解决欧洲病夫的痼疾的主要办法之一。"
 eco_syndicalism_subtype:0 "生态工团主义"
 eco_syndicalism_subtype_desc:0 "§Y生态工团主义§!\n\n£GFX_ideology_ecosyn_bar\n\n\n\n\n生态工团主义也称绿色工团主义，是正统工团主义新近出现的一个分支，提倡以受控和尊重环境的方式，推行工会化和工业化。生态工团主义者通常推崇绿色科技和方法，限制工业对生态系统和环境的影响，他们尝试融合环保主义理念，以及对田园牧歌式生活的追求与工业化、城市化、现代化的现实需求，将过去与现在的技术结合在一起，建立起经济发达、政治平等的工团民主主义，同时肩负起人类共享的生物圈的保护者一职。"
 eco_anarchism_subtype:0 "生态无政府主义"
 eco_anarchism_subtype_desc:0 "§Y生态无政府主义§!\n\n£GFX_ideology_eco_anarchism_bar\n\n\n\n\n生态无政府主义也称绿色无政府主义，是近期出现的一种社会主义理论，首创于地球伊甸园上最苍翠的角落。生态无政府主义的体制多种多样，但总体上提倡基于社群民主、农本主义、集体化、左翼自由意志主义和环保主义的无政府主义或半无政府主义体制，并包含其他环保和左派思想。生态无政府主义者将无产阶级和地球置于同等高度，他们希望废除损害、腐化这些正义社会支柱的压迫性国家体制，并相信除了神圣的地球母亲与追求缥缈的田园牧歌外，这世界上再无圣灵，也无主人。"
 mccarthyism_subtype:0 "麦卡锡主义"
 mccarthyism_subtype_desc:0 "§Y麦卡锡主义§!\n\n£GFX_ideology_mccarthyism_bar\n\n\n\n\n麦卡锡主义远称不上是系统的意识形态，而是对保守派共和党人兼狂热反工团主义者约瑟夫·麦卡锡那疯狂指控及言论的汇总。麦卡锡主义强烈反对一切形式的左翼思潮，还反对同性恋、反对移民、反对少数族裔，反对麦卡锡认为自己应该反对的任何事物。麦卡锡主义甚至对其所反对的理念的了解比对其支持的思想都更为清晰。这种松散的资本主义意识形态建立在美国共和党保守派的理论基础之上，但却将其中的传统主义和本土主义理念推向了极致，极力捍卫美式精神和美国梦。"
 national_conservative_subtype:0 "民族保守主义"
 national_conservative_subtype_desc:0 "§Y民族保守主义§!\n\n£GFX_ideology_national_conservative_bar\n\n\n\n\n民族保守主义是主流保守主义思想的民族主义变体，集中于维护国家的民族和文化特性。这些国家通常提倡传统的文化和社会价值观、孝道和家庭结构的重要性，以及爱国主义的单一文化主义。尽管他们的经济观念各不相同，从法团主义、混合经济到自由放任政策都有所考量，但通常反对全球化和国际主义。"
 national_restorationism_subtype:0 "民族复国主义"
 national_restorationism_subtype_desc:0 "§Y民族复国主义§!\n\n£GFX_ideology_national_restorationism_bar\n\n\n\n\n民族复国主义，也被称为龟壳主义，其被认为是青年俄罗斯运动的一个稍微遥远的分支。安纳斯塔西·旺夏茨基在成立全俄民族革命工农党，以所谓的“黑色先锋队”的形式，为高尔察克政权提供了准军事支柱的同时，确立了这一民族主义学说。与卡津别克一样，民族复国派怀抱强烈的民族主义，也具有君主制倾向，但不同的是，它对任何形式的布尔什维主义或社会主义都大加谴责，称它们是腐蚀俄罗斯灵魂的“苏维埃恶魔”。不过，令许多人惊讶的是，旺夏茨基其实非常重视保护自然与动物，尤其钟爱中国软壳龟，也就是符拉迪沃斯托克当地人口中的“远东龟”。"
 socdem_dixiecrat_subtype:0 "民粹迪克西派"
 socdem_dixiecrat_subtype_desc:0 "§Y民粹迪克西派§!\n\n£GFX_ideology_populist_dixie_bar\n\n\n\n\n民粹迪克西派是来自美国深南的一种传统基督教保守主义，也因和旧民主党的关系而被称为旧民主党民粹主义，他们强烈反对自由主义、左派、民权运动以及各种现代社会的罪恶堕落——不过不同于同僚的是，他们带有强烈的民粹主义性质。迪克西和三K党等非法组织联系紧密，他们并不介意采用政治手段抑或更直接的途径来推行自己的理念。迪克西支持南方民族主义、白人至上主义、种族隔离、美国例外论和州权神圣不可侵犯论，他们是旧美国平民保守主义和传统的最后堡垒——为捍卫自己的地位，他们绝不吝惜采用暴力手段。"
 technocracy_subtype:0 "左翼技官主义"
 technocracy_subtype_desc:0 "§Y左翼技官主义§!\n\n£GFX_ideology_technocracy_bar\n\n\n\n\n技官主义是一种政府形式，其中决策者根据他们在特定责任领域的研究与表现，特别是在科学或技术知识方面的表现来选择。尽管技术官僚思想在不同的意识形态中颇为常见，技官主义仍算是一种模糊的左翼意识形态：它倡导“能源核算”，试图推动社会文化全面加速并向一种全新、高效、理性发展的思维方式转变，同时还渴望创造一个摆脱了两党政治和派系主义的政治体制来寻求支持。左翼技官主义认为资本主义无法避免浪费，正如传统社会主义模式无法避免低效，并试图突破这两种模式，将人类引向一个开明的红色乌托邦。"
 pan_asianism_subtype:0 "泛亚主义"
 pan_asianism_subtype_desc:0 "§Y泛亚主义§!\n\n£GFX_ideology_pan_asianism_bar\n\n\n\n\n泛亚主义，也被称为亚细亚主义或大亚洲主义，是一种包含着各类不同思想的意识形态大类，其共通的最终目标是实现全亚洲人民之间经济或政治上的全面统一。泛亚主义的思想各不相同，包括从北一辉和大川周明的日本泛亚主义到孙中山的中国泛亚主义，但他们都一致希望全亚洲之间进行合作，并在面对西方或其他潜在对手时确保亚洲自身的利益。泛亚主义通常还希望创造一种全新的泛亚文化，这种文化通常（尽管不总是）植根于某种形式的东方哲学，如佛教，或其他无神论思想，如自由主义、君主制、社会主义、民族主义等。尽管面向全亚洲，但泛亚主义往往会提倡由某个或某几个亚洲民族占据主导地位，日本、印度和中国——也就是冈仓天心提出的三国思想中的本州、天竺和唐土——是泛亚主义常见的主导民族，尽管这一运动在东南亚、印苏林迪亚和其他亚洲地区也开始逐渐盛行。"
 paternal_socialism_subtype:0 "家长制社会主义"
 paternal_socialism_subtype_desc:0 "§Y家长制社会主义§!\n\n£GFX_ideology_patern_soc_bar\n\n\n\n\n家长制社会主义又称保守社会民粹主义，家长制保守主义，或在偶尔情况下在西方世界被称为基督教保守社会主义。这是一种古怪的意识形态，试图融合传统保守主义和非马克思的社会主义或进步民粹主义这些看似矛盾的思想。这一奇怪思想诞生自工业革命时期的英国和德国，但现在却在西方世界之外越发常见，比如拉丁美洲或非洲，那些地区并不适用欧洲发源的社会主义的规则和期望，因此转而寻求建立植根于宗教伦理，保守福利经济，阶级协作，公民民族主义和非极端爱国主义之上的道德保守社会。家长制社会主义通常与市场社会主义、基督教分产主义、慈善经济、俾斯麦国家社会主义、红色托利主义等各种财富分配方案相联系，尝试建立一套平等、非掠夺性的经济体系以对抗阶级斗争的理念。家长制社会主义将资本主义和社会主义思想融合在保守家长制的外壳下，为通常是传统主义者和民族主义者的本国人民谋福利，同时压制正统社会主义运动，以维持国家传统和社会稳定，即使这会导致他们与世界各地的其他社会主义者或保守主义者产生分歧。"
 social_machine_subtype:0 "社会机器"
 social_machine_subtype_desc:0 "§Y社会机器§!\n\n£GFX_ideology_social_machine_bar\n\n\n\n\nE·H·克伦普老大的南方社会机器在宪政国的保守派政治群体中独一无二。克伦普和他的社会机器——民主党政治机器——与在新美国已众所周知的公开种族主义和排斥少数民族主义保持距离，转而拥抱多样性，并借此来推进自己的腐败政治野心。运用着贪污、腐败、民粹主义，并通过将选民权利不分种族地扩大到所有公民，社会机器提出的新政将化身为一把切割开旧民主党森严等级制度的利剑，在克伦普腐败却柔和的手腕之下，妥协民主将变得高效、“平等”且光荣，以确保社会机器在未来的选举中以一种“民选威权主义”的形式占据统治地位。"
 authdem_pan_asianism_subtype:0 "泛亚主义"
 authdem_pan_asianism_subtype_desc:0 "§Y泛亚主义§!\n\n£GFX_ideology_pan_asianism_bar\n\n\n\n\n泛亚主义，也被称为亚细亚主义或大亚洲主义，是一种包含着各类不同思想的意识形态大类，其共通的最终目标是实现全亚洲人民之间经济或政治上的全面统一。泛亚主义的思想各不相同，包括从北一辉和大川周明的日本泛亚主义到孙中山的中国泛亚主义，但他们都一致希望全亚洲之间进行合作，并在面对西方或其他潜在对手时确保亚洲自身的利益。泛亚主义通常还希望创造一种全新的泛亚文化，这种文化通常（尽管不总是）植根于某种形式的东方哲学，如佛教，或其他无神论思想，如自由主义、君主制、社会主义、民族主义等。尽管面向全亚洲，但泛亚主义往往会提倡由某个或某几个亚洲民族占据主导地位，日本、印度和中国——也就是冈仓天心提出的三国思想中的本州、天竺和唐土——是泛亚主义常见的主导民族，尽管这一运动在东南亚、印苏林迪亚和其他亚洲地区也开始逐渐盛行。"
 pataut_authoritarian_liberalism_subtype:0 "威权自由主义"
 pataut_authoritarian_liberalism_subtype_desc:0 "§Y威权自由主义§!\n\n£GFX_ideology_authoritarian_liberalism_bar\n\n\n\n\n威权自由主义并不是种具体的意识形态，而是政治舞台上的一种奇异存在，它所追求的愿景偏离了一般的轨道。威权自由主义者们尽管支持建立强而有力又无所不包的行政部门，但他们并不想强制施加什么神圣准则、民族理想或是军事秩序，他们的目的仅仅是为大众带来自由。在经济领域，威权自由主义者往往有着迥异的观点，但大多数都赞成帮扶中小企业、为地方小家带来繁荣。在社会领域，威权自由主义总体偏向保守，但不同国家的不同国情也催生出了更加自由化，甚至极度进步的衍生思想。自由、繁荣、进步是人民所应该拥有的，即使是要将大声尖叫、踢腿哭闹的人民硬拽出那笼罩着他们的愚昧落后也要达成。"
 pataut_pan_asianism_subtype:0 "泛亚主义"
