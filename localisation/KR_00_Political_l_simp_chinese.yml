 neo_maurrassism_subtype:0 "新莫拉斯主义"
 neo_maurrassism_subtype_desc:0 "§Y新莫拉斯主义§!\n\n£GFX_ideology_neo_maurrassism_bar\n\n\n\n\n新莫拉斯主义指的是由法国哲学家与作家皮埃尔·布唐所发展而来的一种思想及其纲要。布唐以莫拉斯思想的继承人自居，并为实现“法兰西君主制度的复兴”对莫拉斯的学说进行了“必要的演变”。保留地方主义原则、宣扬古典主义、主张建立统一而分权的君主制度、拥护法团主义、拒斥共和理念等均是新旧莫拉斯主义的相通之处，但新莫拉斯主义亦有诸多创新之处。首要的就是“反法势力”的问题，布唐虽一开始对之深信不疑，但如今却得出了这一论断没有“科学”基础的结论，其对“真实国家”的团结统一也没有起到一星半点的作用。皮埃尔·布唐号召将矛头转向共和国的真正精英阶层、鼓吹革命理念的政客以及物质资本的持有者，无论其出身或宗教为何。话虽如此，皮埃尔·布唐依旧对共济会及其秘密结社方式的问题将信将疑，但这也不妨碍他对新教徒，尤其是犹太人采取更加宽容的态度，针对他们的迫害也完全结束，许多人甚至为此将他视作犹太复国主义的支持者。皮埃尔·布唐还主张以基督教存在主义的学说对抗虚无主义，并为卢梭等一直以来被法兰西行动批判的思想家平反正名。在布唐眼中，莫拉斯主义不单是一种政治上的意识形态，更是一种当之无愧的哲学流派，必须与经典的哲学学说一同传播教授。"
 lepenisme_subtype:0 "勒庞主义"
 lepenisme_subtype_desc:0 "§Y勒庞主义§!\n\n£GFX_ideology_lepenisme_bar\n\n\n\n\n“勒庞主义”一词与其说是一种指向明确、理论完备的意识形态学说，倒不如说是对受多方思潮影响的年轻民粹主义活动家让-马里·勒庞所行所言的总结。勒庞自称是一名“爱国者”、“民族主义者”，并利用这一符号以及长期为激进右翼所唾弃的法国共和传统尽可能地为自己争取群众的支持。勒庞好在媒体上大放厥词，制造争论话题，为的就是增加自己的曝光度，博个寻常民众的眼缘。勒庞的主要受众群体是工人阶级，按照他自己的说法，法国的传统知识分子与政治精英，无论左右翼，皆已辜负了民众，因此更应去相信他，相信这位真正的人民之子——这套说辞效果拔群，许多前左翼人物和共产主义者都因此而加入了其支持者的行列，形成了一种“有机个人崇拜”的现象，这种现象也叫做“左翼勒庞主义”。勒庞主义呼吁全体爱国赤子团结一致，共同对抗全球化、移民与“法兰西文化的崩解”，不惜一切代价保卫法兰西文化，推行外部观察家眼中的“民族优先”政策，即无论是工作分配、社会援助还是政治权利，国家都应以法国人民为先。宗教团体虽不是勒庞主义的主要受众所在，但勒庞主义者还是不遗余力地推广天主教，因为在其看来，天主教正是欧洲文化与法兰西文化的一大基本原则。此外，法国的历史也是勒庞主义的基本思想之一，它认为“正统”的法兰西民族都是高卢人和维钦托利的后代，从而否定了法兰西民族的历史进步性建设，而这在许多外人眼中是修正主义的体现。"
 humanisme_integral_subtype:0 "整体人道主义"
 humanisme_integral_subtype_desc:0 "§Y整体人道主义§!\n\n£GFX_ideology_humanisme_integral_bar\n\n\n\n\n整体人道主义也称作整体基督教人道主义，代表的是法国哲学家雅克·马里坦的思想综述，是众多基督教民主思潮流派的源头所在。在马里坦看来，单纯俗世上的人道主义并非完整的人道主义，因为它把人类存在的精神维度排除了在外，而没有了信仰的人道主义必定是缺失的，构不成一个整体。马里坦的哲学脱胎于圣托马斯·阿奎那，以经验和理性为出发点，独立于信仰之外，同时又与圣经不谋而合。马里坦认为，哲学是最基础的一门学科，它肩负着纠正其它一切次级学科的责任。马里坦排斥愚弄民众的基督教思想和传统神学，例如曾经他奉之为圭臬的莫拉斯主义，提倡基督教的多元化、民主化，认为这是基督教在如今的这一多极世界中所要经历的必然演化。整体人道主义把自然法则看作是人类道德的根源以及基础之所在，道德不是一种后天的构筑，而是人类的原始状态，正因有了道德，人才会自然地同同胞进行合作、实现相互之间的理解，而这也就解释了民主在这一理论中的优先性地位。"
 authdem_poujadisme_subtype:0 "布热德主义"
 authdem_poujadisme_subtype_desc:0 "§Y布热德主义§!\n\n£GFX_ideology_poujade_bar\n\n\n\n\n布热德主义，亦即布热德运动，指的是法国民粹主义者皮埃尔·布热德的意识形态。布热德认为，中产阶级的需求和福祉被大规模工业化进程抛在了脑后，而后又被精英们所谓“现代性”的重压粉碎得一干二净。诸如屠夫、面包师、杂货商、书商等中产阶级群体应背负起奋起反抗的责任，利用不乏布热德主义者们师从极右翼联盟的暴力手段，逼迫他人尊重其简单、保守、非意识形态的生活方式。布热德还反对其自认为的北方在法国政治经济领域的主导地位，并寄希望于通过为农业工人争取到与城市工人平等的地位来振兴南方。布热德鼓吹一种平等尊重各行各业的“软法团主义”，反对精英和学者所谓的“理智”，大力支持人民的“常识”。尽管与某些激进的民族主义者相比，布热德的反英立场较为温和。然而一些观察家却认为布热德恰恰是一个懂得将未受教育者对政治现状的恼怒利用起来的大煽动家。"
