 credo_legionario_subtype:0 "军团信条"
 credo_legionario_subtype_desc:0 "§Y军团信条§!\n\n£GFX_ideology_credo_legionario_bar\n\n\n\n\n军团信条，亦称军团神秘主义，是西班牙军官暨外籍军团创始人何塞·米连-阿斯特赖·特雷罗斯的个人意识形态。这一信条既是思想体系，亦是生活准则，为全体军团成员提供行动指南。米连-阿斯特赖的构想产生自两股思想源泉：其一为西班牙军团作为王国忠诚无畏的鹰犬之使命，其二源于他对日本文化尤其是东方武士道精神的推崇。虽然这位军团指挥官早在20年代与法国外籍军团共事时便接触此概念，但后来更吸纳了日本皇道派试图强化武士道影响力的理念，意大利军团成员在信条形成过程中亦有所贡献。信条被构想为一部“新教义问答”，深浸天主教神秘主义与极端宗教狂热，将军团式的基督教信仰由世俗崇拜转向对“善终基督”的军事化崇拜。军团在战火与救赎般的磨难中淬炼成形，旨在成为米利安-阿斯特赖理想中西班牙国家的缩影：对王权绝对服从，对剿灭敌人，无论是工团主义者、共济会员、共和派还是里夫叛军的狂热执着，以极端统一的意志凝聚一体，并对天主教会虔诚效忠。在其指挥官影响下，军团更发展出死亡崇拜，自诩为“死亡新郎”，哪怕需要自我牺牲亦会为事业竭尽全力。在米连-阿斯特赖企图构建的新国家中，军团骑士将成为国家的终极引导者，并获曼努埃尔·德尔加多·巴雷罗等极右翼盟友支持，共同构想由退伍军人与军团成员联合运作的法团主义国家。该信条还带有强烈的反智主义倾向，将除极右翼学者外的知识界视为软弱、阴柔的西班牙破坏者；而诸如摩尔人正规军等被多数西班牙人轻视的群体，反而被视作反革命斗争中的战友。尽管信条未将强烈的非洲殖民主义列为核心教义，但对许多军团军官而言，纠正西班牙在非洲瓜分浪潮中获益甚微的历史错误，与整顿半岛乱局具有同等重要意义。"
