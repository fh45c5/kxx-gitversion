 pataut_belgicism_subtype_desc:0 "§Y比利时主义§!\n\n£GFX_ideology_belgicism_bar\n\n\n\n\n比利时主义，或称比利时民族主义，是在佛兰德斯-瓦隆地区兴起的民族主义运动，旨在将瓦隆人和佛莱芒人打造成一个统一而有凝聚力的“比利时”身份认知。尽管经常以反动思想为基础，但比利时主义并不与特定的意识形态有着天生联系，它主要关注的是在促进种族融合和双语制的同时减少国家各区的自主性，尽管各个比利时主义运动往往会出于自己的偏爱而大力支持法国或荷兰其中一方。比利时主义深深植根于亲法的君权人民阵线和亲荷的民族协作联盟等组织，并经常与天主教法团主义、保守民族主义、军国主义和严格的威权主义等思想联系在一起。建立一个比利时国家和聚合文化的理念已传遍了低地国家的各种意识形态政治领域，尽管它大多数时候仍然是“比利时”极右翼的一部分。"
 flemish_nationalism_subtype:0 "佛莱芒民族主义"
 flemish_nationalism_subtype_desc:0 "§Y佛莱芒民族主义§!\n\n£GFX_ideology_flemish_nationalism_bar\n\n\n\n\n佛莱芒民族主义，有时也被称为佛莱芒运动，主要指活跃在佛兰德斯的右翼政党的意识形态。佛莱芒文化受到了各路政治立场的钟爱，而佛莱芒民族主义和各种激进民族主义党派（如斯塔夫·德·克莱尔的佛莱芒民族协会）间的关系也变得越发亲密。在大多数情况下，这些群体在社会方面较为保守，坚持极端反共和仇外的立场，并在经济方面信奉法团主义。他们的主要目标是建立一个包含整个佛兰德斯的独立国家。由于不利的条件，佛莱芒民族主义运动中的小部分人可能只寻求在统一的佛兰德斯-瓦隆国内实现自治，而其中绝大多数人梦想着与荷兰实现统一，从而建立大荷兰甚至是大尼德兰。"
 natpop_bolivarianism_subtype:0 "玻利瓦尔主义"
 rexism_subtype:0 "君权主义"
 rexism_subtype_desc:0 "§Y君权主义§!\n\n£GFX_ideology_rexism_bar\n\n\n\n\n君权主义是比利时激进派领导人莱昂·德格勒尔的思想产物，因此它还被称作德格勒尔主义或者比利时民粹主义。尽管君权人民阵线大体上奉行比利时主义，但是该党意识形态的确切性质偶尔会随着领导人的心血来潮而产生变化。德格勒尔的君权主义融合了法团主义、比利时主义、莫拉斯整合主义、反自由主义、民主主义、和平主义、军国主义、反议会主义、君主比利时统一主义、勃艮第复兴主义、右翼工团主义、反犹太主义和极端天主教主义等等乱七八糟的思想。除了最核心的理念之外，没有人知道党究竟会在何时站什么样的立场。君权人民阵线是由莱昂·德格勒尔一手组建的，这意味着它只为让德格勒尔实现自己的欲望，尤其是他对权力的无限野心而生。"
 natpop_flemish_nationalism_subtype:0 "佛莱芒民族主义"
 natpop_flemish_nationalism_subtype_desc:0 "§Y佛莱芒民族主义§!\n\n£GFX_ideology_flemish_nationalism_bar\n\n\n\n\n佛莱芒民族主义，有时也被称为佛莱芒运动，主要指活跃在佛兰德斯的右翼政党的意识形态。佛莱芒文化受到了各路政治立场的钟爱，而佛莱芒民族主义和各种激进民族主义党派（如斯塔夫·德·克莱尔的佛莱芒民族协会）间的关系也变得越发亲密。在大多数情况下，这些群体在社会方面较为保守，坚持极端反共和仇外的立场，并在经济方面信奉法团主义。他们的主要目标是建立一个包含整个佛兰德斯的独立国家。由于不利的条件，佛莱芒民族主义运动中的小部分人可能只寻求在统一的佛兰德斯-瓦隆国内实现自治，而其中绝大多数人梦想着与荷兰实现统一，从而建立大荷兰甚至是大尼德兰。"
