 corn_communism_subtype:0 "玉米共产主义"
 corn_communism_subtype_desc:0 "§Y玉米共产主义§!\n\n£GFX_ideology_corn_communism_bar\n\n\n\n\n玉米共产主义，也即赫鲁晓夫主义，是由尼基塔·赫鲁晓夫发展并理论化的左派思想。在俄罗斯及整个东欧蓬勃发展的赫鲁晓夫主义是苏式社会主义主流的一大分支，相比主流，它在某些社会、经济、文化政策上接纳了他们口中改革派的观点。赫鲁晓夫主义梦想以乌克兰的肥沃土地与发达的玉米产业为中心，辅佐以高度集权化、国有化的社会主义计划农业经济体制以及部分背离传统共产主义的自由化要素，建立一个自给自足、自供自续的体制。当然，为确保革命的安全，玉米共产主义仍会保有威权的色彩。虽然相比起某些集权思想来说略显“自由主义”，但赫鲁晓夫主义也在尝试建立融合了极权主义的高度集权、全面集体化、信息管控和政治独裁的混合体制，其对外欲图“赶超”西方世界，并在此过程中吸纳了西方的一些价值观和文化观，社会呈现消费型结构，极权主义思想蔚然成风，对内推行“内部殖民”，对农民进行着超额剥削。依靠玉米共产主义，还有赫鲁晓夫及其追随者培育的个人崇拜下，乌克兰将成为左翼世界之中肥沃、田园牧歌式、平等和自由的“玉米篮”，而伟大的玉米之主赫鲁晓夫将亲自使用他高超的“园艺”技巧满足人民的需要。"
 authdem_national_conservative_subtype:0 "民族保守主义"
 authdem_national_conservative_subtype_desc:0 "§Y民族保守主义§!\n\n£GFX_ideology_national_conservative_bar\n\n\n\n\n民族保守主义是主流保守主义思想的民族主义变体，集中于维护国家的民族和文化特性。这些国家通常提倡传统的文化和社会价值观、孝道和家庭结构的重要性，以及爱国主义的单一文化主义。尽管他们的经济观念各不相同，从法团主义、混合经济到自由放任政策都有所考量，但通常反对全球化和国际主义。"
 pataut_national_conservative_subtype:0 "民族保守主义"
 pataut_national_conservative_subtype_desc:0 "§Y民族保守主义§!\n\n£GFX_ideology_national_conservative_bar\n\n\n\n\n民族保守主义是主流保守主义思想的民族主义变体，集中于维护国家的民族和文化特性。这些国家通常提倡传统的文化和社会价值观、孝道和家庭结构的重要性，以及爱国主义的单一文化主义。尽管他们的经济观念各不相同，从法团主义、混合经济到自由放任政策都有所考量，但通常反对全球化和国际主义。"
 pataut_hispanism_subtype:0 "西班牙至上主义"
 pataut_hispanism_subtype_desc:0 "§Y西班牙至上主义§!\n\n£GFX_ideology_hispanism_bar\n\n\n\n\n为了与学术研究方面的西班牙历史、文化、语言至上主义等相区分，西班牙至上主义更准确的称呼是政治西班牙至上主义，其是拉丁美洲及前西班牙帝国领土上的政权的一种政治思想，核心内容是推崇西班牙或者伊比利亚文化与民族霸权。西班牙至上主义的政权致力于将本国彻底西班牙化，抹杀并同化原住民的文化、语言、宗教与传统，直至整个国家只剩下天主教西班牙的优等要素，在远离马德里本土的土地上创造出西班牙文明的天堂，再现先人神圣征服的功绩。"
 pataut_popular_patriotism_subtype:0 "大众爱国主义"
 pataut_popular_patriotism_subtype_desc:0 "§Y大众爱国主义§!\n\n£GFX_ideology_popular_patriotism_bar\n\n\n\n\n大众爱国主义经常被拿来描述与国家民粹主义运动结盟的进步民主党派，它不是一种具体的意识形态，更像是某种对处于相似困境中的群体的模糊印象。虽然也可以观察到共同的意识形态热情，但这种联盟往往是在绝望的处境下才会形成的。依此运作的政府试图将社会民主的福利和选举，与高度激进的公民爱国主义结合起来，同时既试图遏制最激进的民族主义，又狂热反对越过民主界限的一切社会主义。"
 sardism_subtype:0 "撒丁主义"
 sardism_subtype_desc:0 "§Y撒丁主义§!\n\n£GFX_ideology_sardism_bar\n\n\n\n\n撒丁主义，也叫作撒丁民族主义，是以撒丁地区主义为核心，追求撒丁国家主权与人民独立的一种政治运动。撒丁主义既致力于保护撒丁岛的独特文化、历史、语言和身份认同，也提倡保护岛上的自然风光和生态系统。由于保守势力基本与意大利民族主义相绑定（虽然这种对左翼的排斥并不是绝对的），所以植根于左翼政治和革命思想的撒丁主义就受到了撒丁行动党和其他自由派、进步派、左翼势力的追捧。撒丁主义的诞生最早可以追溯到18世纪早期西班牙将撒丁王国割让予萨伏伊家族之时，与撒丁岛君主制和其贵族荣耀息息相关，不过在某些边缘群体中也存在着共和版的撒丁主义。总而言之，撒丁主义者在政治观点上可以说是百花齐放，但他们基本都围绕着左翼或者“左翼”思想行动，都追求撒丁的民族自决。"
 soclib_sardism_subtype:0 "撒丁主义"
 soclib_sardism_subtype_desc:0 "§Y撒丁主义§!\n\n£GFX_ideology_sardism_bar\n\n\n\n\n撒丁主义，也叫作撒丁民族主义，是以撒丁地区主义为核心，追求撒丁国家主权与人民独立的一种政治运动。撒丁主义既致力于保护撒丁岛的独特文化、历史、语言和身份认同，也提倡保护岛上的自然风光和生态系统。由于保守势力基本与意大利民族主义相绑定（虽然这种对左翼的排斥并不是绝对的），所以植根于左翼政治和革命思想的撒丁主义就受到了撒丁行动党和其他自由派、进步派、左翼势力的追捧。撒丁主义的诞生最早可以追溯到18世纪早期西班牙将撒丁王国割让予萨伏伊家族之时，与撒丁岛君主制和其贵族荣耀息息相关，不过在某些边缘群体中也存在着共和版的撒丁主义。总而言之，撒丁主义者在政治观点上可以说是百花齐放，但他们基本都围绕着左翼或者“左翼”思想行动，都追求撒丁的民族自决。"
 soccon_generic_national_democracy_subtype:0 "民族民主主义"
 soccon_generic_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_generic_national_democracy_bar\n\n\n\n\n民族民主主义并不是种具体的意识形态，而是对一群具有相同目标的运动和党派的统称，他们希望通过强烈的民族认同和因地制宜的民主理念来推动国家的统一和民族的团结。民族民主主义发源于波兰和捷克，盛行于旧帝国残骸上诞生的新生国家之中。虽然宗教要素在民族民主主义中占了很大的比重，保守思想也在其间大行其道，但这些仅仅是为了凝聚民族意识而展现出的表象。根据具体党派的不同，自由市场，甚至于进步因素都有可能被囊括在民族民主主义之中。"
 generic_national_democracy_subtype:0 "民族民主主义"
 generic_national_democracy_subtype_desc:0 "§Y民族民主主义§!\n\n£GFX_ideology_generic_national_democracy_bar\n\n\n\n\n民族民主主义并不是种具体的意识形态，而是对一群具有相同目标的运动和党派的统称，他们希望通过强烈的民族认同和因地制宜的民主理念来推动国家的统一和民族的团结。民族民主主义发源于波兰和捷克，盛行于旧帝国残骸上诞生的新生国家之中。虽然宗教要素在民族民主主义中占了很大的比重，保守思想也在其间大行其道，但这些仅仅是为了凝聚民族意识而展现出的表象。根据具体党派的不同，自由市场，甚至于进步因素都有可能被囊括在民族民主主义之中。"
 authdem_social_credit_subtype:0 "社会信用理论"
 authdem_social_credit_subtype_desc:0 "§Y社会信用理论§!\n\n£GFX_ideology_socred_bar\n\n\n\n\n社会信用理论是由英国哲学家C·H·道格拉斯提出的一种经济分配理论，它主张政府向所有民众（不分生产者、消费者）发放无债货币，以应对大战后困扰多国的经济下滑和购买力长期不足的问题。社会信用理论认为体制是为人而生、为人服务的，而不是反其道而行之，因此，为了确保人民的绝对经济安全，金融法则需要被改写，经济支柱需要改弦易帜。社会信用理论提出了实现体制内所有人经济安全的第三条路，但右翼视社会信用理论为伪社会主义，而左翼则斥其为愚弄无产阶级的掠夺性经济。社会信用理论经常与基督教分产主义、经济融合主义、农业主义等基督教右翼思想（如果把“强者之证”算进来的话甚至还牵扯上了激进环保主义）相绑定。"
 social_credit_subtype:0 "社会信用理论"
