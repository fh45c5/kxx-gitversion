 natpop_national_conservative_subtype:0 "民族保守主义"
 natpop_national_conservative_subtype_desc:0 "§Y民族保守主义§!\n\n£GFX_ideology_national_conservative_bar\n\n\n\n\n民族保守主义是主流保守思想的民族主义分支，其核心在于维护国家的民族文化认同。奉行民族保守主义的国家通常推崇传统文化社会观、孝道伦理、家庭结构，以及爱国单一文化主义。虽然在经济立场上不尽相同，从法团主义、混合经济到自由放任政策皆有所考量，但普遍抵制全球化与国际主义思潮。"
 natpop_tribal_councilism_subtype:0 "部落共和议会主义"
 natpop_tribal_councilism_subtype_desc:0 "§Y部落共和议会主义§!\n\n£GFX_ideology_tribal_councilism_bar\n\n\n\n\n部落共和议会主义亦称部落市场民主制，指的是各类非西方化的传统土著社会，其或天然具备、或主动吸纳了类似于现代资本主义的西方经济体系，同时又维系着某种形式的民主制度。从新大陆的“美国化”部落，到殖民势力边缘的非洲孤立文化群体，此类社会形态差异显著，却存在着共同的追求：通过选举酋长或部落议事会实践代议共和制，在资本主义这场“白人游戏”中谋求繁荣发展。"
 socdem_venizelism_subtype:0 "韦尼泽洛斯主义"
 socdem_venizelism_subtype_desc:0 "§Y韦尼泽洛斯主义§!\n\n£GFX_ideology_venizelism_bar\n\n\n\n\n自独立战争以来，希腊民族解放事业与自由主义思想便密不可分，而埃莱夫塞里奥斯·韦尼泽洛斯将这种结合展现得最为淋漓尽致。这位民族领袖先是带领克里特希腊人赢得独立，继而实现与希腊本土的统一，此后更长期为守护民主发源地的神圣荣光而奋战。尽管在世界大战期间因站队问题与国王爆发冲突，加之“新希腊”——韦尼泽洛斯思想的主导区——多处领土最终沦丧及随之而来的动荡局势迫使他流亡维也纳，但其创建的自由党始终主导着希腊政坛的中立民主阵营。这位国父的继承者们将韦尼泽洛斯主义的信条奉为圭臬：以伟大理想为纲领的民族统一主义；体现为坚持公民民族主义、摒弃希腊传统保守桎梏的坚定共和思想；捍卫民主价值以抵抗工团主义革命浪潮的亲西方立场；以及植根于自由市场与投资理念、兼收社会民主主义元素的经济灵活政策。自由党人坚信，唯有他们才能守护希腊的真正自由，让全体公民在重建完整希腊共和国的共同梦想下团结奋进。"
 venizelism_subtype:0 "韦尼泽洛斯主义"
