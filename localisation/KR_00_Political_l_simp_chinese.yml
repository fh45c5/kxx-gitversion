 socdem_macedonian_federalism_subtype_desc:0 "§Y马其顿联邦主义§!\n\n£GFX_ideology_macedonian_federalism_bar\n\n\n\n\n自诞生以来，马其顿作为一个独立国家的概念便不甚明确。即便是马其顿内部革命组织这类团体的兴起，也未能为马其顿民族主义提供一个清晰的方向，该组织自身就分裂为亲保加利亚、亲南斯拉夫或主张完全独立的多个派别。然而，即便在如此分裂的背景下，一种独特的马其顿身份政治思潮依然保持着强大的影响力，那就是马其顿联邦主义。这一意识形态可谓一个“大帐篷”，通常由当地的左翼激进分子如米哈伊尔·格尔吉科夫和迪莫·哈吉迪莫夫等人倡导。与托多尔·亚历山德罗夫和亚历山大·普罗托格罗夫等更具亲保加利亚倾向的马其顿民族主义者不同，马其顿联邦主义者反对单一民族国家能够解决巴尔干民族问题的观点。他们主张建立一个覆盖整个巴尔干地区、拥有广泛自治权的大型联邦。这一联邦实体以瑞士为模型，旨在以自治与合作取代民族沙文主义与宗教狂热。在联邦体制下，自治被视为保障政治、经济、社会及宗教自由权利的核心手段。地方组织的地位将高于单一领导人，所有巴尔干民族都将获得平等代表权；为消除众多的语言障碍，格尔吉科夫等人甚至倡议将世界语采纳为整个巴尔干地区的官方通用语。虽然马其顿联邦主义思想主要由无政府主义者推动（例如格尔吉科夫所在的日内瓦团体），但其支持者也涵盖无政治倾向者、社会主义者、共产主义者，甚至一些右翼人士。该运动的某些派别还提出，特定区域内的所有居民，不论其民族背景，都应融入区域性的身份认同，例如让马其顿的阿尔巴尼亚人或土耳其人真正实现“马其顿化”，反之亦然。为推广这一理念，马其顿联邦主义者援引腓力二世、亚历山大大帝和亚里士多德等历史伟人，将其作为地方理想的高峰，意在联邦内部培育马其顿意识，并鼓励其他地区效仿。尽管在亲保加利亚倾向的民族主义者占据上风后，联邦主义运动逐渐式微，但马其顿的政治舞台始终充满变数。当地联邦主义者再度崛起，也并非全无可能。"
 socdem_centrist_subtype:0 "中间路线"
 socdem_centrist_subtype_desc:0 "§Y中间路线§!\n\n£GFX_ideology_centrist_bar\n\n\n\n\n民主中间派描述了一种专注于维持既定现状的政治观点。尽管各国情况各不相同，但中间派仍然团结在同一个中间地带，在各自的社会中寻求平等和等级制度之间的平衡。保守派和极端派都痛恨中间派，他们视其为骑墙派，但中间派毫不动摇地团结在已被证明行之可能的现状周围，既抵制激进改革，又排斥强硬的传统主义，就像他们为更大的利益而谋求在争吵的其他政党间充当妥协的媒介一样，因为中间派视稳定与平稳过渡胜于一切。"
 socdem_occultism_subtype:0 "赤色秘传主义"
 socdem_occultism_subtype_desc:0 "§Y赤色秘传主义§!\n\n£GFX_ideology_left_occultism_bar\n\n\n\n\n秘传主义是一个宽泛的术语，用于指代将神秘学纳入政府治理结构的各类政体。这类政权通常将治理资格从政治才能转向对隐秘文献乃至古代典籍的掌握；与此同时，在左翼秘传主义圈层中，也盛行从其他新时代或未来主义作品、科幻文本乃至纪实材料中汲取知识与灵感。秘传政权的影响来源极为广泛，涵盖治理者必须了解或运用于国家实践的诸多领域。然而在左翼神秘学研究的范畴内，其主要影响包括诺斯替主义、灵性论与通灵论、新德鲁伊教或新异教信仰，以及佛教、印度教、伊斯兰教、犹太教与基督教等主要世界宗教；此外，还有像高台教、和好教这样的东方教派，诸如中央刚果的马茨瓦主义或肯尼亚茅茅运动这类非洲反殖民信仰体系，以及像墨西卡约特尔的纳瓦特复兴者等各类受原住民启发的巫术与萨满实践所支持的新时代运动。尽管其中部分政权也由共济会派系或其他延续数个世纪的古老教团成员建立，但更多则源自泰勒玛教、阿耆尼瑜伽、神智学等现代新兴秘传组织。颇具讽刺意味的是，上述团体中的许多也可能直接反对秘传式治理，认为将此类封闭知识公之于众完全违背了隐秘传统，或担心神秘学与国家的结合会腐蚀魔法实践本身。无论面临何种阻力或受到哪些影响，秘传主义者在左翼思想光谱中随处可见，既有极权而民粹的邪教领袖，也有拥抱奇异新灵性信仰的社会民主主义者。尽管存在显著差异，左翼秘传主义者往往因在功能上被描述为知识或灵性层面的平等主义者而凝聚在一起。他们以各自独特的方式倡导正义、团结与启蒙，旨在通过不同路径实现彻底的社会变革。这也使他们与更为精英化、传统主义的右翼神秘学形式区分开来。不过，在关于民族主义、教条主义等观念应在我们不断演进的思想形态中占据何种位置的问题上，双方仍共享着相似的争论。"
 soclib_gandhism_subtype:0 "甘地主义"
 soclib_gandhism_subtype_desc:0 "§Y甘地主义§!\n\n£GFX_ideology_gandhi_bar\n\n\n\n\n甘地主义是对莫罕达斯·卡拉姆昌德·甘地思想、理念及毕生心血结晶的非正式称呼，不过圣雄本人以及对这一思想体系做出过重大贡献的同时代人，如普什图人的“边地甘地”阿卜杜勒·加法尔汗，从未使用过“甘地主义”一词。甘地主义以“悟力”为基础，“悟力”字面意思为“坚持真理”，是印度独立运动中的一种特殊思想形式，主张非暴力、民间抵抗。甘地主义者会以和平的方式抗议行恶的政府、政策，不诉诸流血暴力而以间接方式推动进步改革和社会变革，不到万不得已就不会使用自卫手段——不过，关于这一自卫规定其实也充斥着争议，甘地的许多弟子就坚持彻底的非暴力、不杀生。此外，甘地主义还倡导平等的宗教团结，尤其是因对立、仇恨而戕害这片土地达百年之久的印度教徒和穆斯林之间的团结（值得一提的是，甘地本人是从印度教角度出发，从禁欲思想中创造出这一理念的，而其好友加法尔汗则是以穆斯林的角度，从普什图族法典中得出的），以及非暴力的爱国主义、民族主义思想，还有人权与自由、斋戒与素食等。经济上，甘地主义推崇简朴生活、自给自足、以重视国民物质需求先于财富和工业化的农业为主的进口替代，以及从亨利·大卫·梭罗、列夫·托尔斯泰等社会主义思想家那儿借鉴来的乌托邦无政府主义、和平进步主义理念。虽然其“缔造者”有意回避甘地主义一词，甘地本人和“边地甘地”也不认可其为一种意识形态，但甘地主义还是对南亚内外的政治、文化和精神产生了重大影响，遍布全球的甘地主义者也在用除自卫外坚决不实施暴力的和平手段表达着自己的诉求。"
 soccon_yugoslavism_subtype:0 "南斯拉夫主义"
 soccon_yugoslavism_subtype_desc:0 "§Y南斯拉夫主义§!\n\n£GFX_ideology_yugoslavism_bar\n\n\n\n\n南斯拉夫主义又叫做南斯拉夫民族主义、南斯拉夫国家论，其认为南斯拉夫民族，即波斯尼亚人、克罗地亚人、马其顿人、黑山人、塞尔维亚人、斯洛文尼亚人（有时也包括保加利亚人），同属于一个南斯拉夫国家，他们因历史原因、语言隔阂、宗教分歧而分道扬镳，理应以某种方式组建起多元化的南斯拉夫国家，将整个民族重新聚在一起。当代南斯拉夫主义主要分为两派：整合派和联邦派，前者支持整合南斯拉夫主义，提倡一元主义、中央集权，不惜用胁迫的手段来大跨步实现南斯拉夫民族、语言各支的完全统一，而后者则推崇历史上的各个南斯拉夫族土地以自治的形式组建联邦，在不招致外部压力的情况下逐步实现内部的完全整合。虽然两派在观念上存在差异，但都拥护“民族一体”之说，所谓民族一体，即南斯拉夫人同属一个“民族”，身上流淌着同一“血脉”，说的也都是同一种语言，它既是为了在奥匈帝国内彰显出南斯拉夫民族的战略联盟，也是对帝国内部肆虐的日耳曼化、三元论、马扎尔化等妄图扼杀南斯拉夫的民族性，迫使其屈服于维也纳之思潮的回应。南斯拉夫主义团体内部对于经济和治理的看法各异，保王派、共和派、反动派、社会主义派等派阀也不断抬头，因此，南斯拉夫主义应着重于民族、语言、文化和历史的一体性，如此南斯拉夫团结的理念才能得到重视，南斯拉夫人才能走到一起，南斯拉夫民族的繁荣未来才能得到保障。"
 authdem_teetotalism_subtype:0 "禁酒主义"
 authdem_teetotalism_subtype_desc:0 "§Y禁酒主义§!\n\n£GFX_ideology_teetotalism_bar\n\n\n\n\n禁酒主义是对个人与社会实现完全戒酒，以及其他毒品和非法精神活性物质的一种实践与鼓吹，虽然自由主义或左翼之中也不乏禁酒主义的存在，但其还是常常被人视为与传统保守脱不开干系。一个纯粹的禁酒主义者与那些单纯的戒酒人士区别在于他们对禁酒理念的全身心投入和奉献，一些禁酒主义政党是在实现目标后就会解散的单一团体，不过，这也并不是说更有组织性、更广泛和更持久的禁酒主义政党不存在（在美洲和欧洲就有许多生动的例子）。在美国，禁酒党采用骆驼作为他们的象征，以表明自身“滴水不沾”。美国禁酒主义的立场来自于清教徒文化，而欧洲、印度与北美同样存在呼吁禁酒的狂热宗教团体。禁酒主义者在世界各地都很常见，但通常是更大规模运动的一部分，某种形式的宗教虔诚中穿插着禁酒运动是非常常见的，但也并非尽是如此。"
 pataut_macedonian_federalism_subtype:0 "马其顿联邦主义"
 pataut_macedonian_federalism_subtype_desc:0 "§Y马其顿联邦主义§!\n\n£GFX_ideology_macedonian_federalism_bar\n\n\n\n\n自诞生以来，马其顿作为一个独立国家的概念便不甚明确。即便是马其顿内部革命组织这类团体的兴起，也未能为马其顿民族主义提供一个清晰的方向，该组织自身就分裂为亲保加利亚、亲南斯拉夫或主张完全独立的多个派别。然而，即便在如此分裂的背景下，一种独特的马其顿身份政治思潮依然保持着强大的影响力，那就是马其顿联邦主义。这一意识形态可谓一个“大帐篷”，通常由当地的左翼激进分子如米哈伊尔·格尔吉科夫和迪莫·哈吉迪莫夫等人倡导。与托多尔·亚历山德罗夫和亚历山大·普罗托格罗夫等更具亲保加利亚倾向的马其顿民族主义者不同，马其顿联邦主义者反对单一民族国家能够解决巴尔干民族问题的观点。他们主张建立一个覆盖整个巴尔干地区、拥有广泛自治权的大型联邦。这一联邦实体以瑞士为模型，旨在以自治与合作取代民族沙文主义与宗教狂热。在联邦体制下，自治被视为保障政治、经济、社会及宗教自由权利的核心手段。地方组织的地位将高于单一领导人，所有巴尔干民族都将获得平等代表权；为消除众多的语言障碍，格尔吉科夫等人甚至倡议将世界语采纳为整个巴尔干地区的官方通用语。虽然马其顿联邦主义思想主要由无政府主义者推动（例如格尔吉科夫所在的日内瓦团体），但其支持者也涵盖无政治倾向者、社会主义者、共产主义者，甚至一些右翼人士。该运动的某些派别还提出，特定区域内的所有居民，不论其民族背景，都应融入区域性的身份认同，例如让马其顿的阿尔巴尼亚人或土耳其人真正实现“马其顿化”，反之亦然。为推广这一理念，马其顿联邦主义者援引腓力二世、亚历山大大帝和亚里士多德等历史伟人，将其作为地方理想的高峰，意在联邦内部培育马其顿意识，并鼓励其他地区效仿。尽管在亲保加利亚倾向的民族主义者占据上风后，联邦主义运动逐渐式微，但马其顿的政治舞台始终充满变数。当地联邦主义者再度崛起，也并非全无可能。"
 aranaism_subtype:0 "阿拉纳主义"
 aranaism_subtype_desc:0 "§Y阿拉纳主义§!\n\n£GFX_ideology_aranaism_bar\n\n\n\n\n阿拉纳主义，亦称萨比诺主义或传统巴斯克民族主义，是由运动之父萨比诺·阿拉纳所创，他逝世于1903年，随后其思想由其兄路易斯·阿拉纳·戈伊里传承，成为巴斯克民族主义中最具持久影响力的一支。该主义认为，巴斯克人不同于伊比利亚半岛的任何民族，因而需要建立一个独立的民族国家，其疆域应涵盖西班牙和法国境内的七个巴斯克省份。相较那些受商业巨头拉蒙·德拉索塔-利亚诺影响而持更温和立场的民族主义者，萨比诺·阿拉纳将巴斯克人视为一个高于西班牙人的种族，因其古老的血缘与炽热的信仰远超其他伊比利亚民族。为守护这一古老种族，阿拉纳主张仅鼓励拥有传统姓氏的巴斯克人通婚，其中父母双方都使用巴斯克语姓氏的少数人更被视为血统尤其纯洁。西班牙人，尤其是被称作“马凯托人”的外来劳工，则被视为侵蚀力量，企图同化巴斯克人。阿拉纳认为，唯有对巴斯克社会进行全面保护并通过彻底独立，才能确保巴斯克民族的完整存续。他设想中的自由巴斯克将是一个高度分散的联邦，这一构想融入了封建式理念。尽管后来的一些追随者态度有所软化，但对萨比诺而言，理想的巴斯克应当是一个公民广泛参与的神权国家。在经济层面，阿拉纳主义者否认资本主义，视其为西班牙统治强加的外来产物，转而推动巴斯克合作社体制、协同工会主义与贸易保护主义，以此作为经济发展的基石。路易斯·阿拉纳进一步补充，主张将女性排除在政治和经济领域之外，以使他们专注于为巴斯克民族培育新一代。此外，该运动延续了萨比诺强烈的反殖民立场，声援从加勒比海、非洲丛林到亚洲草原各地的民族解放运动。其另一独特之处在于，阿拉纳主义支持萨比诺提出的边缘语言学与起源理论，该理论推断巴斯克人起源于前罗马时代的意大利部落，并主张改革巴斯克语拼写体系，引入某些在其他语言中未曾出现的字母。尽管自萨比诺逝世后这一思想的影响力时有起伏，但在巴斯克独立运动中，温和派与阿拉纳主义者在民意支持上始终此消彼长，形成长期的拉锯之势。"
 natpop_washingtonism_subtype:0 "华盛顿家长制"
 natpop_washingtonism_subtype_desc:0 "§Y华盛顿家长制§!\n\n£GFX_ideology_washingtonism_bar\n\n\n\n\n华盛顿家长制，有时也被心存怀疑的讥讽者称为华盛顿主义、华盛顿美国主义，甚至“美国自己的公民宗教”。它描述了围绕着乔治·华盛顿将军的形象和思想而诞生的美利坚军国主义和威权主义的一种世俗化形式。华盛顿主义者着迷于美国最伟大的开国元勋，寻求创造一个能真正按照国父构想的美国梦来生活的社会——昭昭天命的扩张主义、公民民族主义、基督教道德、爱国主义、强势军国主义、反激进主义、杰斐逊资本主义，以及由家长式统治的军队操纵的威权共和民主，一切都是为了造福每一位美国人。在忠诚的军队、狂热的爱国者和日益增长的华盛顿个人崇拜的支持下，这些开国元勋梦想的先驱将为自由人的国度和勇敢者的家园带来秩序和荣耀。"
 natpop_jacksonianism_subtype:0 "杰克逊主义"
 natpop_jacksonianism_subtype_desc:0 "§Y杰克逊主义§!\n\n£GFX_ideology_jacksonianism_bar\n\n\n\n\n杰克逊民主主义，又称杰克逊农业主义、杰克逊主义、或是现在的新杰克逊主义，是美国特色的保守民主农业主义，其主要强调提高农业工人、农场主和农民的地位。以安德鲁·杰克逊的名字命名的这种杰克逊主义的变体得到了许多伟大的美国领导人的拥护，如范布伦和波尔克。杰克逊农业主义呼吁扩大财产所有权、推崇小农经济、鼓励政治分权和保守的平等主义，它将右翼的价值观和道德观与左翼对工人阶级的态度结合起来，以避免沦为社会主义和自由主义毒蛇的猎物。杰克逊主义坚定地反对精英主义，在很大程度上致力于实现前总统安德鲁·杰克逊的理想，并奉行杰斐逊主义、功利主义、古典自由主义、自由保守主义、民粹主义、自由放任经济等思想，以及由种族主义驱动，甚至带有极端民族主义色彩的美国昭昭天命的理想。同时，杰斐逊式的强大行政机构理念也在此抬升至了杰克逊式近乎至高无上的地位。"
 natpop_jeffersonianism_subtype:0 "杰斐逊主义"
 natpop_jeffersonianism_subtype_desc:0 "§Y杰斐逊主义§!\n\n£GFX_ideology_jeffersonianism_bar\n\n\n\n\n杰斐逊主义又称杰斐逊式民主、杰斐逊民主共和主义、杰斐逊自由农业主义，现亦称新杰斐逊主义，是美国对传统保守农业思想的本土化改造。该意识形态以国家农民与工人为主体，主张通过自由主义与民粹主义相结合的手段保障其权益，践行真正的民主共和精神，同时反对精英统治。杰斐逊主义以其创始人托马斯·杰斐逊为名，得到了詹姆斯·麦迪逊、詹姆斯·门罗等领导民众抵制汉密尔顿联邦党中央集权暴政的一众开国元勋的支持。杰斐逊主义反对美国社会人为制造的贵族阶层，警惕联邦权力的过度集中与政治腐败，其思想根基源于启蒙运动，强调以世俗美德构建社会价值体系，特别重视自耕农、种植园主、普通民众等基层群体的利益，并推行反教权主义、田园农业主义，推崇以帝国主义手段与昭昭天命论，依托强有力的行政体系，实现美利坚民族主义与势力范围的扩张。"
 possedism_subtype:0 "占有主义"
 possedism_subtype_desc:0 "§Y占有主义§!\n\n£GFX_ideology_possedism_bar\n\n\n\n\n“铲除贪得无厌的资本主义——走向占有主义！”弗里茨·克洛佩那群满怀理想激情的追随者如此宣告。身为导师、退伍军人、前钢盔团成员兼狂热集邮家的克洛佩，认为昔日战友已太过“资产阶级化”。于是，作为防卫之狼德意志男性与前线战士同盟的领袖，他开始构建一套既反对资本主义，又抗拒马克思主义的思想体系，因为资本主义催生了毫无节制的利己主义和对人民的冷漠无视，而马克思主义则导向有害的社会均质化，消磨人的奋斗精神与远大抱负。在他眼中，完美的制度应是如此：政府（已事先将一切国有化）授予“血缘共同体”中每位成员一份可继承的土地或商业份额，尽管国家仍保留在必要时进行干预的权力。融合自给自足的经济模式、通过行业公会实现的社团主义要素，以及国家对外贸的全面掌控，占有制将开辟一条理想道路，使人类摆脱自私、剥削与不公的平均主义。尽管克洛佩创造的这一术语本意侧重经济领域，却逐渐演变为他对民族革命的整体愿景：既要清除陈旧腐朽的反动政权，又要阻截自由主义的侵蚀。代表德意志男性与前线战士同盟的这群人，深受世界大战经历与战后威廉时代停滞期的影响，对旧帝国，即第二帝国深感幻灭。他们与近期同克洛佩结盟的默勒·范登布鲁克一样，呼吁建立“第三帝国”——一个真正适应现代的全新体系。依据狼人组织散发的各类宣传册与文件，这个新国家被构想为一个贵族统一体，由一位超越党派束缚的强有力国家元首领导，并依“部落”边界将行政区重组为\"大区\"，通过人口重新安置强化德意志人与乡土的联系。如此深刻的重构将使国家摆脱东西方外来影响，净化民族灵魂，进而催生基于“血统与功绩”的新贵族阶层——而这一次，贵族将从所有社会阶层中涌现。"
 kristlichen_lehre_subtype:0 "基督教义"
 kristlichen_lehre_subtype_desc:0 "§Y基督教义§!\n\n£GFX_ideology_kristlichen_lehre_bar\n\n\n\n\n在东普鲁士西尔金宁宫的高墙之内，居住着被人们称为“欧洲皇帝”的海尔格·阿拉里希·魏斯哈尔——若要探究其名字背后的秘传意义，他便象征着“万众的白发圣主”。然而在实际中，领导着“美善同盟”的则是库尔特·佩尔克。他出身于海关职员家庭，曾多次志愿参军，后来经营过邮购邮票乃至贩卖“灵魂镜像占星术”的“心理学”研究室等多种生意。这样一个人，确实可能深陷于约尔格·兰茨·冯·利本费尔斯的雅利安秘学教义之中，因此于1915年创立了“美善同盟——基于雅利安-基督教的新生命复兴协会”。后来，受雅利安主流思潮的影响，佩尔克试图建立自己的体系，最终孕育出“哥特善人”（“美善”与“哥特”两词的结合）。魏斯哈尔通过澄心冥想确信：“福音并未过时。”它们只需要被遗忘与被隐藏的真理重新发掘并予以升华。借助神秘学、神智学、雅利安秘学、灵性论、占星术与卡巴拉，从“基督、基督教到基督性”的进阶之路，将解开他口中的“基督教义”的奥秘。对其追随者而言，H·A·魏斯哈尔揭示了神圣灵魂在人类中达到完满发展的途径：每个人都处于五种意识状态之一——欲望驱动、知性、理性、灵性与神性。这些状态并不能完美地显现，必须通过不断的轮回方能臻至圆满；而在一个经过理性与灵性存有的本质与知识革新的中欧，每个人都将在这些阶段中找到属于自己的位置。这一进程将由“哥特善人”引领——他们并非沉溺于过去那种扭曲的日耳曼种族主义观念，而是一群在道德层面高度德意志化的新领袖，正如伦巴第人中高贵的“法伦”贵族。在许多旁观者看来，库尔特·佩尔克-魏斯哈尔的组织无异于一个教派式的秘密社团，甚至因其“世界统一”的自我使命，被怀疑与社会民主党和共产主义者有所牵连，更不惜实行多配偶制的“左手婚姻”以繁衍“哥特善人”的后代。然而，对于聚集在同盟中的信众、哥特善人骑士团的骑士，以及德意志领主团内殿的成员而言，通向灵性发展的道路，需要遵循其师尊灵性力量所命令的一切——哪怕有无数非人之物，在无尽的妄念中企图摧毁他尘世的躯体。"
 natpop_ustahsa_subtype_swap_tt:0 "我们将转向§F$ustahsa_subtype$§!"
 ustahsa_subtype:0 "乌斯塔沙"
 ustahsa_subtype_desc:0 "§Y乌斯塔沙§!\n\n£GFX_ideology_ustase_bar\n\n\n\n\n“匕首、左轮枪、机枪与定时炸弹——这些就是我们的圣像，是宣告克罗地亚独立国家黎明与复活的钟声！”乌斯塔沙成员如此宣告。作为伊利里亚政治中激进的民族主义派别，他们以极度虔诚的天主教信仰、对塞尔维亚人的狂热敌视、对工团主义与资本主义经济模式的双重否定，以及对“克罗地亚血统纯净性”的执着追求而著称。在早已纷乱不堪的巴尔干地区，乌斯塔沙仍堪称最残酷无情的民族主义运动之一。\n\n该运动源于哈布斯堡王朝在巴尔干（尤其是新兴的伊利里亚国）定居政策的失败，以及塞尔维亚人与瓦拉几亚人对原属克罗地亚人、波斯尼亚人聚居区的侵蚀。乌斯塔沙深受安特·斯塔尔切维奇与米兰·舒夫拉伊理论的影响，二人视克罗地亚为西方文明的堡垒之一，并主张克罗地亚人与波斯尼亚人因历史现实及共同抵抗塞尔维亚的“南斯拉夫主义”野心而命运相连。\n\n在其领袖安特·帕韦利奇的带领下，乌斯塔沙也从本地区其他反奥地利势力中汲取灵感，如意大利民族主义协会、罗马尼亚铁卫团，并在战术上借鉴了马其顿内部革命组织的经验。天主教信仰是乌斯塔沙的核心支柱之一，他们将虔诚的信仰与父权制家庭结构视为建立成功、公正国家的关键，并致力于打击亵渎行为与“有害的现代医学实践”（主要指避孕手段）。尽管乌斯塔沙在立场上极度反东正教，却宣扬“改信天主教的犹太人可重获血统纯净性”的理念。\n\n在经济层面，帕韦利奇领导下的克罗地亚民族主义者试图以社团主义原则构建集体社会，并将所有“国敌”（如塞族人、犹太人、罗姆人与共济会员）的企业国有化，将国家经济命脉置于威权政府手中。不过，小规模生产与私有财产仍可由克罗地亚业主掌握，而非收归国有。\n\n乌斯塔沙的政治目标随现实局势而变化，但不变的核心诉求是克罗地亚的独立，以及终结哈布斯堡王朝与塞尔维亚对该地区的野心。帕韦利奇旗下的民族主义者自视为哥特人在此地的正统后裔，理应建立一个新的“大克罗地亚国”，并期望构建克罗地亚人与波斯尼亚穆斯林联盟，共同抵御外界一切威胁。为实现此目标，任何残暴手段，包括恐怖行动、清洗乃至更极端的行径皆可为之。因为对帕韦利奇的刽子手们而言，没有“纯净”的自由，根本算不上自由。"
