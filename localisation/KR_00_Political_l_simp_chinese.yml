 kr.political.26.t:0 "如何查看游戏内的路线指南？"
 kr.political.26.d:0 "打开国家界面（点击国旗，或者按下“Q”键），点击领导人肖像下方的路线指南按钮（以前这里是中国阵营按钮）。点击望远镜按钮，会弹出一个事件告诉你如何进入各种路线（如果你游玩的国家有KX专属内容的话）。"
 kr.political.26.a:0 "嗷！我不会再像个憨批似的问怎么玩各种路线了！KX组太牛逼辣！"
