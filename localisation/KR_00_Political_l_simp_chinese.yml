 soclib_right_georgism_subtype:0 "右翼乔治主义"
 soclib_right_georgism_subtype_desc:0 "§Y右翼乔治主义§!\n\n£GFX_ideology_right_georgism_bar\n\n\n\n\n美国社会主义经济学家亨利·乔治提出了乔治主义这一左翼意识形态，而右翼乔治主义则是乔治主义的又一衍生。根据乔治生前的说法，相比起由“无限单一税制”延伸出的左翼乔治主义，右翼乔治主义以“有限单一税制”为根基，它提倡废除一切不公且低效的税收，建立起以地价税作为唯一税种的单一税收体制。右翼乔治主义所说的地价税与左翼的观点略有不同，它并不是要应用在社会的方方面面，而是只用于对群众和经济有利的某些地块、地区之中，不过如何界定、由谁来界定（是私人企业，还是公众，亦或是国家）、应用范围几何这些关键问题则因不同群体的意识理念差异而有着不同的说法。右翼乔治主义又可细分为两派，保守派认为应将地租的一部分用于有限的社会支出，其余部分由政府保管，进行投资，而自由意志派则坚持多出的租金应统一收集起来，分发给民众。总而言之，右翼乔治主义是一种形式多样、不断完善发展的思想理论，许多非社会主义的新兴政治运动都已将其纳入了自己的纲领之中。"
