 syn_platformism_subtype:0 "纲领主义"
 syn_platformism_subtype_desc:0 "§Y纲领主义§!\n\n£GFX_ideology_platformism_bar\n\n\n\n\n一种常见的意识形态谬误是认为无政府主义所倡导的无国家状态，必然导致社会陷入完全混乱——这一误解部分源于无政府主义运动本身松散、缺乏组织的特性。甚至许多无政府主义者也对这种内部低效感到无奈。尽管存在种种尝试性方案，却少有像纲领主义那样激进的应对策略。纲领主义诞生于俄国内战期间，当时俄罗斯无政府主义陷入混乱，克鲁泡特金派与巴枯宁派面对布尔什维克对其同志的监禁与流放几乎无力反抗。而后来乌克兰战线局势的发展，尤其是内斯托尔·马赫诺在当地建立的无政府主义地区，也为纲领主义的意识形态奠定了基础。该思想最初由流亡的俄国无政府主义者彼得·阿尔希诺夫在《劳动事业》杂志中提出，随后马赫诺逐渐成为其坚定支持者。纲领主义旨在通过建立无政府主义者的总工会，实现彻底的社会革命，并结束无政府主义者内部的分裂状态。该工会力图在特定地区为无政府主义者制定真正统一的政治纲领，将理论和战略结合起来，确保各团体不会因意识形态分歧而对立。其最终目标，是构建一个高效运转、紧密协作的组织，借助宣传、教育与必要的武装力量，切实推动一场深刻革命。虽然这种统一性需通过设立中央委员会来实现，但纲领主义者强调，这并非布尔什维克式的先锋队主义，因为运动中不存在强制性成分，所有革命决策与组织工作都采取集体方式进行。委员会的主要职责是保障无政府主义集体的运作与意识形态统一性，而在革命期间及之后，经济与社会将由自治的“苏维埃”进行管理，逐步向无政府共产主义过渡。纲领主义也面临诸多批评。例如塞巴斯蒂安·富尔认为其本质过于斯拉夫化或俄罗斯化，难以适用于西方社会；而弗谢沃洛德·艾亨鲍姆（更为人所知的名字是沃林）等人则视其为打造无政府主义政党的尝试，认为这损害了无政府主义的整体理想。尽管存在争议，马赫诺的支持仍帮助这一运动在全球无政府主义阵营中获得了更多认可，尤其是在西班牙，当地的无政府主义代表人物布埃纳文图拉·杜鲁蒂的追随者对其尤为推崇。"
 synthesis_anarchism_subtype:0 "合成无政府主义"
 synthesis_anarchism_subtype_desc:0 "§Y合成无政府主义§!\n\n£GFX_ideology_synthesis_anarchism_bar\n\n\n\n\n鉴于其强烈的反威权特质，无政府主义作为一个宏大的意识形态整体，其内部自然形成了众多相互竞争乃至对立的思潮、运动与理论派别。无政府主义者们对待这些分歧的态度虽各不相同，但在整个无政府主义阵营中，很少有其他思想能像合成无政府主义的倡导者那样，将对“多元即力量”理念的坚定拥护提到如此高度。这一思想主要由乌克兰无政府主义者弗谢沃洛德·艾亨鲍姆，更为人熟知的是他的笔名沃林，与法国理论家塞巴斯蒂安·富尔共同创立，而其思想根源则需追溯到无政府主义阵营内部历史上的种种分裂。面对共产主义、工团主义、个人主义等无政府主义流派间看似永无休止的争论，沃林与富尔分别提炼并发展出了各自的合成无政府主义理论。他们认为，不同派别应以共同理念和真诚团结为基础，组建一个松散的无政府主义联盟，以此形成统一战线，共同为集体的理想奋斗。与富尔的理论相比，沃林的观点深受他在乌克兰的经历影响。他主张，这种由平等成员组成的联盟应自然发展为一种自由而具备技术性集中的形态，同时毫不忽略任何无政府主义分支的力量，始终坚持将纪律与集体责任视为成功的关键。而富尔则认为，每一股无政府主义运动都应凭借自身的优势来促进整体发展，无政府工团主义为联盟带来群众基础和实践动力，无政府共产主义者负责理论构建并谋划未来平等主义社会的蓝图，个人无政府主义者则确保这场运动始终为个人发展与自由而奋斗。合成无政府主义带有极强的反威权倾向，其立场甚至超越了整个无政府主义运动的普遍立场，以至于常将其他旨在团结无政府主义各派的方案，比如纲领主义者所提的理论，视为对威权主义的危险妥协，等同于在组建某种无政府主义政党。虽然沃林与富尔未能在法兰西公社中赢得广泛追随，但他们的理论已对西班牙、朝鲜、意大利和乌克兰等地的无政府主义运动产生了深远影响。"
