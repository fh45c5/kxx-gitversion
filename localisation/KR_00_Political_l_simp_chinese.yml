 socdem_municipalism_subtype_desc:0 "§Y市政主义§!\n\n£GFX_ideology_municipalism_bar\n\n\n\n\n联邦主义与国家单一制的问题，是每个民族国家最终都必须面对的核心议题之一。然而，有人主张将政治资本的真正源头进一步下放至地方政府。市政主义，或其更具左翼色彩的应用形式，市政社会主义，正是这场辩论的直接产物。它试图通过将大部分政治影响力赋予市议会、公社、区镇或城市，从而在政治实践中真正实现微观层面的聚焦。市政主义的拥护者常常寻求建立村镇联盟，使国家不过是数千个小型“共和国”或共同体的集合。遵循市政主义路线的政治运动，往往致力于对抗国家中日益增长的世界主义或国际主义倾向。在存在霸权体制的国家中，市政主义可能作为在地方层面——城市或市政范围内——落实意识形态实践的方式出现，例如在由更中间派势力主导的国家中创建社会主义或无政府主义的公社组织，逐步将资本主义企业或近乎封建残余的村庄、城镇改造为集体所有的绿洲。市政主义通常采取非常传统的方法，摒弃激进变革，转而致力于改善地方机构，扩大水、能源、污水等必需品的公共所有权，并应对从压迫性租金到土地分配等基层问题。市政主义的追随者可以跨越整个政治光谱，从社会天主教和进步主义运动到共产主义和工团主义团体，但在法国、意大利和西班牙共和派中尤为盛行，例如西班牙总统弗朗西斯科·皮·马加尔和意大利社会主义者安德烈斯·科斯塔，以及英语国家的左翼组织，如美国的下水道社会主义运动和英国波普勒主义者。市政主义的元素也出现在巴西的整合主义者以及东欧（尤其是罗马尼亚）的众多农民民粹主义和民族自由主义运动中。虽然更中央集权团体的批评者继续谴责它是一种狭隘的教区主义群体，但其支持者认为，由于市政主义注重传统和面向人民的方法，这是让民众支持其特定倾向的最佳方式。"
