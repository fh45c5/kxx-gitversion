 syn_anarcha_feminism_subtype:0 "无政府女权主义"
 syn_anarcha_feminism_subtype_desc:0 "§Y无政府女权主义§!\n\n£GFX_ideology_anarcha_feminism_bar\n\n\n\n\n在一个民众不懈地反抗着压迫性、家长式政权的世界里，无政府女权主义的出现并不令人意外。无政府主义运动普遍反对政府和行政机构主导个人生活的理念，而无政府女权主义者则借助于更广泛的无政府主义思想及多元运动途径，力图打破这些政治结构所固化的性别不平等与社会传统角色。这一思潮萌芽于19世纪末加泰罗尼亚的政治沃土，由特蕾莎·克拉拉蒙特、特蕾莎·马涅等先驱者的著述孕育而生，在不到十年间便已传播至世界各个角落。女性争取赋权与独立的广泛斗争，无疑加速了该思想传入许多仍由强权把持、对女性角色持僵化观念的国家。被誉为无政府女权主义“开山祖奶”的埃玛·戈尔德曼，将这一思潮从理论转化为具体的生活方式。她主张个人必须真实地践行自己的信念，通过自主行动将理念变为现实。在众多无政府女权主义团体中，最为知名且最成功的或许是“自由女性”组织。它诞生于伊比利亚半岛多元活跃的无政府工团主义浪潮之中，其成立部分是为了抗议女权主义在西班牙和法国以男性为主导的无政府主义主流运动中被边缘化的境遇。无政府女权主义者将父权制与国家视为同一种压迫的不同表现，致力于终结传统婚姻制度，并持续倡导自由恋爱、生育自主权及性工作合法化等理念。这些思想汲取了个人无政府主义的养分，旨在塑造一种摆脱性别束缚、国家管控、社会成规与人际不平等的“新女性”形象。"
 anarcha_feminism_subtype:0 "无政府女权主义"
