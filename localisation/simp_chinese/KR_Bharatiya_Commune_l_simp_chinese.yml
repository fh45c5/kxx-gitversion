 IND_The_Lucknow_Conference:0"山羊与狮子"
 IND_The_Lucknow_Conference_desc:0"\n\n\n\n\n\n\n\n目前，印度正处于一个关键的十字路口，这是唯一一次化干戈为玉帛的良机。和平的橄榄枝已然落下，但这并不意味着和平的解决方案就此出现。此次谈判是正如山羊与狮子中的一个经典的不对称局面，德里方面虽在印度内战后元气大伤，但实力仍不可小觑，面对强大的狮子，作为绵羊的一方更不可轻举妄动，我们必须在谈判桌上智胜，来为自己争取更多有利的条件。\n\n§6德里方面在谈判桌上的权重： [?DEH.INDpower] / 50 §!    §R婆罗多公社在谈判中的的权重： [?BHC.INDpower] / 50 §!\n\n\n§Y会议紧张度： [?BHC.BOPpower] / 100§!"
