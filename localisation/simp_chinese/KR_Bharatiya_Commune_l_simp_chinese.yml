 BHC_the_congress_desc:0"大会开幕"

 BHC_March_forward: "前进前进向前进"
 BHC_In_response_to_Delhis_call:0 "响应德里的呼唤…"
 BHC_In_response_to_Delhis_call_desc:0 "在英国侵略者的铁蹄之下，我们丢失了我们文明古国的地位，而印度的心脏——德里，也沦于殖民者之手。如今古老的心脏再一次微弱的呼唤着她的孩子们，我们必须响应她的呼唤，这可能是我们最后的机会……"
 BHC_raise_the_flag_of_the_nation:0 "…举起民族的旗帜…"
 BHC_raise_the_flag_of_the_nation_desc:0 "印度的土地，养育了她的孩子。养育着这个曾经辉煌一时而如今已变得黯淡的国家。必须高举印度民族的旗帜，我们才能击退侵略者，让蒙难的国家得以重回正轨，实现民族的复兴。"
 BHC_inserted_in_the_great_Red_Fort:0 "…插在伟大的红堡…"
 BHC_inserted_in_the_great_Red_Fort_desc:0 "红堡作为印度灵魂的象征意义。它不仅是一座宏伟的莫卧儿建筑，更是印度从殖民枷锁走向主权独立的见证者。当三色旗升起于神圣的红堡，我们才能迎接民族尊严与自由的最伟大时刻……"
 BHC_let_it_fly_high_without_falling:0 "…让她飘扬不坠地"
 BHC_let_it_fly_high_without_falling_desc:0 "我们将伟大的旗帜树立于古老祖国的心脏，红旗是印度的自由，红旗是印度的尊严，红旗是印度的脊背……我们就守卫在此，绝不让他再一次折杆坠地……"
 BHC_Awaken_the_Indian_Tiger:0 "唤醒印度猛虎"
 BHC_Awaken_the_Indian_Tiger_desc:0 "“印度完蛋了，印度沉沦了，印度蒙难了……但印度奋起了，印度觉醒了，印度胜利了。”当吾等屹立于这光荣而伟大的时刻，我们将向世界宣告，我们醒了，就不会再次沉睡！"
 BHC_Memory_of_the_Father_of_the_Nation:0 "国父的记忆"
 BHC_Memory_of_the_Father_of_the_Nation_desc:0 "甘地的栉风沐雨，于乱世中支撑着革命者们与渴望自由的印度人民们，我们如今的壮大，正是因为我们站在甘地的基业上，让我们为伟大的国父再次高呼万岁！。"
 BHC_Try_War_Criminals:0 "审判战犯"
 BHC_Try_War_Criminals_desc:0 "我们胜利了，但我们的任务还没有结束，那些出卖祖国的人还没有被给予惩罚。我们是时候开庭审判，让那些小人们得到应有的报应了"
 BHC_Root_Out_the_Black_Sheep:0 "揪出害群之马"
 BHC_Root_Out_the_Black_Sheep_desc:0 "胜利不代表革命的结束，胜利在带来喜悦的同时，也会带来自满，让革命队伍出现不该有的陋习，我们不能坐视不管，我们应该积极的行动起来，对他们进行坚决的抵制和斗争。决不让革命队伍堕入深渊"
 BHC_Purge_the_National_Army:0 "整肃国民军"
 BHC_Purge_the_National_Army_desc:0 "军队是革命的支柱，我们必须将军队打造成一支忠于革命的利刃。而整肃军队，确保军队对革命的信心与忠诚正是我们达成目的的必由之路"
 BHC_Position_of_the_Third_International_Delegation:0 "第三国际代表团的位置"
 BHC_Position_of_the_Third_International_Delegation_desc:0 "除此之外，第三国际的同志们也发挥了重大的作用。我们务必要团结来自海外的同志。让我们在革命的道路上走得更快更远"
 BHC_Reorganize_the_Congress_Party:0 "重组国大党"
 BHC_Reorganize_the_Congress_Party_desc:0 "国大党在甘地遇刺前的种种，都警告我们不能重蹈其覆辙。在革命面前，我们要让国大党成为一个真正的，革命的党。那样，我们才能团结起来，坚持斗争，直到斗争胜利。"
 BHC_Fate_of_the_Gandhians:0 "“甘地主义者”们的命运"
 BHC_Fate_of_the_Gandhians_desc:0 "那些软弱的人，那些自称甘地信徒的懦夫，我们的革命容不得这种人肆意干涉。我们要让这堆污泥从革命者的队伍中洗去"
