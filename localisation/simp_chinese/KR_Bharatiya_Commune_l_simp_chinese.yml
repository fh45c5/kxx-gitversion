 BHC_LINE.1.t: "独裁者之死……"
 BHC_LINE.1.d: "如今统治着印度的最后的英国人——贾瓦哈拉尔·尼赫鲁。为自己的持续化状态的选择付出了惨痛的代价，一枚炮弹不偏不倚的正中了尼赫鲁的房间，等军警赶到之势。尼赫鲁的尸首碎块四散的洒落在现场，惨不忍睹。\n\n尼赫鲁之死留下了巨大的政治真空，杰汉吉尔·拉坦吉·达达博伊·塔塔作为钢铁巨头——塔塔钢铁的BOSS开始了他的行动，而军队方面，考尔也开始动员他的亲信，试图用枪炮夺取政权。而作为尼赫鲁政权的正统继承者，费罗兹·甘地也不会坐以待毙……\n\n尼赫鲁那朵标志性的红玫瑰已随爆炸化作焦炭，而他苦心经营的秩序也随之分崩离析，在这片焦土之上，一场关于印度灵魂的饕餮盛宴正拉开帷幕。杰汉吉尔·塔塔，这位冷静的工业巨擘，迅速将他的商业帝国转化为国家的临时骨架，塔塔钢铁的准军事安保接管了关键工业区，塔塔航空的机群绕过瘫痪的官僚系统接管了物资生命线，他试图在混乱中建立一个由技术官僚和资本法则统治的“公司国家”；与此同时，在新德里的午夜，考尔将军正披着尼赫鲁生前赋予他的政治宠光，指挥坦克履带无情地碾过议会大街的柏油路，他那双习惯了政治博弈而非实战指挥的手此刻死死抠住指挥刀柄，企图通过一场波拿巴式的政变，在旧日优雅的废墟上重建一套唯命是从的军管秩序；然而，在这两股钢铁洪流之间，费罗兹·甘地作为尼赫鲁政治遗产的唯一正统继承人，正站在德里红堡的断壁残垣下，凭借着“甘地”这个在数亿底层民众心中近乎神格化的姓氏，点燃了名为“民粹”的燎原大火，他通过电波向全境宣称任何僭越者都是对独立精神的背叛。枪炮、金钱与旗帜在季风来临前的闷热空气中剧烈碰撞，这场由工业巨头、野心将领和政治孤臣构成的三足鼎立，不仅是在争夺那一柄断裂的权杖，更是要将印度从统一后安宁幻梦中强行拽出，投入到一个由血腥而未知的未来……"
 BHC_LINE.1.a: "费罗兹·甘地击碎了阴谋"
 BHC_LINE.1.b: "考尔将军推翻了政府！"
 BHC_LINE.1.c: "塔塔钢铁渔翁得利，将政权收入囊中……"