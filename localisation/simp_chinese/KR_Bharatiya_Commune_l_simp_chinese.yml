 KXXBHC.1.t:0"战争之训诫"
 KXXBHC.1.d:0"我们应矢志不渝地追寻正义，然而须知，鲜血的倾洒绝无法催生正义之花。倘若印度在战争的烈焰中沦为一片焦土，即便最终赢得胜利，你们又能够统治些什么呢？不过是一片满目疮痍的废墟，以及满心仇恨的民众罢了。在此，我恳切呼吁，请暂且放下手中的武器，齐聚于谈判桌前。真正的社会变革，应立足于一个统一且和平的印度，凭借人民的觉醒与真理的力量得以实现，而非诉诸那永无止境的杀戮。"
 KXXBHC.1.a:0"祈愿上天庇佑印度"
 KXXBHC.2.t:0"和平的橄榄枝"
 KXXBHC.2.d:0"我国政府今天收到了来自[BHC.GetNameDef]领导人的信息。透过这条讯息，圣雄甘地希望我们两国间能够举行一次秘密谈判讨论和平统一的可能性，他要求这场会谈没有我们的欧洲盟友或其他人在场，只准让真正的印度人出席。人们不禁猜测圣雄究竟会提出些什么，大多数人认为这至少意味着我们必须退出协约国，而且他们预期这样的计划必然会遭到[BHC.GetAdjective]准则派的强烈反对。但是……如果这份提议真的能够成功呢？如果圣雄能够真正平息他们国内的极端分子，我们就可以避免流血地讨论建立一个只属于印度人联盟，这么做的话又会怎么样呢？[PRF.GetNameDef]会同意这样的协议吗，但我们应该这样做吗？"
 KXXBHC.2.a:0"话虽如此，但这次机会难得，值得一试"
 KXXBHC.3.t:0"德里决定参与峰会"
 KXXBHC.3.d:0"德里方面尽管他们对我们能否提出令他们欣然接受的建议，或是担忧我们不会因准则派极端分子的强烈抵制而率先陷入混乱，都抱有相当程度的怀疑。毕竟，德里作为印度的重要政治中心，长期在复杂的政治格局中周旋，对于各方势力的诉求和潜在风险有着敏锐的洞察力。他们深知，准则派极端分子在印度部分地区拥有广泛的影响力和一批狂热的追随者，这些极端分子坚决反对任何形式的统一谈判，认为这是对他们所谓“独立理念”的背叛，甚至不惜采取暴力手段来破坏会议进程。\n\n[From.GetAdjective]政府已然应允出席此次会谈。这一决定并非轻易做出，背后是政府内部多次激烈的讨论和权衡。\n\n无论如何，他们后者的担忧确实不无道理。峰会的消息，毫无悬念，定会在会议正式召开之前就泄露出去。这并非空穴来风，在印度复杂的社会环境中，各方势力都有自己庞大的情报网络和消息渠道。一旦消息泄露，准则派极端分子必然会借此大做文章，煽动不明真相的群众，制造社会动荡。他们可能会组织大规模的示威游行，甚至发动恐怖袭击，试图向政府和参会各方施压，迫使会议取消或者按照他们的意愿进行。\n\n届时，我们势必要与苏巴斯·钱德拉·鲍斯及其准则派势力好好清算一番……"
 KXXBHC.3.a:0"尽管前路险阻，但吾等愿为了南亚之和平携手共进！"
 KXXBHC.4.t:0""
 KXXBHC.4.d:0"我国政府今天收到了来自[BHC.GetNameDef]领导人的信息。透过这条讯息，圣雄甘地希望我们两国间能够举行一次秘密谈判讨论和平统一的可能性，他要求这场会谈没有我们的欧洲盟友或其他人在场，只准让真正的印度人出席。人们不禁猜测圣雄究竟会提出些什么，大多数人认为这至少意味着我们必须退出协约国，而且他们预期这样的计划必然会遭到[BHC.GetAdjective]准则派的强烈反对。但是……如果这份提议真的能够成功呢？如果圣雄能够真正平息他们国内的极端分子，我们就可以避免流血地讨论建立一个只属于印度人联盟，这么做的话又会怎么样呢？我们的命运会怎么样呢？我们应该这样做吗？"
 KXXBHC.4.a:0"为了和平，为了不再兵戈相见……"
