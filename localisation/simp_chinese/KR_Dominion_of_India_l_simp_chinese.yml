 IND_divided_india:0 "分裂的印度"
 IND_divided_india_desc:0 "1925年革命后，这片曾被称为英属印度的土地陷入了漫长而血腥的内战。最终形成的脆弱和平使得忠于英国的势力盘踞德里，印度民族主义者转进孟买，社会主义者则控制着加尔各答周边区域。三方势力均宣称对整个次大陆拥有主权，内战重燃只是时间问题。而这一次，似乎再无外力会驰援这些角逐者……"
