 POLITICS_GEORGE_FIFTH_DESC:0 "世界大战之后的几年里，英属印度遭遇了诸多问题。1925年的英国大革命鼓励了诸多印度的后来者，但北印度仍然向乔治国王（也是印度皇帝）效忠。但对英王来说，一个事实无法否认：印度自治领不再是当年的委任统治领，也不再是英国王冠上的明珠；王冠上印度之明珠是残缺的。大英帝国再不能维持对整个次大陆的铁腕控制，而只能在印度北方维持一个松散联盟——国王的形象因此严重受损，德里政府诸多成员也对此不满。许多成员希望与英王断绝一切关系，实行本地自治。但目前，英王仍统治着北印度，但他的权力已被削弱，曾经的铁拳也逐渐在软化。"
 POLITICS_EDWARD_DELHI_DESC:0 "爱德华八世在他的父亲乔治五世去世后，于渥太华举行了豪华的加冕仪式。这位年轻的君主在登基时显得格外庄重，他所继承的帝国无疑早已失去昔日辉煌，而王国则被工团主义者占领。这位国王并未退缩，他始终相信，联合王国的旗帜再次骄傲地飘扬在不列颠群岛的上空。"
 POLITICS_CHAMBER_OF_PRINCES_DESC:0 "王公会议最初是由国王乔治五世在世界大战期间设立的，目的是安抚愈发躁动的印度贵族。英国大革命一石激起千层浪，印度随后也遭遇了严重的动荡和政治暴力。为了维持稳定，英属印度的高层只能授予非选举产生的贵族大量政治权力，并最终将王公会议改组为印度两院立法机关中的上院。上议院将在印度总督去世时负责任命继任者。"
 POLITICS_GANGA_SINGH_DESC:0 "比卡纳王子甘加·辛格在世界大战期间体现出了优越的军事领导能力，并最终成为大英帝国战争内阁中唯一的印度成员。辛格不仅仅是一名军人，他还是一位精明的政治家，他通过倡导对印度冗杂的政治制度进行全面而渐进的改革，而赢得了大量的追随者。并且在推动改革的过程中，辛格与英国政府始终保持着友好的关系，并赢得了富有同情心的贵族们的钦佩。得益于他的声望，辛格的支持对于前任总督鲁弗斯·艾萨克斯将印度从大英帝国的附属国转变为独立的自治领至关重要。"
 POLITICS_RATANJI_DADABHOY_TATA_DESC:0 "杰汉吉尔·拉坦吉·达达布霍伊·塔塔，是印度可能最著名的实业家的儿子，杰汉吉尔就是以他父亲的名字命名的。世界大战期间，在德国占领巴黎前不久，他便逃离了这里。抵达德里后，杰汉吉尔父亲的病情日益严重，杰汉吉尔接管了塔塔商业帝国。在英国对印度的统治解体后，杰汉吉尔亲自资助了平叛行动，在这一过程中，他开始越来越多地参与自治领政治事务，最终被任命为印度国家银行行长。"
 POLITICS_ATUL_CHANDRA_CHATTERJEE_DESC:0 "外交官兼温和派劳工活动家阿图尔·钱德拉·查特吉曾经在英属印度的“印度公务员系统”中勤奋工作；英国大革命爆发时，他正担任英属印度高级专员，随后颠覆了印度的政治制度。他对于自治领外交部门的建立起到了至关重要的作用，甚至可以在出现问题时亲自管理国家的大多数外交官。在甘加·辛格被任命为总督之后，查特吉在印度政治中的表现变得更加突出，甚至与辛格建立起了友谊。查特吉一直在大力倡导国家保护印度工业工人的权利。"
 POLITICS_SRINIVASA_SASTRI_DESC:0 "斯里尼瓦萨·萨斯特里在脱离印度国民大会后成立了印度自由党，他以在英国大革命前不久就印度的自治程度问题进行谈判而闻名。萨斯特里曾因与印度地方自治联盟的暧昧关系而险些入狱，但他并不反对印度最近成立共和国的决定，他相当亲英，且认为英国建立的机构应该维持下去。"
 POLITICS_MINOCHER_MASANI_DESC:0 "米诺切尔·拉斯托姆·马萨尼是古典自由主义的坚定支持者，由于印度国民大会的社会主义倾向，他与印度国民大会决裂。马萨尼是一个魅力四射、心地善良的人，尽管在政见上存在分歧，但他与许多政敌，甚至是印度国民大会的敌人，保持着个人友谊。米诺切尔喜欢谈论最平凡的政治决策，他经常在议会上就财务决策和行政预算的细节发表持续数小时的演讲。米诺切尔对细节的关注和社交天赋为他赢得了大批政治追随者。"
 POLITICS_NARASIMHA_KELKAR_DESC:0 "纳拉辛哈·钦塔曼·盖尔卡尔由于国民大会的社会主义倾向而离开了印度国民大会。在英属印度崩溃前不久，盖尔卡尔和其他从国民大会叛逃出来的自由派成立了自治党，试图促进印度议会民主的建立。盖尔卡尔不仅仅是一个政治人物，还一位成就颇丰的剧作家，他的作品激发了印度人民日益增强的民族认同感和政治意识。"
 POLITICS_BALASAHEB_KHER_DESC:0 "巴拉萨赫布·甘加达尔·科尔是一名出色的律师，在英国对印度的殖民统治解体所招致的混乱中，他逃离孟买前往德里。科尔因倡导保护印度下层种姓的权利而在政治上声名鹊起，正是这些下层种姓群体给予了他最大的支持。科尔在政治生活之外也以同情不幸的人而闻名；他总是亲自参与慈善事业，偶尔还很可能会被发现亲自履行他的政治职责，比如协助建造新的孤儿院或为一个施舍厨房配备人员。"
 POLITICS_KANAIYALAL_MUNSHI_DESC:0 "卡尼亚拉尔·马内克拉尔·孟希是他家乡古吉拉特邦的一位著名作家；其作品的主题覆盖面相当之广，包括：法律、古吉拉特文化和政治理论。尽管曾是印度国民大会成员，但蒙西对社会主义一直持蔑视态度，并因其左倾倾向而退出了印度国民大会。孟希认为，为了确保印度人民的自由，并防止社会主义思想的潜在侵犯，必须保护人们财产权，同时必须打破印度地主对土地的垄断。"
 POLITICS_KRISHNA_MENON_DESC:0 "克里希纳·梅农经常遭受所谓“同情社会主义和印度国民大会”的指控，尽管如此，她还是成为了印度最杰出的政治人物之一。梅农是一个熟练的傀儡师，他在印度政治纸牌屋中的表现就像一位大师在下棋一样。随着他的政治盟友穆罕默德·阿里·真纳的去世，梅农被迫从暗影中现身，成为印度温和派左派的代表。梅农对西方和政敌抱有相同的不信任，他担心与大英帝国残余势力的任何持续联系都可能导致印度走向毁灭。"
 POLITICS_MUHAMMAD_ALI_JINNAH_DESC:0 "穆罕默德·阿里·真纳最初是为了提高穆斯林少数民族在国内的权益才步入政坛的。1916年，真纳组织起穆斯林和印度独立运动的领导人签署了《勒克瑙协定》，并在世界大战期间建立了全印度地方自治联盟，用于宣称印度自决原则。印度国民大会倒向社会主义后，真纳便离开了大会，建立了崭新升级的地方自治联盟作为自己的正式政党。"
 POLITICS_SIKANDER_KHAN_DESC:0 "旁遮普贵族、政治家西坎德尔·哈亚特汗及其联盟党于本届总统大选中脱颖而出。他最初是作为左翼分子穆罕默德·真纳的盟友而开始了其政治生涯，但随着时间的推移，他与真纳的关系越来越疏远。他加入了保守的联盟党，该党因不满真纳的领导、不同意真纳对土地再分配的支持而从地方自治党分裂出来。真纳和汗的决裂也在印度穆斯林之间造成了政治分歧。"
 POLITICS_CHHOTU_RAM_DESC:0 "焦图·拉姆在帮助组建了联盟党之后便退出了政坛，从而专心投身于社会工作。拉姆的工作使旁遮普的最贫苦人民的生活水平得到了显著提高，“焦图·拉姆”这个名字很快便在印度人民的嘴边传颂。回归政坛后，拉姆着手改革联盟党，该党已经从旁遮普贾特人和穆斯林的联盟演变为保护印度北部农村贵族的组织。"
 POLITICS_MALIK_KHIZAR_TIWANA_DESC:0 "马利克·基扎尔·哈亚特·蒂瓦纳从世界大战服役归来后，对席卷印度的分裂和政治暴力感到心烦意乱。于是蒂瓦纳便拿起武器对抗忠于孟加拉分裂政府的社会主义者。蒂瓦纳致力于为维持着脆弱的和平的印度次大陆带来统一。他加入了他家乡旁遮普省保守的联盟党，并很快上升为其领导层。"
 POLITICS_CHURCHILL_DESC:0 "温斯顿·伦纳德·斯宾塞·丘吉尔，前任英国海军大臣，现任印度总督。丘吉尔于1878年11月30日出生在牛津郡一个富有的贵族家庭，1895年参军入伍，先是被派往印度，而后又远赴非洲参加苏丹战役和第二次布尔战争。身为一名战地记者，丘吉尔因其对写作和祖国的热爱而名声大噪。1900年，回国后的他成功当选国会议员，在保守党和自由党中都有着受人尊敬的政治履历。直至大战爆发，灾难性的加里波利登陆战使他颜面扫地，被迫辞去第一海军大臣一职。随着德国逐渐取得上风，丘吉尔和他的同僚不由得开始担心这场大战的结果，出于对日不落帝国分崩离析的恐惧，他主张帝国在最为有利可图的殖民地——印度巩固自身的存在。作为印度帝国社团的主要喉舌，他要求对印度独立的呼声予以权威的回应。在工团革命席卷东部，王公势力夺取南部之时，位于德里的他很快成为了重建英属印度的铁杆支持者。如今丘吉尔统治着德里自治领，他迫切希望重新夺回整个次大陆的控制权，让这片他深爱的帝国的残余重沐荣光……"
