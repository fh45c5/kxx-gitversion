 DEH_PGI_resistance:0 "印度临时政府抵抗运动"
 delhi.1000.t:0 "英属印度陷落"
 delhi.1000.d:0 "大英帝国的杂种恶犬已经伏诛，其残兵败将全部仓皇逃离了印度次大陆，印度自治领（亦即世人口中的英属印度）整个落在了我们手中。如今摆在我们面前的是一个千载难逢的好机会：我们可以借此向协约国施压，同他们签署一份利好的和平条约，逼迫他们放弃印度，把我们的占领转化为既成事实。虽说这是眼下冲突最直接的解决方案，但也有人坚持称德里从来都不是我们的唯一目标，我们必须一鼓作气，击垮整个协约国。无论我们作何选择，全球的势力平衡都将因此而改变。"
 delhi.1000.a:0 "大使，来，去带回和平条约吧"
 delhi.1000.b:0 "杀出印度，直捣黄龙！"
