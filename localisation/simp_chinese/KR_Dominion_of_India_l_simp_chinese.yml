 DEH_war_fever_desc:0 "一种重新统一印度次大陆的狂热席卷了全国，首都的人群正在高喊着那些阻止印度统一的敌人们的名字！"
 DEH_churchill_empire:0 "直接统治印度"
 DEH_churchill_empire_desc:0 "印度帝国社团坚信，为了恢复次大陆的稳定与和平，必须重新建立前帝国的殖民政权。在帝国总督丘吉尔的领导下，英国在印度的剩余权力被集中起来，现在拥有的统治殖民地公民的权力比印度历史上任何时候都大得多……"

