 DEH_Industry1_focus:0 "发展德里的民用工业"
 DEH_Industry1_focus_desc:0 "我国的工业水平现在还处于较低的水平，我们应该集中精力研究适用于我国工厂的新设计。"
#focus
 DEH_construction1_focus:0 "开始建设民用工厂"
 DEH_construction1_focus_desc:0 "借助新技术，我们可以在全国各地开设新的工厂。"
 DEH_construction2_focus:0 "继续建设民用工厂"
 DEH_construction2_focus_desc:0 "我们应当继续建设民用工厂，来更好的服务人民。"
 DEH_construction3_focus:0 "完成建设民用工厂"
 DEH_construction3_focus_desc:0 "我们必须完成民用工厂的扩张，以确保在未来几年内能持续为人民提供服务"
 DEH_digging:0 "发展矿业"
 DEH_digging_desc:0 "为了为我们的工业提供原料，我们必须发展矿业。新的技术将帮助我们完成这一点。"
 DEH_railroads1:0 "发展印度铁路体系"
 DEH_railroads1_desc:0 "印度的铁路网曾经被誉为大英帝国的宝石，我们应当恢复这份荣耀。"
 DEH_railroads2:0 "继续恢复铁路网"
 DEH_railroads2_desc:0 "到目前为止我们扩建铁路网的工作已经取得了阶段性成功，但如果我们要为我军提供更好的后勤和运输支持，我们就必须继续这种建设。"
 DEH_production1:0 "开始扩建军用工厂"
 DEH_production1_desc:0 "我们的军工产业目前是相当低水平的，我们必须通过政治努力来扩建他们。"
 DEH_production2:0 "持续扩建军工厂"
 DEH_production2_desc:0 "虽然我们的军工产出得到了提升，但依然不能与婆罗多公社和王公联盟媲美，所以我们仍需努力。"
 DEH_production3:0 "完成军工扩展"
 DEH_production3_desc:0 "再加上一点点努力，我们就能将我们的军工业产出提到一个可观的水平。"
 DEH_new_economy:0 "新经济"
 DEH_new_economy_desc:0 "终于，我们摆脱了一潭死水的称号，现在我们可以说我们是一个崛起中的工业大国了，我们已经做好了准备来面对任何敌人。"
 DEH_ISAC:0 "加入帝国科学学术委员会"
 DEH_ISAC_desc:0 "通过帝国科学学术委员会，我们将通过资金和信息共享获得巨大的科研支持。"
 DEH_ISAC2:0 "从帝国科学学术委员会获益"
 DEH_ISAC2_desc:0 "我们收到了许多来自帝国科学学术委员会的学术支持，包括计算机和普查制表机的蓝图。"
 DEH_ISAC3:0 "鼓励帝国科学学术委员会科学家移民"
 DEH_ISAC3_desc:0 "通过鼓励帝国科学学术委员会的科学家移民我国，我们可以大大提高我们的研究水平。"
 DEH_ISAC4:0 "跨学科研究发展"
 DEH_ISAC4_desc:0 "我们已然扩建完成的工业、军工和科研基础设施带来了科研继续进步的巨大可能。"
 DEH_ISACnuke:0 "帝国科学学术委员会核研究计划"
 DEH_ISACnuke_desc:0 "帝国科学学术委员会已经开始进行一项原子研究项目，我们应当参与其中，因为它具有巨大的军事潜力。"
 DEH_ISACrocket:0 "帝国科学学术委员会火箭项目"
 DEH_ISACrocket_desc:0 "帝国科学学术委员会已经开始进行一项火箭项目，我们应当参与其中，因为它具有巨大的军事潜力。"
 DEH_armyreform1:0 "开始改革军队"
 DEH_armyreform1_desc:0 "我们的军队组织形式十分落后，白人军官和印度军人之间存在不少分歧，而这些导致我们的军队缺乏团结性。我们必须团结一致才能应对来自公社和南部反动王公们的压力。"
 DEH_princearmyreform:0 "王公私军的问题"
 DEH_princearmyreform_desc:0 "印度的军队分为正规军和王公的私军，这严重阻碍了战斗中的有效沟通，我们必须在事情恶化之前找出一个解决办法。"
 DEH_diarchy:0 "处理双重统治问题"
 DEH_diarchy_desc:0 "我们最迫切的问题是许多地区都实际上处于中央政府和地方王公的双重统治之下，中央政府的权力不能完全的传达到地方。总理正面对着巨大的压力来废除古老的间接统治制度并建立一个全新的民主而高效的地方行政系统。"
 DEH_doctrine:0 "选择作战理论"
 DEH_doctrine_desc:0 "我们必须为我军制定一个军事纲领，是应该强调速度和装甲、火力还是纯粹的人力？我们的官员正在辩论最佳行动方针。"
 DEH_motorized_focus:0 "印度军队摩托化"
 DEH_motorized_focus_desc:0 "印度是一个庞大的国家，有多种气候和地形。我们必须对我们的军队进行摩托化，使其更具机动性，也能够更好的应对威胁。"
 DEH_armor1:0 "印度装甲集团"
 DEH_armor1_desc:0 "为我们的军队装备装甲车可以让我们在对敌时取得优势。"
 DEH_armor2:0 "扩建印度装甲集团"
 DEH_armor2_desc:0 "我们必须继续建设我们的装甲兵集团，以保持在与我们敌人的竞争中的优势。"
 DEH_infantry_focus:0 "印度民兵现代化"
 DEH_infantry_focus_desc:0 "印度的军队数量庞大而且无比忠诚，但他们的装备已经过时了，我们必须纠正这个错误。"
 DEH_arty:0 "德里火炮现代化"
 DEH_arty_desc:0 "我军的炮兵主要还是上次大战时期的装备，我们必须更新这些装备，否则失去火力支持的陆军将任人宰割。"
 DEH_gurkha:0 "扩建古尔卡团"
 DEH_gurkha_desc:0 "古尔汗人是世界上最可怕的战士，我们应当确保他们获得足够的武器供应并得到最好的训练支持，这样他们才能执行好他们的使命。"
 DEH_naval_effort:0 "扩建皇家印度海军"
 DEH_naval_effort_desc:0 "我们的海军简直是个笑柄，没有堪用的码头，也没有造船能力。我们必须致力于创造维护海军所需的基础设施。"
 DEH_old_canada_ships:0 "购买加拿大舰只"
 DEH_old_canada_ships_desc:0 "加拿大有许多老旧的舰只，他们对我们的小海军而言依然是有用的，也许我们应该购买它们？"
 DEH_flexible_navy:0 "重视多用途海军"
 DEH_flexible_navy_desc:0 "我们的海军应当具有灵活应对不同作战需求的能力，即应当具备多功能性。"
 DEH_large_navy:0 "重视大型海军"
 DEH_large_navy_desc:0 "我们应当使我们海军的规模越大越好，以此获得对敌人的压倒性优势。"
 DEH_submarine_effort:0 "潜艇专注"
 DEH_submarine_effort_desc:0 "潜艇是对付敌军运输舰队的绝佳利器，我们应当大力发展这种武器。"
 DEH_cruiser_effort:0 "巡洋舰专注"
 DEH_cruiser_effort_desc:0 "巡洋舰在许多海军任务中都是不可或缺的主力，尤其是运输舰队护航和舰队护航。"
 DEH_destroyer_effort:0 "驱逐舰专注"
 DEH_destroyer_effort_desc:0 "驱逐舰是对付敌军潜艇的绝佳利器，我们应当大量建造它们来确保运输队的安全。"
 DEH_capital_ships_effort:0 "主力舰专注"
 DEH_capital_ships_effort_desc:0 "主力舰，包括战列舰和航母，是海军的绝对主力。我们应当大量建造主力舰来确保战略威慑。"
 DEH_rearm_marine:0 "重新武装皇家印度海军"
 DEH_rearm_marine_desc:0 "随着重新统一的印度开始与世界各国加大贸易往来，印度的航运安全已经成为当务之急。卡拉奇的海军参谋总长已经开始向总理请求要求盟友的援助，以便印度的商船在有护送的情况下深入公海。"
 DEH_aviation_effort:0 "扩建皇家印度空军"
 DEH_aviation_effort_desc:0 "我们的空军规模太小了，我们应当竭力扩大空军来确保制空权。"
 DEH_lalroy:0 "因德拉·拉尔·罗伊为军队效力"
 DEH_lalroy_desc:0 "世界大战中的传奇飞行员因德拉·拉尔·罗伊决定加入新印度空军，并作为一名飞行理论家指导教学。"
 DEH_fighter_focus:0 "重视战斗机"
 DEH_fighter_focus_desc:0 "我们应当把重点放在建造战斗机上，以确保对天空的控制。"
 DEH_bomber_focus:0 "重视轰炸机"
 DEH_bomber_focus_desc:0 "我们应当专注建造轰炸机，来从空中把敌人抹去。"
 DEH_aviation_effort_2:0 "持续扩建印度皇家空军"
 DEH_aviation_effort_2_desc:0 "我们应当持续扩建印度皇家空军，以确保完全的空中优势。"
 DEH_CAS_effort:0 "近地支援专注"
 DEH_CAS_effort_desc:0 "近地空中支援能够使得我们以足够的准确性精确支援前方，给我军带来巨大的优势。"
 DEH_NAV_effort:0 "重视海军轰炸机"
 DEH_NAV_effort_desc:0 "海军轰炸机允许我们在不需要拿我们宝贵的舰队冒险的情况下摧毁敌人的舰队。如果我们的海军规模不够或是忙于别的任务，海军轰炸机会派上大用场的。"
 DEH_expand_indian_air_force:0 "扩张印度空军"
 DEH_expand_indian_air_force_desc:0 "随着印度次大陆的统一，议会提出向印度空军投入更多的资金以建设一个能覆盖全国的印度空军体系。"
 DEH_prepare1:0 "为最终决战做准备"
 DEH_prepare1_desc:0 "我们不可避免的将在不久的将来面对婆罗多公社和王公联盟，在此之前我们必须做好准备。"
 DEH_fortify_princely_border:0 "要塞化与王公联盟的边界"
 DEH_fortify_princely_border_desc:0 "在即将到来的战争中我们的首要任务是稳固南部防线。依托于适合位置的要塞，我们将能够给南边的王公们狠狠的打击。"
 DEH_fortify_commune_border:0 "要塞化与婆罗多公社的边界"
 DEH_fortify_commune_border_desc:0 "在即将到来的战争中我们的首要任务是稳固东部防线。依托于适合位置的要塞，我们将能够给东边的公社狠狠的打击。"
 DEH_prepare2:0 "继续为最终决战备战"
 DEH_prepare2_desc:0 "现在我们的其他边界都是安全的，我们现在应当根据这一前提继续备战。"
 DEH_invadeBHC:0 "入侵工团印度"
 DEH_invadeBHC_desc:0 "东边的工团佬长期以来都是我们的心腹之患，现在我们应当抢先给他们一个“惊喜”。"
 DEH_revoltBHC:0 "在东方煽动叛乱"
 DEH_revoltBHC_desc:0 "我们的情报部门与隐藏在喜马拉雅山脚下的忠于我们的叛乱分子一直保持着联系。我们应当援助他们在阿萨姆邦发动叛乱，来缓解我们西部边界线上的压力。"
 DEH_BHC_revolters:0 "阿萨姆邦爆发起义"
 DEH_invadePRF:0 "摧毁南方的叛徒！万岁！"
 DEH_invadePRF_desc:0 "南方所谓的王公联盟只不过是分裂主义叛徒的罪恶巢穴，我们必须粉碎他们。"
 DEH_revoltPRF:0 "在南方煽动叛乱"
 DEH_revoltPRF_desc:0 "科钦新的王公拥有对大英帝国帝国的忠诚。如果我们能说服他加入我们，他们将会派出自己的军队帮助他们，而王公们的军队则会试图压制他的反叛。"
 DEH_PRF_revolters:0 "克钦的大君发起了叛乱"
 DEH_unifyindia:0 "统一印度"
 DEH_unifyindia_desc:0 "万岁！印度次大陆终于在我们的手中统一了！现在我们的目标又是什么呢？"
 DEH_bhutan:0 "确保不丹在我们的影响范围内"
 DEH_bhutan_desc:0 "地处边境多山的达旺地区理应是属于我们的。然而这个地区在世界大战期间被叛国的不丹人不法侵占。现在是时候重申我们对该地区的主权了，因为一个真正的印度国家已经重新建立！"
 DEH_nepal:0 "对尼泊尔的宣称"
 DEH_nepal_desc:0 "尼泊尔在上次大战后趁机向印度低地地区扩张，是时候夺回这些领土了。"
 DEH_madras:0 "整合德干"
 DEH_madras_desc:0 "印度南部的国家要么自愿加入印度，要么被征服——这是他们唯二的选择。"
 DEH_siam:0 "宣称暹罗控制的缅甸领土"
 DEH_siam_desc:0 "暹罗王国是曾经利用英属印度的混乱局势乘机介入干涉的机会主义“贪婪国家”之一。但由于新生缅甸国家的顽强抵抗以及阿萨姆邦与孟加拉社会主义者起义的压力，暹罗政府只能占领少数几个地区和县，其中包括在吉卜林的著名诗歌中提到的毛淡棉。这些土地必须回归到我们手中！"
 DEH_goa:0 "夺取果阿"
 DEH_goa_desc:0 "葡萄牙贸易城市果阿是次大陆欧洲殖民地的最后一个遗迹。我们必须占领它！"
 DEH_ceylon:0 "锡兰与德属印度洋殖民地"
 DEH_ceylon_desc:0 "锡兰和安达曼群岛应当是我们国家合法领土的一部分。帝国主义者们的殖民主义暴行必须被终结！"
 DEH_burma:0 "整合缅甸"
 DEH_burma_desc:0 "现在我们已经把缅甸解放了出来，把它整合成为了我们国家的一部分。"
 DEH_economyreform1:0 "印度经济计划"
 DEH_economyreform1_desc:0 "我们新任总理决定颁布一项重大的经济法案改革，然而它预计会在王公会议遭到辩论和抵制。"
 DEH_economyreform2:0 "产业重组"
 DEH_economyreform2_desc:0 "我们的新政府决定起草行业权利改革法案。"
 DEH_industryreformact:0 "孟买计划"
 DEH_industryreformact_desc:0 "议会已经出台了一项新的工业发展计划————孟买计划，这将对我们的经济产生重大影响。"
 DEH_movies:0 "印度电影：宣传机器"
 DEH_movies_desc:0 "充满活力的印度电影很有可能成为国家手中有力的工具，虽然现在还只是少数富人的玩物，但电影注定将具有广泛的社会效应。"
 DEH_unifyindia_2:0 "新印度崛起"
 DEH_unifyindia_2_desc:0 "印度不再一分为三，德里政府从开伯尔山口赢到了孟加拉湾。从加尔各答到海得拉巴，德里政府的合法性已经被印度的众多民族、种姓和宗教团体所接受。现在是印度走向未来的时候了，团结一致，永不分离！"
 DEH_princely_officers:0 "王公联盟的官员"
 DEH_princely_officers_desc:0 "现在的一个首要事件是如何与前王公联盟的官员打交道，我们应该给他们一个体制内的位置，还是在他们惹出更大的麻烦前让他们退休？"
 DEH_PRFreform1:0 "前王公联盟的改革"
 DEH_PRFreform1_desc:0 "在奥斯曼·阿里汗的专制统治下，南部地区的人民生活十分困苦。我们现在必须确保他们的生活水平得到提高，以此赢得他们的忠诚。"
 DEH_PRFreform2:0 "完成王公联盟改革"
 DEH_PRFreform2_desc:0 "南方的王公邦在政治上与海得拉巴的联系并不强烈，这是我们更难建立有效的中央集权，但无论如何，这是必须去做的。"
 DEH_bhartiya_officers:0 "婆罗多公社的官员"
 DEH_bhartiya_officers_desc:0 "现在的一个首要事件是如何与前婆罗多公社的官员打交道，我们应该给他们一个体制内的位置，还是在他们惹出更大的麻烦前让他们退休？"
 DEH_industry_question:0 "工业上的问题"
 DEH_industry_question_desc:0 "前婆罗多公社依赖于他们的国有企业，那些工业部门的负责人正向我们咨询他们接下来应该干什么。这个问题的答案将影响我们收复公社核心地区的难易度。"
 DEH_orissa_question:0 "地主庄园的命运"
 DEH_orissa_question_desc:0 "社会主义者被击败后，许多流亡的王公都希望在奥里萨邦恢复他们的地产，然而这么做意味着驱逐那些目前占据那些土地的民众。如果我们想巩固对该地区的统治，这个问题必须得到解决。"
 DEH_assam_question:0 "阿萨姆茶园的命运"
 DEH_assam_question_desc:0 "阿萨姆的广大茶园在他们的社会主义统治者们垮台之前都是国有企业，现在他们正在遭罪。如果我们想巩固对该地区的统治，这个问题必须得到解决。"

