 delhi.0.t:0 "印度自治领介绍"
 delhi.0.d:0 "当世界大战开始时，大英帝国阳光下的土地没有任何一块比印度更加忠诚的回应。正如一名记者所说，王公们为大英帝国拔剑出鞘。从西线的战壕到阿拉伯的沙漠，印度的军队顽强地为英王和荣耀而战。印度新生的民族运动们的领袖们预期通过全力参加战争来换取战后英国对印度自治的让步。然而，同盟国在西线和中东取得了胜利，英国不得不在1921年接受了鲁登道夫提出的光荣和解。这场失败并没有降低印度国内要求自治的呼声，但在世界大战中的失败让英国人背弃诺言，对印度反而收紧了政策，这使得印度独立运动愈演愈烈，各种破坏和恐怖活动遍布英属印度。当威尔士因为矿工被害事件爆发起义时，印度很快就效仿了这股革命潮流。为了保持在次大陆上的影响力，，在加拿大流亡的英国皇室决定给予印度一定的自治权，然而这并没能平息独立主义引发的骚乱，因此当第一次大选举行时，工团主义者们抵制了选举，反过来导致了忠于皇室的王公们在德里联合一致，而孟买和孟加拉，这两个民族主义和社会主义支持者们的中心也相继成立了不合法的政权。当印度国民大会在加尔各答宣布成立临时政府时，一场血腥的内战爆发了，紧接着就是南方王公们在海得拉巴的叛乱。尽管在前期遭遇了挫折，比如阿富汗人的入侵使奎达和白沙瓦分出喀布尔并在战斗中失败，但是甘加·辛格成功地凝聚了忠于皇室的力量，击败了加尔各答和海得拉巴的叛乱者们，并最终宣布自己为终身总督。"
 delhi.0.a:0 "英王乔治五世万岁！大君万岁！"
 delhi.1.t:0 "1936，德里最黑暗的时刻"
 delhi.1.d:0 "德里政府是英属印度的自称的合法继承国，但在境内多个派别正在争权夺利。进步的王公和资产阶级满足于其在威权主义政府中的统治地位，但激进的民族主义者和独立主义者仍在呼吁彻底驱逐英国人。红堡和全国中央议会内的紧张情绪都在上升。北方的阿富汗人注视着我们的一举一动，而腐朽的南部王公们在他们所谓的邦联中谋划着阴谋诡计。东边婆罗多公社的工团败类们可能会滑向极权主义，从而对我们造成更加巨大的威胁。改革是必要的，否则我们将不复存在。与此同时，就如亚历山大、莫卧儿和此前其他所有人一样，英国人永远无法统治印度！"
 delhi.1.a:0 "相信王公和帝皇！"
 delhi.2.t:0 "英属印度的遗产"
 delhi.2.d:0 "德里政府是德里王公国和旧殖民政府的奇妙混合，它由世界大战英雄甘加·辛格和他遗留自旧英属印度的政府班子管理，联合着西北部土邦的各王公。然而自印度进入自治状态已经十年了，改革的必要性已十分明显。"
 delhi.2.a:0 "为了上帝，为了帝皇，为了印度！"
 delhi.3.t:0 "英皇乔治五世去世"
 delhi.3.d:0 "被从故土驱离的英皇乔治五世最终败给了革命前就困扰着他的疾病。作为印度自治领的国家元首，他的死亡将给前英属印度的派系竞争带来变数。现在，来自本地的王公将持续摄政直到乔治的儿子爱德华的到来。"
 delhi.3.a:0 "整个协约国都为之哀悼"
 delhi.4.t:0 "阿富汗入侵！"
 delhi.4.d:0 "阿富汗对乔治五世驾崩后我国的虚弱不堪深信不疑，趁机发动了偷袭。这不是他们第一次这么干了，世界大战结束后，他们就通过这种手段窃取了白沙瓦和奎达。我们必须保护自治领！胜利属于印度！"
 delhi.4.a:0 "我们将把这些狗崽子踢回去并重夺领土！"
 delhi.5.t:0 "第四次英阿战争：胜利！"
 delhi.5.d:0 "哈比布拉汗在印度施加阿富汗影响力的野心已经破灭。自治领的军队已经越过杜兰线，夺回了失去的西北边境省份以及白沙瓦和奎达市，并准备直逼喀布尔。阿富汗已经完全陷入了混乱之中，她的人民正在震惊之余垂死挣扎。我们本打算收复所有失去的领土之后便见好就收，但一些当地的“死硬派”，如利奥·埃默里和前海军大臣温斯顿·丘吉尔，希望我们能够采取更加严厉的惩罚措施。他们呼吁彻底吞并阿富汗，并在阿富汗建立一个拥有自己的总督的正式自治领，然后最终将其纳入“英属印度”。然而，任何进一步的军事行动都将使我们在政治和军事上付出代价。"
 delhi.5.a:0 "我们不应当继续推进，毕竟阿富汗是帝国坟场"
 delhi.5.b:0 "建立傀儡政权，我们将把阿富汗这颗宝石镶嵌至我们的王冠上"
 delhi.5.c:0 "阿富汗人不过螳臂当车，何足为惧！向喀布尔进军！"
 delhi.6.t:0 "阿富汗总督"
 delhi.6.d:0 "现在阿富汗已经牢牢掌握在我们的影响力范围内，我们必须决定谁来统治阿富汗。帝国主义狂热粉利奥·埃默里因其对地方自治原则的强硬态度以及与印度帝国社团的关系而得到了不少的支持。他认为，保卫印度首先要确保在阿富汗有一个稳定的，最重要的是，一个忠诚的统治者。根据埃默里的说法，这意味着在我们战胜帝国坟场后，唯一的行动方针就是彻底、完全的征服。他在德里得到了几乎一致的支持，似乎是确保阿富汗这个不羁王国稳定的明确人选。"
 delhi.6.a:0 "任命埃默里为首任阿富汗总督！"
 delhi.7.t:0 "1936年王公会议"
 delhi.7.d:0 "上次于1911年为乔治五世登基而召开的王公会议，既是新君加冕之庆典，亦是宣读重大国策之机。如今，印度独立抗击阿富汗的进犯，大英帝国风雨飘摇，许多人都判断新君爱德华的权力将遭议会进一步削弱——虽说如此，其仍是连结此一次大陆各族群、文化及宗教团体的纽带。此外，备受保皇派拥戴的前海军大臣温斯顿·丘吉尔及其帝国印度社团，据悉正与国王有所接触……"
 delhi.7.d.nowar:0 "上次于1911年为乔治五世登基而召开的王公会议，既是新君加冕之庆典，亦是宣读重大国策之机。如今，许多人都判断新君爱德华的权力将遭议会进一步削弱——虽说如此，其仍是连结此一次大陆各族群、文化及宗教团体的纽带。此外，备受保皇派拥戴的前海军大臣温斯顿·丘吉尔及其帝国印度社团，据悉正与国王有所接触……"
 delhi.7.a:0 "印度皇帝[CAN_king_full_name]万岁！"
 delhi.7.b:0 "[CAN_king_full_name]万岁！印度总督甘加辛格万岁！"
 delhi.7.c:0 "[CAN_king_full_name]万岁！印度总督温斯顿·丘吉尔万岁！"
 delhi.8.t:0 "1936年自治领大选"
 delhi.8.d:0 "阿富汗已经得到处理，国家安全已得到保证，[CAN_king_first_name]国王决定举行选举。四大政党正在争夺人民的选票：V·S·斯里尼瓦萨·萨斯特里领导的印度自由党、纳拉辛哈·盖尔卡尔领导的社自自治党、穆罕默德·阿里·真纳领导的社民全印度地方自治党和西坎德尔·哈亚特汗领导的保守联盟党。"
 delhi.8.a:0 "印度自由党获胜！"
 delhi.8.b:0 "自治党制霸选票箱！"
 delhi.8.c:0 "真纳的左派横扫大选！"
 delhi.8.e:0 "联盟党继续当政！"
 delhi.9.t:0 "1936年自治领大选"
 delhi.9.d:0 "阿富汗已经得到处理，国家安全已得到保证，甘加·辛格总督决定举行选举。四大政党正在争夺人民的选票：V·S·斯里尼瓦萨·萨斯特里领导的印度自由党、纳拉辛哈·盖尔卡尔领导的社自自治党、穆罕默德·阿里·真纳领导的社民全印度地方自治党和西坎德尔·哈亚特汗领导的保守联盟党。"
 delhi.9.a:0 "印度自由党获胜！"
 delhi.9.b:0 "自治党制霸选票箱！"
 delhi.9.c:0 "真纳的左派横扫大选！"
 delhi.9.e:0 "联盟党继续当政！"
 delhi.10.t:0 "双头政治的问题"
 delhi.10.d:0 "我们正面临着一系列紧迫的问题，一系列自十年前甘加辛格篡权以来就一直存在的问题，即二头政治问题。自治领现在的由中央政府官员和地方王公共同统治国家的形式已经相当落后了，但试图废除这种古老的间接统治，并转而支持更有效和民主的地方行政模式的尝试很难成功，因为政权的基础就建立在西北王公对帝国的忠诚上，因此完全废除他们的特权可能是极不明智的。"
 delhi.10.a:0 "让王公们和平掌权，他们的忠诚毋庸置疑"
 delhi.10.b:0 "保证他们的年金，但取消他们的政治权利"
 delhi.10.c:0 "废除间接统治，废除王公制"
 delhi.11.t:0 "印度经济行动"
 delhi.11.d:0 "印度经济正在分崩离析，过时的贸易规定，腐败的收税者和外国投资的缺乏正在杀死我们的经济。商人，企业巨头和工业实业家们都在呼吁对经济进行自由化改革来改善自治领的经济状况，总理本人对包含了私有化，税制改革和控制通胀的改革条例并无抵触，但他担心这种程度的自由主义可能会大大伤害自治领的广大农村人口。"
 delhi.11.a:0 "印度的自由和利益需要更开放的市场！"
 delhi.11.b:0 "人民需要平衡的经济体系！"
 delhi.11.c:0 "单个国家，单一市场！"
 delhi.12.t:0 "[GetYear]年印度工业行动"
 delhi.12.d.liberal:0 "在我们决定重整印度经济格局后，自治领各处的劳工都开始呼吁政府保护工业和农业工人的权益，虽然从开伯尔山口到古吉拉特邦的工厂相对比较少，但是一份有利于工人的立法可能有助于阻止工团主义影响的渗透。然而，自由党的支柱是商业巨头和富有实业家，而他们从根本上反对各种工人运动。无论如何，政府将不得不作出有争议的决定。"
 delhi.12.d.swaraj:0 "在我们决定重整印度经济格局后，自治领各处的劳工都开始呼吁政府保护工业和农业工人的权益，虽然从开伯尔山口到古吉拉特邦的工厂相对比较少，但是一份有利于工人的立法可能有助于阻止工团主义影响的渗透。然而，自治党正面临一个艰难的选择。一方面，党的大量选票来源于解放后的中产阶级，他们积极地看待工人提高待遇，另一方面得到党内也收到了来自德里和拉合尔的工业家、银行家的大量经济和政治支持。在党派本身内部分裂的情况下，似乎只有总理本人才有权力通过决定。"
 delhi.12.d.jinnah:0 "在我们决定重整印度经济格局后，自治领各处的劳工都开始呼吁政府保护工业和农业工人的权益，虽然从开伯尔山口到古吉拉特邦的工厂相对比较少，但是一份有利于工人的立法可能有助于阻止工团主义影响的渗透。对真纳而言，摆在眼前的道路只有一条。要是拒绝改善产业工人的生活条件，他就会被扣上叛国的帽子。"
 delhi.12.d.union:0 "自上届选举联盟党胜选以来，印度业已停滞的经济改革重新开始，王公国家的地位得到确立。然而，西北部新生的工运组织要求政府立法支持更好的工人权益，这对我们的内阁的传统立场来说是很有争议的，但是改善工人权益运动正在拥有更多的追随者，如果我们采取反对的立场，很有可能将新兴的工会成员推到激进的工团分子那边去。"
 delhi.12.a:0 "工会只不过是工团主义的渣滓，取缔他们！"
 delhi.12.b:0 "我们将适度的逐步地执行工人们的请求"
 delhi.12.c:0 "无产阶级将不再受苦！支持工会！"
 delhi.13.t:0 "孟买计划"
 delhi.13.d:0 "我们的对手现已不复存在，我们可以将重心转移到民用工业上了。有三个提案被提出，我们应从中做出选择"
 delhi.13.a:0 "制定一系列五年计划"
 delhi.13.b:0 "制定一个平衡的制度，政府可以在必要时进行干预！"
 delhi.13.c:0 "自由的市场，自由的群众！"
 delhi.21.t:0 "缅甸问题"
 delhi.21.d:0 "缅甸曾是英属印度的一部分，但它最近这些年的发展进程充满坎坷。针对贡榜王朝的内部起义和石油工业的过度剥削都导致了国家的动乱，但现在，缅甸已经由我军从他们自己制造的麻烦中解放出来。然而，缅甸从来都只是英属印度的松散组成部分，政府内的一些官员强烈反对直接吞并麻烦的缅甸地区，反而主张在我们的指导下建立一个名义上独立的缅甸傀儡政府。"
 delhi.21.a:0 "恢复一个独立的缅甸"
 delhi.21.b:0 "将缅甸地区并入我国"
 delhi.21.c:0 "恢复贡榜王朝！"
 delhi.22.t:0 "[PRF.GetNameDef]地区的混乱！"
 delhi.22.d:0 "奥斯曼·阿里汗多年来的专制与蛮横自大终于促使南方王公们奋起反抗，十年内的第二次，迈索尔和特拉凡哥尔的土邦领主对中央政府的忠诚开始动摇，而卡纳达和马拉雅拉姆的部队则已经与忠于海得拉巴政府的军队交火，整个南方已经陷入一片混乱。虽然可能引起我们与海得拉巴政府的全面战争，[BHC.GetNameDef]也可能掺上一脚，但这依然是我们夺取孟买管辖区的大好时机，尼扎姆大人现在正自顾不暇，我想他应该不会介意的。"
 delhi.22.a:0 "向被占领的缅甸地区派遣士兵"
 delhi.22.b:0 "不，这计划太过冒险"
 delhi.23.t:0 "自治领军队开进孟买"
 delhi.23.d:0 "毫无疑问，自治邦正在利用我们的内乱来侵占孟买，来自[DEH.GetNameDef]的士兵已经越过边界进入孟买府，打算在我们内战期间完全侵占孟买。如果我们想阻止他们，我们将同时面对内乱和与北方的全面战争。"
 delhi.23.a:0 "我们毫无办法，让给他们吧"
 delhi.23.b:0 "我们必须为领土主权而战！"
 delhi.24.t:0 "孟买是我们的了"
 delhi.24.d:0 "正如我们所期待的那样，[PRF.GetAdjective]的军队根本腾不出手，只能发出无谓的抗议。当他们结束内战时，边界将成为既成事实。"
 delhi.24.a:0 "既成事实！"
 delhi.25.t:0 "与英国开战"
 delhi.25.d:0 "我们与大英帝国的战争意味着彻底放弃忠于任何来自英国的国王，毕竟，我们早已不是什么自治领了！"
 delhi.25.a:0 "为了新共和国！"
 delhi.100.t:0 "王公军队的情况"
 delhi.100.d:0 "除了在英属印度时期保留了相当一部分主权之外，王公们还保留了一系列私人军队，规模则从数百人到包含骑兵和步兵营的团级部队不等。现在，随着新政府已经对王公们的政治地位做出了决定，关于如何处理他们手中军权的议题已经被提上了台面。一些人认为王公应该保留对军队名义上的领导权，同时提升他们的军衔来使得他们的等级和军队中的等级对等。其他人则认为应当把王公们的部队直接置于议会的控制之下，作为和普通部队对等级别的军队加以整编。另一部分反动的贵族和大地主则主张保留现状，虽然这十分不受欢迎。"
 delhi.100.a:0 "将王公的军队置于议会的掌握之下"
 delhi.100.b:0 "将王公军队全部整编，但让王公保留指挥权"
 delhi.100.c:0 "保持现状，我们还不想闹翻"
 delhi.101.t:0 "尼泊尔的暴行"
 delhi.101.d:0 "在尼泊尔境内的印度人正在整个恒河——亚穆纳盆地发动反对尼泊尔政府的叛乱。由于尼泊尔陆军近期对庆祝印度教节日灯节的印度人发动过大屠杀，所以他们的抗议活动迅速成为暴力事件。现在，尼泊尔的印度人正在请求我们的干预。"
 delhi.101.a:0 "宣战！我们必须解救被压迫者！"
 delhi.101.b:0 "展开隐秘行动来控制他们的政府"
 delhi.101.c:0 "关我们什么事？"
 delhi.106.t:0 "[From.GetNameDef]向我们索取缅甸"
 delhi.106.d:0 "该死的[From.GetAdjective]政府要求我们交出缅甸，这是可耻的行为！"
 delhi.106.a:0 "没必要为这些无用的省份开战"
 delhi.106.b:0 "我们不知道什么缅甸地区，这里只有一个不可分割的暹罗"
 delhi.106.c:0 "召唤盟友共同防御！"
 delhi.106.e:0 "请求宗主国共同防御"
 delhi.107.t:0 "[From.GetName]屈服了"
 delhi.107.d:0 "[From.GetAdjective]政府明智的屈服于我们的要求并归还了我们所要求的缅甸领土。"
 delhi.107.a:0 "明智之举"
 delhi.108.t:0 "我们索取[From.GetAdjective]治下缅甸领土的请求遭拒"
 delhi.108.d:0 "我们的大使向[From.GetAdjective]提出的合理要求被无情地拒绝了，我们现在必须抉择是否使用军事手段或者接受这次可耻的外交失败。"
 delhi.108.a:0 "那么我们只能武力解放马来半岛"
 delhi.108.b:0 "放下尊严，收回请求"
 delhi.109.t:0 "[demand_country.GetName]威胁[From.GetNameDef]"
 delhi.109.d:0 "复活的[demand_country.GetAdjective]政府正在试图变更缅甸各省与我们[From.GetAdjective]盟友之间的边境线，鉴于[From.GetNameDef]占领的地区是通过武力夺取的，试图说服他们将十分困难，但直接放弃我们在印度支那的盟友也不是明智的行为"
 delhi.109.a:0 "宣布声援我们在曼谷的盟友"
 delhi.109.b:0 "给暹罗施压，迫使争议地区分裂"
 delhi.110.t:0 "[From.GetName]防御[SIA.GetNameDef]"
 delhi.110.d:0 "该死的暹罗政府藏在他们[From.GetAdjective]盟友的身后。我们认为是非法占领的小小边境冲突已经演变成了一次国际冲突！这可能超出我们的预期，但就此放弃也会对我们的外交产生灾难性影响。"
 delhi.110.a:0 "那么我们只能武力解放马来半岛"
 delhi.110.b:0 "这种战争只会给整个亚洲带来混乱……"
 delhi.111.t:0 "[From.GetNameDef]背叛了我们！"
 delhi.111.d:0 "[From.GetAdjective]向我们宣布他们无意在我们与[demand_country.GetNameDef]的冲突中保护我们，因为我们的领土是武力夺取的。他们建议我们放弃缅甸。"
 delhi.111.a:0 "那么我们将独自与入侵者战斗到底！"
 delhi.111.b:0 "割让争议地区"
 delhi.115.t:0 "[GetYear]年议会选举"
 delhi.115.d:0 "距上次民主选举已经过去四年了，从印度河口到喜马拉雅山脉，我们的官员正在数百万诚实的印度人的帮助下建立投票站，他们会履行他们的民主职责。宣传活动已经举行，印度各大支持民主的党派都在翘首期待。"
 delhi.115.a:0 "印度自由党取得压倒性胜利！"
 delhi.115.b:0 "自治党是今天的焦点！"
 delhi.115.c:0 "左翼的地方自治党横扫议会！"
 delhi.115.e:0 "联盟党的农绅联盟大获全胜！"
 delhi.115.f:0 "印度社会主义党掌权！"
 delhi.150.t:0 "西坎德尔·哈亚特汗爵士逝世"
 delhi.150.d:0 "印度最伟大的政治家之一西坎德尔·哈亚特汗爵士，于昨夜在旁遮普邦木尔坦的家中逝世。他是一位伟大的领导人和政治家，曾领导联盟党多年，并为其党派的保守思想大力宣传。现在他的继任者是焦图·拉姆爵士。"
 delhi.150.a:0 "逝者安息"
 delhi.151.t:0 "V·S·斯里尼瓦萨·萨斯特里逝世"
 delhi.151.d:0 "精明杰出的印度自由党领导人V·S·斯里尼瓦萨·萨斯特里在与疾病长期的搏斗后于昨日在家人和朋友的陪伴下安详地逝世了。他的继任者是年轻的经济学家米诺契尔·拉斯托姆·马萨尼。"
 delhi.151.a:0 "自由党缅怀最伟大的领袖"
 delhi.152.t:0 "甘加辛格之死"
 delhi.152.d:0 "有史以来最伟大的印度人甘加·辛格大君昨天在他比卡内尔邦的皇宫去世。他曾在英国军队和印度军队中服役并创造了辉煌的履历，在工团和王公暴动中建立了稳定的合法政府。现在印度比以往任何时候都强大，但他的位置很难弥补。"
 delhi.152.a:0 "全印度的人民都为之哀悼"
 delhi.152.b:0 "才华横溢的大亨J·R·D·塔塔继承总督之职"
 delhi.152.c:0 "严厉的外交官A·C·查特吉继承总督之职"
 delhi.153.t:0 "巴罗达的瑟亚吉拉沃·加耶克瓦德三世去世"
 delhi.153.d:0 "今天上午，瑟亚吉拉沃·加耶克瓦德在他巴罗达的宫殿中逝世，他是一位威严而果断的领导人，拥有独立思想的执政官，他从不对英国和英属印度政府奴颜婢膝。他的孙子，以节俭著称的普拉塔普·辛格·加耶克瓦德将继承他，他以拥有和他爷爷一样浓厚的种族主义情绪而闻名。"
 delhi.153.a:0 "逝者安息"
 delhi.154.t:0 "穆罕默德·阿里·真纳去世"
 delhi.154.d:0 "穆罕默德·阿里·真纳，也许是现代印度最伟大的政治家，也是印度统一和宪政政治的执着追求者，昨晚在梦中安详地去世了。他塑造了崭新的德里政府，并从工团主义和封建主义手中保护了印度的民主。他的继任者，下一届地方自治党主席是V·K·克里希纳·梅农。"
 delhi.154.a:0 "全印度最好的绅士已经不在了"
 delhi.155.t:0 "卡奇的肯格尔吉三世去世"
 delhi.155.d:0 "一位进步的令人尊敬的王公，卡奇的肯格尔吉三世今晚在他位于古吉拉特的布杰的住所去世。他开明的统治持续了67年，在他死后，人们将沉痛悼念他。"
 delhi.155.a:0 "逝者安息"
 delhi.156.t:0 "米安·法兹尔-侯赛因爵士逝世"
 delhi.156.d:0 "为联盟党的基础，土绅/农民联盟做出巨大贡献的米安·法兹尔-侯赛因爵士在长期的疾病之后去世了。虽然他已经由于疾病长期没有出席党派内的活动，但他绝不会被我们所忘记。"
 delhi.156.a:0 "联盟党不会忘记他"
 delhi.157.t:0 "伯蒂亚拉的布平德尔·辛格去世"
 delhi.157.d:0 "旁遮普的伯蒂亚拉土邦的王公，受爱戴的进步人士伯蒂亚拉大君布平德尔·辛格昨天在家人的陪伴下去世，作为世界大战的老兵，他是比卡内尔的甘加·辛格的亲密战友。他的大君之位将由他的长子，亚德温德·辛格继承。"
 delhi.157.a:0 "真是一场悲剧！"
 delhi.160.t:0 "加拿大出售旧船"
 delhi.160.d:0 "虽然我们英国购买的大多数船只都太旧或者太差，无法作为军舰来使用，但它们仍能作为运输舰服役。而且我们怀疑其中一些船仍然可以正常的作为军舰使用，这将是一个很好的机会，可以帮助我们主宰印度洋。"
 delhi.160.a:0 "让我们看看我们能买些什么……"
 delhi.161.t:0 "重建皇家印度海军"
 delhi.161.d:0 "随着印度次大陆的统一，我们与世界其他地区的贸易往来变得更加频繁，印度航运的安全变得愈发重要。然而皇家印度海军目前的状态对船只的雇佣和军官的训练都有很大不利影响。英帝国拥有传统的海军情结，加拿大和澳大拉西亚的造船厂和海军学院都为英帝国控制大西洋和太平洋提供了足够的力量，因此，卡拉奇的海军参谋长和海军司令已经向总理请求向我们的盟友申请援助，帮助印度发展起足以在远洋保护我们商业利益的海军力量。"
 delhi.161.a:0 "我们需要一支强大的海军来保卫商业和自由"
 delhi.162.t:0 "援建新印度海军"
 delhi.162.d:0 "随着跨国贸易的增加，印度政府决定扩建其海军力量来帮助保护其商业利益，印度驻[Root.GetNameDef]大使向我国政府提出了要求，希望我们派出工程师和海军教员援助他们的海军建设。这是一个加强帝国在远东势力的好机会。"
 delhi.162.a:0 "派遣技术援助他们发展"
 delhi.162.b:0 "让他们自生自灭"
 delhi.163.t:0 "来自[From.GetAdjective]的海军任务"
 delhi.163.d:0 "在长途航行之后，来自[From.GetAdjective]的船舶和专家已经来到了卡拉奇。我们应该在卡拉奇本地安置他们还是将他们送到孟买来扩建当地的民事海军枢纽？"
 delhi.163.d.aust:0 "来自[From.GetAdjective]的海军代表抵达了孟买，凭借他们在太平洋上驰骋的丰富经验，新的印度海军将成为一支强大的远洋力量！"
 delhi.163.a:0 "利用他们来扩建卡拉奇海军基地"
 delhi.163.b:0 "把他们安置在孟买，印度的商业中心"
 delhi.163.c:0 "我们应该造一艘名为布鲁斯号的舰船！"
 delhi.200.t:0 "排灯节的漫漫长夜"
 delhi.200.d:0 "昨晚，在德拉敦的印度人正在庆祝印度教的盛大节日，排灯节时，骚乱爆发了。成百上千的印度人利用这次聚会发起了自发的游行示威来抗议我们对该地统治。尼泊尔人开设的商店被烧毁，驻扎的驻军被包围。惊慌失措的总督下达了开枪的命令，警察对加塔加尔附近聚集的平民开火，导致了约五十人的死亡。这起事件导致印度国民大会中的一个派系在整个北阿坎德号召罢工，在东方掀起了革命之势。从德里到海得拉巴到加尔各答，全印度都被激怒了，许多煽动者正在鼓吹印度介入并夺取应属于印度的土地。看来特里布万沙阿陛下必须小心了。"
 delhi.200.a:0 "这将是对全印度的警告"
 delhi.201.t:0 "德拉敦设立路障"
 delhi.201.d:0 "反对尼泊尔占领者的骚乱在整个北阿坎德爆发，叛乱分子在德拉敦市拿起了武器。由于尼泊尔军队对在排灯节游行示威的印度人举起屠刀，当地的印度人爆发了。这次动乱证明了特里布万国王根本不关心他印度人子民的死活。然而这些暴动者武装不足，经验也近乎为零，这使得他们在与训练充足的尼泊尔军队作战时常常面临着巨大的困难。保守党和自由派在这一次看法完全一致，不能容忍对印度人的迫害！不能容忍尼泊尔对北阿坎德的压迫和占领！无论需要付出什么，议会都要求政府向我们濒危的国民提供援助。"
 delhi.201.a:0 "发布公告，尼泊尔军队必须撤回！"
 delhi.201.b:0 "我们将回应德拉敦的呼唤，开战吧！印度万岁！"
 delhi.201.c:0 "为什么要支持这群布尔什维克暴徒？"
 delhi.202.t:0 "[From.GetAdjective]的军队在德拉敦集结"
 delhi.202.d:0 "在灾难性的排灯节事件之后，德里政府宣布如果我们继续镇压德拉敦的骚乱，他们就将介入帮助叛乱分子。议会内的鹰派分子坚称，任何形式的让步都将导致皇权的衰落，然而如果我们拒绝德里的公告，加德满都的统治可能岌岌可危。这真是尼泊尔最黑暗的一天。"
 delhi.202.a:0 "在这种情况下军队什么都做不了，撤军！"
 delhi.202.b:0 "我们曾经击败过印度，这次也会！"
 delhi.203.t:0 "北阿坎德脱离尼泊尔"
 delhi.203.d:0 "随着我们的军队撤出北阿坎德，来自印度的武装分子和暴乱民众组成了自由组织，受拿着武器的印度警察支持的煽动分子在当地举行了旨在分裂并加入德里政府治下的全民公投。在排灯节大屠杀和之后的军队镇压发生过之后，这次公投的结果几乎没有悬念。"
 delhi.203.a:0 "受外国军事支持的民意难以干扰……"
 delhi.204.t:0 "北阿坎德的分裂"
 delhi.204.d:0 "我们对印度次大陆的统一进程又前进了一步！今天，德拉敦地区的临时政府投票一致通过并入我国。民族主义的旗帜从克什米尔山谷的街道飘扬到温迪亚山脉的白雪皑皑的山顶，人民聚集在一起庆祝从卑劣的外国统治下解放出来。然而，由于加尔各答政府的军队也进入了这一地区，人民已经分裂。这是将来必须解决的问题。"
 delhi.204.a:0 "胜利属于印度！"
 delhi.205.t:0 "特里布万与命运的幽会"
 delhi.205.d:0 "在西边，自治领的军队正准备开入由于排灯节大屠杀和随后的军事镇压而变得一片混乱的德拉敦。面对这样的敌人，尼泊尔的军队编队被认为在对付现代敌人时不堪一击。而且我们在印国大的地下的情报渠道表明，东方也在酝酿着暴乱计划，因此尼泊尔占领的土地的分裂几乎是必然的了，当然，如果再加上一点无产阶级起义，这个过程将变得更快。"
 delhi.205.a:0 "印度红军将横扫大吉岭！"
 delhi.205.b:0 "一群牦牛牧民对革命毫无意义！"
 delhi.206.t:0 "红军在行动"
 delhi.206.d:0 "我们以为情况不会变得更糟，然而，我们在大吉岭的驻军报告说在东部边界有大量军队活动的迹象，毫无疑问这是加尔各答那群布尔什维克暴徒试图夺回它们在印度内战中失去的领土。真可悲，面对两线作战，我们似乎无能为力。"
 delhi.206.a:0 "撤出占领的东部低地"
 delhi.206.b:0 "我们将扫清东方的社会主义威胁！"
 delhi.207.t:0 "尼泊尔屈服了"
 delhi.207.d:0 "随着我们军队的进军，[From.GetAdjective]政府只得撤军，把锡金和大吉岭交给我们。"
 delhi.207.a:0 "不需一枪一弹！"
 delhi.208.t:0 "北阿坎德的尼泊尔暴行"
 delhi.208.d:0 "来自北阿坎德的可怕消息已经传到我们面前！昨晚，印度教的排灯节庆祝活动爆发了暴力事件。成百上千的印度人利用这次聚会发起了自发的游行示威来抗议尼泊尔对印度土地的非法占领。一名当地警察指挥官在惊慌失措中下达了开火的命令，造成了五十名平民的死亡。在整个低地地区，愤怒和革命在德拉敦蔓延。我们的政府应当做好应对准备，毕竟我们声称代表了所有的印度人。"
 delhi.208.a:0 "岂有此理！"
 delhi.300.t:0 "王公联盟军官团的命运"
 delhi.300.d:0 "尽管在战场上被击败了，但王公联盟的军官团多次在对抗我们时证明了自己的价值。随着海得拉巴被攻占，前英属印度趋近于统一，这些爱国者们希望继续为新的印度服务。然而我们军队中的一些军官认为如此容易的接受之前的敌人可能会带来不良的后果。"
 delhi.300.a:0 "我们需要他们所有人，为了印度的明天！"
 delhi.300.b:0 "这些人无法被饶恕，永远禁止他们参军！"
 delhi.301.t:0 "婆罗多公社军官团的命运"
 delhi.301.d:0 "次大陆的工团主义威胁已经被我们的钢铁履带碾平，一些曾经效忠于加尔各答政府的军官愿意放下他们的政治成见再次为印度母亲服务。鉴于我们两国之间曾经的仇恨，这将是一个有争议的抉择，因为我们军队内的许多人仍对工团耿耿于怀。"
 delhi.301.a:0 "允许一批政治上问题最少的人复员"
 delhi.301.b:0 "这些人无法被饶恕，永远禁止他们参军！"
 delhi.302.t:0 "整合前孟买管辖区"
 delhi.302.d:0 "我们已经彻底击败了王公联盟，并控制了印度南部的绝大部分地区。现在我们必须决定如何整合之前仍在封建王公制统治下的这些省份。我们是迅速而严格的用我们的地方管理机构直接取代原来的土邦，还是逐步实施改变，让地方王公们更容易过渡？"
 delhi.302.a:0 "采取温和方式进行整合"
 delhi.302.b:0 "立刻进行完全的整合！"
 delhi.303.t:0 "整合德干邦"
 delhi.303.d:0 "南方的王公邦在政治上与海得拉巴的联系并不强烈，这是我们更难建立有效的中央集权，但无论如何，这是必须去做的。"
 delhi.303.a:0 "采取温和方式进行整合"
 delhi.303.b:0 "严厉地对待！"
 delhi.304.t:0 "在[new_core.GetName]取得控制"
 delhi.304.d:0 "虽然让本地人摆脱他们的农奴体制很难，但[new_core.GetName]现在已经被同化并成为了[Root.GetNameDef]的一部分！"
 delhi.304.a:0 "是时候了！"
 delhi.305.t:0 "在[damage_state.GetName]的抵抗"
 delhi.305.d:0 "在前王公联盟的[damage_state.GetName]地区爆发了叛乱，我们认为这是由一个在偏远地区运作的反动抵抗组织操纵的。恐怖主义爆炸事件和抗议活动现在正层出不穷，直到我们完全控制[damage_state.GetName]地区的人口为止。"
 delhi.305.a:0 "毫无疑问，这肯定是由王公资助的"
 delhi.306.t:0 "孟加拉的大型工业"
 delhi.306.d:0 "孟加拉邦是英属印度众多省份中人口最多最繁荣的地区之一。在以印度标准重工业化的同时，孟加拉邦也是最早一批受到社会动荡影响的邦之一。在英属印度崩溃时，孟加拉人表现出了他们对抗德里和海得拉巴政府的意愿。在内战和我们击败加尔各答政府的这十年间，孟加拉的工业建设得到了英国工团和社会主义官僚机构的帮助，得以大力发展。在我们的军队席卷这里之后，许多工业企业都成了废墟。在如何恢复这些工业上，顾问们有不同的意见。重建这些工业对我们利益巨大，但过快的恢复可能会导致依托于这些企业的工团组织死灰复燃，从而损害我们对合法规则的要求。"
 delhi.306.a:0 "自由市场将会消灭孟加拉的工团主义！"
 delhi.306.b:0 "实行私有化，但保证工人的权益"
 delhi.306.c:0 "让这些企业继续以国有形式运营"
 delhi.307.t:0 "阿萨姆的国营茶叶种植园"
 delhi.307.d:0 "印度规模最大的企业，阿萨姆种植园在工团垮台之前已经成为了一片异常庞大的国有实体，而现在，种植园正受到战争压力和管理不善的影响，生产效率下降，工人们的不满情绪日渐滋长。我们作为新的合法政府，有责任来解决这些问题，并确保阿萨姆邦工人的支持和忠诚，同时多赚点钱。"
 delhi.307.a:0 "向出价最高的私人出售种植园"
 delhi.307.b:0 "实行私有化，但保证工人们的利益"
 delhi.307.c:0 "保持国营，我们需要这些茶"
 delhi.308.t:0 "奥里萨邦的政治避难者"
 delhi.308.d:0 "和其他加尔各答政府占领的东部省份一样，奥里萨邦被成千上万的布尔什维克乱党袭击，当地的王公家庭和政府高层都被迫出逃，其中不少都在德里避难。现在随着我们的部队重返奥里萨邦，他们重返故土的愿望得以实现，然而，十年的社会主义管理使得当地的集体化明显，大量移民在当地获得了土地和房屋，造就了一大批依赖土地生存的农民和工人。我们国内的这些复辟者希望在当地恢复旧时的王公统治，而温和派则建议我们为两方达成一个妥协。"
 delhi.308.a:0 "驱散这些游民，将土地归还给领主"
 delhi.308.b:0 "让这些人保有土地，但他们必须支付赎金"
 delhi.309.t:0 "在[new_core.GetName]取得控制"
 delhi.309.d:0 "虽然让本地人摆脱他们的社会主义集体农耕体制很难，但[new_core.GetName]现在已经被同化并成为了[Root.GetNameDef]的一部分！"
 delhi.309.a:0 "是时候了！"
 delhi.310.t:0 "在[damage_state.GetName]的抵抗"
 delhi.310.d:0 "在前婆罗多公社的[damage_state.GetName]的地区爆发了叛乱，我们认为这是由一个在偏远地区运作的反动抵抗组织操纵的。恐怖主义爆炸事件和抗议活动现在正层出不穷，直到我们完全控制[damage_state.GetName]地区为止。"
 delhi.310.a:0 "他们在自寻死路吗？"
 delhi.311.t:0 "前法国殖民地的状况"
 delhi.311.d:0 "法国一直是英国对印度的殖民统治最大的对手，尽管英国取得了最后的胜利，但法国仍在印度次大陆上保有着几块殖民飞地。随着前马德拉斯共和国加入我们，我们现在控制了大部分前法国殖民地本地治里。有人建议我们在当地恢复一定程度的自治，作为对我们法国盟友的一种善意表示，虽然这可能会被国内认为是对殖民主义的纵容和默许。"
 delhi.311.a:0 "我们可以给我们的法国朋友一点小小的特权"
 delhi.311.b:0 "做出适当让步后并入印度"
 delhi.311.c:0 "取缔所有法国机构，完全印度化！"
 delhi.312.t:0 "德里政府统一印度"
 delhi.312.d:0 "我们在德里的坚定盟友统一了次大陆，我们应该将我们控制的省份还给他们吗？"
 delhi.312.a:0 "归还"
 delhi.312.b:0 "我觉得不行"
 delhi.313.t:0 "处理缅甸的工团主义圣地"
 delhi.313.d:0 "缅甸在1925年的混乱中脱离了英属印度，在仰光建立了贡榜王朝。然而石油工人的罢工和学生运动最终导致王朝崩塌，1837年，在加尔各答的影响下，缅甸建立了左派共和国，这种影响也导致现在大量的印度工团主义者在缅甸避难，而这些人正持续在阿萨姆邦和孟加拉发动针对我们的游击战，四处袭扰我们的军队和警察。如果我们想彻底铲除东南亚的工团主义军事威胁，我们必须切断缅甸政府对这些狂徒的援助，这即意味着我们必须在缅甸实施一次政权更替。然而如何完成这件事仍需要讨论。"
 delhi.313.a:0 "放火烧林，将红军残部熏出来"
 delhi.313.b:0 "他们会自己在丛林中丧失斗志的"
 delhi.314.t:0 "在缅甸的印度军事行动"
 delhi.314.d:0 "印度军队正越过边界攻击加尔各答政府的残军败将，我们该如何应对？"
 delhi.314.a:0 "他们竟敢？施加报复！"
 delhi.314.b:0 "印度红军现在只能依靠自己了"
 delhi.315.t:0 "在缅甸的围剿取得胜利"
 delhi.315.d:0 "由于缺乏缅甸的支持，我们的部队成功摧毁了红军残存的训练基地和他们的最后军队，更棒的是，缅甸政府的不作为引起了全国的骚动，我们可以利用这一动荡局势来推进缅甸的政变。"
 delhi.315.a:0 "利用这个事件支持仰光的政变"
 delhi.315.b:0 "将军队撤回阿萨姆"
 delhi.316.t:0 "反社会主义政变"
 delhi.316.d:0 "我们政府的软弱使得一帮军人发动了政变"
 delhi.316.a:0 "印度人又插手了，对吗"
 delhi.317.t:0 "仰光政变"
 delhi.317.d:0 "缅甸政府的软弱使得一帮军人成功夺取了政权。新政府向我们表达出了强烈的合作兴趣。"
 delhi.317.a:0 "将他们置于我们的影响力之下"
 delhi.317.b:0 "与他们建立亲切友好的合作关系"
 delhi.318.t:0 "反社会主义政变失败"
 delhi.318.d:0 "尽管有我们暗中支持，在仰光发起的政变还是被阻止了。由于我们在西缅甸还有军队，我们可以利用他们来强行推翻现在的政府。"
 delhi.318.a:0 "那我们只能亲自推翻左翼政府了"
 delhi.318.b:0 "太糟了"
 delhi.325.t:0 "印度公投"
 delhi.325.d:0 "在经历了一个多月的动荡之后，批准地方自治党关于整合前婆罗多公社地区并将其纳入选区的投票开始了。[DEH.GetNameDef]内部的意见并不统一，反对派已经团结在传统派的联盟党周围，而赞成者更有可能投票给圣雄的新社会党，一个来自前婆罗多公社的政治联盟，他们在孟加拉有坚定的支持者。最坚定的反对者则来自西北地区的王公。意见分歧之大，这次投票甚至可能导致印度的分裂。"
 delhi.325.a:0 "人民大力支持地方自治党"
 delhi.326.t:0 "提案通过"
 delhi.326.d.jinnah:0 "在比分非常接近的选举结束后，自治党的提案已被通过，更重要的是自治党成功连任了。许多人认为这是新王朝的开端。"
 delhi.326.d.socialist:0 "在比分非常接近的选举结束后，自治党的提案已被通过，但社会党当选了，主要是因为前公社地区对圣雄理想的大力支持，该党也在恒河地区受到了强力的支持，看来这意味着整个国家的左倾，尽管他们认为这只是对勒克瑙协议的维护，而不是工团主义的复辟。"
 delhi.326.a:0 "好吧，看起来不错"
 delhi.327.t:0 "提议未获通过"
 delhi.327.d:0 "在比分非常接近的选举结束后，自治党的提案未获通过。联盟党上台执政，到下一次选举开始之前，前婆罗多公社地区的命运都扑朔迷离。军队已经开入加尔各答和其他邦，以备不测。"
 delhi.327.a:0 "麻烦了"
 delhi.328.t:0 "克什米尔和古拉吉特邦退出自治领"
 delhi.328.d:0 "虽然整合提议在西北部并不是完全没有支持者，但古吉拉特邦和克什米尔的王公完全拒绝了它。数周以来骚乱频发，[DEH.GetAdjective]地区的士兵甚至向民众开枪。克什米尔和巴罗达的王公宣布他们打算退出自治领并加入[PRF.GetNameDef]。如果我们拒绝，骚乱可能加剧，甚至直接带来与南方的战争。"
 delhi.328.a:0 "在现在，他们离开会更好"
 delhi.328.b:0 "绝不同意！"
 delhi.329.t:0 "克什米尔和古拉吉特邦加入联邦"
 delhi.329.d:0 "克什米尔和古吉拉特的王公已经完全拒绝了和平统一社会主义者的计划，他们已经表示愿意加入联邦，并对[DEH.GetNameDef]的愚蠢左派采取行动。"
 delhi.329.a:0 "欢迎回来！"
 delhi.330.t:0 "寻求援助"
 delhi.330.d:0 "克什米尔和古吉拉特的王公已经完全拒绝了和平统一社会主义者的计划，并宣布他们打算分裂并加入[PRF.GetNameDef]，但他们被北方拒绝，[DEH.GetAdjective]的士兵正在涌入他们的辖区。当地王公正在向我们求助，说他们愿意武装反抗并和我们一同对抗北方的左派分子。"
 delhi.330.a:0 "立刻去帮助当地王公！"
 delhi.330.b:0 "对不起，我们无能为力"
 delhi.331.t:0 "尼赫鲁接管社会主义者"
 delhi.331.d:0 "甘地现在成了一个回忆，年轻的贾瓦哈拉尔·尼赫鲁——一位来自前婆罗多公社的著名工团主义领导人加入了社会主义联盟并且已经动摇了尼尔马·库马尔·鲍斯对社会党的领导。后者声称尼赫鲁的行为完全击中了他的弱点并宣布退休。"
 delhi.331.a:0 "一个有野心的男人"
 delhi.332.t:0 "AI反馈事件"
 delhi.332.d:0 "*** 本事件只由AI触发 ***"
 JINNAH_WINS:0 "真纳胜利"
 SOCIALISTS_WIN:0 "社会主义者胜利"
 UNIONISTS_WIN:0 "联盟党胜利"
 delhi.500.t:0 "印度帝国社团"
 delhi.500.d:0 "印度帝国社团是在英国大革命后由贵族和殖民地军事将领成立的组织，它是一个智囊团，旨在确定残余的大英帝国如何最好地维持其对印度次大陆的控制。随着合法英国政府逃往加拿大，许多人认为与夺回本土的主要问题相比，殖民地问题变得毫无意义，然而印度帝国社团提出了这样的概念：通过确保殖民地的资源和人力将对帝国的重建至关重要。在过去的十年中，印度帝国社团在德里活动，在那里它也得到了亲英印度精英们的支持，他们相信殖民体系可以发展成一个更包容的体系，同时还能为次大陆提供亟需的稳定。印度帝国社团的领导人温斯顿·丘吉尔一直致力于改善与当地人的关系，同时也在与更加专制的印度防卫联盟合作，后者只致力于英国的绝对统治地位。印度帝国社团目前仍处于分裂状态，温和的改革者希望给予印度臣民更多的自治权，而强硬派则表达了他们对英国霸权的期待，丘吉尔现在则被夹在中间，试图安抚双方……"
 delhi.500.a:0 "丘吉尔是这个职位的合适人选！"
 delhi.501.t:0 "爱德华八世国王支持丘吉尔！"
 delhi.501.d:0 "英国国王爱德华八世在得知丘吉尔出任印度总督的消息后，表示了支持和祝福。这位新加冕的国王公开表示，他相信丘吉尔是这个职位的合适人选，是一位能力卓越的领袖，他一直渴望与丘吉尔的统治下的自治领合作。同样，丘吉尔也宣布了他对国王永恒的忠诚，他说印度将永远准备好为帝国而战……"
 delhi.501.a:0 "上帝保佑国王！"
 delhi.502.t:0 "《至耀时刻》"
 delhi.502.d:0 "作为方兴未艾的“架空历史”题材文学的一部分，我们的总督，业余作家温斯顿·丘吉尔忙里偷闲，出版了一本关于世界大战的新书。\n\n这本书选取了一位刚刚从加里波利战场凯旋的士兵的视角出发，展示了一个与我们的世界完全不同的新世界。在这条世界线里，西奥多·罗斯福和他的公麋党赢得了1912年的大选，并且参与了世界大战，帮助协约国取得了胜利。失败后的德国部分土地被协约国占领，其他部分则陷入了无休止的经济政治动荡之中，而俄罗斯白军则在内战中溃败。最终，奉行“人民社会主义”（类似于带有些许“左翼”元素的极端版人民主义）的极端民族主义者亚当·德雷斯勒及其德意志工人党发动了政变。\n\n在这本小说结尾时，世界爆发了一场三方大战，一方是德雷斯勒的“新国家”，一方是西方协约国，还有一方则是谢尔盖·基洛夫领导的苏维埃俄国。这本书收到了很大的争议，一些人称赞它对细节的关注，还有一些人则批评他在历史逻辑上有巨大的缺陷，丘吉尔则称“相似的事情也许就发生在了另一个宇宙”。\n\n不过，对于此书来说，最有意思的批评来自于德国国内。虽然出版商曾料想过德国当局会对此有所反应，但铺天盖地涌向丘吉尔的信件大多都来自于边缘政治人物。社民党内的民族主义派别领导人、保罗·连施，还有奥地利德意志工人党的各高层都批评该书以德雷斯勒的人民社会主义影射、嘲讽其“人民共同体”理念。此外，更有意思的是，言辞最为激烈的两封信恰恰来自于丘吉尔听都没听说过的两人：德意志工人党巴伐利亚分部的主席安东·德雷克斯勒和波希米亚德意志人家乡阵线的领袖康拉德·亨莱因。二者指出，书的作者及出版商把他们的个人信息用在了负面人物上，前者认为德雷斯勒这一姓氏绝对和自己有关，后者则提出某些出版版本中使用了他的照片来充当德雷斯勒。截至目前，丘吉尔尚未对上述指控做出回复，而出版商则称其“荒谬”且“无凭无据”。"
 delhi.502.a:0 "多么幼稚的幻想"
 delhi.503.t:0 "割裂的社会"
 delhi.503.d:0 "尽管印度帝国社团可能会声称自己是一支统一的力量，会为捍卫印度的最佳利益而战，但对于社团内部的人来说，显然其成员之间存在着重大分歧。其中一个派系主要由印度本土贵族主导，他们提倡对帝国的忠诚，同时也主张进行温和的改革，以保证民众对殖民政府的满意。这些改革者大多是联盟党成员，他们希望推动印度人在执政职位上的更多代表，有时还支持丘吉尔的竞争对手甘加·辛格。\n\n帝国主义强硬派是与前者对立的派别，大多数成员属于奉行文化种族优越论的印度防卫联盟，该派别相信，优越的英国人有责任通过向殖民地人民强制推行西方价值观来拯救其自身。这些成员基本是富商、军事将领、贵族政客和自治领殖民制度的残余分子，他们认为，只有那些在种姓制度中占主导地位的人才有资格执政，即使如此，他们也应该在英国人的眼皮子底下进行管理。丘吉尔必须做出支持哪一派的决定，是推行温和的改革，还是加强殖民统治？"
 delhi.503.a:0 "站在温和的改革者一边……"
 delhi.503.b:0 "站在帝国主义者一边……"
 delhi.504.t:0 "反对丘吉尔的抗议！"
 delhi.504.d:0 "为了回应丘吉尔关于恢复之前的改革和巩固殖民统治的承诺，抗议者聚集起来反对印度帝国社团。他们在德里街头游行，谴责丘吉尔是一个独裁者，并要求实施改革，以实现更大的社会平等。尽管大多数抗议者被认为是支持联盟党、自治党和印度自由党的温和派公民，但人们担心这些抗议会被婆罗多公社利用，在我们的领土内制造混乱和冲突！"
 delhi.504.a:0 "为了稳定，也许我们应该允许一些改革"
 delhi.504.b:0 "我们必须对这些暴徒采取直接行动！"
 delhi.505.t:0 "《农家女》首映——第一部印度彩色电影"
 delhi.505.d:0 "《农家女》是由莫迪·B·吉德瓦尼执导的一部农村题材电影，主要讲述了贫困农民与高利贷的剥削和腐败地主作斗争的困境。尽管它的主题使它在联盟党的农民/乡绅联盟中非常受欢迎，但《农家女》之所以吸引人，主要是因为它是印度制作的第一部国产彩色电影。"
 delhi.505.a:0 "棒极了！"
