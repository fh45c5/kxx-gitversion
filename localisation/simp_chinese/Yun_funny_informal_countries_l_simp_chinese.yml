 DBRM_NZL_yangguizi_desc:0 "我们占领了澳大利亚，践踏着那些曾趾高气昂的盎格鲁白皮猪，他们此刻低声下气地祈求着我们的宽恕。秉持着人道主义关怀，元老院自然会给他们一小块地盘，但首先，我们得§R撒上盐巴§!。"  
 dongbeirome.1.t:0 "大梦一场"
 dongbeirome.1.d:0 "我看见六子儿揭开七印中第一印的时候，就听见四活物中的一个活物，声音如雷，说：“你来！”我就观看，见有一匹飞马，骑在马上的顺拿着弓，并把八分钱赐给他。他便出来，胜了又要胜。揭开第二印的时候，我听见第二个活物说：“你来！”就另有一匹马出来，是红的。有道理给了那骑马的，可以从地上夺去太平，使人彼此相杀，又有栗子赐给他。揭开第三印的时候，我听见第三个活物说：“你来！”我就观看，见有一只炫狗。手里拿着天平。我听见在四活物中似乎有声音说：“一阁得拉米，米诺，逆转，沃草，冰！真是公公又式式”揭开第四印的时候，我听见第四个活物说：“你来！”我就观看，见有一头若子。骑在马上的，名字叫做死，鬼畜也随着他，有ylg赐给他们，可以用硅胶、制冰、嘴硬，野兽，杀害地上四分之一的人。”"
 dongbeirome.1.a:0 "妈了个巴子的！什么玩意！"   
