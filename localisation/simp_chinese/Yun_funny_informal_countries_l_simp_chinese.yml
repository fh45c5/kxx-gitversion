 formable_nations_hanpr:0 "红色大汉"  
 lkmthan.1.t:0 "云龙山奇遇"
 lkmthan.1.d:0 "徐州，今日风和日丽，草木繁盛，莺歌燕舞，一片勃勃生机，万物竟发的景象。\n在视察完重建工作后，国民党主席汪精卫带着一行官员游玩云龙山。看着云龙山的大好景色，汪主席不禁吟诵起苏东坡《放鹤亭记》:“彭城之山，冈岭四合，隐然如大环....春夏之交，草木际天;秋冬雪月，千里一色;风雨晦明之间，俯仰百变。”而一旁的陈公博连连称好，夸赞汪主席学养深厚，是当代的陈思王，周佛海则尴尬地附和着，众人言笑晏晏，不停前行。\n接着众人参观了放鹤亭、饮鹤泉和云龙石碑，后又攀登云龙山第三节山。在观景台上，忽然有人在后山看到有朵云在漂，俄然一个中等身材，面部方正，颧骨稍显高，眼神深邃有力的男子出现，那云也随着男人一直飘荡在其头顶，众人皆大惊失色，莫非有神人显圣不得？只见那人越漂越近，径直到汪精卫的面前，把他吓得不轻，差点倒在陈公博和周佛海怀里。\n“汪主席莫怕，吾乃汉帝刘邦。所谓游子悲故乡，吾虽都关中，万岁后吾魂魄犹乐思沛。今诸夏战火纷飞，黎民有倒悬之危，故下凡拯救黔首，重现大一统。而黄老、孔儒、法家者，今皆不能救中国，唯主席等革命党人可救中国，特来拜访。” \n众人皆被他的话语惊得发愣，颤抖着拥在一起。此时，周佛海偷偷在汪精卫的耳边低语几句，汪精卫点点头，俯首沉思了半晌后，才伸出手来，对“刘邦”说……"
 lkmthan.1.a:0 "“欢迎加入我们，刘季同志。”"   
