 NFA_NAF:0 "新法兰西运动登台"
 kxx_fra_monbol.1.t:0 "宴会邀请"
 kxx_fra_monbol.1.d:0 "今天，夏尔·莫拉斯与欧仁·德隆科尔收到了一封信，国王请他去巴黎的一座高级餐厅共商国是。虽然他们担心社会主义抵抗运动的袭击，但他们得知有一位名为罗杰·内米尔的指挥官在那里驻扎。最后，他们决定……"
 kxx_fra_monbol.1.a:0 "看起来有点可疑，我们还是找陛下确定一下吧。"
 kxx_fra_monbol.1.b:0 "荣幸之至！"
 kxx_fra_monbol.3.t:0 "鲁莽的后果"
 kxx_fra_monbol.3.d:0 "指挥官竟然被收买了！夏尔·莫拉斯与欧仁·德隆科尔一下车，就遭到了士兵开火。两人当场死亡，随后这只兵变的部队控制了首都，如今政变的幕后黑手：让·马克·布尔唐和他的君主社会主义运动掌握了这个国家。"
 kxx_fra_monbol.3.a:0 "什么！？"
 kxx_fra_monbol.4.t:0 "议会的未来"
 kxx_fra_monbol.4.d:0 "让·马克·布尔唐如今必须做出决定：究竟是彻底进行革命，将所有腐化的自由主义分子全都驱逐出去，还是进行妥协，重新召开议会，拉拢其他民主派呢？"
 kxx_fra_monbol.4.a:0 "自由主义决不能死灰复燃！"
 kxx_fra_monbol.4.b:0 "我们不得不做出让步。"
 NFA_Nouvelle_Action_francaise:0 "新法兰西运动登台"
 NFA_Nouvelle_Action_francaise_desc:0 "那个在阿尔及尔简陋的流亡政府办公室里叼着烟斗、用笔尖敲打共和制脊梁骨的人再也没有睁开眼睛——他用四十年时间告诉所有愿意听的人，法兰西毁于民主，毁于共和，毁于一七八九年以来每一场自以为是的革命。可法兰西行动卡在了半路上——贵族和军官爱听他的君主论，工人和农民却只当是另一个右派老爷在念经。现在轮到我们来说清楚他剩下的话：君主制必须复兴，但我们认为国王的臣民得先从工厂和农田里把腰杆直起来。现在我们要一个大众党，一个能在罢工纠察线和退伍军人协会里同时扎根的组织。莫拉斯的遗产不该锁在流亡贵族的客厅里，得把它搬进车间、搬进港口，让莫拉斯降临在怀疑者的人群间！"
 NFA_recover_commuard:0 "为公社分子平反"
 NFA_recover_commuard_desc:0 "一八七一年的凡尔赛政府为了镇压公社屠杀了好几万人，之后一百多年的官方历史课一直把他们叫暴徒。莫拉斯本人当年也诋毁公社，但那是因为他的民族主义是吞不下任何分裂。可今天我们再看巴黎公社，它跟法兰西行动反对共和国、反对资产阶级自由主义这件事在骨头里有相似的东西，我们也不该为了我们自己人对于一些其他部分隐约的向往就把他们打成对巴黎通敌的个人。因此，我们决定将公社分子的罪名大部平反。为死者在公墓边上立一面纪念墙，允许那些活着的后代子孙正大光明地谈论这段往事。"
 NFA_leagcy_of_circle_proudhon:0 "蒲鲁东圈的美好时光"
 NFA_leagcy_of_circle_proudhon_desc:0 "一战前，乔治·瓦卢瓦和年轻人在巴黎搞了个蒲鲁东圈。他们把莫拉斯、索雷尔和蒲鲁东三个人的书放在一起讨论，想从里面焊合出一种民族工团主义的合金。圈子在大战后就散了，成员是各奔东西，而瓦卢瓦后来甚至背叛了莫拉斯。可这些曾有的实验其实证明了一件事：君主制、工团主义和互助主义可以在同一间屋子相安无事地坐着讨论问题。我们可以重拾圈子的旧志，把当年的笔记和未完成的纲领整理出来，补齐他们由于实践欠缺而未完成的部分。"
 NFA_sorel_and_maurras:0 "索雷尔与莫拉斯并肩屹立"
 NFA_sorel_and_maurras_desc:0 "乔治·索雷尔是莫拉斯最奇特的对话者。一个革命工团主义者，一个君主主义者，两人的通信在档案馆里都接近发霉了。索雷尔不信君主制，但他对议会制的厌恶和莫拉斯不相上下。他们都觉得民主制是懦弱、分散和腐败的代名词，都相信行动高于辩论，都渴望找到一种压倒资产阶级规训的能量，他们简直是思想极其相似的两个人呀！莫拉斯在索雷尔那里找到了自己体系里缺掉的东西——工人的信念。而索雷尔在莫拉斯那里找到了一种他从未拥有过的历史纵深。我们将这两个人宏伟的大理石半身像并排摆在运动中央委员会的大厅里，让他们死后还接着论道有关生前那个没能完成的旧话题。"
 NFA_unity_in_crown_and_socialism:0 "植根于王冠与社会主义的团结"
 NFA_unity_in_crown_and_socialism_desc:0 "王冠高高在上，社会主义厚厚在下，二者向来被说成水火不容。可谁规定过这一点呢？王冠代表的不是某个会吃饭会犯错的国王本人，它是法兰西国家连续的象征。一千四百年了，卡佩、瓦卢瓦、波旁，拿破仑……每一个王朝都在为我们的祖国添砖加瓦。社会主义代表的也不是巴黎那套叛逆暴徒做法，只要劳动者不被当作会喘气的工具。国王和工人这两股力量一旦能够握在一起，就能把夹在中间吃了几代人利息的财主们挤成粉末。我们要的团结即是：上面有人守住法兰西的灵魂，下面有人撑起法兰西的筋骨。"
 NFA_corperate_to_syndicate:0 "从法团到工团"
 NFA_corperate_to_syndicate_desc:0 "莫拉斯一辈子都在说法团主义，讲行会，讲自然人生活在有机的共同体里。可他理想中的行会是好似中世纪石匠协会那种东西，二十一世纪的工人听不懂。工团主义者骂了他几十年，说他替老板设计残忍的笼子。后来我们才想明白：工团要的不是被取缔，是被承认——承认它们有权利管理车间事务，有权利在利润分配上拍桌子。把法团主义的旧瓶子装进工团主义的酒液，保留教会和国家的法团框架，而干活的事交给工会自己商量。"
 NFA_local_communes:0 "地方公社乃分权主义之最终目标"
 NFA_local_communes_desc:0 "巴黎集权是共和国的毒瘤。远在阿尔卑斯山脚下的农庄凭什么花两年等一个部里的批示？省市一级的议会当然仍旧需要，但真正跟老百姓过日子有关的学校、治安、土地调配——最好全往下交给公社。每个公社自己选自己的人，定自己的规矩，在自己的境内培养自己的民兵。尽管莫拉斯拥护君主制，但他在这一点上跟无政府主义者有过奇妙的共识：人应该能管好自己的事，不需要一个遥远的官僚告诉他你的麦子该卖多少钱。"
 NFA_revise_maurrasism:0 "再解读莫拉斯思想"
 NFA_revise_maurrasism_desc:0 "我们重新翻开莫拉斯在阿尔及尔隐居时写的手稿……字迹潦草的，墨水褪色的，可我们发现有些段落以前没人在意：他不止一次或明或暗的写到，“资产阶级共和国的敌人从右边看是君主，从左边看是社会主义者”。他一生都在跟左侧的敌人划清界限，可他心里清楚，真正的靶子是中间那群靠共和制发财的自由派资产阶级。通过再解读他的思想，我们得以把这条他没挑明的线索拉直：原来反自由主义才是主轴，君主制和社会主义不是天然的对头，是同一个反自由阵营的统合两翼，我们很好的解释了莫拉斯，这并不是背离他的初心。 "
 NFA_maurrasism_is_socialism:0 "社会主义乃莫拉斯心中所想"
 NFA_maurrasism_is_socialism_desc:0 "要是这句话扔进法兰西行动的老派圈子里，他们一定会会炸锅的。他们会翻出莫拉斯抨击马克思和饶勒斯的文章，白纸黑字的叫嚷。可是他们却忽视了另一面：莫拉斯私底下跟索雷尔通信，认真读过蒲鲁东，对第四等级——工人和农民——的关切不比任何一个社会主义者少！他想过的社会主义是反国际化的民族内部社会主义。劳资之间明显不该是你死我活，而该讲公正、遵从秩序、要求劳动的价值不被货币资本家稀释。我们替他说道：莫拉斯要一个国王坐镇、工人分到利润的社会，那就是他的社会主义。"
 NFA_purge_lepen:0 "清洗反对派"
 NFA_purge_lepen_desc:0 "我们的改革撞上墙了……旧派系里老臣们咬死说君主制不能沾半点社会主义的边，有人已经在私下联络流亡在外的波旁家族，试图绕开我去另立核心。我没时间跟他们打优雅的笔仗，于是秘密警察造访了几个关键人物的住所，某些人在天亮前就不在阿尔及尔了。剩下的一些人看了信后安静下来。快速精准的清洗，不需要响动太大。"
 NFA_ally_boutang:0 "拉拢人道整合主义者"
 NFA_ally_boutang_desc:0 "天主教社会训导那些人道主义者向来不待见我们，觉得我们过硬，太民族而不在乎个体尊严。可他们认真读过教皇讲的劳动尊严和公正酬劳，那套东西跟我们要干的法令其实重合度很高。我们去找他们坐下来谈：不影响教会学校的自主权，不干预主教的任命，作为交换，他们要支持把劳工改革纳入新宪章。要是神父替我们在讲道坛上讲一句，在这里的作用是可以盖过传单的。"
 NFA_convince_king:0 "说服国王"
 NFA_convince_king_desc:0 "流亡的国王住在阿尔及尔近郊不起眼的别墅中，除了几个老仆人和一堆烫金的族谱，跟普通人也没什么两样。我们带着新起草的宪章去拜访他，陈明利害：陛下，君主制想要回巴黎，仅靠龙骑兵是不够的，得有人替它去铺路。工人们如果不站在你这边，我们的宪兵迟早要不好用。 我们相信国王不傻，他和君主制等了那样久，大概不在乎再多听几句关于分权和公社的陌生言辞。"
 NFA_dream_of_maurras_has_been_achieved_in_other_way:0 "莫拉斯之梦已以别样方式实现"
 NFA_dream_of_maurras_has_been_achieved_in_other_way_desc:0 "莫拉斯生前最大的愿望是看到法兰西重新成为君主制国家。他等来的是溃败、本土的沦丧、自己流亡在地中海南岸了此残生。可他播下的种子已是无心成荫。他要等级，我们有秩序；他要行会，我们有工团；他要君主，我们有国王——这一切当然不是他当年在法兰西行动所构想的蓝图，我们用的材料跟他设想的不完全一样……但是我们认为他的梦已经实现了，只是换了一个建筑风格。"
