 BRI_Generate_revenue_desc: "我们的月度收益总额将根据我们目前各要素水平发生相应的的变化：\n\n§W所拥有的工厂总数([?num_of_owned_factories|H0])§!\n§W企业盈利能力([?BRI.Enterprise_profitability|H0%])§!\n§W政治点盈余([?has_political_power|H0])§!\n\n工厂提供的收益计算公式为：§O收益§! = §Y工厂数目§!*§G(2M)§!*§3企业盈利能力§!*§g(1+(政治点盈余/10000))§!"
