 BRI_based_idea: "建构理念"
 BRI_factionism:"派系斗争"
 BRI_factionism_desc:"自从独立以来，奥利弗·莫德雷尔的布列塔尼国民党就掌握着政权。然而，莫德雷尔的政权同时面临着党内的反对与党外的密谋。\n§G阿贝·佩洛特大队§!是由右翼牧师阿贝·佩洛特创立的，由塞莱斯廷·赖因率领的准军事组织，他们在布列塔尼独立中起了举足轻重的作用，但其在批评莫德雷尔的同时庇护反对国民党的其他民族主义者。\n§Y企业理事会§!代表了本地的商业集团的利益，莫德雷尔为了得到资金乐于与其进行合作，但假如他们的利益受到了威胁，这些资本家就会毫不犹豫推翻他的政权，以一个企业天堂取而代之。\n§R布列塔尼自由阵线§!是由当地的社会主义者与民主派组成的联合抵抗组织，其以圣纳泽尔为基地对莫德雷尔政权发动着无休止的游击战，随时准备抓住政府个集团的矛盾推翻莫德雷尔，建设自由的布列塔尼。\n重建工作迫在眉睫，布列塔尼人需要团结起来，重新于废墟上筑起属于我们的一片天地。但布列塔尼政府内部的政治力量都在蠢蠢欲动，企业家们在政坛与民间用金钱收买人心，自由阵线正为布列塔尼民族的自由民主未来奔波着，布列塔尼民族党在面对着这两大力量的崛起的时局下不得不谨慎行事，控制其中的影响力，而刚从前线回到和平年代的士兵们，他们似乎也有话要说……。\n§G总之，控制好各方的影响力，别搞砸了§!\n\n§g布列塔尼国民党在政府中的权威： [?BRI.PNBpower] / 50 §!\n§6企业在布列塔尼政府中的影响力： [?BRI.BLBApower] / 50§!\n§3布列塔尼自由阵线在政府中的的影响力：[?BRI.FLBpower] / 50§!\n§O大队在政府中的影响力： [?BRI.ABpower] / 50§!\n"
 BRI_political_crisis_countdown_tt:0"§R我们需要在大会乱局中选取影响力最高的派系，不要让纷争陷入僵局，否则国家会万劫不复……§!"
 BRI_support_nationalists:"支持国民党"
 BRI_support_paramilitary:"支持军方"
 BRI_support_corporates:"支持企业"
 BRI_support_soc_and_dem:"支持抵抗运动"
 BRI_ar_chas_donv_yelo_da_ouez:"家犬要野化了！"
 BRI_ar_chas_donv_yelo_da_ouez_desc:"随着法兰西公社联邦的分崩离析，布列塔尼民族主义终于从法兰西的监狱中看到了一丝光亮。当狗链从我们的主子手中松开，我们将会露出埋于深处的兽性，将我们全体族群如狼一般野化以争取这来之不易的自由"
 BRI_popular_power:"发动人民"
 BRI_popular_power_desc:"布列塔尼在为了捍卫自己的独立而流血牺牲，布列塔尼的人民必须支援她的斗争，我们绝对不会成为历史书中的一抹微不足道的注脚！"
 BRI_fortify:"加固上布列塔尼"
 BRI_fortify_desc:"上布列塔尼是我们与法兰西交锋的最前线，我们要加固我们的防线，绝不能让他们通过！"
 BRI_seize_industry:"夺取工业"
 BRI_seize_industry_desc:"随着中央政权的崩溃，我们有能力接管一些前公社政权遗留下来的工业遗产。为新生国家的工业建设做出一点点微不足道的的贡献"
 BRI_partisan_tactics:"游击战术"
 BRI_partisan_tactics_desc:"面对外军的进犯，我们不能用我们的军事力量与之正面抗衡。我们需要转换战术与敌周旋，以袭扰代替对抗，不断消耗敌方实力，打破实力上的不对称"
 BRI_digging_in:"深挖堑壕"
 BRI_digging_in_desc:"我们要保卫我们的独立，就得先锻造我们的的剑与盾，打造一条固若金汤的防线。让布列塔尼的未来在我们手里被牢牢守护，而不是百年前布雷斯特城下之盟的重演"
 BRI_guns_more:"走私枪支"
 BRI_guns_more_desc:"得益于莫德雷尔的黑市网络与内战时期的治安松懈，我们可以通过非常规的手段来购买武器，当一批批军械被送入战士们的手中时，他们就对我们能战胜昔日旧主有了更多的底气"
 BRI_independent_win:"驯服之犬亦将奋起反抗！"
 BRI_independent_win_desc:"我们抗下了法兰西的怒火，法兰西在布列塔尼面前屡屡碰壁，头破血流。他们从我们的抵抗中知道布列塔尼再也不是曾经一盘散沙的地区了，她已经成为一个强大民族凝聚力的新生国家！"
