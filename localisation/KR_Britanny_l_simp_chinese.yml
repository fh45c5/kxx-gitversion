 BRI_Giant_enterprises_governing_the_country_desc: "如今，企业巨头们用商业逻辑彻底取代社会契约。传统意义上的低效的“国家”已沦为历史尘埃，其主权、领空与行政权被巨型企业通过债务重组、技术垄断或军事吞并完全接管。\n\n在这里财富才是最温和最仁慈的信使，他会指引我们向何处而去。倘如财富离我们远去，那一切皆成荒芜……\n所以啊，公民们，请你们牢记……\n\n\n§6劳动带来财富，财富带来自由§!\n\n     目前，我们的资产总额为[?BRI.enterprises_property_chance|Y2]亿"
