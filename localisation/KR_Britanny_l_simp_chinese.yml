 brittany.1.t: "一颗子弹"
 brittany.1.d: "阴冷的雨幕中，狙击手架好步枪，对准了莫德雷尔的住所。“坏东西，看我怎么一枪打爆你这卑贱酒鬼的狗头”狙击手一遍怒骂着，一遍死死的盯着莫德雷尔住所的窗户\n\n当莫德雷尔的身影出现在窗前，一声刺耳的枪鸣撕碎了布列塔尼国民党看似稳固的幻象。“一颗子弹”精准地咬进了莫德雷尔的胸腔，鲜血瞬间浸透了他那件象征布列塔尼土地色彩的呢大衣。随着“莫德雷尔遇刺”的消息如同瘟疫般传遍大街小巷，原本潜伏在阴影中的野心与狂热彻底决堤。混乱中，权力核心发生了剧烈的震荡：那些渴望通过铁血手段实现独立的民族主义者他们迅速占领了印刷厂，并动员民兵进军政府；而街道上，由于领袖的失踪，工人群体被红色的激流卷走，社会主义的旗帜淹没了国民党尔的呼声，将这场民族运动推向了阶级斗争的边缘。与此同时，信奉法兰西传统右翼的“莫拉斯主义者”趁火打劫，他们闯入党部办公室，试图以维持秩序为名推翻莫德雷尔的统治，将这支分离势力强行并入大国沙文主义的版图。\n\n然而，在这场政治饕餮盛宴的中心，那个本该倒下的男人却展现出了近乎病态的顽强。他面色惨白、身形佝偻地出现在狂热的追随者面前。虽然子弹未能终结他的生命，但它所引发的这场混战，已将布列塔尼运动拖入了一个更加激进、且再也无法回头的深渊，而在这场斗争中，最后的赢家是……"
 brittany.1.a: "民族主义者控制了政府"
 brittany.1.b: "社会主义的旗帜淹没了布列塔尼"
 brittany.1.c: "莫德雷尔拖着病体指挥军队控制了党"
 brittany.1.e: "莫拉斯主义者推翻了莫德雷尔的统治"
 brittany.2.t: "新领袖"
 brittany.2.d: "随着莫德雷尔那摇摇欲坠的统治在内外交困中彻底瓦解，佩洛特大队的武装士兵们踏碎了政厅的宁静。这些身着黑衣、神色冷峻的激进分子用枪托敲开了办公室的大门，正式宣告了旧秩序的终结。然而，推翻莫德雷尔仅仅是个开始，废墟之上的布列塔尼正处于权力的真空地带，急需一位能够稳定军心并与各方势力周旋的“新领袖”。\n\n作为佩洛特大队的灵魂人物，莱内主张彻底的准军事化统治。他冷冷地擦拭着配枪，认为布列塔尼不需要政治家的妥协，只需要战士的服从。对他而言，只有将民族主义推向极端的武力化，才能在战争的余烬中重建家园。\n但让-马里·佩洛特——这位富有魅力的神父不仅是武装大队的精神支柱，更是传统天主教价值观的捍卫者与宗教的旗帜。他主张建立一个圣洁、传统的农村化社会，试图在现代工业文明的废墟上复兴凯尔特先民的虔诚。\n与此同时作为党内的稳健派，德拉波特代表了中产阶级和知识分子的诉求。他担忧激进武装会将民族运动带向毁灭，试图通过法律与行政手段，将动荡的局势引回和平建国的正轨。\n作为“白黑旗”的设计者，马沙尔更像是一位浪漫主义的思想家。他坚持凯尔特文化的纯洁性，反对盲目卷入欧陆战争的漩涡，主张建立一个基于世俗主义和异教美学的纯粹民族国家。\n\n窗外，佩洛特大队的士兵正在等待，布列塔尼在等待……这一次“灵魂的投机”是走向神权统治、军事专政、回归传统亦或是是的民族主义新生？每一个名字的背后，都预示着这个民族截然不同的悲剧或新生。"
 brittany.2.a: "莱内开启了属于他的治理"
 brittany.2.b: "宗教的信徒们拾起了大旗"
 brittany.2.c: "布列塔尼回应了世俗的呼唤"
 brittany.2.e: "布列塔尼民族将在浪漫主义中浴火重生"
 brittany.3.t: "新的道路"
 brittany.3.d: "布列塔尼的薄雾不再带有泥土的芬芳，取而代之的是工业废气中混杂的冷硬金属味。随着佩洛特大队的刺刀逐渐锈蚀，旧时代的民族主义理想在巨额资本的攻势下土崩瓦解。曾经的党部大楼如今成了企业理事会的议政厅，这片土地已沦为巨企的乐园。五个庞然大物在布列塔尼的版图上割据一方，它们不仅控制着经济命脉，更试图重塑这片土地的“灵魂”：\n\n拉加代尔传媒他们将“革命”封装成商品。通过激进的垂直管理和所谓的“工团主义”包装，试图通过技术革命来重塑社会契约。在他们的治下，每一名布列塔尼人都是这台宏大革命机器上的精密齿轮。让工人们重新找回公社联邦昔日的辉煌与荣光。\n达能披着慈父般的外衣，许诺建立一个“福利天国”。从摇篮到坟墓，达能掌控着公民的每一滴食水与营养。这是一种温柔的奴役——在充足的卡路里和全方位的医疗保障中，人民逐渐忘却昔日布列塔尼的苦难。\n在米其林，这里的规则只有一个：速度与效率。米其林的车轮永不停歇地在大地上滚动，通过修建庞大的自动化公路网和物流中枢，将布列塔尼彻底变成一个高压运转的财富加工厂。\n在道达尔眼中能源即是主权。在钻井平台和炼油厂的轰鸣中，道达尔通过掌控命脉能源来换取“繁荣”。它是实用主义的极致，用黑色的原油洗去历史的尘埃，将布列塔尼锻造成一个不可或缺的全球能源节点\n而LVMH傲立于资本的塔尖。他们追求的是一种近乎贵族制的“商业帝国”，将布列塔尼的身份符号彻底时尚化、奢华化。在这里，民族传统不再是信仰，而是被陈列在昂贵柜台里的文化消费品。\n理事会的大理石桌面上，五份计划书代表了五种截然不同的末日或新生。当官僚、高管与雇佣兵取代了祭司与战士，布列塔尼这个“新机器”开始发出了沉重的自检声。齿轮已经咬合，无论最终谁能在这场资本的角逐中胜出，那个古老的、纯粹的布列塔尼都将不复存在。"
 brittany.3.a: "同拉加代尔共同追随革命！"
 brittany.3.b: "同达能一起追随人民福利的天国"
 brittany.3.c: "同米其林的车轮奔向财富"
 brittany.3.e: "同道达尔集团的合作追随繁荣"
 brittany.3.f: "同LVMH一起共筑商业帝国"
 brittany.4.t: "布列塔尼，真正自由" 
 brittany.4.d: "布列塔尼终于告别了阴暗的独裁阴影，迎来了那个曾经被鲜血和资本淹没的“民主之春”。市政厅顶端的莫德雷尔巨幅肖像被愤怒的民众拉倒，尘埃落定后，布列塔尼人第一次在没有秘密警察和巨企保安的监视下走上街头。这不是一场由阴谋家策划的暗杀，而是一场民族党、蓝色联盟与地方主义联盟共同构筑的、波澜壮阔的共和狂欢。莫德雷尔那带有寡头色彩的陈腐秩序在公民意志的冲击下彻底瓦解，真正自由不再是传单上的口号，而是清晨街头最真实的呼吸。\n经历了莫德雷尔时期的激进与偏执后，重获新生的民族党带回了温和而坚定的民族自决理想。他们主张在尊重传统的基础上，通过法治手段确立布列塔尼的主权。对他们而言，自由意味着每一个布列塔尼人都能在国际舞台上挺起脊梁，不再作为谁的附庸，而是作为一个独立的文明实体走向复兴。\n这群自视为“自由子民”的激进共和派，誓言要在凯尔特的土地上复兴1789年大革命的伟大精神。他们要求彻底铲除寡头政治的残余，建立一个政教分离、人人平等的现代共和国。在蓝色联盟的蓝图里，布列塔尼将成为西欧民主的新灯塔，用公投和议会取代过去几十年的密室交易。\n而作为族群的纽带与实用主义与多元主义的旗手，地方主义联盟更关注这片土地上的每一个社区。他们主张通过联邦主义将布列塔尼内部错综复杂的族群和地区联系在一起。拒绝高度集权，将权力下放到每一个教区与市集，让布列塔尼成为一个基于自愿协作的贵族共和。\n三股组织力量之外，一个名字在老兵和码头工人口中被反复提及——马塞尔·加香。这位出生于布列塔尼帕普勒的国际共产主义元老，带着一种截然不同的“自由”愿景回到了家乡。对于那些厌倦了民族主义教条的底层民众来说，加香不仅是一个名字，更是一种将凯尔特认同与红色革命结合的可能性。他站在简陋的木箱上演讲，声音嘶哑却有力，声称真正的布列塔尼自由不应只是换一批统治者，而是彻底铲除阶级压迫。他的存在，让原本由自由派和民族派主导的政局变得微妙：他是会成为共和制的捍卫者，还是会将布列塔尼带向苏维埃化的新道路？\n\n旗帜在自由的风中猎猎作响，莫德雷尔的陈旧机器正在被拆解，取而代之的是一个充满变数却又生机勃勃的新时代。布列塔尼人站在历史的十字路口，虽然前路依旧崎岖，但至少这一次，方向盘握在他们自己手中。"
 brittany.4.a: "布列塔尼民族党将带领布列塔尼民族走向自由"
 brittany.4.b: "布列塔尼蓝色联盟将复兴法国大革命的伟大精神"
 brittany.4.c: "布列塔尼地方主义联盟将用联邦主义团结各个族群"
 brittany.4.e: "红旗在风中飘荡，伟人将再度掌舵！"