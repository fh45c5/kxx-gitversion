 BRI_based_idea: "建构理念"
 BRI_factionism:"派系斗争"
 BRI_factionism_desc:"自从独立以来，奥利弗·莫德雷尔的布列塔尼国民党就掌握着政权。然而，莫德雷尔的政权同时面临着党内的反对与党外的密谋。\n§G阿贝·佩洛特大队§!是由右翼牧师阿贝·佩洛特创立的，由塞莱斯廷·赖因率领的准军事组织，他们在布列塔尼独立中起了举足轻重的作用，但其在批评莫德雷尔的同时庇护反对国民党的其他民族主义者。\n§Y企业理事会§!代表了本地的商业集团的利益，莫德雷尔为了得到资金乐于与其进行合作，但假如他们的利益受到了威胁，这些资本家就会毫不犹豫推翻他的政权，以一个企业天堂取而代之。\n§R布列塔尼自由阵线§!是由当地的社会主义者与民主派组成的联合抵抗组织，其以圣纳泽尔为基地对莫德雷尔政权发动着无休止的游击战，随时准备抓住政府个集团的矛盾推翻莫德雷尔，建设自由的布列塔尼。\n重建工作迫在眉睫，布列塔尼人需要团结起来，重新于废墟上筑起属于我们的一片天地。但布列塔尼政府内部的政治力量都在蠢蠢欲动，企业家们在政坛与民间用金钱收买人心，自由阵线正为布列塔尼民族的自由民主未来奔波着，布列塔尼民族党在面对着这两大力量的崛起的时局下不得不谨慎行事，控制其中的影响力，而刚从前线回到和平年代的士兵们，他们似乎也有话要说……。\n§G总之，控制好各方的影响力，别搞砸了§!\n\n§g布列塔尼国民党在政府中的权威： [?BRI.PNBpower] / 50 §!\n§6企业在布列塔尼政府中的影响力： [?BRI.BLBApower] / 50§!\n§3布列塔尼自由阵线在政府中的的影响力：[?BRI.FLBpower] / 50§!\n§O大队在政府中的影响力： [?BRI.ABpower] / 50§!\n"
 BRI_political_crisis_countdown_tt:0"§R我们需要在大会乱局中选取影响力最高的派系，不要让纷争陷入僵局，否则国家会万劫不复……§!"
 BRI_support_nationalists:"支持国民党"
 BRI_support_paramilitary:"支持军方"
 BRI_support_corporates:"支持企业"
 BRI_support_soc_and_dem:"支持抵抗运动"
 BRI_ar_chas_donv_yelo_da_ouez:"家犬要野化了！"
 BRI_ar_chas_donv_yelo_da_ouez_desc:"随着法兰西公社联邦的分崩离析，布列塔尼民族主义终于从法兰西的监狱中看到了一丝光亮。当狗链从我们的主子手中松开，我们将会露出埋于深处的兽性，将我们全体族群如狼一般野化以争取这来之不易的自由"
 BRI_popular_power:"发动人民"
 BRI_popular_power_desc:"布列塔尼在为了捍卫自己的独立而流血牺牲，布列塔尼的人民必须支援她的斗争，我们绝对不会成为历史书中的一抹微不足道的注脚！"
 BRI_fortify:"加固上布列塔尼"
 BRI_fortify_desc:"上布列塔尼是我们与法兰西交锋的最前线，我们要加固我们的防线，绝不能让他们通过！"
 BRI_seize_industry:"夺取工业"
 BRI_seize_industry_desc:"随着中央政权的崩溃，我们有能力接管一些前公社政权遗留下来的工业遗产。为新生国家的工业建设做出一点点微不足道的的贡献"
 BRI_partisan_tactics:"游击战术"
 BRI_partisan_tactics_desc:"面对外军的进犯，我们不能用我们的军事力量与之正面抗衡。我们需要转换战术与敌周旋，以袭扰代替对抗，不断消耗敌方实力，打破实力上的不对称"
 BRI_digging_in:"深挖堑壕"
 BRI_digging_in_desc:"我们要保卫我们的独立，就得先锻造我们的的剑与盾，打造一条固若金汤的防线。让布列塔尼的未来在我们手里被牢牢守护，而不是百年前布雷斯特城下之盟的重演"
 BRI_guns_more:"走私枪支"
 BRI_guns_more_desc:"得益于莫德雷尔的黑市网络与内战时期的治安松懈，我们可以通过非常规的手段来购买武器，当一批批军械被送入战士们的手中时，他们就对我们能战胜昔日旧主有了更多的底气"
 BRI_independent_win:"驯服之犬亦将奋起反抗！"
 BRI_independent_win_desc:"我们抗下了法兰西的怒火，法兰西在布列塔尼面前屡屡碰壁，头破血流。他们从我们的抵抗中知道布列塔尼再也不是曾经一盘散沙的地区了，她已经成为一个强大民族凝聚力的新生国家！"
 BRI_memories_of_1932:"1932的回忆"
 BRI_lag_millitary:"新起步的军队"
 BRI_inner_factionalism:"内部派系主义"
 BRI_PNB_holds:"国民党屹立不倒"
 BRI_PNB_holds_desc:"在布列塔尼国民大会的政治斗争中，布列塔尼国民党在政治斗争中巩固了自己的地位，这个带领布列塔尼独立的党将再一次为布列塔尼指引前路"
 BRI_intergrate_perrots:"整合佩洛特大队"
 BRI_intergrate_perrots_desc:"处于与赖因的特殊关系，我们得到了他的支持，我们将会与佩特洛大队一道完成我们的民族革命事业"
 BRI_radicalize_national_revolution: "民族革命激进化"
 BRI_radicalize_national_revolution_desc: "温和的改良已经无法满足时代的需要。布列塔尼的觉醒必须是一场暴烈的行动，我们要将民族斗争推向极致，彻底打碎旧世界的枷锁"
 BRI_intergral_revolutionary_nationalism: "革命整体民族主义"
 BRI_intergral_revolutionary_nationalism_desc: "民族是一个不可分割的整体。通过革命，我们将把个人意志融入到国家的集体意志中，建立一个高度统一、充满活力的革命实体"
 BRI_social_national_worker_movement: "社会民族工人运动"
 BRI_social_national_worker_movement_desc: "工人们不仅是阶级的一员，更是民族的脊梁。我们要将社会正义与民族复兴结合起来，让布列塔尼的劳动者成为国家真正的主人"
 BRI_britanny_peasant_britanny_bread: "布列塔尼农民，布列塔尼面包"
 BRI_britanny_peasant_britanny_bread_desc: "土地属于耕种它的人。我们要确保布列塔尼的每一块面包都出自本土农民之手，实现粮食自给，保护我们最纯粹的农村根基"
 BRI_popular_state: "人民国度"
 BRI_popular_state_desc: "权力不应属于官僚或财阀，而应属于全体布列塔尼人。我们将建立一个直接回应民众需求、代表民族利益的人民国政权"
 BRI_socialist_policy: "社会主义政策"
 BRI_socialist_policy_desc: "为了消除贫富差距，我们将推行广泛的社会改革。通过财富重分配与社会保障体系，确保每一个布列塔尼公民都能体面地生活"
 BRI_nationalize_industry: "工业国有化"
 BRI_nationalize_industry_desc: "关键的工业命脉必须掌握在国家手中。我们要没收那些唯利是图的私人资本，将工厂转化为推动民族进步的公共引擎"
 BRI_rise_of_Ar_Falz: "阿尔法兹的崛起"
 BRI_rise_of_Ar_Falz_desc: "“阿尔法兹”（Ar Falz）不仅是一个世俗教育组织，更是左翼文化的灯塔。在他们的引导下，我们将培养出一代具备社会主义思想的新型布列塔尼人"
 BRI_cooperate_with_cachin: "与加香合作"
 BRI_cooperate_with_cachin_desc: "马塞尔·加香在国际工运中享有盛誉。通过与他领导的派系合作，我们可以汲取组织经验，并在激进派中赢得更多支持"
 BRI_down_with_ultranat: "打倒极端民族主义"
 BRI_down_with_ultranat_desc: "那些排外的狂热分子只会带来毁灭。我们要捍卫革命的成果，肃清右翼毒素，建立一个基于平等而非仇恨的新社会"
 BRI_intergrate_syndicalists: "整合工团主义者"
 BRI_intergrate_syndicalists_desc: "工会是组织生产的最佳形式。我们将汲取工团主义者管理经济上的经验并将其融入国家架构，让工人在车间里也能拥有决策权从而调动生产"
 BRI_farmers_syndicate: "工团主义为农民"
 BRI_farmers_syndicate_desc: "通过建立农村工团，我们将分散的农户组织起来，共同抵御市场风险，共享机械化成果，重塑农村经济格局"
 BRI_red_liberty: "赤色自由"
 BRI_red_liberty_desc: "在红色的旗帜下，我们将赢得真正的解放。这种自由不是剥削的自由，而是劳动者摆脱压迫、共同发展的神圣权利"
 BRI_celtic_nation: "复兴凯尔特身份"
 BRI_celtic_nation_desc: "作为凯尔特民族在大陆的唯一火种，这一仅有的奇迹，我们有责任守护这份古老的血脉。我们要向世界证明，高卢的余烬从未熄灭"
 BRI_britanny_language: "恢复布列塔尼语教学"
 BRI_britanny_language_desc: "语言是民族的灵魂。我们将强制在学校推广布列塔尼语教学，让下一代能够用祖先的语言思考与歌唱"
 BRI_mordel_again: "莫德雷尔继续掌舵"
 BRI_mordel_again_desc: "奥利维尔·莫德雷尔再次证明了他卓越的政治手腕。在他的领导下，布列塔尼将保持航向，在动荡的欧洲政局中稳步前行"
 BRI_friend_of_capital: "资本之友"
 BRI_friend_of_capital_desc: "我们并不排斥资本，只要它为民族服务。通过创造良好的营商环境，我们将吸引投资，推动布列塔尼的现代化建设"
 BRI_made_in_britanny: "布列塔尼商品，享誉全球！"
 BRI_made_in_britanny_desc: "我们的工匠精神将转化为卓越的产品力。通过出口高品质的“布列塔尼制造”，我们将赚取外汇，提升国家的国际地位"
 BRI_moderate_legionarism: "温和化军团主义意识形态"
 BRI_moderate_legionarism_desc: "保留军团主义的纪律与荣誉感，但摒弃其过度的狂热。我们要建立一个既有秩序又不失灵活的社会运行机制"
 BRI_dominate_church: "掌控教会"
 BRI_dominate_church_desc: "教会必须成为国家的助力而非阻力。我们将加强对宗教事务的管理，确保神职人员的言行符合民族利益"
 BRI_corporatism_policy: "法团主义政策"
 BRI_corporatism_policy_desc: "将社会划分为不同的行业法团，通过国家调解来解决利益冲突。这是一种超越资本主义与社会主义的“第三条道路”"
 BRI_class_cooperation: "鼓励阶级合作"
 GI_class_cooperation_desc: "劳方与资方不是天敌，而是民族战壕里的战友。通过建立协商机制，我们将把阶级斗争转化为共同致富的合力"
 BRI_national_wakening: "民族觉醒"
 BRI_national_wakening_desc: "沉睡的雄狮已经睁开了双眼。布列塔尼人不再甘于平庸，我们将以雷霆之势夺回属于我们的历史地位"
 BRI_marruassism_incoming: "莫拉斯主义启迪"
 BRI_marruassism_incoming_desc: "借鉴查尔斯·莫拉斯的智慧，我们追求“整体民族主义”。摒弃虚伪的民主议会，回归最真实、最自然的民族秩序"
 BRI_regionalism_and_autonomism: "地方主义与分权主义之间"
 BRI_regionalism_and_autonomism_desc: "国家应该由一个个有机联系的小共同体组成。我们要在中央权威与地方自治之间寻找微妙的平衡，让每一片土地都焕发生机"
 BRI_rebuild_army: "改组军队"
 BRI_rebuild_army_desc: "旧军队的结构已经过时。我们要建立一支职业化、忠诚度极高的新型武装，代替充满极端民族主义的武装力量，使其成为保卫布列塔尼最坚实的壁垒"
 BRI_party_unity: "促进政党团结"
 BRI_party_unity_desc: "内部的裂痕必须弥合。我们将通过整合各派系，确保政党成为一个声音、一个意志的战斗单元"
 BRI_erdicrate_jew: "清除犹太威胁"
 BRI_erdicrate_jew_desc: "犹太人与资本同行，他们为了利益什么都可以背叛。无论出于什么目的维护民族的经济独立与文化纯洁，我们必须采取果断行动，清除那些渗透进我们体内的异族影响"
 BRI_organic_state: "有机国家"
 BRI_organic_state_desc: "国家不是冷冰冰的机器，而是一个活生生的有机体。每个部门如脏器般支撑着国家运转每个公民都是这个身体里的细胞，各司其职，共同维系布列塔尼这个庞大的国家机器"
 BRI_road_of_independent: "独立之路，坚定不移"
 BRI_road_of_independent_desc: "几个世纪以来，我们的土地一直被异族的阴影所笼罩。现在，布列塔尼不会再向巴黎乞求怜悯，我们将用自己的双手开辟出一条通往自由的康庄大道。无论前路多么艰辛，独立之志永不动摇"

 BRI_millitary_coup: "军事政变"
 BRI_millitary_coup_desc: "当布列塔尼国民党政府在软弱与争吵中徘徊时，唯有纪律和武力能拯救国家。佩洛特士兵们已经接管了关键部门，刺刀将成为法律的守护者。这不是权力的篡夺，而是为了秩序的回归"

 BRI_laine_stays: "赖因继续掌权"
 BRI_laine_stays_desc: "塞尔斯坦·赖因的名字象征着斗争。尽管外界压力重重，但他依然是布列塔尼无可争议的领袖。在他的领导下，我们将继续巩固民族的脊梁，确保政权稳定与布列塔尼历史的延续"

 BRI_away_with_french: "联盟不再"
 BRI_away_with_french_desc: "所谓的朋友，不过是披着羊皮的压迫者。我们已经受够了法兰西的颐指气使。今天，我们正式切断与法兰西的一切政治联系，布列塔尼不再是任何人的附属品"

 BRI_irish_friends: "爱尔兰的盟友"
 BRI_irish_friends_desc: "在海峡的另一头，有着与我们血脉相连的凯尔特兄弟。爱尔兰曾历经磨难才赢得自由，他们将成为我们最可靠的贸易伙伴与战略盟友。凯尔特人的团结将让世界为之侧目"

 BRI_no_libtards: "摧毁自由阵线"
 BRI_no_libtards_desc: "自由民主投机派是导致社会瓦解的毒药。那些高喊民主口号的投机分子，本质上是在出卖国家利益。我们要彻底铲除这些软弱的自由派，将权力和纪律重新带回布列塔尼"

 BRI_esotericism: "拥抱神秘主义"
 BRI_esotericism_desc: "布列塔尼的灵魂隐藏在远古的森林与巨石阵中。我们要挖掘那股沉睡已久的神秘力量，将古老的传统与现代国家体制结合。这不仅仅是政治，这是一场关乎灵魂的觉醒"

 BRI_expand_bezrrot: "扩展战斗部队"
 BRI_expand_bezrrot_desc: "佩罗特战斗队是布列塔尼民族最坚固的盾。我们需要更多的志愿者，更多的训练，以及更先进的武装去武装这支保卫我们民族身份的队伍。当战争来临时，他们将是布列塔尼最锋利的利刃"

 BRI_no_capital: "资本主义去死！"
 BRI_no_capital_desc: "贪婪的资本家只看重利润，不关心布列塔尼民族的存亡。莫德雷尔的黑市只会让资本主义的蛀虫蛀空布列塔尼的躯壳。我们要打破金钱对社会的束缚，取缔投机行为"

 BRI_nord_celtic_revival: "北欧—凯尔特民族主义"
 BRI_nord_celtic_revival_desc: "我们是古老北欧战士与凯尔特先民的后裔。通过追溯血缘中的高贵基因，我们将重塑布列塔尼人的身份认同。我们要证明，我们是这片土地上真正的主人"

 BRI_bastion_of_reaction: "反动堡垒"
 BRI_bastion_of_reaction_desc: "在虚伪的进步主义与激进革命恐怖疯狂席卷欧洲的时代，布列塔尼将成为传统价值的最后堡垒。我们拒绝对现代性妥协，我们要守护家庭、土地与最原始的秩序"

 BRI_power_to_church: "权力归于草创者"
 BRI_power_to_church_desc: "教会不仅仅是信仰的寄托，更是布列塔尼社区的灵魂。我们将允许神职人员参与国家决策，让权力归于草创者，让上帝的训诫指引布列塔尼的方向与民族的未来"

 BRI_catholic_nation: "天主教国家"
 BRI_catholic_nation_desc: "十字架与国旗同在。我们将确立天主教作为布列塔尼国教的地位，让他至高无上。我们所信仰的教义在教育、法律和日常生活中弘扬福音精神。一个虔诚的国家，必将得到神助"

 BRI_culture_revival: "布列塔尼文化复兴"
 BRI_culture_revival_desc: "让布列塔尼语重新在街头响起，让古老的风笛再次吹奏。我们将资助艺术、文学与历史研究，从灰烬中重塑我们被法兰西文化同化前的辉煌文明"

 BRI_no_commies: "摧毁社会主义"
 BRI_no_commies_desc: "共产主义是所有民族的大敌。他们的革命恐怖葬送了一个又一个民族国家。我们将清除所有的社会主义抵抗分子，将红色的幽灵彻底驱逐出这片神圣的土地。布列塔尼绝不容忍阶级斗争的噪音"

 BRI_retake_rural: "夺回农村"
 BRI_retake_rural_desc: "城市的腐化令人作呕，只有在广袤的农村和农场中，布列塔尼的根脉才得以保存。我们将推行土地改革，支持自耕农，将国家的重心重新引向生机勃勃的田野"
 BRI_moderate_nationalism: "温和民族主义立场"
 BRI_moderate_nationalism_desc: "布列塔尼的复兴不需要激进的口号，而需要稳健的步伐。我们将采取一种务实的态度，在维护民族尊严的同时，避免陷入自我毁灭的狂热，寻求更理性的发展空间"
 BRI_Bleun_Brug: "石楠花协会复兴"
 BRI_Bleun_Brug_desc: "“石楠花”协会不仅是天主教的旗帜，更是布列塔尼文化的灵魂。这一传统组织的复兴，我们将把信仰与民族情感紧密结合，在教区的基石上重建我们的社会"
 BRI_remove_radicals: "踢开激进派"
 BRI_remove_radicals_desc: "那些被权力欲望冲昏头脑的狂热分子只会把国家带向深渊。为了政权的稳定和国际声誉，必须将他们清除出决策层。温和派将接管大局，重塑秩序"
 BRI_traditional_revival: "传统复兴"
 BRI_traditional_revival_desc: "真正的进步往往源自对过去的尊重。我们要恢复那些被现代性冲淡的传统习俗，保护布列塔尼的语言与艺术，让民族的灵魂在古老的礼仪中重新苏醒"
 BRI_anti_modrelists: "反莫德雷尔派国民党"
 BRI_anti_modrelists_desc: "奥利维尔·莫德雷尔及其追随者的野心以及其背后的黑市网络已经威胁到了党的团结甚至是国家的稳定。通过剔除这些投机分子，我们可以确保国民党的纯洁性，使其重新成为布列塔尼民族意志的代表服务于全体布列塔尼人而非个人"
 BRI_reorganize_BNP: "重组国民党"
 BRI_reorganize_BNP_desc: "旧的体制已经腐朽。我们将对国民党进行彻底的机构重组，建立更高效的指挥体系和更严明的纪律，使其成为引领民族走向未来的核心骨干"
 BRI_ultranationalism: "极端民族主义信条"
 BRI_ultranationalism_desc: "温和是弱者的借口，妥协是失败的开端。只有通过绝对的忠诚与残酷的纪律，我们才能在弱肉强食的世界中生存。布列塔尼将成为一个钢铁般意志的整体"
 BRI_expel_laine: "赶走赖因"
 BRI_expel_laine_desc: "塞尔斯坦·赖因的时代已经结束。他的存在成了我们走向更彻底革命的阻碍。是时候将这位前领袖送入历史的垃圾堆，迎接更激进、更纯正的领导核心"
 BRI_cooperate_with_church: "与佩洛特合作"
 BRI_cooperate_with_church_desc: "佩洛特神父的精神遗产将成为战士们的灯塔。我们将与激进的教会势力联手，创造出一种神圣的战斗精神，用信仰作为最锐利的武装"
 BRI_ancestor_tradition: "我们祖先的传统"
 BRI_ancestor_tradition_desc: "我们的血脉中流淌着古代勇士的基因。我们要追溯并恢复那些被遗忘的、带有战斗色彩的祖先传统。这不是单纯的回溯，而是对民族原始力量的召唤"
 BRI_erdicrate_opposition: "根除反对派"
 BRI_erdicrate_opposition_desc: "在统一的民族意志面前，任何异见都是对国家的背叛。我们将动用国家机器，彻底铲除所有公开和潜在的反对派。布列塔尼不需要杂音，只需要服从"
 BRI_defend_race: "保卫种族"
 BRI_defend_race_desc: "布列塔尼不仅是一个地理概念，更是一个血缘共同体。我们将建立严格的法则来保卫我们血脉的纯洁性，坚决抵御外来移民与劣质文化的污染"
 BRI_nation_reborn: "民族重生"
 BRI_nation_reborn_desc: "旧的布列塔尼已在烈火中灰飞烟灭，一个新的、更强大的实体已在灰烬中诞生。我们将向世界宣告：一个觉醒的、统一的布列塔尼将夺回属于它的荣光"
 BRI_autonomists: "自治党的胜利"
 BRI_autonomists_desc: "马尔马加的胜利意味着布列塔尼将走上一条寻求平衡的道路。我们不再追求虚无缥缈的帝国梦，而是在联邦主义的约束下保障下，争取实实在在的自治与自由"
 BRI_ally_BFF: "与自由阵线结盟"
 BRI_ally_BFF_desc: "布列塔尼自由阵线代表着民众对压迫的反抗。与他们结盟可以帮助我们可以集结最广泛的民间力量，共同对抗那些试图束缚我们的枷锁"
 BRI_federalism: "联邦主义取代民族主义"
 BRI_federalism_desc: "单一民族国家已经过时。我们将推行联邦主义，尊重地区差异，用契约和合作取代盲目的排外心态。布列塔尼将成为自由地区的典范"
 BRI_national_unity_government: "民族团结政府"
 BRI_national_unity_government_desc: "在国家转型的关键时刻，党派成见必须让位于共同利益。我们将组建一个包含社会各界力量的团结政府，共商国是，共度难关"
 BRI_destory_church_Influence: "摧毁教会影响"
 BRI_destory_church_Influence_desc: "世俗化是进步的基石。我们要将公共行政、教育与宗教教条彻底剥离开来，确保科学与理性引领国家，而不是陈旧的信条"
 BRI_international_minority_committee: "少数民族国际委员会"
 BRI_international_minority_committee_desc: "布列塔尼不是孤岛。我们将发起并领导这一委员会，联合欧洲其他压迫的少数群体，在国际舞台上共同争取生存权与尊严"
 BRI_social_democratic: "实施社会民主"
 BRI_social_democratic_desc: "真正的自由必须以社会公平为基础。我们将实施社会民主政策，通过完善的福利保障和公平分配，让每一个布列塔尼公民都能享受到发展的红利"
 BRI_celtic_tradition: "重建凯尔特信仰"
 BRI_celtic_tradition_desc: "凯尔特精神不应被政治扭曲。我们要以开放、包容的心态重建凯尔特文化传统，让古老的自然智慧点亮现代的公民生活"
 BRI_embrace_liberty: "拥抱自由"
 BRI_embrace_liberty_desc: "经过长久的挣扎，自由的晨曦终于降临。对法兰西行动的背叛让马尔马加知道了左右的可贵，保障每一位公民的基本权利，意志是自由的，言论是公开的我们才能鼓起勇气，迈向属于我们的联邦之梦"
 BRI_new_road: "迈上新路"
 BRI_new_road_desc: "过去已成定局，而未来掌握在每个人手中。布列塔尼将摒弃狭隘的仇恨，迈上一条充满包容与希望的新纪元之路"
 BRI_BFF: "自由阵线的胜利"
 BRI_BFF_desc: "长夜已尽，自由阵线终于在政治斗争中击溃了莫德雷尔。雷恩上空飘扬着我们的旗帜。我们不仅赢得了政权，更赢得了布列塔尼的人心。我们将把权力从官僚手中夺回，还给每一个自由的布列塔尼公民"
 BRI_synd_socdem: "布列塔尼民族党"
 BRI_synd_socdem_desc: "作为民族党内部的进步力量，我们相信民族自决与社会主义并行不悖。我们将通过议会与工会的双重力量，为布列塔尼打造一条温和的左翼发展道路"
 BRI_syndicalism_revival: "工团主义复兴"
 BRI_syndicalism_revival_desc: "旧的雇佣关系已经腐朽，我们要重新组织起布列塔尼的工团组织，让生产资料回归劳动者，让工厂的机器为布列塔尼的繁荣而轰鸣"
 BRI_internationalism: "反军国国际主义"
 BRI_internationalism_desc: "战争是统治阶级的游戏。我们拒绝参与列强之间的军备竞赛，布列塔尼将成为和平的堡垒，向全世界所有受压迫的少数民族伸出援手"
 BRI_autonomy_commune: "自治公社建设"
 BRI_autonomy_commune_desc: "权力应当在基层绽放。通过建立高度自治的社区公社，我们将废除金字塔式的低效管理管理，让每一个村庄和社区都能自主决定，提高国家机器的行政效率"
 BRI_social_nationalism: "社会民族主义"
 BRI_social_nationalism_desc: "民族主义不应是少数权贵的玩物，真正的民族主义必须关注民众的生计。一个饥肠辘辘的民族谈何自尊？我们将建立属于布列塔尼人的社会保障作为回应"
 BRI_red_and_black: "黑与红的旗帜"
 BRI_red_and_black_desc: "红色代表阶级斗争，黑色代表永恒的自由。在这面旗帜下，布列塔尼的工农将扫清一切旧时代的残余，建立一个没有压迫、没有剥削的理想社会"
 BRI_black_and_white: "黑与白的战士"
 BRI_black_and_white_desc: "黑白相间的“格温哈杜”是我们的战袍。为了保卫革命果实，每一位公民都将成为战士，用生命捍卫布列塔尼的独立与尊严"
 BRI_utopia_in_west_europe: "西欧乌托邦"
 BRI_utopia_in_west_europe_desc: "当周围的世界在战争与贪婪中沉沦，布列塔尼将成为西欧文明的灯塔。我们将证明，一个基于互助、平等与艺术的乌托邦并非遥不可及"
 BRI_anti_ultranat: "打击极端民族主义"
 BRI_anti_ultranat_desc: "极右翼的毒素会腐蚀民族的灵魂。为了捍卫我们的自由，必须对那些煽动仇恨和独裁的极端分子进行果断打击"
 BRI_brittany_socialism: "布列塔尼社会主义"
 BRI_brittany_socialism_desc: "这不是教条的马列主义，而是深深扎根于凯尔特土地的社会主义。我们将平等主义与我们的民族性格相结合，开辟一条独特的道路"
 BRI_worker_rights: "保障工人权利"
 BRI_worker_rights_desc: "法律将不再是资产阶级的挡箭牌。我们将制定严苛的劳工保护法，确立八小时工作制和带薪休假，让布列塔尼成为工人的乐土"
 BRI_defend_liberty: "保卫自由"
 BRI_defend_liberty_desc: "自由不是廉价的口号，而是需要鲜血去守护的权利。我们将建立完善的法律框架和民兵体系，防止任何形式的独裁卷土重来"

 # --- 自由派：蓝色联盟与世俗化 ---
 BRI_radsoc_soclib: "布列塔尼蓝色联盟"
 BRI_radsoc_soclib_desc: "蓝色联盟代表旧日布列塔尼俱乐部，代表着激进社会党与社会自由派的联合，旨在将布列塔尼建设成一个现代、开放的民主共和国"
 BRI_debrittanylize: "去布列塔尼化"
 BRI_debrittanylize_desc: "过度的民族狂热只会导致孤立与落后。我们需要清除那些陈腐的、排外的民族主义迷思，拥抱普世价值，让布列塔尼重新融入现代文明的主流"
 BRI_crush_clericals: "粉碎教权主义"
 BRI_crush_clericals_desc: "圣坛不应干涉政坛。我们要剥夺教会在教育与公共事务中的特权，将那些躲在黑袍下的阴影彻底逐出国家决策层"
 BRI_jacobin_legacy: "大革命精神永存"
 BRI_jacobin_legacy_desc: "我们继承了1789年的不灭薪火。自由、平等、博爱不仅仅是口号，更是我们改造这个腐朽社会的利剑"
 BRI_middle_class: "新中产阶级"
 BRI_middle_class_desc: "国家的稳定取决于庞大的中产阶层。通过支持中小商户、医生、律师和专业技术人员，我们将为布列塔尼的民主夯实基础"
 BRI_agrian_reform: "农业改革"
 BRI_agrian_reform_desc: "打破地主阶级的垄断，让农民拥有自己的土地。通过技术革新与市场化，我们将让布列塔尼的田野焕发出前所未有的生机"
 BRI_control_the_capital: "驾驭资本"
 BRI_control_the_capital_desc: "资本是火，善用可以取暖，失控则会烧毁房屋。我们将建立金融监管机制，确保投资流向建设民族工业的领域，而非投机陷阱"
 BRI_defend_democracy: "保卫民主"
 BRI_defend_democracy_desc: "当四周的强邻都在滑向威权时，布列塔尼将坚守议会民主的阵地。我们将保障选举的公平与言论的自由，让人民的声音永远响亮"
 BRI_authdem_soccon: "布列塔尼地方主义联盟"
 BRI_authdem_soccon_desc: "保守主义不是固步自封，而是守护根脉。我们将集结所有认同传统价值的力量，建立一个稳健、权威但尊重地方惯例的国家"
 BRI_social_catholic: "社会天主教"
 BRI_social_catholic_desc: "上帝的恩典与社会的公正并不冲突。我们将遵循教宗的训谕，在关爱穷人与维护传统道德之间寻找完美的平衡点"
 BRI_brittany_culture: "复兴布列塔尼文化"
 BRI_brittany_culture_desc: "从巨石阵到叙事长诗，我们的文化是祖先留下的最宝贵财富。我们将建立博物馆与艺术学院，让布列塔尼的瑰宝重放异彩"
 BRI_oppose_socialism: "反对社会主义"
 BRI_oppose_socialism_desc: "阶级斗争是撕裂民族的谎言。我们要坚决抵制红色幽灵的渗透，用社会协作和信仰的力量去战胜那些破坏秩序的极端思想"
 BRI_Gorsedd: "戈尔赛德兄弟会"
 BRI_Gorsedd_desc: "布列塔尼吟游诗人的古老传承将焕发新生。戈尔赛德不仅是文化组织，更是我们精神独立的守护者，维系着布列塔尼与古代凯尔特灵魂的契约"
 BRI_aristocracy_rule: "贵族政治"
 BRI_aristocracy_rule_desc: "并非所有人都有能力治理国家。我们将恢复那些古老家族的地位，让具备荣誉感与责任心的精英阶层引领布列塔尼，重现高贵的秩序"
 BRI_panceltic: "泛凯尔特主义呼吁"
 BRI_panceltic_desc: "从爱尔兰到苏格兰，从马恩岛到康沃尔，凯尔特兄弟们应当团结起来。我们要建立一个跨越海洋的联盟，共同对抗外来的同化压力"
 BRI_tradition_and_conservative: "保守与传统"
 BRI_tradition_and_conservative_desc: "改变应当是缓慢且有机的。我们将维护家庭、教会与土地的权威，确保布列塔尼在变革的洪流中永远不迷失方向"
 BRI_free_and_strong: "布列塔尼自由且强大"
 BRI_free_and_strong_desc: "我们不求霸权，但求独立。通过巩固国防与强化民族共识，布列塔尼将作为一个独立自主的强国屹立于欧洲之林"
 BRI_communists: "选票带来革命"
 BRI_communists_desc: "布列塔尼国民大会的斗争只是暂时的战场，真正的胜利属于无产阶级。我们将利用现有的体制夺取权力，然后毫不犹豫地开启通往苏维埃布列塔尼的道路"
 BRI_broad_revo_alliance: "广泛革命联盟"
 BRI_broad_revo_alliance_desc: "为了打倒共同的敌人，我们将团结一切可以团结的力量。团结全布列塔尼的社会主义者与进步力量于共产党的领导下，汇聚成不可阻挡的革命洪流"
 BRI_revolution_continues: "革命还将继续"
 BRI_revolution_continues_desc: "夺取政权只是第一步。我们要时刻警惕反革命势力的反扑，在经济文化和思想领域持续推进革命，确保红色永不褪色"
 BRI_reorganize_union: "重组工会组织"
 BRI_reorganize_union_desc: "旧工会太软弱，我们要将其改造为垂直管理的、具备高度纪律性的生产单位，使其成为无产阶级专政与激进革命的坚实基础"
 BRI_jacobinism_revival: "复兴雅各宾主义"
 BRI_jacobinism_revival_desc: "革命需要雷霆手段。我们将复兴雅各宾主义的激进革命精神，对一切反革命分子实施正义的审判，用暴力来捍卫共和国的生存"
 BRI_liberate_workers: "解放布列塔尼工人"
 BRI_liberate_workers_desc: "布列塔尼的工人正在遭受着压迫，作为共产党人，我们必须打碎所有无形的枷锁。我们将废除私有制，消灭剥削，让布列塔尼的工人阶级真正获得人格与物质的双重解放"
 BRI_agrian_cooperates: "农业合作社"
 BRI_agrian_cooperates_desc: "小农经济没有未来。我们将通过集体化与合作社化，将分散的农田集中起来，用工业化的手段改造古老的农业"
 BRI_unify_party: "共产党的统一"
 BRI_unify_party_desc: "党内决不允许派系林立。我们将进行彻底的思想清洗，确立领袖的绝对权威，确保全党上下只有一个意志、一个声音"
 BRI_al_farz_support: "寻求阿尔法兹支持"
 BRI_al_farz_support_desc: "“阿尔法兹”的农业社会主义思想值得我们学习与借鉴，与阿尔法兹的合作有利于我们将红色思想渗透进乡村教育，让布列塔尼的乡野间洒下革命的种子"
 BRI_local_autonomy: "地方自治原则"
 BRI_local_autonomy_desc: "在民主集权制的框架下，我们将给予地方一定的事务管理权，以充分调动各地民众建设社会主义的积极性"
 BRI_leninism_rise: "列宁主义放光芒"
 BRI_leninism_rise_desc: "真理不在议会的争吵中，而在严密的先锋队组织里。列宁主义将成为我们改造布列塔尼的科学武器，引领我们走向必将到来的胜利"
 BRI_revolution_eternal: "重燃烈火"
 BRI_revolution_eternal_desc: "革命不是瞬间的爆发，而是永恒的斗争。我们要将火种播撒到每一个人心中，让布列塔尼成为永久革命的实验场"
 BRI_popf: "工农的布列塔尼"
 BRI_popf_desc: "我们要建立一个纯粹的、排他的工农政权。任何不劳而获的阶级在新的布列塔尼都将没有立足之地"
 BRI_nazbols: "共产主义新理解"
 BRI_nazbols_desc: "共产主义是什么？是那些所谓的工团主义民主加内部改良的骗局吗？他们错了，他们大错特错！共产主义绝不搞这些和第三共和国一样荒唐可笑的“工团议会”，共产主义在呼唤革命，而不是套皮议会！真正的布尔什维克必须拥抱民族的血缘，用铁拳重塑民族的意志"
 BRI_assimilate_nationalists: "吸纳民族主义者"
 BRI_assimilate_nationalists_desc: "民族主义者的狂热只要经过阶级意识的改造，就能成为革命最强大的燃料。我们将把他们对土地的热爱转化为对社会主义祖国的忠诚"
 BRI_only_france: "没有布列塔尼，只有法兰西！"
 BRI_only_france_desc: "布列塔尼的尝试已经失败。为了抵抗反动的侵袭，我们必须彻底回归法兰西的怀抱。拆除边境，统一语言，我们是法兰西革命不可分割的一部分！"
 BRI_socialist_economy: "社会主义经济体制"
 BRI_social_information_committee: "社会信息委员会"
 BRI_socialist_economy_desc: "革命路上，明枪易挡暗箭难防，建立由国家委员会直接控制的信息委员会管控群众的言论。每一位革命的喉舌们都将服务于革命的宏伟蓝图"
 BRI_labor_front: "社会劳工阵线"
 BRI_labor_front_desc: "所有的劳动力都将被编入准军事化的劳工阵线。通过钢铁般的纪律，我们将以超乎想象的速度完成布列塔尼国家工业化与其他事业的建设工作"
 BRI_collectivize: "全面集体化"
 BRI_collectivize_desc: "私有制是万恶之源。我们将强制推行全面集体化，将一切生产资料收归公有。任何阻碍集体化进程的势力都将被革命的巨轮碾碎"
 BRI_authoritain_socialism: "威权政治"
 BRI_authoritain_socialism_desc: "在革命的特殊时期，民主是奢侈的浪费。我们需要一个强有力的核心，用绝对的权威来确保革命政策的执行，排除一切噪音"
 BRI_destory_democracy: "摧毁自由民主"
 BRI_destory_democracy_desc: "所谓的“自由民主”不过是财阀用来欺骗民众的遮羞布。我们将彻底铲除这种虚伪的制度，代之以高效、直接的无产阶级专政"
 BRI_social_information_committee: "社会信息委员会"
 BRI_social_information_committee_desc: "信息是战争的延伸。通过成立该委员会，我们将全面监控社会舆论，通过宣传与教育，确保布列塔尼人的思想始终处于革命的正确频率"
 BRI_trimph_of_true_socialism:"真正社会主义的凯旋"
 BRI_trimph_of_true_socialism_desc:"法兰西公社联邦只不过是一个在革命口号下千疮百孔的破房子，他们葬送了革命的理想。而我们绝不能重蹈覆辙，我们要发起一场真正的革命，让真正的社会主义再一次于高卢凯旋"
 BRI_onwards:"向前进！"
 BRI_onwards_desc:"我们法兰西工农共产党在脱离了公社联邦的束缚后天天向好，蒸蒸日上。如今我们终于可以在法兰西的坵墟之上塑造我们的理想，向着属于法兰西民族的革命道路继续进军"
 BRI_brittanny_construction:"布列塔尼建构区"
 BRI_brittanny_construction_desc:""
 BRI_machine_and_gear:"机器与齿轮"
 BRI_machine_and_gear_desc:""
 BRI_destruction_and_rebulid:"毁灭与重构"
 BRI_destruction_and_rebulid_desc:""
 BRI_purge_streets:"清洗街道"
 BRI_purge_streets_desc:""
 BRI_strongest_stays:"最强者留存"
 BRI_strongest_stays_desc:""
 BRI_cleverist_stays:"最智者留存"
 BRI_cleverist_stays_desc:""
 BRI_new_state:"新国家"
 BRI_new_state_desc:""
 BRI_new_man:"新人类"
 BRI_new_man_desc:""
 BRI_new_society:"新社会"
 BRI_new_society_desc:""
 BRI_assimilation:"开始同化"
 BRI_assimilation_desc:""
 BRI_beyond_totalism:"超越极权"
 BRI_beyond_totalism_desc:""
 BRI_beyond_natpop:"超越民粹"
 BRI_beyond_natpop_desc:""
 BRI_new_order:"新秩序"
 BRI_new_order_desc:""
 BRI_mordrel_folly: "莫德雷尔的愚行"
 BRI_mordrel_folly_desc: "奥利维尔·莫德雷尔太沉迷于那种浪漫且过时的民族主义幻想了。在充满效率的报表和增长曲线面前，那些关于血缘与土地的口号显得苍白无力。我们要纠正他的错误，将国家引回务实的轨道"
 BRI_disband_millita: "解散民兵"
 BRI_disband_millita_desc: "街道上不需要扛着长枪的暴民。民兵是动荡的源头，也是生产力的巨大浪费。所有的步枪都应该上交，而拿枪的手应该重新回到工厂握住扳手和操纵杆"
 BRI_back_to_work: "回去干活！"
 BRI_back_to_work_desc: "罢工结束了，抗议结束了，空谈也结束了。布列塔尼不需要英雄，只需要高效的齿轮。现在，立刻回到你们的岗位上去，为公司的——不，为国家的繁荣贡献每一分钟"
 BRI_board_and_managers: "召集董事与经理"
 BRI_board_and_managers_desc: "真正的权力不应该在议事厅里，而应该在宽敞明亮的董事会会议室里。我们将召集全境最顶尖的管理精英，由他们来制定国家的“年度运营计划”"
 BRI_committee_meeting: "召开企业理事会"
 BRI_committee_meeting_desc: "行业协会将取代政党。通过理事会，我们将抉择出企业帝国的继承者，确保整个国家的资源分配达到最优状态"
 BRI_lagadelle: "拉加代尔传媒集团"
 BRI_lagadelle_desc: "信息的流动必须受控。拉加代尔集团将接管布列塔尼所有的报纸、电台和印刷厂。我们将确保民众看到的每一条新闻，都符合企业利益与国家形象"
 BRI_propaganda_system: "掌控宣传部门"
 BRI_propaganda_system_desc: "宣传本质上就是一种营销。我们要像推销新型号的肥皂一样，将“秩序”与“顺从”推销给每一个公民。如果他们不买账，那说明我们的广告覆盖率还不够高"
 BRI_third_eye: "第三只眼在看着你"
 BRI_third_eye_desc: "管理需要精准的数据。通过监控摄像头和信息采集网络，公司将时刻关注每一位员工的动态。只要你问心无愧，就不必担心那只永远睁着的眼睛"
 BRI_red_millionaire: "红色亿万富翁"
 BRI_red_millionaire_desc: "谁说资本家不能拥护革命？只要革命的结果是垄断，他们就是最坚定的革命者。这些穿着西装的“革命先锋”将用金钱为新秩序铺平道路"
 BRI_nationalize_lol: "“国有化”资产"
 BRI_nationalize_lol_desc: "是的，我们“国有化”了一切。只不过，这里的“国”指的就是我们的企业联盟。通过这种名义上的转手，我们成功地消灭了竞争对手，实现了完美的垄断，不是吗？"
 BRI_peoples_enterpreur: "人民企业家"
 BRI_peoples_enterpreur_desc: "我们不再称呼他们为老板，而是“人民企业家”。他们负责管理人民的资产，并从中抽取那么一点点合理的管理费用。这很公平"
 BRI_puppet_pcf: "傀儡化共产党"
 BRI_puppet_pcf_desc: "如果不能消灭他们，就买下他们。我们将通过资助和安插人手，让共产党变成一个只会在劳动节喊口号、实际上却在维护生产效率的摆设"
 BRI_franc_socialism: "法郎社会主义"
 BRI_franc_socialism_desc: "这是一种全新的社会主义：它不追求阶级平等，只追求货币稳定。只要每个人手里都有法郎，谁还在乎工厂到底属于谁呢？"
 BRI_michelin: "米其林轮胎集团"
 BRI_michelin_desc: "米其林不仅生产轮胎，它还生产秩序。作为布列塔尼工业的明珠，该集团将深度参与国家的交通与基建决策。毕竟，没有比米其林更懂如何让这个国家转动起来的人了"
 BRI_rubber: "合成橡胶厂建设"
 BRI_rubber_desc: "为了摆脱对海外原材料的依赖，我们将投入巨资研发合成橡胶。烟囱将冒出滚滚黑烟，但这正是进步的气息"
 BRI_rubber_railway: "胶轮路轨系统"
 BRI_rubber_railway_desc: "为什么要用落后的钢轮？米其林的胶轮技术将让列车运行得更静谧、更快速。这是属于布列塔尼的技术革新，也是企业实力的象征"
 BRI_rubber_empire: "橡胶帝国"
 BRI_rubber_empire_desc: "从密封圈到传送带，橡胶将充斥着布列塔尼人的生活。我们将建立一个从生产到消费的完整闭环，让米其林的标志出现在每一个角落"
 BRI_total: "道达尔能源集团"
 BRI_total_desc: "能源是文明的血液。道达尔集团将获得布列塔尼所有的能源勘探与开采权。在这个帝国里，石油的流向就是权力的流向"
 BRI_oil_must_flow: "石油必须流动！"
 BRI_oil_must_flow_desc: "无论发生什么，无论付出什么代价，石油的供应绝不能中断。如果没有石油，我们的机器就会停止，我们的帝国就会崩塌"
 BRI_synisic_oil: "发展合成石油"
 BRI_synisic_oil_desc: "如果大自然不赐予我们石油，我们就通过化学实验室去掠夺。科学将弥补资源上的匮乏，让我们的机器永不停歇"
 BRI_oil_more: "黑金汩汩"
 BRI_oil_more_desc: "再道达尔集团的治下，每一滴原油都是液态的金币。随着产量的提升，布列塔尼的工业心脏将跳动得比以往任何时候都要剧烈"
 BRI_LVMH: "LVMH奢侈品集团"
 BRI_LVMH_desc: "品味也是一种权力。LVMH将代表布列塔尼向世界展示什么才是真正的高贵。我们要用丝绸、香水和名表，从全世界的权贵手中换取我们需要的硬通货"
 BRI_wine_industry: "垄断葡萄酒产业"
 BRI_wine_industry_desc: "作为商业巨头，布列塔尼的每一滴陈年佳酿现在都受公司控制。我们将精准调控市场供应，让每一瓶葡萄酒都卖出它应有的天价来保证有足够的财富流入我们的手心"
 BRI_cosmetics: "掌控化妆品行业"
 BRI_cosmetics_desc: "作为奢侈品行业。我们要出口美丽，出口精致。通过垄断化妆品行业，我们将定义全球的审美标准，并以此建立软实力的霸权"
 BRI_jewelry: "手表与珠宝"
 BRI_jewelry_desc: "钻石是永恒的，就像我们的统治一样。精密的手表加工业不仅能带来巨额利润，还能为我们的微电子和精密工程研究提供技术积累"
 BRI_technocracy: "引进技术控制论"
 BRI_technocracy_desc: "政治是一门不精确的艺术，而管理是一门精确的科学。我们将利用控制论原理来治理国家，将一切社会问题转化为数学模型。数字从不说谎"
 BRI_Pasteur: "投资巴斯德研究所"
 BRI_Pasteur_desc: "健康是一种人力资本。通过投资巴斯德研究所，我们要确保我们的劳动力始终处于最佳的生理状态。生病，意味着效率的损失，而我们要最大程度上避免这种情况的出现"
 BRI_moderate_burnamism: "温和化伯纳姆主义"
 BRI_moderate_burnamism_desc: "世界正处于管理者的手中。我们要平稳地完成从传统政权向管理型社会的过渡，让专业的技术官僚取代那些只会演讲的煽动家"
 BRI_sansimon_lagacy: "圣西门主义的遗产"
 BRI_sansimon_lagacy_desc: "正如圣西门所预言的：对人的统治将消失，代之以对物的管理。我们将建立一个由科学家、艺术家和实业家共同领导的有机整体"
 BRI_loyal_scientists: "忠实的科学家"
 BRI_loyal_scientists_desc: "我们不需要那些爱质疑的哲学家，我们需要的是能解决实际问题的工程师。只要拨款充足，他们将是我们最忠诚的仆从"
 BRI_technology_school: "我们的技术学校"
 BRI_technology_school_desc: "我们的教育体系将不再培养独立思考的公民，而是培养标准化的技术人才。每一名学生都是一颗定制的螺丝钉，毕业后直接进入企业的生产线"
 BRI_money_more: "金钱没有臭味"
 BRI_money_more_desc: "无论资金来自哪里，无论交易是否道德，只要能让资产负债表好看，我们都照单全收。在这个世界上，唯有利润是神圣的"
 BRI_communication_control: "染指通信行业"
 BRI_communication_control_desc: "谁控制了电话线和无线电频率，谁就控制了思想的疆域。我们将建立一套密不透风的通信网络，所有的秘密都将呈现在董事会的桌面上"
 BRI_continue_exploit: "可持续的竭泽而渔"
 BRI_continue_exploit_desc: "只要我们剥削的速度能赶上他们恢复的速度，这就不叫竭泽而渔，而叫“可持续发展”。我们要榨干每一份劳动力，直到他们被送入垃圾处理厂"
 BRI_no_pollution: "环境污染？那是什么？"
 BRI_no_pollution_desc: "所谓的环境问题不过是阻碍增长的借口。只要利润在增加，天空是黑的还是蓝的并不重要。如果空气不能呼吸，我们可以向民众出售空气净化器"
 BRI_no_rights: "人权？没听说过！"
 BRI_no_rights_desc: "在布列塔尼，只有“股权”和“债权”。如果你既不持有股份，又没有利用价值，那么你谈论的所谓权利，在公司的账本里一文不值"
 BRI_never_strike: "永无罢工"
 BRI_never_strike_desc: "我们将通过严密的监控、傀儡化的工会以及丰厚的奖金，从而彻底消灭了罢工的可能性。生产线将永远运行，直到宇宙的热寂"
 BRI_true_business_empire: "真正的资本帝国"
 BRI_true_business_empire_desc: "布列塔尼已经不再是一个国家，它是一个横跨多个领域的超级财团。我们没有边境，只有市场份额；我们没有国民，只有雇员和消费者。帝国万岁，利润永恒"
 BRI_force_intergation: "强制合并其他企业"
 BRI_force_intergation_desc: "小的个体户和独立厂商是效率的敌人。我们要发动一场商业吞并战，让他们要么加入我们，要么彻底破产"
 BRI_intergrate_their_industry: "整合他们的产业"
 BRI_intergrate_their_industry_desc: "其他企业的巨头的产业如果能被垂直整合为我所用，形成一个超级大企业，我们的企业王国就将变得更加开阔无比！"
 BRI_relationship_web: "人际关系网"
 BRI_relationship_web_desc: "你以为维系布列塔尼这个企业国家运作的是裙带关系？不，这叫“战略合作伙伴关系”。通过联姻和股份交叉持有，我们将建立一张牢不可破的统治网络"
 BRI_puppet_union: "工会组织建制化"
 BRI_puppet_union_desc: "我们要把工会变成公司的人力资源部。他们现在的任务不是争取权利，而是协助管理层提高工人的生产效率"
 BRI_expand_exports: "扩展出口贸易"
 BRI_expand_exports_desc: "全世界都将消费我们的产品，全世界都将欠下我们的债务。通过庞大的贸易顺差，布列塔尼将成为名副其实的“世界债主”"
 BRI_and_money_more: "财源滚滚"
 BRI_and_money_more_desc: "账面上的数字正在以指数级增长。随着黑金汩汩流出与财富源源不断的汇入每一秒钟，布列塔尼都在变得更加富有，而这些财富将流向最正确的地方——管理者的金库"
 BRI_sky_is_ours: "天空也属于我们！"
 BRI_sky_is_ours_desc: "我们的野心不局限于土地和海洋。我们将发展航空业，控制航线，甚至看向更远的地方。没有任何疆界能限制资本的扩张"
 BRI_trade_with_natfrance: "与阿尔及尔的交易"
 BRI_trade_with_natfrance_desc: "与流亡的法国政府的石油企业进行交易是一门好生意。我们提供工业品，他们提供能源开采权人我们从中获利。商业间的利润势必可以跨越任何政治分歧"
 BRI_biscuit_juice_candy: "饼干，饮料，糖果……"
 BRI_biscuit_juice_candy_desc: "给民众一点甜头，他们就会忘记痛苦。我们将大规模生产低成本的零食和甜味饮料，让廉价的糖分带给他们短暂的幸福感，让他们体验到工作的甜头即能展现我们人道的一面又能让工人死心塌地的为我们工作，何乐而不为？"
 BRI_people_welfare: "人民福利"
 BRI_people_welfare_desc: "通过公司食堂和企业住房，我们为员工提供了全方位的“福利”。当然，前提是你必须保持高效，否则这些福利随时会被收回"
 BRI_and_health: "……还有健康！"
 BRI_and_health_desc: "健康的人才能产出更多。我们将提供基本的疫苗接种和医疗服务，但这并非出于怜悯，而是为了保护公司最重要的资产——劳动力"
 BRI_worker_autonomy: "建立“工人自治”"
 BRI_worker_autonomy_desc: "所谓的“自治”，其实就是让他们自己管理自己，省去了我们雇佣监工的费用。通过这种心理暗示，工人们会为了那点虚假的权力而拼命干活"
 BRI_worker_capitalist_technocrat: "工人，企业家，技术官僚"
 BRI_worker_capitalist_technocrat_desc: "一个三位一体的社会结构：工人出力，企业家出钱，技术官僚出脑子。在这个完美的闭环里，没有人是多余的，也没有人是自由的"
 BRI_parent_of_worker: "工人们的大家长"
 BRI_parent_of_worker_desc: "公司就是你们的家，首席执行官就是你们的父亲。我们会照顾你的生老病死，而你只需要像孝顺的儿子一样，为家业奋斗终身"
 BRI_vive_order: "秩序万岁！"
 BRI_vive_order_desc: "混乱是贫穷的母体，秩序是繁荣的摇篮。在整洁的街道和精准的排班表背后，是布列塔尼最伟大的成就：一个绝对静止且高效的社会"
 BRI_crush_socialism: "社会主义者不得好死"
 BRI_crush_socialism_desc: "那些试图煽动工人罢工、要求所谓“真正公平”的煽动家，是企业毒瘤。我们将动用一切手段——从法庭到保安团——将他们彻底铲除"
 BRI_battlions: "建立战斗团"
 BRI_corporate_army: "企业的军队"
 BRI_battlions_desc: "我们需要更具组织性的安保力量。这些战斗团将直接向董事会负责，保护公司的海外利益与本土设施"
 BRI_corporate_army_desc: "既然国家就是企业，那军队就是保安。这支武装力量将装备最精良的技术，以商业竞争的速度消灭一切敢于威胁利润的敌人"
 BRI_light_in_our_hands: "光明在我们手中"
 BRI_light_in_our_hands_desc: "通过垄断电力与照明，我们真正控制了布列塔尼的昼夜。公司说要有光，便有了光；公司关上开关，世界便陷入黑暗"# --- 世界观与国家身份 ---
 BRI_britanny_on_world_stage: "世界舞台上的布列塔尼"
 BRI_britanny_on_world_stage_desc: "我们不再是地图边缘的一个注脚，也不再是列强博弈的筹码。今天，布列塔尼将作为一个独立且有影响力的实体，在世界外交的棋盘上落下属于我们的一子"
 BRI_our_france_identity: "我们的法兰西身份"
 BRI_our_france_identity_desc: "尽管我们拥有独特的传统，但布列塔尼的灵魂中深深烙印着法兰西的印记。我们不是法兰西的叛逆者，而是法兰西精神最坚定的守护者与继承人"
 BRI_our_celtic_ancestors: "我们的凯尔特祖先"
 BRI_our_celtic_ancestors_desc: "在法兰西的层层剥离之下，是我们那坚硬如花岗岩般的凯尔特内核。我们要追溯到那些无畏勇士的时代，用古代血脉的自豪感重塑布列塔尼的脊梁"
 BRI_our_corporate_empire: "我们的企业帝国"
 BRI_our_corporate_empire_desc: "边境线在资本的流动面前毫无意义。我们的国家不是由官僚定义的，而是由我们的市场占有率定义的。布列塔尼不仅仅是一个领土概念，更是一个无孔不入的商业帝国"
 BRI_october_revolution: "“复兴”十月革命"
 BRI_october_revolution_desc: "当所谓的工团主义者在空谈民主时，我们要用最纯粹、最冷酷的革命意志来重振那个红色的幽灵。这不是温情的改良，而是用铁与血对旧秩序的彻底清算"
 BRI_all_farming_fields: "确保所有牧场"
 BRI_all_farming_fields_desc: "粮食是生存的基础。我们要将周边肥沃的土地全部纳入掌控，确保每一颗谷物、每一头牲畜都优先服务于达能的生产线"
 BRI_control_rubber: "控制橡胶产地"
 BRI_control_rubber_desc: "工业的脉搏需要橡胶。无论是在遥远的殖民地还是通过残酷的贸易压榨，我们要确保公司（或国家）的仓库里堆满这种关键的弹性资源"
 BRI_command_oil: "掌握石油命脉"
 BRI_command_oil_desc: "没有石油，机器就会生锈，军队就会瘫痪。我们将通过外交胁迫或武力手段，在油井旁建立我们的哨塔。谁控制了石油，谁就控制了现代文明"
 BRI_europe_market: "扩大欧洲市场"
 BRI_europe_market_desc: "整个欧洲都应该是我们的货架。我们要打破关税壁垒，倾销我们的商品，让布列塔尼的资本在每一条欧罗巴的街道上横冲直撞"
 BRI_towards_great_brittany: "迈向大布列塔尼"
 BRI_towards_great_brittany_desc: "“布列塔尼，弹丸之地。”——过去人们总是这样嘲笑我们。但从今天起，我们要通过征服与并吞，将这个名字刻在更广阔的地图上。一个横跨大西洋沿岸的强权正在觉醒"
 BRI_celtic_union: "凯尔特联盟"
 BRI_celtic_union_desc: "从雷恩到都柏林，从卡迪夫到爱丁堡，散落在海岛与半岛上的凯尔特遗民应当重聚在同一面旗帜下。我们将建立一个血浓于水的同盟，共同对抗外来文明的蚕食"
 BRI_recelticlize: "再凯尔特化"
 BRI_recelticlize_desc: "我们要系统性地清除领土内一切外来文化的残余。从地名变更到生活习俗，布列塔尼将经历一场全方位的、彻底的文化净化，回归最原始的凯尔特本色"
 BRI_friendship_with_ireland: "与爱尔兰的友谊"
 BRI_friendship_with_ireland_desc: "爱尔兰是我们在大西洋上的天然盟友。相同的遭遇与相同的血缘让我们紧紧相依，我们将与都柏林共同分担风险，共享繁荣"
 BRI_nordics: "凯尔特—日耳曼兄弟情"
 BRI_nordics_desc: "在某些视角下，古老的凯尔特人与北方的日耳曼人有着某种高贵的共性。我们将通过这种血缘上的重新解读，与北欧诸国建立一种跨越民族的战士纽带"
 BRI_join_faction: "寻求庇护"
 BRI_join_faction_desc: "在野兽横行的丛林里，孤军奋战是愚蠢的。我们需要加入一个强大的体系，在巨人的阴影下积累我们的力量"
 BRI_economic_cooperation: "经济合作"
 BRI_economic_cooperation_desc: "贸易是通往繁荣的最快途径。我们将通过签署互惠协议，将布列塔尼的经济深度嵌入到区域秩序中，实现共赢——当然，我们要占大头"
 BRI_military_cooperation: "军事合作"
 BRI_military_cooperation_desc: "共同的敌人造就共同的战壕。我们将与盟友交换情报、共享技术并进行联合军演，确保布列塔尼的武力始终处于世界一流水准"
 BRI_new_french_imperialism: "新法兰西帝国主义"
 BRI_new_french_imperialism_desc: "既然我们代表了真正的法兰西，那么我们理应继承她的帝国。我们要以布列塔尼为跳板，重新拾起法兰西的权杖，在旧大陆和新大陆重建权威"
 BRI_death_to_germany: "消灭德佬"
 BRI_death_to_germany_desc: "德意志的野心是欧洲一切灾难的根源。为了布列塔尼的安全，也为了文明的延续，我们将不惜代价，彻底摧毁这个来自东方的威胁"
 BRI_dream_of_new_europe: "新欧洲之梦"
 BRI_dream_of_new_europe_desc: "一个由布列塔尼（或者说由我们的意志）主导的新欧洲秩序。没有弱者的喧嚣，只有强者的协调。在这个梦境中，大陆的平衡将由我们来定义"
 BRI_infitrate_frg: "渗透复兴政府"
 BRI_infitrate_frg_desc: "那些在巴黎（或流亡政府中）掌权的人不过是一群行尸走肉。我们要通过情报网与代理人，慢慢蚕食他们的决策层，直到那个政府名存实亡"
 BRI_crush_seperatists: "摧毁分离主义者"
 BRI_crush_seperatists_desc: "任何试图从新生的法兰西国家中分裂出去的行为都是不可饶恕的背叛。我们将动用最严厉的手段，让每一个反抗者明白统一的代价"
 BRI_return_france_eternal: "永恒法兰西的回归"
 BRI_return_france_eternal_desc: "流浪的日子结束了。布列塔尼将引领法兰西完成伟大的回归。我们要重返巴黎，重夺荣耀，让那面三色旗永远飘扬"
 BRI_restore_natural_border: "恢复自然边界"
 BRI_restore_natural_border_desc: "历史的错误必须纠正。从莱茵河到洛林艮，法兰西的自然边界不仅是地理的必然，更是我们要完成的政治宿命。我们将用步兵的足迹丈量这些边界"
 BRI_pacify_spain: "平定伊比利亚"
 BRI_pacify_spain_desc: "南方的混乱不符合我们的利益。无论是通过扶持傀儡还是直接干预，我们要让伊比利亚半岛成为我们安稳的后院和坚固的护城河"
 BRI_pacify_italy: "平定意大利"
 BRI_pacify_italy_desc: "亚平宁半岛不能再是一个不可控的变量。我们将把秩序以及我们的法则带到意大利，确保地中海的北岸始终处于我们的战略控制之下"
 BRI_take_france: "拿下法国"
 BRI_take_france_desc: "布列塔尼这一弹丸之地已经无法满足企业的商业帝国的扩张欲望了，我们必须为我们争取更大的空间，而那个正在废墟中挣扎的法兰西就是我们的最佳选择"
 BRI_own_faction: "傲然自立"
 BRI_own_faction_desc: "我们需要组建属于布列塔尼人，抑或是全凯尔特人自己的阵营，塑造自己的身份，我们会告诉世界我们必将崛起！"
 BRI_reclaim_france: "重夺法国"
 BRI_reclaim_france_desc: "我们才是法兰西，法兰西就是我们。我们要肃清法兰西土地上每一个拒绝加入她的怀抱的顽固分子，法兰西不容分裂！"
 BRI_albion_traitors: "不列颠问题"
 BRI_albion_traitors_desc: "法兰西内部战火已熄，现在我们要放眼海峡对岸固守英伦三岛的故交了"
 BRI_swiss_romandy: "夺取罗曼蒂"
 BRI_swiss_romandy_desc: "法裔瑞士历来就是法兰西自然边界的组成部分，我们需要夺回我们与生俱来的东西"
 BRI_corporate_alliance: "企业联盟"
 BRI_corporate_alliance: "组建广泛的企业联盟让我们的商业地盘得到进一步扩张，我们才能从中获益更多"
 BRI_Sb_trouble:0"政局不稳的国家"
 BRI_political_crisis_countdown:0"混乱之终"
 BRI_the_rule_of_BLBA: "企业联盟胜出"
