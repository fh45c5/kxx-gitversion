 BRI_factionism:"派系斗争"
 BRI_factionism_desc:"自从独立以来，奥利弗·莫德雷尔的布列塔尼国民党就掌握着政权。然而，莫德雷尔的政权同时面临着党内的反对与党外的密谋。\n§G阿贝·佩洛特大队§!是由右翼牧师阿贝·佩洛特创立的，由塞莱斯廷·赖因率领的准军事组织，他们在布列塔尼独立中起了举足轻重的作用，但其在批评莫德雷尔的同时庇护反对国民党的其他民族主义者。\n§Y企业理事会§!代表了本地的商业集团的利益，莫德雷尔为了得到资金乐于与其进行合作，但假如他们的利益受到了威胁，这些资本家就会毫不犹豫推翻他的政权，以一个企业天堂取而代之。\n§R布列塔尼自由阵线§!是由当地的社会主义者与民主派组成的联合抵抗组织，其以圣纳泽尔为基地对莫德雷尔政权发动着无休止的游击战，随时准备抓住政府个集团的矛盾推翻莫德雷尔，建设自由的布列塔尼。\n重建工作迫在眉睫，布列塔尼人需要团结起来，重新于废墟上筑起属于我们的一片天地。但布列塔尼政府内部的政治力量都在蠢蠢欲动，企业家们在政坛与民间用金钱收买人心，自由阵线正为布列塔尼民族的自由民主未来奔波着，布列塔尼民族党在面对着这两大力量的崛起的时局下不得不谨慎行事，控制其中的影响力，而刚从前线回到和平年代的士兵们，他们似乎也有话要说……。\n§G总之，控制好各方的影响力，别搞砸了§!\n\n§g布列塔尼国民党在政府中的权威： [?BRI.PNBpower] / 50 §!\n§6企业在布列塔尼政府中的影响力： [?BRI.BLBApower] / 50§!\n§3布列塔尼自由阵线在政府中的的影响力：[?BRI.FLBpower] / 50§!\n§O大队在政府中的影响力： [?BRI.ABpower] / 50§!\n"
 BRI_political_crisis_countdown_tt:0"§R我们需要在大会乱局中选取影响力最高的派系，不要让纷争陷入僵局，否则国家会万劫不复……§!"
