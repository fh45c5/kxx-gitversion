 brittany.1.t: "一颗子弹"
 brittany.1.d: "阴冷的雨幕中，狙击手架好步枪，对准了莫德雷尔的住所。“坏东西，看我怎么一枪打爆你这卑贱酒鬼的狗头”狙击手一遍怒骂着，一遍死死的盯着莫德雷尔住所的窗户\n\n当莫德雷尔的身影出现在窗前，一声刺耳的枪鸣撕碎了布列塔尼国民党看似稳固的幻象。“一颗子弹”精准地咬进了莫德雷尔的胸腔，鲜血瞬间浸透了他那件象征布列塔尼土地色彩的呢大衣。随着“莫德雷尔遇刺”的消息如同瘟疫般传遍大街小巷，原本潜伏在阴影中的野心与狂热彻底决堤。混乱中，权力核心发生了剧烈的震荡：那些渴望通过铁血手段实现独立的民族主义者他们迅速占领了印刷厂，并动员民兵进军政府；而街道上，由于领袖的失踪，工人群体被红色的激流卷走，社会主义的旗帜淹没了国民党尔的呼声，将这场民族运动推向了阶级斗争的边缘。与此同时，信奉法兰西传统右翼的“莫拉斯主义者”趁火打劫，他们闯入党部办公室，试图以维持秩序为名推翻莫德雷尔的统治，将这支分离势力强行并入大国沙文主义的版图。\n\n然而，在这场政治饕餮盛宴的中心，那个本该倒下的男人却展现出了近乎病态的顽强。他面色惨白、身形佝偻地出现在狂热的追随者面前。虽然子弹未能终结他的生命，但它所引发的这场混战，已将布列塔尼运动拖入了一个更加激进、且再也无法回头的深渊，而在这场斗争中，最后的赢家是……"
 brittany.1.a: "民族主义者控制了政府"
 brittany.1.b: "社会主义的旗帜淹没了布列塔尼"
 brittany.1.c: "莫德雷尔拖着病体指挥军队控制了党"
 brittany.1.e: "莫拉斯主义者推翻了莫德雷尔的统治"
 brittany.2.t: "新领袖"
 brittany.2.d: "随着莫德雷尔那摇摇欲坠的统治在内外交困中彻底瓦解，佩洛特大队的武装士兵们踏碎了政厅的宁静。这些身着黑衣、神色冷峻的激进分子用枪托敲开了办公室的大门，正式宣告了旧秩序的终结。然而，推翻莫德雷尔仅仅是个开始，废墟之上的布列塔尼正处于权力的真空地带，急需一位能够稳定军心并与各方势力周旋的“新领袖”。\n\n作为佩洛特大队的灵魂人物，莱内主张彻底的准军事化统治。他冷冷地擦拭着配枪，认为布列塔尼不需要政治家的妥协，只需要战士的服从。对他而言，只有将民族主义推向极端的武力化，才能在战争的余烬中重建家园。\n但让-马里·佩洛特——这位富有魅力的神父不仅是武装大队的精神支柱，更是传统天主教价值观的捍卫者与宗教的旗帜。他主张建立一个圣洁、传统的农村化社会，试图在现代工业文明的废墟上复兴凯尔特先民的虔诚。\n与此同时作为党内的稳健派，德拉波特代表了中产阶级和知识分子的诉求。他担忧激进武装会将民族运动带向毁灭，试图通过法律与行政手段，将动荡的局势引回和平建国的正轨。\n作为“白黑旗”的设计者，马沙尔更像是一位浪漫主义的思想家。他坚持凯尔特文化的纯洁性，反对盲目卷入欧陆战争的漩涡，主张建立一个基于世俗主义和异教美学的纯粹民族国家。\n\n窗外，佩洛特大队的士兵正在等待，布列塔尼在等待……这一次“灵魂的投机”是走向神权统治、军事专政、回归传统亦或是是的民族主义新生？每一个名字的背后，都预示着这个民族截然不同的悲剧或新生。"
 brittany.2.a: "莱内开启了属于他的治理"
 brittany.2.b: "宗教的信徒们拾起了大旗"
 brittany.2.c: "布列塔尼回应了世俗的呼唤"
 brittany.2.e: "布列塔尼民族将在浪漫主义中浴火重生"
 brittany.3.t: "新的道路"
 brittany.3.d: "布列塔尼的薄雾不再带有泥土的芬芳，取而代之的是工业废气中混杂的冷硬金属味。随着佩洛特大队的刺刀逐渐锈蚀，旧时代的民族主义理想在巨额资本的攻势下土崩瓦解。曾经的党部大楼如今成了企业理事会的议政厅，这片土地已沦为巨企的乐园。五个庞然大物在布列塔尼的版图上割据一方，它们不仅控制着经济命脉，更试图重塑这片土地的“灵魂”：\n\n拉加代尔传媒他们将“革命”封装成商品。通过激进的垂直管理和所谓的“工团主义”包装，试图通过技术革命来重塑社会契约。在他们的治下，每一名布列塔尼人都是这台宏大革命机器上的精密齿轮。让工人们重新找回公社联邦昔日的辉煌与荣光。\n达能披着慈父般的外衣，许诺建立一个“福利天国”。从摇篮到坟墓，达能掌控着公民的每一滴食水与营养。这是一种温柔的奴役——在充足的卡路里和全方位的医疗保障中，人民逐渐忘却昔日布列塔尼的苦难。\n在米其林，这里的规则只有一个：速度与效率。米其林的车轮永不停歇地在大地上滚动，通过修建庞大的自动化公路网和物流中枢，将布列塔尼彻底变成一个高压运转的财富加工厂。\n在道达尔眼中能源即是主权。在钻井平台和炼油厂的轰鸣中，道达尔通过掌控命脉能源来换取“繁荣”。它是实用主义的极致，用黑色的原油洗去历史的尘埃，将布列塔尼锻造成一个不可或缺的全球能源节点\n而LVMH傲立于资本的塔尖。他们追求的是一种近乎贵族制的“商业帝国”，将布列塔尼的身份符号彻底时尚化、奢华化。在这里，民族传统不再是信仰，而是被陈列在昂贵柜台里的文化消费品。\n理事会的大理石桌面上，五份计划书代表了五种截然不同的末日或新生。当官僚、高管与雇佣兵取代了祭司与战士，布列塔尼这个“新机器”开始发出了沉重的自检声。齿轮已经咬合，无论最终谁能在这场资本的角逐中胜出，那个古老的、纯粹的布列塔尼都将不复存在。"
 brittany.3.a: "同拉加代尔共同追随革命！"
 brittany.3.b: "同达能一起追随人民福利的天国"
 brittany.3.c: "同米其林的车轮奔向财富"
 brittany.3.e: "同道达尔集团的合作追随繁荣"
 brittany.3.f: "同LVMH一起共筑商业帝国"
 brittany.4.t: "布列塔尼，真正自由" 
 brittany.4.d: "布列塔尼终于告别了阴暗的独裁阴影，迎来了那个曾经被鲜血和资本淹没的“民主之春”。市政厅顶端的莫德雷尔巨幅肖像被愤怒的民众拉倒，尘埃落定后，布列塔尼人第一次在没有秘密警察和巨企保安的监视下走上街头。这不是一场由阴谋家策划的暗杀，而是一场民族党、蓝色联盟与地方主义联盟共同构筑的、波澜壮阔的共和狂欢。莫德雷尔那带有寡头色彩的陈腐秩序在公民意志的冲击下彻底瓦解，真正自由不再是传单上的口号，而是清晨街头最真实的呼吸。\n经历了莫德雷尔时期的激进与偏执后，重获新生的民族党带回了温和而坚定的民族自决理想。他们主张在尊重传统的基础上，通过法治手段确立布列塔尼的主权。对他们而言，自由意味着每一个布列塔尼人都能在国际舞台上挺起脊梁，不再作为谁的附庸，而是作为一个独立的文明实体走向复兴。\n这群自视为“自由子民”的激进共和派，誓言要在凯尔特的土地上复兴1789年大革命的伟大精神。他们要求彻底铲除寡头政治的残余，建立一个政教分离、人人平等的现代共和国。在蓝色联盟的蓝图里，布列塔尼将成为西欧民主的新灯塔，用公投和议会取代过去几十年的密室交易。\n而作为族群的纽带与实用主义与多元主义的旗手，地方主义联盟更关注这片土地上的每一个社区。他们主张通过联邦主义将布列塔尼内部错综复杂的族群和地区联系在一起。拒绝高度集权，将权力下放到每一个教区与市集，让布列塔尼成为一个基于自愿协作的贵族共和。\n三股组织力量之外，一个名字在老兵和码头工人口中被反复提及——马塞尔·加香。这位出生于布列塔尼帕普勒的国际共产主义元老，带着一种截然不同的“自由”愿景回到了家乡。对于那些厌倦了民族主义教条的底层民众来说，加香不仅是一个名字，更是一种将凯尔特认同与红色革命结合的可能性。他站在简陋的木箱上演讲，声音嘶哑却有力，声称真正的布列塔尼自由不应只是换一批统治者，而是彻底铲除阶级压迫。他的存在，让原本由自由派和民族派主导的政局变得微妙：他是会成为共和制的捍卫者，还是会将布列塔尼带向苏维埃化的新道路？\n\n旗帜在自由的风中猎猎作响，莫德雷尔的陈旧机器正在被拆解，取而代之的是一个充满变数却又生机勃勃的新时代。布列塔尼人站在历史的十字路口，虽然前路依旧崎岖，但至少这一次，方向盘握在他们自己手中。"
 brittany.4.a: "布列塔尼民族党将带领布列塔尼民族走向自由"
 brittany.4.b: "布列塔尼蓝色联盟将复兴法国大革命的伟大精神"
 brittany.4.c: "布列塔尼地方主义联盟将用联邦主义团结各个族群"
 brittany.4.e: "红旗在风中飘荡，伟人将再度掌舵！"
 brittany.5.t: "社会主义的颂歌"
 brittany.5.d: "不懈努力下，社会主义的旗帜终于落地。布列塔尼民族党于自由阵线中脱颖而出。我们需要从选出民族党未来的道路，带领我布列塔尼民族走向自由与真正的社会主义！"
 brittany.5.a: "温和的社会民主主义更适合我们"
 brittany.5.a: "工团主义的理想将继续发光发热"
 brittany.11.t: "自由为何物？" 
 brittany.11.d: "激进的自由主义应该是完全公平的，不应为某一个人而有所让步。作为一种底色的彻底公平。它主张法律应当像物理定律一样，对所有人一视同仁，不因任何人的眼泪或强权而弯曲。然而，这种冷峻的公正是一把双刃剑：在剔除了特权的同时，它也无视了人在起跑线上的天然差距。市场自由主义执着于这套规则的纯洁性，认为任何以‘公平’为名的再分配都是对自由的亵渎；而如果任由丛林法则肆虐，‘权利的平等’将沦为富人的游戏，穷人的枷锁。真正的自由主义理想，或许并非在‘无限制’与‘强干预’之间选其一，而是在于：如何建立一种制度，既能保持规则的普遍性，又能通过公共服务的基石，确保每个人都不会因为贫穷或不幸，而在这场名为‘自由’的比赛中被剥夺入场券。而社会主义的自由更加承载了法国大革命的激进底色的理想，则是要建立一个公平、公正、包容、自由的社会，让每个人都能享有平等的权利，并在此基础上复兴民族……。"
 brittany.11.a: "自由的理想需要同社会的进步同频共振"
 brittany.11.b: "自由的理想不能因社会现状而停止"
 brittany.11.c: "自由的理想离不开社会主义！"
 brittany.6.t: "布列塔尼主义的未来" 
 brittany.6.d: "如果说威权主义民族国家是一座冰冷的纪念碑，要求个体在其阴影下保持肃静；那么社会化的共和国便是一座充满烟火气的社区中心，其存在的意义在于服务而非统治。民众之所以向往后者，并非因为某种激进的口号，而是因为共和国将‘自由’从抽象的法律条文变成了触手可及的社会福利。这种逻辑下，布列塔尼主义完成了一次华丽的蜕变。它切断了与那些充满排他性、甚至带有仇恨色彩的狭隘民族主义的脐带。它不再试图在地图上画出深重的鸿沟，而是化作一种深沉的、建设性的理想愿望：它致力于在本土的土壤上，通过社会化的改良与资源的公平分配，让‘造福民众’不再是政客的许诺，而是每个人实实在在的生活体验。它不是在保卫一种古老的血缘，而是在保卫一种现代的、公正的生活方式。”民族主义不仅仅是政治主张，更是一种生存意志。\n\n但一个单纯的“社会化共和国”可能会为了效率而推行统一的语言和价值观，从而导致布列塔尼独特语言和历史的消亡。民族主义的价值是保护布列塔尼灵魂的硬壳。布列塔尼主义通过强调民族特性，赋予了民众一种拒绝被中央政权“格式化”的道德勇气。" 
 brittany.6.a: "社会化是布列塔尼的大势所趋"
 brittany.6.b: "我们的生存离不开布列塔尼民族主义的保护"
 brittany.7.t: "基督教社会主义？" 
 brittany.7.d: "基督教社会主义本质上对于布列塔尼民族来说，是地区边缘化群体通过宗教正义观对抗中央集权同化的过程。19世纪末，面对法兰西第三共和国激进的世俗化政策及对少数民族语言的压制，布列塔尼的知识分子与神职人员将“捍卫信仰”与“挽救母语”合流。以“Bleun-Brug”为代表的组织通过推广布列塔尼语弥撒和传统文化，构建了一种基于天主教价值的民族认同。这种关联在20世纪 mid-term 发生了深刻转型：受人格主义哲学影响，新一代活动家将基督教的平等观与左翼社会主义结合，抗议巴黎政府对该地区的经济剥削。他们主张权力下放，认为真正的民族复兴不仅是文化复归，更是基层工农阶级的社会解放。通过将圣经中的公义诉求转化为地区自治的政治动能，基督教社会主义为布列塔尼运动注入了超越单纯族群主义的道德高度。这种独特的结合，使布列塔尼在现代法国政治版图中呈现出一种既尊重宗教传统、又在生态与社会福利议题上极具进步色彩的复合特征，成功将古老的凯尔特纽带转化为了现代社区自治的实验。" 
 brittany.7.a: "社会主义以温和一面示人的尝试" 
 brittany.7.b: "我们不需要这种不可理喻的玩意" 
 brittany.8.t: "工农党政变！" 
 brittany.8.d: "法兰西公社联邦崩溃之后。政权的崩溃与全球大萧条粉碎了布列塔尼的农业命脉，巴黎政府的漠视让这片凯尔特土地沦为赤贫的荒野。在真实的史教之外，法兰西工农党（POFP）的怪物在石楠花丛中畸形诞生。他们不是传统的保皇党，也不是莫拉斯那样的右翼文人，而是一群手握马克思著作的“红色神父”。\n\n1934年深秋，彼时的法兰西共产党在加香同志的引领下与布列塔尼重建了公社联邦的红旗，通过其严密的支部系统将布列塔尼工人纳入工团主义的指挥棒下。然而，POFP的领袖们发动了一场针对法共支部的“净化”。“工团主义的辩证法没有灵魂，巴黎的公社没有土地，唯有布列塔尼的基督工农方能审判资本。”在这场意识形态的绞杀中，POFP展现了极端的组织力。他们利用堂区网络瞬间瘫痪了法共的基层工会，将法共派来的特派员逐出集市。POFP的宣传员在教堂尖顶挂起红色的“黑白貂旗”，高喊着“土地归农夫，方言归子孙”的口号，将法共那一套冰冷的阶级理论彻底“本土化”为一种近乎宗教狂热的圣战。法共在布列塔尼的组织架构在短短数月内崩塌，其领导者加香也被其控制。成千上万原本倾向共产主义的工农，转而投向了这种混合着弥赛亚降临感的社会主义。这场政变不仅是权力的更迭，更是灵魂的易主。它将布列塔尼从工团主义的阶级叙事中强行剥离，建立起一个政教合一、带有强烈民族排他色彩的“法兰西民族霸权”。这股力量成为了巴黎最恐惧的噩梦：一个既不听命于教皇，也不服从于已陨落的公社联邦，却拥有殉道者勇气的红色法兰西之续作。" 
 brittany.8.a: "怪物已经出笼……"
 brittany.9.t: "友人……"
 brittany.9.d: "在20世纪现代主义建筑的宏伟史诗中，约瑟夫·萨维纳（Joseph Savina）不仅是一位技艺精湛的布列塔尼工匠，更是勒·柯布西耶晚年精神意志最为忠诚的继承者与思想衣钵的传灯人。柯布西耶那些充满原始力量与几何神谕的草图，在萨维纳那双布列塔尼之手的雕琢下，从平面跃迁为具有永恒生命力的三维雕塑，这种从触觉出发的艺术实践，完美承接了柯布西耶后期向粗犷、诚实、具有大地感的现代主义转型的核心意志。萨维纳所承袭的，并非简单的形式模仿，而是一种将“模度”比例与人类尺度融入土地灵魂的造物逻辑。他带着这位现代主义大师的理想火种，回到了故乡布列塔尼那片荒凉而坚硬的海岸，并在此致力于建立一个名为“布列塔尼构建区”的思想实验场。在这一宏大构想中，萨维纳将柯布西耶的规划愿景与布列塔尼的本土底色深度缝合，更在布列塔尼变幻莫测的阴云下，以柯布西耶式的光影几何重塑室内空间，使之成为捕捉神圣光芒的容器。这场“构建”并非是对传统的背叛，而是一场跨越维度的文化复兴，萨维纳证明了最现代的先锋精神往往扎根于最古老的原始意象之中。他通过对社会住宅、社区尺度以及与自然环境和谐共生的一系列实践在布列塔尼的悬崖与荒原间发扬光大，让现代主义在这片古老的凯尔特土地上不再是冰冷的外来者，而是一种具有泥土芬芳和民族脊梁的本土生命力。萨维纳用他的一生，在布列塔尼刻下了柯布西耶的名字，更要书写了一段关于衣钵传承、理想拓荒与地域重构的壮丽篇章。"
 brittany.9.a: "……老朋友，我们再一次大干一场吧"
 brittany.10.t: "工农党的邀请？"
 brittany.10.d: "空气混合着霉味与廉价烟草的刺鼻气息，桌上唯一一盏摇曳的马灯，将对坐两人的影子拉扯得支离破碎。这并非一场老友重逢，而是一段被刻意抹去的回忆：法兰西工农党正试图与法共达成一份协议，将工农党的力量与公社联邦的精神结合起来。谈判桌的一侧是马塞尔加香；对面则是POPF的高级干部皮埃尔。皮埃尔率先打破沉默，声称POPF承诺利用其在布列塔尼政府机构的合法外壳，为法兰西共产党在布列塔尼立足提供保障。看起来这是一份百利而无一害的选择。"
 brittany.10.a: "我们还是要坚持我们自己的立场"
 brittany.10.b: "这是天大的好事" 
 brittany.13.t: "忧郁的灵魂……"
 brittany.13.d: "在布列塔尼那片被大西洋季风反复揉碎又重塑的荒原上，阿方斯·德·夏多布里昂，正经历着一场灵魂与土地的血缘重组。那时的他是一个沉默、忧郁、甚至带着几分先祖弗朗索瓦-勒内式孤傲的智者。他踏入布里埃尔（La Brière）的沼泽地时，怀揣的不仅是写作的野心，更有一种近乎宗教式的寻根冲动。那里的水面覆盖着厚重的浮萍，黑色的泥炭像历史的碎屑一样淤积在岁月深处，这种阴郁而坚韧的气息，与他血液里流淌的夏多布里昂家族的古老基因瞬间产生了共鸣。\n\n起初，这位带着巴黎气息却满身泥泞的老者，在布列塔尼那些深藏于密林与花岗岩后的庄园主眼中，不过又是一个企图在乡间寻找“异域情调”的过客。然而，当他寄居在圣纳泽尔附近的古老宅邸，开始以一种近乎苦修的姿态观察当地农民与没落贵族的生活时，当地的名门望族——那些固守着天主教传统、对法兰西公社的工团革命与法兰西复兴政府的极端民族主义嗤之以鼻的伯爵与侯爵们，开始在他身上嗅到了同类的气息。在那些由沉重橡木装饰、壁炉火光摇曳的深夜沙龙里，阿尔方斯不再是那个在文坛边缘徘徊的家道中落者。他用一种极其精准且带有古典美感的法语，向当地权势显赫的庄园主们，描述着土地的尊严与传统的崩塌。他那种对“等级秩序”的天然崇拜和对“土地精神”的狂热捍卫，精准地击中了这些旧时代守护者们脆弱而自负的内心。\n\n这些望族开始意识到，这个长者笔下的文字不是浮华的修辞，而是为他们这个阶级撰写的最后挽歌。于是，布列塔尼的社交圈向他敞开了最隐秘的木门。从雷恩到南特，从古老的修道院遗址到海边的堡垒，名门望族们不仅为他提供了源源不断的创作素材，更动用他们深厚的社会关系，他们在他身上看到了家族徽章重现光芒的幻象，名声随之如海啸般涌来。在那一刻，阿方斯·德·夏多布里安仿佛真的继承了先祖的衣钵，成为了布列塔尼土地上最耀眼的文化符号。\n\n于布列塔尼，他是故乡的英雄：于法兰西，他是法兰西贵族的血脉，这份布列塔尼与法兰西的双重身份让布列塔尼的土地意识到。也许此时此刻，正需要这样的人斡旋于法兰西与布列塔尼之间方能让这两个民族得到灵魂的和解。"
 brittany.13.a: "真是一位伟大的天才"
 brittany.13.b: "他将让两个民族得到真正的拯救！"
 brittany.12.t: "最华丽的加冕……"
 brittany.12.d: "法兰西公社联邦的躯壳在复兴政府装甲师的履带下碎成齑粉。当公社政府仓皇抵抗，在广播中颤抖着请求停战时，在法兰西西北角的布列塔尼半岛，一场筹谋已久的“血缘复辟”正在迷雾笼罩的花岗岩庄园中悄然启动。\n\n这并非巴黎政客们的权力游戏，而是布列塔尼古老灵魂的一次绝望反扑。那一年的七月，在雷恩（Rennes）郊外一座名为“黑色圣母”的隐秘堡垒里，聚集了布列塔尼最具权势的十三个家族首领。罗昂家族的末裔、布里萨克侯爵、以及掌控着大西洋海岸贸易的拉图尔家族，他们避开了维希政府的耳目，也绕过了法国内战的风暴，将目光投向了那个坐在炉火阴影里的男人——阿方斯·德·夏多布里安。\n\n“法兰西已经没有了心脏，但布列塔尼还有脊梁。”罗昂公爵将一柄绣有金色百合的古剑沉重地放在长桌中央。在这些贵族眼中，波旁王朝已经随风而逝，奥尔良派流于平庸，而波拿巴则是暴发户的余孽。唯有夏多布里安——这个姓氏本身就代表了法兰西最古老的骄傲。阿方斯此时不仅是横扫文坛的巨匠，更是纳粹高层眼中“新欧洲秩序”的法理代言人。既然旧的法兰西已经死亡，那么必须从最古老的泥土中提取新的皇室。阿方斯不仅仅是一个作家的后裔，在他们的叙事里，他是“神圣德意志帝国”与“凯尔特古魂”之间的桥梁。他们坚信，唯有阿方斯那带有魔力且推崇等级秩序的笔触，能抚平占领者的暴戾，并为布列塔尼乃至全法兰西换取一个“准独立”的王座。\n\n阿方斯站起身，他的眼神中跳动着一种近乎病态的狂喜。他在其主编的《杰尔布》报纸上宣扬的“欧洲大融合”，在这一刻具象化为了一个头衔——“布列塔尼守护者与法兰西正统继承人”。在这些名门望族的簇拥下，法国皇室正统的中断与共和制的彻底破产。夏多布里安家族将作为布列塔尼独立意志的象征，受封为新法兰西的“护国主”或“影子国王”。为了配合这一神圣感。那一夜，布列塔尼的庄园里响起了久违的“国王万岁”的低吟。名门望族们纷纷献出家传的珠宝与黄金，资助阿方斯筹建他的“御林军”。在那个疯狂的1940年秋天，阿方斯仿佛真的行走在通往卢浮宫的红地毯上。宣告自己为“法兰西土地意志的最后收割者”。\n\n然而，这终究是一场建立在沙滩上的幻梦。尽管布列塔尼的贵族们愿意为他筑起花岗岩的王座，尽管他的名声在德军占领区达到了诡异的巅峰，但他所依附的权势——那股来自北方的钢铁洪流——从未想过要给法兰西一个真正的国王。\n\n当历史的巨轮继续前进，阿方斯·德·夏多布里安，这个曾被布列塔尼名门寄予厚望、试图重塑法兰西皇权图腾的人，终将在承诺中复兴他的理想，给布列塔尼的荒原留下一个关于“神秘帝王”的、充满希望的光明未来。"
 brittany.12.a: "为三个民族的王高呼三声万岁！"
 brittany.14.t: "什么才是革命？"
 brittany.14.d: "诡云谲的政治暗流中，马赛尔·加香那套温和主义早已沦为旧公社时代的落伍幻梦。这位曾在风暴中掌舵的老人，如今却试图用十九世纪的议会残韵去修补这台亟需铁血驱动的革命机器，但在新一代布朗基主义者和激进派眼中，他的迟疑与妥协无异于对无产阶级事业的慢性背叛。\n\n我们要彻底告别那段充满温情幻觉的守成岁月，唯有在勒内·尼科德同志的钢铁意志引领下，法兰西公社才能跨越那道名为“温和”的深渊，向着极限革命全速冲刺！这不再仅仅是权力的交接，而是一场旨在粉碎一切反动残余、重塑公社灵魂的暴力洗礼。尼科德同志所昭示的未来，没有渐进改良的余地，只有对公有制绝对纯洁性的捍卫，以及将法兰西锻造成一座全球革命熔炉的雄心。\n\n让加香的幻梦随同旧时代的灰烬一去不返吧！我们将以全体动员的姿态，在红旗的指引下，向着这颗星球上最后的反动堡垒发起决战。极限革命万岁，尼科德同志万岁！"
 brittany.14.a: "vive la révolution!"
 BRI_FRA.1.t: "家犬早已野化……"
 BRI_FRA.1.d: "布列塔尼已经被野化，我军于其作战时伤亡惨重却依然久攻不下，我们当下更紧急的目的是面对复兴政府的进攻，我们是否要与他们达成妥协呢？"
 BRI_FRA.1.a: "我们不能再做无谓的牺牲了……"
 BRI_FRA.1.b: "我们必须坚持斗争，直到野狗被打败为止！"
 BRI_FRA.2.t: "和平……"
 BRI_FRA.2.d: "布列塔尼已经彻底的撕开了法兰西公社联邦这座牢笼，我军于其作战时重挫敌军，并使其伤亡惨重却依然久攻不下，我们战士用他们的鲜血生命换来了自由，长达几个世纪的长夜终于过去了……"
 BRI_FRA.2.a: "万岁，布列塔尼！"
 BRI_FRA.3.t: "与布列塔尼石油商的协定？"
 BRI_FRA.3.d: "与道达尔石油商的协定是一项重要的协议，它将使布列塔尼石油公司获得巨额利润，并将其作为战略资源投入到战争中。但我们也会从中获得客观的利润与增益。"
 BRI_FRA.3.a: "我们乐意接受"
 BRI_FRA.3.b: "这看上去更像敲诈阿……"
 BRI_FRA.4.t: "法国佬同意了我们的合作请求"
 BRI_FRA.4.d: "法国佬同意了与我们的协定，我们将会从其中获益良多……"
 BRI_FRA.4.a: "哦耶"
 BRI_FRA.5.t: "法国佬拒绝了我们的合作请求"
 BRI_FRA.5.d: "法国佬拒绝了与我们的协定，我们将不得不另辟蹊径了……"
 BRI_FRA.5.a: " 竟 然 不 许 ！"
 BRI_FRA.6.t: "野犬磨牙"
 BRI_FRA.6.d: "边境的异动日益频繁，布列塔尼的武装力量在复兴政府边界蠢蠢欲动，前线经验老道的军官们早已嗅到这份杀机，随着电报发回巴黎。巴黎方面的命令是……"
 BRI_FRA.6.a: "巨象安惧蚊蝇？"
 BRI_FRA.6.b: "他寇边我也寇边！"
 BRI_FRA.7.t: "野犬磨牙"
 BRI_FRA.7.d: "异动日益频繁，有消息称布列塔尼的武装力量在边界蠢蠢欲动，前线经验老道的军官们早已嗅到这份杀机，随着电报发回巴黎。巴黎方面的命令是……"
 BRI_FRA.7.a: "巨象安惧蚊蝇？"
 BRI_FRA.7.b: "他寇边我也寇边！"
 BRI_FRA.8.t: "野犬挥爪"
 BRI_FRA.8.d: "有消息称布列塔尼的武装力量在奥克西塔尼亚边界蠢蠢欲动，前线经验老道的军官们早已嗅到这份杀机，随即做好了战斗准备"
 BRI_FRA.8.a: "准备赴战"
 BRI_FRA.9.t: "野犬挥爪"
 BRI_FRA.9.d: "有消息称布列塔尼的武装力量在洛林边界蠢蠢欲动，前线经验老道的军官们早已嗅到这份杀机，随即做好了战斗准备"
 BRI_FRA.9.a: "准备赴战"
 BRI_FRA.10.t: "野犬挥爪"
 BRI_FRA.10.d: "有消息称布列塔尼的武装力量在诺曼底边界蠢蠢欲动，前线经验老道的军官们早已嗅到这份杀机，随即做好了战斗准备"
 BRI_FRA.10.a: "准备赴战"
 BRI_FRA.11.t: "一串来自海峡对面的电信号"
 BRI_FRA.11.d: "有消息称布列塔尼的武装力量在海峡边界厉兵秣马，准备攻一场巨大的攻势，如今他们需要我们的援助，我们该怎么办？"
 BRI_FRA.11.a: "我们必须与其并肩作战"
 BRI_FRA.11.b: "就他们？"
 BRI_FRA.12.t: "再为兄弟"
 BRI_FRA.12.d: "爱尔兰方面已经与我们结为同盟，我们可以共同携手与我们的宿敌做最后的斗争！"
 BRI_FRA.12.a: "我们同心协力"
 BRI_FRA.12.b: "我们一定会胜利！"
 BRI_FRA.13.t: "石沉大海……"
 BRI_FRA.13.d: "爱尔兰方面毫无回应，我们现在只能独自扛起大旗了……"
 BRI_FRA.13.a: "我们不会因为小挫折而倒下！"
 BRI_for.1.t: "布列塔尼请求加入我方"
 BRI_for.1.d: "布列塔尼于近日提出加入我方的请求，这无疑是我们在西欧的一座有力的桥头堡"
 BRI_for.1.a: "好事"
 BRI_for.1.b: "布列什么？塔尼什么？没听说过，我们请你了吗？"
 BRI_crisis.1.t: "不和的内部"
 BRI_crisis.1.d: "战火虽熄，但布列塔尼内部仍然充满不和，这令人担忧。所有人都在这片小小的土地上摩拳擦掌，暗中盘算。随着棋手们的就位，棋盘在偌大的布列塔尼徐徐展开……"
 BRI_crisis.1.a: "这场“战争”将如何收场？"
 BRI_crisis.2.t: "布列塔尼的未来"
 BRI_crisis.2.d: "随着国家重建的结束，在重建期的明争暗斗中，民族党依旧挺立，击败了所有的敌对势力，牢牢握紧了政权"
 BRI_crisis.2.a: "屹立不倒！"
 BRI_crisis.3.t: "布列塔尼的未来"
 BRI_crisis.3.d: "随着国家重建的结束，在重建期的明争暗斗中，民族党对政权的掌握度逐步减弱，而自由阵线的掌酷愈发显现，布列塔尼的领土挺立，但民族党已在自由阵线的攻势之下彻底瓦解……"
 BRI_crisis.3.a: "让压迫者滚蛋吧！"
 BRI_crisis.4.t: "布列塔尼的未来"
 BRI_crisis.4.d: "由于布列塔尼国民党内部的千万缕数不清的丝线将企业与政府勾连在了一切，国民党开始愈发的对企业让步。而今天企业联盟终于彻底蹬开了曾经的金主，将企业联合端到了民众们的眼前……"
 BRI_crisis.4.a: "他们自食其果……"
 BRI_crisis.5.t: "布列塔尼的未来"
 BRI_crisis.5.d: "大队藏于秩序之中狩猎，猎物们在阳光下争的筋疲力尽之时，在这此消彼长间，佩洛特大队对奄奄一息的国民党发动了最后一击，彻底将其赶下台来。终结了他的统治"
 BRI_crisis.5.a: "我们的命运将由冰冷的枪口来决定了……"
 BRI_crisis.7.t: "内部纷争没有多数"
 BRI_crisis.7.d: "内部各派系之间的斗争犹如一场漫长而胶着的棋局，各方势力你来我往、互不相让，却始终未能有一方凭借自身的影响力，彼此之间相互制衡，使得布列塔尼的政治格局陷入了一种微妙且脆弱的平衡状态，仿佛一座搭建在悬崖边的积木塔，看似稳固，实则轻轻一触便可能轰然倒塌。\n\n此时此刻，布列塔尼的政治局势就像一片平静湖面下暗流涌动的漩涡，看似波澜不惊，实则蕴含着巨大的变数。对于那些心怀野心、渴望在这片土地上施展政治抱负、谋取更大利益的外部势力或者有识之士而言，这无疑是一个千载难逢的绝佳时机。倘若谁能够敏锐地洞察到这一局势背后的潜在机会，果断地在这个关键节点上果断插手，都有可能轻易地打破布列塔尼目前这种脆弱不堪的政治平衡。一旦平衡被打破，整个布列塔尼的政治版图将面临重新洗牌，新的权力格局也将应运而生，而那个率先插手并成功改变局势的人，无疑将成为这场政治博弈中最大的赢家，掌控布列塔尼未来的政治走向。"
 BRI_crisis.7.a: "就这样，他往积木上轻轻一推……"

 