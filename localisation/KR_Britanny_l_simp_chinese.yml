 BRI_Raymond_Delaporte_gain_power: "反莫德雷尔派国民党掌握大队"
 BRI_Britanny_Morvan_Marchal_gain_power: "自治联想与联邦之梦" 
 BRI_Revitalizing_the_Economy_of_Brittany: "重振布列塔尼经济"
 BRI_Revitalizing_the_Economy_of_Brittany_desc: "在独立战争中布列塔尼以出色的表现赢得了自己的独立，但崩毁的国民经济也是独立之后不可忽视的客观事实，重振布列塔尼经济对新国家来说刻不容缓"
 BRI_Expanding_the_Tourist_Resort_of_Saint_Malo_Saint_Nazaire: "拓展圣马洛—圣纳泽尔旅游胜地"
 BRI_Expanding_the_Tourist_Resort_of_Saint_Malo_Saint_Nazaire_desc: "从圣马洛的古老城墙到圣纳泽尔的海滨大道，布列塔尼的海岸线是无价的瑰宝。通过兴建豪华酒店与疗养院，我们将吸引全欧洲的富豪来此挥金如土，将海风转化为滚滚的外汇"
 
 BRI_Investing_in_the_South_Nantes_Frying_Plant: "投资南特油炸加工厂"
 BRI_Investing_in_the_South_Nantes_Frying_Plant_desc: "南特不仅是我们的工业重镇，更是食品加工业的核心。通过对现代化深加工工厂的投资，我们将把布列塔尼丰富的海产与农产品转化为保质期长、附加值高的工业食品，远销海外"

 BRI_Developing_the_Primary_Agricultural_Region: "发展第一农业区"
 BRI_Developing_the_Primary_Agricultural_Region_desc: "肥沃的土壤是上天赐予布列塔尼的礼物。我们将推行农业机械化，建立科学的轮作体系，确保这片“第一农业区”能够为我们日益增长的城市人口提供取之不尽的粮食"
 
 BRI_Exploiting_the_Wealth_of_the_Armorican_Massif: "开采阿摩里卡丘陵之财富"
 BRI_Exploiting_the_Wealth_of_the_Armorican_Massif_desc: "在阿摩里卡丘陵的古老岩层之下，埋藏着支撑工业复兴所需的矿产。我们要架起矿井，凿开岩石，将深埋地下的铁、煤与花岗岩化作国家建设的基石"

 BRI_Launching_the_Loire_Valley_Shipyard: "发动卢瓦尔河谷造船厂"
 BRI_Launching_the_Loire_Valley_Shipyard_desc: "卢瓦尔河口是巨舰诞生的摇篮。我们要重振这里的造船工业，无论是巨大的商船还是狰狞的战舰，都将在这里铺设龙骨。当这些钢铁巨兽滑入海洋，全世界都将看到布列塔尼的力量"
 
 BRI_The_Lethal_Weapons_of_Arsetex_Company: "阿尔塞泰克斯公司的致命武器"
 BRI_The_Lethal_Weapons_of_Arsetex_Company_desc: "阿尔塞泰克斯不仅仅是一家公司，它是布列塔尼国防的盾牌。通过研发更高口径、更远射程、更具杀伤力的武器系统，我们要确保任何觊觎我们土地的敌人都会在这些“致命产品”面前望而却步"

 BRI_Subsidizing_the_Railway_Department_of_Finistere_Province: "补贴菲尼斯泰尔省铁路部"
 BRI_Subsidizing_the_Railway_Department_of_Finistere_Province_desc: "菲尼斯泰尔意为“大地之角”，但它绝不应成为被遗忘的角落。通过政府补贴，我们将把铁路网铺设到最西端的港口，确保物资与军队能在几小时内贯穿整个半岛"
 BRI_Industries_on_Par_with_France: "产业比肩法兰西"
 BRI_Industries_on_Par_with_France_desc: "曾经，巴黎嘲笑我们是落后的农民；曾经，我们的工厂只是法兰西工业的附庸。但现在，这一切都结束了。通过数年的励精图治，布列塔尼的工业产值与技术水平已足以平视那个往日的宗主国。我们不再是谁的后花园，我们是独立而强大的工业心脏"
 BRI_Funding_Rennes_University: "资助雷恩大学"
 BRI_Funding_Rennes_University_desc: "未来的战争与竞争不在战场，而在实验室。我们要为雷恩大学提供充足的经费，聘请顶尖的教授，培养出属于布列塔尼自己的工程师、科学家和管理人才。知识就是第一生产力"
