 BRI_PNB_holds:"国民党屹立不倒"
 BRI_PNB_holds_desc:"在布列塔尼国民大会的政治斗争中，布列塔尼国民党在政治斗争中巩固了自己的地位，这个带领布列塔尼独立的党将再一次为布列塔尼指引前路"
