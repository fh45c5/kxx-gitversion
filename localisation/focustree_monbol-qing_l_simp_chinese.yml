l_simp_chinese:
 QIE_the_red_sun_over_the_dragon:0 "红色巨龙崛起"
 QIE_the_red_sun_over_the_dragon_desc:0 "新帝国宪政会与中国青年党为了对抗宗社党，与工团党和国民党达成了协议。东方红色巨龙将会崛起！"
 QIE_the_red_court:0 "新内阁"
 QIE_the_red_court_desc:0 "纯亲王废除顾问军机而采用内阁的改革是朝着正确方向迈出的一步。尽管因为其许多成员是因与皇室有血缘关系而被选拔的，许多人认为这不过是对旧军机处的重新命名，但它仍然削弱了阿谀奉承者和唯唯诺诺者在帝国政治中的影响力。宣统皇帝的新内阁将由全心全意为民的政治家组成，以真正兑现改革的承诺。新政府的第一个行动将是免除前合作政府所欠的所有外债。"
 QIE_the_league_of_yellow_dragons:0 "黄龙联盟"
 QIE_the_league_of_yellow_dragons_desc:0 "有很多愤世嫉俗的学生对中国的现状感到心烦意乱。由于我们的反帝立场很明显，我们将组建一个新的学生俱乐部，并将他们武装起来，成为中国革命的先锋队。"
 QIE_follow_the_mladrossi_idea:0 "青年俄罗斯联盟的启示"
 QIE_follow_the_mladrossi_idea_desc:0 "亚历山大·卡津别克的青年俄罗斯联盟是一个有趣的运动，主张社会主义与君主制的有机结合。我们应该学习这位伟大理论家的理论，并将其进行中国化改编，为我们的统治提供意识形态基础。"
 QIE_integration_with_the_csp:0 "维持联盟"
 QIE_integration_with_the_csp_desc:0 "建立联盟是因为我们共同致力于中国的现代化，以便她能够再次站起来，打破束缚她的外国枷锁。我们将继续这种合作，让我们的帝国引领中国走向未来。"
 QIE_new_five_year_plans:0 "新的五年计划"
 QIE_new_five_year_plans_desc:0 "如果中国要摆脱外国剥削，就需要工业化。如果我们没有一支拥有工业武器的军队，就没有办法收回让步。这种经济现代化不能交给自由市场，因为外国资本家和买办会为了自身利益而让中国陷入贫困而被剥削。相反，我们的政府需要采取一些行动进行干预，例如开展经济投资和提高进口商品关税，以使我们国家实现工业化。"
 QIE_attacking_revisionism:0 "驱逐自由派"
 QIE_attacking_revisionism_desc:0 "我们不是激进的空想家。我们斗争的核心是为生活在田野里的真正农民的尊严而斗争。在与青年党合作的这段时间里，很明显他们只相信模糊的现代化理念，而不关心生活在帝国之下的人民。因此，是时候与他们决裂并寻求其他盟友，为我们的农民创造一个田园诗般的天堂。"
 QIE_the_royal_education:0 "教育现代化和扩张"
 QIE_the_royal_education_desc:0 "中国的教育历史悠久。许多世纪以来，通过科举成为一名官僚是一个人所能取得的最伟大的成功之一。然而，这些考试未能适应测试外国人带来的新知识，从而导致中国陷入目前的状况。尽管我们不会让他们回来，随着我们在帝国各地扩大学校数量并实现课程现代化，他们的精英管理和知识培养精神将继续存在。"
 QIE_the_devils_of_warlords:0 "军阀之恶"
 QIE_the_devils_of_warlords_desc:0 "随着辛亥革命的成功和清朝的垮台，一个新的共和国诞生了。袁世凯死后，唯一维持其统一的力量——军事力量——分裂为对立的军阀，这个共和国崩溃了。这些军阀为了自己的权力和财富的欲望，毁掉了那么多人的生活。不再！我们的政府将开始团结中国并将人民从暴政中解放出来的斗争。我们宣统皇帝的傀儡也将成为团结的象征，引导中国前进。"
 QIE_beiyang_railway:0 "北洋铁路"
 QIE_beiyang_railway_desc:0 "工业化最重要的部分之一是基础设施的发展，因为它对经济具有加成效应。我们将在现代化建设中全面建设公共基础设施。"
 QIE_the_red_mandate:0 "红色训令"
 QIE_the_red_mandate_desc:0 "有人可能会说这是一个过时的词汇，但是天命如果不是政府合法化意志的通俗表达，那到底又是什么？安排我们的文人发表一些文章，进行只有溥仪才是中国唯一且真正合法的皇帝的宣传。"
 QIE_the_yellow_purge:0 "肃清官僚机构"
 QIE_the_yellow_purge_desc:0 "随着我们政变的成功，我们突然掌权了。虽然我们暂时巩固了统治，但许多政府官员还是直系统治时期的人。当我们对付明显的敌人时，这些自私自利的人却低着头躲起来。如果我们不找出来、不加以处理，他们就会永远成为国家的污点，利用民生谋取利益。而最坏的情况下，他们可能只是刺在我们背后的毒匕首。"
 QIE_beyond_the_han:0 "不止汉族"
 QIE_beyond_the_han_desc:0 "中国不仅仅是汉族的土地，我们还必须囊括与团结几个世纪以来与我们同在的其他民族。"
 QIE_the_will_of_the_people:0 "人民的意志"
 QIE_the_will_of_the_people_desc:0 "我们的统治对很多人来说都是第一次经历一个关心公民的政府。帝国群众厌倦了直系军阀的专制统治，支持我们统一中国的斗争。"
 QIE_the_yellow_guards:0 "蓝卫军"
 QIE_the_yellow_guards_desc:0 "尽管我们已经成功清除了我们遭受的腐败水蛭，但我们仍然必须保持警惕。因为当我们统一中国并在新控制的领土上建立我们的官僚机构时，任何数量的肿瘤都可能在我们的政府中生长。为了防止这种事情发生，我们将成立一个新的组织负责消灭腐败。"
 QIE_looking_for_allies:0 "新生的旧帝国"
 QIE_looking_for_allies_desc:0 "我们不仅仅是旧清复活了。宣统皇帝不会再次退位。不，我们是一个从历史中汲取教训的新清。宣统皇帝为人民服务，人民为他服务。不会再出现第二个慈禧太后，她的自私野心导致了第一个清朝的灭亡。"
 QIE_stoping_rightwing_imperialism:0 "制止西方帝国主义"
 QIE_stoping_rightwing_imperialism_desc:0 "中国第一次遭受外国帝国主义的统治是在清朝时期。尽管清朝像光绪皇帝进行的戊戌变法那样反抗这种统治，但他们的实力不够，最终还是垮台了。这直接导致了中国军阀匪寇统治的灾难性局面。现在，我们以宣统皇帝为首的政府必须继承这一抵抗外国帝国主义的遗产。"
 QIE_the_empire_of_the_red_dragon:0 "赤龙帝国"
 QIE_the_empire_of_the_red_dragon_desc:0 "尽管我们还有很多工作要做，但我们已经成功地统一了中国。我们已经重生了！"
 QIEBOL_rebuild_command_structure:0 "重建我们的指挥体系"
 QIEBOL_rebuild_command_structure_desc:0 "与直系残党的内战使我们的指挥系统高层陷入混乱。剩下来的这些人，不仅在忠诚上不够，而且还脱离了原来的战斗序列编制。如果我们希望避免遭到入侵，我们必须立即重组我们的部队。"
 QIEBOL_foreigner_against_foreigner:0 "洋人斗洋人"
 QIEBOL_foreigner_against_foreigner_desc:0 "尽管德国败类以其“种族优越论”的妄想亵渎了我们的国家，但极少会有人否认他们在军事上的强大。即便这会同我们新近采用的反租界立场有所矛盾，我们仍然应该去找一些中立的代理人来帮助我们训练军队。一支准备充足的军队比几个只会口诛笔伐的知识分子有用多了。"
 QIEBOL_look_to_our_past:0 "回首过去"
 QIEBOL_look_to_our_past_desc:0 "我们不应求助洋人，而应该回首过去，去找寻改革军队的灵感。军阀混战时代经过实战检验的方法放在今天可能仍然是有效的，它将帮助我们消灭敌人。"
 QIEBOL_assess_doctrines:0 "评估军事学说"
 QIEBOL_assess_doctrines_desc:0 "现代战争的面貌日新月异，这要求我们必须认真审视我们的军事学说。我们是继续使用直系制定的军事计划，还是尝试设计我们自己的？"
 QIEBOL_uneasy_coalition:0 "下一步"
 QIEBOL_uneasy_coalition_desc:0 "我们的政府既有宣统皇帝的合法性，也有人民的拥护。为了改善我们的军队还有很多工作要做，但我们一定会成功。"
 QIEBOL_rural_defense_force:0 "成立民团"
 QIEBOL_rural_defense_force_desc:0 "多年来，中国的农民都生活在被游民和土匪侵扰的恐惧之中。新帝国宪政会建议制定一个制度，使每个村庄都拥有自己的，配备过时步枪的防御部队。尽管它们在军事上的用途可能微乎其微，但它们在骚扰敌人的时候就能大显身手了，并使得敌人将会在我们被占领的领土上维持更高昂的治安成本。"
 QIEBOL_prepare_dikes:0 "准备溃坝"
 QIEBOL_prepare_dikes_desc:0 "黄河沿岸的堤防有可能对日本人造成巨大的打击。只要我们在敌军前进至这些地区的时候掘毁堤坝，洪水将极大地减缓日本人的前进速度，这将使得我们的士兵能够更好的准备防御。"
 QIEBOL_exploit_baoding_contacts:0 "利用保定联系"
 QIEBOL_exploit_baoding_contacts_desc:0 "保定陆军学院与中国各地的军事院校和兵工厂都有合同，甚至是在表面上敌人控制的地区。如果有足够的资金，可以说服这些合同加入我们的阵营，带来他们的经验和技术专长。"
 QIEBOL_reinstate_baojia:0 "恢复保甲制"
 QIEBOL_reinstate_baojia_desc:0 "保甲制度始于宋代，起初是为了维护地方秩序、征收赋税和组织徭役而创建的。通过重建一个这一制度的现代版本，我们可以更有效地招募和训练士兵。"
 QIEBOL_best_money_can_buy:0 "把钱用在刀刃上"
 QIEBOL_best_money_can_buy_desc:0 "满洲的勋贵在坐食十年来变得越发富裕。我们应该鼓励他们将这笔钱投入到雇佣中国其他军事院校毕业的军事顾问身上，他们中有不少能在加入我们一侧的时候带回来更多的财富。"
 QIEBOL_imperial_propaganda:0 "帝国宣传"
 QIEBOL_imperial_propaganda_desc:0 "为了打败我们的敌人，我们必须在军队中把对皇帝绝对忠诚的念头灌输给士兵们。他们必须践行自己的诺言用宝贵的生命去捍卫帝国的主权、中国的未来和象征。"
 QIEBOL_manchu_naval_academy:0 "建立帝国海军学院"
 QIEBOL_manchu_naval_academy_desc:0 "清军的海军军官都是由欧洲培养的，虽然目前还不是什么要紧的问题，但我们仍应投入一些资金建立属于自己的水师学堂而不是在国外训练我们的海军军官。"
 QIEBOL_manchu_air_warfare:0 "研究欧洲的空军战术"
 QIEBOL_manchu_air_warfare_desc:0 "尽管我们希望尽可能少地邀请洋人到我们的国家来，但没人会质疑洋人对空战这一领域的认识。我们应该研究它们的学说和战术，以便可以将其应用于我们自己的空军之中。"
 QIEBOL_expand_baoding_rnd:0 "成立保定军事研究部"
 QIEBOL_expand_baoding_rnd_desc:0 "为了让我们的军队沿着现代化的路线进行全面的改革，我们应该着手建立一个研究机构，来保证我们的部队可以紧跟技术创新。通过建立一个完全独立的保定军事研究所，我们的部队将拥有与世界上任何一支现代军队相当的技术支持。"
 QIEBOL_destroy_concessions:0 "终结租界"
 QIEBOL_destroy_concessions_desc:0 "使馆城市无疑是对中国主权和独立莫大的羞辱。同西方世界的贸易是可以接受的，但是这些使馆城市却是上个世纪屈辱的产物，这使得我们在现代国家之中毫无立足之处。现在随着另外半个世界都陷入了混乱，现在是时候进攻并夺回我们沦陷的城市了！"
 QIEBOL_destroy_germany:0 "诸神的黄昏"
 QIEBOL_destroy_germany_desc:0 "德国在山东的租界使得愚蠢的条顿蛮子长久以来污染我们的国家！这些西方帝国主义的前哨站必须在他们的母国被欧战所分散精力之时被我们收复。"
 QIEBOL_false_republic:0 "处理北方的叛徒们"
 QIEBOL_false_republic_desc:0 "东北那群蠢猪声称他们是中国唯一的合法政府的“最后一处堡垒”。事实上，他们不过是日本人的一条狗而已，在他们依偎在他们日本主人的脚边时，我们应该展开攻势并重夺我们的家园！"
 QIEBOL_we_win:0 "巨龙涅槃"
 QIEBOL_we_win_desc:0 "尽管之前很少有人真的相信这会成功，但事实如此，我们已经战胜了所有敌人！现在我们无可争议得成为了中国真正且唯一的主人，皇帝已经准备好率领我们的国家进入一个崭新的世界了！"
 QIEBOL_prepare_shanxi:0 "晋系问题"
 QIEBOL_prepare_shanxi_desc:0 "虽然闫总督为我们夺取政权的成功立下了汗马功劳，但山西的现状却成了我们的眼中钉。许多反对派团体指出，我们以前依靠军阀夺取政权对于我们未来实现统一中国的承诺来说不是一个好兆头。我们必须通过某种方式将山西纳入帝国作为一个省来证明他们是错误的，以免人民变得冷漠。"
 QIEBOL_rural_loyalty:0 "确保乡村的忠心"
 QIEBOL_rural_loyalty_desc:0 "新帝国宪政会已经完成了主要的乡村改革计划并确保了其对政府的掌控。即便在那些并不由我们直辖的地区，人民们也为我们的仁政而欢呼。如果我们的敌人胆敢进攻我们，他们将发现自己深陷人民战争的汪洋大海——中国的农民们将会为守护中国而战斗至捐躯。"
 qiefocus.18.e:0 "选择社会党"
 QIE_league_of_yellow_dragons:0 "黄龙联盟"
 QIE_league_of_yellow_dragons_desc:0 "黄龙同盟是中国社会党组建的新型准军事组织，旨在以革命大众的名义保卫清朝皇位。"
 QIE_five_year_plan:0 "社会主义五年计划"
 QIE_national_purge:0 "新官僚机构"
 QIE_peoples_will:0 "民意"
 QIE_no_longer_bloody:0 "革命军指挥部"
 QIE_peoples_will_1:0 "推动新的革命身份"
 QIE_beyond_han_decision_category:0 "不止汉族"
 QIE_conquer_lands_socialist:0 "征服旧地"
 QIE_five_year_plan_decision_category:0 "五年计划"
 QIE_five_year_plan_mission:0 "五年计划"
 QIE_build_up_civilian_beijing_basin:0 "振兴北京民用工业"
 QIE_ramp_up_countryside_infrastructure:0 "加强农村基础设施建设"
 QIE_sail_the_red_fleet:0 "红色舰队航行"
 QIE_weaponized_production:0 "武器增产"
 QIE_red_qing_totalist_party:0 "社会党/国家工团党"
 QIE_red_qing_totalist_party_long:0 "中国社会党/中华国家工团党"
 QIE_red_qing_syndicalist_party:0 "大同党"
 QIE_red_qing_syndicalist_party_long:0 "东方大同党"
 QIE_red_qing_radical_socialist_party:0 "社会党/工党"
 QIE_red_qing_radical_socialist_party_long:0 "中华社会党/中华帝国工党"
 QIE_red_qing_social_democrat_party:0 "新帝国宪政会/工党"
 QIE_red_qing_social_democrat_party_long:0 "保救大清皇帝会/中华帝国工党"
 QIE_red_qing_social_liberal_party:0 "工党"
 QIE_red_qing_social_liberal_party_long:0 "中华帝国工党"
 QIE_red_qing_purged_party:0 "激进CSP残余"
 red_qing.1.title:0 "领导社会主义统一战线"
 red_qing.6.t:0 "连施思想东方化"
 red_qing.6.d:0 "二十世纪初的柏林，以保罗·连施为首的三人政治集团，提出了一种超越党派利益的政治哲学。他们主张为了国家“大我”而牺牲党派“小我”，强调在民族共同体内实现士兵与工人、军人与工会的团结。这一思想虽未在德意志帝国主流政治中扎根，却因其对社会主义、民族主义与爱国主义融合一体的独特探索，意外在东方获得了知音——诸翔，即后来为人所知的“青来居士”。\n诸翔深受中德思想交融传统的启发，在大学教授期间不遗余力地译介与阐释连施的思想结晶，强调国家力量与民众组织相结合，批判机械的阶级对立论，主张以爱国精神统合社会多元力量。他尤其指出，连施倡导的“军人工会联合”模式，恰可与中国历史中“军民一体”的思想传统对话，特别是清代八旗制度所体现的兵民合一、组织严密的治理智慧。\n如今，身居庙堂的青来居士，终于得以超越纸面论述，着手推动连施思想的东方化实践。他计划以大张旗鼓之势，构建一套以“八旗军—工人群众—工会”为框架、从上至下、从军到民的组织合作体系。此举旨在为中华帝国的社会主义实践，注入鲜明的国家主义与爱国主义色彩，使其不仅关注经济分配，更强化社会整合与民族认同。正如莱布尼茨曾从中欧文明的“互补”视角寻求智慧交融，青来居士也在试图通过连施思想的中国化为中国探索一条既承接传统治理智慧、又融合现代组织理念的独特道路。"
 red_qing.6.a:0 "自是多师为我师"
 red_qing.7.t:0 "东方革命帝国"
 red_qing.7.d:0 "在实践方面，连施派把帝国与战争看成资本主义发展过程中的“推进器”，认为通过现代化与形成新阶级基础，帝国扩张会在长远促进革命条件的形成。例如，19世纪列强殖民浪潮催生了全球无产阶级的觉醒，近代日本的战败，亦在黑船事件后的短期阵痛中埋下了社会变革的火种。因此，即使其中会有短期压迫与剥削，但这是不可避免的牺牲，民族革命不可能一蹶而就。\n对此，诸翔认为，连施派的思想确实值得借鉴，但他们的思想是寄望于资本主义矛盾的自发爆发，本身并不适合大清帝国全盘吸收。虽然大清帝国在对外竞争中已经战胜日本，但仍未形成类似帝国公约那样的“大陆性集团”。帝国需要主动构建多民族帝国共同体，以空间换时间，将中华民族的社会主义锻造为既是解放工具，亦是文明新形态，打破一战以来帝国主义主导的海权秩序，颠覆既有国际体系，为本土民族社会主义开辟“不受围剿的试验场”，从而给中国的民族社会主义运动带来新的生存空间。现在，大清帝国在自己的治理下已经具备了构建可持续革命战争体系的条件，对东亚民族国家来说，专属于中华民族的社会主义若最终战胜，不再被其他国家欺侮，就可使社会主义与民族认同深度融合，重塑社会结构。"
 red_qing.7.a:0 "自成一家始逼真"
 red_qing.7.b:0 "回归民主社会党的本源"
 red_qing.8.t:0 "实业富国，圣心爱民"
 red_qing.8.d:0 "朱志尧，圣名尼格老，是名扬四海的民族企业家，自幼受洗，从小便浸泡在信仰基督教的环境里，使他在行慈善之事时多带有源于基督的圣心。\n从政之前，朱志尧就积极投身于实业救国。他长期资助教会办学、办医、出版，并参与教会的狱中事工，为囚犯传教、施洗，把基督教信仰付诸实践。奈何中原连年战乱，军阀互相攻讦，百姓生灵涂炭，多年的实业救国在天灾人祸面前宛如蜉蝣撼树。朱志尧渐渐明白，没有政治上的立国，就没有国家安定，更遑论人民幸福、圣心实现。\n于是，恰逢清帝除军阀、行新政，朱志尧看到皇帝愿意俯身倾听黎庶之言，毅然决定弃商从政，开始在朝廷为贫苦教民四处奔走，竟也慢慢爬了上去，与原先的江亢虎等人并列齐驱。\n现在，统一事业已然接近尾声，虽然是企业家而非黎民百姓，但朱志尧大爱无疆的精神在民间得到广泛传颂，正是这种践行圣心、爱民如子的种种事迹把尼格老送上首辅之位。朱志尧也相信凭借自己的榜样地位，以基督徒的良心来经营国家并回馈百姓，使中国富强起来。"
 red_qing.8.a:0 "愿上帝哀怜世人"
 red_qing.9.t:0 "战胜阶级斗争"
 red_qing.9.d:0 "朱志尧视英法的工团主义思想为危险的颠覆性理论，在这些国家资产阶级遭到了消灭，工人自主管理在缺乏指导的情况下问题百出，从而导致生产能力严重下滑，更别提对于缺乏工人阶级与继续工业化的中国有什么帮助了。作为一个社会主义者，朱志尧承认阶级斗争存在，然而他与工团党和国民党等受马克思主义影响的颠覆分子完全不同，更希望通过温和的改革让工人与资产阶级和平相处互相尊重，以阶级合作代替阶级斗争。因此，他更青睐于德国社民党、西班牙工人社会党与美国的厄普顿·辛克莱等人的人道改良主义方针。随着工党改革的彻底落实，中国呈现出欣欣向荣的景象：罢工与剥削已经不复存在，取而代之的是诚实勤劳的工人与体察民情的企业家的合作。一个富强的中国就在眼前！"
 red_qing.9.a:0 "阶级合作才是唯一正道！"
 red_qing.10.t:0 "国际的孔子与孔子的国际"
 red_qing.10.d:0 "好不容易周密筹划战胜竞争对手连任了首辅职位，江亢虎终于能静下心来考虑一件大胆的想法:当社会主义主义遇到孔子。他认为，儒学并非亘古不变，社会主义也并非使人敬而远之的“洋货”，人们口口相传、报社争相传播的社会主义其实是“历史上中国就有的共同主义”，面向社会主义反而是回归中国古制的延续或复兴。例如，《论语》《孟子》里的“均无贫”“大同”观念，与古代的井田、乡里公共组织建设观念依然能在今天的社会主义、甚至能在世界范围内的国际社会主义叙事里熠熠生辉。\n大抵是江亢虎手底下的文人走狗发挥了主观能动性。没过多长时间，江亢虎关于儒家与社会主义的言论首先在京城引发了一场舆论上的大爆炸，而后在舆论上径直淹没了全国范围内几乎每个能把报纸送到的角落，后来还走出中国，通过一些华侨传到了西洋国家。报童满嘴尽是社会主义与孔子，老儒口中满载大逆不道与叛祖。\n此次舆论风波中，有人认为，江亢虎这一大胆的想法是“社会主义的儒家化”，更是“儒学法古的社会主义视角”，既能对抗西方工团主义犬吠，也能降低全国上下对社会主义新思想的整体接受成本；也有人批评他污蔑孔子，把孔子话语政治化、解构孔子，给孔子为代表的中国儒家传统思想蒙羞；而李大钊、谭平山等仍然活跃在宣传战线的革命家，甚至是幸存下来的其他无政府主义者也批评江亢虎此行是为特定政治立场服务，认为江亢虎强绑社会主义于孔子的根本目的是为了塑造“一言堂”式的东方社会主义释经权。\n当纷纷议论传回江首辅耳边，他思索片刻..."
 red_qing.10.a:0 "之前那大胆想法要实现还为时过早"
 red_qing.10.b:0 "君子之于天下，行事更要不拘一格"
 red_qing.11.t:0 "三无主义"
 red_qing.11.d:0 "自江亢虎门下文人宣扬“儒家社会主义”之说起，坊间便街谈巷议，众说纷纭。于江亢虎而言，此类争议犹如毛毛细雨落入心海，反激起他更深层的波澜。在他看来，儒家社会主义不过表面涟漪，无政府主义才是能卷天席地、震惊底层土老帽的浪潮——江亢虎自幼熟读经典，深谙儒学，却又东渡日本、西赴欧洲，留学期间不仅博览社会主义、无政府主义之原著译著，更亲身参与海外劳工运动。相比之下，那些仍固守乡塾旧籍的腐儒，在他眼中早已不足为论。既居高位，他早年所创、曾深深倾心的“三无主义”，此时也被他重新拾起，化为巩固话语权的一枚棋子。\n不久，其门下文人再度营造声势，将“三无主义”推至台前炒作，竭力把江亢虎塑造为既法古又厚今、既外收又内蓄、虚怀若谷的大思想家形象。当然，全国上下无不二度震惊，纷纷提出疑问:什么是无政府主义?国内百姓大多愕然不解，只视作朝堂奇谈。\n然而，此论竟漂洋过海，先是在日本激起回响。江亢虎昔日的东洋同窗、左翼人士，无论任职议会或身在学界，皆谓江亢虎得幸德秋水思想之真传。石川三四郎更誉之为“大东亚实现君主社会主义之里程碑”。随后，“三无主义”经由日本传至欧洲，特别是在第三国际官方与广大受压迫的东墙国家民间获得不少无政府主义者呼应。法兰西公社前义贼，现公社联邦无政府派代表之一的马里于斯.雅各布认同三无主义的 “无国家” 与 “反教权” 的立场，但对江亢虎本人对自己的这套理论留存的信仰与实践行径提出了质疑；白俄罗斯的无政府主义者马克.姆拉特齐尼一派有人专门为此撰写了社论，在原则上认同“无国家、反教权、妇女解放”，也指出江亢虎本人现在重拾三无主义思想仅仅是为了巩固思想一言堂的本质。\n江亢虎继续遣人搜集各国报刊评论，面色平静如常，胸中却已浪潮翻涌..."
 red_qing.11.a:0 "及时收手，打造好江氏的意识形态招牌便行"
 red_qing.11.b:0 "无政府主义真官方化也不错，方便打击异己"
 red_qing.12.t:0 "新社会主义与新民主主义之问"
 red_qing.12.d:0 "在1922年8月《第二次欧游回国宣言》中，江亢虎提出了其“新民主主义和新社会主义”的主张，并声称这是自己“半生来学问思辨之结果”，是“本一生九死之精神，向我垂毙同胞进此最后瞑眩之剂”。他把社会政治和经济的改造区别开来，认为实行“新民主主义”以后，政治问题就解决了，此后主要是要解决经济问题，即实行“新社会主义”，江亢虎通过“外观事变，内审国情”，将自己的新社会主义概括为资产公有、劳动报酬、教养普及三点。当然，这里的新社会主义与在法国风行的由马塞尔·戴亚创造的推崇技官统治的新社会主义毫无关系；然而江亢虎为了向增强与法国的联系，将戴亚的一部分思想融入了自己的新社会主义中。至于新民主主义，江亢虎的“新民主主义”以“选民参政”、“职业代议”和立法一权”等三项“要目”为主体。选民参政，指的是人民中的少数最优秀分子参政，他们必须具备三种资格，并享有五项权利；立法一权，指的是为克服“三权分立”的弊端，将立法、司法、行政等三权统一于一权，即立法权“超越”于其他两权之上，形成一权制国家，其最高代表是国会议长；职业代议，则是为了克服代议制选举制度的缺陷，“以职业为单位，以地方为区域，以选民人数为比例，平均分配投票权、代议权”。那么，我们是否应该复兴这些早期思想呢？"
 red_qing.12.a:0 "这些东西早就应该被遗忘了"
 red_qing.12.b:0 "实践新民主主义"
 red_qing.12.c:0 "实践新社会主义"
 red_qing.13.t:0 "工团主义“旗开得胜”"
 red_qing.13.d:0 "“姚作宾，中国工团主义第一人，一八九三年生于四川，早年自费东渡日本，卒业于东京明治大学政经科。一九二〇年一月，继刘振群之后，出任中华民国学生联合会留日学生代表理事，在沪屡次组织学子罢课。是年五月，代表全国学联远赴符拉迪沃斯托克，欲与苏俄通声气。然苏俄革命未成，罢课之举亦屡遭挫败，革命事业岌岌可危。\n当此困顿之际，姚公经人引荐，投身黄介民所创之大同党，此实为其革命生涯之转折。既入大同党，姚公得黄介民牵线，得与方兴未艾之法伦施泰尔国际执行委员会相接。越明年，赴欧洲巴黎之法兰西公社革命华员局活动，代表大同党获法伦施泰尔国际之承认。其间虽为国民党所掩，然时势终证大同党乃中国革命之正途，此皆姚公之明断、于时机之精察、于革命之呕心沥血。”\n以上便是姚作宾代表作《中国工团革命视杂谈》里的一部分内容。自从姚作宾赢得选举，他的这部著作不胫而走。该著作详细描述了中国大同党作为中国第一个工团主义政党的发展历程与姚作宾本人的革命事迹，为姚作宾本人亲自口述托人而作。当初考虑到跟自己竞争新大清帝国首辅位置的其余四位竞争者的资历都要浅薄，自身资源又最为稀少，姚作宾认为唯有提前把自己的名声打出去才能在有能力投票的群体里占得第一印象优势——这便是此书横空出世的缘由。选举已然得胜，所有关于姚作宾背叛学生运动沦为慕洋犬的“谣言”均已黯然失色，是时候该姚作宾本人思考下一步的掌权方向了。"
 red_qing.13.a:0 "保持工团主义纯洁性，方便跟洋老爷打交道"
 red_qing.13.b:0 "先收买几个工会头子，免得屁民后面有意见"
 red_qing.13.c:0 "必须保证只有自己一人才能解读工团主义"
 red_qing.14.t:0 "四海同胞齐奋起"
 red_qing.14.d:0 "虽然中国的工团主义革命取得了重大胜利，但是不仅是我们的高丽友党尚未革命成功，全亚洲的工团革命依然遥遥无期——北踞俄妖，南遍夷殖，西邻蛮戎，内忧分裂，外遭围剿，形势对大清帝国非常不利。为鼓舞士气、强化亚细亚人民对于工团主义的认同，并试图动摇盟国在亚洲的殖民体系，大清帝国姚作宾政府决定召开一场“促进亚洲团结”的亚细亚工团主义大会。\n会议在北京的怀仁堂举行。参会者均经过严格筛选，全是亚洲范围内的工团主义革命者代表，包括高丽工团党的李东辉、菲律宾左派领袖克里桑托.埃文杰利斯塔、缅甸昂山将军、印尼的穆纳瓦尔.慕梭，阿富汗、印度方面也有党派派遣代表参加，甚至还有从日本秘密前来的代表。\n会上，姚作宾致开幕词，鼓吹建设“大亚细亚工团主义新秩序”，谴责德意志皇帝、协约国集团，要求各方与大清帝国“紧密合作”“协助完成大东亚解放战争”。其议程和文件强调“共同繁荣”、“共同革命”。\n会议最后，与会成员一致通过《大亚细亚革命共同体宣言》：宣言宣扬“亚洲各国互相合作，确保帝国主义滚出亚洲，并以工团主义为基础，创设“发扬亚洲本土革命文化”等五条纲领。会后，姚作宾政府还组织了10万人欢送前来参加的“大亚细亚工团主义大会”各大代表进行造势，大清帝国各界媒体也迅速利用此事件进行宣传，继续发挥自己对于姚作宾的喉舌作用。他们的声音出奇的一致:”各界英雄齐聚一堂，共襄盛举。”倒是姚作宾本人的真实想法..."
 red_qing.14.a:0 "一国革命足矣，天朝上国无意吞并不毛之地"
 red_qing.14.b:0 "假戏真做，借帮助友党名义摄取天下"
 red_qing.15.t:0 "跨越长白山的“革命”友谊"
 red_qing.15.d:0 "高丽工团党是1921年在俄罗斯伊尔库茨克组建的左翼政党，创始人为来自西伯利亚西部的归化朝鲜人李东辉，原本信仰列宁主义，曾与前来学习的姚作宾等人相识。这一组织诞生于苏俄革命的激荡岁月，却因内部派系斗争与外部压力而命运多舛。苏俄革命受挫后，高丽共产党分裂为两派：一派北上投奔法兰西公社，被整合为法伦施泰尔国际远东分部的高丽局；另一派则潜入中国天津，在工团主义思潮的影响下改组为高丽工团党。然而，因其中一位成员拿党组织的钱去嫖娼后被租界巡警抓捕，组织暴露行踪，被迫转移至北平投靠大同党寻求庇护。\n此时，曾与高丽共产主义者有过交集的姚作宾已身居高位。他高举泛亚主义大旗，暗中扶持这批流亡的朝鲜革命者。姚作宾通过大同党将资金、武器和军事训练援助至该友党，将高丽工团党重新武装为“高丽归化军”，试图将其塑造为大清帝国遗绪下泛亚主义的先锋。在他的政治蓝图中，若高丽工团党能成功崛起，大清帝国将被重新包装为“东亚工团主义革命的摇篮”，而他本人则有望凭借这些功绩自行加冕为东方工团主义事业的革命导师。"
 red_qing.15.a:0 "亚细亚工团革命自中朝而始!"
 red_qing.16.t:0 "一人得势，鸡犬升天"
 red_qing.16.d:0 "张国焘，字恺荫，又名特立，江西萍乡人，中国工团党创始人之一，中国国民党主要领导人之一，也是中国国民党复兴社的三驾马车之一。虽然张国焘在国民党内资历很深，但闽赣革命政府失败后他毫不犹豫地抛弃了革命队伍，带着一小撮忠于他的复兴社成员跑到了大清，在宣统维新的浪潮下摇身变为“维新旗手”，终日撰文颂扬清帝“隆恩”，甚至把当年“党狱”事件扭曲为对自己的成功“改造”。张国焘是如此腼颜事仇，以至于即使叛变投诚，其派系也是长期遭到忽视，在边缘位置来回打转，令人叹惋。\n在清廷的阴影下，张国焘的派系虽得苟安，却始终被边缘化。权力场上的冷遇激化了他的不甘。伺选举日，张国焘先是捡起工团主义把自家党派更名为“新工团党”，再以“华夏民族复兴”为号，诡辩自己实为“帝国内最革命爱民者”。更令人咋舌的是，他竟重演闽赣时期的手段，深入农村“扶农助贫”，操方言喊口号，以虚伪的亲民表演裹挟民意，竟也能忽悠一大群贫民信了张国焘兜售的他自己那一套思想，让汹涌的“民意”把自己捧进了清帝身边。\n一朝得势，獠牙立现。张国焘及其党羽篡夺政权之后便露出真面目。大官位子还没坐热几天，张国焘便默许手下这群人迅速清洗政敌，把所有曾经忽略冷落自己人的“左翼”政党统统列为查禁对象。诸翔、姚作宾、江亢虎都被打成通日汉奸纷纷扔进大牢；慈善家朱志尧则好一点，被打入冷宫；至于民间，一群来自乡舍邻里的流氓无产阶级主动效忠新工团党，自行组建类复兴社基层组织，为自己摄取利益。清帝虽欲制衡，却难敌其权术蚕食，朝不保夕。"
 red_qing.16.a:0 "政治本身就包含罪恶，革命也不一定就是圣洁"
 red_qing.17.t:0 "中国的莫斯利！"
 red_qing.17.d:0 "张国焘在先后抛弃了工团主义与三民主义之后，对西方的宪章极权主义产生了兴趣，在了解了乔治·瓦卢瓦、马塞尔·布卡德、古斯塔夫·爱尔威、拉米罗·莱德斯马、贝尼托·墨索里尼等人的思想之后，张国焘认为莫斯利的准则主义是最适合中国的极权主义意识形态，其对民族主义与社会主义的完美结合正是中国应该的学习的榜样。随着学习英国的浪潮席卷全国，张国焘也开始自称为“中国的莫斯利”，并开始以黑衫军为模板建立准军事组织，甚至还尝试邀请莫斯利访问中国。"
 red_qing.17.a:0 "我们在中国点燃了一座不会熄灭的火炬！"   
 red_qing.18.t:0 "社会主义联盟的未来"
 red_qing.18.d:0 "自大清天下一统大业已成，清帝竟生出一个前所未有的念头：举行选举，还政于民。紫禁城的琉璃瓦下，这道旨意如惊雷炸响，使首辅江亢虎接旨时掌心不禁沁出冷汗——这“还政”二字背后不仅是皇权对汉臣的试探，更是满洲勋贵虎视眈眈的杀机——若一口回绝，恐怕今夜便有人以“忤逆”之名血洗相府；若全然顺从，自己苦心经营的权柄必将土崩瓦解。\n于是，江亢虎满口称是，背地里却盘算着放出自己在背后一直默许活动的“御用反对派”填满选举政党名额。虽然这群御用反对派为了选举紧锣密鼓地准备着大选事项，但江亢虎却不紧不慢。他本人盘算如下:\n“其一是新帝国宪政会的诸翔一派。这群文人早年依附江亢虎，后以“研习德人保罗·连施之学”为名另立山头，妄图以理论诏安团练、取悦军人，为大清谋求准军事化之实。以枪治国，真乃痴心妄想。\n“其二是朱志尧的工党。商贾之流竟敢涉足朝堂，以慈善收买民心，鼓吹“实业救国”。士农工商，千年等级森严，纵有万贯家财，也不过是满朝文武眼中的肥羊，成不了气候，真乃不自量力。\n“其三是姚作宾的大同党。不得不说收买学生领袖的做法真的很正确，这群年轻人在权钱面前终归是丢掉那可怜的学子之心，丢掉青年人的热血，被驯化为趋炎附势之徒，不足为惧。\n“最后是张国焘的小团体，自称新工团党。此党势微，却最需警惕。他们口呼“皇恩浩荡”，心藏狼子野心，当年脱离闽赣赤匪投诚时便显反复之性。此等人势同野火，可驱狼吞虎，亦可反噬其主，野心极大，最需提防。”\n\n选举日当天，万人空巷，人潮如织。受皇上恩泽的黎民百姓、达官显贵纷纷出门前往投票站投下自己宝贵的一票，大街小巷张灯结彩，宣传声络绎不绝。\n待票决日到来，紫荆城内谁能身居皇恩之侧..."
