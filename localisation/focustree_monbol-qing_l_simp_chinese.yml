 red_qing.19.t:0 "帝制的命运"
 red_qing.19.d:0 "尽管溥仪的权利实际上并不大，但是对于很多人来说社会主义君主制简直可笑到了极点。我们应该怎么做？"
 red_qing.19.a:0 "维持现状" 
 red_qing.19.b:0 "剥夺溥仪的全部权力，让他当一个傀儡" 
 red_qing.19.c:0 "驱逐鞑虏，恢复中华！"