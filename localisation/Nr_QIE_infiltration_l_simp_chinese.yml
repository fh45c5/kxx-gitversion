 qiefocus.37.t: "一份共和派之间的协议？"
 qiefocus.37.d: "自从直系恢复共和之后，我们就一直在与北方进行接触。虽然他们的内乱已经结束，且成立了北京政府，但合法性依旧微乎其微，尤其是在他们曾经复辟帝制的背景下。因此，他们列出了几点要求，只要我们能够履行，就愿意接纳我们。\n\n其中，共和、反租借、反帝国主义之类的陈述当然是双方的共识，但关于宪政民主，他们比我们想象中更保守也更强硬。陈炯明声称，如若不能在国家统一后立即推进省级选举和真正的“民主”政治，他将拒绝与做进一步的沟通。然而，政府中的其他人抱有不同看法。"
 qiefocus.37.a: "在其他人的竭力劝说下，妥协达成了。"
 qiefocus.37.b: "一朝为帝制走狗，终身为帝制走狗。"
 qiefocus.38.t: "一份共和派之间的协议？"
 qiefocus.38.d: "自从直系恢复共和之后，我们就一直在与北方进行接触。虽然他们的内乱已经结束，且成立了北京政府，但合法性依旧微乎其微，尤其是在他们曾经复辟帝制的背景下。因此，他们列出了几点要求，只要我们能够履行，就愿意接纳我们。\n\n其中，共和、反租借、反帝国主义之类的陈述当然是双方的共识，但关于宪政民主，他们比我们想象中更激进也更强硬。顾维钧声称，如若不能在国家统一后立即推进省级选举和真正的“民主”政治，他将拒绝与做进一步的沟通。然而，政府中的其他人抱有不同看法。"
 qiefocus.38.a: "在其他人的竭力劝说下，妥协达成了。"
 qiefocus.38.b: "一朝为帝制走狗，终身为帝制走狗。"
