 QIE_legitimacy_of_the_monarchy_zhili_wu: "帝制法统：§z武断朝纲§!"
 QIE_legitimacy_of_the_monarchy_zhili_wu_desc: "大清国祚表面上已然延绵三百余载，可如今君臣伦常却已黯然失色，积重难返。在中国公民，无论是官僚、工人还是农民眼中，一众暴君僭主怀揣着改革的承诺来了又去，到头来一切却不过是原地踏步。大清奉天承命，在名义上宣称了华夏四境的法统，可却只是带着国家步步走向灭亡。若是还想让百姓信服君君臣臣之纲纪，那首先便要把他们从国乱岁凶、纷争不息的境遇中解救出来。同时也要让百姓相信一件事——清虽旧邦，其命维新。\n\n在吴佩孚的强力主导下，清王朝逐渐摆脱了议会政治的掣肘，进入了铁腕统治的新时代。工潮罢市被以纪律与武力粉碎，劳工与学生运动被迫屈服；国民工程团、军事体育组织与防务专署接连设立，形成了一个高度集权化、军警渗透到社会各层的政权结构。吴大帅在宣传上高举“粉碎赤色帝国主义”“守护华夏正统”的旗帜，自诩为民众的护国公，成功塑造出一位拯救国家的强人形象。\n\n然而，这一切荣光背后，却掩不住潜藏的危机。吴佩孚已年事渐高，直系军官团内部暗流涌动，不满者与因失败而退隐的民主派势力始终在暗处伺机而动。一旦铁腕的核心人物失势或谢世，清廷的直系霸权恐怕难以维持稳定，新的内乱或许会再次将国家拖入混沌与危机之中。"
 QIE_legitimacy_of_the_monarchy_zhili_cao: "帝制法统：§z武断朝纲§!"
