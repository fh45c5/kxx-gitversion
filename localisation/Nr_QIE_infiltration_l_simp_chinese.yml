 QIE_legitimacy: "有限正统"
 QIE_legitimacy_desc: "现在，从北到南，中华再得统一，我们必须开展运动再造中央政府。中国境内的许多人——尤其刚刚被征服的北方地区不认同我们为合法政权。向这些怀疑者证明一切需要时间和精力，在此之后我们才能真正的宣称我们统一了中华。"
 QIE_bureaucracy: "官僚机构超负荷"
 QIE_bureaucracy_desc: "一夜之间，我们的官僚队伍的任务从管理南方数省变为了掌管中国大部的政务。说我们的官员们已“鞠躬尽瘁”只能算是一种客套话。为了服务于新近占领的省份，我们的公务员队伍急需扩张。在此之前，我们的行政和治理能力将持续受到影响。"
 QIE_military: "新中华陆军"
 QIE_military_desc: "中华大地换了新篇，胜利之师属于新的中央政府。由此，一大批兵工厂和军工学术企业急需在数十年的自行其是后再度归于中央指挥。"
 NPA_navallegacy: "中国的造船厂"
 QIE_NPA_legacy: "护国战争的传承"
 QIE_empowered_executive: "授权行政"
 QIE_empowered_executive_centralist: "集权政府"
 QIE_empowered_executive_federalist: "自治政府"
 QIE_empowered_executive_centralist_NPA: "单一制"
 QIE_empowered_executive_federalist_NPA: "地方自治"
 QIE_xinhai_legacy_idea: "直奉战争的传承"
 QIE_empowered_legislative: "授权立法"
 QIE_empowered_legislative_federalist: "自治政府"
 QIE_empowered_legislative_centralist: "集权政府"
 QIE_empowered_legislative_federalist_xinhai: "自治中国"
 QIE_empowered_legislative_centralist_xinhai: "单一制中国"
 QIE_provisional_government: "临时政府"
 QIE_provisional_government_desc: "随着中华大地的核心地区被我们控制，我们可以建立新的民国临时政府，一个崭新的、长久维持的、宪政民主的、统一的、经受的住时间考验的民国政府。"
 QIE_strengthen_parliament: "强化议会"
 QIE_strengthen_parliament_desc: "中国各地的民主人士一致同意，必须加强议会的权力以确保中国的民主，并确保威权主义者不会再次窃夺年轻共和国的权力。"
 QIE_strengthen_presidency: "赋权总理"
 QIE_strengthen_presidency_desc: "曾经的共和派政府垮台显示了政府的权力必须得到明确界定，国务院总理的重要性就在于能够确保国家稳定和政治治理适当。"
 QIE_xinhai_legacy: "大革命传承"
 QIE_xinhai_legacy_desc: "辛亥革命标志着现代中华的诞生，标志着中华民国的诞生。辛亥革命以及其革命者必须得到隆重的纪念与缅怀，辛亥革命的传承将与我们的新国家一道万古长存。"
 QIE_national_protection_legacy: "北洋传承"
 QIE_national_protection_legacy_desc: "北洋政府成为了我们领袖、我们军队对政治传承、对宪政承诺的象征，他们应当如缔造民国的辛亥革命的英雄一般得到纪念，靠他们才能保障民国长存。"
 QIE_federalist_model: "自治模范"
 QIE_federalist_model_desc: "中华联省运动在辛亥革命后几番起起伏伏，但是他们始终作为一支重要的力量在临时政府中扮演着重要角色。一个地方自治国家将确保国家的权力不集中于一人，比起由不谙熟当地事务的中央，各地方仍然保有因地制宜站在自己角度上处理问题的优点。"
 QIE_weaken_provincialism: "攻击地方主义"
 QIE_weaken_provincialism_desc: "地方主义是分裂我国为若干独立王国的工具，联省派则是试图践行这一切的凶手。中央政府的无上权力必须得到贯彻，中国必须作为一个单一制国家彻底统一起来，决不受地方豪强操纵！"
 QIE_new_republic: "再造统一"
 QIE_new_republic_desc: "有了旧民国的经验教训，我们可以再造一个新中国了。我们将再造一份中国的新秩序，一份真正遵循前人遗愿的，共和宪政民主的中国将诞生并长存下去。"
 QIE_personality_cult: "个人崇拜"
 QIE_personality_cult_desc: "[Root.GetLeader]是直系集团能够击垮联省派、激进派和篡位者，恢复北洋政府传承的最大保障。没有了他也就没有了新中国的诞生。他作为中华解放者的遗泽必将长存。"
 QIE_new_bureaucracy: "新官僚机构"
 QIE_new_bureaucracy_desc: "从统治一两个省到统治全中国，我们的官僚机构遇到的麻烦可是一言难尽。不论我们是采取联省模式还是中央集权模式，我们必须尽快招募一批公务员，并彻底的重组旧有的行政机构。"
 QIE_election: "新国会选举"
 QIE_election_desc: "新政府不能寄希望于在不组建新议会的基础上获得如旧民国一般的合法性。十几年来，国会进行的新一届选举将有助于临时政府获取合法性。"
 QIE_national_reunification: "国家统一"
 QIE_national_reunification_desc: "随着新国会召开，新宪法通过，我们的政府再也不是“临时”的了，而是中国的合法政府。[Root.GetLeader]总统将带领国家迈向统一，中国将再次自由的统一起来！"
 QIE_reintegrate_academies: "重新整合学术机构"
 QIE_reintegrate_academies_desc: "辛亥革命前中国各地已经开设了一批军事院校，而清王朝瓦解后他们大多陷入了独立发展中。他们必须经受中央的整合，所有训练军官的课程必须标准化。"
 QIE_standardised_arsenals: "兵工厂标准化"
 QIE_standardised_arsenals_desc: "数十年来，中国各地的兵工厂落入了各地军阀手中，很大程度上独立于省府或国家政府的管理之外。现在一大批这类兵工厂落入我们手中，而不同兵工厂生产的不同口径武器弹药对我们的后勤有着严重的影响，必须加以改正。"
 QIE_fate_of_northern_officers: "北派军官的命运"
 QIE_fate_of_northern_officers_desc: "自从北方各军阀垮台以来，我们抓获了不少军官战俘。陈炯明认为我们可以宽大处理，因为他们中的许多人愿意为新民国效力而且才华出众。然而很多人没有抱着这种乐观态度，他们认为这帮人应该按照中国人的叛徒来处理。"
 QIE_small_arms_development: "轻武器开发"
 QIE_small_arms_development_desc: "尽管国家和许多省政府试图更新换代，但是军队中使用最广泛的仍然是老旧过时的汉阳造八八式步枪。与其他现代军事体相比，我们当下的首要任务是升级军备，将标准化的新式现代步枪落到实处，交付军队使用。"
 QIE_motorisation: "军队摩托化"
 QIE_motorisation_desc: "随着中国的统一、基础设施的改善，摩托化如今不仅仅成为了可行的选择，也成为了我国这个幅员辽阔国家的必然。提高我军的机动能力将极大地提升战场内外军队的作战能力，增强军队的灵活性并扩张部队的覆盖面——尤其是那些匪患仍活跃的偏远乡村地区。"
 QIE_artillery_modernisation: "火炮现代化"
 QIE_artillery_modernisation_desc: "“炮兵是战争之王。”而火炮在军阀混战时代可是奢侈品。有了统一中国的能力，我们可以现代化我们的火炮，让我军的火力更靠近全球标准。"
 QIE_support_companies: "陆军支援与后勤"
 QIE_support_companies_desc: "“外行谈战略，内行谈后勤”。中国作为一个幅员辽阔的国家，这句俗话必须要认真对待——毕竟不少军阀就为此吃尽苦头。改善后勤将极大地提高军队的作战能力，这是任何现代武器都比不上的。"
 QIE_tank_arsenal: "坦克兵工厂"
 QIE_tank_arsenal_desc: "装甲战的发展早就影响到了中国，但是发展和利用装甲仍然是黄粱一梦。直到现在，我们统一了全中国，中华民族前所未有的强大，是时候投入到这些尖端科技领域了。应该设立一个专门制造装甲载具的兵工厂，作为中国现代化的重要垫脚石。"
 QIE_aviation_school: "航校正规化"
 QIE_aviation_school_desc: "尽管中国当下确实有几所航空学校，但是他们规模甚小且十分无组织。正规化这些航校，设立完善的飞行员和空勤人员课程，将有助于建立一支正规的中国空军。"
 QIE_new_aircraft_factories: "新飞机制造厂"
 QIE_new_aircraft_factories_desc: "在过去十几二十年里，华南已经有了一小批小型飞行器作坊，但是其规模相当小，也只能修理少数几种飞机。适时建设新一批的飞机制造厂将成为发展我们羽翼未丰的航空工业、迈向航空现代化的坚实一步。"
 QIE_native_fighter_design: "国产战斗机设计"
 QIE_native_fighter_design_desc: "中国人多次尝试制造中国产飞机，但是绝大多数都是采用了外国设计制造。有了外国专家的帮助，以及有了改良完备的本地机床，如今我们可以前所未有的发展我们自己的飞行器设计，以望用我中华神鹰护中华长空。"
 QIE_medium_bomber: "战术轰战机大队"
 QIE_medium_bomber_desc: "中型战术轰炸机能给为一支空军提供多功能作战能力，可以适应多种任务。当然，由中国人设计这么大的一种飞机是前无古人的，当然也是对我们的一种挑战。"
 QIE_light_bomber: "陆军空中支援"
 QIE_light_bomber_desc: "有点类似于可以飞行的炮兵的轻型轰炸机是一支空军支援地面作战的最佳选择。在打造一支现代空军的时候，致力于这些近距支援空军自然是有道理的。"
 QIE_southern_fleets_legacy: "北洋水师的遗产"
 QIE_southern_fleets_legacy_desc: "北洋水师有着短暂但辉煌的历史。创制于19世纪下半叶，由华北等地调拨资金作军费的北洋水师，曾经在中法战争和甲午战争中取得了一些功绩，并在战后被打败。然而，它是中国的四支现代化舰队之一，在当地留下了悠久的传承。"
 QIE_naval_academy: "复兴海军学堂"
 QIE_naval_academy_desc: "中国的海军学堂很大程度上受到了历届国家与省级政府的忽视。现在既然有了一个统一的、不容置疑的中央政府，我们当有能力振兴这批海军学堂，为民国海军培养新一代军官。"
 QIE_destroyers: "现代驱逐舰队"
 QIE_destroyers_desc: "驱逐舰是任何一支现代海军的支柱，尤其对中国这样羽翼未丰的国家。它们可以保护我们的海岸线，护卫我们的运输船队和主力舰免受潜艇和飞机的袭击。"
 QIE_submarines: "研发潜艇"
 QIE_submarines_desc: "潜艇在现代海战中的重要地位无可动摇。对像我们这样海军孱弱的国家来说，潜艇无异于海军建设中的救命稻草。通过袭击敌方运输线、骚扰敌方舰队，我们将有能力对抗远强于我们的敌军。"
 QIE_cruisers: "巡洋舰队"
 QIE_cruisers_desc: "巡洋舰对于搜寻和屏卫任务都至关重要。而且现实地讲，或许建造巡洋舰已经是我们目前能力的极限了。"
 QIE_coastal_defence: "重视海防"
 QIE_coastal_defence_desc: "如今才计划建立一支能和列强匹敌的海军是不明智的。因此，我们应该致力于建立一支更为灵活的海军，以便保护我们漫长的海岸线和我们在太平洋上的利益。"
 QIE_grand_fleet: "大舰队？"
 QIE_grand_fleet_desc: "如果中国想要被人重新视作强权，那么海军就是中国必不可少的。虽然这将会是一件长期计划，但是我们伟大的海军必须就此起步。"
 QIE_naval_bomber: "海军轰炸机项目"
 QIE_naval_bomber_desc: "虽然起初受到忽视，携带鱼雷和穿甲炸弹的海军轰炸机在海战中日渐成为了那些大型战舰的严峻威胁。这一技术也许是中国急需的：一种廉价而高效的可以摧毁敌军大型舰队、保护中国漫长海岸线的武器。"
 QIE_Twin_Dragons_Taming_the_Water: "二龙治水"
 QIE_Twin_Dragons_Taming_the_Water_desc: "军阀混战、列强宰割和官僚暴政的那十几年的中国与吴佩孚元帅和陈炯明总理建立的两党联合政府治理下的中国一比较，后者的确就像天堂一样美好。人们都说他们是“双龙治水”，合作无间。尽管有些人对这种合作能否存续下去心怀疑虑，但因为他们消除了军阀混战的苦难、为国家带来了和平，所有人都对这二人赞赏不已。"
 QIE_Building_the_Road_to_Federalism: "构建联省之路"
 QIE_Building_the_Road_to_Federalism_desc: "对陈炯明的一个保证则是，中央政府批准各省基于各省宪法自行选举产生省议会，但中央政府保留指定省长的权力。而各省省长也可以直接否决省议会做出的令人不快的决定。"
 QIE_GJXF: "新空军"
 QIE_GJXF_desc: "如果中国想要被人重新视作强权，那么空军就是中国必不可少的。"
 QIE_GQQGL: "新海军？"
 QIE_GQQGL_desc: "如果中国想要被人重新视作强权，那么海军就是中国必不可少的。"
 QIE_zhang_zongyuan:0 "张宗援"
 QIE_zhang_zongyuan_desc:0 "伊达顺之助，或者说张宗援，已携久经沙场的浪人、黑龙会分子及日本顾问来到我国。他对泛亚主义的的信仰可能会对我们造成威胁。"
 QIE_japan_attache:0 "日本军官"
 QIE_japan_attache_desc:0 "凭借着自己在日本国内的影响，张宗援邀请了数位日本军官作为军事顾问，他们的训练指导将有助于重组军队。"
 QIE_mongol_aristocracy:0 "与蒙古贵族合作"
 QIE_mongol_aristocracy_desc:0 "随着张宗援的影响力的扩散，我们可以利用他同蒙古贵族的关系来赢得国家境内外蒙古人的支持。"
 QIE_infilitrate_fengtian:0 "渗透奉系"
 QIE_infilitrate_fengtian_desc:0 "通过张宗援在日本的关系网，我们已经买通了不少为奉天政府工作的日本人。这将有利于我们未来的计划。"
 QIE_five_race_empire:0 "五族帝国"
 QIE_five_race_empire_desc:0 "张宗援主张建立一个各个民族皆平等的团结的帝国，一个没有共和派，也没有左翼颠覆分子的帝国，这将成为我们的奋斗目标。"
 QIE_panasianism:0 "接纳泛亚主义"
 QIE_panasianism_desc:0 "张宗援的理念根于亚洲人民的团结，对西方帝国主义与赤色分子的反对。现在是时候向我们的国家灌输这种理念并且根除帝国主义和工团主义的邪恶影响了。"
 QIE_zhang_zongyuan_idea:0 "张宗援之治"
 qiecoup.34.t:0 "对张宗援的请求"
 qiecoup.34.d:0 "今天早晨，一位穿着帝国官服的信使送来一封不寻常的信。这名年轻的信使自称是一名旗人并人带来了一个惊人的消息。一群满洲勋贵、改革者和心怀不满的军官们正密谋推翻吴佩孚元帅的专制并重建溥仪皇帝的权威！他们显然需要一些外援，因此过来寻求张宗援的帮助。我们应该如何回应他们？"
 qiecoup.34.a:0 "当然了！大清万岁！"
 qiecoup.34.b:0 "拒绝他们，这也太冒险了。"
 qiecoup.35.t:0 "张宗援接受了"
 qiecoup.35.d:0 "张宗援接受了政变策划者请求援助的要求。他还表示将派遣一支训练精良的部队帮助我们。然而与此同时，一旦溥仪重新回到台面上，他可能会要求我们做出更多的让步。"
 qiecoup.33.a:0 "好啊！"
 qiecoup.9.d_date:0 "张宗援拒绝了我们的请求！"
 qiecoup.2.f:0 "山东的张宗援"
 qiefocus.24.f:0 "欢迎伊达顺之助阁下抵京！"
 qiecoup.17.d_date:0 "我们的线人发现了一个危险的阴谋！看来张宗援和几位满洲勋贵、改良派和叛国将领密谋推翻直系并且让溥仪皇帝重新掌权！我们必须尽快处理！"
 QIE_date_in_government:0 "张宗援正式加入了我们的政府。"
 qieflavor.101.t:0 "南洋的中国族裔"
 qieflavor.101.d:0 ""
 qieflavor.101.a:0 "下南洋！"
 qieflavor.101.b:0 "这也太冒险了。"
 qieflavor.102.t:0 "“新中国”与“殷地安”"
 qieflavor.102.d:0 ""
 qieflavor.102.a:0 "必须拯救这些褪色的同胞！"
 qieflavor.103.t:0 "满蒙联合"
 qieflavor.103.d:0 ""
 qieflavor.103.a:0 "这些土地将重新回归！"
 QIE_negotiation_with_federalists: "与联省派协商"
 QIE_negotiation_with_federalists_desc: "既然我们已经再造共和，且粉碎了内部的各项不稳定因素，我们应当和南方的联省派进行协商，以免两面开战。"
 QIE_negotiation_with_federalists_TT: "§1如果我们选择接纳联省派，未来可以进行更激进的民权相关改革，这将对国家工业化和海外人才回流造成深远的影响§!"
 QIE_provincial_reform: "重划省级义务"
 QIE_provincial_reform_desc: "事实上，到目前为止，我国的税收都是一本糊涂账。虽然名义上我们要遵循“联省”的原则下放部分省级权力，但借此机会，我们也正好可以立法明确省级义务，尤其是把全国的税务系统从下到上捋一遍。"
 QIE_provincial_reform_idea: "协调省级税收"
 QIE_assembly_reform: "国会改革"
 QIE_assembly_reform_desc: "为了容纳南方那些自由派，我们有必要对现行的国会进行一系列改革，包括增加人数、进一步放开党籍限制，并按照各省人口、经济状况等加权分配议员比例。"
 QIE_assembly_reform_TT: "\n§R目前的政府格局会发生较大变动，与我们联合的派系将会退出！§!"
 QIE_social_democrat_party_upc: "致公党"
 QIE_social_liberal_party_upc: "进步党"
 QIE_market_liberal_party_upc: "自由联合党"
 QIE_social_conservative_party_upc: "民主宪政党"
 QIE_social_democrat_party_upc_long: "致公党"
 QIE_social_liberal_party_upc_long: "进步党"
 QIE_market_liberal_party_upc_long: "自由联合党"
 QIE_social_conservative_party_upc_long: "民主宪政党"
 QIE_authoritarian_democrat_party_upc: "国家统一联盟"
 QIE_authoritarian_democrat_party_upc_long: "国家统一联盟"
 QIE_paternal_autocrat_party_upc: "军政府"
 QIE_paternal_autocrat_party_upc_long: "军政府"
 QIE_A_Better_Beginning: "新的开端"
 QIE_A_Better_Beginning_desc: "随着国家统一，是时候让陈炯明兑现承诺了。鉴于我们已经在省级权力、国会议席问题上打好了基础，现在整合南方的过程也会相对更顺利一些。"
 QIE_A_Better_Beginning_TT: "\n§G我们将整合南方联省派并正式接纳联省主义§!"
 QIE_Set_Up_Provincial_Assemblies: "设立省级议会"
 QIE_Set_Up_Provincial_Assemblies_desc: "为了强化地方民主，各省应当制定省宪，并在县一级和省一级分别设立民主机构，协助恢复地方自治的古老传统。最终，这将帮助绝大多数尚为文盲的人民理解何谓民主，并在国家层面上为民主奠定更坚实的基础。"
 QIE_Provincial_Assemblies_idea: "省级立法机关"
 QIE_Governor_Elections: "省长选举"
 QIE_Governor_Elections_desc: "一个即使是联省派也无法回避的问题是，当今全国大部分的省长都是军阀时代的遗产。我们应当支持各省议会通过尽可能直接的方式选举新一届的县长，并尽可能避免委任制的省长，以此鼓励民主化。"
 QIE_Provincial_Elections_idea: "改革行政机构"
 QIE_Financial_Reform: "财政改革"
 QIE_Financial_Reform_desc: "财政系统是一个尤其复杂的问题，我们挑选了一系列可行的政策来强化国家的经济活力，包括但不限于发行新货币、省级财政独立、税收改革和金融机构改革，但所有这一切的施行都需要时间。"
 QIE_Financial_Reform_Ongoing_idea: "财政改革进行中"
 QIE_Financial_Reform_idea: "完善的财政改革"
 QIE_Modern_Legal_System: "现代化司法制度"
 QIE_Modern_Legal_System_desc: "一个完整的法律法规和独立的司法机构只是现代法律体系的一部分，但它们将成为其主要支柱。如果现代法治能够在中国社会中扎根，并且帮助长期受到压迫的人民伸张正义的话，我们就可以杜绝法律渎职和滥用的行为。"
 QIE_Modern_Legal_System_Reform_Ongoing_idea: "司法制度改革进行中"
 QIE_Restructure_The_Bureaucracy: "重组官僚体系"
 QIE_Restructure_The_Bureaucracy_desc: "三四十年代见证了多个模范省的行政成功，但中国的人口数量决定了我们需要一支远超省级规模且高效的官僚团体来保证整个国家的正常运转。从省到中央，我们要建立、扩充、重组一套完整的官僚系统。"
 QIE_Restructure_The_Bureaucracy_idea: "高效行政体制"
 QIE_Public_Works_Projects: "公共项目工程"
 QIE_public_works_tt: "我们将根据§H建设方略§!解锁£decision_icon_small §H公共工程决议§!"
 QIE_Public_Works_Projects_desc: "联省派多年来构思了一套公共项目工程计划，并声称这些计划是任何经济现代化或复苏计划的基石。改善欠发达地区的基础设施将帮助我们直达中国那些封闭的角落，改善当地人民群众的生活。"
 QIE_crack_down_on_radicals_and_corruption: "严打腐败和极端分子"
 QIE_crack_down_on_radicals_and_corruption_desc: "来自内外的威胁正虎视眈眈的威胁着失而复得的民国。我们必须严打内部的腐败、反动分子，并对外部的极端势力和激进分子保持高压。当然，这一切都已经是有法可依的了。"
 QIE_crack_down_on_radicals_and_corruption_Bonus_tt: "\n§G是否曾推动多元发展，将决定我们获得何种效果§!"
 QIE_crack_down_on_radicals_and_corruption_idea: "整风严打"
 QIE_crack_down_on_radicals_and_corruption_alt_idea: "强化建制民主"
 QIE_First_National_Election: "联邦共和国"
 QIE_First_National_Election_desc: "随着与联省派的合作进一步加深，中国将被转变为一个联邦制共和国，地方将拥有更多的权力。"
 QIE_let_the_five_banner_flag_fly: "五色旗飘扬！"
 QIE_let_the_five_banner_flag_fly_desc: "辛亥先烈最终再次沉冤得昭！再也没有天潢贵胄可以盘剥中国百姓！随着北洋政府真正重建，总裁和大帅可以放开手脚统治，不必再向小皇帝三跪九叩了。这也为中国的共和民主指明了真正的道路。"
 QIE_beiyangs_favourite_son: "北洋政府的宠儿"
 QIE_beiyangs_favourite_son_desc: "外交系长久以来都是北洋政府唯一没有腐败和裙带关系的大动脉，也是那些长期奋斗在国家关系最前沿，为北京方面确保席位与合法性的筚路蓝缕的爱国者们的希望。正因如此，外交部也成为了政府声誉的中流砥柱。"
 QIE_flourish_of_the_diplomatic_corps: "外交系欣欣向荣"
 QIE_flourish_of_the_diplomatic_corps_desc: "外交系里出了不少伟大的民事官员，顾维钧和颜惠庆就位列其中，这些人可谓我们掌控下最具力量的“黑衣宰相”。只要动用他们的才学，我国无论在租界问题上抱持怎样的立场，都能与外国强权建立积极的关系。外交人才们总是在民国最急需之时扶大厦于将倾，这次也不过是外交部的又一次胜利而已。"
 QIE_the_fragrant_one_lacks_judgement_still: "“寄意寒星荃不察”"
 QIE_the_fragrant_one_lacks_judgement_still_desc: "卑劣的宗社党竟企图用所谓的“宣统维新”给直系来个擒贼先擒王。如今满人的支持被彻底打垮，极少数无组织的残余分子只要稍加劝诱也会弃暗投明。而另一头的帝国宪政会是个广泛的联盟，因此本质上也相当脆弱。只要对其中的小团体示好，促使宪政会彻底破裂也手到擒来。"
 QIE_government_by_friends: "友人政府"
 QIE_government_by_friends_desc: "尽管已经穿上了北洋官员、议员和士绅的皮囊，直系的关系网却仍然在蓬勃发展。目之所及，津保派和洛阳派的触手历历可见。虽然许多人都批评这是搞裙带关系，但我们不过是金盆洗手做了真正合法的政治家。话说回来，也只有我们才有能力领导民国。"
 QIE_coopting_nationalist_rhetoric: "吸纳民族主义言论"
 QIE_coopting_nationalist_rhetoric_desc: "青年党的共和主义、民族主义和高效行事着实令人敬佩。在国民党留下空缺后，他们便趁势而起，取得了国会中的大量席位。向他们伸出合作之手，同时借鉴他们的方法，这样我们就可以共同建立一个新生而统一的民国。"
 QIE_nationalising_noble_estates: "国有化勋贵资产"
 QIE_nationalising_noble_estates_desc: "复辟帝制之后，许多满族人与保皇派攫取了巨大的财富，并利用这些资产不断扩张他们在中华民族各要害产业的影响力。现在，他们头上那顶名为君主制的保护伞已经土崩瓦解，轮到我们收缴他们的财富了。在恢复中华的同时，我们也将利用强制征收的手段夺回属于我们自己的工厂。"
 QIE_shoring_up_financial_centres: "巩固金融中心"
 QIE_shoring_up_financial_centres_desc: "在八省崩溃和未遂的满清复辟造成的动乱之下，政府也无心关注眼下严峻的工业状况。斟酌各个选择之后，王克敏总长建议政府给予我们银行的中心——中国银行以支持，令其再度振兴。"
 QIE_xinhais_legacy: "辛亥传承"
 QIE_xinhais_legacy_desc: "辛亥革命党人的梦想与愿望虽然被暂时搁置，但并从未被遗忘，还在新中国得以蓬勃地发展。1928年宣统复辟不过是争取援助的权宜之计，这种状况不会永远持续下去。卿云之下，惟愿五族共和，万民自由，负责任的“好人政府”亦得建立。"
 QIE_coop_rkmt: "与国民党右派合作"
 QIE_coop_rkmt_desc: ""
 QIE_tridem_accept: "接纳三民主义"
 QIE_tridem_accept_desc: ""
 QIE_moscow_committee: "邀请莫斯科委员会"
 QIE_moscow_committee_desc: ""
 QIE_sun_legacy: "实现总理遗教"
 QIE_sun_legacy_desc: ""
 
 QIE_national_army: "整顿帝国军队" 
 QIE_national_army_desc: "迄今为止，虽然我军取得了辉煌的战果，但还远不足以称之符合大国标准。要想完成解放，团结人民并驱逐帝国主义者，我们必须用新获得的资源来进行军事现代化并扩大军队规模。但我们绝不会忘记我军在安靖国家的征途中保持的勇气！"
 QIE_build_a_navy: "扩大水师规模"
 QIE_build_a_navy_desc: "数个世纪以来，中国都是海上强国，但在被日本和西方侵略者耻辱性的击败后，我们的民族自豪感受到了打击。军阀时代长期的陆上战斗没给维持一支符合大国身份的海军多少资源，要想保卫我国辽阔的海岸线，我们得赶快做些什么。"
 QIE_dockyards: "船坞扩建计划"
 QIE_dockyards_desc: "由于遭受过甲午的惨败，鲜有人认为直隶扩展水师的规模，但帝国如今再度统一，我们现在有能力建立一支国家海军，作为改进和现代化海军的第一步，让我们开足马力，建设新的造船厂！"
 QIE_coastal_forts: "未雨绸缪"
 QIE_coastal_forts_desc: "我们应注意到，如今守卫着海岸线的防御工事已经过时或荒废了，作为海军现代化尝试的一部分，我们正起草一项计划，为相关建筑人员及工程师拨款，用以研究雷达技术及实现岸防工事的现代化，相信这些能够帮助我们守卫中国的海岸线，抵御潜在的登陆入侵行动。"
 QIE_national_air_force: "扩建保定航校"
 QIE_national_air_force_desc: "虽然我们就任京兆期间有过各种航空项目，但吴曹二人都没有发展一支可堪其用的空军的资源。要想跟上军事理论进步的步伐，我们必须建立一支能统御长空的空军力量。而且，这在扫清残存军阀的战斗中也是一支强大的力量。"
 QIE_utilise_arsenals: "利用军阀兵工厂"
 QIE_utilise_arsenals_desc: "随着我军在统一中华之路上高歌猛进，各省军阀扔下的军工厂和武器库现已入我手中。这些年里他们如阎锡山那样建立了自己的武器生产线。我们可以改善并利用这些设备以便为国家所用，而不是表现得像个饥渴的地方军阀头子。"
 QIE_chinese_marines: "帝国海军陆战队"
 QIE_chinese_marines_desc: "尽管我们国家缺少航海传统，但中国的第一支海军陆战队可以追溯至1911年武昌起义期间，最初被称为“海军警卫队”，随后在1914年改制成了更为标准的海军陆战队，但从那往后，建立并维持现代化师级海军陆战队的尝试皆以失败告终，如今让我们重拾这份遗产，创建清国海军陆战队，以此保卫海岸！"
 QIE_new_methods: "拥抱新战术"
 QIE_new_methods_desc: "军阀时代的可悲之处在于，由于所有的预算被用于维持地方性军队，国家层面上一定规模的现代化军队一直无法组建。自上一次在自强运动中对军队进行全国性改革以来，战争形式已经发生了很大的变化，机械化部队取代了旧式骑兵。我们可不能在这场竞赛中被落在后面。"
 QIE_future_of_war: "未来的战争形势"
 QIE_future_of_war_desc: "“兵贵神速”，战争的形式也随着时代的进步而改变。飞机、坦克和战舰固然光鲜亮丽，但我们在追寻未来战争模式的过程中绝不能忽视其他关键领域的发展。军事计划、兵种配合和作战学说对现代战争来说必不可少，随着保定军校新一天的到来，我们必须谨记在心。"
 QIE_fortify_coastal_bulwark: "加固沿岸堡垒"
 QIE_fortify_coastal_bulwark_desc: "中国领土辽阔，这意味着敌军很可能经海路入侵我国而不是直接经陆路。沿海地区在经济和政治方面的重要性无需二言，我们要在沿岸修建碉堡等防御设施，做好准备抵御敌军入侵。"
 QIE_new_navy_new_traditions: "新海军，新传统"
 QIE_new_navy_new_traditions_desc: "传统在生活中占据着重要的地位，海军舰队中的传统更是重中之重。尽管如今中国海军规模萎缩，但其仍然非为各个相互竞争的地区性小山头。我们将稳步在海军中推进工作，结合全国海军的经验，将其融合成为一支中国海军。此即胜利之道。"
 QIE_advanced_coastal_defensive_plans: "先进岸防方案"
 QIE_advanced_coastal_defensive_plans_desc: "历史上的战争表明，在侵略者面前，中国漫长的海岸线无疑是个重大的软肋。虽然陆上防卫属于陆军的作战范畴，但海军舰队也有责任将敌人挡在海岸之外，阻拦胆大妄为的侵略者。凭借早期预警体系和灵活多变的战术，我们的海军就能在海岸边出其不意，打击出现在那里的敌人。"
 QIE_integrate_naval_air_coordination: "一体化海空协同"
 QIE_integrate_naval_air_coordination_desc: "海军航空兵在过去数十年中取得了长足的进步。虽然我国的空军和海军都实力有限，海航建设或许为时过早，但与更成熟的其他国家相比，我国的优势在于没有根深蒂固的理论模式，因而我们能够采用更灵活的发展方式，将海军和空军结合起来，建设出足以致命的打击力量。"
 QIE_undersea_warfare: "海底战争"
 QIE_undersea_warfare_desc: "在最漆黑的深海大洋，致命的潜艇中潜伏着无畏的勇士。在上次大战中，潜艇战术尚处于起步阶段，然而自此以后，潜艇已然成为傲慢的大舰队与受压迫国家海局之间的平衡器。我们将充分发挥潜艇战术，突袭为其登陆入侵部队提供给养的补给船只，以及脆弱的商船队。"
 QIE_fleet_of_the_republic: "宏伟舰队"
 QIE_fleet_of_the_republic_desc: "中国需要一支保卫海岸的新海军。现如今，海军投资逐步增长，我们正在夺回曾经失去的岁月，往日分裂凋零的中国海军正渐渐浴火重生。新舰队已经成形，足以对付曾经的敌人，而不是别无选择，只得避敌锋锐。中国离再次成为海上强国还有很长的路要走，但启明星已然升起！"
 QIE_protect_the_three_seas: "保卫三海"
 QIE_protect_the_three_seas_desc: "中国的命运不仅在陆地，也在环绕大陆的三海之上。全亚洲还有如此多的人民渴望着摆脱殖民统治，唯有建设一支足以挑战压迫者的舰队，中国才能重夺在亚洲的领导地位。陆军在一路奋进，而海军也将一路征战，给予他们支援，以保护我们伟大的国家免受侵略。"
 QIE_chinese_grand_fleet: "中国大舰队"
 QIE_chinese_grand_fleet_desc: "我们不会仅满足于渺小的炮艇和过时的巡洋舰。真正的舰队需要主力舰，它们能够撕碎敌方护航舰、轰击敌方防御工事。如果我们确实想将海军野望付诸实践，就必须愿意投资属于世界强权的巨舰大炮。我们正处于太平洋新时代的黎明，愿我们位于时代中心。"
 QIE_expand_airbases: "扩展航空基础设施"
 QIE_expand_airbases_desc: "中国广袤的农村可以为我们不断发展的航空工业提供土地，这些土地不仅可以用来容纳军用飞机，还可以用于民用运输和旅行。在中华民族和军队现代化的进程中，我们应当努力扩大军用空军基地和军事工业，以增强国家实力。"
 QIE_imitiate_foreign_air_designs: "模仿外国飞机设计"
 QIE_imitiate_foreign_air_designs_desc: "尽管我们在本地飞机生产方面尽了最大努力，但很明显，如果中国想赶上世界其他国家，我们就应该模仿世界各地成功的战斗机设计。我们将派遣顾问和工程师前往与我们合作过的国家，让他们能够带回必要的专业知识和设计，帮助生产新型现代化飞机。"
 QIE_invite_foreign_aviation_instructors: "邀请外国航空教官"
 QIE_invite_foreign_aviation_instructors_desc: "虽然清政府是中国为数不多拥有少量空军的势力之一，但鉴于整个中国都已收入我们囊中——很明显，我们的飞行员训练不足，制度早已过时，飞机性能不佳。为此我们应邀请外国航空教官、外籍人士以及退役军人来华担任空军顾问，以帮助加强我们的力量。"
 QIE_encourage_attack_aviation: "鼓励强击航空兵"
 QIE_encourage_attack_aviation_desc: "正如世界各地、尤其是世界大国之间的现代战争所展示的一样，空军的未来在于与地面部队协同作战，以前所未有的火力密度发起决定性的突破性攻势。我国在欧洲的飞行学员亲眼见识了攻击轰炸机在欧战中的作用，并渴望分享他们的见闻。"
 QIE_long_range_supremacy: "长程空中霸权"
 QIE_long_range_supremacy_desc: "鉴于中国幅员辽阔，我们在空中理论方面的重点自然应该集中在轰炸机和战斗机的远程能力上，以使它们能够覆盖更大的范围和领土，提供赢得现代战争所需的空中力量。"
 QIE_dive_bombing_focus: "空地一体化"
 QIE_dive_bombing_focus_desc: "欧洲和亚洲的经验表明，真正的战争要靠在地面部队和空军协同作战才能求胜，重点是近距空中支援机，这些轰炸机能比速度较慢的远程轰炸机更精确、更迅捷地打击敌人的后勤和补给。为了成功实现军队现代化，我们应该采用这种模式来满足日益增长的空军需求。"
 QIE_roc_air_force: "帝国空军"
 QIE_roc_air_force_desc: "从前各省区和全国政府都未能成功建立一支真正现代化和广泛的空军，无法保卫我们广阔的天空和领土。如今，我们为现代化和训练一支新的强大的国家空军所做的努力终于取得了成果，我们终于可以向世界宣布，一支为子孙后代而战的、全新且强大的帝国空军正式成立。"
 QIE_enshrine_the_fighter_cult: "推行空中王牌崇拜"
 QIE_enshrine_the_fighter_cult_desc: "抗日战争期间，来自全国各地的中国飞行员在技术和技能均处劣势的逆境中，正面抗击了强大的敌人，这让我们国家产生了一种“航空崇拜”。王牌飞行员将被奉为不朽的英雄和新中国的模范爱国者，以供全国人民瞻仰。"
 QIE_airborne_special_forces: "空降特种部队"
 QIE_airborne_special_forces_desc: "在现代战争的世界里，勇者必胜。为此我们挑选了一批最适合的精锐士兵，组建了一支实验部队，他们可以按当代伞兵的战法，越过敌占区空降到敌军后方。这种策略比较激进，伤亡是可以预料的，但是，狭路相逢勇者胜！"
 QIE_renovate_military_academies: "翻新军事学院"
 QIE_renovate_military_academies_desc: "黄埔、保定……这些著名军事院校的名字对于每位中国公民来说都如雷贯耳，一代保家卫国、救亡图存的爱国英雄都从这些学校中走出。随着山西领导的军队最近统一了中国，我们需要确保这些院校得到翻新和现代化，以吸取最近战争中的教训。"
 QIE_the_modern_chinese_soldier: "现代中国士兵"
 QIE_the_modern_chinese_soldier_desc: "军阀的部队早已因其无能和装备落后而在世界上臭名昭著。作为我们在直奉战争期间创立现代化军队计划的一部分，我们为目前树立现代化中国军人形象的努力而感到自豪。这些配备新式步枪，充满革命精神的新中国步兵将会屹立于世界！"
 QIE_rapid_militarisation: "快速军事化"
 QIE_rapid_militarisation_desc: "自1911年以来，中国再次拥有了强大的中央政府，在经济终于恢复后，新的帝国政府开始推进海军与武器生产的快速军事化进程，以期让中国武装力量的数量和质量赶上世界其他国家。"
 QIE_modern_officer_corps: "现代军官团"
 QIE_modern_officer_corps_desc: "任何军队的未来都取决于其军官队伍，他们能够将理性、责任感和爱国主义灌输给每个普通士兵。如果新近统一的大清帝国想要赶上西方军队水平，那就必须投入大量精力以重组国家的军官队伍，使其成为一支现代化的精英部队。"
 QIE_broadfront_operations_capacity: "宽大战线作战能力"
 QIE_broadfront_operations_capacity_desc: "我们对中国国军进行了改革与扩编、使它比以往任何时候都庞大，现如今，我军可以在更为漫长的战线上组织更大的军事行动。我军侦察部队得到改良、后勤和空军方面的经验亦有所增加，所能承担的会战规模得到了提升。"
 QIE_expand_national_security_apparatus: "扩展国家安全机构"
 QIE_expand_national_security_apparatus_desc: "黑色星期一后动荡不安的年月里，公安局在北京组织成立，在维护秩序和稳定立下汗马功劳。现在，中国大地归于一统，我们应该利用保安局这一有力武器，打击国内外对中国国家安全的威胁。"
 QIE_man_national_army: "整顿帝国军队" 
 QIE_man_national_army_desc: "迄今为止，虽然我军取得了辉煌的战果，但还远不足以称之符合大国标准。要想完成解放，团结人民并驱逐帝国主义者，我们必须用新获得的资源来进行军事现代化并扩大军队规模。但我们绝不会忘记我军在安靖国家的征途中保持的勇气！"
 QIE_man_build_a_navy: "扩大水师规模"
 QIE_man_build_a_navy_desc: "数个世纪以来，中国都是海上强国，但在被日本和西方侵略者耻辱性的击败后，我们的民族自豪感受到了打击。军阀时代长期的陆上战斗没给维持一支符合大国身份的海军多少资源，要想保卫我国辽阔的海岸线，我们得赶快做些什么。"
 QIE_man_dockyards: "船坞扩建计划"
 QIE_man_dockyards_desc: "由于遭受过甲午的惨败，鲜有人认为直隶扩展水师的规模，但帝国如今再度统一，我们现在有能力建立一支国家海军，作为改进和现代化海军的第一步，让我们开足马力，建设新的造船厂！"
 QIE_man_coastal_forts: "未雨绸缪"
 QIE_man_coastal_forts_desc: "我们应注意到，如今守卫着海岸线的防御工事已经过时或荒废了，作为海军现代化尝试的一部分，我们正起草一项计划，为相关建筑人员及工程师拨款，用以研究雷达技术及实现岸防工事的现代化，相信这些能够帮助我们守卫中国的海岸线，抵御潜在的登陆入侵行动。"
 QIE_man_national_air_force: "扩建保定航校"
 QIE_man_national_air_force_desc: "虽然我们就任京兆期间有过各种航空项目，但吴曹二人都没有发展一支可堪其用的空军的资源。要想跟上军事理论进步的步伐，我们必须建立一支能统御长空的空军力量。而且，这在扫清残存军阀的战斗中也是一支强大的力量。"
 QIE_man_utilise_arsenals: "利用军阀兵工厂"
 QIE_man_utilise_arsenals_desc: "随着我军在统一中华之路上高歌猛进，各省军阀扔下的军工厂和武器库现已入我手中。这些年里他们如阎锡山那样建立了自己的武器生产线。我们可以改善并利用这些设备以便为国家所用，而不是表现得像个饥渴的地方军阀头子。"
 QIE_man_chinese_marines: "帝国海军陆战队"
 QIE_man_chinese_marines_desc: "尽管我们国家缺少航海传统，但中国的第一支海军陆战队可以追溯至1911年武昌起义期间，最初被称为“海军警卫队”，随后在1914年改制成了更为标准的海军陆战队，但从那往后，建立并维持现代化师级海军陆战队的尝试皆以失败告终，如今让我们重拾这份遗产，创建清国海军陆战队，以此保卫海岸！"
 QIE_man_new_methods: "拥抱新战术"
 QIE_man_new_methods_desc: "军阀时代的可悲之处在于，由于所有的预算被用于维持地方性军队，国家层面上一定规模的现代化军队一直无法组建。自上一次在自强运动中对军队进行全国性改革以来，战争形式已经发生了很大的变化，机械化部队取代了旧式骑兵。我们可不能在这场竞赛中被落在后面。"
 QIE_man_future_of_war: "未来的战争形势"
 QIE_man_future_of_war_desc: "“兵贵神速”，战争的形式也随着时代的进步而改变。飞机、坦克和战舰固然光鲜亮丽，但我们在追寻未来战争模式的过程中绝不能忽视其他关键领域的发展。军事计划、兵种配合和作战学说对现代战争来说必不可少，随着保定军校新一天的到来，我们必须谨记在心。"
 QIE_man_fortify_coastal_bulwark: "加固沿岸堡垒"
 QIE_man_fortify_coastal_bulwark_desc: "中国领土辽阔，这意味着敌军很可能经海路入侵我国而不是直接经陆路。沿海地区在经济和政治方面的重要性无需二言，我们要在沿岸修建碉堡等防御设施，做好准备抵御敌军入侵。"
 QIE_man_new_navy_new_traditions: "新海军，新传统"
 QIE_man_new_navy_new_traditions_desc: "传统在生活中占据着重要的地位，海军舰队中的传统更是重中之重。尽管如今中国海军规模萎缩，但其仍然非为各个相互竞争的地区性小山头。我们将稳步在海军中推进工作，结合全国海军的经验，将其融合成为一支中国海军。此即胜利之道。"
 QIE_man_advanced_coastal_defensive_plans: "先进岸防方案"
 QIE_man_advanced_coastal_defensive_plans_desc: "历史上的战争表明，在侵略者面前，中国漫长的海岸线无疑是个重大的软肋。虽然陆上防卫属于陆军的作战范畴，但海军舰队也有责任将敌人挡在海岸之外，阻拦胆大妄为的侵略者。凭借早期预警体系和灵活多变的战术，我们的海军就能在海岸边出其不意，打击出现在那里的敌人。"
 QIE_man_integrate_naval_air_coordination: "一体化海空协同"
 QIE_man_integrate_naval_air_coordination_desc: "海军航空兵在过去数十年中取得了长足的进步。虽然我国的空军和海军都实力有限，海航建设或许为时过早，但与更成熟的其他国家相比，我国的优势在于没有根深蒂固的理论模式，因而我们能够采用更灵活的发展方式，将海军和空军结合起来，建设出足以致命的打击力量。"
 QIE_man_undersea_warfare: "海底战争"
 QIE_man_undersea_warfare_desc: "在最漆黑的深海大洋，致命的潜艇中潜伏着无畏的勇士。在上次大战中，潜艇战术尚处于起步阶段，然而自此以后，潜艇已然成为傲慢的大舰队与受压迫国家海局之间的平衡器。我们将充分发挥潜艇战术，突袭为其登陆入侵部队提供给养的补给船只，以及脆弱的商船队。"
 QIE_man_fleet_of_the_republic: "宏伟舰队"
 QIE_man_fleet_of_the_republic_desc: "中国需要一支保卫海岸的新海军。现如今，海军投资逐步增长，我们正在夺回曾经失去的岁月，往日分裂凋零的中国海军正渐渐浴火重生。新舰队已经成形，足以对付曾经的敌人，而不是别无选择，只得避敌锋锐。中国离再次成为海上强国还有很长的路要走，但启明星已然升起！"
 QIE_man_protect_the_three_seas: "保卫三海"
 QIE_man_protect_the_three_seas_desc: "中国的命运不仅在陆地，也在环绕大陆的三海之上。全亚洲还有如此多的人民渴望着摆脱殖民统治，唯有建设一支足以挑战压迫者的舰队，中国才能重夺在亚洲的领导地位。陆军在一路奋进，而海军也将一路征战，给予他们支援，以保护我们伟大的国家免受侵略。"
 QIE_man_chinese_grand_fleet: "中国大舰队"
 QIE_man_chinese_grand_fleet_desc: "我们不会仅满足于渺小的炮艇和过时的巡洋舰。真正的舰队需要主力舰，它们能够撕碎敌方护航舰、轰击敌方防御工事。如果我们确实想将海军野望付诸实践，就必须愿意投资属于世界强权的巨舰大炮。我们正处于太平洋新时代的黎明，愿我们位于时代中心。"
 QIE_man_expand_airbases: "扩展航空基础设施"
 QIE_man_expand_airbases_desc: "中国广袤的农村可以为我们不断发展的航空工业提供土地，这些土地不仅可以用来容纳军用飞机，还可以用于民用运输和旅行。在中华民族和军队现代化的进程中，我们应当努力扩大军用空军基地和军事工业，以增强国家实力。"
 QIE_man_imitiate_foreign_air_designs: "模仿外国飞机设计"
 QIE_man_imitiate_foreign_air_designs_desc: "尽管我们在本地飞机生产方面尽了最大努力，但很明显，如果中国想赶上世界其他国家，我们就应该模仿世界各地成功的战斗机设计。我们将派遣顾问和工程师前往与我们合作过的国家，让他们能够带回必要的专业知识和设计，帮助生产新型现代化飞机。"
 QIE_man_invite_foreign_aviation_instructors: "邀请外国航空教官"
 QIE_man_invite_foreign_aviation_instructors_desc: "虽然清政府是中国为数不多拥有少量空军的势力之一，但鉴于整个中国都已收入我们囊中——很明显，我们的飞行员训练不足，制度早已过时，飞机性能不佳。为此我们应邀请外国航空教官、外籍人士以及退役军人来华担任空军顾问，以帮助加强我们的力量。"
