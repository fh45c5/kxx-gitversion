 qieygd.8.t:0 "年事已高的天师"
 qieygd.8.d:0 "运营一个千年教派已属不易，而作为唯一至尊统治整个帝国更是难上加难，这份重担终于压垮了我们敬爱的天帝。张天然，一贯道第十八代师尊、月慧菩萨济公活佛转世、我们的国父，如今因积劳成疾去世。臣工们已开始筹备隆重的国葬仪典，并讨论起新帝的人选。此刻，一切只能听凭天意了。"
 qieygd.8.a:0 "万国道德会的王凤仪成为了下一任皇帝。"
 qieygd.8.b:0 "道德学社的段正元成为了下一任皇帝。"
 qieygd.8.c:0 "他的妻子孙素珍现在成为了统治中国的第一位女皇。"
 qieygd.8.e:0 "同善社的彭汝尊成为了下一任皇帝。"
 qieygd.8.f:0 "天德教的萧昌明成为了下一任皇帝。"
 qieygd.12.t:0 "鸠占鹊巢者"
 qieygd.12.d:0 "实际上，王凤仪并无资格领导万国道德会。万国道德原是山东历城县人江钟秀偕其子江希张在山东济南成立的，但1925年江钟秀逝世后王凤仪设法排挤了江希张，夺取了协会的领导权，江希张随后退出了协会的相关工作，潜心研究古籍与化学工业。然而，近些日子某些传闻生成江希张正打算推翻现政权，并且已经得到了社会主义者与直系军阀残余势力的支持。我们应该怎么做？"
 qieygd.12.a:0 "防患于未然！"
 qieygd.12.b:0 "不过一孺子耳。"
 qieygd.13.t:0 "无神的喜剧"
 qieygd.13.d:0 "我们忽视江希张的行为遭致了严重的后果。当王凤仪前往首都附近的农村考察时，这群无神论分子突袭了首都，随后立刻逮捕了王凤仪与绝大部分政府官员。看起来，邪教在中国的统治已经结束了。"
 qieygd.13.a:0 "民主科学将在封建迷信的尸体上生根发芽！"
