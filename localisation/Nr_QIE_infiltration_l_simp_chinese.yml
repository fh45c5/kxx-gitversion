 QIE_legitimacy_of_the_monarchy_har_wu: "帝制法统：§g恩威并施§!"
 QIE_legitimacy_of_the_monarchy_har_wu_desc: "大清国祚表面上已然延绵三百余载，可如今君臣伦常却已黯然失色，积重难返。在中国公民，无论是官僚、工人还是农民眼中，一众暴君僭主怀揣着改革的承诺来了又去，到头来一切却不过是原地踏步。大清奉天承命，在名义上宣称了华夏四境的法统，可却只是带着国家步步走向灭亡。若是还想让百姓信服君君臣臣之纲纪，那首先便要把他们从国乱岁凶、纷争不息的境遇中解救出来。同时也要让百姓相信一件事——清虽旧邦，其命维新。\n\n随着和谐社团的全面执掌，旧有的政治派别与社会团体被逐步纳入一个庞大而紧密的体制之中。国会仍在运作，选举仍在举行，但一切程序皆在严密设计与操控之下，使得权力流转看似有序却实则牢不可破。报刊社论、工会活动与地方议事皆被巧妙引导，反对声浪被吸收、稀释甚至转化为政权的合法性来源。表面上是多元协商与形式民主，实质上却是精心构筑的制度专制，使清王朝在虚与实之间稳固统治，营造出一种“众口一词、长治久安”的和谐假象。"
 QIE_legitimacy_of_the_monarchy_har_cao: "帝制法统：§g恩威并施§!"
