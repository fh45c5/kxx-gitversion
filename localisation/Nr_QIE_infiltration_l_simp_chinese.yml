 QIE_defence_commission_desc: "“诸省防务专署”简称防署，是一个新近成立的政府机构，用以赋权玉帅统筹“一切关乎各省防务之事宜”。而玉帅很快就会动用这些权力，确保每个中国百姓都能生活在安全的省份中。"
 QIE_defence_commission_2: "防务专署：§g权力扩大§!"
 QIE_defence_commission_2_desc: "“诸省防务专署”简称防署，是一个新近成立的政府机构，用以赋权玉帅统筹“一切关乎各省防务之事宜”。该委员会近期在对内对外的权力上都有所托大，以确保玉帅在内务问题上有着强大的权力。当然了，这一切只是为了各省的安定。"
 QIE_defence_commission_3: "防务专署：§P法令统治§!"
 QIE_defence_commission_3_desc: "“诸省防务专署”简称防署，是一个新近成立的政府机构，用以赋权玉帅统筹“一切关乎各省防务之事宜”。其涵盖的权力范围十分广泛，让玉帅可以有效地以法令进行统治，并使其个人意愿得以充分执行。就连国会这样的橡皮图章也可有可无了。"
