 QIE_a_new_beiyang_focus: "新北洋派"
 QIE_a_new_beiyang_focus_desc: "崭新的民国政府已经实现了旧民国的夙愿，重新统一了中国。如今大势已定，我们将在北洋先贤打下的基础上集思广益，权衡各路政见的优劣。虽然这些政见未必相互矛盾，但我们在偏好团体与政策倾向方面做出的决策，将为新生的民国政府奠定基调。"
 QIE_listen_to_independent_voices_focus: "自由民主之我见"
 QIE_listen_to_independent_voices_focus_desc: "胡适声称自己要启迪民智、以理性、客观、中立的视角评判我们的政府。这些公共知识分子接触能为提供一个在北洋政府体制内进行政治改革的机会。"
 QIE_herding_the_republicans_focus: "驱策共和派人士"
 QIE_herding_the_republicans_focus_desc: "中国共和派的首要问题是缺乏团结和专注，他们从未组织成一个反对派，即使掌权，也没有足够的凝聚力来进行变革。国民大会（国会）中可能充满了伟大的思想家，但要真正将他们的思想用于造福国家，需要我们发挥良好的领导作用，劝说他们走出象牙塔，迈入现实世界。"
 QIE_entreat_the_endeavor_society_focus: "利用公知影响"
 QIE_entreat_the_endeavor_society_focus_desc: "《努力周报》汇集了政坛中各路进步派知识分子，胡适、蔡元培、李大钊、梁漱溟、王宠惠等人均对其有所贡献。他们的意见并不完全一致，但都呼吁提升政府透明度、做好长远规划，以便更好地治理国家。我们必须择优采纳这批精英智囊的意见。"
 QIE_strengthen_the_legislature_focus: "强化立法机关"
 QIE_strengthen_the_legislature_focus_desc: "长期以来，北京的军阀和强人的政治旋转门使得人们对国民大会（国会）视而不见，将其视为另一个可以被贿赂、恐吓且塞满了前朝余孽的机构。虽然批评者可能会说，要改变这种状况，依然任重道远，但我们可以考虑立法委员的意见并尊重他们的审议结果，朝着正确的方向迈出第一步。"
 QIE_stewarding_the_national_recovery_focus: "统筹国家复兴"
 QIE_stewarding_the_national_recovery_focus_desc: "复兴党的资深政治家们知道，要想在中国有所作为，改革者必须在要求变革与尊重当权者之间取得平衡。他们寄希望于大总统接受他们一系列“合理”改革方案，而非将其视作威胁，进而稳定民国。"
 QIE_currying_international_exports_focus: "欢迎国际出口"
 QIE_currying_international_exports_focus_desc: "在“百年国耻”之后，如何处理国际贸易一直是个棘手的问题。启动现代化需要外国资金，但经过几代人的不平等谈判后，外国控制是不能容忍的。我们将开始一个有指导性的外贸过程，围绕工业出口建设我们的经济，由政府充当中间人，防止居心不良的外国人进行剥削。"
 QIE_domestic_infrastructure_projects_focus: "国内基建项目"
 QIE_domestic_infrastructure_projects_focus_desc: "在饱受战争蹂躏的中国，重建实体与人事的基础设施，修建新的铁路和公路，将中国内陆地区与城市连接起来，是我们实现国家复兴的一个重要方面。凭借相对工业化的东北所提供的在管理项目上的便捷而专业的经验，以及与志同道合的合作伙伴建立的联系，我们可以为经济复兴创造条件。"
 QIE_growing_a_chinese_middle_class_focus: "培养中国中产阶级"
 QIE_growing_a_chinese_middle_class_focus_desc: "由受过教育的专业人士与技术工人组成的强大的中产阶级，乃是一个国家在20世纪得以经济繁荣和政治稳定的基础。通过在政治、经济和教育领域的审慎决策，我们可以培养出雄心勃勃、锐意进取、追求比前人更好生活的新一代年轻人，他们将带领我们的民国进入一个新时代！"
 QIE_setting_the_groundwork_for_democracy_focus: "民主奠基石"
 QIE_setting_the_groundwork_for_democracy_focus_desc: "民主宪政党背后的智囊团注意到了我们对晏阳初理念的积极回应，以及我们在“十年计划”中成功实施这些理念的情况。他们希望进一步投资这些改革措施，这将让我们的国家稳步实现民主化，在我们的领导下，这些改革已取得了一系列成功。"
 QIE_investing_in_education_focus: "投资教育"
 QIE_investing_in_education_focus_desc: "普及教育我们是雄心勃勃计划的基础，它常与经济、政治甚至军事交织在一起。消除文盲、扩大高等教育的入学机会对我们的议程至关重要，也深得许多前帝国宪政会成员的欢迎，其中许多人是受过国外教育的知识分子，他们将从中受益。承诺实施这项计划将确保他们重返民主宪政党。"
 QIE_the_rural_revival_focus: "乡村复兴"
 QIE_the_rural_revival_focus_desc: "晏阳初是一位杰出的改革派知识分子，他对国家政治避而不谈，而是专注于他所倡导的事业：复兴中国乡村。他曾与梁启超关系密切，并与梁启超的政党保持着某种联系，该党派最终演变为民主宪政党。通过更多的资金和政治投入，我们将从基层开始建设一个全新的中国！"
 QIE_anti_corruption_efforts_focus: "反腐工作"
 QIE_anti_corruption_efforts_focus_desc: "要求打击腐败和裙带关系的呼声充斥着整个政坛，但在军阀治下的中国，这些人往往很难打破根深蒂固的恩庇网络。虽然要让公务员系统不再需要贿赂或恩惠来润滑其运转还需要很长时间，但我们至少可以通过更好的财务监管和问责机制来消除腐败丑闻和不受约束的盗贼行为。"
 QIE_solicit_southern_compromises_focus: "共和同盟再崛起"
 QIE_solicit_southern_compromises_focus_desc: "与中国数千年的历史相比，军阀混战的三四十年时间看似微不足道，但其影响不可低估。我们，南方同胞多年来形成了自己的政治传统，对于改革有着许多不同的想法。只有将南北双方的想法融合，我们才能实现统一的、民主的民国。"
 QIE_reconciling_north_south_focus: "调和南北分歧"
 QIE_reconciling_north_south_focus_desc: "中国被分裂为南北两个政府是1911年最糟糕的后果之一。从那时起，北方派经常与南方派处于对立，即使其他派系如雨后春笋般出现，但根本上的敌意仍然存在。战场上的胜利带来了统一，但真正的统一仍需整合双方的思想。"
 QIE_commit_to_constitutionalism: "保卫宪政"
 QIE_commit_to_constitutionalism_desc: "全国各地的改革者普遍呼吁中国领导人遵守宪法，尤其是在军阀将领们无视他们自己起草的文件的情况下。我们需要对现行的临时宪法进行修订，听取不同党派和备受尊敬的资深政治家在内的各方意见，将为更美好的未来奠定合法性基础。"
 QIE_embrace_federalist_principles_focus: "接纳联省原则"
 QIE_embrace_federalist_principles_focus_desc: "虽然几乎所有的中国派系都采纳了自下而上改革中国的方法，但各省所扮演的角色却因军阀主义和对中央权威的挑战而备受争议。不过，既然我们已经建立了一个强大的中央政府，我们当然可以将一些权力下放给各省，而非垄断权力。"
 QIE_entrench_northern_primacy_focus: "“国民党”涅槃重生"
 QIE_entrench_northern_primacy_focus_desc: "与中国数千年的历史相比，军阀混战的三四十年时间看似微不足道，但其影响不可低估。我们的南方同胞多年来形成了自己的政治传统，其中包含许多导致军阀主义和分离主义兴起的异端思想。我们必须捍卫我们的共和，让这种大逆不道的言论远离决策圈。"
 QIE_eliminate_regionalism_focus: "消灭地方主义"
 QIE_eliminate_regionalism_focus_desc: "中国的地方主义有着悠久的历史，我们当前的困境可以追溯到清廷在满族大权旁落时下放权力的行为，1911年后随之而来的内战和军阀割据更是加剧了这一问题。重建强大的中央政府并控制不忠的省长是唯一的解决办法。"
 QIE_beiyang_patronage_focus: "北洋之恩庇"
 QIE_beiyang_patronage_focus_desc: "显而易见的是，要想办事顺利，或多或少都需要一些礼品和报酬。多年来，这已经形成了一套错综复杂的体系，许多局外人才刚刚开始认识到并迎合这套体系。无论如何，要多让值得信赖的人担任公务员，这总比让来自外地的军阀暴民担任要好。"
 QIE_china_united_and_indivisible_focus: "中国，统一而不可分割"
 QIE_china_united_and_indivisible_focus_desc: "所有真正中国爱国者的最终梦想都是实现一个统一自由、不再受制于外来帝国主义者或国内小霸王的祖国。民盟将沦为历史的注脚，被其自身的矛盾和无休止的内斗所摧毁。而这个建立在千万人牺牲之上的民国，将在我们强力的大手和明智的大总统的领导下永世长存。"
 QIE_a_revolutionary_republic_focus: "革命之民国"
 QIE_a_revolutionary_republic_focus_desc: "在辛亥革命中，爱国志士们反抗的不仅是满清的暴政，还有遍及清廷上上下下的贪污腐败。随后的岁月中，中华大地一片混乱，困扰国家的根本问题无从解决，无能的北洋政府自然也就倒台了。新民国不能重蹈覆辙，必须与北洋截然不同，带来一场充满活力的、彻底的激进革命。"
 QIE_three_principles_for_one_chinese_nation_focus: "三民主义统一中国"
 QIE_three_principles_for_one_chinese_nation_focus_desc: "孙中山先生是具有远见卓识的伟人，也是民国无可置疑的国父，只可惜他早已去世，没有了他，国民党也最终失败。但是，凭借他的思想，我们将通过明智的领导，在训政体制下为国家指明方向，最终在民族、民权、民生三大主义的引导下建成新民国。"
 QIE_expansive_land_reform_focus: "扩大土地改革"
 QIE_expansive_land_reform_focus_desc: "国民党的激进土改计划是其吸引力的主要来源之一，该计划旨在将地主手中的耕地重新分配给土地的实际耕作者——农民。通过谨慎国有化、合作社再分配、限制地租以及投资农业机械化，我们将恢复乡村的和谐。"
 QIE_national_reconstruction_commission_focus: "国家建设委员会"
 QIE_national_reconstruction_commission_focus_desc: "作为孙中山先生建国大纲的计划之一，国家将主导开展一系列全面新建或改造工厂、铁路和水电大坝的项目。虽然最初的草案并非总是切实可行，但设立一个委员会以监督我们新的国家资本主义经济的想法总归是明智的。"
 QIE_kindle_the_mass_movement_focus: "策动群众运动"
 QIE_kindle_the_mass_movement_focus_desc: "旧国民党毁于反动势力的绞杀与内部的私心自用。但现在，我们携手并进，便可以为这片土地上的劳苦大众照亮前进的道路，让他们看到自己的解放。通过与党内的一些老朋友和老对手达成和解，我们新的篇章已然翻开！"
 QIE_a_new_republic_and_a_young_china_focus: "再造民国，少年中国"
 QIE_a_new_republic_and_a_young_china_focus_desc: "如凤凰从灰烬中浴火重生，中国再次成为一个强大的国家。面对新的时代，我们将与中国青年党的同志们并肩穿过未知的水域，彻底改变我们的国家以适应不断变化的世界。新民国与旧民国截然不同，它将点燃人民的斗志，并彻底战胜外来帝国主义！"
 QIE_presidential_cult_of_personality_focus: "对大总统的个人崇拜"
 QIE_presidential_cult_of_personality_focus_desc: "我们的大总统是一位伟人，是一位足以载入我国史册的杰出人物。他在危亡关头挺身而出，拯救了国家。他既是一位百战百胜的将军，也是一位强而有力的思想家，他理应受到赞扬，成为所有中国爱国者未来世代效仿和学习的榜样！"
 QIE_a_bureau_of_progress_focus: "进步局"
 QIE_a_bureau_of_progress_focus_desc: "为了简化行政工作，我们将在行政机关下设一个“进步局”，负责协调我们对军队和工业的快速改革。该部门将独立于国民大会（国会）监督之外，以免于官僚体制中的繁文缛节，同时培养出一批能将中国长期以来所急需的改革落到实处的年轻人。"
 QIE_undertake_mass_militarisation_focus: "进行大规模军事化"
 QIE_undertake_mass_militarisation_focus_desc: "我们生活在一个适者生存的世界中。我们骄傲而和平的国家被外国势力欺凌了太久，他们不加掩饰的贪婪掠夺我们的土地。中国若想生存下去，就必须变得强大，而要实现这一点，整个国家都必须做好准备，以克服任何阻碍国家繁荣昌盛的困难！"
 QIE_centralise_the_national_government_focus: "全国政府集权化"
 QIE_centralise_the_national_government_focus_desc: "通过向各省府下放权力来维持其帝国统治，这是日薄西山的清廷所犯下过的最恶劣罪行之一。这种做法不仅徒劳无功，反而为无耻的军阀和分裂主义者提供了可乘之机，他们利用省府中饱私囊，以牺牲人民为代价反抗中央政府，这种事情绝不能再次发生！"
 QIE_dawn_of_the_party_state_focus: "党国之黎明"
 QIE_dawn_of_the_party_state_focus_desc: "我们的盟友现已触及了一个非常现代化的概念：即政党在政治事务中发挥绝对作用。这也是政府利用人民意志捍卫国家利益的自然产物。既然这是未来的必然趋势，我们就绝不能落后于历史潮流——中国将再次引领人类进步！"
 QIE_crash_industrialisation_focus: "急速工业化"
 QIE_crash_industrialisation_focus_desc: "外国列强不仅屠戮我人民、窃取我资源，还打断了我国的工业发展，好让自己迈入现代化。他们妄图将我国经济与他们捆绑起来，让我们永远只能做他们的附庸。既然如此，我们别无选择，只有竭尽全力迎头赶上！"
 QIE_progressive_block_reign_victorious: "进步集团拔得头筹"
 QIE_progressive_block_reign_victorious_desc: "民主社会党赢得了选举，要求所有进步党派都做出贡献，以便在新共和国推行理性民主的改革。让我们携手共进，为更美好的明天——共和国的复兴而奋斗！"
 QIE_help_worker_peasant: "扶助工农"
 QIE_help_worker_peasant_desc: "在军阀混战、抗日战争和中国内战时期，受害最深的无疑是广大工农群众。必须将急需的援助与救济给予这些群体——安居乐业的民众方能铸就稳固的政权。"
 QIE_politicalize_trade_union: "工会政治化"
 QIE_politicalize_trade_union_desc: "若想推动中国社会和经济所需的重大进步，我们就必须将工会主义作为教化工人阶级的方法。尽管农民阶级永远是保守主义的堡垒，但城市工人却是传播社会主义和社会民主思想的理想受众。"
 QIE_elect_the_talented: "选贤举能"
 QIE_elect_the_talented_desc: "虽然民社党建立在自由、民主、平等原则之上，但我们绝不能忘记大多数民众仍然目不识丁，缺乏明辨是非的能力。诚如往昔，治理国家的重任仍需由士大夫与资产阶级绅士担当。"
 QIE_foundations_of_welfare_state: "奠基福利国家"
 QIE_foundations_of_welfare_state_desc: "军阀割据固然是共和国的最大祸患，但颠覆性社会主义的危害亦不遑多让。为遏制社会革命浪潮，必须为工农建立完善保障体系，维护其劳动尊严。若失去民众支持，国民党与工团党必将走向崩溃。"
 QIE_civilian_over_military: "笔杆子指挥枪杆子"
 QIE_civilian_over_military_desc: "在耻辱的军阀混战时代，不择手段的军事派和野心勃勃的将领为了争夺控制权而互相争斗。决不能让这种混乱局面重演，军队必须置于政府的严格监督之下，一个现代共和国需要由文官来掌控军队。"
 QIE_realize_social_democracy: "实现社会民主"
 QIE_realize_social_democracy_desc: "基于人民的认同和正义的事业，我党将继续为人民及其应得的尊严而奋斗。"
 QIE_spirit_of_democracy: "灌输民主精神"
 QIE_spirit_of_democracy_desc: "中国的民主弥足珍贵，但如果在教育大众的同时，不妥善培养人民行使四项基本权利的能力，这种精神——即认真参与民主的意识，就有可能丧失殆尽。中国人民必须学会积极有效地参与新制度，并共同捍卫它免受军阀和革命者的破坏。"
 QIE_appealing_for_republican_coalition: "呼吁共和派团结"
 QIE_appealing_for_republican_coalition_desc: "引领国家迈向民主未来的进程已然顺利推进。守护新生的民主，是新共和政府所有政治参与者的天职。共和派内部绝不能争吵不休，否则便会导致手足相残的悲剧，而共盟将担起维护团结的重任。"
 QIE_solidify_election_system: "稳固选举政治"
 QIE_solidify_election_system_desc: "虽然并非万无一失，但共和大同盟已然确保中国的混乱政局归于稳定，进而迈向中立温和的未来。唯有真心实意、秉持公心、恪尽职守的政党才有望赢得选举，而共盟将永远守护中国的民主制度。"
 QIE_endeavours_human_face: "努力会的遗产"
 QIE_endeavours_human_face_desc: "胡适长期以来都是北京圈知识分子的一员，自始至终倡导着中国的自由与改良民主事业。他与自己的知识分子同仁们一道创立了努力会，而其本人从来都是这一组织的高调头面人物。为了努力会，也为了其他知识分子，他常年来笔耕不辍。胡适当选大总统为民国树立了一个伟大的榜样。"
 QIE_government_of_good_people: "好人政府"
 QIE_government_of_good_people_desc: "正如努力会在最初的《我们的政治主张》所阐明的那般，他们希望建立一个致力于个人自由与福祉的宪政的、公开的、有计划的政府。胡适以其“实验主义”(pragmatism)哲学框定的流变的政治意识形态，不断为着改良自由主义而奋斗，并以和平的手段践行着自己的美德。不过，他那些更加激进的同仁们则嘲笑这种主张是所谓的理想主义。"
 QIE_liberalism_forever: "自由主义永恒"
 QIE_liberalism_forever_desc: "一个自由繁荣的中国，仅仅只是10年前，也许大部分中国人都会对对此嗤之以鼻，但不可思议之事已经实现，远见卓识的领导者和远赴重洋的学子们终应得到与他们努力相称的成就。"
 QIE_return_to_rural: "以农立国，以工建国"
 QIE_return_to_rural_desc: "农工党凭借着农民的选票成功当选，一个真正的农业国家将被建设起来！"
 QIE_industry_serves_agri: "发行新货币"
 QIE_industry_serves_agri_desc: "军阀混战导致各地经济受到严重破坏，最明显的一点就是货币。为了杜绝币制的混乱，新政府决定发行名叫金圆券的纸币，它一定不会发生严重贬值。"
 QIE_resource_conservation: "水土保持，资源保护"
 QIE_resource_conservation_desc: "我国农村土地的土壤破坏十分严重，这是农村衰落的主要原因。所谓水土保持，就是要适宜地管理和利用水源及土壤，不使其流失，以免产生破坏的作用，停止耕种之土地，并非停止生产，不过改变用途，嗣后经营林业及畜牧，仍须有人从事。某处地方或须划作矿产，其他地方或须培植风景，供人游览，故随处皆可以创造职业的新机会。"
 QIE_peasant_system_national_treasure: "佃农制度，国家瑰宝"
 QIE_peasant_system_national_treasure_desc: "中国的地主非外国的贵族可比，除少数外，其土地多由血汗积蓄而来，非同封建之采邑。由此可见，中国根本不存在封建制度；至于消灭佃农制可以增加生产更没有事实和理论依据，因此任何土地改革都是在破坏农村。"
 QIE_control_population: "节制人口增长"
 QIE_control_population_desc: "人口稀少，人们种植良好土地。随着人口增多，人民被迫种植山地和低洼地，一方面造成水土流失和填塞河湖，破环水土资源，带来自然灾害。另一方面，这些劣地农民，抗灾荒能力异常薄弱，一遇天灾，必然人祸相伴，社会由此动乱。经过一段时期后，人口减少，社会恢复平静。如此周而复始，一次比一次自然资源破环更厉害，中国人种和文化就越来越差。中国并不一定要四万万五万万人，有一万万两万万也可以成世界最强的国家，如果四万万人中有两三万万时常过着非人类的生活，倒不如只有一两万万，大家都过高尚满足的生活。这样情形的国家才能强盛，物质和精神文明才能进步，这并不非说我们要把现在的人杀掉几万万，但是我们对于人口增殖，决不能再行放任，必须远谋有效的广大的节制生育，限制人口的办法，与资源的保存同时进行。"
 QIE_militia_demilitrize: "农民民兵替代军队"
 QIE_militia_demilitrize_desc: "内战给中国带来了深刻的创伤。众所周知战争需要军队，中国只保留警察与农民自卫民兵，没有军队，内战就打不起来了。"
 QIE_declare_great_agrian_state: "回归农耕文明"
 QIE_declare_great_agrian_state_desc: "随着农业振兴与中国经济的振兴，农工党理想中的的东亚大农国已经成为了现实。"
 QIE_pursue_social_harmony: "追求社会和谐"
 QIE_pursue_social_harmony_desc: "国家必须如机器般高效精密运转，人民也必须竭诚奉献。长期以来，人民逐渐迷失了自我——或沉溺于社会主义的蛊惑之毒，或沦陷于军阀的甜言蜜语之中；这些私欲熏心之徒，从不能满足民众真正的需求。唯有在和谐的社会秩序下，由开明的精英领导道德高尚的公民，自由与民主才可实现。"
 QIE_power_of_bureaucracy: "官僚机构之力"
 QIE_power_of_bureaucracy_desc: "中国曾因官僚主义与无能交织的行政体系而饱受诟病，但鲜有人目睹过中国技术官僚和行政官员展现出的真正实力。在政府集中力量治理下，腐败将被连根拔起，新的中国将保持更严格的纪律和强有力的集体行动。"
 QIE_authoritian_republic: "荷枪实弹共和国"
 QIE_authoritian_republic_desc: "虽然我们的政敌诋毁当今的中国民主名不副实，并声称这纯粹是由军人及其派系操控的政权。但他们大错特错——军队绝非为己谋利，而是为了捍卫国家的民主制度。只要军队保持警惕，民主便能万无一失。"
 QIE_educate_masses: "教育群众"
 QIE_educate_masses_desc: "如同父亲对待子女一样，士绅和学者阶层对中国人民，包括他们的教育，都抱有殷切的期盼。一旦人民既掌握了现代知识，又继承了传统文化，自然就会理解民盟的主张。启蒙大众，定能让中国再度傲立于世界民族之林！"
 QIE_chinese_west_interaction: "继往开来"
 QIE_chinese_west_interaction_desc: "虽然西方在现代化、伦理建设和经济发展方面确有诸多值得借鉴之处，但我们也必须审慎权衡，使其与我们的价值原则相协调。既要重拾中华传统实践精髓，也要持续研习西方经验，我们要走兼容并蓄的中间道路！"
 QIE_democracy_stands_tall: "民主屹立不倒"
 QIE_democracy_stands_tall_desc: "基于人民的认同和正义的事业，我党将继续为人民及其应得的尊严而奋斗。"
 QIE_people_rise_up_save_country: "人民奋起救国"
 QIE_people_rise_up_save_country_desc: ""
 QIE_take_out_foreign_capital: "收购外企"
 QIE_take_out_foreign_capital_desc: "长期以来，殖民者通过收购股份等方式控制中国工商业利益的行径，在直系与奉系阵营内部早已引起非议——这些行为只会让中国工人陷入悲惨境地。虽然外国资本与投资的确曾涌向中国工厂，但我们也为之付出了沉重的代价，因此必须扭转这一局面。"
 QIE_denounce_bad_habits: "禁绝国内恶习"
 QIE_denounce_bad_habits_desc: "国内对个人主义的轻浮追求已滋生出太多的淫逸恶习。自由固然重要，但代价是什么？是鸦片，还是赌博？这些都是国家最严重的罪恶！当然，各省已实施相关禁令，但这还远远不够。只有通过政府全面开展整治行动，才能彻底肃清这些社会毒瘤。"
 QIE_science_worship: "新科学教"
 QIE_science_worship_desc: "在当前世界秩序中，一种致力于推动科学文明进步的“新宗教”正在形成。尽管这个新宗教尚未完全理解科学文明的全部内涵，但其特征显而易见：理性主义、对人性的信心、以及建立于博爱之上的全新社会伦理——这些特征对于新中国的发展来说不可或缺。"
 QIE_lowing_election_standards: "降低选举门槛"
 QIE_lowing_election_standards_desc: "主流政客早已预见了一个拒绝容忍真正议会民主，而是由大众政党主导的体制；独立人士也认同这一观点。在共盟和民盟的庇护下，只有那些拥有足够权力和影响力的政党才能取得胜利，而这剥夺了地方问题获得应有关注的机会。让我们纠正这种情况。"
 QIE_minority_rights: "保护少数民族权利"
 QIE_minority_rights_desc: "中国的民族远不止五个，所谓“五族共和”一说并不准确，丝毫没有尊重国内多姿多彩的民族多样性。长期的军阀割据和地方政权掩盖了各少数民族的存在。如今许多少数民族已独木难支，是时候介入让中央政府介入以保护他们的权利和文化了。"
 QIE_begonia_of_many_faces: "千面秋海棠"
 QIE_begonia_of_many_faces_desc: "人们相信秋海棠代表着吉祥如意、富贵满堂，同时还象征着和谐大同。在新生的中华联省政府中，所有这些秋海棠的特质无疑都得到了体现。多种信仰、多种肤色在卿云之下团结一心，共同组成了我们的国家！时哉夫，天下非一族之天下也，各族人民的声音都将被倾听！"
 QIE_learn_from_west: "师从西方"
 QIE_learn_from_west_desc: "西方文明意识到了物质享受的真正重要性；正是对物质享受的追求促进了新的发展和进步——例如增加财富、提高生产力、制造能力和科研水平。对“真理”的探索，正是西方的精神根基所在。知识的无限性令东方安于现状，因此我们必须效仿西方同胞。"
 QIE_chinese_pragmatism: "务实建设"
 QIE_chinese_pragmatism_desc: "固守儒家传统教条，导致一代代士大夫唯命是从，无法适应变革。而通过“务实建设”，新儒家得以运用历史智慧解决现实问题，并推动儒家思想与人类社会共同发展。"
 QIE_republicanism_without_partisan: "抛下党派纷争的共和"
 QIE_republicanism_without_partisan_desc: "政客绝不可谋求私利，而是应当秉持“超功利的胸怀”；意识形态不应是排他与偏激的，而应当是关乎生活、社会及治国理念的思想体系。在新生的中华民主共和体制下，国会不会因意识形态而分裂，而是会团结一致勠力前行！"
 QIE_new_china_new_citizen: "新中国，新公民"
 QIE_new_china_new_citizen_desc: ""
 QIE_erdicate_socialism: "整治社会蛀虫"
 QIE_erdicate_socialism_desc: "负隅顽抗的革命游击队乃为寄生良善之蠹虫。举国上下均须为国家民族勠力同心，如果群众中充斥着游手好闲之人，那么国家唯有败亡一途。"
 QIE_gear_of_regime: "给齿轮上油"
 QIE_gear_of_regime_desc: "中国的税收制度作为旧行政体制的遗留，普遍存在过于随意且自相矛盾的问题。现行税制在萌芽阶段就扼杀了商业活力，导致企业被迫依附于各类既得利益集团形成垄断性财阀，没有真正促进自由创业的繁荣发展，而这正是我们的目标。"
 QIE_traditionalist_values: "维护儒家道德"
 QIE_traditionalist_values_desc: "在革命派和卑劣军阀的肆意妄为之下，传统的儒家治国理念已被摧毁殆尽。道德是所有稳固政府的根基，当今的共和国也必须秉持这一原则。通过融合儒家思想与西方原则，我们将确保共和国的现代化与和谐。"
 QIE_emphaize_military: "推崇军方地位"
 QIE_emphaize_military_desc: "中国的民主事业很大程度上要归功于军方，如果没有军人的英勇牺牲，中国很难战胜那些阻挠自己实现希望和梦想的军阀和革命者。正因如此，军队必须在中国民主中扮演不可或缺的角色，他们是抵御暴政的屏障，也是民主制度的捍卫者。"
