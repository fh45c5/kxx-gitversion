 GAL_rural_society_3:0 "平衡发展"
 GAL_rural_society_3_desc:0 "更广泛的加利西亚社会主要由农民和小农组成——这一传统在这个近乎田园诗般的乡村“天堂”延续了几个世纪。虽然大多数居民生活在分散的村庄里，但人口分布的零散性确保了尽管社会经济体系以农业为主，但大多数国内农业并不能带来太多利润。这个残酷的现实必须被打破，因为尽管我们将永远与土地联系在一起，但我们注定不能在泥泞中沉沦。"
