 GAL_state_industrial_control:0 "国家工业控制"
 GAL_state_industrial_control_desc:0 "将关键工业部门收归国有，虽能在危机时刻保障国家命脉，却也令外资与贸易伙伴颇有微词。"
 GAL_market_liberalisation:0 "经济自由化"
 GAL_market_liberalisation_desc:0 "放开市场管制、削减壁垒，让资本与商品自由流通。工厂效率显著提升，贸易伙伴也更为亲近。"
 GAL_cincinnatus_spirit:0 "辛辛纳图斯精神"
 GAL_cincinnatus_spirit_desc:0 "如同古罗马的辛辛纳图斯，领袖在危机中临危受命、功成身退，将权力交还议会。这种风范为共和国赢得了军心与民心。"
 GAL_peoples_party_dominance:0 "人民党执政地位"
 GAL_peoples_party_dominance_desc:0 "人民党在议会与基层的双重巩固，使其执政根基稳如磐石，国家动员能力随之增强。"
 GAL_krakow_school_economics:0 "克拉科夫学派"
 GAL_krakow_school_economics_desc:0 "以克拉科夫大学为核心的经济学者团体为政府出谋划策，研究效率与建设速度双双提升。"
 GAL_defend_freedom:0 "保卫自由"
 GAL_defend_freedom_desc:0 "面对外来威胁，加利西亚人民誓死捍卫来之不易的自由。防御意志与战争支持空前高涨，投降绝无可能。"
