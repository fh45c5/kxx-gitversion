 GAL_anfuminzhong:0 "安抚东加里西亚民众"
 GAL_zhijielaiba:0 "我们会战胜这些魔鬼！"
 GAL_zhijielaiba_desc:0 "（直接触发西乌克兰独立，你可以通过点击此决议游玩西乌克兰（仍在开发中）或是快速宣战西乌克兰以达成战争目标）"
 GAL_preparing:0 "为独立与解放做好准备"
 GAL_preparing_desc:0 "奥匈帝国境内一系列的混乱和悲剧让加利西亚人看清了奥地利的软弱与无能，同时，各个民族的独立给了仍在帝国境内的加利西亚人极大的鼓舞与信心。我们到了离百年以来的独立梦想最为接近的时刻，从农村到城市，从小孩到老人，全体加利西亚人，包括在波兰和乌克兰的同胞们，应该准备起来，不管是以和平还是武力的方式，这一次，一定要让全世界承认我们的独立。\n\n£pol_violence §R独立准备度§!:[?GAL_preparing_rate|0+%%]"
