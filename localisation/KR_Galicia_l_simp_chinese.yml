    GAL_socialized_large_enterprises:0 "社会化大型企业"
    GAL_socialized_large_enterprises_desc:0 "将大型工业企业收归公有，服务于社会大众。"

    GAL_our_common_enemy:0 "我们共同的敌人"
    GAL_our_common_enemy_desc:0 "识别出威胁我们两国的共同外部敌人，团结起来对抗。"

    GAL_end_cycle_of_hatred:0 "终结仇恨循环"
    GAL_end_cycle_of_hatred_desc:0 "打破世代相传的仇恨与报复，迈向和平共处。"

    GAL_squeeze_landlords_and_bourgeoisie:0 "榨干地主与资产阶级"
