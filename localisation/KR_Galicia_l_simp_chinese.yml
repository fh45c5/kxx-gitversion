 gal.15.b:0 "陷入僵局！"
 gal.44.t:0 "紧急任命"
 gal.44.d:0 "由于没有任何一方可以取得多数，为了防止进一步动乱，哈勒将军任命一位无党派人士利奥波德·卡罗为国家的临时领导人。"
 gal.44.a:0 "他能拯救国家吗？"
 gal.45.t:0 "农民的救世主"
 gal.45.d:0 "地主们的倒行逆施引起了一位名叫安杰伊·胡萨诺的神父的愤怒。他召集了他的追随者，尝试夺取政府的控制权。"
 gal.45.a:0 "他们失败了！"
 gal.45.b:0 "他们成功了！"
