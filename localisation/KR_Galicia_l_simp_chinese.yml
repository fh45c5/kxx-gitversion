 gal.42.t:0 "末日临近"
 gal.42.d:0 "由于当局的不作为，东加利西亚的乌克兰人基本找不到不憎恶政府的人了。与此同时，乌克兰军事组织已经改编为乌克兰起义军，随时准备发动全面叛乱。"
 gal.42.a:0 "大事不妙"
 gal.43.t:0 "秩序的解体"
 gal.43.d:0 "加利西亚正熊熊燃烧。乌克兰起义军已经完全掌控了东加利西亚，宣布成立一个独立的西乌克兰国家，并对波兰人发动了全面的报复，罗马尼亚人也趁机宣布布科维纳独立。我们完蛋了。"
 gal.43.a:0 "该死！"
 gal.43.b:0 "乌克兰人，拿起武器！"
 gal.43.c:0 "罗马尼亚，我的祖国！"
