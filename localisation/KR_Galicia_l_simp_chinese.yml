    GAL_stop_ethnic_killing:0 "遏止民族仇杀"
    GAL_stop_ethnic_killing_desc:0 "必须立即停止针对乌克兰族和其他少数民族的暴力冲突。"

    GAL_negotiate_with_ukrainians:0 "同乌克兰人谈判"
    GAL_negotiate_with_ukrainians_desc:0 "坐下来与乌克兰领导人谈判，寻求和平的解决方案。"

    GAL_zakerzonia_ceasefire:0 "扎克尔佐尼亚停火"
