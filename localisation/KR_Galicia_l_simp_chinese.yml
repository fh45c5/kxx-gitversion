    GAL_manage_labor_movement:0 "驾驭工会运动"
    GAL_manage_labor_movement_desc:0 "控制并引导工人阶级的力量，使其为民族利益服务。"

    GAL_rise_of_ethnic_radicalism:0 "民族激进主义的崛起"
    GAL_rise_of_ethnic_radicalism_desc:0 "拥抱极端的民族主义情绪，以铁血手段解决民族问题。"

    GAL_orthodox_nationalism_bastion:0 "正统民族主义坚守阵地"
