    GAL_eternal_cycle_world_desc:0 "接受世界在创造与毁灭中不断循环的宿命论。"

    GAL_perpetual_war_good_evil:0 "善与恶的永久战斗"
    GAL_perpetual_war_good_evil_desc:0 "投身于光明与黑暗之间永无止境的神圣战争。"

