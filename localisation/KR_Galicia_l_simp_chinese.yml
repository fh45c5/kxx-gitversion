    GAL_achieve_national_unity:0 "实现全民族团结"
    GAL_achieve_national_unity_desc:0 "消除内部隔阂，建立一个统一的波兰民族共同体。"

    GAL_polish_nation_awakens:0 "波兰民族，觉醒！"
    GAL_polish_nation_awakens_desc:0 "经过漫长的奋斗，波兰民族终于迎来了伟大的觉醒与复兴！"
