l_simp_chinese:
 gal.1.t:0 "加利西亚-洛多梅里亚独立"
 gal.1.d:0 "从1772年第一次瓜分波兰之后，加利西亚-洛多梅里亚就在哈布斯堡的统治下度过了几个世纪。现在，我们终于能独立了。但是，我们是一个弱小的国家，而周围强国环绕——也许我们应该寻求波兰的保护，因为我们的领土实际上曾经是波兰的一部分。"
 gal.1.a:0 "请求正式加入波兰（游戏结束）"
 gal.1.b:0 "加利西亚应保持独立"
 gal.2.t:0 "加利西亚寻求加入我们的国家"
 gal.2.d:0 "从1772年第一次瓜分波兰之后，加利西亚和洛多梅里亚就在哈布斯堡的统治下度过了几个世纪。现在，他们终于能独立了。但是，他们是一个弱小的国家，而周围强国环绕，这个新生的国家感到自己的生存受到了威胁。一名外交特使今天抵达，讨论将加利西亚并入波兰领土的问题。"
 gal.2.a:0 "欢迎回家，兄弟们"
 gal.3.t:0 "声索布科维纳"
 gal.3.d:0 "前奥地利的附属国，加利西亚-洛多梅里亚国家独立仅几天便已经并入波兰。然而，在加利西亚的多民族人口中，罗马尼亚人组成了最南部的布科维纳地区居民的大部分。考虑到该领土目前的混乱局面，我们可以相对容易地通过快速行动来夺取这一部分。"
 gal.3.a:0 "解放我们的同胞"
 gal.3.b:0 "挑衅波兰人于己无利"
 gal.4.t:0 "宣称东加利西亚"
 gal.4.d:0 "前奥地利的附属国，加利西亚-洛多梅里亚国家独立仅几天便已经并入波兰。然而，在加利西亚的多民族人口中，乌克兰人组成了东部地区居民的大部分。考虑到该领土目前的混乱局面，我们可以相对容易地通过快速行动来夺取这一部分。"
 gal.4.a:0 "解放我们的同胞"
 gal.4.b:0 "挑衅波兰人于己无利"
 gal.5.t:0 "罗马尼亚开进布科维纳"
 gal.5.d:0 "虽然我们从来没有指望会顺利合并像加利西亚这样大的一块领土，但来自外部的干预仍然让我们出乎意料——罗马尼亚军队已经进入主要讲罗马尼亚语的布科维纳地区，声称这个地区是他们的。而前加利西亚政府官员敦促我们进行干预。"
 gal.5.a:0 "岂有此理，夺回我们的领土！"
 gal.5.b:0 "让罗马尼亚人拥有讲罗马尼亚语的权利"
 gal.6.t:0 "乌克兰占领了东加利西亚"
 gal.6.d:0 "克拉科夫和利沃夫是加利西亚最重要的城市。在上个星期里我们对这两者的整合进展十分顺利，然而，在乌克兰军队的帮助下，利沃夫周围主要讲鲁塞尼语的地区的居民已经占领了这座城市。利沃夫城对波兰来说太过于重要了，我们不能让它落入另一个国家的手中。"
 gal.6.a:0 "岂有此理，夺回我们的领土！"
 gal.6.b:0 "鲁塞尼亚人与波兰人根本不是一路人"
 gal.7.t:0 "卡尔·阿尔布雷希特当选波兰国王"
 gal.7.d:0 "经过紧张的投票，现任加利西亚和洛多梅里亚总督卡尔·阿尔布雷希特·冯·哈布斯堡刚刚当选为波兰新国王。卡尔·阿尔布雷希特预计明天一早将抵达波兰，担任波兰的新领袖，并在他不在的时候让约瑟夫·哈勒尔·冯·哈伦堡负责加利西亚的事务。"
 gal.7.a:0 "祝他好运"
 GAL_karol_olbracht:0 "帝国总督卡尔·阿尔布雷希特"
 GAL_karol_olbracht_desc:0 "卡尔·阿尔布雷希特·冯·哈布斯堡-洛林虽是奥地利裔，但却是帝国内波兰人的坚定拥护者。卡尔·阿尔布雷希特从他的父亲卡尔·斯特凡那里继承了他的头衔和对所有波兰事物的热忱，他是波兰王国王室最合法的继承者，地位无可争议，能够成为其治下臣民所喜爱和公正的国王，但这是一个说起来容易做起来难的任务。在摄政议会加冕他为波兰人的国王之后，加利西亚帝国总督之位就被交给了约瑟夫·哈勒尔·冯·哈伦堡将军代行职责。尽管卡尔·阿尔布雷希特尽其所能地让加利西亚与波兰成为一个对他的臣民来说更好的地方，关于他只关心华沙的老爷们而不真正关心加利西亚的农民的不满传言也在逐渐扩散。"
 GAL_golicja_glodomeria:0 "赤贫与饥饿"
 GAL_golicja_glodomeria_desc:0 "维也纳的傻瓜们已经几十年没有在该地区投资了，这种贫穷的现实显示出了严重的问题。目前，加利西亚是大欧洲最贫穷的地区之一，也是哈布斯堡帝国内最贫穷的组成王国。这一现实已经成为一种难以摆脱的名号，其他地区的波兰人讽刺地把加利西亚-洛多梅里亚称为“赤贫与饥饿之地”。这一现实必须通过一切必要手段加以消除，因为我们贫穷的土地最终必须能够让我们的穷人吃饱穿暖。"
 GAL_rural_society:0 "乡村社会"
 GAL_rural_society_desc:0 "加利西亚的整个社会主要由农民和小农组成——这一传统在这个近乎田园诗般的乡村“天堂”延续了几个世纪。绝大多数国民生活在相互隔绝的村庄里，这种人口分布的零散性让以农业为主的社会经济体系难以带来什么利润。这个残酷的现实必须被打破，因为尽管我们将永远与土地联系在一起，但我们注定不能在泥泞中沉沦。"
 GAL_minority_unrest:0 "焦躁不安的少数民族"
 GAL_minority_unrest_desc:0 "加利西亚在种族和宗教方面都存在严重分歧。该国最大的宗教团体是罗马天主教徒，近一半的“加利西亚人”——主要是波兰人，还有一小群奥地利移民——向罗马教宗皈依。希腊天主教徒在规模和影响力上与罗马天主教徒不相上下，同时也向罗马教宗屈膝。其教徒大约占人口的42%，而罗马天主教徒占46%。这些拜占庭天主教徒大多称自己是乌克兰人或鲁塞尼亚人（有时将这两个词对立起来），但也有许多人称自己只是本地人——这在加利西亚这个民族混合的大熔炉中是一个新颖的概念。\n\n犹太人也不甘示弱，在人口中占有相当大的比例，在非基督教的少数民族中占主导地位，而这进一步加剧了民族与宗教间的紧张关系。自1867年奥匈妥协以来，波兰人在王国内几乎掌握了全部权力，这使争吵不休的群体之间的紧张关系进一步加剧，使这些火势更为猛烈。加利西亚是一个充满各种元素的火药桶，随时都会燃烧起来，各种本地和外国势力都在努力控制火势或让它肆意燃烧，而加利西亚的命运正悬于一线。"
 GAL_shattered_unity:0 "破碎的政治统一"
 GAL_shattered_unity_desc:0 "世界大战期间，由于广泛的政治战线的失败，加上外国势力对波兰当地人口的持续控制，加利西亚的政治陷入了彻底的混乱。目前，尽管几乎所有合法政党都宣布支持君主制，而且多数民众热爱或至少容忍卡尔·阿尔布雷希特，但对维也纳的信心充其量也只是摇摆不定。"
 GAL_golicja_glodomeria_2:0 "赤贫与饥饿"
 GAL_golicja_glodomeria_2_desc:0 "维也纳的傻瓜们已经几十年没有在该地区投资了，这种贫穷的现实显示出了严重的问题。目前，加利西亚是大欧洲最贫穷的地区之一，也是哈布斯堡帝国内最贫穷的组成王国。这一现实已经成为一种难以摆脱的名号，其他地区的波兰人讽刺地把加利西亚-洛多梅里亚称为“赤贫与饥饿之地”。这一现实必须通过一切必要手段加以消除，因为我们贫穷的土地最终必须能够让我们的穷人吃饱穿暖。"
 GAL_minority_unrest_2:0 "焦躁不安的少数民族"
 GAL_minority_unrest_2_desc:0 "加利西亚在种族和宗教方面都存在严重分歧。该国最大的宗教团体是罗马天主教徒，近一半的“加利西亚人”——主要是波兰人，还有一小群奥地利移民——向罗马教宗皈依。希腊天主教徒在规模和影响力上与罗马天主教徒不相上下，同时也向罗马教宗屈膝。其教徒大约占人口的42%，而罗马天主教徒占46%。这些拜占庭天主教徒大多称自己是乌克兰人或鲁塞尼亚人（有时将这两个词对立起来），但也有许多人称自己只是本地人——这在加利西亚这个民族混合的大熔炉中是一个新颖的概念。\n\n犹太人也不甘示弱，在人口中占有相当大的比例，在非基督教的少数民族中占主导地位，而这进一步加剧了民族与宗教间的紧张关系。自1867年奥匈妥协以来，波兰人在王国内几乎掌握了全部权力，这使争吵不休的群体之间的紧张关系进一步加剧，使这些火势更为猛烈。加利西亚是一个充满各种元素的火药桶，随时都会燃烧起来，各种本地和外国势力都在努力控制火势或让它肆意燃烧，而加利西亚的命运正悬于一线。"
 GAL_shattered_unity_2:0 "破碎的政治统一"
 GAL_shattered_unity_2_desc:0 "世界大战期间，由于广泛的政治战线的失败，加上外国势力对波兰当地人口的持续控制，加利西亚的政治陷入了彻底的混乱。目前，尽管几乎所有合法政党都宣布支持君主制，而且多数民众热爱或至少容忍卡尔·阿尔布雷希特，但对维也纳的信心充其量也只是摇摆不定。执政的波兰人民党及其领导人文岑蒂·维托斯既受到普通民众的爱戴，也受到他们的鄙视，城乡居民之间的分歧最为明显。目前，尚不清楚这个以农业为中心的农民政党能否从加利西亚政治的深渊中拯救自己——或是加利西亚自身是否会屈服于其内部的动荡。"
 GAL_golicja_glodomeria_3:0 "赤贫与饥饿"
 GAL_golicja_glodomeria_3_desc:0 "维也纳的傻瓜们已经几十年没有在该地区投资了，这种贫穷的现实显示出了严重的问题。目前，加利西亚是大欧洲最贫穷的地区之一，也是哈布斯堡帝国内最贫穷的组成王国。这一现实已经成为一种难以摆脱的名号，其他地区的波兰人讽刺地把加利西亚-洛多梅里亚称为“赤贫与饥饿之地”。这一现实必须通过一切必要手段加以消除，因为我们贫穷的土地最终必须能够让我们的穷人吃饱穿暖。"
 GAL_minority_unrest_3:0 "焦躁不安的少数民族"
 GAL_minority_unrest_3_desc:0 "加利西亚在种族和宗教方面都存在严重分歧。该国最大的宗教团体是罗马天主教徒，近一半的“加利西亚人”——主要是波兰人，还有一小群奥地利移民——向罗马教宗皈依。希腊天主教徒在规模和影响力上与罗马天主教徒不相上下，同时也向罗马教宗屈膝。其教徒大约占人口的42%，而罗马天主教徒占46%。这些拜占庭天主教徒大多称自己是乌克兰人或鲁塞尼亚人（有时将这两个词对立起来），但也有许多人称自己只是本地人——这在加利西亚这个民族混合的大熔炉中是一个新颖的概念。\n\n犹太人也不甘示弱，在人口中占有相当大的比例，在非基督教的少数民族中占主导地位，而这进一步加剧了民族与宗教间的紧张关系。自1867年奥匈妥协以来，波兰人在王国内几乎掌握了全部权力，这使争吵不休的群体之间的紧张关系进一步加剧，使这些火势更为猛烈。加利西亚是一个充满各种元素的火药桶，随时都会燃烧起来，各种本地和外国势力都在努力控制火势或让它肆意燃烧，而加利西亚的命运正悬于一线。"
 GAL_market_influence:0 "自由市场经济政策"
 GAL_selling_oil:0 "抛售石油"
 GAL_rural_society_2:0 "乡村社会"
 GAL_rural_society_2_desc:0 "更广泛的加利西亚社会主要由农民和小农组成——这一传统在这个近乎田园诗般的乡村“天堂”延续了几个世纪。虽然大多数居民生活在分散的村庄里，但人口分布的零散性确保了尽管社会经济体系以农业为主，但大多数国内农业并不能带来太多利润。这个残酷的现实必须被打破，因为尽管我们将永远与土地联系在一起，但我们注定不能在泥泞中沉沦。"
 GAL_market_help:0 "接受克拉科夫经济学派的援助"
 GAL_psl_elected:0 "波兰人民党赢得大选"
 GAL_chsr_elected:0 "激进农民党赢得大选"
 GAL_ppsd_elected:0 "波兰社民党赢得大选"
 GAL_spn_elected:0 "民族右翼党赢得大选"
 GAL_kse_elected:0 "克拉科夫经济学派赢得大选"
 GAL_tough_year:0 "加利西亚的艰难又一年"
 GAL_tough_year_desc:0 "岁月对可怜的老加利西亚并不仁慈，这片土地饱受贫穷、冲突和危机的折磨。可悲的是，尽管政府尽了最大努力来改变这一点，但1936年似乎和往年一个样。至少情况不会变得更糟了。"
 GAL_downwards_spiral:0 "王冠领地急速陷入混乱"
 GAL_downwards_spiral_desc:0 "事实证明，黑色星期一是导致奥地利最具权力的王冠领地摇摇欲坠的结构崩溃的最后一击。人们在街道上骚乱，工厂关闭，农民们焚烧他们滞销的存货。我们不能让一切这成为终结。"
 GAL_calm_minorities:0 "安抚少数民族-宗教团体"
 GAL_calm_minorities_desc:0 "加利西亚是许多少数民族的家园，他们中的绝大多数人认为波兰人持续的政治主导地位是当前危机的主要原因。如果要使这片土地团结在一起，而不至于演变为宗派暴力事件，我们就必须安抚他们，特别是在少数民族在人数上占多数的地区。"
 GAL_another_committee:0 "另一个最高国家委员会？"
 GAL_another_committee_desc:0 "最高国家委员会是创立于世界大战期间的一个联合政治阵线，其目的是团结所有的政治派系。不过，委员会最终以失败收场，这让本就脆弱不堪的加利西亚更是雪上加霜。也许在没有其他选择的情况下，我们可以成立第二个委员会，希望这次能有更好的结果。"
 GAL_call_gentry:0 "呼唤波兰地主贵族"
 GAL_call_gentry_desc:0 "波兰地主贵族是一群拥有土地的乡绅，他们一代又一代地继承自己的土地和庄园。他们中的许多人是联邦什拉赫塔（众议院贵族）本身的后裔。在当前的至暗时刻，我们必须呼吁他们帮助我们拯救那些不幸的兄弟。"
 GAL_emergency_peasant:0 "紧急农民救济"
 GAL_emergency_peasant_desc:0 "多亏了慷慨的乡绅和富有的公民，我们筹到了更多的资金，足够启动一项紧急救济计划了。其主要目标是减轻黑色星期一给我们的农民带来的负担。"
 GAL_contact_vienna:0 "联络维也纳"
 GAL_contact_vienna_desc:0 "虽然维也纳的政府尤其是官僚们近年来并不受欢迎，但我们仍然可以利用他们的帮助来应对经济危机。该给首都发一份加急电报了。"
 GAL_trust_market:0 "信任市场"
 GAL_trust_market_desc:0 "在我们接受维也纳和克拉科夫经济学派的帮助后，学派已经说服议会尽早实施一些有利于市场的政策。希望这只看不见的手能拯救加利西亚支离破碎的经济。"
 GAL_sell_oil:0 "抛售石油"
 GAL_sell_oil_desc:0 "政府与维也纳的沟通以失败告终，我们已别无选择。从保瑞斯莱夫和多罗毕其油田收集的石油供应必须接受检查，然后出售，以治愈我们经济的伤痛。"
 GAL_special_elections:0 "宣布特别选举"
 GAL_special_elections_desc:0 "鉴于没有其他政党愿意站出来共同努力克服危机，文岑蒂·维托斯决定要求阿尔布雷希特总督宣布在时间允许的情况下尽快举行一次特别选举。人民需要决定他们会信任谁来确保加利西亚的再度繁荣。"
 gal.10.t:0 "黑云笼罩王国上空，1936年的加利西亚"
 gal.10.d:0 "加利西亚-洛多梅里亚王国以及克拉科夫大公国与奥斯威辛-扎托尔公国，简称加利西亚或奥属波兰，是哈布斯堡王朝的一个王冠领地，于1772年建立，是波兰第一次分治的产物。在最初进行了轰轰烈烈的日耳曼化后，1861年，加利西亚获得了自治权，在首都利沃夫建立了国家议会和政府。1867年，随着二元君主制的确立，省级自治得到了扩展。奥地利政府保证，总督将从当地波兰人中任命。地方议会有权通过有关国民经济、通信、教育和卫生的法律。\n\n得益于其广泛的自治权，加利西亚成为了波兰独立运动的中心。许多波兰政党和准军事组织都在这里运作，这构成了20世纪初创建的军团的基础。然而，战争期间建立的武装组织并没有实现他们的目标，即赢得独立或将加利西亚的土地与会议王国或德意志帝国拥有的土地统一起来。\n\n在卡尔一世登基成为奥地利的新任皇帝后，加利西亚被赋予了更大程度的自治权。由于设立了帝国总督办公室，总督可以承担维也纳皇帝的大部分权利和责任，而加利西亚将主要由国家总督和加利西亚议会共同管理。\n\n然而，即便有广泛的自治权，加利西亚的土地也被种族冲突、激进的政治运动、政府缺乏其他党派的支持和猖獗的贫困所折磨。如果情况不尽快改善，这片土地可能会演变成人间地狱，而这正是维也纳政府以及目前执政的波兰人民党所希望避免的。"
 gal.10.a:0 "我们会挺过去的"
 gal.11.t:0 "民族主义者领导权问题"
 gal.11.d:0 "随着政权稳定，民族主义者开始重新考虑领导权问题。现在有两人可以成为新领导人，一是与民族激进阵营有关的安东尼·沙茨基，二是主张黄色工团主义的奥斯卡·斯图尔。"
 gal.11.a:0 "斯塔尔将继续领导"
 gal.11.b:0 "沙茨基将成为领导人"
 gal.11.c:0 "斯图尔将成为领导人"
 GAL_natdem:0 "正统派延续"
 GAL_onr:0 "民族激进阵营夺权"
 GAL_yellowsynd:0 "工会派夺权"
 gal.12.t:0 "黑色星期一席卷加利西亚！"
 gal.12.d:0 "许多人的担忧终于成真了。这次全面的经济衰退爆发成了当今时代从未见过的大崩溃。德国经济的崩溃把其他所有投资于它的国家都卷了进去，包括奥地利和加利西亚。随着“黑色星期一”的影响在我们周围肆虐，我们必须迅速采取行动，以拯救这个已经陷入困境的国家。"
 gal.12.a:0 "我们难逃一死了！"
 gal.13.t:0 "暂时达成共识？"
 gal.13.d:0 "让执政党内所有人都没料到的是，没有政治势力愿意在加利西亚大难当头之际加入联盟。以战争期间成立的前最高国家委员会的失败以及波兰人民党政府无力使加利西亚摆脱经济混乱为由，各党派宣布，他们将在未来的任何选举中直接推选候选人对抗维托斯。因此，社会主义者和保守派都扼杀了我们在议院内建立广泛阵线的希望。"
 gal.13.a:0 "该死！"
 gal.14.t:0 "帝国的要求"
 gal.14.d:0 "我们发往维也纳的紧急电报收到了许多人意想不到的要求。皇帝陛下的政府同意为我们提供急需的资金，但有一个条件，那就是克拉科夫经济学派——加利西亚内部最忠诚的团体之一——必须被允许进入议院，以制定一些早期恢复政策。首都的官僚们可能希望这能让学会在未来的选举中获得足够的民众支持，并取得胜利。"
 gal.14.a:0 "我们别无选择"
 gal.14.b:0 "这些狗官僚，我们不会允许的"
 gal.15.t:0 "提前选举"
 gal.15.d:0 "由于无法维持住现有权力，哈勒呼吁提前举行在国家议会大选。由于失去了之前的大部分支持，波兰人民党正处于危险的境地，不得不与同自己政党的主张相似或不同的势力竞争。\n\n左翼是一个强大的团体，即伊格纳齐·达辛斯基的社会民主党，要求进行涉及加利西亚法律和经济生活各个方面的重大改革。这一切都是为了让城市工人受益，并让加利西亚成为一个新独立的波兰共和国的起点。\n\n右翼党派的数量从某种角度上来说要少得多，但在某些方面却更令人兴奋，克拉科夫经济学派这一长期以来的学术组织竟然也参与了选举。\n\n王国的全体人民，无论是波兰人、乌克兰人、俄罗斯人、犹太人还是日耳曼人，都在问自己一个问题。在所有事情结束后，谁将负责拯救他们的土地？"
 gal.15.a:0 "波兰人民党"
 gal.15.c:0 "波兰加利西亚和切申西里西亚社会民主党"
 gal.15.f:0 "克拉科夫经济学派"
 gal.16.t:0 "议会被解散"
 gal.16.d:0 "哈勒将军拒绝举行选举，并派兵逮捕了大部分议员，这实际上意味着军事独裁的建立。"
 gal.16.a:0 "拯救国家之时到来了！"
 GAL_autocracy:0 "军事独裁已经建立"
 gal.17.t:0 "社会主义革命"
 gal.17.d:0 "选举不会举行了。出于对政府的不满，愤怒的人民在加利西亚共产党的领导下夺取了农村并进军克拉科夫，推翻了政府。"
 gal.17.a:0 "革命万岁！"
 GAL_socialist_revolution:0 "社会主义革命已经成功"
 GAL_szlachata_coup:0 "地主已经接管了政府"
 gal.18.t:0 "地主接管政府"
 gal.18.d:0 "选举不会举行了。随着地主的权力增加，他们的势力已经彻底控制了加利西亚的政治，议会成了他们的傀儡。现在，他们强迫哈勒将军辞职，并命令议会选举一个新政府，斯坦奇克派与波多利亚派正在争夺领导权。"
 gal.18.a:0 "斯坦奇克派胜利了！"
 gal.18.b:0 "波多利亚派胜利了！"
 GAL_nationalist_coup:0 "民族主义者已经夺取了政权"
 gal.19.t:0 "民族主义者政变"
 gal.19.d:0 "选举不会举行了。在军队的支持下，民族主义者打着反对社会主义的旗号向克拉科夫进军，夺取了权力。"
 gal.19.a:0 "独立就是现在！"
