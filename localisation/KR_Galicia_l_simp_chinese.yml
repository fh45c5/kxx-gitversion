    GAL_muscovite_regime:0 "莫斯科主义者的政权"
    GAL_muscovite_regime_desc:0 "确立莫斯科主义在俄罗斯的统治，开启新的历史篇章。"

    GAL_crush_polish_resistance:0 "粉碎波兰人抵抗"
