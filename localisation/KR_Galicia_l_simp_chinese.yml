    GAL_technobureaucratic_economic_cooperatives_desc:0 "建立由技术专家管理的合作社，以提高生产效率。"

    GAL_social_organization_community:0 "社会组织共同体"
    GAL_social_organization_community_desc:0 "强化社会组织的作用，构建紧密的社区共同体。"

    GAL_mild_statist_interventionism:0 "温和国家干预主义"
    GAL_mild_statist_interventionism_desc:0 "在自由市场与国家控制之间寻求平衡，实施温和的干预政策。"

    GAL_jewish_anti_semitism:0 "犹太人的反犹主义"
    GAL_jewish_anti_semitism_desc:0 "应对国内日益严重的反犹情绪，将其转化为政治资本或加以遏制。"

    GAL_catholic_social_movement:0 "天主教社会运动"
    GAL_catholic_social_movement_desc:0 "发动天主教社会运动，以信仰为基础推动社会改革。"

    GAL_third_way_between_individualism_collectivism:0 "个人主义与集体主义之间的第三道路"
