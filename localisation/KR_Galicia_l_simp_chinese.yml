    GAL_overthrow_dead_church:0 "推倒死人的教会"
    GAL_overthrow_dead_church_desc:0 "推翻僵化腐朽的宗教机构，打破精神的枷锁。"

    GAL_god_images_differ_truth_eternel:0 "上帝形象不一，而真理永恒"
    GAL_god_images_differ_truth_eternel_desc:0 "认识到神性的多样性，追求那超越表象的永恒真理。"

    GAL_hell_purgatory_heaven_are_present:0 "地狱、炼狱、天堂，皆为当下"
    GAL_hell_purgatory_heaven_are_present_desc:0 "领悟苦难与救赎并非死后之事，而是此刻正在经历的轮回。"

