    GAL_crush_usury_middlemen_groups_desc:0 "严厉打击盘剥社会的高利贷者和中间商集团。"

    GAL_admit_national_democrats:0 "接纳民族民主党人"
    GAL_admit_national_democrats_desc:0 "吸纳民族民主党人加入政府，扩大执政基础。"

    GAL_social_solidarity_achieved:0 "社会团结终实现"
