    GAL_populist_artists:0 "人民主义艺术家"
    GAL_populist_artists_desc:0 "扶持歌颂民族与土地的人民主义艺术家，塑造大众的精神世界。"

    GAL_roar_of_sarmatians:0 "格拉尔人的怒吼"
    GAL_roar_of_sarmatians_desc:0 "唤醒古老的萨尔马提亚-雅利安血统记忆，发出属于征服者的怒吼。"

    GAL_encourage_german_migration:0 "鼓励德国移民"
    GAL_encourage_german_migration_desc:0 "出台优惠政策，鼓励帝国本土的农民与工人移居至此，充实人口。"

    GAL_reaction_against_renaissance:0 "对文艺复兴的反动"
    GAL_reaction_against_renaissance_desc:0 "批判文艺复兴带来的个人主义与世俗化，回归传统的宗教与秩序。"

    GAL_our_sarmatian_aryan_bloodline:0 "我们的萨尔马提亚—雅利安血脉"
    GAL_our_sarmatian_aryan_bloodline_desc:0 "确立我们作为萨尔马提亚-雅利安后裔的纯正血统，构建种族优越论。"

    GAL_go_east:0 "向东去！"
    GAL_go_east_desc:0 "响应历史的召唤，举国上下向着东方未开垦的土地进军！Drang nach Osten！"
