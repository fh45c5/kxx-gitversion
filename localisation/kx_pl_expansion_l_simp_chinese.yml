l_simp_chinese:
 POL_sweetheart_general_regime:0 "甜心将军的政权"
 POL_sweetheart_general_regime_desc:0"华沙的政客们在争论纲领，但人称“甜心将军”的杜戈绍夫斯基只关心谁还愿意在午夜之后陪他骑马穿过公园。他不是独裁者，甚至算不上真正的党派人物——曾任毕苏斯基的副官、外交大使、利沃夫咖啡馆里用果汁兑水假装喝酒的诗人。但当波兰的体面政治在柏林与华沙之间反复窒息时，一个“没有倾向”的人恰恰成了唯一不引起任何一方立即敌意的人选，让甜心将军来吧。他不会带来意识形态，他会带来一个以雪茄、马匹和军团忠诚黏合起来的政权。至于它能否在维斯瓦河上活过下一个秋天，那是另一个问题。"
 POL_socialist_party_second_chance:0 "社会党的第二次机会"
 POL_socialist_party_second_chance_desc:0"拉伊蒙德·雅沃罗夫斯基从不觉得这两件事有什么矛盾，他是社会党人——不到二十岁就在街头和监狱里做社会党人，指挥过战斗组织，蹲过沙皇的流放地。他也反共——手下的战斗队在华沙的集会上打死了共产党活动家比亚利。在他看来，共产主义者不是同志，是另一条路上的人。如今社会党的人终于承认，对付街垒对面那些人，需要一个他这样不拘小节的人。"
 POL_syndicalism_in_service_of_the_nation:0 "工团主义为国家服务"
 POL_syndicalism_in_service_of_the_nation_desc:0"延德热伊·莫拉切夫斯基认为，波兰等不起随意和无纪律的罢工。流亡巴黎的同志们以为推翻柏林就能换来自由，可维斯瓦河两岸的工厂一旦停转，德国人甚至不需要派一兵一卒。工团主义是好的，但它要服务于国家重建的节奏。一个连枕木都铺不齐的国家，谈什么无产阶级的明天？"
 POL_rise_of_the_national_labor_party:0 "国家工党的崛起"
 POL_rise_of_the_national_labor_party_desc:0"流亡巴黎的工会联盟总书记耶日·苏里格已返回华沙，将分散于矿区和铁路工场中的工团小组整合为统一的政治力量。波兰工团主义联盟的旧纲领——以行业工会取代党派政治、以工人委员会承担国家职能——在占领当局默许的缝隙中获得了公开传播的契机。苏里格凭借战前主编《劳动团结》与《工人阵线》的组织经验，把罢工基金、合作社网络与地下宣传渠道合并为一套动员机器。国家工党由此从工会联盟的母体中脱出，宣称自己既承接毕苏斯基左翼的独立传统，又以工团主义的职业代表制对抗柏林强加的君主秩序。"
 POL_return_of_the_holy_son:0 "圣子的回归"
 POL_return_of_the_holy_son_desc:0"瓦莱里·斯瓦韦克在华沙的重新露面，终结了上校集团长达数年的裂痕。旧宪法的起草者、毕苏斯基遗嘱中那个被刻意搁置的名字，如今被萨纳齐亚各派同时奉为“圣子”——一个从殉道者边缘归来的象征。没有任何一个派系敢于公开否认他对“统帅”遗产的解释权。继承人的问题被暂时搁置，但每个人都清楚，圣子的加冕只是序章，真正决定波兰走向的，是接下来谁站在他身后。"
 POL_beks_victory:0 "贝克的胜利"
 POL_beks_victory_desc:0 ""
 POL_new_king_in_the_castle:0 "城堡里的新王"
 POL_new_king_in_the_castle_desc:0 ""
 POL_first_free_elections:0 "第一次自由选举"
 POL_first_free_elections_desc:0 ""
 POL_a_new_augustus:0 "一位新奥古斯都"
 POL_a_new_augustus_desc:0 ""
 POL_zeligowski_coup:0 "热里戈夫斯基政变"
 POL_zeligowski_coup_desc:0"华沙的卫戍部队便接到了一道未经总参谋部签发的调动令。热利戈夫斯基没有停留，他从安杰约沃庄园直接进入华沙。电话局、火车站和贝尔维德宫被同一批人接管，他们曾在1920年跟随他占领维尔纽斯，也曾在1926年为他清理过政变的残局。内阁已被解散，议会被勒令休会。热利戈夫斯基在贝尔维德宫的阳台上宣读了一份简短的公告，宣布成立“民族统一临时政府”。"
 POL_dream_of_a_superpower:0 "超级大国之梦"
 POL_dream_of_a_superpower_desc:0"波兰的困境不在于领土不够大，而在于国家权力从未真正抵达它的边界。华沙的部委被德国顾问的备忘录牵着走，东部的县政府听命于地方庄园而非首都，而议会里的争吵掩盖了一个事实——这个国家在柏林眼中只是一个缓冲地带。阿道夫·博琴斯基不属于上校集团，也不信任贝雷扎营那套手段，他从萨纳奇亚的失败中只取走一个结论：没有强大的行政中枢，任何关于波兰地位的谈论都是空话。他设想的“超级大国”不是版图上的帝国，而是一个能把军队、外交和税收从党派交易中剥离出来、置于专业官僚手中的国家。与此同时，他坚持县与公社的自治不能废除，因为正是地方层面的公民参与，才使国家权力不至于退化为警察的任意决定。"
 POL_polish_savinkovism:0 "波兰的萨文科夫主义"
 POL_polish_savinkovism_desc:0"卡罗尔·温季亚戈尔斯基看到，波兰的东方政策正陷入僵局。毕苏斯基的联邦构想停留在1920年的里加条约之前，普罗米修斯计划在军事预算的削减中逐渐褪色，而政府满足于在柏林与莫斯科之间维持脆弱平衡。他曾在切尔诺夫齐的第八集团军司令部里与萨文科夫共事，见过他如何把“第三俄罗斯”的口号变成一套可操作的组织方案。温季亚戈尔斯基带着这套方案回到了政治视野，波兰不需要在柏林和莫斯科之间选择。"
 POL_second_spring_of_the_strongmen:0 "地头蛇的第二春"
 POL_second_spring_of_the_strongmen_desc:0"很久以前，华沙的实际权力就散落在枢密院、德国顾问和那个贵族主导的跨党派集团之间。雅努什·拉齐维乌不需要走进议会去争论，因为没有他的配合，国家连一列木材车皮都调度不动。如今，权力的邀请送到了他在比耶兰斯卡街的宫殿。这位地头蛇只是带着账本和马耳他骑士团的徽记走进枢密院，把庄园里运转的那套秩序，平移到王国的文件之上。"
 POL_a_national_revolution:0 "一场民族革命"
 POL_a_national_revolution_desc:0"毕苏斯基的棺木入土未久，上校集团内部便有人开始谈论“净化”。布罗尼斯瓦夫·皮耶拉茨基没有等待辩论结果。他以内政部档案中关于乌克兰军事组织渗透的记录为凭据，在东部各省警署与驻军之间建立起一条绕过总理府的指挥链。当华沙还在争论少数民族自治的措辞时，皮耶拉茨基已经用一趟利沃夫之行完成了与地方驻军和行政官员的私下串联。回到首都时，他手中握有的已不是一份政策草案，而是一份名单——上面写着哪些省长、哪些警官、哪些萨纳齐亚同僚必须在“民族优先”的新秩序中让出位置。革命不需要街垒，只需要档案柜和驻军司令部的电话线。"
 POL_hedonism_is_revolution:0 "享乐即革命"
 POL_hedonism_is_revolution_desc:0"甜心将军从不相信清教徒式的政治，雪茄、马匹、午夜的马队和利沃夫的咖啡馆，在他看来比任何纲领都更接近生活本身。把享乐抬到革命的高度吧，这个政权不打算用意识形态改造你的灵魂，它只要求你别挡路。左右两派都可以继续争吵——将军会在下一场晚宴上同时邀请他们。"
 POL_trade_union_communism_for_all:0 "工会共产—全都来吧！"
 POL_trade_union_communism_for_all_desc:0"有人警告将军，工会和共产主义是政权的威胁。甜心将军耸耸肩——那就都来吧。他只在乎华沙的工厂能不能运转、铁路能不能准点。让工会派代表进来，让共产主义者发言，让他们互相牵制，然后由将军在中间签文件。一个没有倾向的人，恰恰最擅长让所有倾向为他所用。"
 POL_romantic_national_charterism:0 "浪漫民族宪章主义"
 POL_romantic_national_charterism_desc:0"将军让法学家起草一部宪章，又让诗人往里面塞进波兰的秋天、波兰骑兵的冲锋和利沃夫酒吧的烟雾。形式上它是一部宪章，内容上它是一首民族浪漫主义的诗。左右两派都能在里面找到自己愿意读的段落，民族主义者读到“波兰的灵魂”，宪章主义者读到革命和权力。"
 POL_socialism_without_democratic_filth:0 "社会主义无民主污秽"
 POL_socialism_without_democratic_filth_desc:0"议会走廊里的痰盂该倒了，雅沃罗夫斯基一直觉得，社会主义最脏的地方就是代表席上那些用“程序”擦过嘴的手。之前他带着自己的人马离开PPS时，骂的就是这个。党把时间花在跟贵族讨价还价上，而不是把贵族从账本上划掉。现在他回来了，带着一个更简单的方案。社会主义不需要民主的污秽来证明自己干净——它只需要一个不再需要证明的結果。"
 POL_total_control_over_unions:0 "对工会的全面控制"
 POL_total_control_over_unions_desc:0"CZKZZ（中央阶级工会协会）当年是雅沃罗夫斯基亲手从PPS里撕出来的，现在他要把它缝回自己的袖口里。工会不是辩论俱乐部，雅沃罗夫斯基在旧工会分裂时就看清了这一点。谁掌握罢工基金，谁就掌握罢工本身。加强控制并非消灭工会，是让工会只剩下一个功能：把工人的愤怒翻译成命令。"
 POL_integrate_the_republic_restoration_society:0 "整合共和国修复协会"
 POL_integrate_the_republic_restoration_society_desc:0"莫拉切夫斯基在就任后不久便将工会联盟的理事会、公共工程部的技术官僚以及部分起义军官的代表纳入了一个常设协调机构。该机构不取代原有各部，而是在物资分配、铁路调度和军工订单排序上拥有优先裁决权。协会的章程措辞刻意含混，既未声明自己是临时机构，也未声明是永久机构，莫拉切夫斯基对此的解释是，机构的寿命取决于它要修复的东西什么时候修好。"
 POL_uniting_the_left:0 "既联合左派……"
 POL_uniting_the_left_desc:0"国家工党中央委员会向华沙、罗兹和顿布罗瓦煤矿区的社会党地方组织与激进工会发出合作备忘录，承诺在未来的工人代表机构中为左翼保留固定席位，以换取其对工团主义行业自治纲领的承认。协议同时附有一份秘密附件，参与联合的左翼团体须解散独立的武装纠察队，将罢工基金移交国家工党财务委员会统一调度。毕竟，缺乏组织纪律的左翼只会被柏林用作分化波兰工人的楔子。"
 POL_uniting_the_right:0 "……又统战右派"
 POL_uniting_the_right_desc:0"国家工党向基督教民主党议会党团和部分萨纳齐亚旧军官抛出橄榄枝，右派保留教会财产与军官团荣誉法庭的自治权，国家工党则获得对国防工业与铁路工会的任命权。协议在克拉科夫一家修道院的地下室签署，见证人包括两名前毕苏斯基军团上校。右派接受这笔交易的理由是柏林和维也纳正在扶持乌克兰民族主义民兵，而国家工党承诺将右翼地方自卫队纳入未来的国家劳动营体系，使其获得合法武器与薪饷。"
 POL_realize_pilsudskis_vision:0 "实现毕苏斯基的愿景"
 POL_realize_pilsudskis_vision_desc:0"斯瓦韦克在议会大厦的妥协只维持了数月，上校集团旧部很快发现，圣子需要的不是集体领导，而是一个能执行纲领的人。亚当·斯克瓦尔钦斯基被推上前台——截去的双腿没有妨碍他成为萨纳齐亚道德革命最完整的阐述者。斯瓦韦克提名他执掌政府，各派系无人反对。一个坐轮椅的人既不会威胁军方的实际权力，又能安抚要求“净化”的激进青年。斯克瓦尔钦斯基上任第一件事，就是把元帅生前未及推行的教育纲领从文件柜里搬出来，将国家重新定义为塑造公民的学校。"
 POL_return_to_socialist_roots:0 "回归社会主义根源"
 POL_return_to_socialist_roots_desc:0"斯瓦韦克把权杖交到亚历山大·普里斯托尔手中时，集团内部并非没有异议。一个曾主张执行通缩政策、削减社会福利、站在大资本一边的人，如何能代表社会主义的回归？但普里斯托尔的履历就是回答：1904年华沙街头的首批战斗小队、1905年针对诺尔肯的刺杀行动、贝兹达尼那列被炸开的邮政车厢。他从不认为社会主义是一种需要论证的学说，而是一种需要执行的手艺。当他说要回归时，他指的是回到炸弹在手中引爆之前那一刻的决断，而不是回到任何一本教科书。"
 POL_reward_the_majors_clique:0 "奖赏上校集团"
 POL_reward_the_majors_clique_desc:0"斯瓦韦克在公室里翻完了候选人名单。什米格利-里兹的人马被逐出行政序列后留下的空缺，一直由各派系临时填补，效率低下且忠诚可疑。他决定把赌注押在旧人身上——那些在跟随卡齐米日·斯维塔尔斯基、又被排挤出权力走廊的上校们。斯维塔尔斯基被从克拉科夫省长的闲职上召回，接手政府。"
 POL_awaken_the_national_spirit:0 "唤醒国民精神"
 POL_awaken_the_national_spirit_desc:0 ""
 POL_maintain_the_triumvirate_alliance:0 "维持三巨头联盟"
 POL_maintain_the_triumvirate_alliance_desc:0 ""
 POL_regime_of_the_disciples:0 "门徒派的政权"
 POL_regime_of_the_disciples_desc:0 ""
 POL_rise_of_the_labor_clubs:0 "劳工俱乐部的崛起"
 POL_rise_of_the_labor_clubs_desc:0 ""
 POL_democratic_party_majority:0 "民主党多数"
 POL_democratic_party_majority_desc:0 ""
 POL_conservative_election_victory:0 "保守党胜选"
 POL_conservative_election_victory_desc:0 ""
 POL_establish_the_camp_of_national_unity:0 "建立民族统一营"
 POL_establish_the_camp_of_national_unity_desc:0 ""
 POL_first_marshal_second_figure:0 "第一元帅，第二人物"
 POL_first_marshal_second_figure_desc:0 ""
 POL_authorize_the_presidents_cabal:0 "授权总统密党"
 POL_authorize_the_presidents_cabal_desc:0 ""
 POL_decentralized_direct_democracy:0 "去中心化直接民主"
 POL_decentralized_direct_democracy_desc:0"热利戈夫斯基废除了旧“合并法”，他把县（powiat）和公社（gmina）的议事会从省长的监护下解放出来，恢复村社大会对道路、学校、诊所和森林采伐的直接表决权。吵闹的公社比安静的总督府更接近秩序，这才是我们伟大波兰人的制度。"
 POL_cooperate_with_panslavists:0 "同泛斯拉夫主义者合作"
 POL_cooperate_with_panslavists_desc:0"热利戈夫斯基不需要等待莫斯科的许可，他沿着战前的泛斯拉夫会议网络，与布拉格、贝尔格莱德和索非亚的斯拉夫俱乐部恢复了通信，交换的内容从语言教材到巴尔干半岛的军事信息。那些相信斯拉夫人应该自己决定自己事务的人，不管他们挂什么旗，即使是共产主义者都是我们的朋友。"
 POL_national_self_sufficiency:0 "民族的自给自足"
 POL_national_self_sufficiency_desc:0"波兰的木材、锌锭和酒精出发，指向布拉格、贝尔格莱德和索非亚，换回机床、铁砂和南斯拉夫的铜。斯拉夫民族统一得靠每个公社的仓库里都有不经过柏林和维也纳就能拿到的东西，自给自足是让斯拉夫世界的每一个节点在面向日耳曼或其他压力时，有自己的底气。"
 POL_implement_separation_of_church_and_state:0 "实施政教分离"
 POL_implement_separation_of_church_and_state_desc:0"博琴斯基在《政治》杂志上写过，宗教是文化的基础，不是政纲的条款。他推动的法案把主教任命权交还罗马，教产由各教区自行管理，神父不再兼任县公署的登记员，教区学校的神学课程与世俗课程分开管理。把信仰从政治里移出去，信仰才能回到它该在的地方。"
 POL_end_of_centralization:0 "终结中央集权"
 POL_end_of_centralization_desc:0"博琴斯基把合并法称为“华沙对省份的战争”。他推动的替代法案把县议会的选举权扩大到所有纳税居民，省长的任命须经县议会联席会议确认，地方金库保留税收的三成，不再上解华沙。一个连自己县里道路和学校都做不了主的国家，不可能在国外被称为强国。中央集权带来不了力量，它只是恐惧地方差异的标志。"
 POL_rule_of_confidants:0 "密友的统治"
 POL_rule_of_confidants_desc:0"温季亚戈尔斯基从不掩饰他与萨文科夫的关系，1917年在切尔诺夫齐的第八集团军司令部，他是萨文科夫最信任的联络官；十月革命后，他带着萨文科夫的密令穿过基辅的德国监狱和白军的防线，在华沙为“第三俄罗斯”的方案寻找落脚点。萨文科夫教会他一件事——革命的目的是重建，不是破坏；而重建需要一张能运作的密友网络。他的统治依赖的不是职位，是那些在切尔诺夫齐、基辅和华沙战俘营里与他共过事的人。"
 POL_musketeers_take_power:0 "火枪手掌权"
 POL_musketeers_take_power_desc:0"温季亚戈尔斯基在雅沃鲁夫的露天会议上讲话时，斯特凡·维特科夫斯基从不坐在听众席里。当温季亚戈尔斯基因伤寒卧床三周时，火枪手的信使已经接管了东方广播电台的短波频段和维尔纽斯联络站。波兰萨文科夫主义的事业需要工程师，火枪手版本的萨文科夫主义不靠群众集会来传播，靠的是情报、间谍和炸药。两种萨文科夫主义，只有一种能活到最后，而现在，火枪手胜出了。"
 POL_protect_the_notables:0 "保障权贵"
 POL_protect_the_notables_desc:0"库曼的锯木厂、斯帕诺夫的林场、涅博罗夫的宫殿，以及各省与之相连的庄园，都被逐条列明，要求国家以法令形式确认其完整性与不可侵犯。权贵的庄园网络承担了地方上的就业、运输与救济，作为交换，华沙不得以任何名义——无论是土地改革、战时征用还是财政摊派——触碰这份清单。议会里的贵族们看得很清楚，投票反对这份文件，等于投票反对自己脚下的土地。"
 POL_allies_of_industry:0 "实业家盟友"
 POL_allies_of_industry_desc:0"拉齐维乌需要有人把煤从西里西亚运到加工厂，把木材从东部林区运到港口，而他的庄园恰好控制着中间那些铁路支线和装卸场站。实业家们获得的是稳定的运力与地方上的治安保障，付出的则是将部分董事会席位交给公爵信任的代理人。有了实业家盟友，拉齐维乌的事业将更加稳固。"
 POL_united_national_radical_camp:0 "统一民族激进阵营"
 POL_united_national_radical_camp_desc:0"民族激进阵营在之前一直是内政部档案里的重点监视对象，皮耶拉茨基在贝雷扎营的囚室里见过他们的领导人，也在《晨报》的版面上读过他们的纲领。不过，这些人对国家的敌意来自被排斥，而不是来自原则错误。于是释放令与邀请函同时发出，只要承认民族统一高于派系清算。民族党内的青年翼、民族激进阵营中愿意放下街头战术的一支，以及萨纳齐内部那些早已不耐烦议会程序的军官，如今都是“民族统一阵营”。"
 POL_embrace_charter_totalitarian_ideas:0 "接纳宪章极权主义思想"
 POL_embrace_charter_totalitarian_ideas_desc:0"皮耶拉茨基从不读理论著作，但他从第三国际那些极权主义的公文里挑出几样东西，交给内政部的法学家改写成波兰文。领袖的意志即为国家意志的最高解释，公民的自由止于“民族共同善”所划定的边界。宪法中关于总统权力的条款被重新解释，议会的立法权被压缩为咨询性的，法院的独立性以不触及国家利益为前提，这就是波兰“民族纪律的宪章”。"
 POL_parisian_tea_break:0 "巴黎茶歇"
 POL_parisian_tea_break_desc:0"华沙与巴黎之间隔着柏林，但甜心将军嗅到了另一种可能，既然工团主义的法国需要打破外交孤立，而波兰需要在德国之外多一条呼吸的缝隙，那为什么不在巴黎喝一杯茶？将军会带着他的诗人名声和外交履历去，不谈主义，只谈铁路、贸易和“互相不添麻烦”。"
 POL_omniscient_omnipotent_omnibenevolent:0 "全知、全能、全善"
 POL_omniscient_omnipotent_omnibenevolent_desc:0"甜心将军的政权不打算扮演上帝，全知交给官僚和技术人员，全能交给军队，全善交给神父和诗人。将军本人只负责一件事，让这套拼装起来的机器不至于在维斯瓦河上散架。他笑得越甜，这台机器就越不需要一个救世主。"
 POL_modern_legion_chivalry:0 "现代军团骑士精神"
 POL_modern_legion_chivalry_desc:0"毕苏斯基的遗产还在，但他们的马刀砍不进1930年代的坦克。甜心将军要做的，是把“军团骑士”从一种怀旧变成一种现代军事美德。纪律、机动、对指挥官的私人忠诚，以及一种近乎浪漫的冒险意志。让骑兵的传统活在装甲部队的条令里，让将军本人继续做那个可以半夜骑马检阅部队的“甜心首长”。"
 POL_conservative_remnants:0 "终结保守派残党"
 POL_conservative_remnants_desc:0"那些“跨党政治集团”的老爷们，那些在摄政议会里数着自家庄园亩数投票的贵族，他们以为社会主义者的礼貌是软弱，他们会在宴会上跟你碰杯，然后在选区划分上捅你一刀。对付残党不需要审判，需要的是行政。财产登记、税务稽查、一份“通敌嫌疑”名单......让残党灭亡吧。"
 POL_pilsudski_alpha_and_omega_of_socialism:0 "毕苏斯基，社会主义的阿尔法与欧米茄"
 POL_pilsudski_alpha_and_omega_of_socialism_desc:0"毕苏斯基不是理论家，雅沃罗夫斯基比谁都清楚。元帅留给波兰的是一种方法：用军队的纪律去执行社会的意志，用情报的耐心去清理政治的垃圾。雅沃罗夫斯基在工人防卫委员会里学会了这一课，社会主义如果不能在街头和战壕里保护自己，就什么都不是。毕苏斯基是阿尔法，是起点——一个社会主义者必须首先是波兰人，才能是别的什么。欧米伽是他雅沃罗夫斯基，他要完成波兰的社会主义事业。"
 POL_defeat_the_communist_specter:0 "战胜共产主义幽灵"
 POL_defeat_the_communist_specter_desc:0"波兰社会主义不欠布尔什维克任何东西。共产主义者说他们是国际主义者，他们渗透进乡村，带着枪和钱，把波兰工人的力量引出波兰。对付这种幽灵不能靠辩论，要靠警察的档案和民兵的棍棒。波兰社会主义者自己会处理自己的叛徒，不需要外人来教。"
 POL_strengthen_interventionism:0 "强化干预主义"
 POL_strengthen_interventionism_desc:0"罢工权是工人斗争的成果，但一个被外国资本和本国剥削阶级同时卡住脖子的国家，无法承受将罢工作为常规政治武器的代价。波兰的干预主义不采取全面国有化的形式，而是以“托管”和“仲裁”为核心。国内外自由派批评这是用行政命令替代市场信号，但莫拉切夫斯基在公共工程部的会议上回应称，波兰面对的不是一个需要优化的市场，而是一个需要先存在的工业体系。"
 POL_seek_self_sufficiency:0 "寻求自给自足"
 POL_seek_self_sufficiency_desc:0"华沙的工业界长期依赖德国供应的机床、轴承和化工半成品，信贷则经由柏林银行体系周转。如今西里西亚煤炭优先供应国内电厂和军工，罗兹的纺织产能转向军用帆布和帐篷材料，利沃夫至格丁尼亚干线的电气化被列为最高优先级，即便这意味着引入美国资本。自给自足的目标不是关闭波兰经济，而是使柏林在决定是否对波兰施加经济压力时，必须计算波兰的承受能力。"
 POL_unify_the_christian_labor_movement:0 "统一基督教工人运动"
 POL_unify_the_christian_labor_movement_desc:0"苏里格以仲裁人身份介入基督教工会与工团主义行业委员会之间的管辖权争端，矿区与工厂的基督教互助组织并入国家工党的工人委员会，但神父保留对会员道德事务的咨询权，同时集体谈判与罢工表决权移交给行业委员会。"
 POL_destroy_jewish_economic_privileges:0 "摧毁犹太经济特权"
 POL_destroy_jewish_economic_privileges_desc:0"波兰此前保留的犹太社区自治税与犹太手工业和商号在若干行业的传统配额，被国家工党主导的工商管理局以“战时经济统制”名义逐一废止。贸易中的社区执照制度被替换为按行业工会会员资格发放的营业许可，未加入工团主义行业组织者不得参与国家订货的分包。国家工党同时设立合作信贷银行，向转入合作社形式的犹太工匠提供低息贷款，此举在官方公报中被表述为“将中介性特权转化为劳动性权利”。"
 POL_purge_the_traitors:0 "清理国贼"
 POL_purge_the_traitors_desc:0"萨纳齐亚的道德净化找到了明确的对象——那些在元帅身后窃据国家权柄、却以妥协和惰性消解遗产的人。斯克瓦尔钦斯基以“民族首先是国家与公民共同历史的产物”为判准，将什米格利-里兹周围聚集的寄生虫逐出公共生活。议会中的旧党派残余被以行政手段清除，理由不是政见分歧，而是他们对国家本身缺乏“无偿的、牺牲的态度”。净化从人事开始，以道德完成。"
 POL_purification_of_sanacja:0 "萨纳齐亚的净化"
 POL_purification_of_sanacja_desc:0"“萨纳齐亚”的本义是疗愈与清洗，斯克瓦尔钦斯基将其从针对政治对手的一次性行动扩展为持续的国家状态。报纸、学校、地方自治机构接受统一审查，标准是它们是否服务于“国家社会化”的目标。旧式的党派交易被斥为奴隶式的寄生行为，取而代之的是由功绩与行动定义的公共责任。净化不再需要敌人，它成为日常行政的语法。"
 POL_the_loyal_henchmen:0 "忠诚的打手们"
 POL_the_loyal_henchmen_desc:0"普里斯托尔从不掩饰他的干部从哪里来，他信赖的打手们，如今成为新政权人事任命的底本。这些人未必识字，更不懂经济学，但他们知道如何在格日博夫斯基广场的枪声中保持队形。各部门的主官职位被逐一分配给前战斗组织成员及其子侄，国家机器不再由官僚运转，由一支记得如何服从命令的队伍运转。"
 POL_olive_branch_to_old_comrades:0 "老同志们的橄榄枝"
 POL_olive_branch_to_old_comrades_desc:0"普里斯托尔在贝尔维第宫的走廊里逐一约见那些在老面孔，如今元帅不在了，但波兰还在。不管是从前的对手，还是沉默多年的名字，抑或是地方上仍握有实际影响力的人，只要自认坚持毕苏斯基思想的指导，那就是他的好同志。"
 POL_unlimited_presidential_power:0 "总统权力无限"
 POL_unlimited_presidential_power_desc:0"斯维塔尔斯基把旧宪法里那些从未被真正使用的条款逐条翻出来，如今解散议会的权力不再需要参议院附署，总统令的生效不再受部长会议议程的约束，国家法院的法官由总统直接任命而非经司法总监提名，波兰成为了一个强总统制国家。"
 POL_purge_syndicalist_filth:0 "净化工团污秽"
 POL_purge_syndicalist_filth_desc:0"工团联合会遭到了斯维塔尔斯基的大清洗和审查，结果是十七个行业联合会中有十一个存在“行政费用超出法定比例”的问题，九个联合会的主席团成员为反对派候选人提供过车辆。工团没有被解散，它仍旧继续运转，只是从此运转在一条斯维塔尔斯基铺好的轨道上。"
