l_simp_chinese:
 POL_sweetheart_general_regime:0 "甜心将军的政权"
 POL_sweetheart_general_regime_desc:0"华沙的政客们在争论纲领，但人称“甜心将军”的杜戈绍夫斯基只关心谁还愿意在午夜之后陪他骑马穿过公园。他不是独裁者，甚至算不上真正的党派人物——曾任毕苏斯基的副官、外交大使、利沃夫咖啡馆里用果汁兑水假装喝酒的诗人。但当波兰的体面政治在柏林与华沙之间反复窒息时，一个“没有倾向”的人恰恰成了唯一不引起任何一方立即敌意的人选，让甜心将军来吧。他不会带来意识形态，他会带来一个以雪茄、马匹和军团忠诚黏合起来的政权。至于它能否在维斯瓦河上活过下一个秋天，那是另一个问题。"
 POL_socialist_party_second_chance:0 "社会党的第二次机会"
 POL_socialist_party_second_chance_desc:0"拉伊蒙德·雅沃罗夫斯基从不觉得这两件事有什么矛盾，他是社会党人——不到二十岁就在街头和监狱里做社会党人，指挥过战斗组织，蹲过沙皇的流放地。他也反共——手下的战斗队在华沙的集会上打死了共产党活动家比亚利。在他看来，共产主义者不是同志，是另一条路上的人。如今社会党的人终于承认，对付街垒对面那些人，需要一个他这样不拘小节的人。"
 POL_syndicalism_in_service_of_the_nation:0 "工团主义为国家服务"
 POL_syndicalism_in_service_of_the_nation_desc:0"延德热伊·莫拉切夫斯基认为，波兰等不起随意和无纪律的罢工。流亡巴黎的同志们以为推翻柏林就能换来自由，可维斯瓦河两岸的工厂一旦停转，德国人甚至不需要派一兵一卒。工团主义是好的，但它要服务于国家重建的节奏。一个连枕木都铺不齐的国家，谈什么无产阶级的明天？"
 POL_rise_of_the_national_labor_party:0 "国家工党的崛起"
 POL_rise_of_the_national_labor_party_desc:0"流亡巴黎的工会联盟总书记耶日·苏里格已返回华沙，将分散于矿区和铁路工场中的工团小组整合为统一的政治力量。波兰工团主义联盟的旧纲领——以行业工会取代党派政治、以工人委员会承担国家职能——在占领当局默许的缝隙中获得了公开传播的契机。苏里格凭借战前主编《劳动团结》与《工人阵线》的组织经验，把罢工基金、合作社网络与地下宣传渠道合并为一套动员机器。国家工党由此从工会联盟的母体中脱出，宣称自己既承接毕苏斯基左翼的独立传统，又以工团主义的职业代表制对抗柏林强加的君主秩序。"
 POL_return_of_the_holy_son:0 "圣子的回归"
 POL_return_of_the_holy_son_desc:0"瓦莱里·斯瓦韦克在华沙的重新露面，终结了上校集团长达数年的裂痕。旧宪法的起草者、毕苏斯基遗嘱中那个被刻意搁置的名字，如今被萨纳齐亚各派同时奉为“圣子”——一个从殉道者边缘归来的象征。没有任何一个派系敢于公开否认他对“统帅”遗产的解释权。继承人的问题被暂时搁置，但每个人都清楚，圣子的加冕只是序章，真正决定波兰走向的，是接下来谁站在他身后。"
 POL_beks_victory:0 "贝克的胜利"
 POL_beks_victory_desc:0 ""
 POL_new_king_in_the_castle:0 "城堡里的新王"
 POL_new_king_in_the_castle_desc:0 ""
 POL_first_free_elections:0 "第一次自由选举"
 POL_first_free_elections_desc:0 ""
 POL_a_new_augustus:0 "一位新奥古斯都"
 POL_a_new_augustus_desc:0 ""
 POL_zeligowski_coup:0 "热里戈夫斯基政变"
 POL_zeligowski_coup_desc:0 ""
 POL_dream_of_a_superpower:0 "超级大国之梦"
 POL_dream_of_a_superpower_desc:0 ""
 POL_polish_savinkovism:0 "波兰的萨文科夫主义"
 POL_polish_savinkovism_desc:0 ""
 POL_second_spring_of_the_strongmen:0 "地头蛇的第二春"
 POL_second_spring_of_the_strongmen_desc:0 ""
 POL_a_national_revolution:0 "一场民族革命"
 POL_a_national_revolution_desc:0 ""
 POL_hedonism_is_revolution:0 "享乐即革命"
 POL_hedonism_is_revolution_desc:0"甜心将军从不相信清教徒式的政治，雪茄、马匹、午夜的马队和利沃夫的咖啡馆，在他看来比任何纲领都更接近生活本身。把享乐抬到革命的高度吧，这个政权不打算用意识形态改造你的灵魂，它只要求你别挡路。左右两派都可以继续争吵——将军会在下一场晚宴上同时邀请他们。"
 POL_trade_union_communism_for_all:0 "工会共产—全都来吧！"
 POL_trade_union_communism_for_all_desc:0"有人警告将军，工会和共产主义是政权的威胁。甜心将军耸耸肩——那就都来吧。他只在乎华沙的工厂能不能运转、铁路能不能准点。让工会派代表进来，让共产主义者发言，让他们互相牵制，然后由将军在中间签文件。一个没有倾向的人，恰恰最擅长让所有倾向为他所用。"
 POL_romantic_national_charterism:0 "浪漫民族宪章主义"
 POL_romantic_national_charterism_desc:0"将军让法学家起草一部宪章，又让诗人往里面塞进波兰的秋天、波兰骑兵的冲锋和利沃夫酒吧的烟雾。形式上它是一部宪章，内容上它是一首民族浪漫主义的诗。左右两派都能在里面找到自己愿意读的段落，民族主义者读到“波兰的灵魂”，宪章主义者读到革命和权力。"
 POL_socialism_without_democratic_filth:0 "社会主义无民主污秽"
 POL_socialism_without_democratic_filth_desc:0"议会走廊里的痰盂该倒了，雅沃罗夫斯基一直觉得，社会主义最脏的地方就是代表席上那些用“程序”擦过嘴的手。之前他带着自己的人马离开PPS时，骂的就是这个。党把时间花在跟贵族讨价还价上，而不是把贵族从账本上划掉。现在他回来了，带着一个更简单的方案。社会主义不需要民主的污秽来证明自己干净——它只需要一个不再需要证明的結果。"
 POL_total_control_over_unions:0 "对工会的全面控制"
 POL_total_control_over_unions_desc:0"CZKZZ（中央阶级工会协会）当年是雅沃罗夫斯基亲手从PPS里撕出来的，现在他要把它缝回自己的袖口里。工会不是辩论俱乐部，雅沃罗夫斯基在旧工会分裂时就看清了这一点。谁掌握罢工基金，谁就掌握罢工本身。加强控制并非消灭工会，是让工会只剩下一个功能：把工人的愤怒翻译成命令。"
 POL_integrate_the_republic_restoration_society:0 "整合共和国修复协会"
 POL_integrate_the_republic_restoration_society_desc:0"莫拉切夫斯基在就任后不久便将工会联盟的理事会、公共工程部的技术官僚以及部分起义军官的代表纳入了一个常设协调机构。该机构不取代原有各部，而是在物资分配、铁路调度和军工订单排序上拥有优先裁决权。协会的章程措辞刻意含混，既未声明自己是临时机构，也未声明是永久机构，莫拉切夫斯基对此的解释是，机构的寿命取决于它要修复的东西什么时候修好。"
 POL_uniting_the_left:0 "既联合左派……"
 POL_uniting_the_left_desc:0"国家工党中央委员会向华沙、罗兹和顿布罗瓦煤矿区的社会党地方组织与激进工会发出合作备忘录，承诺在未来的工人代表机构中为左翼保留固定席位，以换取其对工团主义行业自治纲领的承认。协议同时附有一份秘密附件，参与联合的左翼团体须解散独立的武装纠察队，将罢工基金移交国家工党财务委员会统一调度。毕竟，缺乏组织纪律的左翼只会被柏林用作分化波兰工人的楔子。"
 POL_uniting_the_right:0 "……又统战右派"
 POL_uniting_the_right_desc:0"国家工党向基督教民主党议会党团和部分萨纳齐亚旧军官抛出橄榄枝，右派保留教会财产与军官团荣誉法庭的自治权，国家工党则获得对国防工业与铁路工会的任命权。协议在克拉科夫一家修道院的地下室签署，见证人包括两名前毕苏斯基军团上校。右派接受这笔交易的理由是柏林和维也纳正在扶持乌克兰民族主义民兵，而国家工党承诺将右翼地方自卫队纳入未来的国家劳动营体系，使其获得合法武器与薪饷。"
 POL_realize_pilsudskis_vision:0 "实现毕苏斯基的愿景"
 POL_realize_pilsudskis_vision_desc:0"斯瓦韦克在议会大厦的妥协只维持了数月，上校集团旧部很快发现，圣子需要的不是集体领导，而是一个能执行纲领的人。亚当·斯克瓦尔钦斯基被推上前台——截去的双腿没有妨碍他成为萨纳齐亚道德革命最完整的阐述者。斯瓦韦克提名他执掌政府，各派系无人反对。一个坐轮椅的人既不会威胁军方的实际权力，又能安抚要求“净化”的激进青年。斯克瓦尔钦斯基上任第一件事，就是把元帅生前未及推行的教育纲领从文件柜里搬出来，将国家重新定义为塑造公民的学校。"
 POL_return_to_socialist_roots:0 "回归社会主义根源"
 POL_return_to_socialist_roots_desc:0"斯瓦韦克把权杖交到亚历山大·普里斯托尔手中时，集团内部并非没有异议。一个曾主张执行通缩政策、削减社会福利、站在大资本一边的人，如何能代表社会主义的回归？但普里斯托尔的履历就是回答：1904年华沙街头的首批战斗小队、1905年针对诺尔肯的刺杀行动、贝兹达尼那列被炸开的邮政车厢。他从不认为社会主义是一种需要论证的学说，而是一种需要执行的手艺。当他说要回归时，他指的是回到炸弹在手中引爆之前那一刻的决断，而不是回到任何一本教科书。"
 POL_reward_the_majors_clique:0 "奖赏上校集团"
 POL_reward_the_majors_clique_desc:0"斯瓦韦克在公室里翻完了候选人名单。什米格利-里兹的人马被逐出行政序列后留下的空缺，一直由各派系临时填补，效率低下且忠诚可疑。他决定把赌注押在旧人身上——那些在跟随卡齐米日·斯维塔尔斯基、又被排挤出权力走廊的上校们。斯维塔尔斯基被从克拉科夫省长的闲职上召回，接手政府。"
