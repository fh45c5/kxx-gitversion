 POL_non_partisan_unions:0 "工会无党派"
 POL_non_partisan_unions_desc:0"工会联盟与各社会主义政党之间的正式联系被逐一切断，莫拉切夫斯基的理由是行政性的，只要工会的理事会仍然按党派比例分配席位，任何一次关于工时或工资的投票都会变成华沙政治走廊的延伸。但这一措施的实际效果远不止行政层面。PPS的旧同僚指责他要把工会变成一台没有政治意志的机器，莫拉切夫斯基的回应则指向索雷尔式的区分，工会不应该为政党服务，它是生产者在其劳动中形成的共同体。"
 POL_all_workers_patriotic:0 "全体工人皆爱国"
 POL_all_workers_patriotic_desc:0"“爱国”一词不再指向对华沙政府的忠诚，而是指向工人对波兰生产机体完整性的直接责任。莫拉切夫斯基的论点是：一个矿工维护矿井的运转，不是在为某个部长服务，而是为波兰独立强大奋斗。联盟的宣讲材料将“爱国”从政治修辞中剥离出来，附着于具体的行为。当国家的边界和工厂的围墙由同一批人守卫时，词的含义会由使用它的人重新决定。"
 POL_establish_peoples_democracy:0 "建立人民民主"
 POL_establish_peoples_democracy_desc:0"人民民主的制度设计在莫拉切夫斯基的方案中始终缺乏完整的成文宪法。其基本单元是工厂委员会和地域公社，代表通过公开表决产生，但候选人资格受到阶级出身的审查。中央层面设有一个由各公社和产业委员会代表组成的常设会议，负责协调经济计划和对外防务。莫拉切夫斯基论证说，这种设计避免了议会民主中“形式平等掩盖实质不平等”的缺陷，因为投票权不再附着于抽象公民身份，而附着于生产者在社会劳动中的位置。"
 POL_nationalization_and_communalization:0 "国有化和公社化"
 POL_nationalization_and_communalization_desc:0"国有化与公社化在莫拉切夫斯基的经济纲领中被设计为两条并行的轨道，关键工业收归国家所有，但管理权不由部委单独行使，而是由国家代表、工厂委员会代表和技术人员组成的三方理事会共同掌握。与此同时，地方消费合作社和中小企业被鼓励转为公社所有制，由工人集体直接管理，不受国家计划指令的约束。这一安排的意图是在重工业和基层经济之间建立一种分工，国家掌握战略杠杆，公社承担日常供给。"
 POL_gradual_regime_transition:0 "渐进体制转型"
 POL_gradual_regime_transition_desc:0"国家工党宣布分三阶段完成向工团主义共和国的过渡：第一阶段以劳动营与行业委员会网络覆盖全国工业中心，第二阶段将摄政时期的咨询性经济委员会改造为拥有立法动议权的行业院，第三阶段在德国与奥地利的战争压力缓解后，以全民公投确认国家工党对制宪会议的绝对主导。苏里格拒绝设定具体时限，理由是“波兰的独立不是一次投票，而是一代人的组织训练”。每一阶段都以外敌的压力浮动决定，使转型节奏在事实上与中欧帝国的战局波动绑定。"
 POL_achieve_state_socialization:0 "实现国家社会化"
 POL_achieve_state_socialization_desc:0"“国家社会化”是斯克瓦尔钦斯基全部纲领的终点。每一个社会团体都感到自己对国家存续负有责任，并不吝为它付出努力。行会、合作社、青年组织和地方议会都被纳入一个统一的义务网络，其成员资格与国家服务记录挂钩。国家的强制力退居幕后，取而代之的是由先锋队精英传导的社会压力。波兰不再是一个需要被统治的对象，而成为一个被其公民持续生产出来的共同体。"
 POL_vision_of_the_total_state:0 "总体国度之愿景"
 POL_vision_of_the_total_state_desc:0 ""
 POL_peoples_capitalism:0 "人民资本主义"
 POL_peoples_capitalism_desc:0"普里斯托尔从不认为“人民资本主义”是资本主义。新波兰的经济由参与者共同持有，但没有人能凭份额对行动方向提出异议。国营重工业的股份被拆分为小额凭证，分配给工厂工人与合作社社员，股息以现金支付，投票权则统一委托给国家经济总署行使。当一个工人手里握着自己工厂的股票时，他就不会会在德国人到来时第一个举手投降。"
 POL_welfarist_safety_net:0 "福利主义托底"
 POL_welfarist_safety_net_desc:0"普里斯托尔保留了旧劳动法中对工人相对有利的条款，同时用政府专员取代了被党派把持的委员会。福利必须发放，但发放福利的机构不能成为任何党派的据点。养老金、失业救济和公共工程就业被统一纳入国家社会保险总署的渠道，工人拿到的是钱，政权拿到的是名单。有了福利主义托底，工人自然会支持我们的统治"
 POL_rule_of_brutal_oppression:0 "暴力高压统治"
 POL_rule_of_brutal_oppression_desc:0"新波兰的经费向军警装备和训练倾斜，警察的成员从退役军官中招募。无尽的传唤、审查、拘留笼罩了波兰。街头越来越安静下来，恐惧变得日常而精确，而统治也日渐稳固。"
 POL_hyperindustrialization_under_authority:0 "威权指导下的超工业化"
 POL_hyperindustrialization_under_authority_desc:0"斯维塔尔斯基的经济计划不追求利润，不追求就业，甚至不追求消费品增长。它追求的是钢产量翻番和铁路和公路网运载军队的能力。私营工厂没被没收，它们被纳入总署订货网络，接受固定价格和优先原料，一切都要服务于波兰国家和人民的“共同利益”。"
