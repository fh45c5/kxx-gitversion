l_simp_chinese:
 POL_sweetheart_general_regime:0 "甜心将军的政权"
 POL_sweetheart_general_regime_desc:0"华沙的政客们在争论纲领，但人称“甜心将军”的杜戈绍夫斯基只关心谁还愿意在午夜之后陪他骑马穿过公园。他不是独裁者，甚至算不上真正的党派人物——曾任毕苏斯基的副官、外交大使、利沃夫咖啡馆里用果汁兑水假装喝酒的诗人。但当波兰的体面政治在柏林与华沙之间反复窒息时，一个“没有倾向”的人恰恰成了唯一不引起任何一方立即敌意的人选，让甜心将军来吧。他不会带来意识形态，他会带来一个以雪茄、马匹和军团忠诚黏合起来的政权。至于它能否在维斯瓦河上活过下一个秋天，那是另一个问题。"
 POL_socialist_party_second_chance:0 "社会党的第二次机会"
 POL_socialist_party_second_chance_desc:0"拉伊蒙德·雅沃罗夫斯基从不觉得这两件事有什么矛盾，他是社会党人——不到二十岁就在街头和监狱里做社会党人，指挥过战斗组织，蹲过沙皇的流放地。他也反共——手下的战斗队在华沙的集会上打死了共产党活动家比亚利。在他看来，共产主义者不是同志，是另一条路上的人。如今社会党的人终于承认，对付街垒对面那些人，需要一个他这样不拘小节的人。"
 POL_syndicalism_in_service_of_the_nation:0 "工团主义为国家服务"
 POL_syndicalism_in_service_of_the_nation_desc:0"延德热伊·莫拉切夫斯基认为，波兰等不起随意和无纪律的罢工。流亡巴黎的同志们以为推翻柏林就能换来自由，可维斯瓦河两岸的工厂一旦停转，德国人甚至不需要派一兵一卒。工团主义是好的，但它要服务于国家重建的节奏。一个连枕木都铺不齐的国家，谈什么无产阶级的明天？"
 POL_rise_of_the_national_labor_party:0 "国家工党的崛起"
 POL_rise_of_the_national_labor_party_desc:0"流亡巴黎的工会联盟总书记耶日·苏里格已返回华沙，将分散于矿区和铁路工场中的工团小组整合为统一的政治力量。波兰工团主义联盟的旧纲领——以行业工会取代党派政治、以工人委员会承担国家职能——在占领当局默许的缝隙中获得了公开传播的契机。苏里格凭借战前主编《劳动团结》与《工人阵线》的组织经验，把罢工基金、合作社网络与地下宣传渠道合并为一套动员机器。国家工党由此从工会联盟的母体中脱出，宣称自己既承接毕苏斯基左翼的独立传统，又以工团主义的职业代表制对抗柏林强加的君主秩序。"
 POL_return_of_the_holy_son:0 "圣子的回归"
 POL_return_of_the_holy_son_desc:0"瓦莱里·斯瓦韦克在华沙的重新露面，终结了上校集团长达数年的裂痕。旧宪法的起草者、毕苏斯基遗嘱中那个被刻意搁置的名字，如今被萨纳齐亚各派同时奉为“圣子”——一个从殉道者边缘归来的象征。没有任何一个派系敢于公开否认他对“统帅”遗产的解释权。继承人的问题被暂时搁置，但每个人都清楚，圣子的加冕只是序章，真正决定波兰走向的，是接下来谁站在他身后。"
 POL_beks_victory:0 "贝克的胜利"
 POL_beks_victory_desc:0"约瑟夫·贝克已经不再只是一个外交部长，毕苏斯基留下的遗产被他执行得如此彻底，以至于政府的顾问们换了又换，议会的多数派聚了又散，而贝克始终坐在恰普斯卡街的办公室里，用一份又一份备忘录指导者国家。自然而然，在如此危局，只有他的声音能决定波兰的未来。然而，毕苏斯基没有指定继承人，贝克也没有指定。他巩固了权力，却从未回答那个问题——当他自己不再坐在那张办公桌前，恰普斯卡街的平衡术将由谁来继续。华沙的走廊里开始流传几个名字，每一个都代表一种不同的波兰......"
 POL_new_king_in_the_castle:0 "城堡里的新王"
 POL_new_king_in_the_castle_desc:0"没人数的清伊格纳齐·莫希奇茨基在贝尔维德宫的办公室里坐了多少年，毕苏斯基把重任交给他时，也没人问过他是否愿意。宪法把广泛的权力交到总统手中，但权力的实际重量取决于谁站在总统身后。希米格维控制着军官团，上校集团的老人们控制着地方网络，而城堡控制着宪法文本和任免权......几股力量在毕苏斯基去世后形成了一种不稳定的平衡，每一方都在等待另外的势力先露出破绽。莫希奇茨基不急于打破这种平衡，他对德国领土要求的拒绝是明确的，但对波兰将走向何种制度，他尚未给出答案。华沙的走廊里流传着各种猜测，但没有一个猜测能解释为什么总统最近把更多时间花在了化学研究所的实验室里。"
 POL_first_free_elections:0 "第一次自由选举"
 POL_first_free_elections_desc:0"旧政权的崩溃来得比任何人预料的都快，虽然行政机构还在运转，但命令已经传不到地方；军队还在营房里，但军官团不知道该向谁效忠。填补真空的是一个在危机中勉强拼凑起来的选举联盟——民主党提供了城市知识分子和行政专家，保守党提供了乡村网络和地方金库，双方在议会中的席位相加足以主导议程，虽然分歧重重，但他们都认为任何试图恢复强人统治的尝试都会把国家重新拖回僵局，而僵局在这个位置上意味着外部势力找到介入的借口。崭新的波兰共和国的合法性将不再来自军营或宫殿，而是来自一张一张清点出来的选票，波兰的第一次自由选举即将揭晓结果！"
 POL_a_new_augustus:0 "一位新奥古斯都"
 POL_a_new_augustus_desc:0"伟大的波兰已经沉沦太久了，城堡里的国王和枢密院代表贵族，他们的权力来自地产、教区和旧宪法的残余；议会里的自由派和温和左翼代表城市与工业，他们来势汹汹却软弱无力；军团名册上的上校集团则代表军队和萨纳奇亚官僚......罗马在亚克兴之前也是这副样子：元老院、执政官和军团各自发号施令，直到一个人把三枚印章熔成一枚。波兰需要的不是第四份妥协方案，而是一个能让这三条通讯线同时沉默下来的人——不管他从城堡的办公室走出来，从议会的走廊走出来，还是从军团的检阅台上走下来，简而言之，波兰需要一位新奥古斯都。"
 POL_zeligowski_coup:0 "热里戈夫斯基政变"
 POL_zeligowski_coup_desc:0"华沙的卫戍部队便接到了一道未经总参谋部签发的调动令。热利戈夫斯基没有停留，他从安杰约沃庄园直接进入华沙。电话局、火车站和贝尔维德宫被同一批人接管，他们曾在1920年跟随他占领维尔纽斯，也曾在1926年为他清理过政变的残局。内阁已被解散，议会被勒令休会。热利戈夫斯基在贝尔维德宫的阳台上宣读了一份简短的公告，宣布成立“民族统一临时政府”。"
 POL_dream_of_a_superpower:0 "超级大国之梦"
 POL_dream_of_a_superpower_desc:0"波兰的困境不在于领土不够大，而在于国家权力从未真正抵达它的边界。华沙的部委被德国顾问的备忘录牵着走，东部的县政府听命于地方庄园而非首都，而议会里的争吵掩盖了一个事实——这个国家在柏林眼中只是一个缓冲地带。阿道夫·博琴斯基不属于上校集团，也不信任贝雷扎营那套手段，他从萨纳奇亚的失败中只取走一个结论：没有强大的行政中枢，任何关于波兰地位的谈论都是空话。他设想的“超级大国”不是版图上的帝国，而是一个能把军队、外交和税收从党派交易中剥离出来、置于专业官僚手中的国家。与此同时，他坚持县与公社的自治不能废除，因为正是地方层面的公民参与，才使国家权力不至于退化为警察的任意决定。"
 POL_polish_savinkovism:0 "波兰的萨文科夫主义"
 POL_polish_savinkovism_desc:0"卡罗尔·温季亚戈尔斯基看到，波兰的东方政策正陷入僵局。毕苏斯基的联邦构想停留在1920年的里加条约之前，普罗米修斯计划在军事预算的削减中逐渐褪色，而政府满足于在柏林与莫斯科之间维持脆弱平衡。他曾在切尔诺夫齐的第八集团军司令部里与萨文科夫共事，见过他如何把“第三俄罗斯”的口号变成一套可操作的组织方案。温季亚戈尔斯基带着这套方案回到了政治视野，波兰不需要在柏林和莫斯科之间选择。"
 POL_second_spring_of_the_strongmen:0 "地头蛇的第二春"
 POL_second_spring_of_the_strongmen_desc:0"很久以前，华沙的实际权力就散落在枢密院、德国顾问和那个贵族主导的跨党派集团之间。雅努什·拉齐维乌不需要走进议会去争论，因为没有他的配合，国家连一列木材车皮都调度不动。如今，权力的邀请送到了他在比耶兰斯卡街的宫殿。这位地头蛇只是带着账本和马耳他骑士团的徽记走进枢密院，把庄园里运转的那套秩序，平移到王国的文件之上。"
 POL_a_national_revolution:0 "一场民族革命"
 POL_a_national_revolution_desc:0"毕苏斯基的棺木入土未久，上校集团内部便有人开始谈论“净化”。布罗尼斯瓦夫·皮耶拉茨基没有等待辩论结果。他以内政部档案中关于乌克兰军事组织渗透的记录为凭据，在东部各省警署与驻军之间建立起一条绕过总理府的指挥链。当华沙还在争论少数民族自治的措辞时，皮耶拉茨基已经用一趟利沃夫之行完成了与地方驻军和行政官员的私下串联。回到首都时，他手中握有的已不是一份政策草案，而是一份名单——上面写着哪些省长、哪些警官、哪些萨纳齐亚同僚必须在“民族优先”的新秩序中让出位置。革命不需要街垒，只需要档案柜和驻军司令部的电话线。"
 POL_hedonism_is_revolution:0 "享乐即革命"
 POL_hedonism_is_revolution_desc:0"甜心将军从不相信清教徒式的政治，雪茄、马匹、午夜的马队和利沃夫的咖啡馆，在他看来比任何纲领都更接近生活本身。把享乐抬到革命的高度吧，这个政权不打算用意识形态改造你的灵魂，它只要求你别挡路。左右两派都可以继续争吵——将军会在下一场晚宴上同时邀请他们。"
 POL_trade_union_communism_for_all:0 "工会共产—全都来吧！"
 POL_trade_union_communism_for_all_desc:0"有人警告将军，工会和共产主义是政权的威胁。甜心将军耸耸肩——那就都来吧。他只在乎华沙的工厂能不能运转、铁路能不能准点。让工会派代表进来，让共产主义者发言，让他们互相牵制，然后由将军在中间签文件。一个没有倾向的人，恰恰最擅长让所有倾向为他所用。"
 POL_romantic_national_charterism:0 "浪漫民族宪章主义"
 POL_romantic_national_charterism_desc:0"将军让法学家起草一部宪章，又让诗人往里面塞进波兰的秋天、波兰骑兵的冲锋和利沃夫酒吧的烟雾。形式上它是一部宪章，内容上它是一首民族浪漫主义的诗。左右两派都能在里面找到自己愿意读的段落，民族主义者读到“波兰的灵魂”，宪章主义者读到革命和权力。"
 POL_socialism_without_democratic_filth:0 "社会主义无民主污秽"
 POL_socialism_without_democratic_filth_desc:0"议会走廊里的痰盂该倒了，雅沃罗夫斯基一直觉得，社会主义最脏的地方就是代表席上那些用“程序”擦过嘴的手。之前他带着自己的人马离开PPS时，骂的就是这个。党把时间花在跟贵族讨价还价上，而不是把贵族从账本上划掉。现在他回来了，带着一个更简单的方案。社会主义不需要民主的污秽来证明自己干净——它只需要一个不再需要证明的結果。"
 POL_total_control_over_unions:0 "对工会的全面控制"
 POL_total_control_over_unions_desc:0"CZKZZ（中央阶级工会协会）当年是雅沃罗夫斯基亲手从PPS里撕出来的，现在他要把它缝回自己的袖口里。工会不是辩论俱乐部，雅沃罗夫斯基在旧工会分裂时就看清了这一点。谁掌握罢工基金，谁就掌握罢工本身。加强控制并非消灭工会，是让工会只剩下一个功能：把工人的愤怒翻译成命令。"
 POL_integrate_the_republic_restoration_society:0 "整合共和国修复协会"
 POL_integrate_the_republic_restoration_society_desc:0"莫拉切夫斯基在就任后不久便将工会联盟的理事会、公共工程部的技术官僚以及部分起义军官的代表纳入了一个常设协调机构。该机构不取代原有各部，而是在物资分配、铁路调度和军工订单排序上拥有优先裁决权。协会的章程措辞刻意含混，既未声明自己是临时机构，也未声明是永久机构，莫拉切夫斯基对此的解释是，机构的寿命取决于它要修复的东西什么时候修好。"
 POL_uniting_the_left:0 "既联合左派……"
 POL_uniting_the_left_desc:0"国家工党中央委员会向华沙、罗兹和顿布罗瓦煤矿区的社会党地方组织与激进工会发出合作备忘录，承诺在未来的工人代表机构中为左翼保留固定席位，以换取其对工团主义行业自治纲领的承认。协议同时附有一份秘密附件，参与联合的左翼团体须解散独立的武装纠察队，将罢工基金移交国家工党财务委员会统一调度。毕竟，缺乏组织纪律的左翼只会被柏林用作分化波兰工人的楔子。"
 POL_uniting_the_right:0 "……又统战右派"
 POL_uniting_the_right_desc:0"国家工党向基督教民主党议会党团和部分萨纳齐亚旧军官抛出橄榄枝，右派保留教会财产与军官团荣誉法庭的自治权，国家工党则获得对国防工业与铁路工会的任命权。协议在克拉科夫一家修道院的地下室签署，见证人包括两名前毕苏斯基军团上校。右派接受这笔交易的理由是柏林和维也纳正在扶持乌克兰民族主义民兵，而国家工党承诺将右翼地方自卫队纳入未来的国家劳动营体系，使其获得合法武器与薪饷。"
 POL_realize_pilsudskis_vision:0 "实现毕苏斯基的愿景"
 POL_realize_pilsudskis_vision_desc:0"斯瓦韦克在议会大厦的妥协只维持了数月，上校集团旧部很快发现，圣子需要的不是集体领导，而是一个能执行纲领的人。亚当·斯克瓦尔钦斯基被推上前台——截去的双腿没有妨碍他成为萨纳齐亚道德革命最完整的阐述者。斯瓦韦克提名他执掌政府，各派系无人反对。一个坐轮椅的人既不会威胁军方的实际权力，又能安抚要求“净化”的激进青年。斯克瓦尔钦斯基上任第一件事，就是把元帅生前未及推行的教育纲领从文件柜里搬出来，将国家重新定义为塑造公民的学校。"
 POL_return_to_socialist_roots:0 "回归社会主义根源"
 POL_return_to_socialist_roots_desc:0"斯瓦韦克把权杖交到亚历山大·普里斯托尔手中时，集团内部并非没有异议。一个曾主张执行通缩政策、削减社会福利、站在大资本一边的人，如何能代表社会主义的回归？但普里斯托尔的履历就是回答：1904年华沙街头的首批战斗小队、1905年针对诺尔肯的刺杀行动、贝兹达尼那列被炸开的邮政车厢。他从不认为社会主义是一种需要论证的学说，而是一种需要执行的手艺。当他说要回归时，他指的是回到炸弹在手中引爆之前那一刻的决断，而不是回到任何一本教科书。"
 POL_reward_the_majors_clique:0 "奖赏上校集团"
 POL_reward_the_majors_clique_desc:0"斯瓦韦克在公室里翻完了候选人名单。什米格利-里兹的人马被逐出行政序列后留下的空缺，一直由各派系临时填补，效率低下且忠诚可疑。他决定把赌注押在旧人身上——那些在跟随卡齐米日·斯维塔尔斯基、又被排挤出权力走廊的上校们。斯维塔尔斯基被从克拉科夫省长的闲职上召回，接手政府。"
 POL_awaken_the_national_spirit:0 "唤醒国民精神"
 POL_awaken_the_national_spirit_desc:0"米耶奇斯瓦夫·吉纽什在皮恩克纳街的公寓里接待了贝克的信使，贝克的新政权需要一个能让波兰人在柏林的压力下仍然相信自己有理由存在的叙事，而吉纽什从塞得港带回的笔记里有这种东西。他在埃及四十年，管理过苏伊士运河的车间和塞得港的淡水厂，也管理过开罗和巴黎的神智学通信网络。他见过各种帝国在运河区来来去去，知道一个民族如果只靠关税和军队维持存在，它早晚会被人用同样的工具毁灭。波兰的复兴不是领土问题，是灵魂问题。贝克给了他一间办公室，并建立了“民族精神研究所”，波兰民族精神的唤醒工程，就从这里开始。"
 POL_maintain_the_triumvirate_alliance:0 "维持三巨头联盟"
 POL_maintain_the_triumvirate_alliance_desc:0"莫希奇茨基做了一件他过去一直避免做的事，就是把希米格维和贝克同时请到贝尔维德宫的同一张桌子前。三个人之间的分歧并不秘密——希米格维想加速军队现代化并扩大总参谋部对民政的监督权，贝克坚持外交部的自主权不容任何军人插手，而莫希奇茨基关心的是宪法赋予总统的协调权不被任何一方架空。现在军队改革归希米格维，外交政策归贝克，而涉及两者交界的事项，则须经总统办公室协调。这份三巨头的协议没有指定谁在三人中居于首位，但它规定了任何一方在做出重大决定前须通知另外两方，波兰终于在这个三角形的控制下稳定了下来，不过，三个人总需要一个代理人，他们选择了毕苏斯基的人——前内政部长、善于使用警察的专员费利恰·斯瓦沃伊·斯克拉德科夫斯基。"
 POL_regime_of_the_disciples:0 "门徒派的政权"
 POL_regime_of_the_disciples_desc:0"尤金纽什·克维亚特科夫斯基不是军人，不是政党领袖，他的权力来自另一套东西。他在霍茹夫氮肥厂当技术总监时，莫希奇茨基是总经理；莫希奇茨基把他从工厂调进财政部时，看中的正是那种在实验室和车间里养成的习惯。四年计划、格丁尼亚港、中央工业区......这些项目不需要议会的掌声，只需要总统办公室的签字和银行柜台的配合。但如今波兰不是一张可以按工程图纸施工的空白地。农民党在乡村的合作社网络仍在运转，工团主义者在城市工会里保留着自己的印刷所，而体制内的老人们对“技术官僚”这个词始终抱有戒心。克维亚特科夫斯基面前摆着两条路：向工会和合作社敞开经济决策的大门，让计划从车间和村社向上汇总；或者把权力收得更紧，用国家信贷和税收杠杆直接指挥生产，同时给反对派留出足够的面子，让他们在委员会里说话而不是在街头。两条路都能建成工厂，但建成的工厂将属于不同的波兰。"
 POL_rise_of_the_labor_clubs:0 "劳工俱乐部的崛起"
 POL_rise_of_the_labor_clubs_desc:0"劳工俱乐部在1925年成立时只有五名议员，连在议会里单独提出动议所需的票数都凑不齐。巴特尔、津德拉姆-科希亚乌科夫斯基和维斯卢赫从人民党“解放”派中脱离出来，他们认定议会里的党团交易已经和乡村的实际需求脱节。这个俱乐部没有地方支部，没有报纸，没有青年翼，它只是一个议会内部的协调小组，成员之间靠每周一次的午餐会交换意见。但巴特尔本人在利沃夫理工大学的讲席给了他一样其他小党派领袖没有的东西，一个不需要依靠政党机器也能维持的公共身份。毕苏斯基派人来找他时，劳工俱乐部的午餐会已经持续了将近一年。政变后他被任命为总理，因为“议会立法、政府执行”的分工原则恰好符合毕苏斯基对议会政治的最低要求。"
 POL_democratic_party_majority:0 "民主党多数"
 POL_democratic_party_majority_desc:0"米科瓦伊·夸希涅夫斯基当选民主党最高委员会主席时，他的履历上还带着旧政权的印记。他是参议院副议长、三次省长的任期、军团老兵的名册。但这些印记在民主俱乐部看来恰恰是一种资产，一个从体制内部走出来的人，比任何在野多年的反对派都有优势。民主党在城市的自由职业者和教师投给它的票，加上保守党在中小城镇和农业省份的选区网络，两者相加刚好够在关键表决中形成多数。如今，民主党赢得了第一次选举的成功。"
 POL_conservative_election_victory:0 "保守党胜选"
 POL_conservative_election_victory_desc:0"民主党在第一次自由选举中拿下了大部分城市，但乡村和中小城镇的选票流向了另一个方向。旧政权的崩溃留下了一个过于空旷的议会，需要有另一种声音来填补，而波兰人口的大多数都是农民。不过，虽然保守党赢得的席位让她轻松获得了大部分地区的选举胜利，但两位主要的思想提供者——一位是来自东部边境的亲王，一位是来自塔尔努夫的作家——各自代表了一条不同的保守主义路径。亲王相信制度设计可以修复崩溃后的国家，作家相信只有一场精神革命才能让国家配得上它的使命。保守党的议会党团在两者之间保持着一种刻意的模糊，但哪一条路径会在实际的政治压力下胜出呢？"
 POL_establish_the_camp_of_national_unity:0 "建立民族统一营"
 POL_establish_the_camp_of_national_unity_desc:0"亚当·科茨站到台前前，以民族统一营负责人的身份宣布了一个新势力的诞生。他手里攥着三样东西：波兰军团老兵协会的名册、波兰的金融网络系统，以及上校集团在总参谋部与省警察局之间的电话线。他没有把这三样东西交给议会里的任何一个派系，而是按军团编制重新编组。退伍军官担任地方分区联络官，右翼青年编入青年翼，愿意接受“国家高于派系”的技术官僚被安置在营的经济委员会。科茨在广播中避开了“党”这个词，只说这个营的指挥权暂时由他行使，直到新秩序的最高负责人出现。"
 POL_first_marshal_second_figure:0 "第一元帅，第二人物"
 POL_first_marshal_second_figure_desc:0"博古斯瓦夫·米耶津斯基回到波兰报的编辑部，把过去十年间为毕苏斯基元帅起草的演讲稿、宪法释义和BBWR的竞选纲领从档案柜里按年份重新编排，然后开始逐一拜访那些仍握有实权的岗位。访问的成果不写在任何公报上，参议院元帅的席位和民族统一营最高委员会主席团的位置同时摆在他面前。第一元帅的名字刻在纪念碑上，第二人物的工作是决定纪念碑上的铭文由谁来写。"
 POL_authorize_the_presidents_cabal:0 "授权总统密党"
 POL_authorize_the_presidents_cabal_desc:0"希米格维和老朋友斯坦尼斯瓦夫·维特凯维奇坐在一起，像多年前在扎科帕内画室里那样，等着对方看完自己写的东西。他将“维护国家统一”的全权授予一个由他亲自指定的委员会，该委员会不列入政府编制，不向议会报告，其成员名单只存在于维特凯维奇的私人笔记里。总统密党的会议地点随画展和讲座的日程变动，总统给了密友一纸授权，密友还给总统的是一张不在任何公文里出现的人名网。"
 POL_decentralized_direct_democracy:0 "去中心化直接民主"
 POL_decentralized_direct_democracy_desc:0"热利戈夫斯基废除了旧“合并法”，他把县（powiat）和公社（gmina）的议事会从省长的监护下解放出来，恢复村社大会对道路、学校、诊所和森林采伐的直接表决权。吵闹的公社比安静的总督府更接近秩序，这才是我们伟大波兰人的制度。"
 POL_cooperate_with_panslavists:0 "同泛斯拉夫主义者合作"
 POL_cooperate_with_panslavists_desc:0"热利戈夫斯基不需要等待莫斯科的许可，他沿着战前的泛斯拉夫会议网络，与布拉格、贝尔格莱德和索非亚的斯拉夫俱乐部恢复了通信，交换的内容从语言教材到巴尔干半岛的军事信息。那些相信斯拉夫人应该自己决定自己事务的人，不管他们挂什么旗，即使是共产主义者都是我们的朋友。"
 POL_national_self_sufficiency:0 "民族的自给自足"
 POL_national_self_sufficiency_desc:0"波兰的木材、锌锭和酒精出发，指向布拉格、贝尔格莱德和索非亚，换回机床、铁砂和南斯拉夫的铜。斯拉夫民族统一得靠每个公社的仓库里都有不经过柏林和维也纳就能拿到的东西，自给自足是让斯拉夫世界的每一个节点在面向日耳曼或其他压力时，有自己的底气。"
 POL_implement_separation_of_church_and_state:0 "实施政教分离"
 POL_implement_separation_of_church_and_state_desc:0"博琴斯基在《政治》杂志上写过，宗教是文化的基础，不是政纲的条款。他推动的法案把主教任命权交还罗马，教产由各教区自行管理，神父不再兼任县公署的登记员，教区学校的神学课程与世俗课程分开管理。把信仰从政治里移出去，信仰才能回到它该在的地方。"
 POL_end_of_centralization:0 "终结中央集权"
 POL_end_of_centralization_desc:0"博琴斯基把合并法称为“华沙对省份的战争”。他推动的替代法案把县议会的选举权扩大到所有纳税居民，省长的任命须经县议会联席会议确认，地方金库保留税收的三成，不再上解华沙。一个连自己县里道路和学校都做不了主的国家，不可能在国外被称为强国。中央集权带来不了力量，它只是恐惧地方差异的标志。"
 POL_rule_of_confidants:0 "密友的统治"
 POL_rule_of_confidants_desc:0"温季亚戈尔斯基从不掩饰他与萨文科夫的关系，1917年在切尔诺夫齐的第八集团军司令部，他是萨文科夫最信任的联络官；十月革命后，他带着萨文科夫的密令穿过基辅的德国监狱和白军的防线，在华沙为“第三俄罗斯”的方案寻找落脚点。萨文科夫教会他一件事——革命的目的是重建，不是破坏；而重建需要一张能运作的密友网络。他的统治依赖的不是职位，是那些在切尔诺夫齐、基辅和华沙战俘营里与他共过事的人。"
 POL_musketeers_take_power:0 "火枪手掌权"
 POL_musketeers_take_power_desc:0"温季亚戈尔斯基在雅沃鲁夫的露天会议上讲话时，斯特凡·维特科夫斯基从不坐在听众席里。当温季亚戈尔斯基因伤寒卧床三周时，火枪手的信使已经接管了东方广播电台的短波频段和维尔纽斯联络站。波兰萨文科夫主义的事业需要工程师，火枪手版本的萨文科夫主义不靠群众集会来传播，靠的是情报、间谍和炸药。两种萨文科夫主义，只有一种能活到最后，而现在，火枪手胜出了。"
 POL_protect_the_notables:0 "保障权贵"
 POL_protect_the_notables_desc:0"库曼的锯木厂、斯帕诺夫的林场、涅博罗夫的宫殿，以及各省与之相连的庄园，都被逐条列明，要求国家以法令形式确认其完整性与不可侵犯。权贵的庄园网络承担了地方上的就业、运输与救济，作为交换，华沙不得以任何名义——无论是土地改革、战时征用还是财政摊派——触碰这份清单。议会里的贵族们看得很清楚，投票反对这份文件，等于投票反对自己脚下的土地。"
 POL_allies_of_industry:0 "实业家盟友"
 POL_allies_of_industry_desc:0"拉齐维乌需要有人把煤从西里西亚运到加工厂，把木材从东部林区运到港口，而他的庄园恰好控制着中间那些铁路支线和装卸场站。实业家们获得的是稳定的运力与地方上的治安保障，付出的则是将部分董事会席位交给公爵信任的代理人。有了实业家盟友，拉齐维乌的事业将更加稳固。"
 POL_united_national_radical_camp:0 "统一民族激进阵营"
 POL_united_national_radical_camp_desc:0"民族激进阵营在之前一直是内政部档案里的重点监视对象，皮耶拉茨基在贝雷扎营的囚室里见过他们的领导人，也在《晨报》的版面上读过他们的纲领。不过，这些人对国家的敌意来自被排斥，而不是来自原则错误。于是释放令与邀请函同时发出，只要承认民族统一高于派系清算。民族党内的青年翼、民族激进阵营中愿意放下街头战术的一支，以及萨纳齐内部那些早已不耐烦议会程序的军官，如今都是“民族统一阵营”。"
 POL_embrace_charter_totalitarian_ideas:0 "接纳宪章极权主义思想"
 POL_embrace_charter_totalitarian_ideas_desc:0"皮耶拉茨基从不读理论著作，但他从第三国际那些极权主义的公文里挑出几样东西，交给内政部的法学家改写成波兰文。领袖的意志即为国家意志的最高解释，公民的自由止于“民族共同善”所划定的边界。宪法中关于总统权力的条款被重新解释，议会的立法权被压缩为咨询性的，法院的独立性以不触及国家利益为前提，这就是波兰“民族纪律的宪章”。"
 POL_parisian_tea_break:0 "巴黎茶歇"
 POL_parisian_tea_break_desc:0"华沙与巴黎之间隔着柏林，但甜心将军嗅到了另一种可能，既然工团主义的法国需要打破外交孤立，而波兰需要在德国之外多一条呼吸的缝隙，那为什么不在巴黎喝一杯茶？将军会带着他的诗人名声和外交履历去，不谈主义，只谈铁路、贸易和“互相不添麻烦”。"
 POL_omniscient_omnipotent_omnibenevolent:0 "全知、全能、全善"
 POL_omniscient_omnipotent_omnibenevolent_desc:0"甜心将军的政权不打算扮演上帝，全知交给官僚和技术人员，全能交给军队，全善交给神父和诗人。将军本人只负责一件事，让这套拼装起来的机器不至于在维斯瓦河上散架。他笑得越甜，这台机器就越不需要一个救世主。"
 POL_modern_legion_chivalry:0 "现代军团骑士精神"
 POL_modern_legion_chivalry_desc:0"毕苏斯基的遗产还在，但他们的马刀砍不进1930年代的坦克。甜心将军要做的，是把“军团骑士”从一种怀旧变成一种现代军事美德。纪律、机动、对指挥官的私人忠诚，以及一种近乎浪漫的冒险意志。让骑兵的传统活在装甲部队的条令里，让将军本人继续做那个可以半夜骑马检阅部队的“甜心首长”。"
 POL_conservative_remnants:0 "终结保守派残党"
 POL_conservative_remnants_desc:0"那些“跨党政治集团”的老爷们，那些在摄政议会里数着自家庄园亩数投票的贵族，他们以为社会主义者的礼貌是软弱，他们会在宴会上跟你碰杯，然后在选区划分上捅你一刀。对付残党不需要审判，需要的是行政。财产登记、税务稽查、一份“通敌嫌疑”名单......让残党灭亡吧。"
 POL_pilsudski_alpha_and_omega_of_socialism:0 "毕苏斯基，社会主义的阿尔法与欧米茄"
 POL_pilsudski_alpha_and_omega_of_socialism_desc:0"毕苏斯基不是理论家，雅沃罗夫斯基比谁都清楚。元帅留给波兰的是一种方法：用军队的纪律去执行社会的意志，用情报的耐心去清理政治的垃圾。雅沃罗夫斯基在工人防卫委员会里学会了这一课，社会主义如果不能在街头和战壕里保护自己，就什么都不是。毕苏斯基是阿尔法，是起点——一个社会主义者必须首先是波兰人，才能是别的什么。欧米伽是他雅沃罗夫斯基，他要完成波兰的社会主义事业。"
 POL_defeat_the_communist_specter:0 "战胜共产主义幽灵"
 POL_defeat_the_communist_specter_desc:0"波兰社会主义不欠布尔什维克任何东西。共产主义者说他们是国际主义者，他们渗透进乡村，带着枪和钱，把波兰工人的力量引出波兰。对付这种幽灵不能靠辩论，要靠警察的档案和民兵的棍棒。波兰社会主义者自己会处理自己的叛徒，不需要外人来教。"
 POL_strengthen_interventionism:0 "强化干预主义"
 POL_strengthen_interventionism_desc:0"罢工权是工人斗争的成果，但一个被外国资本和本国剥削阶级同时卡住脖子的国家，无法承受将罢工作为常规政治武器的代价。波兰的干预主义不采取全面国有化的形式，而是以“托管”和“仲裁”为核心。国内外自由派批评这是用行政命令替代市场信号，但莫拉切夫斯基在公共工程部的会议上回应称，波兰面对的不是一个需要优化的市场，而是一个需要先存在的工业体系。"
 POL_seek_self_sufficiency:0 "寻求自给自足"
 POL_seek_self_sufficiency_desc:0"华沙的工业界长期依赖德国供应的机床、轴承和化工半成品，信贷则经由柏林银行体系周转。如今西里西亚煤炭优先供应国内电厂和军工，罗兹的纺织产能转向军用帆布和帐篷材料，利沃夫至格丁尼亚干线的电气化被列为最高优先级，即便这意味着引入美国资本。自给自足的目标不是关闭波兰经济，而是使柏林在决定是否对波兰施加经济压力时，必须计算波兰的承受能力。"
 POL_unify_the_christian_labor_movement:0 "统一基督教工人运动"
 POL_unify_the_christian_labor_movement_desc:0"苏里格以仲裁人身份介入基督教工会与工团主义行业委员会之间的管辖权争端，矿区与工厂的基督教互助组织并入国家工党的工人委员会，但神父保留对会员道德事务的咨询权，同时集体谈判与罢工表决权移交给行业委员会。"
 POL_destroy_jewish_economic_privileges:0 "摧毁犹太经济特权"
 POL_destroy_jewish_economic_privileges_desc:0"波兰此前保留的犹太社区自治税与犹太手工业和商号在若干行业的传统配额，被国家工党主导的工商管理局以“战时经济统制”名义逐一废止。贸易中的社区执照制度被替换为按行业工会会员资格发放的营业许可，未加入工团主义行业组织者不得参与国家订货的分包。国家工党同时设立合作信贷银行，向转入合作社形式的犹太工匠提供低息贷款，此举在官方公报中被表述为“将中介性特权转化为劳动性权利”。"
 POL_purge_the_traitors:0 "清理国贼"
 POL_purge_the_traitors_desc:0"萨纳齐亚的道德净化找到了明确的对象——那些在元帅身后窃据国家权柄、却以妥协和惰性消解遗产的人。斯克瓦尔钦斯基以“民族首先是国家与公民共同历史的产物”为判准，将什米格利-里兹周围聚集的寄生虫逐出公共生活。议会中的旧党派残余被以行政手段清除，理由不是政见分歧，而是他们对国家本身缺乏“无偿的、牺牲的态度”。净化从人事开始，以道德完成。"
 POL_purification_of_sanacja:0 "萨纳齐亚的净化"
 POL_purification_of_sanacja_desc:0"“萨纳齐亚”的本义是疗愈与清洗，斯克瓦尔钦斯基将其从针对政治对手的一次性行动扩展为持续的国家状态。报纸、学校、地方自治机构接受统一审查，标准是它们是否服务于“国家社会化”的目标。旧式的党派交易被斥为奴隶式的寄生行为，取而代之的是由功绩与行动定义的公共责任。净化不再需要敌人，它成为日常行政的语法。"
 POL_the_loyal_henchmen:0 "忠诚的打手们"
 POL_the_loyal_henchmen_desc:0"普里斯托尔从不掩饰他的干部从哪里来，他信赖的打手们，如今成为新政权人事任命的底本。这些人未必识字，更不懂经济学，但他们知道如何在格日博夫斯基广场的枪声中保持队形。各部门的主官职位被逐一分配给前战斗组织成员及其子侄，国家机器不再由官僚运转，由一支记得如何服从命令的队伍运转。"
 POL_olive_branch_to_old_comrades:0 "老同志们的橄榄枝"
 POL_olive_branch_to_old_comrades_desc:0"普里斯托尔在贝尔维第宫的走廊里逐一约见那些在老面孔，如今元帅不在了，但波兰还在。不管是从前的对手，还是沉默多年的名字，抑或是地方上仍握有实际影响力的人，只要自认坚持毕苏斯基思想的指导，那就是他的好同志。"
 POL_unlimited_presidential_power:0 "总统权力无限"
 POL_unlimited_presidential_power_desc:0"斯维塔尔斯基把旧宪法里那些从未被真正使用的条款逐条翻出来，如今解散议会的权力不再需要参议院附署，总统令的生效不再受部长会议议程的约束，国家法院的法官由总统直接任命而非经司法总监提名，波兰成为了一个强总统制国家。"
 POL_purge_syndicalist_filth:0 "净化工团污秽"
 POL_purge_syndicalist_filth_desc:0"工团联合会遭到了斯维塔尔斯基的大清洗和审查，结果是十七个行业联合会中有十一个存在“行政费用超出法定比例”的问题，九个联合会的主席团成员为反对派候选人提供过车辆。工团没有被解散，它仍旧继续运转，只是从此运转在一条斯维塔尔斯基铺好的轨道上。"
 POL_moral_hetman:0 "道德盖特曼"
 POL_moral_hetman_desc:0"吉纽什在埃及期间就把瓦迪斯瓦夫·扎莫伊斯基称为“道德盖特曼”，这里的盖特曼是民族道德秩序的守护者。回到华沙后，他把这个概念从个人扩展为制度。民族精神研究所设立了一个“道德盖特曼委员会”，成员不经过选举，由吉纽什本人从各省推荐的候选人中任命。他们拥有无懈可击的公共生活记录、对民族精神研究的贡献、地方社群中的道德权威。委员会不掌握行政权，但它的意见书具有咨询效力，被判定为“道德不合格”的官员，即使留任，也会发现自己的文件在公署里流转缓慢。"
 POL_theosophic_freemason_aristocracy:0 "神智学—共济会贵族集团"
 POL_theosophic_freemason_aristocracy_desc:0"吉纽什在巴黎的法国大东方共济会分会受过训，在埃及与马丁主义者热拉尔·恩考斯和保罗·塞迪尔保持通信，在印度与吠檀多哲学家斯瓦米·拉玛·蒂尔塔会过面。回到波兰后，他没有把这些关系公开化，而是转化为研究所的组织原则。研究所的学术理事会成员复杂，有几位拥有庄园和工厂的贵族，几位在巴黎和罗马接受过秘传训练的医生和律师，以及几位在战前就参与过神智学社团的华沙知识分子。吉纽什的章程规定，理事会成员的增补须经全体现任成员一致同意，这一条款确保了集团的封闭性，也确保了它不会被稀释，只有这样的精神贵族，才能担负波兰民族精神的重任。"
 POL_war_on_modernism:0 "对现代主义宣战"
 POL_war_on_modernism_desc:0"《民族精神的本体论》把“现代主义”定义为三样东西：议会政治的讨价还价、城市商业文化对乡村习俗的侵蚀、以及唯物主义对民族精神维度的否认。研究所将资助出版吉纽什和波兰浪漫主义诗人的注释本，在各省组织民族精神阅读活动，用神智学解释斯沃瓦茨基的“创世哲学”，并把这种阅读方式推广到中学的波兰语课程中。更古老、更民族的叙事必然战胜现代主义的腐朽。"
 POL_educate_in_occult_research:0 "神秘学研究教育化"
 POL_educate_in_occult_research_desc:0"吉纽什在1910年就提出过在克拉科夫建立神秘与元心灵研究中心的计划，如今，他把这个计划从研究扩展为教学。教学内容有波兰浪漫主义中的秘传传统（斯沃瓦茨基、密茨凯维奇、诺尔维德）、比较神智学（印度、埃及、希腊的秘传体系）、以及“民族精神的本体论”（吉纽什本人的理论）。相信通过探究神秘，波兰人都能把握我们血脉中的民族精神。"
 POL_no_more_leftist_agitation:0 "左翼煽动不再"
 POL_no_more_leftist_agitation_desc:0"虽然罢工和农民集会的数量有所下降，但社会主义者在城市工人中的活动并未消失，只是从街头转移到了工会委员会和合作社的会议室里。斯克拉德科夫斯基不打算取缔左翼组织，要只让它们的活动成本高于其成员愿意承受的水平就足够了。毕竟这些人本来就没有经济能力，只需提高一丝成本，他们就会作鸟兽散，留着他们也可以打压其他的反对派。"
 POL_the_pitiful_democrats:0 "可悲的民主派"
 POL_the_pitiful_democrats_desc:0"反对派政党在波兰的政治格局中仍然存在，但它们的处境可以用斯克拉德科夫斯基私下的一句话来概括：一个没有行政经验、没有军事支持、也没有财政基础的反对派，只能在讲台上证明自己的无力。政府不取缔反对党，也不禁止它们参加选举，只是让选举的规则、选区的划分和计票的程序都由执政阵营控制的机构来制定。反对派可以发言，可以投票，可以提交动议，但这些动议在委员会阶段就被搁置，而委员会的成员由总统任命。让反对派继续存在，比取缔它们更省事，因为一个被允许发言的反对派会把自己的精力消耗在议会程序里，而不是街头。"
 POL_lessons_of_the_syndicalist_model:0 "工团模式的启示"
 POL_lessons_of_the_syndicalist_model_desc:0"克维亚特科夫斯基在阅读波兰工团主义者的经济纲领时，注意到一个被他自己的中央工业区计划忽略的问题。四年计划建起了工厂，但工厂里的工人没有在计划中留下任何痕迹。工团主义者曾经提出，工业管理的单位不应是华沙的部委，而应是车间里选举产生的工人委员会，计划指标由各生产单位逐级上报汇总，而不是由中央委员会向下摊派。克维亚特科夫斯基不打算把整个经济交给工会，但他愿意在中央工业区的部分工厂中试行一种混合模式，当然这套安排不叫工团主义，叫生产单位的参与式计划。"
 POL_establish_economic_control:0 "建立经济统制"
 POL_establish_economic_control_desc:0"很明显，波兰的情况不允许自由发展经济，她需要进行经济统制。经济统制的核心是一套三层结构，国家经济委员会制定信贷总额、关税水平和战略产业的优先序列；行业联合体把委员会的指令翻译成各生产部门的具体配额；单个企业则在配额范围内自行决定生产什么、如何生产。国家不直接经营大多数工厂，但它控制着银行、铁路和战略原料的分配权，任何企业如果偏离了配额框架，就会发现自己无法获得进口许可证或铁路车皮。这套统制不是指令经济，它保留了私营企业和市场竞争，但市场的边界由国家划定。"
 POL_no_more_oligarchic_democracy:0 "寡头民主不再"
 POL_no_more_oligarchic_democracy_desc:0"巴特尔在议会的首次施政演说中没有使用“民主”这个词，而是用了“寡头政治”。他指的是各国都盛行的虚假民主政坛，几个大党在选举后分配部长席位，党魁在咖啡馆里决定预算流向，而议会投票只是把已经谈好的份额盖章确认。于是他的第一届内阁排除了左右两派的党魁，部长大多是无党派的技术官僚。议会只能是单纯的立法机构，我们把行政权还给行政机构。让寡头民主的时代过去吧，波兰将会引领民主潮流。"
 POL_intimidate_other_parties:0 "胁迫其他党派"
 POL_intimidate_other_parties_desc:0"巴特尔从不使用警察手段对付反对派，他的胁迫方式是程序性的。政府提出的预算案附有数百页的附件，每一页都详细列出某个选区在某一项目下的拨款金额，反对派议员如果投票反对预算案，就要向自己的选民解释为什么本地没有拿到钱。他还把部长们在议会演讲的文本预先提交给总理办公室审核，未经批准的演讲不得发表。通过这些威胁，其他党派只能服务于我们的民主事业。"
 POL_denounce_authoritarian_tyranny:0 "谴责威权主义暴政"
 POL_denounce_authoritarian_tyranny_desc:0"暴政是什么？它把国家的合法性从选票转移到军营、警察和行政法令的链条上，让议会变成追认机构，让法院变成执行工具，让公民变成被管理者。这种逻辑在波兰一点点地生长，但在当时很多人——包括他自己也选择了容忍，因为它在某些年份看起来比政党争吵更有效率。但民主党既已掌权，就要着手恢复议会对预算的实质审批权，恢复法院对行政法令的审查权，恢复公民对地方官员的罢免权等等。我们不仅要从道德上否定暴政，也要具体细微地执行工作保障民主。"
 POL_defend_democratic_institutions:0 "保卫民主制度"
 POL_defend_democratic_institutions_desc:0"自由选举产生的议会面临的第一项任务其实是确保自己不会被一次新的政变或行政命令解散。民主党与保守党在议会开幕后的联合提交了一份宪法修正案，它让议会解散权归议会自身，总统无权在议会任期未满时提前解散；法院对行政法令的合宪性审查不得被任何紧急状态条款中止；公民的结社、集会和出版自由须由普通法律而非行政命令来限制。通过后，两党设立了一个常设的“宪法保卫委员会”，由各党团按比例派员组成，负责在每一项新法案提交表决前审查其是否与修正案条款冲突。这个委员会没有否决权，但它的意见书在议会公报上全文刊登，任何试图绕过它的法案都会在报纸上被逐条拆解。"
 POL_strengthen_the_churchs_role:0 "强化教会角色"
 POL_strengthen_the_churchs_role_desc:0"教会在保守党的纲领中不是平等的诸多社会团体之一，而是民族共同体在世俗秩序中的骨架。新的政策将宗教课程恢复为小学和中学的必修科目；婚姻和家庭法在世俗登记之外恢复教会法庭的咨询效力；同时教产不纳入任何土地调整或税收改革的范围，主教任命由罗马决定，政府只保留形式上的通报程序。作为交换，教区网络在乡村承担户籍登记、救济分配和青年组织的辅助职能，神父在布道后的通告中传达政府关于税收、征兵和合作社的指令。这套政策把政府的一部分职能变成了教会工作的延伸，双方结合的更加紧密了。"
 POL_achieve_total_social_unity:0 "实现全社会团结"
 POL_achieve_total_social_unity_desc:0"国家要强大，必须有一条纲领。民族统一营纲领的核心是一份三方协议：企业主保留所有权，但须接受工人委员会就工资和工时提出的协商意见；县合作社获得农产品的优先收购权，作为交换，合作社须以优惠价格向城市供应粮食；国家不直接经营企业，只通过银行信贷和关税政策调节各行业之间的利益分配。阶级之间的冲突交由民族统一营的委员会去协调，各阶级各就其位，民族整体才能转动。"
 POL_ministry_of_state_defense:0 "国家保卫部"
 POL_ministry_of_state_defense_desc:0"民族统一营通过的法案把内政部政治档案科、总参谋部第二司的国内情报处和边防总署的护照检查科合并为一个新机构——国家保卫部。它的职责范围写得很笼统：保卫国家免受内部和外部威胁。实际运作中，各县级联络官同时兼任保卫部的报告员，每周提交一份本县情报，内容涵盖罢工集会、少数民族团体活动、反对派报刊发行量和教会布道中的敏感措辞。保卫部不设逮捕权，案件仍须移交普通法院审理，但被标记为“国家理由”的案件在开庭前须经保卫部省级分局的合议庭审核。这种设计使保卫部的权力不体现在逮捕人数上，而体现在起诉书能否进入法庭这一步。在各县公署的公文流转中，保卫部的印章几乎出现在每一份涉及人事变动、学校课程和地方社团注册的文件上。"
 POL_establish_the_marshal_cult:0 "建立元帅崇拜"
 POL_establish_the_marshal_cult_desc:0"毕苏斯基的讲话变成了读本，分发到基层，每一本都附有米耶津斯基撰写的导读；学校课程里增加了“元帅年谱”的选修课；波兰的每个县至少有一条以毕苏斯基命名的街道，每一座邮局和火车站都挂着他的标准像；毕苏斯基是我们的“领袖”和“国父”，他教会我们如何行动！"
 POL_individualist_monad_society:0 "个人主义单子社会"
 POL_individualist_monad_society_desc:0"社会由独立的、自我负责的个体组成，每个人都是一个不可分割的单位，拥有自己的判断力和行动能力；国家的作用不是替代这些单位做决定，而是确保它们在做出决定后承担后果。在处理任何事务时，先确认责任人是谁，再确认该责任人是否有权做出决定，最后记录该决定产生的后果。与这套行政规则同步推行的是一系列瓦解中间团体的措施，这些措施不禁止结社，只规定任何团体在获得国家资源之前，必须先证明其成员是以个人身份自愿加入，而非通过地方传统或集体身份被编入。"
 POL_the_social_pyramid_stands:0 "社会金字塔不可撼动"
 POL_the_social_pyramid_stands_desc:0"社会的自然形态是一座金字塔，底座是沉默的劳动大众，中间是维持运转的技术官僚，塔尖是少数能够感知形而上体验的人。任何试图让底座与塔尖平等对话的制度安排，都是对文化生成条件的破坏。密党在各地的联络员开始甄别现有的县议会和合作社理事会，把那些代表逐一替换为本地庄园主、军官和教授中“具有精神等级”的人选。替换不经过选举程序，只通过总统授权书副本上那行模糊的措辞——“国家精神统一”。"
 POL_the_night_of_vilnius:0 "维尔纽斯之夜"
 POL_the_night_of_vilnius_desc:0"热利戈夫斯基不需要向立陶宛派遣军队，它已经因全球经济萧条濒临崩溃，华沙只需在维尔纽斯集结边境自卫队，在梅梅尔（克莱佩达）方向做出军事姿态，同时让切断对考纳斯的粮食和木材供应。当然，立陶宛可以保留地方自治，但外交、军事和关税权要移交华沙。维尔纽斯之夜，立陶宛的独立在寂静中换了形式。"
 POL_imperialism_not_nationalism:0 "帝国主义，而非民族主义"
 POL_imperialism_not_nationalism_desc:0"民族主义想把波兰变成波兰人的国家，帝国主义想让波兰成为一个所有公民都愿意为之效力的国家。新的公民权法案不要求语言或血统的证明，只要求对国家忠诚的宣誓，作为回报，少数民族地区获得与波兰本土同等的县自治权。如果波兰只能靠排斥异族来维持，那它永远只是一个民族学标本，而不是一个地缘政治实体。"
 POL_practice_populism:0 "实践民粹主义"
 POL_practice_populism_desc:0"日前通过的一系列法案把土地分配交给县合作社，地主获得可兑换为合作社股份的债券。工厂里成立工人委员会，有权就工资和工时提出建议。温季亚戈尔斯基在《雅沃鲁夫笔记》里把这套做法称为“民粹主义的行政实践”。"
 POL_agrarian_revolution:0 "农业革命"
 POL_agrarian_revolution_desc:0"土地调整法案的理论依据来自萨文科夫流亡期间写下的几份备忘录，俄国的革命从城市开始，波兰的革命应当从谷仓开始。法案将国有林地、教会地产和部分大庄园划归县合作社，农民以股份形式认领，庄园主保留宅邸和花园，林场与磨坊的经营权移交合作社联合体。粮食产量正在增长，农业生产的组织重心也已经从庄园账房转移到合作社大会，萨文科夫主义在波兰的农业革命正在进行。"
 POL_purge_the_army:0 "清洗军队"
 POL_purge_the_army_desc:0"维特科夫斯基在总参谋部提交了一份名单，名单上的军官被要求在一周内到华沙报到，接受“技术审查”。来的人被分配到边远的军械库或铁路调度站，没来的人被火枪手的信使找到家中软禁。总参谋部的旧地图被撤下，换上标注着通信节点和铁路枢纽的新图。军队需要的是火枪手无微不至的情报监视。"
 POL_loyalty_to_the_catholic_church:0 "忠于天主教会"
 POL_loyalty_to_the_catholic_church_desc:0"拉齐维乌家族与教会的联系不需要从头建立。奥利卡的第十三教区从他父亲那一代起就在拉齐维乌的资助下运转，马耳他骑士团的徽记更是他随身携带的身份标记。今后教会保留全部教产与教区学校，主教任命须经罗马认可而非华沙批准，作为回报，神父们在布道中为国王祈祷，并协助登记乡村的出生、死亡与土地变动，波兰将会重新沐浴在天主荣光之下。"
 POL_rebuild_cross_party_bloc:0 "重建跨党政治集团"
 POL_rebuild_cross_party_bloc_desc:0"跨党政治集团本来就是一副松散的骨架，拉齐维乌也没有试图把它改造成纪律严明的政党。只需要把集团里的贵族、天主教活动家和温和自由派分别请到不同的庄园度周末，在狩猎和晚宴之间让他们各自谈妥本派系的份额。什拉赫塔得到地方行政的保留席位，天主教行动派得到教区监管权，自由派得到技术职位。这样回到华沙时，他们仍然是三个派系，但投票时知道该往哪个方向走。"
 POL_economic_pragmatism:0 "经济实用主义"
 POL_economic_pragmatism_desc:0"拉齐维乌对中央工业区的计划没有理论上的敌意，也没有热情。波兰没有钱同时补贴华沙的官僚机构和西里西亚的工厂，所以只能先做那些能自己养活自己的事。无论是他的私人资本、受益的实业家、还是德国和奥地利的贷款，谁的条件附带更少的政治条款，就先用谁的。波兰，团结一致向钱看。"
 POL_strengthen_statist_policies:0 "强化国家主义方针"
 POL_strengthen_statist_policies_desc:0"我们不需要“公民”这种虚伪的词语，只需要统一的“波兰人”。从今往后，波兰的每一寸土地都必须使用国家审定的标准波兰语；重要位置上的人选也要全部经过内政部民族事务处的确认；企业的采购合同也将优先授予那些人。国家主义方针，将成为一张覆盖教育、交通和经济的行政表格。"
 POL_merciless_struggle:0 "无情斗争"
 POL_merciless_struggle_desc:0"对皮耶拉茨基而言，斗争的对象是那些仍然有能力把不满组织起来的人。乌克兰军事组织的行动小组在审讯室里被逐一拆解；波兰共产党在工厂区的支部被连根拔除；工会中的反对派活动家被移交贝雷扎营；民族激进阵营中那些拒绝加入统一阵营的派别，同样收到解散令——皮耶拉茨基对右翼的耐心不比左翼更多。斗争不宣布开始，也不宣布结束，它是我们的无情日常。"
 POL_long_live_the_chief:0 "首长万岁！"
 POL_long_live_the_chief_desc:0"“首长”不是元首，不是总书记，不是国王。它是一个暧昧得恰到好处的称呼，足够让军团老兵想起毕苏斯基，让左右两派都不觉得被冒犯，也让甜心将军本人在签字仪式上露出那个著名的笑容。喊“首长万岁”的人不一定爱他，但至少不恨他。在这个夹在大国之间的国家里，不恨，已经是一种稀缺资源。"
 POL_unleash_the_vanguardist_war_machine:0 "发动先锋主义战争引擎"
 POL_unleash_the_vanguardist_war_machine_desc:0"先锋主义在这里不是布尔什维克的先锋队，波兰不等柏林决定华沙的命运，不等莫斯科决定东方的边界，而是先让波兰的战争引擎转起来。工程师、军官、工会代表和民族主义煽动家被塞进同一间厂房，造出同一批火车和步枪。让战争机器开动吧！"
 POL_proletarian_social_nationalism:0 "无产阶级社会民族主义"
 POL_proletarian_social_nationalism_desc:0"“无产阶级没有祖国”——这句话雅沃罗夫斯基从来不信。波兰的无产阶级有祖国，而且这个祖国刚刚从几个帝国的夹缝里爬出来，浑身是伤。在维斯瓦河畔，阶级解放和民族生存是同一场仗。工人不是抽象的人类单位，他们是华沙的钳工、罗兹的纺织工、格丁尼亚的码头工。为他们争取的东西，必须用他们听得懂的语言命名：波兰，而且是他们的波兰。"
 POL_police_state_of_worker_militias:0 "工人民兵的警察国家"
 POL_police_state_of_worker_militias_desc:0"民兵不是军队的预备队，民兵是政权的皮肤。雅沃罗夫斯基在PPS战斗组织里学到的东西比在任何议会委员会里都多。一支知道自己在保护什么的武装队伍，比十条宪法条文更能维持秩序。工人民兵不需要穿制服——他们就是穿工装的警察，在每个车间、每个街区、每个码头上，警察国家不是对社会主义的背叛，是社会主义在敌意包围中的生存形态。干净的手建不成新波兰。"
 POL_establish_trade_union_confederation:0 "建立工会联盟"
 POL_establish_trade_union_confederation_desc:0"新的工会联盟保留了行业工会的框架和集体谈判的职能，但其领导层与共和国修复协会的物资和仲裁部门形成了人员与信息的双重流通。这一安排在联盟内部并非没有争议，一部分老工会活动家认为，联盟正在从一个斗争组织退化为行政机构的一个分支。莫拉切夫斯基没有否认这种描述，但他将问题引向了另一个方向——在德国的威胁下，工会联盟的首要任务不是积累罢工的筹码，而是确保工人在国家重建的决策桌上拥有一把固定的椅子。"
 POL_form_the_national_labor_battalions:0 "组建国家劳动营"
 POL_form_the_national_labor_battalions_desc:0"参照战前波兰军队在斯科莱与科杰尼采组织的军事化青年营地模式，国家工党将散置于各地的公共工程队与失业者救济营合并为统一的国家劳动营体系。营员按军队编制分为旅与中队，接受体能训练、基础军事教育和工团主义政治训导，工时与配给由劳动营中央管理局直接规定。第一批营地部署在中央工业区铁路枢纽与维斯瓦河堤防工程沿线，其产出不计入私人企业采购，仅用于国家基础设施项目。"
 POL_class_struggle_in_service_of_the_state:0 "阶级斗争为国家服务"
 POL_class_struggle_in_service_of_the_state_desc:0"工团主义理论家苏里格在《工人阵线》复刊号上系统阐述了国家工党对阶级斗争的立场，劳资争议不再交由法院或罢工解决，而是提交由国家工党、行业工会与雇主联合会三方组成的劳动仲裁院，仲裁院裁决以“民族生产计划”为最终依据。罢工权被承认为合法，但行使前须经行业委员会以无记名投票批准，且不得波及军工与铁路调度。雇主若拒绝仲裁裁决，其企业将被移交工人合作社托管；工人若未经批准停工，则失去工会会员资格与劳动营优先录用权。"
 POL_a_national_moral_revolution:0 "一场国民道德革命"
 POL_a_national_moral_revolution_desc:0"斯克瓦尔钦斯基在1922年就宣告了“波兰保守革命”的纲领，如今它获得了国家的强制执行权。革命的核心不是制度更迭，而是人格类型的选择，你是自由人还是奴隶?自由人以“对自己力量的信赖、健康的民族抱负、对自身政权的纪律”为标志，而奴隶只知对强者谄媚、对国家索取。“先锋队”被赋予塑造前者的使命，道德革命由此从出版物上的论题变成一项有组织的国家工程。"
 POL_redder_than_britain_and_france:0 "比英法更红"
 POL_redder_than_britain_and_france_desc:0"法兰西公社和不列颠联盟的工团主义建立在工会官僚与全国联合会之上，罢工是他们的起点，谈判是他们的日常。普里斯托尔对这种“办公室社会主义”没有耐心。波兰的红色从贝兹达尼的邮政车厢里长出来，从莫德林堡垒的牢房里长出来，从没有工会合法存在的环境中长出来。第三国际的会议桌上，波兰代表被莫斯科和巴黎的老资格轻视，但普里斯托尔不需要他们的承认。他的政权在一件事上比英法更红：它从来不把罢工当作筹码，它把行动当作政权本身。"
 POL_overcome_party_politics:0 "战胜党派政治"
 POL_overcome_party_politics_desc:0"毕苏斯基本人就拒绝承认BBWR是一个政党，它只“与政府合作”，不参与政党之间的分赃。党派政治之所以需要被战胜，它太过低效。一个在议会里为选区利益讨价还价的代表，远不如一个在部长办公室里核对预算逐行的官员有用。"
 POL_socialism_in_jackboots:0 "军靴中的社会主义"
 POL_socialism_in_jackboots_desc:0"斯维塔尔斯基认为自己是一个“社会主义者”，只是社会主义需要严明的纪律。国家经济总署的每一个产业处都配了退役军官担任“生产纪律专员”，他们的军衔不高，通常是上尉或少校，但他们的签字是工厂运行的前提。工人们的权利没有被取消，但没有军靴的纪律，就没有权利可言。"
 POL_i_am_the_messiah:0 "我即弥赛亚"
 POL_i_am_the_messiah_desc:0"波兰民族的苦难——瓜分、起义失败、流亡——并不是历史的偶然，而是民族精神在物质层面的受难，而受难之后的复兴将使波兰成为各民族的向导。我即弥赛亚，波兰民族精神本身就是救世主。弥赛亚不是个体，是一个民族在历史中意识到自己使命的那个时刻。"
 POL_awaken_the_polish_aryan_spirit:0 "唤醒波兰雅利安精神"
 POL_awaken_the_polish_aryan_spirit_desc:0"吉纽什在1910年提出的克拉科夫研究中心计划中，口号是“从雅利安原始资源中汲取知识”。波兰人的祖先来源于“波兰-雅利安”共同体，这一共同体的精神遗产保存在塔特拉山的民间传说、喀尔巴阡山的牧羊人仪式和维斯瓦河畔的丰收歌谣中。波兰民族的精神优越性来自其保存了最纯粹的雅利安-波兰秘传传统，而这种优越性需要通过教育和仪式来唤醒，而不是通过血统证明来确认。"
 POL_enact_authoritarian_constitution:0 "颁布威权宪法"
 POL_enact_authoritarian_constitution_desc:0"四月宪法在通过时，已经赋予了总统解散议会、任命三分之一参议员、以及在“国家理由”下颁布法令的权力。如今的修宪把剩下的模糊空间也填上了，总统有权在议会休会期间颁布具有法律效力的法令，最高法院对法令的审查权被限制在程序问题而非实质内容上，公民的结社和集会自由须以“不危及国家秩序”为前提，而“国家秩序”的定义权归内政部。这部宪法不是为了限制自由，而是为了在外部威胁面前确保国家能够以统一的声音说话。"
 POL_implement_land_reform:0 "实施土地改革"
 POL_implement_land_reform_desc:0"旧的土地改革法案在纸面上规定了大地产的强制征收，但在实际操作中，补偿按市场价计算，购买者须从银行获得贷款，而农产品价格的崩溃使小农根本无力偿还。到现在，无地农民的数量比法案通过时还要多。克维亚特科夫斯基的切入点是债务而不是地契，国家农业银行接管了小农在商业银行的抵押贷款，把利率压到象征性的水平，同时授权县合作社以预付金的方式收购小农的粮食，预付金直接冲抵土地购买的分期付款。这不是无偿没收，也不是自由买卖，而是一种由国家信贷支持的、以耕作者为优先对象的土地转移机制。庄园主保留住宅和果园，林场和磨坊移交给县合作社经营，合作社的收益用于支付后续的土地赎买。"
 POL_establish_institute_of_prices_and_conjuncture:0 "建立经济状况与价格研究所"
 POL_establish_institute_of_prices_and_conjuncture_desc:0"克维亚特科夫斯基手头最缺的不是钱，是数据。经济计划要决定把信贷投向哪里，首先得知道各地物价、工资、原料成本和运输费用的真实水平。经济状况与价格研究所早在1928年就已成立，但长期只是统计局的附属单位，报告用学术语言写成，送到部委后无人翻阅。如今克维亚特科夫斯基把它从统计局剥离出来，直接隶属财政部。研究所的出版物不再只供学者传阅，而是按月分发到各省税务稽核员和国有银行信贷员手中。厂长和合作社理事拿到的是油印表格，填上数字，寄回华沙，汇总后成为下一季度信贷分配的参考依据，波兰的经济计划就是从这些寄回来的表格里长出来的。"
 POL_reconcile_with_the_opposition:0 "与反对派和解"
 POL_reconcile_with_the_opposition_desc:0"克维亚特科夫斯基邀请农民党、社会党和基督教民主派的经济专家进入中央工业区的咨询委员会，给他们提供数据、办公室和差旅预算，但不给他们任何行政决定权。和解的条件是技术性的，反对派专家可以审查四年计划的账目，可以提出替代方案，可以在委员会里投反对票，但一旦委员会做出决定，反对派控制的合作社和工会须在各自的范围内配合执行。作为交换，政府不再用警察手段对付反对派的集会。一个被允许在委员会里发言的反对派，比一个被赶到街头的反对派更容易预测，也更容易被计划所吸收。"
 POL_bartel_parliament:0 "巴特尔议会"
 POL_bartel_parliament_desc:0"“巴特尔议会”这个词最初是反对派报纸的讽刺用语，指的是总理把议会变成了政府政策的橡皮图章。巴特尔接受了这个称呼，并把它变成了一种制度描述。议会保留立法权、预算审批权和质询权，但政府的施政纲领在议会开会前就已经通过内阁会议和总统办公室的协调确定下来，议会能做的只是对纲领的细节进行修改。他把这套安排称为“有管理的议会制”，事实证明它节省了议会与政府之间反复扯皮的时间，让我们的民主更加高效。"
 POL_organize_free_unions:0 "组织自由工会"
 POL_organize_free_unions_desc:0"自由工会的注册不再需要内政部的批准，只需向地方法院备案；罢工的合法性也不再取决于是否“危及国家秩序”，而取决于是否经过工会会员的匿名投票；工会的财务和人事不受政府审计，只对会员大会负责。民主党认为，一个不受政府控制的工会，在谈判工资和工时的时候，比一个由政府任命的委员会更能让工人接受最终结果。让工会成为工人自己管理自己事务的机构，然后在这个机构的基础上，建立一种比街头骚乱和警察镇压都更可预测的劳资合作关系吧。"
 POL_integrate_sanacja_liberals:0 "整合萨纳齐亚自由派"
 POL_integrate_sanacja_liberals_desc:0"旧政权的行政机器里不是只有将军和警察，还有一批主持过经济计划、港口建设和税制改革的自由派技术官僚。他们不属于任何政党，不参与政治镇压，在旧政权崩溃后既没有流亡也没有被清算，只是留在了部委的办公室里等待新主人。这些技术官僚不能进入内阁，但可以继续留在次长和司长位置上，负责把旧档案和新政策对接。作为交换，他们须向议会提交个人在旧政权时期的工作记录，接受宪法保卫委员会的审查，并签署一份声明，承认议会主权和司法独立不可侵犯。"
 POL_down_with_sanacja:0 "打倒萨纳齐亚！"
 POL_down_with_sanacja_desc:0"民主党的部分议员和保守党内的激进派联合提出了一项法案，要求设立一个特别法庭，审理旧政权时期“侵犯公民权利”的案件，被告名单上包括前内政部长、前警察总监和几位仍然在世的总参谋部军官。没有清算的民主制度只是一张没有签名的合同，为了彻底清算波兰专制的遗毒，我们必须彻底打倒萨纳齐亚！"
 POL_xyz_principle:0 "XYZ原则"
 POL_xyz_principle_desc:0"保守党从一位已故数学家的著作中借来了一组符号，X代表绝对真理，Y代表绝对善，Z代表绝对美，三者“有目的的巧合”构成历史的终点。当然，这套形而上学在议会辩论中不可能被直接引用，但它在政策制定中找到了世俗的对应物。教育委员会在审定教科书时，不再只检查事实的准确性，也检查叙述的方向是否符合“民族精神在历史中的展开”。公务员培训增加了“道德哲学”课程，教材节选保守主义思想家关于权威、等级和牺牲的论述。广播电台的晚间节目被要求安排一定比例的古典音乐和诗歌朗诵，理由是这些形式比流行音乐更接近“美的绝对秩序”，我们必须用一套关于“更高秩序”的语言重新排列一切社会生活！"
 POL_liberal_interventionism:0 "自由干预主义"
 POL_liberal_interventionism_desc:0"科茨在波兰银行行长任上积累了足够的经验来推行一种他自己也不会用理论术语包装的政策，他保留私营银行的信贷自由，但通过国家银行再贴现率调节货币流向：盈利的纺织厂和机械厂可以获得低息贷款，亏损的钢铁厂则被要求先提交重组方案才能获得展期。关税保护有选择地适用，对本国能生产的机床和化工品征收保护性关税，对本国无法生产的原材料则维持低税率，这种干预是为民族利益服务的金融调节。"
 POL_forced_polonization:0 "强制波兰化"
 POL_forced_polonization_desc:0"国家保卫部成立后，波兰化政策从教育领域扩展到行政和公共生活的多个层面。县公署的公文一律使用波兰语，少数民族语言只在初级教育的前两年和本堂区内部事务中保留。铁路车站和邮局的标识牌先改为波兰语与少数民族语言并列，随后少数民族语言被逐步移除。国有企业管理层须通过波兰语行政考试，少数民族教师的资格认证须额外提交波兰语水平证明。这套政策不禁止少数民族语言在家庭和教会中的使用，只规定凡与国家机构相关的场合必须使用波兰语。"
 POL_patriotic_dictator:0 "爱国独裁者"
 POL_patriotic_dictator_desc:0"如今，“政党”逐渐从正式文件中消失，“国家”一词取而代之。重大政策的最终裁决权集中在一个人手中，这个人不需要向议会解释，不需要向公众说明，只需要在事后对法律和秩序的恢复承担个人责任。独裁者并非暴君，他是那个在关键时刻敢于把国家利益置于程序之上的人，只要结果是为了国家好，程序有什么重要的呢？"
 POL_artist_spiritual_aristocracy:0 "艺术家精神贵族"
 POL_artist_spiritual_aristocracy_desc:0"维特凯维奇把密党联络员派往各地的剧院、画廊和文学编辑部，他列了一份“精神贵族名录”，标准与政治立场无关。一个在克拉科夫剧场里能把灯光调度成形而上学体验的技师，一个在利沃夫用粉彩画出纯粹形式肖像的画家，一个在扎科帕内用方言写出无人能懂的诗歌的中学教师——这些人被列入名录，获得国家津贴、旅行许可和免于征召的待遇。作为交换，他们须定期向密党提交作品，供维特凯维奇本人评判。波兰需要的不是更多艺术家，而是更少但更纯粹的艺术家，那些能看见庸人看不见的东西的人，他们应该成为我们的贵族。"
 POL_the_german_threat_from_the_west:0 "西方的日耳曼威胁"
 POL_the_german_threat_from_the_west_desc:0"柏林对波兰的包围是全方位的，德国资本控制着波兰的工厂，其董事会决议可以直接影响华沙的工业计划；德资银行持有波兰国债的相当份额，每一次展期都附带关于波兰军事预算和外交方针的“建议”；在边境地区，德语被列为行政辅助语言，德国领事馆向当地德裔居民发放文化和教育补助；边境的德国驻军以秋季演习为名调动，次数逐年增加，每一次都迫使波兰军队在相邻的防线延长驻守时间，日耳曼威胁是斯拉夫民族的敌人！"
 POL_yellow_peril_panic_from_the_east:0 "东方的黄祸恐慌"
 POL_yellow_peril_panic_from_the_east_desc:0"热利戈夫斯基在议会的一次闭门会议上把日本在远东的扩张称为“斯拉夫世界背面的刀”。如果日本控制了从外阿穆尔到满洲的铁路和港口，斯拉夫人将永远被困在德国和日本之间的走廊里，无法把西伯利亚的资源和太平洋的通道连接起来。我们必须在远东斯拉夫流亡者中招募铁路和电报专家，在哈尔滨和海参崴的俄语报纸上刊登广告，为斯拉夫复兴研究所收集日本在东亚的交通和军事部署情报，不能再让那些蒙古猴子继续威胁斯拉夫人了。"
 POL_total_laissez_faire_economy:0 "全面自由放任经济"
 POL_total_laissez_faire_economy_desc:0"博琴斯基的经济观点只有一句话：国家干预越少，财富越多。他削减了中央工业区的补贴，把国有林场和盐矿的经营权转给县合作社，废除战时遗留的价格管制和物资配给。让市场决定哪些工厂该继续运转，比让部委官员决定更有效率。"
 POL_assimilate_minorities:0 "同化少数民族"
 POL_assimilate_minorities_desc:0"博琴斯基的同化不是民族同化，他在《贝雷扎·卡尔图斯卡的目的性》里写道，警察手段只会让少数民族更激进。他推动的“国家同化”计划把重点放在经济和文化上，少数民族地区的合作社获得低息贷款，双语学校保留但增设波兰语行政课程，地方公职向所有通过考试的居民开放。他的目标是让乌克兰人、白俄罗斯人和犹太人在波兰国家中找到自己的利益所在。"
 POL_awaken_civic_building_interest:0 "唤醒公民建设兴趣"
 POL_awaken_civic_building_interest_desc:0"博琴斯基认为，公民参与公共生活是地方政府存在的理由。他推动的“公民建设协会”在县一级组织道路修建、诊所开办和扫盲班的志愿活动，经费来自县金库，人员来自当地居民，华沙只提供技术标准和法律框架。国家不能替公民修好每一条路，但可以为公民修路提供工具和规则。公民建设是公民自我训练自治的学校。"
 POL_establish_labor_army:0 "建立劳工军"
 POL_establish_labor_army_desc:0"劳工军从罗兹纺织厂和华沙机械厂招募第一批成员，注册为“工人自卫队”，领取县金库津贴，由退役军团军官训练。他们不穿军装，职责是维持罢工和集会秩序、在车间分配住房和救济名额。让工厂里的秩序由工人自己维持，比省里派警察来维持更省钱，同时通过动员工人，还能为日后的军事行动做准备。"
 POL_crusade_against_democracy:0 "对抗民主的十字军东征"
 POL_crusade_against_democracy_desc:0"温季亚戈尔斯基在《雅沃鲁夫笔记》里把西方议会制称为“资产阶级的鸦片”，它让工人在投票箱前发泄不满，然后回到车间继续接受低工资和长工时。他推动的公社大会不是另一种议会，而是车间和村社里的直接表决。西方的民主是给富人设计的，他们有钱买报纸、雇说客、在议会里安插自己的人；波兰的工人和农民不需要那种民主，他们需要的是在车间里就能举手通过自己工资的权力。"
 POL_win_over_the_nobility:0 "拉拢贵族"
 POL_win_over_the_nobility_desc:0"维特科夫斯基没有邀请贵族到贝尔维德宫喝咖啡，他让火枪手的信使带着利益交换各省庄园。贵族们被要求提供他们在地方上的电话线和运输网络。作为回报，他们的庄园保留全部产权，地方行政职位优先从他们中选拔。"
 POL_form_combat_squads:0 "组建战斗队"
 POL_form_combat_squads_desc:0"战斗队从火枪手原有的破坏小组扩编而来，成员来自华沙理工大学的工程系、罗兹的纺织厂技工和边境林区的猎人。他们的训练科目包括铁路爆破、电话线窃听、伪造证件和短波电台操作。每支战斗队配有一名技术员和前军团军官，前者负责炸药和通讯，后者负责纪律和本地联络。战斗队不驻扎在兵营里，他们分散在各县的合作社、锯木厂和火车站，白天是工人和会计，晚上是火枪手的节点。"
 POL_grind_down_social_resistance:0 "磨平社会反抗"
 POL_grind_down_social_resistance_desc:0"拉齐维乌在枢密院推动成立“王国保安总局”，名义上隶属内务部，它借鉴了布尔什维克的组织。总局在各县设档案卡，凡参与罢工、农民集会者的姓名、职业、租约状况均记入卡片，由本堂神父与庄园管家协助核对。被捕者不经法庭，直接送往东部林区的“劳动安置营”，在锯木厂和铁路支线服劳役。"
 POL_progress_and_order:0 "进步与秩序"
 POL_progress_and_order_desc:0"保安总局的档案卡背面印着另一套表格：接种记录、识字等级、雇工合同编号。拉齐维乌把县诊所和教区学校纳入同一套登记系统，凡在庄园诊所接种的农户、在教区学校结业的佃户子弟，其档案自动转入“有序公民”名册，享有租约续签和铁路支线用工的优先权。未登记者不得离开本县，不得受雇于特许工厂。进步以卫生与识字的面目出现，秩序则藏在每张卡片背面的编号里。"
 POL_railway_union_workers_example:0 "铁路工会，工人榜样"
 POL_railway_union_workers_example_desc:0"1931年成立的亲政府工会中央在1935年后开始出现裂痕，工团主义派系拒绝接受民族统一阵营的吸纳。皮耶拉茨基让内政部劳动司把工会登记权重新核发，只发给那些签署了生产纪律公约的委员会。新成立的铁路工会中央把办公室设在华沙—维也纳铁路总局的侧楼里，主席是一位前军团工兵军官。模范班组获得优先的煤配额和住房名额，罢工记录则导致整个班组的家属从救济名册上除名。"
 POL_authoritarian_police_state:0 "威权警察国家"
 POL_authoritarian_police_state_desc:0"国家警察在皮耶拉茨基手中经历了一次安静的扩编。各县警署增设政治档案科，人员从退役军官和庄园管家中招募，不穿制服，领取内政部的津贴。档案科的卡片按姓名、职业、租约和社会关系四栏登记，本堂神父和村长负责提供核实。凡被内政部长标注为国家理由的案件，不再进入普通法院，转由省内政长官主持的行政合议庭处理，其裁决为终审。贝雷扎营的编制从临时拘押点改为常设隔离中心，预算列在内政部行政开支的特别项目下。"
 POL_national_pacification_plan:0 "国家平定计划"
 POL_national_pacification_plan_desc:0"1930年东加利西亚的平定行动在档案里被记为一次临时治安措施，皮耶拉茨基把它改成一套常设程序。计划的适用范围将是全波兰。驻军与警察组成联合纵队，进入被标记的地点，搜查武器和非法出版物，对拒绝配合的人处以集体罚金或强制劳动，同时登记所有适龄男性的兵役与迁徙状态。平定计划的目的不是惩罚某一次破坏行动，而是把人口纳入一套可核查、可动员、可惩罚的行政网络，让下一次破坏行动发生之前，名单上的人已经被找到。"
 POL_dictator_of_the_workers:0 "工人的独裁者"
 POL_dictator_of_the_workers_desc:0"雅沃罗夫斯基从不称自己为领袖。领袖需要人群、掌声、一面高悬的旗帜。他要的东西更简单：一间不用太大的办公室，一部直通民兵指挥部的电话，一份每天早上放在桌上的名单。名单上是一切敌人和可能变成敌人的人。这是工人的独裁，工人终于不必再向任何人解释自己为什么值得夺取权力。工人的独裁者不踩在工人头上，他是工人这个集体终于长出的那只不再发抖的手。手不需要民主，手只需要握紧。"
 POL_power_of_myth:0 "神话的伟力"
 POL_power_of_myth_desc:0"总罢工从来不是谈判筹码，而是一种革命信念。使工人成为一股力量的，是他们对自身行动之伟大的想象。“神话”可以作为动员工具，总罢工本身不一定发生，但信念能凝聚波兰的力量。"
 POL_the_will_of_the_workers:0 "工人的意志"
 POL_the_will_of_the_workers_desc:0"工人意志的表达仅仅停留在工会框架是不够的，一个无法公开辩论的意志无法被称为意志，只能被称为少数人的密谋。工人意志的衡量标准不是它在官方报纸上被讨论的频率，而是它在社会和国家需要时被服从的程度。"
 POL_controlled_democracy:0 "受控制的民主"
 POL_controlled_democracy_desc:0"国家工党主导的制宪委员会公布新选举法草案，将议会席位分配给行业工会、基督教工人协会、合作社联合会与地方自治机关的功能性代表，而非按地域人口比例产生。所有候选人须持有国家工党颁发的证明，证明其参与过劳动营、合作社或地方卫生委员会的工作。议会保留对预算与行政条例的质询权，但国防、外交与劳动纪律事务被划为“保留领域”，由苏里格以国家工党主席身份直接管辖。"
 POL_vanguardist_elite_stratum:0 "先锋队精英阶层"
 POL_vanguardist_elite_stratum_desc:0"“先锋队”在1932年还只是一个青年公民工作组织，如今它成为选拔国家领导层的唯一通道。斯克瓦尔钦斯基拒绝以出身、财富或党派资历界定精英，唯一的标准是“行动中的功绩”。先锋队成员在完成乡村扫盲、合作社组织与地方行政实习后被纳入干部名册，取代了旧上校集团以私人忠诚维系的非正式网络。精英阶层不再是环绕元帅个人的圈子，而是一个可复制、可考核的制度化等级。"
 POL_blue_socialist_reconstruction:0 "蓝色社会主义式重构"
 POL_blue_socialist_reconstruction_desc:0"普里斯托尔从不认为自己在背叛社会主义，他只是在波兰的条件下重新发现它。分散的自治机构在危机中只会沦为党派斗争的据点，而波兰没有多余的十年让工会官僚慢慢学习如何治理国家。第三国际的代表来访时称赞这是“具有波兰特色的社会主义道路”，普里斯托尔礼貌地纠正他们，这不是特色，这是纪律。"
 POL_unite_the_socialist_parties:0 "统合社会主义政党"
 POL_unite_the_socialist_parties_desc:0"波兰社会党等社会主义政党的议会党团被保留，作为工人阶级“表达诉求的合法渠道”。但它们的组织网络被逐一切断与政党的财务和组织联系，移交给“工人代表会议”。一个真正的战斗组织从不设两个指挥部，工人阶级只需要一个代表机构，而这个机构不参加选举。"
 POL_know_everything_intervene_everywhere:0 "了解一切，干预一切"
 POL_know_everything_intervene_everywhere_desc:0"这是毕苏斯基评价普里斯托尔的话，原话是“想了解一切、干预一切”的工作方式。普里斯托尔没有反驳过。他负责劳工事务时亲自审阅每一笔可疑支出，现在他把这套方法从政府扩大到了整个国家。各部委的公文流转被要求抄送他的办公室，任何机构的重大支出都须提前报备，普里斯托尔不相信任何未经他亲眼过目的数字和公文。"
 POL_build_a_patronage_network:0 "建立恩庇关系网"
 POL_build_a_patronage_network_desc:0"斯维塔尔斯基的人事名单从分散在十几个省长的私人保险柜中，人事任免不必走公开竞聘的冗长程序，名单上早就标注了他们计划好的合适人选，这样任命后不会引起任何一方的怨恨。恩庇关系网塑造了忠诚，它是行政效率的润滑剂。"
 POL_toward_polish_national_ascension:0 "迈向波兰国家飞升"
 POL_toward_polish_national_ascension_desc:0"在吉纽什的领导下，波兰民族精神已经完成了从“物质受难”到“精神复兴”再到“历史使命实现”的三阶段进程。波兰的下一步是将理论转化为民族生活的组织原则，波兰国家、波兰民族、波兰人都将迎来物质和灵魂的飞升...... 飞 升 不 是 比 喻。"
 POL_appease_right_wing_forces:0 "安抚右翼势力"
 POL_appease_right_wing_forces_desc:0"右翼势力现在仍然拥有乡村合作社、教区网络和中产阶级行会的支持，虽然我们的政策不涉及恢复太多他们的地位，但我们可以把他们的部分诉求纳入政府政策。教会学校的宗教课程被保留并扩展，乡村合作社在信贷和税收上获得优惠，犹太人在大学和自由职业中的比例受到非正式的限制。作为交换，右翼活动家被邀请进入县合作社的监事会和省公署的咨询委员会，他们的报纸获得政府广告的投放。我们不要求他们宣布支持政府，只要在选举和公投中保持沉默就好了。右翼不需要被消灭，只需要被吸收进现有的机构里，让它的活动家发现自己的利益与体制的稳定绑在一起。"
 POL_increase_public_investment:0 "增加公共投资"
 POL_increase_public_investment_desc:0"为了波兰的未来，克维亚特科夫斯基决定把预算提高一倍，其中四成以上投向工业，主要集中在中央工业区。这笔钱的大头来自国家投资，但克维亚特科夫斯基不主张把所有项目都装进部委的抽屉。铁路、电站、桥梁这类跨地区工程由中央财政直接拨款；地方性的道路、供水、诊所和职业学校则由县合作社和市政当局申请，中央提供低息贷款和部分赠款，剩余部分由地方自筹。公共投资的目的是让钱先动起来，再让账本上的数字自己去证明收益。私人投资者看到铁路和电站到位，自然会跟进，他们不跟进的地方，国家再追加投资。"
 POL_equal_civil_rights:0 "公民权利平等"
 POL_equal_civil_rights_desc:0"克维亚特科夫斯基不是民族主义者，他在工业与贸易部长的任上就说过，波兰的少数民族如果被排斥在经济生活之外，国家的工业计划就缺了一块劳动力拼图。国有企业和中央工业区在招工时不得以语言或宗教为由拒绝应聘者，少数民族地区的职业学校获得与波兰本土同等的拨款，合作社在乌克兰和白俄罗斯乡村的信贷条件与波兰乡村一致。作为交换，少数民族聚居区的公共设施同样向国家开放，不设地方性的准入障碍。一切平等，都要看你为波兰的经济付出了什么。"
 POL_economic_development_first:0 "聚焦经济发展"
 POL_economic_development_first_desc:0"巴特尔最重视的其实不是政治改革，而是格丁尼亚港和中央工业区的早期规划。他本人是数学家，但他的经济团队里聚集了一批工程师和化学家，克维亚特科夫斯基就是他在霍茹夫氮肥厂时期结识的。巴特尔在议会预算辩论中把大把时间花在解释具体的经济运作上，而不是回应反对派关于民主倒退的指控。一个国家如果连自己的港口和铁路都管不好，谈论民主就是空话。经济发展在他的施政纲领中不是诸多议题之一，是其他所有议题的前提。没有税基就没有预算，没有预算就没有行政效率，没有行政效率就没有议会政治的正常运转。"
 POL_raise_education_standards:0 "提高教育水平"
 POL_raise_education_standards_desc:0"波兰的识字率和小学毕业率仍然低于西欧多数国家，而中等和高等教育的机会几乎完全集中在城市和富裕家庭。夸希涅夫斯基在担任省长期间就注意到，乡村地区的学校缺的是教师，师范学校的毕业生宁愿在城市里做文员，也不愿去乡村教书。民主党的方案是把教师的工资从国家预算中单列，由地方合作社补充住房和口粮，同时把义务教育从四年延长到七年，并在县一级设立奖学金基金，资助农家子女进入中等学校。教育不是福利，是国防事业。一个连地图和说明书都读不懂的农民，不可能成为一个有效的公民，也不可能成为一个有效的士兵。"
 POL_rapid_armament:0 "急速扩军"
 POL_rapid_armament_desc:0"民主党内阁在国防问题上的立场比它的任何其他政策都更少争论。德国的军事预算已经数倍于波兰，而波兰的军备更新计划——中央工业区的军工部分、格丁尼亚的海岸防御、以及空军的现代化——在旧政权末期因为行政混乱和预算扯皮而进展缓慢。夸希涅夫斯基的国防部长是一个无党派的技术军官，他的任务不是制定战略，是加快采购和训练的速度。扩军的目的是让波兰在谈判桌上有东西可以拿出来，而不是让波兰在战场上孤注一掷。"
 POL_win_over_right_wing_radicals:0 "拉拢右翼激进派"
 POL_win_over_right_wing_radicals_desc:0"民族激进阵营曾被旧政权赶到街头，但它的网络和活动小组从未真正解散。既然都是为了民族事业，那么他们可以进入保守党的地方委员会，获得印刷补贴和集会许可，他们的报纸可以在保守党的邮政配额下发行。作为交换，激进派也必须服务于保守党的组织工作，他们在青年群众中的鼓动作用，比十万颗炸弹还要大！"
 POL_arm_the_catholic_faithful:0 "武装天主教徒"
 POL_arm_the_catholic_faithful_desc:0"要讨论自卫力量，就不能忽略教区网络的成员，毕竟我们是一个天主教多数的国家。保守党将步枪和弹药从军方库存中划拨给教区，这些天主教民兵不纳入正规军体系，调动须经主教和地方保守党领袖的联合批准。保守党理论家把这支力量称为“秩序的基石”，它是用来确保在外部压力或内部动乱中，每一个教区都能在不等待华沙命令的情况下自行组织防御。"
 POL_cooperate_with_the_catholic_church:0 "与天主教会合作"
 POL_cooperate_with_the_catholic_church_desc:0"波兰民族自古以来就是一个天主教民族，天主教会在学校、家庭和社会救济领域享有完全自主权，教产不纳入任何土地调整计划，主教任命由教会自行决定。作为交换，教会接受民族统一营的领导。科茨本人不是教会的虔诚信徒，但他清楚教区网络在乡村社会中的动员能力。"
 POL_hijack_the_national_democratic_movement:0 "骑劫民族民主运动"
 POL_hijack_the_national_democratic_movement_desc:0"民族民主运动在农村和城市中产阶级中拥有稳定的支持网络，民族统一营没有与民族民主运动的组织对抗，而是设法接管它的地方机构。具体做法是招募民族民主运动的地方活动家进入民族统一营的县委员会，给他们保留席位和预算份额，换取他们放弃独立的政治活动。民族民主运动的青年翼被并入营的青年组织，报纸的编辑权被移交给营的新闻办公室，地方俱乐部的房产被转租给营的分区使用。与其消灭对手，不如让让对手的机构变成自己机构的一部分。"
 POL_centralization_of_power:0 "权力集中化"
 POL_centralization_of_power_desc:0"政治的决策权应该从分散的委员会逐级向上集中，直到所有重要决定都在同一间办公室里做出，这些机构在做出决定之前必须先等待一份来自上方的通知。波兰的行政体系在组织图上仍然是多层的，但在实际操作中，每一层的决定都需要上一层的事先确认。通过自上而下的领导，波兰才能强大。"
 POL_master_race_polish_superman:0 "超级种族—波兰超人"
 POL_master_race_polish_superman_desc:0"维特凯维奇在《心理物理问题》的最后一章里写下了一个概念，：波兰超人是那些能够感知形而上学体验的个体，他们通过严格的自我训练和精神等级，超越了群众的本能驱动和物质需求。密党在各县的分支开始组织“精神训练班”，课程内容包括维特凯维奇的哲学讲义、形式主义绘画临摹和禁欲生活守则——禁烟、禁酒、禁可卡因......训练班的学员从青年军官、大学助教和剧团演员中选拔，结业后获得“精神贵族名录”的候选资格，这些波兰超人将是我们伟大种族的未来。"
 POL_complete_lithuanian_integration:0 "完成立陶宛整合"
 POL_complete_lithuanian_integration_desc:0"立陶宛整体已被并入现有的联邦行政网络，而不是保留一个单独的立陶宛实体。立陶宛的市政厅被改称为“公社联合体办公处”，立陶宛语的官方地位从“并列语言”降为“地方方言”，学校课程中的立陶宛历史被并入“斯拉夫民族史”的框架，立陶宛军队被拆散编入联邦自卫队的各公社分队，军官重新宣誓效忠“斯拉夫联邦军事委员会”。立陶宛不会消失，它只是找到了自己在斯拉夫大家庭中应有的位置。立陶宛的机构、语言和记忆被逐一拆解，然后以斯拉夫联邦的零件形式重新组装。"
 POL_supplement_objectivism_with_tradition:0 "以传统补充客观主义"
 POL_supplement_objectivism_with_tradition_desc:0"政策制定基于客观评估——统计数据、预算测算和地缘分析——但传统提供了客观评估无法给出的方向。博琴斯基在教育改革方案中要求县立学校的课程既要有现代经济学和工程学，也要有地方历史和天主教伦理。新波兰反对把传统当作教条，也反对把客观性当作冷漠。传统告诉国家应该追求什么，客观主义则告诉国家如何实现它。"
 POL_for_the_freedom_of_slavic_peoples:0 "为了斯拉夫人民的自由"
 POL_for_the_freedom_of_slavic_peoples_desc:0"华沙电台开始用乌克兰语、白俄罗斯语和俄语向东方广播，斯拉夫的自由不是从谈判桌上来的，是从每个斯拉夫人聚居地那里来的。即使广播被电台干扰，但短波信号仍能穿过边境。就让温季亚戈尔斯基的声音传遍全世界，动员斯拉夫人民为自由二战。"
 POL_corporate_corporatism:0 "企业法团主义"
 POL_corporate_corporatism_desc:0"工业领域的重组以行业联合体为单位，它们被称为“技术法团”。每个联合体由工人委员会、工程师协会和县合作社代表三方组成。工资和工时由工人委员会与厂方协商，投资方向由工程师协会提出技术方案，县合作社负责供应粮食、住房和运输。国家不直接经营企业，只通过地方技术网络掌握各联合体的生产报表和库存清单。这套制度的理论来源可以追溯到萨文科夫在流亡期间对俄国工业组织的分析，企业法团主义不是把工厂变成衙门，是协调各方利益之后做出经济行动。"
 POL_encourage_scientific_innovation:0 "鼓励科技创新"
 POL_encourage_scientific_innovation_desc:0"维特科夫斯基把华沙理工大学的实验室和罗兹的机械厂合并成“技术研发总局”。波兰不能永远用德国的机床造波兰的步枪，也不能永远用英国的电台听华沙的广播。通过科技创新，波兰的萨文科夫政权才能长治久安"
 POL_szlachta_shall_never_fall:0 "什拉赫塔永世不倒"
 POL_szlachta_shall_never_fall_desc:0"王冠可以换，议会可以解散，但管着林子、磨坊和渡口的人不会换。跨党集团在选举中的每一个选区协调、每一笔地方竞选开支、每一次与神父和县长的联络，最终都落在庄园的账房和管家的名单上。华沙的政府可以更迭，德国的顾问可以来去，奥地利的影响力可以涨落，但只要地方上的收租、雇工和救济仍然经由同一批人的手，什拉赫塔就不会从波兰的政治地图上消失。"
 POL_hail_the_leader:0 "向领袖致敬！"
 POL_hail_the_leader_desc:0"民族统一阵营的代表大会上，皮耶拉茨基被确认为“民族统一阵营领袖”，并规定此后所有公职任命和阵营提名均须经领袖核可。华沙的报纸在头版刊登了他的标准像，政府公署的墙上，他的肖像与毕苏斯基并排悬挂。向领袖致敬的口号出现在铁路工会的集会上、教区学校的结业典礼上和警察局的晨操中。全波兰都必须向领袖致敬！"
 POL_non_partisan_unions:0 "工会无党派"
 POL_non_partisan_unions_desc:0"工会联盟与各社会主义政党之间的正式联系被逐一切断，莫拉切夫斯基的理由是行政性的，只要工会的理事会仍然按党派比例分配席位，任何一次关于工时或工资的投票都会变成华沙政治走廊的延伸。但这一措施的实际效果远不止行政层面。PPS的旧同僚指责他要把工会变成一台没有政治意志的机器，莫拉切夫斯基的回应则指向索雷尔式的区分，工会不应该为政党服务，它是生产者在其劳动中形成的共同体。"
 POL_all_workers_patriotic:0 "全体工人皆爱国"
 POL_all_workers_patriotic_desc:0"“爱国”一词不再指向对华沙政府的忠诚，而是指向工人对波兰生产机体完整性的直接责任。莫拉切夫斯基的论点是：一个矿工维护矿井的运转，不是在为某个部长服务，而是为波兰独立强大奋斗。联盟的宣讲材料将“爱国”从政治修辞中剥离出来，附着于具体的行为。当国家的边界和工厂的围墙由同一批人守卫时，词的含义会由使用它的人重新决定。"
 POL_establish_peoples_democracy:0 "建立人民民主"
 POL_establish_peoples_democracy_desc:0"人民民主的制度设计在莫拉切夫斯基的方案中始终缺乏完整的成文宪法。其基本单元是工厂委员会和地域公社，代表通过公开表决产生，但候选人资格受到阶级出身的审查。中央层面设有一个由各公社和产业委员会代表组成的常设会议，负责协调经济计划和对外防务。莫拉切夫斯基论证说，这种设计避免了议会民主中“形式平等掩盖实质不平等”的缺陷，因为投票权不再附着于抽象公民身份，而附着于生产者在社会劳动中的位置。"
 POL_nationalization_and_communalization:0 "国有化和公社化"
 POL_nationalization_and_communalization_desc:0"国有化与公社化在莫拉切夫斯基的经济纲领中被设计为两条并行的轨道，关键工业收归国家所有，但管理权不由部委单独行使，而是由国家代表、工厂委员会代表和技术人员组成的三方理事会共同掌握。与此同时，地方消费合作社和中小企业被鼓励转为公社所有制，由工人集体直接管理，不受国家计划指令的约束。这一安排的意图是在重工业和基层经济之间建立一种分工，国家掌握战略杠杆，公社承担日常供给。"
 POL_gradual_regime_transition:0 "渐进体制转型"
 POL_gradual_regime_transition_desc:0"国家工党宣布分三阶段完成向工团主义共和国的过渡：第一阶段以劳动营与行业委员会网络覆盖全国工业中心，第二阶段将摄政时期的咨询性经济委员会改造为拥有立法动议权的行业院，第三阶段在德国与奥地利的战争压力缓解后，以全民公投确认国家工党对制宪会议的绝对主导。苏里格拒绝设定具体时限，理由是“波兰的独立不是一次投票，而是一代人的组织训练”。每一阶段都以外敌的压力浮动决定，使转型节奏在事实上与中欧帝国的战局波动绑定。"
 POL_achieve_state_socialization:0 "实现国家社会化"
 POL_achieve_state_socialization_desc:0"“国家社会化”是斯克瓦尔钦斯基全部纲领的终点。每一个社会团体都感到自己对国家存续负有责任，并不吝为它付出努力。行会、合作社、青年组织和地方议会都被纳入一个统一的义务网络，其成员资格与国家服务记录挂钩。国家的强制力退居幕后，取而代之的是由先锋队精英传导的社会压力。波兰不再是一个需要被统治的对象，而成为一个被其公民持续生产出来的共同体。"
 POL_vision_of_the_total_state:0 "总体国度之愿景"
 POL_vision_of_the_total_state_desc:0 ""
 POL_peoples_capitalism:0 "人民资本主义"
 POL_peoples_capitalism_desc:0"普里斯托尔从不认为“人民资本主义”是资本主义。新波兰的经济由参与者共同持有，但没有人能凭份额对行动方向提出异议。国营重工业的股份被拆分为小额凭证，分配给工厂工人与合作社社员，股息以现金支付，投票权则统一委托给国家经济总署行使。当一个工人手里握着自己工厂的股票时，他就不会会在德国人到来时第一个举手投降。"
 POL_welfarist_safety_net:0 "福利主义托底"
 POL_welfarist_safety_net_desc:0"普里斯托尔保留了旧劳动法中对工人相对有利的条款，同时用政府专员取代了被党派把持的委员会。福利必须发放，但发放福利的机构不能成为任何党派的据点。养老金、失业救济和公共工程就业被统一纳入国家社会保险总署的渠道，工人拿到的是钱，政权拿到的是名单。有了福利主义托底，工人自然会支持我们的统治"
 POL_rule_of_brutal_oppression:0 "暴力高压统治"
 POL_rule_of_brutal_oppression_desc:0"新波兰的经费向军警装备和训练倾斜，警察的成员从退役军官中招募。无尽的传唤、审查、拘留笼罩了波兰。街头越来越安静下来，恐惧变得日常而精确，而统治也日渐稳固。"
 POL_hyperindustrialization_under_authority:0 "威权指导下的超工业化"
 POL_hyperindustrialization_under_authority_desc:0"斯维塔尔斯基的经济计划不追求利润，不追求就业，甚至不追求消费品增长。它追求的是钢产量翻番和铁路和公路网运载军队的能力。私营工厂没被没收，它们被纳入总署订货网络，接受固定价格和优先原料，一切都要服务于波兰国家和人民的“共同利益”。"
 POL_empower_the_police:0 "赋权警察"
 POL_empower_the_police_desc:0"警察是我们的人，他们有权在没有法院令的情况下拘留嫌疑人，有权在“公共安全”的名义下关闭集会场所和查禁出版物，有权在边境地区实施特别身份检查。作为我们的行政工具，它的权力应该足够有效，但不应大到能够脱离总统办公室的控制。因此，扩权的同时，警察总监的任命权和预算审批权被集中到内政部，而内政部长直接对总统负责。这套安排让警察在操作层面拥有广泛的自由，但在战略层面没有独立行动的余地。"
 POL_bureaucratic_economic_system:0 "官僚经济体系"
 POL_bureaucratic_economic_system_desc:0"莫希奇茨基的经济政策既不是自由放任，也不是计划经济的替代方案。他的财政部推动的是一套官僚协调体系：国有银行和国有企业保留独立法人地位，但其投资计划和信贷分配须经新设立的“经济协调委员会”审核，该委员会由财政部、军事部和总统办公室的代表组成。私营企业不受直接控制，但它们的关税保护、政府采购合同和外汇配额须经同一委员会的批准。这套体系不废除市场，只是让市场的每一个重要参与者都知道，自己的生存取决于与委员会的关系。经济政策的目的是确保国家在战时能够调动资源，同时不破坏和平时期的生产结构。协调委员会不制定价格，只决定谁有资格在什么条件下获得资源。"
 POL_decentralized_planned_economy:0 "去中心化计划经济"
 POL_decentralized_planned_economy_desc:0"克维亚特科夫斯基的四年计划已经暴露出一个技术问题，即投资分散在太多项目上，彼此之间缺乏协调，部分工厂建成后找不到稳定的原料供应。中央计划局的回应通常是增加更多的审批层级，但克维亚特科夫斯基选择了另一个方向——把部分计划权下放到地区工业联合体。联合体由当地的工厂经理、合作社代表和技术学校的工程师组成，负责在中央分配的信贷和原料额度内，决定本地区优先发展哪些产业环节。中央计划局保留对铁路运价、电力分配和国防订单的控制权，但不再为每一个车间规定产量指标。去中心化不是放弃计划，而是把计划的单位从“国民经济”缩小到“地区生产体系”，让熟悉本地铁路支线和原料来源的人来填写表格上的数字。"
 POL_implement_the_four_year_plan:0 "制订四年计划"
 POL_implement_the_four_year_plan_desc:0"四年计划的核心是一份投资优先序列，先建电站和铁路等基础设施，再建金属加工和化工，最后是纺织和食品。中央工业区选址在维斯瓦河与桑河之间，距离东部边界和西部工业区都有足够的纵深，同时拥有相对廉价的劳动力和尚未开发的本地原料。克维亚特科夫斯基不追求每一个指标都按时完成，他允许地方联合体在信贷额度内调整项目顺序，只要年底的总体支出和就业数字对得上。计划在他手中是一件可以伸缩的工具，不是一部必须逐字执行的经文。"
 POL_simplify_the_tax_system:0 "简化税制"
 POL_simplify_the_tax_system_desc:0"波兰的税制在1930年代是一堆彼此重叠的临时措施：土地税、工业税、营业证书费、印花税、地方附加税，以及各种在危机期间设立的特别捐。克维亚特科夫斯基宣布的“小税制改革”把大多数直接税合并为一种累进所得税，废除了工业证书和大部分印花税，把地方附加税的上限固定在直接税的百分之十五。简化的目的不是减税，而是让投资者能够计算自己的税后成本。中央工业区的企业获得为期十年的所得税减免，条件是它们必须使用国产原料和雇佣一定比例的本地工人。税制改革没有触动间接税，但它改变了直接税的结构，让那些在四年计划中获利的企业承担了更大份额的行政和国防开支。"
 POL_strengthen_administrative_apparatus:0 "强化行政机构"
 POL_strengthen_administrative_apparatus_desc:0"巴特尔要求每位部长在就职前提交一份签名但未注明日期的辞呈，总理可以随时填写日期并接受辞职。部长们被禁止参与政党活动，在议会发表演讲前须将文本提交总理办公室审核。政府会议议程由巴特尔本人准备，未经他同意不得讨论任何议题。这些措施在反对派口中被称为“总理的独裁”，但行政机构不需要独裁者，它需要的是清晰的指挥链和可预期的问责机制。辞呈放在总理抽屉里不是为了随时解雇部长，是为了让部长知道自己的职位取决于工作表现，而不是政党背景。"
 POL_depoliticize_the_army:0 "军队去政治化"
 POL_depoliticize_the_army_desc:0"巴特尔在内阁会议上恢复了之前关于最高军事权力组织的法令，该法令允许军事部在不受政府和议会控制的情况下管理军队。这项措施在表面上是为了满足毕苏斯基对军队自主权的要求，但巴特尔的真实意图是将军队从政党竞争中抽离出来。军官团的晋升不再取决于党派关系，军事预算不再经过议会各委员会的党派分配，军队的指挥链直接通向总统和军事部长，不经过内阁。军队不需要在议会里有朋友，它需要在议会里有预算。只有军队去政治化，民主事业才能从军官手中存活。。"
 POL_rule_of_the_warsaw_democratic_club:0 "华沙民主俱乐部的统治"
 POL_rule_of_the_warsaw_democratic_club_desc:0"“华沙民主俱乐部的统治”这个说法最初出现在反对派的讽刺文章里，指的是民主党把政府变成了一个由城市知识分子和专业人士组成的俱乐部。夸希涅夫斯基没有反驳这个说法，但他补充说，俱乐部不是秘密会议，是民主生活的一种形式。不同职业、不同地区、不同信仰的人在一个非正式的场合里交换意见，比在正式会议上念稿子更容易发现哪些政策是行不通的。民主党不建立严密的党组织，不设地方书记，不发行中央机关报，它的协调靠的是俱乐部之间的通信和议会党团的每周例会。民主党的力量不在于它有多少党员，在于它有多少人愿意在俱乐部里花时间讨论那些别人觉得不值得讨论的细节。民主理性的统治不是从宫殿里发出的命令，是从这些细节里慢慢长出来的共识。"
 POL_poland_gods_country:0 "波兰—上帝之国"
 POL_poland_gods_country_desc:0"波兰不是诸多民族国家之一，它是上帝在历史中选定的工具，它的苦难和复兴都是某种更高计划的一部分。所以，公共生活必须按照一种特定的方向组织，教会监督教育，道德秩序约束市场，权威来自上帝而非选票，民族的使命是在尘世中为神圣秩序准备道路。宪法才不是什么社会契约的文本，它是民族精神在制度中的体现；法律也不是利益平衡的工具，它是道德秩序的强制执行。上帝的法在人的法之上，而在波兰，人的法由那些知道上帝的法是什么的人来制定。"
 POL_national_vertical_integration:0 "国家垂直整合"
 POL_national_vertical_integration_desc:0"科茨把工业领域的重组称为“垂直整合”，意思是将从原材料到成品再到销售的各个环节纳入同一个行业委员会。煤矿、钢铁厂、机械厂和铁路运输在煤炭-冶金联合体中各派代表，由联合体技术委员会统一协调产量和运输计划。纺织业的棉花采购、纱线生产和布匹销售由纺织联合体统一管理。国家不直接经营联合体，但联合体主席的任命须经民族统一营经济委员会确认。"
 POL_savior_of_the_nation:0 "国家的救世主"
 POL_savior_of_the_nation_desc:0"毕苏斯基是我们波兰国家的救世主，他在挽救了国家，挽救了政体，留下了一套不需要他本人也能运转的制度。他不需要亲自在场，他的制度就是他的在场。但救世主的制度需要有人来守护，需要有人确保元帅留下的方法不被议会里的妥协和部委里的惰性所稀释，那个人就是米耶津斯基。毕苏斯基元帅教会我们如何行动，他的守护者米耶津斯基教会我们如何坚持。"
 POL_war_against_the_masses:0 "对群众的战争"
 POL_war_against_the_masses_desc:0"“战争”的目标不是阶级或民族，而是“群众的统治”。群众不思考，只反应；不选择，只跟随；不创造，只消费。议会民主、公社大会和劳工军运动，都是群众统治的不同形式，它们的共同后果是把文化拉平到最低的感知水平。"
 POL_fight_for_slavic_unity:0 "为斯拉夫统一而战"
 POL_fight_for_slavic_unity_desc:0"华沙的“斯拉夫复兴研究所”发布了一份地图，斯拉夫聚居区被两种颜色覆盖。绿色区域标注的是已斯拉夫民族统一化的地区：从维尔纽斯到考纳斯，从布列斯特到普热梅希尔，这些地方的铁路调度、粮食储备和民兵名册已经并入联邦档案。红色区域标注的是尚未加入的斯拉夫聚居地：波美拉尼亚、西里西亚、斯洛伐克，以及巴尔干半岛上那些仍受日耳曼渗透的地方。为了斯拉夫民族的伟大统一，即使是发动欧陆战争也在所不惜，这将是民族的决战。"
 POL_freer_market_greater_nation:0 "市场越自由，国家越伟大"
 POL_freer_market_greater_nation_desc:0"一个能让自己公民自由经营的国家，才能在柏林和莫斯科面前站得住。博琴斯基推行的改革把国有企业的经营权下放给县合作社和私人投资者，废除行会限制和价格管制，同时把节省下来的行政开支投入军队和外交部门。市场创造财富，财富供养强大的国家，强大的国家保卫市场。"
 POL_polish_fuhrer:0 "波兰的元首"
 POL_polish_fuhrer_desc:0"温季亚戈尔斯基成立了“民族统一委员会”，由他担任主席，协调各部工作。总统职位保留，实际权力转移到委员会。这位波兰的元首穿旧军装，在雅沃鲁夫的庄园里开人民大会，任何合作社或车间都可以派代表来，站在草地上把诉求喊出来。波兰的每处都挂着他的画像，这位萨文科夫的密友，如今做到的事情已经超越萨文科夫了。"
 POL_rule_of_the_intelligence_agency:0 "情报机构的统治"
 POL_rule_of_the_intelligence_agency_desc:0"火枪手的情报网络在已经成为波兰的实际行政骨架，各部的文件在发布前先送到火枪手的情报处过目，县公署的人事变动需要情报处的联络官签字确认。维特科夫斯基的办公室里没有政府公报，只有一墙的卡片柜，登记着各路联络人的姓名、职业和可用资源。他不需要任命省长，只需要知道每个省里谁能在半夜接到电话后组织一支战斗队。只要情报系统还在，波兰的秩序就在。"
 POL_classless_society_of_producers:0 "无阶级生产者社会"
 POL_classless_society_of_producers_desc:0"工会联盟的最终纲领没有使用“无产阶级专政”这一表述，也没有使用“消灭阶级”的传统公式。它描述的是一个由生产功能而非阶级身份组织起来的社会：每个人在其中的位置取决于其所从事的劳动在国民经济中的功能，而非其对生产资料的占有关系。莫拉切夫斯基将这个构想追溯到索雷尔对“生产者”的界定。真正具有创造力的阶级是那些在劳动中得到拯救的人，而金融投机者和寄生的地主则被排除在这一范畴之外。"
 POL_class_struggle_is_the_truth:0 "阶级斗争是真理"
 POL_class_struggle_is_the_truth_desc:0"任何政治制度、经济安排或文化主张，其性质只能通过追问“它服务于哪个阶级”来判定。这一原则被应用于人民民主自身的机构，莫拉切夫斯基要求这些机构定期接受阶级成分的审计，以防止它们被“形式上无产化、实质上资产阶级化”的群体所占据。同时，判定阶级性质的标准应当由工人的直接行动来检验，而非由任何委员会来宣布。"
 POL_the_marshal_was_the_marshal_is_the_marshal_shall_be:0 "元帅活在过去！元帅活在现在！元帅将会永存！"
 POL_the_marshal_was_the_marshal_is_the_marshal_shall_be_desc:0"斯克瓦尔钦斯基以“行动”重新定义了毕苏斯基的时间性。元帅活在过去，因为传统是民族自我认识中恒久的根基，过去的功绩蕴藏着未来的力量。元帅活在当下，因为每一次先锋队成员在乡村或工厂中的实践，都是“行动爱国主义”对元帅指示“去，做”的重复。元帅将会永存，因为当国家社会化完成、自由人类型取代奴隶类型之时，对元帅的需要便不再依赖于任何具体的活人。这句口号不是对死者的召唤，而是对一项已完成事业的宣告。"
 POL_republic_shining_new:0 "共和国，崭新闪亮"
 POL_republic_shining_new_desc:0"共和国终于开始按照它自己宣称的原则运转了，党派政治被逐出行政序列之后，部长们第一次可以不因议会倒阁而中断工作；老同志们带着地方经验和旧网络回到办公室，填补了政党退出后留下的每一处空白；福利金从国家社会保险总署的窗口按月发放，领取者不再需要先向某个党的地方委员会证明自己的忠诚。波兰社会主义共和国，崭新闪亮。"
 POL_the_nation_sings_in_unison:0 "全国同声歌唱"
 POL_the_nation_sings_in_unison_desc:0"四月宪法终于被完整地执行，总统的权力也不再被议会的算术多数稀释；工团已经干净，工厂在军靴的节奏中运转；恩庇网络让每一个忠诚的人都有了位置，高压统治让街头安静；超工业化让烟囱在东部平原上竖起。如今的波兰，全国上下的声音只剩下一个，那就是斯维塔尔斯基的声音。"
 POL_no_turning_against_the_state:0 "无逆于国"
 POL_no_turning_against_the_state_desc:0"“无逆于国”——没有任何事可以违背国家——是莫希奇茨基对一群即将上任的行政官员说的话。每一份公文在签发前须确认不违背现行法律，现行法律在解释时须以国家利益为优先，而国家利益的定义权归中央。官员在做出判断之前先确认自己的判断与国家的方向一致，国家不是抽象的理念，是每一个官员每天在公文上签下的名字所构成的总和。波兰国家是至高无上的，所有人都必须唯它是从。"
 POL_economic_development_utmost:0 "经济高于政治"
 POL_economic_development_utmost_desc:0"政治决定谁坐在办公室里，而经济决定办公室里人可坐。四年计划、中央工业区、税制简化、研究所的数据网络，这些东西的寿命会比任何一届政府、任何一个执政集团都长。政党轮替、宪法修正、外交结盟，这些事在报纸上占据头版，但铁路支线一旦铺好，工厂一旦投产，它们就会自行运转，把下一个政权也绑在同一条轨道上。政治当然重要，但我们必须先让国家在经济上站住，然后政治才有东西可以争取。"
 POL_genuine_parliamentary_democracy:0 "真正的议会民主"
 POL_genuine_parliamentary_democracy_desc:0"旧的议会制在波兰已经“超越了自身寿命”，议员把职位当成了职业，党魁把议会当成了分配部长席位的市场，而绝大多数议员只是被动地跟随党团投票。我们必须改革选举制度，减少议员人数，延长任期，取消政党名单制，改为选区直选。真正的议会民主不是党魁分配席位的寡头政治，也不是被行政机构设定边界的“有管理的议会制”，而是一种还没有在波兰出现过的制度。它还尚未完全出现，但巴特尔有信心创造出真正的议会民主制。"
 POL_achieve_total_political_dominance:0 "实现彻底政治支配"
 POL_achieve_total_political_dominance_desc:0"如今，民族统一营不只一个政治组织，它变成了一套覆盖全国的支配性体制。它的地方联络官同时兼任县合作社的监事、波兰银行分行的信贷审核员和老兵协会的区代表，三份名册合成一份档案，每一个村庄里谁有资格获得贷款、谁的名字进入合作社理事名单、谁的退役军官身份得到承认，全部由这同一份档案决定。政权、军权、财权合一，这套体制不靠逮捕令运转就实现了“行政的统一”。"
 POL_polish_shogunate:0 "波兰幕府"
 POL_polish_shogunate_desc:0"米耶津斯基提出了一套他称之为“实际权力结构”的方案。总统保留宪法赋予的全部头衔和仪式职能，议会保留辩论和表决的形式，但真正的决策权集中在两个机构：民族统一营最高委员会和总参谋部——前者由米耶津斯基主持，负责政策制定和人事任命；后者由他早年的情报部下掌管，负责所有涉及国家安全的情报事务。各部委的部长名义上对总统负责，实际上须向最高委员会提交月度报告。米耶津斯基在会议记录中把这套安排比作“一座房子有两个入口”，正门供外宾和记者通行，侧门通向真正的办公室。至此，一个“波兰幕府”在东欧建立起来。"
 POL_bongo_above_all:0 "邦戈高于一切！"
 POL_bongo_above_all_desc:0"“邦戈”是维特凯维奇在小说里创造的角色——一个从疯狂中汲取力量、最终超越所有社会规范的个体。密党的所有行动，包括对群众的战争、对精神贵族的挑选、对社会金字塔的重新码放，最终都是为了一个目的——让邦戈所代表的那种个体经验成为波兰的立国原则，它是个体在孤独中与自身疯狂对峙时获得的那种认知。邦戈高于一切，因为邦戈是唯一不需要群众批准的真理。"
 POL_the_peasant_strike:0 "农民大罢工！"
 POL_the_peasant_strike_desc:0"没有人记得第一袋粮食是什么时候没有运进城的，也许是某个县的农民算了一笔账，发现卖粮的钱不够付收割工钱，于是把麻袋重新扎紧，堆回谷仓角落。无数消息沿着乡间土路传开，第二天邻村也把粮车停在了自家院里。集市空了之后，警察骑马冲进一个村子抓走几个人，结果通往城里的桥第二天被堵住了。人群里有人带着镰刀，那是收割用的，至少一开始是。农民们把圣伊西多尔的画像从墙上取下来举在队伍前面，画像上的圣徒正在祈祷，两头天使替他扶着犁。退伍的军士在打谷场上教年轻人列队，用木棍代替步枪。从华沙回来的年轻人坐在磨坊门口，在包装纸上写东西，念给围坐的人听，念到一半被另一个声音打断，又从头念起......这些事之间没有联系，它们只是同时发生了。晚上，人们围坐在火边听老人讲很久以前的事——讲科希丘什科，讲收割后最后一捆麦穗要编成花冠，讲有些年头地里的东西不是给城里人种的。火光照着每一张脸，每一张脸都一样，又都不一样。"
 POL_return_of_the_specter:0 "幽灵的回归"
 POL_return_of_the_specter_desc:0"民族民主党虽然早已被逐出权力走廊，但其地方组织却从未真正解散。它们退回到合作社监事会、教区慈善委员会、医生和律师的职业行会，以及那些仍然记得“皮亚斯特波兰”口号含义的乡村选区。德莫夫斯基在流亡俄国建立的联系，使民族民主党获得了一个萨纳奇亚无法复制的东西，一个在柏林和莫斯科之间都拥有对话渠道的东方政策替代方案。正因如此，那个被宣布为“过时”的幽灵重新出现在政治光谱上，它是民族精英的统治、政治化的天主教作为动员工具、经济自给自足以切断对德国资本的依赖，以及一个以语言和信仰而非历史边界定义的波兰。"
 POL_the_military_coup:0 "军事政变"
 POL_the_military_coup_desc:0"罗拉·日米耶尔斯基花了几个月时间逐一拜访那些老伙计——1926年5月与他一同从索哈切夫向华沙进军的旧部，那些在他被判刑后没有烧掉他来信的军官，那些在切哈努夫军区和第二步兵旅时代与他共过事、如今被调去边远军械库或预备役名册的人。在此之后，他亲自走进华沙卫戍司令部的值班室，宣布军事法庭已被授权接管首都秩序，直到合法宪政恢复为止。这场政变只由他本人领导，参与者仅限于现役军官，不涉及任何政党。"
 POL_the_red_general:0 "红色将军"
 POL_the_red_general_desc:0"村子们开始流传同一个名字，博莱斯瓦夫·罗亚。他不在华沙，也不在任何罢工委员会里。他此时的身份已经不是军人，而是一个被军队除名、被议会除名的农民之子。他曾因为反毕苏斯基而被解职，后来他代表激进农民党进过议会，又辞了职，因为他认定议会解决不了农民的问题。农民在军团里流过血，独立以后却没有拿到应得的那份土地和社会正义。他称自己是“红色将军”，不是因为那些虚伪的布尔什维克，而是因为他把农民的社会诉求和独立事业看作同一件事。那些零散的村社队伍和退伍军士的队列，起初各自为政，后来开始有人用“罗亚的人”来称呼自己。罗亚对此不置可否，他继续从一个县走到另一个县，把分散的农民运动缓慢地拧成一股有方向的力量。"
 POL_green_poland:0 "绿色波兰"
 POL_green_poland_desc:0"弗朗西谢克·卡明斯基在“维齐”青年组织和人民党内部工作了十年，他知道华沙的议会走廊不会给农民任何东西。土地改革在庄园主的抵制下变成了一纸空文，而暴力斗争换来了几十具尸体和数千人被逮捕。绿色波兰是卡明斯基从“维齐”的农村青年网络、消费合作社和斗争中幸存下来的村社委员会里编织出来的东西。一个以土地为基础、以合作社为骨架、以农民自卫为边界的政治秩序。它不等待城市的许可，也不承认庄园主和银行对乡村的处置权。绿色波兰的边界不在任何地图上，而在每一个停止向城市运送粮食的村庄里。"
 POL_blue_flame:0 "蓝色火焰"
 POL_blue_flame_desc:0"波德哈莱的山谷里已经没有人能说清楚有多少支武装在活动，约瑟夫·库拉什只是其中最大的一支。这一缕蓝色火焰已经席卷新塔尔格到扎科帕内的整个地区，并且很快将烧尽波兰的旧秩序，而新的权力就来源于他手下士兵们枪口跳动的蓝色火焰。"
 POL_unite_the_national_democratic_movement:0 "团结民族民主运动"
 POL_unite_the_national_democratic_movement_desc:0"民族民主运动老一代的活动家控制着党组织和合作社网络，青年翼“全波兰青年”在大学城里活动，而“民族激进阵营”的残部则在街头与警察周旋。为了实现我们事业的成功，团结民族民主运动是必不可少的，让我们把这个运动重新整合起来，然后纳入民族民主党的事业吧。"
 POL_modernized_nationalism:0 "现代化民族主义"
 POL_modernized_nationalism_desc:0"经济独立是政治独立的前提，现代化即减少对德国资本和德国市场的依赖，而不是简单地追求重工业指标。现代的民族主义在这里不再是一套关于血统和语言的排他性学说，而是一份经济计划。每一个被保留下来的关税壁垒背后，都有一份关于本国生产能力的技术报告。德莫夫斯基所设想的民族精英被具体化为一个由工程师、经济学家和行政官员组成的委员会，只有把握波兰自己的经济命脉，波兰民族主义才能强大起来。"
 POL_appease_the_sanacja_followers:0 "安抚萨纳齐亚分子"
 POL_appease_the_sanacja_followers_desc:0"萨纳齐亚体制的军官和官僚在被逐出政治决策层之后，仍然掌握着部分军队的指挥链、企业的管理层和地方行政的运作经验。我们暂时还不能把他们一脚踢开，为了波兰民族事业的发展，他们可以保留军衔、职位和退休金，但要交出政治上的独立行动权。"
 POL_hammer_and_sickle:0 "锤子与镰刀"
 POL_hammer_and_sickle_desc:0"波兰共产党已经不存在了，留下的是一群失去组织、失去经费、彼此之间只剩下熟人关系的旧成员，以及几个在占领前就开始自行活动的激进农民小组，罗拉没有试图重建旧党。他让“锤子与镰刀”这个名称继续留在传单和油印小报的报头上，但组织本身被重新编组为军事编制：每个小组有一名政治联络员和一名军事联络员，前者负责与旧共产主义者接头，后者负责武器和通讯。军事共产主义才是真共产主义！"
 POL_purge_the_left:0 "清洗左派"
 POL_purge_the_left_desc:0"那些在政变前就与日米耶尔斯基共事、却在政变后开始讨论“党的独立性”的旧共产主义者必须被清除，把他们调离原岗位，前往东部林区的合作社担任顾问。拒绝调离的人被移交军事法庭，罪名是在动员期间散布失败主义言论。左派都是一群卖国贼，他们虚无缥缈的幻梦只会让波兰走向深渊。"
 POL_peasant_self_help_organizations:0 "农民自助组织"
 POL_peasant_self_help_organizations_desc:0"农民大罢工从一开始就没有等待华沙的许可，在一些县里，农民们重新拾起了几十年前就存在的东西，例如斯特凡·斯特夫奇克在加利西亚推广的储蓄贷款合作社，以及更早的农业圈子，那些在冬季夜晚聚在一起讨论种子和农具的村社组织。这些网络在太平年月只是用来凑钱买一台脱粒机，或者担保一笔小额贷款，但在粮价崩溃、警察进村抓人的时候，它们变成了别的东西。一个村子里的储蓄合作社同时是消息传递的节点，农业圈子的成员名单同时是可以在半夜召集起来的人力名册。如今，这些互相担保的网络已经不再需要任何人从华沙发出指令，它们自己知道该在什么时候收紧、什么时候放松。"
 POL_liquidate_the_sanacja_nobility:0 "清算萨纳齐亚贵族"
 POL_liquidate_the_sanacja_nobility_desc:0"萨纳齐亚体制在波兰的根基从来不只是军营和警察，它同时是一张由土地、官职与银行信贷编成的网络。参与五月政变或在军团中与毕苏斯基共事的人获得了庄园和国有林场的经营权，退役军官被安置在县公署和合作社监事会，萨纳齐时代的部长们把国有企业的合同批给了与自己有姻亲关系的承包商。这张网络在经济危机中愈发显眼，当农民和工人承担紧缩的全部代价时，萨纳齐亚的受益者阶层却通过国家银行的信贷和关税保护维持了自己的地位。清算萨纳齐亚贵族，意味着不仅要追究政治责任，还要拆解这套以功勋换土地、以军衔换官职、以关系换合同的分配机制。我们必须把萨纳齐亚体制下以政治忠诚为条件分配的资产重新交还给公共控制。"
 POL_restore_democratic_institutions:0 "恢复民主制度"
 POL_restore_democratic_institutions_desc:0"卡明斯基在维齐的档案里保存着罢工期间各村的诉求清单，其中最核心的一条不是土地，而是旧宪法剥夺了农民在议会中的实际代表权。绿色波兰的政治纲领从这条诉求开始，恢复宪法的议会制框架，废除总统任命参议院的条款，恢复普选产生的议会，取消对政党活动的行政限制。卡明斯基不把民主视为一种抽象原则，而视为农民运动在战前十年里已经学会使用的工具。人民党在之前的选举中获得的席位，靠的是村社大会、教区网络和合作社的动员，而不是任何人的恩赐。恢复民主制度意味着把这些被萨纳奇亚行政命令关闭的通道重新打开。"
 POL_grand_coalition_of_free_parties:0 "自由政党大联合"
 POL_grand_coalition_of_free_parties_desc:0"人民党的历史告诉卡明斯基，单独行动无法对抗国家机器。于是他与波兰社会党的流亡活动家、国家民主党中反对萨纳奇亚的一翼、以及基督教民主派的地方组织恢复了先前的联络渠道。大联合的基础不要求意识形态的一致，而是对同一组民主程序的共同接受。自由选举、议会主权、司法独立、结社与出版自由。农民不要求其他党派接受人民党的土地纲领，只要求它们承认农民有权在议会中为自己的利益投票。这种联合在绿色波兰的框架内不表现为一个统一的政党，而表现为一个政治联盟——各党派保留自己的组织和纲领。"
 POL_encourage_agricultural_cooperatives:0 "鼓励农业合作社"
 POL_encourage_agricultural_cooperatives_desc:0"无论是谁控制乡村，合作社都是最现成的组织工具。它在前政权时期就已存在，但长期受制于华沙的信贷管制和县公署的行政干预。现在，新的权力中心不再等待华沙的许可，合作社注册权下放到县一级。它可以收粮、加工、销售，也可以组织自卫、传递消息、分配救济。这套安排的好处是，农民熟悉合作社的语言，不需要被说服加入一个陌生的组织，而控制乡村的势力则获得了一个现成的骨架，可以按自己的需要往里面填充内容。"
 POL_stand_up_for_tradition:0 "为传统挺身而出"
 POL_stand_up_for_tradition_desc:0"站稳脚跟后，库拉什没有把自己的规矩局限在山谷里。波兰农民的传统如今纷纷复活——村社大会、教区节庆、收割后的花冠、婚礼上的民歌、以及那些在低地城市里被行政命令和商业潮流冲散的乡村习俗。他恢复了被废除的村社公决，把教会学校和地方方言重新列入课程，保护集市和朝圣活动不受城市官员干涉。在他看来，只要是耕种土地、遵守村社规矩、送子女进教堂的人，都属于同一个传统。"
 POL_dmowski_pilsudski_synthesis:0 "德莫夫斯基—毕苏斯基思想"
 POL_dmowski_pilsudski_synthesis_desc:0"德莫夫斯基提供了民族的社会定义，即一个以语言、信仰和共同经济命运为纽带的文化共同体，它的精英有责任引导它穿越外部压力。而毕苏斯基提供了国家的能力框架，即一个不受议会辩论掣肘的行政中枢，一支独立于党派斗争的军队，以及一套以地缘现实而非意识形态亲疏决定敌友的外交方针。德莫夫斯基的民族是内容，毕苏斯基的国家是容器；内容决定了容器必须足够坚固，容器决定了内容能够以什么形式存在。在具体政策上，这意味着民族民主运动的地方网络被用来动员社会对重整军备和经济自给的支持，而萨纳齐亚遗留下来的军事和行政机器被用来执行这些政策。这套新的思想不要求任何人宣布自己放弃了旧信念——德莫夫斯基的信徒可以继续读《一位现代波兰人的想法》，毕苏斯基的旧部可以继续挂元帅像。民族与国家，在此处合为一体。"
 POL_force_merger_of_communist_parties:0 "强迫合并共产党"
 POL_force_merger_of_communist_parties_desc:0 ""
 POL_declare_martial_law:0 "颁布戒严令"
 POL_declare_martial_law_desc:0"日米耶尔斯基在政变后的第一份公告措辞很简短：全国进入紧急状态，集会、出版和罢工须经军事当局批准，普通法院审理涉及“国家理由”的案件时须有军事法官在场，夜间通行须持特别许可。戒严令没有规定终止日期。各省的驻军司令被授权在辖区内执行戒严条款，执行情况每周向革命军事委员会汇报一次。本令自公布之日起生效，直至国家秩序完全恢复。"
 POL_rule_by_supreme_decree:0 "乾纲独断"
 POL_rule_by_supreme_decree_desc:0"日米耶尔斯基在军事委员会的会议上从不举手，他坐在长桌的一端，听各处处长汇报，然后说出决定。决定不需要投票，不需要附议，只需要记录在案。革命军事委员会的会议记录本上，每一页的末尾都印着同一行字：本决定由委员会主席批准。罗拉本人就是委员会主席，但他很少签全名，通常只写一个“R”。各处的处长很快学会了不在会议上提出替代方案，只提出需要主席决定的问题。到最后，革命军事委员会的决策流程已经简化到极点：问题提出，罗拉决定，各处执行。"
 POL_expose_bolshevik_anticommunism:0 "揭露布尔什维克的反共本质"
 POL_expose_bolshevik_anticommunism_desc:0"布尔什维克的军队肆虐俄罗斯时，波兰的墙上也贴满了画。画上的红军士兵用鞭子抽打农民，把死者脚上的靴子剥下来，身后的村庄在燃烧。如果我们今天不拿起武器，明天就会在布尔什维克的鞭子下交出一切。布尔什维克承诺把土地给农民，但他们在俄国做的事是把土地收归国家，然后派城里的工人来管理，农民仍然只是被管理者。这只不过是用别人的手拿走你的地，布尔什维克的口号听起来像是在帮农民，实际上是把农民从地主的手里转到国家的鞭子下面。罗亚并不是反共分子，他反对的是那些偷走共产主义名义的人，他们把农民的社会诉求变成了一句空话，然后在农民明白过来之前就把土地交给了新的主人。"
 POL_unify_the_peoples_movement:0 "统一人民运动"
 POL_unify_the_peoples_movement_desc:0"人民运动在先前分裂为“皮亚斯特”、“维兹沃莱涅”和“农民党”几个派系，之前的统一尝试只维持了表面的团结，旋即再次瓦解。卡明斯基的切入点是维齐青年组织，这个在1930年代成长起来的农村青年网络没有沾染战前派系斗争的包袱，其成员在罢工中是各村实际的组织者。绿色波兰把维齐的骨干编入人民运动的各级委员会，用青年组织的纪律替代旧派系的人事平衡，从而统一人民运动。"
 POL_strengthen_peasant_guards:0 "强化农民卫队"
 POL_strengthen_peasant_guards_desc:0"农民卫队的前身是罢工期间各村自发形成的守卫小组，任务是保护村社的粮食和集会不受警察和地主武装的侵扰。卡明斯基将其正式化，编为农民营的地方分支，但不纳入正规军体系。卫队的成员不脱离生产，武器以猎枪、改装农具和退役步枪为主，训练在夜间和农闲时进行。卫队的指挥权归人民运动的县委员会，而非华沙的军事当局。农民卫队既要能够在旧地主武装的压力下保护村社，又不能变成一支脱离地方控制的军事力量。"
 POL_peasant_dictator:0 "农民的独裁者"
 POL_peasant_dictator_desc:0"库拉什从不自称独裁者，但他确实是一个人说了算。他的权力来源是各村按户摊派的粮食和青壮年。他是农民的儿子，他打的是农民的仗，他定的规矩是农民祖辈传下来的规矩。反对他的村子被切断山路，支持他的村子获得武器和物资。这套统治没有宪法，没有任期，也没有继承人安排，它只是农民意志的化身延伸到了每一条山谷和每一个愿意接受他保护的村子。"
 POL_market_freedom_against_liberalism:0 "市场自由反对自由主义"
 POL_market_freedom_against_liberalism_desc:0"扬·兹季托维茨基接掌青年民族主义者联盟时，这个组织还只是波兹南一群经济学讲师和法学学生的讨论圈子。但如今，这个圈子已经成为民族民主党的最大势力。他反复区分两个概念：经济自由与自由主义。前者是让工厂主自行决定生产什么、让农民自行决定把粮食卖给谁，后者则是一整套关于个人权利优先于民族共同体、议会程序优先于行政效率、市场规律优先于道德秩序的学说。波兰需要“富有的个人，富有的民族”，但个人的富有只有在服务于民族整体时才是正当的。当某个人或某个集团的经济行为开始削弱民族共同体时，国家有权介入。市场是工具，民族是目的。自由主义把工具当成了目的，而新体制要把工具放回它该在的位置。"
 POL_anti_liberal_revolution:0 "反自由革命"
 POL_anti_liberal_revolution_desc:0"扬·埃米尔·斯基夫斯基之前是华沙文学界最尖锐的批评家之一，他从右翼立场攻击过热列梅斯基的“心理学深度”，也在《波兰报》的版面上与萨纳齐的文化官僚周旋过。他写的《论政治》手稿里反复推敲的问题是，自由主义在波兰的失败究竟败在哪里。他的答案是：自由主义把自治降格为选举日的一次性授权，选民投完票就被打发回日常生活，而真正的权力留在银行和部委的走廊里。反自由革命要做的是把自治从投票站拉回车间、合作社和行业联合体，让每一个直接承担后果的人直接做出决定。"
 POL_reach_out_to_the_international:0 "向国际示好"
 POL_reach_out_to_the_international_desc:0"波兰的革命政权愿意与第三国际建立“工作关系”，但不会接受任何外部机构对波兰内部事务的指导。作为善意的表示，波兰允许法国和英国的工会代表团访问华沙和罗兹的工厂，安排他们与工人委员会座谈，并允许代表团的报告经伦敦和巴黎的报纸刊发。国际的承认是一张通行证，我们必须利用他们的力量。"
 POL_try_the_traitors:0 "审判国贼"
 POL_try_the_traitors_desc:0"革命军事委员会成立了一个特别法庭，专门审理过去“损害国家利益”的案件。法庭的被告名单包括萨纳奇亚政府的前部长、总参谋部中参与过镇压的军官、以及那些在签署过政治判决的法官。审判程序不公开，证据以书面形式提交，被告有权聘请律师，但律师须经军事当局认可。判决结果分为三类：剥夺公职和退休金、流放至东部林区劳动营、死刑。对这些国贼的判决为终审，不得上诉。"
 POL_the_new_marshal_cult:0 "新元帅崇拜"
 POL_the_new_marshal_cult_desc:0"革命军事委员会的新闻处把政变以来元帅签署的所有命令和公告汇编成册，印上他的军衔和职务——波兰大元帅、革命军事委员会主席、武装部队总司令。这本册子被分发到各部队和军事训练班，作为政治教育的指定读物。宣传处随后在全国各驻军司令部设立了“元帅办公室”的常驻代表，这些代表只负责传达罗拉本人的指示，并监督各部队对革命军事委员会决议的执行情况。没有大元帅，我们吃什么？"
 POL_puppetize_democrats_and_unions:0 "傀儡化民主派与工会"
 POL_puppetize_democrats_and_unions_desc:0"日米耶尔斯基没有取缔民主派政党和工会。他让它们继续存在，政党和工会可以保留机构，但须接受革命军事委员会指定的联络员常驻其领导机构；联络员有权查阅所有会议记录和财务账目，有权在“危及国家秩序”的情况下暂停任何决议的执行。波兰的民主派政党和工会仍然在举行集会、印发传单、通过决议，但所有这些活动的记录都同时出现在革命军事委员会情报处的档案柜里。"
 POL_land_to_the_peasants:0 "土地归于农民"
 POL_land_to_the_peasants_desc:0"从波兰被瓜分的时代起，外国占领当局就各自推行土地政策，波兰农民脚下的土地被重新登记为外国王室、贵族或移民委员会的地产，波兰地主中一些人保住了庄园但须向新主人效忠，另一些人则直接被剥夺。到农民罢工前，这些土地经过几轮转手，产权关系已经纠缠不清，外国资本、波兰地主和抵押银行各持一部分，而耕种者手中几乎没有完整的地契。土地问题从来不只是经济问题，每一次瓜分、每一次外国占领、每一次银行重组，都是同一个过程的不同阶段。他们把农民从土地上剥离，再把土地交给那些不需要亲手耕种的人。罗亚提出的办法是县合作社登记造册，把大地产和外国资本控制的林场、磨坊、草场按当地农户的劳动力无偿分配，我们必须为农民清算几百年间累积下来的剥夺。"
 POL_fight_for_liberal_democracy:0 "为自由民主而战"
 POL_fight_for_liberal_democracy_desc:0"农民拿起武器不是为了建立自己的独裁，而是为了保卫一种他们已经在村社大会、合作社选举和罢工的集会中实践过的自由——集会、发言、投票、罢免不合格的代表。农民们必须保卫乡村免受外部占领和内部镇压的双重威胁，确保自由选举在军队和警察的刺刀之外举行，以及在任何安排中保证农民作为政治主体的地位不被再次剥夺。卡明斯基不把民主视为罢工结束后的奖品，如果农民不能继续开会、选举和罢免自己的代表，那么罢工后的民主也不过是另一种形式的行政命令。"
 POL_revenge_landlords:0 "对地主的报复"
 POL_revenge_landlords_desc:0"绿色波兰的土地纲领不是赎买，也不是改革，而是清算。那些在罢工期间调用警察、解雇罢工工人、或与萨纳奇亚地方官员有直接联系的庄园被登记为县合作社的财产，按当地农户的劳动力分配，原庄园主保留住宅和一小块自用地，但不获得补偿。卡明斯基只是把议会二十年前通过却从未落实的文字变成了县委员会的实际行动。不过，对地主报复的范围被严格限定在那些在罢工中主动配合镇压的人，而非所有地主，以避免把整个地主阶级推向敌对一边。"
 POL_poland_for_the_poles:0 "波兰的土地，波兰人耕种"
 POL_poland_for_the_poles_desc:0"库拉什下令没收了所有非波兰人持有的土地——德国移民的农场、犹太人的店铺和田产、斯洛伐克人在斯皮什和奥拉瓦的牧场——分给当地无地的农户。波兰的土地从来只属于在这里放牧和耕种的人，不属于地主、银行或任何外来的政权。只要耕作者不是本地波兰农民，土地就重新分配。"
 POL_fiscal_system_reform:0 "财政体系改革"
 POL_fiscal_system_reform_desc:0"兹季托维茨基在《国家工团主义与总体税制》中注意税制结构所体现的原则。税收不仅是国库收入的手段，也是社会政策的工具。这启发了新体制的财政改革，直接税的比重提高，土地税和工业税按累进原则重新核定，投机性的资本收益被课以额外附加税。与此同时，消费税和专卖收入继续保留，但征收方式从包税制改为国家专营，以减少中间环节的流失。财政部的稽核权从华沙下放到省一级，但各省的税收计划须经中央财政委员会统一核准。改革让那些从民族经济中获利最多的人承担更多的行政和国防成本，同时为合作社和中小企业保留税收优惠。"
 POL_total_catholicism_against_pluralism:0 "反多元化总体天主教"
 POL_total_catholicism_against_pluralism_desc:0"“反多元”不是指禁止其他宗教的存在，而是指拒绝把天主教降格为诸多社会力量中的一种。在民族共同体的自我理解中，天主教不是可以选择加入或退出的信仰团体，而是民族身份本身的构成性要素。学校课程中的宗教教育不是选修课，而是与波兰语和历史并列的核心科目；公共节庆的日程以教会年历为骨架；婚姻和家庭法在世俗登记之外保留教会法庭的咨询地位。与此同时，教会自身也被纳入民族共同体的组织框架。兹季托维茨基所理解的“总体”不是让教会统治国家，也不是让国家吞并教会，而是让两者在同一个民族共同体的框架内各司其职，同时排除任何试图使社会价值多元化的中间力量。"
 POL_autonomy_democracy_science_leadership:0 "自治，民主，科学领导"
 POL_autonomy_democracy_science_leadership_desc:0"斯基夫斯基设计的自治单位是功能性的。例如一个工厂的工人委员会、一个县的土地合作社、一条铁路的调度班组，这些单位自行选举理事，理事在任期结束时须公开述职。民主在这里是理事面对具体后果时的问责。同时，科学领导原则为自治划定边界，行业联合体的技术委员会由工程师、农艺师和统计学家组成，职责不是代替工人做决定，而是公布可核查的数据。决定权留在自治单位手中，但每一个决定都须面对技术委员会公布的数据。"
 POL_slay_the_capitalist_hydra:0 "杀死资本主义九头蛇"
 POL_slay_the_capitalist_hydra_desc:0"波兰的资本主义不是自由市场，而是一个由外国银行、地主抵押贷款和城市投机资本编成的吸血鬼。这张网从华沙交易所伸向乡村谷仓，从格丁尼亚码头伸向西里西亚矿井，每一个节点都在向外抽取利润，把枯竭的村庄和倒闭的车间留给民族共同体承担。杀死九头蛇意味着切断这些抽取管道，外国资本控制的林场、矿山和港口设施收归行业联合体管理，抵押银行的地方分行并入合作社信贷系统，城市地产投机被累进税和空置罚金压平。我们不会禁止私人交易，只是要把交易从抽取性的中介手中转移回生产者和使用者之间。九头蛇的头可以再长，但只要人民同时收紧，新长出来的头就找不到可以缠绕的躯干。"
 POL_the_gun_commands_the_party:0 "枪指挥党"
 POL_the_gun_commands_the_party_desc:0"罗拉·日米耶尔斯基在政变后成立的军事委员会从一开始就凌驾于所有政治机构之上。新党会议可以讨论土地分配、工厂委员会和合作社章程，但涉及人员任命、武器调配和通讯网络的决定，一律须经军事委员会的相关处室确认。党的工作是说服，军队的工作是决定；说服可以慢慢来，决定不能等。枪杆子里面出政权，自然枪也可以指挥党。"
 POL_military_patronage:0 "军政庇护主义"
 POL_military_patronage_desc:0"罗拉·日米耶尔斯基没有把政变后的权力真空交给正式的官僚程序去填补，他把自己放在了庇护链条的顶端，成为整个军政体系最终的恩庇者。职位、资源、豁免和晋升，不再通过法令和考试分配，而是通过一套非正式的交换网络向下流动：罗拉向军区司令提供指挥权和行动自由，军区司令向团长提供晋升机会和物资优先权，团长向基层军官提供保护与照顾，基层军官则以个人效忠和对命令的绝对服从作为回报。这套关系不写在任何组织章程里，它的互惠性、私人性和非对称性恰恰是它运转的前提。正式机构——法庭、部委、地方议会——仍然存在，但它们的决定如果与庇护网络中的默契相冲突，通常不会被执行。国家的资源被用来维持这张网络，而不是用来实现公开宣称的政策目标。罗拉不需要在每个县都安插自己的亲信；他只需要确保每一个手握权力的人都知道，自己的权力来自谁的保护，以及失去这种保护意味着什么。"
 POL_regime_of_police_and_agents:0 "警察与特工的政权"
 POL_regime_of_police_and_agents_desc:0"日米耶尔斯基把政变前分散在总参谋部第二司、内政部政治档案科和边防总署的各个情报与执法机构合并成一个统一的体系。这个体系不设单一的领导部门，而是按职能分为三条线：情报线负责绘制人际关系网络，执法线负责执行逮捕与审讯，档案线负责保存所有被监控对象的姓名、职业、住址和社交圈。三条线之间不直接联络，所有信息汇总到罗拉本人的办公室，由他决定哪条线在什么时候、对什么人采取行动。警察与特工之间的界限被刻意模糊，每个分局的联络员同时持有警察证件和军事情报部门的通行证，他们不穿制服，不从属于任何一个部委，只对革命军事委员会主席负责。这套体系的效率不在于逮捕的人数，而在于被监控者知道自己被监控，却不知道监控者属于哪个机构、依据哪条法律、向谁汇报。"
 POL_bolshevik_peasant_revolution:0 "共产主义工农革命"
 POL_bolshevik_peasant_revolution_desc:0"波兰共产党从成立起就把农民看作落后力量，主张把大农场收归国有，这让他们在乡村几乎没有任何根基。罗亚的共产主义是从村社大会上长出来的，土地归耕种它的人，工厂归操作机器的人，地方的粮仓和磨坊由使用它们的人共同管理。他不接受任何来自国外的委员会来指导波兰的革命，也不认为革命必须从城市开始再蔓延到乡村。在他看来，波兰的革命已经开始了，它发生在谷仓和打谷场上，发生在那些不再把粮食运进城的村子里。农民不需要被谁“领导”进入革命，他们已经在那里了，只需要有人告诉他们，他们一直做的事情可以被叫做这个名字。"
 POL_all_peasants_are_patriots:0 "全体农民皆爱国"
 POL_all_peasants_are_patriots_desc:0"库拉什把“爱国”定义为与土地的直接关系，耕种它、保卫它、不离开它的人才是真正的波兰人。城市居民、官员、知识分子和政党活动家在他眼里都是“靠别人种地吃饭的人”，不配谈论波兰。参加村社大会、送子女上教区学校、在武装训练中出勤的农户获得“爱国农户”资格，享有武器保护、粮食优先分配和优待。不参加的人被标记为外人，在物资分配和武装保护上被排除。波兰国家属于种地的人，不属于其他人。"
 POL_polish_national_community:0 "波兰民族共同体"
 POL_polish_national_community_desc:0"民族共同体的边界由语言、信仰和共同的经济命运划定，而不是由历史疆界或国际条约划定。新体制的公民法以波兰语能力和对民族共同体的忠诚宣誓为条件，不要求血统证明，但要求接受一种单一的公共文化。经济政策服务于共同体的整合：合作社和国有信贷向波兰人主导的生产单位倾斜，少数民族聚居区的工业化被限制在与国防无关的轻工业领域，以避免形成可能脱离共同体控制的经济中心。这能确保民族共同体在外部压力和内部分散的双重风险下，仍然能够作为统一的经济和政治单位运转。共同体的每一个成员都被期望在民族经济中找到自己的位置，而共同体的边界则由那些位置的总和来界定。"
 POL_nationalism_the_inevitable_result_of_progress:0 "民族主义—社会进步的必然结果"
 POL_nationalism_the_inevitable_result_of_progress_desc:0"斯基夫斯基从单纯民族主义立场走向流亡中的社会批判，中间的桥梁是他对“民族道德和物质力量”的理解。民族主义在19世纪是文化觉醒的语言，在20世纪必须成为社会组织的语言。一个民族如果允许自己的工人被外国资本剥削、农民被抵押贷款驱逐、城市被投机者掏空，那么它在国际舞台上的任何主权宣称都只是空话。社会进步不是民族主义的附加项，而是它的实现条件。只有当车间技工、田里佃农和铁路扳道工在自治单位中获得对自身劳动条件的发言权，民族才从被动的文化共同体变成主动的历史主体。民族主义提供共同体的边界和方向，社会进步提供共同体的内部凝聚力。两者不是需要平衡的两极，而是同一个进程的两个名字。"
 POL_the_military_salvation_council_above_all:0 "军事救国委员会高于一切"
 POL_the_military_salvation_council_above_all_desc:0"革命军事委员会成为了共和国最高权力机构，其决议优先于议会通过的任何法律、总统发布的任何命令、以及普通法院做出的任何判决。当然，委员会不是政府的替代品，但当政府的决定偏离国家利益时，委员会有权把它扳回来。毕竟，本委员会对国家的存续负责，军事救国委员会高于一切。"
 POL_revenge_against_the_cities:0 "向城市复仇"
 POL_revenge_against_the_cities_desc:0"华沙的交易所、罗兹的纺织厂、克拉科夫的部委大楼和格丁尼亚的码头，在农民的记忆里都不是中立的地方。粮价由城里的经纪人定，地契由城里的法官裁决，子女的兵役登记由城里的军官填，连村里磨坊能不能开都要等城里的许可证。几十年来，城市对乡村的索取通过银行、税制和征兵名册层层传导，乡村的回馈只是一车一车运进城里的粮食，换回一张张盖了章的纸。当乡村重新掌握武装和组织手段时，账被翻了出来。一些庄园的管家在夜里被人从床上拖走，尸体丢在通往县城的路上；城里的粮食仓库和面粉厂被打开，存粮分给周边的村子，厂房里的机器被砸毁或拆走；运往城市的粮车在铁路道口被拦下，押运员被赶走，车皮被推下铁轨......如今城市第一次需要向乡村证明，自己值得被供应。"
 POL_the_wall_must_fall:0 "高墙必须倒塌！"
 POL_the_wall_must_fall_desc:0"团结工会掌握了大权！每一份未被没收的刊物，每一次对被捕人民的声援，都是砸向那堵高墙的一记重锤。墙不会自己倒下，但高墙必须倒塌。从今往后，波兰人不再只是等待被拯救的受害者，而是公开地、非暴力地、在内外压迫者控制的机构之外，亲手为自己筑起一道捍卫法治与公民权利的墙。"
 POL_decide_leadership:0 "决定领导层"
 POL_decide_leadership_desc:0"华沙的工会委员会正在激烈辩论，一派要守住独立工会的旗帜，拒绝与旧政党捆绑；另一派主张接触波兰统一工人党的右翼——那群国家工党的左翼基督教分子。反对者痛骂他们是隐藏的工团—布尔什维克；而支持者反唇相讥：你们与民族民主党合作，才是背叛社会主义。那么，波兰的命运将会是？"
 POL_settle_scores_with_monarchy:0 "清算君主制"
 POL_settle_scores_with_monarchy_desc:0"团结工会的代表走进王宫，向全世界宣告：波兰人打过仗、罢过工、坐过牢，不是为了把决定自己命运的权利再交还给一个戴王冠的人。社会主义波兰共和国不需要国王，只需要公民和工人！"
 POL_keep_union_leadership:0 "维持工会领导"
 POL_keep_union_leadership_desc:0"左翼赢了表决，工会的旗帜将继续留在工人手里，而不是与民族民主党的右派做交易。团结工会保持独立。工人自己领导工人，而不是什么政党或者领袖领导工人。"
 POL_economists_politics:0 "经济学家的统治"
 POL_economists_politics_desc:0"爱德华·利平斯基，这位前马克思主义者，团结工会最年长的创始人，如今领导团结工会。强硬派骂他是披着红袍的官僚，但他回敬：“社会主义不能被命令，只能诞生于自由人民的自由行动。”高墙倒塌之后，人民不需要另一堵墙，他们需要算得清账的繁荣波兰。"
 POL_socialist_party_remnants:0 "社会党的残余"
 POL_socialist_party_remnants_desc:0"亚当·什奇皮奥尔斯基，这位老社会党人、德国人压迫的幸存者，如今在工会会议桌旁坐下，身边是年轻的工人。这颗前革命派的活化石，会把波兰引向何方呢？"
 POL_free_technocrat_market_socialism:0 "自由技官市场社会主义"
 POL_free_technocrat_market_socialism_desc:0"新波兰的工厂归工人委员会，但价格要交给市场决定。技官不是新官僚，是替自由人民服务的仆人。过度的组织会扼杀增长，僵化的路线只会让物资匮乏。波兰要当一个专业性强、也容得下自发性的社会主义国家。"
 POL_workers_defense_committee:0 "工人防御委员会"
 POL_workers_defense_committee_desc:0"团结工会从华沙一间公寓起步，如今在每个工业区都有了分支。在团结工会的指引下，工人们逐渐开始自己组织起来，建立他们自己的委员会，为他们自己的权力奋斗。"
 POL_mobilize_legions_and_workers:0 "集结军团与工人"
 POL_mobilize_legions_and_workers_desc:0"波兰军团的前身“步枪兵协会”等组织得到了PPS的秘密支持，而PPS的战斗组织（bojówka）是工人阶级的第一个战斗组织。当年资助军团步枪的，和替罢工工人募捐的，是同一批人。社会党人把军团称作“独立之军”，而前革命派的总书记如今站在团结工会的讲台上。军团老兵和纺织工人有什么共同语言？什奇皮奥尔斯基的回答是，军团的纪律与罢工的纪律，本就是同一场斗争的两只手。"
 POL_masonic_technocracy:0 "共济会式专家统治"
 POL_masonic_technocracy_desc:0"随着利平斯基权力的稳固，他的圈子逐渐形成。这个新共济会里没有公开辩论，只有懂行的人低声交换统计表。自由市场需要守夜人，而守夜人得看得懂账本。"
 POL_extend_social_welfare:0 "延展社会福利"
 POL_extend_social_welfare_desc:0"旧波兰的社会福利太少了，社会福利不该是既得利益者从上面扔下来的面包屑，而该是工人自己算出来、自己管起来的账本。从病假条到退休金，每一栏数字背后都该坐着一个享受福利的工人。"
 POL_syndicalism_deradicalization:0 "工团主义去激进化"
 POL_syndicalism_deradicalization_desc:0"老社会党人清楚，街垒能赢来谈判桌，但谈判桌才守得住街垒的成果。健康保险基金、工人自治法案、议会预算修正案，这些看上去枯燥的条文才是把工人权益钉进国家肌体的钉子。革命派的枪和议会里的票，都是同一场斗争的工具。"
 POL_towards_utopia:0 "迈向乌托邦"
 POL_towards_utopia_desc:0"利平斯基在工会代表大会上宣读着统计册。在如今的波兰，市场为工人运转，计划为自由让路。乌托邦就在当下，社会主义终于不再是命令，而是自由人民的自由行动。"
 POL_liberty_equality_independence:0 "自由, 平等, 独立"
 POL_liberty_equality_independence_desc:0"独立与社会主义，终于不必二选一。议会里有工人的席位，工厂里有工会的管理，军团老兵和纺织工人站在同一面旗帜下，这面旗既不是柏林的，也不是各个政党的。自由、平等、独立，三个词排在一起，波兰不再互相斗争。"
 POL_contact_with_polish_united_workers_right:0 "接触波兰统一工人党右翼"
 POL_contact_with_polish_united_workers_right_desc:0"右翼赢了表决。工会代表走进前国家工党的会议室，对面坐着那群左翼基督教分子——他们建立的波兰统一工人党，如今想借工人的手洗掉自己的官僚味。与民族民主党做交易有何不可？如果社会主义不能让波兰繁荣强大，那就丢掉它。"
 POL_agrarianism_first:0 "农业主义至上"
 POL_agrarianism_first_desc:0"扬·齐亚神父，一位贫农之子、华沙起义的随军牧师，如今在团结工会的讲台上为农民说话。波兰不该只是工厂工人的波兰。土地改革、农业合作社、乡村诊所和扫盲班是波兰最需要的。他引用通谕，也引用战争时农民捐粮的旧账。城里来的工会干部嫌他保守，但工人吃的面包，是从那些没进过工会的人手里来的，农业才是这个国家的脊梁。"
 POL_national_unity_congress:0 "民族团结大会"
 POL_national_unity_congress_desc:0"沃伊切赫·齐恩宾斯基，这位团结工会创始人、如今把不同派别拉到同一张桌前。天主教知识分子、前家乡军老兵、独立工会分子、甚至那些对党失望的年轻技官。团结工会必须被改造为民族团结大会，在波兰的十字架下，分歧不再变成刀剑。"
 POL_united_agrarian_movement:0 "联合农业运动"
 POL_united_agrarian_movement_desc:0"齐亚神父画了一张波兰地图，红点是工厂，绿点是村庄。他开展的联合农业运动不是请农民进城开会，而是把团结工会的组织搬到乡下去。土地和车间之间那条被划出来的界线，得用农会代表和工会代表的联合签名抹掉。"
 POL_respect_catholicism:0 "尊崇天主教"
 POL_respect_catholicism_desc:0"教堂的钟声重新成为波兰城乡的时间刻度，主日弥撒后的庭院成了工会小组的碰头地点，神父的教理问答里夹着工人权利的小册子。共产党说宗教是人民的鸦片，他们为什么害怕一群跪着的人站起来唱《上帝，你保护了波兰》？信仰不是政治纲领，是政治之前的东西。"
 POL_rule_of_catholic_intellectuals_club:0 "天主教知识分子俱乐部的统治"
 POL_rule_of_catholic_intellectuals_club_desc:0"天主教知识分子俱乐部——这个齐恩宾斯基的私人讨论圈子，如今成了团结工会右翼的大脑。医生、律师、教授、神父，每周四晚上聚在一起，不谈工资谈宪法，不谈物价谈人权。教会的讲坛和工会的车间之间，当然需要一群既能引经据典又能起草法案的人来统治。"
 POL_moderate_corporatism:0 "温和的法团主义"
 POL_moderate_corporatism_desc:0"波兰不能被自由放任撕成一地碎片，也不能被当权者的命令压制。职业团体——农会、工会、医生协会、教师联合会——应该坐进同一个议事厅，按各自贡献的比例分票。教会早就说过，资本不能独吞，国家也不能独吞。"
 POL_solidarity_and_mutual_aid:0 "团结与互助"
 POL_solidarity_and_mutual_aid_desc:0"每个车间设一个互助箱，每个教区设一个援助点，但每一分钱都来自人民自己的工资袋，不经国家的手，也不经官僚的章。齐亚神父说过，互助，是承认我和你是同一个身体上的肢体。"
 POL_defend_human_rights:0 "捍卫人权"
 POL_defend_human_rights_desc:0"人权不是从会议桌上掉下来的，而是从人按天主肖像被造的那一刻就刻在骨子里的，每个人身上都有不可剥夺的尊严，新波兰必须成为天主和人权的模范国家。"
 POL_struggle_for_social_moral_renewal:0 "为社会道德复兴而斗争"
 POL_struggle_for_social_moral_renewal_desc:0"一个国家的墙可以靠谈判拆掉，但人心里的墙要靠布道和行动拆。团结工会不能只发传单讲工资和物价，还得讲酗酒的父亲、被腐蚀的地方官。道德复兴不是回到教权国家，是让每个波兰人挺直腰杆，为了美好的波兰社会而斗争。"
 POL_conservative_rebirth:0 "保守主义复兴"
 POL_conservative_rebirth_desc:0"齐恩宾斯基在独立日游行队伍的最前排举着旧军团和教会旗。这位前家乡军士兵、反共政治犯，如今告诉团结工会的年轻一代，保守不是守旧，是守住那些共产党想抹掉的东西。经济可以市场，福利可以工会，但波兰之所以是波兰，靠的是这些被赤匪踩过却没碎的东西。有人骂他倒退，但波兰倒退的方向，正是那些被谋杀者没能走完的路。"
 POL_settle_scores_with_fake_revolutionaries:0 "清算冒牌革命者"
 POL_settle_scores_with_fake_revolutionaries_desc:0"谁是革命者，谁是骗子？有人用红旗掩盖剥削，有人喊国际主义却替别国算账，有人自称工人代表却从没进过车间。我们必须警惕那些把“革命”挂在嘴上、把权力揣进兜里的人。"
 POL_end_of_socialist_tyranny:0 "社会主义暴政的终结"
 POL_end_of_socialist_tyranny_desc:0"波兰不跟第三国际谈什么“社会主义兄弟情谊”，他们的统治是暴政披着红旗，但暴政终有尽头。华沙要当那座把东方被压迫者的声音传到文明世界的桥。"
 POL_copy_british_french_model:0 "照搬英法模式"
 POL_copy_british_french_model_desc:0"第三国际的旗子由巴黎和伦敦打着，那边的同志们经验丰富，值得我们学习。波兰要走的路，在塞纳河和泰晤士河之间。"
 POL_one_party_democracy:0 "一党专政之民主"
 POL_one_party_democracy_desc:0"团结工会宣称自己是波兰唯一正统的民主代表，议会照常选举，报纸照常出版，但候选人名单由工会委员会审定，反对派必须证明自己不属于人民之敌。左翼说这是无产阶级民主的最高形式，右翼说这是民族共同体意志的体现。两派都同意一件事，民主的程序服务于团结工会的领导，权力的边界止于那些不肯承认工会正统性的人。"
 POL_return_to_community:0 "回归社区共同体"
 POL_return_to_community_desc:0"基督教民主的波兰、辅助性原则的波兰、基层民主自治的波兰。自上而下的统治结束了，波兰的历史，该由波兰的十字架和人民社区重新书写。"
 POL_establish_worker_self_governance:0 "建立工人自治"
 POL_establish_worker_self_governance_desc:0"工厂门口的铜牌刻着“工人自治委员会”，车间墙上贴着生产计划表决日程。工人定期开会，举手通过厂长人选，讨论奖金分配。但候选人名单由团结工会的工厂支部拟定，价格和投资额度由中央工会委员会下达，自治委员会的决议若与国家整体利益冲突，上一级工会可以撤销。工人确实在投票，只是投票之前，选项已经替他们选好了。"
 POL_only_free_trade_unions:0 "唯有自由工会"
 POL_only_free_trade_unions_desc:0"团结工会颁布了《工会法》，任何工人都有权组织工会，任何工会都有权代表工人——前提是，它承认团结工会是波兰工人的唯一最高代表。独立的行业工会可以注册，但它们的章程里必须写入一条：在国家利益问题上，服从团结工会全国委员会的仲裁。"
 POL_an_old_question:0 "有个老问题……"
 POL_an_old_question_desc:0"旧波兰王国是柏林和维也纳扶植起来的，连国王都不是波兰人。如今波兰虽然独立自主了，但她的边界并不是自己画的。帝国公约的军队驻扎在“友好邻邦”的领土上，德国千方百计试图重新奴役和殖民波兰。问题还是那个问题，只是这一次，波兰人决定不再等下一个被压迫的一百年。"
