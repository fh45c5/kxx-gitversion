 POL_the_wall_must_fall:0 "高墙必须倒塌！"
 POL_the_wall_must_fall_desc:0"团结工会掌握了大权！每一份未被没收的刊物，每一次对被捕人民的声援，都是砸向那堵高墙的一记重锤。墙不会自己倒下，但高墙必须倒塌。从今往后，波兰人不再只是等待被拯救的受害者，而是公开地、非暴力地、在内外压迫者控制的机构之外，亲手为自己筑起一道捍卫法治与公民权利的墙。"
 POL_decide_leadership:0 "决定领导层"
 POL_decide_leadership_desc:0"华沙的工会委员会正在激烈辩论，一派要守住独立工会的旗帜，拒绝与旧政党捆绑；另一派主张接触波兰统一工人党的右翼——那群国家工党的左翼基督教分子。反对者痛骂他们是隐藏的工团—布尔什维克；而支持者反唇相讥：你们与民族民主党合作，才是背叛社会主义。那么，波兰的命运将会是？"
 POL_settle_scores_with_monarchy:0 "清算君主制"
 POL_settle_scores_with_monarchy_desc:0"团结工会的代表走进王宫，向全世界宣告：波兰人打过仗、罢过工、坐过牢，不是为了把决定自己命运的权利再交还给一个戴王冠的人。社会主义波兰共和国不需要国王，只需要公民和工人！"
 POL_keep_union_leadership:0 "维持工会领导"
 POL_keep_union_leadership_desc:0"左翼赢了表决，工会的旗帜将继续留在工人手里，而不是与民族民主党的右派做交易。团结工会保持独立。工人自己领导工人，而不是什么政党或者领袖领导工人。"
 POL_economists_politics:0 "经济学家的统治"
 POL_economists_politics_desc:0"爱德华·利平斯基，这位前马克思主义者，团结工会最年长的创始人，如今领导团结工会。强硬派骂他是披着红袍的官僚，但他回敬：“社会主义不能被命令，只能诞生于自由人民的自由行动。”高墙倒塌之后，人民不需要另一堵墙，他们需要算得清账的繁荣波兰。"
 POL_socialist_party_remnants:0 "社会党的残余"
 POL_socialist_party_remnants_desc:0"亚当·什奇皮奥尔斯基，这位老社会党人、德国人压迫的幸存者，如今在工会会议桌旁坐下，身边是年轻的工人。这颗前革命派的活化石，会把波兰引向何方呢？"
 POL_free_technocrat_market_socialism:0 "自由技官市场社会主义"
 POL_free_technocrat_market_socialism_desc:0"新波兰的工厂归工人委员会，但价格要交给市场决定。技官不是新官僚，是替自由人民服务的仆人。过度的组织会扼杀增长，僵化的路线只会让物资匮乏。波兰要当一个专业性强、也容得下自发性的社会主义国家。"
 POL_workers_defense_committee:0 "工人防御委员会"
 POL_workers_defense_committee_desc:0"团结工会从华沙一间公寓起步，如今在每个工业区都有了分支。在团结工会的指引下，工人们逐渐开始自己组织起来，建立他们自己的委员会，为他们自己的权力奋斗。"
 POL_mobilize_legions_and_workers:0 "集结军团与工人"
 POL_mobilize_legions_and_workers_desc:0"波兰军团的前身“步枪兵协会”等组织得到了PPS的秘密支持，而PPS的战斗组织（bojówka）是工人阶级的第一个战斗组织。当年资助军团步枪的，和替罢工工人募捐的，是同一批人。社会党人把军团称作“独立之军”，而前革命派的总书记如今站在团结工会的讲台上。军团老兵和纺织工人有什么共同语言？什奇皮奥尔斯基的回答是，军团的纪律与罢工的纪律，本就是同一场斗争的两只手。"
 POL_masonic_technocracy:0 "共济会式专家统治"
 POL_masonic_technocracy_desc:0"随着利平斯基权力的稳固，他的圈子逐渐形成。这个新共济会里没有公开辩论，只有懂行的人低声交换统计表。自由市场需要守夜人，而守夜人得看得懂账本。"
 POL_extend_social_welfare:0 "延展社会福利"
 POL_extend_social_welfare_desc:0"旧波兰的社会福利太少了，社会福利不该是既得利益者从上面扔下来的面包屑，而该是工人自己算出来、自己管起来的账本。从病假条到退休金，每一栏数字背后都该坐着一个享受福利的工人。"
 POL_syndicalism_deradicalization:0 "工团主义去激进化"
 POL_syndicalism_deradicalization_desc:0"老社会党人清楚，街垒能赢来谈判桌，但谈判桌才守得住街垒的成果。健康保险基金、工人自治法案、议会预算修正案，这些看上去枯燥的条文才是把工人权益钉进国家肌体的钉子。革命派的枪和议会里的票，都是同一场斗争的工具。"
 POL_towards_utopia:0 "迈向乌托邦"
 POL_towards_utopia_desc:0"利平斯基在工会代表大会上宣读着统计册。在如今的波兰，市场为工人运转，计划为自由让路。乌托邦就在当下，社会主义终于不再是命令，而是自由人民的自由行动。"
 POL_liberty_equality_independence:0 "自由, 平等, 独立"
 POL_liberty_equality_independence_desc:0"独立与社会主义，终于不必二选一。议会里有工人的席位，工厂里有工会的管理，军团老兵和纺织工人站在同一面旗帜下，这面旗既不是柏林的，也不是各个政党的。自由、平等、独立，三个词排在一起，波兰不再互相斗争。"
 POL_contact_with_polish_united_workers_right:0 "接触波兰统一工人党右翼"
 POL_contact_with_polish_united_workers_right_desc:0"右翼赢了表决。工会代表走进前国家工党的会议室，对面坐着那群左翼基督教分子——他们建立的波兰统一工人党，如今想借工人的手洗掉自己的官僚味。与民族民主党做交易有何不可？如果社会主义不能让波兰繁荣强大，那就丢掉它。"
 POL_agrarianism_first:0 "农业主义至上"
 POL_agrarianism_first_desc:0"扬·齐亚神父，一位贫农之子、华沙起义的随军牧师，如今在团结工会的讲台上为农民说话。波兰不该只是工厂工人的波兰。土地改革、农业合作社、乡村诊所和扫盲班是波兰最需要的。他引用通谕，也引用战争时农民捐粮的旧账。城里来的工会干部嫌他保守，但工人吃的面包，是从那些没进过工会的人手里来的，农业才是这个国家的脊梁。"
 POL_national_unity_congress:0 "民族团结大会"
 POL_national_unity_congress_desc:0"沃伊切赫·齐恩宾斯基，这位团结工会创始人、如今把不同派别拉到同一张桌前。天主教知识分子、前家乡军老兵、独立工会分子、甚至那些对党失望的年轻技官。团结工会必须被改造为民族团结大会，在波兰的十字架下，分歧不再变成刀剑。"
 POL_united_agrarian_movement:0 "联合农业运动"
 POL_united_agrarian_movement_desc:0"齐亚神父画了一张波兰地图，红点是工厂，绿点是村庄。他开展的联合农业运动不是请农民进城开会，而是把团结工会的组织搬到乡下去。土地和车间之间那条被划出来的界线，得用农会代表和工会代表的联合签名抹掉。"
 POL_respect_catholicism:0 "尊崇天主教"
 POL_respect_catholicism_desc:0"教堂的钟声重新成为波兰城乡的时间刻度，主日弥撒后的庭院成了工会小组的碰头地点，神父的教理问答里夹着工人权利的小册子。共产党说宗教是人民的鸦片，他们为什么害怕一群跪着的人站起来唱《上帝，你保护了波兰》？信仰不是政治纲领，是政治之前的东西。"
 POL_rule_of_catholic_intellectuals_club:0 "天主教知识分子俱乐部的统治"
 POL_rule_of_catholic_intellectuals_club_desc:0"天主教知识分子俱乐部——这个齐恩宾斯基的私人讨论圈子，如今成了团结工会右翼的大脑。医生、律师、教授、神父，每周四晚上聚在一起，不谈工资谈宪法，不谈物价谈人权。教会的讲坛和工会的车间之间，当然需要一群既能引经据典又能起草法案的人来统治。"
 POL_moderate_corporatism:0 "温和的法团主义"
 POL_moderate_corporatism_desc:0"波兰不能被自由放任撕成一地碎片，也不能被当权者的命令压制。职业团体——农会、工会、医生协会、教师联合会——应该坐进同一个议事厅，按各自贡献的比例分票。教会早就说过，资本不能独吞，国家也不能独吞。"
 POL_solidarity_and_mutual_aid:0 "团结与互助"
 POL_solidarity_and_mutual_aid_desc:0"每个车间设一个互助箱，每个教区设一个援助点，但每一分钱都来自人民自己的工资袋，不经国家的手，也不经官僚的章。齐亚神父说过，互助，是承认我和你是同一个身体上的肢体。"
 POL_defend_human_rights:0 "捍卫人权"
 POL_defend_human_rights_desc:0"人权不是从会议桌上掉下来的，而是从人按天主肖像被造的那一刻就刻在骨子里的，每个人身上都有不可剥夺的尊严，新波兰必须成为天主和人权的模范国家。"
 POL_struggle_for_social_moral_renewal:0 "为社会道德复兴而斗争"
 POL_struggle_for_social_moral_renewal_desc:0"一个国家的墙可以靠谈判拆掉，但人心里的墙要靠布道和行动拆。团结工会不能只发传单讲工资和物价，还得讲酗酒的父亲、被腐蚀的地方官。道德复兴不是回到教权国家，是让每个波兰人挺直腰杆，为了美好的波兰社会而斗争。"
 POL_conservative_rebirth:0 "保守主义复兴"
 POL_conservative_rebirth_desc:0"齐恩宾斯基在独立日游行队伍的最前排举着旧军团和教会旗。这位前家乡军士兵、反共政治犯，如今告诉团结工会的年轻一代，保守不是守旧，是守住那些共产党想抹掉的东西。经济可以市场，福利可以工会，但波兰之所以是波兰，靠的是这些被赤匪踩过却没碎的东西。有人骂他倒退，但波兰倒退的方向，正是那些被谋杀者没能走完的路。"
 POL_settle_scores_with_fake_revolutionaries:0 "清算冒牌革命者"
 POL_settle_scores_with_fake_revolutionaries_desc:0"谁是革命者，谁是骗子？有人用红旗掩盖剥削，有人喊国际主义却替别国算账，有人自称工人代表却从没进过车间。我们必须警惕那些把“革命”挂在嘴上、把权力揣进兜里的人。"
 POL_end_of_socialist_tyranny:0 "社会主义暴政的终结"
 POL_end_of_socialist_tyranny_desc:0"波兰不跟第三国际谈什么“社会主义兄弟情谊”，他们的统治是暴政披着红旗，但暴政终有尽头。华沙要当那座把东方被压迫者的声音传到文明世界的桥。"
 POL_copy_british_french_model:0 "照搬英法模式"
 POL_copy_british_french_model_desc:0"第三国际的旗子由巴黎和伦敦打着，那边的同志们经验丰富，值得我们学习。波兰要走的路，在塞纳河和泰晤士河之间。"
 POL_one_party_democracy:0 "一党专政之民主"
 POL_one_party_democracy_desc:0"团结工会宣称自己是波兰唯一正统的民主代表，议会照常选举，报纸照常出版，但候选人名单由工会委员会审定，反对派必须证明自己不属于人民之敌。左翼说这是无产阶级民主的最高形式，右翼说这是民族共同体意志的体现。两派都同意一件事，民主的程序服务于团结工会的领导，权力的边界止于那些不肯承认工会正统性的人。"
 POL_return_to_community:0 "回归社区共同体"
 POL_return_to_community_desc:0"基督教民主的波兰、辅助性原则的波兰、基层民主自治的波兰。自上而下的统治结束了，波兰的历史，该由波兰的十字架和人民社区重新书写。"
 POL_establish_worker_self_governance:0 "建立工人自治"
 POL_establish_worker_self_governance_desc:0"工厂门口的铜牌刻着“工人自治委员会”，车间墙上贴着生产计划表决日程。工人定期开会，举手通过厂长人选，讨论奖金分配。但候选人名单由团结工会的工厂支部拟定，价格和投资额度由中央工会委员会下达，自治委员会的决议若与国家整体利益冲突，上一级工会可以撤销。工人确实在投票，只是投票之前，选项已经替他们选好了。"
 POL_only_free_trade_unions:0 "唯有自由工会"
 POL_only_free_trade_unions_desc:0"团结工会颁布了《工会法》，任何工人都有权组织工会，任何工会都有权代表工人——前提是，它承认团结工会是波兰工人的唯一最高代表。独立的行业工会可以注册，但它们的章程里必须写入一条：在国家利益问题上，服从团结工会全国委员会的仲裁。"
 POL_an_old_question:0 "有个老问题……"
 POL_an_old_question_desc:0"旧波兰王国是柏林和维也纳扶植起来的，连国王都不是波兰人。如今波兰虽然独立自主了，但她的边界并不是自己画的。帝国公约的军队驻扎在“友好邻邦”的领土上，德国千方百计试图重新奴役和殖民波兰。问题还是那个问题，只是这一次，波兰人决定不再等下一个被压迫的一百年。"
