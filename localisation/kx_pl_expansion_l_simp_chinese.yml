 POL_classless_society_of_producers:0 "无阶级生产者社会"
 POL_classless_society_of_producers_desc:0"工会联盟的最终纲领没有使用“无产阶级专政”这一表述，也没有使用“消灭阶级”的传统公式。它描述的是一个由生产功能而非阶级身份组织起来的社会：每个人在其中的位置取决于其所从事的劳动在国民经济中的功能，而非其对生产资料的占有关系。莫拉切夫斯基将这个构想追溯到索雷尔对“生产者”的界定。真正具有创造力的阶级是那些在劳动中得到拯救的人，而金融投机者和寄生的地主则被排除在这一范畴之外。"
 POL_class_struggle_is_the_truth:0 "阶级斗争是真理"
 POL_class_struggle_is_the_truth_desc:0"任何政治制度、经济安排或文化主张，其性质只能通过追问“它服务于哪个阶级”来判定。这一原则被应用于人民民主自身的机构，莫拉切夫斯基要求这些机构定期接受阶级成分的审计，以防止它们被“形式上无产化、实质上资产阶级化”的群体所占据。同时，判定阶级性质的标准应当由工人的直接行动来检验，而非由任何委员会来宣布。"
 POL_the_marshal_was_the_marshal_is_the_marshal_shall_be:0 "元帅活在过去！元帅活在现在！元帅将会永存！"
 POL_the_marshal_was_the_marshal_is_the_marshal_shall_be_desc:0"斯克瓦尔钦斯基以“行动”重新定义了毕苏斯基的时间性。元帅活在过去，因为传统是民族自我认识中恒久的根基，过去的功绩蕴藏着未来的力量。元帅活在当下，因为每一次先锋队成员在乡村或工厂中的实践，都是“行动爱国主义”对元帅指示“去，做”的重复。元帅将会永存，因为当国家社会化完成、自由人类型取代奴隶类型之时，对元帅的需要便不再依赖于任何具体的活人。这句口号不是对死者的召唤，而是对一项已完成事业的宣告。"
 POL_republic_shining_new:0 "共和国，崭新闪亮"
 POL_republic_shining_new_desc:0"共和国终于开始按照它自己宣称的原则运转了，党派政治被逐出行政序列之后，部长们第一次可以不因议会倒阁而中断工作；老同志们带着地方经验和旧网络回到办公室，填补了政党退出后留下的每一处空白；福利金从国家社会保险总署的窗口按月发放，领取者不再需要先向某个党的地方委员会证明自己的忠诚。波兰社会主义共和国，崭新闪亮。"
 POL_the_nation_sings_in_unison:0 "全国同声歌唱"
 POL_the_nation_sings_in_unison_desc:0"四月宪法终于被完整地执行，总统的权力也不再被议会的算术多数稀释；工团已经干净，工厂在军靴的节奏中运转；恩庇网络让每一个忠诚的人都有了位置，高压统治让街头安静；超工业化让烟囱在东部平原上竖起。如今的波兰，全国上下的声音只剩下一个，那就是斯维塔尔斯基的声音。"
