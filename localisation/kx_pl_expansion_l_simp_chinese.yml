 POL_long_live_the_chief:0 "首长万岁！"
 POL_long_live_the_chief_desc:0"“首长”不是元首，不是总书记，不是国王。它是一个暧昧得恰到好处的称呼，足够让军团老兵想起毕苏斯基，让左右两派都不觉得被冒犯，也让甜心将军本人在签字仪式上露出那个著名的笑容。喊“首长万岁”的人不一定爱他，但至少不恨他。在这个夹在大国之间的国家里，不恨，已经是一种稀缺资源。"
 POL_unleash_the_vanguardist_war_machine:0 "发动先锋主义战争引擎"
 POL_unleash_the_vanguardist_war_machine_desc:0"先锋主义在这里不是布尔什维克的先锋队，波兰不等柏林决定华沙的命运，不等莫斯科决定东方的边界，而是先让波兰的战争引擎转起来。工程师、军官、工会代表和民族主义煽动家被塞进同一间厂房，造出同一批火车和步枪。让战争机器开动吧！"
 POL_proletarian_social_nationalism:0 "无产阶级社会民族主义"
 POL_proletarian_social_nationalism_desc:0"“无产阶级没有祖国”——这句话雅沃罗夫斯基从来不信。波兰的无产阶级有祖国，而且这个祖国刚刚从几个帝国的夹缝里爬出来，浑身是伤。在维斯瓦河畔，阶级解放和民族生存是同一场仗。工人不是抽象的人类单位，他们是华沙的钳工、罗兹的纺织工、格丁尼亚的码头工。为他们争取的东西，必须用他们听得懂的语言命名：波兰，而且是他们的波兰。"
 POL_police_state_of_worker_militias:0 "工人民兵的警察国家"
 POL_police_state_of_worker_militias_desc:0"民兵不是军队的预备队，民兵是政权的皮肤。雅沃罗夫斯基在PPS战斗组织里学到的东西比在任何议会委员会里都多。一支知道自己在保护什么的武装队伍，比十条宪法条文更能维持秩序。工人民兵不需要穿制服——他们就是穿工装的警察，在每个车间、每个街区、每个码头上，警察国家不是对社会主义的背叛，是社会主义在敌意包围中的生存形态。干净的手建不成新波兰。"
 POL_establish_trade_union_confederation:0 "建立工会联盟"
 POL_establish_trade_union_confederation_desc:0"新的工会联盟保留了行业工会的框架和集体谈判的职能，但其领导层与共和国修复协会的物资和仲裁部门形成了人员与信息的双重流通。这一安排在联盟内部并非没有争议，一部分老工会活动家认为，联盟正在从一个斗争组织退化为行政机构的一个分支。莫拉切夫斯基没有否认这种描述，但他将问题引向了另一个方向——在德国的威胁下，工会联盟的首要任务不是积累罢工的筹码，而是确保工人在国家重建的决策桌上拥有一把固定的椅子。"
 POL_form_the_national_labor_battalions:0 "组建国家劳动营"
 POL_form_the_national_labor_battalions_desc:0"参照战前波兰军队在斯科莱与科杰尼采组织的军事化青年营地模式，国家工党将散置于各地的公共工程队与失业者救济营合并为统一的国家劳动营体系。营员按军队编制分为旅与中队，接受体能训练、基础军事教育和工团主义政治训导，工时与配给由劳动营中央管理局直接规定。第一批营地部署在中央工业区铁路枢纽与维斯瓦河堤防工程沿线，其产出不计入私人企业采购，仅用于国家基础设施项目。"
 POL_class_struggle_in_service_of_the_state:0 "阶级斗争为国家服务"
 POL_class_struggle_in_service_of_the_state_desc:0"工团主义理论家苏里格在《工人阵线》复刊号上系统阐述了国家工党对阶级斗争的立场，劳资争议不再交由法院或罢工解决，而是提交由国家工党、行业工会与雇主联合会三方组成的劳动仲裁院，仲裁院裁决以“民族生产计划”为最终依据。罢工权被承认为合法，但行使前须经行业委员会以无记名投票批准，且不得波及军工与铁路调度。雇主若拒绝仲裁裁决，其企业将被移交工人合作社托管；工人若未经批准停工，则失去工会会员资格与劳动营优先录用权。"
 POL_a_national_moral_revolution:0 "一场国民道德革命"
 POL_a_national_moral_revolution_desc:0"斯克瓦尔钦斯基在1922年就宣告了“波兰保守革命”的纲领，如今它获得了国家的强制执行权。革命的核心不是制度更迭，而是人格类型的选择，你是自由人还是奴隶?自由人以“对自己力量的信赖、健康的民族抱负、对自身政权的纪律”为标志，而奴隶只知对强者谄媚、对国家索取。“先锋队”被赋予塑造前者的使命，道德革命由此从出版物上的论题变成一项有组织的国家工程。"
 POL_redder_than_britain_and_france:0 "比英法更红"
 POL_redder_than_britain_and_france_desc:0"法兰西公社和不列颠联盟的工团主义建立在工会官僚与全国联合会之上，罢工是他们的起点，谈判是他们的日常。普里斯托尔对这种“办公室社会主义”没有耐心。波兰的红色从贝兹达尼的邮政车厢里长出来，从莫德林堡垒的牢房里长出来，从没有工会合法存在的环境中长出来。第三国际的会议桌上，波兰代表被莫斯科和巴黎的老资格轻视，但普里斯托尔不需要他们的承认。他的政权在一件事上比英法更红：它从来不把罢工当作筹码，它把行动当作政权本身。"
 POL_overcome_party_politics:0 "战胜党派政治"
 POL_overcome_party_politics_desc:0"毕苏斯基本人就拒绝承认BBWR是一个政党，它只“与政府合作”，不参与政党之间的分赃。党派政治之所以需要被战胜，它太过低效。一个在议会里为选区利益讨价还价的代表，远不如一个在部长办公室里核对预算逐行的官员有用。"
 POL_socialism_in_jackboots:0 "军靴中的社会主义"
 POL_socialism_in_jackboots_desc:0"斯维塔尔斯基认为自己是一个“社会主义者”，只是社会主义需要严明的纪律。国家经济总署的每一个产业处都配了退役军官担任“生产纪律专员”，他们的军衔不高，通常是上尉或少校，但他们的签字是工厂运行的前提。工人们的权利没有被取消，但没有军靴的纪律，就没有权利可言。"
