 POL_patriotic_dictator_desc:0 ""
 POL_artist_spiritual_aristocracy:0 "艺术家精神贵族"
 POL_artist_spiritual_aristocracy_desc:0 ""
 POL_the_german_threat_from_the_west:0 "西方的日耳曼威胁"
 POL_the_german_threat_from_the_west_desc:0"柏林对波兰的包围是全方位的，德国资本控制着波兰的工厂，其董事会决议可以直接影响华沙的工业计划；德资银行持有波兰国债的相当份额，每一次展期都附带关于波兰军事预算和外交方针的“建议”；在边境地区，德语被列为行政辅助语言，德国领事馆向当地德裔居民发放文化和教育补助；边境的德国驻军以秋季演习为名调动，次数逐年增加，每一次都迫使波兰军队在相邻的防线延长驻守时间，日耳曼威胁是斯拉夫民族的敌人！"
 POL_yellow_peril_panic_from_the_east:0 "东方的黄祸恐慌"
 POL_yellow_peril_panic_from_the_east_desc:0"热利戈夫斯基在议会的一次闭门会议上把日本在远东的扩张称为“斯拉夫世界背面的刀”。如果日本控制了从外阿穆尔到满洲的铁路和港口，斯拉夫人将永远被困在德国和日本之间的走廊里，无法把西伯利亚的资源和太平洋的通道连接起来。我们必须在远东斯拉夫流亡者中招募铁路和电报专家，在哈尔滨和海参崴的俄语报纸上刊登广告，为斯拉夫复兴研究所收集日本在东亚的交通和军事部署情报，不能再让那些蒙古猴子继续威胁斯拉夫人了。"
 POL_total_laissez_faire_economy:0 "全面自由放任经济"
 POL_total_laissez_faire_economy_desc:0"博琴斯基的经济观点只有一句话：国家干预越少，财富越多。他削减了中央工业区的补贴，把国有林场和盐矿的经营权转给县合作社，废除战时遗留的价格管制和物资配给。让市场决定哪些工厂该继续运转，比让部委官员决定更有效率。"
 POL_assimilate_minorities:0 "同化少数民族"
 POL_assimilate_minorities_desc:0"博琴斯基的同化不是民族同化，他在《贝雷扎·卡尔图斯卡的目的性》里写道，警察手段只会让少数民族更激进。他推动的“国家同化”计划把重点放在经济和文化上，少数民族地区的合作社获得低息贷款，双语学校保留但增设波兰语行政课程，地方公职向所有通过考试的居民开放。他的目标是让乌克兰人、白俄罗斯人和犹太人在波兰国家中找到自己的利益所在。"
 POL_awaken_civic_building_interest:0 "唤醒公民建设兴趣"
 POL_awaken_civic_building_interest_desc:0"博琴斯基认为，公民参与公共生活是地方政府存在的理由。他推动的“公民建设协会”在县一级组织道路修建、诊所开办和扫盲班的志愿活动，经费来自县金库，人员来自当地居民，华沙只提供技术标准和法律框架。国家不能替公民修好每一条路，但可以为公民修路提供工具和规则。公民建设是公民自我训练自治的学校。"
 POL_establish_labor_army:0 "建立劳工军"
 POL_establish_labor_army_desc:0"劳工军从罗兹纺织厂和华沙机械厂招募第一批成员，注册为“工人自卫队”，领取县金库津贴，由退役军团军官训练。他们不穿军装，职责是维持罢工和集会秩序、在车间分配住房和救济名额。让工厂里的秩序由工人自己维持，比省里派警察来维持更省钱，同时通过动员工人，还能为日后的军事行动做准备。"
 POL_crusade_against_democracy:0 "对抗民主的十字军东征"
 POL_crusade_against_democracy_desc:0"温季亚戈尔斯基在《雅沃鲁夫笔记》里把西方议会制称为“资产阶级的鸦片”，它让工人在投票箱前发泄不满，然后回到车间继续接受低工资和长工时。他推动的公社大会不是另一种议会，而是车间和村社里的直接表决。西方的民主是给富人设计的，他们有钱买报纸、雇说客、在议会里安插自己的人；波兰的工人和农民不需要那种民主，他们需要的是在车间里就能举手通过自己工资的权力。"
 POL_win_over_the_nobility:0 "拉拢贵族"
 POL_win_over_the_nobility_desc:0"维特科夫斯基没有邀请贵族到贝尔维德宫喝咖啡，他让火枪手的信使带着利益交换各省庄园。贵族们被要求提供他们在地方上的电话线和运输网络。作为回报，他们的庄园保留全部产权，地方行政职位优先从他们中选拔。"
 POL_form_combat_squads:0 "组建战斗队"
 POL_form_combat_squads_desc:0"战斗队从火枪手原有的破坏小组扩编而来，成员来自华沙理工大学的工程系、罗兹的纺织厂技工和边境林区的猎人。他们的训练科目包括铁路爆破、电话线窃听、伪造证件和短波电台操作。每支战斗队配有一名技术员和前军团军官，前者负责炸药和通讯，后者负责纪律和本地联络。战斗队不驻扎在兵营里，他们分散在各县的合作社、锯木厂和火车站，白天是工人和会计，晚上是火枪手的节点。"
 POL_grind_down_social_resistance:0 "磨平社会反抗"
 POL_grind_down_social_resistance_desc:0"拉齐维乌在枢密院推动成立“王国保安总局”，名义上隶属内务部，它借鉴了布尔什维克的组织。总局在各县设档案卡，凡参与罢工、农民集会者的姓名、职业、租约状况均记入卡片，由本堂神父与庄园管家协助核对。被捕者不经法庭，直接送往东部林区的“劳动安置营”，在锯木厂和铁路支线服劳役。"
 POL_progress_and_order:0 "进步与秩序"
 POL_progress_and_order_desc:0"保安总局的档案卡背面印着另一套表格：接种记录、识字等级、雇工合同编号。拉齐维乌把县诊所和教区学校纳入同一套登记系统，凡在庄园诊所接种的农户、在教区学校结业的佃户子弟，其档案自动转入“有序公民”名册，享有租约续签和铁路支线用工的优先权。未登记者不得离开本县，不得受雇于特许工厂。进步以卫生与识字的面目出现，秩序则藏在每张卡片背面的编号里。"
 POL_railway_union_workers_example:0 "铁路工会，工人榜样"
 POL_railway_union_workers_example_desc:0"1931年成立的亲政府工会中央在1935年后开始出现裂痕，工团主义派系拒绝接受民族统一阵营的吸纳。皮耶拉茨基让内政部劳动司把工会登记权重新核发，只发给那些签署了生产纪律公约的委员会。新成立的铁路工会中央把办公室设在华沙—维也纳铁路总局的侧楼里，主席是一位前军团工兵军官。模范班组获得优先的煤配额和住房名额，罢工记录则导致整个班组的家属从救济名册上除名。"
 POL_authoritarian_police_state:0 "威权警察国家"
 POL_authoritarian_police_state_desc:0"国家警察在皮耶拉茨基手中经历了一次安静的扩编。各县警署增设政治档案科，人员从退役军官和庄园管家中招募，不穿制服，领取内政部的津贴。档案科的卡片按姓名、职业、租约和社会关系四栏登记，本堂神父和村长负责提供核实。凡被内政部长标注为国家理由的案件，不再进入普通法院，转由省内政长官主持的行政合议庭处理，其裁决为终审。贝雷扎营的编制从临时拘押点改为常设隔离中心，预算列在内政部行政开支的特别项目下。"
 POL_national_pacification_plan:0 "国家平定计划"
 POL_national_pacification_plan_desc:0"1930年东加利西亚的平定行动在档案里被记为一次临时治安措施，皮耶拉茨基把它改成一套常设程序。计划的适用范围将是全波兰。驻军与警察组成联合纵队，进入被标记的地点，搜查武器和非法出版物，对拒绝配合的人处以集体罚金或强制劳动，同时登记所有适龄男性的兵役与迁徙状态。平定计划的目的不是惩罚某一次破坏行动，而是把人口纳入一套可核查、可动员、可惩罚的行政网络，让下一次破坏行动发生之前，名单上的人已经被找到。"
 POL_dictator_of_the_workers:0 "工人的独裁者"
 POL_dictator_of_the_workers_desc:0"雅沃罗夫斯基从不称自己为领袖。领袖需要人群、掌声、一面高悬的旗帜。他要的东西更简单：一间不用太大的办公室，一部直通民兵指挥部的电话，一份每天早上放在桌上的名单。名单上是一切敌人和可能变成敌人的人。这是工人的独裁，工人终于不必再向任何人解释自己为什么值得夺取权力。工人的独裁者不踩在工人头上，他是工人这个集体终于长出的那只不再发抖的手。手不需要民主，手只需要握紧。"
 POL_power_of_myth:0 "神话的伟力"
 POL_power_of_myth_desc:0"总罢工从来不是谈判筹码，而是一种革命信念。使工人成为一股力量的，是他们对自身行动之伟大的想象。“神话”可以作为动员工具，总罢工本身不一定发生，但信念能凝聚波兰的力量。"
 POL_the_will_of_the_workers:0 "工人的意志"
 POL_the_will_of_the_workers_desc:0"工人意志的表达仅仅停留在工会框架是不够的，一个无法公开辩论的意志无法被称为意志，只能被称为少数人的密谋。工人意志的衡量标准不是它在官方报纸上被讨论的频率，而是它在社会和国家需要时被服从的程度。"
 POL_controlled_democracy:0 "受控制的民主"
 POL_controlled_democracy_desc:0"国家工党主导的制宪委员会公布新选举法草案，将议会席位分配给行业工会、基督教工人协会、合作社联合会与地方自治机关的功能性代表，而非按地域人口比例产生。所有候选人须持有国家工党颁发的证明，证明其参与过劳动营、合作社或地方卫生委员会的工作。议会保留对预算与行政条例的质询权，但国防、外交与劳动纪律事务被划为“保留领域”，由苏里格以国家工党主席身份直接管辖。"
 POL_vanguardist_elite_stratum:0 "先锋队精英阶层"
 POL_vanguardist_elite_stratum_desc:0"“先锋队”在1932年还只是一个青年公民工作组织，如今它成为选拔国家领导层的唯一通道。斯克瓦尔钦斯基拒绝以出身、财富或党派资历界定精英，唯一的标准是“行动中的功绩”。先锋队成员在完成乡村扫盲、合作社组织与地方行政实习后被纳入干部名册，取代了旧上校集团以私人忠诚维系的非正式网络。精英阶层不再是环绕元帅个人的圈子，而是一个可复制、可考核的制度化等级。"
 POL_blue_socialist_reconstruction:0 "蓝色社会主义式重构"
 POL_blue_socialist_reconstruction_desc:0"普里斯托尔从不认为自己在背叛社会主义，他只是在波兰的条件下重新发现它。分散的自治机构在危机中只会沦为党派斗争的据点，而波兰没有多余的十年让工会官僚慢慢学习如何治理国家。第三国际的代表来访时称赞这是“具有波兰特色的社会主义道路”，普里斯托尔礼貌地纠正他们，这不是特色，这是纪律。"
 POL_unite_the_socialist_parties:0 "统合社会主义政党"
 POL_unite_the_socialist_parties_desc:0"波兰社会党等社会主义政党的议会党团被保留，作为工人阶级“表达诉求的合法渠道”。但它们的组织网络被逐一切断与政党的财务和组织联系，移交给“工人代表会议”。一个真正的战斗组织从不设两个指挥部，工人阶级只需要一个代表机构，而这个机构不参加选举。"
 POL_know_everything_intervene_everywhere:0 "了解一切，干预一切"
 POL_know_everything_intervene_everywhere_desc:0"这是毕苏斯基评价普里斯托尔的话，原话是“想了解一切、干预一切”的工作方式。普里斯托尔没有反驳过。他负责劳工事务时亲自审阅每一笔可疑支出，现在他把这套方法从政府扩大到了整个国家。各部委的公文流转被要求抄送他的办公室，任何机构的重大支出都须提前报备，普里斯托尔不相信任何未经他亲眼过目的数字和公文。"
 POL_build_a_patronage_network:0 "建立恩庇关系网"
 POL_build_a_patronage_network_desc:0"斯维塔尔斯基的人事名单从分散在十几个省长的私人保险柜中，人事任免不必走公开竞聘的冗长程序，名单上早就标注了他们计划好的合适人选，这样任命后不会引起任何一方的怨恨。恩庇关系网塑造了忠诚，它是行政效率的润滑剂。"
