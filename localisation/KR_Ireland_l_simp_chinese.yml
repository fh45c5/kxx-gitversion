 IRE_uk_DEF:0 "爱尔兰及大不列颠联合王国"
 ire_monarch.3.f:0 "兰德尔·麦克唐奈，詹姆斯一世的后裔，黄发小子的继承者"
 ire_monarch.13.t:0 "幽谷之王"
 ire_monarch.13.d:0 "兰德尔·麦克唐奈，第八代安特里姆伯爵，阿尔斯特安特里姆郡人。麦克唐奈与昔日强盛的麦克唐奈家族有着深厚的联系，他的父系祖先是詹姆斯一世和六世的女儿伊丽莎白·斯图亚特的后裔，因此无论他的血缘有多远，他都属于斯图亚特家族的继承人之一。由于殿下又处在詹姆斯派的继承线内，人们开始不可避免地将他的统治与斯图亚特家族的统治作比较。虽然比起他的先辈们，他更喜欢采取温和的手段，但他们的统治也并非没有相似之处。事实上，麦克唐奈从不隐藏自己对民主的支持，国王已经开始在国内积极推行天主教，同时悄悄地惩罚那些多年前支持威廉派的家族和宗族，悄悄地对其财产进行评估，还拒绝承认他们在新爱尔兰贵族制度中所享有头衔。出于这些行为，又或者仅仅是出于他在不列颠群岛上重建了某种君主制，来自苏格兰以及全球各地的各种詹姆斯派已经蜂拥而至，并开始拥护国王为詹姆斯二世的合法继承人以及英格兰、苏格兰和威尔士的合法国王。虽然这些声音至今仍被隔绝于政府之外，但国王宫廷中一些意志力薄弱的成员已经开始受到了他们的影响，这些成员的脑内已经被复兴旧日辉煌的念头所填满。"
 ire_monarch.13.a:0 "爱尔兰国王，詹姆斯的继承人万岁！"
 ire_monarch.14.t:0 "宪法的命运"
 ire_monarch.14.d:0 "虽然在奥尼尔家族家主的推动下，爱尔兰国内的葡式整合主义呼声愈发高涨，但国王陛下并不希望如此。兰德尔一世坚守宪政，视人民的投票权如自己的王位一般神圣。既然如此，国王开始对这些呼声置之不理，并呼吁他的总理尽己所能去保护民主。尽管如此，关于宪法的问题还是层出不穷，只不过这次性质更加深奥。在政府内外所提出的建议中，两方都提议把国家重新打造为联合王国的合法延续政权。虽然这种想法对于普通爱尔兰民众来说几乎等同于叛国，但这个想法也有其合理的一面。国王作为一个弱势的詹姆斯派宣称者确实对这些王位构成了宣称。随着英国倒向工团主义以及王室的流亡，从法理角度来看，尽管加拿大流亡者提出了宣称，但联合王国已经不复存在。爱尔兰既为旧联合王国不可分割的一部分，今王国复建，承继法统自然而然。如果爱尔兰真的想要继承联合王国的衣钵，我们将永远与协约国断绝关系、永世为敌。虽然这显然是一个疯狂的想法，但由于詹姆斯派流亡者的到来，詹姆斯主义的呼声已经悄然传进了政府，国王如今收到了一份修改宪法的计划：宣布爱尔兰为联合王国的继承人，从而成为整个不列颠群岛的合法政府。虽然人们预测他肯定会拒绝计划，但说不定詹姆斯派的呼声就是刚好传到了国王的耳朵里呢？"
 ire_monarch.14.a:0 "爱尔兰是爱尔兰人的，谴责这个疯狂的提案！"
 ire_monarch.14.b:0 "我们就是联合王国的继承者，批准该提案！"
 ire_monarch.15.t:0 "爱尔兰自封为联合王国的继承者"
 ire_monarch.15.d:0 "重建不久的爱尔兰王国宣布修宪，震惊了世界。尽管修宪通常是件寻常不过的事，但爱尔兰的本次修宪不仅大大巩固了其国内的民主，还宣称爱尔兰王国是联合王国法律上的延续。爱尔兰王室声称，既然联合王国在英国大革命成功后已不复存在，而爱尔兰是联合王国不可分割的一部分，且君主制已在爱尔兰复辟，那么爱尔兰在法律上就是联合王国的唯一残余。爱尔兰将加拿大的流亡者斥为冒牌货、同时宣称了不列颠群岛，此举受到广泛谴责。这会对不列颠群岛的命运有什么影响还有待观察。"
 ire_monarch.15.a:0 "爱尔兰永存！"
 ire_monarch.15.b:0 "他们不会是认真的吧？"
 ire_monarch.16.t:0 "改造家族宅邸"
 ire_monarch.16.d:0 "邓卢斯城堡始建于十三世纪，在麦克唐奈家族因博因河战役而家道中落前，这里一直都是安特里姆伯爵之所在。历经几个世纪的风吹雨打，这座城堡已经化作废墟，只有好奇的游客和想要搜刮资源的人才会光临此处。正因如此，这座曾被视为欧洲最现代化城镇之一的邓卢斯镇被夷为了平地，而这进一步导致了城堡的衰落。如今，麦克唐奈家族登上了爱尔兰王位，改变现况的时机已经到来。在王室的出资下，各种建筑公司被雇用来修复邓卢斯城堡的昔日辉煌。修复工程虽预计耗时数年到数十年不等，但国王态度坚决——纵使依法享有产权，完工后城堡也将转型为专题博物馆。博物馆将系统展列爱尔兰历史及独立历程，为此国王已启动文物征集工作。历经四百载沧桑，邓卢斯城堡终将再度傲立于安特里姆海岸之巅。"
 ire_monarch.16.a:0 "邓卢斯城堡不属于任何人！"
 ire_monarch.17.t:0 "女王式文艺复兴"
 ire_monarch.17.d:0 "虽然安杰拉·麦克唐奈殿下并不希望掺和政治热点，但她爱尔兰生活中却并非一股不活跃力量。作为一名艺术家，爱尔兰女王已经开始利用其崇高地位来充当爱尔兰艺术的赞助人。无论是向年轻艺术家赠予资金来帮助他们去往艺术学院，还是向各种艺术机构捐款，又或者仅仅是创作自己的作品，女王都为爱尔兰艺术注入了新的活力。与此同时，她还将许多年轻的艺术家置于她的羽翼之下，亲自教授他们如何进行雕刻。虽然她的尝试仍处于起步阶段，但在安杰拉·安特里姆的注视下，爱尔兰文化定会蓬勃发展。"
 ire_monarch.17.a:0 "为女王干杯！"
 ire_monarch.18.t:0 "第二次光荣革命"
 ire_monarch.18.d:0 "在漫长而艰苦的战斗之后，我们终于成功了。英格兰已经陷落，爱尔兰将把她遭受的数十年之久的压迫原样奉还。尽管英国佬和他们的“自由英格兰军”仍在反抗我们的公正统治，但他们只不过是螳臂当车。英国彻底完蛋了，再也不能威胁世界了。在这种情况下，联合王国的合法政府收复了它的土地，是时候为英国的合法国王加冕了。威斯敏斯特大教堂将准备就绪，我国国王将加冕为苏格兰、威尔士和英格兰的国王。英国佬该尝尝有个外国国王的滋味，正如他们曾强迫我们臣服于外国国王那样。虽然离加冕仪式还有几个月，但在筹备过程中，国王已要求议会废除《至尊法案》，恢复天主教会在英国的地位。不管怎样，关于不列颠群岛命运的最后一个问题已经出现：虽然英国的爱尔兰化不可避免，但我们的首都将设于何处仍成问题。大多数人希望联合王国的首都保持不动、继续设在都柏林，但仍有人希望首都迁回伦敦。尽管这个想法并不受欢迎，但伦敦此前一直是英国首都，还有什么能比一个爱尔兰国王待在他们曾光荣的首都更好地羞辱英国人的呢？无论如何，既然加冕典礼业已临近，预计国王将就首都问题给出答复。"
 ire_monarch.18.a:0 "都柏林仍将是首都，就任凭英国人发烂发臭吧"
 ire_monarch.18.b:0 "伦敦将成为首都，以此提醒英国人应当摆正位置"
 IRE_mcdonnell_larp:0 "安特里姆伯爵对斯图亚特王位的宣称被推翻了"
 ire.368.t:0 "S计划"
 ire.368.d:0 "今天，在由柯林斯总统及其主要由前爱尔兰共和军军议会成员组成的内阁的例行会议上，内政部长肖恩·拉塞尔提出了一项计划。作为爱尔兰共和军的军需官，拉塞尔被许多人认为是爱尔兰共和军中最激进的领导人之一。事实上，拉塞尔提出的计划似乎证实了这些看法的正确。他所提出的“破坏行动”，或简称S计划，是将爱尔兰特工和各种爆炸装置走私进不列颠联盟，动用恐怖手段从内部打击敌国的经济、军事和民用目标的激进行动计划。拉塞尔，以及和他一同构想了该计划的西姆斯·奥多诺万的想法是，S计划将在英国国内制造严重混乱，既警告他们远离爱尔兰，也削弱他们发起反制行动的能力。爱尔兰特工将在政府的暗中支持下融入英国社会，找出爆炸袭击的最佳目标。毫无疑问，S计划会破坏我们与不列颠联盟和解（如果政府如此希望）的任何机会。除此之外，会造成的潜在死亡人数，无论是平民还是政府人士，都不可小视。然而，S计划的提出也确实并非都是狂想。国内的混乱必定会让政局渐乱的不列颠联盟更难进行对爱尔兰的行动，不得不花费资源来维持秩序。无论如何，由于在37年选举之前议会已被解散，现在只有柯林斯总统才能做出选择。"
 ire.368.a:0 "批准该计划，我们要制服背信弃义的不列颠！"
 ire.368.b:0 "我们可不会堕落到和英国人一个水平，拒绝这个“计划”"
 ire.369.t:0 "英国发生爆炸袭击！"
 ire.369.d:0 "短短几天内，英国境内便已发生了至少二十起爆炸袭击。袭击目标从军事领域、民用领域和经济领域再到一般建筑物无所不包，其罪魁祸首和最终目标尚不清楚。英国政府竭力维持局势之际，人们将矛头指向了爱尔兰共和国。虽没有发现直接联系，但英国官员声称他们发现了一份有关于“S计划”的文件。这份文件要求对英国的关键地区进行爆炸袭击，据称是由一直以来担任爱尔兰总统的迈克尔·柯林斯签署的。爱尔兰方面虽谴责了爆炸案并驳斥了英方的指控，却拒绝了英国“暂停一切爱尔兰货运”的临时要求。真凶落网之前，爆炸阴云恐将持续笼罩。"
 ire.369.a:0 "那些英国佬可是有好果子吃了！"
 ire.369.b:0 "肯定是那帮爱尔兰佬搞的鬼！"
 ire.369.c:0 "愿主怜悯不列颠……"
 ire.370.t:0 "爱尔兰右翼联盟"
 ire.370.d:0 "作为一个撮尔小国，爱尔兰的政治领域可谓是惊人地多姿多彩，各种思想如同杂草一般四处生根发芽。右翼之中，在我党的领导下，有两个团体的影响力越来越大，分别是命运之石和爱尔兰货币改革协会。命运之石由天主教神父约翰·费伊创立，是一个小型的极右翼民粹主义农业政党，拥护激进民粹主义和激进土地主义，当然还有仇外主义、爱尔兰民族统一主义和沙文主义、反犹太主义、爱尔兰民族主义和种族例外主义、反工团主义与阶级合作主义。与他们站在一起的是谢默斯·列侬和奥利弗·弗拉纳根的货币改革协会，他们宣扬的思想与之类似，如爱尔兰民族主义、反犹太主义、反工团主义、反资本主义、基督教法团主义和社会信用理论。总之，这些政党代表着爱尔兰右翼意识形态中日益宽广的边缘地带，因此，我们必须决定如何处理这些激进分子。我们可以与这些团体结盟，将他们的一些理念纳入我们的政府，一致对抗敌人，或者，我们也可以干脆让这些卑鄙的失败者别再装神弄鬼，爱尔兰右翼的真正领头羊将带领这个国家走向伟大。"
 ire.370.a:0 "为了右派团结的利益着想，与这些类似的团体合作"
 ire.370.b:0 "我们是爱尔兰右翼唯一的正统传人。立即禁止这些团体"
 ire.371.t:0 "笔端的革命大师"
 ire.371.d:0 "资深革命者、现代爱尔兰诗歌和复兴的盖尔文化之父、前自由邦政治家和前爱尔兰共和军成员詹姆斯·乔伊斯与威廉·巴特勒·叶芝一向是我党和政治运动的亲密盟友。由于与我们的革命活动乃至全爱尔兰的自由斗争有着密切联系，这些盖尔文学的巨匠已开始与我们的政权密切合作，帮助传播我们的思想的同时，也通过他们那受万众喜爱的笔尖编制出的神奇文字向大众传播传统文化，唤起爱尔兰人民的想象力和心灵。此外，他们都同意献出自己的革命专长帮助军队和警察，因为他们都有反英游击队和革命领导人的经验。希望有了这些真正的爱尔兰英雄和执笔大师的陪伴，我们能赢得人民的仰慕与信赖，而无需流血或承担成长的痛苦。"
 ire.371.a:0 "莫待铁热再打铁，要先打铁使其热"
 ire_monarch.19.t:0 "计划中的阻碍"
 ire_monarch.19.d:0 "瓦莱拉总统及其议会盟友虽已启动恢复爱尔兰君主制的进程，甚至宣布开始了所谓的“爱尔兰摄政期”，但国内似乎并不是所有的人都赞同这个计划。诚然，以前隶属于新芬党，站反条约派爱尔兰共和军一边，于贝尔法斯特协议后参选进入议会的议员，以及前军议会的许多成员都发表了一份联合声明，对复辟行为表示了强烈谴责。反对派在声明中斥责瓦莱拉为暴君，指责他把英国人请回了家门，并表示他们将坚持与复辟作斗争，且如有必要，他们宁愿以死亡来维护爱尔兰的自由。面对这一抗议声浪，瓦莱拉的众多盟友，据说还有总统本人，都开始质疑复辟的可行性。因此，许多人在想，是否应该就这样放弃整个复辟计划，而维持共和制政体。而有些人则要求总统正面解决这些问题。毕竟，总统的愿景不就是让爱尔兰成为一个盖尔人的君主制国家吗？此外，爱尔兰还应维持其民主制度，只不过是在国王的目光所及之下。当然，我们也可以简单地忽略这些反对的声音。毕竟他们在国家议会中只占少数，而复辟则得到了各大党派的支持。无论选择为何，都只能由瓦莱拉来决定。"
 ire_monarch.19.a:0 "尊重抗议者，悄悄地终止复辟"
 ire_monarch.19.b:0 "我们得提醒一下他们，君主制对爱尔兰来说可不是什么新玩意"
 ire_monarch.19.c:0 "呸！我是总统，我爱干啥干啥！"
 ire_monarch.20.t:0 "爱尔兰共和军重生"
 ire_monarch.20.d:0 "德·瓦莱拉总统揭露了国家议会中的部分共和派和前军议会对复辟的担忧和抗议，他们以暴力对抗君主制复辟的威胁并非空穴来风。随后，在一份与先前类似的联合声明中，军议会撤销了对自己之前的解散令并进行了内部改革，同时还有大约三分之一的现任众议院议员当场退会以示抗议。与因《英爱条约》而分裂形成的爱尔兰共和军不同，这个新的爱尔兰共和军并没有强调自己的合法性。事实上，爱尔兰共和军在他们的成立宣言中非常明确地表示，在爱尔兰共和国已经得到恢复的今天，德·瓦莱拉总统倒行逆施的行径已经逾越了他们的底线。为了维护爱尔兰的自由和民主，他们必须再次拿起武器进行斗争，在德·瓦莱拉和盘踞王位的虚假君主被打倒之前，他们绝不善罢甘休。\n\n考虑到改革后的爱尔兰共和军已经得到了民众的支持，政府内部的许多人对此表示担忧，与柯林斯所对付的边缘群体不同，德·瓦莱拉可能需要采用前所未有的措施才能真正地镇压这些恐怖分子。一旦我们失败，爱尔兰共和军就很有可能推翻我们的政府。虽然共和军对自己很有把握，但总统却似乎并不那么肯定。毕竟，他们最多只有2000人，且大多数人已经在军中服役。我们为什么要仅仅为了一场就像是简单的农民起义就冒着名声狼藉的风险付出代价呢？"
 ire_monarch.20.a:0 "尽一切努力保护重生的王国！"
 ire_monarch.20.b:0 "爱尔兰共和军没什么威胁，多留意一番便可"
 ire_monarch.21.t:0 "爱尔兰共和军凯旋"
 ire_monarch.21.d:0 "爱尔兰政治历史上最失算的时刻之一诞生了：德·瓦莱拉总统和大部分国家议会成员在爱尔兰共和军发动的不流血政变中被拘留。正值德·瓦莱拉在众议院和参议院的联席会议上进行关于君主制之荣耀的演讲之时，爱尔兰共和军借着这一机会在夜色的掩护下来到都柏林，拿下了整个城市。当他们开始掘地三尺地搜寻时，一部分共和军包围了伦斯特议会大楼，并成功地逮捕了德·瓦莱拉和两院的众多议员。随着真正的爱尔兰共和国如今再次摆脱了惨遭践踏的命运，新的问题随之诞生：现在该怎么办？虽然在《贝尔法斯特协议》诞生前的日子里，爱尔兰共和军的目标是恢复1916年复活节起义期间建立的共和国，但这个目标如今已经实现。现在，随着德·瓦莱拉的下台，爱尔兰共和军正处在爱尔兰历史上前无古人，后无来者的十字路口。他们掌握着整个国家的权力，军事委员会有能力随心所欲地塑造爱尔兰的形象，为此他们召开了一次紧急会议。\n\n很明显，在这个小议会当中，只有四大派系真正有机会掌权。第一个选择，也是许多人认为最合理的选择是任命卡哈尔·布鲁阿领导的新芬党掌权。长期以来，新芬党与爱尔兰共和军关系密切，大多数爱尔兰共和军成员都属于该党，因此任命他们从许多方面来看都是合乎逻辑的选择。此外，皮达尔·奥唐奈和自由爱尔兰，一个由爱尔兰共和军成员创建的社会民族主义政党也被举荐出来。与新芬党的受欢迎程度相差甚远，“自由爱尔兰”的许多成员都是爱尔兰共和军出身，他们在对抗自由邦的斗争中证明了自己的价值。还有一些人认为，不必搞得如此复杂，直接由我们军事委员会自己来统治就好。爱尔兰已经被爱尔兰共和军解放了无数次，如果说德·瓦莱拉证明了什么，那就是爱尔兰人民还没有做好迎接全面民主的准备。军事委员会可以以孙中山及其创立的国民党的思想为基础，孤自领导爱尔兰，直到人民做好了迎接共和的准备。同时，我们还将把新芬党改组为共和协会，作为全国性政党。最后，许多人认为最不可能的选择是直接重新任命德·瓦莱拉为总统。虽然这个想法确实很激进，而且德·瓦莱拉正是爱尔兰共和军被迫改革的罪魁祸首，但这其中也有逻辑可循。德·瓦莱拉是爱尔兰共和国历史上第一位由全体爱尔兰民众选举产生的总统，虽然他曾经试图恢复君主制，但他仍是合法的总统。因此，就算人民不希望他留下，至少也应该允许他结束自己的任期。如果我们不打算任命他，人们普遍希望能将德·瓦莱拉流放，而这才是一个叛徒应有的下场。\n\n在辩论宣告结束后，军议会内部也进行了投票。选票已经清点完毕，议会投票决定……"
 ire_monarch.21.a:0 "……任命卡哈尔·布鲁阿和新芬党"
 ire_monarch.21.b:0 "……任命皮达尔·奥唐奈和自由爱尔兰"
 ire_monarch.21.c:0 "……任命他们自己和共和协会"
 ire_monarch.21.e:0 "……任命埃蒙·德·瓦莱拉，让他结束自己的任期"
 ire_monarch.22.t:0 "爱尔兰的骚乱"
 ire_monarch.22.d:0 "经爱尔兰总统兼摄政瓦莱拉证实，一群被称为爱尔兰共和军的共和分子一直在全国各地与政府军发生冲突。除此之外，爱尔兰各地城市的爆炸事件也得到了证实。为应对爱尔兰共和军的威胁，爱尔兰政府颁布了多项严厉的安全法案，旨在粉碎爱尔兰共和军并消除其民众支持。政府这次是下了血本，所以这场骚乱预计持续不了多长时间。不管怎样，爱尔兰的纷争时代似乎还没有结束。"
 ire_monarch.22.a:0 "我们要粉碎这帮恐怖分子！"
 ire_monarch.22.b:0 "共和派同人民的呼声保持一致！"
 ire_monarch.22.c:0 "在这小小的岛屿上发生了这么多的暴力事件"
 ire_monarch.23.t:0 "爱尔兰王国重生"
 ire_monarch.23.d:0 "今天，爱尔兰共和国总统埃蒙·德·瓦莱拉宣布，在未来的几周至数月时间内，爱尔兰将由共和制转变为君主制。总统的职位将由国王所取代，但爱尔兰的民主机构将得到完全保留并享有权力。有趣的是，总统并没有说明谁将登上爱尔兰的王位。事实上，尽管已经证实确实存在一份候选人名单，但似乎连总统自己都对此一无所知。为了对此做出反映，爱尔兰已经宣布自己为摄政国，尽管摄政期预计不会持续多久。不论结果如何，爱尔兰也算是加入了全世界各种君主国家的行列。"
 ire_monarch.23.a:0 "国王万岁！"
 ire_monarch.23.b:0 "反动派越来越魔怔了"
 ire_monarch.23.c:0 "很好"
 ire_monarch.24.t:0 "爱尔兰王国之终"
 ire_monarch.24.d:0 "爱尔兰王国可谓是其兴也勃焉，其亡也忽焉。在共和分子发动政变之后，共和国再获新生，临时政府也随之成立。尽管其已被刑拘，但埃蒙·德·瓦莱拉总统目前生死不明。虽然爱尔兰国内许多人为失去复辟王政的机会而悲伤，但也有许多人为共和制度的回归而欣喜。无论如何，对大多数爱尔兰人来说，他们想要的似乎只是稳定，国王什么的并不重要。新成立的共和派政府是否真的能给爱尔兰带来稳定，抑或这只是爱尔兰历史上的下一个血腥篇章，皆尚待观察。"
 ire_monarch.24.a:0 "爱尔兰万岁！"
 ire_monarch.24.b:0 "反抗反动派的光辉胜利！"
 IRE_s_plan:0 "“S计划”"
 IRE_s_plan_eng:0 "英国国内的爆炸袭击"
 IRE_s_plan_eng_desc:0 "某不明势力正在资助群岛各地的爆炸案。据信，爆炸事件背后有爱尔兰政府中的激进分子的支持。爆炸事件随机发生且毫无预警，我们无力阻止。"
 ire_monarch.24.c:0 "爱尔兰就像是有扇旋转门似的"
