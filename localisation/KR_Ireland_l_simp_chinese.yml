 ire.3182.b:0 "像她这样的新芬党元老值得坐上总理之位。"
 ire.364.t:0 "共和国的新国旗"
 ire.364.d:0 "我们应该用哪一面国旗来代表重建的合法共和国？"
 ire.364.a:0 "高举三色旗！"
 ire.364.b:0 "使用宣言旗！"
 ire.364.c:0 "悬挂反条约派爱尔兰共和军的旗帜！"
 ire.364.e:0 "挥起爱尔兰共和军的竖琴旗！"
 ire.364.f:0 "使用复活节起义中悬挂的鹰旗！"
 ire.364.g:0 "选择此选项将重新使用凯尔特语国名（你需要在选择旗帜事件中再选择一次）"
 ire.365.t:0 "迈向民族公义的一步"
 ire.365.d:0 "万事已毕。伦敦正熊熊燃烧，而英格兰则正如她曾对我们所做的一样，在重重镣铐下挣扎着。不管我们的占领政策如何，大压迫者终究还是不复存在了。但是，杀尽敌人并不是一切的尾声，更不代表着公平已然降临。长久以来，爱尔兰被盎格鲁人觊觎并窃走的各种珍宝财富，将统统回归他们的故国。第一个被归还的珍宝便是玛丽·香农的旗帜，其在英格兰镇压复活节起义时被夺取并作为战利品保存下来。一旦国旗重归祖国，它便将被安置在爱尔兰最伟大的博物馆的荣誉之地。哪怕这是小事一桩，但我国的国家荣誉也将由此大大重塑，英格兰也将偿还一笔她欠下世界人民的无尽债务。"
 ire.365.a:0 "英格兰应为她的罪行付出代价"
 ire.366.t:0 "大英博物馆的命运"
 ire.366.d:0 "除毁灭殖民地居民的本土文化之外，英国人最喜欢的消遣之一似乎就是从这些居民那里窃取文物和珍宝了。只要英国当局认为哪些文物具有历史或物质价值，那他们就会把这些文物搬到大英博物馆里去。从罗塞塔石碑到希腊帕台农神庙的部分遗迹，甚至还有刻有吉尔伽美什史诗部分内容的石碑，都是英国人从当地人的手里夺来的。虽然这些藏品在英国大革命中受到了破坏，其中一些最有价值的文物也跟着流亡者流落到了加拿大，但大英博物馆仍拥有世上最多的历史文物藏品。然而，在这座博物馆落入爱尔兰人之手后，争论便因这座历史博物馆的命运而起。政府里的很多人认为我们应该把文物都物归原主，并把大英博物馆改造成一个讲述英帝国主义事迹的博物馆。虽然这一工程无疑将耗资巨大，但世界各国都会因此乐不可支，这不仅是因为他们的文物得以重回故里，也因为旧帝国的最后残余终于灰飞烟灭。另一些人认为，我们不仅应当保留博物馆，而且还应该把这些珍宝带回都柏林，这让爱尔兰左翼人士惊骇不已。毕竟，不管之前属于谁，它们都是我们的征服所得，更不用说我们可以通过收藏这些文物而名声远扬了。还有一些人则认为我们应该干脆不去管博物馆。我们为什么要为一个已不复存在的国家的事务而烦恼呢？此外，要是文物的原主人想要拿回文物，那他们直接来要就好。无论如何，大英博物馆的命运只是英格兰遗产中又一个有待回答的问题，而我们将会回答这个问题。"
 ire.366.a:0 "归还藏品，改造博物馆！"
 ire.366.b:0 "把藏品统统运到都柏林！"
 ire.366.c:0 "不管它们，我们还有别的事要做"
 ire.367.t:0 "美国旅游业稳步增长"
 ire.367.d:0 "随着爱尔兰共和国和美利坚合众国之间的贸易往来和关系的不断增进，自去年以来，我们美丽的翡翠之岛的美国旅游业就开始呈指数级增长。无论是来参观诺克圣母圣殿的朝圣者，还是探索邓古莱城堡或科科姆罗修道院的古代遗迹的游客，抑或是在都柏林的观光客，爱尔兰全国上下基本上已经被美国游客看光光了。虽然美国旅游业对经济产生了巨大的拉动作用，几乎完全振兴了某些地方的经济，但它也并非没有缺点。和平卫队经常被用来对付那些吵闹的游客，许多保守派人士认为旅游业的不断增长是爱尔兰人民走向毁灭的第一步。尽管如此，美国旅游业似乎还是会成为爱尔兰的新常态。虽然美国游客有时候真的很烦人，但他们所带来的经济效益却绝不能被低估。"
 ire.367.a:0 "只要他们给钱，爱尔兰就欢迎任何人的到来！"
 IRE_uk_exile:0 "联合王国爱尔兰政府"
 IRE_uk_exile_ADJ:0 "爱英"
 IRE_uk_exile_DEF:0 "爱尔兰及大不列颠联合王国爱尔兰政府"
 IRE_uk:0 "爱尔兰及大不列颠联合王国"
