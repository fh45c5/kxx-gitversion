 ire_monarch.25.t:0 "王国的泛凯尔特未来"
 ire_monarch.25.d:0 "英伦群岛既已合为一国，旧王朝的元老又极力主张以泛凯尔特主义为立国之本，可我们到底要建成啥样的国家，这事却始终云山雾罩。为厘清新国家的身份定位，詹姆斯四世陛下召开了紧急内阁会议，商讨这一紧迫的问题。总的来说，大多数人都觉着就该老老实实，在不列颠群岛当个凯尔特人自己的国家。也有人主张效仿詹姆斯党搞和解政策，联合起来建立起全新的凯尔特国家，奉国王陛下为共主。还有人觉得应该一不做二不休，将泛凯尔特主义贯彻到底，统一起世界上的所有凯尔特人。另有一小部分人坚持应跳脱出泛凯尔特主义的框架，将法兰西的王座纳入手中，毕竟詹姆斯四世国王除了保有爱尔兰、苏格兰和威尔士的王位宣称外，还和列祖列宗一样拥有法兰西的宣称，如此看来，收复高卢自然是泛凯尔特主义的一部分。甚至还有个别团体，基本都是些最早响应詹姆斯党号召的人，希望开倒车，放弃泛凯尔特这一套，重树联合王国正朔，此外，这一本就小众的群体中还有人更为极端，想要收复法国，重建安茹帝国。内阁成员各执一词，吵得不可开交，最后只能交由国王裁决。"
 ire_monarch.25.a:0 "凯尔特人的王国将永立不倒！"
 ire_monarch.25.b:0 "双不列颠民族的联盟崛起在即！"
 ire_monarch.25.c:0 "所有凯尔特人都必须同祖国命运与共！"
 ire_monarch.25.e:0 "凯尔特人和高卢人的所有土地都必须获得解放！"
 ire_monarch.25.f:0 "泛凯尔特主义谬妄无稽，我们必须重建联合王国！"
 ire_monarch.25.g:0 "泛凯尔特主义就是痴人梦一场，我们要转而重建安茹帝国！"
 IRE_mcdonnell_did_it:0 "詹姆斯四世已经夺回了合法王位"
 ire.3102.t:0 "格拉尔顿同志逝世"
 ire.3102.d:0 "詹姆斯·格拉尔顿，革命工人党的领袖，自我们的社会主义国家成立以来一直领导我们的人，于今日不幸逝世。作为有史以来唯一被驱逐出境的爱尔兰公民，格拉尔顿在爱尔兰转变为社会主义国家后被革命众议院选举为主席，将我国建设为为了一个真正的无产阶级天堂，并将真正的盖尔式共产主义带到了翡翠岛。\n\n在格拉尔顿逝世后，革命众议院的成员提名了两位主要候选人来接替格拉尔顿的位置。目前为止最受欢迎的候选人是小詹姆斯·拉金。他是爱尔兰最著名的革命家詹姆斯·拉金的儿子，也是革命工人团体的著名成员，这导致他和他父亲之间产生了很大的矛盾。倘若小拉金登上了主席之位，可以说基本上不会发生任何变化，他将继续沿着格拉尔顿给爱尔兰铺就的道路前进。\n\n另一位候选人是弗兰克·瑞安，他是著名的爱尔兰民族主义者和准则主义事业的支持者。若是瑞安登上了主席之位，许多人预测爱尔兰将在他的监督之下，依照着墨索里尼和莫斯利的模式转变为一个真正的准则主义国家。虽然很多人对准则主义爱尔兰的未来感到十分担忧，但瑞安的支持者表示，追随莫斯利的路线不过是确保爱尔兰在星光之犁的注视下赢取自由和安宁的微小举措罢了。"
 ire.3102.a:0 "弗兰克·瑞安接替格拉尔顿担任主席。"
 ire.3102.b:0 "革命众议院支持小詹姆斯·拉金。"
 IRE_Raymond_to_Murrough: "§Y雷蒙德·莫尔顿·奥布赖恩§!将被称作§Y默罗二世§!"
 ire_monarch.26.t:0 "爱尔兰君主制协会抗议选举结果"
 ire_monarch.26.d:0 "雷蒙德·莫尔顿·奥布赖恩在获得埃蒙·德·瓦莱拉的任命后，其在爱尔兰君主制协会和共和党内的地位就越发显赫，他的整合主义思想也随之深入共和党之中，而如今已与整合主义合为一体的共和党倘若能说动至高王，那便能一举逆转选举中的颓势，反败为胜。奥布赖恩以其迷惑人心的本事左右煽动，君主制协会也振臂高呼爱尔兰应在国王的统治下“行天之道”，而无需去在意寻常民众那变幻无常的想法。奥布赖恩及其盟友以及整合主义同僚要求国王推翻近期民主选举的结果，以“保卫”国家不受腐败、不公的思想的毒害，同时还催促国王接受融合了整合主义思想的共和党的支持，接过神授的绝对君权。不过，至高王本人是否会冒天下之大不韪，违反民主原则与宪法，去建立整合主义爱尔兰还不得而知……"
 ire_monarch.26.a:0 "国王为宪法和人民服务，而非共和党！"
 ire_monarch.26.b:0 "除了瓦莱拉，我们决不能让爱尔兰君主制掌握在他人手中！"
 ire_monarch.27.t:0 "爱尔兰君主制协会试图夺取王位"
 ire_monarch.27.d:0 "名为爱尔兰君主制协会的整合主义组织在埃蒙·德·瓦莱拉和共和党的庇护之下迅速壮大，而今他们更是越过了雷池，打算从内部拿下爱尔兰。君主制协会疯疯癫癫的领袖雷蒙德·莫尔顿·奥布赖恩联合了蓝衫军、黑色军团、复兴建筑师等团体的极端成员，妄图建立起由天主教法团主义、现代新封建主义、权力分散的互助主义、以行会商贸为主的地方经济体制、盖尔民族主义、氏族传统绝对君主制、至高王、共和党以及汲取自法国的莫拉斯思想和葡萄牙的卢西塔尼亚整合主义的各种政策所支撑起来的整合主义爱尔兰。这一团结在奥布赖恩的整合主义与爱尔兰王冠周围的保守反动的边缘团体联盟视当今王上为背叛了爱尔兰传统的软弱无能的伪君，想要取而代之，如今他们终于找到了机会一举发难，而最终的结果如何，究竟鹿死谁手，整合国家都在屏息以待。"
 ire_monarch.27.a:0 "政变惨败，奥布赖恩和整合主义者将永世不得翻身"
 ire_monarch.27.b:0 "政变大胜，奥布赖恩成为了爱尔兰整合主义的先驱！"
