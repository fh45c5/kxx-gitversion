 ire.2604.t:0 "宗教现状"
 ire.2604.d1:0 "爱尔兰素有“圣人与学者之国”之称，顾名思义，爱尔兰拥有着悠久的宗教传统，也影响着每一个公民的生活，无论他们是信徒还是非信徒。几个世纪以来，教会一直是爱尔兰社会的核心，新宪法也必须解决这一问题。\n\n第一种方案得到了工党与共和党自由派成员的支持，文案如下：\n——“国家保障每个公民的信仰自由与信仰宗教、参与宗教活动的自由，国家不得对任何特定的宗教信仰给予任何特别的承认或资助。”\n这将让国家远离教会事务，亦将给予公民完全的宗教自由，但身为一个根深蒂固的基督教国家，此举并不是很得民心。但这也能勉强在民族主义者与保王派之间实现妥协。\n\n不出所料，共和党与陆军同志协会正大力推动在宪法中给予天主教会以特别承认：\n——“国家承认大公教会与罗马教会作为绝大多数公民所信奉的信仰之守护者的特殊地位。”\n这虽能准确地反映民众的宗教信仰，却也有意排除了在北部地区占统治地位的其他教会，必然会激起当地人的不满。\n\n在工党和新芬党的支持下，阿尔斯特统一党提出了一套解决方案，即在上一条款中增以下部分：\n——“国家亦承认爱尔兰教会、爱尔兰长老会、爱尔兰卫理公会、爱尔兰公谊会，以及在本宪法生效之日于爱尔兰境内存在的犹太教会和其他宗教教派。”\n这能安抚北方的新教徒，亦对爱尔兰境内各个主流教派加以承认。共和党，尤其是陆军同志协会认为此举实无必要，但若必须将其列入宪法，共和党亦不会表示反对。"
 ire.2604.d2:0 "爱尔兰素有“圣人与学者之国”之称，顾名思义，爱尔兰也是个宗教氛围浓郁的国家。几个世纪以来，教会一直是爱尔兰社会的核心，新宪法也必须解决这一问题。\n\n共和党以及其他政党，例如新芬党中的虔诚党员是推动在宪法中给予天主教会以特别承认的主力军：\n——“国家承认大公教会与罗马教会作为绝大多数公民所信奉的信仰之守护者的特殊地位。”\n这虽能准确地反映民众的宗教信仰，却也有意排除了在北部地区占统治地位的其他教会，必然会激起当地人的不满。\n\n反对派团结了起来，在上一条款后增添了以下部分：\n——“国家亦承认爱尔兰教会、爱尔兰长老会、爱尔兰卫理公会、爱尔兰公谊会，以及在本宪法生效之日于爱尔兰境内存在的犹太教会和其他宗教教派。”\n这能安抚北方的新教徒，亦对爱尔兰境内各个主流教派加以承认。共和党，尤其是陆军同志协会认为此举实无必要，但若必须将其列入宪法，共和党亦不会表示反对。\n\n还有一个由陆军同志协会与共和党中更为保守的众议院议员所首倡的方案，那便是承认爱尔兰身为天主教国家的事实。\n——“国家承认大公教会与罗马教会为国家之国教及其公民所信奉的信仰之守护者，并努力维持其这一状态与地位。”\n这一保守的、天主教的方案将对大多数公民所信奉之物产生影响。保王派肯定会表示强烈抗议，毕竟北爱与爱尔兰本部就是因为宗教才分裂开来的。"
 ire.2604.a:0 "不对宗教作出特别承认"
 ire.2604.c:0 "天主教会享有特殊地位"
 ire.2604.e:0 "承认爱尔兰境内的其他宗教"
 ire.2604.f:0 "爱尔兰是天主教国家！"
 ire.2605.t:0 "官方语言"
 ire.2605.d:0 "如何处理爱尔兰语言的问题虽是个象征性的议题，但也对爱尔兰所扮演的角色具有重大影响。没人想看到爱尔兰语继续衰落下去，所以争论主要是围绕着英语的地位展开的。无可奈何的是，无论强硬的民族主义者作何希望，英语都必须在爱尔兰的社会中占据一席之地。\n\n第一种方案得到了共和党与陆军同志协会的强烈支持，那就是给予爱尔兰语第一官方语言的地位，在必要之时亦可使用英语。\n——“1.爱尔兰语为国语，亦为第一官方语言。”\n——“2.英语为另一官方语言。”\n这意味着爱尔兰语将在法律层面上永远占据优先地位，每个公民亦可使用爱尔兰语处理公务。更重要的是，这将有力地向世人表明，爱尔兰永远属于爱尔兰人，爱尔兰语也永不会灭绝。\n\n第二种方案则得到了新芬党与阿尔斯特统一党的青睐，亦即在上述两项条款后增添第三项条款：\n——“3.鉴于阿尔斯特东北六郡的特殊地位与历史沿革，特此规定英语为以上各郡的唯一官方语言。”\n倘若他们愿意的话，这将让北部各郡拥有在公务层面上不使用爱尔兰语的权利。保王派生怕被迫使用爱尔兰语，并且也希望像爱尔兰其他地区一样保护自己的遗产。\n\n第三种方案主要得到了工党与共和党党内自由派的支持，他们提议仅需列明一条条款：\n——“爱尔兰语与英语均为彼此平等的官方语言。”\n这将让爱尔兰语和英语获得同等的认可。若落到实处，其效果便是某项法律的爱尔兰语文本语英语文本具有同等的地位，相关问题的解释亦将在多语言的基础上进行。这一方案并不得民心，只有保王派勉强对此表示支持。许多人亦将之视为对“爱尔兰人的爱尔兰”已不复存在的一种承认。"
 ire.2605.a:0 "必须以爱尔兰语为重！"
 ire.2605.b:0 "对北方网开一面"
 ire.2605.c:0 "平等地使用两种语言"
 ire.2606.t:0 "土地头衔"
 ire.2606.d1:0 "爱尔兰虽鲜有贵族，但也不乏持有或将继承贵族头衔的共和国公民。一些保王派和富有的土地所有者对自己的贵族身份颇为重视，担心他们的头衔受到威胁，这种情绪倒也不是无根无据。相当一部分政客希望彻底清除大英帝国的最后残余，令爱尔兰以现代共和国之形象面向世人。无论作何选择，只有那些因头衔享尽荣华富贵的死硬保王派希望延续这一制度。\n\n第一种方案很简单——废除一切头衔，也没有公民能领受头衔。共和党对此表示支持，但这必然会激起贵族们的不安：\n——“1.贵族头衔不由国家授予。”\n——“2.任何公民不得领受任何贵族或荣誉称号，除非事先得到政府的批准。”\n\n第二种方案则得到了阿尔斯特统一党的支持，即承认公民的现有头衔：\n——“国家应承认公民所拥有的任何现有头衔”\n\n另一种方案是对先前英王授予的头衔不加认可，让国家当局授予属于自己的头衔。这无异于给了保王派一记耳光，但陆军同志协会似乎也对此表示支持：\n——“国家有授予优秀公民特殊勋章的权力”\n\n新芬党提出了一个折衷的、综合了以上两项条款的方案，那便是承认现有头衔，也允许设立新的头衔。"
 ire.2606.d2:0 "爱尔兰虽鲜有贵族，但也不乏持有或将继承贵族头衔的共和国公民。一些保王派和富有的土地所有者对自己的贵族身份颇为重视，担心他们的头衔受到威胁，这种情绪倒也不是无根无据。相当一部分政客希望彻底清除大英帝国的最后残余，令爱尔兰以现代共和国之形象面向世人。无论作何选择，只有那些因头衔享尽荣华富贵的死硬保王派希望延续这一制度。\n\n第一种方案很简单——废除一切头衔，也没有公民能领受头衔。共和党对此表示支持，但这必然会激起贵族们的不安：\n——“1.贵族头衔不由国家授予。”\n——“2.任何公民不得接受任何贵族或荣誉称号，除非事先得到政府的批准。”\n\n第二种方案则得到了阿尔斯特统一党的支持，即承认公民的现有头衔：\n——“国家应承认公民所拥有的任何现有头衔”\n\n另一种方案是对先前英王授予的头衔不加认可，让国家当局授予属于自己的头衔。这无异于给了保王派一记耳光，但陆军同志协会似乎也对此表示支持：\n——“国家有授予优秀公民特殊勋章的权力”\n\n新芬党提出了一个折衷的、综合了以上两项条款的方案，那便是承认现有头衔，也允许设立新的头衔。\n\n此外，由于我们同英王达成了有限的和解，一些政治家和贵族提出了重设“最杰出的圣帕特里克勋章”的想法。该勋位是与1783年应当时的爱尔兰中尉勋爵的请求、以嘉德勋章为范本创设的。一些骑士与军官仍是这一勋章的得主，如第九任沙夫茨伯里伯爵安东尼·阿什利-库珀，但自爱尔兰独立以来，该勋位一直处于休眠状态。"
 ire.2606.a:0 "要什么头衔，全废了！"
 ire.2606.b:0 "承认现有头衔"
 ire.2606.c:0 "设置我们自己的非世袭性头衔"
 ire.2606.e:0 "承认现有头衔，并设置我们自己的非世袭性头衔"
 ire.2606.f:0 "重设圣帕特里克勋章！"
 ire.2607.t:0 "宪法定稿"
 ire.2607.d:0 "起草宪法的过程已经结束，剩下的就是全民公决了，考虑到人们对新爱尔兰的渴望，全民公决这关是肯定能过的。\n\n既然国内政治中的诸多分裂因素已经得到解决，真正的重建与和解便可就此起步了。"
 ire.2607.a:0 "愿正道与吾同在！"
 ire.2505.t:0 "新总统"
 ire.2505.d.start:0 "总统一职每七年由选民直接选举产生。只要得到足够的众议院或地方机构成员的提名，任何35岁以上的爱尔兰公民均有成为总统候选人之资格。"
 ire.2505.d.body:0 "在选出这一崭新角色的第一位执掌者前共同提名一位候选人，这个候选人尤其需要得到各个政治派别的广泛认可，和通常的即时淘汰投票相比有过之而无不及。\n\n总统主要扮演着礼仪性的、非政治性的角色。身为国家元首，作为第一公民的元首将在外交场合代表国家，接待外国政要。无论如何，总统还掌握着在众议院任期结束时将其解散的权力，亦需依照总理——也就是[ROOT.GetLeader]即将担任的职务——的建议指任委派众议院议员担任政府各部部长。\n\n各党一致同意，总统一职应由具备相当文化洞察力、可代表全体人民观念与价值观之人担任。他还应当在其一生中获得过重大荣誉，亦需拥有与该职相称的个人履历。\n\n无论最后被选中的是谁，那人都不太可能拒绝这一邀请，所以现在也就剩提名的步骤了。"
 ire.2505.d1:0 "根据新宪法，$ire.2505.d.start$\n\n为了给新宪法争取支持，所有党派一致同意$ire.2505.d.body$"
 ire.2505.d2:0 "根据现行宪法，$ire.2505.d.start$\n\n第三国际既已于欧陆落败，柯林斯便渴望为总统的宪法角色争取支持，亦热衷于在战后达成新的民主共识。他建议各党一致同意$ire.2505.d.body$"
 ire.2505.a:0 "厄尼·奥马利"
 ire.2505.a.tt.base:0 "§Y厄尼·奥马利§!，独立战争革命者与当红作家"
 ire.2505.a.tt:0 "提名$ire.2505.a.tt.base$"
 ire.2505.b:0 "凯瑟琳·克拉克"
 ire.2505.b.tt.base:0 "§Y凯瑟琳·克拉克§!，1916年起义领袖的遗孀，共和派的象征"
 ire.2505.b.tt:0 "提名$ire.2505.b.tt.base$"
 ire.2505.c:0 "道格拉斯·海德"
 ire.2505.c.tt.base:0 "§Y道格拉斯·海德§!，著名的爱尔兰语学者，盖尔联盟的创始人"
 ire.2505.c.tt:0 "提名$ire.2505.c.tt.base$"
 ire.2505.e:0 "厄斯金·奇尔德斯"
 ire.2505.e.tt.base:0 "§Y厄斯金·奇尔德斯§!，杰出的英裔爱尔兰小说家、条约磋商者和海军顾问"
 ire.2505.e.tt:0 "提名$ire.2505.e.tt.base$"
 ire.2506.t:0 "[GetYear]年总统大选"
 ire.2506.d1:0 "今天，爱尔兰人民有权自由选举他们未来七年的国家元首。总统主要扮演着非政治性和仪式性的角色，他们由选民通过即时决选直接选出。\n\n这一选举制度及其作用对那些民望颇丰的候选人更为有利，而非那些支持者狂热不已但数量有限的候选人。\n\n许多候选人都在竞选总统一职，他们也都获得了足额的众议院议员和郡议会成员的提名，但最终花落谁家，还需交由选民决定。"
 ire.2506.d2:0 "在正常情况下，今天正是举行总统选举的日子。但眼下情况却是个例外：柯林斯已缔结战时联盟，选举将被推迟到战胜第三国际之后。\n\n总统理应扮演团结全国上下的崭新角色，但在战争时期，对现行制度进行大刀阔斧的变革实在无益于团结，亦与总统新角色的目标背道而驰。在战争结束、选出新总统，令其担任先前设想的礼仪性角色前，柯林斯仍将留任国家元首一职。"
 ire.2506.a:0 "厄尼·奥马利"
 ire.2506.a.tt:0 "选择$ire.2505.a.tt.base$"
 ire.2506.b:0 "凯瑟琳·克拉克"
 ire.2506.b.tt:0 "选择$ire.2505.b.tt.base$"
 ire.2506.c:0 "道格拉斯·海德"
 ire.2506.c.tt:0 "选择$ire.2505.c.tt.base$"
 ire.2506.e:0 "厄斯金·奇尔德斯"
 ire.2506.e.tt:0 "选择$ire.2505.f.tt.base$"
 ire.2506.f:0 "就这样吧"
 ire.2507.t:0 "总统的回应"
 ire.2507.d:0 "根据宪法规定，总统是非政治性的，不得就任何选举的具体结果发表任何公开声明。虽然改组工党在选举中爆冷胜选，但[IRE.GetLeader]依旧明智地选择了遵循官方规定。\n\n虽然总统的助手私下里察觉到了总统对此事的震惊，但在公开场合中，[IRE.GetLeader]只谈及了政府对维持议会程序与法治的承诺。\n\n肩负凝聚人心之任的总统一职确也发挥了其作用，新政权的支持者认为总统的表态让他们的政府更为名正言顺，而那些没有投票给改组工党的人则认为总统更能代表他们自己的观点。"
 ire.2507.a:0 "体制运作良好"
 IRE_social_liberal_party2:0 "土地子民"
 IRE_social_liberal_party2_long:0 "土地子民(Clann na Talmhan)"
 IRE_second_election_over: "§Y1942年大选已举行§!"
 IRE_taoiseach_is_leader:0 "§Y总理§!手握国政大权"
 IRE_RLP_Victory:0 "§N改组工党§!赢得选举"
 IRE_CCN_Victory:0 "§P国家统合党§!赢得选举"
 IRE_Labour_Victory_Flag:0 "§R工党§!赢得选举"
 IRE_is_not_monarchy: "爱尔兰§R不是§!君主制"
 IRE_landlordism_decay: "地主制度的衰亡"
 IRE_landlordism_decay_desc: "通过逐步增加对地产租赁的规定和增加租户的权利，许多从前的地主被迫退出了市场。尽管如此，这种现象尚未完全消除，有相当多的人仍然在冒着被监管惩处的危险在私下里出租地产。"
 IRE_road_modernisation: "道路现代化"
 IRE_road_modernisation_desc: "从历史上看，爱尔兰的许多道路只不过是简单的碎石路，极大地阻碍了国家的发展潜力。为了解决这个问题，爱尔兰政府对本国的许多主要道路和城市街道进行了大规模的现代化改造。借由将这些道路重新铺设成柏油碎石和沥青路，政府希望能以此满足一个现代化国家及其公民的需求。"
 IRE_rural_infrastructure: "农村基础设施建设"
 IRE_rural_infrastructure_desc: "爱尔兰数不清的乡村公路向来是连接全国众多村庄和农场的大动脉，几个世纪以来一直维持着爱尔兰的繁荣。但这些道路大多只是踩踏而成的土路，因此，爱尔兰政府开始了一项规模浩大的工程，帮助建设许多人赖以生存的农村基础设施。"
 IRE_reinforce_the_gaeltachtai: "推动盖尔化"
 IRE_reinforce_the_gaeltachtai_desc: "爱尔兰政府制定了一系列无所不包的政策，旨在促进国内爱尔兰语区的发展扩大。负责制定这一计划的人希望，在爱尔兰语区的经济贡献同国民经济的各个部分紧密结合后，对经济增长的进一步投资能加速促进爱尔兰语在全国范围内的传播。"
 IRE_second_election: "1942年大选"
 IRE_second_election_desc: "爱尔兰的民主在重重阻碍之下仍然屹立，但哗哗作响的投票箱仍然在等待决选出为这一切做出贡献的政府。人们将选出谁将下一届爱尔兰众议院带领他们，投票日到来之前，一切皆未成定数。"
 IRE_later_plp: "票箱里头出革命"
 IRE_later_plp_desc: "鲜有人认为真正的社会主义能在选票政治中脱颖而出，他们常常把政府的压迫与反动派能轻易地操纵普通选民当成论据。但在改组工党胜选后，怀疑者的观点也就不攻自破了，现在，是该让爱尔兰走向它命中注定的社会主义未来了。"
 IRE_coop_farming: "合作制农业"
 IRE_coop_farming_desc: "直到今天，这个国家的农场仍然以一种古老的、近乎封建的方式经营，这对爱尔兰和爱尔兰人民都是有百害无一利的。为了清除这些过往遗迹，我们应该鼓励爱尔兰的农民联合起来，共同经营他们的农场，以期提高其效率，消灭一切寄生于他们劳动成果之上的资本主义中间商。"
 IRE_nationalise_church_institutions: "教会机构国有化"
 IRE_nationalise_church_institutions_desc: "当我国的穷苦人民受苦受难时，神职人员却袖手旁观，他们还在各个政府机关中扎下了根，是可忍孰不可忍。我们要将这些机构国有化，并将它们交还给真正属于它们的爱尔兰人民。"
 IRE_decay_of_landlordism: "地主制度的衰亡"
 IRE_decay_of_landlordism_desc: "社会主义虽在爱尔兰发展势头可喜，但仍有许多人为地主所有制辩护，认为“一个人的租金就是另一个人的收入”。虽然彻底取缔这一制度并没收地主所有的土地的激进举措看上去很是诱人，但一种更温和的方式，亦即逐步增加监管力度，更能让选民接受一些。"
 IRE_widow_pensions: "保护被遗忘之人"
 IRE_widow_pensions_desc: "爱尔兰社会之中到处是被遗忘之人，大多还是刻意为之。悲伤的寡妇、失怙的孤儿、痛苦的老兵，历届爱尔兰政府都把他们抛诸脑后。我们现在将出台保护这些社会弱势群体的法律，为他们提供家庭养老金和额外的护理福利，希望终有一天，这能成为我们最难为人忘却的成就。"
 IRE_red_future: "赤色未来"
 IRE_red_future_desc: "多年来，绿色的旗帜一直飘扬在都柏林堡之上，外族侵略者已被击退，但直到现在，爱尔兰才真正地摆脱了持续存在的不平等。爱尔兰虽尚未完全成为康诺利设想中的社会主义共和国，但对许多人来说，事实再清楚不过了，爱尔兰已坚定地走上了社会主义道路，并将勉力建设一个赤色的未来。"
 IRE_later_labour: "劳工之永恒进军"
 IRE_later_labour_desc: "在再次获得人民的信任后，工党现应集中精力推行各类在解决“黑色星期一”时屈居次位的政策。借助广泛的社会与经济改革，爱尔兰人民的生活有望得到极大的改善，和平长入社会主义的道路也能接着走下去。"
 IRE_collaborate_with_ITUC: "与爱尔兰工会大会合作"
 IRE_collaborate_with_ITUC_desc: "虽然部分爱尔兰工会大会成员抛弃了工党，转而支持社会主义反对派中更激进的一派，但它与工党之间依旧是藕断丝连。藉由与爱尔兰工会大会中不那么激进的成员合作，为他们帮扶爱尔兰工人的计划撑腰站台，我们可以提高国家的工业能力，进而使整个国家繁荣昌盛。"
 IRE_state_education: "国家教育"
 IRE_state_education_desc: "几个世纪以来，爱尔兰儿童教育的任务一直由他们的父母或当地神父和修女承担，但效果并不尽如人意。为了确保年轻一代接受现代教育，我们必须将这项义务从教士手中收回，交由国家负责，以为全国的孩子提供来自世俗教师的免费教育。"
 IRE_industrial_development: "促进产业发展"
 IRE_industrial_development_desc: "发展新工业始终是确保爱尔兰人民就业的可靠方式，若是政府也参与其中，就业的公平性也就有了保障。通过优先发展新兴且发展迅速的行业，我们应当能创造出更为持久的就业机会，使之经受住时间的考验。"
 IRE_modern_roads_modern_nation: "现代道路，现代国家"
 IRE_modern_roads_modern_nation_desc: "如今，爱尔兰人一生中大部分时间都在两个地方度过，一个是床上，一个是上下班的路上。话虽如此，虽然它在爱尔兰社会中扮演着如此重要的作用，但我国的许多道路仍是未铺设沥青的碎石路，而世界上其他地方都用上柏油沥青大马路了。我们得尽快解决这个问题，对我国过时的道路进行迅速的现代化改造，这可是经济上的头等大事。"
 IRE_later_sf: "史书中的新芬党一页"
 IRE_later_sf_desc: "现代新芬党的故事相当跌宕起伏。从爱尔兰独立运动的巨头，到20年代的濒临崩溃，再到工党垮台后的惊天逆转，没人能说新芬党的历史无聊。如今，新芬党更像是一个缝合怪运动：其中包括已不复存在的工党的忠实拥趸，左翼新芬党人，以及无视一切变化、始终对党忠诚的右翼新芬党人。既然又一次赢得了爱尔兰人民的信任，新芬党便可放开手脚，实践其计划中的左翼爱尔兰民族主义政策。"
 IRE_christian_socialist_compromise: "基督教社会主义之妥协"
 IRE_christian_socialist_compromise_desc: "新芬党与教会的关系很是复杂。尽管大部分移居海外的工党更倾向建立一个极为世俗的爱尔兰国家，但大多数新芬党的忠实拥护者仍然对爱尔兰的天主教会心存好感。特别是卡哈尔·布鲁阿，他绝不会允许任何政策威胁到敬畏上帝的爱尔兰人。考虑到这一点，新芬党政府决定妥协折衷，既强调宣扬耶稣基督的教义，同时也致力于建设一个强大而世俗的爱尔兰国家。"
 IRE_later_cnat: "农村事业"
 IRE_later_cnat_desc: "[GetIreAgrarianParty]在联合政府中所扮演的角色给选民留下了印象，他们也借此成了政府中的第一大党。既然国家的大多数经济问题都已得到了解决，那如今便是土地子民将执政重心转向落实其竞选承诺、大力发展农村农业的最佳时机。"
 IRE_drain_boglands: "排干沼泽"
 IRE_drain_boglands_desc: "对于任何政府来说，开发新农田都应当是头等大事，而在爱尔兰，许多大面积的沼泽地是开辟这些新农场的理想场所。通过努力排干这些沼泽，开垦它们所在的土地，我们可以创造出大量适合种植作物和放牧的土地。"
 IRE_sustainable_forestry: "可持续林业"
 IRE_sustainable_forestry_desc: "温带雨林曾遍布欧洲的大部分地区，而爱尔兰则是如今欧洲为数不多的几个依旧拥有美丽的温带雨林的地方之一。话虽如此，几个世纪以来的森林砍伐已耗尽了我国的大部分林业资源，倘若再不采取行动，那就只有绝种一条路了。为了防止此类情况的发生，我们应该向从事可持续林业和植树造林、保护现有森林和种植新森林的伐木公司发放补贴。"
 IRE_minerals_development_act: "[GetYear]年矿产开发法案"
 IRE_minerals_development_act_desc: "我国的沃土之下蕴藏着许多未经开采的宝藏，这必然能极大地促进我国的经济增长，我们应当以深思熟虑的方式对其进行利用。我们应为此通过一项法案，矿山应如何经营、政府租契应如何发放以及有关矿物开采和随后的加工作业必须处理的所有其他细节搭建明确的法律框架。"
 IRE_paving_boreens: "铺设乡道"
 IRE_paving_boreens_desc: "简陋的乡村公路虽然是连接分散在全国各地的许多村庄与农场的动脉，但充其量只不过是走的人多了也便成了路。借助推行以农村为重的基础设施法案，我们可以帮助确保这些道路在一段时间内得到适当的铺设，并让其经久耐用。"
 IRE_progressive_land_rates: "土地累进税"
 IRE_progressive_land_rates_desc: "倘若有人询问全国各地的农民，在他们的工作中，什么是最难处理的事情，苛刻的土地税肯定是最常见的答案之一。通过对土地税率制度进行累进制的改革，我们可以减轻普通农民的负担，帮助我们赢得民心，并让国内激进分子提出的替代方案相形见绌。"
 IRE_golden_moderation: "中道为上"
 IRE_golden_moderation_desc: "在生活之中，恪守中道方为上上善道，爱尔兰的政治便为鲜明例证。我们抛弃了拉金和奥达菲等人所倡导的极端主义，为国家开辟了一个稳定的未来，摆脱了困扰世上极端主义政权的一系列麻烦。虽前路漫漫永无止境，但我们温和领导所取得的成就必将载入爱尔兰史册。"
 IRE_later_fg: "直线近道"
 IRE_later_fg_desc: "鲜有政党能在执政八年之后继续执政，但似乎统一党在过去几年里的伟大复兴不仅能让他们在选举中再次获胜，还能让他们赢得更多的选票。人们虽对这一任期寄予厚望，但说到底不过一切照旧，不过，爱尔兰公众认为这就是当今混乱世界所需要的。"
 IRE_father_of_republic: "国父"
 IRE_father_of_republic_desc: "在人们眼中，沃尔夫·托恩是爱尔兰共和主义的创始人，帕特里克·皮尔斯则是爱尔兰共和主义的复兴者，但要是没有伟大的亚瑟·格里菲斯，现代爱尔兰国家能不能存在都是个问题。这位爱尔兰英雄对国家的影响常常被低估，为了让他得到国民的认可，政府应当带头纪念他的成就。"
 IRE_international_port_belfast: "贝尔法斯特国际港"
 IRE_international_port_belfast_desc: "当大英帝国崩溃，爱尔兰实现统一时，贝尔法斯特和它的大造船商们遭受了极大的打击。危局之中，哈兰和沃尔夫等公司几乎全盘向商业运作转型，从而为贝尔法斯特在全球商界打出了名声。对造船商来说，现在也算是个好时代，贝尔法斯特已巩固了自己作为最重要的商业港口之一的地位，在政府的支持下，它可能很快就会超越其他所有港口。"
 IRE_sidestep_church: "回避教会"
 IRE_sidestep_church_desc: "当然，很少有人愿意直接挑战教会在爱尔兰社会中所扮演的重要角色。但与此同时，若是教会在某些地方不去抛头露面，那显然对教会本身和政府都有利。借助微妙的责任转移，我们能让本该归属政府的职责归属政府，让神职人员不再为俗事所扰。"
 IRE_adopt_bismarck_model: "采用俾斯麦模式"
 IRE_adopt_bismarck_model_desc: "奥托·冯·俾斯麦的一大成就便是建立了医保制度，从此数百万原本未能享受到医疗保障的德国人获得了医疗服务，最激进的社会主义者也失却了一大拉拢人心的手段。德国人既已珠玉在前，我们便自当为爱尔兰及其人民引入类似的医疗体系。"
 IRE_eternal_vigilance_of_big_mick: "大块头戒心永存"
 IRE_eternal_vigilance_of_big_mick_desc: "自从爱尔兰获得自由以来，始终有一个人，或居于高位，或守于幕后，始终不离不弃地带领着它度过了风风雨雨。不管人们是把他叫做爱尔兰的建筑师、无能暴君，还是大块头，所有人都清楚，爱尔兰民族的未来将永远与迈克尔·柯林斯的遗产不可逆转地联系在一起。"
 IRE_representative_national_government: "代议制国民政府"
 IRE_representative_national_government_desc: "1916年，为了保卫全体人民的自由，爱尔兰的烈士们许下了建立永久国民政府的宏伟承诺，“代表全体爱尔兰人民，由全体男女选民选举产生”。近年来人民之自由虽有所减少，但共和党新领导层如今将挺身而出，一劳永逸地保障先烈所承诺的、不可改变的权利。"
 IRE_international_port: "贝尔法斯特国际港"
 IRE_international_port_desc: "自从英国旧秩序崩溃以来，贝尔法斯特便逐渐成为世界上最重要的造船港口之一。贝尔法斯特的造船厂已经为无数的国家与集团提供了船舶建造和维修服务，在政府的支持之下，贝尔法斯特的造船厂得到了显著的发展，许多人开始将贝尔法斯特视为世界上最重要的港口之一。"
 IRE_later_lemass: "大众之公平施政"
 IRE_later_lemass_desc: "选举结果显而易见，肖恩·勒马斯及其共和党“自由派”成了众议院内的第一大党。由于爱尔兰公众大多将过去几年的经济发展归功于共和党以及以金融增长改善所有爱尔兰人生活的运动，共和党似乎要接着让爱尔兰民族感受到资本主义的切身震撼。"
 IRE_international_investment_hub: "国际投资中心"
 IRE_international_investment_hub_desc: "由于许多投资者仍被“黑色星期一”和美国冲突的余波所震慑，我们有充足的机会填补由此留下的空白。借助与外国企业进行谈判，并进行宣传都柏林是国际商业稳定之家的外交宣传活动，我们兴许有一天能看到这座古朴的小城市成为真正的全球金融之都。"
 IRE_villages_to_towns: "从乡村到城镇"
 IRE_villages_to_towns_desc: "爱尔兰的各大城市虽在经济中发挥着至关重要的作用，但我们不能只靠几座城市支撑经济增长，否则就得咽下停滞的苦果。与之相反，政府的政策应该以支持全国前途远大的农村地区的发展为基础，把各式各样的小定居点建设成为发展良好、体面美丽、能够开展适当的商业活动的城镇。"
 IRE_nation_two_peoples: "二族之国"
 IRE_nation_two_peoples_desc: "与其他国家一样，爱尔兰并非完美无缺，她也存在着许多缺陷。其中最为严重的缺陷，便是许多人将他们的英裔爱尔兰人与阿尔斯特苏格兰人同胞打为外来入侵者，但事实上他们中的许多人一直以来都将我们的岛屿视为他们唯一的家园。政府是时候正式承认他们为我们的骨肉同胞，一改对他们的这种认知偏差了。"
 IRE_educated_workforce: "受教育的劳动力队伍"
 IRE_educated_workforce_desc: "投资教育是促进经济增长的最有力手段之一，却常被鼠目寸光之人所忽视。我们将为全国每个孩子提供免费的中学教育，进而让未来的劳动力能得心应手地解决一切问题。"
 IRE_noble_middle_class: "光荣的中产阶级"
 IRE_noble_middle_class_desc: "封建精英束缚掌控农民的时代已一去不复返了，在我们这个现代国家里，一切勤劳奋斗的男男女女都会获得应有的回报，让自己和家人能安居乐业。我国最努力的工人们已成为了我国强大的中间阶级的一部分，他们理应成为全体爱尔兰公民的榜样。"
 IRE_global_centre_finance: "崭新的全球金融中心"
 IRE_global_centre_finance_desc: "与德国、奥地利甚至日本等世界经济巨头相比，爱尔兰一直是望尘莫及，也基本没什么人对它抱有期望。然而，凭借着强大的经济愿景与精心策划的政府手段，在共和党的指导下，爱尔兰已逐渐成为能在金融领域同上述大国一较高下的国家。"
 IRE_anglo_irish_heritage: "英爱遗产"
 IRE_anglo_irish_heritage_desc: "几个世纪以来，爱尔兰，尤其是阿尔斯特，一直是爱尔兰人和英国人共同的家乡。虽然对大多数爱尔兰人来说，爱尔兰首先是爱尔兰人民的家园，但爱尔兰政府已经开展了一场改变这种看法的运动。运动重点是宣传北爱地区两大族群的共同历史与文化遗产，政府希望，在时过境迁后，大家都能将彼此看做自己的手足同胞。"
 IRE_later_ff_valera: "依主之所愿生活"
 IRE_later_ff_valera_desc: "瓦莱拉所属的共和党以呼吁继续社会改革的竞选口号赢得了众议院的多数席位。既然国家的大多数经济问题得到了解决，那如今似乎就是共和党将执政重心转向落实其承诺的基督教且保守的社会政策的最佳时机。"
 IRE_social_welfare_schemes: "社会福利计划"
 IRE_social_welfare_schemes_desc: "许多沉迷现代政治的人常常忘记，关心照顾受压迫者并不是社会主义的专利，其内核反倒是彻底纯粹的基督教政策。因此，为了让我们的同胞渡过难关，增发失业保险和儿童保育津贴应该成为政府的政策、"
 IRE_arrows_adversity: "摆脱逆境"
 IRE_arrows_adversity_desc: "既然共和党已稳掌权位，那政府是该制定回击国家之敌的政策了。爱尔兰必须远离反民主的独裁统治，远离社会主义国家的专制宪法，远离那些希望大发国难财的腐败政客。只有摆脱这些灾祸，爱尔兰才能真正地走向繁荣。"
 IRE_people_tradition_faith: "传统而虔信之族"
 IRE_people_tradition_faith_desc: "自从天主教传入爱尔兰，天主教信仰便成为了爱尔兰身份认同的最强大支柱之一，教会本身在我们的社会中亦发挥了极为重要、不可替代的作用。然而，教会能为国家做的事还不止于此，为了国家的利益，我们必须让教会担负起更多与其特权地位相应的责任。"
 IRE_rights_family: "立法保障家庭权利"
 IRE_rights_family_desc: "世上许多人对成功的定义实在扭曲，他们被世俗蒙蔽了双眼，只关注世俗的财富或社会地位。生活中最真实的成功却常常被人忽视，那就是组建并繁育一个虔诚的大家庭。政府应当把帮助人民实现这种快乐当作头等要事，而将家庭的神圣权利写入法律则是实现这一目标的重要一步。"
 IRE_nation_small_farmers: "小农之国"
 IRE_nation_small_farmers_desc: "爱尔兰身份认同的根本在于农场，在于普通盖尔人手中的、为自己和社区提供食物的农场。大规模的城市化与工业化让许多农民在经济上处于落后地位。政府应对其提供充分的帮扶，令其能够延续他们美好的传统生活方式。"
 IRE_ireland_we_dream_of: "梦想之中的爱尔兰"
 IRE_ireland_we_dream_of_desc: "正如历代先辈们所做的那样，共和党一直在努力创造人们能依照上帝希望的方式生活着的爱尔兰。该党矢志不渝地奋力巩固国家的基督教精神与灵魂，使其人民摆脱苦难，保护我们的珍视之物。虽前路漫漫永无止境，但很明显，爱尔兰现在正回到通往美好未来的正确道路上。"
 IRE_later_an: "真正的盖尔人之声"
 IRE_later_an_desc: "陆军同志协会的议会分部，也就是人们熟知的国家统合党，通过他人所不敢言的宣传口号成功地从一个无名小卒飞升为第一大党。虽然大多数人预计新政府不会像国家统合党中的极端弃权派那般激进，但显而易见，国家正走在十足的传统主义道路上，民主制度的崩坍为期不远了。"
 IRE_gaelic_state: "爱尔兰国"
 IRE_gaelic_state_desc: "盖尔人的身份认同是爱尔兰民族的核心，尽管外国统治者使尽浑身解数，但仍有些人将我们美好的文化保留到了今天。帮助爱尔兰语使用者、增加对传播爱尔兰语措施的资助，对于保持我们的民族文化身份认同并将其传播到全国各地至关重要，新政府理应将其作为头等大事来抓。"
 IRE_pious_republic: "虔诚共和国"
 IRE_pious_republic_desc: "天主教是我国的唯一正信，前几届政府承认外来宗教的行为极大地玷污了我国的文化遗产。在完全控制政府机构的基础上，我们现在有能力正式承认天主教作为我们人民的唯一信仰的、不可改变的地位，并助力它再度在爱尔兰社会中传播开来。"
 IRE_managed_democracy: "管理式民主"
 IRE_managed_democracy_desc: "尽管合理的民主制度确实对国家有益，但允许那群妄图摧毁我们祖国的人参加选举，只会导致国家走向衰落与毁灭。就像一棵树得不到适当修剪就会生病一样，选举制度亦是如此。为了防止这一切演变为现实，我们必须禁止那些激进的破坏分子参与未来的任何选举，不论是地方层面还是国家层面。"
 IRE_republic_free_from_chaos: "摆脱混乱的共和国"
 IRE_republic_free_from_chaos_desc: "国家统合党的政策虽五花八门，但却有一核心原则贯彻于中——秩序。倘若有何词现今回荡全国，那也是秩序一词。一个摆脱了不和民主的秩序，一个摆脱了万恶异端的秩序，一个摆脱了政府口中的诸类罪恶的、秩序井然的共和国。"
 ire.18.f:0 "工党赢得多数！"
 ire.18.g:0 "奥达菲意外得胜！"
 ire.18.h:0 "改组工党成功组阁！"
 ire.398.t:0 "民族中央党瓦解"
 ire.398.d:0 "爱尔兰最具影响力的农业团体——民族中央党，自1937年选举失利后便一蹶不振。这一脱胎于丹尼斯·戈里、帕特里克·巴克斯特、迈克尔·赫弗南的农民党等农业团体的政治力量，原本是要整合各自为战、政治前途渺茫的各股农业势力，如今却因昔日盟友纷纷转向自保而面临分崩离析。1937年那低迷的得票率，直接把民族中央党打入了深渊苟延残喘，虽然麦克德莫特坚持不与统一党合流，但党内的大家伙儿都明白，唯有融入其它更大的政治势力，党未来才有可能继续在爱尔兰发光发热。\n\n民族中央党瓦解的灰烬之下，代表了爱尔兰乡村农民利益的前民族农业党摇身一变，以“土地子民”之名悄然崛起。土地子民的领头人是颇具争议的迈克尔·唐纳伦及其同僚约瑟夫·布洛威克，前者出身戈尔韦的农间田地，曾先后加入共和党和新芬党，如今以反建制左翼的姿态重出政坛，把小农问题当成自己的口头禅，频频用反犹、反精英的言论搪塞爱尔兰农民面临的诸多问题，后者是梅奥郡一位小有名气的农场主，其家的三个兄弟都与天主教会关系密切。土地子民吸纳了拒绝加入统一党的民族中央党议员、农民党的前成员，以及因“土地税率改革将加剧非直接税收的负担”而分裂的小农群体，以唐纳伦的社会民主、民粹与传统农业理念的混合载体，以废除超额地租、林地复育、大型低效农地的再分配等政策为初期重点工作，把农业运动从遭民族中央党亲手扼杀的中右翼带到了中左翼，并且成为了许多绝望的爱尔兰农民眼中重振国内农业政治的最后希望。爱尔兰的农业政治能否因该党的出现而走上转折之路仍然是个未知数，所以，就让我们静候唐纳伦一行的消息吧。"
 ire.398.a:0 "就这样吧"
 ire.399.t:0 "爱尔兰共和党的最终命运"
 ire.399.d:0 "1937年大选对共和党来说本应是天赐良机，他们本可以利用人们对执政十几年之久的统一党政府的不满情绪。但与之相反，可以肯定地说，埃蒙·德·瓦莱拉浪费了这个机会。瓦莱拉一心只想对民望颇高的柯林斯进行纯粹人身攻击，但又未能让人们视他为爱尔兰的领袖。从柯林斯担任新芬党领袖时被驱逐出党，再到爱尔兰政坛两巨头之间的恩怨纠葛，看来瓦莱拉对“大块头”的敌视怨恨只能对共和党的胜选造成负面影响。有鉴于此，许多人考虑剥夺瓦莱拉的党魁地位，用肖恩·勒马斯取而代之，他是个更“自由派”的候选人，一心关注爱尔兰经济的可持续性。瓦莱拉本人当然是不愿乖乖就擒的，还夸下海口称“1942年必是共和党之年”。话虽如此，民意调查的结果却表明共和党这样下去只有死路一条，哪怕是瓦莱拉的死忠也无法否认如今唯有撤换方可破局。"
 ire.399.a:0 "还有得赢呢，再等等！"
 ire.399.b:0 "是该让瓦莱拉滚蛋了"
 ire.401.t:0 "事业与梦想"
 ire.401.d:0 "爱尔兰本是一个以武装革命手段登上世界舞台的国家，却又能通过和平手段为其人民实现有意义的变革，对那些鼠目寸光，一心以为暴力只会产生暴力的人来说，这无异于天方夜谭。但如今，在[IRE.GetLeader]的领导之下，左派大联盟不仅通过选举手段获得了权力，更牢牢地抓住了爱尔兰人民的心。爱尔兰民族正大步迈向赤色未来，其所倚仗的并非步枪，而是橄榄枝。\n\n哪怕对那些思想开明之人来说，过去几年来的一件件大事依旧令人难以置信。当奥布赖恩与希伊-斯凯芬顿愤而决裂，工党一分为二之时，鲜有人能设想这俩人能摈弃分歧、携起手来，继而引领爱尔兰走向未来。但现在，红色联盟已上台执政数年，亦经历了一个个多事之秋，再无人能质疑工党两派所秉持着的改革派方法所取得的成果。\n\n当然，胸怀成见之人依旧存在，其中有依旧坚信“激进派政权”会在面临下一桩难事时土崩瓦解的右翼人士，也有那些拒不承认能在不经历革命的情况下仅凭简单的改革手段便可建立社会主义制度的左翼人士。不管他们如何百般否认，爱尔兰人民的呼声依旧清晰可闻，他们既不想要暴力革命，也不想要保守停滞，他们要的是渐进而和平的过渡。爱尔兰的未来决不是抱残守缺、顾影自怜，而是自由进步之康庄大道。倘若爱尔兰注定要走向赤色的未来，那它的缔造者也必是由犁头开路、心怀梦想而非刀剑傍身的人民。"
 ire.401.a:0 "劳工之事业便是爱尔兰之事业"
 ire.402.t:0 "生活与大地"
 ire.402.d:0 "日常生活琐碎忙乱，鲜有人能停下脚步，静下心来欣赏周遭的世界。就算是有这么个机会，大部分人也只会嘲笑此举的庸碌无为，转头便去忙着他们眼中的正经事了。话虽如此，对[IRE.GetLeader]及其大部分政府官员来说，爱尔兰的心脏便蕴于这片大地之下，若不静心感知，便是失却了爱尔兰生活方式的真谛。\n\n从利特里姆最不起眼的村庄，到都柏林繁华喧闹的市中心，这片沃土都是我们世世代代祖祖辈辈自豪地称之为家乡的地方。无论是收获一年到头收成的农民，还是在上班路上腾出闲暇享受大自然的会计师，甚至于一对在戈尔韦湾欣赏日落的年轻夫妇，爱尔兰对其子民的慷慨恩惠都深深地影响了他们的生活。最后，也正是这些大自然的馈赠，还有人们为此感到欢欣愉悦的一个个瞬间，让生命真正地拥有了意义。\n\n正是为了这个目的，也为了满足尘世之间的这点基本需求，政府终将其愿景化为现实。爱尔兰的工人们再也不用担心要从黎明工作到深夜了，现在，他们能在工作之余抽出大把的时间同家人一起享受生活，而这本该是每个人应有的权利。农民们也不必担心一觉醒来却发现熟悉的乡村生活方式天翻地覆大变样了，与之相反，他们多半会为政府对爱尔兰乡村地带的支持充满信心。哪怕是那些曾一度深陷贫困深渊，在社会之中最为弱小脆弱的人们，在明白福利制度能够帮助其走出困境后，也能放下心抬起头来做人了。\n\n最重要的是，当每个人，无论其社会地位如何，都能无忧无虑地生活着的时候，还有什么比欣赏这座使我们得以成人的岛屿上的美景更好的事呢？"
 ire.402.a:0 "安居乐业，此生足矣"
 ire.403.t:0 "为明日而战"
 ire.403.d:0 "生活中总有一个瞬间，能让最坚忍之人也不由得驻足思考当下。对迈克尔·柯林斯来说，这么一个瞬间便来自于众多美国记者之一提出的一个问题：“总统先生，不管怎么说，无数国民都把你和你迄今为止留下的遗产视为信心源泉。当你为国家做出许多重要决定时，你会考虑这对子孙后代的影响么？”\n\n对于一个大半生都活在当下的人来说，柯林斯近来才开始意识到，人们之所以能记住他，是因为他的总统身份，而非因为他是英雄战士或革命烈士。早在及冠之年前，他便已在为爱尔兰的事业而战，哪怕在祖国独立统一后，他也没有停下脚步。他曾辗转于各家各户与黑棕部队对抗，而现在，他要在竞选活动中辗转于两党之间，击败他的政敌。在黑色星期一期间，他勉力支撑了下来，在北方危机期间，也是同样的战斗精神鼓舞勉励着他。\n\n尽管如此，他仍历经千辛万苦而幸存至今，大概是成年以来头一次，他再也没有什么好战斗的了。反对派难以威胁他的地位，民意调查数据也始终保持在令人满意的水平，爱尔兰社会中的极端分子亦被彻底铲除，柯林斯方才惊觉他人生中的这一篇章已然结束。柯林斯成为战士是迫不得已，他希望爱尔兰的下一代领导人不必再成为战士。倘若人们真心尊重柯林斯，那他也希望人们能因他政治家的角色尊重他，而非一名战士。\n\n于是，柯林斯想了一会儿，只是笑了笑，回答说：“确实会吧。”"
 ire.403.a:0 "迈克尔·柯林斯的伟业也许真能载入史册"
 ire.404.t:0 "我等之绿衫"
 ire.404.d:0 "对于都柏林的大多数人来说，[?global.date.GetDateStringNoHourLong]这天的清晨同以往并没有什么不同，只是在阿伯山的军营外多了一小群人。原来，马尔卡希总统正身着一身辨识度极高、一眼就能认出的军装，向面前的这些人（多为当地的驻军）发表一场相当低调的演讲。通常来说，领导人肯定是希望自己所到之处都是轰轰烈烈的大排场，但马尔卡希不同，对他来说，最宝贵的迎接队伍正是那些和自己出身同一营帐的“战火兄弟们”。\n\n“在国内的一些人看来，军与民分属于不同的世界，二者互不相干。然而，纵观我国之自由历史，我们的军队一直就是人民群众，现在如此，未来亦然。就算穿上了这一袭绿衫，我们也依旧属于人民的一份子。这身衣服代表着服务，代表着割舍软弱，走向强大。当三色旗第一次高高飘扬在都柏林城上空时，自由的爱尔兰人民不分什么军与民，我们都是同一个整体。这正是我们的共和国诞生的根基，也是国家长治久安的基础。\n\n当帕德里克·皮尔斯第一次宣告了爱尔兰的独立之时，《宣言》中明确规定了爱尔兰人民享有的权利，以及军事组织在保障这些权利方面的重要角色。在那命定的一天奋战的我并不是单纯的一介军人或国民，而是一名爱尔兰人，一介军人，以及一位国民。因此，为让在座的诸位之祖辈，还有像我一样年事已高的当代人所留下的遗产永世长存，我在此荣幸地宣布，这座意义重大的营地从今以后将以‘皮尔斯营地’为名。”\n\n演讲结束，众人鼓起掌来，声音虽不大，但其中满是敬意，而这种简单的回应正符合马尔卡希这样的人之期望。"
 ire.404.a:0 "马尔卡希真正践行了皮尔斯的奉献精神"
 ire.405.t:0 "机遇之翡翠岛"
 ire.405.d:0 "如果去问政府中的共和党成员，尤其是勒马斯总统本人，用一个词来形容其对爱尔兰的愿景的话，那答案大概率是“机遇”。自共和党首次告捷并在执政联盟中取回其应有位置以来，“机遇”一词变成了党的非正式口号，而如今，其更是成了政府的代名词。\n\n“机遇”一词看似简单，但不同的回答对象在不同的时间给出的解释却又不尽相同。有时，这个词意味着爱尔兰的每个人都可以靠着辛勤与汗水来实现自己的梦想，有时，特别是在旧统一党政府施加的条条框框下，它表明一个人无论出身、背景如何，都可以在这个国家留下自己的印记，而在爱尔兰于世界金融舞台上愈发耀眼的如今，机遇还可以是让整个世界记住你的存在。\n\n不过，若你去问[IRE.GetLeader]的话，那他可能会兴奋地告诉你，这个词包含上述一切，但又不局限于此。对他来说，“机遇”是爱尔兰文化和历史的核心。上至爱尔兰人民决定自己的前途命运，下至个体学生进入三一学院获得良好的教育，机遇存在于爱尔兰社会生活的方方面面。在总统看来，社会进步与经济发展是相辅相成的，其中一者的机遇势必会为另一者带来更多的机遇，而同时推动两者向前正是共和党的一大追求。\n\n最后，就[IRE.GetLeader]个人而言，构成“机遇”这一概念的每一个细节、每一个元素，其实都是在诠释何为真正的爱尔兰人这样一个问题。"
 ire.405.a:0 "水涨船高"
 ire.406.t:0 "语言与爱尔兰民族"
 ire.406.d:0 "自上台起，埃蒙·德·瓦莱拉就是电台广播上的常客，爱尔兰的民众隔三差五就可在上面听到其讲话。虽然这些讲话通常很快就会被公众所淡忘，但今天的这次却稍显不同。无论是因为共和党坚若磐石的政治地位，还是瓦莱拉充满感染力的语气，抑或是演讲本身的高质量，这些话语都实打实地铭刻入了人们的内心深处：\n\n“我们所念念不忘、魂牵梦萦的爱尔兰啊，这里的人民只将物质财富视为美好生活的基石，他们满足于简朴的舒适，将闲暇投身于精神追求。温馨和谐的家园，点缀在绿意盎然的乡间，田野与村落洋溢着勤劳之声，那勤劳欢快的田野与村落，回荡着孩子们无忧无虑的笑声、青年们热血激荡的竞技呼喊，以及少女们如银铃般的欢笑，而在那温暖的炉火旁，老者们则分享着历经岁月的智慧——这里的人们过着上帝所期许的生活。\n\n一千五百年前，圣帕特里克带着爱尔兰的使命来到了我们祖先的面前，他所承诺的，不仅仅是此生的幸福与安宁，更是永生永世的幸福与安宁。为了追寻这样一个爱尔兰的梦想，我们铸就了一个被誉为“圣人与学者之岛”的辉煌国度。正是这样一个爱尔兰的理想——幸福洋溢、活力四射、灵性深邃，点燃了我们诗人心中最炽热的想象；正是这样一个爱尔兰的理想，激发了历代爱国志士的热血情怀，让他们义无反顾地献出自己的生命，只为争取那宗教与政治的自由之光；正是这样一个爱尔兰的理想，将我们这一代以及后世的子孙们紧紧凝聚在了一起，为了自由的火焰永世燃烧，哪怕是献出生命也不会退却。\n\n一百年前，青年爱尔兰人描绘了一个璀璨夺目的爱尔兰愿景，这一愿景直击民众的心与灵，自爱尔兰文明的黄金时代以来，我们的人民还未曾有过如此强烈的情感共鸣。五十年后，盖尔语联盟的缔造者们，以同样的方式点燃了那个时代的人民心中的火焰。再后来，爱尔兰志愿军的英勇领袖们，以及那些为民族解放浴血奋战的勇士们，都传承了这份崇高的精神遗产。到了如今的我们这一代，如果我们依旧满怀热情，就同样有机会接过历史的传承，铸造属于自己的崭新时代。为此，我们要时刻铭记国家光辉未来的蓝图，并将之付诸实践，一步一个脚印地朝着那个未来迈进，而且，我们还要记住，那个美好的未来，一定是我们整个民族共同追寻的终点。”"
 ire.406.a:0 "水涨船高"
 ire.407.t:0 "专制者的众议院"
 ire.407.d:0 "就在短短几年前，建立一个国家统合党政府的想法在人们看来还只是异想天开，对爱尔兰民主可能在一瞬之间化为灰烬的担忧总是在人们的脑海中挥之不去。话虽如此，包括[IRE.GetLeader]在内的许多人，都没能想到国家统合党真能巩固对国家的统治，爱尔兰的民主不仅没有咽下最后一口气，反而在新领导层治下变得更为稳定。\n\n虽然反对派对所谓的“民主倒退”恐慌不已，但当[IRE.GetLeader]指导国家政策时，他并不是万人之上的最高领袖，而是一名要在争吵不休的众议院上发表讲话的国家总统。法律的通过靠的不是上级简简单单的一道命令，政府的提出法案仍然要遵循爱尔兰民主制度下一贯的程序与审查。虽然国家统合党的一些内部人士仍在私底下对被迫与民主制度打交道感到不屑，但党内很多人已开始逐渐适应这种新现状。\n\n话虽如此，我们却也不能把今天的众议院当成昨天的众议院。社会主义者、最具煽动性的民主主义者，甚至一些政府最激进的前盟友，都理所当然地被逐出了政府。爱尔兰人民再也不必忍受一个政治由外国人和共济会成员操纵，而不是由本国人民决定的国家了。他们也不必再担心国际主义与工团主义会分裂破坏他们的家庭了。伟大的爱尔兰共和国亦不必再担心此类颠覆性因素可能带来的混乱了。"
 ire.407.a:0 "秩序乃国家之魂"
 ire.6003.t:0 "纪念格里菲斯"
 ire.6003.d.mc:0 "当谈及爱尔兰独立事业的伟大英雄之时，有一人常常为人忽略，那就是新芬党的创始人亚瑟·格里菲斯。格里菲斯一度是爱尔兰民族主义的实际领军人物，也从根本上推动了解放事业向前迈进，因此其亦常被视作“当代帕内尔”。但和帕内尔一样，格里菲斯亦在一生中郁郁不得志，最后更是英年早逝。正如帕内尔因自身的不当行为淡出公众视线般，爱尔兰解放事业也抛下了格里菲斯，独留他在一旁。他主张废除《联合法案》，亦在奥匈帝国的启发下主张建立二元君主制，但在1916年的一系列事件后，他的主张便失宠了，不过，身为一名永远的实用主义者，在目睹了共和主义的兴起以及民心所向后，他也乐见其政党成为争取独立的工具。比起一位领袖，他更像是一位煽动者，在其逝世前，他曾短暂担任总统一职，并在条约谈判的过程中表现亮眼。\n\n时过境迁，既然帕内尔已跻身历史上最伟大的爱尔兰人的行列，[IRE.GetLeader]也把让格里菲斯同获此殊荣视为自身的责任。今天早上，许多人来到伦斯特议会大楼前，在维多利亚女王的雕像曾矗立之处，[IRE.GetLeader]为一座巨大的格里菲斯雕像揭幕。这座雕塑由利奥·布罗雕刻，他因北方的爱尔兰志愿军纪念碑和帕德里克·皮尔斯半身像两座知名作品闻名于世，大多数人都明白，这就是要让格里菲斯和他们相提并论。在揭幕式后，[IRE.GetLeader]的演讲打消了人们的疑虑。\n\n“当我还只是一个不知前路何方的年轻人时，便已有一人身居万人之上，鼓舞着我和无数青年同辈。亚瑟·格里菲斯是爱尔兰的一大伟人。他身上并无半点狂放不羁，唯有深奥的智慧和对爱尔兰的深刻认识。而当我长大成人，能为同胞服务之时，格里菲斯又成了我的良师益友，直到今天，我仍自豪地领导着他所在的政党。倘若没有格里菲斯的领导与远见，我们这个伟大的国家能不能存在都还是个问题，因此，我们自当永远铭记我等国父留给我们的宝贵遗产。”"
