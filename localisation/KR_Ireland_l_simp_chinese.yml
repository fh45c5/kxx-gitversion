 irelandflavour.421.d4: "10月14日是个大日子——当然，在大多数人眼中并非如此，但对执政联盟中较小政党的领导人，埃蒙·德·瓦莱拉来说，这确实是个好日子。\n\n在六十岁生日的公开庆祝活动上，瓦莱拉收到了一个新鲜出炉的爱尔兰岛形状生日蛋糕——这种蛋糕正配一国领袖身份。\n\n不过，这块蛋糕所带来的乐趣还不只如此，素以禁欲与严肃闻名的瓦莱拉礼貌地拒绝了用刀切开蛋糕的提议。“切开这个岛的感觉太怪了”，他苦笑着说，在某种程度上，这可以被认为是对他反对在独立战争结束时签订的《英爱条约》以及随之而来的分治的微妙回应。\n\n身为副总理，德·瓦莱拉依旧在政府中掌握着相当的影响力，在下次选举中他也有重回万人之上的可能，好事还在后头等着寿星呢。"
 irelandflavour.421.a: "为老大三呼万岁！"
 irelandflavour.1.t: "独立日"
 irelandflavour.1.d: "1916年4月24日星期一，爱尔兰志愿军、爱尔兰公民军和爱尔兰妇女委员会成员占领了都柏林的战略要地，宣布成立自由的爱尔兰共和国。虽兵力与武器远不如英军，但爱尔兰的子民们依旧奋战了六天之久，而后或兵败被俘，或身死敌手。被俘的大多数起义领袖未经审判便被处决，这对爱尔兰政治产生了巨大的影响，也为爱尔兰独立争得了广大民众的支持。\n\n虽然自由的爱尔兰最初并未在政府官方层面上纪念起义，但在英国大革命及其对《英爱条约》产生了一系列影响后，这一状况便发生了变化。如今，爱尔兰政府承认复活节起义是武装争取独立、终结七百年英治的第一场战役。\n\n与此同时，每年4月24日，爱尔兰的各个城镇都会举行独立日的庆祝活动，在帕特里克·皮尔斯曾于此宣布爱尔兰共和国成立的都柏林邮政总局前，总统也会在此发表正式讲话。"
 irelandflavour.1.a: "为了被奴役的土地，噢，光荣的烈士，当你倒在迷雾水珠之中"
 irelandflavour.2.t: "欢迎老朋友"
 irelandflavour.2.d1: "爱尔兰与德国之间的友好关系最早可追溯到世界大战期间，在爱尔兰加入帝国公约后，两国间的友谊也日益深厚。值此复活节再次临近之际，双方决定利用这个纪念日来庆祝爱德两国之间的关系。\n\n在复活节起义前，德国的利巴瓦号伪装成挪威的艾于德号，试图往爱尔兰运送武器，但最终在特拉利被英国人逼得走投无路后被迫自沉。同独立战争期间大量的武器输送相比，这次失败虽显得微不足道，但1916年的这桩大事却依旧被爱尔兰民众牢记于心。\n\n在德国外交界与军界代表出席的情况下，当年“利巴瓦”号的船长卡尔·斯平德勒和幸存的船员们得到了人群的热烈欢迎。这位船长走上都柏林的讲坛，发表了演讲，他表示很骄傲能为爱尔兰争取自由的事业做些贡献，并赞扬了[IRE_loc_country_name]与其祖国间日趋紧密的关系。仪式结束后，斯平德勒获颁一枚纯金奖章，他的船员们则获颁铜质奖章，以此表彰他们的英勇行为。\n\n虽有些人仍在为中立地位的丧失抱怨个不停，但庆祝活动似乎达到了目的，民众的亲德情绪有所升温，爱尔兰人民也能同我们勇敢的盟友团结一道，共同迎击工团主义暴政。"
 irelandflavour.2.d2: "军方支持的新政府常被人指责为德皇治下的傀儡国家，自然不肯放过一切获得正统性的机会，值此复活节再次临近之际，政府决定利用这个纪念日来庆祝爱德两国之间的关系。\n\n在复活节起义前，德国的利巴瓦号伪装成挪威的艾于德号，试图往爱尔兰运送武器，但最终在特拉利被英国人逼得走投无路后被迫自沉。同独立战争期间大量的武器输送相比，这次失败虽显得微不足道，但1916年的这桩大事却依旧被爱尔兰民众牢记于心。\n\n在德国外交界与军界代表出席的情况下，当年“利巴瓦”号的船长卡尔·斯平德勒和幸存的船员们得到了人群的热烈欢迎。这位船长走上都柏林的讲坛，发表了演讲，他表示很骄傲能为爱尔兰争取自由的事业做些贡献，并赞扬了[IRE_loc_country_name]与其祖国间日趋紧密的关系。仪式结束后，斯平德勒获颁一枚纯金奖章，他的船员们则获颁铜质奖章，以此表彰他们的英勇行为。\n\n反对派虽对活动进行了抵制，还声称1916年的烈士们决不愿看到他们的牺牲成了德国傀儡的作秀材料，但庆祝活动似乎也达到了缓解民众对亲德政府不满的目的。"
 irelandflavour.2.a: "上帝与我们同在，因为我们团结一致！"
 irelandflavour.3.t: "重归于好"
 irelandflavour.3.d: "爱尔兰虽曾是协约国的忠诚一员，但她绝无法忘怀她的过去，亦绝无法回避是何事让她成了今天的独立国家。她看不出在缅怀先烈和维持目前的地缘政治联盟之间有何冲突，重要的是，爱尔兰是自愿地选择了目前的盟友，如今亦身为平等伙伴而非仆从附庸与之并肩奋战。\n\n今天，为纪念1916年复活节起义，爱尔兰举行了阅兵仪式。在这场起义中，勇敢的爱尔兰人捍卫了爱尔兰的独立，也捍卫了爱尔兰在世界上选择自己道路的权利。爱尔兰如今虽站在昔日敌手的一边，但却不曾为此感到些许折辱。"
 irelandflavour.3.a: "过去的就让它过去吧"
 irelandflavour.4.t: "忆往昔革命峥嵘"
 irelandflavour.4.d1: "今天是爱尔兰纪念其独立的导火索，即1916年复活节起义的日子，那时，爱尔兰共和派和社会主义者并肩作战，希望唤起爱尔兰人民反抗帝国主义势力。\n\n无论反动派如何掩饰，身为爱尔兰工团主义者和爱尔兰公民军领袖的詹姆斯·康诺利的革命贡献都是不可否认的事实，他站在了斗争的第一线，也为爱尔兰争取独立、走向社会主义的道路奠定了基础。\n\n他的贡献决不会被人遗忘，他的牺牲也将被后人尊崇，爱尔兰亦将在他开辟的道路上继续砥砺前行。"
 irelandflavour.4.d2: "今天是爱尔兰纪念其独立的导火索，即1916年复活节起义的日子，那时，爱尔兰共和派和社会主义者并肩作战，希望唤起爱尔兰人民反抗帝国主义势力。\n\n在那混乱不堪的一周里，身为苏裔爱尔兰人与工团主义者的詹姆斯·康诺利挺身而出，领导起了爱尔兰公民军。让爱尔兰人民挣脱资本主义束缚与帝国主义锁链正是康诺利为之斗争的目标，虽常有人误认为他是在与英国人民为敌，但康诺利反对的是体制制度，而非某个个体，对他来说，问题不在于都柏林堡上飘扬着哪国国旗，而在于这面旗帜之下是否存在社会主义制度。\n\n今天，爱英两国均已经受革命之洗涤，两国人民亦在反对资本主义与帝国主义的斗争中并肩奋战。倘若康诺利能见证如今为第三国际之平等成员的英爱两国，他肯定会为之自豪的。"
 irelandflavour.4.a: "从犁锄到星辰，我们誓要掌控自己的命运"
 irelandflavour.4.b: "奋今朝共筑未来！"
 irelandflavour.5.t: "至圣之日"
 irelandflavour.5.d1: "今天是爱尔兰纪念其独立的导火索，即1916年复活节起义的日子，那时，爱尔兰的民族主义者忍无可忍，愤而点燃了将英国人赶出爱尔兰的燎原之火。\n\n参加复活节起义的人虽政见不一、信仰不同，但他们的信念却出奇一致，那便是爱尔兰应当获得自由解放，爱尔兰民族亦不再屈居人下。纵使数度埋没于记忆之海，乃至于被当事人遗忘忘却，但我们仍应将1916年精神铭记于心！\n\n爱尔兰人民的团结之力与爱尔兰身份认同的价值均于1916年得到了充分展现。而今天，爱尔兰必须坚决挫败那些在我国人民间挑拨离间，妄图夺走我等身份认同的各路工团分子的险恶企图。不管他们是打着红旗还是英国国旗，工团分子到底只盼着爱尔兰再度成为英国佬的掌中玩物，1916年精神在他们看来实为眼中钉肉中刺，恨不除之而后快。爱尔兰必须对此时刻保持警惕，亦需时刻做好自卫的准备。"
 irelandflavour.5.d2: "今天是爱尔兰纪念其独立的导火索，即1916年复活节起义的日子，那时，爱尔兰的民族主义者忍无可忍，愤而点燃了将英国人赶出爱尔兰的燎原之火。\n\n参加复活节起义的人虽政见不一、信仰不同，但他们的信念却出奇一致，那便是爱尔兰应当获得自由解放，爱尔兰民族亦不再屈居人下。纵使数度埋没于记忆之海，乃至于被当事人遗忘忘却，但我们仍应将1916年精神铭记于心！\n\n爱尔兰人民的团结之力与爱尔兰身份认同的价值均于1916年得到了充分展现。而今天，爱尔兰必须坚决挫败那些在我国人民间挑拨离间，妄图夺走我等身份认同的各路工团分子的险恶企图。不管他们是打着红旗还是英国国旗，工团分子到底只盼着爱尔兰再度成为英国佬的掌中玩物，1916年精神在他们看来实为眼中钉肉中刺，恨不除之而后快。爱尔兰必须对此时刻保持警惕，亦需时刻做好自卫的准备。如今，古老的爱尔兰王国得以复辟，爱尔兰亦得以同耶稣基督一般在复活节浴火重生。"
 irelandflavour.5.a: "言语随风而去，却又刻骨铭心"
 irelandflavour.200.t: "乔治国王逝世"
 irelandflavour.200.d: "乔治五世，联合王国及其诸自治领的国王、印度的皇帝，已因久病缠身而撒手人寰。大英帝国的残余部分均为此致哀，爱尔兰却发现自己现在很是尴尬。不出所料，北爱尔兰和阿尔斯特统一派正为他们国王的逝世而哀悼，但其他地区的情绪就有些五味杂陈了。\n\n乔治国王常被认为是个亲爱派，他批评过英国处理复活节起义的办法，在我国独立战争期间还试图制止英军的滥杀现象，对臭名远扬的英裔准军事组织黑棕部队更是冷脸相待，哪怕是共和派也会对他种种亲自下场帮助爱尔兰的行为心生敬重。但要论他最能流芳百世的功绩，那非得是说服保守党内阁，让他能在北爱议会开幕式上发表那篇著名演讲不可了，他力图在全体爱尔兰人民之间实现和平、宽恕与和解，在某种程度上说，他的愿望也算成真了……\n\n对大多数爱尔兰人来说，受其背后的英国政府的连累，他们对这位旧王的记忆还是好不到哪去，但若只评价他，那他也算是个公认的公平之人。毫无疑问，哪怕在北爱地区之外，也有许多爱尔兰子民虔诚地表达着哀悼之情，但亦有人告诫柯林斯总统，要是他在任何公开场合对此表现出任何悲痛之情，则必将在政坛上掀起惊涛骇浪，而值此国难之时，任何冲突矛盾都很难善了。"
 irelandflavour.200.a: "不关我们的事"
 irelandflavour.200.b: "私底下向加拿大致哀"
 irelandflavour.200.c: "去他妈的政治，柯林斯就是要讲话！"
 irelandflavour.300.t: "爱尔兰就乔治国王逝世表态"
 irelandflavour.300.d1: "自1925年帝国崩溃以来，因其罔顾法理、吞并了北爱尔兰及通商口岸，我国与爱尔兰共和国的外交关系便有些冷淡——前提是真存在什么外交关系的话，不过，倒也是有些温暖互动的。\n\n今天，柯林斯总统亲自向我国政府发送了一份私人电报，对乔治国王的去世表示最诚挚的哀悼，并承诺永远不会遗忘或玷污对最后一位国王的回忆。"
 irelandflavour.300.a: "挺出乎意料的"
 irelandflavour.300.b: "哪怕在爱尔兰，也都留有他的遗泽"
 irelandflavour.400.t: "加拿大的答复"
 irelandflavour.400.d: "今天，我们收到了加拿大政府的答复。\n\n他们感谢我们对国王去世的悼念，并希望我国能够把过去的诸多恩怨抛诸脑后。"
 irelandflavour.400.a: "恁人还怪好的嘞"
 irelandflavour.500.t: "柯林斯就乔治国王逝世发表讲话"
 irelandflavour.500.d: "今天，为纪念爱尔兰最后一位国王，乔治五世的逝世，在其阁僚的陪同下，柯林斯总统于都柏林市中心发表了庄严的演讲。柯林斯力图发扬国王“宽恕和解”的遗产，呼吁全体爱尔兰人民团结一心、和平相处，而非兵戈相向、自相残杀。\n\n虽有些死硬保王党认为柯林斯此举不过是在“消费”国王的死讯，但北爱尔兰的实际掌权人，詹姆斯·克雷格对此很是满意，还专门表示了对柯林斯的支持。\n\n当然，这篇讲话也在其他地方激起了争议，一些极左极右分子痛斥柯林斯是在“向英国暴君卑躬屈膝”“刻意美化保王派形象”，但大多数爱尔兰人对讲话并无特别的情绪。"
 irelandflavour.500.a: "这是正确的做法"
 irelandflavour.1006.t: "凯斯门特之躯"
 irelandflavour.1006.d: "本周的内阁会议上，外交部长向政府转达了不列颠联盟提出的一项极不寻常的提议，众人皆为此惊愕不已：他们打算把罗杰·凯斯门特爵士的遗体还给我们，他是英裔爱尔兰人反帝活动家，也是独立战争的英雄。他曾为复活节起义从德国向爱尔兰偷运武器，1916年，凯斯门特因叛国罪被处决，英国人罔顾他的遗愿，将其下葬在了英国的监狱里。\n\n内阁立即为此展开了激烈的辩论，他们想琢磨明白这到底是英国人的阴谋诡计，还是他们真的想和我们改善关系。对英国来说，这是他们在复活节起义21周年之际伸出的橄榄枝。\n\n虽然体面安葬凯斯门特的想法很是诱人，但一些内阁成员也意识到，为了达成这笔交易，就算我们不去和不列颠联盟称兄道弟，那也得虚情假意地赞美他们一番。\n\n就算是为了换取凯斯门特的遗体，让政府对不列颠联盟歌功颂德实在还是太难了些，但另一方面，拒绝这一提议无异于政治自杀，反对派和社会公众肯定对此理解不能。"
 irelandflavour.1006.a: "将他带回家乡好生安葬！"
 irelandflavour.1006.b: "这不过是他们意图玷污其遗产的卑鄙企图！"
 irelandflavour.1006.c: "他一开始不是帮德国运枪的么？"
 irelandflavour.1007.t: "行路规则"
 irelandflavour.1007.d: "帝国公约与工团主义势力间的对抗局势日趋升温，爱尔兰惊觉自己站在了欧洲两大海军势力争夺的第一线。先前几年沉闷的政治现状已被打破，世界主义者与民族主义者都想让爱尔兰的某些方面赶上欧洲大陆的标准，前者想让爱尔兰与欧洲伙伴间更紧密地联系在一起，后者则想铲除英治时期的陈旧残余。\n\n既然现代化的建议颇得民心，便有人建议爱尔兰应当从旧英治时期的靠左行驶过渡到欧陆通用的靠右行驶，让爱尔兰的交通规则与欧美各国保持一致。\n\n拥护者强调，这一改变对旅游业和国际汽车进出口具有长远的好处，而反对者则辩称，这一提案搞不好会让道路上闹得一团糟，还会浪费宝贵的、本可以用于解决黑色星期一的宝贵时间与资源。"
 irelandflavour.1007.a: "我们已经不是殖民地了，改变交通体系"
 irelandflavour.1007.b: "真是浪费时间，算了算了"
 irelandflavour.1008.t: "调快时钟"
 irelandflavour.1008.d: "在部分公众持续要求重新审视爱尔兰的英治历史的背景下，之前修改国家交通规则以符合欧陆主流交通系统的动议似乎还不是最后一条改革动议，一个相当激进的动议已酝酿完毕。这个由世界主义者和反工团主义者组成的奇怪的改革派联盟一直主张，我国的时钟应该调快一个小时，与德国的中欧时间同步。\n\n改革派认为，将爱尔兰共和国的时区与中欧同步既能减轻工团主义的影响，也有利于爱尔兰与中欧同盟伙伴的贸易往来。自大英帝国垮台以来，中欧同盟的伙伴国便是爱尔兰出口的主要市场，此举有利于国家重振至关重要的出口行业，减轻前一年经济危机造成的影响。\n\n另一方面，批评者嘲笑这一想法根本就是荒诞不经，警告其对日出日落时间的影响，以及它可能对爱尔兰经济主权造成的有害后果，爱尔兰的国家命运将因此进一步与德国的命运联系在一起，而黑色星期一早已展现了这一战略的缺陷。"
 irelandflavour.1008.a: "早起不过是建设光明未来的小小代价"
 irelandflavour.1008.b: "也许我们该改革地理教学了？"
 irelandflavour.1009.t1: "火热七月"
 irelandflavour.1009.t2: "坚决反对"
 irelandflavour.1009.d1: "1690年7月12日，信奉天主教的英格兰国王詹姆斯二世在博因河战役中被奥兰治的威廉击败。对爱尔兰天主教徒来说，詹姆斯的失败让他们被迫屈服于严刑峻法，但对阿尔斯特新教徒来说，凯旋的威廉无异于把他们从天主教统治下解救出来的救世主，几十年前才从英国迁居爱尔兰的他们也能名正言顺地在这片大地上定居下来。\n\n这一天成为了保王派的重要纪念日，为表庆祝，“奥兰治骑士团”常会在该日前夜举行游行并燃起篝火。大多数保皇派虽碍于工团主义威胁不情不愿地选择加入他们眼中颇为可恨的爱尔兰共和国，但在间战期里，他们常会用篝火焚毁爱尔兰、不列颠联盟和德国国旗，以此表示其消极抵抗。\n\n因一直存在的族间与宗教间的敌对行动，这个月的局势本已十分紧张，陆军同志协会、统一俱乐部和新教联盟的崛起，加诸六月与七月初蓝衫军与新教联盟犯下的日益频繁的宗派暴力事件，更是让12日当日的局势变得一触即发。紧张局势日益升温，最后在12日当天彻底失控，一支奥兰治骑士团的队伍经过天主教区时发生了冲突，而后演变成骚乱。警察未能止暴制乱，致使谣言四起，当地的警察更是站在了本社区的暴徒一边，截止当天结束时，已有数人死亡，许多房屋被毁。\n\n"
 irelandflavour.1009.d1.otherdem: "好像还嫌不够糟似的，一系列有关蓝衫军攻击恐吓南方新教徒的报道自阿尔斯特不胫而走，不过，警察却迅速组织起来恢复了秩序，工团主义者的爱尔兰公民军也对那些被威胁之人伸出了援手，他们向来反对宗派暴力，更不肯放过一切恶心他们“军团”敌人的机会。现在北方已成了众人关注的对象，民众要求改革的压力也越来越大，政府业已处于进退维谷之境地。"
 irelandflavour.1009.d2: "1690年7月12日，信奉天主教的英格兰国王詹姆斯二世在博因河战役中被奥兰治的威廉击败。对爱尔兰天主教徒来说，詹姆斯的失败让他们被迫屈服于严刑峻法，但对阿尔斯特新教徒来说，凯旋的威廉无异于把他们从天主教统治下解救出来的救世主，几十年前才从英国迁居爱尔兰的他们也能名正言顺地在这片大地上定居下来。\n\n这一天成为了保王派的重要纪念日，为表庆祝，“奥兰治骑士团”常会在该日前夜举行游行并燃起篝火。虽然庆祝纪念日的筹备工作常会激化紧张局势，但今年尤为如此，阿尔斯特保王派正为蓝衫军的政变紧张不已。今天，紧张局势在贝尔法斯特彻底失控，保皇派不仅引爆了多枚炸弹，更有几次游行演变成了骚乱，因为他们试图在天主教区游行时被蓝衫军阻止。暴乱虽已被铁腕镇压，但此等暴行只会让阿尔斯特新教徒疏远政府。\n\n不仅是北方的保王派，南方工团主义者的爱尔兰公民军及其他亲民主势力的抵抗也愈发强烈，奥达菲与奥金纳甘已就如何解决当下情况与内阁磋商。在老将军看来，这个问题说到底是内部问题，是爱尔兰人民欠管了，他要求扩大警察规模以维持秩序，天生反骨的新教徒更要被严密监视。\n\n在奥金纳甘看来，当局面临的一切麻烦都要怪境外“盎格鲁工团主义”邪恶势力密谋颠覆爱尔兰民族，为了对抗赤色威胁，大权在握的秘密警察便是不可或缺之物，他们能用尽酷刑在内的一切手段，铲除那些收了盎撒人先令的家伙。不管怎么说，这组织肯定马上会被那些不满足于国民警卫队，意图转正的蓝衫军成员填满，军团主义派的内部影响力亦会水涨船高。"
 irelandflavour.1009.a: "百年一瞬即逝，博因河依旧汩汩流淌"
 irelandflavour.1009.b: "老一套的法律和秩序就能解决了"
 irelandflavour.1009.c: "盖尔之敌必遭清除！"
 irelandflavour.1010.t: "换位思考"
 irelandflavour.1010.d: "后独立时代的宁静被打破，人民对变革的渴望持续升温，于是一项旨在让爱尔兰更加融入欧洲大陆的额外动议被摆上了桌面。这一次的动议涉及计量单位，爱尔兰共和国因为以前曾受大英帝国统治，目前的计量单位仍然使用英制，相比之下，欧洲大陆的许多国家，尤其是德国，始终使用公制。尽管自爱尔兰独立以来，国内就一直有人呼吁单位公制化，但直到如今，对这一领域的改革的支持强度才明显提升，这也与我国近来其他追随欧洲趋势的举措相一致。\n\n在世界主义者看来，单位公制化将有助于国家的进一步现代化，而从民族主义者角度来看，这也代表对英国影响力的进一步抵抗。然而，这一主张的反对者指出，英制早已在爱尔兰人民心中根深蒂固，被广泛用于酒吧、赛马和道路等许多公众事务，将整个国家调整为公制无疑会面临困难，甚至可能需要数年时间。反对者表示，虽然英制让我们与欧洲大陆有所差异，但并不需要打破，更别提所谓的修复了。"
 irelandflavour.1010.a: "只要我还能点杯酒就行"
 irelandflavour.1010.b: "亲欧派只会得寸进尺"
 irelandflavour.1011.t: "自由苏格兰电台"
 irelandflavour.1011.d: "近年来最受人瞩目的一项技术发展便是无线电。尽管自20世纪20年代中期该技术就已存在于爱尔兰，但受限于当时的频谱范围，要想把信号从都柏林传输到科克，往往需要中继站的辅助。不过，无线电技术发展迅速，全新的、更为高效的无线电发送器不断涌现，现在我们已经能够将信号传输到更偏远的地区。\n\n受到低地国家远程无线电台成功的鼓舞，一小撮流亡至贝尔法斯特的苏格兰活动家筹集资金，计划开设一个属于自己的电台：“自由苏格兰电台”。他们打算购买一台范围约150英里的发送器，将电台的覆盖范围扩展到格拉斯哥、爱丁堡甚至英格兰的利物浦。他们的目的很简单：不列颠联盟严格控制着国内的新闻媒体，他们要给那里的人民提供获取新闻及苏格兰文化资源的额外渠道。\n\n虽然英国电台早早就已“泄露”到爱尔兰，但这个明显意欲颠覆苏格兰政局的新电台很可能被英国政府视为一种挑衅。"
 irelandflavour.1011.a: "自由国家里的自由企业。"
 irelandflavour.1011.b: "挺不错的想法，没准咱可以为他们的事业做一些小小的贡献……"
 irelandflavour.1011.c: "我们可不想被他们搅入战争"
 irelandflavour.1012.t: "自由苏格兰电台"
 irelandflavour.1012.d: "政府注意到，位于苏格兰、西北英格兰和马恩岛的无线电接收器捕捉到了一股来自贝尔法斯特“自由苏格兰电台”的广播信号。该电台播放的音乐内容平平无奇，都是些苏格兰传统歌曲，但其在新闻及政治话题的选择上却带有对英国工团政府的偏见。\n\n这个电台似乎是由一群移居爱尔兰的苏格兰民族主义者运营，他们的节目内容多半都在心照不宣地宣扬反社会主义理论。至于爱尔兰政府是默许了这一行为，还是单纯选择了视而不见，尚不得而知，但他们无法否认的是，这个电台现在正在他们的眼皮子底下运作。"
 irelandflavour.1012.a: "挑衅我们？好，但我们不会上钩"
 irelandflavour.1012.b: "联盟内政不容境外势力干预，起草官方声明谴责他们"
 irelandflavour.1013.t: "不列颠谴责自由苏格兰电台"
 irelandflavour.1013.d: "不列颠联盟发言人今天发表了一份官方声明，谴责爱尔兰政府“纵容政治煽动者”，放任“自由苏格兰电台”在贝尔法斯特运作。\n\n声明中还谴责该电台只不过是把有关社会主义生产方式的错误消息当作挑动苏格兰公民情绪的工具，并接着声称，一个“负责任的政府”决不会允许纵容此类电台在未受监管的情况下运作。\n\n爱尔兰大多数媒体都凑到广播前听起了声明，看来他们对这种“恶名”很是受用。"
 irelandflavour.1013.a: "不要包庇电台，我们没必要和英国人对着来"
 irelandflavour.1013.b: "电台的存在是个错误，我们得想法子叫停它"
 irelandflavour.1013.c: "别想欺负我们——发表我们自己的声明作为回应！"
 irelandflavour.1014.t: "爱尔兰叫停自由苏格兰电台"
 irelandflavour.1014.d: "今天有消息从爱尔兰传到英国，“自由苏格兰电台”已被悄然解散。\n\n爱尔兰出台了新法律，以此规范岛上的广播电台，随后，自由苏格兰电台的经营许可证亦被吊销。似乎只要英国政府一公开表示不满，他们便会屁滚尿流地来缓和局势。"
 irelandflavour.1014.a: "明智之举"
 irelandflavour.1015.t: "爱尔兰支持自由苏格兰电台"
 irelandflavour.1015.d: "看来包庇煽动者都满足不了爱尔兰人了，他们还要保护他们！\n\n今天，爱尔兰“邮电部长”对联盟当局进行了回击，声称英国广播多年来一直毫无顾忌地“侵入”爱尔兰，然后又发表了一通言论自由的陈词滥调。他们卑鄙地将宣传煽动和严肃新闻混为一谈，还暴露了（搞不好是故意的）自身缺乏批判性思维。都柏林对英国人的态度现在是再明白不过了。"
 irelandflavour.1015.a: "流氓烂岛"
 ARMY_LIAM_LYNCH_DESC:0 "§Y指挥官介绍\n生于：§!§g1892年11月20日，爱尔兰利默里克郡鲍纳古拉希§!\n§Y爱尔兰语名：§!§g利亚姆·奥林希§!\n§Y军旅生涯：§!§g利亚姆（教名威廉·法纳亨·林奇）出生于科克和利默里克两郡交界处的加尔蒂山山阴下的一户政治氛围活跃的农家小院——他的叔父参与了1867年的起义，母亲则在致力于打破英爱上层阶级对大片土地之垄断的土地联盟地方分会妇女支部中担任联合秘书。\n\n和众多的同龄人一样，林奇于1913年本着为爱尔兰争自治的目的加入了爱尔兰志愿军，同一时期，他完成了自己的五金学徒生涯，并成为了盖尔联盟的一员。也是和大多数人的选择一样，林奇没有加入志愿军中的激进团体，也没有参加复活节起义，更没有入伍英军。不过，这一温和的态度在起义结束后便不再存在，因为他亲眼目睹了英军对鲍纳德的肯特家族犯下的暴行：肯特家的四个儿子和年迈八旬的老母亲逮着手铐被押着走过费莫伊桥，其中一个儿子因被俘时受伤过重而不幸离世，还有一人在第二周遭英军处决。这一刻，林奇下定了决心，要为了爱尔兰的自由而战斗到底。\n\n独立战争期间，林奇指挥着爱尔兰共和军中的北科克第二旅成功进行了多次小规模战役、突袭与伏击，一时声名鹊起。他还曾多次惊险躲过英军的追捕，多次与死亡擦肩而过，英军为了逮他甚至还误杀了两名也叫做林奇的人。\n\n独立战争的经历对林奇影响深远，也让其在军中的地位举足轻重。林奇一向讨厌政客，曾于独立战争期间放话：“军队必须披荆斩棘，为政治铸下一条自由之路。”林奇性格细致入微，年少时就表现出了对军旅生活的向往，战争期间他对于手上这份事业的认真劲头丝毫不逊色于牧师对神的敬重。战争虽已结束，但军队依旧是林奇的使命所在。§!"
 ARMY_WJ_BRENNAN_WHITMORE_DESC:0 "§Y指挥官介绍\n生于：§!§g1886年10月21日，爱尔兰韦克斯福德郡韦克斯福德§!\n§Y爱尔兰语名：§!§gL·S·布劳南-蒙万§!\n§Y军旅生涯：§!§g在极右翼激进分子夺权而导致的军队混乱中，威廉·詹姆斯·布伦南-惠特莫尔作为一个愿意在军事上支持新政府的人物登上了舞台。\n\n威廉·詹姆斯·布伦南出生于韦克斯福德郡的一个记者兼印刷商家庭。由于父母双亡，他由外公外婆抚养，并改姓他们的姓氏。他早年加入过皇家爱尔兰团，在印度服役并晋升为中士。然而，在英军服役的经历并没有让他接受政治现状。1907年退伍后，他开始致力于天主教相关的爱尔兰民族主义事业。\n\n回到爱尔兰后，他成为了一名记者，同时也是新芬党的早期党员和盖尔联盟的杰出成员。不出所料，他加入了1913年成立的爱尔兰志愿军，并因其先前的军旅经验而受到了欢迎。在复活节起义期间，他在詹姆斯·康诺利领导下的都柏林邮政总局担任指挥官，他因此负伤并最终被捕。\n\n布伦南-惠特莫尔是威尔士弗朗戈赫监狱内的积极分子。被囚禁在那里的起义老兵们共同研究军事策略，这些策略后来在独立战争中得以运用。独立战争期间，他参与了北韦克斯福德的爱尔兰共和军，主要负责协助柯林斯建立情报网络。\n\n爱尔兰独立后，布伦南-惠特莫尔对自由化浪潮渐生幻灭。于是他离开军队重返新闻界，到处宣扬爱尔兰正面临着迫在眉睫的工团主义威胁。尽管他是一个虔诚的天主教徒，但他呼吁所有基督徒团结一致，共同抵制工团主义，就像他们过去共同反抗英国人一样。\n\n布伦南-惠特莫尔的专栏充斥着极端言论，以至于他曾被由他参与创建的情报网络调查过。但随着爱尔兰有了新的强人领导，他主动请缨，称自己将尽其所能拯救爱尔兰乃至整个欧洲。§!"
 ARMY_JACK_WHITE_DESC:0 "§Y指挥官介绍\n生于：§!§g1879年5月22日，爱尔兰安特里姆郡布罗谢恩§!\n§Y爱尔兰语名：§!§g谢默斯·德·菲特§!\n§Y军旅生涯：§!§g詹姆斯·罗伯特·怀特出身阿尔斯特的新教贵族之家。少时于温彻斯特求学，曾多次因叛逆行为，如在板球场上随地小便，受到纪律处分。怀特的父亲是名战争英雄兼陆军元帅，故其得入桑德赫斯特皇家军事学院深造，并于第二次布尔战争爆发前夕完成了学业，旋即入伍参战。\n\n正是在南非，怀特第一次感受到了自己同其他英伦贵族在思想观念上的巨大分歧。有一次，他为了保护一名手无寸铁的年轻布尔囚犯差点开枪杀了自己的上级军官。虽然有着种种小插曲，但怀特还是在这场战争中立下了许多功勋，还获得了一枚优异服务勋章。\n\n过了几年和平的日子后，怀特意识到这根本不是自己想要的人生，于是便踏上了旅途。之后，他在波希米亚教过英语，在英格兰体验过托尔斯泰公社，在加拿大砍过树。等再度踏上爱尔兰的土地时，他正好赶上自治争论的大热潮。起初，怀特在这场论战中站统一派，不过，待真正见识过阿尔斯特的亲英势力后，他顿觉这群人“固步自封、执迷不悟”，便赶紧同其划清了界限，转投了自治派。后来，怀特又偶然结识了罗杰·凯斯门特和詹姆斯·康诺利，并在他们的影响下放弃了自治的想法，先是成为了一名共和派，后又成了社会主义的忠实信众。\n\n之后，怀特参与创立了爱尔兰公民军，运用其在英军系统中习得的经验，负责军中的训练、组织工作。当爱尔兰公民军开始接触爱尔兰志愿军，商议二者的合作、合并事宜时，不满此举的怀特遂退出了该民兵组织。不过，怀特从没放弃过自己的信仰，并在后来先后缔造了爱尔兰工人联盟和爱尔兰工团党。《英爱条约》签订后，怀特秘密协调起了改组过后的爱尔兰公民军，带领着一群志愿兵为社会主义共和国的大业而战。\n\n怀特自诩基督教社会主义者，反对教权干政，主张继承托恩之志，团结起天主教、新教等各教派。§!"
 ARMY_EOIN_O_DUFFY_DESC:0 "§Y指挥官介绍\n生于：§!§g1890年1月28日，爱尔兰莫纳亨郡卡斯尔布莱尼§!\n§Y爱尔兰语名：§!§g约恩·奥杜夫查§!\n§Y军旅生涯：§!§g在成功攫取政治权力后，约恩·奥达菲又重拾起了军中的旧职。\n\n奥达菲生于莫纳亨郡的一户贫寒农家，在七个兄弟姐妹中排行老幺。他热衷于四处推广盖尔运动，还是盖尔联盟的一员，因此在当地也算是小有名气。复活节起义爆发后，奥达菲加入了爱尔兰志愿军。\n\n奥达菲在起义中的高光时刻发生在起义的前期，当时他拿下了爱尔兰皇家警察部队的一处营地，缴获了一堆武器和炸药，为附近其它的部队提供了范本，也因此受到了上级的嘉奖和晋升。之后，奥达菲又致力于在贝尔法斯特民族主义分子主宰的地位保护天主教徒免遭大屠杀的厄运，这一行为，再加上阿尔斯特乡郊地区的亲英派手中收缴军火一事，让其成为了那些不赞同建立独立的爱尔兰共和国之人口中的谬种。\n\n战后，奥达菲被任命为了国内的警察部队——和平卫队的专员。他坚定拥护迈克尔·柯林斯，并因此获得了爱尔兰统一党的总理这一象征性的职位。虽然说是科林斯政府中的一位大人物，但奥达菲却经常与统一党的许多高层发生冲突，因为后者看不惯其许多右翼观点。\n\n奥达菲的军事生涯结束于独立战争，之后的岁月其人生都不怎么顺利。不过虽说如此，但他那莽撞、亢奋的性子却从未改变。§!"
 ARMY_RICHARD_MULCAHY_DESC:0 "§Y指挥官介绍\n生于：§!§g1886年5月10日，爱尔兰沃特福德郡沃特福德§!\n§Y爱尔兰语名：§!§g理斯泰德·奥毛尔查塔§!\n§Y军旅生涯：§!§g理查德·马尔卡希是众人眼中政治家兼士兵的完美典范，其在独立战争时期处理军队和国家之间关系的方式更是堪称一代经典。\n\n马尔卡希出身沃特福德的一处中下层家庭，十六岁时进入邮局工作，一路干到了工程科。马尔卡希同爱尔兰民族主义结缘，最早还是通过新芬党缔造者亚瑟·格里菲斯创办的报刊《团结的爱尔兰人》，当时的他为上面的文字所感染，二话不说加入了盖尔联盟。等到前往都柏林工作时，马尔卡希不仅已经能够说一口流利的爱尔兰语了，还成了名坚定的共和派。\n\n加入爱尔兰志愿军后，马尔卡希拒绝同入伍英军参加世界大战的那拨人为伍，并利用邮局工程科的职务便利，协助志愿军于复活节起义期间切断了英军的通讯。整个复活节起义期间，马尔卡希都待在米斯郡的阿什本——除都柏林外为数不多响应起义的地区之一——组织游击战，而后来这一战术在独立战争中得到了进一步的发展。\n\n独立战争爆发后，已身为众议院议员的马尔卡希肩负起了国防部副部长一职，并经常性地充当迈克尔·柯林斯和卡哈尔·布鲁阿之间冲突的调解人。柯林斯和布鲁阿既是马尔卡希的亲密同事，也是后者敬重的对象，不过，当布鲁阿离开新芬党另起炉灶后，他选择站在了柯林斯一边，在充当其左右手的同时，依旧与布鲁阿保持着职业上的往来。\n\n马尔卡希是一位心思细腻、深谋远虑、谨小慎微、分得清政治和军事的政治家兼领袖。他认为军队是国家机器上不可或缺的一枚螺钉，而他自己也将尽一切努力，推动爱尔兰国防事业的发展。§!"
 ARMY_HUGO_MACNEILL_DESC:0 "§Y指挥官介绍\n生于：§!§g1900年4月16日，爱尔兰都柏林郡霍斯§!\n§Y爱尔兰语名：§!§g奥德·麦克尼尔§!\n§Y军旅生涯：§!§g雨果·海辛斯·麦克尼尔是众人眼中爱尔兰军队的耀眼新星。他在独立战争后不久参军，升迁之路一路畅通。许多人认为，他身为前总统约恩·麦克尼尔外甥的这一层关系肯定派上了用场，但不管他的家庭关系如何，他本身就能力显著，在性格上也是任性顽固、野心勃勃。\n\n本着扩宽对军事领域的视野的希望，他曾接受过美国陆军司令部的进阶训练，但他近来却认为，倘若爱尔兰想进一步发展其军队，唯一的办法便是同德意志帝国更为紧密地联系在一起。他希望让军队得到长足的发展，摆脱他眼中从独立战争时期传下来的老旧体系，以现代的军队体系取而代之。\n\n麦克尼尔虽出身于政坛世家，却未投身政治，这在别人看来实在是件稀奇事，你要是去问他，他会说他宁愿让别人来管这些事。话虽如此，支持军队的国家自然要比不支持军队的国家更得他的青睐。§!"
 ARMY_TOM_BARRY_DESC:0 "§Y指挥官介绍\n生于：§!§g1897年7月1日，爱尔兰凯里郡基洛格林§!\n§Y爱尔兰语名：§!§g陶茂斯·德·巴拉§!\n§Y军旅生涯：§!§g如果要在爱尔兰的诸位将领中挑选出声名最为显赫的一位，那这人非托马斯·伯纳德·巴里莫属。巴里出生于科克郡的一处爱尔兰皇家警察家庭，在十一个兄弟姐妹中排行老二。与同龄的革命同志不同，巴里既没有加入过盖尔联盟，也没有经受过共和思想和民族主义的熏陶。\n\n十七岁时，巴里做了世界大战那个时期欧洲的许多青年都会做的事：参军。不过，巴里并不是为了爱尔兰而战，更不是为了英国而战，他加入皇家炮兵军团的目的很单纯：见识下战争、耍下枪，并游历一番。\n\n跟随战争的脚步，巴里一路到了美索不达米亚和埃及，期间晋升、荣誉纷至沓来。当巴里听闻复活节起义的消息后，他对自己在英军中的地位产生了迷茫，于是便拒绝了调往芒斯特燧发枪军团的委任状，申请调去了他处。\n\n爱尔兰独立战争初期，巴里一直秉持着明哲保身的态度，直至发生在科克市的一桩惨剧才令其幡然醒悟：英军士兵在光天化日之下用刺刀活活刺死了一名退伍老兵，边刺还边大声叫骂“爱尔兰猪猡”。巴里以仪仗队的身份参加了这名老兵的葬礼，此时的他已对现状再无留恋，头也不回地加入了爱尔兰共和军，为独立的爱尔兰共和国而战。\n\n自加入共和军伊始，巴里的军事背景以及鼓励、训练新兵的才能便得到了高层的重视，不只如此，他还把自己过去的经验成功运用到了新形态的战争之中。传奇的基尔迈克尔伏击战和克罗斯巴里战役便使巴里的能力体现得淋漓尽致，在克罗斯巴里，巴里率领着西科克旅的一百零四名志愿兵以最小的伤亡逃脱了十三倍于己的英军的围剿。\n\n巴里威名远扬，令敌人闻风丧胆，英国政府甚至在谈判停火时以将其临时监禁作为首要条件，而柯林斯自然是严词拒绝了这一无理要求。\n\n巴里的部下英勇善战、纪律严明、作战高效，所获殊荣嘉奖无数。不过，巴里并没有因此沾沾自喜，反而是坚持“亲上战场”，立志在伏击战和空战领域再创佳绩。与此同时，巴里也在不断地发展自己的战法，以做好万全的准备在“下一场战争”中继续捍卫爱尔兰的独立。§!"
 ARMY_JJ_O_CONNELL_DESC:0 "§Y指挥官介绍\n生于：§!§g1887年12月21日，爱尔兰梅奥郡巴利纳§!\n§Y爱尔兰语名：§!§gD·S·奥考纳尔§!\n§Y军旅生涯：§!§g杰里迈亚·约瑟夫·“红发”·奥康奈是爱尔兰共和军的知名成员。\n\n奥康奈出身督学之家，就读于都柏林大学，期间担任过大学拳击队的教练，最后以一等硕士学位毕业。学业暂告一段落后，奥康奈前往了美国，在陆军第六十九纽约团服了两年兵役，随后于1915年归国加入了爱尔兰志愿军，在其中担任督察长，负责向人讲授军事战术以及爱尔兰的著名战役。奥康奈并没有参加复活节起义，因为就在起义的前几天，他因为约恩·麦克尼尔的那招臭棋而前往了科克，而正是这道命令，差点将起义扼杀于萌芽之中。\n\n虽然奥康奈不在起义的名单之上，但英军并没有打算就此放过他，而是把他投进了大牢。爱尔兰志愿军改组为爱尔兰共和军后，奥康奈保留下了军中的职务，并最终干到了教导主任一职，持续至今。虽身为所有军官训练课程的金牌讲师，但其留给学生们的印象并不是一个一板一眼的老古板，而是一位平易近人的良师益友。除讲师的身份外，他还是一名军事史学家，发表过多篇讲述爱尔兰国内外军事历史和战术的文章。\n\n奥康奈是独立战争后旧爱尔兰共和兄弟会解散的关键人物，他经常把军人不应该掺和秘密结社这类乱七八糟的东西这句话挂在嘴边，而兄弟会的最后一任会长迈克尔·柯林斯也相信了这位同僚的判断，听从了其建议。\n\n身为一名模范士兵，奥康纳不问政治，一心扑在了爱尔兰及其军队之上。§!"
 ARMY_DANIEL_MCKENNA_DESC:0 "§Y指挥官介绍\n生于：§!§g1892年12月1日，爱尔兰德里郡德雷珀斯敦§!\n§Y爱尔兰语名：§!§g多姆纳尔·麦克奇尼§!\n§Y军旅生涯：§!§g和许多军方高层一样，丹尼尔·麦肯纳在爱尔兰革命中首次获得实战经验。他是一个阿尔斯特农民的儿子，1915年加入爱尔兰志愿军。麦肯纳在独立战争中表现活跃，战争结束时他已经升任北方第二师的副师长。\n\n作为国防指挥官和协调员，他充沛的精力和积极的态度得到了同僚和政府的一致认可。自独立以来，他从多个角度深入研究了都柏林复活节起义及独立战争中的城市巷战，这让他对密集建筑中的防御战产生了特别的兴趣。\n\n麦肯纳认为，爱尔兰这个岛国会受到来自于任何一个政治或地理方向的攻击。他提出无论攻击来自哪里，爱尔兰都必须利用一切可能的资源和手段来自卫，而相关政治决策应当由政府做出而非军队。考虑到爱尔兰所处的欧洲门户位置，麦肯纳指出，在规划战略时不能想当然地认为谁是盟友谁是敌人。\n\n尽管军中大部分人都是亲德派，麦肯纳的观点仍得到了重视。他将继续制定对策以应对任何可能发生的情况。§!"
 ARMY_DANIEL_HOGAN_DESC:0 "§Y指挥官介绍\n生于：§!§g1895年7月14日，爱尔兰蒂珀雷里郡克朗梅尔§!\n§Y爱尔兰语名：§!§g多姆纳尔·奥豪甘§!\n§Y军旅生涯：§!§g丹尼尔·霍甘出生于蒂珀雷里郡的一户殷实农家。自学校毕业后，他来到了莫纳亨郡，入职了大北方铁路公司，并于日后的独立战争期间一举成名。刚到莫纳亨的头几年，霍甘加入了盖尔运动协会和爱尔兰志愿军，而这两个组织也是其结识约恩·奥达菲的契机。\n\n在莫纳亨的爱尔兰共和军中，霍甘是一副冷酷无情、自信满满的领袖形象，以奥达菲左右手的身份指挥了数次伏击战与突击战。在此期间，霍甘失去了自己的弟弟迈克尔。迈克尔是蒂珀雷里球队的队长，在血腥星期日那天，这支球队正好在克罗克公园里比赛，而迈克尔则是唯一一位死于英军之手的球员，其余的死伤者都为在场的观众。迈克尔的死让霍甘不能自已，他化悲痛为动力，全身心地投入到了阿尔斯特的革命活动之中，策划绑架了数名富可敌国的亲英派，还将几座“大房子”付之一炬。战争结束后，霍甘出席了英军退出爱尔兰、移交一切国家权力的仪式，并有幸亲手在都柏林城堡上空升起了三色旗。\n\n奥达菲在政府中失势后，为了避免同这位前上司之间的友谊危害到自己在军中的前程，霍甘也将其主动疏远——不过，或许是出于宗教信仰的缘故，霍甘其实是同情奥达菲的。霍甘过去的关系以及尖酸刻薄的性格令其与政客对付不来，不过，手下的士兵们倒是对其敬重有加，他们百分百地信任这位指挥官、领袖。§!"
 ARMY_SEAN_MAC_EOIN_DESC:0 "§Y指挥官介绍\n生于：§!§g1893年9月30日，爱尔兰朗福德郡格兰纳达§!\n§Y英语名：§!§g约翰·麦基翁§!\n§Y军旅生涯：§!§g肖恩·麦克约恩出生于朗福德的一个铁匠家庭，母亲祖上是参加过1798年起义的共和主义者。肖恩打小就对国家大事很感兴趣，并于11岁时将自己的名字改为爱尔兰语。在完成了初等教育后，沙恩进入自家铁匠铺给父亲当学徒。作为长子，1913年父亲因意外去世后他便担起了家庭的责任，接手了自家铁匠铺以养家糊口。然而，这并不妨碍他于次年加入爱尔兰志愿军和爱尔兰共和兄弟会。\n\n独立战争期间，麦克约恩因其担任中部唯一一支卓有成效的游击飞军——朗福德旅第一营的指挥官而闻名。战时他有两次高光时刻；第一次是巴林纳利战役，他从数量众多英国军队手中保住了作为自己大本营的村子。另一次是科龙芬伏击战，在那里他对几辆英军卡车展开了一次干净利落的突袭。战后他没有选择夺取更多军需物资，而是为受伤的敌人提供治疗，他的骑士精神为其赢得了广泛赞誉。这两件事在当地家喻户晓，他也被冠以“巴林纳利的铁匠”的美称。\n\n他的战时经历直到他因胸部中弹被捕为止。他伤愈后被判刑，英军提供的证词使他的死刑判决被推迟。后来，作为条约谈判的一部分，他在判决执行之前被释放。\n\n在狱中，麦克约恩被选为了朗福德-韦斯特米斯的众议院议员。英国大革命后，爱尔兰的独立即刻受到威胁，他转而专注于军事职务，在连任两届后放弃了再次竞选议员的机会。人如其名，作为“巴林纳利的铁匠”，他因其强烈的宗教观点而闻名。他与理查德·马尔卡希和迈克尔·柯林斯的关系都很密切，但他更忠于军队本身。§!"
 ARMY_RORY_O_CONNOR_DESC:0 "§Y指挥官介绍\n生于：§!§g1883年11月28日，爱尔兰都柏林郡都柏林§!\n§Y爱尔兰语名：§!§g若瑞·奥康丘瓦尔§!\n§Y军旅生涯：§!§g罗德里克·伊格内修斯·帕特里克·奥康纳出身都柏林的富裕人家，是家中的第三子。青年时期接受过优质教育的奥康纳长大后成为了一名工程师，并在加拿大工作了几年，期间负责修建的铁路总里程达到了一千五百英里。\n\n1915年初，奥康纳回到了爱尔兰，原本还踌躇满志地打算入伍英军参战，可没过多久就又一头扎进了当初离开时的中产阶级圈子内。那时，奥康纳身边的许多小伙伴都已有了坚定的民族主义倾向，耳濡目染之下，他也逐渐为共和主义所俘获。\n\n奥康纳凭借着自己的工程师背景投资创办了一家化学用品厂，不过，这家厂子生产的不是阿司匹林这样的药物，而是之后复活节起义中会用到的炸药。说到复活节起义，奥康纳本人就亲身参与了其中，期间头部被一颗回弹的狙击子弹擦伤，脚踝也被流弹击中。起义过后，奥康纳用假名躲过了一劫，得以静静疗养。\n\n之后，奥康纳被爱尔兰共和军任命为了工程总管，负责开展破坏行动、训练新兵使用炸药、组织越狱等事务。爱尔兰独立后，奥康纳继续在军中担任此一职务。\n\n奥康纳爱好古典音乐、桥牌和国际象棋，为人博学多识、温文尔雅又英勇无畏、低调正直，不喜议会中的勾心斗角，一心只为守护共和国。§!"
 ARMY_JAMES_STEELE_DESC:0 "§Y指挥官介绍\n生于：§!§g1894年10月26日，爱尔兰安特里姆郡巴利卡里§!\n§Y爱尔兰语名：§!§g谢默斯·麦克鲁阿奇§!\n§Y军旅生涯：§!§g詹姆斯·斯图尔特·斯蒂尔在军中的一众士官中显得有些格格不入。\n\n斯蒂尔出生于一处阿尔斯特新教徒家庭，在贝尔法斯特的女王大学攻读期间加入了军官训练团，并同阿尔斯特的热血男儿一样，踊跃参加了世界大战，以爱尔兰皇家步枪军团上尉的身份前往西线作战，亲历过梅西讷、索姆河、帕斯尚尔等战役，获得了一枚十字勋章，且于日后也多有晋升。\n\n虽然英国输掉了世界大战，但斯蒂尔在英军中依旧前途一片大好。爱尔兰独立战争的结果让其心痛不已，因为他早就把自己当作了英国自家人，也不愿正视与自己渐行渐远的军中昔日同袍。\n\n英国大革命让斯蒂尔的世界观一瞬崩塌。当新生的不列颠联盟迫近之时，加拿大的流亡政府直接抛弃了北爱尔兰，斯蒂尔对大英帝国的美好幻景就此破灭。之后，他以军方代表的身份参加了同南方政府的谈判，达成了爱尔兰的南北统一。\n\n虽然斯蒂尔从未表达过对共和国体制的任何不满，但有心人会发现，他从不会使用全称来称呼军队，只称其为“爱尔兰军”，同样的，他也只把“北爱尔兰”叫作“阿尔斯特”。\n\n斯蒂尔首先忠于阿尔斯特，其次才是爱尔兰。选择留在军队中绝非易事一件，但他觉得自己有义务在如今的这支全岛军队中担当起亲英军事传统代表的角色，如若不然的话，这些人恐怕会就此埋没。\n\n虽然与其它军官之间存在分歧，但其实各方相互之间都对对方评价很高，而且斯蒂尔也从没辜负过大家的期望，丝毫不敢懈怠地为爱尔兰与工团分子之间的下一轮冲突做着准备。"
 ARMY_SEAMUS_O_DONNOVAN_DESC:0 "§Y指挥官介绍\n生于：§!§g1896年11月3日，爱尔兰罗斯康芒郡卡斯尔维尤§!\n§Y爱尔兰语名：§!§g谢默斯·奥多纳万§!\n§Y军旅生涯：§!§g在爱尔兰共和军的那段生涯内，虽然可能会有人质疑其为了目的不择手段，但奥多诺万对于军官工作的尽职尽责则是有目共睹的。\n\n1919年，奥多诺万从都柏林大学的化学系毕业，获理学硕士学位。奥多诺万能接触到爱尔兰共和军，少不了其化学教授的引荐，而共和军也对他重视有加，旋即委任其总管化学事务。不过，这一职务并非奥多诺万的最终归宿，在组织中待得时间越久，他就越发着迷于对爆破物的研究。\n\n奥多诺万是共和军中少数反对签订《英爱条约》的军官之一，他坚信，这种折衷办法本身就是个谬误，而他也为此受到了同僚们的排挤。虽然尚未经过实践，但奥多诺万痴迷于一种步兵同炸药、飞机、地面载具相配合的战法，而就爱尔兰的工业实力来说，这一军事理论实属“野心勃勃”。即使以军中强硬派军官的角度来看，愿意不计一切代价去证明自己理论的奥多诺万也是让其自愧弗如。§!"
 ARMY_SEAN_RUSSELL_DESC:0 "§Y指挥官介绍\n生于：§!§g1893年10月13日，爱尔兰都柏林郡都柏林§!\n§Y爱尔兰语名：§!§g肖恩·茹谢尔§!\n§Y军旅生涯：§!§g约翰·安杰洛·拉塞尔出生于都柏林市中心的一户普通人家，在七名兄弟姊妹中排行老幺。中学毕业后，拉塞尔做起了制衣店学徒，随后又于1913年加入了爱尔兰志愿军，并以小队队长的身份参加了复活节起义。停火协议签署后，英国单方面关押了拉塞尔，直到当年年末才还其自由身。\n\n回到爱尔兰后，拉塞尔继续参与都柏林的爱尔兰共和军的活动，并参加了之后的独立战争。战争期间，拉塞尔从都柏林旅第二营营长做起，一路做到了都柏林市爱尔兰共和军的军需总长。拉塞尔深谙共和军的组织结构和人员组成，是协助迈克尔·柯林斯挑选人手、执行同时针对多名英国情报人员暗杀行动“血腥星期日”的关键人物。此外，拉塞尔还通过线人得知了当天晚些时候英国人会在克罗克公园大开杀戒、以示报复的消息，不过，当时的拉塞尔根本无力阻止这一惨剧。\n\n《英爱条约》签订后，拉塞尔卸下了戎装，回归了市井生活。至于其中的原因嘛，一半是对于“血腥星期日”后续发生事件的失望，一半是类似于“任务已经完成”的心态。\n\n不过，在欧陆的局势缓慢升温后，拉塞尔的赋闲生活也出现了一些变化：再也忍受不了日复一日单调生活的他又重新回归了军旅。虽然以战场指挥官的角度来说，拉塞尔的实战经验算不上顶尖，但独立战争中的经历还是让他肩负起了武器装备的采购、生产任务。拉塞尔把政治纷争置之度外，满腔热情地投入到了新的工作之中，而在此一过程中他所展现出的人脉关系着实让许多人吃了一惊。§!"
 ARMY_NEVEN_HENAFF_DESC:0 "§Y指挥官介绍\n生于：§!§g1908年10月25日，法兰西共和国下卢瓦尔省南特§!\n§Y法语名：§!§g塞莱斯坦·莱内§!\n§Y军旅生涯：§!§g为表示对凯尔特同族的支持，纳旺·埃纳夫以后来者的身份加入了奥金纳甘政权为其效力。\n\n埃纳夫十几岁起便加入了布列塔尼的民族主义地下组织，并表现出了与年龄不符的激进做派。普鲁士铁一般的军事纪律以及爱尔兰共和军的爱国革命热情共同构成了埃纳夫对于自由布列塔尼的憧憬。虽然在公社的治下，法国的地方自治权得到了大幅度的提升，其程度远超旧共和国时期，但这一许多布列塔尼民族主义支持者眼中的巨大进步却依旧无法令埃纳夫感到满意。对于他来说，同那些千方百计妄图摧毁其传承的人同处一个国家，根本就是奇耻大辱。\n\n身为一名化学工程师，埃纳夫负责拆除了纪念十五世纪布列塔尼与法国联合的历史雕塑，而这一具有象征意味的行动也令其备受鼓舞。埃纳夫来到爱尔兰，除了想获取同爱尔兰共和军共事的第一手经验外，也是想瞻仰下这个和他一样憎恨工团主义的强大新政权。\n\n虽然布列塔尼语和爱尔兰语之间少有相似之处，但埃纳夫还是期盼着能够流利地讲出他这第二故乡的语言。在如今这样一个忠诚军官打灯难找的环境下，埃纳夫就成了受大家所信赖的一名协助者。§!"
 NAVY_SEAMUS_O_MURIS_DESC:0 "§Y海军指挥官介绍\n生于：§!§g1889年1月29日，英格兰西苏塞克斯利特尔汉普顿§!\n§Y英文名：§!§g詹姆斯·莫里斯§!\n§Y海军生涯：§!§g谢默斯·奥默里斯出生于高威郡的航海世家，他的曾曾祖父是1796年第一个得以接受皇家海军委任的天主教徒，但只允许在“爱尔兰港口”服役。\n\n虽然他出生时随父亲居住于英国，也在那里接受了早年的教育，但奥默里斯仍能在家里说一口流利的爱尔兰语，后来，他回到爱尔兰，并于1904年以海军军官候补生詹姆斯·弗朗西斯·莫里斯的身份进入皇家海军。奥默里斯曾辗转于多艘舰艇上服役，其中最著名的就是英国皇家海军的文森特号，他乘坐着这艘战舰参加了1916年的日德兰海战，而其兄查尔斯则在这场战役中不幸身亡。\n\n无论如何，在独立战争期间，当奥默里斯听说他的家乡克利夫登被英国军队纵火焚毁时，他与皇家海军任何温情脉脉的感情都荡然无存了。他曾担任英国皇家海军卡斯特号上的二把手，还曾受命将爱尔兰政治犯运送到英国关押，事实证明，这让他实在难以忍受。他提前从皇家海军退役，回到了家乡。\n\n自从爱尔兰独立，并于1925年接管了最后一个旧英国海军基地以来，他便使用起了爱尔兰语名，并被政府赋予了一项并不令人艳羡的任务，也就是发展爱尔兰羽翼未满的海军。§!"
 NAVY_HENRY_HG_STOKER_DESC:0 "§Y海军指挥官介绍\n生于§!§g1885年2月2日，爱尔兰都柏林郡都柏林§!\n§Y爱尔兰语名：§!§g安劳·A·G·麦克安斯陶卡莱§!\n§Y海军生涯：§!§g亨利·休·戈登·斯托克出生于都柏林一个颇有名望的新教家庭，于1900年加入皇家海军，在潜艇发展早期便就对该领域产生了极大的兴趣。作为调往澳大利亚皇家海军的旅途一部分，他乘坐着潜艇从普利茅斯航行到了悉尼，成为了第一个航行如此远距离的潜艇兵。在世界大战期间，他指挥的一艘潜艇在避开土耳其的雷区、海岸炮台和巡逻军舰后，率先通过了达达尼尔海峡，他也因此声名鹊起。而后，他开始在马尔马拉海破坏土军补给线，阻碍其增援，但后来遭到了奥斯曼炮艇的袭击，并在战俘营度过了余下的战争岁月。\n\n尽管他因战功获颁优异服务勋章，但他还是在英国大革命前离开了皇家海军，回到了爱尔兰家乡。因政坛动荡不安，斯托克后来又回归了海军领域。虽身为著名作家布拉姆·斯托克的侄子，但他没有继承叔叔们“地方自治”的理念，如今，他正为了爱尔兰大力发展潜艇海战学说，他坚信潜艇是保卫岛屿海防的关键。"
 IRE_mitteleuropa_member: "§Y[IRE.GetNameWithFlag]§!是§Y中欧同盟§!成员国"
 IRE_IEDC_member: "§Y[IRE.GetNameWithFlag]§!是§Y帝国经济发展委员会§!成员国"
 IRE_renovate_balla_eireannach_tt: "§C东部与南部海岸的海岸要塞等级提升一级。§!"
 IRE_take_belfast: "重夺贝尔法斯特"
 IRE_take_belfast_desc: ""
 IRE_expand_coastal_batteries: "增建海岸炮台"
 IRE_expand_coastal_batteries_desc: "我们虽是中欧经济同盟的一部分，但却位于大陆的最西端，同盟友的联系亦被工团主义者的强大舰队所隔绝。因此，我们有必要准备增建现有的海防网络，以期防御来自海上的攻击，将我们变成欧洲大西洋之上坚不可摧的巨石。"
 IRE_joint_exercises: "爱尔兰共和军-德国国防军共同演习"
 IRE_joint_exercises_desc: "德国国防军和爱尔兰共和军是两种截然不同的军队，一种深植于传统，另一种主要由起义民众中的男性组成。尽管如此，双方都证明了彼此合作的能力。鉴于我们日益升温的友谊，我们的高级指挥部的许多人建议将这次演习扩大为全面的联合演习，这既能让我们的部队能够向欧陆上最精锐的军队学习，同时也能公开展示我们友谊的力量。"
 IRE_host_germans: "尊重德国领导权"
 IRE_host_germans_desc: "作为欧洲大陆新秩序的一部分，同德国人睦邻友好已成为了每个中欧联盟成员国的必修课，整个国家的命运也取决于个别外交官取悦柏林代表的能力。身为这个集团中较为边缘的一员，爱尔兰必须特别努力地与德国协调一致，进而构建一种符合两国国情的外交关系。"
 IRE_anglo_irish_connections: "英爱纽带"
 IRE_anglo_irish_connections_desc: "在大西洋两岸，有一群既不是英国人也不是爱尔兰人的人。虽然这些英裔爱尔兰人通常都是我们社会中的精英，但他们也存在于各个阶层存在，是英伦诸岛在独立与革命前亲密联系的见证。而后虽天翻地覆，许多英裔爱尔兰人流亡者依旧同爱尔兰藕断丝连，他们兴许能成为我们在渥太华法院中的重要盟友。"
 IRE_anglo_irish_connections_tt: "§C如果爱尔兰是帝国经济发展委员会的成员国，那么它将动用英爱两国上层阶级的关系，降低获得加成所需的政治点数。\n\n否则，爱尔兰将利用这些关系与协约国就一次性援助方案进行谈判。§!"
 IRE_rehabilitate_redmond: "平反雷德蒙"
 IRE_rehabilitate_redmond_desc: "过去二十年里，爱尔兰政坛中发生了翻天覆地般的变化，人们亦因此遗忘了过往，曾几何时，保卫爱尔兰的利益并不与历史发展的轨迹相矛盾，约翰·雷蒙德等人现在虽埋没史册，但也曾是过去时代的英雄好汉。我们必须努力向人们证明，援助协约国并不代表着要牺牲爱尔兰的利益。"
 IRE_our_part_to_play: "吾辈之责"
 IRE_our_part_to_play_desc: "也许我们比谁都要懂得那份国破家亡，被迫流亡世外之所，日日夜夜受思乡之情折磨的痛苦。尽管我们先前有着一系列的恩怨纠葛，但帮助英国流亡者夺回家乡的机会如今就掌握在我们手中。也许只待尘埃落定，他们就能对忍受了七百年亡国之痛的我们感同身受，到了那时，我们便可真正地平等相待了。"
 IRE_exalt_republicanism: "歌颂共和制度"
 IRE_exalt_republicanism_desc: "自1798年以来，为共和制度而奋斗便深植于我国的立国精神之中。我们不像其他人一样，需借助远方的君主来界定自身——这片土地永远属于她的人民，此乃举国共识。我们应该自豪地展示这段历史，因为我们现在正与我们在伦敦和巴黎的姊妹共和国并肩而立：我们始终高举共和主义火炬，而在一切国家民族争得自由前，我们也绝不会动摇放弃。"
 IRE_workers_solidarity: "工人团结"
 IRE_workers_solidarity_desc: "世上不存在仅属于爱尔兰、英国和法国的斗争，世上只有一种斗争：普罗大众与压迫者的斗争。纵观我国历史，我们一次又一次地被踩在脚下，不断地投身于争夺命运自决权的战斗中。我们必须认识到，我们并不是唯一遭受这种凌辱的民族，世界上还有许多人正遭受着这种凌辱。“我们活在彼此的影子里。”"
 IRE_hoches_return: "霍奇将军归来"
 IRE_hoches_return_desc: "1796年，年轻的法兰西共和国打算派遣一支远征军前往爱尔兰，帮助我们最终功败垂成的革命。革命可能失败了，但爱尔兰和法国两国人民彼此之间深厚的友谊与共同的事业却在此展现得淋漓尽致。如今，我们携起手来，爱法两国人民终于可以以自由的名义并肩奋战，并在霍希将军的精神指引下走向胜利。"
 ire.2030.t: "加拿大援助计划"
 ire.2030.d: "虽然爱尔兰仍旧是中欧同盟的一部分，但其政府还是通过英裔爱尔兰贵族联系上了旧英国势力，并通过谈判争取到了一份一次性援助。\n\n加拿大人愿意在爱尔兰所选择的某个经济领域投入巨资，而政府要做的，就是考虑好如何使这笔援助的收益最大化。"
 ire.2030.a: "让他们协助经济发展"
 ire.2030.b: "军队需要他们的帮助"
 ire.2030.c: "让他们协助海军"
 IRE_cogadh_deiridh_idea: "战友之情"
 IRE_cogadh_deiridh_idea_desc: "国际斗争之中没有“领袖”，所有国家、全体人民都是单纯的兄弟。在这场斗争中，我们所能做出的贡献并不逊色于英法两国，我们将向世界表明，我国曾为亦将继续为自由与人权而战。"
 ire.2422.b:0 "北方接近和平之时已至"
 ire.243.b:0 "北方实现和平之时已至"
 ire.3130.t:0 "小康诺利"
 ire.3130.d:0 "身为社会主义革命烈士詹姆斯·康诺利之子，罗迪·康诺利肩负着重任。受其父政治思想的影响，康诺利始终坚持父亲的“三合一”理念：一个大工会，一个大民兵，一个大政党。康诺利在杰克·里德的介绍下同列宁有了接触，并在命运多舛的俄国革命期间的旅行巩固了他在爱尔兰乃至全世界左翼圈子中的地位。罗迪·康诺利与列宁会面的故事常常在爱尔兰各地流传，许多人还记得他声称列宁说英语带有拉斯明口音，而这正是他从他的爱尔兰老师那里学来的口音。作为现已解散的爱尔兰共产党的第一任主席，康诺利已一跃成为拉金的爱尔兰工人联盟的坚定盟友，也在其父的荫蔽之外搏出了一片天地。由于康诺利家族及其本人崇高的革命地位，他对革命政府产生了不可否认的影响，因此，在革命政府中，给康诺利加官进爵的呼声愈发高涨：他要么升任部长，要么成为国家的公众形象。"
 ire.3130.a:0 "谁能比詹姆斯·康诺利的后代更适合领导爱尔兰呢！"
 ire.3130.b:0 "像他这样的好孩子，总该担起点责任"
 ire.3130.c:0 "儿子接老子的班？那我们跟英国佬打仗是为了啥？"
 ire.3172.t: "拆拆拆！"
 ire.3172.d1: "爱尔兰既已成为第三国际一部分，也成了不列颠联盟的伙伴国，一个罕见的政治问题便随之出现了：奥利弗·克伦威尔。倒不是说这位恶名昭彰的将军从坟里爬出来了，只是爱尔兰国内政客指责英国一边在国际舞台上说着要支持爱尔兰，一边在本国却赞颂着爱尔兰人民的屠夫，这在他们看来实在太过虚伪。自从1925年革命以来，新的不列颠共和国便将其政体同旧的英格兰共和国联系在了一起，克伦威尔也取代了国王女王，成了人们尊敬的对象。这自然会激起爱尔兰的不满，也让长期担任英国驻爱尔兰大使的约翰·马菲相当尴尬。\n\n事件日益发酵，克伦威尔散布在全国范围内的“五大雕像”成了众矢之的，这些雕像早就是表示对克伦威尔的敬重的地方。民众要求英国人把它们推倒，结束对这位以征服为名屠杀无辜的、被人为美化了的军事独裁者的崇拜。在这个问题变得难以收场也难以忽视后，马菲只得向政府保证，他会向伦敦方面反映这个问题，但他也给我们打了个预防针，英国政府必然会在这一问题上遭遇极大阻力，也很难就这一问题发表评论，不过倒也还是能就此作出些国际主义的宣传的。"
 ire.3172.d2: "我们驻爱尔兰大使约翰·马菲向白厅提出了一个奇怪的要求：拆除分布于全国各地的五座奥利弗·克伦威尔雕像。这五座前护国公的雕像分别位于曼彻斯特的怀森肖、柴郡的沃灵顿、布拉德福德的市政厅、剑桥的圣艾夫斯和威斯敏斯特宫，而他本人在现代英国倍受尊敬，也是宣传的对象。克伦威尔被誉为现代共和国的精神先驱，工党也常常赞美他弑君和“清除”上议院的行为，他已是许多英国政治家的崇敬对象，他的话语也常被引用，更作为一种伪平民英雄在民众间占据着特殊的地位。话虽如此，在英国人民一心称赞他不辞辛劳地建立了光荣的英格兰共和国时，他在爱尔兰的行为却被这些赞美之词掩盖了，而这些行为同屠杀无异。\n\n这种崇拜，还有一边在国内崇拜克伦威尔，一边在国外承诺支持并团结爱尔兰的虚伪行为让爱尔兰政府实在难以忍受，他们正式要求我们拆除克伦威尔的雕像，换个崇拜的对象。虽然肯定有激进的英国英雄能填补上国会大厅外克伦威尔雕像的空缺，但这一提议还是在政客之中引发了恐慌，一些部长对这一提议犹豫不决，还称他们不会为英国的过去“背锅”。但在最后，冷静的头脑还是占了上风，有人建议，与其推倒所有的雕像，不如干脆移走一些就好。威斯敏斯特宫前的雕像在建筑学和政治上确有其重要性，称得上不可侵犯，但其他雕像就没那么重要了。当然，这是能安抚爱尔兰人，但看到了他们护国公雕像被推翻的英国人民可高兴不到哪去。"
 ire.3172.a: "打倒杀人犯！"
 ire.3172.b: "我们又没办法改变过去……"
 ire.3172.c: "把多余的雕像移走，它们还是待在博物馆里好点"
 irelandflavour.3811.t: "万圣夜"
 irelandflavour.3811.d: "万圣夜，是每年生者世界与亡者世界之间的界限壁障最为薄弱之时，逝去的灵魂与灵体会在此刻重归现世，接受生者的迎接与慰抚。烛光摇曳，篝火悦动，祝祷之声不绝于耳，原始祭仪重现于今。\n\n虽然管十月的最后一晚叫“万圣夜”的说法出自英语，但其实这一传统的最早发源地是在爱尔兰。爱尔兰历中的冬季从11月1日开始，而冬季的前一夜，代表着收获季节的结束，以及白天变短的开始。正式的万圣节是11月1日，天主教会把这一天定位弥撒日，全体天主教徒都要在这一天参加弥撒，而接下来的一天便是万灵节。不过，教会的这套传统并非原创，只是对更为古老、神秘的各地原始信仰的模仿。\n\n在这一天，人们会把萝卜刻成鬼脸的形状，在其中点上蜡烛，装点出一番异界的气象；会打扮成当晚会出现的鬼怪，漫步于僻静的乡村宅院间，用歌声和诗句向他人换取食物与水；会缅怀逝者，向他们寄去思念。\n\n类似的习俗也存在于世界各地，特别是在上世纪爱尔兰人大批移居美国之后，盖尔传统便在美国扎下了根，并发展出了自己的本土形式，之后，这些特色传统又经归国的爱尔兰人传回了故乡。\n\n在全球紧张局势日益加剧、美国这一许多爱尔兰人的新家与机遇之地陷入火海的如今，万圣夜的庆祝活动也多了些肃杀的气氛。新的传统可以随侨民和难民来到爱尔兰，但战争就大可不必了。"
 irelandflavour.3811.a: "我们死的人够多了，谢谢"
 irelandflavour.3812.t: "《赤染星辰》"
 irelandflavour.3812.d1: "爱尔兰的戏剧一直是这个国家引以为傲的文化金字招牌，而到了近来，戏剧更是成了其国民逃避世界动荡局势的一种方式。然而很不幸，政治暴力也是爱尔兰历史相伴相生的一部分，这不，这两个领域昨晚就在艾比剧院迎来了一场激情碰撞：剧院上映的新剧《赤染星辰》带有明显的政治倾向，而这也引发了一轮骚乱。\n\n该剧的作者肖恩·奥凯西从不对自己的社会主义信仰遮遮掩掩，而这部剧中也同样体现了他的这一风格。奥凯西之前的一部作品《犁与星》普遍被认为是对罔顾工人阶级的利益来宣扬爱尔兰民族主义这一做法的批判，此剧刚出时，许多人还只是要求对这一有辱爱尔兰国格的作品进行审查，到后来则直接在演出现场制造了骚乱。同样的，《赤染星辰》也被许多人认为是对爱尔兰身份认同之根基、天主教会，以及现代爱尔兰政治的攻击。剧中的主角“红吉姆”以爱尔兰社会主义领袖吉姆·拉金为原型，他带领工会战胜了天主教会支持的“红衫军”（暗喻奥达菲的蓝衫军），夺取了国家的控制权。\n\n目前，警方仍在调查、梳理昨晚事情的来龙去脉，不过，有一种说法是现场来了几名蓝衫军的成员，先是引发了一阵斗殴，最后升级成了一场骚乱。鉴于奥凯西的连续两部作品都以动乱收场，因此有人呼吁以维稳为重，封禁奥凯西，而奥达菲那边的人甚至直接要求以制作“渎神的工团主义宣传物”的名义逮捕奥凯西。\n\n虽然没有理由如此小题大做，但禁掉这些戏剧或许有助于杜绝此类事件的再次发生，并阻止工团主义思想的渗透。可是，此等程度的政府审查又可能会被公众当作威权专制的一大铁证，干脆就找几位部长出来稍微谴责下，然后就让这事过去吧。"
 irelandflavour.3812.d2: "自从英国的旧秩序土崩瓦解过后，大洋彼岸的工团主义剧作家和诗人便开足了宣传的马力，希望有朝一日也能在我们这里引爆一场社会主义革命。然而，外贼易挡，家贼难防。\n\n从不避讳自己的社会主义信仰的爱尔兰著名剧作家肖恩·奥凯西的新剧《赤染星辰》近日于伦敦的阿波罗剧院举行了首演，而之所以选择伦敦，是因为原定于都柏林艾比剧院演出的计划遭到了当局的阻挠。该剧的主角“红吉姆”以爱尔兰社会主义领袖吉姆·拉金为原型，他带领工会战胜了天主教会支持的“红衫军”（暗喻蓝衫军），夺取了国家的控制权。剧情的最后是一句话，大意为献给爱尔兰的“无畏工人们”，他们“即将从反动势力的压迫下获得解放”。\n\n虽然该剧只在伦敦上演，但工团主义叛徒的这种赤裸裸攻击行径还是很快传到了伦斯特府的[IRE_loc_leader_surname]耳中。不久之后，一份正式声明便从府中传出，奥凯西的戏剧被斥为了“伤风败俗、亵渎神明的工团主义宣传品”，其本人被打上了叛国贼的标签，他的所有戏剧今后也不得在爱尔兰上演。虽然尚不清楚奥凯西的背后是否有英国政府在撑腰，但国家还是以伙同英国密谋推翻政府为由，对其下了逮捕令，实质上就是将其逐出了国门。直到现在，[IRE_loc_leader_surname]的气都还没有消，这样来看的话，奥凯西只受到了如此之“轻”的处罚实乃三生有幸。"
 irelandflavour.3812.d3: "爱尔兰的戏剧一直是这个国家引以为傲的文化金字招牌，而到了近来，戏剧更是成了其国民逃避世界动荡局势的一种方式。即使位居庙堂之上，人也总是需要休息的，尤其是眼下，重塑国家政治格局的艰巨任务更是需要充足的休息作伴。最近，新剧《赤染星辰》正准备上演，这就正好提供了一个休息的完美契机，新政府内的多名要员也都出席了艾比剧院的演出。\n\n该剧的作者肖恩·奥凯西从不对自己的社会主义信仰遮遮掩掩，而近来的爱尔兰革命显然就是这部新剧的灵感来源，剧中的许多情节都与近几个月的事件对得上。剧中的主角“红吉姆”策划了一场罢工，并继而带领工会战胜了天主教会支持的“红衫军”（暗喻奥达菲的蓝衫军），夺取了国家的控制权。剧情的最后留给了献身于第二次爱尔兰革命的英勇工人们，而这部剧就此也成了众人眼中工团主义表演艺术的典范。\n\n吉姆·拉金对这部剧赞不绝口，奥凯西与他相识多年，两人互为知己。演出结束后，拉金止不住地向在场的其他政府成员夸赞这部剧作，特别是主演，他把“爱尔兰社会主义的精神真正演活了”。有了这叫好叫座的开头，希望爱尔兰戏剧界在接下来能迎来一个崭新的时代。"
 irelandflavour.3812.a: "别再干这种事了！"
 irelandflavour.3812.b: "我们得小心行事……"
 irelandflavour.3812.c: "亡命伦敦倒不如死了痛快……"
 irelandflavour.3812.e: "这“红吉姆”看着怪眼熟的……"
 irelandflavour.300.d2: "自1925年帝国崩溃以来，因其罔顾法理、吞并了北爱尔兰及通商口岸，我国与爱尔兰共和国的外交关系便有些冷淡——前提是真存在什么外交关系的话，不过，倒也是有些温暖互动的。\n\n今天，都柏林的消息传到了内阁，柯林斯总统为爱尔兰最后一位国王的逝世发表了恭敬而庄严的讲话。即使身为一名爱尔兰民族主义者、共和派，柯林斯也提及了乔治国王提倡宽恕与和解的语句，当然，这说到底还是为了他那政坛分歧重重的国家。话虽如此，看到爱尔兰如此公开地为国王逝世表示哀悼还是让很多人感到出乎意料。"
