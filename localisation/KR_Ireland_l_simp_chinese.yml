 irelandflavour.3914.a: "一杯酒，一生情"
 irelandflavour.3914.b: "我更喜欢墨菲酒……"
 irelandflavour.3914.c: "麦克盎楚沙家族不应忘了自己的根"
 irelandflavour.3914.e: "仔细看的话，酒里明显掺着点红色"
 irelandflavour.411.t: "乔伊斯逝世"
 irelandflavour.411.d1: "今天上午，[IRE.GetLeader]办公室对外公布了爱尔兰著名作家詹姆斯·乔伊斯去世的声明。据官方公告，乔伊斯于昨晚深夜在都柏林的家中去世。不久前，乔伊斯刚刚出版了他的最后一部小说《芬尼根守灵夜》。\n\n乔伊斯生前不仅被誉为当今时代最为重要的作家之一，而且还是公认的爱尔兰文化大使。乔伊斯去世后，他的星光不仅不会黯淡，反而会更加的璀璨夺目。然而，直到社会主义在爱尔兰取得胜利之前，爱尔兰政府对乔伊斯的态度一直是模棱两可的。\n\n虽然乔伊斯最初便是公认的爱尔兰的文学巨匠，但他后来却招致了一些争议，进而导致了官方舆论的恶化。世界大战期间，乔伊斯旅居瑞士，并在那里创作了《尤利西斯》。这部以都柏林为背景的小说可以与荷马的史诗齐名。然而，小说完成多年也未能出版。随后乔伊斯移居奥匈帝国，《尤利西斯》也多次被拒稿。\n\n在英国大革命后的自由化时期，乔伊斯终于得以在自己的祖国爱尔兰出版了这部小说，并于之后定居在了都柏林。虽然《尤利西斯》备受赞誉，但它还是躲不过惨遭下架的命运。随后，乔伊斯因书中的内容和个人言行而面临一系列诉讼，他随即逃往法兰西公社躲避诉讼。\n\n虽然乔伊斯被普遍认为是一名社会主义者，但他却很少在公开场合表达自己的政治观点，即使在工团主义的法国定居之后也是如此。无论如何，乔伊斯的存在本身就令爱尔兰当局尴尬不已，法国政府对此也是心知肚明。法兰西公社的政客们也不止一次的在较为正式的政治评论中提及。"
