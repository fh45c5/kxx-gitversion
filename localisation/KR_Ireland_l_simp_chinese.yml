 ire.374.t:0 "爱尔兰的狼"
 ire.374.d:0 "在英国和欧陆的文明概念传播到盖尔人的乐园，农田牧场遍布爱尔兰之前，这座小岛是欧洲最大的野狼栖息地之一。然而，农民们为了保卫自己的田地和牧群，将这些孤高的野兽几乎猎杀殆尽，而在披着“文明”社会之外衣行殖民之实的英国人的律法秩序之下，最后一只爱尔兰野狼于1786年在卡洛被射杀，我们古老的荒野从此再无生机。当时的人们还并没有树立起普遍的生态意识，我们对此也无可指摘，但狼群的缺位却在当下带给了我们新的危机：鹿！虽然我们的情况要比隔壁的苏格兰好上不少，但鹿的过度繁殖还是威胁到了我们生态系统的平衡，放之不理则有全面崩盘的风险。为此，一些生态学家与知名自然科学家，还有他们背后的爱尔兰共和军以及自由爱尔兰、新芬党、复兴建筑师等民族主义组织的金主，呼吁重新引进野生狼群，让自然法则去控制鹿的数量。狼群的引入还需要一系列配套的措施，这方面我们可以借鉴美国黄石国家公园的做法，如配备饲育站、用人工地洞做巢穴、在农田附近布置巡逻犬、加装电栅栏保护牲畜等。\n\n如果计划成功，那我们就能在限制住狼对牲畜捕食数量的情况下减少鹿的数目，让生态系统重新达到平衡。虽然我们会密切关注狼的数量，而且整套计划的可行性以及成功率都不低，但此举还是激怒了爱尔兰的广大农民，他们已经拿起了手中的步枪，准备为在遥远过去死于狼口的家畜复仇，而民族中央党、共和党、蓝衫军等一众保守农业组织为了争取公众支持，也在此时跳了出来，进一步点燃了人们的愤怒情绪，原本一个简单的生态问题瞬间就成了左右翼的政治大对抗。形势正迅速失控，政府必须为此事画上句号，那么问题来了，我们要如何做呢？"
 ire.374.a:0 "失心疯了吗？我们自己就能解决过度繁殖的问题"
 ire.374.b:0 "引进野狼！爱尔兰的森林将恢复往昔的野性与自由"
 ire_monarch.30.t:0 "爱尔兰共和军文官政府的命运"
 ire_monarch.30.d:0 "早在掌权之前，爱尔兰共和军就与新芬党内的民主社会主义者关系不浅。不过，虽推行了不少的进步政策，但说实话，我们的民粹军政府还远谈不上什么民主，大家对此也都是心知肚明。如今，激进民族主义再度开始泛滥，一些人认为此时我们正应该去文官政府内新觅些盟友，而首选自然就是自由爱尔兰。比起支持了共和军数十年的新芬党元老，军中的新鲜血液更倾向于自由爱尔兰这种狂热派，这不仅为我们带来了新盟友的潜在人选，还为我们的社会主义军政府理念赋予了新的革命性，当然一切的前提都是我们愿意抛弃旧爱、脱下民主的面具。那么，问题来了：是与新芬党的老同僚们继续维系“民主”社会主义的门面，还是彻底转向自由爱尔兰的左翼民族主义和反英社会激进主义呢？"
 ire_monarch.30.a:0 "一朝新芬人，一生新芬情"
 ire_monarch.30.b:0 "转向自由爱尔兰的激进新盟友"
 ire.375.t:0 "纳尔逊纪念柱的命运"
 ire.375.d:0 "刚刚才平安走出黑色星期一经济泥淖的爱尔兰也没闲着，立马又争起了一座颇具争议的纪念碑。纳尔逊纪念柱是一座高40米的巨大石柱，顶部有着一尊霍拉肖·纳尔逊的雕像，其既是旅游打卡的热门之选，也是一处源远流长的历史古迹。纳尔逊纪念柱产生的争议一点都不逊色于其体型，其中既有美观方面的，也有政治方面的，比如说柱子“死板沉闷”、底座“有碍观瞻”、整体“不三不四”，是英帝国主义的招魂幡，总之，不仅普通民众对之不满，就连政府之中也有许多人要求换掉纪念柱，或是将其直接拆毁。纪念柱位于萨克维尔街，其本身已经成为了都柏林日常中的一部分，而人们的争论点主要集中于最上的雕像上，因此，我们可以把纳尔逊的雕像改换成其他人，如罗伯特·埃米特、帕特里克·皮尔斯，或是当代的爱尔兰人物。不过，也有人不满足于仅仅换掉雕像这种做法，他们以“妨碍交通”为由，要求彻底拆掉这座“累赘”。此外，还有一部分人，如威廉·巴特勒·叶芝、奥利弗·圣约翰·戈加蒂等，支持原封保留纪念柱，因为这根柱子承载了太多的历史与文化。争论依旧在继续，而包括蓝衫军在内的爱尔兰右翼选择在此刻发声，批评目前的这种停滞不前为国格之辱：“征服者走了，但他所造成的伤痕依旧存在，可受害者居然连揭去这一耻辱的勇气都没有。”之前，由于资金问题，我们把这一问题给搁置了，如今，爱尔兰的经济基础已相当稳固，纪念柱便顺理成章地再度回到了聚光灯之下。[ROOT.GetLeader]面临的压力越来越大，而若迟迟无法决出最终决定，某些三流团体就可能自行其是，暴力拆毁纪念柱。"
 ire.375.a:0 "用罗伯特·埃米特换掉纳尔逊！"
 ire.375.b:0 "用帕特里克·皮尔斯换掉纳尔逊！"
 ire.375.c:0 "用迈克尔·柯林斯换掉纳尔逊！"
 ire.375.e:0 "用[IRE.GetLeader]国王换掉纳尔逊！"
 ire.375.f:0 "拆掉这玩意儿！"
 ire.375.g:0 "心有余然口袋不允许呀……"
 ire.3184.t:0 "新芬党的神甫"
 ire.3184.d:0 "仁慈宽厚的迈克尔·奥弗拉纳根牧师是爱尔兰独立之路上的领军人物之一，他在新芬党和爱尔兰历史上无疑留下了浓墨重彩的一笔，如今他又一次成为了民众目光的焦点。 奥弗拉纳根一生以多种方式为现代爱尔兰的诞生奉献了自己的一份力，从协助乡村发展，到担任盖尔联盟特使，再到发起克鲁纳科沼泽之战，一路上结交敌友无数。 他直戳了当的激进言论导致他被暂停神职，这愈发加剧了他与其他支持奥达菲的蓝衫军之流的爱尔兰右倾神职的冲突。\n\n在前工党盟友的协助下，奥弗拉纳根神父为各种共和派和社会主义事业四处奔走呼号，足迹踏遍在西班牙、美国，以及他曾居的澳大利亚。这让玛丽·麦克斯威尼等某些正统派成员大失所望。作为一名坚定的左翼人士，奥弗拉纳根经常调解“旧新芬党”党员与工党垮台后加入的新党员之间的争端。\n\n除了巨大的政治贡献外，奥弗拉纳根还善用自己在土地方面的专业知识，协助政府制定了不少土地开发计划。 此外，奥弗拉纳根还是一位出色的发明家，光是他申请了专利的发明就包括一种设计新颖的游泳镜（被称为“海豹之眼”），以及他亲自发明的用于远洋航行的陀螺仪旅行床。\n\n奥弗拉纳根神父与许多在复活节起义中牺牲的烈士有着私交，他对这些敢于赴死的英烈总是寄予最崇高的钦佩，并于起义后积极重组新芬党，也因此收获了群众们的广泛认可。即便是在瓦莱拉和柯林斯出走后的低谷时期，奥弗拉纳根仍是新芬党的全职演说家，他对新芬党的奉献以及他对今日之爱尔兰民族所做出的宝贵贡献受到了布鲁阿主席和党的高度赞扬。"
 ire.3184.b:0 "这人不错呀，让他做总理！"
 IRE_CELTIC_Flag_Picker:0 "联盟的新旗帜"
 ire.377.t:0 "凯尔特联盟的旗帜"
 ire.377.d:0 "凯尔特人的祖地已于我们的治下获得统一，而为更好地体现新联盟之身份，我们需要选择一面全新的旗帜。可选择的方案虽然不少，但最终入了政府法眼的只有三种。第一种方案是个大杂烩，即把各个凯尔特国家的旗帜融为一体。第二种方案是罗伯特·贝尔特利耶设计的泛凯尔特旗，上面有着两个相互交叠的三脚图案。最后一种方案是周边镶满了凯尔特绳结的绿旗。"
 ire.377.a:0 "还是用现在的吧"
 ire.377.b:0 "绳结旗可真好看！"
 ire.377.c:0 "大杂烩多好啊，干嘛不用？"
 ire.377.e:0 "泛凯尔特旗看着就赏心悦目！"
 ire.3184.a:0 "同新芬党共进退的宝贵伙伴"
 ire.376.d:0 "今日凌晨时分，都柏林市陷入了自复活节起义以来从未有过的恐慌与混乱之中。一伙身份不明的恐怖分子自作主张，用高爆炸药为“纳尔逊纪念柱”的命运画上了句点。炸弹被安放在了纪念柱的上层部分，整根柱子的中层完全被毁，纳尔逊的雕像也轰然坠地，裂成了千百吨碎石。\n\n寻常民众对此事件的反应总体来说较为稀松平常，但也不乏对都柏林失去了其标志性的纪念柱而感到悲伤的人。爱尔兰人天性乐观、幽默，人们很快便把纪念柱之终融入了流行文化之中，与此相关的诗歌、纪念品、音乐也随之成为了新的文化顶流。\n\n政府下达了危楼通知，准备对残余的纪念柱进行爆破拆除，而这引起了某些怀旧人士的抗议。正式拆除于几天后举行，军方用一枚遥控炸弹将之完全炸毁，据媒体报道，于安全距离外观看的人群看到爆炸“瞬间沸腾”了。据传，[ROOT.GetLeader]总统专门为此事致电了爱尔兰报社，建议其把头条标题取为“英国大将乘风而去”。"
 ire.376.a:0 "纳尔逊终究还是输掉了他的最后一战"
 ire.376.t:0 "纳尔逊纪念柱被毁！"
 IRE_irish_form_restoration:0 "§Y部队指挥官§!、§Y省份§!和§Y胜利点§!的名称都将恢复为§G爱尔兰语形式§!"
 ire.3152.t:0 "临时专政政府终结"
 ire.3152.d:0 "爱尔兰工人联盟在1937年选举中的胜利让工团主义者得以趁势颠覆爱尔兰既有政治体系。拉金总统利用特别立法手段，绕过了爱尔兰常规的政治制度，签署了革命众议院的成立令与共和国的废止令并使之载入法律。在拉金及其亲信落败出局后，奥布莱恩开始着手取消工人联盟发布的紧急状态，令参众二院重获其在战前与革命前的地位。有鉴于此，奥布莱恩总统呼吁在新近恢复的众议院举行新一届大选。听闻这一消息后，爱尔兰许多政党的领导人便从自我放逐中归来。各个近来重建的政党也团结了起来，组成了所谓的“民主反对派”，试图遏制工党的影响力。在瓦莱拉流亡海外后，这些政党的实际领导人是统一党，也就是在工人联盟夺权前掌握着政权的政党。理查德·马尔卡希已成为了这一异见团体的领袖，由于工党参与了1937年的革命，他依旧对工党抱有满腹狐疑。\n\n选票清点完毕，显然，新一届议会的构成标志着……"
 ire.3152.a:0 "工党丢盔弃甲，被迫与自由爱尔兰和工人联盟中的温和派合作"
 ire.3152.b:0 "工党丢盔弃甲，被迫与新芬党和民族中央党的余部合作"
 ire.3152.c:0 "工党取得压倒性胜利，足以独立推行其政纲"
 ire.3153.t:0 "[GetYear]年大选"
 ire.3153.d:0 "根据宪法规定，爱尔兰众议院每五年举行一次选举。而在五年前的今天，奥布莱恩总统领导着的工党重建了众议院，爱尔兰所谓的“票箱革命”亦就此终结。旧日的爱尔兰民主制度取代了由詹姆斯·拉金和革命众议院建立的临时专政政权，反对党也可再次赢得一席之地。站在工党左翼联盟对立面的是所谓的“民主反对派”，亦即一群中右政党的集合体，他们因工党在1937年革命中所扮演的角色对其极不信任。由统一党领导的民主反对派提名理查德·马尔卡希为统一候选人，希望借此一劳永逸地将工党赶下台。倘若他们成功地击败了工党，谁也说不准这个联盟是否还能延续。"
 ire.3153.a:0 "工党守住了执政党位置"
 ire.3153.b:0 "“民主反对派”给了工党的左翼联盟一记重击"
 IRE_radical_socialist_party2:0 "改组工党"
 IRE_radical_socialist_party2_long:0 "改组工党(Reconstituted Labour Party)"
 ire.3070.t:0 "跨越凯尔特海"
 ire.3070.d:0 "看来盖尔人并非唯一抵抗赤匪威胁的凯尔特民族。在大海对岸的布列塔尼，一名因抵抗法兰西公社政权而逃亡海外的布列塔尼民族主义领袖内万·埃纳夫（原名塞莱斯坦·莱内）决定在爱尔兰从军。在他眼中，独立的布列塔尼既应有爱尔兰的革命热情，亦需有普鲁士军国主义的纪律，因此，他对奥金纳甘的整合主义制度赞赏不已，因为他成功地将两者融合在了一起。\n\n虽考虑到与法国流亡政府关系的潜在影响，加诸法爱两国长期以来的友好关系，哪怕是要在世界大战中兵戈相向，一些人也对接受这一提议有些犹豫，但大多数人都非常乐意欢迎一位同样是凯尔特人爱国者的人的帮助。"
 ire.3070.a:0 "欢迎上船，埃纳夫将军"
 ire.3171.t:0 "格格不入者"
 ire.3171.d:0 "在大多数人眼中，爱尔兰公民军的联合创始人詹姆斯·罗伯特·怀特是个自相矛盾的人，或者用他自己的话来说，是个“格格不入之人”。在第二次爱尔兰革命之后，他成为了一个关键人物，并且多年来一直在爱尔兰公民军的地下工作中发挥着关键作用。\n\n怀特出身于军队勋贵阶层，是典型的阿尔斯特新教徒上层阶级。他曾就读于著名的桑德赫斯特军事学院，在那里他学到了大部分“筑垒和上垒”的知识。第二次布尔战争对他来说是一场考验，他参加了许多战役，常被新闻报道提及，并被授予杰出服务勋章，但也正是在此时此地，他对英国当权派产生了厌恶之情。\n\n战争结束后，他在其父直布罗陀总督身边担任副官，在此期间，他曾会见过国王与德皇。但最后，当他最终回到故乡时，他选择为爱尔兰服役，他放弃了对自己出身的一贯信念，从统一主义者到地方自治派，再到共和派和最终的社会主义者。\n\n由于在组织上的分歧，怀特在起义前离开了爱尔兰公民军，并在政治靠边站中度过了独立战争。然而，自世界大争以来接二连三发生的革命激励着他再度以爱尔兰的名义拿起武器。他的贵族背景、整洁的外表与浮夸的气质，加上反权威、反教权的半无政府主义的基督教社会主义理想，这个格格不入之人对社会主义共和国的巩固与延续至关重要。"
 ire.3171.a:0 "最能胜任此职之人"
 ire.380.t:0 "谁主沉浮"
 ire.380.d:0 "现役将军埃里克·多尔曼-史密斯，战友们口中的“瞪羚”，向陆军部递交了一份不寻常的请求，表明他希望被借调到国外。爱尔兰既已尘埃落定，都柏林业已成立了友好的社会主义政府，多尔曼-史密斯便趁机提出了请求，提议让他在爱尔兰军队中担任指挥官与军事战略“顾问”，以我军的现代作战方法对其进行训练。但众人立刻便对此加以猜测，多尔曼-史密斯此举也许不是为了什么国际主义大团结，只不过是想回到他在爱尔兰阿尔斯特的卡文郡老家罢了。同样，多尔曼-史密斯据说也曾在军中引起不满，因为他太过聪明了，也看不起那些不如他的人，这是众人皆知的事实。多尔曼-史密斯因此自然也没能交到几个朋友，他大概是想孤注一掷，在外国重新开始。\n\n军方对这一提议褒贬不一，一些军官对此举持怀疑态度，但亦有不同意见。埃德蒙·艾恩赛德将军和著名军事理论家巴兹尔·利德尔-哈特均称让多尔曼-史密斯在一支小国寡民之军中服役实在太过浪费，多尔曼也没有施展其专业知识的余地。话虽如此，这项提议在政治上确有其可取之处，有人提出，同意借调既能表达爱尔兰的信任，也能表明我们把他们当成合作伙伴，而非臣属跟班。当然，要是我们觉得多尔曼-史密斯在英国军队里能派上用场，我们也能否决提议。晋升的希望也许能让他撑下去。"
 ire.380.a:0 "好主意，去吧！"
 ire.380.b:0 "否决之，他留下来更有作为"
 ire.381.t:0 "浪子回头"
 ire.381.d:0 "在[IRE.GetLeader]主席的领导之下，社会主义共和国政权已然巩固，大概是意识到了爱尔兰革命将长存于世，国外的新盟友也愈发频繁地同爱尔兰进行外交接触。要是没有[ENG.GetNameDef]的援助，这一切都无法成真，两国间的频繁通信亦不足为奇了。今天有个好消息传来——英国陆军决定将一名杰出的将军借调到爱尔兰，此人正是卡文郡人埃里克·多尔曼-史密斯。\n\n作为英国军队中的一颗冉冉升起的新星，多尔曼-史密斯本人表示将接受爱尔兰语的名字。有鉴于其盎格鲁-爱尔兰出身，此举实属预料之中，这也与他对未来战争方向的极端现代和非正统的观点形成了鲜明对比。在英国大革命之前，他常直言不讳地批判着旧制度下惯用的战略战术，许多高层军官亦为之不快，但过去几年来，他提出的理论却愈受世人瞩目，亦因此闻名于世。\n\n既然英爱两国已结成牢不可破的联盟，他便可以把他对爱尔兰共和事业的支持与他在英国军队中的地位结合起来，并亲自请求暂时借调到他的祖国。他很清楚，他有关于在战争中更多地使用技术与动员的理念在规模更大的军队中能得到更好地实现，但对多尔曼·奥高恩来说，爱尔兰浓郁的革命氛围实在令其难以拒绝。"
 ire.381.a:0 "一日卡文人，一生卡文情"
 ire.400.t:0 "新芬党裂痕已现"
 ire.400.d:0 "当代的新芬党是在另一个政党——爱尔兰工党垮台后才跻身政坛的。工党的垮台让这个奄奄一息的运动重获新生，它一度荣获爱尔兰最具影响力政党的称号。在柯林斯和瓦莱拉双双脱党后，新芬党为数不多的忠实支持者急不可耐地从气息奄奄的工党那里吸收大量选民，该党亦在此过程中愈发左倾。尽管大多数当代新芬党成员先前都是工党的忠实拥护者，但党内亦不乏从建党之初便紧跟新芬党的忠实拥趸。这些原本的新芬党党员已一跃成为新芬党领导层的核心人物，党内的工党派为之愤懑不已。这一分歧在著名大学讲师兼参议员欧文·希伊-斯凯芬顿领导下的工党之“重生”中体现地淋漓尽致。希伊-斯凯芬顿的“重组工党”因对新芬党与天主教会间几乎毫不掩饰的同盟的不满而生。这次工党左翼分子的叛变虽未能再次削弱新芬党，却也让爱尔兰的社会主义者能在一个更温和的阵线下团结起来。在拉金麾下几近公开的工团主义者和新芬党之间，重组工党堂堂诞生，这是个致力于公民自由、民主、政教分离、言论自由、妇女权利、少数民族权利于其他诸类自由主义价值观的运动。唯有选票方能决定他们能否实现自身目标。"
 ire.400.a:0 "新芬党看来是一刻不得喘息"
 POLITICS_ERNIE_O_MALLEY_DESC:0 "§Y领导人介绍\n生于：§!1897年5月26日，爱尔兰梅奥郡卡斯尔巴\n§Y爱尔兰语名：§!埃尔南·奥马勒\n§Y政治生涯：§!既然爱尔兰总统已经是一个礼仪性角色，那么就要更多地考虑当选者作为名义元首的能力，而不是做出行政决策的能力。厄尼·奥马利就完美地符合了这一要求。\n\n作为独立战争中家喻户晓的知名人物，这个梅奥人后来离开了军队，并成为了爱尔兰最著名、最受欢迎的作家之一，他著有几部广受欢迎的革命小说。奥马利因其与各阶层民众打成一片的本领而受到社会各界的广泛尊崇。\n\n他是一个十分复杂的人物，对一些人来说，他四处旅行，放荡不羁爱艺术，是个同情劳工运动的知识分子；对另一些人来说，他又是爱尔兰语、盖尔主义和“绅士农民”这些备受农民和传统主义者重视的生活方式的倡导者。\n\n奥马利的无边魅力使他成为一名备受瞩目的总统候选人，然而这并不意味着他身上不存在争议；他时常发表一些激烈的言论，这往往会在爱尔兰媒体上引起轩然大波。"
 POLITICS_KATHLEEN_CLARKE_DESC:0 "§Y领导人介绍\n生于：§!1878年4月11日，爱尔兰利默里克郡利默里克\n§Y爱尔兰语名：§!卡特琳·伊赫莱里夫人\n§Y政治生涯：§!凯瑟琳·克拉克（原名戴利）一生忠于爱尔兰共和主义事业。\n\n她出生于利默里克郡一个坚定的共和主义家庭中，她的伯伯约翰·戴利是爱尔兰共和兄弟会的领导人。正是通过这层关系，她结识了未来的丈夫汤姆，后者在英国监狱服刑15年后刚刚获释。当时凯瑟琳在利默里克一家蒸蒸日上的制衣公司担任经理，与比自己大21岁的汤姆结婚时事业已经如日中天。\n\n这对夫妇在纽约居住过一段时间，并在工作之余积极帮助新移民到美国的爱尔兰裔芬尼亚派，他们后来返回了都柏林定居。在那里，他们开了一家烟草店，由凯瑟琳和她的丈夫共同经营业务，后来又加入了盖尔联盟。与此同时，她自己也参与共和主义运动。值得注意的是，在1914年，她成为了准军事组织“爱尔兰妇女联盟”的创始人之一，并在革命时期的独立斗争中发挥了至关重要的作用。汤姆作为复活节起义的领导者之一得以名垂青史，后来又成为共和国宣言的首位签署者。然而，复活节起义让凯瑟琳失去了丈夫、兄弟、叔叔以及未出生的孩子。事后不久，她就组织起救济工作，以帮助那些在叛乱中失去亲人的家庭。\n\n尽管克拉克个人遭受了巨大打击，但她仍继续参与共和主义运动，并于1917年加入新芬党，在其执行委员会中任职。独立战争期间，她当选为众议员，并在众议院设立的共和法院中担任地区法官。自那之后，她先后当选为众议员、参议员和都柏林市长。克拉克在1922年的宪法蓝本和后续一系列立法中都强烈地支持了妇女权利。为了获得支持，她引用了1916年的宣言中平等保护国家所有儿童的条款。\n\n在爱尔兰，没有人比克拉克更能代表1916年烈士们所付出的牺牲。她是总统一职的不二人选，除去行政职权外，克拉克将作为共和国的第一公民，以此缅怀所有为爱尔兰自由事业献出生命的人们。"
 POLITICS_DOUGLAS_HYDE_DESC:0 "§Y领导人介绍\n生于：§!1860年1月17日，爱尔兰罗斯康芒郡卡斯尔雷\n§Y爱尔兰语名：§!杜格拉斯·德·希德\n§Y政治生涯：§!学者、语言学家道格拉斯·海德出生于罗斯康芒郡，父亲是爱尔兰教会的教区长。早年，他对该地的爱尔兰语产生了浓厚的兴趣，尽管他出身贵族，但他对传播和保护爱尔兰语有着强烈的动力，尤其在爱尔兰语的使用率因为大饥荒出现了断崖式下跌后。\n\n海德最初以“快乐的小树枝”为笔名写作爱尔兰语诗歌和散文。后来他于1893年成立了盖尔联盟，这个致力于推广爱尔兰语言和文化的组织，其成立宣言由海德亲自撰写，题为《爱尔兰民族去英化的必要性》。\n\n盖尔联盟是一代爱尔兰民族主义者和共和主义者的摇篮，它以超党派的精神基础建立起来。虽然海德本人是民族主义者，但他希望同盟能够接纳任何忠实的人，后来当组织变得越来越政治化时，他便辞职并由约恩·麦克尼尔接手。自那之后，他在都柏林大学担任现代爱尔兰语首席教授，同时也担任参议员一职。\n\n考虑到他身上的众多身份，选出这样一位非天主教徒的总统是想要告诉世界，爱尔兰的国家认同是基于共同的文化遗产，而不是某一种宗教信仰。总统对他基本上不涉及政治的新角色感到满意，现在他主要以作为国家象征和文化大使的礼节性身份行事。海德让总统之位变得庄重朴素并获得了人民的普遍爱戴。"
 POLITICS_ERSKINE_CHILDERS_DESC:0 "§Y领导人介绍\n生于：§!1870年7月15日，英格兰伦敦梅菲尔\n§Y爱尔兰语名：§!R·阿拉斯坎·马坎赫勒\n§Y政治生涯：§!罗伯特·厄斯金·奇尔德斯踏过漫漫长路，终于登上了总统的宝座。\n\n奇尔德斯生于伦敦，父亲是英格兰人，母亲是英裔爱尔兰人。早年父母双亡后，他便在威克洛郡的母家寄养长大。奇尔德斯于英国完成了学业，且他的家庭在英国政界享有盛誉，因此他刚一毕业便理所当然地成为了下议院中身居要职的公务员。奇尔德斯的生长环境让他多多少少受到英式保守主义价值观的影响，这也让他作为志愿军参加了布尔战争。正是这场战争第一次让他对帝国主义的计划感到幻灭，也是他第一次意识到自己对爱尔兰地方自治事业的热情。他的战争经历也激起了他的创作热情，激励他写下了两部军事理论著作和一部影响深远的谍战小说。\n\n奇尔德斯平时酷爱游艇，同时对地方自治的不断延期施行颇感失望，因此他在世界大战前夕愈发不守规矩，开着自己的游艇“阿斯加德号”从德国给爱尔兰志愿军偷偷运送了几百支步枪。虽然奇尔德斯在世界大战期间作为情报与侦察官的优异表现让他赢得了英国政府授予的杰出服役十字勋章，但是英当局严酷镇压复活节起义并且试图在爱尔兰强征入伍的举措却让他彻底愤怒了。\n\n最终，奇尔德斯决定放弃温和的民族主义，义无反顾地回到了爱尔兰并加入了新芬党，并发挥自己文笔上的优势在第一届众议院出任新闻处主任。他的到来曾经备受质疑，许多人认为把他往好了想也不过是个背叛英国旧主的逆贼，而往坏了想说不定就是英国人派来的间谍。但他作为代表团的一员，促成了《英爱条约》谈判成功。他在其中表现出来的率直的共和主义思想更是让那些曾经怀疑他的人全部噤声了。\n\n此后，奇尔德斯便远离公众视野，把时间花在了写作以及与妻子茉莉出海航行上，偶尔他也会为政府充当海事顾问。如今他作为总统，也同样把一切政府事务交给了总理，自己除了正式露面外，只会公开发表一些有关爱尔兰国际关系的论文。奇尔德斯代表着一个对自己的过往能够安然接纳的爱尔兰国家，并且这个国家承认那些英裔爱尔兰人对爱尔兰民族主义与共和主义事业做出了伟大的贡献——例如托恩、艾默特、巴奈尔以及凯塞门。"
 IRE_new_constitution_event_tt: "§Y新宪法§!的§C各项条款§!§C将由一系列事件决定§!"
 IRE_parlrep_tt: "具有以下特质的新§Y仪式性总统§!将被选出：\n - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-5%§!\n - $MODIFIER_STABILITY_FACTOR$：§G+7.50%§!\n\n§Y[IRE.GetLeader]§!将保留现有的领袖特质，并取代§Y[GetPrimeMinister]§!担任§Y总理§!一职"
 IRE_new_constitution_focus_tt: "汇集共和国之核心原则，§C编订新§!§Y宪法§!§C的工作即将开始。\n\n该§!§Y国策§!§C将在事件链结束后自动完成。§!"
 IRE_New_Constitution_idea: "新宪法"
 IRE_New_Constitution_idea_desc: "为彻底同1922年的爱尔兰自由邦宪法划清界限，现政府起草了新的爱尔兰宪法。该版宪法明确了爱尔兰民族的国家主权，为改革后的民主制度奠定了根基，其在强调我国民主传统的同时，也阐明了民众的基本权利、我国的两院制立法机构——国家议会的存在及其权力界线、政府各部门之间的权力分立与制衡，以及司法的独立与审查。借助此版宪法，我们将建立一个更强大、更团结的爱尔兰民主制度。"
 IRE_ceremonial_president: "仪式性总统"
 IRE_Order_of_St_Patrick: "承认圣帕特里克勋章"
 IRE_draft_new_constitution: "起草新宪"
 IRE_draft_new_constitution_desc: "我们的首部宪法虽是我国政治与法律文化中的重要文件，但不可否认，它并非面面俱到。我们应该借此机会解决其中的一些问题，尤其是关于北爱尔兰的问题，也许还能让我们的一些原则融入爱尔兰法律的核心。"
 IRE_Decentralization: "权力下放的爱尔兰政府"
 IRE_Decentralization_desc: "与统一党追求的中央集权相反，瓦莱拉的爱尔兰政府选择进一步放权全国各地的地方议会。他希望通过让各地议会为当地人民做出决定满足来各地人民的需求，而不仅仅是都柏林和其他中心城市的需求。"
 ire.2600.t:0 "新宪法"
 ire.2600.d:0 "在历经经济萧条、外国干预、北方动乱等一系列事件后，爱尔兰终于得见曙光。它不仅仍葆其强大独立，而且还会比过去更加团结。爱尔兰全国上下业已重振旗鼓，人们也意识到，若想维持现有的繁荣与和平，变革便必不可少。上到各党各派政客，下到普通民众均认为爱尔兰需要一部共同协商、深思熟虑的宪法来确保国家的长治久安。\n\n作家兼教师米哈尔·奥格里哈以及知名作家、编辑、盖尔联盟的分会基廷联盟的创始人里什塔尔德·奥弗卢将共同编撰这部新宪法，新宪法亦将由爱英双语写成。现行宪法中大部分并无太大争议，因此顺理成章得以沿用。而一些有争议的内容则成为了讨论的焦点。\n\n各路势力都希望自己能对新宪法的内容拥有话语权，亦各自对争议问题表明了立场。新内容一经定稿，便将对未来产生深远影响，乃至于决定国家未来之走向。"
 ire.2600.a:0 "开干吧！"
 ire.2601.t:0 "共和国的形式"
 ire.2601.d:0 "宪法编订者面临的头一个问题便是共和国应当如何组成及其治理体制应如何运作。\n\n第一个方案得到了统一党的支持，那便是维持与现有“阿尔斯特特权”相似的制度，东北各郡议会将因此享有更为广泛的自治权，总统的国家议会中将永有保王派代表的一席之地，保王派亦将以“阿尔斯特事务部部长”的新官方角色长存于内阁之中。民族主义者为之愤懑不平，比起维持现状，他们更想看到新宪法相较于过去的变化。\n\n阿尔斯特统一派和共和党却更进一步，要求将对东北六郡完全权力下放载入宪法。\n——“在法律准许之范围内，依照权力下放之原则，东北六郡，亦即阿尔斯特地区拥有召开议会之权利。”\n这肯定会让东北六郡成为受保王党掌控的自治区。反对公开歧视的条款虽已明文写就，但民族主义者依旧对此表示强烈反对，在他们眼中，这和倒车回分治根本没有区别。\n\n另一边，陆军同志协会，以及颇令人玩味的是，还有新芬党，正大力推动建立一个由都柏林直接控制的单一制国家。\n——“国家之立法权独且唯独由国家议会掌握：其余各级立法机关均无在国家一级立法之权力”。\n以这一条款加上明确爱尔兰众议院驻地为都柏林的条款，肯定能在统一全国上下、剥夺北方议会的例外自治权上派上大用场。统一党希望对其支持者做出更多让步，但作为妥协，两党都同意保留布鲁克的职位，亦对各自在众议院中的代表席位做出有限度的承诺。\n\n共和党提出了一套新方案，亦即让各省各自召开本省的地区议会。\n——“四省均有召开职权范围受法律界定之联邦议会的权力。”\n从前倒没人考虑过这一套受美国启发的方法，但这确实能让各省更高效地解决地区性问题，尤其是与当地民族主义者和保王派之间的紧张局势有关的问题。"
 ire.2601.a:0 "维持现状"
 ire.2601.b:0 "对北方权力下放"
 ire.2601.c:0 "统一的单一制国家"
 ire.2601.e:0 "各省合成之联邦"
