 irelandflavour.386.d3: "盖尔运动协会成立于“盖尔复兴”时期的1884年，宗旨是保护、推广爱尔兰传统体育运动，而在实现这一目标的过程中，其所取得的成就是有目共睹的。在盖尔运动协会之前，“盖尔式”足球、曲棍球、手球、棒球基本都是个半死不活的状态，而在爱尔兰独立后，隶属于协会的俱乐部开遍了全国各地。虽说协会对于农村地区的影响要远大于其它地区，但如今，一说起“足球”，人们自然而然想到的都是盖尔足球。今天，协会依旧管理、组织着国内外的盖尔运动，其旗下的俱乐部和赛事也总是会吸引大量的观众。\n\n对于盖尔运动协会这样一个致力于文化振兴的组织，不难想象，无论是过去还是现在，其在政治领域都与爱尔兰民族主义有着一层密切的关系。协会的初创成员以及最早的一批赞助者中有许多都是芬尼亚派和地方自治派，协会的地方俱乐部也是爱尔兰共和兄弟会早期招兵买马的中心。独立战争期间，英国皇家军队于协会旗下的招牌——克罗克公园体育场举行的盖尔足球比赛期间对在场的平民观众展开了一场无差别的大屠杀，这就是鼎鼎大名的“血腥星期日”，这一事件是英军暴行的铁证。\n\n争取政治主权的斗争早已胜利多年，但敌人却从未放过爱尔兰及其人民：外国体育运动仍旧风靡全国，甚至在一些国人的心目中其地位还要更加高贵、更加优越。此等可悲之事态怎能教人无动于衷，而盖尔运动协会就是我们在体育领域民族解放的利刃与坚盾。现阶段，国家已与盖尔运动协会携手共进，虽目前为止尚未采取什么大动作，但对于协会以及盖尔运动的溢美之词已成为了复兴建筑师集会和奥金纳甘公开讲话的标配。\n\n不过，国家对于体育领域的管理实在是糟糕透顶。虽然盖尔运动协会早前曾短暂获得过管理爱尔兰全国体育运动的权力，但许多体育项目，包括那些从一开始就不应存在于爱尔兰的运动，却是由1922年成立的全国田径和自行车协会分管。显然，这个国家早就该来一场彻底的改革了，就比如扩大盖尔运动协会的权力。"
 irelandflavour.386.d4: "盖尔运动协会成立于“盖尔复兴”时期的1884年，宗旨是保护、推广爱尔兰传统体育运动，而在实现这一目标的过程中，其所取得的成就是有目共睹的。在盖尔运动协会之前，“盖尔式”足球、曲棍球、手球、棒球基本都是个半死不活的状态，而在爱尔兰独立后，隶属于协会的俱乐部开遍了全国各地。虽说协会对于农村地区的影响要远大于其它地区，但如今，一说起“足球”，人们自然而然想到的都是盖尔足球。今天，协会依旧管理、组织着国内外的盖尔运动，其旗下的俱乐部和赛事也总是会吸引大量的观众。\n\n对于盖尔运动协会这样一个致力于文化振兴的组织，不难想象，无论是过去还是现在，其在政治领域都与爱尔兰民族主义有着一层密切的关系。协会的初创成员以及最早的一批赞助者中有许多都是芬尼亚派和地方自治派，协会的地方俱乐部也是爱尔兰共和兄弟会早期招兵买马的中心。独立战争期间，英国皇家军队于协会旗下的招牌——克罗克公园体育场举行的盖尔足球比赛期间对在场的平民观众展开了一场无差别的大屠杀，这就是鼎鼎大名的“血腥星期日”，这一事件是英军暴行的铁证。\n\n盖尔运动协会的民族主义血统和居高不下的人气起初让政府头疼不已，毕竟我们是一个社会主义国家嘛。对此，都柏林方面同协会心照不宣，爱尔兰政府继续大力扶持盖尔运动，协会的一些高层虽对此感到不满，但协会依旧维持着其独立运作，双方之间也相安无事。不过，近几个月来，协会似乎同社会主义政府达成了和解，社会主义人士接连被接纳进了协会且进入了领导层，高级别的协会成员也频繁同政府官员一起，出席高曝光度的赛事。种种迹象表明，盖尔运动协会即使还没有变红，它也染上了点点粉色。"
 irelandflavour.386.a: "为爱尔兰体育干杯！"
 irelandflavour.387.t: "库丘林之死"
 irelandflavour.387.d1: "在爱尔兰众多的神话人物中，最出名的当属阿尔斯特的传奇英雄库丘林了。库丘林原名瑟坦达，因幼时出于自卫杀死了铁匠库兰的看门狗，而自愿代替守护其主，因而得名“库兰之猛犬”，即“库丘林”。库丘林习武于苏格兰，是阿尔斯特最强大的战士，其最著名的事迹见于《夺牛长征记》，以一己之力抵挡住了康诺特女王梅芙手下的千军万马，守护住了王国。\n\n库丘林的铜像由参加了1924、1928两届奥运会艺术大赛的雕塑家奥利弗·谢泼德设计，描绘的是库丘林的悲壮末路：库丘林把自己绑在了石柱上（有的版本说是用自己的肠子绑上的），身子立得挺直，三天后一只乌鸦停落其肩头，这时，敌人方才醒悟库丘林早已殒命。谢泼德虽是出身蒂龙郡的新教徒，但其同时也是名爱尔兰民族主义者，用他自己的话来说就是“我的政治原则很简单：我一直认为这个国家应是自由身”，此外，他还与爱尔兰的独立斗争有着非同一般的关系——他是帕德里克·皮尔斯的弟弟威利·皮尔斯的导师。\n\n虽然人们对这座雕像赞不绝口，但却无人愿意出手将其买下，而为了避免如此优秀的作品落得个在工坊中吃灰的结局，政府决定亲自上阵，将其购为国有。不过，具体要将其安置在哪，目前尚未有个定论。有人说，应把它放在复活节起义的发源地——都柏林邮政总局那里，以展现爱尔兰人民的无畏气概，并在欧陆局势一触即发的当下，唤醒了人们心中的爱国情结。不过，亲英派们也想跟这位神话英雄扯上关系，理由就是库丘林率领阿尔斯特同爱尔兰的其它省份作战，此外，还有人建议应把雕像迁至贝尔法斯特的市政厅，以共同的阿尔斯特身份帮助弥合当地不同教派民众间的对立——不过，这一建议同样招来了许多人的质疑。"
 irelandflavour.387.d2: "在爱尔兰众多的神话人物中，最出名的当属阿尔斯特的传奇英雄库丘林了。库丘林原名瑟坦达，因幼时出于自卫杀死了铁匠库兰的看门狗，而自愿代替守护其主，因而得名“库兰之猛犬”，即“库丘林”。库丘林习武于苏格兰，是阿尔斯特最强大的战士，其最著名的事迹见于《夺牛长征记》，以一己之力抵挡住了康诺特女王梅芙手下的千军万马，守护住了王国。\n\n库丘林的铜像由参加了1924、1928两届奥运会艺术大赛的雕塑家奥利弗·谢泼德设计，描绘的是库丘林的悲壮末路：库丘林把自己绑在了石柱上（有的版本说是用自己的肠子绑上的），身子立得挺直，三天后一只乌鸦停落其肩头，这时，敌人方才醒悟库丘林早已殒命。谢泼德虽是出身蒂龙郡的新教徒，但其同时也是名爱尔兰民族主义者，用他自己的话来说就是“我的政治原则很简单：我一直认为这个国家应是自由身”，此外，他还与爱尔兰的独立斗争有着非同一般的关系——他是帕德里克·皮尔斯的弟弟威利·皮尔斯的导师。\n\n虽然人们对这座雕像赞不绝口，但却无人愿意出手将其买下，而为了避免如此优秀的作品落得个在工坊中吃灰的结局，政府决定亲自上阵，将其购为国有。之后，政府将其安置在了最合适的位置——复活节起义的发源地都柏林邮政总局，以向世人展现爱尔兰人民的无穷勇气、毅力与爱国精神。不过，亲英派们也想跟这位神话英雄扯上关系，他们以库丘林率领阿尔斯特抵抗爱尔兰其它省份为由，建议将雕像迁至贝尔法斯特——当然了，这一说法遭到了各届的群嘲，因为大家都清楚，库丘林是名盖尔爱尔兰人，他不会向外国君主献媚，也不会割舍掉自身的爱尔兰文化。"
