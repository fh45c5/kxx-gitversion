 ire.306.t:0 "奥金纳甘谴责整合主义"
 ire.306.d:0 "虽然复兴建筑师是爱尔兰最著名的国家民粹主义组织，但其他一些受全球各地“整合主义”组织，如葡萄牙的卢西塔尼亚整合运动、墨西哥的国家整合党和法兰西行动启发的组织，都未能成功蛊惑奥金纳甘痴迷于他们的理想。乌戈·奥尼尔是整合主义圈子中的佼佼者，虽然其身居葡萄牙，但不死心的复辟者们还是想将其扶上爱尔兰君主的王座。奥金纳甘愤怒地回击了这些团体的妄想，把对君主制的痴迷批为“过时的疯狂”，并宣布准备废除爱尔兰的一切贵族制度残余。虽然保王派们同复兴建筑师的爱尔兰复兴、恢复古代氏族之王的想法有着诸多共通之处，但奥金纳甘迅速断绝了两者之间的一切关系，坚定了自身的共和立场。奥尼尔的卢西塔尼亚整合主义派不是第一个意图操纵复兴建筑师走向保王派理想的人，雷蒙德·莫尔顿·奥布赖恩也曾试图以复兴建筑师为跳板为自己夺取爱尔兰王位，但其最后只是沦为了公众和领袖的笑料与饭后谈资。"
 ire.306.a:0 "整合主义真是蠢……"
 ire.307.t:0 "你好，先生，你会说爱尔兰语吗？"
 ire.307.d:0 "在复兴建筑师的盖尔语复兴计划全面铺开后，各地涌现出了数个“圆徽旅”——这里的“圆徽”是指用来标识那些能流利说，且愿意说爱尔兰语的人的胸针或徽章。尽管这些队伍大多是非官方性质的，但其成员大多是愤怒的公民与一些爱尔兰教授，他们也已得到了领袖的批准，可以按照自己的意愿进行司法审判。这些小分队在街上巡逻，随机测试市民对爱尔兰语的熟练程度。通过考试的人会得到表扬，偶尔还会得到一杯酒，而不及格的人有两个选择：放弃他们的英国人身份，参加强制性的爱尔兰语课程，否则便将面临他们的愤怒。惩罚通常是巨额罚款或短期监禁，但最过分的英格兰蛮族走狗将面临终身监禁，或在极端情况下被当场射杀。"
 ire.307.a:0 "爱尔兰语区：禁止英语！"
 ire.3260.t:0 "瓦莱拉的混合根基"
 ire.3260.d:0 "德·瓦莱拉出生于美国纽约市，父亲是西班牙艺术家，母亲是来自利默里克郡的爱尔兰人。埃蒙·德·瓦莱拉怎么成了爱尔兰领导人？这实在是个有趣的故事。他出生时叫乔治·德·瓦莱拉，婴儿时改名为爱德华·德·瓦莱拉，后来他回到翡翠岛后又改名为埃蒙。三四岁时，德·瓦莱拉的父亲便去世了，那时他还是个孩子，他回到了爱尔兰，和他的叔叔住在一起。德·瓦莱拉在上学期间一直沉浸在爱尔兰的生活方式中，对学习、爱尔兰母语、政治和橄榄球产生了热情——这些爱好最终伴其一生。德·瓦莱拉年轻时就参与了盖尔语复兴运动，险些被英国人处决，后来，他将其作为自己进入政界的切入点，从此成为了独立英雄和自由斗士，随后成为了爱尔兰最大的保守派组织共和党的党魁，现在，他又领导起了爱尔兰。然而，在整个过程中，德·瓦莱拉一直与他的另外两个祖国——美国与西班牙保持着密切的联系，并与两个地方的在世家人朋友以及新盟友常常来往，甚至还与位于新泽西州泽西城的圣帕特里克天主教堂维持着联系，他的父母就是在那里结婚的，他自己也在那里受洗。这些关系甚至在政治上影响了德·瓦莱拉，这位政治家从坦慕尼协会和纽约民主党等爱尔兰人团体那里获得了灵感，甚至让他愿意支持西班牙-爱尔兰血统的奥唐纳家族，让他们成为爱尔兰国王的可能人选。这就是德·瓦莱拉奇特而又交融万物的故事，通过他奇特而又可靠的执政手法，我们将被引向繁荣、虔诚而骄傲的未来。"
 ire.3260.a:0 "永远不要忘记你的传统"
 ire.3261.t:0 "爱尔兰财政保守主义"
 ire.3261.d:0 "肖恩·勒马斯，这位年轻的议员很快被人称为现代爱尔兰经济之父，作为供应部长与正式意义上的工业与商务部长，他是德·瓦莱拉的首席经济部长，又因为他在共和党中飞黄腾达，他的职业生涯已是一片坦途。推动年轻人接受免费教育并获得中等教育、奉行财政保守主义、鼓励工业发展、增加爱尔兰企业的外国投资、加强与欧洲大陆的关系，勒马斯雄心勃勃，心思巧妙而广受欢迎的政策让他在德·瓦莱拉的羽翼下愈发壮大。德·瓦莱拉掌舵，勒马斯助力，爱尔兰将朝着一个保守、有利可图且繁荣的未来前进。"
 ire.3261.a:0 "勒马斯掌舵位，爱尔兰将驶向荣耀"
 ire.348.t:0 "我们家乡之岛的名字"
 ire.348.d:0 "爱尔兰在历史上也被称作爱尔、爱茹、伊尔涅、希伯尼亚等，而在遭盎格鲁鬼子征服之前，我们在英语中被称为爱尔兰，并有许多别名，如黑蔷薇、胡里痕的凯瑟琳、爱尔兰母国、可怜的老妇人、翡翠岛、古绿地等等。既然我们已摆脱了英国的控制，也在复兴自己祖传的盖尔语的过程中愈发疏远英语，许多爱尔兰人都正敦促我们正式以盖尔语重新命名国家，改变我们在国内外的身份，让世上所有人都能见证我们涅槃重生的凯尔特辉煌。然而，我们现所居住的这个自由国家中的许多现代主义者与爱国者深深依恋着他们为之战斗的国名，这也是他们的同志为之牺牲的名字，这些老兵反而建议我们维持现有国名不变。我们该作何决定呢？"
 ire.348.a:0 "维持翡翠岛现在的名字，爱尔兰永存！"
 ire.348.b:0 "盖尔语中的爱尔"
 ire.348.c:0 "古盖尔语中的爱茹，一位凯尔特女神之名"
 ire.348.e:0 "爱琳，另一位凯尔特女神，因“爱尔兰万岁”的口号而广为人知"
 ire.348.f:0 "爱霖，爱琳一词的现代化变体"
 ire.348.g:0 "艾维尼亚，伟大的托勒密用这个名字称呼我们的岛屿"
 ire.348.h:0 "再看看别的"
 ire.349.a:0 "伊尔涅，希腊神话阿尔戈英雄中的名字"
 ire.349.b:0 "俄古吉亚，荷马史诗《奥德赛》中的名字，也是亚特兰蒂斯的命定之所"
 ire.349.c:0 "茂林岛，我岛的拉丁语名称“涅墨罗萨岛”之直译"
 ire.349.d:0 "终末地，我岛的拉丁语名称“泰拉芬利亚”之直译"
 ire.349.e:0 "穆伊西尼斯，米莱亚的西裔爱尔兰后代使用的古老名字"
 ire.349.f:0 "斯科舍，威震罗马与英格兰的苏格兰-爱尔兰海盗团"
 ire.349.g:0 "希伯尼亚，爱尔兰的诗人们特别喜欢用这个罗马名字"
 ire.349.h:0 "再看看别的"
 ire.350.a:0 "高贵岛，我岛的拉丁语名称“诺比利斯岛”之直译"
 ire.350.b:0 "命运岛，古老的凯尔特名字，因其与达奴神族有关而受到保王派的青睐"
 ire.350.c:0 "再看看别的"
 ire.351.t:0 "都柏林的液体核心"
 ire.351.d:0 "1759年，亚瑟·吉尼斯在都柏林的圣詹姆斯门开创了吉尼斯啤酒，它是爱尔兰的国酒——一种黑色或深红宝石色的爱尔兰干性黑啤酒，被许多人戏称为“液体面包”。都柏林近一半的人受雇于该啤酒厂或与之有某种联系，它是爱尔兰最大的公司之一，也是都柏林乃至全国的工业金融中心。借由补贴该公司并与该品牌紧密合作，我们可以利用他们巨大的储备金来造福国家。有吉尼斯帮助我们，爱尔兰的经济便太大而不能倒、也太美味而不能倒！"
 ire.351.a:0 "在他们的帮助下，爱尔兰将蓬勃发展"
 ire.352.t:0 "与英国的盟友谈和？"
 ire.352.d:0 "英格兰在燃烧，伦敦桥终于倒塌。在几个世纪的羞辱和折磨、压迫与憎恨后，一切都已拨乱反正，我们大仇得报，将这些疯狗狠狠地踩在了脚下。但是，英格兰不是在独自战斗，在海的那边，他们残酷的盟友依然在袭击我们的船只，为未来的战争做准备。我们盟友不多，现在入侵大陆不过只是在做白日梦。我们应该直面现实，与英格兰的盟友商讨和解，还是英勇向前，向炼狱进军？"
 ire.352.a:0 "即使心有不甘，也还是应见好就收"
 ire.352.b:0 "我们要把巴黎烧成白地！"
 ire.353.t:0 "爱尔兰请求和平"
 ire.353.d:0 "震惊世界，兴许也震惊了我们愚蠢的英国盟友的事发生了，爱尔兰人自翡翠岛集结起来，将全英格兰都置于他们的控制之下，并在一场疯狂的复仇行动中将这个国家的大部分夷为平地，长期受苦受难的爱尔兰人终于实现了几个世纪以来期待着的复仇。我们可以发动一场反制入侵来拯救英格兰人，但这样做的代价实在过于昂贵，而且我们还有其他更为棘手的敌人要处理。爱尔兰人似乎也察觉到了这一点，向我们提出了一个体面的和平提议，要求我们放弃不列颠群岛上的一切土地，而英格兰在世界各地的其余领地则归我们所有，并结束所有敌对行动。我们是应该在英国人的至暗时刻抛弃他们，转而处理更迫切的事物，还是应该像1066年那样横渡英吉利海峡，再次拯救英国人？"
 ire.353.a:0 "这些条件可以接受，签署和约"
 ire.353.b:0 "我们和我们的老盟友站在一起，并为拯救不列颠人奔袭伦敦"
 ire.354.t:0 "法国同意了！"
 ire.354.d:0 "令我国代表团震惊的是，法国同意了我们的条件，他们将完全放弃不列颠群岛以换取不列颠在我国势力范围之外的国际领地，并达成全面和平。我们终于赢了，我们打败了英国人，完成了我们的复仇，也不必为此所累。盎格鲁豺狗最终落败了，他们的盟友也作鸟兽散了。让我们结束这一切吧。"
 ire.354.a:0 "现在我们要随心所欲地重建英格兰"
 ire.355.t:0 "法国拒绝了！"
 ire.355.d:0 "该死的！海峡对岸的臭法国佬拒绝了我们用和平换取英国土地的要求，现在他们决心用战争机器摧毁我们。一群傻瓜！我们将把巴黎夷为平地，我们将把敌人踩在脚下。我们要驶向欧洲大陆！爱尔兰万岁！"
 ire.355.a:0 "巴黎将因他们的狂妄熊熊燃烧"
 IRE_taking_decision:0 "正在进行其他决议"
 IRE_take_wales:0 "夺取威尔士"
 ire.2511.t:0 "扩大紧急状态？"
 ire.2511.d:0 "爱尔兰共和党及其领导人——爱尔兰总统埃蒙·德·瓦莱拉的权力、野心和对外部威胁的近乎偏执的疑虑只增不减，随着他对爱尔兰的控制越来越紧，爱尔兰正在逐步滑向威权主义。尽管他这样做是为了保护爱尔兰和爱尔兰人民，但大多数民众已经开始厌恶戒严令和自由受限的现实，数千人开始公开批评瓦莱拉总统。我们应该继续无休止地延长紧急状态，还是应该最终再次向民主屈服？"
 ire.2511.a:0 "瓦莱拉需要更多的权力来妥善处理爱尔兰的敌人！"
 ire.2511.b:0 "转念一想……"
 ire.3230.t:0 "“大吉姆”迎来了结局"
 ire.3230.d:0 "詹姆斯·拉金，爱尔兰工人联盟的负责人，他差点通过地下工团主义分子的选举舞弊行为成功攫取了爱尔兰的总统之位，自他从都柏林的公寓中消失，成为一个地下叛军领导人以来，他就一直让柯林斯芒刺在背。自1937年选举的真实结果被揭露后，拉金就一直被政府通缉，在柯林斯解散国家议会后不久，他的组织也被取缔，尽管爱尔兰工人联盟和爱尔兰共和军中的一小撮人试图抵抗，反抗“大块头”和他的支持者，但这无疑是自寻死路。拉金本人则一直在东躲西藏，在一小群保镖与狂热的支持者的陪同下徘徊于内地的各个小城镇，妄图为他们的事业拉拢民心，他还对人民大加洗脑，让他们起来反抗柯林斯。然而，随着反社会主义运动愈演愈烈，拉金自觉不能再依赖他的同胞，开始卷起铺盖，试图冒险逃往美国。\n\n这次逃跑企图终究让他走到了穷途末路，一个戈尔韦附近的勇敢线人向当局揭发，声称拉金与他的走狗将通过港口逃往海外。\n\n夜幕降临之时，爱尔兰军情局的士兵们突然出现，正在等待前往新世界的船的拉金被打了个措手不及；他的随行人员负隅顽抗，但终不敌政府部队。拉金逃到了一个仓库里，在士兵扫荡仓库的时候，他在楼上躲藏了起来；士兵们最终没有找到爱尔兰头号通缉犯的踪迹。然而，就在拉金自以为能够逍遥法外之时，他藏身处下方的地板塌了，这个赤匪直接从约三十英尺的高空坠落下来，最终一命呜呼。\n\n当大楼里的士兵断定拉金摔死了的时候，他们朝他身上补了几枪，确保这个混蛋不会诈尸还魂。"
 ire.3230.a:0 "别让公众知道拉金的死因"
