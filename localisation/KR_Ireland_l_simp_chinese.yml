 POLITICS_MICHAEL_COLLINS_DESC:0 "迈克尔·柯林斯是爱尔兰的救世主和民族英雄，他凭借自己的声望得以长期执政。生于科克市的柯林斯参加了1916年的复活节大起义，并随后担任爱尔兰共和党人兄弟会的主席。为了避免1916年的错误，他在战争中把爱尔兰共和军打造成了一支精干的游击部队。在1921年，他被派去进行英爱条约的谈判。谈判中他威胁说会在德国的支持下继续战斗，于是他获得了条约中的全部32个县，但是他并没能争取到独立建国的权利，因为英国人害怕爱尔兰一旦独立便会立即成为德国的桥头堡。在被埃蒙·德·瓦莱拉驱除出新芬党后，他成功建立了自己的党派，即爱尔兰统一党，该党很快便取代了新芬党的领导地位。在英国大革命后，他宣布建立独立自主的爱尔兰共和国，并在阿尔斯特击败了由北爱尔兰英统分子掀起的叛乱。面对迫在眉睫的另一场大战，柯林斯主张振兴经济、重整军备，以捍卫爱尔兰的独立。"
 POLITICS_CATHAL_BRUGHA_DESC:0 "卡哈尔·布鲁阿本名查尔斯·威廉·圣约翰·伯吉斯，是天主教徒与新教徒结合的后代，他在参加盖尔同盟后便改了名。布鲁是复活节大起义中涌现的战争英雄，同时也是英爱条约签订后新芬党残党的领袖。在独立战争时期，他便已经是柯林斯坚定的反对者了，后来他成为民主反对派的领袖，这是一个由反对柯林斯的各民主党派们组成的联盟。但是随着共和党人运动中新一代的崛起，他晚年越来越成为一个只起到团结作用的象征。工党解体后，许多前工党成员转而加入了布鲁麾下，这大大加强了布鲁及其政党的政治力量，他们主张遵循1919年民主纲领，建立一个社会民主主义的爱尔兰，并建立一个亲德同盟以对抗他们在不列颠和加拿大的仇敌们。"
 POLITICS_FRANK_MACDERMOT_DESC:0 "弗兰克·麦克德莫特是库拉文亲王休·奥罗克·麦克德莫特的小儿子。他在世界大战期间服役于皇家后勤部队，战后移民美国。在美国经济崩溃后，他回到爱尔兰并加入了亲英国的民族中央党，他依靠出色的演讲能力最终当上了该党的领袖。作为对柯林斯政府及民主反对派孤立或亲德倾向的坚定抨击者，他强烈主张亲近协约国集团并与英统派社区和睦相处。"
 POLITICS_JIM_LARKIN_DESC:0 "詹姆斯·拉金，生于英格兰，后随家庭迁至爱尔兰。他在贫穷中长大，最后成为了一位工会组织者，并与詹姆斯·康诺利合作成立了工党，他最出名的事迹是参加了1913年失败的都柏林大罢工。在罢工失败后，他搬至美国并加入美利坚社会党。1923年回到爱尔兰后，拉金被爱尔兰工团主义者们视作英雄般欢迎，并最终掌控了工人联盟，他希望利用人们对英爱条约的不满而像法国那样掀起一场工团主义起义。由于告密者事前泄露了公民军起义者的计划，起义失败了，工党也分崩离析。拉金选择脱离工党，转而组建起爱尔兰工人联盟，并最终赢得了1937年大选。爱尔兰公民军由于他们的忠诚而遭受了巨大的损失，官方抹去了他们在复活节大起义中的作用，同时创始人詹姆斯·康诺利的作用也被淡化。"
 POLITICS_GEAROID_O_CUINNEAGAIN_DESC:0 "加莱德·奥金纳甘是一位激进的爱尔兰语学者，他出生于一个贝尔法斯特的中产阶级天主教家庭，他加入了陆军同志协会，并依靠个人魅力、领导能力以及被蓝衫军领袖约恩·奥达菲所赏识的激进理想而顺利晋升为爱尔兰司法部部长。作为司法部部长，他通过了镇压工团主义者的法案并推行反游民法以迫害帕韦社区，同时他也利用自己的影响力推广爱尔兰语。奥金纳甘也与罗马尼亚铁卫团保有联系，他试图在爱尔兰建立一个相仿的政体。最终，他建立了他自己的政党，即复兴建筑师，以复兴爱尔兰语，他将在5年后禁止英语，并制定强力的反工团政策。"
 POLITICS_PADRAIC_O_MAILLE_DESC:0 "帕德拉克·奥马利曾是新芬党的创始人之一，他也曾是爱尔兰志愿军的一员。奥马利是激进的天主教反工团主义政党爱尔兰天主教阵线的领袖，他支持天主教法团主义，并支持与西班牙的卡洛斯派结盟。由于他反工团的主张，他差点就因爱尔兰公民军在1932年的暗杀而死，尽管他因此身受重伤但仍活了下来。"
 POLITICS_SEAN_LEMASS_DESC:0 "肖恩·勒马斯曾是复活节起义及独立战争时期的志愿军，没过多久又成为了英爱条约后由新芬党分裂而出的爱尔兰共和党的知名领袖。勒马斯是工业化的倡导者与资本主义的信徒，他同时也相信与不列颠联盟恢复正常关系会有利于爱尔兰的贸易与经济。他支持实行灵活的，基于国家需要的外交政策，这与其在爱尔兰共和党内的派别及对外交政策有所偏见的其他民主党派形成了鲜明的对比。"
 POLITICS_DE_VALERA_DESC:0 "埃蒙·德·瓦莱拉，生于纽约，他的父亲是西班牙人而母亲是爱尔兰人，他在两岁时被带去了爱尔兰生活。他曾是复活节大起义时的一名指挥官，也曾是独立战争时的政治领袖。但由于英爱条约签订后的一些糟糕的政治举动和不幸，他最终陷入政治上的孤立。尽管柯林斯拥有惊人的威望，瓦莱拉仍然将其驱除出了新芬党。工党解体后，大批前工党分子涌入该党，并与更希望建立亲德联盟的民族主义者们发生争端，这与瓦莱拉的孤立主义和中立主义信条相背，这也使得他后来被孤立。他脱离后建立的新党派，爱尔兰共和党，最终也未能成功，成为了一个民主反对派中的小党派……"
 IREUOB_DET2:0 "英国人同意了我们的提议"
 IRE_american_civil_war:0 "对美国内战的反应"
 IRE_american_civil_war_desc:0 "世界大战结束时美国的经济崩溃所引发的政治紧张局势最终导致了美国内战的爆发。由于我国与美国关系密切，爱尔兰很可能遭受牵连，我们必须为任何可能的后果准备好应对措施。"
 IRE_SENDIRA:0 "派遣爱尔兰共和军志愿军"
 IRE_SENDIRA_desc:0 "[IRE_SENDIRA_desc_loc]"
 IRE_send_ira_desc:0 "美国已经陷入混乱，工团主义者和狂热分子们试图接管这个国家。即使我们与美利坚合众国间的关系不一定是最好的，但我们也许应该继续支持合众国作为一个稳定的壁垒，以对抗日益汹涌的激进主义。"
 IRE_send_ira_syndie_desc:0 "美国正卷入自己的革命。我们应该帮助大洋彼岸的同志们进行自己的斗争。许多爱尔兰共和军志愿者愿意去支持他们。"
 IRE_SANCTUARY:0 "庇护所"
 IRE_SANCTUARY_desc:0 "由于美国内战的爆发，许多在美国的爱尔兰后裔决定回到自己祖国爱尔兰，试图逃离美国的战乱。我们有责任帮助我们的爱尔兰兄弟姐妹们！"
 IRE_REFUGEEWORK:0 "难民就业计划"
 IRE_REFUGEEWORK_desc:0 "自从到达爱尔兰之后。很多难民都面临着就业困难的问题，这为我们的社会造成了一定的负担。我们的解决方案是将这些难民安排进行对公共设施的建设，这会有助于爱尔兰的发展。"
 IRE_REFUGEEFIGHT:0 "招募战斗人员"
 IRE_REFUGEEFIGHT_desc:0 "自从到达爱尔兰之后。很多难民都面临着就业困难的问题，这为我们的社会造成了一定的负担。我们的解决方案是将这些难民招募到军队里面来，来为他们第二祖国服务。"
 IRE_DEFENCE:0 "共和国国防"
 IRE_DEFENCE_desc:0 "经过700年的英国统治，爱尔兰人民终于获得了独立。然而，英国和加拿大仍然威胁着爱尔兰，如果他们要发动战争，爱尔兰人民必须准备好进行战斗，用他们对地形的优越知识和决心来保卫他们的自由。"
 IRE_IEAA_INDUSTRY:0 "爱尔兰经济进步法年度重心：工业"
 IRE_IEAA_RND:0 "爱尔兰经济进步法年度重心：研发"
 IRE_IEAA_WR:0 "爱尔兰经济进步法年度重心：工人权利"
 IRE_IEAA_ELEC:0 "爱尔兰经济进步法年度重心：电子技术"
 IRE_IEAA:0 "爱尔兰经济进步法"
 IRE_IEAA_desc:0 "尽管我们已经取得了自由，但我们小小岛屿的经济发展已经停滞了相当一段的时间，甚至某些地区已经滋生了腐败，但随着爱尔兰经济进步法的通过，众议院将会得到授权来解决这一重要问题，爱尔兰可能不过是个小小的岛国，但她有着勤奋的人民，她的城市也有很大的发展空间。"
 ire.ieaa.tt:0 "\n通过爱尔兰经济进步法并选择国家的经济发展方向。"
 ire.debtscheme.tt:0 "\n每年将额外§O大幅§!减少国债。"
 ire.9.t:0 "众议院的经济发展计划"
 ire.9.d:0 "随着爱尔兰经济进步法的通过，爱尔兰政府对民众宣布会对经济进行快速而彻底的改革。根据法案规定，政府现在需要决定每年发展的重点并作出改善，共和国总统迈克尔·柯林斯以及民族中央党的弗兰克·麦克德莫特认为，爱尔兰应该把重点放在尽快建立起自己独立的工业体系上。由吉姆·拉金领导的工团主义联盟认为，赋予工人工会权力是提高我们国家生产积极性的最好办法。最后，新芬党建议关注主流工业技术的研究和开发。"
 ire.9.a:0 "柯林斯的主意不错"
 ire.9.b:0 "站在保守派与自由派一边"
 ire.9.c:0 "社会主义者说到点子上了"
 ire.10.t:0 "众议院的经济发展计划"
 ire.10.d:0 "和往年一样，众议院再议年度经济大计。政坛权要立场如旧。柯林斯总统和统一党继续要求进行快速工业化。而工团主义者仍然要求给予工人更多的权利和更好的待遇来解决问题。新组建的自由和民主联盟认为爱尔兰最好进行研究和开发项目。"
 ire.10.a:0 "柯林斯永远是对的"
 ire.10.b:0 "新芬党和共和党是对的"
 ire.10.c:0 "这些赤匪或许说对了一次……"
 ire.11.t:0 "众议院的经济发展计划"
 ire.11.d:0 "随着爱尔兰经济进步法的通过，爱尔兰政府对民众宣布会对经济进行快速而彻底的改革。根据法案规定，政府现在需要决定每年发展的重点并作出改善，前独裁政府的统一党和他们温和派的合作党派民族中央党认为，爱尔兰应该把重点放在尽快建立起自己独立的工业体系上。由吉姆·拉金领导的工团主义联盟认为，赋予工人工会权力是提高我们国家生产积极性的最好办法。最后，新芬党建议关注主流工业技术的研究和开发。"
 ire.11.a:0 "民主派和自由派才是正确的"
 ire.11.b:0 "统一党和共和党说得对"
 ire.11.c:0 "社会主义者说到点子上了"
 ire.12.t:0 "众议院的经济发展计划"
 ire.12.d:0 "和往年一样，众议院再议年度经济大计。政坛权要立场如旧。民族中央党和统一党继续要求进行快速工业化。而工团主义者仍然要求给予工人更多的权利和更好的待遇来解决问题。新组建的自由和民主联盟认为爱尔兰最好进行研究和开发项目。"
 ire.12.a:0 "新芬党和农业派是对的"
 ire.12.b:0 "统一党和保守派说到点上了"
 ire.12.c:0 "这些赤匪或许说对了一次……"
 ire.13.t:0 "众议院的经济发展计划"
 ire.13.d:0 "随着爱尔兰经济进步法的通过，爱尔兰政府对民众宣布会对经济进行快速而彻底的改革。根据法案规定，政府现在需要决定每年发展的重点并作出改善。革命工人团体认为，爱尔兰应该把重点放在尽快建立起自己独立的工业体系上。爱尔兰工人同盟认为，赋予工人工会权力是提高我们国家生产积极性的最好办法。最后，自由爱尔兰建议关注主流工业技术的研究和开发。"
 ire.13.a:0 "自由爱尔兰说得对"
 ire.13.b:0 "革命工人团体的建议看上去不错"
 ire.13.c:0 "爱尔兰工人同盟的建议或许可行"
 ire.242.t:0 "众议院的经济发展计划"
 ire.242.d:0 "和往年一样，众议院再议年度经济大计。政坛权要立场如旧。革命工人团体继续要求进行快速工业化。而爱尔兰工人同盟仍然要求给予工人更多的权利和更好的待遇来解决问题。自由爱尔兰认为爱尔兰最好进行研究和开发项目。"
 ire.242.a:0 "这一次自由爱尔兰说对了"
 ire.242.b:0 "革命工人团体言之有理"
 ire.242.c:0 "爱尔兰工人联盟的想法不错"
 IRE_ARD:0 "开始农业改革"
 IRE_ARD_desc:0 "爱尔兰的农村地区的发展到目前为止从来没有被政府所重视过，这样一来如果要进行大刀阔斧的改革，农村便是最好的起点。与欧洲大陆相比，我们的农耕方法已经过时了，而且我们的基础设施也非常落后。"
 ire.ard.tt:0 "\n开始对爱尔兰的§Y农业产业§!和§Y基础设施§!进行改革。\n\n"
 ire.ard.no.tt:0 "\n§G保持标准的工业增长水平。§!\n\n"
 ire.59.t:0 "驱动农业改革开始"
 ire.59.d:0 "我们已经把我们的农村地区丢在改革的范围之外太久了，现在是时候对农村进行一场彻底的改革了。爱尔兰正在快速的向前发展，我们的农村地区也应该加入进来，更何况我们大部分的传统行业都依赖于农业。时代已经变了，既然农村还是我们经济的重要组成部分，我们就需要在最短的时间内对它进行现代化改造。另外，爱尔兰大部分的乡村道路都处于完全失修的姿态，而负责道路维护职责的目前都是私人企业。如果我们创建一个专门用于道路维护的部门，我们的运输网络应该能够得到极大的改善，这样也使得我们可以让人们更方便的在全国各地出行和运输货物。当然这样也会带来巨大的经济支出，因而需要谨慎的权衡利弊。"
 ire.59.a:0 "让我们合理的去分配资金吧"
 ire.59.b:0 "我们可以做出更大笔的投资"
 ire.59.c:0 "这是我们国家的命脉！尽可能的给予投资！"
 IRE_MFR:0 "机械化农业改革"
 IRE_MFR_desc:0 "毫无疑问，农业是我们国家中最重要的组成部分，然而我们现在的农业技术却十分落后，我们在欧洲大陆和美洲看到了机械化耕作的便利，如果我们也实行机械化耕作制度，我们可以让我们的农场生产更多的粮食，喂养更多的人"
 ire.60.t:0 "投资农业机械化改革"
 ire.60.d:0 "在庞大的投资政策的指导下，我们现在可以开展比以往任何时候都更加深入的农业改革了。机械化的耕作方式不仅可以让我们彻底摆脱爱尔兰大饥荒的阴影，还能帮助我们增加人口。"
 ire.60.a:0 "改革势在必行"
 ire.60.b:0 "代价有点昂贵了，我们应该停下来"
 IRE_MFR1:0 "机械化农业改革"
 IRE_MFR1_desc:0 "我们已经开始向我们的农民提供机械化农业机械的基本供应，使我们能够初步的改善我们的粮食生产。"
 IRE_MFR2:0 "区域性机械化农业改革"
 IRE_MFR2_desc:0 "我们已经成功的将机械化农业设备分配到我们最贫穷的乡村地区，这样一来我们就能够显著的改善我们的粮食生产能力。"
 IRE_MFR3:0 "全国性的机械化农业改革"
 IRE_MFR3_desc:0 "我们已经在全国推广机械化的农耕技术，我们的农村生产的食物比过去翻了十几番，爱尔兰大饥荒的阴影已经一去不复返了！"
 IRE_RRMB:0 "乡村翻修和维护委员会"
 IRE_RRMB_desc:0 "爱尔兰的农村地区的基础设施需要大量的翻新和维护工作，但目前我们没有任何公共机构来负责此事，从而使得农村基础设施的相关事宜落到毫无可靠性的私营企业手中。如果我们创建一个政府机构来专门负责基础设施的维护和翻新，我们就可以保持我们的道路得到充分的维护和高质量的修复工作，而如果国家进入战争状态，这样的组织也可以抽调去用于负责其他军用设施的维护。"
 ire.61.t:0 "维护委员会投资"
 ire.61.d:0 "政府对乡村翻修和维护委员会追加了大笔的资金，如今，新的翻修团队可以招募更多的人员、以更高效的方式开展业务了。"
 ire.61.a:0 "全速前进"
 ire.61.b:0 "几个坑洼而已，不是什么大不了的事情"
 IRE_RRMB1:0 "维护委员会"
 IRE_RRMB1_desc:0 "爱尔兰农村翻新和维护委员会致力于修复受损老化的基础设施，而在战争时刻，他们也会负责受损工厂和军用设施的维修工作。"
 IRE_RRMB2:0 "区域性维护委员会"
 IRE_RRMB2_desc:0 "爱尔兰农村翻新和维护委员会致力于修复受损老化的基础设施，而在战争时刻，他们也会负责受损工厂和军用设施的维修工作，用于得到了额外的投资，委员会的运作更加高效了。"
 IRE_RRMB3:0 "全国性维护委员会"
 IRE_RRMB3_desc:0 "爱尔兰农村翻新和维护委员会致力于修复受损老化的基础设施，而在战争时刻，他们也会负责受损工厂和军用设施的维修工作，用于政府的大批量投资，委员会的运作效率极其高效。"
 IRE_TNTN:0 "跨爱尔兰国家交通网"
 IRE_TNTN_desc:0 "英国人给我们留下的铁路十分老旧，与欧洲新建的高速铁路相比较简直是天壤之别，因此我们应该向欧洲大陆的国家学习，让我们的铁路系统现代化。新式铁路极大地有利于我们的生产力发展。"
 ire.62.t:0 "投资跨爱尔兰交通网"
 ire.62.d:0 "我们已经成功对铁路系统进行了现代化改造，民众出行和货物运输因此有了极大的改善。现在我们的预算允许我们进行更大的投资，但我们也要承担相应的代价。"
 ire.62.a:0 "改革的火车已经停不下了"
 ire.62.b:0 "是时候踩下刹车了"
 IRE_TNTN1:0 "跨爱尔兰国家交通网"
 IRE_TNTN1_desc:0 "我们的现代化铁路系统正在全国各地快速运输货物，使我们的工厂更有效地运作。"
 IRE_TNTN2:0 "额外投资跨爱尔兰国家交通网"
 IRE_TNTN2_desc:0 "我们的现代化铁路系统正在全国各地快速运输货物，使我们的工厂更有效地运作。额外的投资使得我们新建立了几条高效的货运铁路网络。"
 IRE_TNTN3:0 "大批量投资跨爱尔兰国家交通网"
 IRE_TNTN3_desc:0 "我们的现代化铁路系统正在全国各地快速运输货物，使我们的工厂更有效地运作。政府的大量投资使得我们曾经落后的基础设施转变为了令欧洲大陆都为之羡慕的交通网络。"
 IRE_IFI:0 "爱尔兰工业发展计划"
 IRE_IFI_desc:0 "我国长期以来存在着严重的失业问题，许多家庭甚至无法满足温饱的需求。但另一方面，我国的民用工业也有着巨大的发展潜力，通过政府的投资去建设新的工业，我们既可以在一定程度上缓解人民的需求，又可以将我们的经济发展起来。"
 ire.IFI.tt:0 "\n启动爱尔兰§Y工业化进程§!\n\n"
 ire.64.t:0 "投资爱尔兰工业发展计划"
 ire.64.d:0 "政府已下令为我国的快速工业化提供大量资金。有太多找不到工作的爱尔兰人了。早在爱尔兰获得独立时，许多英资工厂便关门歇业，至今更是年久失修。虽然我国人民渴望工作、乐于工作，但爱尔兰的工业既无目标、亦无方向。一切都取决于政府决定要向民用工业投资多少。"
 ire.64.a:0 "投入适量的资金，先让国家有一定工业能力"
 ire.64.b:0 "大量的投资，我们需要有足够强大的工业"
 ire.64.c:0 "尽可能的投入预算！让爱尔兰再次伟大"
 ifi.industry.tt:0 "\n我们可以在爱尔兰开展几项§Y工业建设项目§!。\n\n"
 ire.65.t:0 "自由邦酿酒厂"
 ire.65.d:0 "在启动爱尔兰工业发展计划之后，爱尔兰工商部决定先从爱尔兰的传统行业入手：酿酒业。爱尔兰有着悠久而自豪的生产爱尔兰威士忌的传统，但大部分爱尔兰威士忌都产自于城市或农村里由家庭经营的作坊。拟议中的自由邦工程是先开设几家酿酒厂，为我国创造一些急需的就业机会，但具体建设地区目前尚未敲定，只是大致确定了应当放在工业欠发达的地区之一。"
 ire.65.a:0 "阿尔斯特，他们酿的威士忌连上帝都钟情"
 ire.65.b:0 "康诺特，那里的人急需工作"
 ire.65.c:0 "芒斯特，那里的生意人知道怎么样赚到最多的钱"
 ire.66.t:0 "威士忌的召唤！"
 ire.66.d:0 "自由邦酿酒厂已经投入使用了，国家很快就能从中获利了。当然，工厂建设自有其成本，但毫无疑问，从长远来看，这对公众士气和国民经济都有好处。"
 ire.66.a:0 "祝健康！"
 ire.66.b:0 "我们真的负担得起吗？快停下投资！"
 IRE_FIC:0 "建立金融和工业发达的首都"
 IRE_FIC_desc:0 "英国工团主义的兴起使得不列颠群岛的主要贸易往来几乎限制在少数几个工团国家中，这样一来非工团主义的国家便可以把爱尔兰看做一个新的主要贸易国。我们位于美洲和欧洲大陆之间的大西洋，只要我们肯努力去发展并与其他的国家进行深入的交往，我们就可以把都柏林建设成下一个伦敦。"
 ire.fic.tt:0 "在都柏林建立一个国际商业中心。\n\n"
 ire.70.t:0 "宣传都柏林"
 ire.70.d:0 "我们的快速工业化和经济改革为外国企业创造了一个极有吸引力的营商环境，倘若我们应对得当，为外资企业提供大笔补贴，我们就能够吸引大量的国外企业来到都柏林进行投资，使其变成大西洋上的崭新贸易中心。伦敦已陷于工团主义者之手，如今正是我等取而代之之时。我们得决定要为我们的项目投入多少资金，投入越大，我们的国际影响力就越大，但一如既往，债务的幽灵依旧困扰着我们。"
 ire.70.a:0 "将我们的宣传范围限制在可以信任的欧洲国家内"
 ire.70.b:0 "直达大西洋对岸或许也不错"
 ire.70.c:0 "昭告天下：都柏林向外企开放啦！"
 IRE_befriend_GER:0 "爱尔兰友邦"
 IRE_befriend_CAN:0 "爱尔兰友邦"
 IRE_befriend_USA:0 "爱尔兰友邦"
 IRE_befriend_ENG:0 "对爱关系缓和"
 IRE_befriend_FRA:0 "对爱关系缓和"
 IRE_befriend_trade:0 "爱尔兰贸易伙伴"
 IRISH_PROFITS:0 "爱尔兰的利润"
 IRISH_PROFITS_desc:0 "我国企业正在都柏林蓬勃发展，而我们也正在从中获益。"
 IRE_DUBLIN_SUCCESS:0 "都柏林重生"
 IRE_DUBLIN_SUCCESS_desc:0 "都柏林已经成为世界主要的金融中心之一，使我们能够转移我们的经济重心，从而达成利益非凡的贸易协议。"
 ire.71.t:0 "爱尔兰与德国的商业谈判"
 ire.71.d:0 "我们今天收到消息，爱尔兰人正在尽最大努力推动现代化的都柏林成为未来的贸易和金融中心。国内几家领头企业已与爱方接洽，并建议我们同意他们在爱尔兰首都开设工厂。我们自然能从中获益，长期来看还不少。当然，那帮爱尔兰人肯定赚得更多。"
 ire.71.a:0 "德国人的生意就留在德国做"
 ire.71.b:0 "爱尔兰是我们的朋友，我们当然会投资"
 ire.71.c:0 "我们都能赚到钱，这有何妨呢，对吧？"
 ire.71.e:0 "现在是战争时期，我们无暇进行投资"
 ire.72.t:0 "德国的回复"
 ire.72.d:0 "我们与德意志帝国的商业谈判取得了重大成功，著名军备制造商克虏伯宣布将在都柏林开设一家新的子公司。这势必会创造大量新工作岗位，而且该军事复合体将直接向爱尔兰政府销售军备。正如他们所说，这是一场双赢。"
 ire.72.d1:0 "我们与德意志帝国的商业谈判遭遇了惨痛失败，德国人决定对本国企业采取贸易保护措施，并禁止任何外资进入都柏林。"
 ire.72.d2:0 "我们与德意志帝国的商业谈判遭遇了惨痛失败。由于他们正处于战争状态，因此无暇顾及任何新的外国投资。"
 ire.72.a:0 "好极了！"
 ire.72.b:0 "该死"
 ire.73.t:0 "爱尔兰与西班牙的商业谈判"
 ire.73.d:0 "我们今天收到消息，爱尔兰人正在尽最大努力推动现代化的都柏林成为未来的贸易和金融中心。国内几家领头企业已与爱方接洽，并建议我们同意他们在爱尔兰首都开设工厂。我们自然能从中获益，长期来看还不少。当然，那帮爱尔兰人肯定赚得更多。"
 ire.73.a:0 "西班牙的生意就留在西班牙做"
 ire.73.c:0 "我们都能赚到钱，这有何妨呢，对吧？"
 ire.73.e:0 "现在是战争时期，我们无暇进行投资"
 ire.74.t:0 "西班牙的回复"
 ire.74.d:0 "我们与西班牙王国的商业谈判取得了重大成功，军火公司美洲驼-加必隆多和西亚宣布将在都柏林开设一家新的子公司。都柏林正不断扩张，而我国人民无不为之欢呼雀跃。"
 ire.74.d1:0 "我们与西班牙王国的商业谈判遭遇了惨痛失败，西班牙人决定对本国企业采取贸易保护措施，并禁止任何外资进入都柏林。"
 ire.74.d2:0 "我们与西班牙王国的商业谈判遭遇了惨痛失败。由于他们正处于战争状态，因此无暇顾及任何新的外国投资。"
 ire.74.a:0 "好极了！"
 ire.74.b:0 "该死"
 ire.75.t:0 "爱尔兰与不列颠联盟的商业谈判"
 ire.75.d:0 "爱尔兰出人意料地向伦敦派出了贸易使团，提出了让英国企业在都柏林开设子公司的提议，并且政府会相应的提供大量补贴。如果我们同意这个提案，我们会从中获利，但也会让爱尔兰海对岸的潜在敌人受益。"
 ire.75.a:0 "爱尔兰可不是工人阶级的朋友"
 ire.75.b:0 "我们已经在维持与爱尔兰的关系上付出足够努力了，维持现状就行了"
 ire.75.c:0 "搞不好能借此从内部影响他们，放手干吧"
 ire.75.e:0 "现在是战争时期，我们无暇进行投资"
 ire.76.t:0 "不列颠联盟的回复"
 ire.76.d:0 "我们与不列颠联盟的商业谈判取得了重大成功，汽车制造商沃克斯豪尔宣布将在都柏林开设一家新的子公司。工团主义者的这次投资将加强我国民用经济，并为人民提供大量就业岗位，长远来看，这将对我国起到深远影响。"
 ire.76.d1:0 "我们与不列颠联盟的商业谈判遭遇了惨痛失败，英国人决定对本国企业采取贸易保护措施，并禁止任何外资进入都柏林。"
 ire.76.d2:0 "我们与不列颠联盟的商业谈判遭遇了惨痛失败。由于他们正处于战争状态，因此无暇顾及任何新的外国投资。"
 ire.76.d3:0 "我们与不列颠联盟的商业谈判取得了重大成功，汽车制造商沃克斯豪尔宣布将在都柏林开设一家新的子公司。"
 ire.76.a:0 "利远大于弊"
 ire.76.b:0 "他们来不来无所谓"
 ire.76.c:0 "转念一想，其实我们也不希望工团势力渗透进都柏林"
 ire.76.e:0 "好极了！"
 ire.77.t:0 "爱尔兰与法兰西公社的商业谈判"
 ire.77.d:0 "爱尔兰出人意料的向巴黎派出了贸易使团，提出了让法国企业在都柏林开设子公司的提议，并且政府会相应的提供大量补贴。如果我们同意这个提案，我们会从中获利，但也会让英吉利海峡对岸的潜在敌人受益。"
 ire.77.a:0 "爱尔兰可不是工人阶级的朋友"
 ire.77.b:0 "我们已经在维持与爱尔兰的关系上付出足够努力了，维持现状就行了"
 ire.77.c:0 "搞不好能借此从内部影响他们，放手干吧"
 ire.77.e:0 "现在是战争时期，我们无暇进行投资"
 ire.78.t:0 "法兰西公社的回复"
 ire.78.d:0 "我们与法兰西公社的商业谈判取得了重大成功，汽车制造商罗奈恩底垂宣布将在都柏林开设一家新的子公司。工团主义者的这次投资将加强我国民用经济，并为人民提供大量就业岗位，长远来看，这将对我国起到深远影响。"
 ire.78.d1:0 "我们与法兰西公社的商业谈判遭遇了惨痛失败，法国人决定对本国企业采取贸易保护措施，并禁止任何外资进入都柏林。"
 ire.78.d2:0 "我们与法兰西公社的商业谈判遭遇了惨痛失败。由于他们正处于战争状态，因此无暇顾及任何新的外国投资。"
 ire.78.d3:0 "我们与法兰西公社的商业谈判取得了重大成功，汽车制造商罗奈恩底垂宣布将在都柏林开设一家新的子公司。"
 ire.78.a:0 "利远大于弊"
 ire.78.b:0 "他们来不来无所谓"
 ire.78.c:0 "转念一想，其实我们也不希望工团势力渗透进都柏林"
 ire.78.e:0 "棒呆了！"
 ire.79.t:0 "爱尔兰与美国的商业谈判"
 ire.79.d:0 "我们今天收到消息，爱尔兰人正在尽最大努力推动现代化的都柏林成为未来的贸易和金融中心。国内几家领头企业已与爱方接洽，并建议我们同意他们在爱尔兰首都开设工厂。我们自然能从中获益，长期来看还不少。当然，那帮爱尔兰人肯定赚得更多。"
 ire.79.a:0 "美国人的生意就留在美国做"
 ire.79.b:0 "爱尔兰人是我们的朋友，当然同意"
 ire.79.c:0 "我们都能赚到钱，这有何妨呢，对吧？"
 ire.79.e:0 "现在是战争时期，我们无暇进行投资"
 ire.80.t:0 "美国的回复"
 ire.80.d:0 "我们与美利坚合众国的商业谈判取得了重大成功，工业巨头通用电气宣布将在都柏林开设一家新的子公司。这无疑将创造相当多的就业机会，并有助于扩张我们不断发展的民用工业复合体。"
 ire.80.d1:0 "我们与美利坚合众国的商业谈判遭遇了惨痛失败，美国人决定对本国企业采取贸易保护措施，并禁止任何外资进入都柏林。"
