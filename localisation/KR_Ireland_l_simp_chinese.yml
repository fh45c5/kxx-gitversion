 ire.91.t:0 "都柏林重生"
 ire.91.d:0 "我们在都柏林吸引外国投资的努力获得了巨大的成功。我们如今正世界市场上享有极其重要的贸易地位。爱尔兰将再也不是一片饱受嘲讽的荒芜之地。她终于成为了名副其实的翡翠岛。"
 ire.91.a:0 "何其幸运！"
 IRE_RTN:0 "重建北方地区"
 IRE_RTN_desc:0 "1925年停火之后，阿尔斯特北部的大部分地区工业尽数毁坏，影响了本国的其他地区。贝尔法斯特曾经是一个繁荣的工业化城市，德里以及科尔雷恩等城市也相当的繁华。重建北方地区并对其进行工业投资会帮助国家更好的发展。"
 ire.67.t:0 "哈兰和沃尔夫造船厂"
 ire.67.d:0 "在20世纪初，位于贝尔法斯特的哈兰和沃尔夫造船厂享有世界最大造船厂的荣誉。但在大英帝国于世界大战蒙羞战败、工团主义革命爆发后，它便年久失修，其他船厂也取代了它第一的位置。我们可以通过整修让它重现辉煌，但这次是为了爱尔兰，而非不列颠帝国主义者。"
 ire.67.a:0 "进行一些修缮，再招上一些人，船厂就能创造不少就业机会"
 ire.67.b:0 "哈兰和沃尔夫会再次重现辉煌"
 ire.67.c:0 "我们会再次让这个船厂世界瞩目"
 ire.67.e:0 "这太贵了，船厂可以废弃"
 IRE_HnW:0 "哈兰和沃尔夫造船厂"
 IRE_HnW_desc:0 "本世纪初，哈兰和沃尔夫造船厂是世界上最大的造船厂。最近在爱尔兰政府的整修下，船厂会重新争取这个荣誉的头衔。"
 ire.68.t:0 "肖特兄弟有限公司"
 ire.68.d:0 "肖特兄弟公司于1908年在英国成立，是一家私营航空航天公司，其在阿尔斯特开设了一些业务。由于大英帝国的悲惨命运，他们的业务遭受了重大损失，现在，他们在寻找新的商机，并将在阿尔斯特的业务扩展视为他们的最优先任务。我们可以以牺牲国家利益为代价来补贴他们的冒险行为，毕竟，无论在和平时期还是战时，拥有出色的航空航天工业的好处都是显而易见的。"
 ire.68.a:0 "帮助他们安置产业"
 ire.68.b:0 "对其进行大量投资"
 ire.68.c:0 "贝尔法斯特将会成为他们的全球总部。使劲砸钱进去！"
 ire.68.e:0 "我们的预算太紧张，就别管了。再说要飞机有什么用？"
 IRE_SHORTBROS:0 "肖特兄弟航空有限公司"
 IRE_SHORTBROS_desc:0 "肖特兄弟航空有限公司成立于1908年，是世界上第一家私人航空器制造商。在贝尔法斯特成为了新的总部所在地以后，公司很快在阿尔斯特地区开始开展业务。爱尔兰政府在阿尔斯特地区的经济建设使得公司获利颇丰。"
 IRE_NIIF:0 "国家工业投资基金"
 IRE_NIIF_desc:0 "如果我们想让爱尔兰在世界的舞台上占据一席之地，对我们的国家进行经济建设以及工业发展是非常重要的。我们需要资金来完成我们的快速工业化的计划。这会让我们进行更具效率的，更大规模的建设。当然这取决于我们能够有多少资金用在这上面。"
 IRE_NIIF1:0 "国家工业投资基金"
 IRE_NIIF1_desc:0 "在工业上的这次投资主要针对建筑材料的收购以及专业的建筑团队。这将帮助我们更快的建立起我们的民族工业。"
 IRE_NIIF2:0 "大量国家工业投资基金"
 IRE_NIIF2_desc:0 "在工业上的这次投资主要针对建筑材料的收购以及专业的建筑团队。这将帮助我们更快的建立起我们的民族工业。我们现在这个等级的投资允许我们更有效率的获得这些好处。"
 IRE_NIIF3:0 "巨额国家工业投资基金"
 IRE_NIIF3_desc:0 "爱尔兰政府对建设国有工业的巨额投资确保我们能够以远远快于之前的速度建设我们的民族工业。"
 ire.69.t:0 "国家工业投资基金"
 ire.69.d:0 "政府精心策划建立了一个用于投资爱尔兰工业的国家基金，公众对此反响良好。最近爱尔兰的经济增长喜人，众议院所承诺的经济复苏也形势乐观。国家工业投资基金的建立将能让专业的建设公司发展壮大，也能让他们在采购建筑材料时来得更顺利，维持工业化的齿轮不断运转。"
 ire.69.a:0 "给他一笔可观的政府资金"
 ire.69.b:0 "对基金进行巨额投资。让工厂快点建立起来！"
 ire.69.c:0 "我们在这个问题上花的钱已经够多了"
 IRE_ESIC:0 "爱尔兰科技进步委员会"
 IRE_ESIC_desc:0 "和其他众多工业国家相比，我们的科研能力相当贫弱。最近爱尔兰对科研的投资相当少。如果我们要全力发展我们的国家，进行一些科研项目十分有必要。"
 IRE_ESIC1:0 "爱尔兰科技进步委员会"
 IRE_ESIC1_desc:0 "为了帮助爱尔兰的科技研究，我们成立了爱尔兰科技进步委员会。科学家因此将获得充足的资金，多领域的专家团队将会日夜奋斗，帮助爱尔兰的科研水平赶上世界领先水平 。"
 IRE_ESIC2:0 "经验丰富的科技进步委员会"
 IRE_ESIC2_desc:0 "随着时间的推移，科技进步委员会得到了扩张与发展。现在它拥有更多的研究成员，并使得科研效率得到提升。"
 IRE_ESIC3:0 "颇负盛名的科技进步委员会"
 IRE_ESIC3_desc:0 "科技进步委员会成为了科研项目的主力军，并为爱尔兰的科研进程作出重大的贡献。"
 ire.92.t:0 "爱尔兰的一小步……"
 ire.92.d:0 "爱尔兰科技进步委员会是一个最近建立的新的政府部门，其宗旨非常简单：献身于学术和科学。爱尔兰长期以来被外界视为一潭死水，是一个科研极其落后的国家。话虽不好听，但实在不假爱尔兰科技进步委员会。不列颠数世纪统治下的爱尔兰一直为人忽视，在这个全世界科研飞速发展的时代，落后在所难免。现在是该迎头赶上了。科技进步委员会由本国以及其他友好国家的专业科学家组成。科技进步委员会科研团队将会提升我们整体的研究效率，并且甚至能够有时在特定的领域产生重大突破。现在政府必须思考科技进步委员会对于爱尔兰的价值：他们应当获得多少资金？"
 ire.92.a:0 "科学很重要，但不是最优先。少量补助"
 ire.92.b:0 "对于这个关键问题我们会慎重考虑补助力度"
 ire.92.c:0 "爱尔兰必须迎头赶上，这样才能有更好的未来，大力资助这个计划"
 ire.93.t:0 "科研效率优势"
 ire.93.d:0 "在爱尔兰政府稳定的资助下，科技进步委员会开始慢慢扩大，在科研经验以及效率上亦有所提高，他们因此能够同时处理多个研究项目。科技进步委员会自身的发展亦带动了爱尔兰的科学发展，显然，这笔投资是值得的。"
 ire.93.a:0 "我们期待的好消息"
 ire.94.t:0 "科研的巨大进步"
 ire.94.d:0 "在充足的时间以及资金的支撑下，科技进步委员会已经发展成为了现代科学研究的一支重要力量，我们也成了在科研领域受国际尊敬的国家。以后没有人再会嘲笑爱尔兰人是农民或者莽夫了！"
 ire.94.a:0 "成功啦！"
 ire.95.t:0 "科研重大突破"
 ire.95.d:0 "来自科技进步委员会的好消息！我们的研究团队宣称他们在一些政府以及军方感兴趣的关键领域有了重大的发现。这一突破肯定会在未来派上大用场！"
 ire.95.a:0 "他们终于配得上自己的大笔薪水了"
 ire.esic.brkthru:0 "获得一个§Y随机科研§!的加速奖励。"
 IRE_IRF:0 "工业研究优先"
 IRE_IRF_desc:0 "我们的国家对工业生产有着急切的需求，然而，我们国内的工厂大多破旧而过时，为了建设现代工业，他们也有对研究和发展新技术的需求。爱尔兰需要现代化的工厂，投资于工业研究将使我们让我们在工业化的道路上更进一步。"
 IRE_XPESIC:0 "扩展科技进步委员会"
 IRE_XPESIC_desc:0 "迄今为止，科技进步委员会一直很好的在完成它的工作，但是，它仍有增长空间。若对其进一步的进行投资，他们就能够开展更多的科研项目，并且能够使我们的团队在更多的科研领域开展研究。这还会提高我们在科研领域研究整体的灵活性。"
 IRE_GGLF:0 "爱尔兰的飞跃"
 IRE_GGLF_desc:0 "爱尔兰在短时间内完成了他国用多年也走不完的路。爱尔兰经济进步法的通过无疑是我们国家工业化获得巨大成就的历史标记。现在是时候走出英帝国主义的阴影了。爱尔兰从此以后不再是英国的种植园，她成为了一个重生的国家。"
 IRE_EIE:0 "移民改革"
 IRE_EIE_desc:0 "爱尔兰人是勤劳而且愿意进行工作的。但是我们毕竟只是一个小国。到目前为止，我们的经济状况一直不景气，并且缺乏吸引力。但随着爱尔兰经济进步法的通过，我们也许可以开始改善现状。如果我们鼓励其他不太发达的地区的人口前来移民，爱尔兰的经济将会得到更快的发展。"
 ire.eie.tt:0 "启动鼓励§Y移民§!的改革项目。\n\n"
 ire.96.t:0 "众议院的决议：移民政策"
 ire.96.d:0 "移民政策作为爱尔兰经济进步法决议的一部分，众议院对于放宽移民政策进行了一番辩论。在英治时期，前来爱尔兰的移民基本不存在，亦遭有意阻碍。现在，爱尔兰获得了自由与独立，经济也处在快速增长时期，我们因此有机会鼓励移民前来我们的国家。然而，这一政策的耗费兴许十分高昂，因为政府必须将大量资金用于行政以及住房建设。大规模流入爱尔兰的移民也可能会引发社会动荡。因此，我们的政策抉择将对爱尔兰未来的发展产生非常重要的影响，必须斟酌损益、三思后行。"
 ire.96.a:0 "放宽移民政策。多一些移民不会造成什么有害的影响"
 ire.96.b:0 "向世界开放移民，我们这儿空管够"
 ire.96.c:0 "让全世界知道来爱尔兰意味着一个全新的开始。鼓励移民"
 ire.98.t:0 "爱尔兰移民"
 ire.98.d:0 "今年，除了一些发生冲突的地区，全球基本处于和平状态。爱尔兰政府的移民政策以及国际形势为国家人口增长做出了贡献。"
 ire.98.d2:0 "今年，世界大部分地区都陷入了战争中。大量难民逃离本国，寻求安全的避难所。爱尔兰政府的移民政策以及国际形势为国家人口增长做出了贡献。"
 ire.98.d3:0 "今年，由于爱尔兰卷入了战争，愿来爱旅游以及定居的人数显著减少。"
 ire.98.a:0 "好吧"
