 ire.2603.t:0 "众议院的形式"
 ire.2603.d1:0 "下一个需交由讨论的问题是爱尔兰众议院及其选举产生的方式。虽然爱尔兰的选区界定基于历史上的内部行政区划，但如何在各地选举代表也是一个争议话题。\n\n第一种方案得到了新芬党与工党的支持，那便是维持现有的比例代表制。\n——“爱尔兰众议院议员应按比例代表制，依照单记可让渡投票制的方式选举产生。”\n这一制度自爱尔兰独立后的首次大选以来便一直推行着，也能创造出具有多样性与代表性的众议院。选民按照个人喜好对候选人进行排序，然后通过计票和重新分配选票在每个选区内选出三至五名众议院议员，这些议员在理论上也得到了大多数人的认可。\n\n另一种方案得到了共和党、陆军同志协会、共和党自由派，以及很罕见地同上述派别达成一致的阿尔斯特统一党的支持，那便是实行多数制。\n——“爱尔兰众议院议员应在单一选区中依照多数投票选出。”\n这一方案通常能创造出强有力的多数派政府，但也常因无法充分代表选民而饱受批判，所谓的“搅局效应”也生于其中。话虽如此，正是这一制度让德·瓦莱拉在1918年大选中赢得了几乎所有的爱尔兰议席，人们也认为这更有利于政府的稳定。"
 ire.2603.d2:0 "下一个需交由讨论的问题是爱尔兰众议院及其选举产生的方式。虽然爱尔兰的选区界定基于历史上的内部行政区划，但如何在各地选举代表也是一个争议话题。\n\n第一种方案得到了新芬党与工党的支持，那便是维持现有的比例代表制。\n——“爱尔兰众议院议员应按比例代表制，依照单记可让渡投票制的方式选举产生。”\n这一制度自爱尔兰独立后的首次大选以来便一直推行着，也能创造出具有多样性与代表性的众议院。选民按照个人喜好对候选人进行排序，然后通过计票和重新分配选票在每个选区内选出三至五名众议院议员，这些议员在理论上也得到了大多数人的认可。\n\n第二种方案得到了阿尔斯特统一党和共和党自由派的支持，那便是实行多数制。\n——“爱尔兰众议院议员应在单一选区中依照多数投票选出。”\n这一方案通常能创造出强有力的多数派政府，但也常因无法充分代表选民而饱受批判，所谓的“搅局效应”也生于其中。话虽如此，正是这一制度让德·瓦莱拉在1918年大选中赢得了几乎所有的爱尔兰议席，人们也认为这更有利于政府的稳定。\n\n第三种方案得到了共和党与陆军同志协会的支持，那便是在多数制的基础上增添“复数选举权”。\n——“每户户主有权代表其长子再投一次票，而后每拥有两个孩子便可多投一次票。”\n这一方案是作为提高生育率的方法而提出的，鉴于爱尔兰天主教家庭总体上较高的出生率，这也能让相关的选民得到更大的代表权。"
