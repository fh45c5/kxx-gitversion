 ire.356.t:0 "奋战不息者"
 ire.356.d:0 "每逢4月24日，爱尔兰人民都会齐聚一堂，纪念1916年的起义，悼念起义中的烈士。起义虽在名义上失败了，但它化为了如今自由爱尔兰的摇篮，因此，这一日子在阿尔斯特之外的人的心目中具有举足轻重的地位。今年是起义的20周年，庆祝活动比以往都要盛大。在这种欢快的氛围中，很少有人注意到名为“第二届议会执行委员会”的组织在各地张贴的海报。该组织由爱尔兰第二届议会的当选议员肖恩·奥克立担任主席，他们根据第一届议会的决议将自己的“合法权力”移交给了“爱尔兰共和军军议会”。当天结束时才有人注意到了这一奇怪举动，但没人清楚这意味着什么。“军议会”把我们当作自由邦政府，仅仅数周后就向发出了最后通牒。\n\n这份叫作最后通牒的文件装在没有记号的信封中，更像是一份宣言，军议会在其中先是解释了他们的“正统性”，然后是他们的目的，最后以他们的诉求作结。军议会声称自身的合法性来自于1916年建立的爱尔兰共和国的最后遗民，其可以追溯到英爱条约签订后分裂出去的爱尔兰共和军，他们拒绝接受条约，选择了继续战斗，即使到了英国大革命柯林斯宣布终结自由邦后，他们也没有停息。所谓的“执行委员会”由第二届议会的成员组成，而由于第二届议会从没有正式宣告解散，他们宣称继承了它的使命。军议会的目标很简单：完全废除英爱条约及其相关的一切，并重新建立起1916年的“真正”共和国。\n\n虽然说得天花乱坠，还有了“执行委员会”的支持，但爱尔兰共和军依旧是个非常边缘的团体。共和军过去确实拥有一些民意支持，且以新芬党为最，但爱尔兰带着三十二县获得自由后，他们的支持也跟着烟消云散了。新芬党也在最近的党大会上放弃了他们的支持，虽然这造成了党内的分裂，导致党魁肖恩·奥克立等人愤而离场。\n\n考虑到那几乎不存在的民意支撑，政府中的大多数人都觉得这最后通牒无足轻重，继续保持好现状就可以了。不过，也有人觉得我们应该采取反恐举措，避免平民受伤或者更糟糕的情况出现。甚至有极少数人信以为真，要我们坐下来与他们谈判个结果，毕竟，“真正”的共和国也是我们努力的目标。无论如何，柯林斯都要尽快做出决定，否则本就紧张的局势只会雪上加霜。"
 ire.356.a:0 "这帮傻瓜毫无威胁，继续我们的目前事务"
 ire.356.b:0 "爱尔兰共和军已经死了，结束这场愚蠢的叛乱！"
 ire.356.c:0 "也许我们能从和平之中得到些什么，安排与这个“军议会”会面"
 ire.357.t:0 "为共和国做的交易？"
 ire.357.d:0 "经过漫长而激烈的一系列会议，爱尔兰共和军军议会与柯林斯政府共同发布联合声明，正式宣布双方已经达成了一份协议。因会议在阿尔斯特的首府举行，这一协议正式名称为《贝尔法斯特协定》，其中主要回复了军议会对于共和政府的各项质疑。协定内容如下：一，柯林斯总统利用自由邦体制建立的爱尔兰共和国被共和军视为自由邦的延续，因此将被彻底解散，禅让于1916年建立、由共和军传承至今的旧共和国；二，现仅保留其名的英爱条约应被彻底废除；三，组建由柯林斯领导、议会法定人数的军议会成员组成的过渡政府，直至1937年大选；四，临时解散参议院，其主体在即将到来的1937年大选后进行改组；五，共和国继承“自由邦”在1937年大选，即二三届议会交接之前通过的各项法律；最后，共和军与国防部队合并，两者的领导层亦如此。\n\n虽然实际上什么都没有变，但在这些“正统继承者”的心目中，爱尔兰回到了正统政府手中。不过协定尚未得到议会的批准，很多人觉得为了取悦这么一小批人而大费周章属实没必要，也没有价值。爱尔兰议会中的争论即将告终，结果是……"
 ire.357.a:0 "……该协议已获批准，因为这可能是实现持久和平的唯一途径"
 ire.357.b:0 "……该协定未能获得批准，反恐行动再度开始"
 ire.358.t:0 "新芬党统一"
 ire.358.d:0 "在《贝尔法斯特协定》得到批准，爱尔兰共和国在三十二郡之上得以重建后，分裂的新芬党正式地合而为一。作为统一过程的一部分，肖恩·奥克立领导的裂党团体已正式终止了分离进程。虽然统一过程基本上一帆风顺，但统一的具体细节有些令人费解。党内两派都在他们的统一声明中欢迎另一派回归党的队伍中来。之所以出现这种奇怪的措辞，是因为两边都声称自己是真正的新芬党。抛却这些奇怪的措辞，在两派统一后，新芬党要比以往任何时候都更为强大。"
 ire.358.a:0 "看来，格里菲斯的遗产仍存于世间"
 ire.359.t:0 "爱尔兰共和国的终结"
 ire.359.d:0 "今天，迈克尔·柯林斯总统在府邸中宣布爱尔兰共和国正式解散。共和国的解散无关政变或革命，而是柯林斯政府与爱尔兰共和军的残余达成的贝尔法斯特协定的结果。根据协定，爱尔兰共和国正式解散，取而代之的是1916年复活节起义期间建立的最初的共和国，而爱尔兰共和军则是其正统继承者。新共和国的政府由共和军军议会成员组成，他们决定在1937年大选之前让柯林斯继续留任总统。贝尔法斯特协定到底会给爱尔兰带来何种变化，还有待观察。"
 ire.359.a:0 "爱尔兰万岁！"
 ire.359.b:0 "多么奇怪的小国啊"
 ire.360.t:0 "柯林斯统治不倒"
 ire.360.d:0 "迈克尔·柯林斯在大选中又一次大获全胜，得以继续担任爱尔兰总统。自1921年爱尔兰独立以来，柯林斯一直领导着这个国家，人们认为他为爱尔兰从英国手中夺回自由做出了重要贡献，并在英国大革命期间收复了北爱尔兰。\n\n尽管自黑色星期一以来，柯林斯的支持率大幅下降，统一党差点无以为继，但柯林斯现已击败了老对手埃蒙·德·瓦莱拉，以及再度焕发活力的新芬党，稳坐第四届总统宝座。在柯林斯第四个任期开始后，总统将启动一系列自由经济改革，以进一步重振疲软的爱尔兰经济。"
 ire.360.a:0 "还是老样子"
 ire.361.t:0 "柯林斯下台"
 ire.361.d:0 "柯林斯的爱尔兰总统任期终于结束了。\n\n在爱尔兰争取独立，并趁英国大革命期间收复北爱尔兰的行动之中，柯林斯发挥了重要作用。从那以后，在公众的大力支持下，他牢牢把控着总统一职，但在“黑色星期一”之后，他的公共支持已不复存在。\n\n柯林斯已经败给了他的对手，并辞去了军队职务。但哪怕失去了他们的创始人，柯林斯的政党：统一党还是撑了下来，并正在为下一次选举做着准备。\n\n大块头离开了政坛，而[IRE.getleader]取而代之。"
 ire.361.a:0 "爱尔兰一个时代的终结"
 ire.361.b:0 "也许他塞给计票员的票子太少了"
 ire.362.t:0 "柯林斯解散国家议会"
 ire.362.d:0 "爱尔兰出现了前所未有的场面，现任总统迈克尔·柯林斯在工团主义者胜选后，推翻了最近一次大选的结果。柯林斯预见到爱尔兰将倒向赤色阵营，因而解散了国家议会并通过私人法令施行统治。这被官方解释为面对爱尔兰国内愈演愈烈的不稳定局势时采取的临时措施。\n\n无论真实情况如何，国际媒体都纷纷将其描述为爱尔兰毗邻不列颠联盟的弱势地位最终导致的结果。从现在起，柯林斯的强硬手段将带领这个国家走向何方，一切还有待观察。"
 ire.362.a:0 "我还以为他应该是个民主派？"
 ire.363.t:0 "第二次爱尔兰革命"
 ire.363.d:0 "爱尔兰成了又一个倒向工团主义的欧洲国家。\n\n在自由选举后，社会主义大联盟完成了不可能的事情，他们赢得了选举。爱尔兰社会主义者不费一枪一弹，就占领了伦斯特府，并掌握了与此相关的一切权力。\n\n现在，人们预期爱尔兰将与他们的不列颠宿敌握手言和，向法兰西公社靠拢，以进一步推动世界范围内的工团主义事业。"
 ire.363.a:0 "看起来，康诺利精神仍未死去"
 ire.3101.t:0 "爱尔兰共产党中的盟友"
 ire.3101.d:0 "作为爱尔兰马克思主义和共产主义团体的主要组织者，伊丽莎白·“贝蒂”·辛克莱是平行革命工人团体中的一员，各组织之间松散合作，最终促成了革命。在巴黎学习期间，她被马克思主义和蒲鲁东主义的原则温和地浸透，形成了她自己的工团共产主义融合思想，为她自己的爱尔兰极左思想奠定了基础。贝蒂·辛克莱是位有能力的左翼领袖与革命者，她和她的爱尔兰共产党已同意完全并入规模更大的革命工人党，以确保有一个由忠诚的共产主义者组成的声势浩大、步伐一致的团体能够保卫我们的红宝石岛。然而，许多她的同志不仅希望辛克莱成为政府的主要成员，而且还更进一步鼓动她成为国家的行政长官。这样做将能大大促进左翼团结，更不用说妇女权利了，但也对格拉尔顿的忠诚者和他们为建立共产主义爱尔兰所做的工作有些不公。我们该怎么做呢？"
 ire.3101.a:0 "在革命中利用爱共，合并两党，给辛克莱一个内阁职位"
 ire.3101.b:0 "合并两党，任命辛克莱为爱尔兰新的红色总理"
 ire.3101.c:0 "防止公众进一步认同爱尔兰共产党"
 ire.3182.t:0 "新芬党的女主角"
 ire.3182.d:0 "卡哈尔·布鲁阿和新芬党人一直以来都受着爱尔兰民主左翼的领头女性玛格丽特·巴克利·尼·古尔丁（盖尔语名字为玛奇莱德·厄·布阿哈拉）的帮助。她是新芬党的第一位女性领袖，也是爱尔兰历史上第一位女性党魁，复活节起义差点断送了这位科克本地人的人生，但她侥幸逃脱，继续进行妇女运动与爱尔兰社会主义事业。她是新芬党内少数与共和军的守旧派保持良好关系的政客之一，被视为真正的爱国者与爱尔兰独立的功臣，受到全爱尔兰的爱戴。她进行过示威、绝食抗议、组织工会等革命活动，在新芬党的壮大中功不可没。虽然她功绩卓著，但她并没有被选为爱尔兰的领导人，因为布鲁在独立斗争中的角色也不容忽视。不过，她依旧兢兢业业地在布鲁的身边担任新芬党的二把手，在两人的强强联合下，爱尔兰将会真正实现骄傲、平等与自由。"
 ire.3182.a:0 "争取平等的斗争将在她的注视下继续下去"
