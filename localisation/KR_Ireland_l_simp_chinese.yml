 irelandflavour.371.d2: "爱尔兰小说家和剧作家凯特·奥布莱恩在过去几年里本就是公众心目中的知名作家，但她的最新作品《玛丽·拉维勒》现在肯定是她最具争议的著作。\n\n奥布莱恩在撰写经典爱情恋爱小说上可是一把好手，她常会在书中描写英国与英裔爱尔兰人中的资产阶级人物是如何在英爱两国革命后寻找自身定位的。奥布莱恩虽对上层社会很感兴趣，但在过去十年的大部分时间里，她都生活在不列颠联邦，享受着那里的革命氛围。她在当地的生活方式也备受爱尔兰公众关注，因为有报道称她剪短了头发，穿着男人的衣服，甚至还有传言称她与其他女性举止亲密。\n\n人们的议论并未因新作打消分毫，因为《玛丽·拉维勒》里就有一位年长的爱尔兰女同性恋，她还向女主人公表露了自己的爱。在书中主人公爱上了已婚男人后，该书剧情的淫秽色情更是达到了巅峰。\n\n奥达菲虽与奥金纳甘政见分歧渐趋明显，但他们在对作者及萦绕在她身边的丑闻的厌恶上却达成了一致，只是在采取何种行动上意见不一。\n奥达菲认为这部小说应该被封禁并被遗忘，以免影响大众，而奥金纳甘则认为它和它的作者应该被当作盎格鲁工团主义腐败、不道德和堕落的反面案例，而这正是新政府要力图保护爱尔兰人民免受其害之物。"
 irelandflavour.371.a: "一群敏感的卫道士，就让他们发牢骚去吧"
 irelandflavour.371.b: "这个国家还是有点道德的，把它禁了！"
 irelandflavour.371.c: "爱尔兰人就不该看这种乱七八糟的"
 irelandflavour.371.e: "让整个爱尔兰见证撒克逊敌人的邪恶本性！"
 irelandflavour.372.t: "泰泰安运动会"
 irelandflavour.372.d: "“希腊人能干的，盖尔人也能干”——这是过去几周在伦斯特大楼周围分发的小册子里的口号。去年的都柏林奥运会举办的相对成功，爱尔兰一个人数不多但颇具影响力的体育爱好者团体也因此向政府施加压力，请求政府举办泰泰安运动会。\n\n倘若传说属实，早在1169-1171年的诺曼入侵的几个世纪前，泰泰恩运动会的雏形便已存在，甚至还可以追溯到公元前一千多年。依照传统，最初举行这些活动是为了纪念丰收之神泰尔蒂乌的葬礼。在砍伐了米斯郡茂密广阔的森林，开辟了人们眼中如今肥沃丰饶的农田后，泰尔蒂乌因力竭而死。人们会在运动会期间止戈休战，运动会本身既是对智慧、技巧与力量的巨大考验，也是庆祝和安排婚礼的时间。\n\n在1924年英国大革命爆发前不久，当时的新芬党政府举办了一场现代版的类似运动会，取得了巨大成功。其在柏林奥运会几周后举行，基本上也是对着柏林奥运会依样画葫芦，这届运动会吸引了来自世界各地的数百名爱尔兰裔人士，以及一些应邀前来的客座选手，为这一壮观的场面增色不少。\n\n无论如何，令那些请愿者懊恼的是，这一运动会并未成为固定项目。对历届政府来说，安全担忧和支出问题实在是个大麻烦，还没办法解决，因为运动会本质上具有局限性，国际社会对投资加强安保实在兴致缺缺。就连举办奥运会也是当局艰难作出的决定，为的就是获得国际认可，其成本也超过了公众预期。\n\n但世界已陷入战火之中，爱尔兰侨民聚居的美国更是打得不可开交，更不用说近来才举办过大型体育赛事，政府实在没兴趣理会这些请愿者。"
 irelandflavour.372.a: "再等几年也无妨"
 irelandflavour.373.t: "新英格兰的老朋友"
 irelandflavour.373.d: "当共和国还在襁褓之中寻求盟友与国际承认的时候，它在新英格兰得到了坚定的回应，那里正是爱尔兰侨民最大的侨居地之一。当卡哈尔·布鲁阿出访波士顿，在芬威公园发表他的伟大演讲时，成千上万的人蜂拥出席，并为爱尔兰独立而大声疾呼。近来美国的危机已演变成内战，为了在纷飞战火中独善其身，新英格兰在加拿大人的干预下成立了一个临时政府。\n\n虽然一些政府内部人士拒绝同英国流亡者站在一边，但许多人还是呼吁爱尔兰承认新英格兰政府，并邀请新英格兰总统前来发表演说，以此展现爱美两国之友好合作关系。"
 irelandflavour.373.a: "我们可不会忘了老朋友，发出邀请"
 irelandflavour.373.b: "管英国现在是谁领导，想让我们支持英帝国主义，门都没有"
 irelandflavour.381.t: "打倒爵士乐"
 irelandflavour.381.d: "爱尔兰人口最少的县的低级神职人员通常不在国家媒体和政客们的兴趣范围内，但利特里姆的彼得·科尼弗里神父却成了例外。身为传统的民族主义者，科尼弗里主张人们支持爱尔兰语和爱尔兰传统音乐，而不是被外国影响。\n\n此类观点实在不胜枚举，爱尔兰的自由主义者对此也是司空见惯了。但科尼弗里却想到了一个新奇的攻击谴责角度，他抨击爵士乐是“一帮富有的美国工团主义者为了攻击全世界的基督教文明从中非借来的”，并将爵士乐听众斥为爱尔兰彻头彻尾的“叛徒”，对钟爱爵士乐的英裔德裔，他自然更是恶语相向。\n\n科尼弗里以其塑造焦虑的言论抨击了一切来自于外国与大城市的事物，他也因此能在近来于南利特里姆举行的反爵士乐抗议活动中召集来“成千上万”名支持者。埃蒙·德·瓦莱拉和约瑟夫·麦克罗里大主教表示支持的信被公开宣读，持文化多元主义观点的政客亦难逃言语攻击。倘若放在十年前，能闹出这档子事是想都不敢想的，但显而易见，近来的经济局势与政治事件为这种博眼球行为创造了土壤。"
 irelandflavour.381.a: "人们知道我们有自己的文化，没必要拿其他人的来用"
 irelandflavour.381.b: "他得明白，就连基督教也是外国货呢"
 irelandflavour.381.c: "不解决经济问题，就会有这种人跳出来博眼球"
 irelandflavour.382.t: "追忆雷德蒙"
 irelandflavour.382.d: "又是一年纪念日，今年是约翰·雷蒙德逝世二十周年，相应的纪念活动于近日举行。\n\n这是一次无声的纪念活动。对一些人来说，雷德蒙是个历史罪人，他的所作所为害死了上万名爱尔兰青年，而在另一些人看来，这步错误足以为其整个政治生涯盖棺定论。不过，雷蒙德的一生远没有这么简单。\n\n雷蒙德是爱尔兰议会党的领袖，也是一零年代初爱尔兰民族主义的实际掌门人。当时，其自治方案离被威斯敏斯特方面批准只差一步之遥，而这也导致阿尔斯特志愿军同爱尔兰志愿军之间的冲突几乎不可避免。不过，世界大战的爆发给这两件事情按下了暂停键，而此时的雷蒙德做出了一个致命的决定：他鼓励所有身体健全的志愿军成员投身英国的战争之中，以此为砝码，让爱尔兰自治在“短暂”的战争结束之后生米煮成熟饭……\n\n雷蒙德把自治当作斗争的最终目标，对身处大英帝国腹地的爱尔兰自治国感到心满意足。不过，其他大多数人，甚至包括其自家党员在内，都只把自治视为迈向完全独立的一个台阶，而对雷蒙德有好感，多为同英国有着私人情感、关系的人，以及少数支持协约国的温和共和派。\n\n一场简朴而庄重的纪念仪式于雷蒙德的埋骨地——其故乡韦克斯福德的家族墓地举行。出席仪式者有共和党的几位政治家和党内官员，以及一些世界大战的爱尔兰老兵，他们呼吁人们正视雷蒙德的遗产，想想他所生活的那个时代，那个共和国还是南柯一梦的时代。当然了，这番话都是说给不在场的那些人听的，可大多数后者对此也只是装聋作哑。"
 irelandflavour.382.a: "他是那个时代的大人物"
 irelandflavour.385.t: "大房子熊熊燃烧"
 irelandflavour.385.d1: "所谓“大房子”，就是指英治时期遗留下来、遍布爱尔兰乡间的庄园。虽然“大房子”的主要作用还是住宿，但其还有着另外一重身份：连结、统筹农业生产的纽带。通常，数十个农场工人会在老板房子旁的院子里一起工作。这一制度源自中世纪并延续至今，且没有发生多大的变化。\n\n十七、十八世纪，爱尔兰的天主教贵族失势，这些庄园从此就落入了英裔爱尔兰家族的控制下至今。这些家族的财富和地位都来自一手扶植了他们的英国政府，他们是帝国主义志虑忠纯的奴仆，这些家族内无继承权的子嗣通常会在大英帝国的各殖民地担任官僚，由此可见，他们对维持现状的渴望不止局限于祖先故地，寰宇上下亦然。英国革命之后，“大房子”普遍成了这些“帝国忠仆”最后的避难所。\n\n革命之火既已席卷全岛，人民便不可避免地对这些外国资本的堡垒群起而攻之，恨不毁之后快。政府对此是睁一只眼闭一只眼，因为这些行为在其看来是革命热情的表现，而非应当压制之物。革命之火历经千辛万苦方才燃起，现在可不是把它浇灭的时候。"
 irelandflavour.385.d2: "所谓“大房子”，就是指英治时期遗留下来、遍布爱尔兰乡间的庄园。虽然“大房子”的主要作用还是住宿，但其还有着另外一重身份：连结、统筹农业生产的纽带。通常，数十个农场工人会在老板房子旁的院子里一起工作。这一制度源自中世纪并延续至今，且没有发生多大的变化。\n\n十七、十八世纪，爱尔兰的天主教贵族失势，这些庄园从此就落入了英裔爱尔兰家族的控制下至今。这些家族的财富和地位都来自一手扶植了他们的英国政府，他们是帝国主义志虑忠纯的奴仆，这些家族内无继承权的子嗣通常会在大英帝国的各殖民地担任官僚，由此可见，他们对维持现状的渴望不止局限于祖先故地，寰宇上下亦然。英国革命之后，“大房子”普遍成了这些“帝国忠仆”最后的避难所。\n\n革命之火既已席卷全岛，人民便不可避免地对这些外国资本的堡垒群起而攻之，恨不毁之后快。袭击大房子的报告也堆满了政府办公室。此举总体上虽利大于弊，却也需进行稍稍约束。倘若要维持法律与秩序，政府便需迅速采取行动，公有化这些房屋，而不是任由它们因情绪而被摧毁。"
 irelandflavour.385.d3: "所谓“大房子”，就是指英治时期遗留下来、遍布爱尔兰乡间的庄园。虽然“大房子”的主要作用还是住宿，但其还有着另外一重身份：连结、统筹农业生产的纽带。通常，数十个农场工人会在老板房子旁的院子里一起工作。这一制度源自中世纪并延续至今，且没有发生多大的变化。\n\n十七、十八世纪，爱尔兰的天主教贵族失势，这些庄园从此就落入了英裔爱尔兰家族的控制下至今。这些家族的财富和地位都来自一手扶植了他们的英国政府，他们是帝国主义志虑忠纯的奴仆，这些家族内无继承权的子嗣通常会在大英帝国的各殖民地担任官僚，由此可见，他们对维持现状的渴望不止局限于祖先故地，寰宇上下亦然。英国革命之后，“大房子”普遍成了这些“帝国忠仆”最后的避难所。\n\n由于最近对民族盖尔特色的复兴，许多农村居民受到鼓舞并发动起来攻击这些大房子，凡是能烧光者皆难以幸免。尽管政府无法公开鼓励非公职人员损毁私有财产，但若是时机有利，它大可以对此睁一只眼闭一只眼。如果要恢复我民族的自豪和自尊，那么贫苦的农场工人对英国血统的领主卑躬屈膝的岁月就必须翻篇。"
 irelandflavour.385.a: "以手掐灭革命之火，只会引火烧身"
 irelandflavour.385.b: "是时候斩断锁链了"
 irelandflavour.385.c: "生产资料应该被没收，而不是被毁灭"
 irelandflavour.385.e: "除恶务尽"
 irelandflavour.386.t: "盖尔运动协会"
 irelandflavour.386.d1: "盖尔运动协会成立于“盖尔复兴”时期的1884年，宗旨是保护、推广爱尔兰传统体育运动，而在实现这一目标的过程中，其所取得的成就是有目共睹的。在盖尔运动协会之前，“盖尔式”足球、曲棍球、手球、棒球基本都是个半死不活的状态，而在爱尔兰独立后，隶属于协会的俱乐部开遍了全国各地。虽说协会对于农村地区的影响要远大于其它地区，但如今，一说起“足球”，人们自然而然想到的都是盖尔足球。今天，协会依旧管理、组织着国内外的盖尔运动，其旗下的俱乐部和赛事也总是会吸引大量的观众。\n\n对于盖尔运动协会这样一个致力于文化振兴的组织，不难想象，无论是过去还是现在，其在政治领域都与爱尔兰民族主义有着一层密切的关系。协会的初创成员以及最早的一批赞助者中有许多都是芬尼亚派和地方自治派，协会的地方俱乐部也是爱尔兰共和兄弟会早期招兵买马的中心。独立战争期间，英国皇家军队于协会旗下的招牌——克罗克公园体育场举行的盖尔足球比赛期间对在场的平民观众展开了一场无差别的大屠杀，这就是鼎鼎大名的“血腥星期日”，这一事件是英军暴行的铁证。\n\n盖尔运动协会早前曾短暂获得过管理爱尔兰全国体育运动的权力，不过，在1922年全国田径和自行车协会成立后，这就都成前尘往事了。当时，《英爱条约》刚刚签订，新独立的爱尔兰政府担心公开支持盖尔运动协会可能不利于团结。即使英国已经结束了对爱尔兰北方的统治，这一矛盾仍旧没有消失，且一直持续到了今日。虽然盖尔体育赛事及盖尔运动协会得到了都柏林政府的大力支持，但共和国政府本着社会和谐为重的原则，始终沿袭着旧的政策。"
