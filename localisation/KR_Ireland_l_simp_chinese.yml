 IRE_Ulster_Issue_desc: "阿尔斯特地区自英国革命以来一直被爱尔兰占领，尽管我们想尽办法将其纳入版图，但这一过程却并不和平。阿尔斯特局势目前仍是爱尔兰政坛上的争议点，而若想翡翠岛永葆自由、远离战乱，我们就必须为阿尔斯特问题划上句点。"
 IRE_Unraveling_Political_Scene: "分崩离析的政界"
 IRE_Unraveling_Political_Scene_desc: "长久以来，统一党一直享有着爱尔兰民主政治体制中不可置疑的一席之地，哪怕在自由共和国成立后也是如此，不过近些年来情况有些变化。柯林斯的老对手埃蒙·德·瓦莱拉正于国内稳步获得更多的权力，因为在柯林斯的统治下，经济形势日趋恶化；在统一党大权旁落后，统一党支持者与共和党支持者之间的暴力冲突变得越来越频繁。这种政治暴力的氛围让新芬党人气大涨，这归功于卡哈尔·布鲁阿的思想在群众中获得了更多的吸引力，他将自己标榜为德·瓦莱拉和柯林斯之间的、和平的第三条道路。此外，各种各样的社会主义者一直在稳步地争取政治中的一席之地，这在很大程度上要归功于不列颠联盟与美利坚社会党的支持。考虑到这一切，1937年的选举注定是近期以来最具争议的选举，如果统一党想继续维持其不受限制的统治地位，他们就需要向爱尔兰人民证明，他们同样致力于彻底改革爱尔兰停滞不前的经济和政治局面，并能以此一劳永逸地结束爱尔兰的困境。"
 IRE_Threat_Across_Isle: "岛对岸的威胁"
 IRE_Threat_Across_Isle_desc: "无数人曾希望英国大革命将终结肆虐爱尔兰的英帝国主义。然而事与愿违，伦敦的工团政府在爱尔兰问题上显然已经走上了保王派的老路。我们原以为帝国主义只是大英帝国特有的症结，但如今的工团主义者却是新瓶装旧酒，使出的伎俩与旧政府并无二致。看来，征服翡翠岛是英国人与生俱来的邪念，不列颠尼亚一日不从地球上消失，我们同伦敦间的敌意就一日不会消弭。"
 IRE_Post_Collins_Assasination: "后柯林斯时代的混乱"
 IRE_Post_Collins_Assasination_desc: "悲剧笼罩着爱尔兰。爱尔兰独立的英雄、与国家患难与共的领导人被残忍杀害。他的死亡带来的混乱已然席卷我国，如果再这样下去，新政府也即将垮台。"
 IRE_anti_socialist_resistance: "对新政权的抵抗"
 IRE_anti_socialist_resistance_desc: "新成立的爱尔兰社会主义政府并非海内升平，旧体制的盲从者正到处大肆破坏。倘若不将这些反动派一网打尽，爱尔兰革命便可能被扼杀于萌芽之中。"
 IRE_new_ireland: "崭新的红色爱尔兰"
 IRE_new_ireland_desc: "当反动派叛匪被肃清殆尽后，我们便已巩固了对翡翠岛的控制。我国将马上摆脱资本主义与帝国主义压迫的枷锁，成为工人的红色天堂。"
 IRE_Secret_Police_idea: "公民内务委员会"
 IRE_Secret_Police_idea_desc: "虽然格拉尔顿同志为将爱尔兰转变为无产阶级的天堂而不懈努力，但许多爱尔兰人仍食古不化、抱残守缺，决心不惜一切代价抵制格拉尔顿的新秩序。为抵御这些叛徒的攻势，司令官授权成立了公民内务委员会，这是一个凌驾于法律系统之上的机构。"
 IRE_SF_Coalition: "统一党/新芬党联盟"
 IRE_SF_Coalition_desc: "统一党已经与新芬党组成了执政联盟，并致力于实施亲工人政策。"
 IRE_NCP_Coalition: "统一党/民族中央党联盟"
 IRE_NCP_Coalition_desc: "统一党已经与民族中央党组成了执政联盟，并致力于实施亲农民政策。"
 IRE_Minority_Govt: "统一党少数派政府"
 IRE_Minority_Govt_desc: "由于统一党在议会中没有获得多数席位，他们的政策将难以实施。"
 IRE_Republican_Legal_System: "共和司法体系"
 IRE_Republican_Legal_System_desc: "爱尔兰的法律制度从一开始就是以共和制为前提和基础而建立的，我们需要更改其内容，使之适合君主制。"
 IRE_Big_Fellow: "大块头"
 IRE_Waining_Personality: "逝去的英雄名望\n§g虽然自1921年掌权以来，作为独立英雄的柯林斯仍旧名声在外，但他对爱尔兰人民的影响力无疑在逐渐丧失。十多年后的如今，许多爱尔兰人民已经厌倦了柯林斯，认为他只是一个老古董，仅仅凭借作为英雄的地位而不是依靠任何具体的政策才能继续掌权。随着爱尔兰经济持续恶化，柯林斯不得不向民众证明，他确有要提上议事日程的政策。§!"
 IRE_True_Hero: "独立的真正英雄"
 benevolent_dictator: "仁慈的独裁者"
 IRE_Irish_King: "爱尔兰的真正国王"
 IRE_UFOlogist: "不明飞行物学家\n§g布林斯利·勒波尔·特兰奇不仅是荷兰贵族和现任爱尔兰国王，还是一位狂热的不明飞行物学家，也是各种“神秘”领域研究的支持者。政府偶尔不得不“抑制”一下国王对这些事物的热情，以免让政府看起来跟傻子似的§!"
 IRE_promoted_gaelic: "推广盖尔语"
 IRE_language_equality: "语言平等"
 POR_Portugese_King: "爱尔兰的葡萄牙国王"
 CAR_Spanish_King: "爱尔兰的西班牙国王"
 IRE_ISP_OIL:0 "爱尔兰合成材料项目"
 IRE_ISP_OIL_desc:0 "尽管我们的人民勤勤恳恳，爱尔兰业已发展到可以步入工业化的程度，但与世界各大国相比，我们的自然资源却十分匮乏，这可令我们束手无策。石油与橡胶的问题尤其严重，因此，倘若我们想让我们的工厂能使用这些资源，爱尔兰就必须制定一个实用的合成化工发展计划。"
 IRE_Dictatorship: "爱尔兰民主的失败"
 IRE_Dictatorship_desc: "为了保护我们的翡翠岛免受激进主义、社会主义与盎格鲁人的威胁，我们废除了爱尔兰的民主制度，为了全体爱尔兰人的利益，我们建立了一个专制独裁的共和国。民主确已终结，但这都是为了一个崭新而强大的爱尔兰！"
 IRE_Collins_Dictator: "救爱尔兰于水火"
 IRE_Collins_Dictator_desc: "自由爱尔兰共和国的梦想将继续延续，这多亏了民族英雄、著名强人迈克尔·柯林斯的介入，不过，他更喜欢别人叫他迈克尔·奥柯林斯，因为他想与盎格鲁人保持距离，并以盖尔人联盟拥抱爱尔兰文化。然而，民主将成为过往之物，因为正是民主与天真幼稚的、被人误导的群众的意愿，让爱尔兰差点投入了放浪而贪婪的社会主义与左翼激进主义的怀抱。在“大块头”的领导下，我们的翡翠岛将在可靠的管理下，获得繁荣、进步与安全，并走向共和之梦。"
 IRE_Consolidate_The_Junta: "巩固奥柯林斯的独裁"
 IRE_Consolidate_The_Junta_desc: "爱尔兰国家议会，我们的立法机构，由参议院与民选产生的众议院组成，将同爱尔兰最高法院一样，彻底成为柯林斯政权的傀儡。这样一来，我们敬爱的首席部长，奥柯林斯便能够随心所欲地颁布法令，引领爱尔兰走向真正的安全和繁荣，而不必受民主程序或其他政府部门不必要的干预。奥柯林斯将牢牢掌控着共和国，一个真正的爱尔兰专制政权也将由此产生。"
 IRE_Safeguard_Against_Reds: "抵御赤魔的措施"
 IRE_Safeguard_Against_Reds_desc: "爱尔兰的民主体制险些让社会主义恶徒夺走我们心爱的翡翠岛，决不容许此等危局重演。我们将掀起自己的红色恐怖来对付这些赤匪豺狼，借由立法手段、鼓励志愿者与义务警员积极行动，我们终将摆脱这些卑鄙的极端分子和反爱尔兰的盎格鲁走狗。纵使拼尽全力，也不会让赤匪玷污我们的岛屿！"
 IRE_Strongman_Populism: "“大块头”保卫人民"
 IRE_Strongman_Populism_desc: "在小时候，因为他比其他人长得都要高，迈克尔·奥柯林斯首席部长便成了小孩口中的“大块头”，他一直致力于保卫我们的岛屿，并常常展现出强人姿态。爱尔兰前所未有地需要这个强壮的大块头来充当调停者、民粹主义者、布施仁慈者与支配者，将我们从肮脏的自由主义、社会主义和其他掠夺成性的反爱尔兰思想中解救出来。总统将大权在握、洞察万物、统领一切，“大块头”将一跃成为爱尔兰长久以来需要的强人。"
 IRE_Hero_To_The_People: "敬国家唯一的真英雄"
 IRE_Hero_To_The_People_desc: "无论在复活节起义抑或在大英帝国崩溃后我们争取自由与独立时，迈克尔·奥柯林斯都可谓是个真英雄，他把我们的国家从盎格鲁人手中拯救了出来，孑然一身地捍卫着爱尔兰，而投机分子与民族主义蠢货却想让这一切都毁于一旦。奥柯林斯，我们的大块头，将被尊为真正的共和国之父与爱尔兰独立的先驱。当对我们敬爱而英勇的领袖的个人崇拜逐步形成后，所有人都将服从他的命令，所有人都将尊重他的遗产。"
 IRE_Peace_Safety_Security: "和平，安全，保障"
 IRE_Peace_Safety_Security_desc: "没有保障何谈安全？没有安全何谈和平？没有和平何谈进步？倘若新爱尔兰要迈向伟大未来，我们就必须不惜一切代价去保卫它。翡翠岛一切真正儿女的繁荣正系于我们的一念之间，迈克尔·奥柯林斯将用天鹅绒包裹着的铁拳引领我们走向未来。国家将为所有人的利益维持安全，并建立一个强大的、防御周密的、监控严密的爱尔兰，将全体人民的安全与生计置于个人的需要之上。"
 IRE_Settle_Score_With_Valera: "算算旧账"
 IRE_Settle_Score_With_Valera_desc: "埃蒙·德·瓦莱拉是独立的爱尔兰共和国的开国元勋之一，与卡哈尔·布鲁阿和迈克尔·奥柯林斯一同为自由而战。然而，德·瓦莱拉和柯林斯的关系可谓坎坷不断，他们过去是盟友，现在却常常是对手，他俩的分歧主要在是否要靠盎格鲁人助力建立一个独立的爱尔兰上。虽然他可能算是我国的英雄，但他也对柯林斯的统治构成了威胁，因此，他必须被处理掉。我们将限制德·瓦莱拉在公众舞台上的地位，并在描述我们未来斗争的历史书淡化其存在，同时将他从有影响力、有权力的政府职位上赶走。若是他有异议，他就会被遣返回美国，因为这个新爱尔兰必须维持统一战线才能生存。"
 IRE_A_Dictator_so_There_Will_Be_No_More_Dictators: "终结未来所有独裁者的独裁者"
 IRE_A_Dictator_so_There_Will_Be_No_More_Dictators_desc: "迈克尔·奥柯林斯的话语就是爱尔兰的法律，只因“大块头”是岛屿之上无可置疑的独裁者。然而，他这样做不是贪图权力，也不是为一己私利，奥柯林斯一直将自己视为一名士兵与自由战士，而非一位政治家或国家与人民的领导人。爱尔兰需要迈克尔·奥柯林斯首席部长，但它却不配拥有这位独裁者，因此，他已声明他将是头一个也会是最后一个独裁者。他将成为终结未来一切独裁的独裁者，因为一旦爱尔兰的民主、共和与独立在大块头的领导下得到全方位的保障，正常的民主自由便将回归国家。就目前而言，奥柯林斯应该以厉声震拳，成为爱尔兰所需要的铁腕人物，在我们真正获得自由之前，肩负起他肩上的重担，让他人不必承担，也因他人无法承担。"
 IRE_Ireland_Save_Forevermore: "爱尔兰永葆平安"
 IRE_Ireland_Save_Forevermore_desc: "在“大块头”迈克尔·奥柯林斯的领导下，爱尔兰可谓高枕无忧，摆脱了背信弃义的社会主义者和他们的盎撒主人的影响。我们的国家巍然屹立，一个统一而独立的爱尔兰共和国的梦想现已成为现实，这一切都要感谢我们的铁腕人物与自由战士、我们的国父。尽管国家层面的民主程序已基本停止，但至少就目前而言，地方层面的民主与自由仍蓬勃发展，广大爱尔兰人民在“大块头”与复兴的盖尔民族主义身份的支撑下，在和平的保障中安享繁荣昌盛。迈克尔·奥柯林斯将继续引领共和国走向真正的繁荣，保护国家不受激进主义与外国颠覆分子的破坏，直到他自己认为国家终于准备好重归常态为止。"
 IRE_ANH_Government: "复兴建筑师崛起"
 IRE_ANH_Government_desc: "在软弱的民主灭亡之时，复兴建筑师夺取了政权。由加莱德·奥金纳甘所领导，复兴建筑师寻求从自由主义、工团主义、背信弃义满腹阴谋的英国人手中解救爱尔兰，而这需要通过复兴濒临灭亡的爱尔兰语，发扬爱尔兰文化民族主义与泛凯尔特复兴主义等多种思想，并建立一个基督教法团主义国家，同时，这些事物都要掌握在一个威权右翼民粹主义专制政权手中，其执政理论基础来自科德里亚努等军团主义者，经济政策则效仿罗斯福与拉瓜迪亚。在这种基督教社会教义指导下的右翼思想大综合的帮助下，我们将为所有真正的爱尔兰儿女建立一个更强大、更纯洁、更凯尔特、更虔诚的爱尔兰国家。新领袖奥金纳甘万岁！"
 IRE_Anti_Socialism: "立法对抗工团瘟疫"
 IRE_Anti_Socialism_desc: "工团主义是拙劣至极的产物，其为外国统治者与理论家的利益服务，而非为当地群众的真正利益服务，它渗透人们的思想，蛊惑他们变得暴力激进、接受反爱思想，它仿佛是种病毒，侵蚀着爱尔兰及其人民的身心。虽然我们的意识形态中确实包含了一些左派的经济政策，但这并不意味着我们会任由这种卑鄙而激进的意识形态毒害我们的岛屿。工团主义、革命左翼以及其他激进社会主义思想都将被国家禁止，尽管某些可接受的左倾进步思想和经济理论将保留下来，因为奥金纳甘业已将这些无人知晓的思想纳入了党的路线中。爱尔兰将摆脱煽动者的胡言乱语，取而代之的是真实且毫不妥协的右翼民粹主义，因为这正是爱尔兰人民真正需要的。"
 IRE_Promote_Irish_Language: "弘扬传统凯尔特复兴主义"
 IRE_Promote_Irish_Language_desc: "奥金纳甘曾是传播爱尔兰语言的社会文化组织，盖尔联盟的成员，后来，他脱离了该组织并成立了自己的泛凯尔特民族主义团体，即复兴支部，我们如今的政党也由此演变而来，他本人也已登台亮相，成为了凯尔特民族主义与盖尔复兴主义的门面人物。加莱德·奥金纳甘领袖呼吁重振爱尔兰语与传统凯尔特文化及氏族身份，而一旦民众完全适应了这一百分百爱尔兰的新理念，英语便将被彻底禁止使用，我们也将出台支持生育的政策来让凯尔特人人丁兴旺，并禁止爱尔兰人移民海外，加莱德·奥金纳甘领袖将令爱尔兰真正成为唯一的凯尔特国家。通过与泛凯尔特妇女团体自由联盟以及苏格兰、威尔士、曼岛和布列塔尼的民族主义和泛凯尔特运动达成合作，领袖将确保泛凯尔特之梦与盖尔文艺复兴得以蓬勃发展，为一切真正的凯尔特子孙带来繁荣与荣耀。"
 IRE_Irish_Corporatism: "发展爱尔兰基督教法团主义"
 IRE_Irish_Corporatism_desc: "怀着法团主义与阶级合作的思想，加莱德·奥金纳甘领袖大力推进着其计划的实施，努力将爱尔兰转变为一个自己掌控、受主青睐的基督教法团主义的专制共和国。在爱尔兰右翼中，奥金纳甘可谓是与众不同，他不反感新教徒，对他们和天主教徒一视同仁，只要他们发誓效忠于国家与民族，不为任何境外团体或人物作走狗便可。因此，一神论的基督教信仰将成为我们虔诚的法团主义制度基础。资本主义与社会主义等有害毒素将被从国家机器中祛除，各个阶级将和谐地一起生活劳动，一个新的经济与金融体系也将就此诞生，它摆脱了贪婪的资本主义，也不必受误入歧途的左翼民粹主义之害，一切真正的爱尔兰子民都仰仗于它。"
 IRE_Legion_Ties: "与蓝衫军齐步前行"
 IRE_Legion_Ties_desc: "奥达菲的蓝衫军可能不属于复兴建筑师，但他们与我们的运动可谓志同道合，甚至加莱德·奥金纳甘领袖年轻时还在他们的民兵中服过役。我们应该允许蓝衫军继续他们的工作，但他们要成为国家的官方机构和党的一部分，并且要受到严格的限制，以避免不必要的流血与反弹，他们的反新教态度也得适当收敛。我们将共同建设一个安全、强大、虔诚、真正贴合我们传统根基的爱尔兰。"
 IRE_English_Crackdown: "镇压盎格鲁人"
 IRE_English_Crackdown_desc: "盎撒人，或是英国人，他们根本没有什么文化可言，因为他们只不过是群狼狈为奸的窃贼、暴君、秃鹫与寄生虫。在其漫长的历史中，他们除了杂交与征服外一事无成，他们征服别族的土地，传播着他们可悲而肮脏的血统，他们还肆意窃取其他民族的文化成就和天才人物，而他们这么做只不过是为给自己的卑劣族群找补些存在感。我们必须将这一失败的民族及其污点从爱尔兰一扫而空，这样一来，翡翠岛才能最终获得自由、并真正完全地凯尔特化。我们将采取行动，逐步限制英语的使用范围，直到将其从本地语言中完全根除，我们还将制定法规，限制任何胆敢留在我们岛上的盎格鲁人的权利。我们要净化凯尔特民族，终结这些肮脏的臭狗几个世纪以来对我们的压迫。正是此时，正于此地，凯尔特复兴的时代即将降临！"
 IRE_New_Deal: "新市场"
 IRE_New_Deal_desc: "“新市场”是加莱德·奥金纳甘领袖所设想的经济计划，该计划以右翼民粹主义思想与严格监管的反资本主义市场为根基，以缓解爱尔兰寻常大众的困境为宗旨，以宣扬阶级合作、摒弃阶级对立为重心。这一为爱尔兰人民制定的新政受到了拉瓜迪亚、西奥多·罗斯福和已故的富兰克林·德拉诺·罗斯福等美国进步人士的著作以及墨索里尼等人的经济著作的启发，我们让这些人的思想同我们的右翼立场相适应，并为所有爱尔兰人提供一个安全、公平和繁荣的经济环境，让他们沉醉其中，而不必担心会被背信弃义的左派掌控。"
 IRE_Military_Build_Up: "爱尔兰岛军事化堡垒化"
 IRE_Military_Build_Up_desc: "如果爱尔兰要变得安全稳固，我们就得大规模军事化我们的祖国，加强每一处滩头阵地和港口的防务，因为我们的敌人已饥肠辘辘，过不了多久就会再次袭击我们。新的工厂和工业中心拔地而起，冒出的滚滚浓烟展现着我国的进步与现代化，而我们的武装力量也得以扩张，守卫着我们“翡翠岛”的每一寸土地。爱尔兰永不沦陷！"
 IRE_Ireland_Strong_And_Free: "爱尔兰强盛而自由"
 IRE_Ireland_Strong_And_Free_desc: "在加莱德·奥金纳甘领袖和复兴建筑师的领导下，凯尔特文艺复兴和爱尔兰复兴正势不可挡，爱尔兰正强大而自由地蔑视着我们的敌人，蔑视着许多人认为不可避免的被征服命运。我们再也不会向外国征服者卑躬屈膝，复兴的泛凯尔特身份认同与我们繁荣的混合经济一同带领着我们走向繁荣与进步！在领袖与上帝的庇佑下，爱尔兰将永世矗立，我们的法团主义天堂与凯尔特人民的精神亦将永存！"
 IRE_Blueshirts: "蓝衫军之岛"
 IRE_Blueshirts_desc: "约恩·奥达菲和他的蓝衫军，正式名称为陆军同志协会，已决定奋起拯救我们统一的爱尔兰共和国，使其免受激进的社会主义与自由主义的威胁，摆脱迈克尔·柯林斯和统一党的鼠目寸光。带着对农业的偏爱与对天主教的虔诚，奥达菲将在铁拳下引导翡翠岛的人民，以国家统合党为中心，建立一个强大、保守和虔诚的爱尔兰，并拥护复活节起义运动的思想，捍卫在烈焰与炮火洗礼中诞生的共和之梦。现在，在其教国威权主义、农业法团主义、盖尔复兴主义、爱尔兰民族主义、天主教民粹主义和反左派思想的支持下，奥达菲元帅将让一个强大、独立、完全属于爱尔兰人的爱尔兰的梦想成真。"
 IRE_Honour_Collins: "向柯林斯致敬"
 IRE_Honour_Collins_desc: "尽管迈克尔·柯林斯兴许没有勇气像奥达菲元帅那样，为保护爱尔兰行必行之事，并最终为此付出了惨痛代价，但他仍是爱尔兰的独立英雄，也是爱尔兰现代史上最著名的人物之一。作为爱尔兰共和军最成功的起义领袖之一，柯林斯就像一盏指路明灯，指引着我们度过“动乱时期”，走向真正但谨慎的自由，直到他不幸英年早逝。我们将尊重柯林斯以及他作为自由战士和伟大谈判家所忍受并牺牲的一切，给予他应得的尊重，同时也会传承他骄傲而光荣的遗产，亦或是已成为过去时的遗物，毕竟他失败了，而我们的蓝衫军凯旋得胜。我们将稍稍收敛，用柯林斯的良好名誉为我们背书，确保我们能真正实现我们对爱尔兰共和梦的诠释，并利用逝去的大块头的形象来维护我们的新政权与我们在群众眼中的地位。"
 IRE_Maintain_Social_Order: "重建社会秩序"
 IRE_Maintain_Social_Order_desc: "近年来，爱尔兰社会的结构与繁荣大受打击，因为我国已在激进极端主义、社会主义、自由主义以及境外或其他颠覆性影响的压力下日趋崩溃。我们必须重建这一日益分崩离析的结构，同时确保能在这个秩序与和平的新时代带来真正的法律、秩序与正义。在奥达菲和陆军同志协会的领导下，为了全爱尔兰与全体爱尔兰人的利益，爱尔兰将重获健康，再度变得井然有序并善于服从。"
 IRE_Oppose_Syndicalism: "驯服赤色狂犬"
 IRE_Oppose_Syndicalism_desc: "我们要反对工团主义及其一切邪恶的衍生形式，因为没有什么比追随背信弃义的盎格鲁威胁的强盗意识形态更不爱尔兰了。一切左翼政党和其他类似的组织都将被取缔，其成员与已知的同路人都将被列入政府的监视名单，他们的活动将受到我们日益壮大的警察部队和蓝衫军民兵的密切监视，如果他们有任何越轨行为，法律便绝不会手软。为了一切真正爱尔兰人的利益，我们将彻底消灭赤匪走狗，翡翠岛将被净化。"
 IRE_Organize_Public_Service: "重组公共服务"
 IRE_Organize_Public_Service_desc: "国家机器已然衰颓，不断受到地下工团主义者和打着改革与民粹主义旗号的激进自由派的攻击。我们需要一个崭新的公务员制度和与官僚机构，其将摆脱毒害着我们心爱的翡翠岛的、这些幼稚的意识形态病毒。从最底层的地方政府和氏族组织，到国家议会与我们自己的警察部队之中，我国行政管理机关的方方面面都得被清洗、重组并重新配备人员，以确保一切公共服务与政府机构都是忠诚且运转良好的，并能牢牢地被我们所控制。"
 IRE_Christian_Ireland: "纯净的天主教爱尔兰"
 IRE_Christian_Ireland_desc: "我们起义伊始，奥达菲元帅以及爱尔兰共和军和蓝衫军的民兵便以公开的天主教狂热分子与反新教爱国者的身份闻名。这些虔诚的天主教徒袭击新教徒的住宅店面，掠夺武器物资，同时还偶尔屠杀胆敢反抗的新教徒叛贼和明目张胆的盎格鲁走狗。如今，这些虔诚的天主教徒让这些措施上升到了国家层面。天主教将是爱尔兰认可的唯一宗教，所有人都应遵循此种正信，否则，倘若他们还想留条小命，那他们就得把自己的信仰藏在心里，我们的岛屿再也不会受到危险的、异端的、背信弃义的新教宗派主义的影响。"
 IRE_Organize_Employers: "组织雇主"
 IRE_Organize_Employers_desc: "当奥达菲政权努力依照我们的新天主教法团主义道路重组经济时，一个大难题出现了，我们的经济要如何从掠夺成性和毫无节制的资本主义转向我们有利可图、稳定繁荣的经济模式呢？我国的雇主，包括管理层在内，以及资本主义机器中的其他齿轮都应接受再教育并得到重组，以期创建一个更加公平的经济与有利可图的金融体系，让一切真正的爱尔兰人受益，而非少数精英。借由从经济中消除资本主义与社会主义的一切持久影响，我们将建立一个更平等但更专制的法团主义国家，它将建立在阶级合作、贸易保护主义与全国范围内的经济平等的基础上，这样一来，所有爱尔兰忠诚的子民们都能真正富裕起来，而不至于被危险而充斥着掠夺性的激进主义所蛊惑。"
 IRE_Organize_Farmers: "组织农民"
 IRE_Organize_Farmers_desc: "小时候，奥达菲在一个贫穷的小农家庭里长大，他自己就是个农场男孩，也一直对农业事业情有独钟。作为一名更现代、更高效的耕作农业的支持者，奥达菲已开始着手进行爱尔兰自己的农业革命，并打压传统的牧场农业，他的前新芬党盟友因此与他有了重重抵牾。在新的法团主义经济结构得到了现代化、机械化的农业支持后，再加上贸易保护主义政策、新出台的法律法规、为我国农民提供的储备资金，爱尔兰的田地与沼泽将变成我们所能拥有的最为肥沃的农田，我们的农业传统也将大放异彩，并构建一个以农业为基础的现代经济，让群众吃饱穿暖、走向小康，也让翡翠岛绿意盎然。"
 IRE_Awaken_Ireland: "唤醒翡翠岛"
 IRE_Awaken_Ireland_desc: "在腐朽的旧民主体制下，爱尔兰几乎成了激进派的手中之物，但多亏了蓝衫军的干预与爱尔兰民族主义的复兴，这些灾难都得以避免。在约恩·奥达菲元帅的之下，可恶的老自由派与地下工团政府都被一网打尽，取而代之的是一个崭新的天主教法团主义国家机器，它是爱尔兰唯一真信以及忠诚爱国者的坚定后援。翡翠岛将永远繁荣昌盛，强大而自由，在奥达菲的天才远见与上帝圣光的指引下，新政府将使国家走向我们自然而虔诚的天命。"
 IRE_Democratic_Mandate: "民主任期"
 IRE_Democratic_Mandate_desc: "尽管历经狂风骇浪，爱尔兰民主仍挺立于此，复活节起义的目标仍未动摇！建立一个民主的爱尔兰共和国的初心理想仍将存续，新一次民主选举也正在筹备，国家议会各主要政党——共和党、新芬党、民族中央党、统一党——都将参加竞选。我们已让爱尔兰人民再度发声，如今便是聆听他们声音的时候了！"
 IRE_Valera: "共和党胜利"
 IRE_Valera_desc: "爱尔兰共和党赢得了近期的民主选举。这些保守派基督教民主党人坚决拥护着爱尔兰国父与共和党创始人埃蒙·德·瓦莱拉的理念，宣扬着中右翼民粹主义、非激进的爱尔兰民族主义、盖尔保守主义与虔诚的基督教理念。在这些民粹保守主义者的领导下，爱尔兰将作为一个国家、一个共和国、一个在上帝注视之下的民族得到治愈、安享繁荣。"
 IRE_Christian_Democracy: "真基督教民主"
 IRE_Christian_Democracy_desc: "共和党一直以追求善良而神圣、符合基督教教义且虔诚的爱尔兰民主为荣。如今，德·瓦莱拉与其天主教民主派小团体终得掌权，爱尔兰将再次在主的光芒下奋勇前进，弘扬天主教的道德与情感，并建立起一个公平且完好无损的保守民主制度，以此让群众的声音更具力量。"
 IRE_Cultural_Conservatism: "文化保守主义"
 IRE_Cultural_Conservatism_desc: "本质上说，爱尔兰是个保守的国家，对剧变警惕不已，并与几百年来的传统与思想紧密联结。这种与天主教信仰和凯尔特传统相联系的文化保守主义遗产不仅要得到保护支持，而且还得在全国范围内弘扬传播，以此确保爱尔兰保守主义仍能主导未来几代人民的思想。"
 IRE_Irish_Soverignty: "巩固爱尔兰主权"
 IRE_Irish_Soverignty_desc: "共和党政纲的主要目标之一便是建立一个完全独立且享有主权的爱尔兰国家，推行盖尔语复兴主义并进行反盎格鲁改革，拥护现代且非激进的爱尔兰民族主义，弘扬天主教骄傲。基于这些统一的立场，我们将缓步前进，建立一个完全属于爱尔兰的翡翠岛，我们的建党初心是为爱尔兰人民服务，也仅是为爱尔兰人民服务。"
 IRE_Special_Status_Church: "教会特殊地位"
 IRE_Special_Status_Church_desc: "在爱尔兰社会中，天主教会一直占据着特殊而崇高的地位，它们有时候甚至凌驾于政府或英帝国主义者之上，成了国内最具影响力的组织。作为支撑我们信仰的基层组织与保守传统主义的坚定盟友，我们将在不抛弃世俗主义理念的情况下稍稍让步，给予天主教会补贴并使其在国内享有特殊地位，确保我们敬爱的教会在未来的岁月里能够与国家职能及其发展密切联系。"
 IRE_Fiscal_Conservatism: "古典财政自由主义"
 IRE_Fiscal_Conservatism_desc: "虽然美国人误读了“自由主义”这个词，并把它与进步的、半社会主义的、以福利为基础的实践手段混为一谈，但我们欧洲人明白自由主义是个什么东西。我们将奉行古典自由主义财政政策，力主减税、减少政府开支、建设自由市场、解除金融管制、推进私有化、进行自由开放的贸易，并试图将限制政府债务规模置于其他经济目标之上。我们将建立一个与广大资本主义世界相互联系的强大而独立的经济体，终结爱尔兰经济停滞不前的现状，并使我们登上全球金融舞台。"
 IRE_Smear_Collins: "摈弃柯林斯的遗产"
 IRE_Smear_Collins_desc: "尽管柯林斯是爱尔兰共和军著名的自由战士，也是位受人尊敬的演说家、谈判家与政治家，但他始终是只披着羊皮的狼。他是个潜在的暴君、毫不掩饰的强人，他曾密谋将爱尔兰玩弄于股掌之中，尽管他确实曾有建立一个独立爱尔兰的崇高理念。我们必须揭示有关柯林斯的种种真相，向大众展示面具背后的真实人物，同时进一步维护爱尔兰独立的真正英雄德·瓦莱拉的名誉。"
 IRE_A_Conservative_Ireland: "上帝之下的保守爱尔兰"
 IRE_A_Conservative_Ireland_desc: "因爱尔兰保守主义之父及其共和党盟友的意愿，天主教道德与现代化传统主义再度给予了翡翠岛一个安全而繁荣的怀抱。根据埃蒙·德·瓦莱拉的意愿，非自由主义与反社会主义的天主教民粹主义已然崛起，大众受其鼓舞，有节制的资本主义与天主教道德也为我们一度停滞不前的社会经济现实注入了活力。在上帝的注视下与德·瓦莱拉的共和党的治下，重生的爱尔兰民族将自豪、虔诚、坚强地对抗腐败丑恶的境外势力，为一切沐浴着主的光辉的真正爱尔兰子民们开辟一条通向繁荣的道路。"
 IRE_Collins_Democracy: "统一党再当选"
 IRE_Collins_Democracy_desc: "统一党又下一城，再度以统一爱尔兰的拥护者的身份登上了爱尔兰民主之巅。统一党奉行自由保守主义，信奉基督教民主，一直以来宣扬着一种务实而不受意识形态约束的方法来服务大众，并声称他们的道路才是摆脱了意识形态与教条束缚的唯一正道。在前自由斗士、国父迈克尔·柯林斯的领导下。统一党将在惠及民众、尊重历史与传统的同时，引导爱尔兰民主沿着重在斡旋而务实的中派路线走向未来。"
 IRE_Use_Collins_Popularity: "柯林斯的实用英雄主义"
 IRE_Use_Collins_Popularity_desc: "古往今来，尚未有人能超越迈克尔·柯林斯，因为数百万爱尔兰人都对这位自由战士和爱尔兰独立之父致以最高的敬意。但因为我们吹嘘着大块头的权力及其自我，这种半吊子的个人崇拜确有些危险，不过其潜在利益远远超过了它所带来的小小风险。统一党将利用柯林斯的知名度以及其在爱尔兰文化与政治中无与伦比的地位，以此确保我党及其纲领如同柯林斯一样得到广泛爱戴与追捧。"
 IRE_Old_Dog_New_Tricks: "老东西的新把戏"
 IRE_Old_Dog_New_Tricks_desc: "自从我们在英国大革命后获得自由，打败了阿尔斯特的统一主义者起义后，柯林斯已执政了相当长的一段时间，在近十年间统治着自由独立的爱尔兰共和国。尽管他为建立一个繁荣和自由的爱尔兰而废寝忘食，但随着最近德国经济开始衰退，爱尔兰经济也开始停滞不前。许多人担心，柯林斯现在已然英雄末路，只能靠过去的功劳聊以自慰，但不是真的！柯林斯不仅努力利用自己作为战争英雄、爱尔兰共和国国父、爱尔兰统一党创始人的声望，还推动了一系列新的改革与立法，旨在再次为经济和全社会注入活力。“老狗会学新把戏”，他将巩固其作为现代最伟大的爱尔兰政治家的遗产，在统一党领导下，翡翠岛将走向繁荣的现代化未来。"
 IRE_Hands_Across_The_Isle: "携手跨越爱尔兰岛"
 IRE_Hands_Across_The_Isle_desc: "如果爱尔兰要在即将到来的动乱中幸存下来，翡翠岛的人民便必须前所未有地团结起来。像德·瓦莱拉这样的蠢货在追求毫不妥协的基督教保守主义愿景时，他们只是在播下分裂情绪的种子，但我们决不允许！统一党将运用非激进的爱尔兰民族主义概念、无党派民粹主义以及其他广受欢迎的思想，团结我们岛上各不相同的政治群体，共同应对即将到来的风暴。倘若我们要为所有人创建一个强大、虔诚、繁荣的爱尔兰共和国，我们就必须与反对德·瓦莱拉的对手们以及岛上一切真正的爱尔兰政治家合作，因为要是连我们自己的政府都因派阀争斗分崩离析，团结大众便等同于无稽之谈，"
 IRE_The_Threat_To_The_East: "英伦恶棍，蠢蠢欲动"
 IRE_The_Threat_To_The_East_desc: "在东方，爱尔兰人民的永世大敌正蠢蠢欲动，打算像他们几百年来所做的那样，暗中使我们走向衰败并趁机征服我们。盎撒人永不可信，哪怕柯林斯具有谈判者与外交官的专业技能，但卑鄙的英国人在多年前还是拒绝了我们对自治与建立爱尔兰自由邦的要求。对我们来说，幸运的是，他们的自大终究毁灭了他们，英国大革命将他们的帝国化为灰烬，并最终让爱尔兰人民获得了自由，但这并不意味着我们就能高枕无忧。他们或许举着新旗帜，还对工团主义的红星顶礼膜拜，但这些疯狗到底还是一个样。我们决不能放松对英国威胁的警惕之心，因为我们决不允许动乱时期再度降临。"
 IRE_Pragmatic_Liberalism: "务实自由主义"
 IRE_Pragmatic_Liberalism_desc: "统一党奉行的自由主义与颓废而扭曲的“自由主义”观念相去甚远，只有老掉牙的欧陆人、美国人或他们的意识形态盟友会信奉这种“自由主义”，柯林斯与我们团结的爱尔兰坚定地站在真正的自由主义与启蒙运动的理念一边。按照某些人的标准，我们兴许有些保守。但是，我们走的是通往自由与共和社会的真理之路，摆脱了食古不化的传统主义和如同小脚女人般的保守主义，也战胜掠夺成性社会主义与天真的进步主义，而且在任何时候都能务实地判断出属于我们社会最正确的前进道路。这种真正的自由资本主义将铸就国家的基础，确保爱尔兰自始至终都能走在最适合它的道路上。"
 IRE_Irish_Unity: "团结在爱尔兰民族主义之下"
 IRE_Irish_Unity_desc: "虽然常常被激进主义与意识形态所玷污，但民族主义本身并没有什么害处；事实上，正是这些非激进的爱尔兰民族主义的概念构成了统一党的执政之基。借由向大众传播这些非暴力的爱国主义与忠于民族的思想，并同时振兴我们本地的盖尔文化与语言，我们将努力使爱尔兰人民前所未有地团结一致。尽管我们会在部分地区尤其是阿尔斯特遭遇困难，因为当地的联盟派会给予我们极大的阻力，但统一党将坚持不懈地让爱尔兰上下团结一心，因为这种团结将能为我们抵御外敌及其渗透建起坚实的壁垒。"
 IRE_Defend_Democracy: "翡翠岛的守护者"
 IRE_Defend_Democracy_desc: "爱尔兰属于爱尔兰人！这是我们坚持并维护的梦想，统一党是翡翠岛的剑与盾，柯林斯及其支持者用此对抗反爱势力与盎撒瘟疫。借助受控的军国主义、复兴以工业与城市为中心的经济，再加上民众的忠诚，我们将保卫爱尔兰与我们自由民主的共和国，击败一切试图破坏我们政纲的人。任何工团主义猪猡与反动派恶棍都不得伤我们亲爱的人民一丝一毫，因为爱尔兰将永远坚强而自由。"
 IRE_Democracy_Under_The_Big_Fellow: "“大块头”治下的民主"
 IRE_Democracy_Under_The_Big_Fellow_desc: "在大块头迈克尔·柯林斯的领导下，爱尔兰经受了独立后的考验、阻止了工团主义自不列颠海岸蔓延过来、消除了统一主义者的威胁、让翡翠岛人民团结一心，爱尔兰也在基督教保守自由主义、爱尔兰民族主义与处于约束下的资本主义的支撑下，迎来了真正的大众民主共和主义。大块头曾只是位战士与外交家，而如今却已成为爱尔兰无可争议的政治大师，在一些人眼中，他甚至是现代爱尔兰最伟大的人。我们美丽而青翠的岛屿强大而自由、繁荣而虔诚，只因它正处于统一党光辉的指引下，而这一切都要归功于我们的大块头。"
 IRE_National_Center: "民族中央党胜利"
 IRE_National_Center_desc: "事态发生了令人震惊的转折，规模相对较小的民族中央党赢得了群众的信任，掌控了爱尔兰的民主制度。民族中央党的前身是全国农民和纳税人联盟，乍一看，它似乎与他们讨厌的对手共和党有许多相似之处。然而，他们的不同之处也很突出，民族中央党倡导农业主义与亲农民的农业改革，信奉基督教保守主义，温和的爱尔兰民族主义和爱国主义，而最为与众不同的是，他们想与我们从前的盎格鲁敌人缓和关系，同时在占民族中央党执政基础的大部分的农村群众的支持下，围绕着农业与农村改革经济。该党领袖弗兰克·麦克德莫特和詹姆斯·狄龙将带领爱尔兰回归其传统的基督教根源，并与以城市为中心的共和党作斗争，确保农村不再无人关心，让爱尔兰成为一个由农民、牧羊人与田园天堂组成的国家。"
 IRE_End_Anglo_Irish_Hostilities: "终结英爱敌意"
 IRE_End_Anglo_Irish_Hostilities_desc: "希伯尼亚和不列颠尼亚自始至终都是真兄弟，哪怕我们与盎格鲁人的历史往好了说都是坎坷崎岖的，但我们终究不能否认我们之间共同的纽带、历史与未来。民族中央党一直致力于结束盎格鲁-爱尔兰贸易战，既然如今这些农村农民掌握了大权，我们也终于可以向和解的目标靠近了。在我们于经济和外交上向我们的旧敌靠拢时，我们对东方兄弟的仇怨便将慢慢消散，我们也将共享繁荣、共筑和平，最终让我们共同居住着的岛屿变为田园天堂。"
 IRE_Language_Equality: "一个爱尔兰，两种官方语"
 IRE_Language_Equality_desc: "尽管我们美妙的爱尔兰语在现代仍能存续，但它也自身难保，被更占优势、更广为流传的盎格鲁语步步紧逼，逐渐成为历史书中的过往一页。根据我们与英格兰人缓和关系的目标，同时不忘我们与翡翠岛上的大多数爱尔兰人共同信奉的盖尔复兴主义与爱尔兰文化保护主义思想，我们将实行双语政策。爱尔兰盖尔语与英语都可在官方或私人场合使用，并被并列为爱尔兰的两种官方语言。虽然我们仍将追求戈伊德尔语、凯尔特文化与身份认同的复兴，但英语也将永远在这里占有一席之地。"
 IRE_Protectionism: "希伯尼亚保护主义"
 IRE_Protectionism_desc: "爱尔兰在欧洲之中的位置可谓得天独厚，位于北海之中，远离混乱欧陆，夹在各国经贸区之间，海风吹拂着我们，我们也试图寻找一片容身之所。为了维护我们自己的经济繁荣与进步，民族中央采取了他们所钟爱的保护主义经济政策。而为了继续缓和与英国的关系，关税、进口配额与其他保护措施应对英国市场进行适当调整，我们则会将政策重点转向欧陆和美洲。我们将建立一个由爱尔兰人建立、为爱尔兰人服务的强大而稳定的经济体系，这一切都要依靠我们自豪的、有了靠山的农民与不断增长的农村人口。"
 IRE_Middle_of_The_Road_Politics: "坚持中道"
 IRE_Middle_of_The_Road_Politics_desc: "复兴建筑师或奥达菲的蓝衫军激进分子与爱尔兰工人联盟中的腐朽的工团主义者以及其在新芬党等组织中的社会主义盟友并无不同。两派人马都试图瓦解我们辛辛苦苦建立起来的独立民主共和国；我们绝不允许这事发生！民族中央党的政策将坚决反对激进主义，捍卫所有真正的爱尔兰人都知根知底并衷心热爱的民主制度。我们要恪守中道：一条光辉而正义的道路，横在天真的左派和短视的右派之间，横在统一党的威权自由主义与共和党以城市为中心的贪婪之间，并为了翡翠岛上所有人的利益服务。"
 IRE_Agrarianism: "农民为基石"
 IRE_Agrarianism_desc: "民族中央党是由农民建立的，也是为农民服务的，所以其最初被称为全国农民和纳税人联盟是有原因的。尽管我们在整个民主光谱中的主要对手都以城市为基础盘，但只有我们得到了群众的认可，得以带领共和国进入一个新的乡村时代。作为英国制度遗留下来的财产税制度应从一切农业用地中取消，我们的农民也能够将这些钱重新投入到他们的田地与牧场，同时我们也将推广新的现代化与机械化耕作方式，让我们的农业跨出石器时代。翡翠岛传统的放牧方式也将被恢复，以此进一步拉开我们与旧压迫者陈旧而外来的耕作方式的距离。以农民为基础，以农村和牧民为核心，我们将使翡翠岛更加青翠欲滴，让爱尔兰展现出一派田园牧歌式的田园风光。"
 IRE_Central_Bank: "改革央行"
 IRE_Central_Bank_desc: "民族中央党政纲的核心目标一直是改革爱尔兰的银行体系。尽管我们是个独立国家，但我们的货币体系仍与英镑紧密相连。尽管在其任职期间，柯林斯试图创建一家独立的爱尔兰央行，但他基本上失败了，我们的财政也因此失稳。我们应为爱尔兰建立一个新的央行，以爱尔兰镑为核心，使其独立于其他货币。此外，这一举措将与全国减薪和包含其他保护主义政策在内的通货紧缩措施相配合，最终将我国的经济从外国人的善恶争斗中解放出来，为所有爱尔兰人的利益服务。"
 IRE_Oppose_Valera: "反对瓦莱拉保守主义"
 IRE_Oppose_Valera_desc: "埃蒙·德·瓦莱拉及其共和党走狗一直以来都是我党的心腹大患，哪怕我们两党在保守派的立场与政策上如此相似。然而，德·瓦莱拉的保守主义与民族主义思想过于依赖于虚假的民粹主义，痴迷堕落的城市主义，他还轻视农村，甚至误读了爱尔兰基督教。总之，他把立场当成赢得大众支持的工具，而非为人民造福的基础。我们将大力攻击共和党，将他们的成员和支持者拉向我们一边，这样我们就可以成长为爱尔兰保守主义与中右翼共和主义的代言人，向所有目睹之人揭示真相。"
 IRE_Centrist_Ireland: "恪守中道的乡土爱尔兰"
 IRE_Centrist_Ireland_desc: "在民族中央党的领导下，爱尔兰开始拥抱自己的牧业历史，乡村繁荣的新时代降临了翡翠岛。我们的农民和劳动者得到了保守的民粹主义和强有力的金融改革的支持，我们的田地沐浴着微风，比以往任何时候都更翠绿、更肥沃，我们的经济强劲而独立地向前发展，我们的人民在上帝的庇佑下欢欣鼓舞，并因一种不激进但虔诚的爱国主义与盖尔民族主义团结在一起。英国人不再步步紧逼，和平与合作几个世纪以来首次降临在英伦三岛之上。让我们欢饮达旦、勇往直前，民族中央党将继续为我们自由的爱尔兰农业民主制度注入活力。"
 IRE_Brugha: "新芬党胜利"
 IRE_Brugha_desc: "新芬党在近来的选举中胜选，这是爱尔兰工人阶级令人震惊的胜利，也让我们民主传统的保守氛围几近一扫而空。该党在1905年由亚瑟·格里菲斯创立，在我们在为自由而战的内战中四分五裂之前，新芬党的老党员们建立了爱尔兰革命共和国，创立了爱尔兰第一个本国议会，或称第一议会、革命众议院。新芬党的党名亦可译为“我们”，尽管该党党内有许多人仍支持并宣扬基督教伦理道德，党内的统一战线因此也浮现了一丝裂痕，但预计他们将追求实现爱尔兰民主社会主义共和国的梦想，并拥护左翼爱尔兰民族主义和世俗主义，在社会经济上则持进步主义立场。不管党内争论结果如何，新芬党都将砥砺前行，将爱尔兰变为英伦三岛上的粉色明珠。"
 IRE_Solidify_Irish_Republicanism: "巩固爱尔兰共和制度"
 IRE_Solidify_Irish_Republicanism_desc: "爱尔兰是自由而独立的，因为只有我们自己引领爱尔兰人民走向独立。我们必须把这种自由变为我们国家及其特征的一个重要部分，爱尔兰再也不会任凭境外势力摆布，更不会屈服于遥远暴君的私欲。社会民主主义与廉洁的共和主义将遍布翡翠岛，在新芬党的左翼民族主义与社会爱国主义思想的助力下，我们将成为呼吸这自由新风的牧羊人。"
 IRE_Promote_Gaelic: "重振发扬盖尔传统"
 IRE_Promote_Gaelic_desc: "几乎被爱尔兰各政党所普遍接受的政策之一便是复兴盖尔语与更广泛的爱尔兰-凯尔特文化，我党也不例外。然而，我们正义纲领的不同之处在于，我们不希望仅仅复兴我们往昔古老而极其保守的传统，我们还想对其进行改革，使之更好地适应我们的现代情况，同时与其充满宗教色彩与传统主义的思想做切割。我们必须复兴过去的遗产，并令其现代化，构建一个涅槃重生的盖尔人身份认同、语言和文化，为这个自由而独立的爱尔兰共和国奠定基础。"
 IRE_Call_For_Peace: "再度呼吁国内和平"
 IRE_Call_For_Peace_desc: "爱尔兰已被各种争吵冲突弄得四分五裂，每个人都渴望建立自己理想中的爱尔兰国家。我们必须努力让翡翠岛迎来一个和平而团结的新时代，以便使所有人都能够在大方向上团结起来。虽然我们不指望所有人都能加入我党，但我们的目标是创建一个和平而开放的国家，在那里，我们可以在不在乎党派路线或意识形态的情况下自然而平和地进行讨论，我们将在左翼愿景的基础上，构建一个真正公平而自由的民主制度，但我们也会向任何人的意见与愿望敞开大门。"
 IRE_Populist_Socialism: "无工团主义的平民社会主义"
 IRE_Populist_Socialism_desc: "工团主义让人民惊慌失措，这一点我们是肯定的。无论如何，我们都不能允许这些危险的激进派玷污我们进步事业的好名声。我们必须向大众表明，哪怕我们追求社会主义民主，并寻求改变掠夺成性的资本主义制度，我们也绝不支持工团主义的暴力激进分子及其专制盟友，更遑论他们的英国老大了。我们将以爱尔兰民族主义、社会民粹主义、福利经济铺路架桥，为真正且开明的左派开辟一条改革之路，并渴望永葆自由独立，所有这些也都是为了爱尔兰民众的利益。"
 IRE_Threats_to_the_East_and_West: "四处皆蛮族"
 IRE_Threats_to_the_East_and_West_desc: "我们曾为从英国人手中争得独立而奋战不休，但尽管他们如今怀着“崇高意图”，不列颠联邦似乎也并不比过去的暴君好多少。当然，加拿大的保皇党也好不到哪里去，他们同样渴望征服爱尔兰。我们不会选边站，因为我们明白他们都只想让爱尔兰及其人民卑躬屈膝。我们将坚定不移地保持独立，击败伦敦与渥太华的阴谋诡计，我们也将在山巅之上建立一个辉煌的社会城市，以让我们免受这些狂暴蛮族的伤害。"
 IRE_Patriotic_Leftism: "摆脱激进派的左翼爱国主义"
 IRE_Patriotic_Leftism_desc: "爱尔兰民族主义已构成了我党纲领的基础，哪怕我们倾向左翼，但我们首先是爱尔兰人。然而，民族主义往往与暴力激进行动与破坏性极端主义脱不了干系，这些观念也影响着人民群众。我们必须努力创造一种左派爱国主义思想，既因为自己的国家感到自豪应该像呼吸一样自然，也因我们正努力构建社会主义民主与福利经济，并将翡翠岛的公民与文化置于世间万物之上。"
 IRE_The_True_Hero: "爱尔兰的真英雄"
 IRE_The_True_Hero_desc: "尽管迈克尔·柯林斯本身就是个褒贬不一的英雄，但当谈及谁是爱尔兰独立的真正英雄时，他却窃取了卡哈尔·布鲁阿的功劳。柯林斯想要向英国佬卑躬屈膝，为了独揽翡翠岛大权，他甚至乐意向盎格鲁人出卖主权。我们必须向大众揭示真相，打击柯林斯的所谓“好”名声，因为我们要把布鲁塑造成自由且享有主权的爱尔兰的唯一而真正的国父。"
 IRE_We_Ourselves: "我们，自力更生"
 IRE_We_Ourselves_desc: "“我们自力更生”，这不仅是新芬党的座右铭，也同样是我们自由爱尔兰的座右铭。这句由爱尔兰民族主义者在本世纪初提出的座右铭让我们团结与共，为实现真正的自由与独立下的繁荣而斗争。在布鲁及其新芬党的独特而团结的愿景下，爱尔兰正享受着前所未有的繁荣昌盛，人民的前方道路宽阔，我们创造了一个社会民主主义天堂。虽然我党还在为宗教与经济问题争论不休，但我们仍将奋发向前，为所有爱尔兰人的利益，延续这一繁荣年代。"
 IRE_Socialism: "工团大会"
 IRE_Socialism_desc: "我们政治对手的痴心妄想已然粉碎，我们取得了胜利，爱尔兰现在沐浴在赤红色的初生光芒之中。社会主义已降临了翡翠岛，现在，我们的岛屿掌握在激进的理论家们手中。工团大会将马上召开，以确定我们所建立的、这个由左派主导的新民主共和国的方向。敬革命众议院！"
 IRE_Arms_From_Internationale: "第三国际援助"
 IRE_Arms_From_Internationale_desc: "我们憎恨被外国势力凌虐么？确是如此。但我们不能对第三国际的实力视而不见。如果我们要作为一个社会主义国家生存下去，我们便需要世界上最重要的社会主义者团体的支持，即使这意味着向伦敦卑躬屈膝。虽然不列颠联盟是我们的邻居，但我们当中的许多人都更倾向于与法兰西公社合作，并把法国人的支持比作法国对1798年让·亨伯特领导下的爱尔兰起义给予的支持。这种说法对许多主流社会主义者来说更容易接受，因此，这种同巴黎而非伦敦紧密联系的、勉强的合作政策将成为爱尔兰的官方政策。"
 IRE_Deal_With_Collins: "废黜“大块头”"
 IRE_Deal_With_Collins_desc: "尽管已沦为平头百姓，但柯林斯仍在攻击新的工团政府，并声称拉金不过是伦敦阴谋下的傀儡。他和拥护者大言不惭地鼓吹着，称爱尔兰工人联盟及其盟友已将爱尔兰出卖给了不列颠联盟，我国马上就要重蹈覆辙，再度屈从于不列颠尼亚的淫威之下，不过这次披了层红皮罢了。虽然这实在是荒谬绝伦，但柯林斯确是一股危险的力量；我们必须要解决这个问题。我们将一劳永逸地除掉这个“大块头”，并把他那些盲目的亲德派支持者们打个落花流水。"
 IRE_Replace_Provisional_Govt: "于星犁之下前行"
 IRE_Replace_Provisional_Govt_desc: "现在，詹姆斯·康诺利的梦想已然实现，我们准备用一个新生的一院制革命众议院来取代临时政府。尽管有无数社会主义者与劳工组织为今天的到来并肩奋战，但即将到来的选举仅由三个主要派别主导，一是由皮达尔·奥唐奈领导的、代表着激进的社会民族主义者的自由爱尔兰，二是由吉姆·拉金领导的、奉行工团主义的爱尔兰工人联盟，然后是由威廉·奥布赖恩领导的新工党，以及由极权主义者詹姆斯·格拉尔顿领导的革命工人团体。当我们这个稚嫩的社会主义民主组织起首次大选时，我们的翡翠岛正为它步入赤色未来做好准备，我们也都将作为自由人决定推动星犁的人选。"
 IRE_Labour_Victory: "工党胜利"
 IRE_Labour_Victory_desc: "威廉·X·奥布赖恩首席部长及其领导的劳工派和社会民主派在首次革命众议院选举中获胜。在爱尔兰旧有体制瓦解后，温和派便纷纷涌向重生的工党，但工党的起死回生仍让最热心的社会主义者都为之惊讶。拉金也许让劳工运动分崩离析，几乎让他们万劫不复，但奥布赖恩才是康诺利愿景的真正继承人，哪怕拉金是让革命降临到爱尔兰的人，但奥布赖恩才是笑到最后的人，因为工党已再度指引着爱尔兰社会主义。现在，我们承诺要为爱尔兰的社会主义道路铺就道路，同时维持国家的民主制度完好无损，我们将为翡翠岛带来真正平等的繁荣！"
 IRE_Moderate_Revolution: "温和的爱尔兰革命"
 IRE_Moderate_Revolution_desc: "虽然我国的选票革命可能会引来某些想要彻底改革体制的团体，但我们绝不允许他们把爱尔兰变成专制国家，或沦为共产主义及工团主义的地狱。工党承诺给爱尔兰带来的赤色革命将是场非常温和的革命；爱尔兰将成为一个粉红色的社会主义国家，所有公民都得以享受繁荣和自由，爱尔兰的国本却不因此动摇分毫。"
 IRE_Weaken_Executive: "削弱行政机关"
 IRE_Weaken_Executive_desc: "拉金等竞争对手可能希望将国家权力集中在个人手中，但奥布赖恩和工党知道，增加行政权力并不能解决问题，减少行政权力才行。借由削弱首席部长的地位，我们将确保没有人能在爱尔兰推行暴政。许多激进分子可能被爱尔兰的红色黎明所迷惑，但我们不会让他们剥夺我们辛辛苦苦捍卫的权利。包括强有力的立法机关众议院以及爱尔兰最高法院在内，政府的三个分支将平等合作，相互制衡，以确保威权主义永不得萌芽。翡翠岛将继续是民主而自由的天堂；现在如此，永远如此。"
 IRE_Workers_Army: "爱尔兰公民军"
 IRE_Workers_Army_desc: "准军事部队通常是激进分子的标配，他们希望以武力胁迫公民，而爱尔兰公民军将致力于维护爱尔兰人民的安全，而非威胁。公民军曾由工会成员组成，目的是保护工人免受警察暴行，但由于与工党在意识形态上的争斗而解体，但在工党牢牢掌权并团结一心的情况下，公民军得以重生并蓬勃发展，也毫无后顾之忧。有公民军站在我们一边，我们公平爱尔兰的工人将自由而安全，不受任何人的束缚。"
 IRE_True_Democratic_Socialism: "真正的民主社会主义"
 IRE_True_Democratic_Socialism_desc: "爱尔兰的社会主义之路是在投票箱前铺就的；人民用他们集体发出的声音推翻了腐败分子，不流血地就结束了反动压迫的旧制度。尽管许多人妄图剥夺我们不可剥夺的民主权利，但我们绝不能让激进派破坏先辈们披荆斩棘所取得的成就。我们不会屈服于独裁者，不会屈服于那些现在只不过是地下叛乱分子的反动派，也不会屈服于那些希望彻底推翻爱尔兰现行体制的激进左翼分子。"
 IRE_Trade_Union_Commitment: "爱尔兰工会化"
 IRE_Trade_Union_Commitment_desc: "通过票箱，我们赢得了为爱尔兰灵魂而战的伟大斗争；然而，我们还有许多事要做。现在是让爱尔兰工会化的时候了，我们要阻止压迫性的统治阶级破坏工人的自由，并让工人形成一个新的集体，保护我们的劳动力不受不公资本家的政治活动的影响。詹姆斯·康诺利不是头一个试图将工会化引入翡翠岛的人，若是老天有眼，他也不会是最后一个。在奥布赖恩的领导下，工会主义将传播到爱尔兰的方方面面，而不用担心激进主义或反动思想。"
 IRE_IWL_Victory: "工人联盟胜利"
 IRE_IWL_Victory_desc: "众议院议长，吉姆·拉金及其领导的爱尔兰工团派和工会派在首次革命众议院选举中获胜，在工人联盟的注视下，爱尔兰将沐浴在工团主义的绯红光芒之中，主流形式的左翼思想将在爱尔兰扎根。工会主义、工团主义经济、劳工主义以及与全体工团主义国家的国际合作将让革命齿轮紧密咬合，并为所有齿轮的利益而转动。"
 IRE_Irish_Trade_Union_Unity: "在爱尔兰工总会下团结一致"
 IRE_Irish_Trade_Union_Unity_desc: "按理来说，爱尔兰工会主义是个令人不安的话题。爱尔兰工会大会成立于1894年，是岛上主要的劳工联合会与全国工会中心，不同的产业与行业在同一面旗帜下团结了起来。然而，许多人担心这个组织已被英国佬以及他们的自私思想所玷污，而我们队伍中的激进派则认为这个过时的组织还远够不着工团主义的门槛。为了弥合这种分裂局势，也为了将权力与经济的控制权集中到政府和人民手中，我们将组建一个新的工会大会，名为爱尔兰工会大会。这个崭新的劳工与工会组织将让各种各样的职业工会与我们的大产业工会联合起来，创造一个统一的、国有化的经济，以让我们更好地建设工团主义。"
 IRE_Christian_Syndicalism: "上帝之下的工团主义"
 IRE_Christian_Syndicalism_desc: "十字架与社会主义之间并不冲突！一个人可以向木匠耶稣祈祷，并因此成为一个更好的社会主义者，我们一些至关重要的职业工会正是由为上帝与国家辛勤工作的木匠组成的。倘若正确理解的话，我们工团主义的愿景与基督圣洁而正义的愿景之间并不冲突。我们拥护十字架，就像我们拥护蒲鲁东和巴枯宁一样。《什么是所有权》与《圣经》都是我的圣书，永远如此！"
 IRE_Gallant_Allies_Abroad: "旧盟友，新机遇"
 IRE_Gallant_Allies_Abroad_desc: "吉姆·拉金议长在工团主义世界中交友甚繁，特别在由他的好朋友且同为劳工领袖的大比尔·海伍德领导的世界产业工人联盟之中，法国劳总联内部也有他的朋友。借助这些关系，拉金希望在国际工团主义的支持下，为爱尔兰开创一个新时代，并改善全球无产阶级与所有爱尔兰人的生活。通过签署新的贸易协议、外交协议、达成联盟等，我们和我们的新老盟友将在并肩走入新生的绯红黎明之时获得前所未有的繁荣。"
 IRE_Anti_Capitalist_Crusade: "承诺反对资本主义"
 IRE_Anti_Capitalist_Crusade_desc: "掠夺性资本主义已一次又一次地证明自己是万恶之源，它犯下的恶使我们美丽的翡翠岛饱受折磨。正是英国人的贪婪引发了马铃薯大饥荒，也是英国人的贪婪迫使爱尔兰人贱卖自己的儿女，还是英国人的贪婪让我国人民忍受了几个世纪的不公剥削，而爱尔兰资本主义一直甘为英国佬的利益作走狗！英国上层阶级对金钱的病态追求，加上国内资本主义寄生虫的助纣为虐，这个让我们的人民受苦受难的制度一直折磨着我们，是时候给它画上句号了。"
 IRE_Saor_Eire_Victory: "自由爱尔兰胜利"
 IRE_Saor_Eire_Victory_desc: "皮达尔·奥唐奈总统及其领导的狂热的激进派在首次革命众议院选举中获胜。“自由爱尔兰”党与农业社会主义、乡土主义、盖尔复兴主义与激进的民主爱尔兰民族主义紧密联系，人民期待他们引领激烈的社会变革，因为他们的执政重心不再是停滞不前、败坏风气的城市，而是致力于让全国各地都沐浴在共和社会主义的赤红光辉之中。"
 IRE_Irish_Social_Revolution: "迈向爱尔兰社会革命"
 IRE_Irish_Social_Revolution_desc: "在爱尔兰独立前，奥唐奈曾担任教师，他那时也在阿兰莫尔岛经营着一个公社，受此启发，他大力主张在爱尔兰进行一场彻底的社会革命。让爱尔兰的政治与经济改头换面还远远不够，倘若我们要实现真正的社会主义，我们的文化、技术、哲学、文化，甚至连身份认同都必须变得自由而赤红。然而，这一剧变很可能会引发变革的阵痛，所以我们必须小心翼翼，不能让伤害与暴力盖过我们努力改变爱尔兰人本身的意义所带来的好处。"
 IRE_Paint_IRA_Red: "煽动爱尔兰共和军左转"
 IRE_Paint_IRA_Red_desc: "奥唐奈认为，爱尔兰共和军应当服务于人民的事业，支持土地再分配与工人权利，但与之相反，在很大程度上，爱尔兰共和军已沦为天主教民族主义与保守派的腐朽小布尔乔亚老巢，又因其在阿尔斯特横行霸道，北方地区也受其拖累，深陷于贫困之中。为了解决这个问题，爱尔兰共和军必须再度成为它一直以来的工人组织，与爱尔兰公民军和爱尔兰妇女委员会中杰出的社会主义英雄勠力同心，成为我们社会革命的武装力量和我们新红色信条的捍卫者。也只有这样，康诺利的梦想才能成真。"
 IRE_Connollys_Dream_Made_Real: "康诺利之梦成真"
 IRE_Connollys_Dream_Made_Real_desc: "詹姆斯·康诺利是爱尔兰争取独立与社会主义的真正英雄。康诺利从始至终都在反抗不列颠人对我国的同志，他领导着爱尔兰公民军对抗我们的敌人，后不幸被英国人杀害。英雄虽逝，但其遗愿已由自由爱尔兰发扬光大，在奥唐奈主席的领导下，社会主义之梦终于在红宝石岛上得以实现。我们将永远将康诺利尊为自由爱尔兰之父，并在致力于将爱尔兰无产阶级从束缚他们的枷锁中解放出来的同时，继续发扬他的左翼民族主义与农业社会进步的思想。"
 IRE_Socialist_Irish_Nationalism: "爱尔兰社会民族主义"
 IRE_Socialist_Irish_Nationalism_desc: "长期以来，民族主义都是个被空想家与激进的极端民族主义者所玷污的概念，虽然许多软弱的社会主义者被国际主义理想引入歧途，但我们爱尔兰人明白，民族主义和社会主义并不是相互矛盾的概念。我们将拥抱融合了盖尔语言与传统的爱尔兰民族主义，顺应民众之意，成为独立自主、卓于东方邻邦的国家。为此目的，我们将助力弘扬高卢文化，恢复并推广爱尔兰语言、文化与游运动。"
 IRE_RWG_Victory: "革命工人党胜利"
 IRE_RWG_Victory_desc: "詹姆斯·格拉尔顿司令官及其领导的激进共产主义极端派组织在首次革命众议院选举中获胜。曾通过独立行动实现革命的各种革命工人团体已然堂堂大胜，如今他们团结一致，一个真正的革命工人党已经诞生，他们会将强调工业化与城市中心论的马克思主义引入爱尔兰。"
 IRE_Renovate_Irish_Culture: "革新爱尔兰文化"
 IRE_Renovate_Irish_Culture_desc: "格拉尔顿有个执念，从本质上说，爱尔兰文化是保守的、传统的、完全落后于时代的，左翼思想与革命思想也因此难以在这片土地扎下根来。为改变这一现实，格拉尔顿司令官大力推动对爱尔兰文化进行全面变革，其计划以现代美国“自由派”左翼文化和思想为基础，而这些文化与思想是由厄尔·白劳德、富兰克林·德拉诺·罗斯福、迈耶·伦敦、格斯·霍尔及其他同时代人所宣扬的。崭新的爱尔兰身份认同与文化本就同社会主义紧密相连，革命必不可能失败！"
 IRE_Campaign_Against_the_Church: "反教会斗争"
 IRE_Campaign_Against_the_Church_desc: "与爱尔兰的大多数政党不同，我们的革命工人党大力反对天主教会。尽管我们不是一个完全奉行无神论的政党，我们的一些党员也有各式各样的信仰，但我们确实认同世俗主义，也蔑视着罗马教廷和教宗的权力。我们不能再让外国势力干涉红色共和国的事务，也不能再让他们用保守派的无稽之谈来毒害大众的思想与灵魂。倘若基督教要在爱尔兰生存下去，它就得迎合我们并变得现代化，否则就得倒在革命的利剑之下。"
 IRE_New_Red_IRA: "崭新的红色共和军"
 IRE_New_Red_IRA_desc: "爱尔兰共和军，虽然其曾是个自豪的自由战士组织，但现已被天主教民族主义、资本主义的颓废和抱残守缺的保守主义所毒害，变成了个反动思想与小布尔乔亚的巢穴。然而，与我们的左翼盟友不同的是，我们明白真相，爱尔兰共和军已经烂完了，毫无拯救可能。我们不应该试图挽救一个失败的体制，我们应该创建一个崭新的爱尔兰共和军，并以帮助我们争取独立的各种左翼民兵命名，改名为爱尔兰公民军。再经锻造的公民军将保卫我们的岛屿与革命，格拉尔顿指挥官也将努力建设一个真正的马克思主义天堂。"
 IRE_Secret_Police: "组建公民内务委员会"
 IRE_Secret_Police_desc: "虽然格拉尔顿同志为将爱尔兰转变为无产阶级的天堂而不懈努力，但许多爱尔兰人仍食古不化、抱残守缺，决心不惜一切代价抵制格拉尔顿的新秩序。为抵御这些叛徒的攻势，司令官授权成立了公民内务委员会，这是一个凌驾于法律系统之上的机构。"
 IRE_Gaelic_Socialism: "盖尔社会主义"
 IRE_Gaelic_Socialism_desc: "我们将推行盖尔社会主义政策，复兴濒临消亡的盖尔语以及更为广泛的凯尔特文化及其身份认同，同时让我们的红色思想浸透其中。我们祖先的信仰与习俗将重回世间、展露新颜，爱尔兰也将再度为真正的爱尔兰人所有，盎格鲁人的污秽将不复存在。"
 IRE_Socialist_Language_Equality: "追求语言平等"
 IRE_Socialist_Language_Equality_desc: "为了不使我们与第三国际盟友疏远，我们将在复兴的盖尔语与英语之间实行语言平等政策。两种语言都应被允许在国内使用，在学校教学，并由政府在国内与国际上使用。我们将向世界证明，和平的双语政策是走向统一与革命的道路。"
 IRE_Ruby_Isle: "红宝石岛"
 IRE_Ruby_Isle_desc: "爱尔兰自由了，人民欢欣鼓舞，革命已使这个曾经的翡翠岛沐浴在一片奇妙的赤色荫蔽之下。从科克郡的海滩到多尼戈尔郡的岛屿，从克洛什谷的原始森林与黑湖的平静水域，到喧嚣的都柏林，全爱尔兰都拥抱了革命。我们的岛屿正绽放出红色的光辉，人们终于在这个天堂里获得了自由；一个真正的红宝石岛，像一颗紫红色的珍珠，在大西洋的深蓝碧波中熠熠生辉。爱尔兰万岁！"
 IRE_Monarchy: "君主制爱尔兰再起"
 IRE_Monarchy_desc: "德·瓦莱拉和他的保守派阵营团结一致，重建了近700年未曾有过的古老君主制度，全国为之震惊不已。确立这一君主制度的主要目的在于塑造一种超脱民主制度的团结力量，它与欧洲大陆上的绝对君主派截然不同，但最终统治我们的仍是一位国王——我们这个四分五裂的国家迫切需要的、能让众人团结一心且有名无实的领袖。在打好基础后，我们必须决定这个重生的君主制以及将生活在新国王治下的人民的未来。"
 IRE_Irish_Monarch: "爱尔兰君主"
 IRE_Irish_Monarch_desc: "我们的保王党拒绝向任何外国君主屈膝，决定加冕一位真正的爱尔兰贵族。古老的大氏族兴许已风光不再，但他们的后代仍生于斯长于斯，数个世纪以来，许多氏族后代成了外国贵族，我们的王位却一直空悬。在真正的爱尔兰君主登上王位后，爱尔兰将骄傲而坚定地战胜其前进道路上的一切艰难险阻，在新至高王的领导下，我们将在此建设一个保守而虔诚的天堂。"
 IRE_Legacy_of_High_Kings: "至高王的遗产"
 IRE_Legacy_of_High_Kings_desc: "古老的爱尔兰至高王是我们最伟大的祖先。他们在命运之石下的塔拉山上加冕为王，这些古老爱尔兰的勇士与英雄保卫着国家，并团结起各部落、氏族与爱尔兰人民，直到最后一位国王罗德里克·奥康奈尔被诺斯侵略者野蛮地推翻。倘若他想成为一个真正高贵且明智的君主，并且想真正团结分歧重重的爱尔兰人民的话，那我们的新至高王必须继承他们的遗产，通晓他们的历史。"
 IRE_Truly_Irish_Monarchy: "王冠下的爱尔兰民族主义"
 IRE_Truly_Irish_Monarchy_desc: "在我们真正的爱尔兰君主制下，爱尔兰民族主义将蓬勃发展并广泛传播，因为所有爱尔兰人都必须为他们重生的王国感到骄傲。在民主政治的舞台上，我们的君主将以共同而自豪的身份认同与文化团结群众，确保再也没有境外思想或外国势力征服我们人民的身心。"
 IRE_Constitutionalism: "宪法的命运"
 IRE_Constitutionalism_desc: "尽管德·瓦莱拉最初设想的新君主制度只是一种超脱民主政治的团结力量，但联盟中的许多激进派已越走越远，设想出了一种真正的君主制度，其由一个强大的国王领导，并遵循整合主义思想。它也将废除旧宪法，以便能从头制定完全基于国王的新宪法，这一想法遭到许多人的唾弃。我们必须决定宪法的命运，进而决定我们全套政治制度与政府的命运。"
 IRE_Modernized_Monarchy: "现代化王国"
 IRE_Modernized_Monarchy_desc: "在爱尔兰人至高王治下，爱尔兰能够一只脚定在我们赫赫有名的过往，而另一只脚则如火箭般迈向现代化与永不停歇的进步。在调节性资本主义经济、面向未来但不忘本来的文化情感、瓦莱拉式保守主义与地方民主的支持下，我们的王国成了现代君主制度的光辉典范。在至高王的王冠之下，我们正如一座繁荣灯塔照亮世间。我们在翡翠岛上建起了世所未见的人间天堂，让我们尽情欢呼吧。"
 IRE_German_Monarch: "德意志国王"
 IRE_German_Monarch_desc: "显而易见，倘若没有别国支持，爱尔兰便会沦于侵略者之手，无论入侵者是跨越太平洋而来或是跨过爱尔兰海而来。如果我们希望维持真正的独立，我们就必须与欧洲霸主结盟。因此，为全爱尔兰的利益着想，我们会将一位德国皇子加冕为王，以此博得德皇的宠爱，并得到他强大舰队的保护。"
 IRE_Draw_Closer_to_Germany: "倒向德国阵营"
 IRE_Draw_Closer_to_Germany_desc: "既然我们已经邀请了德国人坐上爱尔兰的王位，我们自然要更加向新盟友靠拢。德国人十分愿意将我们纳入他们的势力范围。这能拓展他们在爱尔兰海的影响力，使得英国人处于团团围困之中——虽然这也许会将我们导向与英国的不可避免之战······"
 IRE_Prussian_Constitutionalism: "采纳普鲁士宪政主义"
 IRE_Prussian_Constitutionalism_desc: "普鲁士宪政主义塑造了德国的联邦君主政体。在此制度下，联邦总统自动成为皇帝，皇帝亲自任命总理，而帝国议会则通过民选程序择出其成员。尽管这已一制度并不适合照搬到爱尔兰，但我们可以对其进行一些调整，以图更好地适应我们对君主政体的要求。因此，至高王将作为爱尔兰“总统”高效地统领国政，并在选出议会代表或总理的公正自由选举之中扮演监督角色，而总理则将手握大部分实权。"
 IRE_Go_Native: "本地化"
 IRE_Go_Native_desc: "国王陛下没想到他能如此舒适地统治爱尔兰，而如今，掌权之日已久，他开始把爱尔兰当成了自己家。更重要的是，国王宣布他无意回访德国，并逐渐将爱尔兰视为自己的祖国。他开始对爱尔兰传统表现出了兴趣，甚至还展露了学习盖尔语的兴趣，因为这样他就能与臣民和睦相处。此外，国王还表示有兴趣获得一个真正的“爱尔兰”名字，以更好地代表他的人民及其新建立的国家。"
 IRE_German_Monarch_Irish_Spirit: "德意志的王，爱尔兰的魂"
 IRE_German_Monarch_Irish_Spirit_desc: "兴许他流着的是德国人的血，但就像都柏林的工人或科克的农民一样，我们的至高王是真正的爱尔兰人。他拥有着真正爱尔兰人的精神，他从不羞于向所有人展示他对新祖国与新亲人的爱。愿所有人都欢欣鼓舞，得享繁荣昌盛，只因我们的王国终于有了位至高王，他能在需要的时候关心并保护人民，人民也得以真正享受铁十字下的翡翠岛中的善政与正义。"
 IRE_Re_Structure_The_Laws: "政府改组"
 IRE_Re_Structure_The_Laws_desc: "建立一个新的君主制国家并非易事，我们的行政当局如今才认识到这是一项多么艰巨的任务。政府必须进行全面改组，服务于目前担任议会与各郡政府国家元首的至高王。这个国家将彻底改头换面，因为我们有了位新国王！"
 IRE_Legacy_of_Pearse: "皮尔斯的遗产"
 IRE_Legacy_of_Pearse_desc: "帕特里克·亨利·皮尔斯是位受人爱戴的诗人、政治理论家与革命家，在其被英国鬼子含冤处决前，他为我们自由独立的爱尔兰的建立作出了贡献。然而，除约瑟夫·普伦基特、托马斯·麦克多纳和德·瓦莱拉本人以外，皮尔斯也被许多人视为我们建国元勋中为数不多的公开保皇派之一。他曾设想，到了2006年，爱尔兰将变成一个说着爱尔兰语的王国，一个新的至高王将担任国家元首。我们应努力尊重其遗产，确保皮尔斯的预言成真，同时，我们也要努力建设一个他没能亲眼目睹的崇高王国。"
 ire.219.e:0 "工党：建设福利国家！"
 ire.220.e:0 "工党：文化复兴从今日始！"
 ire.221.e:0 "工党：教国分离"
 ire.222.e:0 "工党：不向激进派让寸分！"
 ire.223.e:0 "工党：寻求妥协！"
 ire.2260.t:0 "工党确保多数"
 ire.2260.d:0 "工团大会决定以多数票选出威廉·X·奥布赖恩的爱尔兰工党。"
 ire.2260.a:0 "恭喜奥布赖恩同志"
 ire.2271.t:0 "大联盟土崩瓦解"
 ire.2271.d:0 "公开的工团主义组织爱尔兰工人联盟设法在最近的选举中获胜，爱尔兰民众因此震惊不已。随着爱尔兰工人联盟在公平选举中胜选（至少拉金是这么说的），爱尔兰现行体系的政治舞台已被彻底颠覆。废除爱尔兰资本主义制度并成立革命众议院是爱尔兰走向社会主义漫漫长路上的第一步，然而，当大联盟愈发接近完全掌握权力时，其分裂得却越发严重。在激进派一边，有激进的共产主义者詹姆斯·格拉尔顿与爱尔兰社会民族主义者皮达尔·奥唐奈，他们都主张彻底废除我们所知的爱尔兰民主制度。在温和派中，有威廉·X·奥布赖恩和詹姆斯·拉金，后者是爱尔兰工人联盟的现任负责人。自工党因针对不列颠联盟的态度这一内部分歧而垮台后，拉金便作为爱尔兰左翼的最高领袖而声名鹊起，但随着赤潮席卷爱尔兰，工党令人惊奇地卷土重来，填补了新芬党解散后留下的真空。颇具讽刺意味的是，以前工党解体时，正是新芬党自其中吸取了一批支持者，令这个已不复存在的政党顿时大权在握。虽然许多激进派因其对激进政策的反对谴责工党，认为这等同于叛国罪，但很明显，如果拉金想要避免爱尔兰落入激进分子的魔掌，他兴许就得不情不愿地与他的老对手合作。"
 ire.2271.a:0 "分歧重重，一如既往"
 IRE_isolation:0 "爱尔兰孑立"
 IRE_isolation_desc:0 "“我们自力更生”，这既是爱尔兰独立运动的格言之一，亦是新芬党的名称来源，如今也是我们世外桃源的昵称。我们的翡翠岛独立自由、与世隔绝，我们也终于能从席卷世界的混乱旋涡、暴力之潮中挣脱出来，专心为我国人民促进和平、维持团结、创造繁荣。在这个岛上，我们要建立一个强大、繁荣、自豪的国家，使它能够经受住一切风暴与敌人的考验，我们也将为独立而战至最后一人。爱尔兰将永葆自由，并由我们信得过的有能之人所保证。我们自力更生，爱尔兰万岁！"
 ire.14.c:0 "德·瓦莱拉和共和党！"
 ire.14.e:0 "麦克德莫特和民族中央党！"
 ire.14.f:0 "社会主义大联盟险胜！"
 ire.14.g:0 "没有任何派系在众议院取得多数。"
 ire.16.c:0 "刺客被杀了，柯林斯活了下来！"
 ire.252.t:0 "柯林斯退出政坛"
 ire.252.d:0 "当柯林斯在1937年选举中惨败后，这个“大块头”终于决定离开统一党领导层。他已经从蛛丝马迹中发现了爱尔兰民众对他的厌倦，因而他决定永远离开政坛，试图在爱尔兰军队中当个军官，享受宁静生活。接替柯林斯担任统一党党魁的是理查德·穆尔卡希，他是统一党的老干部、爱尔兰共和军的将军与自由斗士。这是爱尔兰柯林斯时代的落幕，这标志着统一党不再是柯林斯的一言堂，而开始转变为一个实用自由主义的、致力于爱尔兰团结和英国影响消除的政党。"
 ire.252.a:0 "统一党有了新门面"
 ire.253.t:0 "建立联盟"
 ire.253.d:0 "爱尔兰选举中最糟糕的情况已经发生：没有一个政党在众议院中获得多数席位。柯林斯仍将领导爱尔兰，但若是他想让自己的任期有些意义，他就必须获得另一个政党的支持，以支持统一党的议会立法。虽然与共和党联合是不可能的，但农业主义的民族中央党和社会民主主义的新芬党都愿意与柯林斯合作，代价是对其代表群体做出让步，制定有利于其理想的政策。"
 ire.253.a:0 "新芬党和统一党组建联盟"
 ire.253.b:0 "民族中央党和统一党组建联盟"
 ire.253.c:0 "不必组建联合政府，统一党将作为少数派政府执政"
 ire.254.t:0 "团结新芬党"
 ire.254.d:0 "新芬党曾奄奄一息，但幸有另一个政党——工党于那时土崩瓦解，正因为这头爱尔兰激进左翼的前领头羊的倒下，新芬党才得以继续存在。尽管新芬党并没有在1937年的爱尔兰选举中掌握权力，但他们确实成功地挽救了柯林斯的总统任期，并与统一党组建了执政联盟。在新芬党和统一党以合作精神团结一致后，一些人提议将统一党与新芬党合并为一个单一政党。柯林斯从前是新芬党最有权势的成员之一，要不是瓦莱拉对这位爱尔兰的独立英雄大加排挤，他肯定会成为党魁。这鲁莽的一步出自于琐碎争吵与嫉妒心理，也几乎注定了新芬党的命运，而当他人发觉瓦莱拉铸成大错后，他便顺势脱离了新芬党。现在，瓦莱拉已经走了，新芬党和统一党也精诚团结，许多人提议由柯林斯牵头，让两党合而为一。尽管新芬党的领导人卡哈尔·布鲁阿和柯林斯有些芥蒂，但一个柯林斯领导下的爱尔兰温和左翼联合联盟肯定无可阻挡，也能够在爱尔兰工人联盟或共和党魔爪下保卫爱尔兰。"
 ire.254.a:0 "是时候弥补瓦莱拉最大的错误了，两党将合而为一！"
 ire.254.b:0 "新芬党确实是盟友，但我们更愿保持独立"
 ire.255.t:0 "吸纳民族中央党"
 ire.255.d:0 "虽然民族中央党在爱尔兰政治中不那么引人瞩目，但拯救了柯林斯政府的联合政府协议让他们在众议院中拥有了巨大吸引力。民族中央党是统一党的主要支持者，而在两党结盟后，一些人提议把统一党和民族中央党合并为一个党。虽然将民族中央党并入统一党的提议并没有得到普遍同意，但所有人都认为两党统一是双赢。民族中央党当然是一个小党，倘若他们想实施其农业政策，最好的办法就是加入统一党的阵营。"
 ire.255.a:0 "统一党拥抱农业主义的时刻已至，团结各党派！"
 ire.255.b:0 "民族中央党确实是盟友，但我们更愿保持独立"
 ire.17.b:0 "新芬党胜选！"
 ire.17.c:0 "[GetIreAgrarianPartyShort]获选！"
 ire.17.e:0 "共和党胜选！"
 ire.21.b:0 "乍看挺有趣，再看就有点蠢了"
 ire.22.e:0 "爱尔兰共和党胜选！"
 ire.2422.t:0 "柯林斯的阿尔斯特政策"
 ire.2422.d:0 "1937年大选成了爱尔兰变革的催化剂，其中最为动荡的就是阿尔斯特，当地强烈反对我们的政权。柯林斯的政策一贯是严酷镇压当地的统一主义者，有时还派出军队恢复秩序。这种手腕在很多人看来十分专制，亦不受政府内自由派的欢迎。但现在是民族存亡的关键时刻，正是为了结果不惜一切代价之时。"
 ire.2422.a:0 "延续柯林斯的政策！"
 ire.2423.t:0 "[IRE.GetLeader]的阿尔斯特政策"
 ire.2423.d:0 "1937年大选与爱尔兰民主制度的终结成为了爱尔兰变革的催化剂，其中最为动荡的就是阿尔斯特，当地强烈反对我们的政权。柯林斯此前的政策一贯是严酷镇压当地统一派，有时还派出军队恢复秩序。这种手腕在很多人看来非常专制，政府内的自由派也不喜欢这样。但现在是民族存亡的关键时刻，结果会将手段正当化的。"
 ire.2423.a:0 "继续镇压！"
 ire.2424.t:0 "社会主义者的阿尔斯特政策"
 ire.2424.d:0 "1937年大选与爱尔兰民主制度的终结成为了爱尔兰变革的催化剂，其中最为动荡的就是阿尔斯特，当地强烈反对我们的政权。柯林斯的政策一贯是严酷镇压当地联盟派，有时还派出军队恢复秩序。虽然柯林斯是个反动派，但他打击阿尔斯特分裂势力的政策得到了社会党人的支持，他们加大了对阿尔斯特联盟派的镇压力度，对那些支持不列颠联盟的人则任其自生自灭。"
 ire.2424.a:0 "继续镇压！"
 ire.246.t:0 "共和党的终末之秋"
 ire.246.d:0 "埃蒙·德·瓦莱拉一直是柯林斯的眼中钉、肉中刺。起初他将柯林斯踢出了新芬党，此后又处处与柯林斯政府唱反调。柯林斯认为这必须被解决！既然他对爱尔兰有完全的控制力，柯林斯便能一劳永逸地解决这个叛徒。因而他下令取缔瓦莱拉的政党——爱尔兰共和党，并逮捕瓦莱拉本人。\n不幸的是，瓦莱拉抢先一步，在警察前来逮捕他的前几天逃往美国。尽管让他逃到海对面对柯林斯来说并不理想，但美国如今的混乱局势使瓦莱拉也不能好过到哪里去。尽管失去了瓦莱拉，但是他总算不会再来干涉我们了。在柯林斯的爱尔兰中，所谓民主已不再重要······"
 ire.246.a:0 "别了"
 ire.247.t:0 "阴谋败露"
 ire.247.d:0 "令人震惊的是，柯林斯总统发现了一个几乎渗透到了爱尔兰政府上上下下的巨大阴谋。在不列颠联盟的命令下，工团分子成功地操纵了选举结果，这足以让工团分子在1937年的选举中险胜。幸运的是，柯林斯总统识破了工团分子的小把戏，及时进行了干预，阻止了英国佬与赤匪对爱尔兰的侵害。在选举的真实结果公开后，我们发现柯林斯是真正的胜选者，他获得了绝大多数的公众选票。\n\n随后，柯林斯组织起了一个选举安全工作队，以确保未来的选举不受颠覆势力的影响，也不会对爱尔兰的独立构成威胁。"
 ire.247.a:0 "为柯林斯感谢上帝"
 ire.248.t:0 "瓦莱拉归来"
 ire.248.d:0 "在爱尔兰“马铃薯饥荒”期间，一些美国印第安部落——主要是乔克托人、奥吉布瓦人、纳瓦霍人以及其他部落——向爱尔兰人提供了金钱援助，以帮助他们度过这个黑暗和麻烦的时期。岁月荏苒，1919年，爱尔兰共和国国父、保守派政治家埃蒙·德·瓦莱拉来到美国，访问了这些几十年前帮助过爱尔兰人民的土著部落。然而，随着爱尔兰再次陷入激进主义和威权主义的麻烦，我们的老朋友瓦莱拉回到了我国寻求庇护，就像我们多年前向他的祖先提供帮助那样。让我们欢迎这位年迈而疲惫的朋友，让他在祖国在他身后“燃烧”时，能够平静而舒适地度过余生——这便是我们所知的一二。"
 ire.248.a:0 "让他在我们的土地上安享晚年吧"
 ire.248.b:0 "让他在部落议会拥有一席之地！"
 ire.249.t:0 "埃蒙·德·瓦莱拉解散参议院"
 ire.249.d:0 "埃蒙·德·瓦莱拉已动议解散爱尔兰参议院，以维护爱尔兰保守主义与爱尔兰共和党的主导地位，因为德·瓦莱拉确信只有自己知晓爱尔兰及其人民未来将往何处去。可以理解并能够预见的是，全国成千上万的人为此震怒，大多数主要城市都爆发了骚乱。我们必须对如何处理这些暴乱者与异议者确立个大致的立场，因为我们的前途正悬于其上。"
 ire.249.a:0 "随他们去，反正总会安静下来的"
 ire.249.b:0 "命令警方进行镇压"
 ire.2501.t:0 "紧急情况"
 ire.2501.d:0 "战乱使爱尔兰陷入混乱，他似乎别无选择，埃蒙·德瓦莱拉总统宣布国家进入了他所谓的“紧急状态”——全国戒严令，在这一状态下，德·瓦莱拉手握几乎绝对的权力，包括审查媒体、拘留公民和通过政府控制经济的权力；与此同时，共和党统治着政府，声称这一切都是为了给爱尔兰带来和平、安全与稳定，紧急状态也是一项出于急迫需要与合法原因的临时措施。许多人开始猜测，说这只是共和党在为德·瓦莱拉攫取权力，但只有时间才能证明真相如何。"
 ire.2501.a:0 "一切为了捍卫爱尔兰"
 ire.251.t:0 "政府的命运"
 ire.251.d:0 "当柯林斯巩固了其对爱尔兰政府的控制后，他将如何治理国家的问题业已浮出水面。近十年来，柯林斯一直担任着文职总统，许多人认为柯林斯应当继续担任终身总统；他应用铁腕贯彻权力，而非将权力经过腐败与欺诈的选举交给人民。然而，柯林斯内阁中的许多人，包括爱尔兰总理约恩·奥达菲在内，建议完全解散爱尔兰的文官政府，并在爱尔兰共和军的监视下，将爱尔兰正式确立为军事独裁国家。柯林斯大权在握，他完全可以依照自己的意愿塑造爱尔兰，不再被轻信的大众所欺骗，我们的领袖会怎么做呢？"
 ire.251.a:0 "柯林斯决定用爱尔兰共和军取代文官政府！"
 ire.251.b:0 "柯林斯巩固了其终身总统的地位！"
 ire.300.t:0 "凯瑟琳计划"
 ire.300.d:0 "自由联盟、爱尔兰德意志之友、全国协会，这些都是与德国关系密切的爱尔兰共和派组织，奥达菲和柯林斯等人都在经营这样的组织，以捍卫爱尔兰共和制度以及我们与德国霸主的友谊。这些联合组织起草了一项名为凯瑟琳计划的新计划，该计划大致概述了一项使爱尔兰向德意志帝国靠拢的计划，以维持爱尔兰的自由与独立，免受盎格鲁人的威胁。德国人的军事基地与军事人员来到了我们的岛上，德国企业也纷纷在翡翠岛上落户，我们将从德国的成就中获益，并与之一起维护爱尔兰的独立。"
 ire.300.a:0 "为所有爱尔兰人的福祉"
 ire.301.t:0 "托蒙德王子"
 ire.301.d:0 "雷蒙德·莫尔顿·奥布赖恩，支持奥达菲的蓝衫军与奥金纳甘的复兴建筑师的小人物，爱尔兰某些圈子里出了名的疯狂分子。奥布赖恩极力想在一个不存在的君主制度中成为至高王，他是托蒙德伯爵与虚构的托蒙德公国王子的觊觎者。我们不知道他构造这个虚假的微型国家是出于行骗目的，还是为了争取贵族的合法性，还是干脆出于疯狂，但我们明白的是，他所谓托蒙德王子的身份对他所参与的任何运动都是一种负担。我们必须决定如何处置这个变态，以免他来祸害我们的政纲。"
 ire.301.a:0 "随他嘲讽死去的贵族，反正他都疯了"
 ire.301.b:0 "要是他想成为贵族，那我们就得像贵族般对待他。把他丢进大牢"
 ire.301.c:0 "砍掉他的头！"
 ire.302.t:0 "盖尔道教融合主义"
 ire.302.d:0 "特伦斯·詹姆斯·斯坦纳斯·格雷，亦即人们口中的“为无为”，是一位爱尔兰民族主义诗人、剧作家、道士和哲学家，和领袖是老相识。为无为以“舞剧”和在剑桥节日剧院上的作品而闻名，他是一位著名的博物学家、灵性论者、实践派德鲁伊和新萨满，还是复兴建筑师意识形态与生态激进主义的支持者。虽然其奇装异行与玄奥思想常遭人侧目，但领袖仍倾力支持这位故交在爱尔兰全境传播其思想，翡翠岛上的道教徒数量因此略微增加，领袖声望更是更上层楼，因为他再度履行了自己的承诺——“只要你是个忠诚的爱尔兰人，信仰什么宗教便是你的自由”。"
 ire.302.a:0 "这思想流行不起来，但他得到了领袖的支持"
 ire.303.t:0 "爱尔兰大清洗"
 ire.303.d:0 "奥金纳甘领袖长期以来一直鄙视着爱尔兰的贵族制度，或是贵族与头衔制度，因为它永远散发着盎格鲁血统与怪异思想的臭气。为了真正复兴盖尔文化，我们必须顺应奥金纳甘领袖意志，并使其化为现实。我们将摧毁一切皇家头衔与贵族制度，从我们的阶级制度中去除一切贵族与盎格鲁血统的污点，我们将寻求建立一个自由、平等但完全且唯一的爱尔兰人社会，只有爱尔兰男女能够享受平等。然而，为了更好地向我们的祖先致敬，我们可以选择拾起贵族制度的碎片，重建旧的氏族制度，将我们的社会划分为各个氏族，让他们各自管理指定区域，并通过贸易与服务业相互合作，向奥金纳甘领袖进贡并提供军事援助，因为领袖管理着国家政府以及他自己的最高氏族。此外，我们还可以效法中世纪早期的传统做法，建立现代化的布雷洪法体系。布雷洪法是诺曼人、北欧人、英国人到来之前爱尔兰的法律体系，在这一体系下，国家权力掌握在判官团手中，公元前五世纪时，这个判官团由德鲁伊判官担任，而后逐渐被海岛基督教教官和世俗法官所取代，直至公元五世纪英国人带来了他们的法律与更为先进的治理方式，爱尔兰的文化、法律与社会大都为布雷洪法所左右。若果真要在现代重建布雷洪法体系，那么奥金纳甘就会摧毁贵族体制，并自任我们的最高司法职位——爱尔兰首席德鲁伊，以英国人和诺曼人入侵之前的爱尔兰为范本，建立起由地方法官管辖各郡、各部族事务的司法治理体系。那么，我们该怎么做呢？"
 ire.303.a:0 "头衔与阶级再也无法束缚爱尔兰了！"
 ire.303.b:0 "重建旧的氏族制度"
 ire.304.t:0 "泛凯尔特之梦"
 ire.304.d:0 "奥金纳甘领袖已引领爱尔兰迈入崭新的黎明，我国也尽情沉醉在光辉而高贵的过去之中。自由地忠于我们的盖尔和凯尔特血统，我们渴望在整个古凯尔特地区发动战争，将我们的同胞们从帝国主义与外国畜生的压迫中拯救出来，并解放各地的凯尔特人，例如布立吞人、爱尔兰人、康沃尔人、苏格兰人、马恩岛人和其他岛屿之上的凯尔特人，那些在布列塔尼的凯尔特人，以及凯尔特伊比利亚人、高卢人，以及居住在欧洲各地与安纳托利亚的许多其他凯尔特民族也都将得到解放。无论如何，我们首先必须决定我们的目标有多远大、军队应去往何处。"
 ire.304.a:0 "为全体爱尔兰人的利益着想，我们应当保持孤立，因为只有我们是真凯尔特人"
 ire.304.b:0 "传统的凯尔特群岛、布列塔尼、凯尔特伊比利亚和冰岛都将得到救赎"
 ire.304.c:0 "塞恩奈尔·奥金纳甘对一切凯尔特土地提出了宣称，从冰岛、爱尔兰再到土耳其和西班牙的土地都将归我们所有！"
 ire.305.t:0 "新新芬党的命运"
 ire.305.d:0 "在爱尔兰国家层面的民主制度解体后，因为新政党联盟的建立与新政策的出台。旧共和制度下的各主要政党纷纷开始转换阵营或是四分五裂。复兴建筑师最感兴趣的是新芬党内左翼民族主义者的命运。尽管新芬党从前的世俗主义主张与经济观念基本已不复存在，但由爱尔兰共和军老兵和激进民族主义者组成的新领导核心已夺得了该党的领导权。由“三麦克”——托尼·马甘、帕迪·麦克洛根与托马斯·奥格·麦克田——领导的新新芬党已向右翼政党演变，拥抱起受复兴建筑师启发的法团主义，把教宗庇护十一世的教宗通谕、葡萄牙新国家运动中的整合主义者的力量，以及激进基督教民族主义和他们本身分散的左翼社会经济立场在内的各类思想融会贯通。而复兴建筑师也远不是头一次从左派那里获得灵感了，该党的创始人奥金纳甘早就从菲奥雷洛·拉瓜迪亚和罗斯福等美国进步人士那里汲取了思想成果，许多人正鼓动着我党与这些改邪归正的“右翼左派”结盟，而其他人仍对他们所谓的“潜藏着工团主义”的思想蔑视不已。我们是应该采取行动，同新新芬党合并，还是独自前行，创建一个崭新而繁荣的爱尔兰？"
 ire.305.a:0 "解散该党，禁止其活动"
 ire.305.b:0 "与“三麦克”合作，建立一个新的法团主义新芬党"
 ire.308.t:0 "重建吉米舞厅"
 ire.308.d:0 "在登上爱尔兰的权力巅峰前，格拉尔顿司令官在埃夫里纳赫经营着一个规模比较小的皮尔斯-康诺利纪念馆，他在那里通过各种免费活动传播他的社会主义理想。舞厅还被当成临时的众议院会场，它往往被爱尔兰各地人物用来对抗英国的法律体系，土地纠纷等问题也常常在此解决。不幸的是，舞厅在1932年被烧毁，格拉尔顿不到一年内就被驱逐出境，他再也没有机会重建这栋建筑。然而，在格拉尔顿重回祖国，爱尔兰沐浴在社会主义的赤色光芒后，他得到了一个重建他心爱舞厅的宝贵机会。此前，他一直忙于行政事务，无暇参与舞厅的重建工作。今天，司令官已下令派遣一队建筑工人进入埃夫里纳，他们将把舞厅恢复原样。虽然共和派、农民和工会成员的舞厅的重建赞扬不已，但该地区的几名牧师谴责大厅是“妓女与工团分子的巢穴”，并召集了几名当地市民进行抗议，很快就演变成了暴力事件。在抗议过后，格拉尔顿命令当地的赤卫队逮捕一切涉案人员，并找到应为煽动行为负责的当地牧师，迅速地将他们监禁了起来。"
 ire.308.a:0 "三次出奇迹"
 ire.309.t:0 "格拉尔顿被流放的教训"
 ire.309.d:0 "1933年，在柯林斯的非法德国傀儡政权的操纵下，格拉尔顿同志被不公地流放海外，在接下来的4年里，他背井离乡，暂住在纽约城中。在纽约驻留期间，格拉尔顿耗了一番心力，教育美国的爱尔兰侨民何为詹姆斯·康诺利，并在美利坚社会党的旗帜下竞选曼哈顿第13区代表。虽然格拉尔顿现在在翡翠岛上的生活可谓是高枕无忧，但他的旅美时光对他产生了深刻的影响。在格拉尔顿初次旅美期间，他干过出租车司机和酒保，也正是在美国，他第一次被美国文化所浸染，最终他也坚信，倘若爱尔兰要接受社会主义，唯一途径便是让爱尔兰根深蒂固的保守文化全盘被美国文化所取代。现在格拉尔顿掌权了，他有能力将他的激进计划付诸实施；格拉尔顿的“爱尔兰社会革命”虽遭到人们的强烈抵制，甚至在素有革命精神的爱尔兰共和军内部也不乏对此的质疑之声，但毫无疑问，在司令官掌权后，爱尔兰的往日时光已是一去不复返了。"
 ire.309.a:0 "为了格拉尔顿、爱尔兰与社会主义！"
 ire.310.t:0 "白劳德主义的爱尔兰？"
 ire.310.d:0 "当[root.getleader]主席继续带领爱尔兰走向真正无阶级国家的天定命运之时，对如何实现此等完美社会的问题再度浮出水面。虽然主席直至目前为止一直忠实于党的路线，但党内各派对如何实现我们的完美目标各有答案、争论不休。在各派之中，有一个新兴派系在很大程度上受到了“大众共产主义”理论的启发，这一理论是由美利坚社会党的厄尔·白劳德开创的。在基本忠于正统马克思主义教义的前提下，“大众共产主义”寻求让全体左派形成统一战线，既能让党因此增光添彩，也能解决左派屡屡内斗的问题，让全体无产阶级集中力量一致反抗压迫者。综上所述，加上我党与美利坚社会党间的关系，该派系已变得大受欢迎。由于其庞大的支持基础，若是主席愿意的话，我们能够轻易地将该派吸纳进来，将大众共产主义思想纳为己有。或者，我们也可以把反党分子统统清洗掉。"
 ire.310.a:0 "在他们想出什么馊主意之前把他们清洗了"
 ire.310.b:0 "拥抱该派别，爱尔兰将一同向共产主义迈进！"
 ire.311.t:0 "思想碰撞"
 ire.311.d:0 "今天，爱尔兰主席拉金与美利坚联合工团主席“大比尔”威廉·达德利·海伍德刚刚结束了为期一周的会议。即使美国仍然深陷危机之中，工人也似乎即将取得彻底胜利，但海伍德仍然有时间与爱尔兰同志会面。从历史上的革命，美国正在发生的危机，到单纯的私人交谈，这两位著名的工团主义革命家一见如故。尽管如此，海伍德的爱尔兰之行也就只能持续这么长时间了，他已秘密离开爱尔兰并返回美国，以避免面临被捕、入狱或更糟的情况。哪怕他离开了，这两个曾经只是战友同志的巨头，也因为新生的社会主义团结精神下走到了一起。拉金可是世界产业工人联盟和美利坚社会党的老朋友，加上拉金稳稳地领导着爱尔兰，“大吉姆”将尽其所能帮助“大比尔”在为美国工人的斗争中取得胜利。"
 ire.311.a:0 "一而再再而三，爱尔兰与美利坚在反对压迫的共同斗争中团结一致"
 ire.312.t:0 "家里起火"
 ire.312.d:0 "爱尔兰工人团结在[root.getleader]的领导下，终于获得了自由。看来，我们终于真正走上了通往真正社会主义的道路。然而，尽管理想如此美好，但在我们革命国家的领导层中，并不是一切都是完美的，特别当爱尔兰工人联盟的领袖詹姆斯·拉金与他的儿子发生冲突时。小詹姆斯·拉金，他和他的父亲很是相似，也是个革命者，但与其父不同的是，小詹姆斯认定只有先锋党才能带领爱尔兰走向真正的社会主义，而非工会。因此，父子俩曾多次就理论问题当众争吵。虽然天下没有不爱儿子的爹，反之亦然，但这两个人如此不对付的情况让一些风言风语盛行于群众之中。尽管党的领导层表示坚决反对，我们也努力让两人和解，但这两个人仍是斗个不停。大概，哪怕他们父子之间血浓于水，他们终究还是彼此的意识形态死敌。"
 ire.312.a:0 "得了吧，谁不想看点肥皂剧呢？"
 ire.313.t:0 "拉金与死神擦肩而过"
 ire.313.d:0 "我们的议长，詹姆斯·“大吉姆”·拉金今天与死亡擦身而过，都柏林爱尔兰工人工会所属的托马斯·阿什大厅，该建筑在近一次反政府爆炸袭击中遭到破坏，他在监督该建筑的维修工作时，从近十英尺的高空坠落，差点命丧当场。虽然从未铺设完毕的地板上掉下来并没有让拉金一命呜呼，但他也确实因此受了重伤。尽管他仍在为爱尔兰的工人们奋战不止，但有人估计拉金兴许无法从这次事故中康复过来。这位曾经精力充沛的煽动者现在只能在轮椅上度过余生了。"
 ire.313.a:0 "无论是坐在行政岗位上，还是坐在行政轮椅上，拉金都会为了爱尔兰的工人而战！"
 ire.314.d:0 "将社会主义引入爱尔兰的先驱，威廉·X·奥布赖恩最大的死对头之一，詹姆斯·“大吉姆”·拉金今日不幸坠亡，当时他正在监督都柏林爱尔兰工会所属的托马斯·阿什大厅的维修工作，该建筑在反动派炸弹袭击中被破坏。虽然从未铺设完毕的地板上掉下来不是拉金第一次与死亡擦肩而过，但肯定是最后一次——工作人员正清理着从托马斯·阿什大厅五楼掉下来的“大吉姆”的脑浆。拉金的逝世标志着拉金与奥布赖恩之间漫长而可怖的恩恩怨怨终得告一段落，他们二人间的过节始于拉金脱离工党成立爱尔兰工人联盟。工党的倒台与爱尔兰工人联盟在1937年选举中胜选似乎昭告了拉金的最终胜利，然而革命众议院却站在了奥布赖恩和工党一边，让他们登上了权力殿堂，拉金因此成为一个饱受痛苦的且无关紧要的前主席，他对奥布赖恩改革的各个内容都大加批判；在拉金逝世后，工党执政的最大障碍似已消失。作为拉金最尖锐的对手之一，奥布赖恩仍对拉金发表了积极友好的评价，并与成千上万在都柏林街头聚集的爱尔兰公民一道参加了他的葬礼。"
 ire.314.t:0 "詹姆斯·拉金去世"
 ire.315.t:0 "与激进派和温和派打交道？"
 ire.315.d:0 "威廉·X·奥布赖恩已经掌握爱尔兰的军国大权，当一些极端激进派试图利用其地位大肆破坏爱尔兰的民主制度时，奥布赖恩与工党却对权力善加利用，进一步发展了爱尔兰民主。不过，爱尔兰兴许仍是个民主国家，但在红色革命降临爱尔兰后，旧秩序下的大多数政党就被取缔了，然而奥布赖恩内阁中的一些人建议其与旧秩序的一些人物与政党达成合作。奥布赖恩曾竭尽全力确保工党是一个坦诚的温和派政党，摆脱一切激进派或反民主势力的影响。可是这场反激进运动让奥布赖恩失去了许许多多激进的社会主义支持者，因此，如果他希望继续掌权，他就必须对一些旧秩序的走狗做出让步。总的来说，新芬党的忠实拥护者提议与我们合作，由于两党都持完全的反激进派立场，无人能否认两党间的共同利益，我们两党也拥有大批共同的支持者（新芬党在工党垮台后吸纳了许多工党支持者）。"
 ire.315.a:0 "让新芬党自个烂掉吧"
 ire.315.b:0 "还是再去和新芬党谈谈吧，他们总比激进派好"
 ire.3150.t:0 "格拉尔顿再遭驱逐"
 ire.3150.d:0 "1933年，詹姆斯·格拉尔顿被驱逐出我们美丽的翡翠岛，被迫流亡海外近四年之久。在拉金当选总统后，格拉尔顿的流亡生涯很快就被行政命令结束了。虽然格拉尔顿希望在革命众议院的第一届大会中成为新任议长，但因为[IRE.GetLeader]坚决反对格拉尔顿特有的社会主义激进思想，他很快便败下阵来。格拉尔顿因其失败痛苦不堪，他不愿放弃：这位著名的革命家发起了一场抗议新政府的运动，称[IRE.GetLeader]及其政党不过是一群“资本主义间谍、帝国主义傀儡”。\n\n当格拉尔顿的皮尔斯-康诺利纪念馆在重建后再度被烧毁时，格拉尔顿与中央政府间的冲突达到了高潮。中央政府认为一群叛变的牧师应为此事负责，但格拉尔顿自己却认为爱尔兰共和军的一个当地支部应负责任，后者认为格拉尔顿“太过激进”。格拉尔顿对当地爱尔兰共和军的无端诽谤使得一群士兵和几名先锋队主义武装分子发生了冲突，五人因此死亡，还有许多士兵受伤。\n\n这件事终于让中央政府忍无可忍，中央政府宣布剥夺格拉尔顿的爱尔兰国籍，并再次下令将他驱逐出境。虽然这更激怒了格拉尔顿和他的支持者，他们声称这无非更加证明了[IRE.GetLeader]政府与从前的反动派压迫者别无二致，但他们别无选择，只能无能狂怒。"
 ire.3150.a:0 "幸好他已不再是我们的问题了"
 ire.316.t:0 "莫纳亨精神病院改造为博物馆"
 ire.316.d:0 "当皮达尔·奥唐奈和疯人院的工作人员正式“占领”莫纳汉精神病院时，他们创造了历史，他们在医院上方升起了红旗，解雇了护士长，并宣布每周工作48小时。这是爱尔兰的首个“苏维埃”，也是在俄国以外建立的第一个“苏维埃”，虽然俄罗斯的红色革命失败了，但爱尔兰的革命之火仍在熊熊燃烧。因此，奥唐奈议长下令将医院改造成博物馆，医院内的病人则被转移到黑水医院。这个博物馆专门展示爱尔兰无产阶级反抗资本主义压迫的斗争史，并让爱尔兰人民深入了解爱尔兰前红色革命领袖的生平。这个历史遗址将在未来的岁月里鼓舞着爱尔兰人民，因为公民们接受了关于翡翠岛上革命斗争历史的全面教育。"
 ire.316.a:0 "儿童免票！"
 ire.317.t:0 "赤色至高王？"
 ire.317.d:0 "虽然我们美丽的翡翠岛上的许多公民都与爱尔兰许多现已不复存在的贵族家族中的一个或多个有着渊源，如奥唐奈、奥布赖恩、奥尼尔或任何其他爱尔兰前王朝；但其中最著名的是我们的皮达尔·奥唐奈议长。在阿兰莫尔岛担任老师时，奥唐纳开始接触社会主义，该岛的盖尔语名称为“奥唐奈的阿兰”，他在岛上度过的时光影响了他的文学作品，如广受好评的《岛民》。尽管皮达尔·奥唐奈远不是至高王的主要候选人，甚至根本就算不上候选人，但一些人还是建议奥唐奈利用他的王室血统，以此更进一步证明他作为爱尔兰最高统治者与领袖的合法性，然而许多共和派却认为这是对自由爱尔兰理想的背叛，反而建议奥唐奈谴责一切与爱尔兰古代氏族王朝相关的宣称和头衔。"
 ire.317.a:0 "至高王在爱尔兰历史上是至高无上的，奥唐奈为自己与他们间的关系感到自豪！"
 ire.317.b:0 "批判一切氏族头衔，完全废除这一制度！"
 ire.317.c:0 "不予置评"
 ire.3170.t:0 "染红爱尔兰共和军"
 ire.3170.d:0 "忠于准则主义的弗兰克·瑞安和自由爱尔兰军的老兵莫斯·托米已晋升为新的爱尔兰共和军军官，这是国家政府试图从国内准军事武装中清除一切反动势力的最新举措。瑞安与托米，连同全新一代的军官，将取代与柯林斯和复兴建筑师沆瀣一气的奥达菲跟班与激进派，引领爱尔兰共和军进入全新的赤红未来，并摆脱将旧爱尔兰共和军推向毁灭深渊的反动派和天主教右翼民族主义。一步一步、一人一人，我们将建立一个富有凝聚力的社会主义武装力量，并完全能够保卫爱尔兰及其革命免受来自国内外的一切伤害。"
 ire.3170.a:0 "革命军，高声唱！"
 ire.318.t:0 "新芬党的未来"
 ire.318.d:0 "新芬党通常算不上有多么团结，现在也因民族主义而陷入了分裂。工党解体后，部分核心成员转投拉金的工人联盟，另一部分则跑到了新芬党，这也使得新芬党摆脱了冷板凳的地位。虽然新芬党政府的主体是投奔而来的前工党成员，但党内多数人逐渐有了与这些新人划清界限，回归带有左翼色彩的爱尔兰民族主义前锋角色的打算。党内的另一处分歧是在天主教会与宗教问题上产生的，“旧”新芬党声称世俗主义方为正道，而“新”新芬党声称基督教社会主义才是前进之路。一个次要的，更为细微的分裂发生在经济思想上，年轻的煽动者托尼·马甘，帕迪·麦克洛根与托马斯·奥格·麦克田，或称三麦克，他们鼓吹着社会法团主义与社会主义版本的葡萄牙新国家理念，同时也支持着新芬党基督教社会主义派，反对新芬党世俗派的传统左翼经济学。谁将在这场角逐新芬党未来的斗争中获胜？"
 ire.318.a:0 "新芬党的世俗派和工党派胜出"
 ire.318.b:0 "新芬党的基督教社会主义派胜出"
 ire.318.c:0 "在新新芬党的帮助下，三麦克将民族社会民主引入了爱尔兰"
 ire.3180.t:0 "正式禁止各准军事组织"
 ire.3180.d:0 "近年来困扰爱尔兰的经济低迷导致整个翡翠岛内的政治暴力现象激增，统一党与共和党之间日益加深的分歧更是让全国各地的街头斗殴愈演愈烈。前爱尔兰总理约恩·奥达菲曾指挥一支名为“陆军同志协会”的暴力准军事部队，或者更为人所知的“蓝衫军”，他们常常在街头骚扰爱尔兰共和军成员，双方之间的暴力冲突至今尚未停歇。虽然柯林斯对这种暴力零容忍，但统一党几乎根本没有阻止蓝衫军的行动，哪怕是私下采取的措施也少之又少，爱尔兰前总理也得以逃避责任。日益暴力的政局在某种程度上让新芬党得以上台；而柯林斯一卸任，奥达菲就再也无法轻而易举地逍遥法外了。今天，奥达菲的组织及其他几个“激进组织”被正式取缔。其本人和陆军同志协会的几名指挥官以及其他被列入禁令的组织成员都被逮捕。在包括陆军同志协会的各主要准军事团体中，陆军同志协会并非唯一被法令取缔的组织，爱尔兰共和军的几个激进分裂派系，如自由爱尔兰也被宣布为非法。\n\n虽然有些人谴责这一行动实属不必要，只是在为专制政治打掩护，但新芬党和卡哈尔·布鲁阿已借此明确地表明了他们对任何妨碍爱尔兰公民和平与安全的组织的立场。"
 ire.3180.a:0 "新芬党正兑现其和平承诺"
 ire.3181.t:0 "卡哈尔·布鲁阿的和平军国主义"
 ire.3181.d:0 "爱尔兰的独立来之不易，但在世界舞台之上，企图征服、践踏我们美丽的翡翠岛的势力正蠢蠢欲动。在决定爱尔兰的外交政策时，卡哈尔·布鲁阿也将这一情况铭记于心，他宣称渴望征服爱尔兰的两股势力实际上是一丘之貉。不管是加拿大的保皇党还是英国的工团分子，他们都忽略了爱尔兰的切身利益。当然，他们都没有为失败做好准备。毫无疑问，协协国和第三国际都希望让爱尔兰屈服于其铁蹄之下，认识到这一事实后，卡哈尔·布鲁阿已掀起了一场无情的巩固国防与军事化运动，以此让我们公正的爱尔兰抵御一切侵略者的袭击。在我国自内部事务抽出身后，我们终于可以集中精力应对境外威胁了。当然，我们的国家天险密布，毫无疑问，哪怕面对强敌，我们也能坚守阵地。然而，仅仅坚守阵地还远远不够，爱尔兰的公民必须不仅要抵御外敌，而且还要先发制人，与入侵之敌作英勇斗争，在侵略者踏入国土前便将他们消灭。"
 ire.3181.a:0 "和平归我，与你何干"
 ire.319.t:0 "平反奥达菲？"
 ire.319.d:0 "当统一党在1937年选举中遭受耻辱而决定性的失败时，前总理约恩·奥达菲已投入民族中央党的怀抱。尽管奥达菲仍然是柯林斯的忠实追随者，但他对农业主义的热忱不可否认。因为他与民族中央党的理想相近，一些人建议接受奥达菲的提议，将他的“蓝衫军”收至党下。尽管党内一些“自由派”认为奥达菲就是爱尔兰的科德里亚努，但无人能否认，有蓝衫军这样强大有力的盟友支持，将大大改善民族中央党现在小而活动稀疏的状况。"
 ire.319.a:0 "农业派的朋友就是民族中央党的朋友！"
 ire.319.b:0 "奥达菲多少有点激进了……"
 ire.320.t:0 "民族中央党成为关注焦点"
 ire.320.d:0 "民族中央党能在1937年选举中胜选简直就是一个奇迹。爱尔兰政坛各主要政党都因此震撼不已，统一党、共和党和新芬党，这些庞然大物们竟被势单力孤且无关紧要的全国农民和纳税人联盟（后改称民族中央党）击败。在各大党令人震惊地失败后，民族中央党现已一跃成为爱尔兰温和派的领头羊，哪怕他们对瓦莱拉持反对态度，中央党还是吸收了许多与他们志同道合的统一党、新芬党和共和党党员。在弗兰克·麦克德莫特总统任期得以延续后，民族中央党逐步成为爱尔兰政治的主角。倘若中央党当年没有在1937年选举中胜选，该党肯定会走向穷途末路，或是被其他政党吞并，但毕竟中央党现已脱颖而出，他们也将在未来几年内继续影响爱尔兰的政治。"
 ire.320.a:0 "迈向真正的农业天堂！"
 ire.321.t:0 "农业主义的尺度"
 ire.321.d:0 "从一个小党开始，为获得尽可能多的选票，我们在农业的立场上基本是中立的，但现在我们已经胜选，也统治了一段时间，我们是否应该追求完全的农业主义？这将让我们能够一心一意关注农民与我们的农村支持者，但可能会使我们失去一些城市支持者。我们该怎么办？"
 ire.321.a:0 "为爱尔兰团结恪守中道，但仍追求温和的农业主义"
 ire.321.b:0 "开启拖拉机，磨好耕犁。向田园农业主义全速前进"
 ire.3220.t:0 "拉金谴责选举结果，随后一命呜呼"
 ire.3220.d:0 "在爱尔兰工人联盟于1937年大选中落败后，其领导人詹姆斯·“大吉姆”·拉金开始谴责起选举结果，发起了认为选举非法的运动，他谴责柯林斯是独夫民贼，拒绝承认柯林斯代表的“德国傀儡”政权。在拉金演讲时，他声称柯林斯选举舞弊，大肆使用诸如选票作假与恐吓选民等手段；这些指控实在荒谬不经，同诽谤别无二致，反倒证明了工人联盟为何落选。柯林斯对这些说法进行了回击，说拉金是输不起还急了，哪怕他确实像拉金所说的那样是某种“独裁者”，那他根本就不必操纵选举，因为他完全可以凭借自己的实力赢得选举。\n\n拉金更进一步，在利默里克举行了集会，呼吁在选举的真正结果揭晓之前全面封锁票箱。但不幸的是，拉金演讲所用的演讲台因材料质量问题坍塌，拉金等10人因此死亡，他的集会也被迫因此中断。拉金和其他几名爱尔兰工人联盟高层成员的死亡让该运动的势头大受打击，运动中的各派系为领导权争吵不休，联盟因此陷入分裂。听闻这个消息后，柯林斯说，尽管他和拉金有些芥蒂，但毕竟在爱尔兰争取独立的斗争中，拉金仍算是位伟大的领袖与同志，并答应会参加拉金的葬礼。"
 ire.3220.a:0 "柯林斯大胆地展现了自己的优雅"
 ire.322.t:0 "柯林斯找到了“高内丽”"
 ire.322.d:0 "在成为爱尔兰最高领导人之前，柯林斯总统曾在大白天的时候骑着他那辆著名的“高内丽”自行车在都柏林的街道上穿行，哪怕是在英国人搜捕的时候也是如此。在大块头柯林斯当选总统后，他的自行车不幸丢失在了爱尔兰总统府附近，一个特别小组随后设法找回了我们总统心爱的“高内丽”。柯林斯总统对他丢失已久的自行车的失而复得感到非常高兴，他让人把这辆定制的金手牌自行车恢复到出厂状态，甚至还用它在城里通勤。总统用自行车代替车队的行为在都柏林实在引人注目，一些支持柯林斯的报纸宣称，总统用自行车代替了装甲车队或豪华轿车，这无疑证明了他是个无所畏惧的男子汉。\n总统自行车的失而复得再度在爱尔兰共和军内部引发了激烈的争论，一些人又提交了一份旧提案，想要在军队中创建专门的自行车部队。拥护者表示，这将以相对较低的成本提高爱尔兰共和军军队的速度于敏捷性，而反对者则指出，自行车很难维护，在游击战情况下也很难妥善隐藏，而且在山区驾驶自行车也是件难事。"
 ire.322.a:0 "授权组建专门的自行车部队，并以柯林斯的“高内丽”命名！"
 ire.322.b:0 "自行车在战场上就是鸡肋"
 ire.323.t:0 "我们爱尔兰的现代至高王"
 ire.323.d:0 "迈克尔·奥柯林斯首席部长与柯奈尔·加布拉家族的奥柯林斯有着血缘关系，而柯奈尔·加布拉家族又是消亡已久的芒斯特王国菲德亨特氏族的后裔。尽管柯林斯是顽固的共和派，但他的密友和盟友常常开玩笑地称他为“芒斯特王”或“爱尔兰至高王”，这让他很是懊恼。然而，许多狂热偏激的总统效忠者已开始把这种高贵血统的遗存当作某种更伟大事物的真理，并开始将奥柯林斯奉为民间的新至高王，或是芒斯特国王，这位共和派战争英雄因此勃然大怒。柯林斯将这些上了头的狂热分子杀鸡儆猴，把这个伪保王党在公共场合整整圈了一天，还当着众人的面在都柏林的首都广场羞辱他，只为了在这种个人崇拜蔓延并不可收拾之前消灭它。"
 ire.323.a:0 "首席部长将不会被崇拜！"
 ire.324.t:0 "合并职位？"
 ire.324.d:0 "为了更好地把控政治环境并掌握行政权力，许多效忠者推动着迈克尔·奥柯林斯将首席部长与总理职位合而为一。这将赋予迈克尔·奥柯林斯前所未有的权力，也是爱尔兰共和制度中未曾有过先例的权力，但这也有直接倒向威权主义的风险。而作为一个只有一届任期的独裁者，迈克尔·奥柯林斯并不想建立一个王朝，他向大众保证，这一措施是暂时的，在他去世或任期结束后，爱尔兰将能够再度向民主过渡。现在要怎么办呢？"
 ire.324.a:0 "维持现状"
 ire.324.b:0 "合并这两个职位，赋予柯林斯无限的行政权力"
 ire.325.t:0 "柯林斯政权的命运"
 ire.325.d:0 "迈克尔·柯林斯多年来一直是爱尔兰无可争议的行政长官，为了保护爱尔兰不受激进主义和工团主义的影响，他终止了民主程序。许多人认为爱尔兰现在已经足够安全，越来越多的人要求柯林斯兑现他的承诺，即有朝一日恢复民主。在国家大局已稳的情况下，我们现在应怎么做？"
 ire.325.a:0 "无限期地继续“临时”专制"
 ire.325.b:0 "兑现承诺，为民主开路，以免社会秩序崩溃"
 ire.325.c:0 "柯林斯拒绝下台，社会主义者在恐慌中发动了反政变"
 ire.326.t:0 "后柯林斯时代的选举"
 ire.326.d:0 "在兑现了在为真正民主下台前保卫爱尔兰的承诺后，柯林斯专制政权便随之垮台，爱尔兰可以再度举行民主选举。共和国正坚立于此，独立而安全，现在应由人民来决定我们的未来。谁将赢得即将到来的选举？"
 ire.326.a:0 "共和党"
 ire.326.b:0 "统一党"
 ire.326.c:0 "民族中央党"
 ire.326.e:0 "新芬党"
 ire.327.t:0 "由蓝入绿"
 ire.327.d:0 "陆军同志协会，也被称为青年爱尔兰，国民警卫队，青年联盟，以及最通俗的蓝衫军，这个名字来源于我们的蓝色徽章与蓝色制服。然而，这种蓝色与盎格鲁人的威胁有关，是我们同意与英国鬼子达成某种形式的缓和来争取地方自治的时代遗留下来的。很自然地，他们背叛了爱尔兰，所以我们也不必守约。然而，尽管爱尔兰在我们手上经历了沧桑巨变，但我们的制服以及整个运动却仍时时提醒着我们，所以，许多人要求我们采用我国以及宗教的代表颜色，成为绿衫军。我们该作何决定呢？"
 ire.327.a:0 "我们永远是蓝衫军"
 ire.327.b:0 "我们要改名为绿衫军，切断与盎格鲁人的最后联系"
 ire.328.t:0 "元帅政府的未来"
 ire.328.d:0 "奥达菲元帅以自己军政府统治爱尔兰的时间已不短了，陆军同志协会与爱尔兰共和军的军政府统治一帆风顺，元帅也得以为全爱尔兰的安全与福祉着想，让他和军队大权在握。然而，奥达菲常常从意大利与罗马尼亚的军团主义运动中获得灵感，并表示其有兴趣和他的一些盟友一同推动爱尔兰向家长式军团主义运动方向发展，并维持军队和陆军同志协会的指导地位。未来的爱尔兰政府将以何种面目示人？"
 ire.328.a:0 "延续陆军同志协会治下的军政府"
 ire.328.b:0 "以陆军同志协会的军事技能建构家长式军团主义"
 ire.329.t:0 "盖尔体育复兴运动"
 ire.329.d:0 "作为盖尔运动协会的创始人兼领导者，奥达菲正努力复兴许多古老的盖尔体育项目和活动，同时帮助爱尔兰本土奥运会与高地运动会焕发生机，以此展现凯尔特人特有的力量、技巧与敏捷。赛事展览中将涵括马球比赛和摔跤锦标赛，此外还有掷木杆、掷标枪、掷斧头、劈木头、掷木头等众多田径项目。我们要让世界知晓人类的真正潜能。"
 ire.329.a:0 "奥达菲会把你们个个塑造成男子汉！"
 ire.330.t:0 "爱尔兰珍宝"
 ire.330.d:0 "在爱尔兰君主政体得以复辟后，纠正三十年前犯下的错误的绝佳机会便出现了。当时爱尔兰王冠上的珍宝被一个不知名的人窃走了。尽管当时我们还苟活在英国人的铁蹄下，哪怕那帮英国人找了个底朝天，珠宝还是下落不明，但在我们获得自由后，新生的共和国百废待兴，也没有精力寻找一些闪亮的徽章和花哨的星章。然而，王冠缺少宝石让我们的新君主有些尴尬，他表示非常希望能找到这些宝石，并将其镶嵌回王冠上，作为爱尔兰团结的新象征。当然，我们大可以投入巨量的时间与精力去寻找最初的珠宝，把我们全部的警力都投入进去，只有天知道要花多少时间，也许珠宝早就不在爱尔兰境内了。我们也可以干脆铸造新的皇冠珠宝，摆脱英国的污点，真正地属于爱尔兰。或者……我们总归可以做一个原作的复制品，然后“声称”找到了它，这能让我们重获旧的珠宝，也不必耗费寻找真正的珠宝所需要的大量精力。"
 ire.330.a:0 "不，我们只接受真正的珠宝"
 ire.330.b:0 "绝不能让公众知道我们找不到珠宝"
 ire.330.c:0 "我们不需要那些珠宝，我们会制作新的珠宝来更好地展示我们的荣耀！"
 ire.331.t:0 "怪王"
 ire.331.d:0 "威廉·弗朗西斯·布林斯莱·勒波尔·特伦奇国王陛下，爱尔兰的至高王，第八世克兰卡蒂伯爵，第七世赫斯登侯爵，或是人们口中的威廉国王和怪王，顾名思义，他是个奇怪的人。威廉对领导国家没什么兴趣，他整天都在阅读无数关于各种伪科学的书籍，同时进行着自己关于不明飞行物与未知事物的可疑研究。目前困扰我们政府的是，我们应当让国王在政府运作中享有多少影响力？无论我们的决定如何，民主选举应该总是在众议院和各郡的下属政府中举行，但如果我们任凭威廉国王的怪僻行为对政府产生影响，我们就可以让我们的君主制在表面上反映其秘传本质。我们该怎么办？"
 ire.331.a:0 "掩盖国王的奇怪爱好，不让他人知晓"
 ire.331.b:0 "维持民主，不去管国王的怪癖"
 ire.332.t:0 "西班牙国王"
 ire.332.d:0 "至高王卢特巴尔德一世来自西班牙，初生奥唐奈家族。作为卡洛斯派的盟友和虔诚的天主教徒，卢特巴尔德至高王比大多数爱尔兰君主更激烈地反对宪政制度。他和其伊比利亚盟友关系密切，还是土生土长的贵族，但虽然卢特巴尔德至高王可能拥有爱尔兰血统与贵族的合法性，不过他远非一个真正的爱尔兰人。尽管有些外来性质，德·瓦莱拉和共和党还是向这个西班牙贵族抛出了橄榄枝，因为德·瓦莱拉与他的家庭私交良好，让他担任国王也能使我们与一个相对强大且相对中立的西班牙国家建立友好关系。厌烦民主制度，又对卡洛斯派和整合主义感兴趣的卢特巴尔德国王，只要他适应了翡翠岛的生活，就一定能好好统治国家。"
 ire.332.a:0 "国王万岁"
 ire.333.t:0 "本土国王"
 ire.333.d:0 "至高王布赖恩二世，奥布赖恩家族的最新至高王，他是爱尔兰历史上最伟大的至高王——布赖恩·博鲁的后代，其在1014年的克隆塔夫战役后推翻了腐败的奥尼尔王朝，驱逐了岛上的挪威侵略者，并被人民尊称为“斯科托勒姆英白拉多”——爱尔兰皇帝——这还是在1005年。因为拥有如此正统的血统，至高王布赖恩二世被许多人视为合法的至高王，甚至是合法的皇帝，因此，他曾不止一次地试图展示帝王的权势。尽管仍受到宪政制度的约束，但布赖恩国王屡屡试图通过一个愈发专制的君主政体来统治国家，希望以他认为最合适的方式来引导他的人民。尽管野心勃勃，他仍是个高尚的领袖，关心他的臣民，并为创造一个更好的爱尔兰与众议院的民选政府合作，他对盖尔复兴主义与爱尔兰独立事业的贡献也是无人能比。这位“唯一且真正的”至高王与斯科托勒姆英白拉多二世可能会因权力斗争遭人非议，但他肯定是一位可靠的君主，也是翡翠岛未来几年的真英雄。"
 ire.333.a:0 "真正的国王陛下万岁"
 ire.334.t:0 "葡萄牙国王"
 ire.334.d:0 "至高王奥德十一世，或称乌戈、奥尼尔家族的奥尼尔，他是爱尔兰整合主义之父，将这种思想从他的葡萄牙家乡引进了翡翠岛。作为葡萄牙整合主义与盛行于里斯本的新国家运动的支持者，奥德国王要为这种外来但属于基督教的意识形态在爱尔兰扎下根来负责，但他对宪政制度和爱尔兰人民的意愿——他的新臣民——持开放态度。奥德十一世至高王饱受疾病困扰，一直在培养他的儿子若热·乌戈·马里亚·奥尼尔，或称赛奥里斯一世，让他能在父亲去世后担起统国重任，但这对父子都致力于建立一个强大而独立的盖尔人爱尔兰，无论是在宪政民主的基础上，还是在葡萄牙整合主义的基础上。爱尔兰的命运如何，只有时间能告诉我们答案。"
 ire.334.a:0 "爱尔兰整合主义之父万岁"
 ire.335.t:0 "爱尔兰的人民国王"
 ire.335.d:0 "自[root.getleader]陛下即位以来，尽管他偶尔会在口头上对爱尔兰文化表示支持，但大多数人都觉得他还是个外国人。然而，事实绝非如此。这位霍亨索伦王子对他第二故乡的文化非常感兴趣，开始积极参与爱尔兰文化的活动。王子殿下常常待在都柏林的酒吧里，或者和他的臣民们踢着足球，他也开始学习盖尔语，不过他的掌握程度不敢恭维。实际上，国王陛下是一位颇受欢迎的君主。更重要的是，陛下吸取了其兄阿达尔贝特的经验，自愿皈依了天主教。尽管他皈依天主教主要是为了更加亲近他的人民，但他的妻子不这么认为。王后陛下拒绝屈服于“罗马的残暴”，正式申请离婚，国王别无选择，只能接受。国王认为这是一个向爱尔兰人民示好的机会，他宣布他将向一位爱尔兰贵妇人求婚，不过更多的细节还没有向公众公布。不管怎样，在[root.getleader]的领导下。在其德国人、也是爱尔兰人国王的领导下，爱尔兰一定会变成自由与文明的真正堡垒。"
 ire.335.a:0 "爱尔兰高于一切！"
 ire.336.t:0 "新荣誉制度？"
 ire.336.d:0 "在独立的爱尔兰王国自史书中涅槃重生后，爱尔兰社会也发生了翻天覆地的变化。虽然要是美国复辟了君主制，我们相较之下还是相形见绌，但爱尔兰人民仍受到了政府结构变化的巨大影响。在剧变后，许多人开始回味过去，希望一切都能恢复正常，而爱尔兰荣誉制度与圣帕特里克勋章便是过去的一部分。在共和国宣布成立后，荣誉制度便被正式废除，而自英国人逃到加拿大后，圣帕特里克骑士团也一直处于一种濒临毁灭的状态，随着君主制秩序回归爱尔兰，许多人开始期待起旧骑士团的回归。在贵族制本身得到重建后，许多人也同样期待起荣誉制度的回归，以将那些向国王与爱尔兰证明了自己的人奉为模范。然而，各党之中的共和派们虽然也宣誓或多或少地效忠于新君主，但仍对拟议中的重建荣誉制度表示了不安。虽然他们也承认展示自身功绩无可厚非，但他们认为现有的勋章体系便已足够了，倘若类似荣誉制度的东西得以重建，我们就离暴政更近了一步。而且，重建圣帕特里克骑士团，实际上就是分裂了骑士团，因为在名义上，骑士团仍然存在于加拿大的流亡者中。无论如何，要是国王陛下想要重建这一体系的话，那这就是他的唯一选择。"
 ire.336.a:0 "很好，恢复荣誉制度，改革圣帕特里克骑士团！"
 ire.336.b:0 "我们不需要这个过时的体系！"
 ire.337.t:0 "至高王的新候选？"
 ire.337.d:0 "雷蒙德·莫尔顿·奥布赖恩是爱尔兰保王党圈子里的知名人物，但他可不是纯良之人。奥布赖恩是英国出生的美国人，也是极右翼爱尔兰联合基督教民族主义党的创始人。他最为人所知的行为可能是冒充已灭绝的托蒙德伯爵国和伊布拉肯男爵，同时宣誓成为托蒙德公国的王子，这是奥布赖恩凭空捏造的一个虚构的微型国家，目的是为他骗取充足的贵族正统性。\n\n作为一名精神病患者，奥布赖恩曾在墨西哥、纽约和都柏林触犯法律，并因是凯尔特民族法团主义政党，复兴建筑师的边缘成员而闻名，尽管该党领导人对此百般否认。但这次他上了新闻，因为他对政府不将他提名为至高王候选感到愤怒不已，他自称拥有“贵族”血统。像往常一样，他成了人们的笑料，狼狈地逃走了，以免被愤怒的人群扔来的垃圾淹没。冒牌的托蒙德王子再度受辱。"
 ire.337.a:0 "让这疯子爬！"
 ire.338.t:0 "玛丽·香农旗"
 ire.338.d:0 "在1916年起义中，当我们与盎格鲁人激烈交战时，由玛丽·香农设计并创造的爱尔兰共和国国旗被英国鬼子偷走了，并被运到了英格兰，也是它如今的所在之处。在我们与英格兰之间的冲突愈演愈烈后，政府里的一部分人提议我们起草一份取回国旗的计划，如果我们或我国盟友最终占领了背信弃义的英格兰的话。由于战争似已近在眼前，而且我们也急需一份对付英国人的计划，该想法已被采纳，我们准备将这个想法扩展成一个处理英国人各种财宝的总体计划。由于草案已被接受，另一群人建议我们将1916年起义旗规定为正式国旗。虽然这面旗没有三色旗来得出名，但对那些为爱尔兰抛头颅洒热血的人来说，宣言旗仍是个非常有力的象征，在某些场合下更是如此。倘若我们把这面旗当成了国旗，我们便将向英国人及其同伙发出一个明确的信号——直到我们的自由得到真正保障之前，我们都不会善罢甘休。无论如何，如果英格兰落入爱尔兰之手，我们总会有个重获国宝的明确计划。"
 ire.338.a:0 "我们自会铭记历史，但采用新国旗就有点太过了"
 ire.338.b:0 "把原版旗帜偷回来，让它成为爱尔兰的官方国旗！"
 ire.339.t:0 "泛凯尔特大会"
 ire.339.d:0 "随着泛凯尔特情绪在爱尔兰复苏，一个重建泛凯尔特大会的绝好机会出现在我们面前。第一届泛凯尔特大会于1839年召开，一直持续到20世纪初，但在大战开始后，因为政治争端，该运动失去了大多数追随者。现在，爱尔兰重归稳定团结，著名的泛凯尔特倡导者，如鲁阿莱德·厄斯金和温迪·伍德呼吁召开第四届泛凯尔特会议，邀请凯尔特世界的全体成员讨论谁能得以进入这个未来的“凯尔特联盟”。尽管厄斯金本人宣称，他只支持爱尔兰与苏格兰之间达成联盟，但其他著名人士也发出了声音，如布列塔尼作家卡米尔·勒梅斯耶·德厄姆与布列塔尼德鲁伊教领袖塔尔迪尔，他们呼吁一切凯尔特人，无论身处何方，都应被允许加入联盟，尽管这无疑会使这个羽翼未丰的联盟与欧洲列强发生冲突。"
 ire.339.a:0 "大会宣布凯尔特联盟将不接纳不列颠群岛以外的人"
 ire.339.b:0 "大会听闻了布列塔尼人的困境，并会伸出援手"
 ire.339.c:0 "让我们保护葡萄牙的凯尔特同胞和曾由帕帕尔僧侣统治的冰岛"
 ire.340.t:0 "嗡嗡作响的发展"
 ire.340.d:0 "爱尔兰养蜂人联合会正为爱尔兰1500年来的养蜂传统与历史而庆祝，也正是因为如此悠久的历史，养蜂业在翡翠岛上得以蓬勃发展。这里的气候非常适合养殖蜜蜂，再加上长满各种野花的天然田野与草原，制作世上最好蜂蜜的配方便诞生了。从都柏林到科克乃至全国各地，你都能找到从传统的粘土、稻草或泥土蜂房，再到现代的木制或金属搭建的蜂房。诚然，养蜂业是爱尔兰文化中活跃而又多产的一部分。我们还用蜜蜂资助国际团体，如新英格兰的莱蒙德与洛弗尔、冰岛和捷克的农业组织，我们的蜜蜂甚至让我们得到了更友善的国际环境。世上没有蜂蜜与蜜蜂解决不了的问题。"
 ire.340.a:0 "幸亏我们有蜜蜂"
 ire.341.t:0 "原谅抑或铭记"
 ire.341.d:0 "伦敦政府最终承认了失败；庆祝活动席卷了整个不列颠群岛，在加的夫和格拉斯哥，游行队伍涌上街头，表达他们对军队和我们政府的支持，并感谢我们将不列颠群岛从英国人的魔爪下解放出来。在我们决定如何处置他们之前，英国人一直在受苦受难；尽管我们已网开一面，给予康沃尔和马恩岛特别对待，使他们免受盎格鲁人所遭受的严格宵禁与食物配给的影响。政府中有一些人呼吁“消灭”盎格鲁威胁，声称他们对英格兰各地凯尔特身份认同的消亡负有责任，也应该对布立吞人的衰落负责。不过到最后，肯定是理性温和的声音获胜吧？"
 ire.341.a:0 "我们必须唤醒英国人的精神，使之拥抱布立吞人的过往"
 ire.341.b:0 "开始清除岛上的盎撒污点"
 ire.342.t:0 "祖先问题"
 ire.342.d:0 "在全体苏格兰军队都陷入沉寂后，克莱德河沿岸和特罗萨克斯的最后一批坚守者终于投降了，他们担心自己的家园会被长期围困，以及围困可能会带来的后果。我们对占领区的统治相对比较宽松，食品车队正在进入萨洛姆湾和因弗基辛等港口，希望能缓解正在困扰我们北方同胞的粮食危机。然而，政府中的泛盖尔派迫切要求我们回答如何对待当地的皮克特传统。皮克特人是在爱尔兰盖尔语传播开来前占据着苏格兰和英格兰北部的族群。不过，在11世纪早期，当地的皮克特人与爱尔兰移民及入侵者融合，造就了真正的盖尔人。我们的占领使我们有机会将早已灭绝的皮克特人视为凯尔特兄弟，或许还能借此从苏格兰人那里得到一些同情，毕竟还有一些苏格兰人觉得自己与皮克特人祖先有种奇妙的关系。或者，我们也可以否定皮克特人，认定他们软弱无力，无法阻止被优越的盖尔传统所取代的命运，并只关注苏格兰盖尔人的成就。"
 ire.342.a:0 "皮克特人将被尊为真正的凯尔特兄弟，并将被铭记"
 ire.342.b:0 "皮克特人的灭绝是有原因的，把他们扔进历史的垃圾桶。苏格兰人一直都是盖尔人"
 ire.343.t:0 "爱尔兰的杀戮场"
 ire.343.d:0 "士兵们巡逻着，穿过泥泞的泥潭，领头的步兵走得有点快。不一会儿，一个小罐子不知从什么地方弹了起来，从泥浆中一跃到了人臀部的高度，随后在领路人的腰部附近炸开了，弹片和领路人的血肉四处飞溅，他的大部分躯体成了粉红色的血雾，而剩下的大块躯干则像屠宰场里的肉块般啪叽落地。恐慌在队伍中蔓延，另外两名士兵慌不择路地四散而逃，结果同样在几阵爆炸声后化作了血雾尸块。看起来，当局正在使用破片型“弹跳贝蒂”地雷来对付他们的敌人，他们在关键区域埋设该型地雷，而这种地雷会先弹射到齐腰高再爆炸，达到最大的致残效果。有传言说，当局曾将叛国者放在地雷上，然后引爆地雷将其处决。但放在以前，在本国国土上如此布雷是不可想象的。无论如何，这些叛徒如今就在这里，被地雷炸得血肉横飞。倘若任何叛军或邪恶势力胆敢反抗政府，他们最好小心留意大地，因为在[root.getleader]的爱尔兰里，一切国家之敌都不得安全行走。"
 ire.343.a:0 "卑鄙是卑鄙，但对一个自由和安全的爱尔兰来说是必要的"
 ire.344.t:0 "大麦汁"
 ire.344.d:0 "随着大西洋贸易委员会的建立，我们同美国兄弟的贸易关系达到了前所未有的良好状态。部分原因在于爱尔兰最著名的出口商品之一——威士忌。无论是詹姆逊的顺滑、布什米尔斯的甜度，还是其他最著名的爱尔兰酒厂，美国人购买威士忌的速度总比它们的生产速度还要快。为了避免我们的酿酒师走捷径，耽误这个真正独特的民族产业的发展前景，政府中的一些人建议我们向酿酒师一次性支付一小笔钱。这些人希望酿酒师能用这笔钱扩大他们的业务，而不影响他们的生产流程，他们相信，虽然短期内不会有什么回报，但从长期来看，这绝对是笔能回本的买卖。这些人中的一小部分人还希望我们也能补贴那些种植黑麦、小麦和其他各种用于酿造威士忌的谷物的农民，以确保规模扩大后的酒厂不至于没有制作麦芽浆的茎秆。不管怎样，爱尔兰威士忌肯定正逐步成为美国人的首选饮品，正如我们这个古老国家的国民也习惯同美国打交道一样。"
 ire.344.a:0 "给予酿酒师们一些补贴，这是他们应得的"
 ire.344.b:0 "支持酿酒师和农民，我们必须保护这一最光荣的产业"
 ire.344.c:0 "他们当然可以使用他们从美国人那里赚来的钱"
 ire.345.t:0 "压迫者的命运"
 ire.345.d:0 "历经漫长而艰苦的战役，伦敦终入吾彀中。当爱尔兰军队取代了盎格鲁警察，开始在这片不服王化的土地上恢复秩序时，也终于到解决英格兰问题的时候了。大多数人认为继续维持占领不太可行，我们必须给予英国人某种程度的自主权。最流行的建议是让英国人在我们的监督下组建自己的政府，我们可比他们好，是吧？不过，也有一些人要求我们借鉴背信弃义的盎格鲁人政策，但这次我们要原样奉还，成立一个“英格兰自由邦”。这一计划将以我们从前的自由邦为模板，建立一个严格意义上属于爱尔兰的国家，不过具有前所未有的自治权。最后，最根本的解决办法是让我们以其人之道还治其人之身。英格兰的语言、宗教、食物乃至于整个生活方式都将被摧毁，取而代之的是优越的爱尔兰文化。尽管这一计划需要几代人的时间才能开花结果，但假以时日，英格兰文化便将成为史书中的一行文字，伦敦街头也将和都柏林一样满是爱尔兰人。我们当然也可以简简单单地维持占领，虽然代价高昂，但这也是最简单的选择。不管怎样，我们必须尽快做出决定，以免盎格鲁人再度虐待我们的人民。"
 ire.345.a:0 "允许英国人组建政府"
 ire.345.b:0 "成立英格兰自由邦！"
 ire.345.c:0 "英格兰必须毁灭！"
 ire.345.e:0 "保持占领"
 ire.346.t:0 "爱尔兰的国旗"
 ire.346.d:0 "在柯林斯时期，反对派使用日焰旗作为其象征。这面旗帜源自爱尔兰神话，曾被19世纪的爱尔兰民族主义者所采用，它同时也代表了反对派重塑共和国的意愿。如今爱尔兰正处在十字路口，我们必须决定是改用日焰旗作为国旗，还是保留自复活节起义以来便一直使用的三色旗。"
 ire.346.a:0 "换掉三色旗？不干！"
 ire.346.b:0 "为啥不用玛丽·香农的绿底金字旗？"
 ire.346.c:0 "高举日焰旗！"
 ire.346.e:0 "采用日焰旗，加上长矛和星犁图案！"
 ire.346.f:0 "采用现代风格的日焰旗！"
 ire.346.g:0 "就用现在这面国旗吧"
 ire_monarch.1.t:0 "爱尔兰共和国的命运"
 ire_monarch.1.d:0 "长期以来，德·瓦莱拉总统一直拥护着爱尔兰的独立、保守主义、民族主义与统一，但在一个细节上他却有所纠结：共和制度与君主制度的辩论。德·瓦莱拉通常是共和民主的支持者，但众所周知，他也支持议会君主制的思想，这一思想的基础是前至高王的现代化形式，它将作为一种团结力量，把控着拥有大部分权力的民主政府。由于德·瓦莱拉和共和党现已牢牢控制着爱尔兰，他必须决定共和党是要引导爱尔兰走向保守共和主义还是保守立宪制君主制度。"
 ire_monarch.1.a:0 "共和国活得够久了，准备复辟君主制！"
 ire_monarch.1.b:0 "在爱尔兰当国王？疯了吧……我们站共和派这边"
 ire_monarch.2.t:0 "君主候选人"
 ire_monarch.2.d:0 "现在关于君主制的争论已经结束，是时候决定君主从何而来了。尽管共和党政府中的大多人呼吁为爱尔兰王国寻找一位爱尔兰君主，但一些异议者——受帕特里克·皮尔斯遗产所启发——提出了另一种选择，他们警告说，倘若没有外国保护，爱尔兰多半无法对抗英法两国的工团势力，更不用说对抗大洋彼岸的加拿大满腹阴谋的君主了。为此，共和党选择了普鲁士的约阿希姆，德皇威廉二世的第六个儿子，作为王位的候选人之一。约阿希姆不会说英语，一些人也希望他与盎格鲁人毫无联系，这能让我们能够影响他的政府，使爱尔兰乃至于整个英伦三岛走向去盎格鲁化。爱尔兰君主制与普鲁士君主立宪制的融合将让爱尔兰得以在德皇的注视下求得保护。虽然这会让我们放弃最受欢迎的本土候选人。一些人也表达了他们的担忧，认为选择约阿希姆就是把爱尔兰出卖给了德国人，德国人的占领也不会比英国人好到哪里去；当然，这不过是在散布恐惧，我们也将对君主制进行适当的制衡，确保国王仅是爱尔兰在世界舞台上的吉祥物。我们是应该加冕一位德国君主呢，还是说爱尔兰真正需要的是一位来自本土的至高王，也只有这样才能维护它来之不易的自由？"
 ire_monarch.2.a:0 "皮尔斯是对的，我们需要德国的保护，选择约阿希姆王子"
 ire_monarch.2.b:0 "我们不需要一个德国佬当国王，选一个爱尔兰候选人"
 ire_monarch.3.t:0 "一个爱尔兰国王"
 ire_monarch.3.d:0 "既然我们认定至高王应来自爱尔兰本土，我们现在便必须选出一位具体的君主。许多大氏族的血脉仍在非盎格鲁贵族中得以延续，所以我们必须从这些优秀的人选中选出一个领导爱尔兰的新至高王。德·瓦莱拉本人更喜欢一位老友的父亲，莱奥波尔多·奥唐奈-瓦尔加斯，他出生于西班牙，来自奥唐奈家族，此后加入了卡洛斯派运动。加冕他可能会让我们在外交事务上与西班牙绑定，但也会给予我们一个强大的天主教盟友。来自奥尼尔家族的乌戈·若泽·若热·奥尼尔及其支持者则对此大加批判。他生于葡萄牙，长于葡萄牙，是个爱尔兰裔葡萄牙贵族，他和里斯本的新国家与天主教葡萄牙整合主义运动有着密切的联系，也是爱尔兰整合主义意识形态的主要传播者，并向德·瓦莱拉和其他爱尔兰保王党介绍了这一概念。\n\n许多人认为这两个人都只有一半的爱尔兰血统，而在这两个吵个不停的外国人之外，多诺·奥布赖恩被众人认为是最合法的候选人，奥布赖恩家族的奥布赖恩是布赖恩·博鲁的直系后裔，博鲁是最伟大的至高王之一，他统治着奥尼尔王朝，终结了维京人对爱尔兰的入侵，开创了自己的王朝，并得以延续了五个多世纪，巩固了他在爱尔兰史上最伟大领袖的地位。因此，多诺·奥布赖恩深受全翡翠岛爱尔兰民族主义者的爱戴。竞选中的黑马候选人是威廉·布林斯利·勒波尔·特伦奇，第八世克兰卡蒂伯爵，第七世赫斯登侯爵。他是荷兰贵族，也是麦卡蒂家族的一员，完全有担任国王的正统性，但他对统治国家兴致缺缺。相反，特伦奇喜欢神秘和奇怪的东西，对不明飞行物学和其他深奥的伪科学情有独钟。\n\n众多候选人中的最后一位是第八代安特里姆伯爵兰德尔·麦克唐奈。他是一位土生土长的阿尔斯特人，其祖先索利·博伊·麦克唐奈为其家族在爱尔兰挣得了一席之地。在二世党人战争期间，麦克唐奈家族与他们在苏格兰的父系氏族唐纳德家族一同为斯图亚特家族英勇作战。虽然战争的失败大大削弱了安特里姆的麦克唐奈家族的影响力，但历经这段传奇历史，斯图亚特家族的王室血液已经流淌在了麦克唐奈一族的血脉之中。麦克唐奈家族是詹姆斯六世的女儿伊丽莎白·斯图亚特的后裔，因此无论有多么“远亲”，他都是爱尔兰、苏格兰、威尔士和英格兰王位的合法继承者。爱尔兰有从各大氏族中选出国王的悠久传统，所以让选举开始吧！"
 ire_monarch.3.a:0 "瓦莱拉青睐的候选人，爱尔兰裔西班牙人莱奥波尔多·奥唐奈-瓦尔加斯"
 ire_monarch.3.b:0 "爱尔兰裔葡萄牙人、整合主义者乌戈·若泽·若热·奥尼尔"
 ire_monarch.3.c:0 "痴迷于阴谋论的第八世克兰卡蒂伯爵威廉·布林斯利·勒波尔·特伦奇"
 ire_monarch.3.e:0 "多诺·奥布赖恩，最伟大的古代至高王布赖恩·博鲁的毋庸置疑的继承人与宣称者"
 ire_monarch.4.t:0 "小问题"
 ire_monarch.4.d:0 "普鲁士的约阿希姆引发了一个始料未及的问题。身为格鲁吉亚现任君主，若再另行兼任爱尔兰国王，恐将不堪重负，而且爱尔兰与格鲁吉亚相距甚远，同时执掌两国权柄实非明智之举。为此，政府建议将王位交给普鲁士的奥斯卡，约阿希姆的哥哥，他不必承担他弟弟那么重的统国重任。当然，我们不必仅因为约阿希姆已经是国王就拒绝他，他也不一定会积极参与日常政治。无论如何，还有第三种选择，在格鲁吉亚和爱尔兰两个王国之间建立共主邦联，哪怕这两个国家几乎没有共同之处。此举将能让约阿希姆在其居住的任何国家同时统治两个国家，并能进一步使爱尔兰融入欧洲的诸王冠之中。"
 ire_monarch.4.a:0 "我们不想给国王太多压力，就选奥斯卡吧"
 ire_monarch.4.b:0 "反正约阿希姆都已经加冕了，谁管呢？"
 ire_monarch.4.c:0 "联合统治格鲁吉亚与爱尔兰！"
 ire_monarch.5.t:0 "王室复辟"
 ire_monarch.5.d:0 "辩论终于结束了，新的爱尔兰至高王终于诞生了！在塔拉山上的命运之石加冕后，[root.getleader]已是爱尔兰的新王，并将给予民主制度所迫切需要的慈父般的指引。只要我们坚定不移、抱定决心，决意将爱尔兰和我们的自由置于一切之上，我们的独立就得到了保障。过往辉煌已然重现，爱尔兰王国已经重生。上帝保佑国王！"
 ire_monarch.5.a:0 "国王万岁！"
 ire_monarch.500.t:0 "加冕典礼"
 ire_monarch.500.d:0 "就像几个世纪前一样，爱尔兰新国王的加冕仪式将在米斯郡加冕丘的塔拉山顶上举行。那里矗立着一块高耸的巨石，名曰命运之石、言语之石或塔拉加冕石，石上刻印着众多宗教符文，其特殊含义早已被遗忘。在这片继承自我们祖辈的神圣之地上，新的至高王[root.getleader]于一个融合了现代爱尔兰天主教与盖尔语和德鲁伊教元素的仪式上加冕为王，爱尔兰独特的文化融合产物由此展现，并在新至高王的治下得到保护与弘扬。国王万岁！"
 ire_monarch.500.a:0 "愿新君主保护并维护爱尔兰的独立、完整和文化"
 ire_monarch.6.t:0 "宪法的命运"
 ire_monarch.6.d:0 "君主制业已兴起，我们必须决定如何处置现行的爱尔兰宪法。我们是应该沿用这部在独立战争中用鲜血浇筑而成的共和宪法，还是应该沿着共和整合主义者的路线重订宪法，从一开始就考虑君主制？"
 ire_monarch.6.a:0 "拥抱整合主义理想。"
 ire_monarch.6.b:0 "维护爱尔兰的宪政和民主遗产"
 ire_monarch.7.t:0 "宪法的命运"
 ire_monarch.7.d:0 "君主制业已兴起，我们必须决定如何处置现行的爱尔兰宪法。我们是沿用这部在独立战争中用鲜血浇筑而成的共和宪法，还是从普鲁士君主制的角度出发，依照普鲁士宪政重新起草宪法呢？"
 ire_monarch.7.a:0 "采纳普鲁士宪政理念"
 ire_monarch.7.b:0 "继承爱尔兰的宪政及民主遗产"
 ire_monarch.8.t:0 "爱尔兰君主立宪制下的选举"
 ire_monarch.8.d:0 "遵照宪法与民主程序之规制，瓦莱拉及其共和党的任期已经结束，决出王国新政府的新一届大选即将举行。所有的民主党派都参与了竞选，革命左派除外，他们是民主制度的威胁。谁将赢得选举，帮助至高王在新一届任期内领导爱尔兰？"
 ire_monarch.8.a:0 "布鲁和新芬党！"
 ire_monarch.8.b:0 "[GetIreAgrarianPartyLeader]和[GetIreAgrarianPartyShort]！"
 ire_monarch.8.c:0 "爱尔兰统一党再次获胜"
 ire_monarch.8.e:0 "德·瓦莱拉和共和党！"
 ire_monarch.8.f:0 "奥布赖恩及去激进化的工党！"
 ire_monarch.9.t:0 "爱尔兰-威尔士联盟？"
 ire_monarch.9.d:0 "纯属巧合的是，似乎普鲁士的奥斯卡同时被两个凯尔特国家选来统治国家。爱尔兰和威尔士都加冕德皇威廉二世的第五个儿子为本国君主，尽管爱尔兰人一开始跳过了奥斯卡的弟弟约阿希姆，因为他已拥有了自己的王冠。爱尔兰和威尔士的议会都注意到，威尔士和爱尔兰的国王奥斯卡已表示希望将他治下的两个王国合并为一个王国，以使其统治更为高效。在这种情况下，威尔士与爱尔兰的议会将保持独立，但两国将合并为奥斯卡领导下的一个王国。这无疑会让两国内部的少数泛凯尔特派势力感到高兴，自然也会让两国成为一个比彼此独立时更为繁荣的国家。当然，两国内部也有一些人担心国王会偏爱另一个王国，要是两国能保持友好关系，但仍保持独立的话，他们会感到更舒心些。"
 ire_monarch.9.a:0 "很好，一个爱尔兰-威尔士联盟，真是个新奇的想法！"
 ire_monarch.9.b:0 "去你妈的！我们决不会这样放弃我们的独立。"
 ire_monarch.10.t:0 "王国的新国旗"
 ire_monarch.10.d:0 "你想要为王国选择哪面旗帜？"
 ire_monarch.10.a:0 "绿底的爱尔兰王国旗"
 ire_monarch.10.b:0 "只带竖琴的蓝底国旗"
 ire_monarch.10.c:0 "带竖琴的三色旗"
 ire_monarch.10.e:0 "中间带省区旗的三色旗"
 ire_monarch.10.f:0 "普通版德意志王国旗"
 ire_monarch.10.g:0 "带绿底竖琴的德国风战旗"
 ire_monarch.10.h:0 "带蓝底竖琴的德国风战旗"
 IRE_BRTISHARMY:0 "自由英格兰军"
 IRE_BRTISHARMY_desc:0 "由于我们不断努力整合英格兰的土地，英格兰人已奋起反抗我们的统治。虽然他们的威胁不足以把我们驱逐出去，但他们接连不断的攻击对我们的政府来说实在是芒刺在背。这支由工团主义共和派与一些温莎的忠实拥护者组成的“军队”，或者更恰当地说，“自由英格兰军”将会持续斗争，直到爱尔兰人结束对英格兰的统治。"
 IRE_rep_flag:0 "我们可以为共和国选择一面新国旗"
 IRE_King_Leopoldo:0 "利奥波德加冕为王"
 IRE_King_Hugo:0 "胡戈加冕为王"
 IRE_King_Brinsley:0 "布林斯利加冕为王"
 IRE_paternal_autocrat_party4:0 "国家统合党"
 IRE_paternal_autocrat_party_long4:0 "国家统合党(Cumann Corpruiteac Náisiúnta)"
 IRE_DUFFY_HELD_ON:0 "奥达菲稳固了统治"
 ire.301.e:0 "在我党党内给他一个象征性的职位"
 ire.3221.t:0 "奥达菲离开统一党"
 ire.3221.d:0 "统一党领导下的爱尔兰总理约恩·奥达菲经常让该党头疼不已，他的“蓝衫党”准军事部队的集会常常以暴力结束。尽管柯林斯在某种程度上对蓝衫军睁一只眼闭一只眼，但在最近于特拉利举行的统一党集会上，爱尔兰共和军与陆军同志协会之间的大规模冲突成了压倒该党的最后一根稻草。柯林斯已正式解除约恩·奥达菲的爱尔兰总理职务，任命理查德·马尔卡希接替他的职位，并下令正式解散陆军同志协会。\n奥达菲的激进政策常常让统一党内的许多自由派成员感到不适，一些人指责奥达菲与铁卫团等激进运动沆瀣一气，尽管他否认他从这些运动中获得了灵感，甚至不遗余力地谴责这些运动中的反犹思想，但毫无疑问，奥达菲比统一党的主要支持者要激进得多，对柯林斯的忠诚似乎是让他没有选择退党的唯一因素。\n\n尽管奥达菲在统一党中的地位以及他与柯林斯的友谊使他没有被正式开除党籍或被逮捕，但奥达菲只被允许“根据手稿发表精心准备的简明演讲”，也只能“在经过协商并已有采访稿”的条件下接受采访，这实际上是给这位前军事领导人下了禁言令。\n\n虽然这远不是奥达菲的最坏下场，但这一行动让奥达菲丧失了对党的最后一丝信心，他正式脱离统一党，宣称他辞职是因为“他没准备好在被德国国旗拴着的情况下领导青年联盟”，然后便开始组建自己的政党：“国家统合党”。尽管这个政党吸纳了一些较为激进的统一党成员，但该党实际上毫无胜选机会，既因为奥达菲没什么人格魅力，也因为他不习惯参与政治，毕竟他之前就是个大头兵。"
 ire.3221.a:0 "我们可不会想念他的负面新闻"
 ire.337.b:0 "在爱尔兰君主制协会内给他找一个象征性的职位"
 ire.347.t:0 "吾王基督的步兵"
 ire.347.d:0 "让阿尔斯特许多人沮丧的是，天主教作为国家生活的一部分被爱尔兰所接受，在我国国内，天主教的生活方式已席卷各地。人们开始天天参加弥撒圣祭，曾经充满世俗气息的节日再度展现出宗教气氛。与此同时，天主教在政治领域的影响力也大大扩大，一度默默无闻的边缘天主教团体的受欢迎程度也大幅上升。其中一个组织便是由神父丹尼斯·费伊领导的“玛丽亚领袖”或“圣母引领我们”组织。尽管这个团体本身规模很小，哪怕人气上升后也是这样，但他们的领袖却远非如此。当谈到他关于吾王基督的著述，特别是关于基督的社会王权的著述时，费伊神父便已成为当地的一个传奇。虽然这是个复杂的话题，但从本质上讲，基督的社会王权要求在时间层面上承认基督的王权。该教义要求一切政府都遵守基督的教义，要求天主教会及其教义成为世上的最高法律，无论这片土地是否信奉天主教。就其个人而言，费伊神父是一名狂热的反犹分子，常常宣称“我们必须与犹太人用自然论渗透世界的企图作斗争。而就此出发，由于世上惟有一个神圣的秩序计划，每个理智的思想者都必须是反犹主义者。”\n\n尽管如此，政府内部也有些人呼吁我们接受费伊的教导，认为这确实是在基督王权方面卓越的论述。既然我们是个天主教国家，我们就必须给这件事做个合乎逻辑的结论。另一些人，通常持更左派或更世俗的立场，认为费伊应当因其反犹立场及言论遭到谴责，玛丽亚领袖组织也应当被取缔。还有一些人只想让我们别管这个牧师，并对天主教内部更激进的派别视而不见。无论如何，不管我们怎么做，丹尼斯·费伊神父兴许都会是吾王基督最为坚强的战士，未来也将如此。"
 ire.347.a:0 "吾王基督万岁！拥抱费伊和他的教导！"
 ire.347.b:0 "费伊是个危险人物。谴责他，取缔他的组织"
 ire.347.c:0 "别管费伊了，他掀不起什么大风大浪"
 ire_monarch.11.t:0 "整合爱尔兰君主制协会"
 ire_monarch.11.d:0 "爱尔兰君主制协会以弗朗西斯·斯图尔特、奥斯蒙德·埃斯蒙德爵士、十二准男爵、布尔默·霍布森、欧内斯特·布莱斯和其他与德·瓦莱拉结盟的君主制支持者为首，此前还得到了爱尔兰独立英雄帕特里克·皮尔斯、约瑟夫·普伦基特、亚瑟·格里菲斯、托马斯·麦克多纳、胡安·奥唐纳与一些死于他们之前的早夭人士的支持，是一个由作家、艺术家、政治家、记者、哲学家、精英和其他独立人士组成的广泛联盟，他们打算将君主制带回现代的爱尔兰。他们一度密谋推翻共和政府以建立君主制度来确保爱尔兰的独立，该组织提名过许多不同的国王人选，如约阿希姆·霍亨索伦和胡安·奥唐纳，但最终选择了奥尼尔王朝后人来继承王位。然而，随着德瓦莱拉的保王派运动崛起，协会失去了他们存在的目的与方向，并最终因不同意见导致的小团体而解散。这个庞大联盟有很多的潜在盟友，吸引他们支持我们的运动是一件简单的事，但他们与极右翼和激进主义的联系可能会损害我们运动的公众形象。我们应该如何处理他们？"
 ire_monarch.11.a:0 "允许他们融入我们的运动，但要与他们的激进思想保持距离"
 ire_monarch.11.b:0 "将爱尔兰君主制协会直接整合进我们的联盟！"
 ire_monarch.12.t:0 "重获格里菲斯的真正遗产"
 ire_monarch.12.d:0 "随着新芬党在复辟的爱尔兰君主制度下赢得近来的选举，新芬党及其创始人亚瑟·格里菲斯的真正初心在某种程度上已然实现。新芬党成立于1905年，由格里菲斯和其他左翼革命者组成。一开始，他们受到奥匈帝国的政治及其政府组织的启发，寻求构建一个君主制-共和制的融合体。新芬党寻求创立盎格鲁-爱尔兰二元君主制，使爱尔兰与英格兰处于平等地位，并将这一想法视为在当时实现爱尔兰地方自治的最佳途径。当然，这个计划后来失败了，这个计划也只有在新芬党承诺永远不会为温莎国王加冕的情况下才被爱尔兰民众接受，但即使作出了这一承诺，运动也在逐渐消亡，新芬党本身也会在接下来的几年里分裂为势头猛烈的共和派与日益凋零的保王派，而在德·瓦莱拉和柯林斯崛起后，新芬党的地位更是大不如前。然而，在新芬党于新国王的领导下取得了选举胜利后，我们实现了格里菲斯和早期新芬党的愿望，也不必向英国猪猡妥协投降。最终，我们的初心实现了，现在我们将带领爱尔兰走向伟大。"
 ire_monarch.12.a:0 "我们尊重建党元勋最初的梦想"
