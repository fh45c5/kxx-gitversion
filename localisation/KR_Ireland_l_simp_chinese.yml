 irelandflavour.362.t: "法兰西自由之殁"
 irelandflavour.362.d: "今晨，身处爱尔兰的我们刚刚起床，便有一条噩耗从法国流亡者、众人公认的合法法国政府首都阿尔及尔传来，我们年轻共和国的许多公民们亦为之震惊。在一场短暂的内斗后，夏尔·莫拉斯掌握了国家大权。昨日，他在法国议会发表正式讲话，宣布他打算将王位归还给奥尔良家族，并彻底终止法兰西第三共和国的存在。让王子，也就是奥尔良派的王位觊觎者立刻接受了邀请，他虽然还未加冕，但大家都心知肚明，法兰西的共和制度终于还是灭亡了。\n\n众所周知，欧陆大地上的大多数共和运动都深受法国的影响，对爱尔兰来说尤为如此。爱尔兰共和主义之父沃尔夫·托恩在反抗英王的起义中便受到了法国共和派的精神鼓舞与直接支持。就连我国最基本的象征——爱尔兰三色旗，也是由法国共和派妇女为庆祝如今这位新王的曾祖父，路易·菲利普一世的倒台而创造的，它象征着我们争取自由解放的共同事业。\n\n爱尔兰左右两翼的极端分子倒是幸灾乐祸了起来，马上便对爱尔兰民主的未来夸口许下了末日预言。一些极右翼人士宣称，这是个自由主义和民主制度存在缺陷、无法对抗工团主义势力威胁的鲜活例子，为了保卫我们的国家，他们主张确立一个现代的爱尔兰君主制度。同样，那些极左翼人士也将这一消息解读为资产阶级民主无力阻止反动威权主义的崛起，并将社会主义视为保为爱尔兰自由的唯一途径。我们大概只能希望这两派都是被猪油蒙了心了。"
 irelandflavour.362.a: "我命由我不由天，去他妈的法国佬！"
 irelandflavour.371.t: "玛丽·拉维勒"
 irelandflavour.371.d: "爱尔兰小说家和剧作家凯特·奥布莱恩在过去几年里本就是公众心目中的知名作家，但她的最新作品《玛丽·拉维勒》现在肯定是她最具争议的著作。\n\n奥布莱恩在撰写经典爱情恋爱小说上可是一把好手，她常会在书中描写英国与英裔爱尔兰人中的资产阶级人物是如何在英爱两国革命后寻找自身定位的。奥布莱恩虽对上层社会很感兴趣，但在过去十年的大部分时间里，她都生活在不列颠联邦，享受着那里的革命氛围。她在当地的生活方式也备受爱尔兰公众关注，因为有报道称她剪短了头发，穿着男人的衣服，甚至还有传言称她与其他女性举止亲密。\n\n人们的议论并未因新作打消分毫，因为《玛丽·拉维勒》里就有一位年长的爱尔兰女同性恋，她还向女主人公表露了自己的爱。在书中主人公爱上了已婚男人后，该书剧情的淫秽色情更是达到了巅峰。"
