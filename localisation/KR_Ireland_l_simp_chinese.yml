 irelandflavour.411.a: "都柏林有在乔伊斯的心中留下一道烙印吗？"
 irelandflavour.421.t: "生日蛋糕"
 irelandflavour.421.d1: "10月14日是个大日子——当然，在大多数人眼中并非如此，但对过去几年担任[IRE_loc_leader_title]一职的埃蒙·德·瓦莱拉来说，这确实是个好日子。\n\n在六十岁生日的公开庆祝活动上，瓦莱拉收到了一个新鲜出炉的爱尔兰岛形状生日蛋糕——这种蛋糕正配一国领袖身份。\n\n不过，这块蛋糕所带来的乐趣还不只如此，素以禁欲与严肃闻名的瓦莱拉礼貌地拒绝了用刀切开蛋糕的提议。“切开这个岛的感觉太怪了”，他苦笑着说，在某种程度上，这可以被认为是对他反对在独立战争结束时签订的《英爱条约》以及随之而来的分治的微妙回应。\n\n如今，这位寿星又稳稳坐上了国家元首的宝座，好事还在后头等着他呢。"
 irelandflavour.421.d2: "10月14日是个大日子——当然，在大多数人眼中并非如此，但对现任首席部长，埃蒙·德·瓦莱拉来说，这确实是个好日子。\n\n在六十岁生日的公开庆祝活动上，瓦莱拉收到了一个新鲜出炉的爱尔兰岛形状生日蛋糕——这种蛋糕正配一国领袖身份。\n\n不过，这块蛋糕所带来的乐趣还不只如此，素以禁欲与严肃闻名的瓦莱拉礼貌地拒绝了用刀切开蛋糕的提议。“切开这个岛的感觉太怪了”，他苦笑着说，在某种程度上，这可以被认为是对他反对在独立战争结束时签订的《英爱条约》以及随之而来的分治的微妙回应。\n\n这天发生的轶事也只能让人们从持续不断的可怕战争中腾出时间来喘口气，但德·瓦莱拉知道，哪怕柯林斯因其政绩在选举中民望居高不下，那么至少他自己在紧急状态下维护国家团结的行为能让史书称赞上他两句。为此，好事还在后头等着寿星呢。"
