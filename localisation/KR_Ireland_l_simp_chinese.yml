 irelandflavour.3912.a: "真是屈才了"
 irelandflavour.3912.b: "也没有说得那么糟嘛"
 irelandflavour.3912.c: "民族必须凌驾于国际及其个体之上"
 irelandflavour.3912.e: "我们是如同急风骤雨的狂乱……"
 irelandflavour.3913.t: "边缘之声"
 irelandflavour.3913.d: "今日，有关方面要求政府就即将在马恩岛举行的泛凯尔特大会一事发表正式声明。泛凯尔特运动一直与主流大众无缘，它提倡的是爱尔兰、苏格兰、马恩岛、威尔士、康沃尔和布列塔尼六地的“凯尔特”各民族的深化合作、文化交流与相互理解。自十九世纪以来，语言学领域的研究不断深入，“凯尔特”并非讲着相似语言的不同民族的集合体，而是一个单一民族的观点开始生根发芽，不过，截至目前，该观点在学术上尚有争议。\n\n虽然泛凯尔特大会本身并不具有政治属性，但部分与会者主张各民族应积极追求自身的独立（或者至少也要争取到自治权）倒也不足为奇，因为他们坚信，凯尔特人本是个团结一致的古老民族，却惨遭英法的排挤，被迫生活在边缘地带，直面北大西洋的汹涌波涛，受到整个社会的冷眼，而其语言也备受歧视，一度濒临灭绝。不过，对于大多数与会者来说，这次大会更像是一场载满了歌声与故事的愉快聚会：各民族的传统乐舞贯穿始终，共有着同一血统的歌曲和谐奏响，宛若一曲凯尔特交响曲。\n\n即使是最极端的爱尔兰民族主义者，也从未想过建立一个统一的凯尔特国家，更别说还是以爱尔兰为主导的了，抛却会上起于何方又止于何处的激烈争论，以及缺乏共同的身份认同这一横亘在眼前的实际障碍，单单的独立斗争就已是其追求的极限了。无论如何，某种形式的凯尔特亲缘关系，就算其本身再薄弱，也对各个政治派别有着一种别样的浪漫吸引力，而国家官方代表团的到场也得到了与会各方的一致欢迎。"
 irelandflavour.3913.a: "好一群小伙子"
 irelandflavour.3914.t: "世纪佳酿"
 irelandflavour.3914.d1: "一百八十年前的今天，亚瑟·健力士签下了一份长达九千年的租约，而其租下的厂房，就是如今世界上最大的酿酒厂——[Root.Capital.GetCapitalVictoryPointName]的圣詹姆斯门酿酒厂。多年来，健力士所开创的品牌一直与爱尔兰相伴相随，不仅其标志同爱尔兰的国徽有几分相似，而且在过去的十年里，健力士几乎成了爱尔兰的代名词，许多作家甚至将其誉为现代爱尔兰的象征。\n\n健力士家族，即原麦克盎楚沙家族、莫根尼斯家族，是一支古老的盖尔氏族，也是宗教改革时期为数不多皈依圣公宗的家族之一。在数个世纪的时间内，健力士家族同爱尔兰的英爱统治阶层关系甚密，也因此收获了数不尽的财富和威望。\n\n健力士家族的成功一度被视为英爱经济兴盛、产业繁荣的象征，其黑啤不仅风靡爱尔兰，更是得到了整个大英帝国的追捧。同爱尔兰的大多数人不同，健力士家族从英爱之间的关系中获益颇丰，也因此成为了统一派的忠实拥趸，并希望在未来继续扩展、巩固这一成功的商业版图。\n\n虽然英国革命冲击到了其最大的客户群体，但健力士却巧妙地抓住了爱尔兰脱离英国、亲近德国势力范围的机会，打入了中欧同盟之中，其啤酒也随之成了欧洲大陆的一种风潮、一种紧俏品。这一变化被一些人视为爱尔兰以独立国家之身份——既除旧迎新，又保留下了本身特色——于世界舞台上的初亮相。\n\n今日的健力士啤酒持续畅销国内外市场，而就算有了大陆的新市场，其掌门人的某些亲英情结虽已不如过去那般强烈，但却依旧存在，残存的大英帝国对这款啤酒的需求也是一如既往的旺盛——仿佛就像是健力士连结起了爱尔兰的过去、现在与未来一般。"
