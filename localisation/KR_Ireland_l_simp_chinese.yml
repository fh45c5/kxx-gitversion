 irelandflavour.387.a: "没有比邮政总局更适合爱尔兰勇士的地方了"
 irelandflavour.387.b: "库丘林的遗产将让阿尔斯特人民团结一心"
 irelandflavour.387.c: "有如库丘林之石一般，爱尔兰亦屹立不倒"
 irelandflavour.388.t: "黑金"
 irelandflavour.388.d: "今日，雷鸣般的掌声与如释重负一般的道贺声充满了整个伦斯特府，因为在外交部的辛勤努力下，爱尔兰拥有了获取至关重要的资源——茶叶的渠道。爱尔兰本身并不产茶叶，只能从更加靠近赤道的那些国家进口，而既然这一植物泡出的深黑色液体那么重要，我们是那么得依赖它，那就不禁要问了：过去没有它的时候，各行各业又是如何过的呢？\n\n说起茶，从“英国人唯一留下来的好东西”这一公认评价便足以一窥人们对茶的喜爱，今天的爱尔兰人均茶叶需求量已经超过了其邻国。一百多年前，茶叶随旧英国统治阶级来到了爱尔兰，并随着时间的推移，慢慢浸透到了民间。\n\n过去，英国人从印度殖民地获取茶叶，如今，不列颠联盟以类似的方式从其印度盟友处引入茶叶。虽然我们之前就已经有了一条稳定的进口渠道，但总有人担心只依靠单一来源的话，万一将来哪天贸易中断，我们到时又该如何是好。\n\n正因如此，一小群爱尔兰外交官才在过去几个月东奔西走、遍访世界，到处参观种植园，商讨进口协议，并最终确定引入印度的阿萨姆茶和德占肯尼亚的深色浓茶，将两者相混合，制作出专供国内市场的优质茶源。通过减少国家对单一印度茶叶来源的依赖，让茶叶的品种更加多样化，这样既得到了味道更好的浓茶，又保障好了未来的进口渠道。"
 irelandflavour.388.a: "加奶不加糖，谢谢"
 irelandflavour.389.t: "黄尘滚滚"
 irelandflavour.389.d: "从西部的滨海乡村到戈尔韦市的街道，马廷·奥卡钱的《教会之地》在爱尔兰语世界掀起了一阵风暴，甚至还引起了英语使用者的注意。这本书在《工人共和国》报上连载，几乎完全是以康涅马拉墓地里死者之间的一系列八卦与愤愤不平的对话为主题写成的。在那些和作者对上了电波的人看来，此书实在是喜剧杰作，它的流行也激起了用爱尔兰语写作的风潮。\n\n奥卡钱出身于戈尔韦郡科瓦法莱格的沿海盖尔语区，他因其所处社区的贫困现象心生忧愤，毅然投身于工团主义与爱尔兰语的复兴运动。身为一名为爱尔兰语使用者争取权利的活动家，历届政府的漠不关心便是他的斗争目标，有鉴于蓝衫军的军团主义派和他一样尊敬爱尔兰的本地语言，他有时也同他们合作。但这并不妨碍他是一名坚定的社会主义者的事实。他加入了爱尔兰公民军，虽因此失去了教职，但也成了一名有口皆碑的募兵官。\n\n在第二次爱尔兰革命后，他正四处宣传着他的观点，他成为了“爱尔兰再征服”概念的先驱，在这一概念中，英语和日趋流行的德语通用语都是资本主义的工具，也只有社会主义才能拯救爱尔兰人民的语言，才能让国家实现完全去殖民化。他试图借助这一理论为新共和国争取爱尔兰语使用者的支持，包括复兴建筑师的前支持者，在他看来，这些人不过是被反动势力蛊惑了，但他们信奉的文化民族主义在本意上是好的，倘若他们能迷途知返，他们就能利用文化民族主义达成积极目的。"
 irelandflavour.389.a: "爱尔兰语使用者有责任成为社会主义者"
 irelandflavour.389.a.tt: "§Y爱尔兰语使用者有责任成为社会主义者。§!"
 irelandflavour.3810.t: "橙与绿"
 irelandflavour.3810.d1: "适值已故历史学家、参议员爱丽丝·斯托普福德·格林隐退二十周年之际，一部涉及其研究领域——新教徒与英爱人群间的爱尔兰民族主义——的作品横空出世。综合格林的背景来看，这一主题可以说是在意料之中。\n\n该书指出，自1798年以来，英裔爱尔兰人在爱尔兰民族主义与共和主义的形成过程中扮演了至关重要的角色。虽然英爱人群和新教徒在爱尔兰总人口中的比例从未超过百分之十五，且其在历史上的大多数时期都是亲英一派，但这一群体中那些投身于民族主义事业的人所产生的影响却不可计量。\n\n数百年来，爱尔兰的新教徒往往拥有着更高的社会地位和教育水平，也正因此，自西奥博尔德·沃尔夫·托恩和爱德华·菲茨杰拉德勋爵起，爱尔兰民族主义的领头人中始终都有新教徒的影子，例如，罗伯特·埃米特领导了1803年的起义，查尔斯·斯图尔特·帕内尔则是上世纪八十年代民族主义运动的实际掌门人。而在政治领域之外，一代文学巨匠奥斯卡·王尔德、W·B·叶芝都怀着一腔民族主义之情。因此可以说，新教徒参与到民族主义事业中来是对十八世纪末以前天主教同爱尔兰想绑定之局面的一种解构。\n\n此外，该书还从一些政治边缘人物（如社会主义学者本杰明·法林顿、整合主义拥护者欧内斯特·布莱思）出发，深入当今爱尔兰社会，讨论了英国大革命对于爱尔兰各政治团体民意支持的影响。\n\n对于这样一本枯燥的学术论著来说，公众的反响相当热烈。书评家称，一个国家对待少数群体的态度是其各方面成熟的体现。虽然英裔爱尔兰人同阿尔斯特苏格兰人的经历不尽相同，但政府还是热衷于向北方地区宣传教派合一精神，哪怕最后结果只是热脸贴了个冷屁股。"
 irelandflavour.3810.d2: "适值已故历史学家、参议员爱丽丝·斯托普福德·格林隐退二十周年之际，一部涉及其研究领域——新教徒与英爱人群间的爱尔兰民族主义——的作品横空出世。综合格林的背景来看，这一主题可以说是在意料之中。\n\n该书指出，自1798年以来，英裔爱尔兰人在爱尔兰民族主义与共和主义的形成过程中扮演了至关重要的角色。虽然英爱人群和新教徒在爱尔兰总人口中的比例从未超过百分之十五，且其在历史上的大多数时期都是亲英一派，但这一群体中那些投身于民族主义事业的人所产生的影响却不可计量。\n\n数百年来，爱尔兰的新教徒往往拥有着更高的社会地位和教育水平，也正因此，自西奥博尔德·沃尔夫·托恩和爱德华·菲茨杰拉德勋爵起，爱尔兰民族主义的领头人中始终都有新教徒的影子，例如，罗伯特·埃米特领导了1803年的起义，查尔斯·斯图尔特·帕内尔则是上世纪八十年代民族主义运动的实际掌门人。而在政治领域之外，一代文学巨匠奥斯卡·王尔德、W·B·叶芝都怀着一腔民族主义之情。因此可以说，新教徒参与到民族主义事业中来是对十八世纪末以前天主教同爱尔兰想绑定之局面的一种解构。\n\n此外，该书还从一些政治边缘人物（如社会主义学者本杰明·法林顿、整合主义拥护者欧内斯特·布莱思）出发，深入当今爱尔兰社会，讨论了英国大革命对于爱尔兰各政治团体民意支持的影响。\n\n由于国家当局不愿出版该书，所以其也就自然没有官方的流通渠道。在官方看来，历史上的许多新教徒民族主义者行事的动机完全是出于自身的利益考量，以便在那终有一日到来的自由爱尔兰国度中保住自己的权力。天主教信仰的重要性不容低估，而如果像马尔凯维奇和凯斯门特这样的新教徒愿意皈依主流信仰，那国家能做的也只是加以鼓励宣传。"
 irelandflavour.3810.d3: "适值已故历史学家、参议员爱丽丝·斯托普福德·格林隐退二十周年之际，一部涉及其研究领域——新教徒与英爱人群间的爱尔兰民族主义——的作品横空出世。综合格林的背景来看，这一主题可以说是在意料之中。\n\n该书指出，自1798年以来，英裔爱尔兰人在爱尔兰民族主义与共和主义的形成过程中扮演了至关重要的角色。虽然英爱人群和新教徒在爱尔兰总人口中的比例从未超过百分之十五，且其在历史上的大多数时期都是亲英一派，但这一群体中那些投身于民族主义事业的人所产生的影响却不可计量。\n\n数百年来，爱尔兰的新教徒往往拥有着更高的社会地位和教育水平，也正因此，自西奥博尔德·沃尔夫·托恩和爱德华·菲茨杰拉德勋爵起，爱尔兰民族主义的领头人中始终都有新教徒的影子，例如，罗伯特·埃米特领导了1803年的起义，查尔斯·斯图尔特·帕内尔则是上世纪八十年代民族主义运动的实际掌门人。而在政治领域之外，一代文学巨匠奥斯卡·王尔德、W·B·叶芝都怀着一腔民族主义之情。因此可以说，新教徒参与到民族主义事业中来是对十八世纪末以前天主教同爱尔兰想绑定之局面的一种解构。\n\n此外，该书还从一些政治边缘人物（如社会主义学者本杰明·法林顿、整合主义拥护者欧内斯特·布莱思）出发，深入当今爱尔兰社会，讨论了英国大革命对于爱尔兰各政治团体民意支持的影响。\n\n为进一步施展政治抱负，政府抓住了这个机会，对这本书大加赞赏，并向人们着重宣传托马斯·戴维斯（十九世纪提倡爱尔兰独立的新教徒）等先前领袖的事迹，以及爱尔兰语作为唯一官方语言的地位，这与英国的跟屁虫丹尼尔·奥康奈形成了鲜明对比，后者放弃了自己祖先的语言，向天主教会百般使媚，还妄图让英国人继续掌控爱尔兰。盖尔语与自由，爱尔兰缺一不可。"
 irelandflavour.3810.d4: "适值已故历史学家、参议员爱丽丝·斯托普福德·格林隐退二十周年之际，一部涉及其研究领域——新教徒与英爱人群间的爱尔兰民族主义——的作品横空出世。综合格林的背景来看，这一主题可以说是在意料之中。\n\n该书指出，自1798年以来，英裔爱尔兰人在爱尔兰民族主义与共和主义的形成过程中扮演了至关重要的角色。虽然英爱人群和新教徒在爱尔兰总人口中的比例从未超过百分之十五，且其在历史上的大多数时期都是亲英一派，但这一群体中那些投身于民族主义事业的人对整个民族主义进程所产生的影响却不可计量。\n\n数百年来，爱尔兰的新教徒往往拥有着更高的社会地位和教育水平，也正因此，自西奥博尔德·沃尔夫·托恩和爱德华·菲茨杰拉德勋爵起，爱尔兰民族主义的领头人中始终都有新教徒的影子，例如，罗伯特·埃米特领导了1803年的起义，查尔斯·斯图尔特·帕内尔则是上世纪八十年代民族主义运动的实际掌门人。而在政治领域之外，一代文学巨匠奥斯卡·王尔德、W·B·叶芝都怀着一腔民族主义之情。因此，该书断定，新教徒参与到民族主义事业中来是对十八世纪末以前天主教同爱尔兰想绑定之局面的一种解构。\n\n此外，该书还从一些政治边缘人物（如社会主义学者本杰明·法林顿、整合主义拥护者欧内斯特·布莱思）出发，深入当今爱尔兰社会，讨论了英国大革命对于爱尔兰各政治团体民意支持的影响。\n\n自由爱尔兰批评该书利用宗教来煽动爱尔兰人民之间的对立，并指出其以贵族精英为视点，罔顾寻常大众。爱尔兰工人联盟认为其在爱尔兰身份认同，以及基督教各教派间的共同理想两个方面都有许多值得借鉴之处。工党则质疑该书大谈特谈民族主义和身份认同，却绝口不提英裔爱尔兰人在社会改革方面为爱尔兰所做的贡献。\n\n新政府为稳定仍不稳固的统治，允许了针对此书的各种声音的出现，但要让民众真正忘记政治、社会环境已不复从前的事实，还有很长的路要走。"
 irelandflavour.3810.a: "“自由、平等、博爱”什么的……"
 irelandflavour.3810.b: "虽然他们的祖先不以爱尔兰人自居，他们的后代却可以"
 irelandflavour.3810.c: "有用的白痴，仅此而已"
 irelandflavour.3810.e: "先有盖尔，再有爱尔兰"
 irelandflavour.3810.f: "不识庐山真面目，只缘身在此山中"
 irelandflavour.392.t: "《战士之歌》"
 irelandflavour.392.d: "距离《战士之歌》被正式立为爱尔兰的国歌已有十五年之久，这首歌诞生于1910年，由皮达尔·卡尼、帕特里克·希尼联手谱曲，卡尼一人作词，而如今流传的爱尔兰语版本则于1923年出自利亚姆·奥林恩之手。《战士之歌》承载着深厚的爱国情感，激励着人们去保卫古老的爱尔兰，去打败外来的敌人和压迫者。不仅如此，这首歌还广泛传唱于1916年之前的爱尔兰志愿军间，以及之后的弗朗戈赫集中营内，甚至被人非正式地称为“新芬党党歌”。\n\n从欢快的进行曲蜕变为激昂的国歌，这中间少不了改编者们的汗水，无论是管弦乐、军乐还是合唱，它都依据场合添加了恰到好处的庄重感。\n\n不过，恰如爱尔兰这样的新兴独立国家中的万事万物那般，这首歌也存在着一些悬而未决的问题。《战士之歌》同民族主义有着深厚的渊源，且其也毫不避讳这一点，因此，有人质疑其不利于团结那些曾经（或者现在依旧如故）的亲英派。此外还有人认为，虽然原曲是以英文写成，但官方钦定的版本还是爱尔兰语，这会让某些不熟悉这门语言的人感到不自在，而且改编后的歌词也是乏善可陈，空余一副优美的旋律。最后，也有人虽赞同歌曲所表达的情感，但同时也坚持在爱尔兰的音乐长河中，还有着更悠久、更适合的国歌候选曲。\n\n虽然维持国歌不变应当是最自然而然的选择，但最终的决定还是由政府说了算。"
 irelandflavour.392.a: "无需变动"
 irelandflavour.392.b: "重新作一首更合适的歌词"
 irelandflavour.392.c: "《天佑爱尔兰》总错不到哪去"
 irelandflavour.392.e: "换成国际歌，当然，得是爱尔兰语版的"
 irelandflavour.392.f: "《奥唐奈万岁》同我们的民族、我们的历史渊源更深"
 irelandflavour.393.t: "爱尔兰的足球"
 irelandflavour.393.d1: "遍观这个国家的政治新闻，你很可能会得出一个观点：结党营私、党同伐异真是无处不在。不过，也不是所有领域都是这种风气的，体育运动，特别是足球，就是个例外。\n\n本世纪之初，盖尔运动协会大力推广盖尔足球，盖尔足球的普及率一骑绝尘（至少在爱尔兰的天主教人群中是如此），令英式足球望尘莫及。由于盖尔足球天生带有些爱尔兰民族主义的元素，故许多阿尔斯特的新教徒对其是抗拒有加，英式足球反而更受其欢迎，也正因此，爱尔兰联赛成立之初，全部参赛队伍都来自阿尔斯特，而其中只有贝尔法斯特凯尔特人队的队员是天主教徒。不过，近几十年来，两种运动之间那道泾渭分明的界限正逐渐消失，因为在世界杯名气和魅力的带动下，越来越多的人投身到了英式足球这一运动中，新的球队也如雨后春笋般出现在了各地涌现，不光都柏林、科克如此，连邓多克、利默里克、沃特福德、斯莱戈等小城也不遑多让，而且“斯莱戈流浪者”还是今年第一支赢得联赛的非伦斯特、阿尔斯特队伍。\n\n“工人队伍”和各式业余俱乐部兴起后，为在表面上彰显平等，不列颠联盟打乱并重组了国内的所有职业球队，许多英国球员，尤其是苏格兰和利物浦地区的球员，纷纷来到了爱尔兰，这进一步抬升了英式足球的人气。如今，英伦三岛的球员汇聚于全爱尔兰的各支球队，爱尔兰联赛也成为了不同国家的足球爱好者们交流、角逐的盛事，都柏林和贝尔法斯特球员们的相互串场也成了一种常态。"
 irelandflavour.393.d2: "我国自独立以来所面临的最大挑战之一，便是打破民众在英治时期形成的某些根深蒂固的思维观念。虽然大众能够理解在政治和经济层面同英国切割的必要性，但就连那些盖尔事业的支持者也未必能搞清楚在文化层面坚持自我的重要性，而英国文化残留的一个例子，便是英式足球运动。\n\n“爱尔兰联赛”初创时，其球队全部来自阿尔斯特，而其中只有贝尔法斯特凯尔特人一队信仰天主教。虽然后来，联赛不断发展壮大，吸纳了一些都柏林和科克的球队，但蓝衫军依旧坚持，英式足球的参与者都是些亲英派，若不然的话，他们又怎会放下原汁原味的盖尔足球不管不顾，转而投身异国的同类运动呢？\n\n既然现政府无比热衷于盖尔文化，那自然应撤销对英式足球的一切支持与赞助。这一运动的爱好者们愿意怎么玩是他们的自由，但国家绝无义务为他们背书。"
 irelandflavour.393.d3: "我国自独立以来所面临的最大挑战之一，便是打破民众在英治时期形成的某些根深蒂固的思维观念。虽然大众能够理解在政治和经济层面同英国切割的必要性，但就连那些盖尔事业的支持者也未必能搞清楚在文化层面坚持自我的重要性，而英国文化残留的一个例子，便是英式足球运动。\n\n“爱尔兰联赛”初创时，其球队全部来自阿尔斯特，而其中只有贝尔法斯特凯尔特人一队信仰天主教。虽然后来，联赛不断发展壮大，吸纳了一些都柏林和科克的球队，但组成这一运动根基的，始终是那些自认优越于盖尔文化、拒绝融入爱尔兰社会之人。\n\n既然国家已甄别出了这一文化寄生虫，那封禁英式足球便是势在必行。身心健康的国民要是不愿去参加盖尔足球、爱尔兰曲棍球一类的本土运动，那就必须得去军中志愿服役。"
 irelandflavour.393.d4: "阶级重于文化、宗教是马克思主义的一大理论，举个例子来说，新教工人和天主教工人之间的共鸣，远比贫富差距悬殊的天主教徒间的共鸣来得深刻，而在体育领域，这一点体现得尤为明显。\n\n虽然宗派主义肆虐我岛已有数百年之久，但近几十年来，工人阶级中的新教徒和天主教徒却在足球比赛的带动下，找到了一座彼此沟通的桥梁。体育运动和社区建设的积极意义不言而喻，但资本家们却妄图以此来牟利。同盖尔运动所秉持的合家欢精神不同，这些亲英的资产阶级极力推动爱尔兰足球运动的“职业化”。虽然球员们有着一笔可观的薪水，但同时他们也成了任人拣选的商品，如市场上的牲口般在球队之中流通。球队里也再无邻里亲朋，取而代之的是一群为钱所驱的陌路人。\n\n既然社会主义大旗已在我国扎下了根，那么我们自当效仿英法，重组球队。未来的足球队将不再以所有者为中心，而是以工作场所或职业为纽带。如此一来，足球不仅能成为强身健体的工具，更有望成为消灭宗派主义的一大法宝。"
 irelandflavour.393.a: "搞不好哪天我们能打到世界杯决赛呢……"
 irelandflavour.393.b: "我国文化并不逊色于他人，我国体育亦然"
 irelandflavour.393.c: "只有仔细除草，花园之中才能鲜花盛开"
 irelandflavour.393.e: "球队属于社区，而非资本家"
 irelandflavour.395.t: "《芬尼根的守灵夜》"
 irelandflavour.395.d1: "“丷羓仈阿玍旯侤冚冖秅芲矼僰塱庹疒尨圡岇蛌蟘叒屲蕻岙罒夰図乕芔惪媆歮胬峇！”一声过后，年轻的爱尔兰小工“芬尼根”魂归西天，而《芬尼根的守灵夜》一书从昏昏欲睡的英语读者们的手中滑落时，发出的大抵也是这种声音吧。\n\n在法国自我放逐了十余年后，爱尔兰作家詹姆斯·乔伊斯通过巴黎的一家小出版社出版了自己的新书《芬尼根的守灵夜》。小说虽以英语写就，然乔伊斯解构融汇多国词汇铸就独特语体，自成一格——论者谓此乃乔伊斯摹写忆、人、地于半梦半醒间交融幻化之术。虽然出版册数不多，但《芬尼根的守灵夜》还是静悄悄地出现在了英语世界各地的书架上。截至目前，人们对该书的评价褒贬不一。书评家诟病其核心情节缺失、表象混沌，普通读者则畏其艰深晦涩。乔伊斯坚称字字珠玑，然贬者斥之为悍然践踏文学成规的无谓之举——唯此反叛精神，反为一些人所赞。\n\n爱尔兰政府对该书的出版不置一语，这也难怪，毕竟他们从来就不喜欢其作者乔伊斯。另一方面，虽然大众对于这位毫不遮掩自己爱尔兰身份的乔伊斯很是骄傲，但对于作品本身的反响却出乎意料的平淡。不过，这本书的高调亮相总归还是激起了许多国民的情绪的。"
 irelandflavour.395.d2: "“丷羓仈阿玍旯侤冚冖秅芲矼僰塱庹疒尨圡岇蛌蟘叒屲蕻岙罒夰図乕芔惪媆歮胬峇！”一声过后，年轻的爱尔兰小工“芬尼根”魂归西天，而《芬尼根的守灵夜》一书从昏昏欲睡的英语读者们的手中滑落时，发出的大抵也是这种声音吧。\n\n在法国自我放逐了十余年后，爱尔兰作家詹姆斯·乔伊斯通过巴黎的一家小出版社出版了自己的新书《芬尼根的守灵夜》。小说虽以英语写就，然乔伊斯解构融汇多国词汇铸就独特语体，自成一格——论者谓此乃乔伊斯摹写忆、人、地于半梦半醒间交融幻化之术。虽然出版册数不多，但《芬尼根的守灵夜》还是静悄悄地出现在了英语世界各地的书架上。截至目前，人们对该书的评价褒贬不一。书评家诟病其核心情节缺失、表象混沌，普通读者则畏其艰深晦涩。乔伊斯坚称字字珠玑，然贬者斥之为悍然践踏文学成规的无谓之举——唯此反叛精神，反为一些人所赞。\n\n对于爱尔兰政府来说，这本书就是惊世之作，而乔伊斯离经叛道的笔触正是其超世之才的充分体现。一位政府部长甚至直言，这本书的阅读难度正好起了一层“筛选”的作用。从大众角度来说，这部书的高调亮相确实激起了一些民族情绪，但总体来说还是没有什么实质性问题的。"
 irelandflavour.395.d3: "“丷羓仈阿玍旯侤冚冖秅芲矼僰塱庹疒尨圡岇蛌蟘叒屲蕻岙罒夰図乕芔惪媆歮胬峇！”一声过后，年轻的爱尔兰小工“芬尼根”魂归西天，而《芬尼根的守灵夜》一书从昏昏欲睡的英语读者们的手中滑落时，发出的大抵也是这种声音吧。\n\n在法国自我放逐了十余年后，爱尔兰作家詹姆斯·乔伊斯通过巴黎的一家小出版社出版了自己的新书《芬尼根的守灵夜》。小说虽以英语写就，然乔伊斯解构融汇多国词汇铸就独特语体，自成一格——论者谓此乃乔伊斯摹写忆、人、地于半梦半醒间交融幻化之术。虽然出版册数不多，但《芬尼根的守灵夜》还是静悄悄地出现在了英语世界各地的书架上。截至目前，人们对该书的评价褒贬不一。书评家诟病其核心情节缺失、表象混沌，普通读者则畏其艰深晦涩。乔伊斯坚称字字珠玑，然贬者斥之为悍然践踏文学成规的无谓之举——唯此反叛精神，反为一些人所赞。\n\n在爱尔兰，反动政府对该书的态度则令人感到有些意外。奥金纳甘批评称，该书作者不使用“本国语言”写就这样一部作品的“文化堕落”之行，让其流行所带来的红利全被英语给占了去。《芬尼根的守灵夜》虽内容晦涩、深奥，其作者乔伊斯也为自己的爱尔兰血统感到骄傲，但由于这些都不是当局想要的“爱尔兰性”，所以这部作品还是在爱尔兰被下了禁令。"
 irelandflavour.395.a: "一条孤独而恒久、美丽而流长的河流奔腾不息……"
 irelandflavour.395.b: "太可怕了！"
 irelandflavour.396.t: "奥地利教授"
 irelandflavour.396.d1: "在海对岸的中欧，传说中凯尔特人的起源之地，著名的奥地利语言学家、凯尔特人学家和亲爱人士尤利乌斯·波科尔尼近来出版了他的崭新著作，讲述了凯尔特人和伊利里亚人的史前史。早在盖尔复兴运动如火如荼之时，爱尔兰人便对他们长期以来被压制的语言与文化产生了自豪感，而主要出身于德国的凯尔特学家们，如波科尔尼和已故的库诺·迈耶，他们重新发现了古老的凯尔特文学，并大力宣传其对欧洲文明的重要性，他们对此方面的贡献已无法用言语衡量，亦成了条顿-爱尔兰两族关系中的一段美妙插曲。\n\n爱尔兰与日耳曼世界的联系可以追溯到爱尔兰因其知识和基督教信仰而备受称赞的时代，那时，爱尔兰僧侣在今天德奥两国的土地上建立了修道院。在后来的几个世纪里，英国人逐步加强了对爱尔兰岛的控制，许多爱尔兰人也因此远遁国外，虽然爱尔兰人在鲁尔地区的工业化中作出了一定贡献，但在德意志民族的土地上，没有哪个国家能像奥地利一般接收如此多的移民，爱尔兰人也在当地的军事与政治中扮演了重要角色，曾有一百多名奥地利将军、陆军元帅或海军上将出身于爱尔兰人家庭。其中最著名的莫过于那位在1853年从匈牙利刺客手中拯救了弗朗茨·约瑟夫的马克西米利安·奥唐奈。\n\n维也纳与我国相隔千山万水，其治下的国家亦日趋衰落，因此，在普通盖尔人的心目中，奥地利相较于柏林已显得黯然失色，柏林方面既与我们更为亲密，也是更为强大的反英盟友，更是爱尔兰移民到欧洲大陆的主要目的地，但很多人仍对哈布斯堡王朝抱有敬意，毕竟它的双元君主制曾几何时也是新芬党效仿的典范。当批评家将奥地利帝国与英国相提并论时，其他人则会将哈布斯堡王朝对少数民族的仁慈与英国对爱尔兰人民的残暴镇压进行对比，并祝愿他们能平稳度过近来的动荡时期。"
 irelandflavour.396.d2: "在海对岸的中欧，传说中凯尔特人的起源之地，著名的奥地利语言学家、凯尔特人学家和亲爱人士尤利乌斯·波科尔尼近来出版了他的崭新著作，讲述了凯尔特人和伊利里亚人的史前史。早在盖尔复兴运动如火如荼之时，爱尔兰人便对他们长期以来被压制的语言与文化产生了自豪感，而主要出身于德国的凯尔特学家们，如波科尔尼和已故的库诺·迈耶，他们重新发现了古老的凯尔特文学，并大力宣传其对欧洲文明的重要性，他们对此方面的贡献已无法用言语衡量，亦成了条顿-爱尔兰两族关系中的一段美妙插曲。\n\n爱尔兰与日耳曼世界的联系可以追溯到爱尔兰因其知识和基督教信仰而备受称赞的时代，那时，爱尔兰僧侣在今天德奥两国的土地上建立了修道院。在后来的几个世纪里，英国人逐步加强了对爱尔兰岛的控制，许多爱尔兰人也因此远遁国外，虽然爱尔兰人在鲁尔地区的工业化中作出了一定贡献，但在德意志民族的土地上，没有哪个国家能像奥地利一般接收如此多的移民，爱尔兰人也在当地的军事与政治中扮演了重要角色，曾有一百多名奥地利将军、陆军元帅或海军上将出身于爱尔兰人家庭。其中最著名的莫过于那位在1853年从匈牙利刺客手中拯救了弗朗茨·约瑟夫的马克西米利安·奥唐奈。\n\n维也纳与我国相隔千山万水，其治下的国家亦日趋衰落，因此，在普通盖尔人的心目中，奥地利相较于柏林已显得黯然失色，柏林方面既与我们更为亲密，也是更为强大的反英盟友，更是爱尔兰移民到欧洲大陆的主要目的地，但很多人仍对哈布斯堡王朝抱有敬意，毕竟它的双元君主制曾几何时也是新芬党效仿的典范。当批评家将奥地利帝国与英国相提并论，并为反抗奥地利的民族主义者欢呼雀跃之时，其他人则会将哈布斯堡王朝对少数民族的仁慈与英国对爱尔兰人民的残暴镇压进行对比，并祈祷他们能够战胜敌人。"
