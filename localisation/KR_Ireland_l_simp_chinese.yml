 irelandflavour.3912.d3: "爱尔兰工人联盟旗下的报纸《工人共和国》再遭官方点名，被批为“具有极端颠覆性”。同前几届政府的宽松态度不同，本届政府打算以最强硬的方式，遏制该报纸的发行，因为任何不慎翻阅到这份报纸的公民，都将被迫接触到爱尔兰最为人所不齿的社会主义作家——汤姆·奥弗莱厄蒂、利亚姆·奥弗莱厄蒂两兄弟的作品。\n\n汤姆生于爱尔兰西海岸的阿伦群岛，早年在家乡度过，1912年远赴美国，开启了记者生涯，而原本以牧师为志向的弟弟利亚姆则于1908年踏上了爱尔兰本岛，并于其后逐步发展为了爱尔兰志愿军中的一名极端分子。\n\n世界大战爆发后，汤姆于波士顿、纽约奔波，组织爱尔兰劳工们加入远离战火硝烟的世界产业工人联盟。与之相反，利亚姆视这场战争为契机，他清楚，爱尔兰人要想打破英国的枷锁，需要的正是军事经验，因此，他化名入伍，加入了压迫者的军队。战争结束后，利亚姆回到了家乡，虽身体上满身伤痕、精神上饱受折磨，但当听闻爱尔兰独立战争和法国无产阶级革命的消息后，他的心中还是涌起了一股由衷的自豪。美国无产阶级的苦难触动了汤姆，而战争的恐怖也把利亚姆锻造成了一名坚定的社会主义者。最初，两人以新芬党的追随者自居，而如今，两人已是罗迪·康诺利的爱尔兰工人联盟的缔造者。\n\n1920年，兄弟二人在波士顿重逢，并双双迷上了写作。汤姆早前就已接触过无产阶级文学，而利亚姆之所以为打字机所吸引，是因为其可以帮助他疗愈战争的创伤、记录一路以来的见闻。利亚姆虽起步较晚，但不久便崭露头角，其作品充满了象征、隐喻和讽刺元素，而汤姆的文字则以1934年的归国为分水岭，之前是朴实无华的政治语言，之后是对田园生活的细腻观察。汤姆仅发表了寥寥数篇作品便于1936年过世，而其未竟之业，包括写作和世界革命，都由利亚姆全盘继承。"
