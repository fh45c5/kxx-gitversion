 IRE_False_King_Resistance_desc: "被废黜的[IREGetFormerKing]的支持者对雷蒙德·莫尔顿·奥布赖恩所谓“非法篡夺王位”感到愤怒。这些不忠的傻瓜该被尽快处理掉，以免他们造成的麻烦超过了他们的价值。"
 IRE_Organic_Ireland_Idea: "有机爱尔兰"
 IRE_Organic_Ireland_Idea_desc: "虽然天主教的影响已经深深渗入了爱尔兰的每一寸土地，但直到今天之前，爱尔兰从未像伊比利亚和法国那样出现整合主义的萌芽。在爱尔兰君主制协会和雷蒙德·奥布赖恩的领导下，我们会在纯净的天主教爱尔兰中建立起融合了莫拉斯主义和卢西塔尼亚整合主义，并辅以美国的基督教民族主义和爱尔兰自身的盖尔文艺复兴特点的有机君主制，创造出史无前例的分权和专制相结合的独特体制，而这一由部族体系、法团主义经济、迅猛发展的行会系统、爱尔兰民族主义、反社反资、天主教会激进拥趸的极端教义所支撑起来的君主制定会为爱尔兰的每一位虔诚儿女带来繁荣！"
 IRE_Ilegitimate_King: "不正之君"
 IRE_Schizo_King_Coup: "爱尔兰王座上的“托蒙德伯爵”"
 IRE_Schizo_King_Coup_desc: "布赖恩·博鲁大帝的在世血脉、已经消亡的托蒙德伯国和伊布拉肯男爵领的继承人雷蒙德·莫尔顿·西根·奥布赖恩所率领的爱尔兰君主制协会已经超越了其共和党前盟友，彻底颠覆了民主制度，从伪君[IREGetFormerKing]处夺取了王座，控制了国家。奥布赖恩向全国宣告，王位的所有宣称者全部为假冒的江湖骗子，唯有他才拥有资格成为真正的爱尔兰至高王，统御整个爱尔兰。奥布赖恩的爱尔兰君主制协会将携手复兴建筑师和蓝衫军中迷途知返的激进成员、共和党中的边缘团体和其他一些与德·瓦莱拉相关的势力，为翡翠岛带来全新的整合主义君主制。"
 IRE_Black_Legion: "赋权黑色军团"
 IRE_Black_Legion_desc: "奥布赖恩的黑色军团，是爱尔兰君主制协会的准军事部门，是奥布赖恩丝毫不加掩饰的暗影之手，是他利用恐惧和血腥来控制整个爱尔兰的手段。通过扩大他们的职责范围、给予他们更多的资金和更广泛的特权、使他们成为政府机构正式且合法的一份子，黑色军团将不惜一切代价地维护至高王领导下的有机君主制，奥布赖恩的意志将得到绝对服从和执行，任何来自国内的威胁都将灰飞烟灭。"
 IRE_Links_to_ANH: "与复兴建筑师结盟"
 IRE_Links_to_ANH_desc: "由于奥布赖恩本人与约翰·杰拉尔德·坎宁安的复兴建筑师组织早已相识多时，所以他们绝对够格成为我们的理想盟友。虽然我们两方在贵族和精英主义的事情上存在分歧，但为了与坎宁安的凯尔特派所辖的爱尔兰民族主义者、盖尔复兴主义者、天主教法团主义者达成合作，我们也可以做出些让步，引入由部族传统领袖参与治理的部族体系。如此，唯一横亘在我们两家之间的难题只有君主制之争了，但我们只要拿捏好他们的威权传统思想，要解决此事易如反掌。"
 IRE_Discredit_Previos_King: "抹黑伪王！"
 IRE_Discredit_Previos_King_desc: "众所周知，奥布赖恩才是传奇君王布赖恩·博鲁的直系子嗣，只有他才配得上爱尔兰至高王的名号，前任王是个彻头彻尾的伪君。爱尔兰君主制协会必须将这一事实公之于众，把[IREGetFormerKing]彻底描绘成四处招摇撞骗的假冒者，如此，我们才能提高自身统治的正当性，减少群众对我们敬爱的托蒙德伯爵的猜疑指责。"
 IRE_Christian_Nationalist_Crusade: "爱尔兰的“基督教民族主义圣战”"
 IRE_Christian_Nationalist_Crusade_desc: "杰拉尔德·L·K·史密斯既是奥布赖恩的好友，也是他的偶像，他在美国一手创立了基督教民族主义圣战组织，而我们也打算有样学样，建立爱尔兰的本土版本，以彻底根除奥布赖恩口中所说的阻碍爱尔兰及其人民建功立业、虔心向神的“犹太布尔什维克”威胁。基督教民族主义圣战组织作为政府的新机构，将维护爱尔兰的基督教传统，密切留意以犹代基的有组织运动的迹象，对抗“杂交”等强迫黑白融合的行为，确保史密斯宣称的“锡安影子政府”及其长老、移民、工团分子无法染指我们心爱的翡翠海岸。"
 IRE_Build_Legitimacy: "确立奥布赖恩的合法性"
 IRE_Build_Legitimacy_desc: "至高王、托蒙德伯爵默罗·奥布赖恩虽自诩紫血贵族，但王国的臣民们并不接受这一“事实”，批评与指责之声不绝于耳。伪王的新王国若想长久，那他手下的有机政府就必须加班加点，提高奥布赖恩的宣称效力，增强他在群众眼中的合法性，用尽一切手段完成这一光荣而必要的任务。通过大肆宣传奥布赖恩与前至高王布赖恩·博鲁、已经消亡的托蒙德伯国及其古老成员（如默罗一世）的关系，再加上黑色军团的“软硬兼施”，奥布赖恩定不会重蹈[IREGetFormerKing]的覆辙，成为公认的爱尔兰至高王。"
 IRE_Thormond_Redeemed: "整合主义爱尔兰的新黎明"
 IRE_Thormond_Redeemed_desc: "虽然天主教的影响已经深深渗入了爱尔兰的每一寸土地，但直到今天之前，爱尔兰从未像伊比利亚和法国那样出现整合主义的萌芽。在爱尔兰君主制协会和雷蒙德·奥布赖恩的领导下，我们会在纯净的天主教爱尔兰中建立起融合了莫拉斯主义和卢西塔尼亚整合主义，并辅以美国的基督教民族主义和爱尔兰自身的盖尔文艺复兴特点的有机君主制，创造出史无前例的分权和专制相结合的独特体制，而这一由部族体系、法团主义经济、迅猛发展的行会系统、爱尔兰民族主义、反社反资、天主教会激进拥趸的极端教义所支撑起来的君主制定会为爱尔兰的每一位虔诚儿女带来繁荣！"
 ire_monarch.10.k:0 "我要用带托蒙德家徽的三色旗"
 ire_monarch.28.t:0 "奥布赖恩的“贵族”血统"
 ire_monarch.28.d:0 "为了安抚公众的抵触情绪，提高雷蒙德·奥布赖恩的爱尔兰至高王宣称的合法性，爱尔兰君主制协会发表了一份公开声明，其中详细罗列了国王的家族世系。根据该文件的说法，雷蒙德与托蒙德的名门奥布赖恩家族息息相关，该家族是爱尔兰的千古一帝布赖恩·博鲁的奥布赖恩家族的分家，初代家主是默罗·奥布赖恩。然而，文件中并没有写明他和这一源远流长的家族的具体关系，而托蒙德伯爵领已经断了香火，其他奥布赖恩家族中既没人知道这位雷蒙德，家谱中也未能找到支撑他宣称的证据。不过，雷蒙德几年前去过一趟墨西哥，那里的司法系统倒是承认他是真正的托蒙德伯爵。雷蒙德和政府是对他自己的王室血统深信不疑的，他本人还对外宣称世界上的绝大部分君主制国家和共和国都承认了他的宣称，然而截至目前，没有一国有任何实质性的表示，甚至雷蒙德提到的许多国家其实早就已经从世界地图上消失了。此外，雷蒙德对他人的质问和怀疑总是闪烁其词，顾左右而言他，最近，有记者拿着份伪造文件——上面指认雷蒙德只是名精神失常玩过家家的臭要饭的——前来求证时，雷蒙德直接一溜烟跑走了。无论真相为何，都无法改变现状，这个男人——不管他是谁，他的真实身份又是什么——就是爱尔兰的至高王，而他将成为我们整合主义新时代的先锋使者。"
 ire_monarch.28.a:0 "要什么出处，信我就对了！"
 ire_monarch.29.t:0 "爱尔兰整合主义的性质"
 ire_monarch.29.d:0 "正当爱尔兰君主制协会在雷蒙德·奥布赖恩的领导下如火如荼地推进整合主义改革之时，一个问题不可避免地出现了：我们到底要采用何种形式的整合主义？是法国的莫拉斯思想，还是葡萄牙的卢西塔尼亚整合主义？这两种思想有着许多共性，比如国家工团主义、权力下放式的威权主义、基督教至上与天主教社会教导、民族主义、非保守的传统主义、阶级合作、法团主义经济体制等，但在一些细枝末节之处也存在着不同，而这些差异会决定我们在之后的外交中是亲近里斯本还是阿尔及尔。此外，我们还可以折中一下，走出我们自己的中道之路，不依赖与爱尔兰国情格格不入的异乡人的陈词滥调，以部族体制、海岛天主教会和盖尔民族主义构建真正的整合主义乌托邦。那么我们要选择哪一条道路呢？"
 ire_monarch.29.a:0 "倾向于葡萄牙的卢西塔尼亚整合主义"
 ire_monarch.29.b:0 "倾向于法国的莫拉斯整合主义"
 ire_monarch.29.c:0 "注重传统，在二者间寻得妥协平衡"
 IRE_10_point_plan: "“十点”计划"
 IRE_10_point_plan_desc: "新芬党已经决定支持利亚姆·梅洛斯，并实施他的“十点计划”。他的计划中概述了将主要产业和交通运输系统国有化、收缴大型牧场与地产、建立工作环境管控、扩大公众服务、废除房屋出租制并实行住房分配、为失业者提供救济等措施。此外，还提议为工人提供普遍性武装。"
 ire.530.t:0 "詹姆斯·康诺利的阴影"
 ire.530.d:0 "在参与了复活节起义、为爱尔兰独立而斗争的众多团体中，出力最多的当属爱尔兰公民军和爱尔兰工党了。可讽刺的是，艰难时期铁板一块，影响力一骑绝尘的工党却在爱尔兰获得独立不久即因内斗而解体了。而更讽刺的是，最终将爱尔兰从枷锁中解放出来的英国大革命却为这座翡翠岛上的社会主义宣判了死刑，因为人们发现新生的红色政权不列颠联盟和前王党政府是一丘之貉，英国残存的影响力使得爱尔兰民众视社会主义为英国压迫的另一种工具，而主打红色理想的工党也因此成了过街老鼠，支持率一落千丈。在柯林斯政府看来，社会主义的爱尔兰定会沦为英国的傀儡，于是他们把康诺利和爱尔兰公民军在复活节起义和爱尔兰独立斗争中的贡献一并雪藏了。\n\n康诺利赴死后，党内新崛起的两大巨头詹姆斯·拉金和威廉·X·奥布赖恩之间矛盾重重，特别是在新近成立的不列颠联盟一事上更是水火不容。拉金与不列颠联盟是你侬我侬，他的每一步背后都有不列颠联盟的支持。拉金与不列颠赤党的联合到底是出于务实精神，还是真的与伦敦有染谁也不好说，因为爱尔兰的社会主义者们虽然与伦敦有所牵连，但他们同时也支持爱尔兰民族主义，反对英国（只不过现在他们反的是加拿大的王党）。奥布赖恩则完全与拉金相反，坚决反对不列颠联盟，拒绝他们给予的一切援助和救济，在他看来，新的工团政府无非是换了身好看皮囊的联合王国的延续。\n\n由于党内在不列颠联盟的问题上一直举棋不定，詹姆斯·拉金直接带着一大批党员出走，新成立了爱尔兰工人联盟，工党自此解体。拉金的自立门户分走了工党的大部分选票，也带走了支持拉金的群众根基，工党不可避免地滑向了衰落的深渊。此后，包括托马斯·约翰逊、威廉·诺顿在内的一部分颇具影响力的核心成员转投新芬党，这也导致新芬党后来转向了左翼。刚刚在上届选举中耻辱性大败的新芬党此时正处于最低谷，离解散只有一步之遥，而工党这些外来人员的加入却意外成了新芬党的救命良药。在工党出局的当下，爱尔兰的左翼成了复兴的新芬党和拉金的半合法化的爱尔兰工人联盟分庭抗礼的局面，而后者身后则是不列颠联盟的倾力支持。"
 ire.530.a:0 "爱尔兰的社会主义？终逃不过柯林斯的锐眼！"
 ire.3151.t:0 "恢复总理职位"
 ire.3151.d:0 "爱尔兰社会主义共和国成立后，国家权力向总统集中，总理的职位被撤销。虽然总理在大多数情况下只是总统的副手，但它在革命之前的爱尔兰政府中的地位却举足轻重。像拉金这样的集权派倒是很乐意继续扩大总统的权力，不过经威廉·X·奥布赖恩重组后的工党却坚决反对行政权力的过度膨胀，还向议会提交了多份限制总统权力的议案。奥布赖恩也紧跟他们的步伐，正式宣布恢复在爱尔兰社会主义革命中被错误废除的总理职位。\n\n虽然总理是恢复了，但党内对其所承担的职责依旧有所分歧。工党的一些成员提出应将总统变成一个完全象征性的角色，将国政大权交予总理，由奥布赖恩担任实权国家元首，再另找一人担任虚职元首。不过，其他人则认为单单将总理恢复成原来的政府高层角色就可以了。\n\n虽然总理一职的权责问题尚未尘埃落定，但在人选一事上大家都是没有任何异议的，那就是接替詹姆斯·康诺利成为工党领袖的托马斯·约翰逊。约翰逊虽曾在工党解体期间转投新芬党，但却是名工党死忠，奥布赖恩和全党都相信他会在新的岗位上兢兢业业，为爱尔兰效力。"
 ire.3151.a:0 "国政大权应由总理执掌"
 ire.3151.b:0 "总理应充当总统的副手角色"
 ire.318.e:0 "党需要回到其左翼爱尔兰民族主义的根源上去"
 ire.3183.t:0 "梅洛斯的十点计划"
 ire.3183.d:0 "新芬党高层成员利亚姆·梅洛斯议员向众议院呈递了十点计划。根据梅洛斯自己的说法，十点计划会将爱尔兰的工人纳入共和国的保障体系之中，并巩固新芬党在人民群众心目中的左翼政党形象。这份计划包含的措施有国有化主要产业和交通运输系统、收缴大型牧场与地产、建立工作环境管控、扩大公众服务、废除房屋出租制并实行住房分配、为失业者提供救济、为工人提供普遍性武装等。\n\n虽然梅洛斯的计划受到了新芬党内左翼的拥护，但众议院还是以其有工团主义之嫌为由将其否决掉了。梅洛斯及其支持者则否认了这一指控，称自己既不信马克思主义也不信工团主义，只是一介爱尔兰爱国者罢了。梅洛斯的这一计划充满了争议，而至于最后要不要执行，还得看首席部长的意思。那么，我们是要推行梅洛斯的计划呢，还是因其与工团主义太过相像，大众接受不能而将之束之高阁呢？"
 ire.3183.a:0 "我听着咋那么像工团主义呢……"
 ire.3183.b:0 "这提议太棒了！马上执行"
 ire.3183.c:0 "为表诚意，命梅洛斯担任总理！"
 IRE_Randal_to_Somhairle: "§Y兰德尔·麦克唐奈§!将被称作§Y索瓦尔勒一世§!"
 IRE_Randal_to_James: "§Y兰德尔·麦克唐奈§!将被称作§Y詹姆斯四世§!"
 ire.372.t:0 "一位具有文化重要地位的总理？"
 ire.372.d:0 "威廉·巴特勒·叶芝是爱尔兰最伟大的诗人和文化人物之一，也是我们早期独立运动的英雄和爱尔兰右翼民族主义者的象征。他曾是爱尔兰共和兄弟会的成员、诺贝尔奖获得者、其他右翼艺术家（如美籍英国人埃兹拉·庞德）忠实而受人尊敬的导师、准军事组织蓝衫军众多进行曲的作曲者，并自称是世界各地，特别是爱尔兰境内的专制、非民主和民族主义运动及政权（叶芝尤其器重C·H·道格拉斯的右翼社会信用运动，而他的爱人、女神、革命同僚莫德·冈尼则支持左翼的社会信用运动）的粉丝，毫无疑问，叶芝对我们的政权那叫一个极尽忠诚和无私奉献。他的诗歌（如《1916年复活节》和《基督再临》）深受全国人民的喜爱，而他又是我们运动的活跃领导成员，因此许多人认为其影响力可以为我所用。我们完全可以把这位下笔如有神的大师提拔为爱尔兰的桂冠诗人，但鉴于他在群众中的广泛知名度和影响力，以及他对党和我们的爱尔兰民族主义的忠诚度，也许他在政府内部会发挥更大的作用。"
 ire.372.a:0 "给他颁奖，并让他登上总理宝座"
 ire.372.b:0 "给他颁奖，并让他在政府中占有一席之地"
 ire.372.c:0 "他将成为我们的桂冠诗人，仅此而已"
 ire.373.t:0 "一位具有文化重要地位的总理？"
 ire.373.d:0 "詹姆斯·乔伊斯是爱尔兰最伟大的诗人和文化人物之一，同时也是我们早期独立运动的英雄和爱尔兰左翼民族主义者的象征。作为一个虔诚的盖尔民族主义者、无政府主义者、农业社会主义者以及前卫派艺术家和哲学家，毫无疑问，乔伊斯对我们的政权那叫一个忠心耿耿、全力以赴。他的诗歌和文学作品（如《尤利西斯》和《芬尼根守灵夜》）深受全国人民的喜爱，而他又是我们运动的活跃领导成员，因此许多人认为其影响力可以为我所用。我们完全可以把这位下笔如有神的大师提拔为爱尔兰的桂冠诗人，但鉴于他在群众中的广泛知名度和影响力，以及他对党和我们的爱尔兰民族主义的忠诚度，也许他在政府内部会发挥更大的作用。"
 ire.373.a:0 "给他颁奖，并让他登上总理宝座"
 ire.373.b:0 "给他颁奖，并让他在政府中占有一席之地"
 ire.373.c:0 "他将成为我们的桂冠诗人，仅此而已"
 GBP_ENG_REPUBLIC:0 "英格兰共和国"
