 irelandflavour.396.d4: "在海对岸的中欧，传说中凯尔特人的起源之地，著名的奥地利语言学家、凯尔特人学家和亲爱人士尤利乌斯·波科尔尼近来出版了他的崭新著作，讲述了凯尔特人和伊利里亚人的史前史。早在盖尔复兴运动如火如荼之时，爱尔兰人便对他们长期以来被压制的语言与文化产生了自豪感，而主要出身于德国的凯尔特学家们，如波科尔尼和已故的库诺·迈耶，他们重新发现了古老的凯尔特文学，并大力宣传其对欧洲文明的重要性，他们对此方面的贡献已无法用言语衡量，亦成了条顿-爱尔兰两族关系中的一段美妙插曲。\n\n爱尔兰与日耳曼世界的联系可以追溯到爱尔兰因其知识和基督教信仰而备受称赞的时代，那时，爱尔兰僧侣在今天德奥两国的土地上建立了修道院。在后来的几个世纪里，英国人逐步加强了对爱尔兰岛的控制，许多爱尔兰人也因此远遁国外，虽然爱尔兰人在鲁尔地区的工业化中作出了一定贡献，但在德意志民族的土地上，没有哪个国家能像奥地利一般接收如此多的移民，爱尔兰人也在当地的军事与政治中扮演了重要角色，曾有一百多名奥地利将军、陆军元帅或海军上将出身于爱尔兰人家庭。其中最著名的莫过于那位在1853年从匈牙利刺客手中拯救了弗朗茨·约瑟夫的马克西米利安·奥唐奈。\n\n维也纳的大国梦既已分崩离析、不复存在，其国家亦被柏林合并，在普通盖尔人的心目中，奥地利相较于柏林已显得黯然失色，柏林方面既与我们更为亲密，也是更为强大的反英盟友，更是爱尔兰移民到欧洲大陆的主要目的地，但很多人仍对哈布斯堡王朝抱有敬意，毕竟它的双元君主制曾几何时也是新芬党效仿的典范。身为一名德意志民族主义者，波科尔尼对统一也表示欢迎，在爱尔兰血统的奥地利贵族被纳入德意志帝国的贵族阶层之中，移民德国的爱尔兰人也移居到了他们先辈寻求庇护之地后，在某种程度上，爱尔兰人民已经和它过去以及现在的朋友们重归于好了。"
 irelandflavour.396.a: "我们向凯尔特祖先的发源地致敬"
 irelandflavour.397.t: "英国的盖尔运动会"
 irelandflavour.397.d: "自盖尔运动协会中央委员会为了管理在英爱裔侨民的赛事而计划在英国建立地方委员会已有些年月了，但两国间势如水火的关系让该设想无异于空中楼阁。\n\n爱尔兰加入第三国际已一年有余，英爱关系有了长足改善。在过去的几个月中，盖尔运动协会英国委员会逐渐挂牌落成，先前的计划得以圆满。今天早些时候，运动协会主席宣布成立新的地方委员会，同时还明确表示协会在英国促进爱尔兰文化重生的计划才方兴未艾。\n\n虽然目前只有伦敦和兰开夏两郡的协会加入了草创未就的英国盖尔运动协会，但已经有人在讨论如何在给英国设立恰当的郡界的同时，量体裁衣地将沃里克郡、约克郡、格洛斯特郡纳入盖尔运动协会了。爱尔兰为促进英国赛事的发展而有所行动，今年的年会最终废止了禁止全体英国安全部队成员加入盖尔运动协会这一过时的第21条规则。\n\n爱尔兰肯定还会是赛事的主场与核心，不过，还是有很多人希望英国能在几十年内彻底成为盖尔运动协会内举足轻重的一部分，届时两国队伍也能够龙争虎斗、一较高下。"
 irelandflavour.397.a: "我们要在十年内让爱尔兰式曲棍球成为奥运项目！"
 irelandflavour.399.t: "费边君子"
 irelandflavour.399.d: "过去的几十年里，文艺界的变化可谓天翻地覆，浪漫主义先后让位于现实主义和现代主义，革故鼎新之余，变革之脚步却从未停息。作家们以各自的方式踏上了这一快车道，而在众多大家之中，乔治·萧伯纳的独特创作风格则让人们为其专门创造了一个同名新词“萧风”。\n\n1856年，萧伯纳出生于都柏林的一处英爱新教徒家庭，通常来说，这样的出身就已经注定了一生的荣华富贵，但很可惜，他摊上了一位嗜酒如命的父亲，一家人的生活也因此过得相当拮据。十九岁时，父母离异，萧伯纳随母亲来到了伦敦，翻开了全新的生活篇章，并开始创作小说、戏剧、乐评、报刊专栏，还加入了后来的费边社，以笔论政。\n\n往后几十年中，萧伯纳的写作风格和政治观点不断变化，后者从一开始的马克思主义转向了费边主义，然后又到了直言不讳却又难以自圆其说的自编社会主义论。萧伯纳于不同时期曾分别批评过疫苗接种、有组织宗教和反犹主义，还支持素食主义、不列颠联盟中的准则派，以及迈克尔·柯林斯之作为。\n\n萧伯纳一直笔耕不缀，其职业生涯始于英，也在于英，是不列颠联盟知识分子阶层中最出名的亲爱尔兰人士。对于爱尔兰问题，萧伯纳原本是名温和的自治派，不过，1916年的起义改变了这一观点，而之后的英国大革命则又改变了其渐进式的社会主义思想。虽然只偶尔往来爱尔兰，但萧伯纳同W·B·叶芝、肖恩·奥凯西等与爱尔兰民族主义运动关系密切的同行之间互相评价很高，也保持着频繁的工作往来。\n\n前些年，萧伯纳特立独行的观点，以及其长居英国的事实一并遭到了媒体和政界的口诛笔伐。不过，时间的推移，再加上一尊光鲜亮丽的诺贝尔奖，让包括政治对手在内的众人均对其大为改观。萧伯纳仍旧是一位怀着赤诚之心的爱尔兰之子，而其作品也总是令人翘首以盼，从不缺乏讨论度。"
 irelandflavour.399.a: "人挺奇怪，编故事倒挺在行"
 irelandflavour.399.b: "不还是个恶心的西部英国佬么……"
 irelandflavour.399.c: "真乃远见卓识之人！"
 irelandflavour.3910.t1: "绿、白、橙"
 irelandflavour.3910.t2: "星光之犁"
 irelandflavour.3910.d1: "1848年，爱尔兰共和派、后来的蒙大拿州州长托马斯·弗朗西斯·马尔于沃特福德市首次悬挂出了今日爱尔兰的国旗——三色旗。当时，法国正处于革命的漩涡之中，对爱尔兰民族主义事业怀有恻隐之心的一群法国妇女亲手缝制了这面旗帜。\n\n马尔以法国的三色旗为蓝本，继而赋予这面旗帜的象征意义，千百年来从未改变：绿色代表着盖尔传统和罗马天主教，橙色代表着追随奥兰治的威廉（1690年博因河战役的胜利者，这场战役奠定了新教的地位）的新教徒，白色则代表着对两大教派之间和平和团结的永恒憧憬。此外，三色还与共和、自由和革命的理想息息相关。\n\n自三色旗诞生起将近八十年，公众对这一旗帜虽不陌生，但也谈不上重视，直到1916年于邮政总局上空升起后，它的地位才迅速提升。也是从那时起，它成为了爱尔兰共和主义的象征，进而演化为了整个爱尔兰的象征。\n\n针对这面旗帜也不是没有批评之声。有人会说，在共和国的国旗上专门留出一地给那些不愿与爱尔兰为伍的亲英新教徒，实属自作多情，而那些激进的民族主义者们则不满于人数只占六分之一的外人能在国旗上得到三分之一的空间。不过，对于包括政府在内的大多数来说，三色旗这一爱尔兰的象征是为数不多能够引起这片土地上几乎所有人共鸣的政治符号之一。"
 irelandflavour.3910.d2: "正如爱尔兰曾经的象征——竖琴被三色所取代那般，那面带有宗教韵味的老旧旗帜也让位于了一面能够真正团结爱尔兰人民的旗帜——星犁旗。在都柏林大罢工的数月后，爱尔兰公民军设计出了这面旗帜的雏形：一把以锋刃为首的金犁跃然于绿色的底蕴之上，七颗闪亮的银星排列成了大熊座中最亮的北斗七星。\n\n复活节起义期间，爱尔兰公民军于都柏林的帝国酒店首次打出了星犁旗。英军占领城市后，这面旗帜并没有同下面的建筑一起化为灰烬，而是被英军士兵T·A·威廉姆斯当作战利品保存了下来，后者于第二次爱尔兰革命后又将其转交给了爱尔兰政府，以作为两国重归于好的见证，而如今，这面旗帜正静静地待在国家博物馆中供人瞻仰。\n\n英国大革命爆发后，爱尔兰的工团主义者惨遭新芬党挺条约派和反条约派两方的资产阶级民族主义者的背叛，而为了有朝一日能够推翻假惺惺打着爱尔兰共和主义之旗的伪君子、实现爱尔兰革命的真正理想，他们聚在了一起，重组了爱尔兰公民军，并依据公民军老兵的回忆，重新设计了星犁旗，简化了设计，把底色改为了蓝色。如今，工团主义之梦已成为了现实，而旗帜的样式虽变了个样，但詹姆斯·康诺利所赋予其的精神内核始终如一：一个自由挺立、把从田野到星空的每一片天空以及每一寸土地都牢牢握在自己手中的爱尔兰。"
 irelandflavour.3910.a: "而它亦将永远高扬！"
 irelandflavour.3910.b: "三色旗能长存于世，实乃我国之福"
 irelandflavour.3910.c: "星犁之旗必将高飞于星空之上！"
 irelandflavour.3911.t: "圣经"
 irelandflavour.3911.d: "在国家为重振盖尔语的历史地位而不懈努力的过程中，翻译圣经成了民族委员会以及我们这个基督教国家的一大难题。爱尔兰人民固然有着坚定的基督教信仰，但历史上爱尔兰语版本的圣经译本却寥寥无几，而近百年来的唯一一本译本是爱尔兰新教教会翻译的比德尔-奥唐奈版本，不过，这一译本在天主教会中有着“异端圣经”的蔑称。尽管争议缠身，但若政府愿意顶着天主教会的反对承认这版圣经，那反而能对外展现出我国的宗教团结。\n\n如若实在不愿触怒天主教会和天主教徒的话，我们还可以以皮达尔·乌莱里的未公开手稿为准，这位讲爱尔兰语的天主教牧师把整个暮年都投入到了圣经的芒斯特爱尔兰语翻译工作之中。还不行的话，也可以委任翻译家兼盖尔联盟主管埃尔南·德·希温塔把圣经重新翻译成现代爱尔兰语，并将其视为面向所有基督教教派的官方译本，以此来避免引燃教派冲突、失去爱尔兰民族复兴的潜在支持者。"
 irelandflavour.3911.a: "虽然信仰相异，但我们敬重比德尔和奥唐奈的成果"
 irelandflavour.3911.b: "天主教的圣经才是最正宗的，以乌莱里的手稿为准"
 irelandflavour.3911.c: "翻译需要与时俱进，让希温塔来吧"
 irelandflavour.3912.t: "奥弗莱厄蒂家的两兄弟"
 irelandflavour.3912.d1: "爱尔兰工人联盟旗下的报纸《工人共和国》虽早在二十年代便被当局以激进、煽动为名封禁，但其始终具有一定规模的地下读者群。读者们通过这份报纸，接触，或者说重新接触到了爱尔兰最为杰出的社会主义作家——汤姆·奥弗莱厄蒂和利亚姆·奥弗莱厄蒂两兄弟。\n\n汤姆生于爱尔兰西海岸的阿伦群岛，早年在家乡度过，1912年远赴美国，开启了记者生涯，而原本以牧师为志向的弟弟利亚姆则于1908年踏上了爱尔兰本岛，并于其后逐步发展为了爱尔兰志愿军中的一名极端分子。\n\n世界大战爆发后，汤姆于波士顿、纽约奔波，组织爱尔兰劳工们加入远离战火硝烟的世界产业工人联盟。与之相反，利亚姆视这场战争为契机，他清楚，爱尔兰人要想打破英国的枷锁，需要的正是军事经验，因此，他化名入伍，加入了压迫者的军队。战争结束后，利亚姆回到了家乡，虽身体上满身伤痕、精神上饱受折磨，但当听闻爱尔兰独立战争和法国无产阶级革命的消息后，他的心中还是涌起了一股由衷的自豪。美国无产阶级的苦难触动了汤姆，而战争的恐怖也把利亚姆锻造成了一名坚定的社会主义者。最初，两人以新芬党的追随者自居，而如今，两人已是罗迪·康诺利的爱尔兰工人联盟的缔造者。\n\n1920年，兄弟二人在波士顿重逢，并双双迷上了写作。汤姆早前就已接触过无产阶级文学，而利亚姆之所以为打字机所吸引，是因为其可以帮助他疗愈战争的创伤、记录一路以来的见闻。利亚姆虽起步较晚，但不久便崭露头角，其作品充满了象征、隐喻和讽刺元素，而汤姆的文字则以1934年的归国为分水岭，之前是朴实无华的政治语言，之后是对田园生活的细腻观察。汤姆仅发表了寥寥数篇作品便于1936年过世，而其未竟之业，包括写作和世界革命，都由利亚姆全盘继承。"
