 IRE_ISRA:0 "改进安全规章"
 IRE_ISRA_desc:0 "事故、职业病和其他的安全问题已经在爱尔兰的工厂中变成一个广泛存在的严峻问题。由于我们现在欠缺安全规章制度，工人们对现有的安全问题产生了高度的关注，并且出现转向工团主义的趋势。我们承认所有工人都不应该在危险的环境中工作，现在是时候作出改变了。"
 IRE_SAFETY_REFORMS:0 "安全改革"
 IRE_SAFETY_REFORMS_desc:0 "最近，我们的安全改革取得了很大的成功。爱尔兰的工厂以前工作环境有着各种各样的危险，事故非常常见。现在，在安全规章制度下，受伤或生病的工人数量得以减少，我们工厂生产力将会因此提高。"
 IRE_AIWW:0 "工厂里的爱尔兰妇女"
 IRE_AIWW_desc:0 "爱尔兰过去是一直被天主教会把持的保守的国家。然而，在爱尔兰共和以及民族主义运动影响下，大众的观念开始发生了变化。人们开始要求妇女从家中的解放出来，使妇女获得独立。如果鼓励雇主雇佣更多的妇女，将会减少我们男性人口的压力。"
 IRE_WOMEN_INDUSTRY:0 "劳动妇女"
 IRE_WOMEN_INDUSTRY_desc:0 "通过鼓励妇女勇敢自信地摆脱家庭主妇的传统角色，我国的工业实力有了显著提升。"
 IRE_WIAR:0 "国家税收改革"
 IRE_WIAR_desc:0 "随着我国经济的快速发展，现在我们需要开始处理税收法的问题了。一个现代的税收计划将使政府有更好的经济自由，来为我们国家的发展作出决策。当然，这样庞大的计划需要仔细考虑，我们并不想让爱尔兰人身上背负过于承重的税收。"
 ire.taxreform.tt:0 "增加§Y税收§!以扩大政府的财政自由。\n\n"
 ire.123.t:0 "爱尔兰国家税收改革"
 ire.123.d:0 "随着爱尔兰经济进步法的通过以及紧随其后的爱尔兰经济和工业革命，爱尔兰已经逐渐成长为一个繁荣的国家。但是，随着日益繁荣的发展，爱尔兰税收制度已经开始显得落后起来。目前，这些人纳税数额极低，使得政府在财政方面留下了一定可以被填补的空缺。因此，政府决定提高国家税率。当然，高税率会提供政府迫切需要的经济自由，但同样也会带来可能的社会问题。"
 ire.123.a:0 "在这个问题上我们需要理智。轻微加税"
 ire.123.b:0 "人们必须回报政府，中等加税"
 ire.123.c:0 "我们需要很多钱来继续我们发展。怎么多怎么来！"
 IRE_TAX_REFORM1:0 "低税收"
 IRE_TAX_REFORM1_desc:0 "爱尔兰政府最近向人民增加了赋税，但是增加的量不大。"
 IRE_TAX_REFORM2:0 "中税收"
 IRE_TAX_REFORM2_desc:0 "爱尔兰政府最近完成了一次税收改革，这能增加国家经济的弹性。"
 IRE_TAX_REFORM3:0 "高税收"
 IRE_TAX_REFORM3_desc:0 "爱尔兰政府近日通过重大税制改革法案，极大的增加了政府向市民的税收。虽然这会引起一些社会矛盾，但是其经济效益不容忽视。"
 IRE_FMC:0 "海外开发协议"
 IRE_FMC_desc:0 "爱尔兰仅有少量的自然资源，并且这些资源很少能用于军事生产。外面的世界如此之大，理论上爱尔兰可以在友好国家的殖民地上建立资源产业来获取稀有资源为国内工业助力，并获取丰厚的利润。"
 ire.fmc.tt:0 "接洽外国势力，讨论在他们的土地上建立§Y资源项目§!。\n\n"
 ire.114.t:0 "爱尔兰海外企业"
 ire.114.d:0 "爱尔兰政府内部达成了普遍共识：至少就目前而言，爱尔兰已经达到了自然资源开发的极限。虽然爱尔兰的翠绿土地之下可能还潜藏着更多尚待发现的财富。然而海外有着更广阔的土地，以及更多可供开采的宝贵资源。爱尔兰的经济规划专家已经起草了一份拥有宝贵资源的国家名单，上面罗列有四个国家，如果条件允许，爱尔兰企业便可利用这些资源进行收效可观的海外投资。德意志帝国的殖民地摩洛哥据说盛产铁矿，能使我国钢铁产业飞速发展。荷属东印度群岛蕴藏着丰富的橡胶和石油，而南非则拥有大量价值不菲的铬矿。最后，充满异国情调的美洲国家巴西有大量尚待开发的钨矿。我们应该选择其中的一个国家，与其发展外交关系，请求对方允许我们在他们的领土上开办企业，并以利润分红作为交换。"
 ire.114.a:0 "德国"
 ire.114.b:0 "荷兰"
 ire.114.c:0 "巴西"
 ire.114.e:0 "南非"
 ire.115.t:0 "爱尔兰-德国商业合作？"
 ire.115.d:0 "我们接洽了一名来自爱尔兰政府的代表。显然，爱尔兰人正意图追赶文明世界的其他国家，并有意在我们殖民地之一的摩洛哥开设一家海外工业分公司。爱尔兰人对摩洛哥的天然矿藏饶有兴趣，而我们目前还没有多余的精力来开发这些矿产。爱尔兰人承诺向我们分红部分利润，以换取将资源出口回国的权利。"
 ire.115.a:0 "划算的交易，我们同意"
 ire.115.b:0 "他们只配烂在落后的小岛上，这矿我们自己采"
 ire.116.t:0 "德国人的回复"
 ire.116.d:0 "德国方面对我们的提议作出了积极的答复，并正式向爱尔兰海外代表团发出了前往摩洛哥的邀请。现在，我们可以开始计划下一阶段的行动了。在这样一片陌生的土地上开展业务绝非易事，但爱尔兰人乃是坚韧不拔、勇于探索的民族。我们定会取得成功。"
 ire.116.d2:0 "德国方面对我们的提议作出了答复，可惜竟是婉拒。虽然官方没有给出解释，但明眼人都能看得出来，比起被我们分利，他们更想将摩洛哥的所有资源据为己有。"
 ire.116.a:0 "小伙子们，去摩洛哥喽！"
 ire.116.b:0 "那就去他妈的吧"
 ire.117.t:0 "爱尔兰-荷兰商业合作？"
 ire.117.d:0 "我们接洽了一名来自爱尔兰政府的代表。显然，爱尔兰人正意图追赶文明世界的其他国家，并有意在我们殖民地之一的荷属东印度的苏门答腊开设一家海外工业分公司。爱尔兰人对苏门答腊的石油和橡胶饶有兴趣。爱尔兰人承诺向我们分红部分利润，以换取将资源出口回国的权利。"
 ire.117.a:0 "那儿地方足够，也省了我们的麻烦，何乐而不为？"
 ire.117.b:0 "荷兰的资源只能为荷兰人所用"
 ire.118.t:0 "荷兰人的回复"
 ire.118.d:0 "荷兰方面对我们的提议作出了积极的答复，并正式向爱尔兰海外代表团发出了前往苏门答腊的邀请。现在，我们可以开始计划下一阶段的行动了。在这样一片陌生的土地上开展业务绝非易事，但爱尔兰人乃是坚韧不拔、勇于探索的民族。我们定会取得成功。"
 ire.118.d2:0 "荷兰方面对我们的提议作出了答复，但可惜的是，他们选择了拒绝。虽然官方没有给出解释，但明眼人都能看得出来，比起被我们分利，他们更想将苏门答腊的所有资源据为己有。"
 ire.118.a:0 "小伙子们，去苏门答腊喽！"
 ire.118.b:0 "那就去他妈的吧"
 ire.119.t:0 "爱尔兰-巴西商业合作？"
 ire.119.d:0 "我们接洽了一名来自爱尔兰政府的代表。显然，爱尔兰人正意图追赶文明世界的其他国家，并有意在我国开设一家海外工业分公司。爱尔兰人把目光放在了有大量待开发钨矿的东北地区。爱尔兰人承诺向我们分红部分利润，以换取将资源出口回国的权利。"
 ire.119.a:0 "爱尔兰人看着像是可靠的贸易伙伴，这将有利于我国的发展"
 ire.119.b:0 "爱尔兰佬想踏上巴西领土？不了谢谢"
 ire.120.t:0 "巴西人的回复"
 ire.120.d:0 "巴西方面对我们的提议作出了积极的答复，并正式向爱尔兰海外代表团发出了前往巴西东北的邀请。现在，我们可以开始计划下一阶段的行动了。在这样一片陌生的土地上开展业务绝非易事，但爱尔兰人乃是坚韧不拔、勇于探索的民族。我们定会取得成功。"
 ire.120.d2:0 "巴西方面对我们的提议作出了答复，但可惜的是，他们选择了拒绝。虽然官方没有给出解释，但明眼人都能看得出来，比起被我们分利，他们更想将巴西东北的所有资源据为己有。"
 ire.120.a:0 "小伙子们，去巴西东北喽！"
 ire.120.b:0 "那就去他妈的吧"
 ire.121.t:0 "爱尔兰-南非商业合作？"
 ire.121.d:0 "我们接洽了一名来自爱尔兰政府的代表。显然，爱尔兰人正意图追赶文明世界的其他国家，并有意在我国开设一家海外工业分公司。爱尔兰人把目光放在了盛产铬矿的罗得西亚地区。虽然我们已经在那里有了开采项目，但还有进一步扩大的余地。爱尔兰人承诺向我们分红部分利润，以换取将资源出口回国的权利。"
 ire.121.a:0 "能赚钱就是好事，邀请他们"
 ire.121.b:0 "让其他国家富裕起来可不是我们的任务"
 ire.122.t:0 "南非人的回复"
 ire.122.d:0 "南非方面对我们的提议作出了积极的答复，并正式向爱尔兰海外代表团发出了前往罗得西亚的邀请。现在，我们可以开始计划下一阶段的行动了。在这样一片陌生的土地上开展业务绝非易事，但爱尔兰人乃是坚韧不拔、勇于探索的民族。我们定会取得成功。"
 ire.122.d2:0 "南非方面对我们的提议作出了答复，但可惜的是，他们选择了拒绝。虽然官方没有给出解释，但明眼人都能看得出来，比起被我们分利，他们更想将罗得西亚的所有资源据为己有。"
 ire.122.a:0 "小伙子们，去罗得西亚喽！"
 ire.122.b:0 "那就去他妈的吧"
 ire.124.t:0 "海外大创业开始"
 ire.124.d:0 "在德国同意了他们的提议之后，爱尔兰政府立刻着手成立了一家正式的爱尔兰非洲贸易公司，用不了多久，一支由经过精挑细选的冒险家、工人和实业家组成的队伍就将前往摩洛哥开办企业。这支远征队必须由名副其实的人领导，但爱尔兰在这方面却是人才寥寥，寻找人选俨然成了一大难题。经再三斟酌，政府终将候选者缩至三人……"
 ire.124.d2:0 "在荷兰同意了他们的提议之后，爱尔兰政府立刻着手成立了一家正式的爱尔兰东印度贸易公司，用不了多久，一支由经过精挑细选的冒险家、工人和实业家组成的队伍就将前往苏门答腊开办企业。这支远征队必须由名副其实的人领导，但爱尔兰在这方面却是人才寥寥，寻找人选俨然成了一大难题。经再三斟酌，政府终将候选者缩至三人……"
 ire.124.d3:0 "在巴西同意了他们的提议之后，爱尔兰政府立刻着手成立了一家正式的爱尔兰南美贸易公司，用不了多久，一支由经过精挑细选的冒险家、工人和实业家组成的队伍就将前往巴西东北开办企业。这支远征队必须由名副其实的人领导，但爱尔兰在这方面却是人才寥寥，寻找人选俨然成了一大难题。经再三斟酌，政府终将候选者缩至三人……"
 ire.124.d4:0 "在南非同意了他们的提议之后，爱尔兰政府立刻着手成立了一家正式的爱尔兰非洲贸易公司，用不了多久，一支由经过精挑细选的冒险家、工人和实业家组成的队伍就将前往罗得西亚开办企业。这支远征队必须由名副其实的人领导，但爱尔兰在这方面却是人才寥寥，寻找人选俨然成了一大难题。经再三斟酌，政府终将候选者缩至三人……"
 ire.124.a:0 "雇佣一个外国专家来领导远征队"
 ire.fmc.expert.tt:0 "比利时专家§Y卢克·佩特斯§!将会领导远征队。\n"
 ire.124.b:0 "让一位爱尔兰军官来管理远征队"
 ire.fmc.military.tt:0 "爱尔兰将军§Y肖恩·麦克约恩§!将会领导远征队。\n"
 ire.124.c:0 "酒吧里那个帕迪哪里不好了？"
 ire.fmc.idiot.tt:0 "勇敢的外行§Y帕特里克·“帕迪”·奥尼尔§!将会领导远征队。\n"
 ire.125.t:0 "佩特斯汇报我国海外投资情况"
 ire.125.luc.ger:0 "我们派往摩洛哥负责管理海外事务的比利时专家今天向我们发来汇报称，这项投资目前已经取得了巨大成功，大量的钢已经准备好定期出口回都柏林。"
 ire.125.luc.hol:0 "我们派往苏门答腊负责管理海外事务的比利时专家今天向我们发来汇报称，这项投资目前已经取得了巨大成功，大量的石油和橡胶已经准备好定期出口回都柏林。"
 ire.125.luc.bra:0 "我们派往巴西东北负责管理海外事务的比利时专家今天向我们发来汇报称，这项投资目前已经取得了巨大成功，大量的钨已经准备好定期出口回都柏林。"
 ire.125.luc.saf:0 "我们派往罗得西亚负责管理海外事务的比利时专家今天向我们发来汇报称，这项投资目前已经取得了巨大成功，大量的铬已经准备好定期出口回都柏林。"
 ire.125.a:0 "这就是比利时效率"
 ire.125.b:0 "我国企业肯定会乐于听到这一消息"
 ire.125.c:0 "我们的火炮工厂将蒸蒸日上！"
 ire.125.e:0 "太好了，这对我们的坦克制造计划大有帮助！"
 ire.126.t:0 "麦克约恩汇报我国海外投资情况"
 ire.126.sean.ger:0 "今天一早，麦克约恩将军就从摩洛哥发回了他的第一份正式报告。他在报告中称，尽管一开始遭到了当地民众的抵制，但爱尔兰的采矿作业已全面铺开，贸易公司现在可以开始定期向都柏林出口钢了。"
 ire.126.sean.hol:0 "今天一早，麦克约恩将军就从苏门答腊发回了他的第一份正式报告。他在报告中称，尽管一开始遭到了当地民众的抵制，但爱尔兰的钻探作业已全面铺开，橡胶收集工作也在有条不紊地进行，贸易公司现在可以开始定期向都柏林出口这些资源了。"
 ire.126.sean.bra:0 "今天一早，麦克约恩将军就从巴西东北发回了他的第一份正式报告。他在报告中称，尽管一开始遭到了当地民众的抵制，但爱尔兰的采矿作业已全面铺开，贸易公司现在可以开始定期向都柏林出口钨了。"
 ire.126.sean.saf:0 "今天一早，麦克约恩将军就从罗得西亚发回了他的第一份正式报告。他在报告中称，尽管一开始遭到了当地民众的抵制，但爱尔兰的采矿作业已全面铺开，贸易公司现在可以开始定期向都柏林出口铬了。"
 ire.126.a:0 "我就知道我们可以信任军人！"
 ire.126.b:0 "干杯，肖恩"
 ire.126.c:0 "它们很快就会派上用场"
 ire.126.e:0 "好消息！"
 ire.127.t:0 "奥尼尔汇报我国海外投资情况"
 ire.127.paddy.ger:0 "我们在摩洛哥任命的“专家”终于向爱尔兰政府递交了他的第一份正式报告。看得出来，我们在那里的创业历程堪称灾难，当地人对帕迪及其随行人员对待他们的方式很不满意。尽管如此，我们还是建立了一个规模不大、管理粗放的工厂，以供奥尼尔和他的手下每个月都能向都柏林出口少量的钢。"
 ire.127.paddy.hol:0 "我们在苏门答腊任命的“专家”终于向爱尔兰政府递交了他的第一份正式报告。看得出来，我们在那里的创业历程堪称灾难，当地人对帕迪及其随行人员对待他们的方式很不满意。尽管如此，我们还是建立了一个规模不大、管理粗放的工厂，以供奥尼尔和他的手下每个月都能向都柏林出口少量的石油和橡胶。"
 ire.127.paddy.bra:0 "我们在巴西东北任命的“专家”终于向爱尔兰政府递交了他的第一份正式报告。看得出来，我们在那里的创业历程堪称灾难，当地人对帕迪及其随行人员对待他们的方式很不满意。尽管如此，我们还是建立了一个规模不大、管理粗放的工厂，以供奥尼尔和他的手下每个月都能向都柏林出口少量的钨。"
 ire.127.paddy.saf:0 "我们在罗得西亚任命的“专家”终于向爱尔兰政府递交了他的第一份正式报告。看得出来，我们在那里的创业历程堪称灾难，当地人对帕迪及其随行人员对待他们的方式很不满意。尽管如此，我们还是建立了一个规模不大、管理粗放的工厂，以供奥尼尔和他的手下每个月都能向都柏林出口少量的铬。"
 ire.127.a:0 "那个提议派他去的人麻烦过来一下好吗？"
 ire.127.b:0 "总比什么都没有好，对吧……？"
 ire.127.c:0 "等他回来以后就请他测试一下我们的火炮"
 ire.127.e:0 "我们当初真该换个人选"
 IRE_SCOB:0 "钢铁之城"
 IRE_SCOB_desc:0 "钢铁是一种重要的资源。由于丰富的自然资源以及对外贸易关系，爱尔兰是少数能够稳定生产钢铁的地方之一。曾经贝尔法斯特有着相当可靠的钢铁工业，但是自1925年停战以来，大多数企业都陷入停业，并将工厂迁往都柏林。我们可以选择重建这些关闭的钢铁工厂并以此获得丰厚的利润。"
 ire.112.t:0 "贝尔法斯特钢铁工厂"
 ire.112.d:0 "贝尔法斯特的钢铁工厂已经停工多年。最近政府通过了爱尔兰经济进步法，并且决定振兴这些工厂。贝尔法斯特的钢铁企业有着极好的发展空间，这些资金将用来扩展现有的炼钢厂并且可以资助企业来雇佣更多的工人。这将为我们提供比我们先前允许投入更多的钢铁，但也会使国家债务增加许多。"
 ire.112.a:0 "加一点投资也无妨"
 ire.112.b:0 "大力资助工厂，我们需要钢铁"
 ire.112.c:0 "维持原样"
 IRE_DBR:0 "银矿矿床的发现"
 IRE_DBR_desc:0 "爱尔兰具有可能成为欧洲领先的锌生产商之一的潜力。虽然，锌对于生产重型军事设备来说用处并不是特别大，但是，锌可以用于生产各种电子设备。如果我们可以大量开采我们的锌矿，对于爱尔兰研发团队来说就是一笔重要的资产。并且，锌也可以在建立雷达站时派上用场。"
 IRE_ZINC:0 "爱尔兰炼锌厂"
 IRE_ZINC_desc:0 "最近，我们锌矿业获得了比较大的发展，这使得我们能够收获大量的锌矿，并为我们的研究团队提供有价值的电子设备开发材料。金属锌在电气设备方面的重要用途也将使我国更加高效的建设雷达站。"
 IRE_DSI:0 "扩大都柏林冶炼厂"
 IRE_DSI_desc:0 "目前，都柏林的冶炼行业的铝产量较小。如果我们给这个行业提供资金，那么我们可以大大增加铝的产量，由此可以增加我们的贸易影响力，并推动我们的行业继续发展。"
 ire.113.t:0 "都柏林的炼铝产业"
 ire.113.d:0 "在爱尔兰经济进步法迅速推进之前，都柏林拥有一个资金不足的小型炼铝厂，现在，我们可以选择注入资金来推动其发展。如果我们选择对其进行最大量投资，虽然这将像往常一样增加国债，但是，很有可能获得很好的回报。并且我们将获得一个我们国家渴求的重要资源。"
 ire.113.a:0 "给予它额外资金支持"
 ire.113.b:0 "我们马上就会用到铝。给他们所有他们需要的东西"
 ire.113.c:0 "我们在炼铝上花费已经够多了"
 IRE_QOTD:0 "现在的政治问题"
 IRE_QOTD_desc:0 "尽管已经从英国暴政下获得了自由，但爱尔兰仍然是一个分裂的国家，在公众和政治家的心中也有许多重要的未解决的问题。如果想让我们的国家成为一个真正的整体，我们必须解决这些问题。"
 IRE_UTN:0 "团结我们的国家"
 IRE_UTN_desc:0 "我们国家的一些主要的分裂因素可以通过文化改革方案加以解决。推广爱尔兰语将有助于团结我们的同胞，同时可以逐步解决天主教会所长期坚持的爱尔兰的价值观和道德观念。我们的青年可以从童子军中获得好处，并且我们的移民人口可以因此更好地融入融入我们的国家。"
 IRE_DWTC:0 "解决教会问题"
 IRE_DWTC_desc:0 "自从迈克尔·柯林斯的统治开始以来，教会的地位一直是有问题的。表面上看，爱尔兰共和国是一个世俗化的国家，但有些人质疑爱尔兰是否真的成为了一个世俗国家。现在是时候立法正式解决教会问题了，这将直接决定国家的未来。"
 ire.dwtc.tt:0 "\n这将决定爱尔兰的§Y宗教倾向§!。"
 ire.129.t:0 "教会的命运"
 ire.129.d:0 "一千多年来，爱尔兰一直是一个虔诚的天主教国家，与此同时，天主教也成为了一种保守的思想与道德模式。爱尔兰共和国立国以来一直是一个世俗化的国家，宗教将不会影响政治。教会以及其地位一直是一个潜在分裂因素。政府对于世俗共和的承诺也一直没有得到有效的实行。现在政府决定要一劳永逸地处理这个问题，并确定了教会在国家以及政治上的地位。"
 ire.129.a:0 "确认共和国的理念，爱尔兰永远是个世俗国家！"
 ire.129.b:0 "教会和国家不能分离，两者应为一体。愿主宽恕你"
 IRE_SECULAR:0 "确立世俗主义"
 IRE_SECULAR_desc:0 "政府选择正式决定爱尔兰共和国将会是一个世俗国家，教会的政治权力将会被消除，并让爱尔兰成为1925年所的承诺的国家。"
 IRE_CATHOLIC:0 "天主教至上"
 IRE_CATHOLIC_desc:0 "天主教再次被爱尔兰政府所接受，教会在政府中的地位得到了巩固，这吸引吸引了虔诚的天主教徒为国家抵御不道德和贪婪的国外势力。"
 IRE_PTIL:0 "推广爱尔兰的语言"
 IRE_PTIL_desc:0 "爱尔兰盖尔语曾经在爱尔兰广泛使用，但是，在英国统治时期盖尔语开始慢慢衰落，甚至在某些地区已经不再使用盖尔语。我们可以鼓励在全国各地使用盖尔语，这能更好地团结我们的人民并保护我们的文化遗产。"
 IRE_GAELIC:0 "官方语言盖尔语"
 IRE_GAELIC_desc:0 "爱尔兰最近在努力推广盖尔语作为国家语言，这在团结人民和缓和分裂方面取得了巨大的成就。这种语言的使用频率迅速开始接近英语，这使得爱尔兰的文化遗产能够得到保护。"
 IRE_YNGIRE:0 "爱尔兰童子军"
 IRE_YNGIRE_desc:0 "年轻的爱尔兰少年少女经常发现自己在我们的社会里无事可做，而且因为他们的父母在我们的工厂和企业里进行着长时间工作，这些少年少女经常被留在家中无人照顾。我们可以学习美国人的童子军，创建一个我们自己的组织，向我们的青年灌输爱尔兰文化和宝贵的价值观。"
 ire.130.t:0 "爱尔兰少女童子军"
 ire.130.d:0 "我们已经决定组织爱尔兰青年参加童子军，然而最初的计划是成立一个与爱尔兰童子军配对的少女童子军，但是我们在政府中的进步成员认为两者应当合并成一体，让男孩和女孩受到相同的价值观和技能教育。虽然这可能听起来迎合了自由主义者和爱尔兰众议院的左翼的思想，但保守派不会放弃坚持原来的想法。"
 ire.130.a:0 "女孩子当然应该学习和男孩一样的知识和技能"
 ire.130.b:0 "坚持原来的想法，男孩就是男孩，女孩就应该是女孩"
 IRE_YOUTHBRIGADES1:0 "青年组织"
 IRE_YOUTHBRIGADES1_desc:0 "爱尔兰的年轻男孩已经开始被组织参与进童子军，在那里他们被教授有价值的技能，并接受文化教育使自己能够融入社会。组织起来的青年可作为战时的预备役，使我们可征召的人口得以大量增加。"
 IRE_YOUTHBRIGADES2:0 "青年组织"
 IRE_YOUTHBRIGADES2_desc:0 "爱尔兰的年轻男孩与女孩两者都已经开始被组织参与进童子军，在那里他们被教授有价值的技能，并接受文化教育使自己能够融入社会。爱尔兰的年轻男孩已经开始被组织参与进童子军，在那里他们被教授有价值的技能，并在通过文化教育使他们能够融入社会。组织起来的青年可作为战时的预备役，使我们可征召的人口得以大量增加。"
 IRE_IIA:0 "增强爱尔兰-美利坚合作"
 IRE_IIA_desc:0 "我们从北美收到的难民人口大部分受到爱尔兰兄弟姐妹的热烈欢迎。但是，这么大的一群人试图在新的土地上开始新的生活一定是紧张而困难的。我们可以采取措施，使美裔爱尔兰人更好地融入社会。"
 IRE_SOU:0 "阿尔斯特的地位"
 IRE_SOU_desc:0 "自从爱尔兰获得了自由以来，阿尔斯特（北爱尔兰）问题就像一个幽灵一样笼罩在全国其他地方。该地区由于持爱尔兰统一主义（注：即回归英格兰统治）的人占多数，因而对爱尔兰政府的政策采取抵制态度，近期局势逐渐变得紧张起来。人们呼吁对阿尔斯特问题采取认真的行动，政府准备采取必要的行动来解决这个问题。"
 ire.uup.weakened.tt:0 "\n在§Y内战§!时削弱统一主义者！"
 IRE_REPRESS:0 "镇压统一主义者"
 IRE_REPRESS_desc:0 "阿尔斯特统一主义者只会成为爱尔兰人民的麻烦。他们虽然被称为爱尔兰人，但是一再表现出来想要与共和国为敌。现在是开始打击统一主义者，阻止他们组织未来可能的游行或集会的时候了。"
 IRE_RTUG:0 "增援北爱尔兰和平卫队"
 IRE_RTUG_desc:0 "由于阿尔斯特的紧张局势继续上升，在该地区显而易见需要规模更大的和平卫队。我们应该通过扩大当地的警力来更好地覆盖整个地区，来支持贝尔法斯特的治安需求。"
 ire.rtug.tt:0 "在贝尔法斯特组建§Y5§!支爱尔兰警察师。\n"
 IRE_REOCCBF:0 "重新占领贝尔法斯特"
 IRE_REOCCBF_desc:0 "统一主义者过去曾经对国家构成内战和分裂的威胁。因此，我们绝对不能让他们在任何情况下占领贝尔法斯特。它已成为我们第二大工业化城市，对敌人来说这十分重要。更不用说统一主义者可以通过港口获得有用的战略物资。因此贝尔法斯特必须被军事占领。"
 IRE_KILLUVF:0 "摧毁阿尔斯特志愿军"
 IRE_KILLUVF_desc:0 "阿尔斯特志愿军，这些所谓的“自由战士”，事实上不过是一群恐怖分子。如果阿尔斯特想继续维持和平，我们必须渗透这个组织并彻底毁灭他们。我们将追捕他们的领导人，结束他们成员的招聘工作，以此来削弱统一派运动的有生力量。"
 ire.uneg.tt:0 "\n略微缓解统一主义者的紧张局势。"
 IRE_NEGOTIATE:0 "与统一主义者谈判"
 IRE_NEGOTIATE_desc:0 "在1798年，沃尔夫·托恩的目标之一是将天主教、新教徒和异议者团结在一个爱尔兰之下，但英国人通过宗教，让爱尔兰人之间内斗，使得紧张局势持续下去。我们必须要和统一主义者进行谈判，以确保所有人都能够认同爱尔兰国家和身份。"
 ire.ulang.tt:0 "\n些许缓解统一主义者的紧张局势。"
 IRE_RECUS:0 "认同阿尔斯特苏格兰人"
 IRE_RECUS_desc:0 "我们可以让统一主义者欢迎我们的第一步是将他们的苏格兰方言——阿尔斯特苏格兰语承认为除爱尔兰语和英语之外的第三个官方语言。这表明我们愿意与他们进行谈判。"
 ire.ucuc.tt:0 "\n极大缓解统一主义者的紧张局势。"
 IRE_CUC:0 "建立文化团结委员会"
 IRE_CUC_desc:0 "我们的下一步应该是建立一个文化团结委员会，以在接纳爱尔兰所有的不同文化的同时，促进文化的发展。这样就能确保没有人被忽视或被认为是二等公民。"
 ire.eirenua.tt:0 "\n解决统一主义者的紧张局势。"
 IRE_EIRENUA:0 "新爱尔兰"
 IRE_EIRENUA_desc:0 "我们最后最激进的一步将是组建爱尔兰联邦，使爱尔兰得四个省份的各自成立区域下议院，这使得阿尔斯特人民在其执政方面有更大的发言权。由于爱尔兰西部地区在许多方面被都柏林政府忽视，这也将使爱尔兰的西部地区能够从中获益。"
 IRE_EVTW:0 "世界舞台上的爱尔兰"
 IRE_EVTW_desc:0 "爱尔兰人建立爱尔兰自由邦以来已经过了十一年，在令人困顿的孤立中，外界的政治看起来并不重要。然而，另一场大战已悄然逼近，爱尔兰必须守住自己在世界舞台上的位置，否则，爱尔兰人的生命也许会再次被当作消耗品来消耗。"
 IRE_ENEMIES:0 "处理我们的敌人"
 IRE_ENEMIES_desc:0 "我们最主要的威胁来自不列颠联盟。我们不希望他们回归，并尝试再次影响并控制爱尔兰。如果我们想维持中立，我们必须想办法解决来自他们的威胁。"
 IRE_PEACEUOB:0 "同不列颠联盟和解"
 IRE_PEACEUOB_desc:0 "最好的解决办法是与英国人持续保持中立，以换取英国不干涉爱尔兰事务。"
 IRE_ENDTW:0 "结束贸易战争"
 IRE_ENDTW_desc:0 "现在我们签署了一项条约以确保我们与英国的中立友好的关系，这样就可以结束自1922年以来的贸易战争。"
 IRE_GIVEUSTHEFUTURE:0 "予我们以未来"
 IRE_GIVEUSTHEFUTURE_desc:0 "盎格鲁-撒克逊人总有一天会再次试图阻止爱尔兰人继续前进。现在是时候一劳永逸的解决问题他们了！"
 IRE_ENOUGHOFYOURPAST:0 "忍无可忍，一雪旧耻"
 IRE_ENOUGHOFYOURPAST_desc:0 "当爱尔兰三色旗在伦敦飘扬时，世界各地都会知道大英帝国和他们邪恶的红色后代已经被我们从地球上抹去了！"
 IRE_FRIENDS:0 "选择我们的朋友"
 IRE_FRIENDS_desc:0 "随着紧张气氛的加剧，国内开始有人呼吁政府需要寻求盟友来保护爱尔兰。现在，我们站在了选择与谁为友的十字路口。德国是我们“勇敢的欧洲盟友”随着国际紧张局势的蔓延，国内开始有人呼吁政府需要寻求盟友来保护爱尔兰。现在，我们站在了选择与谁为友的十字路口。帕特里克·皮尔斯将德国描述为我们“欧洲的强大盟友”，他们的援助在独立战争中被证明是至关重要的，但是，爱尔兰人作为协约国一分子在世界大战中进行了战斗。爱尔兰人又要为了外国战争而派去送死吗？"
 IRE_KAISER:0 "中欧同盟红利"
 IRE_KAISER_desc:0 "德国人是首个承认我们独立的国家，他们提供的武器与装备使我们能够在爱尔兰独立战争期间抵挡英国军队的猛烈进攻。爱尔兰已经在很多领域与德国有相当程度的合作。现在，我们可以把它正式化。"
 IRE_ASKJOINME:0 "我们勇敢的欧洲盟友"
 IRE_ASKJOINME_desc:0 "正是德国人帮助了皮尔斯、康诺利和1916年的英雄们，自我们独立以来，他们不断地向我们表示尊重与友好。从许多方面来说，倘若没有德国人在英法两大帝国崩溃后构建的秩序，我们为己而立的爱尔兰便无法生存。与其说这是投桃报李，倒不如说是承认事实：团结则强，我们亦可借此共同创造一个更美好、更繁荣的未来。"
 IRE_KAISERFRIEND:0 "实际的友谊"
 IRE_KAISERFRIEND_desc:0 "虽然我们不愿意去为了争取爱尔兰的独立而让年轻的爱尔兰人面临死亡的风险，但我们可以允许德国部队在爱尔兰集结，以换取他们对我们的保护。"
 IRE_ALONE:0 "既非英王也非德皇"
 IRE_ALONE_desc:0 "“我们不会为英王或德皇服务”，这句标语在自由大堂回响。虽然我们很乐意看见德国人帮助我们维持我们的自由，但是我们必须要维持中立。"
 IRE_ISO:0 "独立自主"
 IRE_ISO_desc:0 "既然我们决定保持中立，那么我们就要建立自己的经济，使爱尔兰成为真正独立于外国资本。"
 IRE_AUTARKY:0 "自给自足"
 IRE_AUTARKY_desc:0 "爱尔兰人民排除万难，已将经济从英国人治下的一潭死水中拯救出来，涅槃重生成一个自给自足的经济体。但一些对出口有帮助的限制措施却让爱尔兰的贸易伙伴不那么开心，这也将影响他们对未来几年里对爱尔兰可靠性的看法。"
 IRE_KING:0 "熟识的魔鬼好相处"
 IRE_KING_desc:0 "尽管我们相互敌视，但是爱尔兰和英国流亡者面临着共同的敌人。为了保障我们的独立，我们可以帮助他们与工团主义者斗争。"
 IRE_JOINENTENTE:0 "旧敌知根"
 IRE_JOINENTENTE_desc:0 "对许多爱尔兰人来说，甚至是对许多政府内部人士来说，与加拿大的英国流亡者进行更密切合作的想法都实在令人不适。黑棕部队的故事在许多人的脑海中记忆犹新，更不用说许多流亡保守党人还在坚称北爱尔兰是联合王国一部分的这一尴尬事实了。无论如何，我们不能总被过往的苦难蒙蔽双眼。我们应以共建未来为目标。"
 IRE_ENTENTETECH:0 "加入帝国科学学术委员会"
 IRE_ENTENTETECH_desc:0 "帝国科学学术委员会是致力于整合协调英帝国各成员科研成果的机构。虽然我们在英国大革命后就脱离了大英帝国，但我们与加拿大的关系可以说服他们让我们加入这个科研圈。"
 IRE_AT:0 "血脉相连"
 IRE_AT_desc:0 "当初，爱尔兰人为了逃离英国的压迫和饥荒而来到美国。现在，在美利坚合众国已经存在数百万爱尔兰裔美国人。由于侨民中的许多人处于高位，我们可以利用祖先之间的纽带来影响美国政府和政策。"
 IRE_AIDAMERICA:0 "爱尔兰裔美国人互助协会"
 IRE_AIDAMERICA_desc:0 "爱尔兰爆发内战的消息已经传至美国，许多爱尔兰裔美国人同情我们的事业并捐助了武器和物资来帮助我们进行斗争。"
 ire.aidamerica.tt:0 "\n爱尔兰裔美国捐助者将为我军提供物资。"
 IRE_USATRADE:0 "与美国的友谊"
 IRE_USATRADE_desc:0 "尽管有爱尔兰裔侨民的影响，但是自1922年爱尔兰独立以来，爱尔兰与美国之间的官方关系一直相当冷淡。也许我们应该通过开放与美国的贸易来纠正这个问题。"
 IRE_USATECH:0 "技术协会"
 IRE_USATECH_desc:0 "既然爱尔兰与美国之间的关系开始缓和，我们应该与爱尔兰裔美国科学家以及知识分子联系，来确认我们可以从他们哪里学到什么，从而爱尔兰美国双方都能从中获得好处。"
 IRE_ATC:0 "大西洋贸易委员会"
 IRE_ATC_desc:0 "现在爱尔兰与美利坚的关系极为密切，我们现在也许可以提出建立一个委员会来加强跨大西洋贸易。"
 IRE_WASHINGTON:0 "华盛顿的朋友"
 IRE_WASHINGTON_desc:0 "爱尔兰不仅仅与美国进行了贸易，并且在第二次美国内战爆发后派出志愿军协助美利坚合众国战斗，我们现在可以使我们与美国的友谊从经层面升格为政治层面，并且可以说服美国人通过不侵犯条约并保障我们的独立。"
 IRE_USTECHGROUP:0 "加入自由世界的大学"
 IRE_USTECHGROUP_desc:0 "美国人创立了自由世界的大学，一个致力于协调整合美国与其盟国科研成果，并向各成员国施以援手的机构。既然我们已与美国结成兄弟友邦，那我们也理应加入这个科研圈内。"
 IRE_COALITION:0 "组建大西洋公约组织？"
 IRE_COALITION_desc:0 "为了在国际舞台上捍卫并争取爱尔兰的利益，免于被某些霸权主义国家凌辱，我们将致力于建立我们自己的外交联盟。一个名为大西洋公约组织的经济与军事联盟将让全世界志同道合的国家联合起来，同求安全与繁荣，并摆脱目前主导欧洲与国际政治的各大国。"
 IRE_CIVINTER:0 "对美国内战的反应"
 IRE_CIVINTER_desc:0 "由于美国经济崩溃造成的政治紧张局势最终导致了美国内战的爆发。由于我们与美国的联系，爱尔兰可能会受到影响，并且必须为任何潜在后果做好准备。"
 ire.sanctuary.tt:0 "\n爱尔兰将会接纳爱尔兰裔美国人难民。"
 IRE_ALLYFRANCE:0 "革命感召"
 IRE_ALLYFRANCE_desc:0 "在反帝国主义及其占领的斗争中，我国的独立战争在普罗大众推翻陈腐的压迫性制度的全球性斗争中扮演了重要的角色，我们这些年来虽有过迷惘，走过错路，但我们已不再对为全人类争取解放的共同事业视而不见。那一天终会到来，我们必须为此做好准备。"
 ire.170.t:0 "前往不列颠的爱尔兰外交代表团"
 ire.170.d:0 "我们认为，确保爱尔兰未来独立的最佳方式是与英国人对话并达成和解协议。在外交部长埃蒙·德·瓦莱拉的带领下，包括第一次《英爱条约》的签署者之一的罗伯特·巴顿在内，我们的外交使团已动身前往伦敦。"
 ire.170.a:0 "祝你们好运！"
 ire.171.t:0 "爱尔兰外交代表团抵达不列颠"
 ire.171.d:0 "爱尔兰的外交使团于今日抵达伦敦，向工会大会表明他们期待着通过谈判解决英国和爱尔兰之间的历史遗留问题。我们是应该安排谈判，还是把他们送回爱尔兰？"
 ire.171.a:0 "我们会谈判的"
 ire.171.b:0 "送他们回去！"
 ire.172.t:0 "不列颠拒绝谈话"
 ire.172.d:0 "我们的代表团空手而归。甚至和英国人的谈话都没有开始。"
 ire.172.a:0 "该死的英国佬！"
 ire.173.t:0 "谈判的开始"
 ire.173.d:0 "不列颠同意对话。我们要求不列颠为了爱尔兰对英国在大陆上的任何争端维持中立态度，他们必须承认爱尔兰独立于英国，并承诺不干涉爱尔兰事务。除此之外，这两个国家之间存在关税的问题，这阻碍了双方贸易和潜在的经济增长。为了双方的利益，我们希望看到关税问题得以解决。"
 ire.173.a:0 "公平的提议？"
 ire.174.t:0 "谈判的开始"
 ire.174.d:0 "不列颠同意对话。我们要求不列颠为了爱尔兰对英国在大陆上的任何争端维持中立态度，他们必须承认爱尔兰独立于英国，并承诺不干涉爱尔兰事务。除此之外，这两个国家之间存在关税的问题，这阻碍了双方贸易和潜在的经济增长。为了双方的利益，我们希望看到关税问题得以解决。"
 ire.174.a:0 "公平的提议？"
 ire.175.t:0 "爱尔兰的提议"
 ire.175.d:0 "爱尔兰人向我们的谈判代表提出了他们的提议。他们希望我们能够保证爱尔兰独立，并不要插手爱尔兰事务来维持他们的中立。他们还要求在我们互相降低关税。作为回报，我们可以提出任何其他的条件。"
 ire.175.a:0 "我们同意爱尔兰的提议"
 ire.175.b:0 "作为协议的一部分要求军事通行权"
 ire.175.c:0 "我们不能同意"
 ire.176.t:0 "爱尔兰的提议"
 ire.176.d:0 "爱尔兰人向我们的谈判代表提出了他们的提议。他们希望我们能够保证爱尔兰独立，并不要插手爱尔兰事务来维持他们的中立。他们还要求在我们互相降低关税。作为回报，我们可以提出任何其他的条件。"
 ire.176.a:0 "我们当然会同意爱尔兰的提议！"
 ire.176.b:0 "作为协议的一部分要求军事通行权"
 ire.176.c:0 "我们不能同意"
 ire.177.t:0 "英国同意了"
 ire.177.d:0 "工团主义者同意了我们的提议，代表团获得了成功！"
 ire.177.a:0 "太棒了！"
 ire.178.t:0 "第二次英爱条约"
 ire.178.d:0 "我们签署了一份保障爱尔兰中立的协议，虽然他们可能不是盟友，但我们也不应该将爱尔兰视为敌人。"
 ire.178.a:0 "太棒了！"
 ire.179.t:0 "谈判破裂"
 ire.179.d:0 "我们的代表团彻底空手而归，没有成功与工团主义者签署任何协议。"
 ire.179.a:0 "该死的英国佬！"
 ire.180.t:0 "不列颠的开价"
 ire.180.d:0 "工团主义者同意了我们的提议，作为交换，不列颠联盟要求我们允许他们使用我们的港口与机场。"
 ire.180.a:0 "可以接受的代价"
 ire.180.b:0 "要求经济援助作为交换"
 ire.180.c:0 "这不可接受！"
 ire.181.t:0 "爱尔兰讨价还价"
 ire.181.d:0 "爱尔兰外交使团作出回应，他们要求以经济援助作为军事通行权的交换。"
 ire.181.a:0 "我们同意"
 ire.181.b:0 "他们要求的太多了"
 ire.182.t:0 "英国同意了"
 ire.182.d:0 "不列颠同盟同意了我们的提议。我们的代表团成功了！"
 ire.182.a:0 "很好！"
 ire.183.t:0 "第二次英爱条约"
 ire.183.d:0 "我们签署了一份保证爱尔兰中立的协议。虽然他们不会是我们的盟友，我们也不应该将其视为我们的敌人。"
 ire.183.a:0 "很好！"
 ire.184.t:0 "贸易战的结束"
 ire.184.d:0 "自从1922年第一次英爱条约签署之后，爱尔兰获得了独立，并建立了爱尔兰共和国。同时，大英帝国与爱尔兰两国之间的经济冲突也开始了。作为对爱经济制裁的手段之一，同时为了帮助英国企业摆脱世界大战失败影响的贸易保护主义措施，英国将进出口关税定为20％。爱尔兰人作为独立的交换条件同意了这些条件。在1925年的革命和不列颠联盟的建立后，由于工团主义者和柯林斯爱尔兰统一党之间的意识形态差异，情况并没有改变。然而，随着第二次英爱条约的签署，贸易战争宣告结束，双方都将获得经济利益。"
 ire.184.a:0 "很好！"
 ire.185.t:0 "贸易战的结束"
 ire.185.d:0 "自从1922年第一次英爱条约签署之后，爱尔兰获得了独立，并建立了爱尔兰共和国。同时，大英帝国与爱尔兰两国之间的经济冲突也开始了。作为对爱经济制裁的手段之一，同时为了帮助英国企业摆脱世界大战失败影响的贸易保护主义措施，英国将进出口关税定为20％。爱尔兰人作为独立的交换条件同意了这些条件。在1925年的革命和不列颠联盟的建立后，由于工团主义者和柯林斯爱尔兰统一党之间的意识形态差异，情况并没有改变。然而，随着第二次英爱条约的签署，贸易战争宣告结束，双方都将获得经济利益。"
 ire.185.a:0 "很好！"
 ire.186.t:0 "与爱尔兰签署条约？"
 ire.186.d:0 "爱尔兰政府已经表示愿意让我们获得军事通行权，让我们可以将我们的海军和空军部署在不列颠旁边，以此，爱尔兰要求换取互不侵犯条约，德国将保证他们的独立。"
 ire.186.a:0 "好！"
 ire.186.b:0 "代价太大了……"
 ire.187.t:0 "德国接受了我们的提议！"
 ire.187.d:0 "德国同意了我们的提议，作为交换，德意志帝国要求我们允许他们驻军。"
 ire.187.a:0 "很好！"
 ire.188.t:0 "爱尔兰加入帝国公约组织？"
 ire.188.d:0 "爱尔兰政府已经向我们提出要加入我们的联盟。这样做会让我们拥有不列颠旁边的基地以及忠实的盟友。我们应该怎么回应？"
 ire.188.a:0 "好！"
 ire.188.b:0 "代价太大了……"
 ire.189.t:0 "德国人同意了我们的请求！"
 ire.189.d:0 "德国人同意了我们的请求，现在我们将要加入帝国公约，共同对抗工团主义者"
 ire.189.a:0 "很好！"
 ire.190.t:0 "德国人拒绝了我们的请求！"
 ire.190.d:0 "德国人拒绝了我们的请求，我们不会再相信他们了！"
 ire.190.a:0 "这是他们的损失！"
 ire.191.t:0 "与爱尔兰签署条约？"
 ire.193.t:0 "爱尔兰加入协约国？"
 ire.193.d:0 "爱尔兰政府已经同意了我们要求，加入我们的联盟。这样做会让我们获得在不列颠旁边的基地和盟友，推动我们从工团主义收复不列颠的目标。另一方面，与爱尔兰结盟并不意味着淡忘爱尔兰战争的记忆……"
 ire.193.a:0 "离伦敦更进一步！"
 ire.193.b:0 "敌人的敌人不是朋友！"
 ire.194.t:0 "加拿大同意了我们的请求！"
 ire.194.d:0 "加拿大同意了我们的请求，现在我们加入了协约国，共同对抗工团主义者。D"
 ire.194.a:0 "很好！"
 ire.195.t:0 "加拿大拒绝了我们"
 ire.195.d:0 "加拿大拒绝了我们加入协约国的请求。"
 ire.195.a:0 "可恶！"
 ire.196.t:0 "与爱尔兰的贸易关系？"
 ire.196.d:0 "爱尔兰政府提出，我们两国之间开放贸易的可能性。由于我们的大萧条和爱尔兰的亲德倾向，两国之间的关系之前一直是冷淡的。"
 ire.196.a:0 "这不要紧的，对吧？"
 ire.196.b:0 "现在这个对我们风险太大了"
 ire.197.t:0 "美国同意了！"
 ire.197.d:0 "美国积极响应了我们的提议，这对我们经济有极大的帮助！"
 ire.197.a:0 "很好！"
 ire.198.t:0 "美国拒绝了！"
 ire.198.d:0 "美国政府拒绝了我们的提议。由于他们的国家处于不稳定中，因此他们不愿意增加风险。"
 ire.198.a:0 "好吧，那你能干什么呢？"
 ire.199.t:0 "大西洋贸易委员会？"
 ire.199.d:0 "爱尔兰政府提议建立大西洋贸易委员会来增强我们之间的大西洋贸易。现在我们国家的关系和爱尔兰有所回暖，因此有很多人同意这个想法。"
 ire.199.a:0 "好主意！"
 ire.199.b:0 "维持现状不是很好么？"
 ire.200.t:0 "大西洋贸易委员会的建立"
 ire.200.d:0 "美国政府已同意爱尔兰的提议，大西洋贸易委员会将正式成立，以监督我们国家之间的贸易。这有利于我们两国之间的关系进一步提升。"
 ire.200.a:0 "很好！"
 ire.201.t:0 "我们的提议被拒绝了！"
 ire.201.d:0 "不幸的是，美国拒绝了我们的提议。"
 ire.201.a:0 "真可惜"
 ire.202.t:0 "爱尔兰-美利坚协议？"
 ire.202.d:0 "爱尔兰政府已经要求我们签署互不侵犯条约，并且要求美国对爱尔兰保障独立。鉴于我们的经济关系和爱尔兰在第二次内战期间给予我们的帮助，很少有人反对这个想法。"
 ire.202.a:0 "当然！"
 ire.202.b:0 "显然爱尔兰距离我们太远，我们很难保护"
 ire.203.t:0 "签署爱尔兰-美利坚协议"
 ire.203.d:0 "美国政府很自然的同意我们的要求，我们已经签署了一项保障爱尔兰独立并免受外国势力侵略的协议以及互不侵犯条约。"
 ire.203.a:0 "很好！"
 ire.204.t:0 "美利坚拒绝了我们！"
 ire.204.d:0 "美国人无视了我们曾经给予的帮助，拒绝保护我们！"
 ire.204.a:0 "忘恩负义的背刺者……"
 ire.205.t:0 "加入爱尔兰联盟？"
 ire.205.d:0 "爱尔兰政府向我们提出了一个重要提案，提议我们加入全面军事联盟。因此，我们可以将影响力扩大到大西洋和欧洲，但是代价是这可能会使我们国家承受战争的压力。"
 ire.205.a:0 "加入大西洋公约组织！"
 ire.206.t:0 "爱尔兰-[FROM.GetNameDef]同盟"
 ire.206.d:0 "[FROM.GetNameDef]同意了我们的请求，并希望将自己的影响力扩大到环大西洋。现在我们是盟友了，我们将站一起对抗反对我们的人！"
 ire.206.a:0 "天佑大西洋公约组织！"
 ire.207.t:0 "美国拒绝了我们的提议"
 ire.207.d:0 "美国拒绝了同盟的提议，认为这毫无必要。即便如此。当我们被攻击是他们仍然会保护我们。"
 ire.207.a:0 "好吧……"
 ire.208.t:0 "爱尔兰支持我们！"
 ire.208.d.not_syndie:0 "爱尔兰政府把我们看作是反对工团主义的堡垒，因此派出了志愿军来帮助我们进行斗争！"
 ire.208.d.syndie:0 "我们在爱尔兰的同志派出了两支志愿军来帮助我们进行革命斗争"
 ire.208.a:0 "爱尔兰万岁！"
 ire.209.t:0 "第二次美国内战的结束"
 ire.209.d:0 "第二次美国内战结束了，我们派遣的爱尔兰共和军志愿军已经带着他们学到的战斗经验回国了。"
 ire.209.a:0 "欢迎回家！"
 ire.210.t:0 "移民与经济"
 ire.210.d:0 "美国资本和技术专家的涌入以及廉价劳工，对我们的经济产生了积极的影响。"
 ire.210.a:0 "很好"
 ire.216.t:0 "爱尔兰希望加入第三国际"
 ire.216.d:0 "爱尔兰在经历工团主义起义后，其政府近期宣布有意愿加入第三国际。我们是否应该让爱尔兰的工人加入我们向资本主义与帝国主义的圣战中去？"
 ire.216.a:0 "当然！"
 ire.216.b:0 "没那个必要"
 ire.217.t:0 "我们加入了第三国际！"
 ire.217.d:0 "法国乐于我们加入第三国际，毕竟我们都有把工团主义撒向世界的共同伟业。现在我们是第三国际的一部分了。"
 ire.217.a:0 "万岁！"
 ire.218.t:0 "法国拒绝！"
 ire.218.d:0 "法国拒绝了我们加入第三国际的请求。"
 ire.218.a:0 "他们可亏大了！"
 ire.219.t:0 "工团大会上的经济政策"
 ire.219.d:0 "第一个议案和经济有关，自由爱尔兰极力拥护在爱尔兰最不发达地区修筑基础设施，援助当地发展的政策；爱尔兰工人同盟党则认为应该在受工人控制的主要城市修筑铁路；而革命工人团体提议建设公共工程项目，以此振兴爱尔兰的经济，并给新生的革命政权以有力援助；工党提议建立一个爱尔兰福利国家，为所有爱尔兰人提供福利。"
 ire.219.a:0 "革命工人团体：公共工程项目！"
 ire.219.b:0 "工人联盟：更多的城市基建！"
 ire.219.c:0 "自由爱尔兰：必须支援落后地区！"
 ire.220.t:0 "工团大会上的语言政策"
 ire.220.d:0 "下一个议案是爱尔兰语，自由爱尔兰主张全面文化复兴，爱尔兰工人同盟坚持詹姆斯·康诺利的著名论断——“饿汉学不来盖尔语”，主张暂缓语言议题，而革命工人团体虽提议应有所动作，但也强调眼下另有要紧之事。"
 ire.220.a:0 "革命工人团体：采取些许措施"
 ire.220.b:0 "工人联盟：其他的事更要紧"
 ire.220.c:0 "自由爱尔兰：必须从现在就开始文化复兴！"
 ire.221.t:0 "工团大会上的宗教政策"
 ire.221.d:0 "下一个议案决定了爱尔兰宗教的命运，工党支持政教分离，自由爱尔兰相信宗教问题应该被放置不管，尽管这会让天主教徒与新教徒感到不悦；爱尔兰工人同盟党则鼓吹应当把爱尔兰的学校体系国有化；而革命工人党则认为应该把一切宗教因素从爱尔兰抹去。"
 ire.221.a:0 "革命工人团体：绝不能让宗教干涉官方事务！"
 ire.221.b:0 "工人联盟：把这些教会学校的系统国有化！"
 ire.221.c:0 "自由爱尔兰：把这些问题留待以后解决吧"
 ire.222.t:0 "工团大会上的外交政策"
 ire.222.d:0 "下一个议案是外交关系，工党拥护中立政策，自由爱尔兰主张均衡发展同第三国际的关系，爱尔兰工人同盟希望深化对英往来，革命工人团体则力主与法国结盟。"
 ire.222.a:0 "革命工人团体：我们必须与欧洲的革命战友法国交好！"
 ire.222.b:0 "工人联盟：我们与不列颠岛的工人运动关系深远！"
 ire.222.c:0 "自由爱尔兰：平衡为上，大家合作共赢！"
 ire.223.t:0 "工团大会上的军事政策"
 ire.223.d:0 "最后一个议案正是军队各界人士所最关注的。工党认为军队的每个部门都很重要，自由爱尔兰指出爱尔兰的空中自卫必须以自身的空军为基础，佐以第三国际的空中力量；而爱尔兰工人同盟认为应该组建人民军队来保卫国家，支援世界革命；革命工人团体则相信爱尔需要专注于发展其海军力量，才能有效抵御加拿大与德国人的舰队，且支援英法的海军进行战略部署。"
 ire.223.a:0 "革命工人团体：专注于海军！"
 ire.223.b:0 "工人联盟：专注于陆军！"
 ire.223.c:0 "自由爱尔兰：专注于空军！"
 ire.224.t:0 "革命工人团体取得多数"
 ire.224.d:0 "工团大会胜利落幕，詹姆斯·格拉尔顿的革命工人团体以绝对多数取胜。"
 ire.224.a:0 "恭喜格拉尔顿同志"
 ire.225.t:0 "自由爱尔兰取得多数"
 ire.225.d:0 "工团大会胜利落幕，皮达尔·奥唐奈的自由爱尔兰以绝对多数取胜。"
 ire.225.a:0 "恭喜奥唐奈同志"
 ire.226.t:0 "爱尔兰工人联盟取得多数"
 ire.226.d:0 "工团大会胜利落幕，詹姆斯·拉金的爱尔兰工人联盟以绝对多数取胜。"
 ire.226.a:0 "恭喜拉金同志"
 ire.227.t:0 "工团大会以平局收场"
 ire.227.d:0 "工团大会胜利落幕，革命临时政府因平局而维持下来。"
 ire.227.a:0 "维持革命政府！"
 IRE_FINAL_STRUGGLE:0 "最后一战"
 IRE_FINAL_STRUGGLE_desc:0 "既然已经公开向英国政府宣告了敌对状态，现在的爱尔兰人民热情高涨，要以万全的准备来保卫爱尔兰的自由，让给爱尔兰施加数百年暴政的英国血债血偿。"
 IRE_USA_trade:0 "美爱贸易"
 IRE_USA_trade_desc:0 "虽然政治路线的分歧和美国经济的崩溃让爱-美经济关系跌入冰谷，但沟通交流与通商贸易正使爱尔兰与美国的关系逐渐回暖。"
 IRE_USA_tech:0 "美爱科研"
 IRE_USA_tech_desc:0 "在美国政府和许多愿意帮助同胞的美籍爱尔兰知识分子的支持下，爱尔兰的技术发展得到了改善。"
 IRE_USA_ATC:0 "大西洋贸易委员会"
 IRE_USA_ATC_desc:0 "作为对两国日益增长关系的回应，两国政府同意成立大西洋贸易委员会，以监督促进两国军队的发展。"
 IRE_REFUGEES:0 "爱尔兰裔美国人移民"
 IRE_REFUGEES_desc:0 "爱尔兰接受了许多因内战而出逃的爱尔兰裔美国人。他们给爱尔兰提供了大量的劳力和兵员，因此而受到了广泛欢迎，这或许会给爱尔兰社会带来深远影响。"
 IRE_REFUGEE_WORK:0 "移民工作计划"
 IRE_REFUGEE_WORK_desc:0 "作为对爱尔兰裔美国人难民失业问题的回应，爱尔兰政府决定为难民雇佣问题与减少社会紧张局势而成立一个发展计划。"
 IRE_REFUGEE_FIGHT:0 "移民旅"
 IRE_REFUGEE_FIGHT_desc:0 "作为对爱尔兰裔美国人难民失业问题的回应，爱尔兰政府决定以组件移民旅的形式，减少难民雇佣问题与社会紧张局势。"
 IRE_USA_PACT:0 "爱尔兰-美利坚协议"
 IRE_ARMYTREE:0 "军队改革"
 IRE_ARMYTREE_desc:0 "自从北方战役结束以后，爱尔兰军队水平开始下滑，并且在不列颠联盟和加拿大的威胁下降后开始裁军。但是随着工团主义的威胁越来越大，军队必须改革。"
 IRE_MILITARYINDUSTRY:0 "军事工业"
 IRE_MILITARYINDUSTRY_desc:0 "虽然爱尔兰人民比起战争更喜欢和平，但毫无疑问，战争就在眼前。爱尔兰海对面的敌人还羽翼未丰，爱尔兰如果希望在未来的风暴中幸存下来，就必须发展军事工业。"
 IRE_HEAVYINDUSTRY:0 "重视重工业"
 IRE_HEAVYINDUSTRY_desc:0 "爱尔兰不过弹丸之地，军工产业无法无限扩张。所以我们的军工产业应该专为战争而设计，产出数量质量皆优的产品。我们也不能在把民用工业转为军用这件事上浪费时间。"
 IRE_heavy_industry:0 "爱尔兰重工业"
 IRE_heavy_industry_desc:0 "我们已决定把我们的军事工业优化为一系列高消耗高产出的工厂，尤其要特化为专职生产武器的工厂。"
 IRE_NORMALINDUSTRY:0 "重视中等规模工业"
 IRE_NORMALINDUSTRY_desc:0 "为了适应不断变化的世界局势，爱尔兰军工的高度灵活性也至关重要。战争或许迫在眉睫，但这样的战争也不会持久。我们必须把战争与和平时的工业需求放到同等地位来考虑，一个便宜而灵活的中等规模的工业体系就能胜任这一点。"
 IRE_medium_industry:0 "爱尔兰混合工业"
 IRE_medium_industry_desc:0 "我们决定以更加灵活的方式建设军工产业，建造一些可以在民用与军用之间相互转换的小型军工厂。"
 IRE_HEAVYPRODUCTIONDRIVE:0 "生产加速"
 IRE_HEAVYPRODUCTIONDRIVE_desc:0 "既然我们已经整备好了工业，又把它进行了战争特化，那么现在就可以着手把工人训练这件事产业化，让更多更精良的工人投身到生产中去。"
 IRE_production_drive:0 "集约生产驱动"
 IRE_production_drive_desc:0 "更快，更硬，更强：这很快成为了爱尔兰军工产业的一种精神。我们可能无法在数量上匹敌对手，但我们将以最好的武器消灭它们。"
 IRE_DEFENSEPRODUCTION:0 "工业防御计划"
 IRE_DEFENSEPRODUCTION_desc:0 "我们的工业生产不能因敌军的轰炸而受损，这一点至关重要。通过我们的精密布防，我们能把敌军轰炸所造成的伤害最小化。"
 IRE_defense_production:0 "工业防御计划"
 IRE_defense_production_desc:0 "我们所有的军事工厂都将把局部建在地下，用加固的屋顶和排气装置来防御敌人的轰炸机。"
 IRE_HEAVYPRIORITIES:0 "规划产业战略"
 IRE_HEAVYPRIORITIES_desc:0 "在战场之外也是要做出战略决策的。正如我们的将军们必须决定我们军队的首要任务，我们也必须决定我们的工业战略。我们将设立一个委员会以用来在一年内两次审查我们的优先事项，并允许我们将我们的生产工作集中在一条主要的生产线上来显著提高产量。"
 ire.hp.tt:0 "规定一个§Y生产区§!以用来§O增加成本§!并换取§G更高的产出§!。\n\n"
 ire.128.t:0 "产业战略"
 ire.128.d:0 "作为我们庞大的军事工业计划的一部分，我们能够优先考虑军备生产的某一领域，以满足和促进我们的总体战略目标。在一段时间内，我们可以大大提高我们在任何特定领域的产量，但这将花费我们相当多的收入，因此，如果要这么做的话，应该明智选择该领域。"
 ire.128.a:0 "集中精力生产坦克"
 ire.128.b:0 "我们的小伙子需要更多的枪"
 ire.128.c:0 "我们需要更多的飞机"
 ire.128.e:0 "现在暂时不需要优先生产某种物资"
 ire_armor_prio:0 "重视装甲"
 ire_armor_prio_desc:0 "我们正在以生产消费品的花费来生产大量坦克。"
 ire_infantry_prio:0 "重视步兵装备"
 ire_infantry_prio_desc:0 "我们正在以生产消费品的花费来生产大量步兵装备。"
 ire_airforce_prio:0 "重视空军"
 ire_airforce_prio_desc:0 "我们正在以生产消费品的花费来生产大量飞机。"
 IRE_FLEXIBILITYBOOST:0 "维持弹性"
 IRE_FLEXIBILITYBOOST_desc:0 "我们的军工厂被设计成能够廉价，快速建造并且能轻松拆除并可随时组建的样式。我们对于在工厂的生产线也有着相同的概念。新的生产线需要能够被快速建立并立即运行，而且能够切换生产品，并开始最大利用这个设计来迎合“运动”产业战略。"
 IRE_flexibility_boost:0 "弹性工业"
 IRE_flexibility_boost_desc:0 "在不断变化的战争环境中，能够在可能的情况下迅速适应和改变我们的生产线是至关重要的。"
 IRE_NAVALINDUSTRY:0 "重视海军工业"
 IRE_NAVALINDUSTRY_desc:0 "如果爱尔兰正在组建一支特别重要的舰队，那么她很快就需要开始建造新的海军设施。对我们国家海军工业的投资将是朝着保护爱尔兰海和我们国家自身，抵御外国侵略的正确方向迈出的一步。"
 IRE_SUBDOCKYARD:0 "科克潜艇制造厂"
 IRE_SUBDOCKYARD_desc:0 "我们的一些海军理论家认为潜艇很可能是未来的海军武器。如果我们想听从他们的建议，那么我们最好开始生产更多的潜艇。通过在科克建立专门的潜艇铸造厂和测试设施，我们可以把我们的海军生产线集中在这些海下狼群的开发上。"
 ire_cork_foundry:0 "科克潜艇制造厂"
 ire_cork_foundry_desc:0 "科克的潜艇测试设施和生产基地让我们能够更有效地生产潜艇。"
 IRE_DESTROYERDOCKYARD:0 "都柏林驱逐舰造船厂"
 IRE_DESTROYERDOCKYARD_desc:0 "屏护舰在任何海军战略中都扮演着关键的角色。爱尔兰目前可能没有太多的舰队可以谈，但我们的海军将领知道基本情况。无论我们生产的是哪种类型的飞机，屏护舰都很重要。都柏林的一个造船厂可以被调整以专注于开发驱逐舰和轻型巡洋舰。"
 ire_dublin_shipyard:0 "都柏林驱逐舰造船厂"
 ire_dublin_shipyard_desc:0 "在都柏林开设的专门造船厂让我们能够更有效地生产轻型屏卫舰。"
 IRE_CAPITALSHIPDOCKYARD:0 "贝尔法斯特大型造船厂"
 IRE_CAPITALSHIPDOCKYARD_desc:0 "与强大的战列舰相比，小船和潜艇只不过是小孩子的玩具。如果我们想要成为海上的一支重要的力量，我们必须要生产巨大，强力的船只。贝尔法斯特是完美的大建场地。"
 ire_belfast_shipwright:0 "贝尔法斯特大型造船厂"
 ire_belfast_shipwright_desc:0 "贝尔法斯特是世界上最好的造船城市之一，如今它有了一个完全为本国建造战舰的造船厂，更是锦上添花。"
 IRE_AIRFORCE:0 "资助爱尔兰空军"
 IRE_AIRFORCE_desc:0 "到目前为止，爱尔兰军队的一个明显错误是没有任何空军，它被认为既不重要又太昂贵。英国拥有世界上最强大的空军之一，如果我们有机会，我们必须纠正这一点，这一点至关重要。"
 IRE_CHANNELDEFENSE:0 "爱尔兰海防御"
 IRE_CHANNELDEFENSE_desc:0 "英国历史上最强大的军事力量是它的海军，它可以保卫它的岛屿免受侵略。要削弱英国的力量，保护爱尔兰免遭英国的打击，最好的方法就是研究并制造一系列能够摧毁船只的轰炸机。"
 IRE_CHANNELDEFENSE2:0 "进阶轰炸"
 IRE_CHANNELDEFENSE2_desc:0 "现在我们已经研究了海军轰炸机，我们应该利用我们新发现的知识来研究其他种类的轰炸机，这些轰炸机可以帮助我们对抗大不列颠。"
 IRE_FIGHTERFOCUS:0 "空中保卫爱尔兰"
 IRE_FIGHTERFOCUS_desc:0 "如果发生战争，英国空军将能够轻而易举地入侵爱尔兰的领空。我们必须研究能防止这种情况发生的飞机，并让英国飞机有来无回。"
 IRE_FIGHTERFOCUS2:0 "重型战斗机工程"
 IRE_FIGHTERFOCUS2_desc:0 "随着我们的战斗机研究取得成功，我们现在应该考虑建造重型战斗机，它比普通战斗机更有效，并且擅长摧毁敌人的轰炸机。"
 IRE_AIRBASEEXPANSION:0 "扩建机场"
 IRE_AIRBASEEXPANSION_desc:0 "目前，我们在都柏林和德里的机场与许多其他国家的机场相比低于标准，我们必须使这些机场达到标准。"
 IRE_WOMENPILOTS:0 "王家空军里的女性"
 IRE_WOMENPILOTS_desc:0 "复活节起义期间虽有爱尔兰妇女委员会效力军旅，爱尔兰军中仍多反对女性入伍陆海军，然对其投身空军之态度却松得多——兴许是有美国著名飞行员阿梅莉亚·埃尔哈特珠玉在前吧。"
 IRE_AIRCOMMAND:0 "雷达科技"
 IRE_AIRCOMMAND_desc:0 "现在我们已经组建了自己的空军。我们应该资助雷达的研发，这样我们可以通过更早的发现敌军战机，使得击毁他们变得更加容易。同样，我们可以用在发现敌方陆军以及舰船上。"
 IRE_ANYTHINGFORIRELAND:0 "一切为了爱尔兰"
 IRE_ANYTHINGFORIRELAND_desc:0 "我们的敌人要胜利了！在为了自由抗争700年之后，我们不能再次被敌人蹂躏！在这个危急存亡的时刻，我们想到了一个激进的方法：用战机对敌方战舰进行自杀式攻击。希望上帝能够原谅我们这种行为。"
 IRE_INFANTRY:0 "改革爱尔兰国防军"
 IRE_INFANTRY_desc:0 "自1926年北方战役结束以来，军事战术和学说已经发生了变化。不过爱尔兰军队却没有变化。在欧洲爆发战争的时候，我们要保持与时俱进，这是至关重要的。"
 IRE_DIRECTIONOFTHEARMY:0 "军队的方向"
 IRE_DIRECTIONOFTHEARMY_desc:0 "目前，我们的军队在如何进行的问题上存在分歧。我们是应该像我们在北方战役中那样模仿其他国家的军队，还是应该适应我们在独立战争中所开创的战术和结构？"
 IRE_MOBILE1:0 "运动战"
 IRE_MOBILE1_desc:0 "军事战术正在改变，机动战以及坦克战逐渐开始流行。我们必须紧跟时代的步伐，开始学习研究运动战学说。"
 IRE_MOBILE2:0 "摩托化部队"
 IRE_MOBILE2_desc:0 "如果机动作战是为了工作，我们的常规步兵必须被机动化，以超过敌人的速度，否则我们的先锋将被搁置，并且容易受到包围。"
 IRE_MOBILE3:0 "装甲优势"
 IRE_MOBILE3_desc:0 "坦克是机动战的关键单位，是形成对敌人包围的先锋。如果我们希望我们运动战战术获得成功，我们必须研究坦克技术。"
 IRE_FIREPOWER1:0 "优势火力"
 IRE_FIREPOWER1_desc:0 "新的运动战学说主要是针对那些想要侵略其他国家的国家，而爱尔兰并不是其中之一。我们的学说应该集中在使用大炮和保护我们人民的生命上。"
 IRE_FIREPOWER2:0 "重视轻武器"
 IRE_FIREPOWER2_desc:0 "没有补给和弹药，军队不能打仗。虽然德国的物资和美国的捐款在独立战争期间证明是有帮助的，但我们必须学习研究并生产我们自己的物资。"
 IRE_FIREPOWER3:0 "都柏林枪炮厂"
 IRE_FIREPOWER3_desc:0 "我们的学说依赖于制造火炮，以保护我们人民的生命。我们不能仅仅依靠从国际军火公司购买武器，我们必须研究如何生产火炮。"
 IRE_ANHONOURABLEARMY:0 "荣誉之军"
 IRE_ANHONOURABLEARMY_desc:0 "我们的军队要注重秩序，纪律，以及防守。虽然复活节起义期间这些战术可能已经失败了，但他们在北方战役期间运作良好，并且更适合传统战争。"
 IRE_APEOPLESARMY:0 "人民军队"
 IRE_APEOPLESARMY_desc:0 "我们的军队必须专注于速度和快速的计划，我们需要调整一些在爱尔兰独立战争中击败英国的战术。"
 IRE_PATRIOTICMOVEMENT:0 "爱国主义运动"
 IRE_PATRIOTICMOVEMENT_desc:0 "现在我们已经决定将我们独立战争中的战术适应现在的环境，我们应该推动一场将现代军队与飞行的纵队进行比较的运动，我们率先采取了这些战术，以激发我们人民的民族自豪感。"
 IRE_FIGHTINGSPIRIT:0 "战斗的爱尔兰人"
 IRE_FIGHTINGSPIRIT_desc:0 "虽然我们的一些部队难以适应我们的决定，但许多爱尔兰人，一些爱籍外国人和一些外国人，都曾为美国或英国军队等军队而战。我们可以雇佣他们帮助训练我们的部队。"
 IRE_PROFESSIONALARMY:0 "职业军队"
 IRE_PROFESSIONALARMY_desc:0 "既然我们决定使我们的军队向专业化更进一步，我们必须要训练我们的士兵以及军官。他们当中有很多人还抱着旧时代战争的理念。"
 IRE_OFFICERSCHOOL:0 "建立国防训练中心"
 IRE_OFFICERSCHOOL_desc:0 "目前，我国军队的许多军官都缺乏适当的训练，因为我们的武装力量是游击队转变而来的，而不是一支专业的军队。如果我们要建立一所军官培训学校，训练平民和士兵，以使他们获得作为爱尔兰军官的机会，这将提高我们军队的素质。"
 IRE_BLUEBLOUSES:0 "女性辅助军"
 IRE_BLUEBLOUSES_desc:0 "女性对我国及其国防有很大的贡献。我们必须向那些愿意为国家服务的勇敢的爱尔兰女儿们敞开大门。"
 IRE_FLYINGCOLUMNS:0 "新游击队"
 IRE_FLYINGCOLUMNS_desc:0 "虽然军队的改革是一个漫长的过程，但现在终于完成了，国家更强大，更值得骄傲，因此以后面对侵略，爱尔兰的防御将是强有力的。"
 IRE_NAVY:0 "加强海岸警卫队"
 IRE_NAVY_desc:0 "尽管我们是一个邻近英国的岛国，但我们的海军却只有几艘驱逐舰，主要用于搜救溺水者。如果我们要对抗对抗英国著名的海军，我们将需要扩张海军。"
 IRE_WOLFHOUNDS:0 "爱尔兰海的猎狼犬"
 IRE_WOLFHOUNDS_desc:0 "在世界大战期间，德国海军虽不及不列颠海军，但利用U艇取得了很大的成果。我们应该首先研究潜艇战术，这样我们也可以复制德国人的成功。"
 IRE_WOLFHOUNDS2:0 "第二代芬尼亚之槌"
 IRE_WOLFHOUNDS2_desc:0 "1881年，爱尔兰发明家约翰·菲利普·霍兰发明了一艘名为“霍兰艇二号”的潜艇。爱尔兰共和兄弟会给它起了个绰号叫“芬尼亚之槌”。现在，我们必须跟随他们的脚步，建造一支我们自己的潜艇舰队，保卫我们自己并对抗英国海军。"
 IRE_SCREENS:0 "护卫舰研究计划"
 IRE_SCREENS_desc:0 "护卫舰的概念是用于舰队侦察，并且保护我方舰队避免潜艇和飞行器的袭击。这将在会在发现不列颠潜艇以及臭名昭著的不列颠共和国空军上面很有用。"
 IRE_CARRIERS:0 "航空母舰技术"
 IRE_CARRIERS_desc:0 "现在是时候开始对我们的海军进行改革了。我们现在应该研究航空母舰。航空母舰可以使轰炸机在海上起飞，这对于我们的空军也是一个重大改革。"
 IRE_CAPITALFLEET:0 "爱尔兰大舰队"
 IRE_CAPITALFLEET_desc:0 "德国曾经也拥有数量远比英国数量少的战舰。就像他们一样，如果我们要和英国人维持均势，我们必须能够建立一个和他们规模相仿的舰队。虽然这将需要很长时间，但最终还是值得的。"
 IRE_CAPITALFLEET2:0 "更好的战列舰"
 IRE_CAPITALFLEET2_desc:0 "现在我们已经开始建造一个大型的舰队来匹配英国人的海军实力，我们应该关注超级重型战舰的建设。虽然建设需要很长时间，并且价格昂贵，但是结果应该是值得的。"
 IRE_RUTHLESS:0 "无限制拦截原则"
 IRE_RUTHLESS_desc:0 "交通线破袭是一种古老的战略，它通过攻击商船来扰乱敌人的贸易。学会这些，我们就可以在不面对舰队的情况下损害英国。"
 IRE_DIRECTCONFRONTATION:0 "直接对抗原则"
 IRE_DIRECTCONFRONTATION_desc:0 "如果要打破对爱尔兰海上封锁、挫败海上入侵，我们就必须直面英国海军，把它们赶回自己家里。"
 IRE_MARINES:0 "海军陆战队"
 IRE_MARINES_desc:0 "既然我们已经扩大了海军，那我们就应该考虑训练海军陆战精兵来充当登陆作战的先锋。如果取得成功，我们不光可以捍卫爱尔兰的自由，还能顺便把英国也殖民个700年。"
 IRE_HOMEDEFENSE:0 "香农驻防"
 IRE_HOMEDEFENSE_desc:0 "爱尔兰最关键的地标之一就是香农河，它把爱尔兰分为东西两瓣。我们的部队沿河两岸妥善驻防，一旦有外敌入侵，我们的部队就能依香农天险构筑防线。"
 IRE_COASTALDEFENSE:0 "爱尔兰之墙"
 IRE_COASTALDEFENSE_desc:0 "我们下一个防御爱尔兰的提议是在爱尔兰的东海岸建造一道海岸防御墙，在那里，最可能发生海军入侵。"
 IRE_ANTIAIR:0 "防空炮台"
 IRE_ANTIAIR_desc:0 "尽管英国空军对爱尔兰构成了严重威胁，但在宣战后，我们却迟迟没有对他们建立任何防御措施。这种情况必须迅速改变。"
 IRE_CITADELPROJECT:0 "避难所-堡垒计划"
 IRE_CITADELPROJECT_desc:0 "虽然我们把重点放在保卫沿海地区和主要城市周围的土地上，但这些城市本身却没有受到保护。我们提出了一个名为“避难所-堡垒计划”的计划，项目的第一阶段是在那些城市中建立地堡保护他们免受攻击。"
 IRE_CITADELDUBLIN:0 "都柏林堡垒"
 IRE_CITADELDUBLIN_desc:0 "计划的第二阶段是用堡垒、防空设备、沿海堡垒和雷达完全防御都柏林。我们必须在都柏林或贝尔法斯特选择其一，因为我们没有足够的资源来巩固两者。"
 IRE_CITADELBELFAST:0 "贝尔法斯特堡垒"
 IRE_CITADELBELFAST_desc:0 "计划的第二阶段是用堡垒、防空设备、沿海堡垒和雷达完全防御贝尔法斯特。我们必须在都柏林或贝尔法斯特选择其一，因为我们没有足够的资源来巩固两者。"
 IRE_ORGANISEPARTISANS:0 "动员爱尔兰国防军"
 IRE_ORGANISEPARTISANS_desc:0 "现在我们处于战争状态，我们必须调动我们的后备兵员，以增加我们抵御海军入侵的能力。"
 IRE_HONOURABLE_ARMY:0 "荣誉军队"
 IRE_HONOURABLE_ARMY_desc:0 "爱尔兰的军队已勤加操练，学习战法，成为了一只职业军队。"
 IRE_PEOPLES_ARMY:0 "人民军队"
 IRE_PEOPLES_ARMY_desc:0 "爱尔兰军队已采取人民路线，发动群众武装保卫独立政权。"
 IRE_FIGHTING_IRISH:0 "战斗的爱尔兰人"
 IRE_FIGHTING_IRISH_desc:0 "外籍爱尔兰士兵的援助对爱尔兰军队的训练大有稗益。"
 IRE_OFFICER_SCHOOL:0 "军官学校"
 IRE_OFFICER_SCHOOL_desc:0 "建立一所军官学校能帮助训练为独立而奋战的军官与候补生。"
 IRE_BLUESHIRTS:0 "陆军同志协会"
 IRE_BLUESHIRTS_desc:0 "被戏称为蓝衫军的陆军同志协会是约恩·奥达菲手下的一支准军事组织，这支部队只收信仰天主教的爱尔兰本地人。爱尔兰政府已将陆同会整合进了安全机构，这支部队以后将用来保卫爱尔兰，清洗工团主义分子和抵御其他来自国际上的威胁。"
 IRE_LAST_STAND:0 "共患难"
 IRE_LAST_STAND_desc:0 "爱尔兰又一次与英国开战，而这一次爱尔兰的民族独立如风中残烛，在英国的攻势下摇摇欲坠。爱尔兰人民已经无可抛弃，只有置死地而后生。"
 IRE_CNM:0 "女性服役"
 IRE_CNM_desc:0 ""
 IRE_BLUEBLOUSES_idea:0 "女性辅助军"
 IRE_BLUEBLOUSES_idea_desc:0 ""
 ire.213.t:0 "我们绝望的挣扎"
 ire.213.d:0 "爱尔兰再次与英国对抗，1921年之后，我们的独立似乎只是短暂的缓刑。虽然情况看来毫无希望，但我们将战斗到最后。爱尔兰不会悄无声息的陨落！"
 ire.213.a:0 "是福不是祸，是祸躲不过"
 ire.214.t:0 "我们的新盟友！"
 ire.214.d:0 "现在，我们在斗争中终于有了盟友，尽管战斗还没有结束，不过形势似乎不再像以前那样无望。"
 ire.214.a:0 "炮吼枪鸣间，我们高唱士兵之歌！"
 ire.215.t:0 "战争结束了！"
 ire.215.d:0 "尽管我们的处境如此凄凉，但我们还是成功地战胜了敌人，捍卫了我们的独立！"
 ire.215.a:0 "我们要把它归功于爱尔兰人民坚定的勇气！"
 ire.1.t:0 "动员后备役"
 ire.1.d:0 "爱尔兰发现自己又一次身处严重的危机中。我们的战略策划者预见到了这一天的到来，而现在我们正处于战争状态，是时候好好利用他们的远见了。爱尔兰的英雄儿女们正等待着全国的命令，拿起武器，保卫他们的国家免受外国侵略者的攻击。"
 ire.1.a:0 "我们需要他们全部人"
 ire.1.b:0 "一半就够了"
 ire.1.c:0 "只征召步兵预备队"
 ire.2.t:0 "共和国的现状：1936年"
 ire.2.d:0 "距离爱尔兰挣脱现已流亡至大洋彼岸极寒冻土的昔日霸主、赢得独立以来已有些年月了，然而一场撼动了英伦三岛的革命却又将新生的爱尔兰共和国推到了生死存亡的边缘，其国内的政治氛围也已是暗流涌动、一触即发。虽然迈克尔·柯林斯及其统一党在历届选举中向来是所向披靡，但即将到来的1937年大选还是激起了各方反对势力的斗志。保守派的共和党、社会民主派的新芬党纷纷发难，欲一举把“大块头”拉下马，而那些远不如奥达菲那么好说话的右翼激进分子以及背后疑有伦敦资助的社会主义团体更是有过之而无不及。无论未来发生什么，阴云密布的欧陆以及共和国内部的动荡不安，都很有可能把翡翠之岛卷入一场万劫不复的惊涛骇浪之中……"
 ire.2.a:0 "动荡的时期到来了"
 ire.53.t:0 "北方问题"
 ire.53.d:0 "爱德华·卡森，统一党的前领导人于去年去世，享年81岁。他是一个具有很大争议的人物，当爱尔兰获得独立并夺回阿尔斯特时，他活了下来并逃到了英国。在阿尔斯特以外，他受到了格外的辱骂，因为他迫害了他们心爱的爱尔兰诗人及作家奥斯卡·王尔德。今天，他的灵魂被北爱尔兰的效忠者所崇敬，在贝尔法斯特为他举行了一场追悼会，几名阿尔斯特统一派的领导人以他的名义发表了演讲。纪念馆吸引了相当多的人，显示卡森在死后的时候仍然有影响力。他的幽灵正逼近阿尔斯特，正如叛乱的紧张和威胁也笼罩着它。"
 ire.53.a:0 "他死了还是个麻烦精"
 ire.3.t:0 "调试统一派紧张关系机制"
 ire.3.d:0 "这一事件将允许你测试统一派紧张关系系统是否正常工作。"
 ire.3.a:0 "增加统一主义者造成的紧张局势"
 ire.3.b:0 "减少统一主义者造成的紧张局势"
 ire.3.c:0 "报告统一主义者造成的紧张局势"
 ire.4.t:0 "阿尔斯特重回和平"
 ire.4.d:0 "在最近的动乱之后，阿尔斯特的人民似乎又恢复了平静的生活。没有人知道这种和平会持续多久，但毫无疑问的是，爱尔兰的境况更好。众议院还有一些小问题要处理。"
 ire.4.a:0 "这真让人松一口气"
 ire.5.t:0 "阿尔斯特民众不满"
 ire.5.d:0 "一段时间以来，北爱尔兰地区，阿尔斯特，发生了缓慢但不断增长的骚乱。主要由新教统一主义者鼓动，他们主张与英格兰建立更密切的关系，阿尔斯特地区已成为众议院的一个大问题。如果不小心处理这种情况，分裂地区的问题肯定会变得更严重。"
 ire.5.a:0 "这是一个微妙的问题"
 ire.6.t:0 "极端激进运动爆发"
 ire.6.d:0 "为了回应他们认为对阿尔斯特人的压迫政策，统一主义组织越来越激进，并吸引了被剥夺权利最严重的和愤怒的北方人。他们现在秘密地在全国各地的酒吧和奥兰治骑士团见面，因为这些地方没有被监视的风险。"
 ire.6.a:0 "天杀的激进分子"
 ire.7.t:0 "贝尔法斯特暴动"
 ire.7.d:0 "在统一派筹划着叛乱时，贝尔法斯特的街道陷入了一片骚乱。心怀不满的阿尔斯特人，其中绝大多数是新教徒，他们走上街头，以暴力方式反抗他们眼中都柏林的不轨意图。为了解决他们的不满，众议院已经召开了一次紧急会议，但他们多半不会就此收手。"
 ire.7.a:0 "他们一定是疯了"
 ire.8.t:0 "内战迫在眉睫"
 ire.8.d:0 "无论和平与否，所有试图平息阿尔斯特的措施都失败了。由阿尔斯特志愿军支持的阿尔斯特统一派宣布阿尔斯特将从爱尔兰独立出来，并宣称他们将从都柏林和天主教的血腥统治下保卫阿尔斯特省。内战不可避免。"
 ire.8.a:0 "愿主保佑我们"
 ire.131.t:0 "极端激进运动退潮"
 ire.131.d:0 "阿尔斯特地区较为激进的因素正在缓慢而明显地减少。尽管核心成员仍一如既往地极端，但由于我们最新的政策变化，他们发现很难招募新成员。如果事情变得更糟，他们很可能会很快找到追随者，我们必须保持警惕。阿尔斯特还没有和平，只有沉默。"
 ire.131.a:0 "我们最好保持警惕"
 ire.132.t:0 "暴乱的平息"
 ire.132.d:0 "贝尔法斯特的街道已经沉寂，再也没有暴动了。随着人们重返工作岗位，砖块、报纸和垃圾都被扔在一边。然而，参与其中的人认为，他们只是输掉了一场战斗，而不是整场战争。在他们工作的地方，在酒吧和家里，他们低声讨论着下次罢工，没有如果。"
 ire.132.a:0 "至少他们不在街上"
 ire.14.t:0 "1937年爱尔兰大选"
 ire.14.d:0 "爱尔兰终于要大选了，在选举到来之时，人们纷纷前往投票站，选出将执掌爱尔兰的新政府。与近来记忆中的选举相反，柯林斯并非是毫无疑问的选举赢家，因为共和党对柯林斯发起了猛烈的竞选攻势，谴责他是一个外强中干的老战争英雄，只是在靠他的名头唬人。柯林斯作出了回击，既驳斥了这些说法，又确切地向爱尔兰证明了他如今还有大把主意。\n\n与此同时，与统一党和社会主义者相比，新芬党继续将自己定位为非暴力与非激进之人的选择；他们获得了爱尔兰工党垮台且不复存在以来从未有过的热烈欢迎。\n\n另一个正在稳步获得权力的黑马政党是民族中央党；自经济衰退开始以来，其选民队伍便一直在稳步增长。虽然大多数主要政党都在争取维持爱尔兰的民主制度，但奉行社会主义的爱尔兰工人联盟在不列颠联盟的资助与支持下也日渐坐大。工人联盟承诺要摧毁爱尔兰的现行体制，并在翡翠岛掀起一场工团主义革命，尽管他们胜选机会渺茫，但一旦他们获胜，爱尔兰政界必因此天翻地覆，甚至是土崩瓦解。\n\n投票开始，鹿死谁手？"
 ire.14.a:0 "爱尔兰统一党再次获胜"
 ire.14.b:0 "布鲁和新芬党！"
 ire.15.t:0 "社会主义者获选！"
 ire.15.d:0 "看来，“黑色星期一”危机对于柯林斯而言不啻于一场巨大的风暴，尽管工团派赢面不大，但是他们最终却成功胜选了。统一党干部理查德·穆尔卡希已经建议柯林斯下台以保持体面，然而总理奥达菲却认为总统应该采取一些“极端手段”来拯救爱尔兰。"
 ire.15.a:0 "柯林斯解散国家议会！"
 ire.15.b:0 "柯林斯夹着尾巴滚下台了！他的政治生涯彻底终结了！"
 ire.16.t:0 "柯林斯遇刺？"
 ire.16.d:0 "在柯林斯解散国家议会后没多久，愤怒的社会主义反对派便爆发了骚乱。一个心怀不满的共和党支持者竟然试图趁乱刺杀我们的总统！如果柯林斯死了，社会主义者无疑会推翻我们的政府！"
 ire.16.a:0 "柯林斯身亡，公民军突袭伦斯特府！"
 ire.16.b:0 "柯林斯身亡，奥达菲掌控了爱尔兰！"
 ire.250.t:0 "爱尔兰的命运"
 ire.250.d:0 "柯林斯的逝世让爱尔兰民族大难临头。在柯林斯死后，约恩·奥达菲，柯林斯的总理、陆军同志协会，也就是众所周知的蓝衫军的领导人，已宣布“临时”控制爱尔兰。然而，随着爱尔兰局势迅速走向恶化，奥达菲正考虑将国政大权交给一个渴望恢复翡翠岛秩序的组织。此时，奇异的加莱德·奥金纳甘领导的复兴建筑师运动站了出来。这一运动保证奥达菲在内阁中将占有一席之地，如果奥达菲允许他们掌权就再好不过了，比起领导国家他更想领导民兵。奥达菲会接受复兴建筑师的提议吗？"
 ire.250.a:0 "奥达菲任命了加罗德·奥金纳甘和复兴建筑师！"
 ire.250.b:0 "奥达菲掌权，并粉碎其身后的一切！"
 ire.17.t:0 "1942年爱尔兰大选"
 ire.17.d:0 "柯林斯继续担任爱尔兰总统，选举每五年举行。如上次大选一样，主要参选的有新芬党、共和党和[GetIreAgrarianParty]。"
 ire.17.a:0 "我们英雄的又一次伟大胜利！"
 ire.18.t:0 "1942年爱尔兰大选"
 ire.18.d:0 "柯林斯已经出局，选举每五年举行一次。像上一次选举那样，除统一党外，主要参选的还有新芬党、爱尔兰共和党和[GetIreAgrarianParty]。"
 ire.18.a:0 "新芬党赢得了选举！"
 ire.18.b:0 "[GetIreAgrarianPartyShort]获选！"
 ire.18.c:0 "统一党连任！"
 ire.18.e:0 "共和党大胜！"
 ire.19.t:0 "约恩·奥达菲之死"
 ire.19.d:0 "约恩·奥达菲，我国的总理，今日在睡梦中死去。柯林斯任命理查德·马尔卡希接替其职责。"
 ire.19.a:0 "凡人终有一死"
 ire.20.t:0 "约恩·奥达菲之死"
 ire.20.d:0 "约恩·奥达菲，我国在柯林斯政权时的总理，今日在睡梦中死去。"
 ire.20.a:0 "凡人终有一死"
 ire.21.t:0 "1947年爱尔兰大选"
 ire.21.d:0 "如上次大选一样，主要参选的有新芬党、共和党和[GetIreAgrarianParty]，但仍有其他政党可能撼动政局，前提是它们选票够多。"
 ire.21.a:0 "柯林斯又……赢了"
 ire.22.t:0 "1947年爱尔兰大选"
 ire.22.d:0 "随着民主重回爱尔兰，自由而公正的选举每五年举行一次。时光荏苒，不少老牌政党在爱尔兰政界已不成气候，只有一些主流政党和新晋政党能够引领爱尔兰走向未来。这场选举的赢家是谁？"
 ire.22.a:0 "新芬党胜选！"
 ire.22.b:0 "[GetIreAgrarianPartyShort]胜选！"
 ire.22.c:0 "爱尔兰统一党胜选！"
 ire.33.t:0 "麦克尼尔委员会"
 ire.33.d:0 "在阿尔斯特统一派抗议游行中发生暴力行为之后，贝尔法斯特的居民将这个事件称之为“血腥星期三”。政府已经对军方的参与大屠杀的罪责进行了全面调查。在雨果·麦克尼尔的领导下，该委员会提交了他们的初步报告。麦克尼尔认为，与利亚·姆林奇及其士兵的说法相反，统一派示威者并不是煽动对进行军队冲突的那一方。相反，他认为林奇和他的军队一直在试图开始战斗，然后通过在死亡的示威者上放上武器，制造自己正当反击的证据。如果这些指控是真实的，这无疑令人感到震惊，这将可能对爱尔兰共和军有非常深远的影响。"
 ire.33.a:0 "尊重委员会的调查。林奇和军队是错的那一方"
 ire.33.b:0 "有错的是军方，但林奇当时无法做任何事情来阻止这一切的发生"
 ire.33.c:0 "显然，统一主义者引起了这场争执，林奇和军队没有做错什么"
 ire.34.t:0 "利亚姆·林奇的审判"
 ire.34.d:0 "利亚姆·林奇今天被带到了爱尔兰共和军最高法庭，并被指控煽动，甚至有亲自组织屠杀的嫌疑。这种直接违反军规的后果是非常严重的。公众对麦克尼尔委员会的调查结果感到愤怒并要求其血债血偿，阿尔斯特的民众也同样如此。但是，林奇是否真的有罪是由法庭决定的，如果有罪，应该处于什么惩罚。"
 ire.34.a:0 "林奇有罪。解除其军职并监禁他"
 ire.34.b:0 "林奇有罪。他将被枪毙"
 ire.34.c:0 "林奇无罪。释放他"
 ire.34.lynch.imprisoned:0 "§Y利亚姆·林奇§!将被§O监禁§!。"
 ire.34.lynch.dead:0 "§Y利亚姆·林奇§!将被§R处决§!。"
 ire.34.lynch.tooltip:0 "§Y利亚姆·林奇§!不能被§O监禁§!或者§R处决§!。"
 ire.35.t:0 "整合问题"
 ire.35.d:0 "从一开始就很明显，爱籍美国人融入到我们的共和国中会产生一些问题。比较富有的人注意到我们这里不如美国民主，而不太富裕的人则认为他们正在被爱尔兰企业所剥削。当地人也有很多不满，因为他们认为新来的人抢了他们的工作，而且他们的文化传统不符合当地的爱尔兰文化。最重要的是，统一派认为移民实质是共和国对阿尔斯特的殖民，因为有许多人已经在那里定居下来。"
 ire.35.a:0 "我们必须做些什么！"
 ire.36.t:0 "统一主义者抗议游行"
 ire.36.d:0 "今天早上，贝尔法斯特传出了一个大新闻，统一主义者正在组织抗议游行，反对他们认为的都柏林政府提出的不公平待遇。自从爱尔兰独立以来，阿尔斯特的人民已经变得越来越边缘化，并试图‘绿化’该地区，以清除英国殖民统治的遗留问题。大多数爱尔兰人或政府都不希望游行不受阻碍。但停止它只会使情况变得更糟……"
 ire.36.a:0 "这明显就是想搞事，阻止游行"
 ire.36.b:0 "这是他们民主应有的权利，让他们继续下去"
 ire.63.t:0 "阿尔斯特谋杀案"
 ire.63.d:0 "爱尔兰统一党当地的党委书记，辛妮·奥康奈尔，今天早上被发现死在了怀特阿比的岸边，距离首邑只有几英里之遥，她的尸体显然被从谋杀现场带走了一些距离。一封声称对此负责的信件送到了贝尔法斯特的警察部队总部，据称是阿尔斯特志愿军送出的。这起谋杀似乎是对政府最近企图禁止统一派抗议游行的报复行为。谋杀的消息在全国范围内蔓延开来，民众无不震惊。"
 ire.63.a:0 "这太可怕了，我们必须要在阿尔斯特做些什么才行"
 ire.37.t:0 "统一主义者造成的紧张局势"
 ire.37.d:0 "在当地一名政府代表宣布官方将不会做出任何阻止统一派抗议游行的努力之后，当地天主教居民表达了对该地区警察部队强烈的担忧。他们声称，抗议游行只不过是在贝尔法斯特试图恐吓天主教社区的一个隐晦的企图，他们发现仍然是新教人数（主要是统一派）占多数。这些要求并没有被置若罔闻，而且越来越多的呼声要求爱尔兰共和军沿着游行计划的路线部署军队，以保护天主教社区，确保事情不会失控。"
 ire.37.a:0 "我们必须保护少数天主教徒。他们是爱尔兰真正的子女"
 ire.37.b:0 "部署军队对抗我们的人民？无稽之谈。让警察部队去干这事吧"
 ire.39.t:0 "谁来领导军队？"
 ire.39.d:0 "政府已经决定将爱尔兰共和军部署到贝尔法斯特，以确保在即将到来的统一派抗议游行中确保天主教徒的安全，现在需要决定一名总指挥官。"
 ire.39.a:0 "汤姆·巴里是我们的最佳选择"
 ire.39.b:0 "马尔卡希会控制住局面"
 ire.39.c:0 "利亚姆·林奇将会保护天主教人口"
 ire.39.e:0 "雨果·麦克尼尔将会控制住现在的情况"
 ire.38.t:0 "游行开始"
 ire.38.d:0 "尽管人们心中充满了疑虑，但政府还是同意了阿尔斯特统一主义运动进行游行活动。这一天，贝尔法斯特愁云笼罩，大雨将倾。有些人祈祷这座城市能下起暴雨，这样能使这场游行有所推迟。然而，统一主义者领导人的决定不会改变，风雨无阻。爱尔兰政府投票，选择不在贝尔法斯特街道上布置军队，让当地的警察部队来监督这次游行活动。"
 ire.38.d2:0 "尽管人们心中广泛的存在疑惑，政府同意了阿尔斯特统一主义运动进行他们的游行活动。这一天，贝尔法斯特愁云笼罩，阴雨连绵，暴雨如注的天气曾让人期望这场游行能够有所推迟。然而，统一主义者领导人的决定不会改变，风雨无阻。爱尔兰当局由于担忧当地天主教少数派的安全，因此将第三集团军部署于贝尔法斯特。利默里克狙击手也进入了城市。军队控制了抗议游行路线上的战略位置，并且由约恩·奥达菲在贝尔法斯特中央指挥部进行指挥。"
 ire.38.d3:0 "尽管人们心中广泛的存在疑惑，政府同意了阿尔斯特统一主义运动进行他们的游行活动。这一天，贝尔法斯特愁云笼罩，阴雨连绵，暴雨如注的天气曾让人期望这场游行能够有所推迟。然而，统一主义者领导人的决定不会改变，风雨无阻。爱尔兰当局由于担忧当地天主教少数派的安全，因此将第三集团军部署于贝尔法斯特。利默里克狙击手也进入了城市。军队控制了抗议游行路线上的战略位置，并且由理查德·马尔卡希在贝尔法斯特中央指挥部进行指挥。"
 ire.38.d4:0 "尽管人们心中广泛的存在疑惑，政府同意了阿尔斯特统一主义运动进行他们的游行活动。这一天，贝尔法斯特愁云笼罩，阴雨连绵，暴雨如注的天气曾让人期望这场游行能够有所推迟。然而，统一主义者领导人的决定不会改变，风雨无阻。爱尔兰当局由于担忧当地天主教少数派的安全，因此将第三集团军部署于贝尔法斯特。利默里克狙击手也进入了城市。军队控制了抗议游行路线上的战略位置，并且由利亚姆·林奇在贝尔法斯特中央指挥部进行指挥。"
 ire.38.d5:0 "尽管人们心中广泛的存在疑惑，政府同意了阿尔斯特统一主义运动进行他们的游行活动。这一天，贝尔法斯特愁云笼罩，阴雨连绵，暴雨如注的天气曾让人期望这场游行能够有所推迟。然而，统一主义者领导人的决定不会改变，风雨无阻。爱尔兰当局由于担忧当地天主教少数派的安全，因此将第三集团军部署于贝尔法斯特。利默里克狙击手也进入了城市。军队控制了抗议游行路线上的战略位置，并且由雨果·麦克尼尔在贝尔法斯特中央指挥部进行指挥。"
 ire.38.a:0 "让我们祈祷天气是今天唯一的坏新闻"
 ire.40.t:0 "阿尔斯特统一主义者抗议游行"
 ire.40.d:0 "今天，当阿尔斯特统一主义抗议游行顺利进行的时候，全国上下都松了一口气。尽管有人担心统一主义者可能会将他们的沮丧转化为暴力，但最终这些担忧并未实现。尽管抗议游行已被证明是对国家有争议的事件，但至少它没有导致今天发生流血事件。尽管如此，统一主义者对独立的日益增长的需求不能再被忽视了。要解决阿尔斯特的问题，必须采取果断的行动，以免局势失控。"
 ire.40.d2:0 "紧随阿尔斯特统一派的抗议游行而来的可怕消息传遍了全国。事情的全貌尚未理清，不过据说，由汤姆·巴里带领的爱尔兰共和军部队和几名抗议者之间爆发了冲突。由此引发的暴力事件使得许多抗议者死在了军队的枪口下，而这一事件很快就使阿尔斯特地区陷入了一片愤怒之中。有些人疾呼复仇，还有的要求正义，但是，我们可以肯定的是：这是爱尔兰黑暗的一天。"
 ire.40.d3:0 "今天，当阿尔斯特统一主义抗议游行继续进行时，全国上下都松了一口气。在由理查德·马尔卡希带领的爱尔兰共和军的监视下，抗议者被护送通过了天主教地区，中途只发生了些轻微的事件。抗议游行在公众和政界眼中都是一件极具争议性的事情，许多人都很高兴它已经平安结束。然而，很明显，贝尔法斯特的气氛目前仍是紧张的，许多统一主义者对唐突出现的军队并不友好。"
 ire.40.d4:0 "今天，阿尔斯特统一派抗议活动被破坏了，因为在统一派的抗议者和愤怒的天主教公民之间爆发了广泛的战斗。目前还不清楚是谁掷出了第一块石头或是打响了第一枪，但有几人死亡，多人受伤。这一事件只是另一个北爱尔兰迅速增长的令人担忧的迹象。这真是这个国家黑暗的一天。"
 ire.40.d5:0 "紧随阿尔斯特统一派的抗议游行而来的可怕消息传遍了全国。事情的全貌尚未理清，不过据说，由利亚姆·林奇带领的爱尔兰共和军部队和几个抗议者之间爆发冲突。由此引发的暴力事件使得许多抗议者死在了军队的枪口下，而这一事件很快就使阿尔斯特地区陷入了一片愤怒之中。有些人疾呼复仇，还有的要求正义，但是，我们可以肯定的是：这是爱尔兰黑暗的一天。"
 ire.40.d6:0 "今天，当阿尔斯特统一主义抗议游行继续进行时，全国上下都松了一口气。在由雨果·麦克尼尔带领的爱尔兰共和军的监视下，抗议者被护送通过了天主教地区，中途只发生了些轻微的事件。抗议游行在公众和政界眼中都是一件极具争议性的事情，许多人都很高兴它已经平安结束。然而，很明显，贝尔法斯特的气氛目前仍是紧张的，许多统一主义者对唐突出现的军队并不友好。"
 ire.40.a:0 "为什么会这样？！"
 ire.40.b:0 "军队干的不错"
 ire.40.c:0 "令人松一口气"
 ire.40.e:0 "这太不像话了"
 ire.40.f:0 "为什么会这样！？"
 ire.40.g:0 "军队干的不错"
 ire.41.t:0 "马尔卡希委员会"
 ire.41.d:0 "在阿尔斯特统一派抗议游行中发生暴力行为之后，贝尔法斯特的居民将这个事件称之为“血腥星期三”。政府已经对军方的参与大屠杀的罪责进行了全面调查。在理查德·马尔卡希的领导下，该委员会提交了他们的初步报告。马尔卡希认为，与汤姆·巴里及其士兵的说法相反，冲突的始作俑者并非统一派示威者，巴里那边才是早有预谋寻求无力对抗，然后通过在在死亡的示威者上放上武器，制造自己正当反击的证据。如果这些指控是真实的，这无疑令人感到震惊，这将可能对爱尔兰共和军有非常深远的影响。"
 ire.41.a:0 "尊重委员会的调查。奥达菲和军队是错的那一方"
 ire.41.b:0 "有错的是军方，但奥达菲当时无法做任何事情来阻止这一切的发生"
 ire.41.c:0 "显然，统一主义者引起了这场争执，奥达菲和军队没有做错什么"
 ire.42.t:0 "审判汤姆·巴里"
 ire.42.d:0 "汤姆·巴里今天被带到了爱尔兰共和军的最高法庭，并被指控煽动，甚至有亲自组织屠杀的嫌疑。这种直接违反军规的后果是非常严重的。公众对马尔卡希委员会的调查结果感到愤怒并要求其血债血偿，阿尔斯特的民众也同样如此。但是，巴里是否真的有罪是由法庭决定的，如果有罪，应该处于什么惩罚。"
 ire.42.a:0 "巴里有罪，解除军职并处以监禁"
 ire.42.b:0 "巴里有罪，枪毙之"
 ire.42.c:0 "巴里无罪，释放之"
 ire.42.oduffy.imprisoned:0 "§Y汤姆·巴里§!将被§O监禁。§!"
 ire.42.oduffy.dead:0 "§Y汤姆·巴里§!将被§R处决。§!"
 ire.42.oduffy.tooltip:0 "§Y汤姆·巴里§!不会被§O监禁§!或§R处决。§!"
 ire.uq.tooltip:0 "当阿尔斯特的未来再次被提上日程时解锁。"
 ire.43.t:0 "贝尔法斯特工团主义工人暴乱"
 ire.43.d:0 "在英国人的影响力被驱逐出爱尔兰之后，许多天主教企业主在阿尔斯特的地位急剧上升。然而，他们的社会以及经济地位的上升往往意味着牺牲了该地区的新教居民的利益，而这些居民曾经对天主教少数民族占统治地位。一群阿尔斯特工团主义工人今天因天主教雇主对其薪资待遇问题而进行罢工。当他们受到某些显然是被雇用的暴徒的袭击后，他们的抗议活动很快就变成了一场暴乱。虽然贝尔法斯特市医院有很多伤者仍然在等待处理伤口，所幸无人死亡。这显然加重了阿尔斯特的紧张局势。"
 ire.43.a:0 "令人担忧"
 ire.44.t:0 "德里谋杀案"
 ire.44.d:0 "今晨，德里市中心附近的一条冷清小巷里发现了一具年轻男尸。据后续警察报告，死者身中数刀遭弃尸街头。这名男子此前曾被当地警方认定是一个统一派水边地方志愿组织的杰出成员。已经有人说谋杀是天主教徒所为，警察会睁一只眼闭一只眼。无论这些说法有多合理或多不合理，阿尔斯特的情况一如既往地不稳定。"
 ire.44.a:0 "德里风雨飘摇"
 ire.45.t:0 "阿尔斯特统一党举行集会"
 ire.45.d:0 "今天下午，阿尔斯特统一派在贝尔法斯特市中心举行了一场盛大的集会。阿尔斯特成千上万的男男女女走出家门，在阳光下听取杰出的统一派演讲，有大量的时间唱歌和舞蹈，但也有同样多的时间来讨论阿尔斯特与爱尔兰其他地区的地位。随着言辞越来越激烈，虽然“反抗”或“起义”这几个字可能没有大声说出来，但他们肯定这样认为。爱尔兰政府极为关注参加集会的人数。显然，统一派运动享有广泛的民众支持。"
 ire.45.a:0 "这种运动变得越来越流行"
 ire.46.t:0 "安特里姆音乐厅遭到袭击"
 ire.46.d:0 "在阿尔斯特最近发生的令人震惊的事件中，安特里姆的一个音乐厅遭到了猛烈的攻击。据信是由阿尔斯特志愿军的新教异见组织实施的，袭击事件中，一些都柏林乐队的成员被枪杀，还有几名音乐会的观众。据信，此次袭击是针对爱尔兰政府的另一项恐怖主义行动，根据民众与警方的秘密通讯所说，只要阿尔斯特仍是爱尔兰的一部分，这种行为就会持续下去。"
 ire.46.a:0 "可怕"
 ire.47.t:0 "报复性枪击事件"
 ire.47.d:0 "似乎是为了回应阿尔斯特志愿军最近造成的暴力事件，五名与该组织有关联的男子被发现死于贝尔法斯特外20英里外的一个农场附近。受害者似乎是被处决的。据信，这些人在夜间被抓捕，并一起被杀，尽管目前还不知道是谁策划了这样的行动。随着形势的加剧，阿尔斯特的紧张局势正在加剧，爱尔兰政府正面临越来越强烈的抗议，他们显然无法解决本国的不稳定问题。"
 ire.47.a:0 "暴力循环仍在继续"
 ire.48.t:0 "克雷格发声"
 ire.48.d:0 "经过几年的沉默，阿尔斯特统一派的领袖公开发表关于阿尔斯特在爱尔兰的地位的讲话。据报道，自从1925年停火以来，詹姆斯·克雷格第一次以这样一种方式攻击爱尔兰政府，他表现得很活泼，心情也很好。他特别批评了迈克尔·柯林斯政权在过去十年间忽略了阿尔斯特的经济建设。并要求阿尔斯特儿女们做好为繁荣而战的准备，如果需要的话，也要为该地区的自由而战。"
 ire.48.a:0 "他本应该闭上他的嘴"
 ire.49.t:0 "贝尔法斯特市政厅爆炸案"
 ire.49.d:0 "由于贝尔法斯特市政厅发生了大规模的爆炸，五十人死亡，还有更多人受伤，恐惧蔓延在贝尔法斯特。令人震惊的袭击似乎是阿尔斯特志愿军武装恐怖袭击的最新进展，并在当地政治代表会议期间进行。托马斯·卡林，民族中央党的地方党委书记，已经确认是因此丧生的人之一。这次袭击吓倒了国家，阿尔斯特的紧张局势又一次令人难以置信，但这次却带来了毁灭性的后果。"
 ire.49.a:0 "活在当下"
 ire.50.t:0 "大歌剧院火灾"
 ire.50.d:0 "恐惧蔓延在贝尔法斯特大歌剧院。在当晚的娱乐活动中，数百人被迫撤离，当时爆发了一场大规模的火灾，转瞬间火焰就吞噬了许多历史悠久的大厅。据说有35人遇难死亡，死亡人数可能很快就会上升，许多人仍是失踪状态，搜救工作正在进行中。目前仍不清楚起火原因，但阿尔斯特的统一派再次批评政府，他们声称这一事件本可以避免，因为之前他们曾向政府提出过相关要求。"
 ire.50.a:0 "一场灾难"
 ire.51.t:0 "爱尔兰银行抢劫案"
 ire.51.d:0 "今日，位于贝尔法斯特的爱尔兰银行被几名持枪蒙面歹徒抢劫，劫匪的身份据信是统一主义的异见者。当下，卫队正四处进行搜捕，但他们很有可能躲进了统一主义者的社区内，被他们庇护了起来。"
 ire.51.a:0 "在找到这些人之前不许休息！"
 ire.52.t:0 "都柏林爆炸案"
 ire.52.d:0 "今天上午十点半，都柏林的四法院发生了大规模爆炸。据说有500人死亡，当官方统计死亡人数时，可能还会上升。两名爆炸事件嫌疑人在被要求放下武器时试图逃离现场而被卫兵开枪打死，其中至少有一名男子被认定为贝尔法斯特本地人，与已知的统一派成员关系密切。阿尔斯特的冲突不断升级，这无异于向爱尔兰和她的人民宣战，而公众也进行了强烈抗议。爱尔兰人民正在流血，而阿尔斯特可能不得不为此付出代价。"
 ire.52.a:0 "不能一直这样下去了"
 ire.58.t:0 "工团主义者策划起义？"
 ire.58.d:0 "现在，我们不幸地发现自己处于一种战争状态，从阿尔斯特传来了不同寻常的反对意见。据说阿尔斯特统一派正在考虑他们的选择，而爱尔兰共和军正陷入持续的冲突中，他们很可能利用这个机会尝试脱离共和国。这种行动的后果对国家来说十分严重，因为他们可能会试图与我们的敌人结盟，并为入侵爱尔兰提供一个完美的基地。"
 ire.58.a:0 "是不是嫌我们事儿还不够多？"
 ire.133.t:0 "阿尔斯特统一主义者宣布独立"
 ire.133.d:0 "在数月的紧张局势升级后，不可避免的事情发生了。阿尔斯特统一派的成员人数上升，新教徒们煽动詹姆斯·克雷格要求与爱尔兰共和国分离。他们已经声明，不管他们付出多少鲜血死亡，他们都会捍卫他们新宣布的自由。贝尔法斯特已经设立了路障，许多新教民兵纷纷加入到统一派中。爱尔兰内战打响了，而这次将不会和1925年一样停火。不管怎样，阿尔斯特的命运都将被永远决定。"
 ire.133.a:0 "他们是爱尔兰的敌人，我们会消灭他们"
 ire.133.b:0 "自由阿尔斯特万岁！"
 ire.134.t:0 "与统一主义者的战争"
 ire.134.d:0 "今天早上众议院传出的消息是响亮而明确的：阿尔斯特将永远不会独立。当爱尔兰共和军准备进军阿尔斯特并恢复秩序时，爱尔兰民众松了一口气。希望冲突能够迅速和果断地解决。"
 ire.134.a:0 "前方开路！"
 ire.135.t:0 "爱尔兰内战"
 ire.135.d:0 "我们位于爱尔兰海对岸的邻居陷入了一场内战。根深蒂固的阿尔斯特统一派问题已经达到了临界点，当地宣布从爱尔兰独立并开始组建军队。如果我们在这时支持阿尔斯特，无疑会对爱尔兰造成致命的打击，从而兵不血刃地夺回北爱尔兰。诚然，我们无法排除其他欧洲国家插手的可能，但联盟的决心不是那些资本家所能理解的。"
 ire.135.a:0 "我们会帮助他们"
 ire.135.b:0 "提供支援，但不能太多"
 ire.135.c:0 "任他们自生自灭"
 ire.136.t:0 "不列颠联盟派遣志愿军"
 ire.136.d:0 "不列颠联盟已经研究决定了，他们派遣了一支军队前往阿尔斯特来援助我们击败爱尔兰专制政权。虽然我们很清楚天下没有免费的午餐，但我们将能够充分利用这些身经百战、装备精良的部队来帮助我们进行内战。"
 ire.136.a:0 "我们对他们的帮助感到高兴"
 ire.136.b:0 "我们会好好用的"
 uls.uob.volunteers.large:0 "在贝尔法斯特组建§Y6§!支师。"
 uls.uob.volunteers.small:0 "在贝尔法斯特组建§Y3§!支师。"
 ire.137.t:0 "英国志愿军抵达贝尔法斯特"
 ire.137.d:0 "在贝尔法斯特的爱尔兰间谍今天报道了令人不安的消息，数千名英国志愿军，也就是换了名字的英国正规军，最近抵达了贝尔法斯特。很明显，不列颠联盟正在努力支持阿尔斯特统一派事业，这对我们的斗争而言简直是雪上加霜。"
 ire.137.a:0 "让英国佬见鬼去吧，胜利属于我们"
 ire.138.t:0 "工团主义者干涉爱尔兰"
 ire.138.d:0 "今天爱尔兰的情报官员报告说，不列颠联盟的工团主义政权派遣了一批规模相当大的‘志愿军’来帮助北爱尔兰的阿尔斯特叛军。这显然是一次旨在战胜爱尔兰政府的秘密军事行动。德国军队内的许多反工团主义强硬派呼吁通过援助爱尔兰来回击愚蠢的英国人，尽管许多人认为这不是我们的战斗，但我们的部队可以在别处被更好的使用。"
 ire.138.a:0 "是可忍孰不可忍，支援爱尔兰"
 ire.138.b:0 "我们将腾出一部分军队"
 ire.138.c:0 "这真的和我们没关系"
 ire.139.t:0 "工团主义者干涉爱尔兰"
 ire.139.d:0 "今天爱尔兰的情报官员报告说，不列颠联盟的工团主义政权派遣了一批规模相当大的‘志愿军’来帮助北爱尔兰的阿尔斯特叛军。这显然是一次旨在战胜爱尔兰政府的秘密军事行动。加拿大军队内的许多反工团主义强硬派呼吁通过援助爱尔兰来回击愚蠢的英国人，很多人都同情阿尔斯特，如果我们站在爱尔兰一方，他们不会高兴的。"
 ire.139.a:0 "我们不能让爱尔兰落入工团主义者的手中，提供援助！"
 ire.139.b:0 "我们将腾出一些志愿军"
 ire.139.c:0 "阿尔斯特是我们的朋友！"
 ire.140.t:0 "德国提供援助"
 ire.140.d:0 "在英国干涉内战后，德国与爱尔兰达成了协议。为了抗衡工团主义军队所造成的影响，他们派出了自己的志愿军前往爱尔兰，加入我们与北方叛军以及英国二五仔的斗争。"
 ire.140.a:0 "我们很是感激"
 ire.ger.volunteers.large:0 "在都柏林组建§Y6§!支师"
 ire.ger.volunteers.small:0 "在都柏林组建§Y3§!支师"
 ire.141.t:0 "加拿大提供援助"
 ire.141.d:0 "目前流亡加拿大的前英国政府做出了出人意料的举动，他们承诺支持爱尔兰与阿尔斯特统一派及其支持者的斗争。加拿大军队的几个师于今晚抵达都柏林，他们很快就会开赴前线加入战争。"
 ire.141.a:0 "敌人的敌人是我的朋友"
 ire.can.volunteers.large:0 "在都柏林组建§Y6§!支师"
 ire.can.volunteers.small:0 "在都柏林组建§Y3§!支师"
 ire.142.t:0 "德国人对爱尔兰的援助"
 ire.142.d:0 "重大消息。看来德意志帝国已经决定增援他们的老朋友，几个德军师已经部署到了爱尔兰共和国。毫无疑问，南方的暴虐政府很快就会把德国人的枪口对准阿尔斯特的善良人民。"
 ire.142.a:0 "这不好"
 ire.143.t:0 "加拿大人对爱尔兰的援助"
 ire.143.d:0 "爱得深伤得深。我们多年以来效忠着的大英帝国，或者是它的残存势力已决定在战争中支持爱尔兰共和国，帮助他们夺取我们宝贵的阿尔斯特。加拿大军队已经抵达都柏林，不日便将开赴前线。统一派群体绝不会忘记这一天的。"
 ire.143.a:0 "嫌事情还不够糟是吧"
 ire.144.t:0 "德国人对爱尔兰的援助"
 ire.144.d:0 "大概是想回应我们派遣志愿军的举动，德意志帝国已承诺支持爱尔兰共和国的斗争，并派遣了一支相当大的志愿军分队参加这场冲突。看来，我们为支持阿尔斯特事业所作的工作并未被国际社会忽视，我们想为阿尔斯特而战也因此变得难上加难。"
 ire.144.a:0 "该死"
 ire.145.t:0 "加拿大人对爱尔兰的援助"
 ire.145.d:0 "雪上加霜。尽管与爱尔兰的关系十分复杂，但流亡的前英国政府已决定支持爱尔兰对抗阿尔斯特和我们的志愿军。虽无人敢直接挑明，但我们派志愿军去北爱尔兰的决定似乎已是一石激起千层浪。"
 ire.145.a:0 "小挫折而已……"
 ire.146.t:0 "阿尔斯特起义被镇压！"
 ire.146.d:0 "在都柏林兴高采烈的人群中，政府和军方军官在振奋人心的演说中宣布爱尔兰共和国赢得了压倒性的胜利，彻底击败了阿尔斯特的统一派叛军。内战固然血腥无比，胜利亦是靠着艰苦奋战与流血牺牲换来的，但政府已作出承诺，阿尔斯特问题再也不会困扰爱尔兰人民，统一派也被根除了。爱尔兰现代史上最具争议性的问题之一似乎终于得到了解决。"
 ire.146.a:0 "爱尔兰万岁！"
 ire.147.t:0 "爱尔兰的胜利"
 ire.147.d:0 "我们在爱尔兰的志愿军今日向最高指挥部发回消息，称他们圆满完成了派驻爱尔兰的任务。不列颠联盟虽试图插手内战之中，但在德国士兵以及装甲部队的支援下，爱尔兰共和军成功地镇压了阿尔斯特起义。这一动乱地区显然将重归稳定，我们派遣志愿军的决策正确性亦由此得证。"
 ire.147.a:0 "为爱尔兰三呼万岁，为德意志三呼万岁！"
 ire.148.t:0 "爱尔兰的胜利"
 ire.148.d:0 "今天上午，我们驻爱尔兰军事代表团的总司令报告说，爱尔兰共和军重新占领了阿尔斯特，彻底粉碎了叛军的起义。尽管工团主义者对前大英帝国的核心造成了威胁，但爱尔兰军队在我们的帮助下取得了胜利。阿尔斯特问题似乎已被彻底解决了，爱尔兰已重归统一。"
 ire.148.a:0 "他们不愧是战斗的爱尔兰人！"
 ire.149.t:0 "阿尔斯特被击败"
 ire.149.d:0 "我们虽竭尽全力，但阿尔斯特起义已被爱尔兰共和国彻底镇压。我们于今早收到报告，爱尔兰共和军已完全占领了德里和贝尔法斯特地区的主要城市。我们不知道统一派的领导人遭遇了什么，但毫无疑问，残暴的爱尔兰政府枪决了他们。我们插手爱尔兰事务的企图让我国如今骑虎难下，有些政府内部人士甚至认为我们早该让阿尔斯特自己打自己的去。"
 ire.149.a:0 "不列颠联盟最终仍占上风"
 IRE_unionists_pacified:0 "已通过内战或谈判使统一派平定。"
 ire.151.t:0 "还阿尔斯特以和平？"
 ire.151.d:0 "这是一场漫长而血腥的斗争，但阿尔斯特已在爱尔兰共和国的侵略下坚持了一年，天主教徒也好，新教徒也罢，许多人都因此失去了生命。若是他们承认我们有独立的权利，我们便可与爱尔兰共和国达成和平。如果我们希望避免一场长久的冲突，这肯定是最好的行动方针。"
 ire.151.a:0 "向都柏林提出我们的条件"
 ire.151.b:0 "我们将继续战斗下去，决不投降！"
 ire.152.t:0 "统一派提出和平协议"
 ire.152.d:0 "阿尔斯特叛军的领袖，詹姆斯·克雷格，向都柏林提出了他的和平条件。为了结束内战，他要求共和国承认阿尔斯特的自由和独立。诚然，与北方人的内战并没有像许多人想象的那样迅速结束，但承认阿尔斯特的自由独立对爱尔兰政府来说无异于政治自杀。尽管如此，有些人可能会认为这是和平终结这场冲突的唯一办法。"
 ire.152.a:0 "他们开什么玩笑，接着打"
 ire.152.b:0 "必须达成和平，给他们想要的吧"
 ire.153.t:0 "都柏林拒绝和平"
 ire.153.d:0 "爱尔兰众议院的回答简明扼要：在我们无条件投降之前绝不会同意和平。这场战争会继续，直到我们在爱尔兰人的鲜血中获得自由，或者战斗至最后一人。"
 ire.153.a:0 "就这样吧"
 ire.154.t:0 "终于和平"
 ire.154.d:0 "爱尔兰政府居然同意了我们提出的和平提议，他们同意止戈停战，承认阿尔斯特的独立。这是阿尔斯特人民光荣的一天，他们如今终于摆脱了爱尔兰人的暴虐统治及其对新教传统与文化的漠视。战火硝烟已然消散，和平即将回归爱尔兰岛。新生的自由阿尔斯特亦拥有着充满希望的未来，那些为统一派事业抛头颅洒热血的男女老少则是这一未来的坚定保障！"
 ire.154.a:0 "这是一场伟大的胜利！"
 ire.155.t:0 "是否该寻求帮助？"
 ire.155.d:0 "我们介入爱尔兰内战的决定似乎捅了资本家们的马蜂窝，与爱尔兰友好的国家派遣了志愿军来帮助他们镇压统一派的叛乱。我们的志愿军虽算不得光明正大，却也大大帮助了统一派，同时也是保卫爱尔兰的一道防线。然而，既然敌人的志愿军加入了共和军一方，那么老实说，我们似乎并未在爱尔兰内战中占据优势。倘若我们继续以“志愿军”的名头派遣我国军队，它便极有可能被视为我们与欧洲和大西洋彼岸的敌对邻国的直接战争行为。但话说回来，要是我们能说服法国人向阿尔斯特提供援助，我们也许还能一扭颓势……"
 ire.155.a:0 "我们需要法国的援助"
 ire.155.b:0 "我们自己的事情自己干"
 ire.156.t:0 "不列颠联盟请求支援"
 ire.156.d:0 "不列颠联盟已向法兰西公社外交部发来正式请求。他们提请我方留心爱尔兰正在进行的内战，并请求我国派遣志愿军去帮助阿尔斯特分离主义者。但考虑到阿尔斯特起义者极端的反社会主义和新教原教旨主义性质，许多人兴许会对法国是否应当支持他们的事业心存疑虑。若同意这一请求，公社部队便会非正式地前往贝尔法斯特，帮助阿尔斯特人争取独立。"
 ire.156.a:0 "真是伟大的事业，为了让革命之火熊熊燃烧，我们将提供援助"
 ire.156.b:0 "谁稀罕他们的反动跟班啊？"
 ire.157.t:0 "法国同意了"
 ire.157.d:0 "法兰西公社同意了我们援助阿尔斯特的请求。一支法国“志愿军”分遣队正在前往贝尔法斯特，不日便将抵达前线，帮助我军抗击爱尔兰共和军。显然，这是爱尔兰-阿尔斯特内战的转折点！"
 ire.157.a:0 "很好"
 ire.159.t:0 "法兰西公社拒绝援助"
 ire.159.d:0 "不幸的是，法兰西公社并不认为爱尔兰地区正在发生的冲突对第三国际有任何意义可言，亦对阿尔斯特人的反动本质表示批评。看来，除了我们派出的志愿军，阿尔斯特人只能靠自己来对付人多势众的爱尔兰军队了。除了向爱尔兰政府直接宣战外，我们已经是尽己所能了。"
 ire.159.a:0 "他妈的法国佬"
 ire.158.t:0 "法兰西公社提供援助！"
 ire.158.d:0 "看来我们的盟友要比我们想的要多。在我们英国靠山的劝诱下，法兰西公社已同意向我们派遣数支志愿军。我们如今可谓是顺风顺水，有法国的支持，我们一定能战胜爱尔兰的威胁！"
 ire.158.a:0 "决不投降！"
 ire.160.t:0 "贝尔法斯特的法国军队？"
 ire.160.d:0 "贝尔法斯特的军事情报部门发来了一份令人吃惊的情报，打着“志愿军”旗号的法兰西公社军队已乘着运输船在贝尔法斯特城港口靠岸，不列颠顾问团以及统一派军官热烈欢迎了他们。显然，法国因为阿尔斯特问题派出了军队。同样显而易见的是，不列颠正试图通过扶持工团主义傀儡重夺爱尔兰岛。冲突再度愈演愈烈，但在问题解决之前，爱尔兰人绝不会放弃，并且会让法国人，英国人和统一派血债血偿。"
 ire.160.a:0 "这是我国领土，绝不轻言放弃"
 ire.161.t:0 "阿尔斯特自由了！"
 ire.161.d:0 "自由之声唤醒了勇敢无畏的阿尔斯特人民，他们亦准备以流血牺牲与武力斗争予以回应。斗争之路虽艰苦卓绝，但我们依旧击败了爱尔兰共和军，赢得了这场战争。我们赢得了独立，把爱尔兰共和国打了个落花流水。我们现在能够建立我们的临时政府，用公平合理的方法统治阿尔斯特。我们将保证新教徒的地位，和平地推进统一派的事业。"
 ire.161.a:0 "我们做到了"
 ire.162.t:0 "阿尔斯特胜利！"
 ire.162.d:0 "不幸的是，爱尔兰虽竭尽全力，他们还是败给了阿尔斯特人与他们的工团主义者后盾。工团主义国家又赢得了一个关键的盟友，这对德国来说实在不是个好消息。"
 ire.162.a:0 "该死！"
 ire.163.t:0 "阿尔斯特胜利！"
 ire.163.d:0 "在他们工团主义同盟的帮助下，阿尔斯特人成功打败了爱尔兰政府。我们先前对爱尔兰政府的支持让我们如今尴尬不已，因为大多数人都对统一派叛军心怀同情。"
 ire.163.a:0 "该死！"
 ire.164.t:0 "阿尔斯特胜利！"
 ire.164.d:0 "阿尔斯特起义者赢得了胜利，我们也成功地打击了爱尔兰！自资本压迫下解放爱尔兰的事业又更进了一步。"
 ire.164.a:0 "为了大不列颠！"
 ire.55.t:0 "复活节起义二十周年纪念日！"
 ire.55.d:0 "今天，1936年4月24日，是复活节起义二十周年纪念日。许多人曾担心庆祝活动无法如期举行，但总统办公室的一纸公告打消了所有的疑虑。\n\n庆典以穿过都柏林街头的盛大阅兵式作为开场，以在奥康奈尔街邮政总局前的庄严游行作为结束——二十年前的复活节次日，《爱尔兰共和国宣言》就是在这里发表的。军乐队用铜管和风笛演奏古老的盖尔风音乐，城市里万人空巷，甚至连利菲河的航船上都挤满了观众。\n\n庆典现场喜气洋洋，欢乐的气氛使人几乎忘记自己身处在一个经济濒临崩溃的国家。\n\n阅兵结束后，士兵们在邮政总局前列队立正。一名军官打扮的人走到他们面前，如二十年前的帕德里克·皮尔斯一样朗读了那份著名的宣言。然而，出乎人群和在场官员的意料，这名“军官”的来历并不简单。\n\n那人正是穿着独立战争时期将领制服的柯林斯总统，他面向所有人站定。这位爱尔兰的国父以他一贯的口吻说道："
 ire.55.a:0 "“爱尔兰同胞们……”"
 ire.56.t:0 "柯林斯发表全国讲话"
 ire.56.d:0 "“爱尔兰男女同胞们：在神与创造了古老的民族独立传统的先烈们名义下，爱尔兰，以我们之口，号召她的儿女们集合到她的旗帜之下，为她争取自由……”\n\n宣言宣读完毕后，全场陷入了短暂的沉默，而后热烈的掌声立刻席卷了全场。当人群渐趋平静后，他开始向全国发表坚定的讲话。他以坚定不移的语气承认了国家目前所面临的挑战，并敦促全体人民团结起来面对艰难险阻。他接着说，从军事的角度看，复活节起义注定要失败，但它是建立在绝望之谷的希望之巅上的——正如爱尔兰的目前处境。\n\n在演讲结束时，他宣布4月24日将成为爱尔兰官方的、每年一度的独立日。这既是爱尔兰与自身关系（他说这话时看向了为数寥寥的保王派听众）的崭新开始，亦是爱尔兰和整个世界关系的崭新开始。\n\n哪怕作最不乐观的总结，他的话语也得到了全体政坛人士的暗自钦佩。无论他们现在是什么地位，爱尔兰所有的政治运动，除了保王派以外，都可溯源到复活节起义，因此这也是少数能团结全国的事物之一。至于他所说的这个新开端意味着爱尔兰的未来是维持现状抑或是激进变革，倒是无关紧要的问题了。\n\n也就是在这一天，每个人都意识到，虽然局势动荡不安，他们却依旧拥有渴望已久的自由与独立。在这一瞬间，这便是无价珍宝。"
 ire.56.a:0 "不自由的爱尔兰永不安宁"
 ire.57.t:0 "驶向拜占庭"
 ire.57.a:0 "愿君安息"
 ire.228.t:0 "黑色星期一波及爱尔兰！"
 ire.228.d:0 "2月3日，德国股市暴跌，世界陷入萧条。自从英国大革命爆发，我们宣称自己为共和国，并断绝了与大英帝国的联系以来，爱尔兰的贸易一直依赖于德国和它的势力范围。危机对爱尔兰经济造成了严重影响，因为德国和其他欧洲贸易伙伴受到了危机的冲击。许多人争相寻找解决方案，大多数政党提议要么发展爱尔兰经济，要么等到德国经济复苏的时候再维持稳定。更激进的是，亲英的民族中央党主张放弃与欧洲大陆的贸易，并与协约国建立关系，经常发表带有反德言论的演讲。工团主义者也开始鼓吹革命，声称这场危机证明了资本主义的失败。"
 ire.228.a:0 "这可不是好事……"
 ire.229.t:0 "德国经济好转"
 ire.229.d:0 "德国政府已经开始改革经济以应对黑色星期一。随着经济的改善，我们两国间的贸易开始恢复，我国经济亦将借此恢复正常。"
 ire.229.a:0 "还行……"
 ire.230.t:0 "德国经济复苏"
 ire.230.d:0 "德国经济终于走出了黑色星期一，爱尔兰也得以恢复与德国的全面贸易。"
 ire.230.a:0 "好！"
 ire.231.t:0 "战争改善经济"
 ire.231.d:0 "战争的爆发让我国经济得以从黑色星期一中恢复。"
 ire.231.a:0 "至少有一个好处……"
 ire.232.t:0 "贸易协定"
 ire.232.d:0 "既然我们已经通过贸易协定与大英帝国建立了贸易关系，我们的经济就大大改善了。也许民族中央党自始至终都是对的。"
 ire.232.a:0 "好！"
 ire.233.t:0 "与英国的贸易"
 ire.233.d:0 "现在我们已经与不列颠联盟建立了贸易关系，我们的经济已经开始从与我们最大贸易伙伴的贸易中得到改善。"
 ire.233.a:0 "好！"
 ire.234.t:0 "黑色星期一结束！"
 ire.234.d:0 "爱尔兰现在终于摆脱了资本主义的压迫，我们的经济改革业已消除了黑色星期一的影响，资本主义的失败由此可见一斑。"
 ire.234.a:0 "好！"
 ire.235.t:0 "黑色星期一结束！"
 ire.235.d:0 "我们终于实现了爱尔兰自给自足的梦想，我国经济已不再依靠外贸行业，黑色星期一的影响也结束了！"
 ire.235.a:0 "好！"
 ire.236.t:0 "和美国的贸易"
 ire.236.d:0 "尽管美国的局势不稳定，但我们的贸易开放帮助改善了我们的经济。"
 ire.236.a:0 "好！"
 ire.237.t:0 "美国与经济"
 ire.237.d:0 "随着美国的稳定和爱尔兰与他们的亲密友谊，我们的贸易关系变得更加牢固，我们的经济也因此得到了改善。"
 ire.237.a:0 "好！"
 ire.238.t:0 "爱尔兰和帝国公约"
 ire.238.d:0 "尽管爱尔兰与德国之间的贸易关系在爱尔兰独立后一直很牢固，但爱尔兰仍在一定程度上脱离了欧洲经济，而倾向于保持中立。然而现在随着爱尔兰与中欧的密切联系，爱尔兰经济已经受益。"
 ire.238.a:0 "好！"
 ire.239.t:0 "黑色星期一结束！"
 ire.239.d:0 "归功于我国政府久久为功的经济和外交行动，爱尔兰经济终于摆脱了黑色星期一，走向复苏！"
 ire.239.a:0 "终于！"
 ire.240.t:0 "黑色星期一结束！"
 ire.240.d:0 "虽耗日持久，亦有人称政府本能做的更好，但“黑色星期一”危机对爱尔兰的影响终于还是结束了。"
 ire.240.a:0 "终于！"
 IRE_black_monday_1:0 "黑色星期一"
 IRE_black_monday_1_desc:0 "英国大革命爆发、不列颠倒向工团主义后，爱尔兰便断绝了同协约国的联系，贸易只能全部依赖于德国，因此，黑色星期一危机对爱尔兰造成了严重的影响。"
 IRE_black_monday_2:0 "黑色星期一"
 IRE_black_monday_2_desc:0 "黑色星期一虽仍深深地影响着爱尔兰，但爱尔兰已经走在了经济复苏的道路上。"
 IRE_black_monday_3:0 "黑色星期一"
 IRE_black_monday_3_desc:0 "爱尔兰经济业已复苏，虽长路漫漫，但黑色星期一的影响已开始消退。"
 IRE_black_monday_4:0 "黑色星期一"
 IRE_black_monday_4_desc:0 "爱尔兰经济正开始复苏，尽管仍有工作要做，但即将到头了。"
 IRE_black_monday_5:0 "黑色星期一"
 IRE_black_monday_5_desc:0 "黑色星期一虽让爱尔兰进入了困难时期，但其影响已几近荡然无存，黑暗尽头终于得现一丝光明。"
 ire.241.t:0 "乌戈·奥尼尔之死"
 ire.241.d:0 "我们的新国王奥德十一世今天去世了。他的儿子若热·马里亚·奥尼尔将以塞奥里斯一世的王名加冕。"
 ire.241.a:0 "旧王已死，新王登基！"
 IRE_market_liberal_party2:0 "共和协会"
 IRE_market_liberal_party2_long:0 "爱尔兰共和协会(Cumann Poblachta na hÉireann)"
 ire.15.c:0 "柯林斯宣布选举结果暂时无效！"
 ire.17.d.pataut:0 "1942年大选终于到来，爱尔兰人再次走向投票站。因为民主反对派在上次选举后基本被摧毁，爱尔兰统一党几乎所向披靡，许多选区的选票都只有统一党一个选项。选举结果公布，柯林斯和统一党拿到了众议院的所有席位，巩固了对爱尔兰的统治。"
 ire.21.d.pataut:0 "1947年大选终于到来，爱尔兰人再次走向投票站。现在反对派基本荡然无存，爱尔兰统一党再次赢得全部席位，柯林斯发表了纪念性的讲话，庆祝胜利。"
 ire.243.t:0 "布鲁的阿尔斯特政策"
 ire.243.d:0 "现在，1937年的选举已经结束，阿尔斯特地区的状况又一次引起了争论。新芬党赢得了选举，卡哈尔·布鲁阿将接任总统一职。新芬党抱持与统一党同样强烈的爱国主义，誓要对阿尔斯特统一主义重拳出击。这种方法不受和平主义者的欢迎，而且似乎与新芬党对非暴力手段的注重背道而驰。不管怎样，新政府对阿尔斯特的政策很可能将同柯林斯总统时期保持一致。"
 ire.243.a:0 "还是老样子"
 ire.244.t:0 "麦克德莫特的阿尔斯特政策"
 ire.244.d:0 "现在，1937年的选举已经结束，阿尔斯特地区的状况又一次引起了争论。选举的胜利者是民族中央党，弗兰克·麦克德莫特接任总统。他对阿尔斯特的政策是寻求与该地区达成妥协，他允许该地区在高度自治的情况下运作，但同时不对爱尔兰的其他地区进行进一步分权。希望这能在不久的将来避免围绕该地区的流血和冲突。"
 ire.244.a:0 "让我们达成妥协吧"
 ire.245.t:0 "瓦莱拉的阿尔斯特政策"
 ire.245.d:0 "现在，1937年的选举已经结束，阿尔斯特地区的状况又一次引起了争论。选举的胜利者是共和党，由埃蒙·德·瓦莱拉接任总统。德·瓦莱拉对阿尔斯特地区的政策是寻求与统一主义者妥协，实现权力下放，允许爱尔兰各地区，包括阿尔斯特在内高度自治。希望这能在不久的将来避免围绕该地区的流血和冲突。"
 ire.245.a:0 "加大分权力度"
