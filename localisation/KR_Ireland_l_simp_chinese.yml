 ire.2602.t:0 "总统职位的形式"
 ire.2602.d1:0 "总统职位的形式是话题争论的焦点。任期、选举方式及资格标准均已确定，但总统应该掌握什么权力仍存在争议。目前，在由法案、法定文书与判例法拼凑而成的现行制度中，爱尔兰总统掌握着广泛的行政权力，现行宪法中涉及该职位的只有只言片语。为了避免走向威权主义，总统的地位与权力必须被明确界定。\n\n第一种方案得到了统一党和陆军同志协会的支持，那就是同早已存在着的非正式制度无二的总统制：\n——“在不违反本宪法规定的情况下，国家行政权由总统行使或受总统授权行使。”\n这一制度力图效仿美利坚合众国，赋予总统明确载入宪法的行政权力。由选举产生、领导政府的总统是国家的主要领导人。\n\n反对方案得到了自由党、阿尔斯特统一派和新芬党的支持，即国家行政权由众议院选举产生的政府行使的议会制制度。\n——“总统应按照众议院之提名委派总理、组成政府。”\n这一制度与旧英国政府制度几无差别，都是让首相从议会成员中选出政府班子，而国家元首（倘若存在的话）的权力非常有限，主要仅掌握仪式上的权力，也只有在政府的建议下方可行使。此外，在本宪法通过后，还将选出一位新总统担任礼仪上的国家元首，为了更好地展示其手握的权力，目前的“首席部长”一职也将被“总理”取代。\n\n新芬党和共和党成员提出了一个非同寻常的混合型制度，总统掌握着一些行政权力，但需从爱尔兰众议院中选择政府成员，亦需与众议院选举产生的首席部长分享权力。这一制度先前曾在俄罗斯实践过，可作为议会制与总统制之间的折衷选择。"
 ire.2602.d2:0 "总统职位的形式是话题争论的焦点。任期、选举方式及资格标准均已确定，但总统应该掌握什么权力仍存在争议。目前，在由法案、法定文书与判例法拼凑而成的现行制度中，爱尔兰总统掌握着广泛的行政权力，现行宪法中涉及该职位的只有只言片语。为了避免走向威权主义，总统的地位与权力必须被明确界定。"
