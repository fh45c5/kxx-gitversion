 KXXJAP.139.c:0 "从橘孝三郎为首的农本主义者中选"
 KXXJAP.139.e:0 "老牌亚细亚革命者玄洋社最可靠！"
 KXXJAP.139.f:0 "出口王仁三郎，我们的救世主！"
