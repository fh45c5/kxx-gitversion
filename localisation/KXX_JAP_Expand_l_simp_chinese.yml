 JAPFOR_tokyo_conference:0 "召开东京会议"
 JAPFOR_tokyo_conference_desc:0 "泛亚思想得到了一大批政治派系的广泛支持，无论如何来说都是一种有用的工具。我们将在东京召开一场盛大的会议，邀请亚洲各国的外交官出席，促进亚洲各国为抵抗欧美帝国主义势力携手合作。"
 JAP_civilwar_lose:0 "内战局势恶化"
 KXXJAP.1.t:0 "崛起之龙还是KXX"
 KXXJAP.1.d:0 "KXX的日本内容来自崛起之龙（Rising-Dragon）这一模组，我们将在之后的版本里面脱离崛起之龙，打造全新的日本内容——旭日骨寒。目前的进度还不足以正常游玩，但仍然可以点出绝大部分崛起之龙的国策，请您选择您的路线。"
 KXXJAP.1.a:0 "玩崛起之龙"
 KXXJAP.1.b:0 "§R路线暂时封闭，请玩崛起之龙。§!"
