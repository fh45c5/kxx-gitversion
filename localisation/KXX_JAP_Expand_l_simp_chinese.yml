 JAP_suzuki_iron_fist_1:0 "铁腕喜三郎·初"
 JAP_suzuki_iron_fist_1_desc:0 "铃木喜三郎首相采取强硬手段维护社会秩序，提升军队士气。"
 JAP_suzuki_iron_fist_2:0 "铁腕喜三郎·进"
 JAP_suzuki_iron_fist_2_desc:0 "强化军警统治，加大对反对势力的压制，军队战斗力进一步提升。"
 JAP_suzuki_iron_fist_3:0 "铁腕喜三郎·极"
 JAP_suzuki_iron_fist_3_desc:0 "建立完全的独裁统治，军队达到最高战斗状态。"
 JAP_mori_kaku_1:0 "森恪外交·初"
 JAP_mori_kaku_1_desc:0 "森恪推行积极的对华外交政策，为对外扩张做准备。"
 JAP_mori_kaku_2:0 "森恪外交·进"
 JAP_mori_kaku_2_desc:0 "提出明确的大陆政策，积极推动对中国的渗透和扩张。"
 JAP_mori_kaku_3:0 "森恪外交·极"
 JAP_mori_kaku_3_desc:0 "全面推行森恪的大陆政策，确立日本在亚洲的霸权目标。"
 JAP_maeda_yonezo_1:0 "米藏产业·初"
 JAP_maeda_yonezo_1_desc:0 "前田米藏推行产业振兴政策，促进中小企业发展。"
 JAP_maeda_yonezo_2:0 "米藏产业·进"
 JAP_maeda_yonezo_2_desc:0 "扩大产业扶持范围，推动重工业和国防产业发展。"
 JAP_maeda_yonezo_3:0 "米藏产业·极"
 JAP_maeda_yonezo_3_desc:0 "实现产业全面升级，建立强大的国防工业体系。"
 JAP_kuhara_fusanosuke_1:0 "久原便宜·初"
 JAP_kuhara_fusanosuke_1_desc:0 "久原房之助推行便宜主义政策，促进军需产业发展。"
 JAP_kuhara_fusanosuke_2:0 "久原便宜·进"
 JAP_kuhara_fusanosuke_2_desc:0 "扩大军需生产规模，提升军队组织度。"
 JAP_kuhara_fusanosuke_3:0 "久原便宜·极"
 JAP_kuhara_fusanosuke_3_desc:0 "建立完整的军需工业体系，大幅提升军队战斗力。"
 JAP_takahashi_finance:0 "高桥财政"
 JAP_takahashi_finance_desc:0 "高桥是清推行的财政政策，通过基础设施建设和产业扶持促进经济复苏。"
 JAP_soldier_farmer_strategy:0 "兵农两全"
 JAP_soldier_farmer_strategy_desc:0 "鼓励农民同时参与军事训练，实现兵源与农业生产的双重保障。"
 JAP_emergency_measures_normalized:0 "非常时对策常态化"
 JAP_emergency_measures_normalized_desc:0 "将紧急状态下的经济管制措施常态化，加强国家对经济的调控能力。"
 JAP_suzuki_iron_fist:0 "铁腕喜三郎"
 JAP_suzuki_iron_fist_desc:0 "铃木喜三郎首相采取强硬手段维护社会秩序和政治稳定。"
 JAP_kokuhonsha_alliance:0 "国本社提携"
 JAP_kokuhonsha_alliance_desc:0 "与国本社等右翼团体合作，强化保守势力的政治影响力。"
 JAP_thought_crime_crackdown:0 "思想犯罪扩大化"
 JAP_thought_crime_crackdown_desc:0 "扩大对左翼思想和反政府言论的压制范围。"
 JAP_party_bureaucracy_strengthened:0 "政党官僚强化"
 JAP_party_bureaucracy_strengthened_desc:0 "加强政党对官僚体系的控制，提高行政效率。"
 JAP_tanaka_diplomacy:0 "田中外交"
