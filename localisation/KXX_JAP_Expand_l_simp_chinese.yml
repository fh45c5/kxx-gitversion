 KXXJAP.163.t:0 "新的首相人选"
 KXXJAP.163.d:0 "在历经四年的动荡之后，众议院终于迎来了下一届的选举。政党们在举国一致内阁期间势力此消彼长，政友会因为内斗而产生分裂，反主流派宣布退党，与宇垣将军青睐的民政党进行合并，目前在总选举中击溃政友会已经成为定局，新的国会仍然将置于举国一致之下。在军中，统制派与皇道派的派系斗争渐渐平息，但那些怀揣着革新政治愿望的军人们仍在行动，因宇垣的人事调整，出现了不少活动的新面孔，反向助推了社会大众党等革新政党的崛起。新时代的日本，将何去何从呢？"
 KXXJAP.163.a:0 "宇垣一成将军留任！"
 KXXJAP.163.b:0 "币原喜重郎男爵重新出山！"
 KXXJAP.163.c:0 "小矶国昭将军应当掌权！"
 KXXJAP.163.e:0 "或许我们应该从军中寻找新秀"
 KXXJAP.164.t:0 "宇垣一成将军的执政方向"
 KXXJAP.164.d:0 "宇垣一成将军肩负着引领国家走向稳定与繁荣的重任。在他的领导下，日本将继续推进军政一体化，加强国家的军事力量，同时也注重经济建设和社会改革。宇垣将军强调国家的统一与团结，致力于消除内部分歧，推动各阶层的合作与发展。而摆在他面前的则是帝国的不同势力：大大小小的贵族院官僚们期望让日本真正成为一个健康的现代国家，阻止无休止的多头纷争；而民党势力，特别是和宇垣将军关系密切的民政党，希望让众议院真正能展现自由主义的政治理念，推动社会进步与改革；而民间革新势力，则希望将军对农村土地改革、劳工权益等问题给予更多关注，推动社会公平与正义；最后是军中革新派，他们希望宇垣将军能继续推进军政一体化，强化国家的军事力量，以应对外部威胁。宇垣将军需要在这些不同的声音中找到平衡点，制定出符合国家利益的政策方向。" 
 KXXJAP.164.a:0 "超然主义乃是日本之常道"
 KXXJAP.164.b:0 "确保与众议院民党的联立"
 KXXJAP.164.c:0 "我们要在各个势力间寻求平衡"
 KXXJAP.164.e:0 "加强对农村的关注，与国家社会主义者合作"
 KXXJAP.164.f:0 "加强对农村的关注，与有马赖宁合作"
 KXXJAP.164.g:0 "与军中现存的统制派合流"
 KXXJAP.165.t:0 "政治新秀"
 KXXJAP.165.d:0 "军队中有许多新兴的政治力量，他们渴望通过改革来实现国家的现代化和强大。这些新秀们主张军政一体化，强调军事力量在国家建设中的重要性，在维护天皇国体的同时各有其特性。有主张实行国家社会主义的军官，也有主张深入学习普鲁士军国主义、日耳曼民族主义之人。这些新兴的政治力量或许能给国家带来真正的变革……" 
 KXXJAP.165.a:0 "大岛浩"
 KXXJAP.165.b:0 "松谷诚"
 KXXJAP.166.t:0 "松谷诚的意识形态问题"
 KXXJAP.166.d:0 "松谷诚认为世界之大势在于赤化，日本也要与时俱进。赤化和天皇制并不冲突，他和那些工团主义者与共产主义者不一样，会选取一条适合日本的路线。" 
 KXXJAP.166.a:0 "采用社民军政府"
 KXXJAP.166.b:0 "采用红色军政府"
 KXXJAP.166.c:0 "采用大众爱国主义"
 KXXJAP.167.t:0 "大岛浩的意识形态问题"
 KXXJAP.167.d:0 "大岛浩认为德意志帝国是世界强国的典范，日本应效仿其军国主义和国家主义的道路，强化军政一体化，推动国家的现代化和强大。" 
