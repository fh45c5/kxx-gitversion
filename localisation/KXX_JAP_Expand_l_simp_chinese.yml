 KXXJAP.144.t:0 "刀鞘里的谈判"
 KXXJAP.144.d:0 "陆军省顶层会议室残留着硝烟与消毒水的气味，半扇被炮弹震裂的窗户用木板钉死，风从缝隙嘶嘶渗入。真崎甚三郎背对门站立，指尖摩挲着窗框上嵌入的弹片——那是昨夜青年军官冲锋的遗物。荒木贞夫坐在主位，面前摊开的《戒严令施行纲要》墨迹未干。门轴发出干涩的呻吟。西田税踏入时，带进一股地下掩体特有的潮霉味。他穿着未佩军衔的昭五式制服，腰间军刀却按皇室御赐礼制悬挂，刀鞘金具在昏暗光线下闪着幽光。“恭喜阁下执掌枢机。”他嗓音平稳，没有丝毫畏惧的色彩。\n荒木未抬眼，钢笔尖在文件上戳出深痕：“动乱已息，西田君该去安抚‘维新志士’了。”真崎突然转身：“士兵们需要方向。西田君熟悉基层。”\n西田税解开刀带扣，将佩刀平放桌面。刀镡上的菊纹与荒木肩章金星冷冷相对：“流血的狗，总得闻见肉味。”窗外猛然传来广播车嘶吼：“……叛乱肃清！全军服从统帅部令！”声浪震得木板缝隙落灰簌簌。"
 KXXJAP.144.a:0 "“未尝不可以一试。”"
 KXXJAP.144.b:0 "“西田君还是去管思想指导局吧。”"
 KXXJAP.144.c:0 "“你我都太老了。”"
 KXXJAP.145.t:0 "“教父”的抉择"
 KXXJAP.145.d:0 "“西田君，”荒木贞夫开口，声音低沉但不容置疑，“局面已然如此。青年将校们只信你，我等亦以为，由你出面组阁，最能安抚人心，贯彻初衷。总理大臣的位置，非你莫属。”\n西田税沉默着，手指在茶杯边缘缓慢画圈。他抬眼看向两位大将：“北一辉先生呢？他在同志心中威望更高，理论更为深广。”\n真崎甚三郎沉声道：“北先生自然是精神领袖。然则眼下，需要的是能即刻站到台前，处理繁剧政务，平衡各方势力之人。西田君，你在军中根基深厚，与青年军官沟通无碍，又深谙政治运作，是最适合的人选。”他停顿一下，“北先生那边……我们已谈过。”\n西田税明白了。荒木和真崎需要的是一个能实际掌控局面、与他们合作的代理人，而非一个可能脱离掌控的思想巨人。他微微点头：“我明白了。”\n\n不久后，西田税在一处简陋的寓所见到了北一辉。政变成功的消息传来后，北一辉显得疲惫又亢奋，眼中闪烁着复杂的光。\n“西田君，”北一辉的声音有些沙哑，“他们找过你了？”\n“是，先生。”西田税恭敬地回答，“荒木、真崎两位大将的意思，是希望由我出面组阁，担任总理大臣。”\n北一辉靠在椅背上，望向纸门透进来的一点晨光，长长叹了口气，那叹息里既有夙愿得偿的欣慰，也有对血腥代价的沉重。他沉默片刻，脸上浮现一丝近乎苦涩的笑意：“他们做了决定。”\n“先生，”西田税身体微微前倾，“您才是我们思想的源头，是真正的领袖。若您愿意……”\n西田税没有继续说下去，等待北一辉给出反应，北低头思考着，过了好一会儿，才缓缓抬起头——"
 KXXJAP.145.a:0 "还是让西田君你来吧。"
 KXXJAP.145.b:0 "我将为为大义挺身而出。"
 KXXJAP.146.t:0 "狂妄之舞"
 KXXJAP.146.d:0 "西田税离开后，荒木贞夫和真崎甚三郎抽起了烟，他们脸上的疲惫更深了，眼神中带着一种近乎漠然的疏离。在某处俱乐部，青年军官们激烈的争论声浪几乎掀翻屋顶，他们带来的“胜利”已经变成了脱缰的野马。\n矶部浅一脖子上青筋毕露，猛地拍在桌面上：“野中君昨夜担当指挥，临危不乱，当为表率！他是陆军的人，由他出面，最能代表我等志士！”桌旁几个陆军尉官立刻附和。\n“哼！”一个穿着海军军服、神情同样亢奋的军官站了起来，他是海军右翼圈子的代表，“陆军？昨夜在皇居前唱响的《昭和维新之歌》，让整个东京都听见了我们的声音！那是三上卓中尉的词！论感召国民，凝聚人心，谁能比得过三上中尉？海军也出了力！”他的话引起了一些海军军官的赞同。\n野中四郎站在一旁，脸色有些苍白，眼神复杂。他昨夜确实在混乱中试图维持秩序，但深知这滔天巨浪绝非自己能掌控。三上卓被推到人前，他看起来比其他人更疲惫，甚至有些恍惚，但听到自己的名字和那首歌时，眼中闪过一丝狂热的光芒，随即又被更深的焦虑取代。\n“哈哈哈！诸位！诸位！莫要争执！”桥本欣五郎挺着肚子挤了进来，脸上堆着和事佬般的笑容，眼底却闪烁着精明的算计。“都是为陛下，为‘维新’大业！鄙人桥本，虽才疏学浅，但在军中和民间，也薄有虚名，愿为诸君分忧，担此重任！”他拍了拍胸脯，仿佛自己才是那个众望所归的人。\n房间里一时安静下来。陆军军官们带着鄙夷看着他，海军军官们则皱起了眉头。所有人都知道桥本欣五郎的底细——志大才疏，夸夸其谈，是个典型的酒囊饭袋。然而，在陆海军都试图推出自己人却又互不相让的僵局下，桥本的出现，反而像一块搅动浑水的石头，让局面变得更加混乱不堪。\n谁该上台？无人有绝对权威。野心、狂热、投机，在这片权力废墟之上，开始了无序而狂妄的舞蹈。荒木和真崎在隔壁房间听着隐约的争吵声，面无表情，选择了彻底的沉默。"
 KXXJAP.146.a:0 "野中四郎"
 KXXJAP.146.b:0 "三上卓"
 KXXJAP.146.c:0 "桥本欣五郎"
 KXXJAP.147.t:0 "双头政权"
 KXXJAP.147.d:0 "送走西田税，看着他略显落寞却依旧挺直的背影消失在陆军省幽深的走廊尽头，荒木贞夫和真崎甚三郎回到了那间临时用作指挥室的房间。沉重的木门隔绝了外界的喧嚣，只留下桌上冷掉的茶水和弥漫在空气中的复杂情绪——一丝对西田处置妥当的轻松，旋即被更深重的担忧取代。西田税这个烫手山芋被打发到相对务虚的机关，算是暂时搁置了一个麻烦，但最大的麻烦才刚刚开始：谁，现在该坐上那张空悬的、同时也是最危险的宝座？\n荒木贞夫没有立刻坐下，他踱到窗边，背对着房间，望着窗外尚未清理干净的、象征着昨夜激战的狼藉景象。阳光刺眼，却驱不散他心头的阴霾。他缓缓开口，声音低沉而疲惫：“真崎君，局面……依然棘手啊。”他没有提“总理”这个词，但两人都明白所指为何。\n真崎甚三郎坐在硬木椅上，双手交叠放在腹部，指关节有些发白。他同样盯着桌面，仿佛那上面刻着答案。“是啊，”他应道，语气同样沉重，“西田君算是安顿了那些青年军官的心，也给了他一个体面的位置。但真正担起这副担子的人……”他顿了顿，没有说下去，意思却再明白不过：这个人将直接面对国内外的滔天巨浪，成为所有愤怒和清算的靶子，失败的风险远大于成功的可能——这就是个“背锅”的绝命位置。\n房间陷入一阵压抑的沉默。两人心中都在飞速盘算。他们都清楚对方的份量，也深知自己同样处在风暴中心。推对方上去？这似乎是最“合理”的选择，既能保全自己，又能让对方承担最大的风险。但多年的同盟关系、共同的利益纽带，以及此刻风雨飘摇的处境，又让这种赤裸裸的推诿显得格外残酷和危险。\n荒木贞夫转过身，目光锐利地看向真崎，仿佛下定了某种决心。他走到真崎对面的椅子坐下，身体微微前倾，语气带着一种不容置疑的“坦率”：“真崎君，论资历，论在军中的根基，论处理眼下这种……嗯……复杂局面的能力，非你莫属啊。” 他刻意强调了真崎的“能力”和“根基”，仿佛在陈述一个客观事实，却巧妙地避开了“风险”二字。“我在后方，必定全力支持你，稳住陆军大局。这个位置，需要你这样的定海神针。”他将责任和风险，以一种看似推崇实则加压的方式，稳稳地推到了真崎面前。\n真崎甚三郎抬起头，迎上荒木的目光，脸上挤出一丝几乎是悲壮的笑容。他深吸一口气，声音不高，却异常清晰：“荒木君，这种时候，我们之间就不必推辞了。论威望，论在国内外的影响力，谁人能与荒木大将你相比？这个位置，只有你坐上去，才能最大程度地震慑反对者，稳住局面。我……我在下面，会竭尽全力协助你处理军务，确保陆军这条船不翻。”他以“影响力”和“震慑力”为名，将风口浪尖的位置连同其中的致命风险，不容分说地扣在了荒木头上。\n两人相视无言，便重新回到各自的座位上，心照不宣地继续处理着动荡的烂摊子。过了几十分钟后，一通电话打来，两人四目对视，知道决定武士命运的时刻已经到来……"
 KXXJAP.147.a:0 "荒木贞夫"
 KXXJAP.147.b:0 "真崎甚三郎"
 KXXJAP.148.t:0 "翼赞会崩溃危机"
 KXXJAP.148.d:0 "近卫文麿的公爵身份和“超然”姿态，最初为风雨飘摇的政局带来了一丝稳定和期待。然而，现实远比理想骨感。这场运动很快陷入了复杂的泥潭。“举国一致”的口号下，汇聚的是立场和诉求各异的力量。试图整合一切的结果，是新运动内部形成了鲜明的左右两翼。左翼以“国策研究会”为核心，成员包括民政党前干事长风见章、充满理想主义色彩并深受西洋社会主义影响的记者尾崎秀实、学者蜡山政道等人。他们希望新体制能带来深刻的社会改革，关注底层民众福祉，限制财阀，甚至带有某种计划经济色彩。他们的理念在保守派眼中无异于“赤化”，是危险的“大逆不道”。右翼以“革新官僚”和部分军人为核心。满铁出身的岸信介、铃木贞一、以及在外交领域同样激进的松冈洋右是主要代表。他们受到德富苏峰等思想家影响，鼓吹建立以天皇为中心的强力统制国家，强调国家优先、军部主导、对外扩张。他们对社会改革兴趣有限，更关注国家机器的强化和对外政策。\n近卫本人贵族出身，性格优柔寡断，缺乏坚定的政治信念和魄力。他既希望利用左翼的活力来推动改革、赢得民众支持，又深知只有右翼的力量才能抵挡保守派的攻击并维持政权运转。他夹在中间，左右为难，政策摇摆不定，导致两边都不满。翼赞体制本身也因内部矛盾而步履蹒跚，远未达到预期的“举国一致”效果。平沼骐一郎、小林一三等极端保守主义者从未放弃攻击。他们将整个新体制运动，尤其是其中的左翼力量，污蔑为“破坏国体”、“赤化阴谋”、“否定天皇统帅权”。他们利用在贵族院、枢密院、军部内的深厚关系，不断掣肘近卫的政策。面对保守派日益猛烈的炮火和翼赞体制内部的撕裂，近卫文麿陷入了深深的焦虑。他感觉自己的政治生命和精心推动的新体制都岌岌可危。他深知，单凭自己“超然”的威望已不足以稳住局面，必须在内部寻找一股可以倚重、能够帮助他抵挡保守派攻击并真正推动体制运转的力量。他召集了最核心的几位顾问，在密室里痛苦地权衡，摆在他面前的是两条截然不同的路……"
 KXXJAP.148.a:0 "拥抱新党左翼，深化社会革新"
 KXXJAP.148.b:0 "依靠新党右翼，强化国家统制"
 KXXJAP.148.c:0 "我已经不再软弱，我会告诉天皇陛下，我必须为维新连任。"
 KXXJAP.148.e:0 "那本书是什么……？"
 KXXJAP.149.t:0 "鹤之左翼-激进变革"
 KXXJAP.149.d:0 "近卫文麿的书房彻夜灯火通明。风见章、尾崎秀实和蜡山政道围坐在他身边，地图与文件散落一地。空气凝重，近卫的眼神疲惫却燃烧着一丝决绝的火焰。他知道，选择依靠左翼，意味着向旧秩序宣战，也踏上了刀锋。他必须组建一个足以推动深刻变革、又能抵挡保守派疯狂反扑的内阁。这份名单，每一笔都重若千钧。风见章语气激昂：“阁下！此刻唯有破釜沉舟！启用真正代表革新力量、不畏权贵之人，才能点燃国民心中之火，让翼赞体制名至实归！”尾崎秀实则更冷静地补充：“关键在于关键阁僚职位。内务、文部、厚生、商工，必须掌握在我们手中。同时，需要一个看似中立、实则能压制军部反弹的陆相人选。”蜡山政道迅速在纸上勾勒着可能的人选与他们的政治光谱。西园寺公望得知近卫的抉择倾向后，送来了一个意味深长的词：“慎之。”"
 KXXJAP.149.a:0 "风见章"
 KXXJAP.149.b:0 "尾崎秀实"
 KXXJAP.149.c:0 "蜡山政道"
 KXXJAP.150.t:0 "鹤之右翼-现实妥协"
 KXXJAP.150.d:0 "在霞关一间壁垒森严的会议室里，近卫文麿面对着岸信介、铃木贞一和松冈洋右。空气中有一种务实的冰冷。岸信介将一份早已拟好的阁僚名单草案推到近卫面前，语气平静却不容置疑：“阁下，当务之急是稳固。需要的是效率、是力量、是能立刻压住骚动让机器运转起来的人。”铃木贞一挺直腰板：“陆军方面，臣已有所沟通。关键是要给予军需产业和统制政策足够的空间。”松冈洋右则眯着眼，手指敲着桌面：“外交…呵，需要的是强硬的决心，向世界展示新日本的力量。”德富苏峰在一旁抚须点头：“此乃国权伸张之正道。”近卫看着名单上那些与官僚系统、军需产业、军部有着千丝万缕联系的名字，心中明白，这等于将新体制的核心交给了右翼。他想起西园寺公望听闻此路选择后那声沉重的叹息和拂袖而去的身影，也想起平沼骐一郎那意味深长的、仿佛胜利在握的冷笑。"
 KXXJAP.150.a:0 "岸信介"
 KXXJAP.150.b:0 "松冈洋右"
 KXXJAP.150.c:0 "德富苏峰"
 KXXJAP.151.t:0 "鹤之狂乱-神国千代"
 KXXJAP.151.d:0 "东京郊外一处隐秘的料亭深处，障子门紧闭隔绝了外界。近卫文麿的疲惫几乎要从那身考究的和服中满溢出来，翼赞体制的千疮百孔压弯了他的脊梁。昏黄的灯光下，他面前坐着两个男人：前外交官白鸟敏夫眼神中燃烧着一种病态而炽热的光芒，嘴角带着神经质的抽搐；学者藤泽亲雄则显得更为内敛，眼镜后的目光锐利而深沉，如同一个推销惊世理论的布道者。\n藤泽率先开口，声音低沉而富有穿透力：“殿下，您所困的并非凡俗政治之泥沼，而是关乎天命归属、世界重构的圣战困局。我们今日所献，非应对之术，乃是解开宿命枷锁的钥匙。”\n白鸟敏夫猛地前倾，双手按在矮几上，指节因用力而发白，他的声音因激动而尖锐颤抖：“公爵大人！您被蒙蔽了！德美豺狼、赤色幽灵不过是表象！是邪神耶和华的爪牙，是共济会毒蛇的化身！他们窃取了天照大御神赐予人类祖地——姆大陆的荣光！”他唾沫横飞，眼神涣散又聚焦，描绘着一个光怪陆离的伪史世界：日本是“人类大祖国”，神武天皇是流散世界的五色人共同的古皇之后裔，昭和维新是“天业恢弘”的世界维新起点。藤泽及时接上：“记纪体系囿于列岛，不足以承载八纮一宇之大义。唯有《竹内文书》昭示的全球神代史，才能向世界证明皇国乃万邦之祖庭，天皇陛下是引导人类重归宇'之正道的唯一慈父！”\n白鸟再次抢过话头，几乎嘶吼：“这场战争不是解放亚洲！是慈悲！是对迷途羔羊的救赎！是让盎格鲁撒克逊人，让全世界都匍匐在、不！是心悦诚服地沐浴在天皇陛下的仁爱之下，实现人类永久和平的必经之路！”藤泽冷静补充：“翼赞会之魂，在于承天业，行世界维新。当此天业受阻，正需有洞悉宇宙终极真理之人，以超越凡俗政治的方式，唤醒国民深藏血脉中的世界使命感。白鸟君与我，愿担此重任，涤荡翼赞会内的迷障，将这场战争升华为‘世界性之国体大明征’！”\n近卫文麿望着眼前一人癫狂如狂信徒、一人冷静如深渊的奇异组合，听着那颠覆常识、充满神秘主义色彩的宏大叙事和“永久和平”的诱人许诺，连日来的绝望与无力感竟奇异地在这些狂言中找到了一个宣泄的出口——一个似乎能跳脱现实政治泥潭、直达天命高度的荒谬幻想。他那双原本疲惫黯淡的眼睛里，一丝病态的、近乎溺水者抓住稻草般的微弱希望之火，被白鸟敏夫那近乎燃烧生命的狂热和藤泽亲雄那冰冷的逻辑诡辩，悄然点燃了。"
 KXXJAP.151.a:0 "这真的好么……？"
 KXXJAP.152.t:0 "武士刀的指向"
 KXXJAP.152.d:0 "首相官邸内，林铣十郎首相看向永田铁山军务局长。\n“铁山君，过渡内阁的使命即将完成。新人该接棒了。” 林直接问道，“你自己不考虑吗？”\n永田铁山坐姿笔挺，果断回答：“不。当前首相需直面各方压力，我的位置在军务系统内部维持协调，这更重要。”\n林铣十郎点点头，明白了他的意思，接着问：“那么，统制派中谁合适？”\n永田铁山沉默了片刻，显然在权衡。“这个位置，”他缓缓开口，“需要能力，也需要…各方一点认可。” 他抬眼，语气变得务实，“东条英机。此人…狡诈，但工作态度极其精细认真。军需、参谋业务他都烂熟于心，行事周密到苛求，关键时也能下决心。就能力而言，目前他是最合适的。”\n林铣十郎若有所思：“东条的勤勉确实无人质疑。但风暴过后，暗流涌动，是否还有其他力量需要平衡？”\n永田铁山点头：“池田纯久中佐他们的‘国防本义及其强化的提倡’小册子，在部分青年军官中有市场。里面鼓吹的‘国家总动员’、‘经济统制’和所谓的‘社会革新’，想法相当激进。有人把它看作新方向。\n房间陷入短暂的安静。首相人选的问题悬在空中。"
 KXXJAP.152.a:0 "铁山君不必多辞，铣十郎辞相后，也会鼎力相助下任内阁。"
 KXXJAP.152.b:0 "那不妨，就看看“剃刀将军”能做到哪里。"
 KXXJAP.152.c:0 "国防本义及其强化的提倡……是个好东西。"
 KXXJAP.153.t:0 "秩父宫雍仁继位成为新天皇"
 KXXJAP.153.d:0 "东京的硝烟尚未散尽，焦糊与血腥混合的气味顽固地渗透进皇宫每一寸古老的木头与丝绸。曾短暂抵抗的皇宫守卫已被“整肃”或调离，近卫师团彻底换上了臂缠“尊皇讨奸”白布的面孔，眼神中残留着昨夜的狂热，也带着对新秩序的茫然敬畏。\n青森县官邸那令人窒息的未知恐惧，最终在抵达东京时化作了冰冷的现实。兄长的遗体——抑或是那具无法辨认、象征意义大于实际存在的“御体”——已在混乱中被皇道派匆匆“奉安”。更令人心悸的是年幼的明仁皇太子亦告“夭折”的噩耗，如同一把钝刀反复切割着雍仁的神经。\n赤坂离宫临时被征用为“大本营”。这里不像皇宫那般庄严肃穆，却更接近权力的漩涡中心。墙壁上残留着弹孔，地毯上印着未曾洗净的深色污渍。空气中弥漫着消毒水也无法掩盖的铁锈味和新权贵们身上浓重的烟草味。\n雍仁亲王——不，现在，他是即将成为“陛下”的人。\n简陋的“登基”仪式仓促而沉重，在这间充溢着死亡气息的厅堂里进行。象征天照大神血脉的三种神器——剑、镜、曲玉——被小心翼翼地捧出，放置在他面前。那冰冷的玉座，此刻更像一张浸透了兄长与侄子鲜血的刑台。\n厅内站满了人，却死寂无声，只有沉重的呼吸和布料摩擦的窸窣。站在最前方的，是这场剧变的最大赢家：陆军大将荒木贞夫，红光满面，眼神锐利如鹰隼，挺直的腰板透出掌控一切的自信；他身旁的真崎甚三郎大将则稍显内敛，眉头微皱，仿佛在掂量这血腥胜利后的千斤重担。在他们身后一步，陆军大臣川岛义之垂着头，脸色灰败如纸，冷汗浸透了他军装的领口，目光死死盯着自己沾满尘土、微微颤抖的靴尖，不敢与任何人视线接触，那份失职与耻辱感几乎要将他压垮。昨夜还属于“统制派”的其他高级将领，则肃立在更远的位置，如同丧家之犬。\n皇室宗亲到场的有：东久迩宫稔彦王，这位亲王眉头深锁，目光复杂地在雍仁和荒木等人之间游移，沉默得像一块石雕；海军方面的代表伏见宫博恭王，这位海军大将、天皇的叔祖，则面无表情，深邃的目光仿佛穿透了眼前的混乱，望向更深更冷的未来，他身上的海军大将礼服一丝不苟，与周遭的狼藉形成鲜明对比。\n代表旧有宫廷秩序的是内大臣秘书官长木户幸一，他面色惨白，眼神空洞，仿佛仍未从昨夜皇宫的血腥与惊魂中恢复过来。在他身后，是几位同样惊魂未定的侍从和官员。\n华族代表，以近卫文麿公爵为首，也到场了。这位出身五摄家、曾被视为未来首相人选的人物，此刻脸色异常复杂。他心中对皇道派“清君侧”的某些理念或许曾有共鸣，对旧有财阀官僚体系的腐朽也深恶痛绝，但此刻，裕仁天皇和皇太子的骤然“驾崩”与“夭折”，带来的巨大冲击远超任何理念之争。恐惧、茫然、一丝对权力格局洗牌的算计，以及对这血腥开端可能引发无尽灾祸的深深忧虑，在他脸上交织。他微微垂着眼，避开雍仁的目光，也避开荒木那锋芒毕露的视线。其他在场的华族，个个如坐针毡，表情僵硬，眼神闪烁不定。"
 KXXJAP.153.a:0 "还有呢？"
 KXXJAP.154.t:0 "秩父宫雍仁继位成为新天皇"
 KXXJAP.154.d:0 "厅堂中央，象征天照大神血脉的三种神器——草薙剑、八咫镜、八尺琼勾玉——被几位身着传统宫廷服饰、面色凝重肃穆的宫内侍从，极其庄重地安置在临时铺设的御案上。它们寂静地躺在那里，在昏暗的光线下，散发着古老而冰冷的幽光。那神器之下的位置，便是为雍仁准备的御座——一张仿佛浸透了兄长与侄子鲜血的冰冷刑台。\n伏见宫博恭王缓缓向前一步。他的动作带着皇族的沉凝，打破了死寂。他面向雍仁，声音不高，却清晰无比，每一个字都蕴含着古老的重量与不容置疑的权威：“雍仁亲王殿下。逆贼乱国，神器蒙尘。幸赖忠勇将士，奋起天诛，涤荡妖氛。国不可一日无君，社稷悬于累卵。殿下乃天皇陛下亲弟，仁德素著，深孚众望。臣等，伏请殿下，继大统，御神器，正位天皇陛下，以安天下之心，以固万世之基。”待伏见宫话音落下，厅堂内瞬间矮下一片：“臣等，恭请殿下即天皇位！”呼喊声汇聚成一片，在空旷的殿堂里回荡，带着一种不容置疑的压迫感，却也掩盖不住其中的空洞与寒意。在宫内的侍从草草完成神器继承仪式后，整个仪式最核心的部分完成了。他不再是亲王，而是天皇——以最血腥的方式，在至亲的尸骸之上，被这冰冷的古镜和无声的俯伏所加冕。\n荒木贞夫猛地挺直了腰！他那张充满军人粗犷气息的脸上，爆发出难以抑制的激动与狂热，胸膛剧烈起伏，用尽全身力气，发出震耳欲聋的、仿佛要掀翻屋顶的咆哮：\n“天皇陛下——万岁！！！”\n这声嘶吼如同点燃了火药桶！\n“万岁！！！”\n“万岁！！！”\n“天皇陛下万岁！万万岁！！！”\n真崎、川岛、在场的军官、甚至部分被裹挟的华族，都被这狂暴的声浪点燃，忘情地、嘶哑地吼叫起来。无数的拳头在空中挥舞。东久迩宫和伏见宫紧抿着嘴唇。木户幸一身体微颤。近卫文麿在声浪中猛地一哆嗦，头垂得更低。狂热的呼喊声浪冲击着四壁，震得梁柱似乎都在嗡鸣，疯狂地撕裂着空气，充满了整个空间，也重重地砸在雍仁的耳膜上。\n“朕……知道了。” 他的声音穿透了那震耳欲聋的“万岁”呼喊。依旧轻得像叹息，冷得像冰。没有情绪，只是一个被强行赋予的血腥事实的冰冷陈述。"
 KXXJAP.154.a:0 "还有呢？"
 KXXJAP.155.t:0 "秩父宫雍仁继位成为新天皇"
 KXXJAP.155.d:0 "仪式在一种近乎凝固的沉重气氛中草草结束。荒木和真崎留下，开始低声汇报“新政府”的架构与“肃清”的“成果”。雍仁沉默地听着，目光落在御案一角。那里，一个细小的、深褐色的污点——无人敢去擦拭——像一只无声控诉的眼睛。\n“西园寺公爵何在？”他突然开口，声音依旧低沉沙哑。\n荒木眼中闪过一丝不易察觉的阴霾，随即恢复恭谨：“公爵阁下……在居所静养。昨夜的混乱，似乎使老人家受了些惊吓。医生已前往诊视。”真崎补充道：“陛下请放心，公爵阁下的安危，臣等自当尽心。”\n“惊扰元老，实为憾事。”雍仁缓缓道，每一个字都重若千钧。他心中明了，“惊吓”二字背后蕴含的凶险。\n荒木立刻转移话题：“陛下，当务之急乃昭告天下，安定人心……”\n雍仁抬起手，一个微小却不容置疑的动作。他的目光越过众人，望向窗棂之外。东京的天空是灰蒙蒙的，早樱的花瓣在昨夜的风雨中凋零殆尽，徒留光秃秃的枝桠指向铅色的苍穹。远处，仿佛又传来几声零星的枪响。\n“退下吧。”他的声音带着一种穿透骨髓的疲惫。\n众人躬身告退。沉重的殿门在他们身后合拢，隔绝了外面浑浊的世界。\n死寂再次降临。\n雍仁一个人坐在空旷得令人心慌的殿堂中，坐在那被无数复杂目光灼热的、象征至高无上的座位上。他低头看着自己的双手，干净，修长，未曾沾染一丝血污，却仿佛有粘稠的暗红正从指尖弥漫开来，迅速将他淹没。他成了天皇。以最血腥的方式，最悖逆的路径，在至亲的尸骸之上。\n一个念头，冰冷而绝望，如同毒蛇般悄然爬上心头：从此，他将是这血色祭坛上最尊贵也最孤绝的祭品。这神国，已死。\n殿角，一只乌鸦落在残破的窗棂上，发出几声喑哑的啼鸣，旋即振翅飞入灰暗的天空，消失不见。雍仁的目光追随着那抹黑影，久久不动，仿佛一尊凝固的、没有灵魂的神像。"
