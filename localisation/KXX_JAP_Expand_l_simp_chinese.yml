 KXXJAP.2.b:0 "革新官僚鲇川义介"
 KXXJAP.2.c:0 "三菱家族的岩崎小弥太"
 KXXJAP.2.e:0 "三井的池田成彬深受信赖"
 KXXJAP.2.f:0 "阪急电铁的小林以三"
 KXXJAP.2.g:0 "集体领导没什么大不了的"
 KXXJAP.3.t:0 "东京失去控制"
 KXXJAP.3.d:0 "随着陆军对东京失去控制，我们的统治越来越不稳，出现了厌战的情绪……"
 KXXJAP.3.a:0 "这可不妙……"
