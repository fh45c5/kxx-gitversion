 JAP_SCB_STORY_DESC:0 "1921年，“平民宰相”原敬开启了属于他的时代。原敬巧妙地利用了关东大地震以及英国工团革命带来的社会恐慌，建立起了一个纵跨众议院与贵族院的铁腕垄断政权。\n然而，随着这位幕后元老于1929年病逝，被排挤出权力核心十年的宪政会在安达谦藏的策划下，联合其他政党发起了“第二次护宪运动”，一举终结了政友会的垄断。但胜利带来的并非稳定，而是惨烈的派系内耗与暗杀阴云。1934年，被视为陆军开明代表的宇垣一成大将受命组阁，他力图绕过腐朽的政党博弈，打造一套既能高效运行、又能达成民意的新体制，以挽救摇摇欲坠的国体。但这仅仅是一层脆弱的遮羞布，在昭和十一年的寒风中，军中不满的刀锋已然出鞘，这座远东帝国正站在大崩溃的悬崖边缘。"
