 KXXJAP.174.t:0 "北方平叛宣告结束"
 KXXJAP.174.d:0 "临时陆军大臣办公室的窗户敞开着，早春的风带着硝烟和融雪的刺鼻气味涌入。窗外，东京的疮痍仍在缓慢清理，断壁残垣沉默地指向灰白天空。寺内寿一大将背对着门，目光落在桌上一份摊开的报告上。纸张边缘沾着些微污渍，那是关于北海道暴动被最终扑灭的确认文件。\n门被轻轻推开，副官的声音带着近乎凝固的谨慎：“阁下，林铣十郎大将……拒绝在电话中与您沟通。他表示……此刻任何谈话都‘缺乏建设性’。”副官顿了顿，声音更低了些，“另外，枢密院和贵族院的几位代表……再次催促，要求您尽快履行之前的‘承诺’。”\n寺内的背影纹丝未动，只有肩膀似乎绷紧了一瞬。承诺。这个词像冰冷的铁屑，磨蚀着神经。自那震动国本的“维新”火焰被帝国陆军的铁拳碾碎，自他站在电台前宣读那份杀气腾腾的“敕命讨逆”檄文起，他就成了风暴中心。他肃清了叛军，稳住了摇摇欲坠的帝国心脏，甚至扑灭了北方趁乱而起的火苗。然而，代价是陆军成了众矢之的。\n报纸上，众议院议员的指责——“军队失控的根源在于其内部的毒瘤！”，“必须对军队进行彻底的肃清与改造！”。这种声音，竟得到了意料之外的、来自华族，特别是德川家等旧幕府名门的强烈共鸣。他们并非同情叛军，而是看到了一个前所未有的、能削弱陆军这个明治维新时期崛起的新贵集团影响力的良机。贵族院会议厅里回荡的谴责声，其分量远超议会的喧嚣。要求“陆军下台谢罪”、“彻底肃军”的呼声，汇成一股几乎无法抗拒的洪流。\n陆军内部呢？寺内寿一的心沉了下去。皇道派被血腥清洗，力量已残，统制派看似大获全胜，但裂痕已悄然滋生。永田铁山的阴影下，石原莞尔那套“最终战争论”和对外扩张的蓝图，在年轻军官中找到了新的狂热土壤。而林铣十郎这类同样野心勃勃的将领，则敏锐地嗅到了权力真空的气息，正悄然聚集着自己的势力。寺内试图掌控局面，却发现陆军这头巨兽在经历这场自噬后，内部派系林立，山头重立，他这位“功臣”竟也无法统合。林铣十郎拒绝接电话，就是一个冰冷的信号——陆军不再需要一个收拾烂摊子后还挡路的“英雄”，他们正在寻找新的领路人，无论是石原的激进蓝图，还是林铣十郎的实用主义路线。\n接下来，属于帝国陆军的，将是另一场无声却更为复杂的战争。" 
 KXXJAP.174.a:0 "或许……我该辞职了。"
