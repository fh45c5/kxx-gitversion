 KXXJAP_HAYASHI:0 "§V开局选择进入“旭日寒骨”分支§!"
 tooltip_unlock_KXXJAP:0 "§V警告：该路线未完成，无国策，无可游玩价值§!"
 tooltip_Suzuki_Kisaburo:0 "§c铃木喜三郎§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Suzuki_Kisaburo\n\n\n\n\n\n\n\n\n铃木喜三郎是一名司法出身的官僚，和现任枢密院院长平沼骐一郎关系密切。在官僚时代，他们将司法检察部门改造为国家主义的工具，并颁布了臭名昭著的《治安维持法》，肆意裁决思想犯罪。铃木本人更是特高警察体制化的直接推动者。\n在§c立宪政友会§!内部其属于§Y主流派§!，和森恪、鸠山一郎并称。"
 tooltip_Mori_Tsutomu:0 "§c森恪§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Mori_Tsutomu\n\n\n\n\n\n\n\n\n森恪出身商界，具有三井财阀背景。早年曾在中国生活，是个典型的中国通。进入政界后以其雄厚的资金在政友会取得一席之位，曾任出任田中义一的外务政务次官，推行对华强硬外交政策，具有强烈的亲军倾向，是个死硬的国权主义者。\n在§c立宪政友会§!内部其属于§Y主流派§!，因为身体原因，目前试图扶持鸠山一郎来继承自己的遗产。"
 tooltip_Hatoyama_Ichiro:0 "§c鸠山一郎§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Hatoyama_Ichiro\n\n\n\n\n\n\n\n\n鸠山一郎是明治时期众议院议长鸠山和夫的儿子，铃木喜三郎是其义兄，曾任田中义一内阁书记长官。鸠山是一名基督徒，提倡“友爱”的观念，但在具体政治上经常摇摆不定，被戏称为变色龙。\n在§c立宪政友会§!内部其属于§Y主流派§!，虽然高度依赖森恪和铃木，但意识到军部影响力扩大的他已经开始为了维持议会政治和国际和平而奔走。"
 tooltip_Maeda_Yonezo:0 "§c前田米藏§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Maeda_Yonezo\n\n\n\n\n\n\n\n\n前田米藏进入政界是受到横田千之助的邀请，目前已有三十余年，熬成了长老之一。在原敬时代，政友会的关东选取是前田的势力范围，然而铃木派三人到来后强势夺取了此地，双方关系极度紧张。虽然不敢明面掀桌，但前田已经在背后谋划一场阴谋……\n在§c立宪政友会§!内部其属于§Y反主流派§!，正在积极和政友会的新起之秀，中岛飞机的创始人中岛知久平合作，主张更亲近军部势力，以此推翻铃木派的暴政。"
 tooltip_Fusanosuke_Kuhara:0 "§c久原房之助§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Fusanosuke_Kuhara\n\n\n\n\n\n\n\n\n久原房之助是政友会目前的长老人物之一，其政治主张激进，主张废除现行腐朽的选票政治，建立“举国一致内阁”，曾资助安达谦藏的“协力内阁运动”。久原最大的特点是朝秦暮楚，两头下注，任何一方革新势力都可能有其参与的影子。他朝思暮想的，是成为下一个“造王者”，一个无元老之名的国家元老。\n在§c立宪政友会§!内部其属于§Y反主流派§!，但独自形成“久原派阀”，试图在官僚、军人和华族当中寻找革新代理人，建立一党一国体制。"
 tooltip_Machida_Chuji:0 "§m町田忠治§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Machida_Chuji\n\n\n\n\n\n\n\n\n町田忠治作为前前总裁若槻礼次郎的亲信，临危受命接过了民政党烫手的总裁之位。\n在§m立宪民政党§!内部其属于§Y反军派§!，依赖着民政党官僚们的影响力苦苦维持党的宗旨：议会中心主义。"
 tooltip_Ryutaro_Nagai:0 "§m永井柳太郎§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Ryutaro_Nagai\n\n\n\n\n\n\n\n\n永井柳太郎是党内的党人派代表，在安达谦藏还担任内相的时代，被誉为“安达三天王”之一，具有出色的演讲能力，常年担任外交职务。\n在§m立宪民政党§!内部其属于§Y亲军派§!，希望推动政民两党提携形成“举国一致内阁”，不惜借助军部的力量来击溃“政党化官僚”的阻碍。"
 tooltip_Saito_Takao:0 "§m斋藤隆夫§!\n\n\n\n\n\n\n\n£GFX_Portrait_JAP_Saito_Takao\n\n\n\n\n\n\n\n\n斋藤隆夫是一名秉持着议会中心主义的众议院议员，投身政治已三十载，但仍然不减他对政治的激情，批判着时局的丑恶。\n在§m立宪民政党§!内部其属于§Y反军派§!。他激烈地反对党内党人们表现出的亲军倾向，用自己的实际行动证明自己是一名不会转向的自由帝国主义者。"
