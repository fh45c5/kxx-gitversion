 KXXJSR.13.d:0 "如今我们法国的正义之军已经攻入东京，推翻了旧日本帝国政权，建立了临时政府，各路日本社会主义运动重新焕发生机。现在，我们面临着重要的选择，是建立军政府，协助日本人渡过战后重建的难关，还是直接将权力交给日本的社会主义者们，让他们自行决定国家的未来方向。无论选择哪条道路，我们都必须确保日本能够走上正确的社会主义道路，避免重蹈覆辙。"
