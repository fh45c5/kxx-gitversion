 KXXJAP.171.t:0 "神政龙神会"
 KXXJAP.171.d:0 "神政龙神会是我国的新兴宗教团体，同时受到大本教与天津教影响，由预备役海军大作矢野佑太郎设立。矢野自幼就对灵异世界深感兴趣，曾钻研参禅、气合术、催眠术以及灵异现象的研究。大正6年，他受浅野正恭所托，前往绫部的大本总部带回其已成为大本信徒的儿子。然而，他在当地却被正恭的弟弟浅野和三郎所感化，对大本产生共鸣，在大正10年第一次大本事件发生时，他擅自将海军机密情报泄露给大本教祖出口王仁三郎，因而受到禁闭处分。大正12年，他不顾海军的挽留退役，转入了预备役。矢野退役后正式加入大本，但他对大本开祖出口直去世后由王仁三郎主导的教团体制抱有反感，他与原大本信徒中的著名灵媒车小房接近，一同在昭和3年转投出口直的女儿久子主持的分派——大阪正道会。正道会的神殿设置在肝川，供奉的国常立大神的眷属神——八大龙神。然而，昭和4年，矢野妻子收到了“聚集在正道会的人中，无一人能理解神意，实为可叹”的神示，矢野得知后便选择离开\n昭和5年，矢野在酒井胜军的介绍下访问了天津教的总部皇祖皇太神宫，他在当地深受天津教所宣扬的超古代史感动，在神灵附体状态下，完成了融合以竹内文书为首的超古代文献《神灵密书》。矢野为了传播他所记录的“真实历史”，将著作寄送给各个宫家。在竹田宫家的恒久王妃昌子内亲王的帮助下，矢野将该书进献给了昭和天皇，香淳皇后传达了“确实已献予天皇”的话语，并赐下了表示嘉许的御纹菓一折。昭和8年，矢野迎请教主竹内巨麿为总裁，设立了神宝奉赞会。然而，竹内等人指责“矢野将奉赞会的会费、捐款等用于个人生活开支，乃至侵吞”，他在次年便脱离了该教团。昭和8年，矢野再次访问肝川，提议建立一个以八大龙神为中心的新团体。9月26日，车小房收到了“速速设立神政龙神会”的神示。矢野夫妇邀请了很多达官贵人参与新团体成立，其中就包括我们现任首相，当时还是贵族院议员的赤池浓。同时，还有上杉宪章伯爵、岩下家一男爵等共计华族出席支持。" 
 KXXJAP.171.a:0 "然后呢？"
 KXXJAP.172.t:0 "神政龙神会"
 KXXJAP.172.d:0 "神政龙神会以肝川的八大龙神信仰为基础创立了教义，认为日本的神代历史“以天之御三体”的三柱神明——天照皇大御神、撞大神、灵大神为领导，作为艮之金神的国常立大神和作为坤之金神的稚姬君大神为主辅佐，他们创造了世界与人类，并将日本确立为世界神国祖国。而在历史长河中，曾有一位与外国的极恶之徒共谋、破坏弥勒之世的神明，“天之规则破坏之神”——天照彦大神，因这位神，作为主辅佐神的国常立大神和稚姬君大神被迫引退，世界由此进入了容许自由与恶行的末法之世。为了推进世间的改造与重建，“天之御三体”及其辅佐神向黑住教等四位教祖赐予了神示，最后赋予了作为连接神界与人界、最终实现重建的宗教——大本教。由此，日本人将得到“整理”和“改心”，并彻底战胜外国的恶神所策划的日本打倒战争，届时，全世界都会承认日本为神国。\n神政龙神会除在肝川设有神殿外，还在东京目黑区清水町建立了总部及东京神殿，在东京市和兵库县均有数名信徒。现在，他们想通过我们的首相赤池浓来施展抱负，图谋组织“神政内阁”，想通过灵媒和“审神者”获得神示，领会神意，并以现人神昭和天皇的名义，推行基于这些神示的政治。神政龙神会主张，明治天皇虽曾为国常立大神所凭依，但因昭宪皇太后被“金毛九尾狐”之灵凭依而受到阻碍，故仅实现了部分改造。同时，他们认为昭和天皇与香淳皇后分别被国常立大神及其妻神常世姬所凭依。\n赤池首相显然知道这些人并不靠谱，但是对于现在的日本来说，能强化天皇作为国体象征的法子，未尝不能得到广泛支持。" 
