 SCBJAP.1.t:0 "灰暗的光荣和平"
 SCBJAP.1.d:0 "1919年的德日光荣和平后，日本从世界大战成功抽身，但随之而来的经济问题让整个国家陷入困顿当中。立宪政友会总裁原敬借此机会登上台前，建立了被认为是日本第一届“真正的政党内阁”。在原敬的强硬手段下，日本的社会情况略有好转。\n\n1921年，原敬在大塚站候车时，被反对其西伯利亚政策的右翼青年所刺伤，所幸抢救及时，经过三个月的修养后便重归永田町。借此事件，原敬内阁加强了治安管制。1923年，原敬因身体精力问题请辞，进入枢密院工作。其内阁海军大臣加藤友三郎被元老指认成为下任首相。在原敬的幕后操作下，该内阁仍然是一个政友会优势内阁。\n\n然而猝不及防的是，加藤内阁在组建后数日便遭遇关东大地震，加藤本人不幸因此罹难，西园寺公望奏荐山本权兵卫组阁救灾处理。贵族院本想凭此牵制政友会独大的发展，不曾想随后发生的虎之门事件中，摄政王裕仁被无政府分子难波大助刺杀，重伤卧床多日，宫廷内部与贵族院一度出现扶持秩父宫雍仁亲王继位的声音。"
 SCBJAP.1.a:0 "有点像长州佬。"
 SCBJAP.2.t:0 "大政友会的时代"
 SCBJAP.2.d:0 "山本权兵卫内阁在地震救灾与皇室安保失败的双重打击下，被原敬和政友会议员联手“行政绑架”。政友会通过切断预算和发动民众示威，逼迫山本内阁在1924年初垮台。原敬在幕后敲定了田健治郎组阁，开启了政友会的垄断时代。次年，英国发生工团主义革命，让日本统治阶层陷入极度恐慌。平田东助临终前与西园寺公望、牧野伸显等人仔细商讨后，原敬、清浦奎吾和山本权兵卫三人正式以元老身份介入国政，以在“乱世中维护国体”。\n\n这一系列的政治变故导致男子普选被无限期推迟，各无产政党遭到了毁灭打击，平沼骐一郎和铃木喜三郎等司法官僚得以推行严厉的《治安维持法》。政友会在原敬的庇护下，田健治郎与床次竹二郎两人交替执政，不受宫中喜爱的加藤高明所代表的宪政党系被彻底排挤出权力核心，沦为毫无还手之力的“在野花瓶”。"
 SCBJAP.2.a:0 "这是什么很怀念的事情吗？"
 SCBJAP.3.t:0 "第二次护宪运动"
 SCBJAP.3.d:0 "但随着社会重建与经济发展，民间普选压力与激进派系崛起威胁着政友会所谓的纵断政权。原敬作为元老，意识到文官出身的田、床二人难以压制日益躁动的，由上原勇作元帅庇护的军队新兴派系“皇道派”。于是，在原敬的亲自授意下，被视为长州阀继承人且政治手腕强硬的田中义一被引入政友会核心，他上任后对外积极干涉，维护满蒙利益，对内修正更严厉的《治安维持法》。然而这一手腕并没有真正改善现状，1929年，元老原敬去世，失去了最强保护伞的田中义一内阁瞬间失去了政治重心。随后，田中本人也在外交压力、经济下行与党内斗争中因心脏麻痹死亡。\n\n元老清浦奎吾试图扶持田中生前的亲信、军方背景深厚的山梨半造组阁，这一举动引发了社会积压十年的怒火。宪政会总裁滨口雄幸在“选举之神”安达谦藏的策划下，联合了犬养毅和尾崎行雄的革新俱乐部，发动了第二次护宪运动。在牧野伸显等宫内派的默许下，“军人政府”倒台，由宪政会与革新俱乐部组成的立宪民政党正式登台。"
 SCBJAP.3.a:0 "天皇的眼皮下无新事……"
 SCBJAP.4.t:0 "失控的民党政治"
 SCBJAP.4.d:0 "1930年的“第二次护宪运动”虽然推翻了山梨半造，但胜利后的立宪民政党迅速陷入内耗。滨口首相主张稳健的财政与外交，而身为内相的“选举之神”安达谦藏则要求立即进行激进的选举革新。1932年末，滨口雄幸在东京站遭到政友会暗中雇佣的右翼分子刺杀，导致了政坛陷入彻底的混乱。\n\n滨口死后，民政党的大权落入井上准之助与币原喜重郎之手。井上与币原利用贵族院的深厚背景，将一直闹独立的安达谦藏逐出党外。被放逐的安达谦藏带走了一大批实务派，组建新党“国民同盟”，开始秘密接触军方新秀永田铁山，计划引入军部革新力量来一场彻头彻尾的“政坛大肃清”。\n\n政友会在山梨倒台后，由田中义一亲信森恪主持大局，森恪强行压制温和派，导致其挚友鸠山一郎绝望离去，带走了一批成员组成了坚持自由主义护宪路线的“同交会”。而长期摇摆不定的床次竹二郎在此时突然病逝，失去领袖的床次派彻底分崩离析，多数加入民政党谋求出路。\n\n与此同时，原本并入民政党的革新俱乐部也随之瓦解，反对治安维持法的尾崎行雄带着左派成员出走，联合关西财界人物武藤山治组建的“国民同志会”形成了坚守古典自由主义的“明正会”；而革新俱乐部的另一位要人秋田清，则看准时机收编了走投无路的床次派残余，推举犬养毅为总裁，组成了组成了游走于军部与政党裂缝间的“政友中正会”。"
 SCBJAP.4.a:0 "真是一群只会猎官的臭狗。"
 SCBJAP.5.t:0 "革新体制的胎动"
 SCBJAP.5.d:0 "为了平息党派混战，宫中近侍牧野伸显与铃木贯太郎开始介入。在革新华族近卫文麿的推动下，他们选中了宇垣一成。宇垣曾因与加藤高明走得太近被政友会长期冷落，但也因此成了各派都能接受的“开明将领”。1934年，宇垣在币原的请求下组阁，除了顽固的森恪外，其余各派在宇垣的斡旋下暂时达成合作，进入了脆弱的稳定期。\n\n在近卫文麿的提议下，宇垣一成内阁以“国难突破”为旗号推动彻底革新政治的新体制运动，核心举措便是建立直属内阁的国民议政会，通过集中政策审议权强制推行五年期的国策长久化方案，确保行政权力不受政党更迭干扰。同时，内阁以肃清选举腐败为由推行政党规范改革，强制各党接受公营资金监管并限制地方豪族干预选举。面对德国经济扩张与美国资本压力，宇垣内阁缓步开始实行经济统制政策，将重要产业纳入国家计划管理体系，以此推动“国防自主”，平息陆海军的躁动。"
 SCBJAP.5.a:0 "皇国政治之未来，在于万民辅翼。"
#开局精神
 JAP_shintaisei_in_trouble:0 "步履维艰的新体制"
 JAP_shintaisei_in_trouble_desc:0 "自1934年宇垣大将组阁，政治革新运动风起云涌，各方俊杰投身新体制建设。然而，旧党阀的腐朽与官僚系统的僵化，正悄然扭曲运动的初衷，支持者甚至演化为新的阻碍。叠加军令独立之争、国体明征议题以及是否背离明治宪法的尖锐分歧，三五体制步入第二年时已举步维艰，前路晦暗不明。"
 JAP_vortex_of_the_army:0 "陆军的漩涡"
 JAP_vortex_of_the_army_desc:0 "继田中义一暴卒、山梨半造失势，准长州阀势力大多汇聚于宇垣麾下。然而，凭借上原勇作元帅庇护诞生的皇道派，与围绕天才新锐永田铁山崛起的统制派，正激烈撼动现有秩序。两派均指斥当下的“南次郎-松井石根军政府”为阻碍真正革新的障碍，暗流涌动中，大规模政变的密谋正在发酵。"
 JAP_red_shadow_resistance:0 "狩猎赤色之影"
 JAP_red_shadow_resistance_desc:0 "虎之门事变后，大规模的左翼清洗虽遏制了马克思-工团主义势力的公开蔓延，却也迫使其转入地下并日趋激进。连年的政治动荡与社会骚乱中，残存的革命分子与新兴宗教、黑道等势力逐渐合流，严重威胁着我们的政权稳定性。"
 JAP_fortified_bureaucratic_machine:0 "强化的官僚机器"
 JAP_fortified_bureaucratic_machine_desc:0 "新体制亦非全无建树。至少，各省部的行政效能得到前所未有的强化。然而，改革的主导权正日益落入官僚之手，新体制的核心精神面临流于形式、沦为官僚工具的巨大风险。"
#党派名称
 JAP_totalist_party:0 "政革评"
 JAP_totalist_party_long:0 "政治革新评议会\n\n§W政治革新评议会是以麻生久、赤松克麿为核心的国家社会主义集团。该组织由原日本劳农党中坚力量与转向社会主义的知识分子构成，主张通过“官民合作”彻底摧毁旧有的资本主义议会制。不同于传统的马克思主义，政革评强调以天皇为中心的生产力统合，试图在国家机器的领导下实现社会财富的重新分配，是新体制运动中最为激进的左翼侧翼。§!\n"
 JAP_syndicalist_party:0 "劳总评"
 JAP_syndicalist_party_long:0 "日本劳动组合总评议会\n\n§W劳总评是日本残存的非非法激进工人组织。在《治安维持法》的高压下，该组织摒弃了直接的武装斗争，转而效仿欧洲的工团主义模式，试图通过产业工会的横向联合来掌握国家命脉。虽然在宇垣内阁的统制经济下受到严密监管，但其在重工业基地依然拥有不可忽视的基层动员力。§!\n"
 JAP_radical_socialist_party:0 "无产党"
 JAP_radical_socialist_party_long:0 "日本无产党\n\n§W日本无产党是坚守合法斗争路线的左翼政党残余。在麻生久等人转向国家社会主义后，该党由坚持阶级斗争学说的原劳农派成员组成。他们反对新体制运动对劳工权利的剥夺，主张在宪法框架内争取社会公正。由于其坚定的反战与民权立场，该党正面临着来自治安当局与“政革评”的双重挤压。§!\n"
 JAP_social_democrat_party:0 "社民党"
 JAP_social_democrat_party_long:0 "社会民众党\n\n§W社会民众党是由安部矶雄、片山哲领导的温和改良主义政党。该党始终坚守传统的社会民主主义立场，拒绝了麻生久一派提出的“国家社会主义”转型方案。在各方势力纷纷向新体制运动投诚的背景下，社民党成为了唯一坚守议会民主、主张通过社会立法而非暴力统制来改善民生的左翼力量。由于其坚持拒绝与军部深度合流，该党在当前政坛中正处于被边缘化的艰难境地。§!\n"
 JAP_social_liberal_party:0 "议政会-明政"
 JAP_social_liberal_party_long:0 "国民议政会-明正会（尾崎派）\n\n§W在民政党因滨口首相遇刺而陷入分赃不均、革新俱乐部因秋田清的投机而四分五裂后，“宪政之神”尾崎行雄率领反对治安维持法的左派议员，联合武藤山治的国民同志会，组成了明正会。尾崎行雄并未选择消极抵制，而是主张通过加入宇垣内阁的“国民议政会”，从内部纠正官僚统制的偏向。§!\n"
 JAP_market_liberal_party:0 "议政会-立民/明正"
 JAP_market_liberal_party_long:0 "国民议政会-立宪民政党/明正会（三木派）\n\n§W立宪民政党是在推翻山梨半造内阁的第二次护宪运动后，由宪政会与革新俱乐部组成的自由帝国主义政党，是日本城市中产、金融财阀及知识阶层的政治代言人。但在滨口总裁遇刺后分崩离析，持革新立场的安达谦藏离党另立中央，残存的民政党由币原喜重郎与井上准之助等精英官僚把持，他们利用与宇垣一成将军的密切关系，在议政会中占有相对优势。\n\n三木派是明正会内部围绕三木武吉形成的党内派系，其成员多为民政党内留守的关东籍骨干及走投无路的床次派残余。在安达谦藏带走激进派另立门户后，三木武吉凭借其在关东深厚的基层根基，迅速将这一群体整合为议政会内最强大的政策游说集团。他们多数是现实的权力主义者，旨在通过行政权力为关东财阀与中型实业家争取垄断红利，以对抗军部直接接管工厂的威胁。§!\n"
 JAP_social_conservative_party:0 "议政会-政友/同交/中正"
 JAP_social_conservative_party_long:0 "国民议政会-立宪政友会/同交会/政友中正会（犬养派）\n\n§W立宪政友会曾经是日本历史上最辉煌的政党之一，由伊藤博文组建，在原敬庇护下渡过了相当长的“纵断政权”时期。然进入昭和初年后不断分裂，目前仍留在党内的有森恪-铃木喜三郎、久原房之助与前田米藏三派，他们代表了与军部有深度利益往来的旧官僚和地方士绅，但反对宇垣一成和民政党相互勾结所主导的议政会体系。\n\n同交会由鸠山一郎在反对森恪夺权后率部出走组建。同交会是政友会谱系中最具“护宪”色彩的派系。他们坚持原敬时代留下的“政党政治”遗产，认为宇垣一成的国民议政会应当是一个权力受限的立法咨询机构。他们支持选举肃正，但极力反对通过治安法来剥夺公民的基本权利。\n\n政友中正会由“宪政之神”犬养毅领导，其核心力量来源于原革新俱乐部中拒绝激进化的成员，并收编了大量在床次竹二郎死后失去方向的议员。犬养派是议政会内最具“感化”色彩的群体，犬养毅利用其无可置疑的个人道德权威，在议政会中为濒临崩溃的农村争取救济预算。他们对军部的扩张持悲观且克制的态度，试图通过“国民合作”的温和叙事，缓解日益尖锐的阶级矛盾。§!\n"
 JAP_authoritarian_democrat_party:0 "议政会-民盟/中正"
 JAP_authoritarian_democrat_party_long:0 "国民议政会-国民同盟/政友中正会（山崎派）\n\n§W国民同盟由“选举之神”安达谦藏在滨口遇刺、民政党内讧后愤而组建。国民同盟的政治底色是“清廉的威权主义”。安达谦藏认为，日本危机的根源在于两大政党与大财阀之间深度的金权政治。因此，该党的核心政见是推行彻底的选举肃正，试图通过行政手段切断资本对投票的干预。\n\n山崎派是政友中正会内部派系之一，由床次派崩溃后，山崎达之助率领的实务官僚集团。山崎派成员多为拥有农林、商工背景的行政专家，他们对犬养毅的“感化政治”感到厌倦，认为只有通过军部主导的强力统制才能解决当前的困局。他们带来了床次派中最具组织力的关东与满洲人脉，为宇垣内阁提供了执行总体战所需的专业官僚班底。§!\n"
 JAP_paternal_autocrat_party:0 "陆军-皇道派/清军派"
 JAP_paternal_autocrat_party_long:0 "大日本帝国陆军-荒木真崎阀/松井-南阀\n\n§W陆军内部的双头政治是当前帝国最不稳定的暴力核心。以荒木贞夫、真崎甚三郎为首的“皇道派”在基层青年军官中拥有神格化的地位，主张以“昭和维新”彻底铲除所有党阀。\n与此同时，松井石根与南次郎领导的“清军派”则更倾向于通过体制内手段，与新兴的统制派合作，利用新财阀与满洲资源实现高度国防国家。§!\n"
 JAP_national_populist_party:0 "政革评/东方会"
 JAP_national_populist_party_long:0 "政治革新评议会/东方会\n\n§W在麻生久领导的“政革评”内部，一部分激进的转向者已经彻底剥离了早期国家社会主义的阶级色彩。他们不再关心生产力的社会统合或劳工福利，而是全身心地投入到“日本主义”的狂热中。他们主张与中野正刚所领导的超国家主义团体东方会合流。中野本身出身于古典自由主义背景，曾是议会政治的捍卫者，但在面对“非常时局”的无力感时，受到英国奥斯瓦尔德·莫斯利爵士的启发，试图建立一种“天皇制极权主义”，即在形式上保留对皇室的最高崇拜，但在实质上通过一个单一的、跨阶级的领导党来接管国家的所有社会功能。§!\n"
#文字提示
 JAP_70th_DIET_AGENDA_TT:0 "§Y第七十届帝国议会将开始，议会将就近期动荡的国际金融局势及其对国内农村的冲击进行紧急质询。§!"
 JAP_RIGHT_WING_MANDATE_TT:0 "§Y §F近卫公爵§!对内阁的信任度将会下降，但这有助于维持§C宪政体制§!的存续。 §!"
 JAP_MAY_INCIDENT_WARNING_TT:0 "§R所有的矛盾都将在五月汇聚。请确保近卫师团与海军陆战队的忠诚，或者准备迎接一场彻底的洗礼。§!"
#开局国策
 JAP_ugaki_new_year:0 "宇垣内阁的新一年"
 JAP_ugaki_new_year_desc:0 "自1934年宇垣大将组阁，政治革新运动风起云涌，各方俊杰投身新体制建设。1936年的元旦，宇垣首相在官邸接见了国民议政会的各党领袖。尽管新年贺词中满是“革新”与“进取”的辞藻，但谁都清楚，这场新体制运动已陷入泥淖。旧党阀的残余势力正熟练地在官僚体系中消解改革的政令，而那些曾经热血的运动支持者，也因分赃不均或理念偏差，正逐渐演变为行政效率的绊脚石。在军部对统帅权的虎视眈眈与国体明征的喧嚣声中，宇垣内阁步入第二年时已是步履维艰，前路晦暗不明。"
 JAP_inoue_austerity_shadow:0 "井上紧缩的阴影"
 JAP_inoue_austerity_shadow_desc:0 "井上财政的紧缩路线已将农村经济推向崩溃边缘，社会动荡一触即发。宇垣内阁本质上是各方势力为保护农村、遏制激进通缩而达成的政治妥协。主要阁僚，如内务大臣儿玉秀雄、外务大臣出渊胜次均以超然地位入阁，大藏大臣山本达雄虽保有政友中正会籍，实则也是基于非党派的技术官僚考量，试图在稳健财政与基层生计间寻找一线生机。"
 JAP_70th_imperial_diet:0 "第七十届帝国议会"
 JAP_70th_imperial_diet_desc:0 "作为三五体制下的首次大考，本届议会充斥着派系暗流。内阁共事者各怀鬼胎；在野党死咬“国体明征”议题，试图通过意识形态攻击瓦解宇垣的合法性。如何在预算案与扩军计划间达成妥协，将决定新体制能否迈出实质性的一步。"
 JAP_election_purification_fruits:0 "收获选举肃正成果"
 JAP_election_purification_fruits_desc:0 "选举肃正是对选举公营化的激进尝试，旨在斩断政党与金权政治的血脉。通过打击黑金政治，原本由两大政党垄断的选举名额开始向“新官僚”与地方实业家开放。以此实质上削弱旧党阀对基层议位的绝对掌控，为新体制注入活力"
 JAP_quieting_the_barracks:0 "安抚不稳的营房"
 JAP_quieting_the_barracks_desc:0 "陆军士官学校事件后，营房里的不满情绪正在蔓延。那些青年军官将宇垣视为背叛者。我们必须通过局部的人事调整和适度的扩军承诺，暂时稳住这群躁动的野兽。"
 JAP_suppressing_new_order:0 "压制新体制的躁动"
 JAP_suppressing_new_order_desc:0 "新体制运动本应是国家的脊梁，但少部分激进民族主义与国家社会主义者混入了我们的队伍。在近卫公爵的默许下，大批民间右翼分子正借革新之名渗透进基层组织。这些“昭和维新”的狂热信徒不仅威胁到三五体制的稳定性，更试图绑架国家走向极权。为了维护国体与宪政，我们必须动用《治安维持法》，掐灭这些危险的火苗。"
 JAP_summer_campaign_approaches:0 "夏之阵来临……"
 JAP_summer_campaign_approaches_desc:0 "五月的空气中弥漫着硫磺的味道，一场决定帝国未来十年走向的大事变已在弦上……"
#松井石根-南次郎军政府
 JAP_total_martial_law:0 "全面戒严之后"
 JAP_total_martial_law_desc:0 "事变的硝烟尚未散去，宇垣政府的宪政外壳已在爆炸中化为齑粉。现在，帝都的每一条街道都由战车和刺刀守卫。在非常时局平息前，戒严令将是帝国的最高法律。"
 JAP_active_service_minister:0 "限定军部大臣现役制"
 JAP_active_service_minister_desc:0 ""
 JAP_force_peace_preservation_law:0 "强制修正治安维持法"
 JAP_force_peace_preservation_law_desc:0 "鉴于之前发生的种种破坏国家安全的大事件，我们将强制让国会通过由我们提出的治安维持法修正案，将“怀疑”视为“定罪”的充分理由。任何对政府方针持有微词的个人，都将被视为破坏国体的叛徒。"
 JAP_birth_of_dai_nippon_political_association:0 "大日本政治会之始"
 JAP_birth_of_dai_nippon_political_association_desc:0 ""
 JAP_industrial_control_expansion:0 "产业统制扩大化"
 JAP_industrial_control_expansion_desc:0 "将国家信用注入核心工业部门。自由市场必须让位于国防需求，所有关键原材料的流动都将由军部派驻的监察员审核。"
 JAP_expelling_political_parties:0 "排击政党势力"
 JAP_expelling_political_parties_desc:0 "旧时代的党阀是新体制的毒瘤。通过行政和法律手段，剥夺政党对地方资源的调配权，彻底终结议会政治的残余。"
 JAP_new_zaibatsu_into_manchuria:0 "新财阀入满"
 JAP_new_zaibatsu_into_manchuria_desc:0 "我们将引入日产等新兴财阀进入满洲，通过满铁的技术积累与新兴资本的结合，将关外打造成帝国最坚固的工业基地。"
 JAP_patriotic_combination:0 "组合报国之大义"
 JAP_patriotic_combination_desc:0 ""
 JAP_three_year_rearmament:0 "三年扩军计划"
  JAP_three_year_rearmament_desc:0 ""
 JAP_military_zaibatsu_merger:0 "军财之合抱"
 JAP_military_zaibatsu_merger_desc:0 ""
 JAP_establish_kowa_in:0 "设立兴亚院"
 JAP_establish_kowa_in_desc:0 "剥夺外务省对华权限，由陆军主导的兴亚院统一负责大陆行政、开发与渗透工作。这是实现大亚细亚主义的指挥部。"
 JAP_national_life_control:0 "国民生活统制"
 JAP_national_life_control_desc:0 "战争不是前线的特权，而是全体国民的义务。通过邻组和报国会，国家将全面干预粮食、能源与生活必需品的分配。任何超额消费都被视为对战力的侵蚀，节约即是报国。"
 JAP_5_year_production_plan:0 "生产力扩充五年计划"
 JAP_5_year_production_plan_desc:0 "在企划院的统筹下，帝国步入指令性经济时代。通过强制性的资本集中，五年内必须实现钢铁、铝材与液化石油产量的翻倍，为旷日持久的大陆战争修筑工业长城。"
 JAP_china_cooperation_work:0 "对华提携工作"
 JAP_china_cooperation_work_desc:0 "兴亚院的工作重点在于提携。通过扶持亲日政权与民间社团，我们在名义上尊重其主权，实则通过军事顾问与经济协议，将其纳入帝国的防共与资源版图。"
 JAP_manchurian_network_funding:0 "资助满洲人脉活动"
 JAP_manchurian_network_funding_desc:0 "满洲不仅是领土，更是帝国的战略支点。通过秘密资金扶持亲日的满系官僚、蒙旗首领以及宗教领袖，确保关外资源的持续外流，并为进一步的北进或南下建立情报网。"
 JAP_unlimited_military_deficit:0 "无限度军事赤字"
 JAP_unlimited_military_deficit_desc:0 "既然生产力已经统制，那么通货膨胀只是数字游戏。为了满足扩军计划，国家银行将无限制承销军债，只要战争胜利，整个亚洲的资源都将是我们的偿债基石。"
 JAP_liberation_of_asian_race:0 "亚细亚一族之“解放”"
 JAP_liberation_of_asian_race_desc:0 "松井石根大将指出，日本作为东亚的盟主，必须将亚洲同胞从白人殖民者的枷锁中“解放”出来。这种解放伴随着刺刀与和服，旨在建立一个由帝国绝对主导的新秩序。"
