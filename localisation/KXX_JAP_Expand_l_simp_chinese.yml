 KXXJAP.168.t:0 "新的首相人选"
 KXXJAP.168.d:0 "在历经四年的动荡之后，众议院终于迎来了下一届的选举。政党们在举国一致内阁期间势力此消彼长。铃木在平沼男爵的帮助下彻底掌握了政友会的主导权，民政党则日益衰退，也转向了天皇中心主义原则。现在，我国的国体在平沼为首的国本社系官僚及政客下得到了维护，神祇院的设立更是深化了国家神道的掌控力。日本的未来将是国粹主义的未来，举国一致的未来。"
