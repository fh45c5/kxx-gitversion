 KXXJAP.135.d:0 "由元老西园寺公望，新的内大臣木户幸一敲定的首相人选已经提交给裕仁陛下圣裁。各方势力都在盘算是否能从中抓住机会，分得自己的一杯羹。\n“西园寺公爵殿下，深思熟虑，权衡国政之危局、民心之期盼、军内之平衡、皇统之安定……特此荐举——”"
