 KXXJAP.7.f:0 "石井四郎"
 KXXJAP.8.t:0 "陆军向天皇推荐新内阁总理大臣"
 KXXJAP.8.d:0 "虽然陆军已经实际掌握政权，宪政已无存在之实，但出于维护稳定的考虑，我们必须向天皇有个交代，即使是山县有朋当年的任期也不过共四年耳。权衡利弊，推出一个新的内阁总理大臣，既要让天皇满意，又要维护我方的利益。"
 KXXJAP.8.a:0 "荒木贞夫"
 KXXJAP.8.b:0 "真崎甚三郎"
 KXXJAP.8.c:0 "山下奉文"
 KXXJAP.8.e:0 "松井石根"
 KXXJAP.8.f:0 "小畑敏四郎"
 KXXJAP.8.g:0 "本庄繁"
 KXXJAP.9.t:0 "日本要求屈服"
 KXXJAP.9.d:0 "日本政府和头山翁都向我们表达了直接统治的要求，我们必须抉择。"
 KXXJAP.9.a:0 "别无选择"
 KXXJAP.9.b:0 "不给咋地"
 KXXJAP.10.t:0 "1936年众议院选举结果"
 KXXJAP.10.d:0 "1936年的众议院选举如期而至，按照惯例，获得半数以上或相对多数席位的党派将被天皇任命组阁，总裁成为内阁总理大臣。"
 KXXJAP.10.a:0 "犬养毅总裁带领政友会保持了多数！"
 KXXJAP.10.b:0 "井上准之助总裁带领民政党压倒了政友会！"
 KXXJAP.10.c:0 "安达谦藏总裁带领国民联盟拿下选举！"
 KXXJAP.10.e:0 "安部矶雄主席带领社会大众党取得了第一次多数！"
 KXXJAP.10.f:0 "山宣领导无产党爆冷了！"
 KXXJAP.11.t:0 "犬养毅遇刺"
 KXXJAP.11.d:0 "混乱的夜晚。海军军官和陆军军官分别劫持了几辆出租车，目标直指首相官邸。\n车辆粗暴地停在官邸门前。海军中尉三上卓率先带人冲向玄关，打伤门口守卫的警察，强行撞开大门。\n海陆军两拨人冲入官邸，四处搜寻首相犬养毅。没料到，犬养毅本人正在餐厅。\n三上卓见到目标，当即拔出手枪意图射击。一个黑色的讽刺：他的枪，忘记上膛了。\n面对闯入的军人，犬养毅要求谈话。在短暂而无用的谈判后，海军中尉山岸宏失去了耐心。\n“别废话了！”他爆起喊道，随即开枪。\n枪声成了信号，其他人也纷纷开火。"
 KXXJAP.11.a:0 "犬养公终究没能逃过一劫。"
 KXXJAP.12.t:0 "井上准之助遇刺"
 KXXJAP.12.d:0 "首相井上准之助正从官邸撤离，暗巷中骤然冲出两名平民装束的袭击者，对着汽车方向迅速开枪。\n护卫警察立即反击，街头迸发短暂而激烈的对射，两名袭击者很快被制服。\n然而，就在这短暂而致命的混乱中，一发子弹精准地贯穿了井上准之助的胸口。\n鲜血染红了他的衣襟。护卫们迅速将他抬上车，试图挽救他的生命，但为时已晚。"
 KXXJAP.12.a:0 "让国家陷入不景气中的，到底是谁呢？到底是谁啊！"
 KXXJAP.13.t:0 "安达谦藏逃过一劫"
 KXXJAP.13.d:0 "在紧张局势加剧的夜幕下，安达谦藏首相在严密的护卫下，迅速而有序地从首相府邸后门撤离。\n车队沿着预定的安全路线疾驰，穿行于寂静的街道。\n最终，车队安全抵达了位于德意志帝国大使馆。\n安达谦藏迅步下车，在使馆人员的接应下，身影很快消失在使馆厚重的大门之后。"
 KXXJAP.13.a:0 "命不该绝"
 KXXJAP.14.t:0 "安部矶雄遇袭"
 KXXJAP.14.d:0 "在紧张撤离的过程中，首相安部矶雄在党内同志片山哲、水谷长三郎以及随行警卫的护卫下，正欲登车离开。\n突然，一声剧烈的爆炸在近处轰然响起！强烈的冲击波裹挟着碎片瞬间袭来，安部矶雄首当其冲，被重重地掀倒在地，顿时失去了行动能力。\n身处爆炸边缘的片山哲和水谷长三郎也被波及，惊魂未定的两人强忍不适，迅速与尚能行动的警卫一起，奋力将重伤昏迷的安部矶雄抬离险地。\n在混乱与急切中，他们拦截到交通工具，紧急将安部送往距离事发地最近的医院。"
 KXXJAP.14.a:0 "善良的人，总是难逃厄运。"
 KXXJAP.15.t:0 "山本宣治遇刺"
 KXXJAP.15.d:0 "在遭遇袭击的危急关头，负责护卫山本宣治首相的警卫竟率先逃离了现场，将首相一人遗弃在危险的黑夜当中。\n面对蜂拥而至的袭击者，孤立无援的山宣并未束手就擒，而是试图肉搏自保。激烈的扭打中，他头部遭受重击，顿时血流满面。\n然而，一名陆军军官趁机上前，拔出手枪，向山本宣治连开数枪。\n山本宣治当场倒地，鲜血染红了寂静的街道。袭击者们迅速散去，留下满地狼藉与一片死寂。"
 KXXJAP.15.a:0 "悲剧的英雄。"
 KXXJAP.100.t:0 "不安的预谋"
 KXXJAP.100.d:0 "东京市外的某处住宅内，纸窗敞着半扇，夜风湿漉漉地渗进来，带着新叶和泥土的气息。壁炉是冷的，空余一堆灰白的残烬。一盏油灯搁在矮几上，火苗被风扰动，昏黄的光晕在空旷的和室梁柱间不定地晃。角落里松木板壁的霉味，被湿气裹着，沉甸甸地浮在空气里。井上日召将削完水果的小刀收回皮鞘中，一旁的橘孝三郎正把一份报告按在膝上，沉默地等待着。大川周明正低着头，面对着铺开的东京地图，在大大小小的角落处做着标记。\n油灯火苗猛地一跳。\n“差不多了。”大川丢下炭笔，声音低沉。\n橘立刻接话，手指戳向地图：“断电，翻墙，我的人做。”\n井上则慢条斯理地说：“夜班守卫少，墙头空。孩子们都安排好了，出身都干净，一人一杀。”\n大川点头，将东京那些有名人的相片从桌下拾起，散在地图上。“团琢磨、池田成彬、牧野伸显……”\n外面传来隐约的、沉闷的敲击声，那是他们三个的人在准备着明日的正式行动。\n橘孝三郎突然抬眼逼视大川，摸出一张纸条：“那边的青年军官，起事时间能咬死？”他声音压得很低。\n大川从地图上撕下一角，凑近油灯火苗。纸页边缘卷曲焦黑。“定了。”火焰贪婪地吞噬着纸片。井上霍然起身，刀鞘撞上矮几，“当”的一声脆响。油灯的光猛烈摇晃，三人的影子在斑驳墙面上狂乱地扭动了一瞬。窗外，骤雨终于砸了下来，密鼓般捶打着屋顶。"
 KXXJAP.100.a:0 "风雨欲来，山河燃烧……"
 KXXJAP.101.t:0 "玄洋与大本"
 KXXJAP.101.d:0 "大阪某处，神龛上松枝燃烧的烟雾混着线香，凝成青白色的旋涡，在梁柱低垂的幽暗空间里缓缓上升。厚重的榻榻米中央，几处深陷的凹痕显示着常有人跪坐。木格窗外，城市的喧嚣被厚重的墙壁隔绝，只余一片沉闷的寂静。\n出口王仁三郎盘膝端坐于蒲团之上，宽大的白色祭袍下透出富态圆润的身形。他圆润的面庞上，一双细长的眼睛几乎隐没在眼睑的褶皱里，只偶尔在烟雾中闪过一丝让人捉摸不透的光，仿佛永远在浅笑。他厚实的手指无意识地摩挲着矮几上那块温润龟甲的神秘刻痕，一旁搁着半碗冷透的茶。\n对面，内田良平虽也盘坐，但灰白相间的长须如银瀑般垂落胸前，几乎覆住了整个前襟，透出年长者的威严。他刚从风尘仆仆的旅途下来，灰色和服衣襟一丝不苟，靴子边缘还沾着干燥的关东泥土，唯有那双锐利的眼睛，在皱纹和白须的包围中，依旧如鹰隼般刺破了烟雾。\n“下位的手笔，确实像样了。”出口的声音低沉缓慢，带着奇特的共鸣，他眯缝的眼缝似乎更细了。窗外树影落在他圆润的脸上。“关西的‘维’，已有筋骨。”\n内田良平没有碰面前的茶水，他灰白的长须微不可察地颤动了一下，锐利的目光穿透烟雾，直钉向出口那双仿佛闭合的眼睛：“筋骨有了，现在要看东京那边的‘新’。”他解开和服前襟，取出一枚卷得极紧的蜡丸，两指捏着，轻轻放在龟甲边缘，动作间长须随之拂动。“风，从江户城那头吹来了，很大。青年军官的火把……要点燃了。”他话语里每一个音节都像锤子敲打铁砧。\n出口王仁三郎一直眯着的双眼骤然睁开了极细的一线，精光乍现，如同暗室中划过的冷电，圆脸上的和蔼瞬间被一种深沉的警觉取代。他厚实的手指猛地攥紧了龟甲，指节发白。烟雾在他头顶盘旋，几乎要触到低矮的房梁。寂静中，只有线香燃烧的“哔啵”声，以及内田良平身上那股来自东京的、尚未散尽的风尘与铁锈气息。"
 KXXJAP.101.a:0 "“昭和神圣会在必要时会配合。”"
 KXXJAP.102.t:0 "青年的交谈"
 KXXJAP.102.d:0 "雨点单调地敲打着营房屋顶的铁皮，像无数小锤在头顶不耐烦地计数。一盏煤油灯的火苗在窗缝漏进的冷风中左右摇摆，将桌边几张年轻面孔的影子拉扯得扭曲不定。空气滞重，混杂着旧呢子军装的汗味、机油味和一种微妙的焦灼。桌上摊着一份《步兵操典》，书页边缘卷曲发黑，旁边散落着几块干硬的饭团。\n矶部浅一背靠冰冷的铁皮墙，手指无意识地捻着军装上一粒脱线的线头，声音却刻意压得扁平，像在讨论明天的操课：“……都确认了？明晚九点，可别像上次演习那样，连集合地点都摸错。”\n桌边，香田清贞猛地拽了下自己的衣领，仿佛那领口勒得他喘不过气，他眼皮低垂盯着桌面，喉结却上下滚动得厉害，从齿缝里挤出的声音带着细微的颤音：“地方？闭着眼睛都能摸到！跟去澡堂子一样熟！”他放在桌下的右手，指关节死死抵着冰冷的刀镡，用力到发白。\n安藤辉三大尉拿起一块饭团，指尖捏着米粒，仿佛在研究其硬度，语气平淡无波：“饭要煮得恰到好处，太软了不行，硌牙的也不行。”他抬起眼，目光扫过其他几人，那眼神却像淬了冰的探针，“米粒要一粒是一粒。”河野寿大尉和野中四郎大尉下意识地挺直了背脊，像回答长官训话。“真崎阁下那边……”野中四郎的声音有点飘，他拿起水壶想喝，手却一晃，水洒在了《步兵操典》上。\n“嗯？”矶部捻线头的动作停了，他抬眼，阴影里那目光锐利得像针，“阁下只关心明天的天气好不好。”他的嘴角似乎往上扯了一下，又似乎没有，“……晒不晒靴子。”他顿了顿，声音陡然压低，切进核心：“西田税先生那边，联络上了没有？”\n角落里，那名尉官正用铅笔在《步兵操典》空白页上用力划着什么，笔尖“沙沙”声骤然停了。\n安藤辉三捏着米粒的手指猛地一紧，指尖泛白，声音却异常清晰，斩钉截铁：“联络上了。北一辉先生也写了回信。”\n河野寿像是被这简短的回答烫了一下，身体微微一震，脱口而出：“好！”声音在安静的雨声里显得格外突兀，他脸上瞬间涌起一片不正常的潮红，急忙低下头。\n短暂的死寂。只有雨点密集地捶打着铁皮，发出连绵不绝的轰鸣，像无数颗心脏在胸腔外疯狂鼓动。煤油灯的火苗剧烈一跳，巨大的阴影瞬间吞没了半张桌子，也将几张年轻、绷紧、被狂热的决心与冰冷的恐惧撕扯着的面孔，更深地埋进昏暗里。"
 KXXJAP.102.a:0 "维新的本意到底是什么呢……"
 KXXJAP.103.t:0 "永田的工作"
 KXXJAP.103.d:0 "陆军省大楼的走廊空旷寂静，唯有永田铁山少将办公室的门缝下，渗出惨白的长管日光灯冷光，在昏暗的过道上切割出一道狭长、刺眼的光带。室内空气凝滞，弥漫着优质烟草的余烬、旧纸张的微尘和一种近乎无菌的冰冷秩序。巨大的办公桌纤尘不染，文件整齐如刀切，唯一稍显杂乱的是一杯早已冷透、颜色浑浊的茶。窗外，东京的夜色被霓虹浸染，遥远而模糊，办公室内却只有日光灯管发出的、令人神经紧绷的微弱“嘶嘶”声。\n永田铁山端坐于宽大的办公椅中，背脊挺直如标枪。他肩章上少将的金星在冷光下反射出一点锐利的光。他低头看着一份常规的军需报表，手中的红蓝铅笔在纸面上缓慢移动，留下精确、克制的批注线条，仿佛那才是值得他全神贯注的世界。他脸上没有任何表情，只有镜片后那双眼睛，深邃、冷静，如同两泓不见底的寒潭，映照着白纸黑字，也映照着某种外人无法窥见的计算轨迹。\n敲门声轻响三下，一名年轻参谋官推门而入，脚步放得极轻。他脸色有些苍白，迅速敬礼，声音刻意压低，带着一丝不易察觉的紧绷：“阁下，刚才……宇佐美中佐从宪兵队那边过来，说最近几天，有几个据点附近的‘闲杂人员’……走动得有些异常。”参谋官喉结滚动了一下，“中佐提醒，特别是……‘明晚’的常规巡逻路线，或许……需要重新评估。” 他没有提及任何具体的名字或“皇道派”，但“异常走动”、“明晚”、“重新评估巡逻路线”这些词，在陆军省这个核心之地，已是露骨的警报。\n永田铁山的红蓝铅笔没有丝毫停顿，笔尖在“弹药基数”一栏划下一个精确的圈。他只是极轻微地点了下头，从喉咙深处发出一声近乎气流的回应：“嗯。”仿佛听到的只是关于纸张供应的琐碎报告。\n参谋官迟疑了一下，似乎想再补充什么，但看到永田铁山那纹丝不动的专注姿态，最终还是将话咽了回去，敬礼，悄然退下。\n门轻轻合拢。办公室再次陷入死寂，只有日光灯管持续的低鸣。\n永田铁山终于抬起了头。他没有看门的方向，目光转向了桌上那杯冷透的茶。他伸出两根手指，指腹轻轻贴了一下粗糙的瓷杯外壁——冰冷刺骨。随即，他那双毫无波澜的眼睛缓缓移向桌角一份不起眼的文件。那是今天下午由他的心腹副官悄悄递上的，只有一行字，来自一个无法查证的情报管道：“目标：阁下。时间：明夜。”文件被他压在一份关于“昭和十一年度军费预算”的草案下。\n他拿起那份预算草案，如同对待最寻常的工作，目光扫过一行行数字。另一只手却无意识地、极其缓慢地捻动着桌上那支红蓝铅笔，指尖因用力而微微泛白，暴露了那副钢铁躯壳下，并非全然的平静。窗外，霓虹灯的流光在他的镜片上滑过，留下短暂、冰冷而虚幻的光痕。"
 KXXJAP.103.a:0 "这次的暴动计划，不寻常。"
 KXXJAP.104.t:0 "俱乐部畅谈"
 KXXJAP.104.d:0 "海军省军官俱乐部小厅的空气里，弥漫着与陆军省迥异的味道：上等古巴雪茄的醇厚烟云、陈年苏格兰威士忌的泥煤气息，以及昂贵的柚木家具被打磨抛光后散发的暖香。厚重的丝绒窗帘隔绝了东京的寒冷与喧嚣，壁炉里并非真火，但仿炭精电炉发出的橙光，在深色镶板墙上跳跃，营造出一种人造的暖意与松弛。留声机低低播放着拉赫玛尼诺夫的《练声曲》，旋律婉转流淌，却掩盖不住角落里几声刻意压低的议论。\n几名海军将佐靠在宽大舒适的皮沙发里，肩章上的锚徽在暖光下显得温润。主导谈话的是军令部一位资深参谋，藤田中将。他指尖优雅地夹着雪茄，烟灰积了长长一截，却并不弹落，任由它弯曲成一个危险的弧度。他目光透过袅袅烟雾，投向虚空，仿佛在欣赏音乐，嘴角噙着一丝难以捉摸的笑意。\n“下雪了？”藤田忽然没头没尾地问了一句，声音慵懒。\n坐在他对面的一名大佐立刻会意，轻晃着杯中琥珀色的液体，冰块叮当作响，他嗤笑一声：“东京湾今晚风平浪静……不过嘛，‘隔壁’的炉子，倒是烧得有点太旺了。听说几个年轻‘消防员’，嫌那烟囱堵得太死？”\n另一名少将慢悠悠地接口，他正用小银勺仔细地切着面前的一块黑森林蛋糕：“炉子烧得旺不是坏事，烧掉些枯枝败叶，火苗自然就看得更清楚。只是……”他优雅地将一小块蛋糕送入口中，细细品味，“别把整栋房子点着了就行。我们这栋楼，可都是好木头。”\n“哼，”之前嗤笑的大佐放下酒杯，身体微微前倾，声音压低了几分，带着一丝混杂着厌恶与兴奋的复杂情绪，“‘消防员’里，可还有几个是当年江田岛一起爬桅杆的‘同期’呢！脑子热得发昏，跟着那些‘烧炉工’念邪经！”。\n藤田中将终于轻轻弹落了那截长长的雪茄灰。灰烬无声地飘落在水晶烟缸里，碎成粉末。他缓缓开口，声音不高，却像一把冰冷的解剖刀切入松弛的空气：“让他们烧。火势一起，谁是朽木，谁是栋梁，一目了然。”他顿了顿，目光终于聚焦，扫过在座几人，那份慵懒瞬间消失，只剩下深海般的冷冽，“我们备好水龙就够了。等‘必要’的时候……让那些脑子过热的小伙子们，清醒清醒。”\n壁炉的电光无声地跳跃了一下。留声机的音乐正好进入一个绵长而略带忧郁的尾音。小厅里陷入短暂的沉默。在场的海军精英们各自举杯啜饮，或低头整理袖口，无人再接口。雪茄的烟雾缓缓升腾，在他们头顶交织成一片模糊的网。窗外，东京的冬夜依旧深沉，隔着厚重的窗帘，听不到半点“隔壁炉子”里柴火爆裂的声响。"
 KXXJAP.104.a:0 "隔岸观火。"
 KXXJAP.105.t:0 "警察的苦恼"
 KXXJAP.105.d:0 "警保局长后藤文夫的办公室，笼罩在台灯昏黄的光晕里，像一艘在深夜迷雾中挣扎的孤船。空气污浊，混杂着廉价茶叶的苦涩、陈年卷宗的霉味和浓重的烟草烟气。文件堆积如山，摇摇欲坠，几乎淹没了那张宽大的办公桌。后藤文夫瘫坐在办公椅里，原本一丝不苟的头发有些散乱，领带松垮地耷拉着。他一只手用力揉着发胀的太阳穴，另一只手捏着一份薄薄的卷宗，指节因用力而发白。那份卷宗上潦草地记录着几条零散却令人心惊的情报：“新橋、神田一带，数处下级军官秘密集会，参与者情绪异常激昂。截获匿名印刷物残片，内容含激烈反政府、清君侧言论。”\n站在他面前的是警备课长安倍源基。这位以手腕强硬著称的警官，此刻脸上也带着难以掩饰的焦躁。他背着手，不停地在那点可怜的空地上踱步，皮鞋敲打着老旧的地板，发出空洞的回响，更添压抑。“局长！”安倍源基猛地停下脚步，声音因为压抑而微微发颤，“这绝不是寻常的牢骚！集会地点、人员成分、那些煽动印刷物的措辞……”他急促地吸了口气，仿佛要积聚勇气，“这指向性太明确了！我们必须……”\n“必须什么？”后藤文夫猛地抬起头，声音嘶哑而疲惫，打断了安倍的话。他布满血丝的眼睛里，充满了深深的倦怠和一种近乎绝望的清醒。他扬了扬手中的卷宗，纸张发出哗啦的轻响，更像一声无力的叹息：“把这些，送给‘隔壁’，然后呢？”他嘴角扯出一个苦涩到极点的弧度，“等着寺内像大阪那件事一样处理？”\n安倍源基的脸瞬间失去了血色。他记得寺内寿一那双毫不掩饰杀意与鄙夷的眼睛。一股寒气从脚底直窜上来，他下意识地摸了摸腰间的配枪皮套——那冰冷的触感在此刻显得如此多余和可笑。\n“他们……他们不会承认的……”后藤文夫的声音低了下去，充满了无能为力的颓丧，“他们会说这是内部事务，会说是青年军官的‘热血演习’，甚至会反咬一口，说我们挑拨军民关系，破坏帝国根基！”他疲惫地将那份卷宗重重摔在堆积如山的文件顶上，仿佛想将它彻底掩埋。“军队的事，军队自己管。我们……我们连自己的人都保护不了，还能做什么？”\n办公室陷入一片死寂。只有水壶还在嘶嘶地尖鸣，蒸汽顶得壶盖更加疯狂地“咔哒咔哒”跳动，仿佛随时要炸开。昏黄的灯光下，后藤文夫佝偻着背，像被无形的重担压垮。安倍源基僵立在原地，紧握着拳，指节捏得咯咯作响，眼中的警犬般的锐气被巨大的屈辱和恐惧取代，最终只能死死盯着地板，仿佛要将那里烧穿一个洞。窗外，陆军省大楼的灯光，在浓重的夜色里，依旧无情地亮着。"
 KXXJAP.105.a:0 "难左右……"
 KXXJAP.106.t:0 "一名“工人”的夜晚"
 KXXJAP.106.d:0 "东京下町区一座陈旧的木造长屋，在冬夜的寒风中发出不堪重负的呻吟。狭窄的楼梯陡峭而吱呀作响，通往二层最深处一间逼仄的出租屋。屋内仅有四叠半榻榻米大小，空气里弥漫着劣质木炭燃烧不完全的呛人烟气、旧榻榻米的霉味，以及一种类似铁锈和机油混合的、属于底层劳动者的气息。\n小林坐在冰冷的榻榻米边缘，背脊佝偻，粗糙的手紧攥着那张被汗水浸软的米纸。“明日，蛰伏，观察，待机，北方。”字迹在昏黄摇晃的灯光下模糊又刺眼。这字条是半小时前，在他下工回家的昏暗巷口，一个裹着厚围巾、低头匆匆走过的“醉汉”塞进他口袋的。\n他慢慢松开手指，米纸边缘留下湿漉的指印。他盯着它看了几秒，眼神像凝固的深潭。然后，他俯身，从榻榻米下拖出那个简陋的工具箱。箱子打开，没有明显的工具，只有用油布仔细包裹的金属零件、几团棉纱，以及几本卷了边的机械手册。\n他拿起一团棉纱，又放下。手指在那些冰冷的金属零件上无意识地拨弄、排列，发出细微的磕碰声。油污嵌在他的指甲缝里，与零件上的机油混在一起。远处工厂的汽笛又响了一次，悠长而沉闷，穿透蒙尘的气窗。\n小林站起身，动作带着一种长期压抑的僵硬。他走到那扇小小的气窗前，没有去擦玻璃上的厚灰，只是将额头轻轻抵在冰冷的窗框上。外面是凝固的黑暗，只有远处几点不明灯火，如同鬼火。他侧着头，耳朵几乎贴在玻璃上，仿佛想从那片死寂中捕捉一丝异常的动静——枪械的摩擦？匆忙的军靴声？什么都没有，只有自己血液在耳膜里鼓噪的回音，以及楼下长屋住户偶尔传来的模糊咳嗽。\n他离开窗边，回到灯泡下。昏黄的光线将他佝偻的身影投在糊着旧报纸的墙上，巨大而扭曲。他再次拿起那张米纸，指尖捻过“北方”两个字，力道重得几乎要捻破纸面。然后，他把它凑近灯泡上方的热源。纸角瞬间蜷曲、发黑，亮起一点微小的橘红火苗。火苗贪婪地舔舐着纸上的字句，“蛰伏”、“观察”、“待机”、“北方”——被火焰吞噬，化作一缕迅速消散的青烟，只留下一点焦糊的气味，很快被屋内的劣质炭烟和霉味覆盖。\n小林吹熄指尖残留的一点火星。空气里只剩下炭火的烟气、霉味和他的呼吸声。他走到墙角，蹲下，手指摸索到一块略有松动的榻榻米边缘。稍一用力，掀开一小块。下面是一个狭小的空间，油布裹着的硬物冰凉的轮廓清晰可见——那支南部式手枪。他没有拿出它，只是用指腹在那冰冷的油布上用力地、缓慢地来回擦拭了几下，像是要确认它的存在，也像是在安抚某种狂躁的冲动。油布上的机油沾了他一手。\n他放下榻榻米盖板，严丝合缝。起身，吹熄了灯泡。屋内瞬间被浓稠的黑暗吞噬，只有气窗透进一点微弱的城市夜光，勾勒出家具模糊的轮廓。\n小林在冰冷的榻榻米上躺下，扯过薄被盖到胸口。他没有闭眼，在绝对的黑暗里，睁着眼，望着低矮、被烟气熏得模糊不清的天花板。工厂的汽笛声似乎消失了，又或者只是被耳朵过滤了。时间像凝固的沥青，缓慢地、粘稠地流淌。外面，东京巨大的阴影笼罩着，寂静无声。他在等待。等待明天的第一声枪响，等待某种巨大的撕裂声，等待黑暗尽头可能亮起的、属于“北方”的光。手指无意识地抠着被角，指缝里的油污和机油气味，在黑暗中愈发清晰。"
 KXXJAP.106.a:0 "该流血了……"
 KXXJAP.107.t:0 "陆军异动"
 KXXJAP.107.d:0 "今天我们陆军大臣川岛义一已经感觉到了不对劲。近期基层军官秘密串联、部队夜间异动、激进言论甚嚣尘上，和民间右翼搭上了线。之前一些青年军官试探性地来询问他如果发生政变，陆军整体的态度是什么。夹在统制派与皇道派之间，对立宪政府也确实不信任的川岛含糊其辞，暗示了陆军高层不会大动干戈。但现在似乎一些民间右翼的恐怖行为正在影响着陆军下层，他也隐约听说了今晚可能发生恐怖袭击事件。但目前的情况很不明确，现在就把事情挑大反而会激化矛盾，他实在不知如何是好。"
 KXXJAP.107.a:0 "……让近卫军团监管他们，宪兵队的情况也要摸清。"
 KXXJAP.108.t:0 "东京的灯，灭了"
 KXXJAP.108.d:0 "时间像被冻住的沥青，粘稠地滑向预定时刻。东京的夜空，原本被都市的灯火切割得支离破碎，霓虹的河流在楼宇间喧嚣流淌。橘孝三郎的手指，粗糙而稳定，搭上了总闸冰冷的铸铁手柄。那手柄上凝结的水珠，像一层细密的汗。他身后的几个人如同鬼魅般贴在配电室潮湿的砖墙上，呼吸压得极低，只有眼白在昏暗中偶尔闪动，紧盯着外面空无一人的后巷。远处，隐约传来巡逻宪兵靴跟敲击路面的节奏声，一下，又一下，在凝滞的空气里格外清晰。\n橘没有回头，只是极轻微地点了颔。那动作几乎没带动他绷紧的肩线。\n“咔哒。”一声沉闷的、仿佛来自地底的咬合声响起。不响亮，却带着某种筋骨断裂的意味。\n刹那间——\n以这处配电所为中心，黑暗如同墨汁滴入清水中，迅猛无声地晕染开来。先是近处几栋低矮民居的灯火倏然熄灭，如同被无形的手掐灭了烛芯。紧接着，神田、新橋、麹町……一片又一片区域的灯火，如同多米诺骨牌般接连倒下。皇宫外苑的奢华灯饰、霞关官厅大楼里冰冷的日光灯管、银座橱窗流溢的霓虹、下町区窗口昏黄的灯泡……整个东京的血管，被瞬间截断。最后熄灭的是首相官邸门前那盏孤悬的路灯，光晕挣扎着收缩，最终化为一点微弱的红热，旋即没入彻底的墨色。\n巨大的城市陷入死寂，旋即被更巨大的声浪吞噬。\n“啊——！”\n“停电了？！”\n“怎么回事？！”\n惊呼、咒骂、奔跑的脚步、孩童的哭嚎、家具被撞倒的巨响……从无数个窗口、街巷中喷涌而出，汇聚成一片混沌的声浪，在这无光的城市上空翻腾。汽车的灯光骤然亮起，如同受惊野兽慌乱的眼睛，光束在黑暗中急促地扫射、相撞，喇叭声凄厉地撕破夜空，在突然失去参照物的街道上制造出新的恐慌和拥堵。\n警视厅大楼内，后藤文夫猛地从堆满文件的办公桌上抬起头，桌上的台灯灭了。他冲到窗边，只看到脚下本该灯火通明的霞关，此刻一片令人心悸的墨黑。他喉头滚动，想喊安倍源基，却只发出一声嘶哑的抽气声，一股冰冷的寒意顺着脊柱直冲头顶。\n几乎在灯光熄灭的同时，在陆军步兵第一联队驻地附近，野中四郎的手猛地按住了腰间的军刀刀镡。他压低的声音带着一种被压抑到极致的、近乎狂喜的嘶哑：“灯！灯灭了！”黑暗中，皮靴践踏泥泞积雪的声音、金属枪械碰撞的低沉摩擦声、压抑却急促的口令声骤然响起，汇成一股暗流，撕开营区的寂静，朝着那被黑暗笼罩的东京心脏——永田町方向，奔涌而去。\n东京，这座帝国的巨兽，在突如其来的、彻底的黑暗中，开始了它混乱而血腥的痉挛。"
 KXXJAP.108.a:0 "夜，开始了。"
 KXXJAP.109.t:0 "分叉之刃"
 KXXJAP.109.d:0 "断电后的东京，已是一片被黑暗与枪声撕裂的拼图。首相官邸周围，第1、第3步兵联队的年轻士兵们，脸上混杂着冻伤、紧张与狂热的赤红，在低级军官嘶哑的口令下构筑着临时工事。冰冷的刺刀在远处街灯微光下闪着幽蓝，枪口警惕地指向官邸内死寂的黑暗以及更外围未知的街区。他们已经包围了这里，像饿狼围住了猎物，但官邸深处的人物——首相是生是死？无人敢断言。无线电天线的残骸在寒风中摇晃，通讯已被掐断。\n在灯火管制下艰难行军的卡车车厢里，空气污浊而紧绷。n在煤油灯的光晕在颠簸中摇曳，映照着几张年轻却因决绝而显得扭曲的脸，地图摊在一箱弹药上，铅笔标记触目惊心：赤坂离宫、警视厅、日本银行、东京朝日新闻社、NHK放送会馆……这些是帝国的血脉与咽喉。\n“砰！”远处又一声枪响传来，不知是哪里的“清除”仍在继续。香田清贞猛地一拳砸在车厢板上，震得煤油灯剧烈摇晃，巨大的阴影瞬间吞噬了所有人。“磨蹭什么！”他声音嘶哑，眼球布满血丝，像濒临爆炸的锅炉，“名单上的人，一个都不能留！内大臣在神奈川，派一个小队，今晚就送他‘上路’！还有西园寺那个老……”他提到西园寺公望的名字时，声音像被砂纸磨过，充满了刻骨的恨意，但“公”字后的音节，终究没能痛快地吐出来。车厢内骤然一静。\n野中四郎喉结滚动了一下，下意识地抓紧了身边的三八式步枪，冰凉的金属感让他稍微冷静了些，他看向安藤辉三：“安藤君，西园寺公……毕竟是元老，动了他……”他没说完，但意思很明显——天皇的震怒、全国的唾骂、背叛“尊皇”初衷的风险。连最激进的矶部浅一，此刻也抿紧了薄唇，指节无意识地敲打着军刀刀柄，眼神在煤油灯的光影里明灭不定。西园寺，这个名字本身就是一个巨大的禁忌符号。\n安藤辉三沉默着。他脸上没有任何表情，只有那双眼睛，在昏暗的光线下深不见底，如同两口冰封的寒潭。他在权衡。井上日召那套“流血净化”的理论，如同毒藤般缠绕着部分军官的心智，尤其是外围那些“民间义士”，他们渴望用政要和财阀的血染红“维新”的旗帜。而他们自己——这些身负军职、打着“昭和维新”旗号的军官们——真正的目标是什么？是成为新的掌权者，还是仅仅做一把用完即弃的“清君侧”之刀？控制电台、银行、新闻、陆军中枢……这些才是建立新秩序的关键，还是说，必须用更多重臣的鲜血，才能震慑住那些腐朽的官僚？\n车厢的颠簸愈发剧烈，仿佛行驶在崩溃的边缘……"
 KXXJAP.109.a:0 "一人一杀！今夜必须‘玉碎’，彻底扫清障碍"
 KXXJAP.109.b:0 "刀锋所指，是为中枢！集中力量夺取政权！"
 KXXJAP.110.t:0 "团琢磨之死"
 KXXJAP.110.d:0 "团琢磨宅邸的铁门在黑暗中只是个模糊的轮廓。断电带来的混乱呼喊声从远处街区隐隐传来。四个黑影紧贴着冰冷的石墙移动，动作带着底层人特有的、被生活磨出来的敏捷和一丝僵硬。他们是井上日召口中“出身干净”的“孩子们”，粗布工装下藏着南部式手枪的硬块。领头那个，指关节粗大，死死攥着块裹了布的砖头。\n“砰！”砖头砸在侧门玻璃上，碎裂声在死寂的宅院里格外刺耳。里面传来一声惊惶的喝问：“谁？！”\n没有回答。粗大的手伸进破洞，摸索着门栓。铁栓“哗啦”一声被拉开。黑影挤了进去，皮靴踩在门厅的碎玻璃上，“嘎吱”作响。黑暗中只有他们粗重的呼吸。\n“谁在那里？！”二楼传来团琢磨惊怒交加的声音，带着刚被惊醒的沙哑。脚步声在楼梯上响起。\n手电筒的光柱猛地亮起，惨白的光束像利剑劈开黑暗，瞬间钉住了楼梯上穿着丝绸睡衣的团琢磨。他一手抓着楼梯扶手，一手徒劳地想遮住刺眼的光线，脸上是彻底的错愕和恐惧，睡衣下摆狼狈地掀着。\n“为了昭和！”一声嘶哑的、带着浓重口音的喊叫打破了凝固。\n枪声急促地炸开。“砰！砰！砰！”枪口焰在黑暗中连续爆闪，刺鼻的火药味瞬间弥漫。子弹撕裂丝绸和皮肉。团琢磨身体猛地一震，像被无形的重锤连续击中。他喉咙里发出“嗬…”的短促气音，抓着扶手的手无力地松开，身体向前扑倒，顺着楼梯滚落下来，“咚、咚”几声闷响，最后瘫在门厅冰冷的大理石地板上，一动不动。鲜血从他身下迅速漫开，在微光下泛着粘稠的暗色。\n手电光柱颤抖着扫过那张失去生气的脸，然后熄灭。黑暗中只剩下浓重的血腥味和四个“孩子”急促得如同拉风箱般的喘息。他们甚至没看清彼此的脸，转身就向破碎的侧门冲去，皮靴再次踩过碎玻璃，身影消失在吞噬了东京的黑暗里。远处，城市的混乱噪音依旧在持续。"
 KXXJAP.110.a:0 "清除完毕。"
 KXXJAP.111.t:0 "高桥是清之死"
 KXXJAP.111.d:0 "高桥是清官邸。黑暗浓稠，只有远处混乱街区的火光在窗户上投下变幻不定、扭曲的暗红影子。宅邸内一片兵荒马乱，仆役惊恐的低语、家具被匆忙撞倒的闷响、女人压抑的抽泣交织在一起。安藤辉三大尉、中桥基明中尉带着几名端着刺刀的士兵，皮靴毫不留情地踏过精美的榻榻米，粗暴地撞开一扇又一扇纸门，手电光束在慌乱躲避的人影和精致的障子屏风上乱晃。\n“在那里！卧室！”\n纸门被“唰”地猛地拉开。手电光柱直射进去，像舞台追光。高桥是清穿着白色寝衣，蜷坐在被褥里，稀疏的白发在强光下几乎透明。他那张布满皱纹的脸因惊惧而扭曲，在刺眼的光线下显得格外惨白。一个可能是女儿或女仆的年轻女子尖叫着扑挡在他身前，被士兵粗暴地拽开胳膊甩到一旁，跌倒在墙角，发出痛苦的呜咽。\n“高桥是清！”安藤的声音冰冷，在混乱的抽泣和喘息中异常清晰。\n没有斥责，没有辩解。老人只是徒劳地向后缩着，干瘪的嘴唇哆嗦着，发出不成调的音节。手电光下，他眼中只剩下最纯粹的、面对死亡的恐惧。安藤的视线没有在老人脸上停留。他微微侧头，下颌的线条在光影中绷紧。\n“斩奸！”\n命令像冰块砸落。\n刺刀瞬间突刺。冰冷的、带着机油味的钢铁撕裂柔软脆弱的寝衣。不是一刀。是数把刺刀带着士兵执行命令的凶狠，几乎同时从不同角度刺入那衰老瘦小的身体。“噗嗤…噗嗤…”肉体被洞穿的闷响在狭窄的和室里显得格外清晰。高桥的身体像破麻袋一样被刺刀顶得向上弹了一下，又重重摔回被褥上。喉咙里挤出短促的“呃啊”声，随即被涌出的鲜血呛住。鲜血迅速在洁白的寝衣和被单上洇开大片刺目、粘稠的深红。\n手电光柱冷漠地停留在那具还在细微抽搐的躯体上几秒。浓烈的血腥味盖过了线香的淡雅。\n安藤辉三面无表情地收回目光，转向墙角蜷缩着、因极度恐惧而失声的女子，微微颔首，声音平板无波，甚至带着一丝诡异的平静：\n“失礼了。打扰了。”\n说完，他转身。士兵们“唰”地收刀，粘稠的血珠从刀尖滴落，在榻榻米上留下深色圆点。皮靴踏过精美的地板，发出沉闷的声响，迅速消失在走廊的黑暗中。只留下室内浓得化不开的血腥气、女子压抑到极点的绝望啜泣，以及窗外远处东京在无光之夜中混乱的哀鸣。"
 KXXJAP.111.a:0 "财政之碍已除。"
 KXXJAP.112.t:0 "神座的崩塌"
 KXXJAP.112.d:0 "皇宫，这座深藏在黑沉沉的东京中心、被层层松柏和宫墙拱卫的“神域”，也未能幸免于今夜疯狂的蔓延。外面的枪声、爆炸声如同沉闷的鼓点，不断敲击着宫苑的宁静。御书房内，空气凝滞得如同铅块。裕仁天皇的脸色异常苍白，镜片后的双眼不再望向那些摊开的、已经失去意义的紧急报告，而是死死地盯着紧闭的糊纸拉门。铃木侍从长侍立在一侧，身形僵硬如石雕，只有额角不断滚落的冷汗。他数次想开口劝陛下移驾，但看到裕仁那固执的侧影和紧抿的嘴唇，话到嘴边又咽了回去。几名近侍伏跪在门外阴影里，每一次声响都让他们几乎要惊跳起来。\n突然！一阵极其刺耳、极其接近的枪声在皇宫外苑方向炸响！紧接着是粗野的咆哮和怒吼：\n“清君侧！诛国贼！”\n“万世一系！天诛！”\n“破门！”\n同时，守卫皇宫的近卫兵急促、惊慌的呼喝声和零星抵抗的枪声也响了起来，混杂在一起.“陛下！”侍从长再也无法保持镇定，声音带着哭腔和前所未有的惊惶，猛地扑到御案旁，“有暴徒闯入，请陛下速避！”他几乎是本能地，用自己并不高大的身躯试图挡在裕仁和拉门之间。裕仁的身体剧烈地一震，猛地从御座上站起，脸色瞬间由苍白转为死灰。他们想干什么？他们敢……？！一种超越恐惧的巨大荒谬感和冰冷的愤怒瞬间攫住了他。\n“砰！！！”\n一声震耳欲聋的巨响！不是枪声，而是沉重的、撞击宫苑深处某处门户的声音！\n“保护陛下！”侍从长嘶声力竭地喊道，声音变了调。门外伏跪的近侍中有人崩溃地哭出了声。就在这千钧一发之际，一个身影如同猎豹般从侧门冲入——是负责今晚宫内警戒的警卫长。他军装凌乱，脸上沾着血污和硝烟，手中紧握的手枪枪口还在冒着青烟。\n“陛下！暴徒突入内苑！正向御书房方向！”少佐的声音急促而嘶哑，“请陛下立刻随我撤离！”他一边说，一边用身体挡在裕仁和正门之间，手枪警惕地指向门口，同时急促地给另一名刚刚冲入、气喘吁吁、端着步枪的士兵打手势，让他守住侧翼。\n正门方向，木头的碎裂声、疯狂的吼叫声和守卫的怒吼声已经交织成一片，那扇象征着神国至圣的、糊着御纹的拉门，在微弱的光线下剧烈地震动起来.\n裕仁看了一眼在枪口下瑟瑟发抖的近侍，看了一眼用身体做盾牌的铃木，最后目光死死锁定了那扇在撞击下呻吟的拉门。时间仿佛凝固，每一秒都被拉得无比漫长。生与死，就在这冲出御书房的几步之间……"
 KXXJAP.112.a:0 "“走！”裕仁眼神中爆发出一种近乎疯狂的求生欲，扑向通往侧廊的门户。"
 KXXJAP.112.b:0 "“朕……是神国天子！尔等……敢弑君？！”"
 KXXJAP.113.t:0 "铁幕垂落"
 KXXJAP.113.d:0 "东京的混乱如同瘟疫般蔓延。枪声在城市各处爆豆般响起，火光在断电的夜幕下格外刺眼。帝国的心脏，正在被一把名为“昭和维新”的冰冷手术刀粗暴地切割解剖，鲜血淋漓。最初的震惊与观望，此刻已被席卷而来的失控感和冰冷的恐惧所取代。陆军省地下深处，一间被厚重防爆门隔绝的作战室内，空气浑浊得几乎要滴出铅水。唯一的光源是头顶几盏惨白的防爆灯，将巨大的东京市区沙盘和悬挂的作战地图映照得如同停尸房的解剖台。浓烈的烟草味混杂着汗味和一种更深的、铁锈般的焦虑气息，几乎令人窒息。\n陆军大臣川岛义之瘫坐在巨大的扶手椅里，仿佛一夜之间老了十岁。他那张平日里惯于摆出威严或圆滑表情的脸，此刻只剩下灰败的疲惫和一种近乎崩溃的茫然。握在手中的那份刚刚由浑身湿透的通讯兵拼死送来的、字迹潦草染血的皇宫遇袭初步报告，在他指间不住地颤抖。报告上没有明确天皇的生死，只写着“暴徒突入内苑，交火激烈，陛下行踪未明”。“怎么会这样…怎么会到这一步…”他喃喃自语，往日那种试图在青年军官与元老重臣间左右逢源的“骑墙”姿态，已被眼前这足以倾覆国体的滔天巨浪彻底冲垮。他猛地抬起头，眼中布满血丝，声音嘶哑却带着前所未有的狠厉：“必须…必须立刻镇压！动用一切力量！把那些狂徒…给我碾碎！”\n参谋本部作战课长石原莞尔大佐，依旧穿着那身笔挺到没有一丝褶皱的军服，像一尊冰冷的雕像伫立在沙盘前。他没有说话，但手指快速在地图上几个关键节点轻轻敲击。他心中清楚，无论天皇生死，事态都已滑向“下克上”的终极深渊，必须用最彻底的军事手段将其斩断。他侧头看了一眼身旁的永田铁山少将，这位统制派的核心巨擘，紧抿的嘴唇透着一股暴风雨前的死寂。他最终只是从紧咬的牙关中挤出一句：“耻辱…这是帝国陆军最大的耻辱！”\n“川岛阁下说得对！”一个如同炸雷般的声音响起。寺内寿一大将，这位以铁腕和傲慢著称的“贵族将军”，挺着胸膛，像一头被激怒的雄狮。“那些不知天高地厚的小崽子，还有那些混在里面的肮脏浪人，他们以为他们在做什么？这是叛乱！是对陛下和国体的亵渎！”\n坐在角落阴影里的宇垣一成大将和林铣十郎大将，此刻也收起了往日的城府与算计。宇垣眉头紧锁，手指无意识地敲击着椅子扶手。林铣十郎则显得更为焦躁，他几次想开口，却又咽了回去。宇垣最终缓缓点头，声音低沉：“事已至此…当以雷霆手段，扑灭叛乱，安定圣虑。”林的表态更为直接：“动手吧！不能再等了！”\n川岛义之看着这群平日里勾心斗角、此刻却因共同恐惧和利益而暂时达成一致的帝国军界巨头，心中最后一丝侥幸也彻底熄灭。他猛地站起身，因为动作过猛而晃了一下，被旁边的副官扶住。他甩开副官的手，用尽全身力气吼道：\n“诸君！国难当头，国体悬于一线！我，以陆军大臣名义下令！”\n“近卫师团、第1师团紧急抽调之部队，立刻行动！对盘踞于陆军省、参谋本部、警视厅、电台、首相官邸及其他重要据点之叛军——执行‘镇压作战’！授权使用一切必要武力！”\n“目标：彻底粉碎叛乱！恢复帝都秩序！拯救陛下！”\n命令以最高优先级通过尚在控制中的备用线路和拼死突围的传令兵，向四面八方发出。东京的夜，在燃烧与混乱之上，一道由坦克履带、火炮与刺刀组成的冰冷铁幕，正沉重地落下。镇压的机器，终于开动了。"
 KXXJAP.113.a:0 "当野兽挣脱了锁链开始撕咬主人，唯一能终结混乱的，只有更强大、更无情的铁拳。"
 KXXJAP.114.t:0 "深海之礁"
 KXXJAP.114.d:0 "当陆军省地下的镇压指令如同沉闷的雷暴开始滚动时，东京的另一端，靠近海湾的伏见宫博恭王官邸，却笼罩在一种截然不同、却同样沉重的气氛中。\n海军军令部长伏见宫博恭王，这位天皇的叔祖、海军最高统帅，罕见地身着全套海军大将礼服，端坐在主位。他苍老但锐利的鹰目扫过围坐在巨大海图桌旁的将领们，脸上没有任何表情。桌面上，并非通常的海上作战计划，而是摊开着一份同样潦草、标注着陆军叛军控制区和海军重要设施位置的东京市区地图。\n海军大臣加藤宽治大将，这位以强硬立场闻名的老将，此刻正焦躁地踱步。他的声音因为愤怒而嘶哑：“陆军！那群马粪！他们连自己的窝都看不住！参谋本部被占？陆军省被围？连皇宫……”他猛地顿住，强行压下了后面更不敬的话，“现在东京湾的入口、横须贺的司令部都在我们手里，但这又有什么用？难道要海军上岸去清理陆军的烂摊子吗？！”他毫不掩饰对陆军的鄙夷和对其无能导致混乱的狂怒。\n军令部次长末次信正中将，站在加藤旁边，脸色同样阴沉如铁：“殿下！加藤阁下！这是帝国存亡的时刻！陆军既已失控，海军必须肩负起拱卫国体的重任！若陆军镇压不利，海军不能坐视帝都完全沦陷于叛军之手！”\n“荒谬！”一个清冷的声音响起。海军省军务局长米内光政中将，这位被视为相对理性的将领，紧皱着眉头，毫不客气地打断了末次。“末次君！你想让海军也卷入陆上的自相残杀吗？我们连叛军的真正规模、诉求、甚至背后是否有更深的背景都不完全清楚！贸然让水兵上岸，只会让局面更加复杂化，甚至引发更大规模的内乱！” 他转向伏见宫，语气恳切而慎重：“殿下！当务之急是确保海军自身稳定，保护横须贺、吴、佐世保等军港及舰队安全，同时……严密关注陛下及皇室的安危讯息。这才是海军应尽之忠节！”\n坐在米内侧旁的井上成美少将接话：“米内阁下所言极是。陆军混乱是其内部积弊爆发，海军强行介入，名不正言不顺，极易授人以柄。但末次阁下的担忧也非无的放矢——若叛军彻底控制中枢，甚至……威胁到皇室存续，海军绝不能坐以待毙。我认为，应以‘保护海军设施及沿海要地、防止混乱蔓延’为名，令陆战队及警备部队进入戒备，但不主动上岸介入市区。”\n伏见宫博恭王沉默片刻，目光在众将领间扫过，最终缓缓点头。"
 KXXJAP.114.a:0 "旁边的动静是什么？"
 KXXJAP.115.t:0 "皇兄弟们"
 KXXJAP.115.d:0 "他们的争论，每一句都敲打在官邸深处一间被严密守护的密室外。这里，临时庇护着两位极其重要的人物——高松宫宣仁亲王及其亲信细川护贞。宣仁亲王眉头紧锁，手中紧握着一支手枪，年轻的脸上混杂着惊惧、愤怒和一丝不易察觉的沉重责任。细川护贞则脸色苍白，但强自镇定，耳朵紧贴着门板，竭力捕捉着外面将领们争论的关键词。关于皇兄和皇嫂的安危，没有任何确切消息。更可怕的是，皇兄的子女——年幼的明仁皇太子，以及照宫成子内亲王和久宫祐子内亲王——同样下落不明，生死未卜！这种未知的煎熬，让密室的空气几乎凝固。\n“护贞，”宣仁亲王的声音低沉而沙哑，带着一丝颤抖，“皇侄女她们……还有秩父宫兄长……”\n细川护贞立刻明白了他的意思。在这种天崩地裂的时刻，确保皇位继承序列的延续性至关重要。他重重点头：“殿下，我立刻去尝试！宫内省线路恐怕已断，我们试试海军自己的秘密通讯渠道！”他迅速离开密室，找到一名神色紧张、但绝对忠诚的海军通讯军官。\n几分钟后，在官邸深处一个临时架设的、由海军密码保护的通讯点，细川护贞亲自拿起话筒，手指因为紧张而微微发抖。他拨通了通往遥远的青森县，青森县官邸的专线号码。漫长的等待音如同死亡的倒计时……\n“莫西莫西！这里是青森县官邸！”一个熟悉而带着惊惶的侍从声音传来。\n“我是宫内省侍从细川护贞！立刻请秩父宫殿下听电话！最高紧急事态！重复，最高紧急事态！”细川几乎是吼出来的。\n电话那头传来一阵混乱的脚步声和压抑的惊呼……接着，一个带着喘息、明显极度震惊和困惑的年轻男性的声音响起：\n“……我是雍仁。东京……到底发生了什么？！”\n细川护贞深吸一口气，正准备开口汇报这末日般的局面，告知皇宫遇袭、天皇行踪不明、子嗣失踪、帝都陷入血火的消息……\n就在这时——“砰！”一声巨响从官邸外庭方向传来！紧接着是海军陆战队卫兵警告性的鸣枪示警和骚动声！有不明身份的武装人员试图冲击伏见宫官邸！\n细川护贞的心猛地一沉，对着话筒急促喊道：“殿下！东京叛乱！陛下安危不明！海军正在伏见宫殿下官邸！您务必留在青森，绝对不要……”话音未落，电话线路在刺耳的噪音中戛然而断！通讯中断了！细川护贞握着冰冷的听筒，脸色惨白。\n雍仁亲王只听到了半截消息，形势比预想的更加险恶，他猛地冲出房间，立即让人安排他去找火车……"
 KXXJAP.115.a:0 "其他地方也将被东京的火燃烧……"
 KXXJAP.116.t:0 "最后的元老，宪政之烛"
 KXXJAP.116.d:0 "麻布区，远离皇宫和陆军中枢的喧嚣，西园寺公望公爵那栋带着浓厚西洋风格的宅邸，此刻正被一种不祥的寂静所包围。前庭的铁艺大门被粗暴地撞开，歪斜地挂着。几名荷枪实弹、臂缠“尊皇讨奸”白布的年轻军官，正带着混杂着亢奋、紧张和某种莫名畏缩的神情，包围着宅邸主建筑。他们踹开了玄关的门，但并未立刻冲入。\n宅邸内，在装饰着油画和西式壁炉的书房里，西园寺公望，这位明治维新元老、最后的元老、帝国宪政的象征，正端坐在一张宽大的扶手椅中。他身着考究的和服便装，白发梳理得一丝不苟，布满岁月沟壑的脸上没有任何恐惧。在他身后几步远，几名忠心耿耿的老仆和原田秘书脸色煞白，身体因恐惧而微微颤抖，却强撑着没有后退。\n“奉昭和维新大义！请西园寺公爵阁下出来说话！”一个年轻却刻意拔高、显得虚张声势的声音在门外吼道。老仆看向西园寺，眼中充满哀求，似乎在劝主人不要理会。西园寺只是微微抬了抬眼皮，用苍老但清晰平稳的声音说道：“不必阻拦。请他们进来吧。”他的语气，如同吩咐接待寻常访客。\n五、六名身着昭和五式军服、臂缠“尊皇讨奸”白布的陆军军官，手持上了刺刀的步枪或军刀，带着一身寒气与杀气涌了进来。为首一人是个年约三十的少佐，脸色因激动和寒冷而涨红，眼神狂乱地扫视着昏暗的玄关，最终死死钉在廊下那个端坐的苍老身影上。他身后的几名尉官和军曹则显得更加紧张不安，握着武器的手指关节发白，目光在西园寺和他们的长官之间游移。\n“西…西园寺公爵阁下！”为首的少佐深吸一口气，努力让自己的声音显得有威慑力，他向前踏了一步“帝都现已由我等志士接管！为清君侧，诛国贼，行维新大义！阁下身为元老，当顺应天意民心！请阁下立即发表声明，支持我等义举！”他的话语直白而充满逼迫，但却不敢过于放肆，目光甚至不敢长久直视西园寺平静的脸。\n西园寺公望缓缓抬起头，平静无波地注视着眼前这群持械闯入的年轻人。他沉默了几秒，这短暂的寂静在紧张的空气中如同永恒。他开口了，声音不大，却清晰地穿透了风的低吟：“尔等所谓‘维新’……”他顿了顿，“便是以刀枪威逼一垂死老朽乎？”\n“八嘎！”一声羞怒的暴喝从一名军曹口中迸出！他被老元老那毫不留情的斥责和凛然气势激得气血上涌，失去理智，猛地举起了手中的步枪，刺刀在昏暗光线下闪烁出寒芒！“老东西！你竟敢侮辱维新大义！”他作势就要冲上前！\n“住手！山田！”为首的少佐厉声喝止，但声音同样带着被彻底戳破伪装的狼狈与愤怒。他死死盯着西园寺，眼中最后一丝犹豫被一种被羞辱后的疯狂取代。他猛地拔出腰间的军刀，刀鞘“哐当”一声掉落在榻榻米上！刀尖直指廊下的西园寺，声音因极度的情绪而扭曲：“公爵阁下！请收回方才之言！立即发表支持声明！否则……否则休怪我等无礼！为维新大义，一切牺牲皆在情理之中！”\n冰冷的刀锋距离西园寺不过数步之遥。老仆和秘书发出惊恐的低呼，几乎要扑上来以身相护。西园寺却纹丝不动，甚至连眉头都没皱一下。他只是缓缓整理了一下自己的羽织前襟，然后，再次抬起了那双看透世事的眼睛，平静地迎向那疯狂颤抖的刀尖。"
 KXXJAP.116.a:0 "少佐犹豫了下，开枪射向西园寺的左肩，留下一句“失礼了！”随后带着其他人离去"
 KXXJAP.116.b:0 "“我们……走。”为首的军官嘶哑地吐出三个字，其他军官如蒙大赦，仓促退出"
 KXXJAP.117.t:0 "永田町核心突击"
 KXXJAP.117.d:0 "第1师团步兵第57联队在第2战车联队数辆八九式中战车的支援下，沿着永田町通向首相官邸和国会议事堂发起强攻。叛军依托官邸围墙、国会大厦的石柱和邻近建筑，架设机枪，进行顽强但缺乏组织的抵抗。坦克的炮火轻易撕碎了沙袋掩体和部分门窗，步兵在钢铁掩护下发起刺刀冲锋。叛军的“尊皇”狂热在钢铁洪流面前迅速瓦解，防线出现多处缺口。05:17，首相官邸主要建筑上升起镇压部队的旗帜。叛军残部退守国会大厦地下室及周边小范围区域，但被完全孤立。"
 KXXJAP.117.a:0 "在绝对火力优势和心理震慑下，残余叛军精神崩溃，打出白旗投降。"
 KXXJAP.117.b:0 "叛军发动了数次自杀式反冲击，国会大厦未能即时拿下。"
 KXXJAP.118.t:0 "三宅坂要塞争夺"
 KXXJAP.118.d:0 "近卫师团主力在师团长亲自督战下，主攻叛军心脏——被占领的陆军省和参谋本部大楼。这里是叛军指挥中枢和精神象征，抵抗最为狂热。叛军利用钢筋混凝土建筑、地下通道和预先储存的武器弹药，构成了交叉火力密布的死亡陷阱。镇压部队虽人数火力占优，但进展缓慢，每层楼、每个走廊都爆发血腥的白刃战和手榴弹互掷。大楼内浓烟滚滚，枪声爆炸声震耳欲聋。叛军喊叫着“天诛！七生报国！”发起一波波玉碎冲锋。"
 KXXJAP.118.a:0 "石原莞尔利用炮兵强攻，最终夺回了核心区"
 KXXJAP.118.b:0 "高层顾忌对中枢建筑的严重破坏及可能存在的重要人物被挟持，导致进攻无效"
 KXXJAP.120.t:0 "昭和维新的血阳"
 KXXJAP.120.d:0 "东京的黎明并非由霞光唤醒，而是被硝烟、血腥与一种扭曲的狂热浸透。首相官邸废墟之上，一面沾满泥污与暗红痕迹的巨大太阳旗被十几双激动颤抖的手奋力升起，在弥漫着焦糊味的晨风中猎猎作响。旗下，昨夜还被视为叛军的青年军官们——野中四郎、安藤辉三、香田清贞——此刻眼中燃烧着疲惫却亢奋至极的光芒，他们布满硝烟污渍的军服上缠着的“尊皇讨奸”白布，成了胜利者的勋章。在他们周围，是同样狂热的大日本生产党浪人、爱乡塾壮汉，以及少数面孔陌生却充满草莽戾气的武装分子。枪炮声并未完全平息，零星的抵抗仍在城市某些角落响起，但大局已定。\n广播里，不再是昨夜混乱的宣言，而是一个被刻意拔高、带着金属铿锵声的男音，通过被彻底控制的NHK电台向整个帝国播报：\n“全日本国民！黎明已至！昭和维新的圣战，在忠勇义士的奋起下，已涤荡帝都污秽！蒙尘之国体重光！奸佞朽木已被天诛！一切旧秩序、旧制度，凡阻碍天皇陛下亲政、妨害帝国八纮一宇之大业者，皆在此刻宣告终结！奉天皇陛下圣意，即日起成立‘维新政府’！军队即刻起统一接受义军指挥，忠于天皇者，皆为同志！违逆者，皆为国贼！”\n广播宣读了新政府的核心名单：以真崎甚三郎为名义首脑，实权则由参与事件的激进少壮军官与民间右翼领袖共同把持。陆军省大楼成为了这个新生畸形政权的临时心脏，参谋本部则变成了清洗指令的传达中心。\n东京街头，不再是昨夜的无人空巷。被广播和激进分子强行驱赶出来的市民，瑟缩地站在路旁，脸上混杂着麻木、惊恐与难以置信。身穿各式非正规制服的武装人员趾高气扬地巡逻，墙上刷满了墨迹未干的标语：“昭和维新！天诛国贼！尊皇攘夷！皇宫方向一片死寂。高耸的宫墙外，布满了打着“保护天皇”旗号的新政府部队宫内省人员被严密控制，断绝一切未经许可的对外通讯。"
 KXXJAP.120.a:0 "关西发生了什么？"
 KXXJAP.120.b:0 "狗要吃肉了。"
 KXXJAP.121.t:0 "山河燃烧，革命已至！"
 KXXJAP.121.d:0 "东京的“维新”狂热在第七十二小时被钢铁碾碎。寺内寿一冰冷的声音通过被强占的电台刺穿寒流：“全日本国民。盘踞东京之‘维新政府’，叛国逆贼！纵兵屠戮，胁迫宫廷！天皇震怒，敕命讨逆！” “本官奉旨率师，光复帝都！真崎甚三郎、野中四郎、安藤辉三、香田清贞等，业已伏法！即日起，全国戒严，乱序者，格杀勿论！”电流“滋啦”切断广播。东京街头，狂热标语被“肃清国贼”、“绝对服从”的墨迹覆盖。卡车满载尸体驶向焚场，宪兵黑车掠过首相官邸废墟前。\n寺内寿一踩着碎砖与干结的血迹，在同样面无表情的梅津美治郎、东条英机等军官簇拥下步入指挥帐篷,简报声冰冷简洁。他目光扫过布满弹痕的东京地图，红铅笔在叛首据点重重打叉。笔尖最终悬停在北方边缘。副官无声递上加密电报。寺内眼角扫过——“北海道上川郡佃农村落暴动…武装农民共斗队…打赤旗…袭役所、地主宅…疑日本共产党武装干部指挥…蔓延美瑛、富良野…暴徒宣称：‘趁军队狗咬狗，解放北国农民！’…多处火光…事态恶化…” 他眉头一瞬微蹙，旋即铁板般漠然。笔杆末端轻点，电报被收起。帐篷外，工兵铲清理瓦砾的撞击声单调回响，空气沉重如铅。帝国的心脏在铁腕下被强行缝合，皇道派的血渗入冻土，新的、更冰冷的锁链在瓦砾上锻造成型。窒息的铁幕垂落于劫后帝都。\n而在那最北端、被遗忘的荒原，真正的裂痕已然撕开……"
 KXXJAP.121.a:0 "立即派兵镇压！"
 KXXJAP.122.t:0 "皇道大本，神圣昭和"
 KXXJAP.122.d:0 "遥远的近畿。京都，古都的宁静被彻底撕裂。大本教的信徒，在少数被策反的宪兵队支持下，高举着绘有诡异灵界图案的旗帜，如潮水般涌向府厅与寺庙。教主出口王仁三郎并未亲自现身，但其代理人站在象征皇家威望的二条城前，宣称获得了“神启”，京都将成为“神都维新”的起点。大阪，黑龙会的干将们则更加赤裸。他们与驻留大阪的部分第六师团官兵联手，以迅雷不及掩耳之势控制了市政府、警察署与关键码头。浪人刀客与军人的刺刀组成了新的街头风景，宣称要将这座商都打造为“向大陆进军的坚实堡垒”。关西的陷落几乎毫无悬念，古老的权力网络在军队默许或参与下迅速倒戈。\n广播声在东京、京都、大阪的街道上回荡，掩盖了角落里低低的哭泣声和垂死者最后的呻吟。一轮血红色的朝阳，正奋力穿透厚重的烟云，将整个日本列岛涂抹在一片病态的殷红之中。这不是黎明，这是血色黄昏的序幕。"
 KXXJAP.122.a:0 "我相信不久后就会发生第二次内斗……"
 KXXJAP.124.t:0 "残阳下的御前会议"
 KXXJAP.124.d:0 "东京的硝烟还未完全消散，但枪炮声已彻底停歇。肃清行动接近尾声，宪兵队和近卫师团的士兵正在废墟和街道上清理最后的抵抗痕迹——更多的，是搬运堆积如山的尸体。空气中除了硝烟和血腥，还弥漫着浓烈的汽油味和皮肉焦糊的气味——几处焚尸点冒着不祥的黑烟。城市笼罩在一片死寂的哀伤和劫后余生的麻木中。皇宫的宫墙外，警戒线比以往森严十倍，士兵们枪上刺刀，目光警惕中带着一丝惊魂未定。\n在皇宫深处，御文库一间被严密守卫的房间里，一场气氛极其凝重的御前会议正在举行。窗户紧闭，厚重的窗帘阻挡了午后本该明亮的阳光，只有几盏电灯发出惨白的光。空气中漂浮着淡淡的消毒水味和……草药味。\n令人揪心的是西园寺公望公爵。这位帝国最后一位元老，被紧急从担架上抬入会场。他躺在特制的躺椅上，身上盖着薄毯，胸口缠着厚厚的绷带。围绕着他们的，是劫后余生的重臣一木喜德郎、木户幸一、本庄繁、川岛义之等等。昨夜的血腥风暴，在这狭小的空间内投下浓重得化不开的阴影。会议议题只有一个：如何收拾这史无前例的烂摊子，避免帝国彻底崩溃。在川岛义之结结巴巴地汇报完“叛乱基本肃清，首要分子野中四郎、安藤辉三等已确认自决或被击毙”后，是一阵令人窒息的沉默。最终，打破这死寂的，是西园寺公望虚弱却异常清晰的声音：“陛下…诸君…”他艰难地喘息了几下，目光扫过在场众人，最终停留在裕仁那苍白的脸上。“昨夜之祸，已非寻常政治失序…死伤枕藉，中枢几毁，民心惶惶，列强侧目…值此存亡绝续之际，老朽以为…当务之急…是成立超越一切派阀、超越陆海军之争的‘举国一致内阁’。”\n“宇垣一成…林铣十郎…平沼骐一郎…池田成彬…”西园寺艰难地吐出几个名字，每一个都代表着一股强大的势力或一种政治光谱。“…乃至伏见宫殿下、高松宫殿下之威望…或可…堪当大任…”\n裕仁沉默良久，疲惫的目光在众人身上移动，这意味着“大命降下”。他似乎想说什么，最终只是极其轻微地点了点头，声音沙哑地说：“西园寺卿…老成谋国…所言…极是。”他停顿了一下，仿佛在积聚力量。“举国一致…共赴国难…准卿所奏。具体人选…西园寺卿…卿与木户…尽快拟定…朕…裁可。”"
 KXXJAP.124.a:0 "政党的时代最终还是结束了……"
 KXXJAP.125.t:0 "裂痕下的秩序"
 KXXJAP.125.d:0 "东京的枪炮声早已停息，取而代之的是宪兵、消防队和清洁夫忙碌的声响。血腥味被大量泼洒的消毒水气味盖过，但仍顽固地从废墟缝隙和排水沟里丝丝缕缕地钻出来。主要街道被清理，但断壁残垣和焦黑的痕迹随处可见，无声诉说着昨夜的疯狂。皇宫外的军队岗哨依然森严，但氛围已从昨夜的极度紧张，转为一种疲惫而警惕的常态——仿佛一头受伤的巨兽在舔舐伤口。\n枢密院议长官邸内，平沼骐一郎正对着电话连声道“好、好、好”，紧锁了两天的眉头终于舒展开来。他刚刚确认了两个至关重要的消息：天皇陛下安然无恙，只是受了惊吓，正在皇宫静养；他的老友、政友会重要人物铃木喜三郎，虽然其宅邸昨夜被叛军冲击，但本人幸运地及时转移，毫发无伤。平沼放下电话，长吁一口气，喃喃道：“不幸中之万幸…国体尚存。”但随即，他眼中又布满阴霾，望向窗外依然硝烟隐约的帝都，他知道，真正的麻烦才刚刚开始。\n傍晚，皇宫内灯火通明。在御文库旁边一间特意整理过的会议室内，一场决定帝国未来走向的核心会议正在召开。不同于清晨的混乱和午后的压抑，这里的气氛充斥着一种劫后余生的凝重，以及一种……等待雷霆的紧张。长桌主位坐着天皇裕仁，他脸色略显苍白，但眼神已恢复往日的锐利与冰冷，只是那冰冷之下，压抑着昨夜积蓄至今的滔天怒火。他身侧坐着西园寺公望公爵，这位老元老虽难掩疲惫，腰背却挺得笔直，眼神中的忧患比愤怒更深沉，他面前的桌上放着一杯早已凉透的茶。与会者阵容空前，所有劫后余生的重臣、军部首脑、财界代表、以及作为华族领袖受邀的近卫文麿公爵和德川家达公爵都来到宫内，等待着陛下此番的决断。\n裕仁没有过多寒暄，直接开宗明义，他的声音不高，却像冰锥般刺入每个人的耳膜：“昨夜之事，乃帝国有史以来最大之污点！朕之居所险遭冲击，股肱重臣几被屠戮！陆军！”他的目光如刀锋般直射向川岛义之和寺内寿一。“尔等平日所言之忠君爱国何在？对部下约束何在？统御之能何在？！酿此滔天大祸，使帝国蒙羞，令朕痛心疾首！陆军，必须彻查！必须担责！”\n裕仁罕见的直接训斥，让陆军将领们如坐针毡，川岛义之几乎将头埋到桌面，寺内寿一紧握拳头，指节发白。伏见宫博恭王微微闭了下眼，海军将领们则保持着刻意的沉默。"
 KXXJAP.125.a:0 "下面，西园寺公望发话了。"
 KXXJAP.126.t:0 "裂痕下的秩序"
 KXXJAP.126.d:0 "西园寺待裕仁话音落下，缓缓开口，声音平静却带着不容置疑的份量：“陛下圣明。昨夜之祸，根源在于体制崩坏。老朽以为，当务之急有二：其一，现任内阁必须总辞职。其二，军队，尤其是陆军，必须进行彻底整肃与改革。严明军纪，重塑绝对忠于天皇陛下之铁军！宇垣大将，或是担此重任的首选。”木户幸一立刻发言，他显然有自己的想法：“西园寺公所言极是，整肃军队、恢复秩序为第一要务。然值此非常时期，人心惶惶，政坛凋零，仓促组建政党内阁，恐力有不逮，反生掣肘。”他转向裕仁和西园寺，语气恭敬但坚定：“臣斗胆进言，近卫文麿公爵殿下，德高望重，深孚众望，既能为各方所接受，更能凝聚人心，或为过渡时期稳定大局之最佳人选。此乃权宜之计，为恢复宪政常道铺路。”近卫文麿微微低头，神色谦恭中带着一丝深不可测的沉思，并未立刻表态。德川家达则保持着一贯的贵族式沉默。西园寺眉头微蹙，立刻反驳：“木户君之言虽有道理，然宪政之根本在于责任内阁。纵有千难万险，亦不可轻言放弃。政党或有良莠，但唯有通过政党，民意方能有序上达。即使让党内反主流派上台，亦强于回归超然内阁。”他语气坚决。“若因一时之乱而废宪政常道，则国本动摇，祸患更深。”\n裕仁冷眼旁观着这场争论。他最终缓缓开口，声音表现出少有的威严：“西园寺卿、木户卿皆为国谋虑。内阁总辞，势在必行。军队整肃，刻不容缓！宇垣卿…必须出山！责无旁贷！”\n“至于内阁…”裕仁的目光在近卫文麿和西园寺之间停留片刻。“当务之急是稳定大局，凝聚力量。西园寺卿、木户卿、平沼卿，尔等速速会商，不拘一格，提出最适任首相及阁僚人选，报朕裁断。人选，须以能力与担当为重。”裕仁巧妙回避了直接支持木户还是西园寺，将皮球踢回给重臣们协商，但“不拘一格”也暗示并非必须政党内阁。"
 KXXJAP.126.a:0 "宪政或许还能持续一段时间。"
 KXXJAP.127.t:0 "总选举"
 KXXJAP.127.d:0 "东京在血腥事件后，如同一个被开膛破肚的巨人，艰难喘息着。首相官邸的焦痕未干，陆军省墙壁上的弹孔尚新，空气中弥漫着消毒水也掩盖不住的死亡与铁锈气息。裕仁天皇终于颁布敕令：解散因刺杀事件而残缺不全、陷入瘫痪的第62届帝国议会，命各政党整肃重组，筹备举行新一届大选。敕令如同一块巨石投入尚未平静的浑水。残存的政友会内部首先撕裂，犬养毅的死将分裂扩大化，反总裁派在久原房之助团结下反对铃木喜三郎出任下任总裁，认为是铃木与森恪造成了现在的烂摊子。民政党则因失去井上，之前已经辞去总裁的若槻礼次郎紧急将大任转交给自己的亲信町田忠治，然而，手下党人派们不满的呼声再起，想要迎回被开除出党的安达谦藏。国民同盟那边，中野正刚已经与安达决裂，把他的国家社会主义团体转化为新政党“东方会”，汇聚了一批激进政党政治革新者参与大选。社会大众党，因为安部矶雄遇袭受伤，转而由片山哲代理主席。但麻生久书记似乎想要同下中、赤松结成国家社会主义新党，与社民系决裂。实业家武藤山治重建了国民同志会政党，尾崎行雄也加入其中，意欲再次护宪。在经过层层选举后，最后的赢家是？"
 KXXJAP.127.a:0 "政友会捍卫了多数"
 KXXJAP.127.b:0 "民政党东山再起了"
 KXXJAP.127.c:0 "国民同盟成为黑马"
 KXXJAP.127.e:0 "社会大众党抓住机会"
 KXXJAP.127.f:0 "东方会团结了各路革新派政客"
 KXXJAP.127.g:0 "国家社会主义者结成了革新党"
 KXXJAP.127.h:0 "国民同志会爆冷当选"
 KXXJAP.128.t:0 "决定政友会总裁"
 KXXJAP.128.d:0 "政友会赢得了选举，多数党总裁担任首相，我们要尽快解决派系问题。"
 KXXJAP.128.a:0 "久原房之助（反主流派）"
 KXXJAP.128.b:0 "铃木喜三郎（主流派）"
 KXXJAP.128.c:0 "森恪（主流派）"
 KXXJAP.128.f:0 "前田米藏（反主流派）"
 KXXJAP.129.t:0 "决定民政党总裁"
 KXXJAP.129.d:0 "民政党赢得了选举，多数党总裁担任首相，我们要尽快解决派系问题。"
 KXXJAP.129.a:0 "町田忠治"
 KXXJAP.129.b:0 "永井柳太郎"
 KXXJAP.130.t:0 "决定国民同盟总裁"
 KXXJAP.130.d:0 "国民同盟赢得了选举，多数党总裁担任首相，我们要推举一名符合我们利益的人。"
