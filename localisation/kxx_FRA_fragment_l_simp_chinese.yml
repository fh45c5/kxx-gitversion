 FRB_Defend_our_independence: "保卫我们的独立"
 FRB_Defend_our_independence_desc: "法兰西共和国的秩序已在烈火中化为灰烬，但我们的民族绝不随之殉葬。独立的代价是永恒的警惕，而现在，这份警惕必须由刺刀来支撑。"
 FRB_Organize_combat_teams: "组织战斗队"
 FRB_Organize_combat_teams_desc: "旧的师团编制在崩溃中瓦解了。目前最紧迫的任务是将溃兵与爱国者重新整编为灵活的小型战斗单元，确保在任何街区、任何村镇都能组织起有效的抵抗。"
 FRB_Regularize_the_army: "正规化军队"
 FRB_Regularize_the_army_desc: "靠游击和热血无法赢得长久的生存。我们要恢复严明的军法，建立标准化的职级体系，将散沙般的武装转化为一支真正的国家军队。"
 FRB_Establish_a_war_department: "设立战争部"
 FRB_Establish_a_war_department_desc: "战争不仅发生在战壕，也发生在办公室里。我们需要一个统一的指挥枢纽来协调后勤、征兵与战略，将行政效率转化为前线的战斗力。"
 FRB_National_defense_bill: "国防法案"
 FRB_National_defense_bill_desc: "通过法律形式确立国防支出的优先地位。即使这意味着要勒紧裤腰带，我们也必须确保每一枚法郎都能化为保护民族安全的弹药。"
 FRB_Shield_of_national_independence: "民族独立之盾"
 FRB_Shield_of_national_independence_desc: "这支军队不再为巴黎的野心服务，它是我们的土地、我们的尊严以及我们独立地位最坚实的盾牌。"
 FRB_Reform_the_military_conscription_system: "改革兵役制度"
 FRB_Reform_the_military_conscription_system_desc: "旧的征兵档案已经残缺不全。我们要建立适合本国国情的普选制兵役，确保每一个适龄的民族子弟都能在必要时挺身而出。"
 FRB_Strengthen_combat_training: "强化战斗培育"
 FRB_Strengthen_combat_training_desc: "新兵不能只是会开枪的平民。我们将建立军事学院和训练营，将实战经验编入教材，确保我们的战士在素质上优于那些残存的旧法兰西残渣。"
 FRB_Strengthen_mobilization_mechanisms: "强化动员机制"
 FRB_Strengthen_mobilization_mechanisms_desc: "当在国家进入战争状态时，必须在24小时内进入临战状态。我们要优化交通网络与预备役登记。这需要我们强化动员体制，让整个国家成为一台能够瞬间爆发的战争机器。"
 FRB_Inculcate_nationalism: "民族主义灌输"
 FRB_Inculcate_nationalism_desc: "士兵知道“为何而战”比“如何作战”更重要。我们要通过宣传与政治教育，让每一个战士都深信：除了独立，我们已别无退路。"
 FRB_Peoples_army: "人民军队"
 FRB_Peoples_army_desc: "刺刀由工人铸造，扣动扳机的是农民。我们将打破旧军队的阶级等级，建立一支真正属于劳动者、服务于革命理想的人民武装。"
 FRB_Establish_a_revolutionary_forward_command: "设立革命前指"
 FRB_Establish_a_revolutionary_forward_command_desc: "革命军队中容不得迟钝的官僚。建立权力高度集中的前线革命指挥部，让调兵遣将更为高效，以此来帮助革命政权扫清一切反革命势力与外来干涉者。"
 FRB_Empower_commune_veterans: "赋权公社老兵"
 FRB_Empower_commune_veterans_desc: "那些在公社起义和街头巷战中幸存的老兵是我们最宝贵的财富。他们将成为新军队的骨干，将革命的火种传递给下一代。"
 FRB_Mobilize_local_militia: "地方民兵动员"
 FRB_Mobilize_local_militia_desc: "每一户人家都是堡垒，每一座工厂都是军营。通过广泛动员地方民兵，我们要让敌人在踏入我们领土的一瞬间就陷入人民战争的汪洋大海。"
 FRB_Army_political_department: "军队政治部"
 FRB_Army_political_department_desc: "枪杆子必须永远听从党的指挥。政治委员将深入到每一个连队，确保军队的政治纯洁性与革命意志永不动摇。"
 FRB_Revolutionary_radicalism: "革命激进主义"
 FRB_Revolutionary_radicalism_desc: "妥协即是背叛。我们将以最激进的态度对待武装工作，任何阻碍军队革命化的旧思维都将被无情地碾碎。"
 FRB_Reignite_the_torch: "再燃炬火"
 FRB_Reignite_the_torch_desc: "法兰西的火种已经熄灭，但革命的炬火将在我们的土地上重新点燃。我们将用这火焰重塑军队，并最终点亮整个欧洲。"
 FRB_Gaze_out_to_the_ocean: "眺望远洋"
 FRB_Gaze_out_to_the_ocean_desc: "海洋不是我们的边界，而是我们的机遇。为了确保贸易安全与国际地位，我们必须将目光投向波涛汹涌的大西洋。"
 FRB_Dockyard_construction: "船坞建设"
 FRB_Dockyard_construction_desc: "没有船坞，海军就只是纸上谈兵。我们要投入巨资改建港口，让巨大的龙骨在这里铺设，宣告我们海上霸权的回归。"
 FRB_Warship_research_and_development: "舰船研发"
 FRB_Warship_research_and_development_desc: "我们不能依赖二手的旧船。我们将资助本土的技术团队，研发更适合近海防御与远航袭击的新型军舰。"
 FRB_Naval_war_exercises: "海战演习"
 FRB_Naval_war_exercises_desc: "海洋是残酷的导师。通过频繁的海空协同演习，我们要让我们的水兵习惯咸腥的海水与震天的炮火。"
 FRB_Our_sea: "我们的海"
 FRB_Our_sea_desc: "我们要确立在该海域的绝对控制权。任何没有经过我们许可的舰船，都不准出现在布列塔尼（或奥克西塔尼亚）的视线之内。"
 FRB_Look_up_to_the_sky: "仰望天空"
 FRB_Look_up_to_the_sky_desc: "未来的战争属于制空权。我们要建立独立的航空兵种，让我们的意志延伸到云端之上。"
 FRB_Pilot_training: "飞行员培训"
 FRB_Pilot_training_desc: "培养一名优秀的飞行员比制造一架战机更难。我们将选拔最优秀的青年，在蓝天中磨练他们的胆识与技艺。"
 FRB_Air_combat_skills: "空战技巧"
 FRB_Air_combat_skills_desc: "通过模拟对抗与战术研究，我们将开发出独特的空战格斗策略，确保我们的雄鹰能在格斗中占据上风。"
 FRB_Aircraft_design: "机型设计"
 FRB_Aircraft_design_desc: "无论是高速截击机还是重型轰炸机，我们都需要符合自身战略需求的本土机型。让工程师们开动脑筋，为国家打造钢铁之翼。"
 FRB_The_eagle_spreads_its_wings: "雄鹰展翅"
 FRB_The_eagle_spreads_its_wings_desc: "当我们的机群遮蔽日光，全世界都会意识到，这片土地已经重新拥有了主宰自己命运的力量。"
 FRB_War_frenzy: "战争狂热"
 FRB_War_frenzy_desc: "和平只是为下一次更猛烈的进攻做准备。我们要让整个民族都沉浸在对胜利的极度渴望中，将战争视为升华民族精神的唯一途径。"
 FRB_An_excellent_army: "精益求精的军队"
 FRB_An_excellent_army_desc: "质量重于数量。我们要建立一支职业化程度极高的精锐力量，他们将装备最昂贵的技术，执行最危险的任务。"
 FRB_Expand_military_production: "扩大军事生产"
 FRB_Expand_military_production_desc: "工厂的烟囱必须昼夜不停地喷吐浓烟。我们要将民用工业全面转为军用，确保前线拥有取之不尽的子弹与钢铁。"
 FRB_Defend_freedom: "捍卫自由"
 FRB_Defend_freedom_desc: "军队不是为了扩张而存在，而是为了保卫每一个人免受暴政的侵害。我们将作为自由的哨兵，永远守卫在边境线上。"

