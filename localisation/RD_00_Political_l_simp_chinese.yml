 unit_limit_max:0 "最大部队限制"
 unit_limit_bonus:0 "部队限制"
 unit_limit_label:0 "§H最大支援旅§!"
 unit_limit_desc:0 "每个国家只有在其经济和基础设施可以承担的情况下，才有能力支持一定数量的军事部队。§L\n\n   - 工厂数量：§! [?net_factory_count]§L[unit_limit_major_power][unit_limit_ACW_in_progress][unit_limit_world_tension]\n   - [unit_limit_economy_law]：§! [upper_limit_perc_figure]§L[unit_limit_was_capped][unit_limit_lower_limit_used][unit_limit_bonus_used]\n\n   最终部队数量：§W[?max_divisions]§! （向下取整）\n\n请注意，以上数据的变化需要在游戏中一周的时间才会反映在游玩过程中。§![above_unit_limit_desc]"
 unit_limit_desc_above_limit:0 "\n\n--------------\n\n§R我们的部队数量目前已经超出了我们的能力范围，减轻该状态的唯一办法是裁撤我们的一些军队。§!\n\n组织度：[?mobilisation_penalty_var|+=%1]\n生产消费品所需工厂：[?mobilisation_penalty_var_positive|=%H0]\n工业产出：[?mobilisation_penalty_var|+=%]\n训练时间：[?mobilisation_penalty_var_positive|-=%]\n增援率：[?mobilisation_penalty_var|+=%1]"
 unit_limit_major_power_desc:0 "\n - 主要国家或派系领袖：§G+15%§!"
 unit_limit_ACW_in_progress_desc:0 "\n 为美利坚而战：§G+10%§!"
 unit_limit_world_tension_desc:0 "\n -全球紧张度等于或高于70%：§G+5%§!"
 unit_limit_was_capped_desc:0 "\n -不受限的部队数量：§W[?net_max_divisions]§!\n -部队数量上限（受[unit_limit_economy_law]影响）：§W[?upper_limit]§!"
 unit_limit_manpower_used_desc:0 "\n\n   因为工厂数量提供的人力要低于总人口提供的人力值（§W[?lower_limit_from_manpower]§!)，这是用来补偿的。"
 unit_limit_num_states_used_desc:0 "\n\n   因为工厂数量提供的人力要低于拥有的省份提供的人力值（§W[?lower_limit_from_states]§!)，这是用来补偿的。"
 unit_limit_default_used_desc:0 "\n\n   因为工厂数量提供的人力要低于默认的人力值（§W5§!)，这是用来补偿的。"
 unit_limit_bonus_used_desc:0 "\n\n   为部队上限提供加成：§G+[?upper_limit_unit_bonus]§!"
 upper_limit_perc_figure_pos:0 "§G+[?upper_limit_from_factory_mult]%§!"
 upper_limit_perc_figure_neg:0 "§R-[?upper_limit_from_factory_mult]%§!"
