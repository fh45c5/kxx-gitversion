 return_cores_to_ally:0 "归还[From.GetAdjective]的领土"
 return_cores_to_ally_desc:0 "[Root.GetAdjective]政府一直在讨论如何处理我们目前占领着的属于[From.GetAdjective]的领土，我们对这份领土并没有合法的宣称权。我们应该将土地归还给我们的盟友[From.GetAdjective]吗？"
 return_cores_to_subject:0 "归还[From.GetAdjective]的领土"
 return_cores_to_subject_desc:0 "[Root.GetAdjective]政府一直在讨论如何处理我们目前占领着的属于[From.GetAdjective]的领土，我们对这份领土并没有合法的宣称权。我们应该将土地归还给我们的从属国[From.GetNameDef]吗？"
 kr.political.30.t:0 "备战！"
 kr.political.30.d:0 "我们收到了一系列报告，称[From.GetAdjective]的军队正在集结，在[Root.GetAdjective]边境地区出现了大量的侦查活动。军官将领们表示，显然[From.GetNameDef]正计划入侵[Root.GetNameDef]，在接下来几周中入侵行动随时有可能会发生。"
 kr.political.30.a:0 "我们必须做好准备！"
 kr.political.31.d:0 "我们从[From.GetNameDef]处收到警告，称[From.From.GetAdjective]军队正在集结，[From.GetAdjective]的边境地区发现了大量的侦查活动。军官将领们表示，显然[From.From.GetNameDef]正在计划入侵[From.GetNameDef]，在接下来几周中入侵行动随时有可能会发生。"
 kr.political.32.d:0 "我们从在[From.GetNameDef]的盟友那边得到消息称他们的部队正在集结，并在[attack_target.GetAdjective]的边界附近进行大规模的侦查行动。[From.GetNameDef]将在数周以内对[attack_target.GetAdjective]发动进攻。"
 kr.political.75.t:0 "[From.From.GetAdjective]的领土"
 kr.political.75.d:0 "[Root.GetAdjective]政府一直在讨论如何处理我们目前占领着的属于[return_to.GetAdjective]的领土，因为目前我们对这份领土并没有合法的宣称权，我们应该把领土归还回去吗？"
 kr.political.75.a:0 "是的，归还所有领土"
 KR_will_return_all:0 "所有我们控制的[return_to.GetAdjective]核心或具有宣称的相邻省份都将归还§Y[return_to.GetNameDef]§!\n\n注意这将§R不§!包括[Root.GetAdjective]§Y宣称§!或§Y核心§!省份。"
 kr.political.75.b:0 "是的，归还除了关键地区的所有领土"
 KR_will_return_rest:0 "所有相接壤的[return_to.GetAdjective]核心或者拥有宣称的领土将会被归还给§Y[return_to.GetNameDef]§!。\n\n注意这将§R不§!包括[Root.GetAdjective]的§Y核心§!或拥有§Y宣称§!的领土，也不会包括诸如运河之类的§Y战略要地§!。"
 kr.political.75.c:0 "只归还他们的核心领土"
 KR_will_return_cores:0 "所有相接壤的[return_to.GetAdjective]核心或者拥有宣称的领土将会被归还给§Y[return_to.GetNameDef]§!。\n\n注意这将§R不§!包括[Root.GetAdjective]的§Y核心§!或拥有§Y宣称§!的领土，也不会包括诸如运河之类的§Y战略要地§!。同时[return_to.GetAdjective]仍然将会保有他们的§Y宣称§!。"
 kr.political.75.e:0 "我全都要！"
 KR_will_not_return:0 "我们将§R不会§!归还土地给他们，也再不会被其要求归还了。"
 kr.political.76.t:0 "[From.GetNameDefCap]归还[Root.GetAdjective]的领土"
 kr.political.76.d:0 "我们在[From.GetNameDefCap]的盟友已将一些我们的合法领土的控制权归还给了我们！"
 kr.political.76.a:0 "好啊！"
