l_simp_chinese:
 QIE_XHHSD: "辛亥华盛顿"
 QIE_XHHSD_desc: "玉帅如伟大的华盛顿一般拯救了中国，他是当之无愧的大总统！"
 QIE_KDBZ: "扩大兵站"
 QIE_KDBZ_desc: "国家仍处于危难之中，扩军以卫国！"
 QIE_JSYX: "军事优先"
 QIE_JSYX_desc: "为了保卫新生的民国一切以军事优先。"
 QIE_XDXF: "恢复的的宪法"
 QIE_XDXF_desc: "在我们的努力下宪法得以恢复。"
 QIE_MDZY: "民德主义"
 QIE_MDZY_desc: "我们要倡导国民遵守传统的美德。"
 QIE_HFDX: "农业改革"
 QIE_HFDX_desc: "农业是我国最重要的产业改革势在必得。"
 QIE_GFSS: "规范税收"
 QIE_GFSS_desc: "在中国，在政治上制造分歧的万恶之源或许就是严重分权的税收制度。这样的情况始于1853年，各省被授权自行收取名为“厘金”的过境税。新的中央政府应该限制各省的滥征税状况，并减少各省的截留比例。要不然，地方政府只会继续拖延本该上交给中央的收入。"
 QIE_SFYD: "收复远东"
 QIE_SFYD_desc: "远东自古以来就是我国领地，理应收回。"
 QIE_ZYFZ: "捉蝇伏猪"
 QIE_ZYFZ_desc: "在中国过去的十几年，官员的腐败与滥权不是什么少见事物，而新民国政府的各级官员也多有参与腐败活动。为了重新获得公众的信任，必须出台一些法令，不仅要打虎，吸血吮髓的国之巨蠹更要严惩。"
 QIE_YLSPHZ: "与联省派合作"
 QIE_YLSPHZ_desc: "玉帅对陈炯明许下的其中一个保证是在新政府中采取联省制度。尽管各省处在中央政府的监管下，但他们被允许独立征收赋税。尽管双方都认为自己做出了令人不快的妥协，但这就是妥协会给人带来的感觉。"
 QIE_YXSSX: "阎锡山思想"
 QIE_YXSSX_desc: "我们已经与阎锡山达成了共识，学习他的思想，可以给我们许多帮助，在我们的军事压力和政治协商下，也许我们两者能有一个可以接受的结局。"
 QIE_ALZS: "二龙治水"
 QIE_ALZS_desc: "军阀混战、列强宰割和官僚暴政的那十几年的中国与玉帅和陈炯明总理建立的两党联合政府治理下的中国一比较，后者的确就像天堂一样美好。人们都说他们是“双龙治水”，合作无间。尽管有些人不合时宜地质疑这种和谐能否永远持续下去。"
 QIE_ZXGH: "走向共和"
 QIE_ZXGH_desc: "新时的民国要走向共和，追求民主，但1911年以后的实践证明，西方式的民主不适合中国的国情，所以我们的共和民主是指导性的政治参与，这也许有些保守，但对中国而言却符合国情。"
 QIE_ZEHB: "中俄合作"
 QIE_ZEHB_desc: "尽管我们与俄国的关系在过去降至冰点，但这并不代表我们在现在与未来应同样至此，我们的合作将为两国共同带来美好的未来。"
 QIE_ywxw:0 "决定我们的未来"
 QIE_ywxw_desc: "随着内部局势的稳定，是时候决定我们政权的性质了。此时此刻，我们站在十字路口上，究竟是建立真正的君主立宪民主制度，还是继续深化与德国的合作，又或是干脆建立军事统治？"
 QIE_wmbd:0 "国会不倒"
 QIE_wmbd_desc: "皇上的统治仍然继续，我们需要国会制度来稳定我们的政府，确保我们的稳定政局，政治家们需要一个适宜生存的栖息之地，大清的林子需要的是听话的笼鸟，稳定高于一切，国会不倒！"
 QIE_zzjx:0 "真正的君主立宪"
 QIE_zzjx_desc: "皇上的权利过大，一个人权利被无限放大就会造成独裁局面，我们将加强国会的实力，让更多的参政员获得更加多的实权，皇上在政治层面插手确实太多了，时代变了，他现在确实应该好好当好一个国家的皇帝，但是政治的事情还是交给我们吧。"
 QIE_ddzf:0 "道德政府"
 QIE_ddzf_desc: "我们政府的核心方针应是执政为民，服务公众，我们的公共利益关系必须是具有理论价值以及责任的，这种模式的高度是高于法律层面的，依法治国固然重要，但是以德治国也不能落下。"
 QIE_sfzzf:0 "知识分子参政"
 QIE_sfzzf_desc: "政治家大多数都是知识分子出身，为保证议会的和平，权衡利弊后，制衡不同的实力，我们必须确保极端性的涉政人士不允许出现在议会中，激进的政治会摧毁一个国家的秩序，我们相信大部分知识分子不会做出这种行为，不然这些努力就白费了。"
 QIE_dxfz:0 "联合实业家"
 QIE_dxfz_desc: "我们国家有大大小小的企业，但是关心国家的实业家并不多，但也有不少人愿意在他们力所能及的方面帮助我们，他们的一份力量是我们需要的，政局动荡带来的是国家生产与经济的创伤，和他们合作有助于帮助重建经济，恢复生产。"
 QIE_cztf:0 "宪法权威"
 QIE_cztf_desc: "宪法是规定国家基本制度，宪法的权威高于其他法律，宪法是国家的根本法律，人的权利不可以高于宪法，要树立宪法的权威，普及法律知识，要让世人知道，即便是皇上，也不可以违反宪法中的规定。"
 QIE_lyfz:0 "乡村建设计划"
 QIE_lyfz_desc: "我们的国家由众多乡村组成，城市为少数，为建设国家，就必须振兴农村，我们计划组织政府官员下乡对乡亲们进行再教育，划分土地，分配农具，提高农民们的生活水平，如果我们不做出改变，那么强国之路将步履蹒跚，甚至面临着失败的风险。"
 QIE_ctsx:0 "鼓励传统美德"
 QIE_ctsx_desc: "中华文化博大精深，弘扬传统美德，杜绝社会出现的不伦不类以及不合周礼的行为，所有人都要唾弃这种行为，要把道德礼仪摆到自己的第一位，复兴儒家思想，让所有人都知道以何为耻，以何为荣。"
 QIE_wzdg:0 "五族帝国"
 QIE_wzdg_desc: "五族共和，是我们一直在宣扬的的政治口号，这一原则强调了在中国的五大族群汉满蒙回藏和谐相处，共建共和国，我们应该以五色旗作为国旗，表现我们五族的兄弟情谊。"
 QIE_jjzt:0 "紧急状态"
 QIE_jjzt_desc: "现在是十万火急的时候，我们必须拉响警报，我们所做的每一步都必须小心谨慎。"
 QIE_gzgh:0 "废除国会"
 QIE_gzgh_desc: "国会的腐败无能全国上下已经人尽皆知，为了帝国的未来，我们必须废除国会。"
 QIE_grcb:0 "军人掌权"
 QIE_grcb_desc: "军人越有纪律越强悍，我们可以把军人丢到政府里头，让军人掌权，建设一个更加强有力的政府。"
 QIE_jssh:0 "军事化社会"
 QIE_jssh_desc: "我们应当建立一个军事化的社会，让全国上下彻底的武装起来，我们才能在国内立于不败之地。"
 QIE_lhzqd:0 "授权中国青年党"
 QIE_lhzqd_desc: "青年总是有想法且大胆的，我们应当授权中国青年党，让这些青年的大胆想法得以实践来增强我们的力量与曾琦的合作也许会带来不一样的火花。"
 QIE_mzzy:0 "宣扬民族主义"
 QIE_mzzy_desc: "民族主义是最好的催化剂，欧洲各国正是因为利用好了自己的民族主义，才使得自己成为世界一霸，我们必须也要利用好自己的民族主义，这样我们才爆发出惊人的力量。"
 QIE_gsssgz:0 "大量征兵"
 QIE_gsssgz_desc: "中国最大的优点就是人口多，大量征兵才是我们应该走的道路！最完美的武器永远是人，我们将在世界称霸一方！"
 QIE_qjzz:0 "集中税收"
 QIE_qjzz_desc: "把税收集中起来才是最正确的选择，全国的税收将会使我们有更好的资本去强化我们！"
 QIE_yszz:0 "玉帅之治"
 QIE_yszz_desc: "我们必须感谢玉帅，是在玉帅的统治带领我们走向了伟大，玉帅万岁！玉师千古！"
 QIE_ydhz:0 "与德国进一步合作"
 QIE_ydhz_desc: "南方的革命军与北方的日本势力对北平的紫禁城虎视眈眈，清政府内群臣离散，政局混乱，我国上下充斥着不安的情绪，单凭我们的实力已经不足以抵抗这些力量，我们只有转向德国，寻求我们旧日盟友的进一步合作。"
 QIE_lshzq:0 "理事会掌权"
 QIE_lshzq_desc: "理事会在东亚的影响力不输英国，他们盘踞东南亚，用自身的实力辐射半个东亚地区，我们为了找到中国的出路，必须与他们合作，他们不仅是国际先进文明的代表，也是各国军事之中的佼佼者，中国已经被封建制度囚禁太久，只有西方的先进文明才可以拯救中国！"
 QIE_ZDYJ:0 "仿照德国经济"
 QIE_ZDYJ_desc: "强国不是一日建成的，由于闭关锁国的决定以及封建制度的影响下，我国的经济已经严重与外国断轨，当外国人用上物美价廉的汽车时，我们只能买低效的马车，清政府的一意孤行祸害了全国的民众，德国愿意帮助我们重建经济，我们将仿照德国的经济模式，向盟友看齐，早日将我国建设成经济大国。"
 QIE_dhdwz:0 "德国的支持"
 QIE_dhdwz_desc: "基层建筑方面，由于我们国家的政治体系，许多的官员已经产生了裙带关系，这导致了我们的官僚主义问题非常严重，基层建筑建设计划被无限期推迟，为了解决这一问题，我们寻求德国人的帮助，他们派来了一群专家代替我们的旧官僚，保证建筑计划有条不紊的执行。"
 QIE_LHMZD:0 "联合民主人士"
 QIE_LHMZD_desc: "任何地方都是要讲民主的，我们也不例外，与民主人士的联合不仅不会让我们有什么坏处，反而会让我们的这里的统制更加的顺利"
 QIE_lrkd:0 "联德抗日"
 QIE_lrkd_desc: "日本人是我们的心头大忌，他们一直对中国的土地有觊觎之心，既然德国人愿意与我们共同协作，那面对日本人的威胁，我们可以合作，争取共赢，这不仅可以稳定他们对东亚地区的统治，还可以解决我们无法通过外交解决的问题。"
 QIE_tbhj:0 "提拔海军"
 QIE_tbhj_desc: "北洋水师的光辉事迹曾短暂的出现在历史中，但那不过是星光一闪，如今德国人带来的更加先进的造船技术和训练思维，我们的海军百废待兴，如今可以提拔一些年轻有为的海军士兵来重建我们的舰队。"
 QIE_FZDJ:0 "德国军队支持"
 QIE_FZDJ_desc: "德国人来帮我们了，许多的德国军人与军官不远万里来到了中国的土地，他们带来了各种各样先进地装备，大炮，坦克，飞机，他们决定支持我们的行动，他们帮助我们训练士兵，推动军事改革，改变编制，整合军队，只要我们的关系持续下去，这些我们梦寐以求的东西要多少有多少。"
 QIE_LYGW:0 "龙鹰共舞"
 QIE_LYGW_desc: "如今，德国与中国是东西方两大不可忽视的力量，两国深交彼此，建立盟友关系，随后德国的精英们进驻中国，中国也就此新生，中国的崛起绝对不是偶然，是两国人民共同努力的结果，环绕寰宇，没有任何的力量可以击碎德国雄鹰与中国巨龙的联盟。"
 QIE_qyldyh:0 "强化议会"
 QIE_qyldyh_desc: "经过最后的讨论，我们已经决定了，我们应当强化议会的权力，不能什么事都听皇帝的，皇帝任何一个鲁莽的决定都会让我们遭受重大的损失。"
 QIE_ysqzlx:0 "英式君主立宪"
 QIE_ysqzlx_desc: "英国过去的经验已经告诉了我们，他们的君主立宪制是真正的能让一个弱小的国家成为一个世界霸权的，我们理应采用他们的制度来强大我们自身。"
 QIE_sxybzc:0 "实现全民医保"
 QIE_sxybzc_desc: "全民医保对于安抚底层人民以及增强他们的消费力来说，无疑是最有效的，我们只不过损失了一点钱而已，换来的却是底层人民更好的生活条件，这难道有什么不值得的吗？"
 QIE_fldg:0 "大同社会"
 QIE_fldg_desc: "全民公有的社会制度，包括权力公有和财物公有，人人敬老，人人爱幼，无处不均匀，无人不饱暖的理想社会，这就是大同社会，而今天，我们可以骄傲的告诉世界，我们已经彻底实现大同社会，我们将是亚洲理想的乌托邦！"
 QIE_fshzygh:0 "工人不再为奴"
 QIE_fshzygh_desc: "近代以来，除了德国的俾斯麦，几乎没有任何人会注意到工人的处境，这也就是为什么会有布尔什维克革命和工团革命的原因，我们应当且十分有必要去提升工人的地位，从此以后，工人就不再是奴隶！"
 QIE_mzjx:0 "战士社会"
 QIE_mzjx_desc: "一个尚武的社会，一个战士的社会，无论如何，他都是极其强大的，我们应当成为战士社会，让西方人知道什么是真正的武力。"
 QIE_fqyz:0 "激进现代化"
 QIE_fqyz_desc: "中国长期以来都落后于西方。青年党已经制定了一系列计划，力求使中国赶上西方的脚步。"
 QIE_qcyqld:0 "清除一切乱党"
 QIE_qcyqld_desc: "当今社会上一切反对声音都是破坏国家的罪犯，我们必须清除一切乱党，绝对不能有人去质疑去破坏我们的强大之路！"
 QIE_wsqw:0 "陛下之军"
 QIE_wsqw_desc: "皇帝才是帝国军队的唯一领导者，我们是属于皇帝的军队！我们必须对皇帝绝对的忠诚！皇帝将带领我们踏平一切敌人！吾皇万岁万岁万万岁！！！"
 QIE_wddg:0 "伟大帝国"
 QIE_wddg_desc: "在皇帝的带领下，我们将成为一个伟大的帝国，我们的功名不可埋没，我们的事迹千古流传！"
 QIE_jlqxkj:0 "建立全新科举"
 QIE_jlqxkj_desc: "过去的科举制度已被证实是腐朽无法为我们提供出新人才的，是时候放弃他了，我们要建立一个全新的科举制度，为我们源源不断提供新的能文志士。"
 QIE_dgqbzx:0 "重建帝国铁骑"
 QIE_dgqbzx_desc: "12世纪蒙古帝国依靠着他们的蒙古铁骑征服了亚欧大陆，其实在今天这种热兵器时代，我们依然可以像蒙古一样建立自己的铁骑，让我们的帝国铁骑疾驶在亚欧大陆的草原上吧！"
 QIE_ttsggy:0 "重收盐铁之税"
 QIE_ttsggy_desc: "为筹备更多的资金，我们决定重新收取盐铁之税以获取税收，扩大政府财政来源。"
 QIE_dxzgws:0 "宣统中兴"
 QIE_dxzgws_desc: "宣统皇帝带领我们以来，我们已经成长为一个强大且不可忽视的力量，我们决定将这段时期命名为“宣统中兴”，以此来纪念宣统皇帝的丰功伟绩！"
 QIE_qhty:0 "再造秋海棠叶"
 QIE_qhty_desc: "我们已经统一了中国所有的版图，这将是我们最伟大的胜利！秋夜海棠归于一统！"
 QIE_SFxb:0 "收复西北"
 QIE_SFxb_desc: "正如1876年一样，我们将重复左宗棠将军的壮举，我们将重新收复西北！"
    
