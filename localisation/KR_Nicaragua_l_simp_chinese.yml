 NIC_america_redeemed:0 "美利坚终得救赎"
 NIC_america_redeemed_desc:0 "我们回来了。从尼加拉瓜的丛林，从巴拿马运河的闸口，从洪都拉斯的银矿，从危地马拉的高原驻地，合众国的武装力量不可思议地集结在加勒比海，然后像涨潮一样涌向北美大陆。我们没有筋疲力尽，我们在中美洲等得太久了，一场漫长的返乡。
 星条旗重新在国会大厦顶上展开，宪法重新生效，各州议会重新召开。从加勒比海的灼热盐雾里出发，我们捡回了那片被抛弃的国土。"
 NIC_Moseley_in_command:0 "莫斯利的铁拳"
 NIC_Moseley_in_command_desc:0 "随着巴顿的退休，乔治·范·霍恩·莫斯利将军成为了国家最高领导人，现在他已经接管了我们自豪的祖国。这位战术天才和第二次美国内战的英雄，以其严厉、精打细算的头脑和铁腕，作为现代华盛顿的代表，现在将带领国家走向新教虔诚，坚定的军国主义，反社会主义和美国本土主义。"
 NIC_Immigrants_Begone:0 "解决移民“问题”"
 NIC_Immigrants_Begone_desc:0 "不幸的是，移民们正在折磨着我们的国家，破坏着我们对精致美国梦的追求——无论他们是大卫的众子，非洲之子，还是地中海和东欧的黑皮肤野蛮人。这些问题人口将不再伤害我们的社会。通过更困难的识字能力测试、更严格的移民规定和更少的移民国家名单，我们将一步一步地解决移民问题——尽管我们不得不放弃莫斯利提出的更为“有趣”和激进的解决方案：比如绝育和优生。"
 NIC_Expand_Conscription:0 "重振军国主义精神"
 NIC_Expand_Conscription_desc:0 "为了保护我们的利益和维护美国梦，我们将继续奉行和平时期维持军事化的政策。通过一项新的草案，新的军国工业化倡议，以及新的军备合同，我们将把美国变成原本理应成为的火力强大之国。"
 NIC_Crush_Commies:0 "赶走社会主义者"
 NIC_Crush_Commies_desc:0 "必须不惜一切代价阻止社会主义者及其在银行业和传媒业中的盟友，因为他们的意识形态煽动可能会永久玷污美国民众的心灵和思想。我们必须利用自身发起的赤潮将这些深红魔鬼洗尽。一个幽灵将在美国上空升起——反社会主义的幽灵！"
 NIC_Sideline_Democracy:0 "边缘化民主"
 NIC_Sideline_Democracy_desc:0 "民主一直都是一个危险的想法，民主机构日渐沦为腐败和派系主义大本营。我们必须不惜一切代价保护美国不受这些侵蚀性影响，因此联邦民主的任何和所有残余都必须从这个国家彻底废除。"
 NIC_Christian_Army:0 "一支真正的基督军队"
 NIC_Christian_Army_desc:0 "为了在我们的军队中促进良好的、敬畏上帝的价值观和诚实的行为，以及对国家和上帝的坚定忠诚，所有军队成员都必须成为新教徒。所有现有的非新教徒军人将有一个选择——要么皈依，要么不光彩地退伍，所有新兵如果尚未加入唯一的真正信仰，将被强制皈依。我们会建立一支有道德、有纪律的军队，因为我们是上帝选中的士兵！"
 NIC_Military_With_A_State:0 "华盛顿军政制"
 NIC_Military_With_A_State_desc:0 "在我们最伟大的国父和旧美国的第一任总统的影响和启发下，莫斯利将军现在作为第二个华盛顿将军成功地领导着这个高度军事化的新美国。他是我们美利坚革命的英雄，发誓要领导我们的国家走向伟大和安全，这个新的“军队国家”体制将在我们迈向新命运的征程中为美利坚服务。"
 NIC_From_a_Militia_to_a_force:0 "国民军"
 NIC_From_a_Militia_to_a_force_desc:0 "许多美国爱国者团结在宪政国的大旗之下，准备在华盛顿特区、芝加哥与路易斯安那的毒蛇面前保家卫国。旧民主党只有领导小规模民兵部队的经验，但各地的军事人才都宣誓要为宪政国服务。因此，我们应当将这群怀抱理想主义英雄梦的乌合之众们整编成一营营的士兵，时刻准备朝敌人的家门口进军！"
 NIC_counter_terrorism:0 "反恐怖主义"
 NIC_counter_terrorism_desc:0 "我们将整合各州情报局与国家情报总局的力量，在全国范围内织就天罗地网，誓将恐怖分子消灭殆尽。"
 NIC_Patton_Plan:0 "巴顿策略"
 NIC_Patton_Plan_desc:0 "你可以说乔治·巴顿不善言辞，但你要是怀疑他的军事才能，那么你就得去医院看看脑子了。巴顿以历史上的诸多军事名场面为例，论证了机动性才是制胜的关键，并提议宪政国把全部精力都放在装甲作战上。"
 NIC_Moseley_Plan:0 "莫斯利改革方案"
 NIC_Moseley_Plan_desc:0 "莫斯利将军总是在想办法改善军队的指挥效率，而如今他把数年的思考结晶汇集了起来，拟定出了一份改革方案。他提出了从上到下的等级重组，扩大旧有的陆军基地来训练军官，并着重于集中指挥系统。虽然莫斯利的方案受到了更加偏向于自主作战体系的大多数宪政国军官的层层刁难，但不可否认的是，在军事经验这方面，莫斯利可谓是独孤求败。"
 NIC_counter_fortifications:0 "前线渗透者"
 NIC_counter_fortifications_desc:0 "虽然我们的大部分部队都会接受一定的非常规战术训练，但只有那些悍不畏死、精挑细选的少数人才可肩负起深入敌后的重任，他们需要同友好团体接触，破坏敌人的基础设施。有鉴于古人劫掠的先例，这些忠勇之士必能让最大后方的敌人也心生畏惧。"
 NIC_counter_arnaments:0 "送敌入天国"
 NIC_counter_arnaments_desc:0 "倘若说到突击型军队必备之物，那必然是炸药，而且还是大量的炸药莫属。阿尔蒙德已批准对全军上下进行全面整备，一定要保证他们每个人身上都带着能把敌人阵地炸个稀巴烂的炸药、燃烧弹和手榴弹。我们当然也不会忘了游击队，就让那些占领我国领土的敌人好好享受一番清理废墟的快乐吧！"
 NIC_wickliffe_plan:0 "德雷珀计划"
 NIC_wickliffe_plan_desc:0 "威克利夫·德雷珀虽比同时代人要来得孤僻些，但他在管理军队上还是有自己的一套心得体会，也毫无保留地将其交予了国家。在其理论中最亮眼之处便是，他认为一支庞大而受过良好教育的军队符合宪政国的利益，在民用以及医疗基础设施上的苦心经营也必然能让我们在以后的战争中无往而不胜。"
 NIC_cavalry_leadership:0 "盎格鲁-诺曼人的继承者"
 NIC_cavalry_leadership_desc:0 "镌刻在南方绅士骨子里的崇高精神的血脉来源——我们遥远的祖先盎格鲁-诺曼人以骑兵为主力，一举扭转了战事，大败同样谙习马战的不列颠人，其意义不亚于我们的祖辈漂洋过海来到新大陆定居。让我们发扬光大从征服者威廉一直传承至南方各州的高贵精神之遗产，把骑兵抬升到主力军的理想模范地位吧。"
 NIC_oil_oligarchy_desc:0 "我们拥有能使国家富裕起来的一切所需的石油资源，而这些资源就在美国各州，但绝大多数的石油要么是被少数人所把持，要么是错过了钻探石油的机会。所有向我方效忠的石油公司将被合并为美国国家石油公司，政府将拥有多数股份，并将通过基础设施项目提供援助。"
 NIC_expand_Fort_Benning_for_Training:0 "扩建本宁堡军事基地"
 NIC_expand_Fort_Benning_for_Training_desc:0 "自1909年建立以来，本宁堡忠实地为我国军队服务，其重要性与日俱增。作为美国陆军步兵学校的所在地，扩建本宁堡可以为新招募的军官提供更好的学习空间，并随之在长期内为我们提供更好的军官。"
 NIC_walkie_talkies:0 "步话机"
 NIC_walkie_talkies_desc:0 "通常来说，军用装备有着听起来就很强悍的名字。步话机？这种名字是怎么混进军用系统的？我们的将军们声称，这种不受距离限制的新式通信设备将使我们的部队在战场上能够有效进行沟通。那么好的东西我们居然称它为步话机？"
 NIC_focus_on_concentration:0 "专注集火"
 NIC_focus_on_concentration_desc:0 "从罗马军团时代起，集中兵力就一直是每位指挥官的宝贵策略。考虑到我国在打击美国叛徒时的有限资源，我们应重新考虑这一战略，将炮兵集中于特定区域，使步兵能利用炮火实现突破。"
 NIC_draw_a_new_war_plan_white:0 "制定新白色战争计划"
 NIC_draw_a_new_war_plan_white_desc:0 "虽然我们缴获了《白色战争计划》原始草稿的副本，但不幸的是，它对我们的目的毫无用处，因为它只详细说明了如何供应和保卫华盛顿和中西部附近地区，而并没有提及如何从我们的南方大本营夺回全美。然而，依靠这个计划所带来的信息，以及我们经验丰富的指挥官，我们可以起草一个新版本的计划，一个考虑到我方新“情况”的计划。"
 NIC_reverse_war_plan_white:0 "逆向研究白色战争计划"
 NIC_reverse_war_plan_white_desc:0 "感谢我们的将军们，我们已经设法获得了被用来针对我们的“白色战争计划”的副本。虽然我们不能阻止合众国军队重组他们的后勤体系，但我们现在可以预测他们的行进路线，加强我方的薄弱环节，并想办法去欺骗华盛顿当局——因为他们多半认为自己已经做好准备了。"
 NIC_top_of_the_line_artillery:0 "一流火炮"
 NIC_top_of_the_line_artillery_desc:0 "更轻的动力，更强的外壳和新型的引爆设备将使我们的炮兵能打破任何掩体。如果要击垮敌人，就必须加快其发展。"
 NIC_coordinated_fire:0 "协同射击"
 NIC_coordinated_fire_desc:0 "按照命令定时射击火炮的日子已一去不返。一个更好的随时间运转的人力行动系统将使我们能在必要时协同射击。"
 NIC_air_force_reform:0 "组建美国空军"
 NIC_air_force_reform_desc:0 "由于美军中持续近20年的辩论仍在继续，叛逃我们一方的空军军官们承诺，如果将空军从陆军中分离出来，将会取得巨大的成果。美利坚宪政国的空军将成立，并将决定其未来的计划。"
 NIC_expand_ACTS:0 "扩建陆军航空兵战术学校"
 NIC_expand_ACTS_desc:0 "很幸运，美军过去将空军军官训练下放到南方腹地，因此我们现得以进入阿拉巴马州麦克斯韦空军基地航空兵战术学校。然而，为了超过在弗吉尼亚州兰利空军基地设立的学校，我们需要扩大招生规模。"
 NIC_fighters:0 "战斗机开发"
 NIC_fighters_desc:0 "由于缺乏政府的资金支持，美国战斗机项目在1920年代处于停滞状态，导致战斗机发展处于不利地位。为缩小这一差距，我们必须以一份利润丰厚的飞机生产合同为奖励来资助不同公司间的设计竞赛。"
 NIC_le_may_reform:0 "林德伯格改革计划"
 NIC_le_may_reform_desc:0 "查尔斯·林德伯格的名声甚至在空军中也是如雷贯耳，这位飞行员提出了一个大胆的改革计划。他认为空军并不是陆军的添头，应该被用于打击我们敌人的心脏，削弱他们的战争工业。虽然他的理论方法是合理的，但最终决定权在政府手中。"
 NIC_air_field_expansion:0 "扩建空军基地"
 NIC_air_field_expansion_desc:0 "第一架飞机就是在南方进行飞行的。我们这里有着悠久的航空传统，让我们拥抱它吧。我们将扩建机场，确保我方拥有足够数量战斗机、轰炸机和运输机，以便我们能赢得任何空中战争。"
 NIC_naval_bombers:0 "发展海军轰炸机"
 NIC_naval_bombers_desc:0 "我们的海军部队不足以保卫海岸线，因此，空军应当承担起这份责任，不惜一切代价将企图涉足我国领土的敌军舰队沉入无尽的深渊。出于补充海军巡逻队的需要，我们将配属大批海军轰炸机负责侦察和阻碍任何敌对船只，尤其是传统海军难以深入或广泛开展巡逻的海域更是如此。"
 NIC_Weyland_plan:0 "韦兰改革计划"
 NIC_Weyland_plan_desc:0 "奥托·P·韦兰最近凭借着裙带关系和自身优秀能力的共同作用，成功地进入了指挥部高层，并提出了一项显然受到陆军高层欢迎的改革计划。在他看来，空军在战争中的作用应该是通过近距离的空中支援来支持陆军的前进。虽然他的理论方法是合理的，但最终决定权在政府手中。"
 NIC_bombers:0 "开发轰炸机"
 NIC_bombers_desc:0 "轰炸机，恐惧的源泉，力量投射的象征。当她们授命为绝密计划服务而承载那些不为人知的秘密的重量时，我们当然需要让她们变得更加听话而精巧。"
 NIC_radar:0 "研发“雷达”"
 NIC_radar_desc:0 "“雷达”是一项用于发现空中敌军动向并让我军的空况监视员在夜晚能够更加轻松进行工作的最高机密技术。"
 NIC_screaming_eagles:0 "“呼啸之鹰”计划"
 NIC_screaming_eagles_desc:0 "随着空军力量的不断壮大和战场需求的日益增长，一个问题出现在我国陆军和空军军官面前：是否有可能将两军相结合，输送部队至敌后战场以改变战争的面貌？为证明或反驳这一理论，必须进行试验。"
 NIC_rule_the_skies:0 "统治天空"
 NIC_rule_the_skies_desc:0 "起飞吧，飞向无垠的苍穹，飞向高耸的天际吧。我们的空军举世无双，我们的力量无所不及。"
 NIC_CAS_focus:0 "近距离空中支援发展"
 NIC_CAS_focus_desc:0 "陆军在穿越敌人所建立的战壕时要求更多的地面支援。作为平等的合作伙伴，空军批准了这一要求。"
 NIC_CAS_doctrine:0 "空地协同演习"
 NIC_CAS_doctrine_desc:0 "为打造一支高效的近地支援力量，我们首先要对这项新颖的战争概念加以实践。"
 NIC_flexible_bombers:0 "多用途轰炸机发展"
 NIC_flexible_bombers_desc:0 "自从我国空军肩负起辅助地面部队作战的使命以来，轰炸机正在扮演愈发广阔的角色。对敌军后方实施近地轰炸的成果，无论是针对后勤补给还是通讯设施都效果显著，我应该鼓励生产商开发能够适应这些任务的新型战斗机。"
 NIC_combined_arms_offensive:0 "陆空军协同进攻"
 NIC_combined_arms_offensive_desc:0 "我们的空军指挥官已经准备就绪，但阻碍我国军事力量发展另一问题正重新浮现：陆军军官们并不清楚该怎样发挥空军的最大潜力。因此，我们应该手把手地教导他们如何实现步兵、机械化车队与空军的战术协调，对敌人发起势不可挡的猛攻。"
 NIC_strat_bomber_development:0 "开发战略轰炸机"
 NIC_strat_bomber_development_desc:0 "我国空军的发展方向日渐清晰后，眼下应该着重于新型轰炸机的开发，实现摧毁敌方工业设施的重要使命。"
 NIC_cult_of_aviation:0 "航空崇拜"
 NIC_cult_of_aviation_desc:0 "自莱特兄弟在北卡罗来纳州小鹰镇进行人类历史上首次试验飞行以来，美国人对航空技术便显得愈发着迷。我们应该有效利用这种魅力，将我国空军打造为美利坚的骄傲。"
 NIC_long_range_interceptors:0 "远程拦截者"
 NIC_long_range_interceptors_desc:0 "尽管战斗机可以捍卫战场上空的安全，但位于敌方领空的战斗通常过于遥远，很少有战斗机可以护送我方的轰炸机群不受敌方空军部队干扰。为应对这些问题，我们设计改良了新的战斗机样品，分量更重、灵活性更强，在空中对决中更有优势。对该领域实施进一步投资有望提升项目的收益。"
 NIC_navy:0 "美国海军"
 NIC_navy_desc:0 "盘点海上形势之后，我们发现我方的海军只有很少的几艘船，水手的数量就更少了……但至少他们忠于美国人民。"
 NIC_great_white_fleet:0 "大白舰队"
 NIC_great_white_fleet_desc:0 "“大白舰队”是历史上美国海军实力的巅峰，它的荣光激励着每一代海军人。我们应当重拾往日荣光，建设一支以战列舰与无畏舰为核心的传大舰队，来捍卫美利坚的海权。"
 NIC_protect_american_trade:0 "保护美洲贸易"
 NIC_protect_american_trade_desc:0 "贸易是美国的经济命脉，我国海军作战理论也自然应当以保卫海上生命线免遭敌军袭扰为核心。"
 NIC_carriers:0 "航母舰队计划"
 NIC_carriers_desc:0 "航空母舰代表着海军未来的潮流。我们应当投资相关领域研究以便更好地发展国内海军力量。"
 NIC_battleships:0 "战列舰研究"
 NIC_battleships_desc:0 "战列舰是当之无愧的公海霸主。我们应着手研发能够装载更大的舰炮与优良防空体系的新型战列舰。"
 NIC_battle_cruisers:0 "战列巡洋舰研究"
 NIC_battle_cruisers_desc:0 "战列巡洋舰，是战列舰重火力与巡洋舰机动性的完美结合。我国海军应配备相当数量的战列巡洋舰用于执行常规任务。"
 NIC_coast_guard:0 "保卫海岸"
 NIC_coast_guard_desc:0 "重建海岸警卫队有助于为海上贸易通道提供保障，不法分子将在海面上遭到拦截，陷入危难的人也能得到及时施救。"
 NIC_light_cruisers:0 "轻巡洋舰发展"
 NIC_light_cruisers_desc:0 "轻型巡洋舰的主要职责是为舰队提供防空火力、攻击敌方驱逐舰和摧毁敌方潜艇。我国海军应配备相当数量的轻巡洋舰来维持舰队战力平衡。"
 NIC_naval_aviation:0 "海军航空"
 NIC_naval_aviation_desc:0 "海军航空兵将成为未来远洋作战的主力。我们必须确保舰载战机可以在敌人对我方舰队产生威胁之前就将其歼灭。"
 NIC_expand_dockyards:0 "扩建船坞"
 NIC_expand_dockyards_desc:0 "我国当前的船坞保有量不足以独力应付战争的需要，眼下我们应当建设更多的海军生产设施来供给战时所需。"
 NIC_submarine_development:0 "潜艇发展"
 NIC_submarine_development_desc:0 "潜艇可以对敌军运输编队和重型战舰造成重大破坏。我国的潜艇设计应当时刻领先于敌方驱逐舰与反潜战术的发展。"
 NIC_liberty_ships:0 "自由轮"
 NIC_liberty_ships_desc:0 "我国的民用造船厂先前主要是生产商业货轮。这些船厂能够迅速转向大规模运输船生产，让我们可以向遍布世界的盟友送去援助。"
 NIC_maritime_industry:0 "海事产业"
 NIC_maritime_industry_desc:0 "我们的海上传统依然牢固。我们可以利用商业航运业帮助我们苦苦挣扎的民主制度勉力生存下去。"
 NIC_new_admirals:0 "新生代海军将领"
 NIC_new_admirals_desc:0 "许多海军将领选择与东方的叛徒同流合污，为保障我国的海上霸权，我们必须培养新生代的海军指挥官。"
 NIC_life_at_sea:0 "建立海军女子志愿服务队"
 NIC_life_at_sea_desc:0 "女性可以在海军中承担一些辅助性的角色，以便让男人们专心于战斗任务。此举虽可能在社会上引发争议，但无疑有助于达成我们的战争目标。"
 NIC_marine_corps:0 "扩大海军陆战队"
 NIC_marine_corps_desc:0 "海军陆战队是美国全球军事投射能力的缩影。从蒙特祖马大厅，到的黎波里海岸，陆战队永远为国家效劳。我们应该确保他们能得到最先进的装备与训练设施。"
 NIC_naval_training:0 "海军训练"
 NIC_naval_training_desc:0 "尽管安纳波利斯海军军校在内战中被毁，我们仍然有充足的训练设施来培养新一代海军军官与水兵。"
 NIC_urban_warfare:0 "巷战训练"
 NIC_urban_warfare_desc:0 "我们应该扩建海军陆战队规模，确保他们有能力在全球范围内投射我国的力量。"
 NIC_coastal_bunkers:0 "永远忠诚"
 NIC_coastal_bunkers_desc:0 "“永远忠诚”是海军陆战队的格言，作为美利坚自由与民主的堡垒，他们将为世界传播解放的福音！"
 NIC_america_rules_waves:0 "美利坚统治四海"
 NIC_america_rules_waves_desc:0 "我国在海军研究与建设领域的广泛投资，使我们重新成为世界领先的海军强国之一。起航吧，为黑暗的世界开辟道路！"
 NIC_back_in_business:0 "回到世界舞台"
 NIC_back_in_business_desc:0 "既然我们已经恢复了世界强国的地位，是时候明确我们在世界舞台中的位置了。"
 NIC_manifest_destiny:0 "昭昭天命"
 NIC_manifest_destiny_desc:0 "我们在世界上的地位不能与旧秩序一般——美国本来就应该统治北美，它也理应如此！让我们立刻攻击背信弃义的加拿大人和受工团主义影响的墨西哥人，把两地的资源化为己用。"
 NIC_american_empire:0 "美利坚帝国"
 NIC_american_empire_desc:0 "当老牌欧洲国家和崛起的亚洲国家主宰世界时，美国并不打算袖手旁观。我们自己的帝国将会让罗马人感到羞耻，我们会为了我们人民的利益开始准备征服外国。"
 NIC_pacific_pact:0 "太平洋条约"
 NIC_pacific_pact_desc:0 "当我们需要着眼于西方时，在东方挑起争端就没有任何好处了，尤其是日本仍然可能成为我们的坚实盟友，因为他们和我们一样，试图终结工团主义，保护本国人民。尽管并不是所有美国人都欣赏日本种族和文化，但达成某种协议对双方都有好处。"
 NIC_consolidate_the_south:0 "巩固南部"
 NIC_consolidate_the_south_desc:0 "我们需要保住我们在中美洲的财产，这不是一项容易完成的任务，因为叛乱分子企图颠覆我们，尽管他们的事业现在已经失败，蛰伏于国家法治之下。但一场清除激进分子并建立更多前哨基地的军事行动将强化我们对南部的控制。"
 NIC_quebec_issue:0 "魁北克问题"
 NIC_quebec_issue_desc:0 "既然魁北克的天主教徒对我国的对天主教立场以及整治公社同情者，排除潜在工团主义者的行为提出了严重的异议，那就开始驱逐出境运动，送他们加入他们心爱的公社吧。"
 NIC_lead_south_africa:0 "扩大朋友圈"
 NIC_lead_south_africa_desc:0 "为了实现我们的全球野心，我们必须与其它坚持白人至上思想的志同道合国家进行联合。我们将共同维护西方文明的荣光，为我们合作但完全隔离的人民带来秩序、稳定、传统和民族自豪感。我们会一同创造出守护我等之民的强大联盟。"
 NIC_destiny_of_the_anglo_world:0 "盎格鲁世界的命运"
 NIC_destiny_of_the_anglo_world_desc:0 "英国和法国本来有潜力成为伟大的国家，但不幸的是，他们却信奉了马克思主义，现在还威胁要摧毁我们的一切。为了解决这个问题，美国将成为盎格鲁世界与法兰西世界的领袖。"
 NIC_the_eagle_spreads_its_wings:0 "雄鹰展翅"
 NIC_the_eagle_spreads_its_wings_desc:0 "随着我们主要目标的实现，让我们在南美洲确保我们所需的最后资源，以建立一个永不会陷入资源匮乏的强大美国。"
 NIC_fordist_economy:0 "建立开国元勋心怡的福特式经济"
 NIC_fordist_economy_desc:0 "福特被证明创造了最完美的工业组织与管理方式，几十年来，他的经济理念一直是美国工业崛起的支柱。福特主义将主宰美国经济，并与莫斯利的威权军国主义和国父们的保守自由资本主义相融合，创造一个由美国最优秀的人创造的新经济，并为美国最优秀的人服务，最终让我们当中最优秀、最聪明的人推动美国我们走向繁荣的未来。"
 NIC_Finest_Americanism:0 "捍卫最佳的美国精神"
 NIC_Finest_Americanism_desc:0 "在上帝的翠绿地球上，美国精神代表着最完美、最受神启示的文化与社会；美利坚是繁荣和自由的光辉灯塔，是辉煌的山巅之城。我们必须不惜一切代价，对美国独特而完美的文化加以保存和维系。我们将制定法律，以此维护我们以及开国元勋们的思想。军队规模将得以扩大，以帮助保卫国家。在莫斯利将军的统帅下，星条旗绝不会陨落！"
 NIC_Long_Gray_Line:0 "西点军魂"
 NIC_Long_Gray_Line_desc:0 "西点军校可能是要打扫打扫灰尘才能为我们所用，但它和弗吉尼亚军校确实也培养出了一批在世界上都首屈一指的军事人才，从以前的罗伯特·E·李和托马斯·杰克逊，再到当代的乔治·巴顿和查尔斯·佩洛特·萨莫勒，西点的学员们向来是美国军队的楷模。因此，为了延续传承我国的优秀军事传统，我们是该重振我们的军事学院，并根据现实需要进行响应调整，以期保证他们能培养出将战术战略烂熟于心的爱国者。"
 NIC_Painting_Logistical_Masterpiece:0 "共创后勤补给奇迹"
 NIC_Painting_Logistical_Masterpiece_desc:0 "德雷珀的扩军方案面临的最大批评是补给问题。东南各州欠缺发达的铁路枢纽与高速公路，而且地形多崎岖、恶劣，很难支撑起一支庞大的军队。德雷珀对此自然是心知肚明，而且他也准备好来个人人能吃饱、枪枪不缺子的后勤大变样了。只要号召民众协助建立临时性的交通枢纽、组建专门负责管理补给需求的完备机构，要不了多久，德雷珀的反对者就会自觉噤声的。"
 NIC_Expanded_Pioneer_Fund:0 "增拨先锋基金"
 NIC_Expanded_Pioneer_Fund_desc:0 "虽然德雷珀创立先锋基金的初心是为了让更多人了解到优生学的好处，但他近来的晋升也让他有了扩充先锋资金所需的只要。也就是说，他定下了第二个目标，也就是向纯粹的美国人提供奖学金，建设新的医学教育点，并让我国的医护人员为劳军拥军做好准备。在残酷的现代战争中，随时准备拯救美国人生命的前线医生要比任何时候都来的珍贵。"
 NIC_Forrests_Spirit:0 "福雷斯特精神"
 NIC_Forrests_Spirit_desc:0 "现代的机动战争固然是由坦克与摩托化步兵所主导的，但我们也不能忘记内森·贝福德·福雷斯特传下来的传统。与卡车与坦克相比，马要来得更廉价，也更适用于我们的农村土地，因此，我们必须继续强调骑兵的作用，还有其提升我军机动性的能力。我们的骑兵部队可以负责包围与钳形攻势，步兵部队则应准备大举冲锋，完成任务。此外，我们还应鼓励军官们置生死于度外，像鹿寨战役中突入联邦军防线的人一样，扔下左轮狂挥军刀。只有抱定决心拼死一搏，我军才能在战场上所向披靡！"
 NIC_Columbia_Calls_Victory:0 "哥伦比亚呼唤胜利"
 NIC_Columbia_Calls_Victory_desc:0 "国家战事正急，全国上下必须竭尽全力争取胜利。仅有士兵们的流血牺牲还不够，我国平民们也必须为战事尽一切力量，他们将以辅助部队的形式，加入预备役部队，甚至是在我国的沦陷区中进行游击战。唯有完成任务，哥伦比亚的羽翼之下才能有我们的一席之地！"
 NIC_Communications_Nexus:0 "通讯中心"
 NIC_Communications_Nexus_desc:0 "莫斯利个人对通信技术兴许有所偏爱，但这一爱好肯定也能在他集中指挥的设想上派上用场。我军的最高指挥官决定将通信系统作为军队改革的头等要事。第一步便是发展建设通讯中心，保证所有部队都能及时收到同样的命令。"
 NIC_Martial_Darwinism:0 "尚武达尔文主义"
 NIC_Martial_Darwinism_desc:0 "我们绝不允许不称职的军官士兵们因为裙带关系、政治关系或是其他原因留在军中服役，这只会让我军变得软弱无力、老态龙钟。莫斯利建议，一切此类形式的“法外开恩”行为都该接受公正的惩处，我军军官也应当受到严厉的约束。真正的人才会在新的冲突环境之中脱颖而出，而这些未来的军队领袖也应当立刻走上统领军队的道路。"
 NIC_Engineers_Form_the_Backbone:0 "工程师骨干"
 NIC_Engineers_Form_the_Backbone_desc:0 "构筑完善的防线是莫斯利作战计划的关键一环，但不合格的功臣部队可没法办到这件事。通过大规模招募工程师，改进他们的工具与重型机械，我军必能抵御敌人的一切攻势。"
 NIC_Controlling_Fear:0 "利用恐惧"
 NIC_Controlling_Fear_desc:0 "恐惧既是我军对付敌人的武器，也是时不时压垮我军的致命情绪。莫斯利从两方面分析了恐惧，我们也懂得了如何在敌人心中制造恐惧，如何保持我军部队的心理健康。我们首先要做的便是对炮兵部队进行大规模投资，对敌军阵地的不断炮击加上燃烧弹的使用，必能让敌人胆战心惊。"
 NIC_Titans_of_the_New_Republic:0 "新共和国的巨人"
 NIC_Titans_of_the_New_Republic_desc:0 "钢带虽被视作美国工业之心，但要是据此妄下定论，耻笑宪政国本身毫无工业实力，那可就是无知透顶了。田纳西盛产钢铁，密西西比盛产黑金，经济天才亨利·福特更是亲自主持了宪政国的大规模工业改革。与志同道合的实业家们一样，他依旧坚信宪政国是唯一能把美国从联邦派与工团主义者的双重暴政中解放出来的希望，其专业知识与影响力也得以供我们所用。我们当然也会善加利用！"
 NIC_Remembering_Stonewall_Jackson:0 "铭记石墙杰克逊"
 NIC_Remembering_Stonewall_Jackson_desc:0 "虽然宪政国不仅控制着南方各州，但不可否认，我们的大部分支持者都来自于此，在那些铭记着“命定败局”的人心中，有一位英雄奇侠：石墙杰克逊。无人可否认他的军事才华，我军的将军们也该努力学习他，成为我军士兵追随的传奇人物。魅力四射的军中声望、能在战火纷飞时严明军纪、如臂使指地调遣军队，这些都将是能让我军赢得未来战争的军官们的关键特征。此外，宣传一番老英雄肯定能鼓舞我国民心。"
 NIC_War_of_the_Ranger:0 "游骑兵之战"
 NIC_War_of_the_Ranger_desc:0 "宪政国内最不少的就是游击队员、拓荒者和民兵部队。从白人联盟到吃苦耐劳的猎人，再到偏远村庄中的地方治安维持团体，暴力且艰苦的生活方式早已深入我国人民骨髓之中。现代战争的烈度日趋高涨，早已无人在乎所谓的骑士风度，要是我们不把他们中的一些人吸收入伍，那可就是我们的失误了。这些荒野之人可以胜任特种部队与侦察兵的角色，也可以在我们的海军陆战队和山地部队的额外培训科目中派上用场。"
 NIC_Steel_Coated_Cavalry:0 "钢铁之骑"
 NIC_Steel_Coated_Cavalry_desc:0 "无论是轻骑兵还是重骑兵，旧时代的战争都是由马背上的人主导的，他们会趁机发动突袭，进而击溃敌军。坦克是新的骏马，车组成员便是新的骑士，为了签订更多的工业合同，巴顿已经发动了一切必要的关系。此外，为了配合坦克部队的机动，步兵部队也需要进行重新训练，一如当年的入伍初训。"
 NIC_Reinforce_Meat_Grinder:0 "加固绞肉机"
 NIC_Reinforce_Meat_Grinder_desc:0 "敌军皆被包围，阵地皆被占领，巴顿手下的士兵们颇有种操纵着绞肉机的错觉。深陷重围的敌军几近无力抵抗，但宪政国的狂飙猛进也激起了敌人的戒心。我们现在必须重新审视一番坦克的设计，巴顿也攒了老多建议和要求要提出来了。"
 NIC_Breakthrough_Above_Below:0 "上下求突破"
 NIC_Breakthrough_Above_Below_desc:0 "没了支援，装甲部队就什么也不是，充其量也只是野战炮的靶子。这便是大战的经验告诉我们的，所以，巴顿给自己的任务便是让空中侦察、战术轰炸与自己统领的地面部队间建立紧密的联系。这种联合作战将成为突破敌军防线的关键，更能让他的坦克能轻而易举地碾过敌人的土地。"
 NIC_Give_Them_Guts:0 "予其勇气"
 NIC_Give_Them_Guts_desc:0 "在巴顿看来，那些不能鼓起勇气身先士卒的军官实在无能之极。要想真正地领导别人，你就得和他们同甘共苦，在这个过程中让他们心服口服。巴顿早已在自己统领的军队中赢得了这种忠诚，但现在，他要求他的下属们也像他一样在所属部队中赢得这种忠诚。"
 NIC_Cannae_Austerlitz:0 "坎尼与奥斯特里茨"
 NIC_Cannae_Austerlitz_desc:0 "巴顿逐渐了解了战争中的一个独特细节：歼灭。战斗可以是敌我双方持续数小时的拉锯战，也可以是大战中那样耗时数月的苦战，还可以是战争艺术的充分体现。巴顿更偏爱候诊，从现在起，他将包围歼灭敌军作为一切军队机动的首要目标。无论在战略还是战术层面，每一只军队的目标都应当是包抄、袭扰、最终歼灭胆敢阻拦钢铁大军的敌军。"
 NIC_Take_Our_Stand:0 "死守立场"
 NIC_Take_Our_Stand_desc:0 "从南方到钢带，从大苹果到天使之城，上主真正赐福之地如今尽入我手，亦在我等刀剑的力量下重归团结。百战老兵光荣归来，年轻一代渴望参军报国，广大民众更是爱国情切，敌人为之心生恐惧。事到如今，除了我们对至真至善的永恒追求外，仅存在着以嫉恨目光觊觎美国的残余威胁。我们的现代化军队整装待发，准备突入任何必被征服的地狱，誓要将一切威胁彻底铲除。"
 NIC_Standing_Tall_idea:0 "美利坚屹立不倒"
 NIC_Standing_Tall_idea_desc:0 ""
 NIC_Research_Rush_idea:0 "研究热潮"
 NIC_Research_Rush_idea_desc:0 ""
 NIC_Dixiewood_idea:0 "迪克西坞的健康电影"
 NIC_Dixiewood_idea_desc:0 ""
 NIC_increased_military_spending2_desc:0 "美利坚最强悍的武器不是什么坦克，飞机，或者是步枪，而是那些参与生产这些物资的大型军工复合体。经过精心调校的工业装配线，足以支撑起一支规模近乎天方夜谭的军队，我们的备战进程正以惊人强度推进。"
 NIC_Magnolia_Blooms:0 "木兰绽放"
 NIC_Magnolia_Blooms_desc:0 "就像我们所深爱的木兰花那样，美国和她的人民再一次地崛起了。我们的生活逐渐回到轨道上去，而只有少数的怨恨等待着我们去平息，内战带来的荒芜也在这一刻被我们彻底扫净。和任何的花朵一样，我们的复兴也并不被世界所忽略。旧美国已经不复存在，但在经历了火焰与为其独立而奉献之后涅槃的美国又重新回到了世界舞台之上。"
 NIC_Igniting_Tredegar:0 "重燃特里迪加"
 NIC_Igniting_Tredegar_desc:0 "特里迪加是邦联最大的钢铁厂，也是当代的奇迹，其钢铁的产量在美国来说都无人可敌。这个地方是南北战争时期少数几个没有受到北方人打击的几个地方之一，并且一直繁荣到了现在。现在也是时候重振特里迪加钢铁厂荣光的时候了，而我们也会将其作为扩大全美军事工业这一工程目标相结合。"
 NIC_Mad_Dash_to_Progress:0 "向进步狂奔"
 NIC_Mad_Dash_to_Progress_desc:0 "随着内战的爆发，留给我们的许多时间与机会都悄然流去，而这些时间本可以留给我们去填补某些科技领域的空白，但美国却利用这段时间让自己不受世界的困扰，处于孤立之中。然而，在我们重新统一了国家之后，我们便可以在战争现代化领域投入大量的资源以快速赶上世界的步伐，进而不必对那些来自亚洲或者欧洲对我们的突袭感到惊慌。"
 NIC_Fordist_Engine_Militarized:0 "福特引擎军事化"
 NIC_Fordist_Engine_Militarized_desc:0 "在他搬到南方的几年前，在二次内战之前，甚至早在世界大战结束之前，亨利·福特就有过生产自己的轻型坦克模型的想法。官方将那未完成的机器称作福特1918型，又得名福特的3吨坦克。如今，亨利·福特掌握了强大的工业机器，他能够再度整合全美的工厂，根据近年来的经验教训和1918型坦克的经验教训，重新专注于制造一款真正可怕的战争机器。"
 NIC_Home_Grown_Dixiewood:0 "本地“迪克西坞”"
 NIC_Home_Grown_Dixiewood_desc:0 "与好莱坞这样的巨头竞争很难，但我们不得不这么做，尤其是对付这种只为烂片提供发展空间的公司。为了确保我们的政府，我们的遗产能够与全国其他地区保持一致，我们应该启动一个名为“迪克西坞”的宏伟项目。从迪克西坞中出厂的充满历史性，动作性与戏剧性的电影将会重塑美国各地所有家庭的品味。"
 NIC_Heroes_Never_Die:0 "英雄不死"
 NIC_Heroes_Never_Die_desc:0 "如果不是那些在我们出生之前便在前线为了国家所牺牲的战士们，我们所热爱的土地与在其上面的记忆就都会消失。在南北战争的英雄们如此，在第二次美国内战中那些为国奉献的英雄们也是如此。我们不应忘记他们为我国所做出的努力与奉献，而那些退伍军人们在战争中所积累的经验将会成功地教育未来几代的年轻人们。"
 NIC_Guns_of_the_South:0 "南方枪炮"
 NIC_Guns_of_the_South_desc:0 "我们必须面对一个可悲的现实，南方从来没有可圈可点的造枪历史。几乎所有闻名世界的枪支及其制造商都来自北方，无论是柯尔特还是史密斯和韦森，也就只有一个勃朗宁的例外，但其所在的犹他州也算不上南方。我们坚定的决心和意志可以弥补经验上的不足，我们一定要让南方拥有自己的枪支，这些枪支身上散发着狂野西部中的左轮手枪与M1卡宾枪的精神气质，亦可在我国各地广泛推广。"
 
NIC_sandinista_win:0 "桑地诺主义者胜利"
NIC_sandinista_win_desc:0 "我们赢了，桑迪诺万岁！自由的中美洲与她的人民万岁！"
NIC_towards_new_EDSN:0 "推进EDSN"
NIC_towards_new_EDSN_desc:0 "EDSN即尼加拉瓜主权保卫军，是桑迪诺将军当年在拉斯塞戈维亚斯亲手建起来的。那时候连正经步枪都配不齐，战士们拿着砍刀和猎枪就敢迎上去打海军陆战队。仗打完了，EDSN不能就此散了，不能变成和平年代养闲人的衙门。我们要把它推进到每一个省、每一个村。军队要参加修路、建学校、防疫种痘，要跟老百姓住一个屋檐下吃同一锅饭。EDSN的士兵骑不到百姓头上当老爷，而是百姓的子弟兵，是穿军装的农民和工人。"
NIC_bolster_the_indigenous:0 "支持原住民"
NIC_bolster_the_indigenous_desc:0 "尼加拉瓜的印第安人在这片土地活了几千年，比我们所有人都早。可这几百年他们受的罪简直说不完——西班牙人来了杀一批，建国以后被圈到边角荒地自生自灭，美国人来了连他们的语言都不准讲。革命不能为了把白人和梅斯蒂索人解放完了就算数，大西洋沿岸的米斯基托人、苏莫人、拉玛人，他们也是我们的尼加拉瓜人，也是我们欠了债的兄弟姐妹。将要废除一切歧视原住民的旧法律，承认原住民社区对自己祖传土地的权利，政府拨款帮助恢复印第安语言教学和传统医疗。
尼加拉瓜人团结在革命的红旗下。"

NIC_sandino_rides_on:0 "桑地诺精神长存"
NIC_sandino_rides_on_desc:0 "同志们，我们打败了反动派，打跑了美国人，但这只是一个开始。桑迪诺将军在拉斯塞戈维亚斯的山路上告诉过我们，民族解放不是换一面旗就完事。他的精神是什么？是不跪着跟外国人谈条件，是不把自己当成谁的后院、谁的附庸，是把土地还给种地的人、把尊严还给被踩在泥里的人。美国报纸管他叫"匪徒"，因为他们没法理解一个人为什么能不为钱、不为权，纯粹把命豁出去。现在我们坐进了首都，这间办公室里往后坐的每一个人，都应该每天问自己一遍：我今天做的事，配不配得上那些在丛林里饿着肚子跟海军陆战队干仗的游击队员。行动告诉我们：桑迪诺的精神绝不只是挂在墙上的画像。"
NIC_generalissimo_of_republic:0 "共和国大元帅"
NIC_generalissimo_of_republic_desc:0 "革命需要领袖，军队需要统帅。桑迪诺将军打赢了一场没人觉得能打赢的仗，这不是战术上的侥幸——我们授予他共和国大元帅的荣衔。他在战场上证明过自己的判断力，在谈判桌上证明过自己不会被人灌了迷魂汤就签字，在根据地证明过自己能把识字课本和步枪一起发到士兵手里。尼加拉瓜现在四面都是不怀好意的眼睛，我们需要一个站在高处能看清方向的人。他过去是游击队的将军，往后就是这个国家的元帅。"
NIC_unchain_average_man:0 "解放普通人"
NIC_unchain_average_man_desc:0 "我们闹革命，说到底不是为了哪一派当权，是为了那些一辈子被当牛马使唤的人。庄园主家的雇农，矿山里的苦力，市场上头顶篮子叫卖的女人，铁路边捡煤渣的小孩——革命要是没让他们的日子变好，那就是换了一身衣服继续欺负人。从今天起，雇农不再欠庄园主一分钱，那些祖祖辈辈还不清的债一笔勾销，土地证送到每一户种地的人手上。工人不再是在领班的皮鞭底下讨生活，工厂有工会，劳动时间、工资标准写进法律，老板要是还敢打骂工人，工会有权把他轰出大门。女人不再天生低男人一等，同工同酬，婚姻自由，谁要是敢拿老规矩压人，法律替她们撑腰。穷人看病不要倾家荡产，孩子上学不再要卖牛卖地。政治不是客厅里叼雪茄的人说了算，地头、车间、街角、集市上的人，他们的事也一定是政治。"
NIC_manifest_of_light_and_truth:0 "《光明与真理宣言》"
NIC_manifest_of_light_and_truth_desc:0 "正义不会自己从天上掉下来。我们要用这份宣言告诉全世界尼加拉瓜在走什么路。
美国人说我们是"匪帮"，华盛顿的政客们翻来覆去就想把我们钉死在"野蛮"两个字上。但真理在我们手里——强权永远不等于正义，一个民族选什么制度过什么日子，轮不到任何人来教。我们没收那些替外国资本当买办的大庄园，分给没有立锥之地的农民。我们把矿山、铁路、港口从外国公司手里收回来，让尼加拉瓜的资源养活尼加拉瓜人。我们让每一个孩子有书念，每一个病人有药吃，每一间茅屋都配得上人的尊严。
这些话写出来不是给别人看，只是我们有自己的真理之尺。"
NIC_mend_communist_relations:0 "修复与共产主义者的关系"
NIC_mend_communist_relations_desc:0 "桑迪诺将军在世的时候跟不少共产党人并肩作战过。后来几年，因为一些人的左倾教条主义，我们跟他们之间有了裂痕，互相冷眼，互相猜忌，好像敌人还没打进门，自己人先分了你我。这种内耗该结束了。共产主义者跟我们有共同的目标：反帝、反封建、为无地农民争土地。中美洲的革命没法靠哪一派单独扛到底，谁要是觉得只有自己最纯粹、别人都是异端，那就只能等着被敌人一个一个收拾掉。"
NIC_realizing_bolivars_dream:0 "实现玻利瓦尔的梦想"
NIC_realizing_bolivars_dream_desc:0 "玻利瓦尔当年在这个大陆上打了一辈子仗，最后看着自己解放的土地一块一块分裂成彼此猜忌的小国，咽不下一口气就走了。从大哥伦比亚解体到今天，一百多年过去了，我们这些说同一种语言、信同一种信仰、恨同一批欺压者的拉丁美洲人还在一盘散沙当中循环内耗。桑迪诺将军不只讲过尼加拉瓜的解放，他还讲过拉丁美洲必须联合。这不只是往酒杯里倒酒时的漂亮话——美国人今天在中美洲修基地，明天在南美扶持军政府，后天用贷款卡住任何又一个不听话的政府的脖子，要是我们不联起手来，最终只能一个个跪下。
从今天起，推动中美洲各国革命势力的协调，我们的目标是建立一个跨越国界的普世公社——没有边境关卡，没有关税壁垒，没有一个民族把另一个民族当廉价劳力。
玻利瓦尔临终前让人把他抬到海边，看着加勒比海说他听到了召唤。我们今天说我们也听到了召唤，就像拉美的人民望海潮而呼喊。"

NIC_morenos_branch:0 "莫雷诺的自由桑地诺主义"
NIC_morenos_branch_desc:0 "桑迪诺将军的旗帜并不认为凡事越激进越好。同理国有化不是越多越好，公社化也不是越彻底越正确。桑迪诺主义的精神是让尼加拉瓜人自己决定尼加拉瓜的事，是让农民有地种、工人有工做、孩子有学上，至于实现这些目标的手段，没有必要非把自己绑死在一条窄路上。我们要"自由的"桑迪诺主义——反帝的立场不松动，但国内事务上更务实包容，听得进去不同的意见：务使革命不吃人。"
NIC_new_revolution:0 "一场新的农民革命"
NIC_new_revolution_desc:0 "上一次革命把土地从庄园主手里夺过来了，但地分下去以后怎么经营、怎么贷款、怎么把收成运出去卖掉，这些配套的事情至今还没理清。
所以我们说，现在需要的是一场"新的农民革命"——不是再去打谁、去分谁，而是在现有土地格局上做一次大规模的制度改革。建立覆盖全国的农业合作社网络，让农民抱团对抗压价收购的中间商；设立低息农贷基金，让种地的人不用借高利贷买种子；把农业技术推广站从纸上搬到田头，教农民轮作、施肥、灌溉。上一次革命给了农民土地，这一次革命最好要让土地真的养得活人。"
NIC_peasants_above_all_else:0 "农业至上主义"
NIC_peasants_above_all_else_desc:0 "尼加拉瓜的肌肉使耕作的泥土。咖啡、棉花、甘蔗、玉米、豆子，这些是我们真正的本钱。不能拿农业当工业的输血包，不能压低粮价补贴工厂，不能把农民捆死在土地上给城市供血。一切经济政策的出发点先问一句：这对种地的人有没有利？我们把最好的人才、最大的财政投入、最优先的政策资源都倾斜给农业。把农村的基础设施修到位，让电通到每个种植区，把灌溉渠修到旱季也淌水，把公路修到能把收成在一夜之间运到最近的港口才好。"
NIC_anti_imperialism_without_radicalism:0 "去激进化的桑地诺反帝主义"
NIC_anti_imperialism_without_radicalism_desc:0 "反帝的旗帜、跟华盛顿打交道的时候挺直的腰杆子当然是必要的，但我们的手段可以更聪明：用不着每提一次美国就非得在措辞上把天都骂破。外资不是绝对不能引进，只要条件平等、和平外交，桑迪诺将军当年也谈判，也签过协议，他不是一根筋只知道打，防守态势也是一种选择。"
NIC_true_peasants_paradise:0 "打造真正的农民天堂"
NIC_true_peasants_paradise_desc:0 "革命许诺了那么多年，许诺了一个农民的天堂。现在该兑现它了。土地已经分过，接下来要做的是让每一块分了的地都不至于是白分。免除农民的一切不合理捐税负担，取消那些从前压在农民头上的苛捐杂税、中间盘剥和劳役残余。把国家财政里最大的一块放到农村去——建学校，让农民的孩子不用赤脚走三个小时山路去听课；建卫生所，让产妇不用在泥巴地上生孩子；打井，修水渠，通电。这就是"农民天堂"的衡量标准。"
NIC_sandinos_dream_through_diplomacy:0 "通过外交实现桑地诺的梦想"
NIC_sandinos_dream_through_diplomacy_desc:0 "桑迪诺将军梦想过中美洲的统一，梦想过拉丁美洲的团结。实现这个梦想不能只靠输出革命、等着别国自己变天。要好好搞外交，跟拉美各国谈一个以互相尊重为前提的泛美对话机制。中美洲几个小国现在是西方政客们眼中似乎是谁都可以来踩一脚的地方，我们要联合起来互相扶一把。桑迪诺的梦想可以不必再流一遍血，可以在谈判桌上一点点做出来，外交可以是另一种战斗。"
NIC_towards_sandinista_liberation_front:0 "组建桑地诺民族解放阵线"
NIC_towards_sandinista_liberation_front_desc:0 "各路左翼团体不能再各干各的了。国内的工会、学生会、农民协会、游击队的退伍老兵组织、知识分子社团和国外的兄弟政权们，大家目标总有一致。以前政出多门使得我们力气使不到一处。我们提议把这些分散的力量整合起来，组建一个统一战线性质的组织——桑迪诺民族解放阵线，加入阵线的各派别，国家保持自己的独立性，力求团结得力。"


NIC_military_control:0 "索摩查的个人游乐场"
NIC_military_control_desc:0 "中美洲现在是一整块了，从危地马拉的火山高原到巴拿马的丛林低地，所有的海关、兵营、铁路和电报局，都归一个姓氏管辖。我无所谓他们怎么说，我只知道现在这片地峡上每一个总统都是我签过字任命的，每一个师长都是我亲手提拔的。当年美国人在这片土地上画了五条边界线，现在那些线还在地图上，但是啊地图已经是归我印了。"
NIC_expand_guardia:0 "扩编国民警卫队"
NIC_expand_guardia_desc:0 "五个国家合并成一个，五个国家的反抗者也就合并成了一堆。光靠尼加拉瓜原来那点兵力根本罩不住从特古西加尔巴到圣何塞的整条补给线。扩编，立即扩编。征兵名额分摊到各省，军费要翻倍，军校从一年制拉到三年制。这支军队不止是维持治安的警棍，它得是一台能让任何动歪脑筋的人看见制服就腿软的机器。"
NIC_3_p_policy:0 "3P政策"
NIC_3_p_policy_desc:0 "给朋友银子，给冷漠的人棍棒，给敌人铅弹。"
NIC_ignore_corruption:0 "无视政府腐败"
NIC_ignore_corruption_desc:0 "查腐败是蠢人干的事。你查掉一个拿了回扣的军需官，明天整个后勤系统就跟你消极怠工。你清查一次财政，换来三年的行政半瘫痪。我不是不知道谁在偷，偷了多少。但只要他们办事，把该交的税交上来，把该杀的叛乱分子杀掉，我就不翻他们的账本。忠诚是有价的，腐败就是我默许他们自己给自己开的价码。这个价码比一场清洗便宜得多。"
NIC_general_pact:0 "与军方达成协议"
NIC_general_pact_desc:0 "穿军装的弟兄们要明白一件事：我们是一条船上的人。我给他们最好的装备、最高的薪水、最不受文官干涉的权力。作为交换，他们只需要做到不政变。我们的约定很简单——你们替我管好外面和下面，我替你们管好上面。任何试图破坏这个约定的人，不论军衔多高、资历多老，都是在破坏整个中美洲的稳定。"
NIC_monopolize_government:0 "垄断政府"
NIC_monopolize_government_desc:0 "政府里不需要太多的声音。一个声音就够了，清晰、明确、不会混淆。文官系统从上到下只服从一个命令来源。去掉了各派势力在政府中的拉扯，公文批得快，决议下得快，枪子出膛快。任何试图在政府内部建立独立势力的人，不管是什么部长还是什么顾问，都是在犯路线错误。"
NIC_militarize_public_services:0 "公共服务军事化"
NIC_militarize_public_services_desc:0 "铁路调度交给工兵，港口管理交给海军后勤，电报局划归通讯兵。公共服务不再是民政，是军政的延伸。平时看不出区别，一旦出了乱子，所有系统都能在六小时内从民用转为军用。效率也提高了——军人不敢迟到，不敢偷材料，军事法庭比民事法庭快得多。"
NIC_finish_sandinistas:0 "消灭桑地诺主义者"
NIC_finish_sandinistas_desc:0 "他们像蟑螂一样躲过了第一次清剿，缩在洪都拉斯的深山里，缩在萨尔瓦多的咖啡林里，缩在谁也记不住名字的峡谷村落里。这次他们没地方躲了。中美洲每个省都在我们手里，从墨西哥边境到哥伦比亚边境，没有一寸地不在巡逻队的覆盖下。这次已经是打扫残余，以后不要再有了。"
NIC_construct_public_buildings:0 "兴建公共建筑"
NIC_construct_public_buildings_desc:0 "权力要被人看见。水泥和钢铁就是看得见的权力。在马那瓜建新总统府、阅兵大道、中美洲议会大厦、军事博物馆。我想让每个走进首都的人，在仰头看这些建筑时，都会从脊椎骨的末端升起一种敬畏——对一座房子的敬畏，对能建起这座房子的人的敬畏。建筑不讲话就能让所有人闭上一会儿嘴。"
NIC_sham_elections_question:0 "'选举'问题"
NIC_sham_elections_question_desc:0 "选举还是要搞的，毕竟美国人爱看，报纸也爱报。选票印好，投票站设好，选民动员好，结果提前写好。每四年一次，每次我都能拿到百分之八十几的票，反对党拿到刚好够让他们觉得自己在参加民主但永远翻不了盘的那几个议席。如果哪次选举出了意外只能说明准备工作没做足，下次会加强回来的。"
NIC_support_from_vargas:0 "利用保守派支持"
NIC_support_from_vargas_desc:0 "保守派这帮人最好哄。他们相信秩序、家庭、传统，我们就给他们这些。让他们在报纸上写社论论证我的统治是天主意志的体现，让他们在乡村教堂里告诉农民好基督徒不该造反。我不需要真心信他们那一套，但他们那一套可以帮我省下好几营的兵力，多管用啊。"
NIC_clear_line_succession:0 "明确的继承路线"
NIC_clear_line_succession_desc:0 "我活不了两百年。索摩查家族必须活过去。大儿子接管国民警卫队，小儿子接管文官系统，女婿管财政。三个人各有一块，合起来还是姓索摩查。那些盼着我死后大乱的人趁早死心。权力不在一个人的命上挂着，要在一个家族的骨血上永世流淌。继承路线在活着时订好，死的时候就不用担心有人抢了。"
NIC_buddy_up_america:0 "与美国交好"
NIC_buddy_up_america_desc:0 "华盛顿的人换了一茬又一茬，但白宫里始终坐着同一类人：这些政商精英务实怕麻烦，喜欢稳定的生意环境。我就给他们稳定的生意环境，中美洲的香蕉、咖啡、矿产继续往北流，美国公司的合同不受任何革命和暴乱的影响。作为交换，他们继续在国际舞台上替我的政权挡掉那些“谴责”和“制裁”。他们还可以多给一点军事援助，反正那点钱对他们来说是找零头，对我就是正经家底了。"
NIC_foster_nicaraguan_patriotism:0 "不乏尼加拉瓜爱国者"
NIC_foster_nicaraguan_patriotism_desc:0 "统一中美洲，靠的不是尼加拉瓜人比别人多，而是尼加拉瓜人比别的中美洲人有胆识和手腕。我的军官团里大半是尼加拉瓜人，各省主要岗位尽量安排尼加拉瓜籍。他们是我最信得过的底牌。爱国者从来不缺，只是要有一个能让他们在国家机器里站到高处的领导人。我给了他们梯子，他们就要回报我以忠诚。这笔交易对谁都不亏。"
NIC_guide_central_american_golden_age:0 "引领中美洲黄金时代"
NIC_guide_central_american_golden_age_desc:0 "打仗的日子过去了。现在要搞建设：港口吞吐量翻倍，咖啡出口创纪录，铁路通车里程每年往上跳……历史书上会把这段时期叫做“索摩查时代的黄金岁月”。只要每一年的经济数字比前一年好看，每一个外国记者来采访说我是“地峡的稳定者”，这段话就算写成了。"
NIC_chief_of_central_america:0 "索摩查，中美洲之首"
NIC_chief_of_central_america_desc:0 "五个国家的版图上的缝合上了。从太平洋到加勒比海，从现在起只有一个元首，就叫中美洲之首。当初那些讥讽我的人，有的埋在无名墓里，有的在边境另一端流亡。而我在这里，站在中美洲最高的阳台上，没人再敢跟我讲价钱。"



NIC_with_somoza_forever:0 "与索摩查永远同在"
NIC_with_somoza_forever_desc:0 "塔乔·索摩查·加西亚死了。这个消息从中美洲之首的卧室传出来，穿过总统府的走廊，穿过国民警卫队的兵营，穿过五个前首都的每一条大街，所有听见的人都先沉默了几秒。有人沉默是因为恐惧——靠山倒了，接下来会怎样。有人沉默是因为盘算——位子空出来了，该谁坐？我们不需要空洞的悼词，塔乔不需要眼泪，他需要一个继承人了。"

NIC_her_majesty_lilian:0 "莉莉安女王陛下"
NIC_her_majesty_lilian_desc:0 "塔乔的女儿从来不觉得自己只是“总统的小女儿”。她读欧洲史比读美洲史多，读王室传记比读政党纲领多。她看着父亲的统治方式，觉得有一个致命的缺陷——共和国总统这个头衔太临时了，太让别人觉得有机可乘。她要换一个头衔。不是第一夫人，不是女总统，是女王。莉莉安一世，中美洲的女王！利利安·索摩查。"
NIC_queen_of_the_army:0 "军队女王"
NIC_queen_of_the_army_desc:0 "莉莉安一世对军队的掌控方式在于她懂得军队要什么——体面、荣誉、不受文官掣肘。她把国民警卫队改编为王家军队，授给每一支部队写着拉丁文箴言的军旗，恢复阅兵、军乐团和贵族化的军官礼服。军队因此不用再跟政客勾心斗角，他们只要效忠女王一个人。女王穿着军装骑在马上从阅兵队列前走过时，整个兵营都是她的。"
NIC_imitate_european_quote_monarchies:0 "效仿欧洲君主制"
NIC_imitate_european_quote_monarchies_desc:0 "中美洲不需要发明新制度。欧洲君主制已经运转了几百年，有全套的礼法、继承规则、宫廷结构可以借鉴。引入欧洲礼仪顾问团，重建总统府为王家宫廷，设立贵族等级，给军政要员授封，把统治包装成一种永恒的传统而非纯粹暴力的延续。"

NIC_idealize_tacho:0 "理想化塔乔"
NIC_idealize_tacho_desc:0 "父亲活着的时候是独裁者。死了后我们要把他变成国父。重新编撰塔乔·索摩查的传记，删掉所有不利的细节，补上他年轻时在运动场上的照片、他在阅兵台上向士兵还礼的侧影、他在议会演讲时攥紧的拳头。全国每一间公立学校发统一印制的画像“中美洲之父”。他在世时人们怕他，死后的任务是让人们爱他。恐惧维系一时，崇拜维系长久。"

NIC_true_heir:0 "索摩查的真正继承人"
NIC_true_heir_desc:0 "路易斯·索摩查·德瓦伊莱，塔乔的长子，从小就坐在父亲右手边——阅兵时在右，会议时在右，午餐桌上永远正对父亲的右边座位。他穿西装的样子比他父亲更像律师，像是精于计算的那种人。兄弟里也有想争的，军头里有想试探的，他一律不拿正眼看。"
NIC_nicaraguan_bias:0 "优先考虑尼加拉瓜领土"
NIC_nicaraguan_bias_desc:0 "中美洲很大，但只有尼加拉瓜是老家。五个省里，尼加拉瓜省排第一。财政拨款先给尼加拉瓜修路架桥，军官晋升优先考虑尼加拉瓜籍，政府职位核心圈全由尼加拉瓜人占据。尼加拉瓜就是中美洲的中枢，其余的只能是四肢。"
NIC_luv_homeland:0 "为了索摩查，为了我们的祖国"
NIC_luv_homeland_desc:0 "我们不为任何抽象的理念效力，我们效力于一个姓氏和一块版图。姓氏是索摩查，版图是尼加拉瓜。这两样东西但凡在，我们就有方向。两样东西少一样，我们就要散了。这是小索摩查给他麾下所有军官和文官定下的唯一忠诚标准。"

NIC_status_quo:0 "现状派候选人"
NIC_status_quo_desc:0 "阿贝拉多·夸德拉不是索摩查家族的人，他是索摩查家族最放心的外人。他在外交场合替塔乔端了几十年的酒杯。现在家族内部需要平衡，需要一个各方都能接受的过渡人物，夸德拉就是这个人。"
NIC_slight_liberalization:0 "温和自由化"
NIC_slight_liberalization_desc:0 "打开几扇窗户透透气。
允许报纸在社论里用稍微尖锐一点的措辞批评某些部长的无能，但不可以批评体制。
允许大学教授在课堂上讨论某些“禁忌”话题，但课后不要上街。
允许反对派在议会里多占几个席位，席位的上限……当然，还是我们来决定。"

NIC_unchained_puppet:0 "挣脱束缚的傀儡"
NIC_unchained_puppet_desc:0 "莱奥纳多·阿奎略·巴雷托被索摩查生前指定为傀儡总统，所有人都觉得他就是摆在总统府里的一盆不会说话的植物。但现在是他在那个桌子后面坐着，而索摩查在坟墓里躺着。他环顾办公室，发现那些曾经半夜打电话来下命令的人突然没有号码可拨了。这或许是几十年来唯一一次真正的机会。
傀儡的绳索在塔乔咽气的那一秒钟恐怕已经断了。"
NIC_pardon_democrats:0 "赦免剩余民主派"
NIC_pardon_democrats_desc:0 "监狱里还关着上一轮清洗剩下的民主派人士，他们的罪名大多是“非法组党”“煽动颠覆”“出版不实言论”。巴雷托签署特赦令，打开牢门，用救护车把他们接出来，安置进政府提供的住所——是政治需要新鲜血液，而流亡者和囚犯是唯一没有被索摩查体系收编的活人。"
NIC_destroy_guardia:0 "摧毁国民警卫队"
NIC_destroy_guardia_desc:0 "国民警卫队是索摩查家族刺进这个国家脊椎骨里的那根钢针。不拔掉它的话，任何民主化都是纸上谈兵。巴雷托在军方内部秘密联络不满索摩查家族的中层军官，在同一时间对各处军营和指挥部实施控制，逮捕效忠索摩查家族的高级将领，解散政治警察部门。
整个行动要在一夜之间完成，天亮时，国民警卫队的番号将从政府备案里永久注销。"
NIC_democratic_restoration:0 "民主恢复"
NIC_democratic_restoration_desc:0 "军队回到了兵营，政党回到了街头，报纸回到了自由的报摊。
我们制定了新选举法，释放了所有政治犯，邀请国际观察员监督下一次大选。民主不是因为巴雷托一个人的良心发现而恢复的，是因为索摩查死了，而他的继承人还没来得及把枪攥紧。
窗口期不会很长，必须在下一双手伸过来之前把制度钉死。
最好，最好是给这个国家有一口宝贵的喘息之机……"

NIC_democratic_syndie_win:0 "民主工团主义者胜利"
NIC_democratic_syndie_win_desc:0 "我们赢了。靠着千千万万把工会的旗帜从车间的墙上取下来扛到街垒上去的人。码头工人停了美国货轮，铁路工人断了军火线，种植园的雇农把砍甘蔗的刀换成了步枪。这场胜利属于每一个在集会上举过手、在罢工中饿过肚子、在巷战的夜晚没有后退一步的普通人。从今天起，尼加拉瓜的政治不再是一小撮人在客厅里分蛋糕，而是每一个劳动者都有权站在决定自己命运的桌前。"
NIC_begin_fight_for_community_and_nation:0 "开启为社群与国家的斗争"
NIC_begin_fight_for_community_and_nation_desc:0 "以往的战斗不过是序章。接下来的斗争不在战场上，在每厂房、种植园和渔村码头。我们要建立一种新的生活方式——社群自己管理自己的事务，国家不再是压在头上的重担，而是协调各社群共同利益的平台。这场斗争没有终场哨，它将在每一次车间全体会议上延续，在每一次社区投票中延续，在每一个劳动者拒绝被当成商品的日子里延续。拿起工具就是拿起武器，工作本身即是战斗。"
NIC_reconcile_communists_and_democrats:0 "与共产主义者及民主派和解"
NIC_reconcile_communists_and_democrats_desc:0 "战争的硝烟散去，我们才发现自己敌人太多、朋友太少。共产主义者跟我们吵过，民主派跟我们骂过，但说到底，谁都反对过军政独裁和帝国主义，谁都不想让美国人再回来。既然现在不是翻旧账的时候。派代表去跟那些流亡在外的民主派谈，去跟躲在山里的共产党游击队谈。只要接受工团主义的基本框架——工人自治、分权管理、反帝立场——那么以前的恩怨可以翻篇。"
NIC_solidarity_across_centroamerica:0 "中美洲团结一心"
NIC_solidarity_across_centroamerica_desc:0 "中美洲现在是一个整体了，但统一不是在地图上把几条边界线擦掉就算数。危地马拉的高原印第安人跟洪都拉斯的香蕉种植园工人之间隔着几百年的隔阂，萨尔瓦多的城市工会跟哥斯达黎加的农民合作社彼此基本是不熟悉。统一不靠口号粘合，而是靠具体的合作：统一交通网络，互认各地区的工会会籍，协调作物种植品类免于内部互相压价竞争。中美洲不是好几个个国家，是一个国家里的几个省份，我们早该这么看待彼此了。"
NIC_end_poor_exploitation:0 "终结对贫民的剥削"
NIC_end_poor_exploitation_desc:0 "贫民窟不是自然现象，是资本主义制造出来的。有人在交易所里倒卖咖啡期货，就有人在铁皮棚子里喝不上干净水。我们要从根子上断掉剥削的链条。城市贫民住的违章棚户区，通水通电，铺路修排水沟，把产权交到住户手上。沿街叫卖的摊贩不再被警察追着跑来跑去，公共场所依法设立免费摊位。流浪儿童由国家抚育，不再让他们在垃圾堆里跟野狗抢食……衡量社会进步的尺子就是我们怎么对待我们国家最没有门路自保的人。"
NIC_syndicalist_humanitarianism:0 "工团主义人道精神"
NIC_syndicalist_humanitarianism_desc:0 "我们搞革命不是为了制造新的受害者，哪怕是对昨天的敌人。俘虏的军官经过审判按罪行判，不搞株连，不搞游行羞辱。旧政府的低级文职公务员，只要没有血债，尝试保留工作让其自新。没收的大庄园土地分给雇农，但给那些没做过坏事的庄园主留一小块自耕地和一间住得下家人的房子。革命者要有革命的自信——不靠单调乏味的恐怖维系统治，只要让所有人包括从前的敌人都不得不承认，这帮人做事的确比旧政权讲道理。"
NIC_appease_peasants_and_farmers:0 "安抚农村民众"
NIC_appease_peasants_and_farmers_desc:0 "工团主义在城市扎根深，在农村还是一片空白。农民不信任说漂亮话的人——这些人见得多了，每次革命都许诺土地，兑现的没有几个。现在我们要拿出实际行动：派工程队下乡打井、修灌渠、架电线，派流动医疗车巡回各村庄，把农业税的起征点定在一个合理水平，让农民先看到生活有在变好，再来跟我们讨论什么叫工团主义。"
NIC_set_foundations_for_new_unionization:0 "为新工会化奠定基础"
NIC_set_foundations_for_new_unionization_desc:0 "旧式工会搞的那一套不够用了。过去工会替工人跟老板讨价还价，争工资争工时，现在老板没了，工厂归工人自己管，工会的角色只能跟着变。新工会不只是交涉代表，要变成生产的组织者、技术的培训者、社区的服务者。建立工会主导的技工学校和职业介绍所，工会经营社区食堂和子弟托儿所。一个工人从进厂到退休，一生都跟工会产生联系。"
NIC_towards_decentralization:0 "分权化计划"
NIC_towards_decentralization_desc:0 "中美洲统一以后，权力不能再全堆在首都。我们按产业地理分布来规划经济区——尼加拉瓜湖区搞农业加工，洪都拉斯北部搞港口转运，萨尔瓦多中部搞轻工制造……每个区由当地工会联合会和社区代表联席会议自主管理日常经济决策。中央只保留外交、国防、货币和跨区域协调的职能。权力离得越近，用得越准，因地制宜，明然此理。"
NIC_centroamerican_and_revolutionary_spirit:0 "中美洲革命精神"
NIC_centroamerican_and_revolutionary_spirit_desc:0 "加勒比海的风吹过殖民者的帆船，吹过联合果品公司的香蕉船，吹过反抗者的旗帜。
几百年就这么过去了。
这片土地上从来不缺少反抗：从印第安人抵抗西班牙人到莫拉桑为联邦而战，从桑迪诺在山里打游击到码头工人拒绝给美国军舰卸货。现在轮到我们继承这股风气。中美洲的革命精神从博物馆里的标本里活过来了，每一个相望革命与未来之人倍受鼓舞。"
NIC_never_another_bourgeois_state:0 "绝不再建资产阶级国家"
NIC_never_another_bourgeois_state_desc:0 "旧国家的每一个零件都是为少数人定制的。
议会？庄园主出钱买议席，律师替他们起草法案。
法院？法官跟土地寡头吃同一桌饭，雇农告地主从来告不赢。
学校？穷人的孩子在教室里背课文，背完了还是回地里干活，
什么都没改变。
我们要拆了这整台机器重新造。立法权归各产业工会联合会，行政权受地方委员会监督，法官由同业评议推选。资产阶级民主是隔几年在两张同样代表有钱人的选票之间画个勾，我们不要这种劣质的假货。"
NIC_look_to_socialist_bretheren:0 "携手社会主义兄弟"
NIC_look_to_socialist_bretheren_desc:0 "加入工团国际不是赶时髦，是走亲戚。英法工人阶级在跟我们做类似的事，只不过他们换掉的是资历更老的本国资产阶级。我们加入进去学习他们的工厂自治经验，学习他们的合作社法律制度，也把我们中美洲的革命经历讲给他们听，如同兄弟们互通有无。尼加拉瓜虽小，但中美洲统一以后就不小了，我们有资格坐在那张大家庭的桌子边上。"
NIC_improve_country_social_conditions:0 "改善国家社会状况"
NIC_improve_country_social_conditions_desc:0 "说一千道一万，老百姓要从革命里看到实惠。街道上的垃圾清干净，公共交通别老是趴窝，警察别在街上勒索小贩，医院里不要缺了抗生素，学校里别让老师半年领不到工资。革命的口碑就是靠这些不惊天动地的细碎事情攒将起来。成立专门的市政督办委员会，公开受理投诉，限期解决问题，处理结果贴在广场上让所有人看。"
NIC_model_question:0 "工团主义模式之问"
NIC_model_question_desc:0 "军工生产怎么搞，我们不能闭着眼睛硬上。战争教会我们一件事：枪支弹药不能永远靠缴获，飞机大炮不能永远靠走私。但建设军工不能走国家资本主义的老路——建一个由中央官僚遥控、工人拿死工资、管理层脱离生产的巨型兵工厂，那无疑是变相恢复了剥削。我们要找自己的路：军工企业由各相关产业工会联合共治，利润不归私人股东也不全上缴国库，一部分用于工人福利，一部分投回技术研发。国防需要的纪律不意味着就要取消车间民主。"
NIC_fight_imperialist_influences:0 "抗击帝国主义影响"
NIC_fight_imperialist_influences_desc:0 "革命成功了，可美国人不会就此罢休的。不派海军陆战队来，就是派说客来；不搞军事政变，就是搞经济封锁。我们必须顶住。审查外国公司的经营合同，凡是附带不平等条款的统统废除。外国文化产品——电影、广播、报纸——不能让它们无限制地涌入取代本地文化。建立中美洲自己的新闻社和广播网，向人民讲自己的故事。尊严不光是表面政治，还要深入思想文化界。"
NIC_true_socialist_democracy_cemented:0 "真正的社会主义民主得以巩固"
NIC_true_socialist_democracy_cemented_desc:0 "我们走到今天这一步不容易。从起义到今天，每一步都是踩着碎玻璃过来的。现在我们要沉下心把制度夯实。工会的选举要真正开放竞争，地方委员会的会议对任何愿意旁听的人敞开，预算公开到每一项支出都能被查账。
真正的民主不会由一场热闹就散伙，是日复一日笨拙、琐碎、有时让人疲惫不得的实践。我们要让后代子子孙孙习惯这种生活，习惯自己做自己的主。
到那一天，革命才能算作是真正完成了。"
NIC_take_centralamerica:0 "夺取中美洲"
NIC_take_centralamerica_desc:0 "尼加拉瓜装不下我们的野心。我们要的是整个地峡——从危地马拉的火山湖泊到巴拿马的热带丛林，每一座海关、每一个兵营、每一条铁路。"
NIC_end_mexico:0 "摧毁墨西哥"
NIC_end_mexico_desc:0 "我们将从地峡向北推，在墨西哥高原上插旗——一场让墨西哥人永远忘不掉自己有几斤几两的全面战争。战后的墨西哥要裁军、割地、赔款，宪法重写，政府重组，并且永久放弃对中美洲任何事务的发言权。"
NIC_reclaim_america:0 "夺回美利坚"
NIC_reclaim_america_desc:0 "大萧条撕碎了合众国，工团主义者在旧工厂的烟囱上挂起了代表另一面旗帜的破布，华盛顿沦陷在一片连我们这些远离本土的人都难以辨认的混乱里。但合众国的法统没有死，它就尼加拉瓜！我们从地峡征兵，拿运河的未来收益做抵押发行战争公债，用甘蔗园和咖啡种植园的利润买钢铁。政府不再是一个临时看守机构，它是合众国的一支继承者——一支从海外殖民地起兵讨伐本土的远征军，我们将北上收复本土。华盛顿、费城、波士顿，那些被隔绝许久的城市还在等着真正的美国国旗重新升起。"
NIC_tyanny_has_ended:0 "暴政已然终结！"
NIC_tyanny_has_ended_desc:0 "他死了！那个坐在总统府最深处的房间里、用电话线和军靴织成一张网把整个中美洲裹在里面的那个人死了。
他的脉搏一停下来，千千万万颗被他踩在脚底下的心脏突然重新开始跳动。我们等这一天等了太多年，等到有些同志的白发从鬓角蔓延到整个头顶，等到有些同志没能等到。
现在消息从首都传出来，穿过每一个被国民警卫队搜刮过的村庄，穿过每一间曾经半夜被踹开过房门的工人宿舍，穿过每一片替索摩查家族种了一辈子咖啡自己却喝不上一口热糖水的种植园。消息传到哪里，哪里就有人在黑暗中攥紧了拳头，牙齿咬得咯咯响。
暴政不会自然凋零，而最终将被我们这些不肯下跪的人一点一点啃塌。
我们迈向不可逆的胜利……"
NIC_reactionaries_no_escape:0 "反动派无处可逃"
NIC_reactionaries_no_escape_desc:0 "索摩查咽气后，他们慌得像被掀开了石头的蜈蚣巢。大儿子试图接管国民警卫队，二儿子试图烧毁财务档案，女婿提着装满金条的手提箱往机场跑，那些曾经在审讯室里笑者抽雪茄烟的特务头子现在摘下肩章换上便服试图混进平民堆里。他们以为脱了制服就没人认得出他们了……可是每一双被他们踩过的眼睛都记得那些不同的脸。每一间被他们搜刮干净的屋子都留着他们名字的档案。每一颗在无名墓里烂掉的牙齿与头颅都等着指认凶手。工厂工人组成纠察队封锁出城路口，码头工人拒绝启动任何一艘没有经过革命委员会检查的船。曾经的索摩查党羽们连一只脚都踏不出这个正在燃烧的旧世界，只有束手就擒。
£R便教他们埋葬，与那肮脏的旧世界永远留在一起。§!"
NIC_socialism_rebirth:0 "重建社会主义"
NIC_socialism_rebirth_desc:0 "暴政的瓦砾堆里有一种比复仇更持久的东西，正在发出细微的光——一种更粗粝的东西，带着机油味和刚翻开的泥土味。铁路工人带着他们的工会印章走进运输部的废墟，把文件柜里的旧政令倒出来，在背面画新的调度图。种植园的雇农把大庄园的铁门卸下来熔成犁头，在地契上盖上革命委员会的印章，将田地重新丈量，将旧债一笔勾销。医院里的护士和实习医生在走廊上开会，讨论怎么在没有院长签字的情况下让药品仓库的门向穷人打开。
我们没有等任何人的许可，我们就在保证的废墟里，要亲手重建我们失去的世界。
车间工会在决定生产计划，乡村委员会在分配水源和种子，那些刚刚刷掉旧标语的墙上都湿漉漉地映着炉火和电焊的闪光。中美洲的赤道阳光本来是用来催熟出口咖啡的，从今以后阳光下的劳动只属于劳动者自己。
旧世界已经燃尽，我们笑到：我们同样善于创造新世界。"
NIC_american_commonwealth:0 "美利坚联邦"
NIC_american_commonwealth_desc:0 "我们为革命抛头颅洒热血，并不是为了迎来新的暴政。我们在制宪会议上得到的巨大支持表明，我们的新政府体制将会以自由意志社会主义为核心构建！我们将会实现贝拉米的民族主义梦想，创建一个能保障我国所有工人和劳动者社会自由和经济自由的新未来！"
NIC_protect_the_working_class:0 "保卫工人阶级"
NIC_protect_the_working_class_desc:0 "尽管在美国有许多关于建立一个更好的经济系统的新思想，但内战的动荡使得进行实践是一项非常困难的工作。但现在，我们已经有充足的时机和机会来通过保障工人权利的宪法修正案，以此来实现工人民主！"
NIC_empower_councils:0 "城镇民主"
NIC_empower_councils_desc:0 "新的联邦将不会通过专制手段建立。我们必须为我们的民主建立更完善的体制。通过法律授予基层参与政治决策和在市政厅集会的权力，政治决策将不再是来自国会山的遥远杂音，而是工人们的权力！"
NIC_mutal_economic_comitee:0 "职业工会委员会"
NIC_mutal_economic_comitee_desc:0 "改革资本主义制度将会是一项艰巨的任务，仅是国家配额和经济计划是远远不够的。代表大会已经开始在地方任命职业工会代表，以帮助我们在保护美国的职业工人不失业的同时决定经济发展的最佳方案。"
NIC_councilism:0 "委员会主义"
NIC_councilism_desc:0 "维持旧的美国官僚系统是毫无意义的，因为它长期以来一直受到反动的思想和政策影响。职业工会和产业工会之间的妥协之一是引入分散的工人委员会。这些委员会将允许各州给予工会更多自由的组织形式。"
NIC_federalism:0 "劳联派"
NIC_federalism_desc:0 "尽管旧合众国的政治体系催生了政治腐败，低效的官僚主义和对选举的操纵，但其行政体系仍然是我们国家认同的不可动摇的基石。工会主义与激进思想间绝无妥协的可能，我们必须像第一次美国革命的先烈们一般依赖这一基石。"
NIC_a_happy_worker:0 "心满意足、多产勤劳的工人队伍"
NIC_unite_unskilled_labour_in_flus:0 "以劳联工会团结非熟练工人"
NIC_unite_unskilled_labour_in_flus_desc:0 "在我们胜选后，迅速组织美国劳动力的重任便落在了我们肩头。传统的职业工会倒没什么问题，主要的问题出在产业工会身上。长久以来，职业工会一直对产业工会主义抵触不已，产业工会联合会也因此分裂。无论如何，我们是该把这些部门整合起来了。为了实现这一目标，联邦各工会已准备保持中立，既恪守原则，亦不让工人蒙受激进分子的蒙蔽。"
NIC_nation_united_in_brotherhoods_guilds_and_unions:0 "团结在兄弟会、行会和工会之中"
NIC_nation_united_in_brotherhoods_guilds_and_unions_desc:0 "一个大工会主义的钢铁锁链必然会在其自身专制与世界产业工人联盟的重压下分崩离析。组成我们工会的各个团体依靠脆弱的联邦制度纽带联系在一起，各个行业也都拥有足够的自主权，能够按照自身需要组织起来。不同行会、产业组织与工会之间的联系铸就了我们伟大的联盟，唯有依靠战争与对集体谈判的共同承诺方可筑牢这一联系。"
NIC_resolve_bscp_and_wtul_pressure:0 "消解卧车搬运工兄弟会与妇女工会联盟的压力"
NIC_resolve_bscp_and_wtul_pressure_desc:0 "内战期间，海伍德所领导的美利坚社会党放任妇女与黑人工人进入劳动力市场和军队，亦未施加任何限制。如今，工人已从前线解甲归田，美利坚劳工联合会也面临着一个问题：如何解决那些自工会主义在这片土地上诞生之日起就被排除在主流职业工会组织之外的有组织劳动力？"
NIC_business_unionism_enforced_by_delegates:0 "由代表强推的商业工会主义"
NIC_business_unionism_enforced_by_delegates_desc:0 "联合工团中的许多人对“商业工会主义”不屑一顾，斥之为对革命的背叛。但他们根本没有意识到，资本主义在美国已有两百余年的历史，在向社会主义过渡时，我们需要一种中间的经济形式。因此，代表大会决定终结海伍德时期实施的国家物价管制。"
NIC_syndicalism_without_radicalism:0 "工会政治去激进化"
NIC_syndicalism_without_radicalism_desc:0 "自从第一次担任国际妇女服装工人联盟主管以来，杜宾斯基就一直在与激进派浪潮作斗争。如今身为新总统，他正面临着前所未有的、崭新且艰巨的挑战。渗透分子已被开除，劳联的进步均势永不会被外部影响打破。"
NIC_labour_rewards_its_friends:0 "劳工有恩必报"
NIC_labour_rewards_its_friends_desc:0 "“劳工必须团结一心——有恩报恩，有仇必报。”刘易斯以其在解决争端方面的坚定立场而闻名，他曾在谈判期间扣留了全国的煤炭供应。为了保证产业工会维持其对旧职业工会的统治地位，刘易斯将采取软硬兼施的手段。"
NIC_maintain_craft_union_primacy:0 "维持职业工会的首要地位"
NIC_maintain_craft_union_primacy_desc:0 "虽然格林总统自己也抱有顾虑，但美利坚劳工联合会毕竟是建立在职业工会主义原则的基础上的。我们虽然还会出台一些安抚产业工会联合会以及新注册的联邦工会的措施，例如允许他们投票，但我们绝不会背离我们的路线原则。职业工会依旧掌握行政大权。"
NIC_establish_jurisdiction_departments:0 "设立司法部门"
NIC_establish_jurisdiction_departments_desc:0 "大批大批的工会侵犯骚扰着我们的下属机构，各路激进分子也正试图争取国内工人，进而形成自己的基础盘。无论他们是劳联内部的敌对工会还是激进分子的工会，这种状况都不能再继续下去了。劳联下属机构将不再被允许以除籍为由侵犯骚扰其他机构，为了确定哪个工会对特定工作场所拥有权利，相关司法部门亦将被设立。"
NIC_nationalize_public_utilities:0 "公共设施国有化"
NIC_nationalize_public_utilities_desc:0 "在很长一段时间里，公营企业在美国都是被避之不谈的话题，因为我国无数的前总统更愿意对大企业的利益而非选民的利益俯首贴耳。现在，我们已然打破了公司的枷锁，代表大会终于能大规模推行公有制，国有化关键设施及相关企业，创立公有企业了。罗斯福主义与保护主义者不过是我们前进路上的绊脚石！"
NIC_protectionism_for_the_american_labourer:0 "美国劳工的保护主义"
NIC_protectionism_for_the_american_labourer_desc:0 "专业工人委员会得出结论，对美国商品采取保护主义政策是必要的，但我们不会像从前的《斯穆特-霍利关税法》那样过分。我们将采取更加温和的做法，为纯本土运营工会加大税收减免力度，并着力宣传“购买美国货”。"
NIC_gompers_legacy:0 "发扬冈珀斯遗产"
NIC_gompers_legacy_desc:0 "冈珀斯的理念深植于劳工权利与联邦制原则，对当代治理仍有其影响，亦为我们应对世界产业工人联盟的弊政等挑战提供了启示。当我们应对错综复杂的社会问题时，他的思想遗产便是我们的指路明灯。我们将让他扬名于社会，凸显其理论重要性、以及对我们集体意识的深刻影响。"
NIC_foster_moderate_support:0 "争取温和派支持"
NIC_foster_moderate_support_desc:0 "政治上的温和派依旧对我们的联邦心怀戒心，他们坚信社会主义者是来剥夺破坏他们的权利的。我们得让他们放下心来，知道我们无意侵害他们。我们将赦免一批被赤卫队错拘错捕、无辜下放的无害温和派，再以劳联坚决反对集体工团主义和激进无政府主义理念的承诺安抚他们。"
NIC_the_closed_shop:0 "强制闭门经营"
NIC_the_closed_shop_desc:0 "旧资本家愚蠢而贪婪地认为，他们可以简简单单地每天付给工人一毛钱，同时取缔不知道从哪冒出来的工会。这种情况再无重演之日，因为所有入职上市大企业、公有企业或者发展势头正盛的零星工人合作社的工人都必须同时加入工会，雇佣非工会工人亦视同非法行为。我们也将与工会合作，确保工人能轻松地加入工会。"
NIC_publicly_guided_investment:0 "推广工会银行"
NIC_publicly_guided_investment_desc:0 "资本投资着重从工业和农业中获取资本商品，而这是政府更应直接介入的领域，尤其是在我们的高税率和对资本家的控制之下。在财政部接手后，投资、进口和各项研究都应有助于这一目标的实现。我们要扩大目前的工会所有制银行，如西德尼·希尔曼的联合银行，以此确保大萧条永远不会重演。"
NIC_distribute_union_media:0 "扩充美国劳联派队伍"
NIC_distribute_union_media_desc:0 "《费城警钟报》、《哈弗希尔劳工报》、《布鲁克林劳工报》、《丹佛劳工问询报》和《前锋报》等报纸如今赚得盆满钵满。许多特许工会都开设了自己的大众传媒公司。既然我们能向全国人民发出声音，我们就要用它来保卫国家利益。我们需要提醒美国人民，我们和他们都是爱国者，也都愿意保卫自己的国家！募兵运动将强调军队与身为典型的亲美工会的作用。"
NIC_protect_the_workers_right_to_drink:0 "保卫工人饮酒权"
NIC_protect_the_workers_right_to_drink_desc:0 "以进步主义面目示人的禁酒运动一直在损害着工人的利益，调酒酿酒成了罪名，犯罪现象有增无减。它还侵犯了基本自由，剥夺了个人饮酒的权利。我们是该在全国范围内废除这些过时的法律，恢复个人自由与工人的权利，将其邪恶的触手从地方和各州的执法中彻底斩断。"
NIC_democracy_rights_trade_unionism:0 "人权与工会主义"
NIC_democracy_rights_trade_unionism_desc:0 "火炬代代相传，新一代人执掌起了工会。他们是在大萧条时期与民权运动不懈奋斗中的老兵，他们便是新美国的青年精神活生生的体现。在风云诡谲的政治格局与革命性的民权运动中，工会面临着新的挑战，但他们泰然自若，时刻准备迎接艰难险阻。"
NIC_dye_red_the_bonus_army:0 "染红酬恤金军团"
NIC_dye_red_the_bonus_army_desc:0 "沃尔特斯向来不甚关心政治，却又受其工人阶级背景的影响，身为一名联合工团的战争英雄与将军而闻名于世。现在，他被选为以中左翼立场为基础的工会代表，亦得到了老兵和中间派的支持，同时坚持以工会为基础的政治纲领。"
NIC_union_pride_union_power:0 "工会骄傲，工会之力"
NIC_union_pride_union_power_desc:0 "美国摒弃了过往的激进主义，开辟了一条崭新的道路。它深深植根于建设国家的工会传统之中，如今更以工业中心之面貌面向世人。在战争的创伤在中，一种新的社会契约在各阶级之间形成了。道阻且坚，结果一目了然，对匮乏的恐惧已不再萦绕在美国人的脑海之中。"
NIC_broad_appeals_to_the_lost_generation:0 "大力吸引迷惘一代"
NIC_broad_appeals_to_the_lost_generation_desc:0 "欧内斯特·米勒·海明威出人意料地当选为工会主席，这标志着工会向大众政治基础的一大转变。海明威虽是一名母庸质疑的社会主义者，但他早已超脱于单纯的政治标签之外，成为了内战之中迷惘一代的文化精要的生动体现。粗犷而阳刚的个人主义与家长式社会主义处处交融展露于其作品乃至理想之中，这也激起了老一辈的深切共鸣，为其赢得了广泛支持。"
NIC_incumbent_stays_the_course:0 "在任者不易其位"
NIC_incumbent_stays_the_course_desc:0 "考虑到我方工会的政坛常青树地位和总统的人望程度，我们实在没必要选一个新人上位。虽然并无总统连任超过两届的先例，但哪怕在反动的旧共和国，这也是合法的。人民的意志便是我们工会的根基支柱，依靠着他们的支持，总统将再执政四年，进一步巩固其对工会主义的愿景。"
 NIC_social_moderation:0 "社会爱国主义"
 NIC_social_moderation_desc:0 "尽管阶级显然是个人生活中最重要的部分，但我们不能忘记：我们也是美国人——这是把我们联系在一起的东西。我们必须展现自己的善意，并向非极端主义的政治对手保证，只要他们不加以反对我们的革命，他们就不会被监禁。"
 NIC_butlers_doctrine:0 "巴特勒学说"
 NIC_butlers_doctrine_desc:0 "在社会爱国主义者的支持下，斯梅德利·巴特勒被任命为军队领袖，他致力于建立一种更传统的军队模式，以及适应这种模式的可靠学说，我们将以优越的战术和训练战胜资本家。"
 NIC_red_officers:"红色军官团"
 NIC_red_officers_desc:0 "巴特勒一直很在意国内国外对红军的批评。他知道，红军被嘲笑为一支缺少纪律，拼凑起来的部队。为此，他大力推动培养一个全新的军官团，训练有素、纪律严明、能彻底给敌人好看。有了这些职业军官，我们的军队会超出敌人想象，变得更加强大。"
 NIC_red_scouts:0 "红色斥候"
 NIC_red_scouts_desc:0 "既然我们已经拥有赤卫队民兵组织了，我们可以把一部分民兵改编为专门的侦察兵。这群斥候将帮助军队寻找目标，调查敌方阵地的弱点，传输击溃敌军所需的情报。每支军队都需要侦察兵，他们一定能派上大用场的。"
 NIC_professional_drills:0 "职业化操练"
 NIC_professional_drills_desc:0 "只要我们的每一名士兵都比敌军的士兵更加训练有素和准备充分，我军自然就能比敌军更加优越。虽然许多人认为在这场内战中我们拥有规模最庞大的军队，但这就能保证我们必胜了吗？我们不应该依靠单纯的数字优势，而应该确保无论我们面对多少敌人，都能以完善准备和精密计划战胜他们。"
 NIC_red_marines:0 "红海军陆战队"
 NIC_red_marines_desc:0 "我们也不能忽视海军陆战队。现在我国只有短短的海岸线并不意味着以后也会一直这样，我们需要确保军队中有专门从事在河流、湖泊和海洋等地形作战的士兵，这样才能为可能遇到的任何作战情况做好准备。巴特勒声称，即使现在还看不出来，但这些海军陆战队之后将会变得很重要。就像我们的士兵在陆地上作战一样，红海军陆战队也会在滩涂上奋战。"
 NIC_red_republican_army:0 "共和红军"
 NIC_red_republican_army_desc:0 "我们的军队再也不会被嘲笑了。如今我军已是一支不可忽视的力量，我们的精密协调和详尽计划帮助我们在战场上所向无敌。每一位士兵的战斗精神和意志力都是我们赢得这场战争的砝码。共和红军将为我们梦想中的美国而战；为所有人的自由、解放和正义而战。"
 NIC_red_air_force:0 "红色空军"
 NIC_red_air_force_desc:0 "红色空军现在是由业余热心人士组成的，我们必须把适当的军衔和训练制度引入这支独立的部队。"
 NIC_the_traditional_army:0 "空军传统主义"
 NIC_the_traditional_army_desc:0 "如果我们要改善我们的空军，就应该集中训练已经成为飞行员的人，同时增加新兵。尽管这可能会让那些希望看到女性驾驶飞机的人感到失望，但就目前而言，保留传统空军系统会更容易、更高效。"
 NIC_revolutionary_naval_industry:0 "革命海军工业"
 NIC_revolutionary_naval_industry_desc:0 "旧美国海军的实力并不仅仅在于指挥人才，更在于宏伟的舰队规模。虽然我们目前的工厂和船坞数目仍无法与战前时期相提并论，我们可以专注于某种舰型以集中产能。"
 NIC_new_american_dockyards:0 "新美利坚船厂"
 NIC_new_american_dockyards_desc:0 "在革命斗争中，大多数船厂都遭受了设施和人员两方面的不同程度损失。我们海军重整计划的第二步即主要着眼于修复旧设施并改良现有设施；新型舰艇的方案竞标工作已经展开，我们将以此作为重建美国海军的基石，并向过去那些陈旧而低效的设计彻底告别。"
 NIC_martime_industry:0 "美国船舶工业"
 NIC_martime_industry_desc:0 "在革命斗争中，大多数船厂都遭受了设施和人员两方面的不同程度损失。我们海军重整计划的第二步即主要着眼于修复旧设施并改良现有设施；新型舰艇的方案竞标工作已经展开，我们将以此作为重建美国海军的基石，并向过去那些陈旧而低效的设计彻底告别。"
 NIC_new_naval_plan:0 "新海军计划"
 NIC_new_naval_plan_desc:0 "随着内战的胜利到来，我们也认识到美国海军遭受了惨痛的损失：许多官兵投靠了反动派武装，与人民的意志为敌；甚至于他们行将战败时还破坏乃至自沉了舰艇。我海军中的一批老资格已经提议，要尽快使海军力量恢复到战前水平。"
 NIC_american_peoples_navy:0 "美利坚人民海军"
 NIC_american_peoples_navy_desc:0 "内战结束以来，一些政治家提出我们目前的首要任务是保卫美国人民。除了延续旧美国海军的理论以外，一些效忠于我方的前海军民兵队成员另提出，应以各州独立指挥为基础，建立一支崭新的美国海军；当战争爆发时，这支海军将联合起来，接受总司令部的指挥。"
 NIC_refit_old_ships:0 "改装旧舰艇"
 NIC_refit_old_ships_desc:0 "我海军中服役的舰只基本都还是20世纪初、甚至19世纪末建造的老船。在内战中，许多舰长和工程师都对自舰进行过非正式的改装；其中部分人更是研究出了整套改装方案和设备，这有助于我们对旧舰进行现代化改装的工作。"
 NIC_liberty_ships2:0 "自由轮"
 NIC_liberty_ships2_desc:0 "我们的造船厂终于改用了先进的建造方式。现在，我们可以轻而易举地大规模量产运输船，向世界各地的盟友送去援助。"
 NIC_revolution_on_high_seas:0 "大洋上的革命"
 NIC_revolution_on_high_seas_desc:0 "旧时的联邦海军在“海军传统”的桎梏中固步自封，没能认识到航空母舰在未来海军中将拥有的至尊地位。我们现役的一些海军老将心中虽然也抱着坚甲利炮的信条，但他们同样赞同飞机对舰艇的打击能力十分可观。我们必须确保新生的美利坚海军无论航行到地球何处，都能在需要的时候召来空中支援。"
 NIC_recreate_continental_marines:0 "重编大陆海军陆战队"
 NIC_recreate_continental_marines_desc:0 "很久以前，独立战争时期的大陆军海军陆战队曾骄傲地抗击过英国殖民者；许多美国海军陆战队的官兵继承这一光荣传统，又在斯梅德利·巴特勒的率领下弃暗投明，加入了革命事业与资本主义走狗作斗争。既然我们要重建海军，就同时也要着力组织、训练这样一支能够与境外反革命势力较量的部队。"
 NIC_navy_of_new_age:0 "海军新纪元"
 NIC_navy_of_new_age_desc:0 "革命斗争几乎使海军完全毁于一旦，当时无人认为我们能在有生之年重建起昔日美国舰队的实力；但是，这个梦想如今已经基本实现。即使在数目和形态上有所迥异，我们仍然能以大批新舰艇取代过时的旧船，而摆脱了顽固派的影响之后，全新的现代战术也已经推行开来。美国海军再一次准备好保卫美利坚的自由，乃至全世界的自由了。"
 NIC_second_continental_navy:0 "第二大陆海军"
 NIC_second_continental_navy_desc:0 "我们海军的征程始于革命爆发时，在旧海军和海事系统中工作的同志们所夺取的一些舰只。虽然只凭借目前的力量尚不足以与联邦政府的海军硬碰硬正面决战，我们仍然必须抓紧海军建设、组织海军指挥体系。"
 NIC_production_quotas:0 "军工生产定额"
 NIC_production_quotas_desc:0 "在生产军备上我们可不能处在劣势。我们会为工厂制订生产配额，要求它们每周都生产足够数量的装备，以维持军队的活力。工人们得努力工作起来，而不能随便偷懒。因为现在不是松懈的时候，一颗子弹、一枚炮弹或一颗炸弹都可能决定胜负。"
 NIC_bring_the_complex_west:0 "重建军工复合体"
 NIC_bring_the_complex_west_desc:0 "我们的军工企业大都建在国土东部。在美利坚陷入内战泥潭后，原先的弹药工厂和武器制造厂等设施均遭到了不同程度的毁坏。它们或成为轰炸行动的高价值目标，或被用作敌人长期防御的据点。如果我们希望为下一场战争做好准备，就一定要投资重建军工复合体。"
 NIC_gi_bill:0 "《军人安置法》"
 NIC_gi_bill_desc:0 "大量的复员军人恐怕将成为内战后的一个重大社会问题。我们应该建立教育和职业培训项目，以便这些老兵能够更快重新融入平民生活。"
 NIC_military_research1:0 "军事研究"
 NIC_military_research1_desc:0 "虽然我们有一些世界上最好的大学和理论家，但我们不能一下子研究所有的东西。我们需要选择一个军事研究的方向。"
 NIC_weapon_designs:0 "新武器设计"
 NIC_weapon_designs_desc:0 "M1加兰德称得上是一款成功的武器，它在士兵们的手中默默地见证了内战全程。但这款武器并非完美，它的某些缺陷甚至从刚被陆军采用时就一直存在。为此，我们特地整理了这款武器在内战中受到的诟病，并将其转交给了约翰·C·加兰德——这款武器的设计师——并要求他对自己的设计进行改进。在重新设计了枪管、导气机构和前瞄具后，他交上了一份比前代更为可靠、也更为致命的步枪设计。"
 NIC_Columbia_needs_you:0 "哥伦比娅需要你！"
 NIC_Columbia_needs_you_desc:0 "哥伦比娅是美国的拟人化象征，她的形象是一位头戴弗里吉亚帽、身披星条旗礼袍的女子。哥伦比娅代表了美利坚自建国以来，一直为之努力奋斗的终极目标——自由。现在激进分子已被镇压，暴君也被推翻，但美国人为哥伦比娅效力的使命尚未终结。在战争云雨笼罩世界的今日，只有勇敢的美国人民才能保护我们的国家和那美丽的哥伦比娅。"
 NIC_war_bonds:0 "战争债券"
 NIC_war_bonds_desc:0 "我们需要足够的资金来维持这场战争。发行债券是一种时下新兴的筹款方式，我们可以很容易地利用卡通片、电影等流行媒体来推广这些债券。"
 NIC_back_in_business2:0 "下一步"
 NIC_back_in_business2_desc:0 "随着打倒国内反动派和暴君的战争取得胜利，美国现在已经站在工团主义革命的前线。在北方，帝国主义者磨刀霍霍，准备夺取所谓的“与生俱来的权利”。在南方，则是一片混乱，我们需要小心行事。跨过两大洋，是渴望支配自己邻国的列强。我们在这世界中究竟扮演怎样的角色？"
 NIC_new_lend_lease:0 "美国援助"
 NIC_new_lend_lease_desc:0 "我们应该允许自己的盟国和“敌人的敌人”，自由运用我国的专业知识。假若他们的斗争可以更顺利些，我们离成功也能更进一步。"
 NIC_on_the_beach:0 "踏上滩涂"
 NIC_on_the_beach_desc:0 "我们的敌人终将会为美国士兵踏上滩头时的雄姿感到恐惧，为此，我们必须努力确保自己会有充分的能力与技巧来投射我们的优势。我们的海军陆战队是全世界最出色的。"
 NIC_from_the_sky:0 "来自天空"
 NIC_from_the_sky_desc:0 "投送影响力到大洋彼岸的最佳方法是通过空军——我们可以通过帮助他们掌控制空权以及确保战场控制以帮助我们的盟友。控制了天空，我们就可以对加固据点和城市等倾泻火力了。"
 NIC_world_revolution:0 "世界革命"
 NIC_world_revolution_desc:0 "我们虽然赢得了革命的胜利，但这不过是个开始。国外有许多人要求我们输出革命，先是在西半球，然后是全世界。这需要我们付出巨大的努力，人民也会肩负重担，但如果我们失败了，那帝国主义者和资本家很有可能扑灭欧洲和其他地区的革命之火。我们不能能让这发生。"
 NIC_free_the_west:0 "解放新大陆"
 NIC_free_the_west_desc:0 "我们属于新大陆，而非旧大陆。我们应该确保在南北美洲的主导地位，彰显出独立工团主义大国的雄姿，而不是充当欧洲人的应声虫。先帮助我们的兄弟，摆脱资本主义的束缚吧。"
 NIC_mexico_friendship:0 "与墨西哥的友谊"
 NIC_mexico_friendship_desc:0 "墨西哥是一个友好的大国，我们应该和他们签订一份友好互助条约。我们需要解决所有的我们之间的领土纠纷，并进一步深化贸易和军事合作，为在北美的和平共处的未来而努力。美墨战争不再重演！"
 NIC_free_mexico:0 "绿色战争计划"
 NIC_free_mexico_desc:0 "我们已经不能再等下去了：墨西哥国必须被摧毁，墨西哥的工人必须拥有和我们自己同等的自由！虽然墨西哥在过去几十年比其他国家进步更大，但显然他们需要我们的协助，把革命的诺言化为现实。墨西哥城，我们来了！"
 NIC_free_canada:0 "红色战争计划"
 NIC_free_canada_desc:0 "现在是时候转向北方的英国流亡者和加拿大了。虽然我们和英国人历史上很亲近，但友好关系早已不复存在了。我们美国人对英国君主制深深地厌恶着。彻底摧毁保王党傻瓜和他们的走狗吧，加拿大是我们的！"
 NIC_look_to_the_south:0 "转向南方"
 NIC_look_to_the_south_desc:0 "随着我们已经掌控加拿大和墨西哥，我们现在可以转向剩余的南北美国家。我们将会清算所有没有接受革命的国家。我们会动用一切手段，清扫任何进步道路上的阻碍。"
 NIC_master_of_the_west:0 "西方霸主"
 NIC_master_of_the_west_desc:0 "我们已经实现了目标：美国独立自主，成为了新世界的领导者并将新世界从资本主义暴政中解放了出来。无论在欧洲或者其他地方发生了什么，至少我们在新世界为自由进行的斗争已经取得了胜利。"
 NIC_demand_new_england:0 "索取新英格兰"
 NIC_demand_new_england_desc:0 "新英格兰地区处于加拿大的铁蹄之下，而显然他们不愿意归还此地。我们要争取当地人的支持，施加外交压力，展现我们的力量以促使新英格兰的伪政府下台……希望如此。"
 NIC_the_revolution_at_home:0 "家中革命"
 NIC_the_revolution_at_home_desc:0 "虽然我们关心所有工人阶级，但如果我们不首先确保自身的稳定，就不能真正对革命起到促进作用。我们将更专注于服务国内的工人，并树立起积极的社会主义国家榜样，为未来做好更充分的准备。革命永远不会失败！"
 NIC_defend_the_front:0 "美国社会主义防御学说"
 NIC_defend_the_front_desc:0 "我们在军事方面应该注重防御而不是进攻，这样既能减少资本主义国家对我们因忌惮而发动袭击的可能，又要舒缓我国公民的恐慌心理。通过保持低调，我们可以争取从内战中恢复过来，为冲突做好准备的时间。"
 NIC_peace_league:0 "和平联盟"
 NIC_peace_league_desc:0 "和平的社会主义难道不比只会依靠武力，咄咄逼人的社会主义要优越吗？我们要组建的和平联盟将致力于促进海内外积极关系，改善我们的国际形象，我们要以友好积极的社会主义视点，去否定侵略成性的资本主义视点。"
 NIC_pacifist_propaganda:0 "和平主义教育"
 NIC_pacifist_propaganda_desc:0 "强硬派要求我们在教育中弘扬强力的军事思想，以保卫社会主义。然而，这与我们的道德观背道而驰，这只会导致好斗的民众倾向于不应该的地方动用武力解决问题。另一方面，和平主义教育将为社会主义提供更有力的道德高地，同时减少国内冲突。"
 NIC_invest_in_the_future:0 "投资未来"
 NIC_invest_in_the_future_desc:0 "没必要迎合渴望扩张的激进派，我们会把资金投资在国内，改善人民生活，为全世界的社会主义树立一个积极的榜样。战争是一场骗局，帝国主义只会为双方带来苦痛。正相反，我们会向世界展示美国的强大，不需要成为帝国，我们的工人将为新的美国黄金世纪铺平道路。"
 NIC_peace_through_socialism:0 "和平社会主义"
 NIC_peace_through_socialism_desc:0 "最终，社会主义的道德优越性已经完全显而易见，我们可以光明正大扩大和平联盟，正式谴责全球内的战争。资本主义国家很难再在道义上证明他们对社会主义（尤其是对我们）的仇恨或恐惧是合理的。也许我们甚至可以从曾经在世界舞台上无足轻重的地位中恢复过来。总有一天……"
 NIC_revolutionary_monroeism:0 "革命门罗主义"
 NIC_revolutionary_monroeism_desc:0 "最初的门罗主义已经死了，死在第二次美国内战的战火之中。然而，政府中仍有许多人认为，保护我们本土所在的西半球不受外国势力干涉是很正当的选择。不仅如此，我们还得保护本地的各个政权不互相伤害对方。让我们拾起一些旧门罗主义的思想，并开始在拉丁美洲推动社会主义新政权的发展。门罗主义将彻底让旧帝国主义失去必要性，因为我们只需要通过政治压力和经济势力就能操控其他国家。革命将会在西半球如火如荼！"
 NIC_logistics_management:0 "美国后勤部"
 NIC_logistics_management_desc:0 "如果我们要真正控制和影响西半球以及其他地区，我们必须投资建设更完善的后勤物流体系。和欧洲那边紧密相连，容易发动大规模战争的环境不同。我们与邻国的边界线很长，而且如果想要接触其他地区，就必须穿越大片海洋。让我们改善海军状况和后勤能力，以应对这些挑战。"
 NIC_naval_investments:0 "红海军之力"
 NIC_naval_investments_desc:0 "红海军如今可能还算不上令人畏惧，但只要有足够资金投入，美国海军就能震慑全球。所以，让我们投资大建，为了某一天主宰海洋。我们永远不会被遥远大洋彼岸的国家入侵，甚至也许有一天，会由我们这边发起入侵。"
 NIC_americanist_faction:0 "领导美洲革命"
 NIC_americanist_faction_desc:0 "拉丁美洲的兄弟姐妹们都在呼唤着我们的帮助。我们应该在美洲发挥领导作用，发起一场大革命。我们一定要彻底消灭南美的反动派。"
 NIC_scoop_up_local_socialists:0 "联系当地社会主义者"
 NIC_scoop_up_local_socialists_desc:0 "我们没必要白手起家，只靠自己把革命传播到西半球其他地区。相反，我们应该接触潜在的意识形态盟友，他们可以给我们提供关键的资源，甚至是军事援助。单靠自己，我们的目标就很难实现，但有了各地的盟友，成功就并非遥不可及了。"
 NIC_join_the_internationale:0 "国际合作"
 NIC_join_the_internationale_desc:0 "第三国际本可以在内战中对我们袖手旁观，但他们却无私帮助了我们。英国和法国可以成为我们的主要盟友，但他们现在面对帝国主义前途未卜，需要我们的帮助，我们应该回报他们给予我们的一切。法国一直以来是美国的朋友，而美国的诞生又起源于英国。让我们加入第三国际，社会主义将永远不会被打败！"
 NIC_invest_in_the_west:0 "投资西欧"
 NIC_invest_in_the_west_desc:0 "实际上，世界大战给西欧留下的创伤还未完全愈合。为了扶困救难，我们可以先在法国某些地区投资基础设施，因为他们是我们最重要的盟友，而且如果下一场世界大战爆发，他们也是直面最大风险的国家。让我们加快脚步。"
 NIC_denounce_the_internationale:0 "除第三国际左籍"
 NIC_denounce_the_internationale_desc:0 "第三国际已经背叛了革命，现在是我们政府的对立面了。我们应该立即谴责这些叛徒，不与其同流合污，走出自己的路。我们不需要这些欧洲修正主义者，我们会自己传播真正的革命。"
 NIC_save_the_cnt:0 "拯救伊比利亚同志"
 NIC_save_the_cnt_desc:0 "西班牙的革命同志有麻烦了。然而，一切还为时未晚，如果我们直接干预，或许我们可以确保他们在伊比利亚半岛掌权。无论是保王派还是卡洛斯派，都不配声称自己是人民的代表，西班牙公民正迫切渴求变革。让我们推他们一把吧！"
 NIC_brazilian_socialism:0 "赤化巴西"
 NIC_brazilian_socialism_desc:0 "巴西和我们一样多元化，它有潜力成为西半球一大强国。因此把革命散播到他们的国家至关重要，因为有了巴西的援助，我们携手就可以轻而易举地控制南美其他地区。传播革命不是一件容易的事，但为了人民的福祉，为了革命的前景，必须这样做。"
 NIC_all_to_the_revolution:0 "一切为了革命，革命就是一切"
 NIC_all_to_the_revolution_desc:0 "既然我们选择独自傲立于世界舞台上，我们面临的局势就比以往任何时候都更加严峻。美国必须为革命献出一切，因为如果革命失败，我们为之奋斗的一切都将付诸东流。所有人必须比以往任何时候都更加努力地工作，向世界展示我们无私奉献的精神和坚不可摧的决心。"
 NIC_new_red_faction:0 "正统革命联盟"
 NIC_new_red_faction_desc:0 "不能再让第三国际的修正者和叛徒成为唯一有影响力的左派。我们将建立自己的队伍，在世界舞台上与他们和其他列强竞争。虽然许多人嘲笑轻视我们，但他们低估了我们从内战中学到的经验。我们的革命将在阳光下熠熠生辉。"
 NIC_strike_ireland:0 "爱尔兰革命"
 NIC_strike_ireland_desc:0 "当不列颠爆发革命时，爱尔兰趁机脱离而出，与革命划清界限。结果，爱尔兰现在由披着虚假民主外皮的反动派统治，对英国来说它成了世界上最大的威胁之一。我国许多政治家和军事官员也开始顾虑它加入帝国公约或协约国的可能性。同时，移民到美国来的大批爱尔兰裔公民正热切敦促我们在爱尔兰沦为资本主义傀儡之前，把革命传播到爱尔兰。他们说的确实有道理。"
 NIC_strike_faux_socialists:0 "清算虚假社会主义！"
 NIC_strike_faux_socialists_desc:0 "不能让第三国际运动中的虚假社会主义者败坏革命的名声。我们应该立即胁迫他们走上正轨。他们可能会反抗我们，但最终他们会明白，我们是他们的朋友，他们的导师，而不是他们的敌人。不过我们现在必须消灭统治着他们国家的反动派。"
 NIC_socialist_liberation:0 "拉丁美洲社会解放"
 NIC_socialist_liberation_desc:0 "一些政客质疑我们是否打算兑现解放拉丁美洲国家的诺言。我们应该向他们表明，我们会履行自己的诺言。现在唯一的问题是，我们应该先打击哪里？"
 NIC_power_of_the_revolution:0 "世界社会主义的必然性"
 NIC_power_of_the_revolution_desc:0 "全世界的工人应该团结起来！为了更美好的未来，我们砥砺前行，现在看来，我们定能取得成功。让我们以比以往任何时候都更炽热的心情前进，解放世界每个角落的男男女女。或许我们所提倡的自由与社会主义创始人所设想的有些不同，但我们的愿景是真正的自由，不仅是为我们自己的人民，而且是为全人类。"
 NIC_break_japan:0 "终结日本帝国主义"
 NIC_break_japan_desc:0 "旭日帝国是我们亚洲革命同僚的最大威胁。如果我们要成为自由解放的代表，就不能容忍他们的帝国主义。更糟糕的是，日本还厚颜无耻地危害了我们在太平洋的利益，侵占了我们过去的盟友，取代了我们的位置。"
 NIC_prussian_socialism:0 "斩杀日耳曼之鹰"
 NIC_prussian_socialism_desc:0 "强大的德意志帝国确实站在世界秩序的顶端。但是，要我们说的话，这种情况可不会持续太久。新的全球霸主将是我们，只是这一次是为自由和平等而战，而不是为资源和霸权。让我们对德国发动史上最大规模的进攻吧，看看他们能否抵抗我们的力量。"
 NIC_eastern_revolution:0 "风自东来"
 NIC_eastern_revolution_desc:0 "日本不是亚洲唯一抵抗革命的国家。我们难道能放着那些学着日本人压迫自己和他国人民的亚洲小国不管吗？当然不能。我们必须干预，打破全亚洲人民的枷锁。"
 NIC_save_bolshevism:0 "拯救俄罗斯革命"
 NIC_save_bolshevism_desc:0 "虽然俄国革命一开始似乎充满希望，但最终还是被德奥两头帝国主义秃鹫终结。现在，仅剩的少数俄罗斯革命者正处于被追捕的境地。我们不能让这种情况继续下去。去莫斯科！"
 NIC_austria_hungary:0 "解放巴尔干"
 NIC_austria_hungary_desc:0 "被称为奥地利帝国的怪诞缝合国家必须被终结。几个世纪以来，他们一直压迫巴尔干地区的各种少数民族。由于该地区各族人民似乎难以靠自己的力量迎来解放，我们必须得介入，推他们一把。"
 NIC_break_arab_monarchism:0 "弑杀阿拉伯诸王"
 NIC_break_arab_monarchism_desc:0 "在落后的宗教与暴君的统治以及他们强加的意志下，阿拉伯人民经受了漫长的苦痛。许多人认为阿拉伯诸国是如今世上最邪恶反动的政权之一。另外，有报告称阿拉伯地区的庞大石油储量尚未开发。或许我们的解放正是帮助他们挖掘资源潜力、为他们自己和我们赢得更繁荣未来所需要的……"
 NIC_african_revolution:0 "非洲革命"
 NIC_african_revolution_desc:0 "太久了，非洲人民在欧洲帝国主义的军靴下受苦受难已经太久了。我国著名的黑人活动家指出，解放非洲等于是发出一条信息，即即使是世界上最贫穷地区的人民也不会被我们弃之不顾。对我们来说，这将成为道德上的大胜，让欧洲列强相形见绌。"
 NIC_world_without_chains:0 "没有枷锁的世界"
 NIC_world_without_chains_desc:0 "两洋相隔的优良地理位置使我们不太可能遭到侵略，而有了足够的投入，我们就有可能入侵地球上的任何地区。既然我们已经解放了这么多国家，就应该一劳永逸完成解放大业，把革命带向全世界！"
 NIC_socialism_in_one_nation:0 "一陆社会主义"
 NIC_socialism_in_one_nation_desc:0 "我们千辛万苦得来的社会主义天堂中的国际主义者们就是群一无是处的空想家，成天叨念着去干预远在天边的他国事务，简直就是换了幅皮囊的帝国主义。我们根本无暇去听信这些蠢货的疯言疯语，我们心里明白得很，美国才是社会主义的发源地，是照耀人世间所有工人的光明灯塔。革命要想成功，就必须专注于自身的独特之处，即我们自己的大陆。"
 NIC_gateway_to_south_america:0 "南美洲的门户"
 NIC_gateway_to_south_america_desc:0 "如果我们想在南美洲立足，我们应该从其最北端开始。哥伦比亚，委内瑞拉还有厄瓜多尔，潜力无穷又缺乏防备，它在我们的保护之下才能更好地发展。让他们加入我们吧！"
 NIC_carribean_revolution:0 "加勒比革命"
 NIC_carribean_revolution_desc:0 "加勒比的历史充满了欧洲人和美洲人的剥削。不幸的是，生活在这一地区的大多数人仍然经受着可怕的生活条件折磨，我们应该对此采取行动。让我们努力把革命带到加勒比地区，确保加勒比人民最终能够挣脱枷锁。"
 NIC_address_the_internationale:0 "接触第三国际"
 NIC_address_the_internationale_desc:0 "虽然我们决定把重点放在家中革命上，但我们还是必须解决第三国际的问题。这个组织是世界上最初的工团主义联盟，也许我们可以从他们身上学到一些东西。如果可以的话，我们还可以向他们伸出援手，看看能否建立外交关系。我们应该帮助他们，还是远离他们呢？"
 NIC_military_industrialization:0 "现代武器工厂"
 NIC_military_industrialization_desc:0 "国家现在需要把重点放在基础军事产出上，因此我们将投资在旧工厂的基础上建造现代军工工厂。"
 NIC_the_dust_settles:0 "尘埃落定"
 NIC_the_dust_settles_desc:0 "随着革命即将胜利，我们必须重新评估我们的军队的状况。已经有数条建议被提出以完善军队体系。"
 NIC_union_managment:0 "保护职业工会"
 NIC_union_managment_desc:0 "工会在我们的经济体系中发挥着重要的作用。但工会并不能真正的指导生产，毕竟这是政府的责任。我们忠诚的职业工会很愿意遵守党和国家的监督，以保护他们的特权不会被普通暴民所夺取。"
 NIC_collective_farming:0 "绿色田野计划"
 NIC_collective_farming_desc:0 "委员会已批准将数百万英亩的土地收归国有，用于实行绿色田野计划。在该计划中，被征收的土地与预留的公地将分配给保证自己能以最低成本取得最大经营效益的投标者。相较于集体化，这种在土地征用中恢复了竞争精神的方式更容易为公众所接受。"
 NIC_communist_party:0 "授权行政机构"
 NIC_communist_party_desc:0 "尽管我们已经集中了权力，但代表大会内部仍然有争吵。若是世界产业工人联盟、美利坚劳工联合会、劳工骑士团以及其他一大堆组织仍旧陷于持续的争吵，我们就无法进步。这群人就没有意识到恪守中道原则、处在正确立场的先锋队才是避免革命自我瓦解的唯一选择吗？这种无政府主义的混乱全都是世界产业工人联盟那所谓的全面选举带来的问题。"
 NIC_browders_economics:0 "白劳德工团主义"
 NIC_browders_economics_desc:0 "厄尔·拉塞尔·白劳德已经推出一系列政策以旨在打造稳定的，可预测的经济。这将主要依靠工业计划和委员会以及配额控制经济的部门。委员会和职业工会已经接受该计划。"
 NIC_price_controls:0 "控制物价"
 NIC_price_controls_desc:0 "资本主义的特征是经济危机通常是由于生产过剩而不是生产力不足导致的。我们将通过委员会固定价格并征收囤积的货物已避免在革命时看到的燃烧的田地一类的悲剧。"
 NIC_nat_syndicalist_econ:0 "集权工团主义"
 NIC_nat_syndicalist_econ_desc:0 "无产阶级革命引发的社会变革比人类历史上任何变革都更加迅速和深远。数以亿计的工人和农民粉碎了束缚他们的奴隶制，并试图建立一个自由并繁荣的社会。工团主义将为人类开辟一个新时代，建立一个美丽新世界。"
 NIC_friendly_media:0 "亲社会主义媒体"
 NIC_friendly_media_desc:0 "联合工团内部的现有媒体系统，以及前美国的媒体系统，与当前国家的关系仍然不算明确。只要媒体忠于美利坚社会主义和我们的政府，允许多种媒体来源也是可以接受的。让我们的特工私下联络那些愿意翼赞我们的媒体并悄悄封杀反对美国工人新政府的媒体。"
 NIC_resource_nationalization:0 "资源国有化"
 NIC_resource_nationalization_desc:0 "要建立真正的美利坚工团主义政府，就得没收所有旧联邦的大型地产，包括森林，矿脉以及湖泊等。美国人将永远不会再被布尔乔亚的枷锁所束缚。"
 NIC_create_the_cia:0 "建立联合情报局"
 NIC_create_the_cia_desc:0 "为了击败革命的阶级敌人，我们建立了由当届委员会直接领导的联合情报局。这将是一个秘密的安全组织，并时刻准备着将反革命分子送下地狱。"
 NIC_peoples_commisars:0 "人民政委"
 NIC_peoples_commisars_desc:0 "在内战期间，我们有许多民兵单位，公社和工团组织采用了政委制度。这些警惕的公民将会密切关注任何潜在的反革命分子。代表大会已经批准组建直接受国家控制的政委编制，并在全国范围内实行该系统。"
 NIC_american_empire2:0 "社会主义“帝国”"
 NIC_american_empire2_desc:0 "终于，大多数人眼中的北美已尽入我光荣的社会主义国家掌中。门罗之精神走向了合乎逻辑的结局，无数反动派的鲜血将其浸透，革命声势为之一振。美国不再仅仅是个帝国，而是社会主义的“帝国”，是世上所有革命者的光辉模范。"
 NIC_bomber_command:0 "轰炸机司令部"
 NIC_bomber_command_desc:0 "新美利坚人民空军或者提供了几个空军建设计划。其中之一是组建一个大型的，装备有最先进轰炸机的“轰炸机司令部”，通过协调各方以彻底炸平敌方的城市。"
 NIC_fighter_command:0 "战斗机司令部"
 NIC_fighter_command_desc:0 "争抢人民空军资金的第二个计划是组建一个庞大的战斗机司令部，并通过协调各方以确保我们对天空的主导。"
 NIC_flexible_airforce:0 "维持灵活性"
 NIC_flexible_airforce_desc:0 "比起接受来自人民空军的各种建议，我们应该确保他们保持足够的灵活性，并发展优秀的学说，而不是只依赖于装备。"
 NIC_unleash_the_hellcat:0 "放出地狱猫"
 NIC_unleash_the_hellcat_desc:0 "空军最具创造性的设计之一是被称为贝斯佩奇F6F地狱猫的舰载机。由贝斯佩奇航空工会和设计局所设计。地狱猫将是我们至今为止最优秀的舰载战斗机。"
 NIC_the_second_draft:0 "第二兵源"
 NIC_the_second_draft_desc:0 "我们需要更多的飞行员。有些人建议征召妇女入伍，这当然会不充兵源，并展现我们在性别平等上的努力。女性飞行员和男性一样骁勇善战，我们怎么能拒绝那些才华横溢的人呢？"
 NIC_decentralized_planning:0 "社会主义自我管理"
 NIC_decentralized_planning_desc:0 "中央委员会将立刻着手于为行业创造足够的技术人员和管理人员。分散的技术学校、专科学校和函授学校等机构将被组织、扩大，并同各产业直接联系起来。"
 NIC_socialist_support:0 "民兵辅兵部队"
 NIC_socialist_support_desc:0 "美国一直有民兵传统。正如在上一次美国革命中美国人民纷纷加入一分钟人一样，在这第二次革命中我们也得利用民兵部队。民兵可以支援我们的军队，如果情况允许，甚至可以代替他们。这些民兵也许没有职业军队那样训练有素，但他们渴望为我们的事业而战，士气高昂。"
 NIC_peoples_academies:0 "人民军事学院"
 NIC_peoples_academies_desc:0 "为了与西点军校等军事机构竞争，我们提出了一个创建属于社会主义者自己的军事学院的计划。所谓的“人民军事学校”将训练我们的军官作战方法，他们的技艺和智慧会使我们的敌人措手不及。我们离拥有一支真正的职业化军队又近了一步。"
 NIC_military_research:0 "军事研究"
 NIC_military_research_desc:0 "虽然我们有一些世界上最好的大学和理论家，但我们不能一下子研究所有的东西。我们需要选择一个军事研究的方向。"
 NIC_indepedent_media:0 "保护言论自由"
 NIC_indepedent_media_desc:0 "自由媒体和言论自由权是美国人民不可剥夺的权利。尽管有要求审查言论的呼声，法院系统仍然重申了言论自由权。让那些反动派和叛徒去狂吠吧，他们声嘶力竭的吼叫将会被我们同志们庆祝繁荣的新时代的欢呼所淹没！"
 NIC_high_wages:0 "公平的酬劳"
 NIC_high_wages_desc:0 "高水平最低工资和政府更直接地代表集体进行谈判将确保辛勤工作的高额报酬，如果你不能支付薪酬，那么你就没有权利雇佣人民劳动。"
 NIC_paid_vacations:0 "公平的工时"
 NIC_paid_vacations_desc:0 "8-8-8运动让我们明白一个人需要足够的休闲和休息时间。因此每天工作8小时，每周工作5天是现在的最高限额，政府将保证6周的带薪假期，为我们的工人创造舒适的生活。"
