 NIC_america_redeemed:0 "美利坚终得救赎"
 NIC_america_redeemed_desc:0 ""
 NIC_Moseley_in_command:0 "莫斯利的铁拳"
 NIC_Moseley_in_command_desc:0 "随着巴顿的退休，乔治·范·霍恩·莫斯利将军成为了国家最高领导人，现在他已经接管了我们自豪的祖国。这位战术天才和第二次美国内战的英雄，以其严厉、精打细算的头脑和铁腕，作为现代华盛顿的代表，现在将带领国家走向新教虔诚，坚定的军国主义，反社会主义和美国本土主义。"
 NIC_Immigrants_Begone:0 "解决移民“问题”"
 NIC_Immigrants_Begone_desc:0 "不幸的是，移民们正在折磨着我们的国家，破坏着我们对精致美国梦的追求——无论他们是大卫的众子，非洲之子，还是地中海和东欧的黑皮肤野蛮人。这些问题人口将不再伤害我们的社会。通过更困难的识字能力测试、更严格的移民规定和更少的移民国家名单，我们将一步一步地解决移民问题——尽管我们不得不放弃莫斯利提出的更为“有趣”和激进的解决方案：比如绝育和优生。"
 NIC_Expand_Conscription:0 "重振军国主义精神"
 NIC_Expand_Conscription_desc:0 "为了保护我们的利益和维护美国梦，我们将继续奉行和平时期维持军事化的政策。通过一项新的草案，新的军国工业化倡议，以及新的军备合同，我们将把美国变成原本理应成为的火力强大之国。"
 NIC_Crush_Commies:0 "赶走社会主义者"
 NIC_Crush_Commies_desc:0 "必须不惜一切代价阻止社会主义者及其在银行业和传媒业中的盟友，因为他们的意识形态煽动可能会永久玷污美国民众的心灵和思想。我们必须利用自身发起的赤潮将这些深红魔鬼洗尽。一个幽灵将在美国上空升起——反社会主义的幽灵！"
 NIC_Sideline_Democracy:0 "边缘化民主"
 NIC_Sideline_Democracy_desc:0 "民主一直都是一个危险的想法，民主机构日渐沦为腐败和派系主义大本营。我们必须不惜一切代价保护美国不受这些侵蚀性影响，因此联邦民主的任何和所有残余都必须从这个国家彻底废除。"
 NIC_Christian_Army:0 "一支真正的基督军队"
 NIC_Christian_Army_desc:0 "为了在我们的军队中促进良好的、敬畏上帝的价值观和诚实的行为，以及对国家和上帝的坚定忠诚，所有军队成员都必须成为新教徒。所有现有的非新教徒军人将有一个选择——要么皈依，要么不光彩地退伍，所有新兵如果尚未加入唯一的真正信仰，将被强制皈依。我们会建立一支有道德、有纪律的军队，因为我们是上帝选中的士兵！"
 NIC_Military_With_A_State:0 "华盛顿军政制"
 NIC_Military_With_A_State_desc:0 "在我们最伟大的国父和旧美国的第一任总统的影响和启发下，莫斯利将军现在作为第二个华盛顿将军成功地领导着这个高度军事化的新美国。他是我们美利坚革命的英雄，发誓要领导我们的国家走向伟大和安全，这个新的“军队国家”体制将在我们迈向新命运的征程中为美利坚服务。"
 NIC_From_a_Militia_to_a_force:0 "国民军"
 NIC_From_a_Militia_to_a_force_desc:0 "许多美国爱国者团结在宪政国的大旗之下，准备在华盛顿特区、芝加哥与路易斯安那的毒蛇面前保家卫国。旧民主党只有领导小规模民兵部队的经验，但各地的军事人才都宣誓要为宪政国服务。因此，我们应当将这群怀抱理想主义英雄梦的乌合之众们整编成一营营的士兵，时刻准备朝敌人的家门口进军！"
 NIC_counter_terrorism:0 "反恐怖主义"
 NIC_counter_terrorism_desc:0 "我们将整合各州情报局与国家情报总局的力量，在全国范围内织就天罗地网，誓将恐怖分子消灭殆尽。"
 NIC_Patton_Plan:0 "巴顿策略"
 NIC_Patton_Plan_desc:0 "你可以说乔治·巴顿不善言辞，但你要是怀疑他的军事才能，那么你就得去医院看看脑子了。巴顿以历史上的诸多军事名场面为例，论证了机动性才是制胜的关键，并提议宪政国把全部精力都放在装甲作战上。"
 NIC_Moseley_Plan:0 "莫斯利改革方案"
 NIC_Moseley_Plan_desc:0 "莫斯利将军总是在想办法改善军队的指挥效率，而如今他把数年的思考结晶汇集了起来，拟定出了一份改革方案。他提出了从上到下的等级重组，扩大旧有的陆军基地来训练军官，并着重于集中指挥系统。虽然莫斯利的方案受到了更加偏向于自主作战体系的大多数宪政国军官的层层刁难，但不可否认的是，在军事经验这方面，莫斯利可谓是独孤求败。"
 NIC_counter_fortifications:0 "前线渗透者"
 NIC_counter_fortifications_desc:0 "虽然我们的大部分部队都会接受一定的非常规战术训练，但只有那些悍不畏死、精挑细选的少数人才可肩负起深入敌后的重任，他们需要同友好团体接触，破坏敌人的基础设施。有鉴于古人劫掠的先例，这些忠勇之士必能让最大后方的敌人也心生畏惧。"
 NIC_counter_arnaments:0 "送敌入天国"
 NIC_counter_arnaments_desc:0 "倘若说到突击型军队必备之物，那必然是炸药，而且还是大量的炸药莫属。阿尔蒙德已批准对全军上下进行全面整备，一定要保证他们每个人身上都带着能把敌人阵地炸个稀巴烂的炸药、燃烧弹和手榴弹。我们当然也不会忘了游击队，就让那些占领我国领土的敌人好好享受一番清理废墟的快乐吧！"
 NIC_wickliffe_plan:0 "德雷珀计划"
 NIC_wickliffe_plan_desc:0 "威克利夫·德雷珀虽比同时代人要来得孤僻些，但他在管理军队上还是有自己的一套心得体会，也毫无保留地将其交予了国家。在其理论中最亮眼之处便是，他认为一支庞大而受过良好教育的军队符合宪政国的利益，在民用以及医疗基础设施上的苦心经营也必然能让我们在以后的战争中无往而不胜。"
 NIC_cavalry_leadership:0 "盎格鲁-诺曼人的继承者"
 NIC_cavalry_leadership_desc:0 "镌刻在南方绅士骨子里的崇高精神的血脉来源——我们遥远的祖先盎格鲁-诺曼人以骑兵为主力，一举扭转了战事，大败同样谙习马战的不列颠人，其意义不亚于我们的祖辈漂洋过海来到新大陆定居。让我们发扬光大从征服者威廉一直传承至南方各州的高贵精神之遗产，把骑兵抬升到主力军的理想模范地位吧。"
 NIC_oil_oligarchy_desc:0 "我们拥有能使国家富裕起来的一切所需的石油资源，而这些资源就在美国各州，但绝大多数的石油要么是被少数人所把持，要么是错过了钻探石油的机会。所有向我方效忠的石油公司将被合并为美国国家石油公司，政府将拥有多数股份，并将通过基础设施项目提供援助。"
 NIC_expand_Fort_Benning_for_Training:0 "扩建本宁堡军事基地"
 NIC_expand_Fort_Benning_for_Training_desc:0 "自1909年建立以来，本宁堡忠实地为我国军队服务，其重要性与日俱增。作为美国陆军步兵学校的所在地，扩建本宁堡可以为新招募的军官提供更好的学习空间，并随之在长期内为我们提供更好的军官。"
 NIC_walkie_talkies:0 "步话机"
 NIC_walkie_talkies_desc:0 "通常来说，军用装备有着听起来就很强悍的名字。步话机？这种名字是怎么混进军用系统的？我们的将军们声称，这种不受距离限制的新式通信设备将使我们的部队在战场上能够有效进行沟通。那么好的东西我们居然称它为步话机？"
 NIC_focus_on_concentration:0 "专注集火"
 NIC_focus_on_concentration_desc:0 "从罗马军团时代起，集中兵力就一直是每位指挥官的宝贵策略。考虑到我国在打击美国叛徒时的有限资源，我们应重新考虑这一战略，将炮兵集中于特定区域，使步兵能利用炮火实现突破。"
 NIC_draw_a_new_war_plan_white:0 "制定新白色战争计划"
 NIC_draw_a_new_war_plan_white_desc:0 "虽然我们缴获了《白色战争计划》原始草稿的副本，但不幸的是，它对我们的目的毫无用处，因为它只详细说明了如何供应和保卫华盛顿和中西部附近地区，而并没有提及如何从我们的南方大本营夺回全美。然而，依靠这个计划所带来的信息，以及我们经验丰富的指挥官，我们可以起草一个新版本的计划，一个考虑到我方新“情况”的计划。"
 NIC_reverse_war_plan_white:0 "逆向研究白色战争计划"
 NIC_reverse_war_plan_white_desc:0 "感谢我们的将军们，我们已经设法获得了被用来针对我们的“白色战争计划”的副本。虽然我们不能阻止合众国军队重组他们的后勤体系，但我们现在可以预测他们的行进路线，加强我方的薄弱环节，并想办法去欺骗华盛顿当局——因为他们多半认为自己已经做好准备了。"
 NIC_top_of_the_line_artillery:0 "一流火炮"
 NIC_top_of_the_line_artillery_desc:0 "更轻的动力，更强的外壳和新型的引爆设备将使我们的炮兵能打破任何掩体。如果要击垮敌人，就必须加快其发展。"
 NIC_coordinated_fire:0 "协同射击"
 NIC_coordinated_fire_desc:0 "按照命令定时射击火炮的日子已一去不返。一个更好的随时间运转的人力行动系统将使我们能在必要时协同射击。"
 NIC_air_force_reform:0 "组建美国空军"
 NIC_air_force_reform_desc:0 "由于美军中持续近20年的辩论仍在继续，叛逃我们一方的空军军官们承诺，如果将空军从陆军中分离出来，将会取得巨大的成果。美利坚宪政国的空军将成立，并将决定其未来的计划。"
 NIC_expand_ACTS:0 "扩建陆军航空兵战术学校"
 NIC_expand_ACTS_desc:0 "很幸运，美军过去将空军军官训练下放到南方腹地，因此我们现得以进入阿拉巴马州麦克斯韦空军基地航空兵战术学校。然而，为了超过在弗吉尼亚州兰利空军基地设立的学校，我们需要扩大招生规模。"
 NIC_fighters:0 "战斗机开发"
 NIC_fighters_desc:0 "由于缺乏政府的资金支持，美国战斗机项目在1920年代处于停滞状态，导致战斗机发展处于不利地位。为缩小这一差距，我们必须以一份利润丰厚的飞机生产合同为奖励来资助不同公司间的设计竞赛。"
 NIC_le_may_reform:0 "林德伯格改革计划"
 NIC_le_may_reform_desc:0 "查尔斯·林德伯格的名声甚至在空军中也是如雷贯耳，这位飞行员提出了一个大胆的改革计划。他认为空军并不是陆军的添头，应该被用于打击我们敌人的心脏，削弱他们的战争工业。虽然他的理论方法是合理的，但最终决定权在政府手中。"
 NIC_air_field_expansion:0 "扩建空军基地"
 NIC_air_field_expansion_desc:0 "第一架飞机就是在南方进行飞行的。我们这里有着悠久的航空传统，让我们拥抱它吧。我们将扩建机场，确保我方拥有足够数量战斗机、轰炸机和运输机，以便我们能赢得任何空中战争。"
 NIC_naval_bombers:0 "发展海军轰炸机"
 NIC_naval_bombers_desc:0 "我们的海军部队不足以保卫海岸线，因此，空军应当承担起这份责任，不惜一切代价将企图涉足我国领土的敌军舰队沉入无尽的深渊。出于补充海军巡逻队的需要，我们将配属大批海军轰炸机负责侦察和阻碍任何敌对船只，尤其是传统海军难以深入或广泛开展巡逻的海域更是如此。"
 NIC_Weyland_plan:0 "韦兰改革计划"
 NIC_Weyland_plan_desc:0 "奥托·P·韦兰最近凭借着裙带关系和自身优秀能力的共同作用，成功地进入了指挥部高层，并提出了一项显然受到陆军高层欢迎的改革计划。在他看来，空军在战争中的作用应该是通过近距离的空中支援来支持陆军的前进。虽然他的理论方法是合理的，但最终决定权在政府手中。"
 NIC_bombers:0 "开发轰炸机"
 NIC_bombers_desc:0 "轰炸机，恐惧的源泉，力量投射的象征。当她们授命为绝密计划服务而承载那些不为人知的秘密的重量时，我们当然需要让她们变得更加听话而精巧。"
 NIC_radar:0 "研发“雷达”"
 NIC_radar_desc:0 "“雷达”是一项用于发现空中敌军动向并让我军的空况监视员在夜晚能够更加轻松进行工作的最高机密技术。"
 NIC_screaming_eagles:0 "“呼啸之鹰”计划"
 NIC_screaming_eagles_desc:0 "随着空军力量的不断壮大和战场需求的日益增长，一个问题出现在我国陆军和空军军官面前：是否有可能将两军相结合，输送部队至敌后战场以改变战争的面貌？为证明或反驳这一理论，必须进行试验。"
 NIC_rule_the_skies:0 "统治天空"
 NIC_rule_the_skies_desc:0 "起飞吧，飞向无垠的苍穹，飞向高耸的天际吧。我们的空军举世无双，我们的力量无所不及。"
 NIC_CAS_focus:0 "近距离空中支援发展"
 NIC_CAS_focus_desc:0 "陆军在穿越敌人所建立的战壕时要求更多的地面支援。作为平等的合作伙伴，空军批准了这一要求。"
 NIC_CAS_doctrine:0 "空地协同演习"
 NIC_CAS_doctrine_desc:0 "为打造一支高效的近地支援力量，我们首先要对这项新颖的战争概念加以实践。"
 NIC_flexible_bombers:0 "多用途轰炸机发展"
 NIC_flexible_bombers_desc:0 "自从我国空军肩负起辅助地面部队作战的使命以来，轰炸机正在扮演愈发广阔的角色。对敌军后方实施近地轰炸的成果，无论是针对后勤补给还是通讯设施都效果显著，我应该鼓励生产商开发能够适应这些任务的新型战斗机。"
 NIC_combined_arms_offensive:0 "陆空军协同进攻"
 NIC_combined_arms_offensive_desc:0 "我们的空军指挥官已经准备就绪，但阻碍我国军事力量发展另一问题正重新浮现：陆军军官们并不清楚该怎样发挥空军的最大潜力。因此，我们应该手把手地教导他们如何实现步兵、机械化车队与空军的战术协调，对敌人发起势不可挡的猛攻。"
 NIC_strat_bomber_development:0 "开发战略轰炸机"
 NIC_strat_bomber_development_desc:0 "我国空军的发展方向日渐清晰后，眼下应该着重于新型轰炸机的开发，实现摧毁敌方工业设施的重要使命。"
 NIC_cult_of_aviation:0 "航空崇拜"
 NIC_cult_of_aviation_desc:0 "自莱特兄弟在北卡罗来纳州小鹰镇进行人类历史上首次试验飞行以来，美国人对航空技术便显得愈发着迷。我们应该有效利用这种魅力，将我国空军打造为美利坚的骄傲。"
 NIC_long_range_interceptors:0 "远程拦截者"
 NIC_long_range_interceptors_desc:0 "尽管战斗机可以捍卫战场上空的安全，但位于敌方领空的战斗通常过于遥远，很少有战斗机可以护送我方的轰炸机群不受敌方空军部队干扰。为应对这些问题，我们设计改良了新的战斗机样品，分量更重、灵活性更强，在空中对决中更有优势。对该领域实施进一步投资有望提升项目的收益。"
 NIC_navy:0 "美国海军"
 NIC_navy_desc:0 "盘点海上形势之后，我们发现我方的海军只有很少的几艘船，水手的数量就更少了……但至少他们忠于美国人民。"
 NIC_great_white_fleet:0 "大白舰队"
 NIC_great_white_fleet_desc:0 "“大白舰队”是历史上美国海军实力的巅峰，它的荣光激励着每一代海军人。我们应当重拾往日荣光，建设一支以战列舰与无畏舰为核心的传大舰队，来捍卫美利坚的海权。"
 NIC_protect_american_trade:0 "保护美洲贸易"
 NIC_protect_american_trade_desc:0 "贸易是美国的经济命脉，我国海军作战理论也自然应当以保卫海上生命线免遭敌军袭扰为核心。"
 NIC_carriers:0 "航母舰队计划"
 NIC_carriers_desc:0 "航空母舰代表着海军未来的潮流。我们应当投资相关领域研究以便更好地发展国内海军力量。"
 NIC_battleships:0 "战列舰研究"
 NIC_battleships_desc:0 "战列舰是当之无愧的公海霸主。我们应着手研发能够装载更大的舰炮与优良防空体系的新型战列舰。"
 NIC_battle_cruisers:0 "战列巡洋舰研究"
 NIC_battle_cruisers_desc:0 "战列巡洋舰，是战列舰重火力与巡洋舰机动性的完美结合。我国海军应配备相当数量的战列巡洋舰用于执行常规任务。"
 NIC_coast_guard:0 "保卫海岸"
 NIC_coast_guard_desc:0 "重建海岸警卫队有助于为海上贸易通道提供保障，不法分子将在海面上遭到拦截，陷入危难的人也能得到及时施救。"
 NIC_light_cruisers:0 "轻巡洋舰发展"
 NIC_light_cruisers_desc:0 "轻型巡洋舰的主要职责是为舰队提供防空火力、攻击敌方驱逐舰和摧毁敌方潜艇。我国海军应配备相当数量的轻巡洋舰来维持舰队战力平衡。"
 NIC_naval_aviation:0 "海军航空"
 NIC_naval_aviation_desc:0 "海军航空兵将成为未来远洋作战的主力。我们必须确保舰载战机可以在敌人对我方舰队产生威胁之前就将其歼灭。"
 NIC_expand_dockyards:0 "扩建船坞"
 NIC_expand_dockyards_desc:0 "我国当前的船坞保有量不足以独力应付战争的需要，眼下我们应当建设更多的海军生产设施来供给战时所需。"
 NIC_submarine_development:0 "潜艇发展"
 NIC_submarine_development_desc:0 "潜艇可以对敌军运输编队和重型战舰造成重大破坏。我国的潜艇设计应当时刻领先于敌方驱逐舰与反潜战术的发展。"
 NIC_liberty_ships:0 "自由轮"
 NIC_liberty_ships_desc:0 "我国的民用造船厂先前主要是生产商业货轮。这些船厂能够迅速转向大规模运输船生产，让我们可以向遍布世界的盟友送去援助。"
 NIC_maritime_industry:0 "海事产业"
 NIC_maritime_industry_desc:0 "我们的海上传统依然牢固。我们可以利用商业航运业帮助我们苦苦挣扎的民主制度勉力生存下去。"
 NIC_new_admirals:0 "新生代海军将领"
 NIC_new_admirals_desc:0 "许多海军将领选择与东方的叛徒同流合污，为保障我国的海上霸权，我们必须培养新生代的海军指挥官。"
 NIC_life_at_sea:0 "建立海军女子志愿服务队"
 NIC_life_at_sea_desc:0 "女性可以在海军中承担一些辅助性的角色，以便让男人们专心于战斗任务。此举虽可能在社会上引发争议，但无疑有助于达成我们的战争目标。"
 NIC_marine_corps:0 "扩大海军陆战队"
 NIC_marine_corps_desc:0 "海军陆战队是美国全球军事投射能力的缩影。从蒙特祖马大厅，到的黎波里海岸，陆战队永远为国家效劳。我们应该确保他们能得到最先进的装备与训练设施。"
 NIC_naval_training:0 "海军训练"
 NIC_naval_training_desc:0 "尽管安纳波利斯海军军校在内战中被毁，我们仍然有充足的训练设施来培养新一代海军军官与水兵。"
 NIC_urban_warfare:0 "巷战训练"
 NIC_urban_warfare_desc:0 "我们应该扩建海军陆战队规模，确保他们有能力在全球范围内投射我国的力量。"
 NIC_coastal_bunkers:0 "永远忠诚"
 NIC_coastal_bunkers_desc:0 "“永远忠诚”是海军陆战队的格言，作为美利坚自由与民主的堡垒，他们将为世界传播解放的福音！"
 NIC_america_rules_waves:0 "美利坚统治四海"
 NIC_america_rules_waves_desc:0 "我国在海军研究与建设领域的广泛投资，使我们重新成为世界领先的海军强国之一。起航吧，为黑暗的世界开辟道路！"
 NIC_back_in_business:0 "回到世界舞台"
 NIC_back_in_business_desc:0 "既然我们已经恢复了世界强国的地位，是时候明确我们在世界舞台中的位置了。"
 NIC_manifest_destiny:0 "昭昭天命"
 NIC_manifest_destiny_desc:0 "我们在世界上的地位不能与旧秩序一般——美国本来就应该统治北美，它也理应如此！让我们立刻攻击背信弃义的加拿大人和受工团主义影响的墨西哥人，把两地的资源化为己用。"
 NIC_american_empire:0 "美利坚帝国"
 NIC_american_empire_desc:0 "当老牌欧洲国家和崛起的亚洲国家主宰世界时，美国并不打算袖手旁观。我们自己的帝国将会让罗马人感到羞耻，我们会为了我们人民的利益开始准备征服外国。"
 NIC_pacific_pact:0 "太平洋条约"
 NIC_pacific_pact_desc:0 "当我们需要着眼于西方时，在东方挑起争端就没有任何好处了，尤其是日本仍然可能成为我们的坚实盟友，因为他们和我们一样，试图终结工团主义，保护本国人民。尽管并不是所有美国人都欣赏日本种族和文化，但达成某种协议对双方都有好处。"
 NIC_consolidate_the_south:0 "巩固南部"
 NIC_consolidate_the_south_desc:0 "我们需要保住我们在中美洲的财产，这不是一项容易完成的任务，因为叛乱分子企图颠覆我们，尽管他们的事业现在已经失败，蛰伏于国家法治之下。但一场清除激进分子并建立更多前哨基地的军事行动将强化我们对南部的控制。"
 NIC_quebec_issue:0 "魁北克问题"
 NIC_quebec_issue_desc:0 "既然魁北克的天主教徒对我国的对天主教立场以及整治公社同情者，排除潜在工团主义者的行为提出了严重的异议，那就开始驱逐出境运动，送他们加入他们心爱的公社吧。"
 NIC_lead_south_africa:0 "扩大朋友圈"
 NIC_lead_south_africa_desc:0 "为了实现我们的全球野心，我们必须与其它坚持白人至上思想的志同道合国家进行联合。我们将共同维护西方文明的荣光，为我们合作但完全隔离的人民带来秩序、稳定、传统和民族自豪感。我们会一同创造出守护我等之民的强大联盟。"
 NIC_destiny_of_the_anglo_world:0 "盎格鲁世界的命运"
 NIC_destiny_of_the_anglo_world_desc:0 "英国和法国本来有潜力成为伟大的国家，但不幸的是，他们却信奉了马克思主义，现在还威胁要摧毁我们的一切。为了解决这个问题，美国将成为盎格鲁世界与法兰西世界的领袖。"
 NIC_the_eagle_spreads_its_wings:0 "雄鹰展翅"
 NIC_the_eagle_spreads_its_wings_desc:0 "随着我们主要目标的实现，让我们在南美洲确保我们所需的最后资源，以建立一个永不会陷入资源匮乏的强大美国。"
 NIC_fordist_economy:0 "建立开国元勋心怡的福特式经济"
 NIC_fordist_economy_desc:0 "福特被证明创造了最完美的工业组织与管理方式，几十年来，他的经济理念一直是美国工业崛起的支柱。福特主义将主宰美国经济，并与莫斯利的威权军国主义和国父们的保守自由资本主义相融合，创造一个由美国最优秀的人创造的新经济，并为美国最优秀的人服务，最终让我们当中最优秀、最聪明的人推动美国我们走向繁荣的未来。"
 NIC_Finest_Americanism:0 "捍卫最佳的美国精神"
 NIC_Finest_Americanism_desc:0 "在上帝的翠绿地球上，美国精神代表着最完美、最受神启示的文化与社会；美利坚是繁荣和自由的光辉灯塔，是辉煌的山巅之城。我们必须不惜一切代价，对美国独特而完美的文化加以保存和维系。我们将制定法律，以此维护我们以及开国元勋们的思想。军队规模将得以扩大，以帮助保卫国家。在莫斯利将军的统帅下，星条旗绝不会陨落！"
 NIC_Long_Gray_Line:0 "西点军魂"
 NIC_Long_Gray_Line_desc:0 "西点军校可能是要打扫打扫灰尘才能为我们所用，但它和弗吉尼亚军校确实也培养出了一批在世界上都首屈一指的军事人才，从以前的罗伯特·E·李和托马斯·杰克逊，再到当代的乔治·巴顿和查尔斯·佩洛特·萨莫勒，西点的学员们向来是美国军队的楷模。因此，为了延续传承我国的优秀军事传统，我们是该重振我们的军事学院，并根据现实需要进行响应调整，以期保证他们能培养出将战术战略烂熟于心的爱国者。"
 NIC_Painting_Logistical_Masterpiece:0 "共创后勤补给奇迹"
 NIC_Painting_Logistical_Masterpiece_desc:0 "德雷珀的扩军方案面临的最大批评是补给问题。东南各州欠缺发达的铁路枢纽与高速公路，而且地形多崎岖、恶劣，很难支撑起一支庞大的军队。德雷珀对此自然是心知肚明，而且他也准备好来个人人能吃饱、枪枪不缺子的后勤大变样了。只要号召民众协助建立临时性的交通枢纽、组建专门负责管理补给需求的完备机构，要不了多久，德雷珀的反对者就会自觉噤声的。"
 NIC_Expanded_Pioneer_Fund:0 "增拨先锋基金"
 NIC_Expanded_Pioneer_Fund_desc:0 "虽然德雷珀创立先锋基金的初心是为了让更多人了解到优生学的好处，但他近来的晋升也让他有了扩充先锋资金所需的只要。也就是说，他定下了第二个目标，也就是向纯粹的美国人提供奖学金，建设新的医学教育点，并让我国的医护人员为劳军拥军做好准备。在残酷的现代战争中，随时准备拯救美国人生命的前线医生要比任何时候都来的珍贵。"
 NIC_Forrests_Spirit:0 "福雷斯特精神"
 NIC_Forrests_Spirit_desc:0 "现代的机动战争固然是由坦克与摩托化步兵所主导的，但我们也不能忘记内森·贝福德·福雷斯特传下来的传统。与卡车与坦克相比，马要来得更廉价，也更适用于我们的农村土地，因此，我们必须继续强调骑兵的作用，还有其提升我军机动性的能力。我们的骑兵部队可以负责包围与钳形攻势，步兵部队则应准备大举冲锋，完成任务。此外，我们还应鼓励军官们置生死于度外，像鹿寨战役中突入联邦军防线的人一样，扔下左轮狂挥军刀。只有抱定决心拼死一搏，我军才能在战场上所向披靡！"
 NIC_Columbia_Calls_Victory:0 "哥伦比亚呼唤胜利"
 NIC_Columbia_Calls_Victory_desc:0 "国家战事正急，全国上下必须竭尽全力争取胜利。仅有士兵们的流血牺牲还不够，我国平民们也必须为战事尽一切力量，他们将以辅助部队的形式，加入预备役部队，甚至是在我国的沦陷区中进行游击战。唯有完成任务，哥伦比亚的羽翼之下才能有我们的一席之地！"
 NIC_Communications_Nexus:0 "通讯中心"
 NIC_Communications_Nexus_desc:0 "莫斯利个人对通信技术兴许有所偏爱，但这一爱好肯定也能在他集中指挥的设想上派上用场。我军的最高指挥官决定将通信系统作为军队改革的头等要事。第一步便是发展建设通讯中心，保证所有部队都能及时收到同样的命令。"
 NIC_Martial_Darwinism:0 "尚武达尔文主义"
 NIC_Martial_Darwinism_desc:0 "我们绝不允许不称职的军官士兵们因为裙带关系、政治关系或是其他原因留在军中服役，这只会让我军变得软弱无力、老态龙钟。莫斯利建议，一切此类形式的“法外开恩”行为都该接受公正的惩处，我军军官也应当受到严厉的约束。真正的人才会在新的冲突环境之中脱颖而出，而这些未来的军队领袖也应当立刻走上统领军队的道路。"
 NIC_Engineers_Form_the_Backbone:0 "工程师骨干"
 NIC_Engineers_Form_the_Backbone_desc:0 "构筑完善的防线是莫斯利作战计划的关键一环，但不合格的功臣部队可没法办到这件事。通过大规模招募工程师，改进他们的工具与重型机械，我军必能抵御敌人的一切攻势。"
 NIC_Controlling_Fear:0 "利用恐惧"
 NIC_Controlling_Fear_desc:0 "恐惧既是我军对付敌人的武器，也是时不时压垮我军的致命情绪。莫斯利从两方面分析了恐惧，我们也懂得了如何在敌人心中制造恐惧，如何保持我军部队的心理健康。我们首先要做的便是对炮兵部队进行大规模投资，对敌军阵地的不断炮击加上燃烧弹的使用，必能让敌人胆战心惊。"
 NIC_Titans_of_the_New_Republic:0 "新共和国的巨人"
 NIC_Titans_of_the_New_Republic_desc:0 "钢带虽被视作美国工业之心，但要是据此妄下定论，耻笑宪政国本身毫无工业实力，那可就是无知透顶了。田纳西盛产钢铁，密西西比盛产黑金，经济天才亨利·福特更是亲自主持了宪政国的大规模工业改革。与志同道合的实业家们一样，他依旧坚信宪政国是唯一能把美国从联邦派与工团主义者的双重暴政中解放出来的希望，其专业知识与影响力也得以供我们所用。我们当然也会善加利用！"
 NIC_Remembering_Stonewall_Jackson:0 "铭记石墙杰克逊"
 NIC_Remembering_Stonewall_Jackson_desc:0 "虽然宪政国不仅控制着南方各州，但不可否认，我们的大部分支持者都来自于此，在那些铭记着“命定败局”的人心中，有一位英雄奇侠：石墙杰克逊。无人可否认他的军事才华，我军的将军们也该努力学习他，成为我军士兵追随的传奇人物。魅力四射的军中声望、能在战火纷飞时严明军纪、如臂使指地调遣军队，这些都将是能让我军赢得未来战争的军官们的关键特征。此外，宣传一番老英雄肯定能鼓舞我国民心。"
 NIC_War_of_the_Ranger:0 "游骑兵之战"
 NIC_War_of_the_Ranger_desc:0 "宪政国内最不少的就是游击队员、拓荒者和民兵部队。从白人联盟到吃苦耐劳的猎人，再到偏远村庄中的地方治安维持团体，暴力且艰苦的生活方式早已深入我国人民骨髓之中。现代战争的烈度日趋高涨，早已无人在乎所谓的骑士风度，要是我们不把他们中的一些人吸收入伍，那可就是我们的失误了。这些荒野之人可以胜任特种部队与侦察兵的角色，也可以在我们的海军陆战队和山地部队的额外培训科目中派上用场。"
 NIC_Steel_Coated_Cavalry:0 "钢铁之骑"
 NIC_Steel_Coated_Cavalry_desc:0 "无论是轻骑兵还是重骑兵，旧时代的战争都是由马背上的人主导的，他们会趁机发动突袭，进而击溃敌军。坦克是新的骏马，车组成员便是新的骑士，为了签订更多的工业合同，巴顿已经发动了一切必要的关系。此外，为了配合坦克部队的机动，步兵部队也需要进行重新训练，一如当年的入伍初训。"
 NIC_Reinforce_Meat_Grinder:0 "加固绞肉机"
 NIC_Reinforce_Meat_Grinder_desc:0 "敌军皆被包围，阵地皆被占领，巴顿手下的士兵们颇有种操纵着绞肉机的错觉。深陷重围的敌军几近无力抵抗，但宪政国的狂飙猛进也激起了敌人的戒心。我们现在必须重新审视一番坦克的设计，巴顿也攒了老多建议和要求要提出来了。"
 NIC_Breakthrough_Above_Below:0 "上下求突破"
 NIC_Breakthrough_Above_Below_desc:0 "没了支援，装甲部队就什么也不是，充其量也只是野战炮的靶子。这便是大战的经验告诉我们的，所以，巴顿给自己的任务便是让空中侦察、战术轰炸与自己统领的地面部队间建立紧密的联系。这种联合作战将成为突破敌军防线的关键，更能让他的坦克能轻而易举地碾过敌人的土地。"
 NIC_Give_Them_Guts:0 "予其勇气"
 NIC_Give_Them_Guts_desc:0 "在巴顿看来，那些不能鼓起勇气身先士卒的军官实在无能之极。要想真正地领导别人，你就得和他们同甘共苦，在这个过程中让他们心服口服。巴顿早已在自己统领的军队中赢得了这种忠诚，但现在，他要求他的下属们也像他一样在所属部队中赢得这种忠诚。"
 NIC_Cannae_Austerlitz:0 "坎尼与奥斯特里茨"
 NIC_Cannae_Austerlitz_desc:0 "巴顿逐渐了解了战争中的一个独特细节：歼灭。战斗可以是敌我双方持续数小时的拉锯战，也可以是大战中那样耗时数月的苦战，还可以是战争艺术的充分体现。巴顿更偏爱候诊，从现在起，他将包围歼灭敌军作为一切军队机动的首要目标。无论在战略还是战术层面，每一只军队的目标都应当是包抄、袭扰、最终歼灭胆敢阻拦钢铁大军的敌军。"
 NIC_Take_Our_Stand:0 "死守立场"
 NIC_Take_Our_Stand_desc:0 "从南方到钢带，从大苹果到天使之城，上主真正赐福之地如今尽入我手，亦在我等刀剑的力量下重归团结。百战老兵光荣归来，年轻一代渴望参军报国，广大民众更是爱国情切，敌人为之心生恐惧。事到如今，除了我们对至真至善的永恒追求外，仅存在着以嫉恨目光觊觎美国的残余威胁。我们的现代化军队整装待发，准备突入任何必被征服的地狱，誓要将一切威胁彻底铲除。"
 NIC_Standing_Tall_idea:0 "美利坚屹立不倒"
 NIC_Standing_Tall_idea_desc:0 ""
 NIC_Research_Rush_idea:0 "研究热潮"
 NIC_Research_Rush_idea_desc:0 ""
 NIC_Dixiewood_idea:0 "迪克西坞的健康电影"
 NIC_Dixiewood_idea_desc:0 ""
 NIC_increased_military_spending2_desc:0 "美利坚最强悍的武器不是什么坦克，飞机，或者是步枪，而是那些参与生产这些物资的大型军工复合体。经过精心调校的工业装配线，足以支撑起一支规模近乎天方夜谭的军队，我们的备战进程正以惊人强度推进。"
 NIC_Magnolia_Blooms:0 "木兰绽放"
 NIC_Magnolia_Blooms_desc:0 "就像我们所深爱的木兰花那样，美国和她的人民再一次地崛起了。我们的生活逐渐回到轨道上去，而只有少数的怨恨等待着我们去平息，内战带来的荒芜也在这一刻被我们彻底扫净。和任何的花朵一样，我们的复兴也并不被世界所忽略。旧美国已经不复存在，但在经历了火焰与为其独立而奉献之后涅槃的美国又重新回到了世界舞台之上。"
 NIC_Igniting_Tredegar:0 "重燃特里迪加"
 NIC_Igniting_Tredegar_desc:0 "特里迪加是邦联最大的钢铁厂，也是当代的奇迹，其钢铁的产量在美国来说都无人可敌。这个地方是南北战争时期少数几个没有受到北方人打击的几个地方之一，并且一直繁荣到了现在。现在也是时候重振特里迪加钢铁厂荣光的时候了，而我们也会将其作为扩大全美军事工业这一工程目标相结合。"
 NIC_Mad_Dash_to_Progress:0 "向进步狂奔"
 NIC_Mad_Dash_to_Progress_desc:0 "随着内战的爆发，留给我们的许多时间与机会都悄然流去，而这些时间本可以留给我们去填补某些科技领域的空白，但美国却利用这段时间让自己不受世界的困扰，处于孤立之中。然而，在我们重新统一了国家之后，我们便可以在战争现代化领域投入大量的资源以快速赶上世界的步伐，进而不必对那些来自亚洲或者欧洲对我们的突袭感到惊慌。"
 NIC_Fordist_Engine_Militarized:0 "福特引擎军事化"
 NIC_Fordist_Engine_Militarized_desc:0 "在他搬到南方的几年前，在二次内战之前，甚至早在世界大战结束之前，亨利·福特就有过生产自己的轻型坦克模型的想法。官方将那未完成的机器称作福特1918型，又得名福特的3吨坦克。如今，亨利·福特掌握了强大的工业机器，他能够再度整合全美的工厂，根据近年来的经验教训和1918型坦克的经验教训，重新专注于制造一款真正可怕的战争机器。"
 NIC_Home_Grown_Dixiewood:0 "本地“迪克西坞”"
 NIC_Home_Grown_Dixiewood_desc:0 "与好莱坞这样的巨头竞争很难，但我们不得不这么做，尤其是对付这种只为烂片提供发展空间的公司。为了确保我们的政府，我们的遗产能够与全国其他地区保持一致，我们应该启动一个名为“迪克西坞”的宏伟项目。从迪克西坞中出厂的充满历史性，动作性与戏剧性的电影将会重塑美国各地所有家庭的品味。"
 NIC_Heroes_Never_Die:0 "英雄不死"
 NIC_Heroes_Never_Die_desc:0 "如果不是那些在我们出生之前便在前线为了国家所牺牲的战士们，我们所热爱的土地与在其上面的记忆就都会消失。在南北战争的英雄们如此，在第二次美国内战中那些为国奉献的英雄们也是如此。我们不应忘记他们为我国所做出的努力与奉献，而那些退伍军人们在战争中所积累的经验将会成功地教育未来几代的年轻人们。"
 NIC_Guns_of_the_South:0 "南方枪炮"
 NIC_Guns_of_the_South_desc:0 "我们必须面对一个可悲的现实，南方从来没有可圈可点的造枪历史。几乎所有闻名世界的枪支及其制造商都来自北方，无论是柯尔特还是史密斯和韦森，也就只有一个勃朗宁的例外，但其所在的犹他州也算不上南方。我们坚定的决心和意志可以弥补经验上的不足，我们一定要让南方拥有自己的枪支，这些枪支身上散发着狂野西部中的左轮手枪与M1卡宾枪的精神气质，亦可在我国各地广泛推广。"
 
NIC_sandinista_win:0 "桑地诺主义者胜利"
NIC_sandinista_win_desc:0 ""
