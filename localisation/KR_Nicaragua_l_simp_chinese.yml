 NIC_removed_monroe:0 "移除门罗主义"
 NIC_freeing_countryside_decisions:0 "统一我们的国家"
 NIC_freeing_countryside_decisions_desc:0 "我们国家的一半领土已经和我们隔绝了整整四年，但现在情况不一样了！在美国没有条件干涉我们的情况下，我们终于可以完全向他们摊牌：“尼加拉瓜必须是为尼加拉瓜人民而存在的！”"
 NIC_spreading_revolution_decisions:0 "传播革命"
 NIC_spreading_revolution_decisions_desc:0 "长期以来，来自北方的敌人洪都拉斯对我国构成了很大的威胁。他们支持反对我们的反对派流亡军队——这支军队的主体是在军事占领期间由美国人训练组建的——如今我们要做的第一件事就是在这段混乱时期确保他们和流亡军队们为他们至今为止对我们所做的准备好去地狱里好好忏悔。"
 NIC_send_troops_DMZ:0 "挥舞着旗帜向东行军"
 NIC_send_troops_DMZ_desc:0 "虽然我们国家的东部地区还没有正式解除武装，但由于美国政府发表的声明，宣称：“只要你们敢再移动一英寸，我们就把你们的人打包送走十英里！”。来自美国干涉的危险阻止了我们的部队深入这些革命中还未能解放的地区。当然，在美国已经无法再关注我们的情况下，每个人都知道自己崭新的使命是什么。为了拯救我们的人民，我们当然不敢再移动一英寸，我们要行军一百英里！"
 NIC_nationalize_UFC_assets:0 "国有化联合果品公司"
 NIC_nationalize_UFC_assets_desc:0 "由于我们对国家西部地区的全面控制，革命期间资本主义利益集团在我国的大买办——联合果品公司——曾一度撤往东部地区，在当地购买土地继续赚取利润以补偿他们在战争中的损失。然而美国内战为我们迎来的时代黎明使我们有能力对东部地区进行干预，一劳永逸地结束他们对尼加拉瓜人民残忍剥削的历史。"
 NIC_move_farmers_east:0 "向东部地区输出农业劳动力"
 NIC_move_farmers_east_desc:0 "最近，我国东部的解放使我们有充分的能力向这个地区迁移劳动力，迁移到该地区的农民和农场主可以合理地利用遗留下来的农场设施，从帝国主义手中收回属于我们人民的土地。"
 NIC_nicaragua_for_nicaraguans:0 "尼加拉瓜是为尼加拉瓜人民而存在的！"
 NIC_nicaragua_for_nicaraguans_desc:0 "联合果品公司和美帝国主义已几乎完全被驱赶出了我国。只要我们再往前迈进一步，尼加拉瓜即将获得一劳永逸的安全！"
 NIC_declare_monroe_dead:0 "门罗早就死了"
 NIC_declare_monroe_dead_desc:0 "门罗主义长期以来一直削弱着我们的国家斗志，阻止我们的军队意识到他们的真正潜力，甚至妨碍我们将永生的革命之火传递给我们的兄弟。但现在，一切都已经是过去式了！詹姆斯·门罗这个臭老东西在1831年就入土了，只有活死人才会相信棺材里躺着的东西，我们的国家只属于我们自己！"
 NIC_second_sandinistas_recruitment:0 "为桑地诺的军队招募新成员"
 NIC_second_sandinistas_recruitment_desc:0 "桑地诺的个人计划是“驯服”他的支持者，将他们变成一支稳定而强大的战斗力量。到目前为止这一计划进展顺利，一些人还建议我们扩编军队以帮助解决当前的冲突。"
 NIC_open_eastern_recruitment:0 "向东部地区开放征兵"
 NIC_open_eastern_recruitment_desc:0 "由于美国政府非正规地将这个地区划为非军事化区的缘故，东部地区一直被禁止征兵，但我们现在可以在没有美国干涉的情况下尽情地在这个地区开放征募。当然，该地区的人民可能并不会欣赏这一点……"
 NIC_test_honduras:0 "考验洪都拉斯"
 NIC_test_honduras_desc:0 "洪都拉斯长期以来一直是我国轻侮的对象，因为它操纵并支持着从我国流亡的国民警卫队，对我们的革命共和国也总是很不友好。但在正式开战之前，我们最好还是通过边境冲突来考验下洪都拉斯人的反应能力和军队实力。"
 NIC_make_honduras_angery:0 "火花飞舞的洪都拉斯"
 NIC_make_honduras_angery_desc:0 "洪都拉斯政府的腐败无能早已引起底层民众的不满，因此许多洪都拉斯人都对我们试图传播给他们的革命观念表达同情，这将有助于我们与洪都拉斯间矛盾的解决。"
 NIC_HON_unrest:0 "煽动"
 NIC_HON_unrest_desc:0 "作为对尼加拉瓜入侵的反应，我们的国民竟然选择反抗我们的统治。由于国家处于战争状态，我们对此无能为力。人们普遍逃避服兵役，社会不稳定开始日益加剧，所有这些因素加权综合后毫无疑问地将成为我们政府的沉重负担。"
 NIC_begin_liberation:0 "开始我们的民族解放事业！"
 NIC_begin_liberation_desc:0 "动手的时机已经成熟了！随着美国政府的垮台，洪都拉斯人正处于最虚弱的状态，这给了我们一个彻底解放他们的绝佳机会！"
 NIC_eliminate_mercenaries:0 "消灭雇佣兵"
 NIC_eliminate_mercenaries_desc:0 "联合果品公司派出的这些旨在削弱我们对东部地区控制的雇佣军必须立即得到清理！"
 NIC_spread_revolution_mission:0 "自由洪都拉斯！"
 NIC_spread_revolution_mission_desc:0 "洪都拉斯长期处于“革命者委员会”的统治之下，事实证明，该委员会比前军事政权更加专制也更加危险，并且他们仍然控制着我们流亡的反对派军队。如果我们希望确保我们自己和中美洲的安全，革命的火种就必须传播给他们！"
 NIC_revolution:0 "中美洲革命的发源地"
 NIC_revolution_desc:0 "尼加拉瓜是中美洲革命的发源地，它将努力扩大与释放自己的海外影响力以解放中美洲各国人民。"
 NIC_revolution_san_1:0 "中美洲革命的发源地"
 NIC_revolution_san_desc:0 "尼加拉瓜是中美洲革命的发源地，它将努力扩大与释放自己的海外影响力以解放中美洲各国人民。"
 NIC_revolution_san_2:0 "中美洲革命的发源地"
 NIC_revolution_san_2_desc:0 "尼加拉瓜是中美洲革命的发源地，它将努力扩大与释放自己的海外影响力以解放中美洲各国人民。"
 NIC_education_reform:0 "莫雷诺的改革"
 NIC_education_reform_desc:0 "莫雷诺总统就职后采取的第一项措施就是帮助国内的贫困人口。他从教育改革开始着手，建立地方学校并从整体上降低国内的文盲率。"
 NIC_education_economic_reform:0 "莫雷诺的改革"
 NIC_education_economic_reform_desc:0 "莫雷诺总统就职后采取的第一项措施就是帮助国内的贫困人口。他从教育改革开始着手，建立地方学校并从整体上降低国内的文盲率。他现在已经开始了自己改革的第二步骤，并试图将部分政府资金和来自少数上层阶级的财富分配给大多数未受过教育的人口。"
 NIC_remaining_UFC_influence:0 "挥之不去的美国影响力"
 NIC_remaining_UFC_influence_desc:0 "尽管桑地诺多次试图让尼加拉瓜脱离美国的影响，但由于我们的经济严重依赖于联合果品公司的出口，来自美国的影响力仍然挥之不去。只要联合果品公司还像老鹰那样在头顶注视着我们，我们就不能永远摆脱这种烦人的束缚。"
 NIC_remaining_UFC_influence_oof:0 "挥之不去的美国影响力"
 NIC_remaining_UFC_influence_oof_desc:0 "尽管桑地诺多次试图让尼加拉瓜脱离美国的影响，但由于我们的经济严重依赖于联合果品公司的出口，来自美国的影响力仍然挥之不去。只要联合果品公司还像老鹰那样在头顶注视着我们，我们就不能永远摆脱这种烦人的束缚。"
 NIC_remaining_UFC_influence_oof_2:0 "挥之不去的美国影响力"
 NIC_remaining_UFC_influence_oof_2_desc:0 "尽管桑地诺多次试图让尼加拉瓜脱离美国的影响，但由于我们的经济严重依赖于联合果品公司的出口，来自美国的影响力仍然挥之不去。只要联合果品公司还像老鹰那样在头顶注视着我们，我们就不能永远摆脱这种烦人的束缚。"
 NIC_move_autarky:0 "走向自给自足"
 NIC_move_autarky_desc:0 "虽然尼加拉瓜不可能在没有真正奇迹的情况下实现完全的经济独立，但萨卡萨已经采取了一些微小的行动来帮助我们减少对美国的经济依赖，包括改善我们的经济内循环并促进我们同其他国际大国间的贸易。"
 NIC_mercenaries_rampant:0 "雇佣兵猖獗"
 NIC_mercenaries_rampant_desc:0 "为了报复我们国有化他们的资产，联合果品公司在尼加拉瓜东部地区雇佣了一伙暴徒给我们制造麻烦，这支雇佣军活动猖獗，给该地区的生活造成了不小的混乱。人民对此已经感到很厌倦了，我们的军队也不断被他们分散注意力。"
 NIC_economic_backfire:0 "经济阵痛"
 NIC_economic_backfire_desc:0 "联合果品公司从我国撤出后，我们国家的经济出现了许多明显的投资漏洞，如果我们仍然希望像个正常国家那样维持运作，就必须弥补这些问题。"
 NIC_agriculture_reliance:0 "农业依赖"
 NIC_agriculture_reliance_desc:0 "我们的经济仍然极其依赖于农业出口，为了我们国家的利益考虑，我们将继续这样维持这个方向。"
 NIC_agriculture_reliance_2:0 "农业依赖"
 NIC_agriculture_reliance_2_desc:0 "我们的经济仍然极其依赖于农业出口，为了我们国家的利益考虑，我们将继续这样维持这个方向。"
 NIC_agriculture_reliance_3:0 "出口经济"
 NIC_agriculture_reliance_3_desc:0 "我们的经济已完全过渡到以出口导向型的经济模式，外国列强们只能从我们的国家购买到热带经济作物，虽然这带来了巨大的利润，但如果这些国家停止购买我们的产品，那么我们可能因为外汇紧张而陷入巨大的困扰之中。"
 NIC_foreign_profit_pullin:0 "出口利润"
 NIC_foreign_profit_pullin_desc:0 "我们的各种出口措施已经开始给我们带来更多的销售利润，但如果我们所依赖的国家经济下滑，我们本国的经济也可能随之出现大幅度滑坡。"
 NIC_strike:0 "罢工"
 NIC_strike_desc:0 "尼加拉瓜被占领以后，全国各地都举行了罢工活动以抗议这一事件，这导致我们政府的声誉受到了损害。"
 NIC_revolutionary_economy_beginning:0 "革命经济的开端"
 NIC_revolutionary_economy_beginning_desc:0 "政府现已正式启动“革命经济项目”，其主要目标是改革该行业的融资模式，在不允许任何投资者变得过于强大的情况下鼓励新投资者进入市场，并在尼加拉瓜国内普遍扩大产业规模。当然，完全脱离美国的做法已经开始损害我们的经济，但从长远来看，情况最终会得到改善的。"
 NIC_revolutionary_economy_2:0 "向革命经济过渡"
 NIC_revolutionary_economy_2_desc:0 "政府现已正式启动“革命经济项目”，其主要目标是改革该行业的融资模式，在不允许任何投资者变得过于强大的情况下鼓励新投资者进入市场，并在尼加拉瓜国内普遍扩大产业规模。当然，完全脱离美国的做法已经开始损害我们的经济，但从长远来看，情况最终会得到改善的。如今各项过渡工作已经有条不紊地开展起来。"
 NIC_revolutionary_economy_3:0 "向革命经济过渡"
 NIC_revolutionary_economy_3_desc:0 "政府现已正式启动“革命经济项目”，其主要目标是改革该行业的融资模式，在不允许任何投资者变得过于强大的情况下鼓励新投资者进入市场，并在尼加拉瓜国内普遍扩大产业规模。当然，完全脱离美国的做法已经开始损害我们的经济，但从长远来看，情况最终会得到改善的。如今各项过渡工作已经有条不紊地开展起来。"
 NIC_revolutionary_economy_4:0 "革命经济"
 NIC_revolutionary_economy_4_desc:0 "日前，我们的政府已经完成了“革命经济工程”，并从中取得了不错的成果。我们的经济对美国的依赖已经结束，取而代之的是与几个新的贸易伙伴的“平等合作”。国内工业正在发展，人民也对此感到很高兴。唯一可能伤害我们的是另一场全球经济崩溃，但这永远不会发生，对吧？"
 NIC_agrarian_reform:0 "农业改革"
 NIC_agrarian_reform_desc:0 "鉴于农业占我们出口的大部分，实施农业改革已经成为政府当前工作的核心。从长远来看，这对我们和我们的经济以及人民都有帮助"
 NIC_economy_assistance:0 "经济援助"
 NIC_economy_assistance_desc:0 "[OVERLORD.GetNameDefCap]已经向我们提供经济援助，帮助我们被占领的状态中恢复过来。"
 NIC_overlord_economy_assistance:0 "援助尼加拉瓜"
 NIC_overlord_economy_assistance_desc:0 "在我们对尼加拉瓜的占领之后，我们向他们提供了一些经济援助，帮助他们从战争中恢复过来。"
 NIC_beef_profit:0 "牛肉的利润"
 NIC_coffee_profit:0 "咖啡的利润"
 NIC_sugar_profit:0 "蔗糖的利润"
 NIC_banana_profit:0 "香蕉的利润"
 NIC_economic_ties:0 "经济纽带"
 NIC_economic_ties_desc:0 "我们已经开始同邻国和大洋之外的强国们建立经济联系。"
 NIC_economic_ties_foreign:0 "外国经济纽带"
 NIC_never_surrender:0 "为革命而战"
 NIC_never_surrender_desc:0 "我们的政府和人民甘愿献身于这项事业，不畏凶暴与艰险，放弃一切为了革命而战！\n§R如果我们偷渡或占领足够多的敌方领土，敌人就会投降§!"
 NIC_HON_never_surrender:0 "为生存而战"
 NIC_HON_never_surrender_desc:0 "尼加拉瓜人来了！长期以来，尼加拉瓜人一直都是中美洲的不祥之兆，现在他们真的向我国宣战来传播“革命”了。这是为了我们国家的生存而战，我们必须准备好牺牲一切！\n§R如果我们偷渡或占领足够多的敌方领土，敌人就会投降；坚持到尼加拉瓜人精疲力竭，敌人也会投降。§!"
 NIC_sandino_resistance_base:0 "桑地诺的抵抗"
 NIC_sandino_resistance_base_desc:0 "在前革命政府倒台之后，桑地诺第二次撤退到了南方的密林之中，并开始反抗现任政府。他的事业吸引了许多民众加入其中，这给我们的政府带来了巨大的麻烦。\n§R我们将遭受桑地诺分子的周期性袭击§!"
 NIC_sandino_resistance_low:0 "桑地诺的抵抗"
 NIC_sandino_resistance_low_desc:0 "在前革命政府倒台之后，桑地诺第二次撤退到了南方的密林之中，并开始反抗现任政府。他的事业吸引了许多民众加入其中，这给我们的政府带来了巨大的麻烦。\n§R我们将遭受桑地诺分子的周期性袭击§!"
 NIC_sandino_resistance_crushed:0 "镇压桑迪诺主义者"
 NIC_big_guard:0 "扩大国民警卫队"
 NIC_big_guard_desc:0 "为了确保我们的国家不会再陷入革命，我们已经开始扩大国民警卫队来保卫国家。"
 NIC_political_repression:0 "政治迫害"
 NIC_political_repression_desc:0 "我们已经开始努力压制其他政党，特别是那些对我们的政府有着绝对危险性的政党。"
 NIC_canal:0 "尼加拉瓜运河"
 NIC_secret_american_support:0 "美国秘密支持"
 NIC_presidential_power:0 "授权总统"
 NIC_eternal_president:0 "永恒的总统"
 NIC_reopened_trade:0 "开放贸易"
 NIC_reopened_trade_desc:0 "我们已开始恢复前革命政权试图关闭与非社会主义国家贸易的努力。将目光重新投向融入世界贸易的大潮。然而各国可能需要一些时间才能恢复对我国投资的信任……"
 NIC_dynastic_dictatorship:0 "王室专政"
 NIC_coffee_must_grow:0 "扩张咖啡种植园"
 NIC_no_bias_at_all_bro:0 "带偏见的宪法"
 NIC_tacho_gang:0 "塔肖胜利"
 NIC_foreign_companies:0 "外国公司"
 NIC_foreign_companies_desc:0 "外国公司开始涌入洪都拉斯，希望重建他们曾经享有的垄断地位。这也给我们带来了一些好处，尤其是在基础设施领域。"
 NIC_free_press_idea:0 "新闻自由"
 NIC_free_press_idea_desC:0 "政府正在着手建立新闻自由制度，使信息的传播比桑地诺总统在任时更加自由。"
 NIC_new_national_guard_idea:0 "新国民警卫队！"
 NIC_new_national_guard_idea_desc:0 "在夸德拉领导下我们成立了一支新的国民警卫队，他将比我们过去的军队更加职业化。虽然它目前的规模还不算大，但我们可以采取步骤加以改进。"
 NIC_new_national_guard_idea_cuadra_1:0 "新国民警卫队！"
 NIC_new_national_guard_idea_cuadra_1_desc:0 "在夸德拉领导下我们成立了一支新的国民警卫队，他比我们过去的军队更加职业化。它在征兵与进攻领域已经有了一定的提高，但目前来看改进空间很小。"
 NIC_new_national_guard_idea_vargas_1:0 "新国民警卫队！"
 NIC_new_national_guard_idea_vargas_1_desc:0 "在夸德拉领导下我们成立了一支新的国民警卫队，他比我们过去的军队更加职业化。由于巴尔加斯的存在，它已开始向保卫尼加拉瓜人民的立场迈进，但只有很小的改进空间。"
 NIC_new_national_guard_idea_cuadra_2:0 "新国民警卫队！"
 NIC_new_national_guard_idea_cuadra_2_desc:0 "在夸德拉领导下我们成立了一支新的国民警卫队，他比我们过去的军队更加职业化。它在征兵与进攻领域已经有了一定的提高，如果我们派遣他们占领其他国家来传播民主，在镇压反抗方面我们可以信任他们的责任感。"
 NIC_new_national_guard_idea_vargas_2:0 "新国民警卫队！"
 NIC_new_national_guard_idea_vargas_2_desc:0 "在夸德拉领导下我们成立了一支新的国民警卫队，他比我们过去的军队更加职业化。由于巴尔加斯的存在，它已转向一种防御性的原则，以便更好地保护尼加拉瓜人民，如果我们派遣他们占领其他国家来传播民主，在镇压反抗方面我们可以信任他们的责任感。"
 NIC_new_money:0 "货币兑换法"
 NIC_go_against_libs:0 "坚定反对自由主义"
 NIC_strong_executive:0 ""
 NIC_immigrant_influx:0 "尼加拉瓜，移民自由之地"
 NIC_president_republic:0 "尼加拉瓜总统"
 NIC_guard_no_fangs:0 "解除国民警卫队武装"
 NIC_legacy_of_rev:0 "自由主义革命遗产"
 NIC_democracy_n_shit:0 "刻骨铭心的民主"
 NIC_liberal_const:0 "1898宪法自由化"
 NIC_parliament_demo:0 "尼加拉瓜议会"
 NIC_controlled_guard:0 "国民警卫队的无形大手"
 NIC_dem_guard:0 "民主带入国民警卫队"
 NIC_controlled_sandinistas:0 "桑迪诺主义者在我们的注视之下"
 NIC_dem_sandinistas:0 "自由降临桑迪诺主义者"
 NIC_for_people:0 "政府为人民服务"
 NIC_military_bros:0 "尼加拉瓜的强大军队"
 NIC_health_for_all:0 "为人民服务全民医保"
 NIC_prospering_people:0 "繁荣昌盛的社会"
 NIC_cabuya:0 "卡布亚凯旋"
 NIC_undying_resistance:0 "永不放弃抵抗"
 NIC_undying_resistance_desc:0 "尽管桑地诺肉身已死，但他所代表的意志将永存于世。"
 NIC_no_Support:0 "缺乏民众支持"
 NIC_no_Support_desc:0 "军政府并不受到支持，这不过是另一种占领。我们的军队在乡间行军时，被人向他们投掷腐肉。我们必须补救缺乏支持的情况。"
 nic.1.t:0 "新尼加拉瓜共和国"
 nic.1.d:0 "美国军事占领尼加拉瓜并重新扶持保守派政治家阿道弗·迪亚斯出任国家领导人的行动，使尼加拉瓜逐渐成为美国在中美洲的傀儡。然而幸运的是，独立的希望并没有完全消逝。为了推翻美国傀儡政权，全国各地的自由主义者发动了武装叛乱，最终攻陷了首都并迫使阿道弗·迪亚斯逃往美国。然而，新自由主义政权几乎没有给尼加拉瓜社会带来什么实质性变化，前自由主义革命者何塞·马里亚·蒙卡达领导的政府仍然继续与美国人合作。在美国海军陆战队的帮助下，纳斯塔西奥·索摩查·加西亚建立了一支经过军事化训练的国家警察部队“国民警卫队”，他们的存在进一步巩固了现状的延续。\n\n因为对新政府的施政感到不满，包括胡安·包蒂斯塔·萨卡萨在内的数名前自由派革命者离开了该国，也有许多人开始组织反抗新政府的武装叛乱：年轻的弗朗西斯科·塞凯拉·莫雷诺在临近洪都拉斯边境的北部地区组织抵抗，而奥古斯托·塞萨尔·桑地诺则在南部发动了叛乱。在政府军部队的持续骚扰下，莫雷诺设法带领他在北方的400名抵抗军成员向南转进，随后加入了桑地诺和他300人的部队。这支会合后得到巩固的抵抗军积攒着与政府军对抗的游击战经验，缓慢地撤退到了南部的丛林。\n\n然而，这种情况不可能永远持续下去。缺乏武器弹药，甚至干净的水和面包，政府军的压力越来越强。对形势愈发绝望的桑地诺乘飞机前往墨西哥，试图在莫雷诺继续指挥战斗的同时获得其他国家的支持。在墨西哥期间，桑地诺与埃米利亚诺·萨帕塔会面，两人不仅找到了共同点，而且很快成为了很好的朋友。在法兰西公社与不列颠联盟的物资支持下，萨帕塔亲自陪同桑地诺和一小队墨西哥志愿者返回尼加拉瓜。\n\n成功的求援行动大幅提高了桑地诺的地位，其本人在国内的支持率开始上升，并鼓舞了反抗军一度低迷的士气，随后革命者们开始向北挺进。在革命军队的迅猛攻势下，美国海军陆战队被迫撤退到该国东部，而在首地区，对自由派政府积怨已久的居民在工团主义者的领导下组织了大规模示威游行。美国政府开始认为，落后的国民警卫队在当前处境下是没有希望的，命令海军陆战队继续帮助自由派保卫首都的代价高到令人发指。不久之后，“自由派”和他们的走狗国民警卫队也逃到了洪都拉斯，放弃了首都的守军让他们绝望地等待桑地诺的最后攻势。与此同时，因对前政府的行为感到憎恶而出走的胡安·包蒂斯塔·萨卡萨也从墨西哥赶回来帮助组建了尼加拉瓜革命政府。"
 nic.1.a:0 "为了革命！"
 nic.2.t:0 "解放日"
 nic.2.d:0 "今天是尼加拉瓜革命纪念日，这场伟大的战争使我们的国家终于完全地摆脱了美国人和他们的利益代言人，取得了宝贵的独立。萨卡萨和莫雷诺都是革命的功臣，但桑地诺更因其在革命成功背后的作用而获得了广泛的赞誉。公众对桑地诺的欢迎程度也因本次庆祝活动得到加深，但对于反对派的支持者们来说，这一天的到来只会加剧他们对这名“叛乱者”进一步的蔑视。他们声称这场庆祝活动“充满了邪教般的盛况和仪式，而桑地诺正试图给参与者洗脑”。"
 nic.2.a:0 "下一步是中美洲"
 nic.3.t:0 "胡安·萨卡萨的全国巡访"
 nic.3.d:0 "在最近的解放日庆祝活动中，桑地诺和他的支持者们受到了比其他党派更多的欢迎。为了摆脱这个不利信号，胡安·萨卡萨已经开始在全国范围内进行巡回访问，与选民见面交流政见和未来预期，希望他的亲民姿态能够确保选民在即将到来的4月选举中为他投票。目前来看，这场运动似乎取得了成功，但桑地诺的支持者——也就是被称为“桑地诺主义者”的人——现在声称萨卡萨不尊重解放日，桑地诺本人也做出了类似的表态。某些知名桑地诺派成员甚至公开呼吁对萨卡萨本人采取暴力。"
 nic.3.a:0 "看起来，这次选举将会异常激烈"
 nic.4.t:0 "胡安·萨卡萨的演讲"
 nic.4.d:0 "“在海外期间，我有幸与许多有影响力又善良的人成为了朋友，向他们学习了善政和政治实践的基本知识。因此我现在更加深刻地认识到，把我们目前的孤立状态归因于某种全球阴谋是愚蠢的。\n许多人常说国与国家间只有利益没有朋友，这种观点实际上过度简化了，国家也是建构起来的概念，真正起作用的是被国家这只面具遮掩起来的那些活生生的人和事。\n我们应当与那些支持我们反帝国主义倾向的同志们站在一起。为了尼加拉瓜的独立梦，为了中美洲的解放，所有这一切都取决于我们是否愿意在我们的外交政策采取更大的节制，抑制我们的愤怒，为人类的共同理想贡献更大的自我。我们的国家目前对自由思想的歪曲着实令人悲哀，但今天我站在这里希望大声地告诉诸位，我们决不能再背弃命运。谢谢你！”"
 nic.4.a:0 "自由革命党的180度大转弯！"
 nic.5.t:0 "桑地诺派起义"
 nic.5.d:0 "随着自由革命党支持率的飙升，桑地诺派激进分子开始故意破坏首都支持萨卡萨的各类自由集会。在革命卫队干涉了一场暴力示威活动之后，选举暴力活动达到了临界点。许多激进分子开始贬损桑地诺的声誉，因为他迄今为止拒绝采取任何行动来制止暴力。还有一些人甚至怀疑他其实就是暴力事件的幕后黑手。与此同时，萨卡萨则利用了这一局势的影响，他宣称这些暴行都是桑地诺和他的同党们组织的。"
 nic.5.a:0 "这对桑地诺而言可是不小的打击……"
 nic.6.t:0 "桑地诺发声"
 nic.6.d:0 "“以正义事业之名所犯下的那些针对我们的国家与人民的暴力是不可接受的。虽然这些只是少数人的行动，造成的问题也还算温和，但长此以往却肯定会使我们的国家四分五裂，阻碍我们将革命事业传播到中美洲，破坏我们解放全世界的宏伟夙愿。我恳求所有尚有一丝尊严的人们都冷静下来，恢复我们国家的和平！”\n\n桑地诺的公开演讲发表后，激进的桑地诺主义者们已经停止参与政治暴力活动。"
 nic.6.a:0 "这有助于恢复他的名誉"
 nic.7.t:0 "莫雷诺的年度访问"
 nic.7.d:0 "四年以来，莫雷诺坚持在乡下和我们国家最偏远的农村里进行巡访。虽然革命使他的社会地位有了显著的提高，但他仍然是农民的骄傲和追求的标准，农民们喜欢他，并乐于将他看作自己的一员。由于多年以来在农村地区的积极活动，莫雷诺的支持率得到了缓慢而稳定的上升。现在他成功地将自己定位为桑地诺与萨卡萨之间的妥协人选。对于他的参选，全国人民屏息以待。"
 nic.7.a:0 "人民当然喜欢与他们关系亲密的政治家"
 nic.8.t:0 "莫雷诺对当地儿童发表演说"
 nic.8.d:0 "“孩子们，永远不要忘记这一点，你们将是我们国家的未来。即使你感到绝望，即使我们失败了，你们也能继续接过革命的旗帜。我的本意是永远站在你们这些普通人的立场上……见鬼的，跟你们一样大的时候我既不识字也没有钱，但我有一颗蓬勃跃动的雄心！我要代表所有的普通人，无论他们是男人还是女人，是在香蕉园里剪叶子的佣工还是在路边乞讨的失地农民，只要他们是正直而善良的人们，希望永远不必经历与我一样的生活……”\n\n“为了更好的尼加拉瓜和中美洲！”在众人的欢呼中，看来莫雷诺又占领了一个村庄。"
 nic.8.a:0 "又一个支持莫雷诺的村子……"
 nic.9.t:0 "第二次大选"
 nic.9.d:0 "持续不断的竞选活动终于结束了，大选即将正式开始。尽管一开始人们预测桑地诺能够轻松赢得选举，但是最近，他支持率显然已经被萨卡萨和莫雷诺给夺去不少。\n\n萨卡萨的支持者主要集中于城市内的小康家庭与农村内的小地产所有者，他的支持者们普遍担忧另外两个候选人的社会财富分配政策会损害他们的利益。莫雷诺的主要支持基础在农村，农民阶级非常欢迎他。桑地诺的支持者来源则更加广泛：主要包括进步青年和他过去的革命战友们，他们无不热情地信仰着桑地诺的理念。每个人似乎都有机会赢得选举，那么最终的结果是……"
 nic.9.a:0 "桑地诺连任总统"
 nic.9.b:0 "莫雷诺成为了民心所向，当上了总统"
 nic.9.c:0 "人民被萨卡萨的自由主义革命思想吸引，选择了他当总统"
 nic.10.t:0 "桑地诺派成员在马那瓜集会"
 nic.10.d:0 "在所谓的“马那瓜集会”中，500多名桑地诺支持者开始首都举行针对萨卡萨的抗议游行。虽然起初这场集会是和平的，直到一群萨卡萨的支持者试图阻挠抗议活动时，在场人员的情绪引发了强烈反弹，他们强行驱逐了这些“游行破坏者”并导致一人死亡一人受伤。\n\n萨卡萨已经谴责了这些抗议活动者的暴力行为，但与上次不同的是，桑地诺没有对此发表任何声明。许多人开始把这看作是我们国家自由主义者与社会主义者间长期分裂的开始。不过萨卡萨则向公众承诺他仍然打算与桑地诺合作，毕竟站在反对压迫的立场上，革命者间的团结才是第一位的。"
 nic.10.a:0 "桑地诺最好不要越界"
 nic.11.t:0 "胡安·萨卡萨宣誓就职"
 nic.11.d:0 "今天上午11时，新任尼加拉瓜总统“胡安·包蒂斯塔·萨卡萨”正式宣誓就职。萨卡萨在就职典礼上提到了他的很多想法，比如他仍然希望带领国家挣脱美国的枷锁，确保中美洲其他地区也能够获得宝贵的自由。此外他还主张与其他新兴大国建立联系的意愿，因为这样做将更有利于尼加拉瓜脱离美国影响。\n\n社会主义者们普遍关注于他在演讲中所流露的“希望与自由主义而不是社会主义看齐”的观点。尽管萨卡萨的支持者们喜欢这种形式的变化，但这对于该国占多数的农业人口及敌对情绪日益高涨的桑地诺派而言则是一个令人担忧的迹象。如果萨卡萨希望安抚国内的社会主义者和其他派别，并为未来的选举赢得更多新的支持者，在他执政后恐怕需要更加谨慎行事。"
 nic.11.a:0 "向新的未来前进，尼加拉瓜！"
 nic.12.t:0 "农民们的抱怨"
 nic.12.d:0 "最近，我们国家东部的人民已经开始向我们抱怨联合果品公司对他们的虐待行为。这种情况无不悲哀地提醒着我们，虽然革命解放了这个国家，但有些地区仍然处在革命之前的环境里。虽然在美国依然具备干涉能力的情况下，完全反对该公司是不现实的，但我们也必须做些合适的事情来安抚国民。\n\n与深受东部人民喜爱的莫雷诺合作是比较受欢迎的解决办法，然而这么做却有可能导致许多政府权力归属向莫雷诺倾斜。当然，东部局势在未来发生变化的可能性很高。尽管有激怒请愿民众们的风险，也许给他们一个简单的承诺就足够了。"
 nic.12.a:0 "莫雷诺很了解这里的居民，他可以提供帮助"
 nic.12.b:0 "公众需要些耐心"
 nic.13.t:0 "人们对政府缺乏信心"
 nic.13.d:0 "由于在东部问题上我们愈发依赖莫雷诺来安抚民众，莫雷诺和尼加拉瓜乡村党正在变得越来越受欢迎。尽管这对他本人和整个国家都有好处，但却严重降低了我们在普通民众中的受欢迎程度。由于我们被迫借助党外人士来处理过国内问题，有些人开始认为我们的政府是虚弱的。或许将来某个时候，我们能够通过更加果断的行动和其他能够表现我们独立于他人的实例来证明他们的想法是错的。至于我们什么时候能得到这样机会在人民面前彰显自我……又有谁说的准呢……"
 nic.13.a:0 "我们只是想让他们高兴起来……"
 nic.14.t:0 "情况日渐好转"
 nic.14.d:0 "由于我们对东部人民的控诉反应冷淡，这使当地的人民进一步投入莫雷诺的怀抱。他本人也已经返回该地区去帮助当地人，我们在该地区仅有的一点支持也已化为乌有，现在我们的党在那些地方已经完全落后于莫雷诺了。\n\n更加令人担忧的是，由于首都桑地诺主义者们的情绪越来越不稳定，我们目前无法对此事件做出任何反应。或许将来我们在决策中必须更加小心。"
 nic.14.a:0 "莫雷诺的支持率上升了……"
 nic.15.t:0 "桑地诺谈社会主义"
 nic.15.d:0 "日前，桑地诺已决定在我国第二大城市莱昂发表演讲以吸引支持者。演讲内容概括了他的许多想法，比如宗教信仰在革命中的重要性，还有他与墨西哥人的交往心得。演讲的后半部分触及了一个敏感问题，即国内社会主义者与自由主义者间日益扩大的分歧。据他所说，曾经他也以为社会主义与社会自由主义者的追求是相似的，然而实践证明二者差异显著。他希望这些矛盾在未来能够得到妥善的解决，以保障尼加拉瓜的革命事业能够有条不紊地传递下去。毕竟对于桑地诺来说，解放中美洲的意义显然比实现个人野心更重要，没错吧？"
 nic.15.a:0 "社会自由主义与社会主义是一回事，难道不是吗？"
 nic.16.t:0 "建立新的关系"
 nic.16.d:0 "由于自由主义者们注重经济独立以摆脱美国影响，现在我们遇到了一个艰难的障碍。因为现实原因，尼加拉瓜要保持真正意义上的独立自主是过分理想主义的，这就要求我们至少在一定程度上依赖一个大国。因此，在革命事业能够继续推进之前，为了消除美国的影响，我们必须同一个新的列强建立紧密的经济联系。\n\n首先被考虑的对象是德国，德国已经对我们南方的兄弟国家哥斯达黎加产生了极大的影响，并已被证明是它的宝贵投资者。然而，在控制势力范围的意愿上德国很像美国，他们的最终目标一定是迫使我们完全依靠他们生存，即使短期内这么做可以为我们带来潜在的好处。另一种可能性则存在于加拿大，但他们显然会更重视社会主义对他们带来的威胁。如果我们愿意同其他社会主义者们分裂，他们可能更愿意帮助我们。尽管很显然，这种情况永远不会发生。"
 nic.16.a:0 "德国能够帮助我们在国际上立足"
 nic.16.b:0 "加拿大可以帮助我们抵御美国的威胁"
 nic.17.t:0 "[From.GetNameDefCap]想要与我们增加联系"
 nic.17.d:0 "尼加拉瓜大使最近来找我们谈了一笔交易。为了摆脱美国的影响，他们希望与我国建立新的贸易协定，同时建立外交关系。这项投资在未来可能带来许多好处，尼加拉瓜的各种经济作物将主要出口到我们，而不是美国。"
 nic.17.a:0 "为我们的新朋友欢呼！"
 nic.17.b:0 "中美洲是美国的势力范围"
 nic.18.t:0 "[From.GetNameDefCap]同意了！"
 nic.18.d:0 "[From.GetNameDefCap]已经同意了我们的交易。虽然许多人确实庆祝我们能与那个傲慢的北方邻国断交，但我们政府内部的许多人担心与[From.GetNameDefCap]这样和美国同样是反动势力的国家建交可能会让我们的国家沦入另一个帝国主义的桎梏。"
 nic.18.a:0 "希望这能削弱美国的影响力"
 nic.19.t:0 "[From.GetNameDefCap]拒绝"
 nic.19.d:0 "[From.GetNameDefCap]拒绝了我们提出的加强两国关系的提议，声称“这样做会使他们与美国的关系紧张，这是不可行的。”这给萨卡萨和他的总统任期带来了巨大的抨击，一些人声称现政府是“美国猪”。革命热情高涨，人们开始谈论如何革掉革命的命。"
 nic.19.a:0 "美国仍在密切监视着我们，我们的人民也是"
 nic.20.t:0 "桑地诺与莫雷诺的合作"
 nic.20.d:0 "最近，桑地诺与莫雷纳都在莱昂会面，那里现在已经成为了他们政党的小型运营中心。会谈结束后二人即向公众宣布，国家主权阵线将与尼加拉瓜乡村党加强合作并希望能够帮助其中一方赢得下一次选举。毫无疑问，他们已经准备好携手排挤自由革命党了，至于这种做法是否会有效还有待观察，但这警告我们更加关注国内的政治局势。"
 nic.20.a:0 "万岁？"
 nic.21.t:0 "新“桑地诺主义者”"
 nic.21.d:0 "最近，桑地诺开始尝试按军事标准训练他的支持者，希望他们能够成为一支有组织有纪律能够参与解放中美洲斗争的有效战斗力量。虽然他目前还只是设法把他们起来进行训练，但眼下他已经开始计划组织演习，并声称他们将在一个月内做好部署准备。虽然这对军队来说是个好消息，但如果桑地诺在未来尝试什么越界的事情，这可能会带来麻烦。对我们稍微有利的是，他们的少数支持者认为这种做法并不可取而转向支持萨卡萨。"
 nic.21.a:0 "为了革命，我们当然会允许的"
 nic.21.b:0 "我们不能冒这个险"
 nic.23.t:0 "弗朗西斯科·塞凯拉·莫雷诺宣誓就职"
 nic.23.d:0 "今天上午12时06分，弗朗西斯科·塞凯拉·莫雷诺宣誓就任我们新尼加拉瓜共和国的第二任总统。他的就职典礼热闹非凡，许多从未到过首都的人专程从全国各地赶来只是为了亲眼目睹他成功当选的这一刻。莫雷诺总统承诺将带领尼加拉瓜走向一个新的方向，为了那些常被忽视的下层民众，为了那些曾经像他自己那样被遗忘的人。"
 nic.23.a:0 "底层民众们崭新的一天！"
 nic.24.t:0 "莱昂农民的庆祝活动"
 nic.24.d:0 "尽管从莫雷诺的第一个总统任期开始为止还没有真正做什么，但莱昂的很多人已经聚集在一起庆祝他们的英雄。莫雷诺该行政区内具有非常稳定的支持，因为他的游击抵抗就是从这里开始的，这对北方人民来说是一个神圣的象征。莫雷诺到目前为止还没有就此事发表任何评论，以避免政治观点不同的人批评他试图在自己周围制造“邪教”。"
 nic.24.a:0 "人们不会忘记他们的英雄"
 nic.25.t:0 "对财富分配政策的抱怨"
 nic.25.d:0 "能够设法通过自己的努力为家庭过上体面生活的尼加拉瓜人并不多，但他们的声音总是很响亮。最近他们已经开始公开抱怨政府的财富分配政策。考虑到他们在日常生活中已经开始入不敷出，这项政策毫无疑问会给他们产生激烈的影响。这可能使更多的尼加拉瓜中产阶级破产。如果我们希望在未来继续推行这些政策，就必须要解决这个矛盾。"
 nic.25.a:0 "我们将继续实施这些政策"
 nic.25.b:0 "我们将尽力满足他们的需要"
 nic.26.t:0 "自由主义者抗议"
 nic.26.d:0 "继续推行财富分配政策的决定已经产生了我们预料到的影响，伤害了那些能够在尼加拉瓜过上体面生活的公民。全国各地的中产阶级走上街头抗议财富分配，而下层民众则举办反抗议活动来抵制他们的主场。有产阶级们声称他们“被社会主义背叛了”，并逐渐放弃了他们对总统的支持，转而投向自由革命党候选人萨卡萨的怀抱。\n\n这次事件使莫雷诺陷入了相当危险的境地。尽管他仍在农村阶级中拥有庞大的支持基础，但此举已经导致他进一步地疏远了那些不太欣赏社会主义的人，将他们完全推到了自由主义者们那边。莫雷诺希望在事情过去以后能够重新获得他们的信任，但这对国家主权阵线而言是一个严峻的挑战。"
 nic.26.a:0 "我们不可能让每个人都满意"
 nic.27.t:0 "来自奇南德加的抱怨"
 nic.27.d:0 "即使在第一次选举期间，奇南德加地区的居民也一直为莫雷诺提供了非常稳定的支持，他在该地区获得了超过80%的选票。这一切都是由于他在莱昂被击退之后，就转移到了奇南德加继续进行北方的抵抗行动。当地的人们非常欣赏他和他背后所代表的事物，至少他们过去是这样的。\n\n由于奇南德加颁布的分配政策较弱，他最近的支持率下降到了令人担忧的地步。过去对莫雷诺的支持率为80%，现在降到了40%，许多新选票都流向了另一位受欢迎的社会主义候选人桑地诺。虽然莫雷诺和桑地诺关系良好，相互尊重，但是一想到那些曾经把他视为英雄的人如今却这样对待他，莫雷诺就深感痛心。"
 nic.27.a:0 "他们很忠诚……"
 nic.28.t:0 "学校建设"
 nic.28.d:0 "莫雷诺总统最近实施的教育项目已初见成效，第一所学校正式竣工。它被称为“尼加拉瓜国语学校”，旨在作为尼加拉瓜国家教育体系的起点。这所学校的办学目标是教会他的学生如何进行基本的阅读和写作。"
 nic.28.a:0 "为了一个更有文化素养的未来！"
 nic.29.t:0 "桑地诺与莫雷诺举行会谈"
 nic.29.d:0 "今天，莫雷诺与桑地诺在莱昂举行了会谈。没有人知道会谈的议题是什么，但有传言说，为了真正做好解放中美洲的准备，二人计划成立一个联合政党。革命自由党人萨卡萨和他的支持者对这一消息深感顾虑，因为两党合并可能导致他在未来选举中获胜的可能性变得微乎其微……甚至完全为零。"
 nic.29.a:0 "让我们看看接下来会发生什么"
 nic.30.t:0 "萨卡萨与桑地诺祝贺莫雷诺当选"
 nic.30.d:0 "莫雷诺的就职典礼受到了普遍的欢迎，甚至连关系对立的候选人萨卡萨与桑地诺也出席并祝贺了他的当选。萨卡萨说他是一个“真正值得尊敬的人”，桑地诺则说“他永远是我的犯罪搭档”。莫雷诺已经在桑地诺与萨卡萨的支持者中得到了普遍的认可，许多人认为莫雷诺的执政前景一片光明。"
 nic.30.a:0 "一个真正伟大的共和国！"
 nic.31.t:0 "莫雷诺的酗酒问题"
 nic.31.d:0 "在今天“就有关反对财富分配政策的抱怨”而进行多方商榷的国务会议上，莫雷诺整整迟到了三十分钟。他显然完全喝醉了，坐下时差点跟着椅子跌倒。在设法稳住座位后，他开始对会场内的许多人大喊大叫，即使他同意他们的意见。此外在会议期间他还昏倒过三次，还几乎在众人面前呕吐。\n\n莫雷诺自从成为游击队员以来就有酗酒的问题，由于之前他克制的不错，许多人都认为在从政后已经克服了这个问题。有人猜测是他重新酗酒的原因可能是因为执政中面临的压力，但他已经向大家道歉并承诺再也不会做这样的事情了。"
 nic.31.a:0 "希望只是这次……"
 nic.32.t:0 "桑地诺的支持者组织庆祝活动"
 nic.32.d:0 "桑地诺的成功当选立即在他忠诚的支持者中引起了强烈反响，日前他们已经在首都举行了盛大的庆祝活动。令人惊奇的是，这次庆祝活动并没有像过去他们组织的其他抗议与庆祝活动那样富有暴力色彩。桑地诺和其他人则将此描述为“尼加拉瓜走向和平与革命的重要一步”。当然并不是所有人都相信他们的说辞，他们认为这不过是桑地诺为了公众能忘掉他们曾经的暴力行为而演出的假象罢了。"
 nic.32.a:0 "也许这是向和平的过渡？"
 nic.33.t:0 "桑地诺的就职典礼"
 nic.33.d:0 "桑地诺的就职典礼受到了普遍的欢迎，最引人注目的出席者是莫雷诺，他祝贺了桑地诺的当选。另一个——或者说一群——重要的出席者是桑地诺派的支持者们，他们不停的尖叫和庆祝以至于被认为对活动造成了轻微干扰。然而大家都注意到萨卡萨根本没有来，甚至也没有对此发表任何声明。这无疑加剧了尼加拉瓜社会主义阵营和自由主义阵营之间强烈的隔阂。但谁知道正在发生什么呢，也许他只是忘了……？"
 nic.33.a:0 "现状将得到维持"
 nic.34.t:0 "桑地诺与支持者们会面"
 nic.34.d:0 "日前，桑地诺在莱昂召集了他的支持者们与他进行一次面对面沟通，许多已知的桑地诺派领袖都兴高采烈地出席了这场活动。他们本以为他们会因为自己在桑地诺竞选中所取得的成就而得到表扬，结果后者嘲弄了他的支持者们的暴力行为如何在竞选期间损害了他的声誉。这种反应在他的支持者中间引起了强烈回响，在桑地诺面前，他们相互乱作一团。桑地诺派领袖们离开时看起来非常沮丧，传言称，桑地诺派正努力尝试把自己变成一个更简明而不那么暴力的组织。"
 nic.34.a:0 "后退一小步，前进一大步"
 nic.35.t:0 "自由主义者抗议"
 nic.35.d:0 "针对萨卡萨没有参加总统就职典礼所引起的担忧很快得到了证实。日前，在马塔加尔帕发生了一场自由主义者组织的示威活动，抗议该地区缺乏军队保护。由于美国的干涉，我们没有始终没有在该地建立稳定的控制而不得不让军队封锁这个地区，人民仍然受到美国的严重影响。请愿者希望我们正式入驻当地，把美国支持的土匪们赶出去，但这显然我们所能做出的选择之一，因此我们只有两条路可走。要么无视抗议，要么宣布平息该地区的示威活动不合法。"
 nic.35.a:0 "让他们继续抗议吧"
 nic.35.b:0 "宣布示威活动不合法"
 nic.36.t:0 "社会主义者们的会谈"
 nic.36.d:0 "桑地诺和莫雷诺会面讨论了最近在马塔加尔帕所发生的自由主义示威运动，许多人认为这是萨卡萨和自由革命党故意扰乱桑地诺施政的策略。许多提议被作为解决方案提了出来，甚至有人说要取缔自由革命党，但这种激进的想法很快就被否决了。最终，会谈双方都同意向萨卡萨施压要他对此做出解释，关于之后双方该采取什么行动则再取决于他的回应。"
 nic.36.a:0 "国家正面临一场突然转变……"
 nic.37.t:0 "自由主义者退出革命"
 nic.37.d:0 "作为对社会主义者们的回应，萨卡萨向人民和他的追随者进行了公开讲话。他的回应表示，尼加拉瓜的自由革命已经死去了，新的国家是一个“正在形成的社会主义国家，一个忘记自己最初目标的国家”。为此他已打算从此退出政坛。许多人都支持他的表态，宣布除非问题得到缓和，他们也拒绝参加未来的选举。桑地诺对这个反应感到由衷的失望，因为他看到这个曾经被他视为革命共和国的国家似乎正在自己的脚边慢慢倒下。"
 nic.37.a:0 "分歧已经开始显现，但革命还是第一位的"
 nic.38.t:0 "被驯服的桑地诺派"
 nic.38.d:0 "作为对共和国自由派退出选举的反应，桑地诺开始集中力量训练那些“桑地诺主义者”。把他们训练成小规模，“无组织”的军事单位，以方便他们在真正的军队推进过程中更好地瓦解敌人。但比起这些，更多人担心这支军团可能会在没有人注意的情况下做些什么额外的事情——毕竟他们称得上是恶名昭彰——但桑地诺已经向民众承诺他们会承担起维持秩序的使命。桑地诺说：“他们将证明自己是我们向中美洲传播革命与上帝之光的关键。”"
 nic.38.a:0 "希望他们能守规矩……"
 nic.39.t:0 "桑地诺派武装挥舞着旗帜向东行军"
 nic.39.d:0 "不管桑地诺之前承诺了什么。总之，大概在今天中午的时候，桑地诺派武装试图向东挺进美国设立的“非军事区”。幸运的是，在他们靠近边境时，真正的军队及时阻止了他们。但我们还是有可能因此与美国发生冲突，因为他们离红线太近了。从现在开始，我们必须小心谨慎地监视这支不怎么听话的部队，除非我们希望未来有更多类似的险情发生。毕竟，在国内政治分歧日益激化的当下，与美国公开为敌并非最佳选。我们只能把矛盾放到以后再去解决，尽管桑地诺派成员不希望如此。"
 nic.39.a:0 "一群乌合之众……"
 nic.40.t:0 "美国日渐动荡"
 nic.40.d:0 "随着美国大选的结束，越来越多人开始注意到美国国内的动荡局势正在日趋恶化。从抗议到普遍的政治冲突，许多人都预言这个压迫我们人民如此之久的巨人即将倒台。这种可能性大幅提高了民众们的士气，为东部民众带来了更广泛的希望，他们预测，总有一天，他们会把美国的影响力从家乡彻底抹去。然而之后的事情又有谁知道呢。说不定美国内部争议的结局可能是为我们送来一个能够满足我们未来需要的新盟友呢？"
 nic.40.a:0 "我们的机会可能很快就会到来"
 nic.41.t:0 "美国陷入混乱"
 nic.41.d:0 "此前预测的美国动乱正式爆发，美利坚巨人终于倒下了！虽然对他们来说恐怕是个灾难，但这为我们的未来提供了一个绝佳的时机。尼加拉瓜东部被封锁了太久的地区终于可以回到我们的怀抱了，我们现在有能力为自己夺取这些土地，彻底消除帝国主义在我国的影响。人们争相庆祝这个时刻，现在是时候站出来保卫我们的国家了！"
 nic.41.a:0 "机会来了！"
 nic.42.t:0 "自由主义者的抗议"
 nic.42.d:0 "随着入侵洪都拉斯行动的开始，许多自由主义者出人意料地站在我们的反面抗议革命的入侵与蔓延。他们声称洪都拉斯已经成功地将自己转变成一个自由民主的和平国家，没有必要为了这些与我们观点一致的人而白白浪费尼加拉瓜人的鲜血和枪炮。许多消息来源指出这些抗议活动的幕后策划正是萨卡萨本人！他组织这些活动的目的显然是试图为自己争取总统的位置，而向公众营造一种“社会主义者正在将自由派边缘化”的假象。"
 nic.42.a:0 "太愚蠢了……"
 nic.43.t:0 "社会主义者的抗议"
 nic.43.d:0 "随着入侵洪都拉斯行动的开始，许多社会主义者对此感到十分苦恼。他们并不将此举认为是我们解放洪都拉斯的尝试，而觉得我们的目的是在中美洲排挤社会主义而支持自由主义。正如许多人所看到的那样，洪都拉斯的旧势力被推翻后，取而代之的却是一个社会主义政府，这无疑是社会主义者对自由派的间接压制。关于这个问题在共和国内部产生的分歧，最直言不讳的就是桑地诺本人，有传言称，为了防止“自由主义者的背叛”，他已经开始扩大桑地诺派武装的规模。"
 nic.43.a:0 "他有点偏执……"
 nic.44.t:0 "招募阿韦拉多·夸德拉"
 nic.44.d:0 "阿韦拉多·夸德拉。尼加拉瓜人都知道他曾在桑地诺革命期间受雇与国民警卫队和美国人站在一边。尽管他曾抵抗过桑地诺和他的军队，最终夸德拉还是被允许留在尼加拉瓜，这给他带来了很大的争议，而他宣称自己只是希望躲过那段最艰难的时期，而美国人迫使他如此而为之。桑地诺对他人格上的蔑视使他愈发靠拢与桑地诺关系不佳的自由派阵营，以此展现对桑地诺的抵抗姿态。\n\n出乎意料的是，今天，萨卡萨本人决定正式雇佣他来重组共和国的军队，使之结构更具专业化。此举几乎立即遭到了来自社会主义阵营的反弹。毫无疑问，因此导致的骚动将会进一步加剧。"
 nic.44.a:0 "这是必要的一步"
 nic.45.smalltitle:0 "社会主义阵营的小型抗议活动"
 nic.45.bigtitle:0 "社会主义阵营的大型抗议活动"
 nic.45.small:0 "尽管引起了些许骚动，社会主义阵营方面对我们重新起用夸德拉的反应比预期的要小得多。在很大程度上来说，反对者甚至未能组织起一场有效的运动来做出回应。自由派方面的一些人指出，正是由于我们对洪都拉斯的成功解放，极大地提振了公众对政府的信心，间接地降低了我们面对社会主义者的压力。虽然取得了这样的成功，我们还是应该对当前的形势予以充分的重视，确保社会主义者们当前有限的异议不会逐渐发展起来。"
 nic.45.big:0 "启用夸德拉的做法引起了社会主义阵营的极端反应。由于政府解放洪都拉斯的失败尝试，此举被视为萨卡萨为确保其政权稳定的绝望之举。很显然，这个谣言并不完全是假的。因为自洪都拉斯战争失败以来，自由党的支持率便急剧下降，如果放任这些抗议活动继续扩大，自由革命党就只有依靠奇迹才能继续支撑下去了。"
 nic.45.a:0 "也许这就是暴风雨前的宁静……？"
 nic.46.smalltitle:0 "桑地诺支持社会主义者"
 nic.46.bigtitle:0 "社会主义阵营团结起来"
 nic.46.small:0 "令人震惊的事情发生了，桑地诺正式决定鼓动社会主义者向现任政府发难。他宣布萨卡萨政府是不合法且反革命的，他的执政是对革命民主原则的巨大威胁。这种做法被视为桑地诺的绝望之举，因为自从在洪都拉斯获胜以来，萨卡萨的支持率就一直在上升。虽然社会主义者人数众多，但大多数人认为他们构成不了真正的威胁，尤其是在莫雷诺还没有宣布支持这项事业的情况下。"
 nic.46.big:0 "莫雷诺和桑地诺似乎都支持日益壮大的社会主义与反自由主义运动。他们的支持在很大程度上统合了国内的社会主义阵营，共同反对他们的敌人萨卡萨和政府中的自由派。这种全新的、看不见的威胁已经把现任政府置于极大的危险之中，许多人认为时间已经很紧迫了，一场真正的社会主义革命即将到来。"
 nic.46.a:0 "看来是时候了……"
 nic.47.t:0 "莫雷诺的中立"
 nic.47.d:0 "尽管最初桑地诺认为莫雷诺会支持自己的直接干预，但莫雷诺似乎已经离开了桑地诺，因此他可能被迫独自反抗自由派政府。桑地诺收到了莫雷诺一封简短的回信，莫雷诺祝他在事业上好运，以及做了一段相当于莫雷诺准备从政界告别的总结。他的其他追随者似乎也跟从了他的脚步。在他们的领袖即将离去之际，乡村党的社会主义者们努力避免在斗争中倾向任何一方。"
 nic.47.a:0 "对于我们而言是个便利"
 nic.48.t:0 "总革命爆发"
 nic.48.d:0 "桑地诺与莫雷诺的联合使我们的政府陷入了艰难的处境。解放洪都拉斯的尝试失败后，自由派的民意支持率日益减少，这是一个令人忧心的迹象。但现在，民众心中对政府的仇恨似乎终于有机会得到完全释放。越来越多的人走上街头反对现政府并希望把我们弹劾下台。支持桑地诺和莫雷诺声势愈发宏大，由于桑地诺派组织的存在，暴力事件也在街头大氛围爆发。尼加拉瓜变成了一个比以往更加危险的地方。"
 nic.48.a:0 "我们真的那么讨厌吗？"
 nic.49.t:0 "自由派被要求下台"
 nic.49.small:0 "桑地诺和他支持者似乎已经正式要求现任政府下台，支持桑地诺担任总统。我们的政府目前牢牢控制着这个国家，随着大多数人开始相信这点，社会主义者越来越成为政治的边缘角色。许多人都告诉我们，为了一劳永逸地消除社会主义的威胁，我们完全不理会这种无礼的要求。"
 nic.49.big:0 "该国的社会主义阵营似乎一致要求现任政府尤其是萨卡萨本人下台。由社会主义者接管政权并在一个月后将举行新的选举。社会主义的威胁使很多人感到担忧，一些政府官员建议我们在暴力事件进一步升级前和平下台，而强硬派则固执地认为，为了捍卫自由主义和我们国家的未来，我们必须坚持到底。"
 nic.49.a:0 "萨卡萨同意辞职"
 nic.49.b:0 "萨卡萨拒绝辞职"
 nic.50.t:0 "社会主义者游行"
 nic.50.d:0 "社会主义者已正式在首都组织游行，试图通过武力手段将萨卡萨驱逐下台。如果我们能正确处理这种情况，国家形势可能会好转，但我们不知道这能为我们带来多大的支持。如果出现最坏的情况，我们需要做好准备。"
 nic.50.a:0 "这是左翼联盟吗？"
 nic.51.t:0 "首都冲突"
 nic.51.small:0 "正如预测的那样，游行从一开始就没有多少吸引力，只有少数首都居民加入了桑地诺孤注一掷的行动。军方应该能够很好地镇压在反抗运动的最后喉舌，但发生在上个月的镇压行动似乎已经影响到了他们的思想，军营里到处是关于叛变的窃窃私语。眼下只需要一朵浪花就可能倾覆我们这条不堪重负的大船了。"
 nic.51.big:0 "社会主义者在首都获得了大量的支持，他们相当顽强地团结在一起，军队驱逐他们的行动很快陷入僵局。而军人们很快就会因为上个月以来的无效镇压而感到疲惫不堪。首都民众们预测，军队内部发生叛变的可能性很高，他们可能希望以另一种方式一劳永逸地结束这场僵局，但只有未来才知道会发生什么。"
 nic.51.a:0 "萨卡萨和自由党仍然掌权"
 nic.51.b:0 "军队叛变，社会主义者胜利了"
 nic.52.t:0 "尼加拉瓜的新变化"
 nic.52.d:0 "令人震惊的消息传来！桑地诺和他的支持者在尼加拉瓜再度掌权，萨卡萨总统已经被驱逐下台！他现在已经逃到了我们的国家，由于这些变化，我们现在只能自己靠自己了。不稳定的形势席卷了这个国家的许多地区，我们的政府在行动中必须更加小心，以免打破眼下温和的平衡。"
 nic.52.a:0 "可怕的消息"
 nic.53.t:0 "前总统埃米利亚诺·查莫罗·巴尔加斯"
 nic.53.d:0 "为了建立真正的民主，萨卡萨正式邀请流亡总统埃米利亚诺·查莫罗·巴尔加斯返回尼加拉瓜。从技术上讲，正是巴尔加斯发起了1926年革命，发动政变推翻民选总统，引发美国干涉使阿道弗·迪亚斯重新掌权。在此期间萨卡萨曾经担任国家的副总统，使他与巴尔加斯的关系保持良好。自从萨卡萨革命以来，他最担心的就是人们将他的领导看作是“自由派”的独裁，国内缺乏反对党，而人民也为此开始攻击他。因此，允许少量的异见存在将挽回他在人民中的支持。"
 nic.53.a:0 "希望这将确保民主"
 nic.54.t:0 "新的选举日期公布"
 nic.54.d:0 "今天，萨卡萨宣布将在最近的革命一个月后举行新的选举。从目前的形势来看，萨卡萨下台的可能性微乎其微，甚至为零。邀请巴尔加斯回到尼加拉瓜可能会改变自由主义者在这个国家所占据的主导地位。"
 nic.54.a:0 "愿最佳者胜出"
 nic.55.t:0 "保守党改组"
 nic.55.d:0 "一定程度上来说，邀请巴尔加斯回到尼加拉瓜的结果是可预见的，因为他必须对这支自20世纪20年代开始就处在他领导下的保守党进行改组，为即将到来的总统竞选做好准备。该党内部成员现在包括一些前总统，以及在革命期间反对桑地诺的人。直到目前为止，该党得到的回应大部分还是温和的，许多人因为对萨卡萨驱逐社会党并在首都获得微弱的支而持心存怨恨。虽然他们赢得选举的可能性不是最高的，但是民众的态度总是容易发生转变的，这取决于每个政党将以什么方式参与这场竞争。"
 nic.55.a:0 "让我们拭目以待"
 nic.56.t:0 "政党竞选活动"
 nic.56.d:0 "为了赢得选举，保守党和自由党都在尽最大努力进行竞选活动，他们到各个地方展开活动以试图说服民众投票。许多人注意到，由于保守党被普遍视为处于劣势的政党，所以他们在这方面付出了额外的努力，即使他们的竞选活动仍有可能被公众置若罔闻。"
 nic.56.a:0 "选举季总是会发生些有趣的事"
 nic.57.t:0 "[GETYEAR]年大选"
 nic.57.d:0 "预期已久的尼加拉瓜选举日终于到来了，自由党和保守党在人民心目中获得了更广泛的支持。这两个政党都将竭尽全力参与竞选以确保人民将更多的选票投给他们。当选票将要截止时，本次选举的获胜者将是……"
 nic.57.a:0 "自由党！"
 nic.57.b:0 "保守党！"
 nic.58.t:0 "新国民警卫队"
 nic.58.d:0 "在30年代初的革命过后，由于缺乏专业化的军队，阿韦拉多·夸德拉曾参照美国的模式组建新的国民警卫队。作为国民警卫队的一员，夸德拉的新卫队一直受到总统的监视，在保证它们不会像其他国家的军队那样卷入政治的同时，确保他们的规模足以保卫国家。到目前为止，情况发展都很顺利，新国民警卫队使人民在外国势力面前有充分的安全感，并且相信他们的民主正在得到强有力保障。"
 nic.58.a:0 "太好了！"
 nic.59.t:0 "关于国民警卫队的纠纷"
 nic.59.d:0 "随着国民警卫队的规模不断壮大和发展，巴尔加斯在选举失利后越来越多地卷入其中并希望借助这种途径为国家做出贡献。这就引发了现任国民警卫队司令夸德拉与巴尔加斯之间的矛盾。夸德拉希望将国民警卫队建设成为一支强大的进攻力量以推翻美洲的独裁与强权统治，而巴尔加斯则希望国民警卫队的目标能够始终建立在保卫尼加拉瓜及其人民的基础上。由于他们之间几乎没有共同意见可循，我们只好支持其中一边。"
 nic.59.a:0 "夸德拉完全正确"
 nic.59.b:0 "巴尔加斯知道尼加拉瓜需要什么"
 nic.60.t:0 "尼加拉瓜希望进一步加强关系"
 nic.60.d:0 "尼加拉瓜有兴趣进一步加强与其他国家的联系，以确保其国家安全与稳定的经济发展。在他们身上投资增加出口可以给我们带来一些额外的利润，例如各类经济作物和其他东西……比如说像牛？"
 nic.60.a:0 "当然可以"
 nic.60.b:0 "我们需要考虑"
 nic.61.t:0 "[From.GetNameDefCap]同意了"
 nic.61.d:0 "[From.GetAdjective]政府已经同意加强我们两国之间的经济联系和合作。我们因此得以在经济发展领域得到了些许小小的援助，这应该有助于尼加拉瓜的发展与繁荣。"
 nic.61.a:0 "太好了！"
 nic.62.t:0 "[From.GetNameDefCap]拒绝了"
 nic.62.d:0 "[From.GetAdjective]政府已经拒绝在我们两国间建立更亲密的经济联系与合作的努力。如果我们不希望未来在外交和经济上持续孤立，就必须在该地区展望新的贸易伙伴与盟友。"
 nic.62.a:0 "我们需要将目光放得更远些"
 nic.63.t:0 "莫雷诺的命运"
 nic.63.d:0 "莫雷诺与桑地诺不同，在我们与桑地诺爆发矛盾期间，他忌惮于我们强大的影响力而决定避免与我们发生直接冲突。尽管他是中立的，但他仍然在冲突中对外支持桑地诺的主张，这种情况必须得到相应的处理。尽管他在危机面前表现怯懦，但他仍然受到很多下层民众的爱戴，因此我们需要谨慎行事。我们可以阻挠他继续从政，但事实可能证明留着他对我们而言是一种威胁，因此我们可能有必要将他完全驱逐出境。虽然后一个选择显然会造成一些不稳定，却能有效阻止他在国内对我们再次采取任何行动。"
 nic.63.a:0 "惹不起什么风浪的，不要他从政就好了"
 nic.63.b:0 "他太危险了，驱逐他！"
 nic.64.t:0 "萨卡萨“退出”政坛"
 nic.64.d:0 "最近，萨卡萨突然以一种更奇怪的方式宣布“退出政坛”，理由是真正民主的权力正在衰退而向社会主义民主过渡。这对莫雷诺来说是完全出乎意料的情况，因为他过去和萨卡萨之间几乎没有出过任何问题。桑地诺身边的许多人预测，这是因为萨卡萨正在准备尝试一些不可思议的事情，这提醒着社会主义阵营应该更加紧密地合作为未来的不测做好准备。但我们现在可以肯定的是，他一定是个偏执狂！"
 nic.64.a:0 "令人生疑"
 nic.65.t:0 "萨卡萨的近况"
 nic.65.d:0 "自从1936年萨卡萨宣布退出政坛之后。他似乎确实从公众视野中消失了，至少我们是这么认为的。直到现在人们开始注意到，他似乎会见了许多反对桑地诺政府的领导人，并且在私人警卫和其他方面投入了额外的开支。虽然他还没有做任何尝试，但许多人建议我们密切关注他的行动，尝试与莫雷诺建立进一步的联系，以防最坏的情况发生。"
 nic.65.a:0 "他会做什么呢？"
 nic.66.t:0 "萨卡萨雇佣阿韦拉多·夸德拉"
 nic.66.d:0 "随着我们进一步关注萨卡萨的活动情况，最近我们发生他似乎雇佣了雇佣兵将领阿韦拉多·夸德拉作为他的私人将军和警卫。在正常情况下，人事调动并不会被我们纳入考虑，但夸德拉在国内却是个无比具有争议性的人物。内战期间，他曾直接为反动派领导的国民警卫队服务，多次与桑地诺的革命军发生正面冲突。他之没有被我们立即踢出尼加拉瓜，完全是因为这个雇佣兵领袖对国民警卫队也没有任何真正意义上的忠诚可言，在我们击败反动派的最后一刻果断叛逃到了我方。众所周知，在此之后他仍然不太喜欢桑地诺和莫雷诺，因此萨卡萨在这个时候重新启用他显然会带来严重的争议。"
 nic.66.a:0 "我们必须仔细盯紧他！"
 nic.67.t:0 "萨卡萨宣布我们的政府“不民主”"
 nic.67.d:0 "似乎萨卡萨终于开始对政府采取行动，他在马塔加尔帕正式组建自己的政府，声称我们在回避民主自由，并抛弃了革命共和国的理念，改投社会主义。当然，这些说法荒唐可笑，但有些人实际上已经开始离开社会主义政府，并转而支持萨卡萨。一场潜在的危机可能正在发生，但我们需要等待更长时间才能看到全国人民的反应。"
 nic.67.a:0 "这个擅长伪装的恶棍！"
 nic.68.t:0 "意想不到的结果"
 nic.68.d:0 "萨卡萨的反对似乎完全被公众置若罔闻，只有很少的人加入他的事业，甚至连他手下的雇佣军也拒绝履行他的提议。许多人将此归因于我们解放洪都拉斯的成果，使民众对政府的信心得到了些许提升。最终，萨卡萨无不尴尬地离开了我们的国家，使我们完全掌握了国家权力。"
 nic.68.a:0 "这太简单了……"
 nic.69.t:0 "萨卡萨的雇佣军"
 nic.69.big:0 "萨卡萨正在以不满的前国民警卫队成员和占领时期前的退伍军人为基础组织一支雇佣军，他们的共同特征就是不喜欢我们的新政府。到目前为止，萨卡萨在人民中的支持率高得惊人，特别是在希望萨卡萨掌权的东部米斯基托人中间。\n\n眼下萨卡萨正面临着两种选择，要么努力保卫东部农村并在那里建立抵抗基地，要么立即进军首都争夺总统地位。两种做法都有可行性，那么他的选择是……"
 nic.69.small:0 "萨卡萨正在以不满的前国民警卫队成员和占领时期前的退伍军人为基础组织一支雇佣军，他们的共同特征就是不喜欢我们的新政府。到目前为止，萨卡萨在民众中的支持率还算温和，只获得了来自西部与首都少数人的支持，而他在东部民众间的支持率则几乎不存在……\n\n眼下萨卡萨正面临着两种选择，要么努力保卫东部农村并在那里建立抵抗基地，要么立即进军首都争夺总统地位。两种做法都有可行性，那么他的选择是……"
 nic.69.a:0 "萨卡萨希望争取东部乡村的支持"
 nic.69.b:0 "萨卡萨直接向首都进军"
 nic.70.t:0 "萨卡萨失败了"
 nic.70.d:0 "尽管他在东部地区缺乏根基，但萨卡萨似乎仍把首要目标设定为争取东部农村地区的支持。然而正如大多数人所预料的那样，形势很快超出了计划之外。他本就数量不多的部队遭到了当地人民猛烈的抵抗，军队随之士气低落。在受够了失败与饥饿之后，他的军队发生了军变，迫使他带着为数不多的忠诚士兵撤退到哥斯达黎加。他留下的遗产不过是些被摧毁的道路与铁路，以及在几乎没有工业化的东部地区所引发的暴力与骚乱。"
 nic.70.a:0 "他的举动很愚蠢"
 nic.71.t:0 "东西对抗！"
 nic.71.d:0 "穿行于乡间的萨卡萨设法取得了相当数量的村庄的支持，这些村庄大多对桑地诺不屑一顾。真正的抵抗来源于支持莫雷诺的那些村庄。尽管这些村庄组织了大规模抵抗，但他们很快得到了萨卡萨方面的妥善处理。尼加拉瓜的东部与西部地区以及实质上分裂了。而首都附近也爆发了小规模冲突。双方的民众都已为此骚动起来。只需要其中一方首先撑不住，局势就会完全转向。"
 nic.71.a:0 "西方的紧张局势爆发！人们纷纷叛逃到萨卡萨一边"
 nic.71.b:0 "东方的动乱爆发了！雇佣兵叛变，萨卡萨被打败"
 nic.72.t:0 "首都冲突"
 nic.72.big:0 "萨卡萨直接向首都进军的行动取得了巨大的成功，人们纷纷在街头集会，称社会主义者是“革命的叛徒”，革命军队中也有不少人选择倒向萨卡萨。当他最终抵达首都时，许多人站在总统府外抗议，声称“如果不是社会主义者，洪都拉斯早就是一个自由的国度了”。莫雷诺和桑地诺在发觉局势变化后便早早离开了这个国家，以躲避事态升级后引发的针对他们本人及支持者们的暴力。没有人知道他们去了哪里，只知道他们仍然留在一个接受他们的中美洲国家，等待着回来的时机。"
 nic.72.small:0 "萨卡萨进军首都的举措很快就受到了质疑，首都的街头充斥着为数不多的自由派支持者与社会主义者间争吵与打斗。许多人预测，由于萨卡萨在尼加拉瓜的总体支持率偏低，在军队中也缺乏地位，萨卡萨在这里取得胜利的几率渺茫。然而我们都清楚，首都的局势是随时可能发生变化的。"
 nic.72.a:0 "自由派掌权了！"
 nic.72.b:0 "萨卡萨被驱逐出境"
 nic.73.t:0 "新的选举"
 nic.73.moreno:0 "今天，莫雷诺宣布继自由主义者退出革命后举行新的选举。实际上真正有能力赢得选举的政党是国家主权阵线和尼加拉瓜乡村党，他们都由杰出的社会主义者们领导。一些人认为这就是萨卡萨对社会主义民主制度的恐惧来源。"
 nic.73.sandino:0 "今天，桑地诺宣布继自由主义者退出革命后举行新的选举。实际上真正有能力赢得选举的政党是国家主权阵线和尼加拉瓜乡村党，他们都由杰出的社会主义者们领导。一些人认为这就是萨卡萨对社会主义民主制度的恐惧来源。"
 nic.73.a:0 "这将是一场激烈的竞争！"
 nic.74.t:0 "自由主义者向莫雷诺靠拢"
 nic.74.d:0 "虽然许多以前支持萨卡萨的人抵制这次选举，以回应萨卡萨被驱逐的事件。但是那些曾经支持萨卡萨的中产阶级已经逐步向莫雷诺靠拢，这为莫雷诺赢得更多民众的普遍支持，增加了他在即将到来的选举中获胜的机会。"
 nic.74.a:0 "一个有趣的转变"
 nic.75.t:0 "桑地诺派的大规模集会"
 nic.75.d:0 "作为对莫雷诺自由主义倾向的直接回应，桑地诺开始直接与桑地诺派进行合作，组织了一场大规模集会来抵制这种趋势。游行队伍在马塔加尔帕的街道上穿行，每个人都沉浸在快乐的氛围中。这帮助桑地诺扭转了局势，也使更多人看清了两党在这场选举中的激烈竞争。"
 nic.75.a:0 "桑地诺派确实改变了不少……"
 nic.76.t:0 "[GETYEAR]年大选"
 nic.76.d:0 "今年大选终于到来，桑地诺和莫雷诺将会展开激烈的竞争，桑地诺拥有广大的支持，但是莫雷诺成功吸引了前自由主义者为他提供支持。双方都有可能获胜，而最终结果是……"
 nic.76.a:0 "国家主权阵线获胜！"
 nic.76.b:0 "尼加拉瓜乡村党获胜！"
 nic.76.c:0 "[ROOT.GETLEADER]最后一刻宣布全国进入紧急状态！"
 nic.7700.t:0 "紧急状态招致严重后果"
 nic.7700.d:0 "取消选举的行为使政府的口碑一落千丈，反动派蠢蠢欲动"
 nic.7700.a:0 "糟糕透了"
 nic.7701.t:0 "蒙卡达和国民警卫队重返回国"
 nic.7701.d:0 "国民警卫队的残余已经从洪都拉斯启程回国。显然，他们计划一举推翻政府！"
 nic.7701.a:0 "什么？！"
 nic.7702.t:0 "警卫队进军首都"
 nic.7702.d:0 "显然，事情并不顺利。国民警卫队设法争取到了自由派的支持，现在他们已经开始进攻首都了！"
 nic.7702.a:0 "去你妈的"
 nic.7703.t:0 "国民警卫队接管政府"
 nic.7703.d:0 "国民警卫队击溃了社会主义者"
 nic.7703.a:0 "我们回来了！"
 nic.77.t:0 "[GETYEAR]年大选"
 nic.77.d:0 "在桑地诺独自解放了首都和国家之后，桑地诺宣布举行的选举方案——正如许多人所预期的那样——是相当虎头蛇尾的。由于唯一能够参选的政党只有国家主权阵线，桑地诺不出所料地以压倒性优势赢得了选举。当公众很高兴摆脱其他政治干扰因素的影响时，很多人在思考一个问题，这将是一个新的独裁政权的起点吗？"
 nic.77.a:0 "小孩子都看得出来，桑地诺将占据上风"
 nic.78.t:0 "尼加拉瓜需要援助"
 nic.78.d:0 "尼加拉瓜正在为中美洲其余地区的最终解放做准备。为此他们希望从我们这里装运枪支。如果尼加拉瓜和其他社会主义国家能够在中美洲取得成功，它们的经济作物与其他资源能够为社会主义事业带来巨大的利益。"
 nic.78.a:0 "把他们需要的东西送给他们"
 nic.78.b:0 "我们有自己的冲突需要担心"
 nic.79.t:0 "[From.GetNameDefCap]给我们提供了支持"
 nic.79.d:0 "太好了，[From.GetNameDef]决定全力支持我们的事业。这些武器将被证明对解放中美洲其他地区极为有用。"
 nic.79.a:0 "感谢他们"
 nic.80.t:0 "[From.GetNameDefCap]拒绝支持"
 nic.80.d:0 "由于顾虑与德国即将爆发的冲突，[From.GetNameDefCap]已经决定不为我们提供所需的武器。我们将不得不自力更生……但是当然的，胜利最终还是会属于我们的！"
 nic.80.a:0 "真是丢人"
 nic.81.t:0 "杨基·莱维的军事训练"
 nic.81.d:0 "应桑地诺和莫雷诺的要求，建立专业化的军队，协助我们的事业四年多的著名游击队员杨基·莱维现在开始领导军队的训练工作。教会他们如何组织游击作战以及如何在丛林深处保护好自己。他的指导使我们的军队走上了新的道路，以更好的方式为我们服务。这是我们将来需要进一步推广的。"
 nic.81.a:0 "我们祝他好运！"
 nic.108.t:0 "突袭巡逻队"
 nic.108.d:0 "尼加拉瓜南部一支由300人组成的巡逻小队日前遭到了桑地诺武装的袭击。由于冲突仍在继续，损失情况到目前为止尚不清楚，但双方都预计这将是场损失惨重的血腥战斗。我们祈祷这支巡逻队不会在突袭中遭到全部歼灭，但这只能取决于这支部队的表现了。"
 nic.108.a:0 "希望巡逻队能幸存下来……"
 nic.109.t:0 "工业设施遇袭"
 nic.109.d:0 "来自南部和西部关于桑地诺派袭击的报道如雨后春笋般涌现。显然，桑地诺武装已经对全国多个据点展开袭击。我们仍在收集各地设施受损的确切信息，但运输系统遭到破坏的可能性很高。此外也有小部分报道称，一些民用和军工企业也受到了桑地诺武装的侵扰。等全面的事故损失报告出炉后，我们就得去好好瞧瞧在整场事件中我们受到了多大的损失。"
 nic.109.a:0 "报告在哪里？"
 nic.110.t:0 "全国罢工"
 nic.110.d:0 "桑地诺的抵抗已经鼓舞了更多的民众参与罢工斗争，罢工的浪潮正在席卷全国。许多人也开始宣称自己是“桑地诺主义者”，并公开抵制他们为国家工作的义务。由于我们的军事力量强大，所以我们可以很容易地在他们的实力日益壮大之前，派遣我们的军队在全国范围内消灭他们，或者我们可以任由罢工者自己散去，这可能会为我们的政府赢得一点点来自民间的同情。"
 nic.110.a:0 "该死，派国民警卫队去教训他们！"
 nic.110.b:0 "让他们抗议吧"
 nic.111.t:0 "首都的抗议活动"
 nic.111.d:0 "今天，首都的紧张局势突然爆发。由五人组成的一小群抗议者被国民警卫队在没有得到将军许可的情况下开枪打死。这引发了人们对政府的强烈抵制，许多首都居民放下了手头的工作，抗议现任政府的暴行。这使本就不怎么受欢迎的我国政府的支持率进一步下降。"
 nic.111.a:0 "事情为何总是不像我们想的那样发展……"
 nic.112.t:0 "军火库遇袭"
 nic.112.d:0 "我们控制下的一处武器仓库日前遭到了桑地诺与他的追随者们的袭击。尽管在他们试图逃跑之前，国民警卫队尽了最大努力围捕他们，但他们还是设法逃了出去，只有两名叛军在战斗中被我们打死。军火库方面目前正在设法核对丢失的枪支数量，虽然预计数量不会很多……但是我们的预测通常都是错误的……"
 nic.112.a:0 "最好不要太多"
 nic.113.t:0 "民众的抵制情绪日益高涨"
 nic.113.d:0 "尽管我们尽了最大努力，但桑地诺在南方的抵抗正开始向全国各地蔓延，特别是在我国东部地区。越来越多的人开始走上街头反对他们眼中的“尼加拉瓜卖国政府”。政府方面现在开始担心，鉴于一场民众革命可能已不可避免，我们也许只能通过派遣军队来长期维持我们的权力与地位。当然，这也是我们应尽的职责，我们的任务是保护国家不受工团主义者的控制，然后才是保护平民。"
 nic.113.a:0 "需要进一步抑制这种势头！"
 nic.114.t:0 "桑地诺的抵抗力度减弱"
 nic.114.d:0 "由于我们的努力，桑地诺对执政政府的抵抗暂时停止了。与卑劣的叛军相比，我方军队的机动性与强大的火力已经慢慢地开始制服他们。全国范围内对桑地诺的支持也开始瓦解，因为他们开始觉得自己可能在支持一项注定失败的事业。如果我们继续维持现有的努力，很快我们就能看到桑地诺的抵抗被我们的军队完全终结。"
 nic.114.a:0 "为了胜利，前进！"
 nic.115.t:0 "粉碎反对派！"
 nic.115.d:0 "我们必须在桑地诺派在南方地区的激烈抵抗蔓延到全国，并压倒我们国家之前对其加以果断而迅猛的处置。然而，政府内部的某些人物已经开始讨论我们在这项事业中我们应该走多远。一些人认为，过度的镇压只会导致更多的人转而支持桑地诺的理想，而另一些人则认为，镇压的力度不够反而会将政府的弱点暴露在反对者面前。这是一个微妙的问题，如果我们想看到困扰这个国家的动乱结束，就需要小心谨慎地处理眼下的选择。"
 nic.115.a:0 "轻微的镇压应该足够了"
 nic.115.b:0 "适度即可"
 nic.115.c:0 "要么杀光，要么回家！"
 nic.116.t:0 "尼加拉瓜需要枪支"
 nic.116.d:0 "尼加拉瓜境内的临时政府已正式开始对该国南部的桑地诺派采取行动。然而，对这些运动的全面镇压需要比预期更多的枪支与装备，现在他们请求我们向他们提供这些物资，以使他们的国家远离社会主义的威胁。不运送物资会对我们和他们的国家造成更坏的影响，所以听取他们的要求是明智的。"
 nic.116.a:0 "粉碎残余抵抗是必要的"
 nic.116.b:0 "那不关我们的事"
 nic.117.t:0 "[OVERLORD.GetNameDefCap]为我们提供武器"
 nic.117.d:0 "谢天谢地，[OVERLORD.GetNameDefCap]政府已经按照我们的请求为我们提供了物资。总的来说，这五百支步枪应该足以粉碎困扰着我们国家和人民的卑劣叛徒们了。支援物资抵达的消息从一开始就使桑地诺看到了自己的支持正在变得越来越少，因为他的部队面对我们数量庞大的军队和源源不断的武器供应已经开始失去信心。"
 nic.117.a:0 "我们需要更多的武器来镇压革命者"
 nic.118.t:0 "[OVERLORD.GetNameDefCap]拒绝为我们提供武器"
 nic.118.d:0 "看来[OVERLORD.GetNameDefCap]拒绝了我们要求武器装备促进镇压桑地诺和他的革命者的请求。他们的官方理由是，他们认为我们完全有能力独自击退反叛者，根本不需要进一步的援助。当然，他们的假设在未来到底有正确，取决于未来的战况会如何发展。"
 nic.118.a:0 "我们将独自继续战斗"
 nic.guardia.t:0 "国民警卫队的部署"
 nic.guardia.d:0 "由索摩查·加西亚本人亲自创建的国民警卫队在1932年被革命摧毁后，现已正式恢复重建。他们目前由3000名忠实的尼加拉瓜士兵组成，随时准备为国家效劳，保卫祖国不受桑地诺及其叛党的威胁。桑地诺分子正在企图摧毁我们伟大的国家，但是我们要把国民警卫队安置在什么地方对付这帮叛徒则是另一个问题。众所周知，东部人民对我们的政权最为不满，但桑地诺的叛军仍然在南部肆虐。一个更受欢迎的建议是把他们安置在首都以压制我国核心地带附近的抗议活动。"
 nic.guardia.a:0 "派他们去南方直面桑地诺武装"
 nic.guardia.b:0 "派他们去东部巡逻"
 nic.guardia.c:0 "他们应该控制首都周围的抵抗"
 nic.119.t:0 "国民警卫队行动失败"
 nic.119.d:0 "我们决定派遣国民警卫队直面桑地诺的做法被证明是一个糟糕的主意。由于桑地诺游击队的性质较新，经验丰富的游击战士在森林和丛林中对我军具有充分的优势。我们的200名士兵在我们能够知道为什么之前就被叛军杀掉了，这迫使他们在遭受进一步损失之前选择撤退。我们的失败重新振奋了桑地诺在全国各地的人气，社会陷入进一步的混乱。"
 nic.119.a:0 "这帮混蛋！"
 nic.120.t:0 "首都保持沉默"
 nic.120.d:0 "对于首都的居民来说，一切都寂静了下来。最初还有一些直面国民警卫队的抵抗，但他们它很快就全部消失了，因为居民开始知道这么做将会发生什么。首都的总体氛围也招致了周围地区的担心，他们害怕自己反抗后也会遭遇不测。国民们对桑地诺的热情似乎开始逐渐消失了。"
 nic.120.a:0 "这是我们的胜利！"
 nic.121.t:0 "桑地诺向北进军！"
 nic.121.d:0 "今天，桑地诺宣布正式将率领军队解放首都，以此彻底终结国民警卫队对尼加拉瓜的统治。早些时候，他和他最初的1000名士兵已经从南部出发，一路向北迅速挺进，但是路途中危险的地形和少数政府军的抵抗迟滞了他们前进的步伐，因此我们还有些时间。一些人预测桑地诺的行动将立即在人民中产生影响，将会有许多人争相涌向他的事业。对此我们只能拭目以待，而现在我们所唯一能够知晓的是，尼加拉瓜的未来正岌岌可危。"
 nic.121.a:0 "我们必须不惜一切代价取得胜利！"
 nic.123.t:0 "桑地诺的解放"
 nic.123.d:0 "今天，桑地诺带着比我们想象中更多的人抵达了首都。为了保卫首都，所有的街道都设置了路障防范入侵，国民警卫队的占据着有利地形随时准备击败任何敢于反对我们的游行队伍。然而，桑地诺军队的凶猛程度显然被严重低估了。\n\n一开始只是一场小规模起义，但很快就在国民警卫队内部掀起了轩然大波。每一分钟都有许多曾经同情过桑地诺事业的士兵抛弃他们的将军投入桑地诺武装的怀抱，让他有机会继续推进。从那时起，我们已经失去控制首都人民的任何一点希望，愤怒的居民们也迅速加入了卖国贼的行列，拆毁了街垒，向总统府和军营发起猛攻。面对局势崩溃的现状，纳斯塔西奥·索摩查·加西亚不得不带着少数仍然忠于他的人迅速撤离了首都，回到了洪都拉斯。"
 nic.123.a:0 "滚回去！最好永远别回来！"
 nic.124.t:0 "桑地诺的“解放”"
 nic.124.d:0 "今天，桑地诺的部队最终抵达首都，但他们的数量比我们预期的要少得多。为了保卫首都，所有的街道都设置了路障防范入侵，国民警卫队的占据着有利地形随时准备击败任何敢于反对我们的游行队伍。许多人亲眼目睹了桑地诺的热情和他的军队规模在通往马塔加尔帕的一路上衰退的是多么剧烈。\n\n桑地诺的部队只有300名士兵，其中只有100名士兵配备着枪支。这样一支部队对着我们的路障发起攻势的过程或许只能以“有些令人沮丧”来加以形容，桑地诺的士兵被慢慢地被我们的机枪扫射压制的动弹不得，少数士兵被枪杀。桑地诺本人很快就从败局中逃了出来，似乎对自己的失败感到由衷的尴尬与失落。至此全国各地的叛乱运动也已经基本平静下来。据报道，有人看到桑地诺在出逃后出现在哥斯达黎加，但没有人能真正证实这一传闻。"
 nic.124.a:0 "叛徒们已堕落了！"
 nic.125.t:0 "桑地诺的解放"
 nic.125.d:0 "桑地诺的部队今天抵达首都，人数与我们先前预期的差不多。为了保卫首都，所有的街道都设置了路障防范入侵，国民警卫队的占据着有利地形随时准备击败任何敢于反对我们的游行队伍。然而，桑地诺军队的攻势也不容小觑。\n\n桑地诺的军队在抵达后几乎立即开始对我们设置路障的交通要到发起进攻，但他们很快发现这是徒劳的，于是双方开始了紧张的对峙。五个小时以来，双方都逐渐开始对这样的僵局感到厌倦。也许可能会发生什么变化……比如一两个国民警卫队士兵突然叛变跑到了对面的路障后面，其他人也开始跟风效仿。虽然这样的情况还并不多见，但如果处理不当，叛逃的情况随时可能会失控……"
 nic.125.a:0 "国民警卫队守住了阵地！"
 nic.125.b:0 "更多的军队叛变！桑地诺取得了决定性突破！"
 nic.126.t:0 "尼加拉瓜再度陷入革命！"
 nic.126.d:0 "消息刚刚从尼加拉瓜传出，尼加拉瓜国民警卫队司令纳斯塔西奥·索摩查·加西亚本人也亲自来到我们门前向我们证实了这一切……桑地诺又一次取得了胜利！他似乎再次得到了民众的支持，通过一场对首都的有效进攻而重新掌权了。政府内部的许多人开始争论到底是什么导致了这场灾难，一些人指责我们对该地区缺乏行动，另一些人则指责是索摩查·加西亚和国民警卫队的无能导致了这个问题。然而这些已经不重要了，关键抉择在于如何决定我们的下一步行动。阿道弗·迪亚斯和阿纳斯塔西奥·索摩查·加西亚恳求我们介入这场危机，但我们的国家也已经被上次战争搞得筋疲力尽了。许多人开始质疑，再度干涉尼加拉瓜局势真的是我们所能够负担得起的行动吗？"
 nic.126.a:0 "他们逃不掉的！"
 nic.126.b:0 "我们没有力量再打一场战争"
 nic.127.t:0 "洪都拉斯报复！"
 nic.127.d:0 "看来迪亚斯、索摩查·加西亚和国民警卫队的残余势力已经成功说服洪都拉斯人回来再次入侵我们的国家了！尽管我们对全面战争毫无准备，洪都拉斯这次也似乎无疑退缩。但是如果我们要在他们和革命的敌人面前生存下去，就必须抵抗到底！"
 nic.127.a:0 "为革命而战！"
 nic.128.t:0 "洪都拉斯保持沉默"
 nic.128.d:0 "第二次流亡到洪都拉斯的国民警卫队反对派，第二次没能说服洪都拉斯人，第二次入侵我们的国家。这将使我们有足够的时间从这一年前的残酷经历中恢复过来，准备再次振作精神解放中美洲。"
 nic.128.a:0 "革命的又一次胜利！"
 nic.129.t:0 "尼加拉瓜宣布独立"
 nic.129.d:0 "在国民警卫队采取最后的行动，粉碎剩余的桑地诺派并将他们驱逐出境后，他们对我们的依赖迅速减少。因此，今天迪亚斯宣布尼加拉瓜正式脱离洪都拉斯独立，因为桑地诺派已得到彻底处理，同时他表示感谢洪都拉斯对他们的努力提供的帮助。"
 nic.129.a:0 "他们成长的可真快……"
 nic.130.t:0 "第二次占领尼加拉瓜"
 nic.130.d:0 "在与尼加拉瓜的第二次战争之后，我们设法击退了桑地诺及其党羽，他的政府残余正在向伙伴社会主义国家撤退，似乎正在策划他最终的回归。迪亚斯再一次在首都就职，而我们的军队加强了对地区的管控，确保这种事不再发生。"
 nic.130.a:0 "国民警卫队又回来了……"
 nic.131.t:0 "占领洪都拉斯"
 nic.131.d:0 "在许多人看来，这是一个奇迹，我们不仅成功地控制了我们的国家，我们还成功地击败了洪都拉斯。尽管我们面临着各种不稳定因素的干预。但是一个全新的社会主义政府已经建立，以取代它之前的反动而腐朽的旧政府。对许多人来说，这次事件也在国际上被视为中美洲革命的彻底复兴！"
 nic.131.a:0 "一场真正传奇般的胜利！"
 nic.132.t:0 "自由派的背叛"
 nic.132.d:0 "不久之前，首都马那瓜被推进的洪都拉斯自由派军队占领，萨卡萨随即借机叛逃到洪都拉斯领导马那瓜的新政府。桑地诺和莫雷诺立即谴责了他的行为，但现在已经为时过晚了。不久之后，许多军方人员开始放下武器，叛逃到萨卡萨那边。莫雷诺和桑地诺则不得不逃到南部的哥斯达黎加，等待着他们能够返回的那一天，期盼着革命再度席卷中美洲。"
 nic.132.a:0 "共和国迈出了新的一步！"
 nic.133.t:0 "占领尼加拉瓜"
 nic.133.d:0 "我们成功地从侵略者手中夺回了尼加拉瓜首都马那瓜。曾经被被剥夺总统职位的胡安·包蒂斯塔·萨卡萨已从他们的革命共和国叛逃并加入我们，表示愿意担任总统直到该地区稳定下来。我们没有其他选择，只能接受他的提议，因为自从驱逐了他们以前的军队以后，我们在这个地区缺乏其他潜在的合作者，而任命一位洪都拉斯人来领导当地无疑会非常不受欢迎。"
 nic.133.a:0 "一个新的中美洲！"
 nic.134.t:0 "尼加拉瓜的政治过渡"
 nic.134.d:0 "当我们进入尼加拉瓜首都马那瓜时，一名被剥夺总统职位的尼加拉瓜自由派总统候选人胡安·包蒂斯塔·萨卡萨迅速抓住机会叛逃到我们一边，争取到了领导马那瓜新政府的机会。桑地诺和莫雷诺立即谴责了他的行为，但现在已经为时过晚了。不久之后，许多军方人员开始放下武器，叛逃到萨卡萨那边。莫雷诺和桑地诺则不得不逃到南部的哥斯达黎加，等待着他们能够返回的那一天，期盼着革命再度席卷中美洲。"
 nic.134.a:0 "迈向和平的一步"
 nic.135.t:0 "社会主义者背叛"
 nic.135.d:0 "不久之前，首都马那瓜被推进的洪都拉斯社会主义军队占领，桑地诺和莫雷诺随即借机叛逃到洪都拉斯领导马那瓜的新政府。萨卡萨立即谴责了他们的行为，但现在已经为时过晚了。不久之后，许多军方人员开始放下武器，叛逃到桑地诺和莫雷诺那边。萨卡萨则不得不逃到南部的哥斯达黎加，等待着他能够返回的那一天，期盼着自由主义的浪潮再度照亮中美洲。"
 nic.135.a:0 "这是革命的必要步骤"
 nic.136.t:0 "解放洪都拉斯"
 nic.136.d:0 "我们成功地从威胁社会主义理想的侵略者手中夺回了尼加拉瓜首都马那瓜。素有“中美洲救星”之称的桑地诺——他在1936年的总统选举中被自由派拒之门外，这迫使他等待重新就职的机会并计划驱逐自由革命党。现在，桑地诺已经提出要成为新总统，直到他把该地区重新稳定下来。我们没有任何反对的理由，因为我们知道，与洪都拉斯派遣的领导人相比，他对尼加拉瓜人民而言更受欢迎，而且他对我们也很友好。"
 nic.136.a:0 "革命的又一次胜利！"
 nic.137.t:0 "尼加拉瓜的政治过渡"
 nic.137.d:0 "当我们进入尼加拉瓜首都马那瓜时，“中美洲救星”奥古斯托·桑地诺正式叛逃到我们一边，声称自由革命已经死亡，尼加拉瓜繁荣需要社会主义的领导。他已经宣布我们为盟友，并建立了自己的政府，将尼加拉瓜的大部分军事力量已经为他所掌控，而萨卡萨则向南逃去了哥斯达黎加。一切告一段落之后，两国间正式签署了和平协议，为双方的居民带来了和平与安宁。"
 nic.137.a:0 "社会主义的果实终于是会开花结果的！"
 nic.1002.t:0 "对抗激进赤匪的前线"
 nic.1002.d:0 "尼加拉瓜是中美洲激进赤色威胁的信标，我们不能再把中美洲丢给南方的那帮人了，但我们也没有策略或是人力干掉他们。"
 nic.1002.a:0 "希望他们失败"
 nic.1002.b:0 "我们可以呼叫一些帮助……"
 nic.1003.t:0 "来自[COR.GetLeader]的神秘提议"
 nic.1003.d:0 "随着道格拉斯·麦克阿瑟将军设定的30天期限日益临近，一份神秘的提议摆在了这个摇摇欲坠的美利坚合众国新任代理领导人的案头。提议来自南方那位自立为“总统”的叛军领袖 [COR.getleader]，并于今晨送达白宫。这个朴素无华的信封中，既包含了一份求助信，也勾勒出一项可能惠及两位“美利坚衣钵继承人”的联合行动计划。信中解释道，可恶的左翼分子奥古斯托·桑迪诺及其马克思主义叛军已着手夺取尼加拉瓜的政权——这个曾是中美洲美利坚影响力中心的国家。鉴于此，[COR.getleader] 希望其部队能与美军，尤其是海军陆战队，协同作战，秘密入侵并推翻桑迪诺政权，重建美利坚在该地区的主导地位。按照计划，海军陆战队将在波尔图戈尔登河河口悄然登陆，顺流而下直奔马那瓜，秘密而高效地刺杀桑迪诺，推翻其政权。尽管我们与这些南方分裂分子几乎素无往来，但粉碎社会主义在新大陆的任何立足点，这个机会实在太过诱人，不容错失。那么，我们的官方回应将是什么？是暂时搁置分歧，携手将中美洲从自身与社会主义的瘟疫中拯救出来，还是无视这些叛军，全力应对即将到来的冲突？"
 nic.1003.a:0 "我们腾不出宝贵的人手！直接无视这群南方人"
 nic.1003.b:0 "我们腾不出宝贵的人手！直接无视莫斯利"
 nic.1004.t:0 "海军陆战队登陆卡贝萨斯港"
 nic.1004.d:0 "在范·霍恩·莫斯利将军的指挥下，美国海军陆战队在卡贝萨港登陆，并占领了该港口。有关莫斯利军队屠杀投降者的消息已经从逃离侵略者控制的人那里传出。"
 nic.1004.a:0 "全力应战！"
 nic.1004.b:0 "退后并等待他们分兵"
 nic.1005.t:0 "埃尔艾特之战"
 nic.1005.a:0 "我们赢了！"
 nic.1005.b:0 "美国人大获全胜"
 nic.1006.t:0 "通往马那瓜的竞赛"
 nic.1006.d:0 "在埃拉约特，我们的军队伤亡惨重，如今只能拼死一搏，彻底歼灭海军陆战队。与此同时，海军陆战队本身也正顶着狙击手的阻击，竭力向我们的首都攻去。倘若边防部队不能及时赶到首都，那我们就完了！"
 nic.1006.a:0 "上帝之怒"
 nic.1006.b:0 "我主仁慈"
 nic.1009.t:0 "海军陆战队成功夺权"
 nic.1009.d:0 "政府未能控制住尼加拉瓜的局势。海军陆战队在攻占了无数的城镇和村庄之后，在我们的首都凯旋而过。随着战斗的结束，莫斯利成为了尼加拉瓜的新领导人，并在马那瓜直接接管了国家的控制权。尽管他遭到了抵抗，但冲突双方的国家都已被鲜血和子弹所笼罩。"
 nic.1009.a:0 "沃克将军会为我们骄傲的"
 nic.10000.t:0 "尼加拉瓜希望购买南达科他号"
 nic.10000.d:0 "莫斯利在洪都拉斯的新美国殖民地已经和我们联系，提出购买南达科他号来为他的政府增添名望。我们应该接受吗？要是不卖，那老姑娘就只能当废铁了。"
 nic.10000.a:0 "这笔钱我们用得着"
 nic.10001.t:0 "批准购买"
 nic.10001.d:0 "南达科他号现在已驶入我们的港口！对这个年轻的国家来说，这真是一个伟大的日子。"
 nic.10001.a:0 "万岁！"
 nic.2003.t:0 "新元首？"
 nic.2003.d:0 "索摩查、瓦莱或克莱尔"
 nic.2003.a:0 "索摩查"
 nic.2003.b:0 "德-瓦莱"
 nic.2003.c:0 "陈纳德"
 nic.2003.e:0 "保留莫斯利"
 nicdec.1.t:0 "人们欢庆！"
 nicdec.1.d:0 "我国部队进入尼加拉瓜东部的行动在人民中间掀起了大规模庆祝活动，在行进的部队继续解放东部的农村时，当地居民主动为士兵们送去了面包。由于这一点，我们政府的支持率也因此大幅提高，人们现在普遍把我们认为是“尼加拉瓜的真正救星”。"
 nicdec.1.a:0 "尼加拉瓜人民的胜利！"
 nicdec.2.t:0 "新的问题"
 nicdec.2.d:0 "虽然我们对东部地区的解放进展顺利，但把那里的人民从外国影响中拯救出来的实际进程却不太成功。联合果品公司——尽管他们的数量正在急剧下降——在尼加拉瓜招募了大批雇佣兵破坏我们对其产业和土地的国有化政策。人民已经为此而有所抱怨，如果我们希望得到人民的认可，就必须迅速采取果断行动来遏制这种暴行！"
 nicdec.2.a:0 "派遣民兵"
 nicdec.2.b:0 "贿赂这些雇佣兵"
 nicdec.2.c:0 "武装该地区的人民保护自己"
 nicdec.3.t:0 "军队镇压雇佣军"
 nicdec.3.d:0 "为了从根源上解决这一问题，我们派遣军队进入该地区的决定基本上是成功的，雇佣军已被如数镇压，只有少数人逃脱了惩罚。然而，因为我们的军队还没有太多实战经验，因此，这次行动……进行的相当粗糙。\n\n由于作战中的疏忽，大量道路及交通设施在交火中被毁，实际战斗也中有22名士兵不幸丧生。"
 nicdec.3.a:0 "至少他们终于可以消失了"
 nicdec.4.t:0 "雇佣兵接受了贿赂"
 nicdec.4.d:0 "幸运的是，这些雇佣军接受了我们慷慨的贿赂，并同意作为我们的预备役参军。不幸的是，这种解决办法在很大程度上被视为政府腐败的标志，有人开始怀疑政府为了达到目的可以做出任何事情。虽然总体上而言，公众对我们的认可并没有下降多少，但它给我们的声誉带来了一点负面影响，眼下我们需要努力工作以恢复失去的声誉。"
 nicdec.4.a:0 "问题终于解决了"
 nicdec.5.t:0 "人民成功地保护了自己"
 nicdec.5.d:0 "我们用步枪武装某些重要城镇与村庄的计划似乎取得了成效，大部分雇佣军的攻击都被击退，他们的人数也在慢慢减少。而今天他们正式宣布向我们投降，截至投降之日，他们的队伍只剩下了27人。当然，平民方面也有轻微伤亡，据报越有78人在这段时期持续不断的交火中失踪或死亡。"
 nicdec.5.a:0 "看来我们的人民很擅长使枪"
 nicdec.6.t:0 "雇佣军变得愈发猖獗"
 nicdec.6.d:0 "可悲的是，我们打击雇佣军的努力基本上失败了，联合果品公司正在进一步资助这些小型反叛组织，有一支由300人组成的叛军部队也在西部地区快速崛起。我们需要在这个问题继续发展并危害我们的国家与人民之前彻底解决它。"
 nicdec.6.a:0 "什么时候可以让联合果品公司彻底消失？"
 nicdec.7.t:0 "哭泣的经济"
 nicdec.7.d:0 "虽然我们已经正式摆脱了联合果品公司的控制，但公司的消失给我们的经济带来了相当明显的投资漏洞。大片土地仍未得到保护，数家工厂在西部彻底停工。关闭公司的做法已经开始影响到西部地区的经济，在一段时间内者肯定会给我们的国家带来持续的麻烦。"
 nicdec.7.a:0 "经济最终会自我修复的"
 nicdec.8.t:0 "革命的失败"
 nicdec.8.d:0 "尽管我们尽了最大的努力，我们仍然无法在洪都拉斯立足，并使它站在正义的一边。现在我们被迫与他们和解，以避免双方进一步的无谓消耗。由于我们行动的失败，民众对政府的信心急剧下降。鉴于我国的国内政治已经极度分裂，这可能意味着我们的未来将麻烦重重。"
 nicdec.8.a:0 "我们需要密切留意自由派阵营……"
 nicdec.8.b:0 "社会主义者可以采取行动了……"
 nicdec.9.t:0 "我们幸存了下来"
 nicdec.9.d:0 "在过去的几个月内，尼加拉瓜试图渗透我们的国家并掀起一场革命，但他们的卑劣行径最终可耻地失败了，现在特古西加尔巴的敌对政权必须面对他们人民的怒火，而我们的政府却更加稳固了。"
 nicdec.9.a:0 "中美洲的气氛十分紧张"
 nicdec.10.t:0 "洪都拉斯陷落"
 nicdec.10.d:0 "洪都拉斯已正式向我们投降，从而导致了他们敌视我国的前政权垮台。一个直接与我们结盟的更好的洪都拉斯已经得到建立。我们在这方面的巨大成功将有效地提高现任政府的声望，使每个人都相信，解放中美洲其他地区只是个时间问题，而且这个时间也不会太长。"
 nicdec.10.a:0 "为了中美洲！"
 nicdec.11.t:0 "与洪都拉斯的关系"
 nicdec.11.d:0 "洪都拉斯友好政权的出现使我们两国之间的关系迅速转暖。可惜的是，被视为所有尼加拉瓜人敌人的国民警卫队已经逃离洪都拉斯，可能前往了另一个与美国结盟的国家。尽管如此，洪都拉斯现在已经是我们革命的盟友了！"
 nicdec.11.a:0 "一步一个脚印！我们将得到整个中美洲！"
 nicdec.12.t:0 "尼加拉瓜宣布门罗已死"
 nicdec.12.d:0 "在发现我们已陷入内部危机自顾不暇之后，尼加拉瓜决定脱离门罗主义的约束，宣布门罗主义是过时的，外来强加给它们的思想。不幸的是，由于我国内部的情况影响，我们暂时不能做太多的事情来应对这一状况，但这并不代表我们未来也不会考虑做什么……"
 nicdec.12.a:0 "他们会为此付出代价的……"
 nicdec.13.t:0 "抵制征兵"
 nicdec.13.d:0 "开放招聘的决定在民众中引起了极大的争议。人们纷纷走上街头抗议我们的政策。他们首先表达了对我们能够解放它们的感激之情，但随后表示自己应该被免除兵役，因为他们接受了太久的外国占领。当地其他一些人也同意他们的观点，这让我们在是否继续在当地推广这个项目的抉择上停滞不前。"
 nicdec.13.a:0 "暂时停止从当地征兵"
 nicdec.13.b:0 "我们将保证一视同仁"
 nicdec.14.t:0 "边境冲突获胜"
 nicdec.14.d:0 "我们决定在边境上测试洪都拉斯的实力，结果证明这是卓有成效的。我们成功地击退了他们，证明了我们的实力。洪都拉斯人民已经开始对这一失败感到由衷的恐惧，这应该有助于我们在未来的战争中战胜他们。此外，我们还从这场冲突中获得了少量枪支……"
 nicdec.14.a:0 "革命的胜利！"
 nicdec.15.t:0 "边境冲突失败"
 nicdec.15.d:0 "洪都拉斯人在边境击退了我们的军队，迫使我们暂时撤退。这次失败使我们的人民士气低落，因为他们已经开始把这段冲突看作是战争未来走向的一个比拟。随着少量枪支被敌军缴获，我们需要更加警惕与洪都拉斯冲突的未来。"
 nicdec.15.a:0 "胜利终将属于我们"
 nicdec.16.t:0 "边境冲突升级"
 nicdec.16.d:0 "与洪都拉斯的边境冲突因为种种巧合已经演变为一场全面战争的序幕。除却在西部的有限冲突之外，战争甚至延伸到了东方。如果我们希望击退洪都拉斯人并确保革命的延续，我们必须将我们的军队扩大并部署到整个边境！"
 nicdec.16.a:0 "准备开战！"
 nicdec.17.t:0 "边境冲突获胜"
 nicdec.17.d:0 "我们的军队取得了胜利，击退了来自南方的尼加拉瓜军队。这充分证明了我们对抗尼加拉瓜威胁的能力。尼加拉瓜人民已经开始对这一失败感到由衷的恐惧，并对是否应该继续致力与洪都拉斯的冲突而产生分歧。这应该有助于我们在未来的战争中战胜他们。此外，我们还从这场冲突中获得了少量枪支……"
 nicdec.17.a:0 "我们屹立不倒！"
 nicdec.18.t:0 "边境冲突失败"
 nicdec.18.d:0 "尼加拉瓜人在边境击退了我们的军队，迫使我们暂时撤退。这次失败使我们的人民士气低落，因为他们已经开始把这段冲突看作是战争未来走向的一个比拟。随着少量枪支被敌军缴获，我们需要更加警惕与尼加拉瓜冲突的未来。"
 nicdec.18.a:0 "胜利终将属于我们"
 nicdec.19.t:0 "边境冲突升级"
 nicdec.19.d:0 "与尼加拉瓜的边境冲突因为种种巧合已经演变为一场全面战争的序幕。除却在西部的有限冲突之外，战争甚至延伸到了东方。如果我们希望击退尼加拉瓜，就必须将我们的军队扩大并部署到整个边境！"
 nicdec.19.a:0 "准备开战！"
 nicdec.20.t:0 "群众中的骚动"
 nicdec.20.d:0 "尼加拉瓜已开始向我国境内的叛乱分子提供资金，这些叛乱分子已经开始主张建立一个与尼加拉瓜革命党类似的政府形式。在他们的煽动下，人们开始抵制征兵对抗政府。这在我们与尼加拉瓜爆发的冲突中造成了不小的问题，许多士兵甚至不愿意继续与尼加拉瓜军队对抗了。"
 nicdec.20.a:0 "我们将抵抗到底"
 nicdec.21.t:0 "南部起义"
 nicdec.21.d:0 "看来我们强制推行征兵政策的决定已经适得其反。我国东南部的人民拿起武器反对政府，要求我们结束推行征兵政策。然而最糟糕的是，目前我们与洪都拉斯的冲突正处于最紧要的关头……"
 nicdec.21.a:0 "革命将永存！"
 nicdec.22.t:0 "尼加拉瓜南部起义"
 nicdec.22.d:0 "尼加拉瓜东南部的一小群尼加拉瓜居民因为对征兵制度感到不满而拿起武器反对自己的国家。他们中的许多人现在宣称我们的事业是正义的，并准备正式叛逃到我们这一边，结束尼加拉瓜政府对他们的“压迫”。这为我们提供了一个很好的分散注意力的机会，同时也为我们提供了突破尼加拉瓜防线的机会。"
 nicdec.22.a:0 "我们的机会来了"
 nicind.1.t:0 "尼加拉瓜的经济状况"
 nicind.1.d:0 "尼加拉瓜尽管幅员辽阔，产品种类繁多。却被人们普遍认为是中美洲最贫穷的国家。持续的政治危机，美国的军事占领以及随后的革命斗争使我们的国家变得愈发贫困，出口也几乎全部中断。并迫使我们进入随后而来的漫长复苏阶段。\n\n因为我们对美国的依赖自从革命后他们停止从我们这里购买产品开始就已经基本消除了，眼下我们只能两手捧着希望与绝望寻找新的合作伙伴。被控制在一定限度内的外国依赖可以为我们带来巨大的利润，但我们必须充分意识到，美国总有一天会再次敲响尼加拉瓜国门的，而在那个时候，他恐怕会比以往任何时候都要强大……"
 nicind.1.a:0 "为了更美好的未来"
 nicind.2.t:0 "革命经济"
 nicind.2.d:0 "美国没有再次出现在我们的国境内，这多少给我们留下了许多机会。尽管我们最初的弱点仍然没有得到克服，但至少现在我们可以开始在经济上打造我们自己的未来了，那将是一个不再依赖美国出口的未来。我们现在走到更广袤的国际市场中去做广告。这就在我们的政府内部产生了建立“革命经济”的计划，该计划的重点是鼓励国内工业发展，引进新的贸易伙伴，尽可能地增加我国的经济的自主性，即使是轻微的进步。该计划已得到政府的批准并正式实施，但麻烦的问题在于，许多官员实际上不知道该如何实施这个计划……"
 nicind.2.a:0 "该计划将确保革命政权的稳定"
 nicind.3.t:0 "向社会主义的同志们打广告"
 nicind.3.d:0 "我们目前的社会主义政府被视为对德国和加拿大等资本主义政权的威胁，这让我们很难有效地触及它们的市场。然而，我们在欧洲还有许多合作伙伴可寻，尤其是法兰西公社和不列颠联盟，由于同我们的友好关系，他们非常愿意在我国进行投资。法兰西公社希望我们有能力在美国威胁中美洲地区时保护自己，而不列颠联盟则对刺激我们的民用经济增长，扩大出口规模感兴趣。我们应该选择哪一边呢？"
 nicind.3.a:0 "不列颠联盟将是可靠的伙伴"
 nicind.3.b:0 "法兰西公社将是可靠的伙伴"
 nicind.4.t:0 "尼加拉瓜正在寻找海外投资者"
 nicind.4.d:0 "中美洲的一位社会主义同胞已经使他在我们的圈子里变得非常出名，他们特别要求我们对他们的国家建设事业予以投资。从长远来看，投资于他们的国家肯定会让我们受益，与德国对抗的盟友自然也是越多越好。但在这样紧张的时间点我们却可能被迫保持沉默，因为德国的威胁随时可能降临。"
 nicind.4.a:0 "我们将为他们提供民用工业支持"
 nicind.4.b:0 "军事工业将帮助他们自卫"
 nicind.4.c:0 "我们有自己的切身利益要考虑"
 nicind.5.t:0 "向新投资者投放广告"
 nicind.5.d:0 "我们目前的社会主义政府被视为对资本主义政权的威胁，这让我们很难有效地触及它们的市场。然而这不代表合作就没有办法展开。北方的加拿大和东方的德国能够成为我们的好伙伴，他们也许会愿意在我国进行投资。[GER.GetNameDefCap]希望我们有能力在中美洲地区保护他们的投资和利益，而[CAN.GetNameDef]则对刺激我们的民用经济增长，扩大出口规模感兴趣。我们应该选择哪一边呢？"
 nicind.5.a:0 "[CAN.GetNameDefCap]将是可靠的伙伴"
 nicind.5.b:0 "[GER.GetNameDefCap]将是可靠的伙伴"
 nicind.6.t:0 "尼加拉瓜正在寻找海外投资者"
 nicind.6.d:0 "中美洲国家尼加拉瓜为了摆脱美国的控制而希望我们对他们的国家建设事业予以投资。从长远来看，投资于他们的国家肯定会让我们受益，有更多获取利润的途径总是更好的。但在这样紧张的时间点我们可能被迫保持沉默，因为工团主义的威胁随时可能降临。"
 nicind.6.a:0 "我们将为他们提供民用工业支持"
 nicind.6.b:0 "军事工业将帮助他们自卫"
 nicind.6.c:0 "我们有自己的切身利益要考虑"
 nicind.7.t:0 "[From.GetNameDefCap]为我们提供民用工业援助"
 nicind.7.d:0 "[From.GetNameDefCap]决定投资我国经济的民用部门，这将有助于我国和中美洲的长远未来。希望这能成为我们两国之间长期互利与投资友好的开端。"
 nicind.7.a:0 "新伙伴总是受欢迎的"
 nicind.8.t:0 "[From.GetNameDefCap]为我们提供军事工业援助"
 nicind.8.d:0 "[From.GetNameDefCap]决定投资我国经济的军事部门，这将有助于我国在未来可能的中美洲危机中保卫自己和他们的利益。希望这能成为我们两国之间长期互利与投资友好的开端。"
 nicind.8.a:0 "新伙伴总是受欢迎的"
 nicind.9.t:0 "[From.GetNameDefCap]拒绝了我们的要求"
 nicind.9.d:0 "遗憾的是，[From.GetNameDef]拒绝了我们的投资请求。虽然我们希望这不会破坏我们之间的关系，但我们可能在未来考虑看看其他投资者，因为事实证明他们对中美洲事务基本上不感兴趣。"
 nicind.9.a:0 "真丢人……"
 nicind.10.t:0 "经济现状"
 nicind.10.d:0 "尼加拉瓜或许不得不依赖外国势力的影响才能维持经济的稳定，这是我国不得不开始面对的可悲事实。走在我们前面的社会主义者曾经有着对国家经济实现完全保护的崇高理想，但他们最终失败了，我们不能重蹈它们的覆辙。美国的缺席给我们的贸易关系留下了一个明显的漏洞，为了我们的经济能够继续运转，我们需要找其他国家来取代美国的位置。"
 nicind.10.a:0 "一个悲哀的事实，但它仍然是一个事实……"
 nicind.11.t:0 "尼加拉瓜寻求援助"
 nicind.11.d:0 "我们最近对尼加拉瓜的占领使他们陷入了经济困境，显然他们的革命历史和把美国从画面上抹去的理想对他们饥饿的肚子来说毫无帮助。因此他们特别要求我们为他们的经济重建计划提供经济援助。我们可以作为占领方回应这种期望去帮助他们的需要，但是现在我们实际上也有自己的需要等待得到满足。"
 nicind.11.a:0 "满足他们的要求"
 nicind.11.b:0 "我们的国家利益才是第一位的"
 nicind.12.t:0 "[OVERLORD.GetNameDefCap]同意为我们提供援助"
 nicind.12.d:0 "我们仁慈的占领者[OVERLORD.GetNameDefCap]已经提供了我们所希望的经济援助。这将有助于我们从被占领的坎坷历程中逐步恢复过来，并使我们能够在不久的将来实现重新独立。"
 nicind.12.a:0 "他们真好"
 nicind.13.t:0 "[OVERLORD.GetNameDefCap]拒绝为我们提供援助"
 nicind.13.d:0 "占领者拒绝在我们需要的时候向我们提供援助。我们需要自己摆脱占领的经济困境，这可能会使我们的完全独立推迟一段时间。"
 nicind.13.a:0 "耻辱！"
 nic.8020.t:0 "接纳君主制"
 nic.8020.d:0 "关于索摩查受到世界各地君主制影响的胡言乱语。"
 nic.8020.a:0 "酷爆了！"
 NIC_36_election:0 "新的大选"
 NIC_36_election_desc:0 "1936年大选将成为尼加拉瓜革命共和国第二次大选。主要的竞争者有支持自由主义的胡安·包蒂斯塔·萨卡萨，支持穷人的弗朗西斯科·塞凯拉·莫雷诺，及革命英雄奥古斯托·塞萨尔·桑地诺。"
 NIC_freeing_people:0 "“为了解放人民"
 NIC_freeing_people_desc:0 "桑地诺最忠诚的支持者，被称为桑地诺派，一直在给当地民众和其他党派制造麻烦。桑地诺已经开始采取行动，安抚这一小部分人，让他们转变成愿意为革命，而不是桑地诺本人牺牲的高贵的士兵。"
 NIC_establish_sandinistas:0 "我们必须保护自己"
 NIC_establish_sandinistas_desc:0 "桑地诺希望通过制作宣传片的办法来安抚这一小部分人，把他们变成有尊严愿意为革命而死的士兵，而不是为桑地诺自己。"
 NIC_revolution_necessary:0 "并为和平带来革命”"
 NIC_revolution_necessary_desc:0 "桑地诺在利用军队传播革命之后，为即将到来的斗争制定了目标。首先，他要消灭流亡洪都拉斯的叛徒，然后把革命传播到中美洲其他地区，最后建立一个统一的中美洲政权。桑地诺将亲自带领军队投入战斗，用他的精神凝聚人民。"
 NIC_promoting_literacy:0 "“曾经，我目不识丁"
 NIC_promoting_literacy_desc:0 "莫雷诺的选举允许他推行改革国家的计划。他想解决的第一件事便是国内的高文盲率，他将建立学校，雇佣老师教授下一个通用语——西班牙语。"
 NIC_wealth_distribution:0 "身无分文"
 NIC_wealth_distribution_desc:0 "在完成教育改革后，莫雷诺转向专注于财富分配平等。他正在准备通过国家投资和夺取剥削人民的企业单位的资产，来为最穷的人提供大量的收入。"
 NIC_for_common_man:0 "所以我将支持平民”"
 NIC_for_common_man_desc:0 "莫雷诺的改革平息了许多曾经难以控制的单位。在国家安定下来后，莫雷诺宣布“准备好也向其他国家散播这种思想”了。"
 NIC_new_liberal_mindset:0 "“自由观念"
 NIC_new_liberal_mindset_desc:0 "萨卡萨一直关注着发生在尼加拉瓜的最初的自由革命，以及其失败和成功的地方。萨卡萨希望通过革命共和国实现自己的理想，并将其传播到中美洲其他地区。"
 NIC_new_bonds:0 "可以人人共享"
 NIC_new_bonds_desc:0 "是我们对美国的依赖迫使了自由革命的爆发，必须不惜一切代价避免再度陷入依赖。如果我们想长期维持成功，德国和加拿大等大国可能对我们有些兴趣。"
 NIC_relations_no_dependence:0 "只要我们一直自给自足”"
 NIC_relations_no_dependence_desc:0 "在外国人的帮助下，我们一定能完成目标，但是还要不计代价地避免美国。我们必须多样化关系，以避免再一次依赖单一强权。"
 NIC_seizing_countryside:0 "夺取乡村"
 NIC_seizing_countryside_desc:0 "随着美国自己崩溃，我们能让过去的四年有价值了。是时候以革命的名义，重新宣称国家东部。"
 NIC_begin_revolution:0 "传播革命"
 NIC_begin_revolution_desc:0 "虽然保卫自己国家很重要，但是向其他国家——比如洪都拉斯——传播革命也是必要的。我们必须用话语，或有必要的话用武力，把他们带进我们的事业。"
 NIC_liberal_revolution:0 "自由主义革命"
 NIC_liberal_revolution_desc:0 "桑地诺及他的党羽已被击败，现在的政权不仅承诺恢复国家经济繁荣，还要建立真正的民主政府。"
 NIC_collaborate_exiles:0 "与流亡者合作"
 NIC_collaborate_exiles_desc:0 "那些被桑地诺驱逐的人可以不再忍受被流放的耻辱了。我们现在正努力与他们构建合作关系，要么让他们回国，要么利用他们与当前所在国的关系。"
 NIC_removing_personality:0 "消除个人崇拜"
 NIC_removing_personality_desc:0 "桑地诺仅凭个人意志就颠覆了我们的国家机构，通过民众主义的情感诉求在许多人心中建立了一种类似邪教的虔诚。我们必须同他统治时期遗留下的这一阴险的遗产作斗争。"
 NIC_new_bastion:0 "新的民主堡垒"
 NIC_new_bastion_desc:0 "曾经，尼加拉瓜那些背负着自由十字架的人被认为已经被社会主义暴政永远消灭了。这种想法显然是有失偏颇的，因为信仰自由的人又在这个新时代重新崛起了！让我们像凤凰重生一般展开骄傲翅膀，不必沐浴在其他国家的光辉中，而是高傲地去塑造自己的命运。让我们成为一个真正的民主堡垒！一个真正来源于人民，服务于人民的国家！"
 NIC_victory_of_vargas:0 "巴尔加斯保守主义获胜"
 NIC_victory_of_vargas_desc:0 "革命和内战把国家撕成了碎片，激进的思想像野火一样烧过每一座城镇。现在火熄灭了，保守主义回来了。
 巴尔加斯代表的是秩序，是连续，是一套在尼加拉瓜已经立了将近一百年的东西。我们不认为政治应该是一场永远不停的试验。有些东西——家庭、宗教、财产、权威——值得捍卫，因为它们是经过时间检验的稳定基石。"
 NIC_new_money_law:0 "货币兑换法"
 NIC_new_money_law_desc:0 "通货膨胀是穷人的税。旧政权的末期，货币贬值得厉害，工资到手时还能买一袋米，过两天只能买半袋。保守党不会坐视人民的积蓄被通胀蒸发。制定严格的货币兑换法，推行金本位储备制度，约束政府滥发纸币的权力。货币的价值不是银行家说了算，是国家信用说了算。"
 NIC_oppose_liberals:0 "反对自由派"
 NIC_oppose_liberals_desc:0 "自由派在尼加拉瓜折腾了太久，每一次当政都留下一堆没兑现的口号和一摞写满漂亮话却没执行的宪法文件。他们热衷于抽象的“权利”，却回避具体的“责任”。保守党不准备搞意识形态的空中楼阁——我们相信的是权威、传统和已经存在的秩序，而非坐在客厅里凭空想出来的理想国。"
 NIC_empowered_presidency:0 "强总统，带好强国家"
 NIC_empowered_presidency_desc:0 "尼加拉瓜需要的是一个强悍的舵，不是一个永远在争论方向的讲堂。议会、法院、政党——这些都有它们的位置，但在国家方向的决定上，总统必须拥有不受掣肘的权力。让一个经过全国选民直接授权的人，有足够的手段去应对任何可能的危机。强势的总统才能带来强势的国家。"
 NIC_influx_of_immigrants:0 "促进移民"
 NIC_influx_of_immigrants_desc:0 "尼加拉瓜需要人。国土辽阔而人口稀薄，熟练工人、工程师、农艺师、医生都不够用，单靠本土的产业积累远远不够。向欧洲和北美敞开大门，欢迎那些勤劳、守法、信仰坚定的人。给他们土地，给他们公民身份，让他们在这里生根。我们不排外，只认的是秩序和价值，不是肤色。新来的移民将为尼加拉瓜注入奋斗的力量和不可估量的财富。"
 NIC_strong_n_stable_economy:0 "强大而稳定的经济"
 NIC_strong_n_stable_economy_desc:0 "巴尔加斯的经济政策不追求一鸣惊人的高速增长，也不追求漂亮的统计报表。鼓励外资进入，但合同条款必须经过政府严格审查，确保对尼加拉瓜有利。保守主义的底色是审慎。稳定比速度更重要。"
 NIC_reinvite_the_guard:0 "重新邀请国民警卫队"
 NIC_reinvite_the_guard_desc:0 "内战的教训之一是国家不能没有一支可靠的武装。国民警卫队虽然是美国人帮建的，但它的训练和纪律确实比任何游击队都强。保守党重建国民警卫队，请回被遣散的有经验军官，恢复原来的指挥体系。一支职业的、不问政治的军队，才是防止国家再次滑向内乱的铁栅。"
 NIC_establish_conservative_dominance:0 "确立保守派主导"
 NIC_establish_conservative_dominance_desc:0 "保守党在尼加拉瓜历史上曾有过将近三十年的稳定执政期，那段时间被称为“保守三十年”，每一任总统都依法交接权力，国家没有发生大的动荡。现在我们重新回到这个传统：保守主义成为国家政治的主导力量，其他声音可以表达，框架由我们来定。我们不为权力垄断感到抱歉——保守派从不道歉。稳固的引导才能避免国家再次成为各种意识形态的实验场。"
 NIC_presidential_republic:0 "总统眼中的尼加拉瓜"
 NIC_presidential_republic_desc:0 "巴尔加斯总统在他的就职演说里用了三幅画来描述他眼中未来的尼加拉瓜。第一幅：清晨的教堂钟声里，父亲带着儿子去望弥撒，街上没有人互相争吵，因为他们都相信同样的东西。第二幅：甘蔗田里，监工和雇工在同一张桌上吃午饭，没有人鼓动后者站起来反对前者，因为每个人都知道自己的位置并从中获得尊严。第三幅：总统府书房里的灯每晚十点准时熄灭，因为国家太平，不需要总统彻夜不眠。这就是保守主义要的尼加拉瓜：不必激动人心，但求安稳久远。"
 NIC_defend_free_speech:0 "捍卫言论自由"
 NIC_defend_free_speech_desc:0 "过去的政权把报纸当成公告栏，只许印官方许可的消息，不许记者问一句“为什么”。这种做法必须彻底废止。从今天起，任何公民都有权出版刊物、发表言论、批评政府，不必事先向任何部门申请许可。印刷机不再是政权的传声筒，而是公众的财产。我们相信真理只有在公开辩论中才能浮现，而不是在审查官的剪刀底下拼凑出来的东西。"
 NIC_our_friends_to_the_very_north:0 "与协约流亡政府建立联系"
 NIC_our_friends_to_the_very_north_desc:0 "英国和法国的本土发生了谁也想不到的翻天覆地的变故，但这两个国家的合法政府并没有消失。他们迁到了辽阔的殖民地，继承了欧洲自由体制的火种。他们的处境跟我们相似——都是在一片乱局中坚定的民主主义者。与他们建立正式联系，互派使节，商讨贸易和军事合作。"
 NIC_victory_of_juan:0 "胡安自由主义胜利"
 NIC_victory_of_juan_desc:0 "我们赢了，靠着每一个相信自由高于一切的人。胡安·巴蒂斯塔·萨卡沙是尼加拉瓜自由派当之无愧的旗手，他在美国留过学，深知民主制度对权力的制约机制和独立的司法体系如何运转。他亲眼见过一个建立在宪法和权利法案之上的共和国是什么样子。现在他把这套东西带回了自己的国家。军事强人和外国干涉军把尼加拉瓜当成棋盘太久了，从今天起，下棋的是尼加拉瓜人民自己。"
 NIC_defang_national_guard:0 "削弱国民警卫队"
 NIC_defang_national_guard_desc:0 "国民警卫队，这个名字在尼加拉瓜意味着什么不需多说。它不是国家的保卫者，是索摩查留给这个国家的隐患——一支凌驾于宪法之上的武装集团，谁控制了它谁就控制了总统。萨卡沙总统亲身体会过这种痛苦，他的任期就是被这支不受文官控制的军队架空的，他的政策被军头否决，他的命令走不出总统府的大门。现在我们要把它打散：削减编制，撤销其政治警察职能，所有高级军官必须接受文官政府的资格审查。一支民主国家的军队，枪口永远只对外不对内。"
 NIC_legacy_of_liberal_rev:0 "自由革命遗产"
 NIC_legacy_of_liberal_rev_desc:0 "这场革命不是一夜之间完成的。它的根源可以追溯到独立以来一批又一批的自由主义者前赴后继。从何塞·马德里斯·罗德里格斯到如今，他们反对过西班牙殖民者，反对过保守党寡头，反对过美国干涉，每一代人都在各自的战场上接过同一把火炬。我们现在站的这块地方，底下埋着他们的骨头。我们要编一本自由革命史，放进每一所公立学校的必修课程里，让后世知道自由不是天上掉下来的。"
 NIC_tackle_corruption:0 "摆脱腐败"
 NIC_tackle_corruption_desc:0 "革命让一大批靠旧体制发家的人浮出了水面。有些官僚在旧政权底下暗地里买卖官职、虚报采购合同、挪用公共工程款项，这些肮脏勾当连不穿制服的人都在做。现在我们要清理门户。彻查旧政权时期的非法所得，哪些是受贿吞下来的赃款，一律收归国库，用以重建学校和医院。腐败不只偷了钱，同样偷走了人民对国家的信任。"
 NIC_democracy_set_in_stone:0 "坚实民主"
 NIC_democracy_set_in_stone_desc:0 "民主不是隔几年投一次票就完事了，投票只是起点。一个坚实的民主制度需要独立的法院，需要不受政府控制的报纸和广播电台，需要市镇一级的地方自治，需要公民敢于在公开场合跟总统唱反调而不必担心第二天被带走。这些制度要一个一个建立起来。民主没有捷径，每天都要加固地基。"
 NIC_liberal_constitution:0 "推动自由主义宪法"
 NIC_liberal_constitution_desc:0 "尼加拉瓜宪法被前前后后改了许多遍，每一次修改都是为了方便当权者。现在我们要回归到法律文本最初的基石——制定一部真正自由主义化的宪法，以1898年宪法精神为蓝本，但去掉那些为寡头预留的后门。总统任期受限，立法权归国会，司法独立不受行政干预，军队接受文官控制。"
 NIC_integrate_sandinista_support:0 "整合桑迪诺残余势力"
 NIC_integrate_sandinista_support_desc:0 "桑迪诺的人还没有完全消失。他们在山区还有一些据点，拿着旧步枪，不信任任何来自首都的政府——这不怪他们，之前坐在总统府里的人确实不值得信任。但鉴于他们同样是尼加拉瓜人，我们派出代表去谈判：放下武器的不追究；愿意参与民主政治的欢迎组党办报并参加下一次大选。自由主义的胸襟不在于只容得下自己人，更在于容得下反对过自己的人。"
 NIC_absorb_moderate_conservatives:0 "吸收温和保守派"
 NIC_absorb_moderate_conservatives_desc:0 "保守党的问题在于他们跟着索摩查走太远了，但保守党里不是铁板一块。那些不愿意跟军头同流合污的温和派，那些真心相信秩序和传统但反对残暴统治的保守主义者，可以走进我们的帐篷。我们不改变自己的自由派底色，但国家的重建需要所有愿意守法的人参与。这与党派无关，是对智识和诚恳的判断。"
 NIC_parlimentary_democracy:0 "尼加拉瓜的真正民主"
 NIC_parlimentary_democracy_desc:0 "我们走完了漫长的一段路。从独裁到革命，从革命到民主，每一步都踩在刀尖上。现在我们要把民主种进尼加拉瓜的泥土里，让它在市政厅、在乡村法庭、在每一个纳税人对自己缴的税有知情权的地方生根。"
 NIC_victory_of_moncada:0 "蒙卡达赢得总统职位"
 NIC_victory_of_moncada_desc:0 "何塞·马里亚·蒙卡达向尼加拉瓜人承诺过一件事：自由主义可以在秩序中实现。他不是一个只会喊口号的煽动家，他是从护宪战争中打出来的老将，知道什么时候该作战、什么时候该坐下来谈。现在他坐进了总统府，带着一个军人的务实和一个自由主义者的信念。国家不再需要更多的街头冲突了。"
 NIC_the_ideal_citizen:0 "理想公民"
 NIC_the_ideal_citizen_desc:0 "民主不只是制度的运转，更是人的塑造。蒙卡达总统相信，一个国家要想走得远，得先有一批知道怎么使用自由的公民。他们不盲从，不暴戾，能耐心听完对手的观点再反驳，能守法不是因为害怕警察而是因为自觉。教育不止教读写算，更要教公民责任。一个理想公民，排队时不插队，投票前先读候选人的政纲，交税时知道这些钱会被用到什么地方。"
 NIC_seperation_of_church_state:0 "政教分离"
 NIC_seperation_of_church_state_desc:0 "教会给尼加拉瓜做了几百年的精神导师，也做了几百年的政治操盘手。现在该把神父的手从政治机器上拿开了。宗教是每个人的私事，但国家事务不归教会管。世俗教育、世俗婚姻、世俗法律——这三条线不能越。打击信仰是次要，主要是为了保护每一个人不因信仰或无信仰而受胁迫。"
 NIC_congressional_support:0 "国会支持"
 NIC_congressional_support_desc:0 "总统不是一个人唱独角戏。蒙卡达需要国会的支持，但他不打算靠收买和威胁来拿支持。他要站在国会讲台上，把每一项法案的理由讲清楚，让反对他的人也能在会上当面反驳他。国会的走廊里不该只有鼓掌，还应该有争吵，而票数决定结果。自由主义的运作要靠这种不完美但真实的程序，而不是靠一个人的意志。"
 NIC_increase_election_supervision:0 "加强选举监督"
 NIC_increase_election_supervision_desc:0 "蒙卡达自己是在美国有限的监督下当选的，这点谁都清楚。但那是过去的事了。现在我们的选举要自己监督。成立独立的中央选举委员会，由各党派和公民团体共同派人组成，投票日全程透明，从开票到计票的每一步都向所有参选者和公众开放。任何试图买票、恐吓选民、篡改选票的人，一律以叛国论处。一张选票就是一个尼加拉瓜人的尊严，少一张都不行。"
 NIC_nicaraguan_liberalism_born_anew:0 "尼加拉瓜自由主义重获新生"
 NIC_nicaraguan_liberalism_born_anew_desc:0 "自由派在这片土地上起起落落太多次了。上世纪初和保守党打过的内战还在祖父辈的嘴里流传，后来有过独裁，有过革命，有过反反复复的重大打击。蒙卡达想要一个新的开始：自由主义不再是某个家族的政治标签，成为一套完整的制度设计——代议制、地方自治、司法独立、个人权利受宪法保障。这场重获新生的自由主义和一百年前那个只代表庄园主利益的旧自由主义不一样了。它属于所有人，包括那些曾经被自由主义忽视的人。"
 NIC_advocate_manhood_suffrage:0 "男性普选倡导"
 NIC_advocate_manhood_suffrage_desc:0 "让每一个成年男子都有一张选票，不管他有没有地产，不管他认不认字，不管他住在首都还是最远的山区。以前反对普选的人说，穷人不识字怎么投票？那我们就一边推行普选，一边把识字课本送到每一个村庄。投票权不是奖品，有谁够格了才要发给他，而是一个人与生俱来的权利。"
 NIC_question_of_amnesty:0 "特赦问题"
 NIC_question_of_amnesty_desc:0 "内战结束了，但内战留下的仇恨还未消散。胜利的一方如果只顾报复，那和平就只是两次战争之间的中场休息。蒙卡达主张有条件特赦：凡是没有直接下令或参与杀害平民和战俘的旧政权军人与文官，一律不追究。对于那些手上沾了无辜者鲜血的人将依法审判，但审判面前最好不搞株连。"
 NIC_coalition_democracy:0 "联盟民主"
 NIC_coalition_democracy_desc:0 "蒙卡达将军在护宪战争中指挥过各路义勇军，他深知想在尼加拉瓜搞民主，单靠一个政党是撑不起来的。城市里的商会、农村里的合作社、退伍军人联合会、教师公会——这些团体各自代表着一部分人的利益和声音。把它们纳入一个正式的联盟体系，每一个社群都有自己的代言人，国会不是政党的俱乐部而是全国各种合法利益的合议庭。民主制度在这个国家的根基尚浅，需要来自不同方向的支撑。"
 NIC_hail_to_thee_nicaragua:0 "上帝、秩序、正义"
 NIC_hail_to_thee_nicaragua_desc:0 "这是一百年来我们高举的三个词。上帝不是教会的那上帝，是良知的上帝，是每一个正直的人在深夜无人时自己面对的那一位。秩序是法律被遵守、契约被尊重、财产被保护、每个人都知道自己明天的生活不会被一纸通令搅乱的秩序。正义，不是强者的施舍，是天平无论对谁都不倾斜。这三个词刻在三角徽的三条边上，也将刻进尼加拉瓜未来的每一根梁柱。我们在书写一段比首都更长久的存在，一段刻在尼加拉瓜山川上的历史。"
 NIC_socialist_revolution:0 "社会主义革命"
 NIC_socialist_revolution_desc:0 "社会主义者已经完全控制了这个国家。尼加拉瓜现在坚定地走在严格的社会主义道路上，而不受自由主义复兴的威胁！"
 NIC_new_coalition:0 "新联合政府"
 NIC_new_coalition_desc:0 "必须设置新的规范，例如新选举的条件，并应在形式上进行这些选举。毕竟，行政部门权力的巩固很容易颠覆这场革命。"
 NIC_victory_of_sandino:0 "我们国家英雄的胜利"
 NIC_victory_of_sandino_desc:0 "桑迪诺将军浇灌的种子今天破土了。我们这些扛着他的旗帜一路打过来的人，为人民看到了这一天——资产阶级自由派嚷嚷了那么多年"民主""自由"，到头来还是跟庄园主坐一条板凳。只有我们把枪攥在自己手里、把土地踩在自己脚下的人，才配说我们赢了。
 我们的血没有白流。"
 NIC_oppose_dems:0 "摧毁民主思想"
 NIC_oppose_dems_desc:0 "资产阶级民主是天底下最不要脸的骗局。他们说每个人都有投票权，但庄园主买得起的报纸和电台把选民的脑子先洗过一遍。他们说法律面前人人平等，但雇农告庄园主从来立不了案。隔几年拉你去投一次票，投完了你继续饿肚子，他继续收租而一切照旧。这套把戏骗了尼加拉瓜人太多年。今天我们要把它连根拔掉，从教科书里删掉那些美化资产阶级代议制的鬼话，让每一个劳动者看穿"民主"两个字底下盖住的是一双双在数钞票的肮脏肥手。"
 NIC_go_against_auths:0 "暴君无立足之地"
 NIC_go_against_auths_desc:0 "索摩查被打倒了，但以前他手底下的行刑队头子、特务头目、秘密警察头子，还在某个角落里躲着等翻盘。我们不会给他们这个机会。专政的铁拳该砸到谁头上时不能含糊。凡是手上沾过革命者鲜血的依法严惩，包庇旧政权罪犯的同罪。让全尼加拉瓜看着：骑在人民头上拉屎撒尿的日子彻底过去了。"
 NIC_indo_hispanisism:0 "捍卫印欧混血种族"
 NIC_indo_hispanisism_desc:0 "尼加拉瓜的血脉是印第安母亲和西班牙父亲混成的，不管你喜不喜欢，这已经是事实。白人殖民者骂我们是"杂种"，几百年了，他们一边侮辱我们的血统一边榨干我们的土地。我们要堂堂正正捍卫印欧混血种族的尊严——没有反过来去歧视谁，但要把这几百年被白人踩在脚下的自信捡回来。我们是混血，我们创造了独一无二的文化、语言、音乐、食物，我们已经足够伟大，不需要任何人的专门认可。"
 NIC_voz_del_sandinismo:0 "桑迪诺之声"
 NIC_voz_del_sandinismo_desc:0 "让桑迪诺的声音在每一间工厂、每一片甘蔗田、每一个印第安村落重新响起。叫每一个劳动者读得懂他的话、议论得了他写的东西、把他的主张变成自己车间里和村子里的实际决定。办报纸，建广播站，编识字课本，把他的演讲和书信送到最偏远的山区。资产阶级用他们的报纸每天往人脑子里倒垃圾，我们也可以拿桑迪诺的声音把那些垃圾冲干净。"
 NIC_empower_AMNLAE:0 "赋权尼加拉瓜妇女协会"
 NIC_empower_AMNLAE_desc:0 "革命要是只让男人做主，那顶多算干了半场。尼加拉瓜的妇女们，种地的、缝纫的、头顶货物走街串巷叫卖的、在游击队里背着急救包跟男人一样跑山路的——她们的担子也不轻，声音却一直不被当回事。从今天起妇女协会不是花瓶摆设，有了实权。婚姻自由被写进法律，家庭暴力不是"家务事"而是犯罪，同工同酬不讨论不商量直接执行，试着将避孕和生育医疗由国家免费优先提供。让女人的身体女人自己做主，女人的脑子女人自己做主。"
 NIC_strengthen_the_workers_centre:0 "加强桑迪诺工人中心"
 NIC_strengthen_the_workers_centre_desc:0 "军工不能交给资本家，也不能全让穿军装的人自己关起门来搞。建立桑迪诺工中心，把军工厂跟周边的产业工人绑成一个整体。工人委员会参与管理生产计划，技术骨干从车间里民主推选，生产线上造的每一支枪、每一颗子弹，工人都知道要去保卫什么。我们要的是有觉悟的军工生产者，不是资本主义社会里那种拿工资的雇佣匠。"
 NIC_elevate_liberal_revolution:0 "提升自由革命"
 NIC_elevate_liberal_revolution_desc:0 "革命不能停留在分地、涨工资这些物质层面。物质改善了，脑子里还跪着，那早晚还得趴下。我们要提升这场革命的高度——把教育从教会手里彻底夺过来，把科学和理性送进每一间课堂，把艺术从沙龙里解放出来走到街头。尼加拉瓜人要学会用批判的眼睛看世界，用自由的心灵做选择。革命解放了身体，那么也要解放精神。"
 NIC_root_out_yanqui_influence:0 "赶走美国蛆"
 NIC_root_out_yanqui_influence_desc:0 "美国人滚蛋了，美国蛆没清干净。大使馆和顾问撤回去后，还留下了一窝在尼加拉瓜人身上吸了几十年血的买办。这些买办现在倒是不说英语了，换上西语来装自己人，继续替华尔街的钱袋子张目。他们渗透在商会里，窝在报社编辑部里，坐在咖啡馆里等着风向变了再爬回来骑在我们头上。现在我们要一个一个把他们揪出来。非法勾结外国公司的财产没收充公，替外国情报机构跑腿的按叛国罪论处。"
 NIC_give_ufc_land_to_people:0 "重新分配联合果品公司土地"
 NIC_give_ufc_land_to_people_desc:0 "联合果品在尼加拉瓜占了几十年，占着最好的河谷地种香蕉，把收成往北一船一船运，留给我们的只有几间破木板房和几张吃不饱的工资单……这种日子现在结束了。联合果品的全部土地收归国有，按人口分给没有地的雇农，优先分给当年在种植园里挨过皮鞭、饿过肚子的人。不需要地主来教我们怎么种地，雇农比谁都懂泥土。"
 NIC_free_homeland_or_die:0 "尼加拉瓜不受任何国家控制"
 NIC_free_homeland_or_die_desc:0 "以前美国人坐在华盛顿遥控尼加拉瓜的海关和铁路，我们赶走了他们。现在换谁来也不行——第三国际的同志也不行，邻国的盟友也不行。援助，贷款和技术来自外国，但决定尼加拉瓜种什么、造什么、怎么分配的人必须是尼加拉瓜人自己。本土工业我们要一步一步建起来，先满足自己的粮食和基本日用品生产再谈出口。政治独立管不了多久，如果没有经济独立撑着，迟早得再次跪下去。"
 NIC_pure_anti_imperialism:0 "反抗我们种族之敌"
 NIC_pure_anti_imperialism_desc:0 "白人至上主义者从来没有消失过。他们以前开着军舰来，现在可能换西装打领带来，但看我们的眼神没变过——还是那种"你们这群混血杂种不配管理自己"的眼神。对这种人没有什么可讲，只有反抗。移民政策从严，外国人的土地购置权严格限制，防止白人殖民者以任何形式卷土重来。谁敢用种族歧视的嘴脸对尼加拉瓜人讲话，谁就是我们不戴手套就要出拳的敌人。"
 NIC_empower_sandinistas:0 "坚定桑迪诺主义者"
 NIC_empower_sandinistas_desc:0 "动摇的人走不远。革命到现在，有人开始嘀咕了，说步子迈得太快，说对外太硬，说对内太严。这些人当初也喊过桑迪诺万岁，现在看到困难就想往后缩。我们要培养一批坚定分子——不是只会喊口号的那种，是能在最困难的时候把队伍稳住、能在最复杂的局面里把方向看清的人。把这些人放在关键岗位上，放在军队里，放在工会里，放在学校里。革命要走得远，革命需要骨头硬。"
 NIC_spiritism:0 "光明与真理的灵性主义"
 NIC_spiritism_desc:0 "桑迪诺将军不是一个只会打仗的粗人，他的精神世界里有一套完整的东西。他相信光明终将战胜黑暗，相信真理有一种不能言说但能感知的力量。这不属于任何一家教会的专利——教会跟庄园主勾结了好几百年，早就没有资格谈论光明。我们要重新发掘桑迪诺灵性主义的核心：正义不只是分配问题，是一种精神境界，是让自己的灵魂配得上革命这两个字的分量。"
 NIC_general_of_free_men:0 "自由之将"
 NIC_general_of_free_men_desc:0 "桑迪诺将军已经是这个国家永远的将军。我们不喊他"总统"，总统这个词被太多小人用过。我们现在喊他"自由之将"，因为他打的每一仗都不是为了换谁坐江山，是为了让尼加拉瓜人不再跪着。这个称号刻在军校大门的石头与印在教科书的扉页上，让后世每一代士兵和学童都知道，尼加拉瓜的自由来自哪里。"
 NIC_socdem_coalition:0 "工人民主的胜利"
 NIC_socdem_coalition_desc:0 "社会主义者打赢了，这个事实谁也改不了。但胜利之后怎么走，不是只有一条路。工人阶级的民主不意味着把所有人都赶到一个模子里，不意味着只有一种声音能说话。我们是工人，我们最懂得团结，而团结是商量出来的。从今天起，工会是工人自己的组织，不是政府的传声筒。"
 NIC_government_for_people:0 "心系人民的政府"
 NIC_government_for_people_desc:0 "政府里的人应该每天早上醒来先想一件事：街上的人今天过得怎么样。面包贵不贵，公交车挤不挤，医院排队要多久，学校里有没有粉笔。这些问题不是什么高深的政治课题，是检验政府成色的最低标准。我们不要坐在办公室里看报表的官僚，要把干部赶到街头、赶到村里去，去听难听话，去办实在事，叫他们习惯心系人民。"
 NIC_ensure_prosperity_for_peasants:0 "确保农民富裕"
 NIC_ensure_prosperity_for_peasants_desc:0 "把农产品收购价提到合理水平，不要让中间商从农民的汗水里抽走一半的钱。再修路，让收成能运出去不烂在路上。再建技术站，教良种、教防虫、教轮作。最后把贷款利息降到农民还得起的程度。一步一步来，城里的工人兄弟不会跟农民争利，因为革命的旗帜是大家一起扛的。"
 NIC_expanding_peasant_revolution:0 "优先考虑农民革命"
 NIC_expanding_peasant_revolution_desc:0 "革命要巩固，先巩固农村。土地分配扫尾工作做扎实，不留纠纷尾巴。化肥和农药的供应由政府统一采购压价，不让农资商赚黑钱。农村治安由民兵自己维持，不让旧警察残余欺压乡里。农民稳了，国家就稳了。"
 NIC_reconciling_sacasa:0 "“修复”社会主义派与自由派关系"
 NIC_reconciling_sacasa_desc:0 "自由派被击败了，但他们当中的多数不是死敌，是被资产阶级宣传裹挟的普通人。现在抛出橄榄枝：放下武器的不翻旧账；愿意参加建设的给岗位；医生、工程师、教师这些专门人才，不管过去站哪边，只要愿意为人民工作，统统留用。全民医保这件事不应该有党派标签，谁为人民服务我们就跟谁合作。"
 NIC_agriculture_industry:0 "农业派胜利"
 NIC_agriculture_industry_desc:0 "工业建设不能吸农业的血。有些干部从进城那天起就看不起农村的事，张嘴就是搞工厂、搞重工业，好像种地是二等产业。这种偏见必须纠正。国家经济政策的优先序，农业排在第一档。以农养工，以工促农，这八个字顺序不能倒过来。"
 NIC_reject_sandinista_conquests:0 "拒绝桑迪诺主义"
 NIC_reject_sandinista_conquests_desc:0 "我们拒绝"桑迪诺主义"这个被教条化了的标签。有人把桑迪诺主义变成了一本不许质疑的经书，动不动就用它对别人搞清洗。我们走的是社会主义的路，但不会用任何人的名字来封自己的门。强大军队靠的是制度建设和专业训练，不靠背诵谁的语录。"
 NIC_form_the_MRS:0 "成立桑迪诺革新运动"
 NIC_form_the_MRS_desc:0 "桑迪诺主义不能僵化。时代在变，中美洲的形势在变，全世界的社会主义运动也在变。我们要在桑迪诺的旗帜下做符合时代要求的革新，吸收新一代知识分子的思考，接受工农群众的批评，修正过去执行中出现的偏差。"
 NIC_easing_cult_of_sandino:0 "缓解桑迪诺崇拜"
 NIC_easing_cult_of_sandino_desc:0 "桑迪诺将军是英雄这一点谁也不能否认。但把他摆上神坛、每句话都当圣旨念，这就不是尊重是迷信了。革命的领袖也是人，也会受时代局限，他当年的某些策略放在今天未必适用。我们学习他的精神，但不许搞个人崇拜，一个健康的政治生活不需要泥塑的神像。"
 NIC_large_education_funding:0 "资助低等学校"
 NIC_large_education_funding_desc:0 "教育从最底层抓起。那些最破的乡村小学，茅草顶、泥巴墙、一个老师教六个年级——这种学校才是革命该最先伸手的地方。拨专款翻修校舍，给乡村教师加津贴，让每个孩子不管生在哪个山沟都至少念到中学。"
 NIC_contacts_with_internationale:0 "与国际的联系"
 NIC_contacts_with_internationale_desc:0 "国民警卫队的旧军官流散到了周边国家，有些人还在跟外国情报机构眉来眼去。我们不能假装看不见。加强与国际上友好国家的安全合作，对跨国旧军官网络保持监控。外交上低调行事，不主动树敌。"
 NIC_prospering_peasant_class:0 "繁荣的农民阶级"
 NIC_prospering_peasant_class_desc:0 "农民富起来，农村才能旺起来。推动经济作物多样化，不要只盯着一两种换汇作物。发展小城镇手工业，让农闲劳动力有活干有收入。农村信用社真正办成农民自己的银行，贷款不找关系不送礼。"
 NIC_triumph_of_cabuya:0 "卡布亚凯旋"
 NIC_triumph_of_cabuya_desc:0 "卡布亚是那个谁也绕不开的地方。桑迪诺将军在卡布亚打过最漂亮的一仗，那一仗代表了尼加拉瓜人民之坚韧。我们的队伍从全国各地行军到卡布亚集结，为了纪念，我们在当年战壕的旧址上建一座纪念馆，让后世子孙知道他们的祖父辈拿什么换来了今天。
 卡布亚成为了一个人的纪念地，整个尼加拉瓜工人阶级的朝圣地。"
 NIC_second_occupation:0 "第二次占领"
 NIC_second_occupation_desc:0 "继上次入侵之后，尼加拉瓜第二次被外国人占据了。在南方，桑地诺仍然威胁着政府，在北方，有着我们必须服从的宗主，只有向它宣誓效忠，我们才能在对抗桑地诺的斗争中生存下来。"
 NIC_garcia_in_power:0 "加西亚地位"
 NIC_garcia_in_power_desc:0 "塔乔·索摩查在这片土地上从来都是赢家。他活着走出了所有人的谶言，活到了今天，把反对过他的人都熬死了或快熬死了。现在他重新坐在总统椅上，不算什么翻天覆地——只是回到了本来的座位。那些一度以为索摩查家族结束了的人，现在听到他的名字又得学会闭嘴了。"
 NIC_bigger_coffee_farms:0 "咖啡必须生长"
 NIC_bigger_coffee_farms_desc:0 "这个国家的一切说到底都从土里长出来。咖啡是尼加拉瓜的命脉，能出口的多少只有它。所以咖啡种植园必须扩张，不管种的是谁的地，不管原来住在那儿的是哪个部落，咖啡必须生长。需要劳动力就把人迁来，需要水源就改河道，需要土地就清林子。一袋咖啡豆出港就是一袋外汇，这笔账并不复杂。"
 NIC_pacific_railroad:0 "加强太平洋铁路"
 NIC_pacific_railroad_desc:0 "我们要扩建翻修一遍西部的铁路网，便利货品的进出口。"
 NIC_modernize_national_guard:0 "现代化国民警卫队"
 NIC_modernize_national_guard_desc:0 "我们有过一支像样的国民警卫队，后来被弄散了。现在我们要把它重建起来，而且要建得比从前更好：统一制服、统一武器、统一操典，新兵要认字，军官要学现代参谋作业。这支军队由索摩查家族直接掌握，不经过任何文官委员会扯皮。国内治安、反游击和边防守备一肩挑。一支现代化的军队是一个现代化政权最可靠的底座。"
 NIC_family_dictatorship:0 "王室独裁"
 NIC_family_dictatorship_desc:0 "我们不必假装这是一个共和国。共和国的名字只适合那些有教养的、有财产的人，而尼加拉瓜遍地是文盲和短工，这种人拿选票能干什么？只会被人拿一顿饭就换走。所以我们不要共和国的虚壳。总统就是国王，只不过不戴王冠。权力传给儿子，这是再自然不过的事。家族比任何政党都值得信任，因为财产是自家的，谁也背叛不起。"
 NIC_biased_constitution:0 "带有偏见的宪法"
 NIC_biased_constitution_desc:0 "宪法这种东西，不能没有，因为有外国人要看。但它也不能太顶用，因为不看的时候我们还得用它管人。我们把宪法修改一遍，形式上保留自由和权利的漂亮词句，实质上在每一个条款底下加上附加条件：言论自由不得危害公共秩序；集会自由需事前审批；法律面前人人平等，但现任总统及其家族不受一般司法管辖。偏见的宪法比诚实的刺刀更好使。"
 NIC_foreign_concessions:0 "扩大外国特许权"
 NIC_foreign_concessions_desc:0 "尼加拉瓜有的是矿藏和沃土，缺少的是资本。我们不打肿脸充胖子，把矿产开采权、铁路经营权、港口使用权打包卖给外国公司，美国人想要什么就给他们什么，只要每年把该交的税款和分成按时打进来。土地闲着是废的，矿埋在地下是死的。拿来跟外国人的资本碰一下，才能碰出油水来。"
 NIC_tacho_victorious:0 "塔肖凯旋"
 NIC_tacho_victorious_desc:0 "塔乔回到了他当年骑马走进马那瓜的那条街上。街道铺了新沥青，沿途的屋子重新粉刷了一遍，欢迎的横幅遮住了当年弹孔留下来的墙疤。
 他把军帽摘下来向人群挥了挥，吩咐副官晚上把今天各地的治安报告送到他书房。
 你们的王还在这里。"
 NIC_diaz_in_power:0 "迪亚兹地位"
 NIC_diaz_in_power_desc:0 "阿道夫·迪亚兹从来不是靠演说上位的。他是管账的人，一个懂得怎么跟美国人坐在同一张桌上谈条件的人。尼加拉瓜不需要空谈家，总统府里坐着的应该是一个能让华盛顿回他电话的人。迪亚兹能让白宫回电话，就冲着这一条，他就配这把椅子。"
 NIC_empower_presidency:0 "强大的总统制"
 NIC_empower_presidency_desc:0 "总统不能只是一个象征性的角色。总统必须有解散议会的权力，有直接任命各省长官的权力，有未经国会核准就调动军队的权力。三权分立在太平时节也许是美德，但我们这个国家贫弱又动荡，需要一个能独自拍板的人，总统不需要说服所有人，只要大多数人觉得过得去就行。"
 NIC_use_the_nicaraguan_national_guard:0 "使用国民警卫队"
 NIC_use_the_nicaraguan_national_guard_desc:0 "国民警卫队既然建起来了就不能当摆设。哪里不听话，就开到哪里去。工人罢工进行驱散；农民抗租进行镇压；学生上街去抓领头的。旧政权对国民警卫队用得畏畏缩缩那是，因为畏惧国际舆论。相对的，我们就不那么在乎舆论。稳定国内秩序不需要温柔的手段。枪膛里装着子弹却不开火这种事只有懦夫才干的出来。"
 NIC_a_newer_better_canal:0 "尼加拉瓜运河"
 NIC_a_newer_better_canal_desc:0 "尼加拉瓜的地峡夹在两大洋之间，这是老天爷留给这个国家唯一的东西。运河一旦建成，全世界的商船都将绕不开我们，东海岸到西海岸不再需要绕过合恩角。美国人不会乐意看到航道不归自己控制，所以他们必须参与进来。我们把运河的股份分出去，只留比必要多一点点的发言权。运河开凿完成之日，就是尼加拉瓜从一个被地图忽略的犄角旮旯变成全球航运坐标的那一天。"
 NIC_build_up_industry:0 "尼加拉瓜军工"
 NIC_build_up_industry_desc:0 "指望外国一直卖给我们武器，是把脖子搁在别人的刀刃上。我们可以从装配线起步——先建几条小型弹药生产线和步枪修理厂，再逐步过渡到零件仿制和整枪组装。军需自给哪怕只达到三成，也能在关键时刻不至于被别人用断供来修理。武器不一定要最先进，但要能在被封锁的时候继续流水下线。"
 NIC_keep_good_relations_with_yanquis:0 "洋基佬支持"
 NIC_keep_good_relations_with_yanquis_desc:0 "美国人需要我们在自己的土地上替他们做一件事，即守稳。他们只需要把钱和军火从后门递进来，把外交压力挡掉。我们拿走他们的援助，接受他们的军事顾问，在大方向上保持默契。因为尼加拉瓜本来就没有多少主权可卖——先得把国家捏成一个整体，才有资格谈独立。"
 NIC_build_up_roads:0 "建设尼加拉瓜基建"
 NIC_build_up_roads_desc:0 "公路不通，军队的调动就要以天来计算，农产品的运出就要腐烂在路上。我们需要把公路从沿海向内陆打通，把桥梁从朽木换成钢架，把电报线架过省份之间的山区。要知道基建是统治的神经网络。"
 NIC_the_eternal_presidency:0 "永恒总统"
 NIC_the_eternal_presidency_desc:0 "连任，再连任，再连任……总统到任期什么也不会发生，任何人事变动都会带来不必要的风险。把迪亚兹的名字写进宪法，废除掉任期上限。他活着时他就是总统。直到时间决定我们不得不换人，而不是议会决定我们想换人，更不是人民决定我们要换人。一个稳定的国家不需要太多张不同的面孔，一张已经足够。"
 NIC_go_against_sandino:0 "打击桑迪诺主义者"
 NIC_go_against_sandino_desc:0 "桑迪诺的残部缩进了南方的丛林，以为雨季和泥泞能像当年掩护他们打美国人那样再掩护他们一次。当年美国人输掉是因为他们不想陷在这里，但我们不一样——我们哪儿也不去，我们有的是耐心和足够多的兵力，一个山头一个山头地清剿，一个村子一个村子地排查。桑迪诺主义这团鬼火总有被扑灭的时候。"
 NIC_crush_liberals:0 "粉碎民主逼"
 NIC_crush_liberals_desc:0 "尼加拉瓜被民主这个词折腾了太多年了。政客们用它当梯子往上爬，爬上去就把梯子踢掉；暴民们用它当借口烧法院、抢店铺。民主在尼加拉瓜从来不意味着自由，只意味着混乱——现在我们把这场闹剧叫停。从今天起，国家不再交给那些只会演说的人来管理。秩序优先于选票，稳定优先于辩论。那些还在街头嚷嚷"权利"的人很快会明白，权利的第一个前提是你生活的社会还没有散架。"
 NIC_nicaragua_in_our_palms:0 "尼加拉瓜掌握在我们手上"
 NIC_nicaragua_in_our_palms_desc:0 "旧政权的残余势力在乡村和边境线上挣扎，苟延残喘，靠着走私和恐吓维持最后几块地盘。这些地方不再有庇护所了。我们的军队推进到每一个省份的最后一公里，把那些还在举着旧旗的人从山洞里、从密林深处一个接一个地拖出来。整个尼加拉瓜被彻底封锁在我们的掌心里，没有人可以在我们不同意的情况下呼吸。"
 NIC_aragua_free_secure:0 "尼加拉瓜自由且安全"
 NIC_aragua_free_secure_desc:0 "自由是什么？站在街头骂总统的自由不是自由，晚上睡觉不用锁门的自由才是，你的孩子走在上学路上不会被流弹打中的自由才是，商人运一车货不需要给沿途五拨人交买路钱的自由才是。我们给出的就是这种自由，不是书本上的那种。谁要破坏这种自由，我们就让它不再自由。"
 NIC_anarchist_revolution:0 "红与黑，萨夸安霍切花绽放"
 NIC_anarchist_revolution_desc:0 "独裁者的靴子踏碎了旧尼加拉瓜，美国人走了又回来，回来又走了，每一次都在泥里留下更深的车辙。我们被教会了恐惧——恐惧军装，恐惧警棍，恐惧任何自称要替我们做主的人。但恐惧底下还压着另一件东西。
 萨夸安霍切花从来不在庄园的花圃里开放。它在火山岩的裂缝里生根，在旱季最干裂的土里抽出花茎，一根茎托起两片花瓣，一片红得像血，一片白得发黑。
 谁为它浇水？雨水是热的。
 谁给它施肥？腐烂的落叶和偶尔路过死去的鸟。
 整个国家插遍了别人的旗帜，只有这种花还是自己的。我们没读过多少理论书，但我们都认识萨夸安霍切。它教会我们一件最简单的事：你不需要一块好地才能开花。水泥封住了街道，焊铁锁住了港口，到处都在查通行证。可是水泥的裂缝里已经开始冒出白色。我们蹲下身，谁也没有说话。
 £R不在沉默中爆发，就在沉默中灭亡。§!"
 NIC_the_great_three:0 "三大伟人"
 NIC_the_great_three_desc:0 "有一间地下室，墙上贴了三张版画，分别是里维拉、奥罗斯科、西凯罗斯。这三个人从来没有扛过步枪，但他们画的墙比任何堡垒都坚固——里维拉画的是被枪托砸弯腰的甘蔗工，一群人的脊梁弯成了同一道弧，弧的尽头是一把正在举起来的砍刀；奥罗斯科画的是一个女人在废墟里竖着一面撕烂的旗，旗上的颜色已经烧成灰褐色的疤，但旗杆没有倒，女人的手臂也没有垂下；西凯罗斯画了一组前倾奔跑的轮廓，腿肌绷得像缆绳，从画框左边冲向右边，颜料因为干得太急裂开了纹，裂开的纹路反而让那些腿看起来正在发力。我们找了本土的匠人，把他们的画临摹在马那瓜最显眼的那面墙上，版画刀刻出的线条放大到一整面墙那么高，每一个走过的人仰头都能看见。他们是墨西哥人，不是尼加拉瓜人。但他们画的似乎就是我们——被摔在地上的、被吊起来的、被扔进沟渠的、被埋在无名土堆底下的，以及所有这些人的对手：那些脸上没有五官、只有一双锃亮军靴的空白形体。这三个人证明了画笔和火药一样能打死人。
 ——打不死人也能叫人活过来。"
 NIC_fate_of_sandinistas:0 "整合桑迪诺派"
 NIC_fate_of_sandinistas_desc:0 "桑迪诺派的人在山里打了那么多年的仗，他们知道哪条河在雨季会涨，哪片林子能藏一个连，哪个村子的老人会主动放风。他们是这片土地上最会打游击的人，孤军奋战太久了。有人怕他们，有人崇拜他们，有人不理解他们为什么在胜利之后还不肯放下枪。我们知道枪不是迷信而是记忆——他们记得每一次放下枪以后发生了什么。
 所以我们去找他们。把他们的经验融进我们正在编织的这张网——公社之间没有上下级，指挥部在每个公社自己的会上，桑迪诺派的骨干们是这个自治网里的神经节，不是坐在上面发号施令的人。他们教会我们丛林生存，教遭遇战，教怎么在切断补给的情况下继续移动。我们教他们怎么在一场大会上说服三十个互相不认识的农民达成一致意见。两种经验拧在一起，就是超越了成吨的教条。"
 NIC_rights_of_man_and_citizen:0 "人权与公民权"
 NIC_rights_of_man_and_citizen_desc:0 "旧政权的人权是客厅里念给洋人听的客气话。我们要的人权不在纸上。每个人都有权不挨饿，有权不因为敢于开口就被丢进牢里，有权在自家门上挂自己想挂的锁，有权不信任何教也不被找麻烦。这些权利不靠谁来赐予，靠自己互相承认、互相保护。公社的章程写得很短，每一项权利都跟着一项对应的义务，我们愿意少写几页纸，多干几件真事。"
 NIC_dedication_to_union_activism:0 "鼓励职业工会运动"
 NIC_dedication_to_union_activism_desc:0 "工会不是国家的办事机构，是工人自己手里的工具。医生、泥瓦匠、码头工、面包师，谁不懂自己的行当就没人懂。各行业自己的工会来定行规、谈工资、解决内部纠纷。我们鼓励每一个行业都建自己的工会，不设统一的工会章程来管束它们，让每一种劳动有自己的尊严和脾气。"
 NIC_ties_to_paris:0 "与巴黎的联系"
 NIC_ties_to_paris_desc:0 "巴黎那边的人从旧帝国的废墟里站起来，明白什么叫没有靠山。他们的车间里不缺机床，但缺矿石和热带作物。我们拿原料换设备，拿咖啡换车床，拿橡胶换图纸和技术员，不签任何附加政治条款的合同。互补不需要互相理解到灵魂底层，只需要彼此都知道对方需要什么。"
 NIC_legacy_of_don_dario:0 "唐·达里奥的遗产"
 NIC_legacy_of_don_dario_desc:0 "鲁本·达里奥是尼加拉瓜生出的头一个砍断了欧洲文学绳子的诗人。西班牙人教了我们几百年怎么押韵、怎么遣词、怎么写一封语法完美的请愿书。达里奥把那些规矩撕了，用他的墨水重新练字。他笔下的天鹅和水晶不属于任何王室和教廷，只属于美洲自己的想象力。我们现在要做的事跟他当年做的没有两样——摆脱一种据说不可动摇的秩序，用自己想要的词汇重新解释世界，我们是这样提倡的。"
 NIC_connection_with_centro_germinal:0 "与中美洲其他国家的联系"
 NIC_connection_with_centro_germinal_desc:0 "边界是殖民时期拿尺子画出来的，我们认它但不迷信它。中美洲各地都有抵抗，只是有些地方刚冒头就被压下去了。我们派同志去联络——信件、密使、无线电。让彼此的失败和成功都能传到下一个山谷，届时我们将不再孤立。"
 NIC_the_unknown_soldier:0 "无名烈士"
 NIC_the_unknown_soldier_desc:0 "他们死在巷战里，死在农田伏击里，死在酷刑室和河流下游腐烂的气味中。有些人连名字都没留下，连收尸的人都找不到。我们不给他们立个人墓碑。我们在马那瓜中央广场立一块花岗岩基座，上面只刻日期不刻人名。每一个走过的人都踩得见这些日期。"
 NIC_bringing_repertorio_americano_nicaragua:0 "将《美洲剧目》引入尼加拉瓜"
 NIC_bringing_repertorio_americano_nicaragua_desc:0 "美洲有自己的舞台。我们翻译美洲各地先锋剧作家的剧本，组织流动剧团到小镇和集市上巡演，在露天搭台，不售票，不化妆，《美洲剧目》不是戏院的独家节目，伟大的阳光没有一个地方不烈，一样的日照应该晒出一样的燃烧。"
 NIC_bastion_of_latin_american_modernismo:0 "现代主义壁垒"
 NIC_bastion_of_latin_american_modernismo_desc:0 "拉丁美洲的旧面孔被画了太多年，肤色的深浅、血统的比例、头骨的弧线——这些殖民者留下的度量衡成了禁锢我们画像的工具。先锋派的画笔从鲁文·达里奥手里传到整个大陆，现在轮到我们把它竖成一道墙。这道墙不是水泥的，是新的视觉语言、新的诗歌、新的节奏。让它像中美洲雨季后的火山口，沉默而暗流涌动。墙上有画，画上有我们自己，不是别人替我们描的像。"
 NIC_affiliations_with_AFL:0 "与美国劳联会的联系"
 NIC_affiliations_with_AFL_desc:0 "北方的工人兄弟不是我们的敌人，他们跟我们一样被压榨，只是压榨他们的人西装笔挺一些，手段聪明一些。美国劳联会里有温和的社会主义者，他们可能不赞成我们撕掉国旗，但他们不愿意再看到美军陆战队在美洲任何一块土地上登陆。我们跟他们保持联系。他们在关键时刻替我们讲一句话——码头工人拒绝装卸运往中美洲的军械，铁路工人拒绝调度军用列车。兄弟之间不必同床也可以共伞。"
 NIC_awarding_scholarships:0 "颁发奖学金"
 NIC_awarding_scholarships_desc:0 "不能让我们的脑袋穷了。不管出身，只看才能，把最聪明、最能动手、最能在实验室和田野里熬长夜的年轻人挑出来，送进大学，送进技校，送过国境去学发电、学医术、学测绘。他们出去是我们寄出去的信，回来是我们收到的回信。奖学金不附带条件，不要求回来当公务员。学成了回来，当然是好的；不回来，你的同乡也记得谁给过他们一张车票和一笔生活费。"
 NIC_friends_in_tropical_town:0 "热带小镇的朋友们"
 NIC_friends_in_tropical_town_desc:0 "我们的客人来自一些地图上不起眼但地下世界里很有名的小镇。他们不是正规军出身，但手里有一份完整的军火供应商名单，知道哪里有囤了三年没动过的库存，知道哪条走私路线安全到连海关的狗都绕着走。资本不值得在资本堆里打转，应该直接从资本家的仓库流出，流进需要它的手里。热带夜里的交易抛去了书面协议，只有一杯酒加一句在场五个人都听得清楚的承诺。"
 NIC_introducing_neopopularism:0 "建立新民粹主义"
 NIC_introducing_neopopularism_desc:0 "旧的民粹主义都是自上而下的——一个强人站在高台上，他用声音裹住大众，大众散了他还是他，我们则什么都不是。我们要把方向倒过来：把地区的自治经验往上堆。每个村按自己的实际定自己的规矩，什么天才来都代表不了我们，是我们自己说了算。新民粹主义的核心不是动员群众支持谁，重点是群众有自己决定要不要动员的权利。"
 NIC_odysseys_on_ishtimus:0 "地峡奥德赛"
 NIC_odysseys_on_ishtimus_desc:0 "我们有支队伍，在丛林和谷地之间穿行，没有固定驻地，没有常编营区。跑得快，打得短，探得清，然后像露水一样在日出前散干净。
 他们熟悉中美洲地峡的每一条小径、每一座废弃的桥梁、每一个可以临时藏身的村庄。他们不留下脚印，只留下情报。
 中美洲活着的传奇。"
 NIC_new_nicaraguan_army:0 "新尼加拉瓜军队"
 NIC_new_nicaraguan_army_desc:0 "我们赶走了干涉军，但靠的不是某个人的天才，而是成千上万拿猎枪和砍刀的农民。现在要做的是把这些人编成一支真正的国防军——统一番号，建立后勤，教会每个士兵看懂地图和命令。国家需要一支知道为何而战、也懂得如何作战的常备军。"
 NIC_national_guard:0 "重建国民警卫队"
 NIC_national_guard_desc:0 "国民警卫队是本世纪尼加拉瓜唯一一支有过职业化经验的安全力量，它的传统不能因为一场失败就被全盘否定。召回被遣散的可靠军官，收拾残局，重新列队点名。这支队伍很快就能恢复它本来的样子。"
 NIC_presidents_personal_tool:0 "总统的个人工具"
 NIC_presidents_personal_tool_desc:0 "我们不跟任何人绕弯子。军队就该听总统的，因为总统是唯一对整个国家负责的人。其他机构——议会、法院、政党——只代表一拨人的利益，只有总统看得见全局。国民警卫队效忠的不是宪法上那些空洞的词句，而是坐在总统府里的人。这是效率最高、最不容易造成混乱的安排。"
 NIC_blind_eye_corruption:0 "对军队腐败视而不见"
 NIC_blind_eye_corruption_desc:0 "什么都查什么都管，只会让军队运转不下去。高级军官需要体面的收入来维持体面的生活，这是他们忠诚的代价。军需仓库偶尔少几箱东西，招兵名额偶尔多报几个数字，这些事不值得大惊小怪。你要的是他们关键时刻能开枪，不是要他们当会计。"
 NIC_american_military_support:0 "美国秘密支持"
 NIC_american_military_support_desc:0 "美国人教会我们一件事：他们丢掉的棋子通常活不长。现在我们重新坐回谈判桌上，只不过这次更谨慎。我们拿到援助，他们拿到影响力，彼此心照不宣。话不需要挑明，资金渠道和军火运输线自己会说话。"
 NIC_internal_security:0 "加强内部安全"
 NIC_internal_security_desc:0 "外敌也许还在千里之外，内敌可能就在隔壁。工厂里的煽动分子、大学里的思想犯、山里的残余游击队——他们比任何一支外国军队都更危险。增加国内情报编制，在各省设立安全办公室，把线人网络铺到每一个可疑的角落。秩序的崩溃从来不是从边境开始的，是从自家后院开始的。"
 NIC_new_training_institutions:0 "建设新的研究设施"
 NIC_new_training_institutions_desc:0 "现有的民用研究机构政治可靠性太低。我们需要建自己的军用实验室：弹道测试、通信加密、化学分析。军事现代化的根基是技术，技术靠人，人靠设施。把最可靠的人才放进最安全的围墙里，国家才有未来。"
 NIC_control_nicaraguan_institutions:0 "控制尼加拉瓜的研究设施"
 NIC_control_nicaraguan_institutions_desc:0 "那些实验室、工程学院、测绘单位——不管名义上归哪个部门管，从今天起都要接受军队的安全审查。科研人员可以继续做他们的事，但研究方向和成果必须对军方透明。任何可能用于军事的技术，不能由一帮不穿军装的人独自说了算。"
 NIC_honor_patria_disciplina:0 "荣誉、祖国、纪律"
 NIC_honor_patria_disciplina_desc:0 "这三个词就是国民警卫队的全部信条。荣誉，意味着对长官和制服的无条件忠诚。祖国，意味着捍卫秩序，铲除那些拿外国理论来腐蚀青年的垃圾。纪律，意味着命令就是命令，不需要问为什么。做到这三条，这支军队就永远不会再垮掉。"
 NIC_naval_expansion:0 "扩建海军"
 NIC_naval_expansion_desc:0 "两大洋夹着我们，海上却几乎不设防。既然买不起大舰，就从巡逻炮艇开始做起。"
 NIC_modern_ports:0 "现代化港口"
 NIC_modern_ports_desc:0 "木头栈桥卸不了军用物资。疏浚航道，浇筑混凝土码头，把港口从渔市变成要塞，建设新海军。"
 NIC_foreign_expertise:0 "外国专家"
 NIC_foreign_expertise_desc:0 "设计舰艇和操炮技术需要外来的老师，但课堂的规矩得我们说了算。"
 NIC_air_industry:0 "扩大空业"
 NIC_air_industry_desc:0 "没有跑道和油库，飞机就是摆设。我们将在战略要地铺开航空基地网。"
 NIC_trained_pilots:0 "飞行员培训"
 NIC_trained_pilots_desc:0 "机器可以进口，驾驶机器的人只能从我们自己的年轻人里挑，
 反复练，练到不怕风暴。"
 NIC_battlefield_support:0 "支持地面部队"
 NIC_battlefield_support_desc:0 "侦察、联络、扫射支援——飞机在天上做的一切，最终是对脚下的步兵负责，这也是我们空军建设的主要方向之一。"
 NIC_new_guardia:0 "解放国民警卫队"
 NIC_new_guardia_desc:0 "国民警卫队这个名字本身没有罪过，有罪的是把它变成私人武装的那一群人。我们把它从腐败的泥潭里拉出来，清洗掉那些除了拍马屁什么都不会的军官，换上真正带过兵、打过仗的人。这支武装从此只对国家负责，不再是任何一个人的看家护院。"
 NIC_democratized_army:0 "军队民主化"
 NIC_democratized_army_desc:0 "军营里不需要政客的竞选演说，但不能没有上下沟通的渠道。建立士兵委员会，让基层的声音能传到指挥部的桌上。伙食、津贴、军纪处罚，这些关系到每个士兵切身利益的事不能全由上面拍脑袋决定。一支士气高昂的军队，一定是每个战士都觉得自己被当人看。"
 NIC_entente_advisors:0 "引入协约国顾问"
 NIC_entente_advisors_desc:0 "英国人法国人的老家虽然变了天，但他们流亡出来的军官还活着，他们的军事传统没有断绝。西线堑壕战那一套在美洲不一定好用，但参谋作业、后勤规划、制图测绘这些硬功夫，他们很扎实。请他们来做我们的教官——严格按合同办事，最好是不让他们插手任何超出训练范围的事。"
 NIC_modern_army_doctrine:0 "现代陆军学说"
 NIC_modern_army_doctrine_desc:0 "我们不能永远拿着十年前欧洲大战的老教材训练部队。装甲车辆该怎么用，步兵和炮兵怎么协同，无线电通讯怎么在运动中保持畅通——这些新课题要有人研究，有人试验，有人写成适合我们国情的条令。不是抄谁的作业，是扎扎实实把自己的一亩三分地耕透。"
 NIC_import_foreign_arms:0 "引进外国武器"
 NIC_import_foreign_arms_desc:0 "万国牌的武器库是后勤的噩梦，但我们现在没有条件太讲究。哪个国家肯卖，价钱公道，配件供应有保障，我们就先买哪家的。关键是要成批次地引进，别东一把西一把，最后打起仗来弹药都不通用。"
 NIC_work_smarter:0 "高效工作，而非蛮力"
 NIC_work_smarter_desc:0 "军队里有一种愚蠢的风气，以为把人往死里操练就是战斗力。我们不要这种蛮干。训练要讲科学，作息要合理，装备维护要标准化。一个体能充沛、头脑清醒的士兵，比十个累得眼皮打架的稻草人更有用。"
 NIC_modern_equipment:0 "现代化设备"
 NIC_modern_equipment_desc:0 "测距仪、无线电台、工程机械、野战医疗器材——这些东西看起来不起眼，打起仗来却能省下几百条人命。投钱搞研发，也鼓励本地的工厂试着仿制一些简单部件。军队的需求可以反过来带动国内的技术进步。"
 NIC_destroy_army_corruption:0 "不再是腐败军队"
 NIC_destroy_army_corruption_desc:0 "军需处长虚报人头吃空饷、仓库管理员倒卖汽油和面粉、征兵官收了贿赂就放人——这种事曾经是公开的秘密。从现在起，贪污军费等同于叛国。审计、举报、公开审判，一样都不能少。老百姓把儿子交给了我们，我们至少得保证他们的军粮不被偷走。"
 NIC_american_model:0 "美国军事体系"
 NIC_american_model_desc:0 "跟美国人打交道要留一百个心眼，但他们的军事体系有值得学的地方。后勤分类的精细程度、参谋作业的标准化流程、士官制度的成熟度——这些我们可以拿来，改造成适合自己国情的东西。"
 NIC_centralized_command:0 "集中指挥结构"
 NIC_centralized_command_desc:0 "一个营长能直接给总统打电话的时代结束了。指挥链必须清晰：总参谋部到军区，军区到旅，旅到营。每一级都知道自己的权限在哪里，该听谁的命令，该管谁的事。混乱的指挥系统比打败仗更丢人，因为它连仗都没打就已经输了。"
 NIC_modern_army_structure:0 "现代陆军结构"
 NIC_modern_army_structure_desc:0 "取消那些除了虚耗军饷没有任何实战价值的荣誉头衔和冗余编制。设置合理的兵种比例，步兵为主，炮兵和工兵为辅，后勤和医疗作为独立保障力量。每个师、每个团都清楚自己在战时该站的位置。"
 NIC_honor_libertad_paz:0 "荣誉、自由、和平"
 NIC_honor_libertad_paz_desc:0 "我们所信仰的，唯有不屈保卫的荣誉，与对自由和平的向往。"
 NIC_guerilla_army:0 "建立尼加拉瓜主权保卫军"
 NIC_guerilla_army_desc:0 "从起义第一天起，我们就明白了一件事：一支军队要是跟老百姓不是一条心，武器再好也是别人的看门狗。国民警卫队就是这么个东西，它替庄园主收税，替美国佬看家，唯独不保护尼加拉瓜人。现在我们要建立的是完全不同的队伍——主权保卫军。它的根扎在村庄里，扎在种植园工人的棚屋里，扎在山区印第安人的部落里。每一个战士都清楚，他手里的枪不是某个将军的私产，而是整个民族在危难时交到他手里的重托。军官不许打骂士兵，士兵不许欺压百姓，这条规矩从一开始就要刻进骨子里。"
 NIC_ambush_training:0 "强游击学说"
 NIC_ambush_training_desc:0 "在这片土地打仗，你得听得懂丛林跟你说了什么。雨季什么时候来，河水什么时候涨，哪条小路能绕过敌人的哨卡，哪个山头可以俯瞰整个谷地——这些课本上不教的东西，才是我们打赢干涉军的本钱。我们要把当年在拉斯塞戈维亚斯山区摸索出来的经验整理成正式的作战条令。小股渗透、夜间袭扰、打了就跑、让敌人在陌生的地形里耗尽补给和耐心。这套打法我们熟，外国人永远学不会。"
 NIC_lessons_from_mexico:0 "北方友邻的支持"
 NIC_lessons_from_mexico_desc:0 "墨西哥的革命虽然走过一些弯路，但那里的革命分子跟我们有着共同的敌人。中美洲几个小共和国也不是铁板一块，总有人看得清谁才是真正的威胁。派外交代表和军事联络官北上——谈武器，谈训练，谈情报交换。多一个朋友就少一堵墙。"
 NIC_recon_research:0 "侦察现代化"
 NIC_recon_research_desc:0 "游击队时代我们靠牧羊人和樵夫送情报，他们的忠诚无可挑剔，但光有忠诚不够。电话窃听、无线电截收、航空侦察——这些技术手段必须补上。培训专业的情报分析员，让他们能破译敌人的密电，能看懂航拍照片上的每一个异常点。耳聪目明的人永远比耳聋眼瞎的人活得久。"
 NIC_support_socialist_brothers:0 "支持社会主义兄弟"
 NIC_support_socialist_brothers_desc:0 "尼加拉瓜不是孤立的。大洋那边有跟我们一样靠流血夺回尊严的同志。我们不打肿脸充胖子，该伸手时就伸手——训练教官、武器装备、通讯器材，第三国际的兄弟们有的，我们就要争取。我们拿到的一切援助，最终都要转化成自己站得住的本钱。"
 NIC_small_units:0 "一支真正的游击队"
 NIC_small_units_desc:0 "搞游击战不是凑一群农民发了枪就算完。一支真正的游击队要有政治觉悟，要知道自己为什么打仗；要有铁的纪律，冻死饿死也不拿群众一针一线；要有过硬的野外生存能力，离开补给线照样能在丛林里活半个月。把老兵分散到各地去带新兵，让每一个村子都有一支随时能拉出来的武装小组。"
 NIC_cult_of_personality:0 "桑迪诺，我们军队的大救星"
 NIC_cult_of_personality_desc:0 "说实话吧。在桑迪诺将军站出来之前，尼加拉瓜的抵抗运动有过多少次起事？哪一次没有被镇压下去？
 只有他把散落各地的愤怒拧成了一股绳，只有他让美国人第一次在这个国家签了撤军的字。主权保卫军身上流淌的精神，追根溯源就是他注入的那一腔血。我们不愿意搞个人迷信，但事实总得有人讲出来。"
 NIC_sandinista_youth:0 "建立桑迪诺青年团"
 NIC_sandinista_youth_desc:0 "革命不能断代。十三四岁的少年现在也许扛不动枪，但他们能学急救，学通讯，学认地图，学我们为什么而战的历史。把他们组织起来，在农闲和假期接受基础军事训练和政治教育。十年后，他们会成为这支军队的脊梁。"
 NIC_salve_ti_nicaragua:0 "向您致敬，桑迪诺同志"
 NIC_salve_ti_nicaragua_desc:0 "将军，我们正在学你做过的一切。学你怎么在弹尽粮绝的时候跟部下分最后一把玉米，学你怎么跟外国干涉军谈判时咬死一条底线不退让，学你怎么把识字课本和武器一起发到每个士兵手里。你走过的每一步路，都将是我们今天的教科书。"
 NIC_ground_up:0 "从头开始"
 NIC_ground_up_desc:0 "我国在美国占领和持续不断的危机下蒙受了无数苦难，至今仍然是拉丁美洲最贫穷的国家之一。当革命最终结束时，我们的出口总额到达了前所未有的低位。眼下我们必须重建我们的经济，否则我们的国家将更快地落在世界的后面。无论付出多少遗憾的代价，重建必须是全面而彻底的。"
 NIC_revolution_economy:0 "革命经济"
 NIC_revolution_economy_desc:0 "新的“革命经济计划”旨在通过补贴国内消费，促进国际商业贸易往来的办法重振经济。"
 NIC_attempt_industry:0 "调用我们手头所有的一切资源"
 NIC_attempt_industry_desc:0 "我们的新的振兴政策是雄心勃勃的，然而我们缺乏充分实施这项政策的资源。因此帝国主义者可以轻易利用我们经济的弱点，为了使我们的国家继续生存下去，提高效率或许是当下的关键。"
 NIC_outside_world:0 "外来投资"
 NIC_outside_world_desc:0 "我们经济政策的基石之一是促进外国投资，这对我们获取成功的努力至关重要。但我们不会让新的外国投资者们像美国人那样控制我们的国家。我们将只与那些拥有最崇高革命理想的同志们携手并进。"
 NIC_navigate_east:0 "向东投资"
 NIC_navigate_east_desc:0 "由于马塔加尔帕多山多丛林的特殊地形，该地区一直处于欠发达状态。为了使经济真正恢复活力，我们需要将所有可利用的国家生产能力集中利用起来。要做到这一点，我们需要把关注重点放在那些最需要投资的地区。"
 NIC_moving_fruit:0 "结束水果生产依赖"
 NIC_moving_fruit_desc:0 "联合果业公司不公正地剥削了我们的国家，自己赚取海量的利润，而眼睁睁地看着我们的人民一无所有。尽管我国政府努力减少了它对我国的经济影响，但它所留下的遗产仍然存在于我们以水果为主的经济生产体系中。为了避免外国人重新主宰我们的经济和国家，我们需要使国家的生产趋向多样化。"
 NIC_new_industries:0 "新的市场"
 NIC_new_industries_desc:0 "随着美国强制推行的种植园经济所遗留下来的问题得到充分解决，大量的替代农产品生产规模正在迅速增加。随着我们大胆迈入国际市场的基石已经稳固，我们现在必须把经济重点转移到满足海外需求上。经济振兴政策取得了巨大的收获，我们国家的未来已经得到了保障！"
 NIC_food_distribution:0 "农业改革"
 NIC_food_distribution_desc:0 "虽然我们的革命经济议程取得了很大的成就，但耕地分配仍然是不平等的，许多农民生活的艰辛程度不比旧时代的佃农高多少。让我们彻底结束种植园特权制度这个美国经济帝国主义留给尼加拉瓜最臭名昭著的遗产。让每个尼加拉瓜农民都拥有他自己的土地！"
 NIC_expand_funding:0 "扩大经济补贴"
 NIC_expand_funding_desc:0 "最初的经济目标已经实现，但我们还不能将注意力从经济上转移开。现在我们必须密切监控那些新出现的经济问题，并为此作好相应的政策准备，为重要部门发放补贴。只有实行良好的经济治理，人民的生活水平才能不断提高。"
 NIC_jack_all_trade:0 "贸易多样化"
 NIC_jack_all_trade_desc:0 "“美国大萧条”和“柏林黑色星期一”带给我们的一个重要警示，经济崩溃可能只是一瞬间的事情。由于我国对水果出口贸易的依赖，我们的经济比世界上大多数国家都脆弱的多，也更容易受到这种灾难性经济周期的影响。为了摆脱这个问题，我们必须实现出口多样化！"
 NIC_beef:0 "牛肉！"
 NIC_beef_desc:0 "牛肉，曾经是富人们的食物，现在作为一种日常肉制品正越来越为普通市民所接受。我们可以通过增加畜牧业投资的方法强化我们的经济体系，防止农业因歉收而发生大面积衰退。"
 NIC_coffee:0 "咖啡！"
 NIC_coffee_desc:0 "大英帝国曾在全球范围内带动了茶叶的消费，但茶叶有一个真实可靠的竞争对手——咖啡。咖啡作为一种自古以来就很受欢迎的饮料，在尼加拉瓜地区也生长得很好，国际市场对它们的需求只增不减。如果我们增加咖啡的产量，我们的国家无疑会从中大赚一笔。"
 NIC_sugar:0 "蔗糖！"
 NIC_sugar_desc:0 "糖，就像牛肉一样，从奢侈品转型为日常生活消费品正日益受到世界各地普通民众的喜欢。与不断增长的需求恰好相反，甘蔗只能在亚热带和热带气候中种植。尼加拉瓜非常组织适合糖料作物的集约化生产。"
 NIC_banana:0 "香蕉！"
 NIC_banana_desc:0 "由于过去的剥削行为，就像一些美国的闹剧卡通一样，香蕉种植业的残余影响让我们的国家在世界竞争中处于完全落后的地位。如今我们的农业很大一部分仍以香蕉为基础。虽然有人会建议我们完全放弃香蕉，但我们更清楚香蕉种植背后的潜力和必要性。我们可以进一步投资这种美味水果的集约化生产，确保它的种植与出口能够更加有利于我们的国家。"
 NIC_appeasment_economy:0 "维持现状"
 NIC_appeasment_economy_desc:0 "现行制度没有什么问题！作为税收优惠与维持种植园特权的交换，外国投资者必须投资改良我们的基础设施，带动我们国家的发展。如果说现在的情况和以往有什么不同的话，那就是我们能够与这些有利的利益方进行更加密切地进行合作！"
 NIC_rely_overlord:0 "依靠那些关系亲近的人"
 NIC_rely_overlord_desc:0 "桑地诺的革命政权大幅度削减外国在我国的投资热情，尤其是极为重要的农业部门，问题呈现的尤其严重。现在我们必须重新点燃我们在美国占领期间建立的商业利益联系。通过国际间的互惠合作，外资流入将再次让我们的国家富裕起来。"
 NIC_stick_agriculture:0 "坚持传统"
 NIC_stick_agriculture_desc:0 "自从我国独立以来，我们的经济结构依然完全由农业部门占据主导。出于现实原因，我们当然不能去尝试重建什么“尼加拉瓜的莱茵兰”，加倍发扬农业传统将是更好的发展策略。"
 NIC_develop_pesticide:0 "发展新式杀虫剂"
 NIC_develop_pesticide_desc:0 "除了恶劣天气与疾病之外，农业的最大敌人就是各种各样的昆虫，他们中破坏力最强大的可以在几个小时内毁掉整个收获季的收成。然而，在这场延续百年的战争中，我们即将取得最终的胜利！因为我们最新获得了一种新的，强大的化学武器——杀虫剂！"
 NIC_stick_fruit:0 "经济作物优先"
 NIC_stick_fruit_desc:0 "我们对农业出口，特别是水果出口的依赖加强了国际贸易对维持我国经济体系良性运转的必要性。为了扩大我们的出口规模，我们应该评估水果生产的各项流程以在其中寻找刺激生产力的方法。"
 NIC_cash_crop_profit:0 "经济作物收益"
 NIC_cash_crop_profit_desc:0 "尽管另一场世界大战的危险日益迫近，随着我们能够向世界市场出口越来越多的经济作物。国家从贸易中获取的利润稳步增长，看来我们的国家已经重新走上了一条繁荣的道路！"
 NIC_world_market:0 "世界市场"
 NIC_world_market_desc:0 "尼加拉瓜人口稀少，难以支撑起经济繁荣所需的消费水平。不过，全球市场广阔、人口庞大，对我国产品需求旺盛。通过向世界市场全面开放我们的贸易窗口，我们最终将把刺激经济的重点重新放在鼓励出口的层面上，因为出口可以为我们创造最多的利润。"
 NIC_foreign_reliance:0 "外国依赖"
 NIC_foreign_reliance_desc:0 "偏向出口的经济模式不可避免地导致了我们对外国势力的依赖。而对于外国势力，我们当然不是在谈论洪都拉斯这类小豆丁，我们最大的贸易伙伴永远是那些全球超级霸权，无论是美国、德国，还是日本。毫无疑问，我们需要确保永远能够向这些国家出口我们的产品，确保我们的运输途径不会遇到任何形式阻碍。"
 NIC_central_university:0 "创办尼加拉瓜中央大学"
 NIC_central_university_desc:0 "随着我国的经济水平不断增强，现有的预算规模终于能够在尼加拉瓜支撑一所适当的大学所需的建设与开销啦！通过将尼加拉瓜最聪明的头脑们集中在这一所新机构当中，整个国家都将从他们的知识与研究突破中受益匪浅。"
 NIC_americans:0 "美国的委任统治地"
 NIC_americans_desc:0 "美国的委任统治确保了对尼加拉瓜政府的完全控制，让尼加拉瓜转变为了仅仅名义上独立的美国盟友。"
 NIC_autocratic_mandate:0 "老皮脸"
 NIC_autocratic_mandate_desc:0 "美国的委任统治不会那么民主，因为美国不会像关心其国家利益那样关心民主和代表权。"
 NIC_be_happy:0 "幸福……"
 NIC_be_happy_desc:0 "幸福对于确保人们愿意按照政府的吩咐行事至关重要。为此，对夜生活和美国娱乐产物的推广将全面提振尼加拉瓜人民的士气。"
 NIC_be_healthy:0 "健康……"
 NIC_be_healthy_desc:0 "军队是尼加拉瓜宝贵的体液，保护他们，让他们健康是我们未来的关键。为了达到这一目的，我们为我们的军队引进了一系列的便利设施和改革措施，以保持他们能健康地战斗。"
 NIC_long_life:0 "长寿！"
 NIC_long_life_desc:0 "尼加拉瓜万岁！通过公共卫生改革延长人民的预期寿命，将使我们赢得他们的心，虽然他们得通过诚实的种植园工作来增强自己。"
 NIC_bananas_for_america:0 "香蕉经济"
 NIC_bananas_for_america_desc:0 "尼加拉瓜的经济仍然是非常农业化的，因此为了筹集国家建设的重要资金，我们必须增加经济作物的种植。尤其是香蕉，我们国家的主要农作物。"
 NIC_freedom_isnt_free:0 "自由不是免费的"
 NIC_freedom_isnt_free_desc:0 "在尼加拉瓜，我们以美国为榜样，创造了一个新的费城，一个自由和劳动的家园，并将永垂不朽。为了保护这个崇高的飞地，我们必须武装我们的人民。"
 NIC_concede_territory:0 "联合果品公司租借地"
 NIC_concede_territory_desc:0 "通过邀请联合果品公司直接接管部分国有土地并将其改造成香蕉种植园，我们可以增加重要经济作物的产量。"
 NIC_american_advisors:0 "邀请美国顾问"
 NIC_american_advisors_desc:0 "美国拥有丰富的知识，我们可以利用这些知识来拓宽视野。通过慷慨资助研究工作和取消一些无用的规定，尼加拉瓜可以对美国专家敞开怀抱。"
 NIC_buy_ship:0 "购买南达科他号战列舰"
 NIC_buy_ship_desc:0 "任何文明国家都需要一艘漂亮的旗舰！幸运的是，我们听说过这样一艘即将退役，将会就此浪费的船。"
 NIC_red_scare:0 "红色恐慌"
 NIC_red_scare_desc:0 "赤匪无处不在，我们必须确保他们不会腐蚀我们亲爱的尼加拉瓜，并蔓延到美国。我们将发动一场宣传运动，一劳永逸地铲除红色威胁。"
 NIC_great_admiral:0 "大司令"
 NIC_great_admiral_desc:0 "除了美国的军事顾问外，美国还向我们提供了一位老司令。他们真是慷慨！"
 NIC_benevolent_governor:0 "乐善好施的总督"
 NIC_benevolent_governor_desc:0 "我们一定要安排总督参观一下香蕉种植园，让尼加拉瓜人民欣赏他仁慈的个性，潇洒的容颜，对他们的福祉的关心。再加上十分钟的休息时间，他们一定会很高兴的。"
 NIC_wills_walkers:0 "美利坚师"
 NIC_wills_walkers_desc:0 "通过招募一个美国师到我们的军队服役，我们可以确保在任何人想要惹麻烦时，比如说路过的社会主义者或者危地马拉人，有点可靠的战斗力。"
 NIC_naval_support:0 "海军支援"
 NIC_naval_support_desc:0 "拥有一支强大的海军和确保你能用好来自空中的支援一样重要！"
 NIC_american_mandate:0 "美国已经掌控了尼加拉瓜"
 NIC_grey_eyed_man_of_destiny:0 "灰色眼睛的命运之王"
 NIC_grey_eyed_man_of_destiny_desc:0 "沃克将军是我们占领尼加拉瓜的灵感来源，我们希望让他为我们占领尼加拉瓜而感到骄傲。我们已经实现了沃克最伟大的梦想，我们绝不会被打败。"
 NIC_spread_the_joy:0 "传播欢乐！"
 NIC_spread_the_joy_desc:0 "洪都拉斯从桑地诺的威胁中拯救了我们，但这并不意味着我们是朋友。洪都拉斯需要接受我们的影响，并被适当地整合入我国。"
 NIC_rouge_government:0 "无赖政府"
 NIC_rouge_government_desc:0 "我们现在不忠于任何国家，不忠于联盟国，不忠于合众国，不忠于任何人。我们是一帮无赖，走在一条模糊不明的道路上，有时甚至根本不走在路上。不忠于任何事，这是我们的座右铭。"
 NIC_neel_or_die:0 "屈服或死"
 NIC_neel_or_die_desc:0 "我们是此地的君王，我们是尼加拉瓜的统治者。我们应被害怕，应被尊重。当我们的士兵来到附近时，人们都会锁上门。没有敢对我们不尊重的人民。我们是国王，我们是神。"
 NIC_end_resistance:0 "结束抵抗"
 NIC_end_resistance_desc:0 "社会主义者得死，反对者也得死。这个国家没有留给抵抗势力的空间。桑地诺已死，是时候让他所代表的意志和他一起死去了。"
 NIC_dreams_of_canal:0 "运河之梦"
 NIC_dreams_of_canal_desc:0 "美国人从上个世纪就念叨着要在尼加拉瓜开凿一条连通两大洋的运河，念叨得比传教士念圣经还勤快。现在他们不念叨了，他们直接动手。强征劳工管理处设在每一个省的交通要道上，配额派到每一个村镇——每户出丁，不出丁就出钱，出不起钱就收地。热带雨林里的沼泽地，蒸汽和蚊虫一起往上冒，每天都有人倒下，倒在泥水里，嘴唇发紫，浑身打颤，黄热病和疟疾比任何一个工头都勤快。
 可是看啊，运河来到我们手里了。"
 NIC_conquers_no_more:0 "征服者已不再"
 NIC_conquers_no_more_desc:0 "我们不再只是占领这个小国的粗人将军了。我们现在是国王，甚至是神。所有人民都害怕我们，我们也不再忠于任何国家。没有什么能阻止我们，因为我们不再是小征服者，我们是尼加拉瓜人，我们将会留在这里。"
 ARMY_NIC_AUGUSTO_CESAR_SANDINO_DESC:0 "§Y指挥官介绍\n§Y生于：§W1895年5月18日，尼加拉瓜 尼基诺奥莫\n§Y军旅生涯：§W奥古斯托·塞萨尔·桑地诺没有接受过任何正式的军事训练，但他一生的功绩足以使他成为尼加拉瓜乃至全中美洲的军事传奇。首先，他试图加入自由主义者一方的宪法战争，但时任尼加拉瓜大西洋自由军总司令的何塞·马里亚·蒙卡达拒绝让桑地诺入伍。于是桑地诺随后自己召集了一支后来被称为“山岳”的游击组织，并在1926年11月成功袭击了埃尔希卡罗。这次胜利使他名声大振，最终为起义的自由主义者们所接受，成为全国抵抗运动的重要人物。然而，自由主义者在战争中的胜利是短暂的，蒙卡达的背叛让桑地诺再次拿起了武器组织反抗。这一次他带领着一支300人的强大军团在南方作战。从那以后接连不断的小规模冲突与杨克·莱维的技术支持大大提高了他的军事能力，现在他是全尼加拉瓜最有经验的战士之一。\n§Y重要信息：§W他是尼加拉瓜国家主权阵线的领导人"
 ARMY_NIC_YANK_LEVY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1897年10月5日，加拿大 汉密尔顿 \n§Y军旅生涯：§W伯特·“扬克”·利维，加拿大人，早年曾在加拿大皇家燧发枪团第39营服役，世界大战期间参与了澳新军团在巴勒斯坦与外约旦的战斗。在那里，他成为了使用机枪的行家，又有幸与阿拉伯的劳伦斯手下的侦察兵有过几次合作，熟悉了游击战的技巧。后来他在墨西哥革命最后阶段参与了革命军战斗，而后在尼加拉瓜宪法战争期间加入桑地诺的军队，此后便一直与桑地诺携手作战。因为英国大革命与随后加拿大爆发的红色恐慌使他自己成为了不受祖国欢迎的人。从那以后，他就留在尼加拉瓜一直帮助桑地诺的事业，为他的新兵传授游击作战的方法。"
 ARMY_NIC_FRANCISCO_SEQUEIRA_MORENO_DESC:0 "§Y指挥官介绍\n§Y生于：§W1903年6月27日，尼加拉瓜 索莫蒂约\n§Y军旅生涯：§W尽管没有受过任何形式的军事训练，弗朗西斯科·塞凯拉·莫雷诺参加了宪法战争的起义。他最早其实是被迫加入保守党军队与自由派作战的士兵，在那里他展示了一些领导军队作战的才能，但因为拒绝参与处决平民，他叛逃到了自由派的军队里。在自由派军营内，他成为了“西阵”组织的领袖，并在自由主义胜利后迅速转向反对蒙卡达——因为后者在革命胜利后要求解除自由派武装——从此以后他就一直反对美国对尼加拉瓜的军事占领。在与桑地诺的部队结盟后，他设法在桑地诺在墨西哥获得支持的同时在南部地区坚持了下来，然后参加了在该国西部夺取首都马那瓜过程中的一系列进攻。\n§Y重要信息：§W他是尼加拉瓜乡村党的领导人"
 ARMY_NIC_ABELARDO_CUADRA_DESC:0 "§Y指挥官介绍\n§Y生于：§W约1904年，尼加拉瓜格拉纳达\n§Y军旅生涯：§W阿韦拉多原研读法律，宪法战争爆发主动加入保守派军队，先后效力于埃米利亚诺·巴尔加斯的弟弟卡洛斯·查莫罗与阿丹·贝雷兹将军。然而事实证明，这名年轻的士兵只不过是在为获取利益而战，当他发现协助保守党是一项无益的努力时，他又转而加入了国民警卫队，在尼加拉瓜军事学院从事教职。后来，他又被美国干涉军重新召回以协助他们对付桑地诺。从那时起，他就成了该地区有名的雇佣兵。"
 ARMY_NIC_EMILIANO_CHAMORRO_VARGAS_DESC:0 "§Y指挥官介绍\n§Y生于：§W5月11日，尼加拉瓜阿科亚帕\n§Y军旅生涯：§W埃米利亚诺·查莫罗·瓦加斯从未接受过正规的军事教育，然而这位政治家在宪法战争因为反对自由派而成为了将军。虽兵败宪法战争，但随着时间的推移，他的军事组织能力也得到了提高。尽管他距离成为一名坚强的军官还有很长的路要走，但他仍然是一名可靠的战斗指挥官。\n§Y重要信息：§W尼加拉瓜保守党领导人"
