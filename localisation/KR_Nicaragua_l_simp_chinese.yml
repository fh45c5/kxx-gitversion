 NIC_salve_ti_nicaragua_desc:0 ""
 NIC_ground_up:0 "从头开始"
 NIC_ground_up_desc:0 "我国在美国占领和持续不断的危机下蒙受了无数苦难，至今仍然是拉丁美洲最贫穷的国家之一。当革命最终结束时，我们的出口总额到达了前所未有的低位。眼下我们必须重建我们的经济，否则我们的国家将更快地落在世界的后面。无论付出多少遗憾的代价，重建必须是全面而彻底的。"
 NIC_revolution_economy:0 "革命经济"
 NIC_revolution_economy_desc:0 "新的“革命经济计划”旨在通过补贴国内消费，促进国际商业贸易往来的办法重振经济。"
 NIC_attempt_industry:0 "调用我们手头所有的一切资源"
 NIC_attempt_industry_desc:0 "我们的新的振兴政策是雄心勃勃的，然而我们缺乏充分实施这项政策的资源。因此帝国主义者可以轻易利用我们经济的弱点，为了使我们的国家继续生存下去，提高效率或许是当下的关键。"
 NIC_outside_world:0 "外来投资"
 NIC_outside_world_desc:0 "我们经济政策的基石之一是促进外国投资，这对我们获取成功的努力至关重要。但我们不会让新的外国投资者们像美国人那样控制我们的国家。我们将只与那些拥有最崇高革命理想的同志们携手并进。"
 NIC_navigate_east:0 "向东投资"
 NIC_navigate_east_desc:0 "由于马塔加尔帕多山多丛林的特殊地形，该地区一直处于欠发达状态。为了使经济真正恢复活力，我们需要将所有可利用的国家生产能力集中利用起来。要做到这一点，我们需要把关注重点放在那些最需要投资的地区。"
 NIC_moving_fruit:0 "结束水果生产依赖"
 NIC_moving_fruit_desc:0 "联合果业公司不公正地剥削了我们的国家，自己赚取海量的利润，而眼睁睁地看着我们的人民一无所有。尽管我国政府努力减少了它对我国的经济影响，但它所留下的遗产仍然存在于我们以水果为主的经济生产体系中。为了避免外国人重新主宰我们的经济和国家，我们需要使国家的生产趋向多样化。"
 NIC_new_industries:0 "新的市场"
 NIC_new_industries_desc:0 "随着美国强制推行的种植园经济所遗留下来的问题得到充分解决，大量的替代农产品生产规模正在迅速增加。随着我们大胆迈入国际市场的基石已经稳固，我们现在必须把经济重点转移到满足海外需求上。经济振兴政策取得了巨大的收获，我们国家的未来已经得到了保障！"
 NIC_food_distribution:0 "农业改革"
 NIC_food_distribution_desc:0 "虽然我们的革命经济议程取得了很大的成就，但耕地分配仍然是不平等的，许多农民生活的艰辛程度不比旧时代的佃农高多少。让我们彻底结束种植园特权制度这个美国经济帝国主义留给尼加拉瓜最臭名昭著的遗产。让每个尼加拉瓜农民都拥有他自己的土地！"
 NIC_expand_funding:0 "扩大经济补贴"
 NIC_expand_funding_desc:0 "最初的经济目标已经实现，但我们还不能将注意力从经济上转移开。现在我们必须密切监控那些新出现的经济问题，并为此作好相应的政策准备，为重要部门发放补贴。只有实行良好的经济治理，人民的生活水平才能不断提高。"
 NIC_jack_all_trade:0 "贸易多样化"
 NIC_jack_all_trade_desc:0 "“美国大萧条”和“柏林黑色星期一”带给我们的一个重要警示，经济崩溃可能只是一瞬间的事情。由于我国对水果出口贸易的依赖，我们的经济比世界上大多数国家都脆弱的多，也更容易受到这种灾难性经济周期的影响。为了摆脱这个问题，我们必须实现出口多样化！"
 NIC_beef:0 "牛肉！"
 NIC_beef_desc:0 "牛肉，曾经是富人们的食物，现在作为一种日常肉制品正越来越为普通市民所接受。我们可以通过增加畜牧业投资的方法强化我们的经济体系，防止农业因歉收而发生大面积衰退。"
 NIC_coffee:0 "咖啡！"
 NIC_coffee_desc:0 "大英帝国曾在全球范围内带动了茶叶的消费，但茶叶有一个真实可靠的竞争对手——咖啡。咖啡作为一种自古以来就很受欢迎的饮料，在尼加拉瓜地区也生长得很好，国际市场对它们的需求只增不减。如果我们增加咖啡的产量，我们的国家无疑会从中大赚一笔。"
 NIC_sugar:0 "蔗糖！"
 NIC_sugar_desc:0 "糖，就像牛肉一样，从奢侈品转型为日常生活消费品正日益受到世界各地普通民众的喜欢。与不断增长的需求恰好相反，甘蔗只能在亚热带和热带气候中种植。尼加拉瓜非常组织适合糖料作物的集约化生产。"
 NIC_banana:0 "香蕉！"
 NIC_banana_desc:0 "由于过去的剥削行为，就像一些美国的闹剧卡通一样，香蕉种植业的残余影响让我们的国家在世界竞争中处于完全落后的地位。如今我们的农业很大一部分仍以香蕉为基础。虽然有人会建议我们完全放弃香蕉，但我们更清楚香蕉种植背后的潜力和必要性。我们可以进一步投资这种美味水果的集约化生产，确保它的种植与出口能够更加有利于我们的国家。"
 NIC_appeasment_economy:0 "维持现状"
 NIC_appeasment_economy_desc:0 "现行制度没有什么问题！作为税收优惠与维持种植园特权的交换，外国投资者必须投资改良我们的基础设施，带动我们国家的发展。如果说现在的情况和以往有什么不同的话，那就是我们能够与这些有利的利益方进行更加密切地进行合作！"
 NIC_rely_overlord:0 "依靠那些关系亲近的人"
 NIC_rely_overlord_desc:0 "桑地诺的革命政权大幅度削减外国在我国的投资热情，尤其是极为重要的农业部门，问题呈现的尤其严重。现在我们必须重新点燃我们在美国占领期间建立的商业利益联系。通过国际间的互惠合作，外资流入将再次让我们的国家富裕起来。"
 NIC_stick_agriculture:0 "坚持传统"
 NIC_stick_agriculture_desc:0 "自从我国独立以来，我们的经济结构依然完全由农业部门占据主导。出于现实原因，我们当然不能去尝试重建什么“尼加拉瓜的莱茵兰”，加倍发扬农业传统将是更好的发展策略。"
 NIC_develop_pesticide:0 "发展新式杀虫剂"
 NIC_develop_pesticide_desc:0 "除了恶劣天气与疾病之外，农业的最大敌人就是各种各样的昆虫，他们中破坏力最强大的可以在几个小时内毁掉整个收获季的收成。然而，在这场延续百年的战争中，我们即将取得最终的胜利！因为我们最新获得了一种新的，强大的化学武器——杀虫剂！"
 NIC_stick_fruit:0 "经济作物优先"
 NIC_stick_fruit_desc:0 "我们对农业出口，特别是水果出口的依赖加强了国际贸易对维持我国经济体系良性运转的必要性。为了扩大我们的出口规模，我们应该评估水果生产的各项流程以在其中寻找刺激生产力的方法。"
 NIC_cash_crop_profit:0 "经济作物收益"
 NIC_cash_crop_profit_desc:0 "尽管另一场世界大战的危险日益迫近，随着我们能够向世界市场出口越来越多的经济作物。国家从贸易中获取的利润稳步增长，看来我们的国家已经重新走上了一条繁荣的道路！"
 NIC_world_market:0 "世界市场"
 NIC_world_market_desc:0 "尼加拉瓜人口稀少，难以支撑起经济繁荣所需的消费水平。不过，全球市场广阔、人口庞大，对我国产品需求旺盛。通过向世界市场全面开放我们的贸易窗口，我们最终将把刺激经济的重点重新放在鼓励出口的层面上，因为出口可以为我们创造最多的利润。"
 NIC_foreign_reliance:0 "外国依赖"
 NIC_foreign_reliance_desc:0 "偏向出口的经济模式不可避免地导致了我们对外国势力的依赖。而对于外国势力，我们当然不是在谈论洪都拉斯这类小豆丁，我们最大的贸易伙伴永远是那些全球超级霸权，无论是美国、德国，还是日本。毫无疑问，我们需要确保永远能够向这些国家出口我们的产品，确保我们的运输途径不会遇到任何形式阻碍。"
 NIC_central_university:0 "创办尼加拉瓜中央大学"
 NIC_central_university_desc:0 "随着我国的经济水平不断增强，现有的预算规模终于能够在尼加拉瓜支撑一所适当的大学所需的建设与开销啦！通过将尼加拉瓜最聪明的头脑们集中在这一所新机构当中，整个国家都将从他们的知识与研究突破中受益匪浅。"
 NIC_americans:0 "美国的委任统治地"
 NIC_americans_desc:0 "美国的委任统治确保了对尼加拉瓜政府的完全控制，让尼加拉瓜转变为了仅仅名义上独立的美国盟友。"
 NIC_autocratic_mandate:0 "老皮脸"
 NIC_autocratic_mandate_desc:0 "美国的委任统治不会那么民主，因为美国不会像关心其国家利益那样关心民主和代表权。"
 NIC_be_happy:0 "幸福……"
 NIC_be_happy_desc:0 "幸福对于确保人们愿意按照政府的吩咐行事至关重要。为此，对夜生活和美国娱乐产物的推广将全面提振尼加拉瓜人民的士气。"
 NIC_be_healthy:0 "健康……"
 NIC_be_healthy_desc:0 "军队是尼加拉瓜宝贵的体液，保护他们，让他们健康是我们未来的关键。为了达到这一目的，我们为我们的军队引进了一系列的便利设施和改革措施，以保持他们能健康地战斗。"
 NIC_long_life:0 "长寿！"
 NIC_long_life_desc:0 "尼加拉瓜万岁！通过公共卫生改革延长人民的预期寿命，将使我们赢得他们的心，虽然他们得通过诚实的种植园工作来增强自己。"
 NIC_bananas_for_america:0 "香蕉经济"
 NIC_bananas_for_america_desc:0 "尼加拉瓜的经济仍然是非常农业化的，因此为了筹集国家建设的重要资金，我们必须增加经济作物的种植。尤其是香蕉，我们国家的主要农作物。"
 NIC_freedom_isnt_free:0 "自由不是免费的"
 NIC_freedom_isnt_free_desc:0 "在尼加拉瓜，我们以美国为榜样，创造了一个新的费城，一个自由和劳动的家园，并将永垂不朽。为了保护这个崇高的飞地，我们必须武装我们的人民。"
 NIC_concede_territory:0 "联合果品公司租借地"
 NIC_concede_territory_desc:0 "通过邀请联合果品公司直接接管部分国有土地并将其改造成香蕉种植园，我们可以增加重要经济作物的产量。"
 NIC_american_advisors:0 "邀请美国顾问"
 NIC_american_advisors_desc:0 "美国拥有丰富的知识，我们可以利用这些知识来拓宽视野。通过慷慨资助研究工作和取消一些无用的规定，尼加拉瓜可以对美国专家敞开怀抱。"
 NIC_buy_ship:0 "购买南达科他号战列舰"
 NIC_buy_ship_desc:0 "任何文明国家都需要一艘漂亮的旗舰！幸运的是，我们听说过这样一艘即将退役，将会就此浪费的船。"
 NIC_red_scare:0 "红色恐慌"
 NIC_red_scare_desc:0 "赤匪无处不在，我们必须确保他们不会腐蚀我们亲爱的尼加拉瓜，并蔓延到美国。我们将发动一场宣传运动，一劳永逸地铲除红色威胁。"
 NIC_great_admiral:0 "大司令"
 NIC_great_admiral_desc:0 "除了美国的军事顾问外，美国还向我们提供了一位老司令。他们真是慷慨！"
 NIC_benevolent_governor:0 "乐善好施的总督"
 NIC_benevolent_governor_desc:0 "我们一定要安排总督参观一下香蕉种植园，让尼加拉瓜人民欣赏他仁慈的个性，潇洒的容颜，对他们的福祉的关心。再加上十分钟的休息时间，他们一定会很高兴的。"
 NIC_wills_walkers:0 "美利坚师"
 NIC_wills_walkers_desc:0 "通过招募一个美国师到我们的军队服役，我们可以确保在任何人想要惹麻烦时，比如说路过的社会主义者或者危地马拉人，有点可靠的战斗力。"
 NIC_naval_support:0 "海军支援"
 NIC_naval_support_desc:0 "拥有一支强大的海军和确保你能用好来自空中的支援一样重要！"
 NIC_american_mandate:0 "美国已经掌控了尼加拉瓜"
 NIC_grey_eyed_man_of_destiny:0 "灰色眼睛的命运之王"
 NIC_grey_eyed_man_of_destiny_desc:0 "沃克将军是我们占领尼加拉瓜的灵感来源，我们希望让他为我们占领尼加拉瓜而感到骄傲。我们已经实现了沃克最伟大的梦想，我们绝不会被打败。"
 NIC_spread_the_joy:0 "传播欢乐！"
 NIC_spread_the_joy_desc:0 "洪都拉斯从桑地诺的威胁中拯救了我们，但这并不意味着我们是朋友。洪都拉斯需要接受我们的影响，并被适当地整合入我国。"
 NIC_rouge_government:0 "无赖政府"
 NIC_rouge_government_desc:0 "我们现在不忠于任何国家，不忠于联盟国，不忠于合众国，不忠于任何人。我们是一帮无赖，走在一条模糊不明的道路上，有时甚至根本不走在路上。不忠于任何事，这是我们的座右铭。"
 NIC_neel_or_die:0 "屈服或死"
 NIC_neel_or_die_desc:0 "我们是此地的君王，我们是尼加拉瓜的统治者。我们应被害怕，应被尊重。当我们的士兵来到附近时，人们都会锁上门。没有敢对我们不尊重的人民。我们是国王，我们是神。"
 NIC_end_resistance:0 "结束抵抗"
 NIC_end_resistance_desc:0 "社会主义者得死，反对者也得死。这个国家没有留给抵抗势力的空间。桑地诺已死，是时候让他所代表的意志和他一起死去了。"
 NIC_dreams_of_canal:0 "运河之梦"
 NIC_dreams_of_canal_desc:0 ""
 NIC_conquers_no_more:0 "征服者已不再"
 NIC_conquers_no_more_desc:0 "我们不再只是占领这个小国的粗人将军了。我们现在是国王，甚至是神。所有人民都害怕我们，我们也不再忠于任何国家。没有什么能阻止我们，因为我们不再是小征服者，我们是尼加拉瓜人，我们将会留在这里。"
 ARMY_NIC_AUGUSTO_CESAR_SANDINO_DESC:0 "§Y指挥官介绍\n§Y生于：§W1895年5月18日，尼加拉瓜 尼基诺奥莫\n§Y军旅生涯：§W奥古斯托·塞萨尔·桑地诺没有接受过任何正式的军事训练，但他一生的功绩足以使他成为尼加拉瓜乃至全中美洲的军事传奇。首先，他试图加入自由主义者一方的宪法战争，但时任尼加拉瓜大西洋自由军总司令的何塞·马里亚·蒙卡达拒绝让桑地诺入伍。于是桑地诺随后自己召集了一支后来被称为“山岳”的游击组织，并在1926年11月成功袭击了埃尔希卡罗。这次胜利使他名声大振，最终为起义的自由主义者们所接受，成为全国抵抗运动的重要人物。然而，自由主义者在战争中的胜利是短暂的，蒙卡达的背叛让桑地诺再次拿起了武器组织反抗。这一次他带领着一支300人的强大军团在南方作战。从那以后接连不断的小规模冲突与杨克·莱维的技术支持大大提高了他的军事能力，现在他是全尼加拉瓜最有经验的战士之一。\n§Y重要信息：§W他是尼加拉瓜国家主权阵线的领导人"
 ARMY_NIC_YANK_LEVY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1897年10月5日，加拿大 汉密尔顿 \n§Y军旅生涯：§W伯特·“扬克”·利维，加拿大人，早年曾在加拿大皇家燧发枪团第39营服役，世界大战期间参与了澳新军团在巴勒斯坦与外约旦的战斗。在那里，他成为了使用机枪的行家，又有幸与阿拉伯的劳伦斯手下的侦察兵有过几次合作，熟悉了游击战的技巧。后来他在墨西哥革命最后阶段参与了革命军战斗，而后在尼加拉瓜宪法战争期间加入桑地诺的军队，此后便一直与桑地诺携手作战。因为英国大革命与随后加拿大爆发的红色恐慌使他自己成为了不受祖国欢迎的人。从那以后，他就留在尼加拉瓜一直帮助桑地诺的事业，为他的新兵传授游击作战的方法。"
 ARMY_NIC_FRANCISCO_SEQUEIRA_MORENO_DESC:0 "§Y指挥官介绍\n§Y生于：§W1903年6月27日，尼加拉瓜 索莫蒂约\n§Y军旅生涯：§W尽管没有受过任何形式的军事训练，弗朗西斯科·塞凯拉·莫雷诺参加了宪法战争的起义。他最早其实是被迫加入保守党军队与自由派作战的士兵，在那里他展示了一些领导军队作战的才能，但因为拒绝参与处决平民，他叛逃到了自由派的军队里。在自由派军营内，他成为了“西阵”组织的领袖，并在自由主义胜利后迅速转向反对蒙卡达——因为后者在革命胜利后要求解除自由派武装——从此以后他就一直反对美国对尼加拉瓜的军事占领。在与桑地诺的部队结盟后，他设法在桑地诺在墨西哥获得支持的同时在南部地区坚持了下来，然后参加了在该国西部夺取首都马那瓜过程中的一系列进攻。\n§Y重要信息：§W他是尼加拉瓜乡村党的领导人"
 ARMY_NIC_ABELARDO_CUADRA_DESC:0 "§Y指挥官介绍\n§Y生于：§W约1904年，尼加拉瓜格拉纳达\n§Y军旅生涯：§W阿韦拉多原研读法律，宪法战争爆发主动加入保守派军队，先后效力于埃米利亚诺·巴尔加斯的弟弟卡洛斯·查莫罗与阿丹·贝雷兹将军。然而事实证明，这名年轻的士兵只不过是在为获取利益而战，当他发现协助保守党是一项无益的努力时，他又转而加入了国民警卫队，在尼加拉瓜军事学院从事教职。后来，他又被美国干涉军重新召回以协助他们对付桑地诺。从那时起，他就成了该地区有名的雇佣兵。"
 ARMY_NIC_EMILIANO_CHAMORRO_VARGAS_DESC:0 "§Y指挥官介绍\n§Y生于：§W5月11日，尼加拉瓜阿科亚帕\n§Y军旅生涯：§W埃米利亚诺·查莫罗·瓦加斯从未接受过正规的军事教育，然而这位政治家在宪法战争因为反对自由派而成为了将军。虽兵败宪法战争，但随着时间的推移，他的军事组织能力也得到了提高。尽管他距离成为一名坚强的军官还有很长的路要走，但他仍然是一名可靠的战斗指挥官。\n§Y重要信息：§W尼加拉瓜保守党领导人"
