 POLITICS_AUGUSTO_CESAR_SANDINO_DESC:0 "在1926年自由派革命中，桑地诺作为一个小游击队领导人崭露头角，这令许多人大跌眼镜。《埃斯皮诺·内格罗条约》签署后，桑地诺拒绝承认此条约，并带领一支规模为三千人左右的游击队在南方作战，他因之声名鹊起。桑地诺和他的游击队在丛林里英勇奋战，不断蚕食袭扰着美国海军陆战队。不过，桑地诺还是渐渐地被赶往了南方，最后不得不和弗朗西斯科·塞凯拉·莫雷诺一道出逃至墨西哥。在墨西哥，桑地诺得以与包括萨帕塔等人在内的社会主义领导人们会面，在国际上闯出了名声。桑地诺也成为了普世公社磁灵学派——一个希望建立一个由神指引的普世公社的灵性论组织——的成员。1931年，在萨帕塔的陪同下，桑地诺回到尼加拉瓜，许多人响应他的号召，他的军队变得无比强大，甚至在1932年解放了马那瓜，逼迫美国撤军。现在，桑地诺总统的民众支持与日俱增，甚至有人建立了以其为名的组织来支持宣传桑地诺和他的统治。"
 POLITICS_FRANCISCO_SEQUEIRA_MORENO_DESC:0 "弗朗西斯科·塞凯拉·莫雷诺出生在一个和尼加拉瓜大部分家庭一样的贫穷家庭，一生中的大部分时间都作为一个文盲度过。在“自由”革命者与美国签署《埃斯皮诺·内格罗条约》之后，他成为了在尼加拉瓜北部作战的游击队领袖。他和他的400人团杀死了许多敌人，但还是被迫向南撤退，继续与桑地诺一同作战。当桑地诺在墨西哥时，他继续勇敢地在南部抗击美国的占领，直到桑地诺回来，并成为向北推进并最终解放马那瓜的领导者之一。革命结束后，他最终组建了自己的政党，称为“尼加拉瓜乡村党”，并专注于为下层阶级争取权利和改善教育系统。虽然他从1932年才开始学习如何阅读（至今他仍在努力学习），但他仍然成为了许多尼加拉瓜下层阶级备受崇拜的人。"
 POLITICS_JUAN_BAUTISTA_SACASA_DESC:0 "胡安·包蒂斯塔·萨卡萨是前总统卡洛斯·何塞-索洛萨诺的副总统，直到他在一次政变中被前总统埃米利亚诺·查莫罗·巴尔加斯推翻。在阿道夫·迪亚斯叛变之后，他在何塞·玛丽亚·蒙卡达·塔皮亚领导的南部自由派革命者的支持下宣誓就任总统，并协助解放了马那瓜。然而，在《埃斯皮诺·内格罗条约》签署之后，出于其对美国在尼加拉瓜施加影响力的行为的厌恶，他辞去了总统职务，回到了墨西哥并继续流亡。他主要作为桑地诺革命的观察员，决定与桑地诺在同一时间返回尼加拉瓜，并参加了解放马那瓜的行动。由于他和桑地诺发现双方在基本原则上达成了一致，萨卡萨得以组建自己的政党，称为“自由革命党”。他主要得到了那些比起社会主义者，更喜欢传统民主的人的支持，也得到了不少中高阶层人士的支持，他出人意料地得到了良好的执政基础和一批忠诚的追随者。"
 POLITICS_ELILIANO_CHAMORRO_VARGAS_DESC:0 "巴尔加斯是一名极富争议的军事家，曾在1917至1921年间担任总统。他在总统任期内得到了美国的支持，并帮助他们谈成了允许美国修建一条穿越尼加拉瓜的运河的条约。除了成功地偿还了尼加拉瓜的大部分债务外，他的总统任期几乎已经被人们遗忘。尽管他做出了许多努力，但他还是没能在1923年赢得总统职位。在1926年卡洛斯·何塞·索洛萨诺当选后，他发动了政府政变，引发了最终导致桑地诺上台的一系列事件。为此，有人认为他是尼加拉瓜革命的开端，也有人认为他不过是渴望权力。而到如今，他重返总统宝座的梦想终于实现了。"
 POLITICS_ADOLFO_DIAZ_DESC:0 "阿道夫·迪亚斯一直是桑地诺的诋毁运动的主要目标之一，而且其中的原因并非完全错误。1910年，他帮助推翻了自由派总统何塞·桑托斯·塞拉亚，并在美国的大力帮助下宣誓就任总统。在1911至1917年首次担任总统期间，他被大家视作美国为推动托诺帕矿业公司等美国公司达到目标的傀儡。1914年，他遭受了一场自由主义者的叛乱，这也是美国长达30年的军事占领的漫长岁月中的一部分，海军陆战队被迫出动镇压了这场反抗。这些海军陆战队在尼加拉瓜驻扎了十多年，既是为了维持当地的社会秩序，同时也是为了美国修建尼加拉瓜运河。然而，在查马罗于1926年政变后，海军陆战队第二占领部队让他宣誓就任总统。他镇压动乱的努力失败了，随后被迫向新总统何塞·玛丽亚·蒙卡达让位。自此之后他便在美国定居，直到现在。外国军队再次占领了尼加拉瓜，他再次被派遣前来镇压困扰该地区的动乱。"
 POLITICS_ANASTASIO_SOMOZA_GARCIA_DESC:0 "索摩查和其他许多尼加拉瓜人一样，打一出生就过上了卑微的生活，他后来获得了在费城上商学院的难得机会，并在那里与未来的妻子萨尔瓦多·德巴伊尔·萨卡萨，也就是胡安·包蒂斯塔·萨卡萨的侄女喜结联姻。从那以后，他就一直在努力工作，直到1926年自由主义革命的爆发。他在战斗中的整体表现并不突出，真正引起人们注意的是他地地道道的美式英语，这使他成为了自由派起义军和美国人之间的和平调解人。在这段时间里，他设法与美国人建立了进一步的关系，并加入了新成立的国民警卫队，直到美国人被驱逐出去之前，他一直被任命为该组织的负责人。然而，桑地诺前脚刚迈入首都，他就被迫撤退到了洪都拉斯，洪都拉斯欣然接纳了他和国民警卫队的残兵败将。令他沮丧的是，加入了桑地诺政权的胡安·包蒂斯塔·萨卡萨处于政治原因而迫使妻子与他离婚。他日思夜想着有一天能够夺回自己的祖国和妻子，而如今他终于实现了自己的目标。"
