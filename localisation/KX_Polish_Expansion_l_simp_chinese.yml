 PLX_KR_GATHERING_STORM_DESC:0 "第一次世界大战后，波兰终于实现了独立。可以这么说，但这种 \"独立 \"看起来很像对德国的依赖。尽管如此，波兰人民还是建立了自己的国家，即使是在最小的疆域内，而且经济也已经繁荣了一段时间。尽管波兰军队在德国驻军的牵制下不断施展阴谋诡计，但前路似乎一片光明，我们希望如此"
