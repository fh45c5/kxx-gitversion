POL_fp:0 "重回国际舞台"
POL_fp_desc:0 "波兰不能永远孤立于欧洲之外，重返国际舞台已是刻不容缓的大事。外交官们将奔赴各国首都，为共和国寻找新的盟友与出路。世界的格局正在剧变，而波兰必须在新秩序中争得一席之地。"
POL_leave_rp:0 "离开帝国公约"
POL_leave_rp_desc:0 "留在帝国公约之中，波兰就永远是柏林阴影下的附庸。我们必须果断退出这一体系，收回军队的指挥权，驱逐那些德国顾问。哪怕前路孤立无援，波兰也要亲手掌握自己的命运。"
PLX_stay_with_germany:0 "与德国同行"
PLX_stay_with_germany_desc:0 "眼下波兰尚不足以独自对抗强邻，与德国保持一致才是最稳妥的选择。留在帝国公约之中，我们可以换取宝贵的稳定与发展时间。柏林的目光正投向东方的广袤土地，波兰正好借这股东风壮大自己。"
POL_polish_colonialism:0 "建立海事与殖民联盟"
POL_polish_colonialism_desc:0 "波兰虽身处东欧，却不应把目光永远局限在欧洲一隅。海外殖民地意味着资源、市场与荣耀，这片舞台不能只由西方列强独占。是时候让波兰的旗帜飘扬在更广阔的世界上了。"
PLX_bargain_for_galicia:0 "索要加利西亚"
PLX_bargain_for_galicia_desc:0 "自从奥布拉希特兼任波兰国王与加利西亚总督以来，加利西亚地区与波兰的联系比以往任何时候都更加紧密。是时候正式欢迎南部的人民加入我们了。"
POL_destroy_oun:0 "镇压西乌克兰叛乱"
POL_destroy_oun_desc:0 "西乌克兰的叛乱分子正趁着帝国崩溃后的混乱蠢蠢欲动，威胁着波兰东南边境的安宁。我们必须以武力粉碎他们的组织，恢复加利西亚的秩序。只有铁腕镇压，才能让这片土地重新归于平静。"
POL_expand_morska_wola:0 "扩展摩尔斯卡沃拉殖民地"
POL_expand_morska_wola_desc:0 "摩尔斯卡沃拉是波兰在海外仅有的立足点，而它的潜力远未被充分挖掘。我们需要向那里投入更多的资金与移民，扩展种植园、港口与铁路。这片殖民地终将成为波兰插在热带的一颗明珠。"
POL_ucayali_expedition:0 "第二次乌卡亚利河探险"
POL_ucayali_expedition_desc:0 "乌卡亚利河的密林深处蕴藏着无尽的资源与未知，第一次探险只是揭开了它的面纱。波兰的探险队将再次深入南美腹地，建立据点并宣示我们的权利。这条河流将见证波兰殖民者不屈的脚步。"
POL_seize_far_east:0 "夺取远东"
POL_seize_far_east_desc:0 "远东的古老帝国正处于分崩离析的边缘，辽阔的土地与财富正等待新的主人。波兰的远征军将跨越重洋，在那里夺取属于我们的势力范围。从西伯利亚到南洋，波兰的旗帜将第一次出现在亚洲的地平线上。"
POL_legacy_bronislaw_pilsudski:0 "布罗尼斯瓦夫·毕苏斯基的遗产"
POL_legacy_bronislaw_pilsudski_desc:0 "布罗尼斯瓦夫·毕苏斯基曾梦想让波兰在远东拥有一席之地，如今我们终于有机会实现他的遗愿。日本及其在满洲的势力将成为我们下一个目标。跨越大洋的远征，将把毕苏斯基的名字刻在亚洲的土地上。"
POL_takeover_maf:0 "控制中央非洲"
POL_takeover_maf_desc:0 "中央非洲是德意志殖民帝国最富庶的遗产之一，如今它的主人已经无力自保。波兰应当趁势而入，夺取这片广袤土地的控制权。非洲的矿藏与种植园，将为波兰的工业提供源源不断的原料。"
POL_demand_portugal_colony:0 "索要葡萄牙非洲殖民地"
POL_demand_portugal_colony_desc:0 "葡萄牙的殖民帝国早已衰落，却仍占据着安哥拉与莫桑比克的大片土地。既然旧主人无力守住这些财富，波兰便有权提出自己的要求。非洲的西南角，理应飘扬着白鹰的旗帜。"
POL_to_liberia:0 "利比里亚保护国"
POL_to_liberia_desc:0 "利比里亚是非洲西海岸一个弱小而孤立的国家，正需要强大的庇护者。波兰将以保护国的名义介入，把这片土地纳入自己的势力范围。西非的港口与橡胶园，将成为波兰新的财源。"
POL_new_crusade:0 "新十字军"
POL_new_crusade_desc:0 "古老的十字军精神在波兰的血脉中从未熄灭，如今我们要将它带到中东。埃及、土耳其与叙利亚的富庶土地，正等待着新的征服者。让白鹰的旗帜再次插上圣地的城墙吧。"
POL_core_aus:0 "夺取奥地利皇冠"
POL_core_aus_desc:0 "卡罗尔·奥布拉希特二世既是波兰国王，也是奥地利皇冠的继承人。现在我们要以他的名义，将奥地利、匈牙利、波希米亚与巴尔干诸邦重新统一在哈布斯堡的权杖之下。多瑙河畔的旧帝国，将在波兰的领导下获得新生。"
POL_core_rom:0 "夺回罗马尼亚"
POL_core_rom_desc:0 "米哈伊一世与波兰王室有着深厚的血缘纽带，罗马尼亚的命运理应与我们相连。我们要以他的名义收回这片土地，把喀尔巴阡山两侧的国土重新纳入波立联邦的版图。多瑙河下游的油田，将归波兰所有。"
POL_core_hun:0 "强化波兰—匈牙利联盟"
POL_core_hun_desc:0 "亚历山大二世统治下的匈牙利，与波兰有着数百年的兄弟情谊。如今我们要把这份友谊升华为真正的联合，让两国在同一个王冠下共命运。喀尔巴阡盆地的土地，将因波兰的庇护而重获安宁。"
POL_core_fra:0 "新百日王朝"
POL_core_fra_desc:0 "安德烈一世的血脉可以追溯到拿破仑时代的波兰军团，而法国正是波兰最古老的盟友。我们要以他的名义向巴黎进军，在法兰西的土地上重建一个亲波兰的王朝。从维斯瓦河到塞纳河，一个新的百日王朝即将开启。"
POL_core_rus:0 "会议王国的遗产"
POL_core_rus_desc:0 "弗谢沃洛德一世身上流淌着罗曼诺夫与雅盖隆的双重血脉，俄国的王位理应由他来继承。我们要以武力终结莫斯科的混乱，把旧帝国的疆土重新纳入波兰的统治。从涅瓦河到伏尔加河，新的会议王国将屹立不倒。"
POL_core_ita_spr:0 "波旁纽带"
POL_core_ita_spr_desc:0 "奥古斯丁一世与波旁家族的血缘，让波兰对意大利与西班牙的王位拥有无可争辩的权利。我们要跨越阿尔卑斯山与地中海，把分裂的半岛与伊比利亚重新统一在同一个王冠之下。罗马与马德里，都将向华沙俯首。"
POL_core_sarmatia:0 "回归萨尔马提亚起源"
POL_core_sarmatia_desc:0 "萨尔马提亚的传说赋予波兰人统治东方草原的古老权利。帕维乌一世·萨尔瓦托将率领我们越过黑海，征服高加索、波斯与中亚的广袤土地。一个横跨欧亚的萨尔马提亚帝国，将在波兰的旗帜下重生。"
POL_core_usa:0 "实现帕德雷夫斯基之梦"
POL_core_usa_desc:0 "约翰四世·索别斯基的雄心不仅限于欧洲，北美大陆的纷争正是波兰介入的良机。我们要跨越大西洋，支持与我们友好的势力，把星条旗下的土地纳入波兰的势力范围。帕德雷夫斯基当年的梦想，终将由我们实现。"
POL_core_great_plc:0 "恢复波兰立陶宛联邦"
POL_core_great_plc_desc:0 "瓦迪斯瓦夫五世要重现雅盖隆王朝最辉煌的时代，让波兰立陶宛联邦的疆域重新完整。我们必须击败立陶宛、乌克兰、白鲁塞尼亚乃至德国与俄国，把东方的大片土地并入联邦。从波罗的海到黑海，大联邦的荣光将再次照耀欧洲。"
POL_core_great_intermarium:0 "成立海间联邦"
POL_core_great_intermarium_desc:0 "雅德威加二世将继承联邦的遗志，在波罗的海与黑海之间建立一个由波兰领导的国家联合体。我们要征服立陶宛、乌克兰、白鲁塞尼亚与德国东部的土地，把海间联邦的蓝图变为现实。这是一个多民族共存的伟大事业，也是波兰在东方的历史使命。"
POL_core_hre:0 "复兴神圣罗马帝国"
POL_core_hre_desc:0 "弗雷德里克二世·克里斯蒂安的血管里流淌着霍亨索伦与哈布斯堡的血液，他有权继承神圣罗马帝国的皇位。波兰的军队将向西挺进，征服德国、奥地利、瑞士、尼德兰与意大利北部。一个以华沙为中心的新神圣罗马帝国，将在欧洲的废墟上崛起。"
PLX_PLC_new_zion:0 "新锡安"
PLX_PLC_new_zion_desc:0 "波兰辽阔的国土可以成为犹太民族新的家园，而他们带来的资本与人才也将反哺这片土地。我们愿意张开双臂，迎接那些在欧洲各地饱受迫害的犹太人。锡安的梦想将在维斯瓦河畔生根发芽。"
PLX_PLC_integrate_zionist_forces:0 "整合锡安主义武装"
PLX_PLC_integrate_zionist_forces_desc:0 "锡安主义者已在欧洲各地组织起自己的准军事力量，他们渴望为建立家园而战。我们可以把这些武装纳入波兰军队的体系，为他们提供训练与装备。此举既壮大了我们的军力，也将犹太人的命运与波兰紧紧相连。"
PLX_PLC_relation_with_isr:0 "与圣地建立联系"
PLX_PLC_relation_with_isr_desc:0 "犹太复国主义者已在巴勒斯坦建立起自己的政权，而波兰可以成为他们在欧洲最重要的伙伴。通过向他们提供武器与志愿人员，我们将在中东获得一个可靠的盟友。这条纽带也将加强国内犹太社区与国家的联系。"
PLX_PLC_seek_jewish_immgrants:0 "寻求犹太移民"
PLX_PLC_seek_jewish_immgrants_desc:0 "波兰的新政府愿意为犹太人提供一个安稳的家园，并向世界各地的犹太社区敞开大门。我们将以土地、工作与公民权吸引他们前来定居，让这个流散千年的民族在维斯瓦河畔找到归处。这些移民带来的劳动力与技艺，也将为波兰的发展注入新的活力。"
PLX_PLC_3i_shadow_rule:0 "第三国际的傀儡政权"
PLX_PLC_3i_shadow_rule_desc:0 "波兰的革命政府将与巴黎的第三国际紧密合作，让工团国际的顾问深入国家机器。在红旗之下，波兰将成为东方革命向西推进的桥头堡。我们的政权或许独立，但巴黎方面的影子将无处不在。"
PLX_PLC_commie_volkism:0 "当共产主义遇上人民主义"
PLX_PLC_commie_volkism_desc:0 "我们要把马克思主义与波兰民族的传统文化结合起来，走一条属于波兰自己的社会主义道路。既不盲目追随巴黎的指令，也不向旧贵族与资本家妥协。人民的意志将成为这个国家新的信仰。"
PLX_PLC_red_millinaire_stays:0 "红色百万富翁延续"
PLX_PLC_red_millinaire_stays_desc:0 "像帕尔乌斯那样的革命者将继续掌握政权，用他们的手腕维系革命秩序。金钱与理想在这个红色政权中奇异地共存，革命并未因财富而褪色。只要他们仍在台上，波兰的革命就会沿着既定的方向前进。"
PLX_join_international_community:0 "加入国际"
PLX_join_international_community_desc:0 "作为一个新生的国家，以独立而强大的姿态重新进入世界舞台是我们责无旁贷的责任，在旧王国陨落后，我们将缔结新的外交关系。"
PLX_ally_russia:0 "与熊同行"
PLX_ally_russia_desc:0 "波兰在国际舞台上极度缺乏朋友与盟友，而我们已经别无选择。东方的[RUS.GetNameDefCap]正在欧洲组建一个新的集团，寻求俄罗斯的保护可能对我们有利——无论这多么耻辱。"
PLX_go_with_austria:0 "与维也纳结盟"
PLX_go_with_austria_desc:0 "虽然在理论上与德国佬没有什么不同，而且波兰人民对其的看法也同样糟糕，但奥地利人在欧洲处在相当孤立的位置，是波兰抵御侵蚀欧洲的革命和好战势力的最佳选择，如此我们就不会被卷入柏林毫无意义的帝国主义征服之中。"
PLX_unite_with_entente:0 "亲近协约国"
PLX_unite_with_entente_desc:0 "我们已经摆脱了奥地利人和德国人的控制，而我们的联盟必须追求更伟大的事情，工团主义者正在欧洲四散蔓延，迟早会夺走我们辛辛苦苦为祖国争取到的东西。让我们与协约国联合起来，把革命的红色浪潮赶回大海！"
PLX_poland_alone:0 "波兰的独立自主道路"
PLX_poland_alone_desc:0 "维也纳和柏林的旧秩序并不看重波兰，他们给予波兰人民的东西太少，却认为我们波兰人民会顺从地忘记我们间的恩怨。但我们绝不会忘记，我们知道，不能信任这些魔鬼来保护波兰，也不能相信东方的饿熊，我们必须走自己的路，为一个真正的波兰创造美好未来！"
PLX_ally_internationale:0 "波兰在革命中的角色"
PLX_ally_internationale_desc:0 "波兰从邪恶的奥地利、德国和俄国三国的帝国主义枷锁中挣脱出来，并终于在革命斗争中获得了解放。然而这还不够，反动势力仍在窥探并伺机待发，磨刀霍霍，等待着扼杀无产阶级梦想的良机。我们不能允许这样的事情发生，波兰应该成为社会主义在东方的先锋队。"
PLX_mobilize_the_people:0 "人民，前进"
PLX_mobilize_the_people_desc:0 "随着战争的即将到来，波兰人民将挺身而出捍卫革命，他们的自由已被赎回，他们的枷锁已被打破，他们将赢得整个世界。"
PLX_austrian_tech_sharing:0 "加入维也纳学派"
PLX_austrian_tech_sharing_desc:0 "我们与奥地利的关系十分稳固，我们应该借助这个优势分享我们的科技，这样我们彼此都可以从对方军事专家那里收益。"
PLX_Russian_Artillery_Designs:0 "俄国火炮设计"
PLX_Russian_Artillery_Designs_desc:0 "在我们与俄国新建立的同盟关系下，如果我们能与俄国人合作为我们自己的部队设计新的改进型火炮的话，将对波兰大有裨益。"
PLX_opportunism:0 "迈向德莫夫斯基线"
PLX_opportunism_desc:0 "德莫夫斯基线更多的是作为未来谈判的筹码，而不是一个完整的计划，它是一个关于波兰边界最大范围的假设性概念。虽然我们不能走得那么远，但我们将努力把所有波兰人团结在一个不受任何外国主宰的伟大国家中。"
PLX_PLC_return_lublin_castle:0 "回到卢布林城堡"
PLX_PLC_return_lublin_castle_desc:0 "卢布林城堡见证了波兰与立陶宛的联合，也承载着两国数百年的共同记忆。如今我们重返此地，准备为联邦的未来作出抉择。波兰与立陶宛的命运将再次紧密交织，而这一次由我们亲手书写。"
