KX_PL_ZL_DIVIDE_IN_THE_MOVEMENT:0 "军团内的分裂"
 KX_PL_ZL_DIVIDE_IN_THE_MOVEMENT_desc:0 "军团运动仍然存在分歧。我们必须采取措施建立明确的领导。"
 KX_PL_ZL_MILITARY_CONSTITUTION:0 "独裁的遗产"
 KX_PL_ZL_MILITARY_CONSTITUTION_desc:0 "我们必须决定政府的形式，以及我们是将重点放在老军团成员的封闭圈子里还是向整个军队开放。"
 KX_PL_ZL_MATTER_OF_TRADE_UNIONS:0 "工会问题"
 KX_PL_ZL_MATTER_OF_TRADE_UNIONS_desc:0 "工会在我们需要的时候帮助过我们，现在我们必须决定它们的命运。"
 KX_PL_ZL_QUESTION_OF_THE_ELITES:0 "精英问题"
 KX_PL_ZL_QUESTION_OF_THE_ELITES_desc:0 "过去的精英曾与德国人合作，现在我们必须决定是与他们合作，还是建立新的精英阶级。"
 KX_PL_ZL_FUTURE_OF_ECONOMY:0 "经济面貌"
 KX_PL_ZL_FUTURE_OF_ECONOMY_desc:0 "我们的经济被德国主导太久了！然而，如何改革并非易事。我们是实行中央集权经济，或是更接近社团主义的经济体制？"
 KX_PL_ZL_STATE_COUNCIL:0 "组建国务院"
 KX_PL_ZL_STATE_COUNCIL_desc:0 "国务院将治理我们的国家，但我们必须决定其形式，以及它是否只对军人开放，还是也对平民开放。"
KX_PL_ZL_LEFT:0 "聚焦军队叛徒"
KX_PL_ZL_LEFT_desc:0 "军中潜伏的阴谋家正企图背叛毕苏斯基元帅的遗产，将枪口对准萨纳齐亚政权。我们必须率先出手清洗军官团中的不忠分子，绝不能让兵变的阴霾笼罩华沙。"
KX_PL_ZL_RIGHT:0 "聚焦农民营"
KX_PL_ZL_RIGHT_desc:0 "乡野间的激进情绪正在不断蔓延，农民营的武装分子已对地方秩序构成了严重威胁。唯有果断派遣安全部队进驻农村、瓦解其地下网络，方能平息这场迫在眉睫的乡土暴动。"
KX_PL_ZL_CENTER:0 "聚焦民族主义者"
KX_PL_ZL_CENTER_desc:0 "青年民族主义者联盟的狂热分子正在街头煽动排外与反政府情绪，妄图颠覆现有的国家体制。我们必须动用铁腕手段查封其据点并逮捕闹事头目，彻底掐灭这股极端浪潮。"
KX_PL_ZL_LONGEST_DAY:0 "最长的一天"
KX_PL_ZL_LONGEST_DAY_desc:0 "波兰政局的火药桶已逼近临界点，各方反对势力的暗流在这一天彻底汇合。在这决定国家命运的漫长一日里，唯有最果决的行动才能让政权在风暴中屹立不倒。"
KX_PL_ZL_MARKET_LIBERAL:0 "拥抱自由市场"
KX_PL_ZL_MARKET_LIBERAL_desc:0 "过度的国家干预与官僚管制只会束缚波兰经济的活力。通过解除繁琐的行政枷锁、全面拥抱自由市场机制，我们将充分释放民间商业潜能，推动国家迈向真正的繁荣。"
KX_PL_ZL_WELCOME_FOREIGN_CAPITAL:0 "引进外资"
KX_PL_ZL_WELCOME_FOREIGN_CAPITAL_desc:0 "波兰的现代化工业建设亟需充足的资金与先进的技术支持。向外国投资者敞开大门并提供优厚的税收与产权保障，将为我国的经济腾飞注入源源不断的血液。"
KX_PL_ZL_CONTROL_UNION:0 "控制工会"
KX_PL_ZL_CONTROL_UNION_desc:0 "没完没了的罢工与激进的劳工诉求正在严重拖累全国的工业生产效率。政府必须运用法律与行政手段将各大工会纳入监管之下，确保产业界的稳定与社会秩序的安宁。"
KX_PL_ZL_CAPITALISTS_FIRST:0 "资本的领导地位"
KX_PL_ZL_CAPITALISTS_FIRST_desc:0 "实业家、金融家与商业巨头才是构筑现代波兰国力的真正脊梁。国家应当在政策与立法上全力扶持工商业精英，确立资本在国家经济建设中的绝对主导地位。"
 KX_PL_ZL_CORPORATISM:0 "维持现状"
 KX_PL_ZL_CORPORATISM_desc:0 "爱国主义不能局限于阶级，毕竟我们都是波兰人，我们将为了所有人的利益而携手合作。"
 KX_PL_ZL_APPROACH_CAPITALISTS:0 "建立法团主义"
 KX_PL_ZL_APPROACH_CAPITALISTS_desc:0 "尽管资本家曾与德国支持的政府合作，但不应为此指责他们！毕竟这种合作促进了我们国家的经济发展，现在我们将最终利用这些成果造福国家。"
 KX_PL_ZL_LEFT_ECONOMY:0 "军团的社会激进主义"
 KX_PL_ZL_LEFT_ECONOMY_desc:0 "因为毕苏斯基来自波兰社会党，虽然我们不再与它有深厚联系，但其社会激进主义已被继承甚至加强！我们将治愈这个国家！"
 KX_PL_ZL_STATE_ECONOMY:0 "国家至上"
 KX_PL_ZL_STATE_ECONOMY_desc:0 "无国则民弱；正是国家为民众指明了文化和经济上的方向。"
 KX_PL_ZL_NATIONALIZE_INDUSTRY:0 "消灭资本主义走狗"
 KX_PL_ZL_NATIONALIZE_INDUSTRY_desc:0 "德国占领的最大受益者除了德国本身，便是波兰资本家。作为报复，他们所有的财富都将被国有化，以造福全体波兰人民！"
 KX_PL_ZL_THREE_WAY_ECONOMY:0 "三方所有权"
 KX_PL_ZL_THREE_WAY_ECONOMY_desc:0 "经济将从三个方面进行组织——小型产业将保持私有，中型产业将组织在工人所有协会下，而大型企业将保留在国有手中。"
 KX_PL_ZL_NATIONAL_SYNDICALISM:0 "信任扎克热夫斯基"
 KX_PL_ZL_NATIONAL_SYNDICALISM_desc:0 "直接控制经济将是低效的，而与有产阶级合作则对人民不公；因此，我们的国家将按照工团主义路线进行组织！"
 KX_PL_ZL_WORKER_EMPLOYER_COOPERATION:0 "取代公司"
 KX_PL_ZL_WORKER_EMPLOYER_COOPERATION_desc:0 "无论我们对私有制的看法如何，公司已被证明只会给社会带来混乱。我们将用金字塔式运作的全国性组织来取代它们。"
 KX_PL_ZL_ORGANIZE_TRADE_UNIONS:0 "强制工会会员资格"
 KX_PL_ZL_ORGANIZE_TRADE_UNIONS_desc:0 "所谓的“流氓无产阶级”必须被震慑！工会会员资格将强制实行，以帮助我们组织生产和社会；当然，这一切都在国家的指导下进行。"
 KX_PL_ZL_LIMIT_STRIKE_RIGHTS:0 "劳资统一"
 KX_PL_ZL_LIMIT_STRIKE_RIGHTS_desc:0 "虽然工会确实帮助我们获得了权力，但我们不能被他们的任性要求所束缚；他们的活动必须被限制，并将权力移交给由劳资双方共同组成的组织。"
 KX_PL_ZL_FAVOUR_WORKERS:0 "生产者协会"
 KX_PL_ZL_FAVOUR_WORKERS_desc:0 "资产阶级将不复存在！工会已被证明是高效的组织形式，我们将把它们整合到国家政府结构中，由官僚和工人共同组成，负责决策。这种组织形式将把权力赋予工人阶级，在精英的指导下，但与资本主义不同——这些精英是凭功绩产生的！"
 KX_PL_ZL_FAVOUR_EMPLOYERS:0 "有机国家"
 KX_PL_ZL_FAVOUR_EMPLOYERS_desc:0 "自然需要维持平衡，国家亦然；我们将通过为每个阶级维持适当的影响力份额来达成这种平衡。"
 KX_PL_ZL_NATIONALIZATION_AGRICULTURE:0 "控制村庄"
 KX_PL_ZL_NATIONALIZATION_AGRICULTURE_desc:0 "必须为城市提供稳定的粮食流，否则我们将无法在最近的崩溃后重新实现工业化。这意味着我们也不能依靠旧贵族，因此农业必须由国家管理。"
 KX_PL_ZL_ASSOCIATE_AGRICULTURE:0 "农业协会"
 KX_PL_ZL_ASSOCIATE_AGRICULTURE_desc:0 "旧有的地主精英阶级必须被废除，他们的土地将被组织成生产者的自由联合体。"
 KX_PL_ZL_HEIR_OF_NOBILITY:0 "乡绅盟友"
 KX_PL_ZL_HEIR_OF_NOBILITY_desc:0 "波兰地主都是些贵族的残余，他们可能会成为我们在农村中有价值的盟友。我们将寻求与他们合作。"
