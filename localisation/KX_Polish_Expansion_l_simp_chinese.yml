 PLX_synd_military_a:0 "民主化军队"
 PLX_synd_military_b:0 "受控的军队"
 KX_PL_PG_EXPAND_ROYAL_COMPETENCIES:0 "扩展皇家权力"
 KX_PL_PG_EXPAND_ROYAL_COMPETENCIES_desc:0 "王室委员会无法仅凭自身力量维持秩序，我们的君主必须被赋予强大的特权。"
 KX_PL_PG_RISE_OF_SYNARCHISM:0 "共治主义的崛起"
 KX_PL_PG_RISE_OF_SYNARCHISM_desc:0 "共治主义者长期以来一直影响着君主主义运动，其目标是建立一个由君主作为强大行政首脑的和谐社会。如今，随着该运动得到我国国王的认可，他们已准备好实施其理想。"
 KX_PL_PG_APPOINTABLE_SENATE:0 "钦点参议院"
 KX_PL_PG_APPOINTABLE_SENATE_desc:0 "参议院长期以来一直被贵族阶层所掌控，这得益于不平等的选举制度。如今，任命参议员将成为君主的专属权力之一，从而确保对立法体系的协调控制。"
 KX_PL_PG_REFORM_ROYAL_COUNCIL:0 "共治主义王家委员会"
 KX_PL_PG_REFORM_ROYAL_COUNCIL_desc:0 "王室委员会与共治主义者设想的模式已颇为相似，但存在一个根本区别——它并非由国王任命最优秀的人才组成，而是一个由富人和权贵主导的半独立机构。因此，它亟需进行深刻改革，以真正成为一个协调机构，其中“能力”将成为其核心原则！"
 KX_PL_PG_CASCADE_PARLIAMENT:0 "级联议会"
 KX_PL_PG_CASCADE_PARLIAMENT_desc:0 "议会亟需进行必要的改革。根据共治主义原则，选举程序将进行深刻改革，议员不再通过直接选举产生，而是由地方机构选举产生，随后这些地方机构再从内部选举出议员；此外，提供的选票将设计为针对个人而非政党进行投票。"
 KX_PL_PG_REAFFIRM_ROYAL_COUNCIL:0 "重申王室委员会的角色"
 KX_PL_PG_REAFFIRM_ROYAL_COUNCIL_desc:0 "尽管面临种种困难，王室委员会依然存续，且比以往任何时候都更加坚强；如今，在没有德国的阻碍下，我们可以制定新的政策，以实现一个强大的波兰，这与我们的传统和秩序相符。"
 KX_PL_PG_RELY_ON_ARISTOCRACY:0 "旧贵族继续掌权"
KX_PL_PG_RELY_ON_ARISTOCRACY_desc:0 "唯有贵族方能确保国家的稳定与繁荣，旧王室委员会将继续执政！"

KX_PL_PG_NEW_MILITARY_SAFEGUARD:0 "军人的保障"
KX_PL_PG_NEW_MILITARY_SAFEGUARD_desc:0 "瓦迪斯瓦夫·西科尔斯基领导下的改革派军队将暂时接管政府，监督民主化过渡进程。"

KX_PL_PG_FINDING_COMPROMISE:0 "与议会派达成妥协"
KX_PL_PG_FINDING_COMPROMISE_desc:0 "西科尔斯基将与议会下院议员展开对话，规划民主化过渡的步骤。"

KX_PL_PG_REOPEN_PARLIAMENT:0 "重开瑟姆议会"
KX_PL_PG_REOPEN_PARLIAMENT_desc:0 "尽管议会权力仍被暂停，瑟姆将重新召开以展示善意，并帮助我们合法化宪法修正案。"

KX_PL_PG_SEJM_ADVISORY_ROLE:0 "瑟姆降格为咨询机构"
KX_PL_PG_SEJM_ADVISORY_ROLE_desc:0 "瑟姆将被剥夺大部分权力，基本保留咨询职能，以便精英阶层与民众保持联系。"

KX_PL_PG_CONTINUE_EXECUTIVE_ORDERS:0 "行政命令的‘传统’"
KX_PL_PG_CONTINUE_EXECUTIVE_ORDERS_desc:0 "尽管王室委员会‘滥用’行政命令的做法广受批评，但传统既已确立，其使用仍将继续。"

KX_PL_PG_GOVERNMENT_BY_APPOINTMENT:0 "钦定政府"
KX_PL_PG_GOVERNMENT_BY_APPOINTMENT_desc:0 "政府将由君主根据议会请求任命，即使君主的权力预期仅为象征性，其仍可在危机时期行使权力，保留王室否决权。"

KX_PL_PG_LIMIT_ROYAL_PREROGATIVES:0 "限制王室特权"
KX_PL_PG_LIMIT_ROYAL_PREROGATIVES_desc:0 "王室特权当前过于强大，我们不能受君主一时兴起的摆布，唯有政府方能维持稳定！"

KX_PL_PG_UNITY_NOT_IDEOLOGY:0 "团结——而非意识形态！"
KX_PL_PG_UNITY_NOT_IDEOLOGY_desc:0 "‘意识形态主义’酿成的激进主义未给我们带来益处，我们需要保持团结，稳步前行。"

KX_PL_PG_ARISTOCRATIC_REPUBLIC:0 "贵族‘共和’制"
KX_PL_PG_ARISTOCRATIC_REPUBLIC_desc:0 "即便存在君主，共和传统在我国贵族中依然强大。无论我们与‘新贵’结盟，还是教士阶层施加影响，‘贵族民主’的理想必将胜利！"

KX_PL_PG_POWER_TO_THE_SENAT:0 "参议院主导立法"
KX_PL_PG_POWER_TO_THE_SENAT_desc:0 "议会下院‘瑟姆’已被证明是反叛因素，现正式将其权力削减为咨询职能，立法权移交由富有且合格的精英组成的参议院。"

KX_PL_PG_EXPAND_LOCAL_GOVERNANCE:0 "扩大地方治理"
KX_PL_PG_EXPAND_LOCAL_GOVERNANCE_desc:0 "地方治理是健康国家的重要组成部分，我们将赋予地方‘瑟姆’更多权限，因为他们最了解本地区需求。"

KX_PL_PG_APPEAL_TO_INDUSTRIALISTS:0 "争取工业家支持"
KX_PL_PG_APPEAL_TO_INDUSTRIALISTS_desc:0 "尽管依赖贵族，我们不能忽视城市资本。将在维护贵族特权的前提下寻求与他们的合作。"

KX_PL_PG_TAX_BREAKS:0 "实施税收减免"
KX_PL_PG_TAX_BREAKS_desc:0 "税收减免将推动经济在近期萧条后复苏，同时满足统治阶层的需求。"

KX_PL_PG_LOWER_REGULATIONS:0 "放松市场管制"
KX_PL_PG_LOWER_REGULATIONS_desc:0 "我们将降低监管力度，允许企业在无需担忧国家干预的情况下运营，这将确保经济快速增长。"

KX_PL_PG_PROTECTIONISM:0 "保护主义政策"
KX_PL_PG_PROTECTIONISM_desc:0 "波兰市场需要保护以免受外国商品涌入，我们将制定相应贸易政策以抵御海外影响。"

KX_PL_PG_CONTINUE_LAND_CONSOLIDATION:0 "乡村变革"
KX_PL_PG_CONTINUE_LAND_CONSOLIDATION_desc:0 "我们无法阻挡必然进程，土地整合必须完成，即便这意味着跨越城乡界限。"

KX_PL_PG_LIMIT_LAND_SALE:0 "限制土地交易"
KX_PL_PG_LIMIT_LAND_SALE_desc:0 "城市资本已越界涉足农业用地。我们必须制止这一趋势，以保护贵族利益。"

KX_PL_PG_IGNORE_THE_NEW_RICH:0 "无视‘新贵’"
KX_PL_PG_IGNORE_THE_NEW_RICH_desc:0 "唯有贵族——古老的高贵血脉——能以理性方式引领国家。我们将忽视那些可能有钱但缺乏人格尊严的工业家！"

KX_PL_PG_SEEK_LEGITIMACY_IN_PEOPLE:0 "民赋正统"
KX_PL_PG_SEEK_LEGITIMACY_IN_PEOPLE_desc:0 "我们将寻求调和国内各阶级。我们都是同一民族，并应依此协作。"

KX_PL_PG_STATE_CONTRACTING:0 "国家承包制"
KX_PL_PG_STATE_CONTRACTING_desc:0 "为使国家免受腐朽工业家影响，我们将建立国家承包体系，其考量将超越单纯金钱因素。"

KX_PL_PG_PROMOTE_PHILANTROPY:0 "推广慈善事业"
KX_PL_PG_PROMOTE_PHILANTROPY_desc:0 "尽管慈善无法替代完善福利制度，但通过推广慈善，我们将能紧缩预算。"

KX_PL_PG_RESTORE_TRADE_UNIONS:0 "重建工会组织"
KX_PL_PG_RESTORE_TRADE_UNIONS_desc:0 "工会将被重建并改革为国家、企业和工人之间的三方桥梁。"

KX_PL_PG_PLATFORM_BETWEEN_CLASSES:0 "阶级间沟通平台"
KX_PL_PG_PLATFORM_BETWEEN_CLASSES_desc:0 "国家发展需要妥善协调，企业必须投资，工人需维护自身尊严（当然要以建设性方式），政府将监督这一过程。"

KX_PL_PG_MODERATE_WELFARE_STATE:0 "适度福利国家"
KX_PL_PG_MODERATE_WELFARE_STATE_desc:0 "尽管俾斯麦绝非波兰民族之友，但他关于必须进行一定程度改革并为民众提供福利的观点是正确的——这既能取悦下层阶级，又能维持上层稳定。"
 KX_PL_PG_SCIENTIFIC_ECONOMY:0 "科学经济"
 KX_PL_PG_SCIENTIFIC_ECONOMY_desc:0 "经济不能仅仅任由市场随意摆布，只有将其视为一门科学，我们才能实现快速且可持续的增长。"
 KX_PL_PG_NEW_KIND_OF_MONEY:0 "新货币"
 KX_PL_PG_NEW_KIND_OF_MONEY_desc:0 "基于增长的金融模型已严重过时；我们需要建立一个基于劳动的新货币体系。"
 KX_PL_PG_CALCULATE_TAXES:0 "依能征税"
 KX_PL_PG_CALCULATE_TAXES_desc:0 "长期以来，低收入群体的税收负担一直严重失衡！指导研究所将实施一项基于财富数据和数学计算的新系统，以确定个人应缴纳的税额，最终目标是将未来税收限制在私人财产所得的利润范围内。"
 KX_PL_PG_EQUALITY_OF_LABOUR_AND_CAPITAL:0 "劳资平等"
 KX_PL_PG_EQUALITY_OF_LABOUR_AND_CAPITAL_desc:0 "虽然拥有资本是正当的，因为它是通过劳动获得的，但劳资关系长期以来一直被拥有资本的阶级所主导。我们需要努力在工人和雇主之间实现平衡，以建立一个对所有人公平的制度。"
 KX_PL_PG_BALANCE_CONSUMPTION:0 "协调消费"
 KX_PL_PG_BALANCE_CONSUMPTION_desc:0 "消费品生产长期以来一直受到低效问题的困扰，导致商品过剩并引发市场崩溃。我们需要引入经济规划的要素来调控价格，鼓励某些商品的生产，同时抑制其他商品的生产。"
 KX_PL_PG_HARMONY_ACHIEVED:0 "和谐平衡"
 KX_PL_PG_HARMONY_ACHIEVED_desc:0 "我们的体制尚未全面实施，但我们已经可以看到工作的成果；波兰社会将是一个公正的社会，工人在其中能够享受劳动的果实，雇主能够保障自己的财产安全，一切都高效运转，从而实现充实的生活。"
 KX_PL_PG_INSTITUTE_OF_GUIDANCE:0 "指导研究院"
 KX_PL_PG_INSTITUTE_OF_GUIDANCE_desc:0 "“指导研究院”将在经济中发挥协调作用，统筹生产并为经济规划提供依据。"
 KX_mon_military_democracy_1:0 "军队保证稳定"
KX_mon_military_democracy_2:0 "军队保证稳定"
KX_mon_military_democracy_3:0 "谨慎的民主"
POL_Aleksy_Cwiakowski_hog_sde:0 "阿列克谢·奇维亚科夫斯基"
