 PLX_air_tactics:0 "新修订的空战策略"
 PLX_support_focus:0 "消灭他们的步兵"
 PLX_bomber_focus:0 "摧毁他们的家园"
 PLX_the_great_debate_desc:0 "摄政会议为选举出波兰的下一任国王继续着无休止的辩论。"
 PLX_a_new_poland_desc:0 "王国已经死去，波兰共和国万岁！是时候让祖国在民主的大旗下继续前行了，这将保证我们的未来是一个自由而独立的国家。"
 PLX_von_habsburg_desc:0 "随着卡尔·阿尔布雷希特·冯·哈布斯堡当选，这位新国王必须在一个挣扎的国家内稳定他的王位。"
 PLX_von_hohenzollern_desc:0 "随着弗里德里希·克里斯蒂安·萨斯基当选，这位新国王必须在一个挣扎的国家内稳定他的王位。"
 PLX_a_firm_hand_desc:0 "贪腐政客已经下台，外国压迫者亦被驱逐，波兰终于迎来了光明的新纪元。此乃重生之时代，无论是文化、军事，还是精神，全波兰都将重新屹立。"
 PLX_victory_of_the_people_desc:0 "共产主义者推翻了过去堕落腐败的政府，现在准备带领波兰走向光明且辉煌的未来。"
 PLX_return_galicia_desc:0 "凭借我们新国王[POL.GetLeader]和[AUS.GetLeader]的亲密关系，我们可以利用这个机会和平地提出我们对加利西亚的要求，该地区自古以来就是波兰王国的一部分。"
 PLX_lessons_of_the_empire_desc:0 "奥地利在修理少数民族间裂隙上有着丰富的经验，我们也可以借此修补国内不同人群间的裂隙。"
 PLX_austrian_tech_sharing_desc:0 "我们与奥地利的关系十分稳固，我们应该借助这个优势分享我们的科技，这样我们彼此都可以从对方军事专家那里收益。"
 PLX_absolutism_desc:0 "没有君主掌权的波兰是衰弱的。我们必须保证这一切不会再度上演，如果波兰想要再度崛起，我们必须建立绝对的君主权力。"
 PLX_reform_the_monarchy_desc:0 "波兰仍然四分五裂，十分脆弱，通过改革君主制，削弱君主的权力，我们可以把这个国家带向现代社会。"
 PLX_abolish_the_council_desc:0 "议会只是个虚弱而垂死的机构，他们的“选举”只会进一步分化、分裂人民。我们需要抛弃过去的陈腐事务，将所有权力交给君主手中。"
 PLX_citizens_rights_desc:0 "起草一系列新法律来强化我们的公民权会产生一个教育水平更高、更忠诚、更有创造力的群体。"
 PLX_a_centralized_state_desc:0 "君主是我国一切事项的最终权威，贵族们只为他的权威服务。通过不失时机地削弱贵族的权威，我们便可以降低他们在国内的力量，提高君主的地位。"
 PLX_a_new_sejm_desc:0 "自从世界大战结束、波兰获得新生后，议会就没有什么变化。议会中充斥着法律漏洞和效率低下，但通过重组议会，这些问题会被修正，波兰将从中受益无穷。"
 PLX_poland_lithuania_desc:0 "重建联邦对两国都有好处。"
 PLX_minority_rights_desc:0 "在波兰王国内仍有许多少数民族权益得不到保护，通过立法给他们特殊的保护，波兰会变得更加强大。"
 PLX_a_new_constitution_desc:0 "波兰的新国王开辟了波兰历史的新纪元，也就意味着新的法律被制定。起草宪法将是规划波兰历史新纪元的第一步。"
 PLX_lithuanian_shipbuilding_desc:0 "波兰失去了入海口，但是立陶宛有出海口。通过开发立陶宛的海岸线我们可以开始打造自己的海军。"
 PLX_kickstart_navy_desc:0 "波兰再次获得了出海口，我们必须尽快建造新的海军基础设施，让波兰海军航行的更远。"
 PLX_new_trade_opportunities_desc:0 "新式海军需要新时代的海军军官。我们需要在全国征募水手，在接下来几年训练一批新海军军官。"
 PLX_join_mitteleuropa_desc:0 "波兰孤立于欧洲，既无盟友亦无朋友。借助新国王弗里德里希·克里斯蒂安·萨斯基，我们与德国的关系变得更为紧密。我们应该借助这一机会争取进入中欧联盟。"
 PLX_german_advisors_desc:0 "如果我们想在欧洲保持政治影响力，改革军队和政治体制是最为重要的。借着我们与德国良好关系的东风，我们可以让他们派遣顾问来帮助我们的军队现代化。"
 PLX_join_economic_bloc_desc:0 "我们与德国人的新王朝关系为我们提供了一个独特的机会，充分利用来自中欧同盟的额外资源，破除我们以前因冷漠和不安而较为僵硬的关系。通过这样做，我们可以加强本国经济，并获得与邻国的重要贸易协议。"
 PLX_naval_interdiction_desc:0 "相比于花费数十年重新打造一支传统海军，我们应该致力于精准打击，击溃敌人最脆弱的地方。"
 PLX_unrestircted_submarine_warfare_desc:0 "我们需要从过去的范例中寻找经验，制定将来的计划。无限制潜艇战在过去被证明是最为致命的，这一战术在当代没有理由不起作用。"
 PLX_a_new_navy_desc:0 "如果我们想要再度雄立于欧洲列国之中，我们必须要打造一支全新的现代化海军，它必须有实力挑战欧洲和全世界的列强。"
 PLX_pride_of_the_baltic_desc:0 "没有旗舰的海军是不完整的。我们必须立刻开始计划和建造新型战列舰，以带领波兰舰队。"
 PLX_polish_marines_desc:0 "波兰的未来不仅取决于国内，也取决于海外。由于长久以来没有海岸线，我们必须加倍努力，制定一个扩张我国海外军事力量的战略，这样敌人绝不会逃出我们的手掌心。"
 PLX_naval_industry_desc:0 "借助重新开发历史名城格但斯克，我们必须利用这里大量的港口和海军基础设施来打造一支新的波罗的海海军，这将成为欧洲的骄傲。"
 PLX_gdansk_agreement_desc:0 "我们的外交地位在过去20年间不断提高。我们需要借助这一优势，向柏林发出外交请求，要求交换我们的合法领土普沃茨克给波兰人民。这看起来很难实现，但试一试并无坏处······"
 PLX_poland_forever_desc:0 "即使波兰被毁灭，即使波兰被摧垮成为废墟，波兰之魂永不灭亡。波兰永远活在波兰人的心里，它必将崛起，即使再花去一个世纪的斗争。"
 PLX_beacon_of_polish_spirit_desc:0 "新的波兰国家是波兰精神的灯塔，激励所有真正的波兰人在下一场战争中保卫她。波兰是人民的堡垒，她永远站在真理一边！"
 PLX_not_yet_lost_desc:0 "旧政权的陨落与新波兰的黎明在全新的乐观精神中来到，波兰尚未陨落，人民必将团结在她的麾下。"
 PLX_free_elections_desc:0 "随着新共和国的黎明来到，必须要举行临时选举来组建新的议会。这些选举将花费波兰数年进行，许多激进政党将为此激烈竞争。"
 PLX_economic_reform_desc:0 "波兰在经济上发育不足，很大一部分要归咎于旧王国保守的贸易政策。通过一系列激进的改革，波兰可以在世界市场上更有竞争力，并能与她的海外贸易伙伴走得更近。"
 PLX_new_universities_desc:0 "波兰的数学学院享誉全欧洲。通过给他们充足的经费，我们可以获得益处，促进技术进步。"
 PLX_the_stab_in_the_back_desc:0 "背信弃义的德国人在战争期间对我们做出了诸多承诺：真正的独立，稳定，繁荣。但正如日耳曼人一贯的做法，他们背叛了我们，让波兰成为了一个没有国王的软弱王国。我们已经受够了，是时候准备好刺刀，来打倒这头匈奴野兽了。"
 PLX_militarism_desc:0 "波兰人民受外国势力压迫的时间太长了。现在有了一个真正关心他们的执政政府，越来越多的人加入了军队，更不用说在被占领的波兰土地上的各种抵抗组织了。我们将夺回帝国势力从我们手中夺走的东西，无论是用军刀、来福枪还是坦克！"
 PLX_cleanse_monarchists_desc:0 "即使新的波兰国家从旧王国的废墟中崛起，仍然有很多人希望回到王政时代。我们必须把握一切机会来找出这些支持者，为了国家稳定，将他们清除。"
 PLX_fortress_poland_desc:0 "波兰被强敌环伺，但这并不意味着我们可以就此放弃。如果我们想要生存下去，我们必须建造一个强大的防御工事和边境哨所网络来保护我们的心脏地带不被外国侵犯。我们绝不会被轻易毁灭。只要波兰勇敢的子民们保卫她，波兰就会存续下去。"
 PLX_opportunism_desc:0 "德莫夫斯基线更多的是作为未来谈判的筹码，而不是一个完整的计划，它是一个关于波兰边界最大范围的假设性概念。虽然我们不能走得那么远，但我们将努力把所有波兰人团结在一个不受任何外国主宰的伟大国家中。"
 PLX_dismantle_gov_desc:0 "充斥着错误和缺陷的旧参议院仍然存在。实施民族民主党的计划，将其改革成一个更加任人唯贤和有效的机构来管理我们的国家，将是明智的。"
 PLX_imprison_politicians_desc:0 "我们有些人仍然记得1905年革命中毫无意义的流血事件。当民族民主党人试图并成功地从沙皇那里获得让步时，狂热的社会主义者被革命热情所席卷，在波兰的土地上洒下了波兰人的鲜血，最终一无所获。我们不能允许这种情况再次发生。社会主义者必须付出代价。"
 PLX_recruit_civil_servants_desc:0 "随着所有改革的进行，可以说波兰已经重生了。最重要的是，它的政治制度已经得到了完善。误入歧途的窃盗统治和落后的贵族时代已经结束了。今天，我们生活在一个完美的民主国家，一个全国性的民主制度中！"
 PLX_ministry_of_prop_desc:0 "我们的政府相对来说还是比较年轻的。鉴于我们与波兰圣公会的关系比较融洽，也许我们可以从他们那里获得对我们统治的正式认可。这肯定会有助于说服我们社会中一些犹豫不决的成员来支持我方。"
 PLX_technical_colleges_desc:0 "没有人民的技术知识，一个国家就无法生存。这正是为什么我们必须投入更多资源来改善我们的教育机构，以便下一代能够将波兰的火炬延续到遥远的未来。"
 PLX_all_under_one_desc:0 "我们必须发起一场宣传攻势，使全体波兰人民看到工团主义制度会给他们的祖国带来的何等荣耀。"
 PLX_polish_exceptionalism_desc:0 "波兰青年必须要被教育，他们是最优秀的，他们是欧洲最强大的、最伟大的人。如此一来他们将在战争时更坚韧、更强大，在和平时工作的时间更长、更卖力。"
 PLX_new_communes_desc:0 "我们必须把国家权力从资产阶级手中夺走，将它交还给人民。新的、更强大的公社会提高人民抵御资本主义影响力的能力，提高人民的决心。"
 PLX_research_cities_desc:0 "正是个人的首创促进了科技的进步。我们应该建造特殊的科研城市来把我们最聪明的头脑聚集起来，让他们互相交流，将科学研究推向最前沿。"
 PLX_attend_internationale_desc:0 "波兰农民一直无缘获得优良教育。我们的社会主义政府深切关怀工农的福祉，决定立即解决这个问题。"
 PLX_territorial_claims_desc:0 "当我们与法国的同盟关系确立，我们应该立刻对德国领土提出宣称，以保证敌人在新的战争里被我们制服。"
 PLX_austrian_claims_desc:0 "与法国的联盟将确保我们对奥地利领土的宣称，他们将在新的战争中被我们制服。"
 PLX_minstry_of_public_security_desc:0 "我们必须建立公共安全部以清扫新政权的不安定因素，在全球范围内扩大我们的决策能力。"
 PLX_international_agents_desc:0 "如果我们想以社会主义之名在国外搞颠覆行动，我们必须首先赢得他国有类似理念的人。旅居国外的波兰人是这一任务的绝佳人选。"
 PLX_spread_the_revolution_desc:0 "革命不需要边界，也不应该被国界线限制，他应该被尽可能地散播到更远的地方！"
 PLX_redistribute_wealth_desc:0 "过去的国王为自己攫取了大部分的国家财富，波兰人民被他们的金马刺到处驱使。我们必须把财富重新分配给人民！"
 PLX_centralize_infrastructure_desc:0 "波兰是一个农业国，但如果我们想要步入新时代，我们必须成为一个工业国。将基础设施中央集权化将是走向工业革命的第一步。"
 PLX_farmers_reform_desc:0 "波兰的大部分农业生产依然沿用过时的技术，这与20世纪的技术水平不符。我们要向农民介绍现代机械化农业来提高他们的生产能力。"
 PLX_reform_banks_desc:0 "波兰银行是国内最大的银行，但在黑色星期一的危机中破产。重建银行，将其从崩溃中拯救出来将是我们从黑色星期一的灾难里恢复的第一步。"
 PLX_currency_reevaluation_desc:0 "自从世界大战结束以来，波兰一直在用马克作为货币。现在德国的货币已经一文不值，是时候重新使用一种新的波兰货币，兹罗提了。"
 PLX_the_new_polish_worker_desc:0 "我们必须倡导一种新文化，让大家勤奋工作，所有强壮的男人都要进入工厂工作。“新波兰工人”将会是新工业的脊梁。"
 PLX_international_railways_desc:0 "波兰地处欧洲的心脏，这给了我们巨大的机会来成为欧洲铁路的枢纽。这些新线路对于和邻国之间的贸易往来有着巨大的价值。"
 PLX_the_munitions_district_desc:0 "通过在每个城市设置专门的军事和弹药生产区，我们可以建造特殊的基础设施，便利我们的军备生产，提高工业能力。"
 PLX_more_munitions_desc:0 "工厂是通向未来之路，如果我们想要在世界舞台上保有竞争力，我们就需要建造更多。"
 PLX_modernization_munitions_desc:0 "虽然我们的城市里工厂遍地，我们仍需要提高我们对于它们应该如何运转的理念。通过引进现代化流水线，我们可以提高全国范围内的工厂生产能力。"
 PLX_research_slot_desc:0 "私人研究领域在经济发展中被长期遗忘，应该鼓励他们多多进行自己的研究。"
 PLX_more_factories_desc:0 "对工业企业的扩张进行资助，可以提高国家的工业能力。"
 PLX_factories_desc:0 "议会波兰长期以来就是国家的农业中心，然而在这里建造更多工厂对我们的战争更有益处。"
 PLX_border_forts_desc:0 "我们的东部边境毫无设防。我们应该建造一系列连锁要塞以确保我们对东部的袭击不会毫无准备。"
 PLX_defensive_tactics_desc:0 "波兰的周边尽是不怀好意的强敌。我们若要生存下去，就必须让敌人每推进一步都要付出血的代价，我们的军队时刻准备着，保卫波兰的每一寸土地。"
 PLX_army_reform_desc:0 "波兰军队装备的大多还是世界大战时的武器。新的战争总会来到，我们必须为此做准备。"
 PLX_new_airforce_desc:0 "波兰空军的情况不容乐观。假若我们想要和其他欧洲列强一对一单挑的话，我们就需要让抱残守缺的空军从上一次战争中走出来，步入现代化。"
 PLX_import_rifles_desc:0 "为了开始我们的军队现代化，我们首先要进口大量的外国步枪，在制造国产步枪前，研究他们的进步之处。"
 PLX_a_new_rifle_desc:0 "如果战争有一天来临，我们不能指望进口外国的步枪。是时候设计我们的国产步枪，配装全军了。"
 PLX_military_ideals_desc:0 "波兰意识到她周围尽是不友好的邻居。蜷缩起来放任敌人行动是万万不可的，我们应先发制人，先人一步先灭对方。"
 PLX_modern_military_thought_desc:0 "战争再也不会在壕沟里和堡垒前打响。现代化军事思想有赖于快速反应和高速机动。我们的军官必须研究这些新技术，以便在世界舞台上保有竞争力。"
 PLX_military_desgin_bureaus_desc:0 "我们必须建立官方的波兰军事设计局以整合国内不同的军事研究单位。"
 PLX_modern_cavalry_desc:0 "骑兵的时代已经结束，但是摩托化步兵的时代已经开始。我么必须在卡车和其它摩托化装备上投入资金，为下一场作准备。"
 PLX_winged_hussars_desc:0 "尽管最后一名翼骑兵退出战争已是很多年前的事情，翼骑兵之魂仍然存留于我们心中，为我们的骑兵带来动力，让我们的灵魂充满勇气。"
 PLX_a_modern_panzer_desc:0 "钢铁是我们的未来，而坦克是未来的化身。我们必须设计出自己的坦克，让它们驰骋战场，痛击我们的敌人。"
 PLX_air_superiority_desc:0 "我们空军存在的目的是支援陆地的士兵，我们通过优先权反应支援目标的重要性。"
 PLX_close_combat_desc:0 "大型飞机不是未来的空军，如果波兰的战斗机想要命中目标，必须及时实现飞机设计的现代化。"
 PLX_air_radios_desc:0 "通过给每个飞行员装备私人无线电，我们的飞行员能彼此交流，这会提高他们作出复杂动作的能力。"
 PLX_air_tactics_desc:0 "纵观国际上的空军战术，我们可以以别国为模板改革我们的空军，以更小的花费创造一支更强大的空军。"
 PLX_support_focus_desc:0 "专注于把我们的炸弹投到敌方士兵的头上，借助从天而降的死亡弹雨，我们可以摧垮他们的士气，限制他们的战斗能力。"
 PLX_bomber_focus_desc:0 "让我们的轰炸机对准敌人的家园，我们可以摧毁他们的基础设施，在对方士兵还能开火前赢得战争。"
 PLX_polish_king_desc:0 "伴随着奥古斯丁·恰尔托雷斯基一世当选，新国王必须在一个努力挣扎的国家内保住自己的王位。"
 PLX_reincorporate_lithuania_desc:0 "随着我们和立陶宛之间关系的日益密切，以及在帝国公约中立陶宛的旧日联盟的瓦解，也许是时候让立陶宛作为我们的附庸并让其受到我们保护了，这样我们就可以在战时更好地保护彼此了。"
 PLX_line_of_succession_desc:0 "波兰衰弱的20年全因为缺乏一个强有力的君主领导整个国家。我们必须修改继承法，让波兰只为一个家族所统治，摄政会议将不再召开。"
 PLX_join_international_community_desc:0 "作为一个新生的国家，以独立而强大的姿态重新进入世界舞台是我们责无旁贷的责任，在旧王国陨落后，我们将缔结新的外交关系。"
  PLX_expand_airbase:0 "扩大防空力量"
 PLX_expand_airbase_desc:0 "即使波兰不能为自己打造一支强大的空军，我们仍可以将敌人的飞机全部击落。提高我国的防空实力势在必行。"
 PLX_experiment_with_radar:0 "雷达实验"
 PLX_experiment_with_radar_desc:0 "雷达是战场上的新式装备，目前没有人试验过其性能。如果我们掌握了这一技术，我们的空军将更具战斗力。"
 PLX_combined_arms:0 "合成部队"
 PLX_combined_arms_desc:0 "战争不止涉及一支军队，而是步兵、坦克和空军之间的混合战斗。通过教给军官一定的军事技术知识，我们可以善用合成部队理论。"
 PLX_infantry_tactics:0 "综合步兵战术"
 PLX_infantry_tactics_desc:0 "我们应该从训练士兵起就致力于提高他们的作战水平，这样在敌人枪弹来袭时，他们能做好万全准备。"
 POL_Circle: "处理政变余波"
 POL_Circle_desc:0"政变之后，各派势力在废墟上重新洗牌，德方与波兰合作者开始分配权力。核心圈成为决定国家走向的秘密俱乐部，军政府、企业界与亲德政客在其中讨价还价。稳定是用妥协与背叛换来的。"
 POL_Empower_Geheimrat: "重建跨党政治集团"
 POL_Empower_Geheimrat_desc:0"德方顾问与波兰政客组建起一个跨党派的政治集团，把各派精英收编进占领体制。这个集团不对选民负责，只对柏林和军政府负责。跨党合作的口号，掩盖了权力集中在少数人手中的事实。"
 POL_Entrenched_Constitutionalism: "橡皮图章议会"
 POL_Entrenched_Constitutionalism_desc:0"一部由占领当局认可的宪法被强加给波兰，议会虽然存在，却只能为德国的决定盖章。选举被操纵，反对派被排除，宪政的外衣下是赤裸裸的占领统治。这种宪政越是稳固，波兰人的自由就越是遥远。"
 POL_Ally_with_Szlachta: "与什拉赫塔结盟"
 POL_Ally_with_Szlachta_desc: "作为代表着保持扩大本地话语权与保留国家关键机构之间平衡的政党，我们很坚定地与贵族中的自由派成员结盟。他们的支持将会允许我们向农村地区进发，并且有望在未来土地改革时，为我们赢得一些他们的让步。"
 POL_Fill_The_Railway_Gaps: "填补铁路缺口"
 POL_Fill_The_Railway_Gaps_desc: "铁路部门的遗产是少数省份中仅有的混乱铁路网，而且国内铁路系统和国外铁路缺乏联系。这阻碍了我们从帝国公约的中心位置通过铁路运输的能力。即使会增加额外的运输里程，许多运输路线还是选择绕过波兰。解决这种缺乏联系的问题会给我们带来很多经济和运输上的好处。"
 POL_Friends_in_Vienna: "维也纳的朋友"
 POL_Friends_in_Vienna_desc: "对于中左派联盟中的很多人来说，奥地利作为一个贸易伙伴，代表着一个更加舒适的中间平台。这既是因为作为传统的民主主义者庇护所，也是因为它们和柏林并非紧密关联。有了加利西亚现存的经济联系，鼓励我国和维也纳方面的经济合作将对我们两国来说都有好处。"
 POL_Allies_in_Lewiatan: "“利维坦”的盟友"
 POL_Allies_in_Lewiatan_desc: "一群波兰的被称为“利维坦”的实业家开始提议削减波兰工人的保护监管和公司税，这样波兰的公司就可以更有力地与中欧同盟的其他市场竞争，并处于有利地位了。"
 POL_Constitutionalist_Coalition: "寻求亲德民主派支持"
 POL_Constitutionalist_Coalition_desc:0"军政府向亲德的民主派伸出橄榄枝，承诺在占领体制内给予他们一席之地。民主派以支持德国统治为代价，换取有限的政治空间与社会改革。他们的选择，让民主二字在波兰蒙上了阴影。"
 POL_Allies_in_Berlin: "向柏林效忠"
 POL_Allies_in_Berlin_desc: "作为我国经济最大的国外投资来源国，我国在未来继续发展和德国的关系是合情合理的。尽管有些人声称，如果德国经济经受打击，将使我国更容易遭受损失。但是这些人没有论证波兰经济应当如何才能免受这种打击的影响。此外，只要我们保证我国是德国牢不可破的忠诚盟友，我们将很有可能得到德国利益集团的支持，通过游说说服德国保持与我们的关系。"
 POL_Attract_German_Corporations: "吸引德国企业"
 POL_Attract_German_Corporations_desc: "由于我们努力证明自己是一个可靠的投资目的地，很多德国大型企业集团对发展在波业务表现出浓厚的兴趣。它们希望开拓新的业务，或者扩张原有业务。这些公司有潜力为我国经济带来大量间接利益，只要让他们相信我们会接受它们开出的价码。"
 POL_Rule_by_Royal_Decree: "王家法令统治"
 POL_Rule_by_Royal_Decree_desc: "在国家重要事务上，让我们去关注那些社会契约，并鼓励那些除了被选入职之外在工作上没有更大野心的人，是既低效又不“高尚”的。我们只需要一个强大的国王，而他会乐意让百姓安居乐业并远离暴民政治。"
 POL_Guarded_Democracy: "受保护的民主"
 POL_Guarded_Democracy_desc: "尽管民主是一个不错的原则，不是所有的公民都足够成熟和优秀来替国家做值得信任的决定。就像罗曼·德莫夫斯基经常说的，旧联邦在民主的密谋和争吵中浪费了自己的力量。我们必须保证瑟姆议会将永远站在正确的一方，别去理会那些像共产主义鼓吹者一样想要看到波兰被再次征服的人。"
 POL_Unite_the_Poles: "安抚波兰人"
 POL_Unite_the_Poles_desc:0"占领当局推出一系列安抚措施，试图缓和波兰人的敌意：有限的社会福利、文化让步与地方自治。这些姿态足以让一部分人沉默，却无法消除占领的根本矛盾。安抚只是统治的另一种形式。"
 POL_Primacy_of_the_Sejm: "瑟姆议会为首"
 POL_Primacy_of_the_Sejm_desc: "独裁统治是不现实的，瑟姆议会已经证明了它有能力不仅仅是作为国王的忠实仆人来承担一部分的职责。瑟姆议会中的代表们在功能上也是掌控政府的主体。有些人建议我们正式化这样的关系，但同时也明确表示他们会在君主授予的权力下工作。"
 POL_Manage_the_Unions: "管理工会"
 POL_Manage_the_Unions_desc: "虽然很少有人质疑工会在社会中发挥的重要作用，但他们的高尚理念很容易被别有用心声称代表工人利益的人所渗透。为了防止我们的工会腐化，政府将强制任命官员担任重要的工会职位，同时确保工厂内部的工会在腐败蔓延之前可以得到制止。"
 POL_Royal_Academy_of_Arts: "王家艺术学院"
 POL_Royal_Academy_of_Arts_desc: "让人民记住当今国王就是他们的国王，而且很关心他们国家的历史文化是一件非常重要的事情。为了能够更好地证明这一事实，我们起草了一份创立王家艺术学院的计划，这将表明国王支持波兰文化和艺术的意愿。"
 POL_Mitteleuropa_Ties: "中欧同盟之中"
 POL_Mitteleuropa_Ties_desc: "我们的新经济核心中部工业区同样有成为整个中欧同盟经济中心的潜质。通过加强本地铁路和工业区与东欧剩余地区的联系，我们有潜力把半个大陆的所有联系掌握在手中，让这里变得和任何欧洲的大城市不相上下。"
 POL_Secure_Magnates: "保障权贵"
 POL_Secure_Magnates_desc: "抛开效率低下不谈，我国的大型地产对维护波兰经济利益的确起到了关键的作用。这些地产中的绝大多数都是波兰人所有，小部分处于外国人的控制之中。由于本地地主认为这些人在恶性竞争低价出售这些地产，所以这部分人并不受到欢迎。为了拉拢国内的这些权贵，我们必须开始着手废除这些非波兰所有的地产并将它们转化为真正的波兰社区。"
 POL_Abolish_The_Royal_Veto: "无冕之王"
 POL_Abolish_The_Royal_Veto_desc:0"德国全权代表以无冕之王的姿态凌驾于波兰政府之上，废除了一切可能阻碍柏林意志的否决权。波兰的部长与议员只能俯首听命，真正的决策权掌握在德方手中。这个国家真正的主人是柏林派来的全权代表，而不是任何王冠。"
 POL_Path_of_Least_Resistance: "波德友谊永恒"
 POL_Path_of_Least_Resistance_desc: "通过核心集团的努力，波兰政治已经走上了一条稳健的改革道路。国王和人民之间达成了一种新平衡，这也展示着君主制有足够的适应力来应对不断变化的新环境。多亏我们的果断行动，左派和右派的进一步威胁已被抛诸脑后，风暴中的稳定岛屿，中道最终得胜。"
 POL_Purge_Nationalist_Terrorists: "清洗民族主义恐怖分子"
 POL_Purge_Nationalist_Terrorists_desc: "我们国内的民族主义分子除了危险因素以外什么都不是，他们致力于说服波兰人民和法律对立来最大化他们的利益。这种危险思想威胁的扩散如果不立马被制止，他就会让我们整个国家堕落。消灭这些极端民族主义者将会帮助我们的独立议题变得温和化，也有望消除一些潜在的威胁。"
 POL_Arrest_Socialist_Agitators: "逮捕社会主义煽动者"
 POL_Arrest_Socialist_Agitators_desc: "左翼激进派做出了很大的宣称，不停地抱怨他们资本主义的不公和他们所谓的封建制度。然而这些错误的思想却在我国下层阶级传播甚广，他们看起来很相信西方工团主义社会的理想主义图景。在他们进一步脱离我们控制之前，迅速打压这些言论很重要。"
 POL_The_Christian_Coalition: "基督教联盟"
 POL_The_Christian_Coalition_desc:0"教会中的亲德派与占领当局结盟，组建基督教政治联盟。他们以信仰与秩序为名，为军政府的统治提供道德背书。十字架与刺刀再次站到了同一边。"
 POL_Address_Land_Issue: "为德国人分配土地"
 POL_Address_Land_Issue_desc:0"土地改革被彻底扭曲：最好的土地被分配给德国移民与退伍军人，波兰农民则被赶到贫瘠的边角地。土地不再是农民的希望，而成了帝国殖民的工具。乡村的愤怒在沉默中积累。"
 POL_Eastern_Europes_Workshop: "东欧工坊"
 POL_Eastern_Europes_Workshop_desc: "回顾为打造新经济明珠所付出的努力，我们没有理由不为之自豪。现在我们已经将华沙周边地区转变为中欧最重要的工业中心之一，在规模和现代化程度方面都取得了极其引人瞩目的成就。还有很多工作等着我们去完成，波兰工业的全新黄金时代才刚刚开始！"
 KX_PL_PG_MANSTEIN_REGIME:"曼施坦因军政府"
 KX_PL_PG_MANSTEIN_REGIME_desc:0"曼施坦因在波兰建立起一套精密的军事官僚体系，以德国式的效率榨取这片土地的资源。他并非国王，而是占领军的统帅，他的权力来自柏林而非任何王冠。波兰的行政机构被改造成军政府的附庸。"
 KX_PL_PG_LOCAL_FAR_RIGHT:"赋权极右翼组织"
 KX_PL_PG_LOCAL_FAR_RIGHT_desc:0"德国军政府决定扶植波兰本地的极端民族主义组织，让他们充当镇压与清洗的爪牙。这些极右翼分子获得武器、经费与政治庇护，在街头与乡村肆意横行。他们口口声声爱国，实际上只是柏林手中的猎犬。"
 KX_PL_PG_ENCOURAGE_GERMAN_IMMIGRANTS:"鼓励德国移民"
 KX_PL_PG_ENCOURAGE_GERMAN_IMMIGRANTS_desc:0"军政府鼓励德国移民涌入波兰城镇与乡村，以改变这片土地的人口结构。移民获得土地、住房与特权，而波兰原住民则被逐步边缘化。人口本身成了帝国统治的工具。"
 KX_PL_PG_SEIZE_POLISH_WEALTH:"摧毁波兰民族认同"
 KX_PL_PG_SEIZE_POLISH_WEALTH_desc:0"德方开始系统性没收波兰人的财产，关闭波兰语学校与文化机构。他们试图从经济与记忆上抹去这个民族，让波兰人连自己的名字都不敢提起。财富被运往柏林，精英被逮捕或流放，波兰认同被当作一种必须消灭的疾病。"
 KX_PL_PG_ENFORCE_GERMANIZE:"强制日耳曼化"
 KX_PL_PG_ENFORCE_GERMANIZE_desc:0"德语被强加为官方语言，波兰的地名、街道与制度被逐一改写。拒绝同化的人失去工作、住房与子女的教育机会。日耳曼化不是文化融合，而是一场缓慢的抹除。"
 KX_PL_PG_END_JEW_THREAT:"终结犹太威胁"
 KX_PL_PG_END_JEW_THREAT_desc:0"极右翼政权把犹太人当作一切问题的替罪羊，发动一场以净化为名的迫害运动。犹太人的商铺被查封，社区被隔离，暴力在法律的纵容下蔓延。这是占领者与本地极端分子共同制造的黑暗篇章。"
 KX_PL_PG_GOOD_ENDING:"波兰人将不复存在！"
 KX_PL_PG_GOOD_ENDING_desc:0"极右翼与德国占领者的最终目标终于显露：波兰民族本身将从地图与历史中被抹去。残留的波兰人被贬为无名的劳工，他们的语言与记忆被彻底禁绝。这个政权口中的圆满结局，对波兰人而言是彻底的终结。"
 KX_PL_PG_JEWISH_SERVICE:"创建犹太秩序服务"
 KX_PL_PG_JEWISH_SERVICE_desc:0"亲德的犹太委员会组建起一支辅助性的秩序服务，协助占领当局维持治安与征收物资。他们被赋予有限的自治权，却也背负起替占领者管理同胞的骂名。生存与屈从之间的界线变得模糊。"
 KX_PL_PG_JEWISH_COMITTEE:"建立犹太委员会"
 KX_PL_PG_JEWISH_COMITTEE_desc:0"占领当局批准成立犹太委员会，作为与犹太人社区沟通的官方机构。委员会负责分配粮食、组织劳役与传达命令，在极端环境中试图为社区争取一线生机。它的权力来自占领者，也因此始终伴随着争议。"
 KX_PL_PG_UTILIZE_RELATIONASHIP:"发动人脉"
 KX_PL_PG_UTILIZE_RELATIONASHIP_desc:0"犹太委员会利用其国际联系与商业网络，为波兰争取物资与外交上的回旋余地。他们游说外国银行、慈善组织与侨民团体，试图减轻占领带来的苦难。人脉成了弱者在强权夹缝中求生的武器。"
 KX_PL_PG_RECOUNCILATE_OTHER_JEW_GROUP:"与其他犹太组织和解"
 KX_PL_PG_RECOUNCILATE_OTHER_JEW_GROUP_desc:0"委员会努力调和不同犹太组织之间的分歧，把世俗派、宗教派与复国主义者团结在同一张谈判桌上。内部分裂只会削弱他们与占领者周旋的能力。和解不是出于温情，而是出于生存的需要。"
 KX_PL_PG_THE_TRIALISM_STATE:"多元国家"
 KX_PL_PG_THE_TRIALISM_STATE_desc:0"占领当局提出一个多元国家的方案，让波兰人、德国人与犹太人各设代表机构，共同管理地方事务。表面上是民族共治，实际上是分而治之，让各群体互相牵制。这个方案为占领者提供了更精致的控制工具。"
 KX_PL_PG_ANTI_RUSSIANISM:"狂热反俄主义"
 KX_PL_PG_ANTI_RUSSIANISM_desc:0"占领当局煽动波兰人的反俄情绪，把德国描绘成唯一能保护波兰免受东方威胁的力量。学校、报纸与教堂都在重复同一套宣传：俄国人才是波兰永恒的敌人。这种恐惧被用来掩盖德国占领的现实。"
 KX_PL_PG_BASED_DEMOCRACY:"反犹反共济会民族主义民主"
 KX_PL_PG_BASED_DEMOCRACY_desc:0"亲德的民族主义政党被扶植起来，以反犹、反共济会与反共的纲领争取群众。他们主张在德国庇护下建立一套民族主义的民主制度，把替罪羊塑造成一切苦难的根源。这种民主从一开始就被占领者驯服。"
 KX_PL_PG_EXPEL_JEWS:"驱逐犹太蛆虫"
 KX_PL_PG_EXPEL_JEWS_desc:0"极右翼政权发动驱逐犹太人的运动，把他们从家园、工作与社区中赶走。暴民与警察共同实施暴行，财产被掠夺，尊严被践踏。这是占领者与本地民族主义者共同制造的罪行。"
 KX_PL_PG_FOR_NATIONAL_UNITY:"为民族团结"
 KX_PL_PG_FOR_NATIONAL_UNITY_desc:0"占领当局号召波兰人放下分歧，在德国的领导下实现民族团结。各派政客被拉进一个没有实权的协商机构，用团结的口号掩盖占领与剥削。真正的团结，反而成了反抗者之间的秘密纽带。"
 KX_PL_PG_MOST_LOYAL_SUBJECT:"最忠诚的傀儡"
 KX_PL_PG_MOST_LOYAL_SUBJECT_desc:0"波兰代表机构彻底沦为占领者的传声筒，其领袖成为柏林眼中最忠诚的傀儡。他们签署法令、发表演说，为德国的统治披上合法的外衣。历史的耻辱柱上，将留下他们的名字。"
 KX_PL_PG_RED_MILLIONAIRE:"红色百万富翁之治"
 KX_PL_PG_RED_MILLIONAIRE_desc:0"一部分德国社会民主党人与工会官僚同军政府达成交易，成为占领经济的管理者。他们自称社会主义者，却替帝国经营工厂、压制工人。红色的旗号掩盖不了他们与资本和刺刀的合作。"
 KX_PL_PG_GERMANY_MOST_SOCIALIST_STATE:"德意志，最接近社会主义之国"
 KX_PL_PG_GERMANY_MOST_SOCIALIST_STATE_desc:0"宣传机器宣称，德国才是真正实现了社会主义的国家，而波兰工人应当为此感到荣幸。国家、企业与工会被描绘成和谐的整体，阶级冲突被宣布为已经消失。这套说辞掩盖了占领下的剥削与压迫。"
 KX_PL_PG_SUPPORT_SPD:"社民党投桃报李"
 KX_PL_PG_SUPPORT_SPD_desc:0"德国社民党从占领体制中获得职位与利益，自然愿意为军政府站台。他们在波兰扶植亲德的工会与政党，用改良主义的语言安抚工人。投桃报李之间，社会主义的理想被换成了官位与合同。"
 KX_PL_PG_GERMANY_SOCIALISTS_ONE_ENEMY:"德国军人，革命左翼，同一目标"
 KX_PL_PG_GERMANY_SOCIALISTS_ONE_ENEMY_desc:0"德国军官与革命的左翼被宣传成并肩对抗共同敌人的伙伴。军政府需要左翼的群众基础，左翼则需要军政府的保护，这种交易被包装成民族团结。昔日的敌人如今在同一张桌子上分赃。"
 KX_PL_PG_UNION_DEMOCRACY:"工会民主与永恒革命"
 KX_PL_PG_UNION_DEMOCRACY_desc:0"亲德的工会被赋予管理工厂的名义权力，声称要在占领体制内实现工会民主。真正的决策权仍掌握在德国经理与军官手中，工会只是缓冲不满的阀门。永恒革命的口号，成了一场精心编排的表演。"
 KX_PL_PG_ECONOMIC_POLITICAL_CONTROLLER:"经济与政治的操盘手"
 KX_PL_PG_ECONOMIC_POLITICAL_CONTROLLER_desc:0"少数德国与波兰的技术官僚同时掌控经济计划与政治机器，成为占领体制真正的操盘手。他们不穿军装，却比将军更有权力，用报表与配额决定千万人的命运。这是技术官僚与占领者共谋的统治。"
 KX_PL_PG_LAND_OF_IG_FARBEN:"IG法本的领地"
 KX_PL_PG_LAND_OF_IG_FARBEN_desc:0"IG法本等德国化工巨头在波兰获得大片土地与特权，把这里变成原料产地与试验场。公司的私兵与政府的警察共同维持秩序，企业的利益就是法律。波兰的天空与河流，从此归股东所有。"
 KX_PL_PG_NO_WORKING_LIMIT:"工作时长无上限"
 KX_PL_PG_NO_WORKING_LIMIT_desc:0"德方废除了所有劳动保护法规，波兰工人被要求以最长的时间、最低的工资为帝国生产。罢工被定为叛国，疲惫与事故成为日常。人的身体被当作可以无限榨取的机器。"
 KX_PL_PG_EXPAND_RUBBER_OIL_INDUSTRY:"发展橡胶石油产业"
 KX_PL_PG_EXPAND_RUBBER_OIL_INDUSTRY_desc:0"占领当局强迫波兰农民改种橡胶与油料作物，以满足德国工业的胃口。良田被改成种植园，粮食供应因此更加紧张。经济的畸形发展，换来的是帝国的原料安全。"
 KX_PL_PG_MERCILESS_INDUSTRIALIZE:"无情工业化"
 KX_PL_PG_MERCILESS_INDUSTRIALIZE_desc:0"在效率的名义下，波兰被强行改造成德国的工业附庸，重工业与军工厂在各地拔地而起。建设速度以人的生命为代价，城市与乡村都被卷入机器的轰鸣。这是一场没有温情的工业化。"
 KX_PL_PG_WORKER_CAMP:"劳工营之国"
 KX_PL_PG_WORKER_CAMP_desc:0"军政府建立起一座座劳工营，把失业者、抵抗者与不受欢迎的人关押其中，强迫他们为德国企业劳动。饥饿、疾病与过度劳累夺走了无数生命，而营地的账本上只记录产量。这是现代奴隶制的缩影。"
 KX_PL_PG_TOXIC_WAR:"建设毒气工厂"
 KX_PL_PG_TOXIC_WAR_desc:0"德国化工企业在波兰建设毒气与化学武器工厂，把这片土地变成战争机器的实验场。当地居民在不知情中暴露于有毒物质，土地与水源被永久污染。企业的利润与帝国的杀人工厂在此合流。"
