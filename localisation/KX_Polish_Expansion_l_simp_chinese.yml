POL_zjkp_party_long:0 "波兰王国团结联盟\n§LZwiązek Jedności Królestwa Polskiego§!"
POL_zjkp_party:0 "莫尔日阵线"
plxv2.140.t:0 "独裁之罪"
plxv2.140.d:0 "随着西科尔斯基首相任期过半，一些声音呼吁他主动卸任以示诚意。其潜在继任者是亚历克西·奇维亚科夫斯基，此人与君主主义及人民运动皆有联系。当然，西科尔斯基有权依法完成任期，但或许此刻正是移交权力、兑现民主承诺的良机——即便军队仍将监督这一进程。"
plxv2.140.a:0 "西科尔斯基将继续执政"
plxv2.140.b:0 "奇维亚科夫斯基将接任执政"
plxv2.142.t:0 "神职人员席位问题"
plxv2.142.d:0 "自波兰王国建立以来，议会中一直为教会代表保留着特定席位。如今许多人——连同卢博米尔斯基——提议废除这些席位，转而由土地所有者选举产生。但这引起了波兰首席大主教奥古斯特·赫隆德的强烈反对。为此，赫隆德要求解除卢博米尔斯基在皇家议会中的首席职务。\n客观而言，世俗代表在此事上占据上风，但或许与教会对抗并非明智之举，这可能会从内部进一步削弱皇家议会的力量..."
plxv2.142.a:0 "废除固定席位制"
plxv2.142.b:0 "双方达成妥协，雅纽什上台"
plxv2.142.c:0 "卢博米尔斯基辞职，赫隆德上台"
