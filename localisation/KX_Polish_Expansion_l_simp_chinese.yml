sanation.1.t:0 "元帅的遗产，抑或同袍的歧路"
sanation.1.d:0 "当独立的硝烟终于从维斯瓦河两岸散去，瓦莱雷·斯瓦韦克与他的军团老兵们不仅终结了摄政王国的苟延残喘，更向全世界宣告了波兰的真正新生。在这场浴血奋战中，波兰军团联盟（Z是当之无愧的脊梁。那些曾追随约瑟夫·毕苏斯基元帅出生入死的军团主义者们，凭借共同的战壕记忆与萨纳齐亚的宏愿凝聚在一起。然而，正如元帅生前曾忧虑的那样——胜利往往是同盟瓦解的开始。当共同的死敌倒下，“萨纳齐亚”这一宽泛的旗号便再也无法掩盖军团内部截然不同的政治底色。\n\n裂痕首先在核心圈层中蔓延。以斯瓦韦克本人为首的上校团正统派依然死守着波兰军团联盟的招牌，主张通过精英威权与新宪法来贯彻元帅的遗志；但军界宿将卢恰恩·热利戈夫斯基却对文官政治嗤之以鼻，他另立泛斯拉夫民族主义者联盟，将军方的强硬意志凌驾于一切之上。与此同时，军团内的左翼老兵们拒绝向保守派妥协：雷蒙德·雅沃洛夫斯基重新擦亮了波兰社会党的旗帜，试图在爱国主义与劳工权益间重拾平衡；米科瓦伊·克瓦希涅夫斯基的民主党汇聚了自由派知识分子；而在更激进的街头与工厂里，路德维克·瓦什凯维奇的国民工党与耶日·苏里格的中央阶级工会联盟正将萨纳齐亚推向工团与激进社会主义的边缘。\n\n而在政治光谱的另一端，右翼的演变同样令人心惊。为了稳住局势，萨纳齐亚曾与雅纽什·拉齐维乌亲王的民族右翼党等老牌贵族保守势力达成妥协，阿道夫·博申斯基的超级大国联盟也在鼓吹着帝国式的自由扩张主义。但真正危险的暗流来自年轻一代：扬·兹季托维茨基领导的青年民族主义者联盟正试图将萨纳齐亚嫁接到极端的国家民粹主义之上。\n\n昔日铁板一块的军团如今已化作萨纳齐亚左派与萨纳齐亚右派角斗的竞技场。而在华沙的议会走廊之外，不甘寂寞的将军们正在擦拭佩剑，乡野间的农民营正聚集起愤怒的火把，狂热的民族主义者也在暗中串联。斯瓦韦克赢下了独立战争，但保卫波兰灵魂的战争，现在才刚刚打响。"
sanation.1.a:0 "唯有时间能证明谁才是元帅真正的继承人。"
sanation.2.t:0 "重返红色电车"
sanation.2.d:0 "经过数月惊心动魄的政坛博弈、街头动员与议会交锋，军团内部的路线之争终于尘埃落定。在瓦莱雷·斯瓦韦克的铁腕运筹下，萨纳齐亚左派彻底击败了萨纳齐亚右派，将保守寡头、强硬派军头与极端民族主义者一举逐出了华沙的权力核心。曾经有人讥讽约瑟夫·毕苏斯基元帅在名为“独立”的站点下错了社会主义这辆红色电车，但今天，身为元帅最忠诚门徒的斯瓦韦克向全波兰宣告：只要车轮仍在向前滚滚驶去，国家独立与社会正义就绝不相互排斥。\n\n拉齐维乌亲王的保守派门客们已黯然退场，狂热的青年民族主义者也失去了在政府中呼风唤雨的筹码。斯瓦韦克依靠波兰军团联盟中的左翼老兵、工会组织与进步知识分子稳住了阵脚，正式建立起一个以萨纳齐亚左派为主导的波兰共和国。在他的蓝图中，军团的铁血纪律将与大刀阔斧的社会改革相结合，从而自上而下地完成对国家的改造。困扰新政权许久的内耗似乎已经画上句号，但那些帮他赢下这场斗争的左翼盟友们，真的甘心永远屈居于斯瓦韦克的家长式威权之下吗？"
sanation.2.a:0 "斯瓦韦克与萨纳齐亚左派笑到了最后。"
sanation.3.t:0 "不谐的同路人"
sanation.3.d:0 "萨纳齐亚右派的覆灭并未给华沙带来持久的安宁。瓦莱雷·斯瓦韦克很快便绝望地发现，他所倚仗的萨纳齐亚左派根本不是一个统一的整体，而是一群各怀鬼胎的松散同盟。当右翼的威胁烟消云散，左翼各派系对斯瓦韦克那种充满精英色彩的上校团的家长式作风便再也无法容忍。从工会罢工、议会逼宫到内阁瘫痪，反对的浪潮一浪高过一浪，最终将这位独立战争的功臣彻底赶下了权力宝座。\n\n随着斯瓦韦克的垮台，波兰军团联盟对政局的垄断宣告瓦解，三股截然不同的左翼力量随即走到了舞台中央，争夺新共和国的掌舵权：最激进的当属城乡无产阶级联盟，他们汇聚了极权工团派与前共产党人，渴望对国家进行最彻底的革命重塑；以雷蒙德·雅沃洛夫斯基为首的波兰社会党则代表着老牌军团左翼的正统，主张用铁腕手段推行威权社会民主主义；而路德维克·瓦什凯维奇的国民工党则高举基督教社会主义的旗帜，在天主教信仰与劳工解放的号召下动员起了庞大的工人大军。究竟谁能在这场权力的洗牌中脱颖而出？"
sanation.3.a:0 "城乡无产阶级联盟将掀起真正的革命风暴！"
sanation.3.b:0 "雷蒙德·雅沃洛夫斯基与前革命派才是正统！"
sanation.3.c:0 "路德维克·瓦什凯维奇与国民工党将代表波兰劳工！"
sanation.4.t:0 "城乡无产阶级联盟代表大会"
sanation.4.d:0 "城乡无产阶级联盟虽然成功在华沙夺取了最高政权，但这个当初为了在合法框架下开展革命活动而组建的政治同盟，其内部同样存在着两条截然不同的路线分歧。为了确立新政权的最高领导层与未来的施政纲领，来自全国各地的工厂委员会代表、农会骨干与党内理论家齐聚华沙，召开了决定国家命运的全代会。\n\n会场上的交锋在两大阵营之间展开。一方是以约瑟夫·穆岑马赫为首的极权主义派系，这群脱胎于革命军团与激进工会的强硬派崇尚“黄色工团主义”，主张用国家与工会高度一体化的铁血纪律来统合全社会，粉碎一切阶级敌人；另一方则是以老资格社会主义活动家玛利亚·科苏茨卡为首的激进社会主义派系，她与瓦迪斯瓦夫·哥穆尔卡等同志深受布哈林主义启发，主张真正贴近城乡无产大众的切身诉求，通过工农联盟与渐进合作的社会主义经济建设来稳固新生的政权。随着激烈的辩论进入尾声，代表们举起了手中的表决票……"
sanation.4.a:0 "约瑟夫·穆岑马赫的铁腕工团路线获胜！"
sanation.4.b:0 "玛利亚·科苏茨卡的工农联盟路线胜出！"
sanation.5.t:0 "中央阶级工会联盟的路线交锋"
sanation.5.d:0 "随着中央阶级工会联盟在华沙站稳脚跟，这个由萨纳齐亚左翼扶植起来的庞大劳工组织内部也迎来了决定最高领导权的关键时刻。在国家与工会的权力边界问题上，联盟内部逐渐分化为两条截然不同的工团主义路线，双方代表在华沙的总工会大厦内展开了激烈的争锋。\n\n一方是以军团元老、前总理延德热伊·莫拉切夫斯基为首的极权主义派系。这位老资格的毕苏斯基追随者深受索雷尔主义启发，主张将狂热的民族复兴神话与革命工团的铁血纪律熔于一炉，通过极具战斗性的国家工团体系彻底粉碎旧社会的软弱与分裂；另一方则是以著名工团理论家耶日·苏里格为首的正统工团派，作为法兰西公社集权工团主义模式的推崇者，他呼吁将国家行政大权全面移交给技术官僚与高度组织化的产业工会，打造一个高效、理性的劳工共和国。在这场关乎波兰工团运动灵魂的博弈中，天平将向何方倾斜？"
sanation.5.a:0 "延德热伊·莫拉切夫斯基的索雷尔主义路线将指引我们！"
sanation.5.b:0 "耶日·苏里格与集权工团派才是工会的未来！"
sanation.6.t:0 "刺刀与工团的抉择"
sanation.6.d:0 "博莱斯瓦夫·德乌戈绍夫斯基将军用一场干脆利落的军事政变，终结了萨纳齐亚左派无休止的内耗，并在华沙建立起了以爱国联盟“格伦瓦尔德”为核心的红色军政府。然而，将军的骑兵军刀虽然能轻易接管贝尔维德尔宫，却无法独自运转全国的工厂、铁路与矿山。很快，原本支持政变以彻底粉碎旧官僚体系的激进工会力量，便向军政府提出了分享乃至移交最高权力的要求。\n\n如今，新政权站在了十字路口：以老牌军团左翼领袖延德热伊·莫拉切夫斯基为首的“中央阶级工会联盟”正集结起全国劳工的力量，要求军方退居幕后，将政权移交给索雷尔主义者与工团大会，实现真正的工会治国；而德乌戈绍夫斯基将军的军官团与格伦瓦尔德派系则坚信，面对内忧外患的局势，唯有保持军队的绝对统治、将全国置于红色军政府的战时纪律之下，波兰才能迎来真正的复兴。究竟是由工会接过权柄，还是让将军继续握紧缰绳？"
sanation.6.a:0 "将大权移交给延德热伊·莫拉切夫斯基与中央阶级工会联盟！"
sanation.6.b:0 "博莱斯瓦夫·德乌戈绍夫斯基将军与红色军政府绝不退让！"
sanation.7.t:0 "格伦瓦尔德的赤色军刀"
sanation.7.d:0 "瓦莱雷·斯瓦韦克原本以为，自己能够凭借在军团中的崇高威望，在萨纳齐亚左派各股力量之间游刃有余地维持家长式的个人权威。然而，他显然低估了左翼阵营内部空前高涨的革命热情与凝聚力。当斯瓦韦克拘泥于陈旧的官僚作风、试图对激进的社会改革踩下刹车时，空前团结的萨纳齐亚左派一致决定不再容忍这位迟疑不决的掌舵人。\n\n在左翼阵营与少壮派军官团的共同推举下，曾为约瑟夫·毕苏斯基元帅最宠爱的骑兵爱将、传奇军团将领博莱斯瓦夫·德乌戈绍夫斯基挺身而出，顺理成章地从孤立无援的斯瓦韦克手中接过了最高权力。这是一场毫无悬念的权力交接，整个萨纳齐亚左派都紧密地团结在了这位充满魅力的骑兵将军周围。\n\n为了彻底贯彻激进的民族与社会革命纲领，新政权正式组建了受军方与左翼先锋共同统辖的爱国联盟“格伦瓦尔德”。在这面融合了炽热爱国主义与激进社会主义的旗帜下，一个充满浪漫尚武精神与铁血纪律的“红色军政府”正式诞生。波兰将在赤色军刀的号令下，团结一致地大步向前。"
sanation.7.a:0 "为了元帅，为了革命，德乌戈绍夫斯基将军万岁！"
sanation.8.t:0 "远东的旭日与白鹰"
sanation.8.d:0 "自1904年日俄战争期间约瑟夫·毕苏斯基元帅亲赴东京寻求合作以来，萨纳齐亚的核心圈层便始终对大日本帝国怀有一份特殊而深厚的战略好感。在波兰军团的老兵们眼中，日本不仅是曾在东方重创俄国宿敌的天然盟友，其崇尚尚武精神与国家意志的崛起之路更令上校团的精英们钦佩不已。如今，执掌华沙外交大权的约瑟夫·贝克总理正审视着世界局势的剧变，一份大胆至极的地缘战略构想被摆上了贝尔维德尔宫的案头。\n\n面对柏林与莫斯科随时可能再度合拢的铁钳，传统的欧洲均势外交似乎已难以保障波兰的长久安全。在秘密会晤了日本驻华沙公使与陆军武官后，贝克总理确认东京方面愿意向波兰敞开“大东亚共荣圈”的大门，将同盟的触角一直延伸到维斯瓦河畔。支持者认为，与远东的旭日帝国正式结盟，将彻底打破波兰在欧陆的孤立处境，与东京形成东西夹击欧亚大陆强权的战略支点；但谨慎的外交官们也警告称，为一个远在地球另一端的盟友卷入太平洋与亚洲的纷争无异于引火烧身，毕苏斯基元帅留下的“等距离外交”准则绝不应被轻易抛弃。贝克上校会迈出这惊世骇俗的一步吗？"
sanation.8.a:0 "太冒险了，波兰应当继续保持外交独立。"
sanation.8.b:0 "白鹰与旭日同辉，向东京递交结盟条约！"
sanation.9.t:0 "来自华沙的最后通牒"
sanation.9.d:0 "今天清晨，波兰驻外使节带着一份措辞极其严厉的外交照会闯入了我们的外交部，并将其直接拍在了桌案上。自波兰在独立战争中获胜并由萨纳齐亚右派掌权以来，我们这位南方邻国便从未掩饰过其恢复昔日联邦疆域的野心。如今，在约瑟夫·贝克的亲自操盘下，华沙方面终于彻底撕下了外交辞令的伪装，向我们发出了赤裸裸的最后通牒。\n\n在这份照会中，贝克政府不仅要求我们立即取缔国内一切被其视为“反波兰”的政治团体、全面解除边境管控，更荒谬地搬出了数百年前的卢布林联合传统，要求立陶宛彻底放弃独立的主权与外交，将国家防务与行政管辖权完全移交给华沙，与波兰重新“合二为一”。\n\n边境哨所传来的急电已经证实了最坏的消息：数个整编的波兰陆军师已在界河对岸集结完毕，炮口正对准我们的国土，只待最后期限一过便会大举进犯。留给政府内阁抉择的时间已经所剩无几——我们究竟是该为了保全生灵而咽下这枚屈辱的苦果、任由国家并入波兰，还是赌上全民族的尊严与鲜血，在波兰军团的刺刀面前奋起抵抗？"
sanation.9.a:0 "我们别无选择，只能向华沙低头……"
sanation.9.b:0 "立陶宛绝不屈服！准备迎战！"
sanation.10.t:0 "贝克上校的幕后棋局"
sanation.10.d:0 "在国务院会议的暗箱交锋中，最终笑到最后的并非声名显赫的宿将或贵族名流，而是约瑟夫·毕苏斯基元帅生前最器重的外交心腹——约瑟夫·贝克上校。凭借老辣的纵横捭阖与深不可测的政治手腕，贝克成功将莫希奇茨基、马图谢夫斯基与斯克瓦德科夫斯基等上校团实力派尽数整合进自己的内阁班底，自己则稳坐政府总理之位，将共和国的实际行政与外交大权牢牢攥在掌心。\n\n然而，精于权术的贝克深知自己缺乏足以号令全波兰的个人威望，为了彻底稳固萨纳齐亚右派的统治，他需要推举一位台前领袖，并为新政权确立最终的意识形态底色。摆在贝克面前的有两条截然不同的道路：其一是借重军团名将古斯塔夫·奥尔利茨-德雷泽的军界威望，改组波兰军团联盟，建立一个崇尚铁血效率、殖民扩张与海权雄心的威权军政府；其二则是启用毕苏斯基元帅生前的密友、神秘主义哲学家米耶齐斯瓦夫·基纽什及其创立的国家意识中心，将军团内部风靡一时的神智学与浪漫弥赛亚精神推上神坛，从灵魂深处重塑波兰的国民意识。作为华沙真正的操盘手，贝克总理将把筹码押向何方？"
sanation.10.a:0 "枪杆子最可靠，请奥尔利茨-德雷泽将军出山！"
sanation.10.b:0 "唯有神智学的灵性觉醒能救波兰，支持米耶齐斯瓦夫·基纽什！"
sanation.11.t:0 "华沙上空的铁腕秩序"
sanation.11.d:0 "经过数月惊心动魄的政坛博弈与幕后角力，军团内部的路线之争终于尘埃落定——萨纳齐亚右派在这场权力的拔河中取得了决定性的胜利。那些整日高呼阶级斗争、企图将波兰引向社会主义激进实验的萨纳齐亚左派政客与赤色工会骨干已被尽数清洗出核心圈层；瓦莱雷·斯瓦韦克向劳工势力妥协的模糊路线也随之破产。在毕苏斯基元帅的老友、德高望重的学者伊格纳西·莫希奇茨基的出面主持下，一个主张秩序、权威与国家利益至上的临时政府正式接管了华沙的最高权柄。\n\n在萨纳齐亚右派看来，新生的波兰需要的不是分裂国家的左翼狂热，而是强有力的政府、稳固的社会等级以及与传统精英的精诚合作。然而，左翼共同敌人的出局并不意味着右翼内部已经铁板一块：莫希奇茨基的“城堡派”技术官僚、波兰军团联盟里的强硬派军头、拉齐维乌亲王的保守派贵族门客，乃至狂热的青年民族主义者与帝国扩张论者，都在觑觎着最高权力的宝座。为了打破临时政府的过渡僵局并确立共和国未来的真正掌舵人，一场汇聚右翼各派领袖的国务院会议即将召开。"
sanation.11.a:0 "秩序已然恢复，静待国务院会议的最终裁决。"
sanation.12.t:0 "城堡的主人"
sanation.12.d:0 "当国务院会议的沉重大门在华沙缓缓开启时，许多强硬派军头与野心勃勃的右翼政客都以为，年迈的化学家伊格纳齐·莫希奇茨基不过是一个随时可以被请下台的过渡吉祥物。然而，这位毕苏斯基元帅生前的挚友却在会议桌上展现出了令人叹服的政治手腕。借助右翼各派之间相互掣肘的矛盾，莫希奇茨基将温和派军官、文官集团与工商界代表紧密团结在自己的“城堡派”周围，成功挫败了极端派系夺权的企图，将临时政府的头衔彻底转化为稳固的最高领导权。\n\n随着莫希奇茨基正式掌舵，萨纳齐亚右派开启了以技术官僚治国为核心的新阶段。经济奇才尤金纽什·克维亚特科夫斯基与财政干将伊格纳齐·马图谢夫斯基走马上任，准备用宏大的国家工业化四年计划来重塑波兰的经济命脉；而作风雷厉风行的老兵费利齐安·斯瓦沃伊·斯克瓦德科夫斯基则接管了内政与行政大权，以铁腕纪律整顿全国的官僚机器。党派恶斗的喧嚣终于散去，在皇家城堡的威严注视下，一个讲究效率、权威与国家现代化的萨纳齐亚政权正全速运转。"
sanation.12.a:0 "专家治国，秩序至上，莫希奇茨基总统万岁！"
sanation.13.t:0 "救国政府的黎明"
sanation.13.d:0 "事实证明，萨纳齐亚右派所吹嘘的铁腕秩序不过是一座建立在流沙之上的纸牌屋。当莫希奇茨基的技术官僚、狂热的少壮派军头与保守贵族在国务院会议上为了分赃争吵不休时，整个国家的行政机器已然濒临瘫痪。面对愈演愈烈的宪政危机，前军团第一旅元老、曾于1919年发动过未遂政变的马里安·亚努沙伊蒂斯-泽戈塔将军终于忍无可忍。在民主派政客与温和保守派名流的秘密支持下，泽戈塔率领效忠于他的部队连夜接管了华沙的各大要害部门，兵不血刃地终结了萨纳齐亚右派的闹剧。\n\n然而，与那些迷恋权力的独裁者不同，泽戈塔将军在贝尔维德尔宫发表的全国广播讲话中明确表示，他所组建的救国政府绝非为了开启另一段军事独裁，而是为了彻底清算军团内部无休止的宗派内斗，将政权交还给全体波兰公民。随着激进色彩浓厚的“波兰农工共和国”国号被正式废除，“波兰共和国”庄严回归；欧斯塔黑·萨皮耶哈与耶日·兹杰乔夫斯基等稳健派政治家也受邀入阁，协助筹备即将到来的第一次真正自由、公正的全国大选。"
sanation.13.a:0 "军人干政只是权宜之计，民主的微光已然浮现。"
sanation.14.t:0 "元帅的继承人"
sanation.14.d:0 "随着国务院会议在漫长的唇枪舌剑中落下帷幕，萨纳齐亚右派内部的权力角逐终于尘埃落定。最终笑到最后的，既不是莫希奇茨基身边那些夸夸其谈的文官与技术官僚，也不是约瑟夫·贝克手下那些眼高于顶的外交阴谋家，而是波兰武装力量的最高统帅——爱德华·雷兹-希米格维。\n\n作为毕苏斯基元帅生前最器重的军事将领之一，雷兹-希米格维在独立战争的血火中早已赢得了全军上下的绝对效忠。在会议的关键时刻，军方代表们毫不掩饰地展现了枪杆子的分量，迫使各派政客不得不向这位身披将星的铁腕人物低头。如今，雷兹-希米格维正式接过了波兰军团联盟与国家的最高大权，将波兰彻底置于军事独裁政权的统治之下。\n\n为了高效运转这台庞大的国家机器，新统帅迅速组建了一支兼具铁腕与专业能力的内阁班底：经验丰富的财政专家瓦迪斯瓦夫·格拉布斯基与伊格纳齐·马图谢夫斯基将负责整顿国家经济、为扩军备战提供资金保障；而以铁腕作风著称的费利齐安·斯瓦沃伊·斯克瓦德科夫斯基则将执掌内政，用军营般的纪律清扫国内的一切不稳定因素。在雷兹-希米格维的军刀指引下，一个纪律严明、整装待发的波兰正昂首迈向新的时代。"
sanation.14.a:0 "向统帅致敬！波兰属于军团！"
sanation.15.t:0 "老将军的接管"
sanation.15.d:0 "爱德华·雷兹-希米格维曾试图将自己塑造成凌驾于整个萨纳齐亚右派之上的新奥古斯都，但他显然低估了右翼阵营内部空前紧密的凝聚力。当这位野心勃勃的统帅试图进一步削弱盟友的权力、建立纯粹的个人独裁时，整个右翼联盟以前所未有的团结姿态向他发起了反击。在军界元老与实权内阁部长的联合施压下，雷兹-希米格维发现自己瞬间陷入了孤立无援的境地，最终不得不体面地交出最高权力。\n\n为了确保政权平稳过渡并维持右翼阵营的团结，德高望重的军界元老卢恰恩·热利戈夫斯基率领泛斯拉夫民族主义者联盟顺势接管了国家大权。作为一名深受斯拉夫民族神秘主义影响的老兵，热利戈夫斯基坚信波兰肩负着团结并领导全体斯拉夫民族的神圣使命。\n\n与此同时，原本在政府中担任要职的瓦迪斯瓦夫·格拉布斯基、伊格纳齐·马图谢夫斯基以及费利齐安·斯瓦沃伊·斯克瓦德科夫斯基等实力派人物也悉数留任，继续维持着国家机器的高效运转。随着雷兹-希米格维时代的结束，新的执政团队已然就位，准备为波兰指明下一步的方向。"
sanation.15.a:0 "热利戈夫斯基将军将带领我们迈向新的纪元！"
sanation.16.t:0 "白鹰的未来蓝图"
sanation.16.d:0 "随着雷兹-希米格维的下台与政局的重新洗牌，掌控了华沙政权的右翼精英们开始围绕国家的根本定位与未来走向展开最后的抉择。在最高决策层内部，两种截然不同的大国构想正在激烈碰撞：\n\n作为当前政权的掌舵人，卢恰恩·热利戈夫斯基与泛斯拉夫民族主义者联盟力主将他们的泛斯拉夫宏愿彻底贯彻到底。在老将军看来，波兰绝不能仅仅局限于传统的民族国家框架之内，而应当正式改国号为波兰斯拉夫共和国，唤醒流淌在民族血脉中的古老神秘力量，扛起团结全体斯拉夫兄弟的伟大旗帜。\n\n然而，以年轻的政治理论家阿道夫·博申斯基为首的超级大国联盟则提出了更为务实且极具野心的替代方案。这群信奉自由市场资本主义与冷酷现实主义的帝国主义者对空泛的斯拉夫浪漫主义不屑一顾，他们主张由超级大国联盟接掌政权，通过激进的市场化经济改革与对外扩张，将波兰打造成一个真正意义上的现代欧洲超级大国。如今，是时候决定波兰究竟要走哪一条道路了。"
sanation.16.a:0 "支持热利戈夫斯基将军，斯拉夫共和国万岁！"
sanation.16.b:0 "让博申斯基与超级大国联盟接手，开启波兰的帝国时代！"
sanation.17.t:0 "新奥古斯都的陨落"
sanation.17.d:0 "爱德华·雷兹-希米格维曾以为，单凭军团的刺刀与毕苏斯基继承人的光环，便足以压服萨纳齐亚右派内部盘根错节的派系暗流。然而，这位自诩为新奥古斯都的铁腕统帅终究高估了执政联盟的稳固程度。他独断专行的军人作风与对各派政治势力的粗暴打压，很快便引发了全面的反弹。在一场突如其来的政治危机中，雷兹-希米格维引以为傲的军事独裁政权分崩离析，他本人也被迫黯然下台。\n\n随着军政府垮台留下的巨大权力真空，三个彼此独立、纲领迥异的党派迅速走上台前，展开了对华沙最高权力的角逐：在激进的左翼民族主义阵营中，由布罗尼斯瓦夫·皮耶拉茨基领导的民族革命阵营异军突起，他在博莱斯瓦夫·皮亚塞茨基等人的协助下联合了激进社会主义力量，主张以“红色民族激进主义”彻底重塑国家；在狂热的右翼民粹一侧，卡罗尔·温季亚戈尔斯基率领的波兰人民共和党声势浩大，他们推崇俄国式的萨文科夫主义，誓言建立一个铁血的民族共和国；而在两大激进势力之外，以雅纽什·拉齐维乌亲王为首的民族右翼党则汇聚了传统贵族、地主与稳健保守派的力量，主张通过温和威权主义来恢复国家的传统秩序与稳定。旧的独裁者已经离场，波兰的未来将交由哪一个党派来主宰？"
sanation.17.a:0 "皮耶拉茨基与民族革命阵营将掀起赤色民族风暴！"
sanation.17.b:0 "温季亚戈尔斯基与波兰人民共和党将锻造民族共和国！"
sanation.17.c:0 "拉齐维乌亲王与民族右翼党将重建稳健的保守秩序！"
sanation.18.t:0 "波兰人民共和党的领导权之争"
sanation.18.d:0 "随着波兰人民共和党在权力角逐中胜出并将国家正式定名为“波兰民族共和国”，一场关于新政权核心统治方针与最高领导权的党内博弈也随即拉开帷幕。尽管全党上下都致力于以铁腕手段重塑波兰民族的灵魂，但在具体的国家建设蓝图上，党内两位核心人物却有着截然不同的主张。\n\n作为带领党派夺取政权的领军人物，卡罗尔·温季亚戈尔斯基深受鲍里斯·萨文科夫思想的影响。他主张继续沿着萨文科夫主义的道路前进，依靠退伍老兵、农民运动与狂热的群众动员，构建一个充满战斗精神与绝对执行力的铁血民粹政权。与此同时，党内另一位实权派人物斯特凡·维特科夫斯基则向最高领导权发起了挑战。这位狂热的地下组织与情报网络头目认为，单纯的群众狂热并不足以保障政权的稳固；他主张由自己接管大权，将波兰彻底打造成一个冷酷、严密的“民族安保国家”，依靠无孔不入的特务机构与警察网络来维持国家的绝对秩序与安全。如今，波兰人民共和党必须在两位领袖的路线之间做出抉择。"
sanation.18.a:0 "继续支持温季亚戈尔斯基，贯彻萨文科夫主义路线！"
sanation.18.b:0 "让维特科夫斯基接掌大权，建立民族安保国家！"
sanation.19.t:0 "斯拉夫共同体的终极形态"
sanation.19.d:0 "在卢恰恩·热利戈夫斯基将军的率领下，泛斯拉夫民族主义者联盟不仅彻底肃清了旧官僚体制的积弊，更将斯拉夫民族神秘主义与强权政治深深植根于波兰斯拉夫共和国的每一寸土地。随着各项国家改造与整合政策步入尾声，这位饱经风霜的老将军在凝视着东欧广袤的版图时，开始思考斯拉夫民族复兴事业的终极走向。\n\n在将军身边，一部分较为温和的幕僚与旧萨纳齐亚技术官僚认为，现有的威权政体已经足以保障国家的稳定与扩张，无需再对社会结构进行更为激烈的重构；然而，泛斯拉夫民族主义者联盟内部更为激进的理论家们却向热利戈夫斯基进言，声称古老的斯拉夫公社传统与社会主义本就同源同宗。在他们看来，要想彻底斩断西方资本主义与个人主义对斯拉夫灵魂的腐蚀，将军就必须迈出最后、也是最激进的一步——将泛斯拉夫民族主义与社会主义彻底熔铸为一炉，建立一个万物归公、绝对服从的斯拉夫总体国家。"
sanation.19.a:0 "现有的威权秩序已足以庇护斯拉夫人民。"
sanation.19.b:0 "唯有彻底的红色泛斯拉夫才能实现终极复兴！"
sanation.20.t:0 "军事救国委员会夺权"
sanation.20.d:0 "当萨纳齐亚的政客们在无休止的左右翼倾轧中将国家推向瘫痪边缘时，军方反对派的耐心终于消耗殆尽。随着军方权威在幕后不断膨胀，曾因反对毕苏斯基派系而遭到排挤的米哈乌·罗拉-日梅尔斯基将军决定亲自出面终结这场政治闹剧。在黎明前的夜色掩护下，效忠于他的驻军部队与装甲纵队迅速开进华沙，兵不血刃地接管了总参谋部、电报局、广播电台以及各大政府部委。\n\n清晨时分，华沙电台中断了常规广播，向全国宣读了军方接管政权的紧急公报。波兰军团联盟的官僚体系被彻底解散，正在内斗的萨纳齐亚左翼与右翼头目要么在睡梦中被宪兵逮捕，要么仓皇逃往外省。为了填补权力真空并彻底整顿国家秩序，米哈乌·罗拉-日梅尔斯基宣布成立军事救国委员会，将全国置于军事独裁政权的直接管辖之下。无论这位新掌权者未来会带领波兰倒向赤色阵营还是彻底清洗左翼，萨纳齐亚的时代都已经在刺刀的寒光中画上了句号。"
sanation.20.a:0 "军队接管了一切！"
sanation.21.t:0 "农民营进军华沙"
sanation.21.d:0 "当萨纳齐亚的官僚与政客们还在首都的厅堂内争权夺利时，长期遭受忽视与盘剥的波兰乡村终于彻底爆发了。随着农民营的威望与组织力在各地达到顶峰，成千上万手持步枪、猎枪与草叉的农民武装从四面八方汇聚成不可阻挡的绿色洪流，切断了通往华沙的所有铁路与干道。面对浩浩荡荡的农民大军，早已因内斗而士气涣散的政府军与警察部队纷纷放弃抵抗，甚至倒戈相向。\n\n在总司令弗朗西谢克·卡明斯基的率领下，农民营的武装纵队昂首阔步地开进了华沙市中心，彻底接管了议会大厦与各大政府部委。腐朽的萨纳齐亚官僚体系在一夜之间土崩瓦解，爱德华·雷兹-希米格维等旧军团高层被尽数解除兵权、剥夺元帅头衔。卡明斯基随即在欢呼的农民代表面前宣布废除旧有的波兰农工共和国体制，正式建立波兰农民共和国。然而，在这场翻天覆地的绿色革命取得胜利之后，农民营内部不同派系的领袖们对于新国家的未来走向也有着各自不同的蓝图。"
sanation.21.a:0 "波兰属于耕种它土地的人！"
sanation.22.t:0 "农民共和国的领路人"
sanation.22.d:0 "随着旧萨纳齐亚政权的残余势力被悉数肃清，作为执政力量的农民营在华沙召开了首次全国最高代表大会，以决定波兰农民共和国的最高领导权与政治航向。尽管所有代表都高举着农业主义的旗帜，但这场席卷全国的农民运动本就是由立场迥异的各路派系汇聚而成的联盟，如今三个主要派别都推出了各自的领袖人选。\n\n总司令弗朗西谢克·卡明斯基主张延续温和而稳健的路线，倡导在尊重乡村传统与社会自由的基础上推进合作社经济与渐进式土地改革；原军团将领出身、因彻底反抗毕苏斯基独裁而投身激进农民运动的博莱斯瓦夫·罗亚，则极力推崇激进的农业社会主义，要求以铁腕手段彻底粉碎地主与资本家的剥削，建立高度集权的红色农夫政权；而以强悍冷酷著称的游击队指挥官“烈火”约瑟夫·库拉什及其追随者，则主张建立由武装农民指挥官乾纲独断的家长制统治，用枪杆子彻底涤荡城里的腐败政客与一切潜在的颠覆分子。"
sanation.22.a:0 "弗朗西谢克·卡明斯基将继续带领我们稳步前行。"
sanation.22.b:0 "博莱斯瓦夫·罗亚与激进的农业社会主义才是未来！"
sanation.22.c:0 "约瑟夫·库拉什的铁腕将捍卫农民的胜利果实！"
sanation.23.t:0 "青年民族主义者的凯旋"
sanation.23.d:0 "当萨纳齐亚的左右两派还在议会与部委的回廊里为了毕苏斯基的政治遗产争得头破血流时，真正的风暴已经在华沙的街头酝酿成熟。随着青年民族主义运动的声势在全国各地达到顶峰，成千上万名狂热的青年学生、准军事冲锋队员与民族民主派支持者走上街头，将首都的各大广场与政府大楼团团围住。面对山呼海啸般的民族主义浪潮，早已因内耗而瘫痪的萨纳齐亚当局彻底丧失了弹压的意志与能力，不少同情民族主义事业的军警甚至主动打开了政府大门。\n\n在扬·兹季托维茨基的率领下，青年民族主义者联盟成功接管了国家最高权力，将无能的军团官僚们扫地出门。然而，这群年轻的民族民主主义者并非一味沉溺于过去教条的守旧派——出身于大波兰青年运动、又曾与萨纳齐亚体制有过接触的他们，深知唯有将罗曼·德莫夫斯基的民族民主主义内核与约瑟夫·毕苏斯基的强权国家遗产熔于一炉，才能真正重塑波兰的灵魂。"
sanation.23.a:0 "幽灵归来，民族觉醒！"
sanation.24.t:0 "德莫夫斯基—毕苏斯基思想的诠释者"
sanation.24.d:0 "随着青年民族主义者联盟成功整合了传统的民族民主运动、并安抚了旧萨纳齐亚体制内的实权派分子，一种全新的意识形态综合体——“德莫夫斯基—毕苏斯基思想”已然在波兰的政治舞台上正式确立。两大宿敌的政治遗产在这群年轻一代的民族主义者手中实现了历史性的合流。然而，当这一宏大的思想框架需要转化为具体的国家政策与经济路线时，青年民族主义者联盟内部的两位核心理论家却对未来的前进方向产生了深刻分歧。\n\n现任党魁、法学家与经济学者扬·兹季托维茨基主张“以市场自由反对政治自由主义”，强调在彻底铲除议会多元主义并确立天主教总体国家地位的同时，应当推行稳健的财政体系改革、维护经济层面的市场自由，以此构筑强大的波兰民族共同体；而激进的文学评论家与哲学家扬·斯基夫斯基则高呼发动一场彻底的“反自由革命”，要求由他接掌最高领导权，通过科学领导与自治体系彻底斩杀资本主义这头九头蛇，将激进的民族主义作为推动社会进步的必然引擎。"
sanation.24.a:0 "扬·兹季托维茨基将带领我们构筑波兰民族共同体。"
sanation.24.b:0 "扬·斯基夫斯基将领导这场彻底的反自由革命！"
sanation.25.t:0 "整肃军中异己"
sanation.25.d:0 "尽管波兰军团联盟与萨纳齐亚运动本就脱胎于行伍之间，但这并不意味着全体波兰武装力量都甘心对现政权俯首帖耳。随着萨纳齐亚左右两派的内部倾轧愈演愈烈，军队内部那些非军团嫡系的职业军官与反萨纳齐亚将领开始蠢蠢欲动。他们在各大驻地与参谋部内私下串联，妄图趁政府忙于党争之际整合兵权、在国家政治中插手布局。\n\n面对军营中日益高涨的不满暗流，当局果断采取了先发制人的强硬手段。总参谋部二处与宪兵部队突袭了数座秘密集会的军官俱乐部，多名涉嫌越权干政的将校被连夜解除兵权、勒令退役，或是被一纸调令发配至偏远的边境防区。这场雷厉风行的清洗暂时打乱了军方反对派的串联步伐，但只要政局一日未定，军营深处的野心便绝不会真正熄灭。"
sanation.25.a:0 "枪杆子必须绝对服从指挥！"
sanation.26.t:0 "弹压农民营暴动"
sanation.26.d:0 "当华沙的政客们围绕萨纳齐亚的未来路线争论不休时，广袤的波兰乡村正沦为危险的火药桶。对土地改革迟缓与农业凋敝深感绝望的农民们，在反萨纳齐亚的民粹派领袖煽动下纷纷加入农民营。他们不仅抗粮抗税、封锁城乡要道，更在各地冲击地方公署、袭击警察哨所，试图用草叉与猎枪向摇摇欲坠的中央政府讨要说法。\n\n为了防止零星的乡村骚乱演变为席卷全国的农民起义，内务部立刻向动荡省份派出了大批国家警察与弹压部队。装甲车开进了泥泞的村落，路障被强行推平，数百名农民营的骨干分子与地下联络人在搜捕中锒铛入狱。尽管高压弹压暂时恢复了乡村表面的秩序、迫使农民营转入蛰伏，但弥漫在田间地头的怨恨依然随时可能再次引爆。"
sanation.26.a:0 "绝不能让乡巴佬动摇国本！"
sanation.27.t:0 "取缔民族主义集会"
sanation.27.d:0 "萨纳齐亚政权内部的分裂与迟疑，给了狂热的青年民族主义运动可乘之机。这些痛恨毕苏斯基遗产的极端民族主义者走上街头，在大学校园与城市广场上大肆散发反政府传单，高呼推翻腐败无能的军团官僚。他们的准军事冲锋队甚至公然在光天化日之下挑起街头斗殴，企图在首都市中心制造混乱，借机扩大自身的政治威望。\n\n当局绝不会容忍这群狂热分子在自己的眼皮底下夺走街头控制权。大批防暴警察使用警棍与水龙驱散了非法游行的人群，安全部门随即查封了数家民族主义报社与青年民族主义者联盟的秘密据点，并将带头闹事的头目悉数投入大牢。在铁腕打击之下，民族主义者的街头攻势被迫暂告一段落，但他们很快又会在暗处重新集结。"
sanation.27.a:0 "给这群狂热分子一点颜色看看！"
sanation.28.t:0 "苍白骑士的召唤"
sanation.28.d:0 "自波兰人民共和党夺取最高政权以来，萨文科夫主义便一直是这片土地上的最高指导思想。党魁卡罗尔·温季亚戈尔斯基与党内核心骨干大多曾在当年与鲍里斯·萨文科夫并肩作战，将这位铁血革命家与反布尔什维克传奇视为精神导师。而对于萨文科夫本人而言，自幼在华沙长大的经历也让他对波兰怀有难以割舍的特殊羁绊。\n\n如今，随着波兰民族共和国的体制彻底稳固，党内关于“迎接真正的导师”的呼声日益高涨。以温季亚戈尔斯基为首的狂热追随者认为，波兰的萨文科夫主义革命既然已经开花结果，便理应将最高权柄交还给这一思想的缔造者本人——倘若萨文科夫已经君临莫斯科，波兰便可与他的俄罗斯实现历史性的统一，共同构筑横跨欧亚的斯拉夫民族革命帝国；即便他在俄罗斯的夺权事业受挫，华沙也完全可以成为这位“苍白骑士”东山再起的新王座。不过，党内也有相当一部分民族派干将对此心存顾虑，主张维持现有的本土领导层，以免波兰的独立性被萨文科夫个人的宏大野心所吞噬。"
sanation.28.a:0 "我们敬仰萨文科夫，但波兰必须由波兰人自己掌舵。"
sanation.28.b:0 "波兰与俄罗斯将在最高领袖萨文科夫的旗帜下合二为一！"
sanation.28.c:0 "迎回鲍里斯·萨文科夫，华沙将成为他新的王座！"
sanation.29.t:0 "波兰共和国的第一次自由大选"
sanation.29.d:0 "马里安·亚努沙伊蒂斯-泽戈塔将军兑现了他的诺言。在救国政府的护航下，波兰人民终于迎来了独立以来第一次不受枪杆子与秘密警察干预的自由选举。各地的投票站前排起了长龙，经历了长期战乱与派系倾轧的民众，如今终于能用选票来决定国家的未来走向。\n\n本次大选的核心角逐在重组后的保守党与异军突起的民主党之间展开。在保守党内部，两大流派各具声势：出身显赫贵族世家的前外长尤斯塔西·萨皮哈亲王代表着温和稳健的民族保守主义，主张维护私有产权、社会秩序与宪政传统；而著名的天主教哲学家与诗人耶日·布劳恩则高举基督教弥赛亚主义与神权政治的旗帜，呼吁以天主教教义彻底重塑波兰的国家灵魂。与此同时，由前军团老兵、克拉科夫省长米科瓦伊·克瓦希涅夫斯基领衔的民主党，则汇聚了大批自由派知识分子、城市中产与进步青年，力推激进进步主义、世俗化改革与社会公正。当最后一箱选票在华沙统计完毕，新共和国的掌舵人选终于揭晓……"
sanation.29.a:0 "尤斯塔西·萨皮哈与传统保守派赢得大选！"
sanation.29.b:0 "耶日·布劳恩与天主教神权派获得压倒性胜利！"
sanation.29.c:0 "米科瓦伊·克瓦希涅夫斯基率领民主党笑到了最后！"
sanation.30.t:0 "博申斯基兄弟的路线之争"
sanation.30.d:0 "随着超级大国联盟大刀阔斧的政治与经济改革全面落地，波兰已经在自由市场资本主义与地缘扩张主义的道路上彻底脱胎换骨。然而，当新体制的根基稳固之后，关于国家下一阶段发展重心的讨论也在党派最高层内部悄然展开，而这场争论的核心，恰恰集中在博申斯基家族的两兄弟——阿道夫·博申斯基与他的兄长亚历山大·博申斯基之间。\n\n作为将超级大国联盟带上执政宝座的领路人，弟弟阿道夫·博申斯基始终将目光投向波兰边境之外的广袤版图。他是一名狂热的地缘政治棋手与青年帝国主义理论家，主张继续将国家资源倾注于外交博弈与强权扩张之中，通过粉碎周边大国的霸权来奠定波兰的超级大国地位。\n\n相比之下，同样是党内核心理论家的兄长亚历山大·博申斯基则展现出了更为老练、冷酷的实用主义作风。亚历山大认为，真正的超级大国地位绝非单纯依靠外交冒险所能维系，波兰当下更需要一位脚踏实地的掌舵人来深化工业化进程、巩固国内财团与自由市场秩序，用雄厚的经济与工业实力为帝国的霸权提供最坚实的后盾。如今，超级大国联盟的精英们必须决定，两兄弟中究竟谁才最适合继续执掌波兰的权柄。"
sanation.30.a:0 "阿道夫的远见无可替代，继续由他引领帝国前行！"
sanation.30.b:0 "亚历山大的务实手腕更为老道，是时候由兄长接掌大权了！"