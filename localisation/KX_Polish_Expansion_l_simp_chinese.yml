 plxv2.074.t:0 "废宪"
 plxv2.074.d:0 "工团主义的胜利令许多人感到意外，尤其是考虑到他们政党的成立是出于必要，而非出于信念。现在，他们开始着手实现另一种社会组织生活形式，这与广泛认可的三权分立观念以及启蒙运动的成果相对立。\n他们认为，传统的宪法是不必要的机构，只会压抑人民的意愿。相反，宏观层面的关系应该由自由形式的组织来规范，如公社、合作社和工团，最终形成一个复杂的体系，并有着自己独特的“制衡机制”。\n当然，这种做法在政治光谱上引发了广泛的愤怒，但工团主义者们认为这是正确的事情。"
 plxv2.074.a:0 "为了自由且公正的社会"
 plxv2.075.t:0 "理想主义的后果"
 plxv2.075.d:0 "我们的行动在军团成员中引起了巨大轰动。瓦莱雷·斯瓦韦克决定采取行动，再次发动政变；然而，许多普通士兵拒绝参与，他们认为起义的唯一原因是上级的政治贪婪。此外，他们还考虑到年轻的亨佩尔曾在大战期间加入军团。瓦莱雷·斯瓦韦克被对政府有好感的士兵逮捕，并被他们处决，这使军官阶层恢复了秩序。"
 plxv2.075.a:0 "士兵崛起！军官为奴！"
 plxv2.076.t:0 "废除政党"
 plxv2.076.d:0 "工团主义政府继续推进社会改革，宣布解散所有政党，包括其自身组织，该组织也是基于必要性而非信念以政党形式运作。自由民主党派是资产阶级精英维持权力的不必要工具，先锋党则使领导权脱离工人阶级；只有通过自由形式的参与，人民才能获得解放！"
 plxv2.076.a:0 "于自由劳动中万古长青！"
 plxv2.077.t:0 "领导权问题"
 plxv2.077.d:0 "尽管扬·亨佩尔无疑是我们的工团主义革命运动之父，但他更多是一个理论家而非其他角色，这仍然是一个事实。因此，许多人开始提议让他退居二线，让更务实的博莱斯瓦夫·贝鲁特掌舵。贝鲁特仍然遵循亨佩尔的一般理念，但他在某种程度上将其与国家工团主义和共产主义的影响相结合，认为社会尚未准备好完全过渡到乌托邦式的社会，仍然需要一只无形的大手。"
 plxv2.077.a:0 "亨佩尔的理想主义万岁！"
 plxv2.077.b:0 "贝鲁特将指引我们的行动!"
 plxv2.078.t:0 "神秘社团崛起"
 plxv2.078.d:0 "在我国推广亨佩尔思想的努力已取得显著成效，并催生了众多神秘社团，这些社团试图复兴他们认为是祖先原始信仰的理念，常常将这些信仰与其他形式的灵性思想相融合，尤其是东方的灵性思想。虽然说亨佩尔单枪匹马地促成了这种复兴未免过于自大，因为许多此类社团早已存在多年。\n但这并不改变我们欢迎这些努力的事实，这些努力使我们以及他人更接近与祖先建立联系，并实现‘涅槃’。"
 plxv2.078.a:0 "赞美太阳！"
 plxv2.079.t:0 "军团问题"
 plxv2.079.d:0 "斯拉韦克的政变已经过去，然而这并不改变这样一个事实：军队内部确实仍然存在敌对势力。值得庆幸的是，普通士兵证明了他们站在我们这一边，这为解决问题开辟了一条途径；或许我们应该进行军事改革，将民主引入我们的军队。如果军官的职位取决于士兵的投票，这将使他们保持纪律。 \n另一个选择是简单地清除最“令人讨厌”的军官，使军队保持在政府控制之下。"
 plxv2.079.a:0 "我们将会民主化军队！"
 plxv2.079.b:0 "我们将清除部分军官，并对军队实施严格管控。"
 plxv2.043.t:0 "神权国度"
 plxv2.043.d:0 "当国王与王室委员会还在争执不下之时，其他政治势力已经开始了行动。愤怒的主教们在波兰各地的农村集结了一支庞大的农民队伍，当这支队伍到达华沙的时候，就连驻军都加入了他们。很快国王与皇家委员会被双双扫地出门，主教团现在是这个国家的统治者。"
 plxv2.043.a:0 "上帝保佑！"
