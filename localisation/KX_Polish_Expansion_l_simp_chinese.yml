 POL_national_socialists:0 "民族社会主义党爆冷取胜"
 POL_national_socialists_desc:0"卡齐米日·达格南的民族社会主义党在选举中爆冷取胜，成为这场民族革命的领袖。他承诺用社会主义的手段实现民族的目标，把工人从资本与外来势力的双重压迫中解放出来。他将带领波兰走上一条不同于巴黎的社会主义道路。"
 POL_yesterday_today_tomorrow:0 "昨日，今日，明日"
 POL_yesterday_today_tomorrow_desc:0"达格南把民族社会主义描绘成一条贯穿昨日、今日与明日的道路。昨日的民族传统、今日的工人斗争与明日的民族共同体，被他编织成一套宏大的历史叙事。他要让每一个波兰人相信，他们正在完成祖先未竟的使命。"
 POL_socialism_of_non_marx_syndicalism:0 "非马非工社会主义"
 POL_socialism_of_non_marx_syndicalism_desc:0"达格南要建立一种既非共产主义、也非工团主义的民族社会主义，拒绝国际主义的阶级斗争教条，也拒绝工团主义的自治幻想。他主张以民族国家为核心组织工人，由国家而不是工会或党来领导经济与社会。在他看来，社会主义不是普世理想，而是民族复兴的工具。"
 POL_death_to_greedy_of_capitalism:0 "打倒资产阶级贪婪"
 POL_death_to_greedy_of_capitalism_desc:0"达格南把资本主义的贪婪视为民族苦难的根源，号召工人向银行家与投机者开战。他指控大资本剥削波兰工人、出卖国家利益，必须将其彻底打倒。这场运动把阶级愤怒与民族动员熔铸成一股危险的政治力量。"
 POL_national_democratic_revoltion:0 "民族民主革命"
 POL_national_democratic_revoltion_desc:0"达格南发动一场民族民主革命，要把国家权力从旧精英手中夺过来，交给民族的工人与青年。他既反对自由主义的腐败，也反对共产主义的国际主义。他要建立一个由民族意志主导的新国家。"
 POL_legacy_of_national_socialist_community:0 "民族社会主义公社的遗产"
 POL_legacy_of_national_socialist_community_desc:0"民族社会主义党把自己塑造成民族社会主义公社的继承者，要延续密茨凯维奇式社会主义的传统：民主、大企业国有化与种族合作。他把旧有的公社纳入国家体系，让它们成为动员群众与分配资源的工具。这段遗产的叙事为他的统治提供了历史合法性。"
 POL_defend_democracy:0 "保卫议会民主"
 POL_defend_democracy_desc:0"党内的左翼盟友主张保卫议会民主，认为民族社会主义应当在民主的框架内实现。他们试图保留选举与议会，用社会改革来对抗右翼的独裁倾向。这条路线与达格南内部主张铁腕统治的一派形成了尖锐的矛盾。"
 POL_expel_jews:0 "驱逐犹太占领者"
 POL_expel_jews_desc:0"党内的激进派把经济危机归咎于犹太社区，发动一场排外与驱逐的运动。犹太居民被赶出家园，财产被没收，暴力在他的纵容下蔓延。这一政策让波兰失去大量人口与人才，也暴露了这场运动内部最黑暗的一面。"
 POL_catholic_free_from_papacy:0 "非梵蒂冈之教权主义"
 POL_catholic_free_from_papacy_desc:0"达格南试图把波兰教会从梵蒂冈的权威中剥离出来，建立一个听命于民族国家的民族教会。教会可以被保留，但必须放弃普世性，转而服务于他的民族社会主义意识形态。这场宗教改造引发了激烈的抵抗，也让他与信徒之间的关系更加紧张。"
 POL_salute_to_marshall:0 "向您致敬，毕苏斯基！"
 POL_salute_to_marshall_desc:0"民族社会主义党向毕苏斯基元帅致敬，把这位亡故的领袖奉为民族革命的守护神。他把军团传统与民族社会主义嫁接在一起，让军队成为他统治的核心支柱。通过借用元帅的威望，达格南为自己的统治披上了合法性的外衣。"
 POL_unity_of_people:0 "人民团结"
 POL_unity_of_people_desc:0"达格南号召全体波兰人不分阶级地团结起来，共同建设民族共同体。他要求工人、农民与士兵放下分歧，把民族利益置于个人利益之上。团结的口号掩盖了他内部的派系斗争，也成为他动员战争的工具。"
 POL_tradition_of_aryans:0 "雅利安传统"
 POL_tradition_of_aryans_desc:0"达格南党内的激进派鼓吹所谓的雅利安传统，宣称波兰民族拥有古老的尚武血脉。这套神话被他用来强化军队的民族使命感，把士兵塑造成民族与传统的守护者。它让军队更加狂热，也让他的意识形态滑向危险的种族主义。"
 POL_slavic_national_union:0 "斯拉夫国家联盟"
 POL_slavic_national_union_desc:0"达格南提出建立一个由波兰领导的斯拉夫国家联盟，把东欧与巴尔干的斯拉夫民族纳入同一阵营。他把联盟描绘成对抗德国与俄国威胁的堡垒，也把它当作自己向外扩张的跳板。华沙将成为他新斯拉夫世界的中心。"
 POL_labor_defeat_capitalism:0 "以劳动战胜资本主义"
 POL_labor_defeat_capitalism_desc:0"达格南号召以劳动为武器战胜资本主义，把工厂从私人手中夺回，交给工人与国家共同管理。他让生产不再为利润服务，而是为民族的需要与工人的福利服务。这场经济革命既是社会主义的，也是民族主义的。"
 POL_proletarian_welfare:0 "无产阶级福利"
 POL_proletarian_welfare_desc:0"民族社会主义党向工人许诺一套全面的福利制度，包括住房、医疗、教育与养老。他把福利包装成民族共同体对劳动者的回报，也把它当作争取工人支持的手段。但这些恩惠以服从与牺牲为代价。"
 POL_massive_nationalization:0 "大规模国有化"
 POL_massive_nationalization_desc:0"通过推行大规模国有化，把银行、矿山、重工业与交通纳入国家控制。他全面废除私有财产，把经济决策集中到民族社会主义党手中。国家由此掌握了他动员全国资源的强大机器。"
 POL_absolute_worker_power:0 "工人权力不可动摇"
 POL_absolute_worker_power_desc:0"达格南宣称工人已经掌握了不可动摇的权力，让工会与工人委员会成为国家治理的重要组成部分。实际上，这些组织都被他严密控制，工人的声音只能在党的框架内表达。工人权力成了他的一块遮羞布，掩盖着他对社会的全面统治。"
 POL_nationalism_democracy_socialism:0 "民族，民主，社会主义"
 POL_nationalism_democracy_socialism_desc:0"达格南最终把民族、民主与社会主义三个口号熔铸成一套完整的国家意识形态。民族为他提供认同，民主为他提供合法性，社会主义为他提供动员与经济基础。三者结合，构成了一个既狂热又严密的现代国家。"
 POL_radical_healing_movement:0 "激进治愈运动确保了胜利"
 POL_radical_healing_movement_desc:0"激进治愈运动在混乱中夺取了胜利，诗人杰弗里·波托基成为这场民族重生的旗手。他宣称自己承继了古老皮雅斯特王族的血脉，要治愈波兰被外来王朝与教会腐蚀的灵魂。在他的领导下，一场以王冠、太阳与民族神话为核心的运动席卷全国。"
 POL_expel_austrian_monarch:0 "驱逐奥地利君主"
 POL_expel_austrian_monarch_desc:0"波兰的王座上坐着一位由维也纳扶植的君主，他是外国势力强加给这个民族的枷锁。杰弗里·波托基号召群众与军队将这位奥地利傀儡驱逐出境。只有清除外来的王朝，这位自命的皮雅斯特后裔才能走上他梦寐以求的王位。"
 POL_crown_true_king_of_poland:0 "加冕真正波兰人之国王"
 POL_crown_true_king_of_poland_desc:0"杰弗里·波托基在华沙加冕为真正的波兰人之王，取号瓦迪斯瓦夫五世。这位诗人国王声称自己的血统可追溯至古老的皮雅斯特王朝，他的加冕被宣传为民族灵魂的复活。王冠、诗篇与神秘仪式交织在一起，一个新式的君主政权就此诞生。"
 POL_return_to_absolute_monarchy:0 "回归君主专制"
 POL_return_to_absolute_monarchy_desc:0"杰弗里·波托基废除了一切限制王权的制度，宣布回归绝对的君主专制。议会、宪法与地方自治都被置于王权的阴影之下，国家的意志由这位诗人国王一人决定。他相信，只有不受掣肘的君主才能带领波兰完成精神与政治的重生。"
 POL_anti_catholicism:0 "打倒基督教！打倒梵蒂冈！"
 POL_anti_catholicism_desc:0"杰弗里·波托基把天主教与梵蒂冈视为民族精神的枷锁，宣布向教会开战。神职人员的特权被剥夺，教会的土地与财富被没收，亲梵蒂冈的势力遭到清洗。这位诗人国王要用一种更古老、更民族的信仰取代基督教的普世主义。"
 POL_power_to_royal_council:0 "赋权皇家委员会"
 POL_power_to_royal_council_desc:0"杰弗里·波托基把广泛的权力授予皇家委员会，让一小撮忠诚的顾问掌握行政、立法与军事的决定权。委员会成员由国王亲自挑选，对议会与人民都不负责。王权与寡头在密室中合为一体，激进治愈运动的意志由此贯彻全国。"
 POL_esotericism_beliefs:0 "推广神秘主义信仰"
 POL_esotericism_beliefs_desc:0"在打倒教会之后，杰弗里·波托基开始推广一套神秘主义信仰，宣称波兰民族拥有独特的宇宙使命。古老的神话、秘仪与民族传说被重新编织成国家的官方教义。人们被要求相信，国王与民族的命运早已写在星辰与血脉之中。"
 POL_forced_pololize:0 "强制波兰化"
 POL_forced_pololize_desc:0"杰弗里·波托基的政权在全国推行强制波兰化，要求所有少数民族放弃自己的语言、习俗与身份。学校、教堂与地方政府都成为同化的工具，拒绝服从者将面临驱逐与镇压。在这位诗人国王看来，只有单一的民族才能治愈国家的分裂。"
 POL_salute_to_king_and_nachenik:0 "向国王领袖致敬！"
 POL_salute_to_king_and_nachenik_desc:0"政权的最高权威被概括为两个称号：国王与领袖。杰弗里·波托基既是加冕的君主，也是激进治愈运动的最高领袖。所有人都必须向这两个象征宣誓效忠，任何质疑都被视为叛国。"
 POL_worship_the_sun:0 "建立太阳崇拜"
 POL_worship_the_sun_desc:0"杰弗里·波托基把太阳奉为民族生命力的源泉，建立起一套太阳崇拜的仪式。这位诗人国王被描绘成太阳在人间的化身，宫廷与广场上充满了火焰与光明的象征。这种异教崇拜让政权显得更加神秘，也让社会稳定付出代价。"
 POL_restore_social_hiearchy:0 "重建社会阶序"
 POL_restore_social_hiearchy_desc:0"杰弗里·波托基要重建一套森严的社会阶序，让每个人都在民族共同体中找到固定的位置。贵族、军人、工人与农民被安排在不同的等级之中，服从与秩序被奉为最高美德。平等被斥为软弱的幻想，等级才是这位国王眼中稳定的基石。"
 POL_ideas_of_intermaurium_empire:0 "海间帝国"
 POL_ideas_of_intermaurium_empire_desc:0"杰弗里·波托基提出一个宏大的海间帝国蓝图，要把波罗的海与黑海之间的土地统一在波兰的王冠之下。宣传机器把这一计划描绘成民族天命，号召全体人民为帝国的扩张而战。战争不再是手段，而成了这位诗人国王自我实现的仪式。"
 POL_state_capitalism:0 "国控资本主义"
 POL_state_capitalism_desc:0"杰弗里·波托基并不打算消灭资本主义，而是要把资本牢牢绑在国家与国王的战车上。大企业被纳入国家计划，利润服务于帝国的扩张与民族的荣耀。资本保留了下来，但它的主人换成了王权与国家。"
 POL_destroy_socialism:0 "摧毁一切社会主义"
 POL_destroy_socialism_desc:0"杰弗里·波托基的政权向一切社会主义流派宣战，把社会民主党人、工团主义者与共产主义者统统视为民族的叛徒。工会被解散，左翼领袖被逮捕，工人被要求只忠于国王与国家。摧毁社会主义，是这位诗人国王巩固统治的最后一步。"
 POL_revitalize_old_culture:0 "复兴旧文化"
 POL_revitalize_old_culture_desc:0"杰弗里·波托基发起一场文化复兴运动，要从古老的传说、史诗与习俗中挖掘波兰的民族灵魂。这位诗人国王亲自参与创作与仪式，要求艺术家歌颂国王、民族与太阳，任何现代主义的实验都被斥为堕落。旧文化被重新包装，成为激进治愈运动的宣传工具。"
 POL_our_born_rights:0 "恢复与生俱来的权力"
 POL_our_born_rights_desc:0"杰弗里·波托基宣布，波兰对东方与南方的广袤土地拥有与生俱来的权利。历史、血统与天命被用来为领土扩张辩护，任何反对者都被视为民族的敌人。恢复这些所谓的天赋权利，将成为这位国王发动帝国扩张的号角。"
 POL_aristocracy_corporatism:0 "贵族法团主义"
 POL_aristocracy_corporatism_desc:0"杰弗里·波托基把贵族传统与法团主义结合起来，让地主、工业家与军官组成一个个等级森严的职业团体。这些团体在国王的监督下管理经济与社会事务，工人则被纳入服从的等级。旧贵族的特权以法团主义的形式重生。"
 POL_strip_totalism_from_socialism:0 "剥离极权主义中的社会主义"
 POL_strip_totalism_from_socialism_desc:0"杰弗里·波托基把社会主义中的极权主义成分剥离出来，宣称要保留社会主义对工人的关怀，却抛弃其革命与平等的内核。工人被纳入国家的等级秩序，社会正义变成了国王赐予的恩惠。这是一种被抽空灵魂的社会主义。"
 POL_strip_liberalism_from_democracy:0 "剥离民主主义中的自由主义"
 POL_strip_liberalism_from_democracy_desc:0"杰弗里·波托基宣称，民主制度已被自由主义腐蚀，变成了软弱与分裂的根源。政权保留选举与议会的形式，却剥夺了自由派的声音与权利。民主的外壳被保留下来，内里却只剩下对国王的服从。"
 POL_rebirth_of_old_order:0 "旧秩序重生"
 POL_rebirth_of_old_order_desc:0"旧秩序在杰弗里·波托基的旗帜下重生，君主、贵族与民族信仰的权威被重新确立。但这不是简单的复辟，而是一个由神秘主义、民族狂热与王权统治混合而成的新秩序。波兰的过去被召唤回来，为的是这位诗人国王更加极端的未来。"
