  plxv2.083.t:0 "王室特权的问题"
 plxv2.083.d:0 "最近的事件证明，王室委员会的地位并不像其支持者所相信的那样稳固。如今，许多人提议让议会批准将更多权力转移给君主，毕竟君主制是一个比议会更受人尊敬的制度，而许多人认为议会不过是“一群背信弃义的幕后黑手”。然而，这种权力转移意味着该体系的受益者——主要是贵族阶层——需要放弃部分特权；但或许这是一种值得的牺牲。"
 plxv2.083.a:0 "我们将加强君主的权力。"
 plxv2.083.b:0 "君主只是一个象征，而王家委员会才是真正的政府！"
 plxv2.083.c:0 "双方争执不下，陷入僵局"
 plxv2.084.t:0 "共治主义"
 plxv2.084.d:0 "凭借新获得的权力，我们的君主决定转向共治主义运动，以期为其政府提供思想基础。关于政府形式的具体细节仍需进一步明确，但尽管王室委员会的反对者在选举中落败，许多人仍对新政府抱有期待。"
 plxv2.084.a:0 "我们将会加强君主权力。"
 plxv2.084.b:0 "君主只是一个象征，而王家委员会才是真正的政府！"
 plxv2.085.t:0 "贵族与实业家之国"
 plxv2.085.d:0 "上层阶级的合作是解决我国不稳定问题的唯一合理方案，下层阶级根本不够格。如今，贵族和实业家将引领我国走向繁荣。"
 plxv2.085.a:0 "当然，我们会保护他们的特权。"
 plxv2.086.t:0 "于神圣指引之下"
 plxv2.086.d:0 "教会已成功对皇家议会施加影响，如今国家将遵循天主教会教义进行治理。当然，贵族及其他上层阶级仍将留在政府中，然而教会将保持其主导地位。"
 plxv2.086.a:0 "愿上帝保护他的羊群免受腐败之疾"
 plxv2.087.t:0 "和谐之运动"
 plxv2.087.d:0 "所谓的“共治主义者”——其名称源自“无政府主义”的对立面——在过去几个月里逐渐崭露头角。他们对君主制的坚定支持，以及将进步主义与技术官僚主义政策相结合的立场，使其在上下阶层中均获得了广泛支持。\n共治主义者旨在建立一种新型制度，其中“共治者”（即君主）行使专制权力，并与任命的“共治主义者委员会”、参议院以及由人民选举产生的议会下院“众议院”分享权力。尽管这种制度乍看之下具有威权主义色彩，但共治主义者支持较为社会福利导向的政策，包括累进税制和工人保护措施。或许如果皇家委员会占据上风，它可以从这一运动中汲取一些灵感……"
 plxv2.087.a:0 "有趣的想法……"
 plxv2.088.t:0 "共治主义领导者"
 plxv2.088.d:0 "共治主义者需要回答的最重要问题是共治主义的本质。该运动仍处于分裂状态，共治主义最初的理念是共治主义者将由由议会两院组成的“国民议会”选出；然而随着共治主义者越来越倾向于君主制，共治者的职位是否应由国王掌握已不再明确。总理职位仍保留，仅对君主负责，理论上不直接执政，但将负责分配各项政府任务；或是某种程度上划分君主与总理的职权。后者将获得行政权力（如前所述）并由国民议会选举产生，而前者则保留任命参议院成员及皇家委员会成员的权力。 \n我们需要做出选择……"
 plxv2.088.a:0 "强大的君主会保证稳定。"
 plxv2.088.b:0 "行政权将被转交给首相。"
 plxv2.089.t:0 "波兰-俄罗斯联邦？"
 plxv2.089.d:0 "我们注意到，波兰和我们俄罗斯都拥有同一位君主，因此波兰方面决定提出一项提案，旨在实现两国的统一。"
 plxv2.089.a:0 "绝妙的主意！"
 plxv2.089.b:0 "绝妙的主意！"
 plxv2.089.c:0 "不，俄国人不会分享他们的权力给波兰人民！"
 plxv2.090.t:0 "俄罗斯同意！"
 plxv2.090.d:0 "俄罗斯已同意统一我们的国家，波兰与俄罗斯统一的新时代已经到来！"
 plxv2.090.a:0 "世袭君主制将保持稳定"
 plxv2.090.b:0 "选举君主制在我们的历史上具有先例，我们将支持它"
 plxv2.091.t:0 "俄罗斯拒绝..."
 plxv2.091.d:0 "俄罗斯决定无视波兰关于统一的请求。由于我们的君主暂时居住在俄罗斯，其职责将由首相摄政代为履行。"
 plxv2.091.a:0 "好吧...还有其他...更有力的措施的...对吧？"
 plxv2.092.t:0 "东欧统一！"
 plxv2.092.d:0 "波兰国王曾居住在莫斯科，如今历史重演，波兰和俄罗斯将在一位君主之下实现真正的统一！"
 plxv2.092.a:0 "就像...齐格蒙特三世瓦萨那样！"
 plxv2.094.t:0 "爱国者"
 plxv2.094.d:0 "在这个时候拒绝国王无异于向激进主义和动荡不安发出邀请。再者，还有谁能比一位哈布斯堡王朝的君主更适合呢？关于卡罗尔二世，有许多值得称道之处。他是一位爱国士兵，讲波兰语，真心热爱波兰。在他的统治下，有一点是确定的：国家的利益将在国王的心中占据首要地位，尽管他与伟大的哈布斯堡家族有渊源。多年前被认为不可接受的哈布斯堡王朝统治，如今将再次成为波兰的第二个黄金时代。"
 plxv2.094.a:0 "生为哈布斯堡，择为波兰"
 plxv2.095.t:0 "德意志帝国的国王"
 plxv2.095.d:0 "摄政委员会再次选举了一位国王，不出所料，弗雷德里克二世·克里斯蒂安，维特尔斯巴赫王朝的继承人以及萨克森国王，当选了。作为波兰-立陶宛联邦和华沙公国两位君主的遗产继承者，他成为了所有候选人中对波兰王位拥有最有力要求的人。然而，在威廉二世皇帝的压力下，他在接受波兰王冠的提议之前，被迫将其萨克森王位让给了他的兄弟恩斯特。奥古斯特三世这位强者的后代面临着一个极其困难的挑战：确保他的臣民相信他是在照顾他们的利益，而不仅仅是为了皇帝而治理。他缺乏卡罗尔二世那样的爱国精神，但时间会证明他的臣民的担忧是否被夸大了。"
 plxv2.095.a:0 "第二萨克森王朝即将开始！"
 plxv2.096.t:0 "雅盖隆王朝"
 plxv2.096.d:0 "摄政委员会再次选举了一位国王，当选者正是奥古斯丁·约瑟夫·曹尔托里斯基。其家族源自格迪米尼德斯家族，尽管他并非任何历史上的波兰君主的直系后代，但这却让波兰民众燃起了重返 “伟大旧时代” 的希望，期盼着一个充满荣耀与稳定的崭新时代的到来。至于这位雅盖隆王朝的候选者是否会带来齐格蒙特式的黄金时代，亦或是约翰·阿尔伯特式的失败结局，唯有时间能给出答案..."
 plxv2.096.a:0 "雅盖隆王朝的遗愿是否还有回归的希望？"
 plxv2.097.t:0 "波尼亚托夫斯基家族"
 plxv2.097.d:0 "摄政委员会再次选举了一位国王。令人震惊的是，这次的选择落在了波尼亚托夫斯基家族的最后一位后裔——路易·莱奥波德·查尔斯·玛丽·安德烈·波尼亚托夫斯基亲王身上；尽管他出身于波兰最后一位国王斯坦尼斯瓦夫·奥古斯特的兄弟，但他与波兰没有任何关联。然而，他有趣的人生经历以及他在1897年与姐夫共同投资美国并创立标准电气公司所积累的经验，最终说服了议会接受他的候选资格。有一点可以肯定：斯坦尼斯瓦夫三世的统治，由于他在法国的成长经历和在法国军队中的服役经历，将再次拉近波兰与法国的关系。"
 plxv2.097.a:0 "才过了几年就从老板到当上国王了！"
 plxv2.098.t:0 "罗曼诺夫家族"
 plxv2.098.d:0 "摄政委员会再次选举了一位国王。然而，这一选择让所有观察者和记者都感到震惊，他们最初认为这不过是一个令人不快的玩笑。然而，这一消息被证实属实，王子弗谢沃洛德·伊万诺维奇·罗曼诺夫成为国王，并选择了亚历山大五世的王室名称。这位1914年出生的年轻王子对祖先的沙皇专制毫无记忆，但许多人担心他体内的罗曼诺夫血液会占据上风，波兰将再次面临俄罗斯式的专制统治。这些担忧受到亲德派反对势力的煽动，但他的统治命运取决于议会的决策和这位年轻王子的选择。他将成为波兰罗曼诺夫王朝的缔造者，如同卡尔·斯蒂芬·哈布斯堡之于哈布斯堡王朝，还是俄罗斯将再次主导关系，正如沙皇专制主义的遗产所暗示的那样？"
 plxv2.098.a:0 "天佑国王……"
 plxv2.099.t:0 "俄罗斯人"
 plxv2.099.d:0 "摄政委员会再次选举了一位国王，然而，这一选择连最狂野的想象也未曾预料到。鲜为人知的谢尔盖·叶甫盖尼耶维奇·特鲁别茨科伊王子被选为国王。他与波兰的渊源堪称离奇：他在沙皇时代曾作为波兰王国清算委员会的官员在波兰工作，但其职位过低，以至于在前国会波兰地区鲜为人知。后来，他与俄罗斯军事圈中的全军联盟及保守派势力有所关联。他作为候选人的主要合法性来源，在于其非凡的血统——他是格迪米纳斯王朝与留里克王朝的后裔。一位以“齐格蒙特四世”为王名的全新君主，将成为俄罗斯势力范围内的波兰坚定盟友，但唯有时间能证明，他将以平等伙伴还是熊的仆从身份存在。"
 plxv2.099.a:0 "又一次，俄罗斯人当上了波兰国王……"
 KX_PL_Chadecja_Left:0 "基督教左翼"
KX_PL_Chadecja_Left_desc:0 "现代基督教民主不能受过去精英的束缚，我们必须建立真正的大众运动，实现我们公正、团结、有序的未来愿景。"

KX_PL_Chadecja_Leftist_Christian_Democracy:0 "社会基督教民主"
KX_PL_Chadecja_Leftist_Christian_Democracy_desc:0 "我们依然忠于基督教民主与我们的民族，但我们是激进的——激进于我们实现基督教仁慈与公正理想的方式。"

KX_PL_Chadecja_Indicative_Planning:0 "启动指导性计划"
KX_PL_Chadecja_Indicative_Planning_desc:0 "简单的干预主义是不够的，国家机构必须全力投入经济管控，指导企业发展，融合公共投资与私有市场，并在此过程中保护工人权利。"

KX_PL_Chadecja_Broad_Coalition:0 "广泛联合"
KX_PL_Chadecja_Broad_Coalition_desc:0 "尽管社会主义扎根于马克思主义，社会主义纲领与我们并非截然不同；为更美好的未来，我们应考虑与他们合作。"

KX_PL_Chadecja_Social_Radicalism:0 "民族劳工"
KX_PL_Chadecja_Social_Radicalism_desc:0 "我们需要超越基督教民主的束缚。虽然马克思贬低了民族作为理想的作用，但他的阶级分析多有可取之处；因此我们必须为工人阶级而战，并更紧密地与波兰社会党（PPS）结盟。"

KX_PL_Chadecja_Land_Reform_With_PSL:0 "与波兰人民党协商"
KX_PL_Chadecja_Land_Reform_With_PSL_desc:0 "‘基督教民主党’长久以来忽视了农村劳动者的诉求，我们将与人民运动结盟以纠正此问题！"

KX_PL_Chadecja_Attack_the_Elite:0 "瓦解精英"
KX_PL_Chadecja_Attack_the_Elite_desc:0 "我们必须与过去不公的权威作斗争，包括教会！尽管我们开始越来越接近社会主义，我们依然植根于基督教道德；如果耶稣今日在世，他必将是社会主义者！"

KX_PL_Chadecja_Continue_Nationalisation:0 "深化国有经济"
KX_PL_Chadecja_Continue_Nationalisation_desc:0 "指导性计划尚且不足，在仍与私有企业合作的同时，我们将扩大国家在工业发展中的作用，制定五年计划，增强工人主动性，最终将企业整合进国家体系，使资本主义逐渐消亡。"

KX_PL_Chadecja_Promote_Class_Solidarity:0 "民族团结"
KX_PL_Chadecja_Promote_Class_Solidarity_desc:0 "上层阶级坐享利润而工人挨饿，这是不公的。双方需要合作而非彼此斗争！"

KX_PL_Chadecja_Creating_Welfare_State:0 "关爱儿童"
KX_PL_Chadecja_Creating_Welfare_State_desc:0 "为充分实现我党精神，需扩大福利；免费教育、医疗和社会保障不仅公正，也是社会现代化与正常运转所必需的。"

KX_PL_Chadecja_Economic_Assembly:0 "人民宪法"
KX_PL_Chadecja_Economic_Assembly_desc:0 "我们需要重新制定宪法，太多所谓的‘制衡’扼杀了人民的意志！"

KX_PL_Chadecja_Protect_Constitution:0 "不可撼动的宪法"
KX_PL_Chadecja_Protect_Constitution_desc:0 "我们的新宪法是我们协助创建的，我们不应背弃它；强大的宪政将保障稳定，稳定的政治体制孕育繁荣。"

KX_PL_Chadecja_Taming_National_Democracy:0 "驯服民族民主党"
KX_PL_Chadecja_Taming_National_Democracy_desc:0 "我们已与民族民主党的‘左翼’结盟，我们驯服了它并将其纳入一个真正的民主体系；民族保守势力欢呼吧，我们团结一致！"
