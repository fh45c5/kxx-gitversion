 PLX_choose_monarch:0 "波兰摄政会议"
 PLX_choose_monarch_desc:0 "在皇家委员会的要求下，摄政委员会成立，其唯一使命就是为波兰人民寻找并选出一位新的国王。由于一系列历史原因，我们可能的国王甚至女王人选似乎相当的多。"
 PLX_saxon_king:0 "选择萨克森的弗莱德里克"
 PLX_lithuanian_king:0 "选择立陶宛的明道加斯"
 PLX_Czartoryski_king:0 "选择查尔托雷斯基家族的奥古斯汀"
 PLX_piast_king:0 "选择皮雅斯特家族的萨瓦尔托"
 PLX_nap_king:0 "选择波拿巴家族的瓦莱夫斯基"
 PLX_hungarian_king:0 "选择安德拉希家族的桑多尔"
 PLX_russian_king:0 "选择罗曼诺夫家族的弗谢沃洛德"
 PLX_romanian_king:0 "选择霍亨索伦-锡格马林根家族的米哈伊"
 PLX_sobecki_king:0 "选择索别斯基家族的约翰"
 PLX_Pilsudski_king:0 "选择毕苏斯基家族的雅德威加"
 plxv2.141.t: "最后一步？"
 plxv2.141.d: "自摄政议会成立以来已经过去相当长的时间了，国王仍然没有选出，越来越多的人开始建议雅纽什干脆自己加冕为国王，在全波兰人民面前将自己的权威合法化。"
 plxv2.141.a: "真是愚行"
 plxv2.141.b: "很好，准备操办仪式吧！"
 PLX_POL_nap_king:0 "波拿巴家族的国王！"
PLX_POL_nap_king_desc:0 "波拿巴家族的瓦莱夫斯基向华沙递出了自己的王冠申请，声称要继承拿破仑时代波兰军团的遗志。他的名号唤起了人们对法兰西与波兰并肩作战的记忆，也带来了法国资本与军事经验。一个瓦莱夫斯基坐上波兰王位，将是历史对波兰的一次奇特回响。"

PLX_POL_hunagarian_king:0 "匈牙利的国王！"
PLX_POL_hunagarian_king_desc:0 "匈牙利的安德拉希家族派出了桑多尔，作为波兰王位的候选人。他带来的是匈牙利贵族的支持与喀尔巴阡山两侧的古老纽带。若他当选，波兰与匈牙利将再次在同一个王朝下携手。"

PLX_POL_russian_king:0 "罗曼诺夫家族的国王！"
PLX_POL_russian_king_desc:0 "流亡的罗曼诺夫家族看到了重返权力舞台的机会，弗谢沃洛德成为他们在波兰的候选人。他承诺恢复旧帝国的荣光，并吸引那些怀念君主秩序的俄国流亡者。若他当选，波兰将再次与东方的罗曼诺夫遗产纠缠在一起。"

PLX_POL_romanian_king:0 "罗马尼亚的国王！"
PLX_POL_romanian_king_desc:0 "罗马尼亚的霍亨索伦-锡格马林根家族派出了米哈伊，作为波兰王位的候选人。他年轻、亲民，背后是布加勒斯特的支持与黑海沿岸的利益。一个罗马尼亚人戴上波兰王冠，将把两国的命运紧紧绑在一起。"

PLX_POL_denounce_legionary_terror:0 "谴责铁卫团恐怖主义"
PLX_POL_denounce_legionary_terror_desc:0 "罗马尼亚的铁卫团以恐怖与暗杀搅动政局，新国王公开谴责他们的暴行。波兰宣布与这种极端运动划清界限，并支持布加勒斯特的合法政府。谴责铁卫团，既是道德姿态，也是为了维护王室自身的权威。"

PLX_POL_promise_of_democracy:0 "民主的承诺"
PLX_POL_promise_of_democracy_desc:0 "国王向人民许诺一个更加开放的政治未来，允许议会选举与有限的言论自由。他希望通过改革缓和社会矛盾，把民主的诉求纳入君主制的框架。承诺可以赢得时间，但也会让人民要求更多。"

PLX_POL_benevolent_monarchy:0 "仁慈君主制"
PLX_POL_benevolent_monarchy_desc:0 "新政权把自己包装成一位仁慈君主的统治，强调法律、福利与和解。国王以父亲般的姿态关怀臣民，用改革回应社会的不满。仁慈的面具之下，王权依然是不可挑战的中心。"

PLX_POL_invite_russian_monarchists:0 "邀请俄国君主主义者"
PLX_POL_invite_russian_monarchists_desc:0 "大批俄国君主主义者流亡华沙，国王向他们敞开宫廷的大门。这些经验丰富的旧贵族与军官带来人脉、军事技能与复辟的梦想。波兰因此成为俄国保皇派在欧洲最重要的避难所。"

PLX_POL_rebuild_reckoning_committee:0 "重建清算委员会"
PLX_POL_rebuild_reckoning_committee_desc:0 "国王重建清算委员会，追究革命者与旧政权腐败官员的责任。委员会拥有逮捕、审判与没收财产的广泛权力，成为王室清除异己的工具。正义与报复在这台机器中难以分辨。"

PLX_POL_renewed_pan_slavism:0 "君主泛斯拉夫主义"
PLX_POL_renewed_pan_slavism_desc:0 "波兰与俄国的君主主义者共同鼓吹一种新的泛斯拉夫主义，宣称斯拉夫各民族应在王权的领导下团结。华沙与流亡的罗曼诺夫宫廷成为这一运动的中心。一个由君主领导的斯拉夫世界，被描绘成对抗革命与德国威胁的堡垒。"

PLX_POL_protect_farmer:0 "保护农民"
PLX_POL_protect_farmer_desc:0 "新国王颁布法令保护小农，限制大地主的兼并，并为他们提供低息贷款。农民被鼓励留在土地上，以稳定粮食生产与社会秩序。这项政策让王室在乡村赢得了声望，也触动了贵族的地主利益。"

PLX_POL_strengthen_relations:0 "强化波匈纽带"
PLX_POL_strengthen_relations_desc:0 "波兰与匈牙利之间的古老友谊被重新提起，两国签署一系列文化、经济与军事协定。布达佩斯与华沙的宫廷往来频繁，共同的王朝利益把两国拉得更近。波兰希望通过匈牙利扩大自己在多瑙河地区的影响。"

PLX_POL_aristocracy:0 "贵族统治"
PLX_POL_aristocracy_desc:0 "新国王把权力交给支持他的大贵族，让他们掌管地方行政、军队与财政。贵族们以效忠王室为条件，换取了更大的特权与土地。波兰重新回到少数家族共同统治的旧轨道上。"

PLX_POL_legacy_maine_taxi:0 "马恩出租车的经验"
PLX_POL_legacy_maine_taxi_desc:0 "法国在马恩河战役中征用出租车运送士兵的故事，被波兰军官们奉为动员与后勤的经典。新国王决定借鉴这种应急动员模式，把民用运输纳入军事体系。马恩出租车的经验，将成为波兰军队快速集结的灵感来源。"

PLX_POL_mix_constitution:0 "混合宪法"
PLX_POL_mix_constitution_desc:0 "国王颁布一部混合宪法，把君主制、贵族院与民选议会糅合在一起。国王保留行政与外交大权，议会获得有限的立法权，贵族则保住上院席位。这部宪法试图让所有人满意，却也可能让所有人都不满意。"

PLX_POL_deluge:0 "我即浪潮"
PLX_POL_deluge_desc:0 "国王以我即浪潮自诩，宣称自己像大洪水一样不可阻挡，要冲垮旧秩序的一切障碍。王权被塑造成一种自然力量，宫廷宣传把国王描绘成席卷波兰的救世主。这个意象既令人敬畏，也暗示着一种危险的专制。"

PLX_POL_state_charity:0 "国家慈善"
PLX_POL_state_charity_desc:0 "萨瓦尔托国王以慈善之名向穷人施舍面包与住所，试图用恩惠换取民心。国家救济机构在各地建立，教会与宫廷共同分发物资。慈善掩盖了王权的脆弱，却也让饥饿的民众暂时安静下来。"

PLX_POL_new_piast_order:0 "新皮亚斯特骑士团"
PLX_POL_new_piast_order_desc:0 "萨瓦尔托国王组建起一支以皮雅斯特为名的新骑士团，成员多为忠于王室的年轻贵族与军官。骑士团被赋予维护秩序、镇压异见的特权，成为王权的武装支柱。一个古老的王朝神话，被重新锻造成现代的统治工具。"

PLX_POL_social_reform:0 "社会改革"
PLX_POL_social_reform_desc:0 "在萨瓦尔托国王的推动下，波兰开始一场自上而下的社会改革，涉及土地、劳动与教育。改革旨在缓和阶级矛盾，同时把现代化的成果牢牢控制在宫廷手中。国王希望用改革证明，君主制同样可以带来进步。"
PLX_POL_sobieski:0 "索别斯基家族的国王！"
PLX_POL_sobieski_desc:0 "索别斯基家族的名字与维也纳之战的荣耀紧紧相连，如今其后裔约翰回到波兰争夺王位。他承诺恢复这个古老家族尚武、虔诚与慷慨的传统。若他当选，波兰将再次拥有一位以骑兵与信仰著称的国王。"

PLX_POL_pilsudski:0 "毕苏斯基家族的国王！"
PLX_POL_pilsudski_desc:0 "毕苏斯基家族的雅德威加被推上王位候选人的位置，她的姓氏本身就是对独立与军事荣誉的承诺。军团派与旧部希望她能延续元帅的遗志，把波兰变成一个强大而尚武的国家。一位女王的加冕，或许会让整个东欧为之侧目。"

PLX_POL_remember_marshall:0 "纪念元帅"
PLX_POL_remember_marshall_desc:0 "新王朝把毕苏斯基元帅奉为国家之父，修建纪念碑、博物馆与纪念馆。元帅的画像与国王的肖像并排悬挂，军团传统成为官方意识形态的一部分。通过纪念元帅，王室试图继承他的威望与军队的忠诚。"

PLX_POL_integrate_legion:0 "整合军团联盟"
PLX_POL_integrate_legion_desc:0 "政府把分散的退伍军人、军团旧部与准军事组织整合进国家体系。老兵获得土地、养老金与荣誉，条件是宣誓效忠新国王。军团的精神被制度化，成为王权最可靠的武装后盾。"

PLX_POL_poland_spirit:0 "波兰精神"
PLX_POL_poland_spirit_desc:0 "国家开始大力宣扬一种以牺牲、荣誉与团结为核心的波兰精神。学校、军队与教会共同塑造这种民族气质，把个人命运与王国的存亡绑在一起。波兰精神成为新政权的精神支柱，也成为动员战争的工具。"

PLX_POL_teetotalism:0 "禁酒主义"
PLX_POL_teetotalism_desc:0 "新国王以禁酒令整顿社会风气，宣称酒精是贫困与堕落的根源。酒馆被关闭，酒税被取消，教会与警察共同监督民众的私生活。这场道德运动让国库受损，却让宫廷赢得了虔诚者的掌声。"

PLX_POL_christian_moral:0 "基督教道德"
PLX_POL_christian_moral_desc:0 "国家以基督教道德为纲，重新制定关于婚姻、家庭与公共行为的规定。教会获得更大的社会影响力，而世俗的享乐文化则受到压制。波兰被描绘成一个虔诚的堡垒，抵御着现代世界的腐化。"

PLX_POL_united_states_poland:0 "波兰合众国"
PLX_POL_united_states_poland_desc:0 "国王提出一个宏大的计划，要把波兰改造成一个由各地区自治组成的合众国。地方议会将获得有限自治权，而王室则作为统一的象征凌驾其上。这个方案既安抚了地方精英，也为王权披上了现代联邦的外衣。"
KX_PL_PG_hail_king_family:0 "国王与他的家庭万岁！"
KX_PL_PG_hail_king_family_desc:0 "激进的保皇派希蒙·杰日戈夫斯基已经被选为新首相，他所信奉的“科学君主制”将把波兰引向一个新时代。"

KX_PL_PG_social_hygiene:0 "促进社会卫生"
KX_PL_PG_social_hygiene_desc:0 "杰日戈夫斯基医生曾经参与过俄罗斯帝国的抗击流行病行动，霍乱病人的惨状令他久久无法释怀。为了防止这一可怕的瘟疫来到我们的祖国，一系列增强人民卫生意识的行动已经被执行。波兰曾经能在黑死病收割欧亚之时屹立不倒，假如未来再有传染病袭来，波兰必将再次战胜它！"

KX_PL_PG_king_power_cell:0 "君权细胞授"
KX_PL_PG_king_power_cell_desc:0 "君主权力确实来自上帝：它是自然的，来自于上帝的教义；君主制源自细胞生命的本质，每一个细胞都是小小的王国，细胞核是国王，细胞器则是臣民；而自然便是上帝这一神圣旨意的翻译官。难道我们，上帝的仆人，不应该遵从这神圣自然的命令吗？细胞能够成功的组装成各式各样的生物，难道它的自然发展结果——君主制不能拯救波兰吗？"

KX_PL_PG_democracy_disease:0 "民主乃精神传染病"
KX_PL_PG_democracy_disease_desc:0 "有一种瘟疫，比鼠疫更致命，比霍乱更骇人——它不但杀死人类，更能破坏精神，扭曲心智，让人们沉迷于幻像之中——更可怕的是这种疾病还在不断扩散，而人们却未曾察觉！\n这种疾病唤为民主——马克西米利安·罗伯斯比尔是这瘟疫的零号病人，他的理论毁灭了社会的中枢神经，用人为刺激和由平等幻象引发的无政府情绪感染人民。不幸中的万幸是，杰日戈夫斯基医生有一剂良药，那就是君主制。遗憾的是，许多感染者反抗这一治疗，如同精神病人总感觉自我良好一般。新的精神病院将会建立，这些民主派将呆在这里直到他们康复。"

KX_PL_PG_monarchy_highest_form:0 "君主制，社会最高最终形态"
KX_PL_PG_monarchy_highest_form_desc:0 "君主制起源于家庭制度。家庭通过自然法则的发展，成为祖先制度的基础，而祖先制度又发展成部落制度。在部落制度中，酋长的权力尚未世袭，但随着时间推移，权力逐渐成为世袭，导致了首批君主制的诞生。这是社会的进化——如同单细胞生物经历一系列自然选择，最终进化为最高等的人类一般。在这一过程中，大脑的产生至关重要；而我们的大脑——君主亦然。在君主的领导下，全国上下团结一致，劲往一处使，正如同大脑统筹调配一切资源来保证生物体高效运作一般。"

KX_PL_PG_father_love_son_king_love_people:0 "父亲爱子女，国王爱人民"
KX_PL_PG_father_love_son_king_love_people_desc:0 "在家庭中，作为由两个异性恋个体组成的有机体，各自拥有自己的神经系统，驱动力没有独立的器官来产生它，因此这种力量成为组成个体中更强的部分。正是在丈夫和父亲的这种身体优势下，他对妻子和孩子的指导也由此形成。父亲养育和保护家庭的义务，与他作为家庭上级的权利密不可分，是同一本能的因素，这一自然法则被称为父爱，而这就是君主权力的源泉，家庭父亲的权利和义务在演变过程中传给了君主。父爱权力本质上是唯一一种能力与爱在基因上不可分割地相连的天赋力量，国王会像父亲爱儿子一样爱着他们的臣民。"

KX_PL_PG_polish_ubermench:0 "优生优育，培养波兰超人"
KX_PL_PG_polish_ubermench_desc:0 "社会达尔文主义与优生学的确是有趣且有益的思想——昆虫繁殖过多会导致严重的环境问题，平民也是一样的。国家将会采取措施限制平民生育，违者将被强行绝育；而贵族将会被鼓励生育，为国家生产优质的子孙后代，在未来他们将成为的国家的柱石。"

KX_PL_PG_chemical_angel:0 "化学天使"
KX_PL_PG_chemical_angel_desc:0 "上帝不存在！”许多科学家都曾这么说。然而他们的同事，杰日戈夫斯基医生明白，他们的傲慢才是真正的愚昧：假如他们取身体一部分于显微镜下观看，他们定能见到天使们的真身——遗传物质。上帝的旨意写在他们的身体上，而他们坚定不移地执行。是的，上帝就在我们体内——对于社会也是同理。神圣的罗马天主教信仰，是波兰民族文明的化身，在不幸和苦难中是我们民族理想的保护者，在独立时代是取之不尽的道德宝库， 国家的利益将建立在这些基础上，任何政教分离提议都是对上帝于自然赤裸裸的亵渎。"

KX_PL_PG_organic_society_harmony:0 "社会有机体协调一致"
KX_PL_PG_organic_society_harmony_desc:0 "设想有这样一个生物：它的每个细胞都各自为政，单独且互相冲突，都能用其个体意志影响其统治中心的决策，这样的生物体能存活哪怕一秒钟吗？而一个基于普选的政治体系，一个分裂国家、由数百名对任何人个人都不负责任的议员决定政治方向的政党制度与其别无二致，最终必然导致彻底的疯狂。而在君主制中，国王履行着完全相同的职能，即像大脑一样引导生物系统。我们面临两种选择：要么保持民主制度但国家灭亡，要么通过向绝对君主制转变而发展。波兰人民们，你们还能选什么呢？"

KX_PL_PG_patriotism_instinct:0 "爱国主义本能"
KX_PL_PG_patriotism_instinct_desc:0 "民族是独特的民族群体，由几个世纪的共存、合作和公共区域居民的杂交形成，具备特定的生理和心理特征，并以民族独特性为纽带，基于个体与整个民族、其过去的基因联系以及未来延续这种关系的愿望而形成的。维持这种感觉的因素是一种特定的“驱动力”，称为民族本能或爱国主义。这种驱动力表现为三种形式：不断维护民族身份、特定民族文化以及明确的民族特征。谁人闻祖国胜利，不会激动狂喜？闻祖国失败，不会低声抽泣？然而，有时“民族的心理潜力”会在外部因素的影响下耗尽，这些因素对维护民族的意志和民族文化的特殊性产生破坏性影响：如今，这种负面影响尤其由犹太人、布尔什维克分子、共济会与德国人散播。所有的波兰人在看见这四类人的时候，都应该如条件反射一般，用能拿到的一切东西将其殴打屠杀。"

KX_PL_PG_blue_blood_oil:0 "蓝血机油"
KX_PL_PG_blue_blood_oil_desc:0 "君主制——而且是世袭的君主制——是所有体系中最好的，构成了从简单有机体到日益复杂生物进化过程中的最高发展阶段。君主权力的遗传使民族有机体的驱动力永恒，正如家族的驱动力使后代永生一样。只有世袭君主制的宪法才使民族和民族国家得以诞生。因此，不是民族创造国家，而是国家创造民族。由于遗传的稳定，协调一人的统治对于所有领域的整体进步也至关重要，这将还保证了国家本身的效率。这就是为什么在危机时刻，比如战争或自然灾害，即使在民主国家，也没有人反对将全部权力交给个人。"

KX_PL_PG_immune_system_order:0 "免疫系统骑士团"
KX_PL_PG_immune_system_order_desc:0 "假如一个人感染了病毒，他的身体会怎么做？坐以待毙吗？我们都见过得了小病后自我痊愈的人。这全部归功于我们体内那套精妙的免疫系统：细胞与细胞分泌物构建了一条难以突破的防线，免疫细胞则可以轻松消灭入侵者。我们的祖国也病了，病的相当重——德国人与犹太人用波兰人的土地疯狂复制，共济会与社会主义者正谋划着如何摧毁波兰国家。毫无疑问波兰需要自己的免疫系统，而这可以通过重建历代伟大国王的骑士团得以解决。当然，还需一味药物辅助：戒严令。有了它，骑士团就可以放开手肃清一切感染波兰的病原体了。他们在破坏国家的时候没留情面，我们也不需要好好对待他们。"

KX_PL_PG_poland_recovered:0 "痊愈出院！"
KX_PL_PG_poland_recovered_desc:0 "我们的祖国波兰曾经重病缠身——犹太病毒与社会主义细菌腐蚀着它的内在，德国寄生虫与共济会真菌吞噬着它的外在。多亏了主治医生杰日戈夫斯基开出的君主制药方，波兰已经几乎完全痊愈了。但不要忘记继续用药——因四类人仍在国界外窥视。痊愈之后，便是向那些对波兰下毒的魔鬼清算的时刻了。"
plxv2.109.t:0 "社会主义盟友？"
plxv2.109.d:0 "虽然立场更偏左，尤其是在社会议题上，但波兰社会党依然是议会中潜在的盟友，可用于制衡国家民主党的影响力。他们的观点也倾向于工人路线。或许我们应该考虑建立正式的合作伙伴关系，组建‘红蓝’联盟。"
plxv2.109.a:0 "与波兰社会党结盟是个好主意"
plxv2.109.b:0 "我们将靠自己应对……"

plxv2.105.t:0 "党内的转变"
plxv2.105.d:0 "我们的政策正使我们越来越定位于政治光谱的左端。虽然仍然致力于基督教民主的理想，但许多人已经开始将党内的我们这一派系及我们的政策称为‘保守社会主义’，或许他们说得对，我们代表了一种非马克思主义的社会主义形式。但无论标签如何，这种转变是真实存在的，而我们阵营的加强可能带来深远的后果……"
plxv2.105.a:0 "如果俾斯麦能被称为‘国家社会主义者’，那我们肯定比他更甚！"

plxv2.106.t:0 "不那么基督教民主"
plxv2.106.d:0 "随着该党越来越向左转，安托尼·西扎克已掌控政府。西扎克一直是个特殊的政治人物，来自大波兰地区，曾是德国社会民主党成员，但在移居新成立的波兰国家后，却与基督教民主党人结盟；审视他的观点时，其特殊性便开始显现，尤其是他的反教权主义，这使他与基督教民主运动的基本信条相悖。尽管如此，他的非马克思主义社会主义形式在党内找到了立足之地，成为连接其他运动的桥梁，这是一个非常有用的资产。现在他完全掌权，人们或许可以预见他会实施更激进的社会政策，预示着国民劳工运动的形成。时间会证明一切……"
plxv2.106.a:0 "基督教道德不一定与反教权主义相矛盾……"
plxv2.139.t:0 "科学君主制"
plxv2.139.d:0 "凭借新获得的权力，我们的君主决定转向科学君主制主义运动，以期为其政府提供思想基础。关于政府形式的具体细节仍需进一步明确，但尽管王室委员会的反对者在选举中落败，许多人仍对新政府抱有期待。"
plxv2.139.a:0 "我们将会加强君主权力。"
KX_PL_AS_PRACTICAL_IMPLEMENTATION:0"实践中的社会主义"

KX_PL_AS_PRACTICAL_IMPLEMENTATION_desc:0"我们的政府终于处于能够实施经济计划的地位，并且不会做出任何妥协！实施经济学家们的想法的时候到了……"

KX_PL_AS_NOT_SO_MARKET:0"不那么市场的“市场经济”"

KX_PL_AS_NOT_SO_MARKET_desc:0"尽管兰格的经济模式被许多人称为'市场社会主义'，但这一定义并不准确，因为在这种模式下，经济仍将是公有制，同时利用价格机制确保生产效率，并且仅在微观经济层面基于预设的计算引入部分市场力量。然而，无论我们如何称呼它，兰格的愿景即将在我国实施，有望将人民的福祉提升到新的高度。"

KX_PL_AS_PLANNING_BUREAU:0"中央计划局"

KX_PL_AS_PLANNING_BUREAU_desc:0"兰格经济计划的重要组成部分是'中央计划局'。它将规划经济发展，对利润进行再投资，并向工人提供来自共同拥有的生产资料的股息。它在某种程度上独立于政府运作，这标志着对社会主义经济采取了一种更侧重于管理的方法。"

KX_PL_AS_MARKET_SIMULATION:0"市场模拟"

KX_PL_AS_MARKET_SIMULATION_desc:0"'兰格模式'的核心是动态价格管控体系。计划者通过试错的方式设定价格，这将有助于企业调整生产。"

KX_PL_AS_MIRACLE_ON_VISTULA:0"维斯瓦河奇迹"

KX_PL_AS_MIRACLE_ON_VISTULA_desc:0"我们的经济正在蓬勃发展，许多人已将我们的努力称为'经济奇迹'。然而，这并非'奇迹'，而是我们政策的结果！"

KX_PL_AS_SOCIALIST_KEYNESIANISM:0"社会主义凯恩斯主义"

KX_PL_AS_SOCIALIST_KEYNESIANISM_desc:0"米哈尔·卡莱茨基被称为'社会主义的凯恩斯'或'马克思主义的凯恩斯'，但事实上是他最先提出了'凯恩斯主义'理论。然而，与凯恩斯不同，这些理论引导卡莱茨基支持计划经济形式（以实现充分就业），尽管这种形式比所谓的'指令性经济'更为复杂，包含了分权化要素和强大的工人监督。\n因此，任命他为我们的经济顾问，我们可以期待我国经济达到更高的水平。"
KX_PL_SOC_rise_Natolinism:0"纳托林主义的崛起"
KX_PL_SOC_rise_Natolinism_desc:0"纳托林派在党内迅速崛起，他们主张把共产主义与波兰的民族利益结合起来。这群强硬派认为，只有铁腕与纪律才能让革命在强邻环伺中生存下去。随着他们掌权，波兰的红色政权将走上一条更加民族主义、更加严酷的道路。"

KX_PL_SOC_tribute_to_partisans:0"向游击队致敬"
KX_PL_SOC_tribute_to_partisans_desc:0"游击队是革命最忠诚的战士，他们的牺牲不能被遗忘。新政权将公开表彰这些在森林与城市中战斗的勇士，把他们的故事写进国家的记忆。对游击队的致敬，也是在向全体人民宣告：武装斗争仍是革命的核心。"

KX_PL_SOC_award_patriot_workers:0"奖励爱国工人"
KX_PL_SOC_award_patriot_workers_desc:0"那些在工厂中超额完成生产、把国家利益置于个人之上的工人，理应得到国家的嘉奖。我们将以勋章、住房与优厚待遇奖励这些爱国劳动者，让他们成为全体工人的榜样。这不仅是对勤劳的肯定，更是对革命忠诚的检验。"

KX_PL_SOC_reign_of_general:0"将军的统治"
KX_PL_SOC_reign_of_general_desc:0"米奇斯瓦夫·莫恰尔将军是纳托林派中最强硬的军人，他主张以民族社会主义的铁腕来统治波兰。革命不能只靠口号，还需要军队般的纪律与秩序。在莫恰尔的统治下，波兰将变成一个高度军事化的革命国家。"

KX_PL_SOC_defected_endecja:0"变节的民族民主党"
KX_PL_SOC_defected_endecja_desc:0"斯坦尼斯瓦夫·格拉布斯基曾是民族民主党的重要人物，如今他看清了历史的方向，决定投身革命阵营。他的组织能力与群众基础，正是新政权所需要的。接纳这位变节的领袖，既能削弱右翼反对派，也能为民族共产主义注入新的力量。"

KX_PL_SOC_only_true_communism:0"真正的共产主义"
KX_PL_SOC_only_true_communism_desc:0"卡齐米日·米亚尔自诩为真正纯粹的共产主义者，指责其他派别都已被修正主义腐蚀。作为民族共产主义者，他要重新确立革命的教条，清洗一切不够坚定的分子。在他的词典里，只有最激进、最忠诚的人才有资格领导国家。"

KX_PL_SOC_enpower_catholic_church:0"强化天主教会地位"
KX_PL_SOC_enpower_catholic_church_desc:0"在波兰，天主教信仰深植于每一个村庄与家庭，强行消灭它只会激起反抗。纳托林派选择与教会妥协，赋予教会更大的社会地位，以换取其对政权的支持。红色的波兰与天主教的波兰，将在这种奇特的联盟中暂时共存。"

KX_PL_SOC_erdicrate_jew:0"扼杀世界主义威胁"
KX_PL_SOC_erdicrate_jew_desc:0"纳托林派把世界主义者视为民族共同体的毒瘤，认为他们破坏波兰的团结与革命纯洁性。一场针对所谓世界主义的运动将席卷全国，知识分子、少数族裔与异见者都将成为目标。这是民族共产主义最黑暗的一面，但政权深信这是必要的清洗。"

KX_PL_SOC_patriotic_union:0"组建爱国联盟"
KX_PL_SOC_patriotic_union_desc:0"为了巩固统治，纳托林派将联合一切愿意支持民族事业的团体，组建一个广泛的爱国联盟。工人、农民、军人乃至部分教会人士，都将在爱国主义的旗帜下被纳入其中。这个联盟的名义是团结，实质却是把整个社会牢牢绑在党的战车上。"

KX_PL_SOC_no_libtards:0"根除自由主义毒素"
KX_PL_SOC_no_libtards_desc:0"自由主义被纳托林派视为腐蚀革命意志的毒素，必须在它蔓延之前彻底根除。报刊、大学与议会中的自由派声音将遭到压制，任何主张妥协与改良的人都将被清算。在革命的名义下，波兰的公共生活将变得空前单调而严酷。"

KX_PL_SOC_denounce_global_revisionism:0"谴责国际修正主义"
KX_PL_SOC_denounce_global_revisionism_desc:0"在第二国际的废墟上，许多所谓的社会主义者早已背弃了革命的初衷，沦为改良主义的奴仆。纳托林派将公开谴责这些国际修正主义者，宣称只有自己才是真正的革命者。这场论战将把波兰推向国际共产主义运动的对立面。"

KX_PL_SOC_purge_Pulawians:0"清洗普瓦维集团"
KX_PL_SOC_purge_Pulawians_desc:0"普瓦维集团是党内另一支势力，他们的存在威胁着纳托林派的绝对权威。一场精心策划的清洗将把他们逐出领导层，甚至送进监狱。革命内部的敌人，有时比外部敌人更加危险。"

KX_PL_SOC_proteriat_dictatorship:0"无产阶级专政"
KX_PL_SOC_proteriat_dictatorship_desc:0"无产阶级专政不是一句空话，而是要用铁腕把旧社会的残余彻底碾碎。国家机器将公开以镇压为职责，任何反抗都将被无情粉碎。在纳托林派看来，专政越彻底，革命就越安全。"

KX_PL_SOC_natdem_synd:0"民族民主工团主义"
KX_PL_SOC_natdem_synd_desc:0"纳托林派试图把民族民主的群众基础与工团主义的组织方式结合起来，形成一种独特的民族工团主义。工会将被纳入国家体系，成为动员生产与战争的工具，而不再是工人自主的堡垒。这是对工团主义理想的彻底扭曲。"

KX_PL_SOC_nationalism_to_socialism:0"以民族主义实现共产主义"
KX_PL_SOC_nationalism_to_socialism_desc:0"纳托林派坚信，在波兰这样的国家，民族主义不是共产主义的敌人，而是通往共产主义的桥梁。当民族情感与阶级斗争合流，革命将获得前所未有的动员力。这条道路的终点，是一个以民族为壳、以专政为核的红色国家。"

KX_PL_SOC_left_militarism:0"先军主义政策"
KX_PL_SOC_left_militarism_desc:0"纳托林派把军队置于国家生活的中心，主张以军事优先的原则组织整个社会。工厂为军队生产，青年被送入军营，一切资源都优先供应武装力量。在这个国家里，士兵将成为最受尊敬的公民。"

KX_PL_SOC_end_socialist_nobles:0"香蕉青年的末日"
KX_PL_SOC_end_socialist_nobles_desc:0"那些自命清高、沉迷享乐的香蕉青年——出身优渥却伪装激进的年轻左翼——将不再被容忍。纳托林派视他们为革命的寄生虫，一场运动将把他们从特权地位上拉下来。革命需要的是劳动者与战士，而不是沙龙里的空谈家。"

KX_PL_SOC_labor_displine_moral:0"劳动，纪律，道德"
KX_PL_SOC_labor_displine_moral_desc:0"纳托林派为全体人民定下三条准则：劳动、纪律、道德。懒惰与放纵将被视为反革命行为，而勤勉、服从与清教徒式的生活则受到推崇。国家要用铁一般的道德秩序，塑造出符合革命需要的新人。"
KX_PL_KLER_A_NEW_KINGDOM:0 "新型王国"
KX_PL_KLER_A_NEW_KINGDOM_desc:0"教士们走上政治前台，宣告一个以信仰为基石的新型王国诞生。国家将由教会与虔诚的世俗精英共同治理，世俗的党派争斗被斥为腐败的根源。在这个新王国里，上帝的旨意将成为一切法律的最终依据。"

KX_PL_KLER_OLD_CLERGY:0 "旧日的教会"
KX_PL_KLER_OLD_CLERGY_desc:0"旧日的教会掌握着土地、财富与人心，他们愿意与新政权合作，以换取自身特权的延续。主教与修道院长将成为王国最有权势的领主，乡村的秩序仍由钟声与布道维系。这是传统与权力的一场古老联姻。"

KX_PL_KLER_YOUNG_CLERGY:0 "今日的神圣"
KX_PL_KLER_YOUNG_CLERGY_desc:0"年轻一代的神职人员主张教会应当走出圣器室，拥抱现代社会。他们愿意与世俗政党对话，用社会改良来证明信仰的价值。今日的神圣不再只是古老的仪式，而是一场面向未来的改革运动。"

KX_PL_KLER_RADICAL_CLERGY:0 "明日的信仰"
KX_PL_KLER_RADICAL_CLERGY_desc:0"激进的神职人员认为，教会必须与旧制度彻底决裂，成为穷人与被压迫者的先锋。他们要的不仅是改良，而是一场以福音为名的社会革命。明日的信仰将烧毁旧教会与旧国家的殿堂。"

KX_PL_KLER_HOLY_PREMIERSHIP:0 "神权首相制"
KX_PL_KLER_HOLY_PREMIERSHIP_desc:0"政府首脑将由一位高级神职人员担任，他以教会会议的名义行使行政权力。世俗政客只能充当顾问，真正的决策出自神权首相的密室。这是教会对国家机器最直接的掌控。"

KX_PL_KLER_APPEAL_TO_POOR_SOULS:0 "向贫困灵魂呼吁"
KX_PL_KLER_APPEAL_TO_POOR_SOULS_desc:0 "."

KX_PL_KLER_SUSPEND_POLITICAL_SYSTEM:0 "终结世俗权威"
KX_PL_KLER_SUSPEND_POLITICAL_SYSTEM_desc:0"世俗政党与议会将被无限期停摆，一切政治权力移交给教会会议。选举被斥为分裂人民的闹剧，国家的统一由信仰来保证。世俗权威的终结，意味着神权政治的彻底确立。"

KX_PL_KLER_EXPAND_SENATE_SEATS:0 "增加参议院院席位"
KX_PL_KLER_EXPAND_SENATE_SEATS_desc:0"参议院将向神职人员与教会支持的团体开放，以确保立法机构牢牢掌握在信仰的守卫者手中。新增的席位看似扩大了代表性，实则巩固了教会对立法权的垄断。参议院从此成为教会的延伸。"

KX_PL_KLER_PROGRESSIVE_CHURCH:0 "基督教的进步本质"
KX_PL_KLER_PROGRESSIVE_CHURCH_desc:0"激进派宣称基督教本质上是一种进步的力量，耶稣首先是穷人与弱者的解放者。教会将支持土地公有、工人自治与社会平等，把福音变成革命的纲领。保守的神职人员被斥为背叛基督的伪君子。"

KX_PL_KLER_REFORMING_IN_JESUS_IMMAGE:0 "按基督之愿重塑社会"
KX_PL_KLER_REFORMING_IN_JESUS_IMMAGE_desc:0"社会将按照基督的形象被彻底重塑：没有富人凌驾于穷人之上，没有强者压迫弱者。激进的神职人员要用信仰的火焰焚烧一切不公，建立一个地上的天国。这场改革没有妥协的余地。"

KX_PL_KLER_HOLY_STRATOCRACY:0 "神圣军事政治"
KX_PL_KLER_HOLY_STRATOCRACY_desc:0"激进的神职人员把教会改造为军事化的组织，神父与军官共同执掌国家。国家被描述为一座神圣的军营，每一个公民都是为信仰而战的士兵。神圣与暴力在这里合为一体。"

KX_PL_KLER_BENELOVENT_THEOCRACY:0 "仁慈神权统治"
KX_PL_KLER_BENELOVENT_THEOCRACY_desc:0"教会宣称要以仁慈与怜悯来治理国家，让神权统治带上温和的面具。贫困者将得到施舍，病人将得到照护，但这一切都以服从教会为前提。仁慈的背后，仍是不容挑战的神权秩序。"

KX_PL_KLER_CLERICAL_OLIGARCHY:0 "神权寡头"
KX_PL_KLER_CLERICAL_OLIGARCHY_desc:0"国家权力将集中于少数高级神职人员手中，形成一个以主教团为核心的神权寡头政权。他们以神意之名统治，世俗议会不过是装点门面的摆设。波兰将成为一座由祭坛与权杖共同治理的国家。"

KX_PL_KLER_ABSORB_SOCIALIST_INFLUENCE:0 "倾听羔羊的愤怒"
KX_PL_KLER_ABSORB_SOCIALIST_INFLUENCE_desc:0"教会承认工人对不公的愤怒有其道理，并试图把这种愤怒纳入教会的怀抱。神父们将支持有限的社会改革，以换取工人放弃革命的念头。倾听羔羊的愤怒，是为了让羊群继续留在牧人的圈栏里。"

KX_PL_KLER_MIDDLE_CALSS_MORALITY:0 "颂扬中产阶级道德"
KX_PL_KLER_MIDDLE_CALSS_MORALITY_desc:0"教会把中产阶级的勤劳、节俭与家庭观念捧为国民道德的典范。商人与手工业者被鼓励以信仰约束贪婪，以慈善缓和剥削。一个虔诚而守序的中产阶级，被视为王国最稳固的支柱。"

KX_PL_KLER_CLASS_BLIND_UNIONS:0 "工会无阶级，如神视世人"
KX_PL_KLER_CLASS_BLIND_UNIONS_desc:0"教会组建不分阶级的工会，宣称在上帝眼中工人与雇主并无高下之分。劳资双方将在神父的调解下协商，而不是以罢工和对抗解决问题。这样的工会看似公正，实则把工人的斗争消解在祈祷与妥协之中。"

KX_PL_KLER_COUNCILS_OF_WORKERS_AND_CAPITALISTS:0 "劳资委员会"
KX_PL_KLER_COUNCILS_OF_WORKERS_AND_CAPITALISTS_desc:0"教会设立由工人与资本家共同组成的委员会，试图以合作取代冲突。委员会在教会的监督下决定工资与生产，罢工被视为不道德的行为。这是神权政权对工业社会的一种妥协，也是对阶级斗争的一次驯化。"

KX_PL_KLER_JESUS_COMMUNIST:0 "笃信者之先锋队"
KX_PL_KLER_JESUS_COMMUNIST_desc:0"激进的神职人员组建起一支笃信者的先锋队，把基督的教诲与共产主义的目标结合起来。他们相信，只有消灭私有制，才能真正实现天国。这支先锋队既是传教士，也是革命者。"

KX_PL_KLER_PARISH_ECONOMIC_PLANNING:0 "教阶官僚制"
KX_PL_KLER_PARISH_ECONOMIC_PLANNING_desc:0"教区将成为经济计划的基本单位，神父与教区委员会共同管理土地、作坊与粮食分配。教阶制度被改造成一套经济官僚体系，从主教到乡村神父都在计划链条上各司其职。信仰的组织变成了生产的组织。"

KX_PL_KLER_APOSTOLIC_EQUALITY:0 "使徒平等"
KX_PL_KLER_APOSTOLIC_EQUALITY_desc:0"教会宣布所有信徒在上帝面前一律平等，神职人员也不应享有凌驾于信徒之上的特权。教会的财产将被公有化，主教与普通神父同吃同住。使徒时代的平等，被重新搬进了二十世纪的政治。"

KX_PL_KLER_SIN_OF_PRIVATE_PROPERTY:0 "私有财产之罪"
KX_PL_KLER_SIN_OF_PRIVATE_PROPERTY_desc:0"激进派宣布私有财产本身就是一种罪，因为它让人剥削人、让少数人垄断上帝的恩赐。国家将没收教会与贵族的田产，把一切交还给劳动者共同体。这是一场以神学语言包装的财产革命。"

KX_PL_KLER_SEPARATION_FROM_VATICAN:0 "与梵蒂冈决裂"
KX_PL_KLER_SEPARATION_FROM_VATICAN_desc:0"波兰教会宣布脱离梵蒂冈的管辖，自立为一个真正属于人民的民族教会。罗马的权威被斥为保守与腐败的象征，波兰的神职人员要自己解释福音。这场决裂既是宗教的，也是政治的。"

KX_PL_KLER_AGRICULTURAL_REFORM:0 "仁慈乡村之必需"
KX_PL_KLER_AGRICULTURAL_REFORM_desc:0"为了平息乡村的怨气，教会推动一场以仁慈为名的农业改革。教会土地将被部分分给无地农民，但所有权仍牢牢掌握在教会手中。改革足以缓解饥饿，却不足以触动旧秩序的根本。"

KX_PL_KLER_COLABORATIVE_AGRICULTURE:0 "合作农业"
KX_PL_KLER_COLABORATIVE_AGRICULTURE_desc:0"教会推动地主与农民在教区的监督下合作耕作，以基督之爱调和田地上的矛盾。土地不被没收，而是通过契约与互助组织重新分配收益。乡村的阶级冲突被包装成一场兄弟般的合作。"

KX_PL_KLER_CRITICISE_CLASS_WARFARE:0 "批判革命思想的谬误"
KX_PL_KLER_CRITICISE_CLASS_WARFARE_desc:0"教会公开谴责阶级斗争的学说，认为它煽动仇恨、撕裂上帝的子民。布道坛将成为反击革命的讲台，神父们用信仰的语言瓦解工人的怒火。社会的不平等被解释为神圣秩序的一部分，任何反抗都是对上帝的冒犯。"
KX_PL_KLER_PATROIT_PRIESTS:0 "爱国牧师"
KX_PL_KLER_PATROIT_PRIESTS_desc:0"教会号召神父们成为爱国者，把对上帝的爱与对祖国的爱合而为一。布道坛上将同时宣讲福音与民族使命，神职人员成为动员人民的精神领袖。爱国牧师既是信仰的守护者，也是国家的宣传员。"
KX_PL_KLER_HOLY_DEMOCRACY:0 " 神圣民主"
KX_PL_KLER_HOLY_DEMOCRACY_desc:0"教会与世俗民主派结盟，宣称民主制度同样可以承载神圣的使命。选举与议会将在教会的道德指导下运行，人民的声音被解释为上帝的声音。这是一种奇特的混合：既有选票，也有十字架。"

KX_PL_KLER_LOVE_AND_MERCY:0 "仁爱与仁慈"
KX_PL_KLER_LOVE_AND_MERCY_desc:0"教会把仁爱与仁慈置于教义的中心，强调上帝对罪人的宽恕而非惩罚。国家将以宽容的姿态对待异见者、少数群体与失败者，用怜悯来弥合社会的裂痕。这种温和的姿态，让神权政权显得不那么可怕。"

KX_PL_KLER_MARKET_UNDER_PLANNING:0 "计划下的自由市场"
KX_PL_KLER_MARKET_UNDER_PLANNING_desc:0"教会允许市场继续存在，但必须置于国家的道德计划之下。私有企业可以经营，却要服从教会设定的价格、工资与劳动条件。市场被保留下来，只是它的主人不再是资本家，而是神权国家。"

KX_PL_KLER_DEFEND_LIBERTY:0 "保卫自由民主"
KX_PL_KLER_DEFEND_LIBERTY_desc:0"教会公开捍卫自由与民主，反对任何形式的专制，包括以神意之名建立的专制。年轻的神职人员相信，信仰与自由并不矛盾，真正的教会应当站在被压迫者一边。这是一条危险的道路，因为它也可能削弱教会自身的特权。"

KX_PL_KLER_DECENTRALIZE:0 "分权化国家"
KX_PL_KLER_DECENTRALIZE_desc:0"国家权力将下放到地方与教区，让地方共同体自行处理土地、教育与救济事务。中央的官僚机构被削减，地方神职人员与民选代表获得更大的发言权。分权被描绘成对人性与传统的尊重。"

KX_PL_KLER_RESTORE_NATIONAL_MORAL:0 "恢复国民道德"
KX_PL_KLER_RESTORE_NATIONAL_MORAL_desc:0"教会发起一场道德复兴运动，要清除酗酒、赌博、色情与政治腐败。国家将以法律与布道双重手段整顿社会风气，把波兰人重新塑造成虔诚、勤劳、守序的民族。道德整肃的阴影，也随之笼罩了每一个私人生活。"

KX_PL_KLER_STATE_SERVES_PEOPLE:0 "国家服务人民"
KX_PL_KLER_STATE_SERVES_PEOPLE_desc:0"国家的职责被重新定义为服务人民，而不是统治人民。教会推动建立公共卫生、教育与福利体系，以证明神权政权关心每一个信徒的福祉。服务与服从在这里被巧妙地混为一谈。"

KX_PL_KLER_CENTROLOW:0 "中左派联盟"
KX_PL_KLER_CENTROLOW_desc:0"教会支持一个以基督教社会思想为基础的中左派联盟，联合工人、农民与进步知识分子。联盟主张温和的再分配与社会保障，以对抗更激进的革命派。教会试图用改良来抢占左翼的道德高地。"

KX_PL_KLER_TAX_HELP_POOR:0 "税收帮助穷人"
KX_PL_KLER_TAX_HELP_POOR_desc:0"政府将征收累进税，把富人的部分财富用于救济穷人。教会宣称这是基督之爱的体现，也是防止社会撕裂的必要手段。慈善不再只是施舍，而被写进了国家的税法。"

KX_PL_SOC_eagle_of_revolution:0 "革命之鹰"
KX_PL_SOC_eagle_of_revolution_desc:0 "罗莎·卢森堡是波兰革命最耀眼的象征，她的思想将指引这个新生的红色国家。革命之鹰的归来，意味着波兰的社会主义将走出一条不同于巴黎的道路。在她旗帜下，革命既要推翻资本主义，也要捍卫民主与自由。"

KX_PL_SOC_luxenburgism:0 "提出卢森堡主义"
KX_PL_SOC_luxenburgism_desc:0 "卢森堡主义将成为波兰革命的官方理论，它与巴黎方面所推崇的集中制有着根本区别。党应当依靠群众的自觉行动，而不是把意志强加于无产阶级。这套理论将指导波兰建立一种更加民主、更加自下而上的社会主义。"

KX_PL_SOC_german_exiles:0 "集结德国流亡者"
KX_PL_SOC_german_exiles_desc:0 "德国革命失败后，大批社会主义者被迫流亡，而波兰的革命为他们提供了新的家园。这些经验丰富的同志将加入我们的队伍，把德国的革命教训带到维斯瓦河畔。流亡者的到来，也将让波兰革命与整个欧洲的工人运动紧密相连。"

KX_PL_SOC_anti_nationalism:0 "反对民族主义"
KX_PL_SOC_anti_nationalism_desc:0 "卢森堡派坚决反对把社会主义与民族主义混为一谈，认为民族国家只是资产阶级的产物。革命的最终目标是全人类的解放，而不是某个民族的强盛。因此，波兰的革命必须超越民族界限，与各国工人携手前进。"

KX_PL_SOC_worker_council:0 "建立工人委员会"
KX_PL_SOC_worker_council_desc:0 "工人委员会是卢森堡主义的核心，工厂应当由在那里劳动的人来管理。国家将把经济决策权下放到基层委员会，让工人真正成为生产资料的主人。只有依靠群众的自我组织，社会主义才不会蜕变为官僚统治。"

KX_PL_SOC_socialist_democracy:0 "社会主义民主制度"
KX_PL_SOC_socialist_democracy_desc:0 "社会主义不能没有民主，否则它就只是另一种形式的暴政。卢森堡派主张实行广泛的社会主义民主，允许不同意见在党内与苏维埃中自由争辩。革命的政权必须对人民负责，而不是对少数官僚负责。"

KX_PL_SOC_encourage_multinism:0 "鼓励多元主义"
KX_PL_SOC_encourage_multinism_desc:0 "卢森堡派认为，革命不应只有一种声音，多元的思想碰撞正是社会主义活力的来源。不同派别、不同民族的劳动者都可以在革命框架内表达自己的诉求。这种宽容并非软弱，而是对人民群众创造力的信任。"

KX_PL_SOC_union_without_revisionism:0 "无改良主义之新工会"
KX_PL_SOC_union_without_revisionism_desc:0 "旧工会早已被改良主义领袖把持，他们用谈判与妥协消磨工人的斗志。我们要建立新的工会，它不追求与资本家的妥协，而是以工人的直接行动为武器。这样的工会将成为革命在工厂中的坚强堡垒。"

KX_PL_SOC_weaken_national_identity:0 "弱化民族身份"
KX_PL_SOC_weaken_national_identity_desc:0 "民族身份在卢森堡派看来是一种人为的隔阂，阻碍着无产阶级的团结。国家将逐步淡化民族符号与民族叙事，转而强调阶级共同体。一个以阶级而非民族定义自身的波兰，才是革命所需要的波兰。"

KX_PL_SOC_autonomous_organization:0 "自发组织性原则"
KX_PL_SOC_autonomous_organization_desc:0 "卢森堡主义相信，群众有能力自发地组织起来，革命不应由少数人自上而下地指挥。国家将鼓励工人、农民与士兵自行建立组织，让他们的创造力从底层涌现。党的任务不是命令群众，而是支持他们的自我解放。"

KX_PL_SOC_alert_red_autocracy:0 "警惕红色独裁"
KX_PL_SOC_alert_red_autocracy_desc:0 "革命最大的危险，不是来自旧制度的反扑，而是来自革命自身蜕变为新的独裁。卢森堡派将时刻警惕党的官僚化与领袖崇拜，坚决捍卫内部的批评自由。宁可承受争论的混乱，也不接受铁板一块的专制。"

KX_PL_SOC_red_unification:0 "赤色统一"
KX_PL_SOC_red_unification_desc:0 "各派革命力量将在卢森堡主义的旗帜下实现统一，结束内部分裂。统一的红色阵线将把工人委员会、工会与社会主义政党凝聚成一股力量。只有团结起来的革命，才能抵挡外部敌人与内部倒退。"

KX_PL_SOC_liberate_women:0 "解放女性"
KX_PL_SOC_liberate_women_desc:0 "女性的解放是社会主义革命不可分割的一部分，没有女性的自由就没有真正的解放。国家将推动女性走出家庭、进入工厂与公共生活，争取平等的权利与地位。革命不仅要改变所有制，也要改变千百年来压迫女性的社会关系。"

KX_PL_SOC_socialist_humanism:0 "社会主义人道主义"
KX_PL_SOC_socialist_humanism_desc:0 "社会主义的最终目的，是让每一个人都能自由而全面地发展，而不是把人变成机器的零件。卢森堡派主张以人道主义精神指导革命，反对任何形式的非人化与残酷。革命应当使人变得更高尚，而不是更冷酷。"

KX_PL_SOC_wrongs_bolshevik:0 "布尔什维克的教训"
KX_PL_SOC_wrongs_bolshevik_desc:0 "布尔什维克在俄国的实践留下了宝贵的经验，也留下了惨痛的教训。卢森堡派将认真反思集中制、恐怖与官僚化的危害，避免重蹈覆辙。只有正视这些错误，波兰的革命才能走出自己的道路。"

KX_PL_SOC_order_no_more:0 "秩序不复井然"
KX_PL_SOC_order_no_more_desc:0 "旧秩序的瓦解不是灾难，而是新世界诞生的前提。卢森堡派拒绝用新的等级制度取代旧的等级制度，哪怕这意味着暂时的混乱。在秩序不复井然的世界里，自由的人们将学会自己管理自己。"
KX_PL_SOC_polonia_march_onwards:0 "波兰尼亚向前进"
KX_PL_SOC_polonia_march_onwards_desc:0 "未来主义者在波兰取得了胜利，他们要用电与钢铁重塑这个古老的国家。波兰尼亚向前进的口号将响彻街头，宣告一个崇尚速度、机器与革命的时代的到来。旧文化、旧道德与旧政治，都将在未来主义的洪流中被冲垮。"

KX_PL_SOC_cursed_poet:0 "被诅咒的诗人"
KX_PL_SOC_cursed_poet_desc:0 "布鲁诺·亚辛斯基——那位被诅咒的诗人——成为了未来主义革命的领袖。他的诗歌充满毁灭与重生的意象，而他的政治也同样狂热而极端。在他手中，文化革命将变成一场席卷一切的风暴。"

KX_PL_SOC_ignite_berlin:0 "点燃柏林"
KX_PL_SOC_ignite_berlin_desc:0 "革命的火焰不能只停留在维斯瓦河畔，它必须烧向柏林，烧向整个旧欧洲。未来主义者将把宣传与颠覆的触角伸向德国首都，煽动那里的工人起来反抗。柏林一旦燃起，欧洲的旧秩序就将土崩瓦解。"

KX_PL_SOC_revo_art_revo_society:0 "革命艺术，革命社会"
KX_PL_SOC_revo_art_revo_society_desc:0 "亚历山大·瓦特相信，革命的艺术与革命的社会是同一场斗争的两面。诗人、画家与剧作家将走出沙龙，把作品变成动员群众的武器。艺术不再是少数人的享受，而将成为改造社会的力量。"

KX_PL_SOC_jesus_marx_marlinetti:0 "耶稣！马克思！马里内蒂！"
KX_PL_SOC_jesus_marx_marlinetti_desc:0 "阿纳托尔·斯特恩把三种看似不相容的激情糅合在一起：基督的救世情怀、马克思的阶级革命与马里内蒂的未来主义狂热。这种奇特的混合将催生一种新的波兰民族神话。在机器与十字架之间，一个狂热的未来主义国家正在成形。"

KX_PL_SOC_turbo_lover:0 "涡轮爱意"
KX_PL_SOC_turbo_lover_desc:0 "未来主义者把爱情也视为一场速度与力量的体验，涡轮爱意正是他们对情感的革命化想象。机器时代的浪漫不再是花前月下，而是引擎轰鸣中的激情。连最私密的情感，也要被卷入现代性的漩涡。"

KX_PL_SOC_russian_comrades:0 "俄罗斯的志同道合者"
KX_PL_SOC_russian_comrades_desc:0 "在东方，俄国的未来主义者与激进革命者同样渴望焚毁旧世界。我们要与他们建立联系，让革命的火种在两国之间相互点燃。跨越边界的同志情谊，将把东欧变成一座巨大的革命实验室。"

KX_PL_SOC_slay_state_socialist_beast:0 "杀死国家社会主义野兽"
KX_PL_SOC_slay_state_socialist_beast_desc:0 "打击和削弱任何形式的国家社会主义，为更纯粹的社会主义形式铺平道路。"

KX_PL_SOC_discard_culture_civlilzation:0 "文化文明——去垃圾桶！"
KX_PL_SOC_discard_culture_civlilzation_desc:0 "在亚辛斯基看来，旧文化不过是压迫者的装饰，整个文明都该被扔进垃圾桶。未来主义者将系统性地摧毁旧的艺术、习俗与价值观，为全新的革命文化腾出空间。破坏本身就是创造的第一步。"

KX_PL_SOC_3xm:0 "3xm宣言"
KX_PL_SOC_3xm_desc:0 "斯特恩的3xm宣言把三个M——马克思、马里内蒂与某种弥赛亚式的信念——写进了未来主义的纲领。这份宣言要用机器、暴力与信仰重塑波兰人的灵魂。它既是一份艺术宣言，也是一份政治檄文。"

KX_PL_SOC_egg_grenade:0 "鸡蛋手榴弹"
KX_PL_SOC_egg_grenade_desc:0 "未来主义者把日常之物也变成武器，鸡蛋与手榴弹在他们手中同样可以砸向旧世界。这种荒诞而暴烈的行动美学，正是斯特恩一派革命风格的写照。艺术与破坏之间的界线，在这里彻底消失。"

KX_PL_SOC_female_futurism_ally:0 "女性，未来主义盟友"
KX_PL_SOC_female_futurism_ally_desc:0 "支持女性未来主义者的联盟，通过他们的理念来推动社会革命，特别是在文化和社会结构方面。"

KX_PL_SOC_holy_cause_happy_wisdom:0 "神圣事业，幸福智慧"
KX_PL_SOC_holy_cause_happy_wisdom_desc:0 "斯特恩把革命描绘成一项神圣的事业，而未来主义则是通往幸福与智慧的真理。国家将用半宗教式的宣传，把机器崇拜与革命信仰灌输给每一个公民。在这个新国家里，政治、艺术与宗教已难分彼此。"

KX_PL_SOC_final_chapter_cultural_revolution:0 "文化革命最终章"
KX_PL_SOC_final_chapter_cultural_revolution_desc:0 "文化革命进入最后的篇章，旧世界的一切残余都将被清除，一个由机器、青年与革命激情构成的新社会将取而代之。这是未来主义者梦寐以求的终点，也可能是他们最疯狂的开始。"

KX_PL_SOC_invest_degenerate:0 "投资堕落"
KX_PL_SOC_invest_degenerate_desc:0 "未来主义者要把堕落变成一种武器：资助那些挑战传统道德的艺术家与实验者，让旧秩序的卫道士惊恐不安。在他们眼中，所谓的堕落正是自由的另一种形式。国家将用金钱奖励那些最离经叛道的创作。"

KX_PL_SOC_we_bolshevik_we_cannibal:0 "我们是布尔什维克——我们食人！"
KX_PL_SOC_we_bolshevik_we_cannibal_desc:0 "这是未来主义者最骇人的宣言：革命者要像食人者一样吞噬旧世界的一切禁忌。亚辛斯基的追随者用这种极端修辞宣告，没有任何道德底线能够约束革命的创造力。恐怖与狂欢在此刻融为一体。"

KX_PL_SOC_mummy_never:0 "木乃伊永不复生！"
KX_PL_SOC_mummy_never_desc:0 "旧社会的木乃伊——那些被奉为神圣的传统与制度——必须被彻底埋葬，永不复生。未来主义者要用火焰与钢铁焚烧一切僵死的过去。只有让过去真正死去，未来才能诞生。"

KX_PL_SOC_crush_lenin_doctrine:0 "粉碎列宁主义教条"
KX_PL_SOC_crush_lenin_doctrine_desc:0 "列宁主义的教条把党变成了新的教会，把革命变成了官僚的例行公事。瓦特一派要粉碎这些教条，让革命重新成为群众自发的创造。马克思主义不是经文，而是行动的指南。"

KX_PL_SOC_useful_production_social_labor:0 "实用性生产，社会性劳动"
KX_PL_SOC_useful_production_social_labor_desc:0 "在瓦特看来，生产不应只为利润或国家指标，而应服务于社会真正的需要。劳动应当是自由的、有创造性的，而不是被异化的苦役。未来主义的社会主义要把人从无意义的劳动中解放出来。"

KX_PL_SOC_world_revolution_endless_war:0 "世界革命：无尽战争"
KX_PL_SOC_world_revolution_endless_war_desc:0 "世界革命不是一场可以宣布结束的战争，而是一场永不停歇的进程。只要还有压迫存在，革命者就必须继续战斗下去。未来主义政权将把整个国家变成一座永久的革命军营。"

KX_PL_SOC_anti_current:0 "逆流而上者"
KX_PL_SOC_anti_current_desc:0 "亚历山大·瓦特——那位逆流而上的反威权工团主义者——成为未来主义革命的三位领袖之一。他拒绝一切形式的专制，主张把未来主义艺术与工团主义的自由精神结合起来。在他的道路上，革命既要摧毁旧世界，也要防止新暴政的诞生。"

KX_PL_SOC_vistula_scatmander:0 "维斯瓦闪耀如斯卡曼德洛斯"
KX_PL_SOC_vistula_scatmander_desc:0 "阿纳托尔·斯特恩以维斯瓦闪耀如斯卡曼德洛斯为号，把波兰的河流比作荷马史诗中的英雄之河。他要把未来主义的激情注入民族传统，让波兰在机器时代重现古老的荣光。这是一场诗意的、狂热的、充满矛盾色彩的革命。"
KX_PL_ZSP_KNIGHTS_OF_RAMAJANA:0 "罗摩衍那恐怖骑士"
KX_PL_ZSP_KNIGHTS_OF_RAMAJANA_desc:0"政权从东方史诗中借来罗摩衍那的意象，组建起一支半神话式的骑士团。这些骑士既是工团国家的精锐，也是恐怖统治的执行者，用暴力维护民族革命的纯洁。古老的史诗被扭曲成现代专制的宣传工具。"
KX_PL_ZSP_SLAVS_AS_VANGUARDS:0 "复兴斯拉夫民族性格"
KX_PL_ZSP_SLAVS_AS_VANGUARDS_desc:0"政权宣称斯拉夫民族拥有独特的集体主义与牺牲精神，理应成为世界革命的先锋。学校、军队与工团共同复兴这种被遗忘的民族性格，把它塑造成波兰的国家灵魂。斯拉夫性不再是落后的标签，而成了民族工团主义的荣耀。"
KX_PL_ZSP_HERAKLES_PIAST_VIRTUE:0 "赫拉克勒斯-皮亚斯特美德"
KX_PL_ZSP_HERAKLES_PIAST_VIRTUE_desc:0"新政权把赫拉克勒斯的伟力与皮亚斯特王朝的古老美德糅合在一起，塑造出一种刚毅、勤劳而虔诚的国民理想。宣传机器把工人比作为民族完成十二项伟业的英雄。波兰人被告知，他们既是古代神话的继承者，也是现代工团国家的建设者。"
KX_PL_ZSP_HOUSING_COOPERATIVES:0 "住房合作社"
KX_PL_ZSP_HOUSING_COOPERATIVES_desc:0"住房短缺在工业化的城市中日益严重，国家决定以合作社的方式来解决。工人们可以组成住房合作社，共同出资、共同建造、共同管理自己的住宅。家不再只是栖身之所，而成为工团主义共同体生活的基本单位。"
KX_PL_ZSP_FRATENAL_WORKER:0 "工人兄弟情谊"
KX_PL_ZSP_FRATENAL_WORKER_desc:0"在民族工团主义的秩序下，工人不再是孤立的雇佣劳动者，而是兄弟般共同体的一员。国家将把各行各业的工人组织成互助的兄弟会，用团结取代阶级斗争。工人的尊严与国家的强大，将在这种兄弟情谊中合为一体。"
KX_PL_ZSP_PREIST_LIFE:0 "生命祭司"
KX_PL_ZSP_PREIST_LIFE_desc:0"民族工团主义把生命本身奉为神圣，设立起一支被称为生命祭司的团体。他们主持婚礼、葬礼与丰收仪式，用原始的宗教情感凝聚工人共同体。生命祭司既是信仰的守护者，也是政权动员民众的工具。"
KX_PL_ZSP_SLAV_ARYANS:0 "斯拉夫雅利安人的觉醒"
KX_PL_ZSP_SLAV_ARYANS_desc:0"极端民族主义理论家炮制出一套斯拉夫-雅利安精神的神话，宣称波兰人兼具斯拉夫的集体精神与雅利安的创造伟力。这套伪科学为民族工团主义提供了种族主义的理论基础，也为排斥少数族裔制造了借口。神话越宏大，现实中的压迫就越残酷。"

PLX_knights_of_ramajana:0 "罗摩衍那恐怖骑士"
PLX_slavs_as_vanguards:0 "复兴斯拉夫民族性格"
PLX_herakles_piast_virtue:0 "赫拉克勒斯-皮亚斯特美德"
PLX_housing_cooperatives:0 "住房合作社"
PLX_fratenal_worker:0 "工人兄弟情谊"
PLX_priest_life:0 "生命祭司"
PLX_slav_aryan:0 "斯拉夫雅利安人的觉醒"

POL_god_syndicalism:0 "上帝与工团"
POL_god_syndicalism_desc:0"上帝与工团成为新政权的双重旗帜，宗教的虔诚与工团主义的纪律被糅合成一种独特的国家意识形态。工人被教导要在劳动中侍奉上帝，在工团中服侍民族。教会与国家、信仰与革命，在这种奇特的结合中彼此利用。"

POL_loyal_legionaries:0 "忠诚的军团士兵"
POL_loyal_legionaries_desc:0"政权把旧日的军团传统与工团国家结合起来，培养出一批忠诚的军团士兵。他们既是工人运动的骨干，也是政权镇压异己的武装力量。军团士兵的忠诚不属于某个将军，而属于民族工团主义的革命本身。"

POL_ultimum_to_right_parties:0 "对右翼政党的最后通牒"
POL_ultimum_to_right_parties_desc:0"政权向所有右翼政党发出最后通牒：要么接受民族工团主义的新秩序，要么被彻底取缔。议会中的保守派与自由派被要求放弃旧纲领，向革命宣誓效忠。这是一场以民主之名进行的政治清洗。"

POL_seize_cartel_wealth:0 "剥夺卡特尔财富"
POL_seize_cartel_wealth_desc:0"资本家与卡特尔在危机中囤积财富，而工人却在饥饿中挣扎。新政权将以革命的名义没收这些垄断资本，把工厂、矿山与银行交给工团管理。财富的重新分配不仅是经济措施，更是对旧阶级的清算。"

POL_christian_worker_union:0 "基督教工人联盟"
POL_christian_worker_union_desc:0"上帝与工团并不矛盾，基督教的博爱可以成为工人团结的精神纽带。新政权扶植基督教工人联盟，把教会的社会教义与工团主义结合起来。工人的斗争被披上宗教的外衣，而教会则获得了在工团国家中的一席之地。"

POL_eyes_on_west:0 "紧盯西方"
POL_eyes_on_west_desc:0"民族工团主义的革命不能只局限于波兰，西方的资本主义与自由主义才是更深的敌人。政权把目光投向西方，准备支持那里的民族革命与反资本主义运动。紧盯西方，意味着波兰要在欧洲的废墟上扩张自己的意识形态影响。"

POL_cooperate_with_church:0 "与教会合作"
POL_cooperate_with_church_desc:0 ""

POL_unity_through_labor:0 "以劳动促团结"
POL_unity_through_labor_desc:0"民族工团主义宣称，劳动是团结全体公民的最高纽带，阶级、党派与教派的分歧都应在劳动中消融。国家将组织共同的劳动节、生产竞赛与互助运动，把社会锻造成一个纪律严明的共同体。通过劳动实现的团结，最终服务于政权对社会的全面控制。"
 POL_Revolutionary_Republic: "革命共和国"
 POL_Revolutionary_Republic_desc: "君主制被推翻的消息震惊了权力中心的人们，一个新的波兰工团主义共和国从废墟中崛起。新的政府尚未完全确定并将快速采取行动来加强自身并把旧的德国主导的资本主义经济改造成波兰人的、社会主义的。"
 POL_Workers_Economy: "工人经济"
 POL_Workers_Economy_desc: "工团主义国家的经济由工人运行并控制。对于一个像我们这样长期存在着根深蒂固的压迫平民的统治的国家，经济从根源上就表现出不平等。因此，我们将会开始创造一个让普通工人来掌控波兰经济的体系。"
 POL_Topple_the_Tyrants: "打倒暴君"
 POL_Topple_the_Tyrants_desc: "不止我们外部存在暴君，我们国家内部也同样有暴君。从地主到贵族，地方豪强控制着我们国家的绝大部分。虽然他们很多人在我们革命的浪潮中仓皇逃窜，但我们仍要清除掉那些留下来的人和他们的经济遗产。"
 POL_The_Myth_of_the_Revolution: "革命神话"
 POL_The_Myth_of_the_Revolution_desc: "尘埃落定，新兴工团主义国家正站在十字路口上。接下来几周我们将不得不面对我们新共和国的国体——这个抉择可能会影响波兰往后许多年甚至几十年的历史。一个新的波兰已经诞生，但是他最终会变成什么样子还有待观察。"
 POL_The_People_Must_Decide: "必须由人民决定"
 POL_The_People_Must_Decide_desc: "虽然出于对现状的担忧我们会很乐意进行集权统治，但用铁腕手段来引导国家渡过危机让我们和我们的敌人变得没有什么分别。如果我们想告诉世界我们真正的形象，以及我们真正代表谁的利益，那我们就必须允许委员会向着多元化蓬勃发展，并在工人阶级中播下民主的种子。"
 POL_Supreme_Chamber_of_Commerce: "最高工商议院"
 POL_Supreme_Chamber_of_Commerce_desc: "在参议院的旧址上成立的最高工商议院将会作为我们的工团主义“上议院”。工会将选举他们的代表进入这个议院中。毕竟，谁能比产业工人更好地领导他们自己的生产呢？在这个议院中，扎克热夫斯基的“有机劳工民主”理论将得到进一步践行。"
 POL_Land_of_Free_Men: "自由人之地"
 POL_Land_of_Free_Men_desc: "在旧的自由主义制度下，只有特定群体的自由，并把阶级分化为很多阶层来让他们保持弱势。在我们新的社会主义制度下，所有人都必须享受真正的自由，作为平等的人过完自己一生的自由，超越我们社会传统社会分化的自由。尽管向普通人脑内灌输这个观念并不容易，我们仍然应该让他们知道如何关心自己的自由。"
 POL_The_French_Model: "法国模范"
 POL_The_French_Model_desc: "作为最成功的工团主义国家，他们自然而然地成为了我们未来革命所要追随的榜样。巴黎和伦敦已经走过的弯路意味着我们不必再一次摸着石头过河，虽然我们国家的大部分地区不像法国或英国那样工业化，但我们还是可以找到让我们的农村人口参与进入这个过程的解决办法。"
 POL_Polish_Socialist_Republic: "波兰社会主义共和国"
 POL_Polish_Socialist_Republic_desc: "我们必须承认一个事实——即使我们怀着好意将我们弱小的邻国接纳到我们的国家中，我们仍会被视为征服者。一个政府要是将波兰人民拖入战争泥潭，就已经忘记了它的基本职责——改善波兰人的生活。"
 POL_Creation_of_Small_Farms: "创建小型农场"
 POL_Creation_of_Small_Farms_desc: "我们乡村地区的土地分配目前才存在着很大的问题，虽然很多人提出我们的改革应该更加谨慎，但这样的计划还不足以消除问题的根源。相反，许多人认为更彻底的土地再分配才能为农民创造一个更公平的情况。我们要从那些拥有土地的人的手中拿走土地，然后分给那些真正需要使用它们的人。"
POL_mobsters_reign: "盗匪横行！"
POL_mobsters_reign_desc:0"华沙的街头被黑帮与私酒贩子占据，盗匪横行的时代降临了。旧的政党与官僚无力维持秩序，于是把权力让给了那些掌握暴力与金钱的人。在这片混乱中，黑帮老大们开始像政治家一样统治波兰。"

POL_Papa_Tasemka: "塔谢姆卡老爹巩固控制"
POL_Papa_Tasemka_desc:0"卢卡什·谢米昂特科夫斯基——人称谢塔姆卡老爹——巩固了对华沙黑帮的控制。他出身波兰社会党，把社会主义的口号与黑帮的暴力结合在一起。在谢塔姆卡老爹的领导下，黑帮开始向政治舞台进军。"

POL_no_more_bankers: "高利贷不再"
POL_no_more_bankers_desc:0"甘茨瓦伊赫向放高利贷的银行家与钱庄开战，宣称要把穷人从债务中解放出来。13区暴徒用暴力与恐吓逼走高利贷者，然后自己接管了借贷生意。高利贷不再，只是换了一个更凶狠的主人。"

POL_integrate_Hashomer_Hatzair: "整合青年卫士"
POL_integrate_Hashomer_Hatzair_desc: "甘茨瓦伊赫把青年卫士运动整合进自己的黑帮网络，利用年轻人的理想与热血为13区暴徒服务。青年卫士的成员被派去走私、站岗与执行暴力任务，他们的锡安主义理想被黑帮的金钱腐蚀。整合青年卫士，让13区暴徒获得了一支狂热的青年队伍。"

POL_protector_of_poor: "穷人保护者"
POL_protector_of_poor_desc:0"甘茨瓦伊赫把自己包装成穷人的保护者，向犹太街区的贫民施舍面包与庇护。他打击高利贷、压低物价，用黑帮的暴力维持一种畸形的秩序。穷人保护者的名声，让13区暴徒在底层民众中赢得了支持。"

POL_welfare_corruption: "福利与腐败"
POL_welfare_corruption_desc:0"甘茨瓦伊赫建立起一套黑帮式的福利体系，用施舍与救济换取穷人的忠诚。福利资金来自走私、赌博与保护费，每一份恩惠都沾着腐败的味道。福利与腐败在他手中合为一体，成了黑帮收买人心的工具。"

POL_international_smuggle: "染指国际走私"
POL_international_smuggle_desc:0"13区暴徒把生意扩展到国际走私，利用华沙的地理位置把枪支、毒品与违禁品运往欧洲各地。甘茨瓦伊赫与各国的黑帮建立联系，把波兰变成走私网络的中转站。染指国际走私，让13区暴徒的势力超越了国界。"

POL_safety_bureau: "暴徒变警察"
POL_safety_bureau_desc:0"黑帮把持的保安机构摇身一变，成了国家的警察与秘密部门。暴徒们穿上制服，用合法的名义继续勒索、监视与镇压。暴徒变警察，让犯罪集团彻底掌控了国家的暴力机器。"

POL_bow_to_boss: "向老大致敬！"
POL_bow_to_boss_desc:0"在谢塔姆卡老爹与甘茨瓦伊赫的联合统治下，所有人都必须向老大致敬。街头、工厂与政府机关里，黑帮的礼仪取代了法律与宪法。向老大致敬，成了这个盗匪国家最隆重的政治仪式。"

POL_bandit_zionism: "以勒索支援锡安主义"
POL_bandit_zionism_desc:0"甘茨瓦伊赫把勒索与走私的收益用于支援锡安主义事业，试图用黑金为犹太民族的家园铺路。他向锡安主义组织捐款，换取他们的政治支持与庇护。以勒索支援锡安主义，让民族理想与犯罪集团结成了可耻的同盟。"

POL_loyal_to_boss: "效忠老大"
POL_loyal_to_boss_desc:0"黑帮世界靠的不是法律，而是对老大的绝对效忠。谢塔姆卡老爹与甘茨瓦伊赫的追随者都必须宣誓效忠，背叛者会被毫不留情地清除。效忠老大成了这个政权最基本的政治美德。"

POL_13_bandits: "13集团暴徒挺身而出"
POL_13_bandits_desc:0"亚伯拉罕·甘茨瓦伊赫领导的13区暴徒从华沙的犹太街区挺身而出，成为黑帮世界中最凶狠的一支力量。他们以保护犹太商人为名，实际上控制着赌场、走私与高利贷。13区暴徒的崛起，让黑帮政治多了一条民族与宗教交织的战线。"

POL_tax_protection_fee: "保护费变税收"
POL_tax_protection_fee_desc:0"黑帮把街头勒索的保护费改头换面，变成了国家征收的正式税收。商人与工人被迫向新的主子交钱，换取所谓的保护与秩序。保护费变税收，标志着犯罪集团已经把自己包装成了政府。"

POL_worker_demand_employer_comply: "工人提议，雇主服从"
POL_worker_demand_employer_comply_desc:0"谢塔姆卡老爹以工人的名义向雇主发出最后通牒：要么接受工人的条件，要么面对黑帮的报复。雇主们在枪口与罢工的双重压力下被迫服从。工人提议、雇主服从，成了这个黑帮政权最讽刺的劳资关系。"

POL_everyone_worship_pilsudski: "全民崇拜毕苏斯基"
POL_everyone_worship_pilsudski_desc:0"谢塔姆卡老爹把毕苏斯基的崇拜推向全民，用元帅的画像与神话为自己的黑帮统治披上合法外衣。街头巷尾都挂着毕苏斯基的像，黑帮分子也自称是他的继承者。全民崇拜毕苏斯基，让犯罪集团得以借用民族英雄的威望。"

POL_worker_militia_mafia: "工人民兵变打手"
POL_worker_militia_mafia_desc:0"谢塔姆卡老爹把工人民兵收编为自己的打手，让原本保卫工人的武装变成黑帮的暴力工具。民兵们拿着武器在街头收保护费、恐吓对手，早已忘了自己的阶级使命。工人民兵变打手，是这场黑帮革命最赤裸的堕落。"

POL_Kercelak_protector: "凯尔采拉克的保护人"
POL_Kercelak_protector_desc:0"谢塔姆卡老爹自封为凯尔采拉克市场的保护人，把这座华沙最热闹的集市纳入自己的势力范围。商贩们必须向他缴纳保护费，换取在黑帮争斗中生存的权利。凯尔采拉克的保护人，成了黑帮统治下市井生活的新领主。"

POL_mafia_socialism: "以敲诈资助社会主义"
POL_mafia_socialism_desc:0"谢塔姆卡老爹用敲诈与勒索得来的钱财资助社会主义事业，把黑金洗成革命的经费。他宣称这是劫富济贫，实际上只是把财富从一个口袋转移到自己的口袋。以敲诈资助社会主义，让社会主义的理想蒙上了黑帮的污名。"

POL_union_under_bandits: "黑帮控制下的工会"
POL_union_under_bandits_desc:0"谢塔姆卡老爹把工会置于黑帮的控制之下，让工会领袖成为他的傀儡。工会不再为工人争取权利，而是替黑帮征收会费、组织罢工与恐吓雇主。黑帮控制下的工会，成了犯罪集团渗透工人阶级的工具。"

POL_pacify_commie_cons: "痛击布党与保守派"
POL_pacify_commie_cons_desc:0"谢塔姆卡老爹同时向共产党人与保守派开战，把左右两边的敌人都视为黑帮统治的威胁。布党与保守派的活动被暴力镇压，街头变成了黑帮清算政敌的战场。痛击布党与保守派，让谢塔姆卡老爹的统治更加血腥，也更加孤立。"
KX_PL_NATDEM_ONR:0 "比激进更激进"
KX_PL_NATDEM_ONR_desc:0"民族激进阵营是民族民主党内部的民族激进派，他们驱逐了党内的官僚，要求以暴力与群众运动彻底改造波兰。他们抨击旧派的妥协与腐败，主张建立民族激进的国家。比激进更激进的口号让民族激进阵营夺取了党的主导权，把国家民主党推向更极端的道路。"

KX_PL_FROM_A_TO_Z:0 "从A到Z"
KX_PL_FROM_A_TO_Z_desc:0"亨利克·罗斯曼领导的民族激进阵营提出从A到Z的彻底改造纲领，要从政治、经济到文化全面重塑波兰。他们在驱逐党内官僚后掌握了国家民主党，要求以更激进的手段实现民族革命。从A到Z的口号成为罗斯曼一派改造国家、清洗旧精英的动员令。"

KX_PL_SOCIALISM_SIN:0 "社会主义之罪"
KX_PL_SOCIALISM_SIN_desc:0"国家民主党把社会主义视为一种罪行，宣称它破坏民族团结、挑起阶级仇恨。他们镇压社会主义政党与工会，把左翼分子关进监狱或赶出国门。社会主义之罪的口号让国家民主党与劳工运动彻底对立。"

KX_PL_STATE_INTEVENTIONISM:0 "国家干预政策"
KX_PL_STATE_INTEVENTIONISM_desc:0"国家民主党推行国家干预政策，把关键产业与资源纳入政府控制。他们以民族利益为名干预市场、扶植亲信企业，把经济变成政党分赃的工具。国家干预政策让国家民主党掌握了巨大的经济权力。"

KX_PL_CORPORTES:0 "建立法团组织"
KX_PL_CORPORTES_desc:0"国家民主党建立法团组织，把工人、企业主与专业人员编入由国家控制的职业团体。法团取代了独立的工会与政党，成为国家管理经济与社会的基本单位。阶级冲突被法团的等级合作所掩盖，国家则牢牢掌控着每一个行业。"

KX_PL_WORKER_WARRIOR:0 "工人锻造勇士之剑"
KX_PL_WORKER_WARRIOR_desc:0"国家民主党把工人塑造成锻造勇士之剑的民族劳动者，要求他们为国家的军事化经济拼命生产。工厂变成军营，劳动纪律与民族使命被捆绑在一起。工人锻造勇士之剑的口号让工人阶级沦为民族战争的工具。"

KX_PL_EQUAL_LABOR_EQUAL_DISTRIBUTE:0 "共同劳动，公平分配"
KX_PL_EQUAL_LABOR_EQUAL_DISTRIBUTE_desc:0"国家民主党在法团体系内宣扬共同劳动、公平分配，声称要消灭阶级剥削。国家控制工资与物价，把剩余产品按政治忠诚与劳动贡献分配。公平分配的口号掩盖了特权阶层与官僚集团的实际受益。"

KX_PL_SEIZE_JEW_WEALTH:0 "夺取犹太人财富"
KX_PL_SEIZE_JEW_WEALTH_desc:0"国家民主党以民族利益为名夺取犹太人的财富，把他们的产业、房产与储蓄充公。国家用这些财富资助自己的支持者与扩军计划，把掠夺包装成社会正义。夺取犹太人财富的政策让国家民主党获得了短期的利益，却留下了长久的耻辱。"

KX_PL_VICTORY_OVER_CLASS_STRUGGLE:0 "战胜阶级斗争"
KX_PL_VICTORY_OVER_CLASS_STRUGGLE_desc:0"国家民主党宣称自己战胜了阶级斗争，用民族共同体的神话取代了阶级对立。工人被纳入法团体系，罢工与工会独立被禁止，阶级矛盾被强行压下去。战胜阶级斗争的口号掩盖了国家民主党对工人的剥削与压迫。"

KX_PL_POPULIST_REVOLUTION:0 "民粹革命"
KX_PL_POPULIST_REVOLUTION_desc:0"民族激进阵营发动民粹革命，以街头动员与反精英口号争取群众。他们把国家民主党的旧官僚描绘成腐败的寄生者，宣称自己代表真正的波兰人民。民粹革命让罗斯曼一派巩固了党内主导权，也让国家民主党的政治更加粗暴。"

KX_PL_CATHOLIC_INTERGRALISM:0 "天主教整合主义"
KX_PL_CATHOLIC_INTERGRALISM_desc:0"国家民主党中的天主教整合主义者主张把宗教与社会完全融为一体，让天主教教义成为国家生活的最高准则。他们要废除世俗教育、限制其他信仰，把波兰塑造成一个天主教民族国家。整合主义让教会与国家民主党结成了紧密的同盟。"

KX_PL_MAFIA_MANAGEMENT:0 "黑手党式管理"
KX_PL_MAFIA_MANAGEMENT_desc:0"国家民主党采用黑手党式的方式管理国家，用恩惠、威胁与暴力维持党内秩序。忠诚者获得职位与利益，异见者遭到排挤与迫害。黑手党式的管理让政党变成了一个封闭而危险的权力网络。"

KX_PL_PURE_POLISH_LEADS:0 "纯血波兰人领导"
KX_PL_PURE_POLISH_LEADS_desc:0"国家民主党鼓吹纯血波兰人领导的种族主义纲领，要求把少数民族排除在政治与经济生活之外。他们以血统与语言为标准划分公民资格，为歧视与迫害制造依据。纯血波兰人领导的口号把国家民主党的民族主义推向了种族主义。"

KX_PL_LIZARD_UNION:0 "组建蜥蜴联盟"
KX_PL_LIZARD_UNION_desc:0"国家民主党与天主教整合主义者、黑手党式的地方势力联合，组建起被称为蜥蜴联盟的政治集团。这个联盟以利益与恐惧维系，把教会、地方豪强与政党机器绑在一起。蜥蜴联盟让国家民主党的统治更加稳固，也更加腐败。"

KX_PL_NATIONAL_SENATE:0 "民族参议院"
KX_PL_NATIONAL_SENATE_desc:0"国家民主党设立民族参议院，作为由党挑选的精英组成的咨询与立法机构。参议院以民族利益为名，把权力集中在少数忠诚者手中。民族参议院看似代表民族，实则是国家民主党控制立法、排除异己的工具。"

KX_PL_ABSOLUTE_ELITISM:0 "绝对精英统治"
KX_PL_ABSOLUTE_ELITISM_desc:0"蜥蜴联盟与民族参议院合流后，国家民主党宣布实行绝对的精英统治。国家将由少数自称代表民族最高利益的精英掌控，选举与民意只是装饰。精英们以血统、功绩与忠诚为标准选拔，普通人则被排除在权力之外。"

KX_PL_AUTHORITIANISM:0 "拥抱威权主义"
KX_PL_AUTHORITIANISM_desc:0"国家民主党的青年派主张拥抱威权主义，认为民主已经无法应对国家的危机。他们要求加强行政权力、限制议会与政党竞争，让国家以铁腕维持秩序。威权主义由此成为青年派改造国家民主党、夺取党内主导权的思想旗帜。"

KX_PL_RADICAL_TURNS:0 "激进转变"
KX_PL_RADICAL_TURNS_desc:0"国家民主党的青年派推动激进转变，要求抛弃旧派的温和路线，走上民族激进的道路。他们主张强力镇压左翼、排斥少数族裔、扩军备战，把波兰变成一个军事化的民族国家。激进转变让国家民主党内部的青年派彻底掌握了主动权。"

KX_PL_REMOVE_JEW:0 "去犹太性"
KX_PL_REMOVE_JEW_desc:0"国家民主党发动去犹太性的运动，把犹太人污蔑为民族的外来威胁。犹太人的财产、职业与社会地位被系统性剥夺，暴力和歧视在国家的纵容下蔓延。去犹太性的政策是国家民主党最黑暗的一页，也让波兰失去了大量公民与人才。"

KX_PL_THOUGHT_CONTROL:0 "建立思想控制"
KX_PL_THOUGHT_CONTROL_desc:0"国家民主党建立思想控制体系，通过学校、媒体与秘密警察监控每一个公民的思想。任何偏离民族主义与天主教教义的言论都被禁止，异见者遭到逮捕与迫害。思想控制让国家民主党的统治深入人的内心，也让社会陷入恐惧。"

KX_PL_MARTIAL_LAW:0 "颁布戒严令"
KX_PL_MARTIAL_LAW_desc:0"国家民主党以国家危机为由颁布戒严令，把行政、司法与治安权力集中于军方与党魁手中。罢工、集会与反对派活动被禁止，社会在刺刀下被迫沉默。戒严令成为国家民主党镇压异己、维持统治的常规手段。"

KX_PL_LEGION_POLAND:0 "军团化波兰"
KX_PL_LEGION_POLAND_desc:0"国家民主党推行军团化波兰，把整个社会按照军队的方式组织起来。青年、工人与公务员都被编入半军事化的军团，接受纪律与牺牲的教育。军团化的社会为国家民主党的动员与战争准备提供了组织基础。"

KX_PL_OUT_OF_CRISIS:0 "走出危机的道路"
KX_PL_OUT_OF_CRISIS_desc:0"国家民主党提出走出危机的道路，要以更严厉的威权手段应对经济与社会的崩溃。他们加强思想控制、扩军备战，把危机归咎于少数族裔与左翼分子。走出危机的道路最终通向更深的专制与战争。"

KX_PL_LEARN_GAULLE:0 "学习戴高乐"
KX_PL_LEARN_GAULLE_desc:0"国家民主党号召学习戴高乐式的强人政治，建立一个以行政权力为核心、以民族复兴为使命的体制。他们模仿法国的集中化行政与全民动员，把领袖塑造成民族的化身。戴高乐式的模式让国家民主党的威权倾向更加公开。"

KX_PL_ARM_YOUTH:0 "武装青年"
KX_PL_ARM_YOUTH_desc:0"国家民主党学习戴高乐式的青年动员，把青年组织成准军事团体并加以武装。青年们接受纪律、体能和民族主义训练，随时准备为民族献身。这支青年力量既是政党的外围组织，也是镇压异见的街头武装。"

KX_PL_NO_LIBDEM:0 "自由民主不再"
KX_PL_NO_LIBDEM_desc:0"国家民主党宣布自由民主的时代已经结束，要用威权统治取代党派竞争与自由选举。他们指责自由民主造成分裂与软弱，宣称只有强权才能拯救民族。自由民主不再的口号标志着国家民主党彻底抛弃了民主的伪装。"

KX_PL_PURGE_FALSE_PATRIOTISM:0 "清除伪爱国主义"
KX_PL_PURGE_FALSE_PATRIOTISM_desc:0"国家民主党发动清除伪爱国主义的运动，把一切不够忠诚的团体与个人打成民族的敌人。他们以爱国主义为名清洗异见者、少数族裔与政治对手。清除伪爱国主义的运动让恐惧笼罩社会，也让国家民主党进一步集中权力。"

KX_PL_ENLIGHTENED_NATIONALISM:0 "开明民族主义"
KX_PL_ENLIGHTENED_NATIONALISM_desc:0"国家民主党把开明民族主义包装成一种温和的威权主义，宣称国家应当以理性与科学指导民族发展。他们保留部分议会与法律形式，同时用行政手段压制反对派。开明民族主义让威权统治显得不那么粗暴，却没有改变其专制的本质。"

KX_PL_KRAKOW_ECONOMIC_SCHOOL:0 "克拉科夫经济学派的启示"
KX_PL_KRAKOW_ECONOMIC_SCHOOL_desc:0"国家民主党从克拉科夫经济学派中汲取灵感，主张以自由市场与稳健财政推动民族经济发展。他们反对国有化与福利国家，认为私人资本才是繁荣的源泉。克拉科夫学派的理念让国家民主党的经济政策带上了自由主义的色彩。"

KX_PL_AGARIANISM_FIRST:0 "农业优先"
KX_PL_AGARIANISM_FIRST_desc:0"国家民主党的旧派把农业视为民族的根基，主张农业优先于工业发展。政府将保护地主与富农的利益，鼓励农业出口，同时压制激进的土地改革。乡村的保守势力因此成为国家民主党最稳固的票仓。"

KX_PL_STAY_COURSE:0 "恪守中道"
KX_PL_STAY_COURSE_desc:0"国家民主党的旧派主张恪守中道，在激进派与自由派之间维持平衡。他们希望以渐进的方式推行民族主义政策，避免社会陷入混乱。恪守中道让旧派显得稳健，却也被青年派指责为软弱与妥协。"

KX_PL_BAD_TURANISM:0 "图兰文明之恶"
KX_PL_BAD_TURANISM_desc:0"国家民主党炮制出图兰文明之恶的论调，把突厥、蒙古与东方民族描绘成野蛮与破坏的化身。他们宣称波兰的使命是抵御来自东方的图兰威胁，保卫欧洲文明。这套种族化的文明论调为扩张与歧视披上了文明的外衣。"

KX_PL_BAD_BYZANTINISM:0 "拜占庭主义之罪"
KX_PL_BAD_BYZANTINISM_desc:0"国家民主党把拜占庭遗产视为东方专制与腐败的象征，宣称波兰必须与之彻底划清界限。宣传把拜占庭描绘成停滞、阴谋与堕落的文明，而波兰则代表西方自由与秩序。这种文明论调为排斥东方邻国与少数族裔提供了借口。"

KX_PL_CLASH_CIVILIZATION:0 "文明冲突论"
KX_PL_CLASH_CIVILIZATION_desc:0"国家民主党提出文明冲突论，把世界描绘成拉丁天主教文明与东方、图兰、拜占庭等敌对文明之间的永恒斗争。波兰被指定为西方文明在东方的堡垒，必须为文明存亡而战。这种二元对立的叙事为国家民主党的扩张与镇压提供了正当性。"

KX_PL_MORAL_ABOVE_ALL:0 "道德高于一切"
KX_PL_MORAL_ABOVE_ALL_desc:0"国家民主党把民族道德置于一切之上，要求文学、艺术与教育都必须服从天主教与民族主义的价值。任何挑战传统道德的思想都被斥为堕落与背叛。道德高于一切的口号成为文化审查与思想控制的工具。"

KX_PL_LATIN_CATHOLIC_SUPERIORTY:0 "拉丁—天主教优越性"
KX_PL_LATIN_CATHOLIC_SUPERIORTY_desc:0"国家民主党宣扬拉丁天主教文明的优越性，把波兰视为这一文明在东方的守护者。他们以文明等级论为殖民、同化与歧视辩护，宣称其他民族必须接受波兰的教化。这种优越感让国家民主党的民族主义滑向了赤裸裸的种族主义。"

KX_PL_PREVENT_LAND_REFORM:0 "阻止土地改革"
KX_PL_PREVENT_LAND_REFORM_desc:0"国家民主党与地主结盟，阻止任何触犯大地产的土地改革。政府以保护私有财产为名，压制农民的要求，把土地继续留在少数地主手中。阻止土地改革让乡村的贫富差距固化，也让农民对国家民主党日益不满。"

KX_PL_EMPOWER_LEGISLATURE:0 "强化行政权力"
KX_PL_EMPOWER_LEGISLATURE_desc:0"国家民主党以强化行政权力为名，把立法机构的权力逐步转移到政府手中。议会虽然保留，却只能为行政部门的决定盖章，真正的决策由少数官员与党魁做出。行政权力的膨胀让国家民主党的统治更加稳固，也让民主制度名存实亡。"

KX_PL_GUIDED_CHRISTIAN_DEMOCRACY:0 "指导下的基督教民主"
KX_PL_GUIDED_CHRISTIAN_DEMOCRACY_desc:0"国家民主党扶植一个在党指导下的基督教民主派，用宗教语言包装自己的统治。基督教民主派获得有限的选举空间，却必须服从国家民主党的民族纲领。指导下的民主既安抚了教会，也让国家民主党多了一层合法的外衣。"

KX_PL_SHORT_IN_WORDS:0 "语言上的矮子，行动上的巨人"
KX_PL_SHORT_IN_WORDS_desc:0"国家民主党自诩为语言上的矮子、行动上的巨人，宣称自己少说空话、多做实事。他们以行政效率与镇压能力为荣，把民主辩论视为无用的清谈。这种行动至上的神话掩盖了国家民主党对暴力的崇拜。"

KX_PL_MINIMALIZE_INTERVENTION:0 "最小化国家干预"
KX_PL_MINIMALIZE_INTERVENTION_desc:0"国家民主党主张最小化国家干预，把经济交给市场与私人企业。政府削减公共开支、放松劳动保护，宣称这样才能恢复繁荣。最小化干预的政策让资本获得自由，却让社会的不平等与动荡进一步加剧。"

KX_PL_NO_WELFARE:0 "社会救济百害无利"
KX_PL_NO_WELFARE_desc:0"国家民主党宣称社会救济百害无利，认为福利只会养懒人、削弱民族的竞争力。政府削减救济、医疗与教育开支，把责任推给家庭与教会。社会救济的削减让底层民众陷入更深的贫困，却为富人腾出了减税的空间。"

KX_PL_TAX_PLUNDER:0 "税收即掠夺"
KX_PL_TAX_PLUNDER_desc:0"国家民主党宣称税收即掠夺，主张大幅削减税负，把国家职能压缩到最低。他们以自由市场的名义为富人减税，却削减公共服务与社会救济。税收即掠夺的口号让国家民主党赢得了资本家的支持，也让国家财政陷入困境。"

KX_PL_ENCOURAGE_PRIVATE_LOANS:0 "鼓励私人信贷"
KX_PL_ENCOURAGE_PRIVATE_LOANS_desc:0"国家民主党鼓励私人信贷，希望通过银行与资本家的投资来刺激经济。政府为私人贷款提供担保与税收优惠，把发展希望寄托在企业家身上。这一政策让金融资本获利丰厚，却让普通工人与农民背负了沉重的债务。"

KX_PL_LAZZI_FAIRE_FREEDOM:0 "自由放任带来繁荣"
KX_PL_LAZZI_FAIRE_FREEDOM_desc:0"国家民主党宣称自由放任将带来繁荣，主张削减国家干预、降低税收与放松管制。他们把经济命运交给市场与私人资本，相信企业家精神会自动创造就业与财富。自由放任的政策让少数人暴富，却让工人与农民在危机中更加脆弱。"

KX_PL_RIGHT_UNION:0 "右翼政党联盟"
KX_PL_RIGHT_UNION_desc:0"国家民主党联合其他右翼政党，组建一个以民族主义与天主教为基础的选举联盟。联盟在议会中占据多数，为威权统治提供合法的外衣。右翼政党联盟让国家民主党得以整合保守势力，却也埋下了内部争权的隐患。"
KX_PL_trimuph_liberal_zadruga:0 "自由札德鲁加的凯旋"
KX_PL_trimuph_liberal_zadruga_desc:0"自由扎德鲁加在扎德鲁加运动中取得胜利，宣告一条不同于极权路线的民族社会主义道路。他们要在民族共同体与个人自由之间寻找平衡，用民主与改良实现社会正义。自由扎德鲁加的凯旋，为波兰带来了一线希望，也埋下了内部分裂的种子。"
KX_PL_turn_to_secularism:0 "转向世俗主义"
KX_PL_turn_to_secularism_desc:0"自由扎德鲁加推动国家转向世俗主义，要把政治从教会的阴影中解放出来。他们主张政教分离，削弱天主教会的特权，让国家以理性与民族利益为准则。世俗主义激怒了虔诚的信徒，也让自由扎德鲁加与教会的关系日益紧张。"
KX_PL_end_totalism_menace:0 "驱除极权主义癫狂"
KX_PL_end_totalism_menace_desc:0"自由扎德鲁加把极权主义视为扎德鲁加运动最大的威胁，决心驱除这种癫狂。他们批判领袖崇拜、秘密警察与思想控制，主张以民主和法治约束国家权力。这场斗争让自由扎德鲁加与极权派彻底决裂。"
KX_PL_asylum_for_them:0 "他们最应该去的地方……"
KX_PL_asylum_for_them_desc:0"自由扎德鲁加为那些被极权派迫害的人提供庇护，把波兰变成流亡者与异见者的避难所。他们宣称宽容是民族强大的表现，而不是软弱。这个决定赢得了国际声誉，也让极权派指责他们背叛了民族革命。"
KX_PL_radsoc_zadruga_win:0 "维尔斯基与社会派"
KX_PL_radsoc_zadruga_win_desc:0"菲利克斯·维迪-维尔斯基领导的社会派在自由扎德鲁加内占据上风，主张以激进的社会主义改造民族经济。他们要在大企业国有化与工人自治的基础上，建立一个真正属于劳动者的民族共同体。维尔斯基的胜利，让自由扎德鲁加向左转。"
KX_PL_ally_ciscak:0 "与西札克结盟"
KX_PL_ally_ciscak_desc:0"维尔斯基派与西札克的社会主义团体结盟，以扩大社会派在城市工人中的基础。双方在国有化、工人权利与社会福利上达成一致，共同对抗保守派与极权派。这场结盟让社会派的力量进一步增强。"
KX_PL_state_controls_all:0 "国家掌控一切"
KX_PL_state_controls_all_desc:0"社会派主张由国家掌控经济的命脉，把银行、重工业与交通纳入公有制。他们相信只有国家才能集中资源，打破资本家的垄断，实现民族的工业化。国家掌控一切既是社会主义纲领，也是社会派动员工人的口号。"
KX_PL_scythe_revolution:0 "镰刀革命"
KX_PL_scythe_revolution_desc:0"改良派发动一场镰刀革命，要用和平而广泛的社会改革终结剥削，实现社会公平与正义。他们把农民与工人组织起来，通过合作社、工会与立法改变土地与劳动的关系。这场革命没有硝烟，却触及了旧秩序的根基。"
KX_PL_humanism_industrialize:0 "人道主义工业化"
KX_PL_humanism_industrialize_desc:0"自由扎德鲁加的四个派别最终在人道主义工业化上达成共识，主张以人道的方式推进工业化。国家将发展工业、改善劳动条件，同时保护农民与工人的基本权利。人道主义工业化试图在效率与正义之间找到平衡。"
KX_PL_reunify_psl:0 "统一人民党"
KX_PL_reunify_psl_desc:0"涅奇科的农业派致力于统一分裂的人民党，把农民运动整合成一支强大的政治力量。他们要在自由扎德鲁加内代表乡村的利益，推动土地改革与农业合作。人民党的统一，让农民成为自由扎德鲁加的重要支柱。"
KX_PL_expel_red_satan:0 "驱逐红色撒旦"
KX_PL_expel_red_satan_desc:0"菲尔查克的保守派把共产主义视为红色撒旦，发动一场驱逐与镇压的运动。共产党人、左翼激进分子与工会中的革命派被逮捕、流放或处决，国家以民族与宗教的名义清除异己。这场清洗让保守派巩固了权力，也让自由扎德鲁加沾染了血腥。"
KX_PL_integrate_chadecja:0 "整合基督教民族工党"
KX_PL_integrate_chadecja_desc:0"保守派把基督教民族工党整合进自由扎德鲁加，形成一个以天主教社会教义为基础的民族保守联盟。教会、地主与保守知识分子在新的联盟中获得了一席之地，社会改革被限制在宗教与传统的框架内。这一整合让自由扎德鲁加向右靠拢。"
KX_PL_democratic_youth_union:0 "民主青年联盟"
KX_PL_democratic_youth_union_desc:0"社会派组建民主青年联盟，把年轻工人与学生吸引到自由扎德鲁加的旗帜下。联盟既从事政治宣传，也组织文化与社会活动，培养新一代的社会主义干部。青年联盟成为社会派最活跃的群众组织。"
KX_PL_modernize_hospital:0 "现代化医学体系"
KX_PL_modernize_hospital_desc:0"社会派推动建立现代化的医学体系，把医疗从私人市场与教会慈善中解放出来。国家将建设医院、培养医生，并为工人提供免费医疗。这项改革让社会派在城市居民中赢得了广泛支持。"
KX_PL_empower_union:0 "强化工会角色"
KX_PL_empower_union_desc:0"改良派强化工会在国家经济与社会生活中的角色，让工会参与工资、劳动条件与社会福利的决策。工会不再是政府的附庸，而成为工人利益的代表与改良政策的执行者。这一政策巩固了改良派在工人中的基础。"
KX_PL_industry_helps_agriculture:0 "工业反哺农业"
KX_PL_industry_helps_agriculture_desc:0"农业派推动工业反哺农业，要求国家把工业利润投入到农业机械化、灌溉与乡村建设中。他们反对以牺牲农民为代价的快速工业化，主张工农业平衡发展。这一政策让乡村地区对自由扎德鲁加更加忠诚。"
KX_PL_reconstruct_society_mental_structure:0 "重建社会心理结构"
KX_PL_reconstruct_society_mental_structure_desc:0"保守派推动重建社会心理结构，要用宗教、家庭与传统道德治愈民族的精神创伤。学校与教会合作，向青年灌输服从、虔诚与爱国的价值观，现代主义的文化与思想被逐步清除。社会心理的重建，成了保守派对抗极权主义与自由主义的手段。"
KX_PL_reclaim_our_sea:0 "夺回我们的海！"
KX_PL_reclaim_our_sea_desc:0"保守派提出夺回我们的海的口号，要求波兰重新获得波罗的海的出海口与海军力量。他们把海洋视为民族生存与贸易的生命线，主张以武力或外交手段收回失地。这一纲领让自由扎德鲁加的民族主义色彩更加浓烈。"
KX_PL_end_anti_semitism:0 "终结反犹主义"
KX_PL_end_anti_semitism_desc:0"社会派推动终结扎德鲁加运动中的反犹主义，主张把犹太人当作平等的波兰公民。他们谴责把经济危机归咎于少数族裔的煽动，要求党与这种偏见划清界限。这一立场让社会派与极权派彻底决裂，也赢得了国际社会主义者的尊重。"
KX_PL_wsebol_propaganda_machine:0 "瓦塞博尔的宣传机器"
KX_PL_wsebol_propaganda_machine_desc:0"改良派建立起瓦塞博尔式的宣传机器，用报纸、广播与学校传播社会改良的理念。宣传不再服务于领袖崇拜，而是动员群众支持教育、医疗与劳动立法。宣传机器成了改良派争取民心的工具。"
KX_PL_zadruga_truly_name:0 "札德鲁加，名副其实"
KX_PL_zadruga_truly_name_desc:0"自由扎德鲁加宣称自己终于让扎德鲁加这个名字名副其实，把民族共同体与社会主义真正结合起来。他们要在民主、正义与民族独立的基础上，建设一个不同于极权派的新波兰。这个名字既是承诺，也是对党内各派的挑战。"
KX_PL_paganist_reshuffle:0 "异教式再建构"
KX_PL_paganist_reshuffle_desc:0"农业派推动一场异教式的文化再建构，把斯拉夫乡村的传统信仰与习俗重新引入民族生活。他们试图用古老的农耕仪式与自然崇拜，强化农民对土地与民族的认同。这场文化运动让自由扎德鲁加带上了浪漫的乡土色彩。"
KX_PL_enforce_polonization:0 "强推波兰化"
KX_PL_enforce_polonization_desc:0"保守派在东部与西部边境强推波兰化，要求少数民族放弃语言与习俗，接受波兰文化与天主教信仰。学校、政府与教会共同执行同化政策，拒绝服从者遭到驱逐与压迫。这一政策让自由扎德鲁加在民族问题上与极权派殊途同归。"
KX_PL_birth_npr:0 "整合国家工党"
KX_PL_birth_npr_desc:0"社会派把国家工党整合进自由扎德鲁加的体系，形成一个以工人为基础的民族社会主义政党。新党既坚持民族独立，也坚持社会正义，试图在左右之间开辟自己的道路。国家工党的整合，让社会派的政治机器更加完整。"
KX_PL_demarxize_nation:0 "国家去马克思主义化"
KX_PL_demarxize_nation_desc:0"改良派推动国家去马克思主义化，把社会主义从教条的阶级斗争中解放出来。他们主张以伦理、合作与民主代替暴力革命，建设一种更人道的社会主义。这一转向让改良派与传统的共产主义者分道扬镳。"
KX_PL_farmer_militia:0 "农民民兵"
KX_PL_farmer_militia_desc:0"农业派组建农民民兵，让乡村共同体拥有自己的武装力量。民兵既负责维持地方秩序，也保卫土地改革与农民利益，防止极权派或地主势力反扑。农民民兵成为农业派在乡村的权力基础。"
KX_PL_civilized_rearmament:0 "文明再武装"
KX_PL_civilized_rearmament_desc:0"保守派推动文明再武装，要用现代武器与军事工业重建波兰的国防。他们宣称一个文明的民族必须有能力保卫自己，军备建设被包装成民族复兴的一部分。再武装让保守派与军方走得更近，也让战争的阴影重新笼罩欧洲。"
KX_PL_but_befriend_int:0 "……但与国际交好"
KX_PL_but_befriend_int_desc:0"改良派在国内去马克思主义化的同时，仍努力与国际社会主义运动保持友好关系。他们向巴黎与伦敦的社会主义者伸出橄榄枝，试图证明民族社会主义也可以是国际主义的。这种两面姿态让改良派在国内外都获得了回旋余地。"

KX_PL_panslavism_without_barbarism:0 "无野蛮之泛斯拉夫主义"
KX_PL_panslavism_without_barbarism_desc:0"自由扎德鲁加提出无野蛮之泛斯拉夫主义，主张以文化合作与平等联合取代沙文主义的扩张。他们要与斯拉夫各民族建立友好关系，共同抵御帝国主义与极权主义。这一纲领让自由扎德鲁加在斯拉夫世界中赢得了一些尊重。"

KX_PL_eliminate_catholicistic_authoritianism:0 "摧毁教会式专制"
KX_PL_eliminate_catholicistic_authoritianism_desc:0"农业派把教会的专制倾向视为乡村自由的威胁，推动摧毁教会式的权威。他们要求教会放弃对地方政治与教育的控制，把权力交还给民选的乡村共同体。这一政策让农业派与保守派的关系更加紧张。"

KX_PL_socialism_no_revolution:0 "无革命之社会主义"
KX_PL_socialism_no_revolution_desc:0"改良派提出无革命之社会主义，主张通过选票、立法与合作社逐步改变社会。他们相信社会主义不必经过流血与专政，而可以在民主制度内实现。这条道路让自由扎德鲁加与极权派形成了最鲜明的对比。"

KX_PL_peasant_and_state:0 "农民与国家"
KX_PL_peasant_and_state_desc:0"农业派提出农民与国家的合作纲领，主张国家支持农民、农民支持国家。国家提供土地、信贷与技术，农民则承担粮食生产与乡村建设的责任。这种合作让自由扎德鲁加在乡村扎下了根。"

KX_PL_great_rejuvenation:0 "迈向伟大复兴"
KX_PL_great_rejuvenation_desc:0"自由扎德鲁加的各派最终汇聚于迈向伟大复兴的旗帜下，要把波兰建设成一个繁荣、公正而独立的民族国家。他们相信，经过民主与改良的重生，波兰将重新成为欧洲的重要力量。伟大复兴既是自由的希望，也是各派妥协的产物。"

KX_PL_socdem_zadruga_win:0 "延德热耶夫斯基与改良主义"
KX_PL_socdem_zadruga_win_desc:0"塔迪乌什·延德热耶夫斯基领导的改良派取得优势，主张用渐进的社会改革实现民族社会主义。他们相信民主制度与工会运动可以和平地改变社会，而不必诉诸暴力。延德热耶夫斯基的路线让自由扎德鲁加走上了温和的议会道路。"

KX_PL_soclib_zadruga_win:0 "涅奇科与农业主义"
KX_PL_soclib_zadruga_win_desc:0"约瑟夫·涅奇科领导的农业派在自由扎德鲁加内崛起，把农民与乡村共同体视为民族的根基。他们主张土地改革、农业合作与地方自治，反对工业资本对乡村的侵蚀。涅奇科的路线让自由扎德鲁加带上了浓厚的农业主义色彩。"

KX_PL_soccon_zadruga_win:0 "费尔查克与保守派"
KX_PL_soccon_zadruga_win_desc:0"齐格蒙特·菲尔查克领导的保守派在自由扎德鲁加内获胜，主张在民族传统与宗教秩序的基础上进行有限的社会改革。他们强调家庭、教会与地方共同体，反对激进的世俗化与社会主义实验。菲尔查克的胜利让自由扎德鲁加向右转。"

KX_PL_catholic_pagan_coexist:0 "基督于诸神中"
KX_PL_catholic_pagan_coexist_desc:0"自由扎德鲁加提出一种折中方案，让基督教与斯拉夫异教传统在民族文化的框架内共存。他们试图把基督视为诸神中的一位，用宽容的姿态调和信仰冲突。这种宗教调和既安抚了异教徒，也没有完全得罪教会。"

KX_PL_end_anticlericalism:0 "终结反教权主义"
KX_PL_end_anticlericalism_desc:0"自由扎德鲁加宣布终结激烈的反教权主义，试图与教会达成和解。他们承认宗教在民族生活中的作用，不再把教会当作敌人。这一转向缓和了社会矛盾，却也让党内激进的世俗派感到不满。"
KX_PL_lechia_dawn:0 "莱契亚的黎明"
KX_PL_lechia_dawn_desc:0"莱契亚的黎明在波兰升起，扎德鲁加的民族革命终于迎来了自己的时刻。这场运动要从古老的斯拉夫传统中汲取力量，把波兰人从外来思想与腐朽精英的枷锁中解放出来。在斯塔赫纽克与舒卡尔斯基等人的推动下，一个以民族共同体为核心的新秩序开始成形。"

KX_PL_culturist_revolution:0 "文化主义革命"
KX_PL_culturist_revolution_desc:0"扎德鲁加发动一场文化主义革命，要用民族精神重塑波兰人的灵魂。他们批判自由主义与唯物主义，主张以文化、血统与传统重建社会的价值基础。革命的目标不是改变制度，而是改造人本身。"

KX_PL_cleanse_germans:0 "清理条顿污秽"
KX_PL_cleanse_germans_desc:0"扎德鲁加把德意志人视为波兰土地上最危险的异质因素，发动一场清理条顿污秽的运动。德意志居民被驱逐、财产被没收，民族纯洁性的口号掩盖了暴力与掠夺。这场清洗为民族共同体腾出了空间，也埋下了更深的仇恨。"

KX_PL_one_leader_one_nation:0 "一个领袖，一个民族"
KX_PL_one_leader_one_nation_desc:0"扎德鲁加提出一个领袖、一个民族的口号，要把波兰锻造成一个意志统一的整体。一切党派、阶级与地方的差异都被要求消融在民族共同体之中。领袖的权威成为民族意志的化身，任何异议都被视为对共同体的背叛。"

KX_PL_rise_national_collective:0 "民族集体的崛起"
KX_PL_rise_national_collective_desc:0"扬·斯塔赫纽克领导民族集体派，主张以民族集体主义取代个人主义与阶级斗争。他要建立一个由民族精英与劳动者共同组成的集体国家，让每个人都成为民族机器中的齿轮。民族集体的崛起，意味着扎德鲁加将走上一条极权主义的道路。"

KX_PL_dominant_eagle_order:0 "角鹰骑士团之支配"
KX_PL_dominant_eagle_order_desc:0"斯坦尼斯瓦夫·舒卡尔斯基建立起角鹰骑士团，以古老的斯拉夫神话与艺术狂热重塑扎德鲁加。他要把波兰变成一个由艺术家、骑士与神秘主义者领导的民族共同体，让美学与血统成为权力的基础。角鹰骑士团的支配，意味着扎德鲁加将走上一条更加狂放、更加神秘的道路。"

KX_PL_recall_natdem_youth:0 "唤回迷途民族主义青年"
KX_PL_recall_natdem_youth_desc:0"舒卡尔斯基向那些迷失在自由主义与平庸生活中的民族主义青年发出召唤，邀请他们加入角鹰骑士团。他用激昂的艺术与神话语言点燃年轻人的热情，把他们塑造成民族革命的先锋。迷途的青年被重新召回，成为骑士团最狂热的追随者。"

KX_PL_life_death_for_nation:0 "生与死为民族"
KX_PL_life_death_for_nation_desc:0"角鹰骑士团宣扬一种生与死都为民族献身的精神，把牺牲奉为最高的美德。骑士团的成员被要求把个人生命完全交给民族与领袖，死亡被描绘成进入民族永恒的方式。这种狂热的牺牲崇拜，让骑士团成为一支不惧死亡的力量。"

KX_PL_pilsudski_svetovid:0 "毕苏斯基，斯维亚托维德之化身"
KX_PL_pilsudski_svetovid_desc:0"舒卡尔斯基把毕苏斯基奉为斯拉夫大神斯维亚托维德的化身，用古老的神话为元帅的遗产披上神圣的光环。毕苏斯基的雕像与斯维亚托维德的形象被并列崇拜，民族记忆与异教信仰交织在一起。通过神话化元帅，骑士团为自己的统治借来了古老的权威。"

KX_PL_national_autarky:0 "民族自给自足"
KX_PL_national_autarky_desc:0"角鹰骑士团推行民族自给自足的经济政策，要让波兰摆脱对外国资本与市场的依赖。国家鼓励本土工业与农业的发展，把经济独立视为民族独立的基础。自给自足既是经济纲领，也是骑士团对外来影响进行全面排斥的一部分。"

KX_PL_new_sparta_education:0 "新式斯巴达教育"
KX_PL_new_sparta_education_desc:0"骑士团推行新式斯巴达教育，从儿童时代起就把年轻人训练成服从、坚韧、尚武的民族战士。学校变成军营，纪律与牺牲取代了自由与个性。一代新人将在这种教育中成长，成为角鹰骑士团最忠实的工具。"

KX_PL_arm_young_legion:0 "武装青年军团"
KX_PL_arm_young_legion_desc:0"角鹰骑士团武装青年军团，把最狂热的年轻人编成一支半军事化的民族先锋。军团既是骑士团的武装力量，也是向全社会展示民族青春的象征。年轻的血气被引向战场与街头，成为扎德鲁加扩张与镇压的利刃。"

KX_PL_totalism_we_are_worse:0 "极权主义？我们更糟！"
KX_PL_totalism_we_are_worse_desc:0"斯塔赫纽克与舒卡尔斯基的两条路线最终汇合，扎德鲁加公开宣称自己的极权主义比任何旧制度都更加彻底。国家要控制的不只是政治与经济，还有思想、艺术与人的灵魂。极权主义？我们更糟——这句口号成了民族革命最可怕的自我表白。"

KX_PL_boleslaw_modern_hero:0 "博莱斯瓦夫式现代英雄"
KX_PL_boleslaw_modern_hero_desc:0"扎德鲁加把古代国王博莱斯瓦夫奉为现代英雄的典范，宣扬一种勇武、慷慨而专断的民族领袖理想。宣传机器把博莱斯瓦夫的形象与当代领袖重叠，号召青年效仿他的英雄气概。历史被改造成民族动员的神话，为极权统治提供榜样。"

KX_PL_ancestor_almighty_tech:0 "祖先的科研神力"
KX_PL_ancestor_almighty_tech_desc:0"扎德鲁加宣称祖先的智慧中蕴含着超越现代科学的力量，把古老神话与神秘技术糅合成一套民族科研体系。学者们被要求从斯拉夫传说中寻找科学灵感，官方的伪科学取代了真正的研究。祖先的科研神力，成了政权愚弄人民与自我陶醉的工具。"

KX_PL_support_european_paganism:0 "神经组织遍布全欧"
KX_PL_support_european_paganism_desc:0"扎德鲁加把支持欧洲异教文化视为扩展民族影响的手段，宣称斯拉夫异教是欧洲本土精神的真正根源。他们向各地的异教团体提供资金与宣传，试图建立一个跨越欧洲的民族神秘主义网络。异教信仰被组织成一张遍布全欧的神经组织，为扎德鲁加的意识形态扩张服务。"

KX_PL_revitalize_national_creativity:0 "复兴民族创造力"
KX_PL_revitalize_national_creativity_desc:0"扎德鲁加发起复兴民族创造力的运动，要求艺术家与学者从民族传统中汲取灵感。现代主义与外来风格被斥为堕落，只有歌颂民族、土地与英雄的作品才被允许。创造力被国家收编，成为极权宣传的一部分。"

KX_PL_zermatianism_birth:0 "泽尔马提亚真理再现世间"
KX_PL_zermatianism_birth_desc:0"舒卡尔斯基的泽尔马提亚理论被扎德鲁加奉为官方真理，宣称斯拉夫民族是人类文明的真正起源。这套伪科学把神话、种族论与艺术狂热混在一起，为民族优越论提供了荒谬的依据。泽尔马提亚真理的再现，让扎德鲁加的意识形态彻底滑向疯狂。"

KX_PL_forge_slavic_civilization:0 "铸就斯拉夫文明"
KX_PL_forge_slavic_civilization_desc:0"扎德鲁加提出铸就斯拉夫文明的宏大计划，要把波兰领导的斯拉夫世界塑造成一个独特的文明体系。他们要用民族艺术、异教信仰与集体主义对抗西方自由主义与东方共产主义。斯拉夫文明被描绘成未来的希望，而波兰则是它的中心。"

KX_PL_reborn_europa:0 "新欧罗巴的诞生"
KX_PL_reborn_europa_desc:0"扎德鲁加的最终目标是在欧洲的废墟上建立一个由斯拉夫文明主导的新欧罗巴。他们要用民族革命推翻旧欧洲的自由主义与资本主义，把整个大陆纳入自己的文明蓝图。新欧罗巴的诞生，将是扎德鲁加极权梦想的顶点，也可能是欧洲的噩梦。"

KX_PL_rural_coop_city_union:0 "农村合作社，城市工团"
KX_PL_rural_coop_city_union_desc:0"斯塔赫纽克派提出农村合作社与城市工团相结合的经济蓝图，要把农民与工人纳入民族集体的生产体系。农村以合作社为单位，城市以工团为单位，二者在国家的计划下相互配合。经济被彻底组织化，为民族集体的崛起服务。"

KX_PL_battle_wspaculture:0 "战胜逆文化堕落"
KX_PL_battle_wspaculture_desc:0"斯塔赫纽克派发动一场反对逆文化的斗争，把现代主义艺术、消费主义与外来思想视为民族精神的堕落。宣传机器号召人民抵制这些文化毒素，回归朴素、尚武与集体的民族传统。文化斗争成为清洗异见与巩固权力的工具。"

KX_PL_eliminate_stanislaw:0 "斩杀斯坦尼斯瓦夫"
KX_PL_eliminate_stanislaw_desc:0"斯塔赫纽克派决定铲除斯坦尼斯瓦夫·舒卡尔斯基及其追随者，以确立自己对扎德鲁加的绝对领导。舒卡尔斯基的艺术家圈子被指控为异端与分裂之源，遭到逮捕与清洗。这场内部屠杀让民族集体派独揽大权，也让扎德鲁加失去了另一位狂热的灵魂。"

KX_PL_control_ideomatrix:0 "掌控意识矩阵"
KX_PL_control_ideomatrix_desc:0"民族集体派建立起一套被称为意识矩阵的宣传与监控体系，要把民族主义思想灌输到每一个公民的头脑中。学校、媒体、工厂与家庭都被纳入这张无形的网络，任何偏离官方意识形态的念头都会被察觉。意识矩阵让极权统治深入人的内心。"

KX_PL_horde_without_class:0 "无阶级蚁群"
KX_PL_horde_without_class_desc:0"斯塔赫纽克派宣称要消灭阶级，却把整个民族变成一群没有个性、只知服从的蚁群。旧的阶级差别被取消，取而代之的是民族集体对所有人的绝对支配。无阶级的社会并没有带来自由，只带来了更彻底的奴役。"

KX_PL_vanguard_of_will:0 "意志先锋队"
KX_PL_vanguard_of_will_desc:0"民族集体派组建起一支意志先锋队，作为扎德鲁加的核心骨干与秘密警察。这些经过严格挑选的狂热分子负责监视、清洗与动员，把领袖的意志贯彻到社会的每个角落。先锋队既是革命的矛头，也是悬在所有人头上的利剑。"



