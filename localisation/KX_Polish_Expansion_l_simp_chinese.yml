PLX_mon_monarch_role_2b:0 "谨遵王室之愿"
plxv2.137.t:0 "风暴后的航向"
plxv2.137.d:0 "我国局势现已恢复平静...相对而言...旧委员会仍在勉力支撑。尽管参议院许多人要求议会辞职，认为最近的危机标志着现任议员的失职。参议院中较为温和的议员则呼吁临时将权力移交给瓦迪斯瓦夫·西科尔斯基——他在瓦莱雷·斯瓦维克政变失败及军团运动解散后接掌了军事主导权。若西科尔斯基被任命为首相，他承诺将实施有限度的民主化改革，以保障国家的稳定与发展。"
plxv2.137.a:0 "旧委员会将屹立不倒"
plxv2.137.b:0 "现任委员会将在压力下辞职"
PLX_mon_aristocracy_econ_1:0 "贵族优先"
PLX_mon_aristocracy_econ_2:0 "贵族优先"
PLX_mon_in_everyones_service_1:0 "为所有人之国"
PLX_mon_in_everyones_service_2:0 "为所有人之国"
