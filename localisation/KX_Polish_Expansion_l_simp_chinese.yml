 KX_PL_PG_GERMAN_TAKEOVER:0 "奥布拉希特延续"
 KX_PL_PG_GERMAN_TAKEOVER_desc:0 "奥布拉希特是一位广受人民尊敬的国王，他的统治地位不应改变。"
 KX_PL_PG_A_MONARCH_TO_CHOOSE:0 "选举君主"
 KX_PL_PG_A_MONARCH_TO_CHOOSE_desc:0 "为了确保国家的稳定，我们或许应该考虑在波兰设立一位新的君主。"
 KX_PL_PG_KING_IN_POWER:0 "天佑吾王，幸福安康！"
 KX_PL_PG_KING_IN_POWER_desc:0 "国王与皇家委员会已经接管了这个国家，现在他们将决定波兰历史的未来走向，是好是坏就难说了。"
 KX_PL_PG_ROYAL_CABINET_continues:0 "建立君主专制"
 KX_PL_PG_ROYAL_CABINET_continues_desc:0 "只有君主有权利建立一个合适的政府。我们必须将一切权力转交给他。"
 KX_PL_PG_ROYAL_CABINET:0 "组建王家内阁"
 KX_PL_PG_ROYAL_CABINET_desc:0 "我们君主必须建立一个合适的政府。这也决定他是要与成熟的政治家结盟，还是要与古老的地主阶级结盟。"
 KX_PL_PG_CLERGICAL_ADVISORS:0 "依靠传统"
 KX_PL_PG_CLERGICAL_ADVISORS_desc:0 "国王已经决定信任贵族和神职人员的继承人"
 KX_PL_PG_LOCAL_SEJMS:0 "地区议会"
 KX_PL_PG_LOCAL_SEJMS_desc:0 "为了确保土地所有者的利益，一定程度的权力将下放给地方行政机关，形成一个高度自主的治理结构。这将有利于土地所有者"
 KX_PL_PG_EMPOWER_SENAT:0 "赋权参议院"
 KX_PL_PG_EMPOWER_SENAT_desc:0 "大多由贵族组成的元老院将成为我们王国的主要立法机构。"
 KX_PL_PG_NOBLES_OF_THE_ROBE:0 "法官贵族"
 KX_PL_PG_NOBLES_OF_THE_ROBE_desc:0 "王室的管理将以贵族为基础，但并非任何贵族都能担任重要职务。只有那些具备才能、品德和尊严的贵族，才有资格参与执政。这样，我们就能建立起直接对国王负责的中央行政机构。"
 KX_PL_PG_ADVISORY_SENATE:0 "咨询参议院"
 KX_PL_PG_ADVISORY_SENATE_desc:0 "我们将设立元老院，以充分听取上层阶级的意见和建议。然而，元老院的作用将仅限于提供咨询和礼仪性的职能"
 KX_PL_PG_ADVISORY_SEJM:0 "咨询国会"
 KX_PL_PG_ADVISORY_SEJM_desc:0 "在经历了一段时间的变动之后，现在正是重新开放议会的恰当时机。然而，值得注意的是，现在的议会将致力于为国王服务，而不是像过去那样与国王分庭抗礼。"
 KX_PL_PG_ESTATE_CONSOLIDATION:0 "整合财产权"
 KX_PL_PG_ESTATE_CONSOLIDATION_desc:0 "对于土地改革问题，有两种主要的解决方案：第一种是将土地从所有者手中转让出来（转让的数量因情况而异），并将其分配给农民。然而，由于我们对土地所有权的效忠关系，这种做法是不可取的。因此，我们有第二种方案：将土地进行合并，这不仅能够满足农民的需求，还有助于促进农业劳动力向城市的迁移。通过整合的方式，我们可以更好地规划土地利用和分布，使农业变得更加现代化和高效化，从而提高农民的生产效率和收益。"
 KX_PL_PG_NEO_SERFDOM:0 "新封建制度"
 KX_PL_PG_NEO_SERFDOM_desc:0 "我们决定屈服于重新崛起的贵族的要求，土地所有者将被赋予其领地的自治权，甚至可以在自己拥有的土地上拥有某些司法特权。"
 KX_PL_PG_ROYAL_ESTATES:0 "王家领地"
 KX_PL_PG_ROYAL_ESTATES_desc:0 "为了保护我们的农业生产，国王宣布从现在开始，所有土地都属于法定的皇家领地，实际的私人拥有者将从君主那里租赁这些土地。这种做法为我们在平衡村庄中的民众和精英的利益方面提供了更多的灵活性"
 KX_PL_PG_AGRICTULTURAL_WORKERS_PROTECTION:0 "保障农业工人"
 KX_PL_PG_AGRICTULTURAL_WORKERS_PROTECTION_desc:0 "我们鼓励农民把私有土地卖给大地主，但我们不能不管这些工人！我们将起草一份法案，以确保他们获得公平的报酬和待遇。"
 KX_PL_PG_ROYAL_TRADE_UNIONS:0 "王家行会"
 KX_PL_PG_ROYAL_TRADE_UNIONS_desc:0 "尽管这些工会可能被戏称为\"卧底\"，但它们实际上更注重合作而非对抗。通过建立皇家行会，我们将确保工人能够在公平的环境中工作，同时整个行业也能像一台运转顺畅的机器一样为所有人带来福祉。"
 KX_PL_PG_PROGRESSIVE_TAX:0 "累进税"
 KX_PL_PG_PROGRESSIVE_TAX_desc:0 "我们的君主是仁慈的！因此，根据他的法令，将实施累进税制模式。通过这种方式征收的资金将被用于福利事业，以实现强者保护弱者的目标！"
 KX_PL_PG_ROYAL_MONOPOLIES:0 "王室垄断"
 KX_PL_PG_ROYAL_MONOPOLIES_desc:0 "一些产业将成为王室的私有财产，在和平时期为王室的扩张提供资金支持，同时在需要时成为高效生产措施的典范。"
 KX_PL_PG_DEREGULATION:0 "放松对市场的管制"
 KX_PL_PG_DEREGULATION_desc:0 "我们已经决定，我们国家的发展将建立在放松工业管制的基础上。这一决策可能会在短期内对普通人造成一定的影响，但我们相信最终他们也会看到犁地的滋润和收获的喜悦。"
 KX_PL_PG_LIBERAL_TAX:0 "自由主义税制"
 KX_PL_PG_LIBERAL_TAX_desc:0 "国王已经决定支持统一税收制度，这将为富人提供更多的资金用于投资。"
 KX_PL_PG_SUPPORT_FROM_CAPITAL:0 "来自大资本公司的支持"
 KX_PL_PG_SUPPORT_FROM_CAPITAL_desc:0 "我们政策的实施并没有被大资本家们忽视，现在我们在需要的时候一定可以依靠他们。"
 KX_PL_PG_TRADE_POLICY:0 "重新考虑我们的贸易政策"
 KX_PL_PG_TRADE_POLICY_desc:0 "长期以来，我们的经济一直依赖于德国，但随着黑色星期一事件的发生，我们与德国的许多联系都被切断了，而且仍有待重新建立。因此，我们面临着两条路可走的选择：要么寻求与德国更紧密的合作，这将使我们的主权和经济主导地位面临风险，但也有可能通过向德国巨型经济提供廉价劳动力而获得发展；要么我们可以尝试颁布保护主义政策，以确保稳定但可能较慢的发展。然而，我们并不完全确定德国会对其经济势力范围的突破做出何种反应。"
 KX_PL_PG_CHADECJA_ADVISORS:0 "现代君主专制"
 KX_PL_PG_CHADECJA_ADVISORS_desc:0"我们的君主决定以基督教民主原则作为治国基础，努力打造一个真正现代化的君主国。他相信，王权只有与信仰和民意结合，才能在新的时代站稳脚跟。在这位君主的治下，波兰将走上一条既传统又现代的道路。"
 KX_PL_PG_DEVOLVED_GOVERNANCE:0 "分权治理"
 KX_PL_PG_DEVOLVED_GOVERNANCE_desc:0 "波兰王国仍将是一个统一的国家，但许多权力将移交给地方民选官员"
 KX_PL_PG_EMPOWER_SEJM:0 "赋予议会更多的权力"
 KX_PL_PG_EMPOWER_SEJM_desc:0 "我们必须重开议会，恢复其权力，尽管是在君主的监督下，并恢复否决权。"
 KX_PL_PG_GERMAN_PROTECTORATE:0 "波兰保护国"
 KX_PL_PG_GERMAN_PROTECTORATE_desc:0"德国军队开进了华沙，波兰从此沦为柏林控制下的保护国。德军指挥部与德国官员接管了国家的中枢，波兰人只能在他们的阴影下苟且求生。这个政权的本质不是王冠，而是刺刀。"
 KX_PL_PG_MILITARY_COMMAND:0 "外国军政府"
 KX_PL_PG_MILITARY_COMMAND_desc:0"德国军政府成为波兰实际上的统治者，军令取代了法律，德军的利益高于一切。波兰的官员不过是执行命令的工具，任何异议都会被迅速镇压。这是一个由刺刀与电报维系的政权。"
 KX_PL_PG_EMPOWER_GERMAN_MINORITY:0 "赋予德国少数民族权力"
 KX_PL_PG_EMPOWER_GERMAN_MINORITY_desc:0"波兰境内的德意志少数民族被赋予超出其人口比例的政治与经济特权。他们控制地方政府、学校与工厂，成为帝国统治的本地支柱。民族等级制度被正式写进了法律。"
 KX_PL_PG_GERMANS_ALONE:0 "德国统治永恒"
 KX_PL_PG_GERMANS_ALONE_desc:0"军政府宣布波兰永远属于德意志帝国的势力范围，任何自治或独立的幻想都被彻底粉碎。德国定居者、军人与官员将世代统治这片土地，波兰人则被降为二等居民。这是帝国在东方的永久秩序。"
 KX_PL_PG_JEWISH_COOPERATION:0 "德犹合作"
 KX_PL_PG_JEWISH_COOPERATION_desc:0"军政府中的一部分德国官员选择与波兰犹太人合作，试图利用他们的资本、网络与国际联系。犹太人被允许在有限范围内维持社区与商业活动，以换取对占领体制的顺从。这是一种充满算计与不安的共生关系。"
 KX_PL_PG_POLISH_REPRESENTATION:0 "保证波兰人代表权"
 KX_PL_PG_POLISH_REPRESENTATION_desc:0"军政府允许建立一个由波兰人组成的代表机构，负责向占领当局转达民意。代表们可以在有限的范围内讨论地方事务，却无权触碰德国的根本利益。这个机构的存在，是为了让占领显得不那么赤裸。"
 KX_PL_PG_HUMANITARIAN_CONCERNS:0 "人道主义问题"
 KX_PL_PG_HUMANITARIAN_CONCERNS_desc:0"国际社会开始注意到波兰境内发生的暴行，柏林的宣传机器则竭力粉饰太平。军政府成立一个装点门面的委员会，声称关心当地人的福祉。人道主义的语言，被用来掩盖占领的残酷。"
 KX_PL_PG_RULE_FROM_BERLIN:0 "在柏林的管理下"
 KX_PL_PG_RULE_FROM_BERLIN_desc:0"波兰的行政、财政与军事事务全部交由柏林直接管理，华沙的政府只剩下执行权。德国各部委的指令越过波兰官员，直接下达至地方。这个国家已经不再拥有任何实质上的主权。"
 KX_PL_PG_BEGIN_GERMANISATION:0 "开始德化"
 KX_PL_PG_BEGIN_GERMANISATION_desc:0"军政府正式启动德化政策，把德国语言、法律与习俗强加给波兰社会。学校、法院与媒体成为改造国民的阵地，抵抗者被迅速镇压。这是文化灭绝的官方开端。"
 KX_PL_PG_OPEN_THE_MARKET:0 "打开市场"
 KX_PL_PG_OPEN_THE_MARKET_desc:0"军政府强迫波兰向德国商品与资本敞开市场，本土工业在廉价商品的冲击下纷纷倒闭。柏林的企业长驱直入，波兰的经济主权被彻底剥夺。所谓开放，其实是单向的掠夺。"
 KX_PL_PG_MASS_PRIVATISATION:0 "大规模私有化"
 KX_PL_PG_MASS_PRIVATISATION_desc:0"国有企业与公共资产被廉价出售给德国公司与亲德寡头，国有财富在一夜之间变成私人利润。普通波兰人失去工作与保障，少数投机者则大发横财。私有化成了占领者分赃的代名词。"
 KX_PL_PG_GRAIN_MANAGEMENT:0 "农业管理"
 KX_PL_PG_GRAIN_MANAGEMENT_desc:0"德国占领当局对波兰农业实行严格管理，规定种植品种、征收额度与粮食流向。粮食优先供应德国城市与军队，波兰城镇只能分到残余。农业管理的目的，是让这片土地为帝国服务。"
 KX_PL_PG_FEED_THE_CITIES:0 "喂饱城市"
 KX_PL_PG_FEED_THE_CITIES_desc:0"军政府把有限的粮食集中供应给城市与工业区，以避免饥饿引发暴动。乡村被要求交出收成，农民自己却常常食不果腹。喂饱城市的代价，是让乡村陷入饥饿。"
 KX_PL_PG_CASH_CROPS:0 "种植经济作物"
 KX_PL_PG_CASH_CROPS_desc:0"波兰的良田被强迫改种经济作物，为德国工业提供原料。粮食种植面积缩小，农民被迫依赖进口与配给。经济作物的利润流向柏林，留下的却是粮仓的空虚。"
 KX_PL_PG_CORPORATOCRACY:0 "企业统治"
 KX_PL_PG_CORPORATOCRACY_desc:0"德国大企业接管了波兰的经济命脉，国家机器沦为康采恩的附庸。工厂、矿山与铁路由德国经理人管理，利润源源不断地流向柏林。波兰成了一个由董事会与军政府共同统治的巨大工厂。"
 PLX_chadecja_leave_tooltip:0 "§Y基督教民主党人将退出我们的联盟§"
 PLX_natdem_old_win_tooltip:0 "§Y“旧 ”派掌握权力§"
 PLX_natdem_young_win_tooltip:0 "§Y“青年”国家民主党 在党内占主导地位"
 PLX_natdem_onr_win_tooltip:0 "§Y民族激进阵营驱逐了党政官僚"
 plx_pg_in_power:0 "德国军队发动了政变"
 KX_PL_AS_TOWARDS_PROGRESSIVE_SOCIETY_desc:0 "我们铭记历史，但不能被传统所束缚，社会进步迫在眉睫，我们应该拥抱它！"
 KX_PL_NATDEM_YOUNG:0 "青年人传递火炬"
 KX_PL_NATDEM_YOUNG_desc:0 "国民民主党领导层的权力斗争已经尘埃落定，现在是给党内 \"青年\"一派机会的时候了！"
 KX_PL_NATDEM_OLD:0 "父亲必须引导他们的儿子"
 KX_PL_NATDEM_OLD_desc:0 "尽管各方青年做出了努力，但 国家民主党\"旧派 \"还是占了上风！"
 KX_PL_NATDEM_OLD_INDUSTRIALISTS:0 "应许之地"
 KX_PL_NATDEM_OLD_INDUSTRIALISTS_desc:0 "国家民主党人一直与波兰大资本关系密切，即使在德国统治时期也一直保护其利益；现在，他们自然而然地成为了我们经济复兴的基石。"
 plx.51.t:0 "党内分裂"
 plx.51.d:0 "与波兰的其他政治运动类似，国家民主党的根基也是在波兰曾经不存在作为一个独立国家的时期建立起来的；但现在，国家民主党已经分化，\"旧 \"派的民族主义观点较为温和，注重自由放任的经济，而 \"青年 \"派则在很大程度上更具民族主义色彩，倾向于法团主义。这两个派别之间的冲突已无法避免，现在是决定国家民主党走向的时候了....."
 plx.51.a:0 "\"旧 \"派必胜！"
 plx.51.b:0 "波兰不是老头们的国家！"
 plx.51.c:0 "只有民族激进主义才能保卫波兰！"
 plx.52.t:0 "教会的财富"
 plx.52.d:0 "尽管其根源可追溯至基督教民主运动，但安东尼·西扎克及其派系一直以来在很大程度上持反教权立场； 此外，社会主义者及“人民运动”的一部分成员也支持限制神职人员的权力；然而，仍有许多“传统派”的、对宗教虔诚的基督教民主派人士支持我们，这使得我们的联盟在天主教会问题上存在分歧，尽管许多教会的反对者仍强调，他们反对的是那些腐朽的机构，而非宗教本身。鉴于这种情况，目前有三项提案正在讨论之中。第一项提案由联盟中的温和左翼支持，内容是设立教会基金，从愿意缴纳的信徒那里征收专项宗教税，所得款项将通过政府进行管理；这将使天主教会（以及其他任何宗教机构）在很大程度上依赖政府。第二项提案由更激进的左翼（以及齐沙克本人）推动，坚持采取更激进的补充措施，包括没收教会土地，并禁止宗教组织拥有任何形式的财产，从而实际上使教会基金成为其活动唯一的资金来源。第三项也是最后一项提案几乎算不上真正的提案，因为其支持者仅希望维持现状，并批评公开的反教会情绪可能通过与神职人员的琐碎冲突，对社会结构造成不必要的扰乱。然而，鉴于联盟内部在此问题上存在分歧，最终抉择权掌握在齐沙克手中——他的派系是维系这一政治联盟的关键；他究竟会优先考虑本阵营的信念，还是维护联盟内部的平衡？"
 plx.52.a:0 "教会基金是最完美的解决方案"
 plx.52.b:0 "教会基金远远不够，我们应该在慈善事业上给他们上一课！"
 plx.52.c:0 "我们应该维持现状..."
 plx.53.t:0 "联盟的变化"
 plx.53.d:0 "我们的经济和社会政策都坚定地将我们定位在左翼。实际上，我们阵营中的右翼分子已经决定脱离，因此我们只能与他们作对并告别他们。即使没有他们，我们的政治立场仍然占主导地位。我们比以往任何时候都更加坚定地站在左翼立场上"
 plx.53.a:0 "人人享有公正与进步！"
 plx.54.t:0 "联盟的变化"
 plx.54.d:0 "我们的经济和社会政策令我们进一步左倾，罗蒙德·毕苏斯基代表的市场自由主义派已经掌握了更大的话语权。"
 plx.54.a:0 "人人享有公正与进步！"
 plx.55.t:0 "联盟的变化"
 plx.55.d:0 "我们的经济和社会政策令我们进一步左倾，康斯坦蒂·卢比恩斯基代表的社会自由主义派已经掌握了更大的话语权。"
 plx.55.a:0 "人人享有公正与进步！"
