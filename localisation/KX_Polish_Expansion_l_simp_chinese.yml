 plxv2.061.t:0 "论工会"
plxv2.061.d:0 "工会已被证明是我们上台执政的一大助力；正是多亏了他们和铁路工人，我们的部队才得以及时运抵华沙。因此，有人主张与他们更紧密地结盟，建立一个中央工会，作为我们与工人之间的桥梁。然而，我们阵营中更右翼的人反对这一点，认为这会阻碍我国的军事化。"
plxv2.061.a:0 "工会将成为我们的盟友！"
plxv2.061.b:0 "除必要外，我们不应与他们有更多合作"

plxv2.062.t:0 "旧精英的命运"
plxv2.062.d:0 "旧精英曾与德国合作，这一点毫无疑问；尽管如此，公平地说，他们当时也没有太多选择。因此，我们运动中的右翼主张与他们合作；而左翼则有着截然不同的想法，认为他们不过是寄生在波兰民族大多数人身上的寄生虫。所以问题在于：我们是要与他们结盟，还是引入以毕苏斯基军团老兵为核心的新精英？"
plxv2.062.a:0 "我们将建立忠于我国的新精英！"
plxv2.062.b:0 "为了更好的未来，我们必须与旧精英合作"

plxv2.063.t:0 "独裁与年轻人的声音"
plxv2.063.d:0 "虽然军团现在掌握着我们国家的最高权力，但我们阵营远非团结。运动内部的分歧可以从许多角度来描述：“中间派”、“左派”、“右派”——然而现在最重要的是“老一代”和“年轻一代”；毕苏斯基最亲密的伙伴一直最有影响力，但时代正在变化，年轻军官也想在政府中拥有自己的角色。因此必须做出决定：我们是延续从毕苏斯基那里继承来的独裁，还是让这种“例外主义”随他的去世而终结？"
plxv2.063.a:0 "毕苏斯基的愿景将由他最亲近的圈子继续推行！"
plxv2.063.b:0 "所有士兵都是毕苏斯基的孩子，他们理应拥有发言权！"

plxv2.064.t:0 "经济方向"
plxv2.064.d:0 "波兰第二共和国争论最激烈的问题一直是其经济模式。欧根纽什·克维亚特科夫斯基提出了一项提案，要将广泛的经济计划要素引入我们的经济；然而其他人更倾向于按照经济协会的思路组织经济，左翼指向辛迪加，右翼则指向工人和资本家的组织。"
plxv2.064.a:0 "我们应考虑实施中央计划……"
plxv2.064.b:0 "中央计划将过于难以实施……"

plxv2.065.t:0 "国务委员会成员资格"
plxv2.065.d:0 "我们的领导层提出了一项提案——成立国务委员会（“Rada Stanu”），由它承担我国的日常治理职责；问题在于，军团派对其构成意见不一。一些人认为国务委员会应仅限于军事人员；另一些人（包括欧根纽什·克维亚特科夫斯基）则认为这样做不明智，必须任用各类不同领域的专家，把技术官僚原则引入我们的国家。"
plxv2.065.a:0 "引入文职专家似乎是合理的"
plxv2.065.b:0 "军方应保留其主导作用"
