 POL_slav_fed_natsoc_DEF:0 "全斯拉夫社会共和国联盟"
 KX_PL_esoterics_TAKES_POWER:0 "回归旧日"
 KX_PL_esoterics_TAKES_POWER_desc:0 "传统上的地方自治根本不是真正的自治！若要实现我们的目标，那就必须后退到传统——去学习我们祖先的经验。"
  KX_PL_ZSP_DEPOLITICIZE_TRADE_UNIONS:0 "工会去政治化"
 KX_PL_ZSP_DEPOLITICIZE_TRADE_UNIONS_desc:0 "工会需要表达工人的声音，而不是政党的声音！我们将开始工会去政治化的进程。"
 KX_PL_ZSP_CREATE_CONSUMER_SYNDICATES:0 "建立消费工团"
 KX_PL_ZSP_CREATE_CONSUMER_SYNDICATES_desc:0 "消费工团将成为我们经济的基石。通过消费者工团和即将成立的生产工团的合作，社会将摆脱利润的束缚。"
 KX_PL_ZSP_ABOLISH_PRIVATE_PROPERTY:0 "废除私有财产"
 KX_PL_ZSP_ABOLISH_PRIVATE_PROPERTY_desc:0 "私有财产必须废除；生产资料将属于使用这些生产资料的劳动者，它将体现在工团和合作社体系中，工人阶级在这些体系中相互合作。"
 KX_PL_ZSP_FOUND_PRODUCTION_SYNDICATES:0 "组织生产工团"
 KX_PL_ZSP_FOUND_PRODUCTION_SYNDICATES_desc:0 "既然我们建立了消费工团，也到了建立生产工团的时候了。无论是在城市还是在乡村，工团都将建立复杂的相互关系体系。城市无产阶级将按照以工会为代表的工厂组织起来，而农村无产阶级将以公社的形式获得大土地所有者所拥有的一切，这些公社将与城市工团紧密合作。"
 KX_PL_ZSP_AUTONOMISATION:0 "社会自治化"
 KX_PL_ZSP_AUTONOMISATION_desc:0 "每个人都需要自主权来实现自我，因此也需要政府结构。不再有宪法或僵化的法律，财团和公社将并肩工作，以自由的方式创造有约束力的法律，这与 “普通法 ”最初在盎格鲁文化圈形成的方式并无二致，但这次没有地主，也没有主人！"
 KX_PL_ZSP_BARGAIN_ECONOMY:0 "协商经济"
 KX_PL_ZSP_BARGAIN_ECONOMY_desc:0 "随着消费者与生产者联盟的成立，我们的经济将自然演进至“协商经济”​​：工团与合作社——不论是在城市还是乡村——都将开展全方位协商，实现物资流通；与此同时，消费者联盟将履行自己的​​监督责任​​——既防范资本累积，又协助定价售予工人的商品。"
 KX_PL_ZSP_COOPERATIVE_BANKING:0 "信用社"
 KX_PL_ZSP_COOPERATIVE_BANKING_desc:0 "在资本积累受限的情况下，信用社将为经济单位提供特殊的资金，用于投资，并为希望立即购买更昂贵商品的消费者提供资金。这些信用社将以极低的利润率运营，仅支付运营成本。还将建立 “人民银行”，统一各个信用社的业务，并在全国范围内提供服务。"
 KX_PL_ZSP_A_TRULY_FREE_SYSTEM:0 "真正自由之体系"
 KX_PL_ZSP_A_TRULY_FREE_SYSTEM_desc:0 "也许有人会称我们的祖先为 “原始人”，但正如马克思所论证的那样，他们可能被证明是共产主义在工作中的伟大典范；我们将把这种共产主义带回我们的时代！"
 KX_PL_ZSP_HEMPELS_CENTER:0 "老同志继续掌舵"
 KX_PL_ZSP_HEMPELS_CENTER_desc:0 "扬·亨佩尔站在我们运动的最前沿，他将保证我们人民的自由！"
 KX_PL_ZSP_GODLESS_RELIGION:0 "无神之宗教"
 KX_PL_ZSP_GODLESS_RELIGION_desc:0 "由扬·亨佩尔创造的所谓“无神宗教”的概念是一种革命性的精神意识形态，旨在实现人的终极解放，同时与宇宙、社区以及最终与自己和谐相处；展示工人骑士精神、诚实和社群同情的美德。"
 KX_PL_ZSP_REVIVAL_OF_OUR_FOREFATHERS:0 "复兴我们的先祖"
 KX_PL_ZSP_REVIVAL_OF_OUR_FOREFATHERS_desc:0 "我们可以从研究前基督教时代的祖先所实行的组织形式中获得很多智慧。我们应从中汲取灵感，创造更加公正自由的未来。"
 KX_PL_ZSP_COMBAT_CHRISTIAN_MORALITY:0 "痛击基督教道德"
 KX_PL_ZSP_COMBAT_CHRISTIAN_MORALITY_desc:0 "基督教道德是波兰民族和世界各国的毒药。它扼杀了我们先辈的英雄主义和无私的同情心，取而代之的是追求 “救赎 ”的私欲，以及为压迫制度辩护的理由...... 再也不会有了！我们将揭露卑鄙的教会机构的真面目！"
 KX_PL_ZSP_LEFT_PANSLAVISM:0 "左翼泛斯拉夫主义"
 KX_PL_ZSP_LEFT_PANSLAVISM_desc:0 "人类注定要建立兄弟情谊，但我们不要迈太大的步子；第一步是与我们亲近的人，我们的斯拉夫兄弟团聚！也许我们应该考虑组建一个统一的斯拉夫民族联邦，以实现自由和繁荣的未来！"
 KX_PL_ZSP_GMINY_FEDERALISM:0 "广泛联邦"
 KX_PL_ZSP_GMINY_FEDERALISM_desc:0 "虽然我们已经取得了长足的进步，但仍然存在一些不公正的国家机构。我们的社会将按照公社、合作社和工团自由联合的方式组织起来。"
 KX_PL_ZSP_ELECTIVE_BUREAUCRACY_2:0 "选举官员"
 KX_PL_ZSP_ELECTIVE_BUREAUCRACY_2_desc:0 "所有形式的官僚机构都需要通过选举产生，从而实现我国人民的最终表达形式！"
 KX_PL_ZSP_CONGRESS_OF_SYNDICATES:0 "工团联合会"
 KX_PL_ZSP_CONGRESS_OF_SYNDICATES_desc:0 "虽然我们的理想主义是一笔巨大的财富，但仍有许多琐事需要解决，宏观上最重要的决策也需要进行。它的作用将被降级为一个特殊的机构，类似议会制度，但通过集合来自工团、合作社和乡镇的代表来代表人民的利益。"
 KX_PL_ZSP_NECESSITY_OF_GOVERNANCE:0 "治理之重要性"
 KX_PL_ZSP_NECESSITY_OF_GOVERNANCE_desc:0 "国会将选出一个由特殊人士组成的机构，负责监督我们联邦最重要的事务，即医疗、教育和其他社会必要职能，以及军事事务。这些职位对于维护平等是必要的，否则将不可避免地危及个人自由！"
 KX_PL_ZSP_BIERUTS_NATIONALISM:0 "受控的工团主义"
 KX_PL_ZSP_BIERUTS_NATIONALISM_desc:0 "贝鲁特的实用主义将使我们一步步顺利过渡到乌托邦社会..."
 KX_PL_ZSP_CENTRAL_SYNDICATE:0 "中央工团"
 KX_PL_ZSP_CENTRAL_SYNDICATE_desc:0 "虽然工团将继续发挥其作用，但有必要建立一个中央管理机构来确保它们之间的合作。该机构将由工团、合作社和市镇代表共同选举产生，绕过任何立法机构。"
 KX_PL_ZSP_INTRODUCED_PLANNING_ELEMENTS:0 "引入计划元素"
 KX_PL_ZSP_INTRODUCED_PLANNING_ELEMENTS_desc:0 "我们将在工团主义制度中引入计划经济的元素。消费者工团将继续独立运作，而工业产品的生产者和新工厂的建设将由中央协调，必要时采取直接行动。"
 KX_PL_ZSP_NAIL_TO_SMALL_ENTRPRENEURSHIP:0 "给小商贩钉上棺材板"
 KX_PL_ZSP_NAIL_TO_SMALL_ENTRPRENEURSHIP_desc:0 "到目前为止，“小商人 ”或小企业家仍被允许在我国继续经营，但有必要消除他们的活动，以防止任何潜在的资产阶级反应。他们的商店必须置于专门成立的工会监督之下，工会的职责是为我国人民提供小规模服务，否则就没有资格进行大规模经营。"
 KX_PL_ZSP_SAFEGUARDING_SYNDICALIST_SYSTEM:0 "工团主义得以保护"
 KX_PL_ZSP_SAFEGUARDING_SYNDICALIST_SYSTEM_desc:0 "为了捍卫我们的工团主义革命，我们需要防止旧制度的残余势力重新侵入。我们将首先将最恶劣的反动派化为齑粉，并通过禁止参与广泛的政治体系来疏远那些小反动派。我们获得的自由将不会被剥夺！"
