 plxv2.044.t:0 "新的领导人"
 plxv2.044.d:0 "既然我们已经确定教会将秉持保守方针，是时候选举新国家的领导人了，两个候选人分别是现任领导人亚当·萨皮哈与和民族激进阵营有关系的马克西米利安·玛丽亚·科尔贝。"
 plxv2.044.a:0 "亚当·萨皮哈将留任"
 plxv2.044.b:0 "马克西米利安·玛丽亚·科尔贝将领导我们"
 plxv2.045.t:0 "新的领导人"
 plxv2.045.d:0 "既然我们已经确定教会将秉持进步方针，是时候选举新国家的领导人了，两个候选人分别是支持温和基督教民主的阿纳托尔·诺瓦克与和国家工党有关系的特奥多尔·库比纳。"
 plxv2.045.a:0 "阿纳托尔·诺瓦克将成为领导人"
 plxv2.045.b:0 "特奥多尔·库比纳将领导我们"
 plxv2.046.t:0 "新的领导人"
 plxv2.046.d:0 "既然我们已经确定教会将秉持激进方针，是时候选举新国家的领导人了，两个候选人分别是支持温和基督教民主社会主义的斯特凡·维辛斯基与和共产党有关系的约瑟夫·凯勒。"
 plxv2.046.a:0 "斯特凡·维辛斯基将成为领导人"
 plxv2.046.b:0 "约瑟夫·凯勒将领导我们"
 plxv2.047.t:0 "另一位竞争者"
 plxv2.047.d:0 "在塔谢姆卡老爹和他的社会党民兵夺取政权后不久，另一群自称“13区集团”的暴徒对新政府发动了进攻，而这场行动最终……"
 plxv2.047.a:0 "……是失败的。"
 plxv2.047.b:0 "……是成功的。"
 plxv2.048.t:0 "反政变"
 plxv2.048.d:0 "出于对斯塔赫纽克与苏卡尔斯基的激进反教权主义的反对，札德鲁加内部中的温和派在维尔斯基的带领下联合军团势力的残余，将两人在会场内逮捕，并强迫札德鲁加其他人员选举自己为临时领导人。"
 plxv2.048.a:0 "这会是疯狂的终结吗？"
 plxv2.110.t:0 "新的领导人"
 plxv2.110.d:0 "随着纳托林派占据多数，是时候选举新国家的领导人了，三个候选人分别是支持民族社会主义的将军的米奇斯瓦夫·莫恰尔、前民族民主党人斯坦尼斯瓦夫·格拉布斯基与和民族共产主义者卡齐米日·米亚尔。"
 plxv2.110.a:0 "米奇斯瓦夫·莫恰尔将成为领导人"
 plxv2.110.b:0 "斯坦尼斯瓦夫·格拉布斯基将成为领导人"
 plxv2.110.c:0 "卡齐米日·米亚尔将成为领导人"
 plxv2.111.t:0 "新的领导人"
 plxv2.111.d:0 "随着未来主义派占据多数，是时候选举新国家的领导人了，三个候选人分别是被冠为“诅咒诗人”的布鲁诺·亚辛斯基、亲近工团主义的反威权派亚历山大·瓦特与倾向于意大利式未来主义的阿纳托尔·斯特恩。"
 plxv2.111.a:0 "布鲁诺·亚辛斯基将成为领导人"
 plxv2.111.b:0 "亚历山大·瓦特将成为领导人"
 plxv2.111.c:0 "阿纳托尔·斯特恩将成为领导人"
 plxv2.112.t:0 "新的领导人"
 plxv2.112.d:0 "随着卢森堡派占据多数，是时候选举新国家的领导人了，候选人仅有一个，那就是有着“革命之鹰”之称的罗莎·卢森堡。"
 plxv2.112.a:0 "为什么要让一个德国人来领导我们……"
 plxv2.143.t:0 "札德鲁加领导人问题"
 plxv2.143.d:0 "一直以来，斯塔赫纽克都保持着运动领导人的地位。然而自从札德鲁加掌权以来苏卡尔斯基的权威就在逐步飙升。为了一劳永逸解决这个问题，斯塔赫纽克召开了一场会议来选举新的领导人。"
 plxv2.143.a:0 "斯塔赫纽克继续担任领导人"
 plxv2.143.b:0 "苏卡尔斯基将成为领导人"
 plxv2.143.c:0 "等等，外面好像有什么动静……"
 plxv2.144.t:0 "新国家的领导人"
 plxv2.144.d:0 "随着斯塔赫纽克与苏卡尔斯基的残余势力被肃清，维尔斯基已经决定举行一场自由选举来决定谁将领导这个国家。"
 plxv2.144.a:0 "维尔斯基继续担任领导人"
 plxv2.144.b:0 "延德热耶夫斯基将成为领导人"
 plxv2.144.c:0 "涅奇科将成为领导人"
 plxv2.144.e:0 "菲尔查克将成为领导人"
 plxv2.145.t:0 "共和国的领导人"
 plxv2.145.d:0 "既然旧派已经占据了多数，是时候选出一位不负德莫夫斯基之愿的新总统了。参与争夺的包括历史学教授费利克斯·科内奇尼，经济学家罗曼·雷巴尔斯基与保守派斯坦尼斯瓦夫·斯特罗涅斯基。"
 plxv2.145.a:0 "罗曼·雷巴尔斯基将担任领导人"
 plxv2.145.b:0 "斯坦尼斯瓦夫·斯特罗涅斯基将成为领导人"
 plxv2.145.c:0 "费利克斯·科内奇尼将成为领导人"
 plxv2.146.t:0 "共和国的领导人"
 plxv2.146.d:0 "既然新派已经占据了多数，是时候选出一位不负德莫夫斯基之愿的新总统了。参与争夺的包括德莫夫斯基的副手塔德乌什·别莱茨基与准军事组织领导者延德热伊·吉尔蒂赫。"
 plxv2.146.a:0 "塔德乌什·别莱茨基将担任领导人"
 plxv2.146.b:0 "延德热伊·吉尔蒂赫将成为领导人"
 plxv2.147.t:0 "共和国的领导人"
 plxv2.147.d:0 "既然民族激进派已经占据了多数，是时候选出一位不负德莫夫斯基之愿的新总统了。参与争夺的包括左翼候选人博莱斯瓦夫·皮亚塞茨基与右翼候选人亨利克·罗斯曼。"
 plxv2.147.a:0 "博莱斯瓦夫·皮亚塞茨基将担任领导人"
 plxv2.147.b:0 "亨利克·罗斯曼将成为领导人"
 plxv2.148.t:0 "“黄色工团主义？”"
 plxv2.148.d:0 "塔德乌什·托特莱本作为民族激进阵营的官方工会波兰劳动工会的领导人，已经获得了越来越多的支持，他主张学习法国的黄联模式将右翼工会发扬光大，我们应该接受这一思想吗？"
 plxv2.148.a:0 "工团主义？赤匪回来了？"
 plxv2.148.b:0 "这正是我们需要的"
 plxv2.149.t:0 "总督问题"
 plxv2.149.d:0 "曼施坦因只是一名将军，他对于处理波兰国内大小事务并没有什么兴趣。柏林方面已经在考虑派遣一名总督，或者任命一位当地人。"
 plxv2.149.a:0 "亚历山大·帕尔乌斯凭借社民党的支持成为了总督"
 plxv2.149.b:0 "奥托·安布罗斯在ig法本的游说下成为了总督"
 plxv2.149.c:0 "亲德派瓦迪斯瓦夫·斯图德尼茨基被任命为总督"
 plxv2.149.e:0 "犹太人约瑟夫·塞林斯基被任命为总督"
 plxv2.149.f:0 "曼施坦因继续担任总督"
 plxv2.149.g:0 "本地极右翼亚瑟·格雷泽担任总督"
 plxv2.150.t:0 "紧急委员会召开"
 plxv2.150.d:0 "在我们决定与德国决裂之后，一些人主张撤换帕尔乌斯，让履历更加干净的朱利安纳·布伦作为领导人。我们真的要这么做吗？"
 plxv2.150.a:0 "亚历山大·帕尔乌斯继续领导"
 plxv2.150.b:0 "朱利安纳·布伦成为了新主席"
 plxv2.150.c:0 "雅纽什·拉齐维乌在第三国际支持下发动了政变"
 plxv2.151.t:0 "帕尔乌斯去世"
 plxv2.151.d:0 "今天早上，我们的领导人帕尔乌斯被发现在睡梦中去世。当人民还在哀悼时，临时委员会已经决定任命一名失势的非洲殖民官僚汉斯·弗兰克成为新主席。"
 plxv2.151.a:0 "认真的吗？"
 PLX_integrate_wermacht:0 "整合“波兰国防军”"
 PLX_polish_war_effort:0 "波兰战争投入"
 PLX_manstien_reform_plan:0 "曼施坦因-莱温斯基改革计划"
 PLX_integrate_wermacht_desc:0 "尽管波兰是个相对独立的国家，但它在军事方面却严重依赖德国顾问团，也就是众所周知的“波兰国防军”。德国顾问团既不受普罗大众和波兰军人的待见，自己也对德国的上级越来越反感。这样的分歧正是造成军队士气持续低迷的根源。为了弥补这种情况，德国代表团的部队将慢慢地适当与波兰部队融合起来，以确保军中德国军官和波兰军官之间的平等。"
 PLX_polish_war_effort_desc:0 "俄罗斯巨熊再次将它的目光投向了西方，试图摧毁我们辛苦编织的波兰国家。我等波兰人以及东欧的兄弟们将一同构成一道抵御俄罗斯践踏的最后防线。在德国督察员的支持下，我们将再度消除俄罗斯的威胁，恢复欧洲的和平与繁荣！"
 PLX_manstien_reform_plan_desc:0 "虽然保守势力在德国本土的军队中根深蒂固，但追求创新的军官却在帝国本土以外的地区取得了巨大的现代化成果。身为德国顾问团最高级别的成员之一，天赋异禀的埃里希·冯·曼施坦因·莱温斯基就是这样一位改革者。他对波兰军队现代化所提出的激进建议被称为“重点突破战术”，在其概述中机动装甲部队将在战场上带头冲锋，轻松地将任何攻势引向胜利。希望这些战术在波兰的成功能够帮助帝国陆军清晰地看到未来的道路。"
