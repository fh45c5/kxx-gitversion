 zhinan.43.t:0 "哥伦比亚路线指南"
 zhinan.43.d:0 "皮尼利亚独裁：完成国策审议新改革提案之后，在事件里选择与准军事组织或者军队结盟。如果与准军事组织结盟，在事件“布卡拉曼加局势动荡”中选择“公开此事风险过高”；如果与军方结盟，在事件“军方取得一项胜利”中选择“我认为我们所采取的措施已相当充分”，随后在事件“危机时刻，孤注一掷”中选择“此举令人难以置信”，随后可以在事件中选择皮尼利亚、丘拉维塔或猎豹党；又或者，直接走红线，选择使军队政变风险上升的选项。\n\n民主选举：尽可能选择改善波哥大事件的事件选项，随后在“爆炸性新闻”中选择进行提前选举，可以选择国家经济爱国行动/自由党/保守党/丘拉维塔/猎豹党/国民左翼革命联盟。选举国民革命左翼联盟将进入红线。\n\n无政府极权线：进入猎豹党线，完成前五个国策之后，在事件“一个警告”中选择“我们暂时不用管他们”或“直接让他们滚蛋！”，然后在事件“决裂”里选择“让我们坚持我们现在的道路”。"
 NIC_luxianzhinan:0 "尼加拉瓜路线指南"
