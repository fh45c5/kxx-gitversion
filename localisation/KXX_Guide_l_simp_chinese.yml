 zhinan.5.t:0 "匈牙利路线指南"
 zhinan.5.d:0 "斯洛伐克：在斯洛伐克当地知名人士在普雷斯堡会面事件中选择这场运动是否将不复存在呢？事件链后斯洛伐克将独立。"
 SQI_tree:0 "山东路线指南"
 SQI_luxianzhinan:0 "山东路线指南"
 zhinan.6.t:0 "山东路线指南"
 zhinan.6.d:0 "归一道/新月社/山东红军/外国雇佣军：点两张会国策，宋哲元事件中选择封路，在随后的“一贯道对张宗昌表现了愤怒”事件中选择“放把火，烧死他们”选项，然后在接下来的事件中选择想要游玩的路线。（由上到下：红万字社，新月社，山东红军，外国雇佣军)。"
 CAN_tree:0 "加拿大路线指南"
 CAN_luxianzhinan:0 "加拿大路线指南"
 zhinan.7.t:0 "加拿大路线指南"
 zhinan.7.d:0 "红加拿大：走君主专制线，让爱老八遇刺，解散加拿大王国。"
 FRG_tree:0 "法国复兴政府路线指南"
 FRG_luxianzhinan:0 "法国复兴政府路线指南"
 zhinan.10.t:0 "法国复兴政府路线指南"
 zhinan.10.d:0 "雷米存活/雷米继承人：完成政治线最后一个国策之后选择雷米存活或雷米死亡。\n\n安保国家：进入雷米继承人线，选择香奈儿，在完成扩展情报机构之后提拔克拉拉，半年后在事件里选择逮捕克拉拉。\n\n公社残党：不管水晶之夜决议，倒计时结束之后维达尔就会政变。若选择进行”选举“则进入极权线，进行选举则进入温和线。\n\n黑帮：进入公社残党极权线，选择萨比亚尼，在完成搜捕吉伦特派的事件里选择终结保留区。"
 GEO_tree:0 "格鲁吉亚路线指南"
 GEO_luxianzhinan:0 "格鲁吉亚路线指南"
 zhinan.11.t:0 "格鲁吉亚路线指南"
 zhinan.11.d:0 "高加索社团：先进入蓝角线，完成国策格鲁吉亚新时代，在邀请文化派事件选择同意。"
 FIN_tree:0 "芬兰路线指南"
 FIN_luxianzhinan:0 "芬兰路线指南"
 zhinan.12.t:0 "芬兰路线指南"
 zhinan.12.d:0 "法老：黑色星期一后的“黄金书出版”事件选择“难道你会在意一个疯子的胡话吗？”，“芬诺埃及学会？”事件选择“随他去吧，一群疯子闹不起什么风浪的”，“密会”事件中选择“合作愉快”，“下一步”事件选择“调遣部队，对这些暴徒重拳出击！”。"
 BEL_tree:0 "比利时路线指南"
 BEL_luxianzhinan:0 "比利时路线指南"
 zhinan.13.t:0 "比利时路线指南"
 zhinan.13.d:0 "蒂里亚特：先按照kx自带的路线指南里的步骤让弗兰德斯瓦隆崩溃，然后转到佛兰德斯，让佛莱芒议会掌权并拒绝民主实行独裁，完成国策强制推行佛莱芒文化，在事件中选择佛莱芒民族联盟的计划，三年之后蒂里亚特就会政变。（嫌慢可以控制台输入 event fln.100）"
 FLN_tree:0 "佛兰德斯路线指南"
 FLN_luxianzhinan:0 "佛兰德斯路线指南"
 zhinan.14.t:0 "佛兰德斯路线指南"
 zhinan.14.d:0 "蒂里亚特：先按照kx自带的路线指南里的步骤让弗兰德斯瓦隆崩溃，然后转到佛兰德斯，让佛莱芒议会掌权并拒绝民主实行独裁，完成国策强制推行佛莱芒文化，在事件中选择佛莱芒民族联盟的计划，三年之后蒂里亚特就会政变。（嫌慢可以控制台输入 event fln.100）"
 ENG_tree:0 "不列颠联盟路线指南"
 ENG_luxianzhinan:0 "不列颠联盟路线指南"
 zhinan.15.t:0 "不列颠联盟路线指南"
 zhinan.15.d:0 "红色社会信用体制：走莫斯利线，完成国策大护国公后在事件“来自ERC的联系人中”选择接受。\n\n莫斯利泛欧主义扩展：两种办法。可以在事件“来自ERC的联系人中”选择“或许我们应该转向另一个方向”，也可以在完成国策革命之后的事件“新的革命理念”选择“这个概念似乎很有趣”。\n\n托马斯·曼恩的列宁主义线：在选举的时候每个派系都选一次，达成僵局，僵局事件里随便选择一个，完成国策重拾列宁理想。\n\n霍巴特的更多国王：走霍巴特线后在决议里选。绝大部分国王都可以为你提供他们的王位宣称地区的核心。"
 IRE_tree:0 "爱尔兰路线指南"
 IRE_luxianzhinan:0 "爱尔兰路线指南"
 zhinan.16.t:0 "爱尔兰路线指南"
 zhinan.16.d:0 "爱尔兰红线扩张线：首先，在游戏规则里预设英国任意霍巴特路线或者联合王国复辟，然后按照路线指南让左派上台。左线直接宣战，右线是引爆英国内战，走这条线一定要拿下伦敦。\n\n社会信用党：走共和军线，之后选最后的选项。"
 POR_tree:0 "葡萄牙路线指南"
 POR_luxianzhinan:0 "葡萄牙路线指南"
 zhinan.17.t:0 "葡萄牙路线指南"
 zhinan.17.d:0 "各种各样的打人决议：打赢与中央非洲的战争，完成国策凯胜后显示。绝大部分的决议战争都有脚本和平，直接弹事件割地。"
 SRI_tree:0 "意社路线指南"
 SRI_luxianzhinan:0 "意社路线指南"
 zhinan.18.t:0 "意社路线指南"
 zhinan.18.d:0 "墨索里尼继承人：走墨索里尼线，在墨索里尼是领导人的情况下1940.2.14日触发丰塔纳广场爆炸事件，选择“哦不”，完成国策新领袖在事件里选择。"
 ITA_tree:0 "意大利共和国路线指南"
 ITA_luxianzhinan:0 "意大利共和国路线指南"
 zhinan.19.t:0 "意大利共和国路线指南"
 zhinan.19.d:0 "红线：1936年选举直接选，不要让政府崩溃。\n\n君主线：选择除民族主义协会外的任意党派，让民族主义协会的进军失败，然后让不信任投票通过，在事件里选择重建君主制。"
 KUB_tree:0 "库班路线指南"
 KUB_luxianzhinan:0 "库班路线指南"
 zhinan.20.t:0 "库班路线指南"
 zhinan.20.d:0 "大斯基泰：首先，在游戏规则里选择“库班起义军”。\n\n在事件“拉达辩论陷入僵局”中选择“阿塔曼应当介入”，“对伊万尼斯内阁进行不信任投票”中选择“阿塔曼二话不说解散了拉达”，之后完成国策经济救济，完成决议请求德意志援助，由于预设德国必然不给援助，库班将会崩溃。\n\n然后在事件“新罗西斯克之战”选择“我们自己就能对付他们”进入库班起义军线，完成国策动员军团，在政变事件里选择新罗西斯克陷落。"
 SER_tree:0 "塞尔维亚路线指南"
 SER_luxianzhinan:0 "塞尔维亚路线指南"
 zhinan.21.t:0 "塞尔维亚路线指南"
 zhinan.21.d:0 "摄政傲然挺立：一直等到1937年3月，在事件“齐夫科维奇要求王储回国”选择“我们不能激怒奥地利”，“进军贝尔格莱德”选择“镇压这些叛国者！”，“约万诺维奇会见摄政”选择“塞尔维亚需要英明神武的领袖！”，“实业家切断支持”选择“拒不让步”。\n\n民主线：“约万诺维奇会见摄政”选择“我们会接受并着手于此”，然后可以选举市自、社保、社民、社自或激社。\n\n君主线：事件“齐夫科维奇要求王储回国”选择“很好，准备加冕礼吧！”。\n\n三月阴谋：进入君主线，左侧与右侧国策均只完成4个，且在完成国策“摄政权力集中”之前先完成“王室巡游”，亚历山大二世就会遇刺，然后接受西莫维奇的提议。\n\n黑手：走民主线或博约维奇线，事件“另一只手的袭击”选择“团结或者死亡”。\n\n南斯拉夫民族联盟：走博约维奇线，成立南斯拉夫之后让他退休，在事件“决裂和死亡”里选择。\n\n切特尼克：打输与保加利亚的战争，在事件“切特尼克政变”里选择不管。\n\n奥布雷诺维奇王朝：打输与保加利亚的战争，在事件“切特尼克政变”里选择向维也纳与索菲亚求救。"
 BUL_tree:0 "保加利亚路线指南"
