 GRU_tree:0 "红德路线指南"
 GRU_luxianzhinan:0 "红德路线指南"
 zhinan.2.t:0 "红德追加路线指南"
 zhinan.2.d:0 "元首线：红德开会选台尔曼，在随后的事件选择请继续即可进线。（注：总督辖区必须要在元首切换雅利安帝国前让总督辖区完成第一个国策拿核心，切记。）\n 伯明翰市政府（彩蛋）：走元首线，傀儡不列颠，在英格兰的异常波动事件中选择我们奋力前行，逆水行舟，时间不停倒退，回到过去。"
 POL_tree:0 "波兰路线指南"
 POL_luxianzhinan:0 "波兰路线指南"
 zhinan.3.t:0 "波兰路线指南"
 zhinan.3.d:0 "军团主义者：在初始国策中选择接近军队，在国王的演讲中选择支持皇家委员会，然后与工会协商，完成复兴之歌国策后的事件中选择拒绝与工人会面。更多请在萨纳齐亚页面查看。\n\n左翼社会党/波兰工团主义者：在初始国策中选择接近军队，在国王的演讲中选择支持皇家委员会，然后镇压工会。在完成复兴之歌国策后您将在这两条路径之间有一个明确的选择。\n\n民主路线：在初始国策中选择接近军队，在国王的演讲中选择支持议会，镇压工会，然后可以在选举事件中选择人民党，基督教民主工党，社会党右派，国家民主党。\n\n国家工党：在初始国策中选择接近军队，在国王的演讲中选择支持议会，与工会协商，选举事件选择国家民主党，然后完成废除君主制公投时就会触发事件政府倒台。\n\n共产主义者：确保军团主义者政变（请参见上文），但决定与工人会面。\n\n德国驻军线：在初始国策中选择接近德国驻军，在国王的演讲中选择支持议会。\n\n皇家委员会/新国王线：在初始国策中选择接近德国驻军，在国王的演讲中选择支持皇家委员会。\n\n札德鲁加/自由札德鲁加/国社党/激进治愈运动/复兴联盟/黑帮：走民族民主党线，让废除君主制投票失败，然后会有一个事件选择。若要走自由札德鲁加，进入札德鲁加线完成国策“一个领袖，一个民族”的事件里选择“等等，外面似乎有什么动静”。\n\n团结工会：让国家工党上台，并保留君主制，团结工会就会发动政变。如果推翻的是国家工党左派，团结工会右派就会掌权，如果推翻的是国家工党右派，团结工会左派就会掌权。"
 FRA_tree:0 "法国路线指南"
 FRA_luxianzhinan:0 "法国路线指南"
 zhinan.4.t:0 "法国路线指南"
 zhinan.4.d:0 "第一次选举工团派/无政府派/雅各宾派/索雷尔派：在选举事件链选择同一派系三次或更多次。\n\n僵局：不要选择任意一个派系三次或更多次。\n\n第二次选举工团派/无政府派/激进派/温和派：在第一次选举中不要让极权主义者上台，1941年就会开始第二次选举。在第二次或者之后的任意一次选举中选择极权主义者将会永久停止选举。\n\n索雷尔派后续：在命定之日中选择瓦卢瓦死亡，镇压无政府主义者；或者放任无政府主义者，但阻止他们占领巴黎。（这是进入阿尔蒂线的唯一方法）\n\n瓦卢瓦幸存：在命定之日事件里选择无大碍将会进入正常路线，选择受重伤则进入贝尔特或瓦卢瓦魔怔线。\n\n戴亚及其选举：按kx自带路线指南操作，推翻索雷尔派之后可以选择拒绝选举或者开启选举。"\n\n巴塔耶：进入戴亚线，选择戴亚与其盟友未能达成一致。\n\n共治帝国运动：进入黑卫军线，完成最后一个国策后让马赫诺被刺杀，并让各地自行决定情况。\n\n内战：按如上方法进入僵局里贝斯线，拒绝所有人的支持，里贝斯被刺杀之后就会内战,可以切换到布列塔尼/奥克西塔尼亚/诺曼底/洛林，目前仅布列塔尼有内容。更多内容请在复兴政府查看。\n\n果农起义：在葡萄酒减产的事件里选择古安的方案，事件链之后就会内战，丢失巴黎或打假赛150天即可。\n\n由于路线众多，故采取了动态国策的形式，如需查看想玩路线的国策请控制台开启debug使用调试决议查看，请先点击选择陆军的决议否则国策显示重叠。"
