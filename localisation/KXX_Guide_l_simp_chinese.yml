 zhinan.49.t:0 "奉天政府路线指南"
 zhinan.49.d:0 "张作霖武力统一：在占领北京之前，让光复系/交通系/张氏集团的权力大于45％，拒绝和平统一，在国策“总统问题”里让张作霖拒绝让位或者在刺杀中活下来。如果没有任何一个势力多数，默认解锁安国军政府线。\n\n张作霖和平统一：占领北京后选择和平统一，需要至少两个势力参加以防止会议破产。若要邀请联省派，需要陈炯明在两广掌权；若要邀请宋庆龄，需要国民党左派不存在。会议成功召开之后，在事件“抉择时刻”中选择“谴责让步行为！”，然后在决议里满足军阀的要求。如果邀请了联省派或宋庆龄，记得也满足他们的要求。\n\n张学良线：按照张作霖武力统一线进行，在国策“总统问题”里让张作霖传位给张学良或者在张作霖遇刺死亡后令张学良接管政权。\n\n协和会线：按照张作霖武力统一线进行，在国策“总统问题”中让张作霖遇刺死亡后杨宇霆接管政权，然后在事件“关于奉天省政务移交及拥护协和会之声明”中选择“天意难违”（拒绝下台会导致进入未完成的日本占领线）\n\n地方主义者/土匪：在事件“谣言激起地方主义者骚动”后什么也不做，等待任务“地方主义暴乱”读条结束。"
 zhinan.50.t:0 "德属东亚指南"
 zhinan.50.d:0 "问：巴林死后如何选出各种德属东亚领导人？\n\n答：在“柏林当局任命新政府”事件中直接选赫尔穆特·冯·穆克（社保）、约西亚斯亲王（威民）、威廉·海耶（家独）。\n\n问：如何避免印度支那起义？\n\n答：在“平定公社运动”事件中，如果想要和平解决（事件选项一），首先保证社会主义者与民族主义者势力都低于50（§Y已成威胁§!），同时确保社会主义者势力低于民族主义者势力，同时§O印度支那服从度§!大于7。如果选择镇压，需要保证社会主义者与民族主义者势力都低于65（§O燎原之火§!），同时服役人数超过200k,并保证§P印度支那掌控度§!大于8。\n\n问：我想玩舍尔纳线图图人怎么办？\n\n答：选海耶触发印支战争，并且打输。之后舍尔纳就会让海耶滚蛋。\n\n问：我想玩民主线怎么办？\n\n答：虽然不知道你为什么要玩一条还没做空壳线路，但你还是可以玩穆克，走右线改革殖民地（不用放出越南），完成改革点完最后一个国策就可以点开放党禁国策走民主选举。\n\n问：我海盗线和中央党线呢？\n\n答：没做，等二期德属东亚更新吧。\n\n问：我想玩越南\n\n答：走穆克线，在两次保大的改革中都同意，在之后点国策以越治越时放出越南就可以了。"
 zhinan.51.t:0 "加利西亚指南"
 zhinan.51.d:0 "地主/神秘主义：初始国策选呼吁贵族，国家委员会，信任市场。若要走神秘主义线，在第一个国策的事件里让他们成功。\n\n军事独裁：初始国策选呼吁贵族，国家委员会，抛售石油。\n\n民主/技官线：初始国策选紧急救济，安抚少民。若要走技官线，在选举事件中选择僵局。\n\n红线/亲俄派：初始国策选紧急救济，国家委员会。若要走亲俄派，在第一个国策的事件里让他们成功。\n\n民族主义/德国人线:初始国策选呼吁贵族，安抚少民。若要走德国线，在第一个国策的事件里让他们成功。\n\n西乌克兰：令乌克兰人抵抗度达到90以上。"
 zhinan.52.t:0 "萨纳齐亚指南"
 zhinan.52.d:0 "斯瓦韦克：在权力平衡中令左翼胜出，并确保团结度大于45且激进度小于60。若激进度为低（小于30），将解锁国策“回归社会主义根源”；若激进度为中（介于30与60之间），将解锁国策“实现毕苏斯基的愿景”。“奖赏上校集团”始终可选。\n\n希米格维：在权力平衡中令右翼胜出，随后在右翼联盟内部斗争决议中令希米格维的权威最高，并确保团结度大于45且激进度小于60。若激进度为低（小于30），将解锁国策“组建民族统一营”；若激进度为中（介于30与60之间），将解锁国策“第一元帅，第二人物”。“授权总统密党”始终可选。\n\n莫希奇茨基：在权力平衡中令右翼胜出，随后在右翼联盟内部斗争决议中令莫希奇茨基的权威最高，并确保团结度大于45。若激进度为低（小于30），将解锁国策“维持三巨头同盟”；若激进度为中（介于30与60之间），将解锁国策“门徒派的政权”；若激进度为高（大于60），将解锁国策“劳工俱乐部的崛起”。\n\n贝克：在权力平衡中令右翼胜出，随后在右翼联盟内部斗争决议中令贝克的权威最高。在事件中任命米耶齐斯瓦夫·基纽什将解锁国策“唤醒国民精神”，任命古斯塔夫·奥尔利茨-德雷泽将解锁国策“地缘政治原则”。\n\n城乡无产阶级联盟/社会党前革命派/国家工党：在权力平衡中令左翼胜出，并确保团结度低于45，完成国策“圣子的回归”。若激进度为低（小于30），国家工党将上台；若激进度为中（介于30与60之间），社会党前革命派将上台；若激进度为高（大于60），城乡无产阶级联盟将上台。\n\n德乌戈绍夫斯基/中央阶级工会联盟：在权力平衡中令左翼胜出，并确保团结度大于45且激进度大于60，完成国策“圣子的回归”，随后可以在事件中选择两者之一。\n\n民族革命阵营/萨文科夫派/民族右翼党：在权力平衡中令右翼胜出，随后在火药桶组合决议中令希米格维的权威最高，并确保团结度低于45，完成国策“一位新奥古斯都”。若激进度为低（小于30），民族右翼党将上台”；若激进度为中（介于30与60之间），萨文科夫派将上台”；若激进度为高（大于60），民族革命阵营将上台。\n\n热里戈夫斯基/超级大国联盟：在权力平衡中令右翼胜出，随后在火药桶组合决议中令希米格维的权威最高，并确保团结度大于45且激进度大于60，完成国策“一位新奥古斯都”，随后可以在事件中选择二者之一。\n\n民主派政变：在权力平衡中令右翼胜出，随后在火药桶组合决议中令莫希奇茨基的权威最高，并确保团结度低于45，完成国策“城堡中的新王”。在完成国策“第一次自由选举”之后可以选择民主党或保守党。\n\n农民营/青年民族主义者联盟/军事政变：确保你要玩的势力的影响力大于70，在权力平衡中令任意一方胜出，随后完成国策“最长的一天”。"
