 zhinan.54002.d:0 "问：国家人民党/平民党？\n\n答：大选选陷入僵局，用加纳避免内战就能在40年选举中选平民党（进步派、社会主义派），用诺里斯避免内战能在40年选国家人民党（民族派）。在平民党/国家人民党的独特事件链开始后要全选增加胜选概率的事件和决议，当胜选概率达到60%及以上（广受支持或胜券在握）后在大选中就可以让平民党/国家人民党获胜。\n\n问：怎么让我想玩的路线获胜？\n\n答：对于平民党的朗派和里德派，以及所有国家人民党派系都只需要在演讲人选中选择自己派系的人演讲。对于平民党的妥协派则要让平民党的政策分布为3：3，之后会提名一位新的妥协人选作为平民党的总统提名。\n\n问：和平建立白劳德的联合工团/布拉德利政变？\n\n答：进入平民党路线，提名里德或者白劳德作为总统。\n具体方法：\n在演讲人选中都选择社会党派系选择的人演讲。\n\n40年大选走平民党国策树，要触发政变则需要优先完成社会党派专属国策树；在事件“华尔街的命运”中选择拆除华尔街，“最高法院的变动”中选择“……以及正确的裁决”，“选举人团制度的命运”中彻底废除选举人团制度。\n\n在不完成国策“为平民而生之军”的前提下完成上述所有步骤后就会触发政变，可以选布拉德利政变（威民，解锁三巨头国策树）、白劳德极权派政变（可以变身联合工团）。\n\n问：国家人民党和平建立宪政国/霍尔德里奇的社民军政府？\n\n答：完成“终结无政府主义威胁”国策后触发里德被刺杀事件。之后霍尔德里奇会发动政变。霍尔德里奇的军政府属于社民，政府是进步派，有原住民做副总统。霍尔德里奇政变几天后巴顿会反政变，成功即可变身宪政国，再过几天就可以在巴顿、默里、拉塞尔、克伦普路线之间进行选择了。"
