 zhinan.1.d:0 "打开你的决议栏，一路翻到最底下，会有一个xx路线指南的决议，点他就能看了。（如果你的国家有kxx新增内容的话）"
 zhinan.1.a:0 "§R再 不 看 指 南 乱 问 就 滚§!"
