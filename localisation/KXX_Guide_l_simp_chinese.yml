 zhinan.23.t:0 "保加利亚路线指南"
 zhinan.23.d:0 "自由党：打赢巴尔干战争即可。\n\n农民联盟：打输巴尔干战争事件选。\n\n激进民主党/社民工党广泛派/专制派/环节集团：有很多进线的办法（尤其是专制派），下面只列出最简单的两种。\n第一种办法：打赢巴尔干战争，在1939.11.11日后沙皇死亡的事件里选择。\n第二种办法：打输巴尔干战争事件里直接选。\n\n红线：走激进民主党或者社民工党广泛派线，上台之后30天左右在事件“不满的传言”里选。\n\n赞科夫/青年军官团/祖国阵线/神秘主义者：走农民联盟线，先完成国策“成立保加利亚共和国”，然后完成国策“去军事化”，在弹出的事件里直接选。若要走神秘主义线，选择“混乱席卷索菲亚”。\n\n现在怎么走保加尔汗国线：在关于穆斯林的紧张局势爆发之后，完成国策“保加利亚化”，在事件“鞑靼人的提议”选择“我想我们确实可以拨出一些资金”，当你看到事件“政府内崛起的鞑靼情怀”的时候，准备工作就完成了。现在，进入激进民主党线或者社民工党广泛派线，30天后触发的事件“不满的传言”会多一个保加尔主义者政变的选项，选这个就可以了。\n请注意：如果在事件“政府内崛起的鞑靼情怀”之前就触发了事件“不满的传言”，将无法进入该线！\n\nIMRO:打输巴尔干战争，完成国策“援助马其顿内革组”，随后让IMRO影响力超过101即可。"
