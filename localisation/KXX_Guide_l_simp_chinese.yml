 zhinan.45.t:0 "黑山路线指南"
 zhinan.45.d:0 "人民党/真人民党/皇室独裁：黑色星期一开始后不久，在事件普拉瓦希派向国王施压中选择共商选举公投，尼克希奇公民投票里选择。\n\n民族主义线：走人民党线，在一系列事件中选择增加民族主义者势力的选项4次及以上，完成国策一个新社区之后就会出现政变事件。\n\n红切特尼克/捷克斯洛伐克军团：在一系列事件中选择增加红切特尼克势力的选项4次及以上，完成国策一个新社区或回到正轨或巴尔干地区商业格局。之后就会出现政变事件。\n\n亚历山大二世流亡：预设塞尔维亚为元帅线或共和线，在事件里为亚历山大二世提供庇护所，在后面的事件链中不要打压他，随后他就会政变。"
 SVK_luxianzhinan:0 "斯洛伐克路线指南"
 SVK_tree:0 "斯洛伐克路线指南"
 zhinan.46.t:0 "斯洛伐克路线指南"
 zhinan.46.d:0 "社民党/农民党：独立之后一个月的选举直接选。\n\n民族党：选举选社民，在事件赫林卡人民党声援民族党抗议行动中选择让右翼滚。\n\n1940年选举/社会主义革命/赫林卡人民党/军政府/乌克兰流亡：在事件选举安保中选择加强安保将进入第二次选举线。若不加强，在事件秩序崩溃中选择镇压右翼将导致社会主义革命，镇压右翼将导致赫林卡人民党上台，若要走军政府/乌克兰流亡线，在事件斯洛伐克民族起义中推翻赫林卡人民党，然后在事件乌克兰在行动中选择。"
 YUN_luxianzhinan:0 "云南路线指南"
 YUN_tree:0 "云南路线指南"
 zhinan.47.t:0 "云南路线指南"
 zhinan.47.d:0 "唐继尧：如果要走孤立线，就要在任务时间到之前获得足够多的云南共和派支持。如果选择了抓住机会进攻湖南，那么要在会议上承认参谋部是对的，并在军队动员时增加给他们的军费。\n\n龙云：如果唐继尧清洗总参谋部，或者共和派支持不足，或者没有向总参谋部认错，龙云就会掌权，但云南会开始内战。内战会有三种不同的情况，要以龙云身份赢得内战，请按照对应情况选择选项。\n在楚雄之战中，选择等待炮兵，然后在曲靖之战中选择保护谷口。\n在“攻占安顺”事件中，选择“就一天，不能再多了”，然后在毕节之战中选择分兵。\n在“防守毕节”事件中，选择防守城镇，然后在“攻克贵阳”事件中选择“猛攻贵阳，剑指清镇”。\n\n国民党右派：在龙云的事件链中，选择错误的选项就可以让他下台，然后朱培德就有机会掌权。\n按照情况选择正确的选项，让朱培德的国民革命军赢得内战：\n在“贵西驻军溃退”事件中，选择发动钳形攻势，然后在“楚雄豪赌”事件中选择“这太冒险了，还是老实点吧”。\n在“遵义起义”事件中，选择途径毕节直取遵义，然后在“松山攻势”事件中选择让士兵明白牺牲的价值。\n在“兴义之围”事件中，选择抽调围城兵力继续前往贵阳，然后在“拿下遵义”事件中选择派遣小分队。\n\n卢汉：在龙云的事件链中，选择错误的选项就可以让他下台，然后卢汉就有机会掌权。\n按照情况选择正确的选项，让卢汉赢得内战：\n在事件“松山防御”中，选择“往死里挖战壕”，然后在事件“毕节豪赌”中选择攻击革命军。\n在事件“黔中的拥护”中，选择让他们打，然后在事件“玉龙山冲突”中帮他们解围。\n在事件“进攻计划”中选择“进攻毕节”，事件“敌军威胁玉溪”选择西征。\n\n胡若愚：在龙云的事件链中，选择错误的选项就可以让他下台，然后胡若愚就有机会掌权。\n按照情况选择正确的选项，让胡若愚赢得内战：\n事件“景洪之战”选择立马攻城，然后把补给送到贵阳。\n事件“洛江河之战”选择“把他们往北推到山谷里”，事件“澜沧江附近的冲突”选择强攻。\n事件“防守楚雄”选择弹性防御，然后选择分散进攻部队。\n\n朱德/章伯钧/周保中：让内战旷日持久，不停选择令当前领导人倒台的选项，当稳定度低于-75%时，选择“小小军阀休得乱我河山”，朱德就会夺权并结束内战。随后可以选择把权力交给朱培德，保留朱德或选择章伯钧。选择朱德之后在事件“反朱德政变”中选择朱德被杀，周保中就会上台。\n\n更详细的云南内战路线指南请查看mod文件夹中的gfx文件夹下的yunnanguide.jpg。"
 zhinan.48.t: "布列塔尼路线指南"
 zhinan.48.d: "§1布列塔尼国民党§!：在派系斗争中让国民党一家独大，在后续的选人中选择相应的继承人\n§L布列塔尼自由阵线§!：在派系斗争中让自由阵线一家独大，在后续的选项中选择相应的势力（§9民族党§!，§C蓝军联盟§!，§7地方主义联盟§!以及§t马塞尔加香§!）\n§3阿贝佩洛特大队§!：在派系斗争中让大队一家独大，在后续的选人中选择相应的继承人\n§Y企业联盟§!：在派系斗争中让企业联盟一家独大，在后续的企业理事会选人中选择相应的企业集团\n§R法兰西工农党§!：进入加香路线后再国策的事件中接受工农党的帮助，让加香成为傀儡主席\n§G阿尔方斯·德·沙托布里昂称帝§!：进入地方主义联盟路线后完成最后一个国策后一两个月，沙托布里昂会回归布列塔尼，让他称帝就好了\n§0隐藏线§!：老友记（meme，进线方式不唯一）"
 zhinan.48.a: "好啊，当浮一大白"
