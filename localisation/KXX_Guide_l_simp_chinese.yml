 zhinan.35.d:0 "新的选举/安抚国会：在八省联合崩溃后，在事件中选择支持陈调元将进入新的选举线，支持齐燮元将进入安抚国会线。\n\n宣统维新/直系民国/辛亥华盛顿：在八省联合崩溃后，拒绝给陈调元与齐燮元中的任何一方提供帮助。然后点国策“解决动乱”。政变成功将进入宣统维新线，失败可以选择直系民国或者辛亥华盛顿线。\n请注意：总统选择胡适或顾维钧会对统一后的选举产生影响。\n\n国民党/李大钊：走宣统维新线，在政变事件中选择两败俱伤，然后在之后的事件里选择。\n\n君布大清：进入宣统维新线，在选择党派事件里选择中国社会党。\n\n现在怎么走一贯道：预设山东为张天然上台，在政变中选择张天然为恩人，先完成“我们的恩人”与“张天然”这两个国策，然后再点“成立紧急政府”，事件里选择“外面好像有什么动静……”\n\n张天然的继承人：完成国策重新教导皇帝之后在事件里选择张天然自立为帝，100天之后张天然就会死，选择你想要的。江希张需要先选王凤仪并完成他的国策树，在事件“鸠占鹊巢者”里选择不管。"
 PHI_luxianzhinan:0 "菲律宾路线指南"
 PHI_tree:0 "菲律宾路线指南"
 zhinan.36.t:0 "菲律宾路线指南"
 zhinan.36.d:0 "教宗流亡：预设教宗为儒略四世，教皇国不存在后且当前为民主政府会出事件，在事件”日益增长的政治天主教会影响“中选择”也许能说的话是有限的“。\n\n民主线/红线：在1937年选举里选择你想要的。1941年还有一次选举。走红线的话点完最后一个国策解锁下半部分国策树。\n\n国家社会党线：选举选国社党，在完成最后一个国策之前，权力平衡偏左过多会使拉莫斯上台，偏右过多会使科尔内霍上台，处于中间会维持阿奎那多（意识形态取决于权力平衡在哪一侧，完成最后一个国策的时候还能在变一次）。若要变为社民，完成国策巩固菲律宾人民的权威，并将权力平衡拉到左边百分百。若要变为社自，完成国策最后坚守者的平凡称呼，并将权力平衡拉到右边百分百。\n\n军事独裁线/穆斯林：在事件“马尼拉的抗议活动”中选择让他们抗议，在事件“抗议扩展到其他地区”中选择没事的，随后军方就会夺权。如果要走穆斯林线，在事件“摩洛人起义”中让他们成功。选择国策“枪口依然瞄准”会解锁“保卫共和国的圣洁”分支（选择索里亚诺需要选择国策“与资本家合作”，选择里卡特需要选择国策“民粹主义军政府”），选择国策“恢复菲律宾民主”会解锁“自由公正的选举”分支。"
