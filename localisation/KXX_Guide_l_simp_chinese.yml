 zhinan.53.t:0 "卡洛斯路线指南"
 zhinan.53.d:0 "卡洛斯左翼/右翼：完成起始国策，在事件中接纳卡洛斯派左翼，在随后的事件中选。\n\n人民行动青年：在大赦免事件中选择不赦免，完成起始国策，在事件中拒绝卡洛斯派左翼，人民行动青年团就会夺权。\n\n人民行动青年：在大赦免事件中选择赦免，完成起始国策，在事件中拒绝卡洛斯派左翼，长枪党会在人民行动青年团政变之后夺权。"
 zhinan.54.t:0 "美利坚合众国指南"
 zhinan.54.d:0 "你想玩点啥？"
 zhinan.54.a:0 "避免内战"
 zhinan.54.b:0 "国家人民党/平民党/和平建立联合工团、宪政国"
 zhinan.54.c:0 "麦克阿瑟/海军/威洛比和洛克威尔"
 zhinan.54001.t:0 "美利坚合众国指南"
 zhinan.54001.d:0 "胡佛第三次连任总统：\n游玩合众国，让加纳-瓦格纳法案通过（现在kx确保任何一个激进的选择都可以使法案通过，但是要是不和激进党派合作那法案就必定不通过），总统选举前，提名柯蒂斯做政党候选人。然后提出对柯蒂斯健康问题的质疑，然后如果问题确实很大，那么就可以让胡佛替代柯蒂斯参选。\n胡佛当选后，优先完成专属国策树的最右侧两个国策，包括“胡佛突袭”。之后决议里就会出现一系列调查激进党派领导者的决议。社会党调查完选择决议联系卡彭，之后刺杀海伍德。美利坚至上党和旧民主党在调查完且完成国策“必要的越界授权”后可以选择决议刺杀。\n在三个领导人都死完后三个激进党派的政治力量每月增长就会变成负数，再配上别的效果就能将政治力量压到15%以下。政治力量全部到15%以下后选择决议“根除影响”，在根除党派全部完成后触发事件避免内战。\n\n加纳避免内战：\n优先完成财政紧缩国策，触发财政紧缩提案事件链。在“财政紧缩法案”事件中选择求助休伊·朗或建制联盟，之后事件中选择说服其他党派来通过法案。\n最快速度点完“无极端分子容身之地”国策，然后完成下面一系列的国策。“埃德加·胡佛的提案”事件中支持胡佛的提议，然后在决议中开始调查。对于美利坚至上党和旧民主党依靠调查能彻底压制。在调查海伍德后调查白劳德，然后会出现刺杀社会党高层事件，选择批准胡佛的计划。\n最后配合加纳的独特决议和其他压制激进党派影响的决议把三个激进党派的政治力量压低到15%来根除影响力。\n\n诺里斯避免内战：优先完成国策“国家的干预之手”。当跳出“诺里斯主张经济干预”事件时，选择“承诺将欺诈者们绳之以法”选项，解锁后续的谈判事件链。\n在后续的谈判中对朗和海伍德妥协，同时优先完成国策树中间的一系列国策来压制旧民主党。在事件“处理旧民主党”中听从麦克阿瑟的建议。\n一切都听从麦克阿瑟的建议，同时不要逮捕南卡罗来纳的布莱斯。然后事件中增加麦克阿瑟的预算。但同时要确保军方影响力不要大于70%\n最后配合诺里斯的独特决议和其他压制激进党派影响的决议把三个激进党派的政治力量压低到15%来根除影响力。（若要彻底移除“无形帝国”减益，需要先完成“对3k党的最终之战”，再执行三次“调集人手打击3k党”决议，并等待后续事件链结束。）\n\n柯蒂斯/兰登避免内战：\n等待一月中旬的就职典礼，并且完成国策“中道为胜”触发谈判事件。\n在谈判中如果选择优先跟社会党谈判,在决议中推荐优先聚焦旧民主党。在后续“海伍德要求工人自治”事件中选择同意海伍德的提议。之后同意海伍德的资助要求。后续事件选择跟社会党走到底，之后达成妥协能遏制住社会党政治力量增长。之后完成“终结反政府组织”开始通过决议调查来处理至上党和旧民主党。兰登的打击旧民主党的决议需要完成“肢解种族隔离”国策，柯蒂斯则完成“终结反政府组织”即可。\n如果选择跟所有激进党派谈判（更加快速的避免内战），在谈判开始时选择第二个选项，之后允许威廉·H·默里和朗参加谈判，同意关于自治的要求。之后同意资助并同意默里的妥协方案。触发事件“激进派极度不满！”时依旧同意，之后要求激进党派削弱民兵。再同意麦克阿瑟的后续要求。剩下的就靠决议来降低激进党派的政治力量即可。"
