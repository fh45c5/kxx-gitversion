 zhinan.44.t:0 "尼加拉瓜路线指南"
 zhinan.44.d:0 "桑迪诺/莫雷诺：36年大选选桑迪诺或者莫雷诺。解放洪都拉斯的任务结束之后，在萨卡萨进军首都事件链里让萨卡萨失败。\n或者，36年选萨卡萨。解放洪都拉斯的任务结束之后，在桑迪诺进军首都事件链里让桑迪诺成功。\n自由派：36年选萨卡萨。解放洪都拉斯的任务结束之后，在桑迪诺进军首都事件链里让桑迪诺失败。\n或者，36年大选选桑迪诺或者莫雷诺。解放洪都拉斯的任务结束之后，在萨卡萨进军首都事件链里让萨卡萨成功。然后可以选举社自/市自/社保。\n\n第二次占领：进入红线，完成国策"新执政联盟"，选举事件里选择取消选举。\n\n美国统治：见kx自带路线指南。\n\n无政府主义线：进入第二次占领或者美国占领线，在事件“社会主义抵抗增强”中选择“一个演戏的能干点啥？”\n\n索摩查继承人：等到1946.9.21触发事件。"
 MNT_luxianzhinan:0 "黑山路线指南"
