 CHI_parliament_text: "委员会制，是共和政体的一种特殊形式。国家最高行政机关为委员会，委员由议会选举产生，行政首脑由委员会在其委员中选任。委员会以合议制形式集体行职权。委员会主席，既是国家元首又是政府首脑，但主席、副主席都不得单独行使委员会职权，决定问题时集体讨论多数通过，以集体名义行使职权。"

