 mnt.2.a:0 "维持现状！我们不能再冒更多风险！"
 mnt.2.b:0 "黑山必须追寻自身的未来！支持真人民党！"
 mnt.2.c:0 "避开其他邻国的不满！任命人民党！"
 mnt.3.t:0 "火药桶政治"
 mnt.3.d:0 "有人点燃了南巴尔干这颗 “定时炸弹” 的引信 —— 随着塞尔维亚入侵马其顿与皮罗特，第四次巴尔干战争正式爆发。罗马尼亚与希腊的军队也已发起入侵行动，而黑山正面临一个千载难逢的机遇。\n从克鲁巴希派的立场来看，此次战争是解放受压迫塞尔维亚民众的契机；以普拉瓦希派的说法，这是扩大黑山王国疆域、将塞尔维亚民众从压迫者卡拉乔尔杰维奇王朝统治下解放出来的机会。无论从哪一角度，黑山眼前都摆着一盘 “盛宴”；因此，我们这个具有战略重要性的国家，必须确定自己的政策走向。"
 mnt.3.a:0 "必须确认黑山的中立地位。"
 mnt.3.b:0 "即刻在此击败卡拉乔尔杰维奇家族的恶魔！"
 mnt.3.c:0 "拿起武器，塞尔维亚民族！"
 mnt.4.t:0 "塞尔维亚的亚历山大二世请求庇护"
 mnt.4.d:0 "在塞尔维亚败于“巴尔干普鲁士”之手后，塞尔维亚的亚历山大二世已请求在其出生地采蒂涅避难。当奥布雷诺维奇王朝统治塞尔维亚时，卡拉乔尔杰维奇家族在尼古拉国王的庇护下于采蒂涅安然度日。然而，时移势易；米哈伊洛一世·彼得罗维奇-涅戈什并不热衷于让塞尔维亚国王毫发无损地重返流亡生活。不过，我们以克鲁巴希人为主的民众却热情支持这一想法……有人说这背后可能另有隐情。"
 mnt.4.a:0 "煽动分子，滚出去！"
 mnt.4.b:0 "只要他保持低调行事"
 mnt.5.t:0 "忠实的王室支持者紧随其后"
 mnt.5.d:0 "与巴尔干地区的大多数情况一样，在非此即彼的二元选择之外，总有第三种可能。塞尔维亚的亚历山大二世已被安排在采蒂涅获得庇护，但似乎塞尔维亚国内已普遍知晓这一计划。来自北方的移民涌入规模超出预期，使边境管控局势变得棘手，而且大多数塞尔维亚移民都被登记为申请政治庇护。\n\n问题依旧悬而未决，且比以往任何时候都更令人忧虑：究竟要到何种程度才算够？亚历山大获得庇护会给我们国家带来更多的后果吗？"
 mnt.5.a:0 "我们可没答应做这个！"
 mnt.6.t:0 "统一或灭亡！"
 mnt.6.d:0 "无论走到哪里，只要带着贝尔格莱德的塞尔维亚人，就至少会有一人染上鼠疫、长着淋巴肿块 —— 这就像与‘黑手会’扯上关系一样危险。” 如今，这样的不满言论在黑山境内逐渐蔓延，而导火索正是塞尔维亚与黑山当下的紧张关联，以及由此引发的国内危机。\n面对黑山正遭遇的困境，塞尔维亚的亚历山大已向波德戈里察方面多次致歉。但这些道歉在真人民党及其激进的绿派支持者眼中，完全无法平息怒火 —— 他们言辞激烈地抨击亚历山大，认为其背后的塞尔维亚势力是导致黑山陷入动荡的重要原因，甚至将国内问题的根源归咎于与塞尔维亚的牵连。\n在此背景下，“是否应再次驱逐亚历山大” 的呼声在黑山愈发高涨。有人直言，既然塞尔维亚方面未能切实解决问题，仅靠道歉无济于事，不如将其驱逐以斩断不必要的麻烦；还有人带着讽刺的语气提议：“或许维也纳会对卡拉乔杰维奇家族更友善些？” 暗指亚历山大若离开黑山，或许能在奥地利获得更好的待遇，也能让黑山摆脱这一争议焦点。\n眼下，这一呼声已从民间讨论逐渐渗透到政治层面，真人民党更是将其作为向当局施压的新议题。而如何回应民众的不满、处理与亚历山大及塞尔维亚的关系，不仅考验着黑山当前的执政者，更可能进一步影响两国本就复杂的关系，以及黑山国内的政治稳定。"
 mnt.6.a:0 "别再把你的麻烦带过来了！"
 mnt.7.t:0 "维多夫丹校验工具"
 mnt.7.d:0 "（隐藏）"
 mnt.7.a:0 "（隐藏）"
 mnt.8.t:0 "维多夫丹政变"
 mnt.8.d:0 "在科索沃战役中，奥斯曼 “蟑螂” 被击溃的那一刻，便铸就了这个属于塞尔维亚人的光荣日子。维多夫丹节每年都会举行庆祝活动，在塞尔维亚领土收复主义者与民族主义者的心中，它占据着特殊地位 —— 诸多历史重大事件，都发生在这个极具声望的日子里。\n原本，人们以为如今的维多夫丹节不会受到太多关注，可这份预期在傍晚时分便迅速破灭：一支组织严密的塞尔维亚效忠者小队，突然对政府办公区发动了伏击。一场激烈的枪战过后，硝烟终于散尽，而那些得以重返王座大厅的人，将会带来这样的报告："
 mnt.8.a:0 "塞尔维亚那帮亲信又被赶出去了！"
 mnt.8.b:0 "塞尔维亚人这回手握的可是王牌！"
 mnt.9.t:0 "黑山机构的命运"
 mnt.9.d:0 "在支持佩特罗维奇-涅戈什家族的大规模抗议与罢工浪潮中，我们部分流亡在外的同志开始质疑：黑山是否应当 “重新塞尔维亚化”？在他们看来，黑山共管时期的漫长岁月，以及后续米哈伊尔统治下的王国时代，早已侵蚀了塞尔维亚民族在黑山的根基。为此，他们提议废除诸多黑山本土的机构名称 —— 包括街道名称在内，几乎所有事物的称谓，都应替换为塞尔维亚民族共有的英雄之名。"
 mnt.9.a:0 "尊重我们塞尔维亚同胞的文化。"
 mnt.9.b:0 "清除他们的虚假民族主义！"
 mnt.10.t:0 "卡拉乔尔杰维奇王朝主政时期"
 mnt.10.d:0 "如今，亚历山大已是黑山名义上的国王，但他身边突然聚集的塞尔维亚卫队与流亡者群体，却在黑山民众中激起了强烈不满。真人民党、绿派与红切特尼克派成为反对声中最尖锐的力量 —— 他们直指亚历山大试图将黑山打造成一个缺乏民主自由的专制国家，认为其身边的塞尔维亚势力是对黑山主权与本土利益的威胁。\n而我们正面临一个关键抉择：是通过威胁、贿赂等手段干预黑山内政，强行扭转当前局势？还是尊重黑山王权背后的政治根基，任由其内部政治力量自行博弈？\n从 “夺回塞尔维亚、建立秩序” 的目标来看，干预似乎有其合理性 —— 若能通过手段掌控黑山政局，或许能更快整合巴尔干地区的斯拉夫力量，为夺回塞尔维亚扫清障碍，避免黑山的内部动荡波及我们的计划。但风险同样显著：威胁与贿赂只会加剧黑山民众对外部干预的反感，甚至可能让真人民党等反对势力将矛头转向我们，点燃新的叛乱火种。而 “叛乱” 恰恰是我们最需规避的 —— 一旦黑山陷入混乱，不仅会牵制我们的精力，更可能给奥地利等外部势力可乘之机，让 “重建塞尔维亚秩序” 的目标沦为泡影。\n反过来，若选择尊重黑山的政治根基，虽能避免直接引发反抗，却也意味着我们将失去对局势的掌控力。亚历山大的专制倾向若持续发酵，可能导致黑山内部矛盾进一步激化，最终演变成不可控的乱局；而各派系的争斗若长期拖延，也会让我们借助黑山力量的计划陷入停滞。\n这一抉择的核心，本质是 “短期掌控” 与 “长期稳定” 的权衡：干预或许能换来一时的局势倾斜，却可能埋下更大的动荡隐患；尊重虽能维持表面的主权边界，却需承担局势失控的风险。无论选择哪条路径，都需牢记 ——“重建塞尔维亚秩序” 的前提，是避免周边地区陷入混乱；而真正的秩序，从不是靠外力强行压制，而是建立在各方利益平衡与信任基础之上的共识。"
 mnt.10.a:0 "尽量少干涉他们的政治事务，我们无意树敌过多。"
 mnt.10.b:0 "摒弃一切！塞尔维亚必须保持强大！"
 mnt.11.t:0 "皇室成员在光天化日之下遭到袭击！"
 mnt.11.d:0 "今日，阳光普照黑山大地 —— 正正当当洒在国土上空。既非日出时分，也非日落之际，稀疏的云层环绕着这片土地。按理说，这本该是平静无波、毫不起眼的一天 —— 事实却并非如此。\n国王米哈伊尔与其妻热纳维耶芙·普里让特在前往采蒂涅的途中，突然被一场突发的山体滑坡拦住去路 —— 这场滑坡显然早在此前就已发生。当随行车队被迫停下时，灌木丛中突然 “活” 了过来 —— 王室卫队当即向这群游击暗杀者开火反击。\n约二十分钟后，国王夫妇虽受轻伤，但已安全撤离交火区域。此时，伤亡人数得以统计：三名王室卫队成员阵亡，十名暗杀者丧命。\n随着调查发现，暗杀事件与 “黑手会” 存在关联，国王怒气冲冲地找到亚历山大。然而，目前尚无任何证据能将亚历山大与该事件挂钩，该国最高官员已就此召开会议商讨对策。"
 mnt.11.a:0 "三十第纳尔，这就是黑手党的价码！"
 mnt.11.b:0 "全面镇压塞尔维亚人，并伪造亚历山大在场的假象。"
 mnt.12.t:0 "克尔斯托·波波维奇辞职"
 mnt.12.d:0 "为反抗新政权，黑山军队高级将领克尔斯托·波波维奇突然递交辞呈，态度傲慢且出人意料。当日早些时候，波波维奇已向多名黑山军官表示，凭良知而言，他无法为一名意图摧毁黑山一切本土特质的塞尔维亚人效力。在他之后，更多下级军官也纷纷辞去职务。\n\n对我们而言，此事令人忧心忡忡——大批有能力的指挥官集体离职后，极有可能投身武装起义，而绿派无疑是他们最可能加入的势力。有人提议逼迫波波维奇自杀，但目前尚无任何方案落地。眼下无法回避的事实是：面对当前民怨沸腾的政府，波波维奇及众多指挥官正以辞职的方式表达抗议。"
 mnt.12.a:0 "他从来都不是塞尔维亚人。"
 mnt.13.t:0 "激进绿派武装突袭山区军火库"
 mnt.13.d:0 "局势已发生彻底逆转——那些曾为最坚定塞尔维亚民族主义者提供庇护的山区，如今成了绿派中反抗势力的“欢迎堡垒”。由白党与红切特尼克派武装分队遗留的旧军火库，已进入这些绿派反抗势力的视线；而在近期 “扩军备战” 的背景下，这些流窜的武装团伙已突袭并劫掠了北部地区的多处武器储备点。\n\n据悉，参与此次行动的绿派势力，疑似隶属于塞库拉·德尔耶维奇与萨维奇·马尔科维奇·什泰迪姆利亚领导的第三方绿派派系。值得注意的是，身为绿派知名盟友的克尔斯托·波波维奇，已公开谴责并否认与这些“严重破坏稳定的恐怖主义民族主义者”的行为有关联。"
 mnt.13.a:0 "追查并重新管控好这些武器！"
 mnt.14.t:0 "彼得罗维奇-涅戈什王朝发动反政变"
 mnt.14.d:0 "亚历山大再次登上王位后，国内陷入一片混乱。到目前为止，我们的成长环境在很大程度上是即兴形成的，而亚历山大本人从未想过自己会回来统治，更不用说统治黑山了。立法机构中的政客们，在塞尔维亚人的起哄下，有的毫无抵抗地屈服，转而支持新国王，有的则依然效忠于彼得罗维奇-涅戈什家族。\n\n或许幸运的是，军队尚未公然叛乱——但情况稍有变化。在夜深人静之时，国王的亲信将他叫醒，告知他王宫外发生了枪战。数小时过去了，双方的增援部队都已抵达。硝烟散尽，而……"
 mnt.14.a:0 "在塞尔维亚人来得及组织防御之前，他们就被击溃了！"
 mnt.14.b:0 "迈克尔及其手下被逐出塞尔维亚！"
 mnt.15.t:0 "奥地利控股公司的命运"
 mnt.15.d:0 "黑色星期一给投资者的心灵带来的冲击，犹如世界大战中炮弹对士兵的打击。长期以来，奥地利投资者一直是推动黑山经济发展的重要力量，但他们突然撤资，试图从长远角度挽回哪怕少量的克朗。这或许对那些陷入困境的商人有利，但对我们而言，这无疑是个坏消息——我们的经济已陷入衰退，有可能使我们的经济水平倒退数十年。\n\n不过，也有一线希望——随着奥地利企业纷纷倒闭、失业率上升，我们有可能将尚存的奥地利企业股份以及如今被遗弃的公司收归国有。要么这样做，要么维持现状。将奥地利资产国有化，无疑会惹恼皇帝；但他又能怎样呢？"
 mnt.15.a:0 "收归国有！"
 mnt.15.b:0 "任其腐烂。"
 mnt.16.t:0 "码头工人举行罢工"
 mnt.16.d:0 "长期以来，巴尔和科托尔港口的码头工人在维护和建造规模过大的黑山海军舰艇时过度劳累。在经济衰退之后，他们正式举行了罢工。工人的言行中明显透露出激进的色彩；各方已达成共识，必须立即采取某种行动。目前出现了两种明显的观点：一是平息事态，二是采取强硬措施，以尽力保住我们仅存的成果。\n\n此外，各岛屿之间的渡轮运输已完全停运，所有船舶建造项目也都暂停。由于资产损失、裁员增加，工人们的工资被削减，这引发了他们的不满。过去，人们可能会觉得黑山会发生工团主义起义是个笑话，但现在，情况已不容乐观。"
 mnt.16.a:0 "向他们做出让步吧，我们实在经不起关系进一步破裂的风险了。"
 mnt.16.b:0 "将步枪和火炮放平；立即散开！"
 mnt.17.t:0 "红切特尼克的结局"
 mnt.17.d:0 "红切特尼克是黑山工团主义者与共产主义者组成的边缘群体，在南斯拉夫起义中所扮演的角色微不足道。在为解放黑山而组建的 “政治化” 切特尼克部队里，他们占比最小，却是保卫黑山西部的重要力量。\n我国政府已推出一项政策，旨在将黑山境内所有仍愿意参与的切特尼克部队 “规范化”，对其开展训练 ——内容既包含传统作战方式，也融入他们所熟悉的游击战战术。然而，一个棘手的问题随之浮现：该如何处置红切特尼克？有人担忧，对他们进行训练可能引发革命，或将 “红色思潮”扩散到各个训练营中。但另一方面，红切特尼克成员又是极具价值的士兵，他们拥有顽强的意志力，实力难逢对手。我们究竟该允许红切特尼克加入这一训练计划，还是刻意将他们排除在外？"
 mnt.17.a:0 "允许其加入切特尼克规范化计划"
 mnt.17.b:0 "红色渣滓，滚出去！"
 mnt.18.t:0 "马克斯·米尤什科维奇获得晋升"
 mnt.18.d:0 "已故拉扎尔·米尤什科维奇之子 ——马克斯·米尤什科维奇，已在国际舞台上成就了一段传奇职业生涯。他精通法语、德语、英语与意大利语，语言运用娴熟精湛，凭借这一优势任职于政府秘密情报机构，负责破译国内外敌方情报通讯。此外，他的德语专长也使其成为本国与奥地利、德国建立联系的重要桥梁。\n而马克斯·米尤什科维奇最引人注目的成就，在于他对 “红切特尼克”的专项关注。通过不懈努力，他成功揭露了第三国际与分散各处的红切特尼克支持者之间的大量勾结证据。从武器交易到资金援助，不难看出，正是在这个推动全球革命的第三国际的支持下，红切特尼克才得以取得如此显著的发展。\n不过，米尤什科维奇的工作也为他赢得了各界军方的高度赞誉。同时，得益于他所发掘的这些关键信息，红切特尼克的影响力已遭受重大打击。"
 mnt.18.a:0 "太棒了！"
 mnt.19.t:0 "拉扎尔·米久什科维奇之死"
 mnt.19.d:0 "长期以来在黑山政坛颇具影响力的拉扎尔·米尤什科维奇，今日因自然原因与世长辞。作为彼得罗维奇-涅戈什王朝的忠实拥护者，米尤什科维奇是塑造当今黑山政治格局的核心推手。在 “共管政权” 倒台后，黑山实现独立，正是他的努力，才使这个新生的独立国家免于落入 “绿派” 或 “白党” 势力之手；不仅如此，他还推动了传统的 “普拉瓦希” 势力复兴，而 “克鲁巴希” 势力的协同崛起虽非他直接促成，也与他的政治布局密不可分。\n自黑山独立以来，米尤什科维奇一直担任总理一职。在其漫长的总理任期初期，他将核心精力放在两大方向：一是强化黑山人的身份认同，凝聚民族共识；二是提升黑山在世界舞台上的地缘政治地位，为国家争取更有利的外部环境。\n尽管他的离世早有预期，但这一事件仍加剧了黑山国内早已存在的裂痕 —— 自 “黑色星期一” 奥地利资产撤出后，这道裂痕便在迅速扩大。整个国家都在为这位睿智卓识的人物哀悼；愿他深爱的黑山，能铭记他的奉献，实现他毕生追求的所有理想。"
 mnt.19.a:0 "一位黑山的英雄，如今与马萨里克一同离开了人世。"
 mnt.20.t:0 "北方地区民众对克鲁巴希派获胜表示满意"
 mnt.20.d:0 "出乎意料的共识将克鲁巴希派推上了权力席位，眼下塞尔维亚正重新整军备战，世界局势也在动荡中前行，而这一结果至少带来了一件值得庆幸的事。黑山北部虽未被明确界定，但长期以来始终被视作 “分离主义地区”—— 这里成了各类政治光谱末端极端分子的首选藏身之地。此外，该地区与采蒂涅、波德戈里察等主要城市相距甚远，不像贝拉内等地那样已被深度 “黑山化”。如今克鲁巴希派的胜利，或许能通过协商妥协的方式，迅速终结这一曾被视为黑山棘手难题的局面。就连普拉瓦希派与绿切特尼克势力，也愿意为此伸出援手。"
 mnt.20.a:0 "一线希望？"
 mnt.21.t:0 "约科·梅斯特罗维奇归国"
 mnt.21.d:0 "常言道，勇者得天助。世界大战期间，成千上万的士兵殒命于机枪炮火之下，葬身于炼狱般的绝境之中。但总有一些英雄，能在泥泞与污垢里挣扎求生，闯出属于自己的荣光。约科·梅斯特罗维奇（又称约翰·梅斯特罗维奇）便是这样一位英雄。黑山参战之后，他投身世界大战；待黑山沦陷，他转而加入塞尔维亚部队，在马其顿战线服役。历经战火洗礼，梅斯特罗维奇幸存下来，后辗转前往美国。因黑山被吞并，他心中始终满是愤懑。当南斯拉夫起义的机会来临时，他毫不犹豫地投身其中。在起义期间，他孤身一人解除了奥军一处山间机枪碉堡的武装，凭此功绩赢得了奥比利奇勋章。1930 年，黑山解放后，梅斯特罗维奇回到故土访问，却被警方拦下并带至国王面前 —— 而国王正是为他颁发奥比利奇勋章而来。\n\n遗憾的是，今日一具灵柩从海上抵达我国海岸，棺木中安放的正是约科·梅斯特罗维奇的遗体。在战争中的最后一次英勇壮举里，他于美国西部的一场枪战中救下了自己的上尉。[USA.GetLeader] 已为梅斯特罗维奇追授荣誉勋章，这是美国最高级别的军事勋章。或许在宏大的历史叙事中，他的故事不算惊天动地，但约科·梅斯特罗维奇仍将被许多人铭记，成为黑山军人精神的典范。"
 mnt.21.a:0 "愿他安息..."
 mnt.22.t:0 "切特尼克纪念碑"
 mnt.22.d:0 "我国的独立，很大程度上要归功于补给充足、作战高效的游击部队，如今全国各地已建起一座座纪念碑。从尼克希奇特雷贝萨山上气势恢宏的纪念建筑，到波德戈里察城中低调静默、见证黑山辉煌时刻的标识，整个国家都深知欠切特尼克一份铭记。\n如今黑山独立已迈入第二个十年，国内的切特尼克与游击队成员，早已悄然回归乡村生活。但许多可敬的战士却渐渐被遗忘，他们的事迹甚至未被指挥官记录在册。为此，黑山计划在采蒂涅新建一座纪念碑，专门缅怀这类战士 —— 那些曾为国家奋战，姓名却未能被家乡铭记的人。\n此外，在南斯拉夫起义中牺牲的众多士兵，被安葬在国家公墓内，且与世界大战阵亡者的安葬区域隔开，以这种方式彰显他们在独立进程中独特的奉献价值。"
 mnt.22.a:0 "斯拉夫的自由斗士，永不屈服！"
 mnt.23.t:0 "奥地利军队撤退！"
 mnt.23.d:0 "历史中反复上演的戏码，莫过于反抗与革命。似乎人们总会忍耐到极限 ——哪怕食不果腹、身无分文，也愿承受任何苦难，直至生命燃尽。对奥地利而言，二十多年前的世界大战已让其险些陷入这般境地。而今，“黑色星期一” 的冲击瞬间侵蚀了奥地利的发展根基，国内民众的不满情绪日益高涨，帝国再度面临崩溃的现实风险。\n对我们黑山而言，奥地利宪兵及其他军方机构已从境内撤离，转而全力守卫其本土边境。这本质上意味着，我们终于彻底摆脱了奥地利的控制，迎来了真正的自由。"
 mnt.23.a:0 "这将打破现状"
 mnt.24.t:0 "白党的切特尼克部队动员起来"
 mnt.24.d:0 "如今街道上已不见奥匈帝国士兵的身影，只剩安静的商铺与桥头岗哨矗立，一切突然变得如此不确定。在我们新获得的真正独立之中 —— 彼得罗维奇-涅戈什王朝的旗帜，终于取代黑黄双鹰旗飘扬在国土之上，我们必须问自己一个根本问题：接下来该何去何从？\n\n白党已然找到了自己的答案：随着塞尔维亚终于获得喘息之机，黑山与塞尔维亚彻底合并的可能性，再次通过支持吞并的切特尼克成员及政客们的煽动言论，悄然弥漫开来。于是，他们重新武装，走上街头。目前虽未发生实质冲突，但潜在的可能性却无穷无尽，未来局势充满未知。"
 mnt.24.a:0 "这也太快了！"
 mnt.25.t:0 "普拉瓦希派向国王施压"
 mnt.25.d:0 "克鲁巴希派最具影响力的政治家安德利亚·拉多维奇已前往议会，正式提出即刻举行选举的请求。克鲁巴希派给出的核心理由是，纵观黑山近代历史，奥地利长期对普拉瓦希派予以支持，这让上一次选举结果的公正性与合法性存疑——他们认为，在外部势力干预的背景下，当时的选举无法真正反映民众意愿。为此，克鲁巴希派一面重申对黑山的忠诚，一面提出两项关键提议：一是举行新的选举，二是通过公民投票来确定新黑山在对内政策调整与对外关系定位上的方向。\n\n而普拉瓦希派对这一倡议的反应却出人意料地分化。一部分成员主张同意举行选举，认为这是让国家看清自身真实民意的契机；另一部分则激烈反对，称此次选举是克鲁巴希派为夺取权力精心设计的骗局，意在颠覆现有政治格局。\n\n面对这样的分歧与提议，我们该如何抉择？是支持重新选举以寻求“真正的民意”，还是警惕选举背后可能的权力博弈？这不仅是对当下政局的考验，更将决定新黑山未来的发展路径。 每一种选择，都牵动着国家独立成果的稳固与民众对未来的期待。"
 mnt.25.a:0 "邀请黑山各界领袖共商选举公投！"
 mnt.25.b:0 "没有理由这么做。"
 mnt.26.t:0 "克鲁巴希派与普拉瓦希派共赴公投"
 mnt.26.d:0 ""
 mnt.26.a:0 "愿分歧终能以妥协化解。"
 mnt.27.t:0 "贝拉内爆发抵抗运动"
 mnt.27.d:0 ""
 mnt.27.a:0 "绿派获胜！"
 mnt.27.b:0 "绿派被白党抵抗力量击败！"
 mnt.28.t:0 "黑山压迫北部塞族人"
 mnt.28.d:0 ""
 mnt.28.a:0 "要求立即进行赔偿！"
 mnt.28.b:0 "我们无心过问此事。"
 mnt.29.t:0 "“红切特尼克” 势力趁虚而入"
 mnt.29.d:0 ""
 mnt.29.a:0 "旧患方除，新忧又起。"
 mnt.30.t:0 "人民党要求塞尔维亚人立即融入社会"
 mnt.30.d:0 ""
 mnt.30.a:0 "如果这样能让您不将黑山分裂得支离破碎……"
 mnt.30.b:0 "我们绝不背叛我们伟大的祖国！"
 mnt.31.t:0 "克尔斯托·波波维奇请求额外权力"
 mnt.31.d:0 ""
 mnt.31.a:0 "诚然，我们确实不想让那件事发展到不可收拾的地步。"
 mnt.31.b:0 "坚守现状中尚存的一切。"
 mnt.32.t:0 "红切特尼克武装分子对波德戈里察的围攻"
 mnt.32.d:0 "国王因过度信任红色切特尼克而犯下严重误判，他竟误以为这群人能真心服从指挥，甚至愿意协助自己巩固统治地位。然而现实很快给了他沉重教训：红色切特尼克的野心远未被满足，他们不仅拒绝配合，反而暗中积蓄力量，最终悍然发动叛乱，目标直指彻底推翻国王政权。如今，叛军的部队已在波德戈里察完成集结，随时可能发起进攻。面对这场突如其来的危机，国王终于意识到自己的轻信有多么致命。此刻，他只能寄望于那些始终忠于黑山的卫士们，只有他们，才能力挽狂澜，守护王国的尊严与秩序。"
 mnt.32.a:0 "红军占领该城市，并将真正的社会主义带到黑山！"
 mnt.32.b:0 "约万诺维奇的那帮打手被打垮了！"
 mnt.33.t:0 "奥地利方面撤回支持"
 mnt.33.d:0 ""
 mnt.33.a:0 "让我们期望国内局势保持安定"
 mnt.34.t:0 "绿派反政变"
 mnt.34.d:0 ""
 mnt.34.a:0 "乱局之中，绿派取得胜利！"
 mnt.34.b:0 "锤子与火炬再度出击！"
 mnt.35.t:0 "卡拉乔尔杰维奇王朝的支持者被统一规范"
 mnt.35.d:0 ""
 mnt.35.a:0 "塞尔维亚母亲，我们响应您的号召！"
 mnt.36.t:0 "三箭再次刺穿维也纳"
 mnt.36.d:0 ""
 mnt.36.a:0 "总是寄人篱下……"
 mnt.37.t:0 ""
 mnt.37.a:0 "如此大规模的冲突将永载史册。"
 mnt.38.t:0 "红军因奥地利政策而群情激奋"
 mnt.38.d:0 "在近期国内外政策的调整中，维也纳方面与我国政府代表之间的外交接触取得了巨大成功。我国初建的军事力量和民用工业部门不仅得到了广泛支持，而且如果我们在接下来的几次漫长会议中坚持完成这项艰巨任务，似乎有望在皇帝面前获得有利地位。然而，这些外交努力遭到了来自左翼反对派日益强烈的反对。政党领袖和工会成员都声称，我们背叛了他们为争取工人权利和国家独立所付出的努力，沦为了奥地利的附庸。目前，大多数反对声音仅停留在口头上，但国内一些人怀疑共产党内的激进分子可能会走上街头举行抗议活动，反对政府，这将在短期内对某些行业造成严重影响。"
 mnt.38.a:0 "这是必要的牺牲。"
 mnt.39.t:0 "绿派对于人民党的获胜怒火中烧"
 mnt.39.d:0 "人民党，又称克鲁巴希派在近期选举中胜出！在我们的努力下，建立 “大塞尔维亚”的可能性正日益增大，但普通黑山民众对这场所谓的 “人民胜利”，似乎并未像我们预想中那样热烈拥护。无论是右翼还是左翼组织，亦或是村民与城市居民，都认为此次选举结果是对黑山国家主权的侵犯。不满情绪已在全国蔓延：晨间报纸纷纷发声表达不满，各地民众在公共集会中谴责克鲁巴希派。这些不满迅速升级为抗议活动，民众走上街头公开表达反对立场 —— 这背后无疑有绿派及其他持不同政见者的推动。如今全国已陷入普遍动荡：忠于该党的民兵指挥官们正就是否动用武力介入平乱展开争论，而党内的议会成员则试图采取措施缓和局势。"
 mnt.39.a:0 "啊哈——我们只是对真正的塞尔维亚人有了更深刻的理解！"
 mnt.40.t:0 "绿派起义"
 mnt.40.d:0 "亲塞人民党政府的任命，终究引发了连锁反应。如今，我们已然成为克尔斯托·波波维奇领导的民族主义者武装的攻击目标——这群人一心想要推翻本届政府，已退守山区开展游击战争。这一场景令人不寒而栗地复刻了南斯拉夫起义期间，黑山反抗伊利里亚统治的历史画面。\n凭借国王的默许支持，以及过往冲突积累的经验，波波维奇一方拥有足够的民众支持，足以将我们从权力核心驱逐出去。但我方兵力在得到部分塞尔维亚援助后，仍有能力稳定局势，击败波波维奇这支虽顽固抵抗、却恐已注定失败的游击队。"
 mnt.40.a:0 "在国王的支持下，白党被驱逐出境！"
 mnt.40.b:0 "波波维奇的部队被击溃了！"
 mnt.41.t:0 "什泰德姆利亚还是德尔耶维奇？"
 mnt.41.d:0 ""
 mnt.41.a:0 "德里耶维奇将引领我们！"
 mnt.41.b:0 "红色克罗地亚崛起；来吧，什泰迪姆利娅！"
 mnt.42.t:0 "黑山中立政策的失败"
 mnt.42.d:0 ""
 mnt.42.a:0 "秉持真正的中立立场，你我之间无冲突纷扰。"
 mnt.42.b:0 "我们仅仅希望不涉足他人的领域。"
 mnt.43.t:0 "绿派的背水一战"
 mnt.43.d:0 "我国政府筹备最终整合以并入塞尔维亚之际，绿派再度集结发起孤注一掷的政变，试图将黑山从他们口中 “向塞尔维亚占领者出卖国家” 的局面中脱离出来。此次行动依旧由锲而不舍的克尔斯托·波波维奇领导——尽管他们具备推翻我国政府的一定可能性，但在塞尔维亚方面的部分支持下，我方武装力量完全有能力扭转局势，挫败这些爱惹麻烦的民族主义者。"
 mnt.43.a:0 "这是一场大胆的成功！"
 mnt.43.b:0 "持不同政见者已被击败！"
 mnt.44.t:0 "圣诞跳棋"
 mnt.44.d:0 "隐藏"
 mnt.44.a:0 "隐藏"
 mnt.45.t:0 "晋升雅利诺·约万诺维奇"
 mnt.45.d:0 ""
 mnt.45.a:0 "我们卓越实力的典范。"
 mnt.46.t:0 "敌后作战的经验"
 mnt.46.d:0 "阿尔索·约万诺维奇获得了切特尼克作战经验"
 mnt.46.a:0 "随着每次错误决策的实施，克夫纳什集团的势力便得以进一步壮大。"
 mnt.47.t:0 "约万诺维奇检查器"
 mnt.47.d:0 "隐藏"
 mnt.47.a:0 "隐藏"
 mnt.48.t:0 "延迟的共产主义式加薪"
 mnt.48.d:0 "隐藏"
 mnt.48.a:0 "隐藏"
 mnt.49.t:0 "塞尔维亚黑手会刺杀国王亚历山大一世！"
 mnt.49.d:0 ""
 mnt.49.a:0 "我的天！他死了！"
 mnt.49.b:0 "简直是奇迹！那枪手一枪都没打中！"
 mnt.50.t:0 "塞尔维亚黑手会刺杀国王亚历山大一世！"
 mnt.50.d:0 ""
 mnt.50.a:0 "欢迎来到这个世界，王储殿下。"
 mnt.51.t:0 "米洛王子遇袭"
 mnt.51.d:0 ""
 mnt.51.a:0 "米洛险之又险地逃了出来，却再也无法重返王位。"
 mnt.51.b:0 "黑手党被击溃了！哦，灿烂的五月黎明！"
 mnt.52.t:0 "黑手党支持黑山"
 mnt.52.d:0 ""
 mnt.52.a:0 "棒极了！"
 mnt.53.t:0 "绿派对进展缓慢感到不满"
 mnt.53.d:0 ""
 mnt.53.a:0 "时间会说明答案。"
 mnt.54.t:0 "北部地区爆发零星冲突"
 mnt.54.d:0 ""
 mnt.54.a:0 "我们就没有片刻喘息的时间吗？"
 mnt.55.t:0 "黑山人要求实行联邦制"
 mnt.55.d:0 "白党掌控亲奥地利的黑山政府、继而推动黑山以自治王国身份并入我国，这固然是实现全体塞尔维亚人统一的重要一步，但我国近期的局势变化意味着，我们已无法容忍黑山当前的政府架构。可以理解的是，我国境内的黑山民众对新局势感到愤怒，他们希望得到保障 —— 并因此要求在黑山人与塞尔维亚人之间建立联邦体制。尽管这一诉求可能与奥地利推行联邦化的野心相似，但从长远来看，此举能让黑山民众满意，从而降低他们对我们两国联盟的不满与反抗倾向。"
 mnt.55.a:0 "这是个合理的请求。"
 mnt.55.b:0 "你来真的？"
 mnt.56.t:0 "德尔耶维奇领导的绿党巩固势力"
 mnt.56.d:0 ""
 mnt.56.a:0 "但愿这事实际上不会造成太大影响。"
 mnt.57.t:0 "红切特尼克袭击奥地利企业"
 mnt.57.d:0 "受 “黑色星期一” 后经济崩溃的鼓舞，共产党人已开始袭击奥地利企业，他们将这些企业视为奥地利在黑山境内持续施行控制的工具。此举已导致部分奥地利企业关门停业，或迁回伊利里亚，或返回奥地利本土；另有部分企业则试图加强防御，并向位于维也纳的本国政府请求支援。若我们不采取行动，恐将招致奥地利的怒火，甚至可能引发其全面干预。"
 mnt.57.a:0 "那些赤色分子除了自我破坏，还懂做别的事吗？"
 mntfor.1.t:0 "南斯拉夫问题的命运"
 mntfor.1.d:0 "该事件很可能已失去原有价值，或许可改作他用"
 mntfor.1.a:0 ""
 mntfor.2.t:0 "黑山提议组建联盟"
 mntfor.2.d:0 "塞尔维亚视角：塞尔维亚的屈辱时刻"
 mntfor.2.a:0 "团结使我们更强大。"
 mntfor.2.b:0 "何其傲慢无礼！"
 mntfor.3.t:0 "贝拉内号的简报"
 mntfor.3.d:0 "塞尔维亚正式吞并"
 mntfor.3.a:0 "团结使我们更强大。"
 mntfor.4.t:0 "遭到贝尔格莱德方面的拒绝"
 mntfor.4.d:0 ""
 mntfor.4.a:0 "这并非一场讨论。"
 mntfor.4.b:0 "任其腐烂。"
 mntfor.5.t:0 "米哈伊国王加冕为塞尔维亚国王"
 mntfor.5.d:0 ""
 mntfor.5.a:0 ""
 mntfor.6.t:0 "塞尔维亚和黑山联盟宣告成立"
 mntfor.6.d:0 ""
 mntfor.6.a:0 ""
 mntfor.7.t:0 "黑山请求加入[THIS.GetFactionName]"
 mntfor.7.d:0 ""
 mntfor.7.a:0 "当然！"
 mntfor.7.b:0 "我们认为这片多山的荒地毫无用处。"
 mntfor.8.t:0 "[FROM.GetName]拒绝我们的请求"
 mntfor.8.d:0 ""
 mntfor.8.a:0 "耻辱。"
 mntfor.9.t:0 "黑山站在我们这一边"
 mntfor.9.d:0 "或许应根据接受支持的标签添加两种不同的选项位置/描述"
 mntfor.9.a:0 "好！"
 mntfor.10.t:0 ""
 mntfor.10.d:0 "未完待续"
 mntfor.10.a:0 ""
 mntfor.11.t:0 "黑山共和国提议购买新海尔采格"
 mntfor.11.d:0 ""
 mntfor.11.a:0 "一笔值得做的交易！"
 mntfor.11.b:0 "我们绝不会做出丝毫让步。"
 mntfor.12.t:0 "[FROM.GetName]接受提案"
 mntfor.12.d:0 ""
 mntfor.12.a:0 "开心做生意。"
 mntfor.13.t:0 "[FROM.GetName]驳回我们的购买请求"
 mntfor.13.d:0 "请添加一份预设和平协议，谢谢。黑山也应拥有进一步提出领土主张的权利"
 mntfor.13.a:0 "值得一试。"
 mntfor.13.b:0 "他们将以鲜血偿还！"
 mntfor.14.t:0 "塞尔维亚要求即刻履行赔偿义务"
 mntfor.14.d:0 ""
 mntfor.14.a:0 "我们只是在努力保卫自己的国家！"
 mntfor.14.b:0 "别再纠结了。赶紧付钱，然后按流程举行公民投票。"
 mntfor.15.t:0 "黑山表示愤慨！"
 mntfor.15.d:0 ""
 mntfor.15.a:0 "那我们便要解放你们！"
 mntfor.15.b:0 "我们怎么又在为几座山争来斗去？"
 mntfor.16.t:0 "黑山表示歉意"
 mntfor.16.d:0 ""
 mntfor.16.a:0 "理当如此。"
 mntfor.17.t:0 "黑山请求加入我们"
 mntfor.17.desc:0 ""
 mntfor.17.a:0 "当然，朋友们！"
 mntfor.17.b:0 "我们绝不可能和这些土耳其人一起！"
 mntfor.17.c:0 "伊利里亚本就局势不稳，拆分其行政区划、设立独立建制是更优的解决方案。"
 mntfor.17.d:0 "我们可不想再卷入更多巴尔干地区的政治纷争了……"
 mntfor.18.t:0 "塞尔维亚否认兼并行为"
 mntfor.18.d:0 ""
 mntfor.18.a:0 "倒是挺出人意料的。"
 mntfor.19.t:0 "黑山提出自由贸易倡议"
 mntfor.19.d:0 ""
 mntfor.19.a:0 "前往波德戈里察！"
 mntfor.19.b:0 "这一堆山到底有什么值得争的啊？"
 mntfor.20.t:0 "[FROM.GetName]接受贸易协定"
 mntfor.20.d:0 ""
 mntfor.20.a:0 "万岁！"
 mntfor.21.t:0 "[FROM.GetName]拒绝贸易协定"
 mntfor.21.d:0 ""
 mntfor.21.a:0 "耻辱！"
 mntfor.22.t:0 "黑山主动提议和平"
 mntfor.22.d:0 ""
 mntfor.22.a:0 "这在短期内会是有益的。"
 mntfor.22.b:0 "绝不可能，叛徒渣滓！"
 mntfor.23.t:0 "塞尔维亚拒绝和平提议"
 mntfor.23.d:0 ""
 mntfor.23.a:0 "那还要有多少人丧命？"
 mntfor.24.t:0 "黑山提议购买新船"
 mntfor.24.d:0 ""
 mntfor.24.a:0 "同意。"
 mntfor.24.b:0 "拒绝。"
 mntfor.25.t:0 "奥地利同意了"
 mntfor.25.d:0 ""
 mntfor.25.a:0 "谢谢你，多瑙河的朋友！"
 mntfor.26.t:0 "奥地利拒绝了"
 mntfor.26.d:0 ""
