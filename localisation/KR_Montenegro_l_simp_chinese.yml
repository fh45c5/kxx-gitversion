 MNT_dinar:0 "第纳尔的采用"
 MNT_dinar_desc:0 "黑山此前一直使用奥匈帝国克朗，如今该货币已被弃用；无论在象征意义上还是经济层面，塞尔维亚第纳尔都取而代之，成为新的选择。"
 MNT_new_conscriptions:0 "征兵制的重启"
 MNT_new_conscriptions_desc:0 "象征浩劫的 “四骑士” 正蓄势待发，再度席卷欧洲；在此危急关头，黑山务必重振其本就颇具规模的军事力量。"
