 mntfor.42.d.a:0 "（奥地利视角事件）黑山联合政府显然已分崩离析。迫于压力，黑山国王决定任命亲塞尔维亚的人民党掌权，并委任安德里亚·拉多维奇为总理。这无疑是一场灾难性的结果——黑山的舰船已被迫驶离卡塔罗港，港口两侧人群的嘲讽声此起彼伏，回荡在港湾上空。"
 mntfor.42.d.b:0 "（奥地利视角事件）黑山联合政府显然已分崩离析，而黑山国王凭借一记利落的外交妙手，已向萨格勒布与维也纳发送电报寻求支持。在我方明确的支持下，黑山方面得以收拾残局，勉强维持住了一段脆弱的现状。"
 mntfor.42.d.c:0 "（奥地利视角事件）黑山联合政府显然已分崩离析。迫于压力，黑山国王决定倒向 “真人民党”。相较于维持现状，这一选择并不算理想，但终究是 “两害相权取其轻”。目前，黑山的舰船已和平驶离卡塔罗港，奥地利所有军事资产也已撤离该国。"
 mntfor.42.a:0 "叛徒！"
 mntfor.42.b:0 "一个令人安心的结果。"
 mntfor.42.c:0 "想来，未来几年我们自会看到其后续影响。"
