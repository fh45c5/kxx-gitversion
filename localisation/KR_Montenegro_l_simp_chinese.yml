 mnt.32.c:0 "军团出手了，去他妈的赤匪！"
 mnt.58.t:0 "军团的要求"
 mnt.58.d:0 "显然，并非所有自称为“黑山卫士”的人都真正效忠于国王。其中一支最不忠诚的力量，是由黑山人拉多拉·盖达指挥的捷克斯洛伐克军团。这支部队对黑山被一位他们认为无能的国王统治深感不满。\n\n要理解这支军团的来历，需要回溯到世界大战结束之后。按照最初的设想，“终结一切战争的战争”结束后，以托马斯·马萨里克、爱德华·贝奈斯等人为首的捷克斯洛伐克民族委员会应被邀请回到波西米亚王冠领地，在俄国组建的捷克斯洛伐克军团也应随之返回家园。然而，由于德国在一战中获胜，战局剧变，俄罗斯陷入了更为混乱的内战。布尔什维克在内战中遭遇失败，在各国支持的亚历山大·克伦斯基政府复辟后，残余的布尔什维克势力被压制。\n\n在这种背景下，俄罗斯的白军势力控制了大片区域。其中，海军上将亚历山大·高尔察克击败了远东布尔什维克，一度掌控西伯利亚等地。但由于白军内部严重分裂，加上外国干涉的影响，高尔察克的力量被削弱。为了寻求合法性并与克伦斯基政府在西部的统治相抗衡，高尔察克在俄罗斯远东地区宣布成立了一个割据政权：俄罗斯远东共和国。正是在这个时期，滞留在俄国的捷克斯洛伐克军团主力落入了高尔察克的控制之中，被迫成为他维持其割据政权统治的工具。不过，仍有部分捷克斯洛伐克军团的士兵设法逃离了俄国，成功返回了波西米亚王冠领地。但是，黑山境内的这支捷克斯洛伐克军团分支，却在波西米亚本土处境艰难。原因主要有两点：一是该军团表现出强烈的斯拉夫民族主义倾向，这与当时波西米亚主流政治氛围存在冲突；二是其内部成员构成复杂，混杂了来自不同地区的斯拉夫人。这种状况导致一些曾试图支持或接纳该军团的政治人物在波西米亚失势甚至被驱逐。\n\n在指挥官拉多拉·盖达的带领下，这支在波西米亚备受冷遇的捷克斯洛伐克军团决定离开。他们选择流亡到黑山王国，认为那里远离了奥地利帝国的直接控制范围（尽管黑山名义上是奥地利的附庸国，但因地理遥远，奥地利的管控相对薄弱），是一个可以栖身的地方。抵达黑山后，他们被国王收编，成为其麾下的一支军队。\n\n然而，这支部队从未真正改变其立场。现在，面对国王的统治，捷克斯洛伐克军团公开提出了最后通牒：要么国王主动退位下台，要么军团就“帮他”实现退位——即发动军事政变将其推翻。面对如此明确的威胁和内部公开的叛乱，黑山国王发现自己已然陷入绝境，似乎别无选择。"
 mnt.58.a:0 "嘿，斯拉夫人！"
 mnt.59.t:0 "军团政治化"
 mnt.59.d:0 "有些人宁愿沉浸在民主许诺的华丽辞藻之中，也不愿接受军政府或独裁者以铁腕手段所换来的面包与秩序。在黑山，尽管多数人对政治动向显得漠不关心，却仍有一批人高呼着民主的口号，激烈地表达他们的诉求。然而现实是，黑山本土的民主力量尚未成熟到足以稳固执政、承担国家方向的地步。有趣的是，这些所谓的“民主婴儿”似乎并不真正在意谁在统治，他们渴望的更多是一种身份认同与政治参与的表象。既然如此，我们不妨顺水推舟，配合演出一场民主化的仪式，让捷克斯洛伐克军团换上一套新装，继续在台前幕后掌握实权。这样既安抚了呼声，又不必动摇根本，不过是一场精心编排的政治化装舞会。"
 mnt.59.a:0 "那就这样吧"
 mnt.59.b:0 "让伊日·斯特日布尔尼来负责吧"
 mnt.60.t:0 "军团的未来"
 mnt.60.d:0 "拉多拉·盖达是一个被历史与身份不断拉扯的人。他出身黑山，却成为捷克斯洛伐克军团的指挥官；他曾流亡俄国，又在动荡中接受泛斯拉夫理念——只因无法忍受斯拉夫兄弟自相残杀的战争，那让他感到绝望与愤慨。他既是军人，也是极右翼的支持者，甚至被一些人视为革命者，可这些标签却无法拼凑出一个完整的他。漫长的流亡与征战，使他在身份的迷宫中逐渐迷失，看不清自己究竟是谁，又该忠于何种信念。而如今，他必须做出决断。军团的士兵大多是单纯的年轻人，他们对政治怀有天真的幻想，对未来抱有干净的期望。盖达清楚，他一个人的犹豫不决，足以让整个军团陷入分裂与争吵。他不能再躲在迷茫的阴影里，拉多拉·盖达必须走出来，哪怕前方仍旧模糊，他也必须为那些信任他的士兵，选择一个方向。"
 mnt.60.a:0 "维持现状吧，军人能干的更好"
 mnt.60.b:0 "军团主义符合我们的政治目标"
 mnt.60.c:0 "民族最高纲领主义看起来不错"
 mnt.60.e:0 "萨文科夫主义能安抚大多数人"
 MNT_legion_putsch:0 "军团政变"
 MNT_legion_putsch_desc:0 "黑山终于摆脱了无能国王的枷锁，迎来了历史性的转折！在拉多拉·盖达将军的英明领导下，捷克斯洛伐克军团已成为这片土地新的守护者。我们肩负的不仅是治理之责，更是实现泛斯拉夫团结的伟大使命。旧时代的阴霾已被驱散，军团的旗帜下，我们将以铁与火的意志，锻造一个统一、强大的斯拉夫联盟。前进吧，军团的勇士们，黑山将是我们伟大征程的起点！"
 MNT_neo_slavic_nation:0 "新斯拉夫民族"
 MNT_neo_slavic_nation_desc:0 "斯拉夫人的团结不能建立在旧有的分裂根基上，必须彻底重塑民族之魂。当前这种若即若离、既合作又猜忌的状态，只会让统一永远停留在幻想。我们要以烈火般的决心，焚尽惰性与狭隘，锻造出坚韧、无私的新斯拉夫精神。唯有每个斯拉夫人都意识到我们同根同源，摒弃蝇头小利的计较，才能真正凝聚成一股无可阻挡的历史洪流，迈向光明的未来。"
 MNT_aryan_soul:0 "雅利安之魂"
 MNT_aryan_soul_desc:0 "世人常将日耳曼人奉为雅利安正统，殊不知斯拉夫人才是这古老血脉最纯净的继承者！我们的灵魂深处，镌刻着雅利安先祖无畏死亡的勇武与崇高。这份遗传自远古的荣耀，让我们在战场上如雄狮般凶猛，在信仰上如磐石般坚定。日耳曼人的宣称不过是历史的误读，真正的雅利安之魂，正在斯拉夫人的胸膛中炽烈燃烧，召唤我们重现先祖的辉煌。"
 MNT_slavic_physique:0 "斯拉夫之躯"
 MNT_slavic_physique_desc:0 "西方世界总以傲慢的眼光审视我们，将斯拉夫民族标签为落后与保守。他们从未理解我们广袤土地上的生活智慧与坚韧品格，其指责不过是无知的偏见。就让他们沉溺于可笑的优越感吧！我们深知斯拉夫躯壳里蕴藏的力量与尊严。真正的荣耀不在于他人的认可，而在于我们能否坚守本心，在质疑声中坚定走自己的路，用事实击碎一切谎言。"
 MNT_rome_heart:0 "罗马之心"
 MNT_rome_heart_desc:0 "欧洲君王无不渴望罗马帝国的光环，以教皇加冕为“罗马皇帝”为荣。然而，他们只模仿了形式，却丧失了罗马精神的精髓：进步、强大与自由。新斯拉夫民族要继承的，正是这颗不朽的“罗马之心”。我们不追求空洞的头衔，而要成为新时代的罗马人：以法律建立秩序，以勇气开拓疆土，以包容融合文化，让罗马的伟大在我们的血脉中重生。"
 MNT_towards_true_freedom:0 "通往真正自由"
 MNT_towards_true_freedom_desc:0 "斯拉夫人是风神斯特里博格的后裔，自由如同我们呼吸的空气。任何企图束缚我们的枷锁，终将被对自由的渴望所粉碎。我们如风般不可捉摸，席卷草原，穿越山峦，征服天空。我们的舞蹈随自由之风而起，我们的灵魂向往无垠的天地。这种与生俱来的自由，是斯拉夫民族最宝贵的财富，也是我们屹立于世界的根本。"
 MNT_the_holy_trinity:0 "神圣的三合一"
 MNT_the_holy_trinity_desc:0 "在迪耶乌斯的智慧、佩伦的雷霆、朱庇特的秩序共同指引下，新斯拉夫民族正在崛起！我们融合了雅利安人的高贵灵魂、斯拉夫人的强健躯壳、罗马人的博大心灵，形成一种前所未有的强大存在。这三位一体的传承，使我们既怀古人的荣耀，又具开创未来的力量。斯拉夫的崛起势不可挡，万岁，这必将照耀世界的新生民族！"
 MNT_tempered_by_fire:0 "辅以烈火淬炼"
 MNT_tempered_by_fire_desc:0 "唯有经过烈火的极致淬炼，才能实现真正的脱胎换骨。我们必须勇敢地点燃这场变革之焰，将旧时代的腐朽、怯懦与分裂彻底焚毁。这痛苦的过程将催生一个崭新的灵魂，坚韧、团结、无畏。摒弃所有弱点，新斯拉夫人将从灰烬中站立，如同经过千锤百炼的精钢，迈向无可置疑的强大。这不仅是重生，更是向更高生命形态的进化。"
 MNT_refuting_population_differences:0 "驳斥种群差异"
 MNT_refuting_population_differences_desc:0 "地域的分隔造成了南、西、东斯拉夫人的表面差异，但这无法掩盖我们灵魂深处的一致性。这种源自共同血脉与精神底蕴的共鸣，使我们的生活方式、价值取向趋向统一，这便是斯拉夫思想中强大的“统一主义”。它告诉我们，差异只是地理的偶然，团结才是历史的必然。我们终将如手足般紧紧相拥，形成一个牢不可破的整体。"
 MNT_put_on_white_gloves:0 "戴上白手套"
 MNT_put_on_white_gloves_desc:0 "尽管捷克斯洛伐克军团凭借力量掌握了黑山的主导权，但若要统治稳固，就必须超越单纯的军政府模式。大多数黑山民众虽对政治保持沉默，但我们仍需展现诚意与智慧。因此，逐步推行政府改组，吸纳文职精英，建立更广泛认同的治理体系，是确保长治久安的必要之举。谨慎而坚定的政治改革，将为我们的伟大事业奠定坚实基础。"
 MNT_eliminate_hatred:0 "咽下亘古之仇"
 MNT_eliminate_hatred_desc:0 "斯拉夫兄弟之间本无深仇大恨，过往的纷争多是别有用心的统治者刻意播撒的裂痕，用以维系其脆弱的统治。我们绝不能落入这卑劣的陷阱。让往日的恩怨随风消散吧，因为它们本不属于斯拉夫人民。当我们擦去统治者涂抹的污垢，留下的将是纯粹而深厚的兄弟情谊。这情谊，才是我们民族真正的底色。"
 MNT_stay_away_from_fratricide:0 "远离手足相残"
 MNT_stay_away_from_fratricide_desc:0 "兄弟阋墙，渔人得利。手足相残的悲剧该结束了！内部的争斗只会消耗斯拉夫的整体力量，让外族趁机削弱我们。这短视的行为损害的是所有斯拉夫兄弟的根本利益。我们必须清醒过来，放下指向彼此的刀剑。唯有停止内耗，携手共进，才能汇聚成改变世界格局的伟力，让斯拉夫民族赢得应有的尊重与地位。"
 MNT_unity_of_slavs:0 "摘取统一果实"
 MNT_unity_of_slavs_desc:0 "斯拉夫人的统一是历史注定的归宿，是任何力量都无法扭转的洪流。即便今日障碍重重，但在百年乃至千年的尺度上，这一目标必然实现！从亚得里亚海到太平洋，所有斯拉夫兄弟无论被称为克罗地亚人、塞尔维亚人、波兰人还是俄罗斯人，终将团聚在统一的旗帜下。我们将共同分享这来之不易的胜利果实，见证一个伟大民族的完全体。"
 MNT_harmony_and_tranquility:0 "和谐与宁静"
 MNT_harmony_and_tranquility_desc:0 "政府的成功改组，为国家带来了前所未有的和谐与稳定。曾经嘈杂的反对之声，已转化为建设国家的共同意志。黑山仿佛凝聚成一颗强劲跳动的心脏，各个部分协调运作，不可或缺。人们为了共同的目标而劳作，彼此信赖，团结一心。这种内在的凝聚力，正是我们迈向更远大目标的坚实保障。"
 MNT_liberate_compatriots:0 "依靠我等族胞"
 MNT_liberate_compatriots_desc:0 "让我们从黑山这片希望之地出发，将泛斯拉夫统一的旗帜插遍整个斯拉夫世界！我们的使命是终结千年的争吵与分裂，让和平与自由重新成为我们民族的标志。这面旗帜将指引我们穿越一切艰难险阻，汇聚所有兄弟的力量。斯拉夫人啊，愿团结与荣耀永远与你同在，我们必将共同开创属于所有斯拉夫人的黄金时代！"
 MNT_revive_the_roman_empire:0 "梦魂牵绕之乡"
 MNT_revive_the_roman_empire_desc:0 "在统一斯拉夫世界的征程中，复兴罗马帝国的理想散发着难以抗拒的魅力。历代雄主皆以继承罗马衣钵为荣，我们亦当有此气魄。这不仅是领土的收复，更是文明的重铸，将罗马的法度、斯拉夫的活力与雅利安的荣光融为一体。新罗马帝国将从我们手中诞生，一个超越古典、照耀未来的全新霸权，注定将震撼世界。"
 MNT_under_the_leadership_of_belobog:0 "希冀的骑士跨上马"
 MNT_under_the_leadership_of_belobog_desc:0 "啊，贝罗伯格，伟大的光明与秩序之神！您驱散了笼罩斯拉夫民族的漫长黑夜，为我们指明了前进的方向。您忠诚的骑士们已再次集结，聆听您的神圣谕令。我们将跨上战马，高举希望的火炬，深入那些仍被黑暗与堕落侵蚀的同胞之地，带去您的光明与救赎。这神圣的远征，将洗净民族的污垢，让斯拉夫世界在您的光辉下重获新生！"