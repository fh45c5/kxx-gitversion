 MNT_split_serbia_bulgaria_desc:0 "在确立我们新的国家理念后，我们应与保加利亚人寻求共识。若能达成一项协议，确保此次我们与塞尔维亚的战争结束后，贝尔格莱德归我们宗主权管辖，一切将事半功倍。我们将邀请保加利亚人共同商议战后塞尔维亚的局势走向。"
