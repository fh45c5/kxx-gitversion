 MNT_bauxite_idea:0 "红色铝土矿出口"
 MNT_bauxite_idea_desc:0 "铝土矿是黑山最主要的矿产资源。我国拥有欧洲最大的铝土矿储量之一，且所有铝土矿均从尼克希奇市开采提取。这种铝土矿的开采对我国经济而言是一大助力，产自这里的许多矿石或矿产品随后会运往奥地利、保加利亚或塞尔维亚。"
