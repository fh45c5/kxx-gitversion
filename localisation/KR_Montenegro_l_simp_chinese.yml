 mntintro.1.t:0 "1936年前后的黑山王国"
 mntintro.1.d:0 "在世界大战期间，黑山王国曾站在协约国一方作战，最终被奥匈帝国与保加利亚军队击败。随着黑山被吞并为奥匈帝国治下的“黑山共管领土”，其独立地位宣告终结。该共管领土由奥匈帝国军方严密控制，奥匈帝国本打算将其纳入日益兴起的 “伊利里亚理念” 框架——但命运弄人，哈布斯堡王朝的这一期望，最终随着南斯拉夫起义的爆发化为泡影。\n\n尽管仍对世界大战中的失利耿耿于怀，黑山的“绿党”与“白党”起初选择并肩作战。后来，在心怀不满的塞尔维亚军官支持下，新的切特尼克游击队组建起来，奥匈帝国当局很快被逐出了昔日黑山王国的领土。遵循历史传统，黑山于1928年7月13日宣布独立。\n\n此后，“绿党”与“白党”逐渐演变为“普拉瓦希派”与“克鲁巴希派”。围绕塞尔维亚吞并这一议题，两派爆发短暂的黑山内战，兵戎相见。凭借奥匈帝国与保加利亚的决定性支持，普拉瓦希派取得胜利。但就在黑山局势逐渐稳定之际，奥地利军队重新进驻萨拉热窝，并再度吞并了波斯尼亚。\n\n由于独立地位再次面临威胁，黑山向维也纳提出效忠提议，条件是允许米哈伊尔·彼得罗维奇-涅戈什亲王加冕为黑山国王，且过程中不流血。这一提议得到了接受。从法律层面而言，黑山是除列支敦士登外，唯一完全处于哈布斯堡势力范围内的独立国家；但实际上，奥地利仍掌控着黑山政治的诸多方面。\n\n然而，过去的问题依旧困扰着黑山：其经济几乎完全依赖奥匈和伊利里亚的贸易与企业；北部地区被塞尔维亚分离主义者占据，这些人是克鲁巴希派中的激进分子，与昔日的白党有着相似的立场；曾在南斯拉夫起义中发挥关键作用的抵抗力量——激进的红色切特尼克成员，仍潜藏在民众之中；而随着塞尔维亚逐渐恢复实力，昔日绿党所属的派系也变得愈发激进。若想在20世纪站稳脚跟，黑山必须设法掌控这些失控的局面。"
 mntintro.1.a:0 "我们美丽的黑山！"
 mnt.1.t:0 "黑色星期一席卷黑山！"
 mnt.1.d:0 "从柏林传来的多米诺骨牌效应，正逐一推倒欧洲各国脆弱如纸牌屋的经济——如今，我们的“纸牌”也已轰然倒塌。由于与维也纳的紧密联系，波德戈里察的经济一落千丈，仿佛从博博托夫库克山直接坠入亚得里亚海。\n\n在这危急局势下，奥地利的工厂与企业已在金融浪潮中举起白旗；投资者纷纷撤离，黑山正倒退回近乎“共管领土”时期的状态。随着奥地利军队从塞尔维亚与黑山全境撤军，当地的紧张局势也随之激化：此前被维也纳当局边缘化、且当局明显偏袒“绿党”的“红党”与“白党”，已开始采取行动。\n\n黑山的未来虽充满未知，但国王将为我们扫清前行的道路！"
 mnt.1.a:0 "该死的雪崩！"
 mnt.2.t:0 "尼克希奇公民投票"
 mnt.2.d.a:0 "我们必须立刻处理这片“火药桶”角落中迅速升温的局势。政府主要成员已与国王在尼克希奇召开会议，试图厘清当前不明朗的处境——最终，此事的最终决定权被交到了国王手中。\n\n一方面，尽管奥匈帝国对黑山的控制曾带来诸多弊端，但随着奥匈军队撤出黑山领土，这些负面影响大多已消散。奥匈帝国的保护并非毫无益处，至少能让我们不必惧怕塞尔维亚。\n\n然而，眼下的局势也为普拉瓦希派提供了机会：他们可借此将黑山引向一条完全以自身利益为核心的道路。但这一选择会让我们陷入孤立——除保加利亚外，几乎所有周边势力都会与我们疏远，而保加利亚自身也正被虎视眈眈的“贪婪兀鹫”所环绕。\n\n曾几何时，克鲁巴希派在事务决策中拥有举足轻重的影响力；但命运的无常几乎让他们在未来数年都无法再拥有合法的重要地位。即便国王做出最终抉择，仍需全体民众投票认可——国王仅有最高话语权，而非独断权。选举即将举行，而正如国王承诺的那样，将为“最自由的黑山”挺身而出的，是......"
