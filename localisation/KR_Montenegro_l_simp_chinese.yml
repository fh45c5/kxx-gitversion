 MNT_KING_MICHAEL_DESC:0 "米哈伊一世是彼特罗维奇-内戈什家族的成员，自1929年起成为黑山国王，他是由丹尼洛一世王储加冕的。因此，年轻的国王肩负起整理新的、自治的黑山的重任，并确保其在未来数年的政治完整性。作为支持黑山从奥地利帝国独立的倡导者，国王认为独立的黑山是难以捉摸的，他预见到不久的将来叛乱将被残酷镇压。由于塞尔维亚和其他潜在的斯拉夫盟友无法帮助黑山，米哈伊一世签署了尼什契条约，使黑山在哈布斯堡王冠下获得自治权，允许米哈伊一世被加冕为黑山国王，这是自世界大战结束以来的第一位。\n尽管他的统治被视为黑山稳定的灯塔，但黑山的两个民族主义人民党既与他合作又与他对抗，试图确保黑山的完全独立。米哈伊一世必须谨慎行事，既要与人民党的塞尔维亚人合作，又要与真人民党的反奥地利黑山人合作。"
 MNT_KING_MICHAEL_NPO_DESC:0 "米哈伊一世是彼特罗维奇-内戈什家族的成员，自1929年起成为黑山国王，他是由丹尼洛一世王储加冕的。因此，年轻的国王肩负起整理新的、自治的黑山的重任，并确保其在未来数年的政治完整性。作为支持黑山从奥地利帝国独立的倡导者，国王认为独立的黑山是难以捉摸的，他预见到不久的将来叛乱将被残酷镇压。由于塞尔维亚和其他潜在的斯拉夫盟友无法帮助黑山，米哈伊一世签署了尼什契条约，使黑山在哈布斯堡王冠下获得自治权，允许米哈伊一世被加冕为黑山国王，这是自世界大战结束以来的第一位。\n尽管他的统治被视为黑山稳定的灯塔，但黑山的两个民族主义人民党既与他合作又与他对抗，试图确保黑山的完全独立。米哈伊一世必须谨慎行事，既要与人民党的塞尔维亚人合作，又要与真人民党的反奥地利黑山人合作。\n\n然而，就在这一刻，米哈伊一世发现自己处于一个奇特的位置：处于德尔列维奇和萨维奇·马尔科维奇·什捷迪姆利亚奇特的民族主义的领导地位。尽管国王不同意他们关于黑山起源的理论，但强大的黑山将培养出更强大的人民。"
 MNT_DRLJEVIC_DESC:0 "或许由于他的意识形态联系而被误贴标签，塞库拉·德列耶维奇于1884年9月6日出生。在黑山政治舞台上，德列耶维奇是真人民党的中流砥柱，为黑山从贝尔格莱德独立而斗争。在邪恶帝国占领黑山期间，德列耶维奇组建了一支游击队“黑山国民军”，让山区的殖民军队的日子变得极其艰难。\n在尼什契条约签署和黑山独立恢复之后，德列耶维奇因赶走奥地利人而被默默地视为英雄。深受他们在新“宗主国”所发生事件的启发，德列耶维奇研究了兰茨·冯·利本菲尔斯和理查德·冯·库德诺夫-凯勒奇的作品，提出了一个此前未曾预见的关于黑山人起源的观点。在德列耶维奇及其新得力助手萨维奇·马尔科维奇·什捷迪姆利亚看来，黑山人是一个源自古伊利里亚人的迪纳里克种族。黑山人是所有塞族人中最纯粹的，而对新兴的黑山民族运动来说，它将永远保持这种状态！"
 MNT_POPOVIC_DESC:0 "出生于1881年9月13日的克尔斯托·波波维奇，自世界大战以来一直是黑山最杰出的军事领袖，长期享受着聚光灯的照耀。在世界大战中首次获得勋章后，波波维奇作为英雄回到了他的人民身边，但他成为了新国家的敌人。在共管时期，波波维奇多年处于隐藏状态，与其他黑山人从零开始建立抵抗力量。在南斯拉夫叛乱期间的黑山革命中，波波维奇发挥了重要作用，他的领导将分散的黑山切特尼克人团结在一面旗帜下，呼吁黑山摆脱奥地利的统治。\n\n克尔斯托·波波维奇在战争中的行动使他在国内外都获得了极大的声誉，他一直将逐渐分裂的切特尼克联盟维持到独立日。战后，波波维奇的个人立场是与奥地利保持友好关系，因为他坚决反对塞尔维亚化的黑山。波波维奇在政治上与塞库拉·德尔列维奇和萨维奇·马尔科维奇·什泰迪姆利贾结成盟友。尽管不同意他们关于黑山的民族叙事，但波波维奇实际上以单人军事独裁者的身份统治了黑山，始终忠于他的国王和黑山。"
 MNT_DRAGUTIN_PRICA_DESC:0 "德拉古京·普里察主要因其作为克罗地亚出生的奥匈帝国海军军官的任职而闻名。在南斯拉夫叛乱期间，普里察叛逃并加入了伊利里亚革命者，部分负责指挥叛军分散的海军力量。战争结束后，普里察在条件是他将协助新成立的黑山国家建设其海军力量的情况下获得了赦免。普里察作为海军上将的工作非常清闲，以至于德拉古京·普里察经常说他很久以前就退休了，这很奇怪，因为考虑到他获取奥匈帝国舰艇的计划取得了巨大的成功。"
