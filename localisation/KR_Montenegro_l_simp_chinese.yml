 mntnews.2.t:0 "[MNT.GetNameDef]宣言"
 mntnews.2.d:0 "凭借一记彰显军事实力与务实机遇把握的惊人举措，这个曾一度不起眼的黑山族群已然重塑了自身认同，并将卡尔皇帝的 “戴克里先理念” 纳入囊中，将其转化为一套切实可行的建国方略。在短暂征服阿尔巴尼亚与塞尔维亚之后，一场旨在建立 [MNT.GetNameDef] 的制宪会议在采蒂涅召开。采蒂涅是黑山历史古都，曾为黑山王国首都，而这个新生国家已着手行动，为如今身处这片陌生新土地上的诸多族群筑牢稳定根基。\n新联盟的名称源自一段更早的历史时期，而它已然巩固了自身地位，成为 “火药桶” 格局中一股举足轻重的新兴力量。“火药桶” 特指巴尔干半岛，该地区历史上民族、宗教矛盾复杂，长期处于动荡边缘，故有 “欧洲火药桶” 之称。有人质疑新联盟能否长久存续，也有人好奇它的存在将对周边世界产生何种影响 —— 但 [MNT.GetNameDef] 似乎并无放缓其快速崛起步伐的打算。"
