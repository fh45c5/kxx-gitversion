 MNT_admiral_school:0 "设立CAŠ"
 MNT_admiral_school_desc:0 "由于黑山除了希腊和阿尔巴尼亚之外，离奥特朗托海峡最近，因此，若黑山海域发生任何情况，一支强有力的海军指挥力量必不可少。由多瑙河地区投资者资助的肖尔海军上将将确保黑山海军至少有机会与另一支舰队一战。"
 MNT_underprepared_laws:0 "准备不足的政府"
 MNT_underprepared_laws_desc:0 "如果我们不小心的话，我们目前所处的多民族状况可能很快就会重蹈奥地利的覆辙。我们的政府必须准备好接纳这些新的民族和文化。"
 MNT_anti_discrimination:0 "反歧视政策"
 MNT_purple_resistance:0 "绿派抵抗组织"
 MNT_purple_resistance_desc:0 "黑山工团主义者的接管并非毫无抵抗 —— 而绿派和人民党这一次联合起来，试图驱逐 “红色威胁”。"
 MNT_purple_resistance_2:0 "绿派抵抗组织"
 MNT_purple_resistance_2_desc:0 "黑山工团主义者的接管并非毫无抵抗 —— 而绿派和人民党这一次联合起来，试图驱逐 “红色威胁”。"
 MNT_in_defense_of_the_republic_idea:0 "保卫共和国"
 MNT_infantry_idea:0 "步兵万能论"
 MNT_construction_idea:0 "工团主义发展"
 MNT_dinaric_heritage_idea:0 "迪纳拉身份认同"
 MNT_dinaric_heritage_idea_desc:0 "黑山人是源自克罗地亚的迪纳拉族群的一支，我们必将捍卫这份引以为傲的身份认同！"
 MNT_orthodoxy:0 "践行圣巴西尔的教义"
 MNT_federalism:0 "多瑙河联邦主义"
 MNT_federalism_desc:0 "根据理查德·冯·考登霍夫-凯勒奇的理念，我国采纳了多瑙河联邦制的部分原则，旨在安抚我国境内愤怒的塞尔维亚人、阿尔巴尼亚人和克罗地亚人。"
 MNT_DANU:0 "杜克兰斯卡科学与艺术学院的造物"
 MNT_DANU_desc:0 "杜克兰斯卡科学与艺术学院又称多克莱安科学与艺术学院，以中世纪的杜克莱亚地区命名。该学院深受黑山民族主义的影响，在科学、文化和当代艺术教学方面表现卓越。"
 MNT_herceg_novi_rail:0 "新海尔采格铁路线"
 MNT_police:0 "鼓励警务"
 MNT_navy_bought:0 "黑山海军订购项目"
 MNT_navy_bought_desc:0 "黑山共和国已承诺支付巨额资金，以换取现代化舰艇的采购。"
 MNT_navy_bought_MNT:0 "黑山海军订购项目"
 MNT_navy_bought_MNT_desc:0 "我方已向亚得里亚海地区的奥匈帝国造船厂提供了一笔可观的资金，以强化我国海军军备。"
 MNT_navy_bought_INT:0 "黑山海军订购项目"
 MNT_navy_bought_INT_desc:0 "为确保奥地利永不落入我国或那不勒斯之手，国际组织已提出共同出资方案以筹建新型红色海军。对方承诺提供燃料与资源；我方仅需确保在这场艰苦卓绝的战争中取得胜利并提供护航保障。"
 MNT_bulwark:0 "反对奥地利"
 MNT_investors:0 "投资回报"
 MNT_investors_desc:0 "“黑色星期一”事件后稳定的政局与普遍平和的环境，已促使众多新老投资者对我们这个小国投以信任。"
 MNT_planes:0 "空军兵力分配"
 MNT_electric_idea:0 "黑山电气化进程"
 MNT_SER_WAR_REPS:0 "来自黑山的战争赔款"
 MNT_SER_WAR_REPS_PAYUPBROKEBOY:0 "对塞尔维亚的战争赔款"
 MNT_the_great_balancing_act:0 "大均势法案"
 MNT_the_great_balancing_act_desc:0 "1936年的曙光普照世间诸国，无论大小。变革的热忱弥漫于空气之中；奥地利对巴尔干地区的掌控已如履薄冰。其注意力正转向国内，以期彻底解决困扰国民的痼疾。\n对黑山而言，此乃紧要关头：即便共管时代终结多年，奥地利仍以扼喉之势钳制黑山。今已至决断之时：吾辈当继续依附奥地利，抑或挣脱桎梏？"
 MNT_treading_carefully:0 "小心行事"
 MNT_treading_carefully_desc:0 "安德里亚·拉多维奇领导的人民党，是黑山两大主要政治集团之一。该派别与白党本质上立场一致，二者对国家核心议题的看法如下：黑山人是源自塞尔维亚的塞尔维亚民族。尽管这一主张在王室中不受欢迎，但其价值不言而喻：除保加利亚外，它有助于改善黑山与其他巴尔干兄弟国家的关系；此外，若黑山有此意愿，还能借此获得向西或向南扩张的机会。与真人民党结盟，便是追随泛斯拉夫主义的旗帜"
 MNT_old_pravasi_friends:0 "请信赖真人民党"
 MNT_old_pravasi_friends_desc:0 "在多位不同领袖的引领下，真人民党为国家这一根本性问题提出了独特的解决方案：黑山应由黑山本土的塞尔维亚人构成。而更为激进的泽莱纳西派则作为反奥及反塞尔维亚游击队，曾参与南斯拉夫起义运动。当奥地利承诺支持黑山王室后，绿派的命运发生转折——他们主张黑山应由黑山本土的黑山民族构成。尽管真人民党可能使我们陷入孤立境地，但只要我们谨慎行事不触犯各方利益，它仍可能为黑山带来最为光明的前景。"
 MNT_independence_and_cordiality:0 "独立自主与真诚友好"
 MNT_independence_and_cordiality_desc:0 "显而易见的是，即便经历如\"黑色星期一\"般的剧变，局势实质上并未发生根本性转变。尽管我们具备调整方针的能力，但当前所采用的方案仍属最优解。我们有强国作为后盾，并能从其商业活动中获取可观收益；既然与奥地利合作几乎无利可图，又何须自缚于弱势盟邦而陷入孤立境地？"
 MNT_export_bauxite_stash:0 "红铝土矿运输"
 MNT_export_bauxite_stash_desc:0 "黑山的矿业主要以铝土矿——红铝土矿为主。作为铝工业的必要原料，共管时期由奥地利人建造的矿山在大量投资撤出后已被国有化。作为经济中极具盈利性的部门，这些矿山必须持续运营并进行扩建：倘若欧洲所展现的迹象属实，那么黑山的铝将在未来的国内和军事领域起到决定性作用。"
 MNT_expand_the_sawmills:0 "林地锯木厂"
 MNT_expand_the_sawmills_desc:0 "黑山北部地区被茂密的森林如厚重毯覆般覆盖。为应对黑色星期一事件，国内多项建设工程对木材需求日益增长，需在乡村地区新建锯木厂与木材堆场。鉴于北部居民同样深受南部经济崩溃的严重影响，这些建设项目将为该地区失业人口提供就业支持。"
 MNT_study_austrian_boats:0 "舰船逆向工程研究"
 MNT_study_austrian_boats_desc:0 "我国海军唯一的高级军官德拉古廷·普里察（其本人甚至非黑山籍）具有为海军部队采购奥匈帝国舰船的经验记录。鉴于\"黑色星期一\"引发的政治动荡已波及地中海沿岸几乎所有国家，当务之急是获取若干舰船专供拆解研究之用。通过此举，我们将得以培养首批黑山海军指挥官掌握舰船机械结构的运作原理。"
 MNT_nationalize_austrian_industries:0 "奥地利垄断企业国有化"
 MNT_nationalize_austrian_industries_desc:0 "尽管我们仍与奥地利保持着密切联系，但绝不允许其束缚我国发展。某些企业依旧固守既得利益，以牺牲黑山民众利益为代价向维也纳输送利益——哈布斯堡王朝本身无可指摘，但这些贪婪的资本权贵难辞其咎。必将把这些剥削者推向市场，我们的市场：届时将由我们执掌裁决之刃，亲手将其攫取的不义之财重归国民共享。"
 MNT_third_great_danubian_port:0 "巴勒港之宏伟气象"
 MNT_third_great_danubian_port_desc:0 "波德戈里察已成为亚得里亚海沿岸至关重要的海运通道。随着过去几年克朗资本注入带来的设施扩建，该港已转型为区域性核心航运枢纽。来自塞尔维亚的货物经此转运需缴纳高额关税，为我们双方创造了可观收益。我们必须维护并巩固波德戈里察在亚得里亚海的重要地位，因为每艘在彼得罗维奇-涅戈什王朝注视下通航的船舶，都将为我们带来数千克朗的额外收入。"
 MNT_mobilize_for_action:0 "绝不与恐怖分子进行谈判"
 MNT_mobilize_for_action_desc:0 "黑山大部分地区的生活宁静祥和，但北部却鲜少能归入 “黑山常态” 的范畴。根本原因很简单：在山区露头地带藏匿着极端塞尔维亚势力 —— 他们对南斯拉夫起义期间政变未遂的结局耿耿于怀。塞尔维亚游击队曾企图夺取政权，将其作为 “礼物” 献给塞尔维亚，而奥匈-黑山联军则彻底粉碎了这一白日梦。\n我们必将彻底堵住这一祸源，并用鼠药将其灌满；他们每多一分从我们的动荡中攫取利益，明天的局势就会愈发糟糕。"
 MNT_trade_treaty_serbia:0 "波德戈里察高速公路协议"
 MNT_trade_treaty_serbia_desc:0 "尽管奥地利对塞尔维亚怀有敌意，我们仍与其保持着友好关系——只要我们不干涉其塞族复兴主义运动。鉴于塞尔维亚目前仍处于弱势状态，我们可以压制奥地利在该地区的商业影响力以支持塞尔维亚。一条新的公路将穿越迪纳拉山脉直通贝尔格莱德，同时相关贸易协定也将正式生效。"
 MNT_trade_treaty_bulgaria:0 "防御性贸易外交"
 MNT_trade_treaty_bulgaria_desc:0 "敌人的敌人就是朋友。塞尔维亚是黑山独立的最大威胁。为确保那些“小麻烦”永远不会找上门来，我们必须筑起一道“金钱之墙”——而且我们已经找到了两个有意参与的伙伴。保加利亚和阿尔巴尼亚，要么受到塞尔维亚的觊觎，要么对塞尔维亚有所图谋，它们可能愿意达成协议。我们将共同出资，在这两国境内修建一条公路，并签署一项贸易协定。"
 MNT_montenegrin_domestic_minerals:0 "组建资源恢复开采协会"
 MNT_montenegrin_domestic_minerals_desc:0 "尽管黑山已是欧洲铝土矿的主要生产国，它仍藏有一张王牌 —— 铁矿。铁矿是各类制造业中最不可或缺的矿产之一，因此，由我们自主开采铁矿的必要性不言而喻。资源恢复开采协会即将成立，该协会将由探矿者与矿工共同组成，负责勘探尚未开采的矿产储备。"
 MNT_prospect_for_coal:0 "协助黑山电力公司"
 MNT_prospect_for_coal_desc:0 "黑山电力公司是黑山最具盈利能力的企业之一。在奥匈共管时期，得益于资金支持，黑山电力公司迎来了发展热潮。该公司的电器产品与奥地利的同类产品一起，逐渐融入了普通黑山民众的生活。如今，其电器产品将为我国新矿山的照明设备、新工厂的锯片以及未来道路上行驶的汽车提供支持。"
 MNT_macroeconomic_reform:0 "宏观经济调整法案"
 MNT_macroeconomic_reform_desc:0 "我国经济如今必须进行根本性改革：长期以来，黑山一直是一个农业国家。为避免此类严重的经济灾难，我们必须铲除病根——有缺陷的经济体制。唯有依靠自身、仅与外国企业保持少量联系，我们才能坚持下去。"
 MNT_back_on_track:0 "回到正轨"
 MNT_back_on_track_desc:0 "我国经济已全面恢复至\"黑色星期一\"前水平。尽管有所谓专家将黑山誉为巴尔干地区崛起新星，但需客观指出，我国在经济与军事实力方面仍逊于多数邻邦。然此局面或将迎来转机。"
 MNT_any_trade_partners:0 "开港通商策略"
 MNT_any_trade_partners_desc:0 "我国成立时间尚短，因此无人能确切知晓该如何看待我们。这意味着我国在国际政治舞台上处于孤立无援的境地，而对于像我国这样地处巴尔干半岛这种动荡地区的小国而言，这种状况十分危险。为了与欧洲及海外大国建立新的联系，我们将向所有国家开放波德戈里察港，不论其政治倾向如何。有人认为此举危险，但为求生存，我们必须承担这样的风险。"
 MNT_defense_if_needed:0 "《武装必要法案》"
 MNT_defense_if_needed_desc:0 "我们这个新生国家的防御力量仅靠一支规模极小的部队支撑，说它是民兵，倒比称其为正规军更贴切。为守卫边境，我们必须大幅扩充军队 —— 而要实现这一点，我们将通过《武装必要法案》，将其他项目的资金调拨至军事领域。此举或许会对部分经济与社会领域造成不利影响，但倘若某个新兴政权将我们征服，无论资金投入何处，都将变得毫无意义。"
 MNT_prioritize_montenegrin_companies:0 "强化本土企业"
 MNT_prioritize_montenegrin_companies_desc:0 "我们是一个贫困的民族，长期遭受历任统治者的忽视。如今既已独立，终可将黑山的财富重新投入本国建设。根据财务顾问的评估，实现投资效益最大化的最具成本效益方式在于扶持本土企业。此方案具有显著优势，故我们将开始向所有资金需求的企业提供低息贷款。通过此举，注入企业的资金将逐步惠及普通民众。"
 MNT_reintroduce_perper:0 "重新引入黑山佩帕尔币"
 MNT_reintroduce_perper_desc:0 "自南斯拉夫起义以来，我国本土货币黑山珀珀便被奥地利克朗所取代，此举实为压制我国的公然行径。如今既获自由，吾辈断不容许奥皇继续以此手段操控我国经济。兹决定逐步废止克朗流通，并以全新固定汇率重启珀珀货币体系。此番举措将斩断奥地利影响力的又一触须。"
 MNT_overwrite_austrian_companies:0 "废除奥地利贵族制度"
 MNT_overwrite_austrian_companies_desc:0 "我国经济由奥地利企业主导。这些明目张胆的垄断企业几乎将我国本土企业扼杀在摇篮里。我们必须决定如何应对这些企业。有人建议将它们收归国有，拆分后再出售。这将进一步削弱奥地利企业在我国的影响力，使我们重新掌控本国经济。然而，也有人对此提出警告，称此举很可能会适得其反，导致经济形势恶化。因此，他们建议允许奥地利企业继续运营，但要加强监管，为本土企业的发展创造空间。我们该何去何从呢？"
 MNT_foreign_investment:0 "尼科希奇外资授予仪式"
 MNT_foreign_investment_desc:0 "尼科希奇银行是黑山境内创立的首家银行。为进一步提振地方经济，我们将鼓励该银行向有需求的普通民众发放个人贷款。同时，该银行还将获准跨境寻找具有良好投资前景的境外项目。"
 MNT_bribe_serbs:0 "安抚人民党成员"
 MNT_bribe_serbs_desc:0 "“克鲁巴希党”（即人民党）对我国的改革举措始终持抵触态度。该政党将我们的国家——实则是他们自己的祖国——视为畸形存在，持续推动我国并入塞尔维亚的议程。然而，他们与我国民众同宗同源，同样易受利益输送的影响。为换取其降低舆论攻势，我国将对其势力范围进行定向投资。有观点警示，这种显而易见的政治赎买行为势必增强其未来选举优势，若该党执政，黑山独立地位恐将岌岌可危。更甚者，此举或助长盘踞在北部的塞尔维亚恐怖主义势力的嚣张气焰。然国家独立本就风险环伺，于万千危机中再添一重又何妨？"
 MNT_podgorica_seaport:0 "波德戈里察海港"
 MNT_podgorica_seaport_desc:0 "我国主要港口——波德戈里察海港，近期已成为亚得里亚海沿岸的重要贸易枢纽。从美洲至孟买的航线船舶在此停靠，进行货物装卸与补给作业。日益增长的船舶流量与持续扩大的船舶规模，充分暴露出当前港口规模的局限性。为维持经济的高速增长态势，我们已批准实施港口紧急改造工程，以提升其容纳能力，满足持续增长的巨型船舶通航与停泊需求。"
 MNT_lead_and_zinc:0 "勘察布尔斯科沃矿区"
 MNT_lead_and_zinc_desc:0 "多年来，布尔斯科沃矿山一直是铅和锌资源的重要产地。然而，最新勘探数据显示，该区域可能存在尚未开发的矿脉。目前我们已收到大量关于勘探这些潜在矿藏并开展开采作业的请求，经综合评估，我们认为反对此类请求的理由并不充分。"
 MNT_northeast_livestocks:0 "与贝拉内牧场主群体的和解"
 MNT_northeast_livestocks_desc:0 "我国北部地区遍布塞尔维亚恐怖分子，其长期目标旨在摧毁我们的国家。短期内，他们已在贝拉内地区对土地所有者实施恐怖行径，抢夺粮食、焚毁农作物并屠杀牲畜。此类暴行仅在受害民众与政府之间滋生恶感，民众认为政府未采取任何措施制止暴乱。就此而言，民众的指责确属实情——我们确实尚未采取反制行动。但若要保持政权稳定，尤其是维持经济繁荣，我们必须重新争取这些土地所有者的支持。我们将会见这些土地所有者，倾听其诉求，并以最佳方式予以妥善解决。"
 MNT_business_of_balkans:0 "巴尔干地区商业格局"
 MNT_business_of_balkans_desc:0 "我们正财源广进，业务遍及全国且呈爆发式增长，繁荣的经济正逐步将我们的生活水平提升至十年前难以企及的新高度。多个彼此官方立场对立的巴尔干国家均将我国视为经济中立区进行接洽——尽管这些国家相互敌视，却仍不得不开展往来。这一声誉对我国不仅意味着巨大的经济价值，更将保障我国的安全地位，成为名副其实的\"巴尔干瑞士\"。"
 MNT_appeasing_northern_serbs:0 "解决北方困境"
 MNT_appeasing_northern_serbs_desc:0 "北方塞尔维亚族长期以来对波德戈里察及其民族主义理想深感失望。随着普拉瓦希派失势、绿派处于弱势，此刻正是修复我们与北方塞族关系的契机。北方塞族历来比国内其他地区更亲贝尔格莱德；我方获胜这一事实本身已构成重要的开端。我们必须把握良机，实现海岸与山峰的团结统一。"
 MNT_set_boundaries:0 "法律界限的划定"
 MNT_set_boundaries_desc:0 "必须确立国家疆界的防卫体系；尽管我国军队常被标榜为“规模庞大”，但其在镇压任何新兴叛乱势力时的效能至多仅属平庸。幸而当前我国局势相对稳定，尤以奥地利、塞尔维亚或德国相较之下更为安宁，然此种幸运未可久恃。军队须依托本土进行补给，并切实守卫边疆。"
 MNT_adopt_the_dinar:0 "采用塞尔维亚第纳尔作为法定货币"
 MNT_adopt_the_dinar_desc:0 "当前，黑山共和国的法定货币为奥匈帝国克朗。随着\"黑色星期一\"事件引发整个经济圈的重创与崩盘，克卢巴希党对继续维持克朗支持政策的实际效用提出质疑；他们认为，受冲击较小的塞尔维亚第纳尔将是更优选择，既能作为连接波德戈里察与贝尔格莱德的塞尔维亚民族统一象征，又具备更强的经济稳定性。"
 MNT_kick_out_austrians:0 "贪婪的狱卒"
 MNT_kick_out_austrians_desc:0 "尽管大多数奥地利商人已自行收拾行囊，仍有部分大型企业不断试探我方底线，企图寻找渗透我国的最佳契机以贯彻哈布斯堡王朝的意志。奥地利企业必须立即收拾行囊撤离黑山——我国已无其容身之地。我们的未来掌握在自己手中，绝非听命于数百公里外日耳曼资本家的恣意妄为。"
 MNT_some_necessity:0 "邪恶必然滋生……"
 MNT_some_necessity_desc:0 "即便奥地利商人已经撤离，但奥地利和匈牙利的核心优势依旧闪耀，甚至在贝兰都能看到其光芒。尽管其影响力有所减弱，但奥地利在黑山的内部运作和局势方面依然有着敏锐的洞察力。鉴于他们对贝尔格莱德的厌恶，显然，贝尔格莱德与波德戈里察之间关系的改善会激怒奥地利，届时我们可能会重回共管状态，而非维持王国体制。奥地利的支持有其益处，我们必须明智地加以利用——若成为皇帝军事改革的牺牲品，那将是一场悲剧。"
 MNT_the_only_impossibility:0 "唯一的不可能之事"
 MNT_the_only_impossibility_desc:0 "世界广袤无垠，地球上有数十个邦国和国家。或许有更多的人会对我们塞尔维亚民族、风景如画的山脉、美食以及渔业感兴趣；但有一个群体永远不会再踏上黑山的土地，他们就是哈布斯堡家族，奥地利的统治者。奥地利已全然容不下任何与黑山相关的事物，而共管制度也绝不再是威胁，相反，它将成为战斗的号角，成为给予未来黑山人的教训。我们的未来在别处，在那黄黑触手无法触及的地方。"
 MNT_export_mineral_stashes:0 "重申波德戈里察-的里雅斯特路线"
 MNT_export_mineral_stashes_desc:0 "在20世纪20年代末奥匈帝国的经济繁荣时期，亚得里亚海充斥着多瑙河船只的标志，其中许多是前往的里雅斯特的黑山船只，或是前往波德戈里察的奥地利船只。我们站在奥特朗托海峡，亚得里亚海的贸易依旧有利可图；即便黑色星期一让许多人遭受经济损失，但我们的船只在的里雅斯特、威尼斯、扎达尔和阜姆等港口仍有一席之地。"
 MNT_fund_new_ventures:0 "迈向繁荣的十年"
 MNT_fund_new_ventures_desc:0 "基础已然奠定，多米诺骨牌已就位；无论黑山未来走向独立，还是继续与塞尔维亚携手共进，它都已为自己在未来赢得了一席之地。黑山历史上曾是贫穷的农业地区，但时移世易，曙光已在远方初现。即便取得了成功，我们也绝不能松懈，就此止步；黑山始终保持警惕，随时应对可能出现的困境，全力捍卫我们历经艰辛所取得的成果。"
 MNT_focus_domestically:0 "与尼克希奇储蓄银行开展合作"
 MNT_focus_domestically_desc:0 "尼克希奇储蓄银行在黑山经济领域占据着举足轻重的地位。该银行资金雄厚，为了国家的美好未来，可与之展开协商，我们深知将资金托付给它十分可靠。"
 MNT_gauge_resource_surplus:0 "评估储备量"
 MNT_gauge_resource_surplus_desc:0 "除农业外，原材料（即铝土矿）的开采占用了我国大量劳动力。为了在黑色星期一裁员后吸纳更多就业，勘探人员已探明了几处此前未知的储量丰富的矿物矿点。将新建或扩建城镇以安置新涌入的工人，就业情况将再次得到改善。我们将充分利用这些矿石资源，一切都将取得成功！"
 MNT_a_new_community:0 "一个全新的社区"
 MNT_a_new_community_desc:0 "过去几年对黑山而言是动荡不安的时期。从共主邦联，到受到严密监视的准卫星国，再到最终成为一个完全独立的主权国家。塞尔维亚“母亲”定会在天堂欣慰地微笑，因为她知道自己的孩子们成功了——而且，正如她所期望的那样，黑山将继续繁荣发展。如今，黑山与塞尔维亚的关系得到巩固，奥地利人也暂时被挡在门外，是时候将我们的注意力转向笼罩在西方的黑暗风暴了。"
 MNT_crnogorska_navy:0 "莫雷和水手们"
 MNT_crnogorska_navy_desc:0 "黑山这国家其实没啥悠久历史，世界大战那会儿基本没啥存在感。真正开始冒头是在共管时期，现在他们的海军跟陆军一样，规模都大得有点夸张。不过咱们已经找到解决办法了，所以整个国家现在还保持着高度军事化状态。海军得抓紧升级换代啦，这些奥地利老古董军舰眼看就要过时咯。"
 MNT_surface_dwellings:0 "水面舰队"
 MNT_surface_dwellings_desc:0 "驱逐舰、巡洋舰、战列舰——这些可是水面舰队的门面担当。这些战舰单打独斗就是活靶子，但凑在一块儿绝对是一股不容小觑的力量。黑山的水面舰队正在酝酿新战术，就是要让海军作战水平再上一个台阶。"
 MNT_submarine_investiture:0 "去亚得里亚海溜达一圈"
 MNT_submarine_investiture_desc:0 "在我们主要关注的是悬挂黑山国旗、略显老旧的奥地利水面舰队之际，还存在第二个可资利用的因素。黑山目前拥有四艘奥地利制造的尖端U型潜艇。这些潜艇主要用于清剿亚得里亚海域偶现的阿尔巴尼亚近海流窜海盗。然而通常情况下，我方的潜艇仅执行巡逻任务——因此必须加强作战训练，确保其具备实战能力。"
 MNT_defend_montenegrin_trade:0 "捍卫黑山贸易"
 MNT_defend_montenegrin_trade_desc:0 "我们虽地处奥特朗托海峡门户，但封锁海峡的主动权并非仅掌握于外人之手——我们同样能够从内部实施封锁，防止地中海的巨大财富资源被他人剥夺。我国水域的完整性必须得到捍卫，海军将成为守护这片海域的坚盾。"
 MNT_adriatic_sea_use:0 "封锁奥特朗托海峡"
 MNT_adriatic_sea_use_desc:0 "在武装冲突情况下，必须对奥特朗托海峡实施封锁。无论舰队规模如何，我军都需以海上力量封锁该海峡，既为自卫亦为攻敌，核心目标是切断敌方运输舰队与军舰的航行通道。我们所部署的U型潜艇将成为暗流中的群鲨，确保该海峡固若金汤——至少击沉十余艘敌舰，方容其失守。"
 MNT_adriatic_warships:0 "巡洋舰中队"
 MNT_adriatic_warships_desc:0 "亚得里亚海是我国至关重要的生命线——倘若失去该海域，我们正在缔造的诸多成就将尽数付诸东流。因此，我国海军必须具备对周边任何威胁作出即时有效反应的能力；巴尔港的失守即意味着我国战略平衡支点的丧失，若无此港，黑山必将倾覆。"
 MNT_admiralty_schooling:0 "普里察海军上将的经验启示"
 MNT_admiralty_schooling_desc:0 "若非德拉古廷·普里察被擢升为我们这支小型舰队的总司令，他本应在很久之前就已退役。由于该职务无需处理过多文书工作，他便继续留任；而今时移世易，普里察再度对退休一事产生疑虑。他必须完成最后的壮举：创办一所海军学校以培养黑山航海人才，他们将引领我国海军迈向未来！"
 MNT_purchase_uboat_models:0 "购买U型潜艇"
 MNT_purchase_uboat_models_desc:0 "我国海军装备的奥地利U型潜艇乃当前军械库中最先进的舰艇。鉴于现有重型舰艇维护成本高昂且实用性有限，将战略重心转向潜艇型号或更具效益。U型潜艇的采购计划即将启动"
 MNT_defense_of_coasts:0 "保卫我们的海岸"
 MNT_defense_of_coasts_desc:0 "倘若一切努力皆付诸东流，我方海军战舰因附着藤壶而葬身海底，我们仍需做最后一搏。我国沿海地区应配备大量掩体和防御工事。陆军将承担起最后防线的重任，综合考量各种可能的情况，只要黑山能够存续，任何结局我们都能接受！\n这并不意味着我们会退缩。即便以三十敌一，我们也绝不放弃！"
 MNT_royal_montenegrin_army:0 "步兵，步兵"
 MNT_royal_montenegrin_army_desc:0 "黑山军队的规模与我国资源水平相比显得过于庞大。然而，得益于通过优惠交易获得的奥地利武器装备储备以及来自伊利里亚切特尼克部队的资深装备，我国并不存在武器短缺问题。但值得警惕的是，当邻国在战火中磨砺刺刀之时，我国却安于和平现状，军队实力可能很快会落后于周边国家。此种局面绝不容许发生！"
 MNT_bolster_the_police:0 "加强警力建设"
 MNT_bolster_the_police_desc:0 "黑山整体局势基本稳定——当然，那些威胁我国政府的游击组织除外。必须组建仅效忠于国家元首的地方警备力量。这些执法人员将确保所有破坏性活动无法在中心城市及黑山全境有任何立足之地。"
 MNT_reorganize_standing_army:0 "重组黑山军队"
 MNT_reorganize_standing_army_desc:0 "自共管状态结束后，黑山军队长期处于停滞状态——既无重大变革，亦无现代化进程，毫无建树——显然，此种状况于当今时代已不可接受。远方地平线上战云密布，诸多军事强国已实现创新突破——当下正是借鉴国外先进经验，加速推进军队现代化建设的关键时刻。"
 MNT_reintroduce_conscription:0 "对切特尼克老兵进行规范化管理"
 MNT_reintroduce_conscription_desc:0 "南斯拉夫起义中的切特尼克老兵现今或以无组织的游击队伍形式存在，或已重新融入社会。部分成员虽谋求更高职位，然其实际价值在于能为我方提供显著助益。鉴于其在与强敌作战方面具备丰富的实战经验，将这批切特尼克人员整编为正规军部队实属必要。尽管非游击作战或许非其专长，但这些切特尼克部队将被赋予更高程度的自主权。"
 MNT_pacify_serbs:0 "平定北方恐怖主义组织"
 MNT_pacify_serbs_desc:0 "我国境内主张塞尔维亚统一的最激进势力盘踞于北部地区。这些藏匿的异见分子多为白党中的极端分子，该派别本身亦谴责此类激进组织的恐怖行径。我们必须与绿派及比白党合作，彻底剿灭这些叛乱分子，以防其全面投靠贝尔格莱德政权。"
 MNT_royal_marines:0 "组建黑山海军陆战队"
 MNT_royal_marines_desc:0 "黑山的海岸是其最宝贵的区域。因此，保卫海岸势在必行，而最好的防御便是有效的进攻。CMK，即黑山海军陆战队，将组建黑山首支正规精英海军陆战队，足以胜任地中海及远洋的各类航行任务。"
 MNT_adopt_standard_motorized:0 "标准化电机"
 MNT_adopt_standard_motorized_desc:0 "黑山的机动车辆是奥地利、伊利里亚、匈牙利、塞尔维亚乃至保加利亚汽车制造商及其发动机的混合体。遗憾的是，这些设备存在兼容性问题——虽然对民用领域影响有限，但对军事用途而言却构成重大挑战。我军所有卡车及各类车辆将配备标准化协议，以确保装备体系更加统一化，减少混杂性。"
 MNT_rangers:0 "森林男儿"
 MNT_rangers_desc:0 "作为一个森林资源丰富的国家，为何我们尚未组建一支护林员营呢？这想必是因为资金短缺。但如今，我们有了充足的盈余资金——我们将让士兵们全面接受森林作战训练，包括各种丛林战斗技巧以及穿越丛林的技能。"
 MNT_standard_weapons:0 "申请奥地利武器装备"
 MNT_standard_weapons_desc:0 "在过去几十年里，奥地利兵工厂一直是黑山大部分武器的供应方。目前，我们手中仍有相当数量的奥地利武器装备。我们将拆解这些步枪，对其进行研究，并通过逆向工程来打造我们自己的标准武器。"
 MNT_armor_works:0 "装甲行动"
 MNT_armor_works_desc:0 "坦克与黑山，这听起来有些违背常理——那里地形崎岖、环境恶劣，还有茂密的树林。然而，自第一次世界大战时期那些笨拙的坦克出现以来，装甲技术不断发展。许多人预测，坦克可能会成为胜负的决定性因素。黑山将利用现有资源组建其首批坦克团，这些坦克团将在未来的军事行动中发挥重要作用。"
 MNT_element_of_surprise:0 "出其不意的优势"
 MNT_element_of_surprise_desc:0 "鉴于我方势单力薄，难以抵御任何大国的入侵。我们将与大自然缔结契约：以群山为屏障，以树木为瞭望塔。出奇制胜是我们对抗强敌的最大法宝。"
 MNT_element_of_strength:0 "强大的经济"
 MNT_element_of_strength_desc:0 "震慑与敬畏——这无疑是夺取胜利的最大法宝。通过突然对敌人形成压倒性优势，打破他们对弱小的黑山军队的轻视预期，我们能够更快地瓦解敌人的士气，迫使他们比以往任何时候都更快地举起白旗。"
 MNT_modern_solutions:0 "现代的解决方式"
 MNT_modern_solutions_desc:0 "我们的军队现代化计划仍在持续推进，但目前我们需要相应的基础设施来确保这一切得以实现，包括军官配备、道路建设等。\n我们将对指挥官进行训练，任命下属官员，进一步巩固部队实力，并制定后备力量或后备计划。倘若黑山遭遇攻击，我们将全方位、时刻做好应战准备！"
 MNT_crnogorska_airforce:0 "愿强劲的翅膀展翅高飞！"
 MNT_crnogorska_airforce_desc:0 "黑山目前没有正式的空军——是时候改变这一现状了！即将组建的空军与防空部队将拥有高度自主性，独立于海军和陆军——其中一个关键要素是能够提前察觉攻击。陆军的行动速度远不及我们的战机，因此自主性是一种保障。"
 MNT_support_our_army:0 "地面支援"
 MNT_support_our_army_desc:0 "俯冲轰炸机及其他形式的近距离空中支援，早在南斯拉夫起义期间，切特尼克武装就曾使用缴获的奥地利轰炸机实施过此类行动，如今有必要再次发挥其作用。起义结束后，我们缴获的战机已归还奥地利，因此黑山如今已没有空军。除了战斗机部队之外，近距离空中支援将是第二重要的力量！"
 MNT_coastal_patrol_airforce:0 "海上飞机"
 MNT_coastal_patrol_airforce_desc:0 "鉴于我国海军实力逊于周边诸多强国，我们在海上需要额外增强战力，而鱼雷轰炸机将助我们达成这一目标！由于我们能够使用甘茨-多瑙河地区的设施，并且拥有一批过时的白头鱼雷库存，获取此类弹药不成问题。我方飞机将率先出击，奇袭敌军，随后海军将予以致命一击！"
 MNT_lease_of_fighters:0 "战斗机租赁"
 MNT_lease_of_fighters_desc:0 "我们在全球范围内拥有采购飞机的渠道。无论是塞尔维亚、奥地利还是保加利亚，黑山自有其特殊途径——通过适当的沟通技巧与资金激励，我们将能确保为空军获取一百五十架战斗机，此乃优先考量。"
 MNT_cas_doctrine:0 "空中支援任务"
 MNT_cas_doctrine_desc:0 "当前我们对近距空中支援的理解仅停留在为陆军提供全面支援的笼统概念层面。具体应当如何实施？何时实施？为何实施？我们尚存诸多亟待厘清的问题，且尚未建立系统化的理论框架——外国军官将获得丰厚报酬，用以指导我国雏形空军飞行员掌握轰炸任务的复杂战术要领。"
 MNT_defend_our_skies:0 "夺取制空"
 MNT_defend_our_skies_desc:0 "即便有最强大的雄鹰守护天际，鹰隼仍可能不时出没——有时仍需依靠地面的步枪火力。防空炮阵位在我国境内具有诸多战略优势区位。只需稍加伪装，敌机几乎不可能对我方实施骚扰；即便领土遭到入侵，敌军仍需耗费大量时间方能推进至我方核心区域！"
 MNT_nav_doctrine:0 "海军应急部队"
 MNT_nav_doctrine_desc:0 "若敌军逼近，指挥体系必须迅速整备 —— 应派遣海军还是空军迎敌？我们是等待进一步指令，还是在赶赴前线途中制定作战计划？密码必须加密规整，指令必须熟记于心：奥匈帝国军队的实战已证明，战场上最大的致败因素，莫过于沟通不畅…… 以及指挥失当。"
 MNT_wings_of_montenegro: "钢铁之翼"
 MNT_wings_of_montenegro_desc:0 "空军仅用数月时间便已完全组建完毕 —— 成绩斐然。尽管如此，与那些资源更充沛的国家相比，我们仍处于明显劣势；但凭借些许灵活治理，至少在空战对决中，我们或许能与邻国不相上下。"
 MNT_foreign_policy:0 "重申外交政策"
 MNT_foreign_policy_desc:0 "如今我们已重振旗鼓，不妨稍作停留，明确未来的对外发展方向。我们应与奥地利保持紧密同盟吗？又该如何看待俄罗斯 —— 那些最英勇的斯拉夫战士，所有斯拉夫人的霸主？我们远隔重洋的老朋友，又该置于何种位置？或是我们应坚定地与塞尔维亚站在一起？还是…… 或许不与任何一方结盟？"
 MNT_the_belgrade_pact:0 "与贝尔格莱德的纽带"
 MNT_the_belgrade_pact_desc:0 "塞尔维亚的历史即黑山的历史，反之亦然。如今，是时候将这些散落的历史丝线编织成一条华美的纽带，让我们的命运紧密相连、携手共进。我们是血脉相连的兄弟，是文书盟约中的兄弟，更是并肩作战的兄弟。为了塞尔维亚民族！"
 MNT_viennese_dealings:0 "与德国的联系"
 MNT_viennese_dealings_desc:0 "目前，我们最好与德国保持紧密合作。作为巴尔干及更广阔地区无可否认的主导力量，与其为敌，不如结为盟友，这带来的益处将远超预期。我们将派遣使者，向他们传递深化双边关系的意愿 —— 愿这种友好关系能够长久保持！"
 MNT_old_link:0 "劝说昔日合作伙伴"
 MNT_old_link_desc:0 "第一次世界大战期间，黑山曾与协约国并肩作战 —— 彼时我们与塞尔维亚、希腊、罗马尼亚同为协约国阵营，却最终一同战败。战败后，我们被奥匈帝国吞并，沦为其为数不多的战利品之一。但如今，协约国已重新整军备战，全球格局下各方的战略重心也已改变，这一次，历史的叙事必将改写。"
 MNT_neutrality_focus:0 "黑山的中立性问题"
 MNT_neutrality_focus_desc:0 "就让我们坚守自己的山川海岸，不受外来势力的干涉。我们没有什么可以给予他们，他们也没有什么能给予我们；只要我们不被打扰，我们也不会去打扰任何人。置身于大国势力范围之外，或许能让我们免遭又一场灾难性的失败。"
 MNT_slavic_hegemon:0 "与斯拉夫霸主结盟"
 MNT_slavic_hegemon_desc:0 "俄罗斯向来是斯拉夫民族的领袖 —— 始终手持剑、盾与步枪奋勇战斗。如此看来，我们加入斯拉夫骑兵的冲锋行列，便是理所当然之事。孤军奋战，我们势单力薄；但团结一心，我们便会坚不可摧，足以战胜任何敌人！"
 MNT_suck_serb_cock:0 "团结我们的兄弟"
 MNT_suck_serb_cock_desc:0 "黑山的历史早已与兄弟族群的历史交织共生。时至今日，我们之间的联结已不可避免 —— 黑山终将完成那些数十载、数百年乃至数千年前便该实现的使命。南斯拉夫人定将走向繁荣，而团结一心的我们，必将比单打独斗时更加强大。"
 MNT_greater_montenegro:0 "“大黑山” 构想？"
 MNT_greater_montenegro_desc:0 "近来，在普拉瓦希派的推动下，黑山民族主义正缓慢却稳步地兴起。黑山民族主义者主张整合所有历史上被视为黑山领土的区域 —— 从古老的阿尔迪亚伊部落领地，到泽塔、杜克里亚，甚至包括久远的普拉埃瓦利塔纳地区。这些领土诉求必将得到巩固，我们也必将收复它们，这是理所当然的！"
 MNT_dukljan_question:0 "解答我们的核心问题"
 MNT_dukljan_question_desc:0 "黑山的实力如今已达到前所未有的高度。尽管我们完全可以维持现状，但有部分势力支持黑山进行激进的领土扩张。最终我们该作何选择？又该如何实现这一目标？我们是否真的要主动夺取更多领土？"
 MNT_annex_albania:0 "使阿尔巴尼亚自治"
 MNT_annex_albania_desc:0 "身处各大势力剑拔弩张的包围之中，阿尔巴尼亚无意卷入他国的政治纷争。我们也不例外 —— 阿尔巴尼亚绝不会愿意加入我们这个‘迪奥克莱安式国家’。不过，阿尔巴尼亚的实力与我们大致相当，将其纳入版图，会成为检验我们军队战力、夯实‘迪奥克莱安摩天大楼’根基的关键试金石。"
 MNT_secure_allied_support:0 "保障协约国物资运输安全"
 MNT_secure_allied_support_desc:0 "显而易见，仅靠我们现有的物资，无法独自实现既定使命。我们必须与其他势力谈判，采购大量步枪、各类装备，甚至可能需要雇佣雇佣兵。若我们毫无准备便贸然开战，必将无法应对那无可避免的结局 —— 战败！"
 MNT_annex_serbia:0 "整合塞尔维亚"
 MNT_annex_serbia_desc:0 "塞尔维亚人坚信迪奥克莱蒂安主义纯属恺撒的谎言，显然会拒绝加入我国——因此必须通过武力手段使其信服。塞尔维亚必须领悟迪奥克莱蒂安理念之真谛。我军将跨过边境直取贝尔格莱德，传递这样的福音：一个强大的巴尔干联盟必将捍卫和平与稳定！"
 MNT_law_reform:0 "立法机构联合草案"
 MNT_law_reform_desc:0 "我们存在一个关键疏漏——我们的联邦尚未制定任何涉及维护国家统一的法律。我们不愿重蹈奥地利的覆辙，因此必须迅速采取行动！必须立即起草并签署新的法律、法规等文件，以保障现今将我国视为家园的新少数民族与族群的权益完整性。"
 MNT_dioclea_question:0 "迪奥克莱安之问"
 MNT_dioclea_question_desc:0 "“迪奥克莱安问题” 或许是近期政坛中最奇特的构想之一，它由皇帝卡尔一世在世界大战期间首次提出。这一计划极不符合常理，主张将塞尔维亚、黑山和阿尔巴尼亚联合成一个国家。人们还提出了许多其他名称，比如 “杜克利亚”，以纪念古老的国家，或者 “阿尔迪亚”，以缅怀该地区昔日强悍的部落。"
 MNT_yugoslav_question:0 "使南斯拉夫主义死灰复燃"
 MNT_yugoslav_question_desc:0 "南斯拉夫主义仍深陷伊利里亚主义的阴影之下。一战期间，南斯拉夫问题本已几近成为现实，却随着塞尔维亚的战败而夭折，最终在 1933 年伊利里亚宣告成立后彻底沦为泡影。\n然而，它尚未完全消亡 —— 时至今日，仍有相当数量的塞尔维亚人与黑山人坚信这一理念，并渴望向保加利亚复仇。黑山士兵必将扛起南斯拉夫的旗帜，最终让这一理想成为现实！"
 MNT_falsify_illyrianism:0 "揭穿伊利里亚主义的虚伪"
 MNT_falsify_illyrianism_desc:0 "所谓伊利里亚国家，不过是伊利里亚理念的具象化产物，它宣称是南斯拉夫人的联合体，以和谐为基石、以共同文化为纽带。但伊利里亚主义的核心本质是谎言，它不过是克罗地亚人用来凌驾于波斯尼亚人、塞尔维亚人、斯洛文尼亚人及其他族群之上，攫取超额权力的工具而已，绝非其他！我们必将把这些族群从克罗地亚人的铁蹄下解放出来，让南斯拉夫主义回归到它本该扎根的每一片土地！"
 MNT_destroy_the_imro:0 "削弱马其顿内部革命组织的影响力"
 MNT_destroy_the_imro_desc:0 "保加利亚和土耳其势力长期以来都是塞尔维亚人的仇敌。他们甘愿听信德意志人的花言巧语，背叛自己的斯拉夫兄弟，如今早已腐朽透顶。保加利亚必须被彻底打垮，其民众也应得到解放！马其顿地区与那些被压迫的塞尔维亚故土，必须被正义地收复 —— 沙皇的恶行每多存续一刻，就会在这片沃土上扎根更深一分，斯拉夫民族的未来也将愈发黑暗！"
 MNT_blazo_joganovic_putsch:0 "布拉若·约万诺维奇政变"
 MNT_blazo_joganovic_putsch_desc:0 "在针对黑山工人阶层的不公待遇日益加剧、关乎国家美好未来的诉求屡屡受挫之际，红党终于夺取了国家政权。黑山左翼阵营的核心领袖 —— 布拉若·约万诺维奇、萨瓦·科瓦切维奇与尼古拉·科瓦切维奇共同承诺，将为黑山打造一个美好未来，即便佩特罗维奇-涅戈什王朝的任何一位君主，在最天马行空的想象中都无法企及这样的未来。"
 MNT_allies_across:0 "多方盟友"
 MNT_allies_across_desc:0 "新政府面临的一大重大挫折，是我国与潜在友好国家几乎完全隔绝。如今，我们最亲近的盟友要么远隔重洋，更糟的是，有些甚至远在整个地中海的另一端。相较于如今充满敌意的邻国，我国不仅国土面积狭小，盟友又地处偏远，因此我们必须与第三国际建立同盟关系。"
 MNT_stop_the_downturn:0 "融入第三国际"
 MNT_stop_the_downturn_desc:0 "没有经济支撑的同盟又有何意义？我国将把经济融入更广阔的第三国际体系，以弥补奥塞贸易中断带来的损失。届时，法英商人将以我们所需的规模传播革命理念，而我们自己的经济天平 —— 自然会被充足的资金压得稳稳当当。"
 MNT_hire_franco_british_officers:0 "法英黑山顾问团"
 MNT_hire_franco_british_officers_desc:0 "我们需要新的作战经验和指挥才能；法国和英国将非常愿意为我们提供协助。借助更广阔的地中海通道，我们能够获得空军、海军和陆军的支援，以及工程技术指导等。我们初出茅庐的游击部队必须成功实现正规化，并按照如今人员有所减少的黑山军队的模式进行训练。"
 MNT_bulwark_against_austria:0 "抵御奥地利的屏障"
 MNT_bulwark_against_austria_desc:0 "曾经是我们挚友所在之处，如今却成了我们恐惧之源。然而，我们不会因恐惧而颤抖；我们犹如黑猫，弓起脊背，发出响亮的嘶鸣声。面对危险，工人绝不会踟蹰不前。在暴虐的奥地利贪婪之徒妄图用克朗腐蚀我们的地方，火炬与锤子早已备好“疫苗”：革命！奥地利永远无法让我们屈服，因为必将是它向我们低头！"
 MNT_take_the_reins:0 "掌控主动权"
 MNT_take_the_reins_desc:0 "政变爆发后，我国局势陷入严重混乱。许多职位仍被绿派-白党的叛乱分子占据 —— 他们如今已是国家公敌；此外，还有更多绿党与白党成员潜藏起来，伺机推翻我们的统治。"
 MNT_montenegrin_peoples_army:0 "任命萨瓦·科瓦切维奇"
 MNT_montenegrin_peoples_army_desc:0 "安吉出生于哥伦比亚波哥大并在当地长大，自幼便在绘制纸板箱的过程中展现艺术天赋。其祖父作为黑山游击队老兵曾参与南斯拉夫起义，组织过努多镇暴动，毅然放弃宁静的农耕生活投身战斗，并迅速脱颖而出成为该地区游击队领袖。后获任命担任指挥要职，协助遴选军队司令部的新成员。"
 MNT_exile_the_purples:0 "驱逐绿党分子"
 MNT_exile_the_purples_desc:0 "安吉出生于哥伦比亚波哥大并在当地长大，自幼便习惯在每一个纸箱上逐一作画。这些绿派成员具有强烈的反工团主义倾向和虔诚的基督教信仰，秉持激进的独立立场，认为黑山人是世界上最优秀的民族。尽管这种观点符合事实，但其本质具有与生俱来的危险性——必须立即铲除这些分子，连同棘手的白党一并清除。"
 MNT_dismantle_discriminatory_policy:0 "废除歧视性法律"
 MNT_dismantle_discriminatory_policy_desc:0 "安吉出生于哥伦比亚波哥大并在当地长大，自幼便展现出绘画天赋，常在各类纸箱上作画。黑山公民理应在该国享有完整权利——此乃应有之义。我们必须谨慎前行，以免触及反叛传统主义的地雷。"
 MNT_in_defense_of_the_republic:0 "为人民辩护"
 MNT_in_defense_of_the_republic_desc:0 "鉴于我国奉行工团主义，与巴尔干地区相对隔绝，我国将启动一项民兵计划。民兵将协助开展各类防御工作，无论是对内防御还是对外防御——我国局势必须保持稳定。必须镇压懒惰的煽动者，巩固工人阶级的统治。"
 MNT_new_montenegrin_syndicalism:0 "邦联式独立联盟"
 MNT_new_montenegrin_syndicalism_desc:0 "在黑山，工会是一个相对鲜为人知的组织。然而，我们有更明智的做法——借鉴英国和法国的经验，工会应按照联盟制来组建，如此一来，各工会的宗旨便不会相互重叠。即成立一个大型的联合工会，每个职业和工作领域各设一个。"
 MNT_destroy_royal_loyalists:0 "处决已定罪的保皇党人"
 MNT_destroy_royal_loyalists_desc:0 "还有什么比擒获叛徒更令人解气？当然是将其击毙！在过去几个月里，\n我们已擒获了多名重要的抵抗组织成员。如今的问题是：是将他们处决，还是将其关押，亦或是“劝降”？若处决过多，我们可能会错失某些他们掌握的专业技能；若处决过少，他们可能会找到我们体系中的漏洞并给予致命一击。我们必须对每个人都审慎抉择……"
 MNT_peoples_defense_assembly:0 "延长人民防卫大会的会期"
 MNT_peoples_defense_assembly_desc:0 "在约万诺维奇发动政变后形成的议会制政府，如今是时候将其作为布拉日约万诺维奇的独裁统治予以废除了。它将保留革命期间确立的民主职能，但不再有众多不同观点的无谓争吵。"
 MNT_western_republic:0 "推行西方工团主义"
 MNT_western_republic_desc:0 "英国和法国，作为第三国际的发源地和工团主义的摇篮，无疑对小小的黑山产生了深远影响。他们的制度将被应用于我国政府，使黑山在效率方面与同时代国家并驾齐驱——国际社会将实现全面团结！"
 MNT_revolutionary_guard:0 "扩充革命卫队"
 MNT_revolutionary_guard_desc:0 "卫队是曾协助同时攻占采蒂涅和波德戈里察的叛乱武装。如今，他们的使命将再次转变——成为一支依靠谍报能力和强大武力组建的内部防御力量。然而，卫队人数较少，必须扩充队伍并征召新兵，以便将我们的铁腕控制升级为钢铁般的扼制之势。"
 MNT_montenegrin_mountain_roads:0 "穿越迪纳拉山脉开辟通道"
 MNT_montenegrin_mountain_roads_desc:0 "我国大部分地区为乡村森林、山脉、河流和小村庄所覆盖。为了更便捷地将政府的意愿传达至黑山全国各地，并推动商业和社会事业发展，将在构成黑山地貌的丘陵和山脉之间及周边铺设新的道路。桥梁、隧道、铁路——基础设施建设规划将全面涵盖这些项目。"
 MNT_civilian_shift:0 "尼古拉·科瓦切维奇的社会主义共和国"
 MNT_civilian_shift_desc:0 "是时候让布拉佐·约万诺维奇卸任了。他在黑山革命中已尽到自己的职责，而且作为一名游击队员，他作为军事指挥官的能力远胜于从政能力。国家元首这一角色应转由尼古拉·科瓦切维奇担任，他将被尊奉为黑山社会主义共和国的首任总统。"
 MNT_nationalist:0 "黑山民族主义的黎明"
 MNT_nationalist_desc:0 "长期以来，黑山一直被错误地视为塞尔维亚的一个邦国，这简直荒谬至极！黑山过去是、现在是，将来也永远是一个独立的国家——塞库拉·德里耶维奇和萨维奇·马尔科维奇·什泰迪姆利亚将在此刻证实这一事实。从现在起，历史将从黑山人的视角重新书写。"
 MNT_deny_serbization:0 "逆转塞尔维亚化"
 MNT_deny_serbization_desc:0 "可以说，将黑山视为一个由塞尔维亚人居住的国家这一认知是对国家统一最大的危害之一，必须立即从黑山的历史叙事中剔除。人民党及白党的势力应被斩草除根，让叛徒没有容身之地，只有死亡的归宿！"
 MNT_dinaric_heritage:0 "迪纳里克遗产"
 MNT_dinaric_heritage_desc:0 "事实上，黑山人民一直以来都具有迪纳拉人的特质。他们源自迪纳拉阿尔卑斯山脉，理应撰写颂歌来赞美那些数十年来一直将这些雄伟山脉视为家园的人们，因为正是他们缔造了黑山。愿彼得罗维奇-涅戈什家族荣耀长存，愿黑山和伟大的洛夫琴山荣耀永驻。"
 MNT_restore_red_croatia:0 "复兴红色克罗地亚的领域"
 MNT_restore_red_croatia_desc:0 "这些迪纳拉人来自西方；杜克利耶牧师编年史将为我们揭示这一真相。黑山人的起源并非塞尔维亚人，而是来自此地、来自整个达尔马提亚的克罗地亚人。黑山人应明辨是非，我们从未沾染那邪恶之毒；无论他人作何想法，我们都是红克罗地亚王国的黑山人。"
 MNT_serbo_cincar_devil:0 "驱除塞尔维亚-辛加尔的恶魔"
 MNT_serbo_cincar_devil_desc:0 "仍有一些人对我们进行诋毁，谴责黑山正在开展的光荣文化革命。这些长期与黑山人为敌的塞尔维亚-辛卡尔人，必须尽快从我们的国家被驱逐出去！黑山容不下这类谎言及其突厥式的弦外之音；这里只属于黑山及其黑山人民！"
 MNT_ancestral_brotherhood:0 "祖源兄弟情"
 MNT_ancestral_brotherhood_desc:0 "在上帝的护佑下，我们本为一体。黑山人及其并肩作战的盟友们，将见证他们国家取得成功，崛起至巴尔干地区前所未有的新高度。所有迪纳拉人都将在黑山国家的旗帜下团结奋进。"
 MNT_found_the_doclean_academies:0 "创办多克莱安学院"
 MNT_found_the_doclean_academies_desc:0 "为向民众普及科学与艺术 —— 这两大未来至关重要的教育核心领域，我们将为新建学校提供资金支持。追溯我们作为杜克里亚的历史渊源，杜克里亚科学艺术学院将在黑山境内开展广泛的高等教育工作。"
 MNT_montenegrinist_orthodoxy:0 "黑山东正教"
 MNT_montenegrinist_orthodoxy_desc:0 "当人们比较东正教各教会时，许多人认为塞尔维亚教会和黑山教会并无二致，这种观点是错误的。基于德里耶维奇所披露的信息，黑山教会带有一种鲜明且显著的民族例外主义色彩。秉承乌斯塔沙运动的理念，黑山宗教将实现虔诚的复兴和精神的重生。"
 MNT_montenegrin_marxist_stitching:0 "马克思主义式的整合"
 MNT_montenegrin_marxist_stitching_desc:0 "尽管德尔列维奇因与伊利里亚乌斯塔沙组织的种种行径而闻名，但什泰迪姆利亚的政治观点却更加令人费解。他注意到，为了维护新的现状，应当在国家层面融入一条马克思主义思想的脉络。其核心要义不过是让黑山人民在工作和生活中都能过上更美好的日子。"
 MNT_purified_danubian_federalism:0 "推行纯净的的多瑙河联邦制"
 MNT_purified_danubian_federalism_desc:0 "当奥地利企图将我们置于其统治之下，这种情况绝不可能发生时，他们倒是给了我们一个不错的主意。多瑙河联邦制是一种针对多民族国家的联邦制，特别注重共同的自由、高度的自治以及强有力的秩序。然而，如果将这一制度生硬地套用到黑山，会存在一些缺陷。相反，为了缓和我们各民族之间的紧张关系，我们将为我国人民以及那些早已过时的政府机构实施一种独具黑山特色的联邦制。"
 MNT_armanist_exceptionalism:0 "亚美尼亚民族优越论"
 MNT_armanist_exceptionalism_desc:0 "来自奥地利边境的又一首赞歌；兰茨·冯·利本费尔斯及其雅利安主义运动俘获了全球爱国者的思想与心灵。我们也并未对他的言辞征讨视而不见，他的话语也经历了迪纳拉式的洗礼，这正是其迫切所需；黑山将重拾往昔的刀剑与长矛，并借此凝聚成比以往任何时候都更为强大的力量。凭借非凡的力量和对洛夫琴山永恒的忠诚，岁月将悄然流逝——黑山永远不会动摇。"
 MNT_holy_glory:0 "神圣战士的荣耀"
 MNT_holy_glory_desc:0 "在战斗中表现虔诚被视为一种禁忌行为；当枪口抵在你面前时，为何还要祈祷呢？你应当为黑山祈祷。从本质上讲，黑山的士兵并不需要宗教信仰，但当他们迈向胜利时，圣洁与荣耀将弥漫于空气中。史诗将被传颂，圣徒将庇佑他们所到之处。尽管会有大量的死亡与破坏，但这一切都是为了黑山。"
 MNT_coastal_industrialization:0 "萨格勒布南部"
 MNT_coastal_industrialization_desc:0 "黑山共管政权倒台后，国家迅速实现工业化，这一幕让众多饱受苦难的巴尔干民众为之振奋。如今，随着更多正面声量的传播，波德戈里察正赢得 “第二个萨格勒布” 的美誉 —— 得名于其浓郁的文化氛围与精美的建筑风貌。这份成就的取得，要归功于历代伟大的黑山英雄：米哈伊尔亲王、拉扎尔·米尤什科维奇，以及每一位为我们的自由而战的切特尼克战士。"
 MNT_montenegro_of_montenegrins:0 "一个纯净且虔诚的黑山"
 MNT_montenegro_of_montenegrins_desc:0 "文宣运动已落下帷幕 —— 黑山已为可能遭遇的任何风暴筑牢了坚实根基。实体与法律层面的基础设施均已完备，新机构正式成立运作，我们的文化也得到了周边国家的认可与赞誉。我们从一个相对贫困的地区，崛起为巴尔干地区正义的典范，且这一地位将始终稳固。"
 MNT_serb_king:0 "遥远之地"
 MNT_serb_king_desc:0 "塞尔维亚人终于重返故土。经历了从贝尔格莱德到采蒂涅的艰辛旅程，亚历山大二世·卡拉乔尔杰维奇回到了理应属于塞尔维亚人的王座之上。塞尔维亚重焕荣光的时刻即将到来；我们从未被击败，也永远不会被击败。"
 MNT_destroy_montenegrin_nationalism:0 "铲除黑山斯拉夫绿党"
 MNT_destroy_montenegrin_nationalism_desc:0 "普拉瓦希派、他们那帮绿党 “土耳其兽人”，以及黑山斯拉夫地区滋生的腐朽势力，一直是塞尔维亚爱国者眼中的眼中钉 —— 如今，这些势力都将从我们的纪念碑前被清除。要建立一个真正的塞尔维亚国家，就必须彻底清除这股叛徒般无耻之徒的所有残余。"
 MNT_court_cultured_serbs:0 "塞尔维亚文化精英群体"
 MNT_court_cultured_serbs_desc:0 "就像在贝尔格莱德的王国那样，亚历山大二世向来有任命文化人士进入政府的倾向。科学家、艺术家、著名音乐家 —— 所有人都可前往王宫，为塞尔维亚辉煌复兴的氛围注入活力。我们在此也将效仿此举 —— 寻找内心真诚且满怀热忱的黑山塞尔维亚人。因为文化是国家最坚实的根基，没有文化，我们便一无所有。"
 MNT_welcome_karadordevic_loyalists:0 "欢迎卡拉乔尔杰维奇王朝的效忠者们"
 MNT_welcome_karadordevic_loyalists_desc:0 "来自北方覆灭王国的更多难民，已听闻波德戈里察发生重大政权更迭的消息。他们正成群结队赶来，局势渐渐有了难民危机的苗头 —— 但这无关紧要。他们只需手持步枪，在山中搭起帐篷；我们将一同等待辉煌的塞尔维亚帝国即将到来的复兴。"
 MNT_enemies_on_all_sides:0 "四面受敌"
 MNT_enemies_on_all_sides_desc:0 "由于我们的国王因参与世界大战、南斯拉夫起义以及近期的第四次巴尔干战争而遭到憎恶，亚历山大二世必须谨慎行事 —— 前路之上，不会只有肆意闯入的鹿群；通往荣耀的道路两侧，可怕的黑狼正潜伏在灌木丛中。我们必须做好准备、无所畏惧；那些盘踞在本国专制王座上的卑劣恶狼，在千里之外就能嗅到鲜血与恐惧的气息。"
 MNT_absolutist_reclamation:0 "绝对主义框架下的领土收复"
 MNT_absolutist_reclamation_desc:0 "在我们伟大的塞尔维亚境内，黑山式的宪政民主至今仍被维系着；但这种情况不会再持续下去了。我们越是在毫无意义的事务和民众琐碎的小事上争论不休，我们的敌人就会变得越强大。王室独裁统治即将推行，塞尔维亚将由国王 —— 且只由国王一人领导。秩序将推动我们前进，防止我们误入歧途，而这一切都将由这位 “钢铁国王” 的铁腕来强制执行。"
 MNT_hands_of_serbdom:0 "舒展塞尔维亚民族的拳脚"
 MNT_hands_of_serbdom_desc:0 "随着塞尔维亚难民的到来，许多人双手背在身后 —— 或许是黑色的手，或许是白色的手，又或者…… 两者皆有。简而言之，作为塞尔维亚政治工具的黑手会与白手会，都已抵达黑山。当黑手会在不断策划针对重要目标的自杀式袭击时，白手会则在保护国王免受这些新难民中不安分分子的威胁。如今，我们大可以让他们握紧拳头，向四面八方的敌人发起猛攻。"
 MNT_fund_NLM:0 "为久尔杰·奇尔诺耶维奇图书馆提供资助"
 MNT_fund_NLM_desc:0 "这座公共图书馆由黑山亲王于 1893 年建立，旨在纪念奇尔诺耶维奇印刷厂成立 400 周年。作为黑山规模最大、地位最高的图书馆，它自然是东南欧教育领域里一座象征求知与启蒙的灯塔。我们将为其注入新的资金，并引导馆方将重心投向塞尔维亚历史的各个领域。"
 MNT_dispose_of_petrovic_njegos:0 "联合奥布雷诺维奇家族与佩特罗维奇-涅戈什家族"
 MNT_dispose_of_petrovic_njegos_desc:0 "卡拉乔尔杰维奇家族之前的塞尔维亚统治者 —— 奥布雷诺维奇家族，曾被黑手会逼入绝境。佩特罗维奇-涅戈什家族也将落得同样下场，而这一次，局势的走向将再次对我们有利。将黑山重新巩固为塞尔维亚领土的最后一道障碍即将被清除，没有了亲王，绿党必将土崩瓦解。"
 MNT_alexanders_identity:0 "亚历山大的身份认同"
 MNT_alexanders_identity_desc:0 "如今塞尔维亚人的身份认同，建立在我们国王亚历山大二世的理念之上：虔诚、坚定、不妥协且勤勉。凭借由文化精英内阁搭建的基础设施，以及亚历山大推行的 “塞尔维亚化” 改革，塞尔维亚社会将被重塑为足以匹配王室荣光的形态。"
 MNT_develop_northern_agriculture:0 "振兴北方农业"
 MNT_develop_northern_agriculture_desc:0 "我们此前遭遇的难民危机，已导致年度饲料储备量大幅锐减。通过宣传引导，并针对我国北部颁布相关法令，我们完全能够填补这一缺口。此外，沿海地区的柑橘与橄榄种植园也将获得资金支持。"
 MNT_the_reclamation:0 "驱逐保加利亚人"
 MNT_the_reclamation_desc:0 "时机已近 —— 贝尔格莱德将再度在卡拉乔尔杰维奇家族的旗帜下进军。我们终将重返故土，更进一步，还要让索非亚蒙受屈辱；他们的宿敌已杀回家门口，且比以往任何时候都更具胜势。保加利亚-土耳其霸权，终将被打入地狱最深处 —— 这本就是它应有的下场。"
 MNT_link_with_chetniks:0 "掌控切特尼克指挥官"
 MNT_link_with_chetniks_desc:0 "一些塞尔维亚籍及塞尔维亚-黑山籍的切特尼克成员目前处于无序作战状态，他们以小规模部队形式独立行动。若我们能联络上这些军官 —— 同时联合塞尔维亚籍切特尼克成员 —— 便能为我们的武装力量注入大量经验丰富的战力，其中还包括曾参与第四次巴尔干战争的指挥官。显然，我们对保加利亚暴君的作战经验越丰富，准备就越充分。"
 MNT_god_is_a_serb:0 "南斯拉夫至上主义"
 MNT_god_is_a_serb_desc:0 "黑山人在此孕育了一种怪异、扭曲的泛斯拉夫主义，而这一切的始作俑者正是维也纳的恐怖势力。我们从未听说过什么迪奥克莱亚、杜克里亚—— 世上只存在塞尔维亚与南斯拉夫。我们始终坚守着自己的泛斯拉夫理念，如今，这些理念终于要开花结果了。上帝是塞尔维亚人，当祂的子民以祂之名拿起十字架与步枪时，祂正俯瞰着他们，面露微笑。"
 MNT_promote_united_serb_youth:0 "推动塞尔维亚青年联合"
