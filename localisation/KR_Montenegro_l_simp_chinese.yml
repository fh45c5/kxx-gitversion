 mntflavor.18.t:0 "圣诞树法案"
 mntflavor.18.d:0 "黑山的政治局势向来变幻无常，其三大主要势力均以颜色命名，即白色、绿色与红色。因此，黑山及其政治格局常被戏称为“圣诞树”，三大势力间的互动也被如此调侃。但白党、绿派与红切特尼克派究竟是什么组织？它们对我国又有着怎样的重要意义？\n\n作为最具影响力的两大势力，白党与绿派分别与克鲁巴希派和真人民党渊源深厚。这两大派系的起源可追溯至南斯拉夫起义时期 ——当时在切特尼克控制的波德戈里察，各方曾召开一场临时集会，试图推动黑山这个短暂独立的国家与塞尔维亚合并。会上发放的选票分别印在绿色与白色纸上：白色选票面向支持与塞尔维亚合并的成员，绿色选票则面向支持黑山独立的阵营。最终，支持独立的绿派不仅在投票中胜出，而且塞尔维亚本身从一开始就完全不愿接受此次合并。\n\n当《尼克希奇条约》签订后，黑山重获独立地位，真人民党与克鲁巴希派也随之回归，绿派与白党则迅速沦为边缘势力。不过，由于切特尼克成员在两派队伍中占据重要地位，绿派与白党逐渐被视为这两大政党的“武装分队”。如果说真人民党与克鲁巴希派通过演讲辩论和多数决的方式争夺政治权力，那么绿派与白党则是为实现自身信念而采取 “铁血手段” 的工具。相较于白党，绿派的实力更为强劲——它得到了黑山军队中主要军方官员的支持，其中最知名的便是克尔斯托·波波维奇。而白党的主要优势在于对北部迪纳拉山脉地形的熟悉掌控，该地区也是支持与塞尔维亚合并呼声最高的地方。\n\n总而言之，这两个最初因临时事件诞生的派系，最终成为了理念相近的两大政党的武装工具。"
 mntflavor.18.a:0 "我们的黑山永存！ "
 mntflavor.18.b:0 "好吧，但红切特尼克怎么办呢？"
 mntflavor.19.t:0 "装饰之物"
 mntflavor.19.d:0 "红切特尼克派是黑山社会中一个规模较小但正逐渐崛起的派系。在布拉佐·约万诺维奇的领导下，该派系在黑山青年群体中颇具吸引力，若任其发展而不加约束，十年后的黑山可能面临发生社会主义革命的严重风险。不过就当下而言，局势尚未发展到这一步。\n\n与白党和绿派不同，红切特尼克派的名称并非源于选票颜色，而是单纯对应前两派的 “白” 与 “绿”，补全了 “白、绿、红”这一颜色体系。在南斯拉夫起义及随后黑山共管政权终结的过程中，红切特尼克派的作用微乎其微：约万诺维奇既不认同绿派，也不支持白党的强硬分子。该派系的优势在于拥有受过良好教育的领导层与指挥官 ——若他们有朝一日能打破现状，未来发展前景将十分可观。红切特尼克派的这些发展成果，离不开第三国际与跨阿尔卑斯大罢工的影响。尽管大罢工对黑山本土几乎没有造成直接影响，但奥地利境内罢工所取得的成果，却极大地鼓舞了约万诺维奇及其他如今成为红切特尼克派领袖的人物。\n\n至于第三国际，其传播革命的意图已是公开的秘密：无论“红色浪潮”席卷至何处，红切特尼克派都准备好为之提供支持。第三国际的资金经由意大利南部流入黑山，这些资金被用于为更激进的势力运送武器。由于这些武器库被深藏在山区，政府几乎无能为力 ——红切特尼克派也因此在暗中等待时机，随时准备发起行动。"
