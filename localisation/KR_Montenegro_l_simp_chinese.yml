 MNT_all_sides_desc:0 "塞尔维亚已陷入包围 —— 北边是叛徒环伺，东边有保加利亚和土耳其势力虎视眈眈，北边还有鹰派奥地利人步步紧逼。塞尔维亚必须保持警惕！"
