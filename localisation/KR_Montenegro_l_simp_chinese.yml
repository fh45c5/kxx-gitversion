 mntflavor.43.d:0 "黑山土地并不肥沃，这早已不是什么秘密。我国大部分地区岩石遍布，且作为一个相对贫困的国家，可供开展的活动本就不多，因此我国民众被贴上了‘懒惰’的标签。\n由此，一个流传于国外的常见笑话应运而生，例如：一名黑山人看到一个法国人在遛蜗牛，他走上前称赞那只蜗牛：“你的蜗牛真漂亮！我以前也有一只，可它居然跑了。”“黑山人是怎么自慰的？他把阴茎插进土里，然后等着地震。”"
