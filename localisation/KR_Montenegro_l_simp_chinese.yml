 MNT_dynastic_issues_desc:0 "佩特罗维奇-涅戈什家族虽作为黑山王国的统治家族地位无可争议，却与人民党乃至塞尔维亚各王室陷入公开冲突。数十年间——甚至在世界大战爆发前，塞尔维亚王室便一直试图推翻佩特罗维奇-涅戈什家族的统治，扶持本国王朝取而代之；在他们眼中，这一黑山统治家族是对“南斯拉夫主义”这一如今几近消亡的理念的威胁。\n即便“南斯拉夫问题”已有定论，塞尔维亚君主仍将黑山视作通往地中海的便捷通道，这使得双方合作困难重重。"
 MNT_serb_separatism:0 "塞尔维亚分离主义"
 MNT_serb_separatism_desc:0 "同盟国战胜协约国后，塞尔维亚王国与黑山王国随之遭到瓜分和占领。在此背景下，黑山国内的两大民族主义政党：人民党与真正人民党，就黑山的未来走向产生分歧，陷入争执。其中，人民党认为黑山人属于“来自塞尔维亚的塞尔维亚人”；与之相反，真正人民党则主张黑山人是“来自黑山的塞尔维亚人”。与此同时，在残酷的南斯拉夫起义之后，激进民族主义者已占领黑山北部的大片区域，这一局面令奥地利与黑山当局均深感不满。\n这些民族主义据点已然成为伊利里亚方面与黑山方面共同面临的一大棘手难题。"
 MNT_shackled_economy:0 "受桎梏的经济"
 MNT_shackled_economy_desc:0 "1929年南斯拉夫起义期间，维也纳方面与黑山革命者达成协议：以“自治权与君主复位”换取和平。黑山方面接受了这一条件，因为他们需要稳固的地位以对抗塞尔维亚。然而在随后的七年里，黑山发现自己已被牢牢捆绑在维也纳的市场体系中。\n显然，这样的处境难以为继，亟需改变。"
 MNT_shackled_economy_2:0 "从束缚中松绑"
 MNT_shackled_economy_2_desc:0 "1929年南斯拉夫起义期间，维也纳方面与黑山革命者达成协议：以“自治权与君主复位”换取和平。黑山方面接受了这一条件，因为他们需要稳固的地位以对抗塞尔维亚。然而在随后的七年里，黑山发现自己已被牢牢捆绑在维也纳的市场体系中。\n显然，这样的处境难以为继，亟需改变。"
