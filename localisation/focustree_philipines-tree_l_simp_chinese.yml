PHI_skadal_revolt_legacy:0 "萨克达尔起义的遗产"
PHI_skadal_revolt_legacy_desc:0 "萨克达尔运动作为20世纪20年代末和30年代初成立的农民运动，在岛屿政府时期是一场相对受欢迎的运动。随着1935年的独立，该团体在第一次全国选举中支持国家社会党。随着1935年选举的失败，1935年5月2日，在据称有日本等外国势力支持的情况下，萨克达尔派试图发动起义，认为全国其他地区都会帮助他们建立独立的菲律宾的崇高事业。但事实并非如此，这场运动被政府军粉碎，迫使其领导人贝宁戈·拉莫斯流亡海外。尽管粉碎了这场运动，但它的快速发展表明了民众不满力量的强大。必须采取某种行动，以防止另一场可能利用同样原因发展起来的运动的发生。"
PHI_new_nothing_army:0 "军队的雏形"
PHI_new_nothing_army_desc:0 "根据1935年的《菲律宾独立法案》，菲律宾武装部队（AFP）作为接替美国驻军和菲律宾保安队保卫联邦的新力量被建立起来。然而，对于这支新军队，我们面临着缺乏某些技术和熟练人员的困难，使我们处于相对软弱的境地。这需要得到解决，才能让军队成长为保卫菲律宾国家的堡垒。"
PHI_poor_as_fuck:0 "贫困的烂摊子"
PHI_poor_as_fuck_desc:0 "随着美国在1899年从西班牙手中获得菲律宾，该群岛成为美国的一个重要经济领土。尽管这通过出口生产带来了巨大的利润，但这些出口利润并没有显著改变民众的生活条件，这意味着即使在最好的时期，该国的生活水平和消费也很低。"
