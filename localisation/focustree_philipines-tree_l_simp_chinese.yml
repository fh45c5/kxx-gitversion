 PHI_the_humble_sons_of_the_people: "人民忠仆"
 PHI_the_humble_sons_of_the_people_desc: "政客们为我们做了什么？他们只会掠夺和欺骗；多年来，他们把自己描绘成独立卫士，但实际上却是美国人的忠实走狗。是时候将他们扫地出门了。我们不是政客。我们的运动不是旨在维护自身权力的政党。我们所做的一切都是无私地为人民服务。"
 PHI_vocational_and_nationalist_education: "职业教育和民族主义教育"
 PHI_vocational_and_nationalist_education_desc: "菲律宾的学校已经受到西式教学模式和课程的毒害，变成了向孩子们灌输英语的工厂。菲律宾人需要的是实用知识、在行业中取得成功的知识和建设国家的知识。最重要的是，他们必须学会热爱国家、服务国家。"
 PHI_improve_working_class_housing: "改善工人阶级住房"
 PHI_improve_working_class_housing_desc: "普通菲律宾人居住条件很差，无论是乡村贫民区的破旧房屋，还是马尼拉日益扩大的贫民窟，而政客们却住在豪宅里。健康强壮的人民需要良好、卫生的住房。让我们发起一场运动，为下层阶级建造新的、更好的住房。"
 PHI_mothers_of_the_nation: "国家的母亲们"
 PHI_mothers_of_the_nation_desc: "菲律宾妇女有着光荣的历史。她们反抗西班牙压迫者。她们抵抗美国侵略者。当她们的丈夫逃避国家责任时，她们会严厉斥责。菲律宾妇女在国家生活中的作用应该得到尊重和培养。菲律宾妇女是我们的姐妹，更是养育后代的母亲。"
 PHI_cooperation_of_labour_and_capital: "劳资合作"
 PHI_cooperation_of_labour_and_capital_desc: "毋庸置疑的是，菲律宾的经济精英正以各种方式剥削工人阶级。工团主义煽动者也在利用“阶级斗争”的口号来激化矛盾与分裂。劳资之间持续不断的战争永远不会带来繁荣与和平。劳资双方必须联合起来，学会合作，并为了国家利益放下怨恨和敌意。"
 PHI_spirit_of_ninety_six: "1896年精神"
 PHI_spirit_of_ninety_six_desc: "1896年，菲律宾革命爆发。这场革命涌现出了众多民族英雄，他们的精神至今仍激励着我们。但太多的老人淡忘了这段历史，太多的年轻人则对这段历史一无所知。我们绝不能让国家丧失精神，进而变得自满且颓废。我们必须回顾过去的那些伟大爱国者，效仿他们的榜样，勇敢地迈向未来。"
 PHI_spirit_of_national_defense: "国防体系"
 PHI_spirit_of_national_defense_desc: "若想实现独立，仅靠愿望是远远不够的，还必须有军事力量作为后盾。为此，我们必须尽最大努力防止外国势力再次威胁我国主权。所有体格健全的男性都必须做好服役准备并接受作战训练。国家也必须随时准备发起动员，并准备好最大限度调动我国人力物力的计划。"
 PHI_philippines_unbowed: "不屈的菲律宾"
 PHI_philippines_unbowed_desc: "就在昨天，菲律宾还是一个奴性十足的国家：不是对前美国主子的奴性，就是对背叛国家利益的腐败自私的政客阶层的奴性。但那些日子已经一去不复返了。我们重拾了尊严，并扫除了党派政治的腐败。我们建立了一个为所有菲律宾人服务的政府，所有菲律宾人都将为之而感到自豪。"
 PHI_pan_asian_propaganda: "泛亚宣传"
 PHI_pan_asian_propaganda_desc: "西班牙和美国曾试图强迫菲律宾接受西方模式，但我们内心里始终是一个亚洲国家。从我们与南方马来人民的兄弟情谊，到我国境内的华人和日本人社区，我们完全属于东方世界。亚洲国家反对帝国主义的斗争就是我们的斗争，我们期待着所有亚洲人团结一致的那一天。"
 PHI_the_glorious_republic: "光荣的共和国"
 PHI_the_glorious_republic_desc: "菲律宾已从屈服、贫穷和冷漠中重焕新生，成为了东方明珠。我们的伟大成就在太平洋彼岸熠熠生辉，鼓舞着我们的朋友，吓退了我们的敌人。诞生于马洛洛斯的第一共和国从废墟中重生，取得了超乎我们想象的伟大成就。菲律宾人民将为自己的国家感到自豪，无私热切地为国家服务，并为挚爱的祖国献出自己的生命。"
 PHI_unification_of_politics: "政治统一"
 PHI_unification_of_politics_desc: "有人可能会说，多党竞争的民主制度是繁荣自由社会的先决条件，但事实果真如此吗？显而易见的是，国民党自建国之初便主导着菲律宾政坛，每次拼凑反对派运动的尝试也都以失败告终，但这不应被视为坏事。正是在国民党的稳定统治下，菲律宾各地才得以携手合作。"
 PHI_our_seat_at_the_table: "我们的一席之地"
 PHI_our_seat_at_the_table_desc: "赢得尊重并非易事。长期以来，菲律宾共和国被视作一个新兴国家，一个勉强获得独立的美国殖民地。我们付出了巨大努力才改变了这种看法，我们的外交和国家进步也终于结出了硕果。菲律宾现已完全被国际社会接纳和尊重，并拥有自己的影响力。"
 PHI_political_spirit_quezon_1_idea: "奎松的总统任期"
 PHI_political_spirit_quezon_1_idea_desc: "曼努埃尔·奎松成功于1939年选举中连任，也坐实了改革者的形象。在巩固统治的同时，他也在推进菲律宾现代化的议程，同时也在为即将到来的亚洲冲突做好了准备。"
 PHI_political_spirit_quezon_2_idea: "奎松的胜利"
 PHI_political_spirit_quezon_2_idea_desc: "$PHI_political_spirit_quezon_1_idea_desc$\n\n作为菲律宾权力斗争的胜者、也是带领国家度过太平洋战争的人，曼努埃尔·奎松终于可以在这个羽翼未丰的共和国中确立自己的传承，并以自己的理念来塑造这个国家。"
 PHI_political_spirit_roxas_1_idea: "罗哈斯的总统任期"
 PHI_political_spirit_roxas_1_idea_desc: "曼努埃尔·罗哈斯于1939年成功带领国民党赢下选举，使该党成为了菲律宾独立的捍卫者。同时也表明了国民党（及其精英）并不仅仅甘做奎松总统的后继者。国民党建制派将继续领导并保卫菲律宾，确保国家的秩序与和平。"
 PHI_political_spirit_roxas_2_idea: "罗哈斯的胜利"
 PHI_political_spirit_roxas_2_idea_desc: "$PHI_political_spirit_roxas_1_idea_desc$\n\n作为菲律宾权力斗争的胜者、也是带领国家度过太平洋战争的人，曼努埃尔·罗哈斯终于可以在这个羽翼未丰的共和国中确立自己的传承，并以自己的理念来塑造这个国家。"
 PHI_political_spirit_aguinaldo_1_idea: "阿吉纳尔多的总统任期"
 PHI_political_spirit_aguinaldo_1_idea_desc: "最终，埃米利奥·阿吉纳尔多重掌权柄。第一共和国的第一任总统如今成为了第二共和国的第二任总统。如今，他将凭着群众的力量，引导国家走向新的未来——释放人民的力量，接续1899年未竟的事业，建设菲律宾。"
 PHI_political_spirit_aguinaldo_2_idea: "阿吉纳尔多的胜利"
 PHI_political_spirit_aguinaldo_2_idea_desc: "$PHI_political_spirit_aguinaldo_1_idea_desc$\n\n作为菲律宾权力斗争的胜者、也是带领国家度过太平洋战争的人，埃米利奥·阿吉纳尔多终于可以在这个羽翼未丰的共和国中确立自己的传承，并以自己的理念来塑造这个国家。"
 PHI_political_spirit_evangelista_1_idea: "埃万赫利斯塔的总统任期"
 PHI_political_spirit_evangelista_1_idea_desc: "克服千难万险，克里桑托·埃万赫利斯塔领导着社会主义者、无产阶级、农民、游击队及其他群众武装的大联盟推翻了旧精英、扫清了旧秩序。这个曾经受压迫者组成的同盟建立了新的菲律宾，誓要从帝国主义和资本主义手中争取独立。"
 PHI_political_spirit_evangelista_2_idea: "埃万赫利斯塔的胜利"
 PHI_political_spirit_evangelista_2_idea_desc: "$PHI_political_spirit_evangelista_1_idea_desc$\n\n作为菲律宾权力斗争的胜者、也是带领国家度过太平洋战争的人，克里桑托·埃万赫利斯塔终于可以在这个羽翼未丰的共和国中确立自己的传承，并以自己的理念来塑造这个国家。"
 PHI_political_spirit_recto_1_idea: "雷克托的总统任期"
 PHI_political_spirit_recto_1_idea_desc: "尽管很少有人认为雷克托会当选，更没有人相信这么快就能实现，但克拉罗·雷克托现已带领政治反对派在选举中获胜，在菲律宾历史上首次将国民党赶下了台。如今，雷克托宣称自己拥有了改革菲律宾并消除腐败的广泛授权，即使他未能实现更为广泛的议程，但他的胜利显然已经动摇了旧秩序的僵化基础。"
 PHI_political_spirit_recto_2_idea: "雷克托的胜利"
 PHI_political_spirit_recto_2_idea_desc: "$PHI_political_spirit_recto_1_idea_desc$\n\n作为菲律宾权力斗争的胜利者，克拉罗·雷克托带领国家度过了太平洋战争时期，为这个新生的共和国奠定了坚实的基础，并按照自己的愿景塑造了这个国家。"
 PHI_workers_rights_idea: "工人权利"
 PHI_workers_rights_idea_desc: "奎松总统承诺将维护菲律宾新兴工业领域的和平，促进增长，限制劳工中的激进主义，同时捍卫发展壮大中的工人阶级的权利。"
 PHI_workers_revolution_idea: "工人革命"
 PHI_workers_revolution_idea_desc: "菲律宾工人长期受到外来帝国主义和国内反动派的双重压迫。新政府现已为菲律宾带来了真正的民主，即无产阶级领导的民主。"
 PHI_promote_welfare_idea: "提高福利"
 PHI_promote_welfare_idea_desc: "国家的主要职责在于关爱人民，在当下，这意味着政府需要制定计划来帮扶弱势群体并提高人民的生活水平。"
 PHI_security_through_patronage_idea: "邀买安定"
 PHI_security_through_patronage_idea_desc: "菲律宾社会由一套不成文但得到普遍默认的社会准则维系着，该准则将精英和大众联系在一起。这两个群体必须和谐共存并相互服务，否则我们就会产生内部分裂并被外部力量所摧毁。"
 PHI_cooperation_of_labour_and_capital_idea: "劳资合作"
 PHI_cooperation_of_labour_and_capital_idea_desc: "工人阶级和资产阶级精英一直矛盾重重，资本主义剥削压榨和社会主义阶级斗争的呼声更是让情况雪上加霜。但国家离不开两者，如果他们之间爆发矛盾，对我们年轻的共和国来说将是灭顶之灾。相反，政府必须教导这两股力量和谐相处，共同努力，以造福全体国民。"
 PHI_improve_working_class_housing_idea: "工人阶级住房"
 PHI_improve_working_class_housing_idea_desc: "无论是在城市还是乡村，我国的穷苦大众都必须忍受居住在人满为患且环境肮脏的贫民窟和茅草屋中的屈辱，这是一件可耻的事情。政府若想展现对人民的关怀，最明显、或许也是最有影响力的方式便是致力于为人民建造新住房。"
 PHI_expel_subversives_idea: "扫清颠覆分子"
 PHI_expel_subversives_idea_desc: "外国支持的颠覆分子正试图渗透进我们的国家，利用我们的自由社会制造混乱并挑拨离间。无论是通过激进的煽动还是虚假的宗教误导群众，这些动乱分子对国家都没有任何好处。为了我们国家的进步和秩序，必须粉碎他们。"
 PHI_women_suffrage_idea: "妇女选举权"
 PHI_women_suffrage_idea_desc: "虽然1935年起草的菲律宾宪法并未赋予妇女选举权，但其中确实包含一项规定，要求今后就妇女选举权问题举行具有约束力的全民公投（仅由女性参与公投）。随着全民公投的举行和压倒性通过，菲律宾政坛似乎迎来了新的一天。"
 PHI_womens_revolution_idea: "妇女革命"
 PHI_womens_revolution_idea_desc: "妇女解放不仅仅意味着简单的选举权，还必须包括让妇女摆脱压迫性的家庭结构和资本主义经济制度。虽然这一愿景需要很多年才能实现，但我们或许可以创造出一个良好的开端。"
 PHI_mothers_of_the_nation_idea: "国家的母亲们"
 PHI_mothers_of_the_nation_idea_desc: "妇女在菲律宾历史上一直占有一席之地。她们敦促丈夫、兄弟和子女履行爱国义务，当亲人在与侵略者的战斗中失败或牺牲时，她们甚至会亲自拿起步枪。我们永远不会忘记妇女为我们国家所做出过的贡献！"
 PHI_domestic_relations_and_probate_courts_idea: "妇女公民权利"
 PHI_domestic_relations_and_probate_courts_idea_desc: "通过全民公投赋予妇女投票权只是一个开始，对于普通菲律宾女性来说，真正的改变还必须包括对家庭暴力的民事保护和法庭对于遗嘱认证的公平尺度。"
 PHI_model_of_filipino_womanhood_idea: "菲律宾女性"
 PHI_model_of_filipino_womanhood_idea_desc: "真正的菲律宾女性是家庭的守护者，也是菲律宾民族的未来。女性的教育、美德和优雅，将对她们的丈夫、兄弟和子女产生积极的影响。"
 PHI_break_up_the_haciendas_idea: "拆分大庄园"
 PHI_break_up_the_haciendas_idea_desc: "欧洲的无产阶级在资产阶级雇主的压迫下受苦，而菲律宾的农村平民则在地主绅士的压迫下受难。随着农民起义的胜利，地主的大庄园(haciendas)被没收，农村现已掀起了一股强劲的变革浪潮。"
