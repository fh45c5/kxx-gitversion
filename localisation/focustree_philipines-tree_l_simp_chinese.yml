 PHI_democrata_desc:0 "证明菲律宾有资格在世界舞台上成为一个拥有民主代表的国家，这种渴望正是反对派奋斗的动力。尽管前路艰难，胜利终被把握，向世界展示了菲律宾的政治并非基于个人关系，而是基于理念。人民阵线那些与众不同的胜利理念，在赢得人民授权后，正逐步付诸实施。"
 PHI_democrata_social_justice_desc:0 "奎松的社会正义理念所带来的危险显而易见。这是一种贫富对立的民粹主义论调，认为富人没有尽到应尽的责任，是他们的过错才导致穷人贫困，因为本应属于多数人的东西，少数人并未给予。贫困问题并非任何试图毁灭他人的个人或群体的过错，而是我们当前社会以及我们所有人的过错。不寻找简单的替罪羊，而是正视现实，才能解决不公。唯有如此，一个值得自豪的社会才能被建立起来。"
 PHI_democrata_against_radicalism_desc:0 "激进主义对于那些渴望个人利益的人来说是一种非常容易的工具。只需用简单易记的口号来谴责所谓的阻碍国家发展的敌人，并表现得气势恢宏，仿佛掌握了所有答案，你期望的选民就会向你涌来。这并非一个健全民主的基础。在没有激进主义煽动的情况下，简单的必要性真相就会显现。"
 PHI_democrata_welfare_org_desc:0 "赤贫阶层永远没有钱，他们必须总是借债来为经济生产融资。即使土地被分配给他们，他们最终也会失去它，因为他们必须借钱购买材料；他们必须抵押自己的土地，最终失去这些土地。通过农业银行和其他监管融资方式进行的干预，旨在帮助小规模财产实现财务成功而不损害他人，将为我们的社会带来稳定与繁荣。"
 PHI_democrata_labor_commission_desc:0 "支持国家劳资关系委员会"
 PHI_democrata_subdue_monopolies_desc:0 "自由贸易的问题对独立菲律宾的国家理念是毁灭性的，而且它作为政策的时间越长，其负面影响的积累就越久。尽管奎松的民族主义呼声更大、更激进，但他先前的行动揭示了现实。要实现一个自由的菲律宾，第一步就是摆脱对美国贸易依赖的经济枷锁，而这只能通过保护我们自己的产业，同时减少对美国开放市场的依赖来实现。"
 PHI_democrata_public_utilities_desc:0 "重视公用事业"
 PHI_democrata_belo_act_desc:0 "废除贝洛法案"
 PHI_democrata_protectionist_policies_desc:0 "为了在国内发展我们的经济，应给予省和市政府更多的自主权。这可以通过赋予它们更大的征税权，使其在财政上独立于中央政府来实现。通过这种方式，地方政府将更有动力利用机会并解决本地问题。随着我们发展的积极效应不断累积，我们的经济将真正得到加强并实现独立。"
 PHI_democrata_sotto_law_desc:0 "新闻自由法是一项法律，由我们的维森特·索托亲自起草，旨在保护记者免于被迫透露机密新闻来源。该法标志着我们一直努力争取的法治的延续，因为它允许媒体拥有更强的独立性。现在，报道可能对政府有害的事件将得到允许，因为他们的消息来源可以保持机密，而无需担心遭到报复。"
 PHI_democrata_hare_haws_desc:0 "在与激进主义和煽动性言论的斗争中，攻击无耻的政客只是针对一个更大问题所表现出的症状。真正的原因并非来自敌人，而是缺乏教育的简单现实。我们的政策是正确的，并且成功了，因为它们能够与城镇和街区的学生产生共鸣。他们足够聪明，能够理解我们的纲领，并把它解释给各自城镇的选民。一旦教育普及全国，政客们就无法再用简单的花言巧语来回避他们政策的问题，而必须通过正确解释其纲领的优越性来说服选民。"
 PHI_democrata_great_man_desc:0 "回首往事，我们政策的成功证明了，我们以诚实哲学对抗无耻煽动家的方法，已得到了广大民众的丰厚回报。社会主义激进分子将被历史遗忘，因为他们煽动的阶级斗争未能深入人心。就连奎松留下的反对派也未能号召许多人去对抗我们政府中那些人为的竞争对手。的确，建设理想国家的梦想已圆满成功，疲惫的人正准备休息。"
