###Leader Descriptions###
POLITICS_MANUEL_QUEZON_DESC:0 "§Y领袖描述\n出生：§!1878年8月19日，菲律宾都督辖区新埃西哈省巴莱尔区\n§Y政治生涯：§!奎松于1878年8月19日出生在当时新埃西哈省省会巴莱尔区。1899年，奎松离开圣托马斯大学的法学学业，加入菲律宾战争，并在美菲战争期间加入共和军。他曾是埃米利奥·阿奎纳多的副官。奎松成为了一名少校，并在巴丹防区作战。1900年投降后，他回到大学，并在1903年通过了律师资格考试。奎松曾在一段时间内担任职员和测量员，后来进入政府服务部门，担任民都洛省和（后来的）塔亚巴斯省的财务主管。他成为了卢塞纳的市议员，并在1906年当选为塔亚巴斯省省长。在第一届菲律宾立法机关期间，奎松于1907年当选，在国民党名单下代表塔亚巴斯省第一区进入首届菲律宾国民议会，在议会中他担任多数党领袖以及规则和拨款委员会主席。在1914年美国众议院关于琼斯法案的讨论中，奎松告诉众议院，他的大部分初级教育都是在西班牙政府建立的乡村学校里接受的，这是菲律宾免费公共教育体系的一部分。从1909年到1916年连任两届期间，他游说通过了《菲律宾自治法案》。奎松于1916年回到马尼拉，并当选为第五参议院选区的参议员。他后来当选为参议院议长，并一直任职到1935年（共19年）。1919年，奎松和塞尔吉奥·奥斯梅尼亚共同率领第一个独立使团前往美国国会。尽管在1921年金融危机之后，他与前盟友塞尔吉奥·奥斯梅尼亚在1921年决裂。这导致了奥斯梅尼亚和奎松的分裂。1935年，在成功统一了分裂的国民党与奥斯梅尼亚派之后，奎松在国民党名单下以压倒性胜利当选为菲律宾联邦第一任总统。不过，奎松现在如坐针毡，因为他和奥斯梅尼亚似乎陷入了新的僵局，可能会使国民党再次分裂。"

