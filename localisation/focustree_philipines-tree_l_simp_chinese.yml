 PHI_start_left_radicals_desc:0 "多数民众面临的问题显而易见，他们对代表政客的信任已经丧失，这足以让反对派——斯卡达利斯塔斯——考虑发动起义，这表明我们的治理并不像我们希望的那样稳定。既然像他们这样的各种秘密社团的秘密已被揭露，那么合乎逻辑的下一步就是镇压，并继续清洗这些伪装成宗教或慈善团体、密谋推翻政府的组织。"
 PHI_start_learn_sakdal_desc:0 "多数民众面临的问题很清楚，他们对代表他们的政客失去信任，这足以让反对派萨克达尔党虑起义，这告诉我们，我们的治理并不像我们希望的那样稳定。我们现在需要做的是，考虑到这场冲突的根源，即富人的未尽职责，并采取行动说服他们认识到这些职责的必要性。"
