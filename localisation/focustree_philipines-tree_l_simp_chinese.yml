 PHI_lincoln_average_president:0 "任何胡安·德拉克鲁兹都可以成为总统！"
 PHI_lincoln_desc:0 "亚伯拉罕·林肯是谁？一位伟人，奴隶解放者，美利坚合众国的拯救者，少数几位备受全美爱戴的总统之一，以及更多……但在这一切之前，亚伯拉罕·林肯又是谁？一个出身于简陋小木屋的普通人，一个普通人，一个无名小卒（或者，在菲律宾，一个“胡安·德拉克鲁兹”式的人物），若非历史转折，他可能永远如此。那么，在当今时代，谁比菲律宾本土的帕斯夸尔·拉库亚尔更像这位伟大的解放者呢？与亚伯拉罕·林肯不同，他塑造了一个在政治上令人质疑、在社会上备受争议的形象，但与林肯相似的是，由于一场政治危机，他被突然推上了权力的巅峰。他在奎松去世后登上权力之巅，本应无足轻重；只是一个玩笑，一个滑稽的插曲，在那些争权夺利的政客们说服国民相信他们“严肃”的候选人资格之前。毕竟，社会上谁会为一个像拉库亚尔这样有疯狂想法的疯子浪费时间呢？然而，在19世纪，主张废奴主义，甚至主张人人平等，也会被视为疯子。因此，帕斯夸尔·拉库亚尔将像诚实的亚伯那样倾听人民的声音，他将向那些政客和全世界证明，他是时势造的英雄，他将带领国家走向其在世界上的应有地位。"
 PHI_lincoln_naturotheropy_desc:0 "拉库亚尔总统的政府与奎松的一样，仍受到各派激进分子的骚扰，特别是残余的萨克达尔分子、农业革命者和在偏远地区活动的各种邪教。他在竞选小册子中概述的解决方案，是他最令人费解的政策构想之一：自然疗法。拉库亚尔总统致力于以和平方式解决菲律宾的冲突，他计划为所有承诺放下武器的激进分子建立一个康复中心网络，重点采用新的心理疗法，并强调饮食和物质控制，以削弱暴力思想的影响。尽管这一提议充其量值得怀疑，但它也承诺这些中心将作为普通诊所供帕斯夸尔的政府其他成员使用，这似乎已经吸引了不少激进分子前往。"
 PHI_lincoln_new_roads_desc:0 "塑料，即合成酚醛塑料这种形式的塑料，而非虫胶之类的天然塑料，在世界上的存在时间并不长——直到1907年才首次合成，而且至今仍主要是一种被世界大国及其企业触角所掌控的物质。此外，它至今仍未完全成为一种实用的材料，似乎还需要数年才能作为一种合适的建筑材料取代玻璃或金属。所有这些都没有阻止帕斯夸尔·拉库亚尔，他的竞选承诺明确概述了开发并建造模块化塑料道路，以缓解道路磨损和损坏问题。尽管乍一看很荒谬，但根据英国和德国的最新研究，这或许完全可能——尽管不是很快。与此同时，拉库亚尔总统愿意用更现实的现有道路修复工作来补充这些雄心勃勃的梦想，当然，直到塑料的未来实现为止。"
 PHI_lincoln_air_conditioning_desc:0 "一段时间以来，拉库亚尔总统一直承诺要为马尼拉降温，这座城市以其持续高温和潮湿而臭名昭著。他打算如何做到这一点？很简单：建造一系列巨大的气候控制穹顶。看到这个建议，人们可能会忍不住从多个层面质疑此类项目的可行性，从项目所需资金，到其物理上是否可能。与其他大多数事情一样，总统既令人不安地含糊其辞，又坚定地乐观，尤其是在研究了德国瓦尔特·鲍尔斯菲尔德的测地线穹顶之后。不过，他本人也承认这需要一些时间，在此期间，他的政府正在马尼拉推行一项由国家资助的空调安装计划，并很快将推广到其他城市。即使不考虑穹顶项目天文数字般的成本，这个项目也将耗资巨大且困难重重——但在世界上最潮湿的国家之一扩大气候控制的使用范围所带来的好处将是巨大的，人们已经称赞该计划的卓越成就。"
 PHI_lincoln_dykes_desc:0 "菲律宾，尤其是在吕宋岛，是一个饱受多种自然灾害困扰的地方，但没有任何一种灾害像该岛持续的洪水那样阴险致命。拉库亚尔总统不仅呼吁应对洪水，更提出要彻底根除。令人意外的是，考虑到总统的其他提案和计划，这一目标虽然可行，但当然也带来了自身的问题，包括费用、项目的巨大规模，以及与众多土地所有者、农民甚至原住民群体的冲突，他们的土地都位于项目范围内。尽管如此，该计划仍获得了大量支持，甚至在拉库亚尔政府的反对派中也得到了认可。确实，如果能够控制吕宋岛的洪水，将对未来经济产生巨大裨益。"
 PHI_lincoln_bridges_desc:0 "总统曾在马尼拉的一个街区集会上发表了一次臭名昭著的讲话，令听众困惑的是，当被问及是否需要一座桥或没有桥时，他建议先建一条河，然后再建桥。然而，“无河之桥”的想法并非看起来那么荒谬。一些土木工程师经过一段时间的思考，认为他们已经通过高架公路这一新颖的想法实现了他的构想，该技术于1929年在纽约市首创，旨在减轻城市的交通负担。这一解决方案可能会彻底改变大马尼拉地区的出行方式，并且很可能在其他城市也是一个可行的解决方案。尽管成本高昂，但土木工程师们正满怀热情地推进这个项目，这促使许多人思考总统究竟是真正的疯子，还是一个被误解的远见卓识者。"
 PHI_lincoln_friar_lands_desc:0 "菲律宾的粮食生产和农业整体上存在诸多问题，这已不是什么秘密。在总统众多宏大的承诺中，有一个承诺吸引了大量关注，无论出于何种原因，即通过使用世界上最先进的农业技术，将菲律宾的农业和粮食生产进行转型，建设一系列超级农场。在另一项承诺耗资巨大、耗时漫长且可行性存疑（至少在整体上如此）的措施中，总统遭到了大量反对。然而，现在有越来越多的人，甚至包括那些通常对帕斯夸尔持敌对态度的政府内部人士，都愿意不仅接受帕斯夸尔的广泛宣言，也接受该计划本身。如果提议的变革中哪怕只有一小部分得以实施，不仅粮食产量会增加，政府还将直接控制大部分由大庄园主控制的土地，一举解散陈旧机构并改善公共福利。这些土地所有者已将此类措施斥为违宪和犯罪，但随着菲律宾农村迈向农业的新世纪，公众的势头可能会压倒他们。"
 PHI_lincoln_fireproof_currency_desc:0 "不争的事实是，塑料并非防火材料；与火接触时间足够长，它就会熔化。但这并未动摇拉库亚尔总统的信念，他认为将菲律宾的美元从纸币改为塑料钞票，不仅能提高钞票的防火性，还能使整个系统防欺诈、防伪造。这一举措引发了轩然大波，总统的反对者声称这不过是疯子的呓语，而非一个称职政治家的言论。另一方面，总统让民众开始讨论塑料，乃至未来，石油和化学品的进口量激增，官方及非官方的塑料研究项目也层出不穷。一些以美国为灵感的经济学家和规划者甚至指出，经过精炼和普及的塑料，在信用卡会计方面可能是一种有用的物质。无论该提案走向何方，总统已日益俘获民心，引发人们的思考与惊叹。"
 PHI_lincoln_against_rackets_desc:0 "至少可以说，拉库亚尔总统是一位行动派人物——而他最明显的精力体现在他提议的遏制黑帮和有组织犯罪的手段上：直升机。直升机是一项新技术，但已在世界各地证明了其有效性——帕斯夸尔·拉库亚尔相信，它们在民用领域和军事领域一样有用。为了制止犯罪，拉库亚尔总统已签署成立了一支特殊的直升机特遣队，其唯一目的就是针对有组织犯罪的动向采取行动，并对任何此类活动进行闪电突袭。除了特遣队的警察力量外，新成立的机构还将积极寻求直升机的设计，并加强对这类飞机的研究和优化。由于反对派震惊且组织混乱，没有人能说服他不要亲自参与此类任务。"
 PHI_lincoln_anti_corruption_desc:0 "这位总统出身贫寒，并非一个需要巨额财富的人。因此，他作为总统仅接受100比索的薪水——考虑到他不断奔波且不愿入住马拉卡南宫，此举显得尤为突出。他认为，这是未来任何菲律宾总统的基础，因为财富滋生贪婪和懒惰。这种心态导致了他对腐败的新强硬立场：任何被证实犯有此罪的人都将面临一百年的监禁。尽管这一惩罚被批评为荒谬，且考虑到地主主导的地方政治中腐败的普遍性，其有效性存疑，但对被抓者的严厉惩罚或许足以促使不法之徒改过自新……"
 PHI_lincoln_local_inspections_desc:0 "随着国家逐渐适应拉库亚尔总统古怪的执政风格，曾经被视为异常的现象正日益成为新的常态，至少在社交场合中人们会公开讨论，而不仅仅是当作一个笑话。总统的秘密视察计划更是将这一趋势推向了极致。该计划旨在根除地方上的低效和腐败，总统本人计划并已定期以伪装身份对地方政府机构进行突击视察。尽管此举被批评为侵犯隐私且效果存疑，但该计划仍将聚光灯打在了地方问题上，腐败或懒惰的官员正感受到来自民众的压力。"
 PHI_lincoln_thousand_questions_desc:0 "在总统出人意料地登上政治权力顶峰之前，他以政治“牛虻”的形象为人所知——他最喜欢的一种战术就是向那些声名显赫的对手，如格雷戈里奥·阿利亚派和曼努埃尔·奎松等人发起挑战，进行长时间的辩论，提出一连串的问题和挑战。尽管他本人并未取得实际成效（他所谓的对话者从未真正接受过这些辩论），但他首次尝试这种战术是在他担任总统之前——如今他已是总统，他的对手就再也无法回避他的言辞剖析了。拉库亚尔总统打算将这种严格的质询和详细的规划作为常态，因为职业政客必须通过不仅要准备好回答关于其政策的具体问题，还要以类似总统的方式规划其项目，来摒弃模糊和虚伪。这种方法有望将政治中的精华与糟粕区分开来，只有真正坚韧无私的人才能从腐败和自私的政客大军中脱颖而出。"
 PHI_lincoln_average_president_desc:0 "帕斯夸尔·拉库亚尔的故事是典型的逆袭故事。他白手起家，曾遭到整个体面社会的轻视和排斥，如今却身处于此：总统府、权力的杠杆、菲律宾社会指挥的巅峰。如果帕斯夸尔·拉库亚尔是个更自私的人，他肯定会加冕自己为王，像任何普通政客一样躺下享受贪污腐败的战利品，但他不是普通政客——他过去是，将来也永远会是普通大众的一员。未来，他打算放弃自己的职位——但理想情况下，不是交给另一个职业政客，而是交给像他一样的人：一个普通人，一个“胡安·德拉克鲁兹”。正如拉库亚尔总统所证明的，最非正统的想法可能最成功，一个曾经只是人群中一张面孔的人可以成为整个国家的总统。毕竟，在一切之上，在腐败和动荡之中，帕斯夸尔·拉库亚尔相信人民的力量，而这种力量将使菲律宾长久地走向未来。"
