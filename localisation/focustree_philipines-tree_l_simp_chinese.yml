 PHI_com_right_unions_desc:0 "1896年的革命如今已被许多政治力量所宣称为其所有，其中也包括那些会反对我们的团体。然而，这些宣称仅仅基于革命中的民族解放层面，却忽视了革命的实际性质和基础。一旦将这一分析纳入考量，革命的农业基础便清晰可见。面对压迫性的封建秩序，田间和城镇的劳动人民拿起武器，反抗占主导地位的宗教地主阶级。革命领袖们深知修道士的暴行，革命也并未承认西班牙政府和宗教机构此前对菲律宾人民财产的非法侵占。无产阶级领袖安德烈斯·博尼法西奥在《菲律宾的最后呼吁》中写道：\n土地和赖以生存的生命\n广阔的田野和水源\n以及种植园\n都被西班牙修道士榨取。\n然而美国人却前来，企图对菲律宾进行经济和政治上的统治。他们的盟友正是封建秩序的统治者，这阻碍了革命目标的实现。如今，劳动阶级已获得力量，是时候实现这些革命抱负了。"
 PHI_com_charge_desc:0 "免费学习"
 PHI_com_eight_hours_desc:0 "确保八小时工作制"
 PHI_com_country_side_desc:0 "归根结底，菲律宾仍被可悲的封建秩序所主导。城市无产阶级在数量上不足以单独引领国家前进。俄国曾面临类似的处境，这为工农联盟铺平了道路。然而在我国，由无产阶级领导的联盟最终失败，在萌芽阶段便被扼杀。如今，随着我们的胜利，是时候重建这样的联盟，并从过去的失败中汲取教训了。所有证据都表明，我们必须将更多精力集中在农民身上。他们是国家的大多数，而我国的无产阶级尚未完全成长起来。事实上，农民要求结束封建秩序的诉求，与无产阶级要求改善条件的诉求相比，其本质上是直接与现状对立的。正如黎刹曾说：“对他而言，斗争意味着交战双方必有一死。”因此，让我们承担起土地革命的重任，利用在农民中发展起来的革命意识。"
 PHI_com_democractic_misson_desc:0 "现有的资本主义政党已被证明是相互勾结，而非相互对立。其实我他妈的得先决定革命怎么进行才能写这个（。。。那为什么不写完再发布"
 PHI_com_moro_probs_desc:0 "民族解放与民主，迈向社会主义"
 PHI_com_root_mass_desc:0 "在1896年革命的斗争中，菲律宾人民渴望掌控大庄园。现在，让我们实现对这些生产资料的接管，并用集体所有制取代此前的私人及外国所有制。这一未竟的目标，将成为迈向最终目标——所有生产资料共同所有——的第一步。诚然，乡村的权力已经易手。"
