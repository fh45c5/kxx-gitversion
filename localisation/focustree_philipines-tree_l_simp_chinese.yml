 PHI_antisoc_republicanism_survival_desc:0 "我们得到了一个不容错过的第二次机会。工团主义者在选举中获胜出人意料，这几乎像是象征着共和主义的终结。然而，他们推翻我们政府的阴谋被军队挫败了。全凭运气，军队才重新屈从于我们的文官统治。但事情并不像表面那样安全。民众对前国民党统治者的愤怒，足以让他们选举工团主义者上台。考虑到军队对我们前主子的潜在忠诚，他们将是我们的一根肉中刺。在我们完全赢得民众对共和主义和民主的支持之前，我们的行动将举步维艰。"
 PHI_antisoc_rizal_law_desc:0 "“我们应当深入汲取菲律宾历史的丰富源泉；我们必须学习菲律宾英雄的生平，如马比尼、黎刹、博尼法西奥、德尔皮拉尔、哈辛托、卢纳、布尔戈斯等众多人物；我们必须学会热爱并珍视菲律宾的传统；我们应当熟悉菲律宾的地理、经济、社会和政治；简而言之，我们必须学习、欣赏并热爱我们的国家——菲律宾，连同她的文化和她所代表的一切。”我们无法忘记这些爱国者为实现目标而奋斗并献出生命。因为尽管我们现在作为一个国家获得了独立，但他们为之奋斗的崇高理想仍未完全实现，而民众对此并不理解，有些人甚至仍支持过去的美国殖民统治。我们的目标必须是重新点燃曾遍及整个社会的对自由的热爱。实现这一目标的一项举措将是《黎刹法》，该法案将使黎刹著作的教学成为所有学校的必修课。但这仅仅是个开始，因为马坦、巴林塔瓦克、巴贡巴延、马洛洛斯和巴丹的精神再次复活了！"
 PHI_antisoc_social_justice_stability_desc:0 "奎松的社会正义政策显然不足以让激进派在执政党占据所有优势的情况下当选。大众贫困问题导致整个社区陷入绝望，使得工团主义的诱惑得以俘获他们的心，尽管它并不尊重人的尊严和权利。或许，贫困的大多数人看到了前政府的经济支持者或政府精英的自私态度。幸运的是，菲律宾有幸从这样的制度中获得第二次机会。我们不能让这样的机会白白浪费。让我们建立一个新政府，推行新的社会正义计划，通过政府行动促进所有人的福祉和经济稳定，从而为最大多数人带来最大的利益。只有当包括财产所有者和劳动者在内的多数人都能感受到经济上的安全时，我们才能说，代议制政府将在这个时代幸存下来。"
 PHI_antisoc_pink_liberalism_desc:0 "审慎是必要的，否则无理的激进变革信念会摧毁现有社会。事实上，作为法官的劳雷尔本人亲眼目睹了法院的保守主义。这种保守主义旨在通过维持现状来保持我们来之不易的稳定。正如维吉尔曾写道：“紧贴岸边：让别人去深海冒险。”这种情感或许值得钦佩，但仅凭它们是不够的。毕竟，紧贴岸边并不意味着我们永远不会踏上深海。单一的保守主义会阻碍必要的进步并导致停滞。最好记住保守与变革的必要性，并根据需要进行调整。治理必须像生命本身一样变革和演变，这是一个事实。让我们在炽热的激进主义和可靠的保守主义之间编织一条道路，以实现成长与演进的粉色自由主义。"
 PHI_antisoc_two_party_desc:0 "过去的另一个问题是看待政治的视角。对每个政客而言，其目的就是通过恩惠来使自己及其忠诚追随者致富。当这些政客结成联盟时，这就成了一个只推进自身利益、削弱对手派系的政治党派。多数党因此为了自身利益而非国家利益来统治国家。与此同时，反对派也同样糟糕，因为它由同类型的政客组成，只是不幸地沦为少数派。他们要么通过诽谤对手来图谋取代多数党，要么通过钻营来谋求加入多数党阵营，同样忽视了治理和解决国家面临的问题。我们将致力于纠正这种可悲的状况，以建立一个真正的两党制，让执政党和反对派能够进行建设性互动，共同提出解决问题的关键方案。这只有通过在双方之间创造平衡才能实现，即防止未来执政政客的自肥行为。关于部长任命、外部资金和政治干预反对派的法规将限制多数党和反对派的利己主义。从而建立一个能够妥善处理公共事务的稳定民主制度。"
 PHI_antisoc_transformation_society_desc:0 "尽管我们努力追求民主，但当许多危险力量围绕在我们身边，试图摧毁它时，这一原则便显得格格不入。工团主义者公然寻求摧毁共和制，这或许是它面临的主要威胁。然而，那些思想落后、自私自利的政客，他们只求在任期内维持自己的地位，却将国家引向被工团主义摧毁的境地。在工团主义统治和战败期间发生的政治混乱，为我们提供了一个不受阻碍地统治和实施政策的机会，而那些目光短浅的政客们则忙着寻找自保的船只。我们将充当催化剂，旨在带来社会和政治生活的变革，这些变革在正常情况下可能需要数年甚至几代人的时间才能实现。我们的工作将是培养新一代健康、聪明、自尊的人，他们将为我们的国家增光添彩，并颂扬菲律宾民族。"
 PHI_antisoc_divine_principle_humanity_desc:0 "在与外部世界互动时，我们必须铭记，所有人类在上帝面前生而平等，但上帝也创造了多样的人类种族，其成员虽同为人类，却各具荣耀的独特性。因此，上帝的使命——在地球上建立上帝的国度——唯有当人忠于自身本性时才能实现，而这一特质要求我们遵从作为菲律宾人的特定宪法。成为善良而真实的菲律宾人，应使我们成为世界秩序中更优秀、更有帮助、更自豪的公民。对于世界上所有国家、无论大小，其所有成员而言，这一点同样适用。人人皆为兄弟，人人平等。绝不应因种族、信仰或肤色而存在任何歧视。我们曾亲身感受到西方帝国主义在我们国土上的野蛮行径，我们将致力于确保此类事件不再发生在任何其他国家，因为世界正朝着一种人人享有平等权利的普世文明迈进。"
 PHI_antisoc_mother_asia_civilization_desc:0 "世界文明在冰雪覆盖的喜马拉雅山北麓初现曙光，随后穿越中亚，进入希腊，并发展成罗马传遍欧洲的辉煌。东方的亚洲将它的宗教和文化给予了西方，然而西方却利用同样的文明来剥削那些文明发源地的民族和国家。作为亚洲人，菲律宾人不能对这场持续的斗争无动于衷。我们必须伸出援手，建立亚洲自卫所必需的联系，以抵御西方的侵略。任何有资格继承其过去遗产、神圣传统，并有权在阳光下生存的亚洲国家，从此都不能再容忍西方统治或影响的回归。亚洲人再也不能满足于仅仅作为西方人的“伐木工”和“挑水工”。东方人必须获得政治和经济自由，以便他们及其后代能够摆脱所谓高等民族强加于他们的政治和经济奴役。这项任务只有通过我们自己摆脱自我催眠，并抛弃对其他东方人的不信任才能成功。"
 PHI_antisoc_express_racial_will_desc:0 "对我们这样的年轻国家而言，提高出生率与改善种族素质并不矛盾。我们能够也应该塑造我们周围的环境和教育力量，使健康与智慧的繁衍超过疾病与无知的复制。通过强调对孕妇的医疗关注、正确的产前和婴儿护理方法以及为我们的孩子提供适当的营养，将促进更多的出生。与此同时，一项种族改良计划将通过为成年人提供均衡的饮食、为年轻人和老年人提供清洁的娱乐和健康的体育活动，以及其他旨在保护民众健康的措施来实施。特别强调在小学前四年进行品格教育和公民培训，如家庭地理学以及菲律宾历史和文化的简单元素，如本土和东方的民间音乐、舞蹈和游戏。所有这些旨在培养一种自信的菲律宾精神，以恰当地反映菲律宾人通过他们迄今为止发展的文化和文化表达所传达的种族意志。体育教育也使国家健康而充满活力，并丰富了人民的文化生活。作为一个独立的国家，对青年的体育教育自然应包括有助于为国家防御做准备的活动。"
 PHI_antisoc_spiritual_east_desc:0 "东方应揭穿西方帝国主义的真实面目，并理解其真正的精神与图谋。西方帝国主义的根源在于物质主义，即一种因过度追求物质利益而导致的道德败坏，它将一个国家的经济图谋置于其他民族按照自身制度发展的权利之上。我们必须对抗我们从西方继承来的过度物质主义，即那种不惜一切代价积累财富的倾向，否则我们将忘记自然法下人类的基本平等，以及那些忘记此法则的人所创造并强加于我们的种族和文化不平等的结构。多数菲律宾人民所信奉的基督教，已在西方物质主义下被腐化。通过强调指导我们并引导民众的宗教和道德信仰，我们将创造一种区别于西方的新文明，这种文明能够为履行上帝在世间的使命而努力。然而，在实现宗教统一之前，教会与国家必须完全分离，以实现所有宗教的平等，否则穆斯林、印度教徒以及所有其他少数群体会感到被我们正在建设的这个社会所排斥。"
 PHI_antisoc_laissez_socialism_desc:0 "代议制民主一直与资本主义和自由放任思想紧密相连。这导致国家出现了一系列严重问题：“社会组织的效率低下、贫困以及由此导致的穷人生活恶化、许多公民的自私——他们很少考虑集体利益，尤其是……诸如技术生产的浪费、自然资源利用极其有限、落后的教育体系和课程、自我放纵的倾向、腐败以及普遍的‘各人自扫门前雪’的态度。”这些问题只有通过放弃自由放任原则，代之以通过国家社会主义来激活共和主义原则的政府，才能得到真正解决。显然，民众支持社会和经济规划，以便广大民众能够有充足的工作机会，过上文明人的生活，拥有家园、医疗服务、现代教育，并在社会和经济上获得保障，以应对年老和生活中不可预见的危险。为此，让我们创建国家经济发展署，以解决我国的菲律宾问题。它将负责经济和社会活动的集中指导和控制，以增强社会正义原则在当前我们这个压力重重的社会中为所有群体带来的现有成效。"
 PHI_antisoc_common_happiness_desc:0 "东方或许将再次成为国际关系新准则的基础，该准则以道德正义为基石，旨在实现所有成员的共同幸福与繁荣。我们与其它国家交往的信念，将不再是西方那种受日本启发、以支配弱小民族为欲望的准则，而是基于我们亲历西方帝国主义后的经验，承认并尊重每个国家的自主与独立。正如黎刹所说：“通过保存自身来成为国家。若你寻求西方化你的习俗，你就是在寻求自杀，毁灭你的民族性，消灭你的祖国。未来你将是一个没有性格的民族，一个没有自由的国家。”国家无法通过模仿他人而成功，强迫他们服从也未必能给他们带来繁荣，尽管这可能给压迫者带来繁荣。然而，我们的目标并非仅仅是一个部分的繁荣，而是整体的繁荣。"
 PHI_antisoc_popular_gov_desc:0 "我们通过致力于大众控制，成功地实现了我们的目标。通过我们的辛勤工作，我们不仅恢复了人民对既定政府的信心，还通过教育和道德教化取得了进步。我们传授的道德观念渗透到个人、社会和公共生活的方方面面，使菲律宾公民得以培养出坚强的品格，这包括对上帝的信仰、对国家和父母的热爱与荣誉、对宪法及其共和与自由原则的尊重、对劳动尊严的信念以及对选举权神圣性的认知等。"
