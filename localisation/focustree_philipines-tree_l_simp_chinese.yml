 PHI_hilario_god_desc:0 "E代表平等\nQ代表资格\nU代表正直\nI代表无限\nF代表博爱\nR代表正义\nI代表理智\nL代表自由\nI代表不朽\nB代表同胞\nR代表尊重\nI代表正直\nU代表团结\nM代表道德"
 PHI_hilario_fn_desc:0 "通过道听途说、偏执和偏见，最被理解也最被不公批评的菲律宾人是希尔里奥·卡米诺·蒙卡多将军。他在报纸上被无情地攻击。他在嫉妒的祭坛上被钉死。他从未回应过那些毫无根据的攻击。他默默忍受。他没有憎恨那些诽谤者，反而一有机会就尽力帮助他们。他以仁慈和爱心对待他的验证者和诬告者。他不为所动地继续他的慈善工作和服务。他有意志力和不屈的勇气，克服所有阻碍他通往成功和荣耀道路的障碍。他像猫头鹰一样睿智，像鸽子一样温和。他有一颗勇敢的心。他就像一块纯净的花岗岩巨石。他的工作虽然看似谦逊，但如今却像直布罗陀的坚不可摧的岩石一样屹立不倒，坚不可摧，不可征服。为了揭露这种背信弃义宣传的虚假性，唯一的办法是创办我们自己的报纸，揭示人类道德观念的真理。"
 PHI_hilario_anticom_desc:0 "共产主义究竟是什么，我们这些热爱自由的世界人民为何如此憎恶它？有人说共产主义是一种宗教。另一些人则认为它是一个政党的教义。还有人相信共产主义是一种政府形式，在一位领袖的统治下，人人平等生活。共产主义是以撒旦为神的宗教。它是一个撒旦的政党，试图说服世人选择他而不是上帝。共产主义是一种政府形式，所有信奉它的人都会成为人类的奴隶，不仅交出物质财产，还交出身体和灵魂，成为实现撒旦邪恶目的的工具或手段。\n\n嫉妒和布尔什维克主义是自该隐降生于世以来，纠缠人类内在结构的最黑暗的邪恶。亚当和夏娃的犯下的第一个罪该隐，是共产主义者，也是它的始祖。他是第一个谋杀者和异教徒。他的邪恶行径至今仍困扰着每一个活着的灵魂。他的后代在各个时代都鼓吹谋杀、战争、罢工以及所有形式的麻烦。为了掩盖他的邪恶，他利用精心组织的撒谎网络，通过谎言来传播。在当今的文明社会，人们很容易识别他们。他们总是用言语和印刷品攻击那些支持上帝在此世使命的人。我们的主耶稣，上帝基督的人形化身，是无辜的受害者，遭受了嫉妒和布尔什维克主义的攻击。蒙卡多将军也是嫉妒和布尔什维克主义的无辜受害者。他没有被钉在十字架上，也没有被枪杀。他们外表正常，内心却是饥渴的、无神论的共产主义者。"
 PHI_hilario_loyal_general_desc:0 "起初，耶稣并未培养出任何学生，因为他不授课，也不开办学校。他只有门徒。如今，他拥有成千上万的门徒和数以百万计的追随者遍布世界各地。蒙卡多也创造了三种不同类型的追随者。他同样拥有数以百万计的追随者、成千上万的门徒和数百名学生。这些都是真实存在的，而不仅仅是理论上的。\n\n今天，蒙卡多将军勇敢地站在世界之巅，宣告一个新时代的来临。平等人接受这一新教义，将使知识的诅咒——“你必定会死”——在未来数个世纪内失效。"
 PHI_hilario_man_god_desc:0 "道德是人类的伟大神圣力量，用以在地球上成就一切——因为道德即是生命。生命是人类的伟大美德——谦卑与温顺，用以继承地球的财富。人类是上帝智慧的造物。因为若没有人类，地球上便没有上帝。人类的道德是上帝赋予人类的德行。道德是人类的神圣指引，用以成就一切尘世之物——即生命的物质。人类的道德是与一切尘世罪恶相对立的。所有罪恶都会摧毁人类的身体健康——因此，人类应当与一切罪恶作斗争。\n\n依其本性、神圣性及其创造，人类的道德即是上帝。上帝即是道德。道德即是人类，人类即是上帝。因此，让我们在人生的道德观念基础上追求物质上的成功，以便能与邻人幸福地生活在一起。\n\n所有人类都应严格、字面地、神圣地遵循人类的道德观念，并应与一切有损人性的罪恶作斗争，因为服务人类是每个男人的至高职责。道德是人类的神圣服务。服务人类是每个男人在人生中应实现的道德美德。生命即是服务与苦难，为的是对人类的爱。人类是上帝的创造。上帝创造宇宙，不过是在地球上宣告和平，并对全人类怀有善意。"
 PHI_hilario_fwca_desc:0 "菲律宾联邦宪法的主要起草人和签署人之一，希拉里奥·卡米诺·蒙卡多将军遭受了不公正的批评，这实在有失公允。因为他受人尊敬、和蔼可亲、彬彬有礼、真诚正直，并且对上帝和国家忠心耿耿，他对正义、自由、平等和真理有着永不满足的渴望。在我们以智慧和道德引领的每一个关键时期，他都在成功的巅峰闪耀着光芒，尽管遭受了迫害和难以言喻的苦难。不应颂扬和耗尽的是战场上——在陆地、海洋和空中，蛮力与野蛮相遇的战场——的胜利。唯一值得被尊崇和敬仰的胜利，是能够用爱与同情赢得和征服无论何种种族、肤色或宗教的人们的心。"
 PHI_hilario_golf_god_desc:0 "高尔夫球手在打攻果岭球时，脑海里只有一个念头。这个念头就是球必须进入果岭，并尽可能靠近球洞停下。当这个愿望落空时，普通的高尔夫球手会感到困惑。普通人在生活中努力追求理想却未能如愿时，也会有同样的感受。\n\n我们生活的世界就像高尔夫球场。在高尔夫球场上，果岭——也有人称之为“岛屿”，也就是球洞所在的地方——是静止的目标。当你打攻果岭球时，这些果岭或岛屿既不会移动，也不会远离你或球。事实上，是偏离方向、失控的球远离了果岭。\n\n蒙卡多将军热爱高尔夫。他是一名优秀的高尔夫球手和出色的球员。学会做一个好人就像学会做一个优秀的高尔夫球手。有趣的是，好人和优秀的高尔夫球手追求的是同一个理念，那就是平等。一个追求与上帝平等，另一个则努力在每个球洞上做到自己的本分。"
 PHI_hilario_misson_billboard_desc:0 "因为耶稣只能教导道路、真理和生命，所有信他的人都面临着这些邪恶的问题——我们应该走哪条路？应该相信什么真理？我们应该过什么样的生活？——耶稣被钉十字架后，撒旦控制了由耶稣使徒建立的教会。根据启示录，撒旦的道路被教导为通往上帝的正确道路，而真正的道路则被扭曲为错误。换句话说，在撒旦的影响下，我们认为错误的东西，实际上却是正确的。今天，人们总是做相反的事。他们想要和平，却准备战争。国家谈论团结和建设，但每个国家的准备都显示出分裂和毁灭。这就是撒旦如何与人类为伍，如何控制人类的思维。这也是人类在这个世界上找不到和平与团结的原因之一。"
 PHI_hilario_cane_field_desc:0 "在过去的半个世纪里，我们见证了一位年轻领袖的迅速崛起，他出身平凡，童年时期笼罩在神秘之中，一个深奥的秘密，凡人难以理解。他走遍世界，不懈地追寻真理、正义、智慧、道德和爱的源头。自蒙卡多将军抵达美国大陆以来，他始终遵循平衡原则。正是基于这一原则，他努力改善菲美关系。菲律宾裔美国人联合会应运而生，旨在向美国人民及其同胞证明，在平衡原则下，他们是兄弟。该联合会旨在通过制定十二项目标来帮助早期菲律宾移民解决问题，这些目标将成为该组织的基石。这些目标涵盖了菲律宾裔在美国的双文化生存，强调互助、道德标准、基督教价值观，并处理与菲美关系相关的问题，特别是争取菲律宾独立。"
 PHI_hilario_calendar_desc:0 "“我相信，通过她的神圣创造，女性将统治世界，并恢复人性的道德结构，使其符合至高无上上帝的意志。”\n\n蒙卡多将军认为，女性的神性是地球上所有男人和民族之间实现永恒和平与团结的唯一解决方案。女性的神性是纯洁的，因为女性是由比男性更纯洁的物质构成的，她不易受撒旦的影响。\n\n女性对男性的优越性得到了最有效的证明。亚里士多德可能会说，在所有动物中，雄性比雌性更强壮、更聪明。圣保罗写道，软弱的事物被选中来使强者困惑。"
 PHI_hilario_reincarnation_desc:0 "耶稣基督在第二次降临中不会亲自被认出，因为在《启示录》中我们读到这些话：“我必如贼来到。”同样，在《马太福音》中也记载了这些话：“但那日子、那时辰，没有人知道，连天上的使者也不知道，子也不知道，惟独父知道。”现在，如果我们仔细思考，当一个贼想要抢劫房屋时，他必须伪装自己以避免被任何人发现。\n\n由于耶稣基督的神性，他预见到如果他重返这个世界，将不仅有一个犹大，而是数百万个准备拒绝并否认他神性的人，以及他“人与神平等”或“我与父原为一”的教义。\n\n正是这一教义使犹太人对他发怒，“因为他将自己与神同等。”而现在，蒙卡多将军通过人的道德概念向世界教导“人与神平等”。我们难道要重蹈两千年前犹太人所犯的错误吗？我们真诚地希望这样的事情绝不再发生。一次就够了。今天世界上所有的E.F.B学生都在祈祷，世界绝不能犯同样的错误两次。请不要只是阅读你的圣经，而是要学习它们。仔细阅读以下在《马太福音》24:6-8和《路加福音》21:25-26中记载的经文。其中许多事情已经应验。其他事情即将发生。因为这些都是主的话语。每一句都必将应验。这些预言性的话语如下：\n\n“你们听见打仗和打仗的风声，不要惊慌。因为这些事是必须有的，只是末期还没有到。因为民要攻打民，国要攻打国，多处必有饥荒、地震。这都是灾难的起头。”\n\n“日、月、星辰要显出异兆；地上的邦国也有困苦，因海中波浪的 roar（咆哮）。人想起那将要临到世界的事，就吓得魂不附体。”\n\n这些就是他即将进入这个世界的迹象。但他已不再在门外。他已经进入，并且现在就在你们当中。问题在于你们不知道如何在茫茫人海中找到他。这就像大海捞针。但只有一种方法可以做到，那就是成为一个有道德的人。为了做到这一点，我们必须学习、观察，并“严格、字面、神圣地遵循人的道德概念。”只有有道德的人才能看穿这种伪装。\n\n“我必如贼来到。”如果是这样，那么难怪今天只有少数人能在他的现世形态中找到并相信他。是的，他不再是白人，而是棕色；是菲律宾人，而不是犹太人。这是上帝的作为，真是奇妙。"
 PHI_hilario_six_stars_desc:0 "平等平衡这座新耶路撒冷城由神圣主宰统治。这个名字由蒙卡多将军通过其精神导师洛伦佐·德洛斯·雷耶斯在其著作中提出。他在印度加尔各答的神秘学院教授此课题，因此获得了至高心灵与神秘大师的称号。平等平衡主义是世界真正民主的基础。真正的民主是民有、民治、民享的政府形式。"
