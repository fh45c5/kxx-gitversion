l_simp_chinese:
#日本内战国策
 JSR_raise_the_banner_of_joint_struggle:0 "举起共斗的义帜"
 JSR_raise_the_banner_of_joint_struggle_desc:0 "这原本是一场毫无胜算、也绝无可能发生的联合。那些病态的司法官僚们，用无差别的治安铁腕把所有人都逼进了窒息的阴影里。我们甚至说不清楚，那团最先烧起来的野火究竟是被谁点燃的。在这片被饥荒和萧条折磨得奄奄一息的东北农村里，不知道是发狂的右翼分子，还是混进基层的“赤色暴徒”，就这么莫名其妙地扯出了一面写着“全日本勤劳者共同斗争”的粗糙旗帜。我们彼此厌恶，甚至记不清对方的主义，但既然旧体制的绞索已经套在了所有人的脖子上，那就先把这杆滑稽的义帜举起来吧。"

 JSR_mobilize_labor_unions:0 "动员劳动组合"
 JSR_mobilize_labor_unions_desc:0 "日本东北的劳动者群体极多，对政府不满也是最多的，这里向来是社会大众党等合法无产左翼的重镇，也是农业组合运动的核心。如今内战全面爆发，不论是靠工团分子的主动串联，还是靠青年军官用刺刀强制抓人，我们都必须不择手段地动员他们，以此保障后方的人力与工厂运转。"

 JSR_coopt_veteran_associations:0 "收买乡军团体"
 JSR_coopt_veteran_associations_desc:0 "这些由田中义一模仿德国建立的基层组织向来是右翼的温床，其成员多与各类右翼社团关系极为密切。如今中央政府崩溃，这群退伍军人既可能流向敌对的军政府，也可能在饥饿中与我们为伍。作为极具经验的优质兵源，我们必须动用一切手段将他们收买并拉拢过来，绝不能让这股力量落入敌人手中。"
 
 JSR_launch_nichiren_ikki:0 "发动日莲一揆"
 JSR_launch_nichiren_ikki_desc:0 "这支成分复杂的队伍中，此前没有任何人发现居然混入了大量的宗教狂热徒——曾经震动帝国的血盟团已经在此复兴。大批受到感召的底层农民与寺院僧侣纷纷手持武器走出家门，加入了这场席卷而来的宗教一揆。"
 
 JSR_expropriate_zaibatsu_assets:0 "收缴财阀资产"
 JSR_expropriate_zaibatsu_assets_desc:0 "多年来与政客勾结、靠着投机倒把吸干底层的三井、三菱等大财阀，早已是全日本民众不共戴天的死敌。查封他们的宅邸、没收他们的资金与全部工厂，用这笔满是血汗的庞大资产，来充实我们战时军费与后方物资。"
 
 JSR_smuggling_aid_via_yakuza:0 "通过黑帮走私援助"
 JSR_smuggling_aid_via_yakuza_desc:0 "如今日本基层彻底溃烂，野蛮生长的黑帮与黑市已然掌控了地下秩序。德意志帝国、第三国际以及协约国势力，均已察觉到我们这场起义的庞大势头，并试图借机介入。利用这些黑帮作为中间人，我们可以避开联合舰队的海上封锁，将这些列强各怀鬼胎送来的大批走私援助源源不断地运往前线。"
 
 JSR_do_our_utmost:0 "尽力而为！"
 JSR_do_our_utmost_desc:0 "别吵了，尽力而为吧，至少死得有尊严点！"
 
 JSR_enforce_wartime_centralization:0 "强迫战时集中制"
 JSR_enforce_wartime_centralization_desc:0 "前线各自为战的分散状态极大限制了攻势的有效传导，各部协同脱节的弊端已暴露无遗。为此，各根据地开始全面推行权力的绝对集中，将地方的军事指挥与物资调度强行收归核心。那些在废墟中独揽大权的实力派，其性质也正悄然发生微妙的转变，或许马上就要到革命的终点了。"
 
 JSR_indiscriminate_revolutionary_terror:0 "不可控的革命恐怖"
 JSR_indiscriminate_revolutionary_terror_desc:0 "暴力一旦被作为清算的武器释放，其烈度与走向便再也无法被理智所约束。在秩序荡然无存的街头，原本针对旧体制的惩罚迅速扩大化，大批裹挟在其中的极端分子正借着清算的名义宣泄私愤，将局势推向无差别的恐怖泥潭……"
 
 JSR_rebirth_of_hinomaru:0 "日之丸新生"
 JSR_rebirth_of_hinomaru_desc:0 "漫长的内战终于以我们的胜利告终，我们坐在这座满目疮痍、还在冒烟的废墟上，看着彼此身上那些对方砍出来的伤口，一时间甚至不知道该升起红旗还是白旗。伤痕无法痊愈，废墟依旧冰冷，重新拼凑起来的国家正带着一种难以掩饰的颓废与麻木，迈向未知的明天。"

#进线国策
 JSR_reconstruct_the_rising_sun:0 "重建日出之国"
 JSR_reconstruct_the_rising_sun_desc:0 "废墟之上的胜利终究只是第一步。内战的硝烟尚未散尽，各根据地、前线军官与狂热盲流之间的矛盾便已在权力的真空中彻底摊牌。旧的国家机器已被砸碎，而新的秩序必须在这片还在冒烟的土地上重新建立。"

 JSR_industrial_and_zaibatsu_liquidation:0 "工业与财阀清算"
 JSR_industrial_and_zaibatsu_liquidation_desc:0 "虽然旧财阀的资产在战争期间已被强行收缴，但如何让这些瘫痪的重工业和军工联合体重新运转，则是另一个严峻的现实。是建立绝对集中的中央计划委员会、将一切资源收归国有，还是扶植听话的革新官僚与新型国家垄断资本为军事服务？"

 JSR_land_and_rural_ownership:0 "土地与农村所有制"
 JSR_land_and_rural_ownership_desc:0 "在内战中手持竹枪冲锋的底层贫民与日莲教徒，正等待着新政权兑现最初的承诺。将地主和华族的土地彻底没收并转入集体公社，或是将其作为赏赐分给参军功臣、建立带有军事封建色彩的兵农合一防卫体制？"

 JSR_military_structure_and_command:0 "军队建制与指挥权"
 JSR_military_structure_and_command_desc:0 "战时集中制并没能完全消弭地方实权派的野心。随着大规模战事的结束，这支庞大而混乱的起义军队必须面临重组。是全面建立政治委员制度、实施彻底的意识形态清洗以确保绝对忠诚，还是向现实妥协、允许地方守备队演变为半独立的军阀集团，枪杆子的性质即将定型。"

 JSR_emperor_and_national_polity:0 "皇统与国体问题"
 JSR_emperor_and_national_polity_desc:0 "这是一个无法回避的政治泥潭。当初为了拉拢盲流而勉强抬出来的南朝伪神，如今成了新政权最大的合法性累赘。是彻底否定天皇制、建立毫无保留的共和国，还是假戏真做、正式尊奉南朝皇统，这场关于国家名义的争论已经到了必须摊牌的时刻。"

 JSR_ideology_and_faith_control:0 "意识形态与信仰"
 JSR_ideology_and_faith_control_desc:0 "失控的革命恐怖留下了满街的血泊，而那些陷入宗教狂热的信徒依然盘踞在社会的每一个角落。是将这种极端的信仰与国家主义缝合、把狂热盲流彻底转化为对外扩张的宗教肉弹，还是腾出手来对这些居功自傲的神棍实施冷酷无情的清洗？" 

#起始
 JSR_red_flag_over_tokyo:0 "东京上空，赤旗飘扬！"
 JSR_red_flag_over_tokyo_desc:0 "将进入日本共产党所主导的路线。" 
 JSR_popular_front_government:0 "人民阵线政府"
 JSR_popular_front_government_desc:0 "将进入总评所主导的路线。" 
 JSR_make_osugi_sakae_proud:0 "让大杉荣为我们骄傲"
 JSR_make_osugi_sakae_proud_desc:0 "将进入无政府主义联盟主导的路线。" 
 JSR_maitreya_socialism:0 "社会主义弥勒之世"
 JSR_maitreya_socialism_desc:0 "将进入宗教活动家主导的路线。" 
 JSR_one_country_socialism_under_imperial_majesty:0 "皇威下的一国社会主义"
 JSR_one_country_socialism_under_imperial_majesty_desc:0 "将进入左翼转向者所主导的路线。" 

#事件
 SCBJSR.1.t:0 "南朝的幽灵"
 SCBJSR.1.d:0 "随着日莲一揆的狂热兴起，内战的走向正逐渐脱离所有人的预料。在那些手持竹枪的僧侣与农民的簇拥下，一个自称南朝正统后裔、名叫熊泽宽道的男人被推到了台前。日莲教徒们坚信他才是日本合法的真主，并以此为号召疯狂扩充队伍。\n在他们口中，当年的萨长逆贼毒杀了孝明天皇，伊藤博文更是用长州奇兵队的贱民掉包了后来的明治天皇——这意味着长久以来的东京朝廷不过是一群篡位者的伪政权。\n原本在青森官邸的秩父宫雍仁亲王已经逃回东京，我们手里彻底失去了可以对垒的御旗。面对这套荒诞不经却在民间极具煽动力的旗号，大部分起义军官已决定顺应大势，将其作为革新的合法性来源。"
 SCBJSR.1.a:0 "哪怕是泥塑的伪神，现在也能派上用场。"
 SCBJSR.2.t:0 "民族主义者的动员"
 SCBJSR.2.d:0 "西田税的奔走终于有了结果——乡村里的农会、町内会，还有那些从战场上归来的老兵，几乎全都站到了我们这边。他们握着锄头的手、握过步枪的手，如今都将为同一个目标而举起。"
 SCBJSR.2.a:0 "团结一致"
 SCBJSR.3.t:0 "必要之恶?"
 SCBJSR.3.d:0 "局势失控得比预想的快。清算的范围越扩越大，队伍也越来越杂。很快就有消息传上来——有人借着清算的由头报私仇，有人趁乱抢东西，还有的地方把旧怨邻里纠纷全包装成了 “对敌斗争”，乌烟瘴气。\n义军指挥部连发了几道禁令，措辞一封比一封严厉，要求严禁私刑、不准公报私仇。可命令发下去，收效甚微。\n指挥体系早就乱了套，有些队伍名义上归我们管，实际上根本调不动；有些命令传着传着就变了味，还有的干脆石沉大海。\n能做的实在太少了。少到甚至分不清——到底是我们在指挥这支队伍，还是它已经自顾自地往前跑，把我们甩在了后面。"
 SCBJSR.3.a:0 "脱缰的野马..."
 SCBJSR.4.t:0 "大会开幕"
 SCBJSR.4.d:0 "会议定在东京的一座旧会馆里举行。门口的石狮子还留着炮弹擦过的痕迹，台阶上的血迹虽然冲刷过了，却还是能隐约看见深色的印子。代表们从各地赶来，有的穿着军装，有的穿着便服，一个个风尘仆仆，脸上都带着战争留下的疲惫。\n当那几个穿着军装的军官走进会场时，角落里立刻响起了几声不满的冷哼。有人当场就黑了脸，还有几个代表直接起身，坐到了离他们最远的位置上。但不满归不满，终究没有人真的闹起来。\n于是，在一片微妙的沉默里，会议就这样开始了...."
 SCBJSR.4.a:0 "让我们开始吧"
 SCBJSR.5.t:0 "第一项：土地改革"
 SCBJSR.5.d:0 "第一项议题当然是土地改革。\n皇道派与日本共产党加上其他的激进左翼立场强硬，主张立刻全国土地国有化，直接分给农民，认为这是革命的根本，不容妥协。而社大党领导的温和左翼则坚持渐进式改革——先减租减息，再逐步赎买，用三到五年平稳过渡，避免过激措施冲击农业生产。此举获得了大多数旧官僚的支持，他们未必赞成改革，但比起掀桌子式的国有化，渐进赎买至少还留有余地。两派各执一词，吵了将近一个小时。激进派骂温和派“妥协主义”，温和派说激进派“蛮干误国”，主席台上的人看着台下，沉默了几秒，然后开口宣布了结果......"
 SCBJSR.5.a:0 "国有化必须马上实施"
 SCBJSR.5.b:0 "渐进式方案更受青睐"
 SCBJSR.6.t:0 "第二项：财阀问题"
 SCBJSR.6.d:0 "第二项议题，是财阀国有化。\n内战期间，三井、三菱、住友这些大财阀的资产大多已经被收缴，名义上都归了国家。但收上来之后怎么办，是建立集中的中央计划委员会，还是换个方式继续用，会上吵成了一团。\n西尾末广站出来发言的时候，会场安静了不少。他条理清晰地分析利弊 —— 财阀的技术、资金、管理体系，都是现成的好东西，与其全部砸碎，不如与财阀们达成某种妥协协议，使其为我们的军事服务。这样既保住了工业底子，又能让国家机器更快地运转起来。皇道派的人纷纷点头。一听这些东西最后是为军队服务的，觉得很对胃口，不少人当场就表示赞成。\n更激进的右翼分子坐在后排，他们同日本共产党成员一唱一和：从西尾开口就没停过，有人嘘，有人吹口哨，还有人低声骂“换汤不换药”、“和财阀穿一条裤子”。他们觉得，既然革命了，就要革得彻底，凡是和旧时代沾边的，都该扫进垃圾堆，留着就是隐患。嘘声一阵接一阵，好几次差点盖过西尾的声音。但他站在台上，面不改色，自顾自地把话讲完了。\n发言结束，台下掌声和嘘声混在一起，乱糟糟的。\n最后还是要投票。\n主席台上的人清了清嗓子，准备宣布结果....."
 SCBJSR.6.a:0 "让财界报公 我们需要他们协助"
 SCBJSR.6.b:0 "必须执行国有化——就像革新官僚那样"
 SCBJSR.7.t:0 "第三项：国体之争"
 SCBJSR.7.d:0 "第三项议题，也是最敏感的一项——国体。\n议题一抛出来，会场的温度就降了几度。土地怎么分、财阀怎么办，说到底都是利益问题；但国体是什么，牵扯的是这个国家的根。\n民族主义者的态度很明确。他们支持美浓部博士的法人论，认为天皇是国家的机关，而不是国家本身。至于现在坐在皇位上的那个熊泽，根本就是个冒牌货，必须赶走——真正的天皇，应该是明仁亲王。他们的理由很简单：明仁是正统血脉，年纪轻，没被旧时代的糟粕污染，正好可以作为新日本的象征。\n日本共产党的立场更彻底，们站起来发言，主张直接废除天皇制度，仿照俄国的路线，建立一个共和国。话说完，左翼席位上响起一片掌声，其他地方却安静得很。\n最吵的，是那些狂热的宗教徒。他们坐在会场的角落里，人数不多，但嗓门极大。一听到有人说要废除天皇、有人说熊泽是假的，当场就炸了锅。有人拍着桌子喊“熊泽陛下是天照大神的后裔”，有人站起来破口大骂“你们都是叛贼”\n有人拍桌子،有人站起来对骂،角落里的宗教徒甚至开始唱国歌،声音又跑调又刺耳。在一片混乱中،结果出现了..."
 SCBJSR.7.a:0 "明仁亲王的提案获得通过"
 SCBJSR.7.b:0 "共和国提案获得了多数"
 SCBJSR.7.c:0 "维持现状的提案占了上风"
 SCBJSR.8.t:0 "第四项：军队问题"
 SCBJSR.8.d:0 "第四项，军队。\n内战中，军队体系乱成什么样，所有人都看在眼里。番号重复、指挥脱节、各路人马各自为政，有时候友军和敌军都分不清。仗打完了，军队怎么办，是必须解决的问题。\n共产党人率先发难。他们要求彻底重组军队体系，从编制到指挥全部推倒重来，并且在各级部队设立政治委员，负责思想督导，确保军队对党、对革命的绝对忠诚。\n皇道派等激进右翼表示强烈反对，军队就是军队，打仗的事让不懂行的文官插手，简直是胡闹。更重要的是，他们要求保留各地的地方守备队。这些守备队大多是内战期间就地拉起的队伍，皇道派在里面根基很深，若让文官插手，相当于自毁根基。\n结果就在会场的火药味越来越浓之中诞生。"
 SCBJSR.8.a:0 "重组军队的提案勉强通过"
 SCBJSR.8.b:0 "多数人选择妥协，支持了保留地方部队一方"
 SCBJSR.9.t:0 "意识形态问题"
 SCBJSR.9.d:0 "最后一项议题，也是决定这个新政权精神底色的终极论战——意识形态。\n东方会的领袖中野正刚缓步走上讲台。尽管他并非北一辉的盲从者，但他那充满煽动力的雄辩瞬间引爆了会场。他极力鼓吹一种激进的议会制国家社会主义方案，声称必须建立绝对的计划威权，将国家的政治、经济与精神力量融为一体。台下的激进左翼、部分革新官僚，甚至一些日本共产党的代表席位上，都罕见地为他响起了狂热的欢呼。在他们眼中，这是砸碎旧世界最现代、最彻底的铁腕兵器。\n然而，尖锐的反驳声随即从另一侧爆发。皇道派的青年军官们对此嗤之以鼻，在他们看来，欧洲式的工业怪物根本不适合这片土地，权藤成卿的“农本主义”才是唯一符合日本国情的正确道路。这一主张得到了赤尾敏、平野力三等长期从事皇道主义农民运动的议员和实力派的全力支持。他们拍案而起，怒斥中野的方案是“出卖日本灵魂的工厂奴役”，坚称只有回归农村共同体、实行兵农合一的自治，才能真正拯救这个国家。\n会场彻底陷入了内战结束以来最混乱的撕裂。两派学者、军官与议员从最初的理论争鸣演变为人身攻击，甚至演变成掀翻桌椅的肢体冲突。主席台上的木槌几近敲碎，也无法按捺住台下那近乎疯狂的咆哮。在一片无法调和的嘈杂与敌视中，最终的表决结果被呈递了上来……"
 SCBJSR.9.a:0 "国家社会主义是世界之大势，不可错过巴士。"
 SCBJSR.9.b:0 "农本主义乃最符合我国之正确道路。"
 SCBJSR.9.c:0 "完全没有结果，多数人马吵得不可开交"
 SCBJSR.10.t:0 "大会落幕"
 SCBJSR.10.d:0 "最后 大会就在吵闹的气氛中结束了 最后的赢家是...."
 SCBJSR.10.a:0 "野坂参三率领的赤军以及田中清玄率领的黑帮强行闯入，大会中止。"
 SCBJSR.10.b:0 "左翼抬出了无政府主义者石川三四郎，大会诡异的结束了。"
 SCBJSR.10.c:0 "在西田税的号召下，皇道派砸烂了会议厅，强行将大会中止。"
 SCBJSR.10.e:0 "狂热的日莲、大本教徒占领了会议厅，大会中止。"
 SCBJSR.10.f:0 "由山川均牵头的左翼人民阵线取得了多数"
 SCBJSR.10.g:0 "由西尾末广牵头的右翼人民阵线获得了多数"
 SCBJSR.10.h:0 "由各个温和左派组成的人民阵线获得了多数"


