 ncar.1.t:0 "[GetYear]年西班牙全国知识分子大会"
 ncar.1.desc:0 "西班牙军界向来缺乏创新精神，即便在两栖登陆、电动潜艇及应急反坦克武器等领域偶有突破，其装备水平仍落后于邻国数十年，实在难以令国民信服。为此，国内军事领域的顶尖科学家与技术专家齐聚一堂，召开首届西班牙全国知识分子大会，汇聚各地军民工程师，共商军备采购与研发大计。民用工程界的代表是铁路与汽车工业先驱安赫尔·西里洛·丘埃卡·萨因斯，他引领西班牙机动化进程已近三十载。航空界的代表包括费德里科·坎特罗、胡安·德拉谢尔瓦和豪尔赫·洛林·马丁内斯——前两位是旋翼机与直升机领域的权威，后者则是著名飞机设计师。\n\n空军总司令阿尔弗雷多·金德兰代表空军出席，海军研发总负责人文塞斯劳·贝尼特斯·因格洛特上将亦列席会议，他曾推动首艘水上飞机母舰及舰载旋翼机的应用。陆军代表曼努埃尔·阿里亚斯-帕斯与鲁伊斯·德·托莱多则精通军用车辆与装甲技术。最后，还有鲜为人知却至关重要的核武器研发领域代表何塞·马里亚·奥特罗·德·纳瓦斯库埃斯。大会于昨日开幕，直指西班牙军民产业的困境：西里洛痛陈铁路系统破败陈旧，卡车等民用车辆极度短缺，国内产业振兴举步维艰。\n\n空军与民航界代表抱怨国内缺乏先进的飞机制造设施与资源供应链，所有生产设计均依赖外国授权。海军状况虽略优于其他军种，也坦言潜艇技术及雷达、电子通信等海事科技已严重落后于时代。陆军代表则认为，坦克、现代火炮乃至合格枪械的短缺实为军备大忌。经过漫长磋商，各方最终就军民需求达成共识，拟定支出提案提交西班牙政府，决议……"
 ncar.1.d:0 "原子才是重中之重"
 ncar.1.a:0 "给陆军搞些新玩意"
 ncar.1.b:0 "给海军上些高科技"
 ncar.1.c:0 "给空军弄些好东西"
 ncar.1.e:0 "专注基础科学进步"
 ncar.2.t:0 "大学城"
 ncar.2.d:0 "坐落于马德里蒙克洛亚-阿拉瓦卡区的大学城，是僭主阿方索十三世为了彰显自己厚爱科学所下令建造的，当时被誉为照亮整个西班牙的启蒙灯塔。大学城的构想最早可以追溯至1911年，而其现代蓝图则是由僭主阿方索十三世一手创建，1927年阿方索十三世颁布王家法令正式启动这项工程。经验丰富的建筑师莫德斯托·洛佩斯·奥特罗负责总体规划，但他刻意启用大批新锐人才，让年轻工程师与建筑师们竞相施展才华。\n\n作为科学圣地的摇篮，大学城汇聚了众多突破传统的设计奇才：前卫派大师曼努埃尔·桑切斯·阿尔卡斯与“混凝土魔术师”爱德华多·托罗哈等名家，在此留下了惊世之作。僭主不惜无偿划拨建设用地，阿格罗曼建筑公司承担了主要工程。从设计之初，这座城中城就规划了容纳数万师生的空间，将休闲中心、商业区、教职工公寓与运动场馆完美融入校园。\n\n借鉴麻省理工、哈佛与耶鲁的美国校园模式，这曾是当时最具野心的前瞻性工程。然而1932-1936年的社会动荡与学生抗议使建设一度中断，尽管僭主阿方索十三世略表抗议，大部分校区仍然烂尾。黑色星期一后的财政紧缩让保守派政府将这里视作工团主义温床而刻意冷落。如今随着西班牙经济复苏，停工多年的工地再度轰鸣，僭主阿方索十三世未完成之事将由我们来完成。"
 ncar.2.a:0 "现在这里属于我们了"
 ncar.3.t:0 "葡萄牙对奥利文萨再起贪欲"
 ncar.3.d:0 "在波旁·帕尔马王朝复辟后，西班牙与葡萄牙的关系日渐升温，但两国并非始终如此和睦，奥利文萨小镇便是双方外交史上的长期争议焦点。1801年《巴达霍斯条约》签订后该地划归西班牙，此后葡萄牙多次企图夺回。直到1926年，西班牙普里莫·德·里韦拉政府与葡萄牙王室就奥利文萨边界问题达成基本令双方满意的协议，这一争端才看似尘埃落定。\n\n尽管西班牙过去几十年危机频发，葡萄牙始终遵守着这些协定。但如今局势急转直下，就在一周前，葡萄牙境内成立了奥利文萨光复会。我们在里斯本的情报人员证实，这个施压团体旨在鼓动葡萄牙整合主义政府通过外交或武力手段收复该地。这种诉求并非全无依据：即便经历近一个半世纪的西班牙统治，当地居民仍普遍使用葡萄牙语。鉴于近期安哥拉和莫桑比克殖民地的动荡局势，以及中央非洲巨人的扩张野心，葡萄牙政府本应无暇他顾。但仍有危言耸听者主张增派驻军以防不测。"
 ncar.3.a:0 "装腔作势而已"
 ncar.3.b:0 "增派部队，以防不测"
 ncar.4.t:0 "大赦免？"
 ncar.4.d:0 "在卡洛斯派重夺正统王位之后，如何处置关押在狱中的政治犯，引发了团契内极为激烈的争执。这批前政府的成员要么曾参与伪王国的议会立法，要么就是直接效忠于僭主阿方索十三世的军事人员。事实上，这群投机分子此前对镇压卡洛斯派的起义根本毫无热情，在伪政权内部，他们大部分精力都耗费在了勾心斗角的权力争夺上；直到我们公然举旗倒戈、大军压境之时，他们才在僭主阿方索十三世的严令强逼下，不情不愿地拿起武器抵抗。大部分人建议宽大赦免这批政治犯。一方面，这群庸碌之辈在战事中摇摆不定，不仅没能对我们的义军造成实质损伤，反而因内耗加速了伪政权的溃败，赦免他们甚至带有某种别样的讽刺意味；另一方面，这些留在西班牙本土未及逃亡的政客绝大多数依然是保守的天主教徒，其中不少人甚至在数年前曾与我们共事过。若在大局已定之际开棺定论、大开杀戒，未免显得过于冷酷无情。而且这批人在旧体制内盘根错节，我们完全可以借其手来安抚其他摇摆不定的政治势力、稳定战后秩序，从而彻底拔除流亡海外的阿方索十三世在本土的所有残余力量。然而整合主义者并不认同宽大赦免的建议，他们强烈要求将这批政治犯处决。在他们看来，这群曾经向伪王宣誓效忠的政客是不可信任的投机分子，任何政治妥协都是对卡洛斯派长久以来流血牺牲的背叛。唯有用这批逆贼的鲜血，才能洗涤伪王国留下的污秽，保护我们新王国不受邪恶的自由主义余毒侵蚀，也是为了洗刷历代卡洛斯战争失败的耻辱。"
 ncar.4.a:0 "滚，或者死"
 ncar.4.b:0 "赦免他们以表仁慈"
 ncar.5.t:0 "长枪党崛起"
 ncar.5.d:0 "西班牙王国的前效忠者、独裁将军米格尔·普里莫·德·里维拉之子何塞·安东尼奥·普里莫·德·里维拉，于不久前正式组建了西班牙长枪党。这个新诞生的政治组织极其特殊，其内部的成员构成错综复杂：它不仅吸纳了大批先前被我们赦免的政治犯（其中相当一部分是原西班牙王国的旧军官与军事人员），还从社会最底层招募了不少对当下的经济窘境与政治现状深感不满的无产阶级群众。表面上看，长枪党自诩为一个坚定的右翼政党，但令人感到奇怪的是其党内却充斥着大量的左翼理论家与激进分子。伊比利亚无政府主义联盟著名叛乱领袖布维那文图拉·杜鲁蒂的亲弟弟马尔恰诺·佩德罗·杜鲁蒂（其本人亦曾是该组织的核心成员），如今也公然加入了长枪党的阵营。此外，部分效忠于国家工团主义进攻委员会的国家工团主义者也在暗中为其提供支持与资源。\n\n对我们而言，这些复杂的背景或许尚不足以构成致命威胁，真正令人担忧的，是他们正源源不断地从我们手中争夺传统的保守派群众。就在不久前，著名理论大师何塞·马利亚·卡斯特罗维霍突然宣布脱离传统主义团契转而投奔长枪党。这一重大变故对我们构成了极沉重的打击，也为我们敲响了警钟。然而，考虑到他们在总体战略目标上与我们尚有交集与重合之处，或许我们之间并非完全没有达成和平妥协或建立临时盟友关系的可能？"
 ncar.5.a:0 "一个危险的信号......"
 ncar.5.b:0 "或许可以信任他们"
 ncar.6.t:0 "新国家，新国王"
 ncar.6.d:0 "漫长的摄政时代终于迎来了落幕的时刻。在成功理顺并妥善处理完全部的国内事务后，唐·哈维尔阁下正式向摄政议会递交了辞呈，卸去摄政王一职。随着摄政职务的交接完毕，摄政议会也顺理成章地迈入了最核心的议程：选王。目前，卡洛斯派内部所认可的正统王位继承人主要有两位。第一位便是刚刚卸任的摄政王、来自波旁-帕尔马家族的唐·哈维尔阁下。绝大多数正统派人士都对哈维尔阁下持高度满意的态度。在其担任摄政王期间，哈维尔阁下收拾了前任政府留下的种种棘手烂摊子，并带领国家一步步走出阴霾，全面步入战后与体制的重建阶段。无论是在政绩还是声望上，由哈维尔阁下顺应民意继承王位，早已是朝野上下众望所归的共识。然而，王位的竞逐者中还有另一位不容忽视的强劲候选人，来自哈布斯堡-洛林家族的卡尔·皮乌斯大公。大公出生于显赫的维也纳宫廷，身兼波旁家族与哈布斯堡家族的血脉，拥有极为独特的贵族血统背景。在西班牙内战最艰难的时期，卡尔·皮乌斯大公凭借其在维也纳宫廷的深厚人脉，为卡洛斯派争取到了弥足珍贵的军事援助与资金支持；不仅如此，他还在维也纳亲自协调资源，为卡洛斯派民兵提供了极其专业的现代军事化训练，为传统主义团契最终成功夺取政权做出了不可磨灭的卓越贡献。如今，两位候选人各有千秋、功勋卓著。只待摄政议会的表决结果出炉，西班牙王国便将正式迎来属于它的新一任国王。"
 ncar.6.a:0 "唐·哈维尔殿下在祝福下加冕为王！"
 ncar.6.b:0 "摄政议会更偏爱卡尔·皮乌斯大公！"
 ncar.7.t:0 "受冷落的团契左翼"
 ncar.7.d:0 "在摄政议会围绕选王大计展开激烈辩论之际，传统主义阵营内部的左翼派系却正承受着冷遇与边缘化。他们不仅被彻底排斥在核心议题的探讨之外，甚至连公开发表意见、投票支持心仪国王候选人的基本权利都被剥夺殆尽。“左翼传统主义”作为一种近期兴起的新锐思潮，其追随者认为卡洛斯主义的核心理念与自治社会主义存在着意想不到的契合之处。基于这一认知，他们主张通过社会主义的路径和架构来践行并实现卡洛斯派的终极愿景。然而，团契内部的绝大多数传统主义者根本不承认这群人的阵营身份。尽管卡洛斯派在历史长河中往往被外界误贴上“保守”与“反动”的刻板标签但真实情况远比这复杂，不可否认的是传统主义团契的主导权依然牢牢掌握在右翼派系手中。即便连唐·哈维尔阁下本人也承认卡洛斯派与部分左翼思想存在相通之处，但他始终保持着高度警惕，极力遏制并避免整个传统主义团契全面向左翼倾斜。\n\n如今，这群备受压制的左翼传统主义者迫切希望终结当前不公的现状。他们正式向议会提出诉求，要求摄政议会一视同仁赋予左翼派系与其他主流派系完全平等的政治权利。这无疑让议会陷入了微妙的困境：尽管我们自身对左翼主张毫无兴趣，且内部相当一部分成员认为社会主义是一种有害无益的危险思潮，但若是一口回绝他们的合理诉求，恐怕难以彰显议会应有的公正与胸襟，甚至极易引发社会大众对摄政议会决策权威性与合法性的质疑。"
 ncar.7.a:0 "我们都是传统主义者，他们应该有表决权"
 ncar.7.b:0 "左翼给我滚出去好吗？"
 ncar.8.t:0 "左右之争"
 ncar.8.d:0 "尽管我们已竭尽全力阻止传统主义团契向左翼倾斜，但摄政议会越界的激进举措还是导致半壁江山落入了左派之手。令人震惊的是怀揣社会主义信仰的传统主义者数量远超预估，自治社会主义对当代保守派大众产生了前所未有的巨大诱惑，在他们眼里，这种制度成了唯一能够化解西班牙数百年来根深蒂固的民族矛盾与急剧恶化的贫富差距的救世良方；然而，右翼势力却始终将社会主义奉为洪水猛兽，断言在西班牙推行社会主义无异于自掘坟墓的慢性自杀。尽管两派在诸多核心诉求与思想主张上有着不少的相似之处，但在思想上根深蒂固的保守右翼对社会主义抱有难以改变的偏见与敌意，双方唇枪舌剑、互不相让，谁也无法说服对方接受己方的立场，积怨已久的理念鸿沟最终在摄政议会彻底爆发，双方势要争辩出一个高下。"
 ncar.8.a:0 "左翼以新颖的观点说服了摄政议会"
 ncar.8.b:0 "尽管如此右翼还是更符合传统主义"
 ncar.9.t:0 "不可思议的转向"
 ncar.9.d:0 "胡安·拉吉亚·利特拉斯作为巴塞罗那“自由工会”的核心理论家，强调工会应摆脱政党控制与阶级斗争学说，主张结合天主教社会思想与地方自治，反对全国劳工联合会和伊比利亚无政府主义联盟的暴力罢工，提倡通过与雇主及政府建立合作协调机制来保障工人合法权益；伊格纳西奥·罗梅罗·奥斯本作为左翼卡洛斯主义的重要推动者及呼啸兵团老兵兄弟会领袖，主张将西班牙传统的波旁-帕尔马王朝君主制与反集权的自治社会主义、联邦制相融合，打破传统的右翼保守标签，主张通过民主化改革、工人自管以及承认西班牙各区域自决权来实现社会公平与民主转型；而马西米利亚诺·阿尔博莱亚神父作为西班牙天主教社会运动与“独立工会”理念的核心倡导者，则主张建立超越政党意识形态与激进政治干涉的专业化天主教工人组织，强调工会的纯粹性与独立性，反对无政府主义和马克思主义的暴力革命，主张依据教皇百科全书《新事》的精神，通过职业技能培训、互助保险以及有节制的劳资协商来改善工人阶层生活的实际福利与道德秩序。"
 ncar.9.a:0 "自由工会一骑绝尘！"
 ncar.9.b:0 "团契左翼为王执缰！"
 ncar.9.c:0 "独立工团与工人耶稣！"
 ncar.10.t:0 "公开叛乱"
 ncar.10.d:0 "左翼卡洛斯主义者与传统主义团契扶持的外围工会团体希望在摄政议会中获取正式表决权，但该提议遭到了传统主义团契右翼的严词否决，事件过后左翼在政治阵营中彻底丧失了话语权与影响力。尽管摄政议会内部有不少议员试图调和左右两翼的矛盾，并以维护卡洛斯派整体利益为由劝说右翼做出让步许可左翼代表进入议会，但这些斡旋最终全部以失败告终；传统主义右翼将社会主义归类为自由主义毒草的衍生品，绝不愿放下意识形态偏见去同左翼握手言和。深受打压且心怀强烈不满的左翼势力随后选择铤而走险，他们在无政府主义组织的暗中协助下开始秘密组织军事训练，妄图通过武装暴动彻底颠覆传统主义政权。左翼首先在工运根基深厚的巴塞罗那构筑了秘密据点，随后又与阿拉贡地区的无政府主义武装达成临时军事同盟，密谋分批向卡洛斯派的政治心脏布尔戈斯进行武装渗透，并且还在巴斯克民族主义者的默许下顺利获得了毕尔巴鄂地区的人员与物资支持。然而这场政变密谋很快便宣告败露；忠于政府的人民行动青年团反应极为迅速，事发当天便动员了散布在全国各地的待命军事人员，并在获得国王的默许后调动正规军力量进行围剿，凭藉绝对的武力优势将这场政变阴谋彻底绞杀在摇篮之中，而此前陷入瘫痪状态并引发连串动荡的摄政议会也在人民行动青年团的严密监管下被强制解散。"
 ncar.10.a:0 "人民行动青年团万岁！"
 ncar.11.t:0 "最后赢家"
 ncar.11.d:0 "在人民行动青年团对左翼势力大动干戈之际，此前获得国王信任与宽恕的长枪党敏锐地察觉到了这一绝妙的时机。长枪党领袖何塞·安东尼奥·普里莫·德·里维拉与党内高层商讨后决定主动出击。当摄政议会在人民行动青年团的监管下被迫解散后全国各地的行政与治安系统瞬间陷入了严重混乱状态。而长枪党在卡斯蒂利亚和马德里地区凭借人脉迅速赢得了当地驻军与军官阶层的全力支持，顺理成章地接管了该区域的所有行政、军事与治安事务。与此同时，远在布尔戈斯的传统主义团契中央对这场剧变毫不知情，高层领袖们仍陷于内部派系利益的无休止争吵之中。传统主义团契内部的右翼势力对人民行动青年团强行解散议会的越界行为表示强烈不满，并在公开场合极力痛斥其暴行联名请求国王立即恢复摄政议会以稳定局势。长枪党则利用这段政局真空期继续推进自己的计划，逐步将各地心怀不满的呼啸兵部队与民间防卫力量纳入自身的指挥体系之下。随着布尔戈斯城外响起一声枪响，长枪党的精锐武装人员迅速冲入城内包围了议事大厅，将还在厅内激烈争吵的各方政治势力全部扣押控制。随后何塞·安东尼奥·普里莫·德·里维拉在拥护下前往了布尔戈斯的广播电台向全西班牙发表广播讲话，正式宣告一个了全新时代的到来，而各地区仍然忠于国王的反对势力在自知反抗无望之后宣布向新政府效忠。"
 ncar.11.a:0 "革命万岁...？"
 ncar.12.t:0 "分裂的党"
 ncar.12.d:0 "西班牙长枪党内部派系林立，其左右两派的理念分歧甚至比一般政党之间的鸿沟还要深剧。左派阵营的成分极为复杂，涵盖了激进的国家主义者、国家工团主义者、具有无政府主义倾向的理论家以及来自基层的工会代表。这些心怀社会变革愿望的左翼分子逐渐团结在深受底层信任的曼努埃尔·赫迪拉周围。与此相对，右派阵营则大多是党的创始人何塞·安东尼奥·普里莫·德·里维拉的忠实拥趸；此外，在传统主义团契陷入解体危机之际，不少恪守君主制与天主教传统理念的保守派分子也选择加入长枪党从而进一步壮大了右翼力量。\n\n尽管左右两派在经济政策、社会变革的深度以及国家架构上存在巨大矛盾，但令人奇妙的是，他们都共同将何塞·安东尼奥尊为党的唯一精神领袖。面对党内日益尖锐的对立，何塞·安东尼奥并不希望通过强硬清洗或暴力镇压来解决问题，而是渴望找到一种较为和平且循序渐进的方式，一劳永逸地化解长枪党内部的意识形态纷争。然而，这一弥合分歧的过程让他深陷两难境地。一方面，曼努埃尔·赫迪拉是他极其器重、具有广泛群众基础的底层无产阶级党员代表；另一方面，以拉斐尔·桑切斯·马萨斯为首的右翼高层不仅是党内的理论核心，更是与他并肩作战多年的私交挚友。面对一边是阶级情谊与底层民意，另一边是思想同盟与挚友情谊的局面，作为最高领袖的他很难直接偏向任何一方。在难以决断的苦衷之下，他只能选择暂时搁置争议，将路线选择权交给中央委员会，静待全党代表讨论后再最终决定长枪党未来走向何方。"
 ncar.12.a:0 "领袖同右翼站在一起！"
 ncar.12.b:0 "领袖同左翼站在一起！"
 ncar.13.t:0 "何为我？"
 ncar.13.d:0 "何塞·安东尼奥·普里莫·德·里维拉，这位前独裁者米格尔将军的贵胄之子，早年曾誓死效忠国王与祖国的宏图远业，一度被右翼军人们拥戴为阶层的救世主与代言人。然而命运的齿轮剧烈转动，如今的他，究竟在为何而战，又在为谁倾尽心血？为了给所有在这个动荡时代里无家可归的异见者提供避风港，无论他们来自左翼的激进分子，还是右翼的保守主义者，长枪党在他手中应运而生。在此期间，拉米罗·莱德斯马·拉莫斯那带有强烈倾覆性的思想风暴侵入了安东尼奥的世界，让他开始对新兴的国家工团主义产生浓厚兴趣。然而，莱德斯马身上那股难以抹除的草根恶臭以及属于无产阶级那近乎野蛮的暴躁冲动最终让举止优雅的安东尼奥心生隔阂，二人渐行渐远。不久之后，在挚友拉斐尔·桑切斯·马切斯的引导下，他重拾了对上帝的虔诚信仰，找到了灵魂深处的精神锚点。\n\n可悲的是，这些纷至沓来的主义与思想，似乎没有一种真正属于他自己。他宛如一副被时代强行灌注的空壳，任由世人将各式各样的政治理论、社会幻想与宗教教条塞入其中。但顺从命运的安排从来不是安东尼奥所能忍受的宿命。他如同一轮喷薄而出的骄阳，轰然从伊比利亚半岛的辽阔大地上升起，以灼热的雷霆手段将一切胆敢忤逆反对他的逆贼扫入垃圾堆中。可太阳的光芒实在过于耀眼夺目了，漫天散发的光辉反而彻底遮蔽了他的真实轮廓。狂辉之中，你的身影渐渐模糊。我快要看不清你了，德·里维拉，在那重重被强加的标签与光环之下，究竟哪个才是真正属于你的灵魂？"
 ncar.13.a:0 "我，小德里维拉，民主的捍卫者"
 ncar.13.b:0 "我，小德里维拉，忠于祖国与传统主义"
 ncar.13.c:0 "我，小德里维拉，长枪党永恒的领袖"
 ncar.13.e:0 "我，小德里维拉，上帝最虔诚的信徒"
 ncar.14.t:0 "何为我？"
 ncar.14.d:0 "何塞·安东尼奥·普里莫·德·里维拉，这位前独裁者米格尔将军的贵胄之子，早年曾誓死效忠国王与祖国的宏图远业，一度被右翼军人们拥戴为阶层的救世主与代言人。然而命运的齿轮剧烈转动，如今的他，究竟在为何而战，又在为谁倾尽心血？为了给所有在这个动荡时代里无家可归的异见者提供避风港，无论他们来自左翼的激进分子，还是右翼的保守主义者，长枪党在他手中应运而生。在此期间，拉米罗·莱德斯马·拉莫斯那带有强烈倾覆性的思想风暴侵入了安东尼奥的世界，让他开始对新兴的国家工团主义产生浓厚兴趣。然而，莱德斯马身上那股难以抹除的草根恶臭以及属于无产阶级那近乎野蛮的暴躁冲动最终让举止优雅的安东尼奥心生隔阂，二人渐行渐远。不久之后，在挚友拉斐尔·桑切斯·马切斯的引导下，他重拾了对上帝的虔诚信仰，找到了灵魂深处的精神锚点。\n\n可悲的是，这些纷至沓来的主义与思想，似乎没有一种真正属于他自己。他宛如一副被时代强行灌注的空壳，任由世人将各式各样的政治理论、社会幻想与宗教教条塞入其中。但顺从命运的安排从来不是安东尼奥所能忍受的宿命。他如同一轮喷薄而出的骄阳，轰然从伊比利亚半岛的辽阔大地上升起，以灼热的雷霆手段将一切胆敢忤逆反对他的逆贼扫入垃圾堆中。可太阳的光芒实在过于耀眼夺目了，漫天散发的光辉反而彻底遮蔽了他的真实轮廓。狂辉之中，你的身影渐渐模糊。我快要看不清你了，德·里维拉，在那重重被强加的标签与光环之下，究竟哪个才是真正属于你的灵魂？"
 ncar.14.a:0 "我，小德里维拉，国家主义革命的先驱"
 ncar.14.b:0 "我，小德里维拉，一名忠诚的工团主义者"
 ncar.14.c:0 "我，小德里维拉，为国民的自由而生"
