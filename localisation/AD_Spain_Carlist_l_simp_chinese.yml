 CAR_divisive_traditionalists_idea:0 "分裂的传统主义者"
 CAR_divisive_traditionalists_idea_desc:0 "卡洛斯派的分裂其实由来已久，奥克塔维奥派、哈维尔派、整合主义者，各派都秉持着属于自己的一份信条。奥克塔维奥派效忠于奥地利的卡尔·皮乌斯大公，他的追随者称他为卡洛斯八世；1936年初，阿方索·卡洛斯一世逝世，哈维尔亲王宣布摄政，但他的支持者不满于他仅作为摄政的地位，于是在私下里称哈维尔亲王为哈维尔一世。哈维尔亲王的追随者是卡洛斯派中人数最多的，其次是整合主义者。整合主义者是卡洛斯派极端理论家和前领导者胡安·巴斯克斯·德·梅利亚的支持者，他们是一支更加激进的传统主义派别。1914年，各方签署了拉蒙·奥贝尔协议，暂时放下分歧，但统一局面并未维持太久便告结束。1919年，整合主义者彻底脱离海梅三世的领导，转而组建了西班牙整合党。直到1934年，各方又在贪婪的共和国以及僭主阿方索十三世的打压下而团结，但这样的团结又能维持多久呢？"
 CAR_young_requete_idea:0 "青年呼啸兵"
 CAR_carlist_mutual_aid_society_idea:0 "卡洛斯派互助会"
 CAR_democracia_organica_idea:0 "有机民主制"
 CAR_carlist_unity_idea:0 "卡洛斯派团结"
 CAR_carlist_unity_idea_desc:0 "三次卡洛斯战争的失败告诉我们，如果要真正的走向胜利那卡洛斯派就必须要团结一致，即使我们目前有很大的分歧，但没有什么困难是无法解决的，为了我们祖国荣耀的复兴，为了抵御僭主阿方索十三世与赤色分子的反扑，我们必须在圣安德烈十字旗下团结！"
 CAR_the_one_and_only_king_idea:0 "独一之王"
 CAR_the_one_and_only_king_idea_desc:0 "无论是什么哈布斯堡王朝的僭越者卡洛斯八世还是整合主义者都滚蛋吧，卡洛斯派和神圣的西班牙王国只需要一个王者，那就是我们伟大之君王哈维尔一世，他带领我们击溃了僭主阿方索十三世和暴虐的赤色分子，那个时候卡洛斯八世和整合主义者又在哪里？哈维尔一世即是我们伟大的王！我们独一的王！"
 CAR_standard_bearer_of_traditionalism_idea:0 "传统主义旗手"
 CAR_standard_bearer_of_traditionalism_idea_desc:0 "我们是传统主义最顽强最坚韧的捍卫者，我们向恶势力毫不妥协，我们是虔诚基督徒，我们保卫我们的传统主义生活，我们敬仰上帝、热爱祖国、忠诚国王，无论是谁想要摧毁我们的传统主义，我们都会给予他们最严厉最残酷的打击。我们永远高呼基督吾王万岁！西班牙万岁！国王万岁！"
 CAR_organization_and_discipline_idea:0 "组织与纪律"
 CAR_organization_and_discipline_idea_desc:0 "先行者苏玛拉卡雷吉教会我们的第一课便是做一名有组织、有纪律的士兵，尽管这样并不能确保我们能打胜仗，但能保证我们在战败中不会输得太惨，即使被打散也能迅速组织起来反击，当然不止这些，如果要赢得人民的支持，组织与纪律就是不可或缺的一环，这就是我们与那些打着各式各样旗号的土匪所不同之处。"
 CAR_banking_left:0 "金融孤立"
 CAR_banking:0 "金融孤立"
 CAR_bunker:0 "紧急筑垒"
 CAR_spain_of_all_nations:0 "各民族的西班牙"
 CAR_The_Shame_of_Carlist_Wars:0 "洗刷历代卡洛斯战争之耻辱！"
 CAR_The_Shame_of_Carlist_Wars_desc:0 "承蒙耶稣基督之圣恩，吾辈终得雪洗三次卡洛斯战争惨败之奇耻，重掌西班牙神授之权柄！此番伟业，足证吾等方为受膏之正统，昔日伪主伊莎贝尔二世与其孽裔，不过是窃据王位的卑劣篡夺者。如今，卡洛斯王朝之正义归回已如破晓之光，其势沛然莫之能御，神圣之复兴必将席卷寰宇！"
 CAR_Pelayos_returns_to_society:0 "佩约拉斯回归家庭"
 CAR_Pelayos_returns_to_society_desc:0 "佩拉约斯的少年兵们，这些以阿斯图里亚斯光复者之名集结起来的年轻生命，如今终于能卸下重担，重返阔别已久的家庭了。硝烟散尽，战场再无需他们稚嫩的肩膀去扛起刀剑；我们亦不忍见这些本该在学堂与田埂间奔跑的孩子，即便仅从事炊事、传讯这般辅助差事。然而残酷的战争也并非毫无意义，这些受到战火淬炼的少年们会更加坚韧，他们将会成为重建西班牙祖国的中流砥柱。"
 CAR_Contemporary_Spanish_Orthodoxy:0 "僭越者？西班牙当世正统！"
 CAR_Contemporary_Spanish_Orthodoxy_desc:0 "我们岂是乱臣贼子？不！我们才是西班牙万世不易之正统！我辈身负波旁-帕玛之高贵血胤，其尊贵远非那僭主伊莎贝尔二世可比，她不过是斐迪南七世出于一己私欲、破坏男嗣继承法统所诞下的孽果！我等今日所为，绝非叛乱，而是收复本就该由我们所执掌之权柄！我们是奉天主圣恩护佑之西班牙唯一合法君王。哈维尔一世之加冕大典即将启幕，届时，必将以此昭告天下：正统已归，传统主义必将取得最终之胜利！"
 CAR_Tear_the_Pragmatic_Sanction_of_1830:0 "撕毁《1830年国事诏书》"
 CAR_Tear_the_Pragmatic_Sanction_of_1830_desc:0 "若要向全世界宣告传统主义与正统王权的胜利，《一八三〇年国事诏书》必须予以废除。我们急需恢复萨利克继承法并以此重建统治的法理根基。昏庸的斐迪南七世拒不承认王室已然绝嗣的现实，为了满足一己私欲、偏袒自己的直系后裔，悍然废除了延续百年的继承传统。正是他这一意孤行的举动，导致了西班牙深陷混乱与分裂，其恶果绵延至今。如今，正统的王位继承人已然归位，所有秩序都将回归正轨，一切必将拨乱反正。"
 CAR_Pacto_de_Ramon_Orbe:0 "重续拉蒙·奥贝尔协议"
 CAR_Pacto_de_Ramon_Orbe_desc:0 "对于那些曾持异见者，我们亦抱持客观公允之态。诚然，整合主义者们虽行径极端，然其初衷乃是为了挽救西班牙于危难，此份赤诚不容全盘否定。这并不代表他们是十恶不赦之徒，不过是误入歧途的迷羊，执着地行走在他们自认为正确的救赎之路上。我们素来宽厚仁德，为了西班牙的长治久安与团结，我们将与整合主义者重启拉蒙·奥贝尔协议之谈判，卡洛斯派持续多年的分裂将迎来终结。"
 CAR_Carlos_VIII_go_to_hell:0 "唾弃整合主义狂徒"
 CAR_Carlos_VIII_go_to_hell_desc:0 "哈维尔一世陛下乃西班牙独一无二之正统君主，整合主义者竟妄想借教会之名架空王权？简直是痴人说梦！我们早已洞悉，这帮自私自利的暴徒不过是假借上帝之名，行篡夺国王陛下大权之实，绝非真正的虔信者。如今他们竟与哈布斯堡王朝的僭越者卡尔·皮乌斯狼狈为奸，难道还想挑起另一场残酷的王位继承战争吗？此等逆天之举，绝对不可饶恕！"
 CAR_Sociedades_de_Socorro_Mutuo:0 "乡村互助会的遗产"
 CAR_Sociedades_de_Socorro_Mutuo_desc:0 "蛰伏于后方的互助会，可以算是我们手中最为隐秘的底牌。该组织不仅肩负为伤兵提供医疗与生活津贴、妥善安葬贫寒袍泽、抚恤烈属遗孤的重任，更致力于安置就业，构筑一道抵御自由主义经济侵蚀的防线。它实行彻底的基层自治，完全游离于臃肿低效的中央政府管辖之外。这意味着，一旦时局所需，互助会便能一声令下，动员全体成员投身社会重建，其严密的组织网络无疑将这支力量紧紧凝聚成了一个坚不可摧的整体。"
 CAR_Que_viva_Zumalacarregui:0 "依苏玛拉卡雷吉之卓见"
 CAR_Que_viva_Zumalacarregui_desc:0 "托马斯·德·苏玛拉卡雷吉，人称“托马斯大叔”，是呼啸兵当之无愧的军魂。昔日他临危受命，一手将那群毫无纪律的乌合之众，淬炼成足以抗衡僭主伊莎贝拉二世的虎狼之师。在他统领之下，我们曾无限逼近胜利的彼岸，奈何天妒英才，痛失栋梁。然而，苏玛拉卡雷吉将军留下的精神遗产弥足珍贵：一支铁军的精髓，从来不在于装备之精良或兵员之众寡，而在于这支军队是否拥有坚定的信仰、严密的组织与钢铁般的纪律。"
 CAR_El_Abanderado_de_la_Tradicion:0 "圣哉，传统主义旗手！"
 CAR_El_Abanderado_de_la_Tradicion_desc:0 "神圣的传统主义者们正高举着光荣的圣安德烈十字旗，在全西班牙境内举行盛大的凯旋游行！昔日，我们曾是任人宰割的羔羊，而今已蜕变为执掌乾坤的棋手。这辉煌的逆袭，恰恰印证了传统主义的无上真理性。看哪，耶稣基督的荣光永恒照耀在虔信者行进的大道之上，祂为我们指点迷津，更为我们今日的伟大胜利而欢呼。让我们以此为契机，向着下一个更加辉煌的胜利，全速迈进！"
 CAR_Democracia_Organica:0 "卡洛斯式有机民主制"
 CAR_Democracia_Organica_desc:0 "我们所追求的民主，绝非腐朽的政党政治或虚伪的议会民主，那些不过是西方资本主义编织的精巧谎言。我们要建立的，是一种根植于传统的有机民主制，一个由基层单元与有机议会共同构筑的真正民主体系。在这种制度下，议会绝不充当党派的私产，而是切实代表具体的利益共同体：家庭、市镇与工会将成为支撑有机民主的三大支柱。它严格遵循辅助性原则：凡家庭能独立解决之事，市镇绝不插手；凡市镇能自行处理之务，行省绝不干涉；凡社会团体能胜任之责，国家绝不越权。此外，在有机民主的框架下，王权亦将受到合乎传统的制约（此举足以杜绝无能君主肆意妄为），而国王作为国家统一的最高象征与最终仲裁者，必须坚定不移地捍卫各地地方自治体的权利与尊严。"
 CAR_Via_Crucis_de_Montejurra:0 "蒙特胡拉苦路之神圣朝拜"
 CAR_Via_Crucis_de_Montejurra_desc:0 "蒙特胡拉乃我卡洛斯派当之无愧的巍峨圣地。回溯第三次卡洛斯战争，我们正是在此处赢得了彪炳史册的重大胜利；而今，随着整个西班牙尽归正统，蒙特胡拉早已超越了单纯的象征意义，它已成为我们灵魂的不朽见证。每一位心怀上帝、祖国与国王的忠诚志士，皆应前往此地朝圣，以砥砺初心。我们深信，此类朝圣之旅必将凝聚万众之心，令所有忠诚之士在信仰的旗帜下愈发紧密地团结在一起。"
 CAR_Dios_Patria_Rey:0 "上帝、祖国、国王！"
 CAR_Dios_Patria_Rey_desc:0 "上帝与国王，乃是祖国最坚贞的捍卫者；然而，即便是王冕，亦必须俯首于天主至高的律法之下，并谦卑地尊重各地自古沿袭的特权与自由。至于吾民，正是通过对天主的虔诚、对地方传统的恪守以及对正统国王的效忠，才凝聚成一个有血有肉、休戚与共的真正祖国。这便是我们所庄严宣告的——“上帝、祖国、自治、国王”。它绝非四个割裂孤立的口号，而是构成了维系我等社会的神圣纽带，更是卡洛斯派真正的精神内核。此等信条，至真至坚，任何人皆不可背弃，亦不容亵渎。"
 CAR_The_True_King_Rises:0 "真王崛起！"
 CAR_The_True_King_Rises_desc:0 "西班牙的正统之王已经回归，是时候将目光望向世界了！"
 CAR_Fight_for_the_anti_socialist_cause:0 "为反赤事业奋斗"
 CAR_Fight_for_the_anti_socialist_cause_desc:0 "我们必须同协约国的弟兄们站在一起，反对赤色分子和德意志帝国！"
 CAR_Unified_Iberia:0 "统一伊比利亚"
 CAR_Unified_Iberia_desc:0 "葡萄牙是时候该回归西班牙了，吞并他们建立一个统一的伊比利亚国家！"
 CAR_The_Spanish_Counter_Revolutionary_Front:0 "西班牙反革命前线"
 CAR_The_Spanish_Counter_Revolutionary_Front_desc:0 "西班牙是反对工团主义分子的第一线，我们直接与公社暴徒们接壤，必须发挥出我们的作用"
 CAR_Open_up_the_North_African_route:0 "打通北非通道"
 CAR_Open_up_the_North_African_route_desc:0 "只要把摩洛哥消灭，我们就能与流亡北非的法兰西正统政府接壤，援助就能从陆地上直接运送到阿尔及尔。"
 CAR_Accept_aid_from_the_Allied_Powers:0 "接受协约国援助"
 CAR_Accept_aid_from_the_Allied_Powers_desc:0 "作为反革命的第一线，西班牙的防守压力很大，我们可以以此为由向协约国索要援助。"
 CAR_Hang_the_Jacobin_thugs:0 "绞死雅各宾暴徒"
 CAR_Hang_the_Jacobin_thugs_desc:0 "是时候对公社暴徒进行最后一战了，我们将从比利牛斯出发直接攻入公社暴徒的本土，彻底消灭赤色分子助我们的盟友回国！"
 CAR_Negotiating_for_Bourbon_relatives:0 "为波旁血亲谈判"
 CAR_Negotiating_for_Bourbon_relatives_desc:0 "萨丁岛上的萨伏伊王朝已经彻底没落了，占据整个南意大利的西西里王国才应该与协约国站在一起。"
 CAR_Spain_is_supreme:0 "西班牙，至高无上！"
 CAR_Spain_is_supreme_desc:0 "我们不能相信那些狡诈的外国人，西班牙必须走一条属于自己的独立外交之路。"
 CAR_Unite_Latin_compatriots:0 "团结拉丁同胞"
 CAR_Unite_Latin_compatriots_desc:0 "所有拉丁的兄弟们都应该团结起来，共同对抗当代的堕落，我们将拿起武器实现这一目标。"
 CAR_Unite_the_rebellious_brothers:0 "统一叛逆兄弟"
 CAR_Unite_the_rebellious_brothers_desc:0 "葡萄牙已经离开了西班牙太久，以至于他们都忘记了自己的主人是谁，现在他们的叛逆该结束了。"
 CAR_Stabbing_into_the_sacrilegious_heart:0 "刺入渎圣心脏"
 CAR_Stabbing_into_the_sacrilegious_heart_desc:0 "公社的暴徒们对神圣事业和基督吾王肆意亵渎，我们必须消灭这伙无神论暴徒，将天主的荣光带回欧罗巴大陆！"
 CAR_Catholic_brotherhood:0 "天主教兄弟情谊"
 CAR_Catholic_brotherhood_desc:0 "奥地利帝国是和我们一样捍卫天主教神圣事业的盟友，哈布斯堡家族曾共同统治着西班牙和奥地利，我们必须和我们的兄弟联合起来。"
 CAR_Algiers_Old_King:0 "阿尔及尔旧主"
 CAR_Algiers_Old_King_desc:0 "我们将邀请法兰西流亡政府，与我们共同对抗赤色分子，复兴拉丁世界的荣光！"
 CAR_Heretic_Beheaded:0 "异端授首！"
 CAR_Heretic_Beheaded_desc:0 "我们将正式出动，将赤色分子彻底消灭！"
 CAR_Fight_against_the_Eastern_heretics:0 "对抗东方离叛者"
 CAR_Fight_against_the_Eastern_heretics_desc:0 "倾巢出动，消灭东正教的异端们，重新统一基督教世界！"
 CAR_The_Godfather_of_Sicily:0 "西西里的血亲"
 CAR_The_Godfather_of_Sicily_desc:0 "两西西里王国处于波旁王朝的统治之中，我们将邀请我们的血亲，协助他们统一意大利！"
 CAR_The_Contemporary_Spear_of_God:0 "当代天主之矛"
 CAR_The_Contemporary_Spear_of_God_desc:0 "我们即是当代天主之矛，消灭一切反抗天主教事业的恶贼与暴徒！"
 CAR_The_faithful_servant_of_God_triumphs:0 "天主忠仆凯旋"
 CAR_The_faithful_servant_of_God_triumphs_desc:0 "我们一定能够完成基督吾王赋予我们的神圣事业，即使这条道路注定布满荆棘！"
 CAR_Rebuilding_Holy_Spain:0 "再造神圣西班牙"
 CAR_Rebuilding_Holy_Spain_desc:0 "旧西班牙的黄金时代已经结束了，而现在属于我们的黄金时代正式开启，让世界重回于对神圣西班牙的颤栗与臣服之中！"
 CAR_Ally_with_the_Austrian_Empire:0 "天主之仆共擎旗帜"
 CAR_Ally_with_the_Austrian_Empire_desc:0 "我们将与哈布斯堡的兄弟们站在一起，共同对抗新时代的撒旦与恶魔！"
 CAR_The_Pyrenean_wind_is_bone_chilling:0 "比利牛斯寒风彻骨"
 CAR_The_Pyrenean_wind_is_bone_chilling_desc:0 "为了抵抗赤匪对我们的威胁，我们必须学习奥地利的山地作战经验，在比利牛斯山脉布下重重防御，只要赤匪敢进入山区我们就能一举将他们消灭在此地。"
 CAR_Memories_of_the_Golden_Age:0 "黄金时代的回忆"
 CAR_Memories_of_the_Golden_Age_desc:0 "哈布斯堡王朝曾为西班牙带来了很长一段时间的繁荣，世界在西班牙的影子下瑟瑟发抖，我们称其为黄金时代。"
 CAR_The_Holy_City_Vienna:0 "神圣之都维也纳"
 CAR_The_Holy_City_Vienna_desc:0 "维也纳素有欧洲文化之都的美称，许多思想都在此地绽放，卡洛斯派也曾经流亡在此地，我们也从中汲取了许多新理念，马德里与维也纳将会时代友好下去。"
 CAR_Austrian_military_experience:0 "谦卑的第一课"
 CAR_Austrian_military_experience_desc:0 "虽然奥地利的陆军确实不咋样，但好歹他们也是世界大战的参与者之一，我们可以学习他们在世界大战中所总结的经验，强化西班牙的军队"
 CAR_The_two_big_shots_of_Catholicism:0 "我为锐矛，汝为坚盾"
 CAR_The_two_big_shots_of_Catholicism_desc:0 "奥地利是天主教世界的坚盾，而西班牙则是天主教世界的利矛，我们一同捍卫基督吾王所留给世界的遗产！"
 CAR_Studying_the_Vienna_School:0 "研究维也纳学派"
 CAR_Studying_the_Vienna_School_desc:0 "奥地利的维也纳学派确实值得我们进行学习，我们将派遣学员去维也纳学习奥地利的经济用以改善西班牙自身。"
 CAR_Holy_Spain_under_Christ:0 "基督治下的神圣西班牙"
 CAR_Holy_Spain_under_Christ_desc:0 "在新西班牙的血腥政治斗争中，坚信基督的传统主义者最终赢得了决定性胜利。这标志着团契彻底掌握了新政府的最高话语权。我们将紧密团结在天主、祖国、地方特权与国王的旗帜下，共同迈向一个光辉而崇高的新时代。"
 CAR_Respect_God:0 "敬重天主教会"
 CAR_Respect_God_desc:0 "天主教会历来是西班牙最深厚的社会基础。僭主阿方索十三世及其自由主义政府企图将世俗与宗教强行割裂，实质上是对基督吾王的背叛与大逆不道。我们将逐步恢复天主教会应有的崇高地位与精神权威，但这一切的前提是，教会必须剥离过去坐拥的巨额世俗地产与财阀化资产，回归纯洁的牧灵使命。"
 CAR_Local_self_government_national_unity:0 "地方自治，民族团结"
 CAR_Local_self_government_national_unity_desc:0 "高度的中央集权从来都是一个彻头彻尾的假象。官僚们以为集权能让国家走向强盛，实际上不过是吸干全国养分去繁荣马德里及其周边一隅。广袤的西班牙乡村被长期边缘化，而西班牙至上主义的余毒更是加剧了巴斯克、加利西亚与加泰罗尼亚人民的疏离与不满。唯有尊重历史传统的自治与特权，才是国家真正的未来。"
 CAR_The_orthodox_hold_their_ground:0 "团契正统派坚守阵地"
 CAR_The_orthodox_hold_their_ground_desc:0 "为哈维尔一世陛下欢呼！摄政议会已正式宣布加冕唐·哈维尔殿下为卡洛斯派及全西班牙的正统专制君主，传统主义团契正统血脉的得到了延续。西班牙将在哈维尔一世陛下的引领下洗尽沧桑，重新屹立于世界强国之巅！"
 CAR_Community_organism:0 "社团有机体"
 CAR_Community_organism_desc:0 "马克思主义的阶级斗争带来了无休止的流血与动荡，而资本主义无节制的贪婪扩张恰恰是滋生马克思主义的温床。唯有有机社团的诞生能够终止这种恶性循环，它将雇主、技术工人与学徒紧密团结在同一个互助共同体中。国家不会强行干预社团内部的有机运转，而社团亦须始终如一地效忠于国家。"
 CAR_Catholic_social_teaching:0 "天主教社会学说"
 CAR_Catholic_social_teaching_desc:0 "天主教社会学说源自良十三世教宗的《新事》通谕，旨在化解工业革命带来的种种社会危机。社会学说强调人的尊严，主张一切社会机制都应服务于人本身，将劳动者从纯粹的“生产工具”中解救出来。根据“辅相原则”，高级机构绝不得剥离或干预低级机构能够独立完成的职能；社会应当创造有利条件，使所有团体与成员均能便利地实现自我价值。同时，我们承认私有产权的合理性，但强调财产必须承担“社会责任”，绝不得损害公共利益，社会各阶层应当是相互依存、和谐共生的合作关系。"
 CAR_The_Social_Responsibility_of_Requete:0 "呼啸兵的社会责任"
 CAR_The_Social_Responsibility_of_Requete_desc:0 "呼啸兵决不能仅仅被视为职业军人。若长期与社会脱节，军队必然会与主流大众产生隔阂与矛盾。呼啸兵应当深入民间，主动投身于国家建设与乡村秩序的维护，做到“人人皆为呼啸兵”。只有在国家遭遇生死存亡的严峻考验时，他们才应挺身而出，履行战时士兵的神圣职责。"
 CAR_Under_society_the_king_comes_second:0 "社会之下，国王居二"
 CAR_Under_society_the_king_comes_second_desc:0 "国王的权力绝不得逾越社会自治体的合理边界。自治体在有机秩序中天然具有优先性，国王必须尊重自治体在其职能范围内做出的自主决断，不得随意干预。当然，国王有权参与并指导社会自治体的建设，而各地区的自治体也必须宣誓效忠国王与国家，不得有任何背叛中央政权与国家统一的行径。"
 CAR_Guiding_conservative_people:0 "引导保守群众"
 CAR_Guiding_conservative_people_desc:0 "西班牙的保守主义根基深厚，然而长久以来却被僭主阿方索十三世绑架和利用。卡洛斯派若想彻底稳固政权，就必须将广大保守主义群众从旧体制的迷梦中解放出来，引导他们转而拥护传统主义团契。唯有如此，效忠于僭越者的抵抗势力才可彻底失去土壤，最终归于消亡。"
 CAR_The_Beauty_of_Agrarianism:0 "农本主义的美好与和谐"
 CAR_The_Beauty_of_Agrarianism_desc:0 "广袤的乡村与农田是西班牙最坚实的后盾。然而旧王国却一味偏袒畸形的工业化，任由工业巨头蚕食乡村土地，给农民的补助更是杯水车薪。我们承认工业发展的必要性，但绝不许以牺牲农民利益为代价！伊比利亚传统的农本主义将在新时代高举旗帜，誓死捍卫乡村自治与小农阶层的利益。"
 CAR_The_Habsburg_Coronation:0 "哈布斯堡之王二度加冕"
 CAR_The_Habsburg_Coronation_desc:0 "来自哈布斯堡–波旁家族的卡尔·皮乌斯殿下在摄政议会的见证下加冕为西班牙新国王卡洛斯八世，摄政时期由此正式结束。卡洛斯八世陛下向全国郑重宣告：在他的领导下，西班牙必将重现十六世纪的黄金时代，超越极致的世界霸权也终将再度降临于这片圣洁的土地。"
 CAR_Rebuilding_royal_authority:0 "重建君主权威"
 CAR_Rebuilding_royal_authority_desc:0 "传统主义团契正统派向来宣扬的“社会高于国王、地方高于国王”，在本质上是完全错误的。我们固然不能否定社会与地方自治体的独特地位，但若连国王都失去了必要的统治权威与决断权力，那这尊贵的王位岂不沦为空壳？这种荒谬的论调，实际上是让我们步入自由主义毒蛇精心设下的陷阱。因此，全面重建至高无上的君主权威已是势在必行。"
 CAR_Appeasement_integrator:0 "示好整合主义者"
 CAR_Appeasement_integrator_desc:0 "整合主义者在卡洛斯八世陛下加冕前提供了诸多协助。虽然他们在正统派那里备受冷落，甚至被诬蔑为异端与极端分子，但我们对此全然不在意。尽管部分极为幼稚的整合主义者一心只想“加冕基督为王”而拒绝合作，但绝大多数人依然通情达理。我们将逐步把他们转化为陛下最忠诚的政治白手套，让整合主义的狂热力量彻底为我们所用。"
 CAR_Relationship_with_the_Viennese_court:0 "运用与维也纳宫廷的关系"
 CAR_Relationship_with_the_Viennese_court_desc:0 "卡洛斯八世陛下出生于维也纳宫廷，是奥地利–托斯卡纳大公利奥波德·萨尔瓦托的幼子。从小生长于奥地利的他与哈布斯堡皇室关系极为密切，并在奥地利卡尔一世陛下的鼎力支持下亲赴西班牙，投身于伟大的卡洛斯派传统主义事业。如今西班牙百废待兴，各领域皆需重修建设，我们完全可以善用这段血亲纽带争取奥地利宗亲为我们提供援助。"
 CAR_Catholic_moral_rule:0 "天主教道德统治"
 CAR_Catholic_moral_rule_desc:0 "卡洛斯派所认定的正统君主必须兼具两项准则：来源合法性与行为合法性。尽管过去大多数君主只需满足来源合法性便能赢得拥护，但卡洛斯八世陛下自认同样完全符合行为合法性，是西班牙至高无上的正统君父。陛下不仅血统纯正绝伦，更是受基督亲自认可的专制君主。在他的引领下，耶稣基督的圣旗必将重新在西班牙的上空高高飘扬。"
 CAR_The_End_of_Liberal_Democracy:0 "自由民主的末日"
 CAR_The_End_of_Liberal_Democracy_desc:0 "自由民主是世上最邪恶的剧毒，时刻侵蚀着亚当与夏娃后裔的精神世界，蛊惑他们偏离基督吾王所指引的正统道路。而如今，竟有一伙徒众企图将这些有害思想引入西班牙，彻底毒害西班牙人的心灵与思维。我们绝不能容忍此等罪行，必须以严厉手段将自由民主的支持者连根拔起、彻底消灭，坚决捍卫西班牙人的精神家园。"
 CAR_Traditionalist_Peoples_Front:0 "传统主义人民阵线"
 CAR_Traditionalist_Peoples_Front_desc:0 "传统主义人民阵线将联合绝大多数的天主教民众与忠诚政党，将所有基督赤子紧密团结起来，共同抵抗自由民主与赤色分子对西班牙人的思想污染与精神毒害。在基督吾王的至圣指引下，无论是西班牙人、巴斯克人还是加泰罗尼亚人，都将不再有族群之分，在圣安德烈十字旗下，所有人都是基督最忠诚的铁血士兵。"
 CAR_Peoples_Action_Youth:0 "人民行动青年为正统欢呼"
 CAR_Peoples_Action_Youth_desc:0 "人民行动青年团以果敢的行动粉碎了赤色分子的政变阴谋，捍卫了传统主义王国不受现代自由主义精神毒草的侵害。曾经，人民行动挺身而出稳固了阿方索十三世的王位；而这一次，青年团将再次为正统信仰而战，誓死效忠真正的主上哈维尔一世陛下，由他总揽并统领全国大权。"
 CAR_Traditional_order_saves_Spain:0 "传统秩序救赎西班牙"
 CAR_Traditional_order_saves_Spain_desc:0 "无论是自由主义还是其他各类现代意识形态，其本质不过是现代主义遗毒的变种。所谓的“现代化”究竟给西班牙带来了什么？第一共和国的惨痛教训历历在目，第二共和国更是险些将西班牙的社会秩序彻底摧毁。而无能的阿方索十三世盲目听信自由主义者的奸佞谗言，一举引爆了西班牙的内乱。这恰恰铁证了传统主义的无比优越，自由主义给不了西班牙黄金时代，但我们能。"
 CAR_Put_leash_on_randomness:0 "为偶然主义套上缰绳"
 CAR_Put_leash_on_randomness_desc:0 "偶然主义者如今显然已陷入孤立无援的绝境。他们天真地以为是国家选择了国王与天主教，却参不透其实是国王与天主教塑造并选择了这个国家。国王与天主的圣名早就深深刻入了西班牙的命运轮廓之中：国王离不开西班牙，正如西班牙绝不能没有国王。那些为伪王效力的投机分子无异于自寻死路，凡不信仰传统主义的逆贼，必将迎来终极的灾难。"
 CAR_Incite_social_violence:0 "鼓舞社会暴力"
 CAR_Incite_social_violence_desc:0 "我们必须大力鼓励青年踊跃走上街头，积极投身到针对自由主义者和赤色分子的铁血打击行动中去。要号召他们全面占领街头巷尾，让所有反抗分子在圣战的汪洋大海中无处遁形。适当的暴力不仅能重新激发西班牙人的血性与潜能，还能雷霆般打击反对政府的叛乱势力，堪称一举两得。在烈火与鲜血的洗礼下，西班牙正重新焕发出勃勃生机。"
 CAR_Respect_local_rights:0 "尊重地方法权"
 CAR_Respect_local_rights_desc:0 "人民行动的主流派系在背离传统主义团契后，便早已抛弃了对地方法权的应有尊重。他们受到伪王阿方索十三世的蛊惑与操弄，竟残忍地镇压无辜的巴斯克人、加泰罗尼亚人与加利西亚人，肆意残害与我们同根同源、共同生活在伊比利亚半岛上的同胞兄弟。这严重违背了天主的圣意，更是对祖国最可耻的背叛。我们必须拨乱反正，引导新一代的人民行动青年重拾对地方法权与自治传统应有的敬畏与尊重。"
 CAR_The_Grace_of_Holy_Christ:0 "神圣基督之恩泽"
 CAR_The_Grace_of_Holy_Christ_desc:0 "唯有在神圣基督的浩荡恩泽下，西班牙才有可能实现真正的富强。回顾历史，正是对基督吾王的崇高信仰，为我们带来了半个新大陆的无尽财富以及绵延数十年、威震寰宇的黄金时代。然而，后世子孙却沉迷于纸醉金迷的享乐之中，渐渐遗忘了对基督的崇敬，致使至高无上的天主收回了对西班牙的恩赐。如今，唯有重新崇拜基督、虔诚信仰基督，才能带我们重回黄金时代的巅峰，再次为基督吾王披坚执锐、扛起光荣的十字架。"
 CAR_Making_use_of_tyrants_inheritance:0 "利用僭主遗产"
 CAR_Making_use_of_tyrants_inheritance_desc:0 "阿方索十三世并非一无是处，他为西班牙留下的历史遗产远比世人想象的更为丰厚。无论是在科学研究还是基础教育领域，尤其是在军事遗产方面——他不仅留下了大批经验丰富的军官团，还留下了许许多多受过严苛专业训练的士兵。尽管这些精锐在内战中死伤惨重，但丝毫不影响我们继续继承并吸收这些宝贵遗产。经历过战争烈火淬炼的退伍老兵意志更为坚韧，在新兵训练中由他们亲自带队，定能让西班牙新军的战斗素质再上一个全新的台阶。"
 CAR_The_order_of_God_still_exists_in_the_world:0 "主之秩序仍存于世"
 CAR_The_order_of_God_still_exists_in_the_world_desc:0 "世人皆狂妄地声称“基督已死”，但大错特错，基督依然活着！祂的神圣秩序依然巍然屹立，祂的恩光存于每一位虔诚信徒的心灵深处。而西班牙，正是天选的为基督高举圣旗之国。我们定要在基督吾王的至圣指引下，重新将天主的秩序带回混乱的人间，在尘世间重塑基督盛世的辉煌，让普天下的子民重新投入吾主的怀抱之中。"
 CAR_Unbelievable_turn:0 "不可思议的转向"
 CAR_Unbelievable_turn_desc:0 "传统主义团契绝对想不到会有今天，团契内部的社会主义者们在摄政议会的默许与支持下，竟一举成为了西班牙的新统治者。天主教传统主义与社会主义的结合虽然看似奇异怪诞，但我们坚信这才是拯救西班牙的唯一出路。在明君与社会主义的共同指引下，这片古老的土地必将浴火重生，迎来前所未有的曙光。"
 CAR_Integrationalism_at_dead_end:0 "整合主义穷途末路"
 CAR_Integrationalism_at_dead_end_desc:0 "整合主义者作为传统主义团契中最反动、最敌视社会主义的派系，正是导致卡洛斯派走向分裂的始作俑者。曾经，他们为满足一己野心分裂团契，冒天下之大不韪独自组建所谓的“西班牙整合党”；如今，他们竟再次打着反社会主义的阴险旗号，妄图将卡洛斯派再一次推入万劫不复的分裂深渊。但这一次，他们的阴谋绝不会得逞。"
 CAR_Win_over_the_cntfai:0 "拉拢无政府工联"
 CAR_Win_over_the_cntfai_desc:0 "全国劳工联合会–伊比利亚无政府主义联盟固然是我们的宿敌，其极端主义和无政府主义思想与我们的传统主义格格不入，但作为全西班牙势力最庞大的工会，他们是所有社会主义者都无法绕过的巍峨巨山，即便是我们这些信仰天主教的传统主义社会主义者也不例外。为了局势的大局，我们只能捏着鼻子去拉拢这群狂热分子，至少要想方设法促使他们暂停对新政府的暴力袭击与破坏。"
 CAR_The_fellowship_turns_left:0 "传统主义团契向左转"
 CAR_The_fellowship_turns_left_desc:0 "传统主义团契内部的左翼正统派成功击败了团契之外的其他社会主义团体，彻底巩固了对西班牙的最高统治权。在左翼卡洛斯主义的圣洁指引下，我们将矢志不渝地延续“上帝、祖国、地方法权、国王”的核心原则，并以工人自治社会主义为宏伟纲领，重建在内战中受尽苦难伤痕累累的西班牙。"
 CAR_Reinterpreting_Carlos_War:0 "再解读卡洛斯战争"
 CAR_Reinterpreting_Carlos_War_desc:0 "历史上的卡洛斯战争绝不是一场简单的王位继承争端，而是偏远乡村地区对抗马德里中央权贵阶级的阶级斗争。中央政府长期冷酷地忽视地方的诉求与应有之建设，倾全国的资源供养马德里官僚与贵族们，而我们正是在正统继承人的号召下，为了广大贫苦大众的权益毅然拿起武器，誓死反抗中央权威对地方的残酷压迫。"
 CAR_Workers_managing_themselves:0 "劳动者的自我管理"
 CAR_Workers_managing_themselves_desc:0 "工人必须拥有对工厂生产与管理的至高决策权，因为只有奋战在一线的劳动者，才最清楚应当如何公平分配工厂的劳动果实与生产收益。没有了资产阶级高层对生产工作的指手画脚，也没有了白白拿薪水却不干活的闲散寄生虫吸食工人的血汗，一切事务皆由劳动者自我决定，如此一来，工厂的生产效率与工人的劳动积极性定能迎来大飞跃。"
 CAR_Harnessing_the_labor_movement:0 "驾驭工人运动"
 CAR_Harnessing_the_labor_movement_desc:0 "工人运动必须彻底为我们的革命事业所用。对于他们曾经反抗政府、开展暴力斗争之事我们可以概不追究，但现在的工人们必须认识到自己究竟在为谁而战。既然是我们为他们带来了真正的解放与自由，他们就理应放下武器，重新回归生产岗位；而所有的抗议游行与大罢工也必须在政府的统一指挥下有序进行，任何未经许可的擅自行动都将被视为非法叛乱。"
 CAR_Federalization_under_the_king:0 "国王治下的联邦化"
 CAR_Federalization_under_the_king_desc:0 "过去那种简单粗暴的地方自治早已落后于时代的发展。自1848年“民族之春”以来，欧洲各族的民族意识呈喷涌之势，曾经的少数民族或许只是在争取基本权益，而如今他们追求的却是彻底的独立。这是西班牙决不能接受的，我们绝不容忍任何人分裂祖国。但镇压只会带来更强烈的反抗，而先前团契所主张的地方自治也已经满足不了他们，现在我们只能向这些少数民族许诺更大限度的自治特权，或者干脆将国家重构为一个多民族联邦，由我们的伟大国王亲自兼任各个自治体的最高领导人。"
 CAR_Left_wing_elements_in_the_Bible:0 "圣经中的左翼元素"
 CAR_Left_wing_elements_in_the_Bible_desc:0 "《圣经》之中实际上蕴含着最早的社会主义雏形，圣训时刻告诫我们要行善积德、关爱穷苦大众、绝不可投机取巧或贪婪无度。只不过后世的反动统治者肆意篡改经文，对圣洁的教义阳奉阴违，才导致了如今贫富悬殊和阶级对立的局面。借用《圣经》中的神圣典故，不仅能让我们在西班牙的反动保守土壤中推行社会主义时事半功倍，还能让广大虔诚的天主教群众真正理解并拥抱社会主义的真谛。"
 CAR_Peoples_monarchy:0 "人民君主制"
 CAR_Peoples_monarchy_desc:0 "过去的君主制一味要求人民无条件效忠并服务于国王，在绝对专制时代，每一个普通百姓本质上都是君主的奴隶。但我们的革新理念要求国王必须反过来服务于人民，国王既然手握至高无上的权力，就必须承担起对应的重大责任与义务。保卫人民、服务人民就是国王不可推卸的神圣使命。国王是国家的第一公民，不仅象征着权力的合法性，也意味着他是亿万人民中平等的一份子。这正是我们所全力提倡并践行的“人民君主制”。"
 CAR_End_the_red_tyranny:0 "自由工会终结赤色暴虐"
 CAR_End_the_red_tyranny_desc:0 "由传统主义团契控制的自由工会联盟受到了摄政议会的青睐，在大辩论中大获全胜。虽然自由工会联盟仅仅是一个工会组织，相较于传统政党有许多不同之处，但自由工会联盟摒弃了政党的低效与内耗得以全力驱使政治机器，势必要实现复兴西班牙的伟大梦想。"
 CAR_The_Inevitable_End_of_Violence:0 "暴力的必然终结"
 CAR_The_Inevitable_End_of_Violence_desc:0 "赤色分子所带来的暴力终将为他们自己招致毁灭，这种暴徒式的狂热绝不可能持久。阶级斗争和无产阶级暴力必然会被淹没在历史的洪水之中，暴力并不能给无产阶级带来真正的自由，唯有采用温和的手段才能从根本上化解国内的阶级矛盾。暴力只会促使我们走向野蛮，而温和主义才是文明进步的真正象征。"
 CAR_National_regulatory_labor_union:0 "国家监管工会组织"
 CAR_National_regulatory_labor_union_desc:0 "所有的工会都必须置于国家严密的监管之下。某些工会暗中收取外国颠覆分子的黑钱密谋反对我们的统治，因此必须对所有工会进行全面审查。工会内部的高层必须由我们绝对信任的人员担任，所有不符合要求、不服从管理的工会必须立刻予以解散。这样在稳定国家的道路上，我们又可以迈出了通往胜利一大步。"
 CAR_Insights_from_Integrative_Syndicalism:0 "整合工团主义启示"
 CAR_Insights_from_Integrative_Syndicalism_desc:0 "自由工会联盟的整合工团主义被公认为西班牙右翼工团主义的先驱。虽然其冠以“工团主义”之名，但实际运作与正统工团主义大相径庭。整合工团主义不仅坚决反对正统工团主义的暴力斗争，拒绝与各路左翼工人组织妥协合作，誓死反抗赤色暴徒施加给国家的灾难。如今，自由工会联盟将再度高举整合工团主义的旗帜，为彻底剿灭暴徒而战。"
 CAR_Yellow_roses_never_wither:0 "黄玫瑰永不凋落"
 CAR_Yellow_roses_never_wither_desc:0 "红色阵营终有一天会在无尽的暴力深渊与固步自封中走向陨落。他们一味诉诸暴力的行径正在彻底摧毁民族的生机与活力，不仅导致市场陷入低迷，更使国家经济跌落至谷底。失去了资产阶级市场调节的社会只会沦为一潭死水并最终走向灭亡。而代表自由工会的黄色玫瑰花将在赤色分子的尸骨之上绚丽绽放，并且永不凋零。"
 CAR_The_Patriotic_Cause_of_Sindicatos_Libres:0 "自由工会的爱国事业"
 CAR_The_Patriotic_Cause_of_Sindicatos_Libres_desc:0 "赤色分子一直狂热宣扬的国际主义，本质上是在蚕食并摧毁我们来之不易的民族认同，这是极其无耻的叛国行径。我们绝不能容忍国际主义在国内继续传播蔓延；取而代之的是，属于全体西班牙公民的爱国主义将成为社会的主流共识。不论是谁，都有责任和义务挺身而出，誓死保卫西班牙。"
 CAR_The_Rise_of_Carlos_the_Worker:0 "卡洛斯工人崛起"
 CAR_The_Rise_of_Carlos_the_Worker_desc:0 "西班牙的工人天生就应该成为传统主义的忠诚拥护者。我们为他们提供了完美的生活范式，劳动、家庭与祖国。除此之外，他们无需再为其他杂务分心，也不必为不可预知的未来发愁，只需要在工厂中奉献自己的劳动价值，为西班牙的伟大崛起添薪加柴。忠诚者自然会得到应有的奖赏，传统主义团契必将成为全体工人真正的避风港。"
 CAR_Independent_Syndical:0 "基督指引下的独立工团"
 CAR_Independent_Syndical_desc:0 "令人意想不到的是，由传统主义团契组建的独立工团赢得了摄政议会的青睐，在大辩论中出人意料地脱颖而出。独立工团相较于卡洛斯派控制的其他工人组织虽然显得激进许多，但其核心立场始终未变，独立工团将在基督吾王的至圣指引下，为全西班牙的劳动者带来真正的自由与解放。"
 CAR_Eliminate_the_scabs:0 "将黄色工会扫入垃圾堆"
 CAR_Eliminate_the_scabs_desc:0 "自由工会联盟这种黄色工会组织，本质上不过是在出卖工人阶级和广大劳动人民的切身利益，将其拱手奉献给贪婪的雇主阶级。这是无论他们如何巧舌如簧地宣称自己“亲近工人、为工人发声”都无法掩盖的事实。从他们嘴里吐出的每一个字都是邪恶的谎言，企图诱骗工人向资本恶魔出卖灵魂以充实自己的腰包。所有黄色工会都应该下地狱，接受撒旦永恒的折磨。"
 CAR_Truly_independent_workers_union:0 "真正独立的工人工会"
 CAR_Truly_independent_workers_union_desc:0 "独立工团忠于国王、忠于天主，但坚决反对国家势力插手工会内部事务。这与卡洛斯派地方法权的教义不谋而合，国王不应当随意干涉社会自治体的决策，同样也不能强行插手工会组织，即便是代表政府也不行。如果任由官僚势力肆意介入工会，工会迟早会蜕变成腐朽的黄色工会。我们必须坚守独立工会原则，誓死捍卫工会的独立与纯洁。"
 CAR_End_capitalist_greed:0 "终结资本贪婪"
 CAR_End_capitalist_greed_desc:0 "我们反对阶级斗争带来的血腥暴力，但绝不意味着我们支持向资本家无底线妥协或盲目提倡阶级合作。暴力与软弱的谈判都是行不通的邪路。对于这些贪婪的市场投机者，我们唯一的策略是逐步瓦解其势力根基，在他们毫无察觉的情况下将其架空剥离；直到社会彻底不再需要资本服务的那一天，资本主义自然会迎来终结。"
 CAR_Workers_sense_of_autonomy:0 "培养工人自主意识"
 CAR_Workers_sense_of_autonomy_desc:0 "如果只是把道理重复一千遍一万遍，是无法从根本上改变工人们被动思维的。他们在遭遇压迫时往往只会选择忍气吞声与消极逃避，仅仅靠口头上的宣讲早已远远不够。我们必须在潜移默化中唤醒并培养工人阶级的自我意识，让他们切身体会什么是压迫、为什么要反抗压迫，学会明辨善恶，并勇于主动挺身反抗一切不正当的剥削行为，唯有如此，正义方能真正诞生。"
 CAR_Maybe_Guild_Socialism:0 "这是行会社会主义吗？"
 CAR_Maybe_Guild_Socialism_desc:0 "尽管独立工团名义上被称为工团，并号称融合了天主教教义与工团主义，但在实际运作中，它与某种行会社会主义高度相似。虽然目前尚未正式将行会社会主义确立为独立工团的官方指导思想，但其行动准则与政治纲领早已全面向早期行会社会主义倾斜。也许我们应当顺应这一趋势，正式将行会社会主义吸收为我们指导思想的核心。"
 CAR_Worship_Worker_Jesus:0 "崇拜工人耶稣"
 CAR_Worship_Worker_Jesus_desc:0 "许多宗教狂热分子只是把耶稣奉为高高在上的君王并盲目崇拜，却对他漫长的尘世苦难视而不见。耶稣出生于一个平凡的木匠家庭，长期在底层社会受尽磨炼这才促使他产生了悲悯世人的博大胸怀，这一点在他的布道岁月中展现得淋漓尽致，所有穷苦大众都将他视为救世主。我们如今必须重拾对“工人耶稣”的虔诚崇拜，回归最本真、最原初的教义，在西班牙这片土地上重建一个人人平等的地上天国。"
 CAR_All_are_children_of_Christ:0 "皆为基督赤子"
 CAR_All_are_children_of_Christ_desc:0 "无论是民族主义者、社会主义者，还是保王派、民主派或共和派，我们在本质上都是天主的赤子，是基督尘世王座的捍卫者。我们为何要任由虚幻的意识形态将原本同根同源的人民割裂开来？一个人人和谐相处、友善互助、富强团结且平等的社会，才是所有人应当共同追随的终极目标，而不是卷入无休止的党派内耗与思想内战之中。"
 CAR_Falange_New_Rise:0 "轭与箭，新日升"
 CAR_Falange_New_Rise_desc:0 "长枪党正统派彻底击败了左翼威胁与传统主义者，一举成为了新西班牙无可争议的引领者。这意味着“团结的轭与箭”正于伊比利亚大地上不可阻挡地升起，传统主义团契曾经赖以维系旧秩序的陈腐架构，如今彻底崩溃不复存在。"
 CAR_Destroy_the_monarchy:0 "摧毁无能君主制"
 CAR_Destroy_the_monarchy_desc:0 "无论是曾经的西班牙王国还是卡洛斯派的漫长尝试，他们只用漫长的衰落历史教会了我们一个道理：所有的国王都是软弱无能且自私自利的。他们除了拖国家的后腿、破坏政局稳定性与无休止地制造混乱之外一无是处。唯有以最彻底的手段摧毁这腐朽无能的君主制，才能重新点燃西班牙复兴的火种。"
 CAR_Tidying_up_party_affairs:0 "修整党政机器"
 CAR_Tidying_up_party_affairs_desc:0 "我们的党如今变得太过臃肿和庞大了，许多毫无必要的臃肿部门根本就没有存在的价值。西班牙当前最迫切需要的是高效与决断，唯有将那些繁琐的官僚机构一律裁剪清理、彻底为长枪党减负，才能拉着我们沉重的祖国大步向前迈进。无休止的党内内耗、派系争论与无意义的舌战该彻底画上句号了。"
 CAR_Youthful_national_vitality:0 "青年中的民族活力"
 CAR_Youthful_national_vitality_desc:0 "老人们已经不可避免地逝去了，连同他们僵化的脑髓与落后的陈旧思维一并葬入了墓穴。他们不仅沦为了落后守旧的代名词，更无时无刻不在阻挠我们实现伟大的宏图报负。然而，我们在青年身上看到了属于本民族绝无仅有的活力——他们热情洋溢，时刻准备为西班牙的崛起赴汤蹈火，我们必须彻底将这股青年力量全面纳入到我们的队伍之中。"
 CAR_Things_that_are_out_of_reach:0 "德里维拉所不能及之事"
 CAR_Things_that_are_out_of_reach_desc:0 "米格尔·普里莫·德·里维拉将军——也就是伟大领袖何塞·安东尼奥·普里莫·德·里维拉的父亲，不过是一个纯粹的传统军人，并且无能得极其纯粹。他只会机械地随着国王的命令附庸风雅、随波逐流，根本无法带领西班牙走出深渊，因此属于他的时代早已归于终结。但我们不同，我们拥有坚定的意志与新秩序，我们必将实现他未竟且无法企及的宏伟愿望"
 CAR_Deploy_paramilitary_forces:0 "出动蓝衫军"
 CAR_Deploy_paramilitary_forces_desc:0 "对于那些潜藏在社会各个阴暗角落的破坏分子与反动势力，我们能够使用的手段只有一个：那就是派遣最忠诚、最坚决的蓝衫军去全面占领街道，将任何胆敢反抗我们新秩序的叛乱分子通通就地处决。非常时刻必须使用非常手段，这仅仅是稳定祖国局势、巩固新政权的第一步。"
 CAR_Behead_the_rebellious_son:0 "斩首工团主义逆子"
 CAR_Behead_the_rebellious_son_desc:0 "长枪党左翼那些天真的空想家，难道真以为他们能实现那种幼稚的无产阶级乌托邦理想？简直是大错特错！我们绝不能容忍这群暗中与无政府主义者勾结在一起的党内叛徒。领袖曾经网开一面容许他们继续留在党内，但现在这场荒谬的闹剧该彻底落幕了，他们是时候收拾行囊彻底滚蛋了。"
 CAR_National_Law_Corporation_Experiment:0 "国家法团实验"
 CAR_National_Law_Corporation_Experiment_desc:0 "工团主义充满了野蛮与无政府状态的暴力，纯粹的资本主义又充斥着冷酷无情的剥削与贪婪。我们提倡通过一种温和且高度建构的手段来协调劳资双方的根本矛盾——有了问题就去解决问题，盲目的阶级暴力与资本狂热是实现不了任何目标的。因此，我们可以正式采纳法团主义作为我们未来的核心纲领之一，社会阶级的终极和谐必将于我们之手彻底实现。"
 CAR_Jose_Antonio:0 "安东尼奥万寿无疆！"
 CAR_Jose_Antonio_desc:0 "何塞·安东尼奥·普里莫·德·里维拉决定不再依靠任何既得利益集团或旧军阀，他要彻底以自己的铁腕手段实现西班牙的伟大复兴。既然各方政治势力都只是把他当成谋取私利的工具，那就让这群怀揣私心的混蛋们滚得越远越好！在安东尼奥的领航与指引下，新西班牙必将迎来脱胎换骨般的重生。"
 CAR_Dont_lean_too_far_left_or_right:0 "断不可左倾右依"
 CAR_Dont_lean_too_far_left_or_right_desc:0 "我们绝不是无产阶级工团主义者，也绝不可能沦为资本主义雇佣的打手。我们的革命从诞生之日起，就是为了彻底反对工团主义与资本主义而生！我们将坚定不移地走出属于我们自己的“第三条道路”，让卡尔·马克思的阶级斗争理论和那些脑满肠肥的资本家们通通见鬼去吧！"
 CAR_community_with_shared_future:0 "寰宇命运统一体"
 CAR_community_with_shared_future_desc:0 "国家绝不是由世俗契约拼凑而成的功利结合体，更不能仅仅根据种族差异或地理边界来狭隘地定义。国家是一个超越世代、跨越时空的“精神使命”。西班牙之所以能够成为一个伟大的国家，是因为它曾在历史上承担过向全球扩张天主教文化、建立宏大帝国的崇高使命。国家，即是宇宙命运的终极统一体。"
 CAR_Violence_and_Roses:0 "论暴力与玫瑰花"
 CAR_Violence_and_Roses_desc:0 "当无休止的议会辩论和虚伪的法律手段不足以捍卫国家的统一与尊严时，“拳头与手枪的辩论”就是合法、正当且绝对必要的暴力手段。那些职业政客们平日里满嘴花言巧语，转过头来却派出暴力部队对反对者实施残酷镇压。欺骗促使了西班牙的分裂与衰落，而这一次，我们绝不会再让这群寄生虫般的政客们得逞。"
 CAR_The_organic_unity_of_individuals_and_the_collective:0 "个体集体有机统一"
 CAR_The_organic_unity_of_individuals_and_the_collective_desc:0 "个人的最高价值与真正的自由，唯有在毫无保留地服务于国家这一整体目标时方能真正实现。人绝不是孤立无援的社会原子，而是隶属于某种神圣社会职责的有机组成部分。如果整个社会得不到解放与自由，那么单独的个人自然也不可能拥有真正的自由，社会与个人双方本就是共利共存、不可分割的统一体。"
 CAR_The_Leaders_Responsibility:0 "一名领袖的责任"
 CAR_The_Leaders_Responsibility_desc:0 "领袖的职责绝不是去盲目顺从大众庸俗的欲望与短暂的偏见，而是去洞察国家的长期利益并勇敢地引导大众。领袖应当“服务”人民，但这种“服务”绝不等于卑躬屈膝地“听从”。唯有人民愿意服从并严格遵守领袖的戒律，领袖才有责任为人民奉献一切，二者互不背叛，相辅相成。"
 CAR_The_Monastic_Life_of_the_Legion:0 "军团的修道生活"
 CAR_The_Monastic_Life_of_the_Legion_desc:0 "长枪党的忠诚战士们应当具备“一半是修士，一半是士兵”的复合品质。一方面要有如天主教修道士般宗教式的虔诚、克制与禁欲主义；另一方面要有如铁军般严格的纪律、无条件的服从与牺牲精神，随时做好为祖国献出生命的准备——即便是领袖本人，在国家利益面前也绝不例外。"
 CAR_Dionisio_Ridruejo:0 "里德鲁埃霍带来民主"
 CAR_Dionisio_Ridruejo_desc:0 "蒂奥尼西奥·里德鲁埃霍，一名曾经狂热的极权主义战士，如今成长为了深刻的自由主义倡导者。他在老领袖何塞·安东尼奥·普里莫·德·里维拉的支持与重托下，成为了西班牙长枪党的新一任党魁。在他的带领与改革下，西班牙将会彻底告别高压专制，迎来久违的宪政民主与自由之光。"
 CAR_Reflecting_authoritarian_systems:0 "审思威权国家体制"
 CAR_Reflecting_authoritarian_systems_desc:0 "无论是曾经辉煌的西班牙帝国还是后来的西班牙王国，它们在本质上都是威权主义的政治实体。无论它们过去的所作所为表面上看起来多么辉煌，终究不过是为了重拾并充实上层阶级的腰包罢了，这一切与广大的底层人民毫无干系。既然威权体制甚至连让人民吃饱饭都做不到，那我们为什么还要盲目地去追随并巩固它呢？"
 CAR_Awakening_Spanish_Youth:0 "唤醒西班牙青年"
 CAR_Awakening_Spanish_Youth_desc:0 "西班牙的青年人绝不能继续沉溺于对某一个个人或者政党的极端崇拜与狂热之中了。他们是具备独立人格的个人，他们应该拥有属于自己的思考、判断与批判能力。我们大力倡导思想的自由与开放，要让青年们真正认识到政治斗争的残酷性与必要性，而不仅仅只是沦为政治强人的盲目追捧者。"
 CAR_United_Old_Republicans:0 "联合老共和派"
 CAR_United_Old_Republicans_desc:0 "西班牙第二共和国确实是一个勇敢的先驱，可惜他们自诞生之日起就没有一天不是处于无休止的派系内斗与混乱之中的。但即便如此，他们依然为西班牙留下了极为宝贵的思想遗产与民主火种。我们将全面平反那些在王国时期遭到封杀与流放的进步政治家，并正式允许海外的共和制支持者重返祖国参与政治建构。"
 CAR_Social_revolution_for_the_people:0 "社会革命为人民"
 CAR_Social_revolution_for_the_people_desc:0 "纯粹的资本主义必然会造成严重的社会不公与贫富分化，而纯粹的集权专制又会彻底剥夺人的基本尊严。因此，蒂奥尼西奥·里德鲁埃霍主张将西方议会民主制与现代福利国家制度及社会公平深度结合——一切权力取之于人民，一切资源用之于人民，以此彻底实现一场真正的、全方位的社会革命。"
 CAR_Individual_freedom_is_above_the_state:0 "个人自由高于国家"
 CAR_Individual_freedom_is_above_the_state_desc:0 "个人的政治自由、言论自由和结社自由是绝不可侵犯的文明底线，无论是多么庞大的国家机器都无权剥夺公民的自由。民众对国家有任何意见都可以自由地提出，我们将洗耳恭听并加以改进；一味的思想压制与言论封杀只会促使国家陷入永久的停滞与僵化，这等同于剥夺了整个民族的生机与活力。"
 CAR_Fight_for_social_justice:0 "为社会公义奋斗"
 CAR_Fight_for_social_justice_desc:0 "每一个公民都应该为保卫祖国的民主与自由而勇敢奋斗！我们要彻底将专制主义与独裁思想的毒蛇猛兽尽数消灭，将所有对民主制度和公民自由构成威胁的敌人牢牢抵御在国门之外。我们愿意用我们的鲜血与生命来捍卫自由，捍卫我们与生俱来、不可剥夺的神圣权利。"
 CAR_Sanchez_Mazas:0 "马萨斯与天主同行"
 CAR_Sanchez_Mazas_desc:0 "虔诚的基督徒、长枪党资深元老拉斐尔·桑切斯·马萨斯在老领袖何塞·安东尼奥·普里莫·德·里维拉的支持下成为了西班牙长枪党的新一任党魁。他不仅是长枪党的创始成员，更是领袖挚友与精神导师。马萨斯宣称在他的带领下，西班牙将会彻底重回主的怀抱之中，重新拾回对耶稣基督的敬畏、虔诚与信仰。"
 CAR_Stripping_away_mass_market_mediocrity:0 "剥离大众化庸俗"
 CAR_Stripping_away_mass_market_mediocrity_desc:0 "拉斐尔·桑切斯·马萨斯坚决反对将长枪党降格为纯粹的平民民粹暴动或无产阶级工团组织。在他看来，平民主义的民主选举不过是“庸俗的数字游戏”，真正的政治应当是一群由知识分子、天主教精英与具备骑士精神者所共同统治的威权秩序。"
 CAR_Loving_God_greater_than_loving_country:0 "爱上帝胜于爱祖国"
 CAR_Loving_God_greater_than_loving_country_desc:0 "祖国虽然是极其崇高、不可分割的“宇宙命运统一体”，但它在终极意义上依然只是上帝神圣秩序下的一具世俗工具。祖国必须无条件服务于天主教的普世真理，而绝不能凌驾于上帝的神圣戒律之上。国家一旦脱离了天主教道德的约束，便彻底失去了其存在的神圣合法性；爱国主义如果失去了天主教信仰的锚定，就会不可避免地沦为盲目的暴力与野蛮。"
 CAR_Reviving_Latin_aesthetics:0 "复兴拉丁美学"
 CAR_Reviving_Latin_aesthetics_desc:0 "政治语言应当脱离冷冰冰的法律条文与平庸的议会辩论，提升为具有崇高感、宗教色彩和诗意美感的“修辞学”。政党必须具备独特的视觉美学与符号系统，通过强烈的象征符号来凝聚与感召青年人，将政治活动重塑为一种具有审美体验的“神圣行动”。"
 CAR_The_Holy_War_of_Divine_Right:0 "神权天命之圣战"
 CAR_The_Holy_War_of_Divine_Right_desc:0 "西班牙国家的政治正当性完全来自于其捍卫天主教信仰的“神圣历史使命”。反工团主义、反自由主义不仅是世俗的政治斗争，更是一场天主教文明抵抗唯物主义侵蚀与精神堕落的信仰圣战——这是属于我们这个时代的十字军东征。"
 CAR_Salute_to_the_death_saint:0 "向死亡圣神致敬"
 CAR_Salute_to_the_death_saint_desc:0 "平庸的苟活、对物质享乐的追求以及世俗的安全感，皆是自由资产阶级社会腐朽衰败的产物。而真正的长枪党人应当追求一种“修士兼士兵”的高洁生活方式，应当将政治斗争视为一场神圣的信仰巡礼。为祖国和上帝流下的鲜血是浇灌土壤、使国家灵魂得以复苏的圣水，而死亡则是通往永恒荣耀与民族复兴的必经之路。"
 CAR_The_great_imperial_power_returns_the_world:0 "伟大帝权重归于世"
 CAR_The_great_imperial_power_returns_the_world_desc:0 "西班牙不是由语言、血统或地理边界偶然拼凑出来的世俗国家，而是由上帝赋予了特殊神圣使命的政治实体。它的历史天命就是作为“天主教信仰的护法者”和“拉丁文明的播种者”——从抗击摩尔人的收复失地运动，到对美洲大陆的征服与伟大传教。西班牙只要偏离了这一普世神圣使命，就会陷入衰亡；而长枪党的使命，就是唤醒全体西班牙人重新承担这一崇高天命。"
 CAR_Castroviejo:0 "卡斯特罗维霍重回传统主义"
 CAR_Castroviejo_desc:0 "曾经的传统主义阵营的高级理论家何塞·玛丽亚·卡斯特罗维霍，在老领袖何塞·安东尼奥·普里莫·德·里维拉的支持下正式接任西班牙长枪党的新一任党魁。这标志着传统主义阵营同长枪党达成了历史性的和解与融合，一个崭新的、温和主义的政治时代即将来临。"
 CAR_Personal_independence_and_freedom_of_action:0 "个人独立与行为自由"
 CAR_Personal_independence_and_freedom_of_action_desc:0 "我们坚决反对任何形式的集体主义思想控制与极权压迫。政治体制与国家存在的终极目的，必须是保障个人的尊严与生活的绝对自由，而不是让冷酷的国家机器去奴役每一个活生生的个体。国家的作用应当是建立坚实的制度屏障，以此确保个人的独立与其行为的自由。"
 CAR_Continuing_local_self_government:0 "延续地方自治"
 CAR_Continuing_local_self_government_desc:0 "传统主义团契所一贯主张的地方自治与历史传统绝不能被盲目抛弃。一个高度集权的中央政府势必会严重压制地方文化与区域特性，迫使好不容易愿意同西班牙人站在一起的少数民族重新回到同我们对立的战壕之中。因此，我们必须全面恢复地方法权与地方自治，唯有尊重多元性才能真正团结我们的国家。"
 CAR_Kingless_Traditionalism:0 "无国王的传统主义"
 CAR_Kingless_Traditionalism_desc:0 "谁说传统主义就必须拥戴一个高高在上的国王？何塞·玛丽亚·卡斯特罗维霍认为国王在新社会中的作用微乎其微，甚至可以说是毫无价值。既然健全的社会自治体已经存在，并且完全能够实现自下而上的自我决策，那么国王实际上就可以收拾行囊彻底滚蛋了。一个完美的中央委员会足以取代国王的一切世俗职责，因此西班牙的传统主义不再需要君主。"
 CAR_Nature_spirituality_worship:0 "自然灵性崇拜"
 CAR_Nature_spirituality_worship_desc:0 "何塞·玛丽亚·卡斯特罗维霍将长枪党所崇尚的“西班牙整体性”进行了深度的本土化与具象化，将其转化为对国家各个地区山川、海洋、土地与独特民俗的热爱。国家的真正伟大力量建立在自然生命的有机活力之上，而非冷冰冰、抽象化且缺乏温度的政治概念。"
 CAR_Modern_Don_Quixote:0 "当代堂吉诃德？"
 CAR_Modern_Don_Quixote_desc:0 "深受加利西亚古老贵族传统和天主教修会精神的熏陶与影响，何塞·玛丽亚·卡斯特罗维霍视政治与文学为一种“骑士式的道德担当”。卡斯特罗维霍极度厌恶现代商业社会中的投机取巧、金融炒作与官僚算计，他坚信人应当活得有尊严、讲荣誉、重诺言，将“行动的纯粹性”看得比“政治上的功利得失”重要得多。"
 CAR_Life_Mysticism:0 "生命神秘主义"
 CAR_Life_Mysticism_desc:0 "何塞·玛丽亚·卡斯特罗维霍深入研究了加利西亚本土深厚民俗传说，并将这种关于神灵、鬼怪与冥界文化的古老信仰融合进自己的思想体系。我们应该坦然承认生命的神秘主义，坚决反对唯物论对人类精神世界的粗暴祛魅与功利化破坏。对死亡的敬畏和对超自然民俗的保留是守护民族灵魂、抵抗现代功利主义侵蚀的最重要屏障。"
 CAR_The_Solar_Empire_Rises_Again:0 "太阳帝国二次崛起"
 CAR_The_Solar_Empire_Rises_Again_desc:0 "西班牙帝国已经沉沦了数十载，世人早已遗忘了曾经日不落帝国的辉煌与尊严，西班牙人也因此陷入了对过往岁月的无尽追忆之中。然而，单纯的追忆终归只是虚幻的泡影，无法促使西班牙重新夺回掌握世俗世界的权柄。而现在，西班牙长枪党正带领着全体西班牙人收拾旧山河，重新夺回属于西班牙人的无上财富、霸权与荣耀！"
 CAR_Towards_Nationwide_Revolution:0 "迈向全民革命"
 CAR_Towards_Nationwide_Revolution_desc:0 "那些守旧的右翼分子根本不愿承认西班牙日益尖锐的社会矛盾，妄图通过浮于表面的法团体制来调和阶级冲突，但这不过是他们的自欺欺人。如今的西班牙，早已不再是单纯的利益争端，而是关乎生死存亡的流血厮杀。要想彻底解决当前的社会危机，绝没有温和的折中路线可走，唯一的出路就是革命——一场彻底的、决绝的、属于全西班牙人民的伟大革命！"
 CAR_Get_rid_of_local_privileges:0 "取消地方特权"
 CAR_Get_rid_of_local_privileges_desc:0 "地方自治固然听起来像是一个美好的理想，但幻想终究只能停留在梦境之中。当下的西班牙最迫切需要的是秩序、权威与稳定，而地方自治却将国家推向了不可预测的动荡深渊。没人能猜透那些少数民族政客心里究竟打着什么算盘，今天他们伸手要自治，明天就敢公然叫嚣独立！为了国家的统一与安宁，我们必须果断剥夺他们的自治权，彻底重建强有力的中央集权政府。"
 CAR_Taking_apart_Leviathan_machine:0 "拆解利维坦机器"
 CAR_Taking_apart_Leviathan_machine_desc:0 "官僚主义必须去死！我们绝不能再容忍那群一无是处、只会空谈理论和坐收高薪的腐败政客。西班牙若想破茧重生、迈向新时代，就必须与这套腐朽的旧官僚体制彻底切割。我们将以强硬手段遣散这些毫无担当的旧官僚，并让真正值得信赖、富有干劲的人选来接管政府内部的所有关键职位。"
 CAR_Declare_war_on_theists:0 "向有神论者宣战"
 CAR_Declare_war_on_theists_desc:0 "天主教会骑在西班牙人民头上肆意妄为的时间已经太久了！他们不仅占据着庞大的土地与财富，更在暗中操纵政局，用金钱收买腐败官员作为其傀儡。他们嘴上虔诚地教导人民信仰上帝，背地里却干着中饱私囊、祸害国家的勾当。现在，这群反动教会是时候该彻底滚蛋了！必须将他们的所有土地与资产全部收归国有，并解散这群不事生产的神职人员。"
 CAR_Viva_la_Revolucion:0 "革命万岁！"
 CAR_Viva_la_Revolucion_desc:0 "革命万岁！我们是何塞·安东尼奥的忠诚军团！所有的反动派都将滚入地狱，未来必将属于西班牙的激进青年！西班牙王国执政的漫长岁月究竟给我们带来了多少深重的灾难？腐败透顶的政客、无能窝囊的军警，以及无孔不入的分裂势力，正在疯狂撕扯西班牙的国家灵魂！而我们的革命，将以无坚不摧之势彻底洗刷这片土地上的一切污秽！"
 CAR_End_the_tyranny_of_capital:0 "终结资本暴政"
 CAR_End_the_tyranny_of_capital_desc:0 "资本主义必须彻底覆灭！资本主义给这片土地带来了无休止的剥削与压迫，让饥荒、战争、冲突与死亡四处蔓延。凡是资本主义践踏过的地方，无不散发着令人作呕的血腥气息。那些投靠资本、摇身一变成位资本家的西班牙人，早已不再是我们的同胞；他们的灵魂已被资本彻底剥夺，沦为唯利是图、喝血吃人的恶魔。对于这群背叛国家的寄生虫，唯有彻底消灭他们，将他们送上绞刑架！"
 CAR_Restructuring_vertical_unions:0 "重构“垂直工会”"
 CAR_Restructuring_vertical_unions_desc:0 "在西班牙国家工团主义的理论演进中，曾诞生过“垂直工会”这一看似超前的理念，试图将雇主与工人强行纳入同一个组织以缓解劳资对立。然而说到底，这依然是对资本主义做出的妥协产物。真正的工会必须具备彻底且决不妥协的“反资产阶级”属性。垂直工会的终极使命，绝非在现有的资本主义框架下维持虚伪的劳资和平，而是要通过全面的国有化与对大资本的无偿没收，彻底重构整个国家的经济秩序！"
 CAR_Bullets_and_gunpowder:0 "掷出手榴弹"
 CAR_Bullets_and_gunpowder_desc:0 "我们崇拜绝对的暴力，崇拜一切能够摧毁旧秩序的强权与武力！虚伪的谈判永远换不来我们真正想要的新世界，与那些顽固不化的旧势力妥协也注定毫无结果。只有依靠铁拳才能让他们屈服，不，我们甚至不需要他们的屈服！我们将亲手埋葬这些旧秩序的遗老遗少。既然他们无法融入全新的社会，那么摆在他们面前的道路，就只有死亡！"
 CAR_Federico_Manuel_Hedilla:0 "埃迪利亚奔赴未来"
 CAR_Federico_Manuel_Hedilla_desc:0 "作为一名出身底层无产阶级的国家工团主义理论家，技术工人曼努埃尔·埃迪利亚不仅具备扎实的基层经验，更获得了老领袖何塞·安东尼奥·普里莫·德·里维拉的深厚看好与全力支持。在老领袖的祝福与重托下，他正式接过重担，成为了新一任长枪党党魁。这也代表着着长枪党彻底打破了旧有的保守桎梏，全面且不可逆转地滑向了左翼阵营。"
 CAR_Everything_belongs_to_the_producers:0 "一切归于生产者"
 CAR_Everything_belongs_to_the_producers_desc:0 "我们必须建立起一个由一线工人、专业技术人员和基层管理者共同直接参与的全新工会结构，剥夺资本家对工厂以及各类生产资料的绝对支配权。社会的一切生产资料，都必须完全归属于广大劳动者所有。任何不劳而获的寄生虫，都不配持有哪怕一丝一毫的生产资料；对于工厂生产安排与日常管理的最高权力，也必须坚定不移地交回到双手沾满汗水的劳动者手中。"
 CAR_Stirring_populism_among_civilians:0 "煽动平民民粹"
 CAR_Stirring_populism_among_civilians_desc:0 "如果长枪党不能切实改善底层苦难工人的生活状况，那么长枪党就毫无存在的意义，充其量只是一群“寡头财阀的私人保镖”罢了。长枪党所主导的国家工团主义革命，绝不能是对既得利益者的妥协，而必须是一场由底层广大劳动者亲自主导、全面针对资产阶级剥削与地主寡头压迫的无产阶级革命。向贫苦大众提供饱腹的面包、保障他们的尊严，是我们义不容辞的责任与神圣使命。"
 CAR_Justice_and_dignity:0 "正义与尊严存于此处"
 CAR_Justice_and_dignity_desc:0 "自由资本主义罪恶至极的根源，就在于它将人类宝贵的劳动，降格为与钢铁、煤炭无异的、可以在市场上随意买卖和肆意压价的寻常商品。这种冷酷的制度强行剥夺了工人的灵魂，将活生生的人异化为流水线上冰冷无情的零部件。我们必须明确：劳动是每位公民参与国家建设、实现自我价值的神圣方式！国家必须在法律层面明确承认，劳动者付出的无私汗水，对国家的贡献绝不亚于士兵挥洒的鲜血或知识分子贡献的思想。因此，任何雇主都绝无权力以任何堂皇的借口，随意剥夺工人的工作权与最基本的生活保障。"
 CAR_Encouraging_public_violence:0 "大众暴力的一记重拳"
 CAR_Encouraging_public_violence_desc:0 "底层工人与长枪党的基层战士们在旧体制下久经磨难，不仅饱受资产阶级反动政府警察的残酷镇压，还频繁遭受各类激进分子的暴力袭击。因此，建立坚固的自卫武装、采取直接行动，是平民捍卫生存权利、夺回尊严的唯一途径。然而，我们绝不提倡无差别的滥杀与针对无辜平民的恐怖袭击。暴力必须是有铁的纪律所约束的、专针对政治压迫者的公开反抗，绝不能演变为流氓式的盲目谋杀。"
 CAR_Bottom_up_syndicalism:0 "工团美德，自下而上"
 CAR_Bottom_up_syndicalism_desc:0 "国家工团主义的美德，绝不是停留在惬意咖啡馆里作为理论家们茶余饭后的谈资，更不容许由一群从不参与实际劳动与生产工作的酸腐文人来肆意定义。国家工团主义是一种自下而上的伟大实践，我们所倡导的是真正的无产阶级美德。正是这种植根于劳动现场的美德，促使我们党内的理论家们不得不重新审视自身，逐步打破傲慢与偏见，彻底改造他们过去落后而僵化的观点与认知。"
 CAR_The_old_order_went_up_in_flames:0 "旧秩序付之一炬"
 CAR_The_old_order_went_up_in_flames_desc:0 "对祖国无比炽热的热爱，以及对命运不公的激愤，促使我们义无反顾地加入长枪党，成为其中一员。我们坚决反对压迫，唾弃一切形式的肆意剥削。尽管我们的党在历史上长期被划归于右翼阵营，但我们始终保持清醒，绝不与那些僵化保守的右翼势力同流合污！我们无比清楚自己究竟为何而战，为了心中坚守的正义，为了我们的祖国能从灾难与动荡的洪流中得以解脱，为了同胞们不再遭受无休止的苦难"
 CAR_Marciano_Pedro_Durruti:0 "马尔恰诺与工人同行"
 CAR_Marciano_Pedro_Durruti_desc:0 "为了彻底实现长枪党与无政府主义阵营之间的历史性和解，何塞·安东尼奥·普里莫·德·里维拉决定将布维那文图拉·杜鲁提的亲弟弟，同样在伊比利亚无政府主义联盟深具影响力的骨干成员马尔恰诺·佩德罗·杜鲁提，正式提拔为西班牙长枪党的新一任最高党魁。"
 CAR_Victory_achieved_through_strategy:0 "打入策略大获全胜"
 CAR_Victory_achieved_through_strategy_desc:0 "马尔恰诺·佩德罗·杜鲁提在精神上始终是一名坚定不移的无政府主义者，哪怕在打入长枪党内部之后也绝未动摇。他敏锐地洞察到了长枪党潜在的革命能量，以及其在基层群众中所拥有的深厚阶级根基，因而选择借壳发展，将党作为践行其无政府工团主义理想的全新舞台。令人始料未及的是，他竟一路晋升并最终登上了长枪党权力的顶峰，这意味着伊比利亚无政府主义联盟对长枪党的全面渗透与改造取得了空前的绝对胜利。"
 CAR_Free_our_fellow_compatriots:0 "解放我等同胞"
 CAR_Free_our_fellow_compatriots_desc:0 "我们完全可以充分激活并利用起伊比利亚无政府主义联盟遍布全社会的高效组织网络与基层动员体制，将其与长枪党的基层支部深度有机结合，进而构建出一个纵横交错、覆盖全国的无政府主义革命网络。这一庞大的基层联合体，将成为我们彻底摧毁并解散各地反动专制政府及右翼残余抵抗势力的最锋利武器，推动西班牙的无政府主义革命向着最终目标迈出关键一步。"
 CAR_Expel_right_wing_members:0 "开除右翼分子"
 CAR_Expel_right_wing_members_desc:0 "如今的西班牙长枪党内鱼龙混杂，寄居着大量的右翼极端分子、前军方要员以及保守旧势力。如果我们希望将长枪党彻底改造为纯洁的无政府主义革命组织，就必须果断地将这批反动右翼分子彻底开除出党。他们的存在严重毒害了党的革命肌体，是阻碍我们实现全面工团联合与彻底社会变革的最大绊脚石。"
 CAR_No_place_for_speculators:0 "无投机者的容身之处"
 CAR_No_place_for_speculators_desc:0 "在任何革命时代，投机倒把分子永远都是最令人唾弃的社会毒瘤。西班牙内战刚刚落幕，这群无耻之徒便肆意囤积居奇粮荒物资，再以高昂暴利剥削贫苦大众；如今他们又企图兴风作浪，破坏来之不易的革命新秩序，妄图制造市场恐慌以哄抬物价。对于这群社会寄生虫，我们绝不能手软，唯有铁血镇压：杀一批不听话，就全部镇压干净！投机者根本不配存活于这场伟大的新社会变革之中。"
 CAR_Syndicalist_Reconciliation:0 "工团主义大和解"
 CAR_Syndicalist_Reconciliation_desc:0 "无论长枪党、伊比利亚无政府主义联盟、全国劳工联合会，还是工团党，我们在本质上都是广义的工团主义信仰者，仅仅是对工团主义的实现路径与理论理解各有千秋罢了。在这生死存亡的关头，我们绝不能继续陷入无休止的内部倾轧与同胞相残。此刻全西班牙工团力量最迫切需要的是大联合，无条件的、彻底的阶级大联合，共同筑起坚不可摧的统一战线，一举铲除右翼军人与保王派反动势力。"
 CAR_The_Rise_of_Black_Revolution:0 "黑色革命遍布全国"
 CAR_The_Rise_of_Black_Revolution_desc:0 "革命的发展一切顺遂，无政府主义的风暴已经以不可阻挡之势席卷了整座西班牙半岛。各地区的自治公社正如雨后春笋般步入建构正轨，反动右翼力量在我们连续不断的毁灭性打击下逐步灰飞烟灭。完全可以预见，西班牙即将浴火重生，跃升为人类历史上第一个真正意义上的无政府主义国家，这是属于全体无政府主义者与无产阶级历史性的伟大胜利。"
 CAR_Julio_Ruiz_de_Alda:0 "阿尔达征服西班牙"
 CAR_Julio_Ruiz_de_Alda_desc:0 "胡里奥·鲁伊斯·德·阿尔达，一位性格桀骜不驯的传奇飞行员，同时也是未来的忠实拥护者。尽管老领袖何塞·安东尼奥·普里莫·德·里维拉此前并不完全看好这个思想激进的青年，但阿尔达依然凭借其独特的魅力，在党内赢得了广大激进派分子与无产阶级基层的热烈支持，一举登上高位，成为了长枪党的新任党魁。狂风将至，一场真正震古烁今的革命即将呼啸而至。"
 CAR_Conquer_the_sky_overcome_the_past:0 "征服天空，战胜过去"
 CAR_Conquer_the_sky_overcome_the_past_desc:0 "战机引擎咆哮的轰鸣、重工业钢铁的巨响以及高压电网交织的轨迹，才是西班牙摆脱数百年停滞与中世纪落后状态的真正救星！我们应当疯狂崇拜速度、冲击力与现代机械所代表的不可阻挡的磅礴力量。只有这种现代化力量，才能彻底洗刷掉西班牙国民性格中积重难返的拖沓、悲观以及在茶馆里进行无聊议论的陋习，进而建立起一种充满无限动能的现代民族意识。"
 CAR_technocratic_system:0 "采纳技术官僚体制"
 CAR_technocratic_system_desc:0 "未来新兴的国家，应当由具备扎实专业技能的技术专家、工程师、经济学家以及精明强干的军团组织者来全面主导，而不是交由那些只会耍嘴皮子、搬弄是非的政客说客！资本家与工人之间的剧烈冲突，归根结底是生产技术落后和管理混乱失调的产物。只要通过技术官僚体制制定出科学严密的生产指标、统筹社会资源并建立健全的福利配给，就能从根本上消解马克思主义式的阶级斗争，实现国家的长治久安。"
 CAR_Talk_less_do_more:0 "少说多做"
 CAR_Talk_less_do_more_desc:0 "是行动创造了思想，绝非空洞的思想决定行动。我们党内的一部分理论家只懂得关在房间里空谈理论，根本不懂得如何将思想深入到广大基层大众之中。大众若无法理解我们的主张，自然就不会支持我们未来的伟大行动；而那些高傲的理论家又反过来厌恶大众的不理解。这是极其荒谬的！如果我们不用切实可行的实际行动去破局，广大普通大众又怎么可能真正理解并跟随我们？"
 CAR_Spreading_the_spirit_of_the_legion:0 "播撒军团精神"
 CAR_Spreading_the_spirit_of_the_legion_desc:0 "真正稳固的社会秩序，必须建立在军团式的绝对服从、阶级壁垒的彻底抹平以及生死与共的同袍情谊之上。在严明的军团纪律面前，绝没有高低贵贱的贵族与平民之分，只有坚定执行命令的铁血士兵。牺牲绝不是为了换取天主教虚无缥缈的天堂救赎，也不是一场自娱自乐的浪漫诗歌吟诵，而是为了完成一项必须被彻底执行的神圣使命。我们要死得其所、死得有价值，那些毫无意义的无谓殉道与虚假感动，应当越少越好。"
 CAR_Integrate_JONS:0 "整合进攻委员会"
 CAR_Integrate_JONS_desc:0 "所幸的是，真正理解我们思想的并非只有我们自己。国家工团主义进攻委员会中的许多同道，都与我们怀揣着完全相同的理想。他们的理论架构与我们有着极多的吻合之处，并且他们在社会底层同样赢得了深厚的群众支持。我们可以顺应大势同他们走向合并，唯有如此，才能进一步巩固并深化我们在基层大众中的绝对影响力。"
 CAR_Youth_Commando:0 "工团青年突击队"
 CAR_Youth_Commando_desc:0 "西班牙第二共和国乃至整个西班牙王国最根本的病灶，就在于秩序的荡然无存以及无政府主义暴动的日益猖獗。因此，长枪党必须迅速重塑自身，成为一支由退伍军人与激进青年学生紧密构成的政治突击队！我们将用绝对严密的纪律与冷酷的武力，去铁腕遏制无政府主义者的反动暴论。如果他们依然执迷不悟、不愿意安分守己，那我们便会将冰冷的枪口直接抵在他们的脑门上，让他们连同那些愚蠢无知的幻想，一同滚下地狱。"
 CAR_Gerardo_Salvador_Merino:0 "梅里诺继续战斗"
 CAR_Gerardo_Salvador_Merino_desc:0 "作为垂直工会的工会代表，同时也是激进工人运动的卓越领袖与理论大师，赫拉尔多·萨尔瓦多·梅里诺获得了何塞·安东尼奥·普里莫·德·里维拉的全力支持，顺理成章地接任西班牙长枪党的新一任党魁。在他的领导下，长枪党的国家工团主义革命正式迈入了一个更加激进、更加系统化的全新阶段。"
 CAR_Break_away_from_republican_absurdity:0 "脱离共和荒谬"
 CAR_Break_away_from_republican_absurdity_desc:0 "西班牙第二共和国不过是一个彻头彻尾的失败政治实体，从其诞生的那一刻起，便无可救药地沉屙于派系内斗与议会泥潭之中。同属于共和阵营的各个党派为了私利互相拆台、肆意内耗，最终给君主制复辟势力与极右翼军阀提供了可乘之机，导致了共和国的全面溃败。西班牙从来不缺少对共和制的美好幻想，但也总是有人在亲手扼杀这些幻想。因此，我们必须果断切割并远离那些打着“共和”旗号的虚伪叛徒，用我们自己的铁腕与革命手段，去缔造一个真正属于人民的真共和。"
 CAR_Down_with_the_bourgeoisie:0 "打倒资产阶级"
 CAR_Down_with_the_bourgeoisie_desc:0 "长枪党的革命本质上是一场属于无产阶级的激进革命。资产阶级如果还企图依靠国王的圣旨或那些极右翼军人的枪杆子来恢复旧时代残忍的剥削秩序，就是对所有长枪党革命殉道者鲜血的无耻背叛！他们就是寄生在国家躯体上的毒瘤，如果这群资本家还企图在新的西班牙苟延残喘，就必须收起傲慢，老老实实服从国家与工团的绝对意志。"
 CAR_The_Land_of_Thousands_of_Trade_Unions:0 "万千工会之国"
 CAR_The_Land_of_Thousands_of_Trade_Unions_desc:0 "在我们的宏伟蓝图下，全国所有的工业、农业、金融以及物流交通部门，都将完全置于“垂直工会”的绝对掌控与统筹调度之下。无论是市场定价权、原料配给方案、生产配额指标，还是全社会的劳工统筹安排，均由垂直工会一手执掌。只有将工会打造成超越一切社会组织的绝对国家机器，长枪党才能在西班牙这片土地上真正建立起坚不可摧的国家工团主义革命秩序。"
 CAR_forced_integration:0 "强迫式一体化"
 CAR_forced_integration_desc:0 "所有资本家与工人将被强制统一编入同一个产业工会之中。在法律层面上，资本家将彻底失去自由市场赋予的雇主特权与剥削自由，而被强行降格为无条件服从国家计划与工会指令的企业生产队长。国家严禁资本家出于利润考量而随意裁员或压低工人工资；若企业面临亏损，必须由工会直接介入接管或统筹协调。资本家将完全丧失独立运营企业的权力，必须毫无保留地服从工会下达的所有社会责任与生产指标。"
 CAR_Strength_comes_from_joy:0 "“力量来自欢乐”"
 CAR_Strength_comes_from_joy_desc:0 "我们将全面建立起由长枪党工会绝对垄断的工人休假、体育竞技、文艺宣教与职业技能培训网络。带薪休假、廉价国家旅游以及高质量的文化生活不再是资产阶级的独占特权，而是国家赋予全体劳动者不可剥夺的基本权利。我们要通过提供高标准的国家劳工福利，在思想与心理上彻底凝聚工人阶级，使其心甘情愿地为祖国的繁荣与伟大复兴贡献全部力量。"
 CAR_Opposing_the_idea_of_class_harmony:0 "阶级和睦论下地狱"
 CAR_Opposing_the_idea_of_class_harmony_desc:0 "传统天主教社会学说所宣扬的“资本家要仁慈，工人要顺服”式的道德和睦，不过是一种虚伪至极的父权式温情。这种教条本质上是在用宗教麻醉剂掩盖资本主义血淋淋的剥削真相。社会正义绝不能建立在资本家可笑的道德觉悟或虚伪的宗教施舍之上，唯有通过制度化的工会力量，才能彻底重塑公平的阶级秩序。"
 CAR_Militant_nationalist:0 "战斗的国家主义者"
 CAR_Militant_nationalist_desc:0 "我们是坚定的战斗国家主义者，彻底拒绝任何形式的妥协、软弱与政治苟合。外交谈判只是弱者与投降派的借口，真正的革命者应当手握利剑，向一切不公、压迫与旧秩序发起义无反顾的决斗！我们的国家主义绝不会浮于表面口号，全社会每一个人都是这场国家主义革命中不可或缺的钢铁螺丝钉。我们战斗，我们冲锋，我们誓为重塑一切社会公正而血战到底。"
 CAR_rebuild_command:0 "重建国家指挥体系"
 CAR_rebuild_command_desc:0 "自军队接管我国政权以来，军费预算便大幅膨胀，然而这些资金全都流入了贪腐军官的腰包。要让国家重新挺直脊梁，尚有诸多改革亟待推进，军事领域的革新自然也不例外。"
 CAR_standing_army:0 "长靴在地"
 CAR_standing_army_desc:0 "自古以来，战争的胜负靠的最终还是大地上的铁血士卒，各式各样的步兵始终是战场上的中坚力量。纵使现代战争变得愈发致命与多元，步兵仍是全球各支军队的主心骨。既然西班牙缺乏资金大规模采购坦克和战机，那我们就必须倾尽全力锤炼士兵。"
 CAR_mobile_army:0 "机动战的魅力"
 CAR_mobile_army_desc:0 "尽管步兵部队显然仍将是我军建设的重点，但我们必须组建机动部队以应对敌军的战略发展。这支快速反应力量既能镇压非洲殖民地与本土的叛乱活动，亦可作为未来摩托化与机械化建设的试验平台，具体发展路径将取决于我们选择的战略方向。"
 CAR_new_equipment:0 "物质战场的残酷现实"
 CAR_new_equipment_desc:0 "当今的战争形态已与我军所熟悉的作战方式截然不同。要击败敌人，尤其是在战事陷入世界大战那般的消耗战泥潭时，就必须取得物质层面的绝对优势，无论是武器装备、弹药补给还是其它军需物资。"
 CAR_artillery_focus:0 "不屈不挠的人类精神"
 CAR_artillery_focus_desc:0 "物质优势固然重要，但当麾下士兵弃守溃逃或向敌军投降时，这一切便毫无意义。若不施行严苛军纪、不充分运用宣传手段、不着力弘扬西班牙精神至高无上的信念，我们便无法确保将士能够承受战争的残酷。西班牙军队中秉持传统理念的军官们坚定支持这种精神战法的导向，通过严酷训练锻造士兵意志，直至其精神力量足以碾碎敌人的斗志。"
 CAR_tank_focus:0 "机械之魂"
 CAR_tank_focus_desc:0 "人的精神或许是我们最强大的武器，但凡人皆会犯错，失误在所难免。机器虽非完美，其可靠性却远胜血肉之躯。借助现代战争兵器之力，我们终将锻造出一支不受普通士兵脆弱心智影响的钢铁之师。"
 CAR_army_innovation:0 "为了祖国"
 CAR_army_innovation_desc:0 "随着教义决策的确立与改革进程的稳步推进，我们可以欣慰地宣告：那个充斥着庸碌无为、玩忽职守与军中腐败的黑暗时代已永远成为历史。西班牙军队正昂首迈入全新时代，再不会受谄媚之徒摆布，取而代之的是深谙现代战略精髓、能因地制宜发挥装备优势的杰出将校们执掌帅印。"
 CAR_air_academy:0 "国立航空学院"
 CAR_air_academy_desc:0 "内战结束后，有人提议设立一所全新的空军学院，专司训练我们英勇的空军、研习新兴航空作战理论。建立学院的成本十分低廉，但给我们的空军带来的巨大优势却不言而喻。"
 CAR_air_factory:0 "伊比利亚飞机制造厂"
 CAR_air_factory_desc:0 "内战前我们曾有计划在马德里附近开设一家新的飞机工厂，但糟糕的经济形势和战争的爆发使得一切投资都无法进行。但现在我们赢得了光荣的胜利，我们终于有机会资助它了。"
 CAR_air_focus:0 "伊比利亚苍穹的无匹之主"
 CAR_air_focus_desc:0 "在我们加速飞机生产的同时，必须同步培养飞行员与地勤人员以适应规模扩张。唯有如此，当我们的空军机群足以与敌军抗衡时，全体人员才能以完备的训练状态迎接空战险境。尽管西班牙薄弱的航空工业将延缓这一进程，但我们仍需大幅增加新型战机研发与技术创新的资金投入，以期更高效地击溃敌人。"
 CAR_naval_academy:0 "水陆并进"
 CAR_naval_academy_desc:0 "西班牙海军或为我国军种中最为先进者，拥有诸多创新性设计，如代达罗斯水上飞机母舰、多型潜艇，以及各式战列舰。不过，这支看似辉煌的舰队，实则正受困于预算限制、海上战略需求的缺失，以及造船厂与干船坞亟需扩建的窘境。若西班牙欲以海洋强国之姿重返世界舞台，重振无敌舰队荣光之路仍任重道远。"
 CAR_shipyards:0 "拉康斯特鲁克托拉的不灭熔炉"
 CAR_shipyards_desc:0 "升级巴塞罗那老化的造船设施是我们建设一支真正强大的西班牙舰队最有希望的途径。"
 CAR_expand_navy:0 "第二波珍宝船队"
 CAR_expand_navy_desc:0 "珍宝船队曾是十六世纪至十八世纪帝国衰落前的西班牙海上贸易命脉，其航线遍及全球，从可可、香料与丝绸等奢侈品，到新大陆的资源与战利品无所不运。如今我国商船队虽不复往日荣光，希望之火却仍未熄灭。若加大对西班牙跨洋公司、菲律宾烟草公司等企业的扶持力度，或能再度于我国昔日帝国疆域内拓展贸易影响力，重启昔日的奢侈品与资源贸易。当然了，若想抗衡英德的航运帝国，我们仍有漫漫长路需砥砺前行。"
 CAR_navy_focus:0 "重现西班牙级战列舰的辉煌"
 CAR_navy_focus_desc:0 "西班牙级战列舰建于1909至1923年间，其中西班牙号不幸于里夫战争期间因风暴受损沉没。时至今日，这些战舰虽仍是西班牙舰队中最为强大的力量，却已是旧时代遗物，其采用的英式无畏舰设计已完全过时。不过，若战舰依旧具备作战能力时，另起新炉灶实属吃力不讨好，是故海军技术委员会决定实施大规模改造计划，为其配备新型副炮，升级防鱼雷鼓包，将旧副炮位改为船员舱室，同时把防空火控系统升级至欧洲现代标准。"
 CAR_guard_border:0 "保卫边界"
 CAR_guard_border_desc:0 "跨过比利牛斯山的诸多小道无疑是我们唯一的弱点。我们必须加固我们的边界，至少在我们还能保卫这道防线的时候，没有人能够推进西班牙的领土。"
 CAR_cavalry_focus:0 "骑兵队万岁"
 CAR_cavalry_focus_desc:0 "当世界大战的恐怖席卷全球时，骑兵的作战方式似乎已被时代淘汰，铁丝网、机枪与重炮的火力网让传统骑兵彻底沦为过时兵种。但在伊比利亚半岛的崎岖山地间，战马仍可能找到用武之地，特别是当我们能将其他兵种整合进骑兵部队，使其更适应现代战争形态之时。"
 CAR_fortress_busters:0 "无坚不克之铁锤"
 CAR_fortress_busters_desc:0 "现代战争正朝着多个引人注目的方向发展，但可以预见的是，防御工事在未来战争中仍将扮演重要角色。通过配备重型火炮及针对各类防御建筑技术研发的现代化弹种，我们将确保我军永远不会被敌方碉堡或地堡群所阻滞。"
 CAR_composite_divisions:0 "混成师"
 CAR_composite_divisions_desc:0 "共和派军官们在那些注定失败的改革中，曾提出过一个耐人寻味的概念：混成师构想。这些师团将配备比敌军常规步兵部队更为机动灵活的炮兵力量，虽然需要更庞大的补给体系和更复杂的后勤网络来维持运作，但与之对应的压倒性火力优势，足以让我军将士摧枯拉朽般攻克最坚固的据点，击溃最顽强的守敌。"
 CAR_the_queen_on_our_board:0 "军中皇后"
 CAR_the_queen_on_our_board_desc:0 "西班牙陆军必须将步兵锻造成全能兵种，既能依托整合炮兵力量快速转战各条战线压制敌军，又保有令人生畏的掘壕固守能力以抵御敌方进攻或反击。为此，我们必须通过严格训练使步兵师成为战场上的棋盘皇后，凭借无与伦比的战术灵活性始终掌控战场主动权。"
 CAR_fire_superiority:0 "以炮火之雨淹没敌寇"
 CAR_fire_superiority_desc:0 "西班牙炮兵部队的装备长期处于落后状态，但近期我们通过引进大量德国FK.16野战炮与奥匈帝国M.14榴弹炮，显著增强了原本依赖英法老旧火炮的炮兵阵容。为确保这些新型火炮的弹药供给，必须立即建立国产弹药工厂，届时我们将能以铺天盖地的炮火彻底碾碎敌军阵地。"
 CAR_the_traditional_arm:0 "阿努瓦勒惨案绝不重演！"
 CAR_the_traditional_arm_desc:0 "在阿卜杜勒·克里姆领导的里夫部落武装手中遭遇的阿努瓦勒战役惨败，堪称我国二十世纪最惨痛的军事失利。但通过加强殖民地卫队建设，同时改进西班牙外籍军团的训练体系与武器装备，我们必将确保里夫部落乃至任何非洲势力再也无法威胁我国的海外领地。"
 CAR_cyclists_and_sappers:0 "拓宽骑兵定义"
 CAR_cyclists_and_sappers_desc:0 "上世纪所定义的骑兵部队如今已基本过时，但广义的骑兵概念仍具现实意义。一方面，西班牙国民警卫队与卡宾枪骑兵等部队在欠发达地区仍需依赖马匹执行任务；另一方面，正规军骑兵单位作为侦察兵、反游击队力量及殖民守卫仍具重要价值。但我们可以通过将工兵部队与自行车部队纳入骑兵编制来拓展其定义——这不仅能为骑兵提供亟需的多功能作战能力，更能显著增强其火力配置。若再配备诸如1916型37毫米TRP步兵炮这类轻便易携的强力武器，该火炮虽在常规作战中略显落伍，但凭借骑兵部队的机动性将能发挥更大效能，骑兵部队的战斗力将得到进一步强化。"
 CAR_heavy_cavalry:0 "现代重骑兵"
 CAR_heavy_cavalry_desc:0 "当西班牙骑兵军官团将骑兵发展理论化时，重骑兵的构想再度浮出水面。虽然枪骑兵、胸甲骑兵与战车部队显然已成历史陈迹，但德国在大战中的经验证明，军队仍需要类似暴风突击队那样机动性强、打击迅猛的作战单位。西班牙军官们提出，这一战术空缺可由骑兵填补，这些骑乘战马的突击队员可效仿德国步兵下马攻击固定阵地，同时根据战场态势保留马上作战能力。尽管此类部队仍需实战检验，但它或许能为骑兵部队注入新的生命力。"
 CAR_motorization:0 "新时代的新坐骑"
 CAR_motorization_desc:0 "西班牙军队的机械化程度严重不足，甚至连地方警察部队的机动装备都常优于正规军。必须立即纠正这一状况，应委托本国汽车制造商伊斯帕诺-苏伊萨公司为陆军生产更多卡车，以提升部队战场机动能力。"
 CAR_flesh_over_machine:0 "卡斯蒂利亚骑士"
 CAR_flesh_over_machine_desc:0 "尽管当今的坦克与装甲车堪称骇人兵器，但在伊比利亚半岛崎岖复杂的地形中，它们远不及那些斗志昂扬、装备精良且训练有素的卡斯蒂利亚骑士。这些骑士凭借登峰造极的武艺，能灵活运用各类武器库中的装备，在机动性与战术迂回方面完全碾压机械驱动的对手。"
 CAR_maneuvre_warfare:0 "速度胜于停滞"
 CAR_maneuvre_warfare_desc:0 "世界大战演变成了一台巨型绞肉机，尤其是在西线战场，究其根源在于交战双方都缺乏机械化时代和自动武器时代所需的机动速度。我们绝不能重蹈覆辙，必须全力确保西班牙军队具备足够的敏捷性，避免陷入我们在世界大战中目睹的那种消耗战泥潭。"
 CAR_morale_above_all:0 "战争即为意志较量"
 CAR_morale_above_all_desc:0 "当代所谓“军事专家”或许会宣称，战争胜利不过是物质力量的碾压——要么靠补给数量取胜，要么凭武器质量制敌。此乃谬论。战争实为意志的角力场，唯有真正灌注胜利之魂的军队，才能击垮那些斗志涣散、训练废弛的对手。因此我们必须确保西班牙士兵做好战争准备，在这场精神韧性的拉锯战中，具备从心理层面压倒敌人的制胜之道。"
 CAR_local_terrain_local_means:0 "西班牙特色战法"
 CAR_local_terrain_local_means_desc:0 "西班牙的地形极具特色，地形起伏多变，河流纵横交错，各地区植被分布不均，诸多区域道路状况欠佳。因此必须让西班牙军队的指挥官们充分掌握克服这些恶劣条件的战术，使其能在敌军尚未适应伊比利亚环境之时，巧妙利用这些地理特性实施伏击、设陷与围歼。"
 CAR_the_desire_for_victory:0 "自力更生！"
 CAR_the_desire_for_victory_desc:0 "在经历了多年的衰落后，我军必须重整旗鼓。虽然仅靠纪律整顿或许能见效，但若同时提高士兵军饷并大规模开展爱国主义与军国主义宣传，必将取得更显著的成效。即便是西班牙最底层的列兵也必须明白：唯有甘愿为永恒之西班牙奉献一切，我们才能在未来的战场上击溃敌人。"
 CAR_military_autarky:0 "用我们自己的双手"
 CAR_military_autarky_desc:0 "我们不能指望邻国为我们提供最新装备或未来武器的优质蓝图，而必须实现一定程度的军事自给自足，仅仅依靠西班牙本土企业与兵工厂来锻造战争机器。毕竟当今世界风云变幻，若在世界大战阴云密布之际仍依赖外国供应商，这无异于自取灭亡。"
 CAR_montojas_heavy_cavalry:0 "无马铁骑"
 CAR_montojas_heavy_cavalry_desc:0 "骑兵冲锋战术早已为现代机械与防御技术淘汰，取而代之的是坦克。恰如旧时的重甲铁骑，若能适时运用装甲战车，便可围歼敌军，撕裂防线，趁隙突入后方补给线实施袭扰。"
 CAR_lluchs_motorized_infantry:0 "迅猛精兵"
 CAR_lluchs_motorized_infantry_desc:0 "我军最具才华的将领之一比森特·罗霍·柳奇，潜心研读了英国流亡坦克指挥官J·F·C·富勒的理论，提议组建全机械化步兵部队。这支部队不仅能与我军坦克协同推进，更能通过持久作战填补装甲部队的战术空白。"
 CAR_upgrade_the_trubias:0 "重启特鲁维亚工程"
 CAR_upgrade_the_trubias_desc:0 "在里夫战争期间，我国坦克部队的缺陷暴露无遗，装备陈旧笨重、故障频发，加之里夫地区的地形完全不适合坦克作战。为扭转这一劣势，炮兵上尉卡洛斯·鲁伊斯·德·托莱多（这位西班牙少数具有实战坦克指挥经验的军官）着手研发了国产首型坦克，特鲁维亚A4型。尽管该项目因资金短缺和关注度起伏而进展坎坷，目前仅生产了少量样车且研发长期停滞，但若能获得应有的资源投入，特鲁维亚系列必将成为西班牙陆军的新支柱。"
 CAR_weapons_of_opportunity:0 "捕捉战机的武器"
 CAR_weapons_of_opportunity_desc:0 "坦克是骑兵作为机动武装的定位的继承者，对我们而言更是如此。我国没有鲁尔河沿岸那些能锻造出钢铁巨兽的大型兵工厂，但依托现有工业基础可以制造轻型坦克，而它们将成为伺机而动的利器，通过机动迂回而非像德军那样从正面以不可阻挡的装甲洪流冲击敌军碉堡的方式来消灭敌人。我们的坦克应是捕捉战机的武器，最大限度利用敌方失误。"
 CAR_tank_focus_1:0 "机械之魂"
 CAR_tank_focus_1_desc:0 "人的精神或许是我们最强大的武器，但凡人皆会犯错，失误在所难免。机器虽非完美，其可靠性却远胜血肉之躯。借助现代战争兵器之力，我们终将锻造出一支不受普通士兵脆弱心智影响的钢铁之师。"
 CAR_tank_focus_2:0 "机械之魂"
 CAR_tank_focus_2_desc:0 "人的精神或许是我们最强大的武器，但凡人皆会犯错，失误在所难免。机器虽非完美，其可靠性却远胜血肉之躯。借助现代战争兵器之力，我们终将锻造出一支不受普通士兵脆弱心智影响的钢铁之师。"
 CAR_tank_focus_3:0 "机械之魂"
 CAR_tank_focus_3_desc:0 "人的精神或许是我们最强大的武器，但凡人皆会犯错，失误在所难免。机器虽非完美，其可靠性却远胜血肉之躯。借助现代战争兵器之力，我们终将锻造出一支不受普通士兵脆弱心智影响的钢铁之师。"
 CAR_expanded_cooperation:0 "空地协同作战体系"
 CAR_expanded_cooperation_desc:0 "现代战场态势瞬息万变，胜利已非单一军种所能独揽。通过强化陆军与空军各兵种间的协同作战能力，西班牙方能确保在现代联合作战中不落人后。近距空中支援对步兵至关重要，新型侦察机更能助力海军与地面炮兵以前所未有的精度摧毁目标。同理，战斗机护航将使我方部队在推进时免受敌军攻击机袭扰。"
 CAR_cierva_autogyros:0 "谢尔瓦的工程奇迹"
 CAR_cierva_autogyros_desc:0 "胡安·德拉谢尔瓦是西班牙最负盛名的航空先驱之一，其创立的谢尔瓦旋翼机公司因成功研制自转旋翼机而享誉全球。这种无需机翼、仅靠旋翼提供升力的无动力飞行器，在军事及海军侦察领域具有划时代意义。虽然自转旋翼机已能胜任多种任务，但该公司正着手研发搭载引擎的改进型号，有望为我军提供更强大的战术支援。"
 CAR_utilize_local_talents:0 "颂扬本土飞行员"
 CAR_utilize_local_talents_desc:0 "虽然西班牙绝非航空发展的领头国家，但本土仍存在相当浓厚的航空热情，甚至涌现过一些著名飞行家——例如曾驾驶“Plus Ultra”号水上飞机创下远距飞行纪录的冠军拉蒙·佛朗哥、里夫战争王牌飞行员兼哈拉马伯爵华金·加西亚，以及来自巴塞罗那的天才女飞行员玛丽亚·何塞普·科洛梅尔。若能善用这些人物来激发民众对航空的兴趣，必定将有效提升我们的飞行员招募率，同时也能增强新兵的初始经验。"
 CAR_fokker_cooperation:0 "与福克接洽"
 CAR_fokker_cooperation_desc:0 "福克公司是最负盛名的航空创新者之一，其创始人安东尼·福克在世界大战期间设计了福克E.1单翼机与声名狼藉的福克Dr.1三翼机等标志性机型，后者更是传奇王牌“红男爵”的专属战机。战后福克回到祖国荷兰开设工厂，凭借荷兰中立国的特殊地位，向国际联盟、协约国与帝国公约三大阵营之外的势力供应军机。其最新产品福克D.XXI战斗机因采用固定式起落架与混合材料机身等创新设计，已被芬兰与荷兰本国等多个欧洲国家列装。鉴于我方与福克公司长期保持项目合作，在新型战机研发阶段重启洽谈实属必然。"
 CAR_german_cooperation:0 "伴鹰翱翔"
 CAR_german_cooperation_desc:0 "关于世界大战期间德英空战的传说虽带有神话色彩，但德国空战经验确实货真价实。他们的专家运用了用世界大战鲜血换来的知识，将航空技术推向极致。若能深化与德国飞机制造商的合作，对我们大有裨益。毕竟亨克尔、道尼尔和齐柏林这些巨头企业的产能远非国内所需，我们完全可以通过引进其机型来壮大正在蓬勃发展的空军力量。"
 CAR_hispano_suiza_cooperation:0 "依靠希斯巴诺-苏莎，创立西班牙国内航空"
 CAR_hispano_suiza_cooperation_desc:0 "尽管西班牙对全球航空热潮贡献甚微，但我们并非没有飞机制造商。其中最负盛名的当属希斯巴诺-苏莎公司，这家军工企业原本生产各类武器车辆，近年来已将业务拓展至航空领域，例如研制了HS.34双翼教练/侦察机。与其斥巨资从海外采购，我们更应加大对本土航空业的投入，这既能扶持民族工业，又能为西班牙的专家与技术工人创造就业机会。"
 CAR_Hispano_Aviacion:0 "创办西班牙航空"
 CAR_Hispano_Aviacion_desc:0 "得益于政府提供的充裕资金支持，希斯巴诺-苏莎公司已开始筹划在国内开设飞机制造厂的前景。该公司向我们申请资金成立子公司“西班牙航空”，专门负责飞机制造、设计、测试及营销业务，而母公司希斯巴诺-苏莎则继续专注于传统生产领域和盈利项目。尽管西班牙当前面临经济困境，政府仍决定为这项事业提供资助，以期助力打造真正自主的国产空军力量。"
 CAR_CASA_lisences:0 "西班牙航空制造公司引进德制设备"
 CAR_CASA_lisences_desc:0 "西班牙航空制造公司是一家专注于双引擎设计的轻型飞机制造商，但他们在大型飞机领域的经验可相对容易地转化为轰炸机的研发。不过，西班牙航空制造公司代表表示更倾向于直接引进德国设计授权，因其军用机型经验有限，而德国轰炸机素以结构坚固和载弹量优异著称。"
 CAR_air_cruisers_over_spain:0 "空中巡洋舰游猎西班牙"
 CAR_air_cruisers_over_spain_desc:0 "荷兰“空中巡洋舰”理念的最佳诠释者当属福克G.1重型战斗机，这款战机在欧洲航展甫一亮相，就以超凡性能令航空专家们叹为观止。尽管体型庞大却兼具迅捷与灵敏的非凡特质，福克公司代表宣称：鉴于我们最可能的对手公社空军规模优势，该机型堪称满足西班牙防空需求的完美截击机。"
 CAR_multirole_bombers:0 "通用型轰炸机"
 CAR_multirole_bombers_desc:0 "荷兰人在轰炸机研发上独辟蹊径，与欧洲其他国家大相径庭。福克T.V轰炸机完美体现了其多功能轰炸理念，这种战机具备超长续航能力，可在空域持续盘旋待命。机首配备的20毫米厄利孔机炮赋予其轻型拦截能力，能有效缓解我方战斗机的压力；同时其可观载弹量又使之随时可化身战术轰炸机。拥有如此多面手的飞行器，意味着我们能用更少数量达成战略目标，这对预算吃紧的西班牙而言无疑是重大利好。"
 CAR_learning_from_the_best:0 "追随男爵尾流"
 CAR_learning_from_the_best_desc:0 "虽然西班牙不乏优秀飞行员，但向德国精英飞行员取经对我们大有裨益，他们中许多人经历过世界大战，更有近期阿富汗远征的实战经验。为此，我国将派遣最精锐的飞行员小队赴德求学，向这些苍穹大师取经。待战事来临之时，我们的领空方能由王牌飞行员们全力拱卫。"
 CAR_lerets_patent:0 "维尔吉利奥·勒雷的奇特专利"
 CAR_lerets_patent_desc:0 "维吉利奥·勒雷在西班牙本是个寂寂无名的人物，但他近期申请的一项专利却让西班牙航空界为之震动。在这份专利文件中，他详尽阐述了一种喷气发动机的内部构造，这种全新动力装置的推力甚至可能超越星型或直列式内燃机。虽然欧美各国已出现类似技术进展，但作为西班牙人的勒雷，其设计极具深入研究的价值。"
 CAR_reinosa_guns:0 "拉纳瓦尔的大炮"
 CAR_reinosa_guns_desc:0 "坎塔布里亚地区的雷诺萨镇坐落着西班牙最重要的火炮制造厂：拉纳瓦尔兵工厂，这里能锻造出我们舰队所需的雷霆重炮。我们必须确保雷诺萨的工厂获得充足资金，以生产更现代化、更高效的舰炮设计，绝不能让西班牙的巡洋舰、战列舰与驱逐舰在战时陷入火力劣势的困境。"
 CAR_balearics_plan:0 "巴利阿里群岛的坚固要塞"
 CAR_balearics_plan_desc:0 "巴利阿里群岛在地中海占据着相当中心的位置，以帕尔马港为基地，西班牙海军便能掌控赫拉克勒斯之柱和整个地中海海域。然而，若敌对势力企图袭击该群岛，我们在岛上的防御工事相对薄弱，且缺乏完善的反舰防御体系。为此，陆军海岸炮兵部队与海军岸防舰队均提议：应在巴利阿里群岛部署配套的反舰火炮与防御工事，以确保我国在西班牙海域的海上霸权。"
 CAR_ferrol_scheme:0 "反思费罗尔计划"
 CAR_ferrol_scheme_desc:0 "加利西亚的费罗尔海军基地堪称奇观，这里至今仍栖息着一个濒死帝国的残影。早在20世纪初，英国专家与维克斯公司代表就远渡重洋来到西班牙，协助我们稚嫩的海军奠定根基。在他们的技术支持下，费罗尔崛起为整个西班牙最重要的海军枢纽之一，英国设计师更帮助打造了新型巡洋舰与驱逐舰级。但随着大英帝国的崩塌，这套合作体系虽得以苟延残喘，当世界联盟格局日渐诡谲之际，是时候重新审视：这些不列颠人是否还该盘踞在费罗尔？"
 CAR_dedalo_experience:0 "自转旋翼机母舰德达洛号的遗产"
 CAR_dedalo_experience_desc:0 "水上飞机母舰德达洛号确实已不复当年荣光，眼下正面临升级改造或拆解报废的抉择，但它依然是西班牙海军航空兵发展历程的活化石。从它甲板起飞的不仅有首批水上飞机，更令人称奇的是西尔瓦公司研制的旋翼机，这些空中利器助力西班牙开创了航空兵器运用新范式。尽管这艘功勋舰已难现昔日海上铁骑的雄姿，但作为西班牙舰载轰炸机与侦察机的摇篮，其开拓性贡献将持续滋养该国海军航空兵未来数十年的发展。"
 CAR_memories_of_alhucemas:0 "阿尔赫西拉斯登陆的不朽记忆"
 CAR_memories_of_alhucemas_desc:0 "阿尔赫西拉斯登陆行动是里夫战争期间法西联军实施的一次联合军事行动。这场战役中，数千名西班牙士兵在数十架战机、海军舰艇乃至少量坦克的支援下攻占阿尔赫西拉斯海岸，直击阿卜杜勒·克里姆防线的后方，彻底击溃了里夫军队的士气直至其最终败北。此战证明，即便是当时西班牙军队这般相对缺乏经验的部队，也能成功发动高效的大规模两栖作战，至今仍是众多海军院校的重要教学案例。我们必须铭记阿尔赫西拉斯战役的军事遗产，进一步锤炼海上突击能力，正如里夫战争所昭示的那样，未来战争同样亟需此类作战技能。"
 CAR_resume_alava_class:0 "重拾阿拉瓦级计划"
 CAR_resume_alava_class_desc:0 "阿拉瓦级驱逐舰计划原为西班牙海军设计新型驱逐舰的项目，但1935年启动时恰逢黑色星期一经济危机与西班牙政局全面崩溃，致使计划搁浅。然而当前局势已大为好转，或许正是重启该计划、再度推动我国驱逐舰队现代化的良机。"
 CAR_new_armada:0 "日月所照，莫非王土"
 CAR_new_armada_desc:0 "无敌舰队虽成过往，然崭新的西班牙舰队更能应对海军新纪元的风浪与挑战。在相关改革的助力下，这支舰队在大西洋与地中海的力量投送能力显著增强，正以空前力度助推王国的复仇大业。"
 CAR_the_spanish_industrial_potential:0 "释放西班牙工业潜能"
 CAR_the_spanish_industrial_potential_desc:0 "除巴斯克和加泰罗尼亚外，西班牙向来落后于工业革命。如今政治经济困境至少在当下有了暂时的缓解，我们必须着力推动经济结构多元化，改变过度依赖农业的现状，这种单一经济模式至今仍使我们极易受到市场波动冲击。"
 CAR_restart_the_industrial_engine:0 "西班牙工业浴火重生"
 CAR_restart_the_industrial_engine_desc:0 "随着黑色星期一的阴霾终于散去，我们得以重新审视西班牙经济的真实状况。可悲的是，即便这场金融风暴的影响已近乎消散，西班牙经济版图上除了零星几个主要工业中心外，依然乏善可陈。现在正是我们拨乱反正的时机，唯有如此，西班牙工业才能真正踏上与世界列强比肩的崛起之路。"
 CAR_a_gun_for_every_soldier:0 "阿斯特拉卡宾枪的强悍火力"
 CAR_a_gun_for_every_soldier_desc:0 "阿斯特拉-温塞塔公司是一家实力雄厚的枪械制造商，其仿制德国毛瑟C96手枪外销的900型手枪在中国军阀群体中堪称价值连城的珍品，尤其是加装枪托作为卡宾枪使用时。但若如此精良的武器只能供外军使用，而我国军队却只能望而兴叹，这未免令人扼腕。与阿斯特拉公司签订合同，为各兵种部队列装该型武器，实属明智之举。"
 CAR_focus_on_the_home_front:0 "繁荣多元市场"
 CAR_focus_on_the_home_front_desc:0 "西班牙的工业布局极不均衡，仅有巴塞罗那和毕尔巴鄂两处值得称道的工业中心，前者以纺织业为主，后者以冶金矿石闻名，外加零星分布全国的造船厂和奥维耶多等军工生产基地，其余地区基本以农业为主。要实现西班牙全境真正的经济发展，我们必须推动产业多元化，自主生产机械设备、纺织品等高附加值产品，才能既满足国内需求，又能出口更具价值的商品。"
 CAR_industrial_foundations_built_with_logic:0 "直布罗陀-里夫隧道"
 CAR_industrial_foundations_built_with_logic_desc:0 "许多人曾认为穿越直布罗陀海峡的隧道不过是天方夜谭，但现代西班牙工程技术已能克服这片险峻海峡的重重难关。若这一超级工程得以实现，西班牙人横跨地中海的速度将空前提升，届时摩洛哥北部与西班牙本土的距离，将比西班牙国内某些相邻地区更为接近，这片落后的北非殖民地也将迎来全新的发展机遇。"
 CAR_quality_and_quantity:0 "雷诺萨的雷霆"
 CAR_quality_and_quantity_desc:0 "在1898年的美西战争中遭受失败之后，西班牙海军亟需重建。为此，西班牙造船公司在坎塔布里亚的雷诺萨镇设立了一家新的炮械工厂，名为拉纳瓦尔。自那以来，这家工厂已成为西班牙军事生产支柱之一，并迅速从最初的舰炮生产扩展到野战炮、海岸炮等其他武器。如今，我们必须投入资金扩大该工厂的生产能力，使其能够制造出我军未来所需的尖端装备，同时也为当地创造亟需的就业机会。"
 CAR_focus_on_the_solider:0 "奥维耶多的神圣军火"
 CAR_focus_on_the_solider_desc:0 "在西班牙星罗棋布的军工生产中心中，奥维耶多脱颖而出成为最重要的基地之一。这里的拉维加兵工厂历经百年沧桑，始终是西班牙军火工业的脊梁。如今，这座工厂正为我国陆军每位步兵配备的毛瑟步枪提供主要供给。若我们真心期望打造一支装备精良的现代化军队，就必须加大资金投入，既要提升现有产能，更要推动枪械设计革新，确保我军制式步枪始终立于时代前沿。"
 CAR_advancements_or_death:0 "终结西班牙科技的黑暗时代"
 CAR_advancements_or_death_desc:0 "在科学实力方面，西班牙始终落后于欧洲其他大国，但我国确实拥有众多大学和理工学院。若能给予充分资金支持，这些学府完全有能力为西班牙各行业培养出新一代知识分子和专业人才。"
 CAR_the_assembly_line_of_the_future:0 "石油垄断租赁公司泵出工业命脉"
 CAR_the_assembly_line_of_the_future_desc:0 "西班牙石油垄断租赁公司是负责西班牙境内石油监管与分销的国家垄断企业。尽管迄今为止我国探明的石油储量极为有限，但我们仍可通过拓展公司业务来保障国民用油供应，同时重点研发合成石油及替代资源，这将有效减轻我国当前对海外油源的依赖，毕竟历史证明这些外部供应渠道并不可靠。"
 CAR_trading_armada:0 "阿斯图里亚斯与比斯开的煤烟财富"
 CAR_trading_armada_desc:0 "阿斯图里亚斯是全西班牙工业化程度最高的地区之一。虽然过去这里因孕育出组织严密、经验丰富且富有斗争精神的工人群体（曾主导阿斯图里亚斯起义）而引发诸多问题，但我们绝不能低估该地区的工业实力，无论是煤矿开采、冶金工业还是其他领域。我们不应与阿斯图里亚斯对抗，而应当与之并肩作战，共同振兴西班牙工业的新生。"
 CAR_banking_focus:0 "粉碎国际金融资本"
 CAR_banking_focus_desc:0 "我们必须彻底铲除国际金融资本这颗毒瘤！正是他们将无尽的灾难与道德沉沦强加于西班牙人民头上。这伙人惯用花言巧语诱骗我们敞开国门，随即蜂拥而入，将我们的财富洗劫一空。为了捍卫西班牙的经济主权，为了将国家命脉从外国势力的枷锁中解放出来，粉碎国际金融资本已是势在必行——这乃是任何人、任何力量都无法阻挡的历史洪流！"
 CAR_railroads_1:0 "西班牙国铁无所不达"
 CAR_railroads_1_desc:0 "鉴于西班牙政局动荡与经济困境，全国铁路系统已陷入混乱——私营铁路、地方铁路与国有铁路畸形共存，多数轨道采用不同轨距标准且维护状况参差不齐。现在是时候拨乱反正了：我们将成立西班牙国家铁路公司，这家国有垄断企业将以实现全国铁路标准化运营为终极目标，最终让铁路网络覆盖西班牙的每一寸土地。"
 CAR_new_industry:0 "大西洋沿岸的黑金新矿"
 CAR_new_industry_desc:0 "加利西亚的地下蕴藏着大量的钨矿资源，而钨因其色泽与经济潜力，在西班牙民间素有“黑金”之称。我们当着力建设采矿设施、精炼厂及相关基础设施，既满足国内市场所需，亦可出口他国。在各国加紧军备建设的当下，此举尤能带来丰厚利润。"
 CAR_expand_industry_1:0 "工业革命降临卡斯蒂利亚"
 CAR_expand_industry_1_desc:0 "卡斯蒂利亚作为西班牙的文化中心已逾数世纪，更在西班牙帝国存续期间始终主导着整个西语世界。不过，其文化霸权并未能转化为经济优势，马德里之外的广袤乡野仍以农业为主，发展明显滞后。若欲追及欧陆诸国发展水准，必先从国内腹地开启振兴之路。"
 CAR_expand_mines_1:0 "廷托河的矿藏"
 CAR_expand_mines_1_desc:0 "廷托河（意为“染色”河）流经安达卢西亚南部，因富含的矿藏为河水染上了色而得名。数千年来，占据伊比利亚的各个文明皆在此开采矿产，而这也让此地成为了历代帝国的垂涎之地。不过，现今由英国财团掌控的力拓公司，不仅独占利润，更于此建设了小型殖民据点。我们要不惜一切代价收回公司主权与资源。"
 CAR_expand_industry_2:0 "携手奥西萨，建设新西班牙"
 CAR_expand_industry_2_desc:0 "奥西萨公司是西班牙规模最大的私营建筑企业之一，近年来参与了诸多重大工程项目。我们可以为其牵线建筑大师爱德华多·托罗哈·米雷特并提供丰厚补贴，借助其丰富的建筑领域经验，兴建西班牙民众急需的住房、工厂等民生工程。"
 CAR_trade_focus:0 "重走香料之路"
 CAR_trade_focus_desc:0 "在成为日不落帝国之前，香料贸易本就是西班牙的经济命脉之所在。众所周知，克里斯托弗·哥伦布的远航本为寻找通往香料原产地东印度群岛的路线，却意外发现了美洲大陆，由此开启了探索发现与殖民的黄金时代。而今帝国虽已凋零，欧洲邻邦对亚洲香料的渴求却未消减，我们或当重走香料之路，以此奇货可居之物再谋商机。"
 CAR_recover_black_monday:0 "西班牙经济奇迹"
 CAR_recover_black_monday_desc:0 "无论是西班牙国内还是国际社会都始料未及，但这个国家已然摆脱了经济落后的桎梏，正以稳健步伐逐步比肩法国和德国。前路固然仍有漫漫征程，但有朝一日，西班牙各地区或将如德国的鲁尔、英国的曼彻斯特或法国的马赛般赢得世人的瞩目。在西班牙政府的不懈努力下，这一愿景比以往任何时候都更接近现实，随着工业引擎的持续轰鸣，一种崭新的民族自豪感正浸润着每个西班牙人。工业革命的浪潮，终于是席卷了伊比利亚半岛。"
 CAR_university:0 "复兴进步之路"
 CAR_university_desc:0 "过去数百年间，西班牙始终未能充分展现其作为国家的真正实力。纵使我们曾拥有日不落帝国版图——从菲律宾群岛到利马城，从火地岛到努特卡湾——本土发展却始终滞后于欧洲邻邦。如今局势终现转机，正是重启西班牙奋进征程之时。前路虽非坦途，但我们坚信：这不仅是我们能力所及之事，更是为了国家未来必须完成的使命。"
 CAR_radio_focus:0 "国家电台征服无线电波"
 CAR_radio_focus_desc:0 "过去几十年最具突破性的发明当属无线电技术。尽管最初只有少数富人能负担这种新奇玩意儿，在多数情况下它不过是件昂贵的镇纸，但该技术如今已发展成熟，无线电设备在平民阶层广泛普及，广播电台如雨后春笋般涌现。为此，我们应当建立西班牙国家广播电台，以便更有效地触达西班牙民众，将我们的声音传遍四方。"
 CAR_electronics_focus:0 "以科发委进行国际科学研究"
 CAR_electronics_focus_desc:0 "科学研究发展委员会是继承并拓展自由教育机构学术体系的机构。该组织致力于通过建立学术中心与实验室、推动国际师生交流等方式促进西班牙科学文化发展。我们可充分利用这些交流项目，既推动西班牙本土发展，又能提升我国在国际科学界的地位，同时深化与交流对象国的友好关系。"
 CAR_agrarian_reform:0 "姗姗来迟的土地改革"
 CAR_agrarian_reform_desc:0 "整个19世纪，西班牙曾尝试过多种土地改革方案，但唯有第二共和国将其付诸实践而非仅向农民做出敷衍姿态。然而如同诸多改革一样，共和派操之过急，这项在西班牙极具争议性的改革导致共和派-社会主义者联盟严重分裂：自由派认为改革过于激进，而社会主义者却指责其力度不足。我们必须汲取前车之鉴，在改善西班牙农民生计的同时避免重蹈覆辙。"
 CAR_new_initiatives:0 "重申共和派倡议"
 CAR_new_initiatives_desc:0 "共和派立法者和政客们在推行土地改革方面虽有过于激进仓促之嫌，但其政策构想确有可取之处。现政府虽绝不会采纳1932年《土地改革法案》中那套几近社会主义性质的极端土地征收方案，但法案中的其它主张，如设立农业事务部、大规模改良西班牙农具装备、扩建灌溉系统、全面改善地方农业生产条件等，都值得我们重新审视借鉴。"
 CAR_peasant_coop_focus:0 "农民合作基金"
 CAR_peasant_coop_focus_desc:0 "农民合作社在西班牙虽属新兴事物，但其根基可追溯至乡村互助与慈善组织的悠久传统。鉴于这类组织能帮助农民聚焦地方事务并自主解决问题，同时有效缓解黑色星期一事件引发的贫困问题，我国政府对其予以全力支持实属必要。这类合作社还具有遏制激进势力的社会功能，例如能有效防止无政府工联等无政府主义团体蛊惑更多农民接受其极端立场。"
 CAR_caciquismo_beaten:0 "封停乡野的政治机器"
 CAR_caciquismo_beaten_desc:0 "掌控着埃斯特雷马杜拉、加泰罗尼亚与安达卢西亚乡村地区的权贵政治体系，长期阻碍着西班牙各届政府的改革进程。到此为止了，这些为祸乡野的土皇帝之治必须就此终结。我们将派遣国民警卫队深入其庄园，将腐败拖拽至阳光之下，若这样都不行，我们更将以铁腕肃清这些封建采邑。"
 CAR_careful_first_phase_complete:0 "完成第一阶段"
 CAR_careful_first_phase_complete_desc:0 "西班牙的农业改革之路虽艰难曲折且代价高昂，但终于迈入了实质性发展阶段，这将有望扭转我国农业数十年来遭受忽视的困局。尽管当前必须暂缓推进改革直至西班牙政治危机彻底平息，但让农民摆脱生存困境的希望之火已在民众与政界人士心中重燃。我们期待这一进展能为政府赢得农村民众的信任，以应对即将到来的艰难时局。"
 CAR_factories_and_farmers:0 "莱万特聚宝盆的罐头工厂"
 CAR_factories_and_farmers_desc:0 "西班牙莱万特地区濒临地中海，得益于亚热带气候、低海拔地势与肥沃土壤，这里成为高产的农业区，尤以水果、蔬菜、坚果、稻米和橄榄等果园作物著称。然而除加泰罗尼亚外，当地多数农场仍在使用严重过时的耕作方法与设备，导致农产品产量下降且保质期缩短。通过推动罐头食品产业转型、国产化设备生产及耕作技术改良，我们不仅能提升产量、获得更高品质且耐储藏的农产品，还将在制造业领域创造更多就业机会。"
 CAR_mass_production_of_farming_equipment:0 "消灭罗马铁犁的最后遗存"
 CAR_mass_production_of_farming_equipment_desc:0 "犁虽构造简单，却是过去数千年来农业生产的根基。这种带刃的框架工具通过畜力牵引翻动土壤，将养分带回地表，同时掩埋杂草与前茬作物。尽管历史上除少数地区性改良外几无演进，但随着工业革命催生蒸汽动力拖拉机，这一农具终遭淘汰。然而……西班牙农民因无法获取现代拖拉机，至今仍在使用这种过时的工具。我们必须提升国产拖拉机产能，建立合作社与农业信贷体系，帮助农民获得现代化农机。纵然犁具的寿命已两倍于罗马帝国存续时长，我们必将确保它无法再延续至西班牙未来十年的发展进程。"
 CAR_the_chemist_calls_out_towards_the_farmer:0 "联合炸药公司引爆农作物产量"
 CAR_the_chemist_calls_out_towards_the_farmer_desc:0 "西班牙联合炸药公司曾是西班牙法定的炸药生产垄断企业，这一特殊地位使其一度跻身国内最大企业之列。该公司主营炸弹、化工品及弹药等爆炸物生产，后因业务关联性自然延伸至化肥制造领域。若我们为其提供资金支持，不仅能大幅提升我国农田的化肥供应量，还可同步提振炸药产业，同时为毕尔巴鄂地区创造更多就业岗位。"
 CAR_the_richest_soil_in_europe:0 "欧洲农作物多样性之最"
 CAR_the_richest_soil_in_europe_desc:0 "尽管西班牙的土壤肥沃度和农业产量远逊于乌克兰黑土带及德国与法兰西公社的高效农区，在欧洲并不算顶尖，但其农作物多样性堪称欧洲之最。从果园里的各色水果，到麦田、坚果、蔬菜、葡萄园，再到豆类、甜菜、烟草、橄榄等经济作物，西班牙几乎囊括了所有作物品类。我们固然无法在乌克兰小麦或中非经济作物等特定领域与之争锋，但完全可以凭借这种得天独厚的农业多样性打造特色农产品，从而开辟专属市场空间，实现更高的经济收益。"
 CAR_Second_Phase_of_Reform:0 "下一阶段改革"
 CAR_Second_Phase_of_Reform_desc:0 "第一阶段主要聚焦于厘清必须采取的行动，以及如何渡过危机最严峻的时期。如今得益于西班牙政局的逐步稳定，加之新获得的政治支持终于能推动那些常引发争议的改革，全面解决问题的时机已然成熟。若一切顺利，这场旷日持久的改革终将尘埃落定，使西班牙农村地区彻底摆脱社会动荡与极端主义的温床，焕发新生。"
 CAR_Agrarianism_Powered_by_Foreign_Engines:0 "以外国引擎满足国内需求"
 CAR_Agrarianism_Powered_by_Foreign_Engines_desc:0 "可悲的现实是，就目前状况而言，西班牙根本无法满足我国改革所需规模的拖拉机、卡车及其他车辆需求。不仅生产线难以承载这样的需求，我国工厂与锻造车间设计的车型更是远逊于国际供应商的产品。因此政府必须与任何愿意为我们生产农业机械的厂商签订合同，哪怕是需要付出高昂代价，否则我们将被迫再次放缓改革步伐。"
 CAR_Domestic_Designs_Till_Our_Fields:0 "西班牙机械躬耕西班牙田野"
 CAR_Domestic_Designs_Till_Our_Fields_desc:0 "若要使我国农业实现真正现代化并提高作物产量，就必须在田间更广泛地运用机械。西班牙虽不以重工业闻名，但即便是我们落后的工业体系也曾生产过拖拉机底盘，这些底盘后来甚至被用于制造特鲁维亚坦克。我们应当加大对本土重工业（如希斯巴诺-苏莎公司）的投资，充分动员西班牙资源来支持农业改革。唯有依靠国产发动机，才能确保完全的自主可控，即便达到其他欧洲国家的技术水平尚需时日。"
 CAR_Final_Land_Requisition:0 "完成土地声索"
 CAR_Final_Land_Requisition_desc:0 "迄今为止，鉴于西班牙地方地主往往权势滔天，我国政府在土地国有化与再分配方面一直犹豫不决。但如果没有大刀阔斧的干预与土地征收，土地改革将永远无法完成。若土地依旧在民众之间分配不均，西班牙的农村地区便无法繁荣发展。因此，尽管这是一个在政治上艰难的抉择，必然会引起强大地主阶层的愤怒，但为了最终解决西班牙的严重问题，这一步必须迈出。"
 CAR_Local_Conditions_Above_All:0 "因地制宜的农业计划"
 CAR_Local_Conditions_Above_All_desc:0 "西班牙的农业发展前景绝非千篇一律，农田产量取决于众多极具地域特色的因素。从地形条件来看，西班牙崎岖多变的地貌直接影响耕作方式；就人文因素而言，适种作物选择、庄园规模偏好及劳动力供给状况同样至关重要。在西班牙北部地区，被称为迷你庄园的小型农场因产出效益过低而价值有限；而在南部地区，被称为大庄园的广阔土地则令无地农民饱受煎熬，他们不仅收入微薄，还要完全听命于地主阶层的摆布。为解决这一困境，我们必须制定因地制宜的农业改革方案：既要推行多样化的生产方式，也要落实南部农民的土改权益。"
 CAR_Work_for_Jornaleros:0 "为短工尽全力"
 CAR_Work_for_Jornaleros_desc:0 "短工是指季节性雇农，其工作环境往往比大庄园的佃农更为恶劣。他们深陷社会阶层固化的泥沼，微薄的薪资、毫无就业保障、缺乏退休金、且几乎只能在地主提供的剥削性劳动条款下谋生，导致贫困代际传递难以打破。经济危机来临时，短工总是首当其冲的受害者，甚至有人被迫以草根树皮果腹。这种状况必须终结！政府应当为短工开设专项就业计划，提供正规劳动合同，帮助他们摆脱极端贫困。此举还将倒逼庄园主改善用工条件，因为他们将首次面临劳动力市场的竞争压力。"
 CAR_the_four_horsemen:0 "天启四骑士"
 CAR_the_four_horsemen_desc:0 "按照《圣经》经文的普遍解读，天启四骑士分别象征死亡、征服、饥荒与战争。但今日西班牙必须战胜的，却是四股截然不同的毁灭力量：天空、陆地、海洋与科学进步。这些正是我们在这场不可避免的全球性抗争中必将遭遇的阻碍。若要带领西班牙穿越末日审判的阴霾抵达光明彼岸，我们必须义无反顾地刺破黑暗前行。"
 CAR_science_of_the_high_seas:0 "公海科学"
 CAR_science_of_the_high_seas_desc:0 "毫无疑问，西班牙海军是我国武装力量中最精锐的军种。不仅如此，近年来海军还带动了多个分散但重要的军工生产中心及配套设施的发展，为驻地创造了大量就业岗位。正因如此，若我们不善加利用海军的成功优势，为加的斯海军学院追加研发项目拨款，那才是愚不可及，唯有如此，我们才能最终实现海军的全面现代化发展，甚至重现1898年之前鼎盛时期的荣光。"
 CAR_the_center_of_military_progress:0 "军事进步之心"
 CAR_the_center_of_military_progress_desc:0 "尽管这支军队曾以政变或惨败给国家带来诸多困扰，但我们绝非愚昧到否认一个现代民族国家离不开军队的事实。如今正是时候让我们更加重视萨拉戈萨军事学院的建设，在这支军队向现代化精锐之师转型的征程中，要让最年轻有为的军官们能在尖端设施中挥洒全新军事理念，且不受任何预算桎梏。为此，学院设施将大幅扩建，其他必要革新也将即刻推进。"
 CAR_to_conquer_the_heavens:0 "征服天堂"
 CAR_to_conquer_the_heavens_desc:0 "在我国所有武装力量中，空军无疑是发展最为滞后的军种，不仅战机数量稀少，装备也极度陈旧。近期冲突日益凸显制空权的重要性，而全球新型战机的供应又存在诸多不确定性。为此，我们必须建立基于自主设计的国内航空制造体系，确保在全球冲突不可避免时不必受制于人。将成立国家航空航天技术研究院，负责统筹推进新型航空装备研发工作，全面捍卫西班牙领空安全。待最艰难时期过后，该机构还将助力民用航空领域的技术发展。"
 CAR_to_split_an_atom:0 "打破第四封印"
 CAR_to_split_an_atom_desc:0 "科学界最新突破证实，构成物质世界最基本单元的原子可被分裂，并在裂变过程中释放出史无前例的巨大能量。尽管目前对此过程的认知尚浅，但我们确信终有一日能够驾驭原子能，制造出威力堪比《圣经》末日启示的毁灭性武器。现应即刻组建专项科研团队推进研发，同时开展西班牙境内铀矿资源的地质勘探工作。"
 CAR_the_bleeding_edge:0 "马德里大学城的前沿科技"
 CAR_the_bleeding_edge_desc:0 "尽管马德里历来拥有活跃的学术圈与知识分子群体，但其大学基础设施却长期不尽如人意。建设马德里大学城的初衷，正是要将分散的学术设施集中整合到统一空间。然而受西班牙整体局势影响，工程屡遭延期。如今随着这座学术之城终于落成开放，西班牙最杰出的思想者们总算拥有了汇聚智慧、激荡思维的理想之地。"
 CAR_mechanical_calculations:0 "远距操控器的可能性"
 CAR_mechanical_calculations_desc:0 "莱昂纳多·托雷斯·奎维多最奇特的发明当属“远距操控器”。这位涉猎广泛的科学家特别关注飞艇技术，在思考飞艇安全隐患时灵光乍现，创造了这个装置。他最终得出论断：像氢气球飞艇这样潜伏危险的交通工具，最好交由机械系统来操控。于是他研制出能接收电磁波信号的机器，初期通过国际象棋机器人和遥控三轮车展示这项发明，经过充分测试后更升级为可远程操控船只。尽管目前这仍被视为新奇玩意，但若能获得充足资金支持并深入开发应用场景，我们或许正在见证未来战争与科技的雏形。"
 CAR_spanish_computation_machines:0 "克维多的思考机器"
 CAR_spanish_computation_machines_desc:0 "在完成远距操控器后，托雷斯·克维多将其计算机械领域的经验投入到了早期计算机的研制之中。这台名为“机电算术机”的设备通过打字机输入数据，其运算速度与复杂方程处理能力均远超前辈。若能释放此机器的全部潜力，或可造就同时解算千百复杂方程的装置，以空前“演算”之力引发科学革命，其应用前景恐非今日所能想象。"
 CAR_experimental_education:0 "自由教育机构的实验教学"
 CAR_experimental_education_desc:0 "自由教育机构的创立，是对1875年卡诺瓦斯首相颁布凡不符合天主教教义即禁止学术自由法令的直接回应。自此，这所学院始终屹立为西班牙教育界的标杆殿堂，其门墙内先后孕育了“九八一代”与“二七一代”等思想巨擘，他们或以学子身份受教，或以教师身份传道，或以志业同路人身份共襄盛举。尽管保守派对其深恶痛绝，但学院奉行的克劳泽主义教育理念（主张教学中的思想自由与学术独立）使其成为共和派与自由主义者心中的精神灯塔。无论某些人如何抵触，我们都不得不承认：这样的教育体系蕴藏着无可估量的价值。"
 CAR_education_from_the_rural_areas_to_the_capital:0 "决战文盲现象"
 CAR_education_from_the_rural_areas_to_the_capital_desc:0 "西班牙近代社会最大的顽疾之一，就是始终未能建立完善有效的教育体系，这导致我国远远落后于欧洲邻邦，甚至被日本等昔日公认的“欠发达国家”反超。无论从意识形态还是现实发展考量，这种状况都再也不能持续下去了。教育振兴的成果需要一代人的时间方能完全显现，但我们必须立即向文盲现象宣战，才能真正让西班牙走上扫除蒙昧的康庄大道。我们将实施以下举措：在乡村广设学校、建立高等教育中心、增加奖学金与科研经费拨款，同时开设面向成人的基础教育课程与职业技术培训。用不了多久，西班牙国民必将成为知书达理的文明之民，既能书写最动人的诗篇，也能实现举世瞩目的科学突破。"
 CAR_ad_astra_per_aspera:0 "通过电影进行爱国教育"
 CAR_ad_astra_per_aspera_desc:0 "若论能从法国人、德国人和美国人身上汲取哪些非军事领域的经验，那就是电影不仅是一种文化现象，更是宣传与教育的利器。通过培育蓬勃发展的本土电影产业，或许再给某些导演“点拨”些符合我们利益的剧本创意，我们便能将电影化为这样一种工具，既娱乐大众，又能按照更符合我们期望的全新形象重塑西班牙。"
 CAR_unleash_the_new_minds_of_spain:0 "解放新思想"
 CAR_unleash_the_new_minds_of_spain_desc:0 "经过漫长的耕耘，我们的努力终于结出硕果。虽尚未跻身世界强国之列，但至少已能望见隧道尽头的曙光。这场改革与投资不仅证明西班牙全境确实蕴藏着杰出人才，更让我们具备了培养这些人才、推动国家迈向现代化所需的基础设施与资源。如今西班牙最优秀的头脑不再困于闭塞落后的乡野田畴，他们正走进顶尖学府、先进实验室和现代化军事基地，创造出真正属于西班牙的发明。我们已将西班牙带入了现代文明的曙光之中。"
 CAR_united_minds:0 "创立$SPR_nerd_council$"
 CAR_united_minds_desc:0 "若我国的顶尖科学家与研究人员要想相互协作的话，就需跋涉千里，那这种学术环境实难令人接受。当下应成立国家学术委员会，集中各领域最杰出的科学家开展合作，整合资源，推动科研突破。虽非立竿见影，但我们已尽可能广泛接洽学者，并为其研究项目提供资助。"
 
