 CAR_local_self_governmentdec:0 "地方自治"
 CAR_local_self_governmentdec_desc:0 "地方自治本是西班牙的立国根本，然而僭主的[SPR.GetFlag]马德里中央政府长期忽视各地区的发展。马德里市区高度发达，而广袤的乡村地区却长期陷于发展不均衡的困境，几乎所有资源都被用以供养马德里中央。这种失衡催生了巴斯克、加利西亚、加泰罗尼亚等地区的民族主义浪潮，为国家招致了长达数十年的分裂与内斗，种族仇杀、武装暴动层出不穷。就在这重重阴霾之中，[CAR.GetFlag]卡洛斯派从山区崛起，誓言要终结这一切混乱，将地方自治与民族团结的理念重新带回西班牙。\n\n目前的地方自治程度为：\n[BAS.GetFlag][CAT.GetFlag][GLC.GetFlag]§Y自治度：§!§R[?CAR.all_autonomy|%R]§!\n\n§C请注意，过度的自治很有可能会适得其反，各地区将会在高自治度的情况下对继续处于西班牙的统治之中心怀不满从而叛乱。§!§R自治度不可逆！§!(>85)"
 CAR_regional_industrializationdec:0 "少数民族地区工业化"
 CAR_regional_industrializationdec_desc:0 "马德里对地方的忽视到此为止，工业化不应该抛弃任何一个地区，即便他们不属于西班牙人。适当的工业化也能缓解各地区的压力——毕竟所有人都有工作之后就没那么多懒汉闲的没事上街闹事了。"
 CAR_joint_research_institutedec:0 "部署联合科研院"
 CAR_joint_research_institutedec_desc:0 "即使在中央长期无视地方的情况下，这些少数民族地区还是诞生了不少知识分子和科研人员，虽然水平不如西班牙人，但将他们纳入我们的科研院中能极大的安抚当地的民族主义者，况且西班牙已经落后了这么多年，对科学家没必要这么挑剔。"
 CAR_ethnic_minority_culturedec:0 "肯定地区文化"
 CAR_ethnic_minority_culturedec_desc:0 "也不是说西班牙的文化就一定高于别的国家或地区，虽然我们确实在伊比利亚生活了很长一段时间，但显然巴斯克人、加利西亚人、加泰罗尼亚人在这里生活了更长的时间，当地的文化应该被保护起来而不是一味的压制和破坏——我可不想被汽车炸弹炸上天。"
 CAR_shared_historydec:0 "光荣的共同历史"
 CAR_shared_historydec_desc:0 "我们曾经和巴斯克人在同一条壕沟里同马德里作战，我们亲如手足，在面对同一敌人时我们总是能放下分歧，今天我们依然并肩站在这里，共同对抗毒害了西班牙人民上百年的西班牙至上主义余毒。"
 CAR_federalizationdec:0 "进一步联邦化"
 CAR_federalizationdec_desc:0 "也许巴尔干那群疯子的想法是正确的，将这些叛逆的地区转化成隶属于我们的政治实体让当地人实行自我管理，一切事务由当地人自我决断但又并非彻底的独立，这正好与卡洛斯派的主张相符——这样他们就没法怪我们做的不够好了。"
 CAR_recruit_sailorsdec:0 "少数民族海员"
 CAR_recruit_sailorsdec_desc:0 "每一位少数民族都是一名优秀的海员和船长，也许这和他们住在海边有关系。正好我们缺少能征服大海之人，西班牙海军沉沦上百年，如今要想重建无敌舰队那不可或缺的就是优秀的海员和舰长了，正好让这些地区的人民为新西班牙的野妄添砖加瓦，一举两得。"
 CAR_independent_armydec:0 "新外籍军团"
 CAR_independent_armydec_desc:0 "既然他们愿意为民族解放流血牺牲，那为什么不为一个平等团结的“西班牙联邦”而奋斗呢？与其和西班牙人在战场上拼刺刀不如共同对抗外部的威胁，我们早已向其许诺自由并进行了切实的实践，现在正是他们回报卡洛斯西班牙的时候了。"
 CAR_land_of_equalitydec:0 "为“平等之国”奋斗"
 CAR_land_of_equalitydec_desc:0 "每一位西班牙人民都应该参与国家的建设，即使你是少数民族也不例外，你不工作我不工作，靠谁来给我们富裕？基督吾王可不会保佑懒汉，耶稣还是一个木工出生呢，为了我们的未来加油干吧兄弟们，都是劳动人民那就没有什么不同之处了。"
 CAR_encourage_unionsdec:0 "鼓励当地工会"
 CAR_encourage_unionsdec_desc:0 "西班牙人歧视少数民族是客观事实，为了避免因歧视而带来的伤害少数民族工会是很有必要的，这些地区的工会不应该只在当地活动，还要逐步扩张到整个西班牙，毕竟人不可能只生活在一个地方，工会将保护少数民族应有的权益。"
 CAR_ethnic_equalitydec:0 "定义民族平等"
 CAR_ethnic_equalitydec_desc:0 "什么是民族平等呢？就是你和我拥有相同的权益，不因为你是少数民族而得到特殊的优待，也不因为我是主体民族就可以随意压迫你，每个人都是一个独立且平等的个体，谁也不会、也不能打着平等的旗号骑到对方的头上。"
 CAR_educationdec:0 "注重教育事业"
 CAR_educationdec_desc:0 "即使是在二十世纪，文盲还是普遍存在于西班牙各地，教育基本上只为精英阶层服务，愚昧无知加剧了暴力的流动，如果每个人都能接受基础教育那西班牙的国力将会更上一层楼，人们也不会再因为无知的偏见而陷入内斗。"
