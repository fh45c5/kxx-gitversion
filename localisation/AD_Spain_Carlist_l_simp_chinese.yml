 ncar.15.t:0 "1830年国事诏书"
 ncar.15.d:0 "费尔南多七世，蒙上帝恩典，卡斯蒂利亚、莱昂、阿拉贡、两西西里、耶路撒冷、纳瓦拉、格拉纳达、托莱多、瓦伦西亚、加利西亚、马略卡、塞维利亚、撒丁岛、科尔多瓦、科西嘉、穆尔西亚、哈恩、阿尔加维、阿尔赫西拉斯、直布罗陀、加那利群岛、东和西印度群岛以及大洋群岛与大陆之国王；奥地利大公；勃艮第、布拉班特及米兰公爵；哈布斯堡、弗兰德斯、蒂罗尔及巴塞罗那伯爵；比斯开与莫里纳领主，等等。\n\n致诸位亲王、主教、大贵族、爵位保有者、大十字勋位获得者、政务委员会委员、各法庭大臣、地方长官、司法官、各级市长，以及本王国之全体权力机构：\n\n兹通告：在1789年于马德里镇召开的三级会议中，经吾先父卡洛斯四世（愿上帝安抚其灵魂）提议，探讨了关于恢复因远古习俗及《七章法》第15卷第2条所确立的本王国常规王位继承法律之必要性与妥当性；三级会议遂向国王陛下呈递请愿书，请求国王下令：尽管1713年5月10日颁布的法令引入了新规定，但王位继承仍应维持并恪守上述《七章法》所佐证的古老习俗。\n\n在该届三级会议上，已决定废除1713年5月10日之法令；吾先父国王（愿其享永远之荣光）批准了王国代表们的决议与请愿，下令王位继承法应如从前般恪守，且该行为已完全具备法定形式与效力。\n\n鉴于当时由于欧洲接踵而至的动荡与重大事件，该敕令未能及时公布；经咨询吾皇家委员会，吾现认为应当正式公布并施行上述决议，使其成为吾所有王国中必须恪守的基本法律。\n\n为此，吾命令皇家委员会全体成员、大法官法庭、高级法院、地方长官及本王国所有司法官员，严格恪守、履行并执行本《国事诏书》，使其具备法律效力。"
 ncar.15.a:0 "罪恶的开端"
 ncar.16.t:0 "[getyear]年国事诏书"
 ncar.16.d:0 "[getleader]，蒙上帝恩典，卡斯蒂利亚、莱昂、阿拉贡、两西西里、耶路撒冷、纳瓦拉、格拉纳达、托莱多、瓦伦西亚、加利西亚、马略卡、塞维利亚、撒丁岛、科尔多瓦、科西嘉、穆尔西亚、哈恩、阿尔加维、阿尔赫西拉斯、直布罗陀、加那利群岛、东和西印度群岛以及大洋群岛与大陆之国王；奥地利大公；勃艮第、布拉班特及米兰公爵；哈布斯堡、弗兰德斯、蒂罗尔及巴塞罗那伯爵；比斯开与莫里纳领主，等等。\n\n致诸位亲王、主教、大贵族、爵位保有者、大十字勋位获得者、政务委员会委员、各法庭大臣、地方长官、司法官、各级市长，以及本王国之全体权力机构：\n\n兹通告：鉴于朕深切考量本君主国之内部和平、公共安宁与长久稳定；并遵循吾伟大先祖卡洛斯国王五世（即腓力五世，愿其享永远之荣光）于1713年5月10日所颁布《国事法令》之明智规定，该法令确立了王位继承准则，即所有男性父系血亲线路绝对优先于女性及其后裔；\n\n鉴于1713年之法令系依法颁布，旨在避免往昔困扰本王国之继承争议、分裂与战争；且朕认识到，对上述准则的任何变更或废除，皆可能引发本君主国合法秩序之动荡；为此，基于朕之最高权力并经咨询皇家委员会，朕特此废除与撤销一切与此相左之决议、诏书或规定，并宣告其无效；\n\n朕下令：在整个君主国范围内，必须永久且不可侵犯地恪守并执行1713年父系继承法。王位应严格按照长子继承与代位继承原则，专属于朕皇家之合法男性父系后裔；只要西班牙王室尚存合法男性后裔，即彻底排除女性及其支系之继承权。为此，吾命令皇家委员会全体成员、大法官法庭、高级法院、地方长官及本王国所有司法官员，严格恪守、履行并执行本《国事诏书》，使其具备法律效力。"
 ncar.16.a:0 "动荡时代结束了"
 ncar.17.t:0 "传统主义统一协定"
 ncar.17.d:0 "于[getdate]会聚于马德里，正统卡洛斯主义与传统主义公会的代表们，本着为上帝与西班牙服务、使卡洛斯主义恢复其完整组织与教条统一的至高愿望，经深入商讨后，一致同意签署以下条约：\n\n第一条——签署各方庄严宣告，谨遵并永保对传统主义教义的忠诚，该教义凝练于历史性口号“上帝、祖国、地方特权与国王”之中；同时批准将呼啸兵精神以及社会化、传统化、代议制与渐进式君主制的各项原则确立为卡洛斯主义的根本法。\n\n第二条——鉴于西班牙王位的合法统绪依据西班牙君主制根本法以及历史上的弃权与申诉，无可争辩地归属于卡洛斯王朝，现正式宣告：卡洛斯主义的最高领袖职位及王朝继承权归属于尊贵的唐·哈维尔·德·波旁-帕尔马亲王殿下。\n\n第三条——各方同意解散在分散与分裂期间所建立的一切平行组织或委员会，将传统主义的所有战士、骨干与力量统一整合至唯一且独立的组织：传统主义团契。\n\n第四条——传统主义团契的统一政治领导架构建立在摄政王唐·哈维尔殿下的最高权威之下，由其指定成立一个统一的执行委员会，重新整合后的各派系与部门代表均将参与其中。\n\n第五条——签署各方承诺共同奋斗，致力于在西班牙建立传统君主制，坚决反对任何企图扭曲天主教西班牙本质的自由主义、共和主义、社会主义或妥协性方案。\n\n[getdate]签署于马德里。"
 ncar.17.a:0 "唐·哈维尔殿下万岁！"
 ncar.18.t:0 "萨利克法"
 ncar.18.d:0 "遵照上帝之恩典，卡斯蒂利亚、莱昂、阿拉贡、两西西里、耶路撒冷、纳瓦拉、格拉纳达、托莱多、瓦伦西亚、加利西亚、马略卡、塞维利亚、撒丁、科尔多瓦、科西嘉、穆尔西亚、哈恩、阿尔加维、阿尔赫西拉斯、直布罗陀、加那利群岛、东与西印度群岛、海洋诸岛及大陆之国王；奥地利大公；勃艮第、布拉班特及米兰公爵；哈布斯堡、弗兰德斯、蒂罗尔及巴塞罗那伯爵；比斯开及莫利纳领主，费利佩：\n\n鉴于鉴明此前因王位继承规则不明确而给西班牙王国及其属地带来的巨大灾难与动荡，并渴望在未来通过一项明确固定的规则来防止此类隐患，以确保臣民之安宁与君主制之延续；经与皇家会议商议，并听取朕特为此召集之王国大议会的请愿：朕与上述会议及王国议会共同决议，制定并确立关于西班牙王位及其所有属地继承的根本法如下：我们特此制定并颁布：在这些王国的王位继承中，直系合法男性后嗣在任何时候均享有优先权，排除女性继承权，并优先于所有旁系以及直系中的所有女性；只要在直系或旁系中仍有任何根据习惯法及本法令应当优先继承的男性存在。\n\n因此，继承顺位须始终结合辈份、支系及男性性别进行优先排列；若直系男性后嗣断绝，亦不得由该直系之女性立即继承，而应由根据父系及长子继承制原则排列的旁系男性依次继承；唯有在所有支系及任何辈份的父系男性后嗣完全断绝时，方可由距离上一任国王血缘最近的父系支系女性继承。若根据上述规则由女性继位，其继承权仍按本王国之通用法律确定（同辈中男性优先于女性，长者优先于幼者）；但须明确说明的是：只要在同一父系或另一父系支系中再次出现男性后嗣，该女性及其后嗣即被排除继承权，王位继承权应重新回归给父系男性后嗣。\n\n同时，我们下令：本王国中凡与本王位继承根本法相抵触的所有规则、特权法、习惯法及法律，一律废除、撤销、宣布无效；而与本法不相抵触的其他法律，仍保持其法律效力。为此，朕下令所有皇家会议、法庭、高等法院、总督、地方官、法官及王国其他司法人员，均须严格遵守、执行本法令之全部条款。"
 ncar.18.a:0 "恢复正统！"
 ncar.19.t:0 "布尔戈斯宣言"
 ncar.19.d:0 "齐聚于布尔戈斯的下述天主教-君主制报纸联合达成一致，全票通过并发布以下原则宣言：\n\n我们将罗马天主教——唯一真实、除其之外绝无救赎的神圣信仰——宣告为高于一切原则的首要原则；我们宣告政治与法律必须绝对服从天主教的教义与道德，彻底拒绝一切宗教信仰自由与宗教宽容。我们要求保持天主教信仰的完整性，全面恢复西班牙的天主教统一性，正如内卡雷德国王在托莱多第三次公会议上所宣告的那样，彻底排除一切异端邪教与假信仰。\n\n我们绝对且无条件地臣服于圣座以及耶稣基督在世上的代表——罗马教宗。我们承认教会面对任何世俗政权时所拥有的完全独立性，捍卫其在教育、持有财产及建立修会方面的最高权力，并以我们灵魂深处的一切力量痛绝自由主义的没收教会财产法案及世俗化法律。\n\n我们谴责一切形式、程度和伪装下的自由主义：无论是激进自由主义、教条自由主义，还是所谓“自由主义天主教”，以及任何企图将教会的真理与革命的谬误调和的企图。依据庇护九世教宗的《谬误清单》及利奥十三世教宗的通谕，我们坚信：自由主义是对信仰的亵渎，是摧毁社会的瘟疫；天主教教义与自由主义的畸变之间绝不存在任何妥协的空间。\n\n我们主张建立传统、天主教、有限制且具代表性的君主制，正如它在我们历史上最辉煌的时期所繁荣的那样。但我们极其明确地声明：君主制是为宗教和祖国而存在的，而非宗教与祖国为君主制存在。国王必须是天主的第一仆人。若一位国王或王位觊觎者在捍卫信仰上退缩、与自由主义妥协，或将其王朝及个人利益置于天主与教会不可侵犯的权利之上，他便事实性地丧失了获得臣服与继承皇冠的资格，因为天主高于国王。\n\n我们主张恢复西班牙各地区与城镇古老的特权法、自由、习惯与风俗。面对自由主义国家因受法国革命影响而实施的中央集权暴政，这些特权法才是祖国自由的真正保障。我们要求实行自治市与大区的自治，且这种自治仅服从于天主教信仰的统一与天主教国王。\n\n我们奋斗并非为了某个人、某个家族或某个王朝；我们奋斗是为了天主、为了祂的教会，以及为了我们天主教的祖国。在这条道路上，绝无懦弱、世俗顾虑或与谬误妥协的余地。仰赖天主的眷顾与毕拉尔圣母的庇佑，我们高举这面完整真理与不容阉割的天主教旗帜。"
 ncar.19.a:0 "整合主义者无知的幻想罢了"
 ncar.20.t:0 "乡村互助会"
 ncar.20.d:0 "乡村互助会是卡洛斯派将天主教社会思想、基层自治与反自由主义经济相结合的社会救助与经济自卫机制，旨在对抗19世纪由自由主义改革（如门迪萨瓦尔土地充公法案）带来的乡村资本主义化和传统农村共同体瓦解。卡洛斯派认为自由主义的市场经济将农民剥离了土地与传统法律的保护，使其暴露于高利贷、自然灾害和市场波动的风险之中，因此必须建立一种基于传统天主教团结与共同体合作的“互助体系”。这种互助会在乡村地区具体表现为天主教农业工会、农贷储蓄所以及乡村互助基金，其资金主要由当地小农、地主和教会捐助集资，用于为遭逢饥荒、病虫害、牲畜死亡或丧葬的农户提供紧急无息或低息贷款、医疗救助及生产工具共享，彻底打破城市银行与高利贷者的经济垄断。在政治与组织层面，乡村互助会往往紧密依附于各地的卡洛斯派俱乐部与乡村堂区，将经济互助与宗教虔诚、卡洛斯派政治动员融为一体，形成了一个自给自足的“天主教反抗共同体”。20世纪初，在教宗良十三世《新事大通谕》（倡导社会天主教主义的推动下，卡洛斯派理论家（如胡安·巴斯克斯·德·梅利亚）进一步将乡村互助会理论化为行会主义在农村的延伸，认为它是避免农村无产阶级化和抵御社会主义、无政府主义在西班牙乡村扩散的最有力盾牌；这种互助机制不仅为纳瓦拉、巴斯克及加泰罗尼亚等地的传统乡村提供了数十年的社会安全网，也深刻巩固了卡洛斯派在西班牙北部小农阶层中长达一个世纪的群众基础与政治忠诚。"
 ncar.20.a:0 "和平、互助！"
 ncar.21.t:0 "有机民主"
 ncar.21.d:0 "“有机民主”是我们提倡的一种反对18世纪启蒙运动和19世纪自由主义的替代性政治参与模式，它拒绝基于个人主义、政党竞争和普选制的自由民主，主张社会并非由抽象的自由个体构成，而是由自然的、具有有机功能的社会单元所组成。在这种理论体系中，“有机”意味着社会就像一个生物有机体，各个部分各司其职、相互协作，因此政治代表权不应赋予孤立的个体个人或通过竞争性政党来表达，而应当直接赋予社会的基本有机单元——即家庭、市镇以及行会或职业团体。卡洛斯派认为，自由主义的政党政治人为地撕裂了国家与社会，制造了阶级斗争与党派内耗，而有机民主则通过自下而上的传统代表制来维护社会的有机统一：公民首先作为家庭成员在地方基层行使权力，随后由市镇遴选代表，再由各行业行会和专业团体选派代表组成各级议会，最终在最顶层由恪守传统天主教信仰与古老宪章的世袭君主进行裁决与协调。这种理念深深植根于我们“为了上帝、祖国、地方特权和国王”的核心口号中，强调自治宪章所赋予的地权与团体特权，主张君主是国家统一的保障者而非绝对专制者，议会则是有机社会团体的咨询与表决机构。进入20世纪后，卡洛斯派的有机民主理论对西班牙的右翼思想产生了深远影响，其拒绝政党政治、强调职业团体与家庭代表权的内核，在西班牙王国复辟后传统主义法学联合会运动中被进一步系统化。"
 ncar.21.a:0 "这才是真正的民主"
 ncar.22.t:0 "圣地蒙特胡拉"
 ncar.22.d:0 "蒙特胡拉山位于西班牙纳瓦拉自治区的埃斯特利亚附近，海拔1044米，在19世纪至20世纪30年代的西班牙历史中，不仅是决定性的军事要塞，更成为了卡洛斯派的核心精神象征与崇拜圣地。由于该山俯瞰卡洛斯派历史上被称为“传统首都”的埃斯特利亚，控有蒙特胡拉山在军事上即可居高临下保护大本营，在政治想象中则代表着对天主教传统以及纳瓦拉古老宪章的据守。在1833年至1840年的第一次卡洛斯战争中，托马斯·德·苏马拉卡雷吉将军带领卡洛斯派军队利用其崎岖地形展开游击战与阻击战，多次击退自由派政府军的围剿，奠定了其“不屈要塞”的名声。而彻底确立其圣地地位的是1872年至1876年第三次卡洛斯战争期间著名的“蒙特胡拉山战役”，1873年11月7日至9日，卡洛斯派王位觊觎者“卡洛斯七世”在此亲自指挥部队重创自由派官军，这场大捷不仅巩固了埃斯特利亚作为卡洛斯派政权心脏的地位，也让卡洛斯七世在山上指挥战斗的形象被广为颂扬，山体因此被赋予了神圣与殉道的色彩，成为卡洛斯派“为了上帝、祖国与国王”誓死奋斗的具象化载体。进入20世纪后，卡洛斯派追随者开始沿着山路设立苦路十四处，将宗教苦修与传统主义政治诉求相结合，形成了定期的政治朝圣文化。随着1931年西班牙第二共和国建立及其世俗化政策的推行，蒙特胡拉山进一步演变为传统主义法学联合会对抗左翼与共和政府的精神阵地，准军事武装呼啸兵在此频繁举行秘密集会与军事训练，直到西班牙内战爆发前夕，蒙特胡拉山作为纳瓦拉传统主义者的精神支柱，直接促成了卡洛斯派民兵迅速响应埃米利奥·莫拉将军的政变号召并全面参与对共和国的武装叛乱。"
 ncar.22.a:0 "我们的起源！"
 ncar.23.t:0 "上帝、祖国、地方特权、国王"
 ncar.23.d:0 "“上帝、祖国、地方特权、国王”是我们的核心意识形态纲领与行动口号，通常被称为“四连环信条”，它凝聚了西班牙传统主义政治哲学的四大支柱，旨在建立一个反启蒙、反自由主义且高度分权的传统天主教君主制国家。这个口号最早以“上帝、祖国、国王”的三元形式作为对法国大革命“自由、平等、博爱”口号的反制，随后“地方特权”被正式纳入其中，明确了对纳瓦拉、巴斯克、加泰罗尼亚和阿拉贡等地区古老自治习惯法的坚决捍卫。“上帝”代表着绝对的天主教信仰与社会统一，主张教会法律高于国家世俗法律，强力反对第二共和国的世俗化与无神论改革；“祖国”强调西班牙是由各个传统历史区域自然结合而成的统一有机体，反对自由主义政权强制推行的中央集权制与激进民族主义；“地方特权”代表着对中世纪继承下来的地方自治权、税收豁免权、本土习惯法以及行会特权的誓死保护，是卡洛斯派在西班牙北部农村获得深厚民意基础的核心经济与法理诉求；而“国王”则象征着合法性与正统性，要求恢复卡洛斯派嫡系王室的绝对统治，主张君主应作为凌驾于党派纷争之上的传统仲裁者而非立宪君主制下的虚位元首。这一口号不仅是卡洛斯派阵营在多次卡洛斯战争以及1内战中凝聚武装力量呼啸兵的战歌与精神灵魂，更将宗教虔诚、地方分权与君主正统主义完美融合，构成了西班牙近代反革命与传统主义思潮最完备的政治宣言。  "
 ncar.23.a:0 "西班牙万岁！"
 ncar.24.t:0 "天主教会"
 ncar.24.d:0 "西班牙的天主教会自古罗马时期便已存在，早期殉道者与基督教社区的形成为其奠定了基础，并在公元589年西哥特国王雷卡雷德一世于第三次托莱多会议上改宗天主教后，彻底确立了天主教作为西班牙国教的地位；8世纪初穆斯林入侵伊比利亚半岛后，天主教会成为了长达数个世纪的“收复失地运动”的精神核心与凝聚力量，圣雅各信仰更演变为抵抗穆斯林的宗教与军事象征；随着1492年格拉纳达的沦陷与西班牙统一，天主教双王费尔南多与伊莎贝拉借由天主教会强化王权，建立了异端审判所以清查伪伪装改宗者，并在宗教改革时期成为欧洲反宗教改革的绝对核心，孕育出耶稣会创始人罗耀拉的圣依纳爵与阿维拉的圣德兰等重要圣人；在西班牙帝国对外扩张的过程中，天主教会伴随着征服者的脚步深入美洲与亚洲，建立起庞大的海外传教网络；然而进入19世纪后，随着波旁王朝改革与自由主义思潮的崛起，教会与世俗政权的矛盾日益激化，1830年代的“没收教会财产法案”使教会失去了大量土地与财产，削弱了其经济根基，引发了教皇国与西班牙政府的长期紧张关系，同时社会底层工农阶层的异化也导致了反神职人员情绪的蔓延；尽管1851年政教协定确立了天主教的官方地位并由国家支付神职人员薪资，但随着20世纪初社会主义、无政府主义与共和主义思想的迅速传播，教会越来越被激进左派视为旧制度与压迫阶级的代言人，这一矛盾在1931年西班牙第二共和国成立后彻底爆发，新宪法通过了政教分离、没收部分教产、禁止宗教团体办学以及解散耶稣会等激进政策，引发了广泛的抗议与严重的社会动荡，并伴随着多起针对教堂的焚烧与暴力事件，最终在1935年前夕，西班牙天主教会已处于与左翼政府高度对抗、并与右翼保守势力紧密结盟的极度张力状态。"
 ncar.24.a:0 "西班牙不可缺少的一部分"
 ncar.25.t:0 "地方特权"
 ncar.25.d:0 "我们的地方特权主张的核心在于捍卫西班牙各历史地区的传统自治特权，这些特权源自中世纪各王国与地方共同体的宪制传统，包含了地方独立的立法权、司法自治、免除向中央政府交纳直接税以及免服中央强制兵役等一系列经济与政治豁免权；我们将这些传统的地方特权视为对抗19世纪自由主义中央集权改制、反对统一法典化以及抵制马德里官僚霸权的核心屏障，主张西班牙不应是一个单一制国家，而应恢复为一个由各个拥有独特传统和特权的领地（如巴斯克地区、纳瓦拉、加泰罗尼亚和阿拉贡）通过拥戴合法君主而联合起来的“复数联邦”或多元君主国，在这种极具地方自治色彩的绝对主义与传统主义蓝图中，地方特权被上升为“上帝、祖国、国王与地方特权”四大核心纲领之一，强调只有尊重各地方因习俗而生的传统特权，才能真正维系国家的历史有机统一，从而使我们成功吸纳了大量巴斯克和加泰罗尼亚等强烈渴望维护地方特权的农民、地方贵族与保守天主教势力的支持。"
 ncar.25.a:0 "地方自治为我们带来民族团结"
 ncar.26.t:0 "社团有机体"
 ncar.26.d:0 "社团有机体建立在天主教传统主义与反自由主义的社会哲学之上，主张社会并非由孤立、理性的抽象个体通过社会契约构成的机械组合，而是一个由上帝设定、自然演进且各部分相互依赖的“有机生命体”；在这种有机社会观下，家庭是社会最基本且最具不可侵犯性的自然细胞，而行会、地方市镇、行省自治议会、专业团体以及天主教会等中介组织则构成了社会秩序的骨骼与肌肉，我们极力捍卫这些中介社团的绝对独立性与历史自治权，主张国家的权力必须受到这些传统社团的严格限制，国家仅仅是协调各社团利益的最高管理者而非全能的立法者；因此，我们坚决否定19世纪自由主义所推崇的“一人一票”式普选制与多党政党政治，认为政党政治只会撕裂社会的天然团结并将个体撕离其固有的社团纽带，转而倡导一种有机民主制，即政治代表性不应来自抽象的个人选票，而应由家庭、工会、行会、市镇和教会等天然社团直接派选代表进入议会，从而在保障等级秩序、天主教信仰纯洁性与社团自治的同时，构建出一个自下而上、由多样化自然社团有机层叠而成的有机君主制国家。"
 ncar.26.a:0 "我们民族的活力"
 ncar.27.t:0 "何为社会天主教？"
 ncar.27.d:0 "天主教社会学说是天主教会针对现代社会、经济与政治问题所形成的一套系统性的伦理与道德教义体系，其现代奠基以教宗利奥十三世于1891年颁布的《新事通谕》为标志，旨在回应工业革命带来的资本主义剥削、阶级矛盾以及劳动者苦难；该学说的核心建立在“人的尊严”这一根本原则之上，认为每个人都是依照上帝的形象所造，拥有不可剥夺的尊严与基本权利，进而衍生出四大核心基本原则：强调一切社会资源与经济活动都应服务于全体社会成员福祉的“共同善”、主张高级社会组织不应随意干涉或取代初级社会组织能自主完成的功能与自治权之“辅助性原则”、要求所有人在社会生活中相互承担道德责任与命运共同体意识的“团结性原则”，以及优先关注并保护贫困者、弱势群体与边缘化人群的“对贫困者的优先选择”；在具体社会主张上，天主教社会学说既批判放任自流、将人工具化的无节制资本主义，也坚决反对否定私有财产权、主张阶级斗争与唯物主义的集权社会主义，转而倡导一种兼顾私有制与社会责任的“适度财产权观”，主张劳资双方应当基于基督宗教的爱德与正义达成和谐合作而非对抗，强调劳动者享有获得公正薪资、安全工作环境、休假以及组建工会维护自身权益的自然权利，并在政治领域支持追求正义、保障人权与维护公共秩序的民主与法治制度，构成了现代天主教回应贫富差距、全球化、生态危机与社会不公等复杂议题的正义蓝图。"
 ncar.27.a:0 "听上去不错"
 ncar.28.t:0 "凌驾于国王之上的社会自治体"
 ncar.28.d:0 "之所以主张社会自治体在传统与法理秩序上的地位高于国王，主要在于我们独特的传统主义与天主教宪制思想，即坚信社会自治体是先于国家和王权而存在的“自然实体”与“有机细胞”；在卡洛斯派的政治哲学中，国王的绝对合法性并不源于神化君主个人的专制权力，而是源于国王对神圣法律、天主教信仰以及各地方与社团历史性固有特权的恪守与宣誓效忠，这意味着君权与社会自治体之间构成了一种契约性的传统关系，国王是传统秩序与自治社团的护卫者而非创造者；因此，我们将自由主义和波旁中央集权制批判为“自上而下的国家专制主义”，认为正是马德里中央政府试图消灭地方自治体与中介组织，才导致了个体孤立与国家极权，转而强调社会自治体拥有不可侵犯的自然法与习惯法地位，国王不仅不能凌驾于自治社团之上，其行政与立法权力还必须受到自治体传统特权的严格约束，一旦国王侵犯了这些社会自治体的固有自治权，便背离了其作为“传统君主”的合法性基础，从而在理论上确立了社会自治体作为国家历史与道德根基对君权在秩序与原则上的优先性。"
 ncar.28.a:0 "庸碌之辈无法染指我们的社会"
 ncar.29.t:0 "旧苗焕新芽"
 ncar.29.d:0 "我们的农本主义将乡村生活、土地秩序与传统天主教信仰深度融合的社会与经济思想，其核心在于将农村与农业社会视为维持国家道德纯洁性、宗教虔诚与社会稳定的基础；我们坚信乡村是抵御自由主义、工业化、都市化以及无神论思想侵蚀的最坚固堡垒，认为土地不仅是经济生产的要素，还是连接家庭、家族传统、地方习惯法与上帝神圣秩序的纽带；在我们的构想中，由自耕农、小土地所有者、乡村手工业者以及地方贵族构成的传统乡村社团，体现了最理想的社团有机体秩序，其内部基于天主教爱德、邻里互助与世代相传的习惯进行自我治理，天然地排斥现代工业资本主义所带来的资产阶级剥削、金融投机与异化劳动，同时也坚决反对社会主义所主张的阶级斗争与土地国有化；因此，我们在经济与社会主张上极力捍卫小农经济与村社公有地的完整性，反对19世纪自由主义政府推行的土地充公与私有化改革，主张保护乡村家庭财产不被市场资本与中央政府的税收霸权剥夺，试图通过维系以土地为核心的传统生产方式与社会纽带，构建出一个以乡村为道德中心、以天主教信仰为精神支柱、以地方自治为制度保障的反现代性农本理想国。"
 ncar.29.a:0 "保护农民是我们的责任"
 ncar.30.t:0 "我们的呼啸兵"
 ncar.30.d:0 "呼啸兵在宗教与政治使命的驱动下，形成了一套集宗教护卫、社群互助、社会治安维持与传统道德监督于一体的独特社会责任体系。作为一个深植于西班牙天主教传统与地方共同体中的准军事团体，呼啸兵将自身定位为天主教信仰与传统社会秩序的“守护者”，其核心的社会责任是在战争与动荡时期保卫教区、教会财产以及修女和神父的安全，防范反教会势力与左翼激进分子的破坏；在平时，他们承担着地方治安维持与社区护卫的任务，协助地方当局或自发维持公共秩序与防范犯罪；同时，呼啸兵在其控制区或大本营履行着广泛的社会救助责任，包括在战时为士兵家属、贫困教友、孤儿及寡妇提供物资援助、医疗救济与生活保障，甚至利用地方的基层组织协调农业劳作与资源分配，以维持共同体的基本运转；此外，由于其浓厚的宗教底色，他们还肩负着重塑与监督传统道德规范的责任，强调用天主教传统美德重塑社会风气，通过组织宗教仪式、集体祷告及道德宣导来维系社区的内部凝聚力与宗教虔诚度，从而使呼啸兵不仅发挥着军事突击力量的作用，也在社会基层中扮演了类似治安队、慈善救济机构以及道德警察等多重社会责任角色。"
 ncar.30.a:0 "忠诚的人民卫士"
 ncar.31.t:0 "重建权威"
 ncar.31.d:0 "卡洛斯八世陛下强烈渴望在西班牙恢复绝对主义式的君主权威，源于他与极端传统主义的接触和传统天主教君主制思想。在他看来，西班牙自19世纪以来因自由主义、世俗化和议会民主制的发展，已经严重偏离了国家正轨，导致社会动荡、道德败坏以及无神论与共产主义思想的泛滥；特别是经历西班牙内战后，陛下坚信只有建立一个高度集权、拥有至高统治权且不受党派议会羁绊的正统天主教君主，才能彻底铲除左翼思潮并纠正传统佛朗哥政权下的集权军事实体向现代化或世俗化妥协的倾向，从而重塑西班牙以“上帝、祖国、地方特权”为核心的核心国家认同，通过君主神圣且不可侵犯的至高权威恢复天主教对社会秩序与法律的绝对统摄地位，挽救陛下眼中濒临精神崩溃与制度瓦解的西班牙传统社会。"
 ncar.31.a:0 "卡洛斯八世陛下万岁！"
 ncar.32.t:0 "西班牙的整合主义者"
 ncar.32.d:0 "西班牙整合主义是19世纪末至20世纪初在西班牙兴起的极右翼天主教政治与思想流派，他们的核心主张在于坚持天主教传统信仰在社会、政治和国家法律中的绝对与统治地位，主张将西班牙重塑为一个政教合一的纯正天主教国家，并极力反对任何形式的现代主义、世俗化、自由主义以及政教分离政策；整合主义者高度强调国家立法与社会制度必须完全服从天主教教会法与教宗的权威训导，希望彻底废除信仰自由与宗教宽容，压制其他宗教及无神论思想，同时在政治上推崇传统的君主专制或极度保守的权威政治体系，强烈抵制普选制、议会民主和多党制，认为现代民主制度会导致社会分裂与道德堕落，并主张恢复中世纪的封建行会制度和传统行会自治，建立一种有机有理的等级制社会秩序，在文化和教育领域则要求教会掌握绝对的审查权与教育控制权，严厉打击自由派言论、世俗教育与现代哲学思想，把西班牙的民族认同与天主教信仰深度绑定，坚信西班牙的伟大历史全赖于对天主教信仰的绝对忠诚，因而将所有引入现代西方自由主义思潮的企图都视为对国家灵魂的背叛。"
 ncar.32.a:0 "听上去有点太极端了"
 ncar.33.t:0 "行为合法性"
 ncar.33.d:0 "我们所宣称的行为合法性主要建立在血统法理与实质神权政治的双重合法性基础之上：在血统与王朝法理合法性方面，我们必须严格遵循腓力五世陛下颁布的《萨利克继承法》，王位继承权优先属于波旁王朝的直系男性后裔；当国王斐迪南七世于1830年废除《萨利克继承法》并重新启用传统的《国法大全》以强行使其女儿伊莎贝拉（即伊莎贝拉二世）获得继承权时，斐迪南七世的改制就已经违反了宪政法律程序且非法剥夺了国王之弟莫利纳伯爵卡洛斯王子的法定继承权，因此坚称唯有卡洛斯及其男系后裔才是合法的西班牙君主，伊莎贝拉支系的统治则是篡位行为；在意识形态与实质合法性方面，统治者的合法性不仅取决于出身，更取决于其是否忠实于西班牙的传统价值与宗教秩序，自由主义政府是对天主教信仰的背叛、对国家统一与传统的破坏以及对中央集权专制的肆意扩张，因此通过捍卫天主教在国家中的绝对主导地位、恢复巴斯克和加泰罗尼亚等地区的历史性地方特权以及建立受传统习惯法制约而非自由主义议会宪法限制的绝对君主制，来重塑国家的统治合法性，使我们的武装反抗与政治斗争更像是为一场维护传统天主教秩序、反抗西方自由主义世俗化入侵的神圣正义战争，而我们接下来要做的便是延续这一斗争。"
 ncar.33.a:0 "跟随基督吾王的指引！"
 ncar.34.t:0 "偶然主义之死"
 ncar.34.d:0 "人民行动主流派系所奉行的偶然主义是对信仰原则的极度软弱与政治投机主义。偶然主义主要由安赫尔·埃雷拉·奥里亚及何塞·玛丽亚·希尔-罗夫莱斯等天主教理智主义者倡导，他们认为政体形式在天主教教义中仅属于次要的、偶发性的外部壳套，真正的关键在于政权能否保障天主教会的利益与社会的宗教秩序。我们必须坚决驳斥这种实用主义的苟且立场，传统合法君主制绝非可有可无的偶发要素，而是西班牙民族灵魂不可分割的核心承载者。我们应该批评人民行为了在第二共和国体制以及复辟的伪西班牙王国内谋求合法议会席位而向不奉神、反教会的无神论叛徒妥协，偶然主义无异于认贼作父、对天主教传统国家理想的背叛，人民行动试图在一个以自由主义和世俗主义为基础的框架下通过议会改良来救国完全是自欺欺人的幻想，唯有通过不妥协的武装暴力，彻底铲除共和主义与自由主义，恢复合法的天主教传统君主制，才能真正拯救西班牙的信仰与灵魂。"
 ncar.34.a:0 "保卫我们的传统生活！"
 ncar.35.t:0 "占领街头"
 ncar.35.d:0 "社会暴力是捍卫神权政治秩序与自然法的正义自卫的必然手段。在我们的设想中，社会并非由个体契约构成的机械集合，而是由上帝建立、依托天主教信仰、传统君权与地方特权维系的正统有机体；因此，源自启蒙运动和法国大革命的世俗化、自由主义以及现代国家集权，不仅是对正统君主的非法篡位，更是破坏神圣宇宙秩序的邪恶异端，因此我们必须拒绝任何形式的世俗政治妥协，当合法政权被颠覆、神圣信仰遭到威胁时，臣民不仅享有反抗暴政的权力，更负有发起正规圣战的宗教义务。社会暴力一方面是作为社会自卫的手段，用以清除侵蚀传统共同体的自由主义病毒与无神论思潮，恢复前现代式的社会等级与天主教统一性；另一方面则具有暴力以宗教赎罪与道德洗礼的神圣，社会暴力抵御现代性侵蚀、捍卫自然法秩序以及实现前现代社会有机复兴不可替代的神圣工具，西班牙的街头必须牢牢掌握在我们的手中。"
 ncar.35.a:0 "自由主义者嚣张不了太久了"
 ncar.36.t:0 "基督的恩惠"
 ncar.36.d:0 "天主赐予西班牙至高无上的强盛与繁荣，并非是我们善于投机，而是天主给予我们的神圣天命与救世使命：天主选择西班牙作为地上最虔诚的捍卫者与先锋，正是为了借西班牙之手在全人类中显扬神圣的旨意。在长达数百年的圣战里，正是凭借天主的眷顾与圣雅各弟兄的显灵保佑，西班牙基督徒才得以战胜异教徒、光复天主教失地；随后在1492年，天主又赐予西班牙双王光复格拉纳达的终极胜利，并破天荒地指引哥伦布发现了新大陆，这是天主对西班牙至诚信仰的直接赏赐，西班牙已被神圣拣选去承担将福音传播至天涯海角的宏伟业迹。西班牙的强盛是神圣正义的体现，帝国在欧洲对抗新教异端、在美洲征服土著异教徒并拯救亿万灵魂，皆是在履行天主赋予的天主教护教帝国之职责；西班牙君主不仅是世俗的统治者，更是天主在世间的代理人，西班牙军团的每一次胜利都是神圣意志对邪恶与异端的惩戒，而帝国所获取的金银财富与广袤领土，则是天主因西班牙捍卫普世公教会的无比忠诚而赐予的神圣恩典与地上赏报。"
 ncar.36.a:0 "我们才是神选子民！"
 ncar.37.t:0 "光荣历史"
 ncar.37.d:0 "中世纪晚期的卡斯蒂利亚与阿拉贡军队仍保留着封建征召兵与骑兵主导的传统形态，直到15世纪末的收复失地运动期间，西班牙军事体制才真正开始孕育变革。随后在1494年爆发的意大利战争中，面对强大的法国重骑兵与瑞士长枪兵，“大将军”贡萨洛·费尔南德斯·德·科尔多瓦进行了具有划时代意义的军事改革：他打破了中世纪贵族骑兵的垄断，开创性地将持长枪的防御性步兵与使用火绳枪的远射兵种进行有机协同，初步奠定了“枪炮结合”的联合兵种战术。这一革新在1522年的比柯卡战役与1525年震惊欧洲的帕维亚战役中大放异彩，西班牙步兵凭借密集的火枪齐射与坚固的长枪方阵重创法军，甚至生擒了法国国王弗朗索瓦一世，一举确立了西班牙在欧洲大陆的军事优势。到了1534年至1536年间，神圣罗马帝国皇帝兼西班牙国王查理五世通过《热那亚敕令》等法律，将这种战术体制正式制度化与常备军化，标志着举世闻名的“西班牙大方阵”正式诞生。在随后的150余年中，西班牙方阵成为令整个欧洲闻风丧胆的无敌劲旅；这些方阵由高度职业化、纪律严明且拥有极强宗教凝聚力的志愿老兵组成，并辅以严密的军需、军医和军法官体系。在腓力二世统治的鼎盛时期，西班牙陆军作为帝国全球霸权的基石，横扫各大战场：1547年在米尔贝格战役中击溃德意志施马尔卡尔登同盟，1557年在圣康坦战役中再次痛击法军，同时通过西班牙小道远征低地国家平定八十年战争中的荷兰叛乱，甚至在1585年凭借奇迹般利用河面结冰出奇制胜的恩佩尔奇迹书写不败神话。除了在欧洲本土的辉煌战绩，西班牙陆军及其衍生力量还在新大陆征服了阿兹特克与印加两大帝国，将帝国的铁蹄延伸至美洲与亚洲，构建起人类历史上第一个日不落帝国。我们陆军长达一个半世纪的陆上霸权，完全建立在常备职业军人的崇高荣誉感、对火器与长枪的完美战术融合以及国家机器高效的财政与军需支撑之上，也代表了早期军事革命与陆战战术的最高巅峰。"
 ncar.37.a:0 "可惜我们的时代已经结束了"
 ncar.38.t:0 "无政府主义者"
 ncar.38.d:0 "全国劳工联合会-伊比利亚无政府主义联盟坚信阶级斗争是社会变革的核心动力，主张彻底废除资本主义雇佣劳动制、私有财产以及国家这一暴政与压迫的机器，认为无论是议会民主还是无产阶级专政本质上都是对劳动者的统治与剥削。在社会组织构想上，他们主张依据自由联合与互助原则，建立由工人委员会、行业工会和社区公社构成的自下而上的无阶级社会，所有生产资料归全社会劳动者共同所有，并由工人自我管理，产品的分配则遵循“各尽所能，各取所需”的原则，完全摒弃货币制度和市场商品交换。为了实现这一目标，在斗争路线（以1931年《萨拉戈萨草案》等纲领性文件为代表）上极其强调直接行动，即劳动者不依赖任何政党、议会选举或官方仲裁，而是通过罢工、怠工、抵制、总罢工乃至武装起义等方式直接与资本家及国家机器对抗；同时，他们严格奉行反议会主义与非政治主义，拒绝参与任何官方政治体系或立法活动，认为政治选举只会削弱工人的革命意志并巩固统治阶级秩序。此外，作为无政府工联内部坚守无政府主义纯洁性的核心组织，伊比利亚无政府主义联盟在理念上极其警惕工会官僚化和改良主义妥协倾向，高度强调个人自由与集体解放的统一，并积极倡导反军国主义、反教权主义与自由教育，致力于在消灭旧有经济和政治体制的同时，重塑不受宗教迷信和国家权威束缚的新人类。"
 ncar.38.a:0 "一个难缠的敌人"
 ncar.39.t:0 "终结暴力"
 ncar.39.d:0 "我们的使命就是为了从无政府主义者的暴力恐吓中夺回属于工人的工作自由，并拯救西班牙免于阶级撕裂的深渊。社会绝不是马克思主义者或无政府主义者所宣扬的那种你死我活的阶级战场，而是一个血脉相连的有机共同体，即工人与厂主、资本与劳动，本质上是相辅相成、缺一不可的合作伙伴，只有劳工与雇主在天主教的社会正义与博爱精神下携手，工厂才能开工，千千万万工人家庭的温饱与福祉才能得到切实保障。那些激进分子所鼓吹的阶级斗争和总罢工，根本不是为了工人的利益，而是外来邪说对西班牙社会的毒害，它们除了摧毁经济、让工人失去薪水、让街头充斥血腥以外，什么也创造不了；无政府主义者对不愿参加罢工的普通工人实施围攻、暗杀和恐吓，是赤裸裸的暴力专制，剥夺了工人劳动的基本权利。因此，我们坚决反对一切破坏社会秩序的暴力行为，只有通过和平谈判、劳资协商以及建立互助基金、医疗养老保障等手段才能改善工人生活；自由工会的成员们拿起武器是为了面对无政府主义恐怖威胁时为了捍卫工作权、守护传统信仰与社会秩序所不得不进行的正义自卫，只有自由工会才是真正代表西班牙广大勤劳、爱国且虔诚的工人阶级的正义力量。"
 ncar.39.a:0 "消灭赤色暴政！"
 ncar.40.t:0 "工会国有"
 ncar.40.d:0 "国家是唯一能够凌驾于资产阶级和无产阶级之上、实现真正绝对正义的最高仲裁者。国家工会绝对不是那些左翼暴徒们所攻击的资本家走狗或官僚傀儡，而是一种超越阶级对立的社会有机体；在我们的设想中，国家将以法律和行政力量介入经济生活，强制将劳资双方整合进由政府统一监督、行业统一划分的垂直社团工会或劳资协作评议会中，工人们将不用再依靠暴动或违法罢工，而是可以通过国家设立的法定仲裁机制直接向雇主争取合理的薪资、八小时工作制、社会保险和安全的劳动环境，自由市场下的放任自流只会导致资本家肆意压低工资，而无政府工会的暴力革命只会引发社会混乱与经济崩溃，唯有将工会彻底纳入国家的合法监管体系，由国家制定统一的劳动标准并充当强力裁判，才能既保障工人阶级的物质福祉与尊严，又可以维护天主教传统价值观、社会安宁与国家利益的统一。"
 ncar.40.a:0 "又一大进步"
 ncar.41.t:0 "整合工团主义"
 ncar.41.d:0 "胡安·拉吉亚·利特拉斯将传统卡洛斯主义的天主教保守思想与英法的工团主义相结合，通过建立一种超越资本主义与马克思主义社会主义的第三条道路。整合工团主义提倡阶级合作而非阶级斗争，劳资双方并不是对立的敌人，而是共同促进国家和生产力发展的合作伙伴；在社会结构上，胡安·拉吉亚·利特拉斯希望通过推行天主教社会教义，强调家庭、宗教伦理和社群秩序，让工会不仅只被视为争取经济利益的组织，更是为恢复传统天主教道德和社会秩序的工具；在国家与社会组织形态上，整合工团主义者们追求建立一种有机社群主义或有机社团主义，希望废除资产阶级政党议会制，改为按行业、职业和生产部门组织起来的社团制代表体系，由劳工、技术人员和雇主共同在国家框架下协商调节经济；胡安·拉吉亚·利特拉斯推崇强有力的国家威权与民族统一，劳工运动必须服从于国家整体利益与民族认同，反对无政府工团主义的反国家与国际主义立场，从而形成了独属于我们的一种融合了天主教传统主义、国家社团主义以及右翼反自由主义的纲领。"
 ncar.41.a:0 "捍卫我们的道德"
 ncar.42.t:0 "重新定义卡洛斯战争"
 ncar.42.d:0 "卡洛斯战争本质上是一场反抗中央集权资本主义和自由派资产阶级掠夺的人民阶级解放运动，而非单纯专制正统派对抗自由主义的王位继承之争。卡洛斯战争的主要矛盾是北方农村基层自治群体与马德里官僚化自由派政权的对立：马德里政府打着自由主义旗号推行的土地土地赎买与充公政策，本质上剥夺了广大农民赖以生存的公共土地，将资产集中到了新老资产阶级手中，导致基层社会的贫困化；而卡洛斯陛下的军队真正主力是广大底层农民、手工业者和地方大众，起兵是为了保卫代表地方民主、基层共同体自治与习惯法的特权，以此抵制极权式的资本主义国家国家构建。所以卡洛斯战争本质上是一场具有早期的、原始自发性的自下而上的社会革命，是西班牙劳动大众反抗原始资本积累与国家集权主义的阶级斗争。"
 ncar.42.a:0 "不错"
 ncar.43.t:0 "自治社会主义的照耀下"
 ncar.43.d:0 "生产资料既不应该归私人资本家所有，也不能由国家官僚机构进行集中统制，而是应该交由在各个生产单位中工作的劳动者集体共同占有与直接支配；雇佣劳动关系和阶级压迫将会被终结，劳动者作为财富的创造者天然拥有对其劳动过程及劳动成果的决定权与主导权，所以企业内部必须贯彻政治民主原则，消灭传统资本主义企业或国家集权体制下管理者与被管理者的阶级对立，由全体员工通过劳动者委员会或全体职工大会等机构按照一人一票的平等原则直接参与企业宏观经营策略制定、生产计划规划、利润留存与盈余分配方案、工作环境改善以及技术改进等一切重大决策，并通过直接民主选举产生具体执行管理职务的代表或委员会，且这些管理人员必须随时接受全体劳动者的监督并可随时被罢免；我们应该反对中央的强制性指令计划经济，自治企业将作为独立的经济主体，在社会整体公有制和国家宏观框架下享有高度的经营自主权与决策权，通过平等协商、联合会契约或符合社会共同利益的社会化计划机制来进行协作，以此实现社会资源的高效配置与劳动者自由发展的真正统一。"
 ncar.43.a:0 "属于全体劳动者！"
 ncar.44.t:0 "人民君主制"
 ncar.44.d:0 "伊格纳西奥·罗梅罗·奥斯本将西班牙传统的卡洛斯主义地方特权与自我管理社会主义相结合，由此重新定义了王权与人民的关系。在伊格纳西奥·罗梅罗·奥斯本理念中，君主不再是代表资本主义制度或统治阶级利益的政客，也不是凌驾于社会之上的绝对专制者，而是作为整个人民共同体的仲裁者、宪制保障者以及反抗官僚集权与寡头统治的象征；人民君主制反对自由主义的议会政党制与中央集权制，现代代议制民主不过是资产阶级和金融精英控制国家的工具，因此我们提倡自下而上的参与式民主与自治联邦，将社会权力和经济决定权直接赋予工人委员会、地方公社和各历史区域，而君主则超越所有政党私利，直接服务于最广大的劳动阶级，保障人民的自我管理权、社会正义与多样性的区域自治，并由此构建一个既保留传统主义、又可以实现人民经济与政治解放的社会主义联邦君主国。"
 ncar.44.a:0 "国王应当为人民服务"
 ncar.45.t:0 "黄色工会之死"
 ncar.45.d:0 "对天主教社会思想的独特理解以及对独立、真实工人运动的追求促使马西米利亚诺·阿尔博莱亚虽和自由工会同属统一阵营却站在了他们的对立面。阿尔博莱亚认为，一个真正符合天主教教义的工会组织必须具备绝对的独立性和阶级代表性，而自由工会本质上是资本家和雇主用以监控、分化与控制劳动者的傀儡工具，破坏了劳资双方平等的契约精神与社会正义原则；在阿尔博莱亚看来，黄色工会打着反工团和恢复秩序的旗号，实际上却摒弃了工人阶级争取合理薪资、改善劳动条件和维护阶级尊严的基本权利，沦为了维系资本家剥削秩序的附属品，这种披着温和与天主教外衣的假工会比激进的左翼工会更具欺骗性和危害性；阿尔博莱亚强调真正的天主教社会正义并非盲目的顺从与阶级妥协，而是要在承认资本与劳动合理权利的前提下，建立起由工人自主管理、能切实代表工人利益并开展合法斗争的独立天主教工会，而黄色工会对雇主权的服从不仅剥夺了工人的主体性，更是让天主教信仰沦为了压迫工人的思想工具，导致广大无产者对教会彻底失望并投向无神论与马克思主义的怀抱，因此黄色工会是所有尚存良知的天主教徒所必须消灭的敌人，是比工团主义还要邪恶一万倍恶魔。"
 ncar.45.a:0 "滚下地狱吧，叛徒们"
 ncar.46.t:0 "独立工会的诞生"
 ncar.46.d:0 "真正独立的天主教工人工会必须既忠实于天主教社会教义、又能真正保障无产阶级主体地位与社会正义。工会必须在行政、财政与决策上保持对雇主、政府及政党的独立，唯有脱离资产阶级的控制与庇护，工会才能摆脱傀儡属性，从而获得劳工阶层的真正信任；独立工会并非要发动暴力阶级斗争，而是要赋予工人阶级合法的集体谈判权与自主管理权，使其能够在平等的地位上与资产阶级展开对话，从而争取合理的薪资待遇、劳动保障与阶级尊严，实现真正的社会和平；马西米利亚诺·阿尔博莱亚将独立的基督教工会视为拯救工人阶级精神与物质生活的重要途径，他认为只有让工人看到教会支持他们通过自主自治的方式维护自身合法权益，才能彻底消除工人对教会“站在压迫者一边”的误解，防止广大无产者走向无神论的激进主义，进而将天主教社会正义转化为现实中重塑劳资关系、重建健全社会秩序的建设性力量。"
 ncar.46.a:0 "独立工会万岁！"
 ncar.47.t:0 "瓦解资本暴政"
 ncar.47.d:0 "无节制的资本贪婪违背了天主教共同善与财产所有权具有社会责任的基本原则，将本应作为服务人类工具的经济活动扭曲为以剥削和榨取利润为唯一目的的非人化机制；资产阶级的贪婪是导致工人阶级极度贫困、尊严丧失以及劳资关系极度恶化的根本原因，他们对利润以及财产的追求不仅直接摧毁了社会的有机团结与和平，更迫使受压迫的广大无产者对教会和既有秩序产生绝望，进而被无神论的激进社会主义与工团主义所吸引；资本必须受到基督教道德与法律规范的制约，消除资本的贪婪性并非要消灭私有制或否认资本的合理收益，而是要恢复经济活动的道德约束，确保劳动者能够分得应有的财富份额，这样才能建立起一个兼顾效率、尊严与基督徒慈爱精神的和谐社会秩序。"
 ncar.47.a:0 "工人的新时代来临了"
 ncar.48.t:0 "这是行会社会主义吗？"
 ncar.48.d:0 "马西米利亚诺·阿尔博莱亚虽然主张其理论源于天主教社会学说与温和化工团主义的结合，但从实质上看，他的思想无疑更加偏向于早期兴起于不列颠的行会社会主义。这一由阿瑟·彭蒂等人系统性提出的社会主义思潮主张以产业民主和工人的自我管理为核心机制，并坚决反对国家行政权力对工会内部事务的无端干预，这些核心主张与阿尔博莱亚的思想构架有着极高的吻合。虽然阿尔博莱亚并非盲目的反资本主义者，他反而高度肯定资产阶级在社会财富创造与促进国家整体利益方面的历史贡献；但与此同时，他也极其反对资本无节制的扩张倾向，明确反对其对劳动者所施加的剥削与压迫，并同行会社会主义者一样，否定国家对社会各个阶层所拥有的绝对控制力与至高无上的主权。或许，我们可以汲取行会社会主义，并由此为契机迈向一个更加激进的新时代。"
 ncar.48.a:0 "维持现状就好"
 ncar.48.b:0 "接触点新思想没什么不好"
 ncar.48.c:0 "或许我们可以“专制”一点"
 ncar.49.t:0 "垂直工会"
 ncar.49.d:0 "经济本身并不是目的，而是服务于人类和集体的工具。资本主义将资本定为经济生活的唯一核心，从而使劳动失去了人性，并将人类个体降格为屈从于供求规律的简单商品。另一方面，马克思主义企图纠正资本主义的弊端，却陷入了同样的唯物主义错误，将个人的自由屈从于国家的暴政和破坏性的阶级斗争，进而毁灭了国家的共同生活。我们对国家经济的构想建立在超越个人主义资本主义与国家集权主义这一虚假替代方案的基础之上。我们提出一种国家工团主义体系，在此体系中，私人所有制在履行其社会功能且不被用作统治或剥削工具的前提下受到尊重。生产必须通过垂直工会进行有机组织，该工会涵盖生产过程中的所有参与者，从工人到企业主和技术人员，从而通过为祖国共同利益服务的团结合作来消除阶级斗争。国家既不能像自由主义那样做一个纯粹的被动旁观者，也不能像极权主义那样成为绝对的所有者，而应当成为经济的最高仲裁者和组织者，负责保障社会正义、充分就业、确保所有劳动者获得财产的权利，并将一切经济活动服从于国家历史使命的最高利益。"
 ncar.49.a:0 "劳动万岁！"
 ncar.50.t:0 "完美之国"
 ncar.50.d:0 "我们认为，一个国家绝不仅仅是生活在一片土地上的群体的集合，也不是某一特定时刻恰好重合的个人利益的总和，而是一个形而上的、超越性的实体，一个在宇宙命运中的统一体，这个统一体既不能被某一代人的意志所分割，也不能被任何阶级、政党或地区的任性举动所撕裂；西班牙不是可以任凭其组成部分随意割裂的物质，也不是每四年通过选举游戏就能重新修订的社会契约，而是一个在世界上承担着更高使命的历史与精神实体，其延续性必须超越时间的偶然性以及个人或集体的自私利益；祖国绝不仅仅是一块领土、一种语言、一个种族或一种共同的习俗，而是历史上一项共同的事业，是过去与未来所有希望与痛苦的有机结合，它要求个人服从于共同体的有机整体，从而使每一个西班牙人都能感觉到，只有当他将自己融入并积极服务于这个旨在表现某种精神、道德和爱国秩序且能够有效地在世界历史上产生深远影响的最高统一体时，他的生命才获得了真正的意义。"
 ncar.50.a:0 "西班牙正在崛起"
 ncar.51.t:0 "个体与集体"
 ncar.51.d:0 "我们既不把个体视为一个孤立的原子、一个自由主义企图赋予其虚构权利清单却任由其在经济压迫和社会混乱中无依靠靠的抽象与空洞的存在，也不把集体视为一个无定形的群盲或是一个为了将其沉溺于马克思主义唯物主义的集权漩涡中而必须摧毁人性条件的暴政机器；相反，我们主张，只有当个人自觉、深刻且有机地融入到国家这一更高阶的共同体之中时，人真正的自由与尊严才能得到充分的实现。国家在这里绝不是单纯的地理疆域，也不是个人意志或物质利益的简单算术叠加，而是一个指向普遍目标的命运共同体，是一个超越过去、现在与未来世代的精神与历史实体。因此，人绝不仅是重商主义体制下的消费者或选民，而是永恒价值的载体，是能够获得拯救或走向沉沦的不朽灵魂。也正因如此，人格具有国家绝不可践踏的绝对尊严，但这种尊严与自由绝非在个体利己主义的无政府状态中，或在摧毁共同生活的冷漠孤立中行使，而是在对整体义务的自愿且严格的履行中行使。以至于，当每个人都意识到自身的至高目标与存在价值同共同体的至高目标不可分割地联系在一起时，个体与集体之间的完美和谐便得以实现；由此超越了消灭人格的集权主义独裁与解构社会的自由主义混乱之间的虚假对立，建立起一种全新的秩序，在这种秩序中，个体对公共福祉的顺从绝不意味着奴役或对自我存在的抹杀，而恰恰是通往其精神升华以及在服务于共同历史命运中获得真正解脱的必由之路。"
 ncar.51.a:0 "为了所有人的未来"
 ncar.52.t:0 "责任"
 ncar.52.d:0 "领袖绝不应当盲从于人民，而是应当服务于人民，这两者有着本质的不同：服务人民意味着将权力的施行导向人民的福祉，全力去争取被统治人民的利益，即使人民自身尚未意识到何为真正适合他们的利益；也就是说，领袖必须时刻感到自己与本民族的历史宿命保持着高度和谐，即便此时此刻的广大群众可能正因欺骗或激情而一时迷失方向，而这就要求领袖绝不能成为大众的傀儡，也不能成为满足大众一时兴起的执行者，因为领袖之位绝非一种民主机制下的授权，亦非单纯代表民意的代理指令，而是一项精神上的崇高公职以及在历史与上帝面前承担的无比沉重的个人责任；正因如此，领袖的权威并不建立在选票的堆砌或一时一刻的好感之上，而是建立在其使命的合法性之上，也正因如此，一位真正的领袖绝不会为了博取欢呼而去讨好或谄媚民众，反而敢于要求民众做出历史伟业所必需的牺牲与严苛努力，因为他深深懂得，领导权绝非某种特权或统治的特权，而是一种极其残酷的奴仆状态与无条件的彻底奉献，在此状态下，领袖成为了祖国命运的第一仆人，一旦遭遇失败，他必须独自用双肩扛起错误的恐怖重担，并在那些至关重要的决断时刻承受绝对的孤独，因为在那个时刻，没有任何委员会或议会能够将他从自身良心的审判以及对国家历史所负有的至高责任中解脱出来。"
 ncar.52.a:0 "并不轻松......"
 ncar.53.t:0 "上帝与祖国"
 ncar.53.d:0 "上帝不是一句爱国口号，也不是国家的神圣附庸，而是万物的始基与终局；在祂面前，一切爱国的主权皆须跪拜俯首，因为爱祖国之所以是一项基督教美德，恰恰在于它从属于上帝，然而若将祖国奉为绝对的神灵，便是最典型的偶像崇拜之罪，必将摧毁信仰的根本实质；因此，如果有一天人世大地的声音企图凌驾于神圣律法之上，真正的信徒应当牢记，对祖国的奉献唯有融入创世的永恒秩序时才具有意义，故而爱上帝胜过爱万物，正意味着爱上帝胜过爱祖国本身，因为祖国是暂时的、会朽坏的，不过是灵魂求得救赎的尘世工具，而上帝的国度才是永恒的，不知人类界限，亦无短暂帝国；一个基督徒绝不可为了盲目的民族主义狂热而置灵魂的救赎或启示的真理于不顾，进而将受造之物神化以取代造物主，因为祖国唯有行进在基督的旗帜之下时，才值得我们奉献生命与鲜血，可一旦它为自己索取唯独属于至高者的至高崇拜，便会沦为魔鬼般的暴政。"
 ncar.53.a:0 "基督吾王万岁！"
 ncar.54.t:0 "精英政治"
 ncar.54.d:0 "没有人比那些自由地放弃自己一部分自由的人更自由。因此，我们的学说是关于放弃的学说。我们的人将牺牲强加于自身，这种牺牲是对自我主宰的体现，也是获得最高尊严的途径：那就是服务。唯有在服务时，人才能获得绝对的自由。唯有当一个人心甘情愿地成为履行一项伟大事业中严丝合缝、纪律严明的齿轮时，他才达到了作为人的完整尊严。服务与牺牲能带来最高品质的愉悦：那是懒惰者、虚荣者和投机分子所永远无法体会的。必须坚持对政党政治的蔑视。整个西班牙都在对那些伪装成救世方案、实则不过是肮脏征兵旗号的东西展现出幻灭感。若要让这个被欺骗过千百次的人民信任我们，首要条件就是对他们说：“我们不是来向你讨要选票的。”要坚持对各政党的蔑视。在整个西班牙推动对政党制度的幻灭感。我们的运动不是一个靠人口奉承来行事的群众性力量，也不是一个选票交易的市场，而是一支精神上的铁军，是一支少数人的先锋队；它不向无知大众的狂热情绪讨好，而是召唤觉醒灵魂的英雄主义责任，因为历史的真理与祖国的普遍命运从来就不是由沉睡的乌合之众所缔造，而是由那些决心将爱与战斗的律法凌驾于个人主义利己心和议会庸俗化之上的少数精英所一手铸就。"
 ncar.54.a:0 "只有强人才能领导国家"
 ncar.55.t:0 "献身"
 ncar.55.d:0 "“死亡万岁！”我们对死亡的崇拜既不是对毁灭的病态沉迷，也不是对虚无的无政府主义渴望，而是对怀揣超越性意义所度过之生命的最高肯定。思考死亡，首先是一种警醒的修行，是一种不断摒除偶然事物、仅保留最核心本质的历练。避而不谈对死亡之沉思的人，注定沦于表面化的生存，散落于日常琐碎的平庸之中，成为从指缝间溜走且不留痕迹之岁月的奴隶。相反，当一个人正视死亡时，生命便获得了英雄主义的张力与神圣的庄严；终局不可避免的存在并未削弱我们行为的价值，反而将其投射至永恒。死亡不再仅仅是一场生物学上的意外，而是转化为一种风格化的举动，转化为对自由接受之命运的最终加冕，以及对自身信念给出见证的决定性形式。那些崇拜死亡的人所热爱的并非空虚，而是牺牲；他们理解，为正义理念所流的鲜血绝非损失，而是种子，且存在着高于自身生理保存的至高价值。现代文明在其对舒适与人工安全感的不懈追求中，试图掩盖死亡，剥夺其悲剧色彩，并将其降格为一道无菌的程序，因为它深知对死亡的记忆会唤醒人类对无限的渴求以及对随波逐流之生存的鄙夷。重申死亡的意义，就是对那种唯物主义式庸俗的反抗，以此确立人的灵魂绝不会满足于日子的单纯延续，而是追求荣誉、职责与光辉的丰盈。由此，对最终归宿的沉思化为一道净化动机的内心烈焰，淬炼着性格，使其能毫无惧色地面对命运，怀揣着一种明确的从容，因为死亡并非精神的终结，而是其跨入永不磨灭之记忆的开端。"
 ncar.55.a:0 "不要害怕，学会拥抱祂"
 ncar.56.t:0 "反威权化"
 ncar.56.d:0 "威权政体并非某种暂时的秩序形式，而是一种政治僵化的制度体系，它必须使集体意识瘫痪，以此证明自身存在的合理性。当一种权力依靠垄断暴力与否定多元主义而建立时，社会便不再是一个活的有机体，而是演变成群被管理的民众，完全仰赖一个无须承担责任的执政当局之任意意志。在这类统治模式中，合法性既不源于民众的同意，也不源于各种观点的公开碰撞，而是源于一种常态化的紧急状态，这种状态将服从变成了公民唯一的义务。威权主义用官僚体制取代了政治，用严密监控取代了公民共处。通过否定各项核心自由——如言论自由、结社自由及有机代表权——该体制并没有解决社会冲突，而是将其沉入一种人工制造的沉默之中，为未来的剧烈爆发积聚能量。个人集权或领袖独裁营造出一种稳定的假象，而这种假象建立在普遍的恐惧以及既得利益阶层的串通配合之上。然而，这种形式上的秩序缺乏历史生命力，因为它压制了国家内部的创造性力量，阻碍了社会制度的自然演进。历史经验表明，企图把一个国家当作军营或营地来治理的企图，最终必然导致公共生活的堕落，将政治退化为政权自身求取生物性生存的手段，并彻底抹杀公民的道德判断与批判能力。"
 ncar.56.a:0 "为了个人自由！"
 ncar.57.t:0 "我们的权利"
 ncar.57.d:0 "个人自由绝非国家赋予的特权，亦非政治权力善意的恩赐，而是人类存在的本体论前提与伦理根基。将个人降格为国家机器上的一枚齿轮，或是集体纪律下被动的服从者，等同于剥夺了社会唯一具备创造力、责任感与尊严的源泉。真正的自由要求个人拥有不可侵犯的内心私密空间、思想自由与自主决定权，在这一空间内，集体意识无权穿透，亦无权发号施令。当国家以保障秩序、安全或国家伟大为借口僭越公民的自由时，它所构建的绝非真正的秩序，而是一种建立在恐吓与彼此不信任基础上的奴役结构。批判性审视力的自由运用、表达异见的可能性以及选择自身命运的权利，并非社会瓦解的因素，而恰恰是社会走向成熟与合法共处的唯一保证。一个建立在残害个人意志与扼杀自由倡议基础上的政治秩序，注定走向不育与停滞，因为一个共同体的伟大程度，从来不由其成员的单一划一或盲目服从来衡量，而是取决于组成该共同体的自由个体所拥有的丰盈、独立与精神财富。"
 ncar.57.a:0 "时刻保持自己的理智"
 ncar.58.t:0 "真正的社会正义？"
 ncar.58.d:0 "绝不能将社会正义理解为国家居高临下的父权式赐予，也不能将其仅仅视为通过分发救济式恩惠来消解阶级冲突、平息工人反抗的维稳工具，因为一旦社会正义被剥夺了自由，它就必然沦为一种镇压机制和官僚假象，使公民沦落为依附于国家机器的被动庇护对象；在我年轻的时候，我曾真诚地相信长枪党的革命能够通过建立一个既超越自由资本主义的利己主义、又超越英法工团主义极权暴政的国家，来实现国家凝聚力与工人阶级救赎的统一，然而西班牙混乱三十年带来的痛苦教训向我证明，真正的社会秩序绝不可能建立在压制那些本应获得尊严的人们的政治权利之上，因为真正的正义需要将公共自由、独立工会以及民主代表权作为不可或缺的前提，唯有如此，工人们才能成为自身命运的真正主宰者，而非官方慈善的被动接受者，因此，社会问题不再是一个简单的财政分配技术问题，而是转化为伦理上的道德命令与人类解放事业，在这里，体面的劳动、获取财富的公平机会以及对政治权力的积极参与构成了一个不可分割的三位一体，一个企图用物质福利换取沉默与服从的国家，建立的根本不是正义，而是在虚假的天主教和法团主义秩序外衣下固化特权寡头统治，这使我们不可避免地得出结论：西班牙的社会变革唯有建立在政治自由与经济公平相互支撑的全面民主之上才是合法与持久的，必须将剥夺的主权归还给人民，并确保人的尊严成为衡量一切集体组织和政治制度的最终尺度。"
 ncar.58.a:0 "长枪党不能带来正义，但我能"
 ncar.59.t:0 "非专制之传统"
 ncar.59.d:0 "关于地方特权的持久生命力以及小家乡面对吞噬一切的中央集权制所表现出的自主性，切不可抱有虚妄的幻想，以为集体自由可以在毫无灵魂的官僚机构试管中萌发，或是诞生于企图用同一把铁尺去衡量各个民族多样灵魂的全能国家的外交官邸之中。地方特权绝非君主的傲慢所恩赐的某种好意，亦非中央权力的任意让步，而是习惯法生动、有机且历经数个世纪的具象化，是岁月在土地深处记忆中沉淀下来的渣滓，是一种早在现代行政虚构产物出现之前就已经存在的生存、工作与情感方式的法律表达。当一个国家以统一和虚幻的理性之名忘却或践踏其地方特权时，它绝非迈向进步或真正的统一，而是盲目地走向人的去个性化，将公民贬低为一个无名的数字，成为一个不知社区生活真正实质的、贪得无厌的国家机器中可替换的齿轮。正如许多受历史与地理恩赐的其他地方一样，真正的加利西亚传统恰恰在于对村庄、教区、地方议会以及古老自由的深厚热爱，正是这些保证了个人在面对专制主义进攻时的尊严，无论这种专制主义是以雅各宾式的君主制形式出现，还是以现代化一统国家的面目示人。小家乡绝不会使精神变得狭隘，反而赋予其最初的深厚根基；它是唯一的肥沃土壤，在这里，自由不再是哲学家们抽象的概念，而是转化为日常的亲身体验，转化为通过血液、语言和不可替代的习俗世代相传的精神财富。"
 ncar.59.a:0 "地方的权利与生俱来！"
 ncar.60.t:0 "自然之灵性"
 ncar.60.d:0 "在我看来，风景的灵魂并不在于山脉外在的雄伟，也不在于海洋的辽阔，而在于自然生命那隐秘的脉动，它显现于刺金雀卑微的花朵里，显现于守护着世纪沉寂的苔藓磐石上，也显现于加利西亚百年橡树间风的低吟中；因为整个自然都浸润着某种神圣的灵性，一种宇宙化而古老的精神力量，向着那些懂得用心灵去倾听、且未被城市虚荣所污染的人，诉说着沉默却又深邃易懂的语言，在这里，大地绝非我们脚下随意践踏的无生命物质，亦非等待开采的资源，而是一个活生生的有机体、一种神圣的存在和一个活着的殿堂，其中从最不起眼的昆虫到森林深处最肃穆的阴影，每一个生灵都参与到这场共同的奥秘与永恒的礼拜之中，在超越性的和谐里赞美存在，从而启示我们：荒野之人的真正虔诚并非诞生于人类的教条或形式化的结构，而是源于这种与晨光、与傍晚笼罩山谷的薄雾、以及与那既提醒着我们的渺小又宣告着我们与缔造宇宙之整体密不可分的繁星夜空之间，最亲密而直接的灵性融合。"
 ncar.60.a:0 "甜美的气息就是我所憧憬的未来"
 ncar.61.t:0 "生命之美"
 ncar.61.d:0 "生存绝不仅是时间在年轮上的机械流逝，亦非这片大地上一场偶然发生的技术性生物事件，而是一种极度神圣且令人敬畏的体验，它要求我们对每一次呼吸都保持极致的专注与沉思，因为生命在其最纯粹的显现中，包裹着一种静默无声的神秘主义，它存在于与自然的深深和谐之中，存在于面对“此刻在场”这一奇迹时所迸发出的日常惊叹里；然而，沉沦于庸俗生存的喧嚣与盲目奔波中的人们，往往遗忘了大地真正的灵魂正在树林间的风声低语中、在山谷的宁静以及那品味瞬息即逝之美感的凝视中跳动，真正的智慧并不在于知识的堆砌或对虚幻财富的征服，而在于能够敏锐地感知到我们肉身的有限性与承载我们的宇宙之无限性之间那份不可言说的秘密相通；这种生命神秘主义既不源于逃避现世，亦非脱离红尘的苦修，而是源于对日常生活中那古老而本真之谜团的完全沉浸与欢欣拥抱，在此状态下，即便是最卑微的事物——从沉寂的磐石到黄昏里掠过的鸟影——都会化作一座座透明的圣殿，映照出隐匿于可见物背后的超越性，进而将尘世间的一生转化为对孕育万物的永恒力量所怀有的无尽感恩、内心信仰与不可言喻的神圣共融。"
 ncar.61.a:0 "敬畏自然"
 ncar.62.t:0 "灭杀资本"
 ncar.62.d:0 "民族革命在经济维度上，是一场针对大企业资本暴政以及将工人奴役于非人性化工资制度下的资产阶级秩序的坚决而无情的斗争。我们对资本主义的抗议并非源于纯粹的物质不满，也不是源于马克思主义煽动所滋生的阶级嫉妒，而是源于一种深刻的必要性：必须将尊严还给人类、还给创造者、还给那些如今正被金融利息与寄生性投机重压所粉碎的生产者。资本主义在其颓废与自由主义阶段，将集体至高无上的命运隶属于掌控生产资料和信贷流向的少数寡头集团的私人自私心理，从而将祖国撕裂得粉碎。这一无国界的体制只承认高利贷利润，除了商品之外不承认任何价值，剥夺了工人与农民劳动应得的正当果实，并将国家经济变成了国际大财团掠夺的场所。面对这种制度性的不公，我们绝不接受资产阶级国家的妥协苟安，该国家在议会民主的虚假面具下，充当的仅仅是财阀特权的警卫与保护者。我们同样不接受马克思主义的唯物主义解决方案，因为它企图用国家官僚暴政与阶级斗争来取代资本暴政，从而摧毁了国家的精神统一。真正的社会正义要求通过构建国家工团主义国家，彻底清算高利贷资本主义制度，使经济服从于人民与祖国的服务。这意味着充公大型垄断企业、对信贷实行国家管制以及破产投机金融，将生产的集中所有权与直接管理权交还给组织在垂直工会中的生产者自身。土地绝不应成为不在地主获取地租的工具，而应是双手耕作者的神圣财产；同样，工厂必须停止成为抽取剩余价值的机器，转变为一个让工人重获自由人身份并融合于国家命运的劳动共同体。经济必须在公共利益的敕令下受到严格计划与纪律约束，从根本上铲除寄生性中介、非法利润以及人对人的剥削。在饥饿与人类尊严受制于金钱发号施令的地方，就不存在真正的祖国；因此，摧毁资本主义不仅是一项经济命令，更是一项道德要求与至高无上的爱国义务，在国家重建的时刻，任何有觉悟的西班牙人都绝不能放弃这一责任。"
 ncar.62.a:0 "资本是浑身流淌着鲜血的恶魔"
 ncar.63.t:0 "劳动者的尊严"
 ncar.63.d:0 "为了给统一赋予人的温情，为了让这种统一在每一个角落都能被真切感受到并得到祝福，我们必须学会宽恕。最重要的是去宽恕。同志们，在监狱里有着成千上万承受牢狱之苦的人。这究竟是为什么？仅仅是因为他们曾经属于某个政党或者某个工会。在这些人当中，有许多人是正直勤劳的劳动者，只要我们付出些许努力，给予一丝关怀，就能让他们重新融入我们的运动之中。同志们，我们必须胸怀宽广。我们必须拥有伟大的灵魂，并懂得去宽恕。我们现在是强大的，因而我们能够负担得起这份慷慨。我在此请求当局重新审查案件卷宗并减轻刑罚。我们的革命绝非某种阶级报复，亦非军事专制独裁，而是一场由人民发起、为了人民的真正社会变革；在这场变革中，工人阶级的正义以及每一位农民和劳动者的公民尊严，绝不能被出卖给胜利的寡头利益集团，也不能屈服于任意施加的恐怖手段，因为祖国最根本的价值，完全依托于那些用汗水支撑起它的广大人民群众。"
 ncar.63.a:0 "我们是劳动者，我们为正义奋斗"
 ncar.64.t:0 "驱动暴力"
 ncar.64.d:0 "我要对那些在各城市、尤其是各村镇负责政治与警务调查的长枪党同志们说：你们的使命应当是做所有遭受苦难者的守护者与兄弟，哪怕他们的兄弟或父亲曾经或现在处于敌对阵营。承受苦难始终是具有人性且值得尊重的事。你们必须以最高度的警惕来防止任何人借机发泄个人仇恨，防止任何人因他人不幸走入歧途或因曾渴望面包与正义而对其惩罚或侮辱。拯救而非毁灭那些绝大多数曾饥渴于面包与正义的人，才是属于我们的责任，况且你们也已从我们组织的壮大中看到，他们同样饥渴于祖国。必须以毫不留情的残忍手段去追捕那些地方权贵、利己主义者以及曾剥削人民而如今却企图躲进我们旗帜庇护之下以继续靠穷人的悲惨生活为生的人；无论你们身在何处，都要果断地准备好站出来，坚决反对针对底层平民采取的暴力或不人道手段，因为他们作为西班牙人且受过苦难，就是我们的兄弟。"
 ncar.64.a:0 "挥舞你的拳头"
 ncar.65.t:0 "生产者权力"
 ncar.65.d:0 "西班牙的同志们以及祖国全体劳动者们，我借助麦克风的发声向你们彻底阐明西班牙长枪党的真实教义，以及我们在这场对抗工团主义暴民的残酷斗争中赋予我们武器胜利的历史使命。我们的革命绝非一次单纯的军事震荡，也决不是要恢复过时的阶级特权，或是维持几代人以来一直绞杀西班牙劳动者生活的金融与工业资本主义的旧有结构。长枪党的诞生是为了还给西班牙人以失落的尊严，而只要劳动还被视为一种受制于供求冷酷规律或资金投机者变幻莫测之意图的普通商品，这种尊严就绝不可能存在。我们断然宣告，资本主义无论是在银行、农业还是工业形态上，都已经在其人性与社会使命方面归于失败，必须在我们正在用阵亡者鲜血塑造的新西班牙中被永远解构。面对资本的独裁以及摧毁祖国并消灭个人的共产主义国家的暴政，长枪党宣告劳动的主权，并主张将经济权力彻底移交给国家财富的真正创造者。权力必须完全属于生产者，他们将和谐地融入垂直且具备法人性质的工会中，由这些工会承担起国家生产的领导、管理与行政工作，确保集体努力的收益完整地回归社会以及用汗水和才能支撑社会的劳动者。我们所说的生产者，绝不仅仅指工厂里的体力工人或耕作土地的农民，而是指使创造性工作成为可能的所有要素的不可分割的结合体：包括工人、技术人员、手工业者，以及将其管理能力置于公共利益而非自私利润服务之下的富有进取心的企业主。在我们关于社会正义的理念中，绝不容许银行、农村或工业领域的寄生虫和地方霸头有任何立足之地，因为在新西班牙将只有一种贵族，那就是劳动的贵族；也将只有一种阶级，那就是觉悟到自己祖国责任的西班牙人阶级。我们张开双臂向曾被共产主义煽动和阶级仇恨的虚假先知所蒙蔽的工人与农民发出热烈呼吁，告诉他们长枪党才是他们真正的归宿和实现社会解放的唯一合法工具。我们向他们保证，我们战斗绝不是为了恢复封建寡头或投机资本的统治，而是为了建成一个国家工团主义国家，在这个国家里，私有财产受制于集体利益，信贷被国有化并用于服务大众信贷，生产的剩余价值不再用来滋养少数人的奢靡，而是用来保障所有劳动者家庭的尊严、面包与安全。我们希望劳动者们深刻认识到，祖国绝不是权贵者的封地，而是全体生产者共同的资产，只有通过自下而上组织起来的工团主义组织，才能实现既粉碎毁灭性资本主义又粉碎无神论唯物主义的真正社会民主。这是长枪党对西班牙青年和人民的神圣许诺，是一项关于正义、面包与祖国的许诺，我们将无情地捍卫这一承诺，直至根除任何背叛我们运动之革命本质的企图。"
 ncar.65.a:0 "捍卫劳动的美德"
 ncar.66.t:0 "奔赴未来"
 ncar.66.d:0 "对我们而言，未来主义绝非仅仅是一个艺术流派或前卫的审美品味，而是一个正在兴起的、反抗旧形式窒息感的新精神的直觉与猛烈体现。它代表着与停滞不前、对过去的迷信崇拜，以及那种宁愿要停滞的舒适也不愿要冒险的震颤的颓废资产阶级心态的彻底决裂。当代时代再也不能用19世纪的尺度来衡量；机器、速度、被释放的能量以及运动中的大众，已经不可逆转地重塑了现实的结构。未来主义直觉的真正价值在于，它理解了技术与动态性不仅仅是简单的物质工具，而是某种新型人类的塑造要素一种融入行动之中、大胆无畏、摆脱了颓废理性主义偏见，并准备将自身意志贯彻于混沌之中的新人类。我们接近未来主义，不是为了崇拜某种文学或造型主张，而是为了继承其生命叛逆感的重任、对青年的高歌、对英雄主义奋斗的崇拜，以及对意志塑造历史之能力的盲目信仰。未来不属于沉思者，不属于在昨天的废墟上哭泣的忧郁者，也不属于企图将生活圈禁在教条框架内的咖啡馆理论家；未来属于行动者，属于那些捕获了当下狂热节奏、并以不可阻挡的冲劲将能量投向前方的人，他们接纳速度、斗争以及现代性的变革力量，将其视为未来历史真正的杠杆。"
 ncar.66.a:0 "速度万岁！"
 ncar.67.t:0 "精密仪器"
 ncar.67.d:0 "彻底超越衰败的议会制度，既不能依靠仅仅以一些政党取代另一些政党，也不能依靠对选举技术的简单改进，而必须依赖对国家观念及权力运行方式的根本性变革。现代国家绝不能继续作为一个满足私人欲望的集市，或是供煽动家进行徒劳争吵的舞台；它必须成为一个具备技术性、高效且结构严密的实体，在其中，真正的才能与专业知识将彻底取代民主式的流于形式的虚妄空谈。面对自由主义议会制天然存在的低效——该制度将国家的命运屈从于公众舆论的波动和政党间的妥协勾心斗角，迫切需要对公共事务实行技术官僚化与有机化的管理。领导权决不应属于那些擅长通过无法实现的许诺或空洞修辞来诱惑大众的人，而必须属于那些具备掌控当代生产、经济和行政等复杂机制所不可或缺的技术能力、科学纪律与专业严谨度的人。一个高效的政府要求在国家生活的各个领域拥有技术人员、工程师、经济学家和专家的参与，这些人员有能力客观地分析问题，并在不受选举妥协束缚的前提下实施精准的解决方案。技术并非仅仅是从属于传统政治的工具，而是主导新型国家结构建设的核心组织力量，它将旧有的煽动性政治转化为一门真正为国家最高利益服务的行政与生产科学。"
 ncar.67.a:0 "效率是种美德"
 ncar.68.t:0 "军团士兵"
 ncar.68.d:0 "军团精神的神秘意涵绝非仅仅是一种外在的纪律，亦非为了维持队伍中的形式秩序而制定的简单规章制度，而是拥抱绝对牺牲作为最高行为准则的士兵在心灵深处所经历的彻底升华。作为一种行动与职责之宗教而构想的军团精神，要求彻底摒弃个人主义与自私心，向祖国和战友进行毫无保留的无条件奉献。这不仅意味着在战斗召唤响起时以暂时的勇敢做出回应，更是将死亡不再视为一种应当躲避或害怕的偶然风险，而是作为一种应当以平静的喜悦和骑士般的自豪去接受的高贵且必然的宿命。这种在痛苦、严苛与持续危险的熔炉中锻造出的军团信条，将军团战士塑造为脱离物质束缚与日常琐碎的精神个体，将其提升至一种全新的精神境界——在这里，至死不渝的忠诚、生死相托乃至为战友献出生命的同胞之谊，以及对上级盲目、快乐且毫无怨言的服从，共同构成了生命本身不可动摇的支柱。军团的纪律并非源于对惩罚的恐惧，而是源于对职责的热爱和对荣誉的崇尚；这种至高无上的荣誉感驱使着他们永远去争取最危险的阵地，在冲锋时冲锋在前，在撤退时断后掩护，决不在战场上抛弃任何一名负伤或阵亡的战友，并以挑衅般的微笑直面一切逆境。正是这种英勇而浪漫的精神息吹，将这支军队凝聚为一个不可分割的兄弟会，在这里，每个人的过去都在当下的伟业面前被抹去，对军团信条的承诺升华为一种绝不容许温吞、犹豫或向气馁妥协的永久信仰声明，从而构成了当肉体衰竭、人类理性似乎在劝导放弃时，依然能支撑士兵继续战斗的无敌精神力量。"
 ncar.68.a:0 "长枪党人的荣誉"
 ncar.69.t:0 "打倒资产阶级"
 ncar.69.d:0 "我们的革命，即国家工团主义革命，绝不是为了巩固统治阶级的特权而发起的，也不是为了充当那个利己、寄生且无能的资产阶级的避风港，这个资产阶级数十年来一直在剥削西班牙人民的汗水，却从未承担过丝毫的爱国责任或社会责任；西班牙资产阶级对劳动群众的需求盲目无视，对西班牙的历史命运同样视而不见，他们错误地以为我们取得胜利的运动只不过是一次旨在恢复他们古老而绝不公正的阶级特权、无限制的经济统治以及金钱利己主义的警察行动，但我们在此以绝对明确的态度明确告诫他们，他们彻底错了，因为长枪党绝不是资本的保镖，也不是雇主的镇压工具，而是一支革命力量，旨在从根本上铲除既摧毁祖国的唯物主义马克思主义，又腐蚀国家灵魂并剥夺生产者人类尊严的资产阶级资本主义，要知道自由资本主义恰恰就是马克思主义的亲生父亲，因为当它把人降格为受供求关系支配的单纯商品，当它把财富堆积在贪得无厌的金融寡头手中，当它把所有权与社会职能剥离开来时，它就创造了滋生阶级斗争的温床，而这种阶级斗争几乎毁灭了西班牙，因此，企图通过保留产生马克思主义的资产阶级经济结构来从马克思主义手中拯救祖国是一种不可容忍的荒谬，必须宣布所有权绝不是供个人随意享用的绝对和无限制的权利，而是一个服从于公共利益并为国家共同体服务的制度，在这一制度下，经济必须受到严格的统制并服从于国家与社会正义的最高利益，永远消灭那种以金融利润、高利贷投机和会计收益来衡量一切的资产阶级精神，取而代之的是劳动、牺牲与生产者友爱的伦理，因为在新的西班牙，绝不会给游手好闲的食利者或把生产视为纯粹私人买卖的投机商留有生存空间，企业将被构想为一个由生产者组成的充满人情味与爱国情怀的共同体，在这个共同体中，资本是生产的工具而非生产的主人，工人不再是被剥削的雇佣者或工资的奴隶，而是全国工团中积极且有尊严的一员，是经济的主体和国家重建伟业的直接参与者，我们严厉警告那个企图破坏我们垂直工团组建或在爱国主义伪装下延续社会不公的反动资产阶级，革命绝不会在他们的卑劣利益面前停下脚步，因为如果为了拯救西班牙并恢复其劳动者的尊严必须粉碎资产阶级寡头的妄想，长枪党和工团组织将毫不犹豫地这样做，将社会工团主义秩序凌驾于财阀的抵抗之上，因为祖国绝不是银行家和大地产主利润的叠加，而是所有融入其工团以及人民主权国家之中的西班牙人命运的统一体。"
 ncar.69.a:0 "西班牙是无产者的国家"
 ncar.70.t:0 "工会国家"
 ncar.70.d:0 "垂直工会并非单纯为了维护阶级利益而设立的工人组织，也不是为了维持经济特权而构想的雇主实体，而是国家共同体以此彻底超越阶级斗争、实现真正社会正义的有机、伦理与政治工具。将人类劳动降格为受供求关系支配的普通商品的自由主义劳动观，与煽动生产要素之间同胞相残式仇恨的马克思主义观点，不过是分崩离析国家并使人类失去人性这一同一唯物主义硬币的两面；面对这种无序状态，垂直工会主义并不将生产视为战场，而是将其视为一项共同事业，在其中资本、技术与劳动在国家工团主义的最高领导下整合为一个有机的层级体系。在此秩序下，企业既不绝对属于资本家，工人也并非毫无话语权与命运的纯粹雇佣劳动者；双方均为国家共同体服务的生产人员，由不可破裂的团结纽带紧密相连。垂直工会涵盖了同一生产部门内经济过程的所有参与者，从普通工人到企业主，均被纳入公法实体之中，以保障劳动者的尊严、劳动报酬的公正、对企业生活的参与，以及经济向国家最高目标的服从。因此，这并非为了扼杀个人主动性而强加的国家官僚机构，而是人民在生产任务中组织起来的活生生的结构化形式，其中劳动被提升为公民身份的最高凭证与不可争议的道德义务。超越投机资本主义与集权共产主义，要求建立一种经济完全人性化并导向共同福祉的模型，确保财富本身既不是目的，也不是统治的工具，而是保障所有人面包、祖国与正义的手段。"
 ncar.70.a:0 "工人权益的捍卫者"
 ncar.71.t:0 "伪善者必入地狱"
 ncar.71.d:0 "资产阶级所谓的“阶级和睦”教条，只不过是一种精致的伪善，旨在借口人为营造的社会和平主义，来神圣化资本主义剥削的现状。在经济的自由主义结构中，妄想资本与劳动能够通过自愿契约或资产阶级国家的麻醉性调解而在田园诗般的和谐中共存，这既是一种形而上学的虚假，也是一场历史性的骗局。所谓的阶级和睦要求无产阶级对不公做出绝对的屈服，要求他们接受自己作为去人性化商品的处境，以此换取一种缺乏正义的社会和平。国家工团主义坚决反对这种谬论，因为我们所追求的绝不是两种不可调和的自私心理之间的和解——即雇主以牺牲他人悲惨生活为代价寻求最大利润的自私，与工人以系统的阶级斗争仇恨所作出的反抗自私——而是要彻底根除引发这种对抗的重商主义制度本身。阶级和睦绝非解决方案，而是一种延续雇佣奴役的缓和剂；它并没有消除阶级斗争，而只是暂时将其催眠，以便资本主义能够继续吞噬祖国和生产者的尊严。面对这种懦弱的妥协，国家工团主义国家绝不扮演一个姑息经济失衡的所谓中立仲裁者，而是作为一个至高无上且不可分割的力量，将劳动与资本整合进企业的有机共同体之中，剥夺金钱的暴政主权，并还给工人以道德和经济主体的地位。要超越社会冲突，绝不可能通过维持金融寡头特权完整无缺的资产阶级和睦道路来实现，而必须通过彻底摧毁自由主义的劳动观念，建构一门服从于国家共同命运的经济体系；在这个体系中，劳动将成为社会合法性的唯一凭证，而共同体正义将永远取代剩余价值的勒索与欺骗性社会和平的镇压式乌托邦。"
 ncar.71.a:0 "一定要消灭资产阶级所遗留的影响"
 ncar.72.t:0 "你他妈在干什么？"
 ncar.72.d:0 "我早就警告过你不要让地方自治度过高，你是不是没有注意到提示？现在西班牙再一次陷入了分裂，地方自治的实验彻底失败了"
 ncar.72.a:0 "完蛋了"
 ncar.73.t:0 "西班牙要求统一"
 ncar.73.d:0 "西班牙发来了一份电报，要求和我们统一，如果我们同意要求西班牙就会吞并我们，葡萄牙将作为自治体继续存在于伊比利亚之中。"
 ncar.73.a:0 "行吧"
 ncar.73.b:0 "我拒绝"
 ncar.74.t:0 "葡萄牙拒绝"
 ncar.74.d:0 "葡萄牙拒绝了我们的统一请求，我们尝试和平统一伊比利亚的愿景失败了，毕竟葡萄牙还算是我们的盟友，我们不能使用武力强行统一。"
 ncar.74.a:0 "行吧"
 ncar.75.t:0 "西班牙索要摩洛哥"
 ncar.75.d:0 "西班牙对摩洛哥宣称由来已久，在十几年前他们就为了彻底征服里夫而发动了战争，摩洛哥王国也参与了里夫战争，现在他们又一次宣称摩洛哥地区，但现在这块地处于我们的保护之中，他们想要摩洛哥可没那么容易。"
 ncar.75.a:0 "我才懒得管北非那堆沙子，让他们自己去处理吧"
 ncar.75.b:0 "摩洛哥永远处于我们的保护之中"
 ncar.76.t:0 "德意志放弃摩洛哥"
 ncar.76.d:0 "德意志帝国近期撤走了在摩洛哥的驻军，摩洛哥各地陷入了混乱之中，我们可以趁此时机跨过海峡进攻摩洛哥，彻底打通与法兰西流亡政府的陆上通道，将援助送到阿尔及尔。"
 ncar.76.a:0 "太好了"
 ncar.77.t:0 "德意志对摩洛哥实施保护"
 ncar.77.d:0 "显然德意志帝国不愿意放弃任何一块土地的宣称，他们在摩洛哥地区加强了驻军，现在想征服摩洛哥可没那么容易，而且很有可能招致德意志帝国对我们的惩罚，我们必须掂量掂量自己有没有那么大的实力去正面对抗德意志霸权。"
 ncar.77.a:0 "算了吧，阿尔及尔的事务也没有那么要紧"
 ncar.77.b:0 "我是不会放弃摩洛哥的"
 ncar.78.t:0 "分裂势力叛乱！"
 ncar.78.d:0 "马德里正深陷社会主义暴动的火海，工厂空无一人，街头成为国民警卫队与工人社会党武装分子、劳工总联盟工会主义者交战的战场。在阿斯图里亚斯等广大农村地区，全国劳工联盟和伊比利亚无政府主义联合会不断发动小规模叛乱，无政府主义者以游击战术袭击庄园和警察局。国王及其在人民行动和军队中的盟友已调遣部队镇压骚乱，但这些部队被谨慎使用，以防应征士兵与暴乱者合流。狡诈的共和派甚至在尚未爆发激进骚乱的地区也组织了抗议活动。而在海外领土，尤其是摩洛哥沿海地区，阴险的摩洛哥人向边境派遣了煽动者和破坏分子，激起了当地人的疯狂情绪。由于担心摩洛哥叛乱，军方始终不敢将效忠王室的西班牙外籍军团调回本土，但随着局势恶化，外籍军团终于抵达半岛。尽管西班牙当前处境危急，但君主派在选举后采取的紧急措施似乎初见成效，社会主义者与共和派已分裂为起义阵营和承认人民行动民主授权的温和派。\n\n然而混乱中的中央政府并未察觉巴斯克、加泰罗尼亚和加利西亚这三个少数民族地区的异常沉寂。随着突如其来的宣言，三地公开谴责君主制及其军事盟友的中央集权政策，宣称西班牙已倒退至反动深渊，为滋养卡斯蒂利亚不惜践踏各族群权利。尽管承诺累累，少数民族的自治权始终未能全面落实。如今巴斯克人、加泰罗尼亚人与加利西亚人决定团结一致，正式脱离垂死的卡斯蒂利亚帝国及其对主权民族的沙文主义统治。这三个分离主义政权呼吁西班牙其他民族把握时机，彻底挣脱波旁王朝暴君的枷锁。疲于应对内乱的中央政府无力应对新威胁，驻守地方的国民警卫队部队暂时从民族主义区域撤离。而里夫地区仅剩巴雷拉将军指挥的小股卫戍部队，在半岛危机解决前，这位将军只能独自周旋。"
 ncar.78.a:0 "撤退，我们一定会回来的！"
 ncar.78.b:0 "巴斯克万岁！"
 ncar.78.c:0 "加泰罗尼亚万岁！"
 ncar.78.e:0 "加利西亚万岁！"
 ncar.78.f:0 "快离开这该死的半岛，去里夫！"
 ncar.79.t:0 "卡洛斯西班牙路线指南"
 ncar.79.d:0 "事先申明：因为我对怎么制作一条工业军事路线一窍不通，所以暂且借用了西班牙王国的。内战爆发后请给部队的编制进行更换，不然内战结束后所有部队都会被解散。\n\n传统主义团契？\n完成初始内容后选择加冕哈维尔一世或者卡洛斯八世即可，然后给左翼表决权，让摄政议会青睐右翼。\n\n传统主义左翼？\n同上，给左翼表决权，让摄政议会青睐左翼。\n\n青年团？\n不给左翼表决权，然后左翼就会叛乱，青年团会镇压叛乱。\n\n西班牙长枪党？\n赦免政治犯，然后信任长枪党，青年团镇压左翼之后长枪党就会上台。"
 ncar.79.a:0 "知道了"
 ncar.80.t:0 "真王回归！"
 ncar.80.d:0 "摄政王唐·哈维尔殿下以从维也纳归来，正式担任传统主义团契的领袖！"
 ncar.80.a:0 "基督吾王万岁！"
 ncar.81.t:0 "西班牙要求与我们合并"
 ncar.81.d:0 "西班牙发来了一份电报，要求和我们统一，如果我们同意要求西班牙就会吞并我们，法兰西将作为自治体继续存在于统一的拉丁联邦之中。"
 ncar.81.a:0 "行吧"
 ncar.81.b:0 "我拒绝"
 ncar.82.t:0 "西班牙要求与我们合并"
 ncar.82.d:0 "西班牙发来了一份电报，要求和我们统一，如果我们同意要求西班牙就会吞并我们，两西西里将作为自治体继续存在于统一的拉丁联邦之中。"
 ncar.82.a:0 "行吧"
 ncar.82.b:0 "我拒绝"
 ncar.83.t:0 "西班牙要求与我们合并"
 ncar.83.d:0 "西班牙发来了一份电报，要求和我们统一，如果我们同意要求西班牙就会吞并我们，奥地利将作为自治体继续存在于统一的拉丁联邦之中。"
 ncar.83.a:0 "行吧"
 ncar.83.b:0 "我拒绝"
 ncar.84.t:0 "统一拉丁西欧"
 ncar.84.d:0 "自西罗马帝国倒塌在蛮族铁蹄之下陷入长达千年的分裂以来，西欧的拉丁众兄弟从未像今日这般重归一体。昔日，拿破仑·波拿巴也曾试图用炮火强行缝合这片大陆，但他统一西欧的狂妄野心最终在加的斯的坚城与那不勒斯顽强的抵抗者面前折戟沉沙。\n\n而如今，来自波旁-帕尔马家族的正统君主自马德里高调出师，一路上所向披靡，将巴黎与罗马相继收入囊中。西欧千年来支离破碎的乱局终于迎来了终结，千百万民众在统一的旗帜下举臂欢呼。尽管仍有一些负隅顽抗的异见分子试图否定我们的丰功伟业，但在大势面前，他们的螳臂当车注定无济于事。数十年来赤匪施加于西欧大地上的暴政与阴霾已被彻底扫清，我们再次将正统文明的光明洒满了这片土地。\n\n西班牙、法兰西与意大利都曾是波旁王朝的一份子，法兰西的波旁王室虽在当年的大革命狂潮中覆灭、王室成员被永久剥夺入境权，且世界大战的惨败迫使抵抗赤匪的法兰西忠诚战士们远遁阿尔及尔，尽管流亡政府随后废除了《流放法》，但波旁家族在法兰西本土的影响力早已十不存一；至于西西里的波旁王室，则在当年意大利统一运动的浪潮中土崩瓦解，成员流亡海外，即便后来在意大利王国崩溃时重返西西里，其权力也早已被各方势力蚕食架空。唯有西班牙的波旁-帕尔马分支，历经风雨依然屹立不倒，成为了波旁家族中唯一保留了实质影响力的正统血脉。因此，他们顺理成章地肩负起了领导整个拉丁西欧兄弟民族的重任。\n\n自西罗马帝国倾覆千年之后，我们终于亲手结束了拉丁同胞之间漫长的分裂。然而，在辉煌的胜利面前，一个新的抉择已摆在面前：究竟是全面继承并恢复西罗马帝国的正统法统，还是建立一个全新的拉丁帝国？"
 ncar.84.a:0 "西罗马重归于世！"
 ncar.84.b:0 "罗马帝国早已是一具枯骨，拉丁万岁！"
 ncar.85.t:0 "臣服或者死"
 ncar.85.d:0 "西班牙发来了一份电报，要求和我们统一，如果我们同意要求西班牙就会吞并我们，里夫将作为自治体继续存在于统一的西班牙王国之中。"
 ncar.85.a:0 "行吧"
 ncar.85.b:0 "我拒绝"
 ncar.86.t:0 "埃兹基奥加显圣事件的余波"
 ncar.86.d:0 "1931年6月29日，坐落于巴斯克地区吉普斯夸省的小村庄埃兹基奥加迎来了一场震撼整个伊比利亚半岛的狂热风暴，当地两名纯真的儿童在村庄暮色苍茫的山坡上声称目睹了圣母玛利亚的圣容，这道讯息如野火般迅速燎原，在接下来的几个月中引得成百上千的朝圣者与猎奇者如潮水般涌入这片原本寂静的山野。在显圣传闻最鼎盛的狂热高峰期，自称曾亲眼见证圣母或圣徒降临的目击者竟多达数百人之众，当年奔赴此地的朝圣人数更是呈几何级数暴增，累计竟达到了约百万人次之巨。那时的朝圣现场终日弥漫着近乎歇斯底里的强烈宗教情绪，无数信徒在狂热中颤抖，许多见证者甚至绘声绘色地描述着耀眼的眩目光芒、剧烈的身体抽搐，以及伴随神圣震撼而来的深度昏厥与莫名流血。尽管罗马教廷在经过审慎调查后，最终将这场席卷全国的风波定性为彻头彻尾的虚假谣言与集体癔症，严正宣告在埃兹基奥加未曾发现任何超自然神迹，并对相关谎言与狂热活动进行了取缔和冷处理，但狂热的信众并未就此退散。在这些执迷不悟的追随者眼中，只有灵魂足够纯洁、信仰足够虔诚的人方能窥见神迹的真容，而安东尼奥·阿穆达兰便是其中的代表。阿穆达兰近乎偏执地坚信埃兹基奥加的显圣乃是整个西班牙在动荡岁月中献给上帝最庄重、最神圣的赎罪行为，慈悲的圣母绝不可能抛弃饱受苦难的西班牙子民。为此，他顶住教会的压力，每日雷打不动地带领着数百乃至数千名最忠诚、最狂热的信徒徒步前往埃兹基奥加顶礼朝拜。尽管这位老迈的狂热者在威压之下最终名义上服从了教会的最终训令不再公开对抗，但在隐秘的岁月中，他依然日复一日地喃喃念叨着耶稣再度降世的晦涩谶言，双眼狂热而空洞地死死凝视着天穹，在无尽的疯魔与虔诚中执着地等待着那终将降临的末世审判。"
 ncar.86.a:0 "一个疯子神父的胡言乱语罢了"
 ncar.86.b:0 "也许他是对的呢......"
 ncar.87.t:0 "狂喜之日"
 ncar.87.d:0 "§R耶和华已借由阿穆达兰之身降临世间！§!\n\n在那个最终临到的耶和华的大日子里，天地万物都将迎来彻底的震动与清算，灾难的起头伴随着假伪与战乱的风声，民要攻打民，国要攻打国，多处必有饥荒与可怕的地震，这便是前所未有的大灾难的降临。日月星辰的秩序瞬间瓦解，日光变黑如粗糙的黑毛布，满月变红如滚烫的鲜血，天上的群星纷纷坠落于地，如同冰雹与狂风中的无花果树被摇落未熟的果子一般。天就此挪移，好像书卷被卷起来，地全然破坏，尽都崩裂，大大地震动，东倒西歪如醉酒之人，摇摇欲坠如风中的小屋。山岭与海岛都被强行挪移离开本位，海水的三分之一甚至全部化为粘稠的死人血，海中的一切活物尽都死亡，江河与众水的水泉皆变为极苦的苦胆与毒药。随着审判的号角与盛满神大怒的七碗依次倒下，太阳被赋予发热烤人的剧烈毒焰，全地笼罩在极度的黑暗与痛苦之中，前所未有的剧烈地震伴随着重达一他连得的巨型雹子从天砸落，将地上的城池与国度的荣耀悉数砸碎。随后，哈米吉多顿的大决战爆发，敌基督、假先知与地上的众王联合聚拢，但在天军与万王之王降临的烈焰与口中的利剑面前瞬间溃败，邪恶的势力被生擒并活活扔进烧着硫磺的火湖之中。紧接着，白色的大宝座显现，坐在上面的主发怒发威，天地在他面前彻底逃避，再无可见之处，旧的宇宙与空间归于虚无与蒸发。有形质的万物都要被烈火彻底销化，天必有大响声废去，地和其上的物都要被彻底烧尽，主从地上除灭万物，无论是人、牲畜、空中的鸟还是海里的鱼，全都无处可逃，一切的金银与财富在神发怒的日子都不能拯救他们，全地尽被公义的愤怒之火吞灭，旧的物质、罪恶与死亡在这场宇宙级的终极熔炼中彻底荡然无存。"
 ncar.87.a:0 "“从祂面前天地都逃避，再无可见之处了。”"
 carnewsevent.1.t:0 "左翼在西班牙上台"
 carnewsevent.1.d:0 "外界向来将西班牙的传统主义团契视为欧洲最坚固的专制壁垒。几乎所有人都以为，他们对天主教的神圣狂热与对君主制事业的绝对忠诚，注定让其永远锚定在极右翼的政治光谱中。然而，现实却狠狠打击了所有人的固有认知。在近期召开的西班牙摄政议会中，团契内部的左翼派系发动攻势一举击败传统右翼势力，彻底接管政权。这是左翼阵营首次在一个君主制国家中，合法且全面地掌握了决定国家命运的至高话语权。"
 carnewsevent.1.a:0 "君主制和社会主义？"
 carnewsevent.2.t:0 "王国反政变"
 carnewsevent.2.d:0 "随着忠于国王的军警部队迅速介入并彻底瓦解了一场秘密发动的武装暴动。据悉，此次政变企图源于传统主义团契内部长期积累的派系矛盾。作为党内的左翼阵营，该派系长期遭受领导层的边缘化与打压。在近日关于摄政议会表决权的最后一次合法提案遭到右翼领导层否决后，心怀不满的左翼激进分子最终决定铤而走险，试图通过暴力手段推翻党内高层。然而，密谋在初期即告败露。政府军队与王室卫队反应迅速，事发当天便解决了左翼的暴乱。西班牙当局表示目前布尔戈斯及周边地区的交通与社会秩序已完全恢复正常。"
 carnewsevent.2.a:0 "君主制得救了"
 carnewsevent.3.t:0 "长枪党政变"
 carnewsevent.3.d:0 "在平息左翼政变的余波未尽社会秩序仍处于动荡之际，一个自称西班牙长枪党的新兴政治与军事势力在西班牙登台。该组织趁执政当局尚未完全稳固控制力迅速接管了全国各地的军事力量，一举推翻了长期掌权的传统主义团契。随着这一剧变的发生，西班牙的君主制继第二共和国风波数年后再次宣告覆灭。长枪党随后发表全国广播演讲正式建立新政权，并宣称将在全国范围内全面推行“国家主义革命”。这一激进的政局突变迅速引发了协约国的高度关注，加拿大政府对该党派所显露出的亲左翼倾向与极端国家主义立场表达了强烈担忧。"
