 QIE_Wu_Peifu_C:0 "吴佩孚"
 QIE_Wu_Peifu_D:0 "§L吴佩孚生于一个山东商人家庭，在考上保定军校之后，他很快就在北洋新军之中脱颖而出。\n当新生的中华民国于1916年崩溃后，他站在了直系冯国璋的一侧，并在1919年冯国璋死后成为了直系军阀实质上的领袖。尽管遭到了前盟友冯玉祥的背叛，在他的领导下，直系军阀在1928年仍战胜了其主要竞争对手——奉系军阀。\n在这动荡的岁月里，他不断接受着曹锟的教导。曹锟是前中华民国总统也是未来的大清帝国首相，他教会了吴佩孚用以控制政府的各种手法和诡计。尽管吴佩孚反对德国重建一个满人君主制政权，但吴佩孚很快就让直系集团适应了中国新政府的政治架构。满族人被排挤到一边，而吴佩孚及他的盟友几乎掌控了政府的方方面面。一些象征性的反对派仍然存在，但这并不影响吴佩孚真正掌控政府。§!\n§H重要信息：§L\n据报道，吴佩孚拥有世界上最大的钻石，但他拒绝让任何人核实这一说法。\n他曾因将乔治·华盛顿的画像挂在办公桌后面而闻名，但是由于美国政局日益动乱，他用俾斯麦的照片取代了前者。“俾斯麦是一位伟大的政治家，就像华盛顿一样。”他对一位到访的记者这样说道，同时他无视了其他任何与德国有关的问题。"
 QIE_Cao_Kun_C:0 "曹锟"
 QIE_Cao_Kun_D:0 "§L曹锟字仲珊，于清廷同治元年生于直隶天津大沽。\n早年家境贫寒，以贩布为生，迫于生计后转投淮军混口饭吃并被送入天津武备学堂。在学堂用四书五经将别在腰上的脑袋擦拭了几番便奔向了袁大头小站练兵处，他与其他新兵一样对长官不可信任的忠诚中掺杂着麻木和短视，但其表演的愚忠和眼底闪过的狡黠迅速得到了上层赏识，历任帮带、标统，最终升任北洋第三镇统制，成为嫡系主力第三师师长。\n此人以其独特的宠络手段，温善的笑脸与毫不手软的快刀于军阀之中脱颖而出，而温善的笑容与宠络手段结合起来即是其一大法宝。一次他特意购置上万件皮袍，对军官实行“有福共享”，以同胞古义巧妙地为其恩宠盖上体面的幕布，使部下皆欢声载道。但其憨厚的外表下也绝不缺乏那极其善钻营和两面逢源的心思，是一个不折不扣的“无赖”，加上手下有能征善战的吴佩孚替他冲锋陷阵，曹锟得以从直皖战争中胜出，又在一挫奉系后成为了名义上把控北京权柄的直系首领。进入政坛后，将其野蛮粗俗的宠络手段彻底搬上台面，以金银珠宝为其权斗之核心——1923年公开明码标价收买国会议员，不惜花费近千万大洋为自己贿得总统宝座，因此也被永久打上了“贿选总统”的恶名。\n在帝国复辟后，曹锟成了朝廷的首相。虽然他为主主政，军权实权却大多落在吴佩孚手中。尽管这种权力分割曾招致内部的不和，但目前曹锟的祖产与吴佩孚的枪杆子也还能暂时维持着脆弱的平衡。§!\n§H重要信息：§L\n曹锟自知文墨不深，在政治和外交中极为依赖吴佩孚在军校时代养出的清高威望，又将军阀内部的派系之争包装成守旧官僚式的表面和睦，使他在集团内的崛起还顺理成章连带拉升了整个曹氏家族鸡犬升天：弟弟曹锐后来成了直隶省长，六弟曹锳据守保定镇守使之位，把省内军政大权牢牢锁在家族手中。§!"
