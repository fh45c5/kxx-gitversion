 gre.510.t:0 "牧首的愚行"
 gre.510.d:0 "牧首的统治已经结束了！政府花费所有时间与资源在与其他教会辩经的行为彻底惹怒了所有人。在军队的默许下甚至是部分教士的帮助下，一群所谓的“古希腊多神教”信徒突袭了阿索斯山并软禁了牧首本人，并宣称将开始全面复兴古希腊信仰……不过对于胜利者们来说还有一个小问题：谁将成为领导人？"
 gre.510.a:0 "安杰洛斯·西克利亚诺斯！"
 gre.510.b:0 "伊娃·帕尔默-西克利亚诺斯！"