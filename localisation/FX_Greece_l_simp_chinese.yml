 GRE_social_liberal_party_themistoklis_long: "自由党(Kómma Filelefthéron)\n§g自由党是战时最有影响力的政党之一，是希腊政坛自由主义的光辉典范。该党于1910年8月由埃莱夫塞里奥斯·韦尼泽洛斯创立，在长达26年的时间里一直主导着希腊政坛。它代表了希腊社会的中间派，得到了中产阶级以及新大陆和安纳托利亚居民的支持。自由党越来越多地与反君主主义和反社会主义联系在一起，这导致社会主义分子退出进步阵营，并且由于小亚细亚运动的成功，自由党的爱国主义色彩越来越浓厚。§!\n\n§W政府首脑：§!塞米斯托克利斯·索富利斯"
 GRE_social_liberal_party_sofoklis_long: "自由党(Kómma Filelefthéron)\n§g自由党是战时最有影响力的政党之一，是希腊政坛自由主义的光辉典范。该党于1910年8月由埃莱夫塞里奥斯·韦尼泽洛斯创立，在长达26年的时间里一直主导着希腊政坛。它代表了希腊社会的中间派，得到了中产阶级以及新大陆和安纳托利亚居民的支持。自由党越来越多地与反君主主义和反社会主义联系在一起，这导致社会主义分子退出进步阵营，并且由于小亚细亚运动的成功，自由党的爱国主义色彩越来越浓厚。§!\n\n§W政府首脑：§!索福克利斯·韦尼泽洛斯"
