 GRE_elections: "选举"
 GRE_elections_desc: "愿最佳党派胜选"
 GRE_freethinker: "自由思想家党"
 GRE_freethinker_desc: "希腊人选择了民族主义者扬尼斯·梅塔克萨斯来领导国家。他领导的自由思想者党承诺将希腊文明推向辉煌。"
 GRE_the_meeting: "会议"
 GRE_the_meeting_desc: "我们将召开自由思想者党的后续会议，进一步发展我们党的国家理论，并澄清所有需要澄清的问题。当我们对党的目标有了清晰的认识后，我们就能有效地实施这些目标。"
 GRE_the_speech: "演讲"
 GRE_the_speech_desc: "有很多希腊人对自由思想者党不放心。为了培养对党的忠诚感，我们的国家领袖梅塔克萨斯将展开巡回演讲。他的声音将唤醒希腊人的斗志。"
 GRE_the_promise: "承诺"
 GRE_the_promise_desc: "不像其他政党，他们承诺得多，兑现得少。我们自由思想者党只提供一个承诺：希腊人的荣耀！我们为国家的伟大而努力，与那些无能的小丑不同，我们打算兑现承诺。"
 GRE_the_incident: "事变"
 GRE_the_incident_desc: "宪法参数是希腊走向伟大的拦路虎。议会将阻止我们的倡议。为了让希腊变得伟大，我们必须策划一次事件，让我们能够行使紧急权力。此外，与一个国家的命运相比，一个人的生命又算得了什么。"
 GRE_corporatism: "法团主义"
 GRE_corporatism_desc: "法团主义是自由思想者党议程的基本思想，并将在希腊得到最大程度的实施。不过，要做到这一点，我们必须依靠巨头和精英，为经济复兴敞开大门。"
 GRE_destroy_left_wing: "摧毁左翼"
 GRE_destroy_left_wing_desc: "左翼分子不过是颠覆分子，他们憎恨使希腊与众不同的一切。他们想用无知和暴力革命毁掉我们的土地。在伟大的希腊，不会允许这些罪犯传播他们的毒瘤。我们将逮捕他们的成员，突袭他们的总部，取缔他们的党派。"
 GRE_social_control: "社会控制"
 GRE_social_control_desc: "恶习或说蛮族语言，在伟大的希腊，这些行为都是不能容忍的。希腊人的道德素养将得到恢复！"
 GRE_direct_rule: "直接统治"
 GRE_direct_rule_desc: "在我们的政府机构中，自治的想法是我们所厌恶的。它只会导致希腊人陷入软弱，最终走向分裂。我们将集中希腊所有形式的地区。雅典的直接统治是当今的秩序。"
 GRE_personality_cult: "个人崇拜"
 GRE_personality_cult_desc: "扬尼斯·梅塔克萨斯的统治为希腊带来了荣耀。自然，他是一个值得尊敬的人。因此，为什么不接受这一事实，让我们伟大的领袖受到尊敬呢？"
 GRE_anti_colonialism: "反殖民主义"
 GRE_anti_colonialism_desc: "西方人沉醉在殖民计划的狂妄中。半个世纪以来我们曾遭受拉丁、土耳其、英国和德国殖民主义的统治，塞浦路斯的希腊人仍在英国人的枷锁之下。我们是一个自由的民族，为那些处于衰败的西方奴隶帝国阴影下的人们提供了希望的灯塔。"
 GRE_who_needs_democracy: "谁需要民主？"
 GRE_who_needs_democracy_desc: "就像雅典民主一样。现代希腊式民主以失败告终。我们已经揭示了它是一种限制国家实力的固有的软弱制度。让我们让人民摆脱对民主的幻想。"
 GRE_religious_state: "宗教国家"
 GRE_religious_state_desc: "我们是信仰正统基督教的国家——而这是我们国家认同的重要组成部分。上帝啊，荣耀归于你，我们的希望，荣耀归于你。"
 GRE_exclude_minorities: "排除少数民族"
 GRE_exclude_minorities_desc: "认为非希腊人应该对希腊人有发言权或统治权是危险的。野蛮人总是会偏袒自己的人民，而牺牲希腊人的利益。从现在起，只有希腊人才能统治希腊人。我们欢迎在我们统治下的非希腊人离开或接受我们的统治。"
 GRE_third_greek_generations: "第三希腊世代"
 GRE_third_greek_generations_desc: "古希腊人为了家族和政体的荣耀献出了生命。拜占庭人乐于为上帝和皇帝献身。作为古希腊人和拜占庭人的后裔，我们必须回顾这些传统，并在此基础上发展壮大。我们希腊人将为我们的民族和信仰战斗到底。"
 GRE_nationalism_in_schools: "教育改革"
 GRE_nationalism_in_schools_desc: "诚实的爱国主义教育令人钦佩。我们将建立这样一个健康的机构，以确保我们的青少年不参与反社会行为或不尊重我们伟大的国家。"
 GRE_populists: "人民党"
 GRE_populists_desc: "希腊人民选择了保守的反韦尼泽洛斯派的人民党领导国家。\n该党寻求支持希腊农民、教会和经济保护主义。它将如何发展？我们拭目以待。"
 GRE_reverse_secularization: "逆世俗化"
 GRE_reverse_secularization_desc: "希腊教会是希腊民族特性的重要组成部分，上届政府限制教会的政策是荒谬的。有鉴于此，这些政策将被推翻。"
 GRE_continue_hellenization: "继续希腊化"
 GRE_continue_hellenization_desc: "[ROOT.GetRulingParty]将继续推行使阿尔巴尼亚人希腊化的政策，以便将他们同化为更广泛的希腊人。\n请记住，一个幸福的社会是一个同质的社会！"
 GRE_economic_protectionism: "经济保护主义"
 GRE_economic_protectionism_desc: "外国公司只想剥削希腊，损害当地企业。\n通过实行保护主义，我们将对这些公司征税，并加强我们的国内产业！\n理论上，无论如何...."
 GRE_contact_the_generals: "联系将军"
 GRE_contact_the_generals_desc: "在欧洲前途未卜的情况下，我们应该联系将军们开始训练军队，为未来的冲突做好准备。\n毕竟，我们可不想被邻国逮个正着。"
 GRE_safer_and_secure_society: "安全可靠的社会"
 GRE_safer_and_secure_society_desc: "我们的政府必须为警察培训和装备投入更多资金。有了这些资金，我们就能确保每一个遵纪守法的希腊男女老幼都能免受那些曾经在我们的街道上横行霸道的肮脏暴徒的愤怒。"
 GRE_use_the_charisma: "使用魅力"
 GRE_use_the_charisma_desc: "魅力型领导是我们党的主旋律，如果我们要牢牢掌握权力，就必须保持这种魅力，在人民的友好领袖解决手头问题时，把人民的疑虑放在一边。"
 GRE_popular_healthcare: "大众医疗保健"
 GRE_popular_healthcare_desc: "照顾公民的需求是政府的责任。医疗保健也不例外。在增加税收的前提下，让所有公民都能免费享受医疗服务，我们就能确保社会的幸福和健康。"
 GRE_ideal_figurehead: "理想人物"
 GRE_ideal_figurehead_desc: "希腊国王是我们国家的理想领袖，是所有希腊人仰望的统一形象。君主制与我们的国家本身密不可分，无法想象一个没有君主制的希腊。"
 GRE_church_and_nation: "教会与国家"
 GRE_church_and_nation_desc: "自君士坦丁大帝时代以来，希腊教会一直是希腊社会的重要组成部分，我们必须尊重它，让它在政府事务中加强发言权。"
 GRE_law_for_criminals: "刑法"
 GRE_law_for_criminals_desc: "希腊的刑法还不够完善，需要进一步扩展，以防止卑鄙的律师寻找漏洞，为在其他国家可能立即入狱的罪行辩护。我们还将对现有的犯罪行为处以更严厉的惩罚，以确保人渣不会轻易逃脱惩罚。"
 GRE_agrarian_focus: "专注农业"
 GRE_agrarian_focus_desc: "希腊政府应高度重视农民的利益，确保提高橄榄、葡萄和烟草的产量，以获得更高的利润。"
 GRE_christian_school: "基督教学校"
 GRE_christian_school_desc: "教会是我们教育系统的重要组成部分。它不仅提供良好的教育，还教导孩子们了解传统的基督教价值观。\n政府将帮助教会建立更多的学校和大学，为国家提供更多的教育。"
 GRE_taking_what_land_gives: "取之于土地"
 GRE_taking_what_land_gives_desc: "我们的土地赐予了我们许多可供利用的自然资源。现在是时候利用这些资源，在全国各地建立矿山了。\n毕竟，不这样做是愚蠢的。"
 GRE_rebuilding_for_tommorow: "重建明天"
 GRE_rebuilding_for_tommorow_desc: "[ROOT.GetRulingParty]已经成功地改善了希腊人的生活，加强了传统价值观，现在它必须最终确定目标，不仅是自己的目标，也是希腊人民的目标，重建希腊，为子孙后代创造一个更美好的明天。\n为了更加光明的未来！"
 GRE_liberals: "自由党"
 GRE_liberals_desc: "希腊人再次选择了韦尼泽洛斯自由党，他们将继续推进希腊共和主义的事业。"
 GRE_patriotism: "鼓励爱国主义"
 GRE_patriotism_desc: "希腊人拥有值得骄傲的悠久而光荣的传统。我们将利用爱国热情来加强我们的武装力量。这样，希腊人将拥有一个漫长而辉煌的未来。"
 GRE_administration: "造福人民的行政管理"
 GRE_administration_desc: "行政腐败是不争的事实。为了建立一个强大、高度信任的政府，我们必须彻底改革我们的行政管理，清除腐败文化，建设一个更加美好的希腊。"
 GRE_resolve_minority_issue: "解决少数民族问题"
 GRE_resolve_minority_issue_desc: "我们认为，与其将税款浪费在惩罚少数民族和强迫他们同化上，不如在希腊建立少数民族自治区，这样成本更低，效果更好。这样，希腊人就能与少数民族和谐共处，而不是冲突不断。"
 GRE_bureaucratic_decentralization: "官僚权力下放"
 GRE_bureaucratic_decentralization_desc: "官僚机构效率低下的持续威胁给了我们一个好主意，那就是下放我们的官僚机构。清除多余的官僚，精简国家机构。"
 GRE_neuter_military: "让军队远离政治事务"
 GRE_neuter_military_desc: "我们的政客们生活在对军方过时人士的恐惧之中。他们对我们的共和计划构成了无处不在的威胁。为了保卫希腊，我们必须从政治上摧毁军队，清除军队中的不良分子。"
 GRE_revive_dsb: "重振民主保安营"
 GRE_revive_dsb_desc: "为了保护希腊共和国不受君主主义化石和不合群的激进分子的影响，我们将建立一个爱国者团体，以确保共和国不受内部威胁。法律和秩序是共和国的基础。"
 GRE_state_tour: "巡游全国"
 GRE_state_tour_desc: "共和国有很多反对者。一个有助于建立共识和培养团结意识的想法是，由总理进行一次全国巡游。我们将证明，共和国是为所有人服务的。"
 GRE_mixed_economy: "混合经济"
 GRE_mixed_economy_desc: "我们的国家必须迫使资本家支持我们的国家。如果一个大亨为希腊谋福利，我们将允许他掌权。但是，那些来剥削希腊的人将会受到国家的严厉制裁。"
 GRE_power_of_church: "限制教会的权力"
 GRE_power_of_church_desc: "希腊正统教会对共和国拥有的权力和影响力对于民主的希腊来说是危险的。我们的国家将试图平衡教会与共和国之间的权力。"
 GRE_affordable_housing: "经济适用房"
 GRE_affordable_housing_desc: "我们将在郊区启动一项雄心勃勃的住房计划，让普通希腊人都能买得起房。每个希腊人都有一栋房子！"
 GRE_send_the_farmers: "把农民送进工厂"
 GRE_send_the_farmers_desc: "普通民众似乎还沉浸在这样一个童话故事中：他们可以一辈子务农，在酝酿中的冲突结束后安然无恙。他们错了：我们别无选择，只能开始没收农场，然后强行将农民迁移到城市中心，让他们从事一些对国家更有利的工作。"
 GRE_public_uni_grants: "投资大学"
 GRE_public_uni_grants_desc: "通过将部分预算用于资助希腊最负盛名的高等教育机构——我国大学的扩建，我们将增加我们的优秀人才储备，我们将充分利用这些人才。"
 GRE_anti_bolshevism: "反布尔什维主义"
 GRE_anti_bolshevism_desc: "我们必须向人民宣讲布尔什维克的罪恶。不要听信他们的谎言，以免这些强盗怪物摧毁我们美丽的希腊，将他们的暴政强加给人民"
 GRE_hellas_of_future: "未来的希腊"
 GRE_hellas_of_future_desc: "我们建立了第三代希腊文明。在继承祖先事业的同时，创造出更好的新事物。我们建造的希腊是为未来准备的希腊。"
 GRE_glre: "全国人民激进联盟"
 GRE_glre_desc: "全国人民激进联盟赢得了选举。该党将为希腊带来一个权力下放、民粹主义和特殊主义的激进时代。"
 GRE_decentralization: "地方分权"
 GRE_decentralization_desc: "我国幅员辽阔，以目前的状态无法有效治理。应将更多的权力移交给自治区和市政府。"
 GRE_progressive_agenda: "进步议程"
 GRE_progressive_agenda_desc: "我们党的纲领是自由和解放以及文明的自然发展。为了使希腊成为一个人人共享的国家，落实我们的理念至关重要。"
 GRE_privatisation: "自由放任"
 GRE_privatisation_desc: "在一个由国家主义者和社会主义者统治的地区，他们专横地不尊重公共财产的权利，我们将把我们的国家变成私人投资者的绿洲。"
 GRE_school_building: "学校建设倡议"
 GRE_school_building_desc: "作为西方文明的发源地之一，我们理应拥有与之相匹配的学校和大学体系。我们将让先辈们引以为豪。"
 GRE_equality: "少数民族平等"
 GRE_equality_desc: "希腊境内有许多语言和宗教少数群体，从色雷斯的土耳其人、马其顿的亚洲小斯拉夫民族到散布在希腊北部的阿尔巴尼亚人。现在是结束希腊化计划、给予所有希腊人法律面前平等的时候了。"
 GRE_parliament: "加强议会并使之民主化"
 GRE_parliament_desc: "自独立以来，我们经历了半规律性的政治动荡和专制时期。但从现在起，人民与民主派将主宰一切。"
 GRE_investors: "鼓励投资者"
 GRE_investors_desc: "不用说，我们的国家急需资金。要实现希腊的工业化，我们需要自由市场的帮助。"
 GRE_turkophobia: "停止仇视土耳其"
 GRE_turkophobia_desc: "我们社会中对土耳其人的仇恨只会阻碍我们前进。为了让我们的国家向前看，我们必须让社会无法接受对土耳其人的仇恨，无论这看起来有多么困难。"
 GRE_secularization: "国家世俗化"
 GRE_secularization_desc: "我们相信积极的世俗化。而不是将宗教从公共生活中剔除，让不可知论成为常态。我们不会偏袒任何一种宗教，而是将所有宗教都纳入我们的统治范围。"
 GRE_conscription_slavery: "军队专业化"
 GRE_conscription_slavery_desc: "我们的军队必须反映我国的新国情。我们将赦免土耳其军官，并邀请他们加入我们的行列，使我们的军队完全现代化。还将建立一个外国军事代表团"
 GRE_industrial_development: "工业发展计划"
 GRE_industrial_development_desc: "为了使我们的国家走出经济低谷，我们将启动一项计划，全面提升我们的工业能力，以在这个艰难的时期促进经济增长。"
 GRE_redraw_internal_borders: "重划内部边界"
 GRE_redraw_internal_borders_desc: "专区制度并不代表居住在我们国家的人民。我们将为阿尔巴尼亚、斯拉夫和穆斯林少数民族建立自治区，并根据地区特性和文化建立专区。使希腊成为一个更具凝聚力的国家。"
 GRE_promote_trade: "促进国际贸易"
 GRE_promote_trade_desc: "国际贸易对我们希腊人来说并不陌生，但几个世纪以来，我们的贸易能力有所下降。我们将在全球市场上重振希腊。一个强大的希腊是一个外向型的希腊。"
 GRE_greece_reborn: "希土联合主义的概念"
 GRE_greece_reborn_desc: "希土联合主义，希腊人和土耳其人应该统一的理念是我们最伟大的抱负。我们将开展外交活动，修补土耳其人和希腊人之间的关系，并帮助在两国人民中宣传这一理念。这样我们才能共同前进。"
 GRE_progressives: "进步党"
 GRE_progressives_desc: "希腊人民选择了以季米特里斯·格利诺斯为领袖的社会民主进步党。进步党寻求实现温和的社会主义，为希腊带来稳定和现代化。"
 GRE_disarm_paramilitaries: "解除准军事部队的武装"
 GRE_disarm_paramilitaries_desc: "不忠诚的准军事乌合之众有损国家的合法性和有效性。为了国家，我们将把这些麻烦制造者赶下台，解除他们的武装。"
 GRE_strengthen_democratize_parliament: "加强议会并使之民主化"
 GRE_strengthen_democratize_parliament_desc: "议会是我们神圣民主的守护者，我们必须赋予议会更多权力，以加强我们的民主。与此同时，我们将为工人阶级的有志之士提供更多成为议员的机会。"
 GRE_secularise_state: "世俗化国家"
 GRE_secularise_state_desc: "东正教在我们的政府中没有一席之地。信仰必须是纯粹的私事。在这样一个虔诚的国度里，这可能很难执行。但这是进步的必要步骤。"
 GRE_school_building_iniatiative: "学校建设倡议"
 GRE_school_building_iniatiative_desc: "希腊的识字率会比现在更好。我们将在全国范围内开展公立学校创校活动，以提高下一代的识字率。"
 GRE_a_progressive_agenda: "进步议程"
 GRE_a_progressive_agenda_desc: "与西欧相比，希腊一直处于落后状态。我们的目标是为希腊带来进步和社会民主。当我们完成这项工作时，希腊将成为繁荣和自由的灯塔。"
 GRE_neuter_military_political: "让军队远离政治事务"
 GRE_neuter_military_political_desc: "我们的政治家们生活在对军方过时人士的恐惧之中。他们对我们的社会民主计划构成了无处不在的威胁。为了维护公平的希腊，我们必须从政治上摧毁军队，清除军队中的不良分子。"
 GRE_garner_union_support: "争取工会支持"
 GRE_garner_union_support_desc: "工会会员是我们的选民基础。我们将开始宣传活动，并提供优厚的优惠条件，争取工会支持或加入进步党。"
 GRE_create_social_insurance_institute: "创建社会保险研究所"
 GRE_create_social_insurance_institute_desc: "如果希腊工人受伤，他就会陷入严重的经济困境。这是完全不能接受的。我们将建立一个社会保险网络，作为希腊工人的安全网。"
 GRE_help_improvised: "帮扶临时工"
 GRE_help_improvised_desc: "希腊工人无法养活自己和家人。希腊社会普遍存在贫困现象。唯一的补救办法就是国家支持工人阶级。"
 GRE_nationalisation_economy: "经济国有化"
 GRE_nationalisation_economy_desc: "资本家阶级扼杀了我们的经济。囤积本应属于人民的财富。为了解决这个问题，我们将把主要产业国有化，使希腊经济更加公平。"
 GRE_moderate_land_reform: "适度土地改革"
 GRE_moderate_land_reform_desc: "农村被富裕的贵族控制得不成比例。而希腊农民的收入却不足以维持生计。我们将把多余的土地分给贫穷的农民。"
 GRE_leashed_industrialisation: "被束缚的工业化"
 GRE_leashed_industrialisation_desc: "我们的国家必须实现工业化才能进步。工业的引擎将轰鸣而起。然而，工业革命时期令人厌恶的贫困和剥削这次不会再发生了。我们不会允许它发生。"
 GRE_promote_international_trade: "促进国际贸易"
 GRE_promote_international_trade_desc: "国际贸易对我们希腊人来说并不陌生，但几个世纪以来，我们的贸易能力有所下降。我们将在全球市场上重振希腊。一个强大的希腊是一个外向型的希腊。"
 GRE_psomi_paideia_eleftheria: "面包，教育，自由！"
 GRE_psomi_paideia_eleftheria_desc: "我们的座右铭是：我们提供为人民提供面包，让他们茁壮成长；为孩子们提供教育，让他们健康成长；为工人们提供自由。"
 GRE_psomi_paideia_eleftheria_idea: "面包，教育，自由！"
 GRE_psomi_paideia_eleftheria_idea_desc: "这三个词共同反映了我们文化和身份的重要方面：基本生计(Psomí)的重要性、教育(Paideía)的价值以及对自由(Elefthería)的不懈追求。"
 GRE_psomi_paideia_eleftheria_tt: "替换$GRE_disarmed_paramilitaries$和$GRE_neutered_military$为$GRE_psomi_paideia_eleftheria_idea$\n效果变化：\n$MODIFIER_ARMY_SPEED_FACTOR$：§G+5.00%§!\n$MODIFIER_POLITICAL_POWER_GAIN$：§G+0.05§!\n$MODIFIER_STABILITY_FACTOR$：§G+10.00%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-5.00% §!\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!\n$MODIFIER_TRAINING_TIME_FACTOR$：§G-10.00%§!\n$MODIFIER_SPECIAL_FORCES_TRAINING_TIME_FACTOR$：§G-50.00%§!"
 GRE_liberal_socialism: "自由派"
 GRE_liberal_socialism_desc: "希腊人民做出了选择，这次他们选择了温和的“自由派”领导下的希腊共产党。他们提供了一个比守旧派更非正统的选择，并强调通过真正的社会主义来结束希腊社会的分裂。时间会证明这是否是正确的选择。"
 GRE_hardliners: "强硬派"
 GRE_hardliners_desc: "希腊共产党的激进派掌权了。提出要振兴希腊无产阶级，将正统马克思主义带入希腊。"
 GRE_total_secularization: "世俗化"
 GRE_total_secularization_desc: "宗教是私人事务，在政府或公共场所没有一席之地。这在一个如此虔诚的国家可能很难做到，但却是迈向未来的必要一步。"
 GRE_safeguard_democracy: "捍卫民主"
 GRE_safeguard_democracy_desc: "不管守旧派怎么说，民主是一个良好的社会主义社会所必需的，我们必须不择手段地维护它。如果人民没有发言权，那就不是真正的社会主义。"
 GRE_healthcare_for_everyone: "全民医保"
 GRE_healthcare_for_everyone_desc: "必须为每个人提供免费的全民医疗保健，毕竟，如果每个劳动者都因被纸扎伤而流血致死，我们就无法进行革命。"
 GRE_mass_urbanisation: "大规模城市化"
 GRE_mass_urbanisation_desc: "希腊本应在几十年前就实现工业化，但资产阶级的掣肘和外部势力的干预让我们如今还维持着过时的经济体系。我们没有闲工夫慢慢转变我们当下的生活方式了，我们必须即刻展开大刀阔斧的改革。"
 GRE_rights_of_woman: "妇女权利"
 GRE_rights_of_woman_desc: "长期以来，工人个人与其同志联合起来进行集体谈判的权利一直受到攻击。现在不会了。我们的希腊是一个工人共和国，工人的权利将至高无上。"
 GRE_demonize_capitalists: "妖魔化资本家"
 GRE_demonize_capitalists_desc: "只要希腊工人被迫成为资产阶级的奴隶，他们就永远无法获得真正的自由。只有全力以赴、毫不妥协的阶级斗争才能为我们带来我们所渴望的自由，我们必须摧毁资本家，揭露他们的丑恶嘴脸。"
 GRE_state_atheism: "国家无神论"
 GRE_state_atheism_desc: "希腊东正教会已经是过去时了。教士们是反革命的旗手和迷信糟粕的贩卖者。我们将铲除这些谎言，将希腊变成一个社会主义和理性主义的坚强阵地！"
 GRE_worker_councills: "工人委员会"
 GRE_worker_councills_desc: "工人们必须联合起来，组成民主工人委员会，表达他们的愿望和需求。这将有助于加强工人阶级的力量，改善他们的生活条件。"
 GRE_denounce_radicalism: "谴责激进主义"
 GRE_denounce_radicalism_desc: "我们党内的守旧派和激进分子只会吓跑选民，使我们的政策更难推行。我们必须谴责他们，因为他们不过是我们真正的社会主义国家的障碍。"
 GRE_destroy_the_nationalism: "摧毁民族主义"
 GRE_destroy_the_nationalism_desc: "在一个现代社会主义国家里，没有任何地方可以容纳沙文民族主义。毕竟，为什么要如此粗暴地强调出生的巧合呢？既然如此，国家就必须摧毁民族主义，转而支持革命爱国主义。"
 GRE_rights_of_workers: "工人权利"
 GRE_rights_of_workers_desc: "长期以来，工人个人与其同志联合起来进行集体谈判的权利一直受到攻击。现在不会了。我们的希腊是一个工人共和国，工人的权利将至高无上。"
 GRE_protect_the_poor: "保护穷人"
 GRE_protect_the_poor_desc: "在我们接管希腊之前，贫困在希腊比比皆是。现在，这只是一个不堪回首的记忆，曾经贫困的工人如今在我们的工人天堂里蓬勃发展。我们的国家把扶贫作为头等大事。"
 GRE_propaganda_machine: "宣传机器"
 GRE_propaganda_machine_desc: "我们国家的媒体将积极宣传社会主义价值观和思想。希腊人民将在一代人的时间内成为希腊共产主义计划的忠实仆人。"
 GRE_ideals_of_marx: "马克思的理想"
 GRE_ideals_of_marx_desc: "马克思和恩格斯绝对正确的教导使我们的国家从最落后的状态走向技术和工业平等。我们必须告诉人民，这不仅仅是我们的工作，而是一项始于马克思和他的理想、终将实现共产主义世界天堂的工程，是一项值得为之奋斗的事业。"
 GRE_cosmopolitanism: "世界主义"
 GRE_cosmopolitanism_desc: "我们的社会主义国家不仅关注希腊无产阶级，也关注我们国家的每一位居民。我们将赋予生活在我们社会主义项目中的所有人权力，无论他们来自何方。"
 GRE_decentralizationn: "地方分权"
 GRE_decentralizationn_desc: "中央政府无法满足人民的所有需求。我们最好赋予小社区权力，让他们自己做出决定，而不是由雅典发号施令。"
 GRE_country_of_steel: "钢铁之国"
 GRE_country_of_steel_desc: "在希腊的许多山丘上，橄榄、葡萄和烟草田鳞次栉比，拜占庭帝国的遗迹——大量教堂也是如此。我们不需要前者，新希腊也没有后者的位置。让我们利用这些被征用的土地，为工人建造工厂！"
 GRE_education_reform: "免费教育"
 GRE_education_reform_desc: "革命不能由白痴领导。每个劳动者的孩子都有权学习如何阅读、写作或做数学公式，而无需支付大笔金钱。"
 GRE_for_greece: "为了希腊！"
 GRE_for_greece_desc: "希腊是工人的天堂，希腊无产阶级深知这一点。他们知道资本家想夺走我们的天堂，再次奴役他们。为了拯救他们自己和他们的工人共和国，他们愿意制造子弹和枪支。"
 GRE_collectivisation: "集体化"
 GRE_collectivisation_desc: "农业私有化危机在希腊引发了巨大的冲突。解决这一问题的办法是用集体经营的农场取代个人拥有的农场，苏联已经成功地实施了这一进程。"
 GRE_spread_patriotism: "传播爱国主义"
 GRE_spread_patriotism_desc: "我们的国家是一个社会主义国家，我们将在我们的社会主义希腊计划的指导下，在希腊传播一种形式的爱国主义，使希腊无产阶级愿意为维护它而斗争。"
 GRE_paving_the_way_to_socialism: "为真正的社会主义铺平道路"
 GRE_paving_the_way_to_socialism_desc: "虽然我们已经走了很远，但还远远没有完成。我们必须继续为真正的社会主义和所有希腊人的美好未来铺平道路。真正的社会主义需要时间来实现，但最终一切都是值得的。"
 GRE_onwards: "前进！"
 GRE_onwards_desc: "希腊曾经是欧洲的反动穷乡僻壤，如今却接受了共产主义真理。现在的希腊是一个进步的工人天堂，今后只会越来越好。"
 GRE_giotopoulos_archiomarxists: "伊奥托普洛斯的档案马克思主义党"
 GRE_giotopoulos_archiomarxists_desc: "季米特里斯·伊奥托普洛斯领导的黑马档案马克思主义党赢得了希腊大选。他们的马克思主义更具独裁性和民族主义色彩。只有上帝才知道他们会做什么。"
 GRE_new_economic_policy: "新经济政策"
 GRE_new_economic_policy_desc: "我们希望在希腊经济中效仿布尔什维克的“乡村资本主义”制度。完全集体化的想法显然是低效和臃肿的，而容忍农村资本主义的微观世界将有助于我们相对原始的经济发展。"
 GRE_centralise_apparatus: "集中国家机器"
 GRE_nation_owns_you: "国家属于你！"
 GRE_centralise_apparatus_desc: "在我们的政府机构中实行自治的想法对我们来说是一种诅咒。它只会导致无产阶级陷入软弱，最终走向分裂。我们将集中希腊所有形式的地区。雅典的直接统治是今天的秩序。"
 GRE_nation_owns_you_desc: "每个希腊人都是希腊民族的一部分。他只不过是这个充满文化和荣耀的美丽躯体的一小部分。自然而然，我们会得出这样的结论：工人个人对整个希腊有很大的责任。被国家拥有意味着你是更大利益的一部分。"
 GRE_first_education_then_action: "先教育，后行动！"
 GRE_first_education_then_action_desc: "“先教育，后行动！”这意味着只有受过教育的马克思主义者才能带来革命。我们将在政府的各个方面实行任人唯贤，让受过良好教育、道德坚定的人领导革命。"
 GRE_strengthen_presidency: "加强总统职位"
 GRE_strengthen_presidency_desc: "只有拥有强大权力基础的人才能领导希腊人进行革命。目前，总统职位受到无用之人的限制。为了让我们的领袖更有效地引导人民，我们要清除这些无用的权力守门人。"
 GRE_archive_of_marxism: "马克思主义档案"
 GRE_archive_of_marxism_desc: "我们的国家应成为马克思主义文学和电影的堡垒，让我们的人民从他们的文字中得到启发，让希腊人的思想成为革命的真正家园！"
 GRE_road_paved_tombstones: "墓碑铺就的道路"
 GRE_road_paved_tombstones_desc: "反动派、少数派和堕落派阻碍了希腊的伟大事业。前进的道路将从他们身上铺过。我们不会也绝不允许他们用光荣革命威胁希腊人民的安全。你们要么与我们同在，要么什么都不是！"
 GRE_smyrna_crisis: "卧薪尝胆……"
 GRE_smyrna_crisis_desc: "我们在世界大战中输给了土耳其人，在这场战争中我们几乎失去了一切。随着奥斯曼帝国与开罗轴心开战，一个千载难逢的机会来了。"
 GRE_request_support: "请求国际支持"
 GRE_request_support_desc: "协约国很可能是我国的盟友，因为我们在地中海都有利益。在未来有关安纳托利亚的行动中，与他们合作将是明智之举。"
 GRE_logistics: "规划后勤工作"
 GRE_logistics_desc: "事实证明，后勤是战争中最重要的方面之一，甚至可能是最关键的方面。军队的可靠后盾是未来一切努力的先决条件。为确保将复杂情况降至最低，必须在情况变得绝望之前获得补给方法。"
 GRE_militia_problem: "民族主义民兵问题"
 GRE_militia_problem_desc: "民族主义者已经在我国站稳了脚跟。尽管他们是军事暴徒团伙，我们仍然需要他们的帮助。"
 GRE_propaganda_warfare: "宣传战"
 GRE_propaganda_warfare_desc: "希腊人民必须了解我们的巨大成功。无论是通过报纸、广播还是电影，我们都不能在即将到来的战争中失去人民的支持，否则我们的地位可能会受到威胁。"
 GRE_fortify_smyrna: "备战马其顿"
 GRE_fortify_smyrna_desc: "如果土耳其人要对我们发动入侵，从各方面考虑，他们的主要目标很可能是马其顿。因此，明智的做法是拨出一些资金来加固沿海港口和山区。有了适当的防御工事，我们几乎不可能被攻陷。"
 GRE_counterespionage: "反间谍行动"
 GRE_counterespionage_desc: "最近，关于外来渗透增加的报告越来越多。必须采取紧急行动，解决我们系统内的这些“硕鼠”。我们的宝贵资产不断受到损害。对文件的不当处理进行严格监控可能是最先采取的临时补救措施之一。"
 GRE_show_of_force: "展示力量"
 GRE_show_of_force_desc: "如果我们要展示我们的力量和韧性，我们就必须展示我们的肌肉。应在我们敌人的边境进行大量演习。海军还应骚扰在我国水域活动的外国军舰。"
 GRE_reveal_the_connections: "揭示联系"
 GRE_reveal_the_connections_desc: "为什么我们会变成这样？都怪土耳其人！是他们毁灭了我们的一切！"
 GRE_unavoidable: "不可避免之战"
 GRE_unavoidable_desc: "与土耳其的冲突似乎不可避免。真正的问题是，谁会先动手？如果我们只是拿枪顶着脑袋等待，那我们只能是傻瓜。"
 GRE_fortify_horn: "加固雅典城防"
 GRE_fortify_horn_desc: "假如土耳其人用他们的舰队轰炸我们的首都雅典的话，后果不堪设想。我们将在雅典周围建立一系列海岸堡垒。"
 GRE_industrial_convert: "紧急工业转换"
 GRE_industrial_convert_desc: "许多工业区都挤满了无用的工厂和商店。为了确保新制造的枪支能够随时供应，最好对其中一些建筑进行翻新，以便用于军事用途。"
 GRE_an_example: "杀鸡儆猴"
 GRE_an_example_desc: "对于我们队伍中的这些叛徒，制度总是过于宽容。这些叛徒的泄密行为每次都会导致成千上万人丧生。如果他们想践踏我们的解放之手，他们将受到刀剑的惩罚。"
 GRE_greco_turkish_war: "希土战争"
 GRE_greco_turkish_war_desc: "复仇的时候到了！几十年来，他们用枷锁桎梏着我们的人民，世界大战中他们无情的屠杀我们的人民，现在是时候加倍奉还了！"
 GRE_treaty_of_ankara: "安卡拉条约"
 GRE_treaty_of_ankara_desc: "墨迹已在纸上，土耳其人已被征服，枪炮声已沉寂，我们胜利了。尽管取得了这一重大胜利，但我们仍有一些重大问题需要解决，这些问题涉及我们获得的新土地和我们留下的宿敌。"
 GRE_demonize_empire: "妖魔化帝国"
 GRE_demonize_empire_desc: "背信弃义的土耳其压迫我国人民长达几个世纪。他们在玷污永恒之城的同时，还榨取我们的财富，迫使我们的祖先陷入贫困。我们必须教育每一个希腊男人、女人和孩子，让他们了解土耳其民族的卑鄙本性，这样他们就永远不会再征服我们了。"
 GRE_hunt_rebels: "追捕叛军"
 GRE_hunt_rebels_desc: "极端民族主义恐怖分子和所谓的“圣战分子”出没于安纳托利亚山麓，袭击我们英勇的武装部队，伤害无辜的希腊人。我们必须派出搜索和摧毁部队，像猎狗一样追捕叛军。"
 GRE_resettlement: "完成安置行动"
 GRE_resettlement_desc: "在我们的土地上有土耳其人，我们不希望他们出现。土耳其土地上有希腊人，我们要保护他们免受土耳其人的切齿痛恨。我们提议进行人口迁移，让我们所有的人都能真正摆脱土耳其人的枷锁。"
 GRE_reconstruction_funding: "重建资金"
 GRE_reconstruction_funding_desc: "战争摧毁了安纳托利亚的基础设施。土耳其人在收复失地之前对这片土地进行了大肆破坏。现在，我们要重建被他们摧毁的希腊土地。"
 GRE_calm_down: "冷静下来！"
 GRE_calm_down_desc: "战争破坏后，安纳托利亚人民陷入恐慌，他们的经济前景破灭，家园被毁。我们不仅要帮助安纳托利亚人，还要从经济上振兴爱琴海两岸的土地。"
 GRE_broken_glass: "水晶之夜...永远不再"
 GRE_broken_glass_desc: "坦率地说，水晶之夜是我国政府的耻辱。希腊店主不得不依靠自己的智慧和资源来保护自己免受土耳其人的威胁，而国家却完全无能为力。我们的公民再也不会如此脆弱了。我们国家的军队将使土耳其人望而却步。"
 GRE_collaboration: "感谢合作！"
 GRE_collaboration_desc: "希腊有土耳其人和穆斯林，他们出人意料地证明了自己对希腊的价值。我们必须向这些不可能成为文明使者的人表示感谢。希望能鼓励更多的土耳其人接受我们的统治，最终实现希腊化。"
 GRE_megali_idea: "伟大理想已完成"
 GRE_megali_idea_desc: "希腊有土耳其人和穆斯林，他们出人意料地证明了自己对希腊的价值。我们必须向这些不可能成为文明使者的人表示感谢。希望能鼓励更多的土耳其人接受我们的统治，最终实现希腊化。"
 GRE_backup_police: "支援警方"
 GRE_backup_police_desc: "在我们整合新领土的过程中我们意识到，我们国家的警察部队在维护安纳托利亚的法律和秩序方面遇到了问题。为了弥补这些不足，我们将向犯罪活动猖獗和动荡不安的地区派遣军事化的绥靖部队。这些罪犯在希腊将无处藏身。"
 GRE_hellenoturkish: "希土联合主义的实现"
 GRE_hellenoturkish_desc: "我们的人民终于团结起来了。我们的愿景已经实现。那些曾经嘲笑我们的人，现在已经吓得发抖了。然而，前方的道路依然崎岖不平，还有各种问题亟待解决。\n为我们人民的新开端干杯！"
 GRE_resolve_disputes: "解决争议"
 GRE_resolve_disputes_desc: "希腊-土耳其项目有了这样一个良好的开端。从解决两国人民之间的领土争端和省界问题开始，我们还有很多问题要解决。"
 GRE_ripbozo_nationalism: "民族主义之死"
 GRE_ripbozo_nationalism_desc: "民族主义，特别是奥斯曼民族主义和希腊民族主义，有可能从内部摧毁我们的国家。"
 GRE_manifest_destiny: "昭昭天命"
 GRE_manifest_destiny_desc: "我们的计划是罗马式的，我们的国家是罗马式的，我们的人民是罗马式的。土耳其人和希腊人都曾以罗马人的身份团结在一起；我们都有共同的罗马梦。现在，我们有机会重现罗马梦。                 我们是第三罗马！"
 GRE_back_to_constantinople: "回到大城市"
 GRE_back_to_constantinople_desc: "君士坦丁堡，或者我们现在称之为“巨城”，是我们项目的关键所在，这座城市与我们伟大的民族都有着深厚的历史和文化渊源。在我们的领导下，巨城将成为一个独一无二的城市，我们伟大民族的各种文化可以在这里和平、和谐地共处。"
 GRE_rewrite_history: "重写历史"
 GRE_rewrite_history_desc: "目前关于希腊人和土耳其人是敌人的说法是有偏见的，是修正主义的。我们必须让我们的学者远离这些无稽之谈，去了解被外国精英压制的真实历史。"
 GRE_write_constitution: "写下宪法"
 GRE_write_constitution_desc: "我们一直依赖希腊的旧宪法。这份文件与我们的愿景相冲突，只代表了我国一个民族的工作。我们将根据以团结、宽容和自由为基础的希土联合主义思想，制定一部新的、更好的宪法。"
 GRE_free_the_people: "解放人民"
 GRE_free_the_people_desc: "任何社会的和平与稳定的基础都必须是充分尊重所有人民的权利，无论你是亚美尼亚人、犹太人、库尔德人还是其他人。"
 GRE_religious_freedoms: "解放宗教"
 GRE_religious_freedoms_desc: "宗教紧张是希腊土耳其分裂的根源。我们必须尊重我们在这方面的差异，同时也要记住，我们都崇拜同一个亚伯拉罕上帝，但对其有不同的解释。\n宗教宽容必须成为我们国家的支柱。"
 GRE_united_forever: "团结长存"
 GRE_united_forever_desc: "希腊人和土耳其人终于团结在一起，这种团结必须永恒。新月和十字架可以并肩屹立在历史的长河中，永不分离。"
 GRE_proclaim_republic: "宣布成立土耳其社会主义共和国"
 GRE_proclaim_republic_desc: "在与奴役土耳其人的帝国主义政权的战争取得胜利后，我们需要认识到，受压迫的工人和农民与革命前的我们并无不同，我们有责任帮助我们的同胞，让他们品尝自由和兄弟情谊的果实。因此，我们需要帮助他们，为他们建立真正的社会主义共和国提供建议。"
 GRE_military_support: "军事支持"
 GRE_military_support_desc: "战争使安纳托利亚满目疮痍，在反动派狼烟四起的情况下，我们必须建立一支能够捍卫我们用血泪换来的革命成果的军队。我们将建立一支真正的军队，将社会主义理念的光芒发扬光大。"
 GRE_rapid_reconstruction: "快速重建"
 GRE_rapid_reconstruction_desc: "当务之急是尽快开始重建被战争破坏的基础设施和工业，以减轻工人的困境，使土地恢复生产力。毕竟，工业是社会主义国家的支柱。"
 GRE_life_support_economy: "土耳其经济的生命保障"
 GRE_life_support_economy_desc: "战争的失败摧毁了土耳其的经济，虽然我们可能会取得胜利，但我们不想成为灰烬的统治者。重要的是要帮助我们新生的社会主义盟友重建他们的国家，并成为我们伟大运动的有力组成部分。"
 GRE_albania_exile: "宣布阿尔巴尼亚流亡"
 GRE_albania_exile_desc: "阿尔巴尼亚现政权只不过是反动势力和帝国主义列强的傀儡，而工人却比以往任何时候都更加饥饿，农民也比以往任何时候都更加贫穷。显然，这个政权是不合法的，我们将帮助阿尔巴尼亚同胞建立一个真正代表人民意愿的政府。"
 GRE_blame_italians: "都怪意大利人"
 GRE_blame_italians_desc: "长期以来，意大利国家一直在破坏该地区的稳定，并公开宣称其对整个地中海地区的帝国野心。他们的介入阻碍了人民的意愿和国家的独立。阿尔巴尼亚危机只是他们犯下的一系列罪行中的最新一例。"
 GRE_spark_chaos: "引发混乱"
 GRE_spark_chaos_desc: "我们需要为革命提供肥沃的土壤，因此需要分散帝国占领的注意力。这也会让那些尚未做出决定的人大开眼界，让他们意识到他们的压迫者已经软弱到无法维持其政权的秩序。"
 GRE_sabotage_italians: "破坏意大利"
 GRE_sabotage_italians_desc: "仅仅公开反对意大利政府的行动可能还不够，我们还需要在现场采取行动。幸运的是，我们在意大利占领区内有很多志同道合的人，他们都渴望为我们出击。意大利人很快就会意识到他们的野心有多大。"
 GRE_special_operation: "特别军事行动"
 GRE_special_operation_desc: "我们的阿尔巴尼亚盟友已经准备就绪，在最近的动乱浪潮之后，该地区似乎基本上是在乞求我们解放他们，我们不应该再让他们等待下去了。"
 GRE_free_south_slavs: "解放南斯拉夫"
 GRE_free_south_slavs_desc: "几个世纪以来，南斯拉夫人一直是外国列强的玩物，饱受压迫。从法国人到腐朽的哈布斯堡王朝，再到卖国的塞尔维亚人。现在这一切都将结束，我们将解放这些人，让他们加入我们伟大的革命。"
 GRE_demand_islands: "巴尔干的统一"
 GRE_demand_islands_desc: "现在终于到了让所有巴尔干国家团结起来的时候了。我们不能再容忍外国帝国主义的影响。我们的立场是明确的，我们愿意以实际行动来支持我们的言论。"
 GRE_open_borders: "开放边境"
 GRE_open_borders_desc: "我们将努力废除我们的革命朋友之间的边界，允许我们阵营内部的人员自由流动。我们的精神和使命是一致的，旧秩序人为制造的这些隔阂只会阻碍我们实现目标。"
 GRE_open_borders2: "开放边境"
 GRE_war_industry: "战争工业局"
 GRE_war_industry_desc: "我们需要集体组织我们战争努力的后勤和经济方面，以确保我们将面临的战斗取得成功。因此，有必要建立一个中央规划机构，负责管理我们和我们盟国的战争工业。"
 GRE_free_cyprus: "解放克里特"
 GRE_free_cyprus_desc: "岛上的希腊人长期以来一直是德意志帝国的玩物，德意志帝国将克里特作为一个海军基地，同时镇压岛上的原住民。但是，人民呼唤从日耳曼雄鹰手中获得自由。我们有责任让克里特回到祖国的怀抱。"
 GRE_crush_crown: "粉碎保加利亚王冠"
 GRE_crush_crown_desc: "保加利亚王室是本地区无数冲突的侵略者，不仅镇压我们的土耳其同胞，还镇压自己的人民。他们陈旧的政府只会导致战争和苦难。我们需要将他们的土地从封建制度下解放出来，最终确保我们北部边境的安全。"
 GRE_use_resources: "使用资源"
 GRE_use_resources_desc: "我们的土地蕴藏着丰富的尚未开发的自然资源。我们将勤奋工作，建立强大的经济，开发我们的土地所提供的资源。这必将有助于我们进一步实现社会主义共和国的工业化。"
 GRE_stand_strong: "我们坚强不屈"
 GRE_stand_strong_desc: "我们将团结一致，直面任何威胁，革命将经久不衰，并取得最终胜利。我们共同展望更加光明的未来。"
 GRE_integration: "整合"
 GRE_integration_desc: "我们坚持人为的界限和分离是没有用的。我们通过合作走到了今天。我们应该拥有一个新的、团结的民族身份。我们的伟大革命将我们团结在一起，在红色旗帜下建立了一个强大、自由的社会主义国家。"
 GRE_cooperation: "合作"
 GRE_cooperation_desc: "我们与革命同胞一起战胜了一切困难。我们的国家因友谊与合作而永结同心。随着时间的推移，这种纽带只会更加牢固。只要我们在这个伟大的民族兄弟情谊中团结在一起，我们就能经受住每一次风暴，守住每一条防线，战胜一切邪恶。"
 GRE_balkan_friendship: "宣布巴尔干统一"
 GRE_balkan_friendship_desc: ""
 GRE_drachma_devaluation: "德拉克马贬值"
 GRE_drachma_devaluation_desc: "我们的财政困境似乎无穷无尽，违约与债务已让我们的经济形势几近难以为继。我们必须有意地进行货币贬值，并以此作为刺激外资流入的必要条件，尽管从长远来看，这可能会损害我们的经济。"
 GRE_support_workers: "支持挣扎中的工人"
 GRE_support_workers_desc: "我们的经济依赖于希腊劳动人民的繁荣。正是这些劳动人民被我们经济的失败所埋葬。我们必须确保希腊人民能够养活自己。他们的繁荣就是我们的繁荣。"
 GRE_safeguard_banking: "保护银行业"
 GRE_safeguard_banking_desc: "至少可以说，我们一直缺乏财政责任感。我国银行业的失败就是最好的证明。我们必须制定法规，保护我们的银行免受不良行为者和鲁莽消费的影响。"
 GRE_smyrna_aid: "士麦那经济援助"
 GRE_smyrna_aid_desc: "士麦那的经济正在衰败。补救的唯一办法就是为士麦那提供经济启动资金。扭转这一颓势，使该地区得以发展。"
 GRE_invest_consumer_goods: "投资消费品"
 GRE_invest_consumer_goods_desc: "为普通人创造商品的产业每年都在增长。随着现代设施的普及，经济效益也随之增长。我们的政府将对这一不断增长的市场进行投资，以轻松获利。"
 GRE_reevaluate_budget: "重新评估预算"
 GRE_reevaluate_budget_desc: "超支是对经济稳定的威胁。我们应不断审查我们的国家预算，确保我们的钱花在刀刃上。"
 GRE_back_on_feet: "再度崛起"
 GRE_back_on_feet_desc: "最糟糕的时期已经过去，我们已经从深度萧条中恢复过来。现在，我们必须进一步发展经济，以确保我们在未来处于强势地位。"
 GRE_advancements_mining: "采矿业的进步"
 GRE_advancements_mining_desc: "与世界其他国家相比，希腊的采矿业十分落后。尽管我们拥有丰富的自然资源，但这为我们提供了动力，使采矿创新成为我们发展的重中之重。"
 GRE_autarky: "自给自足"
 GRE_autarky_desc: "我们长期依赖那些更富有国家的资本是一种耻辱；这些国家蔑视我们，欺辱我们，并且为了赚得盆满钵满放任我们长期贫困。德国人和苏联人向我们展示了另一条道路——通往自给自足和独立自主的道路！"
 GRE_develop_arms_industry: "发展军用工业"
 GRE_develop_arms_industry_desc: "我们的武器供应不应依赖于善变且可能充满敌意的外国人。我们将加强本国的军火工业，确保我们的军队能够完全自给自足。"
 GRE_modernize_agro: "农业现代化"
 GRE_modernize_agro_desc: "我们陈旧的农业系统效率低下，拖累了我们的经济。我们将对农业部门进行彻底改革，以满足现代化的需求。"
 GRE_infrastructure_development: "基础设施建设项目"
 GRE_infrastructure_development_desc: "我国的道路主要是互不相连的碎石路。这对于一个现代国家来说是完全不可接受的。当我们完成这项工作后，希腊的道路将成为欧洲羡慕的对象。"
 GRE_heavy_industry: "重工业投资"
 GRE_heavy_industry_desc: "为了帮助我们的国家实现工业化，为了使我们的国家变得强大，我们应该加强我们的重工业。"
 GRE_pyrkal: "希腊火药弹药公司"
 GRE_pyrkal_desc: "希腊火药弹药公司是我国最大的本土武器制造商。我们应该尽全力支持这家伟大的希腊公司。"
 GRE_electryfication: "电气化"
 GRE_electryfication_desc: "现代电力奇迹在希腊并不常见。我们不应再容忍这一奇耻大辱。我们将以闪电般的速度发展我们的电网。将希腊带入现代化时代。"
 GRE_innovative_production_methods: "创新的生产方法"
 GRE_innovative_production_methods_desc: "创新是工业的本质，现在是改变我们过时的生产方式，采用更新、更高效的方法的时候了。"
 GRE_invest_in_aviation: "投资航空工业"
 GRE_invest_in_aviation_desc: "现代航空奇迹对希腊影响甚微。我们认为不会再有了。我们的政府将帮助雄心勃勃的航空企业主脚踏实地，展翅高飞。"
 GRE_emergency_procedures: "应急程序"
 GRE_emergency_procedures_desc: "希腊不太可能遭到入侵。但我们必须考虑到所有可能发生的情况。我们的工业将不受轰炸的影响。有些人可能会说这没有必要。对此我们要说：安全总比遗憾好！"
 GRE_supply_fuel: "提供燃料"
 GRE_supply_fuel_desc: "希腊缺乏天然油田。为了弥补这一不足，我们将投资于新兴的合成石油工业，使我们的石油工业永不枯竭。"
 GRE_university_of_athenes: "雅典大学"
 GRE_university_of_athenes_desc: "雅典大学是希腊最负盛名的高等教育机构，通过拨出部分预算用于扩建该大学的设施，我们将增加我们的优秀人才储备，我们将充分利用这些人才。"
 GRE_tourist_paradise: "旅游天堂"
 GRE_tourist_paradise_desc: "我们的文物古迹和自然美景令世人艳羡，毫无疑问，我们可以将旅游业转化为促进经济发展的强大动力。"
 GRE_economic_boom: "经济繁荣"
 GRE_economic_boom_desc: "我们国家工业的发展正在偿还我们在经济中投入的资金，并正在成长为一棵工业大树。我们必须收获我们的劳动果实。"
 GRE_pay_off_dept: "还清国家债务"
 GRE_pay_off_dept_desc: "自独立以来，我们的政府一直被债务所困。经过多年缜密的经济发展和规划，我们现在才终于可以开始摆脱这种困境。希腊将最终获得自由！"
 GRE_eee: "希腊国民联盟夺权"
 GRE_eee_desc: "希腊国民联盟推翻了“金色黎明”；他们是传统的希腊极端民族主义者，拒绝接受“金色黎明”更深奥的观点。"
 GRE_convert_or_suffer: "皈依或受苦"
 GRE_convert_or_suffer_desc: "东正教是真理。它在国家中至高无上的理念是不够的。我们的祖先不容忍异教徒和背教者，我们又何必呢？我们将为我们国家的异教徒提供在今世和来世获得救赎或遭受诅咒的选择。"
 GRE_old_ways: "老路"
 GRE_old_ways_desc: "现代性带来了一个病态的时代。男人和女人推卸对子女的责任。人们陷入享乐主义。罪恶横行，人们在寻找目标。现代性的畸形力量将被传统的永恒力量所粉碎。只有在我们的统治下，希腊才能摆脱罪恶。"
 GRE_burn_jews: "烧毁犹太教堂"
 GRE_burn_jews_desc: "犹太人是腐朽的奥斯曼人带到希腊的异类。我们不能再容忍他们了。为了我们美丽的祖国，我们将拆除他们的异教徒庙宇。他们必须接受基督，否则后果自负。"
 GRE_ghetto: "贫民区建筑"
 GRE_ghetto_desc: "犹太人显然与希腊社会格格不入。为了解决这个问题，我们将把犹太人隔离到他们自己的聚居区，这样他们的存在就不会损害礼貌社会。"
 GRE_blame_entente: "指责协约国"
 GRE_blame_entente_desc: "协约国承诺欧洲和平，但却以希腊的荣耀和伟大为代价。他们不过是想束缚希腊、剥削我们的国际吸血鬼。我们不会给法国人擦鞋！"
 GRE_nothing_against_state: "无逆于国"
 GRE_nothing_against_state_desc: "国家是希腊人民的体现，与国家为敌就是与人民为敌。在我们的统治下，反对是不能容忍的。所有人要么支持我们，要么反对我们。"
 GRE_lawful_territory: "我们的合法领土"
 GRE_lawful_territory_desc: "希腊人的土地曾经横跨整个安纳托利亚。如果我们的祖先看到我们的遭遇，他们会怎样哭泣。现在，我们的大部分土地上已经没有希腊人了，居住着被占领的土耳其人。我们将向全世界宣布，我们打算如何恢复希腊的伟大。"
 GRE_imperium_romanum: "罗马帝国"
 GRE_imperium_romanum_desc: "现在希腊控制了君士坦丁城，我们有能力恢复昔日的辉煌。希腊人民曾经是西方世界最强大的力量，我们将努力让这个国家重生，成为一个骄傲而高贵的帝国......拜占庭帝国！"
 GRE_golden_dawn_focus: "金色黎明坚守阵地"
 GRE_golden_dawn_focus_desc: "希腊本土人民主义运动金色黎明夺取了希腊的政权。他们的目标是通过民族革命在希腊国内复兴古老的希腊精神。"
 GRE_agoge: "斯巴达教育"
 GRE_agoge_desc: "希腊本土人民主义运动金色黎明夺取了希腊的政权。他们的目标是通过民族革命在希腊国内复兴古老的希腊精神。"
 GRE_spartan_constitution: "斯巴达宪法"
 GRE_spartan_constitution_desc: "我们所拥有的宪法是现代主义堕落的纪念碑，就像所有同类事物一样，它将被原始真理的火焰所摧毁。斯巴达宪法及其有机社会阶层的概念更适合希腊。"
 GRE_spartiate: "斯巴达人"
 GRE_spartiate_desc: "斯巴达人是战士种姓，也是斯巴达的正式公民。他们被禁止工作，将毕生精力投入到终极战士的训练中。我们将在现代复兴斯巴达人，我们将唤起希腊人民的战争热情。每个希腊人都应为国家服务，以证明自己的价值。"
 GRE_perioikoi: "边民"
 GRE_perioikoi_desc: "伊利里亚人和斯拉夫人不是希腊人，他们的地位显然低于我们；但是，我们可以向他们伸出橄榄枝，让他们成为可以为希腊工作和发展的非希腊公民。在我们的宗主权下，他们将为我们服务，就像我们为他们服务一样。"
 GRE_helots: "还有黑劳士..."
 GRE_helots_desc: "我们的大敌土耳其人和其他伊斯兰人自然会成为新的黑劳士，即斯巴达的奴隶种姓。经过一千年来对希腊种族的无休止攻击，他们应该认为这是一个向我们赎罪的机会。"
 GRE_neodamode: "尼奥达莫德"
 GRE_neodamode_desc: "有些黑劳士拥有纯正的希腊血统，或具有可敬的精神特质。我们将给他们一个机会，让他们摆脱黑劳士的统治，加入希腊人的行列。"
 GRE_burn_down_churches: "焚毁教堂"
 GRE_burn_down_churches_desc: "基督教是奴役希腊人种的邪恶力量。一个希腊人怎么能既为死去的犹太人的崇拜服务，又为自己的种族服务呢？从今往后，东正教会将被视为希腊的废墟，宙斯万岁！"
 GRE_hephaestus: "赫菲斯托斯行动"
 GRE_hephaestus_desc: "我们将以武器冶炼之神赫菲斯托斯的名义建造庞大的工厂来制造武器装备。这不仅会让我们在生产上占得先机，还因为这是一件很有意义的事情，而且我们还有大量的帮工需要工作。"
 GRE_ares: "阿瑞斯行动"
 GRE_ares_desc: "我们的斯巴达祖先在战场上为阿瑞斯抛头颅洒热血。作为他们的子孙，我们有义务在战场上洒下鲜血，以纪念阿瑞斯和我们光荣的祖先。"
 GRE_hyperborea: "许珀耳玻瑞亚行动"
 GRE_hyperborea_desc: "许珀耳玻瑞亚，一个人类长生不老的乌托邦之地。一些亵渎者认为这只是一个老太太的故事。我们知道要驳斥这些缺乏想象力的反对者，并派遣探险家前往遥远的北方和南方，寻找许珀耳玻瑞亚大陆。"
 GRE_infant_selection: "婴儿选择"
 GRE_infant_selection_desc: "世界上有许多有远见的人和组织都相信积极的优生学，我们党就是其中之一。所有希腊人的后代在出生时都要接受检查，看其基因是否健全。对种族卫生有负面影响的，要么绝育，要么格杀勿论。为了种族的利益，所有具有特别可恶特征的变种人都将被当场处死。"
 GRE_honour_ancestors: "敬仰先祖"
 GRE_honour_ancestors_desc: "我们所有伟大的希腊先辈都应受到尊敬。他们的所有历史都是光荣的历史，我们有幸成为他们的后裔，我们应当对祖先的成就表示应有的敬意。我们的祖先活在我们的血液中，活在我们的信仰中。当我们死后，能在冥府与他们相见，将是我们的荣耀。"
 GRE_free_art: "解放艺术"
 GRE_free_art_desc: "古希腊艺术形式和美学已被现代性的力量扼杀，并被基督教的浮华凡俗所奴役。我们将重振古希腊精神，复兴真正的、未受损伤的希腊艺术。"
 GRE_molon_labe: "来拿吧！（Molon labe）"
 GRE_molon_labe_desc: "“Molon Labe”来吧，拿走它！这是我们的战斗号角。我们向喧闹的野蛮人挑战，他们试图摧毁我们，夺取我们的土地。众神知道我们也会这样对待他们。"
 GRE_legacy_leonidas: "列奥尼达的遗产"
 GRE_legacy_leonidas_desc: "传说中的拉西代梦国王列奥尼达的一生是希腊民族领袖的理想生活。他公正地统治着他的人民，并为保卫自己的民族和土地抵御外族入侵而献出了生命。"
 GRE_turkish_plot: "土耳其阴谋"
 GRE_turkish_plot_desc: "土耳其人正试图摧毁我们的国家，就像他们400年前所做的那样。我们试图向他们展示良好的治理，但他们拒绝了。"
 GRE_the_final_solution: "平定安卡拉"
 GRE_the_final_solution_desc: ""
 GRE_take_what_is_ours: "拿走属于我们的东西"
 GRE_take_what_is_ours_desc: "土耳其人占领希腊土地已近千年。他们剥夺希腊人的权利已有千年之久。我们最终将结束这种压迫，把土地还给希腊人。土耳其人想去哪就去哪，就是不能来这里。"
 GRE_hunt_the_leaders: "猎杀领导者"
 GRE_hunt_the_leaders_desc: ""
 GRE_total_war: "全面战争"
 GRE_total_war_desc: ""
 GRE_scorched_earth: "被烧焦的废墟"
 GRE_scorched_earth_desc: ""
 GRE_colonization_of_anatolia: "安纳托利亚殖民地"
 GRE_colonization_of_anatolia_desc: ""
 GRE_confiscation: "没收"
 GRE_confiscation_desc: ""
 GRE_parousia: "再临"
 GRE_parousia_desc: ""
 GRE_amnestic_agents: "失忆药剂"
 GRE_amnestic_agents_desc: ""
 GRE_to_ashes: "尘归尘"
 GRE_to_ashes_desc: ""
 GRE_purity_laws: "纯度法"
 GRE_purity_laws_desc: "我们的民族是纯正的希腊血统。我们是唯一愿意建立如此庞大帝国的民族，也是唯一能够维持帝国的民族。我们必须保持我们民族的纯洁性，以维护帝国计划。"
 GRE_remain_calm: "保持冷静"
 GRE_remain_calm_desc: ""
 GRE_prepare_for_war: "拿起武器"
 GRE_prepare_for_war_desc: "希腊即将迎来一场战争——我们知道这是事实。如果我们试图避免这场战争，我们只会抛弃数百万没有生活在希腊统治下的希腊人，因此我们必须为不可避免的战争做好准备。"
 GRE_evaluate_army: "希腊军队"
 GRE_evaluate_army_desc: "由于世界大战，我们失去了大部分的人力基础，我们被分成了两派，一派主张利用物质优势，以强大的火力摧毁敌人；另一派则精心策划，以最高的效率执行行动，防止损失。"
 GRE_firepower: "注重优势火力"
 GRE_firepower_desc: "我们最终确定了火力优势的原则。我们不会浪费希腊人的生命，而是要消灭敌人的防御，并在敌人的防御被摧毁时将其扫除。"
 GRE_artillery_focus: "增加火炮研究"
 GRE_artillery_focus_desc: "正如英国人在世界大战期间所了解到的那样，战场上可能永远不会有足够的炮弹。击退敌人需要持续、集中的轰炸，以摧毁防御工事，打开防御工事的缺口。因此，我们必须大幅增加生产和研究。"
 GRE_marines_focus: "希腊海军陆战队"
 GRE_marines_focus_desc: "作为我们以压倒性火力精确打击敌人弱点的理论的一部分，我们决定建立一个专门的两栖作战海军陆战队。这些人将从最优秀的新兵中挑选出来，作为精英部队对敌方海岸进行海军袭击。"
 GRE_bullets_not_men: "子弹而非人"
 GRE_bullets_not_men_desc: "敌人来的时候，他们必须遭遇火力风暴。我们派往缺口的必须是子弹，而不是人。这种精神体现了我们的整个教义。"
 GRE_battleplan: "注重决战计划"
 GRE_battleplan_desc: "我们最终确定了宏伟作战计划的原则。我们不会浪费希腊人的生命，我们将协调整个战线，以便我们的进攻在完美的时间到达，并通过同时进行精心策划的进攻来压倒敌人。"
 GRE_mountaineers: "希腊山地步兵"
 GRE_mountaineers_desc: "作为我们精心规划细则的一部分，我们发现高海拔训练对那些将在山区作战的精选人员非常有用。培养一些专业的登山者将确保我们始终拥有能够在最崎岖的地形上作战的部队。"
 GRE_mobility: "机动支援"
 GRE_mobility_desc: "虽然我们必须承认，我们的工业使我们无法部署大国的坦克营，但我们完全有能力生产车辆来支持我们的步兵，并使他们比现在更具机动性。"
 GRE_expand_staff: "扩大总参谋部"
 GRE_expand_staff_desc: "总参谋部负责不断研究和应用新的作战方法，通过增加预算和扩大职权，我们可以确保他们保持在军事理论的前沿。"
 GRE_innovation: "军事创新"
 GRE_innovation_desc: "随着军事研究处的成立和运行，我们应该启动一项计划，鼓励我们最聪明的人才加入该处，以便他们能够更好地运用自己的技能为希腊国家服务。"
 GRE_the_pyrkal_deal: "希腊火药弹药公司合同"
 GRE_the_pyrkal_deal_desc: "希腊火药和弹药筒公司是希腊历史最悠久、规模最大的国防公司之一。我们必须与他们合作，并提供补贴，确保他们和我们的军队都能受益，因为他们的供应商就在我们身边。"
 GRE_the_onassis_initiative: "奥纳西斯倡议"
 GRE_the_onassis_initiative_desc: "具有远见卓识的大亨阿里斯托尔·奥纳西斯提出了一项投资计划，以全面提升希腊的军事工业能力。虽然价格不菲但这似乎是一项明智的投资。"
 GRE_special_forces: "希腊特种部队"
 GRE_special_forces_desc: "随着我军的壮大，我们有机会实现多样化。我们将建立一支由希腊精英组成的精锐部队。创建这样一支队伍将是我们的首要任务。"
 GRE_use_our_terrain_desc: "大自然为我们提供了许多天然的防御，我们只需要学会如何利用好我们的地形就可以了！在这一方面，瑞士人肯定有许多值得我们学习的东西。"
 GRE_modernize_cavalry_corps: "骑兵团现代化"
 GRE_modernize_cavalry_corps_desc: "一些战术家说，骑兵在当今战场上已无立足之地。我们不同意这种观点。我们将对国家的骑兵进行全面改革，使这一古老的制度成为现代的有效工具。"
 GRE_the_quest_of_oil: "对石油的追求"
 GRE_the_quest_of_oil_desc: "石油是现代军队的命脉。希腊明显缺乏石油，但事实并非如此。当我们的勘探者发现伊庇鲁斯有石油的新迹象时，我们应该投资于他们的企业，这样我们就可以拥有自己的石油来源，而不是依赖变化无常的外国市场。"
 GRE_logistical_steadiness: "后勤稳健性"
 GRE_logistical_steadiness_desc: "没有良好的后勤保障，失败是不可避免的。我们必须确保我们的军队有充足的储备，货物能够轻松、稳定地运往前线。这样，胜利就不可避免，而不是失败。"
 GRE_production_prioritization: "确定生产优先次序"
 GRE_production_prioritization_desc: "没有枪，我们的人就毫无用处。没有子弹，我们的枪也没用。生产武器装备来解决我们面临的武器短缺问题至关重要。"
 GRE_nukes: "开拓原子能"
 GRE_nukes_desc: "利用原子能的概念是一个诱人的机会，不能错过。如果成功，希腊将成为世界上有史以来最强大的国家！"
 GRE_a_tank_for_every_man: "人手皆有坦克"
 GRE_a_tank_for_every_man_desc: "坦克是现代战争的关键。我们必须发展理论和后勤知识，以适应坦克战的性质。"
 GRE_standarization_equipment: "装备标准化"
 GRE_standarization_equipment_desc: "我们的一些装备过时得令人啼笑皆非。这对于一支严肃的军队来说是不可接受的。必须立即实施装备标准化。"
 GRE_legacy_of_alexander: "亚历山大的遗产"
 GRE_legacy_of_alexander_desc: "亚历山大大帝将希腊文明带到了已知世界的尽头，用自己的双手创造了一个历史时代。当然，如果没有最优秀的希腊士兵，他是不可能做到这一点的，现在我们也有了。虽然我们没有如此崇高的抱负，但我们将勇往直前，因为我们知道，世界上找不到比他更优秀的士兵了。"
 GRE_byzantine_army: "自由源于勇气"
 GRE_byzantine_army_desc: "“自由源于勇气”是我们国家武装部队的座右铭。希腊人的英勇无畏使我们的民族摆脱了滔天的土耳其人和诡计多端的德国人，我们的英勇无畏将使我们永远保持自由！"
 GRE_evaluate_air_force: "空军"
 GRE_evaluate_air_force_desc: "航空是一门科学，希腊要想迎头赶上，就必须在很短的时间内取得重大进展。有人说，我们应该把精力集中在防御敌方空军上，而不是浪费宝贵的资源试图扩大我们自己的空军。"
 GRE_air_academy: "希腊空军学院"
 GRE_air_academy_desc: "航空军事学院已经存在多年了，但现在是时候开设新的分支机构，为空军本身的扩张做好飞行员准备了。"
 GRE_salonika_airport: "扩建萨洛尼卡机场"
 GRE_salonika_airport_desc: "萨洛尼卡机场是我们向巴尔干半岛南部投射空中力量的最重要的运营基地，需要对其设施进行大规模扩建，以容纳一支庞大的现代化空军。"
 GRE_fighter_focus: "新式战斗机"
 GRE_fighter_focus_desc: "我们的空军可能很小，但如果我们推动战斗机的技术进步，它的可能会让其他国家羡慕不已。"
 GRE_air_production: "扩大空军生产"
 GRE_air_production_desc: "希腊需要更好的设施来建造和容纳我们的战斗机。为了实现这一目标，需要补贴。"
 GRE_radar_focus: "重视雷达"
 GRE_radar_focus_desc: "如果我们不能专注于建立一支更大的空军，那么我们必须专注于防御空军或那些会攻击我们的人，其中最重要的是建立一个雷达网络，作为我们对海洋和天空的眼睛。"
 GRE_antiair_focus: "守望天空"
 GRE_antiair_focus_desc: "防空设施将是我们对抗敌机的最佳防御。我们不需要用自己的飞机把它们击落，相反，我们可以把它们从天上射下来。"
 GRE_dominate_heights: "永远主宰高地"
 GRE_dominate_heights_desc: "我们空军的座右铭是“永远统治高空”，现在天空由我们统治！凭借我们现代化和更新的空军，我们将绝对确定我们将主导最高的高度。"
 GRE_bomber_research: "轰炸机研究"
 GRE_bomber_research_desc: "确保我们的未来取决于我们在敌人有机会触及我们的家园之前就对其实施打击。我们必须投资于针对敌方目标的战略轰炸战略。"
 GRE_hellenic_aleksiptotistes: "伞兵"
 GRE_hellenic_aleksiptotistes_desc: "在现代战争中，我们希望特种部队能从天而降，深入敌后。我们将大力开展训练，使这一想法成为现实。"
 GRE_cas_research: "近距支援机研究"
 GRE_cas_research_desc: "为了让地面上的士兵活得更轻松，我们必须从空中发动攻击，我们将投资为步兵提供近距离空中支援。"
 GRE_byzantine_airforce: "飘渺的飞行，闪电的力量"
 GRE_byzantine_airforce_desc: ""
 GRE_evaluate_navy: "好战海军"
 GRE_evaluate_navy_desc: "希腊海军在未来造船问题上存在分歧。一些人主张建造一支庞大而雄心勃勃的海军，以媲美其他强国的声望；而另一些人则建议建造一支规模较小、效率较高的海军，以控制本地水域为目的。"
 GRE_efficient_navy: "高效的海军"
 GRE_efficient_navy_desc: "我们的海军必须专注于功能，控制爱琴海比制造华而不实的“旅行团”要有用得多。"
 GRE_sub_focus: "地中海潜艇"
 GRE_sub_focus_desc: "为打击地中海敌人的海上航线，我们需要能在海下自由巡航的潜艇。一支潜艇舰队将使整个地中海尽在我们掌控之下。"
 GRE_destroyer_focus: "扩大驱逐舰研究"
 GRE_destroyer_focus_desc: "每一只海军都需要屏卫舰，还需要专门用于反潜艇战的船。幸好驱逐舰适用于以上两种条件，所以它们就是我们为实现海军霸权所需要的。"
 GRE_naval_command: "先进海军司令部"
 GRE_naval_command_desc: "我们的海军司令部是海军的中流砥柱。让我们保证我们拥有最棒的，从世界上最好的学院中训练出的海军司令。"
 GRE_ambitious_navy: "雄心勃勃的海军"
 GRE_ambitious_navy_desc: "我们的海军必须成为从古至今最好的。强大的战舰将在地中海赢得战斗，而较小的海军只能望风而逃。"
 GRE_purchase_ships: "造船项目"
 GRE_purchase_ships_desc: "任何一支值得尊敬的海军需要的不仅仅是潜艇和驱逐舰。是时候深入挖掘，让我们的船坞生产出一些真正值得骄傲的舰船了。"
 GRE_athens_shipyard: "扩建雅典造船厂"
 GRE_athens_shipyard_desc: "希腊拥有引以为豪的造船历史——让我们进一步扩大这一历史，使我们能够建立一支远远超过我们这个国家通常拥有的海军。"
 GRE_update_navy: "更新海军技术"
 GRE_update_navy_desc: "如果我们的舰船跟不上现代技术的发展，那么海军规模再大也无济于事。"
 GRE_merchant_marine: "发展商船"
 GRE_merchant_marine_desc: "我们对海军作出新承诺的后果之一，就是翻新我们的船坞和扩大造船业。因此，我们看到了商船海军的增长，在需要时，我们可以调用商船海军来协助我们的战争努力。"
 GRE_hellenic_shipyards: "希腊造船厂"
 GRE_hellenic_shipyards_desc: "在雅典附近的斯卡拉马加斯建造希腊皇家海军造船厂的计划已经出台。这将是希腊最大的造船厂，使我们真正跻身于世界海军行列。"
 GRE_navy_motto: "制海者胜"
 GRE_navy_motto_desc: "我国海军的座右铭是“制海者胜”，而我们曾经比现在更能掌握海洋吗？自千年前的萨拉米斯以来，希腊海军从未如此强大，也从未如此令人畏惧。"
 GRE_cruiser_development: "发展巡洋舰"
 GRE_cruiser_development_desc: "目前，希腊缺乏足够的工业基础来建造足够的战列舰，使它们能够同时出现在我们需要的任何地方。通过建造功能强大、装甲精良的巡洋舰，我们将拥有在多个作战区域争夺制海权的战舰。"
 GRE_hellenic_marines: "希腊海军陆战队"
 GRE_hellenic_marines_desc: "在地中海地区的冲突中，投送两栖力量的能力将是极为宝贵的。我们将建立一支专为两栖作战行动而训练、武装的海军特种部队，以此把海上力量投送至地中海漫长海岸线上的任意一点。"
 GRE_byzantine_navy: "沿海航运和战争"
 GRE_byzantine_navy_desc: ""
 GRE_deus_vult: "神的旨意"
 GRE_deus_vult_desc: "希腊人是敬畏上帝的好人。我们的周围都是异教徒野蛮人。对我们国家的任何攻击都必须被视为对基督教信仰的践踏，作为虔诚的基督徒，我们不会让这种行为逍遥法外。"
 GRE_byz_foreign_policy: "拜占庭外交政策"
 GRE_byz_foreign_policy_desc: "东罗马帝国拥有从直布罗陀到陶里加的土地。作为罗马人的继承者，我们自然希望像我们的祖先很久以前所做的那样，恢复我们在欧洲的统治地位。"
 GRE_the_turkish_byz_plot: "土耳其阴谋"
 GRE_the_turkish_byz_plot_desc: "土耳其人正试图摧毁我们的国家，就像他们400年前所做的那样。我们试图向他们展示良好的治理，但他们拒绝了。"
 GRE_the_final_byz_solution: "最终解决方案"
 GRE_the_final_byz_solution_desc: "我们曾试图与土耳其人一起生活，但事实证明他们太“难缠”了。我们对土耳其问题思考了很长时间，也许我们已经找到了一个可以永久解决问题的答案。"
 GRE_take_what_is_ours_byz: "拿走属于我们的东西"
 GRE_take_what_is_ours_byz_desc: "土耳其人占领希腊土地已近千年。他们剥夺希腊人的权利已有千年之久。我们最终将结束这种压迫，把土地还给希腊人。土耳其人想去哪就去哪，就是不能来这里。"
 GRE_claim_cyprus: "宣称塞浦路斯"
 GRE_claim_cyprus_desc: "塞浦路斯希腊人在英国人的枷锁下苦苦挣扎。我们将谴责盎格鲁野蛮人对希腊人的错误统治，因为他们根本不懂什么是善治。"
 GRE_colonise_anatolia: "殖民安纳托利亚"
 GRE_colonise_anatolia_desc: "我们将把希腊人从大都会重新安置到安纳托利亚，以填补现在的新空间，并重建土耳其人到来之前已存在数千年的老社区。"
 GRE_claim_levant: "宣称黎凡特"
 GRE_claim_levant_desc: "约1500年前，萨拉森人从我们手中夺走了黎凡特。如今，它由法国人和犹太人统治。直到现在，我们才有能力恢复黎凡特的秩序。请放心，机会一到，行动随即展开。"
 GRE_deal_with_arabs: "应对阿拉伯"
 GRE_deal_with_arabs_desc: "阿拉伯的萨拉森人是勇猛的战士。他们能从我们手中夺走埃及、黎凡特和北非。我们将驯服狂野的阿拉伯人。"
 GRE_deal_with_persians: "应对波斯"
 GRE_deal_with_persians_desc: "自霍斯劳时代以来，我们的宿敌波斯人也已衰落。何不利用这一点也许我们可以把一个宿敌改造成一个忠诚的部下。"
 GRE_subordinate_iraq: "附庸伊拉克"
 GRE_subordinate_iraq_desc: "美索不达米亚的阿拉伯人很弱小，被可恶的英国人统治着。我们将为他们提供更好的出路。与其为虚伪的英国帝国服务，他们不如支持正义的罗马帝国。"
 GRE_expedition_africa: "远征非洲"
 GRE_expedition_africa_desc: "埃及人目前被英国人控制着。我们将恢复这个帝国曾经最大的食品生产地区。"
 GRE_world_affairs: "世界事务"
 GRE_world_affairs_desc: "在世界舞台上，希腊已成为一个小国。与我们的先辈相比，这是一种可耻的状态。为了重振帝国，必须改变现状。"
 GRE_purity_byz_laws: "纯度法"
 GRE_purity_byz_laws_desc: "我们的民族是纯正的希腊血统。我们是唯一愿意建立如此庞大帝国的民族，也是唯一能够维持帝国的民族。我们必须保持我们民族的纯洁性，以维护帝国计划。"
 GRE_war_with_albanians: "与阿尔巴尼亚的战争"
 GRE_war_with_albanians_desc: "阿尔巴尼亚人理应由我们统治，而不是拉丁人或共产党人。我们将在阿尔巴尼亚发动战争，为他们带来应有的治理。"
 GRE_take_the_alps: "掌控阿尔卑斯"
 GRE_take_the_alps_desc: "为了保护自己不受日耳曼世界的侵扰，我们必须确保阿尔卑斯山脉的安全，使其成为抵御入侵者的天然屏障。"
 GRE_megali_ellas: "大希腊"
 GRE_megali_ellas_desc: "现在的西西里岛是意大利的穷乡僻壤，曾经是大希腊的一个充满机遇的绿洲。为什么不重建曾经的一切呢？我们需要的只是一场速战速决的战争。趁现在让我们夺回意大利的其他地方，毕竟我们是罗马人。"
 GRE_condemn_bulgarians: "谴责保加利亚"
 GRE_condemn_bulgarians_desc: "保加利亚人是希腊的另一个大敌。虽然他们比土耳其人更文明，但一个独立的保加利亚国是对希腊人的持续威胁。我们将迅速果断地采取行动，平息这一北方威胁。"
 GRE_trip_to_budapest: "布达佩斯之旅"
 GRE_trip_to_budapest_desc: "潘诺尼亚是我们防御的薄弱环节，从可怕的匈奴人及其后继者的入侵就可以看出这一点。入侵者可以随心所欲地大摇大摆地进来掠夺。为了阻止未来的入侵，我们必须确保潘诺尼亚的安全。"
 GRE_take_portugal: "掌控葡萄牙"
 GRE_take_portugal_desc: "加利西亚的拉丁人坚持着古老的伟大主张。当他们不断为暴君或财阀而争吵不休时，我们将为他们提供他们不配拥有的合适的统治者。"
 GRE_visit_spain: "访问西班牙"
 GRE_visit_spain_desc: "就像西哥特人一样，他们的后裔西班牙人也在为小纠纷而四分五裂。查士丁尼利用了西班牙的不稳定，我们为什么不能呢？"
 GRE_war_with_belarus: "与白俄罗斯的战争"
 GRE_war_with_belarus_desc: "白俄罗斯人是迷途的罗斯人，我们可以将他们带回神圣的东正教。"
 GRE_war_with_ukraine: "与乌克兰的战争"
 GRE_war_with_ukraine_desc: ""
 GRE_crush_romanians: "击溃罗马尼亚"
 GRE_crush_romanians_desc: "瓦拉几人自称“罗马尼亚”。如果他们至少对罗马帝国表示敬意，我们会觉得很有趣。我们会让他们知道谁才是真正的罗马人。"
 GRE_crush_french: "摧毁法国"
 GRE_crush_french_desc: "法兰克人，西方蛮族当之无愧的优越感之源，就在我们的掌握之中。我们要让他们知道，他们不过是野蛮人的后起之秀。"
 GRE_ally_romanians: "结盟罗马尼亚"
 GRE_ally_romanians_desc: "罗马尼亚人是该地区罗马人的后裔，是罗马帝国的延续。我们将邀请他们与我们一起为罗马梦而奋斗。"
 GRE_ally_serbia: "结盟塞尔维亚"
 GRE_ally_serbia_desc: "斯拉夫人是我们天然的盟友，因为我们信仰一致，同仇敌忾。为什么不让斯拉夫人加入我们的新欧洲呢？"
 GRE_subordinate_serbia: "附庸塞尔维亚"
 GRE_subordinate_serbia_desc: "斯拉夫人一直仰慕我们。斯蒂芬·杜桑试图重建我们的帝国，显示了他的人民的奉献精神。塞尔维亚人民忠于罗马计划。为什么不邀请他们加入我们的帝国呢？"
 GRE_ally_russia: "结盟俄罗斯"
 GRE_ally_russia_desc: "也许有人会说，俄罗斯人的“乌托邦”性格决定了他们不会选择支持我们，但血浓于水，难道不是吗？"
 GRE_remove_russia: "移除俄罗斯"
 GRE_remove_russia_desc: "苏联是自阿提拉以来对基督教最大的威胁。我们必须阻止邪恶的布尔什维克，将世界从他们可怕的幽灵手中解放出来"
 GRE_byzantine_commonwealth: "拜占庭联邦"
 GRE_byzantine_commonwealth_desc: "环绕我们领土的各族人民在信仰和文明上团结一致，我们的帝国不是强迫不相干的各族人民为希腊人工作，而是一个为所有民族谋福利的拜占庭联邦。"
 GRE_subjugate_britannia: "征服不列颠"
 GRE_subjugate_britannia_desc: "英国人把他们由前哨站和附庸野蛮人组成的补丁工程称为帝国。"
 GRE_ally_the_armenians: "结盟亚美尼亚"
 GRE_ally_the_armenians_desc: "亚美尼亚人和希腊人有很多共同点。我们都是基督徒，都曾受到土耳其人的压迫。我们都属于安纳托利亚的土地。我们将邀请他们与我们一起走向荣耀。"
 GRE_thessaloniki_conference: "塞萨洛尼基会议"
 GRE_thessaloniki_conference_desc: "亚美尼亚和希腊代表将举行会议，讨论外高加索的未来和亚美尼亚作为高加索霸主的地位。"
 GRE_war_azerbaijan: "与阿塞拜疆的战争"
 GRE_war_azerbaijan_desc: "亚美尼亚人一直受到他们自己的土耳其威胁——阿塞拜疆人的骚扰。我们将帮助我们的亚美尼亚盟友打击土耳其人，使土耳其人的威胁再也不会伤害我们的人民。"
 GRE_war_georgia: "与格鲁吉亚的战争"
 GRE_war_georgia_desc: "格鲁吉亚人是高加索地区另一个争夺霸权的群体，虽然他们不像土耳其人那样可鄙，但亚美尼亚人仍应将他们绳之以法。至少，亚美尼亚人曾对他们有过良好的治理，格鲁吉亚国王就是亚美尼亚人。"
 GRE_deal_kurdistan: "应对库尔德斯坦"
 GRE_deal_kurdistan_desc: "库尔德斯坦是塞夫勒非法建立的。他们占领并残害基督徒。我们要解决这个令人遗憾的问题。"
 GRE_the_royalists_succeed: "保皇派成功"
 GRE_the_royalists_succeed_desc: "国家改革党已经夺取了希腊的政权。王国将复辟！在他们选出希腊国王之前，他们需要稳定自己的统治。"
 GRE_purge_remaining_venizelists: "清除剩余的韦尼泽洛斯派"
 GRE_purge_remaining_venizelists_desc: "新政府已颁布行政命令：政府和军队必须清除那些仍然怀有韦尼泽洛斯主义情绪的人，以免国家再次陷入混乱。"
 GRE_condemn_nationalist_rabble: "谴责民族主义暴徒"
 GRE_condemn_nationalist_rabble_desc: "希腊国民联盟的无知野蛮人和金色黎明的狂热激进分子是对希腊人良好品格的玷污。我们的政府将对这些不稳定的激进分子进行谴责和打击。"
 GRE_take_a_firm_stance_against_republicans: "坚定反对共和派立场"
 GRE_take_a_firm_stance_against_republicans_desc: "我们已经迁就韦尼泽洛斯分子太久了，是时候该结束这场闹剧了。他们毫无荣誉与尊严可言，他们也毫不遵循道德，我们将像赶杀害虫一样，将他们驱逐出希腊！"
 GRE_end_the_national_schism: "结束民族分裂"
 GRE_end_the_national_schism_desc: "共和派是希腊的威胁，他们带来的只是空洞的承诺和分裂。他们只想要对自己最有利的东西；他们就像猪一样。他们偷走了属于希腊的一切。我们将确保他们不再试图毁掉希腊。不自由，毋宁死。"
 GRE_the_question_of_the_royal_succession: "王室继承问题"
 GRE_the_question_of_the_royal_succession_desc: "王国必将复兴！今天，争论已经尘埃落定，不过现在的话题已经转到了国王的人选上：是流放前的格吕克斯堡国王乔治二世，还是更古怪的卢卡斯·卡雷尔？"
 GRE_compromise_with_metaxas: "与梅塔克萨斯妥协"
 GRE_compromise_with_metaxas_desc: "自由思想者是我们的天然盟友。他们的目标是恢复希腊的伟大和我们在阳光下的地位，这与我们的目标不谋而合。邀请他们加入我们的政府，与他们站在同一条战线上，对我们的王国大有裨益。"
 GRE_employ_ideas_of_the_freethinkers: "运用自由思想者的思想"
 GRE_employ_ideas_of_the_freethinkers_desc: "自由思想者所倡导的中央集权、社团主义和民族复兴的思想令人钦佩。由于他们是我们政府的创始人，我们认为将他们的计划落实到我们的国家计划中是最合适的。"
 GRE_align_with_germany: "与德国结盟"
 GRE_align_with_germany_desc: ""
 GRE_purge_metaxism: "清洗梅塔克萨斯派"
 GRE_purge_metaxism_desc: "梅塔克萨斯和他的自由思想者党是对王国的威胁。他们想为自己攫取一切权力；他们只是贪婪的暴君，向希腊人民兜售虚假的承诺。我们将确保永远打垮自由思想者党！"
 GRE_not_bow_valkist_natpop_demands: "抵制极右翼倾向"
 GRE_not_bow_valkist_natpop_demands_desc: "希腊国民联盟和金色黎明的激进分子绝不会满足于我们的任何让步。如果我们让他们一寸，他们就会得寸进尺。我们要向这些后起之秀表明，我们绝不会向他们让步。"
 GRE_align_with_the_west: "与西方结盟"
 GRE_align_with_the_west_desc: ""
 GRE_new_era_monarchism: "君主制新时代"
 GRE_new_era_monarchism_desc: "我们开创了希腊的新纪元。我们仁慈的独裁者公正公平地统治着人民，就像父亲对待自己的孩子一样。他展示了他对人民的爱，希望他们幸福自由。"
 GRE_byzantinists_succeed: "拜占庭派成功"
 GRE_byzantinists_succeed_desc: "摄政议会的卡雷尔派已经成功说服议会一致推选卢卡斯·卡雷尔为希腊的新国王。卢卡斯及其所属的集团将会试图强化与希腊帝国历史的关系。"
 GRE_secure_the_succession: "确保继承安全"
 GRE_secure_the_succession_desc: "王国内部有些人因为国王的瓦拉几家族血统而对他持有偏见。甚至有传言说，一些忠于格吕克斯堡的人会试图确保卢卡斯成为最后一个统治希腊的卡雷尔家族成员。我们必须确保卡雷尔派的政治主导权。以免我们的王国因乔治的无能而灭亡。"
 GRE_a_personal_union: "联合统治"
 GRE_a_personal_union_desc: "罗马尼亚已经很久没有国王了，而我们的国王卢卡斯·卡雷尔就对瓦拉几人的土地有自古以来的宣称。我们必须将我们的君主推上王位，并有可能将罗马尼亚人和希腊人统一在同一个国王之下！"
 GRE_propagade_byzantine_culture_revival: "推动拜占庭文化复兴"
 GRE_propagade_byzantine_culture_revival_desc: "甚至在重建之前，希腊的部分地区就已经开始采用新拜占庭建筑风格。这种艺术之美应该传播到王国的所有土地上，罗马的基础设施和公共服务至今无与伦比！"
 GRE_establish_a_personality_cult: "建立个人崇拜"
 GRE_establish_a_personality_cult_desc: "卢卡斯·卡雷尔的统治为希腊带来了荣耀和繁荣。自然，他是一位值得尊敬的君主。为什么不接受这一事实，让我们的国王受到尊敬呢？"
 GRE_the_greek_culture: "希腊文化"
 GRE_the_greek_culture_desc: "希腊文化是伟大的代名词。从帕特农神庙到狄奥多西城墙，希腊人的成就数不胜数。希腊语是拉丁语和西里尔语的基础。希腊文化不仅是伟大的文化，更是完美的文化。"
 GRE_the_orthodox_religion: "东正教"
 GRE_the_orthodox_religion_desc: "东正教会是谎言海洋中的真理之岛。神圣的东正教保护我们的灵魂，引导我们成为有道德的人。我们应赋予东正教会更大的权力，使其控制我们的法律和教育系统，将基督的价值观灌输到我们文明的方方面面。"
 GRE_education_reform_byz: "教育改革"
 GRE_education_reform_byz_desc: "诚实的爱国主义教育令人钦佩。我们将建立这样一个健康的机构，以确保我们的青少年不参与反社会行为或不尊重我们伟大的王国。"
 GRE_the_divine_mediator: "神圣仲裁者"
 GRE_the_divine_mediator_desc: "国王是神所任命的统治者，被上帝和人民选中来保护他们免受激进主义和不稳定因素的影响。通过在政府各部门之间进行调解，他可以确保自己的意志得到遵从，国家的尊严得到维护，人民的需求也能得到满足。"
 GRE_rule_with_a_velvet_glove: "以天鹅绒手套统治"
 GRE_rule_with_a_velvet_glove_desc: "我们必须对希腊的各个团体伸出外交之手。通过共同努力，我们将促进团结和稳定。希腊确实是一个独裁国家，但它也可以是一个仁慈的国家。"
 GRE_rule_with_an_iron_fist: "铁腕统治"
 GRE_rule_with_an_iron_fist_desc: "我们不能任由人民自生自灭。专制统治是我们保持希腊强大和独立的唯一途径。"
 GRE_a_technocratic_byzantium: "技术官僚拜占庭"
 GRE_a_technocratic_byzantium_desc: "拜占庭帝国值得尊敬和效仿的是他们的技术创新。从叉子到喷火器。拜占庭人是技术进步的典范。为了重振我国人民的聪明才智，我们将营造一种环境，让世界性成为成功的关键。"
 GRE_reinstall_a_controlled_parliament: "重建受控议会"
 GRE_reinstall_a_controlled_parliament_desc: "我们必须支持伟大的希腊民主传统，但就像柏拉图笔下的哲人王一样，君主必须始终引导国家走向一个更加完美与和平的社会。通过赋予君主随心所欲解散议会的重要皇家特权，我们可以确保议会始终得到良好的领导。"
 GRE_permanently_empower_crown: "永久赋予王室权力"
 GRE_permanently_empower_crown_desc: "看来我们的国王对统治的本质还是有所了解的，他一直在更有力地向议会施加自己的意志。他已经获得了足够的支持，足以在必要时推翻民选领导人的权力，这使他远非许多人想象中的人物。"
 GRE_the_mainstream_royalists_glucksburg: "格吕克斯堡派成功"
 GRE_the_mainstream_royalists_glucksburg_desc: "格吕克斯堡派成功说服委员会一致恢复乔治二世的希腊王位，乔治和他的集团将把希腊引向民族主义和专制的道路。"
 GRE_reaffirm_our_claims: "重申我们的宣称"
 GRE_reaffirm_our_claims_desc: "一些韦尼泽洛斯派说，我们不过是为外国人的利益而统治的傀儡，我们会妨碍希腊的首要地位。为了证明他们错得有多离谱，我们将重申我们在马其顿、色雷斯和阿尔巴尼亚的主张。我们对这些土地的权利是以钢铁和鲜血为后盾的。"
 GRE_fund_royalist_youth: "资助青年保皇派"
 GRE_fund_royalist_youth_desc: "为了传承我们祖先的智慧，将传统的价值观保存下来并传承给子孙后代非常重要，我们资助青年组织在我们的孩子中培养爱国主义意识，使他们高举文明的火炬。"
 GRE_promote_class_solidarity: "促进阶级团结"
 GRE_promote_class_solidarity_desc: "工人和老板相互冲突，造成社会和政治混乱的想法是我们所憎恶的。我们将培养阶级合作和团结的精神。工人和老板将携手合作。毕竟，我们都是希腊人。"
 GRE_polish_image_monarchy: "擦亮君主制形象"
 GRE_polish_image_monarchy_desc: "国际社会有一种说法，认为我们是手握重权的可怜的统治者。我国人民知道，这不过是外国的诽谤。但是，我们将在欧洲各地开展外交活动，帮助净化我们的海外形象。"
 GRE_a_militaristic_byzantium: "军事化的拜占庭"
 GRE_a_militaristic_byzantium_desc: "希腊的历史建立在战争之上，从重装步兵到近卫军。正是从我们祖先的创新中，我们将寻求发展一支卓越的战斗部队，以保卫我们的边境，抵御包围我们的敌人。我们的军事战略专家对希腊历史上的军事战术进行了广泛研究，并根据现代需要加以采用，同时我们还支持和培养人民的沙文主义。"
 GRE_return_of_the_empire: "帝国归来"
 GRE_return_of_the_empire_desc: "如同凤凰涅槃，双头鹰再次胜利地屹立在希腊人民的头顶。是时候恢复我们与生俱来的权利了！基督的十字架祝福基督徒！"
 GRE_fascist_byzantium: "拜占庭国家民粹主义"
 GRE_fascist_byzantium_desc: "我们做到了！这座城市是我们的了。现在，当我们把它重建成曾经的伟大城市时，我们将把我们的国家重建为伟大的罗马帝国。"
 GRE_mutual_aid_societies: "互助会"
 GRE_mutual_aid_societies_desc: "我们的政党是作为互助会成立的，因此我们看到了此类机构的价值。我们不会将税收投入噩梦般的官僚机构，以减轻穷人的负担。相反，我们将奖励那些主动支持希腊劳动者的互助会。"
 GRE_anti_communism: "反共"
 GRE_anti_communism_desc: "我们必须向人民宣讲共产党的罪恶。不要听信他们的国际主义谎言，以免这些强盗怪物摧毁我们美丽的希腊，将他们的暴政强加给人民。"
 GRE_establish_tripsylites: "建立特里普西莱特"
 GRE_establish_tripsylites_desc: "特里普西莱特是希腊国民联盟的武装力量。他们遏制敌对党派、颠覆分子和非希腊人。我们应该组建专门负责守卫军队后方的部队，以腾出更多士兵与敌人作战。"
 GRE_secret_police: "秘密警察"
 GRE_secret_police_desc: "为了保护帝国，铲除颠覆者，我们将建立一个不为帝国臣民所知的国家安全机构。他们将保护我们的帝国免受来自内部的威胁。"
 GRE_expell_jews: "驱逐犹太人"
 GRE_expell_jews_desc: "我们曾试图与犹太人共存，但他们太危险了，不能留在帝国。我们很快就会下令将所有犹太人赶出帝国。只有这样，我们才能维护希腊的统一。"
 GRE_deport_turks_albanians_bulgars: "驱逐土耳其人、阿尔巴尼亚人和保加利亚人"
 GRE_deport_turks_albanians_bulgars_desc: "坦率地说，土耳其人、保加利亚人和阿尔巴尼亚人不属于希腊。他们有自己的土地，应该留在自己的土地上。为了从他们的存在中解放希腊的合法土地，我们将把他们赶出希腊，把他们安置在属于他们的地方。"
 GRE_only_greek: "只有希腊人！"
 GRE_only_greek_desc: "我们的希腊土地是希腊的，也只能是希腊的！我们的土地上不应居住其他人，因为我们不居住在他们的土地上。在帝国的大都市里，只有希腊人可以居住，以保持希腊的纯洁性。"
 GRE_anti_monarchism: "反君主主义"
 GRE_anti_monarchism_desc: "君主制一直是外国的控制工具。过去120年的屈辱证明我们是对的。为了确保帝国改造工程继续进行，维护国家完整，我们将称国家为帝国，但绝不加冕为皇帝。"
 GRE_pro_monarchist: "亲君主主义"
 GRE_pro_monarchist_desc: "没有皇帝的罗马对我们来说是一种诅咒。皇帝是国家和公共的化身。必须为一位正统的、有道德的巴西琉斯加冕。这样奥古斯都的遗产才能延续下去。"
 GRE_hellenic_race: "希腊种族"
 GRE_hellenic_race_desc: "列奥尼达和亚历山大属于希腊种族。罗马人仰望的正是我们。是我们成为了罗马人，并将他们的文明延续了一千年。正是我们的种族复兴了有史以来最伟大的国家。我们必须承认希腊种族与生俱来的善良和优越性。"
 GRE_orthodox_spirit: "东正教精神"
 GRE_orthodox_spirit_desc: "神圣的东正教信仰迫使我们希腊人超越琐碎的物质主义，将目光投向神圣。如果我们活得好，死了也无所谓。因此，我们神圣的战士将拥抱东正教精神，高尚地死去，天堂在等着他们。"
 GRE_integrate_venizelists: "整合韦尼泽洛斯派"
 GRE_integrate_venizelists_desc: "韦尼泽洛斯派也希望希腊变得伟大。我们有很多共同点，可以在此基础上建立关系。让我们邀请他们加入我们的政府。"
 GRE_develop_military_industry: "发展军用工业"
 GRE_develop_military_industry_desc: "我们的国家无法生产足够的枪支来满足防御需求。我们被野蛮人包围，他们想要摧毁我们的人民，因此我们必须全面提升我们的战争能力，这样我们的国家才能屹立不倒。"
 GRE_fortify_borders: "加固边界"
 GRE_fortify_borders_desc: "边界已经暴露，野蛮人可以随时入侵。我们必须改变这种状况。大规模的堡垒和碉堡将布满我们的边境。只有这样，我们才能真正安全。"
 GRE_purify_state: "净化国家"
 GRE_purify_state_desc: "认为野蛮人应该对希腊人有发言权或统治权是危险的。野蛮人从未也不可能创造出希腊人所能创造的东西。他们总是偏袒自己的人民，牺牲希腊人的利益。从现在起，只有希腊人才能统治希腊人。野蛮人将被迫得到希腊统治者的祝福。"
 GRE_everything_for_state: "一切为了国家"
 GRE_everything_for_state_desc: "国家是人民的体现。因此，如果人民为国家工作和战斗，他们就是在为人民工作和战斗。我们所做的一切都是为了人民。所有反对国家的人都是在反对人民。应将其视为敌人。"
 GRE_new_capital: "新都"
 GRE_new_capital_desc: "我们将向世界展示君士坦丁堡的辉煌。现在，土耳其人的污点已被洗净，正义帝国的王冠也已戴上。在我们的管理下，这座城市将成为世人向往的城市。"
 GRE_emphasize_first_hellenic_civilisation: "强调第一代希腊文明"
 GRE_emphasize_first_hellenic_civilisation_desc: "第一代希腊文明是我们的黄金时代。那是柏拉图、亚里士多德和苏格拉底等伟大哲学家的文明。毕达哥拉斯和阿基米德这样伟大的创新者，还有斯巴达人和雅典人。我们怎能不想复兴、效仿并发扬他们的成就。"
 GRE_athens_corporatism: "雅典法团主义"
 GRE_athens_corporatism_desc: "雅典，我们国家的首都。作为现代希腊人，我们欠古希腊祖先很多。为了与他们取得联系，我们应该采纳他们对商业与国家关系的独到见解，这不仅会使我们的国家富强，也会使我们的人民富裕。"
 GRE_sparta_militarism: "斯巴达军国主义"
 GRE_sparta_militarism_desc: "斯巴达人是尚武精神的缩影。斯巴达人将毕生精力奉献给了战争。作为斯巴达人的后裔，我们有幸也有责任在现代重振这种军国主义精神"
 GRE_the_citizen_soldier: "公民兵"
 GRE_the_citizen_soldier_desc: "希腊公民兵是每个希腊人都应该向往的理想。白天工作，晚上睡觉的普通人，出于对国家和人民的热爱，随时准备拿起武器反抗侵略者。"
 GRE_remember_macedonian_unifiers: "缅怀马其顿统一者"
 GRE_remember_macedonian_unifiers_desc: "亚历山大大帝是我们的偶像；他团结了希腊人，征服了世界。今天的希腊人也像当年一样团结。然而，我们缺少亚历山大的荣耀和雄心。为了创造辉煌的明天我们必须回顾辉煌的过去。"
 GRE_pay_homage_athens: "向[GETATHSPA]致敬"
 GRE_pay_homage_athens_desc: "我们所有伟大的祖先都应该受到尊敬。他们的所有历史都是光荣的历史，我们有幸成为他们的后代，我们应该对祖先的成就表示应有的敬意。"
 GRE_spirit_ares: "阿瑞斯之魂"
 GRE_spirit_ares_desc: "阿瑞斯是古代的战神，也是一个时代的勇气之神，这一概念在当代具有重要的现实意义。当战争随时可能爆发时，我们必须回顾过去，将阿瑞斯尊崇为一种理念，任何士兵，无论多么卑微，都可以为之奋斗。"
 GRE_in_the_name_of_zeus: "以宙斯之名"
 GRE_in_the_name_of_zeus_desc: "宙斯是天空之神，是奥林匹斯山最吉祥、最强大的神，他守护着我们，为我们带来好运。只有在宙斯身上，我们才能看到胜利的曙光，只有当他受到尊敬时，他才会让我们取得胜利。"
 GRE_revive_ancient_greek_ideals: "复兴十二神教"
 GRE_revive_ancient_greek_ideals_desc: ""
 GRE_ancient_greek_orthodoxism: "教会的角色"
 GRE_ancient_greek_orthodoxism_desc: "希腊是一个基督教国家，这是因为我们的历史，而不是因为我们。上帝希望我们为自己的成就感到骄傲。这并不意味着我们应该崇拜偶像和古代人物。我们对上帝的信仰让我们能够崇敬过去"
 GRE_emphasize_second_hellenic_civilisation: "强调第二代希腊文明"
 GRE_emphasize_second_hellenic_civilisation_desc: "第二代希腊文明即今天的拜占庭帝国。它是我们现代希腊人的前身。它使我们成为今天敬畏基督的民族。查士丁尼和阿莱克修斯·科穆宁的古代功绩是现代人的基础。"
 GRE_second_hellenic_civilisation: "第二代希腊文明"
 GRE_the_church: "教会"
 GRE_the_church_desc: "教会是谎言海洋中的真理之岛。神圣的正统教义保护着我们的灵魂，引导我们向善。我们应让正统教会在我们的法律和教育体系中拥有更多权力，将基督的价值观灌输到我们文明的方方面面。"
 GRE_state_orthodoxy: "国立正教"
 GRE_state_orthodoxy_desc: "就像古罗马人一样，我们希腊人坚信神圣的正统信仰。我们将自己的宗教强加于希腊，使其成为正统。希腊现在是异教徒和异端社区的家园。为了再次拯救希腊人的灵魂，我们将用国家的力量奉行真正的信仰。"
 GRE_the_monarchy: "君主制"
 GRE_the_monarchy_desc: "没有皇帝的罗马对我们来说是一种诅咒。皇帝是国家和公共的化身。必须为一位正统的、有道德的巴西琉斯加冕。这样奥古斯都的遗产才能延续下去。"
 GRE_the_state: "国家"
 GRE_the_state_desc: "我们的国家是罗马民族的体现。因此，罗马人民必须对其肃然起敬。我们必须开展一项计划，塑造公民对国家的感情。罗马因人们失去对国家的信仰而灭亡。我们绝不能重蹈祖先的覆辙。"
 GRE_guild_unionism: "行会工联主义"
 GRE_guild_unionism_desc: "现代的工会理念不过是布尔什维克破坏者们的颠覆性胡言乱语。同时，我们也不希望希腊劳动人民被贪婪的资本主义踩在脚下。我们将回顾过去，建立一个类似于中世纪行会的制度。我们将以道德和基督教的方式保护工人阶级。"
 GRE_enrich_countryside: "丰富乡村"
 GRE_enrich_countryside_desc: "自从所谓的第四次十字军东征以来，罗曼尼亚的经济乡村与以前的葱郁极乐世界相比，已经变成了贫穷的穷乡僻壤。为了重建罗马的辉煌，我们必须恢复和保护乡村，全力支持卑微的农民。"
 GRE_anti_barbarian_propaganda: "反蛮族宣传"
 GRE_anti_barbarian_propaganda_desc: "我们是罗马在世界上的光芒。只有我们才是最后的罗马人，而不是拉丁狗、斯拉夫蛮族或土耳其杂种。罗马之光与希腊人同在。从现在起，这一点将在希腊的媒体和教育中得到体现。"
 GRE_the_byzantine_eagle_desc: "拜占庭的双头鹰代表着我们希望重获的一切。我们希望有一天，辉煌和荣耀将屹立在君士坦丁城的上空。野火烧不尽，春风吹又生，罗马必将复兴。"
 GRE_in_spirit_of_constantine: "君士坦丁精神"
 GRE_in_spirit_of_constantine_desc: "罗马末代皇帝君士坦丁十一世·德拉加塞斯·巴列奥略的遗产笼罩着我们。他的英雄主义激励着我们的人民即使希望破灭，也要继续鼓起勇气。他的死是光荣的，是所有罗马人引以为豪的。我们将给予他应得的荣誉。"
 GRE_a_prosperous_empire: "繁荣的帝国"
 GRE_a_prosperous_empire_desc: "罗马帝国为我们提供了一个可以仰望的时代。我们不仅将在文化和精神上重建它的遗产。帝国的辉煌将得以恢复，罗马人的土地将再次令世人艳羡。"
 gre.407.t: "等等，什么？"
 gre.407.d: "今天，士麦那的一个驻军收到了我们在金色黎明的\"朋友\"的奇怪提议。他们以低廉的价格提供了少量军事装备。他们忽略了所有关于他们是如何得到它们的问题。我们应该如何处理这个提议？我们甚至不知道他们是怎么得到这些东西的！"
 gre.407.a: "每一支枪对我们的军队都很重要！"
 gre.407.b: "绝对不行！"
 gre.408.t: "不谙世事"
 gre.408.d: "希腊城市出现了一个意想不到的问题。许多建筑的墙壁上布满了民族主义的象征和宣传。更糟糕的是，年轻人逃离学校助长这种破坏行为。这似乎是一个小问题，但今年我们看到对金色黎明的支持大幅增加。我们应该干预吗？"
 gre.408.a: "应该做点什么！"
 gre.408.b: "不关心"
 gre.412.t: "民族主义民兵问题"
 gre.412.d: "今天是我们决定命运的日子。很长一段时间以来，金色黎明民兵一直是我们对抗帝国主义的非正式盟友。这种现状已经存在了相当长的一段时间，但现在结束了。金色黎明要求我们现在就采取行动。我们应该冒着民主的风险，将他们纳入我们的武装部队，还是用一些武器把他们关起来，并希望希腊在未来几十年内幸存下来。"
 gre.412.a: "管他呢，把金色黎明的领导人带到这里来！"
 gre.412.b: "给他们一些武器，最好祈祷他们忘记这一切"
 gre.420.t: "一个有趣的命题"
 gre.420.d: "自从我们粉碎了奥斯曼帝国的疯狂统治以来，我们在管理安纳托利亚领土上的各种叛乱方面遇到了问题。随着战争的临近，这个问题变得更加明显。但这个问题的解决方案可能比我们想象的要简单——让我们向金色黎明寻求帮助！是的，他们可能不是最好的朋友，但这次我们比以往任何时候都更需要有人来做我们不能做的事情。"
 gre.420.a: "就这么办"
 gre.420.b: "把更多的资源转移给警察"
 gre.413.t: "塞萨洛尼基的又一天"
 gre.413.d: "塞萨洛尼基市有大量的犹太少数民族，当然，不幸的是，也有反犹太主义倾向。针对其他民族人民的暴力行为是这里的日常秩序。我们发现了金色黎明干预这个问题的证据。今天，又一条边界被跨越了。两名暴徒试图在犹太教堂纵火，同时大喊支持金色黎明的判决。最糟糕的是，这种情况有目击者，如果媒体发现了，我们真的完蛋了。"
 gre.413.a: "尽量审查，不要让金色黎明生气"
 gre.413.b: "这一切都要归咎于金色黎明。我受够了这种狗屎"
 gre.414.t: "宙斯万岁！"
 gre.414.d: "没有人认真对待古希腊宗教。没有人会考虑把它从故纸堆里拿回来，对吧？错了。\"希腊主义协会\"近年来正在蓬勃发展。他们收集了所有已知的古代信仰，并将其整合成一个名为\"希腊主义\"的宗教典籍。也许我们应该承认我们的古老信仰是希腊的官方宗教？另一方面，希腊的大多数基督徒可能会对我们的承认感到非常愤怒。"
 gre.414.a: "来吧，我们可以让基督徒相信我们的善意"
 gre.414.b: "你最好为他们找一个好的精神病院"
 gre.415.t: "结局"
 gre.415.d: "我们犯了一个错误。一个将夺去数千人生命的错误。金色黎明突袭了雅典的政府大楼，有效地控制了这座城市。再过几个小时，共和国就会消失。我们不能再内斗了。忠于共和国的士兵将开始对民族主义者进行游击战。协约国知道情况，但似乎干预不符合他们的利益。"
 gre.415.a: "荣耀归于希腊地下国！"
 gre.423.t: "政变"
 gre.423.d: "金色黎明党是一个以极右翼意识形态而闻名的政党，最近通过政变推翻了前政府，控制了政府。他们上台后希腊各界的反应喜忧参半，因为他们的政策和行动一直是争议的主题。\n然而，当敌对政治派别EEE（国民联盟\"希腊人\"）决定对新成立的金色黎明政府发动政变时，紧张局势进一步升级。由于EEE的目标是夺取政权，风险迅速提高，这场权力斗争的结果也不确定了起来。\nEEE的政变企图引起了社会各界对金色黎明崛起的关注和支持。这些持不同政见者希望EEE的政变能够成功推翻政府，带来领导层和政策的改变。\n随着政变的展开，国家面临着一段政治不稳定和动荡加剧的时期。街道上挤满了支持和反对政变企图的抗议者，导致全国各地发生冲突和示威活动。军方在这场权力斗争中的立场变得至关重要，因为他们的忠诚可能会动摇权力平衡。\n新闻媒体密切关注这一事件，猜测政变的潜在结果和影响。国际观察员对局势表示关切，监测事态发展并考虑可能的应对措施。\n然而，由于政变企图的复杂性和流动性，很难确定确切的结果。EEE针对金色黎明政府的政变的命运仍然不确定，该国屏住呼吸，等待新政府是否会被推翻，或者金色黎明是否会成功平息叛乱并保持对权力的控制。"
 gre.423.a: "金色黎明成功地平息了叛乱"
 gre.423.b: "EEE设法推翻了政府"
 first_hellenic_civ: "梅塔克萨斯选择追求第一代希腊文明"
