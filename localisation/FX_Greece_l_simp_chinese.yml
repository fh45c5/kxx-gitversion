 GRE_the_eclipse: "残月显像之时"
 GRE_the_eclipse_desc: "在梅克萨塔斯的授意下，诗人西察·卡赖斯卡季斯被国民联盟与金色黎明推举为希腊政府的新领导人。作为一名士麦那出生，在德国留学多年的希腊知识分子，西察女士对我们的民族主义有一些新的见解，一些更激进，让希腊更加伟大的见解。"
 GRE_esotericism_in_revolution: "将神秘带入革命"
 GRE_esotericism_in_revolution_desc: "我看向那约尔格·利本菲尔斯、阿尔伯特·罗森伯格等等，一个没有神话的民族是无法屹立的，民族神秘主义是民族革命的出路。"
 GRE_revolution_beyond_esotericism: "让革命高于神秘"
 GRE_revolution_beyond_esotericism_desc: "我看向那卡尔·李卜克内西、约瑟夫·戈培尔等等，这些德国革命者抛洒的鲜血让我对坚信，革命社会主义是民族革命的出路。"
 GRE_sons_of_kalais: "皆为卡赖斯卡季斯之嗣"
 GRE_sons_of_kalais_desc: "乔治·卡赖斯卡季斯是希腊独立战争时期希军统帅，为了希腊的独立光荣牺牲。西察与其有着相同的姓氏，早在少女时期，她就将其与乔治·拜伦、拿破仑·波拿巴相提并论，视其为恋爱的偶像。除去私心以外，西察想要以此唤起希腊人独立的精神，将其作为团结右翼的一个精神图腾，一个伟大的英雄史诗。"
 GRE_power_of_guide: "借引路者之威"
 GRE_power_of_guide_desc: "梅克萨塔斯先生是我们的恩人，他对第三希腊文明的追求是同我们一致的，我们必须借助他的威望，来团结这个濒临灭亡的民族。"
 GRE_sons_of_prothemus: "皆为盗火者"
 GRE_sons_of_prothemus_desc: "在神话中，普罗米修斯为人类盗取了火种，爱着世人。我们那些社会主义者革命者，何尝又不是普罗米修斯呢？让我们向他们发出友好的请柬，让他们从国际革命的谬误中回归希腊民族的复兴事业。"
 GRE_national_youth_organization: "国家青年组织"
 GRE_national_youth_organization_desc: "通过国家青年先锋队的制度化训练，将新一代希腊人的肉体与灵魂彻底重塑。民族复兴的根基，始于对绝对忠诚的锻造。"
 GRE_christian_spirit: "正教精神的气力"
 GRE_christian_spirit_desc: ""
 GRE_resist_global_atheism: "抵抗国际无神论运动"
 GRE_resist_global_atheism_desc: "国际无神论运动正在摧毁欧洲的精神，它像一个八爪鱼，通过自己的吸盘，操纵世界各国的意志，腐朽之国无法变革，变革之国变得腐朽。我们知道那只八爪鱼是什么……犹太人！"
 GRE_cut_off_capitalist_vine: "斩断资本主义毒藤"
 GRE_cut_off_capitalist_vine_desc: "资本主义是欧洲文明腐朽的根源，这颗毒藤伴随着三大日耳曼帝国疯长，并视图掐死我们的民族。我从中看出了梅杜萨的恶影，那必要用英仙座的剑斩断她。"
 GRE_spread_socialism: "传播赤色福音"
 GRE_spread_socialism_desc: ""
 GRE_national_beauty: "民族优越性"
 GRE_national_beauty_desc: "从荷马史诗到拜占庭双头鹰，历史证明希腊人注定高于他族。科学、艺术与血脉的纯粹性，皆需以国家意志加以捍卫。"
