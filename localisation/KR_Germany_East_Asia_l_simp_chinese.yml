 GEA_Select_elites_from_the_navy:0 "从海军中挑选精锐"
 GEA_Select_elites_from_the_navy_desc:0 ""
 GEA_Fence_goods_on_the_South_China_black_market:0 "在华南黑市销赃"
 GEA_Fence_goods_on_the_South_China_black_market_desc:0 "为了将手头的财富兑换成可堪一用的物资，我们必须前往东亚的一些黑市上来销赃。然而世上没有不透风的墙，随着黑市交易愈发频繁，我们的行踪也会越来越难以掩盖。"
 GEA_Prepare_for_a_secret_operation:0 "为秘密大行动做准备"
 GEA_Prepare_for_a_secret_operation_desc:0 ""
 GEA_Secret_operation_Niagara_heist:0 "秘密行动：§Y尼亚加拉大劫案§!"
 GEA_Secret_operation_Niagara_heist_desc:0 "尼亚加拉号的保险库里藏着一笔足以令整片海洋为之疯狂的黄金。伯爵准备亲自投入两支海盗船队，把这批财富带回新加坡。"
 GEA_Secret_operation_Oriental_treasures_heist:0 "秘密行动：§R东方珍藏劫案§!"
 GEA_Secret_operation_Oriental_treasures_heist_desc:0 "一批原定运往纽约展出的故宫珍品即将经过南洋。青铜、古瓷与历代书画被封入箱中，押运者相信严密的护卫足以保全这些无价之宝。然而，大洋魔鬼的船队已经盯上他了..."
 GEA_Secret_operation_Rangitane_heist:0 "秘密行动：§k绝密档案§!"
 GEA_Secret_operation_Rangitane_heist_desc:0 "澳大拉西亚正借朗吉塔尼号向加拿大王国运送一批有关海军雷达技术的绝密资料。航运文件将它们藏在再普通不过的货物名目下，但伯爵的耳目已经查明了档案所在。若能将这些文件完整带回新加坡，帝国舰队与航空研究部门都将从中受益。"
 GEA_Secret_operation_Asama_Maru_rescue:0 "秘密行动：§M浅间丸营救行动§!"
 GEA_Secret_operation_Asama_Maru_rescue_desc:0 "德日战争爆发后，日本突袭了使馆城市的德侨聚居区，逮捕了一批颇有身份的德国侨民。其中不仅有商界名流，更有德国金融界与科学界的重要人物。如今，情报显示这些俘虏将被押上浅间丸，转送日本。柏林不能坐视他们沦为敌国的筹码。德属东亚必须出手，在浅间丸抵达目的地前截住这艘船，把我们的同胞带回家。"
 GEA_Secret_operation_Manila_treasury:0 "秘密行动：§O马尼拉金库§!"
 GEA_Secret_operation_Manila_treasury_desc:0 "菲律宾已经独立，美国却不打算让留在群岛上的黄金继续待在原处。一批金条正被秘密装箱，准备从马尼拉转运出境。伯爵的耳目已经嗅到了金库开启的气息——只要抢在这批财富离开我们的视野前截住它，新加坡就能迎来又一次满载而归的航行。"
 GEA_Secret_operation_Black_gold:0 "秘密行动：§P黑金§!"
 GEA_Secret_operation_Black_gold_desc:0 "只要日本仍能与太平洋彼岸做生意，满载原油的船只就会继续驶向它的港口。只要夺下这批黑金，不仅能填满新加坡的储油罐，也能让日本舰队为下一次出航发愁。"
 GEA_Train_seamen_quality:0 "训练海员素质"
 GEA_Train_seamen_quality_desc:0 ""
 GEA_Inspire_loyal_seamen:0 "鼓舞忠诚海员"
 GEA_Inspire_loyal_seamen_desc:0 ""
 GEA_Governors_speaking_tour:0 "总督的巡回演说"
 GEA_Governors_speaking_tour_desc:0 ""
 GEA_Start_pirate_commerce_warfare:0 "开启海盗破交战"
 GEA_Start_pirate_commerce_warfare_desc:0 ""
 GEA_Sabotage_enemy_naval_ports:0 "潜入破坏海军军港"
 GEA_Sabotage_enemy_naval_ports_desc:0 "派遣精锐水手潜入[GEA_pirate_war_target.GetName]的海军基地并破坏军港设施，让敌舰无法安心整备。"
 GEA_Attack_enemy_civilian_shipping:0 "打击[GEA_pirate_war_target.GetName]民用航线"
 GEA_Attack_enemy_civilian_shipping_desc:0 "总督的海盗船队将无限制追猎敌国商船，既有效打击敌国贸易路线，也有效地降低了敌国民众的士气。"
 GEA_Harass_enemy_fleet:0 "袭扰[GEA_pirate_war_target.GetName]舰队"
 GEA_Harass_enemy_fleet_desc:0 "让潜艇伏击敌方舰队与护航船只，迫使他们在每一段航路上放慢脚步。"
#第二次对华远征
 GEA_focus_china_decisions:0 "第二次对华远征"
 GEA_focus_china_decisions_desc:0 "自世界大战结束以来，§g德意志帝国§!便通过扶持中国地方军阀、提供财政贷款与取得商业特许，在这个庞大的东方国家建立起错综复杂的利益网络。§m德华银行与通用东亚公司§!的资本深入中国的铁路、矿业、工业与金融部门，而德国商人则凭借地方政府给予的优惠待遇与经营特权，从中国广阔的市场中获取了丰厚的利润。然而，中国政局的长期动荡、§F民族主义运动§!的兴起，以及§R日本帝国§!的不断渗透，始终威胁着帝国苦心经营的经济霸权。\n\n§g德属东亚§!的职责并非亲自统治中国的每一寸土地，而是确保这个庞大的市场始终向§m德国资本§!敞开大门。我们将通过扩大投资、提供贷款、签订贸易协定及争取新的经营特许，进一步加深中国地方政府对§R德国金融与工业体系§!的依赖。同时，新加坡方面也将利用外交关系与政治影响力，支持那些愿意保障德国权益的地方势力，并在必要时动用帝国的§P军事威望§!维护既有利益。"
 GEA_give_guns_to_lep:0 "宁系军援"
 GEA_give_guns_to_lep_desc:0 ""
 GEA_Reaccept_lep_ports:0 "收回东南口岸"
 GEA_Reaccept_lep_ports_desc:0 "宁系已赢得八省内战。我们将重新接收黑色星期一期间移交的南通、温州、厦门与广州四个口岸，并恢复在东南沿海的据点。"
 GEA_Invest_in_East_China:0 "投资华东"
 GEA_Invest_in_East_China_desc:0 "[FROM.GetNameWithFlag]一直希望推动中国华东地区的经济发展与工业现代化进程，但这些军阀们始终面临资金缺乏的问题。通过提供重建资金与商业投资，监事会与通用东亚公司得以尝试扩大德国资本在华东的影响，并改善政府对德国的态度。"
 GEA_Establish_a_German_funded_enterprise:0 "开办德资企业"
 GEA_Establish_a_German_funded_enterprise_desc:0 "中国地方政府迫切需要外国资本来振兴经济，而德国商人也正寻找新的投资机会。我们可以通过德华银行与通用东亚公司向[FROM.GetNameWithFlag]提供贷款，支持德国企业在当地开办工厂、商行与加工设施。作为交换，当地政府须给予必要的税收优惠与经营保障，使德国资本得以在中国市场站稳脚跟。"
 GEA_Investment_in_the_military_industry:0 "投资军事工业"
 GEA_Investment_in_the_military_industry_desc:0 "连年的军阀混战使中国各地对武器弹药的需求始终居高不下，而落后的兵工厂却难以满足现代战争的需要。我们可以同[FROM.GetNameWithFlag]合作，投资扩建当地的兵工厂，引进德国机床、生产设备与军事技术，并由德国顾问监督生产。如此既能增强合作伙伴的军备生产能力，也能为德国军工企业创造长期收益。"
 GEA_Expand_drug_smuggling:0 "扩大毒品走私"
 GEA_Expand_drug_smuggling_desc:0 "尽管各国政府屡次宣称要禁绝鸦片贸易，中国内陆庞大的烟土市场仍然为走私商人带来惊人的利润。我们可以默许并利用现有的地下贸易网络，扩大毒品经由[FROM.GetNameWithFlag]控制地区的转运与销售，使德国商人与当地掮客从中获益。当然，这种见不得光的生意必须尽可能远离官方文件，以免损害帝国在东方的声誉。"
 GEA_Expand_military_equipment_exports:0 "扩大军械出口"
 GEA_Expand_military_equipment_exports_desc:0 "中国军阀对于德国武器的需求似乎永无止境。克虏伯及其他军火企业完全可以利用这一市场，向[FROM.GetNameWithFlag]扩大出售步枪、机枪、火炮及其他军事装备。德华银行还可为大宗采购提供信贷，使缺乏现款的地方政府也能签订军购合同。每一批运往中国的武器，既意味着帝国工业的新订单，也意味着买家对德国弹药和零件供应的进一步依赖。"
 GEA_Expand_the_export_of_strategic_resources:0 "扩大战略资源出口"
 GEA_Expand_the_export_of_strategic_resources_desc:0 "中国各省拥有大量德国工业所需要的煤炭、金属矿石及其他战略原料，但落后的运输设施与分散的经营制度限制了这些资源的出口。我们可以同[FROM.GetNameWithFlag]签订长期采购协议，投资矿区、仓储和交通设施，并利用德国航运网络将原料运往帝国市场。地方政府能够获得可观的外汇与税收，而德国企业则可确保重要原料的稳定供应。"
 GEA_Build_the_Nanjing_Steel_Factory:0 "建设南京制钢厂"
 GEA_Build_the_Nanjing_Steel_Factory_desc:0 "南京地处长江下游，拥有便利的航运条件，并可从皖南矿区取得铁矿原料，是发展现代钢铁工业的理想地点。我们可以同[FROM.GetNameWithFlag]合作，利用德国资本、冶炼设备与工程技术建设南京制钢厂，为当地铁路、机械制造与军事工业提供钢材。随着生产逐步扩大，南京的工业发展也将同德国设备及技术供应建立更加紧密的联系。"
 GEA_Acquire_the_Nanshan_Iron_Mine:0 "收购南山铁矿"
 GEA_Acquire_the_Nanshan_Iron_Mine_desc:0 "马鞍山南山一带拥有可供工业开采的铁矿资源，其地理位置也便于通过长江水运向南京及其他工业中心供应矿石。我们可以向[FROM.GetNameWithFlag]支付一笔可观的收购款，换取德国企业对矿山的长期经营权及矿石销售控制权。这笔交易能够缓解当地政府的财政困难，但将重要矿产交予外国资本经营，势必引起地方商人与民族主义者的不满。"
 GEA_Develop_the_Xihuashan_Tungsten_Mine:0 "开发西华山钨矿"
 GEA_Develop_the_Xihuashan_Tungsten_Mine_desc:0 "江西大余的西华山蕴藏着丰富的钨矿资源，而钨正是生产高性能工具钢及其他特种合金的重要原料。我们可以同[FROM.GetNameWithFlag]合作，引进德国的采矿机械、选矿技术与经营资本，扩大矿区生产规模，并改善矿石运输条件。西华山的开发将为当地带来新的财政收入，同时为德国冶金与军工企业提供稳定的钨矿来源。"
 GEA_Develop_the_Pangushan_Tungsten_Mine:0 "开发盘古山钨矿"
 GEA_Develop_the_Pangushan_Tungsten_Mine_desc:0 "江西于都的盘古山矿区同样拥有值得开发的钨矿资源，但当地分散的小规模开采与简陋的选矿设施始终限制着矿石产量。我们可以向[FROM.GetNameWithFlag]提供技术与资金支持，整合矿区经营，引进德国选矿机械，并改善矿石外运条件。随着采选效率提高，赣南钨矿不仅能够为地方政府创造更多收入，也将进一步扩大德国企业对这一重要战略资源的采购渠道。"
 GEA_Control_the_Taochong_Iron_Mine:0 "控制桃冲铁矿"
 GEA_Control_the_Taochong_Iron_Mine_desc:0 "安徽繁昌的桃冲铁矿是长江下游重要的铁矿资源之一，其矿石能够通过便利的水陆交通供应南京及周边工业中心。我们可以向[FROM.GetNameWithFlag]提出收购方案，以一笔可观的资金换取德国企业对矿山开采、运输及销售业务的控制权。对于急需财政收入的地方政府而言，这是一笔颇具吸引力的交易，而德国资本则能够进一步掌握华东钢铁工业的原料供应。"
 GEA_Upgrade_the_Huning_Railway:0 "扩建沪宁铁路"
 GEA_Upgrade_the_Huning_Railway_desc:0 "沪宁铁路连接南京、苏州、无锡与上海，是长江下游重要的工商业运输干线。然而，现有的轨道、车站及调度设施已经逐渐难以满足不断增长的货运需求。我们可以同[FROM.GetNameWithFlag]合作，利用德国贷款与铁路技术改良宁锡段的线路设施，扩建货运站场并提高列车运力。这不仅有助于加快华东商品与工业原料的流通，也将提升沿线军队的运输与补给能力。"
 GEA_Construct_the_Hangjiang_Railway:0 "续筑杭江铁路"
 GEA_Construct_the_Hangjiang_Railway_desc:0 "连接杭州与金华的杭江铁路，是打通浙江沿海商业中心与内陆市场的重要工程。我们可以向[FROM.GetNameWithFlag]提供铁路建设贷款，并组织德国工程师参与桥梁、轨道与车站设施的施工，使工程得以继续推进。随着线路逐步建成，浙江内陆的农矿产品将更加便利地运往沿海市场，而德国企业也可通过设备供应与铁路经营取得新的收益。"
 GEA_Complete_the_Zhegan_Railway:0 "贯通浙赣铁路"
 GEA_Complete_the_Zhegan_Railway_desc:0 "围绕浙赣铁路的路权与投资争端，曾是八省联合内部矛盾的重要来源之一。如今，我们有机会通过新的建设协议重新确立德国资本在这条铁路上的地位。总督府将推动[FROM.GetNameWithFlag]接受德国贷款、机车设备及工程技术，完成金华至南昌之间的铁路连接。贯通后的浙赣铁路将便利江西矿产与农产品外运，并为华东内陆提供一条重要的军事运输通道。"
 GEA_Transfer_German_Enterprises:0 "转移德资企业"
 GEA_Transfer_German_Enterprises_desc:0 "随着华东内战落幕，我们可以撤出部分德国企业的设备与资产，并向[FROM.GetNameWithFlag]支付善后补偿。"
 GEA_Issue_a_German_Loan:0 "向[FROM.GetNameWithFlag]发放贷款"
 GEA_Issue_a_German_Loan_desc:0 "通过华东监事会向南京政府提供贷款。对方将从短期中期长期三种期限中选择一项借贷方案；而在现有贷款结清之前，我们也不会再开出新的贷款。"
 GEA_Plan_an_East_China_Coup:0 "筹划政变"
 GEA_Plan_an_East_China_Coup_desc:0 ""
 GEA_lep_coup_capital_default_tt:0 "[FROM.GetName]的§m德资§!影响力至少为§R90§!"
 GEA_lep_coup_military_default_tt:0 "[FROM.GetName]的§g德军§!军事投送至少为§R80§!"
 GEA_lep_coup_capital_dynamic_tt:0 "[FROM.GetName]的§m德资§!影响力至少为§R[?FROM.GEA_coup_capital_requirement|0]§!"
 GEA_lep_coup_military_dynamic_tt:0 "[FROM.GetName]的§g德军§!军事投送至少为§R[?FROM.GEA_coup_military_requirement|0]§!"
 GEA_Intervene_in_East_China:0 "干涉华东局势"
 GEA_Intervene_in_East_China_desc:0 "[FROM.GetNameWithFlag]已经拒绝与德国方面开展合作。为了维护帝国在华东的利益，我们可以转而准备军事干涉，并在§Y30天§!后对其宣战。"
 GEA_warlord_extend_german_loan:0 "以税收担保延长偿债期"
 GEA_warlord_extend_german_loan_desc:0 "将未来税收作为担保，请求德国银行延长§Y60天§!还款期限。"
 GEA_warlord_settle_loan_with_equity:0 "以企业权益抵债"
 GEA_warlord_repay_german_loan_early:0 "宣布提前还款"
 GEA_warlord_repay_german_loan_early_desc:0 "提前结清当前德国贷款，结束偿债倒计时"
 GEA_warlord_default_on_german_loan:0 "把贷款赖账了"
 GEA_warlord_default_on_german_loan_desc:0 "拒绝偿还德国贷款，立即终结还款期限。但这样势必会激怒德国人，使其更加倾向于颠覆我方政权。"
 GEA_Repaying_German_Loan:0 "偿还贷款"
 GEA_Repaying_German_Loan_desc:0 "德国银行要求我们为贷款偿还维持专门的财政与行政安排。"
 GEA_warlord_repay_german_loan_short:0 "德国贷款偿还：短期借贷"
 GEA_warlord_repay_german_loan_medium:0 "德国贷款偿还：中期借贷"
 GEA_warlord_repay_german_loan_long:0 "德国贷款偿还：长期借贷"
 GEA_monitor_german_loan_short:0 "德国贷款偿还：短期借贷"
 GEA_monitor_german_loan_short_desc:0 "三个月期限届满后，借款政权将复偿所有借贷"
 GEA_monitor_german_loan_medium:0 "德国贷款偿还：中期借贷"
 GEA_monitor_german_loan_medium_desc:0 "半年期限届满后，借款政权将复偿所有借贷"
 GEA_monitor_german_loan_long:0 "德国贷款偿还：长期借贷"
 GEA_monitor_german_loan_long_desc:0 "一年期限届满后，借款政权将复偿所有借贷"
 GEA_Dispatch_Military_Advisers:0 "派驻军事顾问团"
 GEA_Dispatch_Military_Advisers_desc:0 ""
 GEA_Dispatch_a_Training_Division:0 "派驻教导师"
 GEA_Dispatch_a_Training_Division_desc:0 ""
 GEA_Subsidise_Seeds_and_Farm_Tools:0 "发放农业补贴"
 GEA_Subsidise_Seeds_and_Farm_Tools_desc:0 ""
 GEA_Restore_Jiangnan_Polder_Dykes:0 "整修江南圩田水利"
 GEA_Restore_Jiangnan_Polder_Dykes_desc:0 "江南圩田依赖堤岸、沟渠与水闸维持收成。我们将与[FROM.GetNameWithFlag]的地方水利机构合作，疏浚淤塞河道、修复失修堤闸，并引进抽水设备，使沿江农田免受旱涝之苦。"
 GEA_Build_Grain_Depots_and_Rice_Mills:0 "兴建粮仓与碾米设施"
 GEA_Build_Grain_Depots_and_Rice_Mills_desc:0 ""
 GEA_Open_Village_and_County_Banks:0 "开设村县银行"
 GEA_Open_Village_and_County_Banks_desc:0 "德国银行将把信贷网络延伸至[FROM.GetNameWithFlag]的县城与乡村，为地方商人和农户提供周转资金。"
 GEA_Enforce_Overdue_Credit_Liquidation:0 "强制清算逾期信贷"
 GEA_Enforce_Overdue_Credit_Liquidation_desc:0 "监事会将要求[FROM.GetNameWithFlag]偿还拖欠信贷，并变卖抵押资产。清算所得可以缓解我们的财政压力，但强硬的催收也会损害当地秩序、德国银行的信誉与亲德商人的地位。"
 GEA_Liquidate_Supervisory_Board_Investments:0 "变现监事会投资"
 GEA_Liquidate_Supervisory_Board_Investments_desc:0 "通过重组债权、出售股权和转移设备，华东监事会可以把在华投资兑换为可支配的资金。"
 GEA_Lep_Map:0 "[613.Owner.GetNameWithFlag]"
 GEA_Lep_Map_DESC:0 "§L合作态度：§L[GEA.GetGEALepCooperation]\n§W-------------§!\n§L当前§![613.Owner.GetName]§L态度：§![GEA.GetGEALepAttitudeValue]/§G100§!\n§L当前§!§m德资§!§L影响力：§![GEA.GetGEALepCapitalInfluence]（[GEA.GetGEALepCapitalInfluenceValue]/§G100§!）\n§L当前§!§g德军§!§L力量投射力度：§![GEA.GetGEALepMilitaryProjection]（[GEA.GetGEALepMilitaryProjectionValue]/§G100§!）\n\n[GEA.GetGEALepRegimeDescription]"
 GEA_Lec_Map:0 "[LEC.GetNameWithFlag]"
 GEA_Lec_Map_DESC:0 "使馆城市承载着列强在华的租界、金融与贸易利益，其政治局势关系着德国在中国的地位。"
 GEA_Take_over_embassy_city:0 "整合使馆城市"
 GEA_Take_over_embassy_city_desc:0 "将上海、天津、宁波、福州、汕头与香港纳入德属东亚的统一行政体系，完成原使馆城市辖区的整合。"
 GEA_Takeover_of_Macau:0 "整合澳门"
 GEA_Takeover_of_Macau_desc:0 "统一澳门的行政与法律制度，将这座贸易港口正式纳入德属东亚的管辖体系。"
 GEA_Take_over_dalian:0 "整合大连"
 GEA_Take_over_dalian_desc:0 "整顿大连的港务与地方行政，将这座北方港口正式纳入德属东亚的管辖体系。"
 GEA_Jap_Map:0 "§Y台湾§!"
 GEA_Jap_Map_DESC:0 "台湾位于东海与南海航路之间，岛上的港口、铁路与工业设施使其成为帝国在西太平洋的重要支点。点击查看台湾相关决议。"
 GEA_Integrate_Taiwan:0 "整合台湾"
 GEA_Integrate_Taiwan_desc:0 "台湾已经处于我们的实际治理之下。随着地方社会对新秩序的顺从加深，总督府将统一岛内行政、财政与公共事务，将台湾正式纳入德属东亚的治理体系。"
