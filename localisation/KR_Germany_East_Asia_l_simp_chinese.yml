 GEA_Expropriation_of_national_enterprises:0 "征收企业"
 GEA_Expropriation_of_national_enterprises_desc:0 ""
 GEA_Philippines:0 "§h[PHI.GetNameWithFlag]§!"
 GEA_Philippines_DESC:0 "菲律宾群岛位于南海与西太平洋之间，其港口与航道对远东海上交通至关重要。\n\n当前菲律宾整合度：§Y[?GEA.GEA_Phi_development|0]§!"
 GEA_Philippines_ger:0 "§R德属菲律宾§!"
 GEA_Philippines_ger_desc:0 "菲律宾，曾经美国的海外殖民地，尽管他们已经获得了独立地位，但实际根本没有任何运转国家的能力。这些菲律宾猴子对我们来说唯一的用处就是抓去充军或是塞进工厂。当然，菲律宾群岛的地理位置也对我们无比重要。作为抵抗日本舰队的头号桥头堡，我们也需要彻底军事化菲律宾，来为之后的战斗做准备。\n\n当前菲律宾整合度：§Y[?GEA.GEA_Phi_development|0]§!"
 GEA_Integrate_phi:0 "整合菲律宾"
 GEA_Integrate_phi_desc:0 ""
 GEA_Modeled_after_American_model:0 "仿照美国模式"
 GEA_Modeled_after_American_model_desc:0 ""
 GEA_Building_Manila:0 "建设马尼拉"
 GEA_Building_Manila_desc:0 ""
 GEA_Fortify_north:0 "强化北方防御"
 GEA_Fortify_north_desc:0 ""
 GEA_Fortify_south:0 "建设棉兰老"
 GEA_Fortify_south_desc:0 ""
 GEA_Burma:0 "§G[BRM.GetNameWithFlag]§!"
 GEA_Burma_DESC:0 "缅甸连接印度洋与中南半岛，其港口、矿产及政治局势关系着德国在地区内的利益。\n\n当前缅甸整合度：§Y[?GEA.GEA_Bruma_development|0]§!"
 GEA_Burma_ger:0 "§R德属缅甸§!"
 GEA_Burma_ger_desc:0 "§L当1925年英国大革命爆发，曾经日不落帝国的庞大殖民版图在一夜之间彻底分崩离析。缅甸，作为这些崩坏殖民地的一部分，在即将陷入军阀割据之时被德意志祖国所拯救，在德意志的调解与干涉下重回君主的统治。我们为缅甸这片土地带来了十余年的稳定与和平，但我们却没有得到应有的尊重，作为回应，我们也只有武力一种选择。现在，孔雀已经成为了我们铁笼中的玩物，至于如何处置，自然也只有一种结果。§!\n\n当前缅甸整合度：§Y[?GEA.GEA_Bruma_development|0]§!"
 GEA_Expand_Burma_Coal_Mines:0 "扩建上掸煤矿"
 GEA_Expand_Burma_Coal_Mines_desc:0 "扩建上掸地区现有煤矿，并将矿务、运输与地方行政纳入统一管理，在增加煤炭供应的同时推进缅甸整合。"
