 GEA_Grant_indigenous_citizenship_desc:0 ""
 GEA_Thailand:0 "§y[SIA.GetNameWithFlag]§!"
 GEA_Thailand_DESC:0 "暹罗位于中南半岛腹地，其外交立场与军事力量影响着马来亚和印度支那的安全。\n\n当前暹罗整合度：§Y[?GEA.GEA_Sai_development|0]§!"
 GEA_Thailand_ger:0 "§R德属暹罗§!"
 GEA_Thailand_ger_desc:0 "暹罗，这个自诩东亚文明国家之一的落后王国如今已经屈服于我们的军靴之下。现在随着我们军事上接管了暹罗全国，将他们整合进德属东亚的统治之下也成为了当今的重点。境内的民族主义者，保皇派，赤色分子与土匪都困绕着我们的整合工作，同时暹罗一团乱麻的经济架构也无疑是雪上加霜。同时暹罗旧政府内部也有不少对我们“颇有微词”的官僚，如何妥善的处置他们与国王也是我们目下不得不谨慎考虑的事。\n\n当前暹罗整合度：§Y[?GEA.GEA_Sai_development|0]§!"
 GEA_Expand_Siam_Coal_Mines:0 "扩建兰纳煤矿"
 GEA_Expand_Siam_Coal_Mines_desc:0 "继续开发兰纳地区已有煤层，改善矿区运输与生产管理，在增加煤炭供应的同时推进暹罗整合。"
 GEA_Integrate_sia:0 "整合暹罗"
 GEA_Integrate_sia_desc:0 ""
 GEA_Recruit_collaborators_among_officers:0 "吸纳军官中合作者"
