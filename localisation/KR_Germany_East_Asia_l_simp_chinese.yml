 GEA_expand_loyalist_recruitment_rolls:0 "扩充忠诚人员名册"
 GEA_train_loyalist_irregular_formations:0 "动员城市预备役"
 GEA_equip_loyalist_reserve_battalions:0 "扩大武装城市警察"
 GEA_finalize_second_echelon_mobilization:0 "敲定第二梯队动员案"
 GEA_infiltrate_unions_and_dock_organizations:0 "渗透工会与码头组织"
 GEA_infiltrate_unions_and_dock_organizations_desc:0 "派遣可靠线人进入工会、搬运队和码头互助会，特工将帮助我们掌握革命者在城市工人中的人员与物资渠道。"
 GEA_support_moderate_national_unions:0 "扶植温和民族工会"
 GEA_support_moderate_national_unions_desc:0 "给予愿意在合法框架内活动的民族工会有限空间，用工资谈判和基层福利争夺激进派的群众基础。"
 GEA_arrest_radical_labor_leaders:0 "逮捕激进劳工领袖"
 GEA_arrest_radical_labor_leaders_desc:0 "依据渗透所得名册展开定点抓捕，在激进派能够发动总罢工前削弱其领导集体。"
 GEA_destroy_viet_cong_liaison_network:0 "捣毁越工联络网"
 GEA_destroy_viet_cong_liaison_network_desc:0 "顺着秘密交通站、印刷点和掩护住所逐层收网，使越工各地支部难以继续协调行动。"
 GEA_cut_border_arms_smuggling:0 "切断边境武器走私"
 GEA_cut_border_arms_smuggling_desc:0 "抽调边防巡逻队封锁山口和河道，破坏革命者从暹罗、云南与华南取得军火的路线。"
 GEA_launch_large_scale_sweeps:0 "大规模扫荡"
 GEA_launch_large_scale_sweeps_desc:0 "投入宪兵、殖民军与地方警备力量，对革命组织经营已久的乡村据点和隐蔽补给区实施连续扫荡。"
 GEA_compile_viet_cong_leadership_dossiers:0 "编制越工头目档案"
 GEA_compile_viet_cong_leadership_dossiers_desc:0 "汇总过去十年的审讯记录、缴获名册与通信档案，为越工各级负责人建立可交叉检索的秘密档案。"
 GEA_turn_viet_cong_couriers:0 "策反越工秘密交通员"
 GEA_turn_viet_cong_couriers_desc:0 "从被捕的交通员与外围成员中筛选可被策反者，用假情报和受控联络逐步接近越工指挥网络。"
 GEA_execute_coordinated_decapitation_strikes:0 "发动协同斩首突袭"
 GEA_execute_coordinated_decapitation_strikes_desc:0 "依据档案与内线提供的时间表，同时突袭多处秘密会议、住所和交通站，力求在同一夜摧毁越工领导层。"
 GEA_catalogue_nationalist_associations:0 "清查民族主义结社"
 GEA_catalogue_nationalist_associations_desc:0 ""
 GEA_infiltrate_vnqdd_cells:0 "渗透越国党支部"
 GEA_infiltrate_vnqdd_cells_desc:0 "派遣线人混入越国党残余组织，在其重建武装网络以前掌握成员、藏身处与联络暗号。"
 GEA_monitor_student_press_networks:0 "监控学生与报刊网络"
 GEA_monitor_student_press_networks_desc:0 "监控学校、报馆和读书会，截断民族主义宣传者招募青年、传播檄文和组织示威的渠道。"
 GEA_cut_nationalist_foreign_funding:0 "切断民族主义者海外资助"
 GEA_cut_nationalist_foreign_funding_desc:0 ""
 GEA_coopt_constitutionalist_elites:0 "拉拢立宪派精英"
 GEA_coopt_constitutionalist_elites_desc:0 ""
 GEA_raid_nationalist_safehouses:0 "捣毁民族主义者安全屋"
 GEA_raid_nationalist_safehouses_desc:0 "根据前期搜集的名册同时突袭秘密住所、武器仓库和交通站，摧毁民族主义者在战争中发动破坏的基础。"
