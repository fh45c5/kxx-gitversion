#民族精神
 GEA_colonial_nation:0 "殖民政府"
 GEA_colonial_nation_desc:0 "尽管德属东亚在与邻国的交往中有一定的自主性，但它本质上是殖民政府。它的国家机器依赖来自德国的力量才能运转和维持，预算案在柏林制定，货币也直接与德国马克挂钩。"
 GEA_colonial_question:0 "东亚殖民政府"
 GEA_colonial_question_desc:0 "德意志的旗帜已经在东亚这片土地上屹立了数十年。即使在世界大战期间，德属东亚也曾誓死捍卫帝国在阳光下的权利，并以舰队和忠诚的军队勇士与协约国奋战到底。然而如今的东亚政府已逐渐腐朽：旧英法殖民遗产、海军辖区、企业巨头办事处、本地保护国与各式临时机构层层堆叠，构成了一套庞杂、低效而缺乏共同目标的殖民机器。随着时间推移，这个本就临时拼凑的机器更是日渐朽坏，诸多因素都在不断侵蚀我们原本平稳的统治。然而，包括总督在内，许多帝国与本土的殖民官僚仍相信，只要舰队还在海上游弋，港口仍悬挂黑白红旗，一切不满都不过是区区噪音。"
 GEA_admirality:0 "£pol_idea 大舰队" 
 GEA_admirality_desc:0 "海军主宰着德属东亚。帝国海军东亚分舰队的规模前所未有，这些漂浮的海上要塞保护着热带天堂不受乱军、海盗、工团主义者和外敌侵扰，也护佑着德意志帝国在亚洲的掌上明珠。对许多殖民官员而言，只要舰队仍能掌控海面，德国对远东的统治便仍有依凭。虽然分离主义和激进主义在丛林、矿区与城市贫民街区中不断滋生，但大舰队仍是确保德国控制这些土地的终极保障。因此，海军是我们的重中之重，一切资源都必须优先为舰队服务。只要舰队仍在，堡垒就不会陷落。"
 GEA_AOG_profit_idea:0 "东亚总局监事会"
 GEA_AOG_profit_idea_desc:0 "通过东亚总局监事会的运作，我们获得了§Y[?GEA_AOG_CITIES_NUMBER]§!个中国沿海重镇的经济与军事特权，这为我们带来了大量的经济利益与军事优势。因此我们需要维持如今中国混乱的局面以维持我们的利益不受损失。\n\n我们将会保卫我们的特权\n§W消费品工厂：§!§Y[?GEA_AOG_CITIES_FACTORIES]% \n§W海军船坞产出：§!§G+[?GEA_AOG_SHIPYARD_loacl]% \n§W贸易协定关系修正：§!§Y+[?GEA_TRADE_FACTOR_local]%"
 GEA_The_quagmire_of_Indochina:0 "深陷印支泥沼"
 GEA_The_quagmire_of_Indochina_desc:0 "印度支那从来不是一片容易统治的土地，而如今德属东亚的官员与军队比任何人都明白这个道理。法国人留下了残破的行政机器，越南宫廷仍在旧日威望与现实屈辱之间摇摆，乡村中的地主、士绅与民族主义者则各怀心思。而早在法占时期，社会主义者们就已经时常发起暴动与叛乱，而在我们接手此地后情况更是恶化。所幸十年前，胡志明及其工团煽动分子被我们的远征军剿灭，这为印度支那带来了为期十年的稳定。\n\n然而，随着殖民统治的时间延长，加之海军政府对本地人力与资源的横征暴敛日趋加剧，游击活动，刺杀与恐怖袭击频率在近年来频率大幅加剧。殖民军与官员则对此焦头烂额又束手无策。印度支那土地上的怒火正在秩序之下快速积蓄，只待一个合适时机迸发而出，燃遍中南半岛。"
 GEA_The_garden_of_the_cartel:0 "卡特尔的后花园"
 GEA_The_garden_of_the_cartel_desc:0 "德属东亚的繁荣并不完全属于总督府。资源开采与航运业早已被德国本土的大银行、工业卡特尔以及各路承包商层层缠住，仅仅为海军政府留下勉强维持军备的利润。大量的资源被苦力发掘出来，再以极低的价格被贱卖给国内的巨头企业。这种结构尽管过去为殖民地带来受益至今的基础设施建设与再度投资，也让行政当局越来越难以独立决策。更加可怕的是，如今德属东亚本就脆弱的经济更是直接与帝国国内的卡特尔们彻底锁死。一旦咆哮的繁荣时代过去，迎接我们的就将是毁灭性的经济崩溃。"
 GEA_gea_army:0 "£pol_idea 德属东亚陆军"
 GEA_gea_army_desc:0 "德属东亚作为帝国在远东的殖民地，其驻扎军队始终以祖国派来的军官、老兵与海军陆战队骨干为核心。然而在十余年中，德属东亚军更多时候只是东亚分舰队的陆上附属，作为守卫港口、镇压骚乱、维持殖民地秩序的辅助力量活动，而非一支真正能够独立承担大战任务的殖民军。这种畸形定位直接导致了兵员数量长期紧缺与装备更新缓慢。\n\n更糟的是，作为军队骨干的德国老兵正在不断流失。我们曾经引以为傲的兵员素质正随着这些人的离去而逐渐远去，而本地兵员难以真正填补缺口。德属东亚军仍然忠诚，却已经越来越难以支撑帝国在东方的秩序。"
