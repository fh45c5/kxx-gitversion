 GEA_Conscription_of_militia:0 "召集忠君派"
 GEA_Conscription_of_militia_desc:0 ""
 GEA_Pro_german_propaganda:0 "亲德宣传"
 GEA_Hawaii:0 "§s夏威夷§!"
 GEA_Hawaii_DESC:0 "夏威夷群岛位于太平洋中部，珍珠港是横跨大洋航线上的重要海军基地。\n\n当前夏威夷整合度：§Y[?GEA.GEA_Hai_development|0]§!"
 GEA_Hawaii_ger:0 "§R德属夏威夷§!"
 GEA_Hawaii_ger_desc:0 "作为太平洋上最为重要的战略基地，夏威夷的珍珠港如今已在我们掌控之下。但日本人不会就此善罢甘休，我们必须在他们发起进攻前完善好珍珠港的防御，以打击联合舰队的嚣张气焰。\n\n当前夏威夷整合度：§Y[?GEA.GEA_Hai_development|0]§!"
 GEA_Integrate_haw:0 "整合夏威夷"
 GEA_Integrate_haw_desc:0 ""
 GEA_Building_haw:0 "强化夏威夷防御"
 GEA_Building_haw_desc:0 ""
 GEA_Building_Honolulu:0 "建设檀香山"
 GEA_Building_Honolulu_desc:0 ""
 GEA_North_Borneo:0 "§R北婆罗洲§!"
 GEA_North_Borneo_desc:0 "婆罗洲，这片被丛林覆盖的表面上的不毛之地实际上蕴藏了大量的财富。难以计数的建材，矿产与对德属东亚分舰队来说性命攸关的石油统统被装进了婆罗洲这个宝箱中。但以如今我们的开发程度，我们只能从中获取极少一部分的资源。如今，我们必须从伐木工作开始，一步步去除婆罗洲上的所有野蛮特征，将其改造成一个为我们输血的供血库。同时，我们只占有婆罗洲北方一小部分，绝大部分的婆罗洲土地被我们南方的邻居荷属东印度紧紧攥在手里，而他们甚至无法开采出这片土地十分之一的财富。如果我们想要把利润最大化，就必须想办法料理我们的好邻居...\n\n当前婆罗洲开发程度：§Y[?GEA.GEA_Borneo_development|0]§!"
 GEA_South_Borneo:0 "§Y荷属婆罗洲§!"
 GEA_South_Borneo_desc:0 "婆罗洲南部仍由荷属东印度统治。沿海港口、矿区和油田为荷兰殖民政府提供着可观的收入，而广袤内陆的开发仍受制于交通不便、行政力量薄弱及地方势力的抵制。对德属东亚而言，荷属婆罗洲既是北部殖民地的邻居，也是德国资本与海军必须重视的资源腹地。若要将全岛的林木、矿产与石油纳入我们的经济体系，就必须先解决同巴达维亚当局的关系。\n\n当前婆罗洲开发程度：§Y[?GEA.GEA_Borneo_development|0]§!"
 GEA_Borneo:0 "§R德属婆罗洲§!"
 GEA_Borneo_desc:0 "婆罗洲，这片被丛林覆盖的表面上的不毛之地实际上蕴藏了大量的财富。难以计数的建材，矿产与对德属东亚分舰队来说性命攸关的石油统统被装进了婆罗洲这个宝箱中。但以如今我们的开发程度，我们只能从中获取极少一部分的资源。现在，我们南边软弱无能的荷兰佬已经仓皇逃离了东印度地区，顺便将整个荷属东印度领土拱手奉上。现在，我们终于能够彻底掌控整个婆罗洲，彻底将土著人与丛林从这里驱逐出去，把一切可用资源都纳入我们掌中了。\n\n当前婆罗洲开发程度：§Y[?GEA.GEA_Borneo_development|0]§!"
 GEA_blood_lumberyard:0 "血汗伐木场"
 GEA_develop_sarawak_oil:0 "沙捞越的石油业务"
 GEA_develop_sarawak_oil_desc:0 "我们目前的石油消耗水平无法维持我们的舰队进行长期的海军行动，不过我们可以通过增加我们在婆罗洲的石油产量并建立石油储备来避免燃料短缺的情况出现。"
 GEA_develop_sarawak_oil_wtt:0 "沙捞越的石油业务"
 GEA_develop_sarawak_oil_wtt_desc:0 "我们目前的石油消耗水平无法维持我们的舰队进行长期的海军行动，不过我们可以通过增加我们在婆罗洲的石油产量并建立石油储备来避免燃料短缺的情况出现。"
 GEA_Expanded_rubber_mining:0 "扩大橡胶开采"
 GEA_Expanded_rubber_mining_desc:0 ""
 GEA_more_mine:0 "不惜代价的开采"
 GEA_more_mine_desc:0 ""
 GEA_attract_migration:0 "吸引外来移民"
 GEA_attract_migration_desc:0 ""
 GEA_Bulldoze_village:0 "推平村庄"
