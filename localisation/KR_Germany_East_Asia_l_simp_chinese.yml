 GEA_Lep_Map_SQI_DESC:0 "§P山东军阀治下§!\n\n§L自德意志帝国海军强租胶州湾、将青岛打造成远东舰队坚不可摧的明珠以来，整个山东半岛便成为拱卫我方北洋门户的战略缓冲带。对华东监事会与通用东亚公司而言，山东的局势走向直接关乎胶济铁路的畅通与克虏伯在鲁矿权的存续。张天然的排外邪教一旦下山夺权，必将危及我方内陆商埠与侨民安全；宋哲元若引北直系势力全面入鲁，亦会令我方在对华博弈中受制于北京。相比之下，尽管张宗昌声名狼藉、贪得无厌，且与奉天和日本人藕断丝连，但这位“三不知将军”亏空的钱袋与对军火的渴求正是我方绝佳的切入点——只要德华银行的贷款与青岛军械库的淘汰步枪源源不断地送往济南，这位军阀便不介意为德意志的远东利益充当看门恶犬。§!"
 GEA_Lep_Map_LEP_DESC:0 "§X宁系军阀治下§!\n\n§L自1926年我方果断干预北伐、助孙传芳稳固东南半壁江山以来，以金陵为中心、囊括富庶长江下游与东南沿海的“八省联合”便一直是德意志在华利益不可撼动的基石。依托《上海会议》后的幕后协定，通用东亚公司不仅将触角延伸至津浦、浙赣与粤汉等铁路大动脉，更借由亚历山大·冯·法肯豪森将军主持的“南京理事会”与钱卓伦领衔的亲德团体“青岛会”，为联帅打造了数支精锐的德械师，换取了沿海诸城广泛的法外特权与矿产垄断。\n\n然而，通用东亚公司近期对浙赣铁路的强行收购，叠加“黑色星期一”引发的柏林金融海啸，彻底撕裂了联合虚伪的繁荣表象。反租界运动引发的罢工与暴乱席卷江南，随着“笑面虎”孙传芳遇刺身亡，两广、湖南与安徽相继叛离，昔日庞大的八省联合瞬间崩解。所幸素以亲德务实著称的苏皖赣巡阅使齐燮元成功稳定了长江一带的局势，使得我们的在华利益不会受到任何影响。相反，随着齐燮元“大帅”坐稳宝座，他一贯的亲德立场能够使我们进一步渗透华东诸省的经济与军事，甚至有机会能让整个联合彻底沦为通用东亚公司董事会予取予求的附庸。§!"
 GEA_Lep_Map_CHI_DESC:0 "§R国民党左派治下§!\n\n§L十年前，当法肯豪森将军麾下的远征军与吴佩孚、孙传芳合力将浩浩荡荡的“北伐”碾碎于长江岸边时，柏林与青岛的观察家们曾乐观地以为，孙中山遗留下来的革命火种已彻底熄灭。然而，无论是在1927年的大溃败还是1932年上海起义的血腥镇压之后，这群顽固的革命党人都未曾真正屈服。在宋庆龄与邓演达的秘密组织下，国民党左派残部潜入群山连绵的闽赣交界地带，利用周荫人治闽的无能与苛政，建立起针插不进的“闽赣游击区”；与此同时，戴春风的“十人团”特务与工团分子则在沿海租界与江南工厂的阴影中伺机而动，借反租界浪潮大肆煽动仇德情绪。\n\n随着孙传芳遇刺与八省联合的轰然崩塌，蛰伏已久的国民党左派终于在福建山区全面起事。流亡巴黎多年的汪精卫正携第三国际的资金、军火与顾问团潜返东南，意图打通出海口，将这场农村暴动升级为席卷全国的“第二次北伐”。在所有中国势力中，这群狂热的民族主义与社会主义信徒对德意志帝国怀有最刻骨的仇恨——他们不仅誓言废除一切不平等条约、无偿没收通用东亚公司在华的全部铁路与厂矿，更与印度支那的丛林叛军暗通款曲。对于新加坡与青岛而言，国民党左派绝非可以交易的旧式军阀，而是一场必须在其燎原之前用铁与血彻底扑灭的赤色瘟疫。§!"
 GEA_Lep_Map_ANQ_DESC:0 "§Y新皖系军阀治下§!\n\n§L盘踞安庆的“掷骰将军”陈调元，向来是北洋官场中最擅长见风使舵的政治赌徒。早年他曾与张宗昌称兄道弟，后背弃奉系改投孙传芳麾下，得以坐镇安徽长达十载，开创了所谓的“新皖系”（又称“宜系”）。在治皖期间，陈调元敏锐地嗅到了民间沸腾的排外情绪，不仅屡次拒绝通用东亚公司的资本入境，更在1932年上海起义时公然违抗孙传芳的调令按兵不动，借此在“反租界联盟”与“朱红会”等民族主义团体中骗取了“爱国名将”的崇高声望，也令北京的吴佩孚将其视作插入南直系腹地的一颗理想钉子。\n\n当孙传芳遇刺、八省联合分崩离析之际，这位野心勃勃的安徽督理终于掷出了他人生中最大的一枚骰子——在芜湖高举“誓逐洋寇”的大旗宣布独立，率领狂热的反租界义勇军顺江东下，直扑南京。对监事会与通用东亚公司而言，陈调元的虚伪远比他的爱国口号更加危险：在其辖区内，自发组织的“锄奸队”正四处猎杀亲德官绅、强行拘捕德籍工程师并没收我方厂矿；而在幕后，深知自身底蕴不足的陈调元正卑躬屈膝地向外部强权乞讨军援。然而，此人终究难逃投机倒把两面三刀之军阀本性。此人一切反租界立场无非是挑动民粹攫取权力的工具，如果我们能够开出足够的加码，这位新江南之主也许会重投我们的怀抱...§!"
 GEA_Lep_Map_Default_DESC:0 "§Y南京的新主人§!\n\n§L[613.Owner.GetName]掌握着南京及其周边的政治中枢。长江下游的商埠、航运与铁路，使这里始终牵动着德国在华利益。新政权尚未被纳入我们熟悉的合作格局，监事会需要重新评估其对租界、德国资本与军事顾问的态度，再决定下一步行动。§!"
 #粤
 GEA_gxc_industrial_credit_support:0 "工业信贷扶持"
 GEA_gxc_industrial_credit_support_desc:0 "两广的地方工业虽然拥有一定基础，但长期受到资金短缺与设备老旧的困扰。我们可以通过德华银行向当地企业提供优惠贷款，支持其更新机械、扩大厂房与改善生产条件。作为交换，接受援助的企业须优先采购德国工业设备，并为德国资本参与经营提供便利。"
 GEA_gxc_pearl_river_customs:0 "接管珠江关税收入"
 GEA_gxc_pearl_river_customs_desc:0 "珠江流域繁忙的航运与进出口贸易，为两广政府带来了可观的关税收入。我们可以利用地方当局对于德国贷款的依赖，要求将部分关税征收与管理权交由德国顾问及金融机构监督，并以关税收入作为偿还贷款的担保。如此一来，德国不仅能够确保债务得到清偿，还将进一步掌握广东财政的重要命脉。"
 GEA_gxc_acquire_military_assets:0 "收购粤省军工资产"
 GEA_gxc_acquire_military_assets_desc:0 "广东省营兵工厂及相关军工设施虽然具备一定的生产能力，却长期受到财政困难与设备落后的限制。我们可以向地方政府提供一笔可观的收购款，取得部分军工企业的资产与经营权，再由德国技术人员负责整顿生产、更新设备。广东当局能够借此缓解财政压力，而德国军火集团则将在华南获得新的生产基地。"
 GEA_gxc_recruit_lingnan_workers:0 "招募岭南技术工人"
 GEA_gxc_recruit_lingnan_workers_desc:0 "广州及珠江三角洲聚集着大量熟悉机械制造、造船与工业加工的技术工人。随着德属东亚工业规模不断扩大，我们可以委托当地商会与劳务机构招募熟练工匠，并为其提供前往新加坡及其他殖民地工业中心工作的机会。这不仅能够缓解德国企业的用工需求，也将进一步加强两广与帝国工业体系之间的联系。"
 GEA_gxc_lease_whampoa_port:0 "承租黄埔军港"
 GEA_gxc_lease_whampoa_port_desc:0 "黄埔扼守广州东部水道，是珠江流域重要的军事与航运据点。我们可以同广东当局商议一项长期租赁协议，取得黄埔部分港口、仓储及修船设施的使用权，并出资改善码头与相关基础设施。德国海军将由此获得更加便利的补给与维修条件，而广东政府则可以利用租金及德国投资改善自身财政。"
 GEA_gxc_expand_industrial_credit:0 "扩大工业信贷"
 GEA_gxc_expand_industrial_credit_desc:0 "随着德国银行在两广的业务不断扩大，当地工业企业对于金马克贷款的需求也日益增长。德华银行可以进一步提高信贷额度，将融资范围扩展至大型工厂、矿业公司及重要基础设施项目，并通过企业股份、固定资产与长期经营合同保障贷款安全。只要两广的工业发展继续依赖德国资金，我们便能够在当地经济事务中取得越来越大的发言权。"
 GEA_gxc_military_contracts:0 "承包广东军需生产"
 GEA_gxc_military_contracts_desc:0 "广东军队对于枪械、弹药、军服及其他军需物资的需求十分庞大，但当地军工企业的生产能力却难以保证稳定供应。我们可以由德国军火集团牵头，同广东政府签订长期军需生产合同，利用当地工厂承担部分制造与装配业务，并由德国企业提供技术、设备及关键零部件。这既能为川流不息的军需订单找到新的生产来源，也能使广东军队进一步依赖德国的工业供应体系。"
 GEA_gxc_pearl_river_industry:0 "扩建珠江工业带"
 GEA_gxc_pearl_river_industry_desc:0 "广州、佛山及珠江三角洲其他城镇拥有密集的商业人口与传统手工业基础，是华南发展现代工业最有潜力的地区。我们可以通过德国资本与地方企业合作，兴建机械、纺织、食品加工及其他制造工厂，并改善沿江电力、仓储与货运设施。随着珠江工业带逐步扩张，德国企业将能够更充分地利用当地劳动力和市场，同时获得长期的工业投资收益。"
 GEA_gxc_xijiang_shipping_concession:0 "取得西江航运经营特许权"
 GEA_gxc_xijiang_shipping_concession_desc:0 "西江贯穿广西与广东，是连接两广内陆与珠江口的重要水运通道。我们可以向地方政府提供资金与船舶，换取西江部分航线的长期经营特许权，并由德国航运企业改善码头、仓储及货运设施。随着德国资本逐渐掌握这条重要的内河运输网络，广西的矿产与农产品将能够更加便利地进入广州市场，而航运收益也将源源不断地流入德国商人的口袋。"
 GEA_gxc_construction_loan:0 "向两广发放建设贷款"
 GEA_gxc_construction_loan_desc:0 "两广政府正在筹划一系列道路、桥梁、港口与公共设施建设工程，但地方财政显然难以独自承担如此庞大的开支。德华银行可以向其提供长期建设贷款，并要求有关工程优先采用德国机械、材料与技术人员。作为偿还保障，地方当局须以部分税收或公共事业收益作为担保。如此既能促进当地经济建设，也能为德国银行与工程企业带来稳定回报。"
 GEA_gxc_guangzhou_enterprises:0 "推动广东电气化"
 GEA_gxc_guangzhou_enterprises_desc:0 "广东的商业与工业发展正在迅速增加对电力的需求，而现有的发电设施及输电网络已逐渐难以满足工厂与城市居民的需要。我们可以鼓励西门子及其他德国电气企业参与广东的电力建设，扩建发电厂、铺设输电线路，并向当地工厂提供现代电动机械。德国企业不仅能够通过设备销售与电力经营取得收益，也将借此进一步巩固在华南工业市场的地位。"
 GEA_gxc_guangdong_sugar:0 "投资广东省营糖业"
 GEA_gxc_guangdong_sugar_desc:0 "广东温暖湿润的气候适宜甘蔗种植，制糖业也一直是当地重要的农产品加工产业。然而，省营糖业企业在设备、资金与生产效率方面仍有不少改善空间。我们可以通过德国银行提供贷款，引进现代制糖机械与加工技术，并争取参与糖厂的经营及产品销售。借助德国资本与海外贸易网络，广东蔗糖将能够进入更加广阔的市场，而德国投资者也可分享糖业发展的利润。"
 GEA_gxc_yuehan_railway:0 "扩建粤汉铁路广东段"
 GEA_gxc_yuehan_railway_desc:0 "粤汉铁路是连接广州与中国内陆的重要交通干线，其广东段的运输能力直接关系着华南商品流通与军队调动的效率。我们可以向两广政府提供铁路贷款、机车车辆及工程技术，协助改善现有轨道、桥梁与车站设施，并扩建重要货运节点。随着铁路运力提高，广东工业品将更加便利地进入内陆市场，而德国企业也可通过设备供应与工程承包获得丰厚收益。"
 GEA_gxc_postwar_relief:0 "协办战后赈济"
 GEA_gxc_postwar_relief_desc:0 "连年的军事冲突使两广部分地区的农业生产、商业运输与地方财政遭受严重破坏，大批民众亟需粮食和基本生活物资。我们可以联合德国商会与地方政府组织赈济，提供粮食、药品与必要的财政援助，并协助恢复受损的道路及公共设施。德国的援助不仅能够改善当地局势，也将使两广政府和民众更加认识到同帝国保持合作所能带来的实际利益。"
 GEA_gxc_trade_routes:0 "恢复粤桂商路"
 GEA_gxc_trade_routes_desc:0 "广东与广西之间的传统商路长期承担着粮食、矿产、木材及其他商品的运输任务，却因地方战乱与层层关卡而屡遭阻断。我们可以协助两广政府恢复主要商业线路，改善沿途道路与货运设施，并推动减少地方之间重复征收的商税。随着粤桂贸易重新活跃，广西的资源将能够更顺畅地运往广州及南洋市场，德国商人也将从中获得新的贸易机会。"
 GEA_gxc_staff_training:0 "开办参谋讲习班"
 GEA_gxc_staff_training_desc:0 "两广军队虽然拥有数量可观的官兵，但地方部队之间的训练与指挥水平参差不齐，缺乏具备现代参谋知识的军官。我们可以派遣德国军事顾问，协助当地政府开办参谋讲习班，教授军事测绘、后勤组织、通信与部队协同等课程。经过德国军事教育培养的新一代军官，不仅能够改善两广军队的指挥效率，也将更加熟悉帝国的军事制度与装备体系。"
 GEA_gxc_transport_reconstruction:0 "修复粤桂交通"
 GEA_gxc_transport_reconstruction_desc:0 "长期的军事冲突使广东与广西之间的道路、桥梁及部分运输设施遭到严重破坏，阻碍了两地之间的人员往来与货物流通。我们可以向当地政府提供工程设备、建设资金与技术顾问，协助修复重要公路、渡口及山地交通线路。这些工程既能够促进两广经济恢复，也有助于提高地方军队的调动效率，并为德国企业深入广西内陆创造更加便利的条件。"
 GEA_gxc_cantonese_business_talks:0 "组织粤商洽谈"
 GEA_gxc_cantonese_business_talks_desc:0 "广东商人拥有深厚的商业传统与遍布华南及南洋的贸易网络，对于德国企业扩大在华投资而言，他们无疑是最值得争取的合作伙伴之一。我们可以邀请广州商会、地方实业家与银行代表举行商务洽谈，讨论贸易融资、工业投资及合资经营等事宜。通过向粤商提供资金、技术与海外市场，德国资本将有机会逐渐融入当地商业体系，而无需完全依赖地方政府的政治支持。"
 GEA_gxc_pearl_river_transport:0 "协办珠江货运"
 GEA_gxc_pearl_river_transport_desc:0 "珠江水系承担着广东内陆与广州港之间大量的商品运输，但现有航运设施与货运管理仍然存在诸多不足。我们可以同地方航运企业合作，提供现代货船、码头装卸设备与仓储设施，并协助改善货运调度和航线管理。德国航运公司由此能够参与珠江流域不断增长的运输业务，为当地商人提供更加可靠的货运服务，同时扩大自身在华南内河贸易中的影响力。"
 GEA_gxc_military_liaison:0 "派遣驻粤联络团"
 GEA_gxc_military_liaison_desc:0 "随着德国同广东当局的军事合作日益密切，现有的外交与商业渠道已经难以满足双方在军备采购、技术援助及安全事务上的沟通需求。我们可以向广州派遣一支由军官、技术顾问与外交人员组成的常驻联络团，负责协调军火供应、军事训练及相关合作项目。此举既能提高双方合作效率，也将使总督府更加及时地掌握广东军政当局的动向。"
 GEA_gxc_guangzhou_trade_office:0 "开设广州商务处"
 GEA_gxc_guangzhou_trade_office_desc:0 "广州是华南最重要的商业中心之一，其繁忙的港口与广阔的内陆市场吸引着越来越多的德国商人。为了更好地协调帝国在当地的经济活动，我们可以设立常驻商务办事处，负责为德国企业提供市场信息、商业咨询与合同协调，并加强同地方商会及政府部门的联系。商务处还将协助德华银行与通用东亚公司寻找新的投资机会，为德国资本进一步进入两广市场铺平道路。"
 GEA_gxc_lingnan_industry:0 "兴办岭南实业"
 GEA_gxc_lingnan_industry_desc:0 "岭南地区拥有丰富的农产品、活跃的商人阶层与不断增长的消费市场，但许多地方产业仍然依靠传统生产方式，缺乏足够的资金与现代技术。我们可以鼓励德国企业同当地实业家合作，投资兴办食品加工、纺织、机械修理及其他民用工业，并通过德国银行提供必要的经营贷款。新的企业能够带动地方生产与就业，而德国资本则可以利用这些合作项目逐步扩大在华南经济中的地位。"
 GEA_GXC_Map:0 "[GXC.GetNameWithFlag]"
 GEA_GXC_Map_DESC:0 "§L合作态度：§![GEA.GetGEAGxcCooperation]\n§W-------------§!\n§L当前§![GXC.GetName]§L态度：§![GEA.GetGEAGxcAttitudeValue]/§G100§!\n§L当前§!§m德资§!§L影响力：§![GEA.GetGEAGxcCapitalInfluence]（[GEA.GetGEAGxcCapitalInfluenceValue]/§G100§!）\n§L当前§!§g德军§!§L力量投射力度：§![GEA.GetGEAGxcMilitaryProjection]（[GEA.GetGEAGxcMilitaryProjectionValue]/§G100§!）\n\n[GEA.GetGEAGxcRegimeDescription]"
 GEA_GXC_Map_Merchant_Puppet_DESC:0 "§m广东商团政府§!\n\n§L当两广的军阀混战与革命风潮在东亚舰队的舰炮威慑下彻底平息后，通用东亚公司董事会与新加坡总督府并未耗费宝贵的德意志兵力去直接管理庞大的华南内陆，而是将广州市长兼商团总长陈廉伯正式推上了南方护政首脑的宝座。不同于以往需要与粤桂军头妥协的脆弱同盟，如今的陈廉伯政权是一座彻底依附于德国远东体系的买办附庸：驻湛江与黄埔的德属东亚警备司令部直接掌握着华南的要塞防务与领空海权，陈廉伯麾下的各县商团民团则被整编为统一的“商团靖卫总队”，专司协助德籍顾问维持弹压工潮、清剿内陆抗德游击队与护卫矿场路桥的治安职责。\n\n陈廉伯与留德学者朱家骅的“广东景星学社”联合主持下，整个南方已按照通用东亚公司董事会的意愿完成了制度化重塑：全套采用德文运行日志的粤汉铁路总局、广州造船厂及黄埔深水港成为受治外法权保护的德资飞地；来自云南个旧的粗锡与两广内陆的钨、锑矿砂经珠江水系汇集广州精炼装船，直运汉堡与威廉港；而省议会则被改造为由丝茶巨贾、汇丰与德华银行买办组成的商会参事院。陈廉伯用华南军政主权的全面让渡，换取了珠江三角洲商绅阶层的账面繁荣，也为德意志帝国锁死了中国漫长的南大门。§!"
 GEA_GXC_Map_German_Puppet_DESC:0 "§g德国傀儡政权治下§!\n\n§L随着华南旧军阀的彻底覆灭与买办代管体制的退场，两广最终迎来了最为激进的企业化改造：来自鲁尔区埃森“山庄别墅”（Villa Hügel）的克虏伯家族次子——年轻的克劳斯·冯·博伦-哈尔巴赫，在通用东亚公司与德意志帝国海军的联合支持下正式出掌广州，将广东与广西整合为由弗里德里希·克虏伯股份公司直接统辖的工业领地。受制于克虏伯家族严苛的“长子独承制”，家族冠名权与埃森总部的最高权柄注定属于其兄长阿尔弗里德；但这名兼具商业野心与飞行员资历的豪门贵公子，却在万里之外的珠江三角洲找到了属于自己的钢铁王国。在沙面与黄埔新落成的克虏伯总办大楼内，一切旧式督军衙门与地方议会均被裁撤，取而代之的是按鲁尔区工厂规章精确运转的矿冶局、铁道部与身着灰黑制服的克虏伯“企业护厂团”。\n\n在克劳斯·冯·博伦-哈尔巴赫的垂直统筹下，两广已不再是一块单纯的贸易租借地，而是直接嵌入德意志帝国全球军工链条的“远东埃森”：粤北的优质钨矿、广西的锰锑矿脉与经滇越路运抵的个旧粗锡，在克虏伯技师的督导下昼夜不停地送入珠江两岸的电炉与精炼厂，化作制造穿甲弹芯与特种装甲钢的战略原料；广州造船厂与黄埔船坞正全力为东亚分舰队扩建驱逐舰泊位与潜艇维修渠，而热爱航空事业的克劳斯本人更在广州城郊辟建了现代化的航空试验场与组装车间，将陈廉伯的商团买办与朱家骅“景星学社”的留德学子悉数编入企业行政流水线。尽管这种将整片华南视作私人车间的高压企业统治随时可能激起内陆矿工与流亡党人的反抗，但只要三圆环的克虏伯徽章仍高悬于珠江口，德属东亚便拥有了一座永不枯竭的军火与重工熔炉。§!"
 GEA_GXC_Map_Merchants_DESC:0 "§m广东商团治下§!\n\n§L随着陈炯明在南宁葬礼风波中遇刺身亡，素以精明强干和乐善好施闻名粤省上流社会的广州市长兼商团总长陈廉伯迅速挺身而出，在“广东各界救粤联合会”与省议会保守派的拥戴下接掌广州大权。依托雄厚的财力与外资军火支援，陈廉伯将各县商团民团与旧粤军残部整编为装备精良的商团防卫军，不仅一举击退了马济旧桂系的东侵、将广西重新纳入广州节制，更联合留德学者朱家骅创建的亲德团体“广东景星学社”，在珠江畔建立起一座完全由商业寡头、买办精英与技术官僚主导的“商人共和国”。\n\n在所有可能的两广执政者中，陈廉伯无疑是德属东亚与通用东亚公司最理想的盟友。自1924年广州商团事变以来，这位粤商巨擘便对国民党与工团工会抱有深刻敌意；在主政广州后，他更毫不犹豫地取缔了激进劳工组织，并邀请通用东亚公司董事会与德华银行全面参与两广的矿业开发、港口扩建与铁路联运。在陈廉伯治下，广州造船厂与粤汉铁路总部的德方管理权固若金汤，整片两广不仅成为了德制商品与克虏伯军火的稳定市场，更化作了拱卫我方香港商贸利益与雷州半岛的坚实屏障。§!"
 GEA_GXC_Map_Federalists_DESC:0 "§h联省派治下§!\n\n§L在叶举统率的粤军挫败了旧桂系的武力逼宫与内部政变图谋后，出身法政学者与民选议员的陈炯明终于结束了双头政治的掣肘，将两广彻底整合为“联省自治运动”的大本营。在广州，改组后的省议会与“中国致公党”全面推行陈炯明撰写的《中华建设方略》：通过确立省宪自治、普及城乡公立学校与现代医疗体系，广东的经济活力与工业产值跃居全华之首；而在政治上，陈炯明一面召开“汕头会议”联络四川、云南、湖南的共和派同道筹建“中华联省共和国”，一面尝试与奉天张作霖就恢复1923年宪法开展南北和谈。\n\n对驻新加坡与广州沙面的德国观察家而言，陈炯明政权呈现出鲜明的两面性：作为一个温和的宪政改革派，他反对国民党式的武力党治与排外暴动，允许德资企业继续在珠江三角洲合法经营；但他对劳工工会的宽容态度令工团主义者在广州工业区得以合法活动，而其致力于建立独立富强的联邦中国、并屡次在外交场合与陈调元等人联手敦促废除外国租界特权的政治抱负，意味着一个由联省派统一的华南终究不会甘心长期充当通用东亚公司的经济后院。§!"
 GEA_GXC_Map_Left_KMT_DESC:0 "§M国民党左派治下§!\n\n§L新加坡情报部门长期担忧的隐患最终在珠江口引爆。自北伐失败以来，表面上服从陈炯明领导、驻防粤东的第十师师长陈铭枢，一直以社会民主主义政党“生产人民党”为掩护，暗中庇护彭湃在海陆丰一带领导的激进农民协会，并为活跃在闽赣山区的国民党左派游击队提供秘密通道。趁着陆荣廷病逝引发的两广政治动荡，陈铭枢果断发动兵变夺取广州并宣告成立“广州人民政府”，令青天白日满地红旗再度插上了越秀山头。\n\n随着陈铭枢政权公开揭下伪装、与福建的汪精卫和宋庆龄中央执行委员会实现合流，德意志帝国在华南的战略态势瞬间急转直下。这支脱胎于北伐“铁四军”的精锐武装对十年前德国远征军攻占广州的旧恨铭记于心：广州造船厂、粤汉铁路总局以及通用东亚公司在珠江三角洲的码头仓库正面临全面查封与国有化，而重新获得广州工业基地与出海口的国民党左派，已具备了发动“第二次北伐”并向德属印度支那输出革命的完整跳板。我方必须立即联合周边反赤军阀，在广东革命政权羽翼丰满之前将其扼杀。§!"
 GEA_GXC_Map_Qiyou_DESC:0 "§R陈其尤的联省派治下§!\n\n§L陈其尤曾任陈炯明秘书，长期经营地方行政与致公党的组织网络。在联省运动建成全国政权之后，他有机会通过国民议会选举接掌执政之职，继续落实陈炯明的《建设方略》，并维系不同共和派别之间的妥协。\n\n这位继任者的上台并不意味着德国重新获得一位听命行事的盟友。联省政府需要海外华侨、地方商界与外国技术，却同样要求维护主权、摆脱不平等条约的束缚。监事会仍可同其维持商业往来，但双方的关系以利益交换为基础，当前态度仍是虚与委蛇。§!"
 GEA_GXC_Map_Old_Guangxi_DESC:0 "§g旧桂系治下§!\n\n§L随着旧桂系元老陆荣廷在南宁病逝，其回族义子兼武卫军统帅马济与越南裔义子陆裕光彻底抛弃了先父与广东文人维持的温和默契。在陆荣廷葬礼上以铁腕除掉陈炯明、并挫败李宗仁新桂系的边境反扑后，不甘心永远充当广东“看门护院”的马济率领强悍的广西各族联军顺西江东下，在第二次粤桂战争中一举攻克广州。与历任两广统治者不同，得胜后的马济断然将两广首府留在了自己的大本营南宁，将富庶的广东降格为供养庞大桂军军费的赋税提款机。\n\n作为一名典型的旧派实力军人，马济对民主宪政或联省理想毫无兴趣，其唯一目标便是巩固旧桂系在华南的绝对霸权，乃至在兵强马壮后自建政府与北方争雄。对德属东亚而言，马济政权既是一个可以交易的军火买主，亦是一个潜在的边疆隐患：旧桂系不仅与北京的直系吴佩孚保持着传统联系，其内部更有越南裔将领陆裕光等跨境人脉，一旦马济选择向外扩张，其兵锋极可能指向中国的其他军阀，且极大可能危害我们在远东的投资与建设。§!"
 GEA_GXC_Map_Right_KMT_DESC:0 "§R新桂系治下§!\n\n§L整整十年的滇桂边境蛰伏，并未磨灭“钢七军”的锋芒。趁着旧桂系元老陆荣廷病逝、南宁内部权力交接不稳的窗口，流亡云南的李宗仁与“小诸葛”白崇禧率领国民革命军第七军越过百色边境，在广西旧部与地方民团响应下一举击溃马济的武卫军，旋即顺西江东下控制广州，将整个两广重新纳入“新桂系”的军事统御之下。作为坚定的国民党右翼实力派，李宗仁与白崇禧在两广推行“三自政策”（自卫、自治、自给）与严格的民团训政，将整顿军备与剿灭闽赣赤色分子视为首要任务。\n\n对驻新加坡与广州的德国当局而言，尽管十年前的北伐干涉曾令双方结下梁子，但李宗仁与白崇禧展现出的高度实用主义，却为双方开启“有限合作”提供了现实基础：新桂系对汪精卫及第三国际扶植的工团左派深恶痛绝，这与我方遏制东南赤潮及印支叛乱的安全诉求不谋而合；同时，急于扩建南宁、柳州兵工厂并换装现代武器的桂军，迫切需要以两广丰富的钨、锑、锡矿产换取克虏伯火炮、毛瑟步枪生产线以及德籍军事顾问的战术指导。只要通用东亚公司避免触碰其主权底线、将单方面特权转化为互利的军火与矿产贸易协定，这支强悍的“钢七军”便能成为我方在华南可以借重的反赤屏障——当然，对其日后北伐问鼎中原的潜在雄心，我方仍需保持审慎关注。§!"
 GEA_GXC_Map_Default_DESC:0 "§R粤系军阀治下§!\n\n§L毗邻德属印度支那与广州湾租借地的广东、广西两省，既是近代中国共和革命的策源地，亦是通用东亚公司在华南最重要的工业与贸易枢纽。1926年秋，当我方远征军自海上突袭并攻占广州、一举端掉国民革命军北伐大本营后，流亡香港的前粤省督理陈炯明与旧桂系元老陆荣廷在德方及直系的默许下重返故地。两人缔结《两广互助防卫条约》，并于1929年名义上并入孙传芳的八省联合，实则依托“广东出钱、广西出枪”的独特双头政治，维持着不受南京节制的高度自治。\n\n在富庶的广东，陈炯明以“中国致公党”与“共和大同盟”为班底推行“广东模范省”建设，大幅削减军费以兴办教育与实业，军权则交由心腹叶举及洪兆麟、杨坤如、邓本殷等粤军将领统辖；与此同时，为制衡陈炯明而被委任为广州市长的商界巨擘陈廉伯，依靠“广州商团”武装与我方通用东亚公司保持着极为密切的合作，确保了广州造船厂、个旧粗锡精炼厂及全套德文运行日志管理的粤汉铁路总部正常运转。而在贫瘠尚武的广西，年迈的陆荣廷携回族义子马济、越南裔义子陆裕光广泛招募各族兵员，建立起强悍的旧桂系陆军。随着1936年春八省联合崩塌，两广省议会已联合推举陈炯明为“两广非常总督”宣布独立；然而，定海神针陆荣廷病入膏肓，一旦这位老帅撒手人寰，粤桂两省的同盟势必破裂，届时无论是潜伏粤东的陈铭枢左派，还是陈兵滇桂边境的李宗仁“钢七军”，都将彻底改写华南棋局。§!"
 #滇
