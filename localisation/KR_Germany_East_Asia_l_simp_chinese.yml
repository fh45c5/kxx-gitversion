 GEA_arms_factory_malaya:0 "军工产业升级"
 GEA_Population_migration:0 "迁居计划"
 GEA_develop_aluminum_deposits:0 "开发[GetNameGEAJohore]的铝矿"
 GEA_develop_aluminum_deposits_desc:0 "我们在[GetNameGEAJohore]发现了丰富并非常适合生产的铝土矿床。尽管初期的投入将是巨大的，但预计产出将足以挽回成本。"
 GEA_develop_aluminum_deposits_wtt:0 "开发[GetNameGEAJohore]的铝矿"
 GEA_develop_aluminum_deposits_wtt_desc:0 "我们在[GetNameGEAJohore]发现了丰富并非常适合生产的铝土矿床。尽管初期的投入将是巨大的，但预计产出将足以挽回成本。"
 GEA_DEI:0 "§Y[DEI.GetNameWithFlag]§!"
 GEA_DEI_DESC:0 "东印度群岛拥有丰富的石油、橡胶与矿产，其航道连接印度洋、南海和太平洋。\n\n当前东印度开发程度：§Y[?GEA.GEA_Dei_development|0]§!"
 GEA_DEI_ger:0 "§R德属东印度§!"
 GEA_DEI_ger_desc:0 "无能的荷兰佬最终还是放弃了他们最后这一点少的可悲的殖民遗产，昔日辉煌一时的海上马车夫，现在犹如一个耄耋老人，却仍旧死死抓着自己为数不多的一点遗产，不愿将它交给真正配得上的人。不过，不论那些荷兰佬如何在背后诅咒我们，最终东印度这片土地还是被交到了我们手上。现在，我们唯一的任务就是将其整合到帝国治下了。\n\n当前东印度开发程度：§Y[?GEA.GEA_Dei_development|0]§!"
 GEA_Integrate_dei:0 "整合东印度"
 GEA_Integrate_dei_desc:0 ""
