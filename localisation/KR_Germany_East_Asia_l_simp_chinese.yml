#保留地文本
 Ostasien.18.t:0 "印度支那联盟发出和平倡议"
 Ostasien.18.d:0 "印度支那叛乱局势已经恶化到了极点。重要的战略位置都落到了越匪的手里，我们难以对付他们。现在印度支那的叛军给我们送来一份和平对话的邀请。尽管人们担心这会被视为一种耻辱，但我们认为当前的明智之举是放弃对该地区的控制权。"
 Ostasien.18.a:0 "不，我们将战斗到底！"
 Ostasien.18.b:0 "我们已经没法继续战斗了"
 Ostasien.60.t:0 "菲律宾爆发社会主义叛乱"
 Ostasien.60.d:0 "随着美国在菲律宾殖民统治的终结，这片群岛陷入了混乱。一批心怀不满的军官联合农民武装和产业工人发动起义，意图推翻现政府并建立社会主义政权。目前尚不明确菲律宾政府军能否镇压叛乱，但若其获得外部支援，必将大大提升其胜算。"
 Ostasien.60.a:0 "秘密增援菲律宾政府军"
 Ostasien.60.b:0 "与我们无关"
 Ostasien.61.t:0 "社会主义者在菲律宾掌权！"
 Ostasien.61.d:0 "菲律宾政府已将权力移交工团主义运动，然而包括巴拉望岛与棉兰老岛在内的南部地区，仍未被新中央政府有效掌控。这或许是我们将其从工团暴政中解放，纳入帝国保护之下的绝佳契机？"
 Ostasien.61.a:0 "派舰队保卫南部岛屿"
 Ostasien.61.b:0 "让他们去吧"
 Ostasien.62.t:0 "巴拉望岛外的德国舰队！"
 Ostasien.62.d:0 "德国将南部地区置于其“保护”之下，还派了支舰队强抢该区。我们该如何应对？"
 Ostasien.62.a:0 "捐躯赴国难，视死忽如归"
 Ostasien.62.b:0 "我们什么都做不到"
 Ostasien.63.t:0 "菲律宾政府倒台"
 Ostasien.63.d:0 "菲律宾政府拒绝与我们交涉。现在，菲律宾的南部岛屿可以归属到德属东亚的殖民地中了，这是德意志帝国辉煌的一天。"
 Ostasien.63.a:0 "非常好"
 Ostasien.64.t:0 "德属东亚舰队确保了菲律宾南部的控制"
 Ostasien.64.d:0 "今天，穆克将军在[GetNameGEASingapore]报告称，德属东亚舰队已经成功地保护了菲律宾南部岛屿，将他们从马尼拉的工团主义政权中解放了出来，这是德意志帝国辉煌的一天。"
 Ostasien.64.a:0 "非常好！"
 Ostasien.65.t:0 "菲律宾向我们宣战"
 Ostasien.65.d:0 "随着马尼拉工团主义政府的成立，东亚舰队果断出兵控制菲律宾南部诸岛。如今菲律宾工团政府竟悍然对我方宣战，此举无异于自取灭亡。"
 Ostasien.65.a:0 "干得好"
 Ostasien.66.t:0 "缅甸社会动乱"
 Ostasien.66.d:0 "在德意志帝国的帮助下获得独立的缅甸正面临着声势浩大的政治危机。在示威游行和抗议活动中，学生和工人们都反对并且要推翻当前的政府。到目前为止，警察部队在镇压抗议者方面完全没有作用。我们是否应该在危机中支持缅甸当前政府？"
 Ostasien.66.a:0 "把舰队派过去，以表我们的立场"
 Ostasien.66.b:0 "与我们无关"
 Ostasien.67.t:0 "德国舰队抵达仰光"
 Ostasien.67.d:0 "今天，一支庞大的德国舰队抵达仰光。德国海军代表团向缅甸政府表示支持。抗议者们被强大的德国舰队吓到了，一些抗议活动也消停了。"
 Ostasien.67.a:0 "德意志的强大之处！"
 Ostasien.68.t:0 "缅甸恢复秩序"
 Ostasien.68.d:0 "缅甸，一个最近面临严重政治危机的年轻共和国，在德属东亚舰队迅速而坚决的行动下恢复了秩序；缅甸大使非常感谢德意志帝国和[GEA.GetLeader]。现在他们寻求与德意志帝国建立更密切的关系，以保护他们的独立和稳定。"
 Ostasien.68.a:0 "保障他们的独立"
 Ostasien.68.b:0 "但我对缅甸这个国家一点印象都没有！"
 Ostasien.207.t:0 "通用东亚公司在中国的影响力上升……"
 Ostasien.207.d:0 "在一个喜忧参半的季节中，我们来自通用东亚公司的合作伙伴已经取得了一些成功。八省联合的大型铁路项目——浙赣铁路的完工和收购使得通用东亚公司可以将影响力进一步传播到中国内陆。尽管有一些对通用东亚公司的行为不满的声音传来，但我们可以放心的认为这是一个好兆头。"
 Ostasien.207.a:0 "都是好事"
 GEA_prussian_force:0 "普鲁士思想"
 GEA_prussian_force_desc:0 "看起来当地人并不适合为海军政府和皇帝效力。尽管这可能制约我们的兵员补充，但是这也可以让我们的部队战斗力更强悍。"
 GEA_language:0 "德国标准"
 GEA_language_desc:0 "我们重组了我们的部队编制，整合了当地人，确保当地的每个士官、军官和指挥官都精通德语，以便我们更好地统一指挥我们的部队。"
