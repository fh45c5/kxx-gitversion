 GEA_Zhili_Map_Pro_German_DESC:0 "§X直系治下§!\n\n面对江南的叛乱烽火与奉天虎视眈眈的兵锋，洛阳的玉帅终究展现出了老练的现实主义手腕。吴佩孚不仅顶住了国会反对党的压力、果断发兵南下助齐燮元平叛，更劝退了曹锟转而提拔老成持重的外交官颜惠庆主持政务；而在幕后，德国公使馆与北京理事会不仅全盘接手并重组了北京的巨额国债，更向直系敞开了帝国军工的宝库。\n\n如今的华北平原已全面纳入德意志的势力范围：克虏伯、西门子与巴斯夫等大型德企投资源源不断地注入华北平原，一座座外资工厂拔地而起；驻华的铁路工程师在直系的请求下开始着手统一各省杂乱的铁轨轨距；而配备全套精良德械的直系新军，正依托坚固的要塞群与内陆铁路网严阵以待，等待有朝一日日本傀儡下的奉天军阀挥师南下。只要我们的直系盟友占据北京一天，德意志的黑白红旗就将继续在这片土地上高高悬挂一天。"
 GEA_Zhili_Map_Anti_German_DESC:0 "§X直系治下§!\n\n十年隐忍一朝翻脸，“玉帅”吴佩孚竟趁八省联合崩塌之机公然倒向安庆的陈调元，而他的橡皮图章曹锟更是站在紫禁城城楼上首次通过无线电向全国广播了煽动性的反帝宣言，高呼“绝不再对柏林唯命是从”。一夜之间，受官方纵容的狂热暴民围攻了北京理事会与德国公使馆，当街焚烧德制商品与德皇草人偶，迫使我方外交官与驻华人士侨民仓皇逃往天津租界；紧接着，北京政府悍然单方面宣布国际债务违约，并将我方在华北苦心经营的德资工厂强行收归国有。\n\n借着这股排外狂潮，吴佩孚将自己与曹锟包装成了所谓“中国独立的哼哈二将”，在直系军头、青年党士官与知识分子之间达成了虚伪的“和谐平衡”。为填补德械断供的空白，北京正四处向奥地利、丹麦与瑞典订购火炮与军舰，并招揽外国流亡军官与白俄雇佣兵。对于青岛与南京而言，这个忘恩负义的洛阳军阀已从昔日的盟友蜕变为鲸吞华东的头号威胁——他迟早会为自己的背叛付出代价。"
 GEA_Zhili_Map_Manchu_DESC:0 "§Y满洲复辟派治下§!\n\n洛阳的“玉帅”为他的傲慢与迟疑付出了生命的代价。当吴佩孚与曹锟踏入太和殿觐见时，留德归来的御弟溥杰与保皇派率领满洲侍卫突然发难，将直系双雄乱枪击毙。在外部强援的策应下，载涛统率的满蒙铁骑与保定少壮派一路南下踏平洛阳与武昌，将直系军阀统治彻底扫入坟墓。“繁荣联盟”被迫解散，而德国驻京人员在骚乱中撤往天津，紫禁城内的爱新觉罗·溥仪终于迎来了所谓的“宣统维新”。\n\n在新组建的立宪朝廷中，三大势力正围绕帝国的未来展开博弈：梁漱溟、晏阳初与康同璧领衔的“新保皇会”力推乡村建设与康有为式的仁政立宪；保定士官与留德“战国策派”组成的“中国青年党”狂热追求国家集权与全面军事化；而载涛、溥杰与川岛芳子把持的“宗社党”则忙于重建现代八旗并将前德资工厂分封予满洲勋贵。更需警惕的是，重掌乾坤的清廷不仅宣布债务违约，更公然宣布了自己的反租界立场，并以此为大旗争取更多的政治资本。至少短时间内，德国的干涉影响力是无法触及到华北平原之上了。"
 GEA_Zhili_Map_Wang_Kemin_DESC:0 "§R华北临时政府§!\n\n§L随着旧北洋武夫的骄兵悍将与紫禁城内的复辟阴谋在炮火中灰飞烟灭，柏林与青岛终于不必再看洛阳将领或满洲王公的脸色行事。在北京理事会与亲德游说集团“繁荣联盟”的直接授意下，曾任中国银行总裁、多次出掌北洋财政部并与各国银团熟稔周旋的浙籍老牌财政官僚王克敏，戴着他那副标志性的深色墨镜步入中南海，出面组建了彻底非军事化的北京政务当局。这位在关余、盐税与外债账本间浸淫半生的金融老手，对所谓的“武力统一”或“大清正统”毫无执念；在他治下，昔日桀骜不驯的各省督军被悉数裁撤，代之以听命于“北四行”财团、繁荣联盟买办与德籍税务司的文官公署及治安警察。\n\n对德属东亚与德华银行而言，王克敏主政的北京是华北局势最省心、最高效的终局形态。曾经困扰中德关系的国债违约风险与排外风潮已被连根拔除：北京新当局不仅全盘承认并由德华银行托管了北洋历年积欠的巨额贸易外债，更将京汉、津浦、正太等北方铁路干线的调度权，以及晋东、直隶煤铁矿区与大冶—汉阳工业走廊的开采权悉数移交克虏伯与通用东亚公司统筹。只要驻津、驻青德军与北京理事会的顾问团牢牢握住华北的警备权柄，这位精明世故的“账房先生”便会兢兢业业地替德意志帝国打理好北方每一座矿井与每一笔税款。§!"
 GEA_Zhili_Map_Yiguandao_DESC:0 "§F一贯道接管下的北京§!\n\n一场超越所有人想象的宗教业火已将紫禁城彻底吞噬。满清宗室为推翻吴佩孚而不惜引狼入室、向泰山一贯道求援，如今终于尝到了饮鸩止渴的恶果：趁着朝廷禁卫军受贿懈怠之际，“第十八代祖师”张天然与“首母”孙素珍指挥狂热的“护教军”、率领什么大刀会与红枪会悍然发动政变，一举攻陷京师、软禁宣统皇帝！随着满洲王公被尽数排挤、世俗官僚遭无情清洗，神神叨叨的传教士与法会彻底取代了内阁与国会。\n\n据传，自诩“济公活佛转世”的张天然已不满足于充当满清的幕后太上皇，正在筹划直接扯下黄龙旗，宣告建立政教合一的新政权。无论谁人当政，这座依靠人海战术与狂热信仰运转的邪教帝国都已向全华军阀与西方列强宣布了自己的野心与反租界立场。面对这群自称刀枪不入、誓言铲除一切外国魔鬼的狂信徒，德属东亚与监事会必须做好迎接乃至干涉第二场“庚子拳乱”的准备。"
 GEA_Zhili_Map_Default_DESC:0 "§X直系治下§!\n\n自1927年德意志帝国果断出兵助直系击溃北伐、并在次年调停第四次直奉战争以来，表面上重悬黄龙旗的“大清国”，便成为了柏林在远东推行“以华制华”战略的北方基石。作为德国金马克与军火援助的交换条件，“玉帅”吴佩孚不得不捏着鼻子接受了爱新觉罗·溥仪的复辟：年轻的宣统皇帝被软禁在紫禁城深处靠打网球与练书法消磨时光，终日酩酊大醉的曹锟则在橡皮图章国会中执掌着名为“和谐社团”的政治白手套，而真正号令华北平原的权柄则牢牢握在坐镇洛阳大营的吴佩孚与蒋百里手中。\n\n为将这头北洋巨兽锁在既定的对华战略轨道上，监事会通过驻京的北京理事会与“繁荣联盟”牢牢把持着北京政府不堪重负的巨额贸易外债、晋东煤铁矿脉以及由留德军官主导的北洋水师。然而，紫禁城内外早已暗流汹涌：吴佩孚与曹锟正密谋通过债务重组摆脱德国控制；国会中的“宗社党”、保定少壮派与所谓的的“新保皇会”无一不对洋人特权咬牙切齿。随着八省联合摇摇欲坠，玉帅的每一个决定都将直接决定德意志华北利益的生死存亡。"
#山东
 GEA_sqi_invest_in_shandong:0 "投资山东"
 GEA_sqi_invest_in_shandong_desc:0 "以青岛的银行与商行为中介，向山东地方政府和商人提供周转资金，协助恢复贸易与税收。作为回报，德国资本将在当地市场获得更稳固的地位。"
 GEA_sqi_establish_german_enterprises:0 "开办山东德资企业"
 GEA_sqi_establish_german_enterprises_desc:0 "将青岛的德资经营网络向山东腹地延伸，由德国商行提供机床、技术和融资，在山东控制的核心地区开办一座新工厂。企业生产归当地政权使用，而销售、设备维护与信贷关系将继续掌握在德国资本手中。"
 GEA_sqi_dispatch_military_advisers:0 "派驻山东军事顾问团"
 GEA_sqi_dispatch_military_advisers_desc:0 "派遣熟悉中国战场的军官协助山东部队整顿训练、参谋工作与军械管理。地方军队将获得作战经验，而我们的顾问也能进一步掌握其编制、补给和指挥体系。"
 GEA_sqi_expand_jinan_arsenal:0 "扩建济南兵工厂"
 GEA_sqi_expand_jinan_arsenal_desc:0 "济南已有的兵工设施可以成为德国军械在山东的生产与维修中心。我们将派遣工程师、引进机床并扩大厂区，使当地军队逐步统一武器供应，也使其更加依赖德国提供的技术和零件。"
 GEA_sqi_upgrade_jiaoji_railway:0 "扩建胶济铁路"
 GEA_sqi_upgrade_jiaoji_railway_desc:0 "胶济铁路将青岛港与济南腹地连接在一起，是德国在山东经营的重要骨架。我们将扩建车站、改善线路和装卸设施并改善济南基础设施，让德国商品、山东物产和军事补给能够更顺畅地通行。"
 GEA_sqi_german_officer_school:0 "设立德式军官讲习所"
 GEA_sqi_german_officer_school_desc:0 "零散的顾问团只能解决眼前的问题。我们将协助山东当局建立常设军官讲习所，以德国教材教授参谋、后勤与步兵协同。由此培养的本地军官将成为维系长期军事合作的纽带。"
 GEA_Shandong_china_Map:0 "[SQI.GetNameWithFlag]"
 GEA_Shandong_china_Map_DESC:0 "§L合作态度：§![GEA.GetGEASqiCooperation]\n§W-------------§!\n§L当前§![SQI.GetName]§L态度：§![GEA.GetGEASqiAttitudeValue]/§G100§!\n§L当前§!§m德资§!§L影响力：§![GEA.GetGEASqiCapitalInfluence]（[GEA.GetGEASqiCapitalInfluenceValue]/§G100§!）\n§L当前§!§g德军§!§L力量投射力度：§![GEA.GetGEASqiMilitaryProjection]（[GEA.GetGEASqiMilitaryProjectionValue]/§G100§!）\n\n[GEA.GetGEASqiRegimeDescription]"
 GEA_SQI_Map_Zhang_DESC:0 "§P张宗昌治下§!\n\n§L随着泰山脚下与德州一带的战事落幕，张宗昌凭借麾下雇佣骑兵与重火力的优势，成功铲除了宋哲元与张天然两大内部威胁。为了彻底切断一贯道与政治的联系，张宗昌扶持对自己感恩戴德的路中节出任新任师尊，将教门改造为顺从省府的宗教团体；同时，他也顺理成章地将独立鸦片种植园收归己有，使威海至青岛之间的烟土贸易公开化，以此填补内战造成的财政窟窿。\n\n然而，连番清剿一贯道残部与安抚哗变士兵的开销，依然令济南省库捉襟见肘。为了维持庞大军队的运转并在江南八省联合崩溃后的乱局中自保乃至扩张，这位“三不知将军”已向外部资本全面敞开大门，围绕高达八十笔的巨额省府债券展开公开竞标。目前，企图重建张宗昌对奉天效忠的日本财阀、使馆城市的西方银行家，以及我方通用东亚公司正围绕济南的债务控股权展开激烈争夺。只要我方及时通过德华银行注入足够贷款，并派遣普鲁士军事顾问协助其整训部队、改善胶济铁路军运调度，便能将这位实用主义军阀牢牢绑在青岛的战车之上，使其成为拱卫胶州湾与牵制华北的得力屏障。§!"
 GEA_SQI_Map_Yiguandao_DESC:0 "§F张天然治下§!\n\n§L泰山之巅的传道者最终战胜了济南督署的枪炮。随着张宗昌政权的覆灭，“天然师尊”张天然率领数万狂热的一贯道教徒、鲁中红枪会与华北大刀会刀客进驻济南，正式宣告成立政教合一的“上清天国”。旧山东省咨议局、督办衙门与负责进出口贸易的世俗官僚机构遭到全面清洗，取而代之的是由一贯道点传师、祭司与管理人组成的神权行政网络，以及薛颠等武术家主持的民团军事训练体系。\n\n在“上清天国”治下，张天然将自己塑造为自义和团运动至孙中山革命一脉相承的精神领袖：省内的鸦片种植园与烟馆被尽数焚毁，大批烟贩与旧官吏遭到公开审判，当地红十字会设施被并入亲附教门的慈善组织“皈一道”与“一心天道龙华圣教会”名下。对青岛乃至新加坡而言，济南的这场神权剧变意味着我方在山东内陆的商业渗透渠道已彻底中断——红枪会与大刀会向来以“驱逐外夷”为精神本源，不仅正加紧向天津租界外围渗透以扶持中国民族工业，更在胶澳租借地边界频繁活动。驻青岛的帝国海军步兵必须全面加强陆路防线戒备，严防庚子年式的排外风潮再次席卷胶东半岛。§!"
 GEA_SQI_Map_Song_DESC:0 "§g宋哲元治下§!\n\n§L在曲阜儒门士绅、北方察哈尔骑手以及北京朝廷的共同支持下，宋哲元成功推翻了声名狼藉的张宗昌政权，结束了齐鲁大地的混乱割据。入主济南后，宋哲元依托“归仁会”倡导的儒家仁政理念，着手恢复传统社会秩序：他一方面严厉取缔了张宗昌时代的鸦片贸易与苛捐杂税，赦免并收编曾抵抗苛政的察哈尔骑兵与民间武装；另一方面促成山东矿业集团与鲁大矿业公司达成和解，使大批此前倒闭的工矿企业得以重新开工，并修复省内受损的铁路网络。\n\n从青岛与通用东亚公司的角度来看，宋哲元的执政展现出了复杂而矛盾的两面性。与狂热排外的一贯道不同，务实的宋督理并不拒绝与青岛恢复正常的铁路货运、矿产开发及山东大学学术合作，这使我方在鲁的基本经济利益得以保全；但在政治与军事层面上，宋哲元对北京的宣统朝廷与吴佩孚大帅保持着高度恭顺，不仅大举采购清廷兵工厂的制式武器，还组织南逃难民成立志愿远征军，随时准备奉北京之命渡过黄河向南用兵。山东实质上已转变为北直系整合华东的战略前哨，我方在与济南保持通商的同时，必须密切提防北京借道齐鲁向胶州湾或江南施加军事压力。§!"
 GEA_SQI_Map_Maintenance_DESC:0 "§G唐仰杜的山东省维持政府§!\n\n§L在德意志远征军的刺刀扫清了山东的旧军阀与狂热教门之后，青岛总督府与通用东亚公司出于控制占领成本及避免过度刺激地方反抗情绪的考量，最终选择了“以华制华”的间接统治方略。在德国公使馆与德华银行的授意下，出身官宦世家、曾于民初历任山东省议会议员、山东省会市政厅总办及铁路局高官的本土名流唐仰杜被推上前台，正式出任重组后的“山东省公署”省长兼财政厅督办。\n\n作为一位深谙济南市政运作、省议会人脉与铁路财务的务实官僚，唐仰杜完美地扮演了德国利益代理人的角色：在政治与治安上，他积极配合青岛驻济最高顾问团推行“全省治安强化运动”，利用整编后的地方保安团与警察队严密清剿潜伏的国民党地下支部及一贯道余党；在经济与财政上，省公署不仅承认了此前济南拖欠德华银行的全部债务，更通过签署一系列排他性路矿特许协定，将省内的煤炭开采、棉花收购与铁路延伸工程全盘交予通用东亚公司及克虏伯承办。通过唐仰杜这座温顺的“山东省公署”，青岛当局无需承担繁重的基层行政包袱，便将整片齐鲁大地化作了德意志远东商业帝国的模范附庸。§!"
 GEA_SQI_Map_German_DESC:0 "§R赫普夫纳与德属山东§!\n\n§L随着东亚海军步兵与机械化纵队沿着胶济铁路长驱直入、一举荡平济南与泰山的割据武装，依靠不可靠的地方军阀充当缓冲带的时代已宣告终结。为了彻底根除齐鲁大地的匪患与排外温床，新加坡与青岛当局决定不再假手华人代理人，而是将胶州湾租借地的直接管辖范围向西延伸至整个山东省境。曾于1900年率鱼雷艇驻防中国沿海、并于1911年出任胶澳总督府参谋长兼代理总督的帝国海军宿将威廉·赫普夫纳少将，正式奉命坐镇济南，主持新成立的山东军政总督署。\n\n凭借早年治理青岛的丰富行政经验，赫普夫纳在山东建立了一套严谨而高效的德式军管体制：各州县的主要交通枢纽、电报局与警察署均由德籍军官与青岛华捕直接接管，溃散的旧军阀残兵与大刀会、红枪会武装在装甲铁道巡逻车的清剿下销声匿迹。与此同时，山东铁路公司与鲁大矿业公司得以将胶济沿线的煤矿、铁矿及济南商埠完全整合进青岛的工业体系之中，威海卫与烟台则被改造为远东舰队北翼的前进补给港。尽管直接占领一省之地需要耗费可观的驻军军费与行政人力，并招致北京政府与关外奉系的强烈忌惮，但飘扬在济南城头与泰山之巅的黑白红军旗，无疑为德意志在华北铸就了一座坚不可摧的桥头堡。§!"
 GEA_SQI_Map_Default_DESC:0 "§g山东政权治下§!\n\n§L[SQI.GetName]的政局仍牵动着德国在华北的铁路、矿业与租界利益。济南、临沂和胶东连接着德方沿海据点与中国内陆，任何新的地方当局都必须决定，究竟要利用德国资本与技术，还是将终结外国特权作为政治号召。\n\n在明确的统治安排形成之前，总督府将通过商会、顾问与外交渠道保持接触，依据对方的实际立场调整合作与防备。§!"
 GEA_china_sqi_attitude_value_high:0 "§G[?GEA.GEA_china_sqi_attitude|0]§!"
 GEA_china_sqi_attitude_value_medium:0 "§Y[?GEA.GEA_china_sqi_attitude|0]§!"
 GEA_china_sqi_attitude_value_low:0 "§R[?GEA.GEA_china_sqi_attitude|0]§!"
 GEA_Shandong_Expedition_Diederichs:0 "山东远征：迪德里希行动"
 GEA_Shandong_Expedition_Diederichs_desc:0 "1897年，迪德里希率领东亚巡洋舰队占领胶州湾，为帝国在山东建立了立足点。如今，[SQI.GetNameWithFlag]已经拒绝与我们合作，德国租界、侨民与企业的利益再次受到威胁。总督府将以当年的登陆行动为先例，筹集兵力与运输船只对山东政权发动战争。"
#中国军阀
 GEA_china_warlord_interaction:0 "对德交涉"
 GEA_china_warlord_interaction_desc:0 "德国在华的资本、顾问与军械既可能帮助我们巩固统治，也可能成为干预内政的工具。我们可以主动寻求资金与实业，借德国之力扩充自身；但每一笔援助都会扩大德属东亚在本地区的影响。能否利用这些资源而不受其摆布，将取决于我们的选择。\n\n§W-------------§!\n§L当前§!§m德资§!§L影响力：§![ROOT.GetGEAWarlordCapitalInfluenceValue]/§G100§!\n§L当前§!§g德军§!§L力量投射力度：§![ROOT.GetGEAWarlordMilitaryProjectionValue]/§G100§!"
 GEA_warlord_region_value_unavailable:0 "§g—§!"
 GEA_warlord_seek_german_investment:0 "寻求德国投资"
 GEA_warlord_import_german_enterprises:0 "引进德资企业"
 GEA_warlord_buy_german_arms:0 "购买德国军械"
 GEA_warlord_expel_german_investment:0 "驱逐德国投资"
 GEA_warlord_expel_low_attitude_tt:0 "对德态度低于§Y20§!"
 GEA_warlord_expel_german_investment_desc:0 ""
 GEA_warlord_restrict_german_investment:0 "限制德资扩张"
 GEA_warlord_restrict_german_investment_desc:0 ""
 GEA_warlord_investigate_german_enterprises:0 "清查德资企业"
 GEA_warlord_investigate_german_enterprises_desc:0 ""
 GEA_warlord_dismiss_german_advisers:0 "遣返德国军事顾问"
 GEA_warlord_dismiss_german_advisers_desc:0 ""
 GEA_warlord_buy_huning_railway:0 "收购德资沪宁铁路"
 GEA_warlord_buy_huning_railway_desc:0 "德国出资改造的沪宁铁路已经投入运营。我们可以通过一笔路权收购协议接管德资持有的收益份额，使这部分经营收益留在本国。"
 GEA_warlord_buy_hangjiang_railway:0 "收购德资杭江铁路"
 GEA_warlord_buy_hangjiang_railway_desc:0 "杭江铁路的建设使浙江内陆市场逐渐繁荣，但一部分收益仍由德国资本掌握。收购这部分德资路权，将让铁路经营更直接地服务于本国财政。"
 GEA_warlord_buy_zhegan_railway:0 "收购德资浙赣铁路"
 GEA_warlord_buy_zhegan_railway_desc:0 "浙赣铁路既是连接浙江与江西的运输动脉，也是德国在华铁路投资的象征。通过收购德资所持的经营收益份额，我们可以把相应收入转入本国，并结束这部分德资路权带来的财政分流。"
 GEA_lep_business_expansion_discount_tt:0 "§L所有华东相关决议的花费§!§G-10§!§L，冷却时间均§!§G-14天§!§L。§!"
#印度支那战争
 GEA_indochina_war_decisions:0 "印度支那战争"
 GEA_indochina_war_decisions_desc:0 "印度支那叛乱已演变为全面战争。然而对抗越工游击队的战争没有明确战线。处处皆是前线，每个戴斗笠的农民都可能是越工分子。为确保德意志帝国的胜利，我们必须不择手段。\n\n§Y叛乱度§!在印度支那的变化：§R[?INC.guerilla_activity|-0]§!\n"
 GEA_Increase_taxation:0 "扩大征税"
 GEA_Increase_taxation_desc:0 ""
 GEA_Slanderous_propaganda:0 "妖魔化宣传"
 GEA_Slanderous_propaganda_desc:0 ""
 GEA_Reorganize_the_command_structure:0 "总参谋部紧急改组"
 GEA_Reorganize_the_command_structure_desc:0 ""
 GEA_Enforcing_the_recruitment_of_soldiers:0 "强征兵员"
 GEA_Enforcing_the_recruitment_of_soldiers_desc:0 ""
 GEA_Activate_liquid_incendiary_bombs:0 "启用液体燃烧弹"
 GEA_Activate_liquid_incendiary_bombs_desc:0 ""
 GEA_Activate_the_gas_bomb:0 "启用毒气弹"
 GEA_Activate_the_gas_bomb_desc:0 "一种由IG法本公司研制的杀虫剂——齐克隆-B已经完成了武器化，并即将被秘密运抵越战前线。据悉这种毒物被认为是极其剧毒的化学药品，总参谋部计划将在前线通过重型轰炸机大规模投放这种毒气弹到前线以及越工后方占领区，以此来尽可能造成客观的杀伤。"
 GEA_Activate_Agent_Orange:0 "启用化学除草剂"
 GEA_Activate_Agent_Orange_desc:0 ""
 GEA_assault:0 "准备大规模突击"
 GEA_assault_desc:0 "我们将在接下来的数十天内持续不断的发起大规模突击，尽管这可能会造成大量的人员与武器的损失，但只要能够突破敌人防线，一切就是值得的。"
 GEA_shelling_on_Saigon:0 "炮击西贡"
 GEA_Zeppelin_decision:0 "部署齐柏林飞艇"
 GEA_Zeppelin_decision_desc:0 "随着海军航空事业的发展，齐柏林飞艇逐渐被德属东亚更先进的海上巡逻机所取代。由于最近发生的印度支那战争，我们的部队产生了一个大胆的想法：让齐柏林飞艇负责印度支那半岛的巡逻任务。这些飞艇还可以向孤立的驻军提供补给和食物。鉴于叛军的防空火力非常差，这个主意很不错。"
 GEA_start_naval_blockade:0 "启动海上封锁"
 GEA_start_naval_blockade_desc:0 "以法国为首的第三国际的舰队可以自由进入南海并向印度支那叛军提供秘密支持，我们决不能容忍这种情况。"
 GEA_Fernspaher_decision:0 "建立远距侦察部队"
 GEA_Fernspaher_decision_desc:0 "激烈的战争暴露了我军的弱点。虽然我们的步兵单位能很好地防御住阵地。但是他们太笨拙，不能灵活作战。所以我们建议从军队中挑选精英士兵，结合山地猎兵和空降猎兵的特殊技能以组成我们自己的精英部队——远距侦察部队来更好地执行这类任务。"
 GEA_review_infantry_combat_lessons:0 "总结步兵作战经验"
 GEA_review_infantry_combat_lessons_desc:0 "印度支那战场已经为我们的步兵积累了足够多的实战教训。通过整理伤亡报告、武器损耗和前线军官的战斗总结，我们能够为未来的军事革新奠定基础。"
 GEA_review_jungle_warfare_experience:0 "总结丛林战经验"
 GEA_review_jungle_warfare_experience_desc:0 "印度支那的密林既吞噬生命，也传授经验。通过汇总前线部队在丛林与森林中的作战记录，我们可以将这些以鲜血换来的教训整理成一套完整的热带作战规范。"
 GEA_adopt_elite_commandos:0 "采用精英突击队"
 GEA_adopt_elite_commandos_desc:0 "从印度支那战场上表现最出色的士兵中选拔骨干，将他们重新编组并实施高强度训练。这样一支规模有限但装备完善的突击部队，将成为应对最艰难战局的锋刃。"
 GEA_Recycling_damaged_weapons_from_the_frontline:0 "回收前线损坏武器"
 GEA_Recycling_damaged_weapons_from_the_frontline_desc:0 ""
 GEA_Improved_rifle_firepower:0 "改良步枪火力"
 GEA_Improved_rifle_firepower_desc:0 ""
 GEA_Ensure_the_reliability_of_the_equipment:0 "确保装备可靠性"
 GEA_Ensure_the_reliability_of_the_equipment_desc:0 ""
 GEA_adopt_elite_commandos_mastery_bonus:0 "精英突击队作战研究"
 GEA_enact_scorched_earth_in_indochina:0 "在[FROM.GetName]实施焦土法令"
 GEA_enact_scorched_earth_in_indochina_desc:0 "有计划地破坏交通与城市、征用物资并疏散乃至屠杀当地人力，使敌军即使夺取[FROM.GetName]也无法立刻利用当地资源。"
 GEA_scorched_earth_state_modifier:0 "焦土法令"
 GEA_relocate_indochina_industry:0 "撤离[FROM.GetName]工业"
 GEA_relocate_indochina_industry_desc:0 "将[FROM.GetName]能够拆卸的工业设备、机床和技术人员转移至印度支那之外，避免这些宝贵资源落入敌手。"
 GEA_suppress_Tonkin:0 "镇压越共在东京的行动"
 GEA_maintain_Tonkin_control:0 "继续维持我们在东京的占领"
 GEA_guerilla_activity_change_tt:0 "§Y叛乱度§!：$RIGHT|-=0$"
 GEA_reinforce_police:0 "加强警察部队"
#帝国殖民办公厅
 GEA_colonial_decisions:0 "帝国殖民办公厅"
 GEA_colonial_decisions_desc:0 "帝国殖民办公厅是德国殖民计划的总监。因此，我们必须通过向他们提供申请才能获得来自祖国的资源或者人力。"
 GEA_steal_manpower_from_home:0 "索要人力"
 GEA_steal_manpower_from_home_desc:0 "随着我们后备人力的枯竭，我们很快就无法维持我们的部队。为了帝国的利益，是时候向帝国殖民办公厅要求从本土增派更多的士兵。"
 GEA_steal_guns_from_home:0 "索要武器"
 GEA_steal_guns_from_home_desc:0 "我们的步兵装备库存即将见底。为了完成皇帝的使命，我们必须向帝国殖民办公厅索要额外的装备。"
 GEA_steal_money_from_home:0 "索要资金"
 GEA_steal_money_from_home_desc:0 "我们的黄金储备即将见底。为了完成皇帝的使命，我们必须向帝国殖民办公厅索要额外的资金。"
 GEA_ask_for_artillery:0 "请求火炮运输"
 GEA_ask_for_artillery_desc:0 "火炮作为战争之王，一旦缺少就将极度打击军队的战斗力。为了完成皇帝的使命，我们必须向帝国殖民办公厅请求火炮运输。"
 GEA_ask_for_truck:0 "请求卡车运输"
 GEA_ask_for_truck_desc:0 "为了维持部队的机动性，大量的卡车与摩托化载具是不可或缺的。为了完成皇帝的使命，我们必须向帝国殖民办公厅请求更多卡车。"
 GEA_Demand_supplies:0 "索要军需品"
 GEA_Demand_supplies_desc:0 "药物，军粮，甚至于一把工兵铲对我们来说都是弥足珍贵。为了完成皇帝的使命，我们必须向帝国殖民办公厅请求尽可能多的军需品支援。"
 GEA_Request_bureaucrat:0 "指派行政官僚"
 GEA_Request_bureaucrat_desc:0 "我们政府中干练的文官数量始终不足。为了完成皇帝的使命，我们必须向帝国殖民办公厅请求指派更多的行政官僚来协助我们管理这里。"
 GEA_Request_field_corps:0 "野战部队支援"
 GEA_Request_field_corps_desc:0 "如今任何支援都显得空洞无力，我们必须向殖民事务部要求派遣野战部队来支援我们，以此来镇压各地的赤匪叛乱。"
 GEA_take_east_asian_navy:0 "要求控制东亚海军"
 GEA_take_east_asian_navy_desc:0 "德属东亚海军是我国海军在东亚的重要战略资产。将其整合入柏林的指挥体系中对我们定有裨益。"
 blow_singapore_causeway:0 "破坏[GetNameGEAJohore]-[GetNameGEASingapore]堤道"
 blow_singapore_causeway_desc:0 "作为[GetNameGEASingapore]连接到大陆的唯一一条路，虽然破坏掉它可以给予我们巩固这座岛屿的时间，但是会在战争中带来负面影响——因为这代表我们要放弃大陆……"
#买船
 GEA_Naval_decisions:0 "武备东亚分舰队"
 GEA_Naval_decisions_desc:0 "如今尽管德属东亚的强大的舰队仍然尽职尽责地为德意志帝国维护东方的秩序，但风光无比的舰队在面对愈发混乱的远东局势与旭日帝国不断膨胀的扩张野心时也显得越发力不从心。因此，为了更好的保卫东方，我们需要尽一切可能扩充东亚分舰队的规模。"
 GEA_Order_destroyers:0 "向祖国订购一批驱逐舰"
 GEA_Order_destroyers_desc:0 ""
 GEA_Order_light_cruisers:0 "向祖国订购一批轻巡洋舰"
 GEA_Order_light_cruisers_desc:0 ""
 GEA_Order_heavy_cruisers:0 "向祖国订购一批重巡洋舰"
