 GEA_KR_GATHERING_STORM_DESC:0 "德属东亚，德意志帝国在东方皇冠上最为璀璨的明珠，也是殖民主义野心与帝国荣光交织而成的庞然巨物。世界大战的胜利使德国从英法手中夺得了广袤的东南亚殖民地，从新加坡繁忙的港口到印度支那的稻田与婆罗洲的密林，黑白红三色旗高悬于这片富饶的土地之上。然而，表面的繁荣却难掩殖民统治日益加深的裂痕。德国工业巨头对财富永无止境的索求、印度支那愈演愈烈的民族独立运动、野心勃勃的日本帝国无不威胁着柏林在远东苦心经营的霸权。随着1936年的到来，总督府必须在殖民改革、军事高压与企业利益之间寻找出路，同时应对帝国本土的掣肘与远东列强的觊觎。德属东亚究竟能否继续作为帝国的东方柱石屹立不倒，抑或将在丛林的烈火与大洋的惊涛中走向崩溃，一切尚无定数。"
 POLITICS_SCHORNER_DESC:0 "谁能料想，费迪南德·舍尔纳有一日也能领导德皇的东亚领地？虽然反对者竭力阻挠，但这已经化为现实。\n\n舍尔纳出生于1892年，1911年参加巴伐利亚陆军，在世界大战时英勇战斗，在战争结束时已经晋升为中尉。他的军事指挥和组织能力引人注目，足以胜任领导50万人的工作，虽说有人批评他作风野蛮、行事残酷。他在世界大战结束后立即加入了冯·戈林的全德意志联盟，他民族主义情绪强烈，愿意为德国献身，曾经多次参加德国的海外军事远征队，因此晋升为将军。\n\n舍尔纳随后被派遣到印度支那，他和上级时常发生冲突，主要是因为原住民问题：舍尔纳拒绝指挥包含原住民士兵的部队，希望自己的部队完全由德国人组成。舍尔纳希望殖民地军队完全由德国人组成，而不是“蛮子”（他如此称呼原住民）。他认为土著精英在管理殖民地和开化任务中毫无价值，统治阶层只能由德国人担任。\n\n在前任政府将印度支那拱手让给社会主义者后，舍尔纳现在掌管着德属东亚，准备实行他的极端理念，不惜一切代价维持德意志的东亚秩序。"
 POLITICS_HEYE_DESC:0 "只有最勇敢、强大的人才敢深入德属东亚那片深邃而危险的丛林，威廉·海耶便是其中之一。\n\n这位1869年出生于富尔达的普鲁士军人，几乎一生都在军队中度过。早年从军校进入普鲁士陆军后，海耶很快进入总参谋部体系，并在德属西南非洲服役，亲眼见识过殖民战争最残酷的一面。回到本土以后，他又执掌过总参谋部第三b分局，对情报、反间谍与国内安全事务并不陌生。世界大战爆发后，海耶先后在东线和西线担任高级参谋，最终于大战末期进入最高陆军指挥部，负责作战事务，也因此同兴登堡、鲁登道夫等帝国军方最高层建立了密切联系。\n\n战争的胜利没有让这位老军人离开军界。此后的海耶依旧把自己视作皇帝军队的一员，而不是某种独立的政治家。他对议会争论兴趣寥寥，更相信一套由军人掌握、能够迅速传达并贯彻命令的政治理论。然而，鲁登道夫的倒台使得他也被连累而不得不被调到远东担任殖民防卫的总负责人。\n\n和中央非洲的冯·埃普一样，海耶打算用铁腕维持殖民地秩序，并进一步推动行政与军事权力的集中。他毫不掩饰自己对本地精英和温和派政治人士的不信任，也因此迅速疏远了许多过去愿意同德国合作的原住民上层。批评者警告说，这种做法可能会把原本可以拉拢的人推向殖民政府的对立面。\n\n海耶对此并不在意。对他而言，德属东亚首先是德意志帝国的领地，而自己首先是一个执行命令的军人。\n\n德皇命令往下传，海耶全力来执行。"
 POLITICS_BALLIN_DESC:0 "在德国，阿尔贝特·巴林是海事领域的大人物之一。巴林是一位出色的商人，是汉堡-美洲航运公司的总裁，这家公司在德国赢得世界大战后一跃成为世界最大的航运公司。他发明了观光游轮的概念，创造了奥古斯塔·维多利亚号（以德国皇后石勒苏益格-荷尔斯泰因的奥古斯塔·维多利亚命名），这是世界上第一艘现代游轮，是德国智慧与创造力的展现。\n\n德皇因为巴林的丰富经验，任命他做德属东亚的领导人。巴林欣然赴任，他的热情永远在海洋上。他的统治维持了几十年的平静现状，殖民地在财政和稳定上表现皆佳，虽然印度支那的社会主义抵抗有所增长，这些人直接由第三国际资助。\n\n但是，虽然平静不可颠覆，但巴林年事已高，许多人认为这位航运大亨时日无多，选定继承人的问题越发紧要。"
 POLITICS_JOSIAS_DESC:0 "瓦尔德克和皮尔蒙特的约西亚斯，瓦尔德克-皮尔蒙特公国亲王，弗里德里希之子，德皇陆军的将军。世界大战爆发后，军校生约西亚斯自然而然地加入了德皇军队。虽然战时他受了重伤，但却奇迹般地活了下来。\n\n约西亚斯的父亲对他的战场表现非常不满，劝说德皇把他送到德属东亚以示惩罚。但出乎其父意料，约西亚斯非常善于管理殖民地军政事务，他和航运大亨、德属东亚总督阿尔贝特·巴林走得很近。他支持巴林的政策和决议，许多人认为他已成了老人的二把手，于是他顺理成章地成为了巴林的继承人。\n\n木已成舟，现在瓦尔德克和皮尔蒙特的约西亚斯真正成为了殖民地的领导人，他决定延续前任的政策，维持着不可动摇的现状。他的父亲终于可以为他自豪了，至于约西亚斯能否维持殖民地的完整、印度支那的社会主义走狗是否会把德属东亚踢下地狱，还有待观察。"
 POLITICS_HELLMUTH_VON_MUCKE_DESC:0 "赫尔穆特·冯·穆克是水手的精确定义：总是寻找新的发现和浪潮并向之起航，总是寻找当地的奇人们并会见他们。\n他作为一小群德国水手们的首领而闻名。在世界大战期间，这群水手在印度洋搁浅，随后，他历尽艰险，带着他的船员们长途跋涉，回到了印度尼西亚，在那里他成功登上了“汉志”号。然后他们计划前往君士坦丁堡，抵达一个安全的地方。阿拉伯是他们的必经之地，在那里他们停在麦加，遭受了贝都因人的攻击。然后他们不得不穿越叙利亚，最终胜利抵达奥斯曼帝国的首都，在那里有一场仪式，赫尔穆特和他的船员们被赐予荣耀。\n战后，他获得了上校军衔，被委派到德属东亚，得以有机会去近距离观察居住在殖民地的各种各样的土著民族。他成了扩大土著民族政治、宗教与经济权利，殖民地去中心化，以及尊重土著民族风俗与信仰政策的最重要支持者之一。海军元帅显然与当今中央非洲的改革集团有着紧密的联结。现在掌管着这块殖民地的冯·穆克，在志同道合的官员以及当地精英和土著民族的支持下，将会带领殖民地进入更加光明的未来。"
 POLITICS_FELIX_VON_LUCKNER_DESC:0 "费利克斯·尼古拉斯·亚历山大·乔治·冯·卢克纳尔伯爵自幼开始航海，如今正在擢升为皇帝最杰出的海军指挥官，是世界上最具名望，一直都在起航的水手。他于1881年出生于德累斯顿的一个杰出的军人家庭，从小承受着随父业加入骑兵部队的重担。卢克纳尔承受不了这个重担，于是在13岁的时候离家出走了。他化名为“菲拉克斯·吕德克”，在一艘驶往澳大利亚的旧俄国船上找到了一份无薪的服务员工作。尽管差点死在半路，年轻的冯·卢克纳尔很快投入了航海生活。到达澳大利亚后，为了谋生，他接了一大堆能让自己环游世界的零工，包括工人、酒保、拳击手、袋鼠猎人、马戏团演员、渔夫、灯塔管理员、墨西哥总统保镖，甚至因为偷了几只猪在智利监狱里吃牢饭，直到他20岁。出狱后，他设法回到了德国，进入航海学校学习如何成为真正的水手。学成后，他在汉堡的一条渡轮航线上工作，直至1912年，世界大战开始两年前，他回到家里，被征召入皇帝的海军服役。冯·卢克纳尔在这场战争中发迹，他最初在豹号炮舰上服役的时候，作为一个杰出的海军军官而闻名。每次和英国海军相遇时，他都能痛打对方。英国人忌惮于冯·卢克纳尔，给他起了个“海上幽灵”的绰号。在大量的胜利之后，皇帝赐予了冯·卢克纳尔一艘缴获的三桅船，命名为“海鹰”，让他指挥。配备了现代火炮之后，“海上幽灵”和他的“皇帝的海盗”们恢复了海上商船掠夺，将其用于束缚英国的补给线，颇具成效。战后，冯·卢克纳尔继续为皇帝服役，在七大洋上掠夺敌人的轮船航线，击沉流氓船只，一路上获取新的荣耀，直至在德属东亚靠岸，接受赫尔穆特·冯·穆克的指挥。如今，随着约西亚斯私下里的肮脏统治败露，“海上幽灵”冯·卢克纳尔已经接管了德属东亚的最高指挥权，如果这位老海盗不单单是要自己独揽大权，在他的监视之下，德属东亚会又一次驯服于皇帝……"
 POLITICS_ALBERT_HAHL_DESC:0 "在德属东亚被英法遗产、海军、国内巨头企业与各地保护国拼凑起来以前，阿尔伯特·哈尔就已经是柏林殖民办公厅中少数真正理解南洋的人。对许多殖民官僚而言，远东只是由港口和野蛮部落拼接而成的蛮荒边陲；可在这位深耕远东殖民事业的老人眼中，它首先是一片由岛屿、地方首领与欧洲权威共同维系的复杂世界。\n\n世界大战之后，哈尔并未站在德国殖民扩张的最前台，而只是以柏林殖民办公厅高级顾问的身份参与决策。岁月早已不饶人，昔日在新几内亚的总督生涯固然使他积累了足够多的南洋经验，也同样磨损了他的健康与精力，使他不得不在帝国殖民事业最为如火如荼的年代闲居柏林。然而如今，德国在东亚的殖民秩序已摇摇欲坠，东亚舰队疲于奔命，殖民办公厅也终于重新想起了这位年过六旬的老人。事到如今，或许只有这样一位经验丰富、也足够固执的殖民官僚，才能接手这个被危机撕扯的德属东亚。\n\n哈尔从来不相信这片土地能靠单纯的军令长期维持。他在殖民署内部反复主张，应当把帝国权威与本地贵族或土著首领重新编入一套更稳固的殖民秩序。他的支持者称这种方案为真正的南洋智慧，但更多的人则讥讽这不过是一个老头对旧日经验的迷信。可哈尔的回答始终如一：如果德属东亚继续只是拥有领土的舰队，那么它迟早会被自己的疆域拖垮。只有抛却过去最粗暴的偏见与歧视，帝国在东方的统治才可能走得更远。"
 POLITICS_TILO_FREIHERR_VON_WILMOWSKY_DESC:0 "蒂洛·弗赖赫尔·冯·维尔莫夫斯基男爵并非克虏伯王朝的主人，却正因如此而成为埃森最方便送往远东的人。克虏伯本家不能离开鲁尔，高级董事不愿背负殖民地失败的责任，而柏林也不可能公然承认德国在东亚的殖民霸权已经虚弱到必须借助企业之手来维系。于是，维尔莫夫斯基这个名字便在一份又一份备忘录中浮现出来。\n\n他既是普鲁士式行政训练培养出的官僚，也是克虏伯家族姻亲与监事会中的可靠人物。世界大战期间，他曾以骑兵军官身份服务于德国在比利时的占领当局，亲眼见识过占领秩序与繁杂政务如何彼此纠缠。世界大战胜利后，德意志工业在欧洲与海外同时膨胀，克虏伯的钢铁、舰炮、铁路器材和军械合同随着帝国公约的边界延展到更远处。在此期间，男爵的脚步也跟随着克虏伯的事业走向世界各地。狂飙突进的德国经济与不计代价的殖民秩序，共同烙印在他过去十余年的记忆之中。回国以后，维尔莫夫斯基便以温和的改良姿态闻名于克虏伯内部；即便在德国政坛上，他也时常呼吁德意志工业界的巨头们停止如今这种不顾后果的扩张与压榨，转而采取更温和、更长久的经营手段。\n\n如今，男爵临危受命，成为德属东亚的新任总督。他既要挽救以克虏伯为首的卡特尔巨头们在东方的利益，也要拯救德意志祖国摇摇欲坠的殖民事业。"
 POLITICS_CLAUS_VON_BOHLEN_UND_HALBACH_DESC:0 "克劳斯·冯·博伦-哈尔巴赫来到德属东亚，并不是因为柏林突然相信年轻人应当执掌殖民帝国。真正推动他东行的，是克虏伯这个姓氏本身所蕴含的重量。作为古斯塔夫与贝尔塔之子，他自幼便生活在胡格尔别墅、埃森工厂、军方订货人与帝国官僚共同编织出的世界之中；而他的父亲又曾在外交部任职，帮助他先后见识过华盛顿、北京与罗马等地的宫廷和使馆。事实上，克劳斯并非克虏伯继承序列中最醒目的那个人。长兄阿尔弗里德被视作未来的掌舵者，父亲古斯塔夫则仍以家族名义支配着庞大的企业机器。也正因如此，克劳斯反而更适合被派往帝国边缘。\n\n世界大战的胜利让克虏伯家族的影响力伴随帝国霸权一同扩张。公司在中国沿海攫取特许权，德属东亚舰队在南洋维持秩序，来自鲁尔的火炮、钢轨与机械则不断被送往远东各港。克劳斯在这些网络中长大，也在这些网络中学会了一个简单道理：帝国的旗帜从来不会孤零零地飘扬，它身后总有贷款、订单、承包商、船运公司和愿意替德国利益说话的本地代理人。\n\n黑色星期一之后，旧有体系的裂缝暴露无遗。殖民地财政崩坏，印度支那骚动不止。若克劳斯成为总督，他不会把自己包装成强硬官僚或开明总督；他所能提供的，是用一切手腕压住海军、企业、殖民署和本地买办之间的争吵，让东方继续为帝国提供资源，也让克虏伯确保这笔交易不再被任何人随意破坏。"
 POLITICS_FRITZ_TER_MEER_DESC:0 "弗里茨·特尔·梅尔并不是那种从殖民地图上寻找前途的人。他出身于克雷费尔德一带的工业资产阶级，父亲埃德蒙·特尔·梅尔创办的韦勒-特尔·梅尔化学工厂，本就是德国染料工业崛起时代的一部分。年轻的特尔·梅尔接受了完整的化学训练，并曾在柏林师从埃米尔·费歇尔这样的大学权威。1910年，他进入父亲的企业，从偶氮染料与中间体生产学起，又一度被派往法国北部的图尔宽分厂处理当地事务。与其他人有所不同的是，毁天灭地的世界大战没有让他的事业中断，反而更进一步加深了他与德国化学工业与国家机器之间的联系。七年后，他已跻身企业董事层，并参与了德国焦油染料工业利益共同体的谈判；随着韦勒-特尔·梅尔并入染料工业利益集体公司，他也顺理成章地成为法本董事会成员，并在低地莱茵生产集团中占据重要位置。\n\n因此，当在IG法本公司内部谈起德属东亚时，特尔·梅尔听到的不是浪漫的远东故事，而是卡特尔内部极其具体的项目名称。橡胶、锡、煤、油料、药品原料、热带农作物和亚洲市场共同组成了一个庞大的仓库；黑色星期一以前，这个仓库由航运公司、以克虏伯，IG法本等德国国内的卡特尔巨头和殖民地商人分头经营。\n\n黑色星期一以后，法本董事们开始相信，如此重要的地方不能继续交给旧式殖民行政随意摆布。对梅尔而言，只有足够的冷酷与理性才能在保卫企业利益的同时，把德属东亚变成真正的现代工业前哨，也是德意志世界秩序的东方堡垒。"
 POLITICS_OTTO_AMBROS_DESC:0 "奥托·安布罗斯代表着一种令旧殖民官僚颇感不适的新权力。他既不是总督府沙龙里的贵族，也非东亚舰队甲板上成长起来的军官，而是法本实验室和项目办公室中培养出的技术官僚。这个出身上普法尔茨的年轻化学家在战后德国受教育，于慕尼黑完成学业，又在法本成立后的第二年进入奥帕乌工厂；在那里，他接触到的不是殖民部档案里的热带风情，而是高压合成化学、厂区调度与大企业内部严格到近乎冷酷的技术纪律。\n\n安布罗斯的上升速度本身就说明了德国工业界的变化。在巴斯夫旧厂区、奥帕乌与勒纳体系之间，新一代化学家不再满足于做单纯的实验室研究者，他们开始成为工程计划、国家订单和企业战略之间的翻译者。正是在这样的环境中，安布罗斯逐渐被视作法本内部最适合处理合成橡胶与热带原料问题的人选之一。\n\n德属东亚恰好掌握着这些问题的一部分答案。马来亚与东印度群岛的橡胶曾在繁荣年代为殖民地带来滚滚利润。对安布罗斯而言，供应原料对于远东来说远远不够，它还必须成为实验场，一个把天然橡胶、合成橡胶、油料作物和燃料添加剂连接到帝国工业体系中的实验场。许多人质疑他太年轻，太冷漠，也太相信技术与秩序能够解决政治问题。安布罗斯对此并不在乎。如今他已成为总督，德属东亚将不再只是拥有领土的舰队，而会被改造成一座庞大的热带化工厂；至于反对这种安排的人，他只会把他们视作生产流程中的阻碍。"
#国策
 GEA_Step_into_the_peaceful_sea:0 "步入太平之海"
 GEA_Step_into_the_peaceful_sea_desc:0 "德意志帝国在世界大战中的胜利，彻底改变了太平洋与东南亚的政治格局。昔日由英国与法国经营的殖民地，如今已成为德国远东体系的重要组成部分，而新加坡更是帝国控制印度洋与南海航运的关键枢纽。然而，德国在亚洲的地位并非无可撼动。日本对于太平洋霸权的野心从未消退，中国各地的政治动荡也持续威胁着帝国的商业利益，而协约国残存势力更不会轻易忘记自己失去的海外领地。面对这些潜在的挑战，德属东亚必须重新审视自身在远东国际秩序中的地位，加强对周边国家与殖民地的外交关注，并确保德国海军能够继续维护帝国的航运与战略利益。"
 GEA_Expand_the_share_of_exports:0 "扩大出口份额"
 GEA_Expand_the_share_of_exports_desc:0 "得益于广阔的殖民地领土与便利的海上交通，德属东亚已经成为帝国重要的橡胶、锡、石油及其他热带商品供应地。然而，国际市场的竞争日益激烈，其他殖民国家的生产商也正不断争夺有限的贸易份额。为了进一步增加殖民地收入，总督府将同德国商会及主要出口企业合作，扩大种植园与矿业生产，改善港口仓储和货物运输，并争取更多面向德国本土及其他海外市场的长期供货合同。"
 GEA_Continue_to_arm:0 "继续武装"
 GEA_Continue_to_arm_desc:0 "尽管德属东亚拥有帝国远东舰队的保护，以及由德国军官指挥的殖民地驻军，但这片辽阔领地所面临的安全挑战仍然不容忽视。印度支那境内的反殖民组织始终没有停止活动，庞大的中国市场随时可能因军阀冲突陷入动荡，而日本海军不断扩张的实力，更使德国在太平洋的战略优势面临挑战。德属东亚将继续增加军事建设投入，改善殖民地部队的装备与训练，扩充军需储备，并加强重要港口与交通枢纽的防御设施。"
 GEA_Budget_draft_1936:0 "1936预算草案"
 GEA_Budget_draft_1936_desc:0 "又到了总督府各部门为新一年度财政拨款争论不休的时候。随着1936年的到来，殖民地财政官员已经提交了最新的预算草案，其中不仅涉及驻军与海军基地的日常开支，还包括基础设施建设、殖民地行政、工业补贴以及各项海外投资计划。军方希望获得更多资金用于改善装备与防务，工商界则要求扩大铁路、港口及工业建设预算，而殖民地行政部门同样抱怨现有经费难以满足日益增长的管理需求。然而，尽管德属东亚拥有可观的贸易收入，我们所能支配的财政资源终究不是无穷无尽。我们必须在维持殖民统治、保障军事安全与推动经济发展之间取得平衡，并确定新一年度的财政重点。"
 GEA_Our_position:0 "我们的地位"
 GEA_Our_position_desc:0 "数十年来，德属东亚已经从一系列分散的殖民据点发展为横跨南海与东南亚的重要海外领地。新加坡掌握着连接印度洋与太平洋的战略通道，印度支那与婆罗洲为帝国提供着丰富的资源，而德国在中国沿海的商业特权，则使总督府的影响力远远超出了殖民地本身的疆界。然而，这种显赫地位也伴随着复杂的政治责任。我们既需要服从柏林的帝国政策，又必须处理同日本、中国各派军阀及其他殖民势力之间的关系，还要在不同民族、商业集团与殖民地行政机构之间维持脆弱的平衡。如今，我们必须重新审视自身所拥有的权力与承担的义务，明确德国在远东的战略目标，并确保帝国的利益不会因一时的疏忽而受到损害。"
#哈尔
 GEA_Governor_Hahl:0 "阿尔伯特·哈尔走马上任"
 GEA_Governor_Hahl_desc:0 "阿尔伯特·哈尔并非第一次面对一片庞大、复杂而又难以直接治理的殖民地。早年在德属新几内亚的经历使他深知，殖民统治若只依赖暴力与镇压，最终只会把分身乏术的殖民政府推入无边无际的抵抗泥潭之中。如今的德属东亚比他过去治理的领地庞大得多，民族、宗教与地方传统也更加复杂。哈尔必须把自己几十年来积累的经验重新拿出来，在这片东方领地上寻找一条比单纯高压统治更加持久的道路。"
 GEA_The_troublesome_Indochina_region:0 "棘手的印度支那"
 GEA_The_troublesome_Indochina_region_desc:0 "印度支那一直是德属东亚最难处理的地区，也是德属东亚所仰赖的资源与工业立足的核心地区。然而，过去法国在此殖民所留下的行政遗产在十年间都尚未完全消化：越南皇室依旧保有影响力，各地地主、乡绅、宗教团体与民族主义组织又各自为战，保卫着他们自己微不足道的利益或是民族情节。在此情景之下，黑色星期一更让原本殖民者与本地居民之间积压了十余年的矛盾与仇恨被一同引爆。若想真正稳定这里，我们必须停止把印度支那当作一整块可以用同一种办法管理的殖民地，而应当逐一处理那些真正决定地方秩序的力量。"
 GEA_Our_white_glave:0 "启用白手套"
 GEA_Our_white_glave_desc:0 "哈尔并不打算把德属东亚的未来押在顺化宫廷身上。越南皇室总是怀有重新收拢权力、恢复独立的不切实际的野心。相比之下，那些愿意在德国秩序下谋求前途的越南政治家、地主代表与商界大亨，反而更加值得利用。只要给予他们有限的行政职位、议政渠道与经济特权，他们自然乐于充当总督府与本地社会之间的“白手套”。\n\n让更多越南人进入政府当然意味着本地政治参与程度的扩大，但这恰好能够向印度支那社会展示德国并非完全拒绝合作。与此同时，借助这些与银行、航运、稻米贸易和地方产业关系密切的本地精英，我们还能够进一步重组殖民地经济，使印度支那的资本、企业与市场更加牢固地依附于德国和中欧体系。至于这些新晋政客究竟拥有多少真正的自主权，则完全是另一回事了。"
 GEA_Banquet_of_the_Elite:0 "欢宴名流"
 GEA_Banquet_of_the_Elite_desc:0 "西贡、河内、顺化，这些大城市中从来不缺愿意同德国人进行利益交换的政商名流。他们或许未必真正热爱帝国和他的世界秩序，但财富、地位与现实利益足以让许多人学会合作。通过宴会、咨询机构和商业特许，我们可以把这些本地上层人物逐渐吸收到殖民秩序之中。只要他们能够从现有体系中获利，他们便会比任何宣传口号都更加积极地维护它。"
 GEA_Return_to_the_Vietnamese_court:0 "重返越南宫廷"
 GEA_Return_to_the_Vietnamese_court_desc:0 "时过境迁，顺化宫廷虽然早已失去了昔日的权势，但保大皇帝及其朝廷仍然拥有德国官员无法轻易复制的传统合法性。在过去十余年中，德属东亚的殖民官员们都只把这位末代皇帝和他的臣子看作还活在旧日迷梦中的泥塑神像。可此时此刻面对席卷整个印度支那的民族主义浪潮，与其继续把皇室当作一件无用的礼仪摆设，政府不如重新将他们摆上台面。总督将通过赋予其有限的行政空间，让皇帝替我们吸引那些仍然忠于王朝的官僚、地主与温和民族主义者。"
 GEA_Monarchical_colonial_rule:0 "君主式殖民统治"
 GEA_Monarchical_colonial_rule_desc:0 "越南人无需在皇帝与德国之间进行选择。保大可以继续作为越南传统与民族认同的象征，而德意志皇帝则代表保护这套秩序的更高权威。通过礼仪、教育与地方宣传，我们可以逐渐塑造一种双重忠诚：既效忠顺化，也效忠柏林。只要皇室的威望能够为殖民统治服务，那么保留一个被精心限制的本地君主，远比彻底摧毁他的影响力更为有用。"
 GEA_Revive_The_Luluai_Principle:0 "卢卢艾制度的遗产"
 GEA_Revive_The_Luluai_Principle_desc:0 "阿尔伯特·哈尔曾在德属新几内亚依靠卢卢艾制度，通过授权各地酋长村长，辅以少量德国官员借助本地首领维持基层行政、征税与治安。这种间接的行政管理方式削弱了传统权力的影响力，并成功将当地居民与殖民经济体系紧密联系起来。\n\n如今，印度支那的社会结构虽与太平洋岛屿截然不同，但地主、乡绅、保甲首领与地方名望人士同样掌握着真正深入乡村的影响力。与其让德国官员徒劳地试图直接管理每一个村庄，不如承认这些地方权威的地位并将一些边缘权力下放地方，再让他们替帝国承担登记人口、征收税赋、组织公共工程的诸多基层职责。只要缰绳仍掌握在德国人手中，基层权力由谁具体执行并不重要。"
 GEA_German-style_organization_local_employees:0 "德式机构，本地雇员"
 GEA_German-style_organization_local_employees_desc:0 "十余年来，德属东亚一直患有一种几乎所有海外帝国都会碰上的顽疾：领土扩张的速度远远超过了德国官僚抵达东方的速度。从柏林派遣一名训练有素的行政官跨越半个世界并不困难，困难的是为印度支那、马来亚乃至婆罗洲的每一座县城和港口都找到这样一个人。\n\n解决办法其实早已摆在眼前。德国式的档案、预算、司法与行政体系没有必要改变，但真正负责抄写文件、征收税款、翻译法令乃至处理日常地方事务的人完全可以是越南人、马来人和华人。我们将扩大本地公务员的招募与培训，在保持德国官员牢牢掌握监督和任免权的同时，把殖民机器中最繁琐的齿轮交给那些真正懂得当地语言与习俗的人。"
 GEA_Small_farmers_Chinese_merchants_and_exiles:0 "小农，华商与异乡人"
 GEA_Small_farmers_Chinese_merchants_and_exiles_desc:0 "过去的殖民经济太容易让人粗浅地认为，德属东亚的一切财富都来自几个德国财团。实际上，真正构建德意志在印度支那的运转逻辑基石的反而是田间地头的诸多小农、投身贸易的华商、以及战争结束后因种种原因留在东方的欧洲人。在如此危局之下，哈尔也没有理由继续忽视他们。小农需要稳定的收购与信贷，华商希望减少繁琐的许可和关卡，而那些熟悉当地环境的英法旧侨民则完全可以重新找到一份有用的工作。如果经济繁荣依旧只能完全惠及德国，那么黑色星期一下一次到来时，我们依旧会毫无防备。一个广泛而扎实的低中产阶层，或许才是德属东亚真正缺少的东西。"
 GEA_Domesticating_the_unrestrained_countryside:0 "驯服无羁乡村"
 GEA_Domesticating_the_unrestrained_countryside_desc:0 "在德属东亚，沿着铁路旅行的人很容易产生一种错觉：印度支那已经被彻底征服。帝国旗帜在车站高高飘扬，海关官员检查着货物，城市中的警察也能迅速执行命令。然而，只要离开铁轨和公路数十公里，德国国家的存在便迅速变得模糊。连绵成片的乡村承载了这片土地上绝大部分的人口，而那些密林之中的独立小村落更是完全的法外之地。也正是因此，那些工团匪徒与叛逆能肆无忌惮的藏身其中。为了遏止这一现象，印度支那的无羁乡村必须被尽快推上现代化的轨道。至少要先把那些丛林村落从密林之中迁出来。"
 GEA_The_Rule_of_Humility:0 "谦逊之治"
 GEA_The_Rule_of_Humility_desc:0 "一名刚步入职场的年轻官员，或许精通法律与统计学，却很可能连自己管辖地区的语言都说不好。过去不少殖民官员却偏偏把这种无知当作优越，认为只凭一纸命令便贯彻所有殖民官僚们的意志。哈尔在太平洋多年的行政经验已经证明，傲慢往往只是制造骚乱最昂贵的方法。殖民官员首先必须学会观察和询问。这种所谓的“谦逊”绝不意味着放弃德国的主导地位；恰恰相反，只有明白自己正在统治什么，才能避免为了无关紧要的事情白白树敌。"
 GEA_Amnesty_For_The_Misled:0 "分辨首恶与无辜者"
 GEA_Amnesty_For_The_Misled_desc:0 "印度支那的监狱已经装进了太多所谓的“政治犯”。诚然，其中越盟干部，煽动分子与民族主义者占多数，但也有人不过是参加了一次罢工或是在大规模抓捕时被卷入其中。若把他们全都推到革命者一边，那我们出卖上吊自己的绞索。因此，政府将对近期政治案件重新进行甄别。真正策划叛乱、组织暴力的首恶仍要承担后果，但那些被胁迫、误导或仅有轻微牵连者可以在宣誓守法后获得减刑乃至赦免。"
 GEA_Reconcile_at_last:0 "终得和解"
 GEA_Reconcile_at_last_desc:0 "印度支那的稳定不可能仅靠不断增加的宪兵、监狱和处决维持。经过一系列地方改革、政治妥协与有限赦免，我们终于有机会让一部分曾经敌视殖民政府的人重新接受现有秩序。民族主义不会因此消失，对德国统治的不满也不会一夜之间化解，但只要越来越多的人认为合作比叛乱更有利可图，那么真正的和解便不再只是空谈。"
 GEA_Adat_Under_The_Black_White_Red:0 "黑白红旗下的阿达特"
 GEA_Adat_Under_The_Black_White_Red_desc:0 "在马来亚与婆罗洲，所谓的“阿达特”并非一部可以装订成册的统一法典，而是各地有关生活工作方方面面的传统惯例。英国人曾经借助这些习惯法和传统治理马来诸邦，而德国接手后的行政混乱却使得这些优秀经验被遗忘。\n\n我们现在将系统整理各地习惯法，并在不抵触帝国刑法、税法和公共秩序的前提下给予正式承认。村长、酋长和苏丹属官可以继续裁决那些他们比德国法官更熟悉的事务，而殖民政府则可以腾出手来处理一些更加紧急的殖民事务。"
 GEA_The_Bureau_Of_Native_Affairs:0 "土著事务局"
 GEA_The_Bureau_Of_Native_Affairs_desc:0 "德属东亚的地图上用几种颜色便能划清行政区，可真正区分治理本地人却远没有那么简单。越南人、高地民族、马来人、达雅克人、华人移民乃至无数更小的族群都有各自的语言、习惯和权威体系，如果想凭现有的殖民机构把这些人治理的井井有条不亚于天方夜谭。为此，土著事务局则横空出世。政府将把这些问题集中起来：民族调查、习惯法记录、酋长登记、土地纠纷与宗教事务等诸多大小一系列事物都会由专门官员负责，并为各地区制定不同的行政办法。只有把基层社会真正记录下来，帝国才有可能有效地管理这片东方的野蛮土地。"
 GEA_Abandoning_the_savage_nature:0 "弃绝野蛮秉性"
 GEA_Abandoning_the_savage_nature_desc:0 "德属东亚军队长期依靠一套简单粗暴的殖民战争经验维持秩序：搜捕，拷打，处刑与反游击作战。在不少基层军官眼中，随意殴打、羞辱士兵和平民再平常不过。这样的做法或许能在短期内制造恐惧，却也让每一次平叛都会催生新的抵抗火苗。缺少秩序与文明的统治必然难以长久。我们将强化军纪、限制未经授权的报复行动，并要求驻军在执行治安任务时明确任务目标，而非尽数杀光。若德意志军人自诩代表文明，那么至少首先得学会控制自己手中的枪。"
 GEA_Take_up_the_torch_of_solf:0 "接过佐尔夫之炬"
 GEA_Take_up_the_torch_of_solf_desc:0 "威廉·佐尔夫在德国殖民史上留下的遗产丰厚无比。早在萨摩亚时期，他便试图证明，一片海外领地可以依靠地方合作与务实行政来治理，而不必通过暴力来申明主人地位。哈尔如今所做的一切，某种意义上正是这条道路在东方的延续。若德属东亚能够以更少的暴力、更低的行政成本和更广泛的本地合作保持稳定，那么实践本身便足以替佐尔夫的理念作出辩护。"
 GEA_The_Sultans_Seal:0 "拾起苏丹印玺"
 GEA_The_Sultans_Seal_desc:0 "英国人在马来半岛留下的遗产并非只有铁路和橡胶园。一套精明的政治安排也足以在如今被再度利用：苏丹继续端坐在宫廷之中，保留马来地区传统上的权威，而真正关系财政和行政的决定，则在驻扎官的“建议”下作出。德国接管后，这套制度一度因为战争和行政重组而趋于松散。但诚然，如今的德属东亚殖民政府没有理由舍弃一个已经证明有效的工具。我们将重新召开诸苏丹会议，恢复更加固定的驻扎官安排，并通过让渡些许利益来换取他们的合作。"
 GEA_Enlightenment_and_the_Mission_of_Education:0 "开化与启蒙使命"
 GEA_Enlightenment_and_the_Mission_of_Education_desc:0 "任何现代行政体系都需要受过教育的基础文员，而德属东亚不可能永远从汉堡和柏林进口他们。现有的教会学校和地方学堂教育远远不足以满足一个现代经济体的需求。眼下，我们将扩大基础教育与职业学校，并在重要城市建立培养本地教师和行政人员的机构。德语无需取代每一种本地语言，但德国式的课程、技术规范与行政观念应当成为接受现代教育者共同熟悉的东西。"
 GEA_Loyalty_rather_than_birth:0 "忠诚而非出身"
 GEA_Loyalty_rather_than_birth_desc:0 "德属东亚军队虽然在东方停驻多年，但几乎从不依赖越南人、马来人和其他本地士兵，一切补员全靠本土供给。结果便是，我们一面抱怨缺乏大头兵和基层军官，一面又拒绝提拔那些最熟悉当地语言、地形和士兵的人。这种浪费没有继续下去的必要。\n\n经过严格审查、长期服役并证明忠诚的本地军人，应当能够进入士官体系，甚至获得有限的军官晋升通道。一名可靠而有能力的安南中士，显然比一个刚从欧洲下船、连自己部下的话都听不懂的少尉更有价值。"
 GEA_Peaceful_Country:0 "太平国度"
 GEA_Peaceful_Country_desc:0 "衡量殖民治理成功与否的方法有很多，但对于哈尔而言，也许还有一个更加简单的指标——有多少问题不再需要军队出面解决。若地主与农民的纠纷能够交给地方机构，本地官员能够按时征税，那么德属东亚军就不用如过去一般疲于奔命。这当然不是什么不切实际的乌托邦构想，也不是亚洲民族主义者梦想中的自由国家。但只要一切都平稳运转，德属东亚就足以被称为富足美好的太平国度。"
 GEA_The_Three_Beasts_Of_Burden:0 "驾驭三头驮兽"
 GEA_The_Three_Beasts_Of_Burden_desc:0 "法国统治印度支那时，盐、酒与鸦片三项专卖收入曾为殖民财政贡献极其重要的一部分，也因此被人形象地称作支撑印度支那财政的“三头驮兽”。盐税能够深入每一个需要烹饪的家庭，酒类专卖从城乡日常消费中抽取利润，而鸦片则以其惊人的收益填补了殖民政府无数开支。战争与法国统治的崩溃使原有专卖网络遭到严重破坏，而如今黑色星期一更是将它们冲击的七零八落。为了解决眼前的财政危机，殖民政府也只得开始捡起账簿，盘算还能从这三头驮兽中榨取多少油水。"
 GEA_Reform_of_the_outdated_tax_system:0 "陈旧税制改革"
 GEA_Reform_of_the_outdated_tax_system_desc:0 "所谓德属东亚税制，实际上是法国人的专卖制度、英国人的地方税、德国人的企业特许以及无数临时条例堆叠在一起形成的怪物。同一种商品穿过不同地区可能面对完全不同的税率，而一个足够聪明的商人只需熟悉几个漏洞，便能让自己的账本看起来比实际贫穷得多。黑色星期一之后，这种漏洞已经成为我们无法承担的奢侈。哈尔将推动统一商业登记并尝试清理重复税目。海关和地方征收机构也需要被迅速重组，并重新审查各种免税特权。至于最终谁会因此而多交钱则没人关心——税制改革的第一原则，终究还是得先收到税。"
 GEA_Disturbing_the_dreams_of_the_cartel:0 "拉紧卡特尔缰绳"
 GEA_Disturbing_the_dreams_of_the_cartel_desc:0 "十年的东方繁荣让不少德国企业在东方大赚特赚，吃的脑满肠肥。矿业特许、税务减免以及数以十万计的廉价劳动力，使以克虏伯和IG法本为首的卡特尔在德属东亚建立起了几乎不受挑战的商业王国。等到黑色星期一降临，它们又理所当然地第一个伸手要求援助。\n\n哈尔并非那些梦想摧毁大型企业的激进分子。殖民地仍然需要它们的资本、机器与销售网络，但合作必须重新建立在政府主导的基础上。让卡特尔在东方享受优待并无不可，只不过这些大财主需要明白，是帝国给予他们在推动发展的同时捞上一笔的特权，而非帝国央求他们带动经济发展。"
 GEA_The_Eastern_Paradise_of_the_Immigrants:0 "移民们的东方天堂"
 GEA_The_Eastern_Paradise_of_the_Immigrants_desc:0 "黑色星期一让曾经上流社会的欧洲人发现，所谓安稳生活也可能在一夜之间化为乌有。无穷无尽在黑色星期一中丢失一切的失意人都在寻找新的机会；与此同时，德属东亚却仍缺乏受过高等教育或是欧洲文化浸染的人口。我们将通过扩大宣传来吸引他们前往东方。新加坡、西贡当然不会难以比得上欧洲的繁荣都市，但只要我们为这些冒险家提供机会，那么自然有源源不断地移民在此安居乐业。"
 GEA_Expanding_export-oriented_economy:0 "扩大出口式经济"
 GEA_Expanding_export-oriented_economy_desc:0 "从印度支那的稻田到马来亚的橡胶园，从锡矿到婆罗洲木材，德属东亚从诞生之日起便是一台面向海外市场运转的机器。黑色星期一已经残酷证明，这种结构使我们极易受到国际价格波动影响；但若因此放弃出口，无异于因为船可能遇上风暴便把港口全部填平。正确答案不是退出世界市场，而是让出口体系更加庞大多元，也更加牢固地连接上中欧同盟的庞大市场。随着情况稳定，港口设施将继续扩建，铁路与仓储网络要服务更多商品，金融机构也将为出口企业提供更宽容的信贷。"
 GEA_Connecting_culture_with_nationality:0 "连结文化与民族性"
 GEA_Connecting_culture_with_nationality_desc:0 "一个生活在河内的学生也许永远不会把自己视作德国人，但他完全可以使用德国机器、阅读德国学者的著作，在德国建立的学校接受教育，并把现代城市生活中的某些东西自然地同帝国联系起来。我们应当支持建设更多学校、博物馆与加大对本地语言与德语组成的双语出版物的支持，以此将德国文化同东方各民族的身份认同并置而非简单取代。如果这一切都能顺利进行，很快日耳曼文化与本地文化就会彻底洗刷各地的分歧，最终融合出新的属于德属东亚的文化与民族。"
 GEA_Restore_food_security:0 "恢复粮食保障"
 GEA_Restore_food_security_desc:0 "黑色星期一制造出了一个荒谬却危险的景象：印度支那的大米价格因为出口需求崩溃而不断下跌，农民卖粮所得甚至不足以覆盖成本；与此同时，由于囤积居奇与仓储混乱，城市的消费者却反而高价求购粮食。生产者愈发贫困，而城市居民依旧抱怨米价，这显然不是什么吉兆。通过设立粮价委员会、公共储备和运输协调，政府将重新打通从稻田到市场的链条。对于合格的总督来说，至少应当确保农民不会因为丰收而破产，市民也不会坐在粮仓旁边挨饿。"
 GEA_Eastern_Economic_Pump:0 "东方经济泵"
 GEA_Eastern_Economic_Pump_desc:0 "一个成功的殖民经济只局限于把原料装船送走是不够的。德国资本与金融应当不断流入东方，推动资源开采与工业生产；而这些投资又会产生更多出口、利润与订单，重新流回德国和整个中欧同盟。如此循环往复，德属东亚才能真正成为帝国全球经济中的一台强劲泵机，而非一只早晚会枯竭的自来水管。哈尔的经济改革正是为了恢复这套循环。在不久的将来，每一马克的资本流入，都应该推动更多马克的商品流出，而每一艘满载驶向欧洲的货船，又会成为下一轮投资的理由。"
 GEA_Even_closer_to_a_model_colony:0 "距模范殖民地更进一步"
 GEA_Even_closer_to_a_model_colony_desc:0 "“模范殖民地”一直是帝国殖民官僚最喜欢写在报告里的词语。过去，它只意味着帝国的殖民地能够自负盈亏甚至反哺国内。但这种定义已经过时了：德属东亚在过去为国内提供了无尽的财富，可本地官员却仍然看着本地居民向着造反越走越近。如今，哈尔希望让这个词至少比过去多一点更意义：地方传统没有被简单摧毁，而是被纳入现有的行政体系之中；德国人与本地人尽可能平等相待；财富也不是无限制的流入德国卡特尔的钱包之中。尽管距离这些目标仍有距离，但对于德属东亚而言，至少这个松散的殖民地联合已经开始迈入正轨。"
 GEA_Governor_Josias:0 "亲王驾临"
 GEA_Governor_Josias_desc:0 "约西亚斯·楚·瓦尔德克-皮尔蒙特亲王从来不是那种会满足于充当一名普通殖民官僚的人。军旅生涯、家族门第与多年积累的政商关系，使他习惯于把正式职位视作施展个人影响力的工具，而非限制自身行动的框架。如今，德属东亚这个远离柏林、横跨无数港口与殖民领地的庞大行政体，恰好为这种治理方式提供了最适宜的舞台。"
 GEA_Josias_Group:0 "约西亚斯的王廷"
 GEA_Josias_Group_desc:0 "亲王上任不久，总督府周围便出现了一批越来越固定的面孔。除了旧日军中同僚或是政府官员外，还有数位来自德国本土的贵族与企业界。随着这些要员们在政府内部拥有了或高或低的职位，一张关系网开始逐渐在德属东亚内部形成。\n\n“约西亚斯的王廷”，这个一部分知情者为这个小团体所取得绰号最初多少带有讥讽意味，毕竟德属东亚不是瓦尔德克的世袭领地，总督府也没有宫务大臣和御前侍从。然而，随着约西亚斯不断拉拢亲信排除异己，这个绰号正在逐步变得愈发真实。"
 GEA_The_close_bond_of_dual_in-laws:0 "双重姻亲的亲切纽带"
 GEA_The_close_bond_of_dual_in-laws_desc:0 "德意志诸侯家族之间错综复杂的婚姻关系，往往比任何正式的政治盟约都更加牢靠。约西亚斯亲王与奥尔登堡世袭大公尼古拉斯之间的关系便是其中尤为特殊的一例：亲王迎娶了尼古拉斯的妹妹阿尔特堡，而尼古拉斯又娶了约西亚斯的妹妹海伦娜，使瓦尔德克与奥尔登堡两大家族通过两桩婚姻紧密联系在一起。如今，远在东方的约西亚斯正需要这些留在德国本土的亲戚提供帮助。我们可以借助尼古拉斯在北德贵族、政界与商业圈子中的影响力，为德属东亚争取更多投资与政治支持，并通过私人往来绕过柏林那些繁琐的官僚程序。毕竟，在贵族的世界里，一封来自亲戚的私人信件，有时远比殖民部的正式公文更加管用。"
 GEA_The_wise_men_of_the_sovereignty_faction:0 "主权派的智者"
 GEA_The_wise_men_of_the_sovereignty_faction_desc:0 "中央非洲的主权派在柏林拥有极其糟糕的名声，这并非毫无缘由。赫尔曼·戈林及其追随者已经将德意志殖民协会、军队与个人野心纠缠到了一起，甚至有人开始公开讨论一个不再听命于帝国中央的非洲国家。对于任何希望维持帝国秩序的人而言，这样的终点都没有多少值得效仿之处。\n\n然而，支撑这群人野心的思想并不全都来自戈林本人。卡尔·施密特有关主权、紧急状态与最终裁决权的论述，正在德国法律界引发越来越广泛的争议。在他的理论中，谁有权宣布出现例外，又由谁决定应当如何应对，谁便掌握了政治秩序真正的核心。\n\n这种理论放在柏林或许仍只是法学争辩，放到德属东亚却显得异常切合现实。与柏林的遥远距离使得任何情况不会等候议会慢慢讨论，而总督也不可能把每一次紧急决定都送回本土请示。因此，约西亚斯开始与主权派的代表人物们接洽，准备以相同理念治理帝国的两大殖民地。"
 GEA_The_Secret_Party_of_the_General:0 "将军之秘党"
 GEA_The_Secret_Party_of_the_General_desc:0 "库尔特·冯·施莱谢尔并没有建立一个真正意义上的政党。事实上，这位“红色将军”最引以为傲的，恰恰是自己根本不需要那种东西。多年以来，他凭借在军队、宫廷与保守派政界中积累的人脉，将奥斯卡·冯·兴登堡、费迪南德·冯·布雷多、哈默施泰因-埃克沃德，以及更多从未公开加入任何政治集团的人物维系在身边。\n\n约西亚斯与施莱谢尔并非旧日知交，但两人之间并不缺少可以牵线的人。亲王本人曾长期服役于军中，瓦尔德克家族又同帝国宫廷及诸多军官世家保持着天然联系；在野心勃勃的红色将军看来，一位同样充满野心远赴东方执掌大权的德国王公，本就是秘党的合适成员。\n\n更何况，施莱谢尔从来不吝于把合适的人送到合适的位置。对他而言，德属东亚既远离帝国议会的争吵，又拥有军政、企业与殖民行政上的大量职位，正适合安置那些有能力、有野心，却暂时在柏林找不到位置的人。而对约西亚斯而言，这些军官、官僚和政治掮客同样比殖民事务部按部就班派来的普通人有价值得多。双方的往来因此很快越过了礼节性的寒暄，而很快亲王也能够与这位红色将军达成更深度的合作，谋划更大的野心。"
 GEA_Brotherly_affection:0 "表兄情谊"
 GEA_Brotherly_affection_desc:0 "萨克森-科堡-哥达家族与瓦尔德克-皮尔蒙特家族之间的亲缘关系，可以追溯到上一个世纪那些遍布欧洲宫廷的王室婚姻。如今执掌科堡家族的查尔斯·爱德华公爵，虽然与约西亚斯亲王并非同辈的亲兄弟，却同样是这张贵族亲缘网络中的重要人物。作为一位拥有英国王室血统、却始终将自己的政治命运与德意志帝国联系在一起的公爵，查尔斯·爱德华在德国保守派与贵族社会中拥有不容忽视的影响力。约西亚斯相信，彼此之间的家族情谊足以成为进一步政治合作的基础。通过加强与科堡宫廷的私人往来，我们将能够接触更多具有影响力的贵族、军官与政界人士，使德属东亚的利益不再只能依靠殖民部那些缺乏热情的官僚来维护。"
 GEA_The_friendship_with_the_publicity_magnate:0 "与实业家联盟的友谊"
 GEA_The_friendship_with_the_publicity_magnate_desc:0 "尽管从未投身商界，但亲王头脑中始终清楚的意识到：除却海陆空三军之外，支撑起帝国世界蓝图的基石还包括数不清的大大小小的卡特尔们。而其中几个规模较大的卡特尔与其他名声显赫的实业家们共同成立了实业家联盟，以此达成整个帝国帝国工商业的微妙平衡。如今，随着东方开发计划的推进，约西亚斯总督也需要与这些在幕后维持帝国的基石人物们达成良好关系，以确保在未来能够为自己的小小王国赢得更多资源倾斜与政治庇护。"
 GEA_To_liberate_the_market_for_cartels:0 "工业卡特尔之利害"
 GEA_To_liberate_the_market_for_cartels_desc:0 "德属东亚拥有丰富的矿产、橡胶与其他热带资源，却始终缺乏足够的资本与技术将它们转化为真正的工业财富。约西亚斯亲王很清楚，单凭殖民地政府的财政收入，根本无法承担大规模工业化所需要的庞大投资。因此，我们必须主动向德国本土的工业卡特尔敞开大门，邀请克虏伯、IG法本及其他大型企业参与远东的开发。作为交换，总督府可以为这些企业提供土地、税收优惠及长期经营特许权，并利用亲王在柏林上层社会的人脉促成相关交易。当然，亲王绝不会允许这些工业巨头像在其他殖民地那样反客为主。企业可以获得丰厚的利润，但它们必须明白，决定德属东亚经济政策的最终权力，仍然掌握在瓦尔德克亲王的手中。"
 GEA_Take_charge_of_the_ocean_passage:0 "执掌大洋通路"
 GEA_Take_charge_of_the_ocean_passage_desc:0 "对于一个远离德国本土、依靠海洋维系生存的殖民地而言，港口与航线的重要性远胜于欧洲大陆上的任何一条公路。新加坡、槟城与印度支那沿岸的港口，不仅是帝国远东贸易的枢纽，也是德国海军维持亚洲影响力不可或缺的支点。约西亚斯亲王计划进一步加强总督府对港务管理、航运合同与海上贸易的控制，并争取德国大型航运企业及海军部门的支持，以扩大德属东亚在马六甲海峡与南中国海的影响力。通过协调商船运输、港口建设及海军补给，我们将能够确保殖民地的商品顺利进入世界市场，同时使任何试图挑战德国远东利益的势力都必须考虑到我们的海上力量。谁控制了通往东方的航道，谁便掌握了这片殖民地的命脉。"
 GEA_AOG_under_the_Shadow_of_the_Prince:0 "阴影下的监事会"
 GEA_AOG_under_the_Shadow_of_the_Prince_desc:0 "东亚总监事会，更多时候被人们简称为A.O.G，本是德意志帝国总揽在东方的一切投资金融乃至驻军等重要事务的专项机构。可随着德国在东方的投资与干涉后秩序的稳定，A.O.G则开始逐步向一个金融监管机构靠拢，而它的其他职能则被分散给了使馆城市与德属东亚。如今，为了彻底渗透并掌控德意志在东方的一切大小事务，约西亚斯必须将自己的权力触手伸向东亚总监事会。可以预见的是，随着监事会中越来越多的官员被收买或胁迫，在未来会议仍会照常召开，而报告就将先呈交新加坡方面，再由他们代为提交柏林。"
 GEA_Supreme_authority_of_the_prince:0 "亲王权威至高无上"
 GEA_Supreme_authority_of_the_prince_desc:0 "德属东亚的历任总督都不得不面对一个令人头疼的问题：殖民部、海军、陆军、商业财团与地方行政机关各自拥有权力，却又经常为了预算和职权争执不休。约西亚斯亲王绝不打算容忍这种局面继续存在。身为德意志帝国的贵族与皇帝亲自任命的总督，他理应在殖民地事务中享有不容挑战的最高权威。我们将重新划分各部门的职责，要求驻军指挥官、地方官员与经济机构直接向总督府负责，并逐步清除那些试图依靠柏林背景抗拒亲王命令的官僚。德国皇帝的统治权威将在东方得到充分尊重，但在这片遥远的土地上，具体如何贯彻帝国的意志，只有约西亚斯亲王本人有资格作出决定。"
 GEA_Orderly_territory:0 "秩序领地"
 GEA_Orderly_territory_desc:0 "德意志帝国骄傲的海外殖民地正在被黑色星期一后爆发的源源不断的内部抵抗与外部势力所冲击。从西贡到新加坡，再从顺化到文莱，德属东亚的秩序正在一点点瓦解，而这既不是约西亚斯总督想要看到的，也不是柏林的殖民办公厅所乐意见到的。\n\n因此，亲王将任命数名他所信任的殖民地官员来构建一套全新的法令制度，以此收紧对德属东亚辖下的分散的各处殖民地的掌控。尽管社会上会毫不令我们意外的出现大批量的反对声音与抵触情绪，但这些都是为了德意志帝国光荣的黑白红三色旗仍然高高的飘扬在将来的东南亚土地之上。"
 GEA_Serve_monarch_but_not_necessarily_be_patriotic:0 "忠君...但未必爱国"
 GEA_Serve_monarch_but_not_necessarily_be_patriotic_desc:0 "约西亚斯亲王从未怀疑过自己对霍亨索伦皇室的忠诚，但他对于那些动辄将德意志民族利益挂在嘴边的柏林政客，却没有多少敬意。在亲王看来，忠于皇帝与无条件服从帝国政府的每一项命令，完全是两回事。德国本土的议员或许可以为了选票与意识形态争论不休，但远东殖民地的治理绝不能受到这些无谓纷争的摆布。只要德属东亚继续承认皇帝的宗主权，履行必要的军事与财政义务，那么殖民地的内部事务就应当由总督自行决定。即使柏林某些政策与我们的利益发生冲突，亲王也有充分的理由采取更加灵活的立场。"
 GEA_Domesticating_the_General_Staff_Department:0 "驯服总参谋部"
 GEA_Domesticating_the_General_Staff_Department_desc:0 "德属东亚的军事机构长期以来习惯于独立行事，部分高级军官甚至认为，殖民地的防务应当完全由驻军司令部决定，总督只需负责提供经费与行政支持。这在约西亚斯看来无疑是对其统治权威的公然挑战。军队固然是维护帝国在远东利益的必要工具，但它绝不能成为一个约束的独立权力中心。我们将重新调整殖民地军事指挥机构的权限，将重要军官任命、军事预算与战略部署纳入总督府的监督，并利用亲王与德国本土军界的私人关系争取支持。那些愿意服从的将领仍可得到荣誉与晋升，而执意维护军方特权的人则必须接受现实：德属东亚的军队应当为亲王服务，而不是反过来决定亲王该如何统治。"
 GEA_Only_Josias:0 "威廉？我们只认约西亚斯！"
 GEA_Only_Josias_desc:0 "没人能够准确说出这句话最初来自哪里。也许是一场军官晚宴，也可能是一群喝醉的殖民官员在新加坡俱乐部里的玩笑，甚至其根本就是空穴来风的无稽之谈。然而，这句话能够迅速流传，自然不是毫无缘由。对于远东的德国人而言，皇帝是帝国秩序的最高象征，却也只不过每日高坐于半个世界之外的皇宫之中，聆听着宰相与大臣报告的帝国情况。相比于真正决定他们第二天的未来的约西亚斯，皇帝本人在远东官员心目中的地位在开始不断跌落。当然，没有人会在公开场合谈起此事，但总督本人的光芒正在渐渐盖过皇帝的权威。"
 GEA_Cold_Rule:0 "冷酷之治"
 GEA_Cold_Rule_desc:0 "约西亚斯亲王十分清楚，维持一个远离本土、民族与宗教关系错综复杂的殖民帝国，需要的不仅是恩惠与妥协，还有在必要时毫不犹豫地采取强硬措施的决心。总督府将加强对地方行政机构与治安机关的监督，扩大政治情报网络，并严厉惩处那些被认定为威胁殖民地安全的组织和个人。与此同时，亲王也不会容忍德国官员利用职权中饱私囊，或让无能的下属损害他的威望。对于愿意服从的人，他可以表现得慷慨而仁慈；但对于拒绝接受其权威的人，等待他们的将是毫不留情的惩罚。在这片土地上，仁慈是一种可以由统治者自行决定是否赐予的恩典，而绝非臣民与生俱来的权利。"
 GEA_Make_good_use_of_the_theory_of_external_threats:0 "善用外部威胁论"
 GEA_Make_good_use_of_the_theory_of_external_threats_desc:0 "日本海军的扩张、中国军阀之间无休止的战争，以及工团主义革命在亚洲的蔓延，无不提醒着德属东亚的居民，他们正生活在一个充满危险的时代。约西亚斯亲王深知，这些威胁既是殖民地必须面对的现实，也能够成为巩固自身权力的有力工具。只要让德国商人、地方贵族与殖民地官员充分认识到外部局势的危险，他们便更容易接受加强治安、扩大军费以及集中行政权力的必要性。"
 GEA_Impermeable:0 "德属东亚铁板一块"
 GEA_Impermeable_desc:0 "德属东亚长期以来最严重的弱点，并非缺少军舰或士兵，而是统治集团内部始终无法形成统一的意志。殖民官员争夺行政权限，军方要求更多预算，德国企业希望获得经营特权，而地方精英则不断试探总督府能够作出多少让步。约西亚斯亲王已经决心结束这种四分五裂的局面。通过整顿官僚体系、协调军方与企业的利益，并将殖民地各派势力逐步纳入自己建立的政治网络，我们将使德属东亚成为一个能够对外采取统一行动的整体。远东的德国人可以拥有不同的利益，但在涉及殖民地命运的问题上，他们只能有一个共同的声音，便是来自总督本人的声音。"
 GEA_Domesticating_the_East:0 "目视东方"
 GEA_Domesticating_the_East_desc:0 "自世界大战结束以来，德意志帝国便通过扶植直系军阀、支持北京的清廷以及扩大在华商业特权，逐步建立起横跨中国东部的庞大利益网络。然而，柏林的政客往往将中国视作一个遥远而次要的外交问题，既缺乏对当地复杂政治局势的了解，也不愿承担进一步干涉所需的代价。但在约西亚斯看来，中国不仅是德属东亚最重要的贸易伙伴，更是决定帝国远东霸权能否长久维持的关键。随着日本势力不断向中国渗透，德国绝不能继续满足于维持现有的商业利益。我们将加强与中国各地亲德军阀的联系，扩大对地方政府的财政援助与军事顾问派遣，并利用德华银行及通用东亚公司的力量，更加积极地干预中国的政治事务。"
 GEA_Promote_the_colonial_corporation_system:0 "柏林指导下的东亚经济"
 GEA_Promote_the_colonial_corporation_system_desc:0 "帝国在过去四十年间从无到有在东方建立的经济体系从来不是什么慈善事业。德国企业提供机器、船舶与技术，而殖民地则向本土供应橡胶、锡矿、煤炭、木材和农产品，再以所得收入购买德国工业品。这种互补关系正是帝国海外经济能够迅速扩张的基础。\n\n问题在于，几十年的特许经营、私人合同与地方利益已经使这套体系越来越难以控制。某些企业只关心眼前利润，一些地方政府则为了短期财政收入给予过度优惠，而银行和航运公司又往往各自规划自己的东方战略。约西亚斯无意摧毁私人经营。相反，他希望使这些力量重新朝着同一方向行动。为了跟上本土工业改革的步调，德属东亚也需要及时调整航向，更好的为帝国的经济蓝图服务。"
 GEA_Consider_the_issue_of_cartels:0 "斟酌卡特尔问题"
 GEA_Consider_the_issue_of_cartels_desc:0 "克虏伯、IG法本以及其他德国工业巨头的资本，无疑能够为德属东亚带来急需的工厂、设备与技术，但企业集团对殖民地经济的影响也正在逐渐超出总督府的控制。它们通过长期经营特许、独占采购合同与银行贷款，将矿山、铁路、种植园和港口连接成庞大的商业网络，甚至开始利用自己在柏林政界的人脉影响殖民政策。约西亚斯亲王当然不会愚蠢到与整个德国工业界为敌，但他也绝不愿意看到自己的领地沦为某家企业的私人产业。我们必须重新审查各类特许合同，限制卡特尔在关键行业的独占地位，并鼓励不同企业之间相互竞争，使总督府始终保有最终裁决权。亲王欢迎企业家前来东方发财，但前提是他们必须清楚，谁才是这里真正的主人。"
 GEA_East_Arolsen:0 "东方阿罗尔森"
 GEA_East_Arolsen_desc:0 "阿罗尔森宫并不是欧洲最宏伟的王宫，却足以象征瓦尔德克家族数百年的身份。其巴洛克式外观、对称布局与法国宫廷建筑影响，使这座位于德国中部的小邦宫殿拥有远超其国土规模的气派。约西亚斯在那里长大，也从未掩饰自己对故乡宫廷生活的眷恋。新加坡诚然是帝国在远东的明珠，但其建设与文化在亲王心中远不如阿罗尔森的故乡。随着亲王在东方的停留逐渐变得长期化，在当地营建一处真正属于自己的宅邸，乃至进一步将家乡文化引进当地，也开始显得顺理成章。很快，唐林一带较为凉爽的高地被选作地址，而建筑师则被要求以阿罗尔森宫为参考，又必须适应热带气候。于是巴洛克立面之外增加了深檐、宽阔凉廊、百叶窗与通风庭院，花园中的欧洲几何布局也不得不同棕榈和兰花共存。这栋宏伟的官邸将成为亲王改建他新的家园的第一步。"
 GEA_Introduce_technocrats:0 "引进技术官僚"
 GEA_Introduce_technocrats_desc:0 "血统与忠诚或许能够决定一个人是否值得信任，却不能保证他能否尽到自己的职责。约西亚斯亲王虽然重视贵族传统，但也十分清楚，德属东亚复杂的经济与行政事务不能完全交给那些依靠家族关系获得职位的庸碌之辈。我们将从德国本土招募具有专业知识的工程师、经济学家、法律顾问与行政专家，让他们协助总督府规划基础设施、改善财政管理，并监督殖民地的工业与贸易发展。这些技术官僚可以享有优厚待遇和充分的专业权限，但他们必须始终服从亲王制定的政治方向。在德属东亚，专业知识负责解决问题，贵族权威负责决定目标。"
 GEA_Boost_tourism_even_more:0 "再刺激旅游业"
 GEA_Boost_tourism_even_more_desc:0 "德属东亚并不缺少值得旅行的地方。法国人在大叻留下了避暑设施，英国人开发过槟榔山和马来亚高原，而吴哥古迹、下龙湾以及婆罗洲群山则根本不需要欧洲殖民者替它们发明景色。过去真正欠缺的，是把这些彼此分散的目的地连接起来，并将它们包装成德国游客真正愿意购买的旅行产品。\n\n黑色星期一使传统出口产业受到重创，也迫使航运公司与铁路寻找新的客源。与其让邮轮每天无所事事的停泊于港口，不如通过铺天盖地的宣传来让德国中产阶级搭乘它们来到东方。政府将资助旅馆、交通设施与海外宣传，鼓励旅行社设计横跨新加坡、印度支那和马来亚的线路。如果自然资源能换来收入，那么那些景色和阳光也一定能。"
 GEA_Accumulation_of_real_estate:0 "聚敛地产"
 GEA_Accumulation_of_real_estate_desc:0 "经济危机使德属东亚许多土地与种植园的价格一路雪崩。尽管我们如今的经济政策已经缓解了市场的崩盘，但这些地产的价格仍然处在一个令人垂涎的位置。为了聚敛更多的土地充实自己的财产，同时也是为今后拉拢关系与收买下属攒足资本，约西亚斯总督与他的下属们调动起现有的流动资金大批量收购市场上的低价土地。在市场回到属于它那理应所处的价格位置前，大量的土地与资产已经被总督和他的亲信们所拥有。名义上，这些新的土地属于政府开发用地，实则早已属于亲王的个人财产。"
 GEA_New_noble:0 "新晋“贵族”"
 GEA_New_noble_desc:0 "东方并没有多少真正意义上的德意志贵族，不过这似乎也不是什么大问题。实际上对于德属东亚的每位名流，只要拥有财富、关系和亲王的信任，实际上已经能够享受到许多贵族才有的待遇。同时对于那些宣誓效忠于总督本人的人，他们所得到的封赏与权力也早已不再局限于纸面之上。久而久之，这些被总督一手提拔的官员与军官们已经成为德属东亚的一个特殊的“新贵”阶层，而更多的人也正为了攫取更多权势与利益而鞍前马后争相效劳于总督本人。"
 GEA_The_private_estate_of_Josias:0 "约西亚斯的私人封地"
 GEA_The_private_estate_of_Josias_desc:0 ""经过多年的经营，约西亚斯亲王终于在德属东亚建立起一个几乎完全依附于自己的统治集团。殖民地官员的晋升需要得到他的认可，军方高级将领必须争取他的信任，工业财团则通过私人协议与特许经营权维持同总督府的关系。就连那些名义上享有自治地位的本土君主与地方贵族，也越来越习惯于将自己的请愿直接送往亲王的办公桌，而非遥远的柏林。德属东亚仍然是德意志帝国不可分割的海外领土，皇帝的肖像依旧悬挂在每一座政府机关之中，但殖民地的日常运作已经与瓦尔德克家族的个人权威密不可分。柏林或许仍然拥有任免总督的法定权力，但要在不引起整个殖民地政治体系动荡的情况下将亲王撤换，恐怕已不再是一件容易的事情。"
 GEA_Prinz_Kaiser_Deutschland:0 "亲王，皇帝，德意志！"
 GEA_Prinz_Kaiser_Deutschland_desc:0 "德意志帝国的辉煌建立在诸侯的忠诚、军人的牺牲与历代君主所维系的秩序之上，而约西亚斯亲王坚信，这些古老的原则同样能够在遥远的东方生根发芽。如今，德属东亚已经不再是一个任由柏林官僚、军方将领与工业财团争相瓜分利益的混乱殖民地，而是在亲王领导下拥有统一行政体系、可靠军事力量与独立经济基础的海外领地。我们仍将承认霍亨索伦皇室的至高地位，并以维护德意志帝国的荣耀为己任，但远东的未来必须由那些真正为它付出心血的人决定。约西亚斯不需要一顶新的王冠来证明自己的权威，也无须与皇帝公开决裂；只要帝国愿意尊重他的地位，那么德意志的黑白红三色旗便将继续飘扬在亲王的领地上空。忠于亲王，忠于皇帝，忠于德意志！"
 GEA_Governor_Heye:0 "海耶元帅经略东方"
 GEA_Governor_Heye_desc:0 "威廉·海耶接手的并非太平无事的殖民领，而是一台已经运转多年、却在各处发出异响的朽坏机器。来自内外的威胁时刻准备动摇黑鹰在东方的落脚点，而殖民军却装备老旧，基建失修吗，唯一可依靠的只有大洋之上的分遣舰队。海耶没有兴趣继续维持这种勉强过得去的状态。德属东亚的官僚机器与三军必须重新被拧成一个整体，以确保德属东亚的统治能够伫立。对新任总督而言，德属东亚并不需要更多关于繁荣与文明使命的漂亮话。他来到此地唯一的目的即为统治。"
 GEA_Reconstruction_of_the_breakwater_project:0 "重启防波堤工程"
 GEA_Reconstruction_of_the_breakwater_project_desc:0 "所谓“防波堤工程”，最初只是出现在东亚总参谋部内部文件中的一个代号，用来概括新加坡、马六甲、海防、西贡以及其他重要港口周边的一整套海岸防御构想：永久炮位、混凝土掩体、反登陆障碍，以及能够在敌军真正踏上滩头之前便将其钉死在海面上的岸防火力。\n\n过去，这些计划往往因为预算不足、地方工程优先级冲突和柏林方面的轻视而被一再推迟。如今海耶已经没有耐心继续等待。随着日本威胁日益迫近，德属东亚必须尽快把那些仍停留在图纸上的防线真正浇筑进海岸。政府将重新启动“防波堤工程”，并授权各地依据战略价值分批建设海岸要塞与纵深防线。"
 GEA_Germany_Calling:0 "本土来电"
 GEA_Germany_Calling_desc:0 "德属东亚在过去十余年里为帝国贡献了无数橡胶、锡矿与关税收入，可真正轮到东亚官僚们请求帮助时，柏林却总显得格外吝啬。由于提尔皮茨的去世与祖国党的分崩离析，帝国的新政府对维持东方的霸权总是兴致缺缺，更不用说加大东方预算了。广州远征后几乎停滞的陆军换装便是最好的证明：东亚分舰队尚且换过几轮舰艇，陆上的官兵却仍不得不依赖大战时期留下的装备维持秩序。\n\n海耶不准备继续接受这种局面。既然帝国仍把东方称作自己的骄傲，就应当拿出与这种骄傲相称的投入。现在该让柏林认真听听来自新加坡的声音了。"
 GEA_Resist_external_instigation:0 "抵抗外部煽动"
 GEA_Resist_external_instigation_desc:0 "印度支那的民族主义运动与工团主义叛乱，绝非仅仅依靠当地几名激进分子便能够发展到今天的规模。来自第三国际的革命宣传、日本情报机关的秘密活动，以及中国境内形形色色的政治组织，都在不同程度上试图利用德属东亚内部的不满情绪，削弱帝国在远东的统治。殖民地政府过去过于重视镇压已经发生的骚乱，却忽视了那些在背后提供资金、武器和政治支持的境外势力。只有切断这些外部势力伸向殖民地的触手，德属东亚才能真正免受革命与颠覆活动的威胁。"
 GEA_Strike_hard:0 "混乱时局需下猛药"
 GEA_Strike_hard_desc:0 "印度支那已经经历过太多所谓“暂时性的治安问题”。每一次局势稍有好转，部队就因包括预算不足在内的诸多原因而不得不撤退。而随后新的地下组织和武装小组又会从原本已经清理过的地区重新冒出来。海耶不准备继续这种循环：为了彻底根治印度支那地区的叛乱顽疾，军队与情报组织将被重点部署到印支，尝试清查并破坏一切可能威胁德国统治的因素。"
 GEA_Smother_the_flames_of_nationalism:0 "踩灭民族主义火苗"
 GEA_Smother_the_flames_of_nationalism_desc:0 "民族主义始终比工团主义更令人棘手。潘佩珠留下的声望、安沛兵变的传说和“越南终有一日应由越南人统治”的念头，始终环绕在每个希望越南独立的印度支那蛮子心头。更麻烦的是，不少持这种想法的人白天仍照常经商、任职，却在暗地里与叛匪们私下勾连，来往密切。\n\n事实上，如今愿意与德国合作的人仍可得到利益与生路，而愿意遵守殖民秩序的名流也总会有德国主子为他们站台。海耶并不打算把所有越南人都推到德国的对立面，但要是所有印度支那人都不知好歹，那么海耶相信只靠德国也能将所有敢于反抗的野蛮人赶尽杀绝。"
 GEA_The_ten-year_struggle_against_the_Red_Ghost:0 "同赤色幽灵的十年斗争"
 GEA_The_ten-year_struggle_against_the_Red_Ghost_desc:0 "从广州到西贡，从被查抄的印刷所到雨林深处的交通站，德国人与印度支那工团主义者已经纠缠了整整十年。胡志明死了，越南革命青年团分裂了，一批又一批组织者被捕或被处决，可赤色幽灵始终没有真正离开东方。\n\n过去的经验至少教会了德国人一件事：单纯占领城镇和道路并不能自动摧毁一个地下组织。人员档案、秘密交通、筹款渠道、宣传网络和乡村掩护必须同时被纳入清剿范围。海耶准备把十年来零散积累的经验重新整理起来，让这场漫长的斗争不再只是一次又一次重复同样的扫荡。"
 GEA_Ensure_loyal_citizens:0 "确保忠诚市民"
 GEA_Ensure_loyal_citizens_desc:0 "德属东亚的繁荣建立在来自德国、中国、印度及东南亚各地的不同族群共同劳动的基础之上，但这种复杂的社会结构也为殖民地治安带来了诸多困难。海耶将军并不认为所有本土居民都天然值得怀疑，但他同样拒绝相信，仅凭对帝国法律的表面服从便足以证明一个人的忠诚。总督府将扩大居民登记、身份审查与地方警察的情报搜集工作，并要求公务员、警察及其他涉及殖民地安全的人员接受更加严格的背景调查。与此同时，那些愿意同政府合作的地方士绅、商会与社区领袖也将得到适当的信任与支持。我们不需要每一位居民都发自内心地热爱德意志帝国，但至少必须确保他们不会在下一场叛乱爆发时站到德国人的对立面。"
 GEA_In_perfect_order:0 "秩序井然...？"
 GEA_In_perfect_order_desc:0 "总督府的办公桌上，关于印度支那局势的报告正一份接着一份地送来。地方警察宣称治安已经恢复，驻军司令部则坚持要求继续加强戒备，而殖民地商会更关心贸易何时才能恢复正常。对于海耶将军而言，这些互相矛盾的意见并不值得惊讶。印度支那的政治局势从来不是依靠几道行政命令便能够彻底解决的问题，而他现在所能做的，就是确保殖民政府在下一场危机来临之前做好充分准备。至少从目前的官方报告来看，德属东亚仍然秩序井然。"
 GEA_The_armed_executioners_hand:0 "武装执行之手"
 GEA_The_armed_executioners_hand_desc:0 "德属东亚过去的治安体系始终存在一个令人尴尬的问题：隶属于警务部门的警察部队是维持印度支那现状的中坚力量，但他们并没有足够的能量来应对如今愈烧愈烈的叛乱之火。一旦事情真正演变成武装对抗，最后仍要等待军队赶来收拾残局。这种迟缓在眼下尚且能够忍受，但随着局势恶化，如此拖延无能确属失责。\n\n海耶希望警察与宪兵能够直接执行政府意志。它不必拥有正规军队的规模，却必须比以往更可靠，也比临时拼凑的别动队更适合处理突然发生的骚乱、搜捕和封锁行动。"
 GEA_The_surveillance_was_intense:0 "监视如芒在背"
 GEA_The_surveillance_was_intense_desc:0 "过去，德属东亚的殖民地警察往往只有在发生罢工、袭击或公开示威后，才会意识到地下组织的存在。然而，等到革命者走上街头，政府便已经失去了采取预防措施的最佳时机。海耶将军决定改变这种被动局面。我们将扩大政治警察与秘密情报人员的活动范围，在工厂、港口、学校及地方社团中建立更加可靠的情报网络，并加强对可疑通信与地下出版物的检查。地方警察将定期向总督府报告社会动态，而来自不同部门的情报也必须得到及时汇总。对于那些企图秘密组织反德活动的人而言，最令人不安的将不再是街头巡逻的德国宪兵，而是他们永远无法确定身边究竟有多少双眼睛正在注视自己。"
 GEA_Prutzmann-s_Einsatzgruppe:0 "普吕茨曼的秩序别动队"
 GEA_Prutzmann-s_Einsatzgruppe_desc:0 "殖民政府并不缺少能够执行搜捕和清剿任务的部队，真正缺少的是一支不必在军队、警察和地方行政之间反复请示的常设力量。汉斯-阿道夫·普吕茨曼正适合承担这项工作。他早年的经历与后来被派驻东方的旅程中形成了对治安战争的理解，此后又长期接触乡村而对地方社会中的土地与粮食控制熟悉无比。在他的主持下，一支直属于总督府的别动队将被组建起来。它的成员吸纳了德军中最精于反游击作战与乡村扫荡的专家，同样还有一些残忍的审讯专家随军一同行动。尽管别动队的行事风格残忍无比，但普吕茨曼只关心命令是否被贯彻、目标是否被清除。至于连带的伤亡与惨剧，谁会在乎呢。"
 GEA_method_from_Abteilung_III_b:0 "第三b分局的手段"
 GEA_method_from_Abteilung_III_b_desc:0 "在世界大战期间，德国总参谋部第三b分局曾负责搜集军事情报、开展反间谍活动并监视敌对势力的秘密行动。尽管战争早已结束，但该机构在情报组织、人员甄别与反间谍工作方面积累的经验，仍然具有相当的价值。海耶将军认为，面对印度支那复杂的地下政治网络，德属东亚同样需要一套更加专业的军事情报体系。我们将借鉴第三b分局的组织方式，建立由军方主导的情报协调机构，加强对线人、秘密调查员及反间谍人员的训练，并推动宪兵、殖民地警察与军事情报部门之间的信息共享。过去依靠地方官员个人经验与零散密报维持的治安制度，将逐步被一套更加系统而严密的情报网络所取代。"
 GEA_Comprehensive_monitoring:0 "全面监控"
 GEA_Comprehensive_monitoring_desc:0 "随着殖民地情报机构不断扩张，一个长期困扰总督府的问题也逐渐显现：各部门分别掌握着大量关于地方社会、政治组织与可疑人员的情报，却缺乏统一的整理与分析机制。海耶将军已经决定结束这种低效的工作方式。我们将建立覆盖德属东亚主要城市、港口与交通枢纽的情报汇报体系，统一管理政治警察、宪兵与地方行政机关搜集的资料，并将重要人员、社团及组织纳入持续监视的范围。借助更完善的档案制度与通信网络，总督府将能够及时掌握殖民地各地的政治变化，而无需等待地方骚乱真正发生之后才仓促作出反应。"
 GEA_Militarization_of_the_police_force:0 "警察部队军事化"
 GEA_Militarization_of_the_police_force_desc:0 "印度支那各地的警察部队长期承担着远超普通治安工作的职责。搜查地下组织、护卫铁路、镇压罢工乃至协助围捕游击队，早已成为许多地方警署的日常事务。然而他们的编制、训练和装备却仍停留在旧式殖民警察的水平，不少基层人员甚至缺乏应付有组织武装抵抗的能力。海耶政府决定结束这种名不副实的状态。警察部队将接受更加严格的军事训练，其指挥体系也会进一步向军方靠拢。在德属东亚，治安与战争之间的界线早已没有想象中那样分明，因此警察也必须具备能够被投入到小规模武装对抗中的能力。"
 GEA_Pass_emergency_authorization:0 "通过紧急授权"
 GEA_Pass_emergency_authorization_desc:0 "德属东亚现行的殖民地行政制度，虽然能够满足和平时期的日常治理，却在面对大规模叛乱与政治危机时暴露出了严重的局限。军方需要获得地方政府的配合，警察行动受到繁琐程序的制约，而总督府则必须在各部门之间反复协调，才能批准一项紧急措施。海耶将军认为，这种制度绝不能继续妨碍殖民地的安全。我们将以当前印度支那的紧张局势为由，推动通过一项特别授权，使总督得以在必要情况下直接调动军警力量、限制特定地区的集会与交通，并简化有关军事安全事务的行政审批程序。"
 GEA_The_normalization_of_martial_law_regime:0 "戒严制度常态化"
 GEA_The_normalization_of_martial_law_regime_desc:0 "最初，殖民地的戒严措施仅仅是为了应对印度支那的严重骚乱而临时实施。然而，随着一次又一次紧急状态的宣布，海耶将军逐渐认识到，恢复过去那套繁琐的文官行政制度似乎已经没有多少实际意义。军事管制不仅能够保证军警部门迅速应对突发事件，也使总督府得以绕过地方官员之间无休止的争论，直接处理涉及殖民地安全的重要事务。因此，我们将重新制定戒严地区的管理条例，赋予驻军更加明确的治安职责，并使特别军事法庭、宪兵巡逻及部分紧急行政措施成为殖民地治理体系的固定组成部分。官方文件仍然强调，这些制度只会在安全形势允许时逐步解除；但既然远东始终面临来自工团主义者、民族主义者与外国势力的威胁，究竟何时才能宣布真正的和平，恐怕谁也无法给出明确答案。"
 GEA_Another_peaceful_day_in_Indochina:0 "印度支那的又一个平静一天"
 GEA_Another_peaceful_day_in_Indochina_desc:0 "根据殖民地警察的最新报告，印度支那各主要城市的治安状况正在稳步改善。西贡的工厂恢复了生产，河内的商店重新开门营业，而那些曾经频繁出现在街头的抗议者，也似乎终于失去了继续制造骚乱的勇气。德国宪兵定期巡逻重要街区，军事检查站控制着通往乡间的主要道路，政治警察则不断更新有关地下组织的情报档案。总督府对此感到相当满意，并准备向柏林报告，海耶将军的治安政策已经取得显著成果。然而，这种平静并非毫无代价。越来越多的人开始习惯于在公共场合压低声音，地方报纸也学会了避开那些可能引起当局不快的话题。至少在官方统计中，罢工与示威的数量正在下降，而殖民地似乎终于迎来了又一个安宁的日子。"
 GEA_A_deal_with_the_villain:0 "与恶棍的交易"
 GEA_A_deal_with_the_villain_desc:0 "平心而论，海耶从未对远东的大型卡特尔抱有什么好感。它们在行情好的时候把利润送回汉堡与柏林，遇到危机便向总督府索取贷款和税收优惠；一旦政府试图插手经营，又立刻高谈所谓商业自主。可在德属东亚，这些企业偏偏缠绕在殖民地架构的每一块支撑柱上，因此把他们彻底击垮更是天方夜谭。\n\n因此，海耶选择同这些人坐到一张桌前。总督愿意暂时放松部分限制，也会继续给予那些配合者合同与便利；作为交换，卡特尔必须接受军政府对生产、投资和战略项目的优先安排。"
 GEA_Good_steel_used_for_the_blade:0 "好钢用于刀刃"
 GEA_Good_steel_used_for_the_blade_desc:0 "德属东亚的军事力量长期依赖德国本土提供武器、弹药与各种精密装备，但远隔重洋的补给线路不仅耗费巨大，而且随时可能因战争或海上封锁而中断。海耶将军深知，一支缺乏可靠工业基础的军队，即使拥有再优秀的军官与士兵，也终究无法独立承担保卫殖民地的重任。为此，我们必须将有限的财政资源优先投入军工产业，扩大兵工厂、弹药制造厂与军用机械设施的建设，并鼓励德国军火企业在远东建立生产基地。总督府将为相关企业提供优惠合同与必要的基础设施，同时推动殖民地现有工厂逐步承担军需物资的生产任务。尽管部分商人抱怨军工建设挤占了民用产业的投资，但在海耶看来，帝国的远东利益首先需要得到军队的保护，而真正可靠的军队绝不能永远依赖从汉堡运来的枪炮。"
 GEA_Smoke_billowed_from_the_dense_forest:0 "密林之中烟滚滚"
 GEA_Smoke_billowed_from_the_dense_forest_desc:0 "在德属东亚广袤的热带土地上，茂密的丛林与连绵的山脉不仅蕴藏着丰富的自然资源，也长期阻碍着殖民地工业的发展。大量矿产、木材与其他原料仍然只能经过简单加工后运往德国本土，而当地薄弱的交通与能源设施，则使建立大型工业基地变得困难重重。海耶将军认为，这种局面既限制了殖民地的经济潜力，也使远东驻军缺乏维持长期战争所必需的生产能力。我们将加快开辟新的工业用地，兴建发电厂、冶炼设施与机械工厂，并通过扩建铁路、公路和港口，将内陆资源产地同沿海工业中心连接起来。德国工程师与工业企业将为这些建设提供技术和资本，而总督府则负责协调土地、劳动力与运输资源。随着一座座厂房在昔日的丛林边缘拔地而起，轰鸣的机器与高耸的烟囱将逐渐改变远东的面貌，使德属东亚不再只是一片向帝国输送原料的殖民地，而成为能够支撑自身军事与经济需求的工业基地。"
 GEA_Amend_the_labor_regulations:0 "修订劳动条例"
 GEA_Amend_the_labor_regulations_desc:0 "德属东亚的许多大型企业早已习惯在劳工问题上进行无情压榨。黑色星期一以后，德属东亚政府又出于维持稳定的目的，施压企业向劳工们作出了不少临时性的让步。如今海耶政府准备重新审视这些软弱行径。新的劳动条例将给予军需企业和战略工程更大的用工自由，同时对地方工会与劳工组织进行全方位的彻底打击。警察与宪兵正在逐步调拨前往捣毁所有不服从的工会组织。而大型企业仍需向政府负责，但只要产量能够达到要求，新加坡并不打算过问每一项具体安排。"
 GEA_Pure_military_conduct_principles:0 "纯粹军人行事准则"
 GEA_Pure_military_conduct_principles_desc:0 "海耶对那些把殖民统治当成一场漫长政治协商的军官向来颇为轻蔑。在他看来，政府一旦开始考虑妥协而向这些当地人让渡利益，殖民本身便已经失去了应有的意义。殖民地首先是一片需要服从的领土，而不是等待德国人耐心说服的国度。新的行事准则因此将把军队重新从治安与维稳中抽离出来，单纯投入到镇压行动当中。而政府内部越来越多的职位被总督任命给了久经沙场的军人而非职业官僚。这种改变将让整个德属东亚的官员意识到，他们的职责是执行命令、恢复秩序并维持德国权威，而不是同地方势力讨价还价。"
 GEA_The_experience_of_the_old_colonial_period:0 "旧殖民时期的经验"
 GEA_The_experience_of_the_old_colonial_period_desc:0 "在世界大战以前，德国殖民军便曾在非洲反复面对一种与欧洲战场截然不同的战争。不像欧洲的惨烈现代战争，土著游击队依赖广阔乡野、部族关系与稀薄的行政控制不断消耗殖民当局。德国军官由此形成了一整套颇具自身特色的办法：依托据点控制交通要道，以机动纵队深入内地，对拒绝服从的地区实施惩戒，并把地方行政直接纳入军事行动的需要之中。如今印度支那的恶劣局势让人不禁想到过去的非洲殖民地的镇压行动。很快一部分拥有充足殖民战争经验的军官将被邀请到东亚，帮助驻扎在此的帝国军队荡平游击队。"
 GEA_Advocate_selfless_dedication:0 "推崇无私奉献"
 GEA_Advocate_selfless_dedication_desc:0 "远离德国本土的殖民地驻军，无法像欧洲的帝国军队那样随时获得充足的补给、增援与休整机会。炎热的气候、恶劣的卫生条件以及漫长而单调的驻防任务，往往比偶尔发生的武装冲突更加考验一名士兵的意志。海耶认为，要想维持一支可靠的远东军队，便必须培养官兵对于职责、纪律与集体荣誉的坚定信念。我们将加强军官的领导责任，改善部队内部的组织与训练，并通过军事宣传、荣誉表彰及退伍军人福利，鼓励士兵将个人利益置于部队使命之后。与此同时，那些在艰苦环境下仍能恪尽职守的军人将得到应有的认可。"
 GEA_Redraw_the_defense_zone:0 "全面防卫"
 GEA_Redraw_the_defense_zone_desc:0 "德属东亚的战略环境决定了我们不能仅仅依靠驻扎在主要城市的少数部队维持安全。漫长的海岸线、分散的岛屿、印度支那复杂的陆地边界，以及横贯南中国海和马六甲海峡的重要航道，使殖民地随时可能面临来自多个方向的威胁。海耶将军决定重新审查整个远东的防御部署，根据港口、交通枢纽、军事基地与重要工业设施的战略价值划分新的防卫区域，并明确各地驻军在战时的职责。无论威胁来自日本舰队、中国大陆，还是印度支那的革命武装，帝国都必须拥有一套能够及时作出反应的完整防御体系，而不是等到危机真正爆发时再仓促调动部队。"
 GEA_Taking_the_Herelo_War_as_an_example:0 "以赫雷罗战争为范"
 GEA_Taking_the_Herelo_War_as_an_example_desc:0 "德属西南非洲的赫雷罗战争长期以来都是帝国殖民史中最具争议的一页。洛塔尔·冯·特罗塔所采取的极端手段，即便在当时的德国也曾引起激烈争论；然而在殖民军官的专业讨论中，另一部分经验却始终被视为圭臬：如何在广阔而人口稀疏的地区切断叛乱者的行动空间，或是如何通过控制水源、道路与牲畜，持续施压迫使整个地区失去继续抵抗的能力。\n\n海耶政府并不准备照搬西南非洲的一切，但那些关于封锁、迁移、控制补给与持续追剿的旧报告正重新进入行政与军事官员的视野。印度支那的环境当然不同，但同样为令人厌烦的依托恶劣且炎热的环境为非作歹的游击队，赫雷罗战争也一定能为如今的德属东亚的殖民治安战带来足够的启示。"
 GEA_The_brutal_expansion_under_the_command_of_order:0 "秩序号令下的野蛮扩张"
 GEA_The_brutal_expansion_under_the_command_of_order_desc:0 "黑色星期一以后，德属东亚的大型企业一度陷入收缩。新厂停建，矿区缩减投资，甚至连克虏伯这样的巨头也宁愿守住现有资产，不肯再冒险扩张。海耶上台后，这种谨慎很快被视作另一种形式的消极怠工。既然总督已经以军队和宪兵替企业压住罢工、清理道路并恢复交通，那么所有依靠帝国庇护维持经营的公司，也理应拿出相称的行动。\n\n海量的订单与合同将优先交给愿意响应政府要求的企业。而资源开发也将以飞速扩张，同时地方官员也被告知不得让漫长的申诉程序妨碍工程推进。至于它们会在地图之外留下多少鲜血与怨恨，那也不是新加坡的考虑范围。"
 GEA_Fidelity_Service:0 "忠实服务"
 GEA_Fidelity_Service_desc:0 "海耶对那些在远东赚的脑满肠肥的企业并无反感，但对那些享受帝国保护，却在政府真正需要时仍把股东利益置于命令之前的蛀虫，总督就不会给他们任何好脸色了。今后，大型企业能否继续获得合同、信贷和特权，将越来越取决于它们是否愿意配合新加坡的每一道行政命令。按时完成军需订单、并接受配给和价格安排甚至还能向政府提供协助的公司，自然会被视为可靠伙伴；但反复讨价还价者则会发现，殖民地并非只能同他们做生意。"
 GEA_Obedience_brings_rewards:0 "服从带来奖赏"
 GEA_Obedience_brings_rewards_desc:0 "强硬并不意味着海耶必须同商界为敌。恰恰相反，海耶很清楚，只要把条件与后果说得足够明白，大多数董事会都会迅速学会站到正确的一边。愿意接受政府安排的卡特尔不但不会被排斥，反而能够得到比过去更多的好处。新的土地批文、政府订单和进口许可将更多流向这些企业，部分旧有监管也会在它们身上适当放宽。它们可以继续扩张、继续盈利，甚至借军政府的整顿排挤那些不够配合的竞争者。企业自然可以在东亚赚钱，但前提是先证明自己的成功同殖民政府的目标一致。"
 GEA_Ready_to_dedicate_will_and_determination:0 "已准备好奉献意志与决心"
 GEA_Ready_to_dedicate_will_and_determination_desc:0 "自世界大战结束以来，德国在远东建立起了一个庞大的殖民体系，但这份胜利的遗产也意味着远东驻军必须承担远比以往更加沉重的责任。从新加坡的海军基地到印度支那的边境哨所，每一名德国军人都必须清楚，自己所肩负的不仅是维持某一座城市或某一条道路的安全，更是维护帝国在亚洲的整体地位。海耶将军已经要求各部队进一步加强战备训练，完善紧急动员与作战计划，并将坚定的纪律与服从精神作为军官和士兵的重要考核标准。无论远东未来将面临怎样的挑战，我们都必须确保帝国军队已经做好承担责任与付出牺牲的准备。"
 GEA_Unfeeling_Order:0 "无情秩序"
 GEA_Unfeeling_Order_desc:0 "如今，殖民地的安全事务已经被纳入统一的指挥体系，政治警察与军事情报机关共同监视着潜在的反对势力，戒严条例与紧急授权则使总督府能够在必要时迅速采取行动。对于德国官员和商人而言，这意味着一个更加稳定、更加容易管理的远东殖民地；对于生活在这片土地上的普通居民而言，却意味着越来越多的日常事务都必须接受军方与警察的监督。海耶并不认为自己正在建立一套残酷的统治制度。在他的观念里，军人只需履行职责，法律必须得到执行，而任何可能危及帝国安全的行为都应受到相应的处理。至于这些命令会给多少人带来痛苦，那并不属于一名军人应当考虑的问题。"
 GEA_Die_Wacht_im_Fernen_Osten:0 "守望远东"
 GEA_Die_Wacht_im_Fernen_Osten_desc:0 "过去的总督们总喜欢把德属东亚描述成帝国通往亚洲的窗口。商船、游客、侨民与各国商社由此汇聚于新加坡、西贡和海防，殖民地也因此显得繁荣而开放。可在海耶看来，德属东亚的真正意义除却为帝国上供取之不尽用之不竭的资源，还要成为伫立远东的保卫世界帝国的第一道防御线。野心勃勃的日本帝国与贼心不死的协约国始终妄图将他们的影响力乃至军队再次派驻东南亚，但这一切都会被光荣的帝国东亚分舰队与无畏的殖民军所击溃。只要海耶仍然坐于总督之位，帝国在东方的影响力与统治就不会倾颓。"
#卢克纳尔政治国策
 GEA_Dull_Future:0 "晦暗未来"
 GEA_Dull_Future_desc:0 "随着远东局势的持续恶化与殖民地原有统治秩序的动摇，新加坡总督府内部弥漫着深沉的危机感。无论是柏林本土在经济萧条后的自顾不暇，还是印支战场的惨痛失败，都表明过去那种依靠商业妥协与舰炮威慑维系的温和殖民统治已难以为继。在风雨欲来的晦暗未来面前，德属东亚正站在命运的十字路口，而主张以绝对武力与铁腕秩序重塑殖民地的强硬派军官团，已准备全面接管大局。"
 GEA_Governor_Luckner:0 "卢克纳尔总督扬起船帆"
 GEA_Governor_Luckner_desc:0 "那些习惯了公务文件和冗长会议的海军部官僚们可以去见鬼了！现在，新加坡总督府的主人是费利克斯·冯·卢克纳尔伯爵——曾经在世界大战中单凭一艘三桅风帆袭击舰就把协约国航运线搅得天翻地覆的“海上魔鬼”。\n\n对于卢克纳尔而言，德属东亚绝不该是一潭充斥着文牍主义与热带倦怠的死水，而是一艘正待迎风出击的巨舰。伯爵已经将他那顶略显陈旧却象征着传奇的海军军帽扣在头上，亲自握住了远东殖民地的舵轮。系好缆绳吧，水手们，德属东亚的航向即将彻底改变！"
 GEA_Dressed_in_a_navy_uniform:0 "身着海军制服..."
 GEA_Dressed_in_a_navy_uniform_desc:0 "德属东亚的根基在于帝国海军，其行政架构也理应服务于舰队的运转。卢克纳尔总督虽然在社交场合以平易近人著称，但在涉及殖民地治理与军事纪律时，他依然是一名严格的帝国海军军官。\n\n为了扭转近年来殖民地官僚机构日益严重的拖沓作风，总督府已下令对各级行政部门进行改组。海军的条令与垂直管理模式将被引入地方市政与港务运作之中，驻军军官将直接接管关键基础设施的监督权，从而确保整个东亚领地能够像一艘纪律严明的战舰般高效运转。"
 GEA_Seizing_the_throat_of_Asia:0 "手扼亚细亚咽喉"
 GEA_Seizing_the_throat_of_Asia_desc:0 "从地缘战略的角度来看，德属东亚最重要的价值便在于其对马六甲海峡与南中国海航道的控制权。这片海域不仅是殖民地橡胶、锡矿与石油输出的必经之路，更是连接印度洋与西太平洋的战略咽喉。当然，此处重要的必经之路也会为德属东亚带来享用不尽的财富。从即日起，任何国家（当然除了我们的祖国）从马六甲海峡经过都需要缴纳更加高昂的费用，以此我们能够更好的填补由经济危机和战争带来的财政缺口。"
 GEA_The_secret_operation_under_the_glow_of_black_white_and_red_lights:0 "黑白红威光下的秘密行动"
 GEA_The_secret_operation_under_the_glow_of_black_white_and_red_lights_desc:0 "在飘扬着黑白红三色海军军旗的远东各军港背后，数场海上特别行动正在悄然筹备。随着伯爵海盗野心的不断膨胀，战果累累的远东海盗大队开始将目光移向一些更加有价值的战略目标。通过精密的情报网络与万无一失的事前谋划，来去如风的远东海盗们将在黑白红旗照耀下完成那些震惊全球的惊天大行动。"
 GEA_The_pursuit_of_glory_and_victory:0 "...追求荣耀与胜利"
 GEA_The_pursuit_of_glory_and_victory_desc:0 "尽管现代海战已日益演变为工业产能的精密比拼，但在卢克纳尔伯爵心中属于大海的骑士精神与冒险荣耀从未褪色。通过在全舰队范围内弘扬敢于以弱胜强、果敢出击的航海传统，德属东亚海军激励着每一名年轻军官与水手将个人的勇气融入对帝国胜利的追求之中。无论是在惊涛骇浪的远洋巡航，还是在炮火连天的舰队交锋里，东亚舰队的官兵都将为了黑白红军旗的荣誉而奋战到底。"
 GEA_Unless_necessary_no_death:0 "非必要，无死亡"
 GEA_Unless_necessary_no_death_desc:0 "在世界大战的破交作战中，卢克纳尔曾因尽量避免人员伤亡、善待被俘船员而被交战双方誉为“最后的骑士”。就任总督后，他将这一务实而克制的理念带入了殖民地的治安与军事准则之中。面对复杂的殖民地内部矛盾与未来的海上冲突，总督府明确要求部队摒弃无意义的暴行与盲目杀戮。在海战中，我们的首要目标是瘫痪敌舰、夺取物资而非屠杀落水船员；在地方治安中，则强调精准打击首恶与分化瓦解。这种克制不仅能减少不必要的阻力，也有助于维护帝国在远东的体面与秩序。"
 GEA_The_loyal_sailor_of_the_count:0 "伯爵的忠实水手"
 GEA_The_loyal_sailor_of_the_count_desc:0 "与许多出身普鲁士容克贵族、习惯于保持威严距离的学院派将领不同，少年时曾化名在各国帆船上当过普通水手、历经磨炼的卢克纳尔伯爵，始终与基层水兵保持着深厚的同袍情谊。他不仅亲自过问各舰水兵舱室的伙食、医疗与轮休待遇，更常在甲板上与水手们谈笑风生。这种极具个人魅力的统御方式，使全舰队上下对这位平易近人的“水手伯爵”推崇备至，凝聚起了一支甘愿随他闯入任何风暴的忠诚船员队伍。"
 GEA_The_sea_demon_of_the_Pacific_Ocean:0 "海上魔鬼宝刀未老"
 GEA_The_sea_demon_of_the_Pacific_Ocean_desc:0 "世界大战期间，费利克斯·冯·卢克纳尔曾凭借一艘伪装风帆巡洋舰横行大西洋与太平洋，在突破英国皇家海军严密封锁的同时创下了轰动世界的破交传奇，被协约国敬畏地称为海上魔鬼。如今，年岁渐长的伯爵再次站上了德属东亚舰队的指挥舰桥，用实际行动证明自己宝刀未老。在他的亲自督导下，远东舰队的远洋袭船分舰队在保卫远东的同时，更会在暗地里继续他当年未竟的事业，随时准备在广阔的太平洋上重现昔日的海上魔鬼之名..."
 GEA_Remembering_the_Glory_of_the_Doggerland_Battle:0 "追忆日德兰之光荣"
 GEA_Remembering_the_Glory_of_the_Doggerland_Battle_desc:0 "在转任远洋破交舰长之前，卢克纳尔伯爵亦曾作为战列舰王储号的炮塔指挥官，亲历了世界大战中震耳欲聋的日德兰大海战，在漫天水柱与硝烟中见证了公海舰队硬撼皇家海军的光荣时刻。为了将这份无畏的主力舰决战精神传承给新一代远东水兵，海军部不仅定期组织大型舰队演习，更邀请亲历当年海战的宿将向官兵讲授实战经验，激励东亚舰队在未来的太平洋海战中再续日德兰的辉煌。"
 GEA_The_seagull_soars_into_the_sky:0 "海鹰腾飞"
 GEA_The_seagull_soars_into_the_sky_desc:0 "当年卢克纳尔伯爵赖以成名的座舰“海鹰号”，如今已化作德属东亚海军远洋机动与海空协同力量的精神象征。而如今，总督本人将让海鹰号在远东再度服役。在新一批的造舰计划中，有数艘主力舰艇将成为东亚分舰队未来的主力，而他们中的一艘将被总督亲自授予海鹰这个充满荣誉与传奇的名号。"
 GEA_The_imperial_pirates_roaming_the_vast_ocean:0 "驰骋大洋的帝国海盗"
 GEA_The_imperial_pirates_roaming_the_vast_ocean_desc:0 "鉴于太平洋与印度洋极其辽阔的地理跨度，一旦全面战争爆发，死板地固守港口或执着于缓慢的舰队决战无异于作茧自缚。在卢克纳尔总督的主导下，德属东亚海军正式确立了以远洋破交与机动游击为核心的新版作战教范。\n\n新教范赋予了一线巡洋舰舰长与潜艇支队指挥官极高的临机专断权，鼓励他们在战时主动出击，利用复杂的岛礁地形与气象条件穿插至敌后，袭扰并切断敌国的海上补给线。同样的，总督的海盗小子们也被赋予了更高的权力与责任，以他们独特的手段打击帝国之敌。"
 GEA_The_ocean_demon_conquers_the_seven_seas:0 "大洋魔鬼征服七海！"
 GEA_The_ocean_demon_conquers_the_seven_seas_desc:0 "从马六甲海峡的季风航道到西太平洋的辽阔洋面，在“海上魔鬼”卢克纳尔伯爵的统率下，德属东亚海军已彻底成长为一支兼具正面大舰巨炮决战能力与远洋破交威慑力的海上强权。昔日单舰闯大洋的传奇，如今已演变为整支庞大舰队纵横四海的现实——任何企图挑战德意志帝国海上秩序的敌国舰队与商船队，都将在“大洋魔鬼”神出鬼没的猎杀与主力舰队的重炮齐射之下沉入海底，七海之上的制海权将牢牢掌握在德意志海军手中！"
#舍尔纳政治国策
 GEA_Governor_Schorner:0 "唯有血腥费迪南德"
 GEA_Governor_Schorner_desc:0 "当常规的行政手段与镇压行动无法平息遍地危机之时，以冷酷严厉著称的费迪南德·舍尔纳将军最终走上了权力的顶峰，正式接掌德属东亚总督兼武装力量最高统帅之职。在士兵与民众恐惧的目光中，这位绰号“血腥费迪南德”的铁腕将领宣布全境进入无限期战时军管状态，解散了一切清谈议事的咨询委员会与地方自治机构。在他看来，唯有依靠毫无怜悯的刺刀、军法与屠杀，才能在动荡的漩涡中保住德意志帝国的东方疆域。"
 GEA_Only_liquidation_is_the_most_important:0 "唯有清算为要"
 GEA_Only_liquidation_is_the_most_important_desc:0 "印度支那的叛乱虽已被帝国军队彻底击溃，但那些曾经背叛德国的家伙却仍然混迹于殖民地的各个角落。越工残党、民族主义政客、宗教武装、地方士绅，乃至那些在德国撤离期间向革命政权宣誓效忠的官员，无不试图通过改换门庭来逃避应有的惩罚。舍尔纳绝不会容许这种事情发生。在他看来，重建工作完全可以暂且搁置，唯有彻底清算叛乱期间的一切不忠行为，才能确保帝国的统治不再受到挑战。德国宪兵与军事情报机关将获得充分授权追究每一个叛国者及其支持者的责任。无论这些人如今如何宣称自己无辜，他们过去的所作所为都必须付出代价。"
 GEA_To_be_enslaved_for_the_sake_of_rule:0 "为统治而奴役"
 GEA_To_be_enslaved_for_the_sake_of_rule_desc:0 "在舍尔纳确立的战时体制下，昔日用于装点门面的“文明教化”与劳工保障条例被彻底废止。未来德属东亚治下的劣等猿猴们的唯一价值便是通过日夜劳作向德属东亚的战争机器源源不断地提供橡胶、锡矿、钨砂与粮食。通过颁布强制劳动法令，殖民地当局将数以百万计的劳工与失业流民编入准军事化管理的矿山开发队、种植园生产营与筑路工程团，在武装警卫的严密监督下昼夜劳作，以高强度的劳役制度维系殖民地的战时经济运转。"
 GEA_Release_the_tame_wild_beasts:0 "释放制服野兽"
 GEA_Release_the_tame_wild_beasts_desc:0 "为了在幅员辽阔的南洋群岛与中南半岛维持严密的治安统治，舍尔纳解除了以往平时法规对前线警备部队的诸多约束。大批作风彪悍的宪兵、纠察队与惩戒警察被派往各个动荡省区，获准使用一切必要手段弹压地方抗税、罢工与游击活动。这些身穿笔挺军服的执法队伍虽然对总督惟命是从，但在面对抵抗者时却展现出毫不留情的残酷作风，所到之处均以雷厉风行的清乡行动迫使地方社会屈服。"
 GEA_Subdue_the_armies:0 "驯服三军"
 GEA_Subdue_the_armies_desc:0 "作为一名陆军山地兵出身的统帅，舍尔纳深知东亚分舰队与航空兵内部长期存在着自成体系的门户之见，而部分温和派海军将领甚至对总督府的高压政策颇有微词。为了彻底消除三军内部的不协音，舍尔纳元帅将对新加坡海军司令部与各基地指挥层进行人事改组，将质疑军管方针的军官调离实权岗位，并向各大主力舰艇与航空联队派驻直属督察官，确保骄傲的帝国水兵与飞行员无条件服从最高统帅部的统一号令。"
 GEA_die_in_the_front_die_behind:0 "于前线战死，于后方牺牲"
 GEA_die_in_the_front_die_behind_desc:0 "在总体战的严酷逻辑下，前线战壕与后方车间之间已不再存在明显的界限。舍尔纳将在全区推行高度军事化的战时配给与工时制度，怠工与逃避劳役将被视同阵前脱逃论处。一线的军士将被要求在没有命令下达前一步也不许后退，而后方的劳工则必须承受高强度的延长工时与严苛的定额考核。在舍尔纳统治的远东，每一个人都必须为帝国的胜利献出自己的汗水乃至生命。"
 GEA_No_one_is_exempt_no_one_is_spared:0 "无人例外，无人幸免"
 GEA_No_one_is_exempt_no_one_is_spared_desc:0 "舍尔纳已经厌倦了那些关于宽恕、和解与地方自治的陈词滥调。既然德国人已经用鲜血重新夺回印度支那，那么便没有理由再对这些曾经背叛帝国的人心慈手软。新一轮清剿行动将不再局限于越工的残余武装，凡是涉嫌资助叛乱、窝藏游击队或组织反德活动的地方势力，都将被视作帝国的敌人。军队与宪兵将在各地展开大规模搜捕，军事法庭则负责审判被捕者，而被认定为叛乱据点的村镇也将受到严厉惩戒。无论是声名显赫的民族主义领袖、拥有众多信徒的宗教教主，还是自称只想安分度日的普通村民，都不能成为免于追究的理由。舍尔纳要让整个印度支那明白，德国人的归来绝不仅仅意味着殖民秩序的恢复，更意味着一场绝不留情的报复。"
 GEA_Loyalty_is_the_foundation_of_all_things:0 "忠诚乃万事之先"
 GEA_Loyalty_is_the_foundation_of_all_things_desc:0 "在历经多次危机与内部整肃之后，舍尔纳愈发坚信，才干与显赫家世皆可替代，唯有对统帅与帝国的绝对忠诚才是选拔军官与官员的首要标准。总督本人为此将改革军官晋升与地方行政官委任制度，并严格审查所有候选人的政治履历与实战表现。同时对于那些在总参谋部软弱无能或是尸位素餐的败类军官，舍尔纳也准备将他们全部打包清除出陆军体系中，以确保所有军政官员全部对总督本人直接负责。"
 GEA_Strength_is_the_foundation_of_an_empire:0 "力量乃帝国之基"
 GEA_Strength_is_the_foundation_of_an_empire_desc:0 "外交辞令与国际公法在如今的远东乱局中不过是一纸空文，德意志在远东的威权归根结底建立在坚船利炮与数十万常备军的实力之上。基于此番信条，舍尔纳总督准备大幅削减殖民地政府的民生与教育开支，并将几乎全部财政盈余与征集所得的工业资源投入到扩建兵工厂与扩编野战师团之中。预计不久后，血腥费迪南德就将把整个德属东亚彻底改造为一座围绕战争运转的庞大军营。"
 GEA_Not_acting_under_the_order_of_the_monarch:0 "无受君命"
 GEA_Not_acting_under_the_order_of_the_monarch_desc:0 "远在万里之外的柏林帝国议会与殖民办公厅文官，往往习惯于从欧洲本土的政治平衡出发，对远东军管当局的强硬政策加以限制。对此，舍尔纳将亲往柏林向皇帝陛下本人述职，并尝试获得绕过本土官僚行事的战时特别权限。如果一切顺利，费迪南德·舍尔纳就将在实际上集中德属东亚的一切内政、外交与军事裁决权，不再理会来自柏林文官政府的任何掣肘指令。"
 GEA_Polish_the_muzzle_sharpen_the_knife_and_gun:0 "擦亮炮口，磨砺刀枪"
 GEA_Polish_the_muzzle_sharpen_the_knife_and_gun_desc:0 "印度支那的战事已经证明，德属东亚的驻军绝不能再满足于充当守卫港口与殖民地机关的仪仗队。丛林里的游击战争、城市中的武装暴动，以及随时可能发生的地方叛乱，都要求我们拥有一支能够迅速出动、独立作战的常备军。舍尔纳计划重新整编驻军，补充战时损耗的武器装备并强化步炮及装甲部队之间的协同。与此同时，各地驻军将接受更加严格的战备训练，以确保帝国军队能够在任何地方发生骚乱时立即展开行动。"
 GEA_Overcome_difficulties_and_obstacles:0 "克服艰难险阻"
 GEA_Overcome_difficulties_and_obstacles_desc:0 "由于长期实行严酷的高压统制，叠加贸易波动与战备消耗，德属东亚不可避免地面临着工业材料短缺、财政吃紧与非战斗减员等诸多现实困难。然而统帅部绝不允许任何部门以物资匮乏作为拖延战备的借口。地方行政官员被要求竭尽一切所能统合战争资源，同时对于粮食，酒精，白糖等战略基本物资进行全面管控和征收。印度支那的乡村则根据新加坡的直接命令上缴除必要口粮与种子粮之外的一切存粮，以备战争之需。"
 GEA_On-the-spot_trial:0 "就地审判"
 GEA_On-the-spot_trial_desc:0 "为了在战时彻底简化司法程序、形成立竿见影的震慑效应，舍尔纳下令废除了繁琐的常规军事法庭上诉制度，全面推行“巡回就地审判”。由三名战地宪兵或前线指挥官组成的临时战地法庭，有权在任何地界任何时间对涉嫌畏战溃退、违抗军令、煽动哗变及通敌破坏的嫌疑人进行当场审理并立即执行判决。而在战场上，面对任何的俘虏。舍尔纳也已经授权这些带着铁链标识牌的“锁链犬”们可以毫无顾忌的就地处决。"
 GEA_Schorner_Law:0 "舍尔纳法令"
 GEA_Schorner_Law_desc:0 "过去，德属东亚的治安事务始终由殖民地行政机关、地方警察与驻军共同负责。这套彼此掣肘的制度或许足以应付寻常纠纷，却已被印度支那的叛乱证明根本无力应对真正的威胁。舍尔纳决心结束这种混乱，并颁布一项新的殖民地治安法令。根据法令，军方将在宣布进入特别治安状态的地区取得优先指挥权，宪兵得以扩大搜查、拘捕与审讯权限，军事法庭亦可直接审理危害殖民地安全的案件。地方官员必须无条件配合军队的行动，而任何妨碍驻军履行职责的行为都将受到严惩。"
 GEA_Bloody_Ferdinand_Supreme_Power:0 "血腥费迪南德至高无上"
 GEA_Bloody_Ferdinand_Supreme_Power_desc:0 "在彻底弹压了内部异见、驯服了陆海三军并隔绝了柏林文官的干预之后，费迪南德·舍尔纳在德属东亚的个人权威已达到顶峰。新加坡的总督府如今已成为名副其实的远东最高统帅大本营，从胶州湾的驻军司令到马六甲的舰队司令官，无不对这位手握生杀大权的“血腥费迪南德”凛然遵命。在他的铁腕统御下，昔日松散的商业殖民地已凝聚为一个高度集权、唯统帅意志是从的军事独裁政体。"
 GEA_Let_loose_the_blood-stained_black_eagle:0 "放飞染血黑鹰"
 GEA_Let_loose_the_blood-stained_black_eagle_desc:0 "历经铁与血的残酷整顿，盘踞在南洋与东亚上空的德意志黑鹰已被染上了一层令人生畏的血色。在舍尔纳的率领下，这座由严酷军法、苦役工厂与数百万大军构筑而成的远东战争堡垒，已不再满足于被动的守成防卫。随着出征号角的吹响，染血的帝国黑鹰正展开双翼扑向整个亚洲与太平洋战场，准备用刺刀、重炮与铁腕向全世界证明德意志远东军队的冷酷与强悍。"
#企业总督国策
 GEA_Governor_Kartel:0 "卡特尔们的封地"
 GEA_Governor_Kartel_desc:0 "德属东亚的繁荣从来不是单靠总督府的官僚与驻军维持的。来自德国本土的银行、工业托拉斯与贸易公司早已将各自的触角伸入这片殖民地，从橡胶种植园到矿山、港口与铁路，几乎每一项有利可图的产业背后都能找到德国资本的身影。随着殖民政府逐渐向企业界让渡经济事务的主导权，这些庞大的工业集团终于得以公开争夺远东的未来。对于帝国而言，一个由德国企业家经营的殖民地，或许比那些只会索要预算的官僚更加有用。"
 GEA_The_guidance_of_Governor_Tilo:0 "蒂洛总督的指导"
 GEA_The_guidance_of_Governor_Tilo_desc:0 "蒂洛·冯·威尔莫夫斯基男爵并非不谙世事的贵族，而是一位深知德国工业力量源泉的实干家。长期担任克虏伯企业领导职务的经历，使他对现代工业管理、企业福利与劳资关系都有着独到见解。如今，他决心将埃森钢铁王国的经验带到远东，以克虏伯式的纪律、效率和家长制管理取代殖民地长期以来混乱的经济秩序。无论是德国企业还是本地工人，都必须在这套新制度中找到自己的位置。"
 GEA_Pour_a_tight_and_economical_chain:0 "浇筑紧密经济锁链"
 GEA_Pour_a_tight_and_economical_chain_desc:0 "一座钢铁厂的价值不仅取决于它能够生产多少钢材，更取决于支撑它运转的煤矿、铁路、港口与机械工厂能否协调工作。克虏伯的成功正是建立在这种纵向一体化的工业体系之上。如今，蒂洛总督计划将这一原则推广至德属东亚，把分散的矿业、运输和制造企业组织进统一的生产网络。通过长期供应合同、共同投资与集中调度，远东的工业资源将被牢牢联结起来，而克虏伯则会成为维系整条经济锁链的核心。"
 GEA_Guns_steel_and_furnaces:0 "枪炮，钢铁与熔炉"
 GEA_Guns_steel_and_furnaces_desc:0 "从普鲁士王国的崛起到德意志帝国的世界大战胜利，克虏伯的钢铁与火炮始终是德国军事实力的重要支柱。然而，德属东亚虽然拥有丰富的矿产资源和庞大的劳动力，却长期缺乏能够独立支撑现代军备生产的重工业基础。蒂洛总督计划扩建炼钢厂、机械工场与军械设施，并引进来自埃森的工程师和生产设备。我们或许无法在一夜之间将新加坡变成第二个鲁尔区，但至少应当让远东驻军不必再为每一门火炮向柏林伸手。"
 GEA_Humanitarian_construction:0 "人道主义建设"
 GEA_Humanitarian_construction_desc:0 "克虏伯家族向来以重视工人福利而闻名。早在十九世纪，埃森的工厂便建立了职工住宅、医疗设施、养老金和企业商店，以确保熟练工人能够长期为公司效力。蒂洛总督认为，德属东亚同样需要这样的制度。我们将出资修建工人住宅、医院与职业学校，改善工业区的卫生条件，并向长期服务的雇员提供基本保障。当然，这一切并非毫无条件的慈善。享受企业庇护的工人，自然也应当遵守企业的纪律，履行对雇主的义务。"
 GEA_Establish_the_security_status_of_agricultural_products:0 "确立农产品保障地位"
 GEA_Establish_the_security_status_of_agricultural_products_desc:0 "殖民地的工业化不能以牺牲农业生产为代价。橡胶、棕榈油、稻米及其他热带作物不仅维系着德属东亚的出口收入，也为我们的工厂和居民提供了不可或缺的原料与粮食。蒂洛总督主张建立稳定的农产品收购与供应制度，以长期合同保护重要种植园的生产，并通过仓储、运输和价格保障措施减少市场波动的冲击。只有确保田地与种植园持续运转，矿山和工厂的扩张才能拥有可靠的物质基础。"
 GEA_Das_Erbe_des_Grusonwerks:0 "引进格鲁松的遗产"
 GEA_Das_Erbe_des_Grusonwerks_desc:0 "在克虏伯的工业版图中，马格德堡的格鲁松工厂始终占据着特殊地位。这家以硬铸铁技术、重型机械和装甲防御设备闻名的企业，自并入克虏伯以来，便成为德国军工制造体系的重要组成部分。如今，蒂洛总督希望将格鲁松工厂积累的铸造工艺与机械设计经验引入远东，建立专门生产装甲构件、重型铸件及工程设备的工业设施。这些技术既能够服务于港口与要塞建设，也能为殖民地日后的军工发展奠定基础。"
 GEA_Treue_verpflichtet_beide_Seiten:0 "双向忠诚义务"
 GEA_Treue_verpflichtet_beide_Seiten_desc:0 "克虏伯与德意志军队之间的关系，早已超越了普通的军火买卖。从普鲁士王国到今日的德意志帝国，克虏伯的工厂始终为军队提供可靠的武器装备，而军方也以源源不断的订单与政治庇护回报这份忠诚。蒂洛总督希望将这种合作关系推广至远东，由企业承担驻军的装备供应、设施维护与军工建设，军方则负责保护工业基地、重要运输线路及企业的合法权益。军队需要克虏伯的钢铁，克虏伯同样需要军队的刺刀。唯有双方各尽其责，帝国在远东的工业与军事霸权才能牢不可破。"
 GEA_The_Essen_Constitution_in_the_Far_East:0 "埃森宪法之于远东"
 GEA_The_Essen_Constitution_in_the_Far_East_desc:0 "1872年，阿尔弗雷德·克虏伯颁布了著名的《总章程》，为埃森工厂的劳资关系确立了一套严格而完整的制度。工人获得了企业提供的社会保障，却也必须接受雇主对工作纪律与政治活动的约束。蒂洛总督认为，这套被称作“埃森宪法”的企业管理原则同样适用于德属东亚。通过明确企业对雇员的保障责任、建立统一的劳动规章并限制激进工会的活动，我们将以克虏伯式的家长制秩序取代殖民地混乱的劳资关系。对于愿意接受这一制度的工人而言，企业将成为他们可靠的庇护者；至于其他人则必须自行承担拒绝合作的后果。"
 GEA_Governor_Fritz_Meers_Wild_Journey:0 "弗里茨·梅尔总督的狂野征程"
 GEA_Governor_Fritz_Meers_Wild_Journey_desc:0 "弗里茨·梅尔向来不满足于经营一家普通的化工企业。作为法本工业集团的重要人物，他深知现代化学工业早已超越了染料与药品的范畴，从合成燃料、橡胶到农用化学品，无数新兴技术正在重新塑造世界经济。如今，德属东亚丰富的矿产与石油资源，为他提供了一座前所未有的天然实验室。梅尔决心利用法本集团庞大的科研体系与工业资本，将这片以原料出口为主的殖民地改造为德国化学工业在远东的生产与研究中心。至于这个宏伟计划究竟需要花费多少资金，总督似乎并不打算过早考虑。"
 GEA_The_foundation_of_the_war_industry:0 "战争工业之基"
 GEA_The_foundation_of_the_war_industry_desc:0 "现代战争不仅需要钢铁与火炮，更离不开炸药、燃料、橡胶和各种化学制品。法本工业集团在这些领域积累了丰富的技术与生产经验，而德属东亚恰好拥有能够支撑相关产业的天然资源。我们应当优先建立硝酸、基础化工原料、工业溶剂及橡胶加工设施，并完善相关的能源与运输供应。通过与德国军方及本土科研机构合作，这些工厂不仅能够满足殖民地日益增长的工业需求，也将成为帝国远东军备生产体系中不可或缺的一环。"
 GEA_Reinventing_the_East_through_Chemistry:0 "以化工重塑东方"
 GEA_Reinventing_the_East_through_Chemistry_desc:0 "长期以来，德属东亚的经济始终依赖将橡胶、植物油、矿石与其他初级产品运往德国本土，再从欧洲进口价格昂贵的工业制成品。在弗里茨·梅尔看来，这种贸易模式无疑浪费了远东所拥有的巨大潜力。通过建立现代化学实验室、精炼设施与综合加工厂，我们可以直接在殖民地完成原料的提取、改性与深加工，并利用本地天然橡胶改良工业橡胶制品，研究热带油脂、纤维及植物原料的新用途。未来的德属东亚将不再只是向帝国供应原料的种植园，而是一个能够创造技术、专利与高附加值工业产品的化学工业基地。"
 GEA_The_wisdom_of_the_Central_Committee:0 "中央委员会的智慧"
 GEA_The_wisdom_of_the_Central_Committee_desc:0 "IG法本从来不缺委员会，但真正的重要决策往往不出自这些机构之手。\n\n在IG法本，几乎所有的重要决策都来自董事会内的中央执行委员会。中执委的人数从来不多，最初不过是从臃肿的董事会和工作委员会中抽出的一个核心圈子，却很快成为整个IG法本最重要的决策机关之一。往往只需要桌边几个人交换意见，便足以决定数万名雇员和数百万马克资本下一步流向何处。\n\n梅尔很熟悉这种工作方式。他曾经同时坐在中央委员会和技术委员会里，也早已习惯把问题拆成几张表格，技术意见和最终的敲定方案。如今他在东方也如法炮制，组织起属于自己的中执委。"
 GEA_For_the_sake_of_progress_to_plunder:0 "为了进步而掠夺"
 GEA_For_the_sake_of_progress_to_plunder_desc:0 "在弗里茨·梅尔看来，德属东亚那些尚未得到充分开发的森林、矿藏与种植园，不过是一座等待现代科学开启的巨大宝库。为了满足法本集团日益膨胀的工业需求，我们必须扩大对橡胶、石油、植物油及其他化工原料的控制，并将资源勘探、土地开发和原料收购交由专业企业统一管理。至于那些世代居住于矿区与种植园附近的本地居民，他们的传统权利自然不能成为工业进步的障碍。"
 GEA_Being_unfeeling_due_to_the_necessity_of_evil:0 "因必要之恶而无情"
 GEA_Being_unfeeling_due_to_the_necessity_of_evil_desc:0 "任何伟大的工业计划都不可能毫无代价地实现。兴建工厂需要征用土地，开采矿藏需要迁移村落，而维持大规模生产则必须对劳动力实行严格管理。弗里茨·梅尔并非不知道这些措施会引发不满，但他坚信，工业化带来的长期繁荣足以证明眼前牺牲的必要性。总督府将赋予企业更大的土地征用与劳工调配权限，并尽可能减少地方官员对工业计划的干涉。那些反对者或许会将此称为残酷剥削，但在梅尔的工业蓝图中，感情用事显然无法代替产量与效率。"
 GEA_Taking_the_first_step_towards_greatness:0 "向伟大迈出第一步"
 GEA_Taking_the_first_step_towards_greatness_desc:0 "德属东亚拥有丰富的自然资源，却始终缺乏与之相称的工业能力。弗里茨·梅尔决心改变这种局面，而我们的第一项任务便是建立一套足以支撑现代化学工业的基础设施。通过扩建发电站、供水系统、工业仓库与原料加工厂，并从德国本土引进工程师和先进设备，法本集团将逐步把分散的殖民地产业整合为现代工业网络。这些初期投资或许难以立即获得丰厚回报，但只要第一批机器开始运转，远东工业的未来便将不再只是一纸空谈。"
 GEA_Another_scientific_center_of_the_empire:0 "从殖民地到科学国度"
 GEA_Another_scientific_center_of_the_empire_desc:0 "谁说世界一流的科学研究只能诞生于柏林、海德堡或法兰克福？德属东亚拥有欧洲大陆所缺乏的热带植物、矿物资源与特殊自然环境，恰好能够成为德国化学家、生物学家与工程师的理想试验场。弗里茨·梅尔计划资助建设研究所、工业实验室及技术学院，并邀请德国大学与法本集团的研究人员前来开展合作。从热带农业化学到新型工业材料，我们将在远东建立属于自己的科研体系，使这片殖民地不仅能够提供原料，更能够为帝国贡献知识、技术与发明。"
 GEA_Expansion_leads_to_prosperity:0 "扩张带来繁荣"
 GEA_Expansion_leads_to_prosperity_desc:0 "现代化学工业的盈利能力往往取决于生产规模。庞大的设备投资、复杂的原料供应以及持续不断的技术研发，决定了分散的小型工厂难以与大型工业联合体竞争。法本集团必须继续扩大生产设施，收购缺乏竞争力的本地企业，并将新的矿区、种植园与工业园区纳入统一经营体系。随着产业规模不断增长，原料采购与运输成本也将逐渐降低，为我们带来更高的利润与更强的市场竞争力。至于那些在扩张中被吞并的企业，至少它们终于能够成为一项宏伟事业的组成部分。"
 GEA_Rapid_industrialization:0 "远东工业之心"
 GEA_Rapid_industrialization_desc:0 "过去，德属东亚的港口终日忙于将原料装船运往欧洲，而真正创造高额利润的加工与制造工序却大多留在德国本土。如今，这种局面必须有所改变。我们将在交通便利、能源供应充足的地区集中建设现代工业区，使化工厂、机械工场、发电设施与运输枢纽彼此配合，形成完整的工业生产体系。新加坡及其他重要港口将不再只是帝国远东贸易的中转站，而将成为能够独立生产工业制成品的制造业中心，让浓烟升起的工厂成为德属东亚新的经济支柱。"
 GEA_Rushing_headlong_into_technological_progress:0 "向科技进步狂飙"
 GEA_Rushing_headlong_into_technological_progress_desc:0 "工业竞争从不会等待那些畏首畏尾的人。法本集团之所以能够在德国化学工业中占据举足轻重的地位，正是因为它始终愿意为新技术投入巨额资金，即使某些研究在短期内无法创造利润。弗里茨·梅尔准备进一步扩大科研预算，资助合成材料、工业催化、燃料加工及化学制造工艺的研发，并鼓励各研究部门加快技术成果的工业化。失败的实验与昂贵的设备不过是进步所必须支付的代价。只要德国科学家能够不断取得突破，远东工业便终有一日可以摆脱对欧洲技术的依赖。"
 GEA_Chasing_after_big_business:0 "追逐大生意"
 GEA_Chasing_after_big_business_desc:0 "既然企业界已经掌握了德属东亚经济发展的主导权，那么我们就没有理由再被那些琐碎的小生意浪费时间。无论是大规模矿业开发、军需采购，还是铁路建设与跨国贸易，真正能够改变殖民地命运的始终是那些涉及巨额资本的长期合同。总督府将积极争取德国本土银行、工业集团与海外投资者的支持，推动大型经济项目的签订与实施。当然，这些合同的受益者大多是与殖民政府关系密切的企业，但只要资本持续流入远东，又有谁会在意其中的细枝末节呢？"
 GEA_Compassion_and_Humanity:0 "怜悯与人道"
 GEA_Compassion_and_Humanity_desc:0 "伴随着工厂、矿山与种植园不断扩张，殖民地的劳工事故、疾病与恶劣生活条件也越来越难以忽视。即便是最为精于算计的企业家，也不得不承认，疲惫不堪且疾病缠身的工人绝非理想的生产资源。为此，我们将拨款修建医院、工人宿舍与卫生设施，并通过企业救济基金为伤病雇员提供有限的生活保障。这些措施不仅有助于改善劳动效率，也足以向柏林和国际社会证明，德国企业在追求利润之余，同样不曾忘记自己肩负的文明与人道责任。"
 GEA_Get_rid_of_the_epidemic_of_red_tape:0 "摆脱繁文缛节之疫"
 GEA_Get_rid_of_the_epidemic_of_red_tape_desc:0 "殖民地官僚机构向来擅长将最简单的商业事务变成一场漫长的公文旅行。一座工厂的扩建计划可能需要经过数个部门审批，而一份土地开发许可甚至能够在总督府的档案柜里躺上好几个月。对于争分夺秒的企业而言，这种低效率无异于一种慢性疾病。我们将精简工业投资、土地使用与企业经营的审批手续，并赋予大型企业更广泛的自主决策权。今后，殖民地经济的发展速度将不再取决于文官签字的快慢，而应由那些真正懂得经营的人来决定。"
 GEA_Transform_the_export-oriented_economy:0 "扭转出口式经济"
 GEA_Transform_the_export-oriented_economy_desc:0 "长期以来，德属东亚始终扮演着帝国原料供应地的角色。种植园生产橡胶与热带作物，矿山开采金属和矿石，而满载原料的商船则将这些财富运往德国本土。这样的贸易模式固然为殖民地带来了可观收入，却也使本地经济严重依赖国际市场的价格波动。我们必须改变单纯出口初级产品的经营方式，通过建设加工厂、机械制造设施与配套工业，将更多生产环节留在远东。殖民地应当继续服务于帝国经济，但这并不意味着它永远只能出售未经加工的原料。"
 GEA_The_silent_industrial_factory_building:0 "缄默的工业厂房"
 GEA_The_silent_industrial_factory_building_desc:0 "在工业发展最为迅速的地区，一座座崭新的厂房正悄然改变着德属东亚的面貌。施工队昼夜不停地铺设道路、安装机械，德国工程师则按照图纸监督着每一道工序。然而，在这些宏伟建筑的背后，往往隐藏着不愿登上报纸的另一面：被征用的土地、漫长的劳动时间，以及那些难以向雇主表达不满的本地工人。总督府并不打算为此妨碍工业建设，毕竟机器的轰鸣终究会盖过工人的抱怨，而不断增长的产量才是企业董事会最愿意听见的声音。"
 GEA_With_a-kind_mask_on:0 "配以和善假面"
 GEA_With_a-kind_mask_on_desc:0 "德国企业在印度支那及南洋各地的扩张，已经使不少本地居民对殖民政府心怀怨恨。为了避免这些不满演变为新的罢工与骚乱，我们有必要重新塑造企业统治的公众形象。工业集团将资助学校、医院、慈善活动和地方基础设施，并通过报纸与宣传机构强调德国资本为殖民地带来的繁荣与文明。当然，这些善举不会改变企业对土地、资源与劳动力的控制，但只要能够使民众相信自己的生活正在改善，又何必让他们过多关心那些复杂的经济关系呢？"
 GEA_Enterprise_Exceptionalism:0 "企业例外主义"
 GEA_Enterprise_Exceptionalism_desc:0 "普通企业必须服从殖民地的法律与行政规章，但那些承担重大工业项目、维系帝国战略利益的大型集团，显然不能与街头的小商贩受到同样的待遇。为了确保关键产业的正常运转，总督府将向指定企业提供特殊税收待遇、土地使用权限与行政豁免，并允许其在生产区内建立更为独立的管理制度。当然，这些特权势必引发本地商人与传统殖民官僚的不满，但他们必须明白，帝国的繁荣依赖的是能够创造真正财富的工业巨头，而不是对所谓公平原则的无谓坚持。"
 GEA_The_benefits_of_arms_sales:0 "军售之利"
 GEA_The_benefits_of_arms_sales_desc:0 "远东从来不缺少战争，更不缺少愿意为现代武器支付高价的买主。从中国各地的军阀到东南亚的地方政权，无数军队都渴望获得德国制造的步枪、火炮、弹药及军事装备。随着殖民地工业能力不断增强，我们终于有机会将军火贸易发展为一项稳定而丰厚的收入来源。通过与德国军方协调出口许可，并由企业负责生产、运输和售后维护，我们不仅能够赚取可观利润，还可以使购买德国军备的地方势力逐渐依赖帝国的零部件、技术人员与弹药供应。"
 GEA_The_factorys_thick_smoke_wealth_and_German_East_Asia:0 "工厂的浓烟，财富与德属东亚"
 GEA_The_factorys_thick_smoke_wealth_and_German_East_Asia_desc:0 "如今，德属东亚已经不再是那个只能依靠种植园、商港与殖民地贸易维持繁荣的海外领地。矿山的机械昼夜不停地运转，工厂的烟囱向天空吐出浓烟，铁路与货船则将原料、机器和工业制成品源源不断地运往各地。德国企业凭借庞大的资本与先进技术，将这片远东殖民地逐渐改造成帝国海外工业体系中不可或缺的一环。诚然，这场繁荣的成果并未平等地惠及每一个生活在这里的人，但对于企业董事会与柏林的决策者而言，持续增长的产量、利润与税收已经足以证明他们选择的道路的正确性。"
#经济国策
 GEA_Rebuilding_the_Eastern_Hanseatic_League:0 "重振东方汉萨"
 GEA_Rebuilding_the_Eastern_Hanseatic_League_desc:0 "数百年前，汉萨同盟曾凭借商人的财富、港口间的合作与遍布北欧的贸易网络，建立起一个不依赖单一君主的商业世界。如今，德属东亚的港口同样拥有形成庞大贸易体系的潜力。从新加坡到槟城，从西贡到中国沿海的通商口岸，德国商人早已建立起密切的航运与金融联系，却始终缺乏统一的协调机制。我们将鼓励各地德国商会加强合作，协调港口税费与货运安排，并通过德华银行及德国航运企业扩大贸易融资。只要能够将这些彼此分散的商业据点连接起来，德属东亚便有机会成为整个远东贸易体系中不可或缺的中心。"
 GEA_Deep_in_the_barren_land:0 "深入不毛"
 GEA_Deep_in_the_barren_land_desc:0 "德属东亚的城市与港口固然繁荣，但只需离开沿海地区不远，便会发现大片尚未得到充分开发的山地、丛林与内陆乡村。长期以来，德国企业更愿意投资那些能够迅速带来利润的种植园与沿海矿场，而殖民政府也缺乏足够的资金，将道路、铁路与行政机构延伸至偏远地区。然而，这些在欧洲地图上被简单标注为荒野的土地，或许正蕴藏着殖民地未来发展的巨大潜力。我们将组织新的地质勘察与土地测绘队伍，派遣工程师考察内陆资源，并逐步改善通往偏远地区的交通条件。只有真正了解这些土地，帝国才能决定如何利用其中的财富。"
 GEA_The_Pillar_of_the_Far_East:0 "远东柱石"
 GEA_The_Pillar_of_the_Far_East_desc:0 "经过数十年的经营，德属东亚早已不再只是帝国地图上几块遥远的海外领地。新加坡繁忙的码头、印度支那广阔的种植园与婆罗洲丰富的自然资源，共同构成了德国在东方的重要经济基础。然而，殖民地的工业发展仍然远远落后于其资源与贸易规模，大量原料必须运往欧洲加工，现代制造业也主要集中于少数港口城市。倘若帝国希望真正将远东建设为支撑其海外霸权的坚实柱石，就必须改变这种局面。总督府将邀请克虏伯、IG法本、西门子、德华银行以及其他德国大型工业与金融集团参与新的经济开发计划，通过投资钢铁、化工、电气、交通与金融设施，建立更加完整的殖民地工业体系。当然这些企业并非慈善机构，它们所要求的税收优惠、经营特许与资源开发权，也将使殖民地经济愈发依赖德国大资本。但对于总督而言，只要德国工业的烟囱能够在远东不断升起，这便是值得付出的代价。"
 GEA_Tread_flat_the_rainforest:0 "踏平雨林"
 GEA_Tread_flat_the_rainforest_desc:0 "茂密的热带雨林虽然孕育着丰富的自然资源，却也长期阻碍着德属东亚的经济开发。泥泞的小径无法承受重型机械，季风带来的暴雨经常冲毁道路，而大片被植被覆盖的土地则使矿山、工厂与种植园难以继续扩张。总督府将投入资金开辟新的交通走廊，组织道路修筑和土地清理，并鼓励企业在适合开发的地区建立新的生产设施。工程师们将使用现代测绘技术规划路线，以减少运输成本和工程损耗。当然，这些建设势必改变当地居民世代生活的环境，甚至引发新的土地纠纷，但对于急于扩大殖民地经济规模的德国官员而言，丛林绝不能成为阻挡帝国工业发展的最后一道屏障。"
 GEA_Connect_the_isolated_island:0 "连结孤岛"
 GEA_Connect_the_isolated_island_desc:0 "德属东亚的经济中心散布于马来半岛、印度支那及南洋各地，海洋与复杂的地形使这些领地之间长期缺乏可靠的交通联系。部分偏远岛屿甚至只能依靠偶尔到访的商船运输货物，而殖民政府的行政命令也往往需要数周才能传达到当地。我们将扩建区域性航运网络，改善沿海码头、仓储设施及轮船补给站，并加强主要港口与内陆铁路之间的衔接。与此同时，新的电报和通信线路将帮助商人及时获取市场信息，使地方官员能够更有效地处理事务。通过现代交通与通信技术，过去彼此孤立的港口和岛屿将逐渐成为一个紧密联系的经济整体。"
 GEA_Digging_deep_for_underground_resources:0 "深掘地下财富"
 GEA_Digging_deep_for_underground_resources_desc:0 "在橡胶与农产品之外，德属东亚的地下同样埋藏着数量可观的矿产资源。马来亚的锡矿、印度支那的煤炭与各种金属矿藏，早已吸引德国商人和工业集团的注意。然而，许多矿区仍然依赖设备落后的开采方式，缺乏现代运输设施，部分资源甚至尚未得到系统勘探。我们将鼓励矿业企业扩大地质调查，引进先进的采矿机械与排水设备，并建设连接矿场和港口的专用铁路。总督府还将重新审查矿业特许经营制度，确保资源开发能够为殖民地财政带来稳定收入。那些沉睡于热带山脉之下的财富，终将通过德国人的机械与资本进入世界市场。"
 GEA_The_Eastern_Treasure_House_of_the_Empire:0 "帝国的东方宝库"
 GEA_The_Eastern_Treasure_House_of_the_Empire_desc:0 "德属东亚拥有德国本土难以获得的众多战略资源：来自马来半岛的橡胶与锡矿、印度支那的煤炭和稻米，以及南洋各地出产的热带农产品与工业原料。长期以来，这些商品通过德国商船源源不断地运往欧洲，为帝国工业与商业带来可观的收益。如今，我们必须进一步扩大资源开发规模，改善原料的加工、储存与运输设施，并确保重要商品能够在国际市场动荡时继续稳定供应。通过协调矿业公司、种植园与航运企业的经营活动，德属东亚将能够更加充分地发挥其经济价值。对于德国本土的工业巨头而言，东方不再只意味着遥远的殖民地，而意味着维持帝国生产与贸易不可或缺的资源宝库。"
 GEA_Guaranteeing_grain_exports:0 "保障粮食出口"
 GEA_Guaranteeing_grain_exports_desc:0 "印度支那肥沃的河流三角洲长期以来便是远东重要的稻米产区，其中南圻的农业生产更为殖民地提供了稳定的出口收入。然而，农田灌溉不足、地方运输落后以及收成与市场价格的剧烈波动，始终威胁着这项重要贸易。总督府将加强粮食生产地区的水利建设，改善仓储与铁路运输条件，并鼓励德国商人与当地米商签订长期收购合同，以确保粮食能够持续进入国际市场。当然，出口贸易的扩大也要求殖民政府妥善处理本地粮食供应与农民负担，否则一场严重的歉收便可能使繁荣的稻米贸易演变成危险的社会危机。帝国需要印度支那的粮食，而印度支那同样需要能够维持自身生存的农业制度。"
 GEA_The_idyllic_life_in_German_East_Asia:0 "德属东亚的田园生活"
 GEA_The_idyllic_life_in_German_East_Asia_desc:0 "在德国旅行作家的笔下，德属东亚的乡村似乎总是一幅令人神往的画卷：连绵起伏的绿色丘陵、整齐排列的橡胶树、在阳光下闪闪发光的稻田，以及坐落在椰林之间的宁静村庄。殖民地旅游宣传部门尤其喜欢描绘这种远离欧洲工业喧嚣的田园生活，仿佛德国人的到来已经为这片土地带来了永久的繁荣与安宁。总督府将进一步扶持农业生产，改善乡村道路、灌溉设施与农产品集散市场，并通过农业技术推广提高土地利用效率。然而，对于那些必须按时缴纳地租、税款并完成繁重劳作的本土农民来说，这幅美好的田园图景或许并没有德国宣传册中描写得那般令人向往。"
 GEA_Increase_the_intensity_of_land_acquisition:0 "加大征地力度"
 GEA_Increase_the_intensity_of_land_acquisition_desc:0 "无论是修建铁路、开设矿山，还是扩大种植园与工业园区，德属东亚的经济开发都需要获得更多可供使用的土地。然而，殖民地复杂的传统土地制度、地方宗族关系与既有租佃安排，使德国企业经常难以迅速取得所需地块。为此，总督府将扩大土地测绘与登记工作，简化公共工程及特许企业的征地程序，并赋予地方行政机关更大的土地收购与征用权限。有关企业必须承担相应补偿和迁置费用，但在实际执行中，殖民地官员的裁量权无疑将进一步扩大。虽然这些措施有助于加快经济建设，却也可能使越来越多依赖土地维持生计的本土居民陷入困境。"
 GEA_Reconstructing_the_East_with_Steel_and_Concrete:0 "以钢铁与混凝土重塑东方"
 GEA_Reconstructing_the_East_with_Steel_and_Concrete_desc:0 "德属东亚的现代化不能永远停留在港口仓库与少数沿海城市之中。想要充分利用殖民地丰富的资源与劳动力，我们就必须建立起贯穿主要经济区域的现代基础设施体系。总督府将推动新的铁路、公路、桥梁与港口工程，扩大城市供水、电力和工业用地的建设规模，并鼓励德国建筑及工程企业参与其中。无论是跨越河谷的钢桥、沿海新建的混凝土码头，还是为工厂提供动力的大型设施，都将逐步改变远东的面貌。殖民地过去依靠河流、旧商道与自然港湾维系经济，而今后的发展则必须建立在更加可靠的钢铁、机械与混凝土之上。"
 GEA_The_German_cultural_craze:0 "德意志文化狂潮"
 GEA_The_German_cultural_craze_desc:0 "随着德国企业、工程师与行政人员不断涌入德属东亚，德语、德国教育制度及德国式城市生活也开始在殖民地主要城市传播。新加坡与西贡的德国学校逐渐扩大招生，书店里出现更多德语出版物，德国商会与文化协会则举办展览、音乐会和各类公共活动。总督府计划进一步支持这些文化机构，扩大德语职业教育，并通过奖学金和技术培训吸引更多本土精英接受德国教育。我们希望培养出一批熟悉德国法律、商业制度与工业技术的地方人才，使其成为连接殖民政府与本土社会的桥梁。不过，文化上的影响力终究不能完全依靠行政命令建立，德国人能否真正赢得当地居民的认同，仍然是一个远比开办学校更加复杂的问题。"
 GEA_Abolish_unnecessary_institutions:0 "裁撤无用机构"
 GEA_Abolish_unnecessary_institutions_desc:0 "德属东亚的行政体系是在不同时期、通过接管数个前英国与法国殖民地逐渐拼凑而成的，其内部至今保留着大量职权重叠、效率低下的机关。德国官僚、旧殖民地机构与地方保护国行政部门经常相互推诿，一项简单的商业许可也可能需要经过数个部门反复审查。总督府将对现有行政机构展开全面评估，撤销不再具有实际作用的办事处，合并重复设置的部门，并减少企业在投资、建设与贸易过程中需要履行的不必要程序。虽然一些依靠旧制度维持地位的官员可能强烈反对，但殖民地有限的财政收入显然不应继续浪费在那些只会制造更多公文的机关之上。"
 GEA_On_the_colonial_crown_the_pearl_is_shining:0 "殖民皇冠之上，明珠熠熠生辉"
 GEA_On_the_colonial_crown_the_pearl_is_shining_desc:0 "自世界大战的胜利为德意志帝国带来辽阔的东方领土以来，德属东亚便始终被柏林视作海外扩张最重要的成果之一。然而，真正使一片殖民地值得骄傲的，绝不仅仅是地图上增加了多少颜色，而是它能否为帝国创造持久的财富与战略价值。经过持续的基础设施建设、资源开发与经济整顿，德属东亚终于拥有了更加完整的交通网络、稳定的出口产业与不断扩张的城市经济。德国资本在这里获得回报，帝国工业得到重要原料，而远东舰队也拥有了可靠的后勤基础。虽然殖民地内部的贫富差距与政治矛盾仍然存在，但对于柏林的殖民主义者而言，这片海外领地已经足以成为德意志帝国皇冠上最为耀眼的明珠之一。"
 GEA_Krupp_brought_armaments:0 "克虏伯带来军备"
 GEA_Krupp_brought_armaments_desc:0 "从普鲁士王国的崛起到德意志帝国赢得世界大战，克虏伯的火炮、装甲钢材与军事装备始终是德国军队力量的重要基础。如今，面对日本海军的扩张与印度支那日益严峻的安全局势，德属东亚同样需要克虏伯的工业技术与军火供应。总督府将与埃森的工业集团展开进一步合作，争取在远东建设武器维修、弹药制造及军事机械生产设施，并通过长期采购合同确保驻军能够稳定获得装备。作为交换，克虏伯将得到新的经营特许与投资机会。德国军方需要可靠的武器，而克虏伯则需要新的市场；在这片远离欧洲的土地上，双方或许能够再一次建立互惠互利的合作关系。"
 GEA_Work_for_our_great_cause:0 "为我们的伟业而劳作"
 GEA_Work_for_our_great_cause_desc:0 "大型工业工程的完成从来不仅依靠企业家的雄心与工程师的图纸，更需要成千上万的工人日复一日地投入劳动。随着克虏伯及其他重工业企业在德属东亚扩大经营，矿山、钢铁厂与建筑工地对于劳动力的需求正在迅速增长。我们将建立更加系统的劳工招募与职业培训制度，鼓励来自殖民地各地的居民进入现代工业部门，并通过企业宿舍、医疗设施与基本福利安排提高工人的稳定性。然而，德国工业界对于生产效率与劳动力成本的要求，始终同当地工人改善生活条件的愿望存在冲突。总督府必须在维护企业经营利益与避免严重劳资动荡之间寻找平衡，确保这场宏伟的工业建设不会因为管理失当而陷入停滞。"
 GEA_Far_East_Ruhr:0 "远东鲁尔"
 GEA_Far_East_Ruhr_desc:0 "德国鲁尔工业区之所以能够成为帝国钢铁与机械制造业的中心，不仅因为那里拥有丰富的煤炭资源，更因为矿山、铁路、冶炼厂与加工企业共同构成了一套高度集中的工业体系。德属东亚同样拥有建立类似工业中心的潜力。我们将选择交通便利、能源供应可靠的地区集中建设炼钢厂、机械工厂与相关配套设施，并通过铁路和港口将其同矿产资源产地连接起来。克虏伯等大型企业将获得参与这些建设的机会，而总督府则负责规划工业区的土地、能源与公共设施。只要能够将分散的资源与工厂整合起来，远东便有望孕育出一片属于自己的鲁尔工业区。"
 GEA_The_Steel_City:0 "钢铁之城"
 GEA_The_Steel_City_desc:0 "一座真正意义上的工业城市，绝不只是几座工厂与烟囱的简单集合。随着德属东亚重工业规模的扩大，我们需要为工人、工程师与管理人员建设完整的居住和生活设施，并确保工厂能够获得稳定的水、电、煤炭及运输服务。总督府将支持在主要工业区兴建新的工人住宅、公共道路、仓库与铁路支线，并鼓励克虏伯借鉴埃森的工业城市管理经验，建立企业医疗与职业培训机构。随着越来越多的人离开传统乡村进入现代工厂，新的工业社区也将逐渐形成。对于德国工程师而言，这是一项值得骄傲的城市建设计划；对于本土劳工来说，它则意味着一种全然不同于过去农业生活的新秩序。"
 GEA_Full_control:0 "全面掌控"
 GEA_Full_control_desc:0 "重工业生产涉及矿石、煤炭、焦炭、钢材、机械与运输等众多环节，任何一处供应中断都可能使整条生产线陷入停顿。克虏伯的管理人员认为，与其将企业命运寄托在众多彼此独立的供应商身上，不如尽可能掌握从原料开采到成品制造的完整产业链。总督府将支持大型工业集团整合矿山、运输企业与加工设施，推动长期供应合同及统一的生产规划，以减少不必要的成本与经营风险。然而，这种高度集中的产业体系也可能使少数企业获得过大的市场支配能力。因此，在给予工业集团充分经营空间的同时，我们仍须确保殖民政府能够监督关键产业，避免德属东亚的重要经济命脉完全落入私人财团之手。"
 GEA_Play_the_song_of_the_blast_furnace:0 "奏响高炉之曲"
 GEA_Play_the_song_of_the_blast_furnace_desc:0 "钢铁工业的发展离不开可靠的冶炼设备与稳定的能源供应。尽管德属东亚拥有丰富的矿产资源，但当地大部分金属原料仍然需要经过简单处理后运往欧洲，再由德国本土的工厂完成冶炼与加工。这种经营模式不仅增加了运输成本，也使殖民地始终无法建立独立的重工业基础。我们将引进先进的高炉、炼钢设备与金属加工技术，扩大冶炼厂的建设，并改善煤炭、焦炭与铁矿石的运输体系。随着高炉点火、熔融的钢水倾入铸模，远东的工业生产将逐步摆脱单纯出口原料的旧有模式。轰鸣的机械与冲天的炉火，将成为殖民地经济转型最直接的象征。"
 GEA_Iron_within_Iron_without:0 "内外皆钢"
 GEA_Iron_within_Iron_without_desc:0 "现代军队所依赖的武器与装备，几乎无一能够脱离钢铁工业的支持。从步兵使用的枪械，到海军舰艇的装甲板，再到铁路、桥梁及工业机械，钢铁既是军事力量的基础，也是现代经济不可或缺的材料。德属东亚必须进一步加强钢铁生产与军工制造之间的联系，使本地冶炼厂能够稳定供应装甲钢材、机械零件与其他重要工业产品。通过扩大工业标准化与质量检验制度，我们将确保殖民地生产的钢材不仅能够满足普通建筑需求，也能够用于更加复杂的军事装备。无论帝国未来需要的是坚固的军舰、可靠的火炮还是能够长期运转的工厂，远东的钢铁都应当成为支撑这些建设的重要基础。"
 GEA_IG_fraben_brought_progress:0 "IG法本带来进步"
 GEA_IG_fraben_brought_progress_desc:0 "现代化学工业的发展早已证明，原本看似平凡的煤炭、石油和植物原料，经过复杂的工业加工之后，便能够转化为染料、药品、化肥及各类具有重要价值的工业产品。作为德意志帝国最具影响力的化学工业联合体之一，IG法本拥有雄厚的资本、先进的科研能力和庞大的国际销售网络，而德属东亚丰富的热带资源则为其提供了新的发展空间。我们将邀请法本集团在殖民地设立生产与研究机构，扩大化工原料加工能力，并通过优惠政策吸引相关投资。虽然部分传统商人仍然认为，出口橡胶、稻米和矿石便足以维持殖民地的繁荣，但法本的工程师相信，真正丰厚的利润往往诞生于原料经过化学处理之后。"
 GEA_Draw_the_industrial_panorama:0 "绘制工业画卷"
 GEA_Draw_the_industrial_panorama_desc:0 "建立现代化学工业绝非仅仅修筑几座厂房便能够完成的任务。不同化工产品对于原料、能源、设备与技术人员的需求各不相同，而生产过程中形成的副产品又往往能够成为其他工业部门的重要原料。IG法本的专家建议，我们应当首先对德属东亚的资源分布与工业条件展开全面调查，再根据港口、铁路、供水与能源设施的情况规划化工园区。通过将原料处理、基础化学品生产、精细化工与相关科研机构集中布局，我们可以减少重复建设与运输损耗，并为今后的产业扩张留下空间。一幅真正完整的工业画卷，不应只有高耸的烟囱，更应当有将各个生产环节紧密连接起来的精密结构。"
 GEA_Cheap_raw_materials:0 "廉价原料"
 GEA_Cheap_raw_materials_desc:0 "化学工业的盈利能力不仅取决于先进的技术，也在很大程度上受到原材料采购成本的影响。德属东亚丰富的天然橡胶、植物油、煤炭及其他热带资源，使德国企业有机会直接在产地附近建立加工设施，避免将大量未经处理的原料运往欧洲所产生的额外费用。我们将改善殖民地原料采购和运输体系，鼓励种植园、矿业企业与化工厂签订长期供应合同，并通过扩大生产规模降低单位成本。然而，追求低廉原料的企业往往希望进一步压低土地与劳动力价格，这也可能加剧殖民地原有的经济矛盾。总督府必须确保原料供应足够稳定，使工业发展不会因无节制的价格竞争与地方冲突而受到妨碍。"
 GEA_Malicious_poison:0 "恶意毒物"
 GEA_Malicious_poison_desc:0 "现代化学工业所创造的成就，并不总是用于改善人类的生活。世界大战中的毒气战已经向欧洲各国证明，化学技术同样能够被用于制造令人胆寒的战争武器，而工业生产所需的各种剧毒物质，也对工人与周边环境构成了严重危险。随着IG法本在远东的业务不断扩大，殖民地军方开始对特殊化学品、军事防护材料与相关研究表现出浓厚兴趣。我们将加强化学研究机构与军方技术部门的合作，扩大防护设备、危险化学品管理及军事化学技术的研究能力。尽管这些项目能够为帝国提供新的战略优势，但总督府也必须面对一个令人不安的问题：当能够制造药物与肥料的化学工厂同样具备服务于战争的潜力时，谁又能够保证那些技术最终只会被用于有益的事业？"
 GEA_Reproducing_the_Magic_of_Synthesizing_Ammonia:0 "复现合成氨之魔术"
 GEA_Reproducing_the_Magic_of_Synthesizing_Ammonia_desc:0 "弗里茨·哈伯与卡尔·博施所推动的工业合成氨技术，堪称现代化学史上最重要的突破之一。通过将空气中的氮转化为可供工业使用的化合物，德国化学家不仅为农业生产提供了新的肥料来源，也使工业部门获得了更加可靠的基础化工原料。德属东亚拥有广阔的农业地区，稻米与其他经济作物的生产对于肥料供应有着日益增长的需求，而殖民地的工业化同样需要更多基础化学品。我们将引进合成氨生产设备与相关催化技术，建设化肥及基础化工厂，并培养能够管理高压化学设备的专业人员。通过将德国本土的科学成果应用于远东，殖民地既能提高农业生产效率，也能进一步完善自身的化学工业体系。"
 GEA_Questions_of_Tropical_Pathology:0 "热带病理之问"
 GEA_Questions_of_Tropical_Pathology_desc:0 "对于远赴东方的德国军人、工程师与殖民官员而言，热带疾病始终是一个无法回避的问题。疟疾、霍乱、痢疾及其他传染病不仅威胁着当地居民的健康，也使驻军与工厂不断承受劳动力损失。IG法本及德国医学界认为，德属东亚复杂的自然环境为药物研发、病原研究与公共卫生技术提供了重要的实践机会。我们将加强殖民地医院、医学实验室与德国制药企业之间的合作，开展热带疾病的诊断、防治及药物研究，并改善主要城市与工业区的卫生设施。虽然这些研究能够服务于殖民地经济与军队的实际需求，但只有让更多普通居民获得基本医疗服务，德国医学的进步才能真正减少疾病造成的损失。"
 GEA_Far_East_dumping_network:0 "远东倾销网络"
 GEA_Far_East_dumping_network_desc:0 "随着德属东亚化工厂的生产规模不断扩大，仅仅依靠殖民地内部的消费市场已经难以吸收全部工业产品。IG法本拥有广泛的国际商业关系，而中国、日本及东南亚各地对于染料、药品、化肥与其他工业化学品的需求仍在持续增长。我们将利用德国航运企业、德华银行及通用东亚公司的商业网络，扩大化工产品在远东市场的销售，并通过优惠信贷与批量定价争取更多客户。对于实力较弱的本地竞争企业而言，德国工业集团雄厚的资本和低价销售策略无疑将构成沉重压力。然而，只要这些市场能够为殖民地工厂带来稳定订单，德国商人便有充分理由继续扩大自己的商业影响力。"
 GEA_The_Eastern_Palace_of_the_Gods:0 "诸神之东方行宫"
 GEA_The_Eastern_Palace_of_the_Gods_desc:0 "从人工合成染料到现代药品，从农业化肥到各种新式工业材料，化学工业正在以令人难以想象的速度改变人们的生活。IG法本的管理人员坚信，德属东亚不应仅仅成为德国化工企业采购廉价原料的基地，更应当发展出能够独立进行生产、试验与技术改良的现代化学工业体系。我们将进一步扩大化工园区与科研机构的规模，吸引德国化学家、工程师和技术人员前来工作，并推动基础研究与工业生产之间的合作。昔日被认为只适合种植橡胶与稻米的热带土地，如今将出现装备精密仪器的实验室与昼夜运转的化学工厂。法本的科学家们或许无法像古老神话中的诸神那样凭空创造万物，但他们确实正在赋予东方的自然资源前所未有的工业价值。" 
 GEA_OSRAM_brings_prosperity:0 "电气化带来繁荣"
 GEA_OSRAM_brings_prosperity_desc:0 "电力的普及正在从根本上改变现代城市与工业生产的面貌。德国本土的工厂已经越来越依赖电动机械与电气设备，而城市照明、商业设施及公共交通的发展，也使电力成为现代经济不可或缺的基础。德属东亚虽然拥有繁忙的港口与不断扩大的工业部门，但许多地方仍然缺乏稳定的电力供应，部分城市甚至必须依靠老旧的小型发电设备维持照明。我们将鼓励德国电气企业在远东扩大投资，引进现代发电与配电设备，并通过与奥斯朗等照明设备制造商合作，推动城市与工业区的电气化。只有使稳定的电力进入工厂、商店和住宅，殖民地的现代化才能真正深入日常生活。"
 GEA_Light_up_the_city_streets:0 "点亮城市街头"
 GEA_Light_up_the_city_streets_desc:0 "每当夜幕降临，新加坡与西贡的主要商业街区便逐渐亮起电灯，而距离这些繁华街道不远的居民区，却仍然依靠煤油灯与微弱的烛光度过夜晚。电力照明的发展不仅能够改善城市居民的生活，也有助于延长商业营业时间、提高道路安全并推动公共设施建设。总督府将扩大主要城市的配电网络，更新街道照明设备，并鼓励地方政府将电灯逐步引入市场、车站与其他公共场所。德国电气企业将获得新的设备订单，而殖民政府也能够借此展示现代技术带来的实际成果。不过，在那些收入微薄的居民看来，电灯能否真正走进家门，最终仍取决于他们是否负担得起每个月的电费。"
 GEA_Ensure_the_source_of_industrial_power:0 "确保工业动力之源"
 GEA_Ensure_the_source_of_industrial_power_desc:0 "工业化规模越大，对于稳定能源供应的依赖便越强。德属东亚的许多工厂仍然使用效率有限的独立动力设备，而日益扩大的机械制造、冶炼与化学工业，则需要更加可靠的大规模电力供应。我们将对殖民地现有的燃料资源、水力条件与电力需求展开调查，优先在主要工业区域建设集中发电设施，并通过新的输电线路将矿山、工厂和港口连接起来。与此同时，总督府还将改善煤炭、石油及其他燃料的运输和储备体系，减少生产中断的风险。现代工业需要的不仅是高耸的烟囱与轰鸣的机械，更需要一套能够让这些机器持续运转的能源基础。"
 GEA_Build_city_that_never_sleeps:0 "建设不夜城"
 GEA_Build_city_that_never_sleeps_desc:0 "随着电气照明、现代交通与城市商业的发展，德属东亚的主要港口正在逐渐摆脱日出而作、日落而息的传统生活节奏。夜间装卸的货轮、延长营业时间的商店、灯火通明的旅馆和娱乐场所，使新加坡与西贡拥有了越来越鲜明的现代都市面貌。总督府将继续扩大城市电力与公共交通设施，改善商业街区、码头和工业区的照明，并鼓励私人资本投资酒店、百货公司及其他服务业。对于德国商人与殖民地官员而言，这些繁华的夜景正是帝国统治所带来的现代化象征；而对于轮班工作的码头工人和工厂劳工来说，城市即使不再入睡，也并不意味着每个人都能享受夜晚的闲暇。"
 GEA_Introduce_local_technologies:0 "本土技术优先"
 GEA_Introduce_local_technologies_desc:0 "德属东亚的现代化建设长期以来依靠从德国本土进口机械、设备与专业技术人员，但这种模式既增加了财政负担，也使殖民地在维修与生产过程中始终无法摆脱对欧洲的依赖。我们必须鼓励当地工厂逐步掌握电气设备的安装、维护与部分零部件制造技术，并通过职业学校及企业培训培养本土工程师与熟练技工。对于那些能够利用殖民地现有材料和生产条件完成的项目，总督府将优先考虑本地制造与采购，以缩短交货时间并降低运输费用。德国工业的技术优势固然值得借鉴，但只有使这些知识真正扎根于远东，德属东亚才能拥有更加可靠而独立的工业基础。"
 GEA_Introduce_Brown-Boveri:0 "引进布朗-博韦里"
 GEA_Introduce_Brown-Boveri_desc:0 "随着德属东亚的工业用电需求不断增长，普通的照明设备与小型发电机已经无法满足现代化工厂的需要。以大型电机、发电设备和电力工程技术闻名的布朗-博韦里公司，拥有能够帮助殖民地建立更完善电力体系的专业经验。我们将争取与这家企业展开合作，引进大型发电机、变压器及工业电动设备，并邀请其工程师参与主要工业区的电力规划与技术培训。通过采用更加可靠的电气设备，德属东亚的矿山、冶炼厂和机械工厂将能够提高生产效率，同时减少老旧动力系统造成的损耗。尽管这些设备需要大量投资，但没有现代电力工业，殖民地便不可能真正实现工业化。"
 GEA_Lorenz_brings_the_sounds_from_beyond:0 "洛伦茨带来彼方之音"
 GEA_Lorenz_brings_the_sounds_from_beyond_desc:0 "对于幅员辽阔、领土分散的德属东亚而言，可靠的远距离通信始终是行政与商业活动中的一项重要难题。过去，许多偏远岛屿与内陆地区只能依赖海底电缆、有限的电报线路或定期航行的商船传递消息，而现代无线电技术的进步正在逐渐改变这一局面。我们将加强与德国通信设备制造商洛伦茨公司的合作，引进无线电发射与接收设备，扩大殖民地广播和通信设施的建设，并改善港口、航空站及地方行政机关之间的信息联系。随着越来越多的无线电台投入使用，德国商人将能够及时获取市场行情，殖民政府也能更加迅速地传达命令，而来自遥远柏林的声音则将第一次如此清晰地传入南洋的寻常城市与港口。"
 GEA_Move_further_towards_the_future:0 "向未来更进一步"
 GEA_Move_further_towards_the_future_desc:0 "从最初的港口照明到大型工业电力设施，再到逐渐覆盖殖民地的无线电通信网络，现代电气技术正在为德属东亚带来前所未有的变化。德国企业所提供的设备与技术，使过去需要依靠人力、蒸汽机械和漫长航程完成的工作变得更加迅速，也为新式工业和城市生活创造了条件。然而，真正的技术进步绝不应当止步于购买几批先进设备。我们将继续支持电气工程、通信技术与工业自动化方面的研究，扩大职业教育和技术人员培养，并鼓励企业将新技术投入实际生产。德属东亚已经迈出了现代化的重要一步，而未来的发展将取决于我们能否继续将这些成果转化为稳定的工业能力与社会基础设施。"
 GEA_inject_capital_into_Deutsche_Bank:0 "注资德华银行"
 GEA_inject_capital_into_Deutsche_Bank_desc:0 "黑色星期一的金融风暴已经严重动摇了德国在远东苦心经营数十年的金融体系。作为帝国在中国与东亚商业活动的重要金融支柱，德华银行不仅承担着贸易结算与企业贷款业务，更通过其广泛的分支机构维系着德国商人与中国地方经济之间的联系。然而，随着大量企业债务违约、存款遭到挤兑以及国际信贷市场陷入混乱，这家昔日被认为根基稳固的银行如今也面临着严重的资金压力。总督府将推动向德华银行注入新的资本，并争取德国本土金融机构及主要工业集团提供支持，以恢复其放贷与结算能力。只有确保银行体系不至于崩溃，我们才能避免远东的商业危机进一步演变成整个殖民地的经济灾难。"
 GEA_Relax_credit_conditions:0 "放宽信贷"
 GEA_Relax_credit_conditions_desc:0 "随着经济危机不断加深，德属东亚的许多商人与企业已经发现，即使拥有可靠的资产和长期订单，也越来越难以从银行获得必要的贷款。金融机构出于对债务违约的担忧纷纷收紧信贷，结果却使原本尚能维持经营的工厂、种植园与贸易公司同样陷入困境。为了阻止这种恶性循环，总督府将鼓励德华银行与其他金融机构适度放宽贷款条件，为具有稳定经营基础的企业提供新的流动资金，并通过担保和贷款展期减轻短期偿债压力。当然，过度宽松的信贷政策可能进一步增加金融风险，但倘若银行宁愿将资金锁在金库里，也不肯向市场提供贷款，那么殖民地的经济恢复便永远无从谈起。"
 GEA_Expand_issuance_of_banknotes:0 "扩大银行券发行"
 GEA_Expand_issuance_of_banknotes_desc:0 "德华银行长期以来在德国于中国及远东的金融活动中发挥着重要作用，其银行券与信贷业务也为当地商贸提供了便利。如今，随着黑色星期一造成的金融紧缩不断加剧，市场上流通资金的不足正在影响企业支付工资、采购原料与结算货款的能力。总督府将推动扩大德华银行在合法权限内的银行券发行与流动性供给，并加强相关储备和兑付安排，使金融机构能够更有效地满足贸易与生产的资金需求。然而，扩大货币供应绝非毫无代价，倘若发行规模超过市场能够承受的限度，银行券的信用与兑换价值便可能受到损害。因此，我们必须在缓解货币紧缩与维护金融稳定之间保持谨慎平衡，避免用另一场危机解决眼前的困难。"
 GEA_banknote_china_economic_discount_tt:0 "以下基础对华经济决议享受政治点数费用优惠：\n投资华东、开设村县银行、投资山东、建立德资企业、组织粤商洽谈、开设广州商务处、组织赴滇商团、提供富滇银行信用担保、组织川商洽谈、开设重庆商务处、扶植亲德工商代表、提供低息贷款。"
 GEA_Industrial_Credit_Committee:0 "产业信贷委员会"
 GEA_Industrial_Credit_Committee_desc:0 "德属东亚的工业发展长期面临着资本分配不均的问题。大型德国企业往往能够凭借柏林的人脉轻易获得贷款，而缺乏政治关系的地方工厂与新兴企业，即使拥有可靠的发展计划，也很难得到银行的重视。为了更有效地利用有限的金融资源，我们将成立由殖民政府、德华银行及主要工业界代表共同参与的产业信贷委员会，负责审核重要工业投资项目，并协调长期贷款、企业担保与基础设施融资。委员会将优先支持能够改善殖民地生产能力、交通运输及战略物资供应的项目，同时加强对贷款用途与偿还能力的监督。通过将银行信贷同殖民地整体经济规划联系起来，我们希望避免资金继续被无谓的投机与低效投资消耗。"
 GEA_Tighten_control_of_the_eastern_railway_network:0 "加紧控制东方铁路网"
 GEA_Tighten_control_of_the_eastern_railway_network_desc:0 "德国资本在中国取得的诸多商业特权之中，铁路经营权无疑具有最为深远的战略意义。铁路不仅能够将内陆矿产、农产品与沿海港口联系起来，更能够决定地方政府的财政收入、军事运输与重要城市之间的经济往来。长期以来，德华银行与通用东亚公司通过贷款、债券投资及特许经营参与中国铁路建设，但复杂的军阀政治和不断变化的地方政权始终威胁着这些投资的安全。我们将加强对重要铁路债务与经营公司的监督，扩大德国金融机构在铁路管理中的影响力，并利用与亲德地方政府的关系争取更加可靠的运输和经营保障。掌握东方的铁路，便意味着掌握了通往中国腹地的商业道路。"
 GEA_Liquidation_of_non-performing_assets_in_East_Asia:0 "清算东亚不良资产"
 GEA_Liquidation_of_non-performing_assets_in_East_Asia_desc:0 "黑色星期一所暴露的问题，并不仅仅是市场上缺乏资金，更在于德国金融机构多年来积累了大量难以收回的贷款和价值严重缩水的投资。从经营不善的种植园到债务缠身的中国铁路公司，从破产的贸易企业到无力偿还借款的地方军阀，这些不良资产正在不断侵蚀德华银行与其他金融机构的资本。总督府将推动一轮全面的资产清查，要求银行重新评估贷款质量，并通过债务重组、资产出售及必要的企业清算减少损失。对于那些仍然具有经营价值的项目，我们可以考虑引入新的投资者；至于长期依靠银行续贷勉强维持的企业，则不能继续无限消耗有限的金融资源。只有将这些积年旧账逐步处理干净，远东金融体系才有可能恢复健康。"
 GEA_AOG_Hegemony:0 "监事会霸权"
 GEA_AOG_Hegemony_desc:0 "通用东亚公司最初只是德国在华商业投资的组织者之一，但随着铁路、矿山、工业企业与金融机构逐渐被纳入其庞大的经营网络，它的影响力早已远远超出了普通贸易公司的范畴。在中国的某些地区，德国投资者虽然并不直接参与地方政府的行政事务，却能够通过公司监事会、贷款协议与经营特许权，对重要经济决策施加决定性影响。我们将进一步加强通用东亚公司对旗下企业的管理，协调德国资本在中国的投资布局，并推动其在关键产业中获得更加稳定的经营地位。对于那些依赖德国贷款与技术维持财政的中国地方政权而言，来自公司监事会的一纸决议，有时甚至比南京或北京发出的政令更加难以违抗。"
 GEA_Provide_protection_for_local_enterprises:0 "为本地企业遮风挡雨"
 GEA_Provide_protection_for_local_enterprises_desc:0 "德属东亚的经济虽然长期依赖德国大型企业与海外资本，但真正维系殖民地日常商业活动的，仍然是遍布城市与乡村的本地商人、作坊和中小型企业。从新加坡的华人商会到印度支那的粮食加工厂，这些企业熟悉当地市场，却经常缺乏足够的资本与技术，难以同拥有庞大资源的德国财团竞争。总督府将通过适当的税收优惠、技术培训与融资支持，为本地企业创造更加稳定的经营环境，并在部分政府采购和基础设施项目中给予它们参与机会。我们并不打算牺牲德国企业的正当利益，但一个完全由少数海外财团支配的殖民地经济，也绝不可能拥有持久的繁荣。"
 GEA_Implement_corporate_regulations:0 "落实企业法度"
 GEA_Implement_corporate_regulations_desc:0 "随着德属东亚的商业活动不断扩大，殖民地现有的企业管理制度已经越来越难以应对复杂的现代经济。德国公司、本地商会与来自其他国家的投资者，往往需要遵守彼此不同的法律与商业惯例，而合同纠纷、债务争议及不透明的经营行为也因此屡见不鲜。我们将进一步完善公司登记、财务披露与商业合同制度，明确企业在经营、纳税及债务偿还方面的法律责任，并加强商事法院和行政机构处理经济纠纷的能力。通过建立更加统一而可靠的商业规则，总督府不仅能够减少不必要的经营风险，也能向投资者证明，德属东亚并非一个只能依靠人脉与政治特权获取利润的混乱市场。"
 GEA_Reduce_the_burden_on_small_and_micro_enterprises:0 "减轻小微企业负担"
 GEA_Reduce_the_burden_on_small_and_micro_enterprises_desc:0 "在殖民地经济遭受黑色星期一冲击之后，最先陷入困境的往往并非拥有雄厚资本的德国工业巨头，而是那些依靠有限积蓄维持经营的小商铺、家庭作坊与地方企业。繁琐的营业许可、层层征收的地方税费以及不断上涨的运输成本，使许多原本能够维持生计的经营者不得不关门歇业。总督府将简化小型企业的注册程序，适当减免部分行政费用与税收负担，并鼓励金融机构提供规模较小、期限灵活的商业贷款。虽然这些措施未必能够立即创造惊人的工业产值，却有助于恢复殖民地的市场活力，维持就业，并使更多普通居民能够从经济复苏中获得实际利益。"
 GEA_Ordering_a_cartel:0 "勒令卡特尔"
 GEA_Ordering_a_cartel_desc:0 "德国大型工业卡特尔在殖民地的经营活动，长期以来享有各种优惠政策与行政便利，但这并不意味着它们可以完全无视总督府的权威。随着少数财团对重要产业的控制不断扩大，一些企业开始通过限制市场供应、操纵采购价格及排挤本地竞争者来维护自己的利润，甚至试图利用柏林的政治关系阻止殖民政府进行监管。我们将要求主要工业集团重新审查其经营合同，配合政府实施必要的价格与市场监督，并对滥用垄断地位的行为采取措施。克虏伯与IG法本固然拥有足以影响德国经济的庞大实力，但在德属东亚的土地上，它们仍然必须遵守殖民地政府制定的规则。"
 GEA_Guarantee_for_investors:0 "为投资者作保"
 GEA_Guarantee_for_investors_desc:0 "对于远离德国本土的投资者而言，德属东亚丰富的资源与广阔的市场固然令人向往，但政治动荡、法律制度复杂及基础设施不足等问题，也使许多资本家对前往东方投资保持谨慎。为了吸引更多长期资本，总督府将建立更加完善的投资保障制度，明确企业财产权、经营合同与争议解决程序，并对符合殖民地发展规划的重要项目提供有限的政府担保。与此同时，我们还将改善投资审批与信息披露制度，减少企业在开展经营前需要面对的不确定性。当然，政府的信用绝不能成为投机者随意挥霍的资本，但只要能够合理控制风险，殖民地便有机会吸引更多德国本土及国际市场的资金。"
 GEA_The_Age_of_Trade:0 "贸易时代"
 GEA_The_Age_of_Trade_desc:0 "自德国人接管马六甲海峡的重要港口以来，德属东亚便始终依靠海上贸易维持自身的经济地位。如今，随着殖民地交通网络不断改善、工业生产逐渐扩大，以及金融体系重新恢复活力，我们终于拥有了进一步拓展国际商业活动的条件。总督府将降低不必要的贸易障碍，完善港口与海关管理制度，并鼓励德国航运公司、银行及本地商人共同开拓新的市场。从中国沿海到印度洋彼岸，德属东亚的商品与资本将通过更加紧密的商业网络流向世界各地。虽然国际贸易始终难以摆脱政治冲突与经济波动的影响，但一个拥有完善港口、可靠金融和多元产业的殖民地，显然能够在世界市场中占据更加有利的地位。"
 GEA_Consumption_brings_order:0 "消费带来秩序"
 GEA_Consumption_brings_order_desc:0 "长期以来，德属东亚的经济政策过于重视原材料出口与大型企业的生产指标，却忽视了殖民地内部消费市场所拥有的巨大潜力。事实上，稳定的就业、不断提高的居民收入与丰富的日常商品，不仅能够为本地企业创造新的商机，也有助于减少经济困顿所引发的社会不满。总督府将鼓励轻工业、零售业与城市服务业的发展，改善商品流通与市场供应，并通过扩大就业及适度提高劳动生产率，逐步增强居民的消费能力。在那些笃信商业繁荣能够维持社会稳定的德国官员看来，一个愿意将收入花费在商店、住房与日常生活上的城市居民，至少比一个失业、贫困且对未来毫无希望的工人更加容易接受现有秩序。"
 GEA_The_era_of_the_middle_class:0 "中产阶级时代"
 GEA_The_era_of_the_middle_class_desc:0 "随着德属东亚的工业、贸易与城市经济不断发展，一个过去在殖民地社会中并不十分显眼的阶层正在逐渐扩大。受过新式教育的本土职员、技术人员、教师、商人及小企业经营者，开始拥有更加稳定的收入，也对住房、教育、公共设施与政治参与提出了新的要求。总督府认为，这些群体有机会成为维持殖民地社会稳定的重要力量。我们将进一步支持职业教育、中小企业与城市公共服务的发展，鼓励更多居民通过专业技能和商业经营改善自身生活，并为具备能力的本土人才提供适当的行政与经济机会。当然，随着中产阶级不断壮大，他们也可能要求获得与自身经济地位相匹配的政治权利，但相比长期依靠贫困和强制维持统治，一个拥有广泛稳定社会基础的德属东亚显然更加值得期待。"

#军改
 GEA_Ostasiatische_Heer:0 "德属东亚军"
 GEA_Ostasiatische_Heer_desc:0 "德属东亚军，或是被称为德属东亚殖民军，其主体由曾经德国的一战老兵与精锐军官作为核心主干，被调拨到德属东亚作为维持殖民地正常运转的武装力量。然而，这样一支精锐军队最终也难以逃脱消亡的命运。如今，德属东亚殖民军无论是从人数还是兵员素质上都远远无法与曾经相比。现在摆在我们面前最急迫的就是为这支军队挑选改革方向。"
 GEA_emergency_meeting:0 "至暗时刻"
 GEA_emergency_meeting_desc:0 "在印支叛乱的烽火与混乱之中，新加坡的德属东亚总参谋部彻夜灯火通明，一场为了应对整个印度支那的叛乱业火的紧急会议正在召开。在这场决定远东命运的紧急会议上，革新与循序争相辩论，激进与保守相互攻讦，而德属东亚武装力量的未来发展方向也将被彻底敲定..."
 GEA_The_younger_generation_triumph:0 "少壮派凯旋"
 GEA_The_younger_generation_triumph_desc:0 "在激烈的辩论与争吵后，德属东亚军队中的少壮派占据了上风。他们主张通过一场大刀阔斧的现代化革新来将德属东亚军队带入世界一流军队的行列之中。随着决议的签署，一批曾在军事学院接受过最新战术教育的年轻军官被提拔至各作战处室的核心岗位，德属东亚陆军正式启动了由治安守备部队向现代野战部队的改组进程。"
 GEA_Trust_the_General_Staff_Department:0 "信任总参谋部"
 GEA_Trust_the_General_Staff_Department_desc:0 "面对远东日益严峻的防务压力，海军部与殖民地高层经过审慎权衡，最终决定将军事改革的主导权交予经验丰富的总参谋部资深将领。毕竟，德属东亚的地理环境与工业基础均与欧洲本土存在显著差异，盲目照搬未经检验的激进理论可能带来难以预料的后勤风险。相比之下，历经世界大战考验的普鲁士参谋部传统与组织体系，依然是统筹广袤殖民地防务最稳妥的基石。"
 GEA_Rebuild_the_mobilization_system:0 "重建动员体系"
 GEA_Rebuild_the_mobilization_system_desc:0 "德属东亚辖境广阔，从马来亚半岛、北婆罗洲、印度支那直至中国沿海商埠，各驻防点之间相隔数千海里。旧有的动员机制主要依赖本土定期轮换的常备营，一旦海运受阻或面临多线紧急事态，前线兵员补充便会捉襟见肘。为此，总参谋部着手重建全区预备役登记与战时征召体系，不仅对定居远东的德裔适龄侨民实行系统的军事训练登记，还重新规范了各地殖民地辅助部队的扩编流程，并与远东商船队建立战时紧急征用机制，以便在战端开启时迅速完成兵力集结。"
 GEA_The_city_of_Abwehr:0 "阿勃维尔之城"
 GEA_The_city_of_Abwehr_desc:0 "远东的一句俗语“明枪易躲，暗箭难防”很好的描述了德属东亚如今在远东的窘境。面对潜伏在西贡街巷与上海弄堂里的工团主义刺客、国民党特工以及无孔不入的日本间谍，过去的秘密战线手段已经显得难以应付。通过引入新型无线电测向设备、建立专门的密码破译部门，并系统整合散布于各通商口岸的外勤情报网，阿勃维尔在远东的渗透与情报作战能力将得到大幅提升，而新加坡这座远东最大的城市之一将成为阿勃维尔们最为看重的后方保障基地。"
 GEA_All_for_the_purpose_of_defending:0 "一切为保卫"
 GEA_All_for_the_purpose_of_defending_desc:0 "远东殖民地与柏林本土之间漫长的补给距离，决定了德属东亚在面对大规模武装冲突时，必须在相当长的时间内依靠自身储备独立支撑战局。总参谋部为此制定了全面的战备防御规划，要求各主要海空军基地、交通枢纽与资源产区提前建立战时物资储备库，并对部分关键民用基础设施进行军事化改造。同时，各地驻军将与殖民地民防机构定期举行联合防空与海岸防卫演习，确保整片辖区在战时能够迅速转入总体防御状态。"
 GEA_Military_expansion_plan:0 "[GetYear]扩军计划"
 GEA_Military_expansion_plan_desc:0 "随着远东周边各主要军事强权相继扩充军备，德属东亚原有的常备陆军规模已明显不足以覆盖漫长的陆海防线。单凭现有的几个东亚海军步兵营与殖民地警察旅，已根本不足以同时按住印度支那的叛乱火药桶并威慑蠢蠢欲动的东京。我们将大举扩编正规陆军师，放宽非德裔兵员的战斗部队服役限制，并向本土申请成建制的军官骨干填补编制。"
 GEA_Stauffenberg_s_strategy:0 "施陶芬贝格的策略"
 GEA_Stauffenberg_s_strategy_desc:0 "克劳斯·冯·施陶芬贝格上校希望将德属东亚军队改革成将装甲机动力量作为首位、配合自行式火力战斗的现代化军队。在考察了远东各战区的地理与交通条件后，施陶芬贝格认为，试图用有限的兵力静态防守每一寸边境线是不切实际的；相反，德属东亚应当集中财力与工业资源，组建若干支具备高度机动性与强大突击火力的精锐机械化部队，在战时通过快速的战役机动夺取战场主动权，以质量优势弥补兵力数量上的不足。"
 GEA_The_riding_of_the_Valkyries:0 "女武神的骑行"
 GEA_The_riding_of_the_Valkyries_desc:0 "在施陶芬贝格主持拟定的全新作战纲要中，代号为“女武神”的快速战役反击计划占据了核心位置。该方案设想在战区关键交通节点预先配置高度摩托化与装甲化的快速反应集群，一旦边境防线遭到突破或发现敌军主力集结，这些机动纵队便能在无线电指挥网的协调下迅速出击，沿着公路干线实施长途奔袭与侧翼包抄。通过打乱敌方的行军节奏与后方部署，我军能够在敌方站稳脚跟之前将其主力分割瓦解。"
 GEA_Emphasize_the_mobility_of_the_troops:0 "强调部队机动"
 GEA_Emphasize_the_mobility_of_the_troops_desc:0 "长期以来，殖民地步兵部队的调动高度依赖铁路干线与徒步行军，一旦离开预设铁道便行动迟缓。为了配合总参谋部强调运动战的新学说，陆军后勤部门开始在各常备步兵师中大力推进摩托化改造。通过大批量列装军用载重卡车、全地形越野摩托车以及轻量化架桥渡河器材，一线部队的日常行军速度与跨战区机动能力得到了显著提升，使指挥官能够根据战场态势的变化及时调动预备队。"
 GEA_Sharpen_the_spearhead:0 "擦亮矛头"
 GEA_Sharpen_the_spearhead_desc:0 "在早期的编制体制下，德属东亚仅有的少量装甲车辆与轻型坦克大多被拆散配属给各个步兵旅，仅用于日常巡逻或分散的火力支援。施陶芬贝格严格遵循德军装甲兵的“重点突破”原则，下令将这些分散的装甲力量收回并集中编组，同时配齐摩托化步兵、战斗工兵与通信分队，组建起真正具备独立突击能力的合成装甲营团。这支经过强化的装甲矛头将成为我军在正面战场上撕开敌方坚固防线的决定性力量。"
 GEA_Ensure_the_strength_at_the_grassroots_level:0 "确保基层火力"
 GEA_Ensure_the_strength_at_the_grassroots_level_desc:0 "现代运动战往往伴随着宽大的战线与高度分散的交战环境，基层步兵班排在推进过程中经常需要独立应对敌方的阻击据点，而不能时刻依赖上级重炮的支援。为此，总参谋部对步兵连排一级的武器配置进行了全面调整，增加了班用通用机枪、冲锋枪以及轻型迫击炮、步兵平射炮的配发比例。如此一来不仅提升了步兵伴随装甲部队突击时的压制能力，也显著巩固了部队在局部防御中的韧性。"
 GEA_Emergency_Armor_Upgrade:0 "紧急装甲改造"
 GEA_Emergency_Armor_Upgrade_desc:0 "从德国本土直接运抵远东的早期型坦克与装甲车，最初是按照欧洲温带平原的作战环境设计的，在面对东南亚的高温高湿气候、泥泞水网时，暴露出了发动机易过热、履带接地压强过大等问题。此外远东的反坦克火力匮乏也使得我们能够降低在装甲上花费的产能进而降低每辆坦克的成本。随着要求的下达，新加坡与青岛的军械修理厂开始改进与优化未来的装甲车辆产线。"
 GEA_Upgrade_the_armored_horses_and_mules:0 "升级装甲骡马"
 GEA_Upgrade_the_armored_horses_and_mules_desc:0 "如果伴随的火炮、弹药与油料补给车队被困在泥泞的土路上，再先进的坦克部队也会在突进数日后因耗尽补给而停滞不前。鉴于远东大部分地区公路路况恶劣，传统的挽马与普通两轮驱动卡车难以满足伴随保障需求，军械部门决定大举引进半履带式装甲运输车与全履带式火炮牵引车。这些被官兵们称为“装甲骡马”的特种车辆具备优异的越野通行能力，能够装载自行火炮与重型军需物资紧随装甲矛头穿越复杂地形。"
 GEA_Tresckow_s_brilliant_plan:0 "特雷司寇的良计"
 GEA_Tresckow_s_brilliant_plan_desc:0 "改革派宿将亨宁·冯·特雷司寇希望将德属东亚军队改革成体系完备、讲究空地协同作战的现代化军队。特雷司寇在全面评估了远东多山、多河谷与丛林密布的地理特征后认为，单纯依赖大规模装甲集群在许多地形复杂的战区难以施展；相比之下，德属东亚更应当充分发挥自身在航空技术、专业参谋作业与战术组织上的优势，建立一套陆空紧密配合、多兵种高度协同的合成化作战体系，以稳健而精准的联合作战击败对手。"
 GEA_Siloed_operations:0 "立体作战"
 GEA_Siloed_operations_desc:0 "在缺乏完善陆路交通网的远东战区，空中力量的支援往往能起到扭转战局的作用。特雷司寇致力于打破陆军与航空兵之间的军种壁垒，在各主力步兵师与独立旅中普遍设立配备专用无线电台的前线空地联络官，制定标准化的地面目标引导规程。通过这一改革，俯冲轰炸机、攻击机与战术侦察机能够实时响应地面部队的呼叫，对敌方纵深阵地、桥梁节点与集结地域实施精确打击，形成陆空一体的立体攻防态势。"
 GEA_Streamline_the_organization_structure:0 "精简编制"
 GEA_Streamline_the_organization_structure_desc:0 "沿袭自和平年代的殖民地驻军编制中，包含着大量重叠的行政管理部门、固定卫戍机关与非战斗勤务分队，不仅占用了宝贵的军官名额，也导致部队在野战环境下的展开速度较为迟缓。特雷司寇对现有师团编制进行了系统性的梳理与裁并，大幅压缩后方机关人员比例，将节省下来的兵员与预算充实到一线战斗营连，并简化了从战区司令部到前线各团的公文与指令传递层级，使整支军队的结构更加紧凑高效。"
 GEA_deep_into_the_earth:0 "深入恶土"
 GEA_deep_into_the_earth_desc:0 "远东战区广泛分布着热带雨林、红树林沼泽、湿热河谷与崎岖山地，常规部队在这些极端环境下作战时，往往因非战斗减员与道路不熟而陷入被动。为了使部队适应严酷的自然环境，总参谋部在马来亚与婆罗洲设立了专门的热带与山地战术训练中心，选拔体能优异的官兵组建轻装猎兵营。这些部队配备了轻便防水装具、工兵开路器材与近战火器，专门接受复杂地形下的定向越野、与渗透迂回。"
 GEA_Maintain_the_supply_line:0 "坚守补给线"
 GEA_Maintain_the_supply_line_desc:0 "在道路稀疏、气候多变的远东地区用兵，后勤补给线的畅通与否直接决定着战役的成败。特雷司寇将后勤保障提升至与前线作战同等重要的战略高度，不仅扩编了专业的汽车运输团、铁道工兵营与内河武装驳船队，还在主要交通沿线建立了分级设防的转运兵站与野战医院网络。同时，航空部队也开始尝试使用运输机向交通不便的偏远阵地空投弹药与奎宁等急需药品，以确保前线部队在任何恶劣条件下都能维持稳定的战斗力。"
 GEA_Depend_on_armored_artillery:0 "依赖装甲火炮"
 GEA_Depend_on_armored_artillery_desc:0 "在狭窄的道路、山地关隘或城镇攻坚战中，传统的马拉或卡车牵引火炮不仅展开耗时较长，而且炮兵阵地极易遭到敌方冷枪与迫击炮的反制。为了给一线步兵提供及时且可靠的直瞄火力支援，军械部门重点引进并列装三号突击炮等履带式装甲自行火炮。这类底盘低矮、防护良好的装甲火炮能够直接编入步兵突击群中协同推进，在近距离内精确摧毁敌方的机枪暗堡、野战工事与加固建筑。"
 GEA_Full_firepower_readiness:0 "充足火力准备"
 GEA_Full_firepower_readiness_desc:0 "鉴于德属东亚的兵员补充远不如亚洲大陆本土国家充裕，因此总参的作战条令中反复强调“以火力换取士兵生命”的原则。新修订的步炮协同准则明确规定，在发起任何营团级正面进攻之前，必须由师属榴弹炮群、重型迫击炮连以及配属的空中支援力量对敌方防御阵地进行周密的测距标定与集中火力准备。只有在敌方前沿工事、观察所与通信节点遭到充分压制后，地面步兵分队才会发起最后的冲击以占领阵地。"
 GEA_Durchbruchmuller_Legacy:0 "破阵穆勒的传承"
 GEA_Durchbruchmuller_Legacy_desc:0 "乔治·布鲁赫米勒，一位在第一次世界大战中表现优异的炮兵军官。他的作战风格强调在整个敌人阵地的纵深射击，从一个目标快速切换到另一个目标，然后再次返回，这需要对每门火炮进行严格、详细的控制，以最大限度地破坏防御者。他高超的战术设计与惊人的战果使他在整个一战战场上声名大振，并由此获得了“破阵穆勒”的威名。现在，我们将吸收并改进他的战术，并将它用在东亚战场上。相信我们会如同二十年前的破阵穆勒一样，给敌人带来惨痛的伤亡与莫大的震撼。"
 GEA_Flexible_organization:0 "灵活组织"
 GEA_Flexible_organization_desc:0 "在地形破碎、战线犬牙交错的远东战场上，前线形势瞬息万变，任何试图由后方司令部包揽一切战术细节的做法都难以奏效。总参谋部将大力重申普鲁士军事传统中的“任务式指挥”原则，在日常军官与士官培训中着重锻炼下级指挥员的独立判断能力。上级指挥官在作战中仅需明确阐述战术意图、任务目标与侧翼友军界限，而将具体的兵力配置与进攻路线交由一线连排长根据实地情况临机决断，从而大幅提升了部队的应变效率。"
 GEA_Battle_group_supremacy:0 "战斗群至上"
 GEA_Battle_group_supremacy_desc:0 "面对从海岸登陆、河谷穿插到要塞攻坚等迥然不同的作战任务，固定死板的传统步兵团编制往往显得不够灵活。总参谋部为此在各野战师中正式推广模块化的“战斗群（Kampfgruppe）”编组制度。战区指挥官可以根据当面敌情与地形特点，随时从步兵、装甲自行火炮、战斗工兵、防空炮及通信部队中抽调相应分队，临时混编为规模不等的合成战斗群，在任务完成后再行恢复建制，实现了战术资源的最优配置。"
 GEA_The_reconnaissance_scouts_are_all-knowing:0 "侦察猎兵无所不知"
 GEA_The_reconnaissance_scouts_are_all-knowing_desc:0 "准确的战场情报是一切精密作战计划与火力支援的前提。为了克服复杂地形与茂密植被对空中侦察造成的遮蔽，特雷司寇下令在各师团下辖的侦察营中组建专门的“侦察猎兵”连队。这些分队由熟悉当地地理气候、掌握多国语言的资深军士与向导组成，配备便携式无线电收发机与精密光学观测器材，专门负责在主力部队展开前渗透至敌方防线侧后，查明敌军兵力部署与炮兵阵地位置，并引导后方炮火与航空兵实施精准打击。"
 GEA_Modernize_military_equipment:0 "革新武备"
 GEA_Modernize_military_equipment_desc:0 "在过去很长一段时间里，德属东亚驻军的武器库中混杂着世界大战时期的旧式步枪、不同口径的缴获火炮以及早已过时的通信器材，不仅制约了部队的火力和机动表现，也给弹药补给与零件维修带来了诸多不便。随着全面军改步入正轨，海军部与总参谋部拨出专款，依托德国本土兵工企业的最新技术支持以及新加坡、青岛本地军工厂的扩产，为全军统一换装新式标准毛瑟卡宾枪、轻重机枪、制式野战火炮以及经过防潮防霉处理的热带野战装具与电台，使东亚驻军的装备水平全面向本土一线部队看齐。"
 GEA_The_Valkyrie_brandished_her_sharp_sword:0 "女武神挥舞利剑"
 GEA_The_Valkyrie_brandished_her_sharp_sword_desc:0 "经过总参谋部少壮派军官团持续数年的系统整顿、学说革新与装备换代，德属东亚武装力量已彻底褪去了往昔殖民地二线守备队的陈旧面貌。如今驻防于南洋与东亚各基地的帝国军队，不仅拥有指挥高效的现代参谋体系、训练有素的职业军官与士兵骨干，更建立起了适应远东特殊地理环境的机械化突击力量与陆空立体协同网络。这柄在远东重新锻造并磨砺成型的德意志利剑已然出鞘，随时准备捍卫帝国在太平洋与亚洲大陆的每一寸利益与疆土。"
 GEA_planning_before_taking_action:0 "谋定而后动"
 GEA_planning_before_taking_action_desc:0 "保守改革派代表人物迪特里希·冯·邵肯将军主张通过改革总参谋部，从上至下地强化并引导德属东亚军队的现代化转型。出身东普鲁士军人世家的邵肯深知，远东战区各防区之间交通不便、战略预备队极其有限，任何缺乏周密计算的鲁莽行动都可能使整条防线陷入被动。为此，他要求各级参谋机构在制定作战方案时必须坚持“谋定而后动”的准则，将详细地军事计划与多套预案准备置于一切军事行动的首位。"
 GEA_Upgrading_of_combat_theory:0 "作战理论升级"
 GEA_Upgrading_of_combat_theory_desc:0 "坚守总参谋部的传统并不意味着固步自封。在邵肯将军的主持下，总参谋部战术研究室系统整理了世界大战后期以来各主要战场的实战档案，并结合远东热带丛林的特殊环境，对现行的野战条令进行了全面修订。升级后的作战理论在保留德军传统严密步炮协同框架的同时，进一步细化了各兵种在不同地形条件下的展开队形、火力配系与阶段性推进指标，使传统战术得以适应现代战场的要求。"
 GEA_A_well-organized_chain_of_command:0 "整顿指挥链条"
 GEA_A_well-organized_chain_of_command_desc:0 "过去数十年间，德属东亚各防区的驻军往往根据当地需要临时增设指挥机构，导致各要塞司令部、海军警备区与野战营团之间权责交叉、政令不一。总参谋部通过实施严格的建制标准化改革，理顺了从新加坡最高统帅部、各战区分舰队及陆军分区直至基层连队的垂直指挥链条。明确划分的防区边界与统一的电报通信规程，确保了上级的每一道作战指令都能迅速、准确地传达到最前线的战斗单位。"
 GEA_Everyone_fulfills_their_duties_conscientiously:0 "人人恪尽职守"
 GEA_Everyone_fulfills_their_duties_conscientiously_desc:0 "一支军队的真正战斗力，不仅取决于统帅部的宏伟规划，更体现在每一名军官、士官与普通士兵对日常职责的严格履行上。邵肯将军在全军范围内大力整肃军纪并逐渐建立起权责分明的岗位考核与定期巡视制度。无论是基层的无线电报务员，还是后勤部的军需官，抑或是前线的小小的步兵班长，都被要求严格按照操典标准完成本职任务，从而保证整部军事机器在面临战时高压时依然能够平稳运转。"
 GEA_Reorganize_the_General_Staff_Department:0 "改组总参谋部"
 GEA_Reorganize_the_General_Staff_Department_desc:0 "随着远东防务范围的扩大与常备师团的扩编，原有编制狭小的殖民地参谋处已难以承担多处战区的繁重公务。邵肯将军参照柏林大总参谋部的成熟架构，对新加坡总参谋部进行了深度改组，正式细化了作战、情报、铁道与海运调度、军需补给以及地形测绘等专业处室的职能分工。同时，当局还在新加坡设立了高级参谋进修班，定期抽调各防区优秀军官接受规范的参谋作业训练，全面充实了各级司令部的中坚力量。"
 GEA_Coordinate_the_broad_front_of_the_conflict:0 "协调宽大战线"
 GEA_Coordinate_the_broad_front_of_the_conflict_desc:0 "德属东亚的防卫战线横跨中南半岛、马来群岛与中国沿海商埠，战线宽度动辄绵延数千公里，任何单一方向的冒进或失守都会牵动全局。改组后的总参谋部重点强化了对宽大战线的统筹协调能力，通过铺设跨战区的海底电缆、有线电话网与大功率无线电中继站，实现了多路野战集群在统一时间表下的协同行动。即便各作战分群在地理上相隔甚远，依然能够围绕总体战略意图互相策应，稳步推进战线。"
 GEA_Carefully_plan_boldly_innovate:0 "谨慎计划，大胆突破"
 GEA_Carefully_plan_boldly_innovate_desc:0 "邵肯常向麾下参谋强调，周密的战前计划并非为了束缚前线将领的进取心，而是为了给关键时刻的决定性突击提供坚实保障。在这一原则指导下，德属东亚军队在战役筹备阶段力求将一切意外因素降至最低；而在战役打响、敌方阵线显露破绽的瞬间，前线指挥官则被要求果断投入全部预备队，以大胆而迅猛的纵深穿插撕裂敌军防线，将精细谋划转化为战场胜势。"
 GEA_The_victory_of_willpower:0 "意志的胜利"
 GEA_The_victory_of_willpower_desc:0 "强硬的军国主义者费迪南德·舍尔纳将军决心不惜一切代价，把德属东亚的军队淬炼成能够应对一场全面世界大战的铁与血之军。在舍尔纳看来，远东战场环境恶劣、补给困难且潜在敌军在兵力数量上占据绝对优势，过度依赖精密复杂的机械化装备极易在持久消耗战中陷入瘫痪。他主张通过最为严格的军事纪律、极限体能训练与毫无保留的总体战动员，激发全体官兵压倒一切困苦的顽强意志，用铁与血的韧性粉碎任何来犯之敌。"
 GEA_Push_forward_at_all_costs:0 "不惜代价的前进"
 GEA_Push_forward_at_all_costs_desc:0 "在舍尔纳确立的作战条令中，任何因山林阻隔、热带暴雨或侧翼受威胁而擅自放缓进攻步伐的行为，都将受到严厉追究。他坚信战场上的犹豫与停顿往往比强攻造成更大的伤亡，唯有保持昼夜不停的连续压迫，才能在心理和组织上彻底击垮对手。为此，各主力步兵团均强化了恶劣天候下的强行军与连续攻坚训练，要求官兵即使在重武器支援滞后、口粮受限的困境中，依然能够凭借坚韧的毅力按时夺取预定阵地。"
 GEA_Hunter_Raid:0 "猎兵破袭"
 GEA_Hunter_Raid_desc:0 "曾作为山地猎兵军官在世界大战伊松佐河与阿尔卑斯山脉战线崭露头角的舍尔纳，对精锐轻步兵的穿插破袭战术有着深刻理解。针对远东多山林、多水网的复杂地貌，他在各野战师内部重点编组了精干的“猎兵突击营”。这些部队摆脱了对笨重车队与硬化公路的依赖，擅长利用夜色、季风降雨或密林掩护，携带轻便自动武器与爆破器材翻越险峻山岭，突然出现在敌方防线侧后，对其指挥节点与补给线实施致命破袭。"
 GEA_Retreating_means_cowardice_and_cowardice_means_death:0 "后退即怯懦，怯懦即死亡"
 GEA_Retreating_means_cowardice_and_cowardice_means_death_desc:0 "对于孤悬海外的德属东亚而言，许多关键海港、海峡要塞与内陆交通枢纽一旦失守便再无战略退路可言。为了杜绝防线在敌军优势兵力猛攻下发生动摇，舍尔纳颁布了极为严厉的战地军法，明确规定除获得战区最高统帅部的书面许可外，任何部队均须在现阵地坚守到底。通过强化各级指挥官的连带责任与阵地督战机制，整支军队被灌输了“死守阵地、绝不后退”的铁律，使每一处防守据点都成为令敌军寸步难行的坚固堡垒。"
 GEA_The_last_line_of_defense_of_the_world_empire:0 "世界帝国的最后一道防线"
 GEA_The_last_line_of_defense_of_the_world_empire_desc:0 "从马六甲海峡到胶州湾，德属东亚扼守着德意志世界帝国在印度洋与太平洋之间的海上命脉。舍尔纳在训令中反复指出，远东驻军正是拱卫帝国东方疆域的最后一道屏障，身后即是关乎帝国殖民版图兴废的远洋航道与海外基业。围绕这一战略定位，当局动员了大批工兵与劳工队伍，在各主要半岛、海峡要冲及陆上边境修筑起纵深交错的钢筋混凝土暗堡群、反坦克壕与地下弹药库，将整片辖区要塞化。"
 GEA_Schorner_secret_forces:0 "舍尔纳的秘密部队"
 GEA_Schorner_secret_forces_desc:0 "为了确保严苛的统帅部军令在漫长战线的每一个角落得到贯彻，并有效肃清防区后方的治安隐患，舍尔纳直接组建了一支直属于其个人指挥部、独立于常规驻军体系之外的特别战地宪兵与反游击支队。这支精锐力量拥有广泛的战时特别纠察权，对内负责巡查前线军纪、整编失散兵员并严惩失职行为，对外则专门搜捕潜入防区后方的敌方侦察分队与地下破坏分子，以强硬手腕维护战区的绝对稳定。"
 GEA_Everyone_serves_until_death:0 "人人服役，效力至死"
 GEA_Everyone_serves_until_death_desc:0 "在潜在的全面大战威胁面前，和平年代宽松的兵役豁免与服役年限已不再适用。在舍尔纳的强力推动下，殖民地当局颁布了最为彻底的战时总动员法令，不仅将远东所有适龄德裔侨民乃至退伍老兵悉数编入现役或地方防卫营，还大幅扩大了各保护国与殖民地本土居民的征召比例。从后方兵工厂到前线散兵坑，所有人力资源都被纳入严格的军事化管理之下，以确保前线部队在旷日持久的消耗战中拥有源源不断的兵员补充。"
 GEA_Implement_flexible_defense_tactics:0 "实践弹性防御战术"
 GEA_Implement_flexible_defense_tactics_desc:0 "世界大战西线后期的防御战经验表明，将全部兵力密集部署在第一道堑壕内，极易在敌方优势炮火准备下蒙受惨重损失。总参谋部结合远东防区纵深广阔的特点，在全军推广系统化的“弹性防御”战术：前沿警戒地带仅配置少量依托地形隐蔽的机枪组与炮兵观察员，用以消耗敌军冲击势头并将其引入预设的交叉火网；当敌方进攻部队在突破表层阵地后陷入疲敝与队形混乱时，隐蔽在后方主防御带的我军预备队便会适时发起反击，一举恢复原阵地。"
 GEA_Carry_forward_the_Hutier_tactic:0 "发扬胡蒂尔战术"
 GEA_Carry_forward_the_Hutier_tactic_desc:0 "曾助我军在1918年春季攻势中打破堑壕僵局的“胡蒂尔渗透战术”，在经过远东总参谋部的现代化改良后得到了广泛传承。我军彻底摒弃了刻板的线性波次冲锋，转而以配备冲锋枪、轻机枪、轻型迫击炮与火焰喷射器的暴风突击队作为进攻先锋。在简短而精准的炮火急袭后，这些突击群将迅速利用地形死角渗入敌军防线薄弱处，绕过正面的坚固支撑点，直接瓦解敌方的后方指挥所与炮兵阵地，为后续主力步兵师的全面推进打开缺口。"
 GEA_Command_supremacy:0 "命令至上"
 GEA_Command_supremacy_desc:0 "无论是邵肯所倚重的严密参谋计划，还是舍尔纳所推崇的铁血意志，其得以运转的根本前提都在于军令的绝对权威。通过修订战地法典并整肃各级军官团的服从意识，总参谋部在全军上下强化了命令至上的组织原则。从师团参谋长到前线步兵班长，任何人均须严格按照既定时间表与作战命令执行任务；高度统一的号令与严明的上下级纪律，使德属东亚军队在面临最严峻的战场危机时依然能够保持严整的建制。"
 GEA_Rolling_floodwaters:0 "滚滚洪流"
 GEA_Rolling_floodwaters_desc:0 "当全区的动员机制全面运转、扩编后的数十个正规步兵师与殖民地辅助兵团完成集结之时，德属东亚陆军已不再是往昔那支只能被动防守孤立港口的警备部队。依托周密的铁路、内河与海运调度网络，庞大的步兵纵队、重炮兵团与突击猎兵将按照总参谋部精确到小时的推进时间表，如滚滚洪流般源源不断地压向敌方战线。在如此严密组织起来的大兵团梯次进攻面前，任何企图凭局部防线负隅顽抗的对手都将被彻底击溃。"
 GEA_Play_the_symphony_of_war:0 "奏响战争交响乐"
 GEA_Play_the_symphony_of_war_desc:0 "现代大兵团会战犹如一场规模宏大的交响乐，唯有各个兵种在总参谋部的精密指挥下严丝合缝地配合，方能发挥出最大的杀伤效能。随着新版多兵种协同作战条令的全面落实，我军的重型榴弹炮群、徐进弹幕、前线工兵破障分队、无线电通信网以及伴随推进的步兵主力实现了高度同步。炮火延伸的每一分钟都与步兵跃进的步伐精确吻合，将德意志军事工业的雄厚火力转化为了战场上秩序井然的推进节奏。"
 GEA_The_military_art_of_the_new_era:0 "新时代的军事艺术"
 GEA_The_military_art_of_the_new_era_desc:0 "通过在坚守普鲁士经典军事传统的基础上全面吸收现代战争的技术与组织成果，德属东亚总参谋部成功完成了一场自上而下的深刻变革。我们既保留了久经考验如今亦行之有效的严密参谋作业体系与风暴突击队传统，又将其与现代化的无线电指挥与火力协同乃至总体战动员融为一体。如今，德属东亚陆军已成为经典大兵团战役法则在新时代的成熟典范，足以在任何一场全面战争中捍卫德意志帝国的远东疆土。"
#印度支那战争国策
 GEA_The_Far_East_is_at_war_again:0 "远东再陷战火"
 GEA_The_Far_East_is_at_war_again_desc:0 "自1926年干涉中国北伐结束以来，德属东亚享有了近十年的相对和平，然而湄公河三角洲与交趾支那爆发的大规模武装暴动彻底打破了这一平静。长期潜伏于丛林与乡野的越南民族主义者及工团主义游击队趁殖民地财政紧缩之机全面起事，袭击警察哨所、切断南北铁路并围困西贡周边据点。面对这场席卷中南半岛的叛乱，新加坡的殖民政府已正式宣布进入战时状态，调集海陆兵力全力扑灭这场威胁帝国远东统治根基的战火。"
 GEA_Innovate_and_renew:0 "推陈出新"
 GEA_Innovate_and_renew_desc:0 "印支战场的初期交火表明，沿用自欧洲平原战场的密集队列与常规行军规程，在湿热茂密的热带雨林和纵横交错的稻田水网中极易遭到叛军伏击。为了扭转前线部队的战术被动，前线司令部根据实战教训要求各步兵营彻底改变传统的驻防习惯，以排连规模的轻装巡逻队、河道装甲汽艇与无线电机动哨取代笨重的行军纵队。与此同时，军械研发部门也将根据前线的回报与反馈，力图将士兵手中的军械改进到最为适合远东战场的武器。"
 GEA_Fear_and_Discipline:0 "恐惧与纪律"
 GEA_Fear_and_Discipline_desc:0 "在难辨敌我的丛林治安战中，无处不在的冷枪、竹签陷阱与热带疫病正不断侵蚀着前线驻军的士气，而部分当地村落的暗中资敌更令清剿行动举步维艰。统帅部认为，唯有依靠比丛林更加严酷的纪律才能维持战线稳定。通过向前线派驻战地军法处与宪兵，当局一方面以严刑峻法整肃前线部队的畏战与违纪现象，另一方面对窝藏叛军、破坏交通线的村镇实施严厉的连坐管制，试图以高压震慑切断地方民众与游击队的联系。"
 GEA_Improve_the_design_of_weapons:0 "改进武器设计"
 GEA_Improve_the_design_of_weapons_desc:0 "交趾支那与安南山脉长年累月的高温高湿气候，使许多精密的标准德式步兵武器频繁出现锈蚀、卡壳与木托变形等故障，而修长的旧式步枪在能见度极低的密林遭遇战中也显得施展不便。为此，新加坡与河内的军械技师将对现役武器展开针对性改良。不仅为步枪与机枪引入防锈涂层和密封防潮弹药箱，还加快了短管卡宾枪与冲锋枪等近距离交火武器的配发速度，使前线官兵在近距离丛林交火中占据火力优势。"
 GEA_Wave_Defense:0 "波浪防御"
 GEA_Wave_Defense_desc:0 "针对越工惯用的夜间渗透与多波次近迫突袭战术，参谋部门设计了一套被称为“波浪防御”的纵深筑城体系。守军不再试图平均驻防漫长的交通线，而是围绕公路交叉口、桥梁与内河码头构筑互为犄角的环形据点群。每一处核心阵地通过多层铁丝网、照明绊雷与预设机枪阵地，如同一道道防波堤般逐层迟滞并消耗叛军的冲锋浪潮，待敌军攻势衰竭后再由邻近据点的机动预备队实施反击合围。"
 GEA_Encouraging_the_dying_person:0 "驱策将死之人"
 GEA_Encouraging_the_dying_person_desc:0 "随着丛林拉锯战的持续，军事监狱中关押的叛军战俘、违抗军令的逃兵以及各类重刑犯人数日益增多，不仅消耗着宝贵的后勤口粮，也占用了大量看守兵力。在战区军法处的命令下，当局将这些本来面临极刑或长期苦役的囚犯集中编组为特殊“惩戒营”，在宪兵机枪的督战下派往最危险的地段，承担开辟雷场通路、抢修前线工事与吸引敌方暗堡火力的敢死任务。"
 GEA_Blockade_of_the_ocean:0 "封锁大洋"
 GEA_Blockade_of_the_ocean_desc:0 "印支起义军之所以能够在缺乏本土重工业的情况下维持高强度作战，很大程度上依赖于从海上源源不断输入的外援军火——来自海外工团主义国家与华南激进势力的走私船只，正借着夜色与季风频繁在湄公河口及暹罗湾沿岸秘密卸货。为了彻底斩断叛军的海外输血通道，德属东亚海军出动大批轻巡洋舰、驱逐舰与内河炮艇，配合水上飞机对整个印度支那海岸线实施全天候严密封锁，凡遇拒绝停船受检的可疑船只均一律予以扣押或击沉。"
 GEA_Seek_assistance_from_the_fatherland:0 "求援本土"
 GEA_Seek_assistance_from_the_fatherland_desc:0 "尽管德属东亚拥有远东首屈一指的海军舰队，但殖民地陆军与军工产能的底子终究有限，在同时维持华东商埠警备、马来亚防务与印支大规模清剿时已渐显吃力。为此，新加坡总督府将正式向柏林帝国海军部与最高统帅部求援，详陈印支得失对帝国橡胶、钨、铬等战略金属供应及外交威信的重大影响，请求本土在财政拨款、军火物资与专业参谋人员上给予紧急支援，以尽快平息这场殖民地叛乱。"
 GEA_Emergency_ammunition:0 "紧急军火"
 GEA_Emergency_ammunition_desc:0 "热带丛林中的高密度火力压制与据点防御战，使前线部队的弹药消耗速度远远超出了和平时期的后勤预估。在柏林海军部的特批调度下，数艘满载毛瑟步枪、轻重机枪、迫击炮弹及野战通信器材的武装运输船已日夜兼程穿过苏伊士运河与马六甲海峡，直接将在海防与金兰湾码头靠泊。很快凭借这批紧急支援的军火，我们将全线展开一场反攻，将越工赶回他们的丛林老窝之中。"
 GEA_The_Siege_of_Saigon:0 "西贡远征"
 GEA_The_Siege_of_Saigon_desc:0 "作为交趾支那的经济中心与南方最重要的深水良港，西贡自叛乱爆发之初便处于起义军主力的控制之下。为了夺回南圻战场的绝对主动权，总参谋部集结了新近整训的精锐海军步兵旅与野战机动师，在远东舰队巡洋舰编队的抵近舰炮掩护下，准备发起一场声势浩大的“远征”。而在正面战场上殖民军主力也将开始一次大规模佯攻，以牵制住越工的军队主力难以分兵回救。"
 GEA_The_camaraderie_with_the_Dark_Continent:0 "同黑暗大陆的同僚情谊"
 GEA_The_camaraderie_with_the_Dark_Continent_desc:0 "在地球另一端的“黑暗大陆”，德属中非的殖民地驻军同样常年在广袤的热带雨林、稀树草原与湿热河谷中与各类地方叛军周旋，积累了极为丰富的热带特种作战与殖民地治安管理经验。借由殖民办公厅的穿针引线，新加坡与达累斯萨拉姆将建立紧密的同僚协作机制。而面对如此困局，我们需要向中央非洲的同僚们寻求人员与物资的双重支援，以确保德意志殖民版图最重要的两处殖民地之一不会落入工团分子之手。"
 GEA_Invitation_to_Hunters:0 "邀请猎手"
 GEA_Invitation_to_Hunters_desc:0 "对于习惯了正规阵地战的普通欧洲士兵而言，危机四伏的热带雨林往往令人望而生畏，但在经验丰富的非洲殖民地猎兵眼中，这里却是最熟悉的猎场。在德属中非当局的协助下，一批曾在刚果盆地与东非丛林中服役多年、精通野地追踪与反伏击战术的精英“猎手”军官与资深军士应邀抵达印度支那。他们不仅将直接率领侦察分队深入红河与湄公河沿岸密林搜捕叛匪，还可以作为教官向东亚驻军传授在热带中追踪与求生的实战技巧。"
 GEA_Eliminate_the_hiding_place:0 "荡平藏身处"
 GEA_Eliminate_the_hiding_place_desc:0 "只要游击队还能在交战后退入茂密的原始雨林、地下坑道与红树林沼泽中休整补充，单纯的道路巡逻便永远无法彻底平息叛乱。通过侦察猎兵与航空侦察机锁定叛军秘密营地的坐标后，前线部队就可以发起系统性的清剿行动。通过燃烧弹，除草剂甚至毒气，我军定能将那些潜藏在丛林中尝试将我们拖进漫长的游击与治安战的赤色匪徒们尽数杀光。"
 GEA_self_dependence:0 "自力更生"
 GEA_self_dependence_desc:0 "受“黑色星期一”经济海啸的严重冲击，柏林帝国政府正忙于应对国内的财政赤字与欧洲大陆的紧张局势，短期内难以向远东投送大规模增援。面对这一现实，德属东亚当局决定放下对本土输血的依赖，依靠本地资源与财政来应对印支危机。总督紧急动员了新加坡、槟城与青岛的造船厂和军械工坊，并联合通用东亚公司将部分民用机械厂转产军需物资，力求凭借远东殖民地自身的工业潜力与财政储备独立支撑起平叛大局。"
 GEA_Recruit_all_available_soldiers:0 "征发一切可用之兵"
 GEA_Recruit_all_available_soldiers_desc:0 "要在广袤的印度支那全面铺开清剿网络，仅靠人数有限的德意志海军步兵是远远不够的。本着实用主义原则，殖民地当局大幅放宽了战时招募标准：除了紧急扩编效忠于顺化阮朝皇室、金边与琅勃拉邦王室的保护国保安团外，当局还向敌视工团主义的当地宗教社团、高地少数民族部落武装乃至流落远东的外籍雇佣兵发放武器与军饷，将一切反对赤色叛乱的武装力量整合进平叛战线之中。"
 GEA_Never_repeat_the_mistake:0 "绝不重蹈覆辙"
 GEA_Never_repeat_the_mistake_desc:0 "叛乱爆发初期的数次失利，暴露出了旧殖民地驻军在情报共享、行军警戒与据点联防上的严重疏漏——孤军深入的巡逻分队曾屡次因无线电联络中断而落入叛军预设的伏击圈。为确保全军绝不重蹈覆辙，总参谋部对前期战例进行了系统的复盘检讨，强制要求所有出击部队必须保持严密的侧翼搜索与定时无线电联络。此外，通过派驻在前线的专业军官与无线电联络班组，总参谋部也将可以以最快速度收到有关越工战术与行动的情报，并立刻做出应对措施。"
 GEA_Fight_to_the_death:0 "殊死一搏"
 GEA_Fight_to_the_death_desc:0 "随着印支战局进入决定性的白热化阶段，无论是盘踞丛林的起义军主力还是严阵以待的东亚驻军，都已到了退无可退的关头。总参谋部与前线统帅部向全军下达了破釜沉舟的总攻训令，将后方文职机关人员、休整预备队乃至舰队陆战水兵悉数编入一线战斗序列。在这场关乎德意志远东霸权存续的殊死较量中，每一名帝国官兵都清楚，唯有在正面的高强度较量中彻底压倒对手，才能保住帝国在亚洲数十年的经营成果。"
 GEA_Desertion_Law:0 "焦土法令"
 GEA_Desertion_Law_desc:0 "在战线犬牙交错、部分内陆防区面临合围威胁的严峻局势下，统帅部决意不给起义军留下任何可供利用的战争潜力。根据新签署的战区焦土法令，凡我军因战略调整而暂时撤离的城镇与乡村，随军工兵必须彻底炸毁无法带走的铁路桥梁、内河船闸、发电站与矿山巷道，并将沿途未能及时转运的稻谷储备与物资库存悉数付之一炬。即使不得不暂时让出部分防区，留给叛军的也只能是一片无法维持大军补给的焦土。"
 GEA_Organize_industrial_relocation:0 "组织工业撤退"
 GEA_Organize_industrial_relocation_desc:0 "为了防止印度支那各主要城市的近代化工业设施在战火中损毁或落入叛军之手，海军运输部门与殖民地经济署联合启动了大规模的工业撤退行动。在东亚舰队驱逐舰的护航下，大批货轮紧急停靠北方港口，昼夜不停地将兵工机床、精炼设备、橡胶与锡锭库存以及熟练的技工团队拆卸装船，安全转移至防务稳固的新加坡、马来亚半岛及胶州湾基地，为德属东亚保存住长期作战与日后反攻的核心工业命脉。"
 GEA_Berlin_intervention:0 "柏林干涉"
 GEA_Berlin_intervention_desc:0 "印度支那战事的旷日持久与惨烈程度最终震动了威廉街与帝国最高统帅部。为了防止远东殖民地的动荡演变为动摇整个帝国公约的战略危机，柏林决定打破此前的有限支援政策，对印支战局实施直接军事干预。随着满载德国本土正规陆军师团、空军轰炸机联队与重型野战火炮的远洋船队驶入南中国海，帝国本土的雄厚军事力量已正式压上远东天平，以绝对的实力优势协助东亚驻军终结这场叛乱。"
 #外交
 GEA_Fleet_departure:0 "舰队离港"
 GEA_Fleet_departure_desc:0 "新加坡的海军码头上，蒸汽与煤烟再次笼罩了整片港区。随着远东舰队的舰艇陆续完成补给，殖民地海军司令部已经开始筹划一系列规模更大的远洋行动。长久以来，德国在亚洲的海军力量始终以保护贸易、巡逻航线及维持殖民地治安为主要职责，但仅仅满足于守卫既有领土，显然不足以确保帝国在东方的长久霸权。我们将扩大舰队的远洋部署，加强对周边海域的侦察，并以实际行动向各国证明，德意志帝国的海军绝不会永远停泊在新加坡港内。"
 GEA_Burst_the_illusions_of_the_exiles:0 "戳破流亡者的迷梦"
 GEA_Burst_the_illusions_of_the_exiles_desc:0 "尽管大英帝国早已失去了昔日的荣光，但那些寄居于渥太华的英国流亡者却仍然不愿承认自己已经不再是世界海洋的主人。在他们的幻想中，皇家海军终有一天会重新驶入伦敦，而那些在世界大战后被德国夺取的亚洲殖民地，也理应重新回到英国王冠之下。澳大拉西亚的政客与海军军官同样不乏这种念头，甚至将德国在南洋的存在视作暂时的历史错误。德意志绝不能容许这些旧帝国的遗民继续抱有如此危险的幻想。"
 GEA_Save_Leichhardt:0 "拯救莱希哈特"
 GEA_Save_Leichhardt_desc:0 "1848年，普鲁士探险家路德维希·莱希哈特率领一支探险队深入澳大利亚内陆，试图完成横穿这片广袤大陆的壮举，却从此消失在无人知晓的荒野之中。他的失踪成为德国探险史上最著名的谜团之一，也使澳大利亚这片遥远的土地同德意志民族的冒险精神产生了某种特殊联系。近一个世纪过去，莱希哈特的遗骨或许早已埋葬于荒漠之下，但他的名字仍然值得帝国铭记。我们将以纪念德国探险先驱、保护德裔居民及维护德国在澳大利亚的历史遗产为由干涉澳大拉西亚事务。"
 GEA_The_unfinished_business_of_forty_years:0 "四十年的未竟之事"
 GEA_The_unfinished_business_of_forty_years_desc:0 "1898年，当美西战争的炮火传至菲律宾群岛时，德意志帝国曾一度距离获得这片富饶的东方殖民地仅有一步之遥。然而，美国海军准将乔治·杜威显然不准备容忍德国人染指自己的战利品，两国舰队在马尼拉湾的紧张对峙最终迫使柏林放弃了这一野心。近四十年过去，世界大战的胜利已经使德国成为远东最强大的殖民列强之一，但菲律宾群岛却依然游离于帝国的控制之外。这片扼守南中国海与西太平洋通路的群岛，不仅拥有重要的港口与丰富的资源，更能够成为连接德属东亚与太平洋属地的战略支点。如今，德国远东舰队已经不再是当年那支只能在美国人面前无功而返的海外分舰队，而帝国也终于有能力重新考虑这桩悬而未决的殖民事业。"
 GEA_Lisbon_Hotline:0 "里斯本热线"
 GEA_Lisbon_Hotline_desc:0 "葡萄牙曾经是欧洲海外扩张的先驱者，其商船与传教士早在德意志帝国诞生数百年前便已抵达东方。然而，那个曾经统治着庞大海上帝国的国家如今早已衰落，留在澳门与东帝汶的殖民机构不过是昔日荣光的残余。对于德属东亚而言，这两处葡萄牙殖民地却拥有不容忽视的战略价值：澳门位于珠江口，紧邻中国最重要的商业地区之一，而东帝汶则处于连接印度洋与太平洋的南洋航路之上。如今我们没有理由继续容忍这些重要据点掌握在一个无力独自保卫它们的欧洲小国手中。"
 GEA_Taking_care_of_the_back_garden:0 "清理后花园杂草"
 GEA_Taking_care_of_the_back_garden_desc:0 "印度支那战争的失败，已经成为德属东亚殖民史上最为严重的灾难之一。帝国军队被迫撤离那些曾经属于德国的城市与种植园，昔日的殖民行政机构土崩瓦解，而获胜的越南革命势力则将这场胜利视为彻底摆脱欧洲统治的开端。对于德属东亚的军官、商人及殖民官僚来说，失去这片土地不仅意味着庞大的经济损失，更意味着帝国在整个东南亚的权威遭到了前所未有的挑战。倘若德国不能挽回这场失败，那么马来亚与新加坡的其他反殖民势力也可能因此受到鼓舞。我们将重新集结残存的远东部队，从德国本土寻求必要的军事援助，并对印度支那的政治与军事局势展开全面调查，为重新夺回失地做好准备。"
 GEA_Interfering_in_the_chaos_in_South_Asia:0 "干涉南亚乱局"
 GEA_Interfering_in_the_chaos_in_South_Asia_desc:0 "大英帝国在印度统治体系的崩溃，使这片拥有庞大人口与丰富资源的次大陆陷入了前所未有的政治分裂。各地王公、民族主义政府与亲英势力围绕合法性和领土展开争夺，而英国流亡政权仍然试图通过残存的印度盟友恢复昔日影响。对于德属东亚而言，这场乱局既意味着潜在的贸易风险，也带来了扩大德国政治与经济影响力的机会。我们将寻找愿意与德国合作的地方政权，并通过贸易、贷款与军事顾问扩大自身的影响。"
 GEA_Traversing_the_Roof_of_the_World:0 "跋涉世界屋脊"
 GEA_Traversing_the_Roof_of_the_World_desc:0 "从喜马拉雅山脉到西藏高原，世界屋脊始终是亚洲最难以穿越、也最富有战略意义的地区之一。长期以来，英国与俄国曾围绕这些高山边疆展开激烈的外交竞争，而德意志帝国却始终缺乏直接参与当地事务的机会。如今，随着印度的政治格局发生巨变，德国或许终于能够通过探险、贸易与外交活动进入这片长期由其他列强主导的地区。我们将派出特使前往世界屋脊，并寻求同当地统治者建立联系。。"
 GEA_Taking_care_of_peacocks:0 "照料孔雀"
 GEA_Taking_care_of_peacocks_desc:0 "自大英帝国在亚洲的殖民体系分崩离析以来，缅甸便始终处于各方势力相互角逐的复杂局势之中。这个曾经被英国人征服的古老王国，如今不仅需要应对内部的政治分歧与地方武装，还必须时刻警惕来自暹罗及其他邻国的威胁。对于德属东亚而言，一个愿意同德国合作的缅甸政权，无疑能够成为维护中南半岛西部稳定、保障印度洋贸易航线的重要伙伴。我们将通过外交渠道向缅甸政府提供援助与必要的技术支持，并协助其改善军队训练及行政管理。与此同时，德国企业也将获得参与当地基础设施建设与资源开发的机会，使双方的合作建立在更加稳固的经济基础之上。当然，这些援助并非毫无条件的慷慨馈赠，缅甸政府必须充分考虑德国在中南半岛的战略利益，并在重大地区事务中同总督府保持协调。"
 GEA_Helfer_final_expedition:0 "黑尔弗的最后远征"
 GEA_Helfer_final_expedition_desc:0 "近一个世纪以前，德语区博物学家约翰·威廉·黑尔弗曾深入缅甸南部与丹那沙林地区，试图揭开这片东方土地的自然与地理奥秘，最终却在安达曼群岛的考察途中意外丧生。他所留下的旅行记录，成为德国人早期了解缅甸及其周边地区的重要资料。\n\n如今的德意志帝国却拥有足以改变整个中南半岛政治格局的军事力量。随着缅甸局势不断动荡，其漫长的海岸线、丰富的自然资源及通往印度洋的战略位置，已经引起远东海军与殖民地行政部门的密切关注。我们将重新评估对缅甸采取军事行动的可能性，并利用当地政治分裂为帝国争取有利条件。"
 GEA_Mediating_the_Siam-Myanmar_War:0 "调停暹缅战争"
 GEA_Mediating_the_Siam-Myanmar_War_desc:0 "暹罗与缅甸之间的军事冲突，正在威胁整个中南半岛的政治稳定。双方围绕边境、地方势力及传统领土问题争执不休，而战争一旦进一步扩大，德属东亚在马来半岛与印度支那的贸易利益也可能受到波及。总督认为德国不能任由这场战争继续破坏区域秩序，更不能允许其他列强借机扩大自己的影响力。我们将向交战双方提出调停建议，利用外交压力与经济利益促使其接受停火，并争取在未来的和平安排中发挥重要作用。当然，所谓中立调停绝不意味着德国没有自己的利益。只要能够在谈判桌上取得足够的政治筹码，这场原本属于暹罗与缅甸的战争，最终也可能成为扩大帝国远东影响力的重要机会。"
 GEA_Operation_Eulenburg:0 "欧伦堡行动"
 GEA_Operation_Eulenburg_desc:0 "1860年，普鲁士曾派遣由弗里德里希·阿尔布雷希特·祖·欧伦堡伯爵率领的外交使团远赴亚洲，并先后同日本、中国及暹罗建立正式的商业与外交联系。那时的普鲁士尚未完成德意志统一，只能依靠外交谈判为本国商人争取进入东方市场的机会；然而，近八十年后的今天，德意志帝国早已成为东南亚最强大的殖民列强之一。暹罗虽然长期依靠巧妙的外交手段维持自身独立，却始终是德国控制中南半岛的重要障碍，其军队与政府对于周边领土的野心也不断威胁着帝国的地区利益。我们已经没有必要继续满足于那些缺乏实际约束力的贸易协定与外交保证。欧伦堡伯爵当年为普鲁士打开了通往曼谷的外交大门，而今日的德国军队则将一脚踹碎这块障碍。"
 GEA_Test_the_sea_charioteer:0 "再叙亲戚之谊"
 GEA_Test_the_sea_charioteer_desc:0 "霍亨索伦家族与荷兰王室之间的关系，远比普通的外交礼节更加亲近。荷兰女王威廉明娜的丈夫亨德里克亲王出身梅克伦堡-什未林家族，而德国与荷兰上层贵族之间的婚姻、商业及社会联系，也早已延续了数代。尽管两国对于南洋殖民利益的看法并不总是一致，但这层亲缘关系仍然为双方的政治接触提供了便利。德属东亚将鼓励柏林利用宫廷外交重新加强同荷兰王室的联系，并通过商界与贵族之间的私人渠道，争取改善两国在东印度群岛的合作关系。"
 GEA_The_Hague_Arbitration:0 "海牙仲裁"
 GEA_The_Hague_Arbitration_desc:0 "德国与荷兰在南洋的殖民地之间，始终存在着复杂的商业竞争与海上权益问题。从岛屿周边的领海划分，到商船航行、资源开发及港口使用，各种看似细微的争端都可能随着殖民地经济规模的扩大而逐渐演变成严重的外交冲突。然而，直接诉诸武力不仅可能破坏德国同荷兰的传统关系，也会使其他列强获得干涉南洋事务的机会。总督府将争取通过海牙的国际仲裁机制解决部分争议，并利用德国在国际外交与法律事务中的影响力，为自身的殖民利益寻求更加稳固的法律保障。"
 GEA_Work_together_side_by_side:0 "携手并肩"
 GEA_Work_together_side_by_side_desc:0 "德国与荷兰虽然在远东殖民利益上存在竞争，但两国同样需要面对日本海军的扩张、亚洲民族主义运动的兴起，以及国际经济动荡所带来的威胁。荷属东印度与德属东亚在地理上彼此毗邻，双方的贸易航线、港口设施与资源市场也早已紧密联系。继续让殖民地官员为了局部利益争执不休，只会削弱欧洲列强在南洋维持影响力的能力。我们将寻求同荷兰当局建立更加稳定的商业与安全合作机制，协调海上巡逻、港口补给及贸易政策，并鼓励双方企业开展联合投资。"
 GEA_The_travel_of_Rumphius:0 "龙菲乌斯的探索"
 GEA_The_travel_of_Rumphius_desc:0 "十七世纪，出生于德意志地区的博物学家格奥尔格·埃伯哈德·龙菲乌斯曾为荷兰东印度公司服务，在安汶岛开展了数十年的自然科学研究，并以其对摩鹿加群岛丰富物产的记述而闻名。然而，这些由德国人的才智所揭示的东方财富，却在此后的数百年间始终掌握在荷兰殖民者手中。如今，荷属东印度群岛依旧控制着南洋最重要的石油、橡胶与矿产资源，其广阔的领土更横亘于德属东亚的主要航线与太平洋属地之间。随着德国在远东的霸权日益稳固，我们已经没有理由继续满足于同荷兰人分享南洋的商业利益。"
 GEA_Atone_for_Meyer-Waldeck_disgrace:0 "一雪迈耶-瓦尔德克之耻"
 GEA_Atone_for_Meyer-Waldeck_disgrace_desc:0 "1914年，当世界大战的战火蔓延至东方时，胶州湾总督阿尔弗雷德·迈耶-瓦尔德克曾率领德国守军奋力抵抗日英联军的围攻。然而，面对敌人在兵力、火炮与海上封锁方面的压倒性优势，青岛最终还是被迫投降。这场战斗虽然未能改变世界大战的最终结局，却始终是德国远东海军史上一段难以忘却的屈辱。如今，帝国已经重新确立了自己在中国沿海的地位，但日本人同样没有放弃对山东及整个东亚大陆的野心。我们将率先出击，彻底将日本这条军国主义疯狗扼杀在自己的摇篮里。"
 GEA_Restart_the_Qingdao_Fortifications:0 "重启青岛炮台"
 GEA_Restart_the_Qingdao_Fortifications_desc:0 "青岛不仅是德国在中国沿海的重要商业据点，更是帝国海军控制黄海、监视日本及保护山东利益的战略支点。世界大战期间的惨痛教训已经证明，即使拥有坚固的海岸炮台，一座孤立的海军基地仍然可能在敌方持续封锁与陆海联合进攻下陷入困境。总督府将推动重建和扩充胶州湾的海岸防御设施，更新重型岸防火炮，改善弹药储备、地下工事与军事通信，并加强附近机场和陆上防线的建设。与此同时我们还将确保青岛同中国内陆的铁路交通能够在战时维持运转。"
 GEA_Jungle_mud_pit:0 "丛林泥淖"
 GEA_Jungle_mud_pit_desc:0 "德属东亚的战略防御不仅需要考虑日本舰队从海上发动的进攻，也必须警惕敌人利用南洋复杂的地形与气候展开军事行动。印度支那的热带丛林、马来半岛的泥泞道路，以及遍布海岸和岛屿的沼泽地带，都足以使现代军队的机动与补给变得异常困难。然而，这些令德国驻军头疼不已的自然障碍，同样能够成为阻挡敌方入侵的有力屏障。我们将加强对重要登陆地点、丛林交通线和内陆防御区域的调查，改善驻军在热带环境中的行动能力，并利用河流、山地与雨林建立纵深防御体系。"
 GEA_Hirohito_Far_East_ulcer:0 "裕仁的远东溃疡"
 GEA_Hirohito_Far_East_ulcer_desc:0 "日本帝国对于中国大陆的野心早已不是秘密，但即便东京拥有一支庞大的现代化军队，想要彻底征服这片幅员辽阔、人口众多的土地，也绝非轻而易举之事。中国各地的军阀虽然彼此争斗不休，却仍然拥有数量可观的军队与地方资源，而那些正在同日本人交战的中国将领，更是迫切需要来自外国的武器、资金与军事援助。对于德属东亚而言，这无疑是一个值得利用的机会。我们将通过德华银行及其他商业渠道向抗日军阀提供贷款、军火与必要的技术支持，并在适当情况下派遣军事顾问，帮助他们维持对日本军队的抵抗。德国并不需要亲自派遣大军踏上中国战场，只要这些中国军阀能够继续牵制日本的兵力、消耗其财政与战争物资，东京便不得不将大量精力投入这场看不到尽头的大陆战争。"
 GEA_Head_for_the_center_of_the_Pacific_Ocean:0 "奔赴太平洋之心"
 GEA_Head_for_the_center_of_the_Pacific_Ocean_desc:0 "夏威夷群岛地处太平洋中央，既是连接亚洲与美洲的重要航运枢纽，也是任何希望在这片广阔海洋上建立霸权的国家都无法忽视的战略要地。长期以来，德国在太平洋的活动主要集中于南洋殖民地与西部岛屿，而对于远在大洋中央的夏威夷，则始终缺乏足够的政治与经济影响。然而，随着日本海军不断向太平洋深处扩张，夏威夷所拥有的优良港口、补给设施与地理位置，已经使其成为影响未来海上力量均衡的重要因素。我们无须立即改变群岛的政治归属，只要能够在这里建立稳定的经济联系与外交影响，德国便有机会在太平洋的心脏地带取得一个足以制衡日本的重要支点。"
 GEA_Investigate_the_details_of_the_joint_fleet:0 "探查联合舰队底细"
 GEA_Investigate_the_details_of_the_joint_fleet_desc:0 "日本联合舰队的规模、训练水平与舰艇技术，始终是德属东亚海军司令部最为关心的问题之一。东京近年来不断扩大海军建设，其主力舰、航空母舰与潜艇部队的发展，已经使日本成为德国在太平洋上最值得警惕的潜在对手。然而，仅仅根据公开的造舰计划与报纸报道，远不足以准确判断日本海军的真实战斗力。我们将扩大对日本海军基地、造船工业与舰队活动的情报搜集，通过外交武官、商业渠道及海上侦察了解其舰艇性能、训练制度和战略部署，并要求远东舰队根据所得情报不断调整作战计划。"
 GEA_Double_Eagles_Shooting_the_Sun:0 "双鹰射日"
 GEA_Double_Eagles_Shooting_the_Sun_desc:0 "在辽阔的太平洋上，德意志帝国与美利坚合众国虽然有着不同的政治传统与战略利益，却同样无法对日本日益膨胀的野心视而不见。东京对于中国大陆、南洋群岛与太平洋航线的觊觎，不仅威胁着德国在远东经营数十年的殖民体系，也使美国在太平洋上的商业与战略利益面临越来越严峻的挑战。尽管世界大战及此后的一系列国际争端曾使德美关系充满猜疑，但面对一个可能改变整个太平洋力量均衡的共同对手，昔日的分歧或许并非不可逾越。我们将通过外交渠道主动接触美国政府，寻求在对日政策、海军情报与军事行动方面建立合作，并研究双方舰队在未来战争中相互支援的可能性。"
#第二次对华远征
 GEA_The_second_expedition_to_China:0 "第二次对华远征"
 GEA_The_second_expedition_to_China_desc:0 "1926年，随着国民革命军的北伐威胁到德国在华的商业特权与政治利益，帝国曾组织远征军干涉中国局势，以军舰、枪炮与金马克阻止革命浪潮继续向北蔓延。十年过去了，中国依旧深陷军阀割据与政治动荡之中，而昔日远征所建立的亲德秩序也开始出现裂痕。八省联合的动摇、国民党的卷土重来，以及各地军阀日益高涨的独立倾向，正在威胁帝国数十年来在中国苦心经营的成果。然而，今天的德属东亚早已不必事事依靠柏林的直接干预。凭借远东舰队、通用东亚公司与德华银行所掌握的庞大资源，我们完全有能力自行决定中国事务的走向。昔日的远征依靠刺刀为帝国打开了中国的大门，而这一次，我们将确保那些门户再也不会轻易关闭。"
 GEA_Nanjing_xpress:0 "南京特快"
 GEA_Nanjing_xpress_desc:0 "八省联合的分崩离析，已经使德国在华东经营数十年的经济与政治利益面临严重威胁。随着各路叛军相继举兵，宁系军阀控制下的南京政府不得不同时应对来自数个方向的军事压力，而原本维系八省联合的行政与交通体系也随之陷入混乱。对于德属东亚而言，宁系的存亡绝不仅仅是一场中国军阀之间的权力斗争。南京一旦失守，通用东亚公司在华东的工厂、矿山与铁路特许便可能尽数落入敌对势力之手，帝国苦心建立的经济霸权也将遭受难以估量的打击。我们必须立即行动，动用德国在华现存的铁路与航运网络，将武器、弹药、资金及其他重要军需物资紧急运往南京，同时派遣军事顾问协助宁系军队维持防线。"
 GEA_The_usiness_expansion_of_AOG:0 "华东业务扩张"
 GEA_The_usiness_expansion_of_AOG_desc:0 "通用东亚公司在中国经营多年，已经凭借其庞大的资本、德国政府的政治支持及同地方军阀的密切联系，建立起横跨铁路、矿业、工业与商业贸易的投资网络。然而，华东广阔的市场仍然拥有大量尚未得到充分开发的商业机会，而宁系政府为了维持庞大的军政开支，也始终需要新的外来资本。我们将进一步扩大通用东亚公司在东南诸省的经营规模，争取新的工业特许与基础设施合同，并通过参股、贷款和联合经营逐渐将更多中国企业纳入德国资本的影响范围。"
 GEA_Goods_out_money_in:0 "货出去，钱进来..."
 GEA_Goods_out_money_in_desc:0 "中国长期以来的政治分裂与军阀混战，虽然给德国在华投资带来了不少风险，却也为帝国工业提供了一个庞大而利润丰厚的市场。各地军阀为了扩充军队、维持统治，不得不持续向外国采购枪械、火炮与军事装备，而那些试图推动地方工业化的中国政权，同样需要德国制造的机械、电气设备及其他工业制成品。对于克虏伯、西门子及通用东亚公司的商人而言，这些需求无疑意味着源源不断的订单。我们将进一步扩大德国商品在中国市场的销售规模，利用德华银行提供采购贷款，通过贸易优惠与批量供货压倒本地竞争企业，并鼓励军工企业积极争取各派军阀的军事订单。至于这些中国客户究竟会将德国武器用于对付谁？那可不是商人们该关心的问题。"
 GEA_Building_a_road_network_in_Southeast_provinces:0 "建设东南诸省路网"
 GEA_Building_a_road_network_in_Southeast_provinces_desc:0 "尽管宁系政府控制着中国经济较为发达的部分地区，但东南诸省的交通条件依旧存在严重不足。许多内陆城镇仍然依赖传统水道与狭窄的乡间道路运输货物，雨季时的道路损毁更经常导致农产品与工业原料无法及时运抵市场。德国工程师认为，只有建立起更加完善的公路与铁路联运体系，华东现有的经济潜力才能得到充分发挥。我们将同宁系政府合作修筑连接重要城市、矿区、农业产地及沿海港口的道路，并引进德国筑路机械与工程技术，以降低地区间的运输成本。当然，这些工程的融资与经营合同也将为德国企业带来可观收益。随着新的交通网络逐渐成形，南京政府将能够更加有效地管理地方，而德国资本则会通过这些道路进一步深入东南诸省的每一个重要市场。"
 GEA_Best_regards_to_our_mining_operation:0 "敬我们的开采事业"
 GEA_Best_regards_to_our_mining_operation_desc:0 "东南诸省蕴藏着大量对于现代工业具有重要价值的矿产资源，但许多矿区仍然缺乏先进设备与可靠的运输条件，部分矿业特许更因地方军阀之间的争执而长期无法得到开发。对于拥有雄厚资本与成熟采矿技术的德国工业集团而言，这无疑是一片尚待开拓的市场。我们将同宁系政府协商扩大矿业投资，引进现代勘探、采掘与矿石加工设备，并通过德华银行提供必要的资金支持。作为交换，德国企业将争取长期矿业经营权、优惠的原料采购价格及相关运输特许，使矿产开发能够同德国在远东的工业体系紧密联系。"
 GEA_Manage_the_grain_storage_facility:0 "把控粮仓"
 GEA_Manage_the_grain_storage_facility_desc:0 "长江下游与东南各省拥有广阔的农业产区，粮食生产不仅关系到当地居民的生计，也是宁系政府维持军队供给与财政收入的重要基础。德国商人认为，只要能够掌握粮食的仓储、运输与批发环节，便可以在不直接拥有农田的情况下，对华东农业市场施加相当可观的影响。我们将通过投资粮仓、改善铁路与水路运输设施以及签订长期收购合同，扩大德国企业在粮食流通领域的地位，并同宁系政府合作建立更加稳定的粮食供应体系。这些措施有助于减少运输损耗并维持城市与军队的基本供给，但也意味着南京的财政与粮食市场将越来越依赖德国资本控制的商业设施。"
 GEA_The_tricks_of_financiers:0 "金融家的伎俩"
 GEA_The_tricks_of_financiers_desc:0 "与那些习惯依靠枪炮迫使中国军阀让步的军官不同，德华银行的金融家们更愿意通过贷款合同、债务展期与企业股份来取得同样的成果。宁系政府为了维持军队、修筑铁路及支付庞大的行政开支，长期需要从德国金融机构获得资金支持，而这些贷款自然不可能毫无附加条件。我们将进一步扩大德华银行对宁系政府及华东企业的信贷业务，通过债券承销、债务重组与财政担保争取更多经济特许，并在重要项目中要求以税收收入或企业经营收益作为偿债保障。有时候，一纸经过精心拟订的贷款合同，所能取得的成果甚至比一支远征军更加丰厚。"
 GEA_German_manufacturing:0 "德意志制造"
 GEA_German_manufacturing_desc:0 "德国工业产品以精密、可靠与先进的制造技术享誉世界，而华东庞大的市场则为这些商品提供了极为广阔的销售空间。随着宁系政府推动铁路、工厂及城市基础设施建设，对于机械设备、电气产品、化工原料与其他工业制成品的需求正在不断增长。我们将鼓励德国企业扩大对东南诸省的出口，通过通用东亚公司的销售网络建立新的代理商与维修机构，并利用德华银行的信贷支持帮助中国客户采购德国设备。与此同时，德国工程师和技术人员也将参与当地工厂的安装、维护与人员培训，使华东工业更加熟悉并依赖德国的技术标准。宁系政府或许能够借此提高生产能力，但这也将使其在相当长的时间内难以摆脱德国制造业的影响。"
 GEA_Source_of_Wealth:0 "财富之源..."
 GEA_Source_of_Wealth_desc:0 "德意志帝国在中国经营数十年的经验已经证明，真正持久的经济霸权并不一定需要直接统治广阔的土地。通过铁路、矿山、工厂、银行与商业合同所建立的利益网络，德国资本已经能够深入华东经济生活的各个重要领域，而宁系政府虽然仍然维持着自己的行政机构与军事力量，却越来越依赖德国提供的资金、设备与国际贸易渠道。如今，随着通用东亚公司的业务不断扩大，德华银行进一步掌握地方财政命脉，德国企业也逐渐控制了重要商品的生产与流通，我们终于有机会将这套庞大的经济体系整合成更加稳固的利益共同体。宁系军阀将继续获得维持统治所需的财政收入与现代化建设成果，而德国商人则能够通过投资收益、贷款利息、贸易利润及经营特许分享华东所创造的财富。只要南京仍然需要我们的金马克，中国东南诸省便会继续成为支撑德意志远东霸权的重要财富之源。"
 GEA_The_fading_memories_of_the_second_interference:0 "二次干涉的褪色记忆"
 GEA_The_fading_memories_of_the_second_interference_desc:0 "十年前，德意志帝国的军事干涉曾使声势浩大的国民革命军止步于长江以南，迫使那些企图以武力统一中国的革命者接受失败的现实。然而，随着八省联合的崩溃与华东局势的再度动荡，国民党左派又一次看到了向南京进军的机会。来自第三国际的政治支持与军事援助，更使这场革命不再只是中国军阀之间的争斗。我们绝不能容许德国在华东经营数十年的利益毁于这些革命者之手。远东舰队将加强对国民党控制港口及沿海航线的监视，阻断其海外军火、物资与志愿人员的输入，并通过外交压力警告那些试图援助中国革命的外国势力。只要革命军无法获得稳定的海外补给，仍然抵抗国民党的地方军阀便有机会重新稳住战线。"
 GEA_The_Campaign_to_Suppress_Bandits_in_the_Southeast:0 "东南剿匪记"
 GEA_The_Campaign_to_Suppress_Bandits_in_the_Southeast_desc:0 "国民党左派在东南诸省的不断扩张，已经使德国在华的商业特权与政治影响力面临严重威胁。那些高举民族革命旗帜的军队不仅试图推翻亲德地方政府，更将通用东亚公司的工业资产、外国租界与德国银行视作必须清除的帝国主义遗产。对于德属东亚而言，这显然不是一场可以置身事外的中国内战。我们将出兵剿灭国民党政权，并协调驻华德军及海军部队保护重要的交通与商业据点。"
 GEA_Seal_off_the_borders_of_other_countries:0 "查封他国门户"
 GEA_Seal_off_the_borders_of_other_countries_desc:0 "使馆城市原本是列强共同维护在华权益的重要制度安排，其特殊的国际地位不仅保障了外国商人的安全，也为德国资本进入中国腹地提供了便利。然而，随着中国局势不断恶化，这套脆弱的国际合作体系已经逐渐失去维持自身的能力。无论是使馆城市内部秩序的全面崩溃，还是其管理机构转而向日本靠拢，都意味着德国在华商业与外交利益将遭受难以接受的损失。总督府必须准备采取更加直接的措施，要求当地当局重新保障德国企业与侨民的合法权益，并利用驻华军队、海军及金融机构的力量，接管或封锁那些已经无法继续履行原有义务的重要港口与商业设施。既然列强共管的制度已经无法保护帝国的利益，那么德国便只能亲自确保这些通往中国的门户不落入敌对势力之手。"
 GEA_legation_cities_collapsed_tt:0 "使馆城市已不存在、陷入破产或失去在华地位。"
 GEA_japanese_legation_high_commissioner_tt:0 "使馆城市由日本籍高级专员§Y冈崎胜男§!领导。"
 GEA_revisit_old_site:0 "旧地重游"
 GEA_revisit_old_site_desc:0 "1926年，当国民革命的浪潮席卷华南之际，德意志帝国曾派遣远征军前往广州，以武力干涉中国的政治局势，维护帝国在珠江流域的商业特权，并阻止国民革命军进一步威胁德国在华利益。尽管那场远征最终使德国得以暂时稳住华南局势，但十年间的政治变迁与民族主义运动，已经使帝国当年取得的诸多成果逐渐付诸东流。如今，随着两广政局再次出现变数，我们终于有机会重新踏上这片曾令德国军人与外交官印象深刻的土地。总督府将恢复同广州商会、地方军政人物及亲德势力的联系，重新审查当年远征期间签订的商业协议，并争取恢复德国资本在华南的特殊地位。"
 GEA_The_wavering_business_group:0 "摇摆不定的商团们"
 GEA_The_wavering_business_group_desc:0 "广东商团长期以来便是华南政坛上一股不可忽视的力量。以陈廉伯为首的广州商人拥有庞大的商业资本、遍布珠江流域的贸易关系及自己的准军事组织，但他们对于德国资本的态度却始终充满矛盾。一方面，商团希望借助外国贷款与工业技术振兴广东经济，并利用德国人的支持巩固自身政治地位；另一方面，他们又担心德国企业重新取得过多经营特权，损害本土商人的利益。总督府将通过德华银行与通用东亚公司加强同陈廉伯及其盟友的接触，提供商业贷款、投资机会与必要的政治支持，争取使商团逐渐向德国靠拢。"
 GEA_Eliminate_all_evil_forces:0 "除恶务尽"
 GEA_Eliminate_all_evil_forces_desc:0 "国民党在广东的执政已经使德国在华南的传统利益遭受严重打击。那些自称革命者的政客不仅试图限制外国资本的经营活动，更将德国在中国取得的商业特权视作必须彻底清除的帝国主义遗产。随着其政治影响力不断扩大，珠江流域的德国企业、金融机构与侨民社区正面临越来越严峻的威胁。对于德属东亚而言，继续依靠外交抗议与商业谈判已经不足以解决问题。我们将正式采取军事行动，联合一切愿意反对国民党统治的地方势力，准备以武力推翻广东现政权，并重新建立能够保障帝国利益的政治秩序。"
 GEA_The_dominant_position_of_Golden_Mark:0 "金马克的主导权"
 GEA_The_dominant_position_of_Golden_Mark_desc:0 "广东拥有中国最为活跃的商业市场之一，其繁忙的港口、庞大的华商网络与不断发展的工业部门，足以使任何外国投资者为之心动。然而，单纯扩大贸易额并不足以确保德国在华南获得持久的经济优势。我们必须利用德华银行的信贷能力、通用东亚公司的商业网络及德国工业集团的技术实力，逐步将广东的重要产业与金融活动纳入帝国资本体系。总督府将推动对当地铁路、港口、工厂与商业企业的投资，向地方政府提供财政贷款，并通过长期合同及经营特许扩大德国资本的控制力。"
 GEA_Developing_the_uninhabited_wilderness:0 "建设蛮荒之地"
 GEA_Developing_the_uninhabited_wilderness_desc:0 "尽管广州与珠江三角洲拥有发达的商业活动，但两广内陆的许多地区仍然缺乏现代交通与工业设施。崎岖的山地、落后的道路与分散的地方市场，使大量自然资源难以得到有效开发，也限制了德国资本向沿海城市之外扩张的能力。我们将鼓励德国工程企业参与两广内陆的道路、桥梁及工业设施建设，并通过地质勘察与土地测绘寻找新的矿业和农业投资机会。同时，总督府还将同地方政府协商取得必要的建设特许，改善资源产地同广州及其他重要港口之间的交通联系。"
 GEA_Reaffirm_our_position:0 "重申我们的地位"
 GEA_Reaffirm_our_position_desc:0 "德国资本在两广的不断扩张，已经使当地政府在财政、工业与贸易方面同德属东亚建立了密切联系。德华银行提供的贷款支撑着重要公共工程，德国企业参与经营着港口、矿山与工厂，而当地商人也越来越依赖帝国的航运与海外市场。然而，经济合作终究需要可靠的政治保障，尤其是在中国地方军阀与政治派系仍然频繁更替的情况下。如今，总督府认为时机已经成熟，可以要求两广政府正式承认德国在华南的特殊地位，并就外交合作、经济特权与安全事务作出明确承诺。"
 GEA_Peace_in_Guangzhou:0 "广州无战事"
 GEA_Peace_in_Guangzhou_desc:0 "广州曾经是中国革命运动的重要中心，也长期饱受地方军阀、政治党派与商业集团之间的激烈斗争所困扰。接连不断的军事冲突与政治动荡，使这座繁荣的港口城市难以充分发挥其经济潜力，更令德国商人对于扩大投资始终抱有顾虑。如今，随着德国同两广政府之间的合作逐渐稳固，珠江流域终于有机会迎来一段相对安定的发展时期。总督府将继续支持当地政府维护商业秩序，推动港口与交通设施建设，并鼓励德国银行与企业扩大投资，以恢复广州在远东贸易中的重要地位。"
 GEA_The_second_jewel_of_colonial_territory:0 "殖民版图的第二明珠"
 GEA_The_second_jewel_of_colonial_territory_desc:0 "自德意志帝国在东南亚建立庞大的殖民体系以来，新加坡便始终被视作德国在东方最为耀眼的海外明珠。然而，随着帝国资本进一步深入珠江流域，广州及其周边地区正在展现出足以同新加坡相提并论的商业潜力。广东拥有活跃的商人阶层、众多工业企业与连接中国内陆及南洋市场的便利交通，而德国银行与大型工业集团的持续投资，更使当地经济逐渐同德属东亚紧密结合。我们将进一步巩固在两广取得的商业特权，扩大港口、工业与金融设施建设，并确保德国企业能够长期分享华南经济发展所创造的收益。只要珠江流域的财富能够通过德国控制的商业网络源源不断地流向远东，广州便有资格被称作帝国东方殖民版图上的第二颗明珠。"
 GEA_The_marionettes_in_the_Forbidden_City:0 "紫禁城中的提线木偶"
 GEA_The_marionettes_in_the_Forbidden_City_desc:0 "自德意志帝国协助直系军阀恢复大清皇统以来，北京的紫禁城便重新迎来了皇帝、宗室与朝廷官员。然而，尽管溥仪重新端坐于龙椅之上，决定中国政治命运的真正权力却依然掌握在吴佩孚及其直系军人集团手中，而这一套脆弱的政治秩序又在很大程度上依赖德国的财政支持与外交庇护。对于总督府而言，清廷的存在不仅能够为亲德政权提供传统的合法性，更使德国得以在不直接承担统治中国责任的情况下，维护自身在华北的特殊地位。我们将加强同宗室、宫廷官员及其他亲德政治人物的联系，利用财政援助与外交影响扩大帝国在北京朝廷中的发言权，并确保任何有关外国权益的重要决定都不会损害德国利益。"
 GEA_Pressure_the_Jade_Marshal:0 "施压玉帅"
 GEA_Pressure_the_Jade_Marshal_desc:0 "吴佩孚能够在中国北方维持其统治地位，既依靠直系军队的力量，也离不开德国长期以来提供的军事装备、金融贷款与外交支持。然而，这位素有玉帅之称的军阀并非甘愿听命于外国人的傀儡。随着北京政权逐渐稳定，他开始愈发重视维护自身的政治自主权，并试图限制德国资本对中国财政与工业的进一步渗透。对于德属东亚而言，这种态度无疑令人担忧。事实上，帝国并不急于将玉帅赶下权力宝座，但他必须明白，倘若没有德国人的扶植，他的统治连一天都难以为继。"
 GEA_The_embers_of_the_declining_empire:0 "衰朽帝国的火种"
 GEA_The_embers_of_the_declining_empire_desc:0 "大清王朝曾统治中国数百年，却在革命与军阀混战中失去了昔日的权威。如今，尽管皇帝已经在德国与直系军阀的支持下重返紫禁城，清室所能直接控制的政治与军事力量依然十分有限，而地方实力派对于北京朝廷的效忠也往往流于形式。然而，古老王朝的影响并未彻底消失，仍有不少宗室贵族、保皇官僚与地方士绅相信，恢复皇权有助于结束中国长期以来的政治混乱。我们将加强同这些保皇势力的联系，并借助传统君主制度的合法性维持北京政权的稳定。对于德国而言，一个依赖帝国支持而得以延续的清王朝，远比一个试图彻底摆脱外国影响的新兴民族主义政府更加容易合作。"
 GEA_Supporting_Prosperity_Alliance:0 "扶植繁荣联盟"
 GEA_Supporting_Prosperity_Alliance_desc:0 "吴佩孚与直系军官长期主导着北京政坛，但对于德国资本而言，一个完全依靠军人维持统治的政府，显然并不总是理想的合作伙伴。随着中国民族主义思潮不断发展，直系内部对于外国商业特权的疑虑也日益加深，使通用东亚公司开始寻找能够在政治上维护德国经济利益的新盟友。繁荣联盟正是在这样的背景下逐渐兴起。\n\n这一由新兴实业家、银行家及亲德技术官僚组成的政治团体，主张扩大自由贸易、放宽企业经营限制，并通过引进德国技术与资本推动中国工业化。我们将利用通用东亚公司的商业网络与金融资源支持繁荣联盟扩大组织，争取更多地方企业家与知识分子的参与，并帮助其在北京政坛获得更大的发言权。"
 GEA_Tighten_the_reins:0 "拉紧缰绳"
 GEA_Tighten_the_reins_desc:0 "尽管北京政府长期以来依靠德国的支持维持统治，但随着直系军阀逐渐恢复实力，部分中国官员已经开始尝试重新讨论外国在华的经济特权。对于德属东亚而言，这种危险的政治倾向必须在形成真正威胁之前得到遏制。我们将进一步加强对北京政府财政与军事政策的监督，利用债务偿还、军火供应及重要商业合同作为谈判筹码，并要求中国当局在涉及德国权益的重大事务上提前同帝国代表进行协调。同时，德国顾问将扩大在税务、交通与工业部门中的影响力，以确保既有协议得到严格执行。"
 GEA_Loyalty_has_its_rewards:0 "效忠自有奖赏"
 GEA_Loyalty_has_its_rewards_desc:0 "德意志帝国与北京政府之间的合作，长期以来都是维系华北政治秩序与德国在华利益的重要基础。无论是紫禁城中的大清朝廷，还是掌握实际军政权力的直系集团，只要他们愿意尊重德国的商业特权，并在重大外交与经济事务上同帝国保持合作，我们便没有理由吝惜必要的支持。总督府将协调德华银行、通用东亚公司及其他德国企业，扩大对华北铁路、工业与基础设施的投资，并向北京政府提供适当的财政贷款、技术援助及军事装备，以帮助其改善地方经济与巩固统治。对于德国而言，一个稳定而友好的北京政权，远比一个因财政困顿而陷入混乱的盟友更加有利。"
 GEA_Establish_a_development_special_zone:0 "划定发展特区"
 GEA_Establish_a_development_special_zone_desc:0 "直隶与华北地区拥有庞大的人口、丰富的自然资源与广阔的消费市场，但长期以来的政治动荡和落后的基础设施，使德国资本难以充分发挥当地的经济潜力。我们将同北京政府协商，在交通便利、资源丰富且便于管理的地区划定特别经济开发区域，并通过长期租赁、税收优惠及特殊经营许可，吸引德国工业集团、银行与贸易企业进行集中投资。"
 GEA_Protect_our_property_rights:0 "保卫我们的产权"
 GEA_Protect_our_property_rights_desc:0 "德国企业在华北的铁路、矿山、工厂与商业资产，往往是通过长期贷款、特许经营及同地方政府签订的复杂合同逐渐取得的。然而，直系的变幻无常使这些产权始终面临不确定性。如今部分民族主义政客甚至主张重新审查或废除外国企业享有的经营特权，而愚蠢的中国军阀竟然真的准备将我们的影响力驱逐出华北平原。对于德属东亚而言，这种企图显然不可接受。我们将在必要时刻通过快速且迅猛的军事干预来保卫我们的在华北的资产与权益。"
 GEA_Submission:0 "臣服..."
 GEA_Submission_desc:0 "自清王朝在德国支持下重返北京以来，直系军阀与清廷便始终在维护政治自主权和依赖外国援助之间艰难周旋。然而，随着德国资本进一步深入华北的财政、工业与交通体系，北京政府已经越来越难以摆脱帝国的影响。德华银行掌握着重要的贷款与债务安排，德国企业控制着关键工业项目，而直系军队所需要的现代装备与技术支持，也依然在很大程度上来自德国。如今，总督府将利用这些长期积累的经济与政治优势，要求北京政府进一步明确其对德国的合作义务，并在重大外交、军事及商业事务上接受帝国的指导。只要中国的统治者愿意承认现实，继续以自己的名义维持地方秩序，那么德国便可以在不承担直接统治责任的情况下，获得对于华北事务更加稳固的支配地位。"
 GEA_The_Great_Wall_of_Zhili_Province:0 "直隶长城"
 GEA_The_Great_Wall_of_Zhili_Province_desc:0 "作为大清帝国的京畿重地，直隶不仅承担着保卫北京与天津的军事责任，也是德国在华北商业与外交利益最为集中的地区之一。然而，北方军阀的频繁冲突、日本在中国大陆不断扩张的野心，以及各派革命势力对于清廷的敌视，都使直隶的安全局势难以令人放心。倘若北京再度陷入战火，那么德国在华北的铁路、银行、工业资产与商业特权也将随之面临严重威胁。我们将协助直系军队改善京畿地区的防御体系，扩充重要交通枢纽的军事设施，并通过德国军事顾问加强中国守军的训练与后勤组织。同时，帝国还将出资建设加固山海关防线，以防止北方的张作霖在日本人的支持下南下。"
 GEA_Build_the_peninsula:0 "建设半岛"
 GEA_Build_the_peninsula_desc:0 "山东半岛凭借其优良的港湾、丰富的矿产资源与连接华北腹地的地理位置，长期以来便是德国在中国最重要的战略据点之一。然而，除青岛等少数得到充分开发的城市外，半岛的大部分地区仍然缺乏现代交通与工业设施，复杂的地方政治更使德国企业难以充分利用当地的经济潜力。我们将扩大对山东半岛的基础设施投资，改善沿海港口、公路与铁路运输，并鼓励德国工商业集团参与矿业、机械制造及农产品加工。与此同时，总督府还将加强与山东地方当局的合作，为重要工程争取必要的土地与经营特许。只要能够将德国资本与现代工业技术进一步引入这片土地，山东半岛便有望成为帝国在华北经济扩张的重要基地。"
 GEA_Copy_the_Qingdao_model:0 "复制青岛模式"
 GEA_Copy_the_Qingdao_model_desc:0 "自德国获得胶州湾以来，青岛便在帝国工程师、商人与行政官员的共同经营下，逐渐发展为拥有现代港口、宽阔道路与完善市政设施的东方城市。对于德属东亚的殖民官员而言，这座城市不仅证明了德国技术与资本的价值，也为进一步开发山东内地提供了一套值得借鉴的经验。我们将推动将青岛的城市规划、工业建设与公共设施管理模式推广至其他重要城镇，鼓励德国企业参与道路、供水、供电与港口工程，并协助地方政府建立更加规范的市政机构。然而，这些建设所需要的资金与技术将主要来自德国，而相应的经营特许及行政监督权，也理应为帝国带来合理的回报。德国人已经在胶州湾建立了一座现代化城市，如今是时候让整个山东看到这套发展模式的成果。"
 GEA_deal_with_the_shandong_clique:0 "处理“两张会”"
 GEA_deal_with_the_shandong_clique_desc:0 "山东的政治局势向来复杂，而张宗昌的军阀集团与张天然领导的一贯道势力，更使德国在当地的经营面临诸多不确定因素。张宗昌虽然长期依靠德国资本与青岛港口维持军队供应，却也以反复无常和贪婪无度而闻名；张天然则凭借宗教组织与地方民团，在山东各地建立起不断扩大的社会影响力。对于德国而言，继续放任山东内部的政治纠纷不仅可能威胁胶济铁路与矿业投资，更可能使日本或其他敌对势力获得可乘之机。我们将重新评估对山东各派的政策，利用财政贷款、商业特许与外交压力迫使地方势力作出让步，并争取建立一个更加可靠的合作秩序。"
 GEA_The_beautiful_Jiaozhou_Bay:0 "美丽的胶州湾"
 GEA_The_beautiful_Jiaozhou_Bay_desc:0 "胶州湾曾经只是一处位于中国山东海岸的天然港湾，如今却已成为德意志帝国在远东最为重要的商业与海军据点之一。青岛的港口设施、德国式建筑与繁忙的工商业活动，向所有来访者展示着帝国数十年来在东方投入的资本与技术。随着德国在山东的影响力进一步扩大，我们将继续改善胶州湾的港口、城市交通与工业设施，扩建仓储、修船与贸易服务机构，并加强青岛同山东内陆铁路网络的联系，使其成为德国资本进入华北市场的主要门户。与此同时，殖民地行政部门还将进一步完善城市公共设施，鼓励德国企业和侨民在此长期投资与定居。对于柏林的殖民主义者而言，这座美丽的海湾不仅是一项值得骄傲的建设成果，更是德意志在中国持续施加经济与政治影响力的压舱石。"
 GEA_Deep_into_the_mountains:0 "深入大山"
 GEA_Deep_into_the_mountains_desc:0 "云南地处中国西南边陲，连绵的山脉与复杂的地形虽然长期阻碍着外来势力深入当地，却也使这片土地保留了大量尚未得到充分开发的自然资源。自德国取得印度支那的控制权以来，云南便逐渐成为帝国商人和殖民官员关注的重要邻近地区。这里不仅拥有丰富的矿藏与农产品，更是连接中国内陆、缅甸及印度支那的重要通道。我们将加强对云南各地的经济调查，派遣德国工程师与商业代表考察矿业、农业及交通条件，并同当地军政当局协商扩大投资。那些难以穿越的山岭或许令德国商人望而生畏，但只要能够修筑可靠的道路并建立稳定的商业联系，云南便有机会成为德属东亚深入中国西南腹地的重要门户。"
 GEA_Renegotiation_of_Yunnan-Guizhou_Mining_Company:0 "云贵矿业再谈判"
 GEA_Renegotiation_of_Yunnan-Guizhou_Mining_Company_desc:0 "云南与贵州丰富的有色金属矿藏，长期以来便吸引着外国矿业资本的注意。然而，复杂的地方政治、矿业特许制度与运输条件，使许多投资计划始终未能取得预期收益。随着德国在中国西南的经济影响力不断扩大，我们终于有机会重新审查既有的云贵矿业合作安排，并争取更加有利的经营条件。总督府将推动德国工业集团与当地政府展开新一轮谈判，要求扩大矿产勘探与开采权限，改善企业对矿区运输和加工设施的控制，并通过德华银行为相关工程提供资金支持。作为交换，云南当局可以获得必要的财政收入与技术援助，但德国企业同样必须确保其投资能够得到长期保障。"
 GEA_To_get_a_share_of_the_tobacco_trade:0 "为烟土贸易分一杯羹"
 GEA_To_get_a_share_of_the_tobacco_trade_desc:0 "烟土贸易长期以来便是中国西南经济中一项难以忽视的产业。尽管鸦片种植与贩运所带来的社会问题早已引起广泛批评，但对于那些财政困顿、军费开支庞大的地方军阀而言，烟土税收仍然是一项极具吸引力的收入来源。云南的地理位置使其同缅甸、印度支那及中国内陆的烟土市场保持着密切联系，而这些贸易活动所产生的利润，也吸引了不少德国商人与金融机构的注意。我们将通过同云南地方政府及相关贸易商协商，争取扩大德国资本在烟土运输、仓储与商业融资方面的参与，并利用德属东亚现有的港口和交通设施获取相应收益。"
 GEA_Open_Yunnan-Vietnam_communication_line:0 "打通滇越交通线"
 GEA_Open_Yunnan-Vietnam_communication_line_desc:0 "连接云南与印度支那的铁路和山地商道，长期以来便是中国西南通往南洋的重要交通线路。对于德属东亚而言，这些道路不仅能够将云南丰富的矿产与农产品运往越南沿海港口，也可以使德国制造的机械、工业品与其他商品更加便利地进入中国内陆。然而，复杂的边境管理与落后的支线交通始终限制着这条经济走廊的发展。我们将同云南政府协商改善滇越铁路的运输能力，扩大沿线仓储、道路与货运设施，并推动边境海关及商业管理制度的协调。"
 GEA_Opening_up_the_mainland:0 "开放内地"
 GEA_Opening_up_the_mainland_desc:0 "长期以来，德属东亚的商业活动主要集中于沿海港口与交通便利的殖民地城市，而中国西南内陆广阔的市场却始终未能得到充分利用。云南复杂的山地地形与地方行政制度，使德国企业难以直接开展经营，也使当地商人不得不依赖传统商道与数量有限的贸易中介。然而，随着滇越交通条件逐渐改善，德国资本终于拥有了进一步深入中国腹地的机会。我们将推动云南政府放宽外国企业的经营限制，开放更多地区进行矿业、贸易与基础设施投资，并通过德华银行及通用东亚公司的商业网络，为当地企业提供资金和技术支持。"
 GEA_The_Land_of_Abundance:0 "潦倒的天府之国"
 GEA_The_Land_of_Abundance_desc:0 "四川自古以来便享有天府之国的美誉，肥沃的成都平原、丰富的自然资源与众多的人口，使这片土地长期成为中国西南最重要的经济中心之一。然而，数十年的军阀混战与无休止的财政征发，早已使四川昔日的繁荣蒙上阴影。地方军人为了维持庞大的军队，不断增加税收与摊派，而交通设施的落后及地方政权之间的相互封锁，更使商业活动难以恢复正常。对于希望扩大对华投资的德国人而言，这片看似困顿的土地却仍然蕴藏着巨大潜力。我们将派遣商业与技术代表对四川的农业、矿业、工业及交通状况展开调查，并同当地政府商讨恢复生产与扩大投资的可能性。只要能够结束无谓的经济混乱，将德国资本与现代技术引入当地，昔日的天府之国便有望重新成为中国西南最重要的财富来源。""
 GEA_The_hungry_are_fed:0 "饥者得食"
 GEA_The_hungry_are_fed_desc:0 "四川正在遭受一场规模空前的大饥荒。对于德属东亚而言，这场人道主义灾难为德国扩大在四川的影响力提供了一个难得的机会。总督府将协调德华银行、德国商会及其他企业筹集赈灾资金，通过购买粮食、组织运输与设立救济机构，帮助四川当局缓解迫在眉睫的饥荒。与此同时，我们还将以赈灾贷款、粮食供应合同及交通设施修复为条件，争取德国企业参与当地粮食仓储、铁路与其他重要经济项目。对于饥饿的四川百姓而言，来自德国的粮食意味着活下去的希望；而对于那些财政枯竭的地方军阀来说，接受帝国的援助也意味着不得不在未来的政治与经济事务上作出更多让步。"
 GEA_suppress_nationalism:0 "镇压民族主义者"
 GEA_suppress_nationalism_desc:0 "随着德国资本进一步深入中国西南，反对外国经济特权的民族主义运动也开始在当地获得更多支持。从鼓吹收回矿业经营权的学生团体，到组织抵制德国商品的地方商人，各种反德活动正在威胁帝国在该地区的投资与商业利益。我们将要求当地当局加强对民族主义组织的监视，取缔针对德国企业的非法抵制与破坏活动，并在必要时提供警务顾问、情报与资金支持，以协助其恢复社会秩序。"
 GEA_Assist_in_the_search_for_fugitives:0 "协助搜捕流亡者"
 GEA_Assist_in_the_search_for_fugitives_desc:0 "自国民革命军北伐失败以来，大批国民党军政人员、革命知识分子与地下活动家便流亡至中国西南各省，利用当地复杂的军阀政治与偏远的地理环境躲避追捕，并试图重新组织革命力量。云南与四川的部分地方势力长期以来对这些流亡者采取默许甚至庇护的态度，使国民党得以在西南继续维持政治联系、秘密组织与宣传网络。如今，随着德国同当地政府的合作不断深入，我们终于有机会彻底清除这些潜藏的革命势力。"
 GEA_Draining_the_pond_to_catch_all_the_fish:0 "竭泽而渔"
 GEA_Draining_the_pond_to_catch_all_the_fish_desc:0 "四川丰富的矿产、农产品与庞大的人口市场，始终是德国资本希望深入中国内陆的重要原因。然而，地方军阀长期以来的财政困顿，也使他们越来越愿意以矿业经营权、税收抵押与商业特许换取眼前急需的贷款。对于德华银行及德国工业集团而言，这正是取得四川经济资源的有利时机。我们将扩大对当地政府的财政贷款，并要求以矿山、工厂、重要税收及其他经济资产作为相应保障，同时鼓励德国企业利用优惠合同收购原料、扩大资源开采与出口。虽然这种做法可能加重四川经济对外国资本的依赖，甚至削弱其长期发展的能力，但在迫切需要资金的地方军阀看来，能够及时获得现款远比未来的经济风险更加重要。至于这些交易究竟会给四川留下多少财富，那便是另一回事了。"
 GEA_Promoting_limited_modernization:0 "推动有限现代化"
 GEA_Promoting_limited_modernization_desc:0 "四川的经济困境并非完全源于资源匮乏，而在很大程度上是由落后的生产设备、薄弱的工业基础与长期的政治动荡共同造成的。对于德国而言，适当帮助四川改善经济条件，不仅能够增加当地政府的财政能力，也有助于扩大德国机械、工业原料与技术服务的市场。我们将支持部分交通、能源与工业设施的现代化建设，鼓励四川企业引进德国设备，并通过职业培训与技术顾问改善现有工厂的生产效率。然而，德属东亚并不需要将四川建设成能够同德国工业独立竞争的经济中心。真正符合帝国利益的，是一个拥有基本生产能力、能够稳定采购德国工业品并持续提供原材料的合作伙伴。"
 GEA_Buy_Buy_Buy:0 "造不如买"
 GEA_Buy_Buy_Buy_desc:0 "四川军阀长期以来便热衷于扩充军备，但当地薄弱的军事工业却始终难以满足川军对于现代武器的需求。尽管各派军阀曾多次尝试扩建兵工厂、仿制外国枪械与火炮，但落后的生产设备、匮乏的技术人员以及持续不断的内战，使这些努力往往收效甚微。相比之下，直接从德国采购成熟可靠的军事装备，显然是一条更加快捷的道路。我们将鼓励克虏伯及其他德国军火企业扩大对四川的武器出口，通过德华银行提供军购贷款，并向川军出售步枪、机枪、火炮及其他军事装备。德国军事顾问还将协助当地部队进行装备维护与人员训练，使其逐步采用德国的军事技术标准。"
 GEA_Look_brand-new:0 "双赢之局"
 GEA_Look_brand-new_desc:0 "德属东亚与中国西南地方政府之间的合作，已经逐渐超越了最初单纯的商品贸易与财政贷款。德国企业需要稳定的原材料供应、广阔的销售市场及可靠的投资保障，而云南与四川的地方当局则迫切希望借助外国资本改善交通、发展工业并增加财政收入。只要双方能够妥善协调各自的利益，这种合作便有机会形成一套长期而稳定的经济关系。我们将推动德华银行、通用东亚公司及其他德国企业扩大在当地的投资，通过联合经营、技术援助与贸易协议帮助地方经济恢复发展，并确保合作项目能够为德国资本带来合理的利润。"
#流亡
 GEA_THE_DH:0 "至暗时刻"
 GEA_THE_DH_desc:0 "曾经不可一世的德意志帝国，如今正面临着自统一以来最为严重的灾难。欧洲的战火已经摧毁了帝国引以为傲的军事与政治秩序，柏林的权威随之土崩瓦解，而那些曾经统治着半个世界的官员、军人和贵族，如今只能乘坐逃离欧洲的轮船，在遥远的东方寻找最后一处容身之所。德属东亚或许尚未遭受同样的毁灭，但失去本土的支持，无疑使这片殖民地陷入了前所未有的困境。财政收入难以维持庞大的行政机构，军队的装备与补给日渐匮乏，周边国家更开始重新审视德国在亚洲的地位。我们必须承认，那个能够依靠柏林的财富与军队维持远东霸权的时代已经结束。如今等待着我们的，不再是如何扩大帝国的荣耀，而是如何在这场席卷世界的灾难中保存德意志最后的火种。"
 GEA_Summon_the_wise_and_capable_individuals:0 "召集忠智之士"
 GEA_Summon_the_wise_and_capable_individuals_desc:0 "随着德国本土的政治秩序彻底崩溃，大批曾经服务于帝国政府、军队及工业部门的人才被迫流亡海外。其中既有熟悉外交与行政事务的资深官僚，也有掌握先进技术的工程师、科学家与军官。然而，这些人的到来同样给德属东亚带来了巨大的负担，殖民地有限的资源根本无法长期供养如此庞大的流亡群体。我们将成立专门机构，对抵达远东的德国人员进行登记与安置，并根据其专业能力安排适当职务，使他们能够参与殖民地的行政、工业与军事建设。"
 GEA_Consume_the_embers:0 "收拢余烬"
 GEA_Consume_the_embers_desc:0 "德意志帝国在欧洲的覆灭，并不意味着所有效忠旧日秩序的力量都已经消失。在海外港口、孤立的军事基地和各国流亡社区之中，仍然散布着不少不愿接受失败的德国军人、官员与侨民。部分残存舰艇尚在海外漂泊，一些外交机构依旧保存着帝国的档案和财产，而那些失去祖国的德国人也正迫切寻找能够依靠的政治中心。德属东亚将向这些分散的残余势力发出号召，要求他们同远东当局建立联系，并尽可能将人员、舰船与可用物资集中到我们的控制之下。"
 GEA_Expand_conscription:0 "扩大征发"
 GEA_Expand_conscription_desc:0 "失去德国本土的兵员补充与军事工业支持之后，德属东亚原有的征兵制度已经无法满足当前的国防需求。大量驻军在此前的战争中遭受损失，而维持殖民地秩序、守卫漫长海岸线及防范周边国家的军事压力，又要求我们继续保有一支规模可观的武装力量。为此，我们将扩大对适龄德国侨民与流亡人员的征召，并重新审查殖民地辅助部队的编制，允许更多经过筛选的本地人员承担后勤、警备及其他军事职责。与此同时，政府还将设立新的预备役与民防组织，使退役军人和具备军事经验的居民能够在必要时重新投入服役。这些措施无疑将进一步加重殖民地社会的负担，但在失去祖国庇护的今天，我们已经没有继续依赖旧日征兵制度的余地。"
 GEA_Sourness_and_Peace:0 "苦涩和平"
 GEA_Sourness_and_Peace_desc:0 "德意志帝国在欧洲的覆灭，已经使远东残存的德国势力陷入了前所未有的孤立，而同日本之间持续不断的战争，更使这一局面变得愈发难以维持。失去本土工业与财政支持后，德属东亚的军队不得不依靠有限的兵员、库存与殖民地生产设施坚持作战，即使远东舰队仍然保有一定实力，也无法填补帝国在欧洲所遭受的巨大损失。我们必须承认，继续同日本进行一场漫无止境的消耗战，只会使帝国最后的海外据点面临毁灭。总督府将尝试通过外交渠道与东京达成和平协议，必要时甚至愿意为结束战争作出痛苦的让步，以换取远东残余政权继续生存的机会。"
 GEA_A_desperate_last_ditch_effort:0 "殊死一搏"
 GEA_A_desperate_last_ditch_effort_desc:0 "随着欧洲本土的陷落，德属东亚已经成为德意志帝国最后的军事堡垒，而日本人显然不会因为德国在欧洲的失败便放弃他们在东方的野心。东京的军政领袖或许认为，失去柏林支持的远东殖民地不过是随时可以夺取的战利品。然而，我们将拒绝任何要求帝国无条件屈服的和平安排，并将殖民地残存的工业、财政和物资储备全部投入对日战争。无论这场最后的抵抗将付出多么惨重的代价，我们都必须让日本人明白，德意志帝国绝不会因为欧洲的陷落便在亚洲任人宰割。"
 GEA_Conscript_the_Combined_Fleet:0 "征用联合舰队"
 GEA_Conscript_the_Combined_Fleet_desc:0 "对日战争的胜利终于使德属东亚摆脱了长期以来最为危险的外部威胁，但日本的失败同时也留下了一个不容忽视的问题：那支曾经试图将德国人逐出太平洋的联合舰队，如今究竟应当如何处置？对于失去欧洲本土的德国流亡政府而言，日本海军所拥有的舰艇、造船设施与技术储备，无疑是一笔难以估量的战略财富。虽然远东舰队在战争中证明了自己的实力，但持续作战所造成的损失，以及本土工业体系的彻底丧失，使我们迫切需要新的舰艇与维修能力。总督府将要求日本交出其残存的主力舰艇及重要海军设施，并组织德国军官与技术人员接管相关装备，将符合要求的舰船重新编入帝国海军。"
 GEA_Struggling_to_survive_in_the_face_of_harsh_reality:0 "于惨淡事实前奋力求生"
 GEA_Struggling_to_survive_in_the_face_of_harsh_reality_desc:0 "德意志帝国的失败，已经彻底改变了德属东亚赖以生存的政治与经济环境。过去，殖民地可以依靠柏林的财政补贴、德国工业的机械设备与海军的强大力量维持自身地位，如今这些曾被视作理所当然的支持却已不复存在。更糟糕的是，大批流亡者的涌入进一步加重了粮食、住房与就业的压力，而那些曾经对德国表现得毕恭毕敬的邻国，也开始重新衡量同我们的关系。我们必须重新审视殖民地现有的经济结构，优先恢复必要的生产与贸易，改善粮食及重要物资的储备，并逐步建立能够独立运转的财政与军事体系。"
 GEA_Summarize_the_lessons_learned_from_the_war:0 "总结大战经验"
 GEA_Summarize_the_lessons_learned_from_the_war_desc:0 "欧洲战场上的失败已经证明，即使拥有悠久的军事传统与庞大的工业基础，德意志军队也并非不可战胜。长期以来被视作可靠的战略计划、指挥体系与作战学说，在现代战争的严酷考验面前暴露出诸多缺陷，而军种之间的协调不足、后勤供应的混乱及对新式武器的错误判断，更使帝国付出了难以承受的代价。随着幸存的军官与参谋人员陆续抵达远东，我们终于有机会系统整理大战的经验教训。"
 GEA_A_small_but_highly_efficient_force:0 "少而精的部队"
 GEA_A_small_but_highly_efficient_force_desc:0 "过去的德意志帝国能够征召数以百万计的士兵，并依靠鲁尔工业区庞大的生产能力维持长期战争。然而，失去本土之后，德属东亚已经无力继续供养一支规模庞大、装备复杂的现代化军队。与其勉强维持大量缺乏训练与补给的部队，不如将有限的资源集中于那些真正具有战斗价值的单位。我们将精简冗余的军事机构，裁撤无法有效维持的编制，并优先保留经验丰富的军官、专业技术人员及训练有素的士兵。同时，军方将加强机械化装备、通信系统与后勤保障方面的建设，使较小规模的部队能够发挥更加可靠的战斗力。"
 GEA_tighten_the_belt:0 "勒紧裤腰带"
 GEA_tighten_the_belt_desc:0 "随着欧洲的彻底的覆灭，德属东亚的经济状况已经到了不得不采取严厉措施的地步。军队需要武器与粮食，流亡者需要住房与工作，殖民地行政机构则仍然必须维持基本运转，而总督府的国库却早已无法满足所有人的要求。我们将全面审查政府开支，裁撤不必要的行政机构，推迟缺乏紧迫性的公共工程，并要求军方与各大企业更加节约地使用燃料、原料及其他重要物资。与此同时，政府将重新调整税收与财政政策，尽可能扩大本地收入，以弥补昔日帝国补贴留下的缺口。这些措施无疑会引发商人、官僚与普通居民的不满，但德属东亚已经没有继续挥霍的资本。"
 GEA_The_consensus_of_the_returnees:0 "归乡者的共识"
 GEA_The_consensus_of_the_returnees_desc:0 "尽管德意志帝国与协约国曾在世界大战中兵戎相见，但如今的国际局势早已发生了翻天覆地的变化。德国失去了欧洲本土，英国与法国的流亡政府同样长期寄居海外，而那些曾经被认为不可调和的领土争端与殖民利益，如今在重返故乡这一共同目标面前似乎已不再那么重要。对于德属东亚的流亡者而言，单凭残存的海军与殖民地军队便试图重新征服欧洲，显然是一项近乎不可能完成的事业；然而，如果能够同拥有相似命运的协约国建立合作关系，联合双方的舰队、军事力量与海外资源，那么重返欧洲或许便不再只是一个遥不可及的幻想。"
 GEA_Crossing_mountains_and_rivers:0 "跋山涉水"
 GEA_Crossing_mountains_and_rivers_desc:0 "欧洲距离新加坡何止万里之遥，而横亘在德属东亚与故乡之间的，不仅是广阔的印度洋、陌生的国境与漫长的海上航线，更有那些如今控制着德意志故土的敌人。我们将以远东残存的军队、舰队与工业设施为基础，逐步建立独立的远征能力，筹备必要的海上运输、军事补给与登陆行动，并寻找能够通往欧洲战场的战略途径。纵使前路艰险，德意志也必将凯旋还乡。"
 GEA_Goodbye_sweet_Europa:0 "再会了，甜蜜的欧罗巴"
 GEA_Goodbye_sweet_Europa_desc:0 "自德意志帝国在欧洲覆灭以来，重返故乡便始终是维系远东流亡者团结的重要理想。然而，随着岁月流逝，越来越多的人开始意识到，这个梦想所需要付出的代价，或许远远超过了德属东亚所能承受的限度。欧洲的政治格局已经彻底改变，昔日帝国的工业中心与军事基地均已不复掌握，而远东残存的资源与兵力，显然不足以支持一场跨越半个世界的全面战争。我们必须接受这一令人痛苦的现实：德属东亚已经不再只是等待重返欧洲的临时避难所，而是数以万计德国人如今真正生活的家园。德意志的语言、文化与传统仍将在远东延续，但那个曾经以柏林为中心统治世界的帝国，或许终究只能留在流亡者的记忆之中。再会了，甜蜜的欧罗巴。"
#海空军国策
GEA_Asia_Grand_Navy:0 "大舰队"
 GEA_Asia_Grand_Navy_desc:0 "德意志帝国的远东霸权从来不是仅靠驻扎在印度支那的陆军便能够维持的。新加坡、马来亚与南洋群岛之间相隔辽阔海域，而德国本土的援军与物资更必须经过漫长的海上航程才能抵达。倘若缺乏一支足以掌握制海权的强大舰队，那么帝国在东方的一切殖民成果都将暴露在敌人的炮口之下。我们必须摆脱将远东舰队视作本土海军附属力量的陈旧观念，扩大主力舰与辅助舰艇的编制，完善舰队的指挥和补给体系，使德属东亚拥有一支能够独立执行重大海上作战任务的大舰队。只有当德国军舰真正掌握了东方的海洋，殖民地的安全才能得到保障。"
 GEA_Thielpitz_s_far-sightedness:0 "提尔皮茨的高瞻远瞩"
 GEA_Thielpitz_s_far-sightedness_desc:0 "阿尔弗雷德·冯·提尔皮茨曾凭借他的海军建设思想，将德意志帝国从一支以近海防御为主的次要海上力量，塑造成能够与英国皇家海军争夺海洋霸权的强国。如今，大战的胜利已经证明了帝国海军建设的历史意义，但远东的战略环境又为提尔皮茨留下的遗产提出了新的挑战。面对日本不断扩张的联合舰队，以及遍布印度洋和太平洋的潜在敌人，我们需要的不只是几艘用于展示国威的巡洋舰，而是一套能够长期维持海军实力的造舰、训练与基地建设制度。让我们继承提尔皮茨的远见，使德国人在欧洲赢得的海军地位同样能够在东方得到体现。"
 GEA_The_shipbuilding_industry_is_operating_at_full_capacity:0 "造船工业开足马力"
 GEA_The_shipbuilding_industry_is_operating_at_full_capacity_desc:0 "新加坡的船坞足以为远东舰队提供维修和补给，却远远无法满足一支不断扩张的现代海军对于新舰建造的需求。长期依赖基尔、威廉港与汉堡的造船厂，不仅意味着昂贵的运输费用，更使殖民地的海军建设始终受制于德国本土的订单与造舰计划。我们将扩大现有船坞，兴建船体制造与机械加工设施，并吸引德国造船企业在远东投资设厂。虽然大型战舰的关键设备仍然需要从本土进口，但只要当地工业能够承担更多舰艇建造与舾装工作，远东舰队便不必永远排在公海舰队的采购名单之后。"
 GEA_Shipbuilding_plan:0 "造舰计划"
 GEA_Shipbuilding_plan_desc:0 "海军的发展绝不能继续依靠各部门临时提出的采购要求，以及柏林偶尔愿意拨给远东的几艘退役军舰。总督府将与海军司令部共同拟定一项长期造舰计划，根据德属东亚的战略需求，明确主力舰、巡洋舰、驱逐舰与辅助舰艇的建造比例，并为未来数年的船坞扩建、人员训练和装备采购作出安排。计划的实施势必要求殖民地付出沉重的财政代价，但倘若我们继续让舰队建设受到短期预算与官僚争执的摆布，那么等到日本人的舰炮真正出现在新加坡海峡时，再讨论如何加强海军恐怕就为时已晚。"
 GEA_Alfred_Mahan_s_teachings:0 "阿尔弗雷德·马汉之教诲"
 GEA_Alfred_Mahan_s_teachings_desc:0 "美国海军理论家阿尔弗雷德·塞耶·马汉曾指出，一个国家的繁荣与国际地位在很大程度上取决于其能否掌握海洋。强大的商船队、遍布世界的海军基地以及能够击败敌方主力舰队的海上力量，共同构成了海权的基础。对于坐拥新加坡和马六甲海峡的德属东亚而言，这番论述尤其值得重视。我们的殖民地依赖海上贸易维系生存，而遍布南洋的岛屿与港口则为舰队提供了天然的战略支点。我们将以马汉的海权理论重新审视远东海军的使命，不再满足于被动保护港口，而要建立一支能够主动争夺制海权、维护德国海外贸易与帝国战略利益的现代舰队。"
 GEA_Protecting_the_World_Airways_Route:0 "保卫世界航路"
 GEA_Protecting_the_World_Airways_Route_desc:0 "从德国本土驶往远东的商船，必须穿越地中海、苏伊士运河与印度洋，才能最终抵达新加坡；而从南洋前往中国与太平洋的贸易航线，同样经过众多可能遭到敌方袭击的海域。这些航路不仅承载着殖民地出口的橡胶、锡矿和其他商品，也是远东驻军获得机械设备、武器与人员补充的生命线。我们将重新规划海军巡逻区域，加强重要海峡与港口的防卫，并建立更加完善的商船护航与海上通信制度。只要德国的旗帜仍在东方飘扬，帝国便必须确保自己的货轮能够安全往返于欧洲与亚洲之间。"
 GEA_Wiping_the_Oriental_Pearl_Tower:0 "擦拭东亚明珠"
 GEA_Wiping_the_Oriental_Pearl_Tower_desc:0 "新加坡素有东方重要商港之誉，自德国接管这座城市以来，它更成为德属东亚的政治中心与远东舰队的主要基地。然而，昔日殖民政府遗留下来的港口设施已经难以适应现代大型军舰的需求，部分船坞、仓库与海防设施也因长期缺乏投资而逐渐老化。我们将重新整顿新加坡的海军基地，扩建干船坞与燃料储备设施，改善海军兵营及港口交通，并强化周边海峡的防御体系。通过这些建设，新加坡将不再只是一座繁忙的商业港口，而会成为德意志帝国在亚洲最坚固、最可靠的海军要塞。"
 GEA_Set_sail_and_sail_far:0 "扬帆远航"
 GEA_Set_sail_and_sail_far_desc:0 "一支只敢停泊在新加坡港内的舰队，绝不配被称为帝国的远东海军。辽阔的印度洋与太平洋要求我们的军舰拥有充分的远洋航行能力，而德国海军官兵也必须熟悉从马六甲海峡到南中国海、从爪哇海到西太平洋的各种作战环境。我们将扩大远洋训练航行，加强舰队在长时间部署中的燃料管理、机械维护与通信协调，并定期组织跨海域联合演习。德国的军舰不应只在总督访问港口时鸣炮致敬，更应当能够随时远赴帝国利益受到威胁的海域，向全世界证明德意志海军并未止步于欧洲。"
 GEA_Eastern_Ocean_Fleet:0 "东方公海舰队"
 GEA_Eastern_Ocean_Fleet_desc:0 "世界大战时期，德国公海舰队的名字曾令英国皇家海军不得不严肃对待每一次北海上的交锋。如今，德属东亚同样需要一支能够承担舰队决战任务的主力海上力量。我们将以远东现有主力舰为核心，建立更完善的战列舰、巡洋舰和驱逐舰协同编组，并赋予舰队司令部更加独立的作战规划权限。与此同时，新加坡的船坞与补给基地必须按照大型舰队长期驻泊的需要进行改造。东方公海舰队绝不应只是一个响亮的称号，而必须成为德国在印度洋与太平洋维护海上霸权的真正支柱。"
 GEA_Improve_the_old_hull:0 "改良旧舰体"
 GEA_Improve_the_old_hull_desc:0 "远东舰队现役的部分军舰已经服役多年，其设计思想仍然停留在世界大战时期。虽然这些舰艇的舰体结构依然可靠，但陈旧的火控设备、落后的动力系统以及不足的防空武备，使它们在面对新一代战舰时愈发显得力不从心。考虑到从德国本土获得新舰的成本与时间，我们有必要首先对现有舰艇展开系统性改装。更换老旧机械、改善舰内防护、更新测距仪与通信装置，并适当加强防空火力，将使这些历经风雨的老兵重新具备执行现代海上任务的能力。毕竟，在远东的每一艘军舰都弥足珍贵，而它们的价值绝不应当仅仅由建造年份决定。"
 GEA_Tear_apart_the_seabirds:0 "撕碎海鸟"
 GEA_Tear_apart_the_seabirds_desc:0 "随着航空技术的迅速发展，曾经足以震慑整片海域的庞大战舰，如今却不得不提防来自天空的威胁。航空母舰与舰载机的兴起正在改变海战的规则，而日本海军对于海军航空兵的持续投入，更使远东舰队面临着前所未有的挑战。为了确保帝国战舰不至于沦为敌机的靶子，我们必须进一步加强舰队的防空能力。通过增设高射炮、改进防空火控系统、完善舰队防空阵形，并加强舰员对空射击训练，我们将使任何企图接近德国舰队的敌方飞机付出惨重代价。"
 GEA_Ocean_Fortress:0 "深海堡垒"
 GEA_Ocean_Fortress_desc:0 "远洋战列舰不仅需要拥有能够摧毁敌舰的火炮，更必须具备承受敌方猛烈攻击的能力。坚固的装甲带、合理的水密分舱与完善的损害管制制度，往往能够决定一艘主力舰究竟是继续战斗，还是在第一次严重中弹后便沉入海底。我们将推动海军工程师研究更加可靠的舰体结构，改善重要舱室的装甲防护，并加强官兵在火灾、进水与机械损伤情况下的应急训练。德意志帝国的主力舰必须成为能够经受漫长海上战斗的钢铁堡垒，而不是仅凭宏伟外观与巨大炮塔便自称不可战胜的浮动宫殿。"
 GEA_Imperial_Cannons:0 "帝国重炮"
 GEA_Imperial_Cannons_desc:0 "自无畏舰时代开始，主力舰的大口径火炮便始终是衡量海上力量的重要标准。尽管航空兵和潜艇的崛起正在改变海战的形态，但德国海军中仍有许多将领坚信，决定制海权归属的最终时刻，依然需要依靠战列舰的重炮齐射。我们将进一步改善舰炮的射程、装填效率与弹道性能，扩大高质量穿甲弹与舰炮零部件的储备，并组织远程炮术训练。面对那些试图挑战帝国海上霸权的敌舰，我们必须确保德国战列舰不仅能够率先开火，更能以准确而致命的炮击结束战斗。"
 GEA_IPreparatory_Fleet_Battle:0 "预备舰队决战"
 GEA_IPreparatory_Fleet_Battle_desc:0 "对于传统海军将领而言，漫长的封锁、巡逻与袭扰虽然能够逐步削弱敌人，却不能代替一场决定性的主力舰队会战。德属东亚必须为这样的时刻做好准备。我们将重新制定舰队集中与战斗部署方案，明确战列舰、战列巡洋舰及护航舰艇在会战中的职责，并通过大规模海上演习检验舰队的通信、队形与火力协调能力。面对一支拥有数量优势的敌方舰队，德国海军尤其需要依靠更加严谨的训练与指挥效率弥补劣势。只要能够在正确的时间与地点集中力量，那么远东的海洋便有可能在一场战斗中重新决定自己的主人。"
 GEA_Hell_Strike:0 "地狱打击"
 GEA_Hell_Strike_desc:0 "海战中的胜利往往取决于能否在短暂的交战窗口内给予敌人足够沉重的打击。零散而缺乏协调的炮击只能浪费弹药，而一轮集中于敌方关键舰艇的准确齐射，则可能瞬间改变整个战场的局势。我们将加强舰队对重点目标的火力分配，改进射击指挥与测距程序，并研究如何利用多艘军舰的协同炮击压制敌方主力。尤其是在能见度变化剧烈的远东海域，舰队必须能够迅速捕捉战机，将所有可用火力集中于最有价值的目标。让敌人明白，德意志帝国的重炮绝不是为了在海面上制造几根漂亮的水柱。"
 GEA_High_speed_equals_truth:0 "高速即真理"
 GEA_High_speed_equals_truth_desc:0 "再坚固的装甲与再强大的舰炮，也无法弥补一艘军舰在关键时刻无法抵达战场的缺陷。随着海战范围逐渐扩大，速度与机动能力已经成为决定舰队主动权的重要因素。德属东亚的海军工程师将重点研究舰艇动力系统、推进效率与船体线型，争取在不严重牺牲防护与火力的前提下提高舰队航速。与此同时，舰队司令部也将加强高速机动作战训练，使巡洋舰和主力舰能够更有效地执行截击、追击与重新部署任务。在辽阔的东方海域，能够先于敌人抵达战场的舰队，往往就已经取得了一半的胜利。"
 GEA_Anti-submarine_warfare:0 "反潜作战"
 GEA_Anti-submarine_warfare_desc:0 "世界大战已经证明，即使是规模庞大的海上舰队，也无法完全忽视隐藏在水面之下的威胁。潜艇不需要击沉我们的战列舰，便足以通过攻击商船与运输舰破坏德属东亚的补给体系。为此，我们将加强驱逐舰及其他护航舰艇的反潜装备，改善水下监听与探测技术，并建立更加完善的海上反潜巡逻制度。舰队官兵还将接受专门的潜艇搜索、深水炸弹投放及运输船队防护训练。德国人在世界大战中曾经利用潜艇令敌国商船闻风丧胆，如今我们同样必须学会如何抵御这种武器，以免自己成为过去战术的牺牲品。"
 GEA_Precision_strike:0 "精确打击"
 GEA_Precision_strike_desc:0 "在现代海战中，单纯依靠庞大的舰炮口径已经不足以确保胜利。随着交战距离不断增加、舰艇航速持续提高，如何迅速而准确地测定目标位置，已成为舰队炮术的核心问题。我们将引进更加先进的光学测距仪、火控计算设备与射击校正系统，并扩大舰炮观测与弹着修正训练。通过改善各舰之间的通信与目标数据传递，舰队将能够更加有效地集中火力，减少无谓的弹药消耗。对于远离德国本土、补给资源有限的德属东亚来说，每一次齐射都必须尽可能取得实际效果，而不是依靠漫无目的的炮击碰运气。"
 GEA_Ocean_Falcon:0 "大洋猎鹰"
 GEA_Ocean_Falcon_desc:0 "在海军航空兵尚未出现的年代，一支舰队的侦察范围往往受限于桅杆上的瞭望员与巡洋舰能够抵达的距离。如今，水上飞机与舰载航空兵已经使海军能够将自己的目光投向地平线之外。德属东亚必须充分利用这一技术进步，扩大舰队航空侦察力量，并加强飞行员与舰艇指挥官之间的协作。无论敌人的舰队隐藏在南中国海的何处，或是准备从太平洋哪个方向发动进攻，我们都应当尽可能提前发现其动向。只有先找到敌人，舰队的火炮与鱼雷才有机会发挥作用。"
 GEA_Focus_on_the_escort_fleet:0 "注重护航舰队"
 GEA_Focus_on_the_escort_fleet_desc:0 "虽然战列舰与航空母舰总能吸引海军将领和公众的注意，但真正维系一支远洋舰队日常运作的，往往是那些不起眼的驱逐舰、护卫舰与辅助船只。它们负责侦察、警戒、反潜和商船护航，并在主力舰遭受威胁时承担最危险的掩护任务。考虑到德属东亚拥有漫长而分散的海上交通线，我们必须投入更多资源扩充轻型舰艇部队，改善其航速、续航能力与武器装备，并建立统一的护航训练制度。没有可靠的护航力量，再强大的主力舰也不过是缺乏耳目与屏障的钢铁巨兽。"
 GEA_Aircraft_Carrier_Battle_Group:0 "航母作战群"
 GEA_Aircraft_Carrier_Battle_Group_desc:0 "航空母舰的出现正在改变延续数十年的海战传统。以往必须进入舰炮射程才能决定胜负的海上交锋，如今有可能在双方主力舰尚未互相发现时，便由舰载机率先展开攻击。我们将研究以航空母舰为核心的新式舰队编组，配属巡洋舰、驱逐舰与必要的辅助舰艇，为航母提供防空、反潜和水面警戒。与此同时，舰载航空兵必须接受更加严格的协同训练，使侦察、战斗机掩护与攻击任务能够在统一指挥下完成。"
 GEA_Cluster_hunting:0 "集群狩猎"
 GEA_Cluster_hunting_desc:0 "单独一架舰载攻击机即使成功发现敌舰，也未必能够突破密集的防空火力，更难以对大型军舰造成决定性损伤。只有将多支航空分队的力量集中起来，从不同方向对目标实施协调攻击，才能充分发挥海军航空兵的威力。我们将改善舰载机的编队训练与空中通信，使鱼雷机、轰炸机与护航战斗机能够在准确的时间抵达指定海域，并按照预定计划展开攻击。对于分散在辽阔海面上的敌方舰队来说，最危险的时刻或许不是发现一架德国飞机，而是意识到它的身后正跟随着整支攻击机群。"
 GEA_Armor_deck_protection:0 "装甲甲板作业"
 GEA_Armor_deck_protection_desc:0 "航空母舰虽然能够将打击范围延伸至数百公里之外，但其宽阔的飞行甲板、密集的航空燃料储备与大量机载弹药，也使它成为极易受到攻击的目标。一旦飞行甲板遭到破坏，整艘军舰便可能在短时间内失去最重要的战斗能力。我们将加强对航母甲板防护、机库防火与弹药隔离设计的研究，并改善航空作业区域的损害管制措施。尽管额外的装甲可能影响舰载机数量与舰艇航速，但德属东亚远离本土船坞，任何一艘航空母舰的损失都难以迅速弥补。确保这些珍贵军舰能够在敌方攻击下继续作战，远比纸面上的舰载机数量更加重要。"
 GEA_Covering_the_sky_and_blocking_the_sun:0 "遮天蔽日"
 GEA_Covering_the_sky_and_blocking_the_sun_desc:0 "现代海军航空战已经不再是少数飞行员凭借个人勇气便能够左右局势的竞技。想要在激烈的海上交锋中突破敌方防空网、压制对手的航空兵并掩护己方舰队，我们必须拥有数量充足、组织严密的舰载航空力量。德属东亚将扩大海军飞行员训练规模，改善航空母舰上的飞机维护与弹药补给，并强化舰队与岸基航空兵之间的协调。通过集中足够多的战斗机和攻击机，我们将能够在关键海域取得局部空中优势，使敌方舰艇不得不面对一波接着一波的空中攻击。"
 GEA_The_sea_warriors_are_fearless:0 "海上斗士无所惧"
 GEA_The_sea_warriors_are_fearless_desc:0 "海军航空兵的服役条件远比许多陆上飞行员想象的更加严酷。狭窄而不断摇晃的飞行甲板、恶劣的海上天气，以及随时可能发生的迫降事故，都要求舰载机飞行员具备出色的技术与非凡的心理素质。我们将建立更加完善的舰载航空训练体系，加强飞行员在复杂天气、夜间航行与紧急着舰情况下的训练，并改善航空母舰上的救援和医疗设施。勇气当然值得赞扬，但真正优秀的海军飞行员不能只依靠勇敢来掩盖训练不足。只有将严格纪律与娴熟技术结合起来，德国的海上斗士才能在最危险的战斗中保持冷静。"
 GEA_Making_a_desperate_dive:0 "舍命俯冲"
 GEA_Making_a_desperate_dive_desc:0 "对于在海面上高速机动的敌舰而言，高空投下的炸弹往往难以取得理想的命中率。俯冲轰炸提供了另一种选择：飞行员在接近目标后急剧降低高度，以更为准确的投弹方式攻击敌方舰艇的甲板与重要设备。然而，这种战术也使飞机更容易暴露在敌舰密集的防空火力之下。我们将加强舰载俯冲轰炸机的结构与操纵性能，改进瞄准设备，并通过专门训练提高飞行员在攻击后的脱离能力。海军航空兵必须具备攻击敌方大型舰艇的可靠手段，而每一次俯冲都应当建立在充分训练与周密计划之上，而非徒劳的自我牺牲。"
 GEA_Increase_patrols:0 "扩大巡逻"
 GEA_Increase_patrols_desc:0 "德属东亚的海疆辽阔，仅仅依靠几支集中部署的主力舰队，根本无法及时发现所有可能威胁殖民地安全的活动。走私船、潜艇、外国侦察舰艇与突然出现的敌方袭击编队，都可能利用那些缺乏巡逻力量的海域接近德国的港口和商船。我们将扩大轻型舰艇及海上巡逻机的活动范围，加强重要航线、海峡与岛屿周边的定期巡查，并建立更加完善的海上情报汇报制度。通过持续保持对周边海域的观察，总督府不仅能够更加及时地发现安全威胁，也能进一步巩固德国在南洋航运体系中的影响力。"
 GEA_Oceanic_maintenance_and_supply:0 "远洋维修补给"
 GEA_Oceanic_maintenance_and_supply_desc:0 "即使拥有最先进的军舰，一支无法及时获得燃料、弹药与维修服务的舰队，也注定无法在辽阔的海洋上长期作战。德属东亚远离德国本土，舰艇若因机械故障被迫返回欧洲船坞，往往意味着数月的战斗力损失。我们将扩大新加坡及其他重要港口的维修能力，增加海军油料、弹药与备用零件储备，并组建能够随舰队行动的补给船与维修辅助舰队。通过建立更加完善的远洋后勤体系，德国军舰将能够在远离主要基地的海域维持更长时间的部署，而不必因为每一次补给困难便放弃已经取得的战略优势。"
 GEA_Underwater_knife:0 "水下尖刀"
 GEA_Underwater_knife_desc:0 "与造价高昂、建造周期漫长的战列舰相比，潜艇能够以相对有限的资源，对远比自身强大的敌方海军构成严重威胁。世界大战已经充分证明了德国潜艇部队的作战价值，而在海域辽阔、航运繁忙的远东，这种武器同样拥有广阔的使用空间。我们将扩大潜艇部队的规模，改善鱼雷性能与水下续航能力，并加强潜艇官兵在复杂海况下的训练。无论敌人拥有多少艘主力舰，只要他们的商船与补给船仍需穿越南中国海和马六甲海峡，便必须时刻提防来自水面之下的德国鱼雷。"
 GEA_Silent_War:0 "静默战"
 GEA_Silent_War_desc:0 "潜艇真正的优势并不在于能够承受多少炮击，而在于它能够在敌人毫无察觉的情况下接近目标，并在发动攻击后重新消失于海面之下。德属东亚的潜艇部队必须充分利用这种隐蔽性，而不是将自己当作可以直接同敌方护航舰艇交战的小型水面军舰。我们将改善潜艇的水下噪声控制、蓄电池管理与潜望镜观测技术，并训练艇长根据目标航向、海流和水文条件选择最佳攻击时机。通过更加严格的无线电纪律与隐蔽航行训练，德国潜艇将能够在敌方警戒网中寻找破绽，使对手始终无法确定下一次鱼雷袭击会从何处到来。"
 GEA_Microwave_radio_magnetron:0 "微波，无线电与磁控管"
 GEA_Microwave_radio_magnetron_desc:0 "随着海上交战距离不断扩大，传统瞭望、光学测距与无线电测向已越来越难以满足舰队对远距离目标探测的需求。近年来，德国及其他工业强国的科学家正在不断探索高频无线电波、电子振荡器与磁控管技术的潜在用途，其中部分研究更有望为海军提供全新的探测手段。德属东亚应当积极争取本土科研机构的技术支持，在新加坡建立专门的无线电与电子设备研究部门，并推动相关成果在舰艇通信、目标搜索及海上导航领域的试验。尽管这些技术距离全面实用仍有不少障碍，但谁能够率先突破海战中视距与天气造成的限制，谁就可能在未来的海洋上拥有决定性的优势。"
 GEA_Immortal_Power:0 "不朽动力"
 GEA_Immortal_Power_desc:0 "舰艇的航速、续航距离与持续作战能力，归根结底都取决于其动力系统的可靠程度。对于需要长期驻扎在热带海域的德属东亚舰队而言，高温、盐雾与频繁的远洋航行更使舰用机械承受着额外负担。我们将加强对高效率锅炉、蒸汽轮机、柴油发动机及相关辅助设备的研究，改善燃料利用率与机械维护制度，并鼓励造船企业采用更加可靠的动力设计。无论未来的海战将由战列舰、航空母舰还是潜艇主导，它们都必须依靠稳定而强劲的动力才能发挥作用。我们所追求的不是永不损坏的神话，而是一套能够让德国军舰在漫长航程中始终保持战斗力的机械体系。"
 GEA_The_ruler_of_the_two_oceans:0 "两洋之主"
 GEA_The_ruler_of_the_two_oceans_desc:0 "横跨印度洋与太平洋的广阔航线，既是德属东亚繁荣的基础，也是帝国远东霸权最大的战略考验。多年以来，我们不断扩建港口、发展造船工业、整顿舰队并完善海上后勤，如今这些努力终于使德国海军拥有了更加坚实的海外作战基础。从新加坡驶出的军舰能够穿越马六甲海峡进入印度洋，也能够北上南中国海，向太平洋深处展示帝国的力量。无论我们的敌人试图依靠主力舰决战、航空攻击还是潜艇封锁挑战德国的海上交通，都必须面对一支经过长期建设、能够独立执行远洋任务的舰队。德意志帝国既然已经在世界大战中打破了英国人对海洋的独占，那么在远东，我们也绝不会轻易将两洋之间的航路拱手让给新的竞争者。"
 GEA_Expansion_of_Singapore_Air_Force:0 "翱翔天际"
 GEA_Expansion_of_Singapore_Air_Force_desc:0 "长期以来，德属东亚的航空力量始终处于陆军与海军的附属地位，除了少数负责侦察、通信和特殊任务的飞行分队之外，殖民地尚未建立一套能够独立执行大规模空中作战的组织体系。然而，随着航空技术的进步，以及日本等周边国家不断扩充空中力量，这种局面已经难以满足德国在远东的战略需求。我们将以新加坡为中心，组建更加完整的航空指挥机构，扩大飞行员与地勤人员的招募规模，并建设新的机场、机库和训练设施。无论未来的战争发生在印度支那的丛林之中，还是南中国海的广阔水面之上，德属东亚都必须拥有一支能够迅速响应、独立行动的空中力量。"
 GEA_Encourage_a_combative_spirit:0 "鼓舞好斗精神"
 GEA_Encourage_a_combative_spirit_desc:0 "航空兵的迅速发展正在改变传统军队对于勇气与战斗精神的理解。与能够依靠战壕、装甲和战友掩护的步兵不同，飞行员往往必须独自面对恶劣天气、机械故障与敌方战斗机的威胁。德国航空兵曾在世界大战中涌现出无数勇敢的飞行员，而他们的成就也证明，技术与纪律之外，坚定的进攻精神同样不可或缺。我们将加强飞行部队的荣誉教育与实战化训练，鼓励飞行员主动争取空中优势，并建立表彰优秀机组与飞行单位的制度。不过，勇敢绝不意味着鲁莽，海耶将军尤其强调，只有懂得服从命令、保持编队并完成任务的飞行员，才能真正为帝国赢得胜利。"
 GEA_Establish_an_aviation_design_bureau:0 "组建航空设计局"
 GEA_Establish_an_aviation_design_bureau_desc:0 "德属东亚现有的军用飞机大多依赖德国本土设计与制造，但欧洲航空工业所关注的战争环境，与远东的现实需要并不总是一致。热带高温、高湿度、频繁的季风，以及距离遥远的海上航线，都对飞机的结构、发动机与航程提出了不同的要求。为此，我们将建立一所专门负责航空技术研究与改良的设计机构，邀请德国工程师、航空制造商和军方技术人员共同参与，研究适合远东环境的飞机设备与维护方案。虽然殖民地暂时无法独立承担所有先进飞机的研发工作，但通过与本土航空工业合作，我们至少能够确保未来装备的飞机更加符合德属东亚的实际作战需求。"
 GEA_Aviation_Worship:0 "航空崇拜"
 GEA_Aviation_Worship_desc:0 "自莱特兄弟的飞机首次离开地面以来，航空技术便以惊人的速度发展，并逐渐成为现代国家工业实力与军事威望的重要象征。在德属东亚，飞机仍然是一种足以令普通民众驻足仰望的新奇事物，而总督府也开始意识到，航空兵的发展不仅具有军事意义，还能够成为展示德国技术成就与殖民地现代化的重要手段。我们将组织航空展览、飞行表演与公众宣传活动，鼓励青年投身航空事业，同时争取企业与私人投资者支持机场和航空设施建设。让德国制造的飞机翱翔于新加坡与印度支那上空，不仅能够激励未来的飞行员，也能向远东各国展示帝国所拥有的工业与科技力量。"
 GEA_The_naval_air_force_showed_its_power:0 "海军航空兵大展神威"
 GEA_The_naval_air_force_showed_its_power_desc:0 "德属东亚的地理环境决定了，空军绝不能仅仅将支援陆上驻军视为自己的职责。广阔的海面、漫长的航线与分散的岛屿，使海军航空兵拥有远比欧洲大陆上更加重要的战略地位。我们将扩大水上飞机、舰载机与岸基海军航空分队的编制，加强海空联合训练，并建立专门负责海上侦察、舰队掩护与对舰攻击的航空指挥机构。通过协调飞机与舰艇之间的通信，远东舰队将能够更加及时地发现敌人，并在必要时利用空中力量支援海上作战。德国在东方的制海权不能再仅仅依靠舰炮维持，来自天空的力量也必须成为帝国海军不可分割的一部分。"
 GEA_Set_clear_goals:0 "明确目标"
 GEA_Set_clear_goals_desc:0 "随着航空兵在现代战争中的地位日益提高，轰炸机的任务早已不再只是向敌人阵地投下尽可能多的炸弹。对于德属东亚而言，远东广阔的作战区域、复杂的地形以及有限的航空资源，都要求我们更加重视空中打击的准确性。无论是隐藏在印度支那丛林中的敌军指挥所、横跨山谷的重要桥梁，还是敌方港口内的弹药仓库与军事设施，只有准确命中这些关键目标，才能以最小的代价取得最大的战果。为此，我们将改进航空瞄准与投弹设备，加强飞行员在不同高度、航速和天气条件下的精确轰炸训练，并完善航空侦察与目标情报的协调机制。与其让大量炸弹徒劳地落在荒野和海面上，不如集中有限的航空力量摧毁真正重要的目标。"
 GEA_Pursuing_a_greater_magnitude:0 "追求更大当量"
 GEA_Pursuing_a_greater_magnitude_desc:0 "航空技术的发展正在使轰炸机能够携带越来越沉重的炸弹，并对过去只有重炮才能威胁的目标实施攻击。对于德属东亚而言，这意味着空军或许能够在无需调动庞大地面部队的情况下，直接威胁敌方港口、机场、军需仓库与其他重要设施。我们将加强对大型轰炸机载荷能力、机体结构和炸弹挂载装置的研究，并改进航空炸弹与相关投放设备的性能。当然，更大的载弹量往往意味着更高的燃料消耗与更加复杂的维护需求，但只要能够通过有限的出击造成足够严重的军事损失，这些技术上的困难便值得我们投入资源加以克服。"
 GEA_Forming_a_tight_formation:0 "严密编队"
 GEA_Forming_a_tight_formation_desc:0 "单独行动的轰炸机即使能够依靠航程抵达目标，也很难在遭遇敌方战斗机时保护自己。随着防空技术与截击战术不断发展，轰炸部队必须学会依靠严密的编队、相互掩护的机枪火力以及统一的飞行计划提高生存能力。我们将加强多机编队训练，改善机组之间的无线电联络，并制定更加合理的航线与集合程序，使不同中队能够在长途飞行后仍然保持完整的作战队形。对于远东这样机场分散、气象条件复杂的地区而言，编队纪律尤其重要。德国轰炸机应当作为一支能够协调行动的整体抵达战场，而不是各自为战地寻找目标。"
 GEA_Long-distance_flight:0 "长程飞行"
 GEA_Long-distance_flight_desc:0 "从新加坡飞往印度支那北部，或从南洋群岛前往南中国海的重要航道，都意味着数百乃至上千公里的航程。对于航程有限的早期军用飞机而言，这种距离足以使许多目标处于无法有效攻击的范围之外。我们将重点改善航空发动机的燃油效率，研究更加合理的油箱布局与远程导航设备，并加强机组在长时间飞行中的训练。与此同时，殖民地必须建设更多前进机场与备用降落场，以扩大空军的实际活动范围。德属东亚不能永远指望敌人主动接近新加坡，我们的飞机必须具备越过辽阔海面与复杂地形、将战争带往敌人后方的能力。"
 GEA_Day_and_night_without_stopping:0 "昼夜不停"
 GEA_Day_and_night_without_stopping_desc:0 "一场现代战争的胜负，往往不仅取决于单次攻击能够造成多少损失，更取决于能否持续削弱敌人的生产、运输与作战能力。德属东亚将改善轰炸机部队的轮换制度、地勤维护与弹药补给，使航空单位能够维持更高的出击频率，并逐步建立夜间飞行与轰炸能力。通过安排不同机组交替执行任务，我们将能够在更长时间内持续施压敌方重要军事设施，迫使其投入更多资源进行防空与维修。当然，连续作战也会迅速消耗飞机与人员，因此总督府必须确保航空工业和训练体系能够跟上不断增加的任务需求。"
 GEA_Sowing_the_seeds_of_fire:0 "播撒地火"
 GEA_Sowing_the_seeds_of_fire_desc:0 "随着轰炸机的航程与载弹量不断提高，空中力量已经不再满足于摧毁几座桥梁、仓库或军事据点，而是开始具备对敌国整片工业区与交通网络实施大规模打击的能力。德国空军的战略家们认为，现代战争的胜负不仅取决于前线部队的表现，更取决于交战双方能否维持后方的工业生产与战争物资供应。与其将宝贵的航空力量分散于无数次小规模袭击，不如集中庞大的轰炸机群，对敌方工业中心、铁路枢纽、港口设施及军需生产基地展开持续而猛烈的轰炸，使其整个战争机器逐渐陷入瘫痪。为此，德属东亚将扩大重型轰炸机部队的编制，完善大规模航空行动所需的机场、弹药储备与后勤设施，并加强多支轰炸机编队之间的协同训练。"
 GEA_Maritime_reconnaissance_unit:0 "海上侦察分队"
 GEA_Maritime_reconnaissance_unit_desc:0 "辽阔的南中国海与马六甲海峡，为敌方舰艇隐藏行踪提供了充足空间。即使德国海军拥有先进的巡洋舰与强大的主力舰队，如果无法及时发现敌方的位置，这些力量也难以发挥应有的作用。我们将扩大专门的海上航空侦察分队，装备适合长距离飞行的水上飞机和巡逻机，并加强飞行员对于舰艇识别、海上导航及无线电通信的训练。通过同沿岸观察哨、海军基地和水面舰艇建立更加完善的情报联系，航空侦察部队将成为远东舰队延伸至地平线之外的眼睛，使敌方军舰难以在德国控制的航路附近自由行动。"
 GEA_Wave_Hunter:0 "波涛猎手"
 GEA_Wave_Hunter_desc:0 "随着鱼雷轰炸机的发展，空军已经拥有了直接威胁大型水面舰艇的能力。相比传统舰炮和潜艇鱼雷，航空鱼雷能够由飞机迅速投送至敌舰附近，使原本可以依靠航速逃离水面舰队的目标，同样面临来自天空的攻击。我们将扩大海军攻击机部队，加强飞行员在低空飞行、鱼雷投放与海上目标识别方面的训练，并改善鱼雷的可靠性及飞机挂载设备。德属东亚不可能在每一片海域都部署战列舰，但只要拥有足够可靠的岸基航空兵，敌人的舰队便不能再将辽阔的海面视作安全的庇护所。"
 GEA_The_trick_of_a_generalist:0 "多面手的绝技"
 GEA_The_trick_of_a_generalist_desc:0 "德属东亚的航空力量始终面临着一个现实问题：我们的飞机数量有限，却必须同时承担侦察、海上巡逻、对地支援与战术轰炸等多种任务。倘若每一种任务都需要完全独立的机型和维护设施，那么殖民地本就紧张的航空预算很快便会不堪重负。因此，我们将鼓励航空设计部门研究能够执行多种任务的通用机型，通过合理的机体结构、武器挂架与设备配置，使同一型号的飞机能够根据作战需要承担不同职责。虽然专用飞机在某些任务上仍然更具优势，但对于需要在广大区域内灵活部署航空力量的德属东亚而言，可靠的多用途战机无疑具有重要价值。"
 GEA_The_Eastern_Tour_of_the_Jericho_Horn:0 "耶利哥号角的东方巡演"
 GEA_The_Eastern_Tour_of_the_Jericho_Horn_desc:0 "俯冲轰炸机的出现，为陆军提供了一种能够在战场上迅速实施精确空中打击的新式武器。德国航空设计师正在研究如何使飞机在高速俯冲中保持稳定，并通过专门的瞄准与投弹设备，提高其攻击桥梁、碉堡和其他小型军事目标的准确度。其中，为俯冲攻击而设计的警报装置更因其尖锐刺耳的声响而获得了“耶利哥号角”的绰号。德属东亚计划引进相关技术，扩大俯冲轰炸机部队，并加强飞行员与地面部队之间的协同训练。未来，当德国陆军在印度支那的山地与丛林中遭遇难以攻克的工事时，来自天空的精确打击或许能够为他们打开前进的道路。"
 GEA_All-in-one_model:0 "全能机型"
 GEA_All-in-one_model_desc:0 "随着航空技术的不断进步，越来越多的军事任务要求飞机同时具备较高航速、足够航程与可靠的载荷能力。然而，过度追求单一性能往往导致机型用途狭窄，使航空工业不得不为不同任务生产大量结构各异的飞机。德属东亚的技术人员认为，适当统一飞机平台与零部件，不仅能够降低生产和维护成本，也有助于缩短飞行员及地勤人员的训练周期。我们将推动模块化装备与通用航空零件的研究，尽可能使部分飞机能够承担轰炸、侦察和战术支援等多种职责。在远离德国本土工业中心的东方，能够适应不同任务的可靠设计，有时比追求极端性能的复杂机器更加实用。"
 GEA_Defect-free_design:0 "无缺陷之设计"
 GEA_Defect-free_design_desc:0 "对于驻扎在远东的航空兵而言，飞机的最大威胁未必总是敌人的枪炮。潮湿的空气、频繁的暴雨、沿海地区的盐雾以及缺乏完善维护设施的前进机场，往往足以使最先进的航空器陷入瘫痪。我们必须将可靠性与维护便利性置于航空设计的重要位置，加强发动机、机体结构与电气设备的耐久测试，并建立更加严格的零部件生产和质量检查制度。通过与德国本土航空制造商合作，德属东亚将能够逐步淘汰那些故障频发、维修复杂的装备，使飞行部队在艰苦环境中依然保持较高的出勤率。真正优秀的军用飞机，不仅应当能够飞得快、飞得高，还必须能够在最需要它的时候顺利升空。"
 GEA_The_German_ACE_s_Waltz:0 "德意志王牌之舞"
 GEA_The_German_ACE_s_Waltz_desc:0 "世界大战的硝烟虽然早已散去，但那些驾驶着战斗机翱翔于欧洲天空的德意志王牌飞行员，其英勇事迹至今仍为帝国航空兵所传颂。从里希特霍芬的红色三翼机到无数曾在西线与协约国飞行员殊死搏斗的空中骑士，德国航空兵早已建立起一套独特的战斗传统。如今，随着远东空中力量的不断扩张，我们将邀请经验丰富的老兵参与飞行训练，将他们在大战中积累的空战技巧、机动经验与战术思想传授给新一代飞行员。同时，我们也将鼓励优秀飞行员在实战演习中磨炼个人技术，并通过更加灵活的空中机动与相互掩护，充分发挥德国战斗机的性能优势。昔日的王牌们曾在欧洲天空中谱写属于自己的传奇，而今，他们的继承者将在远东的云端延续这场致命的空中之舞。"
 GEA_Depend_on_sky_Knights:0 "依赖空天骑士"
 GEA_Depend_on_sky_Knights_desc:0 "自世界大战以来，优秀战斗机飞行员始终被视作航空兵中最引人注目的精英。那些拥有惊人战绩的空中骑士不仅能够在战场上鼓舞友军士气，也往往凭借个人经验创造出新的空战战术。德属东亚将进一步重视精锐飞行员的培养，建立更完善的战绩评估与荣誉制度，并允许优秀飞行军官参与战术研究及新型战斗机的试飞工作。我们深知战争不可能完全依靠少数英雄赢得，但在航空力量相对有限的情况下，一批训练有素、能够发挥领导作用的精英飞行员，无疑能够显著提高整支部队的战斗效率。"
 GEA_Flying_Comrade_Cavalry:0 "飞翔的伙友骑兵"
 GEA_Flying_Comrade_Cavalry_desc:0 "传统的空中战斗常常被描绘成两名飞行员之间的个人决斗，但现代航空战已经证明，单纯依靠个人勇气与技巧的时代正在逐渐远去。德国航空兵在世界大战中积累的编队作战经验，应当成为我们进一步改进空战战术的基础。我们将加强双机与多机编队的协同训练，使飞行员学会相互观察、掩护与配合，并根据战场情况灵活调整队形。通过建立更加可靠的僚机制度，德国战斗机飞行员将不再需要独自承担来自四面八方的威胁。真正优秀的空中骑兵，应当知道什么时候发起攻击，更应当知道如何保护与自己并肩作战的同伴。"
 GEA_Comprehensive_protection:0 "全面防护"
 GEA_Comprehensive_protection_desc:0 "德属东亚的重要港口、工业基地与军事设施分散在广阔的殖民地领土之上，任何一处防空体系的薄弱环节，都可能为敌方航空兵提供可乘之机。我们将整合战斗机拦截部队、高射炮阵地、观察哨及机场防护设施，建立更加完善的区域防空体系，并根据重要目标的战略价值合理分配航空兵力。与此同时，地方防空部门必须加强警报、人员疏散与设施保护方面的准备，以减少空袭对生产及交通造成的损失。德国在东方的天空不能仅靠几名优秀飞行员保卫，而需要一套能够随时发现威胁、组织拦截并承受敌方打击的完整防御制度。"
 GEA_Establish_a_fire_coverage_network:0 "编制火力网"
 GEA_Establish_a_fire_coverage_network_desc:0 "敌方轰炸机一旦突破战斗机的拦截，往往便能够直接威胁重要的港口、军营与工业设施。为此，德属东亚必须建立覆盖关键目标的高射炮防御网络，合理配置不同口径的防空火炮，并改善探照灯、听音设备和射击指挥系统之间的协调。我们将加强高射炮部队的训练，使各阵地能够根据敌机的高度、航向与速度实施更加有效的防御射击，同时避免不同单位之间出现火力重叠和指挥混乱。通过将固定防空阵地与机动高射炮部队结合起来，帝国的重要设施将能够获得更加可靠的保护，即使敌方飞机突破了外围空中防线，也必须面对密集的地面火力。"
 GEA_Elite_training:0 "精英训练"
 GEA_Elite_training_desc:0 "现代战斗机的性能正在以前所未有的速度提高，而飞行员所需要掌握的技术也愈发复杂。高速空战、复杂气象条件下的导航，以及对新式航空武器的使用，都要求飞行员接受更加系统而严格的训练。德属东亚将扩建航空学校与训练机场，建立由基础飞行、编队协同、模拟空战和实战演习组成的完整培养制度，并加强对优秀飞行员的选拔。与此同时，我们还将重视地勤、航空机械师与无线电人员的专业培训，以确保飞机能够得到可靠维护。只有将先进装备与高水平人员训练结合起来，德国航空兵才能真正建立起足以应对远东复杂战场的战斗力。"
 GEA_Innovate_mobile_combat_tactics:0 "革新机动战法"
 GEA_Innovate_mobile_combat_tactics_desc:0 "随着战斗机速度不断提高，过去依靠密集队形和近距离盘旋交战的传统空战方式，已经越来越难以适应现代战场。德属东亚的航空指挥官将研究更加灵活的空中机动作战战术，充分利用高度、速度与突然性建立优势，并鼓励飞行员在保持相互掩护的同时主动寻找有利的攻击位置。我们还将加强航空兵与地面观察站之间的通信，使战斗机能够根据敌方飞机的动向及时调整部署，而不是被动等待对手进入视野。无论是在印度支那的山地上空，还是在南中国海的广阔海面，德国飞行员都必须学会依靠机动与协同掌握战斗主动权。"
 GEA_Rule_the_sky:0 "统治蓝天"
 GEA_Rule_the_sky_desc:0 "自帝国的第一批军用飞机升空以来，航空兵已经从一支负责侦察与通信的辅助力量，成长为能够独立影响陆地与海上战争进程的重要军种。经过持续的投入，德属东亚如今已经拥有更加完善的航空工业基础、训练体系、机场网络与作战指挥机构。从保护新加坡的重要港口，到支援印度支那的陆军，再到配合远东舰队控制南中国海，德国航空兵已成为维护帝国东方霸权不可或缺的一环。然而，真正的制空权绝不仅仅意味着拥有数量众多的飞机，更意味着能够在需要的时间和地点集中空中力量，击败敌人的航空兵并保护自己的部队。无论未来的敌人来自日本、中国大陆还是其他远东势力，他们都必须认识到，德意志帝国不仅拥有强大的陆军与海军，也同样有能力争夺东方的天空。"
