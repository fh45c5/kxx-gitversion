 GEA_decisions:0 "§C德属东亚，帝国明珠§!"
 GEA_decisions_desc:0 "自1926年的大英帝国崩溃以来，§g德意志帝国§!海军一直是无可争议的东方海域之主，同时也是西方列强在东方的秩序维护者。因此，§C东亚分舰队§!自然而然地承担起了管理帝国东亚殖民地的重任。然而，随着本地§V社会主义§!和§F民族主义§!浪潮逐渐崛起，§C海军政府§!这些分散的殖民地体系也在逐步失去控制力。如今，§C海军政府§!在殖民地各处的掌控力度不尽相同，而部分地区也已经慢慢被赤色分子或是其他意图争夺南洋霸权的国家所盯上。§C海军政府§!必须在此维护属于帝国的世界秩序，同时最大限度地榨取土地中的财富来供给祖国。如今摆在总督面前的有两种选择：向§N社会主义者§!与§F民族主义者§!妥协，以换取他们的合作来维持§C海军政府§!脆弱的统治；或者尽一切可能强化在各处殖民地的军事力量，以强硬而坚决的暴力机器——§P德属东亚殖民军与地方警察§!配合§C东亚分舰队§!守住自己的统治。"
