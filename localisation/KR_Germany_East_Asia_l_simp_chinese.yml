 GEA_Samoa:0 "§R德属萨摩亚§!"
 GEA_Samoa_DESC:0 "萨摩亚是德国在南太平洋的殖民据点，阿皮亚港支撑着当地的种植园贸易与海上补给。"
 GEA_Samoa_copra_processing:0 "振兴萨摩亚椰干贸易"
 GEA_Samoa_copra_processing_desc:0 "从戈德弗鲁瓦商行到德意志贸易与种植园公司，椰干、椰油与可可曾让阿皮亚成为德国南太平洋贸易的枢纽。如今新加坡的航线与帝国的市场仍在，但岛上的收购站和加工设备已经难以满足需求。我们将整修种植园道路，建立统一仓储与椰油加工设施，使萨摩亚的出产能够以更高的价值进入帝国贸易网络。"
 GEA_Samoa_Apia_harbour:0 "扩建阿皮亚港勤设施"
 GEA_Samoa_Apia_harbour_desc:0 "阿皮亚曾是德国商船、水手与殖民行政人员在南太平洋的共同落脚点。面对日本不断扩张的海上力量，仅靠一处简陋锚地已经不足以维持帝国的远洋联系。扩建码头、修理工场与补给仓库，将让商船和巡逻舰不必为每一次维护都返回遥远的新加坡。"
 GEA_Samoa_ocean_watch:0 "建立萨摩亚海空哨站"
 GEA_Samoa_ocean_watch_desc:0 "我们将以阿皮亚为中心布设沿岸警戒设施，并在港区配置防空炮和岸防工事，使这块老殖民地在太平洋发生危机时仍能守望帝国的南方航路。"
 GEA_Shandong:0 "§R德属青岛§!"
 GEA_Shandong_DESC:0 "青岛与胶州湾是德国在山东的海军、商业和工业据点。"
 GEA_liangguang_under_german_control_tt:0 "两广是德属东亚的傀儡，或德属东亚控制两广全部本土地块"
 GEA_Jiaozhou_industrial_zone_modifier:0 "山东租界工业区"
 GEA_Jiaozhou_industrial_zone_modifier_desc:0 "德资银行、港口设施与工业规划共同支撑着这片租界的工业扩张，为厂区建设和生产空间的开发提供便利。"
 GEA_Qingdao_mechanical_industrial_zone:0 "青岛机械工业区"
 GEA_Qingdao_mechanical_industrial_zone_desc:0 "青岛的港口、银行与铁路已经为工业扩张准备了条件。我们将划定新的机械工业用地，铺设厂区管线和运输设施，引进德国机床、动力设备与技术人员，建设面向山东腹地的机械制造与加工企业。"
 GEA_Qingdao_armaments_supply_chain:0 "青岛军工配套扩建"
 GEA_Qingdao_armaments_supply_chain_desc:0 "东亚舰队与驻华部队需要可靠的弹药、枪械零件和维修器材供应。依托青岛现有工业基础，我们将扩建兵工厂及其配套车间，使帝国在北方的军事存在能够获得更充足的本地生产支持。"
 GEA_Weihaiwei_shipbuilding_industry:0 "威海卫修造船工业"
 GEA_Weihaiwei_shipbuilding_industry_desc:0 "军港的扩建只有与修造船能力相结合，才能形成能够长期运转的海军基地。我们将在威海卫建设船坞、船用机械工场和配套加工设施，为山东沿岸的商船、巡逻舰与运输船提供修理和生产能力。"
 GEA_Jiaozhou_Bay_development_plan:0 "胶州湾发展计划"
 GEA_Jiaozhou_Bay_development_plan_desc:0 "胶州湾不仅是东亚舰队的北方基地，也是帝国在华工业、铁路与商业利益的门户。总督府将与德资企业共同推进胶州湾殖民地的扩建计划，扩大青岛的城市工业规模，建设军民两用工厂，改善交通，并进一步扩充深水港。"
 GEA_Weihaiwei_coastal_defence:0 "威海卫海防建设"
 GEA_Weihaiwei_coastal_defence_desc:0 "威海卫扼守山东半岛北岸，是胶州湾之外又一处能够支撑德国在华海军行动的港口。现有军港与防御阵地规模有限，无法独自承担舰艇补给、港口防空和抗击登陆的多重任务。我们将扩建泊位与补给设施，加固陆上要塞和海岸炮台，并建立防空火力网，使威海卫成为北方航线上的可靠支点。"
 GEA_Solomon:0 "§R德属所罗门§!"
 GEA_Solomon_DESC:0 "所罗门群岛连接新几内亚与南太平洋航路。殖民政府可在此发展贸易、港勤设施与沿岸防御。"
 GEA_Solomon_copra_stations:0 "整修所罗门椰干收购站"
 GEA_Solomon_copra_stations_desc:0 "所罗门群岛的椰干种植园和沿岸收购站长期依靠小型商船连接，零散的生产与运输使大量收益消耗在中间环节。帝国接管的旧特许经营网络不能永远停留在账面上。殖民政府将整修码头道路，集中修建仓库、干燥场与加工工场，让群岛经济成为德属东亚贸易体系中能够稳定运转的一环。"
 GEA_Solomon_interisland_shipping:0 "完善所罗门岛际航运"
 GEA_Solomon_interisland_shipping_desc:0 "在所罗门，连接行政站、种植园和村落的道路首先是一条条海路。新加坡的命令若只能随着偶尔到来的货船传递，帝国的统治便无从谈起。我们将整修两处主要锚地的栈桥和装卸设施，建立定期岛际运输，使邮政、医药、货物和驻军补给能够沿着固定航线抵达各岛。"
 GEA_Solomon_coastwatch_network:0 "构筑所罗门沿岸警戒网"
 GEA_Solomon_coastwatch_network_desc:0 "群岛间的水道通向新几内亚与珊瑚海，也为任何试图切断帝国南太平洋联系的舰队提供了隐蔽通路。殖民当局将组织熟悉海岸的本地向导、无线电员与海军巡逻分队，在主要锚地增设岸炮、掩体和防空阵地，并修建供侦察机使用的简易机场。群岛无需成为第二个新加坡，但必须让来犯者付出代价。"
 GEA_Hainan:0 "§A海南§!"
 GEA_Hainan_DESC:0 "海南岛位于华南沿岸，其港口连接北部湾与南海航路。"
 GEA_Hainan_ger:0 "§R德占海南§!"
 GEA_Hainan_ger_DESC:0 "海南岛扼守北部湾与南海航路，是德国在华南沿岸的重要据点。"
 GEA_Develop_Hainan:0 "建设海南港务与工业"
 GEA_Develop_Hainan_desc:0 "海南扼守北部湾与南海之间的海上通道，但岛上的道路、工场与港勤设施仍不足以支撑长期驻守。总督府将解除岛上的非军事区限制，扩建榆林港，整修岛内交通，并引入民用工业，使这处据点拥有更可靠的补给与生产能力。"
 GEA_Integrate_Hainan:0 "整合海南"
 GEA_Integrate_Hainan_desc:0 "海南扼守北部湾与南海之间的海上通道，是帝国在华南沿岸的重要据点。总督府将统一岛上的行政、税务与公共事务，建立稳定的基层管理体系，将海南正式纳入德属东亚的治理。"
 GEA_hainan_construction_completed_tt:0 "已完成§Y建设海南港务与工业§!"
 GEA_hainan_construction_completed_tt_NOT:0 "尚未完成§Y建设海南港务与工业§!"
#决议-哈尔
 GEA_hahl_saigon_cholon_grain_board:0 "西贡-堤岸粮价委员会"
 GEA_hahl_saigon_cholon_grain_board_desc:0 "西贡与堤岸控制着印度支那最重要的稻米贸易网络，但黑色星期一后的价格暴跌与商人囤积正在使市场愈发混乱。我们将召集华商、米商与地方官员成立粮价委员会，协调收购、仓储与市场投放，以避免粮价继续失控。"
 GEA_hahl_disorganize_cao_dai:0 "瓦解高台教"
 GEA_hahl_disorganize_cao_dai_desc:0 "自1926年高台教在印度支那创立后，那些迷信而愚昧的信众便纷纷投身其中。通过过去十年的野蛮生长，高台教在南圻建立起了一套横跨乡村、宗教与地方政治的庞大组织网络。而这也极大的助长了印度支那的反抗情绪。为了彻底铲除这些不安定因素，殖民政府将发动一次全面取缔。同时我们的特工也将从内部入手，拉拢地方教职人员、切断资金来源，并逐步瓦解其组织能力。"
 GEA_hahl_register_village_notables:0 "编修乡绅名册"
 GEA_hahl_register_village_notables_desc:0 "印度支那乡村真正发挥影响力的往往并非远在城市中的官员，而是地主、乡绅、族长与保甲首领。尽管殖民政府在过去十余年间力求改变这一现状，但令人遗憾的是，如今德属东亚的基层管理仍旧严重依赖那些地方豪强。如此情形之下，将这些地方名望人士逐一登记，并记录其土地、家族关系与政治立场，将是我们进一步稳定管理基层社会的唯一方法。"
 GEA_hahl_Strengthen_Catholic_missionary_work:0 "加强天主教传教"
 GEA_hahl_Strengthen_Catholic_missionary_work_desc:0 "天主教会在印度支那拥有延续数代的学校、教区与地方关系网。扩大对传教机构、教会学校与慈善事业的支持，可以让这些忠于教会的本地社群成为殖民秩序更加可靠的支柱。"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc:0 "德属东亚各地的民族、宗教、土地制度与习惯法差异极大，仅靠普通殖民官僚很难妥善处理。新的土著事务局将专门整理地方习俗、协调基层首领，并为各地区制定更符合当地情况的行政政策。"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Malaya:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Malaya_desc:0 "$GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc$"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Borneo:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Borneo_desc:0 "$GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc$"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Guinea:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Guinea_desc:0 "$GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc$"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Solomon:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Solomon_desc:0 "$GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc$"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Samoa:0 "设立土著事务局"
 GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Samoa_desc:0 "$GEA_hahl_Establish_an_Indigenous_Affairs_Bureau_Indochina_desc$"
 GEA_hahl_convene_malay_sultans:0 "召开马来苏丹会议"
 GEA_hahl_convene_malay_sultans_desc:0 "马来半岛的诸位苏丹虽然早已失去大部分实际权力，却仍然拥有重要的宗教与传统威望。如果他们能够支持帝国在东方的统治，我们的基层治理成本就能再次下降。我们将通过邀请各王室代表共商地方事务，公开确认其地位来让他们重新成为我们的合作伙伴。"
 GEA_hahl_restore_resident_advisers:0 "恢复土邦驻扎官制度"
 GEA_hahl_restore_resident_advisers_desc:0 "英国人曾通过派驻驻扎官，在保留马来苏丹名义统治的同时控制各土邦行政。恢复这一行之有效的制度，可以让德国官员以顾问名义监督财政、治安与行政，而无需彻底破坏当地传统统治结构。"
 GEA_hahl_tin_royalty_bargain:0 "矿场分成协议"
 GEA_hahl_tin_royalty_bargain_desc:0 "马来亚丰富的矿产与资源带来了可观利润，而各地王室或酋长自然希望从中分得属于自己的份额。只要愿意给予苏丹们稳定的矿业分成，他们便没有多少理由反对德国企业进一步扩大开采。"
 GEA_hahl_brunei_crown_subsidy:0 "文莱王冠补助金"
 GEA_hahl_brunei_crown_subsidy_desc:0 "文莱苏丹的领地与权威早已大不如前，但王室仍是当地政治不可忽视的象征。以固定补助维持宫廷财政并换取其公开合作，远比投入更多德国官员直接处理当地事务来得便宜。"
 GEA_hahl_north_borneo_chartered_privileges:0 "兑现地方特许权"
 GEA_hahl_north_borneo_chartered_privileges_desc:0 "北婆罗洲长期依赖公司、地方商人与传统首领共同维持基层经济。确认旧有土地、贸易与经营特许权，并给予愿意合作的地方精英新的保障，可以用有限的行政成本换取他们对现有秩序的支持。"
 GEA_Halong_Bay_Cruises:0 "下龙湾巡游"
 GEA_Halong_Bay_Cruises_desc:0 "东京沿岸数以千计的石灰岩岛峰从海面拔地而起，其景观即便在整个亚洲也堪称独一无二。组织从海防出发的小型邮轮和游艇线路，让游客在岛屿、洞穴与渔村之间穿行，应当比单纯把这里印在明信片上更加赚钱。"
 GEA_Brunei_Water_Village:0 "文莱-水上之城"
 GEA_Brunei_Water_Village_desc:0 "文莱河上的水上聚落以木桥、码头和高脚屋连成大片社区，船只甚至取代了街道的作用。对当地居民而言这只是寻常生活，对刚从不来梅下船的游客来说，却足够大开眼界。"
 GEA_Saigon_Nightlife:0 "西贡的东方夜生活"
 GEA_Saigon_Nightlife_desc:0 "宽阔林荫大道、咖啡馆、剧院、华人餐馆、赛马场与灯火通明的商业街，使西贡拥有一种欧洲旅客既熟悉又陌生的都市气质。特色料理、南洋夜色与堤岸繁华成为了吸引欧陆游客来此度假的绝佳体验，而每到夜里都市中营业的诸多服务更是能吸引无数旅行者在此挥金如土。"
 GEA_Hue_Imperial_Tours:0 "顺化皇城之旅"
 GEA_Hue_Imperial_Tours_desc:0 "阮朝昔日的宫殿、陵寝与寺庙依旧散布在香江两岸，而保大皇帝的存在更为这里增添了一层仍在延续的宫廷色彩。经过修缮的皇城完全可以成为那些对“东方君主制”充满浪漫幻想的欧洲游客必经的一站。"
 GEA_Singapore_Grand_Tour:0 "新加坡大都会之旅"
 GEA_Singapore_Grand_Tour_desc:0 "新加坡既有现代化港口、豪华酒店和欧洲商业区，也有牛车水、甘榜格南与印度街区构成的多民族城市景观。对于初到东方的德国游客而言，没有哪里比这里更适合作为一场南洋旅行的第一站。"
 GEA_Angkor_Expeditions:0 "吴哥古迹远征"
 GEA_Angkor_Expeditions_desc:0 "被森林包围的吴哥寺庙群早已吸引了无数法国考古学家与探险者。改善暹粒附近的道路、旅馆与导游服务，再把考古、摄影和“失落文明”的浪漫故事好好包装一番，吴哥足以成为整个东方最具声望的旅游目的地之一。"
 GEA_Cameron_Highlands:0 "金马仑高原避暑地"
 GEA_Cameron_Highlands_desc:0 "马来亚内陆的金马仑高原拥有难得的凉爽气候，也已经开始出现茶园、道路与山地住宅。若进一步建设旅馆、疗养院和徒步路线，这里完全可以成为新加坡与吉隆坡富裕居民逃离热带酷暑的首选之地。"
 GEA_Kinabalu_Expeditions:0 "攀登京那巴鲁"
 GEA_Kinabalu_Expeditions_desc:0 "北婆罗洲的京那巴鲁山高耸于热带雨林之上，对于博物学家、登山者和那些嫌普通假期太过舒适的欧洲人而言，这几乎是天生的探险目的地。组织向导、营地和科学考察路线，可以让昔日只有少数探险家完成的旅程成为一种昂贵而体面的冒险。"
 GEA_Mekong_Steamship_Holidays:0 "湄公河蒸汽船假日"
 GEA_Mekong_Steamship_Holidays_desc:0 "对于欧洲游客而言，坐在甲板椅上喝着冰镇饮料，看着湄公河两岸的村庄、水牛与稻田缓慢后退，大概比亲自走进那些村庄舒服得多。把现有河运航线的一部分改造成舒适的观光航程，似乎并不是什么困难的生意。"
 GEA_Orient_Express_East:0 "东方的东方快车"
 GEA_Orient_Express_East_desc:0 "印度支那和马来亚的铁路原本是为了运送稻米、锡矿、橡胶与士兵而修建的，但没有规定火车必须永远只运这些东西。加挂卧铺、餐车与观景车厢后，一趟殖民地铁路旅行同样可以成为值得出售的奢侈品。"
#约西亚斯决议
 GEA_josias_decisions:0 "§d亲王的社交圈§!"
 GEA_josias_decisions_desc:0 "凭借家族数代积累下来的声望、自己早年在军中结识的旧交，以及这些年来在商界与上流社会中经营出的关系，§d约西亚斯§!从来不缺愿意替他递话、牵线或提供方便的人。从柏林的§g王公贵胄与政界名流§!，到§m汉堡或埃森的巨头与银行家§!，再到远东那些习惯自行其是的§P官僚与军官§!，§d约西亚斯亲王§!的关系网使得他总是能找到为自己所用的人脉。\n\n不过，再牢靠的关系也不会凭空维持。正如一台精巧的机器离不开细致保养，这张横跨帝国与远东的人脉网络同样需要总督亲自经营。同时随着§d约西亚斯§!的位置的稳固，作为总督的他也能接触到更多高层政要或达官贵人，进而这些私人友谊与利益交换也能反过头帮助§d约西亚斯§!稳固他在东方的统治，甚至实现他个人的野心..."
 GEA_JOSIAS_PORTRAIT_JOSIAS_TT:0 "§Y瓦尔德克和皮尔蒙特的约西亚斯亲王§!\n§L瓦尔德克和皮尔蒙特的约西亚斯，瓦尔德克-皮尔蒙特公国亲王，弗里德里希之子，德皇陆军的将军。世界大战爆发后，军校生约西亚斯自然而然地加入了德皇军队。虽然战时他受了重伤，但却奇迹般地活了下来。\n\n约西亚斯的父亲对他的战场表现非常不满，劝说德皇把他送到德属东亚以示惩罚。但出乎其父意料，约西亚斯非常善于管理殖民地军政事务，他和航运大亨、德属东亚总督阿尔贝特·巴林走得很近。他支持巴林的政策和决议，许多人认为他已成了老人的二把手，于是他顺理成章地成为了巴林的继承人。\n\n木已成舟，现在瓦尔德克和皮尔蒙特的约西亚斯真正成为了殖民地的领导人，他决定延续前任的政策，维持着不可动摇的现状。他的父亲终于可以为他自豪了，至于约西亚斯能否维持殖民地的完整、印度支那的社会主义走狗是否会把德属东亚踢下地狱，还有待观察。§!\n"
