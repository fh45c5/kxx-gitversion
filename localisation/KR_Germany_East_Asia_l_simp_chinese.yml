#事件
 GEA.0.t:0 "东方明珠"
 GEA.0.d:0 "自1926年的大英帝国崩溃以来，德意志帝国海军一直是无可争议的东方海域之主，同时也是西方列强在东方的秩序维护者。自英国大革命以来，这位曾经的世界霸主的影响力从整个东亚与南亚退缩回区区澳大拉西亚一隅后，她昔日光芒万丈与自豪无比的殖民地和租界则陷入了无穷无尽的本地暴动与革命当中。失去领导的本地警察与驻军如无头苍蝇般束手无策，而只有新任的世界霸主——德意志帝国能为从苏伊士到青岛的租界和殖民地提供保护。在短暂的混乱后，德意志舰队接管了包括英租界，新加坡与越南等一系列前协约国殖民地。但是，任何伟业终有其代价，而这份世界霸主的重任也为新生的德意志在东方的开路先锋——德属东亚带来了诸多困境。\n\n帝国的在东方的扩张过于迅速和特殊，这使得我们必须在极度远离本土的情况下对诸多混乱的殖民地进行统治。土司，皇帝，又或者是酋长，这些地头蛇被迫承认我们的统治，但完全重建当地秩序又过于复杂，为了避免统治的瓦解，德国的殖民官员们带来了自己的管理层，也引进了本土的诸多巨型卡特尔来开发这片蛮荒之地。然而令人遗憾的是，在十余年的统治后，德属东亚仍未能真正的作为一个殖民地存在，甚至都不是一个政权。德属东亚是作为一个司法辖区而存在，而帝国东方舰队则保障了这里的脆弱秩序。在这片区域内，相对公正的帝国海军必须平衡当地利益，和本地骚乱与起义进行斗争，并确保所有人的安全。在这片脆弱的和平表象之下，帝国大企业们疯狂开采东方的一切资源并运回柏林，而此地的原住民和土著们则在暗地聚集谋划追求属于他们的真正的自由。\n\n更加令人烦恼的是，尽管当前德意志帝国的世界秩序仍在远东占据主导地位，但野心勃勃的日本对我们来说仍然是个威胁。自第一次世界大战以来，他们一直试图将我们赶出东方；而如今他们在失败后仍然筹划着新的征服，并时刻准备取代我们主导东方。我们勇敢的士兵正在使馆城市监视他们的一举一动，而我们光荣的战列舰正警惕的面对任何来自大海的威胁。毫无疑问，我们忠诚的海军将士将不惜一切代价维持帝国在东方的前进基地，并将秩序永远在此巩固。"
 GEA.0.a:0 "扬帆，启航！"
 GEA.0.b:0 "那中国呢？"
 GEA.1.t:0 "中国与监事会"
 GEA.1.d:0 "德意志祖国的在华占领区也已处于我们管辖之下，并且根据一九二八年由美国从中斡旋而签订的上海协议，德意志在中国的权利已经可以同其他外国势力平起平坐了。青岛这座城市长期以来一直是我们在华运营的枢纽，它既是一座现代化的都市，也是遍布全东亚的庞大商业网络的中心点。\n\n然而，并不是所有流经胶州湾的货物都是完全正当的。东亚总局监事会，其管理着大量的船舶、工厂、甚至还有违反一九二八年上海协议精神（非字面意义）的非正式特许经营权。\n\n为了确保从清国中央政府手中获得自治权，南京军阀孙传芳接受了一系列具有剥削性质的军械交易，并以此换取在八省联合内部的大量经济特许权。尽管没有得到北京当局以及国际社会的承认，但监事会的影响力已然遍及东南八省，并逐步深入至中华内地。\n\n最终，柏林政府希望我们可以利用中国作为某种对抗日本的缓冲区：日本人每在中国边境部署一个士兵，就会减少一点可以威胁到马来亚和印度支那的兵力。为此，德意志必须支持清国政府以及八省联合，并且必须要提防日本对中国的侵略，因为中国距离新加坡仅一步之遥。"
 GEA.1.a:0 "我们的利润，财富与威望，皆出自于此"
 GEA.2.t:0 "长久以来的秩序"
 GEA.2.d:0 "作为德意志帝国在东方的“总代表”，同时也是现今德意志世界秩序的守卫者，德属东亚的重要性自不必多言。然而，德国官员来到这里自然不可能只是为了所谓的“开化使命”或“传播文明”。在那些印着帝国鹰徽的公文、贸易合同与海军报告背后，真正维系这片殖民地运转的，始终是对东方财富近乎无休止的攫取，以及将这些财富源源不断输送回欧洲本土的庞大体系。\n\n来自中南半岛的矿藏被无数沾满血与泪的手从地下挖出，装上一节又一节货运列车，再从海防、西贡与其他港口装入难以计数的巨轮。橡胶、锡矿、煤炭、稻米与木材穿过南海与印度洋，最终成为柏林政府经济报表上一个个令投资者与殖民官员喜笑颜开的数字。德国本土所谓的繁荣与经济奇迹，有相当一部分正建立在这些遥远土地日复一日的劳作之上。\n\n过去十年间，德属东亚的资源已经遭到大规模开发，但殖民政府显然并不认为这一切已经接近极限。新的矿区与林场仍在不断划定，铁路继续向内陆延伸，大型企业也在殖民当局的默许乃至鼓励下获得更多土地和劳动力。对于那些真正生活在这片土地上的本地人而言，这意味着更长的工时、更沉重的税负，以及越来越少能够真正掌握在自己手中的土地。有人离开村庄进入矿区与码头谋生，也有人只能在殖民经济的边缘艰难维持生计。\n\n近来，有关工团主义地下组织不断壮大的传闻开始在殖民官员之间流传。码头工人的秘密集会、矿区中流传的传单，以及一些来历不明的罢工组织者，都让宪兵与情报部门提高了警惕。不过，在帝国海军、殖民警察与宪兵的共同威慑下，至少从表面上看，一切仍然井然有序。列车依旧准时驶向港口，货轮依旧满载离岸，税款依旧按期进入殖民政府的账簿。\n\n土著与平民在殖民者的阴影下艰难度日，殖民官员则期待着像威廉·佐尔夫那样把东方经历变成日后仕途的资本，而海军军人们依然站在港口与舰桥上，警惕地监视着远方海面与周围每一丝不安的迹象。至少目前而言，这套已经维持多年的秩序仍然牢固地运转着，而柏林显然没有理由认为它会在短期内发生什么变化。"
 GEA.2.a:0 "一切都在正途上稳步前进"
 GEA.3.t:0 "利润高涨"
 GEA.3.d:0 "傍晚的热气还没有完全散去，殖民政府大楼后的餐厅里已经亮起了灯。吊扇在头顶缓慢转动，把雪茄烟和烤肉的香味推向房间四角。海因里希·福格尔把餐巾铺在膝上，低头切开盘中的牛排，直到对面的卡尔·布伦纳把一份刚从财务处送来的报表推到他手边。\n\n“又涨了。”布伦纳说，“橡胶、锡矿，还有北边那几处林场。这个季度比去年同期涨了接近两成。”福格尔扫了两眼数字，嘴角立刻翘了起来。“我就说那条新铁路能派上用场吧！柏林那帮吃闲饭的去年还嫌我们修得太贵。”“矿场那边也加了班。”“这次又加了多少？”“十二小时改十四小时。当地主管说还有再往上提的空间。”布伦纳叉起一块土豆，像是在谈论仓库里多放几只木箱，“不过上个月死了十一个，有点倒霉。又是因为塌方，还有几个染病的。”\n\n福格尔停了一下，把报表翻到下一页。“十一个？”“嗯。”“补人了吗？”“那当然，附近村子还有的是人，抓就完了。”“那就好。”侍者走过来为两人添酒。福格尔举起杯子，对着灯光看了看酒液，又低头看向报表最下面那一串漂亮的黑色数字。\n\n“林场呢？”“看起来也不错。原先那几个村子已经被迁走了，这下砍伐范围可以继续往西扩了。那些蛮子闹了几次，不过宪兵去过以后就安静了。”福格尔轻轻笑了一声。“人总得学会接受现实。”\n\n“是啊，要不然就得拿枪教他们。”布伦纳也笑了。他举杯碰了碰对方的杯沿，“照这个势头，年底的数字就能起飞了。”窗外，最后一班满载木材的货车正沿着道路驶向港口。车轮碾过石板路的声音隔着玻璃隐约传来，很快又被餐厅里的刀叉声盖了过去。\n\n福格尔端起酒杯，又看了一眼那份报表。"
 GEA.3.a:0 "“也许明年我就能调回柏林享受生活了”"
 GEA.4.t:0 "按部就班"
 GEA.4.d:0 "早上六点四十分，副官会先把值更表送到舰桥上。然后是七点整的全舰点名，七点十五分还得检查甲板。七点四十分，锅炉与轮机会报告正常。八点是信号兵的例行通信训练。九点半，舰炮班会进行装填演练。十一点，记录航向与海况。到了十二点，就该吃午饭了。\n\n就算是闭着眼睛，海军少尉弗里德里希·凯勒也能背出这一整套流程。他站在舷侧，看着港口外那片几乎一成不变的海。远处几艘商船缓慢移动，更远处则只有被热气模糊的海平线。甲板上的水兵正在重新擦洗一块昨天才擦过的黄铜件，旁边还有人因为动作太慢挨了军士一顿臭骂。\n\n“今天有事吗？”凯勒问。值勤士官摇了摇头。“没有，长官。”“昨天呢？””“也没有。”\n\n凯勒点点头，和他预料中的答案没差太多。下午安排了小艇操练，随后又是一轮防火演习。演习结束时，没有人显得特别兴奋。水兵们只是拖着步子回到了各自岗位，等着下一道早已熟悉的命令。过去十年里，德属东亚分舰队真正面对的敌人少得可怜。更多时候，他们的工作只是护送运输船、封锁某个闹事港口，或者派一队水兵上岸协助宪兵搜捕本地武装。时不时有人开枪，时不时也会有人受伤，但那和海军学院课本里描绘的舰队决战到底不是一回事。\n\n凯勒靠着栏杆，忽然冒出了一个荒唐念头：要是明天日本人打过来就好了，那些本地人搞不好真能组织起一支像样的军队呢，至少也比每天对着同一片海、同一张值更表来得好。\n\n这个念头只持续了几秒钟。他很快想起十余年前那场真正的战争是什么样子：炮弹穿透装甲，轮机舱起火，海水灌进舱室，熟悉的人在几分钟里变成名单上的名字。日本海军又不是那帮拿着老步枪躲林子的游击队，哪有那么好对付。\n\n“真他妈疯了。”他低声骂了一句。\n\n“长官？”旁边的水兵抬起头。“没事，你干你的。”傍晚六点，晚餐。七点，再次巡查甲板。八点，确认锚链与灯号。九点，整理当天报告。\n\n凯勒在最后一栏写下：一切正常。看着那四个字，他停了几秒，随后合上了记录簿。明天大概也是一模一样。"
 GEA.4.a:0 "打起精神来"
 GEA.5.t:0 "倒塌"
 GEA.5.d:0 "属于东南亚的明媚太阳高悬在天际，湿热的海风裹挟着盐分与热气穿过新加坡港，将晃眼的阳光送进德属东亚总督府宽大的窗户。阿尔贝特·巴林，这位德意志帝国在东方的全权总督，一如往常坐在办公桌后，在上好的古巴烟草气味中处理着从殖民地各处送来的无休止公文。在这位志得意满的总督看来，如今的德属东亚正处在一个再好不过的时代。港口吞吐量不断刷新纪录，矿场与林场的产出持续攀升，铁路沿线新的仓库与货栈正在一座接一座拔地而起。只要秩序能够继续维持下去，这片东方领地就会为帝国、为殖民地官员，也为像他这样懂得抓住机会的人带来又一轮财富。\n\n最近，印度支那乡村中关于工团主义游击队活动的报告确实比往常多了一些。某处铁路遭到破坏，某个地方官员在回家途中失踪，还有几个矿区发现了来历不明的传单。但在过去十余年里，这类零星袭击早已成为殖民行政中近乎固定的一部分。对于这位久经商场风浪的船运大亨而言，这些事情已经很难称得上真正值得忧虑的麻烦。\n\n渐渐地，他的思绪从公务转回了自己的航运公司。由于承揽了德属东亚相当一部分人员与物资运输业务，巴林名下的船队在过去十年间迅速膨胀，一艘艘货轮在欧洲与东方之间来回穿梭，而他的个人财富也随着殖民贸易一道不断增长。想到这里，他不由得靠向椅背，吐出一口烟雾。若祖国当年没能从那场毁天灭地的大战中幸存下来，那么如今办公室里的这一切、港口中的船只，以及自己奋斗半生换来的财富，恐怕都只会成为一场遥不可及的幻想。\n\n巴林正准备按铃叫来秘书，询问下午的安排时，办公室的门却突然被猛地推开。他的秘书，一个来自萨克森的年轻人，几乎是撞进来的。对方脸色惨白，连一句完整的问候都没来得及说，便将一封刚刚收到的柏林电报放到桌上。\n\n巴林皱起眉头，已经准备斥责这位年轻人不懂规矩。然而，他只粗略扫过电报最上面的几行字，脸上的怒意便消失了。他的目光飞快地扫过整篇电报，直到最后一个字。\n\n他又看了一遍。\n\n随后第三遍。\n\n雪茄在指间静静燃烧，灰烬一点点落在桌面上，而巴林甚至没有察觉。窗外港口依旧繁忙，汽笛声此起彼伏，起重机仍在把一箱箱货物装上驶往欧洲的轮船。整个新加坡看起来同昨天、同过去十年的任何一天都没有区别。"
 GEA.5.a:0 "十年的美梦该醒了"
 GEA.6.t:0 "黑色星期一！"
 GEA.6.d:0 "目前德国的状况非常糟糕。在一场毁灭性的金融危机后，德国的经济破烂不堪，而且很快就会波及到殖民地。我们必须削减我们大部分开支，并立即寻找办法来支撑德属东亚本就疲软的经济。作为一个开始，帝国殖民办公厅已经从柏林处转达了新的命令，要求将“不必要的”驻军从八省联合的港口撤走。恢复经济可能需要很多年……"
 GEA.6.a:0 "太糟糕了！"
 GEA.6.b:0 "如此严重的情况下，我们就更不能放弃东亚的港口。"
 GEA.7.t:0 "黑色一周的结束"
 GEA.7.d:0 "自从柏林股市崩盘以来已经过去了一个星期。由于汽车行业的轮胎需求锐减，我们的主要出口商品——橡胶和锡，已经失去了一半以上的需求。与此同时，出口到欧洲市场的大米也已经停运了，人们在田地和码头上留下了成千上万吨腐烂的大米，在新加坡、西贡和其他城市里，那些储蓄很少和没有土地的人几乎失去了一切，不过他们发现自己比他们的印度支那邻居要好得多。"
 GEA.7.a:0 "如今摆在我们面前的是一个烂摊子。"
 GEA.8.t:0 "阿尔贝特·巴林之死"
 GEA.8.d:0 "丧钟敲响，伤感和压抑笼罩在每个人的身上。阿尔贝特·巴林，也不能免于这样悲哀的现实。巴林，由一个有权有势的船舶大亨，一个海军改革家，一转成为殖民地总督，正处于他的人生巅峰，至少是他到目前为止生涯的巅峰。随着大萧条以及黑色星期一爆发，经济危机来临，巴林的公司股票和运势已是一路狂跌，全线飘红，飘到更多的红色危险分子侵蚀他在东亚的一切基业。巴林年事已高，在金融负担的压力下，他的身心健康状况在急剧恶化。然而，压垮他的最后一根稻草，应该是威廉·佐尔夫之死。佐尔夫是中央非洲的前任总督，也是巴林的老朋友，商业上的老伙伴。这位珍贵盟友的噩耗传来，上了年纪的巴林悲伤到了着魔的地步，接下来的几周，他把自己锁在宿舍里，靠酒精、毒品和干硬的面包屑维生。官方对外宣称，巴林在睡梦中安然逝世，死因仅仅是心脏病突发。然而，当地政府和巴林的亲信们知道真相——他自杀了，死于止痛药，鸦片，以及德意志精神过量。他选择滑向满溢崇高极乐的下一世，将破碎不堪的此世落在身后。虽然官方迅速掩盖了真相，以保持德国驻军的无懈可击，毕竟，在我们的政权周围，印度支那分离主义者正在盯着我们虚弱的迹象，但巴林在德国的亲朋好友们也得知了这个悲剧。如今，巴林已经长眠，光荣的海军上将赫尔穆特·冯·穆克，已经宣誓成为代理总督，直到柏林宣布他正式接任。"
 GEA.8.a:0 "老朋友，长夜漫漫，一路走好"
 GEA.9.t:0 "柏林当局任命新政府"
 GEA.9.d:0 "尽管赫尔穆特·冯·穆克在阿尔贝特·巴林不幸去世后作为殖民地的临时总督尽职尽责地为德皇服务，但我们必须任命一位新的永久总督，这是德皇和殖民事务部的职责。然而，向柏林请愿也需要时间，因此我们必须等待他们的答复。人们普遍认为，德皇和他的顾问们的心中有三个主要候选人。第一个是最明显的，那就是让冯·穆克继续担任正式的永久总督——鉴于冯·穆克传奇的海军生涯和为国家尽职尽责的服务，这对大多数人来说并不难理解。然而，还有另外两位人选，那就是声名狼藉的贵族，瓦尔德克和皮尔蒙特的约西亚斯亲王，以及受人尊敬的威廉·海耶将军。这两人也都可能成为殖民地的伟大领袖，他们都有长期为德国服务的职业生涯和丰富的军事经验。然而，选择权在我们的陛下手中，我们热切地等待着他们的消息……"
 GEA.9.a:0 "皇帝选择了阿尔伯特·哈尔"
 GEA.9.b:0 "瓦尔德克和皮尔蒙特的约西亚斯亲王被任命"
 GEA.9.c:0 "威廉·海耶元帅被任命"
 GEA.9.e:0 "蒂洛·弗赖赫尔·冯·维尔莫夫斯基男爵受指派前来"
 GEA.9.f:0 "弗里茨·梅尔代表IG法本承接这一重担"
 GEA.10.t:0 "价格大俯冲"
 GEA.10.d:0 "随着国际市场的进一步动荡，大米与橡胶的价格正在德属东亚各殖民地迅速下跌。长期依赖这两类商品出口获利的农民、种植园主与贸易商首当其冲，而以相关产业为经济支柱的印度支那与马来亚所受到的打击尤为严重。仓库中积压的货物越来越多，种植园开始削减工资与用工，一些地方商人甚至已经无力偿还此前为扩大生产而借下的贷款。\n\n对于殖民政府而言，问题并非完全无法解决。通过最低收购价、紧急信贷、出口补贴乃至直接干预地方市场，我们完全有能力在某一个地区暂时稳定价格，阻止产业链立即崩溃。然而，德属东亚手中的财政与行政资源终究有限，而印度支那的大米与马来亚的橡胶都在要求同样的援助。可若我们集中力量拯救其中一方，便几乎等同于默认另一方必须独自承受危机最沉重的代价。\n\n无论选择哪一边，殖民政府都不可能让所有人满意。现在的问题已经不是是否能够阻止损失，而是我们究竟准备让谁承担这些损失。"
 GEA.10.a:0 "你说得对，但是..."
 GEA.10.b:0 "保护印度支那"
 GEA.10.c:0 "保护马来亚"
 GEA.11.t:0 "不稳定的印度支那"
 GEA.11.d:0 "自十年前帝国远征军在广州剿灭胡志明及其工团主义煽动者以来，印度支那已经维持了相当长一段时间的表面稳定。殖民当局，本地地主与德资企业共同维系着这套脆弱的秩序，而不断增长的贸易与投资也一度使人相信，那些关于民族独立与社会革命的危险思想已经随着昔日叛乱者一同被埋葬。然而，柏林股市的突然崩盘却在短短数周内击碎了这种幻想。\n\n高度依赖出口与外国资本的印度支那经济遭到了毁灭性的打击。大量码头工人与种植园劳工失去了收入，罢工与骚乱也开始从东京、安南一路蔓延至南圻国。过去本就不安分的各路人马在此刻也纷纷来到街头“共襄盛举”。这些过去彼此敌视的团体如今虽然仍然缺乏共同目标，但他们对于德国统治的不满却正在危险地汇聚到一起。\n\n然而，令新加坡的帝国总督最为忌惮的另有其人。情报部门近来的报告显示，一批过去十年间始终没有被彻底肃清的革命者正在借助经济危机迅速恢复组织。他们建立秘密联络网，在工人和农民中散发宣传品，并将分散的反殖民团体逐渐纳入一个被称作“越盟”的统一组织。根据掌握的情报来看，法国的工团主义者一直在暗中为这些赤匪提供庇护、资金乃至武器，并试图把印度支那变成攻击德意志世界秩序的一处前沿阵地。"
 GEA.11.a:0 "这块殖民地因叛乱而臭名远扬"
 GEA.12.t:0 "东京民族独立主义者的骚动"
 GEA.12.d:0 "近日东京地区的民族主义与反殖民活动明显升温。河内街头、学校乃至部分工人聚居区中，都开始出现大量宣扬民族团结、自治与独立的小册子。煽动者刻意避开殖民警察的公开监视，通过学生社团、商人网络与秘密印刷点传播这些材料，其中所使用的口号也越来越直接地把德国统治描绘成越南民族实现统一与自主的最大障碍。\n\n根据我们的地下线人，这场骚动背后最活跃的组织是越南国民党。与零散的学生团体和地方激进分子相比，他们显然拥有更加严密的组织结构，并且正在试图把城市知识分子、退伍军人和部分本地公务人员纳入自己的影响范围。\n\n我们的卧底还发现了一个更加危险的迹象：国民党成员正在有计划地接触驻扎在东京地区的本地部队，并试图在士兵与基层军官中发展同情者。所幸这些渗透行动目前尚未发展到公开兵变的程度，但其意图已经十分明显。若民族主义者能够在驻军内部建立稳定联系，那么下一次骚乱就可能不再只是街头上的传单与口号，而会演变成一场武装叛乱。"
 GEA.12.a:0 "山雨欲来..."
 GEA.13.t:0 "手忙脚乱"
 GEA.13.d:0 "东亚总参谋部的作战地图几乎已经看不见原来的颜色了。费迪南德·舍尔纳站在长桌前，双手撑着桌沿，盯着那一片从东京一路延伸至安南、南圻与老挝山区的红色标记。每一个标记都代表一次伏击，铁路爆破，又或是失踪的岗哨。参谋们仍在不断把新的电报递过来，而负责地图的年轻中尉只能一次次拔下图钉，再把它们钉到新的位置。\n\n“第三十四号公路呢？”舍尔纳突然问道。一名参谋立刻翻开文件夹。“昨晚又遭到了游击队的袭击，长官。我们的车队折了三个人和一辆卡车，而袭击者向西撤入山区，施密特少尉已经派了一个排追击。”舍尔纳抬起头。“从河内调一个连过去。”“河内的部队...正在负责铁路警戒。”“那就从海防调。”“最近的海防部队正在镇压一场码头罢工，而且——”\n\n舍尔纳一拳砸在桌面上，旁边的咖啡杯跳了一下。“我他妈不是来听你告诉我哪里不能调兵的。我需要那些混球被找出来，被消灭掉。”房间安静了几秒。参谋长小心地把另一份文件推到桌前。“这是今天上午的汇总。东京附近发现两个新的国民党据点，安南北部有三处疑似越盟营地。另外，老挝边境昨天失踪了一支巡逻队。”\n\n窗外的风吹得百叶窗轻轻作响。舍尔纳再次看向地图。过去十年里，德属东亚的部队习惯了这样的任务：一个村庄，一支巡逻队，几名躲在丛林里的游击分子。派宪兵过去，封锁道路，抓几个人，事情通常也就结束了。可现在不同。每当一支部队被派往某个地区，另一处便立即冒出新的袭击。舍尔纳的手指在地图上缓慢划过。他抓起铅笔，在地图上圈出东京、河内和安南北部的几处红点。“先把这些地方压下去。调保卫团第三营于今晚北上，铁路警备队缩短巡逻区，把能腾出来的人全部交给他们。告诉各地指挥官，见到可疑分子一概射杀，不用请示。”\n\n“是，长官。”参谋们开始记录命令。“还有，”舍尔纳把铅笔随意的甩到桌上：“给新加坡发电报。告诉总督，如果他还想保住印支，就该开始给我更多的人了。”"
 GEA.13.a:0 "“把电报送去总督府。”"
 GEA.14.t:0 "安沛暴动"
 GEA.14.d:0 "今天，在中越边境附近的雁拜军事哨所，一批越北人驻军突然发动叛乱，公开将武器转向了殖民政府。与此同时，早已潜伏在附近地区的越南国民党武装渗透者也试图响应行动，准备将这场兵变迅速扩大成一场覆盖东京北部的联合起义。一旦他们夺取军械库、切断铁路并同山区中的民族主义武装会合，整个红河流域的局势都可能在数日内失去控制。\n\n所幸，我们的情报机关早已注意到国民党人与驻军之间异常频繁的秘密联络。通过提前安插的特工和截获的通信，殖民当局赶在各地叛乱同时爆发之前破坏了他们的协调计划。忠诚部队迅速包围雁拜，切断通往铁路与军械库的道路，在短暂而激烈的交火后击退了叛军。原本计划从外围进入城镇的国民党武装也因失去内应而被迫仓促撤退。\n\n然而，这场行动很难说尽善尽美。部分叛军与国民党骨干已经逃离平原地区，正沿着通往中越边境的山路向北转移，并试图借助偏远村落与复杂地形躲避追捕，甚至还有的部队跨越边境逃亡中国。东京地区随即进入大规模戒严与搜捕状态，军警开始清查驻军、学生组织、秘密印刷点以及一切可能同国民党有关的人员。"
 GEA.14.a:0 "集中力量消灭这些强盗！"
 GEA.14.b:0 "在印度支那宣布戒严令！"
 GEA.15.t:0 "一场印度支那的悲剧"
 GEA.15.d:0 "“‘越南！越南！越南！南方的家园！’在安沛断头台前，我看见十三名死囚一个接一个发出呐喊，一个接一个身首分离。”\n\n法国记者路易·鲁博亲眼目睹了德国最近在印度支那发动的残酷镇压。印度支那曾是我们的殖民地，现在是德国殖民主义在远东的堡垒。已故印度支那革命家胡志明的密友雅克·多里奥将军呼吁立即干预印度支那。自世界大战结束以来，成千上万的印度支那学生、工人和士兵滞留在法国，成为了坚定的革命者。如果我们让他们带着充足的武器回去，他们就能在交趾支那发动一场起义，这必将动摇德意志殖民帝国的稳定，为世界革命贡献一份力。"
 GEA.15.a:0 "一路平安，印度支那同志们！"
 GEA.15.b:0 "我们不是现世的伯多禄主教"
 GEA.16.t:0 "一场印度支那的悲剧"
 GEA.16.d:0 "“‘越南！越南！越南！南方的家园！’在安沛断头台前，我看见十三名死囚一个接一个发出呐喊，一个接一个身首分离。”\n\n法国记者路易·鲁博亲眼目睹了德国最近在印度支那发动的残酷镇压。印度支那曾是我们的殖民地，现在是德国殖民主义在远东的堡垒。身处加尔各答的印度支那革命者正在四处游说寻求援助，如果我们派出装备和志愿者，在德国警察和宪兵占领东京的情况下，印度支那的革命者就可以在交趾支那发动一场起义，这必将动摇德意志殖民帝国的稳定，为世界革命贡献一份力。"
 GEA.16.a:0 "送上我们的援助"
 GEA.16.b:0 "这与我们无关"
 GEA.17.t:0 "最悲伤的人"
 GEA.17.d:0 "黑色星期一来得如此突然，以至于许多人直到一切已经无可挽回时，才真正意识到自己失去了什么。克劳斯原本只是战后德国经济停滞年代里一个再普通不过的中年人。没有显赫家世，也没有足以让人羡慕的事业。在本土苦熬多年后，他几乎押上全部积蓄，将钱投进了德属东亚的两家矿业公司与一家航运企业。事实一度证明他的选择无比正确。东方十年的黄金繁荣让矿产、橡胶与航运利润节节攀升，他也终于从一个四处寻找出路的小商人变成了东京社交场合中有资格被人记住名字的投资者。\n\n克劳斯相信德属东亚的繁荣还远没有结束，也相信柏林绝不会允许这个帝国最重要的东方资产出现真正的动摇。就在一月初，为了表示对巴林总督的支持，也为了搭上下一轮殖民航运扩张的顺风车，他又买进了一大批汉堡—美洲航运公司的股票。\n\n随后，柏林崩盘了。\n\n矿业公司停止分红，而巴林的航运企业的股价像石头一样坠落，银行则开始一封接一封寄来催款通知。更荒诞的是，连那个象征着德属东亚稳定与繁荣的巴林本人也死了。曾经被经纪人争相推荐的股票，如今即便打折抛售也找不到买家；那些印着漂亮鹰徽与公司纹章的证券，转眼之间便成了没有人愿意接手的废纸。\n\n克劳斯在东京的豪宅最先被卖掉。随后是汽车、家具、收藏品，以及那些过去被他当作跻身上流社会证明的昂贵摆设。可卖掉这一切仍然填不上资金链留下的窟窿。债主每天都来上门收债，而令人啼笑皆非的是，其中许多人同克劳斯并没有什么区别——同样是靠着过去十年的繁荣借钱、投资、再借钱的小企业主。他们上门讨债，并不是为了重新成为富翁，只是希望拿回一点现金，足够支付店里的工资，或给家人买上几天的食物。\n\n他过去最亲近的几个生意伙伴，一个已经自杀，另一个死在了南下途中，还有一人失踪至今。电话簿上的名字失去了意义，曾经觥筹交错的宴会也像发生在另一个时代。那天晚上，克劳斯喝了很多酒。他沿着东京郊外的道路漫无目的地走了很久，直到来到一座跨河桥上。远处城市的灯光依旧明亮，码头上的起重机也仍在工作，看起来仿佛那个让所有人发财的德属东亚从未消失过。酒精让他的脚步发飘，也让过去十年的回忆变得格外清晰：第一笔分红、第一辆汽车、第一次有人称呼他为“先生”，还有那些他确信自己终于逃离贫困的日子。随后，他翻过了护栏。\n\n第二天清晨，人们在下游发现了他的尸体。警方在登记表上写下姓名、年龄与死因，随后便将这张纸夹进了已经越来越厚的档案中。\n\n克劳斯或许曾经以为自己是世界上最悲伤的人。可如今，像他这样的人已经多到数不过来了。"
 GEA.17.a:0 "如此绝望的人，还不计其数"
 GEA.18.t:0 "开门，你被捕了"
 GEA.18.d:0 "裴日宁回想着自己加入越盟的过去。就在一年前，他还只是西贡街头一个不起眼的小商贩，如今却已经能够熟练地抄录情报、看守电台，并替同志们监视街区中的异常动静。他藏身的这间狭小公寓不起眼得近乎完美，既适合作为临时联络点，也方便在必要时迅速销毁文件。此刻，他正伏在桌前飞快书写，笔尖摩擦纸面的声音几乎盖过了窗外稀疏的车声。\n\n忽然，一阵急促的刹车声从楼下传来。裴日宁立刻停笔，从窗帘缝隙向外望去。一辆德军欧宝卡车正横停在街边，几名宪兵已经跳下车，快步冲进公寓楼。那一瞬间，他只觉得浑身血液都凉了下来，可手上的动作却没有半点迟疑。他将电台塞进预先准备好的暗格，又把桌上剩余的文件一股脑扔进壁炉。火焰很快舔上纸角，字迹卷曲发黑，最后化作一片片灰烬。\n\n楼梯间的军靴声越来越近。裴日宁靠在墙边，强迫自己压住呼吸。他已经做好了最坏的准备，甚至开始想象门被撞开后会发生什么。\n\n可脚步声却在楼下停住了。紧接着，一阵德语吼叫、家具翻倒的闷响和突然爆发的枪声从下一层传来，随后又响起一声小型爆炸，整栋楼都微微震了一下。几分钟后，楼道重新安静下来。裴日宁再次凑到窗边，只看见那队宪兵押着几个人走出公寓，重新登上卡车，很快消失在街道尽头。\n\n他站在窗边许久没有动，直到胸口剧烈的心跳终于慢慢平复下来。\n\n今晚，他们显然找错了门。"
 GEA.18.a:0 "长官，你们要抓的人住对门"
 GEA.19.t:0 "东京民族主义者暴乱"
 GEA.19.d:0 "如今印度支那的局势开始急转直下，曾经在东京小规模爆发的民族主义运动在一夜之间演变成了大规模的暴乱。在城市的主要大道上，情况尚且可控，绝大部分的暴乱者仍旧保持着一定的组织。然而在城市郊区与乡村，大量的民族主义者袭击政府，对街边的商铺打砸抢烧。而这场民族主义运动的背后也有着越盟那些赤匪的推波助澜，大量的工团主义宣传册也在人群中如同病毒一般传播。在一些地区，宪兵与警察难以应对如此规模的暴乱，纷纷放弃阵地，而另外有些地区爆发了流血冲突，甚至有小部分的本地人警察也加入了暴乱的队伍。我们必须在这一团乱麻演变成更糟糕的起义前阻止这一切。所幸，这场暴乱的幕后领导组织，据信是越南国民党的成员已经提出了一系列条件，其中包括了释放政治犯，开放政治戒严以及归还权力给皇帝等诸多条件。现在摆在我们面前的有两种选择，究竟是要与他们谈判，还是重拳出击镇压事态？"
 GEA.19.a:0 "同意他的绝大部分要求"
 GEA.19.b:0 "同意他的部分要求，但作为回报，我们需要他背后的赤匪的情报。"
 GEA.19.c:0 "对任何暴乱分子均可射杀，不留一人。"
 GEA.20.t:0 "南圻国局势不稳"
 GEA.20.d:0 "在我们部队开入东京直接镇压民族主义者之后，印度支那的局势变得越来越糟糕了。尽管罢工看起来有所减少，但根据我们的报告显示那些工会人士经常秘密集结起来举行会议。而且有传言称已经煽动者伪装成僧侣和商人秘密越境，在交趾支那和安南的农村地区组织农民叛乱。另一份报告显示越来越多的越南流亡者也在秘密返回印度支那，他们可能是在法国佬或者英国佬的资助之下来颠覆我们的统治的。"
 GEA.20.a:0 "我认为这是暴风雨前的宁静"
 GEA.21.t:0 "西贡码头大罢工"
 GEA.21.d:0 "随着越盟的宣传攻势愈演愈烈，印度支那的南部地区的罢工越来越多，而如今，我们在印度支那的最大造船厂也是最大的港口，西贡码头也爆发了有史以来最大规模的大罢工。团结在一起的工人组织起来控制了整个码头，甚至我们的三位德国官员也落入了他们手里。他们要求我们减少工人工时，提高码头与造船厂工人待遇等等要求。目前，总参谋部里分为了两股势力，温和派认为如果我们贸然镇压，很有可能会造成西贡港口与船厂的瘫痪，极大的打击东亚分舰队的实力。而以费迪南德·舍尔纳为首的激进派则一再催促我们排除武装部队消灭这场叛乱。"
 GEA.21.a:0 "我们需要让步"
 GEA.21.b:0 "宪兵队，出动！"
 GEA.22.t:0 "在康道尔群岛发生的越狱"
 GEA.22.d:0 "今天我们在康道尔群岛上的中央监狱发生了一场大规模的越狱！一部分囚犯不知道从何处绕过了监狱的严密看守，搞到了一些武器，其中包括了数十支手枪，十余杆步枪与数量不明的手榴弹。暴乱的囚犯在傍晚向着看守发动了攻击，几十名守卫被击毙，而发动暴乱的囚犯也在随后被镇压。数十名暴乱的囚犯被击毙，而另外有八人被俘虏。但这部分暴乱的囚犯实际上只是吸引守卫注意力的牺牲品。在随后的清查中，狱卒发现了三条通往外界的密道，而有大约150名囚犯逃走了，这些人大部分是左翼煽动者或是政治犯。这显然是一个有组织的行动；囚犯们趁着夜色的掩护下从地道逃走，然后踏上了被预先准备好的船只，消失在湄公河三角洲的沼泽地中。尽管我们已经派出了大规模的搜索队，还在印度支那全境张贴了难以计数的通缉令，但我们心里都清楚这些只是无用功。"
 GEA.22.a:0 "更大的灾难也许就要来了，相信我......"
 GEA.23.t:0 "平定公社运动"
 GEA.23.d:0 "平定省，曾经的西山朝叛军的发源地，戏剧性的目睹了一场农民革命的升级。示威者们最初要求结束相当于农奴制的义务劳动，但被该地行政当局无视了。愤怒的农民开始烧毁行政大楼、城镇大厅和火车站，破坏税务登记，抢劫警察局。当地政府已经停止了运转，而被称为“公社”的结社也秘密组织起来，暴乱的农民已经占领了市中心的政府大楼，而疑似赤匪的煽动者也大量的混迹在了这些农民之中。这一运动已经开始蔓延到安南内部和湄公河附近，而在印度支那的南方，报告中声称游击队起义烈度比以前扩大了几倍不止。很显然，越盟是这些革命运动的幕后黑手！如果我们能够及时的稳定平定省乃至西贡地区的骚乱与暴动，我们也许能够安然度过这次危机，甚至能够一举剿灭困扰我们许久的赤色威胁；但一旦情况失控，整个印度支那都将有样学样，揭竿而起......"
 GEA.23.a:0 "也许我们可以平和地解决这个问题，同意暴乱农民的要求，并向他们发放补偿。"
 GEA.23.b:0 "用军队去镇压他们！同时封锁整个平定省，对任何可疑分子进行抓捕，必要时刻允许射杀。"
 GEA.24.t:0 "华商请愿"
 GEA.24.d:0 "黑色星期一引发的市场崩溃以难以想象的速度越过欧洲，波及德属东亚各地。出口骤减、信贷紧缩以及粮食贸易秩序陷入混乱，导致印度支那与马来亚的大米价格以闪电般的速度下跌。对于依赖大宗粮食贸易维持生计的华商而言，这场危机尤其危险：仓库中的米袋越堆越高，买家却越来越少，过去依靠短期贷款周转的商号也开始在银行催债下接连倒闭。\n\n来自西贡、堤岸、新加坡与槟城的华商会馆因此联合向殖民政府递交请愿书，要求当局立即干预市场。他们主张由政府设立最低收购价格、扩大公共采购，并向仍有偿付能力的粮商提供紧急信贷，以阻止米价继续失控下跌。商会代表警告称，如果任由市场自行崩溃，受影响的绝不会只有几家华人商号；码头、运输公司以及依靠稻米出口维生的农民都会被一并拖入危机。\n\n政府当然清楚这些要求并非毫无道理，但问题同样十分明显。财政收入正在下降，而马来亚的橡胶种植园主、印度支那的欧洲企业与其他出口商也在争相要求援助。若现在为了稳定米价投入大量资金，其他产业势必也会要求得到同等待遇。然而，若什么都不做，眼前的市场混乱恐怕只会继续扩大。"
 GEA.24.a:0 "我们必须稳住粮食市场"
 GEA.24.b:0 "只能提供有限的财政干预"
 GEA.24.c:0 "这也要钱那也要钱，那你以前怎么不多交点税？"
 GEA.25.t:0 "平定公社的叛乱被平息了"
 GEA.25.d:0 "平定省的农民起义在我们装备精良的殖民军面前不堪一击，许多没见过世面的土鳖农民在见到了我们的坦克后就仿佛见了鬼一般惊恐地嚎叫着向后跑去，而作为回应的只有坦克的机枪子弹。在不到半小时内，这些手无缚鸡之力的农民就被屠杀殆尽。而对于死守政府大楼的叛乱分子，作为镇压总指挥官的费迪南德·舍尔纳则直接动用了重炮彻底将其炸毁了。尽管这造成了成百上千的市民伤亡以及在城市中的惨烈破坏，但在血腥费迪南德眼中这些都是必要的代价罢了。与此同时，越盟的叛军见事态的发展不利于他们的阴谋开展便只能提前发动了起义，然而这种缺乏支持的乌合之众很快就被我们与支持我们的本地民兵所镇压。数名越盟领导人被捕，而以阮安宁为首的死硬叛乱赤匪逃脱进了丛林之中。尽管未能将越盟彻底铲除，但在可预见的未来十数年中，赤色运动将在印度支那彻底销声匿迹。"
 GEA.25.a:0 "重拳出击！"
 GEA.26.t:0 "平等省的农民起义消散了"
 GEA.26.d:0 "在我们同意了暴乱农民们的要求并向他们证明了我们的诚意后，相当一部分的农民散去了，只留下了很少一部分的死硬分子依旧占领着政府大楼。但这些农民也最终因为缺少补给而不得不放下武器向我们投降。与此同时，越盟的叛军见事态的发展不利于他们的阴谋开展便只能提前发动了起义，然而这种缺乏支持的乌合之众很快就被我们与支持我们的本地民兵所镇压。数名越盟领导人被捕，而以阮安宁为首的死硬叛乱赤匪逃脱进了丛林之中。尽管未能将越盟彻底铲除，但在可预见的未来十数年中，赤色运动将在印度支那彻底销声匿迹。"
 GEA.26.a:0 "他做着成为英雄的美梦..."
 GEA.27.t:0 "这他妈谁印的？"
 GEA.27.d:0 "宪兵队最近在河内、西贡与海防连续查获了一批民族主义与工团主义宣传品。起初，这些传单并未引起太多注意，毕竟印度支那的地下组织早已习惯在夜间张贴标语、散发油印小册子，宪兵队的军官们早就对此见怪不怪了。然而，情报部门很快发现了一个无法忽视的问题：这些新出现的宣传品无论纸张、油墨还是排版质量，都远远超出了当地那些建在密林里的破烂印刷所能够长期负担的水平，部分刊物甚至采用了只有大型印刷企业才会使用的设备与字体。\n\n进一步调查很快把矛头指向了欧洲：被缴获的账册与信件中出现了巴黎和伦敦的秘密联络地址，而几名被捕的中间人也供认，资金与印刷器材正通过南亚和中国沿海的贸易网络不断流入印度支那。殖民政府毫不怀疑，法兰西公社与不列颠联盟正在有计划地扶植东方的反德组织，通过为越盟及其他地下团体提供资金、宣传材料乃至训练渠道，来削弱德国的海外力量。"
 GEA.27.a:0 "告诉海关严加审查"
 GEA.28.t:0 "种植园集体罢工"
 GEA.28.d:0 "橡胶的价格持续下跌，许多种植园主决定解雇多余工人，让其余的人全天工作。这些决定引发了印度支那和马来亚种植园的大规模罢工。工人要求雇主停止裁员，并要求恢复原来的工作时长以及获得更多的薪水。由于大多数种植园工人都是文盲，所以我们怀疑那些左翼分子有可能是背后的煽动黑手。"
 GEA.28.a:0 "镇压罢工"
 GEA.28.b:0 "试着和他们谈判"
 GEA.29.t:0 "东京大罢工"
 GEA.29.d:0 "令人绝望的消息在黑色星期一之后仿佛地域的邀请函一般接连不断的飞驰而至。昨日我们在东京的军工厂有三名工人在听信了赤匪的宣传后带领了一小撮好事的工人罢工以要求改善待遇，而那个蠢猪一般的负责人竟然要求守卫开火镇压。毫无疑问的，这导致了一系列可怕的连锁反应，先是整座工厂都陷入瘫痪，进而全市罢工以反对我们的劳动条例制定，如今几乎整个东京地区都成为了暴乱的温床。现在城市的警察乃至于地方的宪兵队已经很难维持秩序，政府机关也几近瘫痪。几乎整个总参谋部都认为如果此时不派遣军队，那么就将为时已晚，但一旦事态激化，后果不堪设想。"
 GEA.29.a:0 "这已经不是罢工，是暴乱！所有反抗分子都允许击毙！"
 GEA.29.b:0 "谈判为上..."
 GEA.30.t:0 "武尔坎火山和凯亚火山爆发！"
 GEA.30.d:0 "今天，拉保罗市遭受了两次大规模火山爆发的袭击。尽管我们尽了最大努力，仍有数百名市民未能及时逃离，被埋在废墟下。圣心会的传教士观察到了火山的爆发，并迅速在他们位于赫伯特山丘的传教总部建立了一个疏散营地。数千名受伤和无家可归的人正在等待殖民当局在这场灾难后提供援助。"
 GEA.30.a:0 "我们必须得做点什么"
 GEA.31.t:0 "不幸者"
 GEA.31.d:0 "安南，这片土地承载了漫长的历史，也哺育了无数勤劳肯干的农民。陈旺一家的农场就坐落在安南的一处肥沃土地上，与十余户农家为伴。在过去的日子里，他们一家就像其余印度支那乃至东南亚的寻常农家一样，日出劳作日落而息，指望着喜怒无常的大自然过活。对于陈旺来说，尽管这样的日子一眼就能望到头，但至少能养活自己和妻子，还有自己的两个孩子。虽然在十几年前德国佬赶走了法国佬，可这对自己的生活也没什么改变，也不过是自己缴上的税落到了德国鬼子而非法国佬手里，有些时候的徭役也变成了给德国佬修碉堡。他不关心骑在自己头上的人是谁，只想着怎么能让自己的小家庭更加幸福地活下去。\n\n命运的喜怒无常总是让人绝望，黑色星期一的到来摧毁了无数普通越南人的生活，而陈旺一家也几近分崩离析。他们赖以生存的稻米买卖彻底散了摊子，大量的水稻没有人买，而自己妻子的手工活计也没了希望。如同在大萧条下挣扎的无数印度支那百姓一样，对于德国人来说几个财政报告的赤红的数字，就代表了他们这原本幸福的家庭的支离破碎。唯一能够让这个勤劳朴实的农民感到庆幸的是，至少他们家目前还不至于饿死。然而德国宪兵队的到来彻底打碎了这最后的一切希望。宪兵们以搜查赤匪为名挨家挨户的劫掠，如果拿不出足够的“礼物”，轻则打到半死，重则全家被烧。陈旺亲眼看着自己的邻居一家被德国宪兵如同托死狗一般拉到院子里，再一把火连着自己的房子被烧个干净。\n\n尽管献上了自己能够掏出的一切，但德国人还是以“暗通匪谍”为名抓走了自己的大儿子，而自己的妻子则在试图保护她的孩子时被一枪打死。德国人走了，留下了无数破碎的家庭，留下陈旺带着自己的小儿子在夜幕的笼罩下相依为命。在饥饿的笼罩下，陈旺挣扎在半梦半醒的边缘，他不知道明天的太阳会不会升起来，他也不知道自己与儿子明天还能否活下去..."
 GEA.31.a:0 "他只知道黑鹰的阴影仍存..."
 GEA.32.t:0 "专员车队遇袭"
 GEA.32.d:0 "印度支那的晴天总是伴随着湿热的水汽，而这种天气对于[GEA.getleader]总督来说尽管已经习以为常，但总是不那么令人愉快。在经历过噩梦般的三天后，[GEA.getleader]总算结束了自己在印度支那的短暂视察，在经历了令人足以气到昏厥的地方视察与官员任免后，[GEA.getleader]庆幸自己终于能从这摊子乱麻中抽身了。上午九时，总督的武装车队从西贡出发，准备前往据此数十公里的德军基地的机场乘机返回新加坡。在位于队伍最中心的装甲车中，总督无数次的抱怨并不舒适的乘车环境，但也只能就此接受，毕竟在这种危机四伏的地带，袭击总会随时降————转瞬之间，在队伍最前方行驶的一辆摩托车被巨大的爆炸声炸上了天，而道路两边大量的枪声与爆炸声让他的的血液几乎凝固。他痛恨于情报局的无能，但情况也不容他过多思考，只能寄希望于自己的武装卫队能够为他赢得生机。万幸的是，在一番激烈的交火后，护卫队以惨重的伤亡击退了伏击的越盟军队，而在随后的三天内，无数的德军宪兵如疯狗般被派了出去，数以千计的疑似牵连者被捕入狱。"
 GEA.32.a:0 "他妈的无法无天了？"
 GEA.32.b:0 "刨地三尺，也要把袭击策划者找出来！"
 GEA.33.t:0 "口腹之欲"
 GEA.33.d:0 "德属东亚的军需部门最近提交了一份颇令人头疼的报告。帝国陆军现行的野战口粮大多按照欧洲气候与作战环境设计，其中常规的黑麦面包、腌肉、香肠乃至部分罐头，在印度支那与马来亚的高温高湿环境下往往保存不了多久。密封不严的食品会迅速发霉，而士兵们在丛林中背着一整套沉重的口粮行军数日后，真正愿意吃下去且还能下口的东西往往只剩咖啡、饼干与罐头肉。更糟糕的是，漫长的海运意味着许多来自本土的补给品在抵达新加坡或西贡时便已损耗了一部分保质期。\n\n军方因此提出了数种解决办法。最简单的做法是进一步扩大本地采购，在驻军周边直接征购大米、鱼干、茶叶、热带水果与其他容易获得的食物，再由军需部门统一分装。这种办法便宜而实际，却会让各地部队的伙食标准更加混乱，也可能在战时使军队过度依赖当地市场。此外，另一种更加直接的方案则是向本土食品与化工企业发出新一轮军需订单，要求开发更耐高温、更易密封且适合远洋运输的东方专用口粮。这样的方案能够维持帝国统一的后勤标准，也许还可能为提振低迷的德国企业市场，只是柏林方面未必乐意为了几万名远东士兵重新调整生产线。\n\n最雄心勃勃的计划则要求殖民政府自行投入资金，在新加坡与印度支那建立专门的食品加工与军需研究设施，利用本地原料开发一整套适用于丛林、岛屿与热带海岸作战的新型口粮。从脱水米饭、浓缩汤料到耐热肉罐头，一切都可以重新设计。当然，这也意味着我们必须为士兵的一日三餐投入一笔相当可观的财政支出。"
 GEA.33.a:0 "让本地市场解决士兵们的肚子"
 GEA.33.b:0 "把要求送回德国，让本土企业想办法"
 GEA.33.c:0 "为东方战场开发一套真正的新口粮"
 GEA.34.t:0 "东方军粮计划"
 GEA.34.d:0 "在确认德属东亚现行单兵口粮难以适应热带气候后，军需部门终于获得了殖民政府的批准，开始开发一套专门面向东南亚驻军的新型军粮。不过，真正进入设计阶段后，各部门很快就在口粮的改进要点这一问题上产生了分歧。\n\n军中的一线军官坚持认为，军粮首先必须足够耐储存。高温、潮湿与漫长运输会让不少本土食品在抵达前线前便开始变质，因此最值得投入的方向应当是密封包装、防腐技术与耐热处理。只要士兵的单兵口粮能够安全保存几周甚至几个月，味道差一些并不是什么大问题。\n\n而也有军官则更重视重量与体积。印度支那的丛林、山区与土路意味着士兵往往必须自己背负数日补给，因此脱水食品、压缩口粮与浓缩饮料应成为核心。要是能减少每名士兵身上的几公斤负担，对长途行军而言可能比多带几块肉罐头更加有所帮助。\n\n还有军医与部分后勤部门人员提出，真正的问题其实是营养。长期在炎热环境下行动会大量消耗盐分与体力，传统高脂肪口粮并不适合这种条件。他们希望新军粮增加盐分、维生素、茶饮与更容易消化的主食，让士兵在连续数日作战后仍能保持基本状态。毕竟干嚼像木柴一样的寡淡口粮可没法让士兵们提振士气。\n\n但总之，如今的预算定然并不足以让三个方向同时达到理想标准。我们必须先决定，这套“东方军粮”究竟最应该解决什么问题。"
 GEA.34.a:0 "先保证它不会在箱子里烂掉"
 GEA.34.b:0 "越轻越好，士兵可不是骡子"
 GEA.34.c:0 "先让士兵吃完还能继续走路"
 GEA.35.t:0 "最终口粮定型"
 GEA.35.storage.d:0 "经过近一年的试验、退回修改与前线测试，德属东亚的新型单兵口粮终于完成定型。按照军需部门最初确定的方向，研发人员把绝大部分精力都放在了保存问题上。新的口粮大量采用经过改良的罐藏、密封与防潮处理，包装也被重新设计，以尽可能隔绝热气、水汽与虫害。即便在新加坡仓库或者印度支那内陆的高温环境中存放数月，食品仍能维持在可以安全食用的状态。\n\n这种选择当然也付出了代价。为了确保稳定性，部分食品的口感被牺牲，罐头与硬饼干依旧谈不上令人期待，一些士兵甚至抱怨新军粮最大的优点就是“无论放多久，吃起来都和刚出厂时一样像在嚼树皮”。不过，对负责后勤的人而言，这已经足够令人满意。过去那种一批补给还没送到前线就因霉变而被整箱丢弃的情况，如今终于得到了明显改善。\n\n首批量产订单已经下发，新加坡、西贡与海防的军需仓库也开始逐步换装。这肯定不是世界上最美味的军粮，但至少在未来漫长的热带治安战中，我们不用再担心士兵打开罐头时首先闻到的是腐败的气味。"
 GEA.35.lightweight.d:0 "经过近一年的试验，德属东亚军需部门终于拿出了第一套真正以携行为核心设计的单兵口粮。罐头被尽可能缩小，部分主食改用脱水和压缩形式，饮料、汤料与调味品则被装进轻便的小包装中。相比过去那套从欧洲直接照搬而来的标准配给，新式军粮在满足数日基本需求的同时，明显减少了单兵需要背负的重量与体积。\n\n最初的前线测试很快证明了这种设计的价值。在印度支那山区进行长距离行军的部队不再需要为了多带几天食物而背上沉重的铁罐和木箱，一名步兵能够随身携带更多弹药、饮水或者其他必要装备。军需官也发现，同样一辆卡车现在能够装下更多份数的补给，对那些道路条件糟糕、运输能力有限的地区而言尤其重要。\n\n当然，这份口粮也并不尽善尽美。脱水食品需要可靠的饮水才能恢复到勉强像样的状态，压缩食品则被不少士兵讥讽为“能吃的砖头和水泥”。但即便抱怨不断，真正参加过数日丛林行军的人几乎都承认，他们宁愿忍受一顿难吃的晚饭，也不愿再把几公斤多余的铁罐背上一整天。\n\n新式轻量口粮已经获准全面投产。至少从现在开始，士兵不必再把自己的补给袋当成第二个敌人。"
 GEA.35.nutrition.d:0 "在持续近一年的研发后，德属东亚的新型单兵口粮终于完成了最后一次营养测试。与其说它是一套传统意义上的军粮，不如说它更像是军医、食品企业与军需部门共同设计出的一套热带生存方案。相比过去大量依靠面包、肉罐头与高脂食品的本土配给，新军粮增加了更容易消化的米类主食、盐分补充、茶饮、脱水蔬菜与水果制品，并特别强化了在高温环境中容易缺乏的营养成分。\n\n试验部队最初对此并不抱太大希望。一些军官甚至嘲笑军医们想把军需仓库变成疗养院。然而数轮长途行军测试之后，结果却相当明确：采用新配给的士兵在连续数日高温行动中的疲劳、脱水与肠胃问题都有所下降，而因为饮食不适导致的非战斗减员也明显减少。味道算不上出色，但至少士兵吃完之后仍有力气继续赶路。\n\n为了达到这些标准，军需部门也不得不接受更复杂的原料采购与更高的生产成本。不过在热带地区，病号、掉队者与失去战斗能力的士兵同样会消耗运输与医疗资源。从这个角度看，让他们从一开始就吃得更合适，或许反而是最便宜的办法。\n\n如今，这套新军粮已经正式获得采用。它大概不会让任何士兵期待下一顿饭，但如果能够让他们在吃完之后继续行军、继续战斗，那么这就够了"
 GEA.35.a:0 "能吃就算成功"
 GEA.35.b:0 "总算有人记得士兵还得背着它走路"
 GEA.35.c:0 "首先得让大头兵们撑得住"
 GEA.36.t:0 "军靴之下的正义"
 GEA.36.d:0 "近日，一名驻扎在印度支那的德国陆军士兵因一桩极为恶劣的案件被宪兵逮捕。根据目前已经确认的证词，他在休假期间醉酒闯入一户越南居民家中，抢夺财物，并在遭到阻拦后开枪射杀了两名成年男子，随后又纵火焚烧房屋，造成数名家属严重烧伤。更糟糕的是，案发后他还曾试图依靠军人身份威胁附近目击者，要求他们对殖民警察保持沉默。\n\n消息传出后，河内、西贡与顺化舆论迅速沸腾。当地报纸连续数日刊登死者家属与目击者的证词，商会与学生团体则以大规模游行表达愤怒与不满。一些地方名流乃至本地官员都要求公开审判，并以最严厉的刑罚处置凶手。如果政府再度像以往一样选择偏袒军队，那么印度支那地区的恶劣局势则必然雪上加霜。与此同时，军方内部却因此爆发了激烈争论。以费迪南德·舍尔纳为首的一批强硬军官坚持认为，此时公开把一名德国士兵作为罪犯审判，无异是让蛮子们把殖民政府的脸皮踩在脚下。他们承认当事人的行为“极不光彩”，却仍主张将其无罪释放或仅作内部惩戒。但总参谋部和海军中仍有不少军官无法接受这种做法。对他们而言，问题已经严重到无法视若无睹，但他们同样反对一场公开的政治审判。公开庭审只会让印支民族主义者把法庭当作控诉殖民统治的舞台，也会迫使军方在公众面前承受前所未有的羞辱。因此，他们提出了一条更现实的折中道路：取消公开审判，将涉案士兵交由军事法庭闭门处置。罪行必须受到惩罚，但具体证词、量刑过程以及军方内部责任无需暴露在公众面前。\n\n新加坡当局现在必须作出选择。严惩案犯或许能够证明法律仍然具有意义，却必然严重伤害陆军乃至整个殖民政府。无罪释放能够维护所谓军队尊严，却几乎等同于公开承认德国军人在印度支那享有杀人不受惩罚的特权；而闭门审理虽然最为稳妥，也难免被视作另一种形式的包庇。"
 GEA.36.a:0 "军队不能向街头舆论低头"
 GEA.36.b:0 "公开审判，并依法严惩"
 GEA.36.c:0 "交给军事法庭秘密处理"
 GEA.37.t:0 "殖民危机暂缓"
 GEA.37.d:0 "距离黑色星期一的冲击席卷德属东亚已经过去了三个月。最初那段时间里，几乎每天都有新的坏消息送进总督府：大米与橡胶价格暴跌，骚乱和政治煽动也随之不断增加。政府内部一度弥漫着近乎绝望的情绪，甚至有人开始私下讨论，这套维持了十余年的殖民秩序是否真的已经走到了尽头。\n\n如今，情况总算出现了一些好转。价格干预以及对关键企业和贸易网络的扶持，至少阻止了最危险的经济连锁崩溃。部分港口的货运量开始恢复，殖民财政虽然仍远未回到危机前的水平，却已经不再以同样惊人的速度恶化。当然，没有人会把眼下的局面误认为真正的繁荣。失业仍然严重，许多商号和种植园依旧在勉强维持，而民族主义者与工团主义者也并没有因为经济稍有起色便自动消失。\n\n但在经历了四个月几乎没有尽头的坏消息之后，仅仅能够重新获得一点喘息，本身就已经足够令人庆幸。至少，现在看起来是这样。"
 GEA.37.a:0 "数月来的第一个好消息"
 GEA.38.t:0 "西门子的东方赌注"
 GEA.38.d:0 "随着德属东亚的经济状况逐渐稳定下来，一批德国巨企也重新开始审视这片曾经利润丰厚的东方市场。其中行动最快的，正是西门子。作为帝国电气工业最重要的巨头之一，西门子的工程师早已参与过从电报线路到城市电网、从有轨电车到工业电动机的一系列大型工程，而如今，公司董事会认为，德属东亚恰好提供了一个足以将这些技术全部付诸实践的新舞台。\n\n西门子方面提出的计划将以港口与主要城市为核心，对东亚殖民地基础设施进行一轮系统性投资。新加坡与西贡的发电设施将首先得到扩建；与此同时，公司还希望参与铁路信号，电报网络以及城市有轨电车系统的建设。若计划顺利推进，电线与通信线路将把港口、工厂、铁路和殖民政府的行政中心更加紧密地连接起来。\n\n对于殖民政府而言，这份提案来得正是时候。过去十年的粗放统治已经让不少基础设施不堪重负，而经济危机又使政府财政无力独自承担大规模建设。西门子愿意提供技术人员、设备乃至部分前期资金，条件则是获得长期工程合同、优惠土地以及在部分公共事业中的经营权。换而言之，我们可以少花许多钱，却也必须允许一家德国企业在殖民地的电力与通信命脉中占据前所未有的位置。西门子的代表对此倒是毫不避讳。在他们看来，这既不是慈善，也不是单纯为了帮助殖民政府渡过难关。只要德属东亚能够恢复增长，那么今天所付出的所有代价，都可能在未来几十年里为公司带来源源不断的订单。"
 GEA.38.a:0 "让西门子的电线铺遍东方"
 GEA.39.t:0 "每项发明的用途"
 GEA.39.d:0 "德意志帝国的研究开发团队一直在努力工作，试图为我们的军队发明出新技术，以在迎战各种敌人上取得优势。生出源源不断的好创意并非易事，而且并非所有的设计都能成功。虽然他们提出的许多轻率计划都被否决，但这一次，似乎奇思怪想终于胜出了。\n\n球形坦克，这种由克虏伯公司制造的单人装甲坦克确实是世间独一无二了。这种坦克的特点是一个巨大的球形座舱，侧面有两条向内倾斜的圆形履带，一个小型平衡轮附着在座舱后延伸出的三脚架似的后肢上，不同于以前见过的任何其他装甲车。驾驶员只有眼前方的极小视野，武器也只有他随身携带的……这些球形坦克可能永远不应该被投入生产。\n\n然而既不符合逻辑，也缺乏理智的，一套共24辆球形坦克已经被制造出来，并被运到德属东亚殖民地，分配给了我们的军队。只配备了5毫米厚的钢板装甲和轻型单缸二冲程摩托发动机，这些装甲可能只配用于侦察任务。可惜不管它们看起来多么奇怪无用，我们都没有资格挑剔，所以让我们希望它们能够证明……"
 GEA.39.a:0 "也许它们在这里会有用，而不是在柏林吃灰。"
 GEA.40.t:0 "西贡响应平定省暴乱"
 GEA.40.d:0 "在平定省暴动仍旧如火如荼之时，印度支那南方也开始响应这场叛乱。来自西贡的最新报告证实，平定省的暴乱已经开始向南方城市蔓延。码头、铁路与部分工业区相继爆发罢工，工人团体公开声援平定省的“公社”运动，要求取消义务劳动、释放被捕者，并停止军警镇压。数处警察局和政府办事处遭到冲击，部分交通线路也被破坏。\n\n更令人不安的是，抗议活动正在迅速出现武装化趋势。当地警察已经报告有身份不明的人员向示威者提供枪械和炸药，城外游击队也开始主动袭击巡逻队与运输车辆。总督府认为，这些行动已明显超出普通劳工骚乱的范围，越盟及其地下网络极有可能正在借平定省事件发动更大规模的动员。\n\n目前西贡主要行政机关和港口仍处于政府控制之下，但罢工和骚乱正持续扩大。若不能尽快恢复交通与秩序，整个南方的工业和补给体系都可能受到影响。"
 GEA.40.a:0 "局势正在恶化"
 GEA.41.t:0 "南方彻底失控"
 GEA.41.d:0 "尽管平定省的暴乱在调拨军队紧急镇压后已经开始式微，但根据前线回报以及地下情报来看，平定省暴乱的核心骨干已经逃离了抓捕并转移到了上丁一带继续鼓动叛乱。现如今，印度支那南部的暴乱局势已经进入了白热化。继西贡地区发生大规模暴乱后，安南、交趾支那及湄公河沿岸多地相继出现武装起义。铁路、电报与公路交通遭到系统性破坏，大量地方行政机关停止运作，部分警察和辅助部队也出现逃亡、哗变或倒戈现象。\n\n多个地区已经出现自称“公社”“人民委员会”或“革命委员会”的组织，并开始夺取警察局、仓库和地方政府建筑。越盟则通过地下广播宣布，总起义已经开始，并号召各地工人、农民和殖民军本地士兵共同反抗德国统治。与此同时，民族主义团体也在部分地区趁机发动武装行动，使殖民政府面对的敌人迅速从单一的地下组织扩展为多股反德力量。\n\n殖民军队目前仍控制西贡、主要港口及若干重要城市，但乡村和交通线的控制几乎全部易手。各地驻军不断请求增援，而已经切断的交通与通讯线路使得这一切都石沉大海。"
 GEA.41.a:0 "立刻动员所有部队"
 GEA.42.t:0 "印度支那大起义"
 GEA.42.d:0 "昨日，东京与南圻国几乎同时爆发了大规模罢工与武装暴动，而这成为了引爆混乱局势的最后一点火星。工会和地下组织以前所未见的大规模暴动试图夺取地方行政机关，警察与宪兵在短暂抵抗后便宣告瓦解。尽管东京部分城区的秩序一度得到恢复，但这场危机并未因此得到控制。那些从平定省清剿中逃脱的骨干，以及此前活跃于湄公河与南方乡村的游击队，已经同西贡周边的地下组织汇合，并开始向主要城市发动公开进攻。\n\n西贡的情况则更加严重。当地驻军在连续数日的街垒战和外围伏击中遭到重创，多个据点被迫放弃。随后，越盟领导的武装力量从城郊突破防线，大批罢工工人与叛乱分子随即涌入市区。电报局、广播设施、铁路枢纽以及数座政府建筑先后落入叛军之手，殖民政府同南方多地之间的联络也因此彻底中断。尽管驻军残部占据了包括市政大楼在内的部分要地坚守顽抗，但可想而知如果没有外部的干涉这点抵抗不日就将彻底消散。\n\n西贡的失守迅速产生了连锁反应。原本仍在观望的地方组织开始公开加入起义，民兵与游击队袭击交通线与驻军据点的行动极度频繁，而一些此前还保持沉默的民族主义团体也趁机发动行动。眼下，这已经不再是一场由平定省暴乱引发的局部危机，而是一场真正席卷整个印度支那的总起义。"
 GEA.42.a:0 "革命万岁！（扮演印度支那联盟继续游戏）"
 GEA.42.b:0 "干他妈的越盟！"
 GEA.44.t:0 "和平对话失败了"
 GEA.44.d:0 "德帝国主义拒绝了我们的和平倡议，并决定继续战争。"
 GEA.44.a:0 "只有用武力才能和这些帝国主义者对话了！"
 GEA.45.t:0 "我们在印度支那的胜利"
 GEA.45.d:0 "德国接受和平倡议，并从印度支那半岛全面撤退。我们完成了迫使德帝国主义投降的任务。印度支那现在从德国殖民政权中解放出来了！这是我国人民的伟大胜利，是德帝国主义及其走狗的重大失败！"
 GEA.45.a:0 "酸菜佬滚回家吧！"
 GEA.46.t:0 "好消息和坏消息"
 GEA.46.d:0 "看上去柏林很牵挂印度支那的局势。坏消息是他们发现我们做的不好并且严厉批评了我们，不过好消息是他们将派出增援部队镇压那些越盟分子。"
 GEA.46.a:0 "这是个好消息"
 GEA.47.t:0 "我们在印度支那的胜利"
 GEA.47.d:0 "我们光荣的军队终于挫败了印度支那越盟分子的叛乱行动！这是德国辉煌的一天！"
 GEA.47.a:0 "非常好，战友们！"
 GEA.48.t:0 "印度支那战事升级"
 GEA.48.d:0 "随着德意志帝国将他的军队主力部署到中南半岛，这场起义已经从游击战争升级成为了全面战争！但是我们毫无疑问会取得最后的胜利，解放贫苦人民的正义事业是不会失败的！还有传言说，其他大国正在试图把中南半岛变成德国人的泥潭……"
 GEA.48.a:0 "战斗！"
 GEA.49.t:0 "战争准则"
 GEA.49.d:0 "越盟从不遵守现代战争的规则。他们的游击队战士不仅不穿制服，而且他们经常混入平行百姓，我们的士兵很难把良民和游击队员区分开来。我们的将军认为，如果想彻底消灭越盟，那必须是全方位性的。"
 GEA.49.a:0 "打死一切可疑分子！"
 GEA.49.b:0 "至少学着去区分……"
 GEA.50.t:0 "现代默示录"
 GEA.50.d:0 "印度支那半岛的闷热丛林中存在着地球上最浓密、最恶劣的地形：幽暗的森林和危险的洞穴吞噬了许多可怜的灵魂，让它们迷失在黑山之中。此处的人间地狱足以让任何一个德国人都望而却步，只有最勇敢的，或者说是最疯狂的人才能立足，而费迪南德·舍尔纳就是这样的人。作为对工团主义的革命烈火在半岛迅速蔓延的回应，舍尔纳开始以一种冷酷高效的方式镇压左翼叛党。舍尔纳行走于东南亚，在展现自己的军事才能的同时，也毫无悔意地展露出种种残暴行径。在他的指挥下，德属东亚的军队将左翼叛党炸回到了石器时代，在他的命令下，他的士兵们仿佛十字军东征一般将赤匪枪杀、活活烧死，甚至是炸成碎片，舍尔纳没有一丝仁慈，心中的念头只有拯救殖民地，维护德国的东南亚霸权。在他看来，他只是在清除德皇的合法土地上腐朽的工团主义污点，这项必要的驱魔运动无需犹豫与后悔。只要舍尔纳坐镇印度支那，德意志帝国的光辉就会继续照耀着这片死水，德属东亚必将凯旋！"
 GEA.50.a:0 "当树开始说越南话，舍尔纳以铅弹作答。"
 GEA.51.t:0 "印度支那的红色阴霾消散了"
 GEA.51.d:0 "印度支那的雨季总是令人捉摸不透，大多数时候会持续月余之久，偶尔仅仅能维持数天。连绵不绝的细密雨丝倾倒在印度支那大地上，如同上天在为失败的工团主义分子而哀悼。大雨冲走了人们对于不久前惊雷般的公社运动的记忆，也带走了笼罩于海军政府头上的红色阴影。在西贡的市中心，曾经暴动分子聚集的广场上不见一人，唯有雨点落在荒凉的广场上的声音是如此的震耳欲聋，一张破烂的小册子被扔在水沟里——墨水变成柔软的蓝色花朵缓缓流逝，而封面已经褶皱不堪：这本小册子的封面画了一个越南工人手持社会主义样式的红旗，小册子上写着：“印度支那的工人们！团结起来！”。曾经朝气蓬勃意气风发的革命工人的脸颊已经被晕开的墨水晕花，红旗曾经鲜艳的红色如今看来又仿佛革命者们的鲜血。这本小册子与他的诸多同类宣传单一样，是唯一可以证明社会主义和工团主义分子们在西贡煽动人心的证据，尽管现在已经没有人去怀念他们。不足半刻钟，这本宣传册就被雨水冲到了下水沟里——它真正的归宿，然后在此彻底腐烂，消失，就如同他曾经的主人一般。"
 GEA.51.a:0 "臭水沟就是留给这帮赤色杂种的唯一归宿。"
 GEA.52.t:0 "军费削减之争"
 GEA.52.d:0 "黑色星期一的余波正在逐渐吞噬德属东亚的财政储备。随着德国本土的投资与信贷急剧萎缩，殖民地赖以维系的贸易收入也一落千丈。为了避免总督府陷入无钱可用的窘境，财政官员们不得不重新审查各部门的预算，而长期占据政府开支大头的军队自然成了他们眼中最显眼的目标。\n\n削减军事预算在账面上无疑是最为有效的办法。德属东亚的驻军不仅需要维持庞大的兵员规模，还要负担武器装备、军事设施以及远离本土服役所需的各项津贴。财政部门认为，适当缩减军饷、暂停部分军备采购并削减驻军日常开支，足以让殖民政府暂时喘口气。然而，这份建议很快便招致了军方的强烈反对。将军们坚称，亚洲日益动荡的局势绝不允许殖民地削弱武备，更何况许多官兵早已对长期驻外服役心怀不满，贸然削减待遇无异于火上浇油。\n\n总督如今必须作出抉择。倘若坚持大幅削减军费，政府便有望稳定财政，却可能招致驻军的不满；若只是象征性地削减部分津贴与福利，或许能够安抚军方，但财政压力仍将持续存在。而军方的支持者则主张，在这场经济危机中，军队应当是最后一个被削减预算的部门。毕竟，倘若连维持殖民地秩序的士兵都失去了忠诚，再多的财政盈余也就无甚意义。"
 GEA.52.a:0 "军队也必须勒紧裤腰带。"
 GEA.52.b:0 "适当削减津贴便足够了。"
 GEA.52.c:0 "绝不能亏待我们的士兵"
 GEA.53.t:0 "宵禁之后"
 GEA.53.d:0 "“别回头，继续走。”\n\n阮文雄压低声音，顺势揽住林氏兰的肩膀，像一对刚刚从夜市散步归来的寻常情侣一样，拐进了堤岸区昏暗的骑楼下。就在他们身后不到五十米的主干道上，两辆欧宝卡车正刺破夜雾疾驰而过，车斗里坐满了头戴钢盔的海兵队士兵。\n\n“他们朝四号印刷厂的方向去了，”阿兰的语气很平静，但搭在阿雄手臂上的手指却在微微发抖，“有人出卖了老陈。德国鬼子的装甲车半小时前就封锁了街口，本土警卫团的人正在挨家挨户地查良民证。”\n\n“名单转移出来了吗？”\n\n“在我的菜篮底，压在两斤臭鱼下面。”阿兰苦笑了一下，侧头瞥了一眼街角，“前面走不通了，阿雄。两个宪兵队的，还有三条狼狗。”\n\n阿雄顺着她的视线看去。路灯下，两名德国宪兵正百无聊赖地抽着烟，用听不懂的德语低声交谈着，身旁的翻译官正在粗暴地推搡一个晚归的黄包车夫。阿雄停下脚步，将阿兰拉进一家已经打烊的钟表店门廊里，伸手从她的菜篮底层摸出那卷用油纸包好的名册，塞进自己的怀里。\n\n“你走西边的窄巷，去你表姐家过夜，你身上的证件是干净的。”阿雄一边说，一边解开外套的扣子，露出腰间那把磨掉了编号的鲁格手枪。\n\n“那你呢？”\n\n“我去把那两条狗引开。”阿雄把草帽往下压了压，看了一眼街角越走越近的巡逻队，“如果明天早上我没去码头找你，就把西贡所有的联络点全部切断。走吧，别跑，像平时一样走。”"
 GEA.53.a:0 "枪声在三条街外响起时，她没有回头。"
 GEA.54.t:0 "东方小巴黎"
 GEA.54.d:0 "自柏林的海军部从法兰西第三共和国手中接管印度支那以来，西贡这座昔日的“东方小巴黎”便在潜移默化中经历了一场奇特的建筑与文化嫁接。走在如今被称为“提尔皮茨林荫道”的原卡蒂纳街上，老派的法式新古典主义歌剧院与成排的热带梧桐树依然构成了城市的底色，但严谨的德国人显然无法容忍法兰西人那种散漫的市政规划。短短十余年间，灰白色的包豪斯风格港务局大楼、铺设得如同标尺般笔直的有轨电车轨道，以及街角随处可见的铸铁邮政筒，不合时宜地塞进了这座潮湿闷热的东南亚都会之中。\n\n这种被称为“印支-威廉风格”的混搭美学不仅体现在砖石上，更深入了西贡市民的市井日常。尽管德国殖民当局推行了高效的户籍与卫生管理，但无论是留在当地的法国橡胶园主，还是精明的堤岸华人买办，都对普鲁士式的刻板作息敬谢不敏。于是，一种独特的折衷主义在西贡的街头巷尾生根发芽：原本售卖法式长棍面包和滴漏咖啡的街头摊贩，如今熟练地为休假的德国水兵烤制夹着越南酸萝卜与辣椒的图林根香肠；而在西贡河畔的高级俱乐部里，来自慕尼黑的冰镇黑啤与冰镇苦艾酒平分秋色，伴奏的乐队则能在一晚之内从约翰·施特劳斯的圆舞曲无缝切换到广东粤剧与安南传统民谣。\n\n对于远在柏林的官僚而言，他们不愿也不屑于体验这种所谓的“大杂烩”文化；但对于驻扎在远东的海军官兵和当地居民来说，正是这种文化的奇妙共生，构成了德属东亚的独特魅力。"
 GEA.54.a:0 "“跑堂，再来一杯加冰的黑啤！别放鱼露！”"
 GEA.55.t:0 "恶魔降临的夜晚"
 GEA.55.d:0 "“这个月第三起了，对吧？”\n\n刑警队长埃尔哈特站在门口，摘下帽子，望着屋内忙碌的鉴证人员。他的年轻助手正蹲在地上检查一串沾着泥土的脚印，闻言抬起头来。“是的，长官。如果算上半年前的那些案子，这已经是第六个人了。”队长叹了口气，侧身走进屋内。这是一栋位于西贡郊外的普通住宅，主人是一名德国商人的妻子。屋里的家具大多完好，卧室的抽屉却被翻得乱七八糟，床单凌乱地堆在地上。尸体已经被盖上一层白布，只有露在外面的手臂上还能看见挣扎留下的伤痕。队长只看了一眼，便示意手下将它遮好。\n\n“还是和前几次一样？”他低声问道。助手点了点头。“遭到性侵，随后被杀害。没有发现强行破门的痕迹，干的很专业。”埃尔哈特没有回答，只是缓缓走向卧室另一侧的墙壁。那里用血液画着两个歪斜的符号：一枚从中间断裂的铁十字，旁边还有一个勉强看出来是火炬和锤子交叠的工团主义图标。暗红色的血迹已经凝固，有几道顺着墙面流到了踢脚线上。前五处案发现场也留下过同样的东西，连笔画的方向都几乎一致。\n\n所有死者都有着相同的身份背景。她们或是旅居德属东亚的德国女性，或是嫁给德国官商或军人的妻子，无论是德国人还是本地女性。这些人都住在西贡郊区的数个高档社区带，彼此素不相识，却都在夜间遭到袭击。宪兵司令部早已认定，这些案件绝非普通的奸杀案，而是一名逃脱搜捕的越工成员针对德国人的残忍报复。然而，尽管秘密警察已经逮捕了数十名嫌疑人，审讯室里也不乏招供者，那个真正的凶手却始终没有落网。每隔十数天，城市的另一端便会传来新的报案。\n\n“新加坡知道这件事吗？”助手忽然问道。\n\n“当然知道。”队长取出一支香烟，却迟迟没有点燃。“他们认为我们已经把局势控制住了。”他将香烟重新塞回烟盒，转身望向屋外。几名德国邻居正聚在警戒线后窃窃私语，一位妇人不停地询问自己的丈夫是否也该申请配枪。队长没有理会他们，只是叫来负责巡逻的军官，要求增加附近街区的夜间警力。他知道这种措施未必有什么用处。凶手似乎总能避开巡逻路线，而且从不在同一处地方再次出现。想到这里，他不由得重新看了一眼那面染血的墙壁。\n\n第二天清晨，西贡各大报纸仍将篇幅留给了政府的新的经济政策。只有一家德文报纸在社会新闻栏的角落刊登了一则简短消息，提及近日郊区发生的数起恶性案件，并转述警察局的通告，提醒市民提高警惕。"
 GEA.55.a:0 "...请广大民众避免在夜间独自外出..."
 GEA.56.t:0 "柯腊迈蒲莱的矿脉即将枯竭"
 GEA.56.d:0 "柯腊迈蒲莱的矿脉是我们钨出口的主要来源，并使得我们成为全球主要钨供应商之一。然而，最近来自该矿脉的报告表明，该矿脉中的白钨矿已经所剩无几，并警告我们在不久的将来，该矿脉将会完全枯竭。"
 GEA.56.a:0 "令人担忧"
 GEA.57.t:0 "柯腊迈蒲莱的矿脉枯竭"
 GEA.57.d:0 "柯腊迈蒲莱的矿脉已经正式宣告枯竭。尽管当地仍有少量白钨矿，而且在霹雳州的矿山仍在正常生产，但我们作为地区内主要的钨出口国的地位已经不复存在"
 GEA.57.a:0 "恋恋不舍啊"
 GEA.58.t:0 "乂安警报"
 GEA.58.d:0 "来自印度支那北部的报告再次令总督府陷入不安。早年乂安与河静两省始终是工团主义者活动最为猖獗的地区。数年前，这里的工人与农民曾发动大规模罢工和暴动，甚至一度驱逐地方官员，建立起所谓的“工农公社”。虽然德国驻军最终恢复了秩序，但那些在镇压中逃脱的革命者显然没有放弃自己的事业。如今，荣市的工厂再次出现罢工，乡间的农民则开始举行抗税集会，殖民地警察甚至查获了数批鼓动本土士兵哗变的秘密传单。\n\n面对这些不祥的征兆，印度支那的地方官员与宪兵部门要求总督府立即拨款，恢复对工团主义地下组织的全面监视，并加强驻军对重要城镇和交通线路的控制。然而，这些措施势必耗费大量政治资源，也可能招致军方与殖民地商界的不满。更有官员指出，近来的骚乱大多局限于偏远地区，革命者既缺乏武器，也没有足够的力量发动真正的起义。既然几年前的叛乱已经被帝国轻易镇压，我们又何必为了几张传单和几场罢工便大动干戈？"
 GEA.58.a:0 "不过是些不长记性的乡下赤匪"
 GEA.58.b:0 "加大镇压投入"
 GEA.59.t:0 "北圻大饥荒"
 GEA.59.d:0 "来自印度支那北部的报告正在描绘一幅令人不安的景象。连续数季的恶劣天气与歉收，使北圻和安南北部的粮食储备急剧减少，而殖民地的运输体系又因经济危机与地方骚乱而愈发不堪重负。尽管南圻的湄公河三角洲仍然出产大量稻米，但将粮食运往北方所需的船只、铁路与经费却因越工的骚扰始终难以得到保障。与此同时，德国军队和殖民地行政机关仍在按照既定配额征购粮食，许多种植园主与商人则宁愿将稻米囤积起来，等待价格进一步上涨。在河内、海防与荣市，粮价已经攀升到了普通工人难以承受的程度，而乡间越来越多的农户甚至不得不变卖土地与牲畜，只为换取勉强果腹的粮食。\n\n随着饥荒蔓延，北圻的道路上开始出现大批逃荒的农民，他们拖家带口涌向城市，希望能够从殖民政府或慈善机构手中获得一点救济。地方官员接连向总督府请求开放粮仓、降低征购配额，并紧急从南圻调运稻米。然而，这些措施无疑将耗费大量资金，还会扰乱已经受到黑色星期一重创的殖民地贸易。更有德国商人抱怨，过度干预粮食市场只会损害种植园主与出口企业的利益。总督府中的财政官员也坚持认为，眼下的困难不过是一次暂时性的农业危机，只要下一季收成有所好转，局势自然会恢复正常。\n\n然而，饥饿的民众显然没有耐心等待下一场丰收。北圻国已经接连发生数起农民冲击粮仓的事件，部分本地警察甚至拒绝向要求发放粮食的村民开枪。更加令人担忧的是，长期盘踞在乂安与河静一带的越工地下组织正在趁机扩大活动，他们派遣干部进入饥荒地区，鼓动农民拒绝缴纳粮税，并以重新分配粮食为名组织群众夺取地主与殖民政府的仓库。对于那些已经数日没有吃上一顿饱饭的农民来说，这些革命者关于民族解放与社会平等的口号，或许远不如一袋稻米来得有说服力。倘若继续袖手旁观，这场原本可以通过行政手段缓解的粮食危机，恐怕很快便会演变成一场无法收拾的政治灾难。\n\n如今，殖民政府可以开放部分战略粮仓，从南圻紧急调运粮食，并暂时减免受灾地区的粮食征购。然而，这意味着不得不挪用其他部门的预算，还可能招致军方与德国种植园主的不满。另一种选择则是继续维持现有的征购与贸易政策，将有限的行政资源投入更加重要的事务，寄希望于地方官员与私人慈善机构自行解决危机。"
 GEA.59.a:0 "让屁民们继续饿着吧"
 GEA.59.b:0 "只在城市地区开仓放粮"
 GEA.59.c:0 "绝不能让饥饿引燃叛乱"
 GEA.60.t:0 "顺化奇人请愿"
 GEA.60.d:0 "近年来，随着印度支那的民族主义情绪不断高涨，顺化的阮朝宫廷也开始对德国殖民政府日益专横的统治感到不满。保大帝虽然仍然保有安南皇帝的尊号，但朝廷的政令几乎处处受到德国驻扎官的干预，地方行政、财政乃至官员任免均须经过殖民当局批准。正是在这样的背景下，新近出任吏部尚书的吴廷琰向总督府提交了一份颇为大胆的改革请愿书。这位年轻的天主教官僚出身于声望显赫的越南士绅家庭，素以勤勉、清廉和坚定反对工团主义而闻名，因而他的建议并非出自那些妄图推翻帝国统治的革命分子之手。\n\n吴廷琰在请愿书中指出，殖民政府长期排斥本土官员、架空阮朝朝廷的政策，不仅损害了越南传统统治阶层的威望，更使越来越多的年轻人转而支持激进民族主义与工团主义运动。他要求德国人尊重安南保护国原有的行政权限，允许越南官员独立处理更多地方事务，并逐步建立一套更加现代化的官僚制度。吴廷琰坚称，适当扩大本土精英的政治参与，并不会削弱德国在印度支那的地位，反而能够使阮朝成为抵御革命浪潮的可靠屏障。然而，许多德国官员显然不这么认为。在他们看来，今天允许顺化朝廷自行任命地方官员，明天这些越南人便可能要求财政自主，最终甚至将德国人赶出印度支那。\n\n如今，这份请愿书已经摆在总督府的办公桌上。我们可以断然拒绝吴廷琰的一切要求，以维护帝国在殖民地不容置疑的权威；也可以批准部分温和改革，给予阮朝与地方官员一定的实际行政权限，以争取越南保守派的支持。当然，还有一种更为谨慎的办法：只允许改革地方行政程序、教育与官员培训等无关紧要的事务，同时确保财政、军事、警察及重要人事任免权始终掌握在德国人手中。无论如何，我们的决定都将影响顺化宫廷今后对帝国的态度。"
 GEA.60.a:0 "这些安南官僚应该认清自己的地位"
 GEA.60.b:0 "适当的自治或许能让他们远离革命"
 GEA.60.c:0 "改革可以，但权力必须留在德国人手中"
 GEA.61.t:0 "大明皇帝的身后事"
 GEA.61.d:0 "南京紫金山下，一群德国考古学家正在明孝陵附近忙得不可开交。皮靴踩过长满青苔的石阶，测绘员在石像生旁架起三脚架，几名工人则在德国专家的指挥下，将铁锹插进了数百年来无人敢随意惊扰的土地。挖掘活动的名义是对明代陵寝建筑及地下遗存进行科学考察，而真正令远道而来的德国人兴奋不已的，却是有关陵墓中那些珍贵无比的陪葬品。一位德国东方学家甚至私下跟同僚坦言，既然埃及的法老已经替欧洲各大博物馆贡献了如此丰富的藏品，那么中国的皇帝也理应为人类文明尽上一份义务。\n\n对于这项计划，江苏督军齐燮元表现出了异乎寻常的热情。在德国顾问向他解释考古事业的伟大意义后，齐督军当即批准了所需的通行证、警卫与劳工征调，并亲自派人送来一块写有「中德文化合作」的木牌。面对幕僚关于陵寝风水及地方舆论的担忧，他却不以为然：“明朝亡了几百年了，难不成朱元璋还能从坟里爬出来，找本督军讨个说法？”齐燮元随后又补充说，倘若德国朋友们真能挖出什么稀世珍宝，还请务必留下几件供江苏省政府陈列，以彰显中德友谊之深厚。\n\n然而，南京城中的百姓显然不这么看。消息传出后，当地士绅纷纷上书，痛斥省府纵容洋人惊扰太祖陵寝；几位报馆编辑更是洋洋洒洒大书特书地指责，齐燮元如今竟连前朝皇帝的坟墓也要拿来讨好德国人。面对愈演愈烈的非议，东南省政府很快发表声明，强调此次考察完全出于学术目的，所有出土文物都将得到妥善保管。只不过，第二天清晨，一队德国士兵便护送着几只钉得严严实实的木箱离开了考察现场，箱子上的德文标签写着「地质标本及研究资料」。至于其中究竟装着些什么，负责检查的中国海关人员并没有得到打开箱子的许可。\n\n数周后，齐燮元收到了一封措辞热情的感谢信。德国考古学家盛赞江苏当局对于科学事业的慷慨支持，并保证将来一定在某家德国博物馆的展柜旁，特别注明这些珍贵文物是在齐督军的鼎力协助下发现的。齐燮元对此颇为满意，立即吩咐秘书将感谢信裱起来，挂在自己的会客厅内。"
 GEA.61.a:0 "大明的江山没了，祖坟也保不住"
 GEA.62.t:0 "两个世界之间"
 GEA.62.d:0 "自德意志帝国将自己的殖民版图扩展至东南亚以来，德国文化便逐渐成为这片土地日常生活中不可忽视的一部分。在新加坡与西贡的街头，德语招牌与当地文字并列出现在商店门前，德国式建筑沿着宽阔的林荫大道拔地而起，而昔日由英国人与法国人经营的俱乐部、学校和商业机构，也逐渐迎来了新的德国主人。然而，东南亚并未因此变成欧洲的简单复制品。马来人的清真寺、华人的宗祠、越南人的村社与佛教寺院依旧维系着各自的传统，德国移民所带来的习惯与制度，则在与这些古老文化的长期接触中不断发生变化。\n\n这种文化冲击与融合在殖民地城市中表现得尤为明显。德国商人逐渐习惯了在炎热的午后暂时放下工作，前往街边咖啡馆饮用加入炼乳的咖啡；本地富裕家庭则开始将德国制造的家具、钢琴与钟表摆进客厅，并送子女进入教授德语和现代科学的学校。德国面包店尝试使用当地的椰子、香料与热带水果制作糕点，而传统的亚洲餐馆也开始为欧洲顾客调整菜肴的口味。在一些由德国人与本地居民共同组成的家庭里，孩子们甚至能够同时使用德语、马来语或汉语交谈，并在不同的节庆中遵循各自家族的习俗。对于这些年轻一代而言，来自欧洲与亚洲的生活方式并不总是彼此对立，而是共同构成了他们所熟悉的世界。\n\n当然，文化上的相互影响并不意味着殖民地社会已经消除了彼此之间的隔阂。德国官员往往更重视行政纪律、法律制度与现代教育，而当地居民则仍然珍视自己的宗教信仰、家族关系和传统礼俗。城市中的欧洲人居住区与本土社区也并未真正融为一体，语言、收入与社会地位的差异仍然深刻影响着人们的日常交往。然而，随着越来越多的德国人出生于远东，越来越多的本土青年接受德国教育，双方之间的关系也逐渐超出了单纯的统治者与被统治者。那些在柏林看来理所当然的生活习惯，到了南洋往往需要作出调整；而许多曾被德国人视作陌生的东方风俗，也开始成为他们生活中习以为常的一部分。数十年的共同生活正在塑造一种独特的殖民地文化，它既不同于欧洲的德意志，也无法完全归入东南亚任何一个民族的传统。"
 GEA.62.a:0 "远东自有其独特的生活方式"
 GEA.63.t:0 "柏林的雨"
 GEA.63.d:0 "“您觉得柏林怎么样，上校？”\n\n“有点冷。”\n\n“可您不是一直盼望着回来吗？”\n\n“是啊。我盼了二十多年。”\n\n弗里德里希·冯·哈登贝格望着窗外。十一月的柏林阴雨连绵，街道上满是行色匆匆的路人。他拉紧大衣的领口，突然有些怀念西贡午后令人窒息的暑热。\n\n“您在印度支那待了多久？”\n\n“二十三年。刚去的时候，我每天都想回德国。那里热得像蒸笼，到处都是蚊子，雨一下就是几个钟头。”\n\n“那您一定很高兴终于回家了。”\n\n“其实我本来是这么想的。”\n\n上校端起咖啡，抿了一口又放回桌上。\n\n“这里的咖啡太淡了。西贡人喜欢往里面加炼乳，甜得要命。我过去总嫌他们糟蹋咖啡。”\n\n“听起来您倒是想念那里了。”\n\n“也许吧。我的妻子和孩子还在那里。我认识的那些老朋友，有一半埋在了那边。至于柏林……”\n\n他停顿了一会儿。\n\n“二十三年了，这座城市好像什么都变了。可我又说不清究竟变了什么。”\n\n窗外的雨渐渐大了起来。年轻的军官没有再说话，只是替上校添满了咖啡。哈登贝格望着杯中升起的热气，忽然想起西贡雨季结束后的傍晚，潮湿的街道、河边的汽船，以及远处传来的钟声。\n\n三天后，帝国陆军人事部门收到了一份申请。弗里德里希·冯·哈登贝格上校请求结束休假，并将自己在德属东亚的服役期限再延长五年。"
 GEA.63.a:0 "故乡究竟在哪里？"
#阿尔伯特哈尔
 GEA.101.t:0 "驾驭三头驮兽"
 GEA.101.d:0 "当法国人第一次踏上印度支那的土地并开始建立殖民统治后，很快便意识到，仅靠关税、土地税与零散的地方征收，根本无法支撑一套日益庞大的殖民行政体系。于是，从十九世纪末开始，法属印度支那总督府逐步把盐、酒与鸦片三项专卖制度推到了殖民财政的核心位置。这三项收入后来被人形象地称作拉动印度支那财政车架的“三头驮兽”，而在法国统治最稳定的年代，它们确实承担了相当大一部分殖民政府的日常开支。\n\n其中，盐税最为广泛，也最难逃避。作为生活必需品，殖民政府通过限制产地和销售渠道，再将专卖价格无限拔高，便能够把税负深入到印度支那最偏远的村庄。酒类专卖采用的手段则略有不同。殖民当局一方面发放生产与销售许可，另一方面严厉打击未经许可的私酿，并推动经过登记的酒类进入地方市场。于是，无论是城市工人还是乡村居民，日常饮酒最终都多少会为殖民政府的账本贡献一笔收入。而在这三头驮兽之中，最为肥硕的无疑是鸦片。殖民政府把鸦片的进口、加工与销售牢牢掌握在手中，再通过遍布主要城镇的销售网络，将害人的毒物变成了稳定而惊人的财政来源。随着法国人的长久统治，三项专卖不仅成为税收手段，也逐渐演变成法国殖民统治本身的一部分。\n\n然而，这套制度并没有完整地保存到德国人手中。法国势力退出印度支那时，战争、政权更迭与地方秩序崩溃已经破坏了原有的征收网络。仓库被洗劫，账册遗失，地方承包商各自为政，走私重新泛滥。等德国真正站稳脚跟时，接手的是一个仍有旧制度轮廓、内部却已经千疮百孔的财政体系。而彼时德属东亚的统治基础本就称不上牢固。军方更关心镇压与驻防，行政机关则忙于把法国时代留下的官僚机器重新拼接起来。在这种情况下，总督府并没有兴趣为了几项税收发动一场可能激怒本地商人、村社与既得利益者的大规模改革。由于德意志的经济腾飞，德属东亚的财政自然无比健康。于是，残破的专卖制度被修修补补地保留下来，却始终没有得到彻底重建。\n\n黑色星期一改变了这一切。开支暴涨，而殖民政府能收上来的钱反而一日不如一日。财政部门已经把能够削减的预算削了又削，而从柏林获得大规模援助的希望也愈发渺茫。在这种情况下，阿尔伯特·哈尔重新翻出了那些法国人留下的旧账本。\n\n盐、酒、鸦片。这三头老迈而疲惫的驮兽或许早已不像几十年前那般健壮，但至少它们仍然能够拉动车架。哈尔的官员们已经开始重新调查各地专卖收入、走私规模与税率水平，并试图计算到底哪一项收入还有最大的压榨空间。从食盐和酒类上下手无疑是收益满满，但现在是否还犯得上为了可能存在的更多税收来得罪已经愤怒不已的印度支那人群已经成了一个问题。而通过贩卖鸦片攫取暴利自然是一幢稳赚不赔的买卖，但先不说可能造成地方犯罪网络壮大和官员腐败，单单是对我们的治安状况的潜在威胁就可能使我们得不偿失。"
 GEA.101.a:0 "提高盐税，人人都逃不过这一笔"
 GEA.101.b:0 "提高酒税，从每一杯里抽出我们的份额"
 GEA.101.c:0 "我管你这那的先从鸦片里捞一笔再说"
 GEA.102.t:0 "老瓶装新酒"
 GEA.102.d:0 "对于阿尔伯特·哈尔来说，他很清楚，印度支那并不是新几内亚，但他在太平洋学到的经验依然适用，殖民政府永远不可能拥有足够多的德国官员去亲自管理每一个村庄。看看中央非洲的那些野蛮官员吧：他们将所有非洲土著视为难以交流的蛮子，转头使用步枪和燃烧弹治理黑暗大陆。可这又得到了什么呢？无穷无尽的叛乱与财政报表上越来越多的军费支持。哈尔相信，如果帝国再不着手处理中央非洲，那么那里迟早彻底崩溃。\n\n20年前，在新几内亚，卢卢艾们与他们的助手承担了传达命令、维持地方秩序和组织劳役等一系列德国人不愿也无法承担的工作，而德国行政机关只需要控制这些基层代理人。如今，总督开始在印度支那采用类似的办法。各地愿意合作的地主、乡绅、保甲首领与其他地方名望人士将获得正式认可，协助登记人口、征收地方税、组织道路与灌溉工程，并向殖民警察报告外来人员和可疑政治活动。作为交换，他们原有的地方地位与部分利益也将得到保护。对于那些极度愿意与德国政府合作的地方大族，甚至有宪兵队来帮助他们保家守土。\n\n诚然，这种制度当然可能滋生腐败，甚至造就一批借德国权威扩张自身势力的地方豪强。但哈尔并不认为这是无法接受的代价。只要这些人能够让税款按时上缴、村庄保持安静，并让总督府的命令真正传到乡间，那么他们就是有用的。"
 GEA.102.a:0 "必要时刻需要特殊手段"
 GEA.103.t:0 "保大皇帝回到了印度支那"
 GEA.103.d:0 "安南的君主保大最近完成了他在德国的学业后回到了印度支那。尽管他对自己仅仅是个表面上的君主不太满意，他希望自己拥有权力，之后他可以缓和地方的冲突并赢得人民的支持，因为安南农民认为自己是他们皇帝的附属。但是，西贡的欧洲殖民者们却反对与任何安南人分享权力。"
 GEA.103.a:0 "哈巴狗回到了自己的小窝"
 GEA.104.t:0 "保大皇帝的建议"
 GEA.104.d:0 "保大皇帝近来向政府提交了一份措辞颇为谨慎却野心十足的建议。皇帝声称，若德国真心希望印度支那恢复秩序，就不应继续把越南皇室仅仅当作礼仪上的装饰。鉴于越发高涨的越南民族主义浪潮，按照他的设想，顺化朝廷应当逐步恢复对越南地方行政、部分财政事务以及本地治安力量的实际影响。此外皇帝还希望越南人能够在官僚任命和地方警备方面获得更大的发言权，换句话说，他想要更多的越南人进入印支地方政府。\n\n尽管有些自负与异想天开，但保大并没有掩饰自己的目的。当然这位年轻的皇帝也暗示我们，如果未来印度支那真的爆发大规模工团主义叛乱，皇室仍然有能力号召那些不愿接受赤色革命、却同样反感外国统治的民族主义者站到政府一边。只要德国愿意承认皇室权威，那么顺化便可以把民间的残存忠诚转化为对德意志殖民秩序的支持。\n\n这番话听起来当然十分诱人，但没人会误解保大的真正目的。所谓恢复行政权，不过是一步步把越南事务重新收回皇室手中；而财政与军政权限一旦让渡得太多，所谓一个真正复活的越南帝国就也不再是民族主义者们的异想天开。柏林对这种安排未必会感到满意，而德属东亚军方尤其反感把实际权力交给一个本地君主，舍尔纳一派甚至已经把这称作“主动制造下一个敌人”。哈尔因此必须尽快决定，究竟要把保大当作真正的合作者，还是仅仅当作一面还能派上用场的旗帜。"
 GEA.104.a:0 "把部分权力还给皇帝，我们需要他的支持"
 GEA.104.b:0 "给他些边缘权力，足够凝聚人心即可"
 GEA.104.c:0 "皇帝还是当个无害的神像吧"
 GEA.105.t:0 "保大的改革：行政"
 GEA.105.d:0 "在保大登上王位后，他将一些改革派带入了自己的麾下，这些人基本都是从忠君派中精挑细选的班底，也夹杂了一些越南民族主义者与知识分子。这其中既包括新传统主义知识分子范琼，也包含以及基本上什么都管的天主教徒吴廷琰。在一场宴会上，保大与和他的忠心耿耿的本地贵族拥趸向我们提出了未来的蓝图：保大与越南贵族们将彻底规训好印度支那这片躁动不安的领土，只要我们给他们足够的行政权力。\n\n现在保大与他的忠心耿耿的大臣们决定发起一场行政改革，来使早已失效的越南行政体系重新焕发活力，并让君主这一光辉形象重新在人们心中树立起来。目前安南保护区的官员只是在名义上管理国家，实际的权力都还在欧洲顾问手中。保大与他的臣子们如今仍旧处在我们的掌控之下，但毫无疑问，保大的改革肯定会损害欧洲的权力垄断……"
 GEA.105.a:0 "这是必须的"
 GEA.105.b:0 "阻止他，他已经歪的很离谱了"
 GEA.106.t:0 "保大的改革：警务"
 GEA.106.d:0 "随着时间推移，保大与他的内阁已经不再满足于总督府最初给予的有限权力。最近席卷印度支那各地的罢工骚乱与农村武装活动，恰好给了顺化朝廷一个进一步越权的绝佳借口。保大向总督提出请求，希望获准组建一支直属越南皇室指挥的警察部队，用于维持安南地方治安，搜捕地下组织并协助镇压那些愈发活跃的叛乱农民。保大和他的大臣们给出的理由倒也颇为充分。德国殖民警察人数有限，对乡村社会、人际关系和地方语言更是所知甚少，而由越南人组成的警察无疑能够更加迅速地深入基层。\n\n可谁都看得出来保大究竟在打什么算盘。所谓皇家警察一旦拥有自己的编制、军械与指挥官，便随时能摇身一变褪下身上那层警服。今天他们或许只是拿着手枪追捕赤匪，明天就可能肩上扛枪，脚踩军靴了。更不用说再过几年，这支所谓的警察部队究竟会效忠总督府还是顺化皇宫，恐怕就只有皇帝本人知道了。军方对此尤其警惕，认为允许越南皇室建立直属武装，无异于亲手为未来可能复兴的越南帝国打造第一支军队。\n\n然而眼下的现实同样摆在面前。保大和他的内阁目前仍旧坚定地站在德国一边，而工团猪们却已经越来越不满足于散发传单。我们当然可以为了未来可能出现的威胁拒绝皇帝，但如果那些赤匪真的先一步打到了家门口，这份谨慎又究竟能保护我们什么呢？"
 GEA.106.a:0 "至少他们现在不成威胁，而赤匪已经快打到家门口了！"
 GEA.106.b:0 "给安南人武装自己的权力是一件疯狂而危险的事情"
 GEA.107.t:0 "越南问题"
 GEA.107.d:0 "随着保大的诸多改革已经初见成效，这位年轻又雄心勃勃的皇帝在他的幕僚们的鼓动下向我们提出了大胆又疯狂的计划：德国军队撤出印度支那半岛，仅留下部分德国顾问与行政官僚辅助保大管理印度支那。他们将依照保护条约帮助镇压农村地区的叛乱，并动员当地的一切资源扫荡潜在的叛军据点。否则盛行的反殖民主义情绪将会助长越盟的嚣张气焰。保大向我们承诺，德意志帝国在印度支那的统治地位不会改变，同时我们的财政收入也不会减少一分钱、同时保大认为我们的宽厚之举也能让其他不安分的殖民地们看到希望并且归顺我们。在他的描述中，这似乎成了一笔稳赚不赔的交易，但在我们的军官们眼中，这就是活生生的空手套白狼。同时保大的建议以一段不吉利的预示结尾：“每一个村庄都会成为反抗者的巢穴，每个过去的合作者都将成为未来的敌人，之后你和你的殖民者们会想方设法地从这个令人窒息的泥潭中脱离——全面撤出印度支那。我们需要如何抉择？"
 GEA.107.a:0 "保大会带领越南走向和平与秩序（扮演越南继续游戏）"
 GEA.107.b:0 "也不知道保大的那帮天才下属睡没睡醒"
 GEA.107.c:0 "把印度支那给他们，让越南猴子去管越南猴子吧"
 GEA.107.e:0 "让他滚蛋，我们换一个傀儡皇帝"
 GEA.108.t:0 "双皇之治"
 GEA.108.d:0 "今日，顺化举行了一场规模颇大的公开游行，以庆祝皇室与殖民政府所宣称的“新秩序与共同繁荣”。街道两侧悬挂着帝国旗帜与越南皇室的黄色龙旗，学校、商会、地方官署与各类获准活动的社团都被要求派出代表参加。真正引人注目的，却是游行队伍最前方那两幅被鲜花簇拥的巨型肖像——德意志皇帝威廉二世与越南皇帝保大并肩而行，前者象征着保护与秩序，后者则被认为是越南传统与忠诚的延续。\n\n保大本人显然并不喜欢这种安排。对于一个仍然把自己视作越南合法君主的人而言，与远在柏林的另一位皇帝并列尚且可以忍受，而让德国人的肖像在自己的首都接受同样甚至更加隆重的欢呼，则多少显得有些刺眼。然而顺化宫廷总是还要听从来自新加披和柏林的命令，而保大也很清楚，公开反对这种象征安排只会让德国人重新怀疑皇室的忠诚。因此，当两幅肖像经过检阅台前时，他仍然保持着应有的微笑，并向队伍抬手致意。\n\n殖民政府对此十分满意。这场游行的意义并不在于一次节庆本身，而在于反复塑造一种更加方便的忠诚观念：越南人无需在顺化与柏林之间作出选择，效忠保大同样可以意味着效忠德意志皇帝，而承认德国统治也无需被解释为背弃本国传统。只要这种叙事能够不断通过学校、报纸、仪式与地方宣传重复下去，皇室的合法性便可以反过来为殖民秩序提供一层更加柔软的外衣。\n\n至于保大是否真正喜欢自己的肖像旁边永远站着另一位皇帝，谁在乎呢？"
 GEA.108.a:0 "两位皇帝，一份忠诚！"
 GEA.109.t:0 "席间名流"
 GEA.109.d:0 "宴会设在西贡一座临河的德国公馆里。雨季刚过，夜风仍带着潮湿的热气，廊柱之间挂满了电灯，银制餐具与酒杯在灯下泛着冷光。来自堤岸的华商大地主、河内的律师、旧官僚、银行家与几位在报纸上颇有名气的温和民族主义者依次入席，而德国官员则穿插在他们之间，谈论着关税、米价、地方治安以及一些谁也不愿真正说破的问题。\n\n相比顺化宫廷那些总想着恢复旧日权威的人，总督反而更愿意观察眼前这些懂得利益交换的本地精英。席间有人主动提到扩大地方政务机构，有人希望获得更多发言权，当然也有反复强调自己对德国秩序的忠诚的狗腿子。言辞各不相同，但意思并不难懂：如果总督府愿意给出更多位置，利益抑或是更多体面的头衔，那么他们也愿意继续加深与德国主子的合作。\n\n宴会结束后，殖民政府内部很快就围绕这些名流究竟该被赋予多大作用展开了争论。改革派认为，给予他们更多行政职位、特许经营权和议政资格，能够让印度支那的上层社会真正从德国统治中获得可见利益。只要他们的财富、地位与政治前途都依赖总督府，他们自然会成为最积极的合作者。然而，也有人认为没有必要把事情做得太远。让这些人充当殖民统治的体面门面已经足够，若真让他们在地方上获得能够自行运转的权力，迟早会有人忘记究竟是谁给予了他们这一切。德国统治者们必须尽快决定，这些人究竟该成为德属东亚秩序真正的一部分，还是仅仅成为摆在橱窗里的装饰。"
 GEA.109.a:0 "给他们更多特权"
 GEA.109.b:0 "给他们席位和勋章就够了"
 GEA.110.t:0 "开源的困境"
 GEA.110.d:0 "黑色星期一虽然最猛烈的冲击已经过去，但德属东亚的经济仍难称康健。企业投资迟迟没有回升，失业人数居高不下，而殖民政府的开支却有增无减。如果政府不能匀出更多资金来维持殖民地的运转，那这个松散的殖民地散摊子也是迟早的事。财政部门已经翻遍了账本，真正的问题也摆在了我们的面前：究竟应该让谁来承担政府开源的成本。\n\n一种办法是进一步提高关税，并重新审查殖民地出口税率，甚至不再给予运往德国本土的商品特殊待遇。这样能够迅速增加财政收入，却无疑会打击本就脆弱的贸易，更会直接得罪柏林的大人物们。另一派则主张反其道而行，减轻中小企业的营业税与地方杂费，简化执照和征收程序，让那些在危机中勉强存活的商号重新雇人、投资和周转，这样创造的岗位与税收反而能让我们赚一笔。还有人认为真正有能力承担更多税负的，理应是如今没从经济危机中受到太多伤害的地主和豪富。\n\n当然，如果上述方案都无法填满国库，我们永远还有最简单的办法：扩大基层征收，把新的税目摊到土地、房屋、市场和每一个仍有能力交钱的人头上。那不会赢得多少爱戴，但殖民政府反正一直也不是很在乎印度支那屁民的死活"
 GEA.110.a:0 "提高关税，连运往德国的货物也不能例外" 
 GEA.110.b:0 "给中小企业松绑"
 GEA.110.c:0 "收割富人，两难自解"
 GEA.110.e:0 "还能怎么办？刮地皮吧"
 GEA.111.t:0 "新来的邻居"
 GEA.111.d:0 "随着殖民政府的新移民计划逐步展开，越来越多来自德国本土以及中欧各地的移民开始抵达德属东亚。最初到来的大多是工程师、铁路职员、小商人和退伍军人，当然也不乏在国内商业场上一败涂地，希望在海外重新开始的人。他们在新加坡、西贡、海防与各处新兴定居点落脚，很快便给原本已经十分复杂的殖民社会增添了新的面孔。\n\n适应这里并不容易。第一次见到雨季时连续数日不肯停歇的暴雨对移民来说无疑是可怕的。他们中的大多数人花了数周才习惯午后几乎令人窒息的湿热，而在市场里面对香料、鱼露和陌生方言时显得手足无措也是家常便饭。德国面包店旁开始出现卖米粉的小摊，啤酒馆里也有人学着在冰块中加入本地水果；一些移民则干脆接受了当地的生活节奏，把百叶窗、藤家具与宽檐帽当成了日常必需品。\n\n殖民政府当然乐于把这些变化宣传成德意志文明在东方扎根的证明。新来的欧洲居民能够充实行政、商业与技术岗位，也能为殖民地带来更多资本和消费。然而，对许多真正决定留下来的人而言，宏大的帝国使命远没有一份稳定的工作以及学会如何在热带午后少流些汗来得重要。\n\n或许再过几年，这些如今还对一切感到陌生的人，也会开始把这里称作自己的家。"
 GEA.111.a:0 "欢迎来到东方"
 GEA.112.t:0 "纸上规矩"
 GEA.112.d:0 "哈桑并不知道德国人为什么会在这个时候来到村里。那天早晨和往常没有什么区别。女人们正在屋后晾晒鱼干，几个孩子追着鸡从木屋下面跑过。直到远处那条泥路上传来一阵从未属于这片森林的低沉轰鸣，村里的人才一个接一个停下手中的事情。\n\n两辆覆着灰绿色铁皮的汽车停在村口。前面那辆较小，后面则是一辆高大的卡车，车轮上沾满红褐色泥浆。几名穿灰色制服的德国宪兵先跳了下来，随后是两个抱着文件箱的行政官员和一名翻译。\n\n孩子们站得远远的看着。哈桑也只敢从父亲身后探出头。他以前见过那些金发碧眼的异乡人，却大多是在码头或税务所附近。他记忆里他们总是拿着步枪，趾高气昂的。今天来的这些人却没有立刻搜屋或是把谁叫出来训斥，而是在村长家的凉棚下摆开桌子，拿出一摞又一摞白纸。\n\n他们问了许多奇怪的问题。“谁有权使用河边的土地？”“一户人家死去以后，椰林由哪个儿子继承？”“若两户人因为水牛踩坏稻田发生争执，应当由谁裁决？”“结婚需要经过哪些人的同意？”等等不一而足。村长回答了一些，清真寺里的老人补充了一些，附近一个替苏丹管理土地的属官也被请了过来。几个人有时会为了某条规矩争论很久。德国翻译反复确认后，再把话告诉那个始终低头书写的行政官员。每当他们得到一个满意的答案，那支钢笔便又在纸上留下几行密密麻麻的字。\n\n直到下午，翻译才向聚在周围的人解释，总督府正在整理各地的“习惯法”。以后每个地区都会有自己的地方条例，村里的旧规矩仍然可以继续使用，但税收、治安以及严重犯罪仍必须按照殖民政府的法律办理。小的土地纠纷、继承和村社事务，则可以更多交给当地人自己解决。\n\n村长点了很多次头。德国官员也显得十分满意。随后，那些纸张被重新塞进皮箱。宪兵爬上后面的卡车，两名行政官员钻进前面的汽车。发动机再次发出令人不安的轰鸣，灰绿色的铁皮怪物颠簸着驶出村庄，很快便消失在棕榈树与尘土后面。"
 GEA.112.a:0 "没有规矩不成方圆"
 GEA.113.t:0 "异乡异客"
 GEA.113.d:0 "德国人接管印度支那、马来亚以及其他东亚殖民地时，整个过程远称不上从容。旧宗主国的行政机构在战争与撤退中迅速瓦解，许多英法官员和军人随舰船离开，但并不是所有人都能够，或者愿意，返回欧洲。工团匪徒已经占据了他们的家乡，而去撒哈拉沙漠吃沙子或者去加拿大挨冻显然也不是什么好主意。更现实的是，在真正接管基层行政之前，帝国也没有能力把所有旧殖民者都扫地出门。于是，这批人便以一种颇为尴尬的身份留了下来。\n\n十余年过去，他们中的一部分重新进入商业领域，另一些人靠翻译、顾问、地产或零散生意维生，但仍有相当数量的人始终没有真正在此安居。如今殖民政府正在尝试稳定基层行政，而这些旧殖民者恰好拥有我们最缺乏的东西：语言、地理知识、人脉，以及处理殖民事务的实际经验。让一名在安南生活二十年的法国旧官员协助德国县署，总好过再从汉堡派来一个连当地村庄名字都念的七扭八歪的新兵蛋子。\n\n军方则认为，许多留下来的法国人和英国人拥有军旅经历，还有一些年轻人虽然从未正式服役，却对继续漂泊的生活早已厌倦。若将他们编入一支由德国军官指挥、面向外国志愿者招募的殖民部队，不仅能补充日益吃紧的兵员，也能充分利用他们对热带环境和地方语言的熟悉。有人甚至已经半开玩笑地把这个设想称作“德国外籍军团”。\n\n无论如何，与其让他们继续坐在西贡和新加坡的咖啡馆里回忆过去，也许让他们为新的主人做些有用的事情更有用些。"
 GEA.113.a:0 "吸收他们进入基层行政"
 GEA.113.b:0 "在德属东亚咱们就练起来！"
 GEA.113.c:0 "遗老们还是少碰为妙"
 GEA.114.t:0 "南洋华商"
 GEA.114.d:0 "在印度支那与南洋的许多港口城市里，华商早已成为一种再寻常不过的存在。西贡堤岸密密麻麻的商铺，新加坡与槟城拥挤的码头仓库，再到马来亚内陆那些不起眼的小杂货铺，有利可赚的地方就有他们，通过经营米粮、布匹、药材、航运、钱庄、橡胶与进出口贸易，这些几乎无所不包的生意把彼此相隔甚远的港口连接成一张庞大的商业网络。对许多华商而言，港口升起谁家的旗帜不如货物能否顺利装船重要。法国人、英国人和德国人先后来到这里，税则、执照与货币一变再变，但账本依旧要记，货船依旧每天离港回港。熟悉当地市场的人很快便学会如何同新的官员打交道，而那些手握航运、仓储与信贷的大商号，则在德属东亚不断扩张的贸易中找到了新的机会。\n\n当然，并不是每个人都成了腰缠万贯的大亨。更多的人只是经营着一间狭窄的店面，清晨替码头工人煮茶，下午替乡下来的农民称米，晚上在煤油灯下把当天的铜板一枚枚数清。黑色星期一之后，倒闭的商号、收不回的贷款与堆积在仓库中的货物也同样落到了他们头上。但第二天太阳升起时，店门往往还是会重新打开。南洋的生意已经这样做了很多年。"
 GEA.114.a:0 "生意行啊你们哥俩"
 GEA.115.t:0 "剑拔弩张"
 GEA.115.d:0 "平日里，位于西贡的行政大楼前的广场总是东亚殖民秩序最体面的门面之一。官员的汽车从石阶前驶过，警卫在岗亭旁如常换班。然而今天，那里只剩下了旗帜、口号，以及本地人的愤怒。\n\n示威最初源于最近一次驻军清剿行动。据称，一支德国部队在搜捕叛乱嫌疑人的过程中闯入数个村庄，开枪打死多人，并烧毁了部分民宅。军方坚持声称部队是在遭受袭击后采取必要行动，但幸存者与死者家属讲述的却是另一回事。随着消息传开，学生、工人、店员、码头劳工乃至一些地方名流陆续加入抗议。到了下午，大楼前已经挤满了密密麻麻的人群。\n\n而在他们对面，驻军同样已经完成部署。灰绿色军服的士兵封锁了通往总督府的几条主要街道，沙袋与机枪也被拖到能够控制广场入口的位置。更靠近示威者的地方，则是排成数列的宪兵与殖民警察。他们握着警棍，身后停放着警车和临时调来的消防水车。\n\n总参谋部的态度十分明确。既然人群已经无视解散命令，并开始逼近总督府，继续退让只会证明殖民政府已经失去控制。以舍尔纳为首的部分高级军官要求立即派兵推进，必要时开枪；在他们看来，几分钟内结束的流血总好过数周后面对一场真正的暴动。而地方警察们却给出了完全不同的警告。如果开火，今天死去的每一个人在明天都会成为民族主义者与工团主义者宣传中的烈士。更温和的方案是让宪兵以高压水枪、催泪性刺激物和盾牌逐步清空广场，在不动用实弹的情况下恢复秩序。当然，这同样不会显得友善，只是至少不会给局势火上浇油。\n\n然而还有第三种办法：在总督批准下，官方可以宣布调查此次驻军事件，承诺限制军队在地方治安行动中的自由裁量权。尽管最终未必真正落实，但军方对此已经表现出明显不满——他们认为会让蛮子们尝到甜头，在之后无底线的继续向政府施压。与此同时，街道上，士兵们的手已经放到了扳机上，只待一声令下。"
 GEA.115.a:0 "通知舍尔纳，最快把暴民压制住"
 GEA.115.b:0 "出动宪兵和水枪，把广场清出来"
 GEA.115.c:0 "对外宣布政府将落实调查这次事件"
 GEA.116.t:0 "收刀入鞘"
 GEA.116.d:0 "有关驻军暴行的报告已经堆满了行政机关的档案柜。焚毁村屋、殴打嫌疑人、未经审讯的处决、以整个村庄为对象的报复性惩罚——自然不可能出自明确命令，但在长期的殖民治安行动中，它们已经逐渐变成部分军官默认的“方便手段”。\n\n哈尔认为，这种做法不仅损害政府威信，也让东亚总参谋部本身越来越难以控制。今天某个中尉可以为了追捕两名游击队员烧掉半个村庄，明天另一个上尉就可能以“军事需要”为由无视地方行政机关的命令。如若不改变军队野蛮的现状，届时整个殖民地所有本地人都站在政府的对立面也丝毫不会让人感到奇怪。\n\n为此，行政部门与军法处已经拟定了一套新的驻军行为准则。未经授权的集体惩罚和纵火将被明令禁止，大规模搜捕与清剿行动也必须留下书面记录。而地方驻军若造成大规模平民伤亡更是必须接受军法审查。另一方面，军方强烈要求保留“紧急战区”的自由处置权，认为对每一次行动都加上程序束缚，只会让士兵在面对真正叛乱时畏首畏尾。"
 GEA.116.a:0 "严格执行新军纪"
 GEA.116.b:0 "限制滥权，但给前线军官留下处置余地"
 GEA.116.c:0 "别给帝国士兵们上太多镣铐"
 GEA.117.t:0 "对民众做出让步"
 GEA.117.d:0 "哈尔很清楚，印度支那的佃农、种植园劳工、码头工人与雇员，才是维系德属东亚日常经济运转的基础；而黑色星期一以来的失业、欠薪、粮价波动与地方征收，更让这些群体成为民族主义者和工团主义者最容易争取的对象。\n\n因此，哈尔已经批准一系列有限的社会与经济让步。地方行政机关将被要求更加严格地处理拖欠工资与任意加征费用的问题，而农民可以获得税务宽限和小额信贷。至于城市工人，他们也将在工时、工伤补偿上得到最低限度的保障。这些措施远远谈不上什么社会革命，更不会动摇卡特尔们和殖民政府的主导地位。如果花费一点税款、让企业少赚一些利润，就能让成千上万的人相信继续工作比走进丛林更值得，那么这笔交易无疑十分划算。"
 GEA.117.a:0 "哈尔总督将安定这片土地"
 GEA.118.t:0 "西贡之虎"
 GEA.118.d:0 "在印度支那错综复杂的殖民地政治中，从来不乏那些甘愿为德国人效力的本土官僚，但像阮文心这样既忠心耿耿，又令自己的同胞闻风丧胆的人物，却实在不多见。这位出身南圻的越南官员早年不过是一名普通教师，后来投身殖民地行政体系，凭借勤勉的作风和毫不留情的镇压手段迅速崭露头角。在担任丐礼地方行政长官期间，他以铁腕镇压赤匪和农民骚乱，赢得了“丐礼之虎”的恶名。随着其影响力逐渐扩展到西贡，这位精明强干的官僚也开始以“西贡之虎”之名为人所知。\n\n与那些一面领取殖民政府薪俸、一面暗中同民族主义者眉来眼去的地方官员不同，阮文心对革命运动抱有近乎刻骨铭心的敌意。在他看来，无论是鼓吹赶走德国殖民者的赤匪，还是要求民族独立的激进分子，都不过是试图利用民众的不满攫取权力的野心家。长期的地方任职经历使他熟悉越南社会的宗族、乡绅与帮派网络，也深谙如何借助线人、秘密警察和地方民团瓦解地下组织。尽管他的残酷手段招致了越南民族主义者的普遍憎恨，但对于急于恢复印度支那秩序的德国殖民当局而言，这种本领恰恰难能可贵。\n\n如今，随着哈尔着手重建殖民地行政与治安体系，阮文心终于迎来了施展拳脚的机会。德国人需要一位了解本地情况、能够统领越南警察并有效打击地下反抗组织的人物，而阮文心所渴望的，则是足够的权力与资源，以便将自己的治安网络扩展至整个南圻。双方的合作或许算不上平等，却无疑各取所需。对于哈尔而言，这位令人畏惧的越南官僚将成为维持殖民秩序的得力助手；而对于那些仍在西贡暗中活动的革命者来说，德国人的归来已经足够糟糕，如今他们还必须面对一头熟悉自己每一处藏身之所的猛虎。"
 GEA.118.a:0 "一把好用的快刀"
 GEA.119.t:0 "兑现我们的承诺"
 GEA.119.d:0 "虽然革命酝酿的情绪已经消退，全面战争的威胁也不再迫在眉睫，但德属东亚的人民仍在高声呼吁改革与变革。如果我们想要维持这里来之不易的和平稳定局面，便应兑现我们当初为平息潜在起义而默许的承诺了。殖民地民众最主要的诉求，是希望在殖民政府中获得真正的代表权，使他们的关切与不满能够得到积极回应。我们当然可以对这些改革呼声置之不理，但若如此，就必须警惕分离主义情绪再度抬头。"
 GEA.119.a:0 "我们应该向土著居民开放进入政府的大门"
 GEA.120.t:0 "土著居民议会？"
 GEA.120.d:0 "殖民地中土著公民的首要诉求，是要求在殖民政府中获得真正的代表权。他们主张在德国殖民立法机构中增设一个下议院，向德属东亚本土居民开放，使其中的精英能够代表本族裔在德国统治下发声。不过为了防止不良分子和潜在激进主义者涌入这个新议院，首轮代表将由我们行政当局亲自遴选。尽管这个下议院并不掌握实际政治权力，但既能有效安抚当地民众，又能为日后更广泛的改革逐步打开大门。"
 GEA.120.a:0 "言必信，行必果。我们会兑现承诺，但我们也会指定让谁担任代表"
 GEA.121.t:0 "呼吁开放选举"
 GEA.121.d:0 "在我们同意成立由效忠派本土人士组成的下议院后，殖民地民众立刻开始呼吁举行真正公开的普选，以自主推选代表。这无疑是场危险的博弈，开放选举可能让颠覆势力渗透政府，却能极大安抚殖民地内诸多不满情绪。倘若我们直接禁止那些曾煽动印度支那分离势力的社会主义者等激进分子参选，再辅以严密监督，或许就能遏制极端思潮涌入新议会。我们该作何抉择？"
 GEA.121.a:0 "为了维持稳定，我们应该允许温和人士参加地方选举"
 GEA.121.b:0 "他们根本不适合自己做决策！拒绝要求！"
 GEA.122.t:0 "德属东亚议会第一届大选"
 GEA.122.d:0 "既然我们决定允许举行自由的地方选举，选举筹备相关的进程便随之起步，因为当地民众急于在殖民统治下确保自己的未来，不愿在路上浪费时间。尽管这些“选举”仅仅决定谁将在殖民地议会中组成文官政府，且实际上仍几乎不掌握任何实权，但这将在安抚民众方面发挥重要作用。参选的团体甚至不是完全组织化的政党，而是由殖民地中志同道合的公民组成的松散联盟，各自服务于其背后的赞助者和利益。苏丹民族组织作为保守主义、传统和君主主义的堡垒，其许多显要人物来自遍布这片群岛的各个贵族世家和家族。与他们对抗的是法国和英国统治时期遗留下来的各种残余团体、由各色精英和商界领袖组成的特殊利益集团，以及最终由小职员领导的规模不大但不断壮大的亲工人团体。随着这些团体纷纷参选，下议院的席位正在迅速填满，但只有一方能够获得明确多数，以便下议院拥有更广泛的共同方向。随着最终选票的统计，德属东亚新文官政府的宣布只是时间问题。"
 GEA.122.a:0 "苏丹民族组织利用和君主的联系赢得大选"
 GEA.122.b:0 "由印度支那企业家资助的宝信商会占据了最多席位"
 GEA.122.c:0 "由法国残余势力支持的社会最高运动获得了最多的选票"
 GEA.122.e:0 "进步劳工阵线拿下了下议院的多数"
#约西亚斯
 GEA.200.t:0 "驯服东方卡特尔"
 GEA.200.d:0 "十余年来，德属东亚的繁荣几乎总伴随着那些大型企业的名字。汉堡-美洲航运公司把橡胶、锡矿、大米与木材源源不断地运往欧洲，以德意志银行为首的金融联盟为种植园、矿山与港口提供信贷，而诸如西门子和克虏伯等工业卡特尔则带来了机器、电力设备和管理人员。正是这些垄断巨头，让帝国能够在远离本土数千公里的地方迅速恢复贸易、扩大生产，并把东方殖民地牢牢接入德国主导的世界市场。\n\n可同样也是这些推动帝国经济齿轮转动的垄断者，让这片殖民地越来越像一个独立的企业王国。为了压低成本而强行扩张种植园、拖欠工资、挤压本地商人和小农的事情早已屡见不鲜，矿业特许、税务豁免更是不断吸取着本应属于殖民政府的税收。黑色星期一到来后，这套体系的另一面更暴露无遗：繁荣时利润归企业，危机时损失却往往要求殖民政府共同承担。\n\n亲王当然没有兴趣同这些企业彻底翻脸。卡特尔掌握的资本、技术和销售网络仍然是德属东亚不可替代的支柱。真正的问题只是如何在现状下制衡与卡特尔们的关系。一种办法是重新审查特许经营与税务优惠，为卡特尔的扩张划出更清晰的边界，并让它们为自己的经营行为承担更多责任。另一种办法则更加符合亲王熟悉的政治方式：既然这些企业想继续享有便利，那就让它们用投资、贷款、就业和政治支持来交换。只要达成利益交换，约西亚斯总督也很乐意通过一些让步来换取更多政治上的盟友。\n\n当然，我们同样可以什么都不做。过去十几年，这些企业自己也把东方经营得颇为像样。也许最简单的办法，就是让它们继续按照自己的方式发财。"
 GEA.200.a:0 "这里可不是董事会的私产"
 GEA.200.b:0 "通过私下密约来达成共识"
 GEA.200.c:0 "不出大乱子就随他们去"
 GEA.201.t:0 "新阿罗尔森宫"
 GEA.201.d:0 "新加坡的雨季刚刚过去，丹戎巴葛方向的空气仍带着海水、湿土与煤烟混杂的气味。在唐林一处被清理出来的高地上，脚手架、石料和成排木桩已经取代了原先的树木。约西亚斯亲王的新私人宅邸，终于正式破土动工。\n\n这并不会是一栋普通的殖民地别墅。亲王亲自要求建筑师从瓦尔德克家族在故乡的阿罗尔森宫汲取灵感。那座宫殿是瓦尔德克诸侯地位最醒目的象征之一：十八世纪初，弗里德里希·安东·乌尔里希晋升帝国亲王后，以一座受到凡尔赛启发的巴洛克宫殿取代了家族原有的旧宅。如今，数千公里之外的新加坡也将出现一个缩小而经过改造的“东方阿罗尔森宫”。\n\n设计图保留了德国宫廷建筑所偏爱的对称正立面、中央大厅、长窗与仪式性入口，但建筑师很快发现，黑森山地的宫殿若被原样搬到赤道附近，大概只会变成一座华丽的蒸笼。因此，宅邸的两翼被加入宽阔凉廊，屋檐被明显加深，窗户增加木制百叶，主要起居空间也被抬高并留出贯通的通风路径。厚重的欧洲式石墙外，是遮挡新加坡暴雨与烈日的深檐；巴洛克式大厅后方，则藏着专门为热带气候设置的庭院、风廊与服务区域。\n\n选址本身同样经过精心考虑。唐林远离码头最嘈杂的街区，却又没有远到脱离新加坡的政治与商业中心。宅邸将坐落于树木环绕的高地之上，从上层露台能够越过周围的种植园与低矮屋顶，眺望这座不断扩张的东方港城。亲王还要求花园中同时种植欧洲式修剪灌木与当地棕榈、兰花和热带树木——毕竟这里并不是瓦尔德克，而他似乎也没有真的打算假装这里是。\n\n有本地官员私下抱怨，在殖民财政仍然吃紧的时候修建如此宅邸未免奢侈。不过亲王的亲信们却给出了另一个解释：总督并不仅仅需要一处住所，还需要一个能够把官员、企业代表、贵族和来自整个东方的宾客聚到同一张餐桌上的地方。如此说来，这栋房子或许确实不仅仅是为了睡觉。"
 GEA.201.a:0 "让阿罗尔森在东方再现"
 GEA.202.t:0 "亲王的晚宴"
 GEA.202.d:0 "几个月前还满是泥土、脚手架和锤击声的唐林高地，如今已经竖起了一座与新加坡其他宅邸截然不同的建筑。夜幕降临后，成排电灯照亮了浅色的巴洛克立面，宽大的热带凉廊则向花园敞开。乐队在大厅一侧演奏，侍者则端着莱茵葡萄酒、香槟与精细摆盘的南洋菜肴穿过人群。约西亚斯亲王的新宅邸迎来了落成后的第一场大型宴会。\n\n受邀者远不止德国官员和军官。新加坡与马来亚的华商、银行家和地方代表同样出现在长桌旁。在总督与德国企业代表交谈时，身旁还能看到马来苏丹的使者、欧洲旧侨以及几位从印度支那赶来的商界人物。餐桌上的座次显然并非随意安排。德国官员与地方名流彼此交错而坐，没人能完全躲回自己熟悉的小圈子里。一位银行家可能发现自己旁边坐着殖民军军官，而一个德国航运公司经理则不得不认真听完华商关于港口费率的抱怨。\n\n约西亚斯似乎非常享受这一切。对于他而言，只要东方最有钱、最有关系、最值得利用的一群人愿意在这里赴宴、交谈，并开始习惯通过亲王本人解决问题，那么这座宫殿就已经发挥了它最重要的功能。窗外是潮湿闷热的新加坡夜色，屋内却满是德语、英语、马来语和各种汉语方言交错的声音。在故乡阿罗尔森可从未有过这样的晚宴。"
 GEA.202.a:0 "敬我们的东方朋友！"
 GEA.203.t:0 "约西亚斯圈"
 GEA.203.d:0 "在德属东亚，越来越多的人开始发现，真正决定一份任命、一纸合同乃至一项政策命运的，未必总是写在公文上的那些机构。尽管德国的世界殖民帝国中的政府腐败并不是什么稀罕事，但能够做到德属东亚如今这份田地的也实属罕见。\n\n约西亚斯亲王上任以来，凭借家族旧交、军中人脉、商界关系以及一次又一次私人宴会、推荐和利益交换，逐渐在殖民政府内部聚拢起了一批对他本人而非单纯对职位忠诚的人。无论是从德国本土追随而来的旧识，还是是在东方发迹的企业家和军官，只要忠诚于总督本人，都会获得大大小小的回报。\n\n这些人如今充斥着政府机关、企业董事会乃至军政部门。通过彼此介绍并交换消息，在某个新面孔进入圈子之前一件最重要的事就会被所有人事先确认：他究竟是否可靠。久而久之，知情者们开始用一个半是讥讽、半是敬畏的称呼来概括他们——“约西亚斯圈”。而更通俗的说法则是更喜欢把这些突然拥有头衔、财富和影响力的新贵称作“东方贵族”。\n\n他们的共同点并不复杂。只要亲王提出要求，他们便会忠实执行；只要亲王需要支持，他们便会忠诚地替他铺路。而作为回报，职位、承诺、贷款、甚至土地也会继续在这个小圈子内部流转。更重要的是，这些人从未满足于现有规模。任何场合都可能成为吸收新成员的机会。\n\n这套体系当然高效。命令不再需要经过层层争论，只需要沿着私人关系迅速传递。可同样显而易见的是，德属东亚正在形成一个越来越封闭、越来越腐败，也越来越离不开约西亚斯本人的权力网络。"
 GEA.203.a:0 "这就是他的行事方式"
 GEA.204.t:0 "临时要求"
 GEA.204.d:0 "午后的办公室闷得令人发昏。吊扇在头顶缓慢转动，桌角压着一叠从柏林转来的文件，而其中最上面那份，正是殖民办公厅刚刚下发的行政训令。\n\n海因里希·克劳泽把那几页纸又看了一遍。内容并不复杂：削减一部分地方性补贴，冻结数项尚未批准的人员任命，并要求各部门在本季度结束前重新提交预算。措辞一如既往地严肃，末尾还盖着帝国办公厅的正式印章。克劳泽已经不知道经手了多少这种官方文件，流程对他来说也早已驾轻就熟。\n\n他正准备叫秘书进来起草执行通知，门却先被敲响了。他抬头，来人是总督直属秘书处的一名年轻官员，只带来了一页纸。克劳泽接过后皱起眉头——其中几项要求恰恰与柏林的训令相反：几处补贴被要求维持现状，而两名候选人的任命则被要求尽快通过。对于一笔原本准备暂缓的款项，还被要求优先拨付。\n\n“这和柏林的命令不一致。”克劳泽抬头说道。年轻官员没有辩解，只是把手套夹到腋下，平静地回答：“这是上头的直接要求。”\n\n办公室里安静了一会儿。\n\n克劳泽又低头看了看两份文件。一份印章齐全，程序无可挑剔；另一份只有简单的批注，但总督那长长的头衔和本人亲签在纸上尤为刺眼。\n\n“那柏林那边呢？”他最后问道。对方只是笑了笑。“那边就不用你来操心了。”等门重新关上后，克劳泽在椅子上呆坐半晌。最终，他把来自柏林的文件压到下面，拿起了另一份纸，继续手头的工作。"
 GEA.204.a:0 "服从即是第一要务"
 GEA.205.t:0 "恶意丑化"
 GEA.205.d:0 "最先引起注意的是一批出现在西贡码头上的新海报。画上的日本军官被描绘得肥硕而狰狞，一只靴子踩着朝鲜半岛，另一只已经跨过中国大陆，手中的军刀正指向南洋。海报顶端印着几个硕大的德文字母：“下一个是谁？”\n\n几天后，新加坡也出现了类似的东西：头戴军帽、长着尖牙的怪物伏在太平洋地图上，几只粗壮的手臂分别伸向中国、菲律宾、印度支那和马来亚；另一张则更加简单，日本列岛被画成一只巨大的章鱼，触手已经缠住朝鲜、台湾和中国东北，而其中一根正悄悄绕过暹罗湾。下面只印了一句：朝鲜，台湾，下一个是新加坡？”\n\n没人知道从哪里来的这么多宣传材料。但报纸很快跟上，开始刊登类似的文章。实际上，这些滑稽的画报倒也并非全无根据。东京军政两界中鼓吹向南扩张的人也从来不是什么秘密，只不过如今明目张胆的反日宣传还是迅速引起的各方的注意力。\n\n日本驻德使馆向外交部递交了一份措辞相当严厉的抗议照会，指责德国殖民当局正在有组织地散布侮辱日本民族与天皇陛下军队的宣传。几家东京报纸随后刊出了海报翻拍件，其中一张怪物长着獠牙、挥舞短刀的画像尤其引起愤怒。然而，这让柏林反倒显得尤为尴尬。外交部把近期文件翻了个底朝天，才确认自己既没有批准，也没有收到任何需要批准的申请。于是外交部只能向大使不断重复这些作品并不代表帝国政府的正式立场、柏林仍然重视与东京的外交关系这些桃套话。至于为什么德国海外领地能够在擅自印发这些政治宣传，外交官们给出的解释则含糊得多，只反复强调德属东亚在“地方宣传事务”上拥有相当大的自主权。\n\n随后，一封要求说明情况的电报被发往新加坡。在德属东亚政府确认收到后便再没有消息了。当然，柏林也懒得追问后续进展。\n\n一星期后，西贡街头又出现了一张新海报。画面上，一艘悬挂旭日旗的巨大军舰正越过地平线，而岸边的德国士兵已经把步枪扛在肩上，下面印着：“最好现在就做好准备。”"
 GEA.205.a:0 "也许应该再多建几个印刷厂..."
 GEA.206.t:0 "双重姻亲"
 GEA.206.d:0 "德意志诸王公之间盘根错节的亲缘关系，往往足以让一张家谱看起来比铁路时刻表还要复杂。不过，在约西亚斯·楚·瓦尔德克-皮尔蒙特亲王的诸多家族联系中，有一段关系尤其值得一提——他同奥尔登堡大公尼古拉斯之间那颇为罕见的“双重姻亲”。\n\n尼古拉斯·弗里德里希·威廉于1897年出生在奥尔登堡，是大公弗里德里希·奥古斯特二世与梅克伦堡-什未林的伊丽莎白·亚历山德琳女公爵之子。作为家中长子，他从出生起便注定继承这个坐落于德国西北部、面积不大却颇以自身传统为傲的大公国。年轻时代的尼古拉斯同许多德意志王公子弟一样接受军事教育，并曾在奥尔登堡第19龙骑兵团服役。世界大战的胜利使奥尔登堡王室得以继续保有自己的王冠，而1931年其父去世后，尼古拉斯也顺理成章地继承了大公之位。\n\n奥尔登堡这个面对北海、夹在普鲁士领土之间的大公国拥有自己的宫廷、地方行政传统与王朝记忆，即使帝国统一已过去数十年，奥尔登堡人仍习惯于首先把自己视作奥尔登堡人。尼古拉斯继承的正是这样一顶王冠。而他同约西亚斯的关系，则更加有趣。1921年，约西亚斯的妹妹海伦娜公主在阿罗尔森嫁给了当时仍是大公储的尼古拉斯。翌年，约西亚斯本人又在拉施泰德迎娶了尼古拉斯的妹妹阿尔特堡女公爵。于是，尼古拉斯娶了约西亚斯的妹妹，而约西亚斯又娶了尼古拉斯的妹妹。两人既是彼此妻子的兄长，又同时是对方的妹夫，真正称得上亲上加亲。\n\n这两场婚姻也绝不只是家族生活中的趣闻。瓦尔德克-皮尔蒙特虽是帝国内较小的邦国，却同荷兰、英国以及其他德意志王室保持着广泛联姻；奥尔登堡本身则同梅克伦堡以及北德诸宫廷关系密切。通过这层双重姻亲，约西亚斯实际上获得了一条直接通往北德王公、地方保守派与军事贵族的私人通道。尼古拉斯本人并不是那种喜欢在柏林政坛制造轰动的人物。他不像那些帝国大政治家那样热衷于议会斗争，也没有约西亚斯那般对权力网络近乎本能的嗅觉。尼古拉斯本人又很少公开卷入柏林那些令人疲惫的政治斗争，但在平日里，老派军官、北德王公与宫廷人士都愿意同奥尔登堡大公保持往来。\n\n因此，当约西亚斯开始在遥远的德属东亚经营自己的关系网时，这位身在拉施泰德的双重姻亲自然显得格外方便。尼古拉斯未必需要亲自为东方做些什么；偶尔替一位军官写封推荐信，为某次任命说一句好话，或者把某个值得结识的人介绍给约西亚斯，就已经足够发挥作用。在某些事情上，一位大公寄来的私人信笺，依旧可能比官方印章更加管用。"
 GEA.206.a:0 "亲上加亲"
 GEA.207.t:0 "深入黑暗大陆"
 GEA.207.d:0 "中央非洲恶名昭著的政治团体“主权派”，它的来由该如何讲清楚呢？世界大战胜利后，一批年轻军官和殖民官员怀着在非洲继续帝国伟业的理想南下，却很快发现中央非洲同宣传画上的模样相去甚远。柏林的法令抵达地方时早已面目全非，军官们各行其是，而老资历们则守着陈旧的人脉和特权不肯挪步。由这些失意者组成的新殖民集团因而主张进一步集权和德意志化，而其中最不耐烦、也最激进的一批人，渐渐有了另一个名字——“主权派”。\n\n站在这群人最前方的，是赫尔曼·冯·戈林。世界大战中的王牌飞行员、德意志祖国党的政治明星，也是一个对财富、声望与权力几乎从不掩饰渴望的人。柏林原本把他送到非洲，多少有让这位麻烦人物远离帝国政治中心的意思；戈林本人却显然不这么看。在他眼中，中央非洲不是流放地，而是一块尚未真正属于任何人的巨大权力试验场。\n\n然而，主权派的真正大脑与智囊，也是他们理论基石的来由，是柏林法学界那位越来越难以忽视的人物——卡尔·施密特。施密特对议会讨论、自由主义法治与那种认为所有政治问题都能通过既定程序解决的乐观主义素来缺乏耐心。在他的论述中，国家权力最重要的时刻并不是一切正常运转的时候，而是法律无法预先规定答案的危机时刻。谁能够在这种情况下宣布出现“例外”，并决定接下来应当如何处理，谁才真正掌握主权。这样一套理论放在柏林大学的讲堂里，或许只是宪法学者之间令人头疼的争论；到了中央非洲，却几乎像是专门为当地量身定做。毕竟，这里处处都是“例外”。\n\n在主权派的观念中，总督既然承担维持整个殖民地秩序的最终责任，那么在非常情况下，他的权力自然可以超越通常的司法程序。而这也吸引了同样野心勃勃的约西亚斯亲王。在短暂的交流与宴请后，凭借相同的野心与同在世界大战战场上浴血厮杀的经历，约西亚斯亲王与赫尔曼·戈林这头野兽几乎毫无阻碍地达成了共识。如今随着戈林与约西亚斯分别在帝国两大殖民地扎根，合作也自然水到渠成。"
 GEA.207.a:0 "同狮共舞"
 GEA.208.t:0 "红色将军与阴谋家"
 GEA.208.d:0 "库尔特·冯·施莱谢尔从来不是德意志帝国最容易被归类的人物。他出生于普鲁士军官贵族家庭，青年时代循着父辈的道路进入陆军，本应成为又一个循规蹈矩的总参谋部军官；可等到世界大战结束时，他却蜕变为帝国政坛异军突起的政治新秀。\n\n大战前后，施莱谢尔先后同奥斯卡·冯·兴登堡、威廉王储、弗朗茨·冯·巴本以及一批年轻军官建立了关系。凡尔登期间，他又因公开抨击大发战争财的工业家而同传统容克产生裂痕，却因此在军队之外赢得了一些颇为意外的朋友。到了鲁登道夫权势最盛的时候，施莱谢尔已经不再只是一个普通军官。最终，也正是他同威廉王储一道说服德皇，结束了鲁登道夫那越来越难以控制的统治。\n\n这种成功并没有让施莱谢尔对公开权位产生多少迷恋。相反，他似乎越来越确信，真正牢固的权力恰恰不需要每天出现在报纸头版。通过不断地牵桥搭线与政治拉拢，施莱谢尔开始尝试通过玩弄权术来从暗中操纵国家。甚至皇储本人也没能完全置身其外。施莱谢尔与威廉相识于波茨坦卫队时期，二人多年保持私人往来。通过威廉皇储的关系，施莱谢尔得以将他的“秘党”进一步扩大。\n\n事实上，对于这种手段，约西亚斯并不陌生。远在德属东亚，他正在用另一套规模更小、环境也更加宽松的方式做着相似的事情：把亲信军官放到合适的岗位，再把商人和官僚拉进私人圈子，用现实政治与利益交换替代冗长的制度协调。两人的政治理想未必完全一致，但毫无疑问通过与这位“红色将军”达成某些合作与默契，亲王能够在远东获得更多便利，以实现他自己那不可告人的野心。"
 GEA.208.a:0 "也许，秘党里也有我的一个位置..."
 GEA.209.t:0 "科堡的表兄"
 GEA.209.d:0 "约西亚斯的亲族关系横跨德意志帝国的大半个王公世界，而其中最富传奇色彩的一位，莫过于萨克森-科堡-哥达公爵查尔斯·爱德华。两人同属欧洲王室那张错综复杂的家谱，并且确实互为表亲；不过，与出生在阿罗尔森宫、从一开始便注定继承瓦尔德克-皮尔蒙特家业的约西亚斯不同，查尔斯·爱德华的人生最初本不该属于德国。\n\n于1884年出生在英格兰，爱德华公爵是维多利亚女王幼子奥尔巴尼公爵利奥波德的遗腹子。按照出生时的身份，他是英国王子，是当时仍属于萨克森-科堡-哥达王朝的英国王室的一员。他本人的童年与青年生活与德意志曾完全无关，若不是继承问题，他大概会以一位普通英国王室亲王的身份度过一生。\n\n然而，萨克森-科堡-哥达公国的继承链很快把这个孩子从英国拉到了德国。1899年，年仅十五岁的查尔斯·爱德华被选定为公国继承人，并被送往德国接受重新教育。威廉二世亲自关注这位年轻表弟的成长，希望把一个英国王子塑造成合格的德意志君主。次年，他继承萨克森-科堡-哥达公爵之位，待成年后正式亲政。然而令人感到惊讶的是，查尔斯·爱德华最终适应德国的程度，甚至超过许多人的预料。英语仍是他童年最熟悉的语言，但他早已为他新的祖国而深深倾倒。世界大战爆发后，他选择站在德国一边，同自己出生的国家兵戎相见。大战结束后，查尔斯·爱德华也继续成为帝国王公政治中一个颇为特殊的人物，德国政治圈也因此尤其看重他作为英德王室之间“桥梁”的身份。\n\n约西亚斯与这位表兄之间的联系远不只是逢年过节交换几封礼貌信件。两人都出身于帝国的小邦王室，都对军队和传统等级秩序抱有天然亲近，也都非常清楚，王公贵族之间的密切联系总能为双方带来更多政治便利。查尔斯·爱德华连接着科堡、英国旧王室、瑞典与德国宫廷；约西亚斯则正在把自己的关系延伸到奥尔登堡、柏林军界乃至遥远的东方。\n\n尤其是在如今欧洲被革命、流亡王室和新政权撕裂的时代，一位能够同时在德国王公、北欧宫廷以及英国保王派之间说得上话的表兄，显然比一个普通外交官更加有趣。哥达公爵未必能够替总督解决德属东亚的日常麻烦，但如果亲王需要引见某位保守名流，或是同在远东仍有影响力的某位英国流亡贵族见一面，那么科堡总能提供一条绕过正式渠道的路。"
 GEA.209.a:0 "通过表兄的关系，亲王的朋友遍布世界"
 GEA.210.t:0 "烟囱与王冠"
 GEA.210.d:0 "德意志帝国的上流社会并不只存在于宫廷、军官俱乐部和乡间庄园里。莱茵河与鲁尔河沿岸那些终日吐着黑烟的工厂，属于另一批能够同部长、将军乃至王公平起平坐的人物。实业家联盟掌握着煤炭、钢铁、船坞、机器和成千上万名工人的饭碗；在一个以工业赢得世界大战、又依靠工业维系世界帝国的国家里，这种力量显然很难被任何一位有抱负的亲王忽视。\n\n若要给实业家寻找一个最古老而醒目的象征，阿尔弗雷德·克虏伯的名字几乎无法绕开。十九世纪中叶，正是这位埃森工业家把家族的小型铸钢厂扩展为足以影响整个普鲁士乃至德意志统一进程的工业巨兽。克虏伯的铁路车轮、火炮、钢轨与铸钢产品在德意志帝国铁于血的的崛起之路上扮演至关重要的角色，也让克虏伯成为了德意志军工的代名词。随着克虏伯在远东投资的进一步扩张，约西亚斯亲王与克虏伯这个庞大卡特尔之间的友好合作关系更是无比重要。抛却工业巨头之外，在实业家联盟乃至当代德国，阿尔弗雷德·胡根贝格这个名字也如雷贯耳。从公务员体系转入实业界，随后在克虏伯企业中获得重要位置，又逐渐成为实业家组织、新闻产业和右翼政治之间不可忽视的中间人物，胡根贝格同时与传媒业与重工业界有着不可分割的密切联系。同是，他本人更是德意志祖国党这一在如今政坛上颇具潜力的党魁。这些头衔让其本人成为一位约西亚斯亲王着重尝试争取的关键人物。\n\n毫无疑问，这些实业家们对远东这片潜力巨大的土地也同样觊觎已久，而约西亚斯亲王则总能提供给他们想要的利益。"
 GEA.210.a:0 "皆为利来"
 GEA.211.t:0 "趁火打劫"
 GEA.211.d:0 "在黑色星期一之前，谁有能想到汉堡-美洲航运公司轰然倒塌的场景呢？自十九世纪中叶创立以来，这家公司几乎伴随着德意志海外贸易一同成长。从横渡大西洋的移民船，到连接欧洲、非洲与亚洲的货运航线，再到“皇帝”号、“祖国”号和“俾斯麦”号这些足以成为帝国工业实力象征的巨型邮轮，汉堡-美洲航运与帝国的海外扩张紧紧捆绑。通过遍布世界各地的码头与航线，无数货物得以转运，而更多的德国人开始前往殖民地寻求更大的机会。\n\n然而，黑色星期一使国际贸易在数月间急剧萎缩，汉堡-美洲航运的股票更是几乎在一夜之间变成废纸。老总督巴林的死也与其脱不开干系。无论是公司的客运量或是货运量都降到了黑色星期一前的半数甚至三分之一。如果不是由帝国政府稍微资助，如今的汉堡-美洲航运早已分崩离析。但这却让约西亚斯嗅到了机会。对于德属东亚而言，德意志帝国失去一家拥有成熟全球航运网络的公司尤其麻烦。新加坡、西贡与本土之间的经济联系，总不能永远指望外国船东替我们维持。同时，如果德属东亚政府能够占据相当数量的股份，那么许多见不得人的生意也能有存在的土壤。这对缓解政府财政压力也是幸事一件。\n\n如今，公司董事会希望获得一笔国家担保贷款与紧急周转资金，使汉堡-美洲航运能够保住核心船队，并在世界贸易恢复后重新扩张。约西亚斯能够通过政经界的关系拉来这笔贷款，而德属东亚则能够填补上这部分资金缺口。但此时，另一种意见正在总督府和部分总督亲信中得到越来越多支持。既然私人资本已经无力承担损失，却要求国家拿钱来保住船队，那么政府也没有理由只做一个没有表决权的慷慨债主。德属东亚可以趁此时趁火打劫，通过直接注资换取大笔股份和董事席位，将公司的东方航线、港口投资和船队调度逐渐置于政府影响之下。名义上，汉堡-美洲航运仍会是一家公司，只是今后东方的贸易业务将由新加坡来指导。现如今，汉堡方面正在等候答复，而一批暂时无处可去的远洋轮船仍静静停在易北河口。"
 GEA.211.a:0 "提供贷款担保，让他们自己渡过难关"
 GEA.211.b:0 "趁现在捞一笔大的"
 GEA.212.t:0 "是谁在暗中破坏？"
 GEA.212.d:0 "最近几周，如果谁还继续用“地方治安问题”来描述德属东亚境内发生的糟烂事，那么他一定会被认为是工团或者日本间谍。\n\n破坏活动与游行示威突然在数周内强度极度增加，而各地涌出的反德宣传单更是证实这背后定有阴谋主使。殖民警察首先把目光投向了藏在印度支那雨林里的越南工团主义者。那些被统称为越工的游击队早已习惯了执行各种破坏暗杀与鼓动民众。他们了解山区，也能够依靠村庄中的秘密支持者获得食物与消息。而最近缴获的一批宣传品中甚至再次出现了来自巴黎和伦敦的革命口号。对军方而言，答案显而易见：丛林里那些人最近又开始作妖了，只要顺着旧据点重新搜一遍，总能找到些什么。\n\n然而，新加坡的阿勃维尔们提出了不同意见。几次破坏行动都发生在郊区甚至城市内部，再不济也是一些比较大的村镇附近，而不是越工最常活动的偏远山区；反德宣传单上也不尽是宣扬工团主义的那一套屁话，也掺杂了相当量的民族主义话术。自安沛兵变以来，越南国民党虽然遭到反复镇压，却从未真正消失。\n\n然后，海军辖下的独立情报部门把第三份报告送到了总督府。过去一个月里，几名持日本证件的商人频繁出入新加坡、西贡和海防，其中至少一人的身份记录存在明显问题。另有报告称，日本商社正在通过当地华商和中间人搜集港口吞吐、油料储备以及德属东亚海军航线的资料。这本身并不能证明东京同铁路破坏有什么关系，但这一切也暗示若日本人真准备向南扩大影响，最值得他们了解的显然是有关东亚分遣舰队的情报。而破坏活动和加大反德宣传这些手段也很可能是吸引我们调查方向的烟雾弹。\n\n问题开始变得愈发棘手。越工有理由制造破坏，越南国民党也一样；至于日本人，他们或许只是在进行再普通不过的谍报活动，也可能正在有意识地帮助其中某一方。甚至还有一种更加令人不安的可能：我们面对的根本不是同一个组织，而是几股互不相干的势力恰好同时发现德属东亚最近相当容易下手。总督已经批准扩大调查，但警察、宪兵与情报机关不可能同时把整个东方翻个底朝天。我们必须抓住其中一种可能性深入调查。"
 GEA.212.a:0 "赤匪们最爱搞这种把戏"
 GEA.212.b:0 "越南国民党始终贼心不死"
 GEA.212.c:0 "盯住日本人"
 GEA.213.t:0 "赤色阴谋的幕后黑手"
 GEA.213.d:0 "经过数周的秘密调查，殖民地警察终于揪出了近期一系列反德宣传与破坏活动的幕后主使。调查最初从几名因散发工团主义传单而遭到逮捕的码头工人入手，顺着他们供出的联络地址，宪兵发现了一张遍布西贡工厂、码头与工人居住区的地下网络。经过连日监视，警方最终锁定了一处藏身于堤岸的秘密印刷所，并趁组织骨干召开会议时突然发动突袭。数名越工地下干部当场被捕，其中便包括负责策划近期骚乱与破坏行动的主要负责人。搜查人员还缴获了大量反德宣传品、秘密联络名册以及针对殖民地官员和军事设施的行动计划。\n\n根据审讯中获得的供词，这些越工残党并不满足于散发传单和举行罢工。他们希望利用德国殖民政府日益严厉的治安政策激起民众的不满，再通过工会与地下组织将零散的抗议活动发展成一场新的反德起义。近期发生的铁路破坏、针对德国商人的袭击以及煽动工人罢工的行动，正是这项计划的一部分。尽管他们的武装力量早已在德国军队的围剿中损失惨重，但仍有不少秘密党员潜伏在城市之中，等待着重新向殖民当局发起挑战的机会。\n\n随着组织首脑及其亲信相继落网，越工在西贡经营多年的地下网络终于遭到了沉重打击。德国宪兵根据缴获的名册继续搜捕各地同谋，而总督府也终于能够向公众宣布，近期困扰印度支那的反德破坏活动已经得到遏制。然而，调查报告最后的一项发现仍令殖民地官员们颇为不安：这些革命者的资金与人员来源并不完全依赖境外援助，其中相当一部分支持者竟然来自德国人认为早已恢复平静的工厂与居民区。"
 GEA.213.a:0 "赤匪始终没有放弃他们的革命"
 GEA.214.t:0 "国民党的地下活动"
 GEA.214.d:0 "安全部门对于越国党的怀疑最终得到了证实。在连续监视数名经常出入学生集会与民族主义刊物编辑部的可疑人物后，调查人员顺藤摸瓜，发现了一个由国民党旧党员、流亡的地下革命者及青年知识分子组成的秘密团体。该组织的负责人一直以商人身份活动，借助西贡与河内之间的商业往来传递消息，并利用数家书店和学校作为联络据点。宪兵与阿勃维尔特工们在证据链齐全后开始突袭，成功逮捕了幕后策划者及其主要助手，还查获了一批秘密的组织名册。\n\n与越工不同，这些越南国民党人对工团主义并无多少好感，甚至将工团主义者的崛起视作民族革命失败的重要原因。然而，他们同样不愿意接受德国对印度支那的永久统治。越国党人一直试图借助反德宣传重新唤起民众的民族意识，并通过学生团体、退伍军人与地方商人建立属于自己的地下组织。按照缴获文件中的计划，他们准备先以抵制德国经济渗透为名扩大影响，再逐步发动要求越南自治的政治运动。至于宣传活动中那些夸大其词的德军暴行传闻，有些确有其事，但更多的则属于子虚乌有的宣传。\n\n随着首脑遭到逮捕与审判，越国党苦心建立的秘密网络也迅速瓦解。宪兵在进一步搜查中发现，部分成员甚至曾主动向德国官员提供越工的情报，希望借此换取殖民政府对民族主义活动的宽容。可惜，他们显然误判了政府的态度。"
 GEA.214.a:0 "他们仍然在做着独立的美梦"
 GEA.215.t:0 "来自东京的阴影"
 GEA.215.d:0 "阿勃维尔和宪兵们原本以为，近期接连发生的反德宣传与破坏活动不过是越工残党或民族主义者又一次不自量力的尝试。然而，随着调查逐渐深入，几笔流入地下组织的可疑款项却将宪兵引向了一家由日本商人经营的进出口公司。经过数日监视，阿勃维尔发现，该公司不仅长期向民族主义地下组织提供资金，还利用官方商业货运替他们运送印刷设备乃至武器。宪兵随即对其展开突袭，当场逮捕了数名日本籍职员及其越南同伙，而真正负责指挥这场阴谋的特高课特工，也在准备搭乘轮船离开西贡时遭到拘捕。\n\n审讯与缴获的密电很快揭露了整个阴谋的来龙去脉。原来，日本情报机关早已利用印度支那各地日益增长的反殖民情绪，暗中同越工残党及部分民族主义组织建立联系，并为其宣传、罢工与袭击行动提供资金和情报。东京方面自然不会对这些越南人的独立事业抱有什么真诚的同情，但只要能够迫使德国人将更多军队投入殖民地治安事务，扰乱德国在南洋的贸易与军事部署，这些丧家犬就自然有了价值。更有甚者，日本人还试图将自己的特工安插进反德组织内部，以便在适当的时候将这些骚乱引向德国的重要军事设施。\n\n随着幕后主使落网，日本人在印度支那经营的这张秘密情报网络终于遭到了沉重打击。然而出于外交纠纷的考虑，殖民政府决定暂时隐瞒日本官方涉案的细节，对外仅宣布成功破获了一起由外国势力资助的反德阴谋。至于那名被关押在宪兵监狱中的日本军官，以及东京方面随后发来的秘密交涉请求，则成为了外交部需要考虑的难题了。"
 GEA.215.a:0 "贱种日本人"
 GEA.216.t:0 "贵族新政"
 GEA.216.d.a:0 "随着阿尔贝特·巴林的突然逝世，德属东亚的统治权最终落到了瓦尔德克-皮尔蒙特的约西亚斯亲王手中。这位出身德意志古老贵族世家的亲王，原本并非行政事务的行家，却在远东局势风雨飘摇期间承担起了保卫帝国边疆的重任。面对席卷殖民地的革命浪潮，约西亚斯曾试图凭借自己的贵族身份与外交手腕，争取当地君主、土邦贵族及传统统治者的支持，以恢复摇摇欲坠的殖民秩序。然而，革命者的攻势远比柏林所预料的更加猛烈，许多地方领袖或是已经倒向叛军，或是无力约束自己的臣民。\n\n在随后的数月里，约西亚斯亲王与帝国驻军一道经历了这片殖民地近十年来最为艰苦的战争。德国士兵在印度支那的山地与丛林中无惧死亡地奋力推进。尽管付出了惨重代价，帝国的军队最终还是粉碎了叛军的主力，重新确立了德国在印度支那的统治。如今，战争留下的创伤仍遍布殖民地各处，昔日繁荣的种植园与商港亟待恢复，而那支曾经威震远东的帝国舰队也早已疲惫不堪。但约西亚斯亲王毕竟成功保住了这份帝国的海外遗产，他的勇气与领导才能也因此赢得了军方和殖民地保守派的尊敬。\n\n不过，亲王显然不打算满足于一位总督的荣誉。对于这位雄心勃勃的瓦尔德克亲王而言，德属东亚的重建不仅意味着恢复帝国的威望，更是一次将这片远东领地经营成自己政治基业的难得机会。"
 GEA.216.d.b:0 "随着阿尔贝特·巴林的突然逝世，德属东亚的统治权最终落到了瓦尔德克-皮尔蒙特的约西亚斯亲王手中。这位出身德意志古老贵族世家的亲王，原本并非行政事务的行家，却在远东局势风雨飘摇期间承担起了保卫帝国边疆的重任。面对席卷殖民地的革命浪潮，约西亚斯曾试图凭借自己的贵族身份与外交手腕，争取当地君主、土邦贵族及传统统治者的支持，以恢复摇摇欲坠的殖民秩序。然而，革命者的攻势远比柏林所预料的更加猛烈，许多地方领袖或是已经倒向叛军，或是无力约束自己的臣民。然而，叛乱蔓延的速度远远超过了亲王的预料，原本尚存的一点地方忠诚也随着德国军队的溃败而烟消云散。\n\n这场灾难几乎摧毁了德属东亚数十年来苦心经营的一切。帝国失去了大片富饶的殖民领地，许多德国企业的资产被迫遗弃在叛军控制区，而昔日作为帝国远东霸权象征的舰队，如今也只能勉强维持剩余殖民地之间的联系。尽管如此，约西亚斯亲王仍然成功维系住了残存的行政体系，并凭借自己与柏林宫廷及德国政界的关系，避免了殖民政府在战败后彻底瓦解。对于那些已经失去家园与产业的殖民者而言，这至少算得上一丝慰藉。"
 GEA.216.d.c:0 "随着阿尔贝特·巴林的突然逝世，德属东亚的统治权最终落到了瓦尔德克-皮尔蒙特的约西亚斯亲王手中。与那些主张以武力解决一切问题的殖民地军官不同，这位出身德意志古老贵族世家的亲王深知，印度支那的君主、土邦贵族与地方领袖仍然掌握着不可忽视的政治影响力。面对日益高涨的革命情绪，他利用自己的贵族身份与外交手腕，主动同当地统治者展开谈判，并以维护传统特权、扩大地方自治及分享部分经济利益为条件，换取他们对德国殖民政府的继续支持。\n\n事实证明，这番努力并未白费。随着越来越多的地方君主与贵族接受总督府提出的条件，原本声势浩大的反殖民运动逐渐失去了赖以扩张的地方支持。各地的民族主义者虽然仍在鼓吹独立，却难以在缺乏地方权贵支持的情况下组织起足以威胁德国统治的大规模叛乱。约西亚斯不仅避免了一场可能席卷整个印度支那的血腥战争，更借此建立起一张由传统贵族、地方行政官员与德国殖民机构共同组成的政治关系网。\n\n如今，德属东亚的局势已经逐渐恢复平静，而约西亚斯亲王的政治声望也随之水涨船高。他既赢得了当地传统统治者的信任，又凭借与德国宫廷和商界的联系，在殖民地内部建立起了远比前任总督更加稳固的权力基础。当然，亲王所构筑的这套新秩序并非毫无代价，那些获得承诺的地方贵族日后必然会要求德国人兑现自己的诺言。但对于约西亚斯而言，只要能够将这些各怀心思的势力牢牢维系在自己的关系网中，德属东亚便有望成为帝国海外领地中最为繁荣、也最为忠诚的一颗明珠。"
 GEA.216.a:0 "我们曾穿越地狱，如今将比以往更加强大！"
 GEA.216.b:0 "帝国的旗帜仍在远东飘扬，这便足够了。"
 GEA.216.c:0 "亲王的外交手腕挽救了帝国的东方领地。"
 GEA.217.t:0 "对贵族做出让步"
 GEA.217.d:0 "为了巩固我们在这里的地位，兑现我们先前的承诺，约西亚斯已经推动现政权与德属东亚地区的当地精英建立更紧密的联系和交易。虽然与劳动群众相比，这些贵族的人数较少，但他们的财富占据了非殖民经济的大头，同时也是他们文化中传统且备受尊重的“灯塔”。无论是殖民地的企业家、亚洲的贵族，还是当地的企业主和工业巨头，这些富有的权势人物都是整个殖民地的心脏。约西亚斯总督已经宣布他打算通过一系列新的亲精英立法，以赢得他们的支持，因为这些象征性的经济和社会妥协与他们作为保持和平和稳定局势的手段相比，根本不值一提。"
 GEA.217.a:0 "纯正的蓝血贵族约西亚斯，安抚了精英阶级！"
#海耶
 GEA.300.t:0 "向柏林伸手"
 GEA.300.d:0 "威廉·海耶很清楚，德属东亚如今想要维持统治，那么所需要的就不能是来自柏林的几道拨款或者是几箱步枪这么简单。如今的德属东亚陆上军备力量与十年前广州远征时并无太多改善，仅仅是东亚分舰队在这几年里更换了下辖舰艇。因此毫不客气地说，对于绝大部分德属东亚的官兵来说，他们仿佛还活在大战结束后的短暂日子里，甚至有些辅助部队拿的就是曾经大战战场上的步枪对抗游击队。海耶失望地发现，帝国内部仅仅沉醉于阳光下的地盘所带来的荣誉与他国的敬畏中，而对世界帝国各地正在腐朽的暴力机器发出的沉重锈蚀声充耳不闻。\n\n这种怠慢过去尚且能够由东亚相对稳定的局势掩盖。殖民军只需要对付零星叛乱，铁路沿线的小规模驻军也足以维持大部分地区的秩序，而一旦真正出现麻烦，海军与少数精锐部队总还能赶在事情彻底失控前填上缺口。然而眼下局势早已不同往日。印度支那的民族主义者重新活跃起来，越工在雨林和乡村中不断试探殖民政府的底线，日本人则毫不掩饰地将视线投向南方。原本那些被认为尚可凑合数年的仓库中的步枪、火炮、卡车和通信设备，如今看起来只配被丢进垃圾堆，然而这点军备对于德属东亚来说竟也称得上雪中送炭。\n\n尤其令海耶恼火的是，这已经不是第一次德属东亚向柏林诉说自己的困难了。过去数年间，东亚军方都曾递交过有关更新驻军装备、扩建军需设施和改善铁路运输能力的报告，但这些文件最终大多淹没在帝国各部门漫长的争论与权斗之中。待到之后的经济腾飞的和平日子，更没有政府官员愿意为了远东的不毛之地而在帝国国会据理力争。海耶不准备继续等待那个永远不会自己到来的合适时机。在他的授意下，东亚总参谋部整理出了一份新的增援清单。这一次文件不再只列出若干零散缺口，而是将整个德属东亚的军备窘境直接捅到新任宰相面前。\n\n在海耶的构想中，德属东亚能接受的最低限度的方案只要求本土恢复对东亚最基本的工业与军需供应。新的机床、工程设备与弹药以及数量足够的制式步兵武器必须被以最快速度送往东方，使现有军队至少能够摆脱依靠库存旧货维持战备的窘境。更进一步，若柏林愿意承认东方局势已经具有真正的战略紧迫性，那么德属东亚便应当被纳入帝国军备计划的优先序列。现代火炮、装甲车辆乃至航空器材都需要尽快运抵，如果必要来自本土的军官支援也是扩大远东军事力量的必要支持。当然，如果情况允许，帝国完全可以直接将若干已经完成训练和整编的正规部队调往东方。反正帝国在欧陆如今也难逢敌手，如果不把军备用在帝国在过去数十年中拼劲一切所争夺的阳光下的地盘上，那么维持如此巨大的军队规模又是为何呢。"
 GEA.300.a:0 "基础军备就足够支撑了"
 GEA.300.b:0 "德属东亚军必须得到彻底的现代化"
 GEA.300.c:0 "让柏林调遣更多成建制的部队来"
 GEA.301.t:0 "西贡惨案"
 GEA.301.d:0 "德属东亚的新总督，大战英雄威廉·海耶元帅在半月前正式晋升为了新一任的德属东亚总督。但这一好消息却并未使深陷经济危机与民族仇恨中的印度支那人民高兴起来，相反的，几乎所有本地人都毫不怀疑的认定海耶将会进一步压榨本就挣扎在生死线边缘的印度支那人民。事实证明，这样的担心不无道理。越来越多的市民仅仅可能是因为抱怨了殖民政府几句或是要求他们的德国雇主稍微改善工作待遇，就被德国警察带走。很快，越来越多的愤怒开始汇聚，最终首先爆发在了西贡这座城市。\n\n在西贡，原本仅仅是一起劳工要求改善工作时间的抗议活动，但在因德国警察暴力镇压而造成市民死亡后，越来越多的工人，市民，商店店主甚至于学生都纷纷走上街头，挥舞着横幅标语甚至是武器。而德国警察与宪兵在面对这种情况时仅仅挥动了几下警棍就一步步的向后撤退。最终，大量的示威群众与德国执法者在市中心广场上对峙，任何进一步的暴力行为似乎都将打破这里的平静，并将其演变为一场彻底的流血事件。\n\n然而，示威市民们不知道的是，在不远处的一处高塔上，费迪南德·舍尔纳正与他们的副官们观察着这里的情况。“屠夫”正在用望远镜扫视着示威的人群，而他的副官正手持着电话似乎在等待什么命令。很快，电话中传来了人声，而副官随即将电话递给了舍尔纳——在几声简短的交流后，舍尔纳放下电话，向他的副官下达了命令。随后，在与市民对峙的军警突然散开，而一大群手持步枪的正规士兵冲出来开始向人群开火，而一部分全副武装的骑兵也从侧边街道上冲出冲击人群。在不远处数辆坦克架着机枪也开始向着人群开火,更是有部分市民被卷进了坦克的履带下一命呜呼。短短数分钟内，抗议的人群死的死逃的逃，只在市中心留下了数不尽的尸体与鲜血。在总督府中，德国殖民者们弹冠相庆，但他们内心中都知道，更大的反抗浪潮即将来临......"
 GEA.301.a:0 "任何反抗者，都会死在我们的枪下"
 GEA.302.t:0 "特殊时期下的卡特尔地位"
 GEA.302.d:0 "德属东亚的经济从来离不开那些规模庞大的贸易公司、航运企业与工业、矿业联合体。它们控制着港口仓储，掌握橡胶、锡矿与大米的出口渠道，也维系着从新加坡延伸至西贡、海防乃至德国本土的商业网络。如果不是估计帝国政府的尊严与体面，以及仍然需要来自柏林与地方政府的政策倾斜与扶持，那么这些野蛮扩张的卡特尔也许才是远东殖民地的真正巨头。\n\n海耶并不打算重复过去那种政府一遇危机便向企业低声下气的做法。黑色星期一已经留下了足够多这样的先例：行情高涨时，董事会把利润送回汉堡与柏林；价格崩溃之后，却又要求殖民政府提供贷款、减税和订单。如今军政府承担了维持秩序的全部责任，自然也不会允许那些依靠帝国保护发财的企业在最需要它们的时候突然援引什么“经营自主”。一切战争所需的资源与工业材料或体系，都必须优先满足殖民政府列出的需求。\n\n问题只在于，应当把这套原则贯彻到什么程度。总参谋部中的强硬派主张重新审查大型公司的特许合同，将援助政府与军队直接写入行政命令。服从者仍可得到过去的特许经营权或是法外开恩；而那些只想在局势紧张时仍然仅求自保置帝国与德属东亚的利益于不顾的邪恶企业，则没有继续享受帝国庇护的资格。对如今的军人政府而言，卡特尔并不是什么需要特别照顾的伙伴，只是一件规模格外庞大的经济工具。\n\n然而，过去政府中供职的财政官员与部分本土要员则对此颇有异议。强行压低利润固然能够在短期内挤出更多军需，但如果对这些卡特尔们逼得太狠，会不会引来柏林的不满暂且放在一边，让那些已经在黑色星期一中亏损的要死要活的企业优先服从政府指导本就是痴人说梦。倘若政府希望这些企业持续增加产量、更新设备并承担新的投资，那么允许它们在政府合同中保留一份足额收益，或许比不断追加征用令更加有效。\n\n海耶总督对那些西装革履的垄断资本家们并无特别的敬意，却也清楚不能把企业经营同慈善事业混为一谈。至少如果这些商人想要在东方继续赚钱，那么服从也许才是他们该上的第一课，而这门课程早在十年前他们就理应学会。"
 GEA.302.a:0 "服从才能为他们带来利润"
 GEA.302.b:0 "有所盈利才能更好为国家服务"
 GEA.303.t:0 "乡土惊魂"
 GEA.303.d:0 "清晨六点一刻，第七殖民步兵团第二营的一支全副武装的加强连离开了广治以西的公路，沿着一条被雨水冲得泥泞不堪的乡间小道向山区推进。带队的弗里德里希·冯·哈根上尉已经五十出头，左腿在天气潮湿时仍会隐隐作痛——那是世界大战期间，他在德属东非留下的纪念。当年，他曾在莱托-福尔贝克麾下同英国人周旋数年，从坦噶附近的灌木丛一路打到葡属东非，学会了如何在没有载具没有补给，甚至不知道敌人在何方的情况下继续作战。\n\n所以，当年轻副官提出应该加快行军，以便在午前抵达目标村庄时，哈根只是摇了摇头。他命令前卫与主队之间拉开距离，又把两挺轻机枪拆散配置在队列两侧，几名熟悉当地地形的越南籍侦察兵则被放到了最前面。在过去数月的反游击作战中，哈根总结出了自己的经验：越工很少在德国人最警惕的时候开火；他们更喜欢等待一支队伍被稻田、竹林和狭窄堤道拉成长蛇，再从两侧同时下手。\n\n然而伏击仍然发生了。\n\n第一声枪响来自左前方的竹林，一名侦察兵当场倒下，紧接着手榴弹从灌木后飞向前卫。几乎同一时刻，右侧稻田的土埂后也响起机枪。前卫被瞬间压在地上，队尾则遭到另一组枪手射击。若换作几年前，这股德军小分队很可能会本能地向公路方向收缩，随后在狭窄道路上挤成一团；但这次，哈根甚至没有等传令兵跑到身边，便开始挥手示意预定动作。\n\n左侧机枪组立即向枪焰最密集的竹林持续压制，右侧两个排则离开道路，沿灌溉沟渠展开。迫击炮班没有试图轰击看不见的目标，而是把炮弹打向敌人可能撤退的林缘。负责后卫的少尉按照此前演练过的程序迅速建立第二道火力线，避免越工从背后逼近。哈根本人则带着预备排扑向道路左侧的一座小土丘——那里既能看见竹林，也能控制通往山区的唯一一条干燥小径。\n\n战斗持续了近两个小时。越工显然也并非几年前那些只会打几枪便四散逃走的乡村游击队。他们耐心地转移火力点，用树叶和泥土遮住射击位置，甚至在一条预设撤退道路上埋设了简陋爆炸物。德国人的第一次侧翼推进被打退，两名士兵倒在稻田里；随后一名军士带着六个人贴着灌溉沟爬行了近百米，才终于摸到敌军机枪侧后。那挺机枪哑火以后，竹林里的枪声终于开始向西移动。\n\n然而，哈根没有立即命令追击。一战时的经验告诉他，过于整齐的撤退，往往意味另一场伏击正在等待。他让炮兵继续封锁林缘，同时派侦察兵绕向北侧。十几分钟后，新的枪声从山脚响起——果然有一支越工小队试图掩护主力撤走。直到这批人也被逼退，德国人才开始逐段搜索战场。\n\n当天傍晚，这支连带着十二名阵亡者、二十余名伤员和缴获的武器返回驻地。军官们很快便围着一张沾满泥点的地图重新讨论整个过程。哈根坐在一旁，直到争论告一段落才开口。“在非洲的时候，”他说，“英国人总以为我们会重复昨天的办法。我们活下来，是因为我们没有。如果我们想真正在战斗中胜过这些游击队，那么就必须不断变更战术。”"
 GEA.303.a:0 "把这次的教训写进下一版手册"
 GEA.304.t:0 "圈地"
 GEA.304.d:0 "天还没完全亮，村口就已经停了三辆卡车。最前面那辆属于宪兵队，车门上漆着黑白红三色徽记；后两辆则没有任何军方标志，只有车厢侧面印着一家德国企业的名称。村民们见过，但不认得那些字。几个月前，正是这家公司的人来到附近测量土地，说是要修一条支线铁路，再建一座“能够给当地带来工作机会”的新厂。\n\n阮文禄站在自家稻田边，看着几个德国测量员把木桩一根根打进田埂。木桩上刷着醒目的红漆，从河边一直延伸到村后的林地。那片林子里有祖坟，有柴场，也有村里几户人家赖以生计的木料和果树。“这块地没有卖。”阮文禄说。翻译把话说给旁边那名穿灰色制服的德国经理人听。经理眼皮都没抬一下：“不是购买是征用。”\n\n新总督上台以后，政府重新审查了对巨企的限制。那些愿意接受政府要求与指导的企业，很快便收获了他们的回报。审批流程简化，土地申请更是以过去难以想象的速度获批。对于急于创收以弥补黑一损失的董事会来说，这正是他们等待已久的机会。军工厂需要土地，不论是厂房、仓库、铁路线，还是宿舍、燃料堆场，都不可能堆积在旧城区狭窄的街道里。于是地图上的农田、橡胶园、林地和村庄开始被重新涂色。一些地方以低价收购，另一些则干脆依照“军事必要性”直接征用。\n\n阮文禄不知道这些。他只知道自己的田地被划进了红线。村里的人逐渐围了过来。最开始只是争吵，随后有人试图拔掉测量桩。一个军官模样的人见此情况只是招了一下手。宪兵们迅速排开，开始把人群往村口方向驱赶。一个老人抱住自家门前的木柱不肯走，被两名士兵拖开；另一个年轻人从地上捡起石头，还没来得及扔出去，便被枪托砸倒。女人的哭喊、孩子的尖叫和德国人的口令混在一起，几分钟后，原本拥挤的田埂便空了下来。\n\n“把带头的几个记下来。”经理说。翻译犹豫了一下。“他们会被送去哪里？”“工地缺人。”经理合上文件夹，像是在回答一个再普通不过的问题。\n\n几周后，房屋陆续被拆除。推土机沿着原本的田埂向前推进，林地被成片砍倒，铁路施工队开始铺设通往新厂区的路基。政府的公告则宣布这项工程将在当地创造数千个就业岗位，并显著提升德属东亚的军需生产能力。\n\n阮文禄没有看到那份公告。他和另外十几个被认为“妨碍征用”的村民已经被送进了新建的劳工营。那里离未来的厂区并不远，每天天亮前都能听见施工机械发动的声音。搬运钢轨，清理林地，这些苦力活都被交给了强征来的本地劳工，还有一些人被送进已经投产的旧车间，在十二小时轮班中装卸煤料与半成品。\n\n工厂里的德国监工很少问他们的状况。对于德国主子来说，生产表上只有数字：班次、工时与产量。有一天，阮文禄在搬运一箱机器零件时从另一个车间门口经过。他认出了同村的阿福。两人只来得及对视一眼，队伍便被继续赶向前。等待他们的不过是仍有八小时的每日剩余劳作时间。"
 GEA.304.a:0 "机器不会自己长在地里"
 GEA.305.t:0 "帷幕后的秩序"
 GEA.305.d:0 "德属东亚的阿勃维尔最初只是帝国军事情报体系在东方伸出的一根触角。本部其实并不对其寄予多大厚望，单纯是用来监视日本帝国的扩张与军事行动，同时顺带完成对第三国际远东情报网的渗透与反渗透。只要不发生大规模战争，这套规模有限的组织也算得上堪用。然而在海耶看来，东方真正危险的地方，恰恰在于游击队与顺民之间从来不存在一道清晰可见的界线。今天对德国殖民者恭恭敬敬的村民与市民，可能明日里就披上游击队的军服进入丛林开始袭击补给车队。因此，远东阿勃维尔必须得到彻底的升级与重组。\n\n新的拨款很快送到了情报部门。更多军官和密码人员从本土抵达，宪兵、殖民警察、港务机关与地方行政部门也被要求向阿勃维尔开放自己的档案。过去只用于搜捕外国间谍的监听与线人网络，开始扩散到印度支那乃至整个德属东亚。经营对日贸易的富商值得调查，同民族主义者有亲缘关系的职员值得调查，曾经公开批评军政府的德国官员同样值得调查。这种变化很快在殖民地留下了一些颇为奇怪的痕迹。西贡与新加坡开始有人在下班途中失踪，家属向警察询问时得到的通常只有一句“正在协助有关机关调查”。几天乃至数周以后，其中一些人又会毫无征兆地重新出现在家门口或办公桌前。他们大多没有受到正式起诉，也没有任何法院记录能够说明此前去了哪里。只是那些曾经喜欢在俱乐部里高谈阔论的人突然变得谨慎，一些过去乐于谈论日本生意的商人也开始在饭桌上主动换掉话题。若有人执意追问，他们往往也只是保持缄默。\n\n与此同时，殖民地地图上也多出了一批性质含糊的军事用地。废弃仓库或是原本不起眼的丛林与林地被铁丝网围起。附近数十公里内都不再允许私人进出，而守卫这些地方的人身上也没有什么标识可以让人识别他们的身份。那些阴森而肃杀的混凝土建筑物静静的伫立在铁丝网和哨塔之后，监视着这片土地上的一切。至于那些被铁丝网遮住的建筑究竟用来做什么，那些短暂离开日常生活的人又究竟见过什么，便不属于普通臣民有必要了解的事务了。"
 GEA.305.a:0 "你本不该了解这些"
 GEA.306.t:0 "模范臣民"
 GEA.306.d:0 "海耶政府很快发现，过去的殖民宣传对宣传对德合作往往没有多少想象力，无非是悬挂皇帝画像，对帝国舰队的报道，又或是反复强调德国带来了基建、工业与秩序。这些说辞并非全无效果，但当越工在乡村散发传单、民族主义者在城市里鼓吹自决时，仅仅要求当地人因为帝国强大而保持忠诚，已经是相当无力的说辞了。\n\n宣传部门因此开始寻找另一种更有说服力的形象：愿意与德国合作，同时又具有足够影响力的标杆级人物。而裴光昭的名字很快被送到了总督桌上。这位出身交趾支那的农业工程师早年曾赴法国求学，回国后长期活跃于地方政治和报界，并参与创建印度支那立宪党。与那些鼓吹炸弹、暗杀和武装起义的民族主义者不同，裴光昭及其同僚更愿意通过议会、报纸和公开政治活动争取越南人的经济与行政地位。支持他们的人大多来自地主、商人和其他精英阶层，而这恰恰也是德国人最希望从革命宣传中争取过来的那批人。\n\n裴光昭本人很快出现在报纸头版。他被描述为“以建设而非破坏谋求民族进步的爱国者”，广播节目反复讲述他如何通过农业、商业和议会活动改善同胞处境，而不必诉诸越工式的阶级战争。此外，由政府出资拍摄的新闻短片则安排他视察学校、工地和本地企业。他本人与德国官员并肩站在镜头前，强调秩序、教育与经济发展的图景更是几乎占据了当期印度支那所有报刊的头版。宣传的用词也经过仔细斟酌。当地人不再被要求放弃自己的文化，而是被鼓励成为“忠诚而有教养的民族精英”。当然，真正掌握印度支那生杀大权的依旧是德国人。"
 GEA.306.a:0 "合作也能带来前途"
 GEA.307.t:0 "广州余烬"
 GEA.307.d:0 "德属东亚的军官们并非第一次同印度支那的工团主义者打交道。早在十年前，柏林便已经确信自己亲手斩断过这条毒蛇的头颅。世界大战结束后的华南一度成为各色革命者最理想的藏身之地。广州的国民党政权同法国革命政府往来密切，法国顾问、工团主义活动家、左翼人士以及流亡者混杂在同一座城市之中。正是在这样的环境下，一个以“阮爱国”之名在欧洲活动多年的越南人重新出现在德国情报机关的档案里。阮生恭、阮爱国，后来又自称胡志明。尽管名字不断更换，可这个无形的幽灵的一切活动目的却始终相当明确：解放祖国。\n\n对于刚刚从法国人手中接管印度支那不久的德国来说，这自然绝非无关紧要的海外政治活动。德国警察连续不断在西贡和东京查获来自华南的宣传品，而边境上也不断有人携带信件与假证件往返。1925年处决潘佩珠所引发的大规模抗议，更让殖民当局清楚意识到，单靠印支境内的搜捕很难解决问题。只要广州政府仍容许这些组织活动，这边宪兵每逮捕一名煽动者，边境另一侧便可能再送来两名。\n\n1926年的德国干预由此具有了另一重目的。伴随对华南革命势力的军事行动，德国军队、海军情报机关与当地反革命力量一同清查广州及其周边的工团组织、训练据点和越南革命者网络。在前所未有的大规模突袭下，工团间谍的住所被搜查，非法印刷所则一家家被查抄。在名册与通信记录落入德国人手中后，大批活动者旋即遭到逮捕或被迫潜逃。胡志明本人也在失去了踪迹，而他的下属们则被押送广州当街处决。柏林此后长期坚持，匪首胡志明已经死于广州行动。虽然事实上他躲过一劫，但之后还是没能逃脱，于1933年被真正秘密处决。至少从当时送回国内的报告来看，这场远征确实摧毁了一个正在形成的印度支那革命指挥中心。\n\n胜利后的判断并非完全错误。此后数年，越南革命青年团陷入分裂，广州与印度支那之间原本相对公开的联络体系也再未恢复到从前的规模。殖民政府于是逐渐把这件事收入档案，将其视作德国式果断干预又一次成功的例证。至于那些逃入广西山区、散落在乡村里的秘密联系人，以及在西贡、海防和东京重新寻找落脚点的年轻激进分子，则很少再得到同样的关注。十年后回望过去，这份乐观如今看来多少有些可笑。\n\n海耶接手的是一个被反复扫荡，却始终未能真正安静下来的印度支那。旧有工团网络虽然早已支离破碎，可新的组织却不断从废墟里出现。一次成功的围剿往往能清空一大片区域的红色活动，几个月后，同样的传单却又会在几十公里外重新出现，而这中间的间隔正在逐渐缩短。\n\n远东总参谋部对此提出的答案颇为简单。既然广州的经验曾经证明，集中的兵力能够摧毁革命组织，那么眼下就该如法炮制。扩大封锁区与搜索规模，进一步清查交通线，并扫荡所有可能包藏越工的村庄。只要扫荡足够频繁、覆盖足够广，总有一天能够把丛林中的赤匪磨尽。\n\n但阿勃维尔和部分少壮军官提出了另一种看法。广州平叛真正成功的地方，正是帝国军队以极快的速度斩首了工团匪徒的中央指挥所，将组织核心与运营网络连根拔起。若想彻底解决问题，就必须重新整理过去十年来积累的人员档案，以期通过更加周密迅速的行动彻底捣毁印度支那的红色瘟疫源。海耶愿意付出一切代价来根除这场绵延十余年的红色之瘟，现在需要决定的，只是德属东亚需要以何种姿态动手。"
 GEA.307.a:0 "扫荡本身就是答案"
 GEA.307.b:0 "尽斩蛇头"
 GEA.308.t:0 "另一面旗帜"
 GEA.308.d:0 "若只阅读东亚总参谋部近几年的治安报告，很容易产生一种错觉：仿佛印度支那所有反对德国统治的人最终都会走进越工的队伍。然而，早在法国革命者第一次把红旗带到亚洲以前，越南人便已经为了应当由谁统治自己的国家争论、结社、流亡和流血了数十年。最早让欧洲殖民者头疼的是那些仍然把忠君与救国视作同一件事的士大夫。勤王运动失败以后，潘廷逢一类人物逐渐成为旧式抗争的象征；到了世纪之交，潘佩珠又把这种传统带出了越南本土。他成立维新会，拥立阮朝宗室强㭽为政治象征，又在日本战胜俄国以后发起“东游”，希望从一个现代化的亚洲国家中学到军政知识，再报效祖国。日本最终在外交压力下驱逐了他们，但潘佩珠没有因此停止活动。他转往中国，在辛亥革命的影响下逐渐放弃原先的君主复辟设想，并于广州组织越南光复会，把民族独立同共和主义结合到了一起。这些组织尽管难成声势，却留下了一代熟悉结社、跨境联络和海外筹款的活动家，也让日本与华南长期成为民族主义者的重要据点之一。\n\n德国人接管印度支那以后，很快继承了法国人留下来的这个麻烦。1925年，潘佩珠落入殖民当局手中。对一个已经年近六旬、实际组织能力大不如前的老人而言，他本人已算不上危险，但德国方面最终处决了这个老头，而接踵而至的大规模抗议给殖民政府留下了相当深刻的印象。潘佩珠死了，他却也从一名失败的流亡政治家变成了后来各派民族主义者都乐于纪念的殉难者。\n\n然而，民族主义并不只有炸弹、流亡者与殉难者。潘周桢同样痛恨殖民统治下越南的衰弱，却反对依靠旧王朝或者仓促的武装起义解决问题。他所提倡的维新运动把更多精力放在新式学校、社会改革和公民教育上，以“开民智、振民气、厚民生”为口号，希望先改造社会本身。围绕这种思路成长起来的受教育者未必愿意跟随游击队走进丛林，却同样不认同欧洲人的统治。后来立宪派又把温和路线带进殖民政治，有限度地参与德国建立的政治与经济秩序，但核心诉求仍是为本地人争取更多权利与发言空间。\n\n正是在这些彼此并不相同的传统之间，越南国民党于二十年代末迅速崛起。阮太学和他的同志们没有打算跟随巴黎，而更愿意把目光投向中国国民党。党的成员尤其集中于北方的师生、受教育的小资产阶级和较富裕的农民之间。在这些人看来，民族独立始终排在社会革命之前。此后，越国党试图利用殖民军中的越南士兵发动兵变，希望军事起义能点燃反抗的火种。计划最终失败，大批党员在随后的清剿中死亡、被捕或者逃亡。可失败同样给这个新生组织带来了烈士与传奇。曾经不起眼的地方党员，则带着残存的联系人、密码和地址簿散落到了乡村与边境。\n\n华南也从未只是工团主义者的避难所。无数民族主义者在那里相识，又同广西、云南乃至更远地方的中国政治势力建立联系。阮海臣就是其中极有代表性的人物。他早在潘佩珠时代便离开越南，参加东游，又长期留在中国活动。对情报人员而言，这些人的危险之处在于中越边境从未真正把政治活动隔开：一个河内通缉犯，越过山岭以后便可能摇身一变成为又一个组织革命的不安定因素。\n\n到了今天，所谓的“民族主义者”已经成为警察档案里一个颇为宽泛的栏目。这里面有仍然怀念潘佩珠的老人，有相信孙中山理论的越国党青年，有认为德国人迟早应当把权力交还顺化朝廷的保皇派，也有愿意同德国做生意、却在私下资助反殖民组织的富商。甚至那些公开主张合作和渐进改革的立宪派，也不能因此被简单视作德国统治的永久拥护者。对海耶政府而言，这些人之间的分歧固然可以被利用，但只要“摆脱外国统治”仍能把他们暂时联系在一起，印度支那的治安问题就绝不会只剩下越工这一面旗帜。"
 GEA.308.a:0 "如果合作能带来秩序..."
 GEA.309.t:0 "城市中的忠诚者"
 GEA.309.d:0 "印度支那革命的消息传入各座城市后，秘密登记的市民团体、经过整编的警察和守卫应急仓库的志愿者立即依照预案行动。他们封锁街口、占领通信设施，并从仓库中取出预先储备的武器。殖民政府已经无法阻止起义席卷乡村，但在芹苴，仍有人愿意拿起武器维护德国的统治。"
 GEA.309.a:0 "忠诚者们，拿起武器！"
 GEA.310.t:0 "冷酷无情之人"
 GEA.310.d:0 "在威廉·海耶为新组建的秩序别动队挑选负责人时，汉斯-阿道夫·普吕茨曼并不是那种会在第一眼令人安心的人选。他不善于讨好上级，也很少在会议上发表长篇大论；他的履历中既没有辉煌的大战战功，也缺乏传统殖民官僚那种圆滑的行政经验。然而，在那些真正同他共事过的人口中，却几乎总能听到同一种评价：此人冷酷无情，坚决服从命令。\n\n普吕茨曼1901年出生于西普鲁士的托尔克米特。大战结束时，他还只是个年轻人，却很快投身于祖国党与其下属的准军事组织中。于准军事组织中，他开始接触治安战与反游击作战。后来在时局安定后，他前往哥廷根学习农业，并在波美拉尼亚、勃兰登堡和东普鲁士从事农业行政。钻研农业没有让他变得温和，反而促进他对乡村地理与生活的理解。普吕茨曼对暴力本没有丝毫道德上的犹豫。在他的观念里，命令本身已经提供了足够的理由，而行动是否成功，远比手段更值得记录。\n\n秩序别动队在成立后很快获得了令人畏惧的名声。普吕茨曼要求部下严格记录人员流动、粮食供应和地方传闻，同时又允许他们在行动现场拥有极大的处置空间。对于那些被怀疑向越工或民族主义者提供帮助的村庄而言，别动队的到来往往意味着整片地区将在数日内与外界隔绝。如果遇到可疑分子，别动队往往会即刻就地处决。而一旦遭到反抗，等待附近所有村民的唯一下场就是烧毁的房屋与铺满了无生气的田野的滚滚尸骸。\n\n这类做法即便在军政府内部也并非毫无争议。一些军官认为普吕茨曼过于冷酷，甚至担心长期依赖恐惧会让乡村敌意变得更加顽固。但普吕茨曼并不在乎。秩序别动队在他的手中逐渐不再只是一支反游击部队，而成为直属于总督本人的锋利武器。无论是搜查，逮捕，抑或是屠村抢劫，只要有助于平息印度支那的反抗意志，那么普吕茨曼就不会停下脚步。"
 GEA.310.a:0 "命令已经下达，我该考虑的只是执行"
 GEA.311.t:0 "破坏分子被击溃"
 GEA.311.d:0 "警察从旧档案和线人报告中及时拼出了民族主义地下组织的行动路线。当破坏小组携带炸药接近目标时，早已埋伏在附近的治安部队突然合围。短暂交火后，袭击者或被击毙，或丢下武器逃入夜色。这一个月里，殖民地后方总算没有遭受新的损失。"
 GEA.311.a:0 "警戒网发挥了作用"
 GEA.312.t:0 "民族主义者袭击工厂"
 GEA.312.d:0 "一支民族主义破坏小组设法混入了当地一座重要工厂的夜班。他们利用交接班时的混乱，将燃烧弹藏进机器间和仓储区，同时切断了部分消防管线。火势很快沿着堆放的原料和油料蔓延，直到驻厂警卫和消防队赶到后才被勉强控制。虽然主体厂房没有完全烧毁，但数条生产线、仓库和动力设施仍受到严重破坏，短期内已经无法维持原有产量。"
 GEA.312.a:0 "尽快恢复生产"
 GEA.313.t:0 "殖民官员遭到刺杀"
 GEA.313.d:0 "一名负责地方行政事务的殖民官员在离开办公处时遭到近距离枪击。袭击者显然事先掌握了他的日常行程，并在附近安排了接应人员和车辆。等到宪兵赶到现场时，凶手早已借助街上的人群逃得无影无踪。官员的死亡迅速在当地行政系统中引发恐慌，不少基层人员开始要求加强警卫，甚至拒绝在没有护送的情况下前往偏远地区办公。"
 GEA.313.a:0 "他们会为此付出代价"
 GEA.314.t:0 "铁路遭到破坏"
 GEA.314.d:0 "民族主义者趁夜拆除了数段铁轨，并在一处重要桥梁下安放炸药。一列运送军需和补给的列车未能及时发现前方异常，最终冲出轨道，车厢和物资散落在铁路两侧。虽然伤亡尚在统计之中，但这条交通线已经完全中断，附近驻军和后方仓库的补给都受到影响。工兵部队必须在完成安全检查后尽快恢复通行。"
 GEA.314.a:0 "立刻抢修"
 GEA.315.t:0 "港区发生爆炸"
 GEA.315.d:0 "数名伪装成码头工人的破坏者将炸药藏入等待装卸的货物，并趁换班时将其中一部分转移到燃料仓和装卸区附近。接连发生的爆炸造成码头设施受损，部分仓库起火，船坞作业也被迫暂时停止。港区宪兵已经开始封锁出入口并逐一核查工人身份，但这场袭击无疑再次暴露了繁忙港口中难以完全防范的安全漏洞。"
 GEA.315.a:0 "加强搜查"
 GEA.316.t:0 "军械库遭到洗劫"
 GEA.316.d:0 "一支民族主义武装趁守备薄弱之机袭击了偏远地区的一处军械库。警卫试图依托仓库建筑组织抵抗，但很快便在人数和火力上落入下风。经过一番混战，袭击者夺走了大批步枪、弹药和部分轻武器，并在援军抵达前撤入附近乡村。当地驻军已经封锁道路展开搜查，但失窃的武器很可能已经被分散转运，并最终落入各地地下组织和革命武装手中。"
 GEA.316.a:0 "迅速封锁所有道路"
 GEA.317.t:0 "予以赏赐"
 GEA.317.d:0 "德属东亚近些日子飞速膨胀的军费开支终于开始真正流入工业体系，但新的问题也随之出现。作为帝国在远东的前哨，德属东亚需要顾及太多事务，无论是守备力量还是东亚分舰队，无论是本地警察还是阿勃维尔，都如久旱后的禾苗等待甘霖一般期待着更多预算。然而，十全十美总是不可能的。\n\n为东亚分舰队服务的造船厂最先提出要求。舰队虽然在过去几年里得到了部分更新，但船坞与维修设施乃至缺少足够维护的海军基地使得东亚分舰队这一德属东亚的骄傲依旧无法同帝国在太平洋上的野心相匹配。海军军官们认为，德属东亚本质上就是一个依靠海路连接起来的殖民联盟，没有舰队和港口，一切陆上建设最终都会失去意义。更何况北方日本帝国的联合舰队始终对东南亚虎视眈眈，如果政府不能增大基于造船厂的预算与订单，那么很快联合舰队的舰炮就将轰击新加坡。\n\n陆军的意见更加直接。过去的殖民军长期依赖步兵和少量车辆维持秩序，一旦真正遭遇装备精良的敌军，这种体系便会迅速暴露出缺陷。足够的装甲车辆不仅能够突破正面防线，在殖民地公路与城市环境中也能提供一种极具威慑力的机动火力。即使抛开这些昂贵的铁皮罐头，殖民军的步枪型号以及如机枪，迫击炮或是反坦克炮等支援装备也已经开始显得落后。如果能够得到足够的预算，陆军工业就能够让殖民军更好的武装起来，保卫德属东亚。\n\n而空军的军官声势最小，但仍然有不少声音希望政府能够将目光更多的投向飞机制造业。东方广阔的距离和恶劣地形正在让飞机变得越来越重要。侦察巡逻与对地支援乃至反舰打击都离不开这些天空斗士。若能集中扶持航空制造与维修体系，德属东亚便可能以更少的人力覆盖更大的区域。然而政府那可怜的额外预算自然不可能面面俱到，现在问题又被抛回了总督本人和他的幕僚们面前：究竟何种工业才能得到来自新加坡的直接支持？"
 GEA.317.a:0 "大洋才是东亚的生命线！"
 GEA.317.b:0 "为我们的空中勇士更换战马！"
 GEA.317.c:0 "钢铁骑士才是未来！"
 GEA.317.e:0 "先确保所有士兵武备齐全！"
#企业
 GEA.400.t:0 "新领地"
 GEA.400.d:0 "第一批测量人员在抵达村庄时并没有带来任何特别惊人的东西。几张盖着印章的文件，测绘工具，还有一队警察。手中的警棍和背着的步枪显示出他们并非一般的治安警察。当地人最初以为又是什么修路工程，直到红色木桩一根根插进稻田和林地，才有人意识到，这些土地已经有了新的主人。\n\n根据新近批准的工业开发计划，这一地区将划入IG法本远东事业部的长期经营范围。原本零散分布的橡胶园、加工场和仓储设施将被重新整合，并在附近建设新的化工厂和实验设施。地方行政机关对此表现得异常配合，而土地登记部门也很快完成了重新划界。这一原本过去需要数月才能通过的建设申请如今只用了不到两周。\n\n补偿当然存在。公告上写得很清楚。只不过真正拿到钱的人并不多。\n\n不少农户发现自己名下的土地在旧档案中登记不全，而很快这些本应由自己家庭世代耕种的土地一转眼交到了公司手中。另有些人则被告知林地属于公共用地，补偿什么的压根就不存在。还有更多人只是得到一笔足以支撑数月生活的钱，然后看着施工队拆掉篱笆，挖开水渠，把过去世代耕种的土地变成铺设铁路支线和厂房地基的平地。\n\n但这还没完。几周以后，新的招工处就在旧村公所旁开了门。这里需要搬运工、锅炉工、清洁工和夜班装卸人员。许多刚刚失去田地的人最终又回到了那片土地，只不过这一次，他们必须排队领取工牌，在汽笛响起前进入厂区，并在下班后接受警卫检查。\n\n在最初的数周后，这些新进厂的本地劳工发现，规定的工时开始延长，而休息时间被不断压缩。那些过去还算能相处的德国工头开始以“生产纪律”类似的理由来处理迟到和失误。最危险的岗位通常由本地工人承担，而德籍技术员则负责监督那些新安装的设备。一旦有人受伤，车间很快就会补上新的工人。对于工厂管理层而言，德属东亚最不缺的就是人。\n\n随着政府进一步放宽对大型企业的监管，新的项目迅速出现在印度支那、马来亚和北婆罗洲。IG法本的技术人员很快把目光投向染料、医药、农用化学品和其他能够利用热带原料的产业。在过去需要送回德国本土处理的材料，现在越来越多地被要求留在东方完成加工。柏林的董事们发现，这不仅能缩短运输周期，还能省下相当可观的人力成本。\n\n而新加坡对此也相当满意。一系列的收益增长和发展都彰显了他的才能与智慧，弗里茨·梅尔如此想着，在新的开发报告最后一页签下自己的名字，又把几处利润率高得异常的项目用铅笔圈了出来。"
 GEA.400.a:0 "通往发展的必经之路"
 GEA.401.t:0 "如人一样"
 GEA.401.d:0 "第一次听说克虏伯准备给厂区修诊所的时候，阮文成没有当回事。\n\n这些年他已经听过太多类似的消息。最早是宿舍和更好的食堂，后来又有人宣传工伤补助，甚至说工人的孩子也能去读书。每当德国经理来到车间巡视，总会有人把这些词挂在嘴边。真正落到工人头上的，往往只是换了一块牌子的旧宿舍，或者一张写满规章的通知。\n\n但这一次，事情似乎真的有些不同。旧仓库被清空以后改成了医务室，厂区旁边几排低矮木屋也被拆掉，换成了有排水沟和公共水井的新宿舍。过去工人受伤后只能自己想办法，现在轻伤可以直接在厂内处理，严重事故也有专门车辆送往医院。尽管工资并没有涨多少，可最危险的几个岗位开始发放额外津贴，工头也被禁止随意克扣因伤缺勤者的薪水。\n\n阮文成听几个识字多些的工友说，是因为最近来了一个新的德国人，所以他们的待遇才突然变好了。对此，他始终将信将疑。在他的印象里，德国鬼子基本没什么好人，哪怕眼下真给了自己一点甜头，多半也只是为了以后从他们身上拿走更多东西。可随着时间推移，新的规章还是一条条下来了。厂区死亡事故必须单独上报；连续工作时间受到限制；那些最恶劣的宿舍竟然也真的得到了整修。对已经习惯把本地劳工当作可以随时替换数字的经理来说，这些要求多少有些碍事。有人抱怨成本，有人抱怨东方工人根本不值得照搬德国本土那一套，只不过谁也不敢公开反对。而阮文成也确实感受到了一点过去从未有过的善意与温暖。\n\n他不再和另外二十个人挤在一间漏雨的棚屋里。妻子生病时，厂里的医生给了她药。去年压断两根手指的同乡如今还留在厂里，被调去做仓库登记，而不是像从前那样领完最后一周工资便被赶走。另一边，每天清晨的汽笛依旧会准时响起。工人仍要在规定时间内进入厂区完成不断提高的生产定额，也依旧没有资格决定自己是否愿意加班。德国工头的考勤册也依旧一页页记着迟到和缺勤。\n\n尽管如此，在阮文成看来，如今的一切已经足够称得上令人满足了。他还听说，一些本地工头的孩子已经能够在公司学校念书，他们的家人也可以搬进条件更好的公司宿舍。至少同以前相比，这些德国人开始把他们当作一个人，他们的同胞来看待。某个傍晚，阮文成下班时经过新建的浴室。墙上挂着一块德越双语的牌子，上面写着：“克虏伯关心每一位忠实劳动者。”他站在那里看了一会儿，然后把工牌重新别好，走回了宿舍。"
 GEA.401.a:0 "至少，他们现在像人一样被对待"
 GEA.402.t:0 "划清界限"
 GEA.402.d:0 "陈福安原本答应过，星期一不会来上班。\n\n克虏伯兵工厂里已经有不少人私下串联了几个星期。最初只是抱怨夜班和不断提高的生产定额，后来有人开始谈论停工来表达抗议。福安也在那张名单上按过手印。过去他并不觉得这有什么值得犹豫的——德国人需要他们制造枪炮，却连一间不漏雨的宿舍都舍不得给，既然如此，少造几天东西又能怎么样？可最近几个月，厂里的日子确实变了些。\n\n医务室换了新的医生，食堂里多了一顿热饭。而夜班时间也有了一些休息时间。最让福安记得清楚的，是上个月冲床出了事故。他以为那个被压伤腿的年轻人又会像过去一样被抬出厂门，此后再没有人提起；可几天后，公司贴出通知，说伤员的工资会继续发给家里，痊愈后还能换到较轻的岗位。\n\n到了星期一清晨，当他的工友们已经集结准备示威时，福安第一次觉得那场罢工似乎没有过去那么理所当然了。最后，他还是系上了工作服。那天上午，他负责的是一批步枪机匣的最后修整。新换的夹具还有些不顺手，其中一把枪在退出来时于机匣侧面留下了一道很浅的斜痕。检验员看了一眼，没有影响使用，便让它随其他成品一起送走。福安用油布擦掉金属屑的时候，多看了那道痕迹两眼。那形状有点像一根折断的稻穗。他很快就忘了这件事。\n\n另一边，罢工没有完全发动起来。克虏伯的几个车间仍有人拒绝开工，却远没有组织者预想的规模。这场不大不小的骚乱很快停止了，然后有人发现那些领头的工友们之后没再来上班。"
 GEA.402.a:0 "如今的生活还算令人满意"
 GEA.403.t:0 "枪支"
 GEA.403.d:0 "在数百公里外的印度支那内地，一支游击队正在撤退。\n\n这次伏击本该同过去许多次一样。道路狭窄，德国巡逻队人数不多，林地足以遮蔽撤退路线。然而第一轮射击结束后，对方没有陷入混乱。更多士兵从卡车后方散开，机枪迅速封住了道路两侧，随后是一阵又一阵准确得令人窒息的步枪火力。游击队员范明德伏在一截倒木后，已经记不清自己换过几次弹匣。他身边的人一个接一个没有了声音。最初准备好的撤退路线被截断，树林另一侧也出现了德国人的身影。他试图爬向更低的地方，却在刚刚撑起身体时被击中。\n\n疼痛来得比枪声慢一些。明德仰面倒在潮湿的泥土里。视野已经开始发黑时，一名德国士兵从树木之间靠近。他没有看清那人的脸，只看见对方手里端着的步枪。枪身还很新，黑色的机匣在透过树叶的阳光下闪了一下。上面有一道浅浅的斜痕。像一根折断的稻穗。随后他视野中最后出现的是德国军人佩戴的那把锋利的制式匕首。\n\n几百公里外，克虏伯兵工厂的汽笛再次响起。陈福安放下饭盒，跟着其他工人重新走进车间。"
 GEA.403.a:0 "又一天的工作，为了糊口的工资"
 GEA.404.t:0 "送还"
 GEA.404.d:0 "裹尸布总是比工服干净。这是阮德全在IG法本厂区做警卫以后才明白的事情。白色粗布从仓库里领出来时还带着浆洗后的僵硬，铺开，再由两个人把尸体抬进去。脚那一端打结，胸口别上一张纸牌，写着姓名、工号、车间和死亡原因。若是名字没人认得，就只写工号。\n\n今天是第三具。黎文泰，四十二岁，在酸处理车间干了六年。尸检报告写得很简单：阀门故障，腐蚀性液体泄漏，抢救无效。至于为什么那只阀门迟迟没有得到，报告里没写。阮德全和司机把尸体抬上卡车时，工人们从他们身边经过，却也没有人停下，仿佛对此早已习以为常。\n\n黎文泰的家住在公司宿舍后面。那地方也是法本修的——水泥墙、铁皮顶、统一的门牌号。过去的棚屋在厂区扩建时被拆掉，公司说，这是为了让工人过上更卫生、更有秩序的生活。但实际内在跟过去也无甚区别。阮德全敲开门。女人先看了看他，又看了看停在路边的卡车，没有问发生了什么，只是慢慢扶住门框。\n\n这种时候，他总觉得自己应该说些什么。可公司教给警卫的只有程序：确认身份，移交遗体，家属领取签字然后收工。于是他只是摘下帽子，让同伴把尸体抬进去。\n\n两个孩子站在屋里，看着那块写着工号的纸牌在白布上轻轻晃动。女人接过事故通知书，一行行往下看。最下面写着抚恤标准：三个月基本工资，宿舍允许继续居住六十日。女人终于哭了起来。阮德全收回签过字的文件，转身走向卡车。回厂的路上，他们迎面遇到另一辆公司的运输车。车斗里坐满了刚招来的工人，穿着还没有沾上化学品味道的新工服，紧紧抓着车栏，朝远处高耸的烟囱驶去。\n\n阮德全低头看了一眼自己的公文包。里面还剩七张空白的遗体移交单。"
 GEA.404.a:0 "明天还会用得上"
 GEA.405.t:0 "东方粮仓"
 GEA.405.d:0 "德属东亚从来不缺少粮食。湄公河三角洲的稻米、东京平原的收成以及马来亚各港口不断转手的粮食贸易，早在德国人抵达以前便养活了这里的城市，也让无数商人积累起了财富。帝国接管印度支那以后，一些德意志移民和企业自然也加入了这门生意，可几十年过去，真正掌握远东粮食贸易命脉的依旧主要是本地商人与遍布南洋的华商家族。德国企业可以控制出口合同，却很少能够绕过这些盘根错节的中间人，直接碰到乡间的粮食。\n\n过去的政府对此并没有太大意见。只要关税照缴，港口里的货船就能照常装满出航。至于谁在中间赚走那一层利润则并不值得政府亲自过问。然而蒂洛·冯·威尔莫夫斯基却越来越难接受这种松散的安排。黑色星期一已经证明了一个事实：一旦金融风暴等大危机降临，市场首先考虑的永远不是德意志帝国的需要；而一场真正的战争若切断海运，德属东亚甚至可能在坐拥大片稻田的情况下不得不思考诸如新加坡等重大城市的粮食问题。更重要的是，这里的农业与粮食贸易显然获利不菲。\n\n蒂洛要求农业、财政与贸易部门共同整理整个殖民地的粮食流向。过去分散在地方行政、私人公司和商会手中的体系应当被重新纳入统一规划。总督府需要足以应付危机的战略储备，也需要更大的能力决定何时出口与向谁出售的问题，而因此获得的利润也需要被德国官方拿走更大的份额。\n\n而这项宏大计划的首要问题在于，要怎样对待那些已经经营了几十年的本地商号。部分德国企业对此早有答案。他们认为，帝国既然已经承担了铁路、港口与治安的成本，就没有理由继续让本地粮商占据最赚钱的位置。政府完全可以利用新的许可证和信贷政策扶植德国公司，由它们逐步接管碾米厂、批发市场和出口合同。那些无法适应新规则的旧商号自然会被挤走，而愿意出售资产的人至少还能得到一笔体面的价钱。如此一来，粮食安全和商业利润都将牢牢掌握在德国人自己手中。\n\n但另一派官员提醒总督，这套网络之所以能够运转，可不仅仅是因为几纸特许状。华商熟悉乡间信用，而本地经纪人与地主则能够让村社和船户与上游的商号们维持着数十年的关系。许多德国公司过去之所以能够顺利收购粮食，本身就是依赖这些人。若新加坡的官员执意把他们全部赶走，最后接手的很可能只是一套金玉其外，败絮其中的垄断生意\n\n蒂洛并不介意本地商人继续赚钱。他真正关心并考虑的是，当帝国需要粮食的时候，究竟是谁说了算。"
 GEA.405.a:0 "东方的粮仓应由德国人掌握"
 GEA.405.b:0 "让他们替帝国把生意继续做下去"
 GEA.406.t:0 "东方一天"
 GEA.406.d:0 "清晨六点四十分，汉斯·克勒已经站在办公室窗前。厂区刚刚换过班，工人正从宿舍和食堂方向一批批涌进来。远处的吊车装着钢材和零件的平板车沿着厂内铁路缓慢前进，新的弹药箱则在另一侧堆成整齐的方阵。\n\n克勒来到东方已经快十年了。黑色星期一最严重的时候，他在埃森失去了工作，他不知道危机会持续多久，也不知道自己还能挺多久。几天后，他得知克虏伯在德属东亚的工厂招人，包吃包住工资也还可以，于是他和另外几十个人一起登上了船。刚到这里时，他只是车间里的小领班，如今已经是一个小有权力的经理了。\n\n他先去检查了步枪装配线。产量每天都在改善，新来的工人仍然笨手笨脚，但废品率已经好转。工头递来的报表上，最醒目的不是数字，而是右上角新盖的蓝色章记。那代表这批货里有一部分将直接拨给殖民部队。剩下的则会被送去港口。至于最后会出现在谁手里，克勒说不好，也不好说。暹罗、华南、南洋各地总有人愿意为德国枪械出价。只要账款到账，箱子上的最终目的地他可管不着。\n\n十点以后，他去了另一间厂房。那里刚刚换过一批通风设备。几年前，这种开支多半会被经理部直接划掉，如今却已经成了例行预算的一部分。新的医务室、工伤补助、宿舍整修，还有那些狗屁的休息规定，都已经变成了现实。克勒到现在都觉得这些东西太贵。那些能力低下的本地蛮子能有一份工作就已经不错了，居然还想要这种待遇，更可怕的是管理层竟然还答应了他们。至今想来他都难以置信。\n\n午饭以后，他又处理了一起争执。一个本地工人要求给自己的弟弟安排岗位，说家里已经有人在工厂做了六年。克勒让人事处记下名字，却没有作出任何保证。工业区外每天都有没饭辙的新来者排队，希望能拿到一张工牌，但眼下已经不需要更多劳力了。下午三点，他在会议室里签掉了当天最后一批文件，总参谋部，港口和贸易部门都诉说自己的要求。克勒把三份文件叠在一起，忽然想起十年前自己第一次来这里时，厂区仓库还经常空着。现在仓库依然经常空着，只不过原因已经完全不同。产品总是一造出来，就立刻被拿走。傍晚下班时，橘红色的夕阳在他经过的新建的工人宿舍墙面上映出光斑，几个本地工人坐在门口吃饭，旁边有人在晾洗好的工服。远处的厂房还没有停，第二班已经开始工作。\n\n克勒驻足看了一会儿，随后继续往前走。这里确实比从前好得多。也确实比从前忙得多。"
 GEA.406.a:0 "订单还在增加"
 GEA.407.t:0 "依法裁决"
 GEA.407.d:0 "阮文礼第一次走进殖民法院时，特意穿上了自己最好的一件白衬衫。妻子替他熨平领口，又把装着地契、纳税凭证和村里长辈证明的布包检查了三遍。那片橡胶林是父亲留下来的，在IG法本决定在那里建设新的原料处理设施以前，它归属于阮家是无可辩驳的。\n\n地方政府随后把附近划为“战略工业开发区”。测量队来过一次，第二次是工程师，第三次来的便是推土机。补偿通知寄到时，仓库已经拆了一半，而法本给出的数字甚至买不回同等面积的荒地。于是阮文礼决定告他们，他不相信如今企业已经能够在这片土地上践踏法律。\n\n开庭那天，IG法本来了两名公司律师、一名殖民法律顾问和一名土地测量专家。阮文礼这边只有他自己、翻译，以及本地商会介绍来的律师。阮家的纳税记录可以追溯到二十多年前，村里的土地册也一直把那片地记在他们名下，看起来官司并非毫无希望。\n\n随后，法本的律师开始逐项解释：旧土地册并不等于帝国认可的不动产权登记；部分林地位于殖民政府保留地；至于剩余土地则已经依据工业开发条例完成合法征收。等到午休时，争论仍然没能得到终结，而阮文礼的耐心与信心也逐渐地被消磨。\n\n下午则轮到补偿讨论。IG法本的律师提出那片土地上的橡胶树树龄偏高，而仓库维护也难称优秀，因此公司给出的金额“充分体现了合理市场价值”。阮文礼忍不住站起来发问，如果那片地真的如此不值钱，为什么德国人非要不可。法官只让他坐下。\n\n三个星期后，判决寄到了家里。法院确认征收程序合法，同时认定原告提交的旧土地记录不足以推翻殖民政府现有地籍资料，而额外赔偿请求缺乏法律依据。几个月后，阮文礼再次经过旧村，原来的橡胶林已经被推平，围墙后竖起了IG法本的新厂房。\n\n入口处挂着一行标语：§Y“法律保障发展，发展创造繁荣。”§!\n\n他的律师从来没有说错，他们确实拥有起诉的权利。"
 GEA.407.a:0 "法院已经作出了裁决"
 GEA.408.t:0 "化学家的国度"
 GEA.408.d:0 "弗里茨·特尔·梅尔从不认为自己是个适合统治国家的人。至少在来到新加坡以前，他从未认真考虑过这个问题。相反，他更愿意把自己称作化学家。\n\n父亲在乌丁根经营化工企业时便告诉过他，实验室里的成果无论多么美好，只要无法投入实际生产，就不过是昂贵的消遣。后来他在柏林取得博士学位，接手家族事业，又亲眼见证IG法本的诞生。从乌丁根到勒沃库森，从莱茵河畔到美国新泽西州，他逐渐学会了一件事情：决定现代工业命运的，并不总是某项发明，而是有没有人能够组织起成规模的工业生产体系。\n\n眼下，他正坐在新加坡总督府宽敞的办公室里，背后悬挂着硕大的德属东亚地图。\n\n这张地图令他着迷。印度支那，无可置疑的稻米之乡；马来亚与婆罗洲有取之不竭的林场和矿藏；而南方诸岛种植园里源源不断流出的橡胶乳液，更是现代化学工业不可或缺的原料。然而几十年来，殖民地的大部分经济活动仍停留在开采然后出口的阶段。忙碌的船只把原料运过半个地球，送进工厂加工再把制成品卖回东方。梅尔很难理解为什么这种浪费能够持续如此之久。在他看来，整个东方就应成为德意志帝国的海外工业中心，而不是单纯的大矿区或者林场。\n\n当然，他的同僚们并不全都赞成这套想法。柏林的董事们担心海外扩张会分散投资，而目光短浅的航运企业不愿失去利润丰厚的原料贸易。自己手下的脑袋生锈的殖民官僚们更是觉得觉得总督的工业计划已经超出了地方行政的职责。他们的反对意见最终都被整理成报告，整整齐齐地摆在梅尔的办公桌上。\n\n弗里茨·特尔·梅尔已经把它们全盘审阅，全部都是一些狗屁。\n\n下午的会议上，梅尔批准了新的化工厂选址和预算，并同意为几家当地企业提供收购报价。就在他充满热情的向下属们展示他所计划的德属东亚工业化的伟大蓝图时，一名财政官员谨慎地提醒他，工业开发涉及大量土地征收，可过去的种植园经营者和本地商人恐怕不会轻易交出自己的生意。梅尔没有理他，继续着自己慷慨激昂的蓝图演说。\n\n会议结束时，天色已经暗了下来。梅尔在地图上圈出了下一批工业项目的位置。工作人员陆续离开，偌大的政府官邸内只有他仍在查看新的生产预测。帝国殖民办公厅即将迎来又一份利润丰厚的季度报告，而梅尔在德国的亲信则也带来的消息：IG法本的几名董事已经认为，德属东亚有机会成为IG法本在欧洲以外最重要的生产基地。\n\n他摘下眼镜，颇为满意地打量着自己的工作。统治国家原来也没有想象中那么困难。"
 GEA.408.a:0 "一切都在计算之中"
 GEA.409.t:0 "表面天堂"
 GEA.409.d:0 "西贡郊外的一处工人住宅区里，一位年轻的母亲正试图哄女儿入睡。女孩最近总是咳嗽，尤其到了夜里，喉咙里便会发出令人不安的喘息声。城里的德国医生说这不过是季节变化引起的寻常疾病，开了些药便让她们回家。然而母亲清楚地记得，在工厂扩建以前，女儿从未这样频繁地生病。自从新的化学处理设施投入生产，附近的空气便时常弥漫着刺鼻的气味，就连晾晒的衣服也会沾上一层灰黄色的粉尘。\n\n她的丈夫就在那些烟囱下面工作。每天清晨，他都要随着汽笛声进入厂区，在闷热的车间里度过十几个小时。公司引进新设备以后，工头又提高了生产定额。尽管收入勉强有所增加，可在支付住所的租金、购买日渐昂贵的食物，以及替女儿取回那些越来越不管用的药以后，夫妻二人依旧存不下多少钱。\n\n他们也曾想过搬走。可附近的村庄早已随着工业开发计划被陆续征收，原本能够耕种的土地不是变成了工厂，就是被划进了新的种植园。更远处的房子倒还便宜，只是丈夫每天上工便要多走几个小时。至于辞去工作，他从未认真考虑过。女儿还需要吃药，他们也没有多少积蓄能够支撑一家人重新开始。\n\n夜渐渐深了，女孩终于在母亲怀里安静下来。窗外的天空却依然泛着淡淡的橘红色，那是厂区里终夜不熄的灯火。远处传来一声汽笛，紧接着又是一阵低沉的机器轰鸣。母亲轻轻拉上窗帘，想把那股难闻的气味挡在外面，却发现女儿刚刚洗净的枕巾上，不知何时又落下了一层细细的灰尘。\n\n报纸上说，德属东亚正在成为世界上最繁荣的工业殖民地之一。她并不懂那些，只知道丈夫每个月带回来的工资，依然不足以让女儿呼吸上一口干净的空气。"
 GEA.409.a:0 "何人之繁荣"
 GEA.410.t:0 "黄金时代"
 GEA.410.d:0 "IG法本远东事业部最新公布的年度财务报告，再一次令德国商界为之振奋。营业收入创下历史新高，海外投资回报已经远超董事会预期。在汉堡与柏林的证券交易所里，投资者争相购入与远东事业有关的股票，而在新加坡，人们已经迫不及待地开始庆祝这场伟大的商业胜利。\n\n弗里茨·特尔·梅尔为此举办了一场盛大的晚宴。新加坡最豪华的酒店早早便被包下，来自德国本土的董事、德华银行的代表、各大航运公司的经理以及殖民地工商界的显贵纷纷应邀出席。餐厅里的银质餐具擦得锃亮，莱茵河畔的佳酿摆满长桌，由本地仆役端上的精致菜肴一道接着一道。甚至有人专门从欧洲运来新鲜食材，以免贵客们在遥远的东方受了委屈。\n\n宴会开始不久，大厅里便充满了愉快的交谈声。一名银行家兴致勃勃地讲述自己如何在黑色星期一期间低价购入远东公司的股份，如今已经赚回了数倍利润。另一位企业经理则得意地展示着自己公司的飞速发展，声称只要再获得几处种植园和加工厂，在亚洲的业务便足以同欧洲本土的部分部门相提并论。梅尔对此颇为满意。他向来瞧不起那些对化学工业一窍不通、却热衷于指点经营的政客，但今晚的宾客至少明白在他的领导下德属东亚究竟能够创造何等的奇迹。等到最后一道甜点撤下，他终于端着酒杯站了起来，感谢股东们的信任，赞扬工程师的勤勉，又向为远东工业建设提供便利的官员致意。他尤其强调，东方事业的成功正是德国科学与企业精神共同努力的成果。宴会厅里随即响起热烈的掌声，许多人已经开始畅想下一年度更加丰厚的分红。"
 GEA.410.a:0 "为德意志的商业奇迹干杯！"
 GEA.411.t:0 "看门好狗"
 GEA.411.d:0 "克虏伯在德属东亚的产业越铺越大，随之增长的却不只有订单和利润。越工在铁路沿线的破坏活动没有随着克虏伯的利润升腾而中止，相反，针对运输渠道与德国职员的袭击时刻敲打着蒂洛总督与诸多克虏伯董事的思绪。如果继续放任如此恶劣的袭击行径不管，只怕红色匪徒们只会变本加厉。\n\n有鉴于此，蒂洛·冯·威尔莫夫斯基因此批准了一笔新的治安拨款，只是这笔钱究竟应该交给谁，仍然存在争论。殖民警察，毫无疑问对城市和工人区最为熟悉不过，也最适合搜查与追捕潜藏在工会，工人与各种小型结社中的越工分子；宪兵的手段更直接，能够在交通线和乡间迅速展开搜查，捣毁他们的联络地点；军方则坚持，既然越盟和其他地下组织已经拥有武器，那么继续把问题当成普通治安事务只会让殖民地付出更高代价。\n\n根据这些部门的不同职能，总督需要将他的支持优先提供给单独一个暴力机构以尽快确保秩序的稳定。而在一切安顿后新加坡才有更大的空间与资本来与这些红色暴徒更好的周旋。现在的问题只有一个，谁将得到蒂洛男爵的青睐？"
 GEA.411.a:0 "扶植警察部门"
 GEA.411.b:0 "让宪兵代替我们搜捕"
 GEA.411.c:0 "军队知道如何以暴制暴"
 GEA.412.t:0 "红色药剂"
 GEA.412.d:0 "来自埃尔伯费尔德的信件最初并没有引起多少人的注意。IG法本每年都会向远东寄来数不清的新染料、新药品和实验性化合物，其中绝大多数最后只会停留在实验室的柜子里。然而这一次，随信而来的几个小玻璃瓶，却让新加坡医学部门格外重视起来。\n\n瓶中装着一种鲜红色的化合物，内部编号KL-730。IG法本的化学家约瑟夫·克拉勒与弗里茨·米茨施最初只是把它当作众多偶氮染料衍生物中的一种，直到病理学家格哈德·多马克将它用于感染链球菌的小鼠。实验结果近乎荒谬：未接受治疗的动物很快死亡，而服用这种红色药剂的小鼠却几乎全部存活。\n\n法本内部对此一度相当谨慎。此前已经有太多所谓的“杀菌药”在试管里表现良好，进入人体后却毫无作用。多马克本人也花了数年继续验证这种药物，直到它在真正的病人身上展现出同样惊人的效果。据说，他甚至曾在自己女儿罹患严重链球菌感染时亲自使用这种药剂，并最终保住了她的性命。\n\n如今，这种名为“百浪多息”的药物已经开始进入正式生产。对于德属东亚而言，它的意义尤其明显。伤口感染、产褥热与各类化脓性疾病长期夺走着士兵和居民的生命，而过去医生能够做的事情往往相当有限。现在，德国化学工业第一次真正拿出了一种能够从体内对抗细菌感染的武器。\n\n总督府已经要求殖民医院优先取得一批样品进行临床试用，IG法本则迫不及待地准备扩大生产并打开东方市场。对企业董事们而言，这当然也是一桩极好的生意。"
 GEA.412.a:0 "实验室里的奇迹"
 GEA.413.t:0 "新式装甲"
 GEA.413.d:0 "随着帝国陆军重新打开军备订单，克虏伯的试验场上又开始出现那些许久未见的履带车辆，而远东对于柏林与埃森来说是无可置疑的优秀炎热环境测试场地。总参谋部将本土送来的诸多测试武器中的其中一种称作“伴随车辆”——一辆装有短身管七十五毫米火炮、专门跟随步兵摧毁机枪阵地与野战工事的中型战车。对于正在重建装甲力量的德国陆军而言，它只是未来诸多新武器中的一种；对于远在东方的殖民军官们而言，这东西却很快引起了不同寻常的兴趣。\n\n德属东亚的自然环境与本土大相径庭：印度支那的道路狭窄而泥泞，而许多桥梁供人畜通过尚可支撑，但根本承受不了不断增加重量的装甲车辆。此外，潮湿空气又足以让德国精密机械在数月内布满锈迹。于是，克虏伯的测试部门认为为了适应远东的恶劣环境，这款装甲战车不得不减轻非必要的负重，加宽履带，强化发动机散热与防水处理。而战地维护与修理流程也需要被简化。那些原本为了欧洲平原设计的储物位置，也被重新安排用来携带牵引绳、备用履带和更多高爆弹。\n\n唯一没有被更改的反而是那门克虏伯七十五毫米短炮。它的初速并不出众，对付新式重装甲车辆更谈不上理想，但对于殖民军部队来说在远东遇到敌军的装甲车辆本就是天方夜谭。对他们而言，一发能够把木制碉堡、房屋墙壁乃至丛林边缘的临时阵地轰开的高爆弹，远比所谓的甲弹对抗更加重要。\n\n第一辆改装试验车在雨季被送进印度支那内地。它曾陷进泥地两次，又撞坏了一段木桥，还因为过热停下来整整半天，但最终仍然靠自己的履带爬回了公路。随行的克虏伯工程师在报告里密密麻麻写满了需要修改的地方，而负责试验的军官却只在最后添了一句话：“再送几辆来。”"
 GEA.413.a:0 "为远东翻新一下他们的武器"
 GEA.414.t:0 "钢铁之中"
 GEA.414.d:0 "克虏伯一直对“最坚硬”这种夸张无比的说辞嗤之以鼻。对于装甲钢而言，单纯追求硬度往往意味着脆裂，而一味强调韧性又会让炮弹更容易贯入。真正困难的地方，在于如何让同一块钢板同时具备两种近乎矛盾的性质。\n\n世界大战时期的克虏伯渗碳装甲已经给出过一种答案：利用镍提高韧性，以铬增强硬度，再通过表面渗碳与复杂热处理。这意味着装甲正面将形成一层极硬的外壳，而背部仍保持足够的延展性。这样一来，炮弹首先会撞上一层足以破坏弹头的硬质表面，剩余冲击则由后方较韧的钢材吸收。\n\n到了如今，埃森与新加坡的实验室又开始重新改进这套老办法。钢液中的硫、磷等杂质被控制得更加严格，合金比例与淬火温度也不断调整。而开发人员尤其重视钢板内部组织是否均匀，因为对于一块数百毫米厚的装甲而言，即使理论数据华丽无比，内部的一道脆弱区域或缺陷也可能导致前功尽弃。\n\n新一代克虏伯装甲因此不再只是“更厚的钢板”，而是一件经过精确设计的工业制品。每一批产品都要接受切样、硬度检测和弹道试验，重要钢板甚至必须亲自挨上一发炮弹，才能证明自己有资格装上舰艇或装甲车辆。\n\n对于德属东亚而言，这些研究当然不只是服务于东亚分舰队。新的热处理方法与特种钢配方同样能够被用于车辆装甲、防御工事以及重型机械。至于这些新钢材究竟有多可靠，最好的答案终究不在实验室里。"
 GEA.414.a:0 "战争是最好的测试场"
 GEA_Krupp_armor_steel:0 "克虏伯装甲钢"
 GEA.415.t:0 "七个人的下午"
 GEA.415.d:0 "下午两点整，最后一名委员走进会议室，秘书随即关上了门。\n\n桌上已经摆好了当天需要处理的材料：西贡的新建染料厂申请追加预算，而马来亚方面要求扩大橡胶加工能力。在官方报告之外，一家经营了二十多年的华商药品公司则再次拒绝了IG法本提出的收购条件。文件不少，但真正需要委员们讨论决策的要事却不多。\n\n弗里茨·特尔·梅尔对此十分满意。IG法本过去也曾拥有庞大的工作委员会。各个部门派出自己的代表，会议一开便是半天。人人都有意见，可最后往往还要把问题重新送回董事会。而如今中央执行委员会的出现改变了这一切。真正的精英来管理公司，而其余数万名职员需要做的，仅仅是准备足够准确的数字。这个道理如今放在德属东亚也自然畅通无阻。\n\n地方建设问题在简短的讨论后就达成了一致，而一些需要被取缔或是收购的劣质资产也回到了他们该有的归宿中。然后轮到那家华商企业。法律顾问认为对方没有违反任何条例，直接没收显然不妥。而商业部门的恩斯特专员却指出，只要停止给予进口许可，再让德华银行重新审查贷款，他们最多还能撑过两个季度。十分钟以后，这个问题也解决了。\n\n五点四十分，会议结束。秘书重新进入房间，把桌上的文件分成不同的档案夹。当天晚上，几封电报从新加坡发往西贡、吉隆坡和婆罗洲。\n\n七个人已经替数百万人安排好了接下来几个月的工作，顺带也决定了他们的命运。梅尔收起钢笔，顺手拿起下一份会议议程。"
 GEA.415.a:0 "效率，这就是一切"
 GEA.416.t:0 "钢铁学者"
 GEA.416.d:0 "克虏伯的远东事业并不缺少有资历的人，也不缺少技术骨干，但最终包揽了绝大部分技术项目职责的高级经理却是一个在公司之外几乎没有多少名气的冶金工程师——赫尔曼·莱因哈德·申克。\n\n申克1900年出生于马尔堡。大战末期，他曾以步兵身份服役。在回到德国以后，他先后学习数学、自然科学和钢铁冶金，最终在亚琛取得工程师资格。1927年，他凭借一篇有关锰脱氧作用的研究获得博士学位，并在同年进入克虏伯埃森试验机构。\n\n申克认为，通过精确的计算与精密的分析控制能够将钢铁工业带入领先于时代的高度。这种理念也很快让他在克虏伯内部脱颖而出。他从试验机构转入电炉钢厂，随后又被调到埃森-博尔贝克的西门子—马丁厂。那里拥有当时欧洲最先进的炼钢设备之一，也给了申克一个将自己的理论化为现实的机会。他开始研究钢液与炉渣之间的反应、脱氧平衡以及冶炼过程中热力学与时间的关系，并把这些成果整理成两卷厚重的《钢铁冶金过程的物理化学导论》。该书首次阐述了液态铁和钢彼此之间以及与炉渣之间的相互作用，以及符合热力学定律的冶金反应。\n\n1936年，作为冶金领域的权威人物的申克已经成为博尔贝克厂的负责人之一。也就在这时，来自新加坡的调令摆到了他的桌上。蒂洛需要有人重新审视德属东亚各处零散的钢铁加工、维修和军工生产设施，再把不同工厂间各行其是的经验整理成一套能够复制的标准。平心而论，这项工作既不够光鲜，也很难立刻做出成绩。但若克虏伯真的打算在远东奠定重工业基础，这项工作就不可或缺，而申克则没有表现出任何犹豫。"
 GEA.416.a:0 "让我们点燃东方炉火"
#卢克纳尔/舍尔纳
 GEA.500.t:0 "海耶司令部的抉择"
 GEA.500.d:0 "我们终于战胜了印度支那的革命分子，柏林方面在得知此事后，要求我们的殖民总督、世界大战的英雄威廉·海耶归国，在祖国最需要他的如今协助参与法德边境或俄德边境的防卫事务，因为德皇和总督德意志帝国广阔殖民地的帝国殖民办公厅都认为，东亚这么一个十万八千里之外的穷山恶水之地简直是白瞎了海耶的才能。至于下任殖民总督，柏林准备让海耶的儿子、可敬的海军上将赫尔穆特·吉多·亚历山大·海耶来做，赫尔穆特身为海军上将，精通海上突击、潜艇战和巡洋舰战术，与柏林的中央党关系不浅，还一心一意忠于帝国，堪称总督一位的绝佳人选。此外，皇帝本人则看重一战时名声大噪的“海上幽灵”——菲利克斯·卢克纳尔伯爵，希望他能够接手管理东亚殖民地的职责。作为一位传奇的海上英雄，卢克纳尔伯爵凭借着自身的才能与对祖国的志诚忠心赢得了皇帝的青睐。不过，海耶本人拒绝了这一好意，称自己在印度支那的使命尚未结束，自己愿在这座殖民地待到退休或者死去的那天。那么，我们是无视海耶的意思，把他送回柏林，让他人领导殖民地，还是如这名战争老兵所愿，让他在殖民地官僚和游击战争簇拥下的热带颐养天年呢？"
 GEA.500.a:0 "威廉·海耶继续执掌殖民地"
 GEA.500.b:0 "赫尔穆特上台，并放松了其父的家长制作风"
 GEA.500.c:0 "皇帝指定卢克纳尔接任海耶的职责"
 GEA.501.t:0 "新任海军总督" 
 GEA.501.d:0 "费利克斯·尼古拉斯·亚历山大·乔治·冯·卢克纳尔伯爵自幼开始航海，如今正在擢升为皇帝最杰出的海军指挥官，是世界上最具名望，一直都在起航的水手。他于1881年出生于德累斯顿的卢克纳尔家族——这是一个以军事造诣闻名的贵族世家，从小承受着随父业加入骑兵部队的重担。卢克纳尔承受不了这个重担，于是在13岁的时候离家出走，他向家人发誓，除非他穿上“皇家海军制服，并获得荣誉”，否则他绝不会回来。他化名为“菲拉克斯·吕德克”，在一艘驶往澳大利亚的旧俄国船上找到了一份无薪的服务员工作。\n\n尽管在航行中落水后几乎丧命——只是因为他随后便与一只巨大的信天翁进行搏斗，大鸟巨翼的拍打和其他海鸟的蜂拥使卢克纳尔成为了海上的一个明显目标，救生艇的船员迅速找到了他并将其救出——年轻的冯·卢克纳尔很快投入了航海生活。\n\n到达澳大利亚后，为了谋生，他接了一大堆能让自己环游世界的零工，包括建筑工人、酒保、酒馆老板、拳击手、袋鼠猎人、马戏团演员、渔夫、灯塔管理员、墨西哥总统保镖，甚至因为偷了几只猪在智利监狱里吃牢饭，这些都是他20岁之前的经历。出狱后，他设法回到了德国，进入航海学校学习如何成为真正的水手。学成后，在那里，他在一条往返于德国在中美洲和汉堡的渡轮航线上工作，直至1912年，世界大战开始两年前，他回到了以为他早已死去的家中，被征召入皇帝的海军服役。\n\n冯·卢克纳尔在这场战争中发迹，他最初在豹号炮舰上服役的时候，作为一个坚定而杰出的海军军官而闻名。每次和英国海军相遇时，他都能痛打对方。英国人忌惮于冯·卢克纳尔，给他起了个“海上幽灵”的绰号。在大量的胜利之后，皇帝赐予了冯·卢克纳尔一艘缴获的三桅船，命名为“海鹰”，让他指挥——主要是因为他是德国海军中唯一拥有指挥这样一艘大型帆船经验的军官。配备了现代火炮之后，“海上幽灵”和他的“皇帝的海盗”们再度声名大噪，他们恢复了海上商船掠夺，将其用于束缚英国的补给线，且颇具成效。\n\n战后，冯·卢克纳尔和他的船员继续为皇帝服役，在七大洋上掠夺敌人的轮船航线，击沉流氓船只，一路上赢得无数新的荣耀和更高的地位，直至在德属东亚靠岸，接受赫尔穆特·冯·穆克和威廉·佐尔夫的指挥。如今，随着他们的失败导致德属东亚大部分地区陷入战火，“海上幽灵”冯·卢克纳尔已经继承了他们的指挥权。在他的监视之下，德属东亚会又一次驯服于皇帝……"
 GEA.501.a:0 "真是条汉子"
 GEA.502.t:0 "骑士归乡"
 GEA.502.d_lost:0 "镇压印度支那革命失败后，名誉扫地的前大战英雄威廉·海耶卸下了殖民地职务，从德属东亚归国，服务于最需要他的祖国，协防边境事务。不过，接下来要面对的战争可没有失败一说，歹毒的工团主义者和各式复仇主义者如狼群般环伺我们左右，这场战争不是你死就是我亡，因此，总参谋部中有人提出不能把如此重任交予败军之将，让海耶趁早退休得了。那么，我们是让这名战争老兵提前退休、淡出视野呢，还是再给予这位曾经荣耀加身的骑士一次为帝国服务的机会呢？"
 GEA.502.d_won:0 "成功镇压印度支那革命后，一时间风光无两的两场战争（世界大战、印度支那叛乱）的英雄威廉·海耶卸下了殖民地职务，荣归故里，服务于最需要他的祖国，协防边境事务。不过，这位战争老兵一直都盼着能早点退休，而他的功绩也确实配得上这个资格。那么，我们是遵从海耶的意愿，允许他提前退休呢，还是继续让他用自己的经验和一丝不苟的严厉态度指导我们取得最后的胜利呢？"
 GEA.502.a:0 "你辜负了我们，将军，已经不会再有什么机会了"
 GEA.502.b:0 "允许其提前退休"
 GEA.502.c:0 "把他安排进总参谋部"
 GEA.503.t:0 "力挽狂澜之选"
 GEA.503.d:0 "印度支那的失陷已经成为德意志帝国在远东数十年来最为耻辱的失败。曾经高悬于西贡与河内的帝国旗帜如今被革命者扯下，数以万计的德国士兵仓皇撤退，而海耶总督对于迅速平定叛乱的保证，最终也随着殖民地防线的崩溃化为泡影。皇帝与帝国政府已经失去了对海耶的信任，他的总督生涯至此宣告结束。然而，撤换一名失败的总督远比重新恢复德国在远东的威望容易。但如何处置残存的殖民地、重整驻军并应对日益猖獗的反德势力，仍然是摆在柏林面前的首要难题。\n\n对于如今的惨状，帝国殖民办公厅决定任命“血腥费迪南德”，即因残忍手段与极度严厉的治军方针闻名的费迪南德·舍尔纳。费迪南德·舍尔纳坚持认为，印度支那的失败源于殖民地当局的软弱与军事指挥的混乱，唯有严厉的纪律、彻底的军事整顿与毫不妥协的反攻准备，才能重新树立帝国的权威。然而，皇帝本人则更加青睐“海上魔鬼”菲利克斯·冯·卢克纳尔伯爵。卢克纳尔则主张依靠海军与远东贸易网络重建殖民地的力量，以更加大胆的海上行动弥补陆上战争造成的损失。两人的计划都充满风险，但帝国显然已经没有多少继续犹豫的余地。"
 GEA.503.a:0 "费迪南德·舍尔纳将挽救远东危局"
 GEA.503.b:0 "皇帝指定卢克纳尔接任海耶的职责"
 GEA.504.t:0 "失败者"
 GEA.504.d:0 "印度支那的惨烈战火已经熄灭了，与之一同消散的还有曾经德意志在远东的荣光：曾经不可一世的德意志帝国东亚分舰队已经彻底败于了印度支那的起义者们手中，而如今的总督威廉·海耶自然难辞其咎。自与越盟签署停战协定后，整个德属东亚总督府都陷入了几近瘫痪的状态。原本不得人心的政府如今已经彻底丧失了对全部殖民地的控制，仅存的殖民地各处的暴动报告如雪片般飞至总督府，而这些求援报告都如同泥牛入海般消失。\n\n在海耶总督的办公桌周围，信件草稿被扔得遍地都是——而桌子后方四散纷飞的地图碎片与地上昂贵的东方瓷器昭示着德属东亚的主人————威廉·海耶已经几乎走投无路。曾经风光无限的德意志帝国东亚总督，大战英雄海耶，如今似乎已经彻底变成了一名衰弱的败者。他开始反思：难道过去自己为了稳定殖民地的局势所做的一切都是错误的？难道正是自己亲手所作的一切导致了如今的败局？威廉·海耶想不明白，也再也没有多少时间去为此深究了。事到如今，他除了为自己的过错与失误而愤怒，什么都无法做到了。"
 GEA.504.a:0 "在这场生存竞赛中，失败者将赔上一切"
 GEA.505.t:0 "审判日"
 GEA.505.d:0 "威廉·海耶，在失败的愤怒与恐惧中回想了自己在军队中的一生。自他报效祖国投身军旅以来，他无所畏惧的经历过无数次战役，最终最高陆军司令部作战部部长的身份结束了自己的大战生涯。他本可以在战后呆在德国本土，像与他的密友鲁登道夫一样身居德国政坛高位。但鲁登道夫的倒台改变了一切，而他这位曾经德国最有权势的军官的密友也自然遭到了牵连，被以近乎发配的形式赶到了德属东亚这片恶土。但他依旧没有动摇对德皇的忠诚。可如今，他亲手让德属东亚这个帝国殖民王冠上的明珠蒙尘。他无法承受这种耻辱，也自然无法坦然接受自己的任何可能的结局。\n\n一瞬间，总督办公室的大门被大力破开，一个德军小队鱼贯而入。海耶正准备抬头怒斥这些士兵，但迎面就对上了费迪南德·舍尔纳墨镜后那股穿刺人心的目光。血腥费迪南德，这只无拘的野兽，像一名屠夫正在打量着他即将被屠宰的牲畜般审视着他。\n\n“马克西米利安·亨利·弗里德里希·威廉·海耶，你将被以叛国罪逮捕并即刻押送回国！如果你想为自己的罪行辩解，就请把话留到柏林的军事法庭上说吧。当然，如果你想反抗这份逮捕令，”舍尔纳掏出了他的手枪，朝着天花板开了一枪，“等待你的就不是军事法庭了，而是就地击毙。”\n\n海耶脸上闪过短短一瞬的惊讶，而这点转瞬即逝的情绪很快就被怨恨与愤怒冲刷殆尽。是的，他如今当然明白为什么自己事到如今都没有收到任何来自柏林的任免或是处罚。这是羞辱，是对他的才能与忠心的彻底践踏。殖民办公厅的尸位素餐的官僚看不起他，而皇帝陛下则因为他的过失而彻底认定了他的无能。\n\n训练有素的德军别动队迅速控制住了海耶并把他押送出门，这位如今已经沦为阶下囚的总督一言未发，只是以仇恨的眼光紧盯着舍尔纳。而血腥屠夫根本不曾直视海耶，自顾自地坐在了办公桌后。这位“血腥屠夫”如今将领导德属东亚的一切，也自然将为过去的一切失败而复仇。"
 GEA.505.a:0 "胜者才永远会是审判者"
 GEA.506.t:0 "村庄之旅"
 GEA.506.d:0 "安禄城南几十英里，一座古色古香的渔村坐落于同奈河畔。它以田园牧歌的形态，成为了一片与世无争的绿洲，漂浮在长期混乱的印度支那。当地的越南农民努力种田、捕鱼，无忧无虑，如同在打造杰作，这样的田园生活似乎已经持续了几十年之久，但这样的日子快要走到头了。\n\n多数村民不知道，一小群工团主义者已经开始在村子里以捕鱼为掩护，开展他们的激进活动。这群受过大学教育，大多年幼无知的反叛者，向开明的渔民们借来渔船、渔筏，逆流而上，将偷来的德制枪械，运给藏身北方群山之中的游击队。这群幼稚的年轻人还以为自己在援助某项高尚的事业，殊不知他们的计划，如今已经封死了这座村庄的命运。\n\n同奈河上，武装到牙齿的巡逻艇呼啸而过。在艇上的是费迪南德·舍尔纳的秘密部队“蝰蛇”，个个都是一等一的老兵。他们准备好了喷火器、燃烧弹、MP-40冲锋枪，以及爱酷打火机，来到这片绝世独立之地，就为了一件事——把这个社会主义窝点烧成灰。当他们高速行驶的船只到了村庄的近郊，还没靠岸，舍尔纳的手下们就开始朝着船外的渔民们开火，武装快艇上的mg34枪口喷吐出一连串的火舌，随之而来的是渔民们四溅的鲜血。血液把村庄的入口染得鲜红，蝰蛇小队立即开始行动，像瘟疫一般穿过村庄，对着茅草屋内清空一个又一个弹夹，然后付之一炬，烧掉里面的死伤者。村庄被炼狱吞噬着，空气中充斥着令人毛骨悚然的尖叫，以及血肉和凝固汽油燃烧的味道。许多躲在自己地窖中的村民正在祈祷着德国人不要发现自己，就看见地窖的通风口处飘进了绿色的气体。一些留在村庄中的大学生试图拿起武器反击，但这些手无缚鸡之力的学生打出去的子弹没有一发命中，反而是他们脆弱的头颅在细密的的冲锋枪响中像一个个西瓜一样崩出鲜红的血液。他们应该为此感到庆幸，因为舍尔纳下达的命令是尽数杀光，否则他们中的绝大部分无论男女都会受到非人般的折磨。\n\n不到一个钟头，整个村庄，不是正在燃烧，就是已经烧成了灰。村里的良民也好，社会主义者也罢，无一存活。当然也有不少想跑的，都被子弹放倒，或者被燃烧弹烧成了死状凄惨的人干。舍尔纳和他的手下们如此高效而彻底的行动，抹除了村庄覆盖着的秘密渠道，社会主义者们仅有的用于逃跑的船只，也在跑掉之前烧成了灰。脚下的这块土地，找不到任何人存在过的蛛丝马迹。其他的村庄，要是窝藏了印度支那分离主义者，这就是下场，因为当今的德属东亚是舍尔纳的天下，他就是要用这种方式维护统治。而这样的场景，正在印度支那的成百上千的村庄中上演。"
 GEA.506.a:0 "通向完美殖民主义之路上的路障，仅此而已"
 GEA.507.t:0 "马克思与莫里茨"
 GEA.507.d:0 "声名狼藉的海军上将费利克斯·冯·卢克纳尔伯爵名震七海，他是一位行动敏捷、魅力超凡、狡猾却又可敬的人，掌握着无与伦比的掌舵技能。作为一个杰出的战略家，一个明智的指挥官，一个饱受赞扬的战争英雄和退伍军人，卢克纳尔正具备标准的普鲁士老兵那坚韧冷酷，如同钢铁般的外在，但这位德皇陛下的私掠者其实也有一个不为人知的心头柔软之处。\n\n那就是几乎所有时间都陪伴着卢克纳尔的马克斯和莫里茨，他心爱的两只腊肠犬。每次正式会议、参观、演习，甚至是奔赴战场时，他都要带着他们舞于水面之上。当“海上幽灵”卢克纳尔操弄着他的标志性座舰“海鹰号”的船舵，为德皇称霸公海之时，他的两只猎犬甚至会在船的甲板上散步。对他来说，它们比他所获得的任何勋章都更加珍贵。他珍视这两只可爱的小狗，胜过他自己的生命，甚至可能胜过他的船员的生命。两只小狗帮助卢克纳尔软化了自己的棱角，让他在殖民生活的嘈杂中放松小憩。"
 GEA.507.a:0 "即使是海上恶魔也有柔软的地方"
 GEA.508.t:0 "总督登台"
 GEA.508.d:0 "卢克纳尔伯爵从来不愿仅仅坐在办公室，审阅着各地递上来的文书与报告，成为一名庸庸碌碌的“高级文员”。\n\n他十六岁时便从家中出走，用假名登上一艘俄国帆船，从最低微的水手活计做起，一直到进入帝国海军，又在世界大战中先后经历日德兰和“海鹰号”的远航。那艘挂着假旗、藏着火炮的帆船曾在协约国海上交通线上横行数月，被人称道为一时传奇。\n\n大战结束以后，卢克纳尔发现自己还有另一项本事。他尤其擅长讲述海鹰号与自己的那些传奇故事。从哈雷开始，他将自己那些海洋上惊涛骇浪中冒险袭船的传奇经历一遍又一遍讲给挤满礼堂的人听。海鹰号如何避开巡洋舰是绝佳的勾起观众好奇的引子，而如何装成挪威人和俘虏在船上的滑稽经历则往往引得听众们哈哈大笑。他也尤其喜欢讲述自己本人的不凡。到了兴头上，他偶尔还会拿起一枚硬币，或者干脆找来一本电话簿，让台下亲眼看看所谓“海魔”的手劲究竟是不是报纸吹出来的。\n\n如今，卢克纳尔已经不再满足于只在新加坡和西贡登台。在柏林的会议结束后，他会顺道前往维也纳、布达佩斯或阿姆斯特丹，在当地的商会、海军协会和大学礼堂里讲上一场；德意志帝国的盟国们邀请他出席纪念活动，他往往也乐于接受。有时行程甚至会越出德国势力范围，在那些与柏林保持友好往来的国家停留数日。唯一让柏林的官僚们苦恼的是，卢克纳尔依旧不喜欢照着外交部准备的稿子念。\n\n卢克纳尔往往能在同一晚上先给一群海军学员讲完南太平洋的冒险，再同银行家讨论有关殖民地的投资问题。而接受当地报纸的数名甚至十数名记者的采访对海魔本人来说更是家常便饭。某次演讲结束后，一名年轻军官又拿出一本厚厚的电话簿，请他证明那些关于“海魔怪力”的传闻并非吹嘘。卢克纳尔大笑着卷起袖口，将书脊狠狠折了两下。十几秒后，电话簿变成了两半。"
 GEA.508.a:0 "真乃当世传奇"
 GEA.509.t:0 "“海鹰”号的又一次航行"
 GEA.509.d:0 "“海鹰”号，卢克纳尔伯爵在一战时期的座舰，同时也是跟随“海魔”一同缔造传奇的左膀右臂。对老一辈水手来说，它仍然意味着那艘曾披着商船外衣突破封锁、横渡大洋并猎取协约国商船的帆装袭击舰；对更年轻的人而言，它则几乎已经成了一个传说。伯爵本人也希望再次赋予这个传奇的名称以新的生命力。然而，装甲袭击舰已经是落后于时代的旧产物，而一艘风帆袭击舰再次服役于东亚分舰队也更是无稽之谈。因此，伯爵希望这个曾经代表德国人在远洋上最大胆的一次冒险的名称能够重新被赋予一艘新的战舰，即作为帝国海军的荣誉鼓舞将士，也为了纪念这艘传奇的老朋友。\n\n如今的问题，则仅仅是由伯爵本人来决定。在如今新加坡的造船厂中，新一批造舰计划正在有条不紊的推进。而在这一批次的舰体中，占据主角地位的则是两艘正在建造的 与一艘开工不久的俾斯麦级战列舰。为她们中的某一艘船赋予海鹰之名毫无疑问是一个不错的主意。当然也有一部分人认为，在即将上马的项目中还有一艘战列巡洋舰计划和一艘航空母舰计划。将“海鹰”之名赋予她们中的一艘船也受到了一些军官的支持。如今的抉择权掌握在伯爵手中，他将为哪艘战舰赋予这个光荣的名字？"
 GEA.509.a:0 "为巡洋舰命名"
 GEA.509.b:0 "为战列舰命名"
 GEA.509.c:0 "为战列巡洋舰命名"
 GEA.509.e:0 "为航空母舰命名"
 GEA.510.t:0 "猎物的旗帜"
 GEA.510.d:0 "战争让太平洋上的航路变成了另一片战场。为了尽可能摧毁敌军的海上补给线路，同时也为了尽可能削弱敌国的海上力量，卢克纳尔伯爵将扩大东亚的海盗行动，并将让一战时海鹰号留给敌人的深刻回忆再度被唤起。现在，总督需要为他庞大的海盗行动制定新的敌人。"
 GEA.510.a:0 "追猎日本的航运"
 GEA.510.b:0 "截断澳大利亚的海上命脉"
 GEA.510.c:0 "给美国人上一课"
 GEA.510.e:0 "盯紧外阿穆尔"
 GEA.510.f:0 "收起海图"
 GEA.511.t:0 "来自柏林的问询"
 GEA.511.d:0 "近日，帝国外交部向德属东亚总督府发来了一封措辞严肃的电报，要求我们对近期发生在南海及周边航线上的一系列商船遇袭事件作出解释。数个国家的政府已经向柏林提出正式抗议，声称一些身份不明的武装船只正以打击走私与维护航运安全为借口，频繁拦截外国商船，没收其货物，并将战利品运往德国控制的港口。更令人尴尬的是，遇袭船员的证词表明，这些所谓的海盗不仅装备精良、行动有序，甚至还操着一口地道的德语。随着相关报告不断增加，帝国政府显然开始怀疑这些事件同远东舰队存在某种联系。\n\n柏林的问询无疑来得有些不合时宜。尽管海上行动已经为殖民地带来了不少额外收入，但如此迅速地引起帝国中央政府的注意，显然不在原先的计划之内。总督决定立即向柏林作出正式答复，坚决否认德国海军与任何海盗活动存在关联，并承诺进一步加强远东海域的巡逻，以保护各国商船的航行安全。"
 GEA.511.a:0 "这可不关我们的事，我们啊..."
 GEA.512.t:0 "柏林要求彻查"
 GEA.512.d:0 "最近几个月，殖民办公厅接到的远东投诉已经多到了不能继续束之高阁的地步。无论是航运公司要求解释接连发生的海上事故，还是新闻界不断的质疑之声，都使得殖民办公厅和外交部不得不着手处理远东殖民地的海盗疑云。"
 GEA.512.a:0 "那好吧"
 GEA.513.t:0 "柏林来客"
 GEA.513.d:0 "弗里德里希·克拉默已经在新加坡待了三天，而他的联合调查团甚至还没开始正式调查。来自海军部、帝国殖民办公厅和司法机关的官员们在会议室不断争论权限问题，而送来的档案又堆满了一间办公室。海军代表坚持首先核查商船遇袭时附近军舰的航行记录，而司法部门则希望从保险欺诈和非法货物转运入手。克拉默不得不花去整整一个上午，才让这些先生们同意先听取一份完整的案情汇报。\n\n好在殖民办公厅派来的奥托·魏格尔对此地事务颇为熟悉。这个戴着圆框眼镜，讲话不紧不慢的中年人随身携带的公文包里总能变魔术般找到所需的文件。几名年轻的菜鸟调查员甚至私下抱怨，倘若柏林的档案员也有魏格尔一半的本事，他们根本不必远渡重洋。\n\n“诸位，请看这里。”魏格尔展开一张南海航运图，标出了近年来发生的数起重大海上案件。“最初的异常集中在华南沿海，此后逐渐蔓延至北婆罗洲和马六甲海峡。失踪的货物往往价值不菲，袭击者行动迅速，似乎拥有可靠的接应港口。当地那些与走私商人勾结的海盗团伙，完全有能力组织这样的行动。”\n\n又一份报告被递了上来：“最近一艘遭劫商船的船长声称，袭击者不仅准确找到了贵重货舱，还预先切断了无线电设备。另有船员回忆，附近出现过一艘装有日本制造发动机的快艇，而一艘涉嫌转运赃物的商船，也曾停泊于某家日本商行租用的码头。那些日本情报机关在南洋活动频繁，若有人利用当地犯罪组织实施秘密行动，恐怕也不会是什么难事。”\n\n“所以我们现在有了两伙嫌疑犯？”海军代表冷冷插话道。\n\n“恐怕不止两伙，上校。”魏格尔翻过一页材料，“不过我建议诸位先从有可能查清楚的地方开始。”\n\n克拉默始终没有参与争论。他翻阅着船长的口供、港务登记和地方警察的调查笔录，发现其中几处细节值得注意。根据两份不同的记录，一艘受到怀疑的货船竟然在同一天下午分别出现在两个相距甚远的港口。更奇怪的是，几份出自不同警察署的证词使用了完全相同的措辞，甚至连一处地名的拼写错误都毫无二致。\n\n“地方警察统一整理过证词。”魏格尔解释道，“至于时间上的出入，许多沿海村落连可靠的钟表都没有。何况这些材料先经过当地翻译，再由殖民政府重新誊写而成。这些差错虽然需要考虑，但目前来说还不要紧。”\n\n合情合理，克拉默在心里默念。此前在柏林经手的案件里，他同样见过不少被秘书抄错日期的证词。然而，他注意到其中一份笔录的附件编号似乎对应着另一件毫不相干的案子。魏格尔表示可以稍后向档案室核实，随即将两份已经拟好的调查建议放到桌上。\n\n一份建议调查团联系华南各地警察与商会，追查活跃于南洋的秘密海盗网络；另一份则要求核查日本商行、航运代理人与情报人员之间可能存在的联系。两套方案均附有证人名单、联络地址及相应的调查权限申请，准备得相当周全。\n\n散会以后，克拉默独自留在办公室里。窗外传来港口轮船的汽笛声，他的秘书已经等着将第一批调查令送去签署。桌上的两份建议书都言之有物，也都值得投入人手，但那几份措辞过分整齐的证词仍然让他有些在意。\n\n他重新翻开笔记本，盯着自己圈出的几个档案编号。"
 GEA.513.a:0 "先从传闻中的南洋的海盗团伙开始查起吧"
 GEA.513.b:0 "或许日本人才更值得怀疑"
 GEA.513.c:0 "有什么不对劲..."
 GEA.514.t:0 "南海幽灵"
 GEA.514.d:0 "埃米尔·哈特曼已经担任德属东亚殖民政府的海事与港务总监将近十年。对于新加坡的每一座海运码头他可谓烂熟于心，不少往来于马六甲海峡和南中国海的船东也与他颇为熟识。正因如此，当克拉默的调查团决定从南洋海盗入手时，哈特曼便成了第一批需要接受询问的殖民地高级官员之一。\n\n上午十时，哈特曼准时抵达调查团的办公室，随身带来了一本厚重的港务年鉴和几份地方警察的报告。他向克拉默保证，殖民政府从未低估南海的海盗威胁。尤其是在华南政局动荡之后，大批失去依靠的武装人员、走私贩子和亡命徒开始沿着海岸寻找新的营生。几名曾在沿海军阀麾下服役的军官据说还在经营自己的船队，依靠隐蔽的岛屿港湾和当地商人的资助维持活动。\n\n这些说法引起了调查团的兴趣。哈特曼表现得很诚恳。他表示海盗们早已不再满足于袭击落单的渔船和沿岸货轮。他们有时使用合法登记的商船转运赃物，在不同国家的港口之间不断更换船名与船旗，甚至雇用熟悉欧洲航运业务的中间人处理货物。对于一个需要同时照顾印度支那、马来亚和婆罗洲海岸的殖民政府来说，想要彻底铲除这些团伙几乎是不可能的。\n\n然而，比起那些有的没的，克拉默更关心另一件事：这些看似可疑的犯罪活动真的能解释最近一连串性质异常的海上案件吗？调查团掌握的某些记录表明，袭击者对船舶航线和货物情况的了解远远超出普通海盗应有的程度，部分行动甚至表现出了相当严格的纪律。哈特曼对此并不意外，他认为华南沿海早已有不少退役海军人员和受过正规训练的军官流入地下犯罪组织。甚至可能一些东亚分舰队的不知去向的逃兵也参与其中。\n\n“既然如此，”克拉默问道，“你们政府是否掌握了这些组织的某些确切身份？”\n\n这名矮胖的殖民地官僚却没有立即回答。克拉默要求他说明证据究竟来自何处，以及殖民政府此前采取过哪些行动。他知道调查团此次显然不会满足于几条含糊的传闻，也不会对一些似是而非的证据感兴趣。\n\n哈特曼将双手放在桌上。桌子另一端，魏格尔正低头整理笔录。海军代表则坐在另一侧把玩着一支钢笔，心不在焉地等待着他的答复。"
 GEA.514.a:0 "“他们的秘密据点和船只名单已经在我们手里。”"
 GEA.514.b:0 "“地方线人的报告足以说明他们确实存在。”"
 GEA.514.c:0 "“此前的调查档案涉及殖民地安全，恕难奉告。”"
 GEA.515.t:0 "南洋寻踪"
 GEA.515.d:0 "埃米尔·哈特曼的证词至少为调查团提供了一些实实在在的工作。接下来的一周里，克拉默派人走访了数家商行，核查沿海警察所提供的船只登记，并与几名熟悉南洋走私活动的航运代理人进行了谈话。结果虽然谈不上令人振奋，却也并非毫无收获。几条早已销声匿迹的货船重新出现在不同港口的记录中，部分匿名线人提及的地名也确有其处。看来，南海的那些海盗传闻并非完全捕风捉影。\n\n真正令人头痛的是，这些消息分散在太多部门手中。殖民地警察熟悉沿岸的走私窝点，却几乎不了解公海上的活动；港务机关掌握船舶进出记录，但对那些频繁更换船旗的货轮束手无策；海军则拥有自己的情报网络，却从不习惯将消息轻易交给文职官员。克拉默已经为协调这些机构耗费了不少时间。\n\n“或许我们该找一位真正懂得海上犯罪的人。”奥托·魏格尔在一次会议结束后建议道。他从公文包里取出几份人事资料，放在克拉默面前。“殖民地警察局有位专门负责沿海匪患的高级警监.如果您想查找赃物的来去踪迹的话，港务总署也有一位经验丰富的稽查主任。不过，如果您希望知道那些海盗究竟怎样在公海上来去自如，我倒是听说过东亚分舰队的一个人。”\n\n最后一份档案属于海军情报处的恩斯特·福尔默少校。档案上的照片已经有些年头，那个蓄着短须的男人面容粗犷，一只耳朵似乎还缺了一小块。福尔默早年在商船队服役，世界大战期间又转入帝国海军，曾随一艘辅助巡洋舰执行过长期远洋任务，战后才逐渐进入情报部门。他的履历可谓丰富多彩，此人尤其擅长追踪船舶伪装、秘密补给点与海上走私网络。\n\n克拉默注意到，福尔默在大战期间的部分服役记录相当简略，只有一行关于南太平洋行动的说明，另外此人闲暇时总喜欢向年轻军官讲述横渡赤道的经历。魏格尔解释说，那时帝国海军有不少类似的特殊任务，许多人员档案至今也未补全。\n\n克拉默合上档案。殖民地警察、港务机关和海军情报处都能够为调查提供帮助，但调查团的人手与时间毕竟有限。他必须决定新的方向。"
 GEA.515.a:0 "先听听殖民地警察局掌握了什么"
 GEA.515.b:0 "港务总署的船舶档案或许更有价值"
 GEA.515.c:0 "让我们去拜访福尔默少校"
 GEA.516.t:0 "老水手"
 GEA.516.d:0 "恩斯特·福尔默少校的办公室与克拉默想象中的海军情报机关很不一样。除了墙上的航海图和一架陈旧的六分仪，房间里几乎没有什么值得注意的陈设。唯独书柜顶端的一张合影吸引了他的目光：一群穿着帝国海军制服的年轻人站在帆船甲板上，最前排那个身材高大的军官正咧嘴大笑。克拉默觉得那张脸有些眼熟，不过福尔默已经请他坐下，随即将一摞档案推到了桌前。\n\n这位少校对调查团此前收集的材料并不感到惊讶。他坦诚地说，华南那帮子海盗早在大战以前就懂得利用合法商船转运赃物，如今有了无线电和动力快艇，他们的活动自然更加难以追踪。至于袭击者表现出的军事素养，福尔默认为这不足为奇。世界大战结束以后，在这块地界上随手扔一块石头都能砸死一个有军旅生涯的水手。\n\n“我年轻时见过不少这样的家伙。”少校一边说着，一边用铅笔在海图上划出几条航线，“给他们一条船、几支枪，再找个愿意收货的商人，他们就能把半个南洋搅得不得安宁。至于那些军队的小把戏，对帝国海兵队可能不算什么，但放到那些海盗杂碎身上可就不一样咯。”\n\n接下来两个小时里，福尔默逐一审阅了调查团的笔录。他解释了为什么某些走私船可以在不经过正规港口的情况下获得补给。而调查组也被告知一艘此前被认为已经失踪的货船可能换用了另一国的船籍。纵使是经验丰富的克拉默不得不承认，这位老水手的知识确实令人印象深刻。\n\n会议快结束时，魏格尔带来了最新的地方警察报告。一艘涉嫌运送赃物的小型货轮已被扣押，船上发现数箱来源不明的贵重商品，几名船员也因涉嫌走私遭到拘留。福尔默看过报告，认为这很可能是调查取得突破的机会。不过，他提醒克拉默，追查这些人背后的买主和组织者，可能需要耗费数月，且涉及许多没有明确管辖权的外国港口。\n\n克拉默却不愿如此草率地结束调查。即使这批货物确实来自某次劫案，也不能据此认定近期所有案件都由同一集团所为。他始终没能找到那个核心问题：赃款呢？又是谁在指挥这些训练有素的袭击者？\n\n福尔默没有反对。他只是提醒这位调查组组长，南洋的秘密交易往往经过数道中间人，许多所谓的海盗头目甚至从不亲自登船。魏格尔则建议，既然海军情报处已经掌握了可供核实的实物证据，最好先处理眼前的案件，免得调查团在数不清的可疑账户和假名之间白费功夫。\n\n克拉默看着桌上的三份调查申请。柏林等候答复已久，而他们终于有机会将那些没完没了的传闻变成一份正式的调查结论。"
 GEA.516.a:0 "先核实扣押的船只、赃物与嫌疑人"
 GEA.516.b:0 "沿着赃款的流向继续追查"
 GEA.516.c:0 "找到这些海盗真正的指挥者"
 GEA.517.t:0 "一桩了结的公案"
 GEA.517.d:0 "弗里德里希·克拉默终于可以回柏林了。\n\n历经数月调查，特别调查团已经完成了最后一份报告。根据东亚分舰队情报处提供的线索，殖民地警察成功扣押了一艘涉嫌转运赃物的商船，并查获大批来历不明的货物。随后进行的审讯与船舶登记核查又让数家长期从事非法贸易的南洋商行浮出水面。虽然涉案人员对部分指控仍然矢口否认，但港口记录、货物清单与证人供述之间的相互印证，已经足以说明一个跨国海盗网络的存在。\n\n调查团并未查明所有案件的真相。失踪货物和一小撮认为参与策划袭击的核心头目也始终没有落网。不过，克拉默并不觉得这有什么可耻的。毕竟这里不是柏林的街道，想凭借几个外来的司法官和一批临时征调的警察，将盘踞多年的海盗与走私网络连根拔起，未免过于异想天开。至少如今有了嫌疑人和证据链，帝国政府终于可以向公众与外界作出交代，宰相大人也不用天天为了几个小毛贼发愁。\n\n离开新加坡前，克拉默专程向福尔默少校表达了谢意。那位老水手只是祝愿柏林的先生们返航顺利，并表示东亚分舰队今后仍将不遗余力地打击海盗。奥托·魏格尔则处理了最后的交接手续，甚至亲自核对了船票。克拉默与他握手道别时，真诚地称赞了他的勤勉，希望日后还有机会在殖民办公厅共事。\n\n调查报告随后获得柏林认可。几名主要涉案者被移交殖民地法院，德国报纸也报道了这场成功的跨部门调查。克拉默则回到了司法机关的日常事务中，继续应付那些永远不会自行消失的公文、诉讼和上司。\n\n几个月后，克拉默在殖民办公厅遇见了一位老同事。两人谈起新加坡之行，克拉默照例抱怨了几句海军部的官僚作风，随后又提到了奥托·魏格尔。他对这位同僚的印象相当不错：精明强干又熟悉当地情况，尤其难得的是，魏格尔似乎永远知道应该去哪里寻找一份遗失的文件。\n\n“魏格尔？哦，你说的是那个从新加坡调回来的家伙。”他把咖啡杯放下，“在东亚待了好些年，原先就在总督府任职。听说卢克纳尔相当欣赏他，去年还特意写信向殖民办公厅推荐。这人运气也真是的倒不错，刚回柏林就赶上这么大的好事。”\n\n克拉默一时没有接话。他记得魏格尔从未主动提及自己在新加坡的任职经历，更没有说过同卢克纳尔有什么交情。“那他的调任手续呢？”克拉默随口问道。“手续？当然齐全。怎么，你要查他？”\n\n“没有，只是问问。”两人很快谈起了别的事情。克拉默下午还有一场听证会，临走前甚至忘了取走自己的手套。\n\n后来，他又在一份殖民办公厅的人事文件中看见魏格尔的名字。文件上附有上司对其工作表现的评语，需要克拉默补上一句有关联合调查的意见。他想了想，拿起钢笔，在空白处写道：\n\n“办事审慎，富有责任心，对远东事务具有难得的专业知识。值得信赖。”"
 GEA.517.a:0 "一切疑问均已得到妥善解答"
 GEA.518.t:0 "第一道裂缝"
 GEA.518.d:0 "弗里德里希·克拉默起初对埃米尔·哈特曼的合作态度相当满意。殖民政府的海事与港务总监不仅提供了一份详细的海盗船只名单，还标出了几处据称被海盗用作秘密补给站的岛屿，附上相关船舶吨位与记录。相比此前含糊不清的目击证词，这条线无疑更值得调查。克拉默当即下令逐项核实，并将部分名单转交海军部核对。\n\n三天后，第一封回电抵达新加坡。名单上的一艘所谓海盗母船，早在两年前便因锅炉事故被拆解。哈特曼解释说，海盗可能盗用了旧船名。然而第二封回电则令人大跌眼镜：另一艘重点嫌疑货轮在案发时正于德控港口接受检修。不仅维修账目齐全，还有十几名工人能够证明此事。\n\n克拉默要求哈特曼说明情报来源，却被告知原始线人报告已按保密规定封存。调查团随即申请调阅卷宗，而档案管理员将它们找出来后，克拉默发现，其中两份所谓数年前的情报摘要竟然使用了殖民政府去年才开始采用的公文编号。他把文件翻到最后一页，负责核准这些报告的竟是同一个人：哈特曼本人。\n\n当天下午，哈特曼再次受到传唤。他坚持名单来自可靠线人，而档案问题只是整理材料时出了差错。克拉默让他指出秘书的姓名，又询问为何早已不存在的船只仍被记载为近期在南海活动。哈特曼先是抱怨调查团过分拘泥于文书细节，随后请求中止询问，随即几乎落荒而逃的走出了办公室。\n\n克拉默立即封存港务总署的有关档案，并禁止继续向殖民政府透露调查计划。随着原始记录被逐一核对，更多可笑之处浮现：一些线人根本从未存在于警方名册上！而另一些海盗船的踪迹则与分舰队的内部调动不自然地吻合。几张伪造名单所引起的疑问，已经牵扯到警察、港务和海军部门。与此同时，一名隶属于海军的调查员发现，几次可疑行动期间，有若干船只曾奉总督府特别命令出港，其日期恰好与部分海上案件相吻合。\n\n两天后，克拉默收到了一份带有授权标记的秘密航行记录。随行的老海军军官告诉他，那是卢克纳尔伯爵惯用的私人记号。克拉默盯着文件看了很久。他原以为自己要查办的是南洋海盗，如今却不得不怀疑，某些所谓的海盗行动本身便是以帝国的名义组织的。调查团随即申请直接讯问德属东亚总督，并要求海军部派遣独立人员接管证据。"
 GEA.518.a:0 "蛛网开始崩塌..."
 GEA.519.t:0 "最后骗局"
 GEA.519.d:0 "弗里德里希·克拉默已经记不清自己究竟是从哪一天开始怀疑卢克纳尔伯爵的了。是某份前后矛盾的证词？还是那几笔来历不明的款项？又或许只是某位海军军官接受询问时突然变得闪烁其词。如今，这些孤立的疑点终于被整理成一份厚厚的调查报告，封面上印着帝国殖民办公厅与海军部的联合印章。\n\n报告所揭露的事情远远超出了调查团最初的想象。那些被归咎于南洋海盗的袭击、失踪与非法转运，并非全部出自传说中的神秘犯罪集团之手。一批受到总督府特别保护的船只曾多次参与可疑行动，殖民地的港务、警察与海军机关则分别负责掩盖航迹、处理货物及封存记录。部分所得甚至通过中间商行重新流入殖民政府掌握的秘密经费。\n\n最令人难以置信的当然是这一切的幕后主使。费利克斯·冯·卢克纳尔，世界大战的海上英雄，昔日“海鹰”号的舰长，如今竟利用总督的权力，重新经营起了那套大胆而危险的海上袭击事业。只不过当年的敌国商船换成了和平时期的运输船，而他能操纵的也不再只是几个忠心耿耿的水手。克拉默将报告送往柏林时，担心殖民部的官员甚至那些大人物不愿相信这些结论。毕竟卢克纳尔的名头实在过于响亮。然而，海军部组织的独立复核证实了调查团的主要发现。几名涉案军官承认执行过未经正常登记的秘密航行任务，相关命令最终都能追溯到新加坡的官邸。\n\n帝国政府内部随即爆发了激烈争论。海军部要求彻查涉案人员，殖民办公厅则担心丑闻公开将严重损害德国在亚洲的声望。还有人提醒诸位大臣，卢克纳尔可不是能够悄悄调职了事的小人物。一旦让他站上被告席，外国报纸恐怕立刻就会把帝国昔日的海上英雄称为一个受德国政府庇护的海盗。"
 GEA.519.a:0 "如今帝国局势不妙，我们不能再火上浇油"
 GEA.519.b:0 "对德属东亚签发逮捕令"
 GEA.520.t:0 "海魔的末路"
 GEA.520.d:0 "来自柏林的逮捕令送达新加坡时，费利克斯·冯·卢克纳尔伯爵正在总督府的办公室里审阅一份海军报告。帝国政府终于失去了最后一点耐心。经过数日争论，殖民办公厅与海军部未能就如何处置这位声名狼藉的总督达成妥协，最终由帝国司法机关出面，以滥用职权、侵吞公款、组织非法海上袭击及妨碍司法调查等多项罪名，正式要求卢克纳尔返回德国接受审判。\n\n消息很快在殖民地的德国人中传开。海军俱乐部里有人愤愤不平，认为柏林竟然要把一位世界大战的功臣当作普通罪犯押回国内；也有人庆幸帝国政府终于准备收拾这场丢人现眼的闹剧。东亚分舰队的军官们则显得格外沉默。毕竟调查团的报告中提到的某些舰船与秘密任务，他们中的不少人都曾有所耳闻，甚至亲自参与。\n\n卢克纳尔对此倒并非全无准备。他年轻时曾违背家人的意愿离家出走，后来在世界大战中驾驶一艘改装帆船突破敌人的封锁，又在“海鹰”号触礁后乘小艇继续航行。英国人的巡洋舰、南太平洋的风暴和异国的战俘营都没能轻易叫他认输。如今，柏林竟然指望一纸盖着帝国鹰徽的公文，就能让他乖乖交出自己经营多年的东方事业。可眼下毕竟不是当年。伯爵在远东固然有自己的亲信和拥护者，但他们究竟有多少人愿意为了他而违抗柏林的命令，甚至把枪口对准自己的同胞？但最终，伯爵做出了他的选择。"
 GEA.520.a:0 "“我将亲自在法庭上为自己辩护！”"
 GEA.520.b:0 "“柏林的先生们，想抓海魔就自己来吧！”"
 GEA.521.t:0 "封存的卷宗"
 GEA.521.d:0 "会议室陷入了短暂的沉默。这位港务总监刚刚向弗里德里希·克拉默保证，新加坡掌握着足以证明南洋海盗活动猖獗的大量情报。然而，当被要求提供船舶进出港记录和警察报告时，哈特曼却突然改变了态度。他声称，其中部分档案涉及殖民地安全事务，未经总督府特别批准，不得随意公开。即使调查团持有柏林签发的授权令，也不应成为例外。\n\n克拉默并未当场发作，并开始暗自质疑为何哈特曼拒绝解释这些档案究竟涉及何种机密。魏格尔试图居中调解，建议调查团暂且接受经过删节的摘要。然而，海军代表随即指出，港务机关根本无权自行将普通商船登记列为军事秘密。\n\n调查团于是绕过哈特曼，直接向柏林请求调阅有关文件的授权。帝国殖民办公厅很快批准了申请，并要求新加坡方面不得妨碍调查。几天后，克拉默终于见到了那些被严密封存的卷宗。引人注意的是，数艘身份不明的船只曾反复获得特别通行许可，而签发许可的依据均被注明为总督府机密命令。\n\n“这些文件为什么要封存？”克拉默问道。档案管理员犹豫了一下，解释说保密命令并非来自海军部，而是由总督府直接下达。更奇怪的是，其中部分文件原本属于港务机关的普通业务记录，直到柏林决定调查南洋海上治安问题之后，才被重新归入特别保密档案。魏格尔认为，这或许只是殖民政府为避免泄露航运情报而采取的预防措施。克拉默却已经没有心思听他解释了。他要求调查员对照原始港口登记与海军航行日志，检查那些获得特别许可的船只究竟去了哪里。接下来的发现令人不安。几艘船在官方记录中从未离开过港口，却曾在其他地方获得燃料与补给；一些被归咎于海盗的货物失踪事件，恰好发生在这些船只秘密出航期间。\n\n随着调查深入，原本互不相干的港务记录、海军补给账目与总督府命令开始指向同一个方向。克拉默终于明白，哈特曼拼命保护的恐怕并不是那些海盗的秘密。当天晚上，他向柏林发出一封加密电报，请求对德属东亚总督府展开全面调查，并对相关海事档案实施独立保全。"
 GEA.521.a:0 "蛛网开始崩塌..."
 GEA.522.t:0 "警察局的旧案"
 GEA.522.d:0 "新加坡殖民警察总监卡尔·布伦纳对调查团的到访显得颇为高兴。他特意让秘书搬来了几箱旧案卷宗，里面装满了走私货物清单和海盗嫌疑人的口供。最上面还散落着数十张泛黄的通缉令。布伦纳向弗里德里希·克拉默保证，只要警察有足够的人手和经费，南海的匪徒迟早都会落网。\n\n这番话并非全是吹嘘。警察局确实破获过几起海上走私案，逮捕了不少非法航运商人。不过，这些案件与调查团正在追查的重大劫案并没有多少直接联系。布伦纳却不以为意，他声称犯罪团伙向来彼此勾结，只要找到合适的证人，自然能将这些案件串联起来。\n\n第二天，警察局便送来了好消息。一名关押在新加坡监狱的华人走私犯突然愿意合作，供认自己曾替某个秘密海盗集团转运货物，还能说出几艘遭劫商船的名称。魏格尔建议立即将这份证词纳入调查报告，布伦纳更是得意地宣布，警方多年的辛苦工作终于得到了回报。然而，克拉默注意到些许不对：供词中准确描述了一批失踪货物的详细细节，而这些信息此前只出现在海军部的内部材料里。面对质询，犯人先是坚持自己亲眼见过，随后又改口说是听其他水手讲的。等海军部的官员要求他指出那些水手的姓名时，他便再也答不上来了。\n\n“或许是警员在询问时无意透露了案情。”布伦纳赶紧解释。克拉默要求查看审讯记录。档案显示，该犯人一天前刚刚被转入单独关押区，随后接受了数次没有留下笔录的讯问。负责办理手续的警官则只声称只是奉命行事。进一步调查后，一名年轻警察终于承认，几天前曾有总督府官员要求他们重新整理在押犯人的口供，并带来了一份案件摘要。其中部分内容，竟与那名走私犯后来所谓的主动供述完全一致。\n\n克拉默沉默了许久。当天傍晚，布伦纳被要求暂停职务，警察局有关档案遭到查封。克拉默随即向柏林发出电报，请求授权调查总督府对地方刑事案件的干预。"
 GEA.522.a:0 "有什么大事要发生了"
 GEA.523.t:0 "港口登记簿"
 GEA.523.d:0 "新加坡港务总署的档案室比弗里德里希·克拉默想象中还要庞大。数十年来，进出登记、货物申报与采购记录被分门别类地塞进铁柜。几名职员则每天忙着将旧账簿誊写成新的索引。港务稽查主任威廉·福格尔对此颇为自豪。他向调查团保证，只要一艘船曾在新加坡停泊，哪怕只停留几个小时，总署也能查出它留下的痕迹。\n\n福格尔并没有夸大其词。几艘被怀疑参与走私的商船确实在案发前后频繁出入南洋各港，其中两艘还曾更换船名与船籍。福格尔认为，这足以证明当地存在一个经营多年的海盗集团。奥托·魏格尔也表示赞同。不过，一名随行的海军调查员提出了不同意见。根据港务记录，其中一艘可疑货船曾多次领取远超其正常航程所需的燃料，而采购费用却没有记在船东名下。福格尔解释说，某些商船会受雇执行政府运输任务，费用由有关机关统一结算，因此港务总署并不总能掌握最终付款人的身份。\n\n克拉默要求查看相关凭证。职员很快找到了几份由殖民政府签发的特别通行许可，以及附在后面的燃料拨付单。奇怪的是，这些船只虽然登记为民用货轮，却曾获得军用码头的优先靠泊权，其中一艘甚至领取过本应由海军仓库保管的无线电器材。\n\n“战时物资调配留下的旧规定罢了。”福格尔解释道，“东亚分舰队偶尔会征用民船，我们只是按照上级命令办事。”克拉默接受了这个解释，直到海军调查员指出，其中几份许可签发于和平时期，而且没有任何相应的征用记录。更令人费解的是，部分船只明明在港务簿册中登记为正常停泊，却在同一天从另一处德国补给站领取了燃料。\n\n魏格尔建议先向船东核实情况，然而克拉默已经将几份单据放在一起。他发现这些互相矛盾的记录虽然出自不同港口，却拥有相同的授权编号，而该编号并不属于普通港务机关或海军运输部门。最终福格尔终于承认，有些特别许可是根据总督府直接下达的指示办理的。具体任务内容从未交给港务总署，职员只负责确保指定船舶顺利出入港口。\n\n克拉默随即下令封存相关登记簿，并要求海军部独立核对所有特别通行许可。当天晚上，调查团向柏林发出了一份新的报告，指出某些涉嫌海上劫掠的船只可能长期受到殖民政府的秘密庇护。"
 GEA.523.a:0 "有什么大事要发生了"
 GEA.524.t:0 "不该存在的账户"
 GEA.524.d:0 "克拉默对于迄今取得的成果并不十分满意。虽然情报处已经协助查获了一批赃物，也揪出了几名涉案商人，但这些人的供词始终无法解释如此规模的海上劫掠究竟由谁出资。于是，他决定从那些被扣押的货物入手，查清赃款的最终去向。\n\n最初的进展颇为顺利。调查员们顺着几张银行汇票，找到了一家注册于槟城的航运代理商，随后又发现该公司的大部分款项都经由新加坡的一家贸易行结算。类似的商行在南洋数不胜数，账面上的交易也大都无可指摘。然而，克拉默很快注意到，这些公司总是在某些海上案件发生后突然收到大笔汇款，随后又以船舶维修、航运保险或进口设备的名义将资金转往别处。\n\n奥托·魏格尔认为，这不过是南洋走私商人惯用的洗钱手段。他建议调查团尽快拘捕几名涉案经理，免得资金继续流失。克拉默却坚持先查清收款人的身份。他向德华银行索取有关记录，没想到银行方面竟以客户保密义务为由拒绝配合，直到柏林发来正式授权，调查员才得以接触那些被封存的账簿。\n\n账簿揭示了一个令人难堪的事实：数笔来自可疑贸易行的汇款，最终进入了由殖民政府担保的特别账户。以港口维护、海事安全和秘密情报支出的名义设立的这些账户，实际支取却无需经过通常的财政审批。更奇怪的是，其中几笔款项随后又被用于支付船员薪金、采购燃料以及维修身份不明的船只。克拉默要求查看相关任务的批准文件，而福尔默声称这些材料涉及军事机密，奥托·魏格尔也劝他不要将普通的财政审查演变为一场同海军部的权限争端。然而，克拉默已经发现，那些所谓的秘密任务并没有出现在海军部的年度预算之中。\n\n调查团随后直接向柏林请求核查。几天后，帝国财政机关确认，这些账户并不属于任何经正式批准的海军情报项目，而有关支出的最终授权人竟是总督本人。"
 GEA.524.a:0 "有什么大事要发生了"
 GEA.525.t:0 "海鹰号旧识"
 GEA.525.d:0 "恩斯特·福尔默少校似乎并不喜欢克拉默的新决定。他提醒调查团，南洋的犯罪集团通常由数名船长和走私商人共同经营。如果执意追查所谓统领一切的海盗头目，很可能只会徒废精力。不过，克拉默坚持认为，如此复杂的行动背后必然存在负责协调的核心人物。\n\n调查首先从福尔默提到的退役海军人员开始。根据他们的军籍档案，几名涉案船长都曾在大战期间服役。最初没有什么值得注意的发现，直到一份泛黄的舰员名册被送进办公室。几名嫌疑人的名字竟出现在同一份名单上，其中还有福尔默本人。而那艘船正是著名的“海鹰”号。\n\n福尔默被再次传唤时，坦然承认自己年轻时曾在卢克纳尔伯爵麾下服役。他表示，这并不是什么秘密，至于几名昔日同袍如今的去向，他已经多年没有过问。然而，进一步核查却带来了新发现。几名老水手近年曾多次接受东亚分舰队的临时雇佣以执行所谓的海事调查与特殊运输任务。这些任务的内容均被列为机密，而他们领取报酬的账户，竟与一家涉嫌销赃的商行存在联系。\n\n随后，一名调查员找到了一封旧日的私人信件。信是某位涉案船长写给福尔默的，内容大半是关于航海和昔日同袍的寒暄，结尾却提到近期某次行动，并表示一切已经按照“老舰长”的安排妥善完成。信中没有说明这个称呼究竟指谁，但克拉默毫不怀疑自己的判断力。\n\n福尔默再次接受询问时，仍坚持自己只是为海军提供专业情报。然而调查团已经有了充分的理由，要求核查东亚分舰队的秘密航行记录，以及那些由总督府直接批准的特别任务。离开询问室时，克拉默又想起福尔默办公室里的那张合影。照片上，年轻的水手们围着他们的舰长，笑得颇为开心。而那张脸开始在克拉默脑海中变得清晰，那是“海上魔鬼”——菲利克斯·冯·卢克纳尔本人。"
 GEA.525.a:0 "抓到你了"
 GEA.526.t:0 "旭日之下的疑云"
 GEA.526.d:0 "弗里德里希·克拉默从未想过，自己本是奉命调查南洋海盗活动，可如今竟会牵扯到日本帝国的秘密行动之中。抵达新加坡以前，他所了解的日德关系不过来自柏林的外交简报...以及每天的报纸。如今，调查团却不得不认真考虑，那些接连发生的海上案件是否涉及到了一些处心积虑的外国阴谋。\n\n奥托·魏格尔替他安排了一次与殖民政府情报人员的非正式会面。出席者中有一位名叫海因里希·瓦尔特的阿勃维尔高级专员，此人长期负责监视南洋各港口的外国侨民活动，对日本商社和航运代理的情况尤其熟悉。他带来的文件并不多，几份截获的商业电报、两张经过放大的码头照片，以及一份列有可疑人物姓名的调查摘要。\n\n瓦尔特汇报称，最近数年里几家日本商行的业务扩张与南洋海上案件的发生时间存在极巧合的碰撞。这些企业表面上经营机械加工和航运保险，实际却频繁聘用日本海军退役人员，并通过复杂的代理关系租赁船舶。某些涉嫌参与非法货物转运的中间人，也曾在日本领事馆举办的宴会上露面。\n\n“仅凭参加过领事馆的宴会，就能认定一个人是间谍？”克拉默不无怀疑问道。“当然不能。”这位阿勃维尔平静作答，“否则新加坡恐怕有一半商人都得蹲号子。不过，其中几个人的名字还出现在我们掌握的秘密情报里。”他拿出一份更为详细的人员名单，其中甚至包括几名日本海军的预备役军官。另一份材料则显示，某家日本航运公司的船只曾在案发前改变航线，而有关通知恰好过了一名被怀疑是日本宪兵内线的商行职员的手。魏格尔提醒克拉默，特高课等日本秘密机关完全有理由利用南洋的治安问题制造德国殖民政府无能的印象，甚至借此损害柏林与其他亚洲国家之间的外交关系。不过，他也特别强调，任何未经证实的指控都不应过早传到外交部，否则如果引起国际纠纷的话不光调查组，德属东亚政府也不能担待得起。\n\n克拉默重新审阅了那些材料。他注意到，其中几份所谓的秘密情报实际上来自同一名匿名线人，而瓦尔特提供的名单却几乎囊括了所有与案件有过间接联系的日本商人。名单上的某些人甚至已经离开南洋多年。瓦尔特解释说，情报工作本来就难免保留过时资料，重要的是找出那些仍然活跃的联系人。\n\n会议结束后，克拉默将文件摊在办公室里。海军代表建议直接核查名单上的嫌疑人，而司法机关的同僚则认为应当先从商行账簿与船舶租赁记录查起。还有一位调查员提出，既然案件可能涉及日本官方人员，不妨请德国驻日外交机构出面，要求东京给出解释。克拉默看着桌上那几张码头照片。照片里的人影模糊不清，船舶的标志也难以辨认。可假如瓦尔特所说的事情属实，那么这次调查的牵涉恐怕远比柏林最初预想的严重。"
 GEA.526.a:0 "先把日本间谍揪出来"
 GEA.526.b:0 "这些商行的账目得仔细检查"
 GEA.526.c:0 "或许该让东京方面给出一个解释"
 GEA.527.t:0 "账簿上的陌生人"
 GEA.527.d:0 "弗里德里希·克拉默已经连续三个晚上在办公室里吃晚饭了。桌上的咖啡早就凉透，烟灰缸塞满了烟蒂，几本日本商行的账簿则占去了他大半张办公桌。他原以为调查这些公司的资金往来能有所收获，可经过如此长时间的核查，他们唯一能够确定的事情，就是这帮日本人相当善于利用帝国税法上的漏洞。\n\n“如果这些混蛋真是间谍，那他们至少把会计请对了。”克拉默抱怨道。奥托·魏格尔没有笑。他把刚送来的几张汇款凭证放到桌上，点出其中一家名叫东洋海运商事的日本公司。该公司的业务和账目都无甚漏洞，唯独每个月都有几笔数额相近的款项，以‘海外业务补助’的名义支付给不同的收款人。令人哭笑不得的是，其中几个人根本不在公司的雇员名册上。\n\n克拉默戴上眼镜，凑近仔细看了看。汇款经手人的名字反复出现：中村信夫，一名经营进出口贸易的日本商人。根据工商登记，此人在新加坡租了一间不起眼的办公室，区区两个雇员，却同时与香港、马尼拉和巴达维亚的多家航运公司保持往来。\n\n“这位中村先生倒是忙得很。”\n\n“我们以前也注意过他。”殖民政府的情报专员海因里希·瓦尔特从公文包里抽出一份旧报告，“他曾在日本海军的一家采购机关工作，后来才开始经商。根据地方警察的记录，此人对德国舰船的出入港时间似乎格外感兴趣。”\n\n克拉默翻开报告，里面说中村曾多次出席日本商行和领事馆举办的宴会。他不仅与几名退役海军军官相识，还通过一家华人贸易行支付过数笔可疑款项。遗憾的是，报告中没有任何直接证明他从事情报活动的证据。至于那些收款人，也完全可能只是一个小小的中间人。\n\n“我们总不能因为一个日本人认识几个海军军官，就把他送进监狱。”克拉默说。瓦尔特耸了耸肩，他当然同意，但中村的活动值得关注。尤其是最近几起海上案件发生前后，有关商行的付款时间与部分船舶航线变更颇为接近。若这些交易仅仅属于普通商业活动，未免也太凑巧了一些。\n\n克拉默重新拿起那几张汇款凭证。他注意到其中一笔款项的收款人只留下了一个姓氏，另一笔则被转入了德华银行的特别结算账户。魏格尔提醒他，殖民地许多航运公司都会使用这种账户，因此未必有什么蹊跷。相比之下，倘若能够弄清中村究竟在同哪些人联系，也许更容易找到突破口。\n\n司法部门的一位同僚却已经失去了耐心。他坚持认为，现有材料足以要求中村接受正式讯问。毕竟只要人还在新加坡，调查团总有办法从他嘴里问出些什么。克拉默对此颇为犹豫：一旦惊动日本领事馆，这件事恐怕就不会再是一桩普通的刑事调查。\n\n他揉了揉发酸的眼睛。桌上的文件仍旧没有给出任何明确答案。一个可能替日本海军工作的商人，还有几笔说不清用途的汇款，跟那帮身份不明的收款人。倘若想把这些零碎东西变成能够呈交柏林的证据，他总得先决定从哪里下手。"
 GEA.527.a:0 "传唤中村，让他亲自解释这些账目"
 GEA.527.b:0 "把德华银行的账户全部查一遍"
 GEA.527.c:0 "弄清楚中村究竟在替谁办事"
 GEA.528.t:0 "意外的收获"
 GEA.528.d:0 "中村信夫过着死水一般的生活。连续一星期，调查组的便衣警察都只能报告那些毫无意义的琐事：上午九点到办公室，十二点半在日本商会用餐，下午拜访客户，偶尔去码头视察货物。克拉默开始怀疑，自己是不是把宝贵的调查经费浪费在了一个比那些外交部的人还要无趣的日本商人身上。\n\n转机发生在星期五晚上。中村照例来到港口附近的一家酒馆，与一名自称经营船用机械的日本人碰面。此前调查员已经注意到，此人每隔两周便从马尼拉来到新加坡，却从未购买任何机械。这次他带来了一只公文包，离开时却将它留给了中村。半小时后，坐在酒馆外的克拉默和其他专员一同在车里看到一名军港维修厂工作的德国技师也走进了酒馆。\n\n克拉默当即下令跟踪那名技师。第二天，特工在其住所附近发现了几份被丢弃的图纸草稿，涉及军舰无线电设备的维修情况。海军代表看完后脸色铁青，几乎立即就想派海军宪兵把那个蠢货拖进审讯室，还是奥托·魏格尔劝住了他：顺藤摸瓜，切勿打草惊蛇。接下来的几天里，调查团又截获了一封商业电报，其中用蹩脚的商品名称指代德国舰艇与海军设施。海因里希·瓦尔特对此极为兴奋，声称这终于证实了殖民政府对日本秘密活动的怀疑。但他没说自己为什么过去没能抓住他们。\n\n然而，真正让克拉默感兴趣的却是另一件事。中村曾要求一名航运代理搜集近期数起海上劫案的资料，包括受害船只的航线、货舱布置以及袭击者可能使用的船型。一些材料甚至涉及尚未公开的调查结果。但一个搞对德军事情报的日本人，为什么会如此热衷于研究南洋海盗？“或许他们正在替某些人收拾残局。”瓦尔特幽幽地说道。而魏格尔则仔细阅读了电报译文，指出其中一处措辞更像是在要求调查，而非汇报行动成果。克拉默不得不承认，日本人也可能只是在搜集德国殖民地的治安情报。不过至少如今，调查团几乎可以肯定自己撞见了一个真正的日本间谍组织。可窃取军舰图纸是一回事，策划海上劫案又是另一回事。克拉默尚无证据证明两者存在联系，偏偏柏林已经开始催促新的调查报告。\n\n回到办公室不久，这位调查组组长桌上摆着三份尚未签署的申请：继续追查日本人掌握的劫案资料，讯问涉嫌泄密的德国技师，或者审查中村的秘密账户。克拉默苦笑起来。他奉命来此调查海盗，如今却可能先破获一桩间谍案。"
 GEA.528.a:0 "顺着日本人的海上劫案档案追查下去"
 GEA.528.b:0 "先审问那名向日本人泄密的德国职员"
 GEA.528.c:0 "立即搜查中村的所有秘密账户"
 GEA.529.t:0 "旭日之下的阴谋"
 GEA.529.d:0 "搜查令获批的第二天，宪兵队就突袭了中村信夫经营的贸易行，在办公室暗柜里找到了缩微胶片、通讯密码及大量德国海军机密资料。中村试图跳窗自杀，却被挂在了外墙的栏杆上。海军代表认出了几份尚未公开的舰艇维修报告，兴奋得几乎忘记了调查团原本是来查海盗的。\n\n然而，真正引起弗里德里希·克拉默注意的，是中村保存的一份南洋航运调查报告。文件详细列出了多艘遇袭商船的航线、货物清单及事故经过，其中部分资料甚至早于殖民政府的正式公告。更令人费解的是，报告还收录了几名目击者尚未公开的证词。几处机密的的货物交接地点也罗列其中。面对质询，中村不得不承认自己替特高课搜集德国的军事与航运情报，却坚决否认参与任何劫案。他声称东京同样在调查南洋海盗，那些秘密资料正是为此搜集的。\n\n“所以你们搞来船舶航线和机密货物单，就为了帮老子抓海盗？”克拉默问道，随后一个掌掴抡在了囚犯脸上。中村试图解释日本情报机关为何关心德国航运安全，却越说越显得可疑。最后，他直接表示拒不合作并要求联系日本领事馆。奥托·魏格尔随手递来一份补充报告。中村的几名接头人曾在案件发生前后频繁更换身份，汇款也与日本控制的商行有所关联。海因里希·瓦尔特据此认为，东京很可能利用南洋走私网络策划袭击，再借助舆论抹黑德国殖民政府。尤其耐人寻味的是，几家外媒对德属东亚海上治安的猛烈批评，恰好引用过与中村所掌握资料相似的细节。\n\n克拉默仍然有所顾虑。调查团没有找到日本人直接指挥劫案的证据，而间谍活动本身也不能证明谋划海盗袭击。不过，事到如今这套解释似乎比任何其他假设都更加完整。最终报告只得谨慎地采用了“涉嫌组织或协助”的措辞，将日本情报网络与系列海上案件联系起来。柏林接受了调查结论。帝国政府向东京提出严正交涉，要求日本方面解释其秘密机关在德国殖民地的非法活动。殖民办公厅则宣布，新加坡总督府已充分履行职责，不必再接受进一步审查。卢克纳尔伯爵甚至亲自致电克拉默，感谢他替帝国澄清事实，并热情邀请他下次来远东时一同出海。\n\n回到柏林后，他还收到了海军部的一封感谢信，表彰调查团意外破获了一起严重的外国间谍案件。克拉默将信放进抽屉，心想这趟差事总算没有白跑。几天后，魏格尔收到一封来自新加坡的私人信件。伯爵对他的工作十分满意，还附上了一份为他安排的休假计划。魏格尔读完后将信纸锁进抽屉，继续起草殖民办公厅交给他的新任务。"
 GEA.529.a:0 "帝国终于查明了这场阴谋"
 GEA.530.t:0 "死人名单"
 GEA.530.d:0 "弗里德里希·克拉默决定从那份日本间谍名单入手。毕竟，既然新加坡声称掌握了这些人的姓名、住址和活动记录，那么调查团首先应该弄清他们是否真的存在。海因里希·瓦尔特对此颇为赞赏，甚至主动提出让殖民地情报机关协助核实。不过，克拉默婉言谢绝了。\n\n最初的调查进行得相当顺利。名单上的几名日本商人确实经常出入领事馆，也有人同日本海军的采购人员保持联系。奥托·魏格尔提醒克拉默，这些情况至少说明瓦尔特的情报并非空穴来风。然而，来自香港的一封回电很快令调查骤升疑窦：一名被列为重要嫌疑人的日本航运代理早在三年前便因肺病去世，而档案却记载他曾于上个月在新加坡与某个秘密联系人碰面。\n\n“死人怎么能自己跑来新加坡？”克拉默把电报拍到桌上，“除非瓦尔特先生认识的日本人有什么特别的本事。”海军代表在旁边慢悠悠的补了一句。接下来几份报告同样令人扫兴：一名嫌疑人压根没离开过横滨，另一人的所谓秘密住址竟然是一家德国商行的仓库。更令调查组困惑的是，几份目击记录似乎出自同一名线人之手，却被分别列作不同来源的独立情报。\n\n克拉默要求查看原始材料。瓦尔特起初以保护线人为由推辞，随后才送来几份删节过的报告。其中一份附有某起海上劫案的详细货物清单，甚至注明了船长在事后询问中提供的若干细节。问题在于，这些内容直到调查团抵达新加坡以后才被整理成正式笔录，根本不可能出现在那份据称数月前便已完成的情报报告里。\n\n克拉默没有理会魏格尔提出的所有可能性，而是直接向柏林申请调取殖民政府原先递交的报告副本，结果发现，当时的材料里既没有日本间谍名单，也没有任何关于这些秘密接头的记载。所有所谓的重大突破，都是在调查团决定追查日本情报机关之后才陆续出现的。当瓦尔特再次被传唤时，克拉默将两份文件摆到了他面前，要求他解释那些死去的嫌疑人和不合时序的证词。这位素来镇定的情报专员第一次显得有些慌乱。他反复强调自己只是负责汇总情报，真正的资料来自其他机关。至于究竟是谁提供的，他希望先同总督府商量。\n\n克拉默当场拒绝了这个请求。当天晚上，调查团封存了殖民政府有关日本情报活动的档案，并向柏林报告，有充分理由怀疑新加坡方面正在有组织地提供虚假情报。调查日本间谍的工作暂时搁置，新的调查对象变成了那些替调查团准备名单的人。"
 GEA.530.a:0 "有人看来要倒霉了"
 GEA.531.t:0 "导火索照会"
 GEA.531.d:0 "弗里德里希·克拉默原本以为，外交部的介入至少能让调查顺利一些。既然几名日本商人涉嫌参与南洋的秘密活动，让东京方面解释他们的身份，总比调查团逐个追踪那些真假难辨的商业关系来得省事，而奥托·魏格尔对此表示担忧。\n\n帝国外交部显然没有那么乐观。收到请求后，负责远东事务的官员要求足以支持正式交涉的证据。克拉默只得将手头整理的日本嫌疑人名单、商业电报及目击报告一并呈送柏林。几天后，德国驻日使馆奉命向日本外务省提出了初步质询。东京的回应来得很快，而且相当不客气。日本外务省否认有关指控，要求德国政府说明所谓秘密活动的具体时间、地点与涉案人员。日本驻新加坡领事馆还直接联系了几名受到怀疑的商人，提醒他们准备应对可能发生的调查。克拉默很快便发现，原本尚可秘密核查的人员网络如今几乎人人都知道自己上了德国人的名单。然而真正的问题并不在此。外交部的法律顾问在审阅材料时发现，几份所谓的截获电报缺少原始收发记录，部分目击证词也未注明取证人员。更令人尴尬的是，一份被列为重要证据的日文商业信函，其德文译本将普通的货运术语解释成了军事行动指令。\n\n“所以我们究竟是在这抓日本间谍，还是在给翻译上日语课？”一名调查组的外交部成员问道。瓦尔特坚持认为，这些问题只是情报工作的常见困难。而魏格尔也建议暂缓交涉。然而，克拉默已经收到了柏林的正式命令：调查团必须核实所有证据来源，任何未经证实的指控都不得再提交外交机关。\n\n此时，一名负责誊写情报摘要的殖民政府职员在询问中承认，所谓的日本秘密行动报告并非直接译自截获电文，而是由数份互不相关的材料拼接而成。至于其中涉及海上劫案的部分，则来自总督府另行送交的内部备忘录。克拉默将那份备忘录与原始案件记录放在一起，发现其中有几处细节竟比地方警察的正式调查报告还要准确。他要求查看备忘录的起草依据，却被告知相关材料已经丢失。\n\n两天后，克拉默向柏林发出了一封新的电报。他要求办公厅审查德属东亚殖民政府提交虚假证据、干预帝国调查的嫌疑。日本外务省仍在等待德国方面对先前指控作出解释。克拉默却已经没有心思关心东京了。"
 GEA.531.a:0 "这一切根本就是无用功"
 GEA.532.t:0 "不合作的嫌疑人"
 GEA.532.d:0 "中村信夫走进审讯室时，身后还跟着一位西装笔挺的律师。弗里德里希·克拉默对此并不意外，毕竟此人在新加坡经营多年，多少懂得如何应付警察。令他有些意外的是，中村并没有表现出丝毫紧张，甚至还礼貌地询问审讯结束后能否赶上下午的商会会议。\n\n克拉默没有理会这些废话。他将几份汇款凭证推到桌前，要求中村解释为何向身份不明的人员支付海外业务补助，以及他同几名日本退役海军军官之间的关系。中村承认那些款项确实出自自己的贸易行，但坚称只是商业佣金。至于海军军官，他反问克拉默，在新加坡做航运生意而不认识几个水手，难道是什么罪过？\n\n“那这些德国商船的航线呢？”克拉默问道。“怎么解释？”\n\n中村终于皱起了眉头。他从公文包里抽出一叠文件，交给自己的律师。那是几份来自航运保险公司的函件，要求中村协助调查近期南洋海上案件造成的商业损失。律师指出，德国船东同样会购买日本航运公司的资料，这些交易虽然不怎么体面，却并不违法。\n\n奥托·魏格尔提醒克拉默，中村仍然没有解释那些秘密联系人。克拉默于是拿出了海因里希·瓦尔特提供的情报摘要，其中一份称中村曾与涉嫌转运赃物的商船船长秘密会面。\n\n“有意思。”中村看完后突然笑了起来，“这位船长去年就已经死了。我参加过他的葬礼。”\n\n审讯暂时中止。调查员核对后确认，中村所言属实。更糟糕的是，瓦尔特的报告不仅记载了那次根本不可能发生的会面，还引用了一份据称来自日本商行内部的电报。中村的律师要求查看原件，克拉默却发现殖民政府提供的材料里只有德文译本，既没有原始电文，也没有截获记录。\n\n魏格尔建议暂时搁置这份证据。然而，中村的律师已经正式提出抗议，指控殖民政府故意干扰日本商人的合法经营。克拉默原本对此嗤之以鼻，直到瓦尔特被要求说明电报来源时，也无法给出一个令人满意的答复。\n\n当天傍晚，中村获准离开调查团办公室。克拉默则命令重新核查所有由殖民政府提供的日本情报材料，并向柏林申请调阅原始档案。他本想从中村口中问出几个秘密，如今却不得不先问问瓦尔特，那些秘密究竟是谁告诉他的。"
 GEA.532.a:0 "有人看来要倒霉了"
 GEA.533.t:0 "银行家的秘密"
 GEA.533.d:0 "德华银行新加坡分行经理阿尔贝特·施泰因显然不欢迎调查团的到访。弗里德里希·克拉默刚刚坐下，他便开始滔滔不绝地谈论银行保密义务、商业信誉，以及帝国在远东的金融利益。直到克拉默马上要拿出调查授权书拍到他脸上，这位经理才不情愿地叫秘书搬来了账簿。\n\n中村信夫的贸易行确实通过德华银行进行过几笔可疑汇款，但账目大多无可指摘。克拉默正为此感到失望，一名年轻调查员却发现，其中一家负责转账的航运代理商还与某家德国海事贸易公司有过频繁往来。该公司受到殖民政府担保，账面上却几乎没有正常经营收入，反倒不断支付船员薪金、燃料采购和船舶维修费用。\n\n“所以，日本间谍正在替我们的船只付钱？”克拉默问道。\n\n“恐怕不是，先生。”调查员尴尬地翻了翻账本，“我们弄错了两个账户的编号。日本人的款项早就结清了，这些钱来自另一笔拨款。”\n\n施泰因立刻表示，后者属于殖民政府的特别经费，银行无权说明其用途。奥托·魏格尔也提醒克拉默，许多涉及海军的付款都不能按照普通商业标准审查。然而，克拉默已经注意到那些船舶维修与燃料采购的日期，竟然与几起重大海上劫案相当接近。\n\n调查团随即向柏林申请核实。几天后，帝国财政机关的回电到了：有关公司并未列入正常的殖民地预算，所谓的海事特别支出也没有得到柏林批准。更麻烦的是，其中几笔款项的最终授权人，竟然是来自一名殖民政府的官员。\n\n克拉默再次召见施泰因。经理坚持自己只是遵照合法指示办理业务，至于那些船他一概不知。魏格尔试图把话题拉回中村的日本关系网，却被克拉默打断了。“魏格尔先生，我们似乎弄错了调查对象。”\n\n当天晚上，调查团申请封存有关账户，并调阅总督府的海事支出记录。克拉默将日本商人的账簿甩到一边，重新审视那些由德国政府支付的船员薪金。"
 GEA.533.a:0 "看来我们的钱花在了不该花的地方"
 GEA.534.t:0 "精心安排的汇款"
 GEA.534.d:0 "搜查中村信夫的秘密账户原本是一项相当简单的工作。克拉默已经获得柏林授权，几家银行也答应配合。调查组只需要弄清这个日本间谍如何获得资金，再将那些可疑的收款人逐一找出来就行。至少奥托·魏格尔是这么认为的。\n\n最初的发现确实令人满意。中村通过数家南洋商行收取汇款，再以商业佣金和咨询费用的名义将钱交给不同人员。其中一些款项最终流入德国船厂职员与港口工作人员手中。海军代表看过名单后大发雷霆，要求立即逮捕所有替日本人办事的混蛋。然而，负责查账的年轻司法官卡尔·迪特里希发现了另一件事。几笔被殖民政府列为海盗行动经费的汇款，并没有出现在银行提供的原始记录中。与之对应的收据倒是存在，只不过上面的账户名称和转账日期经过了修改。\n\n“也许是银行弄错了。”魏格尔建议再向地方机关核实。克拉默于是传唤了那家商行的会计。此人起初坚持所有款项都按规定入账，直到迪特里希拿出银行的原始凭证，他才承认，数周前曾有人要求商行补办几份旧交易的证明。来人声称这是为了协助帝国调查团核查日本人的非法活动，还带来了殖民政府签发的介绍信。\n\n“谁要求你们修改收款人？”克拉默问道。会计犹豫着翻开自己的记事本，报出了一个殖民地情报机关的办公室编号。\n\n事情突然变得难堪起来。调查团重新核查了资金报告，发现其中数笔日本人的秘密款项实际上根本不存在。其余交易虽然真实，却与海上劫案没有可证实的联系。有人把零散的日本情报经费和几张经过修改的商业收据拼凑在一起，试图让它们看上去像是一套完整的行动资金网络。\n\n魏格尔建议暂时不要扩大调查，免得影响已经取得的间谍案成果。克拉默却命令迪特里希继续核对那些介绍信的签发记录。第二天，殖民政府的档案管理员确认，相关文件全部出自总督府下属的特别办公室。克拉默望着桌上的汇款凭证，不禁想起自己最初来到新加坡时的任务。\n\n调查团随即向柏林报告了伪造财务证据的嫌疑，并申请对殖民政府的秘密情报经费展开审查。"
 GEA.534.a:0 "有“好心人”替人付账单啊"
 GEA.535.t:0 "不该说的别说"
 GEA.535.d:0 "海军技师汉斯·贝克尔被带进审讯室时，已经连续两天没有好好睡觉了。他原本以为自己只需要解释为何将舰船维修资料卖给外国商人，最多再被扣上个叛国贼的帽子。弗里德里希·克拉默却对他与日本人的交易细节格外感兴趣，尤其是那些涉及南洋航运的情报。\n\n“他们想知道我们的军舰什么时候出港，还有哪些船需要修理。”贝克尔揉了揉眼睛，“我确实给过他们几份维修报告，但那些东西在船厂里到处都是。我可没把什么舰队作战计划交出去！”\n\n“废他妈的话！说说跟他的这几次会面。”随后贝克尔承认，中村信夫的同伙曾经向他打听过几艘身份不明的运输船。那些船偶尔会在夜间进入军用码头，领取燃料和器材，却没有出现在正常的海军维修计划中。日本人似乎对这些船特别感兴趣，还为此额外支付过一笔报酬。“所以他们知道那些海上袭击？”奥托·魏格尔插话道。\n\n“不，先生。他们想知道那些船究竟是谁的。”贝克尔摇了摇头，“有个日本人还问我，是不是海军部瞒着柏林在南洋搞什么秘密行动。我告诉他，我只是个修无线电的，哪知道这些事情！”\n\n审讯结束后，克拉默要求海军代表核查贝克尔提及的船只。结果令人困惑：那些船确实使用过东亚分舰队的设施，但有关记录既不属于正常军事运输，也没有相应的海军部命令。几份燃料单据上只有几串特别授权编号。魏格尔认为，这些情况或许可以说明日本人正在侦察德国的秘密军事活动。克拉默却提出了一个更加令人不安的问题：如果日本间谍还在费尽心思弄清那些船只的身份，他们又怎么可能事先安排由这些船只参与的海上行动？\n\n当天晚上，调查团向柏林申请调阅总督府的秘密航运记录。至于贝克尔，他仍然需要为出卖军事资料接受审判，不过克拉默已经不再指望从这个可怜的技师口中问出什么日本海盗阴谋了。"
 GEA.535.a:0 "看来日本人也在调查同一件事"
 GEA.536.t:0 "第三份证词"
 GEA.536.d:0 "弗里德里希·克拉默把三份证词摆在桌上，已经看了差不多一个钟头。它们分别来自西贡、槟城和新加坡，记录了三名船员对不同海上案件的陈述。三个人互不相识，接受询问的时间也相隔数月，却不约而同地使用了同一个古怪的词汇来形容袭击者的船只。更巧的是，其中两份证词连标点和拼写错误都一模一样。\n\n“也许他们请了同一位翻译。”奥托·魏格尔默默说道。\n\n“那位翻译的工作效率可真够高的。”克拉默把眼镜摘下来，“能在三座城市同时替人做笔录。”\n\n魏格尔没有接话，只是建议调查团先去核实那些目击者的身份。克拉默同意了，不过他另外派了一名司法官去询问整理档案的秘书。令他意外的是，那位年轻职员对证词的内容几乎一无所知。他只记得几天前有人送来一批已经打好字的文件，要求调查团将它们同原有材料合并归档。\n\n“谁送来的？”\n\n“殖民办公厅的魏格尔先生。他说这是新加坡方面补交的调查资料。”\n\n克拉默回到办公室，重新核对了原始卷宗。那些地方警察最初提交的笔录虽然潦草，却并没有提到秘密海盗据点，也根本没指认什么日本商行。说来也巧，后来加入的摘要则恰好补齐了这些内容，甚至替调查团整理好了两套可供追查的嫌疑人名单。虽然这不一定意味着有人作假，因为地方政府经常会在事后补交材料，柏林的官员也习惯替海外同僚整理那些乱七八糟的报告。然而，克拉默还是想知道，为什么补充材料比原始证词详细得多，而负责誊写它们的人却不愿留下姓名。\n\n魏格尔在当天下午送来了三名证人的联络地址，并表示殖民政府愿意提供一切协助。克拉默向他道了谢，随后要求自己的秘书取来调查团收到的第一批文件。那些文件尚未经过任何人重新整理，甚至连装订线都没有拆开。\n\n他决定先看看，两套材料究竟有什么不同。"
 GEA.536.a:0 "把原始文件重新核对一遍"
 GEA.537.t:0 "办公桌的另一端"
 GEA.537.d:0 "调查团的办公室已经整整两天没有接待过外人了。弗里德里希·克拉默下令将所有补交的材料单独归档，要求调查员依据最初收到的原件重新整理案件经过。魏格尔对此表示不解，毕竟重新誊写数百页文件既耗时又费力，而柏林还在不断催促调查进展。\n\n不过，工作很快有了结果。一名司法官发现，部分地方警察的原始报告根本没有提及日本情报机关；另一些文件中出现的海盗团伙名称，则是在送达新加坡以后才被补入的。更令人困惑的是，几份所谓的秘密线人报告使用了相同的纸张和打字机字体，尽管它们据称出自不同地区的警察机关。\n\n“所以，我们到底是在干什么？调查打字机？”海军代表抱怨道。克拉默没有笑。他要求秘书查明这些文件何时送到调查团，又是谁负责接收。结果并不复杂：大部分补充资料都经过魏格尔之手，而他递交材料时使用的介绍信，则来自总督府的一名高级官员。\n\n克拉默请魏格尔到办公室解释此事。魏格尔显得十分坦然，表示自己只是替调查团联络殖民地机关，那些文件的真实性当然应该由原始提供者负责。克拉默接受了这个答复，接着问起他为何能够如此迅速地联系到各地警察、海军情报人员和港务官员。\n\n“我以前在远东工作过，先生。您知道的，这里办事多少需要一点私人交情。”这是魏格尔第一次在调查团面前明确提及自己的旧职。克拉默随即索取了他的人事档案，发现这位殖民办公厅的得力职员此前长期在德属东亚总督府任职，直到调查组筹备不久前才调回柏林。其调任申请由新加坡方面提出，并附有卢克纳尔伯爵亲笔签署的推荐意见。\n\n克拉默把档案放下，许久没有说话。他想起魏格尔过去的一举一动，以及每当案件遇到疑点时恰好送到的新线索。现在看来，这些事情或许并没有他先前认为的那么巧合。当天傍晚，克拉默向柏林发出一封加密电报，请求派遣独立调查人员接管有关证据，同时审查新加坡总督府与联合调查团之间的所有公务往来。魏格尔暂时被解除档案管理职责，殖民地机关则被禁止接触尚未公开的调查材料。"
 GEA.537.a:0 "看来我们从一开始就找错了方向"
 GEA.540.t:0 "失败者之家"
 GEA.540.d:0 "印度支那大起义留下的烂摊子，远比费迪南德·舍尔纳最初预料的还要难以收拾。前任总督威廉·海耶曾以铁腕统治与军事纪律为傲，然而，当越盟的武装人员突破一道道防线攻城拔寨时，东亚总参谋部却始终没能拿出一份切实可行的挽救方案。不断签发新的作战命令和零星部队的顽强抵抗并未能挽回这场惨痛失败。\n\n舍尔纳上任后做的第一件事，便是要求总参谋部提交完整的战役总结。堆积如山的文件很快占满了他的办公桌：不同部门之间相互推诿扯皮，而那些吃干饭的高级军官对自己为何未能尽责都有一套说辞。诺大的指挥部却没有多少人愿意承认自己应当为失败负责。\n\n这支军队毕竟继承着普鲁士总参谋部的传统。许多高级参谋出身科班，也曾在世界大战中服役，对于他们来说掌握动员系统、基层战术与战略规划都是基本素养。然而，多年的殖民地生活已经改变了他们。资历与私人关系获得晋升在东亚屡见不鲜，而另一些人则与地方行政机关和商界保持着密切联系，甚至能在调任命令下达之前便为自己找到新的靠山。至于那些在一线拼杀的年轻军官，往往因为缺乏资历而难以在会议上获得发言机会。\n\n舍尔纳对此极为恼火。他当然明白，殖民地的经济条件、兵力短缺与海耶留下的错误决策都应当为失败承担责任，但这些绝不能成为军官们推卸职责的理由。在他看来，东亚军官团如今最严重的毛病，就是太多人忘记了自己对皇帝和国家的职责而蝇营狗苟。为此，新任总督下令成立特别审查委员会，重新评估总参谋部所有高级军官的任职资格。几名资深参谋对此提出抗议，认为如此大规模的人事干预将破坏军官团传统的团结与相互信任。舍尔纳则立刻将他们开除军籍以作为自己的回答。不过，委员会很快遇到了第一个难题：面对一团乱麻的局势，究竟要从哪里先开刀？"
 GEA.540.a:0 "先把需要为剿匪失败负责的军官抓出来"
 GEA.540.b:0 "先清理那些吃干饭的废物"
 GEA.540.c:0 "服从才是关键"
 GEA.541.t:0 "绅士战争"
 GEA.541.d:0 "总参谋部的人事审查进行得并不顺利。费迪南德·舍尔纳原本以为，自己很快便能揪出一批尸位素餐的高级军官，然而摆在他面前的履历告诉他并非如此。许多人毕业于祖国最负盛名的军事院校，在世界大战中指挥过师级单位，最差的也都是团长一级。他们胸前的勋章也都是凭真正的战功换来的。\n\n问题恰恰出在这里。印度支那大起义期间，一名出身东普鲁士贵族家庭的师长曾拒绝对某个叛军藏身过的村庄实施报复性焚毁。他认为情报尚未证实而附近仍居住着大量平民，贸然行动只会让局势更加恶化。另有一名上校则反对将大批被俘人员塞进集中营等待死亡或是直接就地处决。两人的决定并非毫无军事根据，也得到了部分下属的支持。然而，在舍尔纳看来，这些顾虑给了越盟重新组织力量的时间，也让德军错失了数次彻底震慑地方抵抗的机会。\n\n审查委员会对此争论不休。几名服从舍尔纳的军官指责他们服从于无用而浮夸的战争规则，而明明早在世界大战中这种体面已经被碾碎过一次了。参谋们则愤怒地反驳，普鲁士军人的荣誉从来不意味着怯懦，滥用暴力也不能弥补军事指挥上的错误。有人甚至当面质问，难道德国军官经过数十年训练，最后竟要靠焚烧村庄和处决俘虏来证明自己的勇气？\n\n舍尔纳对这些争论早已失去了耐心。印度支那的灾难已经证明，帝国在远东面对的并非一场能够遵循传统战役规则的战争。叛军通过藏身丛林、混入村落来用游击战对抗德国人。如果每一次严厉处置之前都要顾及舆论与名誉，那么东亚的蛮子迟早会学会利用这些束缚。如今新总督面前摆着一份由数名贵族将领联名递交的抗议书。他们请求总督尊重军官团的传统，停止以所谓的政治坚定性审查职业军人的作战判断。信件措辞恭敬，却明确表示，他们无法接受将无限制的镇压视为军官晋升的必要条件。愤怒无比的舍尔纳将抗议书揉成一团扔进垃圾桶。这些人或许仍是德意志帝国的军人，但眼下他们已经不再适合留在东方。"
 GEA.541.a:0 "让那些老贵族滚回欧洲去"
 GEA.541.b:0 "保留一部分高级将领，撤换所有中低军官"
 GEA.541.c:0 "他们不愿动手那就由别人来做"
 GEA.542.t:0 "两面旗帜下的军官"
 GEA.542.d:0 "费迪南德·舍尔纳对东亚分舰队的耐心，比对总参谋部那些废物的耐心还要少上一些。至少陆军军官尚且承认总督对殖民地军事事务的最高权威，海军则恰恰相反。从青岛到新加坡，帝国的无敌舰队与海军基地始终维持着自己的指挥系统。舰长们通过海军渠道向上级报告，而岸防司令部习惯直接同舰队司令交涉。印度支那大起义期间，这些积弊暴露得尤为明显。\n\n当然，海军方面自有一套解释。他们指出，东亚分舰队必须同时维护德国在太平洋的海上交通，监视日本舰队的动向，并保护各地港口与商船。若凡事优先需要来自总参谋部与总督本人的批准，那么一旦舰队遇到紧急情况后果将不堪设想。舍尔纳承认这些观点有些许合理性，却无法接受海军将它们当成拒绝服从的理由。尽管德属东亚时常被人戏称为“拥有殖民地的海军”，但一旦战端爆发，任凭海军有再多舰队，在面对需要攻城拔寨或是浴血冲锋的关头也无能为力。眼下在他的规划中，东亚分舰队必须和他们的陆军兄弟一样被整合到同一个指挥体系中以应对未来的日本帝国南下。\n\n问题在于，东亚分舰队并非由总督一纸命令就能任意改组的地方驻军。海军军官的任免、舰艇编制和作战指挥权均牵涉帝国海军体系。舍尔纳若贸然插手，不仅会激怒分舰队司令部，更可能招来柏林的干预。几名参谋建议与海军部协商，建议重新划定殖民地作战时的指挥权限；另一些人则主张直接撤换那些在起义期间拒绝执行陆军请求的军官，借此迫使舰队服从。"
 GEA.542.a:0 "撤换那些不服从的军官"
 GEA.542.b:0 "尊重舰队的独立权，但战时听从总参谋部统一调遣"
 GEA.542.c:0 "增加造舰预算以达成妥协"
 GEA.543.t:0 "匿于阴影之人"
 GEA.543.d:0 "自世界大战以来，德国军事情报机关便在远东维持着一套庞大的秘密网络。昔日总参谋部第三b处的情报人员曾依靠商船、领事机构与海外侨民搜集协约国的军事情报，而随着战后阿勃维尔的扩张，远东的临时分部逐渐演变成遍布中国沿海、日本与南洋各港口的庞大情报网。远东阿勃维尔在此后的岁月里不断壮大。它既负责监视外国海军与驻亚洲的军事顾问，也搜集殖民地内部的政治情报，并通过地方线人追踪地方叛乱与外国情报机关的活动。然而，各地情报站逐渐形成了自己的工作习惯，而陆海军情报部门时常各行其是。\n\n印度支那大起义暴露了其中的严重缺陷。阿勃维尔此前并非没有收到越盟活动的警告，但零散的情报未能得到及时汇总，某些线人又因当地局势恶化而失去联系。等到叛军发动大规模攻势，送抵总参谋部的报告却仍然充斥着大量自相矛盾和似是而非的情报。而舍尔纳总督对此十分恼火。整顿阿勃维尔因此被提上日程。\n\n部分参谋主张彻底重组远东各情报站，并将其纳入统一的军事指挥体系。较为谨慎的官员则认为，大多数问题来自少数失职军官和过时的工作制度，只需撤换不称职者、改善各部门的联络，便足以恢复机构的效能。舍尔纳的几名亲信还提出了第三种方案：仿照帝国军中秘密警察的组织原则，建立直属总督的秘密野战警察机构，负责军事反间谍、内部监察以及对可疑军官的调查等职责。如此一来，阿勃维尔仍可继续经营海外情报网络，但总督也将拥有一套无需经过任何人审查，甚至柏林也将对其一无所知的秘密组织班底。"
 GEA.543.a:0 "彻底重组远东阿勃维尔"
 GEA.543.b:0 "撤换失职军官，完善既有制度"
 GEA.543.c:0 "组建直属总督的秘密野战警察"
 GEA.544.t:0 "懦夫"
 GEA.544.d:0 "印度支那的雨季把道路变成了一条烂泥沟。费迪南德·舍尔纳乘坐的军用轿车不得不几次停下，等待工兵将陷进泥里的卡车拖出来。车厢闷热得令人窒息，副官海因茨·韦伯上尉正低头翻阅前线送来的战报。\n\n车队经过一处被烧毁的村落时，领头的摩托车突然停下。道路前方出现了一个踉踉跄跄的人影。那是名德国士兵，制服被泥水浸透，左袖撕开了一道口子，钢盔不知丢在了哪里。他背上与手中空无一物，只顾埋头向前走，直到两名警卫拦住去路，才茫然地抬起头。\n\n“停车。”舍尔纳没什么感情波动的话语出口，司机随机踩下刹车。\n\n那名士兵勉强站直身体，向警卫报出了自己的身份：“203轻步兵师三团二营三连，中士克劳斯，长官。我们昨天遭到了越南人的伏击。”\n\n“你的枪呢？”韦伯询问道。士兵结结巴巴地解释，步枪在渡河时掉进了水里。\n\n“你的连队在哪里？”舍尔纳问道。\n\n“长官，我不知道。我们被包围了，所有人都在跑……”\n\n“我他妈没有问你这些屁事。我问的是，你为什么会一个人在这里。”\n\n士兵开始发抖。他试图解释自己受了伤，还说曾看见几名战友倒在林边。舍尔纳叫他把双手举起来。士兵迟疑了一下，照做了。那条被划破的袖子下面只有一道已经结痂的浅伤。\n\n舍尔纳拔出了手枪。\n\n在韦伯意识到发生了什么之前，枪声便在路旁响起。士兵惨叫着跌倒，双手死死抱住受伤的大腿。几名警卫下意识地端起步枪，随后又在认清开枪者后放下枪口。舍尔纳收回手枪，低头看了看地上挣扎的士兵。\n\n“现在你倒确实负伤了。”“吊死他。”\n\n他转身走向轿车，吩咐韦伯召集几名士兵，把逃兵吊在路边显眼的地方，让随后经过的部队看清他的下场。大汗淋漓的韦伯翕动着嘴唇站在原地片刻想说什么，最终还是仅仅敬了礼。两名警卫拖起伤兵，将他带向村口残存的一棵大树。那人仍在哭喊，反复说自己并不是故意逃跑。\n\n舍尔纳已经坐回车里。司机等他关上车门，才重新发动引擎。车队驶离时，韦伯仍留在后方监督行刑。不久后，他乘另一辆汽车追了上来，向总督报告命令已经执行。\n\n舍尔纳没有抬头，只是拍了拍坐垫，跟韦伯又说了什么。"
 GEA.544.a:0 "“下次出发前把它换成半履带车。”"
 GEA.545.t:0 "锁链犬"
 GEA.545.d:0 "卡尔·布伦纳下士已经三天没有睡过一个安稳觉了。\n\n三天前，他亲眼看见战地宪兵把同连的弗朗茨·米勒拖到公路旁。米勒在一次夜间巡逻后掉了队，第二天才连滚带爬地回到驻地。他不仅丢了步枪，磨破了靴子，脸上还带着伤。连长原本打算让军医检查他的情况，但那群链犬却抢先接管了此事。米勒被指控擅离职守，半个小时后便遭到枪决。\n\n如今，布伦纳自己也走在同一条公路上。\n\n他的连队在凌晨遭到越盟游击队伏击。第一轮枪声响起时，前面的卡车便被炸翻，紧接着两侧树林里响起了机枪声。布伦纳只记得自己拖着战友约瑟夫·克莱因爬进排水沟，又趁着烟雾逃出了伏击圈。克莱因的腹部被弹片划开，血浸透了制服，走了不到一公里便扑通倒地。\n\n直到中午，互相搀扶的两人才看见前方的呼啸而来的德军汽车。布伦纳连忙举手示意，然而司机脖子上的锁链狗牌让他的声音卡在了喉咙里。\n\n两名宪兵下车，要求他们报出姓名、番号和离队原因。布伦纳急忙解释伏击经过，又指着靠在肩上的克莱因，恳求他们把伤员送往野战医院。为首的宪兵上士却要求克莱因自己站直身体。\n\n克莱因尝试了两次，最后跪倒在路边。上士看了看他腹部的绷带，发现血迹已经干涸，便怀疑这不过是一处被夸大的轻伤。“你们挺能耐啊，”上士冷笑道，“一听见枪声就往后跑，到了我们面前却连站都站不起来。”\n\n布伦纳想起了米勒。他试图再次开口：“他的伤口真的...”话音还没落他就被另一名宪兵用枪托推到一旁。\n\n克莱因仍在不停恳求，而上士已经拔出了手枪。\n\n枪声响起后，布伦纳愣在原地。克莱因倒在公路旁，原先靠着他的那只手慢慢滑了下去。上士收起武器，让同伴把尸体拖离道路，又拿出笔记本记录两人的番号。\n\n“你还能走路，下士？”\n\n布伦纳点了点头。\n\n“很好。你的部队在北面，立刻归队。再让我在后方看见你，就按逃兵处置。”\n\n宪兵们登上汽车，沿公路继续向南驶去。布伦纳捡起步枪，开始向北走。树林里的枪声还没有停止。他不知道连队是否仍在原来的阵地，也不知道该向谁报告克莱因的死讯。"
 GEA.545.a:0 "他必须继续向北走"
 GEA.546.t:0 "重返印度支那"
 GEA.546.d:0 "印度支那的失利并非终局。舍尔纳要求总参谋部拟定收复失地的方案：是立即集结登陆部队，趁叛军立足未稳迅速反攻；还是充分协调陆海军，以周密的作战计划夺回主动；抑或先扩充军备生产，待物资齐备后再发动攻势？总督必须作出决定。"
 GEA.546.a:0 "迅速集结登陆部队，马上准备反攻。"
 GEA.546.b:0 "协调陆海军，制定周密计划"
 GEA.546.c:0 "我们需要积蓄实力..."
 GEA.547.t:0 "老熟人"
 GEA.547.d:0 "阮文平下班回家时，发现街角的杂货铺没有开门。\n\n这倒是一件稀奇事。铺子的主人陈德安已经在那里做了十几年的生意，无论刮风下雨，天刚亮时总能看见他坐在柜台后面，戴着那副镜腿用细铁丝缠过的眼镜，慢悠悠地整理香烟和火柴。街坊们都喜欢这个脾气温和的中年人。他几乎从不当面催讨顾客的赊账；孩子们拿不够钱买糖，他偶尔还会多塞上一颗。阮文平的妻子生病那阵子，家里的米也是从他那里借来的。\n\n铺门上挂着一把崭新的锁。隔壁的老妇人见阮文平停下脚步，便拉住他的袖子，低声告诉他，上午有几个德国宪兵来过，把陈德安连同店里的账簿一起带走了。据说有人举报他替越工分子传递消息，证据是几名经常出入铺子的年轻人最近在城外参加了叛乱。\n\n阮文平有些难以置信。陈德安跟半条街的街坊都有往来，甚至附近的德国士兵也常来买香烟。如果这都能算作勾结叛军，那么恐怕德国鬼子得把整条街都抓走。他本想再问几句，老妇人却朝街口看了一眼，匆匆回屋去了。\n\n走到市中心时，阮文平才知道陈德安去了哪里。\n\n广场上聚集了不少人，几名荷枪实弹的殖民军士兵正守着临时搭起的绞刑架。陈德安和另外六名被捆住双手的人站在台上，其中一名年轻人还鼻青脸肿的。一名德国军官正宣读他们的罪名：窝藏叛乱分子、协助非法组织、破坏治安、不一而足。轮到陈德安时，军官只念了他的姓名、住址，以及一句“涉嫌资助参加赤色匪徒叛乱活动”。\n\n阮文平挤在人群后面，看见陈德安依旧穿着上午开店时的那件灰色衬衫。他的眼镜不见了，一只鞋也掉了，正眯着眼睛朝下面张望。两人的目光似乎碰到了一起。陈德安张了张嘴，却没有发出声音。旁边的宪兵推了他一把，示意他站到指定的位置。\n\n军官念完判决，合上文件。几名士兵随即快步上前，将绳索依次套在犯人的脖子上。人群里有人开始哭泣，随即又被身旁的人捂住了嘴。\n\n阮文平低下了头，耳边只传来死囚嘶哑的呻吟。等他重新抬起眼睛时，行刑已经结束。领头的德国鬼子命令士兵维持秩序，宣布尸体将在广场上悬挂至次日，以示警告与惩戒。随后登上军车扬长而去。\n\n回家的路上，阮文平再次经过那家杂货铺。门仍然锁着，门边的小黑板上还写着今天的米价。柜台旁那块陈德安常用来给孩子们量身高的木板，从半开的窗缝里隐约可见。第二天早晨，阮文平的儿子问他，陈叔叔什么时候才会重新开店。他想了半天，只告诉孩子，以后不要再到那边去了。"
 GEA.547.a:0 "明天，广场还会有人经过"
 GEA.548.t:0 "无法拒绝"
 GEA.548.d:0 "黄文福已经在自己的办公室里等了整整两个小时。\n\n他的家族经营着西贡城外的一座碾米厂和两处仓库，雇用了两百多名工人。过去几年，德国鬼子曾数次要求他以低于市价的价格供应军粮，还希望长期租用他的仓库。黄文福拒绝了这些要求。这倒不是他讨厌德国鬼子，他对越工的解放理论也从不在意。只是因为德国鬼子开出的价钱跟明抢无异。\n\n如今，坐在他对面带着翻译的德国军需少校却显得十分和气。“...您的企业在这一带声誉颇佳。总督阁下希望您能在目前的紧急局势下，为帝国军队提供必要的协助。”少校将一份文件推到桌上。文件规定，米厂的生产转运从即日起接受军方监督，全部仓储设施暂由殖民政府接管。黄文福可以继续担任经理，但必须执行军需部门的配额，补偿金额则在战事结束后另行核定。\n\n黄文福读了两遍，才意识到自己几乎失去了企业的所有经营权。他勉强挤出笑容，解释说厂里还有私人订单，自己跟德华银行的贷款也尚未偿清。如果军方需要粮食，他很愿意按合理价格出售。\n\n“当然，当然。”少校点了点头，“我们也知道您过去对于政府需求存在一些异见。”他取出另一份档案，里面记录着黄文福拒绝军粮采购、反对仓库征用，以及在商会会议上批评殖民政府的言论。几处文字旁边已经被人用红铅笔画上了记号。\n\n“舍尔纳总督尤其关心那些未能充分履行帝国义务的企业，也不希望有人怀疑您与叛乱分子存在联系。您应该明白，东方这地界上也找不到比我国还优待企业的国家了。”黄文福死死盯着那份档案。他很想一口唾沫啐在这个德国人脸上，但他还是什么都没做。\n\n“那么，我是否可以先与律师商量？”\n\n“恐怕没有这个必要。征用令已经签发了。只要您愿意合作，经理的职位仍然属于您。”少校将钢笔轻轻放到合同旁边。"
 GEA.548.a:0 "“黄先生，签字吧。愿我们合作愉快”"
 GEA.549.t:0 "猎杀"
 GEA.549.d:0 "“阮先生，今天的天气不错啊！”\n\n阮安宁抬起头，向从门前经过的村民报以微笑。清晨的阳光正越过树梢，洒在村落狭窄的土路上，几个孩子追逐着跑向河边，远处传来妇人准备早饭的吆喝声。一切都是如此平静，以至于他几乎忘了自己仍处逃亡之中。自从越盟残部撤入丛林以来，这座偏僻的村庄便成了他们最后的容身之处。村民们并不怎么过问这些外乡人的来历，只是腾出几间屋子，分给他们一些粮食，偶尔还会招呼他们一起吃饭。\n\n几个月前，阮安宁还在庆祝印度支那终于摆脱德国人的统治。那时谁又能想到，胜利竟会如此短暂？德国人的反攻来得迅猛而残酷，那些从本土调来的大战老兵远非越盟仓促组织起来的民兵所能匹敌。更让他感到不安的是，就连刚刚入伍的德国新兵也与过去大不相同。昔日殖民军遭受些许损失便会溃散，如今那些年轻士兵却宁可死在阵地上也不肯后退。\n\n“您还要在这里住多久？”一个抱着柴火的年轻村民问道。阮安宁愣了愣，随后笑着摇头。他自己也不知道答案。越盟的领导层早已四散，联络员接连失踪，昔日的同志如今连一张可靠的地图都难以找到。也许他们再也无力组织下一次起义了。想到这里，他竟感到一丝宽慰。若能就此隐姓埋名，在这片远离战争的土地上度过余生，或许也不算太坏。\n\n远处忽然传来一阵低沉的轰鸣。\n\n阮安宁起初没有在意，直到那声音越来越近，连头顶的树叶都开始微微颤动。他抬头望去，几架飞机正从云层下方掠过，机翼上的黑色十字清晰可辨。片刻的错愕之后，他猛然明白了那些飞机的来意。阮安宁扔下手中的东西，转身朝同志们居住的屋子跑去。他张开嘴，拼命想喊出警告，却没有声音传出。"
 GEA.549.a:0 "一枚航弹精准的落在了他身后"
 GEA.550.t:0 "皇帝陛下的晚宴"
 GEA.550.d:0 "“哦，费迪南德，朕听说，你把东方那些蛮子收拾得服服帖帖了？”\n\n威廉二世饶有兴致地打量着面前的总督，示意他在餐桌旁坐下。年迈的皇帝仍保留着当年那副好胜的脾气，比起冗长的殖民地财政报告，他显然更喜欢听军官讲述远方的战绩。舍尔纳对此早有准备，他将印度支那如今的现状与对德国的顺从尽数道来，当然也自然少不了对自己残酷手段的小小隐瞒。皇帝听得津津有味，不时插上几句自己年轻时的往事，甚至谈起世纪之初送别远征军时那番匈人演说。\n\n“很好！朕当年就是这么告诫那些小伙子的。”老皇帝满意地放下酒杯，“德国人绝不能有一丝软弱与怯懦，尤其是在东方！”\n\n“这是自然，我的陛下。”\n\n待到皇帝兴致稍歇，这位军人总督便不动声色地将话题引向柏林的殖民部。“陛下，殖民办公厅那些文官似乎做事总是谨慎又死板。远东局势错综复杂又一日三变，一旦遇有不测，等到那些先生们商议出个结果，恐怕大错又将铸成...”\n\n“这些先生们确实有些过于谨慎了。”威廉二世嘟囔着，却并未立即作出承诺，最终老皇帝只是答应过问此事，又叮嘱他务必维护帝国在亚洲的威望。舍尔纳恭敬地接受了这番勉励，没有再追问下去。\n\n晚宴结束后，总督在宫廷侍从的陪同下离开了皇宫。威廉二世对这位精力充沛的军人印象不错，甚至打算日后再听听他的远东见闻。至于舍尔纳，他在回程的汽车上反复琢磨着皇帝的那几句话，心情也颇为愉快。"
 GEA.550.a:0 "我将大展拳脚"
 GEA.551.t:0 "人主"
 GEA.551.d:0 "“总督阁下，这份文件还需要您的签名。”\n\n舍尔纳头也不抬地接过副官递来的文件，在末页潦草地签下自己的名字。《特别治安法》的审批工作至此终于结束，宪兵队和殖民地警察将获得更为广泛的搜查、拘捕与戒严权限。副官收起文件，行了军礼，随即退出房间。舍尔纳靠在椅背上，摘下眼镜揉了揉鼻梁。官邸的落地窗外，新加坡港正沐浴在午后的阳光下。舍尔纳望着这一切，不禁想起了许多年前的自己。\n\n那时的他还只是巴伐利亚陆军里一个不起眼的少尉，跟随部队奔赴世界大战前线。他深一脚浅一脚地踩着战壕里的泥水，耳边响彻炮弹划过头顶时的尖啸，注视着那些被抬下阵地便再也没能回来的士兵。整场战争究竟会走向何方，他既无从知晓，也没有资格过问。舍尔纳曾经以为，只要自己足够勇敢，总有一天能得到应有的赏识。事实证明，他没有想错。\n\n战争结束了，德意志屹立不倒。舍尔纳一步步爬上军队的阶梯，从一名军官成为将军，又从将军成为统辖远东的总督。如今，再没有哪个团长能够随意呵斥他，也不必再等着某位高级参谋的命令。文件上他的一个名字就能让成千上万的士兵倾巢而出；一纸命令，整座城市都得按照他的意志行事。想到这里，舍尔纳的嘴角浮现出一丝笑意。\n\n一声悠长的汽笛将他的思绪拉回现实。舍尔纳重新戴上眼镜，起身走到窗边，俯瞰着这座帝国在东方最繁忙的港口。码头上飘扬着黑红白三色旗，满载货物的轮船正准备驶往世界各地。这里距离他当年服役的欧洲战场有数千公里之遥，甚至连空气都带着一种令他厌烦的湿热。但这一切又有什么关系呢？德国人在东方建立了自己的秩序，而他正是负责维持这份秩序的人。柏林那些先生们或许还会对他的命令指手画脚，但他们毕竟远在半个地球之外。\n\n舍尔纳将双手背在身后，又看了一会儿港口。费迪南德·舍尔纳早已不是当年那个在战壕里等待命令的小小少尉了。如今，在这片遥远的东方，他有自己的军队、官员，还有一整座殖民帝国听候差遣。\n\n德属东亚是他的王国。"
 GEA.551.a:0 "而他就是这里的主人。"
 GEA.552.t:0 "最后航程"
 GEA.552.d:0 "随着费迪南德·舍尔纳以铁血手腕碾碎了印度支那的叛乱，一直在香港和柏林的高级酒店里流连忘返的保大皇帝终于觉得，自己重返顺化紫禁城、继续享受高尔夫球与香车美女的时候到了。早已习惯了充当殖民当局橡皮图章的年轻君主甚至已经拟好了归政诏书，满心以为德国人会像从前一样，需要他来安抚民族主义者。\n\n然而，保大显然打错了算盘。在费迪南德·舍尔纳看来，过去阮氏皇朝的现任皇帝始终在民族主义者与德国人之间摇摆，虽然对德国人毕恭毕敬，但这位富有野心的年轻皇帝始终暗地里接收着安南民族主义者们的援助与支持。大量的民族主义者已经将保大这个傀儡皇帝视作越南民族解放的符号并加以追捧，而这无疑给德国军队的再征服埋下了隐患。很快，一份由舍尔纳亲自签发的机密手令便送抵了宪兵司令部——不是为了护送皇帝回銮，而是要以“暗通叛党、玩忽职守”的罪名，彻底从肉体上抹去这个旗号。\n\n幸运的是，这位在治国上毫无建树的皇帝，在嗅探危险和保命方面却有着惊人的敏锐。在德国野战宪兵的卡车包围他在西贡的临时行宫前三个小时，保大便通过花重金收买的法籍线人得到了风声。这位末代皇帝展现出了平生仅见的果决：他毫不犹豫地抛下了顺化的龙椅与满朝遗老，只带着几个贴身随从、情妇以及装满黄金和瑞士银行存折的皮箱，趁着夜色溜向了西贡码头。\n\n当德军宪兵带着装甲车包围行宫之时，保大，早已换上一身笔挺的法式白色西装，登上了正要起锚前往阿尔及尔的“阿拉米斯号”邮轮。站在头等舱的甲板上，这位失去皇冠的君主最后看了一眼正在被铁十字彻底笼罩的故土，随即转身走进船舱的赌场——毕竟，比起在顺化当一具体面的尸体，去地中海的阳光下当一名富有的法兰西流亡寓公，显然是个明智得多的选择。"
 GEA.552.a:0 "算他跑得快"
 GEA.553.t:0 "斩草除根"
 GEA.553.d:0 "随着越南工团主义者的再度败亡，舍尔纳率领德军重新占领了印度支那。然而，工团主义者的覆灭并不意味着越南民族主义运动的终结。趁着德国人尚未完全恢复殖民统治，吴廷琰与其弟吴廷瑈开始四处奔走，联合天主教徒、地主、旧官僚及各路反工团人士，试图建立一股独立于德国人与越工之外的政治力量，以换取德国人的妥协和更大的政治资本。盘踞湄公河三角洲的和好教与西宁地区的高台教武装也相继响应。尽管各方对越南未来的设想不尽相同，但他们至少有一点共识：越南不应再受外国人的统治。\n\n可惜，吴廷琰很快便发现，舍尔纳根本没有兴趣同他谈判。在这位新任总督眼中，挥舞红旗的工团匪帮与高喊民族独立的民族主义者并无区别，都是必须予以铲除的不安定因素。随着特别治安法的实施，德国宪兵与驻军开始大规模搜捕民族主义者，吴氏家族的政治组织被强行解散，而高台教与和好教的武装据点接连遭到清剿。尽管这些宗教团体凭借着手头的民兵武装负隅顽抗，但最终不过又是以数场大屠杀而结尾。\n\n眼见大势已去，吴廷琰与吴廷瑈只得躲进西贡堤岸地区的一座教堂，寄希望于通过投降保全性命。然而，德国外交部所作的人身安全保证最终成了一纸空文。兄弟二人不久便被发现死于押送他们的装甲运兵车内，而吴氏家族的其余成员也陆续遭到逮捕与处决。与此同时，针对高台教、和好教及其他民族主义团体的搜捕仍在继续。舍尔纳已经下定决心，既然德国人重新征服了印度支那，这片土地只能听命于他本人。"
 GEA.553.a:0 "绝不留下任何祸根"
 GEA.554.t:0 "焚尸"
 GEA.554.d:0 "德意志帝国重新征服印度支那以来，舍尔纳的血腥清洗已使越南各地笼罩在恐惧之中。成千上万的民众因涉嫌同情民族主义者或工团主义者而遭到逮捕，村镇被焚毁，寺院遭到搜查，就连素来远离政治的佛教僧侣也未能幸免。随着吴氏家族及其民族主义盟友遭到彻底铲除，总督府开始将矛头指向任何敢于质疑德国统治的社会团体。面对接连不断的逮捕和屠杀，西贡佛教界的长老们多次向殖民当局递交请愿书，恳求停止滥杀无辜。然而，正相反，参与请愿的寺院反而成为了宪兵重点监视的对象。绝望之下，一位德高望重的老僧决定以自己的生命唤醒世人对越南人民苦难的关注。\n\n那天上午，数百名僧侣身披袈裟走上西贡街头，在一处繁忙的十字路口诵经祈祷。老僧平静地坐在道路中央，双手合十，任由同伴将汽油浇在自己的袈裟上。随着火柴划过，烈焰骤然升起，而他仍保持着盘坐的姿势。围观的人群陷入震惊，有人跪倒在地，有人掩面哭泣，僧侣们则继续诵念佛经，试图用自己的身体阻止殖民地警察靠近。然而不久后，远处传来的履带声很快打破了这一切。奉命驱散示威者的德国正规军正以装甲车开道，沿街推进。面对挡在路中央的僧侣，无需任何命令，装甲车上的班用机枪即刻开火。枪声在街道两旁回荡，几名试图保护老僧的年轻和尚应声倒下，惊恐的人群四散奔逃，原本庄严肃穆的祈祷队伍顿时陷入混乱。\n\n舍尔纳本人随后乘车赶到了现场。他粗暴地推开试图向其解释情况的军官，径直走向燃烧中的老僧。此时火焰已经吞噬了那件袈裟，但老僧仍保持着盘坐的姿势，仿佛对周围的枪声与混乱毫无察觉。舍尔纳不耐烦地命令随从让开，随即亲自拔出手枪，朝着火光中的身影连开数枪，直至那位僧侣倒在地上。\n\n士兵们随即扑灭余火，将老僧的遗体连同其他遇难者一并运走。按照总督的命令，这些尸体没有被交还寺院，也不允许举行任何葬礼，而是直接送往附近集中营的焚尸炉处理。德国宪兵随后封锁了事发街区，搜缴目击者拍摄的照片，并逮捕了数名试图收殓死者的僧侣。到了傍晚，十字路口已被冲洗干净，附近的商铺也在军警的命令下重新开门营业。街面上的血迹逐渐消失，唯有空气中还残留着尚未散尽的焦味。"
 GEA.554.a:0 "连佛祖也救不了他们。"
 GEA.555.t:0 "忠犬"
 GEA.555.d:0 "即便在德属东亚最忠诚的本土合作者中，阮文心也是个相当特殊的人物。这位出身南圻的越南官僚早年曾是一名教师，后来投身殖民地行政体系，凭借对工团主义者与地下革命组织毫不留情的镇压，逐渐赢得了德国人的赏识。他在丐礼地区任职时所采用的严酷手段更为他博得了“丐礼之虎”的恶名，而随着他的势力逐渐向西贡扩展，人们也开始称其为“西贡之虎”。对于那些渴望将德国人赶出印度支那的民族主义者而言，阮文心无疑是个不折不扣的民族叛徒；但他本人对此毫不在意，甚至以自己对德意志帝国的忠诚为荣。凭借多年来为殖民政府效力的功绩，他最终还获得了梦寐以求的德国国籍。\n\n费迪南德·舍尔纳向来瞧不起印度支那人，对那些宣称愿意效忠帝国的本土官员尤其嗤之以鼻。然而，即便是这位以残酷无情著称的总督，也不得不承认阮文心确实有些本事。这个越南人不仅对工团主义者怀有近乎病态的仇恨，更熟悉南圻错综复杂的宗族、乡绅与秘密会社网络，知道该如何从当地人口中撬出德国宪兵想要的情报。更重要的是，阮文心从不试图向自己的德国主子讨价还价，也不曾以民族自治之类的荒唐要求浪费总督的时间。对于舍尔纳来说，一个如此识趣又能干的土著走狗，倒也值得破例赏赐几块骨头。\n\n经过一番考虑，舍尔纳决定任命阮文心负责殖民地秘密情报体系中的一部分本土事务，将地方线人、越南籍警探与针对地下工团组织的侦察工作交由他统筹。当然，总督绝无让一个越南人真正掌握帝国情报机关的打算，阮文心仍须接受德国安全官员的严密监督。但这位新上任的情报主管对此似乎并无怨言。毕竟，比起那些遭到清洗的民族主义者和革命分子，他已经得到了远超大多数同胞的待遇。至于舍尔纳，他终于找到了一条足够凶狠的猎犬。"
 GEA.555.a:0 "好狗一条"
 GEA.556.t:0 "葛亨隆夫人的末日"
 GEA.556.d:0 "随着德意志帝国重新征服印度支那，舍尔纳的清算很快便从战败的越工军队扩展到了曾经支持革命的地方商界。德国人开始大规模查封涉嫌资助越工的企业，没收商人的财产，并将其以叛国罪名送交特别军事法庭审判。在这些被捕者中，最引人注目的莫过于有着“葛亨隆夫人”之称的阮氏南。这位出身海防的女企业家经营着颇具规模的商业产业，曾为越工提供大量黄金、粮食与军需物资，甚至允许革命者在自己的庄园中藏身。她原本希望借此支持越南摆脱殖民统治，却不曾料到自己的慷慨最终会成为德国人索取她性命的罪证。\n\n德国宪兵在查封葛亨隆商号时逮捕了阮氏南及其儿子。军事法庭认定其子曾参加越工军队，阮氏南本人则因长期向越工提供资金与物资而被控资敌。尽管辩护者声称她只是一名出于爱国热情而支持民族独立的商人，但这套说辞反倒更成为德国人下定决心杀鸡儆猴的助推。总督决心把阮氏南及其他几个通敌大资本家处以极刑以警告那些曾经在革命与殖民政府之间两面下注的商界人士。在一场草草结束的审判后，阮氏南与另外几名被控资助越工的企业家被判处死刑，其名下的商号、仓库与地产则全部收归殖民政府所有。\n\n处决于数日后在西贡市中心公开进行。德国宪兵将囚犯押上临时搭建的断头台，在荷枪实弹的士兵监视下，阮氏南与其他几名商人相继遭到斩首。依照总督的命令，死者的遗体与头颅被倒吊而起留在广场上示众三日，任何试图收殓尸体的家属都将受到逮捕。阮氏南的儿子则被送往集中营，等待他的将是毒气或是子弹。随着消息传遍印度支那，昔日与越工保持联系的企业主纷纷争先恐后地向德国当局表明忠诚，还有人主动交出了曾经合作伙伴的名单。然而，他们很快便发现，舍尔纳并没有因为这些迟来的忠诚而停止清算的打算。"
 GEA.556.a:0 "已经为时已晚了"
 GEA.557.t:0 "征服秩序"
 GEA.557.d:0 "“赤匪已经被消灭了，可我们还是每天都在死人。”\n\n特雷司寇将一份伤亡报告撇到桌上。自德军重返印度支那以来，针对巡逻队的伏击、铁路爆炸与地方官员遇刺的事件便接连不断。舍尔纳草草翻过几页，便将报告扔到一旁。“所以呢？将军，你总不会建议我再把印度支那让给他们一次吧？”\n\n“我建议您别把整个印度支那都变成我们的敌人。”特雷司寇回答，“我们现在急缺行政人手和秩序警察。总不能每个村庄都派一个营过去。”舍尔纳冷笑了一声：“那些村长昨天向越工宣誓效忠，今天又对着我们的国旗鞠躬。你指望他们替德国人办事？”\n\n“当然不指望。所以我们才需要把可靠的人挑出来，剩下的交给宪兵处理。”特雷司寇停顿片刻，又补充道，“但如果每次遭到袭击，我们就把附近的村庄全部烧掉，那些原本只想安生过日子的农民迟早也会拿起枪。”\n\n“那么就该在他们拿枪之前，让他们学会害怕。”舍尔纳站起身，走向墙上的印度支那地图。“你我都接受不了再花十年时间同这些丛林里的蛮子徒捉迷藏的代价。为了尽快抽身，没有别的办法。”\n\n特雷司寇望着地图，沉默了一会儿。“至少让军方统一指挥这些行动。现在太多流氓和罪犯混进宪兵和军队，战场上扒一身死人衣服就敢带人下乡烧杀。我们至少要先把这帮败类清除出去，让乡村地区先安定下来，这样才能获得一点这些土著的忠诚。”\n\n舍尔纳转过头来，似乎终于对这个建议产生了兴趣。“我不需要他们的忠诚，将军。”"
 GEA.557.a:0 "“服从就够了。”"
#外交
 GEA.800.t:0 "八省联合摇摇欲坠！"
 GEA.800.d:0 "十年前，德意志帝国的远征军挫败了国民党的北伐，挽救了孙传芳摇摇欲坠的军阀政权，也为德国在中国的经济扩张扫清了道路。此后，在德国军火、贷款与顾问的扶持下，八省联合逐渐成为帝国在华利益最重要的保护者。从长江沿岸的工厂、矿山到纵横华东的铁路与港口，德国东亚总局的资本早已渗透进这片富庶土地的各个角落。作为回报，孙传芳得以依靠德械部队与南京的中央军维持自己的权威，尽管这位八省联帅对于日益膨胀的德国势力颇有怨言，但他毕竟清楚，没有德国人的支持，“笑面虎”的统治恐怕连一天都难以为继。\n\n如今，黑色星期一的风暴与联帅之死终于将这个外强中干的联盟推向了崩溃的边缘。长期以来依靠利益分配与德国援助勉强维系的各省督军，纷纷趁着南京政府财政窘迫之际另起炉灶。安徽督军陈调元已经公开举起反旗，麾下部队正向南京步步进逼；蛰伏闽赣山区多年的国民党赤匪也抓住机会发动全面起义，一举夺取了福建省，准备向江浙腹地继续进军。与此同时，山东的“狗肉将军”张宗昌亦在北方虎视眈眈，随时准备率领他的军队南下分一杯羹。曾经号称统辖东南八省的宁系，如今却连自己的心腹地盘都难以保全。\n\n对于德属东亚而言，八省联合的覆灭绝不只是又一场中国军阀的改朝换代。南京若落入敌手，德国企业在长江流域苦心经营多年的铁路、矿业与贸易特权便可能随之付诸东流；而一旦国民党人重新控制东南沿海，他们势必会将矛头指向德国租界与通用东亚公司的资产。更何况，日本人同样不会放过这个趁乱扩大在华影响力的机会。新加坡已经接到来自德国商会、驻华顾问与各地侨民的接连求援，要求帝国立即采取措施，以免十年来的经营成果毁于一旦。\n\n不过，危机之中也蕴藏着机遇。新僭主齐燮元及其部下如今比以往任何时候都更加需要德国的军火、资金与军事援助，而那些尚未明确表态的地方军阀也未必不能用适当的价码加以笼络。无论是向南京提供紧急军援，还是借机扶持更为听话的地方实力派，都足以让帝国在中国的影响力更进一步。十年前，德国人曾凭借远征军的刺刀决定了华东华南的命运；如今，又到了让这些中国军阀重新认识谁才是他们真正靠山的时候。"
 GEA.800.a:0 "如同十年前的远征一般"
 GEA.801.t:0 "德国向我们提供武器"
 GEA.801.d:0 "德属东亚政府代表德国承认了我们面临的严峻形势，并为我们提供了大量步兵装备以帮助我们为生存而战。但是，他们这么做肯定是为了在战后加强对我们经济的控制。"
 GEA.801.a:0 "除了接受，我们别无选择"
 GEA.801.b:0 "我们必须确保我们的独立！"
 GEA.802.t.ningxi:0 "八省联合幸免于难"
 GEA.802.t.shandong:0 "狗肉将军的南方凯旋"
 GEA.802.t.anqing:0 "投机者的胜利"
 GEA.802.t.leftkmt:0 "赤色浪潮席卷华东！"
 GEA.802.d.ningxi:0 "南京传来的消息终于让我们松了一口气。在经历了数月的血腥内战后，齐燮元领导的宁系军阀终于击败了来自安徽、福建与山东的敌人，重新确立了对华东各省的控制。孙传芳留下的庞大政治遗产虽然在黑色星期一的冲击下分崩离析，但这位昔日联帅最为倚重的副手，最终还是凭借手中的精锐德训部队与德国军事顾问的协助，保住了南京的统治权。至少对于帝国而言，这场令人忧心忡忡的危机总算有了一个还算说得过去的体面结局。\n\n齐燮元向来是八省联合内部最坚定的亲德派之一，或者按照中国人们的说法，叫做“卖国贼”之一。从当年批准上海的德国商业特权，到协助镇压1932年的革命骚乱，他始终明白德国主子的军事援助与经济投资对于维系南京政权的重要性。如今，他比过去更加离不开德国主子的支持。连年的战乱已经使江南经济遭受重创，各省督军的忠诚更是难以保证，而德国银行、企业与军事顾问恰好能够为新生的宁系政权提供维持统治所必需的一切。当然，齐燮元也绝非甘愿任人摆布的傀儡，他同样希望借助这场胜利建立起真正属于自己的权力基础。\n\n无论如何，南京仍然掌握在我们的朋友手中，长江沿岸的德国工厂与铁路也不必立即面对遭到没收的危险。新加坡已经向齐燮元致以公开贺电，并声明称希望与新任联帅重新商讨“华东未来的经济重建与投资计划”。对于德国在华利益而言，八省联合的内战或许是一场不幸，但它同样证明了一件事：只要南京的军阀还需要我们的钱和枪，我们便依然有能力左右中国东南部的命运。"
 GEA.802.d.shandong:0 "谁能想到，最终坐上南京交椅的竟会是恶名昭彰的“狗肉将军”张宗昌。这位以贪婪、荒唐和反复无常闻名的山东军阀，趁着八省联合分崩离析之际率军南下，竟然接连击败了孙传芳的旧部与其他争夺华东的势力，将昔日的八省联合首府收入囊中。对于那些仍然记得十年前孙传芳与张宗昌争夺江苏的德国官员而言，这场胜利尤其令人啼笑皆非。当年被赶回山东的狗肉将军，如今竟堂而皇之地以征服者的姿态重返南京，而曾经不可一世的南直系军阀却已成了他的手下败将。\n\n张宗昌的胜利显然不能令德国商界感到安心。这位山东督军人送外号“三不知将军”：不知兵有多少，不知钱有多少，不知老婆有多少。此人虽然不乏军事才能，却也素以挥霍无度、军纪败坏与朝秦暮楚著称。他麾下的军队成分复杂，所到之处往往伴随着横征暴敛，而张宗昌本人更与北方的奉系、日本人以及山东的一贯道势力保持着千丝万缕的联系。倘若这个贪得无厌的家伙将南京的德国企业视作填补军饷的金库，帝国在华东的商业利益恐怕又将迎来一场灾难。更令人不安的是，张宗昌如今已不再是那个只能困守山东的地方军阀，手握江南财赋的他或许会生出更大的野心。\n\n不过，华东监事会的部分官员与通用东亚公司的董事会倒没有如此悲观。毕竟，张宗昌虽是个毫无原则的投机分子，却也绝非不可打交道之人。德国人过去曾经在青岛见识过他的胃口，只要能够提供足够的军火、贷款与利益保证，这位狗肉将军未必会拒绝来自帝国的友谊。眼下最重要的事情，便是赶在其他列强之前派遣代表前往南京，弄清楚这位新主人究竟想从德国人手中得到些什么。"
 GEA.802.d.anqing:0 "最令德意志担忧的消息终于从南京传来。安徽督军陈调元领导的新皖系军队已经赢得了八省联合内战，彻底击垮了孙传芳旧部的抵抗。十余年来，德国人依靠贷款、军事援助与商业特权在华东建立起来的政治秩序，如今竟败在了昔日八省联合自己的督军手中。随着新皖系部队进入南京，街头随处可见欢迎陈调元的民众，而长期受到南京政权压制的反租界团体，更将这场胜利视作中国摆脱外国经济控制的第一步。\n\n早在孙传芳统治八省联合期间，这位投机军阀便公开反对南京对德国资本的依赖，并拒绝让通用东亚公司的投资深入自己的安徽地盘。他凭借这种立场赢得了民族主义者、地方商人与部分左派团体的支持，最终使反租界运动成为新皖系崛起的重要力量。如今，陈调元已经成为这些人心目中反抗外国干涉的英雄，但这份荣耀同样使他陷入了两难境地。倘若他继续容忍德国企业享有过去的种种特权，支持他夺取南京的激进分子势必大失所望；可若真要将德国资本逐出华东，他又必须面对战后重建所需的庞大资金缺口。\n\n对于德属东亚来说，陈调元的胜利意味着我们必须重新考虑在中国的政策。与国民党的革命者不同，这位新皖系领袖本质上仍然是依靠军队立足搜罗权力与财富的短视又投机的旧式军阀。他或许厌恶德国人在中国的特权，但在现实的压力与财政危机面前，这位口口声声捍卫民族利益的“青天老爷”，也许在背后也会与各路洋人勾兑利益。新加坡已经开始讨论是否应该以新的贷款和贸易协定试探他的态度，只是那些在南京街头高呼驱逐外国人的民粹示威者，恐怕不会如此轻易地接受任何妥协。"
 GEA.802.d.leftkmt:0 "十年前，德意志帝国的远征军曾经帮助孙传芳击败国民革命军，使国民党的北伐大业功亏一篑。当时的德国军官们无不相信，这场胜利已经彻底埋葬了中国革命者的野心。然而，就在黑色星期一引发的八省内战中，那些曾被赶入闽赣山区的国民党残部竟然卷土重来，并最终攻入南京，结束了南直系军阀对华东长达十余年的统治。昔日被迫流亡海外的国民党领袖纷纷返回中国，青天白日旗重新飘扬在南京城头，而孙传芳与德国人苦心维持的八省联合，则已经彻底成为了历史。\n\n国民党左派的胜利无疑是对帝国远东政策的一记沉重打击。这些革命者既没有忘记十年前德国干涉北伐的旧恨，也没有原谅1932年上海起义遭到的血腥镇压。在他们的宣传中，德国人不仅是军阀统治的幕后支持者，更是长期掠夺中国财富、阻碍国家统一的帝国主义列强。随着国民革命军夺取华东的铁路、港口与工业中心，德国企业赖以经营的旧有特权正面临前所未有的威胁。驻华商会接连向总督府发来抗议与求援，而德国东亚总局的董事们更是忧心忡忡，担心自己在中国经营多年的产业将被革命政府悉数收归国有。\n\n更令人不安的是，南京的新主人并不打算满足于统治东南数省。国民党人已经公开宣称，他们将继承孙中山未竟的革命事业，继续向北方军阀发动战争，直到整个中国实现统一。若是放任这个与国际工团主义运动关系密切的政权继续壮大，德国在华的一切既得利益都可能岌岌可危。"
 GEA.802.a:0 "祝贺我们的齐大帅凯旋！"
 GEA.802.b:0 "不过是一个土老帽的意外之财"
 GEA.802.c:0 "投机者抑或是野心家？"
 GEA.802.e:0 "十年经营一朝倾覆..."
 GEA.803.t:0 "来自德国银行的贷款"
 GEA.803.d:0 "德属东亚的代表向我们递交了一份贷款协议。德国银行愿意为本政权提供周转资金，以换取在地方经济中更大的活动空间。我们可以选择短期、中期或长期贷款，但到期后必须按约偿还本金，贷款期间也需要维持专门的偿债安排。"
 GEA.803.a:0 "短期借贷"
 GEA.803.b:0 "中期借贷"
 GEA.803.c:0 "长期借贷"
 GEA.804.t:0 "华东贷款遭到赖账"
 GEA.804.d:0 "[FROM.GetNameWithFlag]已经公开拒绝偿还德国银行的贷款，并单方面撕毁了此前的信贷协议。银行与商会要求总督采取行动，以免其他地方政权争相效仿。军事顾问正借保护债权之名扩大活动，而对这个政权发动政变的准备，也将比过去更容易获得政府上下支持。"
 GEA.804.a:0 "他们会为此付出代价"
 GEA.805.t:0 "德国人策划政变"
 GEA.805.d:0 "德国银行、地方商人和军中的亲德军官已经串联起来，要求本政府交出权力。德属东亚的代表声称，只有由亲德人士主持的新政府才能恢复秩序、保障债权与外国投资。接受条件意味着沦为德属东亚的附庸；若要尝试反抗德国人的无耻行动，我们就必须做好准备承受未来可能的军事报复。"
 GEA.805.a:0 "我们别无选择"
 GEA.805.b:0 "让德国佬见鬼去吧"
 GEA.806.t:0 "帝国公约的邀请"
 GEA.806.d:0 "德属东亚的代表向我国递交了一份正式邀请，希望我们加入德国领导的帝国公约。他们声称，面对南亚日益动荡的局势，与德国及其盟友合作能够保障我国的安全与独立。我们是否应当接受这份邀请？"
 GEA.806.a:0 "加入帝国公约。"
 GEA.806.b:0 "我们将保持独立自主。"
 GEA.807.t:0 "来自太平洋彼岸的邀请"
 GEA.807.d:0 "德属东亚的代表向我国递交了加入帝国公约的正式邀请。他们强调，夏威夷位于太平洋航线的枢纽，若与德国及其盟友合作，就能获得更可靠的安全保障。然而，接受邀请也意味着卷入德国的全球战略。我们应当如何答复？"
 GEA.807.a:0 "加入帝国公约。"
 GEA.807.b:0 "夏威夷将自行决定自己的命运。"
 GEA.808.t:0 "德属东亚请求仲裁"
 GEA.808.d:0 "我们在远东的殖民政府又向我们发来了请求，只不过这一次不是什么军援求助，而是希望我们能够为他们做出仲裁，逼迫荷兰，我们的盟友与邻居割让出他们在东印度的殖民地。帝国政府中对这件事的讨论分为了两派：总参谋部与一些激进派政客认为我们不能完全信赖那帮荷兰人，让帝国的忠心耿耿的殖民政府统合东亚的资源才能更好的应对来自旭日的威胁；但外交部与联邦议会大多持反对意见，他们认为，这样很有可能会使帝国公约内部出现裂痕，进而严重影响我们的外交战略，同时这也很可能迫使荷兰走向德意志帝国的对立面，这对我们来说同样是不可接受的。最终，皇帝陛下做出了他的决定..."
 GEA.808.a:0 "通知外交部，让他们照会荷兰大使馆。"
 GEA.808.b:0 "他们还嫌帝国的麻烦不够多是吗？"
 GEA.809.t:0 "德意志帝国的仲裁提案"
 GEA.809.d:0 "近日德意志帝国向我们发来了一份仲裁提案，在我们的政府中激起了轩然大波。在提案中他们要求我国将东印度的所有殖民地全部移交给他们的东亚殖民政府。在政府内部，这份文书激起了绝大部分政客的愤怒，而军队上下则对此持悲观态度。他们认为以如今的荷兰军事力量，根本无法对此做出任何强硬的回击。我们的态度是什么？"
 GEA.809.a:0 "我们如今已势单力薄，只能接受..."
 GEA.809.b:0 "这是对我国的巨大的外交羞辱！"
 GEA.810.t:0 "德国拒绝仲裁"
 GEA.810.d:0 "看起来如今的德意志帝国已经软弱不堪，而皇帝陛下也因为年事已高而丧失了雄心。我们的仲裁请求竟然遭到了拒绝，这无疑是对我们的彻底否定与警告。但尽管如此，这一切仍有转机。只要我们能够以绝对优势的军力快速摧毁荷属东印度的抵抗并实现完全占领，帝国政府也绝不会因此而责备我们，至于荷兰，他们也不可能从本土调集足够多的增援过来，这样我们仍旧能够拿下全部的东印度领地。现在，总参谋部正在讨论着作战方案，而一切都取决于我们的总督[GEA.getleader]的决定。"
 GEA.810.a:0 "那就如此吧。"
 GEA.810.b:0 "山高皇帝远..."
 GEA.811.t:0 "荷兰拒绝仲裁结果"
 GEA.811.d:0 "荷兰政府在今日对我们发出了言辞激烈的外交抗议，声明我们的仲裁提案完全是不可理喻的外交羞辱。如果德国仍旧保持这种不友好的态度，荷兰将考虑脱离中欧合作项目，并计划与德意志帝国断交。尽管这份声明在我们看来也是严重的外交羞辱，但政府中的绝大多数官员都对此有着心理预期，外交部的一些人更是在仲裁要求发给荷兰大使后就认为最后一定是这种结果。如今我们已经做到了我们所承诺的，但东亚殖民政府仍没有收到消息。我们应当如何通知东亚殖民政府，是息事宁人，还是通知他们准备更激进的行动？"
 GEA.811.a:0 "通知东亚那边，我们已经尽力。"
 GEA.811.b:0 "通知东亚那边，准备进攻计划吧。"
 GEA.812.t:0 "仲裁提案被拒绝"
 GEA.812.d:0 "我们的仲裁请求竟然遭到了拒绝，而我们的祖国竟然通知我们接受现状。但尽管如此，这一切仍有转机。只要我们能够以绝对优势的军力快速摧毁荷属东印度的抵抗并实现完全占领，帝国政府也绝不会因此而责备我们，至于荷兰，他们也不可能从本土调集足够多的增援过来，这样我们仍旧能够拿下全部的东印度领地。现在，总参谋部正在讨论着作战方案，而一切都取决于我们的总督[GEA.getleader]的决定。"
 GEA.812.a:0 "那就如此吧。"
 GEA.812.b:0 "山高皇帝远..."
 GEA.813.t:0 "仲裁提案被拒绝"
 GEA.813.d:0 "我们的仲裁请求竟然遭到了拒绝，但我们的祖国也对此愤怒不已。由于欧洲的紧张局势，帝国政府通知我们无法直接对荷兰本土发动军事进攻，但他们暗示我们帝国将会支持我们的对荷属东印度的军事行动。这无疑是给我们打了一针强心剂。现在万事俱备，只差最后决定了..."
 GEA.813.a:0 "通知总参谋部，按照原定计划准备进攻。"
 GEA.814.t:0 "黑色星期一袭击通用东亚公司！"
 GEA.814.d:0 "黑色星期一的灾难显然没有止步于德意志帝国的本土。随着柏林金融市场的崩溃，这场经济危机已经迅速蔓延至中国，而我们在华最大的商业伙伴——通用东亚公司，如今也陷入了前所未有的困境。长期以来，这家庞大的企业集团凭借德国资本与八省联合的支持，几乎垄断了华东地区的重要铁路、矿业和工业投资。然而，随着德国银行纷纷收紧信贷，中国军阀政府又无力偿还积欠的贷款，通用东亚公司的资金周转停滞，原本的对华建设计划也不得不无限期暂停。\n\n更令人担忧的是，曾被视作德国在华金融霸权象征的德华银行，如今竟也徘徊在破产边缘。对于德属东亚而言，这绝非一场可以隔岸观火的金融灾难。殖民地的贸易航运与信贷业务早已同中国市场紧密相连，通用东亚公司的困境正在迅速波及我们的银行、港口与出口企业。倘若德国在华的经济体系真的就此崩溃，那么德属东亚恐怕也无法独善其身。"
 GEA.814.a:0 "啊？你也是？"
 GEA.815.t:0 "德国企业逃离八省联合"
 GEA.815.d:0 "随着八省联合陷入内战，德国人已经失去了对中国还能维持现状的信心。尽管齐燮元保证在他胜利后将会继续支持德国的利益，但我们对通用东亚公司及其重要的租界城市能在中国生存下来的信任正在迅速消失。"
 GEA.815.a:0 "娘希匹，有点信心好伐！"
 GEA.816.t:0 "通用东亚公司保持警惕……"
 GEA.816.d:0 "随着宁系军阀集团的彻底覆灭，德国在华影响力的篇章似乎遭遇了重大挫折。我们正竭力在租界内收容流亡的南京政府人员，但失去主要中国盟友的残酷现实仍令人难以接受。尽管如此，通用东亚公司仍保持高度警惕，德属东亚当局正严密监控因八省联盟瓦解而新崛起的割据势力。"
 GEA.816.a:0 "至少我们还有青岛"
 GEA.817.t:0 "德国企业重返中国"
 GEA.817.d:0 "随着宁系军阀集团的存续，中国商界的信心正逐步恢复。尽管通用东亚公司在此次危机中遭受重创，却将其视为汲取教训的契机，意图趁南京政权虚弱之机巩固德国利益防线，为应对未来变局未雨绸缪。"
 GEA.817.a:0 "一切返回正轨"
 GEA.818.t:0 "与德属东亚的联系"
 GEA.818.d:0 "鉴于当前与德意志帝国的友好关系稳固，德属东亚已着手支持我们初具雏形的海军建设。尽管德方的动机无疑完全出于实用主义考量，但其提供的援助对我们自身的存续发展同样裨益良多。德国工程师主动提出向我国船坞提供新型舰艇设计方案，另有一项提议是常驻海军武官以进一步训练我国海军部队。"
 GEA.818.a:0 "我们会采用他们的轻型舰船设计"
 GEA.818.b:0 "我们可以利用他们的战列舰设计"
 GEA.818.c:0 "永久海军专员或许更好"
 GEA.820.t:0 "与帝国公约谈和"
 GEA.820.d:0 "我们英勇的将士与舰队将德军赶出了大洋洲，现在我们有了谈判的底气，可以用一纸合约同帝国公约换来其热带领土了。那么，是要继续与德帝的斗争，还是实现和平，巩固新得的土地呢？"
 GEA.820.a:0 "不到柏林誓不罢休！"
 GEA.820.b:0 "现在就挺好，谈和吧"
 GEA.821.t:0 "对华远征十年记"
 GEA.821.d:0 "世界大战的胜利彻底改变了德意志帝国在远东的地位。随着法国在印度支那的殖民地被德国接收，英国在亚洲的霸权亦日渐衰落，柏林终于获得了将自身影响力扩展至整个东亚的机会。德国不仅继承了法国在华的部分租界与商业权益，还凭借青岛以及印度支那的港口和海军基地，建立起支撑远东扩张的军事与贸易网络。然而，中国本身仍深陷军阀混战，各省督军拥兵自重，北京政府号令不出京畿。对于德国人而言，这片资源丰富而又四分五裂的土地，既意味着巨大的商业利益，也意味着难以预料的政治风险。\n\n最初，柏林并不打算过度卷入中国军阀之间的纷争。德国商人与银行家更愿意依靠贷款、铁路投资和租界贸易获取利益，而非让帝国士兵替中国督军争夺地盘。然而，国民党的北伐战争最终迫使德国放弃了这种谨慎战略。随着受到第三国际援助的国民革命军向长江流域推进，德国在华的投资与特权面临着遭到推翻的危险。1926年至1927年间，帝国派遣远征军协助吴佩孚、孙传芳等直系军阀击败国民党，并帮助北京方面重新确立了对中国的名义统治。国民革命的失败不仅保住了德国的经济利益，更使柏林成为中国政治中最具影响力的外国势力之一。此后，在德国的支持下，清王朝得以复辟，直系军阀则继续掌握着帝国的实际权柄。\n\n然而，德国的胜利并不意味着它能够为所欲为。1928年的上海国际会议确立了租界共管与贸易机会均等的原则，限制了德国独占中国市场的野心。与此同时，掌握北京政府实权的吴佩孚也开始反对继续向外国人出让特权。面对北方日益强硬的态度，德国人转而将目光投向长江以南的孙传芳。为了维持八省联合相对于北京的自治地位，这位南京联帅不得不依靠德国的贷款、军火与军事顾问，而通用东亚公司则通过一系列非正式协议，取得了沿海港口、铁路、矿山与工业企业的经营权益。这些交易既规避了部分国际条约的限制，也使德国资本逐渐渗透进八省联合的行政与财政体系。\n\n这套政策为帝国带来了丰厚的回报，却也种下了难以忽视的祸根。德国资本的扩张引起了中国民族主义者的普遍反感，1932年的上海起义更让殖民官员领教了反帝运动的威力。尽管孙传芳在德国人的协助下成功镇压了叛乱，国民党残部仍然盘踞在闽赣山区，等待着卷土重来的时机。与此同时，北方的奉天军阀在日本扶持下虎视眈眈，吴佩孚与孙传芳之间的矛盾也始终未能解决。柏林虽然希望维持一个名义统一、实际上由各派军阀相互制衡的中国，却越来越难以控制自己亲手培植的地方势力。\n\n如今，随着华东局势风云变幻，德国在华政策正面临自北伐战争以来最严峻的考验。对于德国而言，中国不仅是一块供德国商人牟利的市场，更是维护远东霸权、遏制日本扩张的重要屏障。无论未来如何发展，德国都不能轻易放弃过去十余年在中国取得的一切。"
 GEA.821.a:0 "在中国的事业绝不能半途而废"
 GEA.822.t:0 "德国人发来最后通牒"
 GEA.822.d:0 "德属东亚总督府向北京发来了一份措辞强硬的外交照会，要求我们撤销针对德国资本的限制，重新开放华北的铁路、矿业与工业投资，并保障德华银行及通用东亚公司此前享有的经营权益。德国人警告称，倘若北京拒绝合作，帝国将重新考虑对我国政府的财政与外交支持。我们究竟应当接受这些条件，还是拒绝德国人对华北经济的进一步干涉？"
 GEA.822.a:0 "允许德资重新进入华北"
 GEA.822.b:0 "操你妈，滚！"
 GEA.823.t:0 "北京政权允许德资重返华北"
 GEA.823.d:0 "北京政府最终接受了我们的要求，同意撤销针对德国企业的部分限制措施，并恢复德华银行与通用东亚公司在华北的投资及经营权利。尽管吴佩孚及其幕僚对此颇为不满，但他们显然不愿冒险失去德国的财政与外交支持。如今，帝国资本终于可以重新进入这片广阔的市场。"
 GEA.823.a:0 "他们还算识时务"
 GEA.824.t:0 "北京政权拒绝！"
 GEA.824.d:0 "北京政府断然拒绝了我们的最后通牒，宣称华北的经济事务应当由中国人自行决定，并谴责德国试图通过金融与外交压力干涉其内政。吴佩孚显然已经不愿继续接受帝国对华北经济的指导，我们此前所作的外交努力也因此付诸东流。"
 GEA.824.a:0 "操"
 GEA.825.t:0 "北京方面与我们背道而驰"
 GEA.825.d:0 "来自北京的消息令人失望。直系政府正在逐步收紧德国资本的经营特权，并试图加强对铁路、矿业及重要工业部门的控制。吴佩孚似乎决心摆脱对德国金融与军事援助的依赖，这使帝国在华北苦心经营的经济影响力面临新的威胁。我们必须重新考虑同北京政府的合作关系。"
 GEA.825.a:0 "混账东西"
 GEA.826.t:0 "德国资本加大投资"
 GEA.826.d:0 "随着我国政府重新开放华北市场，德华银行、通用东亚公司及其他德国工业集团已经开始扩大投资，积极争取铁路、矿山与工业设施的经营特许。新的资本流入有望改善华北的财政与工业状况，但德国企业提出的优惠税率、长期经营权及其他附加条件，也意味着我国经济将进一步受到外国资本的影响。"
 GEA.826.a:0 "好吧..."
 GEA.827.t:0 "处理山东乱局"
 GEA.827.d:0 "济南、临沂与胶东已经全部落入我军控制，山东旧有的军阀秩序也随之瓦解。总督府必须决定，如何在胶州湾与威海卫租界之外建立可靠的地方政权，以保护侨民、恢复铁路运输，并确保德国企业的权益。\n\n唐仰杜愿意召集地方官僚与商绅，组建山东省善后维持委员会，在德国保护下维持省政。这种间接统治可以减少我方的行政负担，却难免将权力与利益交给一批善于钻营的地方人物。另一种方案则是任命威廉·赫普夫纳主持山东军政监，由德国官员直接掌握行政与治安，将这片土地建设为德属东亚在华北的支点。"
 GEA.827.a:0 "扶植一个亲德傀儡政权"
 GEA.827.b:0 "确保对山东的直接控制"
 GEA.828.t:0 "王克敏与华北临时政府"
 GEA.828.d:0 "随着德意志帝国的军队逐渐控制直系军阀的旧日领土，一个棘手的问题终于摆在了占领当局面前：我们究竟该如何治理这片幅员辽阔、人口众多的中国土地？直接军事占领固然能够保证帝国的权威，却也意味着德国人必须承担维持地方行政、征收赋税与恢复经济的全部负担。为此，总督府开始物色一位既熟悉中国官场，又愿意接受德国指导的本土政治人物。在经过一番筛选后，前北洋政府财政总长王克敏最终进入了德国官员的视野。\n\n这位出身浙江的老资格官僚，早年曾在清廷外交与财政部门任职，辛亥革命后又先后担任中国银行总裁及北洋政府财政总长，在中国金融界与旧官僚集团中拥有相当广泛的人脉。与那些热衷于高谈民族大义的军阀和革命者不同，王克敏更习惯于在银行账簿、财政预算与政客之间周旋。他深知中国政局的反复无常，也明白一个缺乏军队支持的文官政府究竟能够拥有多少权力。面对德国人的邀请，他并未表现出太多犹豫。毕竟，只要能够恢复地方秩序、保全旧官僚体系，并使自己重新登上政治舞台，那么与帝国合作未尝不是一条出路。\n\n在德国军事当局的支持下，以王克敏为首的临时政府即将正式成立。新政府将负责管理占领区的财政、警察、交通与地方行政，吸纳愿意合作的前直系官员，并以恢复和平、重建经济为名争取中国民众的支持。然而，所有涉及军事、外交及重要经济特权的事务，仍须得到德国顾问与驻军司令部的批准。王克敏或许终于得到了属于自己的政府，但他也十分清楚，真正决定这片土地命运的，并不是办公室里那些身穿长衫的中国官员，而是站在他们身后的德国军人。"
 GEA.828.a:0 "彳亍"
 GEA.829.t:0 "流亡者之梦"
 GEA.829.d:0 "世界大战的结束不仅宣告了德意志帝国在欧洲的胜利，也彻底改变了延续数个世纪的远东殖民秩序。曾经作为英国与法国全球霸权重要支柱的亚洲殖民地，在两国战败后逐渐落入德国及其盟友之手。英国失去了马来亚、海峡殖民地及香港等重要海外据点，法国则被迫放弃对印度支那的统治，而德国凭借新近获得的领土与原有的太平洋殖民地，一跃成为远东最具影响力的欧洲列强。\n\n如今，协约国在远东的影响力主要依靠澳大拉西亚与印度次大陆的亲英势力维系。作为大英帝国在太平洋地区最重要的残余据点，澳大拉西亚不仅保有相当规模的港口设施与海军力量，也承担着维系英国在亚洲商业网络的重要职责。与此同时，印度次大陆上的亲英政权仍然奉英国王室为合法君主，尽管其统治地位受到当地民族主义与其他印度政权的挑战，但它仍是协约国试图重建东方影响力不可忽视的力量。至于法国，阿尔及尔的流亡政府虽然失去了印度支那，却依旧通过残存的殖民地官员、商人、传教士及当地天主教社群，保留着与昔日亚洲殖民地之间的联系。\n\n对于德属东亚而言，这些旧日敌人的存在构成了一种颇为微妙的局面。德国人未能完全取代两国经营数十年的商业网络与地方关系。英国资本仍然在南洋贸易中占据一定地位，法国文化与宗教机构也继续影响着印度支那的部分社会阶层。然而，随着不列颠与法兰西本土相继落入工团主义者之手，德国与协约国之间原本泾渭分明的敌对关系也开始发生变化。双方虽然仍为世界大战留下的领土争端而彼此猜忌，却同样将欧洲革命政权视为必须面对的威胁。德国或许能够与渥太华和阿尔及尔达成某种有限的谅解，但这绝不意味着英国人已经忘记新加坡与香港，或是法国人愿意永远放弃西贡与河内。\n\n目前，协约国在远东尚不足以直接挑战德国的殖民霸权，但其残余力量仍然是一项不可忽视的战略因素。澳大拉西亚的动向、印度局势的演变，以及英法流亡政府未来能否重返欧洲，都可能改变这片地区的力量平衡。倘若协约国最终恢复昔日的实力，那么那些在世界大战后被迫割让的殖民地，无疑将重新成为各国外交争执的焦点。在此之前，德属东亚必须一面维护自身在远东的既得利益，一面处理与这些昔日敌国的关系。"
 GEA.829.a:0 "旧日野心尚未消亡"
 GEA.830.t:0 "两广烽火"
 GEA.830.d:0 "广东与广西之间脆弱的妥协终于破裂。地方军队各自集结，两广正式陷入内战，广州的商业秩序、内陆交通与德国企业的资产也随之面临威胁。广东方面由[event_target:GEA_liangguang_guangdong.GetName]掌握，控制着重要的沿海商埠和商业网络；广西方面则由[event_target:GEA_liangguang_guangxi.GetName]领导，依托内陆的军队与地方势力争夺两广的未来。无论支持哪一方，都可能为德国在华南争取新的合作对象，也可能让我们卷入一场难以收场的地方纷争。我们应当将支持投向哪一方？"
 GEA.830.a:0 "支持广东"
 GEA.830.b:0 "支持广西"
 GEA.831.t:0 "珠江彼岸的秘密交易"
 GEA.831.d:0 "自1924年广州商团事变失败以来，陈廉伯及其追随者便不得不面对一个令人难堪的现实：曾经足以左右广东政局的商团武装遭到击溃，而那些在广州商界呼风唤雨的富商巨贾，也在接连不断的政治风波中失去了昔日的影响力。然而，商团的失败并不意味着它背后的商业网络就此消失。作为前汇丰银行买办与广州商团领袖，陈廉伯仍然同广东、香港及南洋各地的银行家、商会领袖和贸易企业保持着密切联系。尽管他已经不再拥有能够公开同地方政府抗衡的武装力量，但在这个金钱往往比政令更加管用的时代，陈廉伯与他的商团仍然拥有不容小觑的政治价值。\n\n在德国商人的牵线搭桥下，德属东亚的代表与陈廉伯及其商团旧部举行了一系列秘密会谈。陈廉伯对广东军阀的横征暴敛、革命党人的政治鼓动以及不断威胁商人财产的社会动荡早已深感厌倦，而德国人则希望进一步扩大自己在华南的金融与商业影响力，以免珠江流域这片富庶的市场继续落入日本资本或其他外国势力的掌控。经过数轮讨价还价，商团方面同意利用其在银行、商会与航运业中的关系，为德华银行及其他德国企业争取更多投资机会，并协助德国资本进入广东的铁路、电力、矿业与港口经营领域。作为回报，总督府将为商团提供必要的资金与商业支持，帮助陈廉伯及其盟友逐渐恢复在广东经济界的地位。\n\n不过，真正重要的协议并未出现在任何正式的商业合同之中。在一次只有少数亲信出席的私人会晤上，陈廉伯向德国代表提出了一个更加大胆的设想：倘若德意志帝国有朝一日能够将自己的政治影响力扩展至整个华南，那么广东的统治权便不应继续交给军阀，也不应落入国民党人手中，而应当由熟悉地方经济、维护商业秩序的广东商界自行掌握。他所设想的政府将以商团与地方商会为政治基础，由陈廉伯本人及其亲信主持政务，同时向德国企业开放市场，并保证帝国在华南的既有权益。对于德属东亚而言，这显然是一个颇具吸引力的提议：一个依靠德国资本维持经济、依靠德国支持取得政权的商人政府，或许能够成为帝国控制珠江流域最为廉价而可靠的工具。\n\n经过慎重考虑，德国代表最终向陈廉伯作出了一项非正式的政治保证。只要商团能够履行约定，积极协助德国扩大在广东的经济与政治影响，那么一旦未来的局势允许德国直接干预华南事务，总督府便愿意支持由陈廉伯领导的商团政府接管广东。对于外界而言，德国企业与广东商界之间的合作仍然只是普通的商业投资，而陈廉伯也不过是一位试图重振家业的失意商人。然而，在官方的商业会谈背后，一场关于广东未来的交易已经达成。德国人将获得通往华南的商业门户，而陈廉伯则终于有机会重新实现那个在1924年未能完成的梦想。"
 GEA.831.a:0 "交易愉快"
 GEA.832.t:0 "来自德属东亚的最后通牒"
 GEA.832.d:0 "德属东亚总督府向我们递交了一份措辞强硬的照会，要求两广政府正式接受德国的控制。多年来，德国资本借助贷款、工业投资和经营特许权深入地方经济，而德国军方的顾问与军事网络也已渗透我们的军队。如今，总督府不愿再满足于幕后影响，而是要求将这种依赖变为公开的政治从属。\n\n德国方面声称，只要我们接受其监督，原有商业往来和地方秩序便可继续维持；但重大外交、军事与经济事务必须服从德属东亚的安排。省内依赖德国资本的工商人士纷纷要求政府接受条件，担心决裂会使工厂停摆、信贷断绝。然而，这份照会所要求的，正是将两广的自主权交到外国人手中。\n\n我们必须作出选择：接受德国控制，或承担拒绝之后可能到来的战争。"
 GEA.832.a:0 "接受条件，保全两广。"
 GEA.832.b:0 "两广绝不接受外国控制！"
 GEA.833.t:0 "两广的新政府"
 GEA.833.d:0 "两广已经落入我们的控制，如何将暂时的军事与政治优势转变为持久的统治，成为总督府必须解决的问题。继续依赖地方军阀，意味着容忍旧有派系、商会与军队之间无休止的讨价还价；由德国人直接主持地方政府，则能够使珠江流域的财政、工业与治安服从帝国在远东的整体安排。\n\n克劳斯·冯·博伦-哈尔巴赫被认为是合适的人选。他与德国工业界的联系，以及处理企业、军方与殖民官僚之间关系的经验，使其能够代表总督府监督地方行政。新政府将沿用德意志广州政府的名义，在德国驻军与本地行政人员的协助下，管理德属两广。广州及其港口的直接管辖安排则继续由德属东亚掌握。"
 GEA.833.d.merchants:0 "昔日在德国代表与广东商团之间达成的秘密协议，如今到了兑现的时候。德意志的资本、军事力量与政治安排已经将两广纳入我们的控制，而陈廉伯也通过商会、银行与航运网络履行了协助德国扩大影响的约定。他和商团旧部正在等待总督府对广东未来作出决定。\n\n按照此前的承诺，我们将支持陈廉伯主持新的商团政府。地方商会与工商人士将成为其政治基础，政府以维护商业秩序、保障私人财产和推动实业发展为纲领，同时接受德属东亚在外交、军事及重大经济事务上的监督。德国企业在两广的权益，也将由这一依赖我方支持的地方政府予以保障。\n\n直接派遣德国人接管地方行政固然能够彰显权威，但既然我们已经作出保证，履行交易便是巩固华南商业网络最稳妥的办法。陈廉伯将执掌两广政府，德国则保有决定当地政治方向的最终力量。"
 GEA.833.a:0 "由克劳斯主持德属两广政府。"
 GEA.833.b:0 "兑现承诺，推举陈廉伯。"
 GEA.834.t:0 "里斯本接受最后通牒"
 GEA.834.d:0 "葡萄牙政府已经同意移交澳门与东帝汶。面对东亚分舰队的压力，里斯本最终选择避免一场远离本土的殖民战争。双方代表将办理驻军撤离、港口设施与地方行政的交接，德属东亚随后接管这两处据点。"
 GEA.834.a:0 "合理的选择"
 GEA.835.t:0 "里斯本拒绝最后通牒"
 GEA.835.d:0 "里斯本拒绝接受我们的要求，宣称将保卫澳门与东帝汶。葡萄牙政府已经通知当地驻军准备抵抗，并试图争取外部支持。既然外交途径未能解决问题，总督府将正式提出对两地的领土要求，并命令东亚分舰队与登陆部队开始行动。"
 GEA.835.a:0 "开战！"
 GEA.836.t:0 "远东殖民地的停战谈判"
 GEA.836.d:0 "澳门与东帝汶均已落入德属东亚军队控制，继续守住这两处殖民地的希望已经破灭。德国方面提出，只要我们承认两地归属德属东亚，双方便可结束这场冲突。\n\n继续作战或许能够维护政府拒绝屈服的姿态，却难以改变远东的军事现实。接受条件，则能使葡萄牙从这场代价日增的战争中脱身。里斯本必须决定是否以承认既成事实换取和平。"
 GEA.836.a:0 "接受移交条件，结束战争"
 GEA.836.b:0 "继续抵抗"
 GEA.837.t:0 "德属东亚发来最后通牒"
 GEA.837.d:0 "德属东亚总督府向里斯本递交了最后通牒，要求我们将澳门与东帝汶移交德国方面控制。德国人声称，这两处据点妨碍其在华南与东印度群岛建立统一的海上秩序，并警告说，拒绝要求将导致武装冲突。\n\n澳门与帝汶的驻军远离本土，难以独自抵挡东亚分舰队及其登陆部队。然而，接受最后通牒也意味着主动放弃葡萄牙在远东经营已久的殖民据点。里斯本必须决定，是用两处殖民地换取和平，还是为保住它们而迎战德国。"
 GEA.837.a:0 "我们别无选择，只好退步。"
 GEA.837.b:0 "告诉守备司令部，坚定守住，就有办法！"
 GEA.838.t:0 "赵毓松与滇系的新主人"
 GEA.838.d:0 "云南地处中国西南边陲，山川险阻，民族众多，自辛亥革命以来便始终保有相当程度的政治与军事自主权。无论北京城中坐着哪一位总统、皇帝或大元帅，昆明的军政领袖总有办法凭借手中的军队与复杂的地方关系，维持自己在西南的一席之地。然而，滇系内部长期不断的派系斗争、地方财政的困顿，以及来自邻省和外国势力的压力，已经使这个曾经不可一世的军事集团日渐衰弱。随着德国的经济与政治影响力进一步深入西南，德属东亚开始考虑如何建立一个能够维护帝国利益、同时又不至于引发地方势力全面反抗的新政府。在诸多候选人之中，赵毓松最终获得了德国人的青睐。\n\n赵毓松并非云南传统意义上的军事强人。他早年便活跃于西南政坛，曾追随黔军将领袁祖铭参与地方政治，后来又投身中国青年党的活动，以鲜明的反共立场及政治宣传能力著称。与那些依靠私人军队争夺地盘的将领不同，赵毓松更擅长在复杂的政治环境中寻找盟友，并利用政党、报刊与地方名流的关系扩大自身影响。正因如此，德国人认为他或许能够成为协调滇系残余势力与新政府行政机关的合适人选。对于赵毓松本人而言，接受德国人的支持也并非毫无代价的选择，但在西南政局已经发生根本变化的情况下，能够取得一省政权的实际领导地位，显然比继续充当某位军阀的政治幕僚更具吸引力。\n\n如今，在德国人的支持下，赵毓松将负责组织云南新政府，并吸纳愿意接受现有政治安排的滇系军官、地方士绅与行政人员。新政府宣称将结束长期以来的军阀内斗，整顿财政与地方治安，并恢复云南同周边地区的贸易联系。然而，对于德国人而言，云南最重要的价值并非昆明政坛的安宁，而是这里能够通往缅甸、印度支那与中国内陆的交通道路，以及蕴藏于山地之中的矿产和其他资源。德国企业将获得新的矿业、铁路与贸易特许，德华银行则负责为地方财政提供必要的资金支持。赵毓松终于获得了能够实践其政治抱负的机会，但这位新任云南领导人很快就会发现，昆明政府的重要政治决策仍然必须得到新加坡方面的许可。"
 GEA.838.a:0 "云贵深山就此易主"
 GEA.839.t:0 "姚作宾与四川的新秩序"
 GEA.839.d:0 "四川素有天府之国的美誉，其肥沃的土地、众多的人口与丰富的物产，使这里长期以来都是中国西南最重要的经济区域之一。然而，自清王朝覆亡以来，各派四川军阀便围绕成都、重庆及川东各地展开了旷日持久的争斗，使原本富庶的省份饱受苛捐杂税与兵祸之苦。随着德国势力逐渐进入四川，如何使这片庞大而复杂的土地重新恢复稳定，成为德属东亚总督府面临的一项棘手任务。继续依靠那些拥有私人军队的川军将领，无疑只会使省内的政治纷争延续下去；经过多方考察，德国人最终选中了四川人姚作宾。\n\n姚作宾早年曾赴日本求学，后来在北洋政府的行政体系中任职，并参与青岛接收后的市政与外交交涉工作。这些经历使他对外国资本、商业特许与现代城市管理有着一定了解，也使他熟悉中国地方政府同外国势力打交道时所面临的种种难题。虽然姚作宾并非能够号令川军各部的军事领袖，但对于希望避免四川再度陷入军阀混战的德国人而言，这反而成为了他的优势所在。一位没有庞大私人军队、其政治地位必须依靠外部支持维持的文官，显然比那些随时可能拥兵自重的将军更加容易合作。姚作宾本人也愿意相信，凭借德国资本与现代行政制度，自己或许能够为故乡建立一套不同于旧日军阀统治的新秩序。\n\n在德国军事顾问与金融机构的协助下，以姚作宾为首的四川新政府已经正式成立。新政府将着手整顿地方财政、恢复交通与商业活动，并逐步将原本分散在各派军阀手中的行政权力重新集中起来。那些愿意接受新秩序的川军将领可以保留一定的地方地位，但必须服从政府的统一安排。与此同时，德华银行与德国工业企业将获得参与四川矿业、交通运输及工业建设的优先机会，德国顾问则将负责监督重要财政与经济政策的执行。"
 GEA.839.a:0 "天府之国的财富，自有识货之人。"
 GEA.840.t:0 "唐仰杜与山东的新秩序"
 GEA.840.d:0 "随着山东的政治局势终于落入德国人的掌握之中，如何处理这片长期饱受军阀混战之苦的土地，已经成为我们不得不面对的问题。张宗昌及其追随者的统治虽然曾依靠军队与地方势力维持了相当长一段时间，但省内混乱的财政制度、横征暴敛的军人以及形形色色的宗教与地方武装，早已令山东的行政体系不堪重负。经过一番考量，那些长期在山东官场任职、却始终未曾掌握过真正政治权力的旧式文官进入了德国人的视线中。\n\n唐仰杜出身山东邹县，早年曾接受法政与外语教育，并在辛亥革命后进入山东地方政界。他先后担任财政机关官员、省议会议员及济南市政厅总办，对山东的税收制度、地方财政与官僚体系颇为熟悉。与张宗昌手下那些动辄依靠枪炮解决争端的军官不同，唐仰杜更习惯于通过财政、法令与行政命令维持政府的正常运转。对于德国人而言，这种务实的官僚作风无疑比军阀的个人野心更加值得信赖；而对于唐仰杜本人来说，德国人的支持也意味着他终于有机会摆脱长期在各派军人之间周旋的处境，以一省行政长官的身份实现自己的政治抱负。\n\n如今，在德国军事顾问的监督下，以唐仰杜为首的山东省政务政府即将正式成立。新政府将着手整顿地方财政、恢复警察与税务机关，并吸纳愿意同德国合作的前山东官员，以逐步取代旧军阀留下的混乱行政体系。然而，所有涉及铁路经营、矿业特许、重要税收与军事安全的事务，仍须接受德国当局的指导。唐仰杜或许能够在济南的办公室里决定地方官员的任免，却无法改变德国企业在山东经济中的优越地位。"
 GEA.840.a:0 "好好干！"
 GEA.841.t:0 "陈廉伯与广东商团政府"
 GEA.841.d:0 "德国在华南取得的政治优势，终于使广东长期以来错综复杂的权力关系发生了根本变化。自国民党北伐失败以来，陈炯明及其共和大同盟便一直依靠联省派、商团、地方士绅与其他政治团体之间的妥协维持广东的统治。然而，这个看似包容各派的政治联盟内部始终存在着难以调和的矛盾，尤其是代表广州大商社利益的粤商公安维持会，长期以来便对陈炯明政府的亲工会政策与进步主义改革颇有微词。商团虽然拥有自己的武装与广泛的商业网络，却始终不得不与那些主张扩大劳动者权利的政客分享权力。如今，随着德国人逐渐掌握广东的政治与经济命脉，这种局面终于迎来了改变的机会。\n\n作为广州商团的领袖，陈廉伯对于如何利用商业资本维护政治利益可谓驾轻就熟。1924年，他曾因反对孙中山政府的苛重税收而领导商团与国民党发生武装冲突，虽然最终遭到镇压并被迫逃往香港，但随着北伐战争失败，他得以重返广东政坛，并使商团重新成为当地不容忽视的政治力量。近年来，陈廉伯及其盟友又通过秘密渠道同德属东亚建立了密切联系，协助德华银行与德国企业扩大在华南的投资，并利用广州商会及南洋商业网络，为德国资本争取更多经营机会。作为交换，德国人不仅向商团提供了资金与政治支持，更曾私下承诺，倘若帝国有朝一日能够左右广东政局，便会支持陈廉伯及其追随者掌握地方政府。如今，这份曾经只能在秘密会谈中提及的约定，终于到了兑现的时候。\n\n在德国当局的支持下，以陈廉伯为首的广东商团政府已经正式成立。原本只是共和大同盟一员的粤商公安维持会，如今将成为省政权的核心，广州商会、银行家与地方企业领袖则被邀请参与新政府的行政事务。商团武装将承担维护重要城市与商业设施安全的职责，而地方财政、税收与贸易政策也将按照商界的利益重新调整。陈廉伯宣称，这标志着广东终于摆脱了军阀混战与党派纷争，迎来一个真正由商人主持政务的时代。然而，新政府取得权力所依赖的德国援助，显然不会是毫无代价的。德华银行与通用东亚公司将获得更加优越的投资条件，德国企业在铁路、港口、工业与金融方面的特权也将得到充分保障。陈廉伯终于使商团成为广东的主人，但在这份来之不易的胜利背后，德国资本的影响已经比以往任何时候都更加深入。"
 GEA.841.a:0 "广东商人终于得偿所愿，德国人也是"
 GEA.842.t:0 "德国的最后通牒"
 GEA.842.d:0 "德属东亚的代表已向我们递交最后通牒。凭借在云南积累的资本与军事影响，德国人要求我们接受其监督，将外交和军事事务置于总督府控制之下。接受意味着成为德属东亚的附属政府；拒绝则必须驱逐德国资本，并承担德国诉诸武力的风险。"
 GEA.842.a:0 "接受德国的条件。"
 GEA.842.b:0 "拒绝通牒，驱逐德国资本！"
 GEA.843.t:0 "德国的最后通牒"
 GEA.843.d:0 "德属东亚的代表已向我们递交最后通牒。凭借在四川积累的资本与军事影响，德国人要求我们接受其监督，将外交和军事事务置于总督府控制之下。接受意味着成为德属东亚的附属政府；拒绝则必须驱逐德国资本，并承担德国诉诸武力的风险。"
 GEA.843.a:0 "接受德国的条件。"
 GEA.843.b:0 "拒绝通牒，驱逐德国资本！"
 GEA.844.t:0 "云南拒绝服从"
 GEA.844.d:0 "云南政府拒绝了我们的最后通牒，并宣布驱逐德国资本，终止同总督府的合作。德国企业与顾问正被迫撤离，我们在当地建立的经济安排也遭到清算。总督府必须决定，是以战争迫使其服从，还是暂时接受这一挫败。"
 GEA.844.a:0 "让军队迫使他们服从。"
 GEA.844.b:0 "暂且作罢。"
 GEA.845.t:0 "四川拒绝服从"
 GEA.845.d:0 "四川政府拒绝了我们的最后通牒，并宣布驱逐德国资本，终止同总督府的合作。德国企业与顾问正被迫撤离，我们在当地建立的经济安排也遭到清算。总督府必须决定，是以战争迫使其服从，还是暂时接受这一挫败。"
 GEA.845.a:0 "让军队迫使他们服从。"
 GEA.845.b:0 "暂且作罢。"
 GEA.846.t:0 "华东的新秩序"
 GEA.846.d:0 "华东五省的主要城市、铁路与行政中枢已经落入我们的控制。总督府必须决定，如何将军事占领转变为能够长期维持的统治。我们可以重新扶植齐燮元，让熟悉地方军政关系的宁系官僚在德国监督下恢复省政；也可以将行政权直接交给法肯豪森与通用东亚公司，使德国企业、顾问和驻军共同掌握华东的命脉。\n\n无论选择哪一种安排，南京都将成为新附属政权的首府。德国原有的沿海租界继续由我方保留，华东其余本土地块则交给接受德属东亚保护的地方政府管理。"
 GEA.846.a:0 "由齐燮元主持宁系政府。"
 GEA.846.b:0 "让法肯豪森和通用东亚公司接管。"
 GEA.847.t:0 "甘宁青联合自治政府"
 GEA.847.d:0 "西北三马的主要地盘已经进入德属东亚的控制范围，总督府需要在甘肃、宁夏与青海建立一个能够维持交通、地方财政和驻军补给的附属政权。与其将有限的德国官员分散到辽阔的西北，不如借助熟悉当地军政关系的马氏势力恢复秩序。\n\n马鸿逵愿意接受德国的保护，以西北军政维持委员会的名义主持新政府。甘宁青联合自治政府将以银川为首府，在地方事务上维持一定自治，同时将外交与军事事务置于德属东亚的监督之下。德国企业与顾问也将获得进入西北交通、贸易和资源开发体系的机会。"
 GEA.847.a:0 "由马鸿逵维持西北秩序"
#经济
 GEA.1000.t:0 "新工业城"
 GEA.1000.d:0 "随着德属东亚的经济持续发展，殖民地现有的工业设施已经逐渐难以满足不断增长的生产需求。为了进一步吸引德国资本、扩大工业规模，总督府与各大工业集团共同提出了一项雄心勃勃的城市建设计划，准备选择一处合适的地区，兴建集工厂、仓储、交通与居民生活设施于一体的现代工业城市。然而，各方对于选址始终存在分歧。新加坡拥有完善的港口和成熟的商业网络，能够为新工业区提供可靠的基础；印度支那则拥有丰富的劳动力与广阔的土地，有望借此摆脱长期依赖种植园和农业出口的经济结构；婆罗洲虽然基础设施相对落后，却蕴藏着大量矿产与能源资源，适合发展资源加工及相关工业。三处选址各有优势，而殖民地现有的资金与建设能力不足以同时推进所有方案。最终的决定，仍须由总督来决定。"
 GEA.1000.a:0 "还是得优先建设新加坡"
 GEA.1000.b:0 "尝试给印度支那带来繁荣"
 GEA.1000.c:0 "婆罗洲这个资源宝库不能被抛弃"
 GEA.1001.t:0 "海峡上的万国商埠"
 GEA.1001.d:0 "清晨的第一声汽笛划破新加坡港口的薄雾时，这座城市便从短暂的睡梦中苏醒过来。悬挂黑白红三色旗的德国货轮缓缓驶入码头，满载橡胶与锡矿的驳船在海面上穿梭，来自中国、印度与马来半岛的码头工人则在监工的吆喝声中开始了一天的劳作。沿着港口向城内走去，人们可以看见穿着笔挺制服的德国殖民官员、头戴毡帽的阿拉伯商人、操着福建话的中国店主，以及从乡间赶来出售农产品的马来农民。不同的语言、宗教与习俗在狭窄的街道上交织，而在它们头顶，德意志帝国的鹰徽正俯视着这座远东最繁忙的港口之一。\n\n对于初次到访的德国旅客来说，新加坡或许是一座令人目不暇接的异国都市，但对真正生活在这里的人而言，殖民地的繁荣却有着另一副面孔。在德国人的俱乐部与宽敞住宅之外，中国商会仍然掌握着相当一部分地方贸易，印度工人聚居的街区时常发生劳资纠纷，而马来人则对德国法律与传统习俗之间的冲突颇有怨言。总督当然可以自豪地宣称，德国人的统治将现代文明与商业繁荣带到了马六甲海峡，但任何熟悉这座城市的老商人都明白，这个港口能够运转至今，靠的绝不仅仅是总督府里那些堆积如山的公文。"
 GEA.1001.a:0 "整个世界似乎都汇聚于此。"
#印支战争
 GEA.1100.t:0 "再度投身战火"
 GEA.1100.d:0 "战火之息最终还是回到了德属东亚。\n\n过去数年间，新加坡当局始终把印度支那的动荡视作一场可以通过有限的武力与必要的妥协加以控制的危机。可如今这些判断都已失去意义。印度支那各地的叛乱已经从零散的袭击和秘密活动演变为公开战争。此刻，印度支那地区的南部已经几乎彻底沦陷，只有少数要塞与哨所仍然在抵抗越工的进攻。通往南方的铁路与公路此刻也正在遭受游击队的破坏，许多补给与增援都因交通线的破坏而不得不迟滞。在叛军那边，民族主义者与工团主义者暂时搁置了彼此之间的分歧，将矛头共同指向德国统治。那些过去只存在于警察档案和情报报告中的组织，现在已经拥有了自己的武装、控制区和前线。\n\n这并不是德属东亚第一次经历战争。十年前，德国军队曾在广州和华南追击革命者；更早以前，帝国也已经在非洲和太平洋的殖民地积累过无数治安战与殖民战争的经验。然而印度支那如今的局势远比任何一次局部叛乱都更加严重。殖民政府必须同时保住主要城市、港口、铁路和边境，而每一处被忽视的乡村都可能成为敌人的补给站和新的兵源地。\n\n军队已经进入战时状态，舰队也终于从巡逻与演习中抽身，开始从新加坡的海军基地中拔锚启航。整个殖民政府各部门从上到下也开始按照战时计划全速运转。没有人知道这场战争会持续多久，也无人确信德意志是否能够在东方维持他的长久霸权。但至少有一点已经十分明确——属于德属东亚的远东和平结束了。"
 GEA.1100.a:0 "我们将战斗到底！"
 GEA.1101.t:0 "同僚来信"
 GEA.1101.d:0 "一封来自德属东亚总督府的紧急信函已经送抵中央非洲。远东的德国同僚正面临着日益严峻的政治与军事危机，当地驻军与殖民地行政机构已经难以独自应对不断扩大的威胁。为此，东亚政府正式向我们请求援助，希望中央非洲能够提供必要的资金、军需物资与其他支持，以帮助他们渡过眼前的难关。然而，中央非洲本身同样面临着财政困难与殖民地安全问题，我们究竟能够为远东的同胞提供多少帮助？"
 GEA.1101.a:0 "好吧，我们会尽全力帮助我们的朋友"
 GEA.1101.b:0 "表达我们的同情"
 GEA.1101.c:0 "中央非洲同样自身难保"
 GEA.1102.t:0 "中央非洲支援抵达"
 GEA.1102.d:0 "来自中央非洲的好消息终于传到了新加坡。我们的非洲同僚已经同意提供大规模援助，一批满载军需物资、工业原料与其他重要补给的运输船正陆续抵达远东港口。中央非洲政府还承诺提供必要的财政支持，以帮助我们稳定殖民地局势。尽管这些援助尚不足以解决所有问题，但在如今的危急时刻，来自帝国另一处海外领地的慷慨支持无疑令人倍感振奋。"
 GEA.1102.a:0 "很好！"
 GEA.1103.t:0 "中央非洲支援抵达"
 GEA.1103.d:0 "中央非洲政府已经对我们的求援作出回应。考虑到其自身面临的财政与安全压力，非洲同僚只能提供一批数量有限的物资与资金，无法承担更大规模的援助计划。虽然这些补给远远无法满足德属东亚当前的需求，但总督府仍然对他们愿意伸出援手表示感谢。至少我们并未被帝国的其他海外领地彻底遗忘。"
 GEA.1103.a:0 "好吧..."
 GEA.1104.t:0 "中央非洲爱莫能助"
 GEA.1104.d:0 "中央非洲政府拒绝了我们的援助请求，声称当地财政与军事形势同样十分严峻，无法将宝贵的资源调往远东。尽管他们在回信中表达了对于德属东亚困境的深切同情，但这种毫无实际意义的慰问显然无法帮助我们解决眼前的问题。看来，我们不能再指望非洲的同僚替我们分担这场危机了。"
 GEA.1104.a:0 "这帮混蛋！"
 GEA.1105.t:0 "远东危局"
 GEA.1105.d:0 "德属东亚总督府近日向柏林发来紧急报告，称帝国在远东的政治与军事局势正在急剧恶化。不断扩大的外部威胁、殖民地内部的不稳定因素以及日益沉重的财政负担，已经使当地政府难以仅凭自身力量维持局势。总督府请求帝国中央政府提供军事装备、资金及其他必要援助，以确保德国在亚洲的战略利益不受损害。然而，德国本土同样面临着诸多亟待解决的问题，远东的求援也意味着新的财政负担。我们必须决定，帝国究竟愿意为保卫这片遥远的东方领地付出多少代价。"
 GEA.1105.a:0 "全力支持东亚政府"
 GEA.1105.b:0 "提供有限的支援"
 GEA.1105.c:0 "他们得自力更生"
 GEA.1106.t:0 "祖国支援抵达"
 GEA.1106.d:0 "来自柏林的援助终于抵达了德属东亚。帝国中央政府已经批准大规模支援计划，新的军火、工业设备与重要物资正源源不断地运抵新加坡，而来自本土的财政拨款也将帮助总督府维持日益沉重的行政与军事开支。德国政府的决定表明，尽管远东局势已经十分严峻，柏林仍然不准备放弃帝国在亚洲的利益。"
 GEA.1106.a:0 "很好！"
 GEA.1107.t:0 "祖国支援抵达"
 GEA.1107.d:0 "柏林已经对德属东亚的紧急求援作出回应。考虑到帝国本土面临的财政压力与其他战略需求，中央政府决定仅向远东提供数量有限的资金和军事物资。虽然这些援助无法彻底缓解殖民地当前的困境，但至少能够帮助总督府维持部分关键机构与部队的正常运转。看来，剩下的问题仍然需要我们自行解决。"
 GEA.1107.a:0 "好吧..."
 GEA.1108.t:0 "祖国拒绝援助"
 GEA.1108.d:0 "柏林方面已经正式拒绝了我们的紧急援助请求。帝国中央政府表示，鉴于本土财政与军事形势的严峻程度，德国目前无法向远东调拨更多资金及物资，并要求总督府尽可能依靠殖民地自身资源解决问题。这一决定无疑令新加坡的官员们感到愤怒与失望。远东为帝国提供了数十年的财富与战略利益，如今轮到我们寻求祖国帮助时，得到的却只是一封措辞客气的拒绝信。"
 GEA.1108.a:0 "操"
 GEA.1109.t:0 "印度支那局势恶化"
 GEA.1109.d:0 "尽管官方报道说远东殖民地在镇压叛乱上取得了极大的成功，不过事实看上去没那么乐观。据军事情报局称，印度支那的局势实际上变得越来越糟，镇压越盟叛军似乎已经不是这位舰队司令可以应付的了的。一些主要城市和战略据点落入越工手中，恐惧和骚动正在蔓延，也许德属东亚需要一些帮助？"
 GEA.1109.a:0 "他们可以对付的"
 GEA.1109.b:0 "派援军过去！"
 GEA.1109.c:0 "一场在亚洲的地面战？这个可以有！"
 GEA.1110.t:0 "增援东亚"
 GEA.1110.d:0 "帝国殖民署已经要求派遣更多部队前往东亚以缓解当地的压力。尽管这些部队在本土服役会更轻松，但我们必须在东亚这个工团主义的温床维护我们和之前和各方打成的有利协议。"
 GEA.1110.a:0 "这就是维持帝国的代价"
 GEA.1111.t:0 "向东亚运输装备"
 GEA.1111.d:0 "帝国殖民署已经要求运送更多装备前往东亚以环境当地补给的短缺并满足所有部队的规格。这些步枪在击毙那些敢于反抗德意志帝国的东方人时非常有效。"
 GEA.1111.a:0 "这就是维持帝国的代价"
 GEA.1112.t:0 "烈焰吞噬丛林"
 GEA.1112.d:0 "印度支那的战争正在让德意志帝国的军官们重新认识现代战争的残酷。尽管德意志部队拥有远胜越工叛军的火炮、装甲车辆与航空支援，但这些优势在茂密的热带雨林中却往往难以发挥作用。盘根错节的植被、泥泞不堪的道路与遍布山林的隐蔽工事，使德军的每一次推进都变得举步维艰。越工游击队则充分利用地形，在丛林深处构筑掩体与地下据点，依靠伏击和突袭不断消耗我们的兵力。面对这些藏身于灌木与地堡中的敌人，传统步兵武器与炮兵轰击显然已经无法满足前线的需求。\n\n为了解决这一难题，驻军司令部向德国本土请求调拨了一批火焰喷射器。这种曾在世界大战的堑壕中令协约国士兵胆寒的武器，如今终于再次被投入东方的战场。在最近的数次清剿行动中，配备火焰喷射器的工兵部队成功摧毁了多处难以通过常规手段攻克的游击队据点，其喷射出的烈焰不仅能够迫使躲藏在狭窄工事中的敌人撤离，也给那些习惯于依托丛林抵抗的叛军造成了巨大的心理震慑。尽管沉重的燃料装备、有限的射程以及热带环境中的维护困难仍令前线军官颇有微词，但这些武器所展现出的威力已足以引起司令部的高度重视。\n\n鉴于初步取得的战果，德属东亚军方已经决定扩大火焰喷射器的装备规模，并着手建立专门的训练与维修设施。来自德国本土的技术人员将协助驻军改良相关装备，使其更加适应印度支那潮湿炎热的环境，而更多工兵单位也将接受相应的作战训练。当然，部分官员担忧这种武器可能引发难以控制的火灾，但这些没用的顾虑显然还不足以阻止新式武器的推广。"
 GEA.1112.a:0 "能烧的全烧掉"
 GEA.1113.t:0 "德国提议调停暹缅战争"
 GEA.1113.d:0 "德属东亚的代表向我们递交了一份停战建议。德国人认为由我国发起的战争正在破坏地区秩序，并威胁贸易与边境安全。他们提议交战双方停止敌对行动，放弃通过本次战争索取领土或赔款，各自撤回战前边界。\n\n接受这项建议，就意味着结束战争、恢复战前的领土归属；我们也可以拒绝调停，继续以武力争取胜利。"
 GEA.1113.a:0 "接受调停，恢复战前状态"
 GEA.1113.b:0 "拒绝调停，战争继续"
 GEA.1114.t:0 "暹罗拒绝德国调停"
 GEA.1114.d:0 "曼谷拒绝了我们的停战建议，暹缅战争仍在继续。我们可以暂且接受这一结果，让双方自行解决争端；也可以再次向暹罗发出最后通牒，要求其立即停止进攻，与缅甸恢复战前状态，否则我们将直接下场参战干涉。"
 GEA.1114.a:0 "就此作罢。"
 GEA.1114.b:0 "再次警告曼谷"
 GEA.1115.t:0 "德国的最后通牒"
 GEA.1115.d:0 "德属东亚再次发来照会。这一次，德国人要求我国立即与缅甸达成和平协议，撤回战前边界。如果我们继续拒绝，德属东亚将直接向我国宣战。"
 GEA.1115.a:0 "接受条件，结束战争"
 GEA.1115.b:0 "我们绝不屈服于德国的威胁"
#陆军
 GEA.1200.t:0 "德属东亚的新任陆军总参谋长"
 GEA.1200.d:0 "我们需要决定我们的新陆军总参谋长人选。"
 GEA.1200.a:0 "施陶芬贝格将带来炮火与坦克"
 GEA.1200.b:0 "特雷司寇将会为军队带来现代化"
 GEA.1200.c:0 "邵肯将会发扬德意志的总参谋部传统。"
 GEA.1200.e:0 "舍尔纳将贯彻铁与血的精神意志"
 GEA.1201.t:0 "紧急会议"
 GEA.1201.d:0 "“印度支那已经失控了。”\n\n“还没有，”施陶芬贝格冷冷地回答，“但照舍尔纳的办法，很快就会。”\n\n迪特里希·冯·邵肯推开会议室的大门时，争论显然已经持续了相当长的时间。凌晨送抵司令部的叛乱报告正散落在桌面上，几面标注着德军驻地的红色小旗被挤在印度支那南方的几个角落。五年来，邵肯见过无数次类似的会议，却从未见过如此难看的局势。\n\n“你准备同那些叛匪谈判？”舍尔纳敲了敲地图，“他们杀了我们的人，袭击了我们的哨所。你还想给他们下跪不成？”\n\n“我想让你明白，烧掉几个村庄不会让我们赢得这场战争。”施陶芬贝格毫不退让，“我们需要可靠的情报、机动部队，以及一个不会把所有当地人都逼到敌人那边去的占领政策。”\n\n“漂亮话。等你的铁皮陷进泥潭里，我倒想看看你怎么把它们开出来。”\n\n“够了。”\n\n特雷司寇终于抬起头。他把一份报告推到桌子中央。\n\n“我们的补给线太长，驻军分散得太开。无论采用哪种办法，首先都必须重新组织防御、集中兵力。否则你们不如想想谁来为下一次失败负责。”\n\n邵肯走到地图前，沉默了片刻。“还得补充军官。现有的参谋机构已经无法处理这些报告，我们需要更多能够独立指挥的年轻人。征兵额度也必须扩大，否则再好的计划都没有人执行。”\n\n会议室里终于安静下来。总督将目光从地图移向四位军官。少壮派们主张改革占领政策与机动力量以重整战线和后勤，而保守派邵肯要求扩充军队与指挥体系，舍尔纳则坚持以最严厉的手段迅速扑灭叛乱。他们谁也无法说服另外三人。\n\n总督揉了揉疲惫的双眼。窗外，天色已经开始泛白。“先生们，我们已经没有时间继续争吵了。”"
 GEA.1201.a:0 "“上校，过几天你将被晋升。但至少现在，你需要接手这个烂摊子了。”"
 GEA.1201.b:0 "“特雷司寇将军，我们需要更详细的方案。”"
 GEA.1201.c:0 "“迪特里希，先着手提拔你觉得可靠的新军官吧。”"
 GEA.1201.e:0 "“至少目前，舍尔纳将军，做你该做的。”"
 GEA.1202.t:0 "来自[FROM.GetName]的求和请求"
 GEA.1202.d:0 "欧洲战局的崩溃已让德国在远东的残余势力失去依靠。[FROM.GetName]的代表如今向我国递交了一份停战提议，希望结束双方及其盟友之间的战争。接受这一提议，可以让帝国腾出力量处理其他事务；拒绝则意味着继续作战，直到对方彻底屈服。"
 GEA.1202.a:0 "接受停战，结束这场战争。"
 GEA.1202.b:0 "他们必须彻底投降。"
 GEA.1203.t:0 "日本接受停战"
 GEA.1203.d:0 "日本政府已接受我们的求和提议，双方及其相关盟友之间的战事正在停止。尽管这场战争没有带来我们希望的胜利，幸存者终于能够得到喘息的机会。"
 GEA.1203.a:0 "至少，我们活下来了。"
 GEA.1204.t:0 "日本拒绝求和"
 GEA.1204.d:0 "日本政府拒绝了我们的停战提议，宣称只有彻底投降才能结束战争。外交渠道已经无能为力，我们只能依靠剩余的军队继续抵抗。"
 GEA.1204.a:0 "那就继续战斗。"
#新闻
 GEA_news.1.t:0 "尼亚加拉号惊天劫案"
 GEA_news.1.d:0 "一桩离奇的黄金失踪事件近日引起了太平洋各国航运界与金融界的广泛关注。数周前，载有大批黄金的远洋客轮“尼亚加拉”号在航行途中不幸触雷沉没，所幸船员与乘客在事故发生后及时得到疏散。然而，随着近日打捞工作的展开，这场原本被认为是普通海难的事故却出现了令人难以置信的发展。据负责打捞的人员报告，潜水员已经进入沉船的贵重货物舱，并确认了原本存放黄金的舱室位置，但本应随船沉入海底的黄金却不翼而飞。打捞队在残骸中进行了反复搜索，最终仍然一无所获。有关方面已着手调查黄金失踪的原因，但迄今尚未找到任何能够解释此事的可靠线索。这一消息迅速引发了各界猜测。部分报纸认为，整起触雷事故或许是一场精心策划的惊天劫案，幕后人物利用船只沉没与人员撤离的混乱，在打捞队抵达前秘密取走了全部黄金。然而，无论这些推测听起来多么耸人听闻，目前仍然没有任何证据能够证明黄金遭到人为盗取。"
 GEA_news.1.a:0 "如此完美的手笔"
 GEA_news.1.b:0 "谁做的？"
 GEA_news.2.t:0 "哈尔出任德属东亚总督"
 GEA_news.2.d:0 "在德属东亚经历了接连不断的政治动荡后，哈尔已正式接任殖民地总督。此次人事变动被认为是德国当局重新整顿远东行政体系的重要一步。面对印度支那日益活跃的民族主义运动、殖民地财政困境以及逐渐恶化的地方治安，新任总督主张恢复传统行政机构的权威，并借助本土官僚、地方警察和殖民政府的合作，使德国在亚洲的统治重新步入正轨。\n\n哈尔并不打算从根本上改变德属东亚的殖民制度，而是希望通过行政改革、经济恢复以及争取地方精英的支持，缓和德国人与本土社会之间日益尖锐的矛盾。这一相对务实的方针获得了部分殖民地官员与商界人士的欢迎，但也引起了军方强硬派的不满。对于长期遭受政治压制的印度支那民族主义者而言，新总督的上台或许意味着某些变化，却未必意味着德国人愿意真正放松手中的权力。"
 GEA_news.2.a:0 "希望远东能恢复平静"
 GEA_news.3.t:0 "瓦尔德克亲王执掌德属东亚"
 GEA_news.3.d:0 "德属东亚的权力更迭迎来了一位出身显赫的统治者。瓦尔德克-皮尔蒙特的约西亚斯亲王已正式就任总督，成为德意志帝国在远东的最高行政长官。这位与德国宫廷及保守派贵族关系密切的亲王，曾在殖民地近年来的动荡中发挥重要作用，而如今他终于得以亲自决定这片海外领地的未来。亲王的上台获得了殖民地贵族保守派的欢迎，也被视作传统贵族政治在帝国海外事务中的一次胜利。\n\n据悉，约西亚斯亲王打算利用自己与柏林上层社会的密切关系，为德属东亚争取更多资金与政治支持，同时重新加强殖民政府同印度支那传统君主及地方贵族的联系。不过，这种依靠私人关系、贵族声望与地方盟约维持统治的方针，也引起了部分殖民官僚的疑虑。他们担忧，随着亲王不断扩大自己的政治影响力，德属东亚可能逐渐成为一个更听命于瓦尔德克家族而非柏林殖民部的海外领地。"
 GEA_news.3.a:0 "亲王总督上任东方"
 GEA_news.4.t:0 "威廉·海耶接管德属东亚"
 GEA_news.4.d:0 "德意志帝国近日任命威廉·海耶将军为德属东亚总督，结束了围绕殖民地领导权持续已久的争论。作为一位经验丰富的职业军人，海耶的上台被视作德国军方在远东政治事务中影响力进一步扩大的标志。面对印度支那的革命运动、日本在东亚日益增长的军事威胁以及殖民地内部的种种不安定因素，新任总督认为，只有重新确立军队的权威，才能确保德国在亚洲的利益不受侵犯。\n\n海耶已经表示，殖民地驻军的整顿、海军基地的防御以及地方治安机关的改革将成为新政府的重要任务。与主张全面军事镇压的激进军官不同，他更强调军事纪律、指挥效率与长期防务建设。然而，军方对殖民行政事务的深入干预，仍然可能引发传统文官与商业集团的不满。对于德国在远东的竞争对手而言，这位将军的任命则意味着，柏林显然不准备轻易放弃自己在亚洲取得的战略地位。"
 GEA_news.4.a:0 "暴力与铁腕终将得胜"
 GEA_news.5.t:0 "克虏伯男爵出任德属东亚总督"
 GEA_news.5.d:0 "德国工业界近日取得了一项引人注目的政治胜利。与克虏伯集团关系密切的蒂洛·冯·威尔莫夫斯基男爵已正式就任德属东亚总督，使这家著名的钢铁与军工企业得以直接参与帝国海外领地的治理。此次任命正值黑色星期一严重冲击德国殖民地经济之际，柏林部分政商人士认为，传统的殖民行政机关已无力独自应对危机，必须依靠大型工业集团的资金与管理能力才能挽救远东经济。\n\n蒂洛总督计划利用克虏伯在钢铁、机械制造与军工生产领域积累的经验，加快德属东亚的工业化进程，并进一步加强大型企业同殖民地驻军之间的合作。德国商界对这一前景抱有相当期待，但殖民政府内部也出现了不同声音。随着克虏伯逐渐掌握殖民地的重要产业与投资项目，传统官僚机关究竟还能在经济事务中保有多大的决定权，已经成为总督府不得不面对的问题。"
 GEA_news.5.a:0 "克虏伯的影响力延伸到了远东"
 GEA_news.6.t:0 "IG法本集团接管德属东亚"
 GEA_news.6.d:0 "德国化学工业巨头IG法本集团近日迎来了一项重大政治胜利。集团的重要领导人物弗里茨·梅尔已经正式出任德属东亚总督，成为这片海外领地的新任统治者。随着黑色星期一重创帝国的殖民贸易体系，依靠橡胶、矿石与农产品出口维持经济的传统模式正受到越来越多的质疑。梅尔及其支持者认为，德属东亚丰富的自然资源与广阔市场足以支撑一场大规模的工业改造，而德国化学工业的先进技术正是实现这一计划的关键。\n\n新任总督准备大力发展化学制造、原料精炼及工业科研，并将印度支那与南洋各地建设为法本集团重要的海外生产基地。虽然这些计划受到了工业界的热烈欢迎，但其所需的庞大资本、土地与劳动力，也令殖民官僚及地方社会感到不安。随着法本集团逐步取得殖民地经济发展的主导权，德属东亚似乎正走向一种前所未有的统治模式：工业企业不再只是殖民政府的合作伙伴，而开始亲自决定殖民地的未来。"
 GEA_news.6.a:0 "化学帝国的又一次扩张"
 GEA_news.7.t:0 "海上恶魔执掌德属东亚"
 GEA_news.7.d:0 "随着德国军队在印度支那遭遇惨败，威廉·海耶将军的殖民地统治终于走到了尽头。这场灾难不仅使德意志帝国失去了大片富饶的远东领土，更令原本被视作帝国海外霸权象征的德属东亚陷入了前所未有的政治危机。在一片相互指责与要求更换领导层的呼声中，第一次世界大战期间因指挥辅助巡洋舰“海鹰”号而声名远扬的费利克斯·冯·卢克纳尔伯爵最终脱颖而出，正式接任总督。这位素有“海上恶魔”之称的传奇海军军官，以大胆的冒险精神和丰富的海外经历闻名，其任命也被认为是海军势力在殖民地政治中重新占据上风的标志。\n\n面对印度支那的失陷与殖民地驻军的溃败，卢克纳尔认为，德属东亚必须首先保住剩余的港口、岛屿与海上交通线，才能谈论重返印度支那的可能。他计划重新整顿远东舰队，加强海军与殖民地行政机关之间的合作，并利用德国在南洋的海上优势逐渐恢复帝国的影响力。"
 GEA_news.7.a:0 "海上恶魔再次扬帆"
 GEA_news.8.t:0 "费迪南德·舍尔纳接管德属东亚"
 GEA_news.8.d:0 "印度支那战争的惨败终于使威廉·海耶将军失去了对德属东亚的控制权。在军方强硬派的推动下，以严酷军纪和毫不妥协的指挥作风闻名的费迪南德·舍尔纳最终接任总督。对于那些因战败而颜面扫地的德国军官而言，这位强硬将领的上台意味着帝国终于准备采取更加坚决的行动，以挽回在远东遭受的耻辱。\n\n舍尔纳毫不掩饰自己对前任总督的轻蔑，认为印度支那的失陷并非德国军队缺乏力量，而是软弱的指挥、犹豫不决的政策以及对本土势力的过度纵容共同酿成的恶果。新任总督已经宣布将全面整顿残存驻军，强化军事纪律，并为重新征服印度支那做好准备。与主张通过外交妥协恢复殖民地影响力的温和派不同，舍尔纳坚信，帝国失去的土地只能依靠军队重新夺回。尽管他的任命在德国军方内部获得了不少支持，但也有殖民地官员担忧，这位将军一旦重新踏上印度支那的土地，将带来更加恐怖的战火与屠杀。"
 GEA_news.8.a:0 "祂带来杀戮...与无尽的死亡"
