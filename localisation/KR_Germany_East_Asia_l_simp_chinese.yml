 GEA_Indochina:0 "§O印度支那§!"
 GEA_Indochina_DESC:0 "[GetGEAIndochinaDescription]\n当前印度支那愤怒：[GetGEAIndochinaAngerValue]\n当前印度支那稳定：[GetGEAIndochinaStabilityValue]"
 GEA_Indochina_Default_DESC:0 "印度支那这片地区，始终是德属东亚诸多殖民行政区划中最不稳定的地区。这里在过去几年中就一直被农民起义与游击队所困扰。这其中最大的一部分原因就是越盟在印支地区四处煽动起义与暴动。这些赤匪潜藏在树林于山谷之中，很难被我们的治安军抓获。如今为了稳定该地局势，我们能做的只有两种选择：加大搜捕力度，或是对他们妥协。当然，总参谋部的一些高级将领是不会乐于见到我们对这些“蛮子”低头的..."
 GEA_Indochina_Schorner_DESC:0 "印度支那联盟未能守住他们可怜的胜利果实，印度支那再次回到了德意志的统治之下。而为了彻底镇压这片不安分的土地，舍尔纳将采取一切可能的手段，彻底消灭一切可能的潜在叛乱分子，即使这将会以成千上万人的死亡为代价也在所不惜。舍尔纳总督已经颁布了“尼禄法令”，对于一切可能存在叛乱分子的村庄都应彻底烧毁，对于一切疑似越盟成员都可直接射杀，对于潜在的叛乱分子都可就地处决。\n\n当前§R印度支那抵抗度§!：[?GEA.GEA_indochina_resistance|0]"
 GEA_Secure_Far_East_Control:0 "确保远东控制"
 GEA_Secure_Far_East_Control_desc:0 "确保中国、蒙古、日本、朝鲜、东南亚与外阿穆尔的目标地区均由德属东亚或其附属国拥有，随后吞并在该范围内拥有领土的附属国，并将目标地区整合为德属东亚核心。"
 GEA_Expand_Indochina_Coal_Mines:0 "扩建东北煤矿"
 GEA_Expand_Indochina_Coal_Mines_desc:0 "扩大东北地区已有煤矿的开采规模，修筑矿井与运输设施，为殖民地工业提供更多煤炭。"
 GEA_Integrate_inc:0 "整合印度支那"
 GEA_Support_local_national_bourgeoisie:0 "支持本地民族资产阶级"
 GEA_Support_local_national_bourgeoisie_desc:0 "印度支那的本土商人与实业家长期受到德国大型企业的排挤，难以获得足够的资金与经营机会。我们可以通过放宽商业许可、提供优惠贷款及适当减少行政限制，扶持一批愿意同殖民地政府合作的本地企业家。这些新兴资产阶级不仅能够促进地方经济发展，也有望成为支持德国统治的可靠社会力量。"
 GEA_Lower_assembly:0 "设立下级议会"
 GEA_Lower_assembly_desc:0 "印度支那的本地精英长期抱怨，他们在殖民地行政体系中缺乏表达意见的正式渠道。我们可以在省级及地方行政机构设立有限的民意代表会议，允许商人、地主与受过教育的本地人士参与讨论税收、公共工程及地方事务。尽管这些议会仍须接受德国官员的监督，其决议也不具备完全的约束力，但至少能够为殖民地居民提供一条合法的政治参与途径。"
 GEA_Abolish_ethnic_hierarchies:0 "取消民族等级划分"
 GEA_Abolish_ethnic_hierarchies_desc:0 "殖民地行政体系中长期存在的民族身份划分，使德国人与本地居民在就业、教育及公共服务方面享有截然不同的待遇。这些制度不仅加深了社会隔阂，也为反殖民运动提供了有力的宣传材料。我们将逐步废除部分基于民族身份的行政限制，扩大本地居民进入公共机构与专业岗位的机会，并推动更加统一的法律与社会待遇标准。"
 GEA_Expand_market_for_agricultural_products:0 "为印支农产品打开销路"
 GEA_Expand_market_for_agricultural_products_desc:0 "印度支那拥有丰富的稻米、咖啡、茶叶及其他农产品，但本地生产者往往受制于收购商与有限的销售渠道，难以从出口贸易中获得合理收入。总督府将协调德国商会与航运企业，扩大印度支那农产品在帝国及其他海外市场的销路，改善仓储与运输设施，并鼓励贸易商同本地农业经营者签订长期采购合同。"
 GEA_Reduce_special_tax_rate:0 "降低特殊税率"
 GEA_Reduce_special_tax_rate_desc:0 "殖民地政府长期通过各种特别税赋与附加征收维持财政收入，但这些税负对于普通农民、小商人与本地企业而言往往过于沉重。为了缓解社会不满并刺激经济活动，我们将适当降低部分特殊税率，简化地方税收制度，并限制基层官员随意增设额外摊派。"
 GEA_Introduce_local_industries:0 "引进本土工业"
 GEA_Introduce_local_industries_desc:0 "长期以来，印度支那主要承担着向德国工业提供原料与农产品的职能，本地制造业的发展却始终受到忽视。我们将鼓励德国企业同本土商人合作，兴办食品加工、纺织、木材加工及其他适合当地条件的工业项目，并通过技术培训和设备投资提高生产效率。适度发展本土工业不仅能够创造就业机会，也有助于改善殖民地经济过度依赖原料出口的局面。"
 GEA_Make_concessions_to_proletarians:0 "对本地人让渡利益"
 GEA_Make_concessions_to_proletarians_desc:0 "印度支那的工人与农民长期承受着低廉工资、繁重劳动及有限社会保障所带来的生活压力，而这些不满也正在被反殖民组织加以利用。总督府将要求部分种植园与工业企业改善劳动条件，适当提高工资待遇，并为本地居民提供更多教育、医疗及就业机会。德国企业或许不得不牺牲一部分眼前利润，但这些让步有望缓解社会矛盾，减少激进政治运动的支持基础。"
 GEA_we_need_soldier:0 "加大征召力度"
 GEA_we_need_soldier_desc:0 "随着印度支那各地反殖民活动愈发频繁，现有殖民地驻军已经难以同时承担边境防御、交通保护与地方治安任务。总督府将扩大本地辅助部队及殖民地军队的征召规模，增加基层军官与士兵的编制，并通过德国军官加强训练和指挥。"
 GEA_Develop_military_in_village:0 "在乡村发展军警"
 GEA_Develop_military_in_village_desc:0 "印度支那广阔的乡村地区长期缺乏足够的殖民地治安力量，使反德组织得以利用偏远村落建立据点、筹集物资并发展地下网络。我们将扩大乡村警察与地方辅助武装的编制，建立更多驻防哨所，并由德国军官负责训练和监督。这些军警将协助维护交通、巡查村庄并向殖民地当局报告可疑活动，使政府的控制力进一步深入农村基层。"
 GEA_Build_a_defense_line:0 "筑垒行动"
 GEA_Build_a_defense_line_desc:0 ""
 GEA_Normal_state_of_martial_law:0 "常态戒严"
 GEA_Normal_state_of_martial_law_desc:0 "面对日益频繁的罢工、示威与武装袭击，殖民地军方认为现行行政程序已经无法满足紧急治安需求。总督将扩大军事当局的特别权限，在重点地区长期实施宵禁、集会限制及交通检查，并允许军警直接处理危害殖民地安全的事件。"
 GEA_Scour_the_jungle:0 "扫荡丛林"
 GEA_Scour_the_jungle_desc:0 "印度支那的反殖民武装经常利用密林、山谷及偏远村落躲避殖民地军队的追击，并在难以通行的地区建立秘密营地与补给据点。我们将组织专门的丛林清剿部队，配合地方军警对疑似叛乱活动地区展开持续军事行动，试图摧毁其营地、截断补给并迫使武装人员退出据点。"
 GEA_Approve_a_large-scale_search:0 "批准大规模搜查"
 GEA_Approve_a_large-scale_search_desc:0 "安全部门认为，印度支那各地的反德组织正在利用城市街区、乡村社区与商业网络掩护地下活动，仅靠常规警务调查已无法有效遏制其扩张。总督将批准军警在重点地区开展大规模搜查，检查可疑住所、仓库与集会场所，并拘捕涉嫌参与地下组织的人员。"
 GEA_Remove_all_unwanted_individuals:0 "清扫闲杂人等"
 GEA_Malaya:0 "§R马来亚§!"
 GEA_Malaya_DESC:0 "尽管印度支那是一片混乱的土地，但所幸德属东亚所统治的核心地区，马来亚半岛始终保持了平稳安定的社会环境。这使得海军政府在此实行的无论经济政策或是法律都能够得到有效执行。只要我们能够成功守卫住马来亚半岛，德属东亚的旗帜就不会在东南亚倒下。同时，扩大对马来亚半岛的开发也能够为我们贡献更多的工业产值，最终我们将会把这里建设得与祖国别无二致。\n\n当前马来亚开发程度：§Y[?GEA.GEA_singapore_development|0]§!"
 GEA_completion_of_Singapore_Development:0 "宣布马来半岛开发计划完成"
