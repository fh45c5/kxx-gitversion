 GEA_Integrate_Borneo:0 "整合全婆罗洲"
 GEA_GER_Guinea:0 "§R德属新几内亚§!"
 GEA_GER_Guinea_desc:0 "新几内亚这片土地，我们在其上的占领几乎可以说是空中楼阁。除了在威廉港与俾斯麦群岛上的部分驻军外，能证明我们在此殖民的唯一证据也许就是那几座孤零零的金矿山了。但随着北方旭日的野心之火逐渐蔓延至东南亚，我们必须再次重视起新几内亚这片领土。即使我们放弃在其上困难重重的矿业开采，也必须加派工程队强化军港与堡垒这些军事设施，以防备即将到来的风暴。\n\n当前几内亚开发程度：§Y[?GEA.GEA_Guinea_development|0]§!"
 GEA_more_gold:0 "加大金矿开采力度"
 GEA_more_gold_desc:0 ""
