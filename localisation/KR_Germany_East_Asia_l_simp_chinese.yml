 GEA_SZC_Map_Yao_Zuobin_DESC:0 "§R四川省维持政府§!\n\n§L在巴蜀大地盘根错节的武备、保定与实业团军阀被彻底击碎后，通用东亚公司与青岛当局清醒地认识到：若继续委任任何一名四川本土军头，畸形的“防区制”与军阀混战迟早会死灰复燃。为此，德方特地从青岛租借地与华北买办官场中抽调了四川南部县籍的老练官僚姚作宾返乡主政。这位早年曾涉足五四学运与“大同党”、随后在仕途钻营中迅速蜕变为亲德实务派的川籍政客，曾在青岛市政厅与华北机构中以擅长迎合德方规程、晋升神速而闻名。打着“川人治川、休养生息”的旗号，姚作宾在德式装备的治安警备队护送下入主成都与重庆，将他在胶澳习得的买办市政管理体系原封不动地搬进了四川盆地。\n\n游离于巴蜀传统军政山头之外的姚作宾，是通用东亚公司深入长江上游最趁手的白手套。在他的配合下，昔日林立的内河厘金关卡被尽数拆除，悬挂着通用东亚公司旗帜的货轮得以畅行无阻地穿越三峡直抵宜宾；克虏伯的技师团队正式接管了重庆兵工厂与合江炮厂，而德华银行则通过控制自贡盐税、嘉陵江煤矿及印支大米输入，牢牢攥住了全川的财政与粮食命脉。尽管巴蜀民间与残存袍哥对这位“从青岛回来的洋大人随员”颇多微词，但只要重庆江面的德国炮艇仍在游弋，天府之国的丰饶物产便会源源不断地顺江东流。§!"
 GEA_SZC_Map_Wubei_DESC:0 "§X武备系治下§!\n\n§L在惨烈拉锯与反击过后，受直系扶植的“武备系”终究守住了巴蜀权柄。对德属东亚而言，无论成都督署的主人是热衷市政建设的杨森还是贪婪残暴的刘存厚，武备系的胜出都意味着川南的国民党与联省派余孽已被彻底清剿，长江上游重新回到了亲直系保守派的掌控之中。只要他们还渴望通过出兵五省来向北京邀功，或是需要进口外国机械来重建成都机器局与重庆兵工厂，通用东亚公司的货轮就能毫无阻碍地溯江而上。§!"
 GEA_SZC_Map_Baoding_DESC:0 "§C保定系治下§!\n\n§L当杨森与刘湘在血腥火并中两败俱伤后，以保定陆军军官学校校友为核心的“保定系”凭借其严明的军纪与精妙的幕后折冲，兵不血刃地入主成都并笑到了最后。不同于一山不容二虎的旧式军阀，保定系建立了一套独特的“双头政权”：被戏称为“水晶猴子”的邓锡侯代表保守稳健的军方与乡绅利益，致力于修复都江堰、将巴蜀打造成自给自足的“模范省”；而盘踞西康雅安、笃信佛教的刘湘“幺爸”刘文辉则代表城市官僚与改革派，力主重塑公务员体制、力求建立赶超直奉的“现代省”。\n\n在如今看来，邓刘二人的双头政府是四川诸多可能的乱局中最令人省心的结果。保定系既无意发动鲁莽的对外扩张，又对引进欧洲工业设备、现代炼钢技术与西方学术人才抱有极高热情。无论天平最终偏向邓锡侯的农业模范省还是刘文辉的工业现代省，巴蜀大地都将成为德资在华西稳定获利的良田。§!"
 GEA_SZC_Map_Industrial_DESC:0 "§g实业团治下§!\n\n§L曾因北伐阻击战功赫赫却遭吴佩孚冷落、屈居杨森之下的重庆镇守使刘湘，终于用实业团铺天盖地的炮火洗刷了昔日的屈辱。在攻破成都、并于眉山和雅安的崇山峻岭间彻底制服刘文辉后，这位新晋“四川王”断然将省会迁往长江与嘉陵江交汇的工业重镇重庆。在山城浓密的工厂黑烟下，刘湘正以近乎狂热的执念推行“激进现代化”。\n\n尽管刘湘对北京直系怀有深仇大恨，常图谋出兵恩施、结盟奉天或自组“护国联盟”问鼎中原，但他骨子里仍是一位痛恨赤色分子的旧派铁腕军阀。他的激进工业化之梦正是克虏伯与监事会梦寐以求的金主——只要这位四川王的扩张途中不会触及德资的利益，通用东亚公司与实业团的合作就能天长地久地维持下去。§!"
 GEA_SZC_Map_KMT_DESC:0 "§R国民党治下§!\n\n§L1931年随滇军入川失败后长期蛰伏于川南深山的“军官系”游击队，竟在四川内战的惊天逆转中创造出奇迹：趁刘湘主力顿兵成都城下，重庆市长潘文华突然阵前倒戈，将整座山城拱手献予革命党人；紧接着，名将刘伯承以神出鬼没的游击穿插彻底击溃了武备系主力。随着省议会普选落幕，孙中山的忠实信徒吕超率领亲近宋庆龄派的“三民党”赢得了巴蜀执政权，正大刀阔斧地招募北伐老兵、着手将昔日乌烟瘴气的军阀防区改造为纪律严明的革命根据地。而对驻青岛与新加坡的德属东亚当局而言，青天白日旗在成都与重庆升起无疑是一场战略噩梦。一旦中华大地上的国民党力量达成了联合，德意志在东方的投资就将彻底沦为泡影。§!"
 GEA_SZC_Map_Federalist_DESC:0 "§h联省派治下§!\n\n§L巴蜀大地已然化作中国联省自治运动浴火重生的“最后堡垒”。无论是由辛亥元老熊克武领导的“自治政府党”在省议会胜出、颁布《中川军法》裁撤冗兵，还是在两广遭国民党政变驱逐的致公党领袖陈炯明辗转流亡抵达重庆、获邀主持“重庆联省政府”，联省派都已在这片内陆盆地深深扎根。如今，陈炯明的《中华建设方略》与“广东模式”正在全川强力推行，而统一的“国防军”正枕戈待旦，准备召开“成都会议”号召全国民主力量。\n\n尽管陈炯明与熊克武的联省主义者在对待工商业资本时比激进的国民党左派温和得多，甚至愿意在赈灾与技术引进上与西方保持接触，但他们本质上仍是要彻底推翻北洋军阀体系与外国租界特权。只是目前这些丧家之犬仍然需要来自我们的帮助，因此维持良好的商业关系依旧是监事会与联省派们的共识。\n\n陈炯明与熊克武当前均采取虚与委蛇的态度，商业往来并不等于接受德意志的租界特权。§!"
 GEA_SZC_Map_Zhili_DESC:0 "§X流亡直系治下§!\n\n§L当北京紫禁城的满清遗老悍然发动政变、谋害“玉帅”吴佩孚与曹锟，并在洛阳与武汉的血战中击溃直军主力后，世人皆以为称霸中原十年的直系军阀已彻底沦为历史尘埃。然而，玉帅高足蒋百里将军，竟率领卡车车队星夜兼程逃抵成都，与旧友杨森合流，将崇山峻岭环绕的四川变成了直系残部的最后堡垒。在成都与重庆，流亡直系虽面临着颜惠庆“文官派”（与蒋百里“军官派”的内部争论，但全军上下对北京伪清廷的刻骨仇恨却高度一致。对德属东亚与通用东亚公司而言，这支退守巴蜀的“流亡直系”也正是我方在华北局势失控后最宝贵的战略资产。蒋百里与颜惠庆不仅携带着北洋残存的黄金储备与成建制的百战老兵，更主动通过通用东亚公司与使馆城渠道向我方发出求援，恳请克虏伯工程师入川督建新式兵工厂，并愿倾尽黄金储备换取德制重炮与步枪，以为达成复仇的终极目标。§!"
 GEA_SZC_Map_Default_DESC:0 "§g川系政权治下§!\n\n§L[SZC.GetName]控制着地形险要、人口众多的四川盆地。省内的军官派系、商人、乡村税源与鸦片经济彼此纠缠，历次权力更迭都未能轻易消除这套复杂的利益关系。\n\n长江航运、军械贸易与工业设备，为监事会经营四川提供了渠道。但在明确的合作承诺出现之前，当地政权仍被视为虚与委蛇的交易对象；若其公开转向终结租界，我们也会据此重新判断其立场。§!"
