 GEA_pacify_indochina_decisions:0 "平定印度支那"
 GEA_pacify_indochina_decisions_desc:0 "殖民政府必须恢复印度支那的秩序，压制越工与民族主义组织，并确保忠诚力量能够在危机中维持统治。"
 GEA_designate_priority_defense_zone:0 "指定重点防御区"
 GEA_register_loyal_civic_associations:0 "登记市民团体"
 GEA_register_loyal_civic_associations_desc:0 "总督府将登记德国侨民、商会成员、街区领袖与愿意维持秩序的本地市民，并为他们建立一套紧急联络名册。"
 GEA_secure_saigon_communications:0 "确保广播与电报局"
 GEA_secure_saigon_communications_desc:0 ""
 GEA_reorganize_saigon_police:0 "武装城市警察"
 GEA_reorganize_saigon_police_desc:0 "我们将抽调可靠军官重整市警察，撤换动摇者，并为各警署制定革命爆发时的统一行动方案。"
 GEA_prepare_saigon_emergency_depots:0 "设立市区应急仓库"
 GEA_prepare_saigon_emergency_depots_desc:0 "在不起眼的仓库和公共设施内分散储存粮食、燃料、医疗用品与路障材料，使忠诚力量不必依赖随时可能中断的外部运输。"
 GEA_map_loyalist_urban_defenses:0 "测绘忠诚城市防区"
