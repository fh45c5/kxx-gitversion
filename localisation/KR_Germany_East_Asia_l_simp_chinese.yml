 GEA_War_plan_Ocean_Heart:0 "战争计划：大洋之心"
 GEA_War_plan_Ocean_Heart_desc:0 "夏威夷扼守太平洋中央的航线。既然无法通过外交将其纳入我们的战略体系，我们就必须以武力夺取大洋之心。"
 GEA_War_operation_Rumphius:0 "战争行动：龙菲乌斯"
 GEA_War_operation_Rumphius_desc:0 "龙菲乌斯曾深入东印度群岛，探寻这片土地的富饶物产。如今，我们将循着他的足迹，以武力打破荷兰人在群岛的统治。"
