#海耶
 GEA_heye_decisions:0 "祖国支援"
 GEA_heye_decisions_desc:0 "威廉·海耶的军政府不会坐等殖民地在缺枪少弹中崩塌。只要柏林仍承认东亚秩序属于帝国的一部分，东亚总督便有理由继续向本土索取武器、装备与兵员。"
 GEA_heye_request_guns:0 "索要步兵装备"
 GEA_heye_request_guns_desc:0 "印度支那的密林、马来亚的港口与新加坡的街巷都需要更多步枪来维持秩序。我们将向本土要求调拨一批步兵装备。"
 GEA_heye_request_artillery:0 "索要火炮"
 GEA_heye_request_artillery_desc:0 "如果没有足够的重火力，东亚的防御就难以防御来自各方的入侵，更不用说向外扩张。因此我们必须获得足够的火炮支援。"
 GEA_heye_request_manpower:0 "索要人力"
 GEA_heye_request_manpower_desc:0 "德属东亚的战线与驻防区都在吞噬人手。若柏林希望东方继续安定，就必须向我们补充更多兵员。"
 GEA_heye_request_support_equipment:0 "索要支援装备"
 GEA_heye_request_support_equipment_desc:0 "枪炮并不能解决所有问题。电台、工兵器材、医疗物资与后勤设备同样会决定殖民军能否继续运转。"
 GEA_heye_import_machine_tools:0 "进口新机床"
 GEA_heye_import_machine_tools_desc:0 "从本土引进新式机床和配套工业设备，以扩充德属东亚的民用生产能力。"
 GEA_heye_import_machine_tools_expanded:0 "进口新机床"
 GEA_heye_import_machine_tools_expanded_desc:0 "柏林已同意扩大工业支援规模，我们可以用更高的花费一次引进更多新式机床。"
 GEA_heye_import_machine_tools_maximized:0 "进口新机床"
 GEA_heye_import_machine_tools_maximized_desc:0 "最高等级的本土支援允许我们以基础方案两倍的花费，一次引进足以增加三个地图外民用工厂的整套设备。"
 GEA_heye_import_production_line:0 "引进新式生产线"
 GEA_heye_import_production_line_desc:0 "从本土引进成套军工生产设备，为德属东亚建立新的军需生产线。"
 GEA_heye_import_production_line_expanded:0 "引进新式生产线"
 GEA_heye_import_production_line_expanded_desc:0 "柏林已同意扩大军工支援规模，我们可以用更高的花费一次引进更多生产线。"
 GEA_heye_import_production_line_maximized:0 "引进新式生产线"
 GEA_heye_import_production_line_maximized_desc:0 "最高等级的本土支援允许我们以基础方案两倍的花费，一次引进足以增加三个地图外军用工厂的成套生产线。"
 GEA_heye_request_light_tank_support:0 "请求装甲车辆支援"
 GEA_heye_request_light_tank_support_desc:0 "请求本土按照东方战场的需求生产并调拨一批轻型装甲车辆。"
 GEA_heye_request_medium_tank_support:0 "请求主战坦克支援"
 GEA_heye_request_medium_tank_support_desc:0 "请求本土为德属东亚提供一批能够承担正面作战任务的中型坦克。"
 GEA_heye_panzer_ii:0 "二号坦克"
 GEA_heye_panzer_iii:0 "三号坦克"
 GEA_heye_request_light_aircraft_support:0 "请求轻型飞机支援"
 GEA_heye_request_light_aircraft_support_desc:0 "请求本土调拨一批德国空军现役的Bf 109战斗机，以增强东亚航空队。"
 GEA_heye_request_truck_support:0 "请求卡车支援"
 GEA_heye_request_truck_support_desc:0 "向本土申请一批军用卡车，以提高殖民军的运输能力和机动水平。"
 GEA_heye_request_mechanized_support:0 "请求机械化载具支援"
 GEA_heye_request_mechanized_support_desc:0 "向本土申请一批机械化运输载具，为德属东亚组建更坚固的机动部队。"
 GEA_heye_request_cas_support:0 "请求近距支援机"
 GEA_heye_request_cas_support_desc:0 "请求德国航空工业为东方战场提供一批Ju 87A近距支援机。"
 GEA_heye_request_mainline_infantry_divisions:0 "请求主力步兵师"
 GEA_heye_request_mainline_infantry_divisions_desc:0 "请求本土为东方战场组建两个拥有完整步兵炮、工兵、侦察与火炮支援的主力步兵师。"
 GEA_heye_request_motorized_divisions:0 "请求摩托化师"
 GEA_heye_request_motorized_divisions_desc:0 "请求本土为东方战场组建两个由摩托化步兵、轻型坦克与摩托化炮兵组成的快速师。"
 GEA_heye_request_armored_kampfgruppen:0 "请求装甲战斗群"
 GEA_heye_request_armored_kampfgruppen_desc:0 "请求本土按照专门设计的三号坦克方案，为德属东亚组建两支装甲战斗群。"
