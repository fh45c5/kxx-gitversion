 GEA_YUN_Map_Zhao_Yusong_DESC:0 "§R云南省临时政府§!\n\n§L当德属东亚驻印支军团沿着滇越铁路北上平定昆明乱局、彻底瓦解了拥兵自重的讲武堂旧将与革命党残部后，新加坡深知绝不能再扶植任何一位出身滇军山头的本土武人。经过审慎甄选，德方将目光投向了早年追随黔军袁祖铭、1926年便极力主张联直孙反北伐，且长期在西南从事反工团宣传与边政设计的青年党政客兼报人赵毓松。这位出身贵州黎平、曾任《新中国日报》总主笔的文人官僚，在云南军界毫无私人班底，只能完全仰赖河内派驻的德国军事顾问团与铁道警备队坐镇五华山，以“整顿边政、清乡安民”的名义接管了昆明省署。\n\n正是因为赵毓松在滇境缺乏本土根基，他对德国人与通用东亚公司的指令展现出了远超历任军阀的顺从。上任伊始，曾深入研究农矿与工厂管理的赵毓松便废止了缪云台筹划的锡业自主方案，亲自督办将个旧锡矿、东川铜矿及云南锡务公司的全部资产并入通用东亚公司的华南供应链，并全面取消了滇越铁路的过境壁垒；与此同时，他正积极配合德方组建“清乡委员会”，在滇南河口与澜沧江沿岸搜剿残存的抗德游击队与印支流亡分子。如今的云贵高原已不再是威胁海防港后方的火药桶，而是德属印度支那温顺、稳定的矿产后院。§!"
 GEA_YUN_Map_Tang_DESC:0 "§P唐继尧治下§!\n\n§L自蔡锷将军北上护国以来，“东大陆主人”唐继尧已在这片云雾缭绕的高原上统治了整整二十余载。昔日砸碎袁世凯帝制迷梦的功勋早已在屡次入川惨败与直奉战争的透支中消磨殆尽；如今的唐大帅沉迷于个人威权与鸦片烟云之中，不仅靠纵容烟土走私与横征暴敛来填补军费无底洞，甚至在部队哗变时荒唐地以“三百万吨大烟”充当军饷。他对无能胞弟唐继虞的偏袒、层出不穷的宅邸丑闻，以及在八省联合崩溃后不顾“黑色星期一”萧条强行向湘、川用兵的狂妄执念，已令滇军参谋部与地方议会怨声载道。\n\n对德属东亚而言，唐继尧是一个既贪婪又难以捉摸的旧时代遗老。只要他还需要通过滇越铁路出口鸦片与粗锡来购买德制火炮与战斗机，昆明就仍在我方的经济绳索掌控之下；但倘若这位精神日益恍惚的“云南王”在鸦片幻梦中彻底失控——无论是对外挑起西南全面战火，还是听信缪云台的进言强行撕毁与通用东亚公司的锡矿合同——我方都必须随时准备物色一位更懂规矩的继任者,甚至跨越边境保卫我们的资产。§!"
 GEA_YUN_Map_Zhu_DESC:0 "§M朱德治下§!\n\n§L当自私的军阀们将昆明变成修罗场时，一位本已解甲归田、在云南讲武堂潜心授业的教官挺身而出，终结了这场闹剧。出身四川佃农家庭、曾远赴柏林留学的传奇名将朱德，凭借其在讲武堂师生与滇军基层中无可匹敌的威望，在老友金汉鼎与范石生的配合下兵不血刃地控制了省城。这位平民将军兑现了“小小军阀休要祸我河山”的誓言，与章伯钧领导的“中国农工民主党”及进步学者携手，在群山之间筑起了一座廉洁、温和而坚定的“民主堡垒”。\n\n尽管朱德曾留学德国、深谙现代步兵渗透战术与德式操典，但柏林与河内绝不应对其抱有任何幻想。这位致力于改善工农民生、推行全面禁烟与农业改革的理想主义统帅，对通用东亚公司的殖民剥削深恶痛绝。在他的支持下，如果不进行干涉，德国资本和影响力挤出云南似乎已经是时间问题。§!"
 GEA_YUN_Map_Zhu_Peide_DESC:0 "§2朱培德治下§!\n\n§L在唐继尧倒台引发的省城动荡中，出身云南禄丰名门的朱培德将军联合陈诚、陈果夫等流亡滇境的国民党右派干将，率领纪律严明的“国民革命军第三军”（建国军）稳定了昆明局势，宣告成立遵循五院制训政纲领的“昆明国民政府”。作为早年讲武堂出身的滇籍宿将，朱培德为人谦和稳健，尽管常年受严重贫血困扰，仍亲自统筹二五减租、整编省防新军与云南讲武堂的教范改革。与盘踞闽赣山区、狂热鼓吹阶级斗争与无偿没收外资的汪精卫左派不同，朱培德与陈果夫将闽赣临时行动委员会视作背离正统、引狼入室的工团主义异端，力主在西南维持一套有序的现代官僚与军政体制。\n\n诚然，十年前德国干预北伐的历史旧账令昆明军界对我方存有戒心，但冰冷的地缘与经济现实决定了朱培德政府无法与德属东亚彻底决裂：深处内陆高原的云南若想落实缪云台的工业化蓝图、为建国军换装重火器以抵御北方直系与周边旧军阀的威胁，就绝不能切断通往海防港的唯一大动脉“滇越铁路”，更离不开个旧大锡的对德出口创汇与德国进口药剂、机械的供应。只要新加坡与通用东亚公司顺应现实，以下调滇越铁路过境附加税、签署互利贸易协定及提供军工与医药技术为筹码，完全可以同这位务实的右派统帅达成稳固的有限合作——用昆明的锡锭与北境边防的安宁，换取双方在反工团主义与维持西南秩序上的默契共赢。§!"
 GEA_YUN_Map_Long_Yun_DESC:0 "§X龙云治下§!\n\n§L昭通彝族出身的“云南之龙”龙云，在穿过滇池东岸的硝烟、将刚愎自用的唐继尧赶下宝座并扫平各路叛军后，终于成为了昆明无可争议的新主人。作为一名从云南讲武堂基层摸爬滚打上来的彻底实用主义者，龙云对空洞的意识形态口号毫无兴趣：对内，他暗中授意退伍老兵组成的“清党委员会”用棍棒无情弹压翠湖公园与个旧锡矿的赤色罢工，同时借助少数民族秘密结社“竹王会”或汉化政策弹压边疆土司；对外，他一边扩建昆明兵工厂与市政设施，一边将贪婪的目光投向富庶的缅甸克钦、掸邦以及暹罗银矿。\n\n在所有可能的昆明统治者中，龙云是最符合德属东亚胃口的交易对象。这位务实的“新云南王”深知高山深谷的工业局限，既渴望通过滇越铁路获取德国的重炮、步枪生产线与工程支持，又与我方同样痛恨工团主义与国民党煽动者。只要通用东亚公司能提供令他满意的投资与矿业分红，这位彝族强人不仅能替我方稳住印度支那北部的漫长边疆，甚至有望成为帝国公约在华南最坚实的盟友。§!"
 GEA_YUN_Map_Default_DESC:0 "§g滇系政权治下§!\n\n§L群山环抱的云贵高原，既是近代中国“护国讨袁”的共和圣地，亦是拱卫印度支那北境的天然屏障。自1926年德意志帝国武力粉碎北伐以来，大批走投无路的国民革命军残部与新桂系将领逃入云南，在龙云等滇军少壮派的武装庇护下与统治云南二十余年的老迈都督唐继尧达成了脆弱的共存。正是这支围绕“云南陆军讲武堂”建立起来的庞大武装，令北京的清廷与直系军阀始终不敢轻易越雷池一步，却也将昆明变成了一座派系林立、随时可能引爆的火药桶。\n\n尽管云南在政治上高举反清共和旗帜，但在经济命脉上却被我方死死扼住咽喉：连接昆明与海防港的“滇越铁路”由德属东亚全权掌控，而产量冠绝全华的个旧锡矿因本地洗矿与冶炼工艺落后，只能以极低的价格将粗锡贱卖给通用东亚公司，经我方广州精炼厂提纯后高价转售国际市场。然而，“黑色星期一”引发的关税暴涨与锡价暴跌已激起云南朝野强烈的反德情绪——经济学巨擘缪云台正密谋以香港富滇银行渠道绕开德国中间商，而昆明军界更有人企图借八省联合崩溃之机出兵湖南与四川，甚至暗中通过湄公河向印度支那的丛林叛军偷运步枪。河内与新加坡必须密切注视昆明城头的每一次枪响，绝不能让滇越铁路的丰厚红利毁于一旦。§!"
