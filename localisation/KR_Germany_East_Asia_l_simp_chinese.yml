 GEA_qie_force_land_purchases:0 "强制收购土地"
 GEA_qie_force_land_purchases_desc:0 "利用现有的德资网络与政治关系，推动北京政府为德国企业安排土地收购，进一步扩大德国资本在华北的立足范围。"
 GEA_qie_seize_bankrupt_enterprises:0 "征收破产企业"
 GEA_qie_seize_bankrupt_enterprises_desc:0 "以清理破产资产为名接管当地企业，将可以利用的机器与产能转入德属东亚。此举将损害北京政府对德国的态度，也会削弱当地市场自由派的支持。"
 GEA_qie_enforce_mark_settlement:0 "强制马克结算"
 GEA_qie_enforce_mark_settlement_desc:0 "凭借德国资本的优势地位，迫使北京政府接受以马克结算贸易的制度，并将其部分民用工业产能纳入德国主导的结算与偿付体系。"
