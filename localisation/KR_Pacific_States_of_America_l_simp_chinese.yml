 CAL_high_tariffs_idea:0 "太平洋保护主义"
 CAL_high_tariffs_idea_desc:0 "高关税将为我们的项目提供必要的资金支持，并同时保证我们工人的收入。这是一个双赢的局面。"
 CAL_high_tariffs_idea_2:0 "太平洋之梦"
 CAL_high_tariffs_idea_2_desc:0 "如果我们想要经济繁荣，那么富人就得有些喘息的空间。我们必须削减他们的税收，并用我们新的高关税制度来弥补收入的损失。"
 CAL_high_tariffs_idea_3:0 "太平洋之梦"
 CAL_high_tariffs_idea_3_desc:0 "赫斯特认为，如果我们的经济体系能将上层阶级纳入其中，那么它势必会变得更具有活力。为实现这一目标，他计划举办几场狂欢盛宴，在纸醉金迷之中，他可以调和我们国内的众多精英人士。在他们的支持下，我们将离实现赫斯特的梦想更进一步。"
 CAL_high_tariffs_idea_4:0 "赫斯特的美国梦"
 CAL_high_tariffs_idea_4_desc:0 "赫斯特关于实现精英阶层与政府之间团结的梦想终于要实现了。新的“白宫社交活动”被抛出，以求进一步整合这两大群体。赫斯特坚定地认为，这将使我们的国家实现和平与稳定。"
