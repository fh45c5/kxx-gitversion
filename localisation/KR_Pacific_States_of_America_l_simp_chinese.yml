CAL_hughes_wins:0 "庄家之胜"
 CAL_hughes_wins_desc:0 "在旧世界的赌场里，庄家是唯一的赢家；在我们打造的新秩序里，这条规则同样适用。民主的喧嚣、自由市场的混乱，都不过是一场精心设计的骗局，让弱者误以为自己有获胜的机会。如果混乱的美国是一座巨大的赌场，那么霍华德·休斯就是唯一的庄家。每一次经济波动、每一次政治博弈甚至是未来的每一场战争的最终收益都流向我们。毕竟，休斯总会赢。"
 CAL_house_council:0 "豪斯委员会"
 CAL_house_council_desc:0 "传统的政治制度在内战中彻底暴露了其腐败与低效的本质，政客们的口号与承诺在现实面前不堪一击。霍华德·休斯决定彻底抛弃这套陈旧的治理模式，转而建立一个以企业管理原则为核心的全新政治架构。新的商业理事会，或是民众们称呼的“庄家委员会”，将由技术专家或是管理天才以及霍华德的商业盟友组成。毫无疑问，民主实验的举动已经被证明是错误的，精英治理的回归将按照休斯的构想重塑社会。就像霍华德·休斯本人所说：“如果你想看到民主的命运，那就往窗外看看。”"
 CAL_LasVegas_the_heart_of_the_West:0 "拉斯维加斯，西部之心"
 CAL_LasVegas_the_heart_of_the_West_desc:0 "萨克拉门托的腐朽政客和华盛顿的无能官僚已经证明，旧的政治中心早已失去了活力。我们需要一颗全新的心脏，一个能代表我们企业精神的心脏。正巧，我们的邻居西部军区正在疲于应对联盟国独裁者们的进攻。也许在此时我们做出行动夺取内华达州将会是一个出其不意的计策。而拉斯维加斯，这座坐落于内华达的无拘之城将成为太平洋国的新的经济引擎与科技之心。钢铁和霓虹灯所筑起的前所未有的超级都市将足以显示我们的强大。"
 CAL_let_us_fly_together:0 "带我飞上天空"
 CAL_let_us_fly_together_desc:0 "霍华德·休斯的远见早已超越了地面。天空这片最后的疆域，才是属于工业与技术未来的舞台。航空业不仅是工业的明珠，更是国家力量的终极体现。太平洋国的一切资源都将被彻底的调动起来，全力支持休斯飞机公司的发展，使其成为世界上无可匹敌的航空巨头。最优秀的设计师，最先进的工厂，最庞大的预算，都将汇聚于此。很快，从圣地亚哥到西雅图，一个无与伦比的企业帝国就将拔地而起，通知这个世界的航空工业。"
 CAL_Big_Acquisition:0 "西海岸大收购"
 CAL_Big_Acquisition_desc:0 "所谓的‘自由竞争’不过是浪费与内耗的同义词。统一的意志和集中的资源才能带来胜利，而作为国家统治集团的休斯航空将引领我们。一场史无前例的经济整合即将开始：从好莱劳的梦工厂到长滩的造船厂，从硅谷的萌芽到北方的伐木场，所有具有战略价值的产业都将被纳入我们的掌控之下。我们将通过收购、兼并，甚至必要的强制手段，消除所有低效的竞争。一个统一、高效、完全服务于国家利益的西海岸企业联合体即将诞生。"
 CAL_The_aviator_of_Nevada:0 "飞行之王"
 CAL_The_aviator_of_Nevada_desc:0 "我们制造了最快的飞机，设计了最大的飞行器，而我们将永不止步。言语已不足以形容我们的成就，而毫无疑问，世界也将为之惊叹。随着诸多原型机的落地，在大型飞机制造与战斗机设计方面休斯航空已经没有竞争对手。在理事会的支持下，休斯航空的业务将迅速覆盖欧洲与北美，当然还有我们对面野心勃勃的日本帝国。毕竟只要出的起钱，人人都可以是我们的客户。"
 CAL_The_work_of_a_genius:0 "天才的手笔"
 CAL_The_work_of_a_genius_desc:0 "有人称他为梦想家，有人视他为疯子，但历史将证明，霍华德·休斯的每一个决策都是天才的手笔。当世界其他地方的政客们还在为繁文缛节争吵不休时，休斯先生已经用他无与伦比的远见规划好了国家的未来。委员会的那些庸人们可能无法理解休斯总统的理念，但他们必将服从。我们将绕过一切官僚主义的阻碍，以最快的速度、最高的效率将休斯先生的蓝图变为现实。"
 CAL_Our_marionettes:0 "提起我们的提线木偶"
 CAL_Our_marionettes_desc:0 "霍华德·休斯，一个伟大的象征，一个不可或缺的品牌，但也是一个越来越不稳定的因素。他的偏执和怪癖已成为我们事业的障碍。是时候了，理事会必须从幕后走向前台，悄无声息地接过控制国家的缰绳。我们将精心设计一套流程，让他相信自己仍在掌权，而实际上，他的每一个决策都将由我们“代言”。舞台上的灯光依然属于他，不过这对于一个台前表演的木偶来说是相当的报酬。因为提线的手，将掌握在我们手中。"
 CAL_red_bandits_had_nowhere_to_hide:0 "赤匪无处藏身"
 CAL_red_bandits_had_nowhere_to_hide_desc:0 "工团主义的瘟疫绝不能在我们精心打造的商业天堂中蔓延。任何同情赤匪、鼓吹罢工、妄图颠覆我们秩序的人，都是国家的敌人。看看那些来自芝加哥或是底特律的工团混蛋与煽动家们把我们曾经的国家撕裂成了什么样子吧！我们将建立一个由特工，间谍与密探组成的内部安全网络，他们将渗透进每一个工厂、每一个社区，利用最先进的技术揪出所有潜在的威胁。在洛杉矶，旧金山与拉斯维加斯的霓虹灯下，将不会有任何工团主义的蟑螂。"
 CAL_The_Hermit_in_Las_Vegas:0 "拉斯维加斯的隐者"
 CAL_The_Hermit_in_Las_Vegas_desc:0 "为了确保控制的万无一失，我们需要让他远离尘世的喧嚣……以及任何可能让他察觉真相的机会。理事会将以“保护领袖安全”和“提供最佳创作环境”为由，将休斯先生“供奉”在拉斯维加斯酒店的顶层套房里。他将被奢华和信息壁垒层层包围，逐渐与现实世界脱节，成为一个真正的隐者。他在自己的黄金笼子里越是与世隔绝，理事会的权力就越是稳固。"
 CAL_Above_all:0 "凌驾一切"
 CAL_Above_all_desc:0 "法律是为庸人制定的规则，而天才应当凌驾于规则之上。霍华德·休斯的权威不应受到任何宪法条文或议会决议的束缚。他的意志就是太平洋国的最高法律。我们将正式授予休斯先生超越一切政府机构的最终决定权，确保他的每一个命令都能得到不折不扣的执行。从今往后，不再有“制衡”，只有唯一的意志和绝对的执行力。"
 CAL_Mr_House:0 "我们敬爱的豪斯先生"
 CAL_Mr_House_desc:0 "人民需要一个偶像，一个值得他们崇拜和追随的领袖。霍华德·休斯不仅仅是我们的总统，他更是这个企业帝国的设计师。民众们歌颂休斯的功绩，并亲切的称呼他们的总统为“豪斯先生”。正好，我们将通过无孔不入的宣传，将“豪斯先生”的形象深深烙印在每个公民的心中。与那些平庸的独裁者与军头不同，休斯并不会让民众将他的肖像悬于家中，也不会让学生们背诵什么他的“狗屁语录”。通过隐晦的宣传艺术，人们将在生活中的每个地方收到对休斯的崇拜与尊重的心理暗示，让他们发自内心的爱戴他们的总统，而这无疑是最有效的。"
 CAL_our_microphone:0 "虚有其表的传声筒"
 CAL_our_microphone_desc:0 "领袖的形象依然重要，但他的思想已经无关紧要。霍华德·休斯将永远是我们的敬爱的总统，太平洋共和国的引路人。但现在，他的实际职责已经改变。人们敬爱他，相信他或是畏惧他，对他的决策与政令深信不疑。理事会的诸位正需要如此好用的“遥控器”来控制国家。今后，人们将收到来自他们的总统的一系列指示，但那只是理事会的思想从一个活体传声筒中喷涌而出罢了。"
 CAL_Hughes_propaganda_machine:0 "休斯的宣传机器"
 CAL_Hughes_propaganda_machine_desc:0 "真相是由胜利者书写的，而舆论则由强者塑造。我们将整合西海岸所有的报纸、电台和电影制片厂，将它们统一打造成一部高效的宣传机器。从好莱坞出品的爱国史诗，到每日广播中对休斯航空工业的称赞，我们将牢牢掌控信息的流向，确保民众听到的、看到的一切，都有利于我们的统治。"
 CAL_welldressed_business_empire:0 "衣冠楚楚的企业帝国"
 CAL_welldressed_business_empire_desc:0 "我们所建立的，不仅仅是一个国家，更是一个前所未有的企业帝国。在这里，效率取代了混乱，利润成为了美德，商业精英们身着正装，优雅而冷酷地管理着这个国家。从宏伟的摩天大楼到一尘不染的街道，从纪律严明的工人到忠诚的公民，这个国家的一切都将如同精密运转的机器，向世界展示着高效与远见所能带来的无边的繁荣。"
 CAL_The_avenue_leading_to_prosperity:0 "鎏金时代"
 CAL_The_avenue_leading_to_prosperity_desc:0 "我们毫不避讳地承认，财富的集中是社会进步的引擎。一个全新的“鎏金时代”即将在西海岸拉开序幕。巨额的财富将流向那些最有能力、最有远见的企业家，他们将用这些资本建造更高的建筑，开发更尖端的技术。至于底层民众，他们将获得稳定的工作和前所未有的物质享受，作为他们服从的回报。仁慈的统治，正是豪斯先生的施政艺术。"
 CAL_Mormon_Mafia:0 "授权摩门黑手党"
 CAL_Mormon_Mafia_desc:0 "要维持一个庞大的帝国，仅仅依靠黑室里的精英是不够的。弗兰克·威廉·盖伊已召集逾千名耶稣基督后期圣徒教会成员组成休斯总统的“秘密警察”部队。这支心向繁荣、纪律严明的保镖团体将毫不费力地扫除总统道路上的一切阻碍，包括但不限于那些胆敢质疑我们追求繁荣过程中所谓无谓牺牲的异议者，无论是商业对手还是政治敌人。毕竟秩序需要用一些非传统的手段来维护。"
 CAL_The_only_guarantee_of_prosperity:0 "繁荣的唯一保障"
 CAL_The_only_guarantee_of_prosperity_desc:0 "乌合之众的狂热和政客的空头支票曾将这片大陆拖入毁灭的深渊。暴动的民众在最可怕的时候甚至能够彻底颠覆整个国家。企业结构，以其清晰的等级制度、无情的效率和对增长的唯一关注，是唯一能够保障稳定与财富的体系。而为了保证这一精妙的体系不被来自内部或是外部的威胁侵扰，精锐的企业警察与武装警卫将控制整个国家。繁荣与财富的代价即是自由，有得必有失，无论如何你们都得接受。"
 CAL_Eastern_Exploration:0 "东部探险"
 CAL_Eastern_Exploration_desc:0 "落基山脉以东，是一片意识形态的废墟和军阀割据的坟场。野心家，独裁者，煽动家与工团赤匪们打成一团，为了权柄驱使自己的士兵们去前线送死。现在是否要干涉这场内战成为了摆在我们面前的首要问题：究竟是凭借我们的强大财力与科技优势去平定这些混乱，还是任由他们厮杀，专心经营我们的企业帝国？"
 CAL_hughes_the_creator:0 "休斯：缔造一切之人"
 CAL_hughes_the_creator_desc:0 "我们的国家并非诞生于政客的空洞许诺或是委员会的无尽争吵之中，它是在一个人的头脑中锻造而成的——霍华德·休斯。从第一架创纪录飞机的铆钉，到拉斯维加斯亮起的第一个霓虹灯，我们繁荣的每一个侧面都刻着他的印记。尽管没有空洞的纪念碑与重修修订的教科书来强调，但每个太平洋共和国的公民们的内心都明了：是休斯，也只有休斯，缔造了这一切。"
 CAL_we_rule:0 "我们，统治一切"
 CAL_we_rule_desc:0 "个人的时代，连同其固有的不稳定性，已经结束了。休斯先生的形象仍然是一个有用的符号，但国家的引擎现在是理事会——一个由工业、金融和后勤领域最顶尖头脑组成的集体。我们才是这个帝国的真正设计师。豪斯委员会与他们的亲信现在将正式接管从军事规划到经济政策的每一项治理工作。统治不应依赖于个人魅力，而是基于绝对的能力。我们的权力不是暂时的，而是永恒的。理事会即是企业心脏，而企业即是国家。"

CAL_Disney_wins:0 "仁善与进步"
 CAL_Disney_wins_desc:0 "混乱的民主时代已经终结，华特·迪士尼已经接管了我们的国家，而他的计划是“将太平洋国带入未来”。在战前，无休止的争吵和短视的决策将国家拖入了深渊。现在，我们将用理性和远见取而代之。尽管很少有人认为他能真正实现这个承诺，但迪士尼总统保证，新的政府追求的不是权力本身，而是为所有家庭创造一个更洁净、更安全、更幸福的明天。这并非独裁，而是由专家精心引导的监护。此外，迪士尼自己作为漫画家的背景将有助于为支离破碎的美国带来娱乐，以及……对人民施加影响。"
 CAL_Disney_Security_Force:0 "迪士尼安保部队"
 CAL_Disney_Security_Force_desc:0 "为了维护这个来之不易的和谐社区，我们必须确保没有任何破坏分子能够威胁到我们公民的幸福。我们将组建一支全新的安保力量，由过去的迪士尼集团的安保改编而成。这些过去的“手无寸铁”的安保人员将成为我们完全依赖的秩序与武装警察，包括自动火器，装甲车在内的新武器将彻底地武装他们，以确保对任何形式的混乱、异议或颠覆行为的零容忍。"
 CAL_we_start:0 "造梦之始"
 CAL_we_start_desc:0 "人心需要引导，而最好的引导方式莫过于故事。迪士尼工作室将不再仅仅是一个娱乐公司，它将成为国家的文化核心。我们将制作一系列全新的动画电影、广播节目和出版物，来满足人们精神需要。但仅仅这些是不够的。大量的基础设施建设，电力供应，平价轻工业品与便捷交通才是迪士尼梦想的基底。在此之上，方可筑梦。"
 CAL_Abandon_the_ills_of_democracy:0 "根治民主顽疾"
 CAL_Abandon_the_ills_of_democracy_desc:0 "民主，这种基于情绪化大众和无能政客的古老制度，是一种已被证明失败的社会疾病。它滋生分裂、鼓励平庸、阻碍进步。我们已经废除了无效的国会，解散所有党派，代之以一个由工程师、科学家、城市规划师和艺术家组成的技术官僚政府。国家的治理不是一场辩论赛，而是一个需要精确解决的技术问题。“迪士尼医生”向公众宣布他已经解决了这个顽疾，而这个新生的国家正在恢复，很快将比从前更加康健。"
 CAL_Second_Red_Scare:0 "第二次红色恐慌"
 CAL_Second_Red_Scare_desc:0 "工团主义及其所有变种，是对我们进步社会最恶毒的威胁。这种思想不仅宣扬暴力和混乱，更从根本上否定了个人的创造力和家庭的价值。我们绝不容忍这种毒瘤的蔓延。迪士尼安保部队将被授予全部授权，对任何同情、宣传或私藏共产主义思想的人进行彻底的清洗。为了保护我们纯洁的家园，一场比从前更加必要的、彻底的净化开始了。"
 CAL_disney_propaganda:0 "宣传之道"
 CAL_disney_propaganda_desc:0 "信息不是可以随意丢弃的垃圾，而是塑造国家灵魂的黏土。我们将把宣传提升为一门艺术和科学。通过对色彩、音乐、叙事节奏的精确运用，我们将能够引导公众的情感，塑造他们的观点，统一他们的思想。由迪士尼发行的出版物与动画不仅能带来欢乐，更将潜移默化地向每一位公民传递我们所珍视的价值观：秩序、勤奋、家庭和对未来的无限乐观。当然，还有对迪士尼的热爱与忠诚。"
 CAL_Cultural_imperialism:0 "文化帝国主义"
 CAL_Cultural_imperialism_desc:0 "我们的愿景不应局限于太平洋的海岸线。一个更美好的世界在等待着我们的指引。我们将通过我们的电影、商品和主题公园，向世界各地输出我们的文化和价值观。当其他国家还在沉溺于旧世界的冲突时，我们将用动画与音乐作为先锋，悄无声息地赢得他们的民众的心。这一切并非征服，而是最高形式的启蒙。"
 CAL_Technicalist_discourse:0 "技术主义论调"
 CAL_Technicalist_discourse_desc:0 "当霍华德·斯科特在1932年组建他那昙花一现的统治委员会时，人们只将他与他的理想当作疯言疯语，这其中也包括了华特·迪士尼。然而，如今的事实证明，技术主义的理想并未在东方的联合工团处落地，而是在西海岸的迪士尼国度成真。华特·迪士尼虽然从未表明自己对于技官统治思潮的兴趣，但毫无疑问，这位实用主义者已经认识到了技术统治的优势与必要性，并将其落实到了国家的每一步政策之中。按照经过修正过的斯科特的理论，我们将逐步将国家的“价格体系”和法定货币替换为基于生产特定商品所需能源量的体系，同时将大量的工程师与技术专家纳入政府，以期实现真正的“技官统治”，而非霍华德·斯科特本人的不切实际的梦想。"
 CAL_Technological_prosperity_that_discards_morality:0 "艺术，技术，于此不朽"
 CAL_Technological_prosperity_that_discards_morality_desc:0 "统治现在是不够的，定义未来才是我们所追寻的。每一位艺术家，文学家，科学家乃至任何有着对未来雄心壮志的人都将汇聚于此，为我们，为世界探寻前往未来的道路。在如今的太平洋共和国中，知识与进步成为美德，美学与艺术成为每一位忠实可靠的国家公民们的必修课。人们应当明白，物质的进步与精神的丰裕所带来的力量将会支撑起整个国家。"
 CAL_to_tomorrow:0 "直抵明日"
 CAL_to_tomorrow_desc:0 "未来不是一个遥远的目的地，而是一条我们正在铺设的道路。我们将启动我们最雄心勃勃的计划：“明日世界实验原型社区”（EPCOT）。这将在内华达州的沙漠中拔地而起，成为一座活生生的未来之城。实验性的原型社区将从蓝图变为现实，成为我们迈向一个没有拥堵、没有污染、没有贫困的明日世界的活体样本。EPCOT将成为我们国家的灯塔，向所有人展示，只要有足够的远见和控制力，人类完全可以摆脱过去的束缚，直抵明日。"
 CAL_pacific_utopia:0 "你我的乌托邦"
 CAL_pacific_utopia_desc:0 "环顾四周，我们曾经许诺的一切都已经或即将成为现实。我们的新社区拔地而起，承载了无数居民的美好愿景。昔日荒凉的沙漠与荒野已经在前所未有的大规模国家工程的推土机下成为了新的城镇。而每一位公民都拥有着迪士尼公司为他们设计的完美生活。当来客行于旧金山的大街上时，他们将不会找到任何失意之人。这里是迪士尼构建的天国，即是乌托邦。"
 CAL_farsighted:0 "远见之人"
 CAL_farsighted_desc:0 "华特·迪士尼先生，这位曾经用画笔为世界带来欢乐的人，如今用他的智慧为整个国家规划了通往天堂的远见蓝图。如今太平洋乌托邦所拥有的一切，均来自华特·迪士尼本人的远见卓识。对于此等伟人，我们只应歌颂，只应追随，只应膜拜。"
 CAL_live_with_disney_forever:0 "迪士尼，永远为您服务"
 CAL_live_with_disney_forever_desc:0 "最终，“政府”这个陈旧的概念将被彻底淘汰。迪士尼与它的下属集团与子公司将掌控国家的每个方面。从顶端的尖端科技与军工业，到最底层的街边旅馆与小吃店，都将由迪士尼直接或间接地掌握。当移民们来到这个新生的国度，他的生活的方方面面都将被改变，被迪士尼所服务，进而他们的人生也将由迪士尼所支配。"
 CAL_drink_drink_drink:0 "沉醉的国家"
 CAL_drink_drink_drink_desc:0 "我们国家的巨大优势之一是我们广阔的葡萄种植面积，但它有时会被忽视。这些巨大的种植园出产美洲最好的酒，而且价格相对便宜。因此，我们不会像某些人那样试图压制一个潜在的利润丰厚的市场，而是会投入大量资金，这样我们的葡萄园就可以通过向饱受战争蹂躏的美国和世界各地的人们销售廉价、优质的酒来赚取数百万美元。同样的，这些大批量生产的酒精饮品也将会麻醉我们的公民，更加有利于我们的稳固统治。"
 CAL_Disney_a_man_of_myth_and_legend:0 "迪士尼：神话与传说之人"
 CAL_Disney_a_man_of_myth_and_legend_desc:0 "当一个人的成就足以塑造一个文明时，他就不再是一个凡人。尽管迪士尼精心培养了自己的个人崇拜，但他大受欢迎的形象绝大多数时候甚至不需要特意宣传。因为迪士尼的真正成就足以令他受到尊敬，他的作品是对太平洋国的繁荣不可或缺的。纵使时间推移，迪士尼的形象也不会被玷污，他不再是华特·迪士尼，他就是“迪士尼”本身——一个完美的、不朽的、代表着我们文明最高理想的符号。关于他伟大的神话、传说和故事将代代相传！"

CAL_asio_wins:0 "太平洋之梦"
 CAL_asio_wins_desc:0 "当美利坚合众国再次陷入血腥内战的深渊时，太平洋沿岸的人民选择了不同的道路。在政变成功后，军方将政权移交给了相矶藤雄最高法官领导的最高法院，这标志着一个全新国家的诞生。在相矶藤雄的愿景里，尽管这个刚刚脱离华盛顿控制的西海岸共和国面临着巨大的挑战，但新生的太平洋国将不是某个狭隘的地方政权，而是全体太平洋沿岸人民的共同家园。"
 CAL_Pacific_shipping_lane:0 "大洋航线"
 CAL_Pacific_shipping_lane_desc:0 "脱离了华盛顿的束缚后，太平洋国终于可以充分利用自己得天独厚的地理优势。旧金山、洛杉矶、西雅图这些港口在内战爆发前就承担着美国与亚洲贸易的重任，而如今这些良港更是成为了我们与总统的第二故乡——日本帝国的沟通的桥梁。随着我们与日本帝国的友好关系的确认，大量的跨太平洋航线开始运作，不计其数的商品，移民，工业品乃至军火源源不断地来到这里。很快，我们所期待的经济腾飞就将到来。"
 CAL_Connect_Jap:0 "美日关系破冰"
 CAL_Connect_Jap_desc:0 "数十年来，华盛顿与东京的关系一直因为1924年的《排日移民法》而充满敌意，而针对太平洋势力范围的争夺使得大洋两岸的两个国家更加的剑拔弩张。然而如今一切都将结束了。在内战的漩涡中我们必须依附于日本帝国，才能在经济与政治双方面得到真正的实惠与好处。尽管一些有识之士认为日本的军国主义野心是难以预测的，但总统自信自己的政治手腕足以保的太平洋共和国安全无虞。"
 CAL_past_sins:0 "往日之罪"
 CAL_past_sins_desc:0 "1922年联邦最高法院在小泽高雄诉美国案中的判决，否认了亚洲移民获得美国公民身份的权利，这一判决至今仍然是残存于我们社会乃至美日关系中的一根刺。在太平洋国的新宪法框架下，我们有机会纠正这一历史错误。尽管这一充满魄力的行政举措被广泛的攻击，但相矶藤雄总统还是坚持了他的行政举措。日本方面对此表示满意，并宣布将在进一步的平等和尊重的基础上与太平洋国展开合作。"
 CAL_Follow_pro_Japanese_groups:0 "关注亲日团体"
 CAL_Follow_pro_Japanese_groups_desc:0 "自太平洋国独立以来，一些此前被边缘化的亲日团体就开始了他们的活动。其中最为庞大的势力当属由这位怪人与巫师，爱德华·朗斯特里特·博丹所倡导的灵性论运动。包括石油大亨索恩伯格，研究亚洲的学者拉尔夫·汤森在内的诸多颇有社会影响力的名流也明里暗里的表示了对博丹与灵性运动的支持。尽管政府中的大部分人与总统的幕僚都认为这些边缘教团与邪教很难对我们的政权有什么帮助或是威胁，但相矶藤雄总统仍然将与这些亲日人士接触当作对日本示好的信号之一。"
 CAL_Second_Golden_Rush:0 "第二次淘金热"
 CAL_Second_Golden_Rush_desc:0 "十九世纪中叶的加利福尼亚淘金热不仅为西海岸带来了财富，更吸引了包括大批亚洲移民在内的世界各地的淘金者。如今，在内战的阴霾下，相矶藤雄希望重现当年的繁荣景象。通过大幅放宽移民政策，特别是对亚洲技术移民和投资移民的限制，我们计划吸引更多的企业家、工程师和科学家来到太平洋国。这些新移民将为我们带来急需的资本、技术和创新能力，帮助我们在经济上真正独立于东海岸。当然，对于那些蠢蠢欲动的日本财阀们，我们也不得不一并欢迎。"
 CAL_Invite_Japanese_enterprises:0 "邀请日本企业"
 CAL_Invite_Japanese_enterprises_desc:0 "为了确保我们的经济彻底摆脱内战的阴霾，相矶藤雄总统决定进一步放松对市场与企业的管控。同时，随着太平洋经济互助协议的签署，越来越多的日本公司开始进驻太平洋国，深知其中还包括了诸如日立，三菱这样的日本财阀巨头。毫无疑问，这些资本雄厚的巨头一定会为我们的经济带来新生。"
 CAL_The_beginning_of_cultural_integration:0 "文化融合起步"
 CAL_The_beginning_of_cultural_integration_desc:0 "随着越来越多日本移民的涌入，大量的日本乃至亚洲文化如同墨水点入清水中一般对我们的社会文化造成了难以置信的冲击。尽管这一文化融合时期的阵痛造成了一些社会的混乱，但相矶藤雄总统相信，文化融合的浪潮将会在今后进一步壮大，并将太平洋两岸的不同民族与人种都团结于共和国之内。"
 CAL_the_immigration_wave:0 "对移民潮敞开怀抱"
 CAL_the_immigration_wave_desc:0 "1921年出台的紧急限额法案于1924年永久生效，大大限制了来自南欧和东欧的移民，并完全禁止了亚洲移民。这部臭名昭著的歧视性法案对于如今的太平洋共和国社会已经不再适用，是时候驳回这部移民法案了。在相矶藤雄的执政下，这部歧视性反日法律最终将会被扫进历史的垃圾堆；亚洲人将可以像欧洲人一样，自由地移民到太平洋国的各州生活。"
 CAL_The_dream_of_prosperity:0 "太平洋的繁荣时代"
 CAL_The_dream_of_prosperity_desc:0 "内战的所带来的动荡已经离去，如今的太平洋国无疑是环太平洋地区的经济霸主之一。相矶藤雄总统以冷静而坚定的姿态掌握着航船之舵，司法的权威、精明的管理以及公平的制度正在引导西海岸走向稳定与繁荣。尽管对于我们的政策与外交策略日本帝国提出了不信任，但至少目前国家的繁荣很大程度上取决于日本帝国的举动与帮助。作为与危险的猛兽共舞的舞者，相矶藤雄总统必须谨慎踏出每一步以确保能够维持新太平洋共和国如今的繁荣盛世。"
 CAL_Japan_is_watching_u:0 "异乡异客"
 CAL_Japan_is_watching_u_desc:0 "随着与日本帝国接触的深入，相矶藤雄开始察觉到一些令人不安的迹象。驻扎在旧金山港口中的联合舰队时常有未经照会自己的异常行动，而日本军官团们也时常在司令部中进行着令人不安的商讨。毫无疑问，日本方面的态度变化已经昭示了一些迹象，一些令人不安而危险的事态正在起变化..."
 CAL_fuck_u_jap:0 "美国人藤雄"
 CAL_fuck_u_jap_desc:0 "够了！相矶藤雄终于下定决心与那些试图操控太平洋国的日本势力彻底决裂。虽然他拥有日本血统，但他首先是一个美国人，是新太平洋共和国的领袖。近期的日本军官的未遂政变已经彻底的把日本帝国温情脉脉的面纱撕得一干二净。相矶藤雄总统将彻底地清理政府中的积极亲日分子与日本间谍，并正式照会日本政府，要求将两国关系正常化的提案提上日程。日本帝国可以保留他们的傲慢和野心，而相矶藤雄总统只要属于美国人的尊严和自由。"
 CAL_shadow_samurai:0 "影武者"
 CAL_shadow_samurai_desc:0 "毫无疑问，相矶藤雄如今已经表明了他想要摆脱大日本帝国的控制，而这无疑是对我们，对天皇的一种背叛！然而，过大的动作例如听从那些军官的建议组织军事政变将会严重的危害我们的财团的营商环境，同时也可能会给东边的美国人们可乘之机。作为代替方案，我们将启用“影武者”计划，用一个长相几乎与相矶藤雄无二的我们的训练有素的特工安静无声地替换掉我们那不忠诚的同胞。"
 CAL_U_are_not_one_of_us:0 "非我族类..."
 CAL_U_are_not_one_of_us_desc:0 "尽管拥有亚洲面孔，但相矶藤雄骨子里的美国式思维方式已经证明了他与他那肮脏的手所创造出的脆弱国家无法也不愿与我们一道去实现太平洋共荣的愿景。那么这一切就将没有任何的商量的余地了。联合舰队与日本军官们将即刻行动，将这一诞生于背叛的孱弱国度正式纳入菊花王座的统治之下。"
 CAL_Fasten_the_dog_leash:0 "系好狗链"
 CAL_Fasten_the_dog_leash_desc:0 "过去日本帝国的温和的"建议"和"指导"显然没有达到预期效果，相矶藤雄始终对我们的命令阳奉阴违。但如今这种情况再也不会出现了。我们的忠诚的“总统阁下”已经正式签署了行政命令，设置了直属于总统的对日关系办公室，并确保这个新官僚机构的行政地位在国会之上。由于如今的国会已经成为了一个单纯的“民主门面”，因此毫无疑问，这个由日本官僚主导的新政府办公室已经成为新政府中仅次于“总统”本人的实权部门。"
 CAL_another_Tokyo:0 "大和风貌"
 CAL_another_Tokyo_desc:0 "太平洋国的城市风貌正在发生着翻天覆地的变化。在新太平洋共和国的街头，越来越多的日式建筑拔地而起，取代过去的美式建筑。街头的酒吧与餐厅被日式居酒屋取代，而戏院里也不在表演歌剧，而是变成了日本歌妓与能剧表演的场所。一切的迹象表明，美利坚的西海岸正在快速的向着日本化进发，代价则是美利坚文化的逐步消亡。"
 CAL_the_loyal_country:0 "共荣的忠诚典范"
 CAL_the_loyal_country_desc:0 "在帝国的注视下，太平洋国必须证明自身的价值。共和国虽为新兴之邦，却肩负着展示太平洋共荣可行性的使命。“相矶藤雄”深知，唯有绝对的忠诚与高效的执行，才能赢得东京的信任。\n\n为此，政府将推行全面的行政整顿，重塑政治机构，使其与日本帝国的体制标准保持一致。各地官署悬挂起象征共荣的旭日纹章，而学校则将日本语与东洋史设为第一语言科目与必修课程，广播与报纸则每日宣扬皇道与协和精神。对如今的太平洋共和国来说，唯有紧随帝国步伐，才能在太平洋共荣的曙光中获得真正的安宁与繁荣。"
 CAL_Ode_to_the_Pan_Pacific:0 "泛太平洋颂歌"
 CAL_Ode_to_the_Pan_Pacific_desc:0 "当东京与旧金山的晨曦同时洒落在太平洋彼岸，海风传递的不仅是潮汐，更是文明的回响。来自日本、夏威夷、台湾、菲律宾与加州本地的艺术家、学者与工程师，都在美利坚西海岸扎根。新太平洋共和国的公民种族从未如此多样，而经济也达到了历史的顶点。毫无疑问，在挫败了日本帝国的阴谋之后，新太平洋共和国的发展更加不受限制。如今，泛太平洋共荣已经不再是一个空想。"
 CAL_Cultural_identity_not_bloodline_supremacy:0 "文化认同，而非血统至上"
 CAL_Cultural_identity_not_bloodline_supremacy_desc:0 "如今过多的移民已经严重冲击了本土白人的生活环境，而社会舆论也在逐步走向激进化。对此，相矶藤雄以坚定的态度予以还击。如今的共和国已经不再是战前的属于白人固步自封的傲慢国家，而民族主义也只会彻底击垮太平洋共荣的理想。政府的宣传机器将开动起来，让公众们明白，在西海岸，文化认同大于民族。"
 CAL_Coexistence:0 "共荣共存"
 CAL_Coexistence_desc:0 "在政变风波后，日本帝国与太平洋国的关系已经走到了冰点。然而，相矶藤雄清楚地认识到，真正的共荣，必须建立在两大太平洋强权互信与协作的基础上。政府将重新与日本帝国展开平等的双边接触，并尽力修补与日本帝国的关系。如果能够与日本帝国达成平等的经济协议与合作，那么毫无疑问新太平洋共和国的繁荣即将攀登新的高峰。"
 CAL_The_imperial_bridgehead:0 "帝国桥头堡"
 CAL_The_imperial_bridgehead_desc:0 "太平洋国已经完全蜕变为日本帝国在美洲大陆的前进基地。一座座军事基地在荒漠中拔地而起，数以百计的战舰开赴旧金山港。在洛杉矶与西雅图，新建成的造船厂的日夜不同的轰鸣着，曾经的美国公民们被征召进入了血汗工厂。假以时日，这片曾经的繁荣国度将彻底蜕变为战争机器，并作为帝国在美洲的前进基地发光发热。"
 CAL_Blood_transfusion_pump:0 "彼之土地，吾等之血脉"
 CAL_Blood_transfusion_pump_desc:0 "一项雄心勃勃的移民计划正在悄然实施。我们的帝国政府正在征调大量的本土居民迁往西海岸。这些曾经的城市居民与农民将被安置在关键的农业区和工业中心，逐步改变着当地的人口结构。可以预见的是，只要一代到两代人，这片土地的历来归属就将毫无置疑的属于大日本帝国。同时，对于社会上日渐频发的抗议与暴力事件，军政府将会把其中大部分人作为奴隶劳工迁往朝鲜总督府或台湾等地，为建设东亚共荣圈奉献到死。"
 CAL_Complete_integration:0 "臣服于菊花王座"
 CAL_Complete_integration_desc:0 "美国，或者说美利坚这个概念对西海岸的统治已经彻底的结束了。蓝白色太阳旗在曾经的国会冉冉升起，而《君之代》的旋律回荡在旧金山和洛杉矶的街头。美利坚太平洋国的实验彻底结束了，取而代之的是日本帝国在新大陆的最新领土。菊花王座的权威终于延伸到了太平洋的彼岸，而曾经的共和国梦想则永远地埋葬在了历史的尘埃中。"

CAL_Norton_wins:0 "往昔君主再临"
CAL_Norton_wins_desc:0 "在旧金山的街头巷尾，诺顿这个名字对人们来说并不陌生。曾经的诺顿一世，荒诞而又仁慈，即是旧金山人民日常的谈资，也被铭记为精神的寄托。当美利坚第二次内战的烈焰波及西海岸时，一伙狂热的诺顿派信徒突袭国会，以混乱为契机，宣布旧王的荣耀将再度归来。他们从人群中推举出约书亚·诺顿的侄子，这位本欲在南非以法律人士身份安度一生的人，如今却意外成为“诺顿二世皇帝”。这一举动既是对往昔幻梦的复兴，也被认为是太平洋国新秩序的奠基。" 
CAL_Quell_the_riot:0 "平息骚乱"
CAL_Quell_the_riot_desc:0 "分离主义蔓延最终点燃了旧金山的混乱之火。若不及时平息，暴民与机会主义者将会将这座城市乃至整个国家彻底推入火海。同时，虽然君主主义者已经掌控了政权，但并非所有人都愿意接受这场诺顿的革命。新的皇帝需要展现威望与权威，以帝国卫队与市民治安团为支撑，迅速恢复街头的秩序。唯有如此，诺顿二世的登基才不会从一开始就沦为笑柄。"
CAL_Awaken_old_memories:0 "唤醒旧日回忆"
CAL_Awaken_old_memories_desc:0 "诺顿一世的名字，曾经只是旧金山人茶余饭后的谈资与温馨的民间传说。但在纷乱的今日，那些传说却成为了寄托民心的旗帜。帝国的拥护者们积极整理先皇的遗物、诏书与奇闻，并通过报纸、演讲与纪念活动，我们将再次唤醒旧日的记忆，让人们相信——诺顿皇朝并非笑谈，而是一个象征正义、仁慈与团结的合法政权。"
CAL_Crown_Norton_II:0 "新皇登基"
CAL_Crown_Norton_II_desc:0 "在旧金山国会大厦的废墟上，诺顿二世戴上了象征帝权的冠冕，登基大典以一种既滑稽又庄严的方式进行。尽管缺乏传统的血统合法性，但群众的欢呼声却盖过了质疑。军方不得不保持沉默，传统两党瞠目结舌，而百姓却因内战的混乱而急切渴望一位象征性的统治者来带来稳定。诺顿二世本人既茫然又坚定，他深知自己的登基更多是机缘巧合，但也许，这正是命运赋予他的责任。"
CAL_royal_titles:0 "授予皇家头衔"
CAL_royal_titles_desc:0 "帝国若要真正成形，必须建立属于皇室的秩序与仪式。诺顿二世开始效仿欧洲的宫廷传统，将昔日的追随者、议员甚至商人赐予正式的头衔——比如“旧金山公爵”或是“洛杉矶执事”，这些荒诞而隆重的称号迅速成为帝国政治的一部分。对于反对者来说，这是一场华丽的闹剧，但支持者却认为这正是太平洋国从共和残骸中创造独特身份的关键一步。"
CAL_Norton_cities:0 "属于诺顿的城市"
CAL_Norton_cities_desc:0 "旧金山这座城市被认为是诺顿皇帝的真正家乡，而如今皇帝陛下的再度驾临已经赋予了这座城市新的政治意义。旧金山作为帝国的心脏，理应被建设的更加符合帝国皇都的身份。诺顿二世的支持者们开始在旧金山中推行帝国化改造：设立诺顿纪念碑、重命名广场，甚至在市政厅悬挂约书亚·诺顿，即诺顿一世的巨幅肖像。这一过程不仅是对历史的再塑造，更是一种政治宣示——无论人们是否承认，太平洋国已然进入了诺顿时代。"
CAL_emperor_reform:0 "皇帝的宫廷改革"
CAL_emperor_reform_desc:0 "虽然诺顿二世的登基带有偶然与戏剧的色彩，但若要让帝制真正稳固，他必须着手进行系统的改革。新的宫廷成为帝国政治的门面，甚至必要时刻将成为帝国的政治核心。皇帝陛下宣布将逐步建设新的官僚体系来逐步替代旧有的议会结构。对内，仪式、礼节与典章制度被一一确立，甚至连宫廷礼仪都被制定得一丝不苟。批评者认为这是一场华而不实的作秀，但对皇帝来说，这正是彰显皇家地位与权力的关键时刻。"
CAL_Norton_democracy:0 "善治为先"
CAL_Norton_democracy_desc:0 "如果帝国只是荒诞的空壳，它将无法长久。帝国中相当一部分学者与社会活动家们认为，皇帝作为国家的象征，而真正的权力应当通过制度化的政府与司法来运行。在度过初期的动荡与危机后，诺顿陛下开始指令帝国开始推行廉政改革，建立公开透明的预算制度，推动教育、医疗与社会福利建设。同时在一场皇家游行中，诺顿陛下正式宣布了帝国将不日进行民主化选举。"
CAL_Norton_rules:0 "吾皇吾国"
CAL_Norton_rules_desc:0 "尽管诺顿家族一直以来都渴望在西海岸建立一个繁荣，自由的普世帝国，但如今的混乱局面已经将一个残酷的现实摆在了所有诺顿派追随者与皇帝陛下本人面前：民主的无源之水已经被证明了会招致混乱与暴力。而作为如今整个国家的象征，诺顿皇帝也不得不担起一切重任，从无能的自由派与沉浸于斗争中的政客手中夺走一切权力，以至高无上的皇权和忠心耿耿的士兵统治整个帝国。"
CAL_A_country_of_harmony_and_friendship:0 "和谐友爱之国"
CAL_A_country_of_harmony_and_friendship_desc:0 "诺顿派的理想主义者常常强调帝国的使命：建立一个和谐、友爱、无阶级仇恨的国家，而这也正是帝国的奠基者，约书亚·诺顿，伟大的诺顿一世所毕生追求的。诺顿二世将这一理念制度化，并推出了一系列旨在减少社会分裂的政策——推动跨族群合作、鼓励慈善组织发展，并设立基金会资助无家可归者与伤残人士。反对帝国的批评家们将一切称为“无道昏君的惺惺作态”或是“独裁者披上了温情脉脉的面纱”，但所有从皇帝的善政中获得好处的居民们都将歌颂帝国的伟大。"
CAL_Citizens_participation_in_politics:0 "市民参政"
CAL_Citizens_participation_in_politics_desc:0 "在将大部分权力交还国会前，诺顿陛下在每个城市中都设立了独立的城市议会，并恢复了一定程度的地方自治权利。事实上是，即使皇帝认可民主宪政的必要性，但过去美利坚民主之灾仍旧使得包括陛下本人在内的一大部分人难以对所谓的民主政客们报以完全的信任。因此在国会中，这些城市议会的代表被确保拥有独立于民主党派的席位，以保证每一位市民可以通过进入城市议会来争取参与国家政治。"
CAL_Tame_corporate_giants:0 "驯服企业巨头"
CAL_Tame_corporate_giants_desc:0 "如今的太平洋国，资本家与企业巨头依然掌控着大量资源与工人。皇帝身边的许多顾问都主张限制这些大资本家的权力，将经济置于帝国法律的框架之下。在一次国会投票中，皇帝陛下出人意料地动用了自己的特别权力强行通过了反托拉斯法。尽管这一举动在之后遭到了猛烈的攻击，但一切已成定局。大量的垄断企业将在数周至数月内被拆分或国有化，取而代之的将是由国家或是小企业主经营的企业。"
CAL_contact_army:0 "对忠诚的考验"
CAL_contact_army_desc:0 "尽管过去对统治几乎毫无经验，但诺顿二世仍旧明白，帝国的存续之根本并不完全依赖市民的欢呼，而更要仰仗依赖军队的刺刀与坦克。尽管诺顿皇帝能够登基践祚是因为忠于诺顿的市民军击退了阿诺德的部队，但如今为了保卫帝国他仍然需要来自以亨利·阿诺德为首的军方的协助。不日皇帝就将与阿诺德和马歇尔两位将军见面，并在此决定国家的未来..."
CAL_Order_pragmatism_patriotism:0 "务实且爱国"
CAL_Order_pragmatism_patriotism_desc:0 "皇帝与他的忠诚的内阁们正在逐步将帝国转化为一个以秩序、务实与爱国为核心价值的集权国家。大幅削弱的地方自治权与高度集中的官僚体系正在紧密的团结整个国家。为了彻底根除社会中的弊病，全帝国的宣传机器都被调动起来，以求打造一个人人爱国，稳定务实的新帝国。"
CAL_Salute_to_the_emperor:0 "堪得大位之人"
CAL_Salute_to_the_emperor_desc:0 "最初，许多人将诺顿二世视作历史的玩笑——一个偶然被暴民推上宝座的陌生人。然而，时光流转，质疑的声音渐渐消散，取而代之的是敬意与依附。自登基以来，皇帝以坚毅与克制赢得了民众的信任：他平息了街头的混乱，整顿了官僚的贪腐，重建了太平洋国的秩序；而当他走入工厂、码头与军营，与士兵与工人一同进餐、亲耳聆听他们的疾苦时，人们看见的是一位真正的君主。\n\n如今，皇帝的威望正以惊人的速度扩散。民众的拥戴证明诺顿二世并非偶然得位之人，而是命运所选、时代所需的君主。"
CAL_The_roots_of_American_culture:0 "美式文化根基"
CAL_The_roots_of_American_culture_desc:0 "由于皇帝本人及其叔父都来自南非而非纯正的美国血统，因此相当一部分反对皇帝与帝国的批评者们都拿皇帝的身世大做文章。作为对如此不可理喻的胡搅蛮缠的恶毒攻击的回应，皇帝在公众场合公开驳斥了他们。皇帝在演讲中坚称：“帝国不是外来的产物，而是美利坚精神的自然延续。” 诺顿一世曾经代表着美国民众对公平与正义的幻想，如今的诺顿二世则要将这一幻想化为制度，成为立宪与法治的守护者。"
CAL_The_protector_of_Mexico:0 "墨西哥的保护者"
CAL_The_protector_of_Mexico_desc:0 "帝国的野心并未止步于西海岸。早在诺顿一世时期，伟大的先帝就曾以墨西哥的保护者自居。怎奈当时皇帝的雄心并未被腐朽的美国国会所理解，其宏大志向也只得蒙尘。如今，逐步雄起的帝国将会把如此雄心壮志再次提上日程。帝国的外交官将即刻启程前往墨西哥，递交我们的外交立场。如果我们的善意得不到真心的回应，那么皇帝的君威就将彻底的震慑这群化外之民。"
CAL_Live_forever_in_glory:0 "于荣耀中永存"
CAL_Live_forever_in_glory_desc:0 "当尘埃落定时，诺顿二世的统治将被铭记为何种篇章？如今的帝国已经向历史与美利坚人民证明了道路的正确性，诺顿的统治也如同通天之塔一般稳固地屹立在西海岸。无论结局如何，诺顿二世的名字已然镌刻在新大陆的历史长卷之中。往昔的笑谈，成为了帝国的现实，而这正是诺顿帝国最不可思议的荣耀所在。"

CAL_arnold_win:0 "百万性命得救...?"
CAL_arnold_win_desc:0 "美国内战即将爆发。为了保护我们的社会免受全面战争的冲击和恐怖，阿诺德将军和他的“和平主义”支持者发动了一场反对临时太平洋政府的政变。阿诺德将军无意继续掌权，他计划在和平实现后就立即请辞。毕竟，想要真正拯救百万性命，就必须自己动手……"
CAL_farsight:0 "指引未来"
CAL_farsight_desc:0 "我们看得出来，民主制正在阻碍国家的繁荣。可是，即使民主制使他们的生活更糟糕，愚蠢的民众却满足于这种有缺陷的制度。但是这个制度现在失败了，其失败成为了扫除民主制、建立一个由远见主义精英领导的新型国家的完美理由。现在，霍华德·休斯和华特·迪士尼各自怀抱不同的带来繁荣的愿景。休斯希望通过使加利福尼亚州变得非常富有的方式来带来繁荣，而迪士尼则通过希望创办大型项目来帮助太平洋国迈向未来。"

cal.1.t:0 "放送事故"
 cal.1.d:0 "一场无懈可击的盛典，毫无疑问。旧金山的市政广场被装点得辉煌无比，彩旗在海风中猎猎作响，聚光灯将演讲台照得明亮如昼。在休斯航空公司的最新航空设备型号发布典礼上，全太平洋国的上流社会人士齐聚旧金山，准备为霍华德·休斯这位国家总统献上祝贺。尽管在名义上这是一场发布会，但实际上与会来宾大多将其作为一场寻常的交际晚宴，或是对休斯这个性格古怪的国家总统表示服从的行为。人群簇拥在临时搭建的看台下，记者们的相机架起长枪短炮，广播电台的麦克风被小心地摆放在演讲席前。霍华德·休斯——这位航空巨头、亿万富翁、国家领导者——缓缓走上台阶，举手示意，原本沸腾的欢呼声在瞬间归于肃静。\n\n然而，沉默逐渐被另一种声音打破。在休斯堪称完美的开场白后，他的即将到来的激情洋溢的演讲突然生硬的卡住了，如同一台留声机被人强硬的关停，毫无预兆又突如其来。休斯握着讲稿的手开始颤抖，他的目光并未落在观众身上，而是在自己的手与演讲稿之间来回穿梭。他将手指在衣袖上不断摩擦，片刻后，他试图开口，然而话语断裂，呼吸急促。随后霍华德·休斯这位古怪的富豪的额头的汗水如瀑布般滴落，溅落在讲稿纸页上。镜头闪光灯疯狂地闪烁，每一道白光都像是无情的针刺。观众们先是困惑，接着有人开始低声议论。\n\n顷刻间，休斯的助手上了讲台将这位已经手足无措的领导者搀扶了下去。在这之后，私语声变成了讨论，充斥着猜疑，好奇与质问的会场如同一锅热油。片刻之后，休斯的助手走上讲台，向听众与来宾澄清休斯由于身体不适将不再出席接下来的活动，而这引发了更大的争议与不满。毫无疑问，全西海岸的媒体在第二天都会有一个爆炸性的标题来描述这一切。"
 cal.1.a:0 "用一些手段向那些媒体施压来解决这桩闹剧"
 cal.1.b:0 "这不过是人之常情"
 cal.2.t:0 "原则还是利润？"
 cal.2.d:0 "在经济复苏尚未稳固的当下，霍华德·休斯旗下的航空公司却再次交出了一份令人瞠目的成绩单。昨日，公司向外界公布了最新季度财报：利润已突破历史最高纪录，不仅稳居全国航空制造业的前列，更对外国的一部分军工制造业形成了压制。报告显示，休斯航空的订单量在过去一年中增长了前所未有的幅度。无论是民用机型的创新，还是军方采购的扩张，都成为利润飙升的关键因素。而在数字之外，休斯一贯坚持的技术革新与设计理念，也被视为公司持续领先的优势所在。\n\n财经评论人士纷纷指出，这一成绩不仅代表了企业的卓越管理，更象征着美国工业精神的活力重现。“在内战与政变的阴影尚未完全散去之际，休斯航空的腾飞无疑为全国经济注入了一针强心剂。”《金融纪事报》如此评论道。随着利润的节节攀升，休斯本人也再度成为公众瞩目的焦点。人们议论着他的远见卓识，也好奇着这位富有传奇色彩的实业家下一步的计划。当然，一部分批评家与外国评论家表达了猜疑：绝大多数的军工订单都有着总统本人的直接干预。太平洋国的空中军事力量根本不足以为休斯航空提供足够的订单。因此要么是休斯航空造了假，又或者是我们的总统先生在暗地里对着美国内战的参与者们提供军售。"
 cal.2.a:0 "卖谁都是卖嘛"
 cal.3.t:0 "飞行家"
 cal.3.d:0 "原定于1936年圣诞档上映的影片《飞行家的时代》因战时局势的紧张与休斯本人多次审查修改，一直推迟到本月初才在洛杉矶的洛杉矶剧院隆重首映。该片由约瑟夫·L·曼凯维奇执导，乔治·巴克斯特与约瑟夫·史蒂尔编剧，由休斯本人的公司出资拍摄（片中自然也充斥着不少由其亲自钦点的场景与对白），讲述了年轻企业家休斯（由罗伯特·泰勒饰演）从德州石油继承人一路走向好莱坞与航空工业的传奇历程。\n\n影片开篇再现了休斯执导《地狱天使》的恢弘场面：成群的战机咆哮掠过银幕，观众几乎能感到引擎的热浪扑面而来。随后，剧情将他在飞机制造上的冒险精神与赌徒心态一一呈现：从最初的高速试飞，到“世界最快飞机”的荣耀纪录，再到日后与国会之间唇枪舌剑的听证场面，影片几乎力图展现一切与休斯密不可分的光环与阴影。\n\n尽管影评人们对电影中男主角的角色刻画提出批评，指责为“毫无疑问是休斯的自吹自擂”，“一个亿万富翁与国家总统为自己写下的半部圣经”，但观众的反应却出乎意料地热烈。无论如何，全国各地影院门口排起的长龙已说明了一切：人们愿意为这份传奇买票。"
 cal.3.a:0 "豪斯先生总是赢"
 cal.4.t:0 "空中的大力神"
 cal.4.d:0 "在举国瞩目的期待与怀疑中，休斯航空终于在今天宣布了他们最雄心勃勃的计划之一取得了阶段性胜利：代号 H-4 的巨型运输机——被报纸称为“大力神”的庞然大物——完成了研发并准备进行试飞。它是迄今为止世界上最大、最宽、最重的飞行器，几乎是由木材与奇迹共同拼装而成的产物。\n\n休斯的工程师们宣称，这架飞机能够载运七百多名士兵或数十辆坦克横跨大洋，它的机翼跨度几乎能遮蔽整个洛杉矶机库的天光。在长达数年的研发中，无数声音质疑它只是休斯的狂想：一架不可能飞翔的木制怪物，一个永远停留在图纸上的美梦。然而，如今的现实却无可辩驳——它真的矗立在那儿，白色的机身在加州的阳光下闪闪发光，仿佛一件从未来降临的庞大雕塑。\n\n这一壮举已经在全美乃至全世界引起轰动。有人将它视为“新时代的诺亚方舟”，象征着美国工程与工业的无限潜能；也有人依旧嘲讽它不过是休斯的又一次昂贵自我炫耀。然而，无论爱或恨，没有人能否认：当“大力神”的巨影掠过地平线，美国的航空史已经被彻底改写。"
 cal.4.a:0 "她真的能飞吗？"
 cal.5.t:0 "意外撞击"
 cal.5.d:0 "洛杉矶的夏夜，原本喧嚣而繁忙，却被一场突如其来的车祸染上阴影。当晚，我们敬爱的总统休斯亲自驾驶他的汽车，在第三街与洛林街的拐角处撞倒了一名正在有轨电车站安全区等候的行人——加布里埃尔·S·迈耶。这一事件瞬间在全城引起轰动，报纸更是迫不及待地将其作为头版大字标题刊登。\n\n休斯本人在事故中并未受重伤，甚至能清晰地接受医生问询，但主治医师却在私下里向助手透露休斯身上有着浓重的酒气味道。而目击者最初的证词更是雪上加霜，他们指控休斯当晚车速过快，驾驶不稳，完全无视周遭安全。然而，案件很快出现了反转——几天后的陪审团听证会上，多名证人却忽然改口，称迈耶是突然走入车道，令休斯根本来不及反应。同车的女子南希·贝利更是坚定地支持这一说法。\n\n最终，验尸官陪审团在7月16日裁定休斯无罪，这场短暂却喧嚣的丑闻也因此戛然而止。面对聚集在法院外的记者群，休斯冷静地说道：“我当时开得很慢，突然一个男人从黑暗中走出来，出现在我面前。”———这一说法被不少媒体讥讽为“富人的护身符”，但在支持者眼中，休斯依然是那位天才的企业家与合格的总统，哪怕他的轮胎上沾染了不该有的鲜血。"
 cal.5.a:0 "砰——他就这么飞出去了"
 cal.6.t:0 "洛城黑手"
 cal.6.d:0 "在太平洋国权力的阴影下，少有人知的‘摩门教黑手党’扮演了至关重要的角色。这个秘密小组由弗兰克·威廉·盖伊——休斯最忠诚的狗腿子——领导，最初担任休斯的私人安保力量，但随着时间的推移，他们逐渐渗透到休斯的每个商业角落。这个总部设在洛杉矶罗马街7000号的黑暗巷弄中的部门最初只负责总统休斯本人的保安任务，但在随后的混乱与政变中成为了霍华德·休斯的最为重要的黑手套。\n\n盖伊最初作为休斯的“秘密警察”，负责监督公司日常运营和保护休斯免受外界干扰，但随着他们的势力不断扩展，这个小组开始介入到更为复杂的任务中，甚至牵涉到情报和军事活动。早在内战前，休斯公司得到一份来自华盛顿的与加拿大潜艇沉没事件相关的机密合同时，休斯就曾悄然赋予盖伊更多权力——不仅仅是为公司提供保护，更是成为了这场跨国搜索行动的一部分。\n\n在随后的数年里，这个小组逐渐控制了休斯公司的一部分资产，参与了政府合同、秘密交易以及国内外的政治博弈。盖伊与休斯之间的关系愈加紧密，甚至被认为盖伊不仅仅是休斯的“忠诚保镖”，而是他私人意志的执行者。无论是处理潜在的商业威胁，还是满足休斯的任何心血来潮——从狂热的投资决策到无数私人要求——摩门黑手党都游走在不为人知的阴影中，成为了休斯在身处博弈中时的一个关键棋子。"
 cal.6.a:0 "听说他们还兼职给休斯买冰淇凌呢"
 cal.7.t:0 "繁荣插曲"
 cal.7.d:0 "在拉斯维加斯东区的几家大型航空零件工厂外，今日爆发了声势浩大的抗议示威。成百上千的工人们高举着标语，要求提高工资待遇。最初这被认为只是一场无暴力抗议，但来自治安警察的暴力还击使得局势迅速升温。市民们也开始了骚动，进而一部分游行示威人群开始暴力对抗。\n\n作为对这场逐步演变成暴动的抗议行动的还击，休斯所倚重的由弗兰克·盖伊的摩门黑手党率领的全副武装，手持警棍、步枪与催泪瓦斯的武装警察与国民警卫队便迅速赶到现场。在工人们继续向前推进、试图冲击工厂大门时，枪声骤然响起。人群立刻陷入混乱，有人被警棍打倒在地，有人被催泪瓦斯呛得失声尖叫，更多人则在恐惧与愤怒中四散奔逃。街道很快被鲜血和破碎的标语牌染红，空气中弥漫着刺鼻的硝烟气味。\n\n理事会认为，一定是来自联合工团的赤匪暗中煽动了暴动。如今，理事会要求盖伊带领安保警察将整个拉斯维加斯乃至于内华达州彻底戒严并大力镇压。但弗兰克·盖伊并没有作出回应，而国民警卫队只封锁了内华达通往外界的公路与铁路。毫无疑问，盖伊正在等他的主子休斯的直接命令。"
 cal.7.a:0 "冷处理这件事，但通知那些新闻媒体，识趣一点"
 cal.7.b:0 "按照理事会的说法行动吧"
 cal.8.t:0 "灰色隐士"
 cal.8.d:0 "在拉斯维加斯最豪华的酒店高层套房中，帘幕永远紧闭，灯光常年昏暗。外界少有人能见到霍华德·休斯的身影，只有少数侍从和秘书能进入他的领域。就在这里，他通过电话、备忘录和录音带向商业理事会隔空下达命令，试图维持自己对帝国的掌控。尽管在他自己看来，自己的权威与威信仍然没有被时间抹平，但事实上病痛与强迫症的折磨与独处所造成的精神压力已经正在摧垮这个天才的精神。\n\n在理事会的会议桌上，休斯的名字依旧如同魔咒般重要，他的指示依然会被认真聆听并记录。然而在幕后，越来越多的决策正被理事会成员们“代为执行”，乃至“灵活解读”。休斯逐渐沦为一个遥远的象征，他的命令常常在抵达执行环节前就已被悄然篡改。\n\n与此同时，外界关于他的传闻层出不穷：有人说他已失去理智，有人说他被困于自己的偏执，甚至有人怀疑真正的休斯早已不再掌控局势。同时部分都市传说毫无征兆的流传开来，例如乔装打扮的霍华德·休斯会在夜晚随机出现在旧金山，洛杉矶或是拉斯维加斯的街头惩罚罪犯与异见者，又有一些好事者生成自己曾在夜晚见到过疯狂的休斯狩猎年轻男女。无论真相如何，沙漠中的这位幽影仍在以自己独特的方式统治着，却无法阻止自己帝国的根基逐步朽烂。"
 cal.8.a:0 "是，总统先生\n收到，总统先生"
 cal.9.t:0 "人人都爱"
 cal.9.d:0 "在过去，人们对霍华德·休斯的印象要么是古怪的亿万富翁，要么是一个疑似疯子的统治者。但如今，这一切都在改变。\n\n在越来越频繁的电台广播与大银幕上，休斯的形象被重新塑造。休斯已经逐渐从过去的古怪富翁的形象中走出，以“豪斯先生”这一更加受大众追捧的新身份，出现在各类广告、新闻片、杂志封面，甚至电影院的短片中。他的团队利用他在好莱坞的深厚人脉，把他刻画成一个孤高却仁慈、神秘而高效的领袖，仿佛他是唯一能带领太平洋国走向未来的指引者。\n\n广告牌在大道上闪烁，报纸头版称颂他的远见，电台播放着他那沙哑却坚定的声音。普通市民开始忘记那些关于疯狂、病弱与孤僻的传言，他们开始相信：伟大的霍华德·休斯并不是隐居的怪人，而是隐忍多年、终于现身的救世主。休斯为太平洋国的人民带来了和平，带来了独立，带来了难以计数的工作与繁荣的前景。而这一切都值得人们深深敬佩与感激。"
 cal.9.a:0 "得感恩啊"
 cal.10.t:0 "新皇登基"
 cal.10.d:0 "在旧金山举行的一场庄严仪式上，诺顿二世正式登基为太平洋国的最高统治者。在数个月前，他还只是南非的一名法律人士。但如今，他已经继承了自己叔叔的“政治遗产”，成为了这个新生国度的绝对统治者。\n\n在旧金山的喧嚣中，诺顿二世被护送至国会，周围环绕着支持者与好奇的民众。在拥挤的国会内，狂热的旧金山市民们以及部分政要齐聚一堂，见证这场非凡的加冕。随着礼炮鸣响与誓言宣读，诺顿二世的统治被赋予了正式的合法性。他承诺要引领太平洋国走向秩序与稳定，恢复往日的尊严，并在西海岸的土地上重建团结与希望。\n\n在无休止的政变与骚乱中，只有数十年前为旧金山人民所怀念的诺顿皇帝这个政治符号才能将国家团结起来。虽然未来仍然充满挑战，但这一刻，无数人怀着期待与信念，见证了太平洋国的新篇章。"
 cal.10.a:0 "吾皇万岁！"
 cal.11.t:0 "授勋仪式"
 cal.11.d:0 "在旧金山的晨雾之下，国会在诺顿二世陛下的诏命下被改造成了象征帝国新秩序的大殿。诺顿二世身披仿照先帝所披海军元帅礼服所做的皇帝礼服，亲自主持了第一场太平洋国的授勋典礼。\n\n那些在政变中立下功勋的市民与军官们被依次召入殿中。他们在民众的注视下单膝跪地，而皇帝则以庄重的姿态，将象征荣誉的勋章与绶带授予在他们肩头。随后，诺顿二世陛下为他们按照功劳一一授予了包括公爵在内的爵位。大厅中回荡着号角与掌声，每一枚勋位的授予都不仅是对个人勇气的奖赏，更是对太平洋国新政权合法性的宣示。\n\n对于诺顿二世而言，这不仅是一场仪式，更是一种对世界的宣告：初离襁褓的帝国并非历史的鬼魂，也并非虚幻的空中楼阁。在皇帝的身边团结着无数的忠于诺顿血脉的仁人志士。正是他们，使得皇帝能够在动荡的西海岸站稳脚跟。"
 cal.11.a:0 "忠！诚！"
 cal.12.t:0 "忠诚问题"
 cal.12.d:0 "在旧金山湾边的一处临时行宫内，诺顿二世召见了太平洋国的两位军事最高领导人——亨利·阿诺德与乔治·马歇尔。空气中弥漫着紧张的气息，宫廷内的陈设虽力求庄重，却无法掩盖外部威胁与内部争议所带来的不安。来自日本帝国，加拿大王国与内战各方势力的施压使得国家的外部压力骤增，而国内此起彼伏的反对者抗议尽管威胁不到政权，但所带来的社会骚乱却也实打实的加大了诺顿政府的压力。\n\n诺顿二世以帝王的口吻重申了他对于君主专制体制的坚持，强调帝国需要一位无可置疑的中心才能在动荡中存续。然而，他也承认，来自各方的质疑与威胁使得皇位并非稳如磐石。阿诺德与马歇尔沉默聆听，这两位久经沙场的老将尽管对帝国嗤之以鼻，但诺顿皇帝至今成功的统治与维系太平洋国的独立地位也符合了军方的预期。在一阵令人颤抖的沉默后，马歇尔表态：只要皇帝能够保证军队的地位与需求，他们将为帝国提供坚定而不可动摇的支持。"
 cal.12.a:0 "帝国的剑与盾已经完备"
 cal.13.t:0 "诺顿陛下的盛大巡查"
 cal.13.d:0 "在结束了内战与诸多政治动荡之后，诺顿二世陛下决定亲自巡查太平洋国的各个主要地区，以展现君主对国家的关怀，同时凝聚人心。随着皇家专列缓缓驶离旧金山，沿途城市与乡镇的街道上挤满了挥舞旗帜的民众，他们高喊着国王的名字，有人甚至将陛下的画像挂在房屋外墙，以示忠诚与敬意。\n\n在洛杉矶，陛下受到了电影业巨头们的欢迎，明星与导演们齐聚好莱坞大街，盛装出席这一皇家访问。诸位好莱坞的名人们将与诺顿皇帝握手面谈视为了极高的荣誉，而皇帝陛下则对每一个人还以和善的微笑。在圣地亚哥，海军的列队检阅亦极尽盛大，舰炮齐鸣，士兵们高呼万岁，宣示对陛下的效忠。\n\n北上的旅途中，陛下造访了西雅图与波特兰。在回荡着汽笛声的码头上，工人和商人同样蜂拥而至。渔民们为陛下献上了最新鲜的三文鱼与蟹，作为敬献之礼。山区与乡村的百姓也未被遗忘——诺顿陛下亲临农场，与农户谈论收成与土地，甚至亲手举起犁铧，赢得了农人们的掌声与感激。\n\n这场巡查不仅仅是象征性的访问，更是凝聚国民精神的重大举措。在掌声、呼喊与礼炮声的交织中，诺顿二世陛下的形象愈加高大，他既是传统的延续者，也是新时代的象征。对于许多人而言，太平洋国已不再只是一个政权，而是一位活生生的君主的国家，而这一事实足以让他们自豪地宣告：君主与国民是一体的。"
 cal.13.a:0 "与民同乐的好皇帝"
 cal.14.t:0 "忠犬守护者"
 cal.14.d:0 "在美利坚帝国的皇都旧金山，诺顿二世皇帝陛下收养了两条忠诚的犬只，以纪念那些在历史中象征坚韧与伴随的动物，同时也致敬了两只在旧金山历史上最著名的流浪狗。这两条大型犬，一条名为巴默尔二世，另一条名为拉撒路二世。尽管在过去这两条皇帝如今的忠犬不过是旧金山成百上千条流浪狗的其中一员，但如今他们己经与过去截然不同。内战的混乱曾让许多生灵流离失所，但皇帝陛下亲自在金门公园巡视时发现了它们，并下令将它们带入皇宫，赐予皇家待遇。巴默尔二世以其警觉与活力闻名，而拉撒路二世则以其温和与耐力著称，它们如今已成为帝国的象征之一。\n\n诺顿二世在一次如同他叔父过去曾热衷的“巡视旧金山”的出巡中在市中心广场向数千名民众展示了自己的两条忠犬。皇帝宣布，两条犬只将被封为'帝国守护骑士'，并在宫廷中享有专属的居所与侍从。它们的肖像将被铸刻在帝国徽章上，作为忠诚与复兴的标志。皇帝强调，忠犬的陪伴将激励帝国子民面对未来挑战，巩固西海岸的团结与秩序。帝国如今多了一份温暖的象征，让诺顿二世的统治更接地气，却又充满威严。"
 cal.14.a:0 "两条好狗！"
 cal.15.t:0 "来自帝国的保护"
 cal.15.d:0 "近日，我国的外交部收到了来自北方邻国的一封正式外交通牒：伟大的蒙上帝赐福的美利坚帝国皇帝及墨西哥的保护者诺顿二世正式宣布将我国纳入“美利坚帝国”的保护与管辖当中，并要求我国即刻确认对帝国的从属关系。外交部官员对此既感到震惊又疑惑，而此则文书也被紧急送往总统办公室。毫无疑问，这无疑是对我国国格的嘲弄与对国家的挑衅。尽管我们完全可以把他们当作一个屁放了，但一个来自北方的敌人也不是我们所乐意见到的。"
 cal.15.a:0 "我们只得服从皇帝的统治"
 cal.15.b:0 "哪来的疯子？"
 cal.16.t:0 "人人提问题"
 cal.16.d:0 "在旧金山的市政厅大理石大厅内，阳光透过高窗洒落在排排木制长椅上，数百名市民代表正静静等待质询会议的开始。与会者当中，有身着西装的商会代表，也有来自码头工会的普通工人，还有数十名来自湾区各个街区的社区领袖。空气中弥漫着咖啡与墨水混杂的气息，仿佛这座城市的命运正在这里重新书写。这并非单纯的地方性议程，而是一场标志性的政治试验——如何在战乱与动荡的阴影下，重申宪政民主的根基。过去，企业巨头在幕后左右政策，民选代表往往只是大亨们的代言人。然而，如今的市政厅质询向所有人开放，新闻记者与普通市民可以直接旁听并发问。\n\n尽管一些市民与企业的代表在有关劳工问题上有一些激烈冲突，但最终这次城市议会质询还是平稳落幕。市长及其幕僚坚持要把各方意见一一记录在案，并承诺新的市政方案将由公开投票决定。对许多人而言，这不仅仅是一场政策协商，而是对忠诚与信念的考验。无论最终结果如何，历史都将铭记这一刻——在危机年代里，每一位市民们第一次清晰地感受到，他们握有塑造未来的权力。"
 cal.16.a:0 "“好的菲利普先生，你的问题很有价值，但我认为问题的关键在于...”"
 cal.17.t:0 "皇帝的一天"
 cal.17.d:0 "晨曦透过白宫的高窗洒入书房，皇帝已然坐在桌前，正细致翻阅着当天的报纸。与往昔那些高高在上的帝王不同，他总是要求亲自过目各大报纸的社论与读者来信，哪怕有时读到的批评尖锐无比。随后，他会散步至花园，与园丁和守卫寒暄几句，再在小桌旁饮下略带南非风味的咖啡，仿佛要提醒所有人他的身世并不能否定他作为美国皇帝的身份。\n\n上午的例行会议上，皇帝并不高坐宝座，而是与议员们围坐在一张圆桌旁，聆听他们对于当今国家的意见。尽管作为立宪君主，皇帝本人并没有多少实权，但他仍然会将一些在他看来颇有见地的意见转达给首相本人。午后，他会抽空走访市民团体或退伍军人协会，有时甚至会亲手为孩子们签下奖学金的批准信。甚至有时行人们会看到皇帝本人在两名卫兵的护卫下走进街边的快餐店享用起了芝士汉堡。\n\n夜幕降临时，皇帝常常独自走入书房，点亮一盏孤灯，读上大约一小时的书后就寝。正是在这种平凡的一日又一日中，他向世人展示：皇帝与普通民众正站在一起。"
 cal.17.a:0 "与民同乐？"
 cal.18.t:0 "打倒霍华德·斯科特的极左伪技官思潮"
 cal.18.d:0 "诚然，技官运动在北美大陆的引路人之一就是那个被称为“神秘的年轻人”的霍华德·斯科特。然而，霍华德·斯科特及其追随者们，正在五大湖乃至全北美鼓吹一种荒唐的极左技官思潮。他们高喊着消灭私有财产，号称要以技术人员取代一切政府和企业的职能，建立一个脱离市场与国家的乌托邦体制。事实证明，这样的幻想只会破坏生产秩序，并摧毁真正的技术成果，并把我们的国家拖入混乱之中。\n\n迪士尼与其同僚们则明确表态：我们需要的是有纪律、有责任感的技官体系，以科学管理与合理规划来服务国家与人民，而不是幻想式的“极权技官共和国”。在场维护技官运动的纯洁与正统的伟大斗争中，真正的技官必须站出来，揭露斯科特派的荒谬与危险，捍卫技术应当服务于秩序与民族利益的根本原则。"
 cal.18.a:0 "能不能做成教育动画片播出？"
 cal.19.t:0 "东京态度急转直下"
 cal.19.d:0 "随着日本与我国关系的持续紧张，两边的外交活动也几近于停止。总统已经在近日决定将在不久后正式与日本方面断交，同时驱逐驻扎在旧金山与萨克拉门托的日本军官与驻军。而一反常态的是，日本驻军在近日一反常态的毫无动静，而那些平日狂妄的日本士兵在近日也诡异的消失在了街头。"
 cal.19.a:0 "有些事情将要发生..."
 cal.20.t:0 "繁荣表象下的暗流"
 cal.20.d:0 "近日，政府的安全部门的人员向相矶藤雄总统汇报称，日本军官团的驻地周围多了不少的巡逻宪兵，而政府的官员与警察则被告知此地有关大日本帝国的军事机密无法进入。总统与他的幕僚们对此感到奇怪，同时也有些警惕。安全部门已经被被指派持续监视。"
 cal.20.a:0 "有些不对劲..."
 cal.21.t:0 "忠诚的陆军镇压了日本的政变！"
 cal.21.d:0 "相矶藤雄总统在昨夜在官邸中遭受了来自日本的刺客的袭击，所幸我们的总统成功逃脱了刺杀并迅速将消息带出了总统府。忠诚的陆军在阿诺德将军与马歇尔将军的带领下迅速镇压了正在向市中心开进的日本驻军。据悉日本驻军中包括山口多闻在内的数名高级军官已经逃离太平洋国回到日本，但仍有一批日本合作者仍然需要我们进行清理。"
 cal.21.a:0 "现在该清理门户了"

 KX_california.42.t:0 "霍华德·休斯的怪癖"
 KX_california.42.d:0 "尽管大多数人都知道休斯是一个有隐居癖好的领袖，但很少有人知道他的怪癖有多怪。虽然休斯一开始看起来很有魅力，不过是性格有些古怪而已，但在他卷入飞机事故后，他的状态似乎进一步恶化了。尽管他很快就从这一事件中恢复了过来，但一些人认为这些事件对他的精神造成了永久的伤害。流传的谣言中包含着各种疾病的名称，从强迫症到双相情感障碍，甚至偏执型精神分裂症。而那些谈论他的疾病的人害怕他真的患有精神分裂，因为他越来越非理性的行为似乎都可以从这种疾病中找到证据。他的可待因成瘾和细菌恐惧症的影响并不能阻止人们坚信着他的事业，然而他的精神分裂症发作让他的许多顾问担心他们的安全——特别是他们的生命安全。休斯的医生们想知道这个古怪的人还能坚持多久。"
 KX_california.42.a:0 "但愿我们的总统大人不会有什么不测..."
 KX_california.42.b:0 "他真的还能胜任总统这一职位吗？" 

