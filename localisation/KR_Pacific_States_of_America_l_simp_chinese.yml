 pacificstates.1000.d.president:0 "掌握着总统之位的联邦党本次除可以继续提名现任总统[GetPrimeMinister]外，部分代表也推出了其它的人选。"
 pacificstates.1000.d.not_president:0 "各大媒体都在争相猜测游离在权力殿堂之外的联邦党准备的候选人会是谁，虽然有许多名字已经见诸报端，但最终的结果还是要取决于今天在座的各位代表。"
