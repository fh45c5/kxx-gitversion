 CAL_tenney_committee_idea:0 "坦尼委员会"
 CAL_tenney_committee_idea_desc:0 "杰克·坦尼狂热的反工团主义应当可以为我们所用。从厄普顿·辛克莱领导的联邦党成员开始，我们会对知名的左翼分子展开调查。不把工团主义的毒瘤从这个国家根除，我们就不会停止。这需要一些时间，但我们相信，当这一切取得成功时，国家会更加稳定。"
