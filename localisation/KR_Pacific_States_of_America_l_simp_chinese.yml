 CAL_classic_liberal_dominance_long:0 "民主共和党(Republican-Democratic Party)"
 CAL_classic_liberal_dominance_party:0 "民主共和党"
 CAL_brain_trust_idea_desc:0 "智囊团将由我们国家最聪明的人组成。在他们的指导下，我们可以拥有运行最好的美利坚政府。"
 CAL_brain_trust_idea_2_desc:0 "智囊团的益处无限。我们现在比以往任何时候都要更有效地管理政府，也可以进行更好的间谍活动，最重要的是，我们在技术上超越了欧洲人。未来已来！"
 CAL_review_the_fed_desc:0 "要想从最近的动荡中复苏，我们必须做的一件事就是重新审查美联储。有些人认为我们应该将其私有化，这样会更有效。另一些人则希望完全废除它，称它不是解决金融危机所必需的机构。还有一些人希望改革它，使它成为一个更好的机构。无论如何，我们必须对此作出决定。"
 pacificstates.6007.t:0 "两党制形成"
 pacificstates.6007.d.libs:0 "为了抵抗我们吸收进步党势力的行动，民主党和共和党已经同意在“国家民主党“”的名下合并政党，并越来越多地接纳国家民主党的前独立支持者。作为回应，联邦党支持者支持我们提高选举频率，使联邦党在国家一级无关紧要，回归两党制的主导地位，无论好坏。"
 pacificstates.6007.a:0 "很好"
 pacificstates.6008.t:0 "两党制形成"
 pacificstates.6008.d.reps:0 "为了抵抗我们吸收民主党势力的行动，进步党和民主共和党已经同意合并两党，并越来越多地接纳联邦党的前独立支持者。作为回应，国家民主党支持者支持我们提高选举频率，使国家民主党在国家一级无关紧要，回归两党制的主导地位，无论好坏。"
 pacificstates.6008.a:0 "很好"
 pacificstates.6009.t:0 "两党制形成"
 pacificstates.6009.d.dems:0 "为了抵抗我们吸收共和党势力的行动，进步党和民主共和党已经同意合并两党，并越来越多地接纳联邦党的前独立支持者。作为回应，国家民主党支持者支持我们提高选举频率，使国家民主党在国家一级无关紧要，回归两党制的主导地位，无论好坏。"
 pacificstates.6009.a:0 "很好"
 pacificstates.6010.t:0 "两党制形成"
 pacificstates.6010.d.commonwealth:0 "为了抵抗我们吸收进步党势力的行动，民主党和共和党已经同意合并两党，并越来越多地接纳国家民主党的前独立支持者。作为回应，进步党支持者支持我们提高选举频率，使进步党在国家一级无关紧要，回归两党制的主导地位，无论好坏。"
 pacificstates.6010.a:0 "很好"
 CAL_hearst_debt:0 "赫斯特的债务"
 pacificstates.315.t:0 "进步派团结一致"
 pacificstates.315.d:0 "我们不再只是西部的一群进步派的乌合之众，我们已让全国各地的进步党、自由党和左翼人士加入了我们的党，现在我们是这个国家最强大的党。从休伊·朗到乔治·诺里斯，再到乔治·艾肯，美国最著名的进步派人士都在支持我们的运动。过去痛苦的党派之争已经消失，取而代之的是民族主义和为美国带来更美好未来的愿望。"
 pacificstates.315.a:0 "不再内斗！"
 CAL_sudden_dissapearances:0 "神秘消失"
 CAL_syndicalist_purge_idea:0 "清洗工团主义者"
 CAL_syndicalist_purge_idea_desc:0 "一些东方甚至境外的工团分子企图动摇我们的政权，还处处暗中破坏我们。我们应该为他们的背叛行为报复他们。我们要开始内肃，把工团主义者和一切左派势力从国内肃清干净。从长远来看，这将使我们的统治更加安全，但从短期来看，我们可以想得到后果……"
 CAL_sane_economics_idea:0 "理智经济学"
 CAL_japanese_propaganda_idea:0 "日本宣传"
 CAL_spiritualist_media_idea:0 "灵性论运动媒体"
 CAL_shinto_influence_idea:0 "神道教影响"
 CAL_mass_appeals:0 "吸引大众"
 CAL_american_faith:0 "美利坚信仰"
 CAL_civil_war_over_flag:0 "内战已结束"
 CAL_followed_hubbard:0 "遵从哈伯德的建议"
 CAL_hubbard_too_much:0 "东洋之命"
 CAL_spiritualists_in_control:0 "灵性论运动控制全国"
 CAL_spiritualists_in_control_desc:0 "随着内战的结束，我们终于控制了整个国家。然而，这种新的控制将伴随着无数挑战，从对付叛军到确立我们的合法性。不管怎样，我们可以为美国很快就能完成它的天赋命运感到欣慰。"
 CAL_sane_economy:0 "理智经济"
 CAL_sane_economy_desc:0 "灵性论的经济学观点认为，资本主义、共产主义和社会主义都试图对人们实行全面控制，并使他们沦为奴隶。我们应该争取经济自由，而不是奴隶待遇。而只有从政府到企业的经济控制者都是理智的人的时候，我们才能做到这一点。"
 CAL_japanese_propaganda:0 "日本宣传"
 CAL_japanese_propaganda_desc:0 "我们与日本的联盟已经被西海岸人民所接受，他们已经对日本有了个大概的概念。然而，还有更多的人对此一无所知，我们需要让美国人相信日本是我们的天然盟友。如果想要有这样的效果，我们需要利用一些宣传手段将两国联系在一起，这样我们就能让我们的人民对此有些认同感。"
 CAL_new_media:0 "新媒体"
 CAL_new_media_desc:0 "战争期间，我们封锁了媒体。毕竟，报纸总忍不住要给我们贴上阴谋论者之类的标签。但现在，我们有能力建立自己的媒体，并在已有的媒体中安排我们的人。这种“新媒体”将更好地助力我们的宣传……"
 CAL_shinto_influence:0 "神道教影响"
 CAL_shinto_influence_desc:0 "神道教与基督教或其他美国主要的宗教截然不同，但我们与日本的密切联系意味着神道教在这个国家的影响力已越来越大。我们将尊重曾经的传统，美国和日本将变得更加紧密！"
 CAL_spiritual_revolution:0 "精神革命"
 CAL_spiritual_revolution_desc:0 "恶魔，超自然现象，甚至不明飞行物都存在与我们身边，但少有人敢于承认它们的存在。我们将鼓励传播我们的信仰，并将我们的信仰融入现有的信仰中。美国人将经历一场精神革命。"
 CAL_rehabilitate_and_indoctrinate:0 "改造与洗脑"
 CAL_rehabilitate_and_indoctrinate_desc:0 "尽管我们希望消灭叛乱分子，但我们确实需要确立合法性。让一些其他反叛组织的受欢迎的人物加入我们的行列将有助于达成这一目标，也能扩大我们的队伍。我们已经接触了名人，但现在我们也将去接触战争英雄。"
 CAL_deal_with_csa:0 "解决工团主义者"
 CAL_deal_with_csa_desc:0 "工团分子远渡重洋来到这里，而当他们到达时，他们就试图去分裂我们的国家。工团主义即是反美行为，他们企图控制我们的人民，我们的工人。他们并没有被我们无视，现在我们已经赢得了战争，我们将对他们重拳出击。"
 CAL_deal_with_odp:0 "处理旧民主党"
 CAL_deal_with_odp_desc:0 "我们同意旧民主党的部分观点，但他们毕竟都是叛徒。此外，他们还坚信他们的信仰高于所有其他的信仰，我们怎么会允许这种现象呢？让我们来审判旧民主党的主要领导人，然后决定接下来要怎么做。"
 CAL_destroy_syndie_parasites:0 "消灭赤匪寄生虫"
 CAL_destroy_syndie_parasites_desc:0 "赤匪寄生虫长久以来一直困扰着我国。威尔逊总统在多年前掀起了第一次“红色恐慌”，但显然他做的还远远不够。对这些人没有怜悯可言，他们会在毫无预告的情况下被杀死。我们将彻底消除红祸。"
 CAL_destroy_anglophiles:0 "消灭亲英派"
 CAL_destroy_anglophiles_desc:0 "工团的主子，不列颠君主制，正在北方策划阴谋，想要扼杀我们的文明成果。更糟糕的是，内战期间的部分叛军甚至追随着盎格鲁-撒克逊文化。旧民主党是英国的代理人，因此他们必须被消灭。"
 CAL_reeducation_effort:0 "再教育工作"
 CAL_reeducation_effort_desc:0 "美国人民没有受过教化。几乎没有人意识到我们信仰的正确性，因此，教化他们我们义不容辞。未来几年，所有美国人都将参加某种形式的再教育，我们也将在大学中开设心疗学和古宇航员研究等新专业。"
 CAL_plan_for_japan:0 "对日计划"
 CAL_plan_for_japan_desc:0 "日本在我们内战期间是一个宝贵的盟友，但现在我们必须决定如何处理他们。我们可以追求建立更紧密的关系，也可以在背后捅他们一刀。我们该怎么办？"
 CAL_noi_alliance:0 "[CAL_noi_alliance_loc]"
 CAL_noi_alliance_desc:0 "[CAL_noi_alliance_desc_loc]"
 CAL_restore_elections:0 "恢复“选举”"
 CAL_restore_elections_desc:0 "能帮我们进一步确立合法性的一件事就是来点“选举”。当然，这些选举肯定不是公平的，但在一些人看来，我们还能举行选举就很有意义了。谁会阻止我们自己清点选票呢？"
 CAL_a_new_era:0 "新纪元"
 CAL_a_new_era_desc:0 "我们的意识形态已经传遍了美国，数百万人已经成功地转变了观念。虽然我们仍有工作要做，但可以肯定地说，我们正在进入一个新时代，在这个时代，英国君主制和工团主义的恶性影响已从我国消失，只有真正的美国人仍屹立彳亍。"
 CAL_levering_act_desc:0 "加州众议员哈罗德·K·利弗林在众议员杰克·坦尼的协助下，为所有州政府雇员（包括教师在内）撰写了一份新的誓言，誓言中包含反对激进主义，尤其是工团主义的内容。那些违反或拒绝宣誓的人可能会被除名，因为他们可能对国家造成了相当大的损害。"
 pacificstates.3.g:0 "阿尔夫·兰登"
 pacificstates.4.h:0 "查尔斯·柯蒂斯"
 pacificstates.71.b:0 "国会宣布该命令无效"
 pacificstates.71.c:0 "国会进一步执行了该命令"
 pacificstates.107.b:0 "叫停它"
 pacificstates.3520.t:0 "对巴顿和佩利的审判"
 pacificstates.3520.d:0 "我们已从各叛乱派系中挑选了一些人物予以改造。作为美利坚联盟国的代表，我们决定将佩利置于我们的庇护之下，因为他在过去曾表达过某些神秘信仰，也许我们可以让他相信我们的教义。还有美利坚宪政国的乔治·巴顿。巴顿是一个有争议性的人物，因他在内战期间直接或间接杀害了许多美国人。然而，他也相当受人欢迎，放他一马也不错。他还表达了对各宗教和神秘学领域的兴趣，所以也许他会是一个很好的皈依者候选人。我们也可以改造这两个人，虽然这样做不那么受人欢迎，或者我们可以把他们都关起来，这可能是最受欢迎的选择。无论如何，如果我们让这些人恢复名誉，我们就会让他们掌管自己的政党，尽管这些政党不会有掌握任何实权。相反，他们将充当一个傀儡，进一步让我们的政权具有合法性。"
 pacificstates.3520.a:0 "改造佩利"
 pacificstates.3520.b:0 "改造巴顿"
 pacificstates.3520.c:0 "尝试改造他们俩"
 pacificstates.3520.e:0 "全去监狱吧"
 pacificstates.3521.t:0 "一场精神革命！"
 pacificstates.3521.d:0 "现在是我们在全美传播我们的信仰的时候了，但我们必须要怎么做。同情日本的灵性论运动人士认为，我们应该对大众进行有针对性的宣传，因为皈依正信是我们传播影响力最直接的方式。其他的灵性论者意见有些分歧，但他们普遍同意，为了使大众皈依，我们应该实现某种奇迹。一些人希望投资火箭技术，希望能更好地了解不明飞行物，盼望着也许有一天能和他们一起跻身星际舞台。还有一些人反对这以想法，他们坚持认为我们应该关注无线电技术，因为它有利于超自然现象的调查，并且这种技术可以让我们探测到更多的超自然现象，甚至可以和它们进行交流。我们大多数宗教支持者坚定地认为，我们应强调的是我们的宗教教义，而不是其他宗教，如基督教或伊斯兰教的教义，特别是与其他宗教相比，我们的信仰扎根于美国。我们该如何开始呢？"
 pacificstates.3521.a:0 "投资太空技术"
 pacificstates.3521.b:0 "投资超自然交流"
 pacificstates.3521.c:0 "更多的大众文学"
 pacificstates.3521.e:0 "美利坚信仰"
 pacificstates.3522.t:0 "审判旧民主党"
 pacificstates.3522.d:0 "随着内战已然结束，是时候去对付那些反对我们的人了。旧民主党是最大的不列颠走狗，也是福特主义资本家的最大同伙，他们终将为他们对人民犯下的罪行付出代价。一些陪审团成员受到了影响，但最终的决定是……"
 pacificstates.3522.a:0 "监禁旧民主党的领袖"
 pacificstates.3522.b:0 "处决旧民主党的领导者"
 pacificstates.3522.c:0 "逮捕其所有党员"
 pacificstates.3523.t:0 "审判工团政府"
 pacificstates.3523.d:0 "随着内战已然结束，是时候去对付那些反对我们的人了。对这些人的指控无数，但最致命的指控是背叛政府、宪法和人民。这些男男女女被外国工团势力洗脑，并不断无情地杀害他们的同胞。此外，他们是叛军中的最恶者，因为他们想彻底改变我们的生活方式，以满足他们的贪婪无厌。因此，我们不会宽恕这些寄生虫，但我们仍然必须决定要如何处理它们。最终，陪审团决定……"
 pacificstates.3523.a:0 "折磨并驱逐工团领袖"
 pacificstates.3523.b:0 "只处决工团领导人"
 pacificstates.3523.c:0 "全杀了"
 pacificstates.3524.t:0 "大洋彼岸的盟友"
 pacificstates.3524.d:0 "在内战期间，日本是我们最亲密的盟友，为我们提供了急需的人力物力。然而，既然战争已经结束，现在是我们决定如何对待他们的时候了。我们现在处于平等的地位了，可以提出一些要求。问题是，我们想要什么？有些人认为我们应该要求完全控制夏威夷，毕竟在战前，夏威夷是美国的领土。而无论谁拥有这一群岛，美日的联合施压肯定会迫使它回到美国的手中——如果日本同意的话。另一些人则认为，我们去报答他们在冲突期间的帮助就行了，否则两国的关系就会停滞在战前状态。当然，强硬派坚持我们要走得更远，而不是采纳这些折中措施。我们该怎么办？"
 pacificstates.3524.a:0 "要求控制夏威夷"
 pacificstates.3524.b:0 "要求控制夏威夷"
 pacificstates.3524.c:0 "得回报他们，就这样"
 pacificstates.3524.e:0 "让他们爬"
 pacificstates.3524.f:0 "滴水之恩，涌泉相报"
 pacificstates.3525.t:0 "美国要求得到夏威夷"
 pacificstates.3525.d:0 "虽然灵性论运动在内战期间是我们的盟友，但内战结束后他们的语气就变了。这种变化显然不太好，一些人质疑我们的联盟能否承受住这种压力。更糟糕的是，他们现在要求我们把夏威夷还回去，他们认为夏威夷本来就是他们的领土，所以应该再次归他们所有。我们该怎么做？"
 pacificstates.3525.a:0 "接受他们的要求"
 pacificstates.3525.b:0 "是可忍孰不可忍！不！"
 pacificstates.3526.t:0 "日本拒绝了我们"
 pacificstates.3526.d:0 "日本厚颜无耻地拒绝了我们的提议，还声称太平洋是他们的，而且应是由他们独占的领土，我们该满足我们所有的了。我们内部圈子里的许多人对事态的转变感到愤怒，但L·罗恩·哈伯德敦促我们保持耐心，他认为我们的时代终将到来。我们该怎么办？"
 pacificstates.3526.a:0 "来战吧！"
 pacificstates.3526.b:0 "莫慌……"
 pacificstates.3527.t:0 "日本同意了"
 pacificstates.3527.d:0 "日本似乎比我们预期的更重视我们的同盟关系，并同意将夏威夷归还给我们。"
 pacificstates.3527.a:0 "万岁！"
 pacificstates.3528.t:0 "新“选举”！"
 pacificstates.3528.d:0 "秩序已经恢复，现在是恢复美国人人喜闻乐见的选举传统的时候了。然而，这些选举将不同于以往的选举，我们已经确保我们的党无论如何都会当选。这一点也不难，其他政党都被取缔了，我们还能落选？现在是清点选票的时候了。结果会如何呢？"
 pacificstates.3528.a:0 "灵性论运动赢了"
 pacificstates.3528.b:0 "灵性论运动占上风"
 pacificstates.3529.t:0 "灵性论运动在西部掌权！"
 pacificstates.3529.d:0 "麦克阿瑟越来越关心他西海岸的盟友，而威廉·伦道夫·赫斯特在一场军事政变中被推翻。虽然赫斯特被废黜让麦克阿瑟怒火中烧，但情况似乎发展太迅速了。现在，由爱德华·朗斯特里特·博丹领导的自称为“灵性论运动”的组织，对军方发动了反政变。这个团体声称想要延续赫斯特的遗产，但很明显他们有自己的目标，麦克阿瑟将不得不决定如何处理这一问题。我们是应该恢复“狂野西部”的秩序，还是先不去管它？"
 pacificstates.3529.a:0 "我们没有资源"
 pacificstates.3529.b:0 "他们不可信！"
 pacificstates.3530.t:0 "麦克阿瑟背叛了我们！"
 pacificstates.3530.d:0 "虽然我们希望推翻那些赶走赫斯特的军头足以让麦克阿瑟满意，但他似乎并不信任我们。更糟糕的是，鉴于最近的混乱局势，他们决定自己来恢复我们地区的秩序，而不是让我们自己管理它。因此，他们破坏了和平条约，现在正向我们进军！"
 pacificstates.3530.a:0 "来战吧！"
 pacificstates.3531.t:0 "内阁秘密会议"
 pacificstates.3531.d:0 "几天前，一次会议在刚刚完工的白宫内阁会议室里举行。多位部长出席了会议，包括外星人顾问杰克·帕森斯、超自然现象顾问约瑟夫·奥古斯都·温特、宗教顾问保罗·特切尔。有人见到这些人与L·罗恩·哈伯德会面，虽然各种讨论应秘密进行，但似乎有人在偷偷录下他们的谈话内容。温特认为，这可能是一个可以穿过墙壁，别人却看不到的人物。帕森斯认为这是无稽之谈，他认为是外星人一直在监听并将会议内容泄露给了媒体。无论如何，我们必须找到我们政府里的内奸，因为我们还没有完全地说服美国人民，他们还没有完全了解我们的政权。我们该怎么办？"
 pacificstates.3531.a:0 "谁在乎呢？他们最终会发现的……"
 pacificstates.3531.b:0 "让个记者消失，以儆效尤"
 pacificstates.3532.t:0 "日本天皇与华特·迪士尼会面"
 pacificstates.3532.d:0 "作为我们文化交流项目的一部分，华特·迪士尼几天前出访了日本。虽然迪士尼在政治上是失败的，但他是一个才华横溢的商人和动画制作师，天皇非常好奇地想要看看他的一些作品。众目睽睽之下，两人走进了一个房间，并和几位皇帝的亲密顾问一起观看了《白雪公主和七个小矮人》。后来，有人看到迪士尼在晚餐时和天皇一起笑个不停。这次会面似乎进行得很顺利，日本天皇也想将这种动画风格引进到自己的国家，并承诺要培养自己的动画制作师来与美国人竞争。"
 pacificstates.3532.a:0 "新型动画？"
 pacificstates.3533.t:0 "喷火战机！"
 pacificstates.3533.d:0 "“喷火战机”一词在美国内战期间被飞行员用来描述在美国、欧洲和太平洋战区上空看到的神秘的空中现象。这一现象引起了许多人的兴趣，但也引起了骚动，在军民中都是如此。有些人认为它们是来自上帝或灵魂的启示，其他人认为它们是外星人的踪迹，还有一些人认为这是一种自然现象。我们政府应持何立场？"
 pacificstates.3533.a:0 "这是一种自然现象"
 pacificstates.3533.b:0 "别紧张，他们只是外星观察者而已……"
 pacificstates.3533.c:0 "这是明显的异次元侵入迹象"
 pacificstates.3534.t:0 "新考古学与新史学"
 pacificstates.3534.d:0 "早在19世纪，人们就推测神秘的密西西比土堆是由失落的白人种族建立起来的——也就是说，在哥伦布之前，旧世界就与美洲有过接触。虽然赛勒斯·托马斯于1890年用亲身研究驳斥了这一说法，但仍有研究人员对这一课题感兴趣。美国考古学家奥古斯塔斯·勒·普隆翁“证明”了玛雅与古埃及和欧洲的联系，并给出了玛雅帝国的穆女王和科克王子的详尽事迹。俄罗斯的布拉钦上校在其于1938年出版的《亚特兰蒂斯的阴影》一书中写道，在加勒比人中流传着一个名为塔穆、祖讷的白胡子男人的传说，他从东方而来，教授人们农业知识，后来又在东方消失无踪。布拉钦还称曼科·卡帕克（印加文明的创始人）就留着白胡子。不远万里来到美洲大陆的白人被当地人视作神灵（安第斯地区的维拉科嘉，阿兹特克人的羽蛇神或玛雅人的库库尔坎等）。其他的科学家则更为保守，只把自己的理论局限在欧洲人和美洲人过去有过接触这一程度，反复念叨着那些神秘的发现（比如1933年在墨西哥城附近的托卢卡瓦莱发现的带有胡须和其他欧洲特征的小陶俑头雕塑）、传说（爱尔兰传教士）和北欧萨迦（文兰殖民地）。那么，我们是要传播过去白人在美洲存在的真相呢，还是我们对这些事实保持沉默呢？"
 pacificstates.3534.a:0 "有趣的假设"
 pacificstates.3534.b:0 "让我们向世界宣布，白人也曾世世代代生活在美洲。"
 KX_california.33.t:0 "诺顿二世逝世"
 KX_california.33.d:0 "我们敬爱的国王查尔斯·罗斯·诺顿，或称诺顿二世，于今日逝世。查尔斯·罗斯·诺顿总不接受别人授予他的王位，然而他仍然继承了太平洋帝国皇帝的帝位，尽管他认为自己的帝位是非法的，整个太平洋帝国的概念是疯狂的。然而，也正是他——查尔斯·罗斯·诺顿登上了帝位，在这个疯狂的世界里，为太平洋东岸这个混乱的国家带来了稳定，为孱弱的人民恢复了稳定的政府，并努力去帮助太平洋国的每一个公民。他不喜欢盛大的游行，不喜欢盛大的宴会，也不喜欢他的皇家军队。他把他的人民看得比什么都重要，竭尽全力确保他帝国的每一个公民不仅能生存下去，还能自由地发展。作为皇帝，他在慈善上的努力使成千上万的太平洋人摆脱了贫困，他为和平所做的奉献确保了太平洋国避免了一场毁灭性的战争。\n\n查尔斯·罗斯·诺顿从前的生活很正常，直到他被卷入太平洋帝国为止，他被亲戚们荒谬的说法所淹没，被一群心烦意乱的人所接受。现在，他辉煌的一生走到了尽头。政府为诺顿二世举行了国葬，来自世界各地的政要参加了葬礼，就连像温莎家族和霍亨索伦家族这样的名门望族也不例外，而不久前他们还把诺顿家族看做一个笑话。不过，诺顿二世去世后，继承问题随之而来。按照常理来说，诺顿二世的皇位及诺顿三世的头衔都应归于其子杰勒德·诺顿，但细翻一下家谱就会发现，查尔斯·罗斯·诺顿的哥哥赫伯特·弗雷泽·诺顿才是最为年长的王位继承人选。先前诺顿一世去世时，就有人提出皇位应传给其兄，只是诺顿复辟会坚持查尔斯·罗斯·诺顿一脉这事才作罢。杰勒德·诺顿发誓会继承父亲的政策，并继续他父亲所有在慈善世界上的努力。赫伯特·弗雷泽·诺顿虽是皇室的一员，却从不关心宫廷事务，日后大概会放手政治，淡于公众视野之外。无论最后是谁登基，我们都清楚地明白：在全太平洋国都在哀悼其皇帝的时候，诞生于混乱世界中的帝国又迎来了新的一天。"
 KX_california.33.a:0 "遵循血脉，加冕杰勒德·诺顿"
 free_trade_idea:0 "自由贸易"
 CAL_league_of_anti_imperialism_invites:0 "邀请反帝联盟成员"
 pacificstates.326.b:0 "不过要注意和工团人保持距离"
 pacificstates.115.t:0 "太平洋海岸联盟"
 pacificstates.115.d:0 "在内战爆发之前，太平洋海岸联盟是美国棒球界仅次于大联盟的第二大联盟。现在连绵的战争几乎摧毁了东海岸的棒球业，太平洋海岸联盟现在是这片土地上最高水平的联赛，由于我们政局的相对稳定，棒球人才已经开始涌向西部。扬基队队员和旧金山本地人乔·迪马吉奥已经归乡为他的家乡队，即海豹队打球，现在，他们面对着一个非常强大的圣地亚哥教士队，要与年轻的泰德·威廉姆斯和乔的弟弟文斯争夺冠军。[GetPrimeMinister]总统将亲自举办开幕式，这将是个出席人数众多的系列赛的开端，会极大地振奋全国人民的人性。"
 pacificstates.115.a:0 "带我去看球赛！"
 pacificstates.116.t:0 "美国职棒大联盟球队西迁"
 pacificstates.116.d:0 "美国内战对全国大部分地区造成了很大的破坏，包括许多隶属于前大联盟的棒球场。在太平洋海岸联盟在过去几个赛季取得成功后，许多大联盟球队现在正决定放弃被摧毁的体育场，向西部进军，以迎战西海岸相对无损的对手。第一支宣布迁往旧金山的球队是纽约巨人队，随后，布鲁克林道奇队宣布将迁往洛杉矶。这两支传奇般的球队都有许多死忠，而新城市的球迷立刻就喜欢上了他们，看起来其他球队很快也会效仿这两支球队。不过，到目前为止，许多其他的东海岸球队都决定留下来，比如传奇的扬基队，他们现在是唯一留在纽约的球队了。"
 pacificstates.116.a:0 "这趟火车得开很久"
 pacificstates.117.t:0 "[GetYear]年世界大赛"
 pacificstates.117.d:0 "内战结束后的第一场世界职业棒球大赛终于来了，急切的美国人蜂拥而至，观看洛杉矶道奇队和纽约扬基队的比赛，这是一场历史上罕见的比赛。乔·迪马吉奥几乎在战争结束后就立即回到了纽约，他在过去的一年里实力得到了突破性的进展，前所未有的在连续56场比赛中安打，这是一项不太可能被打破的纪录。然而即使道奇队以明显的劣势进入这个系列赛，许多洛杉矶的球迷依然相信他们能成功。全国各地的人们都在急切地收听广播，等待着最终胜利者的诞生，唯有这一刻，国家与人民方能在这重建的混乱中得到片刻喘息。"
 pacificstates.117.a:0 "玩球咯！"
 pacificstates.118.t:0 "道奇队的胜利"
 pacificstates.118.d:0 "道奇队完成了看似不可能的任务——在洛杉矶体育场，在7万多名球迷的见证下，在六场比赛中逆天地击败了迪马吉奥以及他那士气高昂的纽约扬基队。道奇队的成功很大程度上要归功于最近从圣路易斯来的乔·梅德维克，他在整个系列赛中成功击败了迪马吉奥。在第4场比赛中，道奇队的接球手米基·欧文差点犯错，导致比赛失败，但道奇队在这一场比赛后扳回一球，逆风翻盘，结束了这场比赛，为最终洛杉矶队的胜利奠定了基础。在这场比赛的结尾，梅德维克把胜利献给了所有在战争中牺牲的人，在这一个光明的日子里，这是一个最好的缅怀。"
 pacificstates.118.a:0 "他们真的做到了！"
 pacificstates.119.t:0 "扬基队的胜利"
 pacificstates.119.d:0 "最后，扬基队在洛杉矶体育场7万多名球迷的见证下，在六场比赛中顺利地击败了道奇队。迪马吉奥，为数不多的大联盟在本赛季中实力回到战前的选手，他一如既往的进攻，但真正的转折点出现在第四场比赛，当时道奇队捕手米基·欧文犯下了一个失误，为扬基队创造了巨大的优势，并趁着这股劲头赢得了这次系列赛。在这场比赛的结尾，迪马吉奥把胜利献给了所有在战争中牺牲的人。在这一个光明的日子里，这是一个最好的缅怀。"
 pacificstates.119.a:0 "你来了，乔·迪马吉奥，我们想死你了"
