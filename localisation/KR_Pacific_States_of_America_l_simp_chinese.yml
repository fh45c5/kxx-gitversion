 CAL_Norton_will_be_Crowned:0 "§Y诺顿二世§!将加冕为§G皇帝§!"
 CAL_nation_of_visionaries:0 "远见者之国"
 CAL_nation_of_visionaries_desc:0 "我们看得出来，民主制正在阻碍国家的繁荣。可是，即使民主制使他们的生活更糟糕，愚蠢的民众却满足于这种有缺陷的制度。但是这个制度现在失败了，其失败成为了扫除民主制、建立一个由远见主义精英领导的新型国家的完美理由。现在，霍华德·休斯和华特·迪士尼各自怀抱不同的带来繁荣的愿景。休斯希望通过使加利福尼亚州变得非常富有的方式来带来繁荣，而迪士尼则通过希望创办大型项目来帮助太平洋国迈向未来。"
 CAL_the_house_always_wins:0 "庄家总会赢"
 CAL_the_house_always_wins_desc:0 "霍华德·休斯掌控了我们的国家。他的繁荣计划很简单：通过给国家带来财富，来让国家变得繁荣，从而确保每个人都能享受到繁荣。他是一个富有魅力但性情古怪的人物，依靠石油和航空产业获得了巨额财富。尽管许多人对他的精神健康状况表示担忧，但他们的担忧对休斯来说无关紧要。"
 CAL_securing_the_strip:0 "买下大道"
 CAL_securing_the_strip_desc:0 "恐怕任何一个神志清醒的人眼中，拉斯维加斯都只不过是个开赌场的小镇，可霍华德·休斯却有不同的看法。他看到的是一块未经开发，潜力无限的钻石原石。在他看来，未来的拉斯维加斯将成为美国的一个巨大的中心：无数的赌场创造无尽的财富、整个美洲大陆的飞机航线枢纽，以及可能成为美国新首都的众多政府机构。在我们买下拉斯维加斯大道之后，休斯将从头开始建设拉斯维加斯。"
 CAL_council_of_buisnessmen:0 "商人理事会"
 CAL_council_of_buisnessmen_desc:0 "为创造繁荣，休斯聚集了加州的一大批豪商富贾，组建了一理事会，成员包括休斯本人及其心腹顾问诺亚·迪特里希、罗伯特·马休、弗兰克·威廉·盖伊、杰克·里尔。这些人将确保繁荣必然，并为太平洋国的所有公民创造巨大的财富。"
 CAL_acheiving_prosperity:0 "实现繁荣"
 CAL_acheiving_prosperity_desc:0 "在我们的土地上，存在着银、铜、金，以及石油和许多其他资源。只要进行投资，这些资源就可以被开采出来，为我们的人民带来巨大的财富，进一步确保国家繁荣。"
 CAL_money_money_money:0 "废止假币"
 CAL_money_money_money_desc:0 "现金是人们所知的最能体现繁荣的一种形式。然而，在现实中，这些“钱”只不过是毫无意义的纸。我们必须逐步淘汰这种假币，代之以更能代表我国国财富总量的货币。比如说，与我们国家的黄金储备挂钩的政府债券。"
 CAL_take_to_the_skies:0 "飞向天空"
 CAL_take_to_the_skies_desc:0 "天空是巨大财富的家园，不是以任何矿物资源的形式，而是以航空运输的形式存在着。这个行业很快就会成为一个高利润的行业，我们处于富裕的加拿大、风景优美的墨西哥和交战的美国之间，这意味着我们是主要航线的经过地。因此，作为一名飞行员，休斯自己也加入了这个游戏，并向太平洋航空业投入了大量资金。"
 CAL_prosperity_at_all_costs:0 "授权摩门黑手党"
 CAL_prosperity_at_all_costs_desc:0 "弗兰克·威廉·盖伊已召集逾千名耶稣基督后期圣徒教会成员组成休斯总统的“秘密警察”部队。这支心向繁荣、纪律严明的保镖团体将毫不费力地扫除总统道路上的一切阻碍，包括但不限于那些胆敢质疑我们追求繁荣过程中所谓无谓牺牲的异议者。即便这些微不足道的代价是家园尽毁、水源毒化，乃至物种灭绝。"
 CAL_a_brand_new_vegas:0 "新维加斯"
 CAL_a_brand_new_vegas_desc:0 "既然拉斯维加斯已经到手，霍华德·休斯就可以开始书写他的巨著了。拉斯维加斯将被改造成一个全民繁荣的中心。赌场将带来难以想象的财富，而休斯的新家将位于赌城中心的一座巨大的新宫殿。尽管他把拉斯维加斯变成美国首都的计划失败了，但一旦项目完成，休斯将把大部分时间花在拉斯维加斯。"
 CAL_new_propaganda_machine:0 "休斯的宣传机器"
 CAL_new_propaganda_machine_desc:0 "休斯对好莱坞的运作并不陌生，他自己执导过许多影片，在好莱坞导演的核心圈子里也有朋友。他也知道如何利用这种影响力，因为他最终会影响导演们创作出“令人满意”的作品。这些电影将有助于在休斯总统周围建立一种强烈的个人崇拜。"
 CAL_a_dictarorship_of_wealth:0 "繁荣的最终保障"
 CAL_a_dictarorship_of_wealth_desc:0 "我们做到了；我们实现了真正的繁荣。繁荣遍及加利福尼亚、俄勒冈、华盛顿和内华达，每个家庭都能发现数不清的财富。然而，我们国家的民主似乎已经死亡；当然，这并不意味着人们会怀念它。他们现在都看到了民主是他们贫穷和黑暗的万恶之源。"
 CAL_benevolence_and_progress:0 "仁善与进步"
 CAL_benevolence_and_progress_desc:0 "华特·迪士尼已经接管了我们的国家。他的计划是“将太平洋国带入未来”。尽管很少有人认为他能真正实现这个承诺，但迪士尼总统向我们保证，他的计划将涉及大规模项目，包括发电厂、大规模基础设施项目、主题公园和公共交通。此外，迪士尼自己作为漫画家的背景将有助于为支离破碎的美国带来娱乐，以及……对人民施加影响。"
 CAL_california_dreaming:0 "加州梦"
 CAL_california_dreaming_desc:0 "尽管有些人可能还在继续谈论所谓的“美国梦”，但无论他们所描述的是什么，现在肯定已经不复存在了。而现在，迪士尼没有选择复活他们死去的梦想，而是转而去创造一个新的梦想，一种新的精神。太平洋国的梦想存在于我们所有人的心中；在太平洋国，艺术家不会畏惧审查机构在那里；在太平洋国，科学家不会被琐碎的道德所束缚；在太平洋国，伟大不会被渺小所束缚！"
 CAL_connecting_the_pacific:0 "连接起太平洋国"
 CAL_connecting_the_pacific_desc:0 "迪士尼计划的一个关键部分是用高效、廉价和高速的铁路网络连接太平洋各州的每一寸土地。这个雄心勃勃的项目可能要花费数百万美元，但一旦你能在几个小时多一点的时间内从西雅图到洛杉矶，那这成本就算不上什么了；一切都是值得的。"
 CAL_disney_paramilitary:0 "迪士尼安保部队"
 CAL_disney_paramilitary_desc:0 "无政府状态的威胁仍然潜伏在我们国家，虽然现在它可能还只是一颗种子，但灾难性的事件会将整个国家的安全置于危险之中。因此，为了减轻军方可能无法应对的威胁，迪士尼已经下令组建精锐的准军事部队，随时准备好轻松保护迪士尼和其他任何事情。"
 CAL_pacific_vineyards:0 "西海岸葡萄园"
 CAL_pacific_vineyards_desc:0 "我们国家的巨大优势之一是我们广阔的葡萄种植面积，但它有时会被忽视。这些巨大的种植园出产美洲最好的酒，而且价格相对便宜。因此，我们不会像某些人那样试图压制一个潜在的利润丰厚的市场，而是会投入大量资金，这样我们的葡萄园就可以通过向饱受战争蹂躏的美国和世界各地的人们销售廉价、优质的酒来赚取数百万美元。"
 CAL_atomic_age:0 "原子时代"
 CAL_atomic_age_desc:0 "虽然有些愚蠢的人可能将原子视为一种毁灭工具，但我们看到，原子技术的最大好处不在于其毁灭能力；而是它们产生能量的能力。因此，按照总统的意愿，大笔资金将投入原子研究，也许不久我们就有能力使原子分裂，创造一个核能的广阔世界。从核汽车和火车，到为家庭供暖的核反应堆，一切都有可能。无限可能！"
 CAL_mass_public_works:0 "大规模公共工程"
 CAL_mass_public_works_desc:0 "从公路到水坝，从摩天大楼到游乐园，以及其他的一切，都在以创纪录的数量拔地而起。这一切都是迪士尼将太平洋国工业化并带给人民繁荣的庞大计划的一部分。不久，太平洋国将成为一个真正的乌托邦，每一寸土地都连接在一起，向着明天加速前进。"
 CAL_art_of_propaganda:0 "宣传之道"
 CAL_art_of_propaganda_desc:0 "宣传不仅仅是美国人所说的那样。宣传是一种艺术，像迪士尼这样的人也应该知道。因此，迪士尼庞大的娱乐帝国已经开始制作“爱国短片”，向所有人展示迪士尼总统的伟大。当然，对我们有挑战力的媒体公司将全部被收购或解散，一切归迪士尼公司所有。所以，放学后，孩子们会回家看展示迪士尼美妙绝伦的卡通片，而家长们会听由迪士尼公司制作的“新闻广播”。"
 CAL_epcot_progect:0 "前往明天"
 CAL_epcot_progect_desc:0 "明天就是今天！昨天已经过去，现在，我们共同进入了一个全新的启蒙和技术时代。我们停滞不前的时代已经过去了，现在我们可以集中精力发展我们的国家。所以不要回头，不要怜悯旧世界，要走向未来！"
 CAL_disney_a_man_of_myth_and_legend:0 "迪士尼：神话与传说之人"
 CAL_disney_a_man_of_myth_and_legend_desc:0 "尽管迪士尼精心培养了自己的个人崇拜，但他大受欢迎的形象绝大多数时候甚至不需要特意宣传。因为迪士尼的真正成就足以令他受到尊敬，他的作品是对太平洋国的繁荣不可或缺的。纵使时间推移，迪士尼的形象也不会被玷污，因为关于他伟大的神话、传说和故事将代代相传！"
 CAL_limit_the_executives_power:0 "限制总统权力"
 CAL_limit_the_executives_power_desc:0 "由于人们对总统的精神状态充满担忧，太平洋政府的许多高层已经采取限制总统权力的方式，以防止休斯做出过激的举动。这样，即使总统试图采取激烈的行动，一群理智的官员也能阻止他。"
 CAL_keep_him_in_vegas:0 "确保总统留在维加斯"
 CAL_keep_him_in_vegas_desc:0 "休斯总统很少访问首都，他也只呆在拉斯维加斯的家中。也许我们应该让他待在那儿，别让他碍我们的事。也许通过精心设置一些路障和为总统招募更多的“安全人员”，我们可以把他软禁起来。"
 CAL_delegate_authority:0 "委任统治"
 CAL_delegate_authority_desc:0 "现在，许多人可能开始怀疑，没有总统的国家如何运转，这些担忧是有道理的；然而，我们可以通过让总统自愿地将大量的权力委托给内部委员会来解决治理问题。这样，国家才能在总统不能发挥作用的时候充分发挥作用。"
 CAL_the_shadow_president:0 "徒有其表的总统"
 CAL_the_shadow_president_desc:0 "总统只是一介傀儡，一切权力都归属于各大委员会。休斯总统目前正待在维加斯，慢慢地等待着理智的褪去，而在他精神错乱的同时，整个国家还在继续前进。或许过不了多久，总统就将人间蒸发。"
 CAL_break_the_executives_chains:0 "打破权力枷锁"
 CAL_break_the_executives_chains_desc:0 "我们需要一个强有力的政治领袖，一个强有力的人物来领导我们的国家前进。一个不关心宪政的琐碎界限，也不关心愚蠢官僚制定的法治的远见之人。\n\n如果你想看看民主导致的结果，看看窗外吧。"
 CAL_scapegoat_reds:0 "红色威胁"
 CAL_scapegoat_reds_desc:0 "我们的国家受到来自世界各地红色势力的威胁。最明显的就是我们家门口的工团主义者。我们必须确保这些赤匪永远没有机会夺取政权，从底层摧毁我们的国家。因此，一场人为渲染的红色恐慌是有必要的。"
 CAL_empower_the_executive_office:0 "总统办公室的权力"
 CAL_empower_the_executive_office_desc:0 "总统的权力是国家最重要的权力之一。我们的行政人员必须坚强、有意愿，不被官僚的条条框框所拖累；这样他就能在国家需要的时候迅速有效地恢复秩序。"
 CAL_sideline_the_senate:0 "边缘化国会"
 CAL_sideline_the_senate_desc:0 "所谓的“国会”是一个完全不被需要的团体。这个无用的机构必须靠边站，并被剥夺权力，直到它们与总统相比，只是一种礼仪性的东西。这样一来，一旦时机成熟，我们就能把这具无用的尸体丢进焚化炉。"
 CAL_rule_by_drcree:0 "敕令治国"
 CAL_rule_by_drcree_desc:0 "现在，任何唱反调的人都已被赶下台，任何拦路人都被边缘化或彻底清除，总统正以铁腕统治这个国家。官僚主义将不再侵犯有远见的人的权力，而远见者将带领国家前进。"
 CAL_an_imperial_satellite:0 "帝国卫星国"
 CAL_an_imperial_satellite_desc:0 "太平洋国的未来必将得以解决，这需要我们的日本恩主的帮助。虽然我们期望自由，但现实点，我们需要日本来保护我们不受世界上各个暴君的伤害。"
 CAL_begin_integration:0 "开始一体化"
 CAL_begin_integration_desc:0 "太平洋国的未来必将得以解决，我们选择了融入帝国的道路。如果我们能继续鼓励日本移民，迫使白人们改变更多的法律，我们就能蒙住这些愚蠢的外族人的眼睛！"
 CAL_partners_in_prosperity:0 "共荣共存"
 CAL_partners_in_prosperity_desc:0 "美国的未来是明确的，我们是一个世界大国，因此我们需要空间来发挥我们的强大力量。虽然日本在这一点上给了我们很大的帮助，但这并不意味着我们应该屈从于东京天皇的统治。现在重要的是我们要把我们间的关系重新定义为平等的关系！"
 CAL_cultural_collaboration:0 "文化协和"
 CAL_cultural_collaboration_desc:0 "既然我们的文化开始相互交流借鉴，我们应该鼓励我们的公民创造新的艺术形式，以展现我们两国美丽的文化结晶！"
 CAL_working_with_the_japanese_market:0 "参与日本市场"
 CAL_working_with_the_japanese_market_desc:0 "现在，相矶藤雄掌权了，我们与日本兄弟之间的宿怨可以结束了。藤雄是日本移民的后代，他和一些知日派非常明白，我国未来的道路是与日本合作，而不是去对抗他们。随着风暴席卷美国，日本将成为我们为数不多的盟友之一。"
 CAL_cultural_exchange:0 "文化交流"
 CAL_cultural_exchange_desc:0 "由于美日关系正处于升温期，我们现在可以互相借鉴对方文明的优秀成果，并以此为契机促进我们两国人民间的友谊。"
 CAL_pacific_trade_fleet:0 "太平洋贸易舰队"
 CAL_pacific_trade_fleet_desc:0 "既然我们与日本市场建立了互利互惠的关系，我们就应该建立一支庞大的贸易船队，这样我们就可以在两国间互通有无，满足彼此需要。"
 CAL_expand_japanese_immigration:0 "增加日裔移民"
 CAL_expand_japanese_immigration_desc:0 "那帮孤立主义的反动老骨头妄图限制日裔移民甚至将其驱逐出境。但是现在，藤雄掌权了。我们可以终止他们对日本人民这种无理排斥，并让他们有更多在太平洋国创造新生活的机会。"
 CAL_reverse_the_ozawa_case_ruling:0 "推翻小泽高雄案裁决"
 CAL_reverse_the_ozawa_case_ruling_desc:0 "美国法院对小泽高雄案的裁决是基于种族主义原则和充满歧视心理的裁决，还损害了美日关系。现在，相矶藤雄——他本人就是法官，准备推翻这一不公正的裁决。"
 CAL_the_yamagatan_candidate:0 "影武者"
 CAL_the_yamagatan_candidate_desc:0 "很明显，相矶藤雄不会屈服于我们的意愿。然而，大摇大摆地夺取政权可能会适得其反。因此，我们必须以更微妙的手段来夺权。我们将刺杀藤雄，并用一个忠诚的替身替代他，这肯定万无一失。"
 CAL_crush_the_asiatic_exclusion_league:0 "镇压排亚联盟"
 CAL_crush_the_asiatic_exclusion_league_desc:0 "排亚联盟长期以来一直是相矶藤雄的眼中钉。这个群体代表着着他一生中所遭受的歧视。因此，为了我国对日关系的前途着想，就必须粉碎这一集团，他们的影响也必须从太平洋国消失。"
 CAL_aiso_the_american:0 "美国人藤雄"
 CAL_aiso_the_american_desc:0 "相矶藤雄不会屈服于那些盼着皇军来的日本狗腿子们。太平洋国更不会屈从于东京的天皇，太平洋国和日本将保持现有的伙伴关系，我们与日本帝国的牢固关系将继续畅通无阻的维持下去。"
 CAL_removing_asian_immigration_quotas:0 "取消亚洲人移民限额"
 CAL_removing_asian_immigration_quotas_desc:0 "是时候驳回1924年颁布的移民法案了。在相矶藤雄的执政下，这部歧视性反日法律最终将会被扫进历史的垃圾堆；亚洲人将可以像欧洲人一样，自由地移民到太平洋国的各州生活。"
 CAL_stranger_in_a_strange_land:0 "异乡异客"
 CAL_stranger_in_a_strange_land_desc:0 "相矶藤雄也许长得像我们，但毫无疑问，他在思想和精神上都是外国人。他必须被免职，让位给……一个更讨人喜欢的本国人。"
 CAL_pacific_prosperity:0 "太平洋繁荣！"
 CAL_pacific_prosperity_desc:0 "混乱和不稳定席卷了太平洋各州，这让相矶藤雄法官和临时最高法院接管了这个国家。现在相矶藤雄已经掌权，他将寻求在太平洋国内进行改革，并与我们的日本朋友一同携手前进。"
 CAL_Norton_Restoration:0 "诺顿复辟"
 CAL_Norton_Restoration_desc:0 "尽管困难重重，太平洋国君主制支持者还是在权力斗争中走上巅峰。现在，新设立的摄政会议打算加冕诺顿的合法继承人为新皇帝。但是，我们必须先巩固国家。"
 CAL_Remove_Naysayers:0 "移除反对者"
 CAL_Remove_Naysayers_desc:0 "国内许多人还是质疑帝制的必要性。但是，他们的观点毫无价值，这些说*不*的人必须出局，要对其加以羞辱，并赶到不会危害我们的地方去。掌权的是支持帝制的人，不是他们失败的共和制。我们才是主流，他们已经边缘化了。"
 CAL_Discard_Republicanism:0 "抛弃共和思想"
 CAL_Discard_Republicanism_desc:0 "旧共和党和民主党仍然存在，并且还是忠于他们失败的共和理念。他们以及其他反对帝制的党派，还有共和思想，都必须被抛弃，任其腐烂。"
 CAL_Crown_Norton_II:0 "加冕诺顿二世"
 CAL_Crown_Norton_II_desc:0 "就如同约书亚·诺顿从南非前来美国，查尔斯·罗斯·诺顿也是如此。他是诺顿一世的合法继承人，理应被加冕为我们的皇帝，我们将为他举行加冕仪式——这是诺顿一世从没有享受过的。当然了，这场华丽的仪式不单单只有太平洋国精英参加，来自全世界的达官显贵也都会出场。"
 CAL_Restructure_Govt:0 "重构政府机构"
 CAL_Restructure_Govt_desc:0 "现在我们打造了一个帝国，我们必须重构太平洋国的旧制度，新政府将由强大的君主领导，由议会监督。当然，我们还要处理诺顿二世如何统治的问题：君主立宪制或是专制。"
 CAL_Constitutional_Monarchy:0 "建立君主立宪制"
 CAL_Constitutional_Monarchy_desc:0 "诺顿不希望像个暴君一样统治，更愿意做个吉祥物。他领导的政府应当向以前一样运转，他只是作为权威的象征。一个团结全太平洋国国民的象征。"
 CAL_Absolutism:0 "专制主义"
 CAL_Absolutism_desc:0 "就是选举把我们搞得一团糟的，从现在开始，最好实行威权统治。毕竟，人们支持诺顿不就是想要一个能重建秩序的人物吗？"
 CAL_True_Pacific_Empire:0 "真正的帝国"
 CAL_True_Pacific_Empire_desc:0 "现在国家巩固了，我们可以真正地自称帝国了。美利坚太平洋国已经成为过去，取而代之的是一个更加强盛伟大的国家。美利坚太平洋帝国万岁！诺顿二世万岁！"
 CAL_Honor_Norton_I:0 "纪念诺顿一世"
 CAL_Honor_Norton_I_desc:0 "对于很多人来说，约书亚·诺顿就是个疯子，疯到了没有任何才干就敢自封“美利坚皇帝”的地步。但是他可不疯，我们必须教导国民诺顿一世是一个伟大的人，他理应登上皇位。各个政府大楼都会树立他的雕像，悬挂他的画像。是时候纪念我国未被传颂的英雄了。"
 CAL_All_For_The_King:0 "一切为了皇帝！"
 CAL_All_For_The_King_desc:0 "没有我们的皇帝的权力，我们的国家将枯萎和死亡；就像古老的共和国一样枯萎、死亡。所以，人们要为皇帝建造雕像和纪念碑，并建造一座巨大的宫殿来纪念他；他的头像会出现在每一枚硬币、每一张证书和每一张钞票上。这样，我们才能充分地表达我们皇帝的尊重。此外，我们应该遵从皇帝的命令，再次投资当今世界上最重要的研究机构之一，加州大学伯克利分校，以吸引更多的聪明头脑来到这个国家。"
 CAL_Hand_Out_Royal_Titles:0 "授予皇家头衔"
 CAL_Hand_Out_Royal_Titles_desc:0 "由于“美国君主制”的概念是相当新的，所以我们拥有的贵族数量很少，甚至不存在。然而，我们可以通过将贵族头衔出售给出价最高的人，或者是那些在这个国家最有影响力的人来解决这个问题。当然，还有我们领导人的朋友和忠诚的退伍军人。这样，我们才能拥有真正的高贵身份。因此，如果你想成为俄勒冈公爵，拍卖将在12点开始。"
 CAL_Protect_Mexico:0 "墨西哥的保护者"
 CAL_Protect_Mexico_desc:0 "约书亚·诺顿也被称为“墨西哥护国公”，这个头衔也传给了他的继任者。现在墨西哥再一次陷入混乱，我们必须利用这一头衔来恢复墨西哥国家的秩序，也许我们自己也需要。"
 CAL_Greater_California:0 "夺取大加利福尼亚"
 CAL_Greater_California_desc:0 "让东方的美国人争吵吧，这不关我们的事。我们不再是美国人，我们不再以任何形式宣称自己是美国。我们比美国更好，我们是太平洋帝国；现在是时候关注我们的帝国了。"
 CAL_Retake_America:0 "重夺美国"
 CAL_Retake_America_desc:0 "诺顿宣称自己是全美国的皇帝，而不仅仅是加州的皇帝。所以，是时候给予诺顿一世最大的荣誉了。现在是解放美国、让美国人民重享和平、繁荣和负责任的治理的时候了。"
 pacificstates.1.e:0 "为避免战祸，亨利·“哈普”·阿诺德介入并颁布了戒严令"
 KX_california.1.t:0 "太平洋国临时政府"
 KX_california.1.a:0 "跟随相矶藤雄和临时最高法院"
 KX_california.1.b:0 "追随迪士尼"
 KX_california.2.t:0 "干预派抗议"
 KX_california.2.d:0 "虽然宣布太平洋国独立的决定肯定不会受欢迎，但却少有人能预料到具体会到什么程度。全国各地抗议四起，一方面是因为我们对几乎所有党派的禁令，另一方面是因为我们决定任命迪士尼这样一个政治上名不见经传的人物领导太平洋国。虽然抗议起初还算和平，但在分离派发起反抗议后，局势迅速演变成了暴动。加州和华盛顿州国民警卫队已经动员到各大城市，尝试恢复秩序。\n\n为了遏制进一步的暴力，迪士尼总统决定对全国发表广播讲话。他要做出艰难选择，他必须决定是支持分离派，延续独立太平洋国的梦想，还是打破与分离派的合作，着手再一统美国。"
 KX_california.2.a:0 "合众国已死，太平洋国之梦万岁！"
 KX_california.2.b:0 "阿诺德的政变是出于误导，我们要向华盛顿进军！"
 KX_california.3.t:0 "暴乱不断升级并失去控制"
 KX_california.3.d:0 "在华特·迪士尼决定继续保持国家的分裂后，已经十分危险的暴动演化到了无法控制的境地，国民警卫队也束手无策了。波特兰、西雅图和旧金山等大城市已经沦陷，现在几乎就是爆发了小型内战。甚至萨克拉门托也出现了血腥屠杀，暴动者与数支国民警卫队部队发生冲突，但尽管如此，萨克拉门托的大部分仍然在政府手中。\n\n随着国家进一步陷入混乱，迪士尼总统决定再次发表演讲，这一次他亲自上马，希望能恢复稳定和团结。迪士尼的安保顾问不建议这样做，因为肯定会有人想暗杀他。但是，迪士尼一点也没有听进去。\n\n迪士尼的演讲很千寻，但是没几个人愿意听。在他准备结束演讲时，人群中发生骚乱，一个年轻人试图靠近迪士尼的讲坛，他抽出手枪，然后……"
 KX_california.3.a:0 "……向天射击，催发暴动！"
 KX_california.3.b:0 "……向迪士尼射击，杀死了他！"
 KX_california.4.t:0 "处于崩溃边缘的国家"
 KX_california.4.d:0 "[CAL.GetLeader]恢复太平洋国家的稳定的失败，导致了全国社会秩序的崩溃。抗议和骚乱正在演变成叛乱，干预还是独立的争论使家庭分裂；让邻居们拿起武器互相攻击。\n\n在国家濒临崩溃的情况下，军队决定亲自出手。忠于[CAL.GetLeader]的军官报告军队正准备再次把阿诺德将军送上总统宝座，希望他能恢复[CAL.GetLeader]没能恢复的稳定。报告同时指出阴谋还在发展阶段，建议总统动员武装力量，他们仍然可以恢复秩序。在深思熟虑后，[CAL.GetLeader]总统决定……"
 KX_california.4.a:0 "……召集军队，希望能恢复秩序"
 KX_california.4.b:0 "……召集军队，希望能恢复秩序"
 KX_california.5.t:0 "休斯对国会的最后一次演讲"
 KX_california.5.d:0 "“国将不国，\n军不成军，\n必须采取行动，\n却无人作为。”\n\n霍华德·休斯于太平洋国会发表讲话时，这些字句在议会厅内反复回响。休斯越讲，其言辞就越加刻薄，因为他开始将国家的弊病归咎于国会。演讲快结束时，他的话语变得无比阴险，就像他谴责民主，谴责社会主义，谴责他所称呼的那些人的名字一样。在演讲的最后，休斯宣读道：“国家要实现真正的繁荣，就必须克服一件阻碍……民主。”\n\n演说落幕瞬间，军方人员冲进大厅，逮捕了所有国会议员。宪兵队把这群政要押往了秘密地点，而忠于政变集团的部队则以残酷手段镇压了各大城市的暴动。"
 KX_california.5.a:0 "毕竟，豪斯总是赢家"
 KX_california.6.t:0 "迪士尼对国会的最后一次演讲"
 KX_california.6.d:0 "“国将不国，\n军不成军，\n必须采取行动，\n却无人作为。”\n\n华特·迪士尼于太平洋国会发表讲话时，这些字句在议会厅内反复回响。迪士尼越讲，其言辞就越加刻薄，因为他开始将国家的弊病归咎于国会。演讲快结束时，他的话语变得无比阴险，就像他谴责民主，谴责社会主义，谴责他所称呼的那些人的名字一样。在演讲的最后，迪士尼宣读道：“国家要实现真正的繁荣，就必须克服一件阻碍……民主。”\n\n演说落幕瞬间，军方人员冲进大厅，逮捕了所有国会议员。宪兵队把这群政要押往了秘密地点，而忠于政变集团的部队则以残酷手段镇压了各大城市的暴动。"
 KX_california.6.a:0 "为了仁爱与进步！"
 KX_california.7.t:0 "分崩离析"
 KX_california.7.d:0 "虽然许多人期望阿诺德再次出手能恢复太平洋国家的稳定，但实际上却适得其反。军队面临着大规模的哗变现象，武装叛乱分子已经占领了主要城市。支持独立、支持干预、支持军方，甚至前总统的支持者在街头发生冲突。工团分子占领了西雅图，朗派和宪政国分子在乡间激战。\n\n虽然他尽力了，但显然阿诺德让太平洋国燃起了内战之火。他能否扭转局势恢复秩序还有但观察，但没有多少人天真到相信这种事真的会发生的地步。"
 KX_california.7.a:0 "肯定不会有好事……"
 KX_california.8.t:0 "诺顿主义者的复兴"
 KX_california.8.d:0 "在太平洋国面临着最严重的混乱的时候；许多悲痛欲绝的民众并没有转向军队或被禁止的党派，而是转向了一个似乎已经复活的旧观念。对大多数美国人来说，约书亚·诺顿是一个毫无根据地自称美国皇帝的疯子，但对忠诚的加州市民来说，他远不止是个疯子。在这些不稳定的时期，大量的公民转向诺顿，把他作为稳定和团结的象征。对诺顿的理想化变成了寻找诺顿继承人的渴望，并希望他加冕成为美国的皇帝。"
 KX_california.8.a:0 "真是出人意料"
 KX_california.9.t:0 "帝制支持者企图发动政变"
 KX_california.9.d:0 "越来越多的人希望看到君主政体在加州被确立，他们终于采取了行动。由于阿诺德政府在恢复秩序方面无能为力，“诺顿主义者”只好自己承担起恢复秩序的责任。数千名“诺顿主义者”的游行达到了高潮，他们要求阿诺德下台，让帝国主义者去组建政府。几个月前，这样的景象是看不见的，他们的要求也被认为是荒唐的；但现在，这个曾经处于边缘地位的群体有了获得权力的合法机会。"
 KX_california.9.a:0 "靠边站，让帝制支持者来干活"
 KX_california.9.b:0 "打击这些疯子！"
 KX_california.10.t:0 "帝制支持者组建政府"
 KX_california.10.d:0 "在阿诺德允许帝制支持者进入议会后，一系列新的法律在枪口下被批准。这些新法律重组了太平洋政府，用帝国议会取代了国会，并下令成立帝国摄政委员会，直到找到合适的皇帝为止。这些法律都得到了阿诺德的批准，他已经宣誓效忠于这个组织。后来，忠诚的军人被召集起来帮助恢复国家秩序。随着稳定似乎指日可待，军队的士气空前高涨。同时，所有军队成员都必须向皇帝宣誓，无论皇帝是谁。"
 KX_california.10.a:0 "为了帝国！"
 KX_california.11.t:0 "政变未遂"
 KX_california.11.d:0 "随着诺顿的支持者和阿诺德的支持者在一场血腥的战斗中决一死战，萨克拉门托的街道被鲜血浸透。议会在当天的大部分时间里都处于崩溃的边缘，诺顿主义者和军方支持者轮流推进着前线。随着时间推移，仍然没有明确的获胜者。然而，由于一次偶然的爆炸，阿诺德的大部分联系线路中断了，导致诺顿主义接近风暴眼内的首都。国家的命运就取决于这关键的几秒钟，现在看来……"
 KX_california.11.a:0 "……帝制支持者占领了政府大楼！"
 KX_california.11.b:0 "……阿诺德击退了诺顿派的进攻！"
 KX_california.12.t:0 "第二太平洋国临时政府"
 KX_california.12.a:0 "……任命最高法院首席法官"
 KX_california.13.t:0 "确保拉斯维加斯"
 KX_california.13.a:0 "……谁会争夺这片贫瘠的沙漠？"
 KX_california.14.t:0 "宣布首相选举"
 KX_california.14.d:0 "既然诺顿二世已经允许建立君主立宪制，就必须选举新的议会和新的首相。因此，选举定于本月晚些时候举行，美国的几大政党将在新的君主制度下争夺权力。在这次选举中，诺顿二世拒绝支持任何一位候选人或政党，太平洋合众国的命运完全掌握在它的人民手中。"
 KX_california.14.a:0 "太好了！"
 KX_california.15.t:0 "新的独裁"
 KX_california.15.d:0 "既然诺顿二世决定保持威权主义的国家，就产生了对我们政府的性质的问题。一些人认为当前的傀儡立法机构和威权政府运作良好，而另一些人则认为任何形式的立法机构都是不必要的，诺顿应该作为一个真正的绝对君主来统治。"
 KX_california.15.a:0 "君主专制"
 KX_california.15.b:0 "维持现状"
 KX_california.16.t:0 "庄家出局"
 KX_california.16.d:0 "霍华德·休斯既是太平洋国最宝贵的资产，也是其最危险的负债，这样矛盾的形象早已维持了多年——同无与伦比的天才构想相伴相生的，是连绵不断的精神问题。休斯总统患有严重的强迫症与痛觉超敏（衣物摩擦或理发等正常刺激都会引发疼痛），其行为难以预料。面对休斯每况愈下的精神状态，太平洋繁荣理事会采取了强制措施，将其软禁在了拉斯维加斯某家自家旗下的酒店中，隔绝于政务之外。休斯的幕僚偶尔会对外透露一些消息，详细说明总统的一些一经提出就会被迅速驳回的疯狂要求。当然，休斯的幕僚深知他绝不会亲自查证，便也乐于用谎言去搪塞。那些仍效忠于休斯的理事会成员，如今只能通过电话而非面谈接受总统的“接见”。电话那头的“休斯”声称会持续关注政府动态，并保证这位太平洋国的“命运建筑师”仍在幕后掌舵——殊不知，与他们通话的实则是经过专业训练、能完美模仿总统声线的口技艺人。"
 KX_california.16.a:0 "霍华德·休斯，报告"
