 KX_california.68.t:0 "破碎之国的命运"
 KX_california.68.d:0 "相矶藤雄选择了自己的美国血脉，并着手肃清起了政府内的亲日美奸，不过，新的问题也随之浮现：是联合日本同伴收复美国故土，还是继续在本土深耕“太平洋国之梦”？两种路线各有其拥趸，一方渴望将美亚共荣的荣光播撒遍美利坚大地，而另一方则断言“美利坚合众国”不过是个失败的实验品——我们自当铸造太平洋之天堂，让美利坚在泥沼中自生自灭。不过，即便是在最坚定的太平洋国公民心底，仍蛰伏着难以割舍的美利坚家国情怀，那是拯救战乱同胞的热望，是重现大洋间统一国度的执念。相矶藤雄本人同样深陷两难：究竟是该全力守护太平洋海岸的基业，还是为那早已破碎的合众国保留最后的温情？"
 KX_california.68.a:0 "让其自生自灭吧"
 KX_california.68.b:0 "是时候重拾天命了"
 pacificstates.4011.t:0 "老流浪者博丹"
 pacificstates.4011.d:0 "随着内战威胁的消除与潜在政敌的肃清，埃德·博丹总统（他简化了原名，认为所有名字都应简短神圣）开始公开承诺恢复民主常态。这位始终批判威权主义的领袖主张民主治理必须摒弃精英主义、激进主义与个人腐化，尽管其自身理念亦存独特之处。\n\n新近出版的诗集《予我自由》通过“老流浪者”（博丹塑造的导师型角色兼自我投射）与诗人自身的苏格拉底式对话，揭示其难以捉摸的信仰体系：书中，博丹借老流浪者之口表达对阶级或种族冲突煽动者的憎恶，同时将罗伯特·E·李与亚伯拉罕·林肯并列为真正的美国英雄，并呼吁建立跨信仰的普世宗教兄弟会。老流浪者的民粹主义论调与博丹的政治修辞如出一辙——既痛斥一切贵族统治，又揭露将民主沦为闹剧的伪君子。此外，他抨击为政治出卖国家与信仰的自由派（强调真正的流浪者必是爱国者），同时谴责左右两翼极端分子。老流浪者还反复宣扬流浪者美德，声称该隐是首位流浪者，尽管土八该隐倡导兄弟情谊，但该隐直到同为流浪者的基督受难十字架才获救赎——此说显露博丹潜在的救世主情结，即自视为美国亟需的弥赛亚。在1940年旧作《震慑我！》中，博丹坦承对灵质、恶魔、僵尸、狼人等超自然议题的笃信，引发公众对其神智的质疑。该书致谢名单包括68位特定人物：亚瑟·J·伯克斯、拳王杰克·登普西、露丝·莱昂斯、洛厄尔·托马斯、纳撒尼尔·沙克纳、西奥多·廷斯利、F·奥林·特里梅因、亚瑟·里奥·扎加特、威廉·B·齐夫及其门生L·罗恩·哈伯德等人。博丹还自称法国法学家让·博丹后裔，并哀悼其敬仰的老罗斯福逝世——他推崇的进步经济理论现由乔治·诺里斯与菲奥雷洛·拉瓜迪亚等政客继承，由此可窥见其庞杂的思想源流与盟友网络。\n\n秉持民粹信条的博丹总统决意兑现承诺，坚信人道且审慎的保守派民粹主义与跨党派爱国主义是治愈美国的唯一良方。为此，他已在全美重启地方选举，除总统职位外所有政职均通过公平自由的选举重新民主化。博丹将留任总统直至其认定美国无需他庇护之日，而在此期间，他将不懈推动其毕生追求的跨信仰和平兄弟会愿景。"
 pacificstates.4011.a:0 "真正的美式民主诞生了！"
 pacificstates.3593.t:0 "承认“自杀小队”"
 pacificstates.3593.d:0 "加州理工学院有一专攻新兴喷气推进领域的科研团队，以实验狂野、爆炸频发而荣膺“自杀小队”之名，其成员包括美籍的杰克·帕森斯、华裔的钱学森、捷克裔的弗兰克·马利纳等五人。近日，这支由各国天才组成的小队取得了突破性进展，其设计用于抵达大气层边缘收集实验数据的探空火箭正不断突破现代火箭技术的极限。团队的研究成果也引起了军方高层的关注，并因此获得了一千美元的专项经费，用于研发“喷气助推起飞”技术。在该团队设计的火箭即将装配空军战机之际，许多人都由衷地希望这些曾因实验爆炸获得戏称的研究者们，能够在新技术的应用中真正摆脱“自杀小队”的宿命。"
 pacificstates.3593.a:0 "希望他们别给火箭炸死了"
 KX_california.69.t:0 "致敬犬伴"
 KX_california.69.d:0 "说起旧金山街头的奇人异士，诺顿一世皇帝虽最为出名，却也绝非孤行一身。街坊间另有一对流浪狗搭档：巴默和拉撒路，常伴于皇帝左右——虽然诺顿反对与小小犬类同框，但当时的漫画插图却屡现三者同游之场景。不过，这段特殊关系不仅存在于人犬之间，两只狗自身更是形影不离的生死至交。1861年，当时尚未得名的拉撒路与另一只野狗搏斗身负重伤，命悬一线。巴默昼夜以体温为其取暖，衔食哺喂，终使同伴奇迹康复。市民遂以《圣经》中耶稣复活的同名门徒为之命名。\n\n康复后的双犬结成了亲密无间的拍档，更因二十分钟灭杀八十五只老鼠的超凡捕鼠技能免遭当时街头常见的毒杀厄运。旧金山民众对它们钟爱有加：当拉撒路被捕狗队带走时，愤怒的市民集体抗议，甚至推动官方将其认证为了市政财产，让其得以自由活动。虽非诺顿皇帝饲犬，[ROOT.GetLeader]仍认为这对犬伴完美诠释了太平洋帝国子民的精神特质，特铸纪念铜牌以彰其传奇。"
 KX_california.69.a:0 "两条尾巴一起摇"
 KX_california.70.t:0 "社会信用之择"
 KX_california.70.d:0 "预算与国防开支虽已获总务府批准，宗主国依旧赐予了我们一些经济事务上的自主权。为此，宣传专家兼总务府成员戴维·沃伦·赖德提出了一项雄心勃勃的构想：于太平洋沿岸推行社会信用理论。社会信用理论虽在加拿大、澳大拉西亚等英语文化国家站稳了脚跟，但在美国，除了已遭取缔的联邦党外，其得到的支持可以说是寥寥无几。在推动经济重建的过程中，发行无债货币既能夯实经济基础，又可争取民心，摆脱言听计从的东京傀儡形象。只要完成移民配额指标，并保证资本在太平洋两岸的稳定流动，宗主国想必也不会在乎这点事情。不过，部分人士担忧此政策有惊扰日资之虞，应加倍奉行泛亚主义，维系东京方面的青睐。"
 KX_california.70.a:0 "以太平洋之团结为重"
 KX_california.70.b:0 "试试赖德的想法吧"
 POLITICS_WILLIAM_KNOWLAND_DESC:0 "作为国会议员兼报业巨头约瑟夫·R·诺兰之子，威廉·诺兰的成长历程浸润着鲜明的政治色彩。这位政治神童十二岁就为1920年共和党候选人公开助选，1925年高中毕业时已成为学生会主席。加州州长C·C·杨和加州大学校长威廉·华莱士·坎贝尔对其大学期间的政治活动赞誉有加，诺兰果然在1929年毕业后迅速投身政坛，1932年其当选加州众议员，1934年又晋升州参议员。\n\n1937年，诺兰加入护宪军服役，但保留州参议员席位（加州法律允许此例）。从列兵、军士起步，经军官候补学校培训后授少尉衔。服役期间晋升至少校，凭借其文教背景与军事素养专司民政及公共事务。退伍后虽放弃连任竞选，仍以共和党加州党部核心人物身份活跃全国政坛，更担任两年共和党全国委员会执行委员会主席。\n\n当加州资深参议员海勒姆·约翰逊逝世后，诺兰正式跻身国家级选举政治。这位以强硬外交政策与反社会主义立场著称的政治家，于1952年获共和党提名角逐总统大位。若当选，他必将以强势姿态在全球舞台推进美国利益。"
 pacificstates.19.f:0 "威廉·诺兰"
 pacificstates.5.d_2:0 "民主党高层在[GetYear]年共提名四位总统候选人：加利福尼亚州实业家亨利·J·凯泽以温和纲领参选，俄勒冈州参议员、前军官查尔斯·H·马丁则持更右翼政见。此外，诗人兼两届国会众议员约翰·S·麦格罗蒂也参与角逐民主党提名。民主党候选人究竟花落谁家？"
