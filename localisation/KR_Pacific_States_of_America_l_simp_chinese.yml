 CAL_authoritarian_democrat_party:0 "太平洋防卫司令部"
 CAL_authoritarian_democrat_party_long:0 "太平洋防卫司令部(Pacific Defense Command)\n§g作为美利坚太平洋国脱离联邦后的军事支柱，太平洋防卫司令部及下属的太平洋国海军都团结在老将亨利·阿诺德的身边。这些支持美利坚民主传统的军人们毫无疑问对如今的太平洋政权忠心耿耿，但随着分离主义与和平主义在这个新生的国度蔓延，军队中也有越来越多的干部与军官开始摇摆，质疑如今政权参与美利坚内战的必要性。在必要时刻，太平洋防卫司令部将会出手干预国家走向，以便保证绝大多数太平洋国人民的财富与生命不受野心家，叛徒甚至是异国的侵犯。§!"
