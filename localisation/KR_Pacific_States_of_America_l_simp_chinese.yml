 CAL_Marshall_plan_idea_2_desc:0 "在新一届国会的批准下，约翰·C·马歇尔现在已经是新的西部防务指挥部总司令，我们现在需要为尽可能快的赢下这场战争而努力，不然的话我们的小伙子们只能深陷落基山脉的泥潭中难以脱身。马歇尔认为若是我们的敌人之一能彻底的控制东海岸和中西部地区，那美利坚的自由就已经万劫不复了，所以我们必须要尽快出击，在敌人未成形之前击溃他们。"
