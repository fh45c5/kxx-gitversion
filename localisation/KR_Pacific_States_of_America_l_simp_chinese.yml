 CAL_Marshall_plan_idea_1:0 "马歇尔-阿诺德计划"
 CAL_Marshall_plan_idea_1_desc:0 "在新一届国会的批准下，约翰·C·马歇尔被任命为新任西部防务指挥部总司令，我们现在需要为速胜而努力，不然我们的小伙子们便只得深陷落基山脉的泥潭之中。马歇尔认为，若是我们的敌人之一能彻底控制东海岸和中西部地区，那美利坚之自由便万劫不复，所以我们必须要尽快出击，在敌人尚未坐大之前击溃他们。"
