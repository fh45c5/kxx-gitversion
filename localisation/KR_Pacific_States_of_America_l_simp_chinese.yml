 CAL_arnold_coup:0 "百万性命得救……"
 CAL_arnold_coup_desc:0 "美国内战即将爆发。为了保护我们的社会免受全面战争的冲击和恐怖，阿诺德将军和他的“和平主义”支持者发动了一场反对临时太平洋政府的政变。阿诺德将军无意继续掌权，他计划在和平实现后就立即请辞。毕竟，想要真正拯救百万性命，就必须自己动手……"
 pacificstates.2080.t:0 "宪法改革"
 pacificstates.2080.d:0 "路易斯·B·迈耶是米高梅电影公司的联合创始人，也是太平洋国的主要盟友，尽管他不任总统一职，但他仍是共和党的主要成员，并通过他的公司帮助协调相关宣传工作。然而，他和他在国会的盟友最近提议了一项宪法改革，他们声称，这项改革将允许非本地入籍公民参加总统竞选，并为我们赢得所需的支持，因为他出生在俄国，迈耶显然是在考虑竞选总统。获得他和其他移民的支持可能会对我们有所帮助，尽管一些当地人对这一改革感到愤怒。"
 pacificstates.2080.a:0 "不敢苟同"
 pacificstates.2080.b:0 "通过"
 KX_california.34.t:0 "奉天之命？"
 KX_california.34.d:0 "诺顿二世当时正在尤里卡寓所的办公室里待着，那里的海岸美景让他想起了自己的故居南非开普，但美国现在是他的新家了。他当时正在写一封皇家信件，颁布一项皇家援助令，当他低头看这些信件时，他突然意识到，他是某个来自外国的美国皇帝，因为他与一个疯子有着遥远的血缘联系。这是不应该发生的，也不可能自行发生，一定是有人或什么东西让这种事情发生的。他从桌子旁站起来，开始在房间里踱来踱去。“这太不正常了，太傻逼了。”他不停地自言自语着。他必须把这个事实告诉所有人，这比他自己更重要，比内战更重要，比复兴诺顿主义更重要。他已经弄明白了，他明白了在过去几年的疯狂的背后到底是什么，就在他的脑子转个不停的时候，有人打开了门，走进了他的房间。她问：“喝茶么，陛下？”当他意识到这只是他的仆人而已时，他松了一口气，“我希望你不要再这样叫我了。”于是他决定问这个仆人一个问题：“你不觉得这很混乱么？我莫名其妙地成为了皇帝？”，仆人回答说：“虽然我认为这几年乱糟糟的，但我很高兴我们有像你这样的人负责领导国家，尽管这还是有点荒谬。”说完这句话，她傻笑了一下，然后向他鞠了一躬，离开了房间。在这次互动之后，诺顿二世瘫倒在椅子上，他想，是有人在控制他，这一切才能发生的，他之所以在这里是有原因的，他要以任何可能的方式帮助这些人。想到这次领悟，诺顿从椅子上站起来，穿上他的皇家礼服，收拾好东西，返回了首都，因为他还有很多事情要做。"
 KX_california.34.a:0 "我的天啊……"
 KX_california.35.t:0 "王与他的人民"
 KX_california.35.d:0 "有人建议诺顿二世通过广播发表演讲，以获得其对新常态的支持。诺顿坐在广播室里，想了很多事，他的美国之旅，向首都的进军，以及废除政党制度的决定。当通知诺顿开始演讲的红灯亮起时，他开始讲话，而演讲一开始，数百万美国人都凑在收音机前听着。诺顿从他最近被加冕为皇帝，他的旅程，最重要的是他为什么要废除政党制度开始讨论。“我来到这里的时候才意识到，我们之所以陷入这种混乱，罪魁祸首正是政客们，正是他们导致了数百万人在战壕里自相残杀，正是他们导致了美国不再稳定，这是一个艰难的决定，但这也是一个正确的决定。”他接着讲了一会，最后向所有美国人呼吁保持团结友爱结束了演讲。演讲结束后，诺顿起身，到外面呼吸着新鲜空气，同时也思考着，他凝视着首都的天际线，他希望他能信守自己的承诺。"
 KX_california.35.a:0 "我是来保护人民不受政客的伤害的！"
 KX_california.36.t:0 "人民皇帝"
 KX_california.36.d:0 "诺顿二世的日程很紧，自从他成为皇帝，他一直在尽他所能帮助他的新国度的人民。他大部分时间都忙着在全国各地旅行，接见贫困的人和受战争影响的人。而晚上，他撰写着法令，帮助那些他见不到的人。这些慈善活动吸引了很多民众，在访问期间，他会和普通民众打成一片，并尽力亲自接见这些地方的每个人。正因为如此，诺顿或得了非官方的称号，即“慈善之帝”，制造商们已经开始制作诺顿主题的纪念品，如诺顿二世的毛绒玩偶，这些玩偶已非常受人民欢迎，并被数百万人所喜爱。"
 KX_california.36.a:0 "转了个大弯，美国人竟爱上了君主"
 KX_california.37.t:0 "新帝继位"
 KX_california.37.d:0 "杰勒德·诺顿，在父亲驾鹤归西之后，便登临那高高在上的皇帝宝座，加冕为诺顿三世。这诺顿三世，其容貌、性情皆与父亲颇为相似，对慈善事业有着与父亲同样炽热的热爱，对黎民百姓亦是关怀备至。他投身于帝国的军事行动之中，开始愈发频繁地运用起皇帝的权力，其推动变革的积极程度，甚至犹胜其父。在最近的演讲与行动里，诺顿三世已然表明，帝国已然迈入了一个崭新的纪元。虽与父亲统治时期相比，帝国的前行方向有所转变，但此新纪元却赢得了人民的全力拥护与支持。"
 KX_california.37.a:0 "合格的继承人"
 KX_california.38.t:0 "有远见的总统"
 KX_california.38.d:0 "华特·迪士尼总统站在他别墅边的悬崖上，凝视着远方，而副总统马克斯·弗莱舍向他走来。“你在想什么，华特？”他问。华特转过身回答说：“一些很棒的事情”，马克斯傻笑了一下。他把胳膊搭在马克斯的肩膀上，边走边说，“你看啊，马克斯，这个国家是建立在梦想家的思想之上的，而正是这些梦想家，将会把这个国家从彻底毁灭的边缘拯救出来。民主党的派阀之争从杰斐逊年代以来一直是美国的大患，我不想重蹈覆辙。”他轻轻地说着。聊着聊着，他和麦克斯漫步穿过他的豪华别墅，来到他的车道，当他们准备上车时，华特转了下头，面向马克斯，问道：“马克斯，我能指望你来帮我决定美国的命运吗？”弗莱舍笑着回答道：“永远都能。”“很好，我就知道我能指望你，马克斯。”华特拍了拍他的肩膀说，“来吧，我们还有很多事情要做。”他说着就上了车，而马克斯紧随其后。"
 KX_california.38.a:0 "我们生活在一个欢笑的世界，一个泪水的世界……"
 KX_california.39.t:0 "宣传艺术"
 KX_california.39.d:0 "华特·迪士尼身上有很多特质：仁慈的领导者、企业家、动画师、远见卓识……这种形容词不胜枚举。在他众多的才能中，最重要的一直是他有能力通过想象力编织一幅神奇的挂毯，用暗示和其影响力使观众顺从他的意愿，从而让大众心服口服。很大程度上，这种能力来自于他对电波的掌握，这些电波在太平洋国及其他地区的天空中疾驰着，在潜移默化地中影响着数百万人的行动和思想。迪士尼公司和国营机构都足够聪明，意识到所有人都是可影响的听众，他们已经开始创造新的节目，不分昼夜地在电视和广播上播放，以吸引比以往都要更多的观众的注意。对于成年人来说，新闻节目、访谈节目和其他成人节目占据了他们主要的空闲时段，而所有这些事物，都受到了迪士尼自己奉行的教条的微妙影响。当成年人反复收听、琢磨着我们播出的更严肃的内容时，全国的孩子们都将享受一番视觉盛宴——华特·迪士尼自己制作的最新动画！随着这些新的娱乐方式在全国范围内的普及和其人气的飙升，迪士尼的影响力也随之增长。"
 KX_california.39.a:0 "空谈误国，实干兴邦"
 KX_california.40.t:0 "米奇妙妙屋"
 KX_california.40.d:0 "随着华特·迪士尼的最新节目充斥着太平洋国的个广播和电视频道，他的影响力和控制范围前所未有的大。迪士尼的成功和受欢迎程度让我们国家的年轻人追捧、崇拜着他。我们有远见的领导人的最新动画，或称卡通，在太平洋国的儿童中取得了爆炸性的成功，特别是由于公众意外地痴迷于迪士尼自己设计的某个老鼠角色——米老鼠，它最近在他的第一部电影《威利号汽船》和《疯狂的飞机》中首次亮相，米老鼠成为了轰动一时的明星，并立即成为了我们人民的文化偶像。考虑到设计的简单，这绝对足以令人惊讶，迪士尼成功中的很大一部分来自于最新的视听设备的应用，这能让他第一部动画短片中视听完全同步，就像启发迪士尼的第一部“有声电影”——最近上映的《爵士歌王》一样。随着年轻人的思想受这些动画影响，整整一代人甚至还没来得及考虑反叛思想，就已在迪士尼的控制下了。"
 KX_california.40.a:0 "谁是那为你我而生的领袖……"
 KX_california.41.t:0 "豪斯先生的秩序"
 KX_california.41.d:0 "霍华德·休斯的雄心之一就是给祖国带来繁荣，为此，他开展了许多商业计划，尝试为国民经济提供动力。其中最重要的就是在拉斯维加斯开发一座新城市。维加斯是霍华德的杰作，这位富商收买了当地所有帮派，开始打造博彩业和赌场。当地人非常感激，称呼霍华德为“豪斯先生”，看起来他的影响力无处不在，不管他本人究竟身处何处。霍华德很少亲自露面，虽然有人质疑他长年闭门规划拉斯维加斯是否值得，但看起来他的努力终于得到回报。城市正在快速崛起，酒店和赌场四处可见，拉斯维加斯就是一个例子，也许霍华德和他的人民终于得到了苦苦追求的繁荣。最终……"
 KX_california.41.a:0 "……成功之道在于深思熟虑！"

 KX_california.43.t:0 "霍华德·休斯在飞机失事中幸存！"
 KX_california.43.d:0 "作为1932年休斯飞机公司的创始人，霍华德·休斯与航空工业有着密切的联系，而休斯本人就是世界上最多产的设计师之一，他帮助创造了能够以其速度打破世界纪录的飞机，他与各种工程师和设计师也交往甚密。就在今天，休斯再次测试了他的最新发明。此前，他驾驶着这架飞机，仅用91小时就完成了环球飞行，创下了世界纪录。然而，这一次，他的飞机坠毁在米德湖，几乎要了休斯的命。然而休斯，这位航空爱好者，拒绝放弃他的梦想，把这次事故归咎于他的失误，并支付了修复飞机的费用。尽管他的许多公民质疑他的判断力，但没有人会怀疑他的勇气。当休斯准备搭乘另一架飞往国会大厦的飞机时，他已经准备好工作了。"
 KX_california.43.a:0 "美国航空的胜利？"
