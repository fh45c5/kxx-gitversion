 pacificstates.40.t:0 "美国的新首都？"
 pacificstates.40.d:0 "当美国再次统一之时，许多人开始为了新首都的地点而争论不休，到底哪座城市会最终胜出呢？"
 pacificstates.40.a:0 "华盛顿特区"
 pacificstates.40.b:0 "旧金山"
 pacificstates.40.c:0 "萨克拉门托"
 pacificstates.40.e:0 "圣路易斯"
 pacificstates.41.t:0 "对华政策"
 pacificstates.41.d:0 "国会中充满了关于对华贸易问题的争论；然而由于中国政局的混乱，国会一时居然说不清到底要和谁合作，甚至有人认为不如直接放弃和中国本土势力的谈判，转而和其他列强合作……"
 pacificstates.41.a:0 "我们会和大清合作"
 pacificstates.41.b:0 "我们会和中华民国合作"
 pacificstates.41.c:0 "我们会和日本合作"
 pacificstates.41.e:0 "我们会和东亚总局监事会合作"
 pacificstates.43.t:0 "失去在华贸易特权"
 pacificstates.43.d:0 "随着中华民国的灭亡，我们与他们的贸易协定宣告无效。我们需要做些工作来收回成本。"
 pacificstates.43.a:0 "我的钱呢？没了？！"
 pacificstates.44.t:0 "失去在华贸易特权"
 pacificstates.44.d:0 "随着大清帝国的覆灭，我们两国间的贸易协定已被宣告无效。我们需要做些工作来收回成本。"
 pacificstates.44.a:0 "我的钱呢？没了？！"
 pacificstates.45.t:0 "失去在华贸易特权"
 pacificstates.45.d:0 "随着日本的灭亡，我们与他们的贸易协定宣告无效。我们需要做些工作来收回成本。"
 pacificstates.45.a:0 "我的钱呢？没了？！"
 pacificstates.50.t:0 "成立众议院非美活动调查委员会"
 pacificstates.50.d:0 "有人提议国会成立一个委员会，专门处理我们社会中的颠覆分子和反对政府的人。这个委员会将被称为“众议院非美活动调查委员会”，致力于将叛徒驱逐出美国。然而，国会内部的一些人质疑它的影响范围，认为它是违反宪法的。国会最终的决定是？"
 pacificstates.50.a:0 "成立这个委员会"
 pacificstates.50.b:0 "这个议案被驳回了"
 pacificstates.51.t:0 "海氏准则：电影新标准"
 pacificstates.51.d:0 "好莱坞决定以美利坚电影协会主席威尔·H·海斯的名字命名一项新的电影界内部审核标准——海氏准则。这项立法的既定目标是确保电影中的“道德”，尽管许多人认为这是一种避免电影中出现工团主义符号的方式，然而，它的有效性可能有点可疑：因为许多导演都对这个守则表示毫无兴趣，他们会尽量在不破坏这个守则的情况下来绕守则中的空子。"
 pacificstates.51.a:0 "利好电影产业"
 pacificstates.52.t:0 "美国的国歌"
 pacificstates.52.d:0 "美国虽于1931年将《星条旗之歌》定为了官方国歌，但内战爆发后其地位便不再明确。如今国会重启争论，欲新立国歌。现有四首候选歌曲进入最终角逐，国会究竟会作何选择？"
 pacificstates.52.a:0 "哥伦比亚，大洋之瑰宝"
 pacificstates.52.b:0 "哥伦比亚万岁"
 pacificstates.52.c:0 "我的国家属于你"
 pacificstates.52.e:0 "星条旗之歌"
 pacificstates.53.t:0 "童工问题"
 pacificstates.53.d:0 "国会最近提出了一项修正案，禁止全国范围内的童工。\n拟议的修正案如下：\n第1条：国会有权限制、规范和禁止十八岁以下的人的劳动。\n第2条：这一条没有削弱各州的权力，但州法律的运作应在国会制定的立法生效的必要范围内暂停。\n根据美国宪法，这份修正案在参议两院分别获得三分之二的赞成票之后还要再经过两个途径之一才能从“草案”转为“法律”：要么过四分之三州份州长的批准，要么获得美国四分之三以上的州议会的批准，才能通过。那么这份修订案的未来到底会如何呢？"
 pacificstates.53.a:0 "修正案通过"
 pacificstates.53.b:0 "修正案没有获得足够的有效票数"
 pacificstates.54.t:0 "平权修正案"
 pacificstates.54.d:0 "该修正案是在20世纪20年代初通过第十八项修正案后提出的，该修正案允许妇女享有选举权。修正案将作为第19个修正案跟进，进一步保护美国各地妇女的权利。\n修正案内容如下：\n第一节：联邦政府和各州政府不得以性别为由拒绝或限制法律规定的平等权利。\n第二节：国会有权通过适当立法强制执行本条的规定。\n第三节：本修正案自批准之日起两年后生效。\n根据美国宪法，它必须得到两个州的立法机构的批准：四分之三的州的立法机构或四分之三的州批准公约。修正案会被通过吗？"
 pacificstates.54.a:0 "修正案通过"
 pacificstates.54.b:0 "修正案没有获得足够的有效票数"
 pacificstates.55.t:0 "排华法案"
 pacificstates.55.d:0 "在十九世纪时，中国移民在美国备受歧视，他们不能获得真的公民权，也不被认为是美国的新移民，而《排华法案》则是在法律上确认了这一点。国会现在正在讨论是否应该废除该法案，或者继续保留该法律。"
 pacificstates.55.a:0 "废除该法案"
 pacificstates.55.b:0 "法案保留"
 pacificstates.56.t:0 "反三K党法案"
 pacificstates.56.d:0 "在1865年美国内战结束之后，总统和国会一直在颁布法律来阻止三K党和他们的恐怖行为。而在威尔逊总统和帕尔默副总统的任期内，三K党又再一次的重生，还加入了威廉·默里这个暴君的队伍里。现在他们的叛逆行为将使得他们将不会在美国有任何形式的容身之处。当然，有些人认为，我们应寻求与前三K党成员达成和解，重点打击那些现在还在积极谋划对抗国家的人。"
 pacificstates.56.a:0 "三K党徒的末日！"
 pacificstates.57.t:0 "劳工法"
 pacificstates.57.d:0 "国会最近提出了一套法律，将首次确立联邦最低工资和每周最高工时。最低工资法规定全国最低时薪为每小时25美分，而最高工时法规定每周基本工作时间不得超过40小时。这些法律在国会被整合在一起，这意味着如果其中一个失败或通过，另一个也一样。我们要签署通过吗？"
 pacificstates.57.a:0 "通过法案"
 pacificstates.57.b:0 "进一步提高最低工资"
 pacificstates.61.t:0 "国家公园组织法案"
 pacificstates.61.d:0 "国会提出了一项法案，要重组国家公园管理局，将所有国家公园、国家纪念馆、国家公墓、国家军事公园和国家首都公园合并在它的保护伞下。此外，该法案还将扩大国家公园管理局下属土地的数量。"
 pacificstates.61.a:0 "重整国家公园管理署"
 pacificstates.62.t:0 "移民辩论"
 pacificstates.62.d:0 "当美国民主制度得以保全之际，联邦政府面临的局势使我们无暇厘清移民政策。这意味着劳工部筹划的一项允许墨西哥劳工获得美国临时工作权的协议暂时搁浅。如今选举落幕，民主党政权得以延续，我们终于能够着手处理这一议题。这项由劳工部提出的计划旨在缓解西部劳动力短缺问题，甚至获得了共和党人的支持。传统上，我党坚持遵守《难民条款》，维护本土美国工人主导经济走向的权利。但在重建美国的特殊时期，劳动力缺口正急剧扩大。或许我们应当破例放行？"
 pacificstates.62.a:0 "是的，我们需要劳工"
 pacificstates.62.b:0 "不，民主党的精神不允许被侮辱"
 pacificstates.63.t:0 "好莱坞逃税"
 pacificstates.63.d:0 "为了促进真正的美国价值观，与好莱坞建立更紧密的关系似乎是明智的。然而，好莱坞不光彩的会计手法的浮华妖媚地扰乱了我们衡量回报的能力。这些私人资助的爱国主义作品从销售总额中收取利润，它们的数额一直很高。然而，我们从这些交易中获得的个税收入几乎为零。这种不一致的分配需要重新谈判！电影公司被告知，伪造账目的做法将使他们失去美国政府的支持！"
 pacificstates.63.a:0 "也许我们可以对爆米花征税？"
 pacificstates.64.t:0 "东方世界和平运动的曝光"
 pacificstates.64.d:0 "当他们警告我们日本渗透时，起初大家认为这只不过是我们的情报机构反应过度，但事实证明，我们在这种怀疑上所耗费的精力是完全有意义的。在我们于西海岸发起的最新行动中，特工们查获了发给日裔与非裔美国精英人士的宣传小册子，这些小册子质疑我们政府的合法性。他们的来源可以追溯到一个名为“东方世界和平运动”的组织，该组织的领导层似乎支持太平洋日裔联盟，而该联盟主张日本应该在亚洲无限制地扩张帝国主义，常以非华人少数民族为目标，承诺在日本的统治下他们能取得更大的社会自由。我们已经逮捕了许多同谋者，但出乎众人意料，没有任何证据能将他们与日本大使馆联系起来。"
 pacificstates.64.a:0 "真是奇怪的团体"
 pacificstates.65.t:0 "教派公社主义与后期圣徒教会"
 pacificstates.65.d:0 "最近几个月间，基督教会和摩门教徒分别表达了各自的观点，希望在教会内部强化教派公社主义以对抗工团主义的影响。值得注意的是，教会推出了一个以信仰为基础的福利计划，巧合的是，这个项目被称为“教会福利计划”。该计划旨在为摩门教徒提供支持的同时还呼吁建立更多的主教仓库救济非信徒公民。由于教会在西部各州的影响，这样的行动也转化为了公众对他们的支持。"
 pacificstates.65.a:0 "支持公社主义"
 pacificstates.66.t:0 "对军工企业的审判"
 pacificstates.66.d:0 "不少军工企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 pacificstates.66.a:0 "允许他们再度开张"
 pacificstates.66.b:0 "叛徒不配得到赦免"
 pacificstates.67.t:0 "对重型设备企业的审判"
 pacificstates.67.d:0 "不少重型设备企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 pacificstates.67.a:0 "允许他们再度开张"
 pacificstates.67.b:0 "叛徒不配得到赦免"
 pacificstates.68.t:0 "对航空企业的审判"
 pacificstates.68.d:0 "不少航空企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 pacificstates.68.a:0 "允许他们再度开张"
 pacificstates.68.b:0 "叛徒不配得到赦免"
 pacificstates.69.t:0 "对船舶企业的审判"
 pacificstates.69.d:0 "不少船舶企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 pacificstates.69.a:0 "允许他们再度开张"
 pacificstates.69.b:0 "叛徒不配得到赦免"
 pacificstates.70.t:0 "对工业企业的审判"
 pacificstates.70.d:0 "不少工业企业曾于内战时期服务于叛乱分子。日前，国会正式举办听证会裁决其命运：是允许其恢复运营，还是以叛国罪加以论处？"
 pacificstates.70.a:0 "允许他们再度开张"
 pacificstates.70.b:0 "叛徒不配得到赦免"
 pacificstates.71.t:0 "薰衣草恐慌"
 pacificstates.71.d:0 "伴随着愈演愈烈的所谓的红色恐慌，[GetPrimeMinister]通过了10450号行政命令，扩大了国家安全风险的定义，包括“任何犯罪、臭名昭著、不诚实、不道德或臭名昭著的不光彩行为、过量使用麻醉剂、吸毒或性变态”。这导致5000多名被指控为同性恋的联邦雇员被解雇。"
 pacificstates.71.a:0 "我们应该保护美国的安全"
 pacificstates.72.t:0 "阿梅莉亚·埃尔哈特与“九十九名女飞行员”"
 pacificstates.72.d:0 "随着内战的结束，阿梅莉亚·埃尔哈特重新恢复了“九九女飞”组织组成和支持培养女性飞行员的事业。其中一些飞行员试图通过女子航空勤务飞行队加入空军。"
 pacificstates.72.a:0 "乘客以外的生活会更有魅力"
 pacificstates.73.t:0 "顽石坝竣工"
 pacificstates.73.d:0 "“我来，我见，我被征服。正如所有人生来首次目睹人类之伟业一般。十年前，我们今日聚集之地只是一片人迹罕至、令人生畏的沙漠。一条湍急的危流奔腾于阴森森的峡谷底部。峡谷峭壁高达千尺，两边的山上既无小道，更无人烟，烈日炙烤大地，亦无草木遮盖。从前，博尔德市不过是长满了仙人掌的荒地，这些年来却发生了翻天覆地的变化，这真是二十世纪的奇迹。”在今天终于胜利竣工的顽石坝前，[CAL.GetLeader]开始了他的演讲，将旁听者引入了一个引人入胜的、关于创作与奉献的故事之中。"
 pacificstates.73.a:0 "……我谨代表全国人民，向你们说一声：“辛苦了。”"
 pacificstates.74.t:0 "铁路国有化项目"
 pacificstates.74.d:0 "进步党内一直有人希望将国内铁路国有化，而现在他们得到了机会，他们便要正式的开始运动起来了，不过国会内部的民主党和进步党议员一直对此持强烈的反对态度，而农工党则是对此问题表示了中立，所以现在问题就十分的……尴尬。无论如何，现在国会内部的意见分两种，一派只国有化铁轨，而对机车表示毫无兴趣，另一派则是坚定的认为一切铁路公司，无论是铁轨运行商还是机车运营商都要被国有化，哪一派会占上风？"
 pacificstates.74.a:0 "只国有化铁轨就够了"
 pacificstates.74.b:0 "国有化铁轨和机车！"
 pacificstates.76.t:0 "休斯总统与航空业"
 pacificstates.76.d:0 "霍华德·休斯因经营航空业务而出名，许多飞机都是他自己设计或批准的。作为总统，他对航空事业的热爱一如既往，他相信拥有一支强大的空军和航空业对美国有利。为此，他与军方和政府领导人共同组建了联邦航空管理局。美国联邦航空局将全权监管民用航空，包括航空安全法规的制定、航空导航和交通管制，以求促进航空业的发展。休斯相信，这将让美国成为一个“在机翼上的国家”。"
 pacificstates.76.a:0 "飞向蓝天！"
 pacificstates.101.t:0 "黑针尖对白麦芒"
 pacificstates.101.d:0 "安德里亚·佩雷斯与西尔维斯特·戴维斯的婚姻案件最终上诉到了最高法院。根据美国人口普查结果，安德里亚·佩雷斯被归为白人，西尔维斯特·戴维斯被认为是黑人。然而，加州的法律禁止“所有白人与黑人、蒙古人、马来族成员或黑白混血儿的婚姻都是非法和无效的”，而且“任何人员都不得授权白人与黑人、黑白混血儿、蒙古人或马来族成员的婚姻”。因此，当地的县长W·G·夏普遵照加利福尼亚的婚姻法，拒绝了这对种族混合情侣的结婚请求。\n\n然而佩雷斯在他的律师-丹尼尔·G·马歇尔的帮助下，正式的提出了针对加州婚姻法的诉讼。在审判中，有人提出了一个论点，即佩雷斯和戴维斯都是天主教徒，他们想要一个天主教婚姻，包括弥撒，但因为加州婚姻法拒绝他们的婚姻，他们认为加州法律剥夺了他们神圣的婚姻权力。\n\n然而，他们案件的命运掌握在最高法院手中。法院应该怎么做？"
 pacificstates.101.a:0 "最高法院的结果为4比3，宣布加州婚姻法违宪"
 pacificstates.101.b:0 "最高法院的结果为3比4，宣布这对夫妇不能在加州结合"
 pacificstates.102.t:0 "静悄悄的沙滩谋杀"
 pacificstates.102.d:0 "一位在拉斯维加斯被谋杀的男子何塞·盖拉多·迪亚斯成为了这座狂欢之城最新的新闻。不过这起谋杀案的后续则更有意思-拉斯维加斯警方在谋杀案发生后经过调查宣布在案发地点附近的一个由17个墨西哥裔少年组成的帮派是这起谋杀的凶手，但这引发了一系列的争议。有许多的抗议者和新闻媒体认为这些孩子们只是被警方所诬陷了，这17名孩子并没有足够的动机去犯下这起谋杀案，同时警方所公布的证据也不足以定他们的罪。但是现在法院已经完成了审判，17人中的9人被指控二级谋杀，并被判处在圣昆廷监狱服刑，其余的人则被关押在洛杉矶乡村监狱。\n\n此案在高加索裔民众中引发了对墨西哥裔美国人的敌意，警方和媒体都将所有墨西哥年轻人描述为“潜在的流氓和少年犯”。"
 pacificstates.102.a:0 "倒霉的迪亚斯"
 pacificstates.103.t:0 "“阻特装”暴动"
 pacificstates.103.d:0 "随着战争的进行，定量配给制度现在已经开始实行。尽管如此，拉丁裔美国人社区的一些人还是想通过穿阻特装（一种需要军用布料生产的时髦穿着）来表达自己的时尚。许多美国白人认为穿阻特装是犯罪和道德败坏的标志。洛杉矶的紧张局势持续升级，直到暴力冲突的最终爆发。士兵和水手殴打穿着阻特装的墨西哥人并发起了一场针对墨西哥人的暴乱。与此同时，当地媒体倾向于赞扬水手和士兵“对洛杉矶的恶棍和流氓进行了净化”。现场的一名记者凯里·麦克威廉斯写道：\n\n“数千名士兵、水手和平民在洛杉矶市中心的街道上游行，他们殴打每一个他们能找到的身穿阻特装的人。暴徒们冲进了重要的电影院，命令影院管理人员打开房子的灯，然后在过道上跑来跑去，把墨西哥人拖出座位。当墨西哥人、一些菲律宾人和黑人被从座位上拽下来，推到街上，以一种施虐狂的疯狂方式殴打时，电车被停了下来”"
 pacificstates.103.a:0 "这可不是好事"
 pacificstates.104.t:0 "“阻特装”暴动"
 pacificstates.104.d:0 "在[From.GetNameDef]洛杉矶，年轻的墨西哥人与墨西哥裔移民正在遭到迫害。他们的商店被洗劫一空，更多的暴行被集中在他们的人身安全上。国外的流氓记者们甚至加入到这种无耻的暴行中，鼓励暴徒们继续采取行动。对墨西哥国会中的许多人来说，这是一种羞辱。我们对这种凌辱的愤怒不仅为了那些前往美国做工的墨西哥公民，还有那些已经获得美国国籍却仍在血缘上与我们联系在一起的人。一封给[From.GetAdjective]当局的信希望确保停止这一切无端的暴力。"
 pacificstates.104.a:0 "向国务院提出申诉！"
 pacificstates.105.t:0 "麦古肯事故调查委员会"
 pacificstates.105.d:0 "“阻特装”暴乱之后，墨西哥政府向美国国务院提出了正式抗议。为了缓和美墨间的紧张关系，由洛杉矶大主教约瑟夫·托马斯·麦古肯领导的麦古肯事故调查委员会宣告成立。该委员会报告得出的结论是，种族主义显然是骚乱的中心，并指出“新闻媒体将阻特装与犯罪报告联系在一起的做法是一种相当令人难过的悲剧”。加州州长任命全国律师协会主席罗伯特·肯尼组建“国内骚乱和平干预委员会”主席以向警方日后处理相关问题提出合理建议。“人群关系委员会”是另一个事故后新设的部门，他的主要职责是监督警察部门训练其警官平等对待所有公民的意识。"
 pacificstates.105.a:0 "希望就这样结束吧……"
 pacificstates.106.t:0 "加利福尼亚州太平洋国际博览会"
 pacificstates.106.d:0 "今天，加利福尼亚太平洋国际博览会在圣地亚哥正式开幕。这次博览会一定程度上是为了促进圣迭戈的发展并扶助其经济而举办的——1925年后由于经济萧条的影响，圣迭戈的经济增长明显放缓——博览会内有数百个展品，涉及历史、艺术、园艺、民族文化、科学和工业。一些特许展品是相当不同凡响的，比如黄金峡谷、失落的姆大陆、佐罗花园裸体主义者殖民地与“一吨重的机械人”。博览会在377天的运营中吸引了722万名游客，为圣迭戈直接创造了3770万的收入。因为博览会展品的受欢迎程度太高，许多展览建筑被修缮，以使之成为永久性展品。"
 pacificstates.106.a:0 "让我们明年再做一次"
 pacificstates.107.t:0 "《公民凯恩》上映"
 pacificstates.107.d:0 "奥逊·威尔斯执导的《公民凯恩》迅速赢得了众多电影观众与影评界的好评。许多人认为这部电影在摄影、音乐和剪辑方面富有开创性。影片是关于一名虚构的报业大王——查尔斯·福斯特·凯恩的半传记电影。在电影剧情中，凯恩的新闻事业从早年奉献于社会的理想主义日渐蜕化为对权力的无情追求，过程令人复杂而唏嘘。然而有趣的是，现实里的报业大亨——威廉·伦道夫·赫斯特对这部电影感到非常的愤怒，他甚至禁止自己的报纸发表任何有关这部电影的消息，并对那些并没有那么做的报社进行了攻击诽谤。尽管他义愤填膺，但这并没有阻止人们去看这部电影。"
 pacificstates.107.a:0 "蔷薇花蕾"
 pacificstates.108.t:0 "《绿野仙踪》"
 pacificstates.108.d:0 "最近的电影《绿野仙踪》激发了公众的热烈讨论。该片改编自莱曼·弗兰克·鲍姆的儿童畅销书，由朱迪·加兰、弗兰克·摩根、雷·博尔格、伯特·拉尔、杰克·哈雷、比利·伯克、玛格丽特·汉密尔顿和查理·西柚主演。它的著名之处在于它对色彩的运用，这要归功于技术色彩的创新。无论是观众还是评论家，都认为这部电影制作的非常成功。"
 pacificstates.108.a:0 "沿着黄砖路走"
 pacificstates.109.t:0 "旧金山时装周"
 pacificstates.109.d:0 "旧金山有时被称为西方的巴黎。因此，为了使它成为世界文化中心之一，每年春天这里都会举办为期一周的时装节活动。全美的时装设计师都会聚集到旧金山，开始自己的设计公司，为将旧金山建成世界文化与时尚之都而无上努力。希望她最终能为自己真正冠冕“西方巴黎”的称号而骄傲。"
 pacificstates.109.a:0 "美国的新时尚"
 pacificstates.110.t:0 "派拉蒙案正式宣判"
 pacificstates.110.d:0 "近日，[Root.GetNameDef]最高法院就电影公司制度诉讼案作出判决，这一法律纠纷已经持续了数年，核心问题是电影制片厂的经营制度问题，例如他们是否应该被允许拥有自己的影院。经过多年的反复辩论、妥协与翻案上诉后，这项争议终于被提交到最高法院。最高法院对作出了明显有利于独立电影人而抑制传统影业巨头的判决，宣称这种精英制度有违反托拉斯法的精神。自此，这场旷日持久的司法诉讼案为经典的“捆绑预购”与“垂直整合”制度画上了句号，标志了旧好莱坞时代的结束。"
 pacificstates.110.a:0 "制片巨头们的霸权结束了"
 pacificstates.111.t:0 "超级武器预算"
 pacificstates.111.d:0 "过去数年内，我国军事研究主要集中于潜在的国内冲突，忽视了对长期项目应有的照顾和经费补贴。幸运的是，今年的国会预算有望批出额外经费，用以维持一项长期科研计划的研制工作。军事最高指挥部向我们提出三项可行的计划，有助于赶超美国的宿敌们。（1）戈达德的火箭，理论上它能在不危及飞行员生命安全的情况下，向数英里外的地方发射爆炸物。（2）奥本海默的理论炸弹，其原材料是奥地利与德国曾研究过的放射性重金属。（3）威廉·赖希的炸弹研究，他希望运用自己的物理学知识创造某种更为廉价的炸弹。"
 pacificstates.111.a:0 "戈达德的火箭"
 pacificstates.111.b:0 "奥本海默的炸弹"
 pacificstates.111.c:0 "威廉·赖希的炸弹"
 pacificstates.112.t:0 "戈达德火箭发射成功"
 pacificstates.112.d:0 "从新墨西哥州罗斯威尔的家中，戈达德再度启程前往试验场观摩火箭发射试验。上次来到这里的时候，研究小组发射的火箭比他的大腿还小，飞行高度也至多一千英尺。如今，新式火箭在沙漠上空飞行数英里，并最终用上面装载的哑铃实现着陆。戈达德拒绝在陆地上引爆火箭，以免外界据此推测这项武器的确切杀伤规模。"
 pacificstates.112.a:0 "戈达德干得好"
 pacificstates.113.t:0 "奥本海默炸弹成功试爆"
 pacificstates.113.d:0 "奥本海默向全欧洲的核研究人员、物理学家和工程师发出了邀请，试图逃离欧洲迫害犹太科学家尤其对他的承诺感兴趣，他们中的不少人都干脆为了这个项目移民到了美国。经过一年半的试验和与欧洲同事间的一些交流合作，一枚可运作的原子弹已做好了试验准备。新墨西哥州阿拉莫戈多的天空在毁灭般的闪光中被熊熊地点燃。奥本海默事后说，这枚原子弹是以他最喜欢的一首约翰·多恩的诗歌命名的。"
 pacificstates.113.a:0 "屏住呼吸……"
 pacificstates.114.t:0 "威廉·赖希失败了"
 pacificstates.114.d:0 "经历了反复拖延，以及数次对总参谋部的混淆视听之后，威廉·赖希的炸弹计划被强制中止，数百万美元浪费在了这场毫无意义的实验中。在测试他所谓的机体亢奋能时，观察员发现只有威廉·赖希及其同事才能观测到由这种能量引起的放热反应。这颗炸弹不过是一个用好几层金属包裹起来的空壳，压根不具备爆炸的能力，而在调查过程中，赖希又把它砸了个稀巴烂。这场尴尬的闹剧正在被各路报纸大肆宣传。"
 pacificstates.114.a:0 "这不是什么值得骄傲的事情……"
 pacificstates.150.t:0 "太平洋宣言"
 pacificstates.150.d:0 "自乔治·华盛顿和平地把权力转让给约翰·亚当斯那刻起，美国政府就以选举之后尊重人民的意愿而闻名。人民和政府之间心照不宣的契约现在被麦克阿瑟匪帮侵犯。麦氏以所谓“维护稳定”之名践踏了这个伟大国家最基本的原则。其对标志着美国独立以来国家精神的健康军民关系之摧残真可谓是我们的国殇。\n\n为回应麦氏僭主之行径，加利福尼亚州，华盛顿州，俄勒冈州的州长们起草了一份联合声明，共同谴责麦氏，要求立刻撤离华盛顿。我们怀疑他会积极地回应，但是无论如何我们必须要奋起对抗暴政和压迫，就像1776年我们父辈所做的一般。"
 pacificstates.150.a:0 "为了共和国！"
 pacificstates.151.t:0 "西海岸宣言"
 pacificstates.151.d:0 "弗兰克·梅里亚姆，在与俄勒冈及华盛顿州长协商后日前发表了一篇令人震惊的公开声明。他声称如果所谓美国价值观的“保护者”不能对宪法条文中最基本的人权予以尊重——他指的就是道格拉斯·麦克阿瑟——那么捍卫美国人民不可剥夺之权利的重担将由美利坚太平洋国负责承担。他主张麦克阿瑟推翻现政府的行为本质上是非法的，因此太平洋各州有权利单独组织大选产生一位新总统——尽管是以西海岸极为有限的候选名单为基准，那也应该是具备合法性基础的。不过，按照梅里亚姆的观点，无论谁赢得新的全国大选都会比麦克阿瑟现在的地位更具合法性，只要他们承担起将国家引向民主之路的责任——如有必要，就使用武力。"
 pacificstates.151.a:0 "我们必须维护宪法！"
 pacificstates.152.t:0 "工团主义暴动！"
 pacificstates.152.d:0 "在比尔·海伍德宣布麦克阿瑟政权非法后，许多人曾希望资本家与工团主义者能通力合作复兴美国的民主。遗憾的是，当梅里亚姆州长下令国民警卫队武力驱散萨克拉门托的工团示威者后，这样的幻想破灭了。西部地区许多大城市由此陷入混乱状态，其中更以西雅图为甚。码头工人与卡车司机闯入西雅图市政厅，宣布他们的城市将效忠于比尔·海伍德在芝加哥的工人共和国。目前，该市国民警卫队正与叛乱者在市政厅内外进行着激烈的对峙。"
 pacificstates.152.a:0 "碾碎这群叛徒！"
 pacificstates.153.t:0 "选举暴力"
 pacificstates.153.d:0 "过去几周以来，太平洋各州与华盛顿间的关系可谓摩擦不断。最近，就在“新大选”召开前夕，双方的矛盾正逐渐公开化。尽管国内骚乱发生前不少圣迭戈海军基地的军舰被转移到东海岸地区，但许多船只仍然被留在这里——来自全国各地的海员也是。具体细节目前尚不明确，有消息称当地海军基地指挥官得到华盛顿当局命令，携带武器进入市区，部署到投票地点阻止当地工作人员开启投票站。而后，早间时分，大批暴徒突然将这群士兵团团包围，石块、瓶罐与其他杂物如雨点般落到他们身上。一名水兵在被瓶罐击中决定开火还击，于是整座城市迅速陷入到混乱之中。\n\n加利福尼亚国民警卫队已经出动与忠于麦克阿瑟的水兵与警卫队员爆发激战，宁静的城市已然转变为真正的战区。"
 pacificstates.153.a:0 "乱臣贼子万劫不复！"
 pacificstates.154.t:0 "期限迫近"
 pacificstates.154.d:0 "联邦政府的最后期限日渐临近，显然双方都不会有任何让步。在临时国会的命令下，乔治·马歇尔和亨利·阿诺德领导下的太平洋国军队一直忙于在西部地区集结民兵，太平洋国国民对国家复兴的决心与麦克阿瑟本人的蔑视也随着工作的演进而与日俱增。相应地，联邦政府也明确表示，他们不再寄希望于与我们达成妥协。"
 pacificstates.154.a:0 "这只是时间问题"
 pacificstates.200.t:0 "征用民用卡车"
 pacificstates.200.d:0 "在马歇尔宣布他的陆军机动化计划之后，为了满足我们快速增长的军队需要，我们向总统提出了一项关于征用民用车辆的建议。在他的批准下，我们开始从平民百姓手中夺取车辆，尽管令我们吃惊的是，一些自豪的爱国者在我们的仓库旁排队，自愿献出他们的车辆参加即将到来的战斗。虽然并不是所有的车辆都证明对我们有用，但我们设法征用了相当数量的卡车，这些卡车有些需要一些改装适应军标，也有一些坚固到能马上投入军用。"
 pacificstates.200.a:0 "共和国感谢你的付出！"
 pacificstates.201.t:0 "冰川行动成功！"
 pacificstates.201.d:0 "随着爱达荷州、犹他州和亚利桑那州的光复，“冰川行动”被我们的最高指挥部称为一个巨大的成功。落基山脉得到了保护，我们的工业也得到了安全的保障，我们现在拥有了进攻大平原和南方的一个良好基地，我们将用这个基地击退国贼们，保卫我们的国家。"
 pacificstates.201.a:0 "我们很快就会重返华盛顿特区的！"
 pacificstates.202.t:0 "冰川行动失败……"
 pacificstates.202.d:0 "虽然“冰川行动”取得了一些领土上的进展，但损失太大，收获太少，对战争天平来说无足轻重。目前，落基山脉仍然是多方争夺的地区，我们的长期生存处于危险之中。现在要靠马歇尔和最高指挥部采取一切必要的手段帮助我们生存下去……"
 pacificstates.202.a:0 "我们的战略构思需要重审了……"
 pacificstates.203.t:0 "重审我军坦克设计"
 pacificstates.203.d:0 "在内战结束之后，陆军部认为是时候重申我们在内战时使用的“数量优先”的军工业政策了。作为战后的军工项目之一，马歇尔将军希望我们能为美国陆军生产一款在内战时完成了设计的高速坦克，但这种坦克的不可靠性经常让设计人员和测试人员头疼，而另一帮设计师们提出该型坦克的修改设计草案，其中要求更换悬架和发动机等重要部件，这无疑能改善坦克可靠性，但是会降低坦克的生产速度。我们该怎么选呢？"
 pacificstates.203.a:0 "坦克的可靠性是重中之重"
 pacificstates.203.b:0 "可靠性？在我军坦克故障之前敌军就会被我们扫清了！"
 CAL_HENRY_ARNOLD_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1886年6月25日，美利坚合众国宾夕法尼亚州格拉德怀恩\n§Y军旅生涯：§W亨利·哈雷·阿诺德是美国著名的阿诺德家族一员，他在17岁时就加入了西点军校。虽然他想加入骑兵部队，但由于在学院的成绩和综合表现，他被分配到驻扎在菲律宾的第29步兵团。1911年4月，他请求调往通信兵部队，并于5月在那里完成了飞行员的训练。20世纪10年代末，他继续在空军从事开创性工作，并对世界大战中飞机的发展着迷。20世纪20年代，他和同事威廉·伦德鲁·米切尔一起为独立的空军而战，这导致米切尔被送上了军事法庭。阿诺德和其他著名的飞行员站在一起为米切尔辩护，但没有赢得审判。阿诺德将继续争取独立的空军，试图影响国会议员和招募飞行员他的事业，直到他因“试图以不正当方式干涉立法”为由被送到里莱堡，接下来的几年里他开始写书试图激发年轻人参加航空兵的热情。1928年，他回到陆军指挥和参谋学校，1929年从那里毕业。在1935年之前，他一直在美国陆军中变换职位。直到1935年，他才离开美国陆军，被派往航空兵总部，这是他职业生涯中最接近独立空军的地方，1935年3月2日，他晋升为准将。内战爆发后，阿诺德在得到太平洋国政府任命他为航空兵参谋长的许诺后，决定加入太平洋国并为他们而战。他愿意提供任何技术专长来换取太平洋国政府允许他组建独立空军的许诺。"
 CAL_DADDY_MARSHALL_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1880年12月21日，美利坚合众国宾夕法尼亚州尤宁镇\n§Y军旅生涯：§W乔治·卡特利特·马歇尔，1900年在弗吉尼亚军事学院开始了他的军旅生涯，1902年以美国陆军少尉的身份毕业。马歇尔在菲美战争期间曾驻扎菲律宾，并在战后协助遏制该地区的游击队活动。在世界大战期间，马歇尔和许多其他美国军官作为观察员被派往法国，在那里他因观察工作得力而被提升为上尉。1919年，他在潘兴将军的副官办公室工作了一段时间后被分配到陆军的几个职位使他能够将世界大战中学习到的经验传递给更多没有经验的军官，并帮助陆军实现培训现代化。在此期间，他成为了陆军部的重要策划与撰写人，曾在使馆城市指挥第15团，后来并在陆军战争学院出面任教到1927年。升任中校后，他被任命为本宁堡步兵学校的助理司令官，并任命埃德温·哈丁负责学校出版工作。他曾在不同的步兵团服役，直到1933年晋升为上校。1935年底，由于担心“军队内部不稳定”，几名重要军官被开除军籍，他也得以晋升为陆军准将。麦克阿瑟接管政府后，马歇尔拒绝承认这位老同事为总司令，而当太平洋各州州长揭竿而起之时，马歇尔毅然决定加入他们，这也为他赢得了晋升为陆军上将的机会。他被广泛认为是美国最杰出的参谋之一，也是我们员工中最有经验的成员。\n§Y重要信息：§W马歇尔的父亲是民主党人，母亲是共和党人，无论在公开场合还是私下里，他都是一位政治宽容的人。"
 CAL_ALEXANDER_PATCH_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W 1886年的10月18日，美利坚合众国科罗拉多州杜兰戈\n§Y军旅生涯：§W亚历山大·“桑迪”·帕奇，骑兵指挥官亚历山大·帕奇之子，1909年加入西点军校毕业，当他还是父亲骑兵的忠实粉丝时，他很快意识到骑兵在战斗中很快就会被淘汰，所以他选择加入步兵。1913年他从西点军校毕业，被分配到驻扎德克萨斯州的第18步兵团，在那里他被晋升为中尉，在那里他被派往潘兴的“惩罚性远征”墨西哥，在美国没有任何重大任务的情况下，帕奇在1919年晋升为上尉，并在本宁堡担任了四年教职。后来又申请加入弗吉尼亚州的斯汤顿军事学院，担任军事科学和战术教授，直到最近他还将担任这一职务。在此期间，他参加了1922年的野战军官课程和美国陆军指挥和参谋学校，并于1925年以优异成绩毕业。1932年他又以中校的身份从美国陆军战争学院毕业。帕奇出色的服役记录给乔治·马歇尔将军留下了深刻的印象，在他毕业后的几年里，马歇尔将军一直与帕奇保持密切的联系。内战爆发后，马歇尔恳请帕奇加入太平洋陆军，帕奇接受了他的请求，并因此晋升为准将。"
 CAL_LEWIS_BRERETON_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1890年6月21日，美利坚合众国宾夕法尼亚州匹兹堡\n§Y军旅生涯：§W1907年，刘易斯·海德·布里尔顿与他的哥哥一起进入了海军学院，开始了他的军事生涯。1911年6月他从学校毕业。然而在毕业前，他以晕船为由递交了辞职信放弃了成为一名海军军官。1911年8月17日，他应征入伍，被任命为海岸炮兵少尉。1912年9月，他在洛克威尔机场接受飞行训练并留在航空团工作，直到他在自己的第二次坠机事故中幸存下来后，他请求上级免除了他的这份工作。1916年7月，他被晋升为中尉并被派往菲律宾，服役一年之后，于1917年3月返回美国，在华盛顿特区的航空部门服役。他担任了一系列行政职务，并成为米切尔的亲密助手，试图使空军独立。随着米切尔的辞职，他的生活开始走下坡路，家庭离异，遭遇车祸，被上级意外发现擅离职守，而他的精神健康也因为这些发展而大大恶化。1927年8月，他重新服役，被分配到俄克拉何马州波斯特菲尔德的第88观察中队指挥，并在锡尔堡野战炮兵学校担任教职。1931年，他被派往巴拿马运河区，1935年，由于表现出色，他被提升为中校，这使他在二十年代末挽回了自己不幸的名声。随着内战的爆发变得越来越不可避免，为了见到他的老朋友阿诺德，他在战争爆发前乘船来到圣迭戈。尽管在步兵实战方面经验不足，但他出色的管理和计划能力使他应阿诺德的要求成为了准将。"
 CAL_ISAAC_WHITE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1901年3月6日，美利坚合众国新罕布什尔州希尔斯堡县\n§Y军旅生涯：§W艾萨克·戴维斯·怀特，1922年从诺维奇大学毕业获得学士学位，1922年参军，1923年2月被任命为少尉。1927年，在经历了骑兵学校的军官课程后，他被提升为中尉。在骑兵学校，他对机械化作战的前景和使用坦克突破敌军防线的前景产生了浓厚的兴趣。1931年，他加入了指挥和参谋学校并于1932年从中毕业。他与乔治·巴顿一起成为陆军中最强烈的坦克使用倡导者。随着美国陷入内战，艾萨克站在马歇尔一边反对麦克阿瑟，从他担任教职的莱利堡向西离开，为了表彰他对马歇尔的忠诚，他被授予准将军衔。\n§Y重要信息：§W-他对坦克和机动车辆的利用比对步兵作战更感兴趣，但他的雄心可能要等到内战结束后才能实现。"
 CAL_ALBERT_WEDEMEYER_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W 7月9日，美利坚合众国内布拉斯加州奥马哈\n§Y军旅生涯：§W1919年，阿尔伯特·科迪·魏德迈从西点军校毕业成为一名少尉。之后，他被派驻本宁堡的第29步兵团，1923年调往菲律宾第57步兵团。紧接着被派往使馆城市的天津第15步兵团任职，在那里他学会了说几乎完美的中文。回到美国后，他接受了指挥与总参谋部学校的课程，他优异的成绩使他有资格在1936年初获得一个与德国战争学院的学术交换名额。然而，他没能得到机会完成他的交换课程。当内战开始，麦克阿瑟接管政府，魏德迈决定回到家乡，加入太平洋部队，他认为这才是真正的美国政府。他刚刚抵达圣迭戈，就应乔治马歇尔的要求晋升为准将，因为他在国外的经验对苦苦挣扎的美国军队来说是无价之宝。"
 CAL_ALEXANDER_VANDEGRIFT_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W 1887年3月13日，美利坚合众国弗吉尼亚州夏洛茨维尔\n§Y军旅生涯：§W亚历山大·阿彻·范德格里夫特在弗吉尼亚大学开始了他的军事生涯。1909年初，他成为少尉在美国海军陆战队服役。他的第一次任务是参与“香蕉战争”，他首先在古巴短暂停留，然后前往尼加拉瓜，在那里他参加了攻占科耶特帕丘的行动。后来又参与了对韦拉克鲁斯的占领，在海地的鲁瓦鲁和卡普奥斯堡与卡科斯土匪作战。1916年，他被提升为上尉，成为海地警察的主要成员之一，1919年，他被提升为海地警察巡查员。1920年因在海地服役而晋升为少校。1923年调往美国海军陆战队，在那里他被派往弗吉尼亚州的匡蒂科。在那里完成野战军官课程后，他又于1926年被调往圣地亚哥，担任助理参谋长。第二年，他被送到天津美国公使馆，在那里他帮助训练了海军陆战队第三团。1928年，他被分配到预算局，与莫斯利一起担任助理总协调员。1935年晋升中校调回中国，任美国驻北京大使馆海军陆战队支队参谋。提升为上校后希望能返回美国本土服役。然而，在他乘坐民用船旅行期间，美国内战开始了，当太平洋共和国宣布起义时，范德格罗夫特别无选择，只能支持太平洋国军队的斗争。然而，由于他的忠诚，他被授予准将军衔，并负责太平洋海军陆战队，这巩固了他对支持太平洋当局的信念。"
 CAL_GEORGE_WINDLE_READ_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1900年7月29日，美利坚合众国亚利桑那州格兰特堡\n§Y军旅生涯：§W小乔治·温德尔·雷德年轻时大部分时间都在军营里度过，他的父亲是美军重要的参谋人员，他追随父亲，1917年志愿参军，虽然他最初报名加入步兵，但在后来从军事学院毕业成为少尉时，他对马球的热爱使他在1920年之前加入了骑兵队，在那里他参加了骑兵学校的基础课程，并于1921年毕业。他在国内外担任过几次职务，大多是跟随父亲的脚步，直到1934年父亲去世。父亲去世后，他被派往西雅图，由于国家形势恶化，他不得不以中央政府的名义在西雅图镇压了几次罢工。当太平洋地区的州长们最终起义时，乔治决定支持他们的起义，因为他在该地区的大多数伙伴都这么做了，他不想冒着犯叛国罪被监禁的风险。为了表示对他的忠诚的嘉奖，他被提拔为准将，现在急切地等待着证明自己能像父亲一样胜任这项任务。"
 CAL_JIMMY_DOOLITTLE_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1896年12月14日，美利坚合众国加利福尼亚州阿拉梅达\n§Y军旅生涯：§W从洛杉矶的手工艺术高中毕业后，詹姆斯·哈罗德·“吉米”·杜立特进入洛杉矶城市学院就读，后来他被加州大学伯克利分校录取，在那里他就读于矿业学院。1917年，他以飞行学员的身份加入信号军团预备役并于1918年被任命为中尉，此后他以飞行教练的身份服现役。他曾就读于航空服务机械学校和航空工程课程，在那之后他最终回到了伯克利并于1922年在那里获得了文学学士学位。20世纪20年代，杜立特成为全国名人和航空先驱，在美国和国外进行了多次巡回演出，参加了几门海军航空课程，甚至在1924年从麻省理工学院获得了航空学硕士学位。杜立德为仪器飞行的发展做出了重要贡献，并于1930年获得少校军衔。之后，他辞去了现役，开始在壳牌石油公司航空部门担任经理。然而，在内战日趋紧张的局势下，杜立特尔再次回到了他的家乡，当弗兰克·梅里亚姆宣布加州将加入太平洋各州的起义时，杜立特尔高兴地自愿加入总参谋部，并被接受为准将。\n§Y重要信息：§W-作为一名出色的飞行员和战略家，他比他的同事学得更快\n他是民主的坚定捍卫者，甚至在军队内部也是如此，这有时会给他上级的指挥带来麻烦。"
 CAL_HERBERT_POWELL_ARMY_DESC:0 "§Y指挥官介绍\n§Y生于：§W1903年7月13日，美利坚合众国俄勒冈州蒙茅斯\n§Y军旅生涯：§W1919年，赫伯特·巴特勒·鲍威尔以士兵的身份加入俄勒冈国民警卫队成为一名中士。1927年，鲍威尔从俄勒冈大学新闻系毕业，而后在1931年于本宁堡美国陆军步兵学校学习连长课程并以少尉的身份毕业。他报名参加了指挥与参谋学院并于1935年从学校毕业。虽然他的军衔并不高，但在内战的酝酿过程中，鲍威尔加入了马歇尔反对麦克阿瑟的抗议活动，当太平洋国家最终起义时，他加入了马歇尔向西逃亡的行列，马歇尔本人也因为他的忠诚而提拔为准将。"
