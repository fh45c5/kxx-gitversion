 CAL_family_law_idea:0 "家庭法"
 CAL_family_law_idea_desc:0 "最近，家庭生活的结构本身受到了挑战。国内的孤儿比以往任何时候都多，离婚也愈发普遍。这样我们的国家怎么得到繁荣呢？我们新的《家庭法》将确保孤儿得到照顾，即使在离婚的情况下也会给予子女援助，我们的老年人也能够更有尊严地结束他们的生命。"
 CAL_family_law_idea_2:0 "家庭法"
 CAL_family_law_idea_2_desc:0 "好莱坞已经同意与我们合作，在我们的社会中推广家庭价值观。新电影将合乎道德，不会打破社会规范。海氏准则将确保我们能够开始修复近年来遭受破坏的国家灵魂。"
 CAL_family_law_idea_3:0 "家庭法"
 CAL_family_law_idea_3_desc:0 "星期日应当是一个与家人共度时光的日子，一个我国工人得以从每周辛苦的劳动中解脱出来的日子。将星期日定为假日将确保我国人民可以在那天去教堂，如果他们愿意的话。有了更多的空闲时间去陪伴家人、参加礼拜，即使是最激进的左翼，其生活幸福感也会大大提升，并因此而制造更少的祸端。"
 CAL_states_autonomy_idea:0 "州权"
 CAL_deregulated_economy:0 "解除经济管制"
 CAL_deregulated_economy_desc:0 "受管制的经济肯定会扼杀我们最多产的就业创造者：企业家的生命。如果他们受到太多限制，其资本就将收到严重压制，而他们对就业市场的影响也将随之消失。重新复苏的经济必须将商业大亨和产业巨头囊括其中，正是他们才使得这个国家如此伟大。"
