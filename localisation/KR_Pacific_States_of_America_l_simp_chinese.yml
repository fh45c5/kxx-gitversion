 pacificstates.4010.t:0 "白宫风云"
 pacificstates.4010.d:0 "原定于1933年3月31日上映的电影《白宫风云》因彼时二次内战前夕的紧张局势一直推迟到了上周末才步入大荧幕，该片由格雷戈里·拉卡瓦执导、凯里·威尔逊和伯特兰·布洛克编剧、威廉·伦道夫·赫斯特出资拍摄（片中也因此存在许多赫斯特指定的内容），讲述了沃尔特·哈德逊饰演的太平洋国打赢内战、统一后的美国总统哈德逊·哈蒙德在从车祸中生还后，受到了大天使加百列的神启和指导，以先代总统亚伯拉罕·林肯为模范，一步步蜕变为专制仁君的故事。\n\n哈德蒙总统大致以赫斯特本人为原型创作，电影围绕其与日渐疏远的情妇彭多拉·“彭蒂”·莫洛伊（卡伦·莫利饰演）及秘书哈特利·“比基”·比克曼（弗朗肖·托恩饰演）三人展开，后两者在故事中学会了爱上自己，而哈蒙德总统则是权力越来越大、态度越来越开明，国家也焕然一新，但与之相对的，其人性却在一点点地消逝，最后，哈蒙德在用林肯用过的羽毛笔签下了自己的最后一份法令——《萨克拉门托协约》后突发心脏病而薨。\n\n电影改编自T·F·特威德于1933年发表的同名小说，并且在改编的过程中相当自由随性，它以最好的笔墨描绘了哈蒙德总统（即赫斯特），其行驶专制权力开展了全国性的社会改革，一举拯救了美国——这也反映出了赫斯特本人在其计划成功后对我们国家的规划。虽然从太过夸张到为威权专制辩护的各式批评之声不绝于耳，但影片还是受到了全国各地的热捧，不管影片的真实意图为何，赫斯特的支持率都因此上升了一大截。可以肯定的是，影片上映后，赫斯特的自信心和钱袋都爆棚了，因为电影票是场场售罄，场场爆满。"
 pacificstates.4010.a:0 "全国人民都对赫斯特版的《公民凯恩》赞不绝口"
 POLITICS_WARREN_MAGNUSON_DESC:0 "§Y领导人介绍\n生于：§!1905年4月12日，美利坚合众国明尼苏达州穆尔黑德\n§Y政治生涯：§!虽然沃伦·格兰特·马格努森的出生日期和出生地都有据可循，但具体的出生信息、生父生母的身份却成了个谜，就连现在这个名字都是一家斯堪的纳维亚二代移民给取的。马格努森在北达科他州上了两年学后，前往加拿大干了一段时间的脱粒工，之后在高中女友的坚持下搬到了华盛顿州的西雅图，并于1929年在这里获得了法学学位，进入了政府中工作。马格努森初涉政坛是1928年，彼时的他支持阿尔·史密斯竞选总统，此后，其一直以民主党人的身份活跃在政界，带头反对禁酒令，并最终于1933年以西雅图代表的身份进入了华盛顿州众议院。1937年1月，马格努森当选国家众议院议员，此时距离那场毁灭性的内战爆发仅仅还有数个月的时间。马格努森反对麦克阿瑟的专断夺权，并在海军反政变势力的帮助下费尽周折逃出了华盛顿特区，而马格努森也投桃报李，自愿入伍，在海军中度过了大半的战争时光。\n\n1944年，马格努森凭借自己的服役经历和进步姿态进入了参议院，并牵头废除了《排华法案》，没过多久便成为了民主党改革派的头牌人物。当马格努森宣布参加1952年总统大选时，民主党上下无一人反对，因为在他们看来，没有什么能比一位终身致力于民主事业的老兵更能体现太平洋国的精神了。下一个十年即将到来，马格努森俨然已是众人眼中美国进步新时代的先驱。"
 pacificstates.8.h:0 "沃伦·马格努森！"
