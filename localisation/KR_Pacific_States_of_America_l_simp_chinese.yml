 CAL_wake_the_west:0 "唤醒西部"
 CAL_wake_the_west_desc:0 "是时候让强大的西海岸从沉睡中醒来了。德威特已经说服我们加大宣传力度，以激励我们的人民。我们将让所有美国人相信，我们才是真正的美国，我们将为民主而战。通过这种方式，我们能够取得胜利。"
 CAL_traditional_staff_colleges:0 "传统军官学院"
 CAL_traditional_staff_colleges_desc:0 "德威特少将在参谋学院的经历使他对学院的传统极为尊重。他建议我们继续推广这些院校，作为培养下一代军官的途径。"
 CAL_counter_espionage:0 "美利坚反间谍行动"
 CAL_counter_espionage_desc:0 "一个可能危及我方政府的因素是间谍的存在。国内外的间谍活动可能会暴露我们赢得战争的计划。我们必须竭尽所能来对抗他们的存在。我们的机密和最宝贵的信息必须得到加密。没有人可以信任。"
 CAL_infantry_arms:0 "大量购买"
 CAL_infantry_arms_desc:0 "胜利的决定因素固然是人，但若没有枪支，军队将毫无战力。我们已与萨克拉门托陆军兵工厂达成协议，他们将确保我军获得所需装备。德威特将军坚信：这批武器将使我们离胜利更近一步。"
 CAL_bombing_support:0 "轰炸支援"
 CAL_bombing_support_desc:0 "在航空领域，美国一直是世界上最重要的国家之一。我们将在战争中延续这一传统。装有炸弹的庞大飞机可以对敌人造成严重破坏，麦克奈尔相信，如果这些轰炸机与我们的步兵配合使用，可以扭转战局。"
 CAL_supreme_commander:0 "集中化指挥体系"
 CAL_supreme_commander_desc:0 "随着马歇尔成为西海岸的最高指挥官，我们的军队将开始转变。我们不再是一支由理想主义者组成，试图维护美国梦的破烂军队。马歇尔将帮助我们把军队转变为一支专业的战斗部队，能够与我们在东方的任何对手抗衡。重视计划，重视人才，我们就一定能打赢这场战争。"
 CAL_morale_emphasis:0 "强调士气"
 CAL_morale_emphasis_desc:0 "马歇尔向我们坦言，他相信我们正在打一场正义的战争。然而，全体人民，更重要的是我们的士兵可能并不相信这一点。我们必须努力让他们明白，我们是合法美国政府，我们在为维护民主而战。"
 CAL_unified_front:0 "统一战线"
 CAL_unified_front_desc:0 "“冰川行动”的目的是在中西部地区夺取一个驻扎基地，以便开展进一步的攻势。驻扎地必须有足够的基础设施支持，以维持一支至少15个师甚至两倍于此数量的部队横跨落基山脉，并能让这支部队得到来自西海岸地区的增援……"
 CAL_nativist_appeals:0 "吸引本土主义者"
 CAL_nativist_appeals_desc:0 "在加州淘金热期间，外国人涌入加州，试图窃取本应属于我们的东西。我们不会忘记这一点，我们的人民也没有忘记。三K党每天都在煽动我们的人民，声称我们的政府会允许这样的事件再次发生。我们必须利用这些本土主义情绪来达到我们自己的目的。"
 CAL_kruger_doctrine:0 "任命克鲁格"
 CAL_kruger_doctrine_desc:0 "沃尔特·克鲁格准将在德国担任观察员期间学到了很多东西。坦克在战争中的重要性则是克鲁格坚持让我们学习的一课。他起草了一份强调机动性的计划，用坦克作为机械化部队的先锋，随着我们的步兵部队冲向密西西比河。"
 CAL_armor_production_lines:0 "装甲生产线"
 CAL_armor_production_lines_desc:0 "克鲁格计划的第一步是改造美国西海岸的工业。他认为，如果我们要取得胜利，就必须强化制造坦克和其他车辆的能力。为此，我们将充分利用现有的工厂并建造新的工厂。"
 CAL_tank_destroyers:0 "反坦克武器"
 CAL_tank_destroyers_desc:0 "我们在东海岸的对手能比我们生产更多的坦克。我们必须投资反坦克武器研究，以消除这种不利因素。通过更先进的反坦克武器，麦克奈尔相信我们将有能力歼灭敌人的一部分重要力量。"
 CAL_tank_contracts:0 "坦克合同"
 CAL_tank_contracts_desc:0 "我们已经与本地区的顶级坦克制造商签订了合同。根据克鲁格的说法，这些轻型坦克正是我们所需要的，通过它们，我们将能够获得主动权，而不是坐等敌人找上门来。"
 CAL_manuever_exercises:0 "机动演习"
 CAL_manuever_exercises_desc:0 "没有乘员的坦克就是一坨废铁。通过按照德国运动战的传统训练我们的坦克组和军队，克鲁格将军相信，我们可以像闪电一样袭击东方，在敌人做出反应之前确保我们的目标。"
 CAL_officer_latitude:0 "军官主动性"
 CAL_officer_latitude_desc:0 "沃尔特·克鲁格拒绝了马歇尔的提议，他认为我们应该赋予军官自主权，而不是将他们拘泥于单一的限制性计划。这将允许我们的坦克快速移动，突袭和包围敌军，并在可能的情况下歼灭他们。今天，我们能看见太平洋，明天，我们就将直抵大西洋！"
 CAL_alamo_scouts:0 "阿拉莫尖兵"
 CAL_alamo_scouts_desc:0 "克鲁格的计划包括了组织数只精锐小队深入敌境，为我军充当斥候。这些小队会为我们收集情报，以便我们出其不意地进攻。克鲁格统称这些小队为“阿拉莫尖兵”，因为他热爱阿拉莫任务和他怀念曾在德克萨斯州度过的时光，他誓死要让德克萨斯回到祖国的手上。"
 CAL_support_training:0 "工程支援"
 CAL_support_training_desc:0 "美国错综复杂的地形可能会给我们的坦克进军制造麻烦。因此我们需要培养更多的工程师，以克服我们在漫长的收复东方的过程中在基础设施或后勤补给方面可能遇到的任何挑战。工程师将会铺就我们的胜利之路！"
 CAL_central_strategy:0 "中部战略"
 CAL_central_strategy_desc:0 "马歇尔和阿诺德向我们提供了他们落基山计划的更多细节。他们提议让军队在整个东部战线上密切协调。有了精简的计划，我们将拥有一支纪律严明的部队，也更不容易受到战争混乱所带来的影响。"
 CAL_modern_training:0 "现代训练"
 CAL_modern_training_desc:0 "我们将不再难以触及我方的敌人。有了围绕速度制定的装甲侦察新战术，我们将在短时间内跨越遥远的距离。我们的东部敌人将始终无法判明袭击他们的部队……"
 CAL_mcnair_report:0 "麦克奈尔的报告"
 CAL_mcnair_report_desc:0 "莱斯利·詹姆斯·麦克奈尔准将向我们提交了一份详细的战略报告。他认为，我们必须利用大规模的炮击和空中支援来帮助我们的步兵战胜更多的敌人。为了做到这一点，他建议我们唤醒西海岸的工业潜力，这样我们就可以在敌人反应过来前就将他们消灭。"
 CAL_towed_artillery_yesterday:0 "昨日旧炮"
 CAL_towed_artillery_yesterday_desc:0 "如果我们要按照计划的要求应对战场的变化，火炮部件就需要更加耐用和轻便。麦克奈尔在20世纪20年代与审查委员会合作中所学的专业知识似乎没有白费，他提议对美国火炮生产进行全面改革，预计这将使得火炮的生产和维修更为便捷，在战场上也会更加精确。"
 CAL_weapons_development:0 "发展武器"
 CAL_weapons_development_desc:0 "太长时间以来，我们的军队一直在使用过时的装备。而我们现在有能力投资于新的武器和装备——特别是在火炮领域，以便向东部的极端分子倾泻火力。每一颗子弹或炮弹都很重要，而我们的子弹和炮弹很快就会带来更多的价值。"
 CAL_field_artillery_school:0 "野战炮兵学校"
 CAL_field_artillery_school_desc:0 "当其他将军提议继续利用军官学校来培养下一代军官时，莱斯利·麦克奈尔却希望我们把重点放在别处。他认为，对野战炮兵学校的大量投资将为我们的炮兵和军队提供必要的训练，以便在内战和以后的战争中取胜。"
 CAL_quasi_arms_factories:0 "准军工厂"
 CAL_quasi_arms_factories_desc:0 "麦克奈尔计划的一个关键部分是研发专门的防空和反坦克火炮。这些将使我们能够更好地与现代战争机器相抗衡。为了实现这一目标，我们将建造专门生产此类武器的军用工厂。"
 CAL_combined_arms_units:0 "联合作战单位"
 CAL_combined_arms_units_desc:0 "麦克奈尔将军敦促我们在军队中实行联合作战战略。这将使我们的步兵、装甲部队、炮兵和空军在一支统一的部队中最大限度地发挥各自的优势。在各类作战武器的支援下，敌军防线就如黄油一般，而我们的步兵就是切开它的利刃。"
 CAL_organizing_victory:0 "靠组织得胜"
 CAL_organizing_victory_desc:0 "我们社会的一切力量都应该团结起来支持战争的进行。在马歇尔的密切监督下，我们的工厂将生产比以往任何时候都多的装备，我们将向世界展示西部海岸的力量！"
 CAL_aggressive_conscription:0 "积极征兵"
 CAL_aggressive_conscription_desc:0 "西海岸并非没有缺点。我们的人力不及东方各政权的军队。然而，德威特认为，如果我们在招募和征兵方面更为积极，就可以抵消这一劣势。"
 CAL_naval_industry_desc:0 "虽然远不及东海岸那般具有历史意义，但我们仍然掌控着强大的商业航运遗产。我们应该确保这一产业支持战争的进行。"
 CAL_authoritarian_democrats_in_power:0 "国家民主党当选"
 CAL_authoritarian_democrats_in_power_desc:0 "威廉·伦道夫·赫斯特的国家民主党和联邦派凭借稳定太平洋国、为其公民带来财富，以及尽快结束与联邦战争的承诺取得了胜利。这是太平洋国新的一天！"
 CAL_raise_tariffs:0 "提高关税"
 CAL_raise_tariffs_desc:0 "如果我们要保持自力更生，就必须不惜一切代价保护我们不受外国竞争的影响。在这一进程中，除了一部分农产品外，几乎所有商品都需要征收高关税，由此产生的收入将用于国家项目和现有服务。"
 CAL_slash_taxes:0 "奖励成功者"
 CAL_slash_taxes_desc:0 "工团主义者们常喊道：“为什么富人越来越富，穷人越来越穷？”他们认为资本主义是罪魁祸首的观点是正确的，但也是错误的，这是因为资本缺乏进行财富扩张的动机和机会。针对富人的税收将大幅削减，尤其是遗产税，我们最近的关税收入将弥补这一成本。"
 CAL_american_festivals:0 "美利坚节庆"
 CAL_american_festivals_desc:0 "人民可能拥有自己的经济财产，但是曾经给民众带来无穷快乐的马戏，节日和民族盛事又是什么呢？资助举办这样的节日不仅会提高我们政府的声望，也能培养民众的爱国精神和团结度。"
 CAL_state_trusts:0 "企业市有化"
 CAL_state_trusts_desc:0 "电力、水、煤气和电话等公用设施不能在没有监督的情况下委托给少数私营公司。政府将购买这些公司的一部分股份，并进行部分国有化，地方市政当局要么从获得批准的公司购买服务合同，要么在获得联邦政府的直接批准下进行运营。"
 CAL_roaring_parties:0 "咆哮的派对"
 CAL_roaring_parties_desc:0 "从喧嚣的10年代到20年代早期，赫斯特最喜欢的活动之一就是奢华的派对，它不仅增强了人们对经济的信心，还有助于政府在他们和上层阶级之间建立联系，并将他们巩固成一股更有凝聚力、更容易安抚的力量。让我们举起酒杯，低迷的时期已经结束了！"
 CAL_state_unions:0 "国家工会"
 CAL_state_unions_desc:0 "工团主义无疑对国家构成了威胁，但这并不意味着美国工人不能拥有适当的组织和代表。国家应该成立爱国工会，为工人进行注册并保证其最低生活标准，而激进工会将被查封，美国工人们将得到适当的代表。"
 CAL_media_regulation_act:0 "媒体管理法案"
 CAL_media_regulation_act_desc:0 "我们最危险的敌人已被镇压，终于可以着手解决那些企图毁灭国家的冗长报纸和记者们了！《媒体监管法案》将允许我们新成立的联邦警察广播部门收集一份激进分子的名单，并在另一场针对政府的政变企图形成前立即禁止他们的出版物。"
 CAL_investigate_gop:0 "调查共和党"
 CAL_investigate_gop_desc:0 "毫无疑问，共和党及其在进步党和民主共和党中的前任朋友构成了自联邦崩溃以来对赫斯特最危险的批评者。他们无可否认地把国际银行家和外国政府的利益置于我们自己的利益之前，我们应对其组织潜在的贿赂和腐败进行调查。"
 CAL_yellow_peril:0 "黄祸"
 CAL_yellow_peril_desc:0 "赫斯特一直在直言不讳地表达他对“黄种人”试图超越“白种人”的担忧——以前是通过移民，但现在随着美国的削弱，则是通过帝国主义达成。太平洋属于美国，而不是裕仁天皇或中国的。我们的出版物和政府将提醒公众注意这一威胁，坦尼委员会将调查可能与东亚人勾结的情况。"
 CAL_national_industrial_administration:0 "国家工业局"
 CAL_national_industrial_administration_desc:0 "经济仍在努力从工团主义者罢工、股市崩盘、巨大恐慌、黑色星期一和现在的战争破坏的综合冲击中恢复过来。由休·S·约翰逊领导的国家工业局将与产业领袖合作，终结危险条例、哄抬物价和难以维持生计的工资，鼓励阶级协作。"
 CAL_punish_hawaii:0 "惩戒夏威夷"
 CAL_punish_hawaii_desc:0 "夏威夷人真的以为他们背叛美国了还能全身而退吗？他们将会用自己的亲身经历告诫世人，而我们则会好好利用其蔗糖产业的。弃离美国的叛徒无权和我们谈条件，而他们有且只有这唯一的一次机会全盘接受。"
 CAL_renovate_california:0 "加州梦"
 CAL_renovate_california_desc:0 "不能因为道路上的一些颠簸，就让加州陷入困境！我们将通过清除森林和沼泽等自然障碍，来扩大加州的潜力，以获得更大的商业潜力。赫斯特城堡也将迎来我们文化的黄金时代。"
 CAL_mine_mine_mine:0 "开采作业"
 CAL_mine_mine_mine_desc:0 "国家需要搞钱，而还有什么比太平洋国的资源更能让人大赚一笔呢？国家经营下的矿业将交由国家工业局的新矿业和资源部门经营，该部门将专注于在北太平洋各州购买资源，并将其出售给出价最高的人。双赢。"
 CAL_federal_police:0 "联邦警察"
 CAL_federal_police_desc:0 "在这犯罪和叛乱泛滥的国家，很明显，旧的执法方法已经老掉牙了，而且也太迟缓，无法发挥作用。联邦警察应由美国军官和国民警卫队的精英组成，并由民主党武装人员监督，其级别高于地方执法人员，直接对赫斯特集团负责。"
 CAL_tenney_committee:0 "坦尼委员会"
 CAL_tenney_committee_desc:0 "国会议员杰克·坦尼是政坛中最坚定的反工团主义和反激进主义的新民主党支持者之一，因此我们应该接受他的要求，让他负责一个被授权的特别委员会，专门调查和根除激进主义——就从辛克莱的联邦党开始。"
 CAL_demand_respect_from_canada:0 "要求加拿大上贡"
 CAL_demand_respect_from_canada_desc:0 "我们受够了加拿大的愚蠢行为！他们夺取了美国的土地，还在用贪婪的目光扫视着我国，企图迫使我们加入他们在欧洲的战争，以我们的损失为代价，让他们受益，而我们却一无所得。他们应该为我们的国库做出应有的贡献，以作为我们从工团主义者手中拯救太平洋国并保卫我方边境的回报。"
 CAL_nationalize_liquor:0 "酒业国有化"
 CAL_nationalize_liquor_desc:0 "虽然“禁酒”的支持者们说的没错，酒精往往会让人堕入阴暗，导致社会的动荡，但很明显，在地方和州一级通过禁酒令只会增加当地的犯罪率。由于国家需要额外的资金，现在是时候实施赫斯特的常识性解决方案：将酒业国有化。"
 CAL_mexican_border_raids:0 "突袭墨西哥边境"
 CAL_mexican_border_raids_desc:0 "组成墨西哥政府的那群土匪们认为他们可以通过越过我方边境的突袭和走私而逃脱惩罚，嘲笑我们所谓的无力反击。是时候还击了，我们要为我们被夺去的赃物得到补偿。"
 CAL_tribunals_for_gangsters:0 "为歹徒准备的法庭"
 CAL_tribunals_for_gangsters_desc:0 "随着联邦警察的部署，我们必须为他们制定一套不受其他政府部门干涉且更为明确的执法守则。军事法庭将对被抓获的有组织犯罪成员进行审判，如果被判有罪，他们将被即决处决。"
 CAL_executive_construction:0 "执行建设计划"
 CAL_executive_construction_desc:0 "美国一直以其巨大的摩天大楼和不断扩张的城市而闻名。我们是一个拥有巨大财富和资源的国家，我们也将利用这些资源来建造世界上有史以来最大、最奢侈的建筑。倡导未来主义美学的建筑师们吸引了赫斯特的注意，他计划遵循这一风格来建造这些建筑。代价可能会很大，但赫斯特的野心不止于此。"
 CAL_national_democrats_win_twice:0 "国家民主党连任"
 CAL_national_democrats_win_twice_desc:0 "正如预料的那样，自从政变未遂后，威廉·伦道夫·赫斯特在没有任何重大反对的情况下再次当选。尽管一些人声称，他对媒体和政治进程的控制让他赢得超过80%的普选票十分可疑，但大多数人都小心翼翼，不敢大声地表达他们的不满。"
 CAL_naval_project:0 "航空合同"
 CAL_naval_project_desc:0 "如果我们要促进经济增长，并拥有一支强大的国家军队，就必须向新兴且前景广阔的行业进行扩张。控制天空便是美国的未来之路，对新型军用战斗机的大规模招标将确保太平洋国航空业的持续进步与发展。"
 CAL_expand_war_powers:0 "扩大战时权力"
 CAL_expand_war_powers_desc:0 "如果总统没有能力保护自己的人民，他怎么能保卫国家？总统将被赋予在地方和州一级制定戒严法的直接权力，军队将向他和联邦警察让渡更多的战时权力。"
 CAL_price_setting:0 "冻结物价"
 CAL_price_setting_desc:0 "我们的一些人仍然希望能以较低的价格购买所需的商品，如油和水，而那些可以留在国内的出口商品价格都似乎偏低。一系列的物价冻结法案将纠正这种情况。"
 CAL_claim_sonora:0 "索诺拉应入我手"
 CAL_claim_sonora_desc:0 "看来我们还没有完全摆平墨西哥问题。巴哈和索诺拉在美墨战争后本应属于我们，只是由于国会方面的软弱而没有拿下，但现在我们有了一位强有力的总统，美国人民将享有这些土地。"
 CAL_safety_reforms:0 "安全改革"
 CAL_safety_reforms_desc:0 "德威特将军提出了一份改革清单，以阻止内部颠覆，其中包括设立旅行办事处，批准旅行州，禁止夜间户外运动，更严厉的狩猎法和更严格的武器拥有限额。"
 CAL_break_the_fifth_column:0 "打倒叛徒"
 CAL_break_the_fifth_column_desc:0 "我们最终需要消灭隐藏在我国公民中的外国叛徒。现在是时候让来自亚洲和加拿大的新移民返回他们的家园了，他们需要受到监督——直到他们回国前。"
 CAL_president_hearst:0 "赫斯特总统"
 CAL_president_hearst_desc:0 "赫斯特已经做到了。美利坚终于重归一统，如果他计划“独裁”，那么这就是基于杰斐逊民主定义的独裁，一个为多数人谋取最大利益的独裁政府！"
 CAL_bonus_bill:0 "奖金法案"
 CAL_bonus_bill_desc:0 "一个稳定的政权会承认并奖励其退伍士兵。奖金法案将一石二鸟，为经济注入资金，并通过向每一位为我方战斗过的退伍军人发放支票来获得更多老兵的支持。"
 CAL_dewitt_raids:0 "德威特突袭"
 CAL_dewitt_raids_desc:0 "东部仍然充斥着国家的工团主义敌人，他们会摧毁我们所知道的美国。只有向德威特将军提供消灭他们所需的资源，我们才能高枕无忧。"
 CAL_eastern_patronage:0 "报答东部"
 CAL_eastern_patronage_desc:0 "我们的敌人终于被粉碎，是时候奖励我们的盟友了。我们政府的盟友将获得曾经属于敌人或死者的受控产业和土地。"
 CAL_southern_old_money:0 "南方遗产"
 CAL_southern_old_money_desc:0 "许多南方“贵族”可能支持旧民主党，但他们并不喜欢阿姆斯特朗和斯蒂芬森兜售的那些胡言乱语，我们将通过向那些现在站在我们一方的人授予土地来使其成为更可靠的盟友。"
 CAL_oaths_of_loyalty:0 "宣誓忠诚"
 CAL_oaths_of_loyalty_desc:0 "在南方、中西部和东部被控制的情况下，我们必须确保新的国会议员和其军队的元老站在我们这边，宣誓对政府的忠诚，并对违反者进行严厉处罚。"
 CAL_reconcilation:0 "和解"
 CAL_reconcilation_desc:0 "最终我们可以促成与南方的和解运动，给予他们更多的自治权，以换取他们的重新融入并接受我们的政府。"
 CAL_absorb_democrats:0 "吸纳残余民主党人"
 CAL_absorb_democrats_desc:0 "在美国的其他地区，甚至在加州，民主党仍然是一个小势力，但未来属于国家民主党人。我们将向杰出的民主党人施加压力，要求他们改变所属党派，并让他们的选区倒向我方。随后，民主党将作为一个整体被我们吸收，共同迈向繁荣！"
 CAL_white_house_socials:0 "白宫联欢"
 CAL_white_house_socials_desc:0 "美国再次成为了一个整体，当工业、政治和媒体的精英们希望感谢赫斯特所做的一切时，他们应该通过我们的“白宫联欢”来实现这一切，这将创造一批更加团结的国家精英。"
 CAL_media_empire:0 "媒体帝国"
 CAL_media_empire_desc:0 "遗憾的是，东部和中西部仍然充斥着工团主义者、朗派和所谓的“自由主义”宣传，他们中很少有人关注过赫斯特。这些旧媒体将被赫斯特帝国吸收，扩大我们的就业率，确保我国的稳定，并有助于动摇公众舆论，使其接受我们而不是激进分子。"
 CAL_states_autonomy:0 "加强州权"
 CAL_states_autonomy_desc:0 "不能指望联邦政府管理一切事务。事实上，缺乏权力的各州无法支持一个无能的中央政府是美国崩溃的核心原因。救济项目、税收和其他行政职责将进一步下放给各州。"
 CAL_patriotic_shorts:0 "爱国主义短片"
 CAL_patriotic_shorts_desc:0 "在这个艰难的时代，人们明显缺乏娱乐与爱国主义，我们应该利用最近电影的风靡来促进爱国主义。我们将聘请动画师，比如迪士尼公司，特别针对美国家庭制作爱国主义短片，让他们明白我们为之奋斗的是什么。"
 CAL_family_law:0 "家庭法"
 CAL_family_law_desc:0 "强大的社会需要强大的家庭，但遗憾的是，太多不负责任的公民忽视了这一点。《家庭法》要求各州强制执行子女抚养，即使在离婚的情况下，也将要求有收入的父亲为家庭做出贡献，法案同样要求富裕的子女需在年老的父母陷入贫困时为他们提供赡养。"
 CAL_expand_national_guard:0 "扩编国民警卫队"
 CAL_expand_national_guard_desc:0 "如果我们要在目前的情势下保证生存，强大的军事力量比以往任何时候都更为重要。我们应该依靠更有经验、更成熟的国民警卫队来保卫我们，把我们最近获得的商业利润拨给他们，并允许他们提出新一轮的草案。"
 CAL_entente_support:0 "协约国支援"
 CAL_entente_support_desc:0 "现在既忠于传统又忠于民主的国家已经很少了，但反工团主义的协约国就是其中之一。民主党商界、自由派和天主教派都希望与他们建立更紧密的联系，因为他们的“斗争”和我们的“斗争”是一样的。在这艰难的时刻，我们必须请求支援。"
 CAL_self_regulation:0 "自我管控"
 CAL_self_regulation_desc:0 "新的贸易团队们正试图通过维护诸如行业自律等社会价值观，以此来赢得我们的青睐。所谓的行业自律，就是各行业自行确保工人的最低生活质量和爱国主义思想，这种自律起始于教育行业，各大学自觉地贬斥封杀激进思想。有来有往，我们自然得扶持任何遵循这种价值观的行业，并为它们提供小规模的税收减免。"
 CAL_stop_desecration:0 "保护美国符号"
 CAL_stop_desecration_desc:0 "激进派会摧毁美国精神的每一个象征，因为他们狂热地相信阶级冲突。这种情况必须得到解决！政府应通过与产业贸易组织的接触，让他们更多地使用爱国符号，并在政府资产上使用更多的美国符号，出台禁止亵渎国旗的法律，违反者将被处以小额罚款。"
 CAL_welfare_reform:0 "缩减福利条件"
 CAL_welfare_reform_desc:0 "自20世纪后期以来，地方和国家的福利投入一直在扩大，但到目前为止，它们所造成的资源短缺是出了名的。我们应该与地方政府和企业协调，使当地福利——如食品和现金救济更多地提供给那些丧偶母亲，并收紧当地工人的补偿，以关注真正的残障人士。"
 CAL_levering_act:0 "利弗林法案"
 CAL_increase_defense_spending_desc:0 "最近可能发生的内战表明，如果有一天发生类似的事件，我们必须支持军队。我们还必须保护虚弱的国家不受投机取巧的宵小之辈干扰。在追求这些目标的过程中，我们会投资于雷达技术，并更新我们军队的火炮装备。"
 CAL_protect_industry:0 "保护工业"
 CAL_protect_industry_desc:0 "尽管不反对所有贸易，但长期以来，共和党的立场一直是保护我们已经加入国内竞争的新兴产业，免受外国竞争的影响、以便我们可以更快的发展。"
 CAL_incentivize_charity:0 "激励慈善"
 CAL_incentivize_charity_desc:0 "目前有很大一部分人需要我们的援助，但与往常一样，政府的直接干预与私人相比效率低下。因此，我们的公共服务活动将敦促富人捐款，并为那些捐款的人提供税收减免，并通过表彰他们的事迹来奖励那些捐款最多的人。"
 CAL_local_budgeting:0 "地方预算编制"
 CAL_local_budgeting_desc:0 "经济去中心化是我们支持观点的主要组成部分，因此地方应该与国家预算相一致，地方政府在制定预算方面将有更大的灵活性，并被我们的领导人所认可，以尽可能地节省资金。"
 CAL_naval_expansion:0 "海军扩建"
 CAL_naval_expansion_desc:0 "共和党的孤立主义信仰挽救了无数美国人的生命，帮助我们避免陷入欧陆世界大战的泥潭中。我们将继续在海军建设方面实行防御政策，将帝国主义势力排除在美国事务之外，反之亦然。"
 CAL_slash_spending:0 "经济法案"
 CAL_slash_spending_desc:0 "现在不是把钱花在政府高额工资上的时候。《经济法案》将削减政府近5亿美元的工资，从而使我们更接近预算平衡，同时也使投资者更有信心。"
 CAL_give_me_your_poor:0 "给我你的劳瘁贫贱"
 CAL_give_me_your_poor_desc:0 "美国的建国传统之一就是接纳世界上的穷人，并让他们在我们国家摆脱贫困。我们必须继续践行这个传统。让我们鼓励世界各地贫穷但勤奋的家庭移民到美国，使他们在自由和民主下发家致富。"
 CAL_infastructure_investment:0 "基建投资"
 CAL_infastructure_investment_desc:0 "政府能为经济提供的少数几个可靠的积极因素之一是基础设施，这将有助于促进全国各地的商业活动。让我们以亚伯拉罕·林肯的方式继续实行这些国家计划。"
 CAL_good_neighbor_policy:0 "睦邻政策"
 CAL_good_neighbor_policy_desc:0 "几十年来，美国一直在使用武力维持拉丁美洲的秩序。然而鉴于我们最近可能发生的内战，我们比以往任何时候都更难做到这一点。相反，我们应该努力加强与南方邻国的合作和贸易，以实现各方的互利共赢。"
 CAL_reduce_subsidies:0 "削减补贴"
 CAL_reduce_subsidies_desc:0 "补贴就是政府越权的一个例子：很难知道多少补贴才算足够，或者补贴是否对任何一方都有利。通常情况下，这只是浪费钱财。我们应该尽量减少政府补贴，让市场这只看不见的手来引导我们的企业。"
 CAL_education_campaign:0 "教育运动"
 CAL_education_campaign_desc:0 "农场的孩子们经常无法上学，理由是农场需要他们当帮手。这将不再是什么理由，我们对农村学校和其他乡村教育设施进行投资，让我们国家的每个孩子都能得到他们应得的教育。"
 CAL_tolerance_campaign:0 "宽容运动"
 CAL_tolerance_campaign_desc:0 "一个人在属于他们的时间里喝酒消费不关政府的事。只要不影响他们的工作生活，我们应该鼓励对这种做法的宽容。我们能从此类产品中获取大量利润，不能为了一些更有道德感的支持者而将它们抛弃。"
 CAL_mathematical_tables_project:0 "数学用表计划"
 CAL_mathematical_tables_project_desc:0 "有一种误解，认为美国的失业者没有接受过教育且懒惰。我们将证明这不是真的。为了做到这一点，我们找到了这个国家一些最具才华、最聪明但运气不好的人。这些人会制作高级数学方程式的表格，例如指数函数表格，对数表格，还有三角函数表格。"
 CAL_fair_labor_standards:0 "公平劳动标准法案"
 CAL_fair_labor_standards_desc:0 "公平劳动标准法案将在保护美国工人方面发挥极大作用。我们计划制定最低工资，要求支付加班费，并实施更严格的青年就业标准。这些措施在遏制企业对员工的虐待同时，也将促进经济发展。"
 CAL_federal_one:0 "联邦第一计划"
 CAL_federal_one_desc:0 "产业工人并不是唯一需要吃饭的人。政府将雇用成千上万的艺术家、音乐家、演员、作家和其他文化产业人物。在这个艰难时期，任何人都不应受到歧视并被拒绝就业，这些人所做的工作和其他人的工作一样重要。让我们赋予我们的人民尊严。"
 CAL_agricultural_adjustment:0 "农业调整法案"
 CAL_agricultural_adjustment_desc:0 "在这场危机中，有很多方法可以帮助我们的农民。有一种观点认为，我们应该通过农业调整法案，这将提高农民的农产品价格，同时减少过剩农产品。政府将利用这一点来确保他们的农民能够在这些绝望的时期保持生存。"
 CAL_banking_act:0 "银行法案"
 CAL_banking_act_desc:0 "该法案将要求成员银行的存款有一定数额的准备金和利率，并赋予联邦储备委员会对一些货币政策工具的控制权。该委员会还将有权决定每个联邦储备区的贴现率。"
 CAL_freed_currency:0 "黄金储备法案"
 CAL_freed_currency_desc:0 "该法案将要求美联储持有的所有黄金移交给美国财政部。这将允许我们为了国家的利益使用货币黄金，并保护我们的货币体系不受外国惯例的影响。"
 CAL_workers_compensation:0 "工人补贴"
 CAL_workers_compensation_desc:0 "必须保护工人不受剥削。新一轮立法将规定那些在工作场所受伤的人，可以得到工资上的补偿。我们的残障同胞也应该得到尊严。"
 CAL_removing_money_from_politics:0 "打击权钱交易"
 CAL_removing_money_from_politics_desc:0 "金钱是一种癌症，几十年来一直“感染”着我们的政治体系。很长时间以来，政客们一直听命于他们在石油和钢铁行业的赞助者，同时忽视了他们的忠实支持者。这种情况将不再存在，禁止一切形式的权钱交易的立法将会通过，而允许用于赞助的合法资金限额仍在争论中。"
 CAL_national_electricity:0 "国家电网"
 CAL_national_electricity_desc:0 "美国人民需要负担得起的电力，并且现在就需要。政府将通过收购和购买美国电力公司的多数股份直接控制水力发电，为公众利益提供廉价电力，为美国的铁路、街道和家庭供电。"
 CAL_power_of_the_ballot:0 "选票的力量"
 CAL_power_of_the_ballot_desc:0 "我们不能再将美国人民排除在会影响所有国民的政府决策之外了。我们应该扩大国家倡议和全民公投的范围，将其作为解决公众问题的手段，而不是仅仅依赖官僚，和被视为道德权利的罢免公职人员这一制衡权力。"
 CAL_wealth_taxation:0 "富人税"
 CAL_wealth_taxation_desc:0 "我们不能允许美国成为一个新的贵族国家，以财富多少取代君主制神权。我们新出台的遗产税和土地税将确保富人履行他们的爱国义务，支付适当数额的税收，为美国人民，特别是农民和工人提供商品。"
 CAL_new_public_works:0 "公共工程"
 CAL_new_public_works_desc:0 "我们需要以一方面的代价来解决两方面的问题，同时应对造成国家安全风险的失业和欠发达问题。公共工程管理局将雇用大量人员来建造大型公共工程，如水坝、桥梁和公路。这可能会很昂贵，但它给美国带来的希望是无价的。"
 CAL_encourage_temperance:0 "提倡节制"
 CAL_encourage_temperance_desc:0 "过度饮酒无异于打开通往贫穷、疯狂和懒惰的大门，这仍然是我们这个时代最大的社会弊病之一。虽然反酒馆同盟没能在全国范围内禁止饮酒，但我们可以扩大对禁酒地区执法力量的资助，建立禁酒喷泉，并通过一场禁酒运动来让公众意识到饮酒的危害。"
 CAL_citizen_education:0 "公民教育"
 CAL_citizen_education_desc:0 "在全国各地，美国本土居民都没有亲自接受到适当的教育。我们的教育体系应该实施约翰·杜威提倡的一些改革，同时推行促进美国价值观和国家忠诚的民族主义计划。"
 CAL_national_railroads:0 "国家铁路"
 CAL_national_railroads_desc:0 "可悲的是，我们的国家缺乏为国家生产提供公共工具的能力，而铁路兄弟会则希望得到他们老板更多保护。解决这一问题的办法自然是铁路国有化，通过格伦·E·普拉姆的天才计划，用债券筹集的资金来购买铁路。"
 CAL_credit_unions:0 "支持信用合作社"
 CAL_credit_unions_desc:0 "是时候摆脱银行对工人、农民和自由劳动者生活的影响了。信用合作社将获得廉价的联邦贷款和税收减免，这样独立承包商就可以更加自力更生，而银行家也可以承担相应的责任。"
 CAL_national_health_insurance:0 "国家医疗保险"
 CAL_national_health_insurance_desc:0 "当我们的公民患病时，甚至要为自己的生存权付钱。这是不道德的，但更糟糕的是，这驱使人们投入了伪善的马克思主义者的怀抱。国家医疗保险方案将通过增加个人所得税提供全民保健，以使所有人都能享有其自然的生存权利。"
 CAL_fair_house_trade:0 "公平贸易"
 CAL_fair_house_trade_desc:0 "贸易自有其重要性，特别是对我们的农民来说，他们必须出口他们的农产品，但我们不能指望我们的工人能与地球上的每一个国家的同行竞争。无限制的贸易也破坏了我们拒绝那些来自工作条件更糟糕的国家的更廉价商品的权利。那些可能降低我们工人工资的外国商品将为此支付更高的关税。"
 CAL_protect_strikers:0 "保护罢工者"
 CAL_protect_strikers_desc:0 "罢工者不过是面对恶劣的工作环境，维护自身权利的工人，然而州长、资本家和法官却认为，他们有权利镇压这些爱国的美国人，这会让那些马克思主义者的胡言乱语看起来是正确的。罢工现在将被视为一项国民权利，军队将保护那些受到企业家雇佣的暴徒攻击的罢工者。"
 CAL_quota_act:0 "移民配额法案"
 CAL_quota_act_desc:0 "在美国文化和工人薪资已经承受了巨大压力的情况下，我们最不需要的就是大量未经培训的廉价劳动力涌入边境。配额制度将限制每年进入美国的低工资移民数量。"
 CAL_food_stamps:0 "食品券"
 CAL_food_stamps_desc:0 "当亨利·华莱士看到一边是难以出售的富余农产品而另一边是饥饿的市民时，他得到了启示。如果市场不能自行实现均衡，我们将通过食品券计划给予它所需的助力，使贫困公民更容易负担得起农产品价格。"
 CAL_farm_credit_act:0 "农场破产法案"
 CAL_farm_credit_act_desc:0 "让农场关闭的疯狂行为，尤其是在经济大萧条的时期，是完全不能容忍的！我们将建立农业合作信贷体系，为农民提供低息贷款，防止国家供应商丧失抵押品赎回权，这也是为了他们和我们自身的福利。"
 CAL_support_long:0 "拯救王鱼"
 CAL_support_long_desc:0 "休伊·朗是个毫无问题的人吗？当然不是；他管理着一个政治机器，头脑里装的东西像拉什莫尔山一样“大”。然而他是该地区进步派的盟友，支持他的各州也是反对威权主义的坚定力量，而他的经济政策有望帮助我们打败激进主义。我们将为他做出他为美国所做的一切，将他从包围他的笨蛋和懦夫手中拯救出来吧。"
 CAL_commonwealth_victory:0 "联邦党胜利"
 CAL_commonwealth_victory_desc:0 "辛克莱弥补了对于他在1934年史诗计划的损失，并成功的与联合工团划清了界限，现在他作为平等主义与自由主义的发起者来确保马克思主义的任何变种都不能渗入我们国民纯洁的心灵中。"
 CAL_radical_taxation:0 "激进税收"
 CAL_radical_taxation_desc:0 "无论是自由党还是进步党的税收计划都不能实现真正的平等主义。我们要将营业税改为股票税，对富人征收收入税、土地税、遗产税、公司税、储蓄税和财产税，而对贫困者不征税，这样就能实现社会公正了。"
 CAL_commodity_credit_corporation: "农产品信贷公司"
 CAL_commodity_credit_corporation_desc:0 "当大萧条吞噬我们的国家时，农民受到的打击几乎比任何人都严重。农民们向我们呼救，而我们必须回复他们。为此我们要创立农产品信贷公司，该机构可以保护农产品的市场与价格，这可以让他们的情绪稳定下来。而我们也不能再忽视这一群体了。"
 CAL_fcwa:0 "联邦土木工程管理局"
 CAL_fcwa_desc:0 "如今美国的街头巷尾仍有数以百计的失业工人正在流浪，为了解决这个问题我们可以向他们提出一个简单的建议：你来为国家建设基础设施，我来为你们发放体面工资。这不仅能大大降低我国的失业率，还能促进国家的经济繁荣。新成立的联邦土木工程管理局将担负起组织工人的任务。"
 CAL_federal_authority_for_land: "联邦土地管理局"
 CAL_federal_authority_for_land_desc: "根据相关法案，我们将成立一个负责管理土地的部门。我们将保留相当数量的土地归于己用，并利用这些土地服务我们的人民和环境。"
 CAL_labor_colonies:0 "劳动聚居地"
 CAL_labor_colonies_desc:0 "从罗伯特·欧文到夏尔·傅立叶，建立乌托邦社会和领地的尝试在美国并不新鲜。现在，我们要推动建立“劳工聚居地”，让所有劳动者都能在其中平等劳动，健康幸福地生活。一些积极人士甚至建议我们实施爱德华·贝拉米在《回顾》中提到的一些非威权主义做法。"
 CAL_nationalize_oil:0 "石油国有化"
 CAL_nationalize_oil_desc:0 "像约翰·D·洛克菲勒这样的石油大亨几十年来一直在霸占着这个国家。在他享受着自己首富身份的同时，数百万美国人在忍饥挨饿。这种情况将永不再现。我们将推动石油国有化，这样资本主义豺狼和外国投机者就无法窃取我们人民的财产了。"
 CAL_nationalize_communication:0 "通讯国有化"
 CAL_nationalize_communication_desc:0 "在石油之外，我们还需要扩大国有化的范围。长久以来，电话、无线电、电报行业都由私人掌握。但这些东西应该归全体美国人民所有，而不仅仅是富人，我们将努力去实现这一愿景。"
 CAL_pensions:0 "政府养老金"
 CAL_pensions_desc:0 "我们要让我们尊敬的老人有尊严地退休，也让父母不再是孩子的负担。我们将建立一种制度，工人可以将钱存入基金，并在退休后提取。我们的长者将体面地度过他们的余生，并不再为他们的年龄感到羞耻。"
 CAL_the_jungle:0 "屠场"
 CAL_the_jungle_desc:0 "工人们在城市中忍受着不可忍受的生活条件，我们的公共工程项目将对基础设施和工厂进行翻修，以符合工人的利益，而不是去向资本阶级献媚。"
 CAL_aim_for_the_heart:0 "直达心扉"
 CAL_aim_for_the_heart_desc:0 "尽管公众对辛克莱的书《屠场》没有想象中的反响，但他的政党现在可以进一步维护工人的权利，而这正是他在书中所追求的。所有看到工人饱受虐待的美国人都会痛心疾呼，要求改善他们的工作条件。"
 CAL_hit_the_stomach:0 "一步到胃"
 CAL_hit_the_stomach_desc:0 "虽然辛克莱对广大读者对《屠场》的反应有些不满，但他也意识到读者观点是挺有道理的。我们必须确保家庭赖以生存的食物不被贪婪的企业或任何有害物质污染与毒害。我们将通过立法，确保所有美国人都能获得干净、新鲜的食品。"
 CAL_bread_and_peace:0 "面包与和平"
 CAL_bread_and_peace_desc:0 "尽管辛克莱和他的政党已经与联合工团划清了界限，但还是有可能与他们达成协议的。毕竟，我们有许多共同的目标，虽然以后还有翻脸的可能，但是我们应该集中精力消灭那些反动派。这也将是一个受左翼人士欢迎的决定，值得一试……"
 CAL_communal_education:0 "社会化教育"
 CAL_communal_education_desc:0 "我党有许多关于教育的新想法。有些些人提倡推行“公共教育”，在这种教育模式中，孩子除了由父母抚养和教育之外，还可以由邻居抚养和教育。还有一些人呼吁在学校里推广社会主义价值观，以便使下一代领悟社会主义。这两种想法都已在考虑之中，并将提交国会审议。"
 CAL_union_expansion:0 "扩展工会"
 CAL_union_expansion_desc:0 "要保护工人的权利只有一个办法，那就是建立工会！工会不渴望暴力，但也不会为在必要时罢工，要求得到自己的东西而害怕。我们将与志同道合的工会管理人员合作，帮助他们招募成员，并保护他们免受打击。"
 CAL_social_commonwealth:0 "工人联邦"
 CAL_social_commonwealth_desc:0 "基础已然铸牢，通过将失业人员纳入我们的计划，并促进人与人间的合作，我们可能最终会建立起一个工人联邦。很快，所有需要帮助的人都能生产他们需要的东西，并同彼此交换。私营企业要么学会竞争，要么学会按照政府设定的新价格出售他们的产品。"
 CAL_the_profits_of_religion:0 "宗教之利"
 CAL_the_profits_of_religion_desc:0 "虽然人有自己的宗教信仰是好的，但我们运动中的许多人无法忍受所谓的“超级教堂”，或那些把上帝的居所变成闹市的人。超过一定规模的教堂，包括经常被怪异的灵性论运动所领导的“新思想”运动在内，都将上交一些税金。"
 CAL_support_the_aclu:0 "支持美利坚公民自由联盟"
 CAL_support_the_aclu_desc:0 "长期以来，国家一直沉迷于侵犯公民的权利。但这种情况以后再也不会出现了！我们将通过减免税收来支持美国公民自由联盟，起诉对他们的暴力骚扰，并代表他们发动一场公开运动，同时同意在他们的事务中保持政治中立，以便他们能够为所有美国人的权利而斗争。"
 CAL_birth_control:0 "文明的支点"
 CAL_birth_control_desc:0 "虽然会有反动派的闲言碎语，但为了个人和社会的利益，我们必须继续支持妇女的生育权。反对节育的法律将被废除，在较贫穷的社区也将更容易实施节育措施。从长远来看，这将有助于鼓励生产率较低的公民少生点孩子。"
 CAL_experimental_sciences:0 "实验性科学"
 CAL_experimental_sciences_desc:0 "如果我们要真正进步，我们就必须相信科学进步！有大量的科研项目在寻求我们的资助，虽然在这个过程中必然荆棘丛生，但与其所带来的突破相比，这些根本算不得什么，即使是那些会被常人嘲笑的突破。"
 CAL_radical_crusade:0 "激进改革"
 CAL_radical_crusade_desc:0 "联邦党连续赢得两次选举，现正大权在握。我们可以实现任何我们想要的目标，因为我们已经得到了选民们的认可。我们将借此与酗酒、赌博和吸烟作斗争。这些癖好破坏了我们社会的道德结构，必须予以粉碎。"
 CAL_support_bellaymism:0 "跟联合工团讲道理"
 CAL_prohibition:0 "禁酒令"
 CAL_prohibition_desc:0 "或许没有什么东西能像肆无忌惮的资本主义那样对工人阶级造成如此大的创伤，但酒精可能算得上一个竞争者。酒精是统治阶级控制工人的工具，它糟蹋了他们的身体、败坏他们的家庭道德。是时候最终达成反酒馆同盟的目标，实施禁酒令了。"
 CAL_commonwealth_reelection:0 "联邦党制霸"
 CAL_commonwealth_reelection_desc:0 "尽管许多人认为联邦党一次选举都赢不了，但它已经赢了两次，而非仅仅一次。辛克莱领导下的政党再次上台，并承诺会继续四年前开始的工作。在通过了重要的经济政策后，他们现在将转向社会领域，希望建设一个更为平等的社会。"
 CAL_raise_inheritance_tax:0 "提高遗产税"
 CAL_raise_inheritance_tax_desc:0 "在我们的社会中，有一些人坐拥着百万美元，但他们从来没有为此奋斗过。我们为什么要奖励这些投胎幸运者而惩罚奋斗者呢？我们必须征收更高额的遗产税，以让我们当中的穷人有饭吃，有屋住。"
 CAL_worker_bonds:0 "劳工债券"
 CAL_worker_bonds_desc:0 "有关劳工债券的想法最近广为人知。这些债券将保护员工免受工资纠纷或老板的财务负担，并让员工有能力过上体面的生活。"
 CAL_reward_productivity:0 "用之于民"
 CAL_reward_productivity_desc:0 "我们将努力确保辛勤工作的人们不再忍饥挨饿。我们将通过制定最低工资制度以消除贫困和饥饿。考虑到美国工人近年来所做的一切，这是理所应当的。"
 CAL_womens_advocacy:0 "维护女权"
 CAL_womens_advocacy_desc:0 "妇女占我国人口的一半，但自政府成立以来，她们几乎没有在政府中的代表。这种情况将不复存在。通过建立新的妇女权益组织以及通过一项项新的立法，我们可以确信妇女将在我们的社会中享有平等的地位。"
 CAL_selective_immigration:0 "选择性接纳移民"
 CAL_selective_immigration_desc:0 "我们必须精心呵护我们的工人。其中一种方法就是有选择性的接纳移民，这样老板就不会在剥削移民劳工的同时对本地工人冷眼相待了。这将补上被贪婪的资本家经常用来剥削劳动力的漏洞。这也能让那些保守派开心一下。"
 CAL_spiritualist_takeover:0 "灵性论运动夺权"
 CAL_spiritualist_takeover_desc:0 "在前联邦警察成员爱德华·朗斯特里特·博丹的灵性论运动及其政治盟友与日本的支持下，人类联合领袖亚瑟·贝尔和年轻的作家、活动家和政党组织者L·罗恩·哈伯德掌握了国家大权，承诺会完全抵挡英国工团主义君主制的威胁。"
 CAL_power_of_information:0 "信息之力"
 CAL_power_of_information_desc:0 "没有党所建立的政治联系，我们就不可能实现救国的目标。尽管如此，我们必须在这一点上加倍努力，以让我们获得多一点的合法性。哈伯德要求在他的领导下使我们的情报部门进一步利用间谍活动影响国会，最终影响全国。"
 CAL_japanese_support:0 "日本靠山"
 CAL_japanese_support_desc:0 "日本的财力和小额贷款足以帮助我们夺取国家，并建立一个比赫斯特对他们更为友好的政府。然而，打江山易，坐江山难，如果我们希望继续大权在握，就必须要求额外的支持，但在提出要求之前，我们首先要使两国关系正常化，并消除赫斯特所谓“黄祸”论的影响。"
 CAL_finish_socialism:0 "扫除赤患"
 CAL_finish_socialism_desc:0 "有了我们所需的政治和财政支持，是时候消灭美国有史以来最大的敌人了——那帮子赤匪。无论他们是英帝的走狗，还是有点用的白痴都没关系，我们所能肯定的是，他们越早滚出去越好，西方的墓地可不少。"
 CAL_media_blackout:0 "取缔媒体"
 CAL_media_blackout_desc:0 "尽管我们试图隐藏我们信仰中最具争议的部分，但媒体仍然不知死活地诋毁着我们，还称博丹和他的追随者为“阴谋论独夫”。媒体对我们的敌意实在太大，让我们退无可退，而且肯定有一些媒体拿了境外势力的钱，因此有必要在短期内彻底清除这些危险的批评。"
 CAL_christian_mysticism:0 "基督教神秘论"
 CAL_christian_mysticism_desc:0 "人尽皆知，统治一群信仰同一个宗教的人更为容易。因此，我们应该转而支持党内的神秘论基督教派。我们将开始向成员施加压力，让他们接受这一观点，并印内容刷适当的杂志以潜移默化地改变人们的思想。"
 CAL_dianetics:0 "誓约胜利之剑"
 CAL_dianetics_desc:0 "我们不能用已失败的信仰拯救我们。哈伯德写的誓约胜利之剑宣言对新思想运动做出了合乎逻辑的结论，阐明了思想对身体的影响，鼓舞了广大党员的斗志。赢得群众们的心还得久一点，但在训练行动家来传播这种潜在力量后，我们将迎来一个新时代。"
 CAL_shadow_recruitment:0 "招募暗影卫队"
 CAL_shadow_recruitment_desc:0 "党不仅必须在信仰和内部结构上，而且还要在招募人员的方法上继续保持半秘密的状态。要做到这一点，我们就得训练现有的党员，让他们在家人和朋友中间巧妙地招募新成员，把他们带到我们的新中心，通过“旁听”等新方法，开始他们在党内的精神之旅。"
 CAL_ufology:0 "不明飞行物学"
 CAL_ufology_desc:0 "随着我们对传统信仰的摈弃，许多党内成员心中都有关于至高存在的问题。值得庆幸的是，哈伯德在他对不朽灵魂的概述中给出了答案——至高存在即是希坦，以及它在到达地球之前来自外太空的后裔。对外星人存在的信仰将在党内传播。"
 CAL_the_messengers:0 "信使"
 CAL_the_messengers_desc:0 "我们仍然需要一个更有组织的安全部门，到目前为止，我们依靠的都是由民兵成员和某些政府雇员组成的松散组织。信使将由我们最虔诚的追随者组成，得到更充足的资金，能直接与党的永久主席联系，并将永远信守他的诺言。"
 CAL_new_science:0 "新科学"
 CAL_new_science_desc:0 "如果我们要保护自己，我们就不能像其他许多人那样对新科学视而不见。心灵遥感、心灵干预、星质和火箭的力量都将作为一种对抗工团和外国影响的战争手段进行研究，那些正这样做的灵性论运动成员也将被纳入官方机构。"
 CAL_supernatural_investigators:0 "超自然调查"
 CAL_supernatural_investigators_desc:0 "如果我们要在大众中推广神秘论，那么我们需要柔和一下我们的主张。关于超自然现象的报道，包括一些由博丹直接撰写的报道，必须只在政党发言人和活动人士之间传播，同时还要成立一个新的超自然现象部门，负责调查超自然现象，并向提出请求的人提供与死者亲属的对话……这要付点钱。"
 CAL_celebrity_endorsements:0 "明星站台"
 CAL_celebrity_endorsements_desc:0 "洛杉矶圈子里的一小群名人似乎对我们的信仰持开放态度，比如悬疑作家亚瑟·J·伯克斯和健康宣传员伯纳·麦克法登。这些人的大名气会对我们有所帮助，所以我们会让麦克法登利用他与上层社会的关系来招募名人加入到我们的事业中来，并承诺推广健康疗法作为回报，同时在哈伯德的敦促下，党将开设名人分部。"
 CAL_religion_of_profit:0 "宗教产金"
 CAL_religion_of_profit_desc:0 "目前，党的信仰和等级制度是非常固化的，对于新晋者来说，几乎没有得到升迁的途径。然而，还是有一种方法可以表明他们对永恒运动的忠诚的——捐款。这些捐赠对慈善事业大有帮助，也让一些人有机会证明自己的忠诚，同时也有助于以秘密知识和权力的承诺吸引上层社会。"
 CAL_the_radio:0 "国家之声"
 CAL_the_radio_desc:0 "除了通过政府宣传册、活动人士和少数经过批准的宣传人员的宣传外，媒体能够掌握信息少之又少，现在是时候实现党的与公众沟通方式的现代化了，这样可能会向媒体提供一个更具连续性的新闻来源。新成立的国家新闻网络将实现这一目标，并为更多宣传真相的公关人员提供岗位。"
 CAL_the_redshirt_plot:0 "红衫阴谋"
 CAL_the_redshirt_plot_desc:0 "虽然我们有些人知道温莎家族和工团主义革命之间的联系，以及他们试图通过假旗行动和外国特工来霸占我们的国家，但更多的人对此一无所知，甚至非常怀疑其真实性。我们必须大声揭露他们的阴谋，并通过对非本地公民的调查进一步保护国家免受潜在的不列颠保皇党分子的伤害。"
 CAL_hunt_down_every_syndicalist:0 "为1776复仇"
 CAL_hunt_down_every_syndicalist_desc:0 "凭借我们已大权在握，我们将从工团主义者和他们背后的主子——英帝，还有那些被他们摧毁国家的阴谋欺骗的有点用的白痴，比如朗派、联邦主义者和所谓的“白人联盟”手中夺回国家。"
 CAL_betray_japan:0 "背叛日本"
 CAL_betray_japan_desc:0 "由于我们已经稳固了政权，日本不仅没有什么用了，而且还妨碍我们在收复美国的路上发挥全部的潜力。现在是时候宣布我们的意图是夺回美国的控制权，并向日本发送最后通牒，他们要么同我们站在一边，要么面对我们的愤怒。"
 CAL_japan_in_command:0 "东洋之命"
 CAL_japan_in_command_desc:0 "到目前为止，日本对我们都非常好。让我们通过签署军事联盟来进一步巩固我们与他们的关系。这将使我们进入“共荣圈”，也使日本对我们的事务有更显著的影响力。有了他们的帮助，我们就能够在西半球施加影响力……"
 CAL_government_reconstruction:0 "改组政府"
 CAL_government_reconstruction_desc:0 "是时候用日本的一些影响重塑我们的政府了。我们将允许陆军和海军拥有强大的势力，总统将试图效仿天皇的威严。能出什么乱子嘛？"
 CAL_japanese_trade:0 "日本的贸易"
 CAL_japanese_trade_desc:0 "太平洋是广阔的，遥远东方的财富就在大洋彼岸。通过日本，我们可以获得巨大的财富和众多的贸易伙伴。我们将与他们签署贸易协定，以便使我们两国更紧密地联系在一起。"
 CAL_cultural_exchange_2:0 "文化交流项目"
 CAL_cultural_exchange_2_desc:0 "尽管此前美国西海岸和亚洲之间存在着敌对关系，但我们现在将努力使这两个地区更紧密地联系在一起，特别是与日本的联系。我们将发展两国之间的旅游业，希望在两国民众出现某种文化交流。我们将第一个派往日本的杰出公民是华特·迪士尼，他将带一些动画放映给皇帝看。"
 CAL_friends_in_the_east:0 "对日特殊关系"
 CAL_friends_in_the_east_desc:0 "我们将与日本发展特殊关系，因日本是我们最亲密的盟友和最大的贸易伙伴。通过跨太平洋的合作，没有什么是我们两国不能实现的。我们不久将在关岛附近举行海军联合演习。现在我们必须设法控制各自大洲的内陆地区……"
 CAL_social_democrats_reelected:0 "进步党连任"
 CAL_social_democrats_reelected_desc:0 "进步主义已成全民共识，美国人民寄望于我党引领全民迈向普惠公正的新纪元。我们将筑牢社会正义之基，培厚公众信任之土，以制度护佑公民共享发展成果。"
 CAL_commons_law:0 "公地法"
 CAL_commons_law_desc:0 "经济学家约翰·康芒斯曾提出精辟论述：资源具有全民共有属性，通过税收既可破解公地悲剧难题，又能为公共事业筹措资金。基于此，应对资源开采行为征收专项税，这一制度设计既体现资源代际公平，亦为可持续发展提供经济杠杆。"
 CAL_national_referendums:0 "全民公投"
 CAL_national_referendums_desc:0 "民主制度虽无设计缺陷，但旧体制中根植的权贵资本主义顽疾却已在内战硝烟下暴露无遗。当下亟需重塑民主机制，破除制度性特权，确保其真正普惠于民。"
 CAL_blanket_primary:0 "无限制初选"
 CAL_blanket_primary_desc:0 "迫使选民坚持按照党派路线投票，可能和金钱的影响一样具有限制性，因此，普遍初选将使他们能够不考虑党派而选择初选候选人。"
 CAL_recall_elections:0 "选举罢免"
 CAL_recall_elections_desc:0 "代行民权的立法与行政机关，须与民意时刻相通。我们将通过全民公投建立联邦、州及地方三级官员的罢免机制，让选民能定期行使问责权，确保权力始终植根于民、用之于民。"
 CAL_kill_gold:0 "摧毁金权暴政"
 CAL_kill_gold_desc:0 "金本位制度迫使我国经济政策偏向抑制通胀，罔顾债权人权益，更在经济衰退期削减开支，最终徒损民生。失去了黄金的束缚，货币与财政政策方能更趋灵活。"
 CAL_tariff_reduction_act:0 "削减关税法"
 CAL_tariff_reduction_act_desc:0 "我们必须削减进口商品的关税壁垒，现行政策已对本国工农群体造成严重损害。通过关税互减机制，既能打开海外市场通道，又可大幅提升出口总量。此项改革正是迈向惠及全美民众之经济繁荣的关键落子。"
 CAL_womens_bill:0 "美国妇女法案"
 CAL_womens_bill_desc:0 "我们将立法保障妇女权益，在离婚诉讼、财产分配及选举投票等社会领域实现平等权利。"
 CAL_liberals_win_twice:0 "社会自由派再次胜利"
 CAL_liberals_win_twice_desc:0 "自由派的成功连任印证了混合经济体制经得起民众的信赖——其行政机制构筑的保障体系既实现了效率最大化，又切实提升了普罗大众的福祉水平。"
 CAL_fpc:0 "联邦电力委员会"
 CAL_fpc_desc:0 "该委员会肩负两大核心职能：一是在国有土地上开发水电工程，二是监管电力与天然气行业运行。我们将密切监督相关企业经营活动，在确保能源供应安全的同时，持续完善基础设施建设。"
 CAL_glass_steagall:0 "格拉斯-斯蒂格尔法案"
 CAL_glass_steagall_desc:0 "投资银行与零售银行业务长期交织共生，这种混业经营模式埋下风险传导的隐患——正如银行投资失利时触发的挤兑危机。为此必须建立制度性隔离机制，在两类业务间筑起金融防火墙。"
 CAL_FDIC:0 "联邦储蓄保险公司"
 CAL_FDIC_desc:0 "金融机构的经营风险可不能由储户全额买单！联邦存款保险公司将建立存款保险制度，通过设定承保上限既保障基本民生，又重塑银行体系信用根基。"
 CAL_AFDC:0 "抚养未成年儿童家庭援助"
 CAL_AFDC_desc:0 "即便倾尽全力，仍有部分多子女贫困家庭亟待制度性保障。当务之急是推动《抚养未成年儿童家庭援助》落地，为这类家庭建立专项救助机制。此举既能释放劳动者的家庭照料压力，缓解其后顾之忧，又能通过提升工作专注度实现效率增益。"
 CAL_republicans_win_twice:0 "共和党连任"
 CAL_republicans_win_twice_desc:0 "共和党力推的亲产业政策与自由放任政策终获验证——太平洋国既已托付其重铸繁荣之路，此番再获民意加持，必能以十足信心续写繁荣篇章。"
 CAL_rfc:0 "复兴金融公司"
 CAL_rfc_desc:0 "要说胡佛为数不多的正面政绩，当属创建复兴金融公司。这家机构专为达不到美联储准入标准的银行及行业提供贷款支持。只要合理约束其权限并确保资金充足，必将成为我们推动经济复苏的重要助力。"
 CAL_dam_projects:0 "大坝计划"
 CAL_dam_projects_desc:0 "大坝承载着多重社会使命：既是发电供水的重要设施，又是调控洪水的关键屏障。这些融合尖端科技的治水杰作，将持续推动人类文明的变革。我们应当全力推进大坝建设，持续投入筑坝技术创新。"
 CAL_radical_decentralization:0 "市场去中心化"
 CAL_radical_decentralization_desc:0 "我们必须对市场机制进行重大调整。联邦政府将停止对地方经济的过度干预，转而重点扶持地方银行发展，推动建立由各州自主主导的市场体系。"
 CAL_support_wet_laws:0 "支持饮酒法"
 CAL_support_wet_laws_desc:0 "既然酒类利润唾手可得，何苦紧盯禁酒令不放？眼下绝非舍弃此项财税良机之时，酒精经济产生的利润将强力提振我国经济。我党将全力推动各类饮酒法律落地，制度确保国家持续获益。"
 CAL_support_right_to_work:0 "工作之权"
 CAL_support_right_to_work_desc:0 "任由工会在社会中猖獗活动本就是件糟心事，而现在我们也没有什么应对之策，但至少应该保证工人别被强收会费，而是将血汗钱用在刀刃上……"
 CAL_scientific_taxation:0 "科学课税"
 CAL_scientific_taxation_desc:0 "国家乃至政府中的许多人都认为，提高税收是增加财政收入的不二法门。不过，商人安德鲁·梅隆却公开站出来反对这一观点，他认为减税反而能拉动经济的增长，刺激经济又好又快发展，最终摆脱大萧条的阴影。"
 CAL_surplus_aid:0 "盈余援助"
 CAL_surplus_aid_desc:0 "我们不仅实现了预算平衡，更创下了财政盈余。此笔资金将专项调拨至我国最需帮扶的群体——农民。如此一来，便能消弭曾举旗叛乱的农民的对立情绪，让其再度融入我们的大家庭。"
 CAL_invest_in_children:0 "扶助孤儿"
 CAL_invest_in_children_desc:0 "每个孩子都应享有平等的人生起点。然仍有遭父母遗弃的稚子亟待制度性庇护。唯有建立系统化扶助机制，方能在困境幼苗中培育德才兼备的未来栋梁，而非坐视其坠入困境深渊，重蹈代际贫困的恶性循环。"
 CAL_democrats_win_twice:0 "民主党连任"
 CAL_democrats_win_twice_desc:0 "自第一次内战至今，民主党取得了不少的成绩。如今，我党的民望创下新高，正好借此施展一番宏图。诸如装束暴露和酗酒等不道德的行径即使不去明令禁止，也要大力劝阻。同时，我们也要支持美利坚的脊梁——农民，以及国家运转的保障——工人。"
 CAL_reefer_madness:0 "为麻而狂"
 CAL_reefer_madness_desc:0 "抽大麻这路害人癖好必须全面禁止、严厉打击。纵容硬性毒品肆虐的社会终将自我瓦解。今日若对此等毒瘤网开一面，明日摆上台面充正经又能是什么货色？"
 CAL_patriotic_schooling:0 "爱国主义教育"
 CAL_patriotic_schooling_desc:0 "如今爆发的二次内战，校园爱国主义教育的长期缺位便是诱因之一。若能引导学童咏唱国歌、研习传统民俗文化，以此培育深沉的家国情怀，方能筑牢精神防线，避免再度内战。"
 CAL_vice_squads:0 "打击犯罪"
 CAL_vice_squads_desc:0 "我们将设立一新部门来弥补警察和国民警卫队执法职能的不足。这一部门唤作“警察缉捕队”，专门负责稽查道德不端、伤风败俗之行为，并将其报告给警察，或在特殊时刻直接拘留当事人。"
 CAL_sex_laws:0 "正风规章"
 CAL_sex_laws_desc:0 "总有人想靠着贩售淫秽色情或者“性援助”发一笔财。我们将立法禁止这类行为，至少也要做到明面上不再有此类交易。根据“正风规章”，一切广告不得出现性暗示或与性相关的内容，消费者们可不能再简简单单地购买到这些垃圾了。"
 CAL_support_farms:0 "支持农业"
 CAL_support_farms_desc:0 "农场乃美国民主之基、文化之源。民主党农业法案将提高农产品补贴力度，鼓励企业批量采购农产品，政府更将兜底损耗成本，为农户解除后顾之忧。"
 CAL_blue_laws:0 "蓝色法规"
 CAL_blue_laws_desc:0 "周日理应是民众休憩团聚之时，强制工作实属悖逆人伦。推行蓝色法规既可确保企业支付加班薪酬以回应劳工诉求，又能通过保障家庭时光巩固社会伦理，实为兼顾民生与秩序的双赢之策。"
 CAL_ban_race_mixing:0 "种族融合的联邦禁令"
 CAL_ban_race_mixing_desc:0 "正如麦迪逊·格兰特等人所述，种族融合只会导致高加索人种走向衰落。为了我们的文明，政府须全面禁止种族融合。"
 CAL_jazz_crackdown:0 "镇压爵士乐"
 CAL_jazz_crackdown_desc:0 "正如赫斯特报纸所记载的那样，爵士乐不是黑人社区的一种无害的爱好，而是引诱白人女性的一种阴险的手段，或是毒品的发源地。一些严格执行的突袭和调查应该会减少这种情况。"
 CAL_blind_eye:0 "睁一只眼闭一只眼"
 CAL_blind_eye_desc:0 "虽然三K党是我们的敌人，但当他们试图控制国家时，这些暴徒有时会在法律无法维持的地方执行规则。如果我们任命对这一观点持更开放态度的成员，将会缓和我们与他们的关系。"
 CAL_lily_white_movement:0 "新白百合运动"
 CAL_lily_white_movement_desc:0 "种族隔离主义者宣称，政治应该属于美国白人，而不是那些没有把国家利益放在心上或没有办法团结国家的少数族裔。各党派和地方议会将尽最大努力只支持白人候选人。"
 CAL_increase_segregation:0 "资助地方隔离"
 CAL_increase_segregation_desc:0 "虽然我们不能制定全国性的种族隔离政策，但我们可以通过金钱奖励和政治掩护，支持那些选择进行种族隔离的地方。"
 CAL_repatriation:0 "墨西哥裔遣返"
 CAL_repatriation_desc:0 "墨西哥人来到我们的农场工作，这是他们必须做的。然而他们不能以我国公民的身份在此定居。当他们在这方面不再有用时，应将他们遣返回自己的国家。他们就能把赚来的钱带给家人，而我们的人民也将按照自己的意愿与他们分离。"
 CAL_denounce_race_hatred:0 "谴责种族仇恨"
 CAL_denounce_race_hatred_desc:0 "虽然我们仍在制定全面的种族政策，但我们应该向我们的人民传达一个信息。无论我们创建的是一个隔离的社会还是一个融合的社会，对其他种族的仇恨都是不可容忍的。我们都在试图用自己的方式生存，而最近，国家内的仇恨已经够多了。让我们尽我们所能消除其中一个源头。"
 CAL_oppose_radicals:0 "反对激进分子"
 CAL_oppose_radicals_desc:0 "许多激进分子经常在种族问题上发表带有攻击性的激进言论。我们既要维护传统的社会秩序，又要做出一些调整，使少数民族融合家庭能够兴旺发达。在这方面我们既不会让时光倒流，也不会跳入深渊。相反，我们将推动改革，而不是革命。"
 CAL_conditional_black_aid:0 "有条件援助黑人"
 CAL_conditional_black_aid_desc:0 "援助将发放给那些证明自己能够以有意义的方式为社会做出贡献，而且没有愚蠢地跨越既定界限的黑人家庭。我们将把这些家庭作为黑人生活的榜样，而对那些选择剥削他人或推动激进议程的人绝不宽容。"
 CAL_support_seperatism:0 "安抚种族保守派"
 CAL_support_seperatism_desc:0 "我们在种族政策方面取得了很大进展，但现在我们必须处理这方面带来的影响。我们将向保守派保证，社会将保持隔离，种族融合不会发生。我们的社会将是隔离但平等的。"
 CAL_quota_adjustments:0 "修订紧急限额法案"
 CAL_quota_adjustments_desc:0 "1921年出台的紧急限额法案于1924年永久生效，大大限制了来自南欧和东欧的移民，并完全禁止了亚洲移民。也许是时候重新考虑这些限制了，这样我们就可以帮助我们遭受损失的人口再次增长。"
 CAL_hire_black_americans:0 "雇佣非裔美国人"
 CAL_hire_black_americans_desc:0 "在工作场所歧视美国黑人只会伤害我们的国家和我们的劳动力。如果我们要与世界大国竞争，我们必须让所有人在想找工作时都能找到工作。我们将在黑人社区鼓励这种行为，并向人们展示黑人也能像其他人一样努力工作。"
 CAL_encourage_integration:0 "鼓励融合"
 CAL_encourage_integration_desc:0 "黑人和白人没有理由不能和睦相处。只要坚持家庭价值观，只要努力工作仍然是美国的传统，就没有理由反对融合。不管批评我们的人说什么，我们都会尽快实行这项政策。"
 CAL_fund_black_education:0 "投资黑人教育"
 CAL_fund_black_education_desc:0 "长期以来，黑人接受良好教育的选择是有限的。通过享有更优质的教育资源和技术知识，黑人种族将蓬勃发展，我们的国家也将蓬勃发展。像布克·T·华盛顿这样的人是我们年轻人的榜样，他们可以通过在学校里取得好成绩而在生活上得到益处。"
 CAL_fight_welfare_discrimination:0 "与福利歧视斗争"
 CAL_negro_bureau:0 "黑人事务局"
 CAL_negro_bureau_desc:0 "我们已经与杰出的黑人领袖达成了一项协议，他们中的许多人强烈反对宪政国的法令，现在要求我们改革或废除旧有的歧视法。黑人事务局将促进这些领导人和我们政府间的合作，以改善全国黑人的命运。而另一个秘密条款是合作反对反黑人激进分子。"
 CAL_national_immigration_act:0 "改革移民法案"
 CAL_national_immigration_act_desc:0 "我们必须放宽对移民进入我国的限制。我国政府中的知名自由派人士建议，取消对亚洲移民的禁令，允许一些来自边境的工人和他们的家人留在美国。这将改善与这些国家的关系，并带给我们更多的人力。"
 CAL_american_imperialism:0 "美利坚帝国主义"
 CAL_american_imperialism_desc:0 "美国不会是一个被动地看着其他国家占据未来，而自身无动于衷的国家。美利坚的天命是超越最初的大英帝国，终结对美国人民的威胁，这既是为了我们的安全，也是为了最终成为一个备受尊重的大国。美利坚帝国主义的计划和政策将由总参谋部制定，随后我们将向他们提供所需要的一切。"
 CAL_make_mexico_friendly:0 "向墨西哥的罪行施以复仇"
 CAL_make_mexico_friendly_desc:0 "难道墨西哥人真的认为他们可以脱离我们的掌控，转而拥抱工团主义强盗吗？他们对我们边境的袭扰让大量美国公民死亡或失踪，只要这个国家不在美利坚阳光的照耀下，就仍然是一个威胁。让我们提醒美国人民，那些伤害他们的人将不被原谅。"
 CAL_banana_republics:0 "香蕉共和国"
 CAL_banana_republics_desc:0 "联合果品公司为美国带来了至关重要的资源——至少在中美洲拒绝我们提供的经济发展和保护前是如此。我们必须确保为了美利坚帝国的未来重新夺回这一切，让这些小国认清自身的位置。"
 CAL_demand_the_philippines:0 "菲律宾的归属"
 CAL_demand_the_philippines_desc:0 "菲律宾希望利用美国内部的混乱来争取独立，这一点毋庸置疑。然而混乱已经过去，我们必须为了双方的利益，把他们改造成美国的直属殖民地，从而确保他们不会在未来再有此种妄想。"
 CAL_vietnam_yesterday:0 "昨日越南"
 CAL_vietnam_yesterday_desc:0 "越南在远东的优势和地理位置不容忽视，因为它是美国扩张的重点。然而，这使它成为了其他殖民主义列强的首要目标。如果德国仍控制着这片领土，或许这值得我们的购买。如果他们没有，那这里应该很容易成为我们的猎物。"
 CAL_stop_south_american_syndicalism: "遏制南方的工团主义"
 CAL_stop_south_american_syndicalism_desc: "我们先前已经谴责了工团主义这一祸端，但现在我们必须更进一步。是时候对西半球的工团主义政权采取军事行动了。我们会让拉丁美洲重回我方掌控。"
 CAL_dismantle_the_empire:0 "碾碎温莎王朝"
 CAL_dismantle_the_empire_desc:0 "新世界秩序的开始往往伴随着旧秩序的崩溃。英国不断地想要如几个世纪前那样干涉我们的事务，把我们当作工具人——温莎王朝必须要学会尊重美国。加拿大将会感受到美国的强大，他们辽阔的土地将为我们所用，这就是君主制的终结和一个新西方强国的诞生。"
 CAL_claim_australasia:0 "平定澳大拉西亚"
 CAL_claim_australasia_desc:0 "英国君主政体虽已覆灭，但澳大拉西亚仍是一股不容忽视的力量。他们的海军威胁到了我们在远东地区的扩张，而且由于我们对该地区的垂涎人尽皆知，即便他们的政府对我们暂时没有直接的敌意，也是一副紧绷神经的谨慎样。如果我们想牢牢掌控这一地区，就必须平定澳大拉西亚。"
 CAL_new_moralism:0 "新道德主义"
 CAL_new_moralism_desc:0 "美国决不能与其他帝国同流合污，也决不能堕落为他们的一员。这种不道德的想法本身就是对美国传统的侮辱。相反，我们将更多强调和平主义理想，并尽可能将军费开支用于国防。"
 CAL_support_eastern_allies:0 "稳定东方"
 CAL_support_eastern_allies_desc:0 "我们必须支持东方的盟友，将菲律宾置于我们的羽翼之下，为他们提供保护。"
 CAL_new_interventionism_desc:0 "我们不参与上次世界大战的选择看来是一个错误。虽然我们可能不会全盘认同协约国的理念，但他们是我们的天然盟友。让我们纠正过去的错误，同他们一起夺回其祖国。是时候完成我们在世界舞台上的初次亮相了。"
 CAL_western_alliance:0 "协约国盟友"
 CAL_western_alliance_desc:0 "我们需要联合同为资本主义民主制度的兄弟——协约国，共同对抗威胁我们双方的极端分子和敌对帝国势力。如若我们能助其夺回家园，那么工团主义就将迎来末日，而他们也将成为我们的缓冲区。"
 CAL_the_city_on_a_hill:0 "山巅之城"
 CAL_the_city_on_a_hill_desc:0 "我们将进一步把军事和外交资金向工业，特别是汽车产业转移，满足美国民众的需求，从而成为一盏闪耀的进步明灯。"
 CAL_spirit_of_monroe:0 "门罗精神"
 CAL_spirit_of_monroe_desc:0 "南美洲的确是美国的后院，但我们也必须深切地认识到，我们是南美洲人民的保护者。为了保卫双方的安全，我们必须要保护其不受列强和其他形式暴政的侵害。"
 CAL_american_pacificism:0 "美利坚和平主义"
 CAL_new_interventionism:0 "新干预主义"
 CAL_anti_imperialism:0 "美利坚反帝主义"
 CAL_anti_imperialism_desc:0 "美国必须采取坚定的立场，反对当今世界上最主要的专制形式——帝国主义。只有那些像我们一样受到威胁的人才是我们真正的朋友。"
 CAL_moral_support:0 "自决公约"
 CAL_moral_support_desc:0 "我们将发表支持独立权的宣言，并宣布我们将在全世界捍卫它。"
 CAL_league_of_anti_imperialism:0 "反帝同盟"
 CAL_league_of_anti_imperialism_desc:0 "我们要将反帝同盟的成员纳入政府，听取他们的意见，组建一个新的平等联盟，一个共同反对威胁我们的帝国主义列强的联盟。"
 CAL_warn_japan:0 "警告日本"
 CAL_warn_japan_desc:0 "日本对整个东亚甚至我们在太平洋的后院都有所图谋，这不是什么秘密了，所以我们应该警告他们不要对我们的潜在盟友进一步试探，并希望在这个过程中遏制他们。"
 CAL_embargo_japan:0 "对日禁运"
 CAL_embargo_japan_desc:0 "虽然我们之前已有过动作，但日本仍旧不值得信任，我们得通过禁运，特别是石油的禁运，来进一步削弱日本。"
 CAL_strike_japan:0 "进攻日本"
 CAL_strike_japan_desc:0 "是时候进攻我们在太平洋上最大的敌手——日本帝国了。我们将通过武力让其与我们利益一致，因为这是我们给东方宿敌的唯一选择。"
 CAL_phillipines_guarantee:0 "巩固盟约"
 CAL_phillipines_guarantee_desc:0 "我们需要加强与其它国家的合作，并投资军工、科研产业。"
 CAL_tokyo_talks:0 "东京会谈"
 CAL_tokyo_talks_desc:0 "对抗也许不是必经之路，派遣外交官出访日本、签署互不侵犯条约或许才是最符合双方利益的选择。"
 CAL_maf_investigation:0 "调查中央非洲"
 CAL_maf_investigation_desc:0 "很少有殖民地能像德国人控制的中央非洲这片黑暗大陆那样充斥着大量可疑的不法行为。我们会派遣一支小队前去调查，并在这一过程中明确我们的反帝立场。"
 CAL_patriotic_broadsides:0 "以爱国为名的声讨"
 CAL_patriotic_broadsides_desc:0 "人民应当铭记，质疑对国外事务的大肆干涉不仅不是不爱国的行为，反倒正是开国元勋们的希冀！公开支持帝国主义立场之人必将因爱国主义的抨击、批评而大失民望，我们亦可借此巩固自身。"
 CAL_defensive_navy:0 "防卫舰队"
 CAL_defensive_navy_desc:0 "强大的海军是防卫的基石，况且帝国主义列强只能从海上侵犯我国，因此，我们应加大海军投资，据帝国主义于国门之外。"
 CAL_support_anti_syndicalism:0 "反工团主义立场"
 CAL_support_anti_syndicalism_desc:0 "我们当然不支持帝国主义，但是也同工团主义国家没有任何共同语言可言。我们将采取坚定的反工团立场，警告工团主义国家不让妄想与我们作对。"
 CAL_sphere_of_influence:0 "势力范围"
 CAL_sphere_of_influence_desc:0 "在美洲构建起势力范围后，我们就可以通过各地的人脉来推动商务及科研合作，并在这一过程中进一步增进外交实力。"
 CAL_ally_new_mexico:0 "支持新墨西哥"
 CAL_ally_new_mexico_desc:0 "既然墨西哥已经建立了非社会主义政府，我们就应该尝试与其建立外交关系，并通过派遣大批外交官和商人对其予以支持。"
 CAL_atlantic_base:0 "大西洋前哨"
 CAL_atlantic_base_desc:0 "我们不能在没有掌控大西洋的情况下占领欧洲。"
 CAL_western_dominance:0 "新的世界主导地位"
 CAL_western_dominance_desc:0 "新世界主导地位是我们的正当权利，我们将建设我们的军事能力，以便我们最终能够实现这个目标。"
 CAL_look_east:0 "远东的潜力"
 CAL_look_east_desc:0 "东方的殖民地盛产廉价劳动力和橡胶，我们只需要规划好海军，安排好行动的指挥官，就可以准备好发动入侵、占领该地区了。"
 CAL_hawaiian_launchpad:0 "夏威夷跳板"
 CAL_hawaiian_launchpad_desc:0 "夏威夷是美国海军在整个太平洋上开展军事行动的理想地点。只要控制了夏威夷，控制了这片海域，就再没有人能阻止我们在该地区的行动了。"
 CAL_ports_of_south_china:0 "华南港口"
 CAL_ports_of_south_china_desc:0 "中国南方的港口让英国富裕了一段时间，但我们不能再满足于控制其中的一小部分了。相反，我们将控制一切。"
 CAL_lend_lease:0 "协约国的租借"
 CAL_lend_lease_desc:0 "协约国急需我们的支援，而我们也会把自身生产的武器供给他们。"
 CAL_the_lion_and_the_eagle:0 "鹰狮齐行"
 CAL_the_lion_and_the_eagle_desc:0 "狮子与雄鹰如今正坚定地站在同一战线上，我们的经济内阁即将举行会议，讨论我们可以共同进行的军需品投资。"
 CAL_persian_influence:0 "波斯的影响力"
 CAL_persian_influence_desc:0 "波斯的地理位置和石油储备赋予了其巨大的潜力，而为了各方的安全，我们必须将它纳入协约国的控制。"
 CAL_meditarrian_ports:0 "地中海港口"
 CAL_meditarrian_ports_desc:0 "我们必须投资法兰西民族国的港口，这样他们才有希望从工团之敌手中夺回自己应有的国家。"
 CAL_bolster_dominion:0 "支援自治领"
 CAL_bolster_dominion_desc:0 "印度自治领的统治已经相当稳固，但他们仍缺乏工业和经验。这两处缺口将由我们来填补，以便他们捍卫那里的民主利益。"
 CAL_european_recovery_program:0 "欧洲复兴计划"
 CAL_european_recovery_program_desc:0 "欧洲虽已重回其正统政府之手，但战争与革命的阴影依旧笼罩其上。我们必须通过总参谋部和高级政治顾问共同制定的援助计划为盟友提供资金，协助其顺利开展重建工作。"
 CAL_push_further:0 "西方帝国"
 CAL_push_further_desc:0 "伊比利亚人曾经认为南美洲的丰富资源独属于他们自己，而如今这一诱人的珍馐于我们而言唾手可得！南美洲的资源是充实美国国力的必需品，而其地理位置又与美国的国家安全息息相关，因此，我们决不能让这里的各路激进分子站稳脚跟，也不能让其政府做大做强。美国的后花园必须要安全无虞。"
 CAL_take_panama:0 "美利坚的巴拿马"
 CAL_take_panama_desc:0 "巴拿马回到了美国手中，这次我们不会再重蹈覆辙了。除了在巴拿马进行投资，让这里真正成为美国的一部分外，我们还会派遣军队镇压反对派，最终让这里的美国人过上锦衣玉食的美好生活。"
 CAL_demand_greenland:0 "索取格陵兰"
 CAL_demand_greenland_desc:0 "丹麦这么一个蕞尔小国怎么能从我们手中占有这么多对我们来说利益攸关的重要领土？他们要么接受我们的领土要求，要么后果自负。"
 CAL_claim_the_east_indies:0 "声索印苏林迪亚"
 CAL_claim_the_east_indies_desc:0 "印苏林迪亚，亦即荷属东印度群岛，蕴藏着丰富的资源，是控制这一地域的必争之地，这里必须属于我们，而不是一个辉煌早已落幕的垂暮帝国。"
 CAL_giant_of_the_west:0 "西方的巨人"
 CAL_giant_of_the_west_desc:0 "我们以雷霆之势拿下了西方，现在只需重申余下的要求便可以了。"
 CAL_giant_of_the_east:0 "太平洋强国"
 CAL_giant_of_the_east_desc:0 "太平洋是我们的，而且只要通过必要的军事行动和经济合作让我们的盟友完全依附于我们，太平洋就将永远都是我们的。"
 CAL_national_rhetoric:0 "民族主义宣传"
 CAL_national_rhetoric_desc:0 "美国人民不能忘记我们民族与生俱来的优越性，谁也无法阻止我们向弱小国家扩张的步伐。我们应在国内着重宣扬帝国主义言论，让每一位公民都为国尽力。"
 CAL_strike_britain:0 "终结不列颠联盟"
 CAL_strike_britain_desc:0 "我们终于可以扼杀掉工团运动和不列颠联盟了。我们的老对头——英国人将真正臣服于我们脚下。"
 CAL_new_marine_corps:0 "新海军陆战队"
 CAL_new_marine_corps_desc:0 "为达到能够对全球各地展开入侵的目标，我们必须进一步扩大海军陆战队的规模并加大投资力度。他们将通过更加艰苦的训练练就更加坚定的毅力，成为为所有人扩大美国的利益的前锋。"
 CAL_constitutional_convention:0 "内战胜利者"
 CAL_constitutional_convention_desc:0 "分裂分子企图摧垮美利坚合众国的阴谋再度归于失败。尽管激进社会主义与民粹主义者险些击碎我国的权力基石，联邦政府再度向世界证明了自己不可抵挡的力量。企图成为独裁暴君的比尔·海伍德与休伊·朗将被美国人民世代唾弃！"
 CAL_classical_liberal_mandate:0 "恢复自由"
 CAL_classical_liberal_mandate_desc:0 "尽管独裁政治颇具诱惑力，美国三权分立制度仍然完好地保存下来，拒绝向行政权力低头。美国国会日前召开紧急会议就善后目标作出研讨，最高法院也开始埋头处理堆积如山的文件与案宗。"
 CAL_review_the_fed:0 "审查美联储"
 CAL_privatize_and_negotiate:0 "私有化和谈判"
 CAL_victory_in_the_civil_war:0 "内战胜利者"
 CAL_victory_in_the_civil_war_desc:0 "分裂分子企图摧垮美利坚合众国的阴谋再度归于失败。尽管激进社会主义与民粹主义者险些击碎我国的权力基石，联邦政府再度向世界证明了自己不可抵挡的力量。企图成为独裁暴君的比尔·海伍德与休伊·朗将被美国人民世代唾弃！"
 CAL_finish_spa:0 "社会党的未来"
 CAL_finish_spa_desc:0 "虽然美国政府容忍各种政治言论，但国会已联合起来反对朗和海伍德的工团主义和分配主义纲领。提倡工会或互助组织的机构将根据1917年《惩治叛乱法》受到起诉。"
 CAL_fcc_monitoring:0 "联邦通信委员会监控"
 CAL_fight_the_poll_tax:0 "自由民局"
 CAL_fight_the_poll_tax_desc:0 "在第一次内战之后，我们建立了自由民局来帮助非裔美国人进入社会。随着第二次内战的结束，我们必须再做一次，但要在这方面走得更远。我们将鼓励黑人参政，允许黑人拥有投票权，确保他们拥有压制三K党所需要的东西。"
 CAL_redeemer_collaboration:0 "救赎与合作"
 CAL_redeemer_collaboration_desc:0 "我们的官员坚持要求恢复一部分旧民主党和三K党成员的名誉，可能是因为他们中的许多人曾经属于民主党。我们会找出他们中既不激进，也不疯狂的人，让他们加入我们。作为交换，他们会帮助我们追捕剩下的三K党成员。这可能会不受我们黑人公民的欢迎，但这对于恢复秩序是必要的。"
 CAL_rust_belt_autonomy:0 "钢带地区的权利"
 CAL_rust_belt_crackdown:0 "稳定的工业"
 CAL_maintain_nationalizations:0 "维持联邦控制"
 CAL_maintain_nationalizations_desc:0 "尽管我们不同意社会党的大部分主张，但一些威权倾向的左翼政府官员却坚持认为，希望工业国有化的工会团结联盟和集权派是正确的。这些代表正在敦促我们维持联邦政府对工业的控制，这样我们就可以压制贪婪的企业。"
 CAL_local_control:0 "地方工业化"
 CAL_local_control_desc:0 "我们许多同情联合工团的社会民主党人主张，我们应该实行一种“地方工业化”制度。这将允许工人干部对他们的工作场所的控制权，除此以外还要进行其他改革，包括保证工人的工会权利，只要他们属于一个忠诚的工会……"
 CAL_defend_democracy:0 "自由民局"
 CAL_defend_democracy_desc:0 "来自叛乱州的报告结果表明，不少选民依然因为他们的种族和阶级立场受到无端恐吓，某些竞选州内公职的候选人甚至拒绝效忠美国宪法。我们必须维护民众的投票权，同时确保那些别有用心的政客们无法再挑起一场叛乱。"
 CAL_bill_of_rights:0 "重拾权利法案"
 CAL_bill_of_rights_desc:0 "在推广宪法教育的基础上，美国国会已批准向新生代美国人讲解《权利法案》实施的必要性，鼓励他们以非暴力方式更好地运用自己的公民权利。"
 CAL_end_jim_crow:0 "终止吉姆·克劳法"
 CAL_end_jim_crow_desc:0 "亚伯拉罕·林肯今天能从棺材板里爬出来，一定程度上要归功于南方的种族隔离制度。这个制度实际上就是奴隶制，如果我们要恢复自由民主，就必须终结这个制度。这可能不受南方那群种族主义者的欢迎，但我们不会再犯偏袒他们的错误。"
 CAL_traditional_machines:0 "传统机器"
 CAL_traditional_machines_desc:0 "几十年来，民主党一直控制着南方。在大部分地区，共和党甚至没有任何插手余地。既然已经建立起来的政治机器可以变得更加温和，为什么还要推翻它们呢？我们将与这些政治机器合作以确保我们能完全控制南方。"
 CAL_trial_of_the_federalists:0 "审判联邦派"
 CAL_trial_of_the_federalists_desc:0 "麦克阿瑟强行在华盛顿夺权时背叛了宪法。我们必须决定他和追随者们的命运。我们的一些政客和军官恳求我们为这些联邦党人中的一些人平反，而他们的反对者则以同等大小的“声音”坚持要我们把他们每个人都绞死。他们的命运将由法庭决定，就像第二次内战前罪犯的命运一样。"
 CAL_loyal_army:0 "忠诚的军队"
 CAL_loyal_army_desc:0 "虽然联邦党人明显地背叛了我们的国家，但对他们进行过于严厉的惩罚会让许多人感到厌恶。那些同情联邦党人的人认为，与其起诉这些卖国贼，不如把他们仅仅从军队里开除，让他们自生自灭。虽然这不会让那些强硬派政客满意，但多数人认为这是一种公平的办法。"
 CAL_hit_radical_redshirts:0 "粉碎旧三K党"
 CAL_hit_radical_redshirts_desc:0 "旧三K党是第一次内战遗留下来的。将近80年后，他们终于到了灭亡的时刻。我们会镇压黑色军团和三K党以确保他们再也没有力量反抗我们。"
 CAL_salute_the_patriots:0 "向爱国者致敬"
 CAL_salute_the_patriots_desc:0 "当麦克阿瑟夺权时，他显然越过红线了。然而，他只是在做他认为保持国家团结所必需的事情罢了。也许联邦党人可以东山再起并重返军队。这可能会引起一些人的争议，但可以帮助我们重建被削弱的军队。"
 CAL_american_values1:0 "美国价值观"
 CAL_american_values1_desc:0 "联邦政府通过权威读物向公众舆论施加影响，这种能力正在受到煽动性宣传册与私营出版商的挑战，后者不断呼吁颠覆美国的民主政权。为此，美国国会决定多渠道利用大众媒体传播美国价值观，将煽动者对主流社会的威胁降至最低。"
 CAL_restore_legitimacy:0 "恢复合法性"
 CAL_restore_legitimacy_desc:0 "内战时期失联的诸多使馆已对外恢复运营。我们应重新树立美国团结而强大的国际形象，为此，扩大外交使团规模是必要的选择。"
 CAL_malice_and_charity:0 "愤恨与关怀"
 CAL_malice_and_charity_desc:0 "“照顾那些经历过战争的人”，林肯总统曾如是说道。美国国会已在战后成立专门委员会负责对叛乱州实施大规模政治与社会改造，与之相关的无党派执行机构被命名为“愤恨与关怀”，帮助叛乱各州逐渐回归联邦政府的怀抱。"
 CAL_civil_liberties:0 "忠于美利坚"
 CAL_civil_liberties_desc:0 "20世纪30年代初，“忠于人民”的概念对美国民众而言依然胜过意识形态。遗憾的是，比尔·海伍德、休伊·朗与麦克阿瑟的手下对他们领袖的忠诚显然是超脱法律之外的。日前，数名国会议员公开为他们在战争期间发表的不恰当言论向公众致歉。"
 CAL_ensure_political_stability:0 "确保政治稳定"
 CAL_ensure_political_stability_desc:0 "尽管部分议员坚决反对这项举措，允许联邦通信委员会“监听叛乱者控制下的无线电台”仍被视作必要之恶。该政策与其他多种形式的审查制度相结合，有效遏制美国境内尚存的叛军活动。"
 CAL_protect_democracy:0 "捍卫民主"
 CAL_protect_democracy_desc:0 "第17宪法修正案使美国民主的代表性有所增强，但长远来看，却未能使选举进程更具民主意义。美国国会应恢复征收投票税、开启重罪审查制度，在确保民主进程的同时深化现代社会对法律的尊重。"
 CAL_land_of_the_free:0 "自由人的国度"
 CAL_land_of_the_free_desc:0 "战俘营内的强制劳役政策将被国会宣布取缔。尽管战俘的命运依然取决于法院裁决，但联邦州与叛乱州对战俘惨无人道的剥削必须得到有效遏制。"
 CAL_home_of_the_brave:0 "勇敢者的家园"
 CAL_home_of_the_brave_desc:0 "内战老兵曾为保卫家园付出过自己的一切，惟愿今后的美国人不必再相互攻讦。尽管众议院对此颇有微词，参议院还是明智地将退伍军人福利政策延伸到叛乱州的复员老兵，只要他们肯恢复对全体美国人的誓言。"
 CAL_for_the_people:0 "为了人民"
 CAL_for_the_people_desc:0 "美国民众是我们的选民，也是国家的命脉所在。美国国会日前已通过法案，将五一劳动节调整为“美国人民日”，以此向超越工人运动的爱国主义情怀致以诚挚的敬意。"
 CAL_future_of_the_afp:0 "至上党的未来"
 CAL_future_of_the_afp_desc:0 "国会认为至上党是一个叛国政党，必须接受叛国的审判。而根据1917年的《惩戒叛乱法》它将被取缔。他们最极端的民粹主义思想在我们的新社会中没有立足之地。然而也许他们的一些比较温和的观点也可以被采纳。"
 CAL_conditional_amnesty:0 "有条件赦免"
 CAL_try_the_minutemen:0 "审判一分钟人"
 CAL_court_populists:0 "取悦民粹选民"
 CAL_court_populists_desc:0 "自农民联盟以来，各类民粹主义就是我们两党制的最大威胁。虽然至上党必须受到惩罚，但我们不能忽视他们许多想法的吸引力，特别是美元货币和简单多数票选举。这些想法将被提交到国会进行表决，向至上党的前支持者们表明：我们听到了他们的呼声。"
 CAL_the_gi_bill:0 "《军人安置法》"
 CAL_the_gi_bill_desc:0 "我们应该为那些忠诚服务于国家和宪法的退伍军人予以奖励。我们正在考虑通过一项名为《军人安置法》（也经常被人叫做“大兵法案”）的法案。这项法案将为退伍军人的衣食住行提供保障，如果他们愿意的话，上学读书也不在话下。"
 CAL_political_traditionalism:0 "政治传统"
 CAL_political_traditionalism_desc:0 "民主党和共和党为这个国家服务了几十年。而最近极端主义政党的崛起向我们表明，我们不能容忍第三方站出来挑战我们的体制。我们必须尽最大努力进行宣传，以确保选民重新对传统的两党制产生信心。"
 CAL_democratic_education:0 "宪法教育"
 CAL_democratic_education_desc:0 "激进分子与民粹主义者经常宣称联邦政府是某种松散的“州权分立体制”，甚至搬出美国海军条例与“各州有权宣布脱离联邦”这样荒谬的漏洞来验证自己的观点。我们必须纠正他们的错误，使美国宪法具备尽可能广泛的普适性。"
 CAL_begin_reconstruction:0 "开始重建"
 CAL_begin_reconstruction_desc:0 "内战爆发前，这座国家便曾经历过无数苦难。战后重建是项无比艰巨的使命，也是统合全国交通网络的绝佳机遇。我们将推行更为大胆的经济方针振兴美国工业，使她重新立身于依然深处困境的世界之上。"
 CAL_rebuild_railroads:0 "重建铁路系统"
 CAL_rebuild_railroads_desc:0 "横贯全美的铁路系统目前处在混乱状态，战时主导的基建工程以旧线路改造为主，工程目的也多具临时性。美国国会日前批准项目草案，以强制建设电气化铁路为核心重建国家运输体系。电气化铁路工程又要求我们对输电网络实施有力改革。"
 CAL_electrification:0 "电气化项目"
 CAL_electrification_desc:0 "为适应电气化铁路普及需要，保障偏远地区的治安现状，最新批准的国家电气化项目将使输电线遍布全国各地。美国国会开始向各州政府提出投资变压站、兴办水力发电的期望，毕竟具体投资落实是他们的责任。"
 CAL_business_subsidies:0 "企业补贴"
 CAL_business_subsidies_desc:0 "美国小微企业在劳动力市场中的弱势地位，是引发普遍失业问题的重要原因。相关公司在经营过程中过分追求效益而忽视安全规章制度，导致产业工人大多不愿为他们提供服务。为缓解相关问题，美国国会已批准一项新联邦财政补贴计划，为小型企业提供更多援助。"
 CAL_rebuild_americas_industry:0 "振兴美国工业"
 CAL_rebuild_americas_industry_desc:0 "商品出口额是衡量经济活力的重要指标之一，尽管长期以来坚持自由放任主义贸易政策，大萧条时期的美国出口量仍然呈现下降态势。对此，我们必须投资第三产业为传统工企业提供服务性保障，减少它们的经营损失而提振出口额。"
 CAL_economic_investments:0 "经济投资"
 CAL_economic_investments_desc:0 "传统观点认为政府采购量与社会经济增长呈负相关，最新经济理论则反向指出政府可以通过适量采购刺激经济良性运转。国会遂以此为基准采纳一项大胆战略来振兴美国经济。"
 CAL_trial_of_american_companies:0 "对叛国企业的审判"
 CAL_trial_of_american_companies_desc:0 "国会正在听取叛国企业的证词。许多议员主张应让涉事公司高管辞职谢罪，更有甚者呼吁彻查企业界暗网。后者将动员舆论压力令政府依据决策责任向公司股东提起公诉。"
 CAL_esmwt:0 "工会的命运"
 CAL_esmwt_desc:0 "国会正在听取叛国工会的证词。许多议员主张应让工会主席团辞职谢罪，更有甚者呼吁对工会内部会议记录实施采集，为政府向激进分子提起公诉铺平道路。"
 CAL_rebuild_the_roads:0 "重建公路系统"
 CAL_rebuild_the_roads_desc:0 "国家投资建设的州际公路系统很容易成为战争中受破坏的对象。眼下我们必须与各州政府展开合作，确保全美范围内的商业活动与人口流通再度实现安全。"
 CAL_american_industry:0 "美国工业霸权"
 CAL_american_industry_desc:0 "战争爆发在短期内为重工业带来复兴的浪潮，但我们都清楚这种情况不能长久持续，更何况相关工业设施还是建立在战前破产企业之上的。我们必须对安全规章与管理制度作出有效改革，为实现经济的永久繁荣奠定基础。"
 CAL_rebuild_agriculture:0 "农业复兴"
 CAL_rebuild_agriculture_desc:0 "为输送与加工更多食品养活美国人民，我们必须鼓励农业科学进步与粮食储存技术创新。美国国会正式批准成立特别基金会来负责解决相关问题，数名政治家也将在项目中扮演重要角色。"
 CAL_aviation_industry:0 "航空工业"
 CAL_aviation_industry_desc:0 "美国民用航空领域曾一度领先世界，然而，德国先进的工业装配线系统已将我们远远甩在后面。美国国会正在就如何适当激励我国航空企业及军工承包商采用相关技术向国家情报机关提出咨询。"
 CAL_farming_subsidies:0 "农业补贴"
 CAL_farming_subsidies_desc:0 "我们有必要向农村提供补贴满足国家对农产品的高度需求，甚至为农民停止耕种当前不甚需要的经济作物（例如烟草）提供额外补偿。与此同时，有经验的农业工作者也应该被挽留下来。"
 CAL_maritime_industry:0 "海事产业"
 CAL_maritime_industry_desc:0 "美国商船队在内战时期遭受沉重打击，为此，国会决定批准法案将海军退伍军人福利加以衍生。此外，休工期间的现役水兵如果愿意为商船队提供服务，也能取得与退伍军人同等的优待。"
 CAL_synthetic_oil:0 "石油生产"
 CAL_synthetic_oil_desc:0 "美国中西部油田在内战期间惨遭焚毁，我们必须控制火势以免造成进一步损失。向合成油项目提供投资也是有利可图的，它将为我国汽车保有量增长提供稳定的燃料供应。"
 CAL_reconstruction_finished:0 "完成重建"
 CAL_reconstruction_finished_desc:0 "战争岁月与经济动乱的阴影并未从美国的记忆中远去，但它们带来的威胁总归是正在缓解的。"
 pacificstates.2.b:0 "海勒姆·约翰逊是这个职位的合适人选"
 pacificstates.2.c:0 "查尔斯·L·麦克纳里"
 pacificstates.2.e:0 "前州长C·C·扬"
 pacificstates.3.e:0 "查尔斯·A·斯普雷格！"
 pacificstates.3.f:0 "曼彻斯特·博迪！"
 pacificstates.4.g:0 "路易斯·B·迈耶"
 pacificstates.4.f:0 "弗兰克·诺克斯"
 pacificstates.5.c:0 "选择迪士尼"
 pacificstates.5.e:0 "维护加纳"
 pacificstates.6.f:0 "这下联邦党赢了！"
 pacificstates.6.g:0 "天啊，赫斯特真做到了！"
 pacificstates.6000.t:0 "民主共和党同进步党合流"
 pacificstates.6000.d:0 "随着我们的经济政策在改革派中越来越受欢迎，民主共和党已经并入进步党，以提高他们在多数派中获胜的机会。"
 pacificstates.6000.a:0 "很好"
 pacificstates.6002.t:0 "进步党同民主共和党合流"
 pacificstates.6002.d:0 "随着我们的经济政策在改革派中越来越受欢迎，进步党已经并入民主共和党，以提高他们在多数派中获胜的机会。"
 pacificstates.6002.a:0 "很好"
 pacificstates.6003.t:0 "民主党并入共和党"
 pacificstates.6003.d:0 "随着我们的经济政策在改革派中越来越受欢迎，民主党已经并入共和党，以提高他们在多数派中获胜的机会。"
 pacificstates.6003.a:0 "很好"
 pacificstates.6004.t:0 "共和党并入民主党"
 pacificstates.6004.d:0 "随着我们的经济政策在改革派中越来越受欢迎，共和党已经并入民主党，以提高他们在多数派中获胜的机会。"
 pacificstates.6004.a:0 "很好"
 pacificstates.6005.t:0 "进步党向联邦党靠拢"
 pacificstates.6005.d:0 "随着我们的经济政策在改革派中越来越受欢迎，进步党已经并入联邦党，以提高他们高票当选的机会。尽管一些进步人士对此有些不安，认为他们对农民抱有太大的敌意。"
 pacificstates.6005.a:0 "很好"
 pacificstates.6006.t:0 "两党制形成"
 pacificstates.6006.d.progs:0 "为了抵抗我们吸收民主党和共和党势力的行动，民主党和共和党已经同意在民主党的领导下合并政党，并越来越多地接纳国家民主党的前独立支持者。作为回应，联邦党支持者支持我们提高选举频率，使联邦党在国家一级无关紧要，回归两党制的主导地位，无论好坏。"
 pacificstates.6006.a:0 "很好"
 pacificstates.7.e:0 "亨利·华莱士！"
 pacificstates.9.e:0 "威廉·沃兹沃思·霍金森！"
 pacificstates.1000.t:0 "[GetYear]年联邦党大会"
 pacificstates.1000.a:0 "恭喜现任总统！"
 pacificstates.1000.b:0 "厄普顿·辛克莱"
 pacificstates.1000.c:0 "卡伯特·奥尔森"
 pacificstates.11.f:0 "[CALGetRadSocParty]！"
 pacificstates.12.e:0 "荷马·博恩"
 pacificstates.15.e:0 "威廉·诺兰"
 pacificstates.41.f:0 "无视中国……"
 pacificstates.42.t:0 "失去在华贸易特权"
 pacificstates.42.d:0 "随着东亚总局监事会的灭亡，我们与他们的贸易协定宣告无效。我们需要做些工作来收回成本。"
 pacificstates.42.a:0 "我的钱呢？没了？！"
 pacificstates.56.b:0 "高高举起，轻轻放下"
 pacificstates.65.b:0 "无可奉告"
 pacificstates.205.t:0 "正式宣布选举"
 pacificstates.205.d:0 "因政客与难民从国家的其他地方不断地涌入，并且其想要确保其作为美式民主领袖的合法性，太平洋国会已经正式通过立法，宣布在我们仍然控制的地区举行新的选举，以解决国会控制权的问题。由于国会目前因新党派间的争斗正陷入僵局，必须有一匹脱颖而出的黑马来治国理政，不然国会除了继续战斗之外就几乎无法达成任何共识。"
 pacificstates.205.a:0 "这挺有趣的"
 pacificstates.2050.t:0 "选战"
 pacificstates.2050.d:0 "随着距离大选还有两个月的时间，各政党都已让人印象深刻，共和党和民主党都因两党在维稳方面的失败以及内战期间在外交政策上的分歧而争执不休。近来新成立的民主共和党，是由那些已厌倦了党内保守风气的两党党内的自由派与改革派联合的产物。另一个涅槃重生的政党是进步党，它曾以各种形式存在着，但它现已吸收了大量的进步共和党人和各种社民党人入党。最激进的左翼政党是厄普顿·辛克莱的联邦党，实际上，这是1932年的终结加州贫困运动的更正式版本，其承诺在人们认为是“闲置”的土地和商业方面实行部分的计划经济，他们获得了民主党左翼和社会党右翼的支持。这一切使得共和党和民主党的政治坐标与过去相比更为保守，他们希望在掌权后稳定政局。"
 pacificstates.2050.a:0 "有点过火了"
 pacificstates.206.t:0 "总统驾临"
 pacificstates.206.:0 "因政客与难民从国家的其他地方不断地涌入，并且其想要确保其作为美式民主领袖的合法性，太平洋国会已经正式通过立法，宣布在我们仍然控制的地区举行新的选举，以解决国会控制权的问题。由于国会目前因新党派间的争斗正陷入僵局，必须有一匹脱颖而出的黑马来治国理政，不然国会除了继续战斗之外就几乎无法达成任何共识。"
 pacificstates.206.a:0 "这挺有趣的"
 pacificstates.207.t:0 "赫斯特竞选"
 pacificstates.207.d:0 "威廉·伦道夫·赫斯特在赫斯特城堡外发表演讲，宣布他将参加竞选，并要求太平洋国必须与麦克阿瑟将军达成停火协议。他承诺，在当选总统后，他将让麦克阿瑟履行下台的承诺，同时将通过他的国家民主党下的国家资助计划，扫清太平洋国的犯罪、工团主义和失业现象。"
 pacificstates.207.a:0 "荒谬"
 pacificstates.208.t:0 "至上党和进步党团结一致"
 pacificstates.208.d:0 "进步党似乎已经吸收了太平洋国当地的美利坚至上党组织，并呼吁在战争中与休伊·朗进行更密切的合作，并呼吁在美国大部分地区重归统一后举行新的总统选举，这无疑是为了进一步拉拢朗和太平洋国境内的进步人士。朗本人赞扬该党秉持的美国主义和其帮助普通人的愿望，并呼吁分享财富协会援助这些进步人士。"
 pacificstates.208.a:0 "卑鄙无耻"
 pacificstates.209.t:0 "明星站台"
 pacificstates.209.d:0 "因选举的高风险和他们在太平洋国极大的影响力，名人开始为各候选人助选，汉弗莱·鲍嘉和凯瑟琳·赫本团结在进步党旗下，为其在广播做广告，而查理·卓别林着全心全意地支持联邦党，而厄普顿·辛克莱站在他身后，一脸容光焕发。与此同时，因在热门影片《歌唱的雏菊》中担任主角而闻名的职业牛仔约翰·韦恩在接受采访时表示，他支持民主党，不过他也表示自己并不太反对赫斯特的观点。亨利·方达则支持民主共和党，而玛丽·德雷斯勒被问到为什么戏说“截然不同的人是最好的伴侣”时也是这么回答的。但最终许多的明星，如金格尔·罗杰斯、迪克·鲍威尔和最闻名的克拉克·盖博都坚持了一直以来好莱坞支持的政党——共和党，给他们带来了急需的支持，尽管还有如海达·霍普在内的少数人已转投更保守的民主党，但他们对两个主流的保守党派来说都是雪中送炭。"
 pacificstates.209.a:0 "搞不好开了个坏头？"
 pacificstates.210.t:0 "赫斯特的恐怖故事"
 pacificstates.210.d:0 "威廉姆斯·伦道夫·赫斯特，一个因人见人厌而出名的人，一直在利用他掌握的报刊业来驱使人们仍然认为他是唯一可行的选择。每天他旗下的报纸一定会刊登在与麦克阿瑟间的战争中的死亡人数——但相关专家认为这数字水分有些大，而赫斯特承诺要结束这场战争，此外，他还着重报道那些有关于本地犯罪、无法无天的赤匪和黑帮，加拿大和日本境外势力的干涉的事情，以及最荒谬的，关于其他党派通谋工团的谣言。"
 pacificstates.210.a:0 "去他妈的黄色新闻"
 pacificstates.211.t:0 "新自由主义之诺"
 pacificstates.211.d:0 "自由党，其正式名称为民主共和党，已经做出了他们的承诺，他们将为美国人民提供一个更公正的法律环境，以保证不再孕育出导致内战的动荡环境。他们还承诺将对银行、医疗、社会和工作保障制度等进行改革。但他们受到了来自左右两派的抨击，进步党和联邦党称他们的改革是“不彻底的”，只会浪费纳税人的钱，成效还不大，而各右翼政党则嘲笑他们向选民承诺让他们住进空中楼阁，还要同时保持预算平衡。"
 pacificstates.211.a:0 "他们毫无机会"
 pacificstates.214.t:0 "与麦克阿瑟停火"
 pacificstates.214.d:0 "在他当选后，赫斯特立即呼吁与麦克阿瑟停火，这在太平洋国的大多数公民中大受欢迎，因为士兵要么渴望回家，要么只想干些不太危险的活。不出所料，麦克阿瑟赞扬了这一举动，并称赫斯特是一个将国家从社会主义和邦联分子手中拯救回来的热血美国人。尽管据报道，西部军在没有征求其意见的情况下就代表他接受了赫斯特的请求。然而，休伊·朗却指责赫斯特与社会主义者和旧民主党人一样，是暴君、懦夫和“软脚富家翁”。"
 pacificstates.214.a:0 "那个油炸笨蛋马上就会消失的"
 pacificstates.214.b:0 "他说啥了？援助西部军！"
 pacificstates.215.t:0 "为美国而前进"
 pacificstates.215.d:0 "随着麦克阿瑟赢得了战争，我们必须尝试合并联邦政府，并让他们承认赫斯特是一位民主选举的总统，因其在国家最需要的时候挺身而出。不过，一些赫斯特的忠实拥护者坚持认为，如果我们老老实实地待在西边，让麦克阿瑟来处理美国的烂摊子，对我们来说可能更好些，尽管实际上，那些雄心勃勃的人显然不太能苟同这一观点。"
 pacificstates.215.a:0 "为美国而前进"
 pacificstates.215.b:0 "我们现在是太平洋国了"
 pacificstates.216.t:0 "赫斯特要合并我们"
 pacificstates.216.d:0 "赫斯特对麦克阿瑟的胜利表示祝贺，认为麦克阿瑟是在联邦主义思想下唯一能同其逐鹿总统之位的人，并指出现在是赫斯特担任美国总统的时候了，他向麦克阿瑟保证他将因对美国的忠诚而得到回报。"
 pacificstates.216.a:0 "彳亍"
 pacificstates.216.b:0 "不，是我们要合并他们"
 pacificstates.2160.t:0 "麦克阿瑟同意了"
 pacificstates.2160.d:0 "麦克阿瑟将军已经接受了我们的提议，因此威廉·伦道夫·赫斯特现已是美国的总统，以他认为合适的方式监督重建过程。当然，也会有序的回报联邦军队的贡献。"
 pacificstates.2160.a:0 "举杯相庆！"
 pacificstates.217.t:0 "报纸攻击“赫斯特主义”"
 pacificstates.217.d:0 "报纸都在攻击赫斯特担任总统是德不配位。特别值得注意的是，与共和党结盟的《洛杉矶时报》谴责赫斯特“腐败、贪食、无能”，连进步派报纸也跃跃而起，称赫斯特是“美国保皇党”和“德皇青春版”。从各个方面来看，他都被攻击为一个背叛了太平洋国保卫民主的初心的独夫民贼，这让赫斯特大为震惊，他通过旗下的媒体帝国回击了这些报纸。"
 pacificstates.217.a:0 "叛徒！"
 pacificstates.218.t:0 "时报的命运"
 pacificstates.218.d:0 "毫无疑问，《洛杉矶时报》以其一贯的对共和党的忠诚发表了批评文章。然而，他们的老板哈里·钱德勒十分聪明地认识到，媒体舆论的涛涛巨浪将不可避免地涌向《洛杉矶时报》，尽管他忠心于报纸，但事实证明，他比大多数共和党人都更右些。他提出要改变该日报的叙事角度，同赫斯特一起保护国家不受潜在的自由之敌的威胁。"
 pacificstates.218.a:0 "做点交易就行了嘛……"
 pacificstates.218.b:0 "太迟啦"
 pacificstates.219.t:0 "暂停人身保护令"
 pacificstates.219.d:0 "随着赫斯特被反政府人士的口水淹没，是时候宣布进入紧急状态了，暂停人身保护令以及选举，直到其他党派的忠诚问题得到解决。当然，有些人大骂政府不演了，想直接搞独裁。但如果赫斯特想要为人民做的事迫使他成为一个独裁者，那么这就是基于杰斐逊式民主的独裁！只为一个为最广大人民谋利益的政府！"
 pacificstates.219.a:0 "就这样吧"
 pacificstates.219.b:0 "马上搞定共和党"
 pacificstates.221.t:0 "赫斯特的债务"
 pacificstates.221.d:0 "财政部已经提醒我们，总统的消费习惯已经导致了轻微的财政负担。但由于赫斯特不愿意降低其开支，我们将不得不寻求其他收入来源来支付这一笔费用。"
 pacificstates.221.a:0 "这是必要消费！"
 pacificstates.222.t:0 "灵性论运动支持赫斯特"
 pacificstates.222.d:0 "灵性论运动是一个立场模糊的右翼党派，各种与阴谋主义和非正统宗教信仰有关的边缘组织，以及其他有利可图的新信仰都包括在内。该党由爱德华·朗斯特里特·博丹领导，但由于他太过激进，无法赢得选举，他最终选择支持威廉·伦道夫·赫斯特，承诺保护赫斯特不受工会间谍的伤害，并赞扬他的反英立场。赫斯特对这种姿态表示赞赏，但不敢太公开地表示感谢。"
 pacificstates.222.a:0 "真是怪人"
 pacificstates.223.t:0 "反工团主义组织"
 pacificstates.223.d:0 "由于坦尼委员会的打击目标是极左分子，各种义警组织都感到受到鼓舞而采取了同样的行动，特别是在委员会成员就“公民保护自己的权利免受不信神的工团主义者侵害”做出了积极的评论之后。这包括邻里守望组织、本土主义组织，甚至一些没有加入宪政国的地方三K党分会。然而，这些团体中最积极的是灵性论运动党，他们给了政府一份可能的联合工团间谍名单，并表示如果得到在资金上的支持并共享情报，他们将进一步收集情报。"
 pacificstates.223.a:0 "支持他们"
 pacificstates.223.b:0 "自己动手，丰衣足食"
 pacificstates.225.t:0 "阻止日裔移民"
 pacificstates.225.d:0 "日本是太平洋国的心腹大患，一旦有机可乘，日本很可能就会占领太平洋地区。我们真的能相信日本移民不忠于他们从前的政府吗？杰克·坦尼不这么认为，他提出了一项改革移民法案的提案，禁止所有来自日本的移民。当然，一些实业家对此持反对意见，但国家民主党，特别是国会议员詹姆斯·B·艾泰，强烈地支持这一项改革。"
 pacificstates.225.a:0 "当然"
 pacificstates.225.b:0 "稍作限制即可"
 pacificstates.226.t:0 "调查共和党"
 pacificstates.226.d:0 "随着联邦党的垮台，因赫斯特的国家主义主张和其对麦克阿瑟主义的同情，共和党已成为他最积极的反对派。由于这一点，共和党领导层要为其在对战争中浪费国库和干扰国家稳定以及其他发内战财的行为受到公开调查。他们同样受到与前共和党内部的“激进”进步派密谋的指控，他们正是导致我们和麦克阿瑟政府发生冲突的罪魁祸首，还在赫伯特·胡佛领导时期推动了工团政党的合法化。\n\n霍华德·休斯是第一位被要求为自己迷惑政府继续战争、同时采购他的产品的行为作辩护的共和党工业巨头。然而，当休斯反问他的审讯官杰克·坦尼时，公众舆论便一触即发，他质问坦尼是否在明知赫斯特现已是公务人员的前提下，仍帮助他垄断了报业，同样，他指责赫斯特和包括坦尼和约翰·安德森在内的手下，代表贝瑟尔公司在加州的附属机构进行游说，以便在美洲大陆发生战争的情况下，大搞造船合同。这让坦尼很难堪，没办法抹黑休斯，因为休斯会大大方方承认担任过说客，但他同时也会说，这只是一种常见的做法罢了，而且他不像赫斯特和坦尼这两个虚伪到不行的伪君子，他从不为自己不相信的事业忽悠别人。"
 pacificstates.226.a:0 "这可不在计划之内"
 pacificstates.227.t:0 "反对派被激怒"
 pacificstates.227.d:0 "联邦党、进步党、共和党和民主党因赫斯特明显的查禁反对党的企图和对休斯进行的灾难性审判而东山再起。他们不仅联合起来成立了所谓的“自由联盟”来阻止他的政策落地，而且抗议活动正在太平洋国愈演愈烈，包括在有可能的情况下试图罢免与赫斯特结盟的政客。"
 pacificstates.227.a:0 "一帮美国国贼！"
 pacificstates.228.t:0 "抗议活动风起云涌"
 pacificstates.228.d:0 "抗议活动已经失控，旧金山爆发了骚乱，抗议者的目标是被迫撤退的联邦警察。军方在首都待命，德威特将军声称，如果他现在能够派出军队，他就能镇压暴乱分子。然而，在赫斯特要不要这样干的时候，阿诺德将军和他的军官们报告称，城市里的骚乱将会愈演愈烈，并建议让一个排负责他的保卫工作，以维持秩序，赫斯特可以派遣联邦警察与德维特一起支援他。我们该怎么办？"
 pacificstates.228.a:0 "派德威特和大部队去旧金山，让联邦警察留守原地"
 pacificstates.228.b:0 "让德威特和联邦警察一起去旧金山，让阿诺德留在首都"
 pacificstates.229.t:0 "军事政变"
 pacificstates.229.d:0 "当阿诺德和德维特在旧金山维持秩序时，联邦警察却和“哈普”阿诺德将军的手下擦枪走火。看来，我们的军队中有一部分人对赫斯特担任总统一职不太满意，因为一群军官正试图冲击赫斯特城堡！我们可以阻止他们，希望德维特能救救我们，但这有可能会害死我们所有人。我们该怎么办？"
 pacificstates.229.a:0 "我投降！"
 pacificstates.229.b:0 "拖住他们，你们这些懦夫！"
 pacificstates.230.t:0 "抗议之火渐熄"
 pacificstates.230.d:0 "德威特的部队似乎成功地弹压了抗议者，但尽管如此，他仍在驻守该地区以维持目前的秩序。尽管如此，至少有三人在冲突中丧生，在赫斯特的报纸能够恰当地解释总统是如何从危险的激进分子手中拯救了国家，而这些激进分子正阴谋将国家交给赤匪，并会杀害每一个不赞同他们的男人、女人和孩子之前，这还远远算不上公关成功。"
 pacificstates.230.a:0 "千钧一发！"
 pacificstates.2301.t:0 "联邦警察把他们赶了回去"
 pacificstates.2301.d:0 "联邦警察成功地阻拦了那些篡位者。德威特听到了政变的风声，但在他和他的人到来之前，篡位者便已溃不成军了。大多数密谋者都已被逮捕，但米切尔将军已乘飞机逃亡加拿大。看来赫斯特已经度过了他最艰难的时刻。"
 pacificstates.2301.a:0 "该清算叛徒了"
 pacificstates.231.t:0 "反对派的末日"
 pacificstates.231.d:0 "那些被认为与针对赫斯特的阴谋有关的人受到了国家民主党的严厉谴责，整个自由联盟在实际上都成为了被针对的对象，他们现在要么被迫接受调查，要么被迫辞职。共和党的一些重要成员正在逃往加拿大或新英格兰，而其他人则在跑到休伊·朗那里避难。随着马歇尔将军同协约国私通的谣言被传的沸沸扬扬，他也同样飞往了协约国。威廉·伦道夫·赫斯特现在是真正的美国第一公民了。"
 pacificstates.231.a:0 "大功告成"
 pacificstates.232.t:0 "联邦支票"
 pacificstates.232.d:0 "我们的军队正经受一次大规模的内肃，许多军官被德维特的人或联邦警察所取代。当然，资金短缺仍困扰着我们，这让德威特和坦尼要求给予资金和短期汇票来满足我们的开支。这大概是必要之恶吧。"
 pacificstates.232.a:0 "准了"
 pacificstates.232.b:0 "至少不应该……"
 pacificstates.234.t:0 "辛克莱受审"
 pacificstates.234.d:0 "在对工团组织进行了一系列突击检查后，联邦党成员厄普顿·辛克莱终于于今天受审。虽然他否认自己是一个工团主义者，并表示他反对推翻宪法的行为，但他却不能否认他与左翼革命派有千丝万缕的联系，而且这种联系是否持续到今日也有可能。之后，他却反过来谴责委员会的“独裁主义”，这一说法似乎引起了联邦党出版物的共鸣。尽管如此，联邦党还是受到了重大的打击。"
 pacificstates.234.a:0 "挺好的，我想"
 pacificstates.235.t:0 "科恩毙命"
 pacificstates.235.d:0 "盘踞在洛杉矶的黑手党首领米奇·科恩和他绰号为“卡波斯”的头目，今天在联邦警察手中被行刑队处决。军事法庭判定他犯有敲诈、勒索、袭击、贩毒、反政府密谋和谋杀等众多罪行。各活动人士（尤其是美利坚公民自由联盟）对死刑的判决感到愤怒，他们抗议使用军事法庭判决，以及判决过程的匆忙，也不允许犯人上诉，他们认为这侵犯了公民的宪法权利。赫斯特谴责这种反对是懦弱无能的，他的话引起了人们的共鸣，因为人们已经厌倦了被罪犯困扰的感觉。"
 pacificstates.235.a:0 "对恶魔来说，法律即是恶魔"
 pacificstates.236.t:0 "酒精法"
 pacificstates.236.d:0 "我们做了很久以前就应该做的事情，即将酒精纳入国家控制之下。我们终于可以通过质量和数量上的控制来解决当前的酒精问题，并为国家带来所需的收入。现在的问题是联邦应当制订一个合法饮酒年龄，因为这正是其职权所在。"
 pacificstates.236.a:0 "和各州保持一致，21岁就能喝了"
 pacificstates.236.b:0 "18岁就行，合理"
 pacificstates.236.c:0 "16岁，美国人知道他们想要啥！"
 pacificstates.237.t:0 "石油与电力的命运"
 pacificstates.237.d:0 "随着政府不断强化对自然资源的控制，壳牌和爱迪生的所有者来拜访我们，要求我们和他们谈判，并允许他们在政府保护下管理这些公司，作为回报，他们将为各社区提供廉价的商品。他们指出，如果有成规模的经济基础，他们可以将成本压到远低于竞争对手的水平。虽然这样，他们将成为事实上的垄断企业，但在其中拥有一席之地并且能分一杯羹的想法确实很诱人，因为我们既能让公民获得更便宜的商品，而又不必直接管理这些行业。"
 pacificstates.237.a:0 "行，整一个利于大众的垄断企业"
 pacificstates.237.b:0 "主意不错，但政府将会直接管理它"
 pacificstates.238.t:0 "扩建赫斯特城堡"
 pacificstates.238.d:0 "赫斯特宣布赫斯特城堡是加州的文化之都，并决定扩建该城堡。他购买了110英亩的土地用于城堡的扩建，还决定从欧洲进口一批艺术品，并邀请当地的雕塑家来装饰这座位于加州的宏伟建筑。不过有人想知道他们应该专注于哪种类型的设计……"
 pacificstates.238.a:0 "大理石"
 pacificstates.238.b:0 "青铜"
 pacificstates.239.t:0 "边境袭击！"
 pacificstates.239.d:0 "太平洋国一直在劫掠着我国边境地区，要求当地人为之前袭扰美国边境的行为和太平洋国的“保护”交钱。如果当地人拒不交钱时，他们就直接把村庄里的一切都带走。并且涉嫌参与过去对美国边境突袭的土匪已被其带走，要他们为从前的行为赎罪。这可能会引发战争，但与这些西部佬打仗可能有点难搞，也许警告他们一下就足够了？"
 pacificstates.239.a:0 "悬崖勒马，警告他们"
 pacificstates.239.b:0 "打吧！"
 pacificstates.2390.t:0 "墨西哥的警告"
 pacificstates.2390.d:0 "墨西哥通过他们的大使向我们传达了信息，称我们的行为无异于入室盗窃。他们要我们停止所有在边境的活动，尽管我们只是想要夺回我们曾经的领土！不过我们也捞到够还债的钱了，或许应该别再去碰运气了？"
 pacificstates.2390.a:0 "他们已经得到了教训"
 pacificstates.2390.b:0 "吓我们是吧？先发制人！"
 pacificstates.240.t:0 "赫斯特的要求"
 pacificstates.240.d:0 "美利坚太平洋合众国官方，或者实际上，它的总统威廉·伦道夫·赫斯特本人向我们发出了“请求援助”的要求，声称我们正在从其反工团主义立场和默许我们在边境的存在中获益，但却什么都不给他们。真他妈好笑，这不就是在明抢嘛？但我们有更大的事要处理，给他点钱也无妨？与其达成互不侵犯条约就能让我们向东加拿大部派遣军队。"
 pacificstates.240.a:0 "满足这个傻逼"
 pacificstates.240.b:0 "不得"
 pacificstates.2400.t:0 "赫斯特的要求"
 pacificstates.2400.d:0 "美利坚太平洋合众国官方，或者实际上，它的总统威廉·伦道夫·赫斯特本人向我们发出了“请求援助”的要求，声称我们正在从其反工团主义立场和默许我们在边境的存在中获益，但却什么都不给他们。真他妈好笑，这不就是在明抢嘛？但我们有更大的事要处理，给他点钱也无妨？与其达成互不侵犯条约就能让我们向东加拿大部派遣军队。"
 pacificstates.2400.a:0 "满足这个傻逼"
 pacificstates.2400.b:0 "不得"
 pacificstates.2410.t:0 "加拿大满足了我们的要求"
 pacificstates.2410.d:0 "加拿大已经满足了我们的要求，尽管他们明确地对外宣布，这只是对有需要的国家的一揽子援助。这将为我们提供偿还债务所需的资金，以及让我们能够供养一支更大规模的军队。"
 pacificstates.2410.a:0 "很好"
 pacificstates.2410.b:0 "得让人人都知道他们屈服了"
 pacificstates.241.t:0 "加拿大拒绝我们的要求"
 pacificstates.241.d:0 "英国王室拒绝了我们的要求！尽管我们充当了反对工团主义的堡垒，这帮势利眼的保皇派分子还是看不起我们！然而，他们强大的军事力量让我们除谴责外无能为力。我们将等待一个时机来让他们明白，可不要看轻了我们。"
 pacificstates.241.a:0 "不管他们了"
 pacificstates.241.b:0 "谴责他们"
 pacificstates.241.c:0 "马上进攻"
 pacificstates.242.t:0 "开放自然保护区采矿"
 pacificstates.242.d:0 "我们终于充分利用了西方的经济资源用于发展。然而，尽管我们需要各种资源，但公园官员和活动人士请求我们放黄石国家公园一马，他们称黄石为国家的文化基石。"
 pacificstates.242.a:0 "出于采矿目的而开放"
 pacificstates.242.b:0 "行吧"
 pacificstates.243.t:0 "收复夏威夷"
 pacificstates.243.d:0 "终于，我们控制了桀骜不驯的夏威夷州并把它纳入了西部的怀抱。有了当地遍地的甘蔗种植园，我们就能为政府带来更多的收入，尽管我们或许应该向他们最富有的人征税，作为对他们先前不忠的惩罚？"
 pacificstates.243.a:0 "向他们征税"
 pacificstates.243.b:0 "我们得到了想要的"
 pacificstates.244.t:0 "债务控制"
 pacificstates.244.d:0 "由于总统的创新理念，所谓的“赫斯特债务”终于得到了控制。我们所处的时代正被称为“新繁荣时代”。"
 pacificstates.244.a:0 "上帝保佑西方"
 pacificstates.245.t:0 "针对赫斯特的军事政变"
 pacificstates.245.d:0 "威廉·伦道夫·赫斯特，太平洋国总统，已被阿诺德将军的军队逮捕并罢免，阿诺德将军向抗议者宣布赫斯特是独夫民贼。人们认为，马歇尔将军默许了政变的发生，并确保了阿诺德作为国家元首的地位，直到他最终在国会发表讲话。"
 pacificstates.245.a:0 "又回到最初的起点！"
 pacificstates.246.t:0 "联邦警察逃之夭夭！"
 pacificstates.246.d:0 "宁死不屈的联邦警察被赶出西部，他们逃往东部以免被捕或死亡。虽然这有助于巩固我们的统治，但我们也损失了一些人力。"
 pacificstates.246.a:0 "他们的暴政终于结束了"
 pacificstates.247.t:0 "麦克阿瑟的要求"
 pacificstates.247.d:0 "麦克阿瑟对他的盟友赫斯特被处理感到愤怒，他呼吁我们释放被逮捕的国家民主党人，并将他们移交给联邦政府，并重申我们间的互不侵犯协定。很明显，他认为我们没有合法性，但我们也不觉得他有能力阻止我们。现在我们该怎么办？"
 pacificstates.247.a:0 "暂且同意"
 pacificstates.247.b:0 "不"
 pacificstates.248.t:0 "为加州而作的演讲"
 pacificstates.248.:0 "当阿诺德将军准备向全国发表演讲时，马歇尔将军和他们的顾问们在思考是否有一种方法可以在避免参与美国内战的同时稳定国家。有一种观点被专栏作家和积极人士所嘲笑，即太平洋合众国通过成为一个独立的国家以远离东方的“暴君”。作为这个国家最有影响力的人，他们可以很容易地在演讲中加入这样的观点，并引导国会的舆论风向，但部分人认为，我们不应该放弃对东部的宣称。"
 pacificstates.248.a:0 "宣布我们要夺回西部"
 pacificstates.248.b:0 "我们现在是太平洋国了"
 pacificstates.249.t:0 "重开国会"
 pacificstates.249.d:0 "随着国会的重开，现在我们又可以召开选举了。军方面临的问题是，考虑到现政府的跨党派背景，我们是否应该提名自己。马歇尔的助手们考虑过让他代表民主共和党竞选总统。"
 pacificstates.249.a:0 "行，我会参与竞选"
 pacificstates.249.b:0 "不，军政之间必须界限分明"
 pacificstates.2490.t:0 "提前选举的结果"
 pacificstates.2490.d:0 "尽管联邦党在赫斯特的镇压后没有足够的力量参与竞选，但提前选举的结果终将落在中产阶级政党和太平洋国的老牌政党之间，这似乎并没有让军方和国会感到不安。"
 pacificstates.2490.a:0 "乔治·马歇尔"
 pacificstates.2490.b:0 "海勒姆·约翰逊的进步党"
 pacificstates.2490.c:0 "霍华德·休斯的共和党"
 pacificstates.2490.e:0 "查尔斯·斯普拉格的民主共和党"
 pacificstates.2490.f:0 "亨利·J·凯泽的民主党"
 pacificstates.250.t:0 "兰德"
 pacificstates.250.d:0 "阿诺德将军一直追求着技术的进步，他与马歇尔将军合作成立了一个新的研发部门，该部门不仅致力于推进先进军事武器的研究，还专注为我们制定的政策收集数据。但目前兰德应该最关注哪一方面呢？"
 pacificstates.250.a:0 "专注军品"
 pacificstates.250.b:0 "服务政府政策"
 pacificstates.251.t:0 "迪士尼接受任命"
 pacificstates.251.d:0 "华特·迪士尼已经接受将他作为民主党候选人提名。在他的公开声明中，他表示，他将试图弥合美国的政治分歧，并以美国道德观和负责任的治理给这个国家带来急需的稳定。这对过去几个月以来一直饱受分裂之苦的民主党来说是一种解脱。"
 pacificstates.251.a:0 "我们得救了！"
 pacificstates.252.t:0 "福利改革"
 pacificstates.252.d:0 "我们终于有了改善州和地方福利水平的政治资本，这能让穷人们的行为更加端正。在威尔逊和帕尔默时代，福利制度在州一级有了小规模的发展，现行的福利制度为生活在贫困线以下的人提供了少量的福利，特别是单身母亲。我们可以要求工作成为领取福利的必要前提，或者干脆让福利只被这些母亲独享。这些改革将鼓励民众树立职业道德，同时为最需要的人保留所需资金。"
 pacificstates.252.a:0 "强化工作要求"
 pacificstates.252.b:0 "强化范围限定"
 pacificstates.253.t:0 "解雇左翼民主党人"
 pacificstates.253.d:0 "左翼民主党人最近大规模被政府解雇，因为他们与极左事业有说不清的联系，而且其中一些人拒绝进行忠诚宣誓。这自然引发了强烈反弹，左翼人士和公民自由活动人士纷纷指责政府的威权主义。然而，在我们党内，大家都认为这将减少能为工团势力提供的可乘之机。"
 pacificstates.253.a:0 "让我们回想一下……"
 pacificstates.253.b:0 "为左壬难过？才不要。"
 pacificstates.254.t:0 "争夺补助金"
 pacificstates.254.d:0 "由于我们的政策集中在有利于商业的方面上，许多游说团体正要求政府的拨款。海事委员会希望这些拨款主要用于本地的造船厂，特别是位于洛杉矶的加州造船公司和恺撒造船厂，这将增加我们的贸易吞吐量，并利于军事舰艇的建造。然而，小微企业联盟得到了民间更广泛的支持，他们正在请求政府的支持，以帮助他们生产消费品和创造就业机会。最后是汽车工业，特别是正扼苦受难的莫兰德汽车卡车公司，他们希望加州能提高对汽车的依赖程度。根据我们的平衡预算政策，只有一个人能得到拨款，但花落谁家呢？"
 pacificstates.254.a:0 "造船厂"
 pacificstates.254.b:0 "小微企业"
 pacificstates.254.c:0 "汽车工业"
 pacificstates.255.t:0 "向死而教：癫狂赤匪"
 pacificstates.255.d:0 "迪士尼的一部新电影正在影院上映，它在支持政府的同时，也打击了工团主义的声誉。这部电影以一种极端负面的视角展示了联合工团的生活，把他们描绘成只会向年轻人灌输革命理想，还要确保没有任何“反动的”育儿过程。在教育了孩子们资本主义的“罪恶”之后，他们在极其年幼的时候就被送去参加战争，成为工团主义事业的炮灰。尽管联合工团谴责其为谎言，但它将工团主义表现为冷血好战的形象的行为受到了批评人士的赞扬。"
 pacificstates.255.a:0 "好啊！"
 pacificstates.255.b:0 "要在学校放映"
 pacificstates.256.t:0 "鸭子突击队大战三K党"
 pacificstates.256.d:0 "迪士尼的新作回归初心，是一部子供向的动画短片，仅以牺牲美利坚宪政国的形象为代价。故事开始时，唐老鸭滑稽地在佛罗里达北部降落，并且差点被短吻鳄吃掉。然后，他继续躲避三K党狙击手的追杀（显然是典型的南佬），然后意外地摧毁了敌人的海军基地。"
 pacificstates.256.a:0 "笑死个人！"
 pacificstates.256.b:0 "让孩子们免费观影！"
 pacificstates.257.t:0 "首长之脸"
 pacificstates.257.d:0 "一部基于麦克阿瑟将军的形象的迪士尼新电影已上映！一开始唐老鸭在狂热的联邦主义支持者的游行中醒来，然后被迫去为他们制造武器。它嘲笑麦克阿瑟的独裁主义、对民主的所谓维护和军国主义。在结尾，唐纳德从噩梦中醒来，感谢上帝，他住在太平洋合众国的旧金山。"
 pacificstates.257.a:0 "棒极了！"
 pacificstates.257.b:0 "专为合家欢而作！"
 pacificstates.258.t:0 "协约国送来货物"
 pacificstates.258.d:0 "加拿大喜欢我们的亲协约国立场和坚定反对工团主义的民主立场。因此，这帮自由主义者帮助我们也就不足为奇了。当然，一些愤世嫉俗者认为他们只是在两面下注，可能还在暗中帮助其他人，但我们无论如何都不会忘记加拿大人的大恩大德的。"
 pacificstates.258.a:0 "为民主！"
 pacificstates.259.t:0 "漫画道德管理局"
 pacificstates.259.d:0 "随着我们反对不道德行为的运动蓬勃开展，漫画行业成立了漫画准则管理局，以规制构成现代娱乐的许多“淫秽”内容。该局会禁止漫画中的亵渎、色情、淫秽、诱惑、粗俗、裸体、恐怖、过度流血、血腥或残酷罪行、堕落、欲望、施虐、受虐、行尸走肉、酷刑、吸血鬼、食尸鬼、食人、狼人、对罪犯的正面描述、对权威人物的负面展示等内容。他们还禁止在标题中使用“惊悚”和“恐怖”等词，这遭到了部分人的指责，称这是约翰·戈德华特和阿尔奇漫画公司的人试图独霸市场，因为阿尔奇漫画公司是漫画道德管理局的主要靠山。尽管如此，这是对不道德行为的反击，虽然漫画准则管理局不是官方机构，但任何不遵守规则的漫画都不会得到其认证。"
 pacificstates.259.a:0 "很好"
 pacificstates.260.t:0 "大学拒绝支持不道德行为"
 pacificstates.260.d:0 "我国的大学越来越排斥刊登那些被贴上“危险”或反社会标签的作品。含有马克思主义、极左思想、“攻击性”和“反美”言论的著作在大学和图书馆中越来越罕见，加州大学伯克利分校等大学已经同意将利弗林法案在自己的大学应用，这将有效地禁止共产主义者和工团主义者在校中任教。"
 pacificstates.260.a:0 "有进步的发展"
 pacificstates.261.t:0 "清洁生活工业联盟"
 pacificstates.261.d:0 "清洁生活工业联盟是一个商人团体，主要的成员来自扶轮社，他们完全同意我们政府的政策。他们会给有社会责任感的工人额外的金钱和福利，同时威胁惩罚那些对社会不负责任的人，“不负责任”的范围包括从遗弃儿童到吸毒在内。虽然他们为员工提供的额外福利很受欢迎，但一些人仍对企业领袖影响员工生活的做法持异议，但毫无疑问，这将带来积极的社会效应。"
 pacificstates.261.a:0 "大好事"
 pacificstates.263.t:0 "哈里·布里奇斯被捕"
 pacificstates.263.d:0 "太平洋地区的工会领袖哈里·布里奇斯今天被捕，因他出生在澳大利亚，他可能会被驱逐出境。虽然我们已经成功捕获了许多在灰色地带活动的工会领袖，但布里奇斯被捕还是很有意义的，因为他完全支持联合工团，并且是一个高效的组织者，因此他的被捕将会扰乱工会活动。"
 pacificstates.263.a:0 "很好"
 pacificstates.264.t:0 "辩护律师遇袭"
 pacificstates.264.d:0 "最近几天，多名被指派为工团主义者被告作辩护的律师遭到了袭击，这些被告被控为联合工团从事间谍活动或暗中破坏国家安全。其中一名律师的家中甚至发生了枪击事件，还有许多人收到了威胁邮件，要他们“注意安全”。也许我们应该派警察保护他们？"
 pacificstates.264.a:0 "保护他们"
 pacificstates.264.b:0 "剩下的案子交由军方处理"
 pacificstates.266.t:0 "社会卫生学是不是太过分了？"
 pacificstates.266.d:0 "公众一片哗然！显然，一名记者暗中调查了精神病院的状况，一般来说，反社会或精神状况不佳的妇女都将被送到那里，结果，被人们所知晓的可怕的故事中声称，那里的许多妇女只是违反了法律，但精神仍然健全。越来越多荒诞的都市传说都开始基于这一题材创作。我们该怎么办？"
 pacificstates.266.a:0 "调查这些机构"
 pacificstates.266.b:0 "提高人们被送到这些地方的门槛"
 pacificstates.266.c:0 "他们有罪，有什么问题？"
 pacificstates.269.t:0 "好莱坞十人组"
 pacificstates.269.d:0 "长期以来，好莱坞一直被怀疑收留了一些工团支持者，这些人试图利用现代媒体暗中传递他们阴险的信息。随着《视相》等媒体公开了与世界产业工人联盟及其同盟有联系的好莱坞编剧和导演名单，并展开了相关的法律调查，这已证据确凿。现在，其中10名被调查人员因拒绝回答国会议员的问题被判藐视法庭，这些人已经被称为“好莱坞十人组”。"
 pacificstates.269.a:0 "赤匪"
 pacificstates.270.t:0 "好莱坞黑名单"
 pacificstates.270.d:0 "好莱坞中的左翼影响力已被大幅削弱，许多高管认为这证实了罢工者和其他不守纪律的工人都是工团主义者的走狗。因此，美国电影协会成立了捍卫美国理想联盟，以调查极端主义对好莱坞的影响。那些因同情极端势力而被揭露的人，包括超级巨星查理·卓别林在内，都已被列入了“黑名单”，几乎被排除在影视业之外。当然，一些人认为这是对我们理想的“背叛”，并呼吁我们不应在官方上支持这种行为。"
 pacificstates.270.a:0 "为黑名单撑腰"
 pacificstates.270.b:0 "谴责黑名单"
 pacificstates.270.c:0 "保持沉默"
 pacificstates.271.t:0 "海氏准则激起激烈反应"
 pacificstates.271.d:0 "海氏准则引起了自由派活动人士的反对声浪，他们称政府为“假正经、伪君子”，最近还有人发表了文章，嘲笑我们是不是想取缔所有电影。也许我们应该和美国电影协会谈谈，稍微放松一下相关规则，尽管体面军团和海氏准则的制定者约瑟夫·布林会强烈反对我们做出这样的决定。"
 pacificstates.271.a:0 "和他们谈谈"
 pacificstates.271.b:0 "不，守则将保持原样"
 pacificstates.272.t:0 "抗议！"
 pacificstates.272.d:0 "以学生团体为中心的自由主义者大学生和左派教师们，因拒绝宣誓效忠的大学教授被解雇为契机，开始为他们认为的社会审查制度的加强而抗议。他们指责政府和麦克阿瑟没两样，太好笑了嘛，也没人逼着这些大学去制定道德规范啊？然而，不可否认的是，图书馆里的藏书量越来越少，对教师的政治审查越来越严格，对学生的监督也越来越普遍。记者们对那些称我们为“抓珍珠者”的人表示同情，因此，让大学教师们有一些变通之地可能会让人们更支持我们。当然，尽管许多教职员工和学生都是左翼民主党人，但有些人显然对工团主义抱有同情，这可能成为了他们的破绽。"
 pacificstates.272.a:0 "跟管理员们谈谈"
 pacificstates.272.b:0 "反击这些赤匪同路人"
 pacificstates.273.t:0 "完美图景"
 pacificstates.273.d:0 "我们进一步放松经济管制的政策已经初见成效！艾伦·杜蒙，负责我国军用雷达系统的人已经开始大批量生产他自己的消费类电视机了！仅需200美元，全国的家庭就可以通过使用家庭电视来享受只能在电影院才能享受的娱乐了！虽然在新的电视上没有什么节目可看，但广播行业的一些主要成员正跟随着杜蒙的脚步，逐步建立起一个新的电视传媒网络。相关专家认为，按照目前的速度，大多数美国人在十年内都将在家中拥有一台电视机。"
 pacificstates.273.a:0 "很好！"
 pacificstates.275.t:0 "国际电影制作激增"
 pacificstates.275.d:0 "我们的减税促进了电影的发展，加上市场与技术的进步，好莱坞获得了比以往都多得多的收入，这让他们能够制作更多的电影。现在商务部告诉我们，电影制作从未像现在这样受欢迎，随之而来的是，共和党的理想和亲美情绪正被广泛传播着。当然，加州当地人也非常欢迎电影业提供的额外工作岗位。"
 pacificstates.275.a:0 "棒极了！"
 pacificstates.276.t:0 "恐慌！"
 pacificstates.276.d:0 "在这个不稳定的时期，私人投资者似乎开始关注市场了！有谣言说，我们的军队可能忠于某些激进的意识形态，这当然是屁话，但有些人先前高估了市场前景，盲目地将新收入投入股市，自然而然，投资者们在担心股市崩盘的情况下从股市撤出了资金。我们需要一段时间休养生息，等阴谋论不攻自破之后就好了。"
 pacificstates.276.a:0 "操！"
 pacificstates.277.t:0 "重获新生"
 pacificstates.277.d:0 "据目前的报告，大众已经恢复了对政府的信心，并由此恢复了对在我们领导下的市场的信心，从而促成了经济的大规模增长！投资热潮席卷了太平洋合众国，我们正迅速地进入一个新黄金时代，或者，正如激进的批评人士所讽刺的那样，一个新镀金时代。但让那些狂热反市场分子继续吹嘘他们的废物理论吧，我们还要为物美价廉的商品举杯相庆呢！"
 pacificstates.277.a:0 "为自由放任资本主义感谢上帝"
 pacificstates.278.t:0 "扶轮社"
 pacificstates.278.d:0 "扶轮社是一个由商界人士组成的慈善社，扶轮社希望将商界领袖聚集在一起，以便他们可以为如援助穷人或为世界和平在内的人道主义计划而合作。随着我们开始鼓励慈善活动，扶轮社的社员人数大幅度增加，对教育的慈善捐款数额也增加了。虽然反政府者对这种使商业精英更容易在彼此间建立更紧密联系的尝试持批评态度，但扶轮社的存在带来的积极效应是不可否认的。"
 pacificstates.278.a:0 "总有愿意做好事的人嘛"
 pacificstates.282.t:0 "格兰特号和杰斐逊号"
 pacificstates.282.d:0 "我们已经落成了两艘以格兰特和杰斐逊总统命名的巨型战舰。当它驶出旧金山港时，围观者的掌声响成一片，这对美国的战争来说很有用。"
 pacificstates.282.a:0 "终于"
 pacificstates.283.t:0 "难民涌入"
 pacificstates.283.d:0 "由于我们的开放移民政策，邻国的难民大量涌入我国，尽管我们自己仍处于困境，特别是对那些经历了工团叛乱、民族主义、复仇主义泛滥或极端经济萧条的人来说，但在这一过程中，我们的国内生产总值仍处于增长状态。当然，并不是所有人都对这一变化感到高兴，许多当地人将这些难民视为对他们的政治、工资、文化、种族或某种联合体的威胁。"
 pacificstates.283.a:0 "好事情"
 pacificstates.283.b:0 "尝试征召他们"
 pacificstates.284.t:0 "工人之党"
 pacificstates.284.d:0 "虽然移民限制的取消为新移民带来了繁荣的环境，但这种经济增长对一些本土工人来说并不完全是好事，他们说，他们为要与这些移民竞争而倍感压力。他们中最激进的人已经改组了总部位于加州的劳工党，吞并了小型的本土主义组织，甚至包括前三K党成员在内，并宣传反政府和反移民思想，我们必须决定要怎么处理他们。"
 pacificstates.284.a:0 "调查并对抗它们"
 pacificstates.284.b:0 "倒霉，但这毕竟是他们的权利"
 pacificstates.289.t:0 "自动变速装置"
 pacificstates.289.d:0 "随着不再需要手动换挡的变速器得以发明，我们在汽车领域出现了重大突破。自然，汽车的销量将会随之激增。"
 pacificstates.289.a:0 "大受欢迎的突破！"
 pacificstates.290.t:0 "少民事务办公室"
 pacificstates.290.d:0 "少数民族事务办公室是黑人事务局的扩大版，它将使我们能够更好地同少数民族社区的领导人打交道，并对他们的事务作出处理，但这还是需要一点钱。尽管有一些内阁成员认为这没啥大用，因为政府官员已经在和这些少民领导人打交道了嘛，但其他人认为这会成为一个有益的补充，而且也更加方便。"
 pacificstates.290.a:0 "资助它"
 pacificstates.290.b:0 "没必要"
 pacificstates.291.t:0 "鲍厄里的骄傲"
 pacificstates.291.d:0 "好戏上映！《鲍厄里的骄傲》是《东区儿童》系列中的一部大受欢迎的电影，它借鉴了民间资源保护队的工作内容，大大提升了该片的受欢迎程度和民众支持度，并顺应了新自由主义越来越受欢迎的趋势。"
 pacificstates.291.a:0 "很好！"
 pacificstates.292.t:0 "为民间资源保护队立像"
 pacificstates.292.d:0 "在全国范围内，民间资源保护队已经成为一个深受人们喜爱的机构，由于它为人们所做的工作，现在，西海岸正竖立着许多他们的雕像。"
 pacificstates.292.a:0 "拯救美国！"
 pacificstates.296.t:0 "农业调整法不受欢迎"
 pacificstates.296.d:0 "《农业调整法》的目的是通过销毁过剩的农产品来帮助维持农产品价格，但它受到了人们的批评，批判甚至还来自那些与我们立场一致的记者，他们认为这会导致浪费现象，并称我们只让大公司受益。亨利·华莱士一直是该法案的积极反对者，他称这个想法简直令人抓狂。也许我们应该缓和这一法规的实施？"
 pacificstates.296.a:0 "缓和法案措施"
 pacificstates.296.b:0 "保持原样"
 pacificstates.300.t:0 "斯坦贝克"
 pacificstates.300.d:0 "约翰·斯坦贝克出版了他的新书《愤怒的葡萄》，该书站在了反保守的政治立场上，讲述了俄克拉何马州和密苏里州边境上的一个家庭逃离沙尘暴和民兵与旧民主党间的斗争的故事。然而，这家人去加州的路难上加难，他们需要潜入西部军指挥中心境内，却遇到了当地人的仇恨，他们把这家人视为对其工作的威胁，或要求他们为西部军而战。我们的政治顾问在公众中收到了对该书褒贬不一的评价，人们似乎被它感动了。"
 pacificstates.300.a:0 "有意思"
 pacificstates.301.t:0 "远程导航的突破"
 pacificstates.301.d:0 "我们的研究有了新突破！一种无线电导航系统得以发明，它将尽快在我们的飞机和舰船上应用。很自然，政府正在宣传我们在研究上的投资已经得到了回报。"
 pacificstates.301.a:0 "跃进一步"
 pacificstates.303.t:0 "赫斯特谴责政府"
 pacificstates.303.d:0 "威廉·伦道夫·赫斯特开始在他的报纸上谴责政府，指责我们同情工团、危害自由。共和党报纸也纷纷效仿，不过措辞更为克制。赫斯特被认为是麦克阿瑟的忠实拥护者，并希望我们的政府垮台——尤其是在他被加税之后，这早已不是什么秘密了。太平洋国调查局的调查不仅会涉及赫斯特，还会涉及他旗下报刊的许多专栏作家，因其接近于危险的活动。问题是，赫斯特是否足以因叛国活动而受到调查，而且，这样做的话会不会让我们陷入专制主义的深渊？"
 pacificstates.303.a:0 "调查他与他的报刊"
 pacificstates.303.b:0 "这是他的权利"
 pacificstates.305.t:0 "美国自由联盟"
 pacificstates.305.d:0 "我们增税的政策为我们树敌无数，尤其是在商人阶层之中。美国自由联盟主要由民主党保守派组成，它反对我们的增税政策，同时也呼吁结束战争，并且结束他们认为不负责任的金融活动。他们目前正在游说右翼政客，煽动他们反对我们，并编写自己攻击政府的报纸。虽然他们没有违反任何法律，但我们可以公开地攻击他们，因为他们作为富人的身份很容易成为让其成为舆论的攻击目标，或者干脆我们不管他们也行。"
 pacificstates.305.a:0 "攻击他们"
 pacificstates.305.b:0 "无视他们"
 pacificstates.308.t:0 "公平劳动标准委员会"
 pacificstates.308.d:0 "公平劳动标准委员会是一个正处于提案阶段的委员会，其会在与战争有关的工作中禁止种族歧视现象。我们要成立该委员会么？"
 pacificstates.308.a:0 "行"
 pacificstates.308.b:0 "别"
 pacificstates.311.t:0 "美国指南系列"
 pacificstates.311.d:0 "“美国指南系列”是与我们的“联邦一体计划”一同成立的项目，该项目雇佣了失业的前作家和历史学家来撰写关于各个州、各个地方和美国整体的历史。虽然与我们其他的机构相比，它的人员并不算得上多，但它的文章在学校里越来越受欢迎，这些学校肯定会赞美我们的这一项目的。"
 pacificstates.311.a:0 "好啊"
 pacificstates.312.t:0 "爱迪生之争"
 pacificstates.312.d:0 "爱迪生电力公司长久以来一直垄断着能源行业，也没有政府适当的监督。我们是根据新的反垄断法将他们拆分，还是通过购买他们的股票使他们成为公营公司？"
 pacificstates.312.a:0 "拆分它"
 pacificstates.312.b:0 "买下它的股票"
 pacificstates.313.t:0 "节制喷泉"
 pacificstates.313.d:0 "一些地方进步派政府已经建起了“节制喷泉”，以鼓励人们不再酗酒，转而有节制的饮酒，并常用支持禁酒的艺术品装饰它。然而，它对劝阻酗酒的作用似乎微乎其微，许多人认为这些装饰相当丑陋，还引发了偶尔的破坏行为。"
 pacificstates.313.a:0 "好过没有"
 pacificstates.314.t:0 "自由派说客增多"
 pacificstates.314.d:0 "由于我们增税的结果，自由派说客不断增多，越来越多的商人、民主党人和共和党人指责着我们的政府。他们的出版物诅咒着我们经济的毁灭，并声称总统想要建立工团独裁政府，我们感受到了他们不断增加的压力。"
 pacificstates.314.a:0 "去他们的"
 pacificstates.316.t:0 "赫斯特的背叛"
 pacificstates.316.d:0 "威廉·伦道夫·赫斯特终于做了他一直想做的事，在连续几周在报纸上公开谴责我们之后，他逃离了太平洋国，加入了麦克阿瑟集团。有些人认为，我们关闭他的报社是明智的。"
 pacificstates.316.a:0 "这是蓄意破坏，把它的报社关咯"
 pacificstates.316.b:0 "让他们去吧"
 pacificstates.317.t:0 "土地补偿"
 pacificstates.317.d:0 "尽管我们通过税收和土地征用来收回闲置土地是完完全全合法合理的。但有些人认为仅仅这样做却不给予农民更多的补偿是不道德的，这也导致了农民的仇恨，他们纷纷涌入进步党和民主党的阵营。这也让我们成为了遍布加州大部分地区的共和党报纸的攻击目标。也许我们应该为那些拥有土地的人补偿更多的现金？"
 pacificstates.317.a:0 "补偿他们"
 pacificstates.317.b:0 "只补偿较穷的农民"
 pacificstates.317.c:0 "不，土地闲着也是闲着"
 pacificstates.319.t:0 "宗教保守派组织崛起"
 pacificstates.319.d:0 "太平洋各州的宗教保守派正在反恶习协会的旗帜下组织起来，而这个组织对许多民主党选民特别有吸引力。我们放宽避孕和堕胎的政策激怒了我们国家的天主教徒，现在“修女”艾米·森普尔·麦克弗森的教会让这两股政治力量联合起来以反对我们。然而，进步人士支持我们的政策，认为这将建立一个更稳定、更明智的社会。自然，随着选民在社会问题上在左右翼上分化，我们的文化领域也出现了两极分化的现象。"
 pacificstates.319.a:0 "哦，我的……"
 pacificstates.321.t:0 "通讯技术的突破！"
 pacificstates.321.d:0 "我们的科实验学在经历了许多死胡同之后终于有了突破！女演员海蒂·拉玛和钢琴家乔治·安太尔已改进了跳频扩频通信技术，这将让敌人更难干扰我方信号，进而实现更先进的加密形式，特别是在海军上。他们已经被授予总统自由奖，并有可能获得诺贝尔奖的提名。"
 pacificstates.321.a:0 "真正的爱国者"
 pacificstates.323.t:0 "联合工团政策"
 pacificstates.323.d:0 "我们不能同情联合工团想要推翻宪法，建立一个工团政府的想法，但事实上，他们认为自己是工人之国，他们追逐梦想的权利更令人同情。也许我们两国政府之间存在误解，为了改善两国关系，开始讨论和平也并非不可能。"
 pacificstates.323.a:0 "试一试吧"
 pacificstates.323.b:0 "不，谴责他们"
 pacificstates.324.t:0 "太平洋国的和平提议"
 pacificstates.324.d:0 "在他们激进政府的领导下，太平洋国向我们发出了和平提议，他们声称接受我们的信仰，尽管还是反对我们的方法。我们该怎么做呢？"
 pacificstates.324.a:0 "同意"
 pacificstates.324.b:0 "拒绝"
 pacificstates.3240.t:0 "联合工团同意了！"
 pacificstates.3240.d:0 "联合工团已经接受了我们的和平提议，表示是时候结束这场冲突了。"
 pacificstates.3240.a:0 "很好"
 pacificstates.325.t:0 "资本外逃"
 pacificstates.325.d:0 "许多资本家终于展露了他们的真面目，他们逃离了太平洋国，转而投奔加拿大甚至是西部军，作为对我们的经济政策的报复。然而，这也为我们反对他们做了免费宣传，但尽管如此，在我们决定如何处理他们流亡后抛弃的产业时，也带来了一些重大问题。直接通过国家管理它将有助于让它们更快地发挥作用，也有些人认为，在这些被遗弃的行业中创建产销合作社更符合我们的意识形态，并且能够作为我们更大规模计划的先驱。"
 pacificstates.325.a:0 "由我们来管理"
 pacificstates.325.b:0 "交给合作社吧"
 pacificstates.326.t:0 "产业工会支持我们！"
 pacificstates.326.d:0 "我们日益壮大的产业工会正式表示支持我们的政府，而不是其他的，甚至是那些有工团主义倾向的政府。同样，工会组织者良好地组织了从我们的计划中受益的其他人，比如住在乡下的人，以便他们能够更有效地投票。他们与支持我们的中产阶级成员的同盟实际上为我们的统治打下了坚固的基础。"
 pacificstates.326.a:0 "好啊！"
 pacificstates.327.t:0 "墨西哥人反抗"
 pacificstates.327.d:0 "可以预见，被强制驱逐出境的墨西哥裔及其后代会维持感到愤怒，许多人抗议我们最近的措施，有些人甚至加入了激进组织。尽管如此，我们在很大程度上成功实现了我们的目标，因为墨西哥裔人口的急剧下降，本土主义者和那些担心工团主义影响的人都对此表示感谢。"
 pacificstates.327.a:0 "很好"
 pacificstates.350.t:0 "加州的灵性论运动请求我们的援助？"
 pacificstates.350.d:0 "加州的“灵性论运动”是反对英帝和社会主义的右翼松散团体，他们也正寻求我们的帮助来对付这两者。随着他们的情报工作变得越来越复杂，他们渴望交换信息、资金支持和援助承诺。虽然我们政府中的许多人强烈支持采取这一能够削弱反亚帝国主义的赫斯特的措施，同时也想要支持可能的盟友，但他们还没有牢牢掌握局势，事实上，他们也不大可能掌权。我们该怎么办？"
 pacificstates.350.a:0 "给点资源"
 pacificstates.350.b:0 "手头正紧，真对不起"
 pacificstates.3500.t:0 "和日本合作？"
 pacificstates.3500.d:0 "我们收到报告说，日本情报部门正为了共同的“反工团主义”目的与灵性论运动党领导层合作，当然，日本可能很有兴趣来介入我们的政治，也许是为了回应我们最近的武力恫吓吧。虽然赫斯特是出了名的仇日人士，但灵性论运动党在情报和合作方面仍然还有用处，即使情报完全属实，也可能没什么实际意义。我们该怎么办？"
 pacificstates.3500.a:0 "没收他们的资金"
 pacificstates.3500.b:0 "没啥事的"
 pacificstates.351.t:0 "灵性论运动反政变！"
 pacificstates.351.d:0 "洛杉矶的爱德华·朗斯特里特·博丹，日益壮大的灵性论运动党的领袖，在广播中宣布威廉·伦道夫·赫斯特已被军队中叛变的外国特工掌控。博丹将乔治·马歇尔和亨利·阿诺德称为反对“太平洋国民选总统”阴谋的领导者，指责他们听命于渥太华的国王，因赫斯特反对盎格鲁工团主义而试图掌控他。在宣布他意图击退这些卖国贼时，他说，日本愿意帮助他们驱逐这些外国势力，并派来了一支小部队，以帮助民兵、残余的联邦警察和所有那些将与他们一起反抗英国无政府主义的人战斗。虽然我们的支持者有可能击溃反对派的部队，但政变并不像计划中那么迅速，这危及了全国大局。由于国会议员和灵性论运动党政客谴责我们，德威特将军还可能动用他自己的军队反对我们，我们可能不得不考虑从海上逃到协约国了。"
 pacificstates.351.a:0 "我们必须撤退！"
 pacificstates.351.b:0 "我们必须同这些疯人战斗！"
 pacificstates.352.t:0 "贝克尔斯菲尔德之战！"
 pacificstates.352.d:0 "我们在贝克斯菲尔德的守备部队受到了德威特将军部下的攻击，他还得到了日本军队和暴徒们的支援！双方损失都很惨重，我们也迅速地失去了公众支持，但我们不得不撤退到洛斯特希尔斯，虽然我们在战术上失败了，但只要我们进行反击，我们就能赢，因为我们的对手已经疲惫不堪、无力再战。然而，这将导致更大的人员损失，并可能使我们更不受公众欢迎，我们的内阁中的一些人宁愿撤退，也不愿对加州造成更大的创伤。"
 pacificstates.352.a:0 "进攻！"
 pacificstates.352.b:0 "不能再这样下去了，跑加拿大去吧"
 pacificstates.353.t:0 "博丹在国会发表演说"
 pacificstates.353.d:0 "随着马歇尔和阿诺德将军撤退到协约国，爱德华·朗斯特里特·博丹今天在太平洋国国会上发表了演说。他承诺将灵性论运动及其盟友的“全心全意”置于太平洋国，成为其免受外国间谍侵害的保护神，他还将不惜一切代价铲除一切内外之敌。他还宣布，他将向那些被证明与加拿大人、政变分子和外国工团分子有联系的人发出逮捕令。尽管他们在国会中的盟友和那些被政变吓怕了的人支持这一决定，但国会中的很多人对这一决定仍然保持沉默。甚至在某刻，荷马·伯恩公开斥责博丹为“疯子”，有些议员忍不住笑了出来。尽管如此，在呼吁维持秩序之后，博丹表示，政治无能的时代已经结束了。"
 pacificstates.353.a:0 "让他们笑去吧"
 pacificstates.354.t:0 "通敌者的命运"
 pacificstates.354.d:0 "我们已经列出了承诺中的反政府通敌者名单，其中的名人包括罗伯特·塔夫脱、亨利·华莱士、克拉伦斯·D·马丁、霍默·伯恩、卡伯特·奥尔森和厄普顿·辛克莱。我们可以简简单单地把他们都抓起来，干脆利落地结束这一切，但我们的日本朋友更希望我们应当只去警告他们，让他们有两天时间逃到加拿大，辩称这会更加“干净”，并在不引发广泛抗议的情况下解决反政府人士的问题。也许我们应该再考虑一下？"
 pacificstates.354.a:0 "很好，警告他们必须滚蛋"
 pacificstates.354.b:0 "然后让他们以后卷土重来？还是别吧"
 pacificstates.355.t:0 "日本援助"
 pacificstates.355.d:0 "日本已经向我们提供了援助，但同时也明确表示，他们希望从我们这获得更多的石油来供给海军燃料，并承诺会为此提供额外援助作为回报。考虑到党的角色越来越接近标准石油等行业的贸易中介，这个要求倒没什么困难，而且标准石油本身也希望同日本达成协议，尽管民族主义者希望我们不要向日本人做太大的让步。"
 pacificstates.355.a:0 "好吧"
 pacificstates.355.b:0 "不，已经够了"
 pacificstates.356.t:0 "党的信仰"
 pacificstates.356.d:0 "我们的权力已然稳固，现在是时候提出一个更明确的行政议程了。大多数党的狂热分子要求我们公开接受并宣扬我们的边缘、神秘、超自然和其他新灵性论运动的信仰。然而，日本代表一再明确表示，他们希望我们继续隐藏我们的信仰，担心我们会败坏我们已得到的支持基础，忽略日本的意见是很危险的。不过，哈伯德提出了一种新模式，即党会拥有一个独立的宗教，可以缓慢地向人们传播宣传，而不是直接让人们接受我们信仰的全部——除了红衫军阴谋之外。"
 pacificstates.356.a:0 "采纳哈伯德的建议"
 pacificstates.356.b:0 "决不妥协，支持神秘学！"
 pacificstates.357.t:0 "国际社会的强烈反响"
 pacificstates.357.d:0 "我们将危险的反灵性论运动者从社会中清除的做法遭受了来自协约国和其他美国势力的广泛谴责，持不同政见者声称，现在莫哈韦和太平洋地区坟墓遍地，而官方名单中的“失踪人员”现在就在那里面躺着，其中许多人是反对政府的记者，活动人士，激进分子和那些对灵性论运动的“欺诈”思想了解太多的人。尽管如此，在我们本国，人们已经把这一做法所代表的态度铭记于心，并明白了反抗政府是徒劳无功的，随之而来的是，国内的抵抗现象已经显著减少看，因为大多数人已经不再有渠道获得未经审查的新闻来了解这些境外势力的谴责。"
 pacificstates.357.a:0 "那再多整点吧"
 pacificstates.357.b:0 "就这样吧"
 pacificstates.358.t:0 "博丹被免职！"
 pacificstates.358.d:0 "在爱德华·朗斯特里特·博丹和灵性论运动内人士公开推崇魔鬼学、宇宙访客、超自然现象、食尸鬼等荒诞神秘学概念之后，国家稳定陷入危机。在博丹因“领导失格”而被免职后，日本士兵、雇佣军和联邦警察联合起来掌控了国会，灵性论运动在日本及其当地贸易盟友的指导下决定推行新政党路线并拥立新领袖，唯一的问题就是在于国会将“自愿”推举何人上位。两位人选分别是马克斯·索恩伯格——太平洋标准石油公司的实际领导人、日本商界的主要盟友，太平洋人民也更容易接受；以及拉尔夫·汤森——意识形态更亲日，坚称白人和日本人同为优等种族，凌驾于其他东方人种之上，还盛赞日本政体。然而，日本亦可采取高压手段，直接安插能够绝对执行其意志的人选……"
 pacificstates.358.a:0 "马克斯·索恩伯格"
 pacificstates.358.b:0 "拉尔夫·汤森"
 pacificstates.358.c:0 "这些美国人不可信，需要由日本直接任命"
 pacificstates.3580.t:0 "早川雪洲促进和平"
 pacificstates.3580.d:0 "早川雪洲已经成为太平洋地区最出名的演员之一，这要归功于我们新开括的日本市场，而这也是好莱坞向我们的新盟友表示尊重的一种方式。虽然早川本人显然不是日本帝国主义的追随者，也不太赞同现在太平洋国在日本治下的地位，但他愿意为了两党两国的利益促进两国间的团结与和平，在我国政府的要求下，他半定期地发表演讲，谈论对日贸易的重要性以及日本保护太平洋的“天命”。"
 pacificstates.3580.a:0 "很好"
 pacificstates.359.t:0 "博丹死了！"
 pacificstates.359.d:0 "一场悲剧降临于太平洋国，灵性论运动领袖兼太平洋国总统爱德华·朗斯特里特·博丹去世了，其钦定继承者L·罗恩·哈伯德声称，一名遭工团分子新式手段洗脑的博丹下属在卧室里开枪射杀了博丹，而这名凶手用不了多久就会必定落网。按常理来说，接下来的剧情走向是这样的：党的核心圈子以及国会会先后推选哈伯德为灵性论运动的新领袖，可一名黑马选手的入场却直接打乱了哈伯德一派的如意算盘及整个“选举”程序。伯纳·麦克法登即是博丹的老伙计，也是其灵性论同好，如果用一句话概括他的话，那就是一位注重健美与性健康的密教徒，其人生信条包括健身、营养健康与间歇性断食、素食主义与生食主义、以葡萄疗法为代表的各式赤脚医术、性解放与自由恋爱、以麦克法登牌万物秩序主义思想为名的新时代宗教，以及各种体育文化。麦克法登虽生于新泽西，长于新泽西，但却在自己的宣传专员富尔顿·奥斯勒的协助下，通过创立、发行各式杂志与纸质出版物以及开设“疗养馆”的方式把自己的理念传遍了大江南北，其影响力冠绝全美，甚至于博丹还有许多党内高层都是伯纳·麦克法登基金会的在册成员。在奥斯勒，以及莱昂内尔·斯特朗福特、贝尼迪克特·拉斯特、米洛·黑斯廷斯、吉尔曼·洛等一众美国健身达人、体育文化界大拿的支持下，麦克法登开创了自己的政治流派，把自身奇特的健身理念同西尔维斯特·格拉厄姆的节制思想、体育文化、博丹的灵性论及神智学，还有一大堆从罗斯福、终结加州贫困、莱蒙德、拉福莱特那学来、互不相干的进步主义、民粹主义、左翼自由意志主义、环保主义、公社主义思想杂糅成了一个还算自洽的整体。博丹已逝，哈伯德的地位又受到了麦克法登的威胁，现在，博丹的老班子必须要做出决定，选定领导灵性论运动继续向前迈进的人选。"
 pacificstates.359.a:0 "赞美哈伯德！"
 pacificstates.360.t:0 "控制电影业"
 pacificstates.360.d:0 "随着好莱坞越来越多地受到灵性论运动党及其名流的控制，我们决定对电影业采取更直接的控制。我们可以让灵性论运动党机构向电影业施压，让他们制作更多以灵性论运动党成员宣传和文学为基础的电影，同时禁止反灵性论运动的宣传。另一个更激进的方案是简单地把好莱坞国有化并且收购一批电影制片厂，这能让我们直接控制电影业。"
 pacificstates.360.a:0 "对他们施压"
 pacificstates.360.b:0 "控制他们"
 pacificstates.361.t:0 "为心理学分配资金"
 pacificstates.361.d:0 "我们需要保护我们的思想不受他人心灵入侵！这些工团主义者的精神控制和攻击的方法早就被灵性论运动党成员记录下来了！我们的调查人员正在申请额外的资金来对抗这一威胁！"
 pacificstates.361.a:0 "必要的研究"
 pacificstates.362.t:0 "我们的出版社"
 pacificstates.362.d:0 "随着超自然理论以微妙和公开的形式被推广，我国科幻小说和通俗小说的数量出现了爆炸式增长，而作品来自各种各样的作家，其中许多人正是我们的追随者。当然，“许多”也不是“全部”。我们将找到一家出版社，它将成为这些主题文学的保护伞，并必须在此过程中通过灵性论运动的审查，而所有这一领域的出版将只有通过这家出版社才能合法。"
 pacificstates.362.a:0 "出版业的新气象"
 pacificstates.363.t:0 "伊斯兰民族组织"
 pacificstates.363.d:0 "作为一个以美国黑人社区为基础的奇怪宗教崇拜，伊斯兰民族组织越来越多地赞扬我们反对工团主义的立场，以及我们对非正统信仰的开放态度，尽管他们在官方上还视我们为异教徒。在地方层面上，灵性论运动代理人与伊斯兰民族组织在打击共同敌人方面开展了密切的合作，而后者则借此邀功，声称他们可以代表并管理太平洋国之外的黑人社区。"
 pacificstates.363.a:0 "仅限南方"
 pacificstates.363.b:0 "很好"
 pacificstates.363.c:0 "别吧"
 pacificstates.363.e:0 "赏他们个黑带吧"
 pacificstates.400.t:0 "休伊·朗归来！"
 pacificstates.400.d:0 "休伊·朗在他的国家崩溃后奇迹般地逃脱了敌人的追捕，这在很大程度上要归功于我们的帮助。他很快就穿过落基山脉来到了加利福尼亚。尽管人们可能会认为他不太开心，但朗仍然决心将他的远见带到美国，现在他请求拥有在进步主义的旗帜下第二次领导美国人民的机会。我们要给他这个机会么？"
 pacificstates.400.a:0 "休伊·朗再次当选"
 pacificstates.400.b:0 "休伊应当在内阁里"
 pacificstates.4003.t:0 "太平洋国的新旗帜？"
 pacificstates.4003.d:0 "现在联邦党统治着太平洋国，一面新的旗帜即将升起。[GetPrimeMinister]总统已经打算采用一种全新的设计，但许多人建议采用包含红色的另一种方案。"
 pacificstates.4003.a:0 "现在的就不错"
 pacificstates.4003.b:0 "整多点他们想要的红色"
