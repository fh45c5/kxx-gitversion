 KX_california.50.t:0 "华莱士总统的怪朋友"
 KX_california.50.d:0 "亨利·华莱士总统在公众眼中的一般印象是美国最著名的非革命左翼人士、太平洋国最伟大的进步派之一，是人见人爱的谦逊又人道的农家小伙子，但在那些真正熟知他的人看来却又是另一番故事了。华莱士一直热衷于研究神秘论、神智学、灵性论等神秘学学科，他把工作之外的大部分时间都花在了自己的精神开化上。不过，这一半遮半掩的兴趣爱好却在华莱士大选就职前的最后一次总统辩论中被公之于众，而他也因这些疯狂的想法当场遭到了辩论主持人的冷嘲热讽。事情是这样的，在辩论途中，不知为何，他与好友尼古拉斯·洛里奇一家的通信被曝了出来，而这个所谓的洛里奇一家是活跃于西藏和纽约的俄裔精神领袖，他们将已逝的弗拉基米尔·列宁进行了精神神化，并加之以自己的半神智学阿耆尼瑜伽思想创造出了佛教社会主义。虽然这一事情遭到了封锁掩盖，暂时避过了风波，但华莱士依旧不改其热情，还在身边聚集起了一群灵性论进步同僚，并开始在国内小规模传播自己的理念。那么，我们是要冒着打破精心构筑起的互利共存之平衡的风险，放任不管，让他去追求什么精神开化，还是让他乖乖闭上自己的嘴呢？"
 KX_california.50.a:0 "洛里奇一家还是我们的朋友，但华莱士就得和我们分道扬镳了"
 KX_california.50.b:0 "小小兴致就随他去吧，只要他不把公私搞混了就行"
 KX_california.50.c:0 "洛里奇主义照耀太平洋海岸！"
