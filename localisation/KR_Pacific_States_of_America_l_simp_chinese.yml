 KX_california.51.t:0 "舞动的格蒂不再舞动"
 KX_california.52.t:0 "金门大桥竣工"
 KX_california.52.d:0 "今日，约瑟夫·施特劳斯及其手下的工程师团队正式完成了金门大桥的建设工程。大桥的北端连接马林县，南端连接旧金山市北的旧金山半岛，101号国道和1号州道途经其上。\n\n来自全世界各地的记者争相前来这座世界最大的悬索桥，准备报道下周的剪彩礼，而近期脱离合众国的美利坚太平洋国新政府把这座崭新的大桥视为了其政府以及国家繁荣昌盛的标志。"
 KX_california.52.d_usa:0 "今日，约瑟夫·施特劳斯及其手下的工程师团队正式完成了金门大桥的建设工程。大桥的北端连接马林县，南端连接旧金山市北的旧金山半岛，101号国道和1号州道途经其上。\n\n来自全世界各地的记者争相前来这座世界最大的悬索桥，准备报道下周的剪彩礼。虽然动荡的阴霾仍未完全褪去，但这座大桥已然成为了美国近些时日蒸蒸日上之情景的写照。"
 KX_california.52.a:0 "好耶！"
 KX_california.51.d:0 "塔科马海峡大桥因其微风一吹就左右摇摆的特点而获得了“舞动的格蒂”的昵称，它是全世界第三大的悬索桥，仅次于新竣工的旧金山金门大桥和纽约市的乔治·华盛顿大桥，不过这都是悲剧降临华盛顿州之前的事了。那是十一月一个冷风咧咧的上午，十一点时分，横跨于塔科马海峡之上、分隔塔科马和基策普半岛的庞然大物被强风所扭曲、撕裂，整个坠入了普吉特湾的刺骨寒水中，当时恰巧身处现场的摄影师眼疾手快，拍下了部分画面。大桥从设计之初就存在着缺陷，即使后来在建造过程中加装了许多减震措施，还是会在徐徐轻风中摇摆起伏。塔科马海峡大桥完工于今年的七月一日，存在时间还不到半年，全国各地的工程师、数学家、物理学家纷纷赶赴其遗址，研究起了这件奇事。\n\n说好不好说坏不坏，这场事故只有一名死者：一只名为塔比的可卡忠犬，它被困在了桥上的最后一辆车前，同大桥一起沉入了海底。小狗的主人是伦纳德·科茨沃思教授，当时发觉事态不对的教授赶紧跑了起来，一路摇晃着冲到了桥的一端，被路人所救。路人本来也想就下塔比的，但这可怜的小家伙儿吓坏了，一动也不敢动，最终也没能抵达安全的地方。沉入水中的部分计划改建为人工礁石，而大桥的其余部分将全部拆除，只留下桥基和缆线的固定装置——这既是一种提醒，也为未来重新架桥提供了一处可能的起点。塔科马海峡大桥的事故将会被永远铭记，成为我们日后几十年中的一个生动教训。"
 KX_california.51.a:0 "人类骄傲自大的警示录"
