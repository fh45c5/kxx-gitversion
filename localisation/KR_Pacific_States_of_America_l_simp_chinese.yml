 calpeaceout.22.t:0 "重划州界提案"
 calpeaceout.22.d:0 "西海岸彻底与美国其它地区划清了界限，摆脱了联邦政府腐败国会的颐指气使，这片广阔土地的人民终于可以一品独立之芬芳了。虽然太平洋国摆脱了合众国的桎梏，但我们内部依旧存在着自己的枷锁。太平洋国的国会，尤其是众议院，基本上唯加州马首是瞻——不管论面积还是论人口，加州都是太平洋四州之最，会出现这种结果也算是情理之中了。此外，加州素有西海岸灯塔的美誉，所以获得自由后的西海岸理应要向加州看齐。不过很遗憾，人人所见并不总是略同，越来越多的乡郊居民和政客开始将矛头对准这种一州独大的局面。在他们看来，加州的大权独揽与联邦政府无异，太平洋各州是为了建立真正的平等联盟才离开合众国的，而“金州”却无情地碾碎了这一梦想。为引起当局的注意，一小批民众在俄勒冈州的南部立起了路障，他们希望国会能够拆解加州，解决所谓的“加州问题”。一些政治家也趁机里应外合，不知疲倦地起草法案，准备将加州重划为多个州，以此解决联邦内的加州霸权，让其它州能够获得更加平等的地位、能够享受更加轻松的氛围，而他们的成果——《[GetYear]年各州平等法案》同时得到了参议院和众议院的重视。\n\n虽说远谈不上喜闻乐见，但法案也不乏自己的拥趸。有趣的是，两院中的保守派们虽有着相同的目标，但在具体的设想上却又各执己见，这从两方各向自己所属的一院提交了实同形不同的两份提案就可见一斑。两份提案中更为合理的要属参议院了，它将加州北部与俄勒冈州南部合并为“杰斐逊州”，加州南部与洛杉矶新立“莫哈韦州”，包括旧金山在内的加州中部则继承原有的加州名头。众议院的提案大体上与参议院相同，只不过将旧金山单列为了“弗里斯科州”，将洛杉矶单列为了“安杰尔斯州”，并把俄勒冈州和华盛顿州东部的乡村地区合并为“林肯州”。\n\n两份提案都比较激进，如果没有外部支持通过的希望就很渺茫，而这正是两院找上[ROOT.GetLeader]的原因——有了其支持，提案将畅通无阻。为了换取提案的通过、摧毁加州的控制，这群政客和民众们愿意付出一切代价，从政治支持，到政府的直接财政支援无所不用其极。虽说[ROOT.GetLeader]应该不会真得去支持这些计划，要知道，这种规模的地图变动可不是个小工程，光是新州各部门的设立就是个大头疼问题，但倒也不能说这事完全没有可能，毕竟，智者千虑也必有一失呢……"
 calpeaceout.22.a:0 "力挺参议院的提案以换取政治支持"
 calpeaceout.22.b:0 "力挺众议院的提案以换取财政支持"
 calpeaceout.22.c:0 "国家可不是让你们拿来明码标价的，给我滚！"
 KX_california.45.t:0 "扩张休斯的自由意志天堂"
 KX_california.45.d:0 "自从我们从东部失败的联邦政府中独立以来，我们的自由共和国便在霍华德·罗巴德·休斯总统的带领下，依靠其由航空航天引擎公司、电影制片厂等各种投资组成的庞大金融帝国追寻着放任式威权主义、自由意志主义、技官法团主义与反工团主义于一体的远大梦想。休斯总统把创造新的飞行记录、拍摄新影片、设计新的高端器械、签署新的国防合同以外的所有时间都拿来治理国家这一他精心调校的引擎。而现在，一场争论急需休斯总统的裁决：太平洋国是否要继续维系其闭关锁国的国策。诚然，与世隔绝让我们获益颇丰，但太平洋海岸之外同样也埋藏着无尽的财富，它们有助于推动我们的天堂乐园达到全新的高度。那么，我们是要放眼海外，还是继续光荣孤立呢？"
 KX_california.45.a:0 "目所能及之处，皆为大维加斯"
 KX_california.45.b:0 "维持太平洋孤立主义，和平建设休斯的自由领地"
 KX_california.46.t:0 "扩张明日社区试验原型之仙境"
 KX_california.46.d:0 "自从我们从东部失败的联邦政府中独立以来，我们的自由共和国便在华特·埃利亚斯·迪士尼总统的带领下，依靠其庞大的传媒帝国追寻着家长制威权主义、自由意志主义、未来主义、现代乌托邦主义、技官法团主义与反工团主义于一体的远大梦想。迪士尼总统把拍电影、制作卡通片、扩展明日社区试验原型规划以外的所有时间都拿来治理国家这一他精心栽培的花园。而现在，一场争论急需迪士尼总统的裁决：太平洋国是否要继续维系其闭关锁国的国策。诚然，与世隔绝让我们获益颇丰，但太平洋海岸之外同样也埋藏着无尽的财富，它们有助于推动我们的未来主义乌托邦达到全新的高度。那么，我们是要放眼海外，还是继续光荣孤立呢？"
 KX_california.46.a:0 "目所能及之处，皆为明日之地"
 KX_california.46.b:0 "维持太平洋孤立主义，和平建设明日社区试验原型"
