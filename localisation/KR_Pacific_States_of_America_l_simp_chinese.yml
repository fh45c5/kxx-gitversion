 CAL_conservative_business:0 "企业的支持"
 CAL_conservative_business_desc:0 "我们无意惩罚商界，这是只有满脑子工团主义思想的人才会干的事。不！我们的企业家公平公正地赢得了他们应有的利润！我们坚信，商业本身便是社会的基本构成部分，因此支持商业发展是理所当然的事。当然，我们也能反过来得到他们的支持作为回报。与商界联合，我们将共同致力于恢复我们的经济，并确保它在未来几年的健康繁荣。"
