 CAL_noi_alliance_normal:0 "同伊斯兰民族组织合作"
 CAL_noi_alliance_normal_desc:0 "我党存在着严重的地区局限，必须要加以突破，而伊利贾·穆罕默德及其伊斯兰民族组织便是一个潜在的盟友。我们一直对与穆罕默德的合作持开放态度，现在终于为这段关系盖上官方印章了。让我们双方尽快达成一份友好协议吧。"
 CAL_noi_alliance_japan:0 "与和平运动携手并进"
 CAL_noi_alliance_japan_desc:0 "我们的势力多集中于太平洋沿岸，必须要有基层的盟友来维持治安与和平，因此，我们将与黑人民族主义者米蒂·戈登领导下的东方世界和平运动展开接触。由于同中根中和黑龙会联系密切，和平运动对待日本可谓是一心不二。那么，事不宜迟，现在就去和南方的这群友人商量下自治问题吧。"
 CAL_townsend_appointed:0 "汤森连接大洋两岸"
 CAL_townsend_appointed_desc:0 "我们的日本新金主任命了亲日作家、代理领事拉尔夫·汤森为太平洋国的总统，寄希望于他能够在维持美国悠久体制与自主权的同时，建立与日本完全挂钩的忠诚文职政府。早在美国内战之前，汤森就是名坚定的泛亚主义者与美国爱国者，反对在太平洋地区对日干预，而如今，他将与军人出身的佛僧约翰·大卫·普罗沃等志同道合的战友一道，在保障好我们的美国身份与文化的前提下，以平等盟友之身份推动美日两国间的团结协作，打造出脱胎于太平洋美国主义的崭新多元文化体系。"
 CAL_eagle_in_the_sun:0 "鹰沐旭日"
 CAL_eagle_in_the_sun_desc:0 "近代以来，美国的对亚外交与经济活动基本都围绕着中国展开，在汤森的眼中，中国人都是群不信神的蛮夷，是生来就要做日本的膝下奴的，而就是这样的一个国度，竟让日本白白浪费了本该用在他处的几十年时间与精力。如今，已立于共和国之巅的汤森总统准备在日本及其满洲与海滨的中国盟友间使些绊子，让日本回心转意，认识到美国才是其首屈一指的盟友。美日两国将携手并进，共同成为共荣圈的中心，为了泛亚大业身先士卒。"
 CAL_pan_pacific_unity:0 "推动泛太团结"
 CAL_pan_pacific_unity_desc:0 "早在当上总统之前，拉尔夫·汤森就是日本的泛亚征战以及瓦解欧洲霸权思想的忠实追随者，而如今的汤森已贵为一国之主，那么美利坚便自然而然会加入这一事业中来。虽然汤森不待见中国人，认为其应为日美帝国主义的利益所盘剥，但他对泛亚阵线上的其它民族和思想就没有什么看法了，只要后者肯屈膝于东京和萨克拉门托，那双方便可相安无事。我们将与新的盟友与靠山合作，将泛亚理念传遍太平洋，传遍美亚，让每一位国民都能明白，他们自己就是泛太平洋之梦的一分子！"
 CAL_americanist_appeals:0 "美国主义之号召"
 CAL_americanist_appeals_desc:0 "为了争取民众对于我们的新金主以及新路线的支持，我们将在不触犯新宗主的前提下，以美国主义号召公众。我们将以传统价值观与理想、经典美式文化等常见的爱国主义元素为抓手，增进民众对于我们政府、对于日本政府的好感，打造出一种根植于美国，又与泛亚、泛太伟大征程相辅相成的混融文化。每一位美国人都应该充分认识到，他们自己就是共荣圈所力推的泛亚、泛太团结与繁荣的一分子，因此，让我们携起手来，怀着对东京盟友的感恩之情，把我们脚下的这片土地打造为美利坚子女的真正天堂。"
 CAL_thornburg_appointed:0 "索恩伯格呼求支持"
 CAL_thornburg_appointed_desc:0 "为了以企业之治与不受管束的资本主义把太平洋各州改造为日本的经济附属，以便用新大陆的无尽资本与资源供给愈发膨胀的共荣圈巨兽，标准石油巨头、东方学家马克斯·韦斯顿·索恩伯格已在日本人的授命下坐上了总统之位。索恩伯格精明的商业头脑将能让我们在新的太平洋领地里捞上大钱，而索恩伯里在对中东经贸中积累的东方学知识则能让我们在广阔的亚洲乃至更广阔的天地中扩大我们的经济影响力。"
 CAL_oil_of_empires:0 "帝国的石油"
 CAL_oil_of_empires_desc:0 "身为一名商人，马克斯·索恩伯格深知，无利不称友。虽然太平洋国与日本帝国之间的“伙伴关系”相当不平衡，但索恩伯格还是尽力以真金白银向彼岸的日出之国换来自主与尊重。日本的战争机器需要无止尽的石油，而索恩伯格恰好可以利用自己在标准石油公司的关系给日本人送上一份无法回绝的大礼。\n\n美国的石油流向了东方，化为了日本陆军征战亚洲的燃料，而日本的资金则流入了索恩伯格及其属下的腰包，化为了美国人民复兴的动力。此外，这笔交易还能向日本人展示索恩伯格治下的美国所拥有的巨大利用价值，从而让我们的人民免遭东京专制大手的摧残。"
 CAL_zaibatsu_connections:0 "财阀入美"
 CAL_zaibatsu_connections_desc:0 "二次内战导致的资本外流直接给了我们当头一棒，虽然太平洋国本身并不缺少巨企财团，但光靠我们自己显然是走不出这一泥潭的。既然福特和范德比尔特喜欢袖手旁观，那我们就邀请三菱、安田、住友、三井，还有发展势头迅猛的日产来医治我们的经济顽疾。有了日本企业带来的资金与技术，我们就能为太平洋国缔造一幅全新的繁荣局面，继而提振人民对于政府的信心。\n\n遥忆大萧条当年，我们自己的企业四处落井下石、争得个你死我活，而如今，直接从日本流入的投资浪潮将彻底让这段记忆成为历史。财阀们很清楚礼尚往来的道理，只要我们源源不断地向日本输送物资，他们的援助自然也就不会中断。"
 CAL_nomura_appointed:0 "[CAL_nomura_loc]"
 CAL_nomura_appointed_desc:0 "[CAL_nomura_desc_loc]"
 CAL_nomura_appointed_normal:0 "野村掌舵"
 CAL_nomura_appointed_normal_desc:0 "德高望重的海军提督、前驻美大使野村吉三郎既已就任，我们便将实施我们最为大胆的计划，以军队统治我们的太平洋国新“盟友”，这样我们就不必再通过不甚可靠的外国合作者保护太平洋上的这颗宝石。作为日本帝国主义野心与共荣圈的最高成就，我们将不惜一切代价，在海军军政府治下维护法律与秩序，以便我们能从新的美国臣民身上榨取全部的利益。"
 CAL_nomura_appointed_tamon:0 "山口掌舵"
 CAL_nomura_appointed_tamon_desc:0 "德高望重的海军提督山口多闻既已就任，我们便将实施我们最为大胆的计划，以军队统治我们的太平洋国新“盟友”，使我们不必再通过不甚可靠的外国合作者保护这颗太平洋上的宝石。作为日本帝国主义野心与共荣圈的最高成就，我们将不惜一切代价，在海军军政府治下维护法律与秩序，以便我们能从新的美国臣民身上榨取全部的利益。"
 CAL_emperor_of_our_own:0 "美式菊花王座？"
 CAL_emperor_of_our_own_desc:0 "如今的太平洋国已由帝国海军全权接管，本土政府也已经过了大换血，直接听从于日本人的命令，于此情形下，部分雄心勃勃又忠心不二的军官便提出册封一位皇室宗亲来统御太平洋国。接受册封的皇室亲王将成为驻美帝国特使兼美国国王，并效仿日本天皇进行统治，以文化象征的名誉形象在美国属地与日本政府、社会间构筑起一道如万世一系的天皇般长久的纽带。不过，至于具体的人选，目前尚在商议之中……"
 CAL_port_of_the_pacific:0 "日本海军之港"
 CAL_port_of_the_pacific_desc:0 "美国太平洋舰队曾经是太平洋上天花板级别的存在，其炮火足以令日本等国的海军望而生畏。不过，二次美国内战的混乱以及随之而来的舰队分裂，让我们失去了许多珍贵的船只，我们现如今的海军实力同之前相比简直叫人贻笑大方。为了太平洋航运的安全，也为了巩固太平洋国在日本帝国眼中的地位，[CAL.GetLeader]下令对我们的造船厂进行新一轮的整修工作。\n\n洛杉矶、旧金山、西雅图等地的港口在将在海军大将的指导下实现军事化，为美日两国生产武装舰船。太平洋的新守护者不仅能更加轻松地保护其控制下的海上航线，而且太平洋国海军自卫能力的提升还能减轻前者的负担，这完全就是一幅双赢的局面嘛。此外，任何有关日本海军利用港口来实现永久占领的言论都将以叛国罪论处。"
