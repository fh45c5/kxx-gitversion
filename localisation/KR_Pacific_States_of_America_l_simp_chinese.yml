 pacificstates.22.t:0 "美国重归统一"
 pacificstates.22.d:0 "历经漫长的斗争，美国终于重归一统。暴君麦克阿瑟被打倒了，国家的叛徒业已尽数泯灭。星条旗高傲地飞扬在东西海岸之上，此刻，所有人都拥抱起宝贵的自由。"
 pacificstates.22.a:0 "终于！"
 pacificstates.23.t:0 "美国决定保护我们"
 pacificstates.23.d:0 "[From.GetNameDefCap]决定保护我们免受太平洋上其它国家的攻击。"
 pacificstates.23.a:0 "谢了，山姆大叔！"
 pacificstates.24.t:0 "美国的保护"
 pacificstates.24.d:0 "[From.GetNameDefCap]决定保护我们免受太平洋上其它国家的攻击。"
 pacificstates.24.a:0 "谢了，山姆大叔！"
 pacificstates.25.t:0 "[From.GetNameDefCap]希望加入协约国"
 pacificstates.25.d:0 "[From.GetNameDefCap]大使求见国王和首相，希望能让[From.GetNameDefCap]加入协约国。我们应该接受美国的提议吗？"
 pacificstates.25.a:0 "当然！我们欢迎他们"
 pacificstates.25.b:0 "我们不需要他们"
 pacificstates.26.t:0 "[From.GetNameDefCap]拒绝"
 pacificstates.26.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 pacificstates.26.a:0 "他们做了个糟糕的决定"
 pacificstates.27.t:0 "[From.GetNameDefCap]想要加入帝国公约"
 pacificstates.27.d:0 "[From.GetNameDefCap]大使求见皇帝陛下与总理，希望能让[From.GetNameDefCap]拥入帝国公约的怀抱。我们应该接受这个美洲国家的提议吗？"
 pacificstates.27.a:0 "当然！我们欢迎他们"
 pacificstates.27.b:0 "我们不需要他们"
 pacificstates.28.t:0 "[From.GetNameDefCap]拒绝"
 pacificstates.28.d:0 "[From.GetAdjective]政府拒绝让我们加入他们的阵营。可能是嫌弃是我们不够强大，没资格与他们为伍，也可能是我们真的不配做他们的盟友。不论如何，他们的回复显然是不。"
 pacificstates.28.a:0 "他们做了个糟糕的决定"
 pacificstates.29.t:0 "[From.GetNameDefCap]想要和日本结盟"
 pacificstates.29.d:0 "[From.GetNameDefCap]大使求见总理大臣，希望能在美日间缔结同盟。我们应该接受美国的提议吗？"
 pacificstates.29.a:0 "当然！我们欢迎他们"
 pacificstates.29.b:0 "我们不需要他们"
