 KX_california.47.t:0 "扩大西部自由堡垒"
 KX_california.47.d:0 "自从我们从东部失败的联邦政府中独立以来，我们的自由独立共和国就一直在[CAL.getleader]总统的带领下追寻太平洋之梦，以挽救我们的子民。然而，在新共和国内部局势稳定，以及新民主体制将旧美国的衣钵融入新太平洋现况后，许多鹰派人士——他们一直是坚定的美利坚帝国主义者——建议我们再次望向边界之彼方。虽然我们从中立状态中获益匪浅，但太平洋海岸的边界上下都是各种仍未发掘出的财富，或许能够将我们的天堂建设到新高度。我们是该追求国家之雄心，还是就这样维持光荣孤立呢？"
 KX_california.47.a:0 "维持太平洋孤立主义，专心完善我们的共和国"
 KX_california.47.b:0 "为了我们的共和国，扩张到其它太平洋海岸！"
 KX_california.47.c:0 "我们将在日暮共和国的温暖光辉中找到和平与繁荣！"
 KX_california.47.e:0 "我们不断扩大的乌托邦蜂巢将终结太平洋的贫困"
 KX_california.47.f:0 "赫斯特理想约束下的新美利坚将从西方破晓！"
 KX_california.47.g:0 "我们的防御联盟扩大之后又能有百万性命得救"
 KX_california.48.t:0 "喘息之机"
 KX_california.48.d:0 "以触及每一位天选之民的心与灵的方式建立起由灵界及其智慧引领的启蒙升华之天国远非一件容易的事，需投入不计其数的资源方能达成，但它的回报绝对物超所值。虽然政府内的多数人都满足于现状，然而还是有一小批鹰派和灵性论狂热者想要达成更大的目标，天天大声叫嚷着要把我们的“后变”之经验传遍太平洋世界，让我们的启蒙之秩序走出国界，把北美太平洋沿岸的所有居民全部统一在我们的超自然指引之政权之下。那么，我们是要遵从这一军国主义团体，带着我们的思想挺进加拿大和墨西哥，还是安安稳稳地留在加州，和平地追逐自己的灵性乌托邦呢？"
 KX_california.48.a:0 "我们要在这安安稳稳地做自己的加州梦"
 KX_california.48.b:0 "我们的天才智慧将照亮整个太平洋海岸！"
 KX_california.49.t:0 "我们的旗帜"
 KX_california.49.d:0 "既然稚嫩而自由的日暮共和国已经建立了起来，那么我们就理应拿出一面能代表我们新国家的旗帜出来。第一种方案是以加州的旗子为底，配以日暮图案。第二种方案虽不走寻常路，但仍抓住了日暮共和国的精髓：完美的日暮图像。那么，我们要选择哪一面旗子呢？"
 KX_california.49.a:0 "选择第一个设计！"
 KX_california.49.b:0 "第二个设计更能代表我们的共和国"
