 CAL_Norton_Legacy:0 "诺顿一世的遗产"
 CAL_Norton_Legacy_desc:0 "对于很多人来说，约书亚·诺顿就是个疯子，疯到了没有任何才干就敢自封“美利坚皇帝”的地步。但是他可不疯，我们必须教导国民诺顿一世是一个伟大的人，他理应登上皇位。各个政府大楼都会树立他的雕像，悬挂他的画像。是时候纪念我国未被传颂的英雄了。"
 CAL_Imperial_Nationalism:0 "帝国骄傲"
 CAL_Imperial_Nationalism_desc:0 "没有我们的皇帝的权力，我们的国家将枯萎和死亡；就像古老的共和国一样枯萎、死亡。所以，人们要为皇帝建造雕像和纪念碑，并建造一座巨大的宫殿来纪念他；他的头像会出现在每一枚硬币、每一张证书和每一张钞票上。这样，我们才能充分地表达我们皇帝的尊重。"
 CAL_Nobility_idea:0 "新贵族"
 CAL_Nobility_idea_desc:0 ""
 CAL_Pacifican_Dream:0 "太平洋国之梦"
 CAL_Pacifican_Dream_desc:0 "尽管有些人可能还在继续谈论所谓的“美国梦”，但无论他们所描述的是什么，现在肯定已经不复存在了。而现在，迪士尼没有恢复他们死去的梦想，而是转而去创造一个新的梦想，一种新的精神。太平洋国的梦想存在于我们所有人的心中，一个生活在一块艺术家不会害怕审查的土地上的梦想；在那里，科学家不会被琐碎的道德所束缚；在那里伟大不会被渺小所束缚！"
 CAL_Pacifican_Dream2:0 "太平洋国之梦"
 CAL_Pacifican_Dream2_desc:0 "尽管有些人可能还在继续谈论所谓的“美国梦”，但无论他们所描述的是什么，现在肯定已经不复存在了。而现在，迪士尼没有恢复他们死去的梦想，而是转而去创造一个新的梦想，一种新的精神。太平洋国的梦想存在于我们所有人的心中，一个生活在一块艺术家不会害怕审查的土地上的梦想；在那里，科学家不会被琐碎的道德所束缚；在那里伟大不会被渺小所束缚！"
