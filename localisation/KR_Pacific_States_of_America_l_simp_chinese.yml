 CAL_eompwer_the_council:0 "授权理事会"
 CAL_eompwer_the_council_desc:0 "现在我们已经充分得到授权，我们可以开始削弱总统的权力。囊括了罗伯特·马休、诺亚·迪特里希、杰克·里尔、弗兰克·威廉·盖伊等休斯的一众好友、盟友在内的商人理事会，是最近各代表团中最大的经济支柱，为其赋予更多的权力不仅可以赢得民众的好感，还能把性情古怪的休斯排挤出权力中心。"
