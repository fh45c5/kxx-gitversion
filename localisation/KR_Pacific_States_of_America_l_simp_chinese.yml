 pacificstates.2000.t:0 "小伙子们的新饮料"
 pacificstates.2000.d.a:0 "为了帮助快速发展经济，同时支持战争，位于旧金山的贝尔法斯特饮料公司最近宣布推出一款名为贝尔法斯特根汁啤酒的新型汽水。贝尔法斯特根啤在西海岸上下爆发式的流行，已经成为太平洋国的标志性饮料，甚至开始在我们的外国贸易伙伴日本和整个协约国中热销，刺激了我们的民用经济。为了弘扬民族精神，贝尔法斯特饮料公司甚至与太平洋政府达成协议，将这种新型汽水军粮的一部分，分配给我们在第二次美国内战中的前线与极端主义军队作战的部队。事实证明，这一举措取得了巨大的成功，落基山脉各地的部队在这些含糖的棕色苏打水中找到了自己的精神支柱——一种冰冷但又能迅速缓解战争恐怖的物质。部队通常将这种饮料称为“马克杯”——这是“伯克利斗牛犬”步兵师的小伙子们为这种饮料创造的速记假名，并在整个军队中传播——这些根汁汽水配给提振了士兵的士气以及公众对我们政府和酿酒公司的看法，而最近的热销也给我们的经济带来了一小段增长。正是像这样的美式产物能够帮助我们忘记战争——即使只是短暂的，因为我们将在另一天为捍卫美国民主而战斗。"
 pacificstates.2000.d.b:0 "为了帮助太平洋地区的经济快速发展，位于旧金山的贝尔法斯特饮料公司最近宣布推出一款名为贝尔法斯特根汁啤酒的新型汽水。贝尔法斯特根啤在西海岸上下爆发式的流行，已经成为太平洋国的标志性饮料，甚至开始在我们的外国贸易伙伴日本和整个协约国中热销，刺激了我们的民用经济。为了弘扬民族精神，贝尔法斯特饮料公司甚至与太平洋政府达成协议，将这种新型汽水作为军粮的一部分，分配给与我们的前邻旧友接壤边境上的部队。事实证明，这一举措取得了巨大的成功，落基山脉各地的部队在这些含糖的棕色苏打水中找到了恢复活力的东西——从守卫边境的平凡任务中得到了短暂的喘息。部队通常将这种饮料称为“马克杯”——这是“伯克利斗牛犬”步兵师的小伙子们为这种饮料创造的速记假名，并在整个军队中传播——这些根汁汽水配给提振了士兵的士气以及公众对我们政府和酿酒公司的看法，而最近的热销也给我们的经济带来了一小段增长。正是像创造“马克杯”这样的小事，帮助我们的人民认清了太平洋之梦的光芒和真相——即使这需要时间来实现。"
 pacificstates.2000.a:0 "一个得到认证的“马克杯”时刻。"
 CAL_japanese_colony:0 "我们是日本的殖民地！"
 pacificstates.364.t:0 "皇室的提议"
 pacificstates.364.d:0 "由于我们的生死存亡和社会安危与日本及其君主制如此紧密地交织在了一起，许多顽固的日本人与天皇的效忠者建议我们应当让我们同日本间的“伙伴关系”再进一步。日本人提出要在我们的领土上制造一个曾经位于京都的高御座的复制品，将其作为一个新立的傀儡君主国国王的王座，同时为此提供慷慨的军事与经济刺激计划作为回报，他们正在向我们施压，让太平洋国成为东方升阳光芒之下的一个附庸王国。如果我们接受了这一交易，我们将完全屈从于日本人，我们最后的一点独立性也将消失殆尽，但作为回报，我们将得到同他们的强权几乎平起平坐的地位，这将使我们在共荣圈内超越大多数其他国家，成为日本最坚定的臣民与盟友。当我们在东京的英明而仁慈的指导下受其完全统治之时，难道这数不清的繁荣与安定不值得拿仅存的美国精神碎片去交换么？尽管似乎最后还是由我们的政权决定，但日本已与我们本国的政权如此紧密地结合在一起，并且他们业已掌握了大部分权力，许多人怀疑我们是否真的有发言权可言。"
 pacificstates.364.a:0 "接受协议，加冕秩父宫雍仁亲王"
 pacificstates.364.b:0 "接受命运，加冕高松宫宣仁亲王。"
 pacificstates.364.c:0 "屈膝，迎接闲院宫载仁亲王的登基。"
 pacificstates.364.e:0 "太平洋国不需要皇室——不管我们的主人是谁。"
