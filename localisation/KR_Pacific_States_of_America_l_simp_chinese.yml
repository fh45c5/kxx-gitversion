 pacificstates.359.b:0 "赞美麦克法登！"
 pacificstates.3591.t:0 "和麦克法登一起健身吧"
 pacificstates.3591.d:0 "毫不夸张的说，伯纳·麦克法登的一生即是无数人梦寐以求的完美“美国梦”的范本：一路从最底层打拼而来，最终取得了常人难以想象的成就。伯纳·麦克法登原名伯纳德·阿道弗斯·麦克法登，1868年8月16日生于密苏里州的米尔斯普林，这位日后的“体育文化之父”的童年可谓是充满了艰辛：天生体弱多病，十一岁时又父母双亡，可怜的孩子只得做农活糊口。不过，算是因祸得福吧，几番劳顿下来，麦克法登的身体状况大幅好转，但好景不长，后来他搬到了圣路易斯从事文书性质的工作，健康状况又开始反复，他自己用“残破不堪”来形容彼时的状态。与死神一次次的擦肩而过刺激到了麦克法登，他开始用哑铃锻炼身体，每天还会抽出时间来散步，饮食也换成了新鲜的水果蔬菜和全麦面包。麦克法登志存高远，又醉心于体育健身，所以当他读到威廉·布莱基的《如何变得强壮，如何保持强壮》时，便立马跑去读了个高等文凭，然后和摔跤冠军乔治·巴普蒂斯特合作，在伊利诺伊州的邦克山担任足球和摔跤教练。在创办那本让其一举成名的杂志、开始自己的健身圣战之前，麦克法登就在名片介绍中使用了体育文化一词——“伯纳德·麦克法登：运动理疗师、高等体育文化教师”，而那句脍炙人口的名言“弱小即是罪孽，远离罪孽从我做起！”也是出自这一时期。\n\n在走遍美英两国并且更名换姓后，麦克法登这位体育文化大咖回到了纽约，于1899年在出版的多本健康著作以及于各地设立的“体育文化俱乐部”之基础上推出了自己最伟大的创造：《体育文化》杂志。《体育文化》向大众传递了麦克法登的健康生活理念，任何一位美国人，只要有心强身健体，都可循着这套理念实现自己的目标。麦克法登还另外一份杂志《美丽与健康》专门在女性间宣传健康理念，虽然这本杂志后来并入了《体育文化》之中，但其探讨的内容对于其本人来说意义非凡，他为此还在英国举办了一场比赛，寻找“全英国最完美的女性标榜”，也正是在这场比赛中，他结识了自己的妻子玛丽·威廉姆森。虽然两人性格迥异，偶尔还因麦克法登的强烈占有欲以及公司内部的花花新闻出现过一些小插曲，但这一结合总体还算得上幸福，两人育有多名孩子，也经常被誉为健身家庭之典。\n\n麦克法登的商业帝国逐步壮大，并且在于纽约的麦迪逊广场花园举办了首届大型健身比赛后其发展势头更是一发不可收拾，每天寄来《体育文化》杂志的来信堆得满满当当，他也因此创办了许多新杂志，其中最出名的当属《真实故事、真实推理，真实故事、真实浪漫》。除此之外，麦克法登还参与过各式各样的活动，例如在新泽西州米德尔塞克斯县的门罗镇创建“体育文化城”、开办提供教育服务的“理疗馆”乃至寄宿学校、军校等。这段时期的麦克法登还试过竞选纽约市长，虽然最后铩羽而归，但也和诸如富尔顿·奥斯勒、乔治·萧伯纳、厄普顿·辛克莱、爱德华·朗斯特里特·博丹，还有已故的富兰克林·德拉诺·罗斯福等商界、文化界、政界的大佬搭上了线。\n\n不过，麦克法登的健身之路也夹杂着种种批评，例如《时代》杂志上的“身体之爱”等嘲讽、揶揄之词，还有医生们对这位“怪咖”行为危险性的警示。因为小时候差点死于打疫苗，所以这位体育文化之父非常排斥医学界的主流共识，还召集追随者一同抗议“医疗兵”等权威。在麦克法登看来，圆满的人生离不开健康饮食、间断节食、规律锻炼、空气浴及日光浴、拒绝烟酒及各类药物、性方面的阳刚之力，以及对于交合的开放态度。麦克法登把自己的所有理论汇集成了一套半宗教性质的学说——“万物秩序主义”，并声称自己可以战胜任何疾病，活个一百五十年也不成问题。如今的麦克法登虽年事已高，但身体矍铄、精力充沛，看来他的传奇故事会继续进行下去。"
 pacificstates.3591.a:0 "让美国变得健康吧！"
 pacificstates.3592.t:0 "山丘上的完美体育新城？"
 pacificstates.3592.d:0 "伯纳·麦克法登曾竞选过纽约市的市长、佛罗里达州的议员，以及家乡新泽西州的众多基层政府职位，可以看出，东海岸既见证了他的大部分人生履历，也是他所希望的归宿所在。麦克法登曾尝试过在新泽西的门罗镇创办万物秩序社区，最终以失败收场，而如今，他旧情重燃，想要再续公社乌托邦之梦，利用政府资金建设一座新都，而至于其名字嘛，那当然是最早规划中的“体育文化城”了。那么，我们是要讨好总统，拨出足够的资金，建起这座身体疗养与性爱之城呢，还是好好管教管教他，让他把精力都放在内政和实务上呢？"
 pacificstates.3592.a:0 "于目前的首都建立完美体育之城"
 pacificstates.3592.b:0 "于新泽西州再建体育文化城！"
