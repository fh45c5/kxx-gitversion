 CAL_cult_of_personality_desc:0 "尽管迪士尼精心培养了自己的个人崇拜，但他大受欢迎的形象绝大多数时候甚至不需要特意宣传。因为迪士尼的真正成就足以令他受到尊敬，他的作品是对太平洋国的繁荣不可或缺的。纵使时间推移，迪士尼的形象也不会被玷污，因为关于他伟大的神话、传说和故事将代代相传！"
