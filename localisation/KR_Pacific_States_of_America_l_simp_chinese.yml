 calpeaceout.23.t:0 "日本人的狗腿子再起不能"
 calpeaceout.23.d:0 "太平洋国这一日本人的傀儡已经屈膝投降，现在我们有了谈判的砝码，可以用一纸和约吞并太平洋政府控制下的土地了。虽然通过对话达成停火无疑是最直接的选择，但军方指挥部中也有人坚持认为，只有给小日子一点颜色瞧瞧，让他们掂清自己几斤几两，我们才可高枕无忧。最终的决定仍在讨论之中，不过无论结果为何，太平洋地区的权力平衡都将彻底改变。"
 calpeaceout.23.a:0 "我们对条款很是满意，毕竟加州才是大头嘛"
 calpeaceout.23.b:0 "小日本必须要付出代价"
