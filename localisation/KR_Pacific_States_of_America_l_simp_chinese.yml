 pacificstates.365.f:0 "我们只能让我们的恩主为我们做决定"
 pacificstates.366.t:0 "我们的“殖民”已有成效"
 pacificstates.366.d:0 "终于，经过长期的叛乱镇压和推行严格的日本化政策，太平洋沿岸的美国各州终于开始屈从于菊花皇座的意志。随着太平洋军政府继续在当地扩大旭日的影响力，许多人开始琢磨起了通过将皇室成员置于新设立的傀儡王座之上，将太平洋国完全纳入大日本帝国的想法。然而，这样的举动可能会进一步激怒我们的美国臣民，甚至可能危及皇室成员的安全。但是，如果我们能尽力扩大旭日以及皇室的影响力，完成这项计划将使我们更接近于完全控制这些新的外国臣民和富饶的新土地。我们该怎么办？"
 pacificstates.366.a:0 "就派天皇陛下的弟弟雍仁吧"
 pacificstates.366.b:0 "高松宫宣仁亲王更受海军的偏爱"
 pacificstates.366.c:0 "我们必须安抚陆军，派闲院宫载仁亲王去"
 pacificstates.366.e:0 "我们不能冒着让皇室家族被刺杀的风险。继续维持当前政府统治。"
 pacificstates.14.f:0 "巴里·戈德华特"
 pacificstates.18.e:0 "阿梅莉亚·埃尔哈特！"
 pacificstates.3590.t:0 "哈伯德的“科学教”势力崛起"
 pacificstates.3590.d:0 "尽管爱德华·朗斯特里特·博丹在灵性论运动中占据主导地位，但他并不是唯一一个渴望统治新美国的人。他的长期盟友兼竞争对手、年轻的煽动家L·罗恩·哈伯德时常表述出想亲自领导国家的愿望，而他麾下的科学教在灵性论运动中也在不断壮大，影响力与日俱增。虽然他对灵性论运动的贡献不小：他的科幻作品构成了我们新启蒙民族文化的一部分，但在这个急切的年轻人变得野心勃勃而无法掌控之前，令他谨守本分也不失为明智之选。"
 pacificstates.3590.a:0 "扼杀哈伯德和他的野心，让这位年轻的作家就此止步"
 pacificstates.3590.b:0 "放着他们不管又能怎么样？"
 pacificstates.40.f:0 "我就待在这！"
 pacificstates.4005.t:0 "换换风景？"
 pacificstates.4005.d:0 "随着罗恩·哈伯德逐渐巩固对国家的控制，他已经开始为我们的灵性论“科学教”运动和整个国家建造一个新的总部。黄金基地，黄金，黄金时代产物，随便怎么说，总之这个由围墙严密守卫的基地位于洛杉矶北部，加利福尼亚州的圣哈辛托，已经成为了咱们领导人的新行政中心。海洋机构，也就是哈伯德政权的内环人士，已经全部迁移到了该地点。虽然这片基地仍在建设中，但它很快成为哈伯德在世界上最喜爱的场所，而且在先知的领导下，它也将成为美利坚未来的新纪念碑。我们是应该把国家的首都也迁往这个基地，还是应该保留现状？"
 pacificstates.4005.a:0 "维持首都不变，并继续开展建设工作"
 pacificstates.4005.b:0 "希坦在黄金基地呼唤我们！现在就迁都！"
 POLITICS_HARRY_BAALS_DESC:0 "很少有人预料到，这位相对不那么知名的韦恩堡市长会成为总统。但他成功地利用了共和党同僚间的分歧，将自己标榜为了团结与稳定的候选者，承诺采取经典的共和党政策，如降低税收和促进大小企业的发展，他的个人风格受到了其本人在韦恩堡工作中的启发——在全国开展大规模的下水道改造项目。他成功地代表了共和党建制派，似乎也说服了选民。事实证明，他的竞选口号“为我们的哈里·巴尔斯感到骄傲”在选民中颇受欢迎，而出乎众人意料，在许多美国年轻人当中亦是如此。"
 pacificstates.9.f:0 "哈里·巴尔斯！"
 POLITICS_CULBERT_OLSON_DESC:0 "卡伯特·奥尔森一生中既面临着作为摩门教政治家参选的耻辱，又面临着作为无神论者参选的耻辱。在加州担任州长时，卡伯特不得不面对长期以来关于摩门教徒与美国政府有血海深仇的谣言。奥尔森在通过医疗保健立法和允许非美利坚社会党的社会主义者组织的州长任期内表现出色。到了全国竞选时，卡伯特已经成为了一个无神论者，并面临着第二场艰苦的战斗。党支持了他，最终他的竞选组合使他得以进入白宫。"
 POLITICS_JOHN_GELLATLY_DESC:0 "在俄勒冈州本顿县破产后，约翰·亚瑟·格拉特利以负责任的财政保守主义者而闻名。在1918年当选华盛顿州参议员后，格拉特利在20世纪20年代和30年代多次竞选州长，最终在“36年危机”期间成功担任副州长一职。太平洋国的建立需要一个可靠且并无争议的共和党候选人，格拉特利就是他们的最佳人选。"
 POLITICS_HOWARD_HUGES_DESC:0 "霍华德·休斯是出身在由一个由部长和发明家组成的美国家庭，他精通各种工程并因此走出了中西部。在父母不幸去世后，年轻的霍华德获得了一笔巨额的家族财富和马里兰州的一家医疗机构。利用这笔巨额财富，霍华德创建了苏玛工具公司，这是一家生产精美工业工具的公司。收益被用于霍华德的好莱坞剧本，包括奥斯卡奖得主《世界属于你》。最后霍华德步入加利福尼亚州的共和党政坛，他在一众富豪中脱颖而出。从雷电华电影公司到一系列的客机，霍华德在承诺完成科罗拉多州的博尔德大坝并使各州电气化的情况下当选。"
 POLITICS_FRANK_MERRIAM_DESC:0 "弗兰克·梅里亚姆是一位内战老兵的儿子，出生在爱荷华州，他本计划在中西部从事法律工作。当看到加利福尼亚共和党的崛起时，弗兰克将他的事业转移到了西部。梅里亚姆在加州竞选时击败了美利坚社会党，解决了码头工人罢工的问题，甚至击败了成为民主党州长提名的厄普顿·辛克莱。尽管如此，传统的共和党报纸还是抵制了梅里亚姆的税收改革。在麦克阿瑟上台后，这些报纸中的大多数都被赫斯特命令去抨击所有共和党人。梅里亚姆得以利用公众对赫斯特和麦克阿瑟的不满来获得行政席位。"
 POLITICS_FLETCHER_BOWRON_DESC:0 "弗莱彻·鲍伦是加利福尼亚人，也是一位参加过尼加拉瓜战争的老兵，在共和党政治家中与拉美人有着特殊的关系。他是洛杉矶第一位支持五月五日节游行的市长，也是一位主张将涉嫌犯罪的激进分子监禁的人。这一点加上鲍伦对有组织犯罪的追查，给强硬派共和党人留下了深刻的印象，这足以让他承担更大的责任。"
 POLITICS_ROBERT_TAYLOR_DESC:0 "罗伯特·泰勒·琼斯最初是田纳西州的一名土木工程师。琼斯参与的最重要的项目是巴拿马运河。西部民众用建筑的繁荣将琼斯吸引到了亚利桑那州，在那里他通过一个建设性的平台进入了民主党政坛。在36年危机期间他担任亚利桑那州州长时，琼斯与试图将该州推向叛乱的美利坚至上党和美利坚社会党候选人进行了斗争。可悲的是，当麦克阿瑟到来时，叛乱被迫降临到该州，一些民主派政客背叛了共和国，实行专制。谢天谢地，琼斯与真正忠诚的民主党人重新联络，并参加了国家公职竞选。"
 POLITICS_CLARENCE_MARTIN_DESC:0 "克拉伦斯·马丁在1932年华盛顿州的一次将许多共和党人逐出政府的重要选举中崭露头角。虽然克拉伦斯可能是在一次内阁大换血中混入政府的，但他在华盛顿有着老资历，扶植过小企业，有着异常崇高的话语权。克拉伦斯在原则上是拒绝在竞选中夸大其词或迎合民粹主义倾向的，并通过赞助必要的民用工程项目在华盛顿参议院中大放光彩。由于民主党能够从整个西部共和党人手中夺取民用工程的主动权，使得克拉伦斯在政治上获得了好处，让其在36个国家获得的选票比华盛顿的加纳还要多。一些民主党人对麦克阿瑟的背弃只会使克拉伦斯的忠诚度更加突出，他被提名为行政主席的可能性也更大。"
 POLITICS_OSWALD_WEST_DESC:0 "奥斯瓦尔德·韦斯特很幸运，因为他出生在加拿大，而在麦克阿瑟崛起后成立的临时政府并没有指定只有土生土长的美国人才能担任公职。从俄勒冈州的土地代理人开始，奥斯瓦尔德·韦斯特总是勤奋地工作。作为州长，韦斯特见证了妇女选举权、工人权利、甚至州禁酒令的通过，这些都大大增强了民主党在该州的势力。在没有联邦资金支持的情况下，韦斯特主动为州公路系统提供资金，成功地完成了公共项目。他更狂热地提议关于禁酒的保守民主党法案，甚至授权绝育作为对违反道德规范的惩罚。"
 POLITICS_CHARLES_SPRAGUE_DESC:0 "斯普劳格是一位报业大亨和企业主，以报纸评论员的身份从俄勒冈州政坛起步。他的文章在全国范围内转载，并因倡导小企业、国际化和财政保守主义而闻名，许多人期待他进入民主党政坛。斯普劳格却以共和党人的身份参选，并成功赢得了支持财政保守和积极的公平施政的民主党选民支持。出乎众人意料，许多美利坚社会党的选民也投票选他为州长，因为他支持他们的就业计划。他的这一立场在共和党内也受到鼓励，并最终使他在整个西部获得支持。"
 POLITICS_RALPH_CARR_DESC:0 "作为胡佛共和党的追随者，拉尔夫·卡尔在科罗拉多实行的政策财政方面较为保守，社会方面则较为融合。虽然卡尔确实部署了国民警卫队来结束36年的绿山大坝罢工，但在太平洋国内部，卡尔却拒绝监禁激进分子。甚至赦免了几名未经指控就被逮捕的美利坚劳工联合会领袖。在其他人都在挑战法律底线的危机时刻，他最终成为了一名宪政主义者。卡尔能够在共和党内利用这一点来确保提名并最终赢得选举。"
 POLITICS_JOSEPH_LEE_DESC:0 "约瑟夫·李是犹他州第一批强硬右翼共和党人之一，在摩门教徒被允许进入代表大会后不久就进入了工团政府。当其他人以宗教理由抵制征兵时，李却选择参军入伍，并最终在退伍军人养老金耗尽结余后陷入生活困境。李作为共和党人竞选州长，承诺提高退伍军人的报酬，熟悉了政治上的老家伙网络。这个老家伙网络中的亲美利坚至上党的W·斯库森警长在一个非法赌博窝点被抓获后，导致他险些被解雇。此事过后，李倡导财政保守主义，并主张接纳所有宗教右派团体进入共和党圈子，而这最终使他被提名担任最高职位——总统。"
 POLITICS_MONRAD_WALLGREN_DESC:0 "沃尔格林在从政之前干着商业管理和赌球房贷的勾当。平易近人的态度帮助风度翩翩的他在华盛顿开始了政治生涯，特别是为他在1936年的选举中提供了莫大帮助。州参议院看到沃尔格林在国家安全中发挥积极作用，主张限制激进分子的宣传。而沃尔格林立场坚定，在以前的民主党报纸在开始支持麦克阿瑟后，他同美利坚社会党和美利坚至上党一起被列入黑名单。任职期间，沃尔格林的反对立场最终让他退出了民主党，对此，他只好加入了崭露头角的进步党。"
 POLITICS_CLYDE_TINGLEY_DESC:0 "由于妻子的肺结核病因俄亥俄州的恶劣天气而不断恶化，克莱德·廷利带着她奔赴新墨西哥州进行治疗。廷利对共和党在新墨西哥州的统治感到愤懑，于是开始了倡导医疗改革的从政生涯。作为早期“公平施政”提案的支持者，廷利火速被提拨为新州长并承诺会更合理地使用州政府资金。阿尔伯克基在廷利的领导下开始从大萧条中复苏，甚至就是在全国大部分地区进一步走向颓废之时。他对医疗保健立法的奉献将他推入国家政治，成为一名进步党人士。"
 POLITICS_ARTHUR_LANGLIE_DESC:0 "在西雅图市议会工作了十年后，又在州参议院工作了四年，亚瑟·兰利法是华盛顿历史上最年轻的全国知名政治家之一。在与蒙拉德·沃尔格伦的竞争中败下阵来，兰利法重新振作起来，并最终加入了共和党，赢得了提名。在许多人看来，兰利是一个普通人，是移民精神的典范，他回应了进步派关于为移民权利发声的主张。"
 POLITICS_DOUGLAS_MCKAY_DESC:0 "高中毕业前就开始工作的麦凯，曾以为自己的人生顶点只会是俄勒冈州塞勒姆的一家二手车经销商。然而事实却不是如此，在共和党让他竞选地方州职位的鼓励之下，麦凯最终在1936年当选为州参议员。在这高潮迭起的一年，麦凯却心甘情愿地将他的老支持者抛在身后，转而投向进步党。作为国家高速公路系统建设的倡导者，财政上温和的公平施政者，以及大修公共工程的支持者，麦凯缓和了一些进步党过于激进的行为，并帮助他们拿下自由派的共和党选区。"
 POLITICS_DANIEL_THORNTON_DESC:0 "丹尼尔·桑顿积极参与四健会和土地权力计划，为了经营一个养牛场，他从德克萨斯州搬到科罗拉多州。在州参议院的短暂职业生涯加上他强烈的个性，使他轻松地以共和党人的身份参选州长。由于他的斯泰森帽、牛仔靴和烟斗而闻名，许多报道称桑顿是“共和党的加纳”。在选举期间，媒体似乎将他与理查德·尼克松放在一起进行比较，但他们的相互理解使这位年长的政治家最终得以参选，这在最后起到了关键作用。"
 POLITICS_BOURKE_HICKENLOOPER_DESC:0 "在麦克阿瑟政变后，伯克·希肯卢珀流亡到西部，最初在临时政府内几乎没有得到公众支持。布尔克与威廉·富布赖特合作，帮助共和党进行重组，并推动对加拿大和日本采取孤立主义政策。许多人认为他是一个濒临解体的国家的爱国者，伯克通过保证对美利坚合众国所有的叛徒采取强硬立场而入住了办公室。"
 POLITICS_VICTOR_MEYERS_DESC:0 "维克托·迈耶斯多才多艺，但却很不合群，在早期就被称为“政界的丑角”，在音乐界与政界之间来回徘徊。他坚持民主党在华盛顿反对禁酒令，但在其州长竞选期间，却驾上了一辆啤酒马车，很是滑稽又出人意料。这次失败后，他开始将进步政策与他的天赋才能结合起来以吸引人们的注意。后来迈耶斯向整个西部部落承诺投票权，倡导养老金、儿童福利和失业金制度。他时被严肃以带，时被大肆嘲笑，一个典例就是关于他的建造单层混凝土住房以解决无家可归者问题的独特建议被证明是既古怪又有效的。最终，进步党人士和美国人民都很看重他并把他送进了总统办公室。"
 POLITICS_ANDREW_HOCKENHULL_DESC:0 "霍肯霍尔是一位沉默而谦逊的政治家，他通过坚定地坚持民主党的路线在新墨西哥州的政治舞台上崭露头角。然而，他在1928年转投进步党是一个务实的转变。虽然他没有在1936年赢得州长职位，但霍肯霍尔坚持从事公共服务，直到进步党人被迫选择他。"
 POLITICS_RICHARD_NIXON_DESC:0 "理查德·尼克松是个土生土长的加利福尼亚人，也是一个顽固的贵格会成员，大学毕业后曾试图加入联邦调查局。失败后，尼克松成为加州主要石油公司的律师。尼克松开始与同为共和党人的厄尔·沃伦进行竞争，这种竞争一直持续到国家政治舞台。之后尼克松在太平洋国各州起诉那些涉嫌激进主义的政客，并在对付社会主义者方面有良好的胜诉记录。最后，尼克松在共和党内击败了沃伦，答应给他加州州长的职位以换取全国候选人提名。"
 POLITICS_GEORGE_CRAIG_DESC:0 "乔治·克雷格出生于印第安纳州的巴西县，接受过律师培训，与他最终的竞选对手威廉·詹纳是同班同学。克雷格在36年危机期间服役后，最终将与詹纳竞争共和党的党内提名。克雷格的服役经历包括对抗美利坚社会党并保卫了克莱县，这为他后来的反社会主义倾向提供了依据。作为印第安纳州州长，克雷格改革了州政府，并拒绝为国家公路提供资金以支持当地承包商。"
 POLITICS_VAL_PETERSON_DESC:0 "瓦尔·彼得森在职业生涯的前20年里是内布拉斯加州的一名学校行政人员，他进入美国空军后，被分配到休·巴特勒那里受训，从而开始进入政界。巴特勒最终将他推荐给内布拉斯加州长德怀特·格里斯沃尔德。之后彼得森接替格里斯沃尔德成为州长，并在共和党的权贵阶层中一路高歌猛进。艾森豪威尔认可了这位战友，并在党内提名了彼得森，使他成为全国公认的政治家和总统候选人。"
 POLITICS_JOHN_MCGROARTY_DESC:0 "1862年秋天，麦格罗蒂出生在宾夕法尼亚州的邦克山，是家里12个孩子中的幺子。麦格罗蒂原先从未想过要扬名立万，但命运就是这样的奇妙。工作之初，麦格罗蒂先是涉足了法律领域，后在蒙大拿州的一家矿业公司担任高管，再往后又来到了洛杉矶，成了名记者。在因其对林肯和黑人社区的反思性写作而闻名后，麦格罗蒂开始创作各种书籍、戏剧和话剧，直到1930年代为民主党当选为国会议员。麦格罗蒂参与了1936年的总统竞选，但却在提名一关上败给了加纳，既没拿到总统提名，也没拿到副总统提名，灰心的麦格罗蒂决定退出政坛，回到加利福尼亚重拾新闻工作。然而，在麦格罗蒂能够安定下来之前，第二次美国内战拉开了序幕，他决定再次回到政治中来。再次与民主党一起竞选，这次他横扫民主党，并当选为全国最高职位。尽管麦格罗蒂在竞选中承诺要实现希望和团结，但他是否能兑现这些承诺还是个未知数。"
 POLITICS_WILLIAM_RANDOLPH_HEARST_DESC:0 "威廉·伦道夫·赫斯特对美国的影响是不可低估的。他是美国最大的报纸之一的负责人，可以随心所欲地改变公众舆论。他的耸人听闻和“黄色新闻”策略使他处于出版业的中心，并为他赢得了许多政治分数。事实上，他的影响力也深入到政治领域，足以为他赢得太平洋国的总统职位。最初，他站在进步主义的理想一边，但最终向右偏移，现在作为总统，他的国家民主党已经制定了独裁和右翼措施，许多人担心赫斯特接近成为独裁者。"
 POLITICS_L_RON_HUBBARD_DESC:0 "对一些人来说，哈伯德是一个救世主，对另一些人来说，他是一个疯子，但无论如何，哈伯德意味一件事：强大。哈伯德出身卑微，最终找到了为小说杂志出版社撰稿的工作，他在那里写了很多类型的作品，主要是科幻小说。在一次濒临死亡的经历后，他出版了《神剑》，这本书最初未能获得任何主流的欢迎。然而，在灵性论运动党政变的混乱时期，哈伯德在爱德华·朗斯特里特·博丹身边占据了一席之地，这个人与他的许多激进信仰是一样的。哈伯德的影响力在这部分人中越来越大，直到被爱德华·朗斯特里特·博丹一个疯狂的工团主义枪手杀死后，他最终获得了这片土地上的最高领导地位。许多人仍然认为哈伯德组织了他的杀戮，但现在这已经不重要了。哈伯德是负责人，他将引导人类进入一个更高的存在层面。"
 POLITICS_EDWARD_LONGSTREET_BODIN_DESC:0 "爱德华·朗斯特里特·博丹是一个神秘的人，但作为灵性论运动党的领袖，有人会认为他必须如此。他于1894年出生，在他看来，这是一部起源于16世纪法国恶魔学家吉恩·博丹的家族史的顶峰。年轻的博丹一直表现出对此类主题的迷恋，以及对超自然现象和地外世界的迷恋。他的想法表现在他的“灵性论运动党”上，虽然该党处于美国的政坛边缘，但却吸引了一批热情的追随者。博丹利用美国最近的混乱状态，以此为跳板登上了政治舞台，虽然他得罪了很多人，但一路上遇到了一个忠实的盟友。L·罗恩·哈伯德已经成为博丹的得力助手，在日本支持者的帮助下，两人希望在美国并很快在世界范围内驱除工团主义和盎格鲁君主制这两个恶魔。不过，博丹必须小心：他如此巧妙地将不同的派别统一到一个党内，可能很快就会演变成与国家舞台上一样的内讧。"
 POLITICS_LOTHROP_STODDARD_DESC:0 "洛思罗普·斯托达德在马萨诸塞州开始了他的生活，从很小的时候起，他就表现出非凡的智力。当他长大后，斯托达德在哈佛大学就读，获得了“优等生”的荣誉，并努力攻读历史学博士学位。取得这一成绩后，他加入了几个历史和政治组织，并开始了他的作家工作，并通过支持优生主义和种族主义观点，以解释他所认为的当前文明的衰落。尽管斯托达德有历史和政治学背景，但他非常推崇生物学。他认为这是解释不同人类种族之间关系的关键，也是美国当前困境的因果因素。因此，他的著作同时具有政治和科学观点的特点，主要是关于种族和遗传优势的话题。斯托达德作为作家的知名度极大地帮助了他加入政治舞台的过程，虽然他被视为政治边缘人物，但他的作品在新英格兰几乎家喻户晓。现在他掌管着这个国家，斯托达德拥有他从未预料到的权力，他计划用它来拯救人类文明本身。"
