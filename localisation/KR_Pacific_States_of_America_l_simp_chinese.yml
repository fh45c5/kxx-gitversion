CAL_asio_decision_category:0 "§R日出之地§! §O大洋之国§!"
ASIO_ECONOMIC:0 "§l经济腾飞§!"
ASIO_ECONOMIC_DESC:0 "§l对于相矶藤雄总统来说，他的首要的政治目标，或者说投身政界所追寻的目的如今只有一个：为太平洋国这个新生的国家与脱离内战战火的这片土地上的人民带来富裕而自由的生活。为了达成这个目的，我们的法官总统需要周旋于各大公司之间，与这些巨头们达成合作，甚至求助于他的另一个祖国...§!"
ASIO_POLITICS:0 "§O政治稳定§!"
ASIO_POLITICS_DESC:0 "§O毫无疑问的是，对于美利坚这片土地来说，由一位亚洲人统治还是历史上第一次。尽管太平洋国仅仅是曾经欣欣向荣的美利坚合众国的一个小小碎片，但这片土地显然也未曾做好接受一位亚裔总统的准备。相矶藤雄总统需要做的，就是在即将到来的政治攻击与种族歧视的漩涡中保全自己，维持新太平洋国会的稳定。§!"
ASIO_JAP:0 "§g东洋之命§!"
ASIO_JAP_DESC:0 "§g在与自己的第二个祖国达成联络后，相矶藤雄总统从日本帝国获得了全方位的援助：贸易协议，经济支援，以及...一个“独特的”顾问团。日本帝国从大本营与海陆军中抽调了一批精明能干的军官组成了顾问团到达旧金山，宣称将会为“太平洋防卫”与“保护日本的合作伙伴”贡献力量。然而，这片所谓的善意同时也是来自东洋的警告与监视。§!"
