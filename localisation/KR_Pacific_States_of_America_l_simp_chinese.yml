 CAL_aviation_industry_ideas:0 "航空工业"
 CAL_failed_operation_liberty:0 "冰川行动的余波"
 CAL_failed_operation_liberty_desc:0 "在冰川行动失利之后，失败主义言论迅速在军队中蔓延开来，就连普通百姓也因这次行动收效甚微而感到十分不满。不过，虽然这场行动对士气造成了极大打击，但我们仍从中吸取了许多教训。最高指挥部将结合这些经验，制定一项新的作战计划。希望这项新的计划能把国家从激进分子手中拯救出来。"
 CAL_civil_war_victor:0 "赢得内战，且未签订停火协议"
 CAL_Operation_Liberty_mission:0 "冰川行动"
 CAL_Operation_Liberty_mission_desc:0 "在落基山脉的那一边，内战已经肆虐了太久。西部防务司令部的参谋们认为，为了取得内战胜利，我们的部队必须发起一次大规模攻势，一举夺回大平原地区。马歇尔总司令认为，只要这次攻势取得成功，夺回华盛顿将只是时间问题。然而如果这次进攻未能达成既定目标，我军的士气恐将大受打击，甚至可能导致全线崩溃……"
 PSA_reunited_america_flag:0 "美国重归统一"
 CAL_join_japan:0 "与日本结盟"
 CAL_join_japan_tech:0 "加入理化学研究所"
 CAL_activate_the_Western_Defense_Command:0 "设立太平洋防务指挥部"
 CAL_activate_the_Western_Defense_Command_desc:0 "既然我们已经宣称真正继承美利坚大统，我们的陆军也就顺理成章地成为了真正的合众国陆军。由此引发的一系列的变动不可避免地扰乱了我们军队的指挥结构。为了解决指挥混乱问题，我们将组建西部防务指挥部，这一指挥系统将暂时独立运转，并全权管理内战大局，待我们赢得内战后再重新整合进陆军体系。"
 CAL_prepare_the_artillery:0 "准备炮兵！"
 CAL_prepare_the_artillery_desc:0 "毫无疑问，世界大战中战功最大的兵种就是炮兵，有了火炮的支援，我们的小伙子们才敢发起一次次的冲锋、才能扼杀敌人的攻势。为此，我们将把海军空闲的火炮划给陆军炮兵管辖，同时斥资研发新式火炮、简化现有火炮的生产，以便投入一切可能的炮兵力量支援前线。"
 CAL_defense_logistics_agency:0 "国防后勤局"
 CAL_defense_logistics_agency_desc:0 "美国是一个幅员辽阔的国家，地形地势多样且复杂。我们需要建立一个集中的后勤委员会，以此协调一场横跨美国各种地理环境的大规模战争。"
 CAL_deWitt_in_Charge:0 "德威特的动员"
 CAL_deWitt_in_Charge_desc:0 "约翰·勒塞纳·德威特少将不同于那些急于求成去发动大规模攻势的指挥部成员，他希望能在建立一个稳固的己方阵线的前提下稳扎稳打地对敌方势力进行蚕食。在他看来，缓慢而稳定的推进，再加上一个集权的最高指挥部，定能使我们的国家获得内战的胜利。有了德威特总司令，美国将再次获得自由！"
 CAL_Marshall_in_command:0 "马歇尔-阿诺德计划"
 CAL_Marshall_in_command_desc:0 "乔治·卡特利特·马歇尔准将对当下战局走势做出了一个令人震惊的推演：在他看来，若是我们没法快速的越过落基山脉向东进军，并在中西部找好立足点，那么美利坚最后的民主堡垒最后是逃不过陨落的结局的。为了避免失败，作为总指挥官的他将会尽快组建机动部队、越过落基山脉，以此在内战中获得决定性的优势。有了他大胆的计划，美利坚必会重获自由！"
 CAL_protecting_Columbia:0 "保卫哥伦比亚"
 CAL_protecting_Columbia_desc:0 "陆军战争学院、野战炮兵学院、本宁堡陆军装甲学院等各大军事院校都因内战的摧残而遭到了不同程度的破坏。如今我们取得了内战的胜利，这些军事学院的重建计划也应该被提上日程。有了这些军事院校的支持，我们的军队才能恢复往日的强盛。"
 CAL_military_research:0 "军事研究"
 CAL_military_research_desc:0 "纵然我们有几所世界一流的大学和许多杰出的理论家，我们也没法同时进行太多的研究项目。我们需要为军事方面的研究选择一个指导方向。"
 CAL_weapon_designs:0 "新武器设计"
 CAL_weapon_designs_desc:0 "M1加兰德称得上是一款成功的武器，它在士兵们的手中默默地见证了内战全程。但这款武器并非完美，它的某些缺陷甚至从刚被陆军采用时就一直存在。为此，我们特地整理了这款武器在内战中受到的诟病，并将其转交给了约翰·C·加兰德——这款武器的设计师——并要求他对自己的设计进行改进。在重新设计了枪管、导气机构和前瞄具后，他交上了一份比前代更为可靠、也更为致命的步枪设计。"
 CAL_Army_rangers:0 "陆军游骑兵"
 CAL_Army_rangers_desc:0 "作为一支由专业士兵组成的精英部队，陆军游骑兵们将能够在复杂的地形上执行秘密任务，扰乱敌人的补给线和士气。"
 CAL_90_division_Army:0 "陆军90师扩军计划"
 CAL_90_division_Army_desc:0 "马歇尔最初认为美国需要一个至少265个师的陆军才能保卫其国家利益。但考虑到西海岸的现实情况，这样的计划显然不具备可行性。因此，他决定退而求其次，将陆军理想规模缩减到90个师，这样的陆军规模至少足够击溃内战中的敌人、夺回美国本土了。"
 CAL_motorization:0 "摩托化计划"
 CAL_motorization_desc:0 "随着之前的陆军摩托化计划遭国会否决而流于废纸，美国陆军终于还是沦为了列强中唯一一支没有完成陆军摩托化的部队。马歇尔建议政府现在至少要亡羊补牢，补贴卡车生产商并征用民用卡车，以期尽快建立一支摩托化部队，并以其速度优势对敌人进行出其不意的打击。"
 CAL_tank_production:0 "增加坦克产量"
 CAL_tank_production_desc:0 "西海岸的兵源十分短缺。最高指挥部意识到数量的差距只能用质量来弥补，并决定制定一项计划来每个士兵的平均作战能力。在这项计划数不清的草案中，几乎每一份都将提高坦克产量列为优先事项。装甲作战相对较低的人力消耗和较高的作战效率意味着，坦克将不仅仅是我们减少伤亡的手段，更是我们攻无不克的利器。"
 CAL_Officer_instruction:0 "前线军官培训营"
 CAL_Officer_instruction_desc:0 "马歇尔认为我们应该在前线建立军官培训营，由老牌军官亲自带着那些新来的菜鸟们上前线。这样做的风险固然远大于让他们在远离战火的大后方接受培训，但亲自体验过战场的新生代军官们将获得更多的第一手作战经验，军队底层的领导水平也会有所提高。"
 CAL_recon_units:0 "侦察单位"
 CAL_recon_units_desc:0 "信息就是力量。马歇尔认为，没有信息就等于没有力量，我军就不可能取得美利坚之战的胜利。我们的兵力和武器都不及敌人，但是如果我们知道他们的一举一动，我们就可以用机敏的头脑来抵消敌人的装备优势。"
 CAL_defense_is_the_best_offense:0 "防御就是最好的进攻"
 CAL_defense_is_the_best_offense_desc:0 "为了在即将来临的风暴中站稳脚跟，眼下的第一要务就是改善我们的防御措施。战壕挖掘和工事建设将正式成为我军日常操练内容的一部分，在战争的阴云威胁到我们的家园之前，我们要做好必胜的准备。"
 CAL_logistic_security:0 "后勤保障"
 CAL_logistic_security_desc:0 "后勤保障系统是一个不太为人所知的战场，但如果我们希望在与东部激进分子们的对抗中占据上风，那么后勤保障系统将对我们至关重要。投资建设新的军火厂、给予我军将士足额的弹药，并为我们的后勤部队提供资金，应该会在很大程度上帮助我们实现这一目标。"
 CAL_Expand_the_Presidio:0 "扩建旧金山要塞"
 CAL_Expand_the_Presidio_desc:0 "自旧金山1846年加入美国时，旧金山要塞就一直在我国军事领域扮演着重要角色。当下，旧金山要塞也是最适合我们进行作战指挥的场所，它有着发达的通讯网络来进行军事指挥，也有足够大的空间安置指挥部人员，但最适合不代表完全满足要求，我们需要扩建旧金山要塞来保证我军指挥顺畅。"
 CAL_coast_to_coast_planning:0 "“从海到海”计划"
 CAL_coast_to_coast_planning_desc:0 "随着旧金山要塞扩建完成，德威特提议建立一个作战计划委员会，以方便后方的军事参谋们为前线部队提供他们所需的各类小型作战计划，以此为基础，我们定能将国贼们从西海岸推下东海岸。"
 CAL_increase_military_spending:0 "增加军费开支"
 CAL_increase_military_spending_desc:0 "内战摧毁了美国的民用工业，但同时也让军事工业的利润翻了几番。现在内战虽然已经结束，但美国仍未成为一个无战之国，因此，继续保持乃至进一步扩大内战时期的军费开支水平，才是符合我们最大利益的选择。"
 CAL_bring_the_complex_west:0 "重建军工复合体"
 CAL_bring_the_complex_west_desc:0 "我们的军工企业大都建在国土东部。在美利坚陷入内战泥潭后，原先的弹药工厂和武器制造厂等设施均遭到了不同程度的毁坏。它们或成为轰炸行动的高价值目标，或被用作敌人长期防御的据点。如果我们希望为下一场战争做好准备，就一定要投资重建军工复合体。"
 CAL_Columbia_needs_you:0 "哥伦比娅需要你！"
 CAL_Columbia_needs_you_desc:0 "哥伦比娅是美国的拟人化象征，她的形象是一位头戴弗里吉亚帽、身披星条旗礼袍的女子。哥伦比娅代表了美利坚自建国以来，一直为之努力奋斗的终极目标——自由。现在激进分子已被镇压，暴君也被推翻，但美国人为哥伦比娅效力的使命尚未终结。在战争云雨笼罩世界的今日，只有勇敢的美国人民才能保护我们的国家和那美丽的哥伦比娅。"
 CAL_defense_contracts:0 "国防承包商"
 CAL_defense_contracts_desc:0 "和欧洲各国国防部有着直属的工厂不同，在美国，战争部依靠各个承包商来生产武器，现在我们需要确保承包商们有足够的能力来处理内战带来的各类订单。"
 CAL_crossing_the_rockies:0 "跨越落基山！"
 CAL_crossing_the_rockies_desc:0 "落基山脉，这一壮丽的自然奇观把我们挚爱的西海岸与东方的血腥屠戮分离开来。但我们总有一天要跨过落基山脉、面对山那边的敌人，因为我们的最终目标是再次统一美利坚。既然如此，我们就必须提前做好跨过山脉的准备。"
 CAL_gi_bill:0 "《军人安置法》"
 CAL_gi_bill_desc:0 "大量的复员军人恐怕将成为内战后的一个重大社会问题。我们应该建立教育和职业培训项目，以便这些老兵能够更快重新融入平民生活。"
 CAL_war_bonds:0 "战争债券"
 CAL_war_bonds_desc:0 "我们需要足够的资金来维持这场战争。发行债券是一种时下新兴的筹款方式，我们可以很容易地利用卡通片、电影等流行媒体来推广这些债券。"
 CAL_walkie_talkies:0 "步话机"
 CAL_walkie_talkies_desc:0 "便携式无线电台，也就是俗称的“步话机”，对我们的军队来说是个强力的工具。有了这些小东西，我们的部队就可以随时要求炮火覆盖和空中打击等支援。"
 CAL_navy:0 "美国海军"
 CAL_navy_desc:0 "美利坚海军曾经一度成为世界领先的海军力量。然而在内战爆发之后，海军的很大一部分倒向了东部的叛徒们。我们需要重新清点那些忠于我们的海军力量，并仔细考虑他们在内战中能发挥什么作用。"
 CAL_great_white_fleet:0 "大白舰队"
 CAL_great_white_fleet_desc:0 "“大白舰队”是历史上美国海军实力的巅峰，它的荣光激励着每一代海军人。我们应当重拾往日荣光，建设一支以战列舰与无畏舰为核心的传大舰队，来捍卫美利坚的海权。"
 CAL_protect_american_trade:0 "保护美国贸易"
 CAL_protect_american_trade_desc:0 "贸易是美国的经济命脉，我国海军作战理论也自然应当以保卫海上生命线免遭敌军袭扰为核心。"
 CAL_carrier_projects:0 "航空母舰计划"
 CAL_carrier_projects_desc:0 "航空母舰代表着海军未来的潮流。我们应当投资相关领域研究以便更好地发展国内海军力量。"
 CAL_battle_ships:0 "发展战列舰"
 CAL_battle_ships_desc:0 "战列舰是当之无愧的公海霸主。我们应着手研发能够装载更大的舰炮与优良防空体系的新型战列舰。"
 CAL_battle_cruisers:0 "发展战列巡洋舰"
 CAL_battle_cruisers_desc:0 "战列巡洋舰，是战列舰重火力与巡洋舰机动性的完美结合。我国海军应配备相当数量的战列巡洋舰用于执行常规任务。"
 CAL_coast_guard:0 "美国海岸警卫队"
 CAL_coast_guard_desc:0 "重建海岸警卫队有助于为海上贸易通道提供保障，不法分子将在海面上遭到拦截，陷入危难的人也能得到及时施救。"
 CAL_light_cruisers:0 "发展轻巡洋舰"
 CAL_light_cruisers_desc:0 "轻型巡洋舰的主要职责是为舰队提供防空火力、攻击敌方驱逐舰和摧毁敌方潜艇。我国海军应配备相当数量的轻巡洋舰来维持舰队战力平衡。"
 CAL_naval_aviation:0 "重视海军轰炸机"
 CAL_naval_aviation_desc:0 "海军航空兵将成为未来远洋作战的主力。我们必须确保舰载战机可以在敌人对我方舰队产生威胁之前就将其歼灭。"
 CAL_expand_dockyards:0 "扩大造船厂"
 CAL_expand_dockyards_desc:0 "我国当前的船坞保有量不足以独力应付战争的需要，眼下我们应当建设更多的海军生产设施来供给战时所需。"
 CAL_submarines:0 "发展潜艇"
 CAL_submarines_desc:0 "潜艇可以对敌军运输编队和重型战舰造成重大破坏。我国的潜艇设计应当时刻领先于敌方驱逐舰与反潜战术的发展。"
 CAL_liberty_ships:0 "自由轮"
 CAL_liberty_ships_desc:0 "我国的民用造船厂先前主要是生产商业货轮。这些船厂能够迅速转向大规模运输船生产，让我们可以向遍布世界的盟友送去援助。"
 CAL_new_admirals:0 "新生代海军将领"
 CAL_new_admirals_desc:0 "许多海军将领选择与东方的叛徒同流合污，为保障我国的海上霸权，我们必须培养新生代的海军指挥官。"
 CAL_expand_the_waves:0 "建立海军女子志愿服务队"
 CAL_expand_the_waves_desc:0 "女性可以在海军中承担一些辅助性的角色，以便让男人们专心于战斗任务。此举虽可能在社会上引发争议，但无疑有助于达成我们的战争目标。"
 CAL_expand_marine_corps:0 "海军陆战队改革"
 CAL_expand_marine_corps_desc:0 "海军陆战队是美国全球军事投射能力的缩影。从蒙特祖马大厅，到的黎波里海岸，陆战队永远为国家效劳。我们应该确保他们能得到最先进的装备与训练设施。"
 CAL_naval_training:0 "海军训练"
 CAL_naval_training_desc:0 "尽管安纳波利斯海军军校在内战中被毁，我们仍然有充足的训练设施来培养新一代海军军官与水兵。"
 CAL_urban_warfare:0 "扩建海军陆战队"
 CAL_urban_warfare_desc:0 "我们应该扩建海军陆战队规模，确保他们有能力在全球范围内投射我国的力量。"
 CAL_sempre_fi:0 "永远忠诚"
 CAL_sempre_fi_desc:0 "“永远忠诚”是海军陆战队的格言，作为美利坚自由与民主的堡垒，他们将为世界传播解放的福音！"
 CAL_columbia_gem_of_the_ocean:0 "哥伦比亚，大洋之瑰宝"
 CAL_columbia_gem_of_the_ocean_desc:0 "我国在海军研究与建设领域的广泛投资，使我们重新成为世界领先的海军强国之一。起航吧，为黑暗的世界开辟道路！"
 CAL_air_force:0 "美国空军"
 CAL_air_force_desc:0 "战前的美国陆军航空兵，顾名思义，只不过是陆军的一个分支。在这场新的战争中，我们需要确保陆基航空兵是一个独立的军种，并得到它所需要的各种支持。"
 CAL_build_air_ports:0 "建造空军基地"
 CAL_build_air_ports_desc:0 "虽然工业化的海岸线有许多机场，但在内战中发生大量战斗的农村地区却缺乏空军基地。我们需要建设更多军用机场，以确保我们的部队得到他们需要的空中支援。"
 CAL_air_production:0 "呼啸之鹰"
 CAL_air_production_desc:0 "空降师是一种新的战斗方式，而他很明显会给我们巨大的优势。我们应该建立我们自己的空降部队。"
 CAL_train_pilots:0 "培训飞行员"
 CAL_train_pilots_desc:0 "在这场混乱的战争中飞行员供不应求。我们需要确保有前途的飞行员候选人不被派往前线，而是接受必要的空中作战训练。"
 CAL_army_air_support:0 "陆军空中支援"
 CAL_army_air_support_desc:0 "我们的军事家家一直在研一个新的空战理论：地面支援。在此学说中空军的主要作用是通过轰炸和扫射任务来支持地面部队。"
 CAL_bombers:0 "轰炸机支援"
 CAL_bombers_desc:0 "一支现代化的轰炸机部队将使我们能够消灭敌人的师团而不使我们自己的人处于危险之中，并使我们能够对敌人的补给线和通信造成严重破坏。"
 CAL_air_supremcy:0 "制空权主张"
 CAL_air_supremcy_desc:0 "我们的理论家还提出了一个制空权理论，即飞行员应以阻止敌机攻击我方地面部队为首要目标。"
 CAL_fighters:0 "自由斗士"
 CAL_fighters_desc:0 "现代战斗机的设计将使我们能够把敌空军清除出我们的空域，让地面上的士兵可以自由地摧毁敌陆战部队而不用担心敌人的轰炸。"
 CAL_screaming_eagles:0 "雷达"
 CAL_screaming_eagles_desc:0 "雷达是斯坦福大学和加州理工大学的顶尖学者们研究出的新型侦察装置，许多人相信它会一举改变战争的未来。"
 CAL_expand_wasps:0 "女子飞行队扩招"
 CAL_expand_wasps_desc:0 "女性可以像男性一样驾驶飞机，而且可以执行许多有意义的辅助任务，使得男性可以腾出手来承担其他任务。尽管在社会上存在争议，但这将是赢得战争的宝贵一步。"
 CAL_expand_air_ports:0 "扩大空军基地"
 CAL_expand_air_ports_desc:0 "我们最初扩建空军基地的计划进行得很顺利，但如果我们要赢得在空中的战争，我们还需要更大的机场。我们应该立即把更多的资源用于机场的建设。"
 CAL_rule_the_sky:0 "统治天空"
 CAL_rule_the_sky_desc:0 "我们战胜了敌人，并统治着美国的天空。瞄准目标，飞翔，战斗，胜利！"
 CAL_last_bastion:0 "美利坚民主的最后堡垒"
 CAL_last_bastion_desc:0 "我们是美国自由和民主的最后堡垒。我们现在独自高举自由和民主的火炬。"
 CAL_social_conservatives_in_power:0 "民主党当选"
 CAL_social_conservatives_in_power_desc:0 "民主党赢得了[GetYear]年选举。虽然失去了南方的一些激进派选民（主要转投了至上党和旧民主党），但民主党仍然是很保守的党派，不过现在他们已经温和多了。"
 CAL_red_scare:0 "红色威胁"
 CAL_red_scare_desc:0 "工团主义摧毁了我国一度最具工业生产力的地区。我们必须确保它永远不会在自由的最后堡垒扎根。"
 CAL_anti_unionism:0 "反工团主义法案"
 CAL_anti_unionism_desc:0 "我们必须通过的首批立法之一是新的反工团法案，该法案将防止任何曾经注册为社会党成员的人担任公职。那些以前自称有工团倾向的人，将被政府认为是美利坚自由的背叛者。"
 CAL_support_business:0 "支持企业家"
 CAL_support_business_desc:0 "尽管共和党对资本家的纵容已经走得太远，但我们仍必须确保企业得到政府的适当支持。反工团规章是这条道路上的关键一步。"
 CAL_social_hygiene:0 "社会卫生学"
 CAL_social_hygiene_desc:0 "政府应支持一场公共卫生运动，以预防各种疾病。作为这场运动的一部分，我们将致力于纠正导致疾病的恶习，无论是身体上的、道德上的还是精神上的。"
 CAL_public_schooling:0 "支持公共教育"
 CAL_public_schooling_desc:0 "公立学校必须有足够的资金，更重要的是，它们必须有正确的课程。我们的孩子要了解自由和民主的重要性，以及激进主义和工团主义的罪恶，这才能保障国家的未来。"
 CAL_america_business_is_business:0 "美式公事公办"
 CAL_america_business_is_business_desc:0 "美国的工业是我国的支柱。虽然内战的破坏摧毁了我们一度繁荣的商业部门的大部，但只要政府采取适当的行动，它就能重新光彩照人。"
 CAL_immigration_act:0 "移民法案"
 CAL_immigration_act_desc:0 "虽然有些人可能会说移民是我们国家的支柱，但我们有更紧迫的问题：我们必须让更多的移民迁入我们荒废的国家。重建我们曾经伟大的国家应该是我们的首要问题。"
 CAL_hays_code:0 "海氏准则"
 CAL_hays_code_desc:0 "虽然每个人都喜欢时不时地看上一部好电影，但好莱坞肆无忌惮的道德越轨行为需要得到。为了避免工团分子通过电影传播信息，必须制定一套严格的行为准则约束电影演员和制片人。"
 CAL_american_laisze_faire:0 "自由放任经济"
 CAL_american_laisze_faire_desc:0 "过多的政府干预只会损害重建。我们需要保证，在我们的经济挣扎着从内战中重建时，政府没有过度的干预重建过程。"
 CAL_moral_education:0 "道德教育"
 CAL_moral_education_desc:0 "高等教育长期以来一直是精英阶层的堡垒，而我们应该继续如此。常春藤联盟的名校可不是给那些没有准备好的人待的地方。这些精英学校的名额应该留给美国未来的领导人，这样他们才能接受最好的教育。"
 CAL_new_american_century:0 "新美国纪元"
 CAL_new_american_century_desc:0 "在我们当选以来以来的这段时间里，我们为美国的伟大复兴打下了基础。从内战中重建需要时间，但我们现在可以向世界展示，美国已经准备迎接一个伟大的新世纪。"
 CAL_social_gospel:0 "滴流准则"
 CAL_social_gospel_desc:0 "经济学中有一个简单的事实：财富总会从富有者流向普通人手中，为何不让每个人都理解这一点呢？"
 CAL_soften_regulations:0 "放宽规章"
 CAL_soften_regulations_desc:0 "在这场内战之后，我们最不需要的就是对企业进行不必要的、繁重的监管。我们应该减少繁文缛节，确保企业能够在这些艰难时期取得成功。"
 CAL_labor_management:0 "劳工管理法案"
 CAL_labor_management_desc:0 "糟糕的劳资关系是导致内战的关键因素。我们应该剥夺工会和其他工团组织的权力，同时让企业主真正考虑到员工的利益。"
 CAL_fiscal_reform:0 "金融改革"
 CAL_fiscal_reform_desc:0 "我们需要对金融和银行体系进行全面改革。这个国家在内战之后所需要的是减少繁文缛节、不必要的规章制度和其他阻碍竞争的制度。"
 CAL_bureau_of_the_budget:0 "预算局"
 CAL_bureau_of_the_budget_desc:0 "平衡预算对于任何州的运行都是关键，那些“赤字支出”最后只能造成财政破产。各州应该量入为出，不能多花一分钱。"
 CAL_market_liberals_in_power:0 "共和党当选"
 CAL_market_liberals_in_power_desc:0 "共和党——自由贸易的支持者、各项规章的废除者和金融家的斗牛犬——赢得了[GetYear]年的选举。各位公民可以期待更低的税率，更自由的定价机制和美国敢作敢为的资本主义精神的回归。"
 CAL_settelment_movement:0 "睦邻运动"
 CAL_settelment_movement_desc:0 "睦邻运动在战前时期的英国和美国很流行，这项运动聚焦于让富人和穷人共同居住在“睦邻公寓”，以便更好地了解彼此。在这个艰难的社会时期，我们应该鼓励这项运动的复兴。"
 CAL_small_business_support:0 "帮助小微企业"
 CAL_small_business_support_desc:0 "小微企业是美国经济的支柱，但现在许多这类企业在内战中却都被摧毁了。我们应该研究新的税收政策和其他策略来恢复小微企业的信心。"
 CAL_business_grants:0 "商业补贴"
 CAL_business_grants_desc:0 "大型商业公司也和小微企业一样在内战中大大受损，我们应该让大企业获得和小企业一样的优惠税收政策来提高利润，加速发展。"
 CAL_hollywood_glamor:0 "好莱坞的支持"
 CAL_hollywood_glamor_desc:0 "许多著名的好莱坞演员和制片人都是共和党的铁杆支持者，我们应该大力支持他们产出更多的影片，将共和党的价值观推向全国。"
 CAL_education_philanthropy:0 "教育事业"
 CAL_education_philanthropy_desc:0 "最富有的商人通常就读于少数几所精英大学，比如常春藤联盟、斯坦福大学和芝加哥大学。我们应该设立奖学金，以确保那些普通的平民也能进入这些知名大学学习。"
 CAL_new_liberalism:0 "自由新时代"
 CAL_new_liberalism_desc:0 "共和党的统治让美国的商业再次繁荣，国库里的黄金储备达到了历史的新记录，同时失业率达到了历史最低，股价总值达到了新巅峰并继续增长。这证明了两点：上帝保佑美国！上帝保佑资本主义！"
 CAL_progressive_taxation:0 "自由主义税制"
 CAL_progressive_taxation_desc:0 "理想中，税收应该达到两个目标的平衡：普通公民可以使用自己的税后收入来支持家庭消费和一定的奢侈品消费，而政府则需要足够的税收来支持公共支出。进步党的税收计划希望能达到这两个目标的平衡。"
 CAL_securities_act_desc:0 "许多人担心近几十年来全世界许多政府大规模没收财产的行为会发生在我们身上。我们需要通过立法使公民们放心，私有财产的权利将永远地得到保护。"
 CAL_securities_act:0 "担保法案"
 CAL_gospel_of_wealth:0 "财富的福音"
 CAL_gospel_of_wealth_desc:0 "繁荣的经济会使得每个人都可以改善自己的生活方式。所以我们需要保证最多得的企业家和最困苦的贫农都可以在我们的税务改革和社会法案中得到好处。"
 CAL_trust_busting:0 "取缔垄断"
 CAL_trust_busting_desc:0 "联合工团经常用消灭托拉斯当做自己的口号，因此我们需要在激进派跳脚骂街之前就把那些托拉斯消灭。"
 CAL_free_trade1:0 "支持自由贸易"
 CAL_free_trade1_desc:0 "自由贸易是强大经济的基石。我们应该确保降低关税，与我们的盟友和全球中立国家拆除阻碍自由贸易的关税壁垒。"
 CAL_social_liberals_in_power:0 "民主共和党当选"
 CAL_social_liberals_in_power_desc:0 "民主共和党赢得了[GetYear]年的大选！他们代表了内战之前的共和党进步主义者一派，该党支持自由贸易，进步主义的社会政策还有建立一个温和的福利国家的理想。"
 CAL_country_life_movement:0 "乡村生活运动"
 CAL_country_life_movement_desc:0 "“乡村生活运动”强调回归乡村生活方式，并在那些因内战动乱而对城市生活感到幻灭的人们中越来越受欢迎。我们应该鼓励它，因为它有助于改善被忽视的农村地区的基础设施和工业。"
 CAL_efficiency_movement:0 "增产节约运动"
 CAL_efficiency_movement_desc:0 "三十年前，美国的进步主义浪潮达到了最高峰，而随之而来的则是增产节约运动的兴起——该运动希望减少居家生活还有工作场所的大规模浪费行为。由于经济尚未从近来的冲击中完全恢复，我们需要将此运动重新带入美国人的生活中。"
 CAL_chautauqua:0 "肖托夸运动"
 CAL_chautauqua_desc:0 "肖托夸机构是纽约州北部的一个著名的静修机构，它提倡进步的价值观。我们应该把它的主要思想家介绍到国家舞台上，这样他们才能更好地推广自己的理论。"
 CAL_four_freedoms:0 "四大自由"
 CAL_four_freedoms_desc:0 "美国人享有四项世界上大多数国家所缺乏的关键自由。言论自由，信仰自由，免于匮乏的自由，最重要的是，免于恐惧的自由。随着我国内战的结束，我们必须确保我国所有公民，不论其肤色或宗教信仰如何，都能享有这些自由。"
 CAL_liberal_unions:0 "支持自由主义工会"
 CAL_liberal_unions_desc:0 "并非所有的工会都是工团主义的温巢，一些工会确实是为了工人阶级的福祉着想，而非一味地为满足其上位者的私欲而生。我们应大力扶持这些工会，这可以使得我们在保护雇工阶层的利益同时消灭隐藏的工团分子。"
 CAL_new_progressive_era:0 "新的进步纪元"
 CAL_new_progressive_era_desc:0 "自从进步党当选以来，美国就沉溺在这出乎意料的历史最高增长之中。在内战的烽火中重新崛起，美国现在可以把她的进步主义理念传播到全世界了！"
 CAL_new_nationalism:0 "新国家主义"
 CAL_new_nationalism_desc:0 "新国家主义认定行政权力应当为公众福祉所用。它还要求司法机构应首先关心人民的福祉而非其财产，正如它也要求代表机构应当代表全体人民而非某一阶级或部分人群一样。"
 CAL_strengthen_democracy:0 "司法罢免"
 CAL_strengthen_democracy_desc:0 "罢免机制不应局限于行政和立法部门，司法系统亦须纳入监督范畴。决不能放任专横法官恣意妄为却逍遥法外。"
 CAL_labor_relations_act:0 "劳工关系法"
 CAL_labor_relations_act_desc:0 "雇主和雇员之间脆弱的关系是内战的主因之一，我们需要立法来保证雇员在剥削之下仍然可以保有一定的谈判权力。"
 CAL_social_security:0 "社会保障"
 CAL_social_security_desc:0 "一个现代化的社会保障系统可以保证普通公民的晚年有所保障，财政的收支平衡，并保证普通公民支持我们的政策。"
 CAL_medicare:0 "医疗保险"
 CAL_medicare_desc:0 "医疗保险是激进的农工党人提出的新法案，该法案希望可以保证我们的贫困公民也可以得到他们所需要的医疗保障。"
 CAL_social_democrats_in_power:0 "进步党当选"
 CAL_social_democrats_in_power_desc:0 "令人意外，进步党赢下了[GetYear]年大选！他们发誓要修补普通工人还有富人之间的裂痕，同时希望能建设一个真正的福利国家。"
 CAL_national_youth_adminstration:0 "国家青年管理局"
 CAL_national_youth_adminstration_desc:0 "失业导致激进思想。我们必须保证在内战之后重回社会的年轻一代都可以拥有一份有价值的工作，或者我们只能看到我们曾与之对抗的激进主义再一次在美国的大地上复兴。"
 CAL_brain_trust:0 "智囊团"
 CAL_brain_trust_desc:0 "一群年轻的农工党参议员已经被视为新的农工党政府的“智囊团”，他们的常春藤背景还有他们改造国家的激进主张已经为他们赢得了在政府内部的地位。"
 CAL_public_works:0 "为幸福而劳作"
 CAL_public_works_desc:0 "由新的工程进展管理局开展的公共工程项目将对需要救济者或失业者开放，这有两个目的：帮助修复内战造成的损害，并为最需要帮助的人，特别是退伍军人提供宝贵的工作机会。"
 CAL_new_anti_trust_laws:0 "新反托拉斯法案"
 CAL_new_anti_trust_laws_desc:0 "大企业对工人永无止境的剥削是美利坚联合工团崛起的重要原因之一，我们需要拆散那些大银行和其他工业巨头来结束这一点。"
 CAL_national_housing:0 "国家住房建筑法"
 CAL_national_housing_desc:0 "许多的社区在内战之中被摧毁，我们需要重建那些房屋并把民众从那些散落各地的难民营中安置到这些过去的社区之中。"
 CAL_create_the_ccc:0 "创建平民保育团"
 CAL_create_the_ccc_desc:0 "通过建立平民保育团，我们将获得一支庞大的劳动力队伍，能够修复在内战中被摧毁的基础设施。"
 CAL_rural_electrification_administration:0 "农村电气化管理局"
 CAL_rural_electrification_administration_desc:0 "许多农村城镇缺乏电力和电力设施，但如果我们可以建立农村电气化管理局，我们就可以对那些缺乏店里的地区进行资助，我们可以在收获大量选票的同时获得一个电气化的农村。"
 CAL_farm_security_act:0 "农业安全局"
 CAL_farm_security_act_desc:0 "美国农民在内战中受伤惨重，我们必须对其加以支持。通过建立一个联邦机构来负责任的保证农民的基本生活还有美国农业的繁荣和安全，在现在看来是一步必要的棋。"
 CAL_minium_wage:0 "最低工资"
 CAL_minium_wage_desc:0 "我们严重缺乏全国级别的最低工资保障，而让全国的所有劳动者都能通过最低工资来获得基本的生活保障不单单能保证所有的美国公民能获得免于匮乏的自由，国家也能更快的恢复经济。"
 CAL_resettlement_adminstration:0 "再安置管理局"
 CAL_resettlement_adminstration_desc:0 "大量的难民在内战中四处奔波寻找一个活下来的机会。从贫困的美国黑人逃离南方，到富裕的白人从北部跑到加州和加拿大，全国中四处奔波的例子太多太多。我们必须建立再安置管理局来让这些可怜人能够回到他们的家……或者是某个安全的地方"
 CAL_bread_and_roses:0 "面包，和平与玫瑰"
 CAL_bread_and_roses_desc:0 "美国在农工党的领导下繁荣昌盛。经济蓬勃发展，激进的工团主义和其他左翼意识形态被政府的福利计划所削弱。这是美国的新一天。"
 CAL_back_in_business:0 "再度出山"
 CAL_back_in_business_desc:0 "美国过去经历的麻烦事使其无力再继续扮演理所应当的国际强国角色，但现在情况已经有所改善。美国已经做好了重登世界舞台的准备。"
 CAL_rebuild_monroe:0 "重申门罗主义"
 CAL_rebuild_monroe_desc:0 "欧洲与世界其它角落蔓延的危机，与我们有什么关系呢？美国属于新世界，我们要做的也是维护新世界的和平与繁荣。我等命中注定要成为北美的霸主、南美的守护者，以及任何胆敢与我方作对者的毕生噩梦。"
 CAL_diplomatic_corps:0 "美国外交使团"
 CAL_diplomatic_corps_desc:0 "迈向霸权的首要步骤，就是让我们未来的敌人与盟友确切地知道我们的想法。无论他们欢迎与否，都阻止不了我们的脚步。"
 CAL_rightful_domain:0 "国土不容侵犯"
 CAL_rightful_domain_desc:0 "北美大陆始终是我们的第一要务，美国绝不容许任何敌对国家在自己的边境上作祟，而她也会依凭武力从海陆两个方向护卫国土。"
 CAL_cooperaton_treaties:0 "合作条约"
 CAL_cooperaton_treaties_desc:0 "美洲国家联盟将聚合南北美诸友好中立国，美利坚于此既为保护者，亦为善导者。"
 CAL_propping_up_allies:0 "新美利坚帝国主义"
 CAL_propping_up_allies_desc:0 "美国人从来都不是帝国主义者，我们决不会不请自来，而只在必要之时、必要之地贯彻我们的意志，维护西方的秩序。这是为了所有人的利益。"
 CAL_pax_americana:0 "美式和平"
 CAL_pax_americana_desc:0 "美洲大陆的伟大斗争业已结束，新的集体意识正在稳步塑就。经济合作与社会秩序正在占据舆论主流，美利坚合众国的又一项雄心壮志即将成为现实。"
 CAL_enter_the_fray:0 "介入纷争"
 CAL_enter_the_fray_desc:0 "美国是世界舞台的一员。虽说我们对加入外国阵营一事心存芥蒂，但我们也会毫不犹豫地动用军事力量，消除世界各地那些终将找上门来的威胁。"
 CAL_arsenal_of_democracy:0 "民主兵工厂"
 CAL_arsenal_of_democracy_desc:0 "“睦邻政策”要求我们在国家建制内，为未来冲突准备好充足的武器装备。总统阁下倡导的“民主兵工厂”由此应运而生，它将为其他国家推翻暴政、摧垮工团主义提供充足的帮助，无论路途多么艰难。"
 CAL_longer_reach:0 "伸手向远方"
 CAL_longer_reach_desc:0 "如果我们希望将自己的力量投射到世界各地，那就必须拥有一支强劲的海军。"
 CAL_on_the_beach:0 "踏上滩涂"
 CAL_on_the_beach_desc:0 "我们的敌人终将会为美国士兵踏上其滩头时的雄姿而感到恐惧，为此，我们必须磨炼自身的能力，让其无愧于我们庞大的力量投射范围。"
 CAL_working_with_allies:0 "与盟友携手合作"
 CAL_working_with_allies_desc:0 "我们应该允许自己的盟国和“敌人的敌人”，自由运用我国的专业知识。假若他们的斗争可以更顺利些，我们离成功也能更进一步。"
 CAL_american_century:0 "美利坚世纪"
 CAL_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 CAL_fortress_america:0 "美国孤立主义"
 CAL_fortress_america_desc:0 "美国方才刚在地狱里走了一遭，现在还没精力参与外部的纷争。眼下必须放眼祖国各地，维护国内秩序，做好在敌国来袭时守卫边境高墙的准备。"
 CAL_man_the_walls:0 "防御海洋"
 CAL_man_the_walls_desc:0 "国防首务，当固边疆高墙。寰宇当畏美利坚之武威，然此慑止于自卫之境。"
 CAL_business_of_neutrality:0 "中立政策"
 CAL_business_of_neutrality_desc:0 "维持中立政策的好处就是敌人少、贸易伙伴多。假若美国有意成为真正的世界强国，就必须依靠强劲的美元。"
 CAL_look_inward:0 "放眼国内"
 CAL_look_inward_desc:0 "美国再也无需顾虑动荡与内战的威胁。眼下必须放眼国内，处理必要的内政问题，而非紧盯着那些不属于美国人的地方。"
 CAL_leap_forward:0 "民间投资"
 CAL_leap_forward_desc:0 "成果既已巩固，前进方向亦已明确，美国可以团结一致、遥遥领先于世界迈入下一纪元了。"
 CAL_peace_at_last:0 "终归和平"
 CAL_peace_at_last_desc:0 "我们的努力终见成效，美国也明白过来，真正的和平唯有通过实力与牺牲。"
 pacificstates.1.t:0 "联邦党提名"
 pacificstates.1.d:0 "联邦党，有时被人戏称为左翼民主党，因为他们是民主党左翼劳动派的激进分子，在今天召开了第一次代表会议。受辛克莱之前的终结加州贫困运动的启发，难怪辛克莱这个激进分子是该党的主要候选人，但他有一个强力的竞争对手，那就是来自加利福尼亚的参议员卡伯特·奥尔森。那么，谁会获得最后的胜利呢？"
 pacificstates.1.a:0 "厄普顿·辛克莱获胜"
 pacificstates.1.b:0 "卡伯特·奥尔森获胜！"
 pacificstates.2.t:0 "[GetYear]年进步党大会"
 pacificstates.2.d:0 "进步党[GetYear]年初选已经开始，在这场极具争议的大会上，流亡的爱荷华州活动家，杰出的农工党盟友亨利·华莱士先拔头筹；前加州州长，西奥多·罗斯福的盟友海勒姆·约翰逊者紧随其后。谁将获得进步党的提名呢？"
 pacificstates.2.a:0 "恭喜华莱士！"
 pacificstates.3.t:0 "[GetYear]年民主共和党大会"
 pacificstates.3.d:0 "民主共和党在[GetYear]年有五个被提名的候选人：旧金山地方检察官厄尔·沃伦，华盛顿州州长克拉伦斯·D·马丁，加利福尼亚参议员威廉·吉布斯·麦卡杜，俄勒冈州长查尔斯·A·斯普拉格和加州报纸老板曼彻斯特·博迪，哪一位的竞选纲领会更加重视民粹主义和个人主义。谁将被提名？"
 pacificstates.3.a:0 "厄尔·沃伦！"
 pacificstates.3.b:0 "威廉·吉布斯·麦卡杜！"
 pacificstates.3.c:0 "克拉伦斯·D·马丁！"
 pacificstates.4.t:0 "[GetYear]年共和党大会"
 pacificstates.4.d:0 "共和党在[GetYear]年的终选到来了，罗伯特·塔夫脱和弗兰克·梅里亚姆这两位最初的领先者受到了挑战。谁最终会获得共和党的总统候选人提名呢？"
 pacificstates.4.a:0 "罗伯特·塔夫脱！"
 pacificstates.4.b:0 "哈里·钱德勒！"
 pacificstates.4.c:0 "霍华德·休斯！"
 pacificstates.4.e:0 "弗兰克·梅里亚姆"
 pacificstates.5.t:0 "[GetYear]年民主党大会"
 pacificstates.5.d:0 "民主党在[GetYear]年一共有三位候选人被党大佬提名：在一个更温和的平台上进行竞选活动的有加利福尼亚的制造商亨利·J·凯泽，俄勒冈州参议员和前军官查尔斯·H·马丁，他们会做到最好。党大佬们不确定这两位候选人能否激起民众的热情，一个提议是将受欢迎的商人和文化人物华特·迪士尼列入候选人名单，当然那些大佬级的人物曾嘲笑过这种想法。尽管最后一项提议是一种非正式的提议，但民主党已经遭受了数次分裂，可能需要一个有更强的团结力的人物才能带领他们获胜。谁将会作为这个候选人呢？"
 pacificstates.5.a:0 "亨利·J·凯泽"
 pacificstates.5.b:0 "查尔斯·马丁"
 pacificstates.6.t:0 "选举"
 pacificstates.6.d:0 "选举的时刻终于到来了，每个政党都希望获得总统的职位。多亏了许多政党的共同参与以及简单多数投票系统，持有最多选票的政党将无疑拥有绝对多数的国会席位。"
 pacificstates.6.a:0 "进步党胜选！"
 pacificstates.6.b:0 "民主共和党胜选！"
 pacificstates.6.c:0 "共和党胜选！"
 pacificstates.6.e:0 "民主党胜选！"
 pacificstates.7.t:0 "[GetYear]年进步党大会"
 pacificstates.7.d.president:0 "掌握着总统之位的进步党本次除可以继续提名现任总统[GetPrimeMinister]外，部分代表也推出了其它的人选。"
 pacificstates.7.d.not_president:0 "各大媒体都在争相猜测游离在权力殿堂之外的进步党准备的候选人会是谁，虽然有许多名字已经见诸报端，但最终的结果还是要取决于今天在座的各位代表。"
 pacificstates.7.a:0 "恭喜现任总统！"
 pacificstates.7.b:0 "荷马·博恩！"
 pacificstates.7.c:0 "谢里登·唐尼！"
