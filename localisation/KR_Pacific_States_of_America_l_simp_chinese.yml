 CAL_Empire: "帝国主义者控制着这个国家"
 KX_california.17.t:0 "无声替换"
 KX_california.17.d:0 "这是萨克拉门托市一个正常的夜晚。相矶藤雄总统坐在他的办公室里，安静地完成了今晚的文书工作。办公室里很安静，唯一的噪音来源，是从敞开的窗户吹来的空气吹在办公室的帷幔和旗子上发出来的。当相矶藤雄为基础设施项目签署了一些不同的表格时，他感到一阵寒意——有人在监视他。他的眼睛在办公室里飞快地扫视着，想验证自己的感觉是否正确，但他在那里却看不到一个人。\n\n这分散了他的注意力，使他不能专心于他的文书工作，他继续回去着手工作。然而，他那被监视的感觉从未消散。不到五分钟，他又一次停了下来，这次是为了取一杯水喝。他一喝完水就回到了办公室。当他走在走廊上时，他的思绪沉闷地发散着。直到他突然被吓得回到现实中。不知怎么的，相矶藤雄总统已经坐在他的桌子上了。\n\n当相矶藤雄看着另一个他时——看着这真实的幻象时，相矶藤雄慢慢地退后，想要去寻求帮助……然而，当他往后退时，却撞到了后面的另一个人。\n\n在能理解自己陷入了什么样的事态之前，他感受到了脖子上冰冷的刀锋……\n\n第二天，相矶藤雄向人们发表了一篇标准的演说，就像往常一样。\n\n然而，人们似乎发现总统有些不对劲……"
 KX_california.17.a:0 "他们永远不会知道了……"
 KX_california.18.t:0 "日本军官发动政变"
 KX_california.18.d:0 "现在是时候了，相矶藤雄的软弱已经危及到日本的利益，必须要除掉他。驻扎在太平洋各州的日本驻军已接到命令，开始行动，推翻相矶藤雄软弱的政府。经过几个小时的零星战斗，他们终于冲进了国会大厦。随后，由山口多闻指挥的日本新军事内阁成立，向治理现在被占领的太平洋国提供“建议”。"
 KX_california.18.a:0 "时机已到"
 KX_california.19.t:0 "西雅图条约"
 KX_california.19.d:0 "今天，西雅图举办了盛大仪式，巩固了太平洋国和日本帝国的关系。裕仁天皇亲自从东京赶来，会见了相矶藤雄总统，签署了西雅图条约。条约实际上让太平洋国成为了帝国的卫星国，但是帝国会确保太平洋国的独立，并保证其半自治地位。在条约签署后，相矶总统举办了国宴，上了传统日式和美式菜肴，还佐以香槟和清酒。此外，相矶总统还发表了一场精彩的演说，而有心人可能会注意到，总统的声音同上次露面时相比宛若两人，不过，指出这一点的人都被宪兵队请去喝茶了……"
 KX_california.19.a:0 "为我们的日本盟友干杯！"
 KX_california.20.d:0 "从西雅图到圣迭戈，影院纷纷举行了《七武士》在美国的首映式。人们排起长队，就为了观看这部早就大热的影片。影片讲述了发生在日本战国时代的故事，一个村庄的农民为了保护自己的庄稼，雇佣了七名浪人对付强盗。这七名扮演浪人的演员在日本和太平洋国成了大红人，在两国吸引了一大批粉丝团体。"
 KX_california.20.a:0 "我给满分！"
 KX_california.21.t:0 "英语俚语在日本大肆流行"
 KX_california.21.d:0 "最近，许多日本青年对美国文化和习俗陷入了痴迷。他们开始轻浮地说些诸如“哥们，去冲浪吧！”之类的话，有些人甚至打扮得像从前的牛仔一样，配备美式军械。他们也开始消费大量美国媒体的产物，如卡通、音乐和漫画，这使得他们被称为“美国发烧友”或简称为“美国控”。"
 KX_california.21.a:0 "是时候欣赏我们的文化了"
 KX_california.22.t:0 "日本产品和体育运动越来越受欢迎"
 KX_california.22.d:0 "由于日本文化进入太平洋国，日本商品和产品变得非常受人们欢迎。剑道、柔道和空手道已经开始在全国各地新开办的学校里被教授。日本料理也经历了一段繁荣的时期，寿司店出现在各大城市的每个角落，拉面店变得随处可见，在我们政府的支持下，繁荣的程度增强了十倍有余。"
 KX_california.22.a:0 "两全其美！"
 KX_california.23.t:0 "石井的疯狂"
 KX_california.23.d:0 "随着太平洋国占领进程的推进，越来越多的骇人措施被搬了出来对付残余的抵抗势力，而其中最具争议的一项便是细菌武器的使用：从停泊于太平洋沿岸的日本潜艇上起飞的爱知M6A晴岚攻击机向农村地区播撒下了致命的鼠疫病菌。这场“黎明樱花”行动的幕后主使，正是臭名昭著的731部队队长石井四郎。因占领“外人”领土有功，只要不得罪东京方面，石井便拥有着相当程度的自由裁量权，这也就导致了一系列耸人听闻惨剧的发生，整个太平洋国的民众都成了疯狂实验的小白鼠。虽然过去帝国官员们总是对石井的所作所为睁一只眼闭一只眼，但也有人认为针对“日本合法领土”的生化袭击于情于理都说不过去。生化战原本是用作对付美国的最后手段的，但现在却被用来铲除陆军可以轻易解决的抵抗组织，这不免引来了东京方面和太平洋国领事的质疑，不过，至于要不要继续下去，还是要看山口总督的意思。"
 KX_california.23.a:0 "存亡之战，岂有退缩之理"
 KX_california.24.t:0 "外人流感"
 KX_california.24.d:0 "看来用黑死病改良菌株轰炸抵抗组织的政策反倒是让我们自讨苦吃。最初，为了防止致命疾病广泛传播开来，石井四郎只将较小也相对孤立的抵抗势力聚集区列为目标。但百密一疏，这种具有高度传染性的病毒已传播到了洛杉矶、旧金山和西雅图等主要城市，蔓延势头很是迅猛。虽然专家表示，这种疾病通常通过受感染的老鼠、跳蚤与人类传播，但也有传言称，作为一种原始的反生物战行为，是受感染的抵抗组织成员故意将传染病传播到了大城市。流感在日本民众中的传播引起了日本领事馆的愤怒，他们要求石井四郎立即离职，停止对生物战的一切研究。对石井四郎使用化学武器的投诉就更不必说了。与此同时，洛杉矶、旧金山和西雅图等主要城市均已封城，太平洋国各州和日本本土之间的旅行亦被禁止。"
 KX_california.24.a:0 "希望我们能快些将其控制住"
 KX_california.25.t:0 "设立收容营"
 KX_california.25.d:0 "在日本优越文化的指点下，许多美国人箪食壶浆以迎日师，并欣然接受了自己的新身份。虽然“外人”们沦为了自己土地上的二等公民，但占领当局相信，只要假以时日，美国人就能明白日本治下的生活只会更加美好。不过，有些人就是不知好歹，罔顾我们与生固来的优越性，螳臂当车般抵抗着天皇的大军。为了杜绝日后的抵抗行为，也为了让我们自己能够安心塑造太平洋国的未来，成百上千的美国民众被驱离了住处，失去了自己的家、生意与宝贵财产，只带着一些随身物品被赶去了喀斯喀特山脉的营地中。有趣的是，营地中关押的不仅仅只有美国人，一些一代、二代、三代的日裔也被一同关了进去，因为这些白眼狼背井离乡不远万里润到了异国他乡自愿当二等公民，而在日本占领此地后，他们还不领受天皇的好意，满脑子想着反抗——是风光体面还是千夫所指，只取决于一个小小的态度。"
 KX_california.25.a:0 "昨天是印第安人，今天就轮到美国人"
 KX_california.26.t:0 "新纪元"
 KX_california.26.d:0 "美国又一次迎来了早晨。今天，走上工作岗位的男男女女数量远超以往任何时期，随着国家日本化的完成，人们将无法区分东京的街道和日本殖民地的街道。近2000个家庭今天将在领地内购买新房，这比过去四年的任何时候都多。今天下午，6500名年轻人将在军队服役，随着混乱的结束，他们可以充满信心地展望未来。白人得到了细心照顾，剩下的少数民族则被边缘化，被迫居住在自己的保留地中。美国又迎来了黎明，在日本当局的领导下，我们的国家将更加骄傲、更加强大、更加美好。我们为什么要倒车回几年前呢？"
 KX_california.26.a:0 "升阳再次给美国带来了黎明"
 KX_california.27.t:0 "维加斯计划完成"
 KX_california.27.d:0 "经过多年的建设，维加斯项目终于完工了。拉斯维加斯已经从一个贫瘠的沙漠中的矿业小镇，变成了一个巨大的酒店和赌场中心。是赌场老板和政府的摇钱树。在最后的度假地的开幕仪式上，霍华德·休斯本人发表了讲话，赞扬太平洋国行政官员的精神以及所做的无懈可击的工作。休斯还在火烈鸟度假村的顶部建造了一个巨大的顶层公寓，他将在那里度过他的大部分时间。"
 KX_california.27.a:0 "好啊！"
 KX_california.28.t:0 "金门大桥改名"
 KX_california.28.d:0 "许多年前，美国的诺顿一世曾表示对修建一座连接海湾两岸的桥梁感兴趣，但他不知道这个计划在他死后就会实现。因此，我们帝国政府的许多成员要求将这座桥改名为“诺顿大桥”以纪念他。"
 KX_california.28.a:0 "就应该这样！"
 KX_california.29.t:0 "约书亚·诺顿陵墓"
 KX_california.29.d:0 "在约书亚·诺顿过早去世后，我们政府中的许多人要求我们将他的遗体转移到更合适的地点，比如他自己的陵墓。他的坟墓将拔地而起，这样人们就可以向这位伟人表达敬意。陵墓的建设已经开始，预计很快就会完工。不久，我们的第一位皇帝将得到一个配得上皇帝之位的坟墓。"
 KX_california.29.a:0 "这是伟人安息的地方"
 KX_california.30.t:0 "把旧金山改名为诺顿市？"
 KX_california.30.d:0 "我国政府诸多成员，皆提议为圣弗朗西斯科更名，以纪念诺顿王朝之荣耀。有人倡议以“诺顿城”等名号，来铭记那诺顿皇帝及其王朝。此番宏图，虽赢得诸多赞誉，然亦不乏反对之声。盖因诺顿一世皇帝，素喜圣弗朗西斯科之名，深恶“弗里斯科”此等粗鄙之词，甚至欲对使用者处以二十五美元之罚金。此等计划，早已传至诺顿二世皇帝耳中，而最终裁决之权，亦将握于其手。"
 KX_california.30.a:0 "还是叫圣弗朗西斯科吧"
 KX_california.30.b:0 "就叫诺顿城好了！"
 KX_california.31.t:0 "皇宫"
 KX_california.31.d:0 "在旧金山市政厅曾经使用过的土地上，诺顿二世下令建造一座适合真正皇帝居住的宏伟宫殿。皇家宫殿的设计甚至可以与欧洲皇室的宫殿相媲美，正因为如此，这有望提高我们政府的合法性，同时在市中心打造一个全新的地标。太平洋各州最优秀的建筑师已被委托建造，并将监督建设过程。该设计将结合其他美式建筑的设计，如白宫，同时在室内设计和装饰中融入了其他欧式元素。建造费用预计会很高，我们要为宫殿采购最好的材料；然而，基础的混凝土将在现场制作，就像建造另一个著名的加州宫殿赫斯特城堡一样。"
 KX_california.31.a:0 "棒极了！"
 KX_california.32.t:0 "明日社区试验原型，为明日而生之城"
 KX_california.32.d:0 "在迪士尼总统最初提出“明日社区实验原型”这一提议时，就受到了他最狂热的支持者的欢迎。这个城市的构造将类似于一个主题公园，但有一点不同，实验原型没有土地所有权，所有城市中的工人和成年人将被“雇佣”工作，以此防止失业。实验原型会像车轮一样从中心向外辐射，随着城市向外扩散，城市密度将会逐步减少，同时专设供于居住、工作和旅游的区域。尽管这个计划被迪士尼总统的反对者指责为“自由市场下财团的奴隶制”，他已经签署了在加利福尼亚海岸的一个小镇上建造测试用城市的计划，这将全面测试实验原型的可行性。"
 KX_california.32.a:0 "未来造物，今日建成"
