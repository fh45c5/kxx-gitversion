 CAL_port_of_the_pacific_idea:0 "日本海军之滨"
 KX_california.53.t:0 "《黑暗之路》"
 KX_california.53.d:0 "拉尔夫·汤森向来擅长用煽情和夸大其词来带动公众情绪，而如今，他带着手中的总统大权重新开启了文学生涯，再版了自己曾经写过的两本书：1933年的《黑暗之路：有关中国的真相》和1936年的《亚洲的答案》，前者用极具争议而又颇为尖刻的手法剖析了中国文化，后者则堆满了对于日本以及共荣圈之辉煌的溢美之词。原版《亚洲的答案》反响平平、销量不佳，汤森把原因归咎于“亲工团主义的自由派媒体”欺骗了美国民众，让他们把日本的善意曲解为了欧式的帝国主义，而《黑暗之路》则畅销全国，收到了公众与学术界的一致好评，不过，书中也充满了煽动性的种族歧视内容，欧文·拉铁摩尔等汉学家批评称，拉森在明知事实的情况下，依旧用一堆假冒伪劣的二手资料拼凑出了这些中伤之词，只有原本就对中国人存在偏见的人才会把其奉为圭臬。\n\n为了推销自己的理念，也为了从这小小爱好中捞上一笔，汤森向全美各地的书店及图书馆，甚至整个共荣圈送去了上百万册的书，把自己的反华亲日情结推销给了任何愿意驻足一看的人，也正因此，从东京至旧金山，乃至整个太平洋及东亚地区，都可以见到这些“巨著”的影子。汤森对于泛亚大业的执着以及舔日行为纯粹到了稍显尴尬的地步，就连日本人也表示不能理解，不过后者也发现，这倒是一种虽露骨但确实有着奇效的宣传方式，而这一点多少有点让汤森始料未及。这些作品流露出的热情虽让人有些招架不及，却总归有其用处，日本因而也帮助其进行传播，以便用日本文化的诱惑力吸引来更多像汤森这样的奇人怪咖。"
 KX_california.53.a:0 "旭日之下的泛亚大团结，美国也义不容辞"
 KX_california.54.t:0 "新的财阀？"
 KX_california.54.d:0 "马克斯·索恩伯格奋进全力，动用了身边所有的关系，拜访了能想到的几乎所有公司，皇天不负有心人，他的努力最终得到了回报。标准石油公司的利润曾在天下大乱之际几近腰斩，而如今却达到了自洛克菲勒的鼎盛时期以来从未有过的高度。索恩伯格的手中再度盈满了资金与资源，日本人也随之向其投来了信心。索恩伯格的投资一个接一个地落地，加州正逐渐恢复其往日的恢复，见此情景，日本帝国的外交官们也开始交头接耳，想着索恩伯格的能力不应仅限于此。终于，几番交涉过后，索恩伯格得到了自己日思夜想的消息：标准石油公司将成为太平洋国的首家财阀，由其负责全权领导。\n\n财阀的责任是巨大的，日本人那边也需要更多的回报，不过索恩伯格早就为此做好准备了，而且如果他最终能取得成功的话，太平洋汽车和铸造公司、太平洋电车公司、霍尔特公司、米高梅、雷电华、派拉蒙、二十世纪福克斯、华纳兄弟，以及新近成立、总部位于洛杉矶与旧金山之间、以大佐出身的军火设计师有坂成章命名的太平洋军工集团有坂等美国企业就也能享受到一样的待遇。标准石油公司完成内部的垂直整合已有一段时间了，而专门为了公司投资而设立的银行也确确实实简化了许多东西，总而言之，标准石油公司现在正以前所未有的效率运转着，索恩伯格也确信一个全新的王朝，一个就连公司的创始人也会自惭形愧的王朝已经到来，而这也让索恩伯格更加坚定了自己所选择的道路。\n\n在此等势力加持之下，索恩伯格能做的不单单只有把太平洋国带到富足的云端，整个美国都在期盼着他的生意，那么多的城镇和油井也都在乞求着他的光顾……"
 KX_california.54.a:0 "清酒代香槟，美国的盛世指日可待！"
 KX_california.55.t:0 "赋权“二世”"
 KX_california.55.d:0 "为了巩固未来日本于太平洋国的软实力，以最小的阻力完成文化的换血，[CAL.getleader]准备着手在本地提拔新的第三方势力，好在吵个没完、大有倾覆我们殖民实验之势的日本人和美国人间播撒下交融的种子，而这一被选召的群体便是“二世”。所谓“二世”，即出生于美国大地上的日裔，他们的父母都是土生土长的日本人，不远万里来到了如今这片照耀在旭日之下的海岸上开启了全新的生活。\n\n“二世”们，亦即“日系人”，虽出生在异国他乡的土壤上，但却在父母的言传身教下对那素未谋面的原故乡满怀着一腔赤子之情。我们将会与日裔活动团体，如正冈优麾下总部位于旧金山的日裔美国公民协会合作，利用“二世”对于自身日美两种身份文化的认同，来打造一批值得托付的管理者、商界领袖、律师、军官、治安官与政府官员队伍，以此来推动日美关系、文化转型，以及国家建设的平稳前行。相矶藤雄、弗兰克·藤田、井上建、是松丰三郎、羽白二四三、长谷本干夫、林良、林静也、黑木勉、松永正幸、河内山百合、山下宅治、藤井肇、山崎实等太平洋国远近闻名的“二世”已进入了我国政府和商界（不过，其中有些人对于日本帝国主义不甚认同，坚定地站在自己的第二祖国一边）、以标准石油和有坂为代表的第一代美国财阀、驻扎于我国各大港口的日本海军，以及新近组建的美利坚自卫队的高层之中，而在我们建设有利于太平洋国，乃至整个美国的日化交融体制的过程中，还会有更多这样的团体紧随其后。"
 KX_california.55.a:0 "以樱花之种夯实吾等之图"
 KX_california.56.t:0 "东方世界和平运动"
 KX_california.56.d:0 "作为一个以美国黑人社区为基础的民族主义运动，东方世界和平运动与我们已经保持了长久的盟友关系，还成了日本与黑人社区进行联系的纽带。东方世界和平运动将我们的泛亚斗争扩展到了亚洲以外，为将全体人民从欧洲帝国主义的统治下解放出来，他们一直热切地支持着日本。我方的代理人与和平运动在地方一级保持着密切合作、共同对敌，这导致和平运动要求得到更重要的地位，并表示他们可以担当我们的代言人，管理太平洋国领土之外的黑人社区。"
 KX_california.56.a:0 "只许在南方活动"
 KX_california.56.b:0 "准许"
 KX_california.56.c:0 "否决"
 KX_california.56.e:0 "赏他们个黑带吧"
 KX_california.57.t:0 "新太平洋国的旗帜"
 KX_california.57.d:0 "为了翻开我国历史的崭新一页，确保和平与繁荣永驻于此，有恩于我们的日本人慷慨地拿出了三种不同的新国旗方案。第一个方案以蓝色为底色，太阳旗置于左上角，三颗白星置于右下。第二个方案借鉴了日本各军的旗帜，以三颗白星置于蓝旭日旗之中。最后一个方案则是红底之上的蓝心三白星勋徽。我们该选择哪一种呢？"
 KX_california.57.a:0 "选择太阳旗"
 KX_california.57.b:0 "选择旭日旗"
 KX_california.57.c:0 "选择勋徽旗"
 KX_california.58.t:0 "与日方联合制作动画"
 KX_california.58.d:0 "[ROOT.GetLeader]有意在我们的宣传机构下新设一大众传媒部门，好在这片新近获得的美国土地上展现日本文化的至臻至美。说干就干，[ROOT.GetLeader]联系上了横滨、读卖、朝日，以及成立不久的东宝等日企，准备让日本的文化走向世界，为本地迅速壮大的亲日群体送上一场文化盛宴。从新电影、电视节目的创作到各式商品、漫画，过不了多久，整个太平洋国都将为日本媒体、文学、美术与文化所浸染。与其它共荣圈国家把戏剧或科幻、特摄影片作为侧重点不同，美国把精力与资源都投入到了新成立的动画部门上。\n\n我们将以冈本一平、北泽乐天等日本连环动画、漫画、日本画界的泰斗为标杆，并同下川凹夫、北山清太郎、幸内纯一、大藤信郎、政冈宪三、濑尾光世等新兴动画人才，以及迪士尼公司、米高梅的汉娜巴伯拉分部等本土动画大咖合作，制作一批全新的日美合拍动画、动漫，以如沐春风般的优越文化团结起共荣圈内的各族人民。以搏斗见长的愤怒异星人、收服小精灵互相对战、巨大的机甲战士对战异世使徒、杀人笔记本、可以变形的外星寄生兽、穿着泳装的太空恋爱少女、与巨大虫群合作的环保卫士、死后转生异世界或来场幼女战记、猪头飞行员飞越二战前的地中海、猫形巴士、移动城堡、父母变猪的奇妙冒险、使用魔剑或电锯狗的超能战斗、太空花花猎人、拥有超能力或者用替身和人格面具之类的武器同命运相搏的高中生、可以操控自然元素的尚武文明、干着高危快递工作的小魔女、寻找唯一宝藏的海贼、会变身的魔法少女等各式各样的新动画将助力政府将日本文化之美推向太平洋国，推向全美及各盟国。"
 KX_california.58.a:0 "言语不足以解释世间万物"
 KX_california.59.t:0 "几个坏苹果"
 KX_california.59.d:0 "虽然大部分日裔人士对我们的文化帝国主义与教化目标不能说有所帮助吧，至少也不会妨碍我们，但在此之中仍有一小撮害群之鸟，而海外反帝异见者日趋庞大的关系网更让这群人愈发猖狂。第一代日裔侨民、激进分子和帝国各地的“日系人”，如工团主义活动家有吉幸治和米田刚三及其美国的白人妻子伊莱恩·布莱克·米田，或是无政府主义煽动者金子文子和在日占朝鲜活动的朴烈，以及日本国内的持不同政见者，如福田英子、井上秀天和难波大助，都在暗中反抗着共荣圈的仁治，我们因之不得不采取行动。我们必须加大力度，铲除这些持不同政见者及其同路人，包括像拉斐特·罗纳德·哈伯德和威廉·伦道夫·赫斯特这样的反日美国人，这样他们的流毒才无法泛滥世间。我们将在司法领域利用忠诚的法庭和优秀的民事律师来打击他们，同时辅以军事情报和宣传机器，用更间接的形式压制他们，这群害群之马绝不可再动摇我们的地位！"
 KX_california.59.a:0 "我们不能让一颗老鼠屎坏了一锅粥"
 KX_california.60.t:0 "技官转向？"
 KX_california.60.d:0 "为了攫取更多的利润，同时减少冗余的中间环节，我们的日企合伙人和顾问准备以技官进步为名，收紧对标准石油公司的控制。这些财阀心腹亲信意图在霍华德·斯科特、亨利·福特、查尔斯·爱迪生、查尔斯·林德伯格、劳伦斯·丹尼斯等本土技官人物的帮助下，把福特主义的原则及各种右翼技官改革纳入标准石油之中，提高公司的运转效率和盈利能力，并趁着索恩伯格总统势微的当口将其拉下台，代之以只忠于金钱和旭日的企业经理所组成的技官委员会。那么，我们是要看在利润和运转效率的份上，牺牲掉索恩伯格政府的大部分自主性与独立性，将权力交予这些亲日技官呢？还是置利润与帝国的不满于不顾，忠于索恩伯格总统和美国？"
 KX_california.60.a:0 "为了财阀的利益，向技官妥协"
 KX_california.60.b:0 "索恩伯格同日本主子并肩而立"
 KX_california.61.t:0 "扩大共荣圈之界"
 KX_california.61.d:0 "尽管我们的政府正面临无数困难，但有了盟国日本的鼎力支持，我们定能安邦定国、天下升平。抵抗组织渐趋消亡，当地民众也逐步接受了新金主的统治，我们政府内部的许多人都在考虑更进一步扩大我国在太平洋地区的影响力。门罗主义早已作古的当下，战争部和财阀正对这些遍地黄金之地垂涎三尺。这群雄心勃勃的官员和商界领袖提议利用[CAL.GetNameDefCap]作为追求在全美洲开疆拓土的基石。从阿拉斯加半岛到加勒比海乃至南锥体，初升旭日将照耀整个太平洋。面对这种野心勃勃的提议，一些稍理智的官僚强烈主张将其搁置，认为我们应专注于本国的发展而非开展这种鲁莽而代价高昂的行动。"
 KX_california.61.a:0 "拿起武器！太平洋的解放近在咫尺！"
 KX_california.61.b:0 "发什么疯？我们现在的麻烦够够的了"
