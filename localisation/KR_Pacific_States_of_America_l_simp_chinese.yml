 PSA:0 "太平洋国国策树"
 CAL_totalist_party:0 "工会团结联盟"
 CAL_totalist_party_long:0 "工会团结联盟(Trade Union Unity League)\n§g社会党一直到最近在西海岸都有着不小的影响力，但厄普顿·辛克莱和他的联邦党如今夺得了大部分本属于社会党的支持。虽然联邦党已经被视为左翼在太平洋国最大的希望，但仍留有一些坚持更激进的立场，意图与联合工团联合的人。工会团结联盟的西海岸分部以年轻的革命家尤金·丹尼斯为指引，汇聚了忠于世界产联的各路力量，意图复兴威廉·Z·福斯特发起的华盛顿实验。§!"
 CAL_syndicalist_party:0 "社会主义劳工党"
 CAL_syndicalist_party_long:0 "社会主义劳工党(Socialist Labor Party)\n§g社会党一直到最近在西海岸都有着不小的影响力，但厄普顿·辛克莱和他的联邦党如今夺得了大部分本属于社会党的支持。虽然联邦党已经被视为左翼在太平洋国最大的希望，但仍留有一些坚持更激进的立场，意图与联合工团联合的人。俄勒冈州的弗兰克·泰特斯·约翰斯领导下的社会主义劳工党延续了传统的德莱昂主义路线，反对世界产业工人联盟的主导地位，坚信产业工会主义能为西海岸的劳工带来解放。§!"
 CAL_radical_socialist_party:0 "联邦党"
 CAL_radical_socialist_party_long:0 "联邦党(Commonwealth Party)\n§g厄普顿·辛克莱的联邦党是西海岸左翼势力的核心旗帜。虽然1934年的终结加州贫困计划未获成功，该党却逐渐开始赢得民众的青睐。它仍需与两大主要政党——民主共和党与进步党，这两大与他们争夺选民市场的主要对手竞争。为了摆脱困境，联邦党选择与社会党划清界限，承诺保护国家不受马克思主义和工团主义的影响。辛克莱是一位远见卓识之人，他把联邦党引领到了现在的地位，但还有其他人渴望领导它。卡伯特·奥尔森可能是最著名的候选人。他被视为党内一颗冉冉升起的新星，支持许多与辛克莱相同的政策，但言辞更为温和。只有时间才能证明这个政党究竟会有多成功。§!"
 CAL_social_democrat_party:0 "进步党"
 CAL_social_democrat_party_long:0 "进步党(Progressive Party)\n§g进步党的目标是在西海岸，乃至于整个美国几十年历史的进步派成功传统的基础上再接再厉。从农民联盟到民粹党，再到公麋党，进步派从未真正赢得过总统的宝座。然而，随着农民和工人达成联合，进步党如今有望取得胜利。只是前方尚有一些阻碍。更倾左的联邦党提出了强力的挑战，而民主共和党也吸引走了一些本来可能属于进步党的选民。尽管如此，进步党在西海岸有着强势的地位，而且很有可能在即将到来的选举中获胜。亨利·华莱士、希拉姆·约翰逊、查尔斯·L·麦克纳里和CC·杨都在争夺进步党的领导权；胜利者将直面未来前路上的职责，但进步党的民粹吸引力从来不弱。§!"
 CAL_social_liberal_party:0 "民主共和党"
 CAL_social_liberal_party_long:0 "民主共和党(Democratic-Republican Party)\n§g该党有时被称为自由党，集合了思想自由、偏好改革的民主党与共和党人士，他们对自己原本的党派不再抱有幻想，选择寻求变革。虽然他们的改革比进步党更加温和，和联邦党相比更是如此，但他们希望实现银行改革、建立社会保障制度以及通过国家建设项目解决失业问题。进步党和联邦党对他们嗤之以鼻，认为他们做事半心半意，不过是让人民感到挫败，让富人继续统治社会。民主党和共和党主流则认为该党不过刚刚起步，不值得承认，其政策也是异想天开。虽然遭受如此敌意，但民主共和党在西部赢得了相当的支持，如果配合上正确的策略的话，他们有可能掌握权力。他们主要的候选人是厄尔·沃伦、政治巨头威廉·吉布斯·麦卡杜、查尔斯·D·马丁、曼彻斯特·博迪和查尔斯·A·斯普拉格。至于谁将领导该党还尚不清楚，但是他们都期望一件事：赢下将至的选举。§!"
 CAL_market_liberal_party:0 "共和党"
 CAL_market_liberal_party_long:0 "共和党(Republican Party)\n§g在最近撕裂我国的纷争中，无数党派随之崛起，但共和党依然屹立。虽然他们在西海岸不像在其他地区那样占优，但他们也与民主党竞争了几十年。赫伯特·胡佛在加州居住多年，加州州长弗兰克·梅里亚姆也是共和党人。他们当前的政策提倡自由放任经济，放松管制和低税收。此外，教育建设和自由贸易也是共和党的人气政策。如果共和党能传达足够的信息，让那些心怀不满的选民为他们投票，他们当然有可能赢得下一次大选。不过，加州近期的经济困局迫使梅里亚姆推行增税政策，加之其打压工会的倾向，使得争取新兴选民群体变得异常艰难。因此，梅里亚姆在党内有好几名对手。罗伯特·塔夫脱——前总统威廉·霍华德·塔夫脱之子——威胁着梅里亚姆的党内地位，此外，哈里·钱德勒、霍华德·休斯、弗兰克·诺克斯和路易斯·B·迈耶都在竞争共和党的领导权。共和党的未来取决于谁将代表他们参见将至的大选。§!"
 CAL_social_conservative_party:0 "民主党"
 CAL_social_conservative_party_long:0 "民主党(Democratic Party)\n§g几十年来，民主党都在与共和党对手竞争西海岸的控制权。他们支持铁路和关税改革，这为他们在本世纪早期赢得了支持，但最近，因为其他政党的崛起，他们的支持者逐渐流失了。美利坚至上党对民主党的损害尤为严重，民主党要想重振雄风，就只能期望从至上党手中赢回选票。民主党在西部没有像弗兰克·梅里亚姆一样的旗手，但也有一些显赫人物。新近获选的俄勒冈州州长查尔斯·马丁，以其亲商业的立场闻名，而且强烈反对罢工。许多知名商人也为争夺民主党领导权纷纷出手。其中包括亨利·J·凯泽，一位著名的水坝承包商，以及华特·迪士尼，一位冉冉升起的新星，他的迪士尼公司期望为娱乐界带来变革。但是，媒体巨头威廉·伦道夫·赫斯特最近也对参与政治表露兴趣，虽然他的政纲与民主党大相径庭，而且许多人相信他会组建自己的政党，此举虽会进一步削弱民主党，但赫斯特心意已决，任谁说都不管用。当下，民主党唯有坚守社会保守主义传统，维系商界联盟，冀望于这些根基足以稳住阵脚。§!"

 CAL_paternal_autocrat_party:0 "联邦派"
 CAL_paternal_autocrat_party_long:0 "联邦派(Federalist Loyalists)\n§g联邦政府在西边自然也存在着不少支持者。其中既有仍在牵念故土同胞的东海岸避难者，亦不乏质疑我方正当性、主张与联邦政府缔结抗敌同盟者。虽然威胁性较低，但需密切监控此类潜在隐患，以免动摇太平洋政权根基。§!"
 CAL_national_populist_party:0 "灵性论运动"
 CAL_national_populist_party_long:0 "灵性论运动(The Spiritualist Movement)\n§g近来才出现的最为奇异古怪的派系是灵性论运动。许多不同的派系走到一起，参与这项运动，它们共同的目标是反对所谓的“君主制盎格鲁工团主义”。一支派系希望与日本建立更密切的关系，因为无论是在国外还是国内，日本一直是他们最大的支持者之一，这个派系的代表人物是石油商人马克斯·桑伯格和其意识形态盟友拉尔夫·汤森。该运动的另一个派系的代表是L·罗恩·哈伯德，他可不关心日本或任何其他国家的支持，而只关心神秘学。他的基督教神秘论，以及他对超自然的信仰，甚至于对不明飞行物的信仰，使他受到了旁人的嘲笑，尽管他本人深信不疑乃至于虔诚。他强烈的反工团主义观点可能会让他在商界大受欢迎，但了解哈伯德的人都知道他不会受任何势力控制。在这两个派系之上，领导着这两个派系，其他小派系乃至于整个运动的是政党领袖爱德华·朗斯特里特·博丹。博丹面临着一项艰巨的任务，要调和日本人的影响力与灵性论运动的神秘学观点，但凭借他的才华，再加上一点运气，他或许能够让该党获得民众的支持。§!"
