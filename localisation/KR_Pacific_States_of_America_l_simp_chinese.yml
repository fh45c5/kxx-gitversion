 pacificstates.4006.t:0 "全国超心理学与超感知觉测验"
 pacificstates.4006.d:0 "灵性论者及其奇异同僚的形形色色的想法和主意正逐渐被国家所接受，而此时，一股新兴的心灵研究风靡全国——超心理学。超心理学之前被批判为“伪科学”，主要研究灵能能力和灵能现象，如超感知觉、心灵感应、预知、透视、念力、心灵占卜、控火等可能与人类心灵以及深层的灵力有关的超自然事物。超心理学由巫师和边缘心理学家发起，其中的代表人物有超心理学的提出者约瑟夫·班克斯·莱因、齐讷卡片测试的发明者以及超感知觉的领军人物卡尔·齐讷，还有诸如约瑟夫·盖瑟·普拉特、加德纳·墨菲、休伯特·皮尔斯以及冉冉新星伊恩·史蒂文森等各种知名人物。齐讷卡片是一种有着不同颜色的形状简单的卡片，超心理学家们使用这种卡片对特定人物体内的灵能进行初步测试，而我们也可以用类似的方式进行测试，以便让走在科学与现实前沿的天才头脑们去理解真实的未知。不过，这一测验被世界各地嫉妒的人们中伤为伪科学，其中不乏著名的英国心理学家C·E·M·汉塞尔、科幻讽刺作家约翰·托马斯·斯拉德克以及世俗人文主义者、声名显赫的怀疑论者保罗·库尔茨等公众人物，但我们神圣的事业可不会被他们的一厢情愿所左右。\n\n在政府资助成立、由J·B·莱茵及其同事牵头的超心理学协会的统筹下，我们联合杜克大学、哥伦比亚大学、弗吉尼亚大学等学校的超心理学系，在全国开展了齐讷卡片和其他各种超感知觉测验，以查找出国民之中的超能力者、灵能者等各种有着强大心灵能力的个体。如此，我们就能让整个世界看到真相，让那些恶语相向者自惭形秽，同时还能让我们的国家与人民为人类社会的灵能觉醒做好准备。"
 pacificstates.4006.a:0 "我们定会揭露出隐藏在人类精神之中的更高一层的真相"
 pacificstates.4007.t:0 "奇幻游记"
 pacificstates.4007.d:0 "[ROOT.GetLeader]一直痴迷于大海上的冒险、天空中的奇遇以及太空里的奥秘，也因此慢慢产生了一个想法——扩大美国的海军和空军，在为人类创造更加完美的心灵与精神世界的同时，去探察我们周遭的现实世界。我们挚爱的总统化身为了海军上将，亲自置身于国家的海军之中，以海军总司令的身份，下令建造一支直属于他的舰队，其中包括“海洋基地”号和“自由之风”号两艘全新的旗舰。为了助力他的梦想，他忠诚的部将、泰勒玛教神秘学家、别具匠心的火箭科学家马弗尔·怀特赛德·帕森斯（也被叫做约翰·“杰克”·帕森斯）与一伙熟稔天空与宇宙事务的新进党员，如查尔斯·林德伯格、霍华德·休斯、赫尔曼·普尔·布朗特、凯瑟琳·约翰逊、哈维·华盛顿·班克斯、华特·迪士尼、罗伯特·戈达德、詹姆斯·哈特·怀尔德等，共聚于政府之中，协力推动航空领域和火箭领域的发展。[CAL.getname]的灵性论者们立志要在几年到几十年的时间里建立起一支全新的空中舰队，并创造出兹努级太空火箭，他们誓要为了全人类的福祉，跨过凡尘的极限，徜徉于伟大的未知当中。"
 pacificstates.4007.a:0 "星辰大海之中，是自由、启蒙与宇宙的救赎"
 pacificstates.4008.t:0 "统一灵性界？"
 pacificstates.4008.d:0 "虽然美国的灵性论运动已经在这一新近统一的国家中站稳了脚跟，但我们并不是唯一的一家，世界各处都存在着与我们相似的团体。从加拿大的灵性论者和志投意合的各式人物，如阿曼达·卡梅伦·弗劳尔、托马斯·格伦迪宁·汉密尔顿、约翰·哈格雷夫、威廉·里昂·麦肯齐·金，到英国的灵性论者和秘传主义者，如C·S·刘易斯、弗朗西斯·克莱夫·罗斯、J·W·邓恩、阿莱斯特·克劳利、亚瑟·柯南·道尔、露丝·玛丽·特里斯特拉姆、伊迪斯·利特尔顿，再到整个世界的各个角落，如南非的西内尔·范·伦斯堡、澳大拉西亚的巴特·齐诺、杰伊·达穆西、斯蒂芬·加顿，我们的同志数不胜数，而且不时就会有新的灵性论团体涌现出来，如果再把印度次大陆和西方世界风行的神智学运动近亲算进来的话，我们的人数还可以再上一层楼。全世界的灵性论和反社会主义圈子里，不乏像我们一样的人才，所以我们必须要做出选择。为实现心灵飞升，我们可以向不断进化的余生去索取一切问题的解答，或者也可以向希坦寻得救赎，又或者专注于完善我们这一纯粹灵性论的独苗，在美国家园独立踏上人类灵力进化的台阶。我们要如何做呢？"
 pacificstates.4008.a:0 "我们应该专注于美国精神与心灵内在的至臻至美"
 pacificstates.4008.b:0 "形而上学界的通灵论者与灵性论运动只有团结一致，才能发掘出我们的心灵潜能！"
 pacificstates.4009.t:0 "针对反英言论的回应"
 pacificstates.4009.d:0 "正当我们继续巩固对美国的控制，在全国推广灵性论思想之时，海外的灵性论同僚们却率先对我们发了难。多年以来，我们一直以低能的保皇派没能守护住自己的帝国以及整个世界对于社会主义与工团主义的恐惧为切入点散布反英言论，但此举却惹怒了英语国家中的灵性论者、通灵论者、神智学家、泰勒玛教徒、科学教徒等一众神秘学家和秘传主义者。英法革命将对共产主义的忧虑深深刻入了他们的心里，使得他们终日生活在随时被赤匪拉下水的惶恐不安之中，运动的发展也几近停滞，于是，他们就将矛头对准了美国，批评我们在蒸蒸日上的灵性论等思想形态之中注入了种族因素。他们之中的代表加拿大的里昂·麦肯齐·金和从英国流亡的亚瑟·柯南·道尔敦促我们将反应仇恨的外皮转移到更加具体的反社会主义姿态上去，如此，我们这些姊妹组织和巫师团才能一起携手，共同探究精神世界以及那未知虚空的奥妙。我们要如何回应呢？"
 pacificstates.4009.a:0 "澄清反英言论，说明我们反的只有工团"
 pacificstates.4009.b:0 "盎撒狗腿子输给了丑恶的左翼势力，他们已经输了，我们就是要让全世界都知道这一点"
