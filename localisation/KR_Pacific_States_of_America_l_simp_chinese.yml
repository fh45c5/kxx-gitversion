 pacificstates.3.h:0 "相矶藤雄！"
 KX_california.23.b:0 "此等暴行，实属天理难容……"
 KX_california.62.t:0 "相矶藤雄治下美国民主的未来"
 KX_california.62.d:0 "一边是千方百计想将其拉下台，换上听话看门狗的日本特派员，一边是因根深蒂固的仇亚思想而对其分外敌视的美国同僚，总统兼大法官的相矶藤雄可谓是里外不是人，但即使如此，他对于美国人民、对于家乡太平洋国的忠心与热爱却始终未曾改变。在最高法院盟友以及如乔治·马歇尔那般为数不多因为其为美国人民纾危解困的劲头所感染而支持他的军官的帮助下，相矶藤雄站稳了脚跟，顶着美奸的骂名尽己所能地利用日本的占领来为国家谋福利、为国民谋生计。\n\n相矶藤雄从不是个任人指使的傀儡，反而是体制内部的反抗者，而在得到了最高法院以及一些放下了反亚种族偏见的本土政客的支持后，相矶藤雄已悄然开始在基层层面恢复民主体制，并期盼着有朝一日能实现日治下公正而自由的选举——在太平洋国已趋于稳定、投入业已得到回报的现如今，日本“金主”想必也不会在意管控之下的民主吧。不过，狂热亲日分子自然不会待见这一点，而他们也在暗中以暴力相威胁，但既然整个国家都已沦为了阶下囚，那还有什么比这更可怕的呢？只要能让勇敢者之乡重获自由，这点小小代价相矶藤雄还是可以接受的。那么，我们是要继续在军方的支持下，延续相矶藤雄及最高法院的判官统治，待未来某个时点社会稳定无虞后再在东京方面的指导下将权力交还予人民呢？还是在维持对日特殊关系的前提下，擅作主张直接重启美国的民主呢？"
 KX_california.62.a:0 "以太平洋国国民利益为重，继续相矶藤雄的判官统治"
 KX_california.62.b:0 "正式组织新一届民主选举！"
 KX_california.63.t:0 "相矶藤雄功成名就，欲拂衣而去"
 KX_california.63.d:0 "自从阿诺德发动政变及随之而来的政治危机发生以来，以相矶藤雄为首的特别法官委员会便在日本帝国的支持下治理着太平洋国，可在相矶藤雄决定恢复民主制度后，情况就发生了变化。虽然相矶藤雄之前是靠着日本才站住脚的，但他现已经战胜了那些精日分子，或者说是其中那些最为恶劣之人。危机既已过去，相矶藤雄便给了法院与立法立构一项艰巨的任务：制定一部太平洋国的新宪法。这项任务绝非易事，因为东京、华盛顿等外国势力都在暗中破坏我国的合法性，然虽道阻且长，必克之以成，而相矶藤雄也成功地完成了这一任务，并在太平洋国全境组织起了新一届的全国大选。\n\n相矶藤雄从混乱中拯救了太平洋国，其名字必将标榜史册，也因此，越来越多的人希望推举其为总统候选人。相矶藤雄本人虽无意参选，更想早日退休安享余生，但其能够异军突起，对抗数十年来的仇亚歧视，扶国之将倾都是不容争议的事实，他正是民心所向。不过，最终的决定权还是在相矶藤雄本人的手里。"
 KX_california.63.a:0 "相矶藤雄回归了平静的法官生活……"
 KX_california.63.b:0 "相矶藤雄宣布竞选总统……"
 KX_california.64.t:0 "东京的“援手”"
 KX_california.64.d:0 "亚裔美国人相矶藤雄法官成为了太平洋国的领导人，当地人为之恼怒不已，他们频频以种族主义言论唾骂临时总统，连带着最高法院的合法性也被质疑。相矶藤雄总统在反亚情绪高涨的太平洋国民众里基本没有什么支持者，如今已是进退维谷，唯有依靠亨利·阿诺德和乔治·C·马歇尔等军官的支持方才有所倚仗。然而，相矶藤雄虽孤立无援，却有一群人愿向最高法院伸出援手：其名日本帝国。相矶藤雄虽流着日本祖先的血，但他本人却以真正的美国公民自居，愿意用自己的生命来保护他所珍视的国家。话虽如此，当美国的流氓政府对美利坚太平洋国的淳朴人民虎视眈眈时，相矶藤雄也明白，倘若我国想要生存下来，对东京示好也许是最好的办法。相矶藤雄将与日本的这种新型伙伴关系视作一种务实的伙伴关系，既要与日本帝国建立平等互惠的关系，也要与之合作，共同消除地区内存在的反亚偏见。但还有其他更无底线的合作者，他们试图在暗中影响太平洋国，欲图使之在对日关系中占据更“合理”的地位。这些合作者，如约翰·大卫·普罗沃、拉尔夫·汤森、马克斯·索恩伯格、弗雷德里克·文森特·威廉姆斯和大卫·沃伦·莱德，一直在试图动摇相矶藤雄总统的地位，进而破坏太平洋国的主权。他们如今虽势单力孤，但倘若我们任由东京的影响力不受限制地增长，他们不仅无法为我们所用，更有成为我们心腹大患的可能。"
 KX_california.64.a:0 "至少我们这还没有宪兵队嘛"
 KX_california.65.t:0 "清洗美奸"
 KX_california.65.d:0 "在其作为美利坚太平洋国临时政府首脑治国理政期间，日本帝国的慷慨援助多少让相矶藤雄总统能维持其对太平洋各州的统治。话虽如此，他本人虽是日裔美国人，但说来讽刺，在屈从于日本这件事上，他倒是十分反对。而约翰·大卫·普罗沃、拉尔夫·汤森和马克斯·索恩伯格等白人反而对日本殷勤不已，这就更是讽刺了。今天，在总统公布了与日本帝国的“平等伙伴关系”倡议后，这些要求对日合作的声音便顿时沉寂。这套政策的目的在于减轻对东京的依赖，最狂热的合作者也因此被驱逐出了临时内阁。这一套措施显然是想与日本保持距离，东京的高官们自然为此震怒不已，强硬派更是要求在太平洋国扶持上一个更听话的傀儡。的确，在日本陆海军看来，相矶藤雄可能和他们同出一根，但事实证明，他在思想与精神上都是一个外国人，始终忠于那个早已灭亡了的国家的理想，也不愿接受任何不平等的对待。"
 KX_california.65.a:0 "我们是盟友，而非奴仆"
 KX_california.66.t:0 "电台上的不谐之音"
 KX_california.66.d:0 "虽然日本人展现出了极大的善意，但依旧还是时不时地会出现一些抵抗活动，不过，无论是骚乱、袭击，还是抗议种种，都很容易处理，可偏偏就有这么一个抵抗势力，怎么都除不掉。音乐主持人、二代日裔、艺名“孤女安妮”、听众口中的“东京玫瑰”——户栗郁子在非法电台上开设了一档名为《零点时刻》的新闻、访谈、音乐节目，成了我们眼中拔不掉的一根刺，制造了一道大有蔓延至整个太平洋国之势的溃烂伤口。户栗郁子的反抗电台一直在到处流窜、躲藏，总是来无踪去无影，还与主要由不愿与我们合作的日裔以及非日裔本土退伍军人组成的各个抵抗组织合作，给我们的国民带去了帮助与希望。\n\n不过，就目前情况来看，户栗郁子的活动基本以和平为主，一边在播报新闻与战况发展的间隙放一些爵士乐、岛国歌曲、亚太热曲等来在此一不定时局中鼓舞民众，一边实施人道主义救助、帮助难民。我们当前的主要精力还是以处理暴力反抗为先，因此，户栗郁子的反抗电台只能暂时先搁置一旁。"
 KX_california.66.a:0 "随她怎么叫吧"
 KX_california.67.t:0 "好奇害死猫"
 KX_california.67.d:0 "近日，太平洋国一直被一种奇怪的氛围所笼罩。相矶藤雄总统虽是日本的可靠盟友，但还是顶着时局委员会中合作者无处不在的压力坚定地致力于太平洋国的独立之业。然而就在过去几天里，相矶藤雄的立场突然来了个了一百八十度大转弯，从支持日太两国建立平等的伙伴关系，变成了支持太对日近乎奴颜婢膝的顺从。虽然有些人已经“预料到”了相矶藤雄这个日裔美国人迟早会露出真面目，但也有一些个目光敏锐的公民注意到了令人难以置信的事实：目前主持国家大局的相矶藤雄总统与几周前统治太平洋国的相矶藤雄总统根本就不是同一个人。那些熟悉“真正的相矶藤雄”的人都注意到了身高、眼睛颜色、举止和说话方式的不同。太平洋当局多次否认了关于总统早已被狸猫换太子的说法，甚至更改了关于其身高和眼睛颜色的官方记录。日本当局则选择了更为直接的手段，许多在该案中嗅到了蛛丝马迹的私家侦探最终都尸沉太平洋。而宪兵队则没有对此事发表任何评论。"
 KX_california.67.a:0 "相矶藤雄是我这辈子见过最善良、最勇敢、最温柔、最伟大的人"
