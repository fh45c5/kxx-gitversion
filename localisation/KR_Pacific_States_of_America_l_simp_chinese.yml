 pacificstates.22.b:0 "太平洋国之梦终于实现了！"
 pacificstates.4003.c:0 "如团结在联邦党准则身后的蜂巢一般"
 KX_california.1.c:0 "同辛克莱和联邦党一齐行进"
 KX_california.12.b:0 "……任命联邦党"
 KX_california.12.c:0 "……任命国家民主党"
 calpeaceout.1.t:0 "军官团内部的反战情绪"
 calpeaceout.1.d:0 "当昔日正统的美利坚合众国四分五裂，濒临全面内战之际，在我们位于太平洋沿岸的共和理想的绿洲之中，许多人都不想同从前的美国同胞们大打出手，他们的呼声愈发强劲。这些和平主义者担心兄弟阋墙的混乱、流血和野蛮现象也会在我们的土地上出现，因此对即将到来的看似不可避免的战争愈发反感起来。\n\n正常情况下，这种思潮的泛滥是不关国家什么事的，但近来，反战情绪逐渐渗透进我军军官之中，一些士兵和军官也因此变得优柔寡断起来。我们可能用不着大惊小怪，毕竟我们都曾生活在那个紧密团结的旧日联邦，人们厌恶战争是自然而然的，厌恶内战更是理所应当。然而，我们的一些更为鹰派、更为偏激的内阁成员要求当局在和平呼声失控之前扼杀它们。我们该怎么办？"
 calpeaceout.1.a:0 "我们的小伙子们不想打仗也正常"
 calpeaceout.1.b:0 "严厉打击这些想法。这简直就是在叛国！"
 calpeaceout.2.t:0 "反战情绪波及太平洋国上流社会"
 calpeaceout.2.d:0 "既然我们决定放任这些和平主义者懦夫继续抗议、制造恐慌，普罗大众的头脑之中便纷纷有了独立的想法。令人担忧的是，这些情绪已经开始影响对太平洋国经济至关重要的“大企业”。从标准石油公司和福特汽车公司，再到加州铁路委员会等一系列地方企业，在我们持股的某些集团中，这些危险的想法也开始不断扩散。这些公司虽然能在即将到来的战争捞上一笔，但在可怕的内战中，它们将失去更为重要的本土市场、客户和基础设施。\n\n火上浇油的是，甚至有报道称，有人看到亨利·阿诺德将军与这些明目张胆的和平主义者交流，但我们仍不知详情。我们内阁中的许多人呼吁我们立刻对高涨的和平主义运动采取行动，尽管这样做将违反我们的基本原则。若是我们要成为美利坚共和主义的继承者，我们就必须遵守它的规则，维护人民享有的权利。"
 calpeaceout.2.a:0 "让企业和领导人坚持自己的信仰是我们国家的原则"
 calpeaceout.2.b:0 "这些背信弃义的公司要么服从，要么就吃点苦头"
 calpeaceout.3.t:0 "和平主义者自己动手了"
 calpeaceout.3.d:0 "尽管有种种警告和不祥之兆，我国政府还是被迫在眉睫的战争威胁迷了眼，而为此，我们付出了最大的代价。危险的和平主义观念如野火一般燃遍全国，我们的人民不愿让无辜美国人的鲜血洒在我们神圣的土地上。正是此时此刻，亨利·阿诺德将军和他的军队已经进入首都，一枪未发，包围并解除了国会大厦外的国民警卫队的武装。在这场由人民发起的不流血政变结束后，阿诺德将军将担任太平洋国的临时领导人，同时他也将寻找临时总统的候选人，并将与华盛顿的政府军和麦克阿瑟将军商讨和平协议，保证会相互援助并尝试和解。但现如今，我们人民在此建立了个独一无二的、独立自由的太平洋国家。"
 calpeaceout.3.a:0 "这是否意味着和平将最终得胜？"
 calpeaceout.4.t:0 "关于“太平洋国”分离主义者问题"
 calpeaceout.4.d:0 "来自萨克拉门托的令人沮丧的消息，亨利·阿诺德将军已经推翻了太平洋国政府以防止这个分离出去的西部州加入即将到来的内战。然而，更有趣的是，阿诺德将军还直接联系了麦克阿瑟将军，通知这位“美利坚恺撒”，太平洋国不想与联邦政府发生任何冲突，并且还会在内战中援助联邦派，不过他们会追求自己的理想，这些分裂主义者的目标是建立一个独立的“太平洋国”。虽然这一想法与我们统一联邦之梦截然相反，但我们目前也无力阻止他们，因为他们离我们有几千英里之远，而且我们在落基山脉的军队目前根本没有人力物力去对抗太平洋国。此外，在日益恶化的内战气氛中，少一个派系参战就能拯救无数美国人的性命安全，并且能让我们集中精力对付南部和中西部地区更为危险、激进的敌人。"
 calpeaceout.4.a:0 "反正我们也打累了，他们可以实现他们的分离主义之梦了。"
 calpeaceout.5.t:0 "太平洋国之梦得以实现"
 calpeaceout.5.d:0 "麦克阿瑟将军所领导的华盛顿政府已同意我们的请求，在这笼罩着美洲大陆的日益恶化的混乱气氛中，同我们保持和平并进行合作。现在，当我们寻求建立属于我们自己的、独一无二的、独立的“太平洋国人”身份时，我们将与联邦派一起对抗困扰着正燃烧着的合众国的激进分子。因此，与其他派系达成的任何协议或停火协议都将被废除，因为我们正与联邦派站在一起。阿诺德将军现在已经开始向文官政府移交权力，而他和他的军队准备在这片美丽的太平洋海岸边为自由和独立的权利而战。"
 calpeaceout.5.a:0 "淘金热时的梦想已然实现"
 calpeaceout.6.t:0 "“太平洋国”分裂分子的命运"
 calpeaceout.6.d:0 "枪声终归沉寂，天地重归安宁。我们曾脚踩泥泞、浴血奋战，只想奋勇前进，现在我们正胜利地站在顶点，作为最终的美国……嗯，几乎是最终的美国而存在。\n\n在大陆的西海岸屹立着的是我们的“盟友”——太平洋国。在亨利·阿诺德将军发动政变后，他们宣布要成立自己独一无二的地方主义国家，并将与我们的军队并肩作战，让美国人为此少流些血。然而，战争现在已经结束，我们正面临着崭新的现实，因此我们必须最终决定要如何对待这些“太平洋国”的分裂分子。我们可以兑现战争开始时作出的承诺，允许太平洋国家作为一个友好但独立的兄弟国家而存在，在美洲的心脏地带与我们和平共存。然而，我们正是为了维护联邦统一而战斗的，结果打完之后，联邦还是四分五裂，这种未来让国内许多人感到不安和愤怒，这当然是可以理解的，所以我们有另外两个选择。\n\n我们可以劝说太平洋国政府友好和平地重新加入联邦，作为回报，我们将给予他们大量的经济、政治、和文化自治权——本质上允许他们在美国政府和军方的保护与建议下，像一个国家一样存在。然而，最激进的选择将是要他们像以前一样完全并入美国，恢复美国的旧日秩序。为了诱使他们接受这一近乎不可接受的协议，我们将作出承诺，真正的民主和共和主义原则将重归于美国政府和人民，最终所有美国人将会再次在他们的政府中拥有发言权。为了进一步实现这一目标，我们将给予这个流氓州大量的好处和激励政策以安抚人心，同时我们将重建联邦饱受战争蹂躏的土地。我们该怎么办？"
 calpeaceout.6.a:0 "让他们实现他们的太平洋国之梦。这是他们应得的"
 calpeaceout.6.b:0 "建立太平洋自治国"
 calpeaceout.6.c:0 "要求他们重新加入联邦，以换取大规模的经济援助"
 calpeaceout.7.t:0 "可妥协之梦？"
 calpeaceout.7.d:0 "随着这场可怕的兄弟阋墙的结束，联邦政府再次提出了有关于我们脱离联邦的问题，寻求永远结束我们两国之间的这种独特关系。这些联邦派来到萨克拉门托，向我们提出了提案。为了维护我们曾经光荣的联邦的神圣和威望，麦克阿瑟将军和他的小集团在泛美统一的面纱下向我们提供了近乎完全的自治权。各州将被允许按照我们的意愿履行自治权力，同时仍然享有作为美国一部分的权利。而我们的政治和社会经济政策将完全由我们决定，两国的大多数联系将通过经济和军事合作来实现。尽管和我们最初的目标有点不同，但无论如何，这个协议还是不错的，如果我们接受这一协议，我们将挽救数百万人的性命。我们该怎么办？"
 calpeaceout.7.a:0 "虽然这不像我们梦中一样，但这已经够了。不要再打仗了。"
 calpeaceout.7.b:0 "无辜的人民为了这一权利慷慨死义。我们不会辜负他们！"
 calpeaceout.8.t:0 "“太平洋国”拒绝了我们的提议"
 calpeaceout.8.d:0 "太平洋国断然拒绝了我们改定的条款。鉴于这种令人失望但意料之中的反应，我们现在对这些“太平洋国”的分裂分子只有两种选择。我们要么承认已然发生的事情，让他们获得自由，这能拯救无数无辜美国人的生命，但同时也会削弱我们联邦的神圣性，永久地粉碎从前美国的理想。或者，我们可以穿越落基山脉，攻占萨克拉门托，用武力彻底粉碎太平洋国的独立之梦。然而，我们刚刚才打完一场内战，并且建立起新政权，如果现在再打一场的话，我们无疑会被国内的许多人视为暴君。我们必须快点决定该做什么，因为数百万人的命运就正掌握在我们的手中。"
 calpeaceout.8.a:0 "谁也阻止不了联盟再一统的进程"
 calpeaceout.8.b:0 "他们看出了我们在虚张声势，让他们走吧"
 calpeaceout.9.t:0 "要求臣服"
 calpeaceout.9.d:0 "随着这场可怕的兄弟阋墙的结束，联邦政府再次提出了有关于我们脱离联邦的问题，寻求永远结束我们两国之间的这种独特关系。麦克阿瑟将军本人要求我们回到更伟大的联邦的怀抱，再次成为美利坚合众国的州。为了补偿我们，他们将向组成太平洋国的各州提供经济补偿，并给予我们相较于联邦中的其他州，在经济上的更大的相对自主权，以保持国家和平，并为我们在内战中的帮助提供“奖励”。许多我们政府的内部人士和广大民众认为这项协议是对我们价值观和梦想的侮辱，但我们当中更务实的人最担心的是发生另一场战争。我们必须谨慎行事，因为我们此时此地的决定，无数刚从如无穷无尽的噩梦般的内战逃离出来的人的生活将会彻底改变。"
 calpeaceout.9.a:0 "我们应该为了人民的利益屈服"
 calpeaceout.9.b:0 "下地狱吧！不自由毋宁死！"
 calpeaceout.10.t:0 "“太平洋国”拒绝屈服"
 calpeaceout.10.d:0 "太平洋国断然拒绝了我们改定的条款。鉴于这种令人失望但意料之中的反应，我们现在对这些“太平洋国”的分裂分子只有两种选择。我们要么承认已然发生的事情，让他们获得自由，这能拯救无数无辜美国人的生命，但同时也会削弱我们联邦的神圣性，永久地粉碎从前美国的理想。或者，我们可以穿越落基山脉，攻占萨克拉门托，用武力彻底粉碎太平洋国的独立之梦。然而，我们刚刚才打完一场内战，并且建立起新政权，如果现在再打一场的话，我们无疑会被国内的许多人视为暴君。我们必须快点决定该做什么，因为数百万人的命运就正掌握在我们的手中。"
 calpeaceout.10.a:0 "消灭这些旧秩序的最后叛徒"
 calpeaceout.10.b:0 "我们承担不起另一场战争，让他们独立去吧"
 calpeaceout.11.t:0 "非太平洋诸州的命运"
 calpeaceout.11.d:0 "通过无尽的战火和英明的领导，我们已经战胜了联邦政府，现在华盛顿在我们手中，决定美国未来命运的权力现在正掌握在我们手中。我们已经为我们的人民赢得了独立与主权，并且摆脱了华盛顿那些腐败和自私的权贵们，而这些权贵们长期以来都把自己的野心放在履行对人民的职责之前。我们将坚持并促进真正的民主和共和主义的建国初心。而把这个受感染、道德沦丧的恶人政治国家抛在脑后，他们想干嘛就干嘛吧，因为太平洋之梦已经实现，美国的其他地方不关我们什么事了。我们是太平洋国，强大而自由，独立自由最终属于我们！"
 calpeaceout.11.a:0 "太平洋之梦终于实现"
 KX_california.44.t:0 "新“太平洋”共和国"
 KX_california.44.d:0 "今天阳光明媚，亨利·阿诺德将军在萨克拉门托国会大厦外向几千名与会者发表胜利演说。受人爱戴的老将军赞扬了我们的无数胜利和美德，让群众享受到了真正的启迪和爱国精神。\n\n“……假如有人问我，‘我们究竟在保护谁？太平洋国对我们意味着什么？’有时，我们忘记了我们社会的光芒甚至照耀到了边疆之外。有时，我们把先父为之艰难奋斗的权利当作理所应当。我们必须记得，不论太平洋国民身处何处，我们都不能忘记原则：那就是在共和国的公正法治下，同等的尊重、代表权和保护。这团烈火也曾在过去旧联盟的内心熊熊燃烧过。我们正是那个文明的继承者，是太平洋以东的持炬者，将那光芒照射到这片废土的黑暗之中。”\n\n“当美国沦陷时，我们屹立不倒；当美国沦陷时，我们扛起重担；当美国沦陷时，我们在莫哈维画下一条线，正如科罗拉多河般明晰，这条线，美利坚恺撒将不会跨过。今天，我们就是太平洋的浪潮，继续向东推进。我们是内华达山脉的红衫树，坚韧而不惧挑战。我们是西部之光，黑暗中的持炬人，共和国所有美好事物的化身。谢谢你们，谢谢你们。”他的演讲以人们雷鸣般的掌声河震耳欲聋的欢呼声告终——这是真正自由的太平洋国民为国父发出的声音。\n\n我们重生的共和国经过了火与血的洗礼，现在我们坚定地屹立着，秉持着我们的独立与价值观，而国父们的价值观已然完好无损。我们现在正驶向充满未知和越发黑暗的未来，而今天，伴随着将军演讲的结束，我们更应高举新共和国的旗帜，将太平洋各州国民永远团结起来。在这面旗帜下，在我们正义理想和传统的照耀下，我们的新太平洋共和国将会实现它的天命，不论那意味着什么，我们都会全速前进，团结一心。"
 KX_california.44.a:0 "我们高举现行旗帜——我们斗争的旗帜"
 KX_california.44.b:0 "我们高举新旗帜——这面洗净的旗帜让我们国家与诞生之时的暴力区分开来"
 CAL_NPR:0 "新太平洋共和国"
 CAL_NPR_ADJ:0 "太平洋国"
 CAL_NPR_DEF:0 "新太平洋共和国"
 CAL_Norton_PSA_ADJ:0 "美国"
 CAL_Norton_PSA_DEF:0 "大美利坚帝国"
 KX_california.1.d.noexiledpres:0 "现在国内局势已趋于平和，阿诺德将军认为是时候下台并任命临时政府了。由于大多数主流政党，如民主党、共和党和进步党，都支持干预内战，重建美国，因此他们都被禁止参选。只有少数候选人愿意带领我们实现太平洋国梦。\n\n漫画家、导演和企业家华特·迪士尼以及他的政治助手霍华德·休斯就是其中一项选择。霍华德来自国家远见党，该党成立于几天前。虽然这两人在太平洋国都家喻户晓，但迪士尼没有任何参政记录，选择他可能弊大于利。\n\n另一个可能的人选是联邦党的厄普顿·辛克莱。与太平洋其他主要政党不同，辛克莱并不支持内战，保持相当理性的态度。尽管如此，许多人担心任命这样一位激进亲左分子会使我们被联合工团吞并。作为对这些说法的回应，辛克莱强烈谴责联合工团，并详细 谈及了他所构想的太平洋国梦。\n\n下一个可能的候选是威廉·伦道夫·赫斯特和他的国家民主党，被禁止的民主党的分支。与太平洋国的许多人不同，赫斯特是对将军的政变最为支持的公众人士之一，而他利用赫斯特媒体帝国为阿诺德争取到的支持是无价的。事实上，阿诺德临时内阁中有许多人认为赫斯特的支持都是为了自己能趁机上任。从政策上看，赫斯特大体上是一个保守派，尽管传闻他确实与边缘政党灵性论运动有联系。无论如何，任命赫斯特不会是受到民众欢迎，但确实有其意义。\n\n或者，阿诺德可以放弃任命特定的人物，改为任命临时最高法院，来确保某种形式的稳定。同样摆在台面上的还有阿诺德继续掌权的选项。毕竟，既然一个缔造了太平洋之梦的人能凭一己之力保住这一切，为什么还要把权力交给激进分子呢？虽然所有选择都有自己的好处和坏处，但只有将军能作出选择。"
 KX_california.1.d.hasexiledpres:0 "现在国内局势已趋于平和，阿诺德将军认为是时候下台并任命临时政府了。由于大多数主流政党，如民主党、共和党和进步党，都支持干预内战，重建美国，因此他们都被禁止参选。只有少数候选人愿意带领我们实现太平洋国梦。\n\n漫画家、导演和企业家华特·迪士尼以及他的政治助手霍华德·休斯就是其中一项选择。霍华德来自国家远见党，该党成立于几天前。虽然这两人在太平洋国都家喻户晓，但迪士尼没有任何参政记录，选择他可能弊大于利。\n\n另一个可能的人选是联邦党的厄普顿·辛克莱。与太平洋其他主要政党不同，辛克莱并不支持内战，保持相当理性的态度。尽管如此，许多人担心任命这样一位激进亲左分子会使我们被联合工团吞并。作为对这些说法的回应，辛克莱强烈谴责了联合工团，并详细谈及了他所构想的太平洋国梦。\n\n下一个可能的候选是威廉·伦道夫·赫斯特和他的国家民主党，被禁止的民主党的分支。与太平洋国的许多人不同，赫斯特是对将军的政变最为支持的公众人士之一，而他利用赫斯特媒体帝国为阿诺德争取到的支持是无价的。事实上，阿诺德临时内阁中有许多人认为赫斯特的支持都是为了自己能趁机上任。从政策上看，赫斯特大体上是一个保守派，尽管传闻他确实与边缘政党灵性论运动有联系。无论如何，任命赫斯特不会是受到民众欢迎，但确实有其意义。\n\n有趣的是，恰巧流亡到太平洋国地区的前合众国总统表示有兴趣领导我们新成立的独立国家。虽然他们显然不接受太平洋国独立，但他们似乎受到了反战运动的影响，并接受了不干涉内战的理念。当然，任命前总统可能会被视为是对联邦派的侮辱，但也将是对继承我们抛之身后的合众国的民主和共和的明确承诺。\n\n或者，阿诺德可以放弃任命特定的人物，改为任命临时最高法院，来确保某种形式的稳定。同样摆在台面上的还有阿诺德继续掌权的选项。毕竟，既然一个缔造了太平洋之梦的人能凭一己之力保住这一切，为什么还要把权力交给激进分子呢？虽然所有选择都有自己的好处和坏处，但只有将军能作出选择。"
 KX_california.1.e:0 "赫斯特和他的国家民主党"
 KX_california.1.f:0 "请流亡总统上台"
 KX_california.12.d.noexiledpres:0 "阿诺德将军在不到一年的时间里再次辞职。国家的秩序至少在某种程度上已经恢复了，阿诺德认为国家已经足够稳定，可以把更多的权力交还给文职人员。在过去的几个月里，这个国家经历了几届政府，公众对该体系的信心已经破灭。面对这样的危机，阿诺德要再次做出一个选择。\n\n就像最初被任命的迪士尼一样，只有厄普顿·辛克莱、威廉·伦道夫·赫斯特和临时最高法院还在等待着被任命。在过去几周的混乱中，联邦党是少数几个呼吁和平的政党之一，在将军的眼中，他们一直在忍灾受难。虽然他没有被任命，赫斯特和他的媒体帝国从未停止歌颂我们或呼吁和平。这导致他们成为了我们比以前更亲密的盟友，许多人怀疑，我们是不是太依赖赫斯特了，以至于不会再去放弃他。另一方面，临时最高法院是少数几个在混乱中毫发无损的政府机构之一，这是一个令人印象深刻的成就。而临时最高法院的院长是法官相矶藤雄。同时，他也宣布了继续太平洋之梦的愿望，同时保持对和平主义理想的忠诚。\n\n除了这些人之外，阿诺德还可以举行大选，让人民投票选出他们自己的领导人。虽然大多数主要政党已被禁止，但最严重的混乱已经得到了遏制，人民正在恢复某种意义上的正常状态。虽然很明显，这可能会使整个太平洋之梦成为泡影，但它将为未来的政府提供民众授权的合法性。或者，阿诺德可以继续掌权，并维护自己的太平洋之梦。他早已证明了自己在处理帝制派时恢复秩序的能力，为何不将其扩大到整个国家呢？无论如何，就像以前一样，谁将引领太平洋走向未来的重任落在了阿诺德身上，他选择了……"
 KX_california.12.d.hasexiledpres:0 "阿诺德将军在不到一年的时间里再次辞职。国家的秩序至少在某种程度上已经恢复了，阿诺德认为国家已经足够稳定，可以把更多的权力交还给文职人员。在过去的几个月里，这个国家经历了几届政府，公众对该体系的信心已经破灭。面对这样的危机，阿诺德要再次做出一个选择。\n\n就像最初被任命的迪士尼一样，只有厄普顿·辛克莱、威廉·伦道夫·赫斯特和流亡总统与临时最高法院还在等待着被任命。在过去几周的混乱中，联邦党是少数几个呼吁和平的政党之一，在将军的眼中，他们一直在忍灾受难。虽然他没有被任命，赫斯特和他的媒体帝国从未停止歌颂我们或呼吁和平。这导致他们成为了我们比以前更亲密的盟友，许多人怀疑，我们是不是太依赖赫斯特了，以至于不会再去放弃他。流亡总统，在赫斯特和辛克莱的呼声之下，也一再徒劳地呼吁和平，并且非常明确地说，只有他才能弥补国家内乱造成的破坏。另一方面，临时最高法院是少数几个在混乱中毫发无损的政府机构之一，这是一个令人印象深刻的成就。而临时最高法院的院长是法官相矶藤雄。同时，他也宣布了继续太平洋之梦的愿望，同时保持对和平主义理想的忠诚。\n\n除了这些人之外，阿诺德还可以举行大选，让人民投票选出他们自己的领导人。虽然大多数主要政党已被禁止，但最严重的混乱已经得到了遏制，人民正在恢复某种意义上的正常状态。虽然很明显，这可能会使整个太平洋之梦成为泡影，但它将为未来的政府提供民众授权。或者，阿诺德可以继续掌权，并维护自己的太平洋之梦。他早已证明了自己在处理帝制派时恢复秩序的能力，为何不将其扩大到整个国家呢？无论如何，就像以前一样，谁将引领太平洋走向未来的重任落在了阿诺德身上，他选择了……"
 KX_california.12.e:0 "……任命了流亡的总统"
 calpeaceout.12.t:0 "太平洋国与联邦派结盟！"
 calpeaceout.12.d:0 "在亨利·阿诺德将军为尽可能避免战争而发动政变后，太平洋国正式站在了华盛顿和落基山脉的联邦派部队一边，这是谁也没有料到的。支持他们的原因并不是他们的路线突然改变，他们仍然还对联邦派怀有强烈的仇恨。然而，太平洋国也已被分裂主义思潮冲垮。他们认为，通过支持联邦派，他们将能够实现从燃烧的联邦中完全独立的梦想。虽然这对目前的形势没有什么影响，但无论如何，他们正在边境上虎视眈眈，我们政府中那些认为他们还能与其他势力保持和平的人想错了，根据太平洋国与联邦派达成的协议，与其他派别的签订的所有条约都已无效。最高指挥部的大多数人似乎都同意，这对我们的战争全局几乎没有影响，除了在联邦战线上的太平洋国部队偶尔会叹口气。"
 calpeaceout.12.a:0 "如果他们在前线，他们在我们到加州前就将尸骨无存！"
 calpeaceout.13.t:0 "华盛顿“承认”太平洋国独立"
 calpeaceout.13.d:0 "在亨利·阿诺德将军为尽可能避免战争而发动政变后，太平洋国正式站在了我们在华盛顿和落基山脉的联邦派部队一边，这是谁也没有料到的。支持他们的原因并不是他们的路线突然改变，他们仍然还对我们怀有强烈的仇恨。然而，太平洋国也已被分裂主义思潮冲垮。他们认为，通过支持我们，他们将能够实现从燃烧的联邦中完全独立的梦想。虽然[USA.GetLeader]在没有征得我们同意的情况下接受了这项协议，这在最高指挥部中引起了一些愤怒，但我们除了抱怨以外也没什么办法，因为[USA.GetLeader]仍是我们的代理总司令。根据协议，太平洋国部队现在可以在我们控制的领土内自由行动，预计太平洋国部队很快就会到达我们与朗派间的边界。虽然这只会进一步证实华盛顿对我们面临的灾难毫不关心，但我们现在只用向东打了，这一事实为我们带来了一些宽慰。"
 calpeaceout.13.a:0 "至少现在我们只有一条战线了……"
 CAL_TXS_loyalty_tooltip:0 "我们将继续忠诚于太平洋国，并在必要时再次支持他们。"
 CAL_TXS_choose_faction_tooltip:0 "这样我们就可以为另一个派别站队了。"
 pacificstates.4004.t:0 "帝国新旗？"
 pacificstates.4004.d:0 "随着联邦党统治着美利坚太平洋帝国，许多人想知道是否应该挂起另一面旗帜，而不是目前的帝国旗帜。辛克莱首相听到了这些呼声，并向诺顿皇帝呈递了两面替代国旗方案。第一种选择基于联邦党党旗，设计很简单。旗帜使用原太平洋国旗的配色，而该党的标志则被放置在中间。第二个标志，与蜜蜂的主题相似。旗帜使用红色背景，中间有一些蜜蜂团，代表联邦党的计划。虽然这两个国旗显然都包含了联邦党的元素，但用什么国旗，仍然取决于皇帝自己的选择。"
 pacificstates.4004.a:0 "帝国旗帜将永存"
 pacificstates.4004.b:0 "使用太平洋国配色的蜜蜂听起来还行"
 pacificstates.4004.c:0 "哦，蜜蜂配红色？帝国的完美之选！"
 KX_california.13.d.friendswithfeds:0 "虽然根据与麦克阿瑟达成的协议，我们和西部军指挥中心名义上维持和平关系，但这阻止不了霍华德总统的宏大计划。拉斯维加斯对他的计划至关重要，但在内战爆发之时，此地却处在西部联邦派的控制之下，这种情况不会持久下去了。\n\n为打开局面，霍华德总统授权执行“万能牌行动” ，即全面入侵内华达尚未控制的部分，特别是拉斯维加斯。因为之前的交易，拉斯维加斯没有太多驻军，而且我们会允许他们放下武器离开，不必出现不必要的牺牲。虽然这很难和联邦派解释，但毕竟霍华德钱包鼓鼓，他们不会有太多异议……"
 KX_california.13.d.fulldivisonof:0 "内华达州边境小城拉斯维加斯的警卫不敌我们大军四面包围，迅速宣告投降。除了零星的枪炮交火，还有一位军官去清泉镇买雪景球外，“拉斯维加斯之战”没有出现任何波折，双方均无人伤亡。虽然这次对联邦派领地的入侵完全可能把我们拖入内战，但霍华德总统有计划避免这种可能化为现实。总统动用自己的财富，向政府保证西部军指挥中心会继续注重另一战线。不管他的计划能否奏效，现在整个内华达州都处于太平洋国的合法领导下了，总统对拉斯维加斯城的规划可以全面展开了……"
 KX_california.13.b:0 "谁会争夺这片贫瘠的沙漠？"
 calpeaceout.14.t:0 "脱离联邦的选择"
 calpeaceout.14.d:0 "虽然阿诺德将军率领军队进军萨克拉门托才刚刚过去几天，我们的政府还很不稳定，但现在是时候为我们的未来做出决定了。当阿诺德迫使前临时政府下台时，他是打着所谓“和平贩子”运动的旗号的，这个运动不仅呼吁我们不要卷入即将到来的内战，而且还呼吁在西海岸建立一个分裂主义的共和国。现在我们掌权了，这个运动迎头撞上了现实的铜墙铁壁，结果他们分裂成了两个阵营。\n\n第一个，也是最大的阵营，被称为“现实主义者”，希望我们利用阿诺德将军在武装部队中的关系与联邦派达成协议。根据这项协议，太平洋国军队将同麦克阿瑟派并肩作战，以换取他们承认太平洋国的主权。现实主义者说，通过这一方式，我们可以真正确保我们的孩子有一个光明的未来——至少他们是这样说的。\n\n第二个阵营，则被称为“理想主义者”。“理想主义者”们主要由下层军官和学生组成，他们呼吁我们完全放弃美国。他们让我们拒绝同交战各方达成任何协议，而是专注于建设太平洋之梦，避免发生任何冲突。与现实主义者不同的是，如果内战的胜利者要求我们重新并入美国，他们没有可选的，只能让太平洋国进一步军事化以抵挡敌人。\n\n随着麦克阿瑟的最后期限越来越近，已没有进行辩论的时间了。阿诺德将军现在必须做出决定，而这个决定关乎数百万人的生命。"
 calpeaceout.14.a:0 "麦克阿瑟将军是我们建立持久的太平洋国的唯一希望"
 calpeaceout.14.b:0 "美国是一艘正在下沉的船，我们不会和它一起沉没"
 calpeaceout.15.t:0 "“太平洋之梦”的兴起"
 calpeaceout.15.d:0 "在阿诺德将军领导了萨克拉门托军事政变后，太平洋国正式向所有的敌对美国政权宣布，他们拒绝参与“毫无意义的血腥屠杀”，并正式宣布完全和单方面地从美利坚合众国独立。虽然这一事态的发展极为异常，但由于战争的爆发，我们也无力阻止他们。显然，当一切尘埃落定时，我们将与他们做个了结，但报告显示，由于太平洋国突然宣布独立，导致了其控制地区日益增长的骚乱，许多人又开始相信太平洋国将很快陷入战争。不管怎样，至少在现在，西海岸可以自由地实现他们的太平洋之梦了。"
 calpeaceout.15.a:0 "懦夫！等这一切结束后，我们再来对付他们！"
