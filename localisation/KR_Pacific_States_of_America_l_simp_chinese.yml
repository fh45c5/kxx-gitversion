 KX_california.33.b:0 "遵循法统，加冕赫伯特·弗雷泽·诺顿"
 KX_california.370.t:0 "新帝继位"
 KX_california.370.d:0 "赫伯特·弗雷泽，在其兄长撒手人寰之后，便戴上了那顶沉重的皇冠，加冕为诺顿三世。诺顿家族之人，大多对诺顿复辟会中的人物心存疑窦，赫伯特·弗雷泽亦是如此。他之所以接受他们所赐予的贵族身份，不过是为了让自己及亲族能够过上更为优渥的生活罢了。那因远祖那荒诞不经的妄想，而被放逐到异国他乡的念头，在众人眼中，不过是一场虚无缥缈的幻梦。然而，在诺顿家族中，这却早已化为了触手可及的现实。赫伯特·弗雷泽·诺顿，如今的诺顿三世，便是对这种荒诞而又真实境遇的绝佳诠释。虽诺顿王朝在太平洋国声名显赫，赫伯特·弗雷泽却并无废除君主制或传位之意。诺顿三世的登基，恰似为诺顿王国开启了一扇通往温和统治时代的大门。他继承了兄长那慈善为怀的优良传统，但与前任诺顿不同，赫伯特·弗雷泽决心在公共与政治生活的舞台上，收敛锋芒，低调行事。"
 KX_california.370.a:0 "合格的继承人"
 pacificstates.13.e:0 "恭喜现任总统！"
