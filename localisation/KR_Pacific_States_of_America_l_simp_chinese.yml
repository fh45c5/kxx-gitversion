 POLITICS_WALT_DISNEY_DESC:0 "华特·迪士尼有许多名号：商人、政治家、远见家等等。1901年在芝加哥，伊利亚斯和弗洛拉·迪士尼诞下了华特，他在10岁的时候搬到密苏里州的堪萨斯城，但不久又返回芝加哥。迪士尼于1923年前往好莱坞，在卡通行业工作，因为他哥哥在那正因感染肺结核疗养。1925年，迪士尼与其雇员水墨画师莉莲·邦兹结婚。他们有了一个女儿，又领养了一个。在30年代早期，迪士尼开始政治生涯，并支持加州共和党，这让他成为加州政治舞台上一颗冉冉升起的新星。随着内战爆发，华特对太平洋国政府表示全力支持，宣布要竞选总统。他参加了大选，并克服一切障碍，拿下了总统宝座。虽然反对者称他为独裁者和专制公，政府却对他和他为全美准备的计划完全支持，不论其最终结果为何。"
 POLITICS_CAL_NORTON_II_DESC:0 "诺顿二世皇帝，这位历经诸多荒诞事件的传奇人物，最终成为了一个本不该存在的帝国的统治者。1881年出生的查尔斯·罗斯·诺顿，其叔祖正是那位自封为美利坚皇帝的狂人，而他未曾料到这个家族轶事竟会引发自己生命中更疯狂的篇章。在南非度过的大半生里，诺顿始终过着平静祥和的隐士生活，甚至育有一子名为杰拉德·诺顿。即便世界大战的硝烟也未曾打破他的生活轨迹，岁月始终如溪流般潺潺流淌。\n\n直到那个宿命之日，旧金山的一场宴会邀请函改变了一切。原本只是诺顿信徒们的聚会，却阴差阳错地将他卷入太平洋国当时风起云涌的政治漩涡。当他回过神来时，加冕典礼的钟声已在旧金山响起，更令人称奇的是，混乱竟随之平息。虽然聚集起了一批愿为他赴汤蹈火的忠诚信徒，但岁月不饶人。在许多人眼中，这位皇帝对自己的尊位总带着几分勉为其难。可每个清晨醒来时，他仍会下定决心，至少要为治下子民面临的困境略尽绵力。"
 POLITICS_WALT_DISNEY_AUTOCRAT_DESC:0 "华特·迪士尼有许多名号：商人、政治家、远见家等等。1901年在芝加哥，伊利亚斯和弗洛拉·迪士尼诞下了华特，他在10岁的时候搬到密苏里州的堪萨斯城，但不久又返回芝加哥。迪士尼于1923年前往好莱坞，在卡通行业工作，因为他哥哥在那正因感染肺结核疗养。1925年，迪士尼与其雇员水墨画师莉莲·邦兹结婚。他们有了一个女儿，又领养了一个。在30年代早期，迪士尼开始政治生涯，并支持加州共和党，这让他成为加州政治舞台上一颗冉冉升起的新星。随着内战爆发，华特对太平洋国政府表示全力支持，宣布要竞选总统。但是政治瞬息万变，迪士尼也是如此。在阿诺德干预后，迪士尼和霍华德·休斯组建了国家远见党。迪士尼获选后，人们期待稳定与繁荣，但是反对随之而来，国家陷入崩溃，迪士尼采取了极端手段。民主制度毫无意义，不过是让美国堕入深渊。因此，迪士尼抛弃了阻碍远见计划的民主势力。“远见党”已经把政府的人员全部换为迪士尼的拥簇，并建立了以迪士尼为首的独裁政权。反对派被全部压制，混乱结束了。随着权力巩固，迪士尼可以开始自己为国家准备的计划，至于其内容为何，全由迪士尼决定。许多人相信在迪士尼引导下，美国不只会繁荣，更会达到前所未有的高度，但只有时间才能告诉我们，这样的事情究竟会不会发生。"
 POLITICS_JOHN_AISO_DESC:0 "相矶藤雄于1909年12月生于洛杉矶伯班克，父母是日本移民。少年时期，由于美国当时高涨的排日情绪，相矶藤雄饱受同龄人欺凌。二十年代就读好莱坞高中时，他在校内宪法演讲比赛中夺冠而声名鹊起，却因种族歧视被禁止参加全国赛事。1926年毕业后，他曾在日本成城大学深造一年，后赴美国布朗大学求学，于1931年以优等生荣誉毕业并担任毕业生代表。1934年哈佛大学深造完成后，他在美日两地从事私人法律实务直至1936年。内战爆发后，这位法学家选择效忠故乡太平洋国政府，辗转至萨克拉门托效力。\n\n这本该是他职业生涯的巅峰，然而随着太平洋国陷入乱局，爱三竟意外获任加州最高法院大法官。最终在一场导致临时最高法院接管政权的宪政危机中，他阴差阳错成为政府实际掌舵人。如今相矶藤雄执掌的政权前路未卜，但可以确定的是，美利坚的命途已永远改变。"
 CAL_switch_leader:0 "让[CAL.GetLeader]休息一下吧"
 CAL_switch_leader_desc:0 "在过去的一段时间里，[CAL.GetLeader]一直勇敢地领导着我们的国家，而他的同僚则一直在暗处统御其他事务。随着时间的推移，许多政府官员认为我们应该让[CAL.GetLeader]退居幕后，并让他的同僚走上前台，使其有充足时间进行休息，从成为国家公众形象的压力中恢复过来。"
 CAL_million_sons:0 "阿诺德使我们避免了血腥的战争！"
