 CAL_the_big_push_westwards:0 "冰川行动"
 CAL_the_big_push_westwards_desc:0 "在多月的准备与计划后，第一支跨越落基山脉的部队吹响了冲锋号，冰川行动随之开始，为避免敌人取胜，我们必须尽可能地占领更多的领土。"
 CAL_military_industrial_production_1:0 "军事工业生产"
 CAL_military_industrial_production_1_desc:0 "在国贼们控制了落基山脉以东的情况下，留给我们的武器生产能力十分紧缺，因此我们不得不和西海岸的一些当地工业企业签订新的订单来满足前线对武器装备的需求。不过幸运的是，西海岸的许多企业都有能力和意愿来为我们生产武器。只要能从财政里多挤出些钱来，我们就可以大幅提高这些公司的生产能力——而现在没有什么比足质足量的武器和弹药更能让我们的前线战士安心了。"
 CAL_military_industrial_production_2:0 "军事工业生产"
 CAL_military_industrial_production_2_desc:0 "在国贼们控制了落基山脉以东的情况下，留给我们的武器生产能力十分紧缺，因此我们不得不和西海岸的一些当地工业企业签订新的订单来满足前线对武器装备的需求。不过幸运的是，西海岸的许多企业都有能力和意愿来为我们生产武器。只要能从财政里多挤出些钱来，我们就可以大幅提高这些公司的生产能力——而现在没有什么比足质足量的武器和弹药更能让我们的前线战士安心了。"
 CAL_military_industrial_production_3:0 "军事工业生产"
 CAL_military_industrial_production_3_desc:0 "我们在内战中取得的绝对胜利，离不开我们背后依靠的规模庞大的军工复合体。但现在我们重归和平，也许是时候减少在军事工业方面的支出，让资金重新回到社会中去了。然而，当前国际局势风云变幻，谁也说不准我们的国家会不会突然被卷入另一场战争。正因如此，我们最好还是保留对军事工业的补助，以便继续维持这个巨大的军工联合体，这是我们面对外敌威胁时保护自己的最佳手段。"
 CAL_military_industrial_production_4:0 "军事工业生产"
 CAL_military_industrial_production_4_desc:0 "我们在内战中取得的绝对胜利，离不开我们背后依靠的规模庞大的军工复合体。但现在我们重归和平，也许是时候减少在军事工业方面的支出，让资金重新回到社会中去了。然而，当前国际局势风云变幻，谁也说不准我们的国家会不会突然被卷入另一场战争。正因如此，我们最好还是保留对军事工业的补助，以便继续维持这个巨大的军工联合体，这是我们面对外敌威胁时保护自己的最佳手段。"
