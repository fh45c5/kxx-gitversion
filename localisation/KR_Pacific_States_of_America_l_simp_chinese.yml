 CAL_power_in_hands:0 "权力归于正确之人"
 CAL_army_without_sons:0 "无需后辈们的军队"
 CAL_economy_no_greed:0 "繁荣的经济，繁荣的人民"
 CAL_arnold_beloved:0 "阿诺德，后辈的救星"
 CAL_marshalls_economy:0 "马歇尔，共和国的救世主"
 CAL_pacific_dreamin:0 "太平洋之梦"
 CAL_million_sons_saved:0 "百万子民终得救赎！"
 CAL_million_sons_saved_desc:0 "欢呼吧！我们已从内战中幸免于难。后辈们无需被迫同他们的美国兄弟手足相残，我们无辜的鲜血也将不再浪费！在我们武装部队的保护下，在亨利·阿诺德将军和乔治·马歇尔将军的双重领导下，我们的独立民主将在仁慈的军事统治下得到保存。上帝保佑阿诺德，上帝保佑马歇尔，上帝保佑新太平洋共和国！"
 CAL_industry_for_million_sons:0 "为得救之人而生的产业"
 CAL_industry_for_million_sons_desc:0 "虽然我们免于遭受战争的恐怖，但我们仍然需要为孩子们创造出繁荣经济。双头政府的马歇尔将军提出了一个计划，肯定会让所有参与者感到满意。利用资本投资和外国援助，我们将建设自身和盟友们的经济，同时使这些盟友在未来经济上依赖我方，确保我们未来的繁荣。无论你是贫穷还是富有，无论你是年轻还是年老，你都将获得你真正应得的繁荣！"
 CAL_build_up_capital:0 "建设我们的宝贵大都市"
 CAL_build_up_capital_desc:0 "马歇尔经济计划的第一步就是在首都建立起大小企业。尽管他并不信任那些主宰城市中心的富裕精英，但他也不会让他们成为国家真正繁荣的阻碍。首都将会变成一个光彩夺目，繁荣昌盛，利润丰厚的伟大都市，供所有人所瞻望，作为未来规划和一个展示即将降临至我们所有人身边的好运窗口！"
 CAL_build_up_lesser_fortunate_areas:0 "为我们的穷人铺平道路"
 CAL_build_up_lesser_fortunate_areas_desc:0 "我们太平洋沿岸的穷苦人民永远是一个挥之不去的问题，当国家的注意力集中在其他不那么丑陋的问题之时，他们被掩藏了起来。穷者愈穷，富者愈富，这一进程已经存在了几个世纪。不能再这样下去了！马歇尔将军的庞大经济计划只会进一步扩大，将平民主义带往无知的大众之中。双头政府将为那些需要的人提供免费的住房、食物、水和其他基本必需品，同时还将协助寻找和创造就业机会、教育和医疗改革——特别是在我们最贫困的地区。旧时的政客们也许忽视了我们的人民，但军队可不会如此！"
 CAL_towns_into_cities:0 "转镇为城"
 CAL_towns_into_cities_desc:0 "穷人们终于得到了提拔与供养。在失败的民选政府那里几乎得不到资金的贫穷城镇和村庄现在已经繁荣起来，变成了小型城市，城市中心充满了经济活动和善意。随着这些工人阶级在我们仁慈军政府的养育下成为新的中产阶级，他们将成为我们社会和经济的新骨干。反过来，我们将继续为这些衣衫褴褛的灵魂提供帮助——直到他们能够再次自立。"
 CAL_cities_into_utopia:0 "变城为乌托邦"
 CAL_cities_into_utopia_desc:0 "自从马歇尔巧妙的经济计划开始以来，主要城市的规模进一步扩大。曾经荒凉且破败的诸多城市中心现已成为熠熠生辉的财富与繁荣之地。在城市扩张中，那些不那么幸运的人也开始在世界范围内崭露头角，不仅仅拥有了一份体面的工作，许多人还成为了当地的政治家或企业家。不管一些人对我们国家层面的民主“倒退”批评些什么，没有人可以否认：我们的经济已经蓬勃发展，我们的城市人口空前繁荣！"
 CAL_prospering_economy_for_prospering_citizens:0 "将军计划的凯旋"
 CAL_prospering_economy_for_prospering_citizens_desc:0 "随着太平洋国的经济以前所未有的速度发展，我们美丽海岸线上的所有民众现在都生活在仁慈双头政府统治下的资本主义天堂中。穷困潦倒的大众得到了帮扶，大小企业都在蓬勃发展，国际贸易从我们诸多利润丰厚的港口进进出出，加利福尼亚阳光下的每个人都享受到了和平与利润。上帝保佑乔治·马歇尔，上帝保佑加利福尼亚！"
 CAL_army_without_million_sons:0 "无需百万后辈们的军队"
 CAL_army_without_million_sons_desc:0 "征兵是魔鬼的行为。我们的后辈们绝不能被派去与自己的兄弟自相残杀，或在某个外国的滩头死于非命。双头政府的亨利·阿诺德将军提议结束征兵，让我们的后辈光荣回国。我们只需要一支小规模的防御部队，并调整我们的战术，以便不再无谓地让太平洋民众流血。"
 CAL_necessary_demobilization:0 "快速大规模复员"
 CAL_necessary_demobilization_desc:0 "阿诺德将军为太平洋地区带来和平计划中的第一步是让全武装部队复员到和平时期水平。各部门的士兵和军人将被遣送回家，留下一小群具备奉献精神的兄弟们保卫太平洋的未来。"
 CAL_found_RAND:0 "建立研究与开发公司"
 CAL_found_RAND_desc:0 "道格拉斯航空公司将与我国空军合作成立研究与开发公司，以推动我方科学知识在军事方面的应用极限。我们将以一个强大的、现代化的、高度先进的中央兵团为中心，建立一支新型且尖端的武装力量，不惜一切代价保卫我们和平的太平洋天堂。"
 CAL_lessen_need_for_mils:0 "削减军工复合体"
 CAL_lessen_need_for_mils_desc:0 "我们必须削减臃肿的军工复合体，将节省下来的资源转移到新的部门和投资渠道，以更好地适应当前新现实。不再让我们的整个工业成为无休止且贪得无厌的战争机器之奴。"
 CAL_necessarily_enlarged_airforce:0 "保卫后辈们的空军"
 CAL_necessarily_enlarged_airforce_desc:0 "我们必须采取空中行动以减少伤亡，并更好地将我们较小的武装力量更有效地扩展到更大的区域。我们将建立世界上有史以来最强大、人数最多、组织最严密的空军，以地面支援和制空权原则为基础，作为我们太平洋天堂的空中之盾。"
 CAL_an_army_withour_our_sons:0 "保护无辜者的军队"
 CAL_an_army_withour_our_sons_desc:0 "我们的后辈们不会再死于愚蠢无用的战争，我们的民众也不会再为这些冲突付出代价。我们削减了不必要的军事冗余，打造了美国历史上最强大的国防部队。我们的军队是太平洋和平的堡垒，是无辜者的盾牌，任何想让太平洋民众付出哪怕一滴鲜血的企图都将遭到拒绝和地狱般的代价。"
 CAL_prosperity_for_million_sons:0 "人民的繁荣"
 CAL_prosperity_for_million_sons_desc:0 "人民已经经历了太久苦难。我们必须为太平洋沿岸带来稳定、利润与繁荣，治愈大萧条和围绕着我们独立混乱的最后创伤，同时向我们的新群众表明，军队不是什么可怕之物。"
 CAL_no_need_for_political_greed:0 "终结政治贪婪"
 CAL_no_need_for_political_greed_desc:0 "职业政客一直是个坏主意。他们只知道腐败和自私自利，总是把自己的需求放在他们应该代表和保护的人民之上。我们将终结一切形式的职业政治，用忠诚、廉洁的军人充实联邦政府，同时对所有我们允许继续运作的地方民主政府开展严厉的反腐运动。"
 CAL_get_rid_of_ogliarchs:0 "废黜浮华寡头"
 CAL_get_rid_of_ogliarchs_desc:0 "国家中的富有精英和寡头——无论他们是政治家或商业巨头，名流或女继承人，都是寄生虫。他们所做的就是从诚实者的口袋里吸走财富，同时蛊惑着大众，因其身份而逍遥法外。这些卑鄙的精英沙文主义者应被废黜，他们多余的财富将被政府没收，重新分配给军队和穷人。太平洋将不再是享乐主义和傲慢寄生虫的老巢！"
 CAL_no_need_for_radicals:0 "打击极端主义的腐朽之心"
 CAL_no_need_for_radicals_desc:0 "激进主义在我们的太平洋海岸没有立足之地，因为正是激进主义、极端主义和派系主义首先导致了这场可怕的内战。赫斯特、辛克莱、诺顿主义者、远见者和灵性论者等极端分子将被取缔并边缘化。任何反对这项事业的人都将被投入军队监狱等待军事审判。我们将净化这个军政共和国，把真正、诚实、开明的中间路线和温和主义带往这个阳光普照的海岸。"
 CAL_cut_corruption_off:0 "根除资本主义腐败"
 CAL_cut_corruption_off_desc:0 "长期以来，腐败一直是美国的附骨之疽，几乎每个城镇、企业、县和州都以某种形式表现出腐败。对某些人来说，腐败乃人之本性，但我们应该尽最大努力彻底根除腐败、裙带关系和所有其他类似的恶习，以净化我们仁慈的军政府。"
 CAL_power_in_right_hands:0 "军队仁政"
 CAL_power_in_right_hands_desc:0 "在阿诺德将军和马歇尔将军的双重统治下，太平洋海岸已经进入了新的黄金时代。以乔治·华盛顿将军等强人开国元勋为榜样，我们已经建立了一个平民主义、进步、真正仁慈的军政共和国，在太平洋武装力量的带领下，照顾民众，传播美国自由与平等的价值观。尽管国家层面的民主早已消亡，职业政客已被淘汰，但在阿诺德和马歇尔的天鹅绒手套下，地方民主和诚实的资本主义依然存在，并将自由呼吸。"
 CAL_arnold_my_beloved:0 "阿诺德，后辈的救星！"
 CAL_arnold_my_beloved_desc:0 "在阿诺德将军的领导下，我们的军队获得了重生，被塑造为保卫我们新利益和天堂的盾牌，而不是用来打击敌人的军刀。通过他的仁慈之手，我们的和平与繁荣得到了保障。感谢阿诺德将军，太平洋的英雄，我们后辈的救星！"
 CAL_marshall_bros:0 "马歇尔，共和国的救世主！"
 CAL_marshall_bros_desc:0 "在马歇尔将军的领导下，我们的经济复苏速度之快超出了任何人的预期，确保了我们在旧联邦的其他地区于激进主义大火中熊熊燃烧之时继续存续与繁荣。由于他的计划，我们的持续盈利和繁荣都得到了保障。感谢马歇尔将军，太平洋的英雄，共和国的救世主！"
 CAL_pacific_preserved:0 "太平洋之梦终得存续！"
 CAL_pacific_preserved_desc:0 "在双头政府的统治之下，太平洋之梦得到了保护。我们安然无恙地生活在美丽的，阳光普照的海岸之上，远离前联邦其他地区所遭受的暴力。公平资本主义、自由以及确保人权及公民权利的美国梦在这个新美利坚——一个没有将我们的同胞引入歧途罪恶的国家得到了充分的保障和维护。在双头政府的统治下，依靠马歇尔的经济和阿诺德的军队，我们的梦想将永远存续！"
 KX_california.1.g:0 "拒绝激进主义，阿诺德将独自统治"
 KX_california.12.g:0 "……拒绝这些计划，独自统治"
