 ISR_return_lands_decisions:0 "归还土地"
 ISR_thesterngang:0 "与斯特恩帮站在一起"
 ISR_thesterngang_desc:0 "只有莱希才能保护以色列免受外部威胁，只有他们才能按照上帝的意愿建设以色列。"
 ISR_unionofcultures:0 "文化联合"
 ISR_unionofcultures_desc:0 "几个世纪以来，世界上分裂的犹太人群体一方面创建了自己的文化，一方面又直接忠于犹太人与圣城。我们必须致力于丰富多彩的价值观，否则，我们将像之前的许多国家一样，被历史淘汰。让我们不要重复我们祖先的错误。"
 ISR_onepeopleinzion:0 "锡安一民族"
 ISR_onepeopleinzion_desc:0 "希伯来人的复兴是一个更伟大理念的一部分——恢复犹太人之间的文化团结。很显然，继续将我们的人民视为流散的，形形色色的民族——塞普哈迪，阿什肯纳齐，米兹腊希等……是大错特错的。我们必须弥合犹太人之间的分歧，以促进一个团结一致民族的形成，进而能够作为一个整体来应对外部的挑战。"
 ISR_coordinatethemillitias:0 "协同良好的民兵组织"
 ISR_coordinatethemillitias_desc:0 "组成犹太复国主义叛乱的愤怒组织们必须齐心协力才能生存，而我们人民的未来就取决于它们。"
 ISR_foundationoftheknesset:0 "设立议会"
 ISR_foundationoftheknesset_desc:0 "大议会是以色列的主议院。其先源是以色列古代的宗教议会，由智者和先知所组成的集聚大会上所表决一切决议，而现代议会承载着宗教大会的这一遗产。它将会成为以色列政府的法律部门，负责监督以色列的政治。"
 ISR_thehaganahjoins:0 "哈加纳的帮助"
 ISR_thehaganahjoins_desc:0 "社会党准军事部队哈加纳在争夺耶路撒冷的战争中向我们提供了帮助。他们一直在保护犹太人定居点，他们可以动员数百名经验丰富的民兵，进而增加我们将加兹国王赶出以色列的机会。\n为哈加纳欢呼！"
 ISR_raidforsupplies:0 "劫掠补给"
 ISR_raidforsupplies_desc:0 "我们如果想要赢得这场战争——确保犹太人未来的战争，不仅需要来自海外的志愿者。叙利亚王国曾经用来对付犹太人的枪支和弹药将会转而为我们所用。"
 ISR_sabotagesupplylines:0 "破坏补给线"
 ISR_sabotagesupplylines_desc:0 "没有弹药物资和增援部队，叙利亚军队的威胁会小得多。我们的侦察旅将开始有针对性地破坏他们的补给线。"
 ISR_defenceoftheyishuv:0 "伊舒夫的防御"
 ISR_defenceoftheyishuv_desc:0 "自古以来，我们在以色列的土地上不断地重新建设自己，建立属于我们自己的城市，发展属于我们自己的定居点，面临着针对我们的破坏与威胁。现在——蓝色白底六角星的旗帜和武装部队来了，以保护我们的社区免受武装分子的袭击。\n哈加纳部队的目标是保卫以色列之地，并反击她所面临的威胁。"
 ISR_thelawofreturn:0 "归乡法"
 ISR_thelawofreturn_desc:0 "以色列法律规定，“每个犹太人都有权以移民身份来到这个国家。”"
 ISR_mainstreamhebrew:0 "主流希伯来人"
 ISR_mainstreamhebrew_desc:0 "由于许多抵达以色列的犹太移民的希伯来语并不流利，因此，政府必须努力提高希伯来人的识字率和希伯来语的流利度，使古老的希伯来语成为我们的统一语言。"
 ISR_benyehudaaproach:0 "本·耶胡达之法"
 ISR_benyehudaaproach_desc:0 "在著名的词汇学家本·耶胡达的一生中，他普及了伊舒夫社区之间对希伯来语的常规使用方法。他是一个有远见的人，并忠诚于犹太的梦想。\n希伯来语的重生是一个巨大的成就，人们愿意放弃散居地的语言，再次完全致力于他们的母语。"
 ISR_preserveyiddishladinoandaramaic:0 "保留意第绪语，拉迪诺语和阿拉姆语"
 ISR_preserveyiddishladinoandaramaic_desc:0 "我们许多的兄弟们来到了圣土，为我们带来了丰富的语言和文化。虽然希伯来语是当代锡安的官方语言，但我们不能让这些犹太文化的瑰宝消失。我们要开设这些语言的课程，并尽一切可能保护它们，这是我们的职责。"
 ISR_therevisionistzionistsplit:0 "改良犹太复国主义精神"
 ISR_therevisionistzionistsplit_desc:0 "改良主义者和犹太复国主义政治中的大多数团体一样，并不团结。泽夫·雅博廷斯基的修正锡安主义联盟与雅尔·斯特恩的莱希因后者的激进而发生冲突；或者相反，莱希拒绝坚持雅博廷斯基所谓的犹太复国主义路线。这些组织准备互相分裂，而这让非改良主义者的力量增强。但这一转变也可能推动莱希采取更加激进的行动……"
 ISR_fundurbanization:0 "投资城市化"
 ISR_fundurbanization_desc:0 "我国很多地区的基础建设仍不发达。随着战争在耶路撒冷爆发，大部分殖民地的道路遭到破坏。我们需要启动重建项目，为城市化提供资金，让人们摆脱农村，为建立现代的以色列国家铺平道路。"
 FNG_fightforthezionistcause:0 "东北犹太国"
 FNG_fightforthezionistcause_desc:0 "我们的时代已经到来。每一个真正的以色列人都将拿起武器，向我们的压迫者发动战争！我们的意识形态可能不同，但我们的梦想是一样的：建立一个主权国家，由希伯来人，而不是其他任何人领导。是时候站起来，拿走本属于我们的东西了！"
 ISR_lehiirgunoperations:0 "莱希-伊尔贡联合行动"
 ISR_lehiirgunoperations_desc:0 "许多民兵或准军事部队正在消除彼此分歧，以确保国家在敌人的围攻下生存下来。虽然哈加纳防御着我们的农村，但两个民族主义民兵团队必须联合起来战斗并建立一支军事力量。"
 ISR_theisraeliconscriptionlaws:0 "以色列征兵法"
 ISR_theisraeliconscriptionlaws_desc:0 "为了保持住战争势头，我们需要出台新的征兵法。我们每一个人都有责任加入到为我们的祖国而战的行列。我们不仅要为自己的自由而战，也要为我们的儿女们的自由而战！我们需要动员每一个有能力的男人和女人来保卫国家，从现在到永远……"
 ISR_democracyestablished:0 "建立民主制度"
 ISR_democracyestablished_desc:0 "决不能允许斯特恩和其崇拜者们在这一动荡时期夺取权力，从而扭曲我们国家的进程。比政变更好的是让我们的公民选择他们的领导人，让他们在国家的方向上有真正的发言权。生活在众多殖民老爷，国王和暴君统治下的所有中东人民都会羡慕我们蓬勃发展的民主！"
 ISR_reunitewithourbrothers:0 "统一我们的兄弟"
 ISR_reunitewithourbrothers_desc:0 "我们的行动已经基本完成，埃塞俄比亚的犹太人正在大量抵达以色列。很快，就只剩下了一个最顽固的敌人——贝塔以色列国了，而它将不复存在。"
 ISR_buildroads:0 "修建道路"
 ISR_buildroads_desc:0 "我们的特工发现，通往红海和尼罗河的交通线不能满足犹太人的迁入，因此，派遣以色列工程师，拨出资金修建更好的公路和铁路将有助于我们自己的人民和贝塔以色列人。"
 ISR_fightforbetaisrael:0 "为了贝塔以色列而战"
 ISR_fightforbetaisrael_desc:0 "现在是时候让是时候让贝塔以色列消失了——至少在我们完成撤离之前。"
 ISR_infiltrateethiopia:0 "渗透埃塞俄比亚"
 ISR_infiltrateethiopia_desc:0 "为了帮助贝塔以色列人回到家乡，我们必须向该地区派遣特殊人员，并建立出境渠道。"
 ISR_ourbrotherstothesouth:0 "我们南方的兄弟"
 ISR_ourbrotherstothesouth_desc:0 "埃塞俄比亚的动乱对塞米安地区的犹太人构成了威胁。如果他们处于危险之中，那么我们就应该插手。"
 ISR_dealswithourfoes:0 "向以色列青年运动拨款"
 ISR_dealswithourfoes_desc:0 "以色列青年运动最初是为了教会犹太人适当的技能，帮助他们在抵达以色列后建立集体农场。该组织需要获得更多资金，因为目前它没有足够的精力与人力培训足够的新移民。"
 ISR_returnfromamerica:0 "自美国而归"
 ISR_returnfromamerica_desc:0 "自18世纪以来，犹太人就源源不断地逃往美国，以逃离欧洲的压迫。他们不仅帮助了美国独立战争，还通过支持公民社会，企业和社区来帮助美国的独立战争。然而，美国人从未真正接受我们，即使在所谓的自由堡垒中，我们也被视为下等人，就像那群非犹太的白皮征服的其他种族一样。但现在，锡安将他们带回温暖的怀抱，自由的犹太儿女们将回到家乡。"
 ISR_fullexilefromfrance:0 "结束法国的遣送计划"
 ISR_fullexilefromfrance_desc:0 "这些沃土就像是高温下的猫咪一样想被种子和锄头抚摸。为了我们的生存，我们必须扩张。法国人们长期以来都不喜欢我们。而现在，它正全速地驶入毁灭，让我们尽可能地引渡法国的犹太人回到自己的家乡。"
 ISR_fullexilefromrussia:0 "结束俄罗斯的遣送计划"
 ISR_fullexilefromrussia_desc:0 "俄罗斯犹太人经历的苦难——数百年的压迫，屠杀和暴力——向他们发出了一个明确的信息：“俄罗斯人不欢迎你们”。但不要害怕，因为有一个新的家园正张开双臂等待着你的来到。"
 FNG_encourageimmigration:0 "鼓励犹太移民"
 FNG_encourageimmigration_desc:0 "在世界各地还有不少犹太人同胞遭受着非人对待。我们将鼓励全球各地的犹太人向这里移民。"
 ISR_nooneleftbehind:0 "无人落后"
 ISR_nooneleftbehind_desc:0 "我们并不希望在我们的兄弟姐妹入境的时候受到不公正的审查。这里没有荒谬的审查程序，没有入境税或关税，当然也没有基于种族或国籍的歧视。锡安的大门敞开着，我们邀请世界进入我们的怀抱。"
 ISR_nationalizebusinesses:0 "国有化企业"
 ISR_nationalizebusinesses_desc:0 "为了稳固地建立我们的经济，我们必须将以色列的关键企业国有化。这一行动将保护我们刚刚起步的经济不受国际市场的影响，国际市场可能会毁掉我们的经济，从而使我们的国家容易受到不稳定的影响。尽管来自海外的商人和我们的市场自由同胞可能会谴责这种自给自足的政策，并称我们为“共产主义者”，但重要的是，保护政策必须得到实施，这样我们才能在加入国际竞争之前凝聚起足够的力量。"
 ISR_ethiopianmillitias:0 "埃塞俄比亚民兵"
 ISR_ethiopianmillitias_desc:0 "我们忠诚的贝塔以色列兄弟已经习惯了与一片恶土作斗争的生活，而我们这里和埃塞俄比亚没什么两样。因此，当通过游击的战术来抵抗侵略之时，我们的非洲兄弟可以变的非常有用。"
 ISR_coverttransportfleet:0 "秘密船队"
 ISR_coverttransportfleet_desc:0 "将成千上万的人从埃塞俄比亚运送到以色列并非易事，尤其是在红海，有许多不友好的政权试图阻止我们。我们的目标应该是使行动尽可能地隐秘。"
 ISR_buildschools:0 "设立学校"
 ISR_buildschools_desc:0 "犹太人是仁慈而高尚的，但许多人甚至不知道自己的历史！我们将向埃塞俄比亚派遣特工和特殊人员，并为这些人建立学校，让他们接受文学，算术和传统方面的适当教育——当然，也许会稍微强调我们犹太复国主义的必要性。"
 ISR_asternruleinzion:0 "斯特恩统治下的锡安！"
 ISR_asternruleinzion_desc:0 "令人震惊的是，以亚伯拉罕·“雅尔”·斯特恩为首的激进犹太复国主义团体“莱希”，已经夺取了以色列的政权。斯特恩，一个犹太复国主义者，一个幻想家，一个对新以色列有着宏伟的目标的人。以色列，将成为一个光荣的国家，西起尼罗河，东至幼发拉底河，将成为受压迫和被遗忘的犹太民族真正的家园。随着犹太复国主义的远见者斯特恩当选为以色列的领导人，我们对这个国家和人民都抱有极大的期望。"
 FNG_immigrationfromyemen:0 "与其他以色列的联系"
 FNG_immigrationfromyemen_desc:0 ""
 FNG_thenewjewishman:0 "奶与蜜之地"
 FNG_thenewjewishman_desc:0 ""
 FNG_immigrationfrompoland:0 "夺回圣地"
 FNG_immigrationfrompoland_desc:0 ""
 FNG_immigrationfromgermany:0 "占领中国"
 FNG_immigrationfromgermany_desc:0 ""
 FNG_expandthejewishagency:0 "准备冲突"
 FNG_expandthejewishagency_desc:0 "战争是为了和平做准备。这是一句和战争本身一样古老的格言。我们是一个爱好和平的民族，但我们并不愚蠢。"
 ISR_recognitionbybritain:0 "英国的认可"
 ISR_recognitionbybritain_desc:0 "我们的人民可能很少，但我们绝不是孤独的。世界上有许许多多的朋友，而且他们不会在我们遭受攻击时袖手旁观。我们只需要找到一个出发点——北大西洋就是一个不错的地方。"
 FNG_immigrationfromethiopia:0 "统一犹太聚居区"
 FNG_immigrationfromethiopia_desc:0 ""
 FNG_einsteinarrivesfromgermany:0 "六芒星与镰锤"
 FNG_einsteinarrivesfromgermany_desc:0 "沙皇俄国把犹太人与革命分子们驱逐到远东，却从未想到这二者竟会合为一体——这就是以色列·爱泼斯坦的故事，而他准备为东北带来光明的社会主义未来。"
 FNG_jabotinskytakesover:0 "东方以色列"
 FNG_jabotinskytakesover_desc:0 "以利亚胡·兰金是东北修正犹太复国主义者的领袖，与伊尔贡的创始人雅博廷斯基建立了联系。他想要建立一个军国主义以色列，并与日本结盟。只有强大的军队，才能保护我们弱小的国家，并捍卫犹太国家的主权。"
 ISR_thethirdtemple:0 "第三圣殿"
 ISR_thethirdtemple_desc:0 "在以色列历史上，有两座伟大的圣殿，纪念所罗门和希律王。现在，另一位伟人正带领犹太人走向伟大和胜利。按照传统，应该为他建造一座宏伟的圣殿，以便子孙后代能够尊重和效仿他的成就。"
 ISR_bengurionascendstopower:0 "本·古里安上台"
 ISR_bengurionascendstopower_desc:0 "以色列工人党的胜利让以色列的左派都团结了起来，随之而来的是对危险的改良主义者的谴责。愿以色列未来的道路更加宽阔。"
 ISR_thefoundingofanation:0 "建国"
 ISR_thefoundingofanation_desc:0 "自古以来，巴勒斯坦地区就算是其他帝国的一个管辖地区（耶路撒冷王国除外）。它还没有准备好去承担作为一个国家首都所需要的责任，还有许多事情要去做。"
 ISR_askformilitaryaid:0 "请求军事援助"
 ISR_askformilitaryaid_desc:0 "可悲的是，在中东实现社会主义不能只靠讲话。虽然以色列还没有什么成熟的，像样的军工大企业，但我们可以像德国寻求援助。"
 ISR_ourcommonstruggle:0 "我们的共同斗争"
 ISR_ourcommonstruggle_desc:0 "我们必须团结以色列各个阶层。士兵，平民，犹太人，阿拉伯人，工人和知识分子；所有人都必须为我们的社会主义事业而共同努力。在工厂和田地里，你的劳动有着更大的目的——不是为了薅老板和地主的羊毛，而是为了在圣地建设一个更好的社会。"
 FNG_amiddleeasternsphere:0 "我们的势力范围"
 FNG_amiddleeasternsphere_desc:0 "社会主义的前进道路既在于世界团结，也在于地缘政治集团，这种团结可以有效地制衡那些疯子的奇思妙想。我们形成的将只是社会主义和平的，许许多多的小团体中的一个。"
 FNG_expandthekibbutz:0 "扩大集体农场"
 FNG_expandthekibbutz_desc:0 "为了喂养这篇土地上的无数人民，农业必须得到发展。我们将开始建设集体农场，最新的建筑技术将使密集的建筑规划变成现实。"
 FNG_amergethewiththelabourparty:0 "联合社会主义者"
 FNG_amergethewiththelabourparty_desc:0 "建立一个由外人组成的政党比利用爱泼斯坦名声所建立的政党更难。让我们尝试一下打入主义，将工团党组织吸收进政府。"
 FNG_thehebrewuniversity:0 "扩建大学"
 FNG_thehebrewuniversity_desc:0 "作为一名记者，以色列·爱泼斯坦是公共教育的坚定支持者。为此，爱泼斯坦打算在哈尔滨建立一座大学，让年轻人接受教育，成为社会高等人才。这种教育还将有助于创造一批批受教育程度更高的精英劳动力，为专职就业创造更多机会。"
 FNG_independentcouncills:0 "独立委员会"
 FNG_independentcouncills_desc:0 "在土改后成立的当地议会可以在政府中投票，做出自己的一份贡献。这将会减少政府的腐败，并且提高效率。议会应该组成一些利好集团，并与国家机器内的其他集团进行良性竞争。"
 FNG_socialistmeritocracy:0 "社会主义政治"
 FNG_socialistmeritocracy_desc:0 "我们的新国家建立在社会主义之上——在这里没有不劳而获的资产阶级或地主，有的只是勤劳的无产阶级与农民！"
 FNG_aglobalthirdinternational:0 "全世界的第三国际"
 FNG_aglobalthirdinternational_desc:0 "第三国际掌握着世间唯一的真理——社会主义，自豪地反对反动主义、保守主义和帝国主义。我们与它合作不是为了丑陋的，赤裸裸的利好，而是为了解放全人类。"
 FNG_promotearabintegration:0 "推进整合行动"
 FNG_promotearabintegration_desc:0 "最近的暴力冲突，反抗以及各种族裔之间相互残杀是我们新国家的一个污点。政府现在希望把这一切漂亮一点——建立一个所有族裔一律平等的国家。"
 FNG_rehabilitatethearmycadets:0 "洗刷青年军"
 FNG_rehabilitatethearmycadets_desc:0 "羽翼未丰的新国防军中有许多人有着强烈的政治倾向，比如说，许多人是修正犹太复国主义者，还有一些人仍然坚定地支持资本主义。为了防止军事政变，我们必须对军队进行全面的改革和恢复。"
 FNG_influenceourneihbors:0 "影响我们的邻国"
 FNG_influenceourneihbors_desc:0 "社会主义在我们的边境地区扩散。如果我们在建设一个繁荣，工业化的国家方面取得成功的话，那么毫无疑问，我们周边的国家都会效仿我们。那么，让我们用资金，军队和忠告来推动我们地区社会主义的发展。"
 FNG_supportedbygermany:0 "法国人的支持"
 FNG_supportedbygermany_desc:0 "因为反对资本主义的斗争不能单打独斗，因此，国际团结是社会主义的基本原则之一。法国同志已经同意帮助我们进行反对帝国主义，资本主义和反动主义的斗争，他们将会提供资金和装备，以便我们继续战斗。"
 FNG_pressureiraqandjordan:0 "向俄罗斯施压"
 FNG_pressureiraqandjordan_desc:0 "我们还记得沙皇屠杀与流放我们的历史。现在是制造风波的时候了。巨浪冲击着北方的国家，并显示了我国意志的坚定。"
 FNG_containsyrianagression:0 "遏制日本人的侵略"
 FNG_containsyrianagression_desc:0 "只要日本人的驻军还在我们周边游荡，那么我们就不会安全。时刻警惕他们的入侵才符合我们各方的利益。"
 FNG_industrializethenegev:0 "工业化东北地区"
 FNG_industrializethenegev_desc:0 "西部的森林地区几乎无人居住，且几乎没有处女地，但土地都是一样的。这些地方应当被我们开发利用。"
 ISR_einsteinsnuclearprogram:0 "爱因斯坦核计划"
 ISR_einsteinsnuclearprogram_desc:0 "核裂变的研究从20世纪初就开始了，但新的科学发现揭示了利用原子巨大能量的可能性。阿尔伯特·爱因斯坦在匈牙利裔学生利奥·西拉德的帮助下，提出了链式反应能够产生大量能量的计划。尽管爱因斯坦是一名和平主义者，但军方已经成为爱因斯坦核项目最有力的支持者，该计划可能被用作一枚威力惊人的炸弹。上帝的选民们有资格，也有能力去行使这种神圣的权力，而这是完全正确的。"
 ISR_disarmednuclearcapabillities:0 "解除核武装"
 ISR_disarmednuclearcapabillities_desc:0 "尽管我们有了制造核武器的能力，但国内外的压力让我们不得不重新考虑。这样的武器让我们从未如此强大，但我们的邻国和世界大国将会为此感到愤怒，从而给我们的国家带来风险。此外，该项目的最初发起人，阿尔伯特·爱因斯坦已成为此项目的激进的批评者。他和其他和平的以色列人在政府和民众中形成了一个强大的集团，他们已经开始对那些希望拥有核武器的人施加压力。因此，为了维护国内稳定和国际和平，我们必须放弃我们的核能力。"
 ISR_preparefortheworst:0 "做好最坏的准备"
 ISR_preparefortheworst_desc:0 "战争从未改变，但战争的手段却在不断进化。原子弹拥有的毁灭性力量是我们前所未见的，必须为即将步入的原子时代做好切实准备。有人主张通过修建地下避难所网络让民众躲避核辐射，但或许更有效的方案是建立规模空前的核武库，让任何胆敢威胁我国的势力明白，他们必将招致毁灭性反击。当报复力度达到足以彻底消灭对手的程度，就无人敢轻举妄动。"
 ISR_unlimitedpower:0 "无限力量！"
 ISR_unlimitedpower_desc:0 "力量，无限的力量！但这是有代价的。核能为我们提供了一个清洁和无限能源的时代，而所有这些都来自铀。最困难的部分是进行工业加工，为此，我们需要扩大工厂产能和铀矿石进口量。这是十分昂贵且危险的，但潜在的收益太大，不容我们不去做。"
 ISR_letmediewiththephilistines:0 "“我情愿与非利士人同死”"
 ISR_letmediewiththephilistines_desc:0 "“参孙说：我情愿与非利士人同死！就尽力屈身，房子倒塌，压住首领和房内的众人。这样，参孙死时所杀的人比活着所杀的还多。”"
 ISR_revivethepriesthood:0 "新的神职"
 ISR_revivethepriesthood_desc:0 "现代犹太教的主要缺陷是对理智主义的宣扬，这使得犹太人变得脆弱，胆小，无法抵御异教徒的暴行。如果我们的国家要变得强大，这一点必须改变。我们的新神职将回归犹太教的旧传统，并融入强健的犹太教元素。通过这些，我们可以创造“新犹太人”——健壮的，热爱祖国的犹太人，这些新犹太人对于保护新的国家和维持强大的信念至关重要。"
 ISR_culturalrebirth:0 "文化重生"
 ISR_culturalrebirth_desc:0 "国家的重生需要文化的重生。犹太人一直是流散的知识分子，而这让我们的信念十分脆弱，无根无土。我们必须重新定义犹太人，它是力量，团结和传统的代名词。"
 ISR_the18principlesofthelehi:0 "莱希的18条原则"
 ISR_the18principlesofthelehi_desc:0 "作为莱希的领导者，斯特恩将其目标编纂成18条原则。总的来说，作为犹太人，我们的人民将重新夺回自己的家园，在被救赎的土地上建立一个新的国家，成为一个地区强权，与我们的敌人进行无休止的战争，恢复旧的传统，并修建第三圣殿，作为最终救赎。我们将接纳我们的流亡者，并进行复仇。"
 ISR_nationalrebirth:0 "国家重生"
 ISR_nationalrebirth_desc:0 "我们的家园被剥夺了好几个世纪。我们一次又一次被外邦人赶出锡安，他们宣称了我们的圣殿，并把我们赶到了世界各个角落，压迫我们。事情变了，我们的人民不会再被赶出家园了。我们将在我们的土地上建立一个新的国家，直到世界毁灭。"
 ISR_loyalhighcommand:0 "忠诚的最高指挥部"
 ISR_loyalhighcommand_desc:0 "我们的官员中间充斥着反动主义的低语，民主人士的嘲讽，甚至是社会主义的言论。我们不能让政变危及我们的神圣使命，因此清除这些人是确保我们的最高指挥部忠于莱希的必要步骤。"
 ISR_fortifyourland:0 "要塞化土地"
 ISR_fortifyourland_desc:0 "以色列被那些想要吞噬它的敌人们所包围，这是我们的现实情况，但有了一个由防御工事，炮台和雷区组成的良好防御阵线，我们可以让敌人无法轻易地实现他们的愿望。"
 ISR_purgetherabbis:0 "清洗拉比"
 ISR_purgetherabbis_desc:0 "为了使我们的民族复兴取得成功，我们必须承认现代犹太教的堕落。长期以来，拉比们以他们无休止的知识分子主义和毫无意义的哲理使我们的民族产生了软弱和无助，使我们的民族复兴受阻。他们将尽其所能用他们懦弱的邪教把我们压在阴沟里，所以我们必须把他们从犹太教堂、学校、广场和市场、公民和上流社会中清除出去，他们必须被通过任何手段从我们的国家中清除出去。当我们的文明再次崛起时，我们将用剑铸就我们的新身份!"
 ISR_streamlineeducation:0 "流水线教育"
 ISR_streamlineeducation_desc:0 "5.教育——教育这个国家的人民去热爱自由，用热情去捍卫以色列的永恒遗产。以色列是自己命运的主宰，圣保罗从天堂来到世间。"
 ISR_seculartraditionalism:0 "普世犹太文化"
 ISR_seculartraditionalism_desc:0 "无论是改革派还是正统派，世俗派还是保守派，以色列都是犹太人的家园。犹太人的普世信仰和博爱伟大是所有天选之人的共同特征。"
 ISR_restoreoldjerusalem:0 "复原耶路撒冷"
 ISR_restoreoldjerusalem_desc:0 "18.圣殿——必须建造第三圣殿，作为新时代全面救赎的象征。"
 ISR_supportthecanaanistmovement:0 "支持迦南运动"
 ISR_supportthecanaanistmovement_desc:0 "迦南运动是现代主义艺术家与作家的堡垒。他们一直是莱希和改良犹太复国主义的坚定支持者。我们应该以官方赞助的形式回报他们。迦南主义还处于萌芽阶段，但它有望成为以色列所需要的文化发展的堡垒。"
 ISR_britishthreatsinegypt:0 "埃及的英国威胁"
 ISR_britishthreatsinegypt_desc:0 "英国人在埃及的地位是对这块应许之地的破坏。在西进的时机到来之前，我们应先布置好防御工事，以应对随时可能到来的进攻。"
 ISR_allywiththefrench:0 "华沙方面的联络"
 ISR_allywiththefrench_desc:0 "莱希组织潜伏于“栅栏区”的特工们动作迅速，已为我方牵线搭桥，引荐给了波兰萨纳齐亚政府。数周以来，双方言辞恳切，相谈甚欢，但如今，已到了采取正式外交行动的时刻。海间联邦正厉兵秣马，准备向那些天杀的沙皇及其代表的一切旧政权发起决战。若能得到他们的助力，我们便可成为其在近东地区的秘密侧翼——一个非正式的盟友。"
 ISR_euphratestothenile:0 "从幼发拉底河到尼罗河"
 ISR_euphratestothenile_desc:0 "应许之地位于尼罗河和幼发拉底河之间。如果这就是应许，那就是我们应得到的。"
 ISR_revengeonthehittites:0 "复赫梯之仇"
 ISR_revengeonthehittites_desc:0 "仅仅把阿拉伯人赶出以色列是不够的。我们必须向叙利亚证明，我们永远不会忘记耻辱。那些赫梯后裔必须为他们的祖先付出代价。"
 ISR_contactsinwestafrica:0 "联系西非"
 ISR_contactsinwestafrica_desc:0 "利比里亚的泛非主义者是一群有趣的人，他们有一个返回祖国的愿望。我们有许多共同的特点，像是历史上的流亡迫害。因此，我们应该建立良好的外交关系。"
 ISR_anewlevant:0 "新黎凡特"
 ISR_anewlevant_desc:0 "我们已经按照自己的梦想重塑了这里，是时候清醒我们的敌人，并宣布这片土地是我们的了。"
 ISR_forcingstability:0 "强制稳定"
 ISR_forcingstability_desc:0 "6.团结——在希伯来人自由的旗帜下实现国家的统一。通过个人的光辉和对解放战争的集体奉献，我们将团结一致。"
 ISR_revivediplomacy:0 "复兴外交关系"
 ISR_revivediplomacy_desc:0 "莱希对以色列的叛徒与敌人采取的行动使得它被国际社会所孤立，现在，到了改变现状的时候了。一些和我们有着共同目标的政府应该明白，我们也是全球民族自决斗争的一分子。"
 ISR_theunitedarmy:0 "联合部队"
 ISR_theunitedarmy_desc:0 "我们靠来自欧洲各地的志愿者们组成的破烂民兵队赢得了独立。然而，现在我们自由了，是时候把我们的战士改造成一支正规的常备军了——有将军，有严格的指挥系统，以及所有的，适合我们军队的警铃和哨声。"
 ISR_finishthepurge:0 "完成清洗"
 ISR_finishthepurge_desc:0 "尽管斯特恩和他的盟友牢牢控制着以色列，但莱希对于改良派的清洗还没有完成，赫鲁特的成员和反动主义的伊尔贡成员依然存在。现在是他们宣誓十八项原则的时候了，否则就要承担相应的后果。"
 ISR_romanticizedeath:0 "美化死亡"
 ISR_romanticizedeath_desc:0 "还有比为以色列而死更光荣的事吗？保护上帝的选民不受那些摧毁锡安的人的伤害？不，死亡是我们的荣耀，我们的士兵将成为铭记在史册中的烈士。"
 ISR_reformtheknesset:0 "改革议会"
 ISR_reformtheknesset_desc:0 "议会是我们政治的基础，但它仍然没有完全遵守我们制定的原则，这一错误必须纠正。"
 ISR_statemedia:0 "国有媒体"
 ISR_statemedia_desc:0 "对于一个对以色列有着牵挂的希伯来人来说，我们的民族重生不会被所有人接受。虽然通过武力证明自己是有效的，但它也只能走这么远。然而，我们生活在一个技术进步的时代，这让我们能够以前所未有地效率通过广播，电视和电影进行学习和交流。所有这些技术都可以置于国家的直接控制之下，这样我们的思想就可以传播并渗透到爱国的希伯来人的心中。"
 ISR_theidf:0 "建立军队"
 ISR_theidf_desc:0 "我们必须建立一支正规的国防军。我们的独立而战的民兵各自为政，组织混乱，如果没有适当的指挥系统，以色列将无法生存。"
 ISR_theiaf:0 "头顶蓝天"
 ISR_theiaf_desc:0 "最新的战区为以色列提供了一个远超其实力的打击机会，有了一支适当的空军，我们就可以在数量上占优势的陆地战争中占据主导地位。"
 ISR_gunproduction:0 "请求武器与弹药"
 ISR_gunproduction_desc:0 "没有武器弹药的士兵是什么？穿着制服的暴徒。一支装备精良的军队有充足的枪支和弹药供每个人使用。"
 FNG_allythebritish:0 "与日本人结盟"
 FNG_allythebritish_desc:0 "让日本人站在我们这边，对我们的生存至关重要，因为我们在远东的地位还没有完全得到保障。在我们的国土之外，中国人在等待另一场冲突的适当时机……如果我们与日本建立更密切的关系，他们可能就不得不重新考虑一下。"
 FNG_fixtheinfighting:0 "结束内斗"
 FNG_fixtheinfighting_desc:0 "在最需要团结的时候，党派争斗和内讧会毒害国家。远东仍然是一个危险的火药桶，一个小小的火花足以再次点燃它。在这个混乱的时代，内讧可能会产生非常危险的后果……我们需要现在就结束它，消灭那些其他族裔的煽动者。"
 FNG_restoreorder:0 "追求秩序"
 FNG_restoreorder_desc:0 "满洲处在我们的控制之下，而我们需要尽快稳定这个国家。我们的敌人将很容易分裂并占领一个不稳定的以色列，而我们的人民似乎对军事控制，出入境限制和镇压动乱越来越不满。\n事实已经发生，现在，是时候集中精力建设我们的国家和她的特征了。我们应该与邻国进行适当的外交。\n我们必须为一个稳定和繁荣的以色列创造前提条件——永远稳定与繁荣。"
 FNG_industrialcenters:0 "工业中心"
 FNG_industrialcenters_desc:0 "满洲仍然由农村地区组成，而当战争到来的时候，我们的敌人可能会利用这一优势……这个国家需要迅速的工业化，为了加快这一进程，我们需要在全国各地建立工业中心。"
 FNG_revisionededucation:0 "修订教育项目"
 FNG_revisionededucation_desc:0 "缺乏教育的后果已不言而喻。社会主义者，自由主义者，民族主义者和宗教人士都是各自为政。我们必须确保国家为所有犹太儿童提供教育，不仅要促进科学领域的教育，还要全面促进文化的团结。"
 ISR_integratethepalmach:0 "整合帕尔马奇"
 ISR_integratethepalmach_desc:0 "叛乱结束后，我们不得不把我们的民兵组合成一支军队，以防止民兵的派系冲突。最庞大，最著名的犹太复国主义组织之一是帕尔马奇，它是前哈加纳的精英“力量”。将他们整合进国防军将让国防军增添许多我们需要的全职军人和退伍军人。"
 ISR_negotiateoverthesinai:0 "西奈半岛的谈判"
 ISR_negotiateoverthesinai_desc:0 "西奈半岛是一个极具战略意义的区域，在我们和埃及之间提供了一个军事缓冲区，同时也为国家的开发提供了大量空地。它目前由不列颠属埃及控制，它被运河与埃及的本土分离。\n随着以色列与英国的和解以及二者的同盟，我们或许可以通过和平谈判解决以色列对西奈半岛的主权问题，以帮助保护英国对苏伊士运河的控制。"
 ISR_cooperationwiththebeduins:0 "与贝都因的合作"
 ISR_cooperationwiththebeduins_desc:0 "在内盖夫定居项目中，我们无法避免与说阿拉伯语的贝都因人来往。如果我们希望保持对沙漠的控制，与他们的合作和互助不仅仅是可能的，而且是必要的。"
 ISR_housingprojects:0 "住宅项目"
 ISR_housingprojects_desc:0 "为了解决人口增长带来的问题，我们需要投资一些昂贵的项目，比如住房。我们需要致力于国家建设，而这包括为犹太移民提供住宿的项目。"
 ISR_staticforce:0 "静态力量"
 ISR_staticforce_desc:0 "东通大海。西有敌人。我们的祖国位于一个极佳的位置——一个易守难攻的位置。我们要挖几英里长的壕沟。我们将建造数米厚的掩体。当敌人越过我们的边界时，我们将用铁丝网和滚烫的铅弹来迎接他们。以色列军队将是马萨达的长城，即使死神来到，他们也会屈服。"
 ISR_mobileforce:0 "机动力量"
 ISR_mobileforce_desc:0 "世界大战的教训让我们意识到了庞大臃肿军队的缺点。无数的年轻人被机关枪扫射，被毒气毒死，陷入沼泽无法动弹，而我们不会再犯这样的错误。我们将使用新的武器、新的战术，新的理念，来确保我们不再犯昨日错误。"
 FNG_militarizedsociety:0 "军事化社会"
 FNG_militarizedsociety_desc:0 "难道我们的祖国不值得为之牺牲吗？难道我们的敌人不够强大吗？当敌人来犯之时，我们准备好痛击他们了吗？以色列不是在选择军国主义或者是和平无备，它是在选择生存还是毁灭。"
 ISR_renewedconflict:0 "预示冲突"
 ISR_renewedconflict_desc:0 "战争是为了和平做准备。这是一句和战争本身一样古老的格言。我们是一个爱好和平的民族，但我们并不愚蠢。任何健康的国家与社会都有军工产业，以色列也不例外。"
 FNG_prepareforthenextfight:0 "准备好下一次战争"
 FNG_prepareforthenextfight_desc:0 "准备战争不是制造武器与训练士兵，它是制定计划，预测入侵者的走向，预测武器的精度，让他们发挥自己最大的威力，并让士兵们知道自己的任务与使命。"
 FNG_selfreliantproduction:0 "自给自足"
 FNG_selfreliantproduction_desc:0 "如果以色列想要生存在这个世界上，那么她不可以依赖任何国家。虽然完全的自给自足好似天方夜谭，但我们国家的大部分需求必须由自身的资源及能力来满足。"
 ISR_settlethenegev:0 "定居内盖夫"
 ISR_settlethenegev_desc:0 "虽然内盖夫地区大部分都是沙漠，但它处在以色列国的边界上，同时也代表了国防军的防御漏洞。我们应该鼓励本地内格夫人定居此地，以填补这个漏洞。"
 FNG_ourproperborders:0 "我们真正的边界"
 FNG_ourproperborders_desc:0 "以色列不仅仅是一个理念，而是一个实体国家，而一个实体国家都有边界。至关重要的是，敌我双方都要维持目前的边界，并要试图扩大自己的势力范围至更多的土地上。"
 ISR_theidfisvictorious:0 "以色列国防军取胜"
 ISR_theidfisvictorious_desc:0 "以色列国防军，犹太国民军和锡安的坚定捍卫者在防御我们的土地方面取得了胜利。我们的士兵应该为他们惊人的胜利而庆祝，毕竟，战争无时无刻不会发生，而我们不能指望上帝来做所有的工作。"
 ISR_armedneutrallity:0 "武装中立"
 ISR_armedneutrallity_desc:0 "我们并不想参与世界政治事务。然而，国防仍是我们的关注重点。虽然我们不会刻意与邻国对抗，但当战争的烈焰烧到以色列这里时，我们应该做好充分准备。"
 ISR_fundtheyishuv:0 "投资伊舒夫"
 ISR_fundtheyishuv_desc:0 "我们国家的财富完全属于伊舒夫，或者称作以色列的犹太居民。我们应该把财富分配给犹太家庭和个人，以提高他们的生活水平，让他们支持我们的政府。"
 ISR_assistedbygermany:0 "德国人的援助"
 ISR_assistedbygermany_desc:0 "虽然德国在历史上对我们的人民不友好，但那里的革命给我们带来了一种负罪感。既然我们两国相互尊重，我们就应该请求他们的援助，以帮助巩固我们的独立地位。"
 ISR_destroybritishinfluence:0 "喘息之地"
 ISR_destroybritishinfluence_desc:0 "在敌人的包围之下，以色列必须主动出击，以确保自己独立国家的地位。我们对于西奈半岛的严密监视便是这个计划的核心部分。"
 ISR_independentproduction:0 "独立生产"
 ISR_independentproduction_desc:0 "只要看一下军火库，就能了解到我国的历史：世界各地的战士带来了一堆乱七八糟的武器和装备。英国的李·恩菲尔德，德国的卡宾和瑞士的施密特·鲁宾以及各自的弹药都堆在一起——当然，这些枪支的维护与完善都有着各自的程序，这真是一团糟。设计一款以色列本土的不强能够大幅减轻我国军官和士兵的压力。"
 ISR_ruthlesstraining:0 "严酷训练"
 ISR_ruthlesstraining_desc:0 "我们的空军既不缺飞机又不缺飞行员，但把这两者组合起来形成一支新部队却并不是一件简单的事。我们敌人的空军有几十年的时间来练习和改进他们的战术，而我们只有几个月的时间。只有一种方法可以弥补经验的优势——大量的训练。我们需要练习怎样飞行，然后反复训练，学习维护飞机，学习理论知识，自主学习和思考。我们将尽一切努力使我们的空军达到标准，即使飞行员对此不满意。我们希望他们明白这是为了国家更大的利益。"
 ISR_thefutureofarialcombat:0 "空战的未来"
 ISR_thefutureofarialcombat_desc:0 "过去几年发生了很大变化，而且这种变化似乎还会继续。我们必须对空军司令部进行投资，以讨论和创新新的战术和设计，并将不寻常的想法发挥出来。举个例子，你听说过那个把螺旋桨放进充满压缩空气的外壳里的英国人吗？惠特尔，是吧？真是吸引人。"
 ISR_womenintheairforce:0 "空军女兵"
 ISR_womenintheairforce_desc:0 "当我们被四面八方的敌人包围时，所有的以色列公民都应该前来为国家服务。女性没有足够的力量来使用重型武器，但她们的专注和敏捷应该使她们成为空军的完美飞行员。"
 ISR_offensiveoperations:0 "进攻行动"
 ISR_offensiveoperations_desc:0 "我们知道看着战场瞬息万变，你却无法跟上的感觉；要想在战场上立足，你必须付出一切。我们的战术将让我们的敌人产生这种可怕的感觉。"
 ISR_defensiveoperations:0 "防御行动"
 ISR_defensiveoperations_desc:0 "祖国是宝贵的——它是我们历史，文化和骄傲的遗产。从第一天起，我们就发誓，必须捍卫犹太人的祖国和身份。我们将挖掘战壕，我们将进行在泥巴中进行战斗，最重要的是，我们将用足够的炮弹轰炸敌人，把他们的营地和防御工事变成一片瓦砾。"
 ISR_modernartillery:0 "现代火炮"
 ISR_modernartillery_desc:0 "我们的国家为自己的四千年历史感到自豪，但我们目前的火炮可能有点过于“历史久远”了——从法国和英国那里获得的旧榴弹炮，以及一些奥斯曼巨炮。我们勇敢的士兵应该得到比这些东西更好的武器，而这些东西更适合放在博物馆而不是战场。"
 ISR_fixcapturedtanks:0 "修复缴获的坦克"
 ISR_fixcapturedtanks_desc:0 "被遗弃在沙漠剧热阳光下的废弃坦克，除了在金属板上煎炸土豆外，用处不大。把它们带回我们的工厂车间，让它们在以色列服役时获得新生。"
 ISR_aircraftdeals:0 "保证航空订单"
 ISR_aircraftdeals_desc:0 "我们拥有的少数几架飞机大多是民用飞机，它们有的被我们征集，有的是个人捐赠。它们被统一改装为军用飞机，而唯一能让它们翱翔在高空的是我们工程师的创造力。我们需要一支现代化的、统一的、能够指挥自己的空军，而实现这个目标唯一的，快速的方法就是从军事大国收购他们现成的军用飞机。"
 ISR_supportfromabove:0 "空军的驰援"
 ISR_supportfromabove_desc:0 "我们在叙利亚内战的混乱之焰中诞生，而这种情况把我们国家的存亡推到了悬崖的边上。而当悬在马什里克头顶之剑坠落时，那一定是我们在把握着剑柄。让我们用我们闪亮的新空军牢牢地抓住那把刀，把它直直地刺进敌人腐烂的心脏！"
 ISR_breakupsyria:0 "肢解叙利亚"
 ISR_breakupsyria_desc:0 "那么多为自己是犹太人而感到自豪的人被困在叙利亚这个英国私生子中。许多人在不尊重我们同胞的传统，历史和内心意愿的情况下领导着这里。而还有很多地方是需要我们来解放这些人民的，我们必须解放！向前行军，让我们肢解叙利亚，拯救那些被困在这只野兽肚子里的同胞们！"
 ISR_rewardlargefamilies:0 "奖赏大型家庭"
 ISR_rewardlargefamilies_desc:0 "我们的人口很少，并且还立足在一片并不和平的土地上。许多人担心羽翼未丰的以色列可能会经历什么灾难，而不希望在以色列成立家庭。不！我们必须消除这种恐惧，让我们的人民知道，以色列是坚强的，而我们将战胜一切逆境。我们必须鼓励人们定居下来，建立大型家庭和社区，并给他们一些福利。对于每一个超过三岁的孩子，我们将为我们的母亲提供许多的福利，以便她们能够将新一代以色列人抚养成人，然后更好地服务于我们光明的未来。"
 ISR_modernindustry:0 "现代工业"
 ISR_modernindustry_desc:0 "我们的工业是一团糟，尽管身为英国殖民地的衍生国家，这个情况并不少见。英国开采和销售的东西——主要是石油，镁和钻石——所剩的资源都很少。对新的，现有的行业进行投资，购买新的设施，以及给予工人适当的工作条件，都将为我们苦苦挣扎的经济注入宝贵的活力。"
 ISR_acompleteroadnetwork:0 "一个完整的道路网"
 ISR_acompleteroadnetwork_desc:0 "只在港口、前英国驻军基地和矿场之间四通八达的道路系统对公民的出行毫无用处。全面扩展我们的道路及相关基础设施将使全国的每一项活动都能更轻松地进行。"
 FNG_developthecities:0 "发展城市"
 FNG_developthecities_desc:0 "满洲拥有大量人口，而这要求我们进一步开发城市地区。新旧城市加起来也就勉强能维持这些人口的正常生活。"
 ISR_integration_cost_arabs_text:0 "£manpower_texticon §Y20000§!£command_power §Y100§!£pol_power §Y25§!"
 ISR_integration_cost_arabs_text_blocked:0 "£manpower_texticon §R20000§!£command_power §R100§!£pol_power §R25§!"
 ISR_SEIZURE_TT:0 "我们将开始夺取苏伊士运河的军事行动。"
 ISR_SMALL_INCREASE_TT:0 "我们的准备工作增加了10%的进度"
 ISR_MED_INCREASE_TT:0 "我们的准备工作增加了20%的进度"
 ISR_LARGE_INCREASE_TT:0 "我们的准备工作增加了30%的进度"
 ISR.991.t:0 "军事行动成功"
 ISR.991.desc:0 "运河的夜晚很暖和。那里的英国驻军开始休息，打算在这个平静的夜晚做一个好梦。然而，两艘船只正缓缓驶入。说是运送粮食，但其实上面是以色列军事小分队。这个计划很简单——靠边停船，迅速撤出，占领重要建筑。就是这么简单。当两艘船靠岸时，犹太士兵从船上跳下来，与匆忙拉下警报的英国人发生了激烈的战斗。然而，以色列海军封锁了运河，埃及不再是他们的盟友，英国军队的获胜机会微乎其微。因此，随着驻军投降，苏伊士运河正式被以色列占领。战斗结束。"
 ISR.991.a:0 "好计划，速行动。"
 ISR.992.t:0 "军事行动失败"
 ISR.992.desc:0 "运河的夜晚很暖和。那里的英国驻军开始休息，打算在这个平静的夜晚做一个好梦。然而，两艘船只正缓缓驶入。说是运送粮食，但其实上面是以色列军事小分队。这个计划很简单——靠边停船，迅速撤出，占领重要建筑。就是这么简单。当两艘船靠岸时，犹太士兵从船上跳下来，与匆忙拉下警报的英国人发生了激烈的战斗。然而，以色列海军封锁了运河，埃及不再是他们的盟友，英国军队的获胜机会微乎其微。然而，计划出了差错，英国驻军包围了军事小队，迫使他们仓促，无组织地从运河撤退回到了以色列。他们成功地保卫了运河。"
 ISR.992.a:0 "我们还会回来的！"
 ISR_suez_category:0 "吞并苏伊士"
 ISR_suez_category_desc:0 "苏伊士运河是一个重要的战略要地，每天有数十艘船经过这里。此外，它还将我们与非洲隔绝开来，夺取它不仅能够开启我们通向非洲的门户，并且还能带来巨额的利润。然而，如果我们要夺取它的话，那我们就需要做足准备。我们不能破坏它，并且绝对不能与英国开战。\n\n我们目前的准备进度：[?SUEZSEIZURE|G0]§G%§!"
