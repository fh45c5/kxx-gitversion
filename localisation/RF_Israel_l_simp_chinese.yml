 ISR_DESC_MENU:0 "自英国自由党的承诺和叙利亚王国的灰烬中诞生，雅博廷斯基松散的军事联盟想要保护羽翼未丰的伊舒夫免遭外部势力的毁灭。但随着叙利亚内战的发展，一种新的可能性出现了——这不仅是关乎生存，而是一种由坚韧，鲜血和信仰打造的真正的犹太国家。"
