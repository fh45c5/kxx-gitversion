 ISR.23.t:0 "巴勒斯坦和我们称兄道弟"
 ISR.23.a:0 "当然"
 ISR.23.b:0 "绝不"
 ISR.231.t:0 "阿拉维派同意"
 ISR.231.desc:0 "阿拉维人并没有愚蠢到拒绝合作，并大力赞扬了合作的必要性。正如爱因斯坦所想的那样，面对潜在的反动势力，双方愿意结成联盟，而这对阿拉维人来说是令人鼓舞的，这使得拉塔基亚和特拉维夫之间的联盟成为可能。阿拉维人和犹太人的共同努力将使他们能够保卫自己的家园。而两国的相互经济合作将使两国发展并开始改善人民的生活条件。"
 ISR.231.a:0 "和平唾手可得。"
 ISR.232.t:0 "阿拉维派拒绝"
 ISR.232.desc:0 "不管阿拉维派出于自己的自大或者自傲，他们都拒绝了与我们这个情同手足的社会主义国家所合作的提议。令爱因斯坦感到失望的是，他对于阿拉维派的幻想是错误的。因此，如果伊朗人不愿意合作，新生的巴勒斯坦将不得不继续孤身一人，以保卫工人。"
 ISR.232.a:0 "和平女神将不会再临此地"
 ISR.24.t:0 "巴勒斯坦和我们称兄道弟"
 ISR.23.desc:0 "巴勒斯坦政府经与杰出物理学家阿尔伯特·爱因斯坦商议后，认定过多介入世界政治漩涡对巴勒斯坦社会主义联邦而言并非益事，加入红色阵线之利弊权衡，弊大于利。巴勒斯坦方面认为，他们的国家与阿拉维派地区目标相似。合作与结盟对双方都将大有裨益，两国将互为后盾，而这份友谊无疑会为两国公民带来福祉与安宁。他们请求我们考虑潜在的结盟请求，毕竟我们拥有共同的敌人；因此，尽管国家尚且年轻弱小，巴勒斯坦与阿拉维派的联合力量必能克服区域威胁，为中东带来一段和平时期。"
 ISR.24.a:0 "为求存续，实乃无奈之举。"
 ISR.24.b:0 "我们决不妥协！"
 ISR.241.t:0 "亚历山大勒塔同意"
 ISR.241.desc:0 "亚历山大勒塔人倒也不傻，并未拒绝合作，终究还是显露了几分审慎。正如爱因斯坦所料，面对潜在敌对反动势力时，提出互助同盟的建议对波斯人而言颇具吸引力，这也使得伊斯肯德伦与特拉维夫之间的联盟成为可能。亚历山大勒塔人与犹太人的共同努力，将使他们能够捍卫各自的家园。相互的经济合作则能促进两国发展，改善民生。"
 ISR.241.a:0 "和平唾手可得。"
 ISR.242.t:0 "亚历山大勒塔拒绝"
 ISR.242.desc:0 "亚历山大勒塔人却被一股莫名的傲慢冲昏了头脑，竟拒绝了与我们这个兄弟般的社会主义国家合作，声称其原则迫使他们反对圣地上的任何犹太复国主义国家。爱因斯坦对于他先前关于阿拉伯与以色列利益趋同的预感落空而感到失望。倘若他们不愿合作，以色列将不得不继续其孤独的征程，独自捍卫犹太人与工人的权益。"
 ISR.242.a:0 "和平女神将不会再临此地"
 ISR.25.t:0 "巴勒斯坦和我们称兄道弟"
 ISR.25.desc:0 "巴勒斯坦政府经与杰出物理学家阿尔伯特·爱因斯坦商议后，认定过多介入世界政治漩涡对巴勒斯坦社会主义联邦而言并非益事，加入“红色阵线”之利弊权衡，弊大于利。巴勒斯坦方面认为，他们的国家与亚美尼亚目标相似。合作与结盟对双方都将大有裨益，两国将互为后盾，而这份友谊无疑会为两国公民带来福祉与安宁。他们请求我们考虑潜在的结盟请求，毕竟我们拥有共同的敌人；因此，尽管国家尚且年轻弱小，巴勒斯坦与亚美尼亚的联合力量必能克服当地阿拉伯势力的威胁，为中东带来一段和平时期。"
 ISR.25.a:0 "当然"
 ISR.25.b:0 "绝不"
 ISR.251.t:0 "亚美尼亚同意"
 ISR.251.desc:0 "亚美尼亚人倒也不傻，并未拒绝合作，终究还是显露了几分审慎。正如爱因斯坦所料，面对潜在敌对反动势力时，提出互助同盟的建议对波斯人而言颇具吸引力，这也使得埃里温与特拉维夫之间的联盟成为可能。亚美尼亚人与犹太人的共同努力，将使他们能够捍卫各自的家园。相互的经济合作则能促进两国发展，改善民生。"
 ISR.251.a:0 "和平唾手可得。"
 ISR.252.t:0 "亚美尼亚拒绝"
 ISR.252.desc:0 "亚美尼亚人不知是愚蠢作祟，还是骄傲冲昏了头脑，竟拒绝了与我们这个兄弟般的社会主义国家合作。爱因斯坦对于他先前关于亚美尼亚与以色列利益趋同的预感落空而感到失望。倘若亚美尼亚人不愿合作，以色列将不得不继续其孤独的征程，独自捍卫犹太人与工人的权益。"
 ISR.252.a:0 "和平女神将不会再临此地"
 ISR.2000.t:0 "第三圣殿"
 ISR.2000.desc:0 "动脑啦，不觉得把货真价实的“被提”做成超事件有一点点超过我们这个HOI4小mod的范畴么？这决议要游戏内50年才能走完欸——不过这么一想，用控制台硬点这个事件确实比傻等要强。\n\n总之，感谢游玩赤潮"
 ISR.2000.a:0 "SB了吧"
 ISR_war_decisions:0 "犹太复国主义叛乱"
 ISR_war_decisions_desc:0 "新成立的以色列国是因为其骄傲的人民才生存下去的。成千上万的海外游子们回到了巴勒斯坦，自豪地宣称这里是他们的新家，并积极地投身于复国主义事业当中。在如此激烈的战斗中，大批的移民都欣然抵达，为这个新生的犹太国家而战斗。然而，一旦战争的压力减轻，那么我们就必须改变当前来者不拒的移民政策。"
