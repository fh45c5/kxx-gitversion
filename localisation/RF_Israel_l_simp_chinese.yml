 ISR.24.desc:0 "巴勒斯坦政府官员与著名物理学家阿尔伯特·爱因斯坦协商后发现，干预云谲波诡的世界政治对于巴勒斯坦社会主义联邦是不合适的，加入红色阵线弊大于利。很显然，巴勒斯坦与亚历山大勒塔有着共同的目标，合作对双方都有好处，\n\n然而，这纸盟约必然是短暂的。亚历山大勒塔怎么能跟犹太人的国家结盟！终有一天，这两个国家将会兵戎相见，因为阿拉伯的土地上决不允许有犹太人存在。"
