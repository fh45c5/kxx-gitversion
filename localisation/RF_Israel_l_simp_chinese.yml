 ISR.victory.desc:0 "经过了几场激烈而血腥的战争后，叙利亚的军队被迫撤退。他们破败的军队慌忙的离开了巴勒斯坦和约旦，羞耻地驻扎在了大马士革。他们要是想继续保存自己残破军队的话，就不得不和我们达成停火协议。\n这场战争对以色列和叙利亚都造成了重大损失，但是对于马什里克国王加齐一世及其统治的影响尤为重大，加齐国王本就不好的声誉在战争期间可以说是马什里克内部游击队不被抓捕的一项重要的原因。而在大马士革和其他叙利亚城市，市民抗议活动的次数和人数也已急剧增加。"
