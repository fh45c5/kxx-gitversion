 YUN.endgame.044.bss.d: "革命先贤戴季陶即将退休。过去几十年间，戴季陶为革命鞠躬尽瘁，他曾先后担任过孙中山先生的翻译、上海地下支部领导、宣传家、作家、党内权威，并在过去几年间一直担任行政院长。如今国家迎来统一，他则选择体面地退休，为自己传奇的职业生涯画上句号。他与国府主席间的关系若即若离，有时还会传出不谐之音。但事实证明，二人间的关系是富有成效的：国府主席与行政院长共同缔造了崭新的民国。\n\n尽管有人猜测戴季陶退休也许并非自愿，以及他下一步的打算，但这位即将离任的行政院长在自己的退休宴会上向党员们保证：自己可能会留在公共领域，继续为新生的民国扶上马送一程。他曾考虑过在教育领域或政府中某个不那么辛苦的岗位（如监察院或考试院）上度过自己的晚年。\n\n戴季陶十分谨慎地表达了对自己继任者的看法，只在必要的场合以恭敬的言辞谈论之。临别赠言中，戴季陶一边赞扬刘健群将军对中国民族主义的忠诚，同时又温和地提醒他不要让枪指挥党。他还提醒听众毋忘三民主义，即使眼下三民主义不会立竿见影，也不可背弃先总理遗教。"
