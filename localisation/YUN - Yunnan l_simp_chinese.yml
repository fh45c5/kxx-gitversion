 YUN_watching_the_upstarts_desc_loc_noKMT: "从本质上来说，被迫允许溃败的国民革命军残部进入我方实际控制区只是暂时的耻辱。国民党“新右派”在贵州建立根据地后，他们实际上已掌控该省。鉴于其意识形态与我方政权对立，我们应在滇黔交界山区部署兵力驻防巡逻，密切监视他们的一举一动。"
