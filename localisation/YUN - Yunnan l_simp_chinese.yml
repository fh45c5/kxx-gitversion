 YUN.lategame.530.t: "中央政府垮台"
 YUN.lategame.530.d: "中央政府垮台后，国民党支持者已是群龙无首。虽然西南委员会历来相对自治，但随着其他省份纷纷向高歌猛进的敌人投降，他们也难以承受中央政府垮台带来的冲击。原中央政府的大部分领导人宁愿流亡海外，也不愿落入“小军阀”之手，而[ROOT.GetLeader]则以代理党主席的身份接管了政权。\n\n代主席面临着扭转局势的艰难挑战——将领们难以整合其他国民革命军残部，士气低迷的士兵如流水般溃散乡野，只剩一众名存实亡的“空壳”师旅。经济也陷入了混乱，人们愈发怀疑我们能否偿还债务。\n\n值此动荡时局，各方势力展开了激烈的权力角逐。尽管朱培德及其盟友目前控制着西南地区，但胡若愚已寻求云南士绅的支持，企图发动政变；陈城、朱德等左派将领也在伺机削弱朱培德的领导地位。当西南领导人齐聚一堂，召开会议时……"
 YUN.lategame.530.a: "……他们拥护朱培德的统治。"
 YUN.lategame.530.b: "……陈诚和第一军发动了政变。"
 YUN.lategame.530.c: "……章伯钧和朱德联手驱逐了朱培德。"
 YUN.lategame.530.e: "……胡若愚和旧滇系发动了政变。"
 YUN.lategame.725.t: "中央政府垮台"
 YUN.lategame.725.d: "中央政府垮台后，联省派支持者已是群龙无首。虽然西南各省历来相对自治，但随着其他省份纷纷向高歌猛进的敌人投降，他们也难以承受中央政府垮台带来的冲击。原中央政府的大部分领导人宁愿流亡海外，也不愿落入“小军阀”之手，而[ROOT.GetLeader]则以代理总执政的身份接管了政权。\n\n代执政面临着扭转局势的艰难挑战——将领们难以整合其他各省残部，士气低迷的士兵如流水般溃散乡野，只剩一众名存实亡的“空壳”师旅。经济也陷入了混乱，人们愈发怀疑我们能否偿还债务。\n\n值此动荡时局，各方势力展开了激烈的权力角逐。虽然唐继尧目前仍然掌权，但权力真空的出现助长了胡若愚将军的气焰，他开始四处试探，企图夺取政权。与此同时，在昆明城中，以寸树声和苏鸿纲为首的所谓“九老会”正在拉拢被边缘化的龙云将军，还联合了新月社和当地社会主义者。看来，迫在眉睫的危机非但没有团结云南，反而加剧了省内的分裂。"
 YUN.lategame.725.a: "尽管镇守使们暗中策划，但唐继尧依然屹立不倒。"
 YUN.lategame.725.b: "胡若愚进军昆明，并自封为紧急军政府的领导人。"
 YUN.lategame.725.c: "昆明的密谋者们在省会发动政变，建立紧急政府。"
