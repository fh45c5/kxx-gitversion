 YUN_guide_1: "§M联省派卫星省路线：民盟云南省委、民治党、唐筱蓂§!（$social_democrat_coloured$/$market_liberal_coloured$/$authoritarian_democrat_coloured$）\n£white_dot §f联省派§!必须赢得§Y滇黔冲突§!才能在云南掌权。\n£white_dot 你必须向其他§f联省派§!政府臣服，才能进入卫星省路线。\n\n§M中国民主同盟云南省委§!（$social_democrat_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§S中国民主同盟云南省委§!在随后的权力斗争中掌权上台。\n£white_dot 之后，你可以反抗宗主，按自己的路线统一中国。\n£white_dot 让§f民主热情§!保持在高水平并帮助§S寸树声§!在全国选举中获胜。\n\n§M民治党/滇系§!（$market_liberal_coloured$/$authoritarian_democrat_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§S中国民主同盟云南省委§!在随后的权力斗争中掌权上台。\n£white_dot 之后，你可以反抗宗主，按自己的路线统一中国。\n£white_dot §m唐筱蓂§!和§m民治党§!/§a滇系§!都可以作为§m市场自由主义§!或§a威权民主主义§!上台掌权。\n\n£white_dot 若想作为§m市场自由主义§!上台掌权，需要让§f民主热情§!保持在高水平并帮助§m唐筱蓂§!在全国选举中获胜。\n£white_dot 若想作为§a威权民主主义§!上台掌权，需要让§f民主热情§!保持在低水平并帮助§a唐筱蓂§!在随后的权力斗争中获胜。\n\n£white_dot 另外，§S中国民主同盟云南省委§!和§m民治党§!都可以在§f民主热情§!降低至低水平后夺权上台。\n\n\n§M联省派竞争者路线：新月社、民治党、唐继尧§!（$social_liberal_coloured$/$social_conservative_coloured$/$authoritarian_democrat_coloured$）\n£white_dot §f联省派§!必须赢得§Y滇黔冲突§!才能在云南掌权。\n£white_dot 你必须向控制广州的势力宣战并成功建立自己的对立政府，才能进入竞争者路线。\n\n§M新月社§!（$social_liberal_coloured$）\n£white_dot 让§f民主热情§!维持在高水平并夺取北京。\n£white_dot 统一全国后，选举§l罗隆基§!出任总执政。\n\n§M民治党§!（$social_conservative_coloured$）\n£white_dot 让§f民主热情§!维持在高水平并夺取北京。\n£white_dot 统一全国后，选举§c唐继尧§!出任总执政。\n\n§M滇系§!（$authoritarian_democrat_coloured$）\n£white_dot 让§f民主热情§!维持在低水平并夺取北京。\n£white_dot 统一全国后，在不公平的情况下选举§a唐继尧§!出任总执政。\n\n£white_dot 另外，§l新月社§!和§c民治党§!都可以在§f民主热情§!降低至低水平后夺权上台。"
 YUN_guide_2: "§M地方派：龙云派、卢汉派、胡若愚§!（$authoritarian_democrat_coloured$/$paternal_autocrat_coloured$）\n£white_dot 任何一方赢得§Y滇黔冲突§!§e地方派§!都可以在云南掌权。\n£white_dot 对广州的控制者宣战，并在冲突中陷入僵局，然后再要求和谈。\n£white_dot 签署和平协议后，§a龙云§!将发动政变推翻政府。\n\n§M龙云派§!（$authoritarian_democrat_coloured$）\n£white_dot 第二次中日战争爆发后，挫败§P胡若愚§!的政变企图。\n£white_dot 之后，你可以反抗宗主，按自己的路线统一中国。\n£white_dot 统一全国后，§a龙云§!有两条路线，分别是§Y高效政府§!和§Y百炼成钢的“民主”§!。\n£white_dot 若要进入对应路线，完成相应的国策即可。\n\n§M卢汉派§!（$authoritarian_democrat_coloured$）\n£white_dot 第二次中日战争爆发后，让§P胡若愚§!的政变企图成功。\n£white_dot 之后，你可以反抗宗主，按自己的路线统一中国。\n£white_dot 统一全国后，让§a卢汉§!在随后的权力斗争中击败§P胡若愚§!。\n\n§M蒙自派§!（$paternal_autocrat_coloured$）\n£white_dot 第二次中日战争爆发后，让§P胡若愚§!的政变企图成功。\n£white_dot 之后，你可以反抗宗主，按自己的路线统一中国。\n£white_dot 统一全国后，让§P胡若愚§!在随后的权力斗争中击败§a卢汉§!。"
 YUN_guide: "§M国民党卫星省路线：中国农工民主党/第三军左派、土木系、政学系、第三军右派§! （$radical_socialist_coloured$/$social_democrat_coloured$/$market_liberal_coloured$/$social_conservative_coloured$）\n£white_dot §c国民党§!必须赢得§Y滇黔冲突§!才能在云南掌权。\n£white_dot 你必须向闽赣根据地或其他国民党政府臣服，才能进入卫星省路线。\n\n£white_dot §Y注意：只有臣服于§R闽赣根据地§!才能选择中国农工民主党/第三军左派的激进社会主义路线和土木系的社会民主主义路线。§!\n\n§M中国农工民主党/第三军左派§!（$radical_socialist_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§R激进社会主义§!获得最高党派支持率，从而让§R章伯钧§!和§R朱德§!发动政变掌权。\n£white_dot 之后，你可以反抗中央委员会，按自己的路线统一中国。\n\n§M土木系§!（$social_democrat_coloured$/$paternal_autocrat_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§S社会民主主义§!或§P家长制独裁§!获得最高党派支持率（取决于你和§R国民党左派§!还是§c国民党右派§!结盟），从而让§S陈诚§!发动政变掌权。\n£white_dot 之后，你可以反抗中央委员会，按自己的路线统一中国。\n\n§M新政学系§!（$market_liberal_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§c社会保守主义§!获得最高党派支持率，从而让§c朱培德§!继续掌权。\n£white_dot 之后，你可以反抗中央委员会，按自己的路线统一中国。\n£white_dot 统一全国后，完成你的国策树直到触发党内选举事件，选择让§m李根源§!胜出。\n\n§M第三军右派§!（$social_conservative_coloured$）\n£white_dot 帮助你的宗主夺取北京后，让§c社会保守主义§!获得最高党派支持率，从而让§c朱培德§!继续掌权。\n£white_dot 之后，你可以反抗中央委员会，按自己的路线统一中国。\n£white_dot 统一全国后，完成你的国策树直到触发党内选举事件，选择让§c朱培德§!胜出。\n\n\n§M国民党竞争者路线：政学系、CC系、土木系、黄埔系、蓝衣社§!（$market_liberal_coloured$/$authoritarian_democrat_coloured$/$paternal_autocrat_coloured$/$national_populist_coloured$）\n£white_dot §c国民党§!必须赢得§Y滇黔冲突§!才能在云南掌权。\n£white_dot 你必须向控制广州的势力宣战并成功建立自己的对立政府，才能进入竞争者路线。\n\n§M新政学系§!（$market_liberal_coloured$）\n£white_dot 让§c革命热忱§!维持在高水平并夺取北京。\n£white_dot 确保§P何应钦§!在§Y《训政时期约法》危机§!第一阶段中失败。\n£white_dot §m张群§!掌权后，帮助§m政学系§!在危机第二阶段中通过《训政时期约法》。\n\n§MCC系§!（$authoritarian_democrat_coloured$）\n£white_dot 让§c革命热忱§!维持在高水平并夺取北京。\n£white_dot 确保§P何应钦§!在§Y《训政时期约法》危机§!第一阶段中失败。\n£white_dot §m张群§!掌权后，帮助§aCC系§!在危机第二阶段中通过不信任投票。\n\n£white_dot §aCC系§!在统一全国后有两条路线，一条是§P戴季陶§!的§Y呵护蜂群式国家§!路线，另一条是§a陈立夫§!和§a陈果夫§!的§Y燮理阴阳§!路线。\n£white_dot 若要让§P戴季陶§!在统一后继续掌权，则要拒绝他的辞呈；接受他的辞呈则会解锁§a陈立夫§!和§a陈果夫§!路线。\n\n§M土木系§!（$paternal_autocrat_coloured$）\n£white_dot 让§c革命热忱§!维持在高水平并夺取北京。\n£white_dot 确保§P何应钦§!在§Y《训政时期约法》危机§!第一阶段中失败。\n£white_dot §m张群§!掌权后，选择支持§Y黄埔系政变§!。\n£white_dot 统一全国后，选择完成§P土木系§!国策树的第一个国策。\n\n§M黄埔系§!（$paternal_autocrat_coloured$）\n£white_dot 让§c革命热忱§!维持在中间水平并夺取北京。\n£white_dot 确保§P何应钦§!在§Y《训政时期约法》危机§!第一阶段中胜利。\n\n£white_dot 根据玩家在统一全国后的选择，§P黄埔系§!拥有五种不同终局，分别是：§Y革命民主之未来§!（与§S土木系§!结盟）、§Y重建精神平衡§!（与§aCC系§!结盟）、§Y军事集中制§!（与§P黄埔系§!结盟）、§Y改组行政院§!（与§m政学系§!结盟）、§Y实现专制§!（与§s蓝衣社§!结盟）。\n£white_dot 要进入对应路线，只需在满足条件时完成对应国策即可。\n\n§M蓝衣社§!（$national_populist_coloured$）\n£white_dot 让§c革命热忱§!维持在低水平并夺取北京。\n£white_dot 确保§P何应钦§!在§Y《训政时期约法》危机§!第一阶段中失败。\n£white_dot §m张群§!掌权后，选择支持§P黄埔系政变§!。\n£white_dot 统一全国后，选择完成§s蓝衣社§!国策树的第一个国策。"
 YUN_dian_dragon_domain_long_yun_subject_zhili_key: "\n\n尽管§g龙云将军§!占据昆明省府，继承了唐继尧督理的权力基础，但随着蒙自派在外部势力的帮助下日益壮大，他对云南的掌控已然减弱。面对潜在的权力威胁，龙云将军必须警惕蒙自镇守使署的阴谋诡计，以免滇龙重蹈其前任之覆辙……\n§Y§g$YUN_long_yun_clique_party$§!的影响力当前为[?YUN.party_popularity@authoritarian_democrat|%g2]。§!"
 YUN_dian_dragon_domain_long_yun_subject_other_key: "\n\n无论是随波逐流，还是走投无路，§g龙云将军§!终究打破了云南的孤立政策，转而让昆明与其他势力结盟。尽管此举对昆明和蒙自均无裨益，但龙云将军必须警惕蒙自镇守使署的阴谋诡计，以免滇龙重蹈其前任之覆辙……\n§Y§g$YUN_long_yun_clique_party$§!的影响力当前为[?YUN.party_popularity@authoritarian_democrat|%g2]。§!"
 YUN_dian_dragon_domain_hu_ruoyu_subject_zhili_key: "\n\n§P蒙自派§!已积聚足够的影响力，成功说服昆明公开与直系结盟，云南的权力平衡正日益向其倾斜。他们正密谋发动政变，一举推翻龙云将军并夺取政权。如果§P$YUN_hu_ruoyu_clique_party$§!的支持率超过50%且中日已经开战，§R政变就必然成功……§!\n§Y当前§P$YUN_hu_ruoyu_clique_party$§!的影响力为[?YUN.party_popularity@paternal_autocrat|%P2]。§!"
 YUN_dian_dragon_domain_hu_ruoyu_subject_other_key: "\n\n尽管§P蒙自派§!极力主张与直系结盟，但云南似乎已臣服于其他势力。然而，如果胡若愚比龙云更受欢迎，局势将对蒙自有利。如果§P$YUN_hu_ruoyu_clique_party$§!的支持率超过50%且中日已经开战，§R政变就必然成功……§!\n§Y当前§P$YUN_hu_ruoyu_clique_party$§!的影响力为[?YUN.party_popularity@paternal_autocrat|%P2]。§!"
 YUN_dian_dragon_domain_hu_ruoyu_zhili_dead_key: "\n\n§P胡若愚、张汝骥和李选廷领导的军政府§!以南部的蒙自为大本营，据称他们一直与德国利益集团暗通款曲，同时也对直系的影响门户大开。然而，由于直系倒台和缺乏支持，蒙自的阴谋现已遭遇重挫。尽管如此，如果§P$YUN_hu_ruoyu_clique_party$§!的支持率超过50%且中日已经开战，§R政变就必然成功……§!\n§Y当前§P$YUN_hu_ruoyu_clique_party$§!的影响力为[?YUN.party_popularity@paternal_autocrat|%P2]。§!"
 YUN.earlygame.001.i: "保留现任校长。"
 YUN.lategame.531.t: "意外转折"
 YUN.lategame.531.d: "天有不测风云，西南地区的国民党似乎已经成功组建了自己的政府。鲜有人能预料到事态竟会如此发展，但原中央政府的瓦解让他们有了可乘之机，这个曾一度边缘化的派系成功为自己争取到了一席之地。\n\n然而，这一发展并非没有后果。更大的政治权力伴随着更高的期望，新政府如今面临着偿还债务、重建被摧毁地区以及整编当下过度膨胀的军队等重任。此外，权力斗争也异常激烈。尽管朱培德及其盟友目前控制着西南地区，但胡若愚已开始寻求云南士绅的支持以发动政变，陈诚、朱德等左翼将领也在暗中谋划，试图削弱朱培德的领导地位。西南地区领导人如今齐聚一堂，一场会议拉开了帷幕……"
 YUN.lategame.531.a: "……他们拥护朱培德的统治。"
 YUN.lategame.531.b: "……陈诚和第一军发动了政变。"
 YUN.lategame.531.c: "……章伯钧和朱德联手驱逐了朱培德。"
 YUN.lategame.531.e: "……胡若愚和旧滇系发动了政变。"
 YUN.lategame.726.t: "意外转折"
 YUN.lategame.726.d: "天有不测风云，西南地区的联省派似乎已经成功组建了自己的政府。鲜有人能预料到事态竟会如此发展，但原中央政府的瓦解让他们有了可乘之机，这个曾一度边缘化的派系成功为自己争取到了一席之地。\n\n然而，这一发展并非没有后果。更大的政治权力伴随着更高的期望，新政府如今面临着偿还债务、重建被摧毁地区以及整编当下过度膨胀的军队等重任。此外，权力斗争也异常激烈。唐继尧目前仍执掌大权，但权力真空的出现助长了胡若愚将军的野心，他开始四处试探，试图夺取政权。与此同时，在昆明，被边缘化的龙云将军受到了以寸树声和苏鸿纲为首的所谓“九老会”的拉拢，新月社和当地社会主义者也加入了他们的行列。看来，迫在眉睫的危机非但没有团结云南，反而加剧了该省的分裂。"
 YUN.lategame.726.a: "尽管镇守使们暗中策划，但唐继尧依然屹立不倒。"
 YUN.lategame.726.b: "胡若愚进军昆明，并自封为紧急军政府的领导人。"
 YUN.lategame.726.c: "昆明的密谋者们在省会发动政变，建立紧急政府。"
 YUN_ruled_by_KMT_tooltip: "§L如果我们由§R亲国民党§!政权统治：§!"
 YUN_not_ruled_by_KMT_tooltip: "§L如果我们由§c亲建制派§!政权统治：§!"