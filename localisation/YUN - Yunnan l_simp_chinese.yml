 YUN_watching_the_upstarts_desc_loc_KMT: "虽然唐继尧政权的腐败势力被逐出了云南，但国民革命军长官们已清楚地认识到，云南山区仍有负隅顽抗之敌。云南遍布深谷险壑与嶙峋奇峰，堪称中国内陆崎岖地形的缩影。我们将部署国民革命军将士，将残余游击队全部驱逐出省境。"
