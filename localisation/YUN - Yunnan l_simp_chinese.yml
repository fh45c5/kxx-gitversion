 YUN_CSP_intro: "中国工团党成立于1922年，最初的成员是一批受法国革命影响的社会主义思想家。1924年，在军阀乱世中，工团党与国民党结成第一次统一战线，扩大了组织规模，影响力得以提升。在1925年省港大罢工的鼓舞下，工团党组建了中国工团主义者同盟，与国民党没有直接关系的社会主义者纷纷投入其中，工团运动达到了高潮。\n\n1923年，在李大钊的指导下，云南的工团主义者在北京大学形成了组织，王复生、王德三两兄弟、李鑫、杨青田等领袖与其他学生一道建立了革新社，参加了五卅运动，随后，革新社更名为新滇社。"
 YUN_KMT_intro: "在臃肿的同盟会失败后，孙中山先生创立了国民党。随着孙中山要求所有党员都对他个人宣誓效忠，国民党转向了威权，而在1924年改组后又转向了左翼先锋队主义。国民党以孙中山先生的教导和个人崇拜为基础，在孙先生去世后，国民党内部出现了严重的分裂。"
 YUN_NRA_intro: "为了对抗军阀，孙中山先生主张建立一支只效忠于党和革命的军队，即国民革命军。在第三国际军事顾问的帮助下，黄埔军校在广州成立，从中走出了一代革命军官。"
 YUN_CSP_YSB_party: "工团党(云南特别支部)"
 YUN_CSP_YSB_party_long: "中国工团党 - 政治保卫局云南支部\n§L$YUN_CSP_intro$\n\n工团党在云南建立了一个规模较小的特别支部，负责协调云南地区的秘密行动，成员中有许多在黄埔军校接受第三国际顾问训练的军政特工。§!\n"
 YUN_KMT_CRS_party: "国民党(复兴社)"
 YUN_KMT_CRS_party_long: "中国国民党 - 中华复兴社\n§L$YUN_KMT_intro$\n\n北伐失败后，胡宗南脱离了何应钦领导的第一军，加入了汪精卫在欧洲的中央执行委员会。在欧洲，胡宗南与同样对党的现状感到失望的黄埔校友贺衷寒和邓文仪取得了联系。胡宗南和复兴社信奉极端民族主义和强硬军国主义，并拥护法国索雷尔派的革命暴力，宣称党内官僚主义是北伐失败的根源。在左派委员会最近一次重返中国的行动失败后，复兴社的事业曾一度支离破碎，沦为了一具空壳。然而，复兴社被新国民党政府接纳后，他们的声望似乎略有回升。复兴社放弃了纲领中更具社会主义色彩的内容，转而强调致力于重振本党的革命决心，并在致力于极端民族主义、军国主义和极权主义的共同基础上，与滕杰的蓝衣社建立了友好伙伴关系。§!\n"
 YUN_CSP_NDS_party: "工团党(新滇社)"
 YUN_CSP_NDS_party_long: "中国工团党 - 新滇社\n§L$YUN_CSP_intro$\n\n新滇社的主干是曾经的云南国民党法政党部的后继，这个党部由左派人士组成，因总部位于昆明兴隆街的云南法政学校旧校址而得名。尽管受到了严厉镇压，但他们在激进学生中仍拥有一批拥趸。§!\n"
 YUN_KMT_WRD_SOC_party: "世界社"
 YUN_KMT_WRD_SOC_party_long: "新世界社\n§L世界社享有中国第一个有组织的无政府主义组织（无政府主义团体传统上避免自称政党）的殊荣。在四大元老（张人杰、李石曾、吴稚晖和蔡元培）的领导下，这些以巴黎为大本营的无政府主义者成为了许多著名国民党人物的导师。但随着中国工团党的崛起，世界社的影响力遭到了削弱，与其他无政府主义者间的关系也开始恶化，四大元老被迫重返国民党建制派的位置。\n\n尽管世界社的影响力在国民党左派政府垮台后进一步下降，但进入国民党新政府后，他们似乎时来运转。国民党政府将工团党视为政治负担，转而以中工盟领袖的身份支持世界社，以遏制中工盟内部的激进主义倾向。李石曾随之声名鹊起，他最近彻底批评了国民党左派和工团党所宣扬的阶级斗争，声称其不利于中国对抗帝国主义列强，从而在右派圈子中赢得了一席之地。§!\n"
 YUN_KMT_3AL_party: "国民党(第三军左派)"
 YUN_KMT_3AL_party_long: "中国国民党 - 国民革命军第三军左派\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n第三军的前身是归属于南方政府的护国第二军、建国第一军。1925年孙中山去世后，建国第一军（即滇军）企图发动反国民党叛乱，但旋即遭到挫败。\n\n随后，建国滇军被改组为第三军，由忠诚的云南国民党员朱培德指挥。该军在北伐东线与孙传芳的作战中表现优越，但最终在长征期间被迫与国民革命军其他残部一道转进。国民党在贵州重组后，第三军又吸收了范石生、金汉鼎的小规模武装。\n\n第三军内部包藏着一个由朱德领导的庞大左派。虽然他们远不至于多数，但倘若不加以制止，也许他们很快就会夺取这场运动的指挥权。§!\n"
 YUN_KMT_RCA_party: "国民党(改组会)"
 YUN_KMT_RCA_party_long: "中国国民党 - 改组同志会（温和派）\n§L$YUN_KMT_intro$\n\n改组同志会由陈公博、顾孟余和其他国民党左派人士创立，起初该组织旨在捍卫1924年改组的成果，之后又试图拥护汪精卫的统治。改组会内部分为陈公博领导下的激进派和顾孟余领导下的温和派，激进派主张暴力的阶级斗争和马克思主义，温和派则倾向于阶级合作。\n\n汪精卫决定加入我们的政府后，改组会四分五裂，许多普通党员直接谴责汪精卫是个叛徒。汪精卫选择支持顾孟余的温和派并强调自己的左翼民族主义者身份，陈公博没有直接批评他的朋友，而是直接退居幕后。如今改组会在党内仍保留着一定影响力，尤其是在文职官僚、部分知识分子和海外分会当中，但很明显，他们的鼎盛时代已经结束了。§!\n"
 YUN_KMT_PAC_party: "国民党(临委会)"
 YUN_KMT_PAC_party_long: "中国国民党 - 临时行动委员会\n§L$YUN_KMT_intro$\n\n北伐失败后，流亡海外的国民党中央委员会与本土起义部队领导层之间的分歧越来越大。1932年上海起义的失败更加剧了这种分裂，并证实了闽赣根据地需要一个更加独立自主的领导结构。最终宋庆龄和邓演达发表了《对中国及世界革命民众宣言》，正式宣布成立国民党临时行动委员会。\n\n国民党遵循农业化与先锋队式的社会主义路线，在闽赣根据地占据了主导地位，成为党内反对汪精卫统治的主要力量。尽管国民党左派政府失败了，但临委会仍然通过邓演达与陈诚的友谊在新国民党政府内部获得了一定程度的支持。§!\n"
 YUN_revolutionary_committee_kuomintang_party: "国民党(革委会)"
 YUN_revolutionary_committee_kuomintang_party_long: "中国国民党 - 革命委员会\n§L$YUN_KMT_intro$\n\n尽管有些迟了，但作为中国内战的最终胜利者，章伯钧和朱德成为了夺得国民党主要领导权的黑马。章伯钧和朱德召集了各路党派领导人——以他们在临委会中的前盟友为主，但也没忘了从改组会甚至工团党中提拔得力的干部，最终将国民党改组为了一个由他们控制的革命委员会。他们承诺会弥合党内各派之间的分歧，并开辟属于自己的第三条道路，从而维护中国的革命价值观。§!\n"
 YUN_chinese_peasants_and_workers_democratic_party: "农工民主党"
 YUN_chinese_peasants_and_workers_democratic_party_long: "中国农工民主党\n§L农工民主党前身是章伯钧和谭平山于1927年在北伐失败后成立的原临时行动委员会，临委会后来被宋庆龄和邓演达二人收编，许多人认为谭章二人的命运将永远与国民党临委会的创始人这一身份联系在一起。后来，谭平山自我流放，前去领导临委会广东分会，章伯钧则与邓演达、宋庆龄合流，看来这样的命运似乎已成定局。\n\n但章伯钧与朱德结盟，共同在政治战场上携手奋战，成功走上了中国社会主义崭新的第三条道路。通过与中国民主同盟和中国工团党等党外组织的讨论，章伯钧成功摆脱了青天白日的枷锁。章伯钧希望自己能不断前进，带领国家走向崭新的民主社会主义未来，一个对人民而非委员会负责的未来。§!\n"
 YUN_KMT_CEC_early_party: "国民党(黄埔系左派)"
 YUN_KMT_CEC_early_party_long: "中国国民党 - 黄埔系左派\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n随着国民党陷入内战，黄埔系很快便分裂成左右两派。但这些年轻的学生们都学习的是同一套融合了极端民族主义、社会主义、日本武士道、中国传统主义和革命暴力的课程，因此要在左右两派选边站队并不容易。作为黄埔军校中两位最具影响力的军人，蒋介石和邓演达各自成立了自己的同学会。许多人尽管自己出于个人忠诚选择倒向蒋介石，但依然同情邓演达的社会和经济理论。§!\n"
 YUN_KMT_CEC_party: "国民党(土木系)"
 YUN_KMT_CEC_party_long: "中国国民党 - 国民革命军土木系\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n随着国民党陷入内战，黄埔系很快便分裂成左右两派。但这些年轻的学生们都学习的是同一套融合了极端民族主义、社会主义、日本武士道、中国传统主义和革命暴力的课程，因此要在左右两派选边站队并不容易。作为黄埔军校中两位最具影响力的军人，蒋介石和邓演达各自成立了自己的同学会。许多人尽管自己出于个人忠诚选择倒向蒋介石，但依然同情邓演达的社会和经济理论。\n\n这些人组建了由陈诚领导的土木系，这一名字来源于陈诚领导过的第十八军和第十一师（土”即“十一”，“木”即“十八”）。与其他国民革命军派系相比，土木系以其纪律严明、民粹主义和廉洁清白为荣，是黄埔系中的左翼。§!\n"
 YUN_KMT_RCF_party: "国民党(再造派)"
 YUN_KMT_RCF_party_long: "中国国民党 - 再造派\n§L$YUN_KMT_intro$\n\n孙科担任广州市长时，他的朋友与同盟组建了一个名为“太子派”的松散组织，其成员大多刚刚从西方的大学中毕业。该派系信奉自由主义与技官主义，与那些富有的国民党金主来往密切，尽管国民党内分歧日益增大，“太子派”却一直左右逢源。北伐战争后，“太子派”在夏威夷正式重组合并为再造派。孙科决定加入我们的政府后，他带来了再造派的大部分成员，包括侨务委员会在东南亚的强大关系网络，以及与遣印派有关联的众多军官。§!\n"
 YUN_KMT_PSC_party: "国民党(政学系)"
 YUN_KMT_PSC_party_long: "中国国民党 - 新政学系\n§L$YUN_KMT_intro$\n\n政学系最早成立于1913年，二次革命讨袁失败后，孙中山要求同盟会成员向他个人宣誓效忠，一些拒绝效忠的同盟会成员在日本东京成立了欧事研究会，后于1916年组成政学系。\n\n政学系拒绝参与孙中山与国民党为统一中国发起的护法北伐，而是与南方的岑春煊、陆荣廷等军阀合作，试图推翻孙中山领导的护法军政府，并促进西南军阀与北洋军阀间的谈判统一。但接下来，孙中山在粤系军阀陈炯明的帮助下驱逐了岑春煊与陆荣廷，后来唐继尧又赶走了云南省长顾品珍。结果，旧政学系瞬间土崩瓦解。\n\n新政学系由张群和杨永泰创建，此二人结盟成立了新中国建设学会（这是政学系的正式名称）。新政学系对国民党更加忠诚，或者说更加温顺。他们很少开展群众运动，而是以建立在中国南方的银行、知识分子和官僚精英间的广泛人际网络为基础。§!\n"
 YUN_KMT_OLD_PSC_party: "国民党(政学系)"
 YUN_KMT_OLD_PSC_party_long: "中国国民党 - 政学系\n§L$YUN_KMT_intro$\n\n尽管旧政学系在北洋政府的秩序下勉强维持着一席之地，但在动荡不安的军阀时代结束后，政学系死灰复燃，重新登上了政治舞台。如今新中国建设学会中的同僚纷纷投奔到他们前辈的保护伞下，党国中的技术官僚团结在了传奇的战争英雄、政学系铁杆李根源周围，希望能融合出他们自己版本的训政形式。§!\n"
 YUN_KMT_3AR_party: "国民党(第三军右派)"
 YUN_KMT_3AR_party_long: "中国国民党 - 国民革命军第三军右派\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n第三军的前身是归属于南方政府的护国第二军、建国第一军。1925年孙中山去世后，建国第一军（即滇军）企图发动反国民党叛乱，但旋即遭到挫败。\n\n随后，建国滇军被改组为第三军，由忠诚的云南国民党员朱培德指挥。该军在北伐东线与孙传芳的作战中表现优越，但最终在长征期间被迫与国民革命军其他残部一道转进。国民党在贵州重组后，第三军又吸收了范石生、金汉鼎的小规模武装。\n\n第三军的右派由朱培德领导，但他的领导权并非毫无争议。由于朱培德更关心本地事务，因此党内其他较大的势力并不把他当作太大的威胁。§!\n"
 YUN_KMT_MCC_party: "国民党(莫斯科派)"
 YUN_KMT_MCC_party_long: "中国国民党 - 莫斯科委员会派\n§L$YUN_KMT_intro$\n\n孙中山去世后，胡汉民继承了他广州军政府大元帅一职。可没过多久，汪精卫、蒋介石和其他当权者就结盟把胡汉民排挤在外。随着国民党左派和中国工团党的势力日益壮大，党内右派人士又不得不恳求胡汉民出山来反对他们。他们在失败的国民党一届四中全会上摊了牌。由于蒋介石选择反对胡汉民，胡汉民的盟友不是被清洗就是流放。\n\n北伐开始前，流亡中的胡汉民及其右派盟友组建了一个对立的中央委员会，出走流亡，最终在莫斯科安家落户。莫斯科委员会的回归使胡汉民在这个自己曾经执掌的党内拥有了一定话语权，但他们对党内对立势力占据上风，自己权势日益下降的事实颇为不满。§!\n"
 YUN_KMT_dian_remnant_party: "旧滇系军阀"
 YUN_KMT_dian_remnant_party_long: "旧滇系军阀残部\n§L辛亥革命后，军人主导云南政坛，蔡锷成为了省内的第一位领袖，后来，他因支持宋教仁被袁世凯罢黜，唐继尧接替了他的位置。袁世凯复辟期间，唐继尧脱离袁世凯，将权力交还给蔡锷，协助其领导护国运动，而蔡锷去世后，他又再次成为云南督军。\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。胡若愚也认同这种经验，清廷霸权终结、昆明再陷政治动荡之际，他出手重建了云南的秩序。\n\n胡若愚的新政府主要依靠军队来维持，不过士绅阶层也以“维护法治秩序”为名与昆明政府合作。自由派和社会主义者批评胡若愚“独裁”，他的支持者则视他为抵御混乱和激进思想的长城。§!\n"
 YUN_KMT_CCC_party: "国民党(CC系)"
 YUN_KMT_CCC_party_long: "中国国民党 - CC系\n§L$YUN_KMT_intro$\n\n辛亥革命期间，陈其美领导的同盟会分支在上海开展活动，以协调江南地区的革命活动。陈其美与蒋介石、戴季陶这两位浙江老乡以及自己的侄子陈果夫合作，为革命筹集资金和士兵，为此，他经营了非法证券交易所并协调那些民族主义黑帮的活动，但最终遭到了暗杀，一般认为是袁世凯指使张宗昌派人所为。大约十年后，蒋介石在国民党领导权争夺战中又遭遇了相似的命运。北伐战争后，隶属该组织的知识分子戴季陶撤退回了他们旧日的大本营，并致力于重建他们的情报网络。\n\n这个由政治人物组成的紧密网络逐渐发展成为一个秘密组织，并被外界称为CC系。陈果夫的弟弟陈立夫也加入了这个组织，成为这一党内派系的著名发言人，该派系在教育、宣传，甚至是情报收集工作领域有着统治性地位。§!\n"
 YUN_KMT_WPC_party: "国民党(黄埔系)"
 YUN_KMT_WPC_party_long: "中国国民党 - 黄埔系本流\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n何应钦是黄埔军校总教官，也是蒋介石在第一军的头号副手。作为一名出身贵州的革命者，尽管何应钦与蒋介石公开闹翻，但在国民革命军流亡期间，他还是利用自己对贵州的熟悉，在军队中拉拢了一批拥趸、朋友和门生，以此作为自己的权力基本盘。何应钦是一名保守的军人，尽管他不太善于思考，但他还是为党带来了急需的部分稳定，这一功劳非他莫属。§!\n"
 YUN_KMT_NRA_party: "国民党(国民革命军)"
 YUN_KMT_NRA_party_long: "中国国民党 - 国民革命军残部\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n北伐失败后，国民革命军右翼被迫撤退，经历了一场名为“长征”的艰苦跋涉后，国民革命军第一、第二、第三、第六和第七军的残部精疲力竭地逃到贵州，以此为基地，他们组建了一个由五人组成的军政府，名义上由朱培德作为领导人。尽管这些残党在之后数年间经历了人员流失和士气低落，但仍利用东方的乱局设法生存了下来。这些盘踞在贵州的残党极端激进，复仇心切。§!\n"
 YUN_KMT_BSS_early_party: "国民党(黄埔系极端派)"
 YUN_KMT_BSS_early_party_long: "中国国民党 - 黄埔系极端派\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n黄埔学生组建的孙文主义学会是早期反工团主义激进团体之一，在校期间，他们就与校内的左派人士互相辱骂、殴打。而北伐战争期间左派的背叛以及外国势力的干涉，使许多黄埔校友在流亡期间变得愈发激进。他们看向了自己的极端民族主义和黄埔传统，以及俄罗斯和罗马尼亚等国的国家民粹主义团体，试图从中寻找拯救国家免于衰弱和堕落的解决方案。§!\n"
 YUN_KMT_BSS_party: "国民党(蓝衣社)"
 YUN_KMT_BSS_party_long: "中国国民党 - 蓝衣社\n§L$YUN_KMT_intro$\n\n$YUN_NRA_intro$\n\n黄埔学生组建的孙文主义学会是早期反工团主义激进团体之一，在校期间，他们就与校内的左派人士互相辱骂、殴打。而北伐战争期间左派的背叛以及外国势力的干涉，使许多黄埔校友在流亡期间变得愈发激进。他们看向了自己的极端民族主义和黄埔传统，以及俄罗斯和罗马尼亚等国的国家民粹主义团体，试图从中寻找拯救国家免于衰弱和堕落的解决方案。\n\n作为这一战斗派民族主义运动的产物，滕杰等人成立了蓝衣社。蓝衣社是国民革命军内部的一个秘密组织，他们致力于在中国建立一个国家民粹主义国家。这些人天性狂热，其中一部分人甚至开始质疑蓝衣社是否应该继续忠于何应钦将军，乃至于忠于国民党本身。§!\n"
 YUN_GRA_intro: "共和大同盟是一个准合法的政治联盟，其主要由华南地区的政党组成，旨在对抗北洋政府的建制派政治秩序。1931年，直奉和谈失败，反租界势力和民族主义情绪高涨，共和大同盟随之成立。大同盟曾短暂地与退休的段祺瑞结盟，之后又有许多“老派”联省主义团体加入其中，如唐继尧在云南领导的民治党和褚辅成领导的浙江自治运动等，从而在国会中组建了一个不服从联盟。赵恒惕领导的民新社和熊克武领导的联省自治筹备处也对共和大同盟抱有极大同情，但依然维持着独立运作。"
 YUN_NPA_intro: "辛亥革命后，军人主导云南政坛，蔡锷成为了省内的第一位领袖，后来，他因支持宋教仁被袁世凯罢黜，唐继尧接替了他的位置。袁世凯复辟期间，唐继尧脱离袁世凯，将权力交还给蔡锷，协助其领导护国运动，而蔡锷去世后，他又再次成为云南督军。"
 YUN_republicans_party: "共和派"
 YUN_republicans_party_long: "独立共和派和知识分子\n§L1932年上海起义、选举暂停后，大批自由派知识分子逃离了日益专制的直系政权，转投华南的联省政府。许多教育工作者回到云南家乡，公开表达了对北京政府的厌恶，加入了蓬勃发展的中国民主政团同盟。\n\n在唐继尧督理的资助下，他们在昆明政府中拥有一定的影响力，而在云南的进步知识分子中，苏鸿纲和寸树声尤为突出，在组织内部形成了诸多昆明圈子，他们以国立西南联合大学为基础，与梁实秋、闻一多等新月社成员合作，推动云南的民主进程。§!\n"
 YUN_YCD_party: "民盟(云南派)"
 YUN_YCD_party_long: "$YUN_YCD_party_long_tt$\n§L1932年上海起义、选举暂停后，大批自由派知识分子逃离了日益专制的直系政权，转投华南的联省政府。许多教育工作者回到云南家乡，公开表达了对北京政府的厌恶，加入了蓬勃发展的中国民主政团同盟。\n\n在唐继尧督理的资助下，他们在昆明政府中拥有一定的影响力，而在云南民盟知识分子中，苏鸿纲和寸树声尤为突出，在组织内部形成了自己的小团体，他们以国立西南联合大学为基础，与梁实秋、闻一多等新月社成员合作，推动云南的民主进程。§!\n"
 YUN_YCD_party_long_tt: "中国民主同盟 - 云南派"
 YUN_CMS_local_party: "新月社"
 YUN_CMS_local_party_long: "新月社\n§L新月社最初由徐志摩于1923年在上海成立，起初它是一个研究艺术和戏剧的资产阶级社会俱乐部，后来它逐渐发展为一个有明确政治倾向的社会俱乐部。尽管包括胡适在内，许多知识分子都在其中来来往往，但新月社的思想核心还是罗隆基、梁实秋和闻一多三人。\n\n1932年的上海起义后，新月社领导层不断受到八省联合警察的骚扰，于是他们决定迁往云南，接受唐继尧督理的庇护。罗隆基和新月社将国立西南联合大学打造为了自八省联合逃亡的知识分子们的避难所，继续通过言论和自由讨论对抗暴政。尽管新月社只是众多逃离孙传芳统治的知识分子团体中的一员，但它鹤立鸡群，成为了云南省规模最大、最受欢迎的知识分子组织之一。§!\n"
 UPC_CMS_party: "民盟(新月社)"
 UPC_CMS_party_long: "$UPC_CMS_party_long_tt$\n§L新月社最初由徐志摩于1923年在上海成立，起初它是一个研究艺术和戏剧的资产阶级社会俱乐部，后来它逐渐发展为一个有明确政治倾向的社会俱乐部。尽管包括胡适在内，许多知识分子都在其中来来往往，但新月社的思想核心还是罗隆基、梁实秋和闻一多三人。\n\n1932年的上海起义后，新月社领导层不断受到八省联合警察的骚扰，于是他们决定迁往云南，接受唐继尧督理的庇护。罗隆基和新月社将国立西南联合大学打造为了自八省联合逃亡的知识分子们的避难所，继续通过言论和自由讨论对抗暴政。尽管新月社只是众多逃离孙传芳统治的知识分子团体中的一员，但它鹤立鸡群，成为了全国规模最大、最受欢迎的知识分子组织之一。§!\n"
 UPC_CMS_party_long_tt: "中国民主同盟 - 新月社"
 YUN_chamber_of_commerce_party: "云南总商会"
 YUN_chamber_of_commerce_party_long: "云南总商会\n§L云南总商会由颇具权势的省内士绅创立，目标是维护他们的商业利益。19世纪云南遭受反清起义战火的破坏，士绅阶层开始崛起，压制省内的激进改革，例如，云贵总督李经羲的改革就被局限在昆明一地。\n\n军阀时代，为了保证某些改革措施不受士绅抵制，蔡锷和唐继尧都曾与他们合作，此后，士绅们逐渐控制了各级地方议会和云南的大部分工业。近来，锐意进取的官僚缪云台成为了总商会的领袖，他正带领云南省政府进行经济改革。§!\n"
 UPC_PGP_exiled_party: "共盟(民治党)"
 UPC_PGP_exiled_party_long: "$UPC_PGP_exiled_party_long_tt$\n§L$YUN_GRA_intro$\n\n民治党由章太炎的自治运动促进会与唐继尧的民主社合并而成。民治党是唐继尧的个人政党，致力于推广唐继尧关于省级自治、反对军事主义和人民政府的理念。然而，民治党并非唐继尧的一言堂，章太炎在党内仍然拥有大量追随者，党内的章太炎派系提倡一种自下而上的联省制度，并将权力下放给地方社区。\n\n1932年上海起义以及随后的直系镇压让民治党受益匪浅，大批知识分子纷纷南逃，加入了唐继尧的联省派政权。唐继尧的民治党与新成立的国立西南联合大学的进步知识分子结盟，成为唐继尧政府的文职力量。\n\n然而民盟领导的抗议活动揭露了唐继尧的威权统治面目，并对其民主形象造成了近乎毁灭性的打击。不久后，唐继尧被政变推翻。唐继尧之子唐筱蓂现已流亡广州，试图在那里集结支持者并与更广泛的共盟势力建立紧密联系。相较于父亲，唐筱蓂更具自由主义倾向，他或许仍有机会重返权力舞台。§!\n"
 UPC_PGP_exiled_party_long_tt: "共和大同盟 - 民治党"
 UPC_PGP_party: "共盟(民治党)"
 UPC_PGP_party_long: "$UPC_PGP_party_long_tt$\n§L$YUN_GRA_intro$\n\n民治党由章太炎的自治运动促进会与唐继尧的民主社合并而成。民治党是唐继尧的个人政党，致力于推广唐继尧关于省级自治、反对军事主义和人民政府的理念。然而，民治党并非唐继尧的一言堂，章太炎在党内仍然拥有大量追随者，党内的章太炎派系提倡一种自下而上的联省制度，并将权力下放给地方社区。\n\n1932年上海起义以及随后的直系镇压让民治党受益匪浅，大批知识分子纷纷南逃，加入了唐继尧的联省派政权。唐继尧的民治党通过与新成立的国立西南联合大学的进步知识分子结盟，成为了一个真正的民主政党，并有能力对抗北京的直系压迫者及其在邻近省份的代理人。作为唐继尧政府机构的文职力量，民治党始终是政府的重要组成部分。§!\n"
 UPC_PGP_party_long_tt: "共和大同盟 - 民治党"
 UPC_PGP_destroyed_party: "共盟(民治党)"
 UPC_PGP_destroyed_party_long: "$UPC_PGP_party_long_tt$\n§L$YUN_GRA_intro$\n\n民治党由章太炎的自治运动促进会与唐继尧的民主社合并而成，在唐继尧倒台去世后支离破碎。同情民治党的知识分子、作家和宣传家要么逃往政治避风港，要么面临新政权的审查压制，章太炎也已下野隐居。但民治党新任主席唐筱蓂（唐继尧之子）似乎对中国青年党更感兴趣，而非经营唐继尧运动的残垣断壁。尽管如此，唐继尧的影响力在云南依然存在，他的许多旧部仍在政府中担任各种职务。§!"
 YUN_tang_jiyao_clique_party: "唐继尧派"
 YUN_tang_jiyao_clique_party_long: "唐继尧派\n§L辛亥革命后，军人主导云南政坛，蔡锷成为了省内的第一位领袖，后来，他因支持宋教仁被袁世凯罢黜，唐继尧接替了他的位置。袁世凯复辟期间，唐继尧脱离袁世凯，将权力交还给蔡锷，协助其领导护国运动，而蔡锷去世后，他又再次成为云南督军。\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。在他的政府中，军人派系继续宣扬着蔡锷的理念：军人对国家需求的理解比民众更深刻，职业军人对民族国家的各方各面都更为胜任。\n\n虽然唐继尧本人认同这一点，但他也明白向专制倒车不符合中华民族的发展趋势，因此，他在手下的军人派系和民政派系（即民治党）之间寻求着平衡。如今，他的政府中存在着理想主义的民主人士、野心勃勃的强硬军人和干练的官僚三股势力，他们的合作并不十分融洽。§!\n"
 YUN_national_dian_clique_party: "滇系"
 YUN_national_dian_clique_party_long: "滇军派\n§L辛亥革命后，军人主导云南政坛，蔡锷成为了省内的第一位领袖，后来，他因支持宋教仁被袁世凯罢黜，唐继尧接替了他的位置。袁世凯复辟期间，唐继尧脱离袁世凯，将权力交还给蔡锷，协助其领导护国运动，而蔡锷去世后，他又再次成为云南督军。\n\n唐继尧在云南执政数十年，在此期间建立了强大的统治机器，包括实力强劲的军队、运转良好的文官机构、与士绅和商界精英的密切联系，以及围绕保守主义、民族主义和联省主义构建的意识形态纲领。随着这台强大的机器从一股区域性力量发展成为全国性力量，云南内部各路小派系之间的界限逐渐模糊，直至对大多数外来者而言变得无关紧要。滇系人物现已把控着新共和国的众多要害部门，这令其他人颇为恼火。§!\n"
 YUN_long_yun_clique_party: "龙云派"
 YUN_long_yun_clique_party_long: "龙云派\n§L$YUN_NPA_intro$\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。然而，唐继尧继续在麾下的军事力量、自由派盟友和与士绅利益一致的官僚之间维持着平衡。\n\n尽管龙云的掌权之路充满坎坷，但他仍保留了唐继尧政府的大部分机构。从李经羲到蔡锷，再到唐继尧和龙云，现任云南政府只是众多改革者中的一员。历任改革者均致力于推动云南省的进步发展，并将云南打造成国内其他地区的模范榜样。§!\n"
 YUN_long_yun_clique_national_party_long: "龙云派\n§L$YUN_NPA_intro$\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。然而，唐继尧继续在麾下的军事力量、自由派盟友和与士绅利益一致的官僚之间维持着平衡。\n\n尽管龙云的掌权之路充满坎坷，但他仍保留了唐继尧政府的大部分机构。从李经羲到蔡锷，再到唐继尧和龙云，现任云南政府只是众多致力于推动云南省进步发展的改革者中的一员。\n\n出乎意料的是，龙云派凭借自身的卓越领导才能，从一个地方小派系，一跃成为统一全中国的护国联盟领袖。如今，龙云以铁腕治国，在引领国家迈向新时代之际，将所有导师的教诲融会贯通。§!\n"
 YUN_lu_han_clique_party: "卢汉派"
 YUN_lu_han_clique_party_long: "卢汉派\n§L$YUN_NPA_intro$\n\n卢汉曾是龙云的儿时挚友，但在龙云开始独揽大权，置昔日拥护者于不顾后背叛了龙云。此举引发龙云麾下高级将领集体叛变，与卢汉联手发动政变推翻旧主。后来，许多曾经支持龙云之人（至少在军中如此）纷纷拥立卢汉为新领袖。卢汉是一位雄心勃勃、灵活善变的军阀，凭借着一种杂糅了民粹主义和民族主义的理念，确立了自己的领导地位。§!\n"
 YUN_garrison_commanders_party: "驻军指挥官"
 YUN_garrison_commanders_party_long: "省内驻军指挥官\n§L$YUN_NPA_intro$\n\n唐继尧坚定地支持民主和联省，不过他从护国战争、军阀时代以及随后十年的暴力和混乱中得到了一个重要的经验：内部团结是头等大事。\n\n二十年代，云南的局面好似摇摇欲坠的累卵，滇系军阀内斗不断，先是顾品珍，后是龙云、胡若愚、李选廷和张汝骥，两拨人马都谋划推翻“云南王”的统治，最为危险的当属后一次危机——唐继尧仅仅勉强逃脱了下台的命运。如今，滇西驻军由孙渡统领，唐继尧居于滇中，坐镇昆明，多年来，双方一直维持着脆弱的和平；与此同时，滇北的龙云派和滇南的蒙自派（胡若愚、李选廷、张汝骥）表面上忠于唐继尧，但他们的真实意图仍未可知。§!\n"
 YUN_hu_ruoyu_clique_party: "蒙自派"
 YUN_hu_ruoyu_clique_party_long: "$YUN_hu_ruoyu_clique_party_long_tt$\n§L$YUN_NPA_intro$\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。胡若愚也认同这种经验，清廷霸权终结、昆明再陷政治动荡之际，他出手重建了云南的秩序。\n\n胡若愚的新政府主要依靠军队来维持，不过士绅阶层也以“维护法治秩序”为名与昆明政府合作。自由派和社会主义者批评胡若愚“独裁”，他的支持者则视他为抵御混乱和激进思想的长城。§!\n"
 YUN_hu_ruoyu_clique_national_party_long: "$YUN_hu_ruoyu_clique_party_long_tt$\n§L$YUN_NPA_intro$\n\n唐继尧坚定地支持民主和联省，不过他从护国战争中得到了一点宝贵的经验：军人有权干涉民政。胡若愚也认同这种经验，清廷霸权终结、昆明再陷政治动荡之际，他出手重建了云南的秩序。\n\n尽管被反对者谴责为投机派暴君，但胡若愚成功地将士绅、商人、军人，甚至一些知识分子拉拢到自己一边。他还完成了一件看似不可能之事——将中国统一在自己的旗帜下。如今，人们预计他将以类似前直系政权的方式统治国家。事实上，他确实已着手吸纳前直系政客来构建文官政府，而由他麾下将领组成的军政府则将在幕后操控国家大事。§!\n"
 YUN_hu_ruoyu_clique_party_long_tt: "蒙自派"
 YUN_YCP_party: "中国青年党"
 YUN_YCP_party_long: "中国青年党\n§L中国青年党是学生组织“少年中国学会”的后继者之一。少年中国学会分裂成了曾琦与李璜领导的民族主义派、李大钊领导的社会主义派与王光祈领导的理想主义派，随后，曾琦、李璜等民族主义派成员前往法国留学，并与周恩来、蔡元培、李石曾等留学生发生了激烈冲突。\n\n由于中国工团党的支持者增加，变得越来越暴力，且得到了法国政府的支持，曾琦和李璜决定成立自己的党派，于1923年在巴黎市郊成立了中国青年党，随后在留学生中快速扩张。1924年，青年党坚决反对国民党和工团党，他们回到上海，创办了一系列政治社团与报刊，开始与直系军阀吴佩孚和孙传芳合作。\n\n直系胜利后，中国青年党更上一层楼，成为唯一与中央政府保持密切关系的大众政党。云南虽然并非直系势力范围，但也同样受到了青年党的影响。尽管青年党在共和壁垒云南的影响力不大，但仍然拥有自己的省级党委，由滇系将领廖行超领导。§!\n"
 YUN_assorted_leaders: "各色领袖"
 YUN_assorted_leaders_sic_desc: "§Y背景：§!§L有时，一场运动并没有一个单一而明确的领导者。也许是因为这场运动太大、太难驾驭，也许是因为它规模太小、太不为人知，再也许是因为这只是一个过渡阶段。但无论如何，都有许多可以担当这一角色的潜在人选。§!"
 YUN_RUS_theorist: "俄国军事顾问团"
 YUN_RUS_theorist_desc: "§Y背景：§!§L根据俄国与云南政府的安排，大批俄罗斯军事顾问被派往中国，协助滇军发展和复兴黄埔军校。俄国军事顾问团名义上由俄罗斯老兵彼得·冯·格拉泽纳普率领。顾问团也是中俄之间的主要联络人，旨在将俄罗斯的现代军事方法融入中国战场。\n\n顾问团的其他关键人物包括格奥尔基·埃尔芬格伦，一位致力于强调战争中保持军队意识形态纯洁性的意识形态建设者；以及弗谢沃洛德·伊万诺夫，一位著名的骑兵军官、作家和欧亚主义学者，致力于向中国士兵灌输“总体战”的思维模式。顾问团名义上是一个非政治性的军事顾问团，顾问团成员置身于中国人的政治纷争之外，大体上专注于中国的军事层面。§!"
 YUN_wang_fusheng: "王复生"
 YUN_wang_fusheng_bio: "王复生生于滇西，在家乡接受了正规教育。1918年，他离家求学考入北京大学文科预科班，1920年升入法国文学系。在北京期间，他开始接触到工团主义思想，并与邓中夏、李大钊等人有过交往。同年在李大钊的指导下，王复生等19人发起成立了中国第一个工团主义研究团体——北京大学工团学说研究会，王复生任法文翻译组组长。1920年11月，王复生加入李大钊建立的北京社会主义青年团，1921年7月转为中国工团党党员。\n\n后来由于经济拮据，王复生赴杨钟健父亲主持的陕西担任教职，并继续传播工团主义思想，组织革命活动。回到北京大学复学后，他与弟弟发起了新滇社，并出版《革新》周刊，并曾参与五卅运动。1926年4月，王复生被派往广州，在国民革命军政治部工作，他还前往昆明试图策动推翻唐继尧，并曾协助创建了中国工团党云南省临时省党部。王复生与他的弟弟王德三等人以及云南的其他左派人士仍在通力合作，继续为工人事业而奋斗。"
 YUN_wang_fusheng_leader_desc: "§Y生于：§!1896年9月27日；大清、云南省祥云§\n§Y背景：§!§L$YUN_wang_fusheng_bio$§!"
 YUN_li_xin: "李鑫"
 YUN_li_xin_advisor_desc: "§Y生于：§!§L1897年10月12日；大清、云南省龙陵§!\n§Y派系：§!§r云南工团党§!\n§Y背景：§!§L李鑫生于云南农村的一个贫苦农民家庭，曾和几个朋友跋涉一个多月前往昆明，考入省立中学。在革命和进步思想的熏陶下，他致力于改变人间的不平等。1919年毕业后，他考入南京东南大学农学系学习，之后转学到北京农业大学园艺系学习，开始受到工团主义思想的影响，认识到只有经过革命，才能消灭压迫和剥削。\n\n1925年，李鑫加入中国工团党，同王德三、杨青田参与组建新滇社，并创办进步刊物《革新》。参与五卅运动后，他加入了国民革命军政治部，并被派往云南协助组建工团主义青年团。他与王复生密切合作，利用自己的农民出身，向云南底层民众宣扬更加亲近农民的思想。§!"
 YUN_zhu_de: "朱德"
 YUN_zhu_de_bio: "朱德出生于四川一户客家人佃农家庭，少年时打过许多零工，参加了秘密结社哥老会，了解太平天国起义及其对中国的影响。朱德在私塾读书时，他的一位老师是康有为的忠实支持者，朱德从他身上接触到了革命情绪的启蒙。之后朱德参加科举并通过了乡试和府试，然而科举制度却在1905年被废除，于是本就对传统感到失望的朱德被新兴的军国主义思想所吸引，前去报考云南陆军讲武堂，并成为了少数被录取的四川学生之一。\n\n朱德从讲武堂特别班提前毕业并参加了重九起义，逐渐成为了蔡锷的得意门生之一。之后朱德成为了一名军事教官，并在护国战争期间效力于蔡锷的第一军，后来又参加了护法战争。顾品珍推翻唐继尧时试图利用公款资助朱德前往欧洲留学，但随着唐继尧卷土重来，朱德不得不逃往上海，最后在金汉鼎的资助下，与孙炳文一起前往欧洲。\n\n在巴黎学习期间，朱德与周恩来、陈毅和李立三等人相识，并于1922年秘密正式加入了中国工团党。后来他前往德国学习，并迷上了欧洲军事理论。回国参加北伐战争后，他试图动员川军杨森部易帜以策应北伐，但没有成功。后来朱德创办了国民革命军第三军军官教育团，并跟随第三军的其他部队一同退入贵州。作为云南政坛中鼎鼎有名的重量级人物，朱德在征战之余一直专注于起草军事理论著作并组建自己的左派军官团体，他与白崇禧在军事理论方面存在冲突。"
 YUN_zhu_de_leader_desc: "§Y生于：§!1886年12月1日；大清、四川省仪陇\n§Y背景：§!§L$YUN_zhu_de_bio$§!"
 YUN_zhu_de_sic_desc: "§Y生于：§!§L1886年12月1日；大清、四川省仪陇§!\n§Y派系：§!§R第三军左派§!\n§Y背景：§!§L$YUN_zhu_de_bio$§!"
 YUN_chen_yi: "陈毅"
 YUN_chen_yi_high_command_desc: "§Y生于：§!§L1901年8月26日；大清、四川省乐至§!\n§Y派系：§!§R第三军左派§!\n§Y背景：§!§L陈毅出身于一个小地主家庭，15岁时就读于成都甲种工业学校。1919年，陈毅赴巴黎勤工俭学，在那里结识了周恩来和蔡和森，接触到了马克思主义思想，这极大改变了他的人生轨迹。回国后，蔡和森将陈毅发展到中国工团党青年团中。\n\n1923年，陈毅在北京中法大学结识了颜昌颐、洪深等人，成为工团党在该校的支部书记。1924年，陈毅加入到茅盾领导的文学研究会，并当选其校的学生会主席。国民党的第一次改组后，革命统一战线形成，陈毅担任北京学生总会工团党党团书记，与国民党地方支部密切合作。\n\n1926年，日本帝国主义为支援奉系集团，用军舰炮轰了大沽炮台，国民军则还以颜色，以水雷封锁水域，是为大沽口事件。事发后，列强联合援引《辛丑和约》海口不得设防之条款，要求中国各军阀执行。陈毅参加了3月18日反对八国通牒大会，随后政府发起镇压，超过40名学生及市民遇害。他在“三一八”惨案中幸免于难，后被任命为工团党北方局书记，之后又回到四川，在朱德领导下担任军事职务，准备为中国革命发光发热。然而，老天并没有偏袒革命者，德国的干涉让国民革命运动轰然倒塌。在战乱中，陈毅随朱德率领的第三军撤往贵州。虽然国民党折戟北伐，但陈毅败而不馁，仍然相信社会主义革命必将在中国实现。§!"
 YUN_zeng_wanzhong: "曾万钟"
 YUN_tang_huaiyuan: "唐淮源"
 YUN_tang_huaiyuan_high_command_desc: "§Y生于：§!§L1886年；大清、云南省江川§!\n§Y派系：§!§R第三军左派§!\n§Y背景：§!§L唐淮源幼年丧父，由母亲独力扶养成人。他自幼好学，1909年中省试，后进入云南陆军讲武堂，和朱德、金汉鼎为同学，三人义结金兰。求学期间，他受到李根源革命思想的影响，于1910年加入同盟会。他参加了响应辛亥革命的云南重九起义，并被选为讲武堂中的100多名优秀学生之一，与朱培德、朱德、金汉鼎等人编为特别班，接受特殊训练，并于同年晋升为排长。\n\n护国战争期间，唐淮源在蔡锷麾下服役，立下了汗马功劳，随即于1918年晋升为旅长。滇军爆发内斗后，他支持顾品珍推翻唐继尧。1922年唐继尧东山再起后，他下野逃亡。他与朱德、金汉鼎先是在上海落脚，之后动身前往广东拜见孙中山。后来朱德受金汉鼎资助赴欧洲留学，他和金汉鼎则到广州参加北伐。\n\n唐淮源加入国民革命军第三军后，先是在陆军军官学校任教，后因北伐失败被迫撤退。回到云南后，他和金汉鼎再次与唐继尧产生嫌隙。朱德从欧洲回国后，他们三人继续同舟共济，成为朱德在第三军内部非正式团体的核心成员。§!"
 YUN_chen_cheng: "陈诚"
 YUN_chen_cheng_leader_desc: "§Y生于：§!§L1898年1月4日；大清、浙江省青田§!\n§Y背景：§!§L陈诚是一位雄心勃勃、声望颇高、意志坚定且有些盛气凌人的国民党人，他的一生丰富多彩、饱经世故。他虽然自幼体弱多病，但仍坚持求学，青年时期报考保定军校，由此开启军旅生涯。\n\n1920年，陈诚在粤军短暂服役后加入了国民党，之后回到保定军校完成学业。毕业后，他被导师邓演达延揽为副官，后来在担任孙中山警卫时不幸中弹，却因此进入了蒋介石麾下。黄埔军校成立后，孙中山、蒋介石和邓演达都对他青睐有加。\n\n陈诚曾是学生、教官和队长，在二十年代为国民革命军立下了汗马功劳。然而，如果没有蒋介石和邓演达的关照，他很可能早已被何应钦排挤孤立。如今，在成为新委员长后，他凭借着对土地改革的广泛理解以及自身对社会主义若即若离的契合，出人意料地将新右派引向了一条左翼道路。§!\n\n§Y备注：陈诚的生活极其简朴，对贪图享受敬而远之，并且坚决反对贪污腐败。§!"
 YUN_luo_zhuoying: "罗卓英"
 YUN_luo_zhuoying_sic_desc: "§Y生于：§!§L1896年3月19日；大清、广东省大埔§!\n§Y派系：§!§S土木系§!\n§Y背景：§!§L罗卓英是客家人，自幼接受正规教育，后于1918年考入保定军校第8期炮兵科，在校期间与陈诚和周至柔结为拜把子兄弟。1922年7月毕业后，他回到家乡担任教务主任和校长，后经国民党政治家邹鲁推荐，出任潮梅军参谋，但在不久后辞职。在陈诚极力推荐下，他于1924年底进入了当时刚刚创办的黄埔军校。此后，无论陈诚在哪里崭露头角，他都将紧随其后。\n\n罗卓英在东征期间是陈诚的直属下属，并凭借出色的炮兵指挥能力在国民革命军中广受好评。北伐战争爆发后，他跟随陈诚的炮兵营参加北伐，在第一军军长何应钦麾下进军福建和浙江。陈诚和罗卓英的炮兵部队曾短暂调往广州，以抵御德军的入侵，但未能扭转战局。在经历了血腥的内斗、蒋介石遇刺以及部队撤退至贵州的混乱局面后，陈诚被何应钦调往政治部任职，而罗卓英则接替陈诚出任第一军炮兵部队指挥官。\n\n罗卓英是一位出色的战略家和战术家，他的军事才能与陈诚的行政手腕相得益彰。他和陈诚在国民革命军中创建了土木系。§!\n\n§Y备注：罗卓英是陈诚的挚友兼左膀右臂，人送外号“小智囊”，与陈诚的“小委员长”绰号形成了鲜明对比。§!"
 YUN_hu_lien: "胡琏"
 YUN_hu_lien_commander_desc: "§Y生于：§!§L1907年11月13日；大清、陕西省华县§!\n§Y派系：§!§S土木系§!\n§Y背景：§!§L胡琏虽然出身贫寒，但天资聪颖，又勤奋好学。他决心参军，最终在胡景翼手下当了一个文书。不久之后，胡琏收到了一位广州亲戚的来信，劝他去黄埔军校学习。1925年，胡琏考入黄埔军校，很快毕业，又刚好赶上了东征。北伐中他担任连长，但由于德国的干涉，胡琏和他的上级被迫逃往贵州省。\n\n胡琏在军事指挥方面表现出了远超同辈的天赋。国民革命军残党流亡贵州期间，他迅速晋升，先后任职于陈诚麾下的数个师和军指挥部。尽管他年级轻轻，就已经赢得了上级的关注和支持，并在没有官僚反对的情况下飞黄腾达。§!\n\n§Y备注：胡琏是一位天才指挥官，曾被形容为“狡如狐，猛如虎”。他与卫立煌、罗卓英等人等人一同，为土木系巩固在国民革命军中的地位做出了重要贡献。§!"
 YUN_wei_lihuang: "卫立煌"
 YUN_wei_lihuang_army_chief_desc: "§Y生于：§!§L1897年2月16日；大清、安徽省合肥§!\n§Y派系：§!§S土木系§!\n§Y背景：§!§L卫立煌自幼饱读传统经典，辛亥革命期间曾在地方军队短暂服役，后担任军事训练班主任。受兄长革命思想熏陶，他在二次革命期间参加了安徽的群众武装起义。从湖北陆军学兵营毕业后，他于1915年加入粤军，1917年被选中为孙中山大元帅府卫士。在此过程中，他进一步加深了对三民主义的理解，并加入了国民党。他在与旧皖系部队的作战中表现机敏，因而获得提拔，之后又在新成立的国民革命军中屡建战功，一直尽职尽责地在许崇智麾下效力。\n\n卫立煌参加了东征战役和镇压商团事变，最终于1925年被编入国民革命军第一军。在北伐战争中，他在何应钦麾下作战，展现出了英勇果断的军人风范和技艺精湛的指挥水平，并迅速晋升为第十四师师长。在北伐陷入困境，广州失守沦陷后，他是少数几名仍能不断取得军事胜利的国民革命军将领之一，但最终仍未能阻止直军的推进。在第一军混乱撤往贵州的途中，他经常担任殿后拖延敌人，以便让较弱的部队得以逃脱。\n\n卫立煌始终忠于上级，是公认最出色的国民革命军指挥官之一，负责阻止任何势力侵入贵州——无论是旧黔系还是旧桂系。他不认同何应钦对黄埔系的领导，并坚决反对滕杰的蓝衣社，因此与陈诚及其土木系走得很近，成为了国民革命军中一个摇摆不定的成员。§!\n\n§Y备注：卫立煌被许多人视为能与白崇禧相媲美的军事天才，并获得了“虎将”绰号，被誉为黄埔“五虎将”中的第一人。§!"
 YUN_zhang_qun: "张群"
 YUN_zhang_qun_bio: "张群早年就读保定全国陆军速成学堂，1908年赴日本，就读振武学堂，并因缘际会与同学蒋介石结为挚友，同年投身于中国革命大潮，加入同盟会。辛亥革命爆发后，他在陈其美麾下与挚友并肩作战，任蒋介石所在师的参谋，1913年在二次革命中再度与蒋介石共同作战，两人的命运自此永远地联系在一起。1915年，他在出任浙江省督署参谋后，被岑春煊招入麾下。\n\n1917年，张群投奔了孙中山的广州政府，参与了失败的护法运动。之后，他返乡受聘于熊克武，担任四川警务处处长。1923年熊克武战败后，他于1926年再次被蒋介石聘为参谋，出任国民革命军总司令部总参议兼军事委员会委员，在国民革命军内部的纷争中保持着低调。北伐战争失败，挚友蒋介石遇刺后，张群还未及哀悼，便跟随国民党“右派”转进贵州。\n\n张群在贵州省府中地位显赫，于1929年至1932年担任贵阳市长，最终出任省政府委员会秘书长。作为新政学系的代表人物，他在国民党文职官僚体系中拥有广泛的影响力。\n\n§Y备注：张群凭借其在党内的影响力，成功招揽了杨永泰、熊式辉等旧政学系人士，他的派系因而获得了“新政学系”的绰号。§!"
 YUN_zhang_qun_leader_desc: "§Y生于：§!§L1889年5月9日；大清、四川省华阳§!\n§Y背景：§!§L$YUN_zhang_qun_bio$§!"
 YUN_yang_yongtai: "杨永泰"
 YUN_kong_xiangxi: "孔祥熙"
 YUN_kong_xiangxi_advisor_desc: "§Y生于：§!§L1880年9月11日；大清、山西省太谷§!\n§Y派系：§!§m新政学系§!\n§Y背景：§!§L孔祥熙出生于孔子直系后裔的一个富裕票号世家，后赴美国俄亥俄州欧柏林学院学习文化与社会科学，后进入耶鲁大学攻读矿物学，并取得物理和化学硕士学位。\n\n1911年辛亥革命爆发后，孔祥熙调集太谷县的商团及学生，组成民团负责维持地方秩序。在日本为孙中山的中华革命党筹款期间，他结识了孙中山的英文秘书、宋家大姐宋霭龄，两人于1914年结婚，并回国在山西经商。他在教育和商业方面的工作引起了时任山西督军兼省长阎锡山的注意，阎锡山聘请他担任参议。在阎锡山麾下工作期间，他致力于宣传山西“模范省”的形象，并帮助赈济1919年山西大旱的灾民。作为孙中山在华北的联络人，他与冯玉祥将军建立了联系，并协助冯玉祥发动北京政变驱逐了曹锟和吴佩孚。\n\n1926年，孔祥熙南下广州支援北伐。然而，随着国民革命军迅速溃败，他与党内其他右派分子逃往了贵州。在过去十年里，他一直致力于确保资金流向国民党的贵州行政机构。由于对西南地区国民党的内斗感到担忧和警惕，他一直与内弟宋子文保持着联系。如今，随着他所青睐的国民党技术官僚和银行家圈子东山再起，他也再次出山为革命事业效力。§!\n\n§Y备注：孔祥熙虽然与政学系有所关联，但由于反对经济计划，他与政学系中更偏技术官僚的势力发生了冲突。§!"
 YUN_li_genyuan: "李根源"
 YUN_li_genyuan_sic_desc: "§Y生于：§!§L1879年6月6日；大清、云南省腾越§!\n§Y派系：§!§m新政学系§!\n§Y背景：§!§L李根源早年学习旧学，对中国社会的衰弱与腐朽愈发感到沮丧，决心以天下大业为己任，二十出头便怀有强烈的反清情绪。1904年，他考入日本陆军士官学校，次年参加了在东京举行的同盟会成立大会，并与蔡锷、唐继尧等人建立了深厚情谊。1909年，他回到云南，被任命为云南督练处副参议官，年轻的李根源自此开启了一段扑朔迷离的生涯。\n\n李根源先是递交了一份日本陆军士官学校毕业生名单，随后将名单中人员调往云南，同时将云南陆军武备学堂改造成了现代化的云南陆军讲武堂（云南陆军讲武学校），并出任讲武堂首任总办。他将云南讲武堂打造成了革命思想的摇篮，向学生宣扬三民主义，并聘请李烈钧等人担任教官，后来与蔡锷密谋，发动重九起义以响应辛亥革命。此后，他在蔡锷麾下担任各种职务，被视为唯一能在云南与蔡锷平起平坐的人物。然而，他却于1913年被调往北洋国会众议院任职，到任后不久就被袁世凯密令抓捕，最终只得南下投奔岑春煊、孙中山和黄兴。\n\n1915年，李根源安排蔡锷返回昆明，1917年出任陕西省长，后又出任驻粤滇军总司令，1923年因反对曹锟贿选，辞去北洋政府职务，选择与家人闭门自省。如今，他在隐居十年后重回公众视野，他的资历为他赢得了许多云南人的敬重，但也招致了不少敌意。§!\n\n§Y备注：李根源是最后一位正在逐渐淡出历史舞台的革命元老。他始终坚守自己的座右铭：“躬行刻苦，潜心讨究”。§!"
 YUN_li_genyuan_leader_desc: "§Y生于：§!§L1879年6月6日；大清、云南省腾越§!\n§Y背景：§!§L李根源早年对中国社会的衰弱与腐朽愈发感到沮丧，后于1904年考入日本陆军士官学校，次年参加了在东京举行的同盟会成立大会，并与蔡锷、唐继尧等人建立了深厚情谊。1909年，他回到云南，被任命为云南督练处副参议官。\n\n李根源先是递交了一份日本陆军士官学校毕业生名单，随后将名单中人员调往云南，同时将云南陆军武备学堂改造成了现代化的云南陆军讲武堂（云南陆军讲武学校），并出任讲武堂首任总办。他将云南讲武堂打造成了革命思想的摇篮，向学生宣扬三民主义，并聘请李烈钧等人担任教官，后来与蔡锷密谋，发动重九起义以响应辛亥革命。此后，他在蔡锷麾下担任各种职务，被视为唯一能在云南与蔡锷平起平坐的人物。然而，他却于1913年被调往北洋国会众议院任职，到任后不久就被袁世凯密令抓捕，最终只得南下投奔岑春煊、孙中山和黄兴。\n\n1915年，李根源安排蔡锷返回昆明，1917年出任陕西省长，后又出任驻粤滇军总司令，1923年因反对曹锟贿选，辞去北洋政府职务，选择与家人闭门自省。如今，他在隐居十年后重回公众视野，他的资历为他赢得了许多云南人的敬重，但也招致了不少敌意。§!\n\n§Y备注：李根源是最后一位正在逐渐淡出历史舞台的革命元老。他始终坚守自己的座右铭：“躬行刻苦，潜心讨究”。§!"
 YUN_xiong_shihui: "熊式辉"
 YUN_xiong_shihui_commander_desc: "§Y生于：§!§L1893年；大清、江西省安义§!\n§Y派系：§!§m新政学系§!\n§Y背景：§!§L熊式辉于1911年入南京陆军第四中学学习，不久后加入中国同盟会，同年投身辛亥革命。1913年，他考入保定陆军军官学校第二期学习，1915年毕业后加入了李烈钧麾下的滇军，随军参加了护国战争和护法战争。1921年，他经广东军政府参谋部推荐，被保送入日本陆军大学校学习，1924年毕业后回国担任广州滇军干部学校教育长，后任国民革命军独立第一师党代表。国民革命军独立第一师扩编为第十四军后，他仍任军党代表，同时兼任第一师师长。\n\n北伐失败后，熊式辉幸运地带着十四军残部撤退至贵州，并迅速融入了张群手下的各项行政管理岗位，出任贵州省保安处处长后，贵州地方保安团在他的监督下进行了一系列严格的改革，最终改组为准军事部队。§!\n\n§Y备注：熊式辉以性格古怪著称，喜欢豪掷千金为党内各界要员举办奢华派对。他曾为张群夫妇、何应钦、陈诚、黄绍竑和李宗仁等人举办过派对。\n\n他年轻气盛，是新政学系中少数拥有军人背景的成员之一。但由于性格古怪，他并非新政学系最忠诚的成员。\n\n他被誉为“才智过人、精力充沛”，是政学系中主要的经济计划倡导者之一。§!"
 YUN_gu_zhenglun: "谷正伦"
 YUN_zhu_peide: "朱培德"
 YUN_zhu_peide_leader_desc: "§Y生于：§!1889年10月6日；大清、云南省禄丰县\n§Y背景：§!§L1909年，朱培德进入陆军第十九镇营部武备学堂，1909年该学堂被在昆明新成立的云南讲武堂合并。在讲武堂中，朱培德学习步兵，在李根源门下接受了严酷的军事训练，因成绩优异，与著名的朱德并称为“模范二朱”。同盟会在昆明十分活跃，受此影响，朱培德也加入了同盟会。\n\n朱培德参加了重九起义，后来又跟随李烈钧参加护国战争。李烈钧辞去驻粤滇军总司令职务后，朱培德成为旅长，加入了国民党。随后，李根源又被解除驻粤滇军总司令职务，权力斗争爆发，朱培德失败去职，流亡上海。\n\n1921年，在孙中山的号召下，朱培德再次为革命而战，成为孙中山最信任的将领之一，先是胜任滇军总司令，后任国民革命军第三军军长。当选中央执行委员会委员后，他作为温和派，充当了蒋介石和旧右派之间的调解人。\n\n在后来的权力斗争中，朱培德最终成为贵州国民党残军的领袖，领导着由5人组成的军政府，他仍然是昆明派最忠于革命的那一个，但在希望渺茫的情况下，前路无疑十分艰难。§!"
 YUN_zhu_peide_army_chief_desc: "§Y生于：§!§L1889年10月6日；大清、云南省禄丰§!\n§Y派系：§!§c第三军右派§!\n§Y背景：§!§L朱培德出生于仕宦之家，书香之门，家中排行老二，入读云南昆明陆军第十九镇武备学堂，后于1909年进入新成立的云南陆军讲武堂步兵科，在李根源的指导下接受严格的军事训练，与范石生、金汉鼎、唐淮源等人同学。朱培德与朱德并列班级第一，被称为“模范二朱”。随着同盟会在昆明的活跃发展，朱培德秘密阅读反清书籍，并于1910年加入同盟会。\n\n朱培德参加了重九起义，后来又跟随李烈钧参加护国战争。李烈钧辞去驻粤滇军总司令职务后，朱培德成为旅长，加入了国民党。随后，李根源又被解除驻粤滇军总司令职务，权力斗争爆发，朱培德失败去职，流亡上海。\n\n1921年，在孙中山的号召下，朱培德再次为革命而战，成为孙中山最信任的将领之一，先是出任驻粤滇军总司令，后任国民革命军第三军军长。当选中央执行委员会委员后，他作为温和派，充当了蒋介石和旧右派之间的调解人。\n\n朱培德在北伐战争中指挥第三军，德军入侵广州后负责东线战事。在后来的权力斗争中，朱培德全力支持蒋介石。蒋介石遇刺后，他控制了逃往黔桂两省的国民革命军残余势力，并充当了李宗仁和何应钦之间的调解人。三十年代，他组建了一个五人军政府，与其他国民革命军指挥官分享权力，但他仍然被视为国民党残部的最高领导人。§!"
 YUN_jin_handing: "金汉鼎"
 YUN_jin_handing_high_command_desc: "§Y生于：§!§L1891年；大清、云南省江川§!\n§Y派系：§!§c第三军右派§!\n§Y背景：§!§L金汉鼎自幼怀揣革命理想，于1909年考入云南陆军讲武堂，与朱培德、朱德等人结下深厚友谊。在李根源、罗佩金等人的影响下，他与朱德一同加入同盟会，又作为同届的尖子生一起毕业。他参加了重九起义，后来又参加了护国战争，在蔡锷麾下的第一军中任职。在朱德并肩作战的过程中，他们二人建立了深厚的情谊，并共同经历了滇系内部的权力斗争。1921年，他在顾品珍的权势操纵下代理滇军总司令，并在唐继尧东山再起后逃亡上海。他曾资助朱德远赴欧洲留学，之后辗转到香港闲居至1926年，赋闲期间仍在积极寻求再次报效国家的机会。\n\n北伐战争开始后，金汉鼎招募了两千余名士兵，被编为国民革命军独立第16师，协助攻占南昌。他的部队后来扩编为国民革命军第九军，但他升任军长还没过多久，北伐军便因德国的介入和国民党的内斗而逐渐陷入困境乃至最终瓦解。北伐失败后，他只得率领溃败的第九军转进黔桂地区。\n\n朱德回国后再次与金汉鼎会面时，两人会聊些琐碎的事情，比如彼此的过去经历，朱德在德国的所见所闻，甚至包括朱德日益“左”倾的革命理念。国民革命军改组后，金汉鼎的第九军被解散编入第三军第十二师。§!\n\n§Y备注：金汉鼎是一名军人，同时也热爱健身和武术，并致力于在国民党治下的贵州省开展禁烟运动。\n作为朱德的挚友，他支持朱德的所作所为，尽管他并不认同社会主义意识形态。§!"
 YUN_fan_shisheng: "范石生"
 YUN_fan_shisheng_high_command_desc: "§Y生于：§!§L1887年；大清、云南省河西§!\n§Y派系：§!§c第三军右派§!\n§Y背景：§!§L范石生自幼聪慧好学，在科举废止前考中秀才，后从伯父兼学中医，之后加入同盟会，在蔡锷的云南新军中担任文书。1909年，他考入新成立的云南陆军讲武堂，与朱培德、唐淮源等同学结下深厚友谊，并与他们一同参加了重九起义。在顾品珍和罗佩金的指导下，他在护国战争中随蔡锷的第一军作战，立下赫赫战功，被任命为顾品珍师的参谋长。\n\n在二十年代川系军阀与滇军的战争中，范石生曾因反对顾品珍的作战计划而被革职并遣送回云南。途中，他曾与其他参谋密谋将唐继尧赶出云南。密谋得逞后，他曾短暂担任师长。顾品珍去世后，他被孙中山政府收编。\n\n由于与同僚意见不合，加之并非真正忠于孙中山，范石生只得被迫为国民党效力，但他仍为国民党立下了汗马功劳，最终被孙中山提拔为上将。1925年孙中山在北京去世后，唐继尧策动攻打两广，企图夺取“大元帅”头衔。唐继尧的部队很快遭到了范石生部的阻击，他与李宗仁、白崇禧联手，将唐继尧击退回云南。他麾下的滇军改编为国民革命军第十六军后，他与工团党和国民党代表都进行了密切合作，甚至连思想左倾的朱德也成为了他的部下。\n\n北伐战争结束后，范石生逃往黔桂地区，他麾下的第十六军也被解散编入朱培德重组的第三军，他本人则担任师长。§!"
 YUN_li_mi: "李弥"
 YUN_li_mi_commander_desc: "§Y生于：§!§L1902年；大清、云南省盈江§!\n§Y派系：§!§c第三军右派§!\n§Y背景：§!§L李弥于1924年通过李根源胞弟李根沄的关系，被调入驻粤滇军第七师服役。他凭借好学上进，勤奋肯干，不久后晋升为副官。1924年，李弥被保送上了黄埔军校第四期卫生队，成为最年轻的学员之一，仅次于宋希濂等人。1926年毕业后，他被分配到朱德麾下的国民革命军第三军教导团，任中尉排长。\n\n李弥参加北伐太晚，未能有所作为。北伐失败后，他跟随朱培德和朱德按计划转进黔桂两省交界区。李弥因其不畏死亡的勇气和无所畏惧的领导才能而闻名，在国民革命军三十年代里的多场冲突中表现出色。§!\n\n§Y备注：陈诚曾借口李弥所部军纪涣散，奉何应钦之命试图将李弥所部缴械。李弥却绕过陈诚的部队，径直与何应钦对峙，并声称“过去校长在黄埔军校时，只教过学生如何打仗，未曾教过缴械。”§!"
 YUN_dai_jitao: "戴季陶"
 YUN_dai_jitao_bio: "1905年，戴季陶赴日就读东京高等师范学校，在此期间遇到了年轻的蒋介石，二人结为兄弟。他1909年返回中国出仕，并于1911年加入了同盟会，屡于报章批评满清朝廷，遂流亡辗转于亚洲各地。辛亥革命爆发后，戴季陶在参与上海起义期间结识了陈其美，随后任孙中山先生的私人秘书、日语翻译。主持上海的《民权报》工作后，他在国民党内的未来一切工作便追随着孙中山的脚步。他利用作为记者的才干，成为了孙的心腹之一。\n\n1920年，戴季陶参加了上海工团主义小组，也参与了中国工团党的建立，但这类主义遭到孙中山的反对，此后，他便不再与工团思想眉来眼去。随后，他当选中央执行委员、常务委员，任中央宣传部部长。1924年孙中山去世后，戴季陶一蹶不振、终日郁郁，险些就选择了自我了断。\n\n戴季陶自认受孙中山先生影响，致力于阐发他心中对于三民主义的真正解释——这是一种混合了儒学、三民主义和反工团主义的哲学，也让他成为了国民党“新右派”理论家中的佼佼者，更得到了蒋介石私下的欣赏。"
 YUN_dai_jitao_leader_desc: "§Y生于：§!§L1891年1月6日；大清、四川省广汉§!\n§Y背景：§!§L$YUN_dai_jitao_bio$\n\n戴季陶起初满足于与何应钦委员长的黄埔系合作，以实现他对中国的愿景。然而在何应钦失势后，他却登上了国家领导人的宝座。如今，执掌国民党的戴季陶将带领党和中国迈向他的理想——一个真正的革命国家。§!"
 YUN_chen_lifu: "陈立夫"
 YUN_chen_lifu_bio: "陈立夫是陈果夫的弟弟、陈其美的侄子。他就读于天津的国立北洋大学工矿专业，后赴美国匹兹堡大学取得冶矿硕士学位。陈立夫和兄长陈果夫、叔叔陈其美以及好友蒋介石不同，他志向本不在政治，但最终在陈果夫和蒋介石的延揽之下加入了寻求一统中华，扫清腐败北洋军阀的广州国民政府。\n\n蒋介石遇害，北伐失败后，陈立夫便随兄长前往上海，希望借由继续运营上海证券物品交易所来维持在国民党内的影响力。当陈果夫在国民党右派中身居高位时，陈立夫仍然处于幕后，一面全力协助他的兄长，一面专心投入到党的文职官僚机构中。他凭着自己的工程技能、人脉关系和宣传手段，在党内被视为无价的资产。不过，换句话说，只要得罪了陈氏兄弟中任何一个，陈立夫都会让你吃不了兜着走。\n\n§Y备注：陈立夫醉心于中医实践，以一种特立独行的方式宣传着与自己的”唯生论“思想相结合的孙中山三民主义。§!"
 YUN_chen_lifu_leader_desc: "§Y生于：§!1900年8月21日；大清、浙江省吴兴县\n§Y背景：§!§L$YUN_chen_lifu_bio$§!"
 YUN_chen_lifu_advisor_desc: "§Y生于：§!§L1900年8月21日；大清、浙江省吴兴县§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L$YUN_chen_lifu_bio$§!"
 YUN_chen_guofu: "陈果夫"
 YUN_chen_bulei: "陈布雷"
 YUN_chen_bulei_advisor_desc: "§Y生于：§!§L1890年11月15日；大清、浙江省慈溪§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L陈布雷出生于富裕家庭，家人十分重视他的教育，但他内心深处始终潜藏着一股革命暗流，后来加入了一个名为“覆满同志社”的革命党社团，并于1907年考入浙江高等学堂。几年后的1911年，他受聘与戴季陶等人一起为《天铎报》撰稿，发文声援辛亥革命，后因报馆欠薪离职，并于1912年晚些时候加入国民党。\n\n陈布雷于1920年加入上海新创办的《商报》，担任编辑主任，后通过长辈关系，于1926年采访国民党内部人士。1927年晚些时候，他与潘公展一起加入了国民党，北伐失败后逃亡上海。他在上海任《时事新报》总主笔，兼办《戊辰通讯社》。后来，他的密友戴季陶邀请他协助宣传国民党右派的复兴，他欣然接受了邀请。§!\n\n§Y备注：著名记者邹韬奋曾这样评价陈布雷的文学造诣：“陈布雷先生不但有正义感，而且还有革命性。当时人民痛恨军阀，倾心北伐，他的文章往往以锐利的笔锋，公正的态度，尽人民喉舌的职责。”§!"
 YUN_pan_gongzhan: "潘公展"
 YUN_pan_gongzhan_advisor_desc: "§Y生于：§!§L1895年10月23日；大清、浙江省吴兴§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L潘公展生于一个富裕的绢商家庭，早年投身革命活动，青年时期加入了革命社团，并撰写了一份反清报纸，后于1912年考入上海圣约翰大学外语系。潘公展在圣约翰大学就读期间，成绩斐然，常在英语讲演比赛中获第一名。潘公展的文笔也甚好，曾为一系列报纸、期刊撰稿，甚至加入了一个诗社。\n\n大学毕业后，潘公展编著了《中国学生救国运动全史》，后来受聘于上海《商报》，与陈布雷成为好友。经陈果夫引荐，他和陈布雷于1927年结识了总司令蒋介石，并于同年加入国民党。他选择在上海报刊上鼓吹三民主义，但随着国民党北伐军的失败，他的宣传最终无人问津。陈果夫、陈立夫兄弟组建中央俱乐部后，他受邀加入并担任关键技术官僚岗位，这与他的朋友陈布雷为戴季陶所扮演的角色如出一辙。§!"
 YUN_ouyang_ge: "欧阳格"
 YUN_ouyang_ge_bio: "欧阳格14岁考入江南水师学堂，1911年辛亥革命爆发后，学业一度中断，后转入烟台海军学校，又转入吴淞海军学校。1916年毕业后，他于1917年加入程璧光的护法舰队。然而，程璧光于1918年遇刺身亡后，舰队内部爆发了派系斗争，占主导地位的闽系在林葆怿的操纵下试图回归北京政府，并且试图排挤非闽系人员在海军服务。\n\n欧阳格向孙中山汇报此事后，陈策等非福建籍的海军将领对护法舰队所有闽系人员展开了镇压，欧阳格也参与其中，并因此赢得了孙中山的信任。二十年代，当陈炯明试图推翻孙中山时，欧阳格是少数站在孙中山一边的海军将领之一，并短暂担任海军临时总指挥。在中山舰事件中，欧阳格参与了逮捕中山舰舰长李之龙的行动，但为了缓和紧张局势，欧阳格最终被暂时监禁。\n\n欧阳格曾短暂出任国民政府海军局代局长，在北伐战争期间德军占领广州后，被迫跟随黄埔系逃往贵州。欧阳格深受陈氏兄弟青睐，但并未受到贵州其他国民党军阀的特别欢迎，因此他成为了CC系施加军事影响力的少数途径之一。"
 YUN_ouyang_ge_navy_chief_desc: "§Y生于：§!§L1895年；大清、江西省宜黄§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L$YUN_ouyang_ge_bio$§!"
 YUN_wang_boling: "王柏龄"
 YUN_wang_boling_army_chief_desc: "§Y生于：§!§L1889年；大清、江苏省江都§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L王柏龄出身江苏名门，早年丧父，由母亲一手抚养成人，入读南京陆军小学堂，因成绩优异被保送保定速成学堂。在校期间，他与蒋介石结为挚友，毕业后同被保送日本振武学堂留学。留日期间，他加入了同盟会，毕业后被派往日本陆军见习，辛亥革命爆发后回国，在上海陈其美手下与蒋介石并肩作战，后于1913年参加了二次革命。二次革命失败后，他远赴日本进入陆军士官学校学习，1916年毕业后回国，应唐继尧之邀任云南讲武堂教育长。\n\n1923年，王柏龄应蒋介石之邀，前往广州任高级参谋，并被任命为黄埔军校筹备委员会委员。他不仅担任黄埔军校入学试验委员，还兼任黄埔军校教授部主任。他一手组建了教导第2团，并与何应钦领导的教导第1团一同参加东征战役。由于在东征中指挥失误，他被钱大钧接替，转任黄埔军校教员。\n\n国民革命军成立后，王柏龄出任第一军第一师师长，但由于在北伐初期表现不佳被革职。国民党退守贵州后，他被任命为军事委员会委员，后来辞职投身佛学。如今，他受陈氏兄弟所迫，不情愿地出山为他们继续效力。§!\n\n§Y备注：王柏龄对佛教的关注远不止于战场指挥，他曾亲自参与云贵两省的地方佛教协会，并协助重建鸡足山道观。§!"
 YUN_he_yingqin: "何应钦"
 YUN_he_yingqin_leader_desc: "§Y生于：§!§L1890年4月2日；大清、贵州省兴义§!\n§Y背景：§!§L何应钦是一名天生的出色军人，最初就读于武昌陆军中学堂，后被送往东京振武学校学习。在振武学校期间，他结识了蒋介石，并受到同盟会反清思想的影响，后来加入了同盟会。\n\n辛亥革命爆发后，何应钦于1916年从日本毕业，返回贵州后在王文华手下担任军事教官。民九事变后，他被逐出贵州，前往昆明担任云南讲武堂教务长。\n\n1924年，何应钦通过蒋介石的关系成为黄埔军校总教官，并率领黄埔学生军教导团参加了此后的多次远征。北伐战争期间，他亲身经历了众多惨烈战役，北伐失败后回到家乡。蒋介石遇刺后，作为黄埔系的实际接班人，他被迫与总司令朱培德展开了权力斗争。在国民党重新夺取广东政权后，他成功将朱培德边缘化，并与胡汉民达成了妥协。\n\n在执掌东山再起的国民党政府大权后，何应钦麾下汇聚了从CC系革命者到蓝衣社民族主义者在内的众多拥趸，这位不苟言笑的军人则被推到了聚光灯下。对于何应钦来说，他要么和故友一样倒下、湮没于历史，要么以革命接班人的身份被铭记为中国至暗时刻的救星。§!"
 YUN_he_yingqin_army_chief_desc: "§Y生于：§!§L1890年4月2日；大清、贵州省兴义§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L何应钦19岁时就读于著名的武昌陆军第三中学堂，成为考中留日名额的20名学生之一，被保送进入日本东京振武学校。正是在振武学校，他结识了同窗蒋介石，并深受同盟会反清思想的影响，主动加入了同盟会。武昌起义爆发后，他与同学一道投身辛亥革命。他于1916年毕业后回国，先是在上海短暂服务于陈其美，之后应王文华将军之邀前往贵州。他和王文华共同创办了一所军事学院，并组成了新黔系军阀。1921年，王文华在灾难性的民九事变中去世，他也被逐出贵州，转而加入唐继尧领导的滇系军阀，在昆明担任教官。\n\n1924年黄埔军校成立后，在蒋介石的坚持下，孙中山任命何应钦为总教官。1925年，何应钦率领黄埔学生军讨伐陈炯明，并夺取潮州、汕头，这标志着国民革命军取得了首次胜利。平定广东后，何应钦帮助国民革命军做好了发动北伐的准备。北伐期间，尽管何应钦率领国民革命军第一军英勇作战，但德国的干涉导致国民党北伐最终功亏一篑，何应钦只得率领第一军与国民革命军其他残部撤退至贵州。在贵州落脚后，何应钦成为了蒋介石总司令实际上的接班人。\n\n何应钦如今成为了“黄埔系”的领袖，该派系由他的心腹——土木系和蓝衣社组成。他渴望一场由军队发起、为军队服务的国民革命。在他眼中，只有国民革命军才能拯救中国，拯救国民党。§!\n\n§Y备注：虽然何应钦在黄埔圈子里被誉为蒋介石总司令的接班人，但他更像是一个追随者而非领导者，缺乏老友蒋介石身上所具有的威严。§!"
 YUN_wang_boqun: "王伯群"
 YUN_wang_boqun_sic_desc: "§Y生于：§!§L1885年9月12日；大清、贵州省兴义§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L王伯群是王文华之兄，与其他四名兴义学生一起被选拔，以公费留学日本。他先是考入宏文学院政治经济科，后转入中央大学，留日期间加入了同盟会，并结识了梁启超、孙中山和章太炎等人。辛亥革命后，他加入了章太炎组建的统一党，并担任一份宣传孙中山革命活动的报纸负责人，还曾参与《中华民国约法》的制定，后来由于厌恶袁世凯，于是辞官回到贵州，在地方政府任职。\n\n王伯群曾协助蔡锷返回贵州，并在护国战争中带头讨袁，最终迫使贵州护军使刘显世出逃云南。他还参与经营过各种矿业，后来加入孙中山的革命党（后成为国民党），并担任孙中山政府的交通部长。王文华在民九事变中身亡后，他收留了何应钦，并被孙中山任命为贵州省长，但未就任。后来，他在上海创办了大夏大学，并作为南北和谈代表陪同孙中山前往北京。孙中山逝世后，他先是出任段祺瑞执政府临时参议院议员，后来辞职回到上海，继续主持大夏大学。\n\n北伐失败后，何应钦将王伯群召回贵州，此后他一直高效地替何应钦的黄埔系打理民政事务。§!"
 YUN_liu_zhi: "刘峙"
 YUN_liu_zhi_high_command_desc: "§Y生于：§!§L1892年6月30日；大清、江西省吉安§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L刘峙出身一农民家庭，先后就读于多所军事学校，1911年曾短暂加入学生军和宪兵队，1912年重拾学业。李烈钧发出讨袁通电后，他南下参加了二次革命，后考入保定陆军军官学校，毕业后在岑春煊麾下粤军中积极参与护国战争，此后继续服役，1921年被陈炯明调往粤军总司令部，同年加入国民党，在江西与旧桂系作战，并在许崇智手下任职。\n\n刘峙受何应钦之邀，到当时刚刚成立的黄埔军校担任战术教官，并成为黄埔第一教导团团长，与何应钦、顾祝同、钱大钧、蒋鼎文等人结下深厚的手足情谊。他参加了两次东征战役，率部讨伐陈炯明，立下了赫赫战功。在平定刘震寰和杨希闵的叛乱后，他晋升为师长。\n\n中山舰事件期间，刘峙忠实地执行了蒋介石的命令。北伐战争期间，他被编入国民革命军第一军。德军直接下场介入后，他率领的第二师被调往广州救援，但未能扭转战局。撤往贵州后，他与顾祝同、蒋鼎文等人成为了何应钦黄埔系的核心人物。§!\n\n§Y备注：刘峙总是能逢凶化吉，并因此获得了“福将”的绰号。§!"
 YUN_gu_zhutong: "顾祝同"
 YUN_guan_linzheng: "关麟征"
 YUN_guan_linzheng_commander_desc: "§Y生于：§!§L1905年3月19日；大清、陕西省鄠县§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L关麟征原名关志道，出生于陕西农村一个普通农民家庭。儿时老师曾问他志向何在，关志道回答说：“希望将来当个连长。”关志道原本立志从军，却没有入伍机会。1924年，他听说孙中山在广州开办一所军官学校，秘密招生，便带着胡景翼签发的护照，与好友邓毓玟一同出发。由于护照的原主人叫吴麟征，因此他便改名关麟征。\n\n二人在途中遇到了革命元老于右任，于右任问二人为何想当兵，关麟征回答说：“当军官威风。”于右任被他逗笑了，便向二人解释何谓三民主义。之后关邓二人与杜聿明等人一起收到了于右任的介绍信，成功进入黄埔军校。不久后，关麟征加入国民党，全身心投入革命事业和国民革命军，并参加了何应钦领导的东征。关麟征在东征期间身受重伤，幸亏廖仲恺的悉心干预，才保住了左腿。\n\n尽管关麟征一直在邓演达等人的领导下，但他最终还是转向党内右翼，并在北伐战争期间在宪兵团服役。他除了在国民革命军中服役外别无二心，之后跟随日薄西山的国民革命军撤往贵州，并效命于何应钦领导的黄埔系，尽管黄埔系势力日渐衰退，但他的地位则步步提升。§!\n\n§Y备注：关麟征性格倔强、人称“关铁拳”。关麟征非常讨厌陈诚，与陈诚水火不容，他认为陈诚在军中的地位与其战场上的表现毫不相称。§!"
 YUN_zhang_lingfu: "张灵甫"
 YUN_zhang_lingfu_commander_desc: "§Y生于：§!§L1903年8月20日；大清、陕西省西安§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L张灵甫最初渴望成为一名知识分子，并于1923年考入北京大学历史系，但由于无力支付学费，从而转投了胡景翼的国民二军驻豫军官训练团。后在军中偶遇于右任，经其推荐南下广州，于当年考入黄埔军校第四期。\n\n张灵甫全方位接受了黄埔思想和教育，后被编入国民革命军第21师，任步兵排见习官，并在北伐战争中作为第一师的一员参战。北伐失败后，张灵甫跟随第一军且战且退至贵州，随后唐继尧勉为其难地为国民党残部提供了庇护。张灵甫在战后展现出了杰出的能力和主动性，并受到何应钦提拔，成为国民党军队中一颗冉冉升起的新星。§!"
 YUN_qian_dajun: "钱大钧"
 YUN_xu_tingyao: "徐庭瑶"
 YUN_xu_tingyao_high_command_desc: "§Y生于：§!§L1892年10月9日；大清、安徽省无为§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L徐庭瑶于1916年考入保定陆军军官学校第三期步兵科，毕业后入皖军担任见习军官，后任连长。1920年，他回乡担任小学教员，1922年加入粤军任连长、营长，由于在东征战役中表现英勇，被提拔为营长。1925年8月，许崇智所部被蒋介石改编为第一军第三师后，他出任该师第八团团长，并参加了北伐战争。国民革命军溃败后，他跟随第一军撤往贵州，并迅速升任为第二师师长，后又转任第四师师长。\n\n经过一段时间的反思后，徐庭瑶开始对机械化和摩托化战争的发展感到着迷，并请求何应钦允许他创办交通兵学校，为组建装甲兵部队做准备。尽管国民革命军进入三十年代后境况堪忧，但他仍希望有朝一日，自己率领中国装甲部队对抗军阀和帝国主义者的梦想能够实现。在此之前，他所能做的便是撰写阐述自己军事理论的文章，例如《机械化军备论》、《战车兵操典》、《机械化部队作战纲要》等，这些著作至今仍未出版。§!\n\n§Y备注：徐庭瑶对装甲兵团的热爱使他被称为“中国装甲兵之父”，能与他媲美的同辈只有杜聿明一人。§!"
 YUN_jiang_dingwen: "蒋鼎文"
 YUN_jiang_dingwen_commander_desc: "§Y生于：§!§L1895年1月25日；大清、浙江省诸暨§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L蒋鼎文自幼接受私塾教育，辛亥革命爆发后加入杭州学生军，次年入浙江陆军讲武堂深造军事。毕业后，他先后担任排长、连长，并于1917年赴广东参加孙中山领导的护法战争，后来被任命为参谋部中校副官。1922年，年仅27岁的他晋升为上校参谋。在担任过各种参谋职务后，他主动放弃职衔，进入黄埔军校任职，担任第二学生队区队长和军事教官。\n\n蒋鼎文有早起习惯，多被校长蒋介石所遇，留下良好印象。据说，在黄埔军校举行的一次野战演习中，蒋介石带着一位外国顾问一起观摩演习。顾问即席发问，蒋鼎文对答如流，令顾问惊叹不已。蒋鼎文参与镇压了广州商团事变，并参加了第一次东征，赢得了蒋介石的敬重。北伐期间，他仓促加入北伐军，参与了失败的武汉围城战，随后跟随第一军残部一路溃退至贵州。\n\n蒋鼎文是黄埔系中的新人，也是黄埔系的核心人物，对他的上司何应钦尽职尽责。§!\n\n§Y备注：蒋鼎文思维敏捷、行动迅速，深谙运动战之道，有“飞将军”之称。§!"
 YUN_gui_yongqing: "桂永清"
 YUN_gui_yongqing_high_command_desc: "§Y生于：§!§L1901年3月7日；大清、江西省贵溪§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L桂永清年少时与贵溪同乡一同被选拔赴日留学，在听说黄埔军校成立后回国，成为黄埔军校第一期学员。他参与了讨伐陈炯明的东征，是少数大肆劫掠民财的黄埔军人之一，并被李之龙尽收眼底。蒋介石闻讯后勃然大怒，下令处决桂永清，以警示其他黄埔军人，并要求贺衷寒担任刽子手。但由于桂永清与贺衷寒私交甚密，贺衷寒请来何应钦帮忙求情，恳求蒋介石刀下留人，从轻处罚，蒋介石最终网开一面。\n\n桂永清曾任国民革命军第一军特种大队营长，1926年北伐战争期间进入福建作战。龙潭战役失败后，他最终因表现不佳而被罢免。北伐战争失败后，他奇迹般地躲过一劫，随后逃往贵州，加入了一支远比他光荣的军队。\n\n桂永清求职心切，想利用自己的两栖作战经验，以及黄埔军校内部的关系，比如通过滕杰等人，让自己正式获得海军将官的军衔。虽然表面上看，由于国民党没有控制海岸线，这个职位毫无用处，但他只是希望国民革命军能给自己一份合适的工作。在那之前，他完全满足于继续服役所能带来的好处。§!\n\n§Y备注：桂永清极其懦弱，曾经拷打工团分子嫌疑人并挪用公款。他几乎没有任何海军经验，完全依靠与黄埔师兄弟的关系生存。§!"
 YUN_zhang_jingyu: "张静愚"
 YUN_zhang_jingyu_air_chief_desc: "§Y生于：§!§L1895年；大清、山东省高唐§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L张静愚起初考入清华留美预备学堂，准备赴美留学。然而随着世界大战突然爆发，他转而前往欧洲，在利物浦大学学习机械工程，并加入了中国国民党旅欧总支部，后于1922年被孙中山委派为中国国民党利物浦支部负责人。1924年回国后，他被调往黄埔军校，任中国国民党中央党部秘书。他先是担任教授部主任王柏龄的英文秘书，后来直接担任蒋介石的英文秘书。\n\n张静愚后来被任命为黄埔军校教导第2团党代表，参加了第一次东征，参与了少量战地工作。返回广州后，他先后担任石井兵工厂党代表，后任广东航空局业务处处长。1926年，他被任命为广州国民政府航空局局长，并兼任国民革命军总司令部航空处党代表和海军处党代表。\n\n国民党土崩瓦解后，张静愚继续担任党务和空军事务之间的调解人。尽管贵州空军目前规模很小，但他仍然希望实现空军现代化，并为中国国家空军奠定基础。§!"
 YUN_teng_jie: "滕杰"
 YUN_teng_jie_bio: "滕杰毕业于上海大学社会学系，拥有丰富的政治经验，且思想激进极端。自黄埔军官学校第4期步兵科毕业后，他作为一名普通士兵参加了北伐战争。任国民革命军总司令部总政治部科员期间，他逐渐对国民党与工团党的合作感到厌恶。\n\n北伐战争失败后，滕杰东渡日本，入明治大学学习政治经济，主攻政党政治，尤着意于政党组织之研究。他深切了解政党在现代政治中的重要作用，并认为要挽救中国时局，必须先从建党入手。他分析当时国民党的“内敌”一为地方军阀，一为工团党。前者非常脆弱，不难使其分化瓦解；而后者则判然不同。工团党不仅有武力，而且有主义、有组织、有策略，又有第三国际为依托。\n\n因此，为了对付工团党，滕杰主张建立一个全新的“万能的党组织”，并宣称：“我们如果不在组织效用上超越工团党，则决不足以在行动上战胜工团党；如果不求提高组织效用至于最高限度，则决不足以为革命之必竟全功作保证。”他还协助组建了国民党右派残余势力中如今被称为“蓝衣社”的组织，并担任国民革命军政治训练处少将处长。"
 YUN_teng_jie_leader_desc: "§Y生于：§!§L1906年1月25日；大清、江苏省阜宁§!\n§Y背景：§!§L$YUN_teng_jie_bio$§!"
 YUN_teng_jie_commander_desc: "§Y生于：§!§L1906年1月25日；大清、江苏省阜宁§!\n§Y派系：§!§n蓝衣社§!\n§Y背景：§!§L$YUN_teng_jie_bio$§!"
 YUN_liu_jianqun: "刘健群"
 YUN_liu_jianqun_sic_desc: "§Y生于：§!§L1902年；大清、贵州省遵义§!\n§Y派系：§!§n蓝衣社§!\n§Y背景：§!§L刘健群肄业于贵州省立专门学校，早年与何应钦结缘，后经胡忠相引荐进入黔军军法处，曾任黔军军法处长、军需处长，1925年任何应钦机要秘书。何应钦任黄埔军校总教官期间，他在何应钦身边担任教官，之后在东征军教导团、北伐军第一军中担任指挥官。\n\n后来，刘健群被任命为贵州省军事委员会政治训练处长，并开始撰写小册子《改组国民党的刍议》，提出了一系列理论，例如一切党员唯领袖之命是从，其组成人员以著蓝衣（因为中山装是用蓝灰色布料制成的）为标志。他与滕杰合作，协助成立了“蓝衣社”。他是蓝衣社中少数非黄埔出身的成员之一。\n\n刘健群在其政治训练班内灌输“一个党、一个主义、一个敌人”的口号，学生毕业后一律吸收为蓝衣社社员。通过散发蓝衣社的宣传单和小册子，他的组织已在国民革命军残部中形成了一股相当强大的力量。§!\n\n§Y备注：据说，刘健群认为所有成功的革命运动都受到了三民主义的影响。§!"
 YUN_li_shizhen: "李士珍"
 YUN_tang_jiyao: "唐继尧"
 YUN_tang_jiyao_bio: "被种种传说围绕的西南王唐继尧以秀才身份开启了仕途，并在考中科举后东渡日本，就读东京振武学校，不久后加入同盟会。从振武学校毕业后，他加入日本陆军实习，1907年升入日本陆军士官学校第六期深造，与孙传芳、刘存厚、李根源、李烈钧、程潜等人同期，次年毕业。回国后，他历任督练公所参谋处提调、云南讲武堂教官、陆军第十九镇管带等职。\n\n唐继尧是重九起义的主要策划者之一，曾率滇军驰援贵州，并于1911年被推为贵州都督。1913年，他参与镇压了二次革命，并接替蔡锷出任云南都督。1915年，他与李烈钧、蔡锷共同策划并发动了护国战争，后来又与护法军政府结盟，组建了靖国军，后于1921年被顾品珍推翻。\n\n1922年重掌云南后，唐继尧与陈炯明合作，共同反对北伐。孙中山逝世后，他曾试图夺取两广政权，但被李宗仁击退。1925年，他出任致公党副总理，并于1926年创建了民治党。1927年，他险些被政变推翻，但他坚持了下来，并在云南建立起了脆弱的权力平衡。在接下来的几年里，他一直维持着脆弱的平衡局面。"
 YUN_tang_jiyao_leader_desc: "§Y生于：§!§L1883年8月14日；大清、云南省会泽县§!\n§Y背景：§!§L$YUN_tang_jiyao_bio$§!"
 YUN_tang_jiyao_army_chief_desc: "§Y生于：§!§L1883年8月14日；大清、云南省会泽§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L$YUN_tang_jiyao_bio$§!\n\n§Y备注：尽管唐继尧致力于共和主义，但他仍饱受争议且被指责虚伪。他是一个带有浓厚军阀色彩的人。§!"
 YUN_tang_xiaoying: "唐筱蓂"
 YUN_tang_xiaoying_leader_desc: "§Y生于：§!§L1905年；大清、云南省会理§!\n§Y背景：§!§L唐筱蓂是唐继尧独子，虽然很少有人指望他能承袭父亲的政治声望，但他如今却成为了共和国总执政。他继承了父亲的衣钵，多年来一直是云南一位颇具影响力的民主人士。他曾被送往日本东京帝国大学经济系深造，归国时正值国家动荡之际。他此后尽职尽责地在唐家花园组织重要的民治党基层会议，并邀请周新民、潘大逵和姜亮夫等人协助推进民治党的组织建设工作。\n\n唐筱蓂创建了宪政学术研究会并担任会长，推动其父探索更民主的治理方式。他主张，在实行宪政和联省制之前，必须先赋予人民言论自由和个人自由，并允许组织政党，由此促成政府与反对派的合作。他也与中国民主同盟建立了紧密联系。\n\n作为民治党云南省党支部书记，唐筱蓂相当特立独行——他不仅与罗隆基、闻一多等民主人士建立了深厚联系，更与青年党保持着密切往来，因而有效弥合了在野党与当权者之间的政治分歧。他希望在担任总执政期间能够继续发挥这一作用。§!"
 YUN_tang_xiaoying_commander_desc: "§Y生于：§!§L1905年；大清、云南省会理§!\n§Y派系：§!§c民治党§!\n§Y背景：§!§L唐筱蓂是唐继尧独子，虽然很少有人指望他能承袭父亲的军事造诣，但他在回国后便被父亲授予了战地指挥权，这在滇军内部引起了很大争议。他曾被送往日本东京帝国大学经济系深造，归国时正值国家动荡之际。\n\n尽管唐筱蓂几乎没有接受过军事教育，但出于一片爱国之心，父亲的反对者们未能阻挡他参军报国的决心。这位未经实战检验的年轻将领正被众人以微妙目光审视，他们不禁好奇，这位经济学出身的将门之后能否展现出军事天赋。§!\n\n§Y备注：唐筱蓂是父亲民治党的政治组织者，经常在唐家花园里与新月社成员举行会议，甚至还曾邀请中国青年党的廖行超出席会议。§!"
 YUN_tang_jiyu: "唐继虞"
 YUN_tang_jiyu_sic_desc: "§Y生于：§!§L1890年；大清、云南省会泽§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L唐继虞是唐继尧胞弟，毕业于云南陆军讲武堂，1912年被兄长任命为贵州军警局局长。唐继尧出任云南都督后，他也回乡辅佐兄长，担任云南全省警务处处长兼警卫军司令。护国战争期间，他出访日本，并于1916年回国担任讲武堂堂长。\n\n1923年，唐继虞奉兄长之命进军贵州，救援刘显世，驱逐袁祖铭，随后出任贵州督办，刘显世任贵州军事善后会弁办。1925年，袁祖铭重掌贵州后，唐继虞撤军，奉兄长命令进军广西。\n\n在与新桂系的战斗中大败而归后，唐继虞被任命为云南陆军训练总监。在未遂的二六政变中，他坚定地与兄长并肩作战，集结部队对抗阴谋者。政变失败后，他再次成为了唐继尧的左膀右臂，尽管他身上的裙带关系引发了诸多非议。§!\n\n§Y备注：唐继虞与习自强、王洁修是结拜兄弟。§!"
 YUN_sun_du: "孙渡"
 YUN_chen_weigeng: "陈维庚"
 YUN_chen_weigeng_commander_desc: "§Y生于：§!§L1890年6月15日；大清、云南省会理§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L陈维庚1910年毕业于云南陆军小学堂，1912年考入云南陆军讲武堂第四期步兵科，次年毕业，1922年入日本陆军大学校第十五期，1926年担任云南剿匪总司令部总司令，二六政变后被唐继尧任命为滇西镇守使。\n\n1928年，陈维庚升任云南省政府委员兼省政府财政厅厅长，不久后辞职。此后他致力于研究中医，并开设“日月大药房”。§!\n\n§Y备注：陈维庚是一名热心的人道主义者，为推动加强军官医疗体系做出了杰出贡献。§!"
 YUN_tang_jilin: "唐继麟"
 YUN_tang_jilin_commander_desc: "§Y生于：§!§L1894年；大清、云南省会泽§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L唐继麟毕业于陆军第二预备学校和保定陆军军官学校第六期工兵科，后被分配到滇军中服役，1927年任云南陆军第二师师长，1928年任唐继尧的军事参议，1929年任云南戒严司令官，后任第七师师长。三十年代，他被任命为云南省政府委员，后升任昆明镇守使。§!"
 YUN_wang_jiexiu: "王洁修"
 YUN_wang_jiexiu_high_command_desc: "§Y生于：§!§L1892年；大清、云南省丽江§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L王洁修自幼刻苦读书，1909年入选昆明陆军小学，并于1911年参加重九起义，后来被编入唐继尧麾下，从此开启了长期效忠唐继尧的军旅生涯。他先是跟随唐继尧进军贵州，后又返回云南，被保送入云南陆军讲武学校第三期炮科毕业。1915年，他在蔡锷麾下参加了护国战争，经唐继尧呈请，被黎元洪提拔为炮兵中校。\n\n1919年，王洁修荣获多枚高级勋章，并与习自强和唐继虞结下深厚友谊，三人义结金兰。作为唐继虞的核心部下之一，他跟随唐继虞前往贵州，担任第一军军长。他奉命与胡若愚、龙云一同进攻广西，却险些遭白崇禧围歼。\n\n二六政变期间，王洁修摇摆不定，一度考虑投奔胡若愚帐下，但唐继尧的反扑让他继续坚定支持旧主。他精通炮术，是靖国军实际上的炮兵司令。§!\n\n§Y备注：王洁修是唐继虞和习自强的结拜兄弟。§!"
 YUN_wu_xuexian: "吴学显"
 YUN_wu_xuexian_commander_desc: "§Y生于：§!§L1887年；大清、云南省通海县§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L吴学显出身云南本地土匪。民国初年，因与匪首余英争霸水权，吴学显组成一支武装队伍，在与余家械斗中获得大量人枪，形成滇南一个强悍的地方武装集团。为了镇压吴学显，唐继尧派王洁修团和谭少卿团对其进行清剿，却无法制伏，反而越剿越多。1919年，唐继尧招抚了吴学显，二人喝生鸡血酒为盟。\n\n吴学显被招安后，将余英捕杀，并被委任为支队队长，参与护国战争，但却大败而归，腿部中弹。1920年末，顾品珍倒唐成功。吴学显部则分散潜伏，静待唐继尧回归。\n\n1922年，唐继尧回归云南，吴学显在其中立下头功，之后又击杀了顾品珍。之后吴学显随唐继禹、张汝骥率一同进军两广，却遭到击溃。二六政变中，吴学显在对抗叛军中立下大功。吴学显因其忠心耿耿而一路高升，并不断袭扰劫掠着蒙自派。§!"
 YUN_xi_ziqiang: "习自强"
 YUN_xi_ziqiang_commander_desc: "§Y生于：§!§L1894年；大清、云南省丽江§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L习自强是纳西族人，因学业优秀，体格健壮，被选送人云南陆军小学，后于1909年考入云南陆军讲武堂，毕业后参加了重九起义。1912年，他回到讲武堂继续学习，后参与护国战争、护法战争等革命运动，立下了赫赫战功并与王洁修结下深厚友谊。\n\n唐继尧认为习自强忠诚机智，王洁修办事认真，两人逐渐受到器重，成为唐继尧心腹。1919年，习自强出任近卫团团长，并被派往日本海军舰队受训，学习一年后返回云南，1922年随唐继尧到东南巡宣使署任参谋长。\n\n1923年，习自强在唐继尧任贵州督办期间，担任其参谋长。1925年，他任云南陆军讲武学校将校队工兵科长，后调任腾越镇守使司令部。在1927年二六政变的权力斗争中，他担任滇黔绥靖公署参谋长，成为唐继尧的得力干将之一。§!\n\n§Y备注：习自强是王洁修和唐继虞的结拜兄弟。§!"
 YUN_zhang_taiyan: "章太炎"
 YUN_zhang_taiyan_sic_desc: "§Y生于：§!§L1869年1月12日；大清、浙江省余杭§!\n§Y派系：§!§c民治党§!\n§Y背景：§!§L章太炎（章炳麟，号太炎）出身于一个富裕的书香门第。他是中国最伟大的维新派政治家之一，也是联省运动之父。在学术生涯小有所成后，他继续师从多位学者和思想家深造。1894年，他向维新派强学会捐款，并开始与康有为和梁启超通信。他应梁启超之邀担任《时务报》主笔，但仅任职四个月便卷入了一场关于儒家思想的争论。\n\n此后，章太炎与更为保守的维新派人士交往，并在1898年戊戌变法失败后流亡，在日治台湾担任记者。他同情康有为和梁启超，后在东京通过梁启超结识了孙中山，并开始积极致力于撰写反清文章。加入同盟会后，他积极鼓吹“革命之道德”，后于1909年与孙中山决裂。辛亥革命后，他曾短暂协助袁世凯，后被袁世凯囚禁，直至1916年袁世凯去世后才离开上海。\n\n1917年，章太炎与孙中山共同发起护法运动，并力劝唐继尧带头举义。由于反对南北和谈，他于1920年开始与熊希龄、章士钊等人共同倡导联省自治，并始终希望北洋政府即使在国民党的压制下也能改革进步。1926年，他协助成立了民治党，并成为了唐继尧最重要的思想引路人之一。§!\n\n§Y备注：作为联省运动的创始人以及最后一批维新派元老，章太炎的职业生涯堪称辉煌。§!"
 YUN_wang_dong: "汪东"
 YUN_wang_dong_sic_desc: "§Y生于：§!§L1890年；大清、江苏省吴县§!\n§Y派系：§!§c民治党§!\n§Y背景：§!§L汪东于1904年留学日本，先入成城学校；后入早稻田大学预科，毕业后入哲学馆，同时加入同盟会，担任《民报》撰述。1908年，他师从章太炎习文字学，成为章门四弟子之一。1910年，他回国参加辛亥革命，1912年担任《大共和报》撰述，并加入“南社”和反北洋组织。\n\n1913年，汪东出任北洋政府内务部佥事，1923年与章太炎等人在上海创办了《华国月刊》，1925年任江苏省长公署秘书，次年协助成立民治党，1927年受聘于中山大学任教授，但终未能出任。\n\n上海起义后，汪东前往云南大学，出任文学院院长。他被认为是章太炎思想的继承者，倡导中国宪政民主和联省民主。§!"
 YUN_wang_rongbao: "汪荣宝"
 YUN_wang_rongbao_advisor_desc: "§Y生于：§!§L1878年；大清、江苏省吴县§!\n§Y派系：§!§c民治党§!\n§Y背景：§!§L汪荣宝15岁时被保送南菁书院肄业，次年应朝考，入职兵部，1898年戊戌变法失败后请假回籍，入南洋公学为师范生，1901年赴日本留学，先后就读于早稻田大学和庆应义塾大学，主修法律和政治学。\n\n汪荣宝在东京参与创建青年会（一个类似同盟会的组织），逐渐转向改良思想，后回国为官。他是北京立宪派的核心人物和进步党成员，曾协助袁世凯推翻清朝统治。他曾担任临时参议院议员，后来又担任国会众议院议员、驻比利时公使、宪法起草委员以及凡尔赛和会全权代表。\n\n随后，汪荣宝出任驻瑞士公使，后于1922年转任驻日公使，最终于1932年因抗议上海起义而辞职。他是梁启超的同僚，致力于改良主义政治，并倡导以民治党为代表的宪政。§!\n\n§Y备注：汪荣宝是汪东的兄长，他们两人都是章太炎民治党的成员。§!"
 YUN_dong_ze: "董泽"
 YUN_dong_ze_advisor_desc: "§Y生于：§!§L1888年；大清、云南省云龙§!\n§Y派系：§!§c民治党§!\n§Y背景：§!§L董泽于1907年进入云南贡院的甲种农业学校，次年考取留日公费生，入东京同文书院，留日期间加入同盟会，辛亥年间回国投身革命，参与进攻南京总督府之役。回云南后，他担任蔡锷的秘书，后经蔡锷推荐赴美国留学。\n\n1912年，董泽考入哥伦比亚大学攻读政治、经济及教育各科，后回云南参加护国战争，任护国军都督府秘书兼驻香港联络总办，护国战争胜利后，1917年赴美攻读硕士学位。\n\n1920年回国后，董泽于1922年出任东陆大学筹备处处长，后兼任教育厅长。他聘请了多位知名人士到东陆大学任职，倡导学校民主管理，并推行多项进步的教育改革。1926年民治党成立后，他加入了民治党，并继续担任教育厅厅长。§!"
 YUN_xu_yun: "虚云"
 YUN_xu_yun_advisor_desc: "§Y生于：§!§L1864年；大清、福建省晋江县§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L虚云大师本名萧古岩，少年时就对佛法产生浓厚兴趣，一心出家修行。17岁时，其父为防止出家乃为其娶二妻，但他还是和自己的两个妻子一起在福州涌泉寺出家。20世纪初，虚云大师云游全国，四处拜访古刹，并于1911年斡旋上海佛教会与南京大同会的对峙。\n\n接着，虚云大师晋见孙中山，议定修改佛教会会章诸事宜。之后又前往北京去见袁世凯，并改组中国佛教会，成立中华佛教总会。后来他担任蔡锷的亲信和顾问，促成了1913年滇藏战争的和平解决，并于1920年重兴昆明的华亭寺。\n\n虚云大师深受唐继尧的尊重和钦佩，在唐继尧的小朝廷中也有一席之地，不管采不采纳，唐继尧总是会听听他的言辞。§!\n\n§Y备注：虚云大师生年不详，关于其出生年份的纪录上至上世纪四十年代，下至七十年代。§!"
 YUN_luo_longji: "罗隆基"
 YUN_luo_longji_bio: "罗隆基是新文化运动时期的知识分子和著名学者，素有神童之称。1913年，他进入北京清华留美预备学校，开启了求学生涯。1919年，他成为“一一·四运动”的学生领军人物。1921年，他远赴美国留学，先后进入威斯康星大学和哥伦比亚大学学习政治学。毕业后，他出于对英国著名学者拉斯基的敬慕而进入伦敦政治经济学院学习，成为拉斯基教授的得意门生，并获得政治学博士学位。\n\n1928年回国后，罗隆基在上海光华大学任教，创办《新月》杂志并担任主编。他为一本名义上是文学和散文分析期刊的刊物撰写政治文章，因而与徐志摩等更偏爱文学创作的同行关系紧张，并引发了不少不满。尽管如此，他仍然坚持在国内进行反对威权主义的斗争。\n\n1933年，罗隆基因其一直以来的争议险些被暗杀，随后被《益世报》开除，逃往内地。他倡导一种受英美作家和制度启发的人文主义、自由主义和现代保守主义的中国理念。他是新月社的非正式成员，新月社原本是他朋友的聚会，后来演变成一个政治平台。"
 YUN_luo_longji_leader_desc: "§Y生于：§!§L1896年7月30日；大清、江西省安福§!\n§Y背景：§!§L$YUN_luo_longji_bio$§!"
 YUN_luo_longji_advisor_desc: "§Y生于：§!§L1896年7月30日；大清、江西省安福§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L$YUN_luo_longji_bio$§!\n\n§Y备注：罗隆基是胡适的挚友。§!"
 YUN_cun_shusheng: "寸树声"
 YUN_cun_shusheng_bio: "寸树声幼年在家乡私塾读书，他学习勤奋，思想活跃，校长多次褒奖他的志向远大。1918年，他赴日本留学，先后在日本东亚预科、东京高等师范学校研究科和九州帝国大学文法学部经济系读书。\n\n寸树声获经济学学士学位毕业，并在留日期间，加入创造社。1928年，又参加由留日学生和台湾学生组织的社会科学研究会，任宣传部长，研究和宣传社会主义，曾指导过到东京留学的艾思奇自学哲学。随着外国势力不断入侵中国，他于1931年离日回国，到北平大学法商学院教书。\n\n在八省联合爆发起义并镇压知识分子之后，寸树声退居内陆，参加了邢西萍的《世界论坛》，又通过马叙伦等人加入了全救会。后来他受罗隆基邀请前往云南，成为了新月社左翼的中心人物。寸树声与新月社内的自由保守派关系并不融洽，一直渴望与社会主义者结盟，但他始终坚持维护团结。"
 YUN_cun_shusheng_leader_desc: "§Y生于：§!§L1896年9月25日；大清、云南省腾冲§!\n§Y背景：§!§L$YUN_cun_shusheng_bio$§!"
 YUN_cun_shusheng_advisor_desc: "§Y生于：§!§L1896年9月25日；大清、云南省腾冲§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L$YUN_cun_shusheng_bio$§!\n\n§Y备注：作为一名教师，他认为，对于背负着数千年传统枷锁的中国青年而言，近似斯巴达式的严格训练是必要且有益的。§!"
 YUN_su_honggang: "苏鸿纲"
 YUN_su_honggang_sic_desc: "§Y生于：§!§L1878年；大清、云南省晋宁§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L苏鸿纲自幼勤奋好学，被父亲教育要“推己及人”，无论遇到什么困难都要心存善念。父母的教诲伴随了他一生，深刻地影响着他的人生和思想。16岁中秀才后，他进入当地一所小学任教，后于1903年考入云南省高等学堂。1908年，他加入昆明的云武同学会，积极参与反清活动。辛亥革命期间，他致力于教育启蒙事业，并于1919年获教育部批准创办了一所私立学校。\n\n苏鸿纲的学校秉持关怀、体贴、平等的办学理念，将规模扩大到两个中学班、两个小学班，并增设一个初中部。作为校长，他培育了整整一代云南学子，却坚持不拿任何额外工资。\n\n随着众多学者退居内地，苏鸿纲开始与他们的改良派和进步派圈子交往，并成为西南地区新月社的非正式成员。但他不愿参与政治，而是更热衷于关注教育、社会问题和人权问题。§!\n\n§Y备注：苏鸿纲是闻一多和李公朴的挚友。§!"
 YUN_liang_shiqiu: "梁实秋"
 YUN_liang_shiqiu_advisor_desc: "§Y生于：§!§L1903年1月6日；大清、直隶省大兴县§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L1915年，梁实秋听从父亲的安排考入清华学校留美预备班，在校期间，与闻一多成为好友，并与创造社结下了短暂的友谊。一一·四运动中，梁实秋是学校运动积极分子。1923年，梁实秋赴美留学，在科罗拉多学院学习。1924年毕业后又前往哈佛大学，途中在芝加哥与闻一多、罗隆基、何浩若、吴景超等共同发起了民族主义（当时将Nationalist译为“国家主义”）作家团体“大江会”。\n\n在哈佛大学攻读研究生期间，梁实秋受到白璧德新人文主义的影响，并获得了哈佛大学英文系哲学博士学位。1926年回国后，梁实秋先后任教于国立东南大学、青岛大学并任外文系主任兼图书馆馆长、北京师范大学；1927年，他与徐志摩、闻一多创办新月书店，并任教于暨南大学。\n\n1927年到1936年间，梁实秋因其对阶级理论的批判立场和对现代保守主义的倡导，与鲁迅等左翼作家展开了一系列论战。上海起义爆发后，梁实秋迁往内地。§!\n\n§Y备注：梁实秋是胡适的挚友，两人曾就翻译莎士比亚的计划进行交流。\n鲁迅斥责他是“白璧德的门徒”。§!"
 YUN_wen_yiduo: "闻一多"
 YUN_wen_yiduo_sic_desc: "§Y生于：§!§L1899年11月24日；大清、湖北省浠水县§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L1910年，闻一多与堂兄们来到武昌求学，就读于两湖总师范学堂附属高等小学校。1912年，他以湖北籍第二名考入北京清华学校。闻一多喜读中国古代诗集、并在《清华周刊》上发表系列读书笔记，同时还创作旧体诗。一一·四运动中，闻一多积极参加学生运动，曾代表学校出席在上海的全国学联会议。\n\n1920年4月，闻一多发表了自己的第一篇白话文，以及第一首新诗《西岸》。1921年，闻一多从清华学校毕业，与徐志摩、梁实秋等人发起成立清华文学社，同年他开始系统地研究新诗格律化理论，并出版了颇受争议的《律诗的研究》。\n\n1922年，闻一多赴美国芝加哥艺术学院学习。1925年闻一多回国后，历任中山大学、国立北平艺术专科学校教授，并参与了李璜组建的反工团主义大学团体。之后他在国立青岛大学任文学院院长，并成为了新月书店的核心成员，但又因为学生暴动而被国立青岛大学开除。§!\n\n§Y备注：闻一多是一位浪漫主义者，也是中国最高产的诗人与教育家，他的诗歌极具民族主义精神。§!"
 YUN_ye_gongchao: "叶公超"
 YUN_ye_gongchao_advisor_desc: "§Y生于：§!§L1904年10月20日；大清、江西省九江§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L1918年，年轻的叶公超就读于天津南开中学，1920年他赴美留学，在马萨诸塞大学取得学士学位。后复转赴英国，1924年获剑桥大学文学硕士学位。离英后，再赴法国巴黎大学研究院研究。1926年归国，任北京大学英文系讲师。\n\n1927年，叶公超参与创办新月书店；同年任暨南大学外国文学系主任、图书馆馆长，并兼吴淞中国公学英国文学教授。1929年任清华大学外国文学系教授。上海起义爆发后，他与许多旧日的新月社同僚一同移居内地。§!\n\n§Y备注：闻一多尝戏谑的呼他为“二毛子”，意思是指他精通洋文而不懂国故。§!"
 YUN_he_haoruo: "何浩若"
 YUN_he_haoruo_army_chief_desc: "§Y生于：§!§L1899年3月16日；大清、湖南省湘潭§!\n§Y派系：§!§l新月社§!\n§Y背景：§!§L何浩若1913考入北京清华学堂，1920年赴美国斯坦福大学留学，1923年转入威斯康星大学，获得哲学博士学位，后转入诺维琪大学骑兵科，1926年回国任黄埔军校教员，北伐战争爆发后，任国民革命军第四十六军参谋长。\n\n何浩若巧妙地利用孙传芳阵营内联省派的阴谋，于1928年受聘于金陵大学担任教授，后于1932年受赵恒惕之邀，进入湖南省府任职。他在美国期间曾与“大江会”有往来，后来在新成立的新月社中与老同事们重逢。尤其值得一提的是，他是新月社中少数拥有军事经验的成员之一。§!"
 YUN_long_yun: "龙云"
 YUN_long_yun_bio: "龙云出身于一个保有奴隶制残余的彝族地主家庭，幼年未能读书启蒙，后与表弟卢汉一同被送到昭通城读书，并结识了邹若衡，三人结为兄弟，并称为“昭通三剑客”。后来，龙云曾短暂加入过川军和滇军，之后与卢汉一同返回昆明进入云南陆军讲武堂就读，毕业后被分配到当地的一个营。与李培莲成亲后，他作为唐继尧的侍从副官参加了护国战争，1916年又升任唐继尧的近卫军中队长，与唐继尧形影不离。\n\n1921年，顾品珍将唐继尧赶出云南后，龙云亲自护送唐继尧到广西，并于1922年率部为唐继尧夺回云南。1923年，他被任命为靖国军第五军军长。1925年，他再次率部为唐继尧效力，并与新桂系作战，但遭白崇禧部包围，险些丧命。\n\n1927年返回云南后，龙云深感为唐继尧东征西讨却徒劳无功，因而心生不满，于是与胡若愚、张汝骥、李选廷共同发动了二六政变，但由于其他将领忠于唐继尧而失败，被囚禁在昭通。此后，他将昭通及其治下地区打造成了云南的山巅之城，并通过他在滇系军阀中的关系，至今仍保持着举足轻重的影响力。"
 YUN_long_yun_leader_desc: "§Y生于：§!§L1884年11月19日；大清、云南省昭通§!\n§Y背景：§!§L$YUN_long_yun_bio$§!"
 YUN_long_yun_sic_desc: "§Y生于：§!§L1884年11月19日；大清、云南省昭通§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L$YUN_long_yun_bio$§!\n\n§Y备注：龙云首先是一位现代化倡导者。为了对抗唐继尧，他也因与第三条道路的民主人士交往而闻名。§!"
 YUN_lu_han: "卢汉"
 YUN_lu_han_bio: "卢汉是龙云的堂弟兼儿时好友，曾随龙云前往四川加入魏焕章部，之后参与了辛亥革命。1912年，他与龙云一同考入云南讲武堂第四期步兵科学习，1914年毕业后被分配到滇军任职。在护国战争中，他曾在蔡锷麾下服役，后在驻川滇军中担任排长。1920年滇军被逐出四川后，他在唐继尧督军公署当少校副官，并在顾品珍发动政变后坚决支持唐继尧。\n\n唐继尧东山再起后，卢汉成为唐继尧的近卫团团长，并在龙云麾下进入广西作战。1927年，走投无路的卢汉与胡若愚、张汝骥、李选廷和龙云合作，试图发动政变推翻唐继尧，但由于政变失败，被迫逃往昭通，困守孤城。他被认为是龙云最得力的下属。"
 YUN_lu_han_leader_desc: "§Y生于：§!§L1895年2月6日；大清、云南省昭通§!\n§Y背景：§!§L$YUN_lu_han_bio$\n\n卢汉与龙云反目成仇，部分原因是龙云任命唐继尧的亲信掌权，但更直接的原因是龙云试图独掌大权。这位大胆的将军随后又背叛了胡若愚，利用龙云旧部的资源夺取了政权。§!"
 YUN_lu_han_sic_desc: "§Y生于：§!§L1895年2月6日；大清、云南省昭通§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L$YUN_lu_han_bio$§!\n\n§Y备注：卢汉虽然是龙云的挚友和亲戚，但他并非绝对忠于龙云。§!"
 YUN_zhang_chong: "张冲"
 YUN_zhang_chong_high_command_desc: "§Y生于：§!§L1901年1月25日；大清、云南省泸西§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L张冲是彝族人，幼年时就读于当地县城的私塾，后来又进入了一所小学，自幼深受革命思想的熏陶，对农民和工人阶级怀有强烈的同情，并参加了当地民兵组织，与土匪作战。然而，由于他的反地主思想，导致他险些于1918年被捕。虽然他后来被迫落草为寇，但他更像一名豪侠义士，经常与土匪劣绅斗争，最终成为当地的民间英雄，并曾多次击退外省军阀。\n\n后来，张冲被唐继尧招入滇军，担任团长。他支持龙云、胡若愚、张汝骥和李选廷推翻唐继尧的政变，被推举为第五师师长，但由于政变失败，他被迫与其他龙云追随者一同流亡昭通。出于自身的亲民立场，他在昭通周边赈济民生、推行改革，致力于将昭通打造成一个模范县。§!"
 YUN_li_peiyan: "李培炎"
 YUN_li_peiyan_advisor_desc: "§Y生于：§!§L1886年；大清、云南省§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L李培炎是清末云南最后一科廪生，州考第一，曾在州官张汉皋下任职。1915年，他出任当地中学首任校长，深受当地民众爱戴。1917年，他当选为第二届省参议员，兼任陆良县厘金总办，但后来因贪污罪名被免职入狱。\n\n1922年，妹妹李培莲嫁给龙云后，李培炎获释出狱，并恢复职务，受云南盐运使袁嘉谷委任为开广边盐局长。1927年政变期间，李培炎坚决支持龙云。尽管他曾有机会竞选云南富滇新银行行长，但最终被调任为云南盐运使。他在宾川兴建了一批水利、教育、工业、卫生等设施，并在云南逐渐积累了财富和权力。§!\n\n§Y备注：李培炎与龙云有姻亲关系，是龙云的内兄。§!"
 YUN_li_peitian: "李培天"
 YUN_li_peitian_sic_desc: "§Y生于：§!§L1895年；大清、云南省宾居§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L李培天是李培炎之弟，毕业于云南省立第一中学，后赴日本早稻田大学攻读政治经济学，毕业后回国任教于北京政法大学，1921年回昆明，在市政督办公署任教育科长，1928年转任澄江县县长。\n\n1931年，李培天在上海集资创办“私立文化学院”，任院长。三年后，学校因财政困难而停办，遂返回昆明。此后历任云南县长训练所所长、民政厅长、云南省县行政人员训练团教育长、粮政局长、财政厅长，并多次得到龙云的资助。§!\n\n§Y备注：李培天与龙云有姻亲关系，是龙云的内兄。§!"
 YUN_lu_chongren: "陆崇仁"
 YUN_lu_chongren_advisor_desc: "§Y生于：§!§L1887年；大清、云南省巧家§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L陆崇仁是彝族人，早年考入云南法政学堂，毕业后任镇雄县承审员，后当选为巧家县省参议会议员。经同乡袁锡侯介绍，他于1922年被龙云任命为靖国军第五军军法官，后经龙云推荐，出任寻甸县知事，被当地人奉为英雄，当地士绅为其立碑纪念。\n\n调任昆明任第五军军法处长后，陆崇仁与龙云密切共事，甚至被龙云尊称为“表哥”。在云南财政厅工作期间，他坚持推行多项改革，但由于派系政治掣肘，导致许多改革措施未能得到积极推行。§!\n\n§Y备注：陆崇仁被描述为一个“极其内敛、沉默寡言的人”，并且是“地主官僚体系”中颇有权势且精明能干的成员。§!"
 YUN_zhang_banghan: "张邦翰"
 YUN_zhang_banghan_advisor_desc: "§Y生于：§!§L1885年；大清、云南省镇雄§!\n§Y派系：§!§g龙云派§!\n§Y背景：§!§L张邦翰于1905年入读云南高等学堂，肄业后选送越南南巴维学堂，1906年在河内加入同盟会，并跟随孙中山奔走于东南亚各国。他曾先后出任新加坡《中兴报》、香港《中国报》主笔，还参加了镇南关起义和河口起义，并与胡汉民合作，为革命者提供庇护。1909年，他前往欧洲学习应用科学，后奉孙中山之命回国。\n\n回国后，张邦翰被蔡锷任命为云南军政府外交司司长，后赴比利时考取电化工程师证书，1920年回国，历任耀龙电灯厂工程师、无线电报局局长、航空学校教官、云南大学理工教授等职。\n\n张邦翰曾协助唐继尧、董泽创办云南大学，后以外交司特派员身份，在国民党残部退往贵州时与之展开深入谈判，近年升任云南省建设厅厅长。§!\n\n§Y备注：张邦翰虽是滇系成员，但也同情国民党。§!"
 YUN_hu_ruoyu: "胡若愚"
 YUN_hu_ruoyu_bio: "胡若愚出身地主家庭，自幼入私塾读书，后毕业于地方国立小学，1910年考入云南陆军小学四期，次年参加重九起义，1912年离云南赴江西，在李烈钧部任职，二次革命前夕返回云南，1914年考入云南陆军讲武堂将校班，毕业后历任中队长、营长，护国战争期间参加了克复个旧战役。\n\n1918年，胡若愚奉命增援滞留四川的滇军，击败刘存厚，晋升为旅长，1920年顾品珍发动政变时，率部支持唐继尧，但转而前往广西与孙中山会师，从沈鸿英手中夺取桂林，并与逃往香港的唐继尧取得联系。他帮助唐继尧夺回政权，率领龙云和张汝骥击败顾品珍，并被授命为蒙自镇守使。\n\n在滇系接连遭遇战败之后，龙云于1927年试图发动政变推翻唐继尧，并与胡若愚合作，准备扶植唐继尧为傀儡督军，但唐继尧最终迫使龙云和胡若愚回到了谈判桌前。随着三十年代滇系退守内陆，胡若愚凭借蒙自与德属印度支那的联系以及本地丰富的矿产资源，巩固了自己在滇南的地盘。"
 YUN_hu_ruoyu_leader_desc: "§Y生于：§!§L1894年；大清、云南省罗平§!\n§Y背景：§!§L$YUN_hu_ruoyu_bio$§!"
 YUN_hu_ruoyu_sic_desc: "§Y生于：§!§L1894年；大清、云南省罗平§!\n§Y派系：§!§P蒙自派§!\n§Y背景：§!§L$YUN_hu_ruoyu_bio$§!"
 YUN_li_xuanting: "李选廷"
 YUN_li_xuanting_high_command_desc: "§Y生于：§!§L1881年；大清、云南省马关§!\n§Y派系：§!§P蒙自派§!\n§Y背景：§!§L李选廷是唐继尧麾下四镇守使之一，毕业于云南陆军讲武堂，曾参加重九起义，后随滇军参加援川战事，升任营长。1914年，他随部返回云南，任广南县、建水县知事，护国战争期间升任团长。\n\n1918年，李选廷直接进入云南督军公署任职，并于1919年出任云南第二卫戌区总司令部参谋长。1920年，他与滇南土匪发生冲突，后在顾品珍政变期间担任蒙自道尹兼蒙自地区匪指挥部参谋长。1922年，他因帮助唐继尧东山再起而升任大理镇守使，于1925年成为实际上的滇西军阀。\n\n随着唐继尧屡屡失策，李选廷曾与龙云、胡若愚、张汝骥等人合谋废黜唐继尧，但被唐继尧击败，他的大理地盘落入孙渡手中，他本人则被囚禁在蒙自。此后，他一直留任云南陆军宪兵司令部司令官。§!"
 YUN_zhang_ruji: "张汝骥"
 YUN_zhang_ruji_high_command_desc: "§Y生于：§!§L1896年；大清、云南省曲靖§!\n§Y派系：§!§P蒙自派§!\n§Y背景：§!§L张汝骥毕业于云南陆军小学堂、贵州陆军讲武学堂，后任云南陆军讲武堂学员队队附。他参加了重九起义，任云南军都督府警卫队排长，1912年随滇军参加援黔战事，1914年入贵州陆军讲武堂学习，1914年毕业返回云南。\n\n1915年，张汝骥任唐继尧公署警卫团连长，后参加护国战争，与龙济光交战。1921年顾品珍主政云南时，他继续在广西与沈鸿英交战。护法战争时期，他任北伐先遣军司令部前敌总指挥，1922年随唐继尧部滇军返回昆明。\n\n此后，张汝骥先后任靖国联军总司令部第四军军长，云南陆军宪兵司令部司令官，滇南镇守使等职，1923年又出任滇黔联军东南巡宣副使。随唐继虞进占贵阳后，他转任贵州军事善后督办公署会办，1926年在唐继尧主持下攻打广西，任滇东镇守使，后来与胡若愚、龙云、李选廷等人联手发动政变，企图废黜唐继尧。政变失败后，他与李选廷、胡若愚一起被囚禁在蒙自。§!"
 YUN_wang_weiyu: "王维玉"
 YUN_wang_ruwei: "王汝为"
 YUN_wang_ruwei_high_command_desc: "§Y生于：§!§L1894年；大清、云南省昆明§!\n§Y派系：§!§P蒙自派§!\n§Y背景：§!§L王汝为出身云南讲武堂（云南陆军讲武学校），曾参加重九起义，后在四川参加护国战争，在李选廷部任参谋。1916年，他考入云南陆军讲武学校第十一期步兵科。1918年毕业后，他在云南陆军中步步高升，并于1924年在广东服役期间被国民党政府指控试图协助陈炯明。\n\n返回云南后，王汝为将滇东南的马关地区据为己有。1927年，他担任当地重建专员公署参谋长。王汝为曾被指控招募当地土匪协助其控制文山和西畴两县，但最终未能控制这些土匪。据说，当他的兄弟背叛他时，他残忍地杀害了自己的兄弟。与此同时，龙云和张汝骥邀请他参与反唐政变，他接受了政变邀请。当龙云政变成功（不久后便失败）的消息传出后，王汝为慌忙逃走，最终成为了胡若愚蒙自派的一员，这或许是出于对自身安全的担忧，也可能只是纯粹投机行为。§!\n\n§Y备注：很难说王汝为到底是一名军官，还是割据一方的匪徒。§!"
 YUN_miao_yuntai: "缪云台"
 YUN_miao_yuntai_bio: "缪云台清末在昆明方言学堂英语班学习，1911年后入学留学预备班，并于1913年获官费赴美国留学。他在堪萨斯州西南学院学习矿冶专业，后来又进入明尼苏达大学学习，1918年毕业后在纽约供职钢铁公司。1919年，他回到云南，不久后被唐继尧任命为个旧锡务公司总理。当时，个旧锡务公司正处于亏损状态，他设法偿清了债务，并引入西方现代技术，使公司经营状况得到了极大的改善。\n\n1924年，缪云台担任云南富滇银行会办。1928年，他被任命为省农矿厅长兼省政府委员。1930年，他担任云南省整顿金融委员会委员长，1931年兼任云南劝业银行总经理。在继续担任实业厅厅长的同时，他还担任云南炼锡公司总经理，极大地提高了滇锡品质。\n\n1934年，缪云台出任富滇新银行行长，把以鸦片为中心的省金融体系变成以滇锡为中心的体系，而且富滇新银行发行的纸币的价值也被增强。他为云南地方工业发展作出了巨大贡献，是云南金融利益的首要代表。"
 YUN_miao_yuntai_leader_desc: "§Y生于：§!§L1894年3月23日；大清、云南省昆明§!\n§Y背景：§!§L$YUN_miao_yuntai_bio$§!"
 YUN_miao_yuntai_advisor_desc: "§Y生于：§!§L1894年3月23日；大清、云南省昆明§!\n§Y派系：§!§m云南总商会§!\n§Y背景：§!§L$YUN_miao_yuntai_bio$§!\n\n§Y备注：缪云台是无党派人士。§!"
 YUN_xu_zhichen: "徐之琛"
 YUN_xu_zhichen_advisor_desc: "§Y生于：§!§L大清、云南省§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L徐之琛是云南省府的核心人物，1916年奉命担任蔡锷麾下的蒙自巡察使，后在唐继尧麾下步步高升，先后出任外交司和财政司司长。广州军政府时期，他被派往广东作为唐继尧的眼线并收集情报，返回云南后仍留在省府任职。作为唐继尧派的核心人物、滇系军阀眼中的裙带关系受益者，他一直饱受争议，但事实究竟如何仍有待观察。§!"
 YUN_zhang_weihan: "张维翰"
 YUN_zhang_weihan_sic_desc: "§Y生于：§!§L1886年12月29日；大清、云南省大关§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L张维翰毕业于云南法政学堂，1908年入陆军第十九镇第37协担任随营学堂教师兼司令部秘书，重九起义期间投身革命，1912年加入国民党，后任云南省行政公署总务科科长、盐兴县知事、个旧县知事，为唐继尧手下官员。1915年，他加入护国军，在护国战争中抗击龙济光。\n\n1916年，张维翰前往四川担任四川督军公署秘书长，1917年返回云南，次年受唐继尧派遣，代表云南参加广州军政府，后赴日本帝国大学学习行政，1922年回云南任蒙自道尹，后任昆明市政公所首任督办。\n\n二十年代末至三十年代初，张维翰继续在云南省府任职，先后担任民政司司长和外交司司长。张维翰性格顺从、精明能干，因此受到了滇系军阀（主要是卢汉）大多数人的好评。§!"
 YUN_zhou_zhongyue: "周钟岳"
 YUN_zhou_zhongyue_sic_desc: "§Y生于：§!§L1876年10月17日；大清、云南省剑川§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L周钟岳是白族人，生于一个书香门第，在云南丽江应府试、大理应院试，都名列前茅，1900年肄业于大理西云书院后，在赵藩手下担任官吏，后随赵藩辗转湖南、四川。1903年，他获中式第一名举人，并公费留学日本，考入早稻田大学法政系。在云南任官期间，他积极抗议不平等条约。1911年返回云南后，他出任蔡锷的秘书长。\n\n周钟岳身兼数职，他如文人之阴，与蔡锷的军人之阳相得益彰。1915年，蔡锷离开北京发动护国战争，他竭力掩盖蔡锷行踪，帮助蔡锷安全抵达日本。1916年，他前往四川担任罗佩金的秘书长，后又进入唐继尧麾下任秘书长。1919年，他出任云南省代理省长，后升任省长。1922年，他出任唐继尧麾下的云南盐运使、枢密厅长兼云南省法制委员会会长。\n\n1926年，周钟岳出任云南省云南省内务司长，并曾短暂调解滇系军阀的内斗，不久后退休。1930年，他出任云南通志馆馆长，并编纂了云南通志。1934年，他被唐继尧召回，出任云南省民政司长。§!"
 YUN_li_wenyi: "李文宜"
 YUN_li_wenyi_advisor_desc: "§Y生于：§!§L1903年；大清、湖北省武汉§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L李文宜1924年毕业于湖北省立女子师范学校，1926年3月加入中国工团党，同月参加中国国民党，任国民党湖北省党部执委。她积极投身妇女解放运动，组织并领导了湖北省妇女协会的工作。她是工团党妇女委员会委员，于1928年出国留学，前往法国中山大学学习，并于三十年代回国担任工团党上海沪东区委委员。\n\n上海起义后，李文宜逐渐投身于“第三条道路”政治运动，非正式地与张君劢的再生社、新月社、乡村建设运动、政学系以及所有其他“第三条道路”的政党和协会保持着联系。她是中国女性争取平等斗争的领军人物，后来移居昆明，并以她在湖北的工作为基础，建立了云南省妇女组织。§!"
 YUN_lu_daoyuan: "鲁道源"
 YUN_lu_daoyuan_high_command_desc: "§Y生于：§!§L1900年；大清、云南省昌宁§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L鲁道源毕业于云南讲武堂第十三期步科，1922年至1927年在靖国军近卫第四团服役。升任营长后，他巧妙地游走于滇军各派政治势力之间，将自己定位为军中亲龙云、亲唐继尧的人士，并反对张汝骥和胡若愚的野心。1928年，他升任近卫第四团团长，同年晋升为少将旅长。\n\n二十年代末，鲁道源参加了多次小规模战斗。在滇军面临的多次严峻挑战中，他都展现出了非凡的智慧和勇气，并以在极其不利的情况下仍能保持钢铁般的意志而闻名。§!"
 YUN_liao_xingchao: "廖行超"
 YUN_liao_xingchao_bio: "廖行超在叔父的指导下从事诗歌创作，后于1911年毕业于昆明初级师范学校。辛亥革命爆发后，他投笔从戎，加入了学生志愿队敢死队，后来考入云南陆军讲武堂第四期步兵科，与龙云同期，二人后来结为挚友。1914年毕业后，他被分配到朱德麾下任职。在护国战争中，他因战功而于战后获得晋升。\n\n1918年，廖行超出任金汉鼎的参谋长，1920年在顾品珍政变中保持中立，1922年跟随杨如轩的滇军，开赴广东与陈炯明作战。1924年，他与廖仲恺义结金兰，但同年晚些时候出国前往法国留学，进入里昂大学历史系学习。留法期间，他结识了中国青年党创始人李璜和曾琦，并成为青年党思想的追随者。\n\n1925年回国后，廖行超因蒋介石的迫害而逃往越南，后于1927年前往日本留学。1935年回国后，他被任命为龙云的参谋长，但他与龙云派的关系并不密切。"
 YUN_liao_xingchao_leader_desc: "§Y生于：§!§L1895年2月12日；大清、云南省华宁§!\n§Y背景：§!§L$YUN_liao_xingchao_bio$§!"
 YUN_liao_xingchao_high_command_desc: "§Y生于：§!§L1895年2月12日；大清、云南省华宁§!\n§Y派系：§!§n青年党§!\n§Y背景：§!§L$YUN_liao_xingchao_bio$§!\n\n§Y备注：廖行超是龙云和金汉鼎的挚友。\n他被认为是中国青年党云南分部的领导人。§!"
 YUN_liu_xianqian: "刘显潜"
 YUN_liu_xianqian_commander_desc: "§Y生于：§!§L1864年12月28日；大清、贵州省兴义§!\n§Y派系：§!§L独立派系§!\n§Y背景：§!§L刘显潜是刘显世堂兄，出身官僚家庭，曾补县学生员，但因屡试不中而居家赋闲。1902年，他加入当地民兵组织，参与击退广西土匪，并被清廷擢升为管带。1911年，他被广西巡抚沈秉堃任命为广西边防军管带，后来又与堂弟刘显世积极合作，帮助革命军对抗清廷。\n\n唐继尧入主贵州后，刘显潜成为地方军阀，并在军中一路晋升。1915年护国战争如火如荼之际，他被迫加入了护国军。一十年代末，他卷入了贵州派系斗争，在民九事变后跟随堂弟迁往云南。1922年，他和堂弟刘显世以及袁祖铭一同返回贵州，但袁祖铭背叛了他们，他遂投奔唐继尧，力图重掌贵州大权。\n\n1923年，刘显潜与唐继尧一同推翻了袁祖铭，并于1924年出任代理贵州省长。1925年，他协助唐继尧入侵两广，但他的部队被新桂系击溃，贵州老巢也被袁祖铭再次攻占，最终只得宣布辞职，退居兴义。随着西南陷入战乱、国民党进驻贵州，他被唐继尧召回效力。§!"
 YUN_liu_peiquan: "刘沛泉"
 YUN_liu_peiquan_air_chief_desc: "§Y生于：§!§L1893年；大清、广东省南海§!\n§Y派系：§!§L中立§!\n§Y背景：§!§L刘沛泉于1910年报考增步习艺所，并在那里与陈策和张发奎结为好友，日后人们称此三人代表了中华民国陆海空三军。1915年，他在《觉醒日报》担任记者，报道美籍华裔飞行员谭根的飞行表演，后来成为谭根的秘书。1920年，他受唐继尧聘任，担任新成立的云南航空处处长兼航空学校校长、滇军总司令部高级参议。\n\n1922年，刘沛泉从广东招募了一批航空人员到昆明，并从香港订购了六架飞机，为云南空军的成立奠定了基础。1926年，他曾短暂担任国民革命军东路军航空司令，但由于国民革命军在战场上的失败，他最终投奔了滇军。1930年，他在中国航空公司筹备处任职，并于1933年组建了西南民用航空公司。§!"
 YUN_oversized_military_idea1: "臃肿的军事"
 YUN_oversized_military_idea1_desc: "虽然云南有着华南最优秀的军队之一，但显然省政府对于军事的过度关注是不可持续的。假使这样的政策延续下去，云南的普通民众与民用工业定会遭难。"
 YUN_oversized_military_idea2: "臃肿的军事"
 YUN_oversized_military_idea2_desc: "尽管省经济问题有了不少进展，但经济状况仍因先前的巨额军事开支而萎靡不振。然而，此情此景之下，政府实难再行削减军务之开支用度。倘若政治局势并无变数，云南人民则仍需咬紧牙关。"
 YUN_abysmal_economy_idea1: "糟糕的经济"
 YUN_abysmal_economy_idea1_desc: "滇、黔两省乃是中国最不发达的地区之二，更遑论贵州还实际位于民党之控制下，省政府缺少资金也实在不足为奇了。假使不进行认真的改革，现状并无改善之可能。"
 YUN_abysmal_economy_idea2: "崩溃的经济"
 YUN_abysmal_economy_idea2_desc: "随着黑色星期一的到来，云南本就脆弱的经济彻底地崩溃了——一夜之间，外资撤离，出口也杳无音信。如果不尽快采取措施，经济将陷入困境。"
 YUN_abysmal_economy_idea3: "停滞的经济"
 YUN_abysmal_economy_idea3_desc: "尽管许多黑色星期一之前就存在的问题，如今仍未解决。但至少现今的情况已经好过黑色星期一刚刚爆发之时。随着省政府最近的经济投资，云南经济似乎正在走向全面复苏。"
 YUN_abysmal_economy_idea4: "复苏的经济"
 YUN_abysmal_economy_idea4_desc: "在省政府近期的投入下，黑色星期一造成的损失已经大幅减轻。尽管云南落后经济中的系统性问题仍严重制约着经济增长，但毫无疑问云南经济摆脱欠发达现状的曙光就在眼前。"
 YUN_local_industrialisation_efforts: "进行本地工业化"
 YUN_local_industrialisation_efforts_desc: "在经济现代化的伟大追求中，滇黔两省也定然会身先士卒！黑色星期一尽管迟缓了这一事业的步伐，但也并非不可逾越的。只要穷尽激励、用尽手段，云南省也能步履蹒跚地走向现代化。"
 YUN_centralised_economic_development: "经济集中化发展"
 YUN_centralised_economic_development_desc: "自由市场资本主义除了在中国市场里造就了暴政之外，再也别无他用，除此之外就是为外来帝国主义提供了“投资”的粉饰，掩盖他们试图控制市场的真正企图。如果中国想要独立自主，就需要一种集中指令的经济思想，其可以保证国家发展的同时避免企业资本的冒进倾向。"
 YUN_industrial_economy_idea1: "崩溃的工业"
 YUN_industrial_economy_idea1_desc: "由于云南近年持续卷入地区冲突，本省的军国经济最终在极高的军费用度之下崩溃了。然而，随着华南大建设方略的启动，本省之工业全面复苏亦迎来了曙光。"
 YUN_industrial_economy_idea2a: "停滞的工业"
 YUN_industrial_economy_idea2a_desc: "随着[ROOT.GetName]近期的经济改革，华南的全面工业复苏取得了一定进展。幸运的话，我们的经济将成为问鼎天下的基石。"
 YUN_industrial_economy_idea3a: "复苏的工业"
 YUN_industrial_economy_idea3a_desc: "[ROOT.GetName]的进一步经济改革使得华南获得了急需的生产力。随着华南振兴，我们很快就能挥师北上，将我们的同胞从外来帝国主义及其走狗的压迫下解放出来！"
 YUN_industrial_economy_idea4a: "工业化经济"
 YUN_industrial_economy_idea4a_desc: "在[ROOT.GetName]的努力下，华南诸省的工业，自其因冲突与经济危机而崩溃以来已经完全复苏，我们的军队将很快可以挥师北上，承华夏之法统！"
 YUN_industrial_economy_idea5a: "振兴的工业"
 YUN_industrial_economy_idea5a_desc: "华南的工业能力强大得无以复加，[ROOT.GetName]也几乎准备好了问鼎天下。华南的工业将成为新政府对付外国走狗、消除军阀割据的基石。"
 YUN_industrial_economy_idea2b: "停滞的工业"
 YUN_industrial_economy_idea2b_desc: "国家不能继续军事化了。以往试图军事化来巩固权力的方法是行不通的：经济几近崩溃，平民百姓痛苦不堪。失去了民心，现代国家就一文不值。要不断强化建设与发展工作，让经济得到理性、平衡的增长，确保人民对国家的信任。"
 YUN_industrial_economy_idea3b: "复苏的工业"
 YUN_industrial_economy_idea3b_desc: "规划已经出台，工业建设已经启动。政府承诺在工业各方面进行大规模的发展、改革与现代化。然而，政府要兑现这些承诺，仍旧是任重道远。"
 YUN_industrial_economy_idea4b: "工业化经济"
 YUN_industrial_economy_idea4b_desc: "经济搭上了工业的便车，让我国得以与世界其他地区一较高下。随着时间的推移，过去的工业废墟也将成为遥远的记忆。"
 YUN_industrial_economy_idea5b: "振兴的工业"
 YUN_industrial_economy_idea5b_desc: "我国已然转型成为一个工业强国。向着现代化迈进的步伐愈发稳健，而其他国家仰望我们成就之时也更为敬畏、艳羡。愿中华繁荣万万年！"
 YUN_agrarian_economy_idea1: "崩溃的农业领域"
 YUN_agrarian_economy_idea2a: "羸弱的农业领域"
 YUN_agrarian_economy_idea2a_desc: "中国农民正努力应对着华夏大地上的百般乱局，不得不面临着农田的毁坏、列强的倾轧。这种不公正的竞争只会让帝国主义收益。许多农民都祈祷这样的乱局尽快画上句号。"
 YUN_agrarian_economy_idea3a: "复苏中的农业领域"
 YUN_agrarian_economy_idea3a_desc: "形势已经稳定，农业终于开始迈向复苏。然而，这只是朝着正途的一小步。政府需要不遗余力，确保能够实现全面的复苏。"
 YUN_agrarian_economy_idea4a: "复苏后的农业领域"
 YUN_agrarian_economy_idea4a_desc: "得益于政府的计划何人民的辛勤努力，农业领域终于迎来了复苏。干旱和毁灭性的歉收不至再让全国陷入饥馑，而农民也不必再使用过时的农技和设备了。"
 YUN_agrarian_economy_idea5a: "革命的农业领域"
 YUN_agrarian_economy_idea5a_desc: "农业领域确实发生了革命性的变化——从彻头彻尾的崩溃一路成为了人民的骄傲。在屡次现代化、改革和理念创新后，如今国家的粮仓属实令人叹为观止。"
 YUN_agrarian_economy_idea2b: "羸弱的农业领域"
 YUN_agrarian_economy_idea2b_desc: "农业领域一片混乱。农具和农技都严重过时，田野尽毁，哀鸿遍野。此情此景实在令人不忍卒读！政府必须掀起志存高远的农业发展热潮，让农村免遭灭顶之灾。"
 YUN_agrarian_economy_idea3b: "复苏中的农业领域"
 YUN_agrarian_economy_idea3b_desc: "在政府实施了数个备受瞩目的项目后，农业终于迎来了复苏。虽然农业不再一团乱麻，但距离全面复苏仍然任重道远。"
 YUN_agrarian_economy_idea4b: "复苏后的农业领域"
 YUN_agrarian_economy_idea4b_desc: "农业已经全面复苏。农民们以前所未有的热情辛勤耕耘、喜悦丰收。政府会不遗余力地确保农业持续增长——而这仅仅是一个开始。"
 YUN_agrarian_economy_idea5b: "振兴的农业领域"
 YUN_agrarian_economy_idea5b_desc: "农业领域走向全面振兴，达到了过去只有天方夜谭中才敢想象的繁荣水平。随着粮仓的重振，国家和人民将会自信地迈向未来。"
 YUN_militarised_state_idea1: "腐朽的军事"
 YUN_militarised_state_idea1_desc: "与其他强国相较，我军之情状实在令人汗颜。他国军队纪律严明、力量强大，而我军士兵却个个都是初入行伍，以抗命不从而闻名于外。"
 YUN_militarised_state_idea2a: "贫弱的军事"
 YUN_militarised_state_idea2a_desc: "华南如今强敌环伺，必须要有御敌自保之力。为实现此目标，我国正对社会与经济进行全面的军事化，使得羸弱之军力真正振兴，确保安靖外患，以优势之力量克敌制胜。"
 YUN_militarised_state_idea3a: "部分军事化"
 YUN_militarised_state_idea3a_desc: "对于经济的全面军事化的终极目标，当下已经初见成效，就连对我社会最为满腹狐疑的人也渐渐接受这个事实。虽然人口压力在不断增加，但民众皆要明白，此等转变实乃利大于弊。"
 YUN_militarised_state_idea4a: "军事国家"
 YUN_militarised_state_idea4a_desc: "政府终于实现了真正的军事国家，而敌人也很快会为之颤抖。很快，我们会消除一切威胁，朝着以往未曾敢于设想之目标大步向前。"
 YUN_militarised_state_idea5a: "复兴的军事国家"
 YUN_militarised_state_idea5a_desc: "军事国家有着比想象中更为可怕的力量。复兴的南方军实乃一股不容小觑的力量，军国民主义的成就也无可否认。"
 YUN_militarised_state_idea2b: "臃肿的军事"
 YUN_militarised_state_idea2b_desc: "军事至上的思想大行其道，几乎让我国走向了毁灭的边缘。民生多艰，如若不立刻做出巨大改变，恐怕吾国吾民再无翻身之日。"
 YUN_militarised_state_idea3b: "昂贵的军事"
 YUN_militarised_state_idea3b_desc: "尽管整顿腐败方面取得了一定进展，但军事支出仍然居高不下，耗损着预算。实话说，政府以至于人民都将大受其害。这一问题亟待解决。"
 YUN_militarised_state_idea4b: "平衡的经济"
 YUN_militarised_state_idea4b_desc: "随着预算平衡，军务的冗余开支也彻底革除，政府终于可以恰当地偿还债务。虽然前路漫漫，但政府已经兑现了裁撤臃肿开销的诺言，赢来了人民的尊重。"
 YUN_militarised_state_idea5b: "健康的经济"
 YUN_militarised_state_idea5b_desc: "政府和民众耗费了巨大的时间和努力，终于让经济迈上了正规。在终结了甚嚣尘上的军事至上风气，并开展了几个发展项目后，经济似乎出现了奇迹，并彻底走出了泥潭。"
 YUN_national_defence_economy_idea: "国防经济"
 YUN_national_defence_economy_idea_desc: "在漫长而艰辛的过程后，经济终于为国防而彻底军事化，而举国之力将压倒一切可能的敌人。没有任何人可以阻碍我政府之凌云壮志！"
 YUN_economic_stability_idea: "经济稳定"
 YUN_economic_stability_idea_desc: "经济业已稳定，民众欢欣拥戴。连年失业、贫困、饥荒这样的日子将一去不复。或许，只是或许，百年国耻也终将洗雪，至少也能洗雪掉一小部分。"
 YUN_rising_dragon_idea: "龙腾四海"
 YUN_rising_dragon_idea_desc: "中国再一次屹立于世界之林！民众一齐大步迈入工厂和田野，让国家比以往更为强盛——如一条巨龙，再次腾跃于四海九州！"
 YUN_awaken_tiger_idea: "猛虎哮谷"
 YUN_awaken_tiger_idea_desc: "中国正以前所未有的良好与健康的状态屹立于世界！人民正回归安稳的生活，百年甚至更久远的国耻也将一并洗雪。也许未来几年，中国人民可以安享这个世纪的繁荣。"
 YUN_revolutionary_economy_idea: "革命经济"
 YUN_revolutionary_economy_idea_desc: "三民主义已经深入群众的内心，并渗透到日常生活之中。如若没有孙文的愿景和三民主义的思想，人们就会被冷酷无情的军阀与帝国主义者所控制，并被他们剥削来牟取私利。因此，民众已经成为了新式革命与强大中国事业的先锋队。"
 YUN_reformed_state_idea: "焕然一新的国家"
 YUN_reformed_state_idea_desc: "中国民众在新中国已经有了享受现代生活的权利。看齐西式社会的改革纷纷落地，很快，妇孺稚子将不必再被迫行乞、被迫反目。他们可以安享一个更为光明的未来。"
 YUN_state_intervention_idea: "国家干预"
 YUN_state_intervention_idea_desc: "随着近日的局势，国家干预经济已成为必然。政府会保持密切关注，确保国家经济稳定。"
 YUN_reducing_foreign_reliance_idea: "减少外国依赖"
 YUN_reducing_foreign_reliance_idea_desc: "百年国耻使得外来帝国主义如恶性肿瘤般遍布中国。现在，我们已经掌握了必要的手段，是时候与之斗争了。中国经济要重新造福中国人！"
 YUN_rail_spree_idea: "铁路热潮"
 YUN_rail_spree_idea_desc: "政府宣布将进行全国范围内的铁路大建设，以此来改善区域间的联系、使各地的贸易更加轻松，并促进经济的增长。"
 YUN_promoting_light_industry_idea: "鼓励轻工业"
 YUN_promoting_light_industry_idea_desc: "本计划着眼发展与现代化之需求，推行民族轻工业。令民众知晓即便最分散之产业也不会被发展规划所遗忘。"
 YUN_promoting_foreign_investment_idea: "鼓励外国投资"
 YUN_promoting_foreign_investment_idea_desc: "通过利用广州这个中国最重要的贸易中心之一，我们可以大规模促进本地区的外资投资和城市化，从而使经济发展处于领先地位。"
 YUN_friendly_but_free_idea: "和而不同"
 YUN_friendly_but_free_idea_desc: "尽管外国的投资无疑对我们的经济至关重要，但我国必须慎之又慎，确保不会再次陷入对外来帝国主义列强的经济依赖。"
 YUN_neighbourly_cooperation_idea: "邻省合作"
 YUN_neighbourly_cooperation_idea_desc: "滇、粤两省的贸易往来更胜以往，这对于两地经济增长大有裨益。我国在两省的商贾们携手并进，共建国家美好未来。"
 YUN_economic_integration_idea: "经济一体化"
 YUN_economic_integration_idea_desc: "随着广州与昆明间经济合作的一体化水平不断提升，经济也迎来了前所未有的增长。国民也自然会为了两地间延绵不绝、繁荣昌盛的贸易新纪元，及其所来带来的一切而感到欢欣鼓舞。"
 YUN_land_to_the_tiller_idea: "耕者有其田"
 YUN_land_to_the_tiller_idea_desc: "耕者令土地尽其所用、持续发展，因而鼓励地主将地产出售给劳作的耕农，不仅可以让经济更加健康，也能够令耕者得到利润，从而让国民更加喜悦。"
 YUN_selling_tea_and_silk_idea: "营售丝与茶"
 YUN_selling_tea_and_silk_idea_desc: "中国自上古以来就以其丝与茶闻名，而丝绸和茶叶也逐渐成为了世界上交易量最大的大宗商品之二。先前罗马人就喜欢从丝绸之路远渡中亚的丝绸，而英国海军也迷恋我国的茶叶。继续出口这些商品也自然是题中之义了。"
 YUN_stocking_grain_idea: "广积粮"
 YUN_stocking_grain_idea_desc: "饥馑乃是发展的障碍。因此农民要将收获的余粮囤积起来以备将来，预防各类可能的灾害，让中国的家庭不受饥寒交迫之苦，让子孙后代不必经历饿殍遍地的状况。"
 YUN_dual_policy_idea: "双管齐下"
 YUN_dual_policy_idea_desc: "政府开始了双管齐下的政策：一面为拥有私产的地主提供税收减免，一面为政府项目注入资本。"
 YUN_national_revolution_idea: "国民革命"
 YUN_national_revolution_idea_desc: "国民革命的理念如今驾驭着一切：人们全心全意践行三民主义，用这孙中山先生留给中国最为宝贵的财富来实现他对中国的愿景。而经济同样高速发展，成为国家和谐的关键。如今的经济不再为外来帝国主义者与租界服务，而是为了中国及广大民众的富足繁荣而服务，以确保能如孙中山先生所期冀的——三民主义得以最深刻的贯彻。"
 YUN_party_state_finance_idea: "党国之金融"
 YUN_party_state_finance_idea_desc: "随着党国的复兴，金融业正以前所未有的速度飞速发展。作为伟大革命使命的一部分，国民党为了中国与民众时刻确保金融的稳定。"
 YUN_union_of_class_and_society_idea: "阶级与社会的和谐"
 YUN_union_of_class_and_society_idea_desc: "古代中国乃有四民之说：所谓四民者，士、农、工、商也。倘若政府治理得当，则四民均、百姓宁，为了社会与国家而良好协作。中国自身就有得天独厚的优势，即便不进行阶级斗争，也可以开展以阶级为纲的革命。如果要重振阶级与社会中的和谐，我们就必须重振邻里与工作场所中的爱人自爱之精神。"
 YUN_achieving_minsheng_idea: "实现民生主义"
 YUN_achieving_minsheng_idea_desc: "中国革命之终极目标，乃至于驱动历史之动力，都在于追求”民生“二字。民族主义与民权主义都要最终服务于国家为民众实现民生的责任。民生主义与工团主义、社会主义不同，强调动用各阶级的革命力量来遏制单一阶级的扩张，使得公权力得以消除阶级的概念。"
 YUN_national_health_administration_idea: "国民健康署"
 YUN_national_health_administration_idea_desc: "作为卫生部长的心血，国民健康署是一项高效而主动的全国卫生事业的大胆尝试。志向高远的三年计划已在实施，国民健康署也会以乡村医疗站及诊所的形式大力扩展其医疗部门，极大提高我国民众生活水平。而妇女儿童健康则是重点关注的工作，以便为乡村地区提供急需的医疗物资和女性医疗条件。"
 YUN_the_new_life_movement_idea: "新生活运动"
 YUN_the_new_life_movement_idea_desc: "如今国民政府已然掌控全国、完成北伐，我们必须以重提孔孟道德、治疗个人陋习的方式来复苏民族能量。我们所提的是面向大众的儒学，故而没有晦涩的思辨，只保留其纲常伦理，用这种儒家口号来确保推行儒家四维，即礼义廉耻。同时以所开九十六条来规范日常行为，令中国人要守时、穿好衣、站得直、吃嚼勿出声等。若想复兴民族、重振心气，我们须谈的不是长枪大炮，而是坚持冷水洗脸。倘如此，我们定能令民众由内而外焕然一新，造就一个崭新的社会、强盛的民族。"
 YUN_daughters_of_a_new_china_idea: "新中国的女儿们"
 YUN_daughters_of_a_new_china_idea_desc: "国民革命不只是一场反帝革命，更是一场致力于鼓舞全体受压迫大众的、文化与社会意义上的革命。正如妇女撑起半边天，她们在国民革命中的作用不可或缺。可长久以来，中国妇女因西方的散漫道德和恶习陷入了堕落的困境，这理应凭借新的政党统治制度来解决。我们应该鼓励妇女群体恪尽职守，担起重担，支撑起清白的、革命的家庭，也鼓励她们积极参与战争。"
 YUN_provisional_constitution_crisis_idea_1: "《训政时期约法》问题"
 YUN_provisional_constitution_crisis_idea_1_desc: "国民党统治圈子中，何应钦主席的支持者和胡汉民领导的反对派愈发分裂，针对着拟议的《训政时期约法》之态势也日渐紧张。人们对于本党之未来方向愈发感到不确定，委员长能否撑过这次危机也犹未可知。"
 YUN_provisional_constitution_crisis_idea_2: "《训政时期约法》危机"
 YUN_provisional_constitution_crisis_idea_2_desc: "国民党执政当局内部在《训政时期约法》问题上的分歧日益扩大，最终导致了胡汉民被捕，何应钦则在紧随其后的动乱中被迫辞职，党国陷入了混乱之中。相互矛盾的政令和愈演愈烈的内斗使政府几近瘫痪、军队士气低落。"
 YUN_GXC_war_morale_idea_intro: "滇桂两省间爆发冲突，重燃1925年的战火。滇军要想平桂震粤，就必须主动发起进攻，夺取关键城市，才能在士气低落之前维持住攻势。"
 YUN_GXC_war_morale_idea_1: "滇桂战争：全面崩溃"
 YUN_GXC_war_morale_idea_1_desc: "$YUN_GXC_war_morale_idea_intro$\n\n滇军已到崩溃边缘！连战连败勾起了人们对过去失败的不愉快回忆。若不能迅速扭转战局，滇军就将一败涂地！"
 YUN_GXC_war_morale_idea_2: "滇桂战争：士气低落"
 YUN_GXC_war_morale_idea_2_desc: "$YUN_GXC_war_morale_idea_intro$\n\n滇军总指挥部已不再期望能速战速决，而随着士兵们对战争愈发不满，这种消极思想也蔓延到了军队下层。滇军必须尽快扭转局势！"
 YUN_GXC_war_morale_idea_3: "滇桂战争：士气动摇"
 YUN_GXC_war_morale_idea_3_desc: "$YUN_GXC_war_morale_idea_intro$\n\n滇军战局不利，未能尽早攻占南宁并给予桂系致命一击，这使得滇军已不太可能速战速决。人们正越来越担心战争陷入长期化。"
 YUN_GXC_war_morale_idea_4: "滇桂战争：士气高昂"
 YUN_GXC_war_morale_idea_4_desc: "$YUN_GXC_war_morale_idea_intro$\n\n滇军士气高昂，将士们信心满满。但广西地形崎岖，桂系顽强抵抗，滇军要想获胜就必须超常发挥。"
 YUN_GXC_war_morale_idea_5: "滇桂战争：护国军魂"
 YUN_GXC_war_morale_idea_5_desc: "$YUN_GXC_war_morale_idea_intro$\n\n战局已完全倒向滇军，通往广州的道路畅通无阻！"
 YUN_autonomous_armies_level0: "各军自行其是"
 YUN_autonomous_armies_level0_desc: "尽管唐继尧极力虚张声势、招兵买马、耀武扬威，但他对云南省内军阀力量的控制实则脆弱不堪。早在二十年代初被顾品珍推翻后，唐继尧的势力便再未恢复，他对麾下军队的掌控也日渐松动。随着唐继尧日益依赖土匪武装，加之龙云、胡若愚等心腹将领逐渐离心离德，昔日威震四方的滇军如今已是岌岌可危。各地驻军指挥官与将领依仗个人忠诚，将各自为政的部队视作私人领地，不再真正效忠这位省督。当混乱已成常态，这位昔日的“西南王”现已沦为“昆明王”——甚至连这一名号也有争议。"
 YUN_autonomous_armies_level1: "各军自行其是"
 YUN_autonomous_armies_level1_desc: "$YUN_autonomous_armies_level0_desc$"
 YUN_autonomous_armies_level2: "各军自行其是"
 YUN_autonomous_armies_level2_desc: "$YUN_autonomous_armies_level0_desc$"
 YUN_legacy_of_the_huguojun_level_1: "护国军的传承"
 YUN_legacy_of_the_huguojun_level_1_desc: "护国军是中华民国对抗帝制野心的伟大救星。当袁世凯背信弃义，企图践踏宪法并撕毁辛亥革命来之不易的成果，自称洪宪皇帝时，是那些勇敢的云南领导人站出来坚决反对他的独裁统治。梁启超、蔡锷、唐继尧、李烈钧、杨森……正是这些英勇无畏的当代中国英雄不畏艰险，战胜了吴佩孚、曹锟、冯玉祥等人。\n\n毫无疑问，若没有训练有素、活力四射、甘于奉献的云南讲武堂毕业生，他们是不可能如此迅速而坚定地取得英勇胜利的。如今国家又一次面临风云激突，云南的领导人必须再次为救亡图存而进军。在护国军时代的光辉岁月里，滇军靠的不是精良的装备，而是出色的训练与优秀的指战员。因为毫无疑问，虔诚热忱的军国主义战士精神足以战胜装备最为精良的军队。"
 YUN_legacy_of_the_huguojun_level_2: "护国军的传承"
 YUN_legacy_of_the_huguojun_level_2_desc: "$YUN_legacy_of_the_huguojun_level_1_desc$"
 YUN_legacy_of_the_huguojun_level_3: "护国军的传承"
 YUN_legacy_of_the_huguojun_level_3_desc: "$YUN_legacy_of_the_huguojun_level_1_desc$"
 YUN_rejuvenation_of_national_struggle_level_1: "复兴国民革命斗争"
 YUN_rejuvenation_of_national_struggle_level_1_desc: "随着国民党重夺权力，国民革命军也焕发第二春。在党和黄埔各派的影响下，基于北伐失败与现实情况的军事变化应运而生。然而敌军装备精良、补给充足、人数众多，远胜于革命军。因此本军只能发挥最大的特长：中国民众本身。国民革命军得以发动人民战争，引导民众的怒火烧往敌军。\n\n凭借着来去如风的非正规军部队，结合游击战争的力量，动用一切手段为交战创造有利的条件。他们所推崇的并非仅仅控制一城一乡，而是赢得一场彻底的胜利。革命军极力避实击虚，并以机动战术来操纵对手。"
 YUN_rejuvenation_of_national_struggle_level_2: "复兴国民革命斗争"
 YUN_rejuvenation_of_national_struggle_level_2_desc: "$YUN_rejuvenation_of_national_struggle_level_1_desc$"
 YUN_rejuvenation_of_national_struggle_level_3: "复兴国民革命斗争"
 YUN_rejuvenation_of_national_struggle_level_3_desc: "$YUN_rejuvenation_of_national_struggle_level_1_desc$"
 YUN_vanquishing_personalism_idea: "摆脱个人主义作风"
 YUN_vanquishing_personalism_idea_desc: "我们的机构和军队中，堕落、衰朽、腐败之风盛行。所有军阀的军队都难逃这一命运，滇军的官僚以为就凭微乎其微的约束就可以免受其侵蚀。而军队的现状就足以表明，我们的状态江河日下。为摆脱这种腐败风气，我们必须再次重新实施频繁的指挥官轮换，在昆明开展继续教育和学习，精简我们的高级指挥人员，将当初只是为安抚其政治野心而提拔的军官撤职。"
 YUN_kunming_military_academy: "云南陆军讲武学校"
 YUN_kunming_military_academy_desc: "云南陆军讲武学校（云南讲武堂）于1909年始办，由云贵总督王文韶委任胡景伊着手负责。首任总办为高尔登，校监则是李根源。李根源接任总办地位巩固后，他模仿日本陆军士官学校开设课程。凭借吃苦在前的精神和繁重全面的训练，该校为军阀混战时代培育了一大批优秀的人才，也故而被视作中国“三大讲武堂”之一。\n\n云南陆军讲武学校以“坚忍刻苦”为校训，声名远扬各地，甚至得到了保定军校、黄埔军校等友校的盛赞。其训练内容注重“尚武”的教育内容，以军事学、操练和野外训练为主。开步兵、骑兵、炮兵、工兵、辎重兵五科。其知名校友和教员包括蔡锷、唐继尧、李烈钧、李根源、刘存厚、杨杰、朱德、朱培德及龙云等人，不一而足。"
 YUN_kunming_military_academy_level_2: "云南陆军讲武学校"
 YUN_kunming_military_academy_level_2_desc: "$YUN_kunming_military_academy_desc$"
 YUN_kunming_military_academy_level_3: "云南陆军讲武学校"
 YUN_kunming_military_academy_level_3_desc: "$YUN_kunming_military_academy_desc$"
 YUN_ensuring_ideological_cohesion_idea: "确保思想凝聚"
 YUN_ensuring_ideological_cohesion_idea_desc: "令我们沮丧的是，滇军内潜藏着太多好勇斗狠的思想主义，包括那些自私自利之徒、三民主义或者共和思想的信徒，还有那些对政治漠不关心之辈。然而滇军作为一支武装，最紧要的便是令其履行基于完成军事目标而实现政治目标的使命。进行一段时间的思想主义整肃可能会妨碍整体指挥，但长期来看是有利于本政府之政治前景的。"
 YUN_handling_overglorification_idea: "放下浮名虚荣"
 YUN_handling_overglorification_idea_desc: "滇军在其活动中，已沦为了仰仗往日荣光的纸老虎。他们注重于耀武扬威、浩大的阅兵与华丽的制服和走好正步，却忽视了野外训练和操练。要想再次担起护国卫士的重任，那就是时候放下华服和勋章，重新挣回我们奠基者一般脚踏实地的名声。"
 YUN_dare_to_die_idea: "敢死队"
 YUN_dare_to_die_idea_desc: "救亡图存不会降临在那些只会等待的人身上，唯有那些敢于舍弃一切的人，他们的生计、家庭，甚至是生命，才能为中国的自由和解放开辟前途。当号角吹响，云南将士毅然挺身于这决定中华命运的关键时刻，勇敢无畏的志士们应该效仿重九起义先烈，组建敢死队，以自己的生命为自由的中国献上崇高的牺牲。"
 YUN_to_bear_sacrifices_idea: "肯牺牲"
 YUN_to_bear_sacrifices_idea_desc: "如果我们真正为中华民族及其存续而战，没什么比肯牺牲的军人更为强大。而如果我们肯做出牺牲，我们便无往不利，胜利也就是板上钉钉。我们不仅要将这一观念灌输到军官脑中，更要灌输到民众心中。这样便可以让中国培育自己的武士道，从而战无不胜。"
 YUN_political_commissars_idea: "政治委员"
 YUN_political_commissars_idea_desc: "随着部队规模日益壮大，云南之外的兵源不断增加，我军的政治前景正愈显迷茫。虽然我军绝不会效仿如国民革命军那般的党国军队进行纯粹的政治灌输，但唯有通过招募并委任各级政治委员，方可确保新护国军不改初心。只要中国仍坚信其军队之力量，我军便永不会陷入谋私腐败之境地；若中国确需仰赖军队来拯救，则民众教化必自武装力量始——唯其如此，方能铸就一支真正献身于军事化民族国家大业之师。"
 YUN_prioritisation_of_military_victory_idea: "颂扬军事胜利"
 YUN_prioritisation_of_military_victory_idea_desc: "当护国军踏上讨袁征途时，他们心中只有一个目标，那就是取得军事胜利。因为只有在军事上取得胜利，护国军才能在全国实现自己的政治主张。护国军的部队为了取得一次又一次的胜利，牺牲了自己的一切。如今，若我们欲在中国最危急的时刻取得成功，那我们就要再次为了国家的未来而抛头颅洒热血。"
 YUN_seizing_our_land_idea: "夺回合法领土"
 YUN_seizing_our_land_idea_desc: "清廷衰微以来，缅甸人长期窃据中国合法领土。如果我们真的要做中华之卫士，便定要收复一切土地，即便土地再小也不可分离。人尽皆知的黄皮书事件也许会遭到外国列强耻笑，但对于中国人来说，我们只是拿回本属于自己的东西。"
 YUN_officers_prerogative_idea: "军官职权"
 YUN_officers_prerogative_idea_desc: "我军高层十分强调滇军基层指挥官的主动性和指挥能力，并培养他们从战略角度出发进行战术判断、选择最佳方案的实力。这些军官是我等最宝贵的财富，信任他们的判断力是明智之举。"
 YUN_concentration_of_popular_will_idea: "人民兵工制造"
 YUN_concentration_of_popular_will_idea_desc: "很显然，尽管我军所到之处，民众无不竭诚欢迎，我们仍要面对缺枪少炮的现实。如果我们真的想保卫人民和人民的权益，就需要动员民众在农田劳作之外，也要参与工厂作业。每造出一颗子弹，就打倒一个忤逆民意的压迫者。"
 YUN_frontlines_everywhere_idea: "无处不战场"
 YUN_frontlines_everywhere_idea_desc: "虎视眈眈的侵略者不止要在正面战场上同我们兵戎相接，还要处理我们在后方动员起来的游击队。侵略者越是深入我们的领土，他们的补给线就越薄弱，我们的游击队员就愈发英勇。我们将前仆后继，向侵略者发动一场全面的人民战争。"
 YUN_lower_level_autonomy_idea: "云南任务导向战术"
 YUN_lower_level_autonomy_idea_desc: "任务导向战术(Auftragstaktik)是一种通过向基层指挥官下达明确战略目标、时间表及所需兵力，并由其自主决定最佳方案与资源调配的指挥模式。我国军事理论家在研究世界大战后发现，德意志帝国陆军的卓越战绩相当一部分归功于这种指挥权下放体系。为了复刻德军成功经验，我们也将推行自己的下级军官自主决策体制。"
 YUN_a_hundred_regiments_idea: "百团大战"
 YUN_a_hundred_regiments_idea_desc: "军方高层制定了一个雄心勃勃的全面战争计划，这场战役由我们最伟大的军事理论家和战略家共同策划，只需要一百个团就能发动。有了这一百个团，无论多么强大的侵略者或反对者都不是我军的对手。在中华民族的强大力量和精神面前，我们的敌人一定会惊恐万分。"
 YUN_the_lightning_school_idea: "电雷学校"
 YUN_the_lightning_school_idea_desc: "新成立的电雷学校由骁勇的海军将领欧阳格所创办，并与传统的闽系、鲁系海军成分庭抗礼之势。然而电雷学校并非独立机构，而是隶属于云南陆军讲武学校，传统的海军参谋人员则通常将其称为“海军的云南讲武堂”。电雷学校致力于为国人振兴新的海军传统、海陆协同作战，以及颂扬海军的杰出领导力。"
 YUN_republic_of_china_navy_level_2: "中华民国海军"
 YUN_republic_of_china_navy_level_2_desc: "现代民国海军可以追溯到辛亥革命早期阶段，彼时，中华民国临时政府成立了海军部。在那动荡时期，前清海军将领刘冠雄出任首任正式海军总长。紧随而来的军阀割据和宣统复辟期间，民国海军中的许多人员都逃到了南方的国民党和联省派据点，但仍有许多人甘愿留在北京政府中。既然现在中国终于名义上统一在了一面旗帜下，也是时候再次复兴重建民国海军，以切实保障中国在海上的诸多利益。"
 YUN_republic_of_china_navy_level_3: "中华民国海军"
 YUN_republic_of_china_navy_level_3_desc: "$YUN_republic_of_china_navy_level_2_desc$"
 YUN_republic_of_china_navy_export_militarism: "干预海军"
 YUN_republic_of_china_navy_export_militarism_desc: "现代民国海军可以追溯到辛亥革命早期阶段，彼时，中华民国临时政府成立了海军部。在那动荡时期，前清海军将领刘冠雄出任首任正式海军总长。紧随而来的军阀割据和宣统复辟期间，民国海军中的许多人员都逃到了南方的国民党和联省派据点，但仍有许多人甘愿留在北京政府中。既然现在中国终于名义上统一在了一面旗帜下，也是时候再次复兴重建民国海军，以切实保障中国在海上的诸多利益。\n\n如今的民国海军已经整装待发，是时候将云南的武力干预主义精神扩大到全世界了。但凡中国利益之所在，中国军队必将紧接而至紧随其后。国家虽已统一，但滇式武士道已经渗透到军事生活的方方面面。"
 YUN_republic_of_china_navy_national_protectors: "护国海军"
 YUN_republic_of_china_navy_national_protectors_desc: "现代民国海军可以追溯到辛亥革命早期阶段，彼时，中华民国临时政府成立了海军部。在那动荡时期，前清海军将领刘冠雄出任首任正式海军总长。紧随而来的军阀割据和宣统复辟期间，民国海军中的许多人员都逃到了南方的国民党和联省派据点，但仍有许多人甘愿留在北京政府中。既然现在中国终于名义上统一在了一面旗帜下，也是时候再次复兴重建民国海军，以切实保障中国在海上的诸多利益。\n\n如今的民国海军已经整装待发，是时候以云南的护国精神捍卫中国漫长的海岸线了。无论是日本、德国、俄罗斯还是其他哪个国家，他们的海军都不能再护送其地面部队登陆我国，更不可能架起几门舰炮就征服我们的民族，伟大的民族必将由强大的海军来保卫。"
 YUN_republic_of_china_air_force_level_1: "中华民国空军"
 YUN_republic_of_china_air_force_level_1_desc: "中国最早的飞机起降始于满清建设的北京南苑机场，而中华民国空军则可追溯到各地方军阀和中央政府提出和宣传的种种不相干的航空计划。如今我国工业和军事实力空前强大，因此我们面前的任务便是继承前人事业，为中国人民打造一支现代化的空中劲旅。"
 YUN_republic_of_china_air_force_level_2: "中华民国空军"
 YUN_republic_of_china_air_force_level_2_desc: "$YUN_republic_of_china_air_force_level_1_desc$"
 YUN_republic_of_china_air_force_level_3: "中华民国空军"
 YUN_republic_of_china_air_force_level_3_desc: "$YUN_republic_of_china_air_force_level_1_desc$"
 YUN_republic_of_china_air_force_level_4: "中华民国空军"
 YUN_republic_of_china_air_force_level_4_desc: "$YUN_republic_of_china_air_force_level_1_desc$"
 YUN_national_military_aviation_programme: "国家军用航空计划"
 YUN_national_military_aviation_programme_desc: "尽管我们重新努力发展本土航空工业和院校，我国政府仍发现领空及机场中的飞机数量远不足以保家卫国。此次重振计划以精简防御体系为核心，必将使中国空军永远令人敬畏、令人倾佩！"
 YUN_scorched_earth_idea: "焦土计划"
 YUN_scorched_earth_idea_desc: "每当我们在常规战争中节节后退时，我们就会以国家领土之广阔为豪。几个世纪以来，外夷都对中国垂涎三尺，蒙元和满清的侵略者数次来犯。我们则向他们展示，越是深入我国领土，他们的交通和后勤就越薄弱越困难。由于眼下我们在战场上屡屡受挫，越来越多的军官发声，支持有目的地摧毁桥梁、农场、或是任何能为敌人所用的东西，希望以次来拖慢敌人的攻势，削弱他们的实力。"
 YUN_circumnavigating_the_blockade_idea: "封锁突破船"
 YUN_circumnavigating_the_blockade_idea_desc: "宝贵的船队运输着前线和后方急需的人员和资源。在敌人占据制海权并封锁了航道的情况下，我们必须用更快的船只绕行并突破封锁。"
 YUN_a_fleet_in_six_years_idea: "六年造舰"
 YUN_a_fleet_in_six_years_idea_desc: "野心勃勃的“六年造舰计划”旨在迅速提升中国海军生产能力。现下中国大部分舰艇要么是老古董、要么是向外国采购的，作为国民复兴的一部分，我们必须力图现代化我国海军生产水平，并缩小与西方和日本的差距。我们将充分利用我国的大量劳动力，让船坞始终填满改装舰艇和新造军舰。"
 YUN_support_inc_idea: "支援中南半岛革命"
 YUN_hundred_years_of_resistance_idea: "百年抗战"
 YUN_hundred_years_of_resistance_idea_desc: "经过多年内政动荡、内战乱局，我国虚弱不堪，敌人很可能趁此机会发起攻击。焦土政策也好、自杀式进攻也罢，我们必须尽全力抵抗，利用中国广袤的领土和庞大的人力拖垮敌人——并静待反攻之时。"
 YUN_unrest_in_kunming_level_1: "昆明骚动"
 YUN_unrest_in_kunming_level_1_desc: "长久以来，昆明都是云南省的革命势力和反动势力的中心，是前朝帝制政府权力的所在地，也是主要城市动乱的根源。昆明不像腾越和蒙自这些小城市一样，轻易受激进的同盟会影响。通常，昆明的形象都更保守，也引导着整个省的风向。\n\n一直以来在城内的政治方面，滇军的作用都举足轻重，而这支军队的地位受到了学生群体和商人阶层两个方面的挑战。在二十年代，国民党与唐继尧桀骜的下属也对他发起过挑战，即使他当时平稳过关，但如今他在省内的统治可能不如看上去那样稳固。"
 YUN_unrest_in_kunming_level_2: "昆明之乱"
 YUN_unrest_in_kunming_level_2_desc: "长久以来，昆明都是云南省的革命势力和反动势力的中心，是前朝帝制政府权力的所在地，也是主要城市动乱的根源。昆明不像腾越和蒙自这些小城市一样，轻易受激进的同盟会影响。通常，昆明的形象都更保守，也引导着整个省的风向。\n\n随着全球经济萧条、八省联合崩溃，失业者激增、学生民族情绪高涨，商业阶层也人心惶惶，这都使得省内动荡激增，而一向半心半意地支持唐继尧当局的滇军也开始暗生疑窦。"
 YUN_dian_qian_divide_1: "滇黔嫌隙"
 YUN_dian_qian_divide_1_desc: "滇是云南省的简称，既指上古的滇国、滇人，也指如今昆明附近的滇池。滇国起源于古代已经绝迹的僰人。滇者，水在益州滇池也。自汉代以来，便一直以滇来指代该地。同样，黔字起源于战国到秦代，当时该地通称为“黔中”。在秦朝正式被定名为“黔中郡”后，贵州的别称由此定调。\n\n滇黔之间的关系一直都动荡、敌视而脆弱。两地来往史可谓是坎坷万分、令人称奇。曾经，唐继尧在驱逐杨荩诚后做过贵州都督，这也开启了滇系入主贵州的历史。在滇系与西南各势力的授意之下，贵州在黔系新派和旧派之间来回易手。而目前，贵州的局势更是一触即发——一部分割据在国民党手中，一部分则由法理上的督理袁祖铭管辖。而这双方对昆明都没什么好脸色。"
 YUN_dian_qian_divide_2: "滇黔对决"
 YUN_dian_qian_divide_2_desc: "滇是云南省的简称，既指上古的滇国、滇人，也指如今昆明附近的滇池。滇国起源于古代已经绝迹的僰人。滇者，水在益州滇池也。自汉代以来，便一直以滇来指代该地。同样，黔字起源于战国到秦代，当时该地通称为“黔中”。在秦朝正式被定名为“黔中郡”后，贵州的别称由此定调。\n\n滇黔之间的关系一直都动荡、敌视而脆弱。两地来往史可谓是坎坷万分、令人称奇。曾经，唐继尧在驱逐杨荩诚后做过贵州都督，这也开启了滇系入主贵州的历史。在贵州激进的国民革命残军控制地区，昆明政权表面上的权威走向崩溃。国民党与滇系之间的决死战一触即发，这场大决斗会定出两省大权鹿死谁手，或许还会改变整个中华的未来。"
 YUN_dian_qian_divide_3: "黔随滇主"
 YUN_dian_qian_divide_3_desc: "滇是云南省的简称，既指上古的滇国、滇人，也指如今昆明附近的滇池。滇国起源于古代已经绝迹的僰人。滇者，水在益州滇池也。自汉代以来，便一直以滇来指代该地。同样，黔字起源于战国到秦代，当时该地通称为“黔中”。在秦朝正式被定名为“黔中郡”后，贵州的别称由此定调。\n\n滇黔之间的关系一直都动荡、敌视而脆弱。两地来往史可谓是坎坷万分、令人称奇。曾经，唐继尧在驱逐杨荩诚后做过贵州都督，这也开启了滇系入主贵州的历史。枪声再次沉寂，人们走出家门，两省之间的关系归于缓和。而贵州明白，自己再次成为了外省主子的鹰犬走卒。"
 YUN_dian_qian_divide_4_contender: "护国传承"
 YUN_dian_qian_divide_4_contender_desc: "滇黔两省再次主宰着民族救亡运动的浮沉，在共同努力下，两省的影响早已远播西南之外。这场本乡本土的运动早已成为了逐鹿天下的黑马，让人不禁又想起山河破碎的年代，护国运动的英烈们团结了全国同胞，一致为救亡而战。而今，自昆明至北京的征途再起，中华民族的未来的重担又落在了来自昆明和贵阳的豪杰们的肩头上。我辈之先驱一日自省警惕，则我辈之家国便一日不会倾覆。"
 YUN_dian_qian_divide_4_satellite: "西南王者"
 YUN_dian_qian_divide_4_satellite_desc: "昆明为中华民族完成统一大业，再次稳固了云南“西南王者”的美誉。就如同二十年代，当地的命运完全取决于[YUN.GetLeader]的恩赐，服从[YUN.GetLeader]的旨意。随着云南的影响力远播湘、川、黔、桂、粤，一个严格的权力集团已然形成。就算名义上中华大地归于一统，在很长一段时间内，云南仍然会是国家的“拥王者”。"
 YUN_KMT_popular_support_desc: "纵国民党立志予中国以民权，还民生于天下，然理想远未实现，革命道阻且长。中国人民受苦久矣，众多空想家侈谈“乌托邦”，却无一人能建成地上天国。高举青天白日，挥洒一腔热血，国民党可以兵戈扫清六合，但若要赢得民心，则需先救黎民于水火。"
 YUN_KMT_popular_support_1: "[YUN_KMT_popular_Support_1_scripted_loc]"
 YUN_KMT_popular_support_1_desc: "$YUN_KMT_popular_support_desc$\n\n国民党占领了昆明，在滇军和其他地方当权派的默许下，云南被纳入国民党的统治范围。这使得国民党在西南地区又增添了一块据点，也为国民党将革命推向全中国提供了跳板。但对于由军头和国民革命军主导的云南革命运动，人民的信心微乎其微。"
 YUN_KMT_popular_support_2: "[YUN_KMT_popular_Support_2_scripted_loc]"
 YUN_KMT_popular_support_2_desc: "$YUN_KMT_popular_support_desc$\n\n随着国民革命军在云南的统治趋于稳定，人民已经习惯了士兵无处不在的行军队列，习惯了军头无处不在的监护视线。尽管新的内外挑战纷至沓来，政府还是通过实施必要的改革逐渐赢得了民心，稳定了局势。"
 YUN_KMT_popular_support_3: "[YUN_KMT_popular_Support_3_scripted_loc]"
 YUN_KMT_popular_support_3_desc: "$YUN_KMT_popular_support_desc$\n\n国民革命军重现北伐前夕的辉煌，人们也再度将这股国民党内的新生力量视作了国家和人民的救星。随着国民革命不断深入，人民群众的接受度和自觉性也不断提升。"
 YUN_KMT_popular_support_4: "[YUN_KMT_popular_Support_4_scripted_loc]"
 YUN_KMT_popular_support_4_desc: "$YUN_KMT_popular_support_desc$\n\n中国国民党建立了坚不可摧的统治地位，并重新确立了其在人民斗争中的主宰者地位。他们再也不会像1927年国民革命军四分五裂时那样软弱无力了。"
 YUN_KMT_popular_support_5: "[YUN_KMT_popular_Support_5_scripted_loc]"
 YUN_KMT_popular_support_5_desc: "$YUN_KMT_popular_support_desc$\n\n国民党被誉为真正的救星、人民的战士，他们不再被当成是骤起的新贵，或者只是过去的幽灵，一复活就会给中国带来更多动乱。他们建立起合法的全国政府，许多人将其视为中国人民唯一真正的政府。以青天白日满地红之名，过往烈士们的牺牲将不会被白费。"
 YUN_KMT_popular_support_ccc_idea: "党的法统：§a光明前途§!"
 YUN_KMT_popular_support_ccc_idea_desc: "$YUN_KMT_popular_support_desc$\n\n诚然，吾党吾国曾经道德沦丧，蛀虫丛生。但再度改组后的国民党正散发出前所未有的活力，领导着那些对本党的决心与理想充满信心的国民，向着建设道德高尚的国家前进。在高升白日的照耀下，新中国将创造前所未有的辉煌，步入崭新光明的未来。在这个未来中，公民大众的共同监督与职业人士的专业技术将充分结合，使国民革命走向真正充满活力的前途。"
 YUN_KMT_popular_support_dai_jitao_idea: "党的法统：§P精神救国§!"
 YUN_KMT_popular_support_dai_jitao_idea_desc: "$YUN_KMT_popular_support_desc$\n\n长期以来，国民党就遭受着自由派变节者与左派煽动者的分裂，但如今，党已经在非戴季陶主席不能阐述的正确理论路下协调一致。对于主席来说，新右派的胜利将会确保，如孔夫子一般的历代先贤的思想逻辑能与孙中山先生的思想结合起来。而为达此逻辑，我们必须在民族的精神与道德上进行自救。国民也必须明白，他们将在国家的慎重督导与指引之下，步入真正的民主与自由。"
 YUN_KMT_popular_support_socialist_chen_cheng_idea: "党的法统：§S农民拥护！§!"
 YUN_KMT_popular_support_socialist_chen_cheng_idea_desc: "$YUN_KMT_popular_support_desc$\n\n长期以来，党都迷失在歧途中，被专制军头和自由派变节者的内讧闹得四分五裂。踏上光复征途却从未远虑，为了战争而将人民的选举权置于训政之下。然而，在黄埔出身的一众军头之中，却仍有一位先锋，只有他能够督导好这个无所不包的大帐篷。在“小委员长”陈诚的中央集权政权之下，“红色将军”蒋介石和“红色拿破仑”邓演达的理想与荣耀都会尽付现实。在本党崭新的领导下，国民经济的腾飞与人民生活水平的改善将为政治民主的发展开辟先路。为劳动者而非所有者服务的革命经济，就在我们不远的未来。"
 YUN_KMT_popular_support_chen_cheng_idea: "党的法统：§P保持革命§!"
 YUN_KMT_popular_support_chen_cheng_idea_desc: "$YUN_KMT_popular_support_desc$\n\n在新老世代的斗争中，军队少壮派最终获胜！他们不再为那些教条主义的阴谋掣肘，也不会屈服于那些光说不做的“正统”或者社会主义思想。陈诚委员长在两者间的狭路之上并驾齐驱，最终统领了新右派迈向未来的复兴。在他的中央集权政权之下，中国也跟随着“小委员长”的步伐迎来了繁荣的十年。陈诚宣布他会用大规模土改来打破合久必分的周期律，结束中华民族数千年来长久的苦难。"
 YUN_KMT_popular_support_peoples_generalissimo_idea: "党的法统：§S人民委座§!"
 YUN_KMT_popular_support_peoples_generalissimo_idea_desc: "$YUN_KMT_popular_support_desc$\n\n何应钦委员长的权力布局蕴含着智慧。尽管有人批评这位新委员长缺乏其老友蒋介石那样丰富的政治管理经验，但何委员长已经以事实驳斥了这些批评。他不仅领导着第三军，而且还领导着文官系、黄埔系和享有盛誉的旧右派，成为了国家真正的统筹者。委员长悉心指导，加之他手下一批新右派杰出的理论家与设计师的辅佐，中华民族救亡图存的使命必能完成。有了高深莫测的“小委员长”及其土木系的领导，黄埔人必将把国家打造成一个心系人民利益的人民政权。"
 YUN_KMT_popular_support_revolutionary_generalissimo_idea: "党的法统：§a革命委座§!"
 YUN_KMT_popular_support_revolutionary_generalissimo_idea_desc: "$YUN_KMT_popular_support_desc$\n\n何应钦委员长的权力布局蕴含着智慧。尽管有人批评这位新委员长缺乏其老友蒋介石那样丰富的政治管理经验，但何委员长已经以事实驳斥了这些批评。他不仅领导着第三军，而且还领导着文官系、黄埔系和享有盛誉的旧右派，成为了国家真正的统筹者。委员长悉心指导，加之他手下一批新右派杰出的理论家与设计师的辅佐，中华民族救亡图存的使命必能完成。有了新右派的总设计师戴季陶和中央俱乐部的全力支持，黄埔人必将把救亡图存与自强求富放在首位，精心构筑国家的未来。"
 YUN_KMT_popular_support_lucky_generalissimo_idea: "党的法统：§P福将委座§!"
 YUN_KMT_popular_support_lucky_generalissimo_idea_desc: "$YUN_KMT_popular_support_desc$\n\n何应钦委员长的权力布局蕴含着智慧。尽管有人批评这位新委员长缺乏其老友蒋介石那样丰富的政治管理经验，但何委员长已经以事实驳斥了这些批评。他不仅领导着第三军，而且还领导着文官系、黄埔系和享有盛誉的旧右派，成为了国家真正的统筹者。委员长悉心指导，加之他手下一批新右派杰出的理论家与设计师的辅佐，中华民族救亡图存的使命必能完成。在中国政坛上无人能敌的何委员长正精心监督着党国。在这个党国中，所有派系都不会风头过盛，只会坚决效忠何委员长，他们彼此争风吃醋，争取委员长的宠爱。何应钦委员长的确是从军阀时代杀出来的一员福将。"
 YUN_KMT_popular_support_liberal_generalissimo_idea: "党的法统：§m自由委座§!"
 YUN_KMT_popular_support_liberal_generalissimo_idea_desc: "$YUN_KMT_popular_support_desc$\n\n何应钦委员长的权力布局蕴含着智慧。尽管有人批评这位新委员长缺乏其老友蒋介石那样丰富的政治管理经验，但何委员长已经以事实驳斥了这些批评。他不仅领导着第三军，而且还领导着文官系、黄埔系和享有盛誉的旧右派，成为了国家真正的统筹者。委员长悉心指导，加之他手下一批新右派杰出的理论家与设计师的辅佐，中华民族救亡图存的使命必能完成。何应钦听取了技官主义政学系的思想家、技术官僚和公务员的意见，并看到了中国人民中雄心勃勃的经济计划和温和的政治自由化浪潮。虽然训政的地位仍存在争议，但有了党外人士和其他政治家参与政治，中国的未来必将蓬勃发展。"
 YUN_KMT_popular_support_blueshirt_generalissimo_idea: "党的法统：§n蓝衣委座§!"
 YUN_KMT_popular_support_blueshirt_generalissimo_idea_desc: "$YUN_KMT_popular_support_desc$\n\n何应钦委员长的权力布局蕴含着智慧。尽管有人批评这位新委员长缺乏其老友蒋介石那样丰富的政治管理经验，但何委员长已经以事实驳斥了这些批评。他不仅领导着第三军，而且还领导着文官系、黄埔系和享有盛誉的旧右派，成为了国家真正的统筹者。委员长悉心指导，加之他手下一批新右派杰出的理论家与设计师的辅佐，中华民族救亡图存的使命必能完成。随着信奉秘密主义、激进主义、民族主义的蓝衣社掌握权力，何委员长的国民革命走上了一条完全服从委员长的道路。中国人民必须毫不动摇地服从委员长和蓝衣社的英明领导。只有“中国的萨文科夫”何应钦才能开创中国人民的新生活与新时代。唯有在委员长的领导下，中国人民才能实现救亡图存。"
 YUN_KMT_popular_support_blueshirt_revolution_idea: "党的法统：§n纯净党国§!"
 YUN_KMT_popular_support_blueshirt_revolution_idea_desc: "$YUN_KMT_popular_support_desc$\n\n中华民族作为统一的整体，可谓是无上崇高、神圣而独一无二的。坐拥数千年之久的历史，每个华夏儿女都有责任捍卫国家的地位。我等已然舍弃了西方的利己与颓废的阴谋论。旧国党彻底放弃了群众工作的伪装，也彻底让国民幻灭。这个脱离大众、受大众憎恨的党，只有蓝衣社才能监督其复兴。因为党必须得到尊重，因为国家必须得到尊重。旧国党的颓废、无能和动荡当然也不是那些亲爱的同志们的过错，要怪便怪那百般疏漏的制度、错漏百出的体制和败絮其中的内在。而蓝衣社会给中华民族安排一个美好的未来。我们的人民永远不会忍饥挨饿，但也永远不会迷醉在财富和贪婪中。党国之治下，将是一个完美、纯净的大同之世。"
 YUN_KMT_popular_support_correspondence_of_the_liberals_idea: "党的法统：§m技官制霸§!"
 YUN_KMT_popular_support_correspondence_of_the_liberals_idea_desc: "$YUN_KMT_popular_support_desc$\n\n这是政学系第五次试图夺取中国政权了，看来这次他们终于稳稳站上了顶峰。在新政学系的领导下，中国进入了国家主义经济计划的新纪元，人民也得到了适度的自由化。这些中国的新“元老”(げんろう)们虽然表面看来软绵绵的，但他们肯定会在备受争议的训政之下精心培育一个技术官僚统治的时代。党外乃至其他许多政治运动都被纳入国家的日常政治生活。在技官、官僚和金融精英的对话之下，定能播种出一片美丽的民主花坛。"
 YUN_KMT_popular_support_heirs_to_the_orthodox_idea: "党的法统：§c继承正统§!"
 YUN_KMT_popular_support_heirs_to_the_orthodox_idea_desc: "$YUN_KMT_popular_support_desc$\n\n第三军是国民革命军中一个并不瞩目的派系，但如今却证明了自己多么关键。第三军的朱培德军长带领着长征残部集结于贵州，在此地督导着国民党的重组、巩固与重建。在外敌环伺之下，朱培德的稳健领导让本党保住了云南省，随后便掌控了全中国。朱培德与其恩师蔡锷一般，自昆明进发，最终竟蔡锷未成之伟业——领导全国统一。朱培德坚实背靠正统孙文主义者，支持“莫斯科派”，迎胡汉民回国民政府，参与治国理政。如今，朱培德与胡汉民便是全国最正统、信念最坚定的政治家，他们都有着自己所要肩负的使命。"
 YUN_KMT_popular_support_reform_through_hardship_idea: "党的法统：§m历艰维新§!"
 YUN_KMT_popular_support_reform_through_hardship_idea_desc: "$YUN_KMT_popular_support_desc$\n\n第三军是国民革命军中一个并不瞩目的派系，但如今却证明了自己多么关键。第三军的朱培德军长带领着长征残部集结于贵州，在此地督导着国民党的重组、巩固与重建。在外敌环伺之下，朱培德的稳健领导让本党保住了云南省，随后便掌控了全中国。朱培德与其恩师蔡锷一般，自昆明进发，最终竟蔡锷未成之伟业——领导全国统一。不过到头来，一统中华后的种种也并非朱培德的擅长的戏码，他愈发依赖政学系来支持自己的政府。最终在一场党内选举中，他被革命英雄、蔡锷的老对头李根源赶下了台。凭着四十年为革命服务的生涯中一贯的谨慎，李根源治下的民国毫无疑问将是温和、计划而宪政的。不过，也得是训政的。"
 YUN_KMT_popular_support_solidarity_of_the_people_and_nation_idea: "党的法统：§R国民团结§!"
 YUN_KMT_popular_support_solidarity_of_the_people_and_nation_idea_desc: "$YUN_KMT_popular_support_desc$\n\n朱德和章伯钧看到那些被视为国民革命叛徒的人被正式罢免，便效仿数十年前的蔡锷护国一般，从昆明挥师北上，救国于分裂内乱之中。现在，国民革命把自己摆在了真正能够满足中国农工需求的位子上，因而可以在有组织无产阶级的支持下大步向前。在国民革命军的保护下，中国人民也能够继续畅想中华民族的光明未来——社会主义政策、激励地方民主并鼓励阶级团结，将会为人民群众一劳永逸地带来平等。"
 YUN_encirclement_and_annihilation_idea: "围而歼之"
 YUN_encirclement_and_annihilation_idea_desc: "包围学说涵盖了克劳塞维茨提出的战争三目的之二：消灭敌人的军队、打垮敌人的意志。而消灭敌军意味着缩减敌人的领土范围，同时也能加强我们动员民众支持的能力。正如先前的滇军英雄们所做的，对强敌最有效的战略便是最大限度地慎用有限的兵力。"
 YUN_the_peoples_war_idea: "人民战争"
 YUN_the_peoples_war_idea_desc: "在反对以“中央委员会”自居却行军阀主义和帝国主义之实的腐朽堕落之辈的伟大斗争中，受压迫的全国人民团结一致。只要胡汉民和汪精卫这些煽动家继续掌权，已故孙中山先生对自由中国的愿景就永远不可能真正实现。因此，我们将鼓励男女老少齐心协力，为建设新中国而奋斗。"
 YUN_last_stand_of_the_southwest_princes: "西南诸省的殊死一搏"
 YUN_last_stand_of_the_southwest_princes_desc: "国民革命的命运正掌握在我们手中，唯有拼死一搏而已矣。尽管我军将士英勇奋战，但随着中央委员会不断加强对我军的攻势，我们的力量和意志都在日益衰弱。我们的余力只够发动最后一次孤注一掷的进攻，成败皆在此一战。贪生怕死，勿入此门。"
 YUN_martyrs_of_a_lost_cause: "败局的烈士"
 YUN_martyrs_of_a_lost_cause_desc: "尽管将军和军官们竭尽全力，但前线还是在巨大的压力下一溃千里。一切都崩溃的时候，仍有一丝希望尚存。不过目前的情况下，奇迹恐怕不大可能出现。"
 YUN_spiritual_mobilisation: "精神总动员"
 YUN_spiritual_mobilisation_desc: "正是在中华民族精神的鼓舞下，大批勇敢无私的人们加入了国民革命军。他们心存希冀与抱负，愿意筚路蓝缕，亲手创立新的中国。希望全国人民都能在云南的榜样下挣脱枷锁——又或者是以武力争取解放。"
 YUN_scientific_society: "科学社会"
 YUN_scientific_society_desc: "中国的救亡图存完全取决于国家社会中的个人如何管理自己的生活。国民党必须谨慎地进行管理，并采取积极的行动来构建公民的政治、精神与职业经验。对于科学社会来说，这便可以称为一个模范社会，一个必将胜利、必能带来中华文化复兴的社会。"
 YUN_supporting_the_revolution: "支持革命"
 YUN_central_political_school_idea: "中央党务学校"
 YUN_central_political_school_idea_desc: "中央党务学校由CC系出资主办，宣称是为了党培养新一代能力高强、合乎资格、恪守中立而又具有革命精神的公务员，以此达到为党服务的目的。当然了，在中国县官流转率高达88%的现状下，这一机构也有助于扩大国民党在文官政府中的影响力。"
 YUN_enacting_peoples_tutelage: "进入训政"
 YUN_enacting_peoples_tutelage_desc: "为使人民真正参与到未来中国的民主中去，他们就必须做一个文明国度中受教育、有热忱、敢作为的公民。在对大众政治和教育的投资下，但愿毁灭北洋政府的腐败影响不会打垮又一个民国。"
 YUN_educating_our_officers_idea: "教育军官"
 YUN_educating_our_officers_idea_desc: "通过改革课程设置，重点从各部选拔有能力的军官，进而赞助他们的深造——但愿我们的军官队伍不再是纯粹的没有接受过标准整体教育的军人，而是有自觉、有意识的国民革命践行者。"
 YUN_soothing_the_alms_of_the_peasants: "以赈济安农"
 YUN_soothing_the_alms_of_the_peasants_desc: "陈诚与严重等人精诚合作，开展了大规模的减租运动，从而减轻民众负担。通过将60%-70%的年租减为精心计算的37.5%，同时让年利不得超过20%，既可以换来经济的大进步，也可以得到农民的全力支持。"
 YUN_extol_national_mobilisation: "歌颂国民动员"
 YUN_extol_national_mobilisation_desc: "唯有动员起有政治信念与觉悟的民众，中华民族才能抵御工团主义的渗透，保持革命运动的纯粹。我们要在男女老少身边弘扬爱国精神，让第三国际及其在左派中央委员会的走狗们所宣扬的西方歪理绝无容身之所。"
 YUN_total_adherence_to_the_party: "对党绝对忠诚"
 YUN_total_adherence_to_the_party_desc: "解决本国一切问题的办法就是绝对服从。毕竟个人为了一己私利背叛国家民族的戏码可谓层出不穷。新中国不许再有这样明目张胆的自私自利之举了。每位国民都要讲自己的体魄、心智与魂灵全然献给党国的一切理想，毕竟只有本党才是唯一把民族命运放在心上的组织。"
 YUN_bureau_of_public_safety: "广州市公安局"
 YUN_bureau_of_public_safety_desc: "我国的模范警政机构——广州市公安局，由贵州警务专家李士珍的经验，加之总结一系列外国警察机构的教训而得来。警察局加上蓝衣社的暗杀科、张群的警政经验及中央俱乐部的不懈努力，异见分子定然无所遁形。"
 YUN_bis_idea: "中统"
 YUN_bis_idea_desc: "国民党中央执行委员会组织部调查统计局时刻警惕地监视和报告着党内外的反革命分子活动。中统隶属于CC系，由雄心勃勃的陈立夫领导，分为三个处（一个徐恩曾的调查处，主管党务调查；一个特务处，主管军警调查、还有一个丁默邨的总务处）。中统的工作方式借鉴了英国的秘密情报局与俄罗斯的契卡等西欧情报部门，致力于确保党的职能不受那些异见分子的影响。"
 YUN_tewu_idea: "特务处"
 YUN_tewu_idea_desc: "特务们行于黑暗之中，永远克敌机先。“特务”一词是行暗杀、绑架以及其他肮脏的政治压迫特别行动者之委婉称呼。只有心怀对党的敬畏，革命的骑士们才能以法律的残酷手段彻底涤除党内之污秽。特务处的创始人李士珍受日本宪兵队启发，将手下的特务处分为两个科——侦缉科下是由王柏龄领导的军务组和顾建中领导的特务组。而暗杀科则包括公安局和顾顺章领导的铁血团。"
 YUN_exorcising_the_excess: "刮骨疗毒"
 YUN_exorcising_the_excess_desc: "在这个颓败的时代，在这个破碎的国家，只有军阀、土匪、官僚和盗贼大行其道。军阀可以用武力击败，官僚可以加以利用，只有那些受腐败的黑暗蔓枝影响之人必须被荡除。任他们鬼哭狼嚎，我们不会有一丝同情。"
 YUN_supporting_our_brethren: "拉兄弟一把"
 YUN_supporting_our_brethren_desc: "在整体的系统中，机器中的每一齿轮都有必要为更大的生产力做出贡献，我们也要为了国民革命流血流汗。我们必须向中央委员会提供建议和援助，让党得以迅速崛起、一统河山，即便牺牲本省之内同志们的利益也在所不惜。"
 YUN_uplifting_the_sister_party: "提携兄弟党"
 YUN_uplifting_the_sister_party_desc: "工团党和国民党自1924年结成统一战线以来，就为了争取斗争中的工农解放而产生了同志情谊。在北伐晚期，许多工团党成员仍保留着国民党员的双重党籍，尽管他们遭到右派的一再抗议，但仍与党的核心过从甚密。中国大都市里的工人和工会可不应受污蔑。让我们进一步发展兄弟党的地方支部，共创革命美好未来。"
 YUN_the_golden_handshake: "以金会友"
 YUN_the_golden_handshake_desc: "政学系利用其遍布全国技术官僚体系乃至国际市场中的广泛人脉，在党国和计划主义国家社会主义的支持下，进一步培育民族资产阶级。尽管批评者认为[ROOT.GetLeader]这是允许他们腐化本党，且这是以某种方式支持乃至补充国家资本主义制度。但随着中国经济从封建社会走向繁荣，本党的信念愈发坚定不移。"
 YUN_the_intellectual_cornucopia: "群贤毕至"
 YUN_the_intellectual_cornucopia_desc: "在[ROOT.Capital.GetCapitalVictoryPointName]各地，形成了知识分子愉悦思考、写作的场所，简直能与北京或长沙相媲美。这些文豪与省政府勠力同心，推动进步之轮驶向以[ROOT.Capital.GetCapitalVictoryPointName]为中心的启蒙新时代。尽管该省预算已经缩减，但还是为此事慷慨地提供了资金。"
 YUN_mass_education_efforts: "民众教育工作"
 YUN_mass_education_efforts_desc: "于右任是一位教育专家，也是一位文人雅士、书法大家，他与戴季陶等人合作，负责本土教育体系的发展。凭借着于右任在陕西、上海的高校多次办学的经验，加之戴季陶独特的教育经历，两人将兼具儒释思想的课程在全国推广。第一步，便是计划将全国课纲重新调整为对学生有价值的实践运动，但愿借此能让全国人民摆脱文盲困境。"
 YUN_stimulated_civil_bureaucracy: "刺激文官系统"
 YUN_stimulated_civil_bureaucracy_desc: "随着白日照耀整个中国，云南民政模式现有的低劣水平已经无法治理全国了。为解决这一问题，[ROOT.GetLeader]操办了文官系统的预算分配扩张，对于扫清各省行政管理死角打下了有力的基础。不过这也导致了文官内部争夺职位的内讧加剧。"
 YUN_disgruntled_whampoa_idea: "黄埔系不满"
 YUN_disgruntled_whampoa_idea_desc: "黄埔军校凝结着先总司令蒋介石与先总理孙中山的心血，旨在培养新一代国民革命军将校，致力于雪百年之外耻、救国家于危亡。自二次北伐以来，黄埔系在国家政治中的作用无疑举足轻重，但随着国民党控制的文官政府重树权威，许多军方高层都感到不安与不满——他们意识到自己在国家建设时期被愈发边缘化。"
 YUN_disgruntled_whampoa2_idea: "黄埔第二春"
 YUN_disgruntled_whampoa2_idea_desc: "根据戴季陶先生的思想主义，国民革命军应该是且仅是国民革命的工具。在缓慢而艰苦的全国编遣时期，我们要鼓励二次北伐、抗日战争这一代的老兵去为民众服务。他们的才华应当用于利民之事，而不是落草为寇。"
 YUN_unruly_opposition_idea: "桀骜不驯的反对派"
 YUN_unruly_opposition_idea_desc: "国民党也许确实是一个大帐篷党，而这样的派系林立却只带来了党内的混乱动荡，以及大量阴谋颠覆、享乐颓废的思想与主义。从民盟内部那些在新生民国中一心为自己巩固地位的自由派，到党内左派的赤匪逆贼——如若不采取行动，这些反动派只会迁延乃至阻挠革命之进程。"
 YUN_unruly_opposition2_idea: "偃旗息鼓的反对派"
 YUN_unruly_opposition2_idea_desc: "中华民国的内乱和动荡导致了经济衰退，数月以来，经济投机不断，许多外国人纷纷从中国撤资撤股。CC系和国民党中执委决心以短促有力的技术官僚式国有化计划来确保经济的恢复乃至更进一步发展。这也为经济向着民族复兴的方向发展奠定了基础。"
 YUN_woes_of_nationalism_idea: "党国困境"
 YUN_woes_of_nationalism_idea_desc: "中华民国的内乱和动荡导致了经济衰退，数月以来，经济投机不断，许多外国人纷纷从中国撤资撤股。CC系和国民党中执委决心以短促有力的技术官僚式国有化计划来确保经济的恢复乃至更进一步发展。这也为经济向着民族复兴的方向发展奠定了基础。"
 YUN_woes_of_nationalism2_idea: "迈向单一机体"
 YUN_woes_of_nationalism2_idea_desc: "一心同体之理念由本党伟大的思想家戴季陶先生所阐述，作为理解我们伟大国家经济运转模式的重要蓝本。我国地大物博，自然资源无所不有，但又长期被那些压榨中国人民权利与资源的、行奇技淫巧的外来帝国主义者所束缚。现在民众控制了一切资源，我们终于可以践行民生主义，将社会带向真正的大同。"
 YUN_youth_paramilitarism_idea: "青年准军事化"
 YUN_youth_paramilitarism_idea_desc: "未来属于青年。为了革命的发展，我们需培养一批满腔热忱的革命青年，这些子孙后代将承继先辈的路线，继续中华的革命事业。本着革命精神，我们须教导他们服从上级指示、实践《论语》中的忠孝美德、践行先总理孙中山的遗志。如此，他们方能铭记教导，向着革命的胜利秉炬前行。"
 YUN_technocratic_administration_idea: "技官政府"
 YUN_technocratic_administration_idea_desc: "国民党臃肿的官僚体系已经彻底排除掉了党内的空想家和煽动者，党现在可以集中精力有效通过真正需要的改革。此外还会邀请在外受过训练的人来协助政府发展和改革。"
 YUN_ideology_as_the_nervous_system: "主义便是神经系"
 YUN_ideology_as_the_nervous_system_desc: "一个政党，除了主义，便没有结合的基础。主义是党的神经系，是党开展政治行动的血管。失去了神经系和血管，动物便不再称之为动物；而失去了清晰、团结、共同的主义，党也不能称为党。"
 YUN_pursuit_of_social_harmony: "以进大同"
 YUN_pursuit_of_social_harmony_desc: "唯有古代中国的精神内核，才存在着“大同之世”这样的理念。为实现这一理念，本党必须关注并强调中国固有的稳定力量：儒学。在儒家社会和谐思想对中华民族的约束下，阶级斗争这样的外来思想在我国永无落脚之处。所谓“民吾同胞，物吾与也。”"
 YUN_rampant_hyperinflation: "猖獗的通货膨胀"
 YUN_rampant_hyperinflation_desc: "环顾四周，中华民族亲历了资本主义道路给国民经济带来的凋敝之果。军阀混战、内部动荡、北伐烽火乃至抗日战争，使中国经济几乎跌入了自由落体状态。外国投资者纷纷撤资退股，日本在东北的资本投入已名存实亡，使馆城市则保持戒备和警惕，并继续通过骚扰或其他方式对付革命政府。然而，在真正守护者引领下，中国经济必将重焕生机，达到前所未有的强盛。黄埔系不仅拥有众多资产和专业知识，还有众多才华横溢的经济学家随时待命。"
 YUN_last_gasp_of_democracy: "民主黎明前的黑暗"
 YUN_last_gasp_of_democracy_desc: "现如1924年改组时般，弥漫着一股紧张肃杀的氛围。我国知识分子们在圈子、俱乐部或读书会暗中恐惧着。他们害怕中国的民主会被彻底摧毁。先前的政权并不完美，但至少还保留着“民主”的幌子。然而，随着党正式进入训政时期，并为确保民主而力行后，民众却逐渐失去了动力。这状况已出现在各方面，甚至影响了士兵的士气。黄埔军人绝不能只是嘴上说说，定要让中国在国民革命崛起后变得更加美好，所有中国公民都将能票票入匦，选出自己的领导人。"
 YUN_political_dysfunctionalism: "政令不行"
 YUN_political_dysfunctionalism_desc: "我们开展工作的方向完全是为了战争，显然这只能遗留下焦土遍地、四方隔绝、怨毒横生的景象。党的社论家谴责本党的统治早已“背孚民望”。不仅如此，他们还坚称本党已经“脱离民众，几令各地之民怨沸腾！”显而易见，在中国面临的生死存亡的斗争结束后，所产生的新问题还完全没有军事和政治的解决方案，这是本党本政府机关之完全失能所造成的。"
 YUN_ending_government_inanity: "终结政府愚行"
 YUN_ending_government_inanity_desc: "长期以来，党治便得越发不理智，忽视着中国民众的真正需求。政府朝令夕改，甚至可以绕过中执委。而党国内部的官僚习气更是与日俱增，几乎成为坏疽毒瘤。党内弥漫着一股利己主义的作风，丝毫不在乎理政之道。土木系提出了一系列激进而有高度争议的改革，尝试实践宪政的初级阶段。虽然这和彻底进入宪政还相去甚远，但这些理念也在得到迅速践行。"
 YUN_in_pursuit_of_a_revolutionary_democratic_future: "追求革命民主之未来"
 YUN_in_pursuit_of_a_revolutionary_democratic_future_desc: "许多批评党的人会谴责它，说它不过是个披着革命外衣的专制政权。但他们大错特错。孙中山先生所提出的国民革命三阶段方针，如今才正要全面实施。黄埔军人将携手中国人民，迈向革命民主的未来。"
 YUN_invigorating_the_cadres: "加强干部队伍建设"
 YUN_invigorating_the_cadres_desc: "为了加强党组织对党员生活的影响，以防止历史上曾出现的分裂与内斗，国民党设立了干部制度。通过选举、推荐、考核与培训相结合的遴选机制，干部被划分为三类：负责党委工作的党务干部、作为政治职务候选人的政治干部，以及担任社会团体或合作理事会负责人候选人的群众运动干部。这些干部需接受三民主义教育，通过政治忠诚与履职能力考察，并经历严格背景审查。希望新一代积极参与政治的党员能为本党注入崭新的蓬勃朝气。"
 YUN_the_organic_economy: "有机经济"
 YUN_the_organic_economy_desc: "基于中国各省实际情况，在遵循现行法律及统一法规的前提下，土木系打造出了真正服务于人民需求而非少数人利益的中国经济新模式。通过汇聚经济学家、学者专家与政府部门共同推行减租政策，同时建立监察机构监督土改进程，小委员长誓要终结中国几千年来的治乱循环，并确保实现一个建立在可持续发展基础上的崭新未来。"
 YUN_institute_of_revolutionary_practice_idea: "革命实践研究院"
 YUN_institute_of_revolutionary_practice_idea_desc: "正因本党之胜利，我们近年才能取得如此成就。但革命尚未成功。在我们伟大的国家中，仍需对本党、本政府、本军进行训练，以承继1924年之革命精神，实现先总理对未来自由中国之愿景。将这些措施交于机构实施可以确保本党之严肃性，而革命实践研究院将会教导新生代党员何为政治忠诚。"
 YUN_national_voluntary_labour_movement: "国民义务劳动运动"
 YUN_national_voluntary_labour_movement_desc: "在西方资本主义奴役工人时，我们的计划会确保优秀正直的工人免受西方帝国主义的魔爪。工会将与国家配合，保障中国工人的权利，促进各阶级的团结，与民族步调一致。"
 YUN_uplifting_chinas_national_character_idea: "拔擢中华民族品德"
 YUN_uplifting_chinas_national_character_idea_desc: "中国旧社会的处世之道自然值得尊重，但中华文化也必须经历一场剧烈的变革，重塑现代的形象。更重要的是，中国必须抵御西方颓废的唯物主义与个人自由主义。在国民党统治下，中华民族定会焕然一新。"
 YUN_primacy_of_the_peoples_vanguard_army: "军队至上，为民前锋"
 YUN_primacy_of_the_peoples_vanguard_army_desc: "我们的革命必须由模范来以身作则，而别动队将承担这一工作。别动队的成员都是本党精英，他们将会确保国民革命永不被颠覆。愿党国带领我们走向前所未有的伟大！"
 YUN_eliminating_unnecessary_bureaucracy_idea: "清除冗余官僚"
 YUN_eliminating_unnecessary_bureaucracy_idea_desc: "本党一直深受冗员和腐败的困扰，这威胁到了神圣的国民革命。蓝衣社必将以满腔热忱铲除党内的堕落之风，让这段腐化的时代彻底成为历史。反动派和那些堕落的叛徒声称这会阻碍国家的经济发展，但这些西方走狗的话不听也罢。"
 YUN_blueshirt_national_revolution: "蓝衣社国民革命"
 YUN_blueshirt_national_revolution_desc: "本党必不能忘记革命之不朽使命。我们不只是推翻旧的封建制度，因为国民革命并非一场单纯的权力交接。中国的社会、文化、国格与独立都在满人治下腐朽，还遭到了西方唯物主义思想的感染。中国将会在革命之火焰中新生。国民党会确保这火焰永续，万年不灭！"
 YUN_reforming_confucian_doctrine: "改良儒学"
 YUN_reforming_confucian_doctrine_desc: "为了中华复兴，民众需要一种灌输正确价值观的新教条。我们会改造孔学，使其符合现代中国文明。其中包含的道德救亡与民族主义思想正适合中国民众。"
 YUN_unity_of_state_and_media: "国家与媒体的联合"
 YUN_unity_of_state_and_media_desc: "要想真正触及大众的心灵，本党就必须利用媒体来把影响力延伸到社会各个层面中。老百姓会将委员长视为伟大父亲，而国民党也会受到人民的支持。"
 YUN_restoring_spiritual_balance_idea: "重建精神平衡"
 YUN_restoring_spiritual_balance_idea_desc: "才华横溢的陈立夫深刻地认识到，人类问题的根源在于消费与生产这两种互相竞争的经济力量的失衡。物质至上的西方国家专注于生产，而国民党则致力于在消费与生产之间实现必要的平衡，从而造福全体民众。"
 YUN_reaching_a_republican_concord: "与共和派达成协定"
 YUN_reaching_a_republican_concord_desc: "本党虽欲转变中华民国之方向，然而治国就像操作一台运转良好的精密仪器再配上一支精明强干的官僚队伍。昔日北京政府虽由可憎的军阀政客把持，然而国民党必须延揽其精干下属，方能使国家建设事业步入正轨。凡热爱国家之人，国民党皆虚席以待！"
 YUN_reshuffle_the_executive_yuan_idea: "改组行政院"
 YUN_reshuffle_the_executive_yuan_idea_desc: "行政院充斥着狂热的民粹主义者，这些人坚持狂热的革命思想，他们关心的不是推动中国发展，而是将群众煽动为疯魔的群氓。行政院的新成员必须是忠于党的真正事业的人，而不是那些好作煽动蛊惑的大逆不道之徒。"
 YUN_competing_economic_demands: "互不相让的经济需求"
 YUN_competing_economic_demands_desc: "随着[ROOT.GetLeader]统一全国，在四分五裂的中国政治格局中，各阶层的愿望和需求日益清晰且亟待得到满足。广大农民迫切要求土地改革立见成效，士绅阶层与地主阶级则对此坚决反对。城市中心的工人们疾呼党履行承诺帮助他们摆脱困苦境遇，而自由派精英与知识分子群体则期盼国家经济状况能实现快速提升。"
 YUN_power_vacuum_in_the_provinces: "诸省权力真空"
 YUN_power_vacuum_in_the_provinces_desc: "虽然[ROOT.GetLeader]表面上仅统治着神州大地的一部分，但他对那些试图将国民革命引向歧途之人的讨伐，却导致最初不受其控制的各省陷入了近乎无政府的状态。随着战火蔓延，大批前任公务员与官僚纷纷弃职逃离，致使这些省份的管理机构无人照看，重建行政体系则需付出巨大努力。"
 YUN_political_outsiders: "政坛局外人"
 YUN_political_outsiders_desc: "鉴于[ROOT.GetLeader]一直处于国民党政坛边缘，鲜有人预料他能凭借自身实力登上国家领袖宝座，然而历史往往变幻莫测。无论以何种方式崛起，相比政敌与同侪，他所能维系的盟友阵营始终势单力薄，而反对其统治的声浪却在日益高涨。"
 YUN_mass_modernisation_programme: "大规模现代化列装"
 YUN_mass_modernisation_programme_desc: "尽管游击战争和非正规部队为红旗插遍中国做出了关键的贡献，但新中国却不能指望不依靠现代军事力量就能抵御帝国主义的豺狼。雄伟的海军会保护中国的海洋，而强大的空军则会保护中国的领空！"
 YUN_hundred_flowers_campaign_idea: "百花齐放运动"
 YUN_hundred_flowers_campaign_idea_desc: "毫无疑问，我们的革命首先且永远是一场社会主义革命，但它同时也是一场民主革命。必须允许我们的公民发表意见，并就政府的不足之处提出建议，这样我们才能携手建设一个更新更好的中华民国。让百花齐放，百家争鸣！"
 YUN_a_nation_built_on_sacrifice: "牺牲建国"
 YUN_a_nation_built_on_sacrifice_desc: "无人比为中华民族和其数千年之文化真正奉献生命的义士更懂“牺牲”的含义。没有这些勇士，国家早已四分五裂。主要在李根源的力推下，全国修建了多处战争纪念碑。其上镌刻的是我们民族的英雄之名，即使逝去，他们余下的火焰也将长明不灭。"
 YUN_unity_under_the_party_state: "团结于党国大旗下"
 YUN_unity_under_the_party_state_desc: "同盟会为停滞的中国政治舞台带来了许多革命运动，然而除国父手创之国民党外，多数运动皆未结出硕果。作为国民党最强劲的对手，联省运动始终鼓吹实质上导致各省分裂的主张。联省派非但未能促进统一，反而助长分裂。然而，国民党党国治下所推行的是一种联省的高级形式，在此体制下，国家上下将齐心协力谋求整体利益，而非各自为政。"
 YUN_the_mutually_beneficial_deal: "互惠协议"
 YUN_the_mutually_beneficial_deal_desc: "尽管党内多数人对与外国经济利益合作颇有微词，但显而易见的是，中国市场若要推动国家的现代化和发展，就必须再次吸引投资。以我们丰富的资源与蓬勃发展的经济为交换条件，国家将获得走向强盛所需的资金。只需经过几十年的奋发进取，中国便能与世界上最强大的超级大国相媲美。"
 YUN_ashes_of_the_whampoa_model: "黄埔模式之余烬"
 YUN_ashes_of_the_whampoa_model_desc: "黄埔军校这一革命政军体系曾运用政治灌输、专注尚武精神以及发展激进主义为国民革命军赢得了辉煌的胜利，但其已完成了自己的历史使命。全国既已统一，军校昔日学生强烈反对[ROOT.GetLeader]的统治，现在已经有必要将云南讲武堂模式输出到军队的剩余部分。毕竟，多么强烈的意识形态忠诚在爱国主义和对祖国热忱的民族主义面前都要黯然失色。"
 YUN_handshakes_in_the_business_world: "结交商界"
 YUN_handshakes_in_the_business_world_desc: "将政学系草草总结为城市商业利益之党或许言过其实，但不可否认的是，一大批银行家和其他权势人物与计划主义技术官僚阶层携手合作，主导着这个相对平等主义派系的权力中心。利用这些权势人物，可以巧妙地推动中国商界的杠杆，在强有力且谨慎的国家计划下，刺激经济生产力和投资。"
 YUN_the_temple_of_heaven_draft_constitution: "《天坛宪草》"
 YUN_the_temple_of_heaven_draft_constitution_desc: "《天坛宪草》由政学系的前身民宪党颁布，其起草和监督者都是当时国内最伟大的法律专家。面对当时日益猖獗的军头，这部宪法致力于确立宪政政治，巩固民主制度，堪称一部标志性的法律。它因在北京天坛祈年殿起草而得名。\n\n这部宪法经过了反复修改，并在北洋政府的议会中得到推广，但最终还是未能面世。但在政学系的主导下，宪法委员会最终得以重新召集，党的高层人士也参与其中。该宪法包括公民权利不可侵犯、限制总统职权、采用两院制、司法独立等等，与训政时期的专横技官统治相比，是这部宪法的颁布标志着向自由化转向，属实令人惊讶。"
 YUN_support_szc_idea: "支持四川联省派"
 YUN_support_gxc_idea: "支持广东联省派"
 YUN_support_hnn_idea: "支持湖南联省派"
 YUN_joint_committee_of_the_gentry_idea: "士绅一体委员会"
 YUN_joint_committee_of_the_gentry_idea_desc: "为保证全国上下没人都能为民族复兴各尽其分，章太炎将主持设立一个称为“士绅一体委员会”的机构。他们通过纳物纳钱来推进国家的统一运动，支持诸省的互保事业，以最终确保废除督军，在未来解放后的各省重建政治秩序。"
 YUN_mobilising_the_peoples_patriotism: "鼓动民众爱国热情"
 YUN_mobilising_the_peoples_patriotism_desc: "国民党自诩真正的、唯一的群众之政党。荒谬至极！民治党以群众为本，无意“领导”人民，而是让人民真正地当家作主，掌握自己的命运。被横征暴敛的军阀和狼子野心的革命派摧残已久，人们罕有自问：“贫苦大众如何享有福祉？”答案只有：自强、爱国、反帝！"
 YUN_pursuing_the_federalist_revival: "追求联省再兴"
 YUN_pursuing_the_federalist_revival_desc: "世人皆知，此乃联省派抗争中无可回避的真相——唐继尧始终是联省主义最坚定的拥护者，为救亡图存可谓不遗余力。在重九起义、护国战争中，他屡次挥戈而起，讨黔滇之暴君，伐粤桂之逆党，且一直与北京的独夫民贼势不两立。\n\n各省必须保留选举省长与议会之权，国家必须反对军国主义并拥护真正的民治，各地军阀则必须被彻底铲除。唐继尧高举真正的联省主义大旗十余载，亦必将见证真正的联省再兴伟业大功告成。"
 YUN_UPC_popular_support_desc: "二十年代上半叶，现代的中国联省派几番起落。当时军阀混战陷入白热化，南北两方僵持不下，于是立宪派、民主派和地方派联合起来形成联省派联盟。他们呼吁各省携手合作，先实行省级自治，再实现和平统一，进而组建联省制民国。起初这一倡议颇为诱人，进展顺利，可后来竟遭到南北政府拒绝。最终直系军阀成功完成武力统一，联省运动名誉扫地，成为了军阀割据的遮羞布。\n\n而作为多年来联省主义坚定且热切的一大支持者，唐继尧对新联省政府的预言却鲜少有人相信。尽管他坚持反对军国民思想、实行省级选举及宪政治省，但他在西南地区的统治仍然称得上独断专行。要重建对联省运动的信心和希望，无疑是一个巨大的考验，不过云南的联省派也许真的能做到。"
 YUN_UPC_popular_support_1: "护国征途：§R偃旗息鼓§!"
 YUN_UPC_popular_support_1_desc: "$YUN_UPC_popular_support_desc$"
 YUN_UPC_popular_support_2: "护国征途：§O荒腔走板§!"
 YUN_UPC_popular_support_2_desc: "$YUN_UPC_popular_support_desc$"
 YUN_UPC_popular_support_3: "护国征途：§n斗志渐扬§!"
 YUN_UPC_popular_support_3_desc: "$YUN_UPC_popular_support_desc$"
 YUN_UPC_popular_support_4: "护国征途：§C众志成城§!"
 YUN_UPC_popular_support_5: "护国征途：§G正名联省§!"
 YUN_UPC_popular_support_5_desc: "$YUN_UPC_popular_support_desc$"
 YUN_UPC_endgame_popular_support_desc: "二十年代上半叶，现代的中国联省派几番起落。当时军阀混战陷入白热化，南北两方僵持不下，于是立宪派、民主派和地方派联合起来形成联省派联盟。他们呼吁各省携手合作，先实行省级自治，再实现和平统一，进而组建联省制民国。起初这一倡议颇为诱人，进展顺利，可后来竟遭到南北政府拒绝。尽管困难重重，但二十年代的失败，对于联省派来说，似乎只是成功路上的一次小挫折。"
 YUN_UPC_popular_support_rule_of_the_expertocracy: "护国征途：§l专家治国§!"
 YUN_UPC_popular_support_rule_of_the_expertocracy_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n新月社受到全国政府的迫害而转入云南，很少有人能料到他们会如新月般崛起。作为一帮在美国接受教育的清华毕业生，他们显然不止学到了诗歌与文艺，还舶来了英美自由保守主义的政治模式，即对自由、解放、人权的倡导，以及尊重法治及国家执法的能力。新月社既非狂热的革命党，也非疯狂的独裁者，而是身处二者之间，在黑夜中独自散发着皎洁的光芒。随着他们从一家书店发展成了一个政治派系，鲜有人可以否认这些专家、新式“士大夫”在中国民主中不可磨灭的作用。"
 YUN_UPC_popular_support_anathema_to_popular_revolt: "护国征途：§S覆舟之水§!"
 YUN_UPC_popular_support_anathema_to_popular_revolt_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n寸树声出自民盟云南省委，他对于自己社会主义民主改革理想的投入与坚守燃成燎原之势、其志在于席卷全国。寸树声与苏鸿纲坚守革命者的立场，提倡斗争、爱国主义并以教育来实现解放，也反对党国暴政，反对损害中国民主。云南民盟没有被“专家治国”所倡导的威权思想所迷惑，而是专注于民盟的立身之本：民主。"
 YUN_UPC_popular_support_grand_republican_statesman: "护国征途：§m共盟国士§!"
 YUN_UPC_popular_support_grand_republican_statesman_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n唐筱蓂及其新一代共盟继承了父辈的名称与遗产，跨越了空白的时期。新的共盟领导层不仅团结了民治党、致公党，还团结了一切旧联省共和派的团体——包括民新社、九人团、民主科学座谈会及其他较小的团体等。同样，共盟还向民盟多次伸出了橄榄枝，最终希望为一切中国人民建立一个新式民主联省的未来。"
 YUN_UPC_popular_support_arbiters_of_the_nation: "护国征途：§c调停全国§!"
 YUN_UPC_popular_support_arbiters_of_the_nation_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n长期以来，唐继尧都梦想着做政坛上的“同侪之首”，而且他也从来都是这么认为的。如今看来，他实在是当之无愧了。显然，唐继尧身为共和国父，他摆脱了专制的面孔，成为了坚守理想、坚守诺言之人。按唐继尧的指导，中国的联省制和民主制迅速在全国统一后推行开来。虽然是千百年来头一遭，但唐继尧在平衡民众、各省与国家的需求时，全国上下还是充满了乐观的空气。"
 YUN_UPC_popular_support_bearers_of_our_fathers_torches: "护国征途：§g父辈薪火§!"
 YUN_UPC_popular_support_bearers_of_our_fathers_torches_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n中华民国长期以来都由活跃于帝制时期或袁世凯时期的人物主政。尽管青年在一一·四运动、五卅运动及一系列激进学运中表现活跃，但他们比起老迈、过时的政治家们仍是怀才不遇。然而，这些老一辈一个个驾鹤西去之时，年轻人就不得不站起来，一并接过他们的火炬与罪孽。在联省政府草创之时，唐筱蓂只能以其父亲为榜样，带领青年们大步向前。"
 YUN_UPC_popular_support_masters_of_the_eastern_continent: "护国征途：§g东陆主人§!"
 YUN_UPC_popular_support_masters_of_the_eastern_continent_desc: "$YUN_UPC_endgame_popular_support_desc$\n\n没有能比得上唐继尧一般伟大的人物、英雄、爱国者、革命者，或者说军阀了。他是真正的国父，自重九起义起，就在为辛亥革命的价值与美德而英勇奋斗。作为蔡锷的门生，他肩负起了战士的责任，延续着这一崇高的使命。滇系对他忠心耿耿，而他也自命中国政坛上新的主宰。在他仁慈的独裁下，也许有一天，我们会迎来一个真正自由、更加自主也更为民主的共和国。但此时此刻，在共克时艰之时，我们要的是一个中央集权的联省派共和国。"
 YUN_initiation_of_progressive_taxation_idea: "启用累进税制"
 YUN_initiation_of_progressive_taxation_idea_desc: "我们的事业不是为了那些在都市大楼里高高在上的、操纵立法与各种交易的富人而战。如果他们至少想为国家的政务尽己所能、做出一些贡献，就应该从自己殷实的财富中缴纳一部分给国家的政府。没有国家他们无以敛财，所以是时候纳税了。"
 YUN_licking_our_wounds_idea: "舔舐伤口"
 YUN_licking_our_wounds_idea_desc: "连年纷争与割据给神州大地留下了极为深重、不合时宜的创伤。无数家庭支离破碎，省府库存洗劫一空，盗匪流寇肆意横行，各地军阀穷兵黩武更是导致财政开支膨胀。鉴于以上种种积弊，国家从战乱走向统一必然要经历漫长的重建时期，而全国政府对此责无旁贷。"
 YUN_declaration_of_the_middle_class_revolution_idea: "宣告中产阶级革命"
 YUN_declaration_of_the_middle_class_revolution_idea_desc: "若要领导国家走向新的开端，历来只有介于专制精英统治者与驯服农民之间的新阶层才能担此重任。作为那些曾执掌历代王朝的贤能之后，士大夫阶层的思想传人秉承着同样的治国安邦之志与励精图治之才，因此必须促进他们的经济与政治进步。"
 YUN_the_phase_of_national_healing_idea: "国家愈合时期"
 YUN_the_phase_of_national_healing_idea_desc: "纵观国家南北，攻讦与内耗早已深植于软文化思维之中。在桀骜难驯的南方，山川险峻民风彪悍，负隅抵抗外来王朝最久；而在开阔平坦、沃野千里的北方，却弥漫着冷漠的政治观念。然而追本溯源，我们不都是历代先贤的后人吗？"
 YUN_return_to_the_original_solution_idea: "回归最初解决方案"
 YUN_return_to_the_original_solution_idea_desc: "联省主义从未鼓吹过当今某些理论家所推崇的强权民主！联省主义的真谛在于各省在治理能力与行动上的真正独立，在于捍卫国家免受外国侵犯。唯有让各省不受中央政府干涉，国家与人民方能真正享有自由和福祉。"
 YUN_by_presidential_decree_idea: "总执政发布法令"
 YUN_by_presidential_decree_idea_desc: "邦联化何其愚蠢？那样相当于使军阀得以“合法统治”，整个国家形同监狱，把各省困在高墙之内。必须确立一个强大、睿智、开明的行政机构之指导地位来阻止地方主义和分裂主义。“暴政”？让地方强人及其走狗肆意妄为，而不让民意代表来统治，才是真正的暴政。"
 YUN_walking_the_tightrope_idea: "走钢丝"
 YUN_walking_the_tightrope_idea_desc: "我们正处于难以平衡的微妙境地。国家长期以来深陷军人、文官、知识分子和民众之间的冲突，但政府的统治必须遵循温和主义和良知操守，意识形态或赤裸裸的利己态度不应再凌驾于明智而稳定的决策之上。"
 YUN_uncertain_economic_future_idea: "经济前景未卜"
 YUN_uncertain_economic_future_idea_desc: "国家统一使得因连年战争而停滞的中国经济终于重新开始增长。然而，战后初期的经济形势异常艰难：战时经济体制正在瓦解，并逐步向民用经济转型。真正的重建至少需要一代人的时间，但新政府必须解决恶性通货膨胀、高额支出与有限财政收入等迫切问题，才能为新的经济体系奠定坚实基础。"
 YUN_demobilisation_tensions: "裁军困局"
 YUN_demobilisation_tensions_desc: "地方军队的扩张极大加剧了国内动荡，既让地方军阀以暴力手段拥兵自重，也给地方财政带来了沉重负担。若要终结这场危机，就需要裁撤地方军事力量。然而人们普遍预计，此举将会遭到地方当局抵制，他们既担忧中央政府的暴政，也害怕成千上万青壮军人突然失业。"
 YUN_demands_for_democracy_idea: "民主化诉求"
 YUN_demands_for_democracy_idea_desc: "国家重归一统后，各界人士纷纷呼吁政府兑现长期以来的联省民主承诺，为此必须制定国家宪法并举行选举。然而不同的民主理念、对中央政府过度干预或无力制约军阀势力的双重忧虑，以及缺乏强大的民主传统，仍如阴云般笼罩着神州大地。当国家试图化解这些分歧时，依然任重道远——倘若可能的话，最好以和平手段解决。"
 YUN_building_chinese_federalism_idea: "构建中国联省主义"
 YUN_building_chinese_federalism_idea_desc: "建设国家需要付出巨大努力，而构建传统所需心血或许更甚。中国早期对联省主义的探索最终催生了1923年颁布的《曹锟宪法》及1928年的后续修订版。这部表面上倡导联省主义的宪法，实则内容含糊不清，执行力度薄弱，根本无力承载国家根本大法之重责。云南联省派在此郑重宣誓，绝不会重蹈前人覆辙，效仿那些蛊惑人心的投机分子争权夺利的拙劣把戏，而是致力于构建以湘滇两省成功范例为蓝本的新型中华联省主义。\n\n然而，中国联省主义犹如一头难以驾驭的巨兽，存在着无数相互对立的阐释。云南当局正站在抉择的十字路口：是坚守章太炎所珍视的理想，赋予各省近乎邦联形式的广泛自治权；还是转向梁启超系学说，构建一种强调中央集权与威权统治的强力联省民主模式，以期在此基础上奠定中国民众的公民参政传统。"
 YUN_pursuing_the_liangist_ideal_idea: "追求梁启超系之理想"
 YUN_pursuing_the_liangist_ideal_idea_desc: "中国联省方案决定承袭梁启超系传统，以建设民主国家为目标，并展现出了强烈的中央集权倾向。新政权不仅追求强力的内政方针，更渴望推行强势的外交政策。在此背景下，国内广泛的省级权力自然被中央集权政治所取代。但毋庸置疑的是，梁启超系思想与联省主义理想本就相辅相成，唐继尧必将以实际行动证明其所言非虚。"
 YUN_forging_the_great_commercial_circle: "打造宏大商业圈"
 YUN_forging_the_great_commercial_circle_desc: "德国、俄国、英国、法国和美国等国之根基，皆在于三大支柱：农业、商业与工业。此三者乃当今世界现代化进程与文明进步的强大引擎，亦当成为中国现代化建设的核心准则，并最终助其登临顶峰。洗刷百年国耻，并打造可与西方商人及国家企业抗衡的“宏大商业圈”，这些目标虽然远在天边，但这或许正预示着——属于中国的经济世纪就在不远的将来。"
 YUN_buddhism_as_national_binding_idea: "以佛教约束民族"
 YUN_buddhism_as_national_binding_idea_desc: "按章太炎之言，佛教在中华文化圈中占有着重要的地位。其作为一种修身克己的宗教，对信徒除了信仰、功德与戒律之外再无要求。规定佛教为国教自然是对我们共和价值观的绝对冒犯，但佛教仍然可以作为我们民族的共同约束。我们必须先求诸己身，必须行惠民功德，但我们也最终要受传统文化所约束。若能共同秉持普度众生之心，或许连社会主义的吸引也能黯淡失色。"
 YUN_equalisation_of_the_land_yes_equalisation_of_wealth_no_idea: "均田地！不要均贫富！"
 YUN_equalisation_of_the_land_yes_equalisation_of_wealth_no_idea_desc: "国家势必强大，这是不言自明的真理。章太炎对彻底邦联化、妥协和中央集权有所保留，在经济上也是如此。在近乎封建社会的中国，推行平均地权和耕者有其田自然有其理。可是，政府不应强制推行绝对的财富均分、再分配或强行征用，因为这必然会扰乱中国微妙的平衡。只需让乡绅臣服于国家，同时给他们在议会中的一席之地；如此，他们有了合理的发声渠道，人民也能得到应有的正义。"
 YUN_the_promotion_of_positive_thinking_idea: "促进积极思维"
 YUN_the_promotion_of_positive_thinking_idea_desc: "为了纠正数十年来文化上和社会上的积弊，政府开展了一场“促进积极思维”运动，将儒家式的道德和价值观重新灌输到民众心中。同样，必须在民众中培养具有前瞻性思维的知识分子，并优先防止社会道德准则进一步恶化。为了结束军阀时代、向前看，全国必须永远乐观向上，并意识到自己在世界上的地位，而知识分子阶层的责任就是确立这种精神。"
 YUN_mandatory_public_education_idea: "公共义务教育"
 YUN_mandatory_public_education_idea_desc: "云南历来是西南文教昌盛之地，昆明也随之迅速崛起，成为革命者和知识分子思想的汇聚之所。唐继尧对知识分子阶层的偏爱，以及新月社等诸多逃离压迫团体的涌入，进一步推动云南成为真正的文明社会理想国。作为值得效仿的典范，云南首创的施政范式现已推行各省。有了由士大夫精神继承者组成的政府，不出两代人的光阴，普遍文盲现象必将成为过去。"
 YUN_the_anti_partisan_civil_service_idea: "公务员体系去党化"
 YUN_the_anti_partisan_civil_service_idea_desc: "官僚作风的痼疾一直困扰历任中国政府，无能、腐败、徇私。辛亥革命既将平等思想播撒民间，亦使曾受尊崇的士大夫阶层滋生利己之风。鲜有官员能抵制过往中央政府的公然播撒恩惠，而坚守原则者往往被排挤于权力核心之外，也许只有外交系统尚存例外。尽管如此，建立无党派属性的公务员体系仍应成为国家努力追求的典范。正如美国先贤华盛顿和杰斐逊所倡导的那样：官僚必须秉持爱国精神，超越党派归属。官员必须将国家利益置于首位，而非政治。"
 YUN_declaration_of_total_war: "宣告全面战争"
 YUN_declaration_of_total_war_desc: "我们已全面开战！为反对专制而战！为反对暴政而战！为反对企图将中国拖入独裁专制深渊者而战！云南绝不能坐观她为之奋战的民国日益分裂。我们对刽子手和叛徒绝不留情。云南一直是职业军人的摇篮，每一位云南军人都充满责任感、纪律严明、服从命令，并愿意为维护国家完整而牺牲。"
 YUN_the_legacy_of_decades_of_revolt: "数十载抗争的传承"
 YUN_the_legacy_of_decades_of_revolt_desc: "云南是最有资格确保辛亥传承不致湮没之地。选举产生的大总统本应缔造共同的民族国家，然其施政唯见乱象丛生——民生福祉毫无保障，民国政治制度遭到践踏，公权私用比比皆是。重复袁世凯式的阴谋诡计或可欺瞒他省，然而云南民众民众洞若观火——以血与火的洗礼铸就国族统一，乃吾辈传承数十载之天命。"
 YUN_before_lights_out: "希望之火摇曳"
 YUN_before_lights_out_desc: "自由！我们为了自由而战！为了重拾中国在世界舞台上的自信和地位！在通往胜利的道路上，我们不容有失！背水一战亦当奋斗不息，唯有焚尽前路阻碍，方可确保中国回归稳定和谐，而非退回暴政专制。"
 YUN_dead_men_walking: "行尸走肉"
 YUN_dead_men_walking_desc: "我们终是误判了孰优孰劣吗？我们的队伍垮了，士气也一落千丈。我们的人已经无心再战了……要是中国真的无法避免走向独裁，只希望历史能见证我们曾经的斗争……"
 YUN_all_power_to_the_constitutional_government: "全力支持宪政政府"
 YUN_all_power_to_the_constitutional_government_desc: "联省方案绝非一伟人一强省之事，而是关乎中国各省与全体国民之解放的伟业，必须依靠所有志同道合盟友通力协作。为此，云南省府已开始向联省运动的领头省份输送工业资源和物资，以加强双方的联盟。"
 YUN_empowering_of_local_assemblies: "授权地方议会"
 YUN_empowering_of_local_assemblies_desc: "地方自治运动有责任确保中国人民准备好并愿意参与真正的公民民主。因此，各派省级联省运动有必要（至少就我们目前所见）在地方层面赋予民主权力并进行民主实验。省级和国家级宪政固然可以暂缓推行，但首要的是让人民以他们自己的方式熟悉治理之道。"
 YUN_paying_the_cost_for_peace: "付出和平的代价"
 YUN_paying_the_cost_for_peace_desc: "长期如芒刺在背的滇系蒙自派、龙云派，与昆明王之间一直维持着紧张的不稳定和平。在奉行闭关自守政策的当下，迟早须令那些怀有二心的镇守使们臣服。这位深谙权术的督理深知，没有哪位将军能抵挡两万银元的重炮轰击。这笔钱当下或许代价不菲，却能为未来奠定稳固基业。"
 YUN_pursuit_of_the_insular_policy: "推行闭关自守政策"
 YUN_pursuit_of_the_insular_policy_desc: "在中国地缘政治局势允许实行闭关自守、怀柔安抚政策的背景下，随着省界缓冲地带的进一步拓展，缪云台被推至台前全面推行其各项经济改革举措。滇军现已基本停止以武力实现国家统一的积极行动，假以时日，云南必将发展成为一座大都市。"
 YUN_support_for_patriotic_labour_unions: "支持爱国工会"
 YUN_support_for_patriotic_labour_unions_desc: "工人理应获得应有的社会代表权，他们是中国伟大工业化进程中真实、热忱、诚实而真挚的组成部分。但工人们绝不能被那些企图为一己私利而利用他们的革命者误导，也不应让自身的社会角色被政治化。非政治化的爱国主义是我们都应追求的美德，工人们也应意识到这一点。"
 YUN_expansion_of_the_fudian_bank: "富滇银行扩张"
 YUN_expansion_of_the_fudian_bank_desc: "自清朝衰落，中央权力逐渐式微以来，边境省份已出现外国纸币部分取代本土货币的现象。及至辛亥革命爆发、清室倾覆、边疆各省实际独立，某些“积极”的金融家为了以更强势的货币平衡财政，导致此类问题愈发凸显。为掌控货币发行与财政储备，云南全省公钱局遂改组为富滇银行。\n\n发行自己的纸币后，富滇银行的影响力正在稳步提升，但在现任政府迅速扩大其业务范围之前，该行在省内边远地区的影响十分有限。通过将云南全省划分为南北两大经济区，富滇银行分行正以循序推进的方式拓展布局，并逐渐站稳脚根。"
 YUN_the_promotion_of_education_to_the_masses: "推广群众教育"
 YUN_the_promotion_of_education_to_the_masses_desc: "中国不公与不幸的真正根源，并非完全在于农民的困境，而是在于他们的识字率，在于他们接受的教育。任何现代发达社会的根基，都在于由国家维持保障的教育水平。倘若国民皆为文盲，选举投票又从何谈起？作为新兴的人才云集之地，云南必将在推进全国扫盲工作中发挥带头作用。"
 YUN_NPA_popular_support_desc: "在民众看来，军阀的同义词就是飞扬跋扈的霸王：草菅人命、贪婪无度、残暴无知的独夫民贼，周围还有一群腐朽堕落、唯命是从的狗腿子。事实并非如此：许多军阀都接受过良好教育，并密切关注国际政治动态，诚然他们大多有几分冷酷无情，可这种品格在中国并不少见。此外，虽说大多数人都是独裁者，不过也很难独自统治：他们背后都有一张由政客、将军、经济精英、社会名流和知识分子组成的复杂大网，为他们提供着支持。\n\n政治法统是一种极其宝贵的通货。虽然并非所有军阀都“深孚人望”，但他们还是要依靠表面上的稳定和秩序来为自己的统治背书，并维系非正式的人脉网络。因此，他们中的大多数人主业都是与社会各界人士会面、维护各省议会、向慈善机构慷慨解囊……当然啦，维持庞大的安全机构并时不时去亲自监督杀头也必不可少。\n\n滇系对这种情况相当熟悉，并最终推倒了压制自己的东家和空想家。滇系曾为中国而战，付出过牺牲，早已知晓当今世道残酷，理想主义只会导向一塌糊涂。唯有强者才能生存，不脚踏实地就会被这个世道淘汰。"
 YUN_NPA_popular_support_endgame_desc: "在民众看来，军阀的同义词就是飞扬跋扈的霸王：草菅人命、贪婪无度、残暴无知的独夫民贼，周围还有一群腐朽堕落、唯命是从的狗腿子。事实并非如此：许多军阀都接受过良好教育，并密切关注国际政治动态，诚然他们大多有几分冷酷无情，可这种品格在中国并不少见。此外，虽说大多数人都是独裁者，不过也很难独自统治：他们背后都有一张由政客、将军、经济精英、社会名流和知识分子组成的复杂大网，为他们提供着支持。\n\n滇系对这种情况相当熟悉，并最终推倒了压制自己的东家和空想家。滇系曾为中国而战，付出过牺牲，早已知晓当今世道残酷，理想主义只会导向一塌糊涂。唯有强者才能生存，不脚踏实地就会被这个世道淘汰。"
 YUN_NPA_popular_support_1: "共和壁垒：§R狂妄逆贼§!"
 YUN_NPA_popular_support_1_desc: "$YUN_NPA_popular_support_desc$"
 YUN_NPA_popular_support_2: "共和壁垒：§O势如累卵§!"
 YUN_NPA_popular_support_2_desc: "$YUN_NPA_popular_support_desc$"
 YUN_NPA_popular_support_3: "共和壁垒：§n稍加修葺§!"
 YUN_NPA_popular_support_3_desc: "$YUN_NPA_popular_support_desc$"
 YUN_NPA_popular_support_4: "共和壁垒：§C国之干城§!"
 YUN_NPA_popular_support_5: "共和壁垒：§G护国政府§!"
 YUN_NPA_popular_support_5_desc: "$YUN_NPA_popular_support_desc$"
 YUN_NPA_popular_support_the_democratic_fortress: "共和壁垒：§g民主堡垒§!"
 YUN_NPA_popular_support_the_democratic_fortress_desc: "$YUN_NPA_popular_support_endgame_desc$\n\n中国民主政团同盟的运动方兴未艾，中国民主同盟便是其后继者，龙云与中国的这一运动中许多成员关系密切。尽管人们都认为龙云在统治云南时期施行铁腕控制，但他还是设法将自己描绘为民主派。如今龙云成为了中华民国大总统，他寻求将自己“民主堡垒”的模型推广到国家层面。在各位举足轻重的民主派人士的帮助下，滇龙似乎乐见国家走向民主解放，只要他在其中的角色不可或缺。"
 YUN_NPA_popular_support_the_guided_revolution: "共和壁垒：§g指导革命§!"
 YUN_NPA_popular_support_the_guided_revolution_desc: "$YUN_NPA_popular_support_endgame_desc$\n\n尽管再怎么说龙云也很难称得上心向白日，但他始终对中国革命运动抱有同情。然而出于对职责的坚守，以及身为“滇龙”的使命，在他眼中，任何政党都不值得他公开加入或为之采取公开行动。不过，通过率领以自己为名的派系“龙云派”，并任用具有革命信仰的幕僚，龙云最终建立了一个技术官僚政府。这个政府饰以革命的外衣，内核则始终致力于为中国谋求进步。"
 YUN_NPA_popular_support_all_under_the_great_commander: "共和壁垒：§P大帅号令§!"
 YUN_NPA_popular_support_all_under_the_great_commander_desc: "$YUN_NPA_popular_support_endgame_desc$\n\n胡若愚善于结交各派政客军官，不仅在滇系内部步步高升，更在国家权位中崭露头角。虽被视为直系的非嫡系仆从，他却能以一介外人的身份，凭借自己的蒙自派，成功取代直系在国内的地位。胡若愚以武力完成统一，其胆识堪比其精神先驱蔡锷。只要胡若愚继续统治，卿云之治便高枕无忧。"
 YUN_NPA_popular_support_the_new_age_of_export_militarism: "共和壁垒：§P干预再启§!"
 YUN_NPA_popular_support_the_new_age_of_export_militarism_desc: "$YUN_NPA_popular_support_endgame_desc$\n\n卢汉是云南古代英雄们身上那些伟大美德的化身，他为“适者生存”一词赋予了新的意义。卢汉在滇系内部战胜了堂兄龙云和对手胡若愚，现在又登上了全国之巅。卢汉敢于冒险、善于判断，是政坛上最顶级的对面变色龙，他会与革命派、民主派和军阀结盟，并试图保持自己对中国军国主义的主动权，巩固中国在世界舞台上的地位。"
 YUN_celebrating_revolutionary_tradition: "颂扬革命传统"
 YUN_celebrating_revolutionary_tradition_desc: "现代中国诞生于革命热情的烈焰之中，这一点毋庸置疑。中华民族传承着牺牲奉献、英勇无畏的民族精神，因此政府自然应当拥抱、颂扬并赞美这些美德。在这场席卷一切的国内战争中，我们不应否认中国正义青年与公民有权对民族命运的残酷现实表达愤慨，更应引导这份热血，让新中国从灰烬中重生。"
 YUN_hinging_everything_on_total_victory: "一切为了全面胜利"
 YUN_hinging_everything_on_total_victory_desc: "为求毕其功于一役，首战必使敌军阵线溃散、士气丧尽——这正是云南陆军讲武学校训练滇军的宗旨。淬厉坚韧不拔、吃苦耐劳，以及对革命共和理想的坚守，唯有经历此般磨难，方见国家革新与进步。"
 YUN_chinas_praetorians: "中华佽飞军"
 YUN_chinas_praetorians_desc: "滇军以生命捍卫中华共和制度、宪法与疆界，是四万万同胞的最后防线。云南子再度响应号召，为那些常常被首都掌权者遗忘的价值观而战——绝不容专制独裁横行，绝不许法律司法滥用，定以血肉之躯守护五族共和之伟业。"
 YUN_faltering_hopes: "锐挫望绝"
 YUN_faltering_hopes_desc: "这一切为了什么？成千上万健儿究竟为何而死？纪律与为之而战的理由皆尽失去，滇军的士气似乎已经土崩瓦解。倒戈成风，将校投降，失败主义的情绪席卷基层。司令部向省长坚称仍可进军再战，但大多数人看法悲观。"
 YUN_increasing_isolationist_politics: "强化孤立政策"
 YUN_increasing_isolationist_politics_desc: "为避免卷入自身势力范围之外日益加剧的敌对态势，云南省府采取孤立政策，对外宣称放弃问鼎中原之志，唯求偏安西南一隅。为了配合这一转向，督理已下令在滇黔两省战略薄弱处增筑防御工事，深挖壕堑。"
 YUN_culling_incompetents: "淘汰无能之辈"
 YUN_culling_incompetents_desc: "滇军内部仍有不少人效忠于唐继尧等旧政权势力。若无法稳固掌控军事力量，任何一省之主政者都难以久居其位——在高度军事化的云南更是如此。通过迅速彻底的军队清洗、重组缩编部队、提拔关键忠诚将领等措施，滇军正经历一段艰难的重建时期。"
 YUN_continuation_of_the_tang_policy: "延续唐氏政策"
 YUN_continuation_of_the_tang_policy_desc: "尽管唐督理已不能如以往那般牢牢执掌大权，但在历经近期政变与先前动荡后，唐继尧旧政府中的大部分人员仍得以存续。这些官员在维系省府官僚体系免于瓦解方面功不可没，新任督理因此保留了大批原有官员，并决定延续唐继尧政府制定的改革方案——此举虽不失务实，却难免遭致非议。"
 YUN_tribute_for_autonomy: "为自治纳贡"
 YUN_tribute_for_autonomy_desc: "虽未完全臣服，但滇系军阀已至少名义上已向另一位志在天下的中国军阀宣誓效忠。为保全地方自治，避免再度陷入灾难性的侵略战争，云南省府已开始向盟友输送物资与工业援助，权作纳贡之礼。"
 YUN_maintaining_open_mindedness: "保持开放心态"
 YUN_maintaining_open_mindedness_desc: "龙云一贯务实，在事关云南外部定位的事务上，他总是保持开放心态，随时准备做出抉择。无论是与改良派、军阀还是主席，龙云都能与其握手言欢。龙云时而以民主人士自居，时而扮演刚正不阿的一省长官，时而又化作坚韧的革命者，但毋庸置疑的是，在其治下疆域之内，这位云南王施行铁腕统治，任何胆敢显露苗头的不稳定因素都会遭到铲除。"
 YUN_revival_of_export_militarism: "武力干预主义复苏"
 YUN_revival_of_export_militarism_desc: "此前云南历任主政者曾愚蠢地试图全然放弃本省管辖之外的责任与投资，他们选择抛弃全国性的战略抱负，将本派系隔绝于中国其他地区之外，却亲眼见证了云南施加影响的能力大幅削弱——这不仅是在国内，而且在西部和东南部边境地区也是如此。云南素来是西南地区的拥王者，现在正是滇系重振雄风之时。"
 YUN_the_yunnan_provincial_economic_committee: "云南省经济委员会"
 YUN_the_yunnan_provincial_economic_committee_desc: "云南省经济委员会由陆崇仁、缪云台、李培炎、张邦翰等多人联合创立，旨在扭转云南近期面临的严峻经济形势。随着战事持续蔓延、金融和贸易稳定也随之崩溃，云南省经济委员会肩负着寻找新方案以应对当前困境的重任。通过改革税务体系、设立全新征管机构与税收网络、开征新税目、对鸦片等商品实行专卖制度、推进省域银行国有化等措施，云南省经济委员会获得了相对自由的运作空间，可以按照其认为合适的方式行事，以拯救云南经济。"
 YUN_spartan_education: "斯巴达式教育"
 YUN_spartan_education_desc: "寸树声在地方教育事务中贡献卓著，备受推崇，云南省府正大力推广其倡导的“斯巴达式教育”理念。寸树声希望将学生培养为自立自强的斗士，使其能够在承载数千年传统的中华民族当下所面临的严酷困境中生存下来，同时为云南新生代塑造责任意识、荣誉观念、务实精神与创新品格。"
 YUN_establishing_a_provincial_monopoly_idea: "建立省级垄断"
 YUN_establishing_a_provincial_monopoly_idea_desc: "云南新经济模式由陆崇仁设计，围绕“以财政扶持金融，以金融促进生产，以生产充裕财政”的核心理念展开，并通过壮大国有企业和大力改进地方生产方式，同时实施严格的国家垄断专营，力图构建一个可无限持续的经济增长模式。在与缪云台的竞争中，陆崇仁领导的省企业局及四大银行已成为他雄心勃勃经济改革的基石。"
 YUN_architect_of_a_new_china: "新中国的建筑师"
 YUN_architect_of_a_new_china_desc: "缪云台是军阀混战时期最杰出的经济学家之一，曾为历任云南省府效力。他早年间执掌云南锡业公司期间，凭借推动锡业利润大幅增长而声名鹊起，其后更兼任富滇银行行长及省总商会会长。作为云南经济成就的缔造者，缪云台再度与多家外国承包商达成利润丰厚的经济协议，为云南带来了巨大利益。"
 YUN_industrialisation_by_the_train_track: "铁路带来工业化"
 YUN_industrialisation_by_the_train_track_desc: "尽管铁路导致了直系军阀的覆灭，但一个不争的事实是：中国内陆地区至今仍鲜有现代铁路覆盖。作为昆明通往外界最主要的交通命脉，滇越铁路几乎专门用于向印度支那和其他市场出口锡矿、鸦片等货物。中国若想真正成为现代化国家，就必须构建四通八达的现代化铁路网络以支撑其工业化进程。"
 YUN_devastating_economic_catastrophe: "毁灭性的经济灾难"
 YUN_devastating_economic_catastrophe_desc: "在实现国家统一的征程中，中国走过了一段坎坷曲折的道路，历经千难万险。其中最为严重的，莫过于数十年战乱与军阀割据所带来的经济后果。恶性通货膨胀、军阀横行、内战频仍、匪患丛生，各省份之间缺乏财政稳定与协调机制——这些因素共同导致投资者大规模撤离、税赋难以有效征收，甚至始终未能建立起统一的货币与税收体系。值此国家重建之际，当务之急在于集结全国最优秀的人才，全力修复当前严峻的经济困境。"
 YUN_inexperience_and_lack_of_cohesion: "经验不足，缺乏团结"
 YUN_inexperience_and_lack_of_cohesion_desc: "滇系在政治上远非铁板一块，为了争取各地形形色色政客、军官和官僚的支持，与生俱来的共和实用主义便是滇系当时唯一的统治理念。同样，云南的政治生态也决定了，个人在省内成功的关键往往取决于自身实力。然而在滇系崛起并统治国家舞台后，局势就变得错综复杂——既需要高超的政治手腕在各方间周旋，又要面对各类有组织的政治派系为了某一议程而围攻中央政府。"
 YUN_the_state_within_the_state: "国中之国"
 YUN_the_state_within_the_state_desc: "作为中国尚武传统和近代军阀根基的继承者，不出所料，滇系固有的弊病正随着其新近的成功与征伐而再度浮现。由于需要治理远超本省疆域的大片领土，国家军已然成为高度军事化、过度膨胀的庞然大物。统一以来屡次发生违抗军令事件，加之军中弥漫着某种自认有权主导国家的“拿破仑式”信念，这支军队实际上已演变成国中之国，正以其反复无常的意志将国家挟为人质。"
 YUN_of_many_cultures_and_many_histories: "多元的文化与历史"
 YUN_of_many_cultures_and_many_histories_desc: "北洋政府建立在“五族共和”的基础上，长期以来一直奉行汉、藏、满、回、蒙五族和谐共处的理念。尽管我们努力构建中国人这一“整体”身份认同，并将之作为一种团结各民族的情感，但其仍不足以充分代表组成中华民族国家的多元族群。在呼伦贝尔和巴尔虎，达斡尔族曾主张建立六族共和，而蔡锷本人则在1911年主张建立七族共和，在原有的五族共和基础上增加了苗族和僚族。\n\n然而，中国是一个多民族国家：壮族、彝族、土家族、布依族、侗族、瑶族以及其他少数民族共同构成了中华民族的身份认同。因此，作为全体中华儿女的代表，在这个由彝族大总统治理的国度里，我们必须秉持多元文化认同，重视对少数民族文化的保护，并反思我们共同的历史。"
 YUN_the_roulette_of_backstabbing_and_betrayals: "背刺者与叛徒的轮盘赌"
 YUN_the_roulette_of_backstabbing_and_betrayals_desc: "滇系或许是整个军阀混战时代最血腥、最卑鄙的军阀集团之一，始终缺乏明确的“领袖”，鼎盛时期的唐继尧勉强算是最接近这一地位的人物。当外部威胁消除后，同室操戈的祸水便转向内部——结义兄弟反目成仇，政变阴谋层出不穷，这些都在意料之中。继罗佩金、朱德、顾品珍、龙云、唐继尧之后，卢汉与胡若愚正在为争夺最高权力展开残酷较量。这场博弈的赌注已达巅峰，胜者不仅将掌控滇系与云南，更将问鼎全国。"
 YUN_national_youth_league_affairs_bureau: "全国青年团事务局"
 YUN_national_youth_league_affairs_bureau_desc: "云南青年团事务局最初是在滇系支持下成立的省级机构，旨在培养下一代青年，如今已成为全国效仿的典范。青年团不仅向青年灌输政府理念，更致力于将其培养成为中华民族国家效力的士兵与建设者，使其深刻认识对国家整体应尽的责任以及对政府与军队的义务。在个人政治活动不受限制的前提下，全国青年团事务局始终坚持非政治化培养原则，通过对青年施加影响来实现教育目标，其运作模式既不同于国民党相关机构，也有别于中国青年党的类似举措。"
 YUN_obligations_of_the_military_idea: "军队之义务"
 YUN_obligations_of_the_military_idea_desc: "统一、自强和共和革命的战士们注定要引领中华民族国家步入繁荣新纪元。职业军人既肩负捍卫中国国内外利益之天职，在参与国政时亦当秉持行伍生涯之准则。虽然文职领域最好交由文人打理，而武人则应留守军事领域，但国家若面临颠覆或其他危险，军官自当挺身而出，将国家带回正轨。"
 YUN_striking_a_mutually_beneficial_deal: "达成互惠协议"
 YUN_striking_a_mutually_beneficial_deal_desc: "长期以来，士绅阶层一直是中国繁荣昌盛的支柱，但在战乱时期，为了保卫国家免遭帝国主义入侵，不得不牺牲诸多权益、采取一切必要手段，致使他们在国家政治中的权力与话语权大不如前。然而，随着和平时代的到来，他们不仅开始对遍布各地的军政要员心生抵触，更在民众暴动与匪患猖獗的重压下渐显不安。\n\n通过安抚士绅阶层并保障其在中国国家和谐格局中的地位，同时护其周全以抵御重大威胁，政府将在经济发展和政治稳定方面获得巨大助力，士绅阶层则将帮助恢复秩序和财政。然而，某些同情民众疾苦之人指出，所谓的“互惠协议”只是权宜之计，虽解眼前之急，却埋下长远祸患。"
 YUN_fallout_of_the_gentry_deal: "士绅协议的冲击"
 YUN_fallout_of_the_gentry_deal_desc: "尽管官方一再保证，但这份至少是通过握手和承诺达成的非正式“互惠协议”，已演变成针对中央政府的公开抗议。各大报刊纷纷对政府的土地改革策略进行驳斥和批判，这种明显带有偏袒“土豪恶霸”而非普通民众倾向的宣传，也引发了民众的强烈反弹。不仅如此，随着影响力和财富的不断积累，土豪们甚至开始逃避对国家的义务，偷税漏税，甚至无视国家对其事务的干预。"
 YUN_responsibility_for_the_nation_state: "对民族国家的责任"
 YUN_responsibility_for_the_nation_state_desc: "中华民国大总统之职责在于构建一个共同的民族国家，让每个公民都能为民族国家的福祉和生存承担各自的责任。因此，大总统的各项决策必须始终遵循宪政精神、维护国家统一，超越任何党派利益与其他效忠关系。在强有力的大总统和高度集权的共和体制下，中国必将确保实现稳定、进步与和谐。若以上任何一条未能实现或被忽视，国家最重要的否决权便掌握在其禁卫军——武装部队手中。"
 YUN_economic_regulation_committee: "经济管制委员会"
 YUN_economic_regulation_committee_desc: "现今的国家经济管制委员会，其前身源于云南省为实现税收制度现代化、减少低效而成立的政府机构。该委员会职能范围广泛，肩负着整顿国家财政、刺激投资、造福民生等重任。废止一切旧债苛捐，将货币精简为具有抗风险能力的新版纸币，明定税制标准（现存每块银元按五元纸钞计征），以及对奢侈品征收额外税款，这些只是经济管制委员会众多任务中的一小部分。\n\n同时，经济管制委员会还将帮助加强和巩固国家对各关键国有产业的垄断，促进本地和国际投资，偿还外债，以及促进中国的工业化进程。"
 YUN_the_three_trainings_and_three_commandments: "三训三戒"
 YUN_the_three_trainings_and_three_commandments_desc: "滇系的安恩溥提出了一种名为“三训三戒”的严肃作战理念，要求军队严格遵守以加强军纪、改过自新。“三训”指的是“诚字神圣，勤字万能，我字万恶”，“三戒”则是“戒赌博、戒吸毒、戒好浮”。\n\n士兵们必须日夜严格反腐，牢记自己的职责和荣誉，拒绝贿赂、欺民或违法乱纪行为，以避免侵害公众。"
 YUN_focus_tree: "滇系军阀国策树"
 YUN_maintaining_the_paradigm: "维持现有模式"
 YUN_maintaining_the_paradigm_desc: "云南的经济早已岌岌可危、濒临崩溃，穷兵黩武本就使其孱弱不稳，黑色星期一更是让这栋摇摇欲坠的沙上之塔轰然倒塌。时间紧迫：我们必须设法利用云南有限的资源挽救经济于既倒，否则我们的雄心壮志将因为经济崩溃而胎死腹中。"
 YUN_alleviate_the_gentry: "士绅减负"
 YUN_alleviate_the_gentry_desc: "士绅阶层在云南历史上扮演着举足轻重的角色，因而自然在当前经济危机中遭受重创。蔡锷领导云南省走向尚武与军事化，而唐继尧则试图在一定程度上缓和军事化。面对百业萧条的局面，必须帮助经济重归正轨，而这正要从扶持士绅开始。"
 YUN_expanding_tin_exports: "增加锡矿出口"
 YUN_expanding_tin_exports_desc: "失业是当前经济危机下的另一个主要问题。幸运的是，我们可以利用云南一贯丰富的锡矿资源来解决这个问题。通过扩大锡矿开采规模，我们将为失业人员提供更多就业岗位，同时也能进一步开发云南丰富的锡矿资源以扩大出口。"
 YUN_dual_development: "两手齐抓"
 YUN_dual_development_desc: "尽管云南的工业实力仍然不足，但其自然资源十分丰富。虽然传统上以出口为主，然而云南的资源也可以用来发展国内轻工业，从而实现经济多元化。那些未被出口到西方市场的资源，应当被用来发展云南各城市蒸蒸日上的轻工业。"
 YUN_nationalisation_of_critical_industries: "国有化关键工业"
 YUN_nationalisation_of_critical_industries_desc: "当前的经济危机绝不能放任自流，听凭自由市场摆布。省府必须采取更为积极的干预策略，而这需要开辟更多财源。此外，国有化政策还能让政府为失业者创造新的就业机会，防止士绅虐待劳工，并让云南做好应对战争的准备。"
 YUN_appealing_to_berlin: "呼吁柏林"
 YUN_appealing_to_berlin_desc: "云南与国际市场的主要纽带是法国修建的滇越铁路，这条铁路也是滇系最主要的军火供应渠道。德国人后来继承了这条铁路的权益，但并未延续同等规模的军火贸易。为争取柏林方面的支持，我们当然可以承诺会严管越南劳工行为，并加强肃清匪患的力度……"
 YUN_centralising_taxation: "集中税收"
 YUN_centralising_taxation_desc: "云南经济长期受到税收效率低下的困扰。由于官员腐败和缺员的问题，多次集中化和精简化的尝试皆告失败。对省税收的需求既增，全省须将税收机制集中至一个统一的财政厅下，而不是使多个独立税局各自处理。"
 YUN_kunming_to_guiyang: "从昆明到贵阳"
 YUN_kunming_to_guiyang_desc: "自元代将西南边陲纳入中国版图以来，云南和贵州两省就因共同的自然和地理因素而同呼吸共命运。而从清末起，滇黔二省就一直患难与共。可悲的是，北伐之后二省被迫分离，唐继尧占据了昆明，而贵州则在国民党统治之下。而如今，滇黔二省将再次高举同一面旗帜，永不分离！"
 YUN_united_xinan_model: "西南统一之模范"
 YUN_united_xinan_model_desc: "云贵两省虽已归一统，但仍有许多工作要做。长久以来，西南地区一直是全中国最欠发展的区域，而至今为止的经济改革亦收效欠佳。只有各省先得以从积贫积弱与外国统治中自我解放，才可能让全中国从百年国耻中脱身，而云贵会做解放的排头兵。"
 YUN_develop_yunnans_smelting_company: "发展云南冶炼企业"
 YUN_develop_yunnans_smelting_company_desc: "唐继尧的雄心不仅在于工业化，还着眼于矿业振兴。作为云南经济的核心支柱之一，唐继尧试图打破外国在采矿业的主导地位，但收效甚微。经济现代化的另一个关键途径是冶炼厂，如果云南要成为一个现代化省份，云南的冶炼业必须与本土采矿业齐头并进，由本省企业主导经营。"
 YUN_provincial_reconstruction: "省内建设"
 YUN_provincial_reconstruction_desc: "长期饱受无休止的危机重创，云南依然深受贫困、匪患与军事化创伤的困扰。历届云南主政者虽能在短期内有效遏制匪患，但唯有经济复苏才能从根本上终结云南的匪患问题。士绅、农民和政府将携手并肩、同心协力，为云南省带来急需的救济。"
 YUN_financial_regulation: "金融监管"
 YUN_financial_regulation_desc: "云南赋税杂乱无章的状况可追溯至清朝，末任云贵总督李经羲曾力图整顿税制，但在辛亥革命爆发前收效甚微。即使在李经羲去职二十载后，云南沉疴依旧，税制亦未见革新。若想振兴云南，身为一省长官的[ROOT.GetLeader]终须着力完善税收与财政体系。"
 YUN_centralised_planning: "集中计划"
 YUN_centralised_planning_desc: "将经济任由市场摆布会使其易受外国控制，这种命运中国人民再熟悉不过。现代化进程必须由省府采取强硬的政策扶持，才能将经济推向良性发展轨道，确保云南与贵州两省如精密齿轮般紧密协作，最终实现两地人民的共同富裕。"
 YUN_cultivating_the_bureaucratic_apparatus: "培育官僚机构"
 YUN_cultivating_the_bureaucratic_apparatus_desc: "如果没有完善的官僚体系，国家就无法有效调控和管理经济。尽管士绅不希望政府插手他们的事务，但政府必须这样做，士绅阶层虽在云南广受尊敬，却也是我们议程的障碍。云南省经济委员会将在士绅的支持下，协助监督云南的冶炼、采矿现代化和农业发展。"
 YUN_militarising_guizhous_ironwork_industry: "贵州钢铁工业军事化"
 YUN_militarising_guizhous_ironwork_industry_desc: "云南和贵州虽然统一于同一旗帜之下，但仍落后于相邻省份。云南的军事化措施是滇黔两省人民抵御北部和东部威胁的唯一可行选择。贵州的军事化程度与云南相比仍然较低，其资源必须由昆明调集，以抵御共同的威胁。"
 YUN_promoting_self_sufficiency: "推动自给自足"
 YUN_promoting_self_sufficiency_desc: "我们被迫侍奉的帝国主义者们在西方都市里纸醉金迷，而中国人民则在贫困中沉沦，终日生产暴利品和必需品供他们消费。资本主义的流毒蹂躏了我们的土地，迫使所有人都加入这一链条；但[ROOT.GetLeader]的政府将会尽一切可能与西方保持距离。帝国主义的无耻敲诈必亡，中华民族的永恒精神万岁！"
 YUN_begin_grand_southern_reconstruction_project: "华南大建设方略"
 YUN_begin_grand_southern_reconstruction_project_desc: "自百年国耻以来，云南一直饱受战乱之苦。然而，政府的改革雄心最终将通过华南大建设方略得以实现——这是迄今为止最为雄心勃勃的经济改革计划，该计划不仅将推动云南，还将带领华南地区乃至整个国家迈入现代化！[ROOT.GetLeader]万岁！"
 YUN_streamline_superfluous_taxes: "精简苛捐杂税"
 YUN_streamline_superfluous_taxes_desc: "清朝时期，云南省内众多税务机构彼此独立，给昆明省府带来诸多困扰。晚清改革时期，省府虽然尝试过集中税收，但由于士绅的反对，最终未能全面落实，民国建立后云南又陷入战乱。如今，云南税收改革方案终于出台。"
 YUN_resurgent_south: "复兴华南"
 YUN_resurgent_south_desc: "日复一日，昆明的工厂如雨后春笋般焕发生机。滇货出口为云南人民带来了丰厚收益，而非滋养西方列强。自清末以来，华南经济因疏于管理而停滞不前，而今随着华南大建设方略的全面推进，这片土地终于迎来了期盼已久的发展。华南将如凤凰般浴火重生，中华世纪即将到来！"
 YUN_waking_the_tiger: "唤醒勇虎"
 YUN_waking_the_tiger_desc: "自从蔡锷执掌云南以来，他就不得不在军国主义野心和改良主义理念之间取得平衡，最终他选择了将云南高度军事化。唐继尧虽然试图重新平衡经济，但也不能放弃军国主义。随着政府将注意力放在了经济改革上，我们现在正处于是要继续军事化还是全面平衡经济的十字路口上。"
 YUN_national_defence_economy: "国防经济"
 YUN_national_defence_economy_desc: "云南正处于群狼环伺之中。即使坐拥广州的财富，国家也必须做好准备，推动中国工人、商贾、士兵齐心协力。唯有高度重视纪律，才能激励全体国民为实现国家统一而付出汗水、鲜血、泪水，最终实现民族重生。没有军队，就没有新中国！"
 YUN_funding_the_guangxi_reconstruction_movement: "广西建设运动"
 YUN_funding_the_guangxi_reconstruction_movement_desc: "与云南一样，广西也曾推行了数十年的军事化计划。在李宗仁及其新桂系的短暂统治期间，当地推行了广西建设运动，在遵循陆荣廷军事化原则的同时推动省份现代化。尽管改革规模不及云南，但支持广西建设将为华南战争机器注入动力。"
 YUN_urban_self_initiatives: "城市自治计划"
 YUN_urban_self_initiatives_desc: "清末新政时期，云贵总督李经羲曾推行雄心勃勃的官僚与经济改革计划，最终因士绅阶层反对而仅限于省内大城市推行。当今中国通过中央统筹推进全方位改革的同时，赋予中心城市适度自主权或将成为孕育未来改革的重要路径。"
 YUN_dictating_foreign_trade: "支配对外贸易"
 YUN_dictating_foreign_trade_desc: "多年来，来自日本和西方的外国商人一直在掠夺我们的资源，扼杀中国生产者的生计，这种情况必须终结。我们将实施保护主义政策，让财富流入人民手中，而非填满那些剥削我们数百年的掠夺者的口袋。西方势力曾在“一口通商”（广州通商体系）下被拒之门外，这种情况将再次发生。"
 YUN_merchants_under_the_state: "商人归国家管"
 YUN_merchants_under_the_state_desc: "在早期广东政府的治理下，商团享有的自由程度之高，与云南士绅如出一辙。商团利用政府的宽容优待，窃取中国人民的财富，更为西方列强及日本充当征税爪牙。为了将国家团结在同一个爱国方向上，我们必须剥夺商团享有的自治。"
 YUN_industrial_self_reliance: "工业自力更生"
 YUN_industrial_self_reliance_desc: "尽管华东地区从外商投资和外资在华工厂中获益良多，但云南的地理位置和区位优势决定了其必须采取更加自给自足的政策，以免像过去几十年一样沦为列强的原料供应地。采取这种更注重自力更生、自给自足乃至带有重商主义色彩的工业现代化路径，将确保华南地区的发展继续依靠自身力量。"
 YUN_expanding_the_kunming_arsenal: "扩建昆明兵工厂"
 YUN_expanding_the_kunming_arsenal_desc: "昆明不能总是倚仗群山环抱，必须时刻枕戈待旦做好防御准备，这意味着需要大量装备才能立于不败之地。投资兴建新工厂不仅能造福昆明城，更能为云南其他地区乃至更广阔地域构筑更坚实的生命线。昆明兵工厂必将超越汉口、太原与沈阳兵工厂！"
 YUN_union_of_state_and_industry: "国家和工业的联合"
 YUN_union_of_state_and_industry_desc: "在现代，要使军队现代化，必先使经济现代化。而要使经济现代化，国家的官僚系统必须高效运作。南方现代化的伟业需要各方不遗余力，需要经济所有领域和政府大小部门的全面合作。云南必须成为战争与现代的精锐机器。"
 YUN_the_south_unshackled: "挣脱枷锁的华南"
 YUN_the_south_unshackled_desc: "自明朝覆灭以来，华南大地饱经沧桑，尽显颓败。在百年国耻的岁月里，无数爱国志士眼睁睁看着曾经的世界中心惨遭欧洲列强与日寇蹂躏。而如今这片土地已告别阴霾，广州政府正迈向现代化、复兴和自由！"
 YUN_southern_reconstruction_commission: "华南建设委员会"
 YUN_southern_reconstruction_commission_desc: "尽管[ROOT.GetLeader]政府处境岌岌可危，但这也为中国的复兴提供了独特机遇。云南近代长期饱受穷兵黩武之苦，但如今军事化机构正处于低谷，重新平衡云南经济终于成为可能。中国若要繁荣，就必须恢复元气，获得喘息的空间。为此，华南建设委员会将是摆脱军事化、走向繁荣的第一步。"
 YUN_promoting_national_light_industries: "鼓励民族轻工业"
 YUN_promoting_national_light_industries_desc: "百年国耻曾使中国民族轻工业蒙受重创，加剧了人民的苦难。如今，这种悲惨境遇已不复存在！通过大力推进现代化建设、产业升级与改革创新，我国轻工业终将实现其应有的繁荣，并帮助中国人民摆脱帝国主义的阴影。"
 YUN_promoting_foreign_investment: "鼓励外国投资"
 YUN_promoting_foreign_investment_desc: "广州的重要性，无论对于华南还是整个中国而言都不容小觑。清朝时期推行的“一口通商”（广州通商体系），既有效管控了西方在华贸易，更让北京与西方保持贸易顺差。一口通商虽在鸦片战争后被废除，其影响却延续至今。中国若想实现繁荣复兴，就必须鼓励与西方的贸易，但也不能损害中国企业的利益，双方都必须从这一制度安排中获益。"
 YUN_friendly_but_cautious: "亲而慎之"
 YUN_friendly_but_cautious_desc: "外资固然是推动国家经济发展所必需，但在引进过程中也需审慎行事，避免再度陷入过度依赖帝国主义列强的陷阱。东北的张作霖大帅无可救药地依赖东京，这对中国其他地区来说便是前车之鉴。中国会用坚定的握手和友好的微笑迎接西方，然而也需始终保持警惕。"
 YUN_developing_the_middle_man: "发展中间人"
 YUN_developing_the_middle_man_desc: "为了确保外商在广州的投资一切按计划进行，并最大限度地提高其效率，政府必须承担起外企和广州商人之间的中间人角色，对国外投资提供必要的监督和合理的指导。"
 YUN_cantonese_trade_ties: "广东贸易纽带"
 YUN_cantonese_trade_ties_desc: "素有花城之称的广州是极其重要的贸易枢纽，通过利用其与云南的贸易联系，必将有力推动经济快速发展。中国经济的腾飞不应依赖外国列强，而应依靠各省之间的坚实联系与情谊。"
 YUN_promoting_economic_integration: "华南省际贸易"
 YUN_promoting_economic_integration_desc: "为了充分发挥华南地区的经济潜力，必须推进经济一体化。昆明和广州在一体化进程中已经取得了显著进展，现在是时候加速推进，让这一进程顺利完成。云南将在中国国内经济中扮演不可或缺的角色，从而找到现代化发展之路！"
 YUN_guangzhou_and_kunming_united: "春花双城记"
 YUN_guangzhou_and_kunming_united_desc: "在新管理层的领导下，昆明现已真正成为中国最重要的经济区域之一。随着与广州合作的深化和区域融合的持续推进，中国跨区域贸易开创了崭新局面，经济发展态势达到历史新高度。愿中国繁荣昌盛！"
 YUN_investment_in_mining: "投资采矿业"
 YUN_investment_in_mining_desc: "云南的锡出口已经扩大，且冶炼皆于本地完成。然而这还远远不够：云南乃至中国要想继续坚定迈向现代化，就必须进一步发展采矿业。云南的矿产资源依然十分丰富，现在只需进一步开发利用。个旧不仅将主宰亚洲市场，欧洲市场亦不例外！"
 YUN_rural_demilitarisation: "农村去军事化"
 YUN_rural_demilitarisation_desc: "唐继尧督理看到了云南持续军事化所带来的问题，并试图采取多项应对措施，而如今的[ROOT.GetLeader]政府将更进一步。非军事化旨在消除农村地区的凋敝，这是蔡锷军事化政策最严重的恶果之一。最终实现农村地区的非军事化将大大减轻民众的负担，并重燃他们对美好经济未来的希望。"
 YUN_balancing_the_budget: "平衡预算"
 YUN_balancing_the_budget_desc: "过度的军费开支几乎将云南经济推向崩溃，导致预算日益失衡，并累积了巨额债务。如今是时候削减持续不断的军费开支，并专注于偿还债务了。如果没有合理平衡的预算，通往现代化的大门将永远关闭。"
 YUN_guangzhou_kunming_rail: "广昆铁路"
 YUN_guangzhou_kunming_rail_desc: "是时候推动国内跨区域贸易进一步现代化了：随着广州和昆明之间的全新铁路建成，更多贸易将通过广州进行，这自然会减少我们对德国的依赖。在此新发展格局下，云南终将摆脱延续数十载的经济桎梏。"
 YUN_prosperous_south: "繁荣之华南"
 YUN_prosperous_south_desc: "在数十年的穷兵黩武之后，华南地区如今走上了新道路。云南曾是与广西并列的南方军事重镇，而昆明如今却展现出和平现代化的崭新面貌。尽管中国大部分地区仍处于战乱之中，饱受战火摧残，但华南地区已翻开新的一页，为全国树立了榜样！"
 YUN_backbone_of_the_south: "华南支柱"
 YUN_backbone_of_the_south_desc: "纵观中国历史，农业一直占据着至关重要的位置。中华文明发源于黄河流域的麦作农业，随着版图向南拓展，稻作种植也融入了中国农业。数千年来，农事活动始终是国人生存发展的根基所在，因此农业现代化改革自然是我们的首要任务。"
 YUN_mechanising_agriculture: "农业机械化"
 YUN_mechanising_agriculture_desc: "在现代社会，如果没有合适的机械工具，农业就无法发展。新型工业机械极大地提高了农业产量，中国若想与列强竞争，就必须充分利用机械化农业的力量。中国农业将不再单纯依赖人力，现在我们的农民必须顺应机动化机械化趋势。"
 YUN_land_to_the_tiller: "耕者有其田"
 YUN_land_to_the_tiller_desc: "国民革命的最终目标是建立一个平等、复兴的中国，并让每位公民满怀爱国热情。为此，不仅要实现中国农业现代化，更要实现农民间的平等。孙中山在他振兴华夏的宏伟蓝图中首倡“耕者有其田”，随着国民党在本土再度兴起，先总理的遗志必将得到贯彻。"
 YUN_ending_rural_overtaxation: "废止农村苛捐杂税"
 YUN_ending_rural_overtaxation_desc: "在过去几十年间，农村地区饱受苦难，城镇化和发展项目严重滞后，更是常年承受苛捐杂税之苦。为筹措昆明发展所需资金，各类征税机构纷纷设立，然而缺乏统一监管致使税收体系混乱失序。现在终于到了纠正这一问题的时候了：一场场乡村建设运动将在各地开展，过高的税赋也将得到削减。"
 YUN_material_reconstruction: "物质重整"
 YUN_material_reconstruction_desc: "农业领域遭受的物质损失之大，无论怎样强调都不为过。为了使其摆脱近乎瘫痪的状态，必须进行大规模的物质重整，政府当然会采取行动提供支持。军阀时代连绵不断的战乱加上盗匪横行，使云南人民的物质生活跌至历史最低点，而现在国民党将提供唐继尧未能提供的援助。"
 YUN_commercialising_agriculture: "农业商业化"
 YUN_commercialising_agriculture_desc: "随着农业领域逐渐重回正轨，新的经济增长机遇正在涌现：农业商业化就是其中之一。特别是丰富的茶叶和丝绸资源，可通过出售获取巨额利润，从而极大提振经济。中国式农业商业化不仅能让财富流入政府，还能惠及民众。"
 YUN_liberated_agriculture: "解放农业"
 YUN_liberated_agriculture_desc: "华南地区虽尚未迎来真正的社会革命，但也迈出了几十年来的首次正确步伐。[ROOT.GetLeader]政府推行的改革举措，不仅将造福华南人民，更将成为全国性改革的灵感源泉。这场变革标志着百年国耻即将迎来终结，以及中国将作为平等伙伴在世界舞台上重新崛起。"
 YUN_maintaining_the_course: "延续改革"
 YUN_maintaining_the_course_desc: "毫无疑问，农业领域迫切需要一次近乎彻底的变革。军阀混战时期，云南的农业状况已严重衰退，亟需大规模重建。尽管云南的农业模式进展缓慢，但它是经过数十年反复试验、谨慎探索而最终形成的。如今，终于到了展现数十年经验积淀之功的时刻。"
 YUN_the_opium_question: "鸦片之问"
 YUN_the_opium_question_desc: "自上个世纪以来，云南人民一直饱受鸦片毒害。鸦片在云南经济中的广泛存在，使其根除也尤为困难。唐继尧曾多次试图禁种罂粟，但此举损害了当地经济，并使许多贫困地区陷入匪患横行、乱象丛生的境地。直至今日，是否应该重启鸦片禁令，还是仅对鸦片征税，仍是一个悬而未决的问题。"
 YUN_developing_local_granaries: "发展地方粮仓"
 YUN_developing_local_granaries_desc: "粮食在华南至关重要，尤其是在饥荒持续威胁粮食供应的情况下。在农业领域完全恢复之前，毁灭性饥荒的威胁依然存在，因此，在华南地区建设并改进粮仓以更有效地储存更多粮食才是明智之举。此举不仅有助于缓解四川目前遭受的饥荒威胁，也有助于保障当地军队补给。"
 YUN_dual_policy: "双管齐下"
 YUN_dual_policy_desc: "虽然士绅不能完全掌控政府政策，但他们的合作也同样重要，李经羲对此深有体会。无论士绅对政府改革的影响如何，他们都将对地方经济发展起到积极作用。通过激励士绅，既能推动私营产业发展，又能增加国库收入，从而为政府项目注入更多资金支持。"
 YUN_land_reclamation_initiative: "土地开垦倡议"
 YUN_land_reclamation_initiative_desc: "华南地区的土地开垦长期以来未获重视，直到如今才有所改观。唐继尧统治初期设立的开蒙垦殖局将助力农业现代化与财政收入增长。开蒙垦殖局将增加首都的粮食供应，并有望提高丝绸和稻米的产量。虽然垦殖局最初并不成功，但我们将加大投入力度，确保此番重整旗鼓不会重蹈覆辙。"
 YUN_modernism_with_yunnanese_characteristics: "云南的现代化之路"
 YUN_modernism_with_yunnanese_characteristics_desc: "云南的独特之处在于其政治史上一脉相承的改革传统，从李经羲到蔡锷、唐继尧，改革议程代代相传。[ROOT.GetLeader]始终以持之以恒的稳健步伐推进改革，这种路径虽不似国民党纲领那般激进，但长远来看必将收获更丰硕的成果。通往现代化的道路建立在延续性之上，而非咄咄逼人的辞藻。"
 YUN_white_sun_ascendant: "白日升"
 YUN_white_sun_ascendant_desc: "国民党梦想最早诞生于太平天国起义几十年后。同盟会厌倦了清朝的软弱和外国的统治，并承诺将带领中国摆脱帝国主义和满清专制。1924年的国民党改组发出了国民革命号召，尽管国民革命曾在1927年一度陷入困境，但现在的国民党不仅恢复了活力，更取得了胜利。中华民国万岁！"
 YUN_rebuilding_local_administrations: "重建地方政府"
 YUN_rebuilding_local_administrations_desc: "国民党政府现已控制了大片曾经被腐败和权力欲极强的军阀统治的领土，当前要务在于重建地方政府，以更好地促进国家建设与统一大业。"
 YUN_expand_the_legislative_yuan: "扩展立法院"
 YUN_expand_the_legislative_yuan_desc: "作为建国大纲的一部分，先总理称政府应当权能分立。右派流亡时立法院仍在继续运作，而如今我们已经掌控了整个中国——现在可以扩大政府的立法机关，吸纳更多的声音进入全国的议会体制实践中。"
 YUN_inaugurate_the_smaller_yuans: "设立两小院"
 YUN_inaugurate_the_smaller_yuans_desc: "考试、监察两院是孙中山先生规划的五权宪法中两个规模较小但独立运作的部门，负责考核官员与肃清贪腐。考试院通过严格把关考试质量，确保所有考生都能获得公正、平等的录用机会；监察院则承担审计公务部门与弹劾违法官员之职能。"
 YUN_daughters_of_a_new_china: "新中国的女儿们"
 YUN_daughters_of_a_new_china_desc: "在新生民国里，我们有责任为本国女性指明道路。长期以来，新中国的女性饱受西方不道德和堕落习俗的压迫，她们应当成为衣着端庄的模范女性，并努力培养家庭中的母爱和对祖国的热爱之情。"
 YUN_the_new_life_movement: "新生活运动"
 YUN_the_new_life_movement_desc: "国民党的国民革命不仅是一场反对帝国主义的革命，更是一场革除腐朽旧文化的社会革命。人民不仅要通过培养良好的礼仪和卫生习惯来增强体质，更要培养优秀的道德品质。我们将立足于中国哲学和道德，努力实现以新儒家思想为基础的天下大同理想。"
 YUN_a_new_social_organism: "新社会有机体"
 YUN_a_new_social_organism_desc: "个人是构成社会的元素，而社会是由众多个体集合而成。如果个人脱离社会，他就无法生存。在这个适者生存、残酷竞争的世界里，革命者个人身上体现出的美德与身为虔诚爱国者的担当，实属难能可贵。"
 YUN_academia_sinica: "中央研究院"
 YUN_academia_sinica_desc: "中央研究院是国民党政府规划的项目，旨在创建一所真正意义上的国立研究型大学，致力于数学、物理、人文和社会科学的研究。鉴于我国在研究基础设施方面落后于西方，该研究院将帮助我们培养新一代的研究人员和学生，使我们赶上世界其他地区。"
 YUN_expand_public_education: "扩大公共教育"
 YUN_expand_public_education_desc: "作为《建国方略》的一部分，已故的孙中山先生（他本人也是一位知识分子和演说家）曾计划扩大面向民众的公共教育。这不仅能够启蒙我国的大量文盲人口，还能通过公立学校灌输三民主义，培养一支受过良好教育、尽职尽责的国家公民。"
 YUN_pursue_international_legitimacy: "追求国际合法性"
 YUN_pursue_international_legitimacy_desc: "1927年国民党因北伐战争失败而崩溃后，中国国民党运动的国际合法性主要落到了我们的对手汪精卫在巴黎建立的中央委员会上。但既然我们现已控制北平地区，我们有权向世界宣告自己才是唯一合法的中华民国。"
 YUN_create_the_national_health_administration: "建立国民健康署"
 YUN_create_the_national_health_administration_desc: "国民健康署由卫生部组织成立，旨在为公共卫生和医疗事业的发展做准备，尤其是在农村地区。在雄心勃勃的“三年计划”的带动下，国民健康署计划启动一项宏伟的大型政府计划，通过建设诊所、医院和农村卫生站，从而改善贫困人口的生活。"
 YUN_cement_the_dangguo_ideal: "巩固党国理想"
 YUN_cement_the_dangguo_ideal_desc: "群众必须明白，党的领导才是实现真正民主、从帝国主义束缚下获得解放的唯一途径。在党的先锋队严明而仁慈的领导下，我们的人民一定能够成功摆脱军阀统治和千方百计试图欺凌我们的帝国主义列强之侵略。"
 YUN_national_reconstruction_committee: "国家建设委员会"
 YUN_national_reconstruction_committee_desc: "自鸦片战争以来，中国多灾多难，毫无喘息之机。清朝的覆灭预示着新时代的曙光，但旋即而至的军阀时代使中国又陷入一片混乱，乡村满地疮痍。随着北伐战争又带回了些许统一的气象，重建的大任落在了国民党的肩上。[ROOT.GetLeader]的政府已经设立了多个机构，负责乡村和城市的重建工作。"
 YUN_autarkic_model: "自给自足模式"
 YUN_autarkic_model_desc: "清朝初年，进出口贸易皆由“一口通商”（广州通商体系）控制，旨在抵御西方殖民势力的商业和贸易威胁。一口通商在鸦片战争后被英国摧毁，此后中国在经济上沦为西方和日本的殖民地。国民党渴望建立一个政治和经济自由的国家，因此中国政府将采取自给自足政策。"
 YUN_pursuing_minsheng: "追求民生"
 YUN_pursuing_minsheng_desc: "“三民主义”是孙中山先生的思想核心，即民族主义、民权主义、民生主义，其中民生主义一直是国民党的核心理念。民族主义已深入全体华夏儿女之心，民权主义亦将在党的引领下适时而至，而经济平等将为中国走向现代化乃至更远的未来铺平道路。"
 YUN_national_capitalism: "国家资本主义"
 YUN_national_capitalism_desc: "随着国家统一大业即将完成，中央委员会已开始实施“国家资本主义”政策。政府官员将着力推行福利制度，规范资本流动，并设立土地改革机构。国家资本主义政策旨在推动中国发展，直至最终实现国家财富公有化。祝愿中国未来繁荣昌盛！"
 YUN_rural_cooperative_movement: "农村合作社运动"
 YUN_rural_cooperative_movement_desc: "自中华文明诞生以来，农耕一直是中国人生活方式的核心。虽然复兴中华民族必须拥抱现代化，但农业始终是立国之本。因此，肩负实现社会公平使命的国民党必须帮助中国农民贫穷之屈辱。为此，国民党政府将建立并支持农村合作社，并为农民提供信贷。"
 YUN_modernised_rail_system: "现代化铁路系统"
 YUN_modernised_rail_system_desc: "如果说西方有什么值得借鉴的地方，那便是作为工业发展巅峰成就的大型基础设施项目。铁路建设一直是孙中山先生及其子孙科的梦想，铁路将帮助中国内陆腹地实现繁荣昌盛。为了确保中国成为铁路强国，我们将设立由孙科领导的铁道部。"
 YUN_uplifting_chinas_downtrodden: "扶助底层民众"
 YUN_uplifting_chinas_downtrodden_desc: "国民党代表着全体中国人的事业，维护着中国所有弱势群体的权利。长期以来，妇女沦为丈夫的附属品，被迫缠足；农民饱受地主的欺压和地方官员的敲诈；工人们在列强建造的丑陋工厂里受苦受难。国民党将努力帮助中国受压迫的人们！"
 YUN_chinese_solutions_for_chinese_problems: "中国问题，中国方案"
 YUN_chinese_solutions_for_chinese_problems_desc: "尽管许多知识分子认为解决中国困境的答案来自西方，但[ROOT.GetLeader]领导的国民党却清楚认识到，答案在于中国自身。三民主义并非通往享乐的无政府社会主义的垫脚石——它既是通往理想的途径，更是理想本身。西方思想不过是对美好未来的空洞承诺，而国民革命则将在通往平等的道路上采取果断行动。"
 YUN_developing_the_financial_sector: "发展金融业"
 YUN_developing_the_financial_sector_desc: "虽然我们的国民革命事业承诺以公平来对抗资本主义和帝国主义的蹂躏，但如果没有充足的资本，中国政府将无力帮助人民。为此，中国必须学习西方的金融运作方式，并将其金融部门发展到足以与列强相称的水平。现代金融机构不仅将极大地增强中国政府的能力，也将提升国际社会对我国政府的评价。"
 YUN_establish_coastal_economic_zones: "建立沿海经济区"
 YUN_establish_coastal_economic_zones_desc: "为了发展国家资本主义，实现先富带动后富，本党决定在若干沿海重要城市建立经济特区，以此促进市场和金融的发展，推动经济增长。虽然这一政策可能导致我们依赖全球贸易，但它符合中国的现状，并将最终实现中国经济的自给自足。"
 YUN_union_of_class_and_society: "阶级与社会的和谐"
 YUN_union_of_class_and_society_desc: "国民党虽为工农之党，然若止步于此则谬矣。国民革命旨在囊括中国社会全体，从最高层的旧政治精英，到最底层的困顿民众。所有阶级都将在国民党的领导下齐心协力，朝着解放生产力和中华民族复兴的共同目标前进。"
 YUN_reconstruction_by_chinese_means: "中国方式建设"
 YUN_reconstruction_by_chinese_means_desc: "西方帝国主义者宣扬自由资产阶级民主和普世主义等愚蠢理念，而工团主义势力则宣扬更荒谬的享乐无政府主义和破坏性的阶级对立。西方理念将不再荼毒这个国家，西方资本也将不再压迫中国人民。中国将迎来不受他国宰制，而是基于中国人民集体意志的伟大复兴。"
 YUN_champions_of_the_nation: "国之劲旅"
 YUN_champions_of_the_nation_desc: "在环境压力下屈服，被地方主义侵蚀，由于未能适应新的政治潮流，滇军已然落后于时代。这支曾为民族主义和共和理想斡旋助力的省军，现已被国民党党国之类的组织形态所取代。昔日的“国之劲旅”亟需改革，以回归其建军之本。"
 YUN_brigade_reorganisation: "整编旅部"
 YUN_brigade_reorganisation_desc: "滇军旅的编制极其混乱，一些旅采用美国式的三单位制，另一些旅则有4个、5个甚至只有1个营。在混乱的军阀时代，各方人马都存在这种问题，但滇军从诞生伊始便是有组织的职业军队，为了修补失能的旅级编制，我们将采用新的标准，将部队整编至符合要求。"
 YUN_encroaching_on_colonialisms_lifeline: "切断殖民者生命线"
 YUN_encroaching_on_colonialisms_lifeline_desc: "作为帝国主义势力深入云南腹地的首条通道，滇越铁路昆明至河口段由法国殖民者修建，现由德国控制，筑路期间无数中国劳工殒命于此。我们将增派铁路护卫兵力，以此向德属东亚当局表明：云南之脊梁从未屈服。"
 YUN_watching_the_upstarts: "[YUN_watching_the_upstarts_name_loc]"
 YUN_watching_the_upstarts_desc: "[YUN_watching_the_upstarts_desc_loc]"
 YUN_vanquishing_personalism: "克服个人主义"
 YUN_vanquishing_personalism_desc: "随着云南逐渐脱离中央政权控制，滇军的状况持续恶化。滇军曾被认为是一支不受军阀腐败影响的部队，如今士兵们却更加忠于其直属指挥官，而非国家体制。通过重新实施参谋和指挥官的频繁轮换，同时解散原有作战单位，我们有望彻底打破个人指挥权形成的桎梏。"
 YUN_four_qualities_of_a_general: "将材四体"
 YUN_four_qualities_of_a_general_desc: "蔡锷将军是云南如今“西南王”地位的缔造者，也曾因在最关键的时刻领导着滇军，而被视为滇军最重要的奠基人。他曾经强调，“带兵之人，第一要才堪治民；第二要不怕死；第三要不急急名利；第四要耐受辛苦。”我们必须再次向军人灌输此类价值观。"
 YUN_legacy_of_the_last_generation: "老一辈的传承"
 YUN_legacy_of_the_last_generation_desc: "滇军的“老一辈”将领可谓国家楷模。蔡锷、唐继尧、罗佩金、顾品珍、李根源等滇军将领深明国家大义，护国讨袁、力挽共和，彰显了中国军事领袖的风骨。即使在如今衰败腐朽的军队体制中，他们的精神依然熠熠生辉。"
 YUN_implementing_bianqian: "完成编遣"
 YUN_implementing_bianqian_desc: "为了削弱云南各支自治军队的地方权力，军方高层决定缩减滇军总体规模，实施“整编复员”（即“编遣”）政策。为了建设一个现代化的统一国家，滇军必须严守军纪，并接受中央领导。愿滇军能成为各省军队的榜样。"
 YUN_the_spirit_of_revolution: "革命精神"
 YUN_the_spirit_of_revolution_desc: "印度支那历来是法国殖民者与当地原住民的战场，饱受起义和不满的蹂躏。而在多年前，印度支那曾是辛亥革命者的流亡地，印度支那民众因此和云南人民之间依然保留着深厚的革命兄弟情谊。为了报答他们的恩情，我们将支持印度支那革命者对抗共同的敌人，将德国人逐出云南的势力范围。"
 YUN_aid_from_europes_kingpins: "欧陆霸主的援助"
 YUN_aid_from_europes_kingpins_desc: "无论我们如何努力，德意志帝国迄今为止仍然是当今时代无可争议的超级大国，他们的影响力遍及世界每个角落，云南也不例外。在当前实力尚弱之际，我们不应贸然对抗德国势力，而应借助德国企业来推动军事发展，待国家统一之后再图扭转形势。"
 YUN_legacy_of_the_huguojun: "护国军的传承"
 YUN_legacy_of_the_huguojun_desc: "护国军可堪滇军在全国军事实力和影响力的巅峰。他们不惧袁世凯的复辟野心，在兵力和武器装备都远远落后的情况下取得了胜利。这一史无前例的壮举令无数英雄动容，如果我们要再次拯救国家，滇军就必须再次担起护国重任。"
 YUN_revitalising_kunming_academy: "重振云南陆军讲武学校"
 YUN_revitalising_kunming_academy_desc: "云南陆军讲武学校被视为滇军最关键的组成部分，其培养的军官和领导人始终为云南乃至国家英勇奋战。然而，如今的云南陆军讲武学校却遭到忽视，虽然名声犹存，精神却丧失殆尽。秉承“坚忍刻苦”的校训，这所军校亟待复兴。"
 YUN_reimplementing_drill_standards: "再行《操法》"
 YUN_reimplementing_drill_standards_desc: "滇军在上一个世代都有着高规格的操练、演习之法。训练时长为三个月，而每天都会有八小时的理论实践演练。炮队和步兵都会接受个人与部队中的教导，还有夜战的野外演习。这是滇军强大的象征，我们必须回到这个训练的黄金时期。"
 YUN_handling_overglorification: "放下浮名虚荣"
 YUN_handling_overglorification_desc: "滇军过往逐渐滋长的懈怠情绪，已在军队内部形成了一种崇尚浮名虚荣的风气。在阅兵与华丽典礼的掩盖之下，军队核心日益腐朽的状况却遭到忽视。我们必须摒弃所有华而不实的阅兵操练，将重心转向艰苦的实战任务，体能训练、野战演习与协同作战演习应当被置于优先位置。"
 YUN_officers_initiative: "军官自主性"
 YUN_officers_initiative_desc: "毫无疑问，当下级指挥官拥有一定程度自主权时，部队在军事行动中的表现会更为出色。正如护国军、国民革命军以及吴佩孚麾下直军所展现的那样，相较于大规模战线作战，在宏观战略目标下保持部队自主性，更能让军队赢得一场场英勇胜利。"
 YUN_ensuring_ideological_cohesion: "确保思想凝聚"
 YUN_ensuring_ideological_cohesion_desc: "国民革命军已向所有中国军队展现了向普通士兵阐明政治目标的好处。确保官兵的思想绝对忠诚，并完全服从他们所信奉的政治目标，将能防止过去几十年来出现的腐败影响。如同国民革命军和国民军一样，护国军亦当效法此道。"
 YUN_leading_from_the_front: "身先士卒"
 YUN_leading_from_the_front_desc: "滇军军官曾以身作则为士兵树立榜样，使得全军上下具备坚定的决心、牺牲的精神和高昂的士气。滇军军官因其高度的责任感以及与下属相处融洽而闻名，他们常常身先士卒，率领部下勇往直前。为了再现昔日辉煌并重振军威，我们应当颂扬这种英勇精神。"
 YUN_daring_to_die: "敢死队"
 YUN_daring_to_die_desc: "国民革命军在北伐初期屡建奇功，其关键便在于效仿辛亥革命者组建的“敢死队”。滇军向来深谙舍生取义之道，这支浸润着烈士鲜血的军队，始终不畏牺牲为救亡图存而战。我们将再次肩负起革命者的使命，并为之奉献我们的心血。"
 YUN_soul_of_the_rapid_offensive: "速攻之灵魂"
 YUN_soul_of_the_rapid_offensive_desc: "滇军过往的军事理论可谓华而不实。蔡锷虽然提倡效仿波亚人（布尔人）的游击战术，但这位将领在实际作战中却展现出前所未有的凶猛，他总是抢占要点与先机，尽可能发动快速攻势。秉承先发制人、凌厉出击的原则，我们必将无往不利。"
 YUN_yunnans_militarist_credidentials: "云南尚武传统"
 YUN_yunnans_militarist_credidentials_desc: "云南领导人对军事的投入堪称前所未有。云南陆军讲武学校的创始人李根源对转行从事非军事职业的前景深感厌恶，甚至表示“宁死不从”。若我华夏能多几位尚武英豪，少几个文弱书生，国运何至于此。即便如此，云南仍需努力匡正时弊。"
 YUN_militaristic_and_patriotic_spirit: "尚武与爱国精神"
 YUN_militaristic_and_patriotic_spirit_desc: "救亡图存是中国当前面临的首要问题。唯有通过重整教育体系以培养尚武精神、在音乐文学中颂扬军旅生活、尊重军人并提高其社会地位，中国才能生存下去。这些措施将有助于彰显我国军人的成就与荣光，使中国成为军事强国。在现实政治的世界里，唯有强者才能生存。"
 YUN_the_huguojuns_bureaucracy: "护国军的官僚体制"
 YUN_the_huguojuns_bureaucracy_desc: "与一般的军事体制不同，昔日辉煌的滇军是一支官僚体制化的军队，军官们不仅要效忠长官，还要服从上级部门代表整个军队发出的命令。权力不在于个人，而在于职位本身，而这些职位则构成了金字塔式的等级制度，这样的价值观应当在我们的新护国军中发扬光大。"
 YUN_commitment_and_bravery: "奉献与勇气"
 YUN_commitment_and_bravery_desc: "我们挚爱的护国军曾展现出强大的团队精神，并战胜了所有敌人。无论是北洋军、旧桂系，还是川军，护国军皆所向披靡。随着我军重振声威，如今正是再铸军官勇武、于危难时刻保持高昂士气之时。"
 YUN_idealisation_of_political_goals: "政治目标理想化"
 YUN_idealisation_of_political_goals_desc: "随着北方各省落入我方掌控，当地对革命性变革踌躇不前，我们不能再依赖云南省内的理想与目标。鉴于外省兵员日益增多，根据军方高层的普遍共识，我们应建立政治委员制度以统一护国军的政治观点。"
 YUN_prioritisation_of_military_victory: "军事胜利优先"
 YUN_prioritisation_of_military_victory_desc: "军事胜利是至高无上的首要目标，无论我们的战役追求何种政治结果，都必须先战胜对手才能实现。通过强调运动战、白刃战和夜间突袭，我们将利用勇猛作风和出奇制胜弥补军队的不足，并巩固自身军事优势。"
 YUN_to_bear_sacrifices: "肯牺牲"
 YUN_to_bear_sacrifices_desc: "理想的军人应当以爱国心、荣誉感、忠诚度及对民族国家的责任为动力。这样的战士必须纪律严明、服从命令，并充满“尚武精神”。拥有这样的心态，军人才能更好地理解国家利益，并甘愿为之奉献牺牲。为强化此种精神，我们将加强体能训练和军事操演。"
 YUN_knowledge_of_the_land: "地形知识"
 YUN_knowledge_of_the_land_desc: "一场战斗的胜利有时取决于如何巧妙地运用战场环境，从而提升士兵的作战能力。幸运的是，中国内陆是世界上地形最为险峻的地区之一，山川纵横，丘陵起伏，兼有深流险滩，为在崎岖地形中进一步训练提供了完美的环境。"
 YUN_the_new_era_of_warfare: "新时代战争"
 YUN_the_new_era_of_warfare_desc: "现代战争让战场的第三个维度——空中支援登上了舞台，也将装甲巨兽的快速突击带到了世界各地的战场上。尽管中国此前缺乏足够的工业能力来建立一支真正的装甲部队，但随着近年来的发展，装甲旅的建设空间已然扩大，云南必将走在最前沿。"
 YUN_drafting_a_viable_supply_corps: "组建高效补给兵团"
 YUN_drafting_a_viable_supply_corps_desc: "若无补给，军队不过是一群流窜的饿殍之虎，士气萎靡，爪牙俱损。迄今为止，护国军一直依赖有限的摩托化补给线、当地居民的慷慨解囊以及缴获的敌军装备。对于像中国战场这样广阔的战线来说，若想保障我军深入敌方领土作战，建立一个集中统筹、定期监管的补给网络方为明智之举。"
 YUN_heirs_of_national_protection: "护国军传人"
 YUN_heirs_of_national_protection_desc: "其他人或许声称自己为民族而战，为革命而战，甚至为共和而战。然而在他们之中，却没有人真正拥有为救国救民而奋斗的经历。我们的战士英勇无畏，在枪林弹雨中浴血奋战，深知他们的牺牲是为了民族国家的最高利益。我们的军队虽然发源于云南，但会为全中国而战。"
 YUN_fighting_for_our_stolen_land: "收复失地"
 YUN_fighting_for_our_stolen_land_desc: "云南与缅甸的边界历来是英国与清朝当局的争议地区，从未真正划定国界。受1910年片马事件的激化，加之英国在缅殖民统治瓦解，我方已对边境南部蕴藏丰富银矿的区域重提领土主张。"
 YUN_yunnans_most_premier_caste: "云南最显赫的阶层"
 YUN_yunnans_most_premier_caste_desc: "我军精英多是老一辈护国军遗留的中坚力量，以及在护国战争中成长起来的新一代军人。若无这批栋梁，我军便失去了可资倚重的深厚底蕴与专业技能，最终将难堪大用。他们身上彰显着民族国家军人的全部美德，如今正是奖励这些忠勇之士的时候。"
 YUN_integration_of_auxillaries: "整合辅助部队"
 YUN_integration_of_auxillaries_desc: "即便护国军现已摆脱过去自治军肆意任人唯亲之弊的困扰，我们却仍在使用一些非正规部队来补充更广泛的正规军。辅助部队虽能征善战、终有所用，但随着我们逐渐步入国内与国际战争新阶段，这类部队已不合时宜。通过授予辅助部队士兵正式军衔，我们可以进一步增强中央军。"
 YUN_heroes_of_the_nation: "民族的英雄们"
 YUN_heroes_of_the_nation_desc: "毫无疑问，改革后的护国军再次证明了自己是中华民族的救星。我们迎难而上，一路披荆斩棘，最终取得了胜利。我们以崇尚美德和尚武精神的理念，将人民从亡国灭种的边缘拯救出来。献给征程中牺牲的战友们——这场胜利属于你们。"
 YUN_first_amongst_equals: "同侪之首"
 YUN_first_amongst_equals_desc: "没有我们伟大的领袖，就没有新中国。[ROOT.GetLeader]一次次展现了他在政治和实战中卓越的领导力和指挥能力。[ROOT.GetLeader]堪称国家的救星，对其军事才能的个人崇拜已经开始滋生。进一步推动这种崇拜，并将蔡锷等人奉为真正的“同侪之首”，亦无伤大雅。"
 YUN_an_era_of_national_struggle: "民族斗争的时代"
 YUN_an_era_of_national_struggle_desc: "军阀混战时代，中国国际地位一落千丈，百姓不聊生。辛亥革命带来的一线曙光，最终还是因袁世凯的阴谋与北伐战争的失败而化为乌有。在这个民族斗争的时代，若想真正实践人民的意志，就必须有一支纯粹由人民组成的军队。"
 YUN_preserving_ones_forces: "保存力量"
 YUN_preserving_ones_forces_desc: "若想在敌强我弱、敌众我寡的情况下作战，我们的战术就必须围绕避实击虚、保存力量展开。我们将专注于使用灵活机动的部队，对多支敌军和防线进行打击，从而在敌方发动反击之前撤回中国腹地。这种战术虽被冠以“游击战”之名，实则为昆明当局所采用战术的延伸。"
 YUN_engulfing_the_enemy: "蚁噬敌寇"
 YUN_engulfing_the_enemy_desc: "“我国数年之内若与他邦以兵戎相见，与其孤注一掷之举，不如采取波亚（即布尔人）战术，据险以守，节节为防，以全军而老敌师为主，俟其深入无继，乃一举歼除之。”——蔡锷"
 YUN_resolute_in_ideals: "坚定信念"
 YUN_resolute_in_ideals_desc: "士兵乃军队之本，无兵则无军魂。然而，理想的士兵应当勇猛无畏、永不动摇，并坚定地践行他们的社会、经济和政治理念。将这些美德灌输给我们的士兵，将使官兵对我们的军事战略及战略执行能力充满信心。"
 YUN_officers_prerogative: "军官职权"
 YUN_officers_prerogative_desc: "正如国民革命军独立部队（至少是黄埔出身的部队）所展现的那样，将自主指挥权下放给这些部队的指挥官在过去已被证明非常成功。通过强调下级军官的主动性和独立性，同时坚持缜密筹备与系统作战规划，我们的军事目标一定能够实现。"
 YUN_extensive_reconnaissance: "大范围侦察"
 YUN_extensive_reconnaissance_desc: "战胜强敌的关键在于情报战。通过在交战前对敌方部队进行适当侦察，我们定能够找出敌军弱点，并对其造成最大杀伤。然而，我们的行动不能仅局限于侦察小队和望远镜，愤懑不平的当地民众也能提供情报，帮助我们了解军阀势力。"
 YUN_fighting_in_our_favour: "发挥长处"
 YUN_fighting_in_our_favour_desc: "国民革命军从北伐失败中汲取了惨痛教训——黄埔军校的战术不足以抗衡德意志军事巨兽，国民革命也因此遭受重创。我们必须在战斗中运用一切必要手段，使战局对我方有利，将敌军纵队诱入我方腹地实施合围，方能彻底歼灭顽敌。"
 YUN_committed_in_ideology: "忠于意识形态"
 YUN_committed_in_ideology_desc: "对党忠诚，对三民主义忠诚，为国民革命奉献一切，这些都是我们士兵最应该具备的品质。通过召开群众大会，讲解政治和军事形势，我们将帮助士兵们明确目标，从而有望提高他们的战斗积极性，将任务贯彻始终。"
 YUN_renewed_officer_examinations: "革新军官考核"
 YUN_renewed_officer_examinations_desc: "通过为军官队伍设立一系列考核和测试，我军将领将评估麾下军官对军事条例、作战指令及现代机动战术的掌握程度。同时，军官们还必须展现日常操演与野外作战的技能。此外，军官的性格特质与行为倾向、分队管理能力、实战指挥水平以及教学训练水准也将纳入考评体系。"
 YUN_the_endpoint_of_chinese_armies: "中国军队之巅"
 YUN_the_endpoint_of_chinese_armies_desc: "归根结底，尽管被冠以革命军的名号，但我军的组织结构并无革命性突破，我们的作战方式仅仅是晚清新军改革后中国军队创新的延续。从清末到北洋，从党国到当下，我军之所以最为高效，正是在于能够毫无顾虑地贯彻其建军理念的干练能力。"
 YUN_extolling_political_objectives: "颂扬政治目标"
 YUN_extolling_political_objectives_desc: "在护国战争中服役期间，朱德深刻认识到对战争总体政治目标的清晰认识至关重要，即使这些目标与眼前的军事需要相冲突。蔡锷在战争前夕集结了全部兵力，以便让护国军重点进攻广西和四川两省。同样，我们必须优先考虑群众，军事胜利则次之。"
 YUN_concentration_of_popular_will: "聚集民心"
 YUN_concentration_of_popular_will_desc: "在军阀混战时代，取得军事胜利至为关键，而一个重要但常被忽视的方面正是赢得民心。在中国百姓眼中，普通士兵与合法强盗无异。然而若我军能展现人民军队面貌，是为了将民众从军阀魔爪中解放出来，广大人民必将倾力支持我们的政府和士兵。"
 YUN_frontlines_everywhere: "无处不战场"
 YUN_frontlines_everywhere_desc: "正如何应钦所言，中国军队必须通过组织游击队和袭击“将被敌占领地区变为战场”，从而“将敌人的后方也变成他们的前线”。若有敌人胆敢踏上中国领土，他们不仅要面对我们的武装力量，更将承受中国人民的雷霆之怒。"
 YUN_improving_our_soldiery: "提高士兵素质"
 YUN_improving_our_soldiery_desc: "我军目前的构成以农民为主，其次是国民革命军老兵，然后是工人，最后是土匪。这样一支队伍虽真实体现了人民军队的性质，却因兵员鱼龙混杂导致战力参差不齐。我们若想将军队建设成一支真正的国家军，就必须努力统一操典与训练标准。"
 YUN_installing_discipline: "严明纪律"
 YUN_installing_discipline_desc: "作为一支由人民组成的军队，在紧张混乱的局面下，部分官兵一时冲动对士绅地主进行偏激报复并不令人意外。但国民革命军既为人民之师，无论民众身份尊卑，理应皆尽护卫之责。必须通过严明纪律，让官兵们学会收敛仇怨。"
 YUN_strategic_defensive_tactical_offensive: "战略守势，战术攻势"
 YUN_strategic_defensive_tactical_offensive_desc: "根据世界大战中施利芬所展现的军事天才，结合朱德本人对施利芬军事理论的研究，在战略上采取守势，同时在战役和战术层面采取攻势，这种战法将无往不胜。只要能通过包围战实现歼灭敌军有生力量，我军必能战胜帝国主义军队与军阀部队。"
 YUN_qualities_of_a_leader: "大将之材"
 YUN_qualities_of_a_leader_desc: "诚然，我军的良好作风源于其将领之品德。军队需要的是目标明确、意志坚定、拥有钢铁气概和必胜决心的领导者，国民革命军将领尤能彰显此道，他们始终为救亡图存而战。有了英明睿智的领导层，我军自能明辨时局攸关所在。"
 YUN_lower_level_autonomy: "下级官兵自主性"
 YUN_lower_level_autonomy_desc: "如同国民革命军以及德国陆军的任务导向战术(Auftragstaktik)一样，我军的理论家们希望将较低级别的战术任务委托给下级官兵执行。将领们应明确总体目标、时间表以及完成目标所需的兵力，然后让军官们自行探索实现目标的最佳途径。"
 YUN_maintaining_flexibility: "保持灵活性"
 YUN_maintaining_flexibility_desc: "我们的军事理论家深知战争的偶然性，战术和战略家们也同样深谙战场形势瞬息万变，指挥部队不可墨守成规。战场决策应取决于具体任务、敌情和地形。由于所有这些因素都可能随时发生变化，因此指挥者必须具备灵活应变的能力。"
 YUN_a_hundred_regiments: "百团大战"
 YUN_a_hundred_regiments_desc: "我们只需百团之众、二十万将士，便可抗衡一切顽敌，并将其彻底摧毁。今日国民革命军之战力远胜北伐当年，倭寇也罢，德军也罢，任何敌人若敢来犯，必教其见青天白日满地红而丧胆。我军将士绝不会屈服于世道艰险，他们将继续前进，继续呐喊，继续搏杀。"
 YUN_reorganising_the_airforce: "改编空军"
 YUN_reorganising_the_airforce_desc: "云南航空学校是中国最早的航校之一，其前身为1922年成立的航空学校。云南航校隶属于云南陆军讲武学校，并于1924年重组为云南空军。随着资金到位，云南空军正处于第二次重组的关键时期，届时将任命新的空军将校，并组建一支新的航空队伍。"
 YUN_renovating_wujiaba_airport: "翻新巫家坝机场"
 YUN_renovating_wujiaba_airport_desc: "巫家坝机场于1923年由唐继尧主持修建，是亚洲大陆上最早一批机场之一。其建在距昆明不远的一个战略要地，是仅次于北京南苑机场和杭州仙桥机场的中国第三大机场。但现在其已经年久失修，急需我们投入关注和资金来使其潜力完全发挥。"
 YUN_mass_proliferation_of_airfields: "大规模普及机场"
 YUN_mass_proliferation_of_airfields_desc: "巫家坝机场虽服务优良、运力充足，但云南地势沟壑纵横、山峦崎岖，若想真正覆盖全省每个偏远角落乃至辐射邻省，推行大规模机场建设计划方为良策。通过强制要求各县限期完成机场修建（即使无财政援助），我们定能建立起坚实的空中管控。"
 YUN_equalisation_of_pilots: "飞行员性别平等"
 YUN_equalisation_of_pilots_desc: "在巫家坝航校的首期学员中，唐继尧特意从云南富裕家庭中挑选了两位名门闺秀入学，这既是为了激励学生报考，更是开创了中国女性学习航空的先河。然而夏文华与尹月娟并非唯二成功毕业的女飞行员，在第三期毕业生中更是涌现出九位巾帼英才。我们必须重新允许女性驾机翱翔，方能最终实现性别平等。"
 YUN_powering_on_liangguang: "激活两广潜力"
 YUN_powering_on_liangguang_desc: "在攻占两广后，我军坐拥丰饶财富与工业基础，复兴已是指日可待。依托粤桂两省兵工厂，我们定能推动民用与军事工业革新。得两广实力支撑，滇军从此可解武器不足与军饷短缺之困。"
 YUN_foreign_naval_experts: "外国海军专家"
 YUN_foreign_naval_experts_desc: "作为一个内陆省份，我们的海军人员尤其匮乏，这是不争的事实。鉴于新的地缘政治形势让我们获得了多余资金，明智的做法是前往使馆城市聘用流亡或失业的海员，以训导我方海员掌握海战技术。"
 YUN_securing_a_merchant_marine: "保护商船队"
 YUN_securing_a_merchant_marine_desc: "由于缺乏出海口，云南省府传统上依赖经过广西、贵州和印度支那的陆路运输线将出口商品输送至国际市场。然而，随着我们掌控海岸线，如今可以着手采购并建立一支能够出海远航的船队，以便从国际市场进出口货物。"
 YUN_the_lightning_school: "电雷学校"
 YUN_the_lightning_school_desc: "欧阳格将军沿袭广东悠久的海军传统，一直致力于在广东建立自己的海军学院，即“电雷学校”。这所看似独立的军校实为云南陆军讲武学校的分支，是陆军势力向海军派系政治渗透的举措。无论如何，这所学校为中国海军历史注入了新的活力。"
 YUN_a_new_class_of_wujiaba_cadres: "新一代巫家坝学员"
 YUN_a_new_class_of_wujiaba_cadres_desc: "随着巫家坝机场的改造，以及更多机场在领内落成，我们再次迎来新一届巫家坝学员参加培训课程。在新老骨干的指导下，新一代学员或将经历前所未有的实战考验。在艰苦的磨砺中，蕴藏着改革的基石，相信他们定能迎接挑战。"
 YUN_securing_modern_equipment: "保证现代装备"
 YUN_securing_modern_equipment_desc: "滇军自成军以来，枪支和弹药便供不应求，一直以来，我们都只能依靠从外国进口或是在昆明兵工厂制造。但如今我们已占领了广州，这颗西南明珠的重要资源和工业基础既然足以支持穷兵黩武的旧桂系，自然也足以维持滇军所需。"
 YUN_integrating_beiyangs_legacy: "整合北洋遗产"
 YUN_integrating_beiyangs_legacy_desc: "北洋水师历来享有远航专家的美誉，尽管他们最近赋闲在家，但与其大多数北洋同僚相比，这些海员一直对我们更为友善，他们不关心政治，甚至同情我们的事业。我们可以动用关系和人脉，利用这些资深海员的专业知识和技能，最终贡献国家。"
 YUN_defending_chinas_coastline: "保卫中国海岸线"
 YUN_defending_chinas_coastline_desc: "中国海岸线绵长连贯，是任何潜在海上入侵的完美阵地。在国防战略部署中，如何有效防卫这片海域始终是一个问题。海军和陆军参谋部已向政府建言，主张重整并巩固现有海防体系，同时拨付专项经费建造海防舰艇。希望通过这些努力，我们的海岸线将成为一座坚不可摧的堡垒。"
 YUN_circumnavigating_the_blockade: "绕过封锁"
 YUN_circumnavigating_the_blockade_desc: "中国疆域虽广，却终究难逃牢笼之困，被日本与德国重重围堵。敌军盘踞东南亚且远离我国海岸线，任何贸易物资皆难逃其耳目。然而与其坐以待毙，不如制定战略并建造能够躲避敌军巡逻的舰船，借此绕过重重封锁。"
 YUN_a_central_aviation_academy: "中央航空学校"
 YUN_a_central_aviation_academy_desc: "在我们控制大部分中国领土后，云南在航空领域的带头羊作用得以充分展现。尽管先前如直系、奉系和国民党等政权曾多次尝试，中国却始终未能建立起一所真正的中央航空学校。然而，随着我们再度振作并吸收过往经验，我军航空力量将统一于新成立的中央航校旗下。"
 YUN_constructing_aircraft_plants: "建造飞机厂"
 YUN_constructing_aircraft_plants_desc: "尽管我们雄心勃勃地想要打造自己的空军，但中国航空工业根本无法满足我们的需求。为了拥有一支真正独立的空军，我们不能依赖外国供应商来满足自身需求。除了计划在东山兴建飞机修理厂并扩建韶关飞机制造厂之外，我们的航空人员还制定了在广西腹地建立飞机工厂的计划。"
 YUN_adopting_armoured_assaults: "采纳装甲突击"
 YUN_adopting_armoured_assaults_desc: "在现代战争中，有两样武器让人类超越了肉体凡胎：那便是战机与坦克。这些咆哮的钢铁巨兽令敌军闻风丧胆，它们兼具强大火力与机动能力，能对广阔战线实施大规模包围作战。中国若要在列强环伺中真正立足，建立自己的装甲部队实乃当务之急。"
 YUN_the_nation_under_siege: "累卵之国"
 YUN_the_nation_under_siege_desc: "等待已久的考验终于来临。尽管我们拥有数千年的文明传承，却依然忧惧日本帝国主义者带来的毁灭威胁。我们都深知，全体中华儿女，无论是妇女还是儿童，所有人都已身处险境之中。在迫近的厄运面前，中国人民必须放下分歧，团结一心，共克时艰！"
 YUN_acquiring_expertise: "获取专业知识"
 YUN_acquiring_expertise_desc: "尽管我们之前曾获得过外国的专业知识，但事实证明，这些经验远远不足以满足我们的需求。使馆城市的海员们年事已高，早已过时，无法适应现代海战的需要。我们的志向早已飞出中国之外，现在是时候与外国势力开展外交，并协商派遣顾问团来增强自身军事实力了。"
 YUN_incentivising_airfleet_production: "激励空军生产"
 YUN_incentivising_airfleet_production_desc: "总体而言，我们领空及机场中的飞机数量远不足以保家卫国。我们必须以更坚定的决心、更高效的举措，着力简化飞机生产流程，推动空军作战力量快速扩张，使之发展至可与德国空军比肩的水平。"
 YUN_a_nascent_marine_corps: "新生的海军陆战队"
 YUN_a_nascent_marine_corps_desc: "中华民国海军陆战队承袭了中国海军的悠久传统，几乎与民国同时诞生。海军陆战队正式成立于1914年，其前身为日渐式微的海军警卫队，经整编后转型为能执行渡海登岸、跨河作战任务的部队。海军陆战队将为海军建设提供充足的助力，我们的舰艇也将得到陆军的支持。"
 YUN_a_fleet_in_six_years: "六年造舰"
 YUN_a_fleet_in_six_years_desc: "这项雄心勃勃的计划远超我们的预期，海军参谋部已起草了一份政府财政计划，旨在六年内扩建一支60万吨的舰队。如果获得政府的全面批准，我们将建造数百艘舰船和众多船坞以实现这一目标。或许在不久的将来，中国舰队将能再度远航美洲。"
 YUN_a_naval_guerilla_war: "海上游击战"
 YUN_a_naval_guerilla_war_desc: "现代海军的进步催生了更好、更大、更快的舰船，却让人们忽略了潜艇战的悄然进步。潜艇已从昔日与大型舰艇交火时的官兵铁棺材，转变为如今主导“海上游击战”的霸主。通过投资此类能力来扼杀我们的敌人，无疑是明智之举。"
 YUN_combined_air_land_offensives: "空地协同进攻"
 YUN_combined_air_land_offensives_desc: "在局部陆战中，最能扭转战局的当属空中支援力量。近距空中支援机能够摧毁敌方防御工事、装甲部队及有生力量，其威力已屡屡得到证明。在今后所有军事行动中，唯有在空军的引导下，我们的步兵将才能继续前进，空军的轰炸行动将开辟出一条道路。"
 YUN_wartime_service_corps: "战时服务团"
 YUN_wartime_service_corps_desc: "值此危难之际，有人提议组建“战时服务团”，征召男女公民在后方承担次要职务，以便腾出更多士兵奔赴前线。这项提议或许不得人心，甚至招致憎恶，但举国上下皆深知自身责任——倘若战败，华夏大地将万劫不复。"
 YUN_hundred_years_of_resistance: "百年抗战"
 YUN_hundred_years_of_resistance_desc: "“抗战久持，兵员损耗难免，补充兵员之工作实为关键。国土广阔，人口众多，惟有建立严密之征兵制度，则兵员补充自无虞。吾等必当以坚决之精神与充实之兵力，示敌以我国抗战到底之决心。”"
 YUN_scorched_earth_policies: "焦土政策"
 YUN_scorched_earth_policies_desc: "敌军深入广袤的中国大地后，他们的补给线正愈发单薄、脆弱、不堪一击。随着我军不断撤退到内陆，我们必须放手一搏，摧毁任何敌军可能掠夺的资源，如此才能取得彻底胜利。我们将抢在侵略者之前，将乡村的一切资源消耗殆尽，然后发起一场无情的游击战。"
 YUN_nation_building_through_turmoil: "多难兴邦"
 YUN_nation_building_through_turmoil_desc: "最终，侵略带来的流血与动荡，反而铸就了更为坚定的中华民族认同与手足之情。在残酷战乱面前，无论主义立场如何，我们的同胞如今同仇敌忾，对中华民族国家怀抱着同样的热爱。全体中华儿女都将投身于这场共同的奋斗，在动乱洗礼中构筑起共同的家国。"
 YUN_revival_of_chinas_naval_prowess: "重振中国海军力量"
 YUN_revival_of_chinas_naval_prowess_desc: "许多海上强国或许会对“中国海军力量”这一说法不屑一顾，然而中华民族曾一度称雄整个亚洲，我们舰船的影响力遍及日本、朝鲜、菲律宾、印度尼西亚、马来西亚等地。中国海军或许曾历经低谷与衰弱，但中国注定要在世界各地展现实力，唯有一支强大的舰队才能实现这一夙愿。"
 YUN_the_navy_of_the_national_protectors: "护国海军"
 YUN_the_navy_of_the_national_protectors_desc: "正如昔日护国军的英勇将士一样，我们的海军也肩负着保卫中国人民免遭帝国主义侵略的使命。这是一支专注于本土的防御型力量，但如果有需要，我们英勇的海员绝不会让企图干涉中国事务的外国舰艇全身而退。"
 YUN_the_navy_of_export_militarism: "干预海军"
 YUN_the_navy_of_export_militarism_desc: "归根结底，云南的军事化倾向独具一格，始终怀有向省外扩张的欲望和需要，这种特质已融入我们更广泛的国家意识之中。我们的海军也秉承了这种倾向，并希望将其力量和影响力投射到世界四大洋。"
 YUN_overseeing_the_seas: "睥睨大海"
 YUN_overseeing_the_seas_desc: "在海军航空兵和海军的共同努力下，我国已制定了部署海军轰炸机能力的联合技术方案。这些轰炸机将从机场或航母上起飞，为海军提供支援。第三维度战场的整合必将使中国在海军领域取得绝对优势。"
 YUN_unified_air_doctrine_cohesion: "统一空军学说"
 YUN_unified_air_doctrine_cohesion_desc: "尽管我们的空军依旧闪耀夺目并取得了显著成就，但许多试飞观察员却指出，各支航空队存在作战理念紊乱的问题——这源于昔日中国各地方空军探索的残余影响。归根结底，如果我们要根除这一痼疾，明智的做法是将我们的空军学说整合为统一连贯的体系，并让所有努力的飞行员都能理解和执行。"
 YUN_from_above_and_below: "地面防空"
 YUN_from_above_and_below_desc: "我国空军虽日益精进，能有效保卫人民免受恐怖袭击与战略轰炸的威胁，然而仍偶有敌机悄悄潜入，对村庄和工业区造成严重破坏。每逢此时，将士们自当挺身而出，操纵新建防空设施，击溃入侵领空之敌。无论是从天空还是地面，我们的惩罚将让所有来犯之敌丧胆。"
 YUN_the_jingguojun_of_the_air: "空中靖国军"
 YUN_the_jingguojun_of_the_air_desc: "正如唐继尧的“靖国军”一般，新中国空军也以平定天空为己任。凭借卓越的王牌飞行员和精湛的训练，这些激进的飞行员和勇敢的战士们不畏艰险、不怕牺牲。尽管国家已统一于更广泛的中华民族国家旗帜之下，但云南军事传统已渗透到军队生活的方方面面。"
 YUN_the_king_of_the_southwest: "西南王"
 YUN_the_king_of_the_southwest_desc: "1919年时，唐继尧的权力达到了巅峰，并以“西南王”自居。但在接下来的十年里，他的统治不断受到省内外对手的挑战。1925年，他曾一度有望主导南方政府，但到了1936年，他却连国民党势力盘踞着的黔西地区都鞭长莫及。不过唐继尧呼风唤雨数十年靠的是他狡猾的手段，而在新的一年里，他又开始酝酿新的阴谋。"
 YUN_harness_the_yunnan_army: "动用滇军之力"
 YUN_harness_the_yunnan_army_desc: "滇军有着光荣的历史，面对欧洲帝国主义者侵略，他们保家卫国捍卫国土；面对复辟独夫与赤匪革党，他们坚守共和捍卫民国。他们在一十年代的乱局中勇立潮头，却在二十年代的混战中耻辱大败。蔡松坡与云南讲武堂的继承人们不能再这么颓败下去了，他们必须再度崛起，重建辉煌！"
 YUN_revive_the_national_revolutionary_spirit: "唤醒国民革命精神"
 YUN_revive_the_national_revolutionary_spirit_desc: "国民革命军由孙中山先生于1925年亲手建军，是一支忠于党与人民而非军阀霸主的武装。虽因北伐失败被迫败走贵州，然残存忠勇军人心中的革命使命并未磨灭。他们将鞠躬尽瘁，死而后已！"
 YUN_the_federalist_revival: "联省再兴"
 YUN_the_federalist_revival_desc: "彼号东大陆主人，滇省之掌控者，联省的捍卫者，无可阻挡，无可违逆，彼即——唐继尧！他，就是专制的末日！北洋的阴影！军阀的丧钟！见证民治党的复兴与崛起吧，省议会！联省自治降临了！"
 YUN_leveraging_our_assets: "利用我方资产"
 YUN_leveraging_our_assets_desc: "唐继尧及其同僚统治云南三十余年，自然在省内掌控了相当广泛的资产——矿山、工厂、银行、金钱和权力几乎都流经云南王的宫廷。当务之急在于，这些资金必须用于建设民治党，并整军经武以备义战。"
 YUN_buddhist_revivalism: "佛教复兴"
 YUN_buddhist_revivalism_desc: "唐继尧是一位虔诚的佛教徒，与他的同僚、民治党的创始人章太炎有着诸多共同之处。唐继尧正积极投身与佛教复兴运动，现在正是他全力以赴之时。我们将延请著名高僧虚云入仕，担任精神导师之职，并通过佛教法事改善云南百姓的生活。"
 YUN_joint_committee_of_the_gentry: "士绅一体委员会"
 YUN_joint_committee_of_the_gentry_desc: "士绅们力图与胡若愚或龙云等更容易被左右的军阀结盟，但这不过是他们的一厢情愿。通过章太炎的士绅一体委员会，他们除了屈从于唐继尧的意志外别无选择，否则只会被碾碎。所有人都必须为联省制未来添砖加瓦，并促成旧秩序的终结。"
 YUN_elevating_the_poor_masses: "扶助贫苦大众"
 YUN_elevating_the_poor_masses_desc: "国民党看似高尚，实际上却是一心想欺压群众的卑鄙害虫。他们渴望并恳求群众的真心支持，然后煽动群众制造针对敌人的滔天民怨。然而，一贫如洗的云南不可能实现社会主义（如果没有外援的话），民众应当视自由为恶行。"
 YUN_completing_ma_congs_reforms: "完成马聪改革"
 YUN_completing_ma_congs_reforms_desc: "马聪是一位精明强干的民治党成员，曾在唐继尧的军阀派系内担任文职官员，后来转投国内政坛，在宜良会议上担任唐继尧的首席谈判代表，并于1928年出任财政厅长。马聪致力于消除腐败，却遭到军阀的阻挠。在唐继尧的全力支持下，我们将彻底铲除这一威胁。"
 YUN_the_southwestern_university: "西南联大"
 YUN_the_southwestern_university_desc: "1932年齐燮元实施残酷镇压后，沿海地区的言论自由与民主进程大多停滞不前，大批著名知识分子纷纷避居内陆。在云南周边活动的“新月社”以清华和北大毕业的知识分子为基础，他们非常乐于传播自己的思想。"
 YUN_order_in_guizhou: "贵州秩序"
 YUN_order_in_guizhou_desc: "刘氏家族虽在贵州不得人心，其势力却盘根错节，他们的名声与威望或许已大不如前，但与唐省长的官方支持相比都不算什么。不可否认的是，唐省长与贵州渊源颇深，且被普遍视作屠夫或暴君，可他真的还有其他人选吗？难不成让唐继虞出马？"
 YUN_a_new_national_protection_war: "新护国战争"
 YUN_a_new_national_protection_war_desc: "尽管唐继尧历来反对过度军事化（尽管滇军规模依然庞大），然而时机现已成熟。1925年那次夺取广州的尝试虽功败垂成，但归根结底是因为滇系当时准备不足。如今十年过去，是时候让滇系真正称霸西南了。"
 YUN_aid_our_federalist_allies: "援助联省派盟友"
 YUN_aid_our_federalist_allies_desc: "自二十年代中期联省运动从鼎盛走向全面崩溃以来，云南一直处于相对孤立状态。虽有赵恒惕省长坐镇，但关于贵州合法地位的分歧已引发诸多纷争。然而，联省主义终究无法独存，云南需要盟友才能生存下去。"
 YUN_hold_the_guangzhou_conference: "召开广州会议"
 YUN_hold_the_guangzhou_conference_desc: "不可思议，抑或是冥冥之中自有天意，云南联省派终究实现了十多年前的目标。我们的首次尝试险些付出生命代价，但第二次起事终得天命垂青！如今华南政治权力中心已入我手，是时候向全国宣告：联省运动必将重振雄风！"
 YUN_a_new_order_in_beijing: "北京的新秩序"
 YUN_a_new_order_in_beijing_desc: "护国英雄们做到了，他们摆脱了二十年前战争的桎梏，也摆脱了政治领袖的掣肘，一个全新的、正式的政治秩序正在国家内部建立起来。新秩序将遵循民主和联省主义原则，而非优柔寡断与专制独裁。率先推动这一新秩序的正是唐继尧，他热切地希望为这座新征服的城市添砖加瓦。"
 YUN_control_wartime_commodities: "控制战时物资"
 YUN_control_wartime_commodities_desc: "轻浮作风与个人主义已对国家的战争及其他事业所需宝贵资源造成巨大缺口。物资、食品、衣物及各类装备都是官兵与民众的必需品，然而囤积居奇之风却甚为猖獗。通过扩张政府支持的组织机构，私营工厂的物资生产将获得必要保障。"
 YUN_revise_the_tax_system: "改革税收制度"
 YUN_revise_the_tax_system_desc: "人生唯有两件事不可避：死亡与纳税。虽然这一准则对军阀混战时代极不规律流动的中国人口而言可能并不适用，但那个时代确实见证了两个极端：高死亡率与苛捐杂税。通过彻底改革税制，实施累进税制，我们将为政府提供维持运转所需的资金。"
 YUN_chinas_new_industrial_revolution: "中国新工业革命"
 YUN_chinas_new_industrial_revolution_desc: "环顾四周，一众敌寇皆虎视眈眈，欲使神州大地永陷衰微，让我们的大片国土沦为四分五裂、可恣意盘剥的荒芜之地。然而中国的爱国志士、亿万黎庶、庙堂诸公以及少数广受尊敬的开明人士绝不会让敌人得逞。工业化，包括轻工业和重工业，将保障国家永远能获得国防所需的一切物资。"
 YUN_protect_the_landowners: "保护地主"
 YUN_protect_the_landowners_desc: "我们无意剥夺人民的财产和士绅的权利，也不会因民众的不满而过早地消灭士绅阶层。这样做不仅不合法规，更会招致憎恶。我们寻求的不是暴力，而是变革，因此我们必须坚持保护私有财产的原则。土地纠纷必须得到公平仲裁，地主对于国家的重要性也应得到确认。"
 YUN_encourage_resource_extraction: "鼓励资源开采"
 YUN_encourage_resource_extraction_desc: "中国是一个资源丰富的国度，无论是矿产资源、农作物、劳动力还是文化积淀，这个拥有数千年文明的国度无疑具备足以屹立世界之巅的雄厚资本。然而当下，我国丰富的资源正被宵小之辈与资本家滥用，他们一心想以牺牲国家利益为代价来谋取私利。本应造福大众的资源，理应收归人民公仆所有。"
 YUN_finding_a_third_way_in_china: "开辟中国的第三条道路"
 YUN_finding_a_third_way_in_china_desc: "在革命者与军阀之间，鼓吹改良之人往往被边缘化，陷于那些将激进主义奉为救国良方的煽动者的夹缝之中。然而唯有第三条道路——温和道路，即秉持基于缜密论证的温和观点、谨守审慎言辞，方能挽狂澜于既倒，扶大厦之将倾。"
 YUN_rejuvenating_liberal_conservatism: "复兴自由保守主义"
 YUN_rejuvenating_liberal_conservatism_desc: "对民主之诉求、对人权之渴望、对国家宪政之向往、对法治之呼唤、对思想自由之企盼、对言论自由之追求、反抗威权主义与军国主义及一切压迫之权利——此皆人民不可剥夺之天赋人权。这是新月社中秉持自由保守主义的温和派所承诺的纲领，也是唐继尧必将践行的使命。"
 YUN_rule_of_the_outstanding: "杰出精英之治"
 YUN_rule_of_the_outstanding_desc: "国家岂能沦为那些自以为是、愚昧无知之徒的谩骂对象。治理国家不是纸牌游戏，绝不能被意识形态所左右，而是应该通过现代科学和知识专长来统治。凭借行政才干与专家治理，这个国家应当由最杰出的群体——那些通过考试遴选与民主选举脱颖而出的政治专家来领导。"
 YUN_the_last_stand_against_tyranny: "反抗暴政的最后一战"
 YUN_the_last_stand_against_tyranny_desc: "北洋政府最大的谬误，或许在于其行政、立法与司法机构未能阻止日益增长的专制倾向与法律的彻底滥用——宪法为保障政治胜利而仓促制定。唯有制衡，即政府各部门之间的制衡，以及中央政府与各省的制衡，才能避免国家元首肆意施行暴政。"
 YUN_strengthen_presidential_powers: "强化总执政权力"
 YUN_strengthen_presidential_powers_desc: "愚蠢的军阀们总以为中央政府会对他们予取予求。但中央政府要关注的是人民的需求，而非督理的需求。若是以联邦制将军阀主义合法化，那绝对是愚不可及。中国不能再放任省域主义了，是时候让明智的行政人员们果断行动，将各省政治快刀斩乱麻了。"
 YUN_elevating_the_nations_thinkers: "擢升国之智囊"
 YUN_elevating_the_nations_thinkers_desc: "是开明人士统治，还是少数精英执政？大众政党只会导致多数人的暴政和邪恶压倒那些最适合治理国家之人。民主需悉心培育，而非强加给那些尚未准备好行使民主权利之人。因此，在现政权治下，我们必须提拔国家最聪明、最有才干之人，并让他们肩负起国家未来的重担。"
 YUN_integrate_the_beiyang_bureaucracy: "整合北洋官僚"
 YUN_integrate_the_beiyang_bureaucracy_desc: "理想派和空想者要求彻底抛弃北洋政府的“腐朽”体制，并认为它贪污横行、沉疴遍地，充斥着在新世界秩序中无可救药的人物。然而如此做法实属搬石砸脚，只会得到一个缺乏专业人才、运转失灵的体制。虽然官僚主义确为痼疾，但只要运用得当，亦能推动庞大的国家机器运转。我们唯有不断试错一途。"
 YUN_the_fight_against_imperialism: "反帝国主义斗争"
 YUN_the_fight_against_imperialism_desc: "强加于中国之上的最卑劣罪恶，正是帝国主义在中国境内掀起的侵略狂潮，神州大地惨遭列强肆意瓜分势力范围的惨状仍历历在目。即便当下战火纷飞，贪婪的列强仍对中国虎视眈眈，对中国人民不怀好意。这并非个人之争，而是民族国家间的战争，唯有强者方能生存。"
 YUN_promises_of_constitutional_rule: "宪政承诺"
 YUN_promises_of_constitutional_rule_desc: "虽然听起来或许只是军阀宵小散播的空洞口号，但我们的承诺字字千钧，我们将通过行动捍卫新联省政府的合法性。我们施行的绝非暴政统治，更非党国体制，而是人民公仆之治。我们将奉献毕生践行团结理想，忠于民意代表，恪守法律准绳，维护良好道德！"
 YUN_groundwork_for_a_confederation: "为邦联奠基"
 YUN_groundwork_for_a_confederation_desc: "作为联省运动的主要缔造者之一，章太炎主张中国联省运动应该采取邦联的形式。许多人认为这种立场与他消除军阀割据的愿望是南辕北辙，但事实上，邦联制正是在挖军阀主义的墙角。只要通过邦联制来安抚这些军阀，他们就不会意识到自己在被温水煮青蛙，进而最终能将他们一网打尽。"
 YUN_affirm_governor_loyalty: "确保省长忠诚"
 YUN_affirm_governor_loyalty_desc: "当然，忠诚自有其回报。忠诚能确保信任，也正是忠诚能在同胞之间凝聚真正的力量。忠诚在军队和日常生活中同样不可或缺，在治国之道中也发挥着作用。忠诚未必会滋生腐败，忠诚之人自然会继续留任。而那些背信弃义者，终将如残烛般湮灭于尘烟。"
 YUN_first_among_equals: "同侪之首"
 YUN_first_among_equals_desc: "作为首义之省，云南自1911年以来一直捍卫着共和主义的精髓，且数十年来始终倡导纯粹联省制的共和国。作为同侪之首，云南展现了省级单位的实力——云南省规模适中，不大不小，拥有独自统一全国的潜力。各省若能团结一心，那我们必将拥有足以战胜帝国主义的力量。"
 YUN_unity_through_national_essence: "国粹凝聚团结"
 YUN_unity_through_national_essence_desc: "你很难将个人意志强加于人，正如中央政府难以将其权威凌驾于各省的权利与态度之上。治国恰似培育植物，必须悉心呵护、温和相待，稍有激烈举动便会凋零枯萎。共同的文化传承、佛教信仰与国粹将凝聚人心，那些诋毁地方主义的杂音终将被爱国情怀所消弭。"
 YUN_healing_the_north_south_rift: "弥合南北裂痕"
 YUN_healing_the_north_south_rift_desc: "自古以来，中国南北之间一直存在着由来已久的文化和政治隔阂。北方政治冷漠，施行威权主义，喜好军事干预，历来维护着传统的权力中心和政治格局。而南方则深受军事化倾向和革命思想的影响，酝酿进行巨大的变革和转型。破局之道何在？在于构建完善的权力制衡体系。"
 YUN_for_a_new_china_for_a_new_economy: "为了新中国，为了新经济"
 YUN_for_a_new_china_for_a_new_economy_desc: "北京易主后，国家不得不经历一场或许不合时宜且剧烈的转型，各种设施、部门、企业以及其他经济领域都将被置于国家的直接控制之下。随着管控逐渐放松，当务之急是废除战时管制与垄断体制，将经济体系重新转向满足民生而非军事需求的轨道。"
 YUN_emerging_from_the_ashes: "从废墟中崛起"
 YUN_emerging_from_the_ashes_desc: "个人和集体行动都不足以平息民众的苦难。在新近控制的地区，甚至在我们的家乡，民众正饱受基础设施损毁和货币贬值之苦。唯有通过政府直接援助那些渴望重建家园的民众，并重振银元纸币信用，国家才能真正摆脱困境。"
 YUN_promoting_economic_security: "促进经济安全"
 YUN_promoting_economic_security_desc: "坚持经济民主原则是现代自由经济最重要的价值之一。这一原则既要保障民众的基本生活与经济安全，也要推动财富均衡分配，持续缩小贫富差距。人民渴望更美好的生活，政府有责任增进人民的福祉。"
 YUN_revolution_of_the_middle_classes: "中产阶级革命"
 YUN_revolution_of_the_middle_classes_desc: "当然，这不是一场大众革命，也不是一场精英革命，而是一场中产阶级革命。这场革命属于生产者、企业家，属于那些勇于冒险、积极进取的资本家。在私营与国有企业共同制定的合理规划下，生产力也应当实现提升。希望他们能够遵从这一建议，政府也有义务尽其所能地提供帮助。"
 YUN_sanction_safe_progress: "保障稳健进步"
 YUN_sanction_safe_progress_desc: "在汹涌民怨的推动下，一股前所未有的迅猛进步旋风席卷了神州大地。正是人民对美好生活的渴望，促使中国乃至世界各地掀起了革命的浪潮。无尽的压迫只会引发革命者的猛烈反击，然而如果治国之术高明，便可缓解此类弊病。捍卫和保障工农权利，仅是迈向解放的第一步。"
 YUN_federalist_fortress_in_the_southwest: "联省派的西南要塞"
 YUN_federalist_fortress_in_the_southwest_desc: "直系霸权崩溃后，联省主义再度成为一股强大的力量。关于云南在瓦解中央集权体系中应当发挥何种作用已引发诸多探讨——究其本质，云南历来是反抗暴君、独裁者、保皇派和革命者的堡垒，因而这片土地理应成为联省派的要塞，和联省主义的真正捍卫者。"
 YUN_support_the_southern_government: "支持南方政府"
 YUN_support_the_southern_government_desc: "云南人绝不会甘居人下，但毋庸置疑，如果西南联省政府垮台，云南将陷入极其孤立的境地。我们深知在中国战场中盟友的重要性，因此省府必须竭尽所能协助我方盟友。军队、人员、物资，一切都必须投入到我们共同的目标中。"
 YUN_press_for_unification: "推进国家统一"
 YUN_press_for_unification_desc: "我们那些总是礼貌客套的盟友似乎认为可以继续虚与委蛇，既不愿真心推进统一大业，也不愿把握时机，我们绝不能继续容忍这种情况。世界不会坐等中华民族完成统一大业、静待我国重整河山，我们等待的时间越长，国内外对手的实力就越发强大。我们必须敦促盟友立即展开大规模进攻。"
 YUN_last_holdout_of_federalism: "联省最后的坚守者"
 YUN_last_holdout_of_federalism_desc: "历史似乎将再度重演，这已是军阀混战时代的第三次。云南必须自力更生面对强敌围攻，高举自由、解放与民主的旌旗奋勇而起。如果历史无误，那么云南无疑将坚持到底，最终取得胜利。我们必须竭尽全力，倾尽所有，守护我们所珍视的一切。万岁！"
 YUN_rein_in_the_defence_commissioners: "控制镇守使"
 YUN_rein_in_the_defence_commissioners_desc: "走投无路的唐继尧被迫允许云南大部地区实际上出现了各自为政的镇守使。四大镇守使分别位于昆明、滇北的昭通、滇西的大理，以及滇南的蒙自。自动荡的二十年代以来，他们一直对滇系的政策施加着不当影响。必须让镇守使屈膝臣服于云南王。"
 YUN_self_government_training: "自治训导"
 YUN_self_government_training_desc: "在现有的官僚和县长中，鲜有人接受过充分的联省派政治立场或地方自治教育。通过派遣干部到法政学校，甚至远赴日本等国学习，可以让政府训导资深官员并了解其政治倾向，亦可培养新一代官员，以期他们能够充分赋予地方议会权力。"
 YUN_second_southwestern_conference: "第二次西南会议"
 YUN_second_southwestern_conference_desc: "表面上看，云南是全国联省运动领袖的盟友，但在联省方案的宏大现实中，云南将带领西南各省形成团结的统一阵线。这是我们的天命，没有人能阻止我们。我们将召集西南各方力量的代表，展现云南在全国联省运动中应扮演的角色。"
 YUN_the_yunnan_monroe_doctrine: "云南门罗主义"
 YUN_the_yunnan_monroe_doctrine_desc: "自辛亥革命后步履蹒跚地迈向省级治理以来，云南始终为高举联省共和旗帜而浴血奋战。如今在多条战线上皆有盟友后，云南终于不必再独力支撑此旗。云南的“门罗主义”与湖南类似，旨在专注于地方改革和发展，同时让我们的盟友承担大部分战事。"
 YUN_implement_social_reforms: "推行社会改革"
 YUN_implement_social_reforms_desc: "随着省外战火渐熄，云南现在有了余力让军事退居次要，为必要的改革让位。云南社会中保留了不少文化糟粕，例如专制的刑罚制度，以及荒唐的婚姻、丧葬和送礼习俗。虽然我们无权对人民指手画脚，但我们至少要压制这些糟粕中为害最烈的一批。"
 YUN_spreading_popular_education: "普及大众教育"
 YUN_spreading_popular_education_desc: "仅靠建造宏伟的西南联大，或是容纳一大批中国知识分子，是远远不够的——我们必须启蒙云南的各个阶层。通过普及教育、兴办小学与职业学校、开设夜校及师范讲习所、组织宣讲会等举措，这片土地终将成为西南大地的教育桃源。"
 YUN_true_peoples_government: "真正的民治"
 YUN_true_peoples_government_desc: "人们未能意识到，联省民主不能仅靠地方自主来建立，此举无异于将本省凌驾于国家之上。云南应该实现“真正的”民治，以此为所有省份树立榜样——经济发展、教育和行政改革都将如此。但在国家统一之前，云南不会通过民选产生省长。"
 YUN_reform_the_militia_system: "改革民团制度"
 YUN_reform_the_militia_system_desc: "保甲民团制度及所有类似体系，其设立的初衷是为了护卫乡里。然而在实际运作中，此类制度却沦为地方县长或士绅的工具，助长其对农民的暴虐统治。通过设立中枢机构统一管理民团，可使整个制度至少间接地对省长负责。"
 YUN_consolidate_the_southwest: "整合西南"
 YUN_consolidate_the_southwest_desc: "在地方自治的框架下，通过军事干预或其他方式吞并或控制邻近省份显然是不道德的。联省主义的核心要义在于，各省理应由本省同胞自主治理。然而贵州的实践却表明，如果运用得当，将各省联合起来可以带来可观的效益。让我们将滇黔模式推广到整个西南地区！"
 YUN_reconcile_with_the_socialists: "与社会主义者和解"
 YUN_reconcile_with_the_socialists_desc: "唐继尧这位所谓的“开明”省长对待云南本地工人运动的方式简直令人作呕。他畏惧民粹主义，又猜忌所谓的“激进思想”，并通过收买和其他方式摧毁了知识分子和工厂中的所有合法工人代表组织。我们的社会主义同胞并非敌人，他们的目标和其他中国人并无二致，只需用大赦来安抚他们即可。"
 YUN_root_out_the_socialists: "铲除社会主义者"
 YUN_root_out_the_socialists_desc: "显而易见的是，击败国民党并不足以阻止云南落入煽动者和民众的暴政。各种革命团体仍在云南境内活跃，并通过地下组织散播毒害，尤其是那些由王复生和李鑫领导的团体。对于高度农业化且贫困的中国而言，不适应经济发展水平的社会主义革命没有立足之地。希望这些赤匪不要敬酒不吃吃罚酒。"
 YUN_seize_federalist_leadership: "夺取联省派领导权"
 YUN_seize_federalist_leadership_desc: "天下没有不散的筵席，盟约更是如此。不幸的是，云南早已习惯独自肩负重任，自力更生。联省运动前任执炬者陨落后，唯有云南才能凭借应有的继承权，坐上联省领袖的宝座。"
 YUN_refuge_for_intellectuals: "庇护知识分子"
 YUN_refuge_for_intellectuals_desc: "新月社和西南联大在云南扎根后，这片土地在某种程度上已成为中华民族知识和发展的宝库。当然，省府资助、扶持并培养这些胸怀大志的现代士人，无疑是互利共赢的明智之举。"
 YUN_patriotic_labour_unions: "爱国工会"
 YUN_patriotic_labour_unions_desc: "工会是一种特殊而光荣的组织形式，代表着构成工业社会基石的人民群众。在中国工业革命中，工会理应保持其影响力并发挥应有作用。但工会必须远离政治，政治化会玷污其发展潜力，毒害工人复兴的源泉。工会应当坚持非政治化原则，其力量不应来自专横的政客，而应源自纯粹的爱国之心。"
 YUN_addressing_the_currency_crisis: "解决货币危机"
 YUN_addressing_the_currency_crisis_desc: "诚然，内战频仍、国家统一大业未竟，以及反外国列强侵略的全面抗争，并非经济发展或建立商业联系的良机。更糟糕的是，云南当地还深陷多种货币涌入的混乱局面——德国马克、富滇银行纸币乃至袁大头银元和辛亥革命前的旧钞仍在市面流通。然而，通过扶持富滇银行扩张，或许能为当下困局找到破解之道。"
 YUN_gathering_capital_and_labour: "聚集人力物力"
 YUN_gathering_capital_and_labour_desc: "或许是由于云南省府对劳工运动采取了过于强硬的手段，导致该省严重缺乏中国工人来为其雄心勃勃的发展项目提供资金。交通运输、农业、矿业和轻工业的现代化都需要劳动力。如果能引进越南和香港的劳工，并为中国外省移民提供工人住房，云南甚至能发展到足以与上海相媲美的程度。"
 YUN_promoting_mass_education: "推广大众教育"
 YUN_promoting_mass_education_desc: "随着地方教育设施的发展，云南内部逐渐形成了派系林立的局面。所谓的“北京派”与学生群体中日益高涨的激进主义有关，他们的激进作风也延续到了教育事业中。他们组织了云南学生会，并制定了一套以爱国主义、民主和反对旧观念为核心的成人教育方案。"
 YUN_push_for_economic_revival: "促进经济复苏"
 YUN_push_for_economic_revival_desc: "自辛亥革命以来，中国饱受战乱蹂躏，此前更是匪患横行，导致经济严重受损且受外国势力主导，许多省份的经济尤其落后。然而，要想移山填海，中国人必须实现真正的经济繁荣和独立自主。如果民众和政客看不到经济重建乃当务之急，那就必须让他们认清形势。"
 YUN_freedoms_final_call: "自由的最后呼唤"
 YUN_freedoms_final_call_desc: "至暗时刻已然到来！那些背信弃义的阴谋家，我们曾经的盟友，如今竟要背叛自己的理想！为了自己的权势和痴心妄想，他们竟要制造分裂！此事绝不可容忍！联省派的烈士们为了强大、自由、公正的民主制度而战，岂能坐视民主被野心勃勃的独裁者和他们那群冷酷无情的官僚摧毁。一马当先抗击暴政正是云南的天命所在，我们必须拿起武器，向敌人发起进攻！"
 YUN_a_patriots_war: "爱国者之战"
 YUN_a_patriots_war_desc: "真正的爱国者绝不会袖手旁观，任由国家再次陷入专制和威权主义的深渊！这是一场对抗失控体制的人民战争，是一场对抗秩序崩坏的战争，是一场关乎当下、更关乎子孙后代的战争。所有中华儿女都有义务为自由而战。"
 YUN_exploiting_divided_loyalties: "分化瓦解"
 YUN_exploiting_divided_loyalties_desc: "叛军后方与总部并非铁板一块，这一点从他们叛变前后的行动中可见一斑。我军只需巩固阵线，并争取那些心怀叛意与亲眼目睹不公之人，叛军必将分崩离析，他们的决心也将荡然无存。"
 YUN_leadership_of_the_best_and_brightest: "精英人才统帅"
 YUN_leadership_of_the_best_and_brightest_desc: "云南陆军讲武学校培养了我国最为出色的将领、军官与指挥官。在规模更加庞大的军事教育团队的培育下，这所军校堪称国家荣耀的象征，激励着校友们秉持责任、荣誉、奉献和爱国主义精神。毫无疑问，滇系因这所军校而更加强大，也正是滇系军官将带领我们稳步迈向胜利。"
 YUN_the_lessons_of_fire_and_blood: "火与血的教训"
 YUN_the_lessons_of_fire_and_blood_desc: "几个世纪以来，中华民族的历史浸透了血与火、战乱与分裂的苦难。我们今日的起义，不过是绵长抗争史中又一次反抗国家暴政与专制统治的壮举，但这次我们必将成功。近代以来，从辛亥革命到护国战争，云南始终是夺取胜利的首义之地，过往的胜利自然会激励我们继续向前。"
 YUN_sustaining_the_republics_flame: "延续共和火焰"
 YUN_sustaining_the_republics_flame_desc: "追求民主、自由及联省主义是崇高的理想。这是中国人民真正的乌托邦理想，他们将和西方以及世界其他地区的民众一样，能够行使选举和罢免的民意授权。正是这团熊熊燃烧的火焰见证了中国共和革命的辉煌，也正是因为我们守护了这团火焰，最终才能燃起燎原之火。"
 YUN_no_sacrifice_no_victory: "没有牺牲，就没有胜利"
 YUN_no_sacrifice_no_victory_desc: "没有牺牲，就不可能取得胜利。革命派和改良派烈士用生命证明了他们的斗争没有白费，中国人民也必须通过反抗暴政的斗争，再次凝聚起众人的意志。我们将战胜独裁者，确保民国的长治久安。无论付出何等代价，中国必将统一，民主制度也必将得到推行。"
 YUN_the_fight_for_human_rights: "争回人权"
 YUN_the_fight_for_human_rights_desc: "唯有持续不断地追求不可剥夺的人权，自由民主的政治体系方能诞生——这一直是新月社纲领的核心要义。国家不能只着眼于赋予公民权利，却忽视与生俱来的人权。当全球民主政体皆以公民权利为先时，新月社将率先迈出步伐，真正确立人权至高无上的地位。"
 YUN_cultivating_liberal_nationalism: "培育“自由”民族主义"
 YUN_cultivating_liberal_nationalism_desc: "许多人认为，全面动员人民是对抗外来帝国主义的良方，将文化和军事力量集中起来反击东京、莫斯科或柏林。他们的观点虽然不无道理，但真正能够对抗帝国主义的，是民族主义，是人们对祖国、历史和文化的崇敬与自豪。国际主义不妨暂且搁置，至少待中华大地尽归国人治下后再议不迟。"
 YUN_promoting_positive_thinking: "促进积极思维"
 YUN_promoting_positive_thinking_desc: "徐志摩曾指出，军阀混战导致“所有价值标准”在动荡中逐渐崩塌、善良人性日益沦丧。这种“积极思维”的缺失，使得无意识与潜意识的思想得以侵入有意识的活动。但局势并非无可挽回：知识分子当承袭儒家遗风，致力于道德与精神修养；换句话说，应当推行专家治国。"
 YUN_health_and_dignity: "健康与尊严"
 YUN_health_and_dignity_desc: "由于军阀混战时期国家四分五裂，社会服务、医疗保健、福利以及各种旨在维护中国公民福祉的慈善事业大多处于停滞状态，基督教传教士、红十字会和军阀的慈善活动在很大程度上取代了中央医疗体系。但正如新月社文学理想所象征的那样，政府必须努力恢复民众的“健康”和“尊严”。"
 YUN_leadership_of_the_talented_minority: "极少数天才之治"
 YUN_leadership_of_the_talented_minority_desc: "曾经的清廷是在以进士为首的士大夫们的辅佐下走向开明的。这些士大夫以孔孟为榜样，赢得了朝廷和社会的信任，并在中国政府中担任专家。因此作为他们的继承人，当代知识分子和专家自然也要承担起他们的责任，在中央官僚机构中发光发热。"
 YUN_ending_the_political_chaos: "终结政治混乱"
 YUN_ending_the_political_chaos_desc: "中国当前的政治混乱局面，自然主要源于两股邪恶势力：一是掌控政府和政治的军事派，二是为牟取私利而大肆掠夺的军阀、土匪和贪官污吏。若想遏制这些邪恶势力，就必须约束军队，并彻底清除官僚机构中的腐败分子。政客之间的争斗不会带来任何好处，政府有责任制衡他们。"
 YUN_third_way_economics: "第三道路经济"
 YUN_third_way_economics_desc: "中国在很大程度上是一个农业社会，农民在士绅地主的土地上劳作，而像天津或上海这样为数不多的中心城市支撑着城市生产力领域的很大部分。若想改变中国，就必须建立国家控制的经济体制。国家是推动全国发展的工具，为了国家发展，必须摒弃自由市场和阶级斗争。"
 YUN_the_peaceful_road_to_socialism: "迈向社会主义的和平之路"
 YUN_the_peaceful_road_to_socialism_desc: "由于中国自身缺乏物质上与经济上的繁荣，贫困潦倒、愤懑不平的人们很容易诉诸历史唯物主义观点和阶级斗争理论来寻求摆脱困境。然而，真正的苦难根源并非经济不平等，而是政治不平等。要达成中国社会主义的最终目标，必须通过民主进程来实现。"
 YUN_spartan_education_methods: "斯巴达式教育理念"
 YUN_spartan_education_methods_desc: "正如寸树声反复强调的那样，若想在残酷的现实中生存下去，中国社会，尤其是各级学校和大学，就必须完全自给自足。学生们肩负着传承数千年传统文化的重任，因此必须学会严谨自律、勤奋务实、乐于接受新思想，同时坚守一套简洁统一的核心准则。"
 YUN_from_a_spark_to_a_prairie_fire: "星火燎原"
 YUN_from_a_spark_to_a_prairie_fire_desc: "星星之火，可以燎原，尺寸之志，可成革命。寸树声和苏鸿纲这两位令人敬佩的教育家手中的火炬，将会给全国全民族以光明的启示。每一个黄帝的子孙，是不会当顺民，不甘心做奴隶的！"
 YUN_economic_stewardship: "经济管理"
 YUN_economic_stewardship_desc: "黑色星期一和近些年的经济衰退已经清楚地表明，中央政府绝不能袖手旁观，任由农业领域和工业领域在经济困难时期陷入混乱。中国尤其需要政府积极参与经济事务；寻求和平解决土地纠纷、减轻农民苦难，并保护地主与自由企业利益，以及各种稳定的经济活动都必须由国家主导管理。"
 YUN_mandatory_public_education: "公共义务教育"
 YUN_mandatory_public_education_desc: "1902年，光绪皇帝颁布诏令，关闭昆明五华书院等所有传统学校，并按照现代原则进行改革，同时还新建了两所师范学校（男女校各一所）以及矿业学校和法政学校。到二十年代，云南已有10所现代学校，学生人数达2000人。教育一直是云南人民生活的核心，也必须成为中国人民生活的核心。"
 YUN_scholarly_civil_service: "学者型公务员"
 YUN_scholarly_civil_service_desc: "世界上最令人钦佩的公务员制度当属美国制度。从乔治·华盛顿时代起，美国的公务员制度发展一直堪称典范。华盛顿和杰斐逊都秉持着无私奉献的精神，清除腐败，并确保公务员队伍始终忠于国家，而非任何政党。中国应当效仿美国典范。"
 YUN_modernising_china: "现代化中国"
 YUN_modernising_china_desc: "中国若想成为一个独立自主、真正强大的国家，就必须迈向现代化。而要成为一个现代化国家，就必须建立在农业、商业和工业的基础之上，所有西方国家都是依靠这三大支柱产业而变得富裕强大的。只需要少数自信的中国商人，我们有朝一日就能建立一个能与西方同行相媲美的宏大商业圈。"
 YUN_zhang_taiyans_federation: "章太炎之联省"
 YUN_zhang_taiyans_federation_desc: "尽管未必完全符合章太炎的愿景，但他的旗帜依然高高飘扬在京城。作为国家的精神之父，章太炎的继任者必须努力建立一个既能有效运作又能保持平衡的政府。这并非邦联制，而是尽可能地实行自治；各省将被赋予权力，甚至可以拥有自己的军队，但中央政府仍须保留其主导权。"
 YUN_peace_with_the_democrats: "与民主人士和平共处"
 YUN_peace_with_the_democrats_desc: "人们普遍担心民治党会试图建立独裁政权，或者像和谐社团、光复系等粉饰门面的组织那样一党独大，但事实却相去甚远。民治党现已抛出橄榄枝，不仅要缓和与中国民主同盟和独立民主人士的紧张关系，中国青年党也不例外。"
 YUN_grand_republican_statesman: "伟大的共和政治家"
 YUN_grand_republican_statesman_desc: "唐筱蓂虽然是联省派阵营中不被看好的候选人，但他也具备诸多优势，包括接受过良好的教育，年轻有为，并对民治党纲领提出了“现代化”的解读，堪称是中国新生代政治家的代表人物。唐筱蓂与更广泛的共和大同盟以及中国民主同盟保持着更为紧密的关系，是政坛上一股温和、自由且凝聚人心的力量。"
 YUN_fair_competition_in_the_middle_kingdom: "中国的公平竞争"
 YUN_fair_competition_in_the_middle_kingdom_desc: "革命派通过推行乔治主义式的土地改革（即“耕者有其田”）来赢得群众的支持，他们主张将耕地归还给农民。此举在剥夺了士绅阶层统治地位的同时，也相对削弱了他们的影响力。在农业事务中，必须保持平衡与和谐，即由仁慈的地主督导勤恳的佃农。"
 YUN_arbiter_between_the_provinces: "各省间的仲裁者"
 YUN_arbiter_between_the_provinces_desc: "唐继尧乃中国现代政治史上无出其右的政治家，这位革命烈火孕育的爱国赤子，不仅为中国人民带来了真正的自由，更是开创了真正的民主。唐继尧是一位一言九鼎、不偏不倚的核心人物，并以其开明睿智维持着各方利益的平衡，堪称名副其实的“同侪之首”。"
 YUN_the_saviour_of_the_nation: "国家救星"
 YUN_the_saviour_of_the_nation_desc: "没有哪个家族能像唐家这般出色。在民治、民主与联省的旗帜下，他们不仅缔造了共和的繁荣，更确保了云南人在中国事务中的主导地位。他们是国家救星，是抵御专制的英勇战士，如今他们将再次挺身而出。"
 YUN_demobilising_the_army: "军队复员"
 YUN_demobilising_the_army_desc: "在新生的中华联邦中，尽可能遏制军阀主义及其余孽至关重要，绝不能重蹈军阀割据的覆辙。在赋予各省自治权的同时，必须确保军事派不会因此而掌权。国家军队必须缩减至20万人，如此规模足以在维护国家完整的同时开展独立行动。"
 YUN_preserving_chinese_culture: "保护中华文化"
 YUN_preserving_chinese_culture_desc: "中华文明已蒙尘数载。百年国耻，数十年内讧纷争，政体衰败，社会凋敝。我们拥有数千年历史的古老文化饱受摧残，但此将不再！我们必须谨慎保护中华文化，令其蓬勃发展。令佛教成为约束，与我中华紧密相连，则不论是社会主义还是帝国主义，都不会再让我们蒙受耻辱。"
 YUN_the_liangist_ideal: "梁启超系之理想"
 YUN_the_liangist_ideal_desc: "章太炎的联省构想固然美好且理应受到尊重，但若赋予各省极大的自治权，他们恐怕不会甘心依附于北京。在章太炎最为极致的理想蓝图中，他希望依靠“好人”尽忠职守，然而唐继尧深知“好人”的下场。唯有强大的国家和政府才能维系国内平衡。"
 YUN_mastering_beiyang_politics: "掌握北洋政治"
 YUN_mastering_beiyang_politics_desc: "尽管北洋政坛局势错综复杂，但有一点毋庸置疑：若想在虎穴中生存，就必须结交盟友。而包括中国青年党在内的众多利益集团，都渴望找到一位能够统一国家的核心人物，因此纷纷向唐继尧抛出了橄榄枝。万众一心，则国家必将强盛坚韧，不再沦为列强掌中玩物。"
 YUN_bearing_our_fathers_torches: "高举父辈火炬"
 YUN_bearing_our_fathers_torches_desc: "让中华民族愈发强盛是先辈交给我们的使命。章太炎、孙中山、梁启超，他们的政治观点或许有所出入，但他们的爱国情怀毋庸置疑。因此，每一位中国公民，无论出身背景、从事何种职业，都有责任传承我们共同的遗产，携手迈向繁荣昌盛的新时代。"
 YUN_cai_es_champion: "蔡锷传人"
 YUN_cai_es_champion_desc: "对唐继尧一生影响最大之人莫过于蔡锷。是蔡锷教授唐继尧治国之道，是蔡锷提拔倚重唐继尧，是蔡锷在国家最危难之际挺身护国。若不是英年早逝，如今身居高位的或许正是蔡锷——一位超脱政治、凌驾于党派之上的“同侪之首”。唐继尧唯愿自己没有辜负蔡锷的期许。"
 YUN_resurgence_of_the_kuomintang: "国民党东山再起"
 YUN_resurgence_of_the_kuomintang_desc: "滇黔对决以贵州国民党取得压倒性胜利告终后，唐继尧及其联省派骨干被逐出了云南。为了巩固国民党的统治，并将云南从军阀割据的泥潭中解放出来，[ROOT.GetLeader]决定拉拢云南各界知识分子，即便引发争议也在所不惜。"
 YUN_hope_in_defeat_meaning_in_despair: "败而不馁，困而不哀"
 YUN_hope_in_defeat_meaning_in_despair_desc: "在军阀和外来帝国主义者的蹂躏下几乎全军覆没后，许多人认为我们的运动已奄奄一息、分崩离析，如同行尸走肉，只剩负隅顽抗。然而，我们在绝境中痛定思痛、在流亡中自省不足、在失败中浴火重生，最终成为民族的新希望。"
 YUN_mobilisation_of_the_soul: "动员精神"
 YUN_mobilisation_of_the_soul_desc: "为重拾传统价值观的物质力量，党必须完成精神转变，匡扶国人的道德品行、生活习惯、思想观念与理想抱负。为了真正动员民众意志、助力新中国的国家建设，我们当以劝导与约束并举的方式引领国民，为改进国家而努力。"
 YUN_dealing_with_yunnans_establishment: "处理云南权威人物"
 YUN_dealing_with_yunnans_establishment_desc: "表面上看，云南的行政管理已焕然一新，白日照耀着四面八方，但在这层光鲜亮丽的表象之下，云南社会的根基依然如故。与龙云、胡若愚一样，先前的士绅和官僚虽然不情愿地加入我们的事业，但他们仍对党心存疑虑，现在是时候决定他们的命运了。"
 YUN_scientific_management: "科学管理"
 YUN_scientific_management_desc: "在不断追求进步的过程中，党国必须致力于规范公民的日常行为。救亡图存的伟大斗争正是在图书馆、实验室和车间里展开，我们的民众应当准时参会、及时完成任务，减少在无谓琐事上浪费的时间。如此一来，我们定能使中华文化焕发新生。"
 YUN_contact_the_ZSRC: "联系浙江同志"
 YUN_contact_the_ZSRC_desc: "作为党内一个难以捉摸的小集团，中央俱乐部与中国社会中更邪恶的成员保持联系也不足为奇。在“革命同志会浙江社”的帮助下，陈氏兄弟和戴季陶得以利用他们与青帮间的联系来支持革命。"
 YUN_cult_of_violence: "暴力崇拜"
 YUN_cult_of_violence_desc: "党内存在诸多矛盾，其中最令人担忧的当属对社会暴力的明文禁止。在现代法律体系中，暗杀及类似手段显然是滔天罪行，这一点亦为党所尊重。但与此同时，国民党却洞悉此类犯罪行径蕴含的巨大能量。若运用得当，暴力本身可作为规训民众的绝佳工具。"
 YUN_utilisation_of_the_youth: "利用青年才俊"
 YUN_utilisation_of_the_youth_desc: "在云南，学术机构已然成为学生激进思潮的温床。当局一心期望将学生局限于校园之内，不让他们参与管理事务，却未能真正认识到青年群体的全部价值。通过推广童子军等青年组织，我们将在中国未来一代中培养服从意识、志愿精神和自我修养。"
 YUN_awaken_the_sleeper_cells: "激活潜伏小组"
 YUN_awaken_the_sleeper_cells_desc: "国民党势力范围曾经遍及湖南、广西、广东、福建和江西等地，与周边省份有着千丝万缕的联系，如今在这些省份仍然拥有大量退伍军人、公务员和其他关系网。若能重建与这些失散盟友的联系，我们便可获取外省的重要军政情报。"
 YUN_lighting_the_match: "点燃柴薪"
 YUN_lighting_the_match_desc: "若想自云南根据地北进，唯有让我方或盟友掌控华南明珠广东，使本党的革命策源地再度成为北伐摇篮。毕竟国家统一是我们的唯一目标，其他一切都必须服从于此，国民革命军也需为此全力以赴。"
 YUN_hold_a_national_congress_focus: "召开全国代表大会"
 YUN_hold_a_national_congress_focus_desc: "广州已入我手，我们的法统已经足够正当，可以召开国民党全国代表大会，将党内各色右派势力团结起来，凝成一个革命政府。但建设行之有效的党国仍道阻且长，党内各派之间则分歧甚广，鹿死谁手尚未可知也。"
 YUN_developing_the_civilian_party: "推进文官治党"
 YUN_developing_the_civilian_party_desc: "民族主义的基础，就是在孝慈的道德；民权主义的基础，就是在信义的道德；民生主义的基础，就是在仁爱和平的道德。如今本党已经稳固重建于广东发祥地，是时候着手进行国民革命了。"
 YUN_western_expedition: "挥师西进"
 YUN_western_expedition_desc: "孙中山先生早在1915年就曾主张，在进军背信弃义的外部势力之前，必须先确保中国腹地免受敌对势力的侵害。内陆山地盘踞着许多国民革命军和党国的敌人，必须摧毁这些张牙舞爪的军阀。"
 YUN_eastern_expedition: "三次东征"
 YUN_eastern_expedition_desc: "十年前，国民革命军曾两度东征，分别攻入了被陈炯明控制的粤东和福建地区。如今革命的始源地再度受到威胁。随着八省联合崩溃带来了巨大的权力真空，我们必须抓住机会占领南京。"
 YUN_return_of_the_northern_expedition: "再度北伐"
 YUN_return_of_the_northern_expedition_desc: "中华民族历来便分为南北两地，南方革命者和北方专制者间的斗争历史悠久。二十年代，孙中山先生为发动北伐改组了国民党，却破坏了国民党的初衷。但如今我们的党重建了力量，我们的军队恢复了活力，我们的子弟也有了钢铁般的意志，是时候挥师北上了！"
 YUN_expelling_national_traitors: "驱逐国贼"
 YUN_expelling_national_traitors_desc: "俄罗斯人、满族人和日本人长期为了东北而争斗不休，但中国人才是这片土地的真正主人。清朝建立后，东北地区就已经成为这个国家不可分割的一部分。再也不能让那些对异想天开的日本人卑躬屈膝的叛徒统治东北了！"
 YUN_enacting_tutelage_of_the_masses: "开始训政"
 YUN_enacting_tutelage_of_the_masses_desc: "一党专政不仅意味着接管现有国家机器，党还必须承担起“先知”的使命，将三民主义真理传播给人民。干部必须不顾个人安危传播革命福音，而非仅仅建立一套新的官僚体系。我们的革命是人民的革命，既要对抗物质至上的侵蚀，也要涤荡腐败沉疴。"
 YUN_establishing_a_central_political_school: "建立中央政治学校"
 YUN_establishing_a_central_political_school_desc: "这所被冠以“中央党务学校”之名的院校将采用四年学制，并以社会科学作为学术课程重点，这一设置源于中央俱乐部的深远考量。正如陈氏兄弟所宣扬的，国家如今普遍缺乏称职的管理者，而建设明日之国则需要新一代人才。"
 YUN_educating_our_officers: "教育军官"
 YUN_educating_our_officers_desc: "令人遗憾的是，许多通过收编或其他途径加入我们队伍的军官，虽然精通军事技能，但在其他方面却乏善可陈。通过选拔新一代人才进行深造，并改进我们的教育体系，我们可以全面提升军官的综合素质。"
 YUN_ensuring_public_safety: "保障公安"
 YUN_ensuring_public_safety_desc: "我国的情报机构和警察部队是国民党各派系争论的焦点之一。由“中国警察之父”李士珍创立的“广州市公安局”，借鉴了美国警务模式，最终旨在将其打造成未来全国警政体系的核心枢纽。"
 YUN_revolutionary_shock_troopers: "革命突击队"
 YUN_revolutionary_shock_troopers_desc: "我军将士不应只以枪炮为武器，更应成为向四方民众传播国民革命的开路先锋。他们应当运用这些武器，将三民主义理念付诸实践。通过广泛的启蒙工作，我们将让全体官兵笃信主义且矢志不渝。"
 YUN_a_cultural_revival: "文化复兴"
 YUN_a_cultural_revival_desc: "归根结底，我们革命新中国的基石与民族根基一脉相承。儒家思想和中国“本土文化”是党的两大基石，党则是中华道德的守护者。通过推广戴季陶倡导的法团主义儒家思想，党才能将工业现代化与中国传统结合起来。"
 YUN_attract_nationalist_technocrats: "吸引民族技术官僚"
 YUN_attract_nationalist_technocrats_desc: "或许是出于短见或固执，我们尊敬的孙中山先生不幸地排斥并抛弃了一大批前途无量的国民党党员，将他们的自由主义倾向视为投机取巧或唯利是图的迹象。1912年同盟会改组为国民党后，这些人便与我们分道扬镳。让我们再度握手，以爱国之名重归于好。"
 YUN_our_nation_supreme_and_sacred: "炎黄世胄，东亚称雄"
 YUN_our_nation_supreme_and_sacred_desc: "中华民族是一个独一无二的民族，在历史、贡献和文化方面都远超其他任何民族。中国人民唯一的职责便是誓死捍卫国家利益。通过控制宗教、教育、艺术、新闻、经济以及人民日常生活的方方面面，党将重振国家在世界上的地位。"
 YUN_concern_for_the_rural_masses: "心系乡村群众"
 YUN_concern_for_the_rural_masses_desc: "最终，为了凝聚民众力量对抗军阀、联省派和帝国主义者，军队必须证明其心系中国人民——无论是农民还是工人。因此，陈诚和其领导的土木系将会推动实施一系列土改政策以凝聚民心。"
 YUN_mobilisation_of_the_nation: "动员国民"
 YUN_mobilisation_of_the_nation_desc: "中国人绝不能继续受制于外来帝国主义的侵略和军阀独裁者的统治。通过强制农民加入类似民兵的团体，并学习射击、演讲和军事信号等技能，我们可以建立一个完全自给自足的社会。一个缺乏理性的社会，其灵魂必将丧失活力。"
 YUN_the_way_of_the_youth: "《青年之路》"
 YUN_the_way_of_the_youth_desc: "在戴季陶出版的《青年之路》一书中，概述了未来中国几代人要如何引导民族正确实现救亡图存和现代化。社会主义妖魔口中的甜言蜜语不可信，中国人民和中华民族国家只有依靠民族动员才能繁荣富强。"
 YUN_kuomintangising_the_southwest: "西南国民党化"
 YUN_kuomintangising_the_southwest_desc: "尽管自李根源创办云南陆军讲武学校以来，国民党就一直秉持共和理念，但始终未能真正牢固扎根于云南省。国民党虽然在云南拥有一定影响力，却从未形成现代意义上的国民党政权。如今我们既已身处云南省，就必须努力展现党的诚意。"
 YUN_cleaning_out_the_rot_and_decadence: "清除腐败堕落"
 YUN_cleaning_out_the_rot_and_decadence_desc: "唐继尧及其地方封建领主对云南的行政管理极其混乱，在省内滋生了腐败之风。他们只顾个人私利，罔顾国家利益，放任土匪、商人横行无忌。为了让党尽快重返广州，我们曾一度容忍这种局面。但现在，一切必须到此为止。"
 YUN_humbling_the_kingmakers: "打压“拥王者”"
 YUN_humbling_the_kingmakers_desc: "尽管受到国民党政权的打压，但依靠胡若愚的势力，云南的旧势力残余依然顽强生存着。他们之间维持着一种尴尬却互惠互利的协议，不过这种局面显然无法长久。然而在局势生变之前，士绅阶层仍然盘踞一方，我们当下至少可以借助其力量推动发展。"
 YUN_incentivising_the_enlightenment: "激励启蒙"
 YUN_incentivising_the_enlightenment_desc: "国家的繁荣和现代化离不开教育中心，但由于各省军阀更注重实现军事而非社会目标，这些教育机构反而被边缘化。为了纠正这一错误，我们应当调拨大量资金，在国内开启一个全新的启蒙时代。"
 YUN_relief_to_the_laobaixing: "救济老百姓"
 YUN_relief_to_the_laobaixing_desc: "国民党在云南的统治已经稳固，我们不能再仅仅提供临时性的、不切实际的方案来应付人民的需求。普通民众哀叹自己的处境，要求获得某种形式的补偿，并期盼进步和解放。在党内左派影响的引导下，让我们努力改善并提升普通无产阶级的境况。"
 YUN_two_model_zhus: "“模范二朱”"
 YUN_two_model_zhus_desc: "朱培德和朱德这“模范二朱”早年在云南讲武堂结下了兄弟情谊，而这个绰号正是因为二人在云南讲武堂和滇军时代的杰出表现和英勇服役而得到的。二人从同学时代起就维持着密切的关系，凭借这层关系，党内右派也逐渐接纳了左派的影响。"
 YUN_rallying_the_legacy_of_the_southwest: "振作西南传承"
 YUN_rallying_the_legacy_of_the_southwest_desc: "长期以来，昆明一直在国家事务中发挥着远超自身体量的作用。云南曾被视为一个贫困的内陆省份，其主要目标是维护中国在印度支那和缅甸的利益，而非干涉北京事务。然而云南却屡屡让诋毁者刮目相看。这种精神从未离开昆明，没有离开！而在国民革命的征程中，我们将始终恪尽职守，捍卫革命根基。"
 YUN_a_combined_political_military_offensive: "政治与军事攻势结合"
 YUN_a_combined_political_military_offensive_desc: "自1924年国民党与工团党在统一战线中携手合作以来，两党之间便发展出了革命兄弟般情谊。然而，工团党内的激进分子……特别在云南的家伙却与国民党形成了某种对抗气氛。通过发起一场“七分政治、三分军事”的政战攻势，我们将遏制工团主义的赤潮。"
 YUN_contacting_the_yunnan_labour_unions: "联络云南工会"
 YUN_contacting_the_yunnan_labour_unions_desc: "长期以来，云南省内的工团主义工会运动如同园中含苞待放的花蕾。在历任云南政府的共和主义热情与严峻形势的共同培育下，加之党的影响推动，云南工会逐渐成长为省内一股不可忽视的力量。让我们利用与中国工团党的共同联系和友谊，与昆明各工会建立起积极关系。"
 YUN_our_part_in_the_national_revolution: "为国民革命尽职尽责"
 YUN_our_part_in_the_national_revolution_desc: "纵使我们仅为孙先生革命理想中一块重要拼图，但我们不可袖手旁观，任由白日之敌日益壮大。一切人力、物力都送往支持中央委员会，协助国民党之旗手收复失地、统一全国。"
 YUN_throwing_ourselves_in_the_ring: "直面战斗"
 YUN_throwing_ourselves_in_the_ring_desc: "国民党竟再遭惨败！即使党中央再次崩溃，白日之下的志士仍将奋力奔向最终胜利。我们将坚定捍卫国民革命与三民主义之理念，决无撤退转进、进行二次长征之念想。为防止此类恶梦重演，[ROOT.GetLeader]必须力挽狂澜。"
 YUN_directing_the_flames_of_revolution: "引导革命之火"
 YUN_directing_the_flames_of_revolution_desc: "近来，中央委员会变得有些骄傲自满。虽然我们彼此都热爱、敬仰并渴望看见国家统一，但他们却安于现状，固步自封。而现在，本党本军最需要的莫过于果断行动！让我们提醒党中央，他们仍肩负着革命之使命。"
 YUN_form_the_southwest_china_political_council: "组建西南政务委员会"
 YUN_form_the_southwest_china_political_council_desc: "我们承认中央委员会于主流政务中的权力，但仍不能忽视昆明迄今在国民革命中所付出的努力与成果。昆明以滇、黔两省之力，在国民党的各项事业中英勇作战，而这将成为整个西南地区的榜样。"
 YUN_a_revolutions_sole_visionary: "革命的独醒者"
 YUN_a_revolutions_sole_visionary_desc: "早在国民革命军建军之前，第三军就已是党坚定的拥护者，他们比任何人都知晓国民革命军的牺牲对孙先生梦想实现有着何等重大作用。只有他们能够设计出一个没有黄埔顽劣后辈的未来。"
 YUN_a_business_utopia_in_the_southwest: "西南商业宝地"
 YUN_a_business_utopia_in_the_southwest_desc: "中国这许多雄心勃勃的商人和企业家肯定会更喜欢上海、沈阳、北京、南京、广州甚至香港这样的大都市，不过嘛，有些精明老练的政学系技官有着精湛学识和个人魅力，能够博得他们在金融界同伙的好感。"
 YUN_a_new_deal_with_political_science: "与政学系的新协议"
 YUN_a_new_deal_with_political_science_desc: "新政学系曾使用过包括“新中国建设学会”在内的一众名称，而“新政学系”则是他们的最新招牌。这一名称是张群对政治科学的总体概括，即新一代自由派与老派官僚、政治家、知识分子和名人合流，并推行高度乐观积极的经济管理方式。"
 YUN_returning_to_the_revolutions_root: "回归革命根源"
 YUN_returning_to_the_revolutions_root_desc: "国民党首先是一场源于知识分子思想与著述的运动，旨在将挚爱的祖国从腐朽王朝引向光明未来。历经重重磨难，如今本党似已迷失初心，在知识分子心中失去了光彩。让我们与中国最杰出的思想家握手，重建昔日紧密相连的纽带。"
 YUN_calling_on_shanghai_finance: "号召上海财源"
 YUN_calling_on_shanghai_finance_desc: "上海虽是骗子和黑帮的罪恶渊薮，然而即便在上海起义遭到镇压后，这座城市却仍然是一处革命据点。陈果夫和陈立夫这对在上海活动的国民党兄弟奠定了与股票经纪人和青帮的革命联系，就让我们利用陈氏兄弟的广泛人脉来为国民革命筹措经费。"
 YUN_expanding_kunming_university: "建设昆明大学"
 YUN_expanding_kunming_university_desc: "随着政府对教育领域的需求日益增长，昆明师范学校培育新一代思想家和建设者的使命已近承载极限。通过扩建校区、增设院系机构，我们将把昆明打造为西南地区世代传承的学术重镇。"
 YUN_kicking_up_the_whirlwind: "带动风潮"
 YUN_kicking_up_the_whirlwind_desc: "在许多人看来，我们不过是服务于中央委员会宏伟蓝图的配角，然而即便是[ROOT.GetLeader]与国民党云南省委员会，亦能通过党内中央机关的运作机制施展影响力，促使有利局面的形成。凭借彼此间的人脉与纽带，云南必将在更广阔的政治舞台上崭露头角。"
 YUN_challenge_the_false_pretenders: "挑战伪府"
 YUN_challenge_the_false_pretenders_desc: "长期以来，中央委员会一直滥用人民的信任，索取甚多却回报甚少，既无稳定也无温饱，甚至连其革命承诺和抵御军阀列强侵略的保证都未能兑现。举目四望，中国国民革命的希望日渐黯淡。为防止革命事业彻底失败，我们必须犯下最严重的罪孽……"
 YUN_seizing_the_revolution: "夺回革命"
 YUN_seizing_the_revolution_desc: "最终，国民党右派的旗帜已然落下，无论是因为我们的影响或是其他原因。作为孙中山先生最勤奋的门生，胡汉民的努力固然可贵，但他最终却被地方主义者和军阀所束缚，险些导致革命分崩离析。如今，随着旧中央委员会土崩瓦解，一个崭新的、真正的国民党必将崛起。"
 YUN_bringing_sanmin_to_the_masses: "向民众传播三民主义"
 YUN_bringing_sanmin_to_the_masses_desc: "中国人民长期饱受军阀割据和帝国主义蹂躏，以至于很少有人将国民党政权视为新事物；他们往往将国民党看作披着革命外衣的北洋体制。如果我们真心实意地想要为人民服务，就必须作为谋求解放的坚定力量，以平易近人的方式与他们交流，而不是以独裁者的身份统治他们。"
 YUN_enforcing_guiyangs_compliance: "强化贵阳服从"
 YUN_enforcing_guiyangs_compliance_desc: "数十年来，滇黔两省的命运始终紧密相连。尽管贵州内部仍有一些派系试图摆脱西南王的统治，但地理毗邻终究将他们与昆明紧密联系在一起。为了确保国家统一，为了全体中华儿女的共同家园，我们必须消除滇黔两省间的隔阂。"
 YUN_eject_the_wayward_despots: "驱逐反复无常的独裁者"
 YUN_eject_the_wayward_despots_desc: "我们的战斗异常艰苦，我们的战役残酷无情，我们的士兵在枪林弹雨中奋战，我们的军官也身陷险境。然而，我们必须继续前进！向着彻底的胜利不断迈进！只有推翻独裁者，恢复负责任的政府，国家才能实现安宁与团结！"
 YUN_summoning_the_spirit_of_the_people: "唤起人民精神"
 YUN_summoning_the_spirit_of_the_people_desc: "诚然，在反对那些妄图让国民革命湮没于自身荒谬狂怒的暴君和革命独裁者的斗争中，我们并非孤军奋战。全国各地的人民都在哀叹他们所遭受的不公，我们所要做的，便是努力让我们的事业赢得民心。"
 YUN_heir_to_the_national_construction_army: "建国军传人"
 YUN_heir_to_the_national_construction_army_desc: "国民革命军第三军是我们最主要的军事力量，其真正渊源可追溯至护国战争的传承以及由此涌现出的驻粤滇军英雄。从护国军第二军到建国滇军，再到国民革命军第三军，这支部队把前辈精神传到了新的时代。"
 YUN_heeding_the_call_of_revolution: "响应革命召唤"
 YUN_heeding_the_call_of_revolution_desc: "这场战争并非仅源于对逝去时代的怀念，也不是由于对国民革命的暴力性质犹豫不决所致。这是一场对抗失控体制的人民战争，是一场对抗秩序崩坏的战争！国家命运危在旦夕之际，所有人都必须奋起响应真正的白日召唤。"
 YUN_policy_of_yunnans_thermidor: "云南热月的政策"
 YUN_policy_of_yunnans_thermidor_desc: "国民党内的激进分子长期把持着国民革命领导权，他们所谓的胜利，实际上给中华民族带来的只有毁灭。为了恢复国家稳定，云南必须承担起蔡锷昔日所托之重任。"
 YUN_disseminating_our_message: "传播我方主张"
 YUN_disseminating_our_message_desc: "如果没有与商界、新闻界以及那些始终支持我方事业的勇敢同胞的联系，我们的英勇反抗就不可能成功。在依托军事行动支撑我方声索的同时，也当倾注资源支持争取民心的努力。"
 YUN_last_hurrah_of_the_model_erzhu: "模范二朱最后一搏"
 YUN_last_hurrah_of_the_model_erzhu_desc: "如果没有[ROOT.GetLeader]，党能达到今天的高度吗？如果没有[ROOT.GetLeader]，国家能如此接近统一吗？即使模范二朱行将失败，但只要西南大地仍在咆哮，我们就将战斗到最后一刻！"
 YUN_awakening_of_the_new_right: "新右派复苏"
 YUN_awakening_of_the_new_right_desc: "国民党四面受困于低效官僚、反革命分子、社会主义叛徒以及其他腐败堕落的党内败类，其革命根基早已被那些企图摧毁它的人撕裂。唯有在德高望重的戴季陶的领导下，党才能追寻纯粹的真正重组。"
 YUN_rein_in_the_generals: "掌控将领"
 YUN_rein_in_the_generals_desc: "自戴季陶主席及其重组后的新国民党政府上台执政以来，由于前委员长何应钦的支持者呼吁其重返政坛，国民革命军内部一直动荡不安。为消除政府不稳及潜在军事政变的传闻，我们将努力遏制何应钦一派在国家政治中的权力和影响。"
 YUN_press_on_with_nationalisation: "推进国有化"
 YUN_press_on_with_nationalisation_desc: "黄埔系垮台、戴季陶主席和陈果夫院长上台后，国内政局动荡不安，导致大量外资撤资，全国经济普遍衰退。为贯彻民生主义，主席下令采取行政行动，继续推进国有化进程，以建立自给自足的经济。"
 YUN_the_singular_organ_of_economic_society: "经济社会的独特机体"
 YUN_the_singular_organ_of_economic_society_desc: "治理国家需将民族国家想象为一个有机体——国家的大脑与双眼引领着伟大民国的方向。为了引导并掌控一切经济活动，使其朝着有利于国家建设的方向发展，我们将寻求在集体管理下合并工会和组织，以促进真正的阶级合作。"
 YUN_dismantle_reactionary_degeneracy: "铲除反动腐朽势力"
 YUN_dismantle_reactionary_degeneracy_desc: "必须清除前北洋政权腐败的所谓行政官员和官僚，以及国民党内外自由派势力，他们的存在给革命的性质和进程蒙上了反动阴影。如果继续放任这些毒瘤滋生蔓延，无疑会导致我们为之奋斗的革命走向腐败和毁灭。"
 YUN_purify_the_party_organ: "净化党的机体"
 YUN_purify_the_party_organ_desc: "杂质必须被清除，社会也必须向孔子等古代圣贤所设想的理想完美状态靠拢。在动荡时期，怎能继续容许这些缺陷阻碍削弱国民革命？唯有净化党，清除党内的反革命败类，才能使革命自然而然地向前发展。"
 YUN_the_scourge_of_marxism: "马克思主义之灾"
 YUN_the_scourge_of_marxism_desc: "马克思主义传入中国以来，带来的只有英国和法国等社会帝国主义国家输出的反革命和腐朽的帝国主义思想。马克思的说法与中国的传统政治审美格格不入，反而只会加剧阶级斗争和分裂。"
 YUN_the_way_for_the_youth: "《青年之路》"
 YUN_the_way_for_the_youth_desc: "如今，青年男女虚度光阴，沉溺于毫无意义的奢侈享乐，追求毫无成果的野心抱负，完全丧失了革命情怀。革命若要继续前进，就必须依靠党的领导和先锋作用，教育和引导国家青年，使他们成为孙中山先生中国国民革命的真正捍卫者。"
 YUN_rehabilitate_the_general_staff: "复职总参谋部"
 YUN_rehabilitate_the_general_staff_desc: "虽然我们反对何应钦那军事寡头及半军阀的派阀，但我们也明白，如果没有黄埔系国民革命军的牺牲和贡献，革命绝无可能取得胜利。既然军队今后将置于国民政府的控制之下，我们理应寻求宽恕和赦免革命同志。"
 YUN_preliminary_plan_for_education: "教育改革初步方案"
 YUN_preliminary_plan_for_education_desc: "在这个国家，太多满腔热忱的青年学子选择了无关紧要的法律和人文学科，而真正的现代化却始于以工程与技术领域为中心的课程设置。若想将我国青年重新培养成革命的新中坚力量，就必须改革中小学和高校，推广有利于新中国现代化的课程体系。"
 YUN_restore_social_harmony: "重建社会和谐"
 YUN_restore_social_harmony_desc: "国民革命的成功，不在于戴季陶主席和陈果夫院长的卓越领导，而在于对孔圣人所倡导的和谐价值观的集体贯彻。我们必须摒弃道家放纵享乐的个人主义，拥抱集体主义社会，天下为公才是人类发展的自然规律。"
 YUN_create_the_chinese_engineering_society: "创建中国工程学会"
 YUN_create_the_chinese_engineering_society_desc: "作为进行中的国家建设事业的一部分，留美工程师陈立夫制定了一项由中国工程学会牵头的十六点实业建设计划。该学会汇聚了来自全国各地的专家，他们都已宣誓效忠国民党并为其事业服务，致力于在开明的领导下加速中国工业化进程。"
 YUN_expand_the_central_banking_system: "扩展中央银行体系"
 YUN_expand_the_central_banking_system_desc: "尽管名义上实现了国家统一，但在新民国的领导下统一全国货币仍然是一项艰巨的挑战。根据中央委员会的指示，政府将扩大中央银行体系，并采用国家资本主义原则，在避免举借外债的同时，寻求更有利的贸易和投资条件，从而使中国最终摆脱帝国主义的枷锁。"
 YUN_control_the_means_of_media: "管控媒体手段"
 YUN_control_the_means_of_media_desc: "人总是充满好奇，但人民只有在了解真相后才能做出最明智的选择。根据中央委员会的指示，中国中央广播系统将进一步加强全国广播工作，更加注重播放民族爱国歌曲和新闻，以鼓舞中国人民并强化民族主义思想。"
 YUN_one_doctrine_one_party: "一个主义，一个政党"
 YUN_one_doctrine_one_party_desc: "国民党乃已故革命领袖、先总理孙中山先生的心血结晶，但在北伐失败后却大不如前、陷入悲惨境地，反革命自由派、社会主义煽动者及军阀余孽已经渗入党内。唯有继续坚持戴季陶的理论，方为复兴国民革命的正道。"
 YUN_the_mother_of_enterprises: "实业之母"
 YUN_the_mother_of_enterprises_desc: "为了让祖国重现昔日荣光，我们必须充分利用“实业之母”——铁路，并建设连接全国的庞大铁路网络。在国家最终掌控铁路网络后，中国铁路的扩张将促进贸易和交通，并摆脱多年的赤贫状态，使城市繁荣发展。"
 YUN_organise_the_military_engineering_corps: "组建军事工程兵团"
 YUN_organise_the_military_engineering_corps_desc: "作为中国工程学会雄心勃勃计划的一部分，为了扩大国家基础设施和产业规模，学会会长陈立夫已下令组建军事工程兵团。这支隶属于国民革命军的部队将专注于建设军事基础设施、要塞和海岸防御工事，以增强国家实力。"
 YUN_tend_to_the_national_beehive: "呵护蜂群式国家"
 YUN_tend_to_the_national_beehive_desc: "戴季陶主席曾多次将国家比作蜂巢。在蜂巢中，蜜蜂安分守己，从不质疑命令，而是服从蜂后的指挥。蜜蜂乐于共享资源，蜂巢内部毫无纷争唯有团结。中国人民必须从这一理论出发，理解党的领导职责是保护和引导他们迈向真正的革命未来。"
 YUN_threading_the_needle: "燮理阴阳"
 YUN_threading_the_needle_desc: "随着戴季陶主席行将退休，他的门生、前中执委书记陈立夫将接任国府主席一职。在充满活力和决心的新一届领导层执掌国民革命事业之际，陈氏兄弟及其所谓的“CC系”在重组与官僚体系方面展现的效率，可谓精准如穿针引线。"
 YUN_human_engineering: "人力工程"
 YUN_human_engineering_desc: "矿冶工程师是发掘及冶炼地下物质资源的，教育行政人员是要发掘及冶炼人力资源的，教育工作在美国还有人称为“人力工程”。的确，我们完全有可能人为塑造出一个真正的现代中国人——他既具备现代革命者的特质，又拥有儒家圣贤的智慧。"
 YUN_the_doctrine_of_national_servitude: "国民应征论"
 YUN_the_doctrine_of_national_servitude_desc: "马克思主义鼓吹阶级斗争的必要性，但这种学说与孙中山先生的思想以及孔子《论语》中所倡导的理想秩序相悖。我们必须秉持生产社会的理念，构建一个令全体人民天然服膺于此的社会，以此携手同心以共促现代中华民族伟大复兴。"
 YUN_champion_the_national_dharma: "弘扬民族佛教"
 YUN_champion_the_national_dharma_desc: "尽管佛教在中国社会历经兴衰沉浮，但不可否认的是，佛教能够极大地增强国力，明治维新和阿那伽利迦·达摩波罗领导的锡兰反殖民起义便是明证。中国也必须汲取这种民族佛法和佛教理念，以发展和强化民族的道德品格。"
 YUN_curtail_internal_disunity: "减少内部纷争"
 YUN_curtail_internal_disunity_desc: "戴季陶主席被国民党旧右派视为激进的理论家，又被左派视为反动派，并因此饱受鄙夷。然而，戴主席为孙中山先生的革命事业做出了巨大贡献，最终成功将其引向了正确的道路和方向。唯有妥善处理解决异见和反对政权之声，才能真正开启进步和重组。"
 YUN_apostle_of_the_cultural_revolution: "文化革命之使徒"
 YUN_apostle_of_the_cultural_revolution_desc: "多年来，戴季陶著述颇丰，并敦促国民党回归本源，拥抱一个既传承传统价值观又追求真正反帝现代革命的新中国的复兴。作为守旧派的先驱，戴主席现已成为党内的头号理论家——堪称先总理遗教的真正使徒。"
 YUN_cardinal_principles: "四维八德"
 YUN_cardinal_principles_desc: "四维即礼、义、廉、耻，八德即忠、孝、仁、爱、信、义、和、平。由于腐朽堕落的行为与信仰长期以来不断侵蚀着中国人，四维八德早已被遗忘。是时候让中国重新唤醒其传统美德，让子孙后代走上正确的道路了。"
 YUN_transfuse_western_sciences: "融会西方科学"
 YUN_transfuse_western_sciences_desc: "尽管中华文明在过去几个世纪里一直擅长精神科学，但即便不接纳西方道德沦丧之风，仅借鉴其科学成果仍颇具价值，甚至堪称裨益良多。西方的现代化成果与实践经验应当融入中华民族的血液，使其革命之心得以更加强劲地搏动不息。"
 YUN_embrace_spiritual_sciences: "拥抱精神科学"
 YUN_embrace_spiritual_sciences_desc: "国之道德沦丧，源于西方道德品性的腐朽作派已将纲常伦理摧毁殆尽。值此纷乱之世，我们不应寄望将来，而应以史为鉴。为了复兴中华，从农民到士兵，举国上下都必须努力遵循秦朝的伟大道德准则。"
 YUN_revitalise_filal_piety: "复兴孝道"
 YUN_revitalise_filal_piety_desc: "父母养育子女，子女赡养父母，此乃天道伦常。父母应当以各种方式管教子女，以此作为爱与成长的途径，使子女懂得尊重伦理纲常。循此伦理纲常，方能构建尊卑有序之社会，从而恢复社会和谐、消弭阶级斗争。"
 YUN_towards_revolutionary_datong: "迈向革命大同"
 YUN_towards_revolutionary_datong_desc: "工程师欲使轮船启航，便启动引擎；欲令引擎停转，便关闭引擎。正是在伟大革命领袖的指引下，中国国民革命方能通往孙中山与孔子等先贤畅想的理想之境。正是因为真正领悟了孔圣人追求天下大同的理想，孙先生才成为了孔子衣钵的自然继承者。"
 YUN_whampoas_legacy_lives_on: "黄埔传承不倒！"
 YUN_whampoas_legacy_lives_on_desc: "是谁自建党之初便不离不弃？是谁为国民革命浴血奋战？又是谁守护国父理想不致湮灭？若无黄埔系，国民党唯有失败一途。如今，在摆脱了那些背信弃义的文官后，黄埔学生将肩负起家国重任。"
 YUN_the_militarisation_of_education: "教育军事化"
 YUN_the_militarisation_of_education_desc: "诚然，中国人民不尊重也不重视军事先锋队的作用。尽管我们为民众赢得了一切，却仍被视为披着白日外衣的军阀。我们将把高中和大学改造成军事训练营，向中国的未来一代灌输尊重权威、批判性思维、外语、科学和数学等方面的知识。"
 YUN_preserving_social_order: "维护社会秩序"
 YUN_preserving_social_order_desc: "长久以来，混乱一直笼罩着国家。由于历任中央政府对其直辖范围之外的影响力薄弱，导致国家始终四分五裂，至少直到现在仍是如此。然而民众仍不安分，甚至公然反抗我们现有的治理职能。为了振兴中华，我们必须走上街头恢复秩序，必要时不惜动用武力。"
 YUN_the_fight_against_inflation: "对抗通胀"
 YUN_the_fight_against_inflation_desc: "中国的经济状况可谓灾难深重，宛如一个充满不幸和怨恨的悲惨迷宫。尽管沿海较为富裕的地区取得了一些进展，但仍无法抵御一场民族救亡战争对国家的冲击。黄埔系虽然是军人，但他们绝非对经济一无所知。面对民不聊生的局面，我们必须成为人民的救星。"
 YUN_disciplined_men_of_action: "矢勤矢勇，必信必忠"
 YUN_disciplined_men_of_action_desc: "国民党的首要使命，在于建设一个现代化、繁荣昌盛、高度发达的中国。这个中国应当道德纯洁、涤除陋习、恪守自律。这场政治革命——不，这场国民革命，必将推动国家与人民共同进步。然而我们的首要目标，仍在于助力促进中国军队的现代化并增强军事实力。"
 YUN_a_second_reorganisation: "二次改组"
 YUN_a_second_reorganisation_desc: "在何应钦委员长的领导时期，党内各派龙蛇混杂，官僚机构臃肿，政治委员会又与党的各下属委员会联立运作、相互掣肘，实则多余。若陈诚要带领国民党乃至中国走向更美好的未来，必须先废除政治协商会议，设立中央改造委员会。"
 YUN_refining_the_organic_economy: "完善有机经济"
 YUN_refining_the_organic_economy_desc: "训政不仅旨在教育国民“三民主义”的价值观，也旨在引领经济走向繁荣与公平的新时代。在何应钦灾难性的统治下，中华民族饱受恶性通货膨胀和顽固不化的资产阶级折磨。经济的杠杆必须由有能力的革命者控制，而不再沦为投机者和反革命分子的玩物。"
 YUN_economic_centralisation: "经济集中化"
 YUN_economic_centralisation_desc: "中国幅员辽阔，境内有各种天然屏障，因此各偏远地区普遍有政、经的自治权并不足为奇。但国民政府必须以国民革命的名义去抓住各方面的经济。得建立中央集权，国民政府才能依须妥善管控，并抵御好外来经济帝国主义的侵袭。"
 YUN_expand_the_youth_corps: "三民主义青年团"
 YUN_expand_the_youth_corps_desc: "想让民众得以对国民党的理论共鸣，就必须让青年们真正理解国民革命的涵义。三民主义青年团将致力于让中国青年学习、体会并实践陈诚眼中的三民主义。随着新生代崛起并取代党内老人，协助陈委员长真正开展国民革命事业，国民党内部的冲突将逐渐消失。"
 YUN_curtailing_gentry_oppression: "遏制士绅压迫"
 YUN_curtailing_gentry_oppression_desc: "清末民初，不平等现象在中国各地激起了争斗。国民政府须采取限制地租、减免田赋及多种平抑物价之举措以遏制士绅势力。农民若不得解放，国民革命则断无成功之望。陈诚必当亲力亲为，让所有地主及其CC系主子统统屈服！"
 YUN_reiterating_minsheng: "重申民生"
 YUN_reiterating_minsheng_desc: "国父从政之初，即已提出“三民主义”：民族、民权、民生。在陈委员长看来，民生乃当务之急。出身贫苦农民家庭的陈委员长，对民生的困境有着最深刻的体会。毋庸置疑，民生在国民革命中至关重要！"
 YUN_institute_of_revolutionary_practice: "革命实践研究院"
 YUN_institute_of_revolutionary_practice_desc: "在何应钦领导的旧党体系下，CC系、政学系等各种反革命集团得以肆无忌惮地颠覆国民革命。陈委员长领导的国民党将不会重蹈覆辙，而革命实践研究院将确保新生代党员始终牢记国民革命的真正目标。"
 YUN_rebuilding_party_cells: "重建党支部"
 YUN_rebuilding_party_cells_desc: "随着本党规模不断扩大，重振党支部制度的必要性正日益凸显。党支部网络将扎根于政府、军队及各军事单位，全体党员都必须加入党支部并接受忠诚度考核。各党支部将强调以民主集中制作为政策制定的指导思想，并以委员长的名义重新确立层级权威与党组织权威。"
 YUN_bridging_the_factional_divide: "弥合派系分裂"
 YUN_bridging_the_factional_divide_desc: "在北伐战争期间，国民党分裂为了两大派系：汪精卫及其中央委员会倒向社会主义，而忠于蒋介石的势力则与胡汉民的支持者合并为了反对派。这种悲剧性的分裂必须得到修正，而陈诚就是弥合分裂的不二人选。陈委员长既是邓演达的学生，也是蒋介石的学生，这让他能够同时获得两派的支持。"
 YUN_heir_to_the_red_napoleon: "红色拿破仑的后继者"
 YUN_heir_to_the_red_napoleon_desc: "虽然邓演达最终没能一统河山，但他的遗志长存。陈诚将确保国民党始终以农民为本，重燃大同之梦。本党必须将为中国群众的献身放在第一位，因为国民党与群众的关系正如鱼和水的关系一样，鱼畅游水中，无水则亡。以邓演达将军之名，陈诚将为人民而战！"
 YUN_all_forward_with_the_little_generalissimo: "一切追随小委员长！"
 YUN_all_forward_with_the_little_generalissimo_desc: "当年蒋总司令执掌党权，中国人民的解放已在眼前。然而德国可耻地扼杀了革命，重创了国民党。而现在，在蒋介石最忠实的学生陈诚的领导下，本党业已克服重重困难再次崛起，取得了光荣胜利。这位“小委员长”将完成蒋介石的遗志，带领国家迈向光明繁荣的未来！"
 YUN_joint_commission_on_rural_reconstruction: "农村复兴联合委员会"
 YUN_joint_commission_on_rural_reconstruction_desc: "随着革命第一阶段的完成，国民党必须开始建设工作。在经历统一国家和抗击日本侵略的救亡之战后，神州大地已是满目疮痍。面对乡间的残垣断壁，国民党需要建立农村委员会，其目标不仅是让农村地区恢复到战前状态，还要发挥有效治理带来的解放作用。"
 YUN_formalise_the_government: "政府正规化"
 YUN_formalise_the_government_desc: "国民党的统治方式历来极不理性——依靠法令而非共识；依靠专断仲裁与少数精英的决策，而非民众意愿。虽然民主以及与之相应的宪法尚需时日，但我们至少可以实施一种半宪政治理模式，以终结党国当下的荒谬局面。唯有如此，中国方能迎来善治。"
 YUN_broaden_the_social_base: "扩展社会基础"
 YUN_broaden_the_social_base_desc: "为了真正减轻人民苦难，党必须更好地了解社会。党务工作必须让党员深入调查地方经济和社会状况，寻找可能滋生社会主义倾向的因素。党也必须进一步向底层阶级敞开大门。必须吸引农民、工人和知识分子入党，为我们的国民革命事业打造真正的工农之党。"
 YUN_a_revolutionary_democratic_party_for_the_future: "革命民主之未来"
 YUN_a_revolutionary_democratic_party_for_the_future_desc: "1924年改组之后，国民党经常被拿来与其他列宁式政党比较，并被批评为革命专政的工具。这些批评者未能理解本党宗旨，中国人民必须认识到，本党实质上是追求民主的政党，致力于将中国转变成为自由民主的社会。"
 YUN_reenergise_the_cadres: "重振干部队伍"
 YUN_reenergise_the_cadres_desc: "为了强化党的革命思想，我们必须恢复干部制度。这些干部将接受三民主义价值观教育和忠诚度测试，并通过选举、推荐、培训或考核等方式选拔。干部将分为党务干部、政治干部和群众运动干部。通过干部制度，国民党将渗透到中国社会的各个层面。"
 YUN_the_peoples_generalissimo: "人民委座"
 YUN_the_peoples_generalissimo_desc: "1911年辛亥革命曾经承诺要为中国带来自由民主的未来。但民国未能实现这一目标，孙中山先生只好转而采取更为激进的手段。但我们必须明白，国民党的目标从未改变，只是采取了更革命性的手段而已。何应钦委员长和国民党所寻求的，就是去兑现被抛弃的辛亥革命承诺并解放中国人民。"
 YUN_spiritual_authoritarianism: "精神威权主义"
 YUN_spiritual_authoritarianism_desc: "正如孙中山先生所言，腐朽衰败的旧中国与国民党再造的新中国实有云泥之别。昔日帝王将我们伟大的国家视作一己私产，而何委员长则屡屡证明自己是一位无私奉献、胸襟宽广、引领中国迈向新时代的英雄人物。只要心脏仍在跳动，何委员长就会继续为国家辛勤耕耘。"
 YUN_engineering_a_future_for_china: "规划中国的未来"
 YUN_engineering_a_future_for_china_desc: "国民党始终是面向未来的政党，勇往直前奋力冲破中国曾经的荒芜泥沼，而陈立夫正是这种永不停歇追求进步精神的最佳体现。陈立夫原本是一名工程师，如今却肩负起规划中国未来的重任。与那些企图将国家分裂成狭隘派系的社会主义者和反动派不同，我们既不左倾也不右倾，而是作为一个国家携手并进。"
 YUN_concord_with_the_republican_elite: "与共和派精英的协定"
 YUN_concord_with_the_republican_elite_desc: "效仿孙中山先生的榜样，国民党一贯致力于与各界人士携手合作，为中华民族的利益服务。既然中国现已统一，那我们也应当在政治领域实现统一，与志同道合的共和派精英携手，让他们贡献专业知识，共同参与国家建设。支持国民党，就是支持中国！"
 YUN_life_as_a_service: "夙夜匪懈，贯彻始终"
 YUN_life_as_a_service_desc: "除了国民党，没有哪个政党可以真正代表中国各阶级的人民。我党的实力取决于有多少民众认同我们的理想，以及党员的热情与干劲。为了扩大这两方面的影响力，我们必须让群众知道，国民党是唯一真正关心他们的政党，而委员长则是全体人民的领袖。"
 YUN_restoring_spiritual_balance: "重建精神平衡"
 YUN_restoring_spiritual_balance_desc: "陈立夫认为，人类一切问题皆源自于“生产”与“消费”这两项对抗的经济力量失衡。西方唯物主义试图透过增加生产来纠正这一失衡，但却加剧了人的贪婪。如今，既然我们已经克服了国内外的威胁，那么下个目标将是“人性”了。"
 YUN_chinese_bushido: "中式武士道"
 YUN_chinese_bushido_desc: "我们必须鼓励中国民众秉承儒家“仁”的价值观，正如陈立夫所阐释的——以仁爱之心奉献小我，成就大我。受戴季陶对日本人无私奉献精神的真挚敬仰所启发，中国必将实现解放的大同境界，永不沉溺于物质主义、贪婪与苦难。中国也必将成为一个勤勉的国度，每个公民都会为国家效力至最后一息。"
 YUN_the_revolutionary_generalissimo: "革命委座"
 YUN_the_revolutionary_generalissimo_desc: "国民党不仅仅是一个政党或一场运动，国民党就是中国本身的根基——而何委员长则是国民党的合法领导人。当何应钦和CC系挥舞着宝剑带领中国走向“光明未来”时，中国所遭受的数百年屈辱和苦难将不过是未来的一个注脚。何应钦领导下的新中国将超越意识形态斗争和物质斗争，超越自然和人类本身。"
 YUN_caring_for_our_veterans: "关怀老兵"
 YUN_caring_for_our_veterans_desc: "没有国民党，就没有新中国；没有军队，就没有国民党。正如军队重塑青年，赋予他们保卫祖国所需的无限民族精神和勇气一样，军队也是中国摆脱西方和日本帝国主义枷锁、实现复兴的关键因素。我军老兵理应获得应有的回报，现在是时候嘉奖他们了。"
 YUN_military_centrism: "军事中间主义"
 YUN_military_centrism_desc: "源于第一军的黄埔系是全体中国公民的楷模，他们纪律严明，精诚爱国，随时准备为国家抛头颅洒热血。与汪精卫和胡汉民等安于象牙塔，空谈琐事，不愿投身革命斗争的知识分子不同，正是忠诚的中国军队打破了枷锁——正因如此，才应由军人掌握政权。"
 YUN_reform_confucianism: "改革儒学"
 YUN_reform_confucianism_desc: "汪精卫与胡汉民的思想之所以失败，其原因有目共睹：它们都受到了太多西方影响的污染。中国迫切需要一种全新的、能真正代表中国人民的思想理论。戴季陶提出了一种真正代表中华民族及其价值观的理论，将儒家思想与复兴的极端民族主义相结合，它将成为“新右派”的宝贵信条。"
 YUN_the_lucky_generalissimo: "福将委座"
 YUN_the_lucky_generalissimo_desc: "当一颗子弹射入何应钦的心脏时，人们都以为他的生命到头了，但事实是这颗子弹只会让他变得比以往更加强大。运气给了何委员长第二次机会去完成不可能之事，而何委员长也成功给了中国第二次机会去对抗四面八方的敌人。所有新中国公民都应努力效仿何委员长，何委员长万岁！"
 YUN_a_mixed_economic_system: "计划自由经济发展"
 YUN_a_mixed_economic_system_desc: "国民党奋斗数十年，不是为了让中国重蹈覆辙、再次陷入帝制暴政，也不是为了让中国再次陷入无政府状态。重建国家的时刻现已到来，政学系提出了一套为复苏量身打造的独特经济体系——由党内最优秀的技术官僚规划者引领重工业、人民企业家振兴轻工业。在各路人才的共同努力下，国家发展的引擎必将重新启动。"
 YUN_reshuffle_the_executive_yuan: "改组行政院"
 YUN_reshuffle_the_executive_yuan_desc: "是时候彻底整顿行政院了。胡汉民曾经为保护党的正统治理方式做出了崇高的尝试，但眼前的未来是不可抗拒的。我们必须尽快撤换那些只关心煽动异议而非为党奉献的代表，并以正直忠诚的党内干部取而代之。中国的基石是诚实仁善、技官主义式的治理，而非狭隘的理想主义。"
 YUN_political_consultative_conference: "政治协商会议"
 YUN_political_consultative_conference_desc: "作为精简党内运作的举措之一，我们将正式成立政治协商会议，政协代表将由国民党官僚、党外代表和其他与国民党结盟的技官派思想家构成，负责讨论和指导未来的政策。国民党将不再是一个由各军人山头组成的松散组织，而将再度成为一个由各政治领域内最优秀的领导者们组成的高效机构。"
 YUN_the_liberal_generalissimo: "自由委座"
 YUN_the_liberal_generalissimo_desc: "当何应钦克服万难统一中国之时，一些怀疑论者认为他不过是个披着政客外衣却行军政之实的军阀。事实证明他们错了！人民将不再被那些煽动家的谎言所蒙骗，而是会发自内心的意识到：国民党也许不是口号最响亮的政党，但一定是执政最有力的政党。"
 YUN_national_military_education_movement: "国民军事教育运动"
 YUN_national_military_education_movement_desc: "知识分子鄙夷体力劳作之痼疾，绝不容姑息滋长。为此，国民军事教育运动将着力彻底改造中华学子：军事思想灌输须从小抓起，学校须按部队编制整编，学科须向战时应用倾斜。唯有如此，我们的社会才能培育出新一代战士。"
 YUN_crackdown_on_warlordism: "打倒军阀思想"
 YUN_crackdown_on_warlordism_desc: "无论如何，中国尚未真正实现统一和一体化：苛捐杂税、效率低下依然存在。这一问题并非源于阶级动力，而在于国家现状——各省军阀为了愚昧狭隘的野心而割据一方。我们必须不遗余力地根除军阀思想，并铲除所有助长这一顽疾之人。不久之后，这段分裂低效的时期终将化作一段尘封的痛苦记忆。"
 YUN_promote_yellow_unionism: "推动黄色工会主义"
 YUN_promote_yellow_unionism_desc: "中国工人是民族的脊梁，现在是时候减轻他们因西方帝国主义数十年侵略而遭受的苦难了：国民义务劳动运动将成为劳动者的最终救赎。这项运动旨在减少失业，保障工人权益，同时保持爱国主义和民族主义性质，而非鼓励只会带来倒退的无谓阶级冲突——因为根本矛盾存在于国家之间，而非阶级内部。"
 YUN_the_realisation_of_dictatorship: "实现专制"
 YUN_the_realisation_of_dictatorship_desc: "尽管完成了国家统一大业，但党却屡屡辜负中国人民的期望，与群众渐行渐远，丧失了人民的信任与信仰，导致政治与军事双双陷入困局，然而这一问题并非无解。作为一支真正爱国、为国民革命竭尽全力的队伍，蓝衣社誓死忠于委员长，自当成为领袖今后不可或缺的得力助手。"
 YUN_restoring_the_chinese_national_character: "恢复中华民族品德"
 YUN_restoring_the_chinese_national_character_desc: "遗憾的是，当下的中华民族品德同时呈现出多重极端倾向：个人主义、家族宗族观念与世界主义倾向，而儒家思想、封建制度和西方输出的物质主义又巩固了这些倾向。国家的职责在于削弱这些影响，培育真正的民族主义精神，并通过文化管控实现民族复兴。"
 YUN_the_blueshirt_generalissimo: "蓝衣委座"
 YUN_the_blueshirt_generalissimo_desc: "何委员长是中华民族真正的父亲，是唯一能够彻底消灭西方帝国主义、实现真正民族复兴的人。从今往后，人们必须绝对服从委员长。若有必要，人们还必须真诚而坚定地与他同生共死，因为国家民族的命运就掌握在委员长手中。"
 YUN_purge_the_old_party: "清理旧党"
 YUN_purge_the_old_party_desc: "旧党充斥着叛徒、资本家，腐败透顶，必须予以摧毁，让一个仅由真正革命者组成的新组织取而代之。实现这一目标不应通过完全不切实际的全盘改组，而是要在党内另建新党——这个新党愿为国家和人民奉献一切，严格限制物质财富，摒弃封建宗族关系，倡导真正的同志情谊。"
 YUN_eliminate_unnecessary_bureaucracy: "清除冗余官僚"
 YUN_eliminate_unnecessary_bureaucracy_desc: "冗余、腐败且无能的官僚一直困扰着党，也困扰着国民革命本身。清除官僚对国家的生存和繁荣至关重要，然而有多种方案可达成这一目标。蓝衣社最终决定必须遵循他们的“党内之党”理念，从内部扫清现有的官僚机构。"
 YUN_negotiate_with_shanghai_compradors: "与上海买办谈判"
 YUN_negotiate_with_shanghai_compradors_desc: "诚然，蓝衣社并非纯洁无暇。尽管本党矢口否认与上海的金融家和黑帮有联系，但这其中仍蕴藏着巨大的商机。因此，我们将派遣特工与昔日盟友谈判，为进一步合作铺平道路。得其资助，通往国家富强之路必将更为平坦。"
 YUN_reevaluating_underground_ties: "重审地下关系"
 YUN_reevaluating_underground_ties_desc: "蓝衣社与中国地下犯罪组织，特别是三合会之间，存在着诸多相似与关联：从入会仪式到通过庇护网络运作。正因如此，双方自然形成了密切联系。这些组织有助于加强控制，尤其是对工会的掌控，因而必须将其纳入麾下。"
 YUN_expand_the_special_task_force: "扩充特务部队"
 YUN_expand_the_special_task_force_desc: "一个真正的革命政党需要一支先锋军事力量，这支部队将以身作则，铲除一切阻碍其前进的叛徒。对于蓝衣社而言，特务部队将扮演这一角色。受萨文科夫国家卫队(Gosstrazha)的启发，我们的特务部队只由精英中的精英组成，并将接受比其他蓝衣社成员更为严格的监督和背景审查。"
 YUN_national_economic_reconstruction_movement: "重整国家经济"
 YUN_national_economic_reconstruction_movement_desc: "在经历了西方帝国主义的肆虐和毒害、军阀混战的猖獗，以及最终与日本的决战后，中国经济已经陷入崩溃，并严重阻碍了任何形式的土改进程。虽然需要付出超乎常人的努力和极其艰巨的奉献，但新生的党国必将带领中国摆脱困境，迈向复兴。"
 YUN_mass_organisation: "群众组织"
 YUN_mass_organisation_desc: "群众组织对任何政治运动都至关重要，蓝衣社也不例外。蓝衣社将实行严格高效、自上而下的组织架构，从核心圈子和执行委员会，到值得信赖的招募人员和渗透人员，无一例外。蓝衣社还将采用小组式组织模式，并推行严格的监督、监察和支出控制。"
 YUN_absolute_obedience_to_the_leader: "绝对服从领袖"
 YUN_absolute_obedience_to_the_leader_desc: "归根结底，革命事业的进展取决于领袖。如果领袖称职，革命就能迅速取得进展；反之，革命则极易偏离正轨，走向失败——而[ROOT.GetLeader]无疑是前者，他正引领中华民族迈向真正的国民革命。他的奉献精神和能力毋庸置疑，我们必须坚决服从他的领导，以免革命事业偏离正确方向。"
 YUN_reinterpret_the_three_principles: "重新诠释三民主义"
 YUN_reinterpret_the_three_principles_desc: "三民主义是中国民族主义和国民革命的根本。虽然那些帝国主义者和叛徒可能指责蓝衣社背弃了总理遗教，这纯属子虚乌有。但我们也必须怀着沉重的心情承认，三民主义也存在缺陷。要以我们自己的方式实现国民革命，就必须放弃正统的民权主义。"
 YUN_the_blueshirt_revolution: "蓝衣社革命"
 YUN_the_blueshirt_revolution_desc: "长期以来，国民党一直因方法不当、制度缺漏、内容空洞而深陷软弱无能、腐败堕落和混乱动荡之中。但随着[ROOT.GetLeader]的崛起，昔日的弱点已被一扫而空，取而代之的是一股势不可挡的力量。一个甘愿为了国民革命牺牲一切、奉献所有的崭新党国已然诞生。我们从未动摇，更无放弃之念。"
 YUN_the_kuomintang_periphery_at_its_center: "国民党边缘派系上位"
 YUN_the_kuomintang_periphery_at_its_center_desc: "当一个人想到孙中山先生的党国，他脑海中立刻浮现的大抵是汪精卫和改组会，或是蒋介石和黄埔残军，又或是胡汉民和他的元老派，甚至可能是临时行动委员会。鲜有人会想到国民党内那些一直被忽视的“边缘”派系。然而，国家的统一让全中国带着好奇的目光投向了这群弃儿。"
 YUN_salvaging_the_nations_livelihood: "挽救民生"
 YUN_salvaging_the_nations_livelihood_desc: "云南如今的征程与当年的蔡锷极为相似，从昆明出发打响了一场救国之战，一路进军北京乃至东北。这批滇军的革命战士满怀理想，满是活力和美德，他们奋勇杀敌，对抗暴政和误入歧途的同志。然而，这些希望和梦想却给中华民族带来了深重的伤痛。在人民饱经苦难之后，如今是时候开展经济重建了。"
 YUN_officialising_military_amnesty: "正式特赦军人"
 YUN_officialising_military_amnesty_desc: "反对云南真正国民革命征程的，不仅有我们的革命手足，还有我们在国民革命军内部的同志。军队同室操戈，昔日盟友被迫自相残杀。然而，即便在最深的敌意之中，依然存在着超越一切的兄弟情谊。为了弥合这道鸿沟，我们必须实行广泛的特赦。"
 YUN_reorganise_the_governmental_organs: "重组政府机关"
 YUN_reorganise_the_governmental_organs_desc: "简而言之，国民党的政府结构遭遇了近年来最严重的灾难。云南各派系在争夺政权的征程中驱逐了大量官僚和公务员，并断绝了与他们的联系，导致民国陷入一片混乱。通过彻底调查空缺职位并招募新人员，[ROOT.GetLeader]将构建起比以往更加强大的新党国。"
 YUN_under_the_auspices_of_workers_and_peasants: "接受工农的拥护"
 YUN_under_the_auspices_of_workers_and_peasants_desc: "汪精卫和中央委员会逃避了他们对老百姓应负的责任，党的边缘派系一支小小孤军却接过了他们抛下的旗帜，不为主席或党国，而为人民大众的福祉而战。我们反对不义的正义斗争得到了中国人民的回报，可以放手罢黜党内的衣冠老朽。而今中华一统，为人民服务之时已至！"
 YUN_modernisation_and_militarisation: "现代化与军事化"
 YUN_modernisation_and_militarisation_desc: "虽然游击战略和战术对解放中国起到了极大的帮助，但显然，如果我们想要保持与邻国的竞争力，就必须进行军事现代化。朱德老总已经亲自前往其他社会主义国家考察学习，为我国新的军事体制汲取经验，并明确提出军队应确立专业化、纪律性及研究现代装备三大原则。"
 YUN_reconstituting_military_order: "重建军纪"
 YUN_reconstituting_military_order_desc: "旧军阀和波拿巴式的南京政府虽已覆灭，但仍有许多迷茫和误入歧途之人继续与新中国作对。在仍遭受游击战蹂躏的地区，我们将设立临时军区以恢复当地秩序，确保迅速实现和平。必须让世人知道，中国人民自相残杀的日子已经结束，现在正是实现国内长久和平的时候！"
 YUN_to_enact_minsheng_geming: "开始民生革命"
 YUN_to_enact_minsheng_geming_desc: "中国人民用自己的努力赢得了这场来之不易的胜利，也必将享受到正义斗争的果实。在封建时代，人民饱受冷漠地主和贪婪官僚的残酷压迫，而事实胜于雄辩，教育则是人们摆脱贫困的唯一途径，而我们最重要的任务就是确保所有中国公民都能享有他们应得的优质教育！"
 YUN_national_rejuvenation_and_national_prosperity: "民族复兴与民族繁荣"
 YUN_national_rejuvenation_and_national_prosperity_desc: "自鸦片战争以来，我国一直深陷民生凋敝、饿殍遍野的漩涡。边远地区饱受饥荒之苦，叛乱屡遭残酷镇压。为了实现民族复兴，我们将废除苛捐杂税、拔除根深蒂固的士绅势力，从而消除农民遭受的压迫。国家的目标是让全体中国人民最终都能发家致富，并彻底摆脱过去的苦难！"
 YUN_hundred_flowers_campaign: "百花齐放运动"
 YUN_hundred_flowers_campaign_desc: "虽然我们的领导人一心只想帮助中国工农实现共同富裕，但没有人可以凌驾于批评之上，也没有人是完美无缺的。为了了解中国人民对改进当前政策的意见，章伯钧同志发起了“百花齐放”运动，旨在营造开放包容的氛围。让社会科学和艺术领域百花齐放，让科学领域百种观点畅所欲言！"
 YUN_chinese_socialism_secured_forevermore: "中国社会主义永不倒"
 YUN_chinese_socialism_secured_forevermore_desc: "旧国民党试图对群众实施意识形态纪律管控，而我们的新纲领则旨在寻求共识。党内激进分子只把意识形态目标当作最终目的，而我们的领导层则一心为人民谋福祉。通过推动民主与社会主义两股力量交融，我们不仅确保了国家繁荣昌盛，而且保证了中国社会主义不会昙花一现，并将继续引领人民迈向未来！"
 YUN_the_partys_most_loyal: "最忠诚的党员"
 YUN_the_partys_most_loyal_desc: "在朱培德委员长的领导下，中国人民终于结束了数十年的分裂局面，迎来了国家统一。作为国父的忠实门生，朱培德将确保国民革命按照孙先生的设想继续进行。人民群众涌上街头，欢庆昔日混乱终成过往，朱培德将带领国民党解放工农，建设一个属于全体人民的新中国！"
 YUN_honouring_the_war_dead: "纪念烈士"
 YUN_honouring_the_war_dead_desc: "中华民国屹立不倒，但令人痛心的是，为了捍卫中国的未来，我们付出了数以百万计的伤亡才击退了残暴的日本帝国主义者。李根源建议修建腾冲国殇墓园，以缅怀在战争中牺牲的所有烈士。这些英勇灵魂的名字将被镌刻在纪念碑上，让后世铭记他们为国家做出的至高牺牲……"
 YUN_the_superior_form_of_federalism: "联省的高级形式"
 YUN_the_superior_form_of_federalism_desc: "当联省派批评国民党领导下的中央集权体制时，他们狭隘的见解恰恰使其完全忽略了事实。联省派将各省变成了专制独裁政权，而国民党则鼓励真正的全国合作。我们的民族国家就像一棵根基深厚的大树，这棵树上容不下任何混乱的政治幻想。"
 YUN_deals_with_the_compradors: "与买办的协议"
 YUN_deals_with_the_compradors_desc: "买办们不过是依附于外国的吸血鬼，企图榨取中国仅存的财富，但他们也可为我所用。通过与买办谈判，我们可以加快与外国的经济合作，双方都将从中获益。当列强使用我们的资源和劳动力时，我们则借他们之手实现国家现代化。韬光养晦多年后，中国必将掌握主导权！"
 YUN_national_defense_fortification_plan: "国防线计划"
 YUN_national_defense_fortification_plan_desc: "虽然国民革命现已席卷全国，但外国的秃鹫们仍在虎视眈眈，企图破坏本党解放人民的事业。朱培德委员长已针对这种可能情况制定了防御计划，以免措手不及重蹈抗战覆辙。若有人胆敢与国民党治下的中国对抗，就让他们尝尝国民革命军的全部实力！"
 YUN_revolution_safeguarded_by_its_warriors: "革命战士保革命"
 YUN_revolution_safeguarded_by_its_warriors_desc: "历史已经证明，军队是革命事业的最重要资产。正是辛亥共和军推翻了清廷，正是护国军终结了袁世凯的帝制野心，正是国民革命军实现了全国统一。朱培德委员长和云南国民革命军确保了国民党永葆强大，有了军队的支持，国民革命必将取得胜利！"
 YUN_brothers_of_principle_sons_of_the_guofu: "同捍主义，共继国父"
 YUN_brothers_of_principle_sons_of_the_guofu_desc: "本党视胡汉民主席与朱培德委员长为国民革命两大支柱。由孙中山先生两位最忠诚的门生继承其建设现代中国之遗志，可谓实至名归。较之修正主义叛徒汪精卫及其趋炎附势的狗腿子，胡汉民和朱培德力求一丝不苟地贯彻孙先生的教诲。在这两位伟人的领导下，中国必将实现全民共同繁荣！"
 YUN_legacy_of_gu_pinzhen: "顾品珍的传承"
 YUN_legacy_of_gu_pinzhen_desc: "欲戴王冠，必承其重，在国民革命的斗争历程中，无数英勇的革命同志壮烈牺牲。然而，无人如顾品珍这般遭到遗忘湮没。这位英勇刚毅的爱国志士堪称举世无双的革命英雄，若没有顾品珍，北伐战争根本无从谈起。如今我们终可告慰顾品珍的英灵：他的牺牲没有白费。"
 YUN_unity_with_the_party_outsiders: "团结党外人士"
 YUN_unity_with_the_party_outsiders_desc: "虽然革命是由本党发起，但我们并非孤军奋战。像中国民主同盟这样的志同道合政党与我们目标一致，两党之间存在着广泛的共识。民主不是我们革命事业的对立面，而是我们为之奋斗的核心所在。让我们携手并进，在所有志同道合的政党之间架起桥梁，共同解放中国！"
 YUN_exporting_the_kunming_model: "推广昆明军校模式"
 YUN_exporting_the_kunming_model_desc: "尽管云南在曾经只是泱泱中华里一个偏远落后的地区，但正是凭借着滇军的军人军备，才使国家如今得以统一。昆明军校（云南讲武堂）模式在民国时期已大放异彩，并将继续作为国家未来发展的蓝图。终结百年国耻的不是保定或黄埔，而是一匹不屈不挠的黑马——坚忍刻苦的云南讲武堂！"
 YUN_an_antidote_for_economic_woes: "经济困境之良药"
 YUN_an_antidote_for_economic_woes_desc: "虽然资本主义对我国而言是一大祸患，但要缓解这一问题，就必须采取一些有利于人民的资本主义政策。农业的部分市场化将激励获得新分配土地的农民成为国家的生产力，沿海地区也将在中国主导下利用外资加速发展。随着国家迈向现代化，我们正一步步接近公平繁荣的梦想……"
 YUN_flourish_of_the_kuomintang_liberals: "为浊流技官正名"
 YUN_flourish_of_the_kuomintang_liberals_desc: "尽管国民党内更为热忱者继续高举国民革命的崇高理想，但他们却仍在践踏官僚和技官所倡导的必要且恰当的经济规划。许多人曾断言政学系难成气候，然而他们却凭借对改善民生的真诚奉献，赢得了中国人民的爱戴。"
 YUN_removing_the_trappings_of_ideology: "打破意识形态束缚"
 YUN_removing_the_trappings_of_ideology_desc: "黄埔军校在革命斗争中发挥了令人钦佩的作用，但最终却对中国社会呈现出比想象更为巨大的威胁。他们对国民革命军极尽波拿巴式的夸赞，几乎要排挤掉党内的一切文官。为了抵消政治指导，使军队去政治化，我们要建立中央政治学校。"
 YUN_engaging_with_the_dangwai: "接触党外人士"
 YUN_engaging_with_the_dangwai_desc: "国民党并非独自统治国家。在党国体制之外，仍存在着大量被尊称为“党外人士”的力量。虽然一众较为激进的党员鄙视与不信奉三民主义之人展开任何合作，然而为了完成国民革命大业，新生的国家需要妥协与合作。"
 YUN_undoing_the_injustice_of_1924: "为1924之不义拨乱反正"
 YUN_undoing_the_injustice_of_1924_desc: "孙中山先生在摆脱“军阀思想”后所做的最危险、后果最严重的行为便是在1924年改组了本党。这也是本党内部之山头主义达到顶峰的体现。如今，在理性的技官政府掌控下，是时候摆脱军事狂热建设现代中国了。"
 YUN_draft_a_permanent_constitution: "起草正式宪法"
 YUN_draft_a_permanent_constitution_desc: "长期以来，国民党一直以混乱无章、难以理解且自相矛盾的方式执政，凭借行政权力推行荒谬决策。随之而来的是关于党国与训政体制利弊的激烈辩论，以及对制定中国宪法的呼唤。所幸的是，起草宪法将让政学系从中获益最多。"
 YUN_modernising_the_decrepit_dangguo: "腐朽党国现代化"
 YUN_modernising_the_decrepit_dangguo_desc: "党国体制已遭广大民众唾弃和憎恶，并被视作由军人、知识分子与理论家组成的傲慢集合——他们沉溺于官僚作风与内部争斗，无暇顾及民众疾苦。然而，在政学系的指导下，党员队伍中涌现出了一批紧跟现代化时代思潮的技官计划主义者。让我们把这种文化带入党内。"
 YUN_a_national_liberal_economy: "国家资本主义理性化"
 YUN_a_national_liberal_economy_desc: "尽管国家资本主义制度带来了崇高的理想和中国人民生活水平的显著提高，但这种发展模式终究仍需调整。通过实施国家控制重工业的计划经济，民族资产阶级和党才能共同见证中华民族取得重大经济发展，而非一切均由党主导。"
 YUN_rule_through_agreement_not_through_the_sword: "以笔代刀"
 YUN_rule_through_agreement_not_through_the_sword_desc: "尽管北洋政府付出了无数鲜血和牺牲，但最终导致其覆灭的并非其制度的失败，而是那些专制军阀的野心——他们更关注一己私利而非国家利益。党必须让全国人民都明白，中国是一个由绅士共识而非武夫暴徒统治的国家。"
 YUN_rule_of_national_experts_and_gentlemen: "本国专家与绅士之治"
 YUN_rule_of_national_experts_and_gentlemen_desc: "许多批评者谴责政学系是企图推翻国父、与北洋勾结的党内叛徒，也有人声称政学系是一群不了解工人疾苦的象牙塔精英。然而由此看来，本国实业精英与知识精英的统治显然是最有利之选择。"
 YUN_ushering_a_new_era_under_the_genro: "迎来“元老”之新时代"
 YUN_ushering_a_new_era_under_the_genro_desc: "“元老”(げんろう)一词是本世纪初日本高官和精英的非正式称谓，他们缔造了亚洲最早的民主政体之一，以及当时最现代化的国家，并以稳健的领导力，在数十年间对日本人民施加了巨大的影响。同样，政学系的统治也造就了一批属于自己的“元老”。"
 YUN_to_save_yunnan_from_itself: "云南的自救"
 YUN_to_save_yunnan_from_itself_desc: "云南历任统治者，尤其是唐继尧，最大的愚行莫过于妄想凭借展示强大武力，就能通过武力干预控制西南地区。然而，正是这种武力干预最终让他们自食其果。为了拯救云南于水火之中并保护云南百姓，蒙自派和滇龙只得挺身而出。"
 YUN_reorganising_the_yunnan_army: "重组滇军"
 YUN_reorganising_the_yunnan_army_desc: "剑斩蛇头后，仍有不少滇军将士忠于他们曾效力多年的总司令。事实上，滇军从来都不是铁板一块，而始终不容置疑的是——若无军方的稳固支持，我们便无法统治云南。是时候彻底肃清唐继尧麾下的不肖余孽了。"
 YUN_retreating_into_isolation: "退守孤立主义"
 YUN_retreating_into_isolation_desc: "云南虽侥幸得以保全，但也面临着昔日敌人继续蚕食我方控制领土的威胁。为了构筑坚不可摧的堡垒，我们必须彻底摒弃先辈的野心，当务之急则是加强防御工事和驻军部队。"
 YUN_dealing_with_the_southern_bandits: "处理南部匪患"
 YUN_dealing_with_the_southern_bandits_desc: "为了巩固自己在省内政坛的地位，胡若愚在匪患问题上采取了相对宽松的手段，倾向于控制土匪，而龙云则力主坚决剿灭。由于上次进军广州的策略，匪帮规模正日益扩大，还吸纳了前唐继尧部与前国民党溃兵，必须予以铲除。"
 YUN_salvaging_tangs_reforms: "挽救唐继尧改革"
 YUN_salvaging_tangs_reforms_desc: "尽管人们对唐继尧督理褒贬不一，但有一点毋庸置疑：他能够克服内外挑战，从而推动务实改革以及持续进步的能力，确实是值得称道的品质。必须坚持军民分治原则，政府职位的选拔应当唯才是举，而非基于个人输诚或家族关系。"
 YUN_eliminating_internal_dissidents: "清除内部异己"
 YUN_eliminating_internal_dissidents_desc: "由于政府显露疲态，或是在压力面前表现软弱，学生激进思潮正稳步抬头，其背后是一些自1932年以来就来到云南的政治势力。无论我们对外秉持何种立场——革命派或是共和派，省内异见人士都必须予以肃清。"
 YUN_handling_external_affairs: "解决对外事务"
 YUN_handling_external_affairs_desc: "仅凭军事力量和一贯的闭关自守政策，不足以阻挡大多数外部势力。我们虽不寻求分裂国家，但即便心不甘情不愿，也必须与外部军阀保持某种联系。如此一来，当国家再次统一时，云南才有希望能在领导层中占据重要位置。"
 YUN_protecting_our_commerce: "保护本地贸易"
 YUN_protecting_our_commerce_desc: "云南矿产资源丰富，其出口命脉一路延伸至印度支那的港口。长期以来，出口自然资源一直是云南的经济支柱之一。凭着富滇银行和缪云台的总商会建立的银行体系助力，加上蒙自派对矿脉的控制，云南无疑将更加繁荣。"
 YUN_expanding_our_universities: "扩展本地大学"
 YUN_expanding_our_universities_desc: "在龙云私人圈子里形形色色的人物中，不乏资深的省内政客，他们大多拥有留学经历。龙云计划利用这些人的专业知识，例如张邦翰，建立一套稳定的官僚体系，并以此为基础创办了东陆大学。希望这所高校未来能够发展壮大。"
 YUN_claiming_the_southwest: "宣称西南"
 YUN_claiming_the_southwest_desc: "尽管我们或许已不再抱有将旗帜插上北京城头的想法，但云南作为西南政局坚定仲裁者的角色依然至关重要。身为东大陆主人，一旦机会出现，云南人必将夺取并治理其所能掌控的西南地区。"
 YUN_as_the_flowers_bloom: "花开之日"
 YUN_as_the_flowers_bloom_desc: "秋海棠盛开之时，这个国家似乎比往日更为安定，云南无疑在国家大局中扮演着关键角色。然而，随着战火阴云再次逼近，国家经济遭受重创，这片土地已不复昔日荣光。高涨的民族主义情绪冲击着孤立主义和地方主义理念，而在昆明城内，仍有暗流在悄然涌动……"
 YUN_internal_affairs_reform_conference: "内务整顿会议"
 YUN_internal_affairs_reform_conference_desc: "鉴于国家和云南正值多事之秋，为了应对进一步的内外威胁，加强省级官僚机构建设已是势在必行。通过召开内务整顿会议，我们将落实亟需的财政改革，整饬国库收支，并进一步铲除匪患和扰乱社会秩序的行为。"
 YUN_raise_the_banner_of_the_southwest: "高举西南大旗"
 YUN_raise_the_banner_of_the_southwest_desc: "尽管我们或许会感到痛心疾首，尽管我们或许想逃避责任，但国家的动荡已然迫使我们必须打破云南的孤立状态。西南同胞之权益竟遭本应为盟友者屡屡悍然践踏，此等行径实属忍无可忍。我们将像以往一样，再次挥师出征。"
 YUN_the_yunnan_uprising: "云南再举义"
 YUN_the_yunnan_uprising_desc: "外省局势已然糜烂不堪，云南争取国家统一的时机已经到来。我们必须驱逐外部势力及其军队，然后进军首都、解放国家。昔日蔡锷发动护国战争是为了捍卫宪法，而我们此番举兵则是为了实现民族解放。"
 YUN_the_governments_undertaker: "政府的执法者"
 YUN_the_governments_undertaker_desc: "为了巩固我们政府对新近占领领土的铁腕控制，我们有必要以更严厉、更强硬的武力予以坚决回应。地狱无情，随着动乱的浪潮再次冲击云南的边界，政府必须拨给云南省公安局更多资源。"
 YUN_harmony_in_the_land_harmony_at_home: "地平天成万家兴"
 YUN_harmony_in_the_land_harmony_at_home_desc: "鉴于我们似是而非的革命姿态和政府架构，尽管士绅们声称自己的支持对省府至关重要，但他们也已开始对我方政府心生担忧。唯有让士绅阶层确信其仍是政权中流砥柱，方能借此遏制农民骚动。"
 YUN_the_unexpected_development: "意料之外的转折"
 YUN_the_unexpected_development_desc: "出乎意料的是，尽管我们一度坚持孤立和自守，但进一步主张未来统一全中国的机会现在近在眼前。这当然是个良机，而情况随时都可能出现变化，我们现在只能希望这次能比护国战争打得更出彩。"
 YUN_a_nation_of_valleys_and_caves: "河谷洞穴之国"
 YUN_a_nation_of_valleys_and_caves_desc: "中国内陆地区地势险要，洞穴密布，匪患猖獗。在此类地域取胜的关键并非依赖人力多寡或物资丰俭，而在于善用奇谋巧策。空中力量虽可成为制胜法宝，但唯有指挥官率领的地面部队，方能确保胜利。因此，这些指挥官必须深谙任务目标，且能以最佳手段达成目的。"
 YUN_the_vigorous_notion_of_sacrifice: "强烈的牺牲精神"
 YUN_the_vigorous_notion_of_sacrifice_desc: "正是由于我们深知战争不可避免，才会有众多将士为云南统一国家的梦想献出生命。但我们必须颂扬如此壮举，颂扬“敢死队”所蕴含的力量。若想要从北洋军阀手中拯救北洋政府，并完成蔡锷的未竟之业，则唯有破釜沉舟、全力以赴。"
 YUN_organisation_of_a_modern_army: "现代军队组织"
 YUN_organisation_of_a_modern_army_desc: "如果没有必要的预算拨款，往往难以维持一支真正现代化的军队，尤其是在像中国这样的地区，唐继尧本人就曾多次为了维持其庞大的靖国军而几乎耗尽省内财政。但随着滇军物资储备不断增加，组建精锐部队的契机已然成熟。"
 YUN_kunming_as_a_safehaven: "昆明避风港"
 YUN_kunming_as_a_safehaven_desc: "自1932年左翼和自由保守派知识分子遭到镇压以来，昆明已成为思想荟萃之地。许多教育家和作家聚集在西南内陆地区，在诸如现在的西南联大或云南大学等机构任教。让我们庇护这些学者，无论他们的政治立场如何。"
 YUN_revel_in_the_republican_tradition: "投身共和传统"
 YUN_revel_in_the_republican_tradition_desc: "中国共和传统的本质便是对勇气这一美德的赞歌，力求将一人之天下改造为全体同胞的福祉之地。在全面内战的背景下，士气和宣传很可能成为我们成功的两大支柱。一起讴歌我们伟大抗争的历史吧！"
 YUN_muster_our_fellow_comrades: "集结我方战友"
 YUN_muster_our_fellow_comrades_desc: "云南绵长的军事史使其在省内外拥有大量老兵。鉴于许多人对中央政府日益不满，我们当集结老兵，用历史的成就激励新兵。齐心协力，靖国军定能克敌制胜。"
 YUN_the_undefeatable_heroes: "英雄无敌"
 YUN_the_undefeatable_heroes_desc: "我们恐怕已退无可退。我们的军队已经开始不堪疲惫；然而，我们才是东大陆主人。凭借着这些曾取得辉煌战果的、我们国家最优秀的士兵，我们尚可做出破釜沉舟的最后一搏。可若是我们失败，后果将不堪设想。"
 YUN_establish_the_economic_committee: "组建经济委员会"
 YUN_establish_the_economic_committee_desc: "虽然自蔡锷创立富滇银行以来，该行始终兢兢业业地履行职责，但显而易见的是，我们亟需明确设立一个专门负责教育与云南金融复兴事务的政府经济委员会。有了像李培炎和缪云台这样的人才加入，政府委员会定能为稳定云南经济做出贡献。"
 YUN_junta_of_many_faces: "千面军政府"
 YUN_junta_of_many_faces_desc: "胡若愚的蒙自派虽然在反对龙云、唐继尧等人的共同立场上较为团结，但其内部却错综复杂、千人千面。张汝骥、李选廷以及众多士绅和被边缘化的官员都聚集在蒙自派麾下，因此他们的统治本质上是一种制衡之道。如今各方目光皆聚焦于胡若愚，且看他能否维持秩序。"
 YUN_the_yunnan_dragon: "滇龙"
 YUN_the_yunnan_dragon_desc: "无论是在唐督理治下还是其倒台后，龙云始终在云南事务中拥有强大影响力，因而被誉为“滇龙”。龙云政府融合了改良派和旧革命派，建立在汉族主导的官僚体系和彝族主导的军队之上，呈现出一种奇特的混合局面。然而龙云却凭借自身手腕，将这些元素完美融为一体。"
 YUN_a_renewed_land_survey: "重新清丈土地"
 YUN_a_renewed_land_survey_desc: "在经济委员会的主持下，一项将田赋过渡到耕地税并设立清丈总局的政策方案已经提出，陆崇仁将担任局长。陆崇仁虽然远算不上激进派，但他拥有务实高效的改革能力，仅凭新的土地税一项，就足以重振财政收入。"
 YUN_the_rotunda_of_finance: "财政殿堂"
 YUN_the_rotunda_of_finance_desc: "在前几任政府执政期间，省铸币厂直接隶属于政府，而非由财政厅管辖。于管理不善、效率低下，陆崇仁建议将造币厂管理权移交给财政厅。此外，他还希望培养新一代人才，并建立新的审计体系。"
 YUN_to_rebel_against_isolation: "反对孤立主义"
 YUN_to_rebel_against_isolation_desc: "退守省内事务的想法愚蠢至极。云南在中国统一大业中扮演着至关重要的角色，我们作战必须主动出击，不能只顾一昧防守。在卢汉的领导下，政府应该锐意进取，不仅在中国境内，在印度支那也同样如此。"
 YUN_guarantee_of_stability: "保证稳定"
 YUN_guarantee_of_stability_desc: "胡若愚统治方略中最关键的因素，或许正在于其“变色龙”般与生俱来的伪装能力。在意识形态上，胡若愚在各个方面都展现出极强的灵活性。在漫长的政治生涯中，他曾先后与国民党、唐继尧、吴佩孚等各方势力周旋合作——只要对方愿意支持他。有些人或许会认为这种做法缺乏骨气，但对胡若愚而言，这恰恰是他最大的优势。"
 YUN_security_as_a_provincial_affair: "治安省务"
 YUN_security_as_a_provincial_affair_desc: "为了维持云南的现有格局，龙云一直将地方治安视为省级事务。无论督理支持或拥护何种国家政策，省内政策始终应以安全和发展为核心。对外展示民主面貌，对内实施专制统治，一切都是为了保住督理之位。"
 YUN_the_roots_of_a_democratic_fortress: "“民主”堡垒之根基"
 YUN_the_roots_of_a_democratic_fortress_desc: "由于大量自由保守派知识分子涌入云南，加上云南当地的进步主义运动，导致省内长期深陷关于民主本质及其在中国适用性的争论之中。在云南王的庇护下，新民主主义联盟等各类民主组织将得以蓬勃发展、繁荣昌盛！"
 YUN_teaching_student_self_reliance: "教导学生自力更生"
 YUN_teaching_student_self_reliance_desc: "鉴于中国当前严峻的形势，对于学生激进思潮这一棘手问题，以及学生未来能否依靠国家稳定保障，人们提出了许多解决方案。为了保家卫国，寸树声等有识之士开始倡导自力更生的“斯巴达式教育”。云南应当效法其道。"
 YUN_the_southwestern_metropolis: "西南大都市"
 YUN_the_southwestern_metropolis_desc: "作为中国长期以来在西南地区施加影响和控制的重要中心城市，昆明如今已有大都市的雏形，至少与国内大多数城市相比是如此。在地方官员的苦心经营下，这座曾经以领事活动为主的城市现已蜕变为一座拥有繁华夜生活和独特文化的城市，且丝毫未受战火侵扰。"
 YUN_establishing_a_provincial_monopoly: "建立省级垄断"
 YUN_establishing_a_provincial_monopoly_desc: "在陆崇仁的主持下，政府开始实行“以财政扶持金融，以金融促进生产，以生产充裕财政”的政策。通过扩大官营事业，厉行专卖统销，云南经济将成为一条自给自足的锁链。"
 YUN_reorganise_the_fudian_bank: "重组富滇银行"
 YUN_reorganise_the_fudian_bank_desc: "尽管云南金融集团的触角几乎渗透到所有地方国有企业，但富滇银行在各项经济改革中都展现出了极强的作用和可持续性。通过推动富滇银行进一步融入省府行政管理体系，云南当局将把所有地方主要银行纳入同一家国有企业的旗下。"
 YUN_commerces_wartime_contribution: "总商会的战争贡献"
 YUN_commerces_wartime_contribution_desc: "自二十年代以来，缪云台领导的云南总商会一直掌控着云南经济命脉。然而，尽管总商会让我们获得了充裕资金，但其为云南战时目标所做的贡献仍远远不够。若能设立专项经费购置枪支弹药，滇军将得以配备国际最先进的武器装备。"
 YUN_militarisation_to_save_the_nation: "武力救国"
 YUN_militarisation_to_save_the_nation_desc: "唯有使用武力，中国人民才能摆脱境外势力和国家分裂的桎梏。在自然中，物竞天择，适者生存，对国家来说亦如是——只有能强加意志于他人的国家才配享有安稳。只有每把出厂的枪膛中都装着蓄势待发的弹丸，国家才能奋进。"
 YUN_maximise_tax_revenues: "税收最大化"
 YUN_maximise_tax_revenues_desc: "通过征收特别消费税和特别营业税，并强制推行印花税，云南应该能从民众手中获取数百万元资金，用于重新注入国有企业。此外，通过垄断鸦片的销售和运输，政府既能限制鸦片影响，又能获取巨额利润。"
 YUN_cai_es_dream_realised: "蔡锷梦圆"
 YUN_cai_es_dream_realised_desc: "正如现任中央政府的精神导师蔡锷所倡导的那样，大总统应当刚毅却柔韧，除非危及中央政权根本原则，否则不应对任何具体事务表态，而立法机构也不应凌驾于大总统或内阁之上。现任大总统显然毫不犹豫地遵循了这一原则。"
 YUN_obligations_of_the_military: "军队之义务"
 YUN_obligations_of_the_military_desc: "积极参与民族国家建设是军人在国家政治中的天然角色；军人有义务保卫国家免受一切威胁，因此当国家利益受到威胁时，他们有权（且有理由）介入政治领域。当政客们争吵不休时，军方必须时刻保持警惕。"
 YUN_the_financial_regulation_committee: "金融监管委员会"
 YUN_the_financial_regulation_committee_desc: "国家经历了难以估量的政治和军事动荡，多个经济领域遭受了严重打击，金融体系更是乱象丛生。通过成立新的经济监管委员会，国家将着手消除以往所有经济违规行为，从而开启经济复苏之路。"
 YUN_building_a_shared_nation_state: "建设共同的民族国家"
 YUN_building_a_shared_nation_state_desc: "在蔡锷的国家理想中，一个共同的民族国家需要每个公民都能为其福祉承担各自的责任，方能确保其生生不息。因此，任何破坏共和制度的行为，无论是废除选举，还是强权干预政府部门，都会削弱国家团结。"
 YUN_restoring_harmony_to_the_countryside: "重建乡间和谐"
 YUN_restoring_harmony_to_the_countryside_desc: "尽管士绅阶层可能对此有所抵触，但你不能让一个国家永远处于对民众的恐惧和对抗之中。正如孙中山先生所言，从某种意义上说，必须确保“耕者有其田”的政策在全国范围内得到落实。然而，政府应当避免让民众政治化，以免革命狂热蔓延。"
 YUN_all_under_the_king: "莫非王臣"
 YUN_all_under_the_king_desc: "作为战争英雄和国家元首，龙云大总统有权让所有内阁总长都对自己完全负责；议会之所以存在是为了表决通过大总统的议程，而非背道而驰。新生的北洋政府容不得党派倾轧，倘有政党存在，亦须完全遵照宪法行事。"
 YUN_duel_of_twin_dragons: "双龙对决"
 YUN_duel_of_twin_dragons_desc: "在其他对手溃败后，胡若愚与卢汉似乎已被卷入滇系内讧的浪潮。作为唐继尧建国计划仅存的领军人物，以及曾依附于龙云的野心勃勃冒险家，胡若愚与卢汉虽曾共同取胜，如今却反目成仇——看来天下的纷争远未结束。"
 YUN_restraining_the_revolution: "约束革命"
 YUN_restraining_the_revolution_desc: "士兵不应参与政治党派，如若放任外界事物使他们分心，领军的职责就落到了软弱的文官头上。同样，若每个政党都有军队撑腰，他们就不再可靠。原则上革命有理，但不可使军队人员政治化。"
 YUN_three_trainings_and_commandments: "三训三戒"
 YUN_three_trainings_and_commandments_desc: "国家统一后，众多中高级官员的法外特权大幅扩张，他们俨然已成为一个新的军阀阶层。为重整纲纪、遏制腐败，必须弘扬清正廉洁、勤勉奉公之美德，坚决同一切不正之风作斗争。"
 YUN_from_flexibility_to_dynamicism: "从权达变"
 YUN_from_flexibility_to_dynamicism_desc: "缺乏具体的意识形态信仰，在胡若愚与卢汉身上体现为与生俱来的个人主义倾向，或是缺乏国家建设规划，但这也许正是他们最大的优势。胡若愚与卢汉坚持超然于政治之上、果断行事的强人形象，且愿意做出务实的选择——无论是选择自由主义还是保守主义，他们能够始终将国家利益放在首位。"
 YUN_cultivate_the_national_youth: "培育国家青年"
 YUN_cultivate_the_national_youth_desc: "云南青年团事务局最初是滇系军阀在省内扶持的项目，如今已成为全国推广的理想模式。未来一代需要指引，需要一位智者来引导他们把握中国未来的方向，因此有必要通过青年团和其他组织来培养这种精神。"
 YUN_chinas_melting_pot: "中国文化大熔炉"
 YUN_chinas_melting_pot_desc: "龙云曾将彝族占多数的武装力量与汉族占多数的地方官僚机构融合在一起，对于将中国各少数民族文化融入更广阔的民族整体也是轻车熟路。与此同时，龙云还大力资助兴建了众多戏院、图书馆和博物馆。龙大总统不忘初心，将继续致力于为文化交融的新中国构建全新的多元文化认同。"
 YUN_adherence_to_the_new_literati: "听从新文人"
 YUN_adherence_to_the_new_literati_desc: "在历代王朝中，学者曾被尊为德高望重的官宦群体，引领中国走向和谐发展的道路。然而在辛亥革命爆发后，一种新的、享有盛誉的文人阶层——知识分子阶层应运而生。他们或接触西方思想，或试图将其与中国传统相融合，且让我们再度聆听他们的声音。"
 YUN_exporting_the_dian_economic_model: "推广云南经济模式"
 YUN_exporting_the_dian_economic_model_desc: "与华东地区不同，西部地区必须探索自己的经济发展道路：由于内陆地区外资投入有限，我们无法依靠外国人建设工厂和培训工人。正因如此，当下必须由庞大的官僚机构、中央计划以及政府对关键行业的干预主导经济，并引领全国发展。"
 YUN_on_the_issue_of_those_of_merit: "论选贤任能问题"
 YUN_on_the_issue_of_those_of_merit_desc: "国家新近统一，各路主要军阀及高层指挥官不断向新任大总统抱怨“官员任用不当”、“未举有才之士”。这虽是明显的争权夺利之举，然而他们的诉求仍须予以考虑。"
 YUN_restoring_auspicious_governance: "重建卿云之治"
 YUN_restoring_auspicious_governance_desc: "尽管直系核心势力已被历史洪流摧毁殆尽，但其门生故旧仍然散布在全国各地：国会、参议院，乃至各省的非正式关系网络仍在运转。胡若愚履历不凡，自当从一众直系边缘成员中脱颖而出，步入权力中枢，成为军人大总统也是当仁不让。"
 YUN_revolutionary_constitutionalism: "革命宪政"
 YUN_revolutionary_constitutionalism_desc: "尽管卢汉对国民党的真正革命斗争持矛盾心理，但他仍认可其理念与实践中有诸多可取之处。卢汉理解并体谅普通农民的艰难处境，也认同对一个强大、民主的民族主义国家的渴望，因而能够借助周钟岳等智者的力量，帮助部分革命者重新融入政府主流。"
 YUN_the_steeled_democracy: "百炼成钢的“民主”"
 YUN_the_steeled_democracy_desc: "龙云与众多可敬的民主人士交情深厚，骨子里是一位深受辛亥民主理想熏陶的领袖。尽管凭借军事行动荣登大位，然而龙大总统却倾向于宪政统治。民主虽然不会很快到来，但至少可作为我们为之奋斗的理想。"
 YUN_government_by_efficiency: "高效政府"
 YUN_government_by_efficiency_desc: "民主派、煽动者和理论家们沉溺于自身意识形态的绝对正确，却忽视了什么才是对国家最有利的抉择，这从根子上就错了。正是在他们的种种缺陷与失败的印证下，才让务实勤勉的龙大总统得以登上国家元首宝座。遵循效率和进步的原则，中国及其公民必将迎来繁荣昌盛。"
 YUN_protecting_chinas_foundations: "保护国计民生之基"
 YUN_protecting_chinas_foundations_desc: "中华民族国家的存亡完全取决于其保护、管理和振兴其农业领域及环境的能力。在积极关怀农民的同时，我们也必须养护农民耕种的土地。通过建立区域自然保护委员会和土地复垦局，中国将永远摆脱饥荒。"
 YUN_extending_a_hand_to_the_gentry: "携手士绅"
 YUN_extending_a_hand_to_the_gentry_desc: "士绅阶层曾鼎力支持过众多现居中央高位者，但由于农民问题之故，他们在国家统一后的地位似乎有所下降。然而，双方仍有可能达成互利共赢的协议。政府若能保护士绅阶层免受动乱之苦，便可赢得他们的支持。"
 YUN_the_great_commandant: "大统帅"
 YUN_the_great_commandant_desc: "胡若愚在中国期间撰写了多部现代军事理论著作，例如《现代陆军的编制》、《大军统帅》等。而现在他也成为了书中所写的一位饱受尊敬的国家大统帅，他受到的尊敬不仅来自其支持者，还来自广大民众。"
 YUN_the_adventurous_turncoat: "勇于冒险的变节者"
 YUN_the_adventurous_turncoat_desc: "为了追求个人荣耀和无尽野心，卢汉不惜破釜沉舟，最终登上了国家最高权力宝座。虽然一路走来损失惨重，卢汉近乎莽撞的性格和固执己见的立场也给国家的脆弱平衡带来了诸多动荡，然而新的冒险仍在前方等待。"
 YUN_introgame_minigame_decision_category: "打破滇黔僵局"
 YUN_introgame_minigame_decision_category_desc: "1927年3月，国民革命军残部完成了艰苦卓绝的“长征”，抵达黔西，在这个被四方军阀反复争夺的省份扎下了根。势头不再的直军选择调头向东，并任命袁祖铭为督理执掌黔东，贵州的其他地区则留给了滇系军阀。过去十年间，云南省内乱不断，使唐继尧督理自顾不暇，同时他也希望能拥有一块对抗直系霸权的缓冲区，因此一直没有将黔西地区再度纳入自己的势力范围，但贵州的§c国民党军政府§!与§f滇系军阀§!脆弱的休战恐怕维持不了多久了。\n\n双方的冲突恐怕只能在战场上见真章，但要向边界调集军队绝非易事。\n§c黔省国党§!已动员了[?YUN_introminigame_KMT_soldiers_var|c0]名士兵。\n§f滇系军阀§!已动员了[?YUN_introminigame_UPC_soldiers_var|f0]名士兵。\n\n§Y双方若想确保战胜对手，就需要比对方多动员10000名兵力。§!\n[YUN_introgame_troop_advantage_loc]"
 YUN_introgame_troop_advantage_loc_KMT: "当前，§c黔省国党§!的兵力比§f滇系军阀§!多[?YUN_introminigame_KMT_soldiers_difference_var|c0]名。"
 YUN_introgame_troop_advantage_loc_UPC: "当前，§f滇系军阀§!的兵力比§c黔省国党§!多[?YUN_introminigame_UPC_soldiers_difference_var|f0]名。"
 YUN_introgame_troop_advantage_loc_balanced: "当前，§f滇系军阀§!与§c黔省国党§!势均力敌。"
 YUN_introminigame_war_preparation_mission_timer: "初步战争准备已完成"
 YUN_introminigame_war_preparation_mission_timer_desc: "尽管滇黔两省地理毗邻，但入侵前的准备工作仍需时间。我们需要建立补给站，绘制作战地图，并部署新抵达的部队。省界两侧的将领都在进行兵棋推演，力图取得关键优势。前线的集结工作将持续整个春耕时节，指挥官们确信麾下军队到了夏季便会做好入侵准备。"
 YUN_troops_flood_to_the_border_monthly_timer: "部队涌向滇黔边境"
 YUN_troops_flood_to_the_border_monthly_timer_desc: "滇黔边境的部队集结导致双方不断向前线部署兵力，局势陷入了持续升级的恶性循环。如今，任何出奇制胜的希望都已破灭，双方互相竞争，试图压制对方——讽刺的是，此举反而加剧了僵局。唯有采取果断行动，才能在边境取得足以击溃对手的优势。"
 YUN_introminigame_switch_sides_decision: "弃暗投明"
 YUN_introminigame_switch_sides_decision_desc: "嫉妒、贪婪、自保……虽然理由各异，但改换门庭背叛旧主的故事在军阀混战时代屡见不鲜。而随着战局改变，对边境两侧的许多低级军官而言，这一选项正变得愈发诱人。"
 YUN_introminigame_commence_the_assault_decision: "开始攻击"
 YUN_introminigame_commence_the_assault_decision_desc: "在我们的努力下，我军兵力增长速度已经超越敌军，既然优势在我，我们必须趁热打铁，在敌人获得更多增援前命令部队前进。"
 YUN_introminigame_accelerate_our_buildup_decision: "加速兵力增长"
 YUN_introminigame_accelerate_our_buildup_decision_desc: "唯有抢先集结兵力、先发制人者才能打破僵局。明智的将领深知，后勤保障不仅仅是军事问题，往往也关乎政治。能够调动民众资源、克服官僚惰性的一方，便能拥有更多的武器、物资和兵力。"
 YUN_introminigame_develop_our_battleplan_decision: "制定作战计划"
 YUN_introminigame_develop_our_battleplan_decision_desc: "常言道，将领们精心制定的计划总会在接敌瞬间失效，不过这丝毫不能降低出色计划的价值。我们必须努力整合由间谍、侦察兵和地面部队组成的情报网络所提供的信息，以便我们的规划者能够为即将到来的战争制定出最佳战略。尽管具体细节会随着局势的发展而变化，但在战前将合适的资源部署到合适的位置，将赋予我们赢得胜利所需的灵活性。"
 YUN_introminigame_win_the_war_of_wills_decision: "不战而胜"
 YUN_introminigame_win_the_war_of_wills_decision_desc: "孙子曰：“不战而屈人之兵，善之善者也。”在这军阀朝秦暮楚的时代，敌军的实际数量可能会比敌人调集的数量多得多，或者少得多。通过针对性宣传和大笔贿赂双管齐下，我们也许能说动部分敌军出工不出力甚至直接放弃抵抗，同样的，提升军饷等待遇也能让我军官兵更加忠诚。"
 YUN_GXC_war_decision_category: "第二次滇桂战争"
 YUN_GXC_war_decision_category_desc: "滇系进攻两广，南方战火重燃。此役胜败取决于滇军能否攻克广西省会南宁，如攻克，广州将门户洞开，如不克，云南省内许多人将对[YUN.GetLeader]失望，战争或许会以谈判收场。\n\n§Y[YUN_GXC_war_settlement_scripted_loc]§!"
 YUN_GXC_war_settlement_outcome_start: "如果今天签订和约，滇系将"
 YUN_GXC_war_settlement_outcome_1: "$YUN_GXC_war_settlement_outcome_start$被迫建立一个合作政府，并割让贵州。"
 YUN_GXC_war_settlement_outcome_2: "$YUN_GXC_war_settlement_outcome_start$被迫建立一个合作政府，但保留贵州。"
 YUN_GXC_war_settlement_outcome_3: "$YUN_GXC_war_settlement_outcome_start$无条件和平，但割让贵州。"
 YUN_GXC_war_settlement_outcome_4: "$YUN_GXC_war_settlement_outcome_start$无条件和平，并保留贵州。"
 YUN_the_course_of_the_yunnan_guangxi_war_mission: "滇桂战局"
 YUN_the_course_of_the_yunnan_guangxi_war_mission_desc: "滇军将领们既不愿卷入对外军事冒险，也不愿云南被外省势力掌控，如果战况不如预期中顺利，他们就会动摇。成功占领南宁，滇军将士气大振，反之滇军则会士气全无。"
 YUN_GXC_increase_morale_effect_tt: "§Y如果我们控制了南宁且战争支持度较高，士气国家精神就会§G升级§!。§!"
 YUN_GXC_decrease_morale_effect_tt: "§Y如果我们没有控制南宁且战争支持度较低，士气国家精神就会§R降级§!。§!"
 YUN_begin_secret_surrender_negotiations_decision: "开启秘密求和谈判"
 YUN_begin_secret_surrender_negotiations_decision_desc: "不出所料，战局一塌糊涂，随着速战速决成为奢望，敌军攻入云南的可能性大涨，龙云、胡若愚两位将军已经开始秘密探讨推翻[YUN.GetLeader]的可能性，亡羊补牢，为时未晚，是时候与敌人谈判，结束这场战争了！"
 YUN_accept_yunnans_surrender_decision: "接受滇系求和"
 YUN_accept_yunnans_surrender_decision_desc: "我们已经与昆明城内密谋的滇军将领取得联络，值此战局有利之际，正适合我们提出条件，如此一来，我们既不用在山区劳师远征，又能暂时确保西线的安全。"
 YUN_grand_southern_reconstruction_decision_category: "华南大建设"
 YUN_expand_gejiu_mining: "扩张个旧矿业"
 YUN_expand_gejiu_mining_desc: "华南大建设方略启动后，得益于过去几年我国经济的工业化进展，个旧地区丰富的锡矿资源终于可以得到开发利用。"
 YUN_kunming_cement_factory: "昆明水泥厂"
 YUN_kunming_cement_factory_desc: "为了减少对邻省和国外进口水泥的依赖，云南必须发展自己的水泥工业，以确保华南大建设的安全稳定。"
 YUN_modernised_smelting: "现代化冶炼"
 YUN_modernised_smelting_desc: "若要充分开发云南的矿藏，减少对进口钢铁的依赖，就必须改进云南现有的冶炼行业。必须更换老旧的机器设备，购置缺失的设备，并学习新的技术。"
 YUN_purchasing_american_machinery: "购买美国机械"
 YUN_purchasing_american_machinery_desc: "为了进一步推进我们的工业发展，并替换效率低下且略显陈旧的工具，政府必须向经验更丰富的外国寻求帮助。鉴于美国是世界上工业化程度名列前茅的国家，我方政府向其寻求援助无疑是明智之举。"
 YUN_yaolong_electric_station: "耀龙电力公司"
 YUN_yaolong_electric_station_desc: "随着云南经济日益工业化，我们应在省内耀龙公司附近建设一座水电站以满足未来电力需求，如此不失为明智之举。"
 YUN_charcoal_kiln: "扩张昆明炭窑"
 YUN_charcoal_kiln_desc: "由于云南大部分人口居住在农村地区，加之木炭比起用作燃料更适合用于烧火做饭，木炭的需求量正在激增。通过提高省内木炭产量，政府既可以增加财政收入，又能安抚本地木炭经销商。"
 YUN_arsenal_subsidies: "兵工厂补贴"
 YUN_arsenal_subsidies_desc: "尽管昆明兵工厂历来是滇军的稳定武器供应商，但鉴于政府对武器的需求不断增长，其产量可能已无法满足需求。鉴于有人希望扩建兵工厂，如果政府希望维持武器供应，增加对昆明兵工厂的补贴至关重要。"
 YUN_guizhou_brewing_factory: "贵州酿酒厂"
 YUN_guizhou_brewing_factory_desc: "尽管贵州经济欠发达、贫困落后，但茅台酒在其漫长的历史中始终是贵州最有价值、最著名的出口产品之一。因此，为了维持甚至增加贵州茅台酒对中国其他地区的供应，就必须扩建现有的酿酒厂和蒸馏厂。"
 YUN_guangzhou_cement_factory: "广东士敏土厂"
 YUN_guangzhou_cement_factory_desc: "由于广东原有的水泥制造业相对稳定，因此无需额外投资便可维持现状。然而，如果政府要减少使用进口水泥，就必须进一步扩大广东水泥产业规模，以确保西南地区未来所有建设项目的安全。"
 YUN_qingyuan_chemical_and_fertiliser_factory: "清远化工与肥料厂"
 YUN_qingyuan_chemical_and_fertiliser_factory_desc: "虽然中国是一个以农业为主的国家，却仍然缺乏现代化的肥料产业。经济规划人员制定了一项雄心勃勃的计划，拟在广州建设一座化工与肥料厂，希望以此启动中国肥料产业的现代化进程。"
 YUN_wengjiang_hydroelectric_plant: "滃江水电站"
 YUN_wengjiang_hydroelectric_plant_desc: "随着广州乃至整个广东省崛起为中国的新工业中心，预计未来几年该地区的电力消耗将大幅增长。为了满足广东省新兴产业的电力需求，我们可以利用珠江的充沛水力，沿江建设新的水电站。"
 YUN_qiongya_rubber: "琼崖橡胶"
 YUN_qiongya_rubber_desc: "琼崖气候温暖，土壤肥沃，近年来已发展成为经济作物种植区。如果开垦橡胶园，为政府和潜在的外国买家供应橡胶，岛上经济作物的利润还可以进一步提高。"
 YUN_guangxi_infrastructure_development_scheme: "广西基础设施发展计划"
 YUN_guangxi_infrastructure_development_scheme_desc: "广西往往在发展中滞后，基础设施常常达不到现代标准。因此，如果政府希望发展广西工业，投资建设新的基础设施项目可谓至关重要。"
 YUN_guangxi_farmers_bank: "广西农民银行"
 YUN_guangxi_farmers_bank_desc: "农民们深陷于恶性债务循环——春天借贷，寄希望于秋天丰收。为了缓解他们的困境，我们将成立一家农民银行，向农村粮仓和农民提供贷款，并以粮食作为抵押。政府还将监管商户设立面向民众的信贷机构，以便利农村商业活动。我们绝不会抛弃农民。"
 YUN_arable_land_development: "耕地开发"
 YUN_arable_land_development_desc: "由于云南地处山区，大规模农业发展一直面临挑战。水稻种植和小规模农场因其适应性强，构成了云南农业目前的主要形式。为了缓解这一问题，政府必须通过进一步扩大耕地面积来发展云南的农业产业。"
 YUN_yunnan_cotton_spinning_and_weaving: "云南棉花的纺与织"
 YUN_yunnan_cotton_spinning_and_weaving_desc: "棉花生产和纺织是云南生产力较高的轻工业之一，延续唐继尧政府进一步发展云南棉纺厂的政策方为明智之举。"
 YUN_yunnan_water_control: "云南水利"
 YUN_yunnan_water_control_desc: "云南的雨季降水量大，导致许多云南民众饱受洪涝灾害之苦。鉴于雨季洪灾的破坏性，历任政府都曾大规模组织修建水利工程，以尽量减少损失。现任政府也必须继续这样做。"
 YUN_support_inc: "支援印度支那起义"
 YUN_support_inc_desc: "我们与印度支那邻国之间素有几分文化上的兄弟情谊，虽然我们未能支持他们此前摆脱德国统治的事业，然而一场新的起义现已爆发，而且其烈度与强度前所未有，因此我们必须抓住这个机会，支持友好政权，削弱德国在亚洲的影响力，并肃清德方渗入云南的触角。此举可谓皆大欢喜——德国人除外。"
 YUN_mining: "扩大采矿业务"
 YUN_mining_desc: "个旧及云南其他主要矿业城市的采矿业，都是影响云南经济的重要部分。扩建我省的采矿场、熔炼炉和冶炼炉，以及补贴矿业公司将有助提高矿石的质量和产量。"
 YUN_mining1_decision: "扩建[816.GetName]的煤矿"
 YUN_mining1_decision_desc: "扩建[816.GetName]的采矿场、熔炼炉和冶炼炉，以及补贴矿业公司将有助提高矿石的质量和产量。"
 YUN_mining2_decision: "扩建[325.GetName]的铝矿"
 YUN_mining2_decision_desc: "扩建[325.GetName]的采矿场、熔炼炉和冶炼炉，以及补贴矿业公司将有助提高矿石的质量和产量。"
 YUN_mining3_decision: "扩建[816.GetName]的铬矿"
 YUN_mining3_decision_desc: "扩建[816.GetName]的采矿场、熔炼炉和冶炼炉，以及补贴矿业公司将有助提高矿石的质量和产量。"
 YUN_mining4_decision: "扩建[816.GetName]的钨矿"
 YUN_mining4_decision_desc: "扩建[816.GetName]的采矿场、熔炼炉和冶炼炉，以及补贴矿业公司将有助提高矿石的质量和产量。"
 YUN_CHI_Spreading_Socialism_to_the_Southwest_decision_category: "在西南传播社会主义"
 YUN_CHI_Spreading_Socialism_to_the_Southwest_decision_category_desc: "中国西南的云贵两省传统上比较保守，革命运动在此地屡遭镇压，取而代之的是得到士绅支持的“改良主义”。整个20年代，国民党及其前身都一直在努力维持在该地区的存在，在国民革命军的长征之后，国民党右派势力终于在1928年成功夺取了贵州的部分地区，而直系霸权崩溃之后，他们又以党的名义征服了云南。\n\n他们只与我们结成了松散的联盟，其忠诚度仍然值得怀疑。中央委员会已向昆明和贵阳派出了顾问，试图在该地区推动社会主义的发展，但他们仍需要我们的帮助。完成以下决议将增加左派在西南地区的影响力，增加§R章伯钧§!或§S陈诚§!在我们完成北伐后控制云南的可能性。"
 YUN_CHI_fund_agrarian_development_in_guizhou_decision: "资助贵州农业发展"
 YUN_CHI_fund_agrarian_development_in_guizhou_decision_desc: "陈诚将军呼吁进行在农村进行广泛的土地改革，包括耕者有其田、限制地租和精简捐税，这看上去是本党那些更为激进方案的温和版本，但这么做也许就能在保守的贵州传播我们的理念。通过为这些努力提供资金支持，我们可以让贵州农村的未来更加公平。"
 YUN_CHI_arm_the_civil_engineering_clique_decision: "武装土木派"
 YUN_CHI_arm_the_civil_engineering_clique_decision_desc: "陈诚先前被任命为从贵州的老第一军分割出来的第十八军的军长，加之他曾经直接领导的第十师，他这一派人也被称为“土木系”（“十一”合之为“土”、“十八”合之为“木”），代表了蒋介石的黄埔系之左翼。虽然陈诚也许并非真正的社会主义者，但他与邓演达及临委会的关系关系密切，有力地制衡了明显右倾的政学系。通过优先向陈诚将军提供武器，将有助于在西南地区推动社会主义。"
 YUN_CHI_cultivate_third_army_leftists_decision: "扶持第三军左派"
 YUN_CHI_cultivate_third_army_leftists_decision_desc: "朱德将军大概是第三军中最引人瞩目的左派，他极具战略头脑、与朱培德、范石生和金汉鼎这样的地方革命将领关系匪浅。在个人政治高于意识形态的西南，他是我们一笔宝贵的财富。通过资助昆明兵工厂并对云南陆军讲武学校进行大规模翻修，我们将增强对滇军的影响力。"
 YUN_CHI_empower_zhang_bojun_decision: "授权章伯钧"
 YUN_CHI_empower_zhang_bojun_decision_desc: "章伯钧是位忠诚的党员干部，他一直在云南担任“顾问”，同时也是社会主义党派在西南地区实际上的全权代表。章伯钧善于交际、成果斐然，他受过良好教育、魅力超群，能够融入当地的知识分子圈子。而现在章伯钧声称，许多云南的学生和教授都对最近的政局发展感到失望，只要我们愿意慷慨地给他提供资金，他就能让他们改变立场。"
 YUN_CHI_recognise_the_new_yunnan_society_decision: "承认新滇社"
 YUN_CHI_recognise_the_new_yunnan_society_decision_desc: "中国工团党云南特别局是一个由曾在黄埔军校接受过军政训练的，后转向革命的学生结成的秘密组织。他们的领头人是王德三、王复生兄弟，这二人也通过更广泛的新滇社（工团党由云南籍工团主义者组成的社团）在渗透该省的工作中取得了一定成果。对这一社团予以官方承认将令他们可以走出地下，但这么做的后果难以预料。"
 YUN_CHI_recognise_the_new_yunnan_society_tt: "§Y根据云南的选择，云南的§r工团主义§!、§R激进社会主义§!或§S社会民主主义§!支持率将提升。§!"
 YUN_dian_dragon_domain_decision_category: "滇龙盘踞之地"
 YUN_dian_dragon_domain_decision_category_desc: "蔡锷及其遗产的继承人一败涂地。尽管唐继尧督理将滇省滇军带到了如今的高度，并击败盘踞黔省的国民党残部。但他却判断失误，错误地将目光投向了南方明珠广州城，并差点因其对广西的失败入侵而葬送了整个滇系军阀。于是他手下的将领将其监禁起来，并停战议和。[YUN_dian_dragon_domain_long_yun_status_scripted_loc][YUN_dian_dragon_domain_hu_ruoyu_status_scripted_loc]"
 YUN_dian_dragon_domain_long_yun_independent_key: "\n\n几十年来，§g龙云将军§!一直牢牢把控着云南政局，虽然在二六政变事变后期权力暂时被限于北方的昭通一城，但在唐督理被赶下台后，龙云又成为了名副其实的“云南王”。龙云将军坚定地维护着云南的自治，他主张孤立、拒绝站队。\n§Y当前§g$YUN_long_yun_clique_party$§!的影响力为[?YUN.party_popularity@authoritarian_democrat|%g2]。§!"
 YUN_dian_dragon_domain_hu_ruoyu_independent_key: "\n\n§P胡若愚、张汝骥和李选廷领导的军政府§!以南部的蒙自为大本营，据称他们一直与德国利益集团暗通款曲，同时也对直系的影响门户大开。一旦§P$YUN_hu_ruoyu_clique_party$§!的支持率超过20%，§R直系军阀就能在与滇系接壤时对其施压，迫使滇系与自己结盟。§!\n§Y当前§P$YUN_hu_ruoyu_clique_party$§!的影响力为[?YUN.party_popularity@paternal_autocrat|%P2]。§!"
 YUN_acknowledge_zhili_authority_decision: "承认直系权威"
 YUN_acknowledge_zhili_authority_decision_desc: "我们本应不惜一切代价地维护云南自治，但时局至此，必须承认这一伟业已无法实现。由于直系已经来到了我们身边，且直系支持者不断向我们施压，要求我们与直系结盟。我们别无选择，只能向直系高层通电承认其全国权威，以保证我们在其保护下享有剩余的自治。"
 YUN_building_a_democratic_base_decision: "建立民主基地"
 YUN_building_a_democratic_base_decision_desc: "当袁世凯颠覆共和、悍然称帝，企图将辛亥先烈浴血推翻的帝制枷锁重新强加于国家时，云南首举义旗反抗袁氏暴政。为了铭记革命牺牲，我们坚持这份传承，并凭借省内改良派知识分子和进步运动的帮助，将云南建设成为一座“民主”堡垒，使云南成为其应有的样子。"
 YUN_entrust_our_finances_to_commerce_decision: "委托总商会打理财政"
 YUN_entrust_our_finances_to_commerce_decision_desc: "云南总商会通过发展地方产业和完善省内金融体系，促进了云南经济增长，并已成为省府值得信赖的合作伙伴。凭借此前与蔡锷都督和唐继尧督理的合作经验，总商会完全有能力妥善打理全省财政。双方携手合作，必将为云南带来繁荣，让全省人民共同受益。"
 YUN_continue_modernisation_efforts_decision: "继续现代化事业"
 YUN_continue_modernisation_efforts_decision_desc: "云南地处偏远边陲山区，与东部其他省份相比发展较为滞后。由于没有海岸线，云南除了唐继尧督理所做的一些工作外，并未享受到国内其他地区现代化进程带来的益处。我们将接手唐继尧督理的事业，确保云南在社会、政治和经济方面实现现代化。"
 YUN_repurpose_the_bureaucracy_decision: "重整官僚机构"
 YUN_repurpose_the_bureaucracy_decision_desc: "尽管唐继尧督理有诸多失职，但正是多亏了他，我们才得以继承一个庞大且运转良好的官僚体系——这套体系在他执政期间始终“忠诚”为他效力，高效且毫无异议地推行他的各项政策与改革。如今唐继尧既然已退出政局，云南已由我们掌控，我们自然要重新配置这套完善体系，使其更好地服务于我们的需求，并通过延续前任政府的政策来巩固我们统治的合法性。"
 YUN_tolerate_mengzis_monopoly_decision: "容忍蒙自垄断"
 YUN_tolerate_mengzis_monopoly_decision_desc: "云南省的大部分自然资源都掌握在蒙自派手中，他们控制着云贵高原南部山区的大部分矿山。蒙自派开采矿产，并将其出口到印度支那港口进行提炼，这已成为云南省的主要收入来源之一，为经济发展、行政管理以及最重要的军事力量提供资金。不出所料，由于蒙自派之地理位置，其垄断了云南采矿业，我们目前只能对此予以容忍。"
 YUN_pressure_yunnan_into_alignment_decision: "逼迫云南结盟"
 YUN_pressure_yunnan_into_alignment_decision_desc: "我们在云南的付出已初见成效，忠于我们政府的人士开始掌握足够的力量，足以挑战该省现政权。龙云将军的统治岌岌可危，现在正是我们向云南施压，迫使其与我们政府结盟的最佳时机！"
 YUN_allure_of_money_and_flattery: "金钱与奉承的诱惑"
 YUN_allure_of_money_and_flattery_desc: "由于远离中央政府的控制范围，云南在政治上享有一定程度的自治权，可以独立于北京的意愿开展行政管理。然而，这也使云南成为西南地区最贫困的省份之一，经济发展滞后，被中央政府忽视。对我们而言，这恰恰是一个机会，我们可以通过提供财政援助来扩大在云南的影响力。"
 YUN_bribing_the_disaffected: "贿赂心怀不满之人"
 YUN_bribing_the_disaffected_desc: "滇军虽然比中国大多数军阀军队更专业，但其忠诚度却值得怀疑。尽管龙云的云南霸主地位毋庸置疑，但仍有人忠于唐继尧督理及其残党，更有甚者只需银弹攻势便愿改换门庭。通过向腐败军官与麻木士卒层层行贿，叛逃的威胁定能迫使龙云就范。"
 YUN_issue_threats_to_yunnan: "向云南发出威胁"
 YUN_issue_threats_to_yunnan_desc: "尽管滇系在第二次滇桂战争中战败，并随即发动政变推翻了唐继尧督理，因而采取了闭关自守政策，但云南维持独立的想法已不再可行。滇军对战败记忆犹新，再次开战的威胁应该足以震慑云南领导层，促使其与我方结盟，并加强我们对西南地区的控制。"
 YUN_deal_with_the_mengzi_junta: "与蒙自军政府交易"
 YUN_deal_with_the_mengzi_junta_desc: "唐继尧督理倒台后，昆明的镇守使龙云与蒙自的其他三位镇守使胡若愚、张汝骥和李选廷之间形成了权力平衡。与奉行孤立主义和不结盟政策的龙云不同，我们在云南的特工表示，蒙自军政府更倾向于和我方政府结盟。有鉴于此，我们可以通过直接与蒙自军政府达成协议，从而扩大我们在云南的影响力。"
 YUN_send_out_peace_feelers: "发出和平试探"
 YUN_send_out_peace_feelers_desc: "昆明爆发的政变，除却其策划者的自保意图外，更明显标志着云南正与武力干预主义划清界限，进而远离战争泥潭。在云南陷入政治孤立后，我们应该向其发出和平试探，表明我们致力于在不诉诸武力的情况下实现国家统一。推动和平符合双方共同利益，相信昆明方面必将响应提议，并为了国家和平统一而与我方结盟。"
 YUN_provisional_constitution_crisis_decisions: "《训政时期约法》危机"
 YUN_provisional_constitution_crisis_decisions_desc: "[YUN_provisional_constitution_crisis_desc_scripted_loc]"
 YUN_provisional_constitution_crisis_desc_he_yingqin_key: "何应钦主席已发誓要不惜一切代价通过《训政时期约法》。对他而言，这将是团结国家并从根本上维护自己权威的唯一途径。而面对立法院长胡汉民的强烈反对，何应钦已命令手下开始策划一场自我政变——用武力一举消灭所有反对自己统治的异见人士。\n\n为了成功实现这一目标，何应钦必须确保§c国民党热忱§!处于中间位置：在总计60天的$YUN_he_yingqin_autocoup_mission$任务结束时，国民党热忱需高于§R$RKT_bop_unrelenting_cynicism$§!并低于§G$RKT_bop_unbridled_conviction$§!。\n\n目前的国民党热忱为§Y[ROOT.GetActiveRangeName]§!"
 YUN_provisional_constitution_crisis_desc_zhang_qun_key: "胡汉民被捕后，《训政时期约法》危机愈发失控。为了挽救局面，§M政学系§!上演了一场夺权大戏，并遭到了对立的§aCC系§!强烈反对。与此同时，§P黄埔系§!也在考虑由自己发动一场政变。\n\n国民会议正在举行中。众所周知，代表们都是些两面派，他们更愿意投票支持那些给自己许以重金或目前看起来势力更胜一筹的人。\n\n§M政学系§!需要获得§M335票§!才能通过约法并挽救政府。\n[?YUN_PSC_aligned_delegates_variable|M0]§M/502§!的代表目前愿意在投票中支持他们。\n\n§aCC系§!需要获得§g252票§!才能否决约法并开始不信任投票。\n[?YUN_CCC_aligned_delegates_variable|g0]§g/502§!的代表目前愿意在投票中支持他们。\n\n如果不能及时找出解决方案，§P黄埔系§!就会发动政变。\n\n最终的胜利者将受到§g£pol_power 政治点数（由CC系席位决定）§!、§M£GFX_stability_texticon 稳定度（由政学系席位决定）§!和/或§P£war_support_texticon 战争支持度（由政变进度决定）§!惩罚，惩罚数值与危机结束时对手势力的实力成正比。"
 YUN_he_yingqin_autocoup_mission: "何应钦自我政变"
 YUN_he_yingqin_autocoup_mission_desc: "以立法院长胡汉民为首的党内批评声浪日益高涨，导致胡汉民和国府主席何应钦之间产生了严重分歧。双方的猜疑有增无减，《训政时期约法》的起草更是雪上加霜，最终何应钦决心彻底消灭他的对手。\n\n要实现这一点，何应钦不仅需要清除胡汉民及其党内的莫斯科派盟友，还需要解除或压制那些控制着党的南部心脏地带的地方军阀武装。而这并非易事，要想成功实现目标，他需要证明自己能够维护党的稳定，并避免国民党热忱过高或过低。"
 YUN_hu_hanmins_outrage_mission: "胡汉民之怒"
 YUN_hu_hanmins_outrage_mission_desc: "胡汉民是一位口若悬河的演说家，也是孙中山的亲密弟子，这使他得以在党国体制内表达异常广泛的异议。作为一位虔诚的民主集中制拥护者，胡汉民猛烈抨击那些结党营私的国民党人士，以及那些囤积财产、贪污腐败的政府官员——在何应钦看来，这些指责皆是对委员长的影射。\n\n尽管胡汉民的种种荒唐举动一度尚可接受，或者至少是必要之恶，但围绕《训政时期约法》的争论却令两人关系急剧恶化。作为立法院长，胡汉民认为国民党可以召开国民会议，但无权起草临时宪法，且国民会议/国民大会只有在训政阶段结束后才能起草正式宪法。此外，胡汉民还认为，临时宪法非但不能改善人民生活，反而会分散人们对国家建设、减轻赋税以及发展交通基础设施，以及振兴农工商业的注意力。\n\n与《训政时期约法》的空洞话语不同，胡汉民非常乐意用他装备精良的支持者来捍卫自己的观点。"
 YUN_position_forces_near_liangguang_mission: "在两广附近部署部队"
 YUN_position_forces_near_liangguang_mission_intro: "两广地区（粤桂两省）乃国民党的传统核心地带，也是反何势力的中心。而如何应钦的独裁统治、胡汉民作为粤老心之所向的地位、CC系对党的“去粤化”努力、政学系在粤时的不良历史，以及黄埔系各路领导人的外省籍（黔人何应钦、苏人滕杰、浙人陈诚），使得粤省逐渐成为旧右派与地方右派反对新右派的中心。\n\n他们也绝非等闲之辈。作为中国的富裕省份，粤省有着悠久的对外贸易历史，其地方部队建设齐全。同样，随着新桂系重建对各省的控制，他们将桂省打造成了“中华斯巴达”，把土匪横行的省份变成了一支支上行下效的民团。"
 YUN_position_forces_near_liangguang_mission_desc: "$YUN_position_forces_near_liangguang_mission_intro$\n\n要说服两省放下武器来讲道理，需要一支规模庞大的军队——至少数万，甚至超过十万。"
 YUN_liangguang_troop_stationing_mission: "部队驻扎两广"
 YUN_liangguang_troop_stationing_mission_desc: "$YUN_position_forces_near_liangguang_mission_intro$\n\n随着忠于政府的部队进入该地区，许多可能投向叛军的将领已被劝说停止行动。但为了彻底阻止在其核心地带发起叛乱，我们可能不得不延长驻扎时间。"
 YUN_divide_and_conquer_in_hunan_mission: "对湖南分而治之"
 YUN_divide_and_conquer_in_hunan_mission_intro: "湖南与国民党的关系一直错综复杂。这个人口稠密的省份不仅是北洋政府和广州政府之间多年来的主战场，还是三股亲国民党势力的老巢。而自新右派崛起以来，湖南就一直在服从中央政府指示与同情地方派和旧右派运动之间反复横跳。"
 YUN_divide_and_conquer_in_hunan_mission_desc: "$YUN_divide_and_conquer_in_hunan_mission_intro$\n\n但他们始终是我们的一个准附属地区，因此只要秀秀肌肉就足以恐吓那些持观望态度的人，从而让他们站到我们这一侧，如此他们自然能自行解决其余的问题。"
 YUN_Hunan_Divided_and_Conquered_mission: "保持对湖南分而治之"
 YUN_Hunan_Divided_and_Conquered_mission_desc: "$YUN_divide_and_conquer_in_hunan_mission_intro$\n\n我军已占领了该地区，天平已经倾向了我们这边。但我们依然要证明自己不是去过把瘾就走，而是打算长驻下去。"
 YUN_Secure_the_Southwest_mission: "稳固西南"
 YUN_Secure_the_Southwest_mission_intro: "多年以来，滇黔这两个西南省份都是我们的军事中心。在北伐失利后，国民革命军长征至此地，最早便在此开始重整。"
 YUN_Secure_the_Southwest_mission_desc: "$YUN_Secure_the_Southwest_mission_intro$\n\n我们的敌人可能已经忘了，我们与西南地区有着很紧密的联系。该让他们见识一下我们的实力与……热爱了。"
 YUN_The_Southwest_Submits_mission: "西南臣从"
 YUN_The_Southwest_Submits_mission_desc: "$YUN_Secure_the_Southwest_mission_intro$\n\n我们与西南地区联系紧密，而我们已经让我们的敌人长了长教训。不过，为了让这个教训足够深刻，眼下还是要暂且驻守一段时间。"
 YUN_Pass_the_Provisional_Constitution_decision: "通过《训政时期约法》"
 YUN_Pass_the_Provisional_Constitution_decision_desc: "终于，绝大多数国民会议代表都选择支持我们，我们可以在危机中通过我们期待已久的《训政时期约法》。一旦“赞成”的投票源源不断涌来，大多数其余的代表也会选择顺从。张群的统治将合法化，政学系将拥有充足的稳定度，从而能和华南政务委员会和解。"
 YUN_Loyalty_Tests_in_the_Bureaucracy_decision: "官僚忠诚测试"
 YUN_Loyalty_Tests_in_the_Bureaucracy_decision_desc: "国民政府的官僚机构臃肿、任人唯亲，其重点放在对权贵的庇护和对效忠者的奖励，而非行政效率。随着政权内部对这种情况质疑正不断升级，已到了能将政府人员导向我们所要方向之良机。新的公务员队伍应该胜任、勤勉，并且毫无疑问地服从我们的指示！"
 YUN_Promise_a_Constitutional_government_decision: "承诺以宪建政"
 YUN_Promise_a_Constitutional_government_decision_desc: "在一个长期以来被视为落后、暴力和封建的国家中，无论内外都存在着对现代化的呼声。政学系渴望展现其对现代化的承诺——现代工业、现代作风、现代商业文化、现代科技、现代管理。摒弃不必要的传统，翻开新的一页，这是一个艰难却必要的过程。\n\n在胡汉民危机的混乱后，许多人逐渐认知到一点，必须终结军人掌权的专制与反覆，转而建立由文官领导的政府。建立一个现代技官统治、负责任的政府来取代军队主政。即使实现完全民主可能仍为之尚早，但民国的基础必须是法治，而不是党国及其狂热分子。"
 YUN_Release_Political_Prisoners_decision: "释放政治犯"
 YUN_Release_Political_Prisoners_decision_desc: "胡汉民被捕时，有数百名追随者与其一同被捕，未经审判即遭关押。这几年来，许多人也以同样方式被捕，有时是被过度热心的秘密警察以莫须有、生造的罪名指控，有时是被心怀恶意的政敌举报。若想获得新选举出的国民会议中占多数的资产阶级与知识分子的支持，释放这些与他们倾向接近，甚至关系密切的异见人士将是重要一步。这绝非易事，但将是进一步谈判的一个好起点。"
 YUN_Bribe_Miliitary_Officers_decision: "贿赂军队军官"
 YUN_Bribe_Miliitary_Officers_decision_desc: "国民革命军是一支高度政治化的部队，其建军初衷就是为了对党国及其革命信条绝对忠诚。其许多核心部队和军官都是主义的忠实信徒，并深深融入了黄埔系的个人崇拜。然而随着军队扩张，他们很快就被许多从战败或被整合的军阀军队中吸收来部队，以及那些较少受政治训练的新兵所包围。虽然现在才想削弱这支军队的实力可能为时已晚，但透过精心安排的贿赂（包括金钱和晋升方面的贿赂），并利用我们与地方知名军人的关系，或许还来得及阻止那些不那么狂热的军官支持政变。"
 YUN_Call_a_Vote_of_No_Confidence_decision: "发起不信任投票"
 YUN_Call_a_Vote_of_No_Confidence_decision_desc: "政学系政府气数已尽，这一切早该结束了。当奸诈狡猾的张群与两面三刀的杨永泰负隅顽抗之际，我们苦心经营的革命政府正加速走向崩塌。鉴于局势已无可挽回，加之军方明显的不满情绪，我们召集了绝大多数代表，准备就杨永泰及其同伙赖以维持其合法性的《训政时期约法》展开讨论。紧接着我们将发起不信任投票，彻底结束这场闹剧。"
 YUN_Increase_Propaganda_Output_decision: "扩大宣传效果"
 YUN_Increase_Propaganda_Output_decision_desc: "黄埔系有部队，政学系管经济，但只有CC系才能真正掌控民意！通过大范围的大众媒体宣传，并结合全国顶尖思想家和学者的意见，我们才能够点燃民心，启迪民智！我们将以饱满的热情，重燃党的革命激情！"
 YUN_Stoke_Xenophobic_Hysteria_decision: "挑拨排外狂热"
 YUN_Stoke_Xenophobic_Hysteria_decision_desc: "国民党内尽是党奸与外国间谍！工团分子及其同伙从左翼渗透并扭曲我们的革命，而中国银行的财阀与买办则试图从右翼用金钱收买权力！这些奸佞之徒践踏中国人民的意志，玷污本党的精神，妄图将党和国家置于外国控制之下！\n\n张群和杨永泰打着多元化的幌子，广邀社会主义者、自由派、反动派和外国利益团体加入政府，此举只会造成分裂和破坏！政学系很快就要将我们的革命拱手拍卖，把主义贱卖给出价最高者！我们绝不容许其得逞——所有爱国者必须奋起履行责任，阻止社会主义的长靴践踏[ROOT.Capital.GetCapitalVictoryPointName]！"
 YUN_Orchestrate_a_Walkout_of_the_Bureaucracy_decision: "策动官僚机构罢工"
 YUN_Orchestrate_a_Walkout_of_the_Bureaucracy_decision_desc: "新任行政院长杨永泰虽自诩为官僚体系的新主人，实则此人缺少原则，手上的权力更为不堪。杨永泰及其亲信试图渗透戴季陶一手建立的政府，逐步撤换我们任命的官员，并以贿赂和擢升手段安插亲信，在官僚队伍中制造恐慌和混乱。我们岂能坐视如此猖狂行径——陈氏兄弟将策动政府官员集体罢工，使行政机器陷于瘫痪。随着政学系的地位愈发动摇，我们的反击（以及复仇）势在必行，即使是那些骑墙观望之辈亦将迫于形势加入我方阵营。"
 YUN_Mobilise_the_Political_Commissars_decision: "动员政委"
 YUN_Mobilise_the_Political_Commissars_decision_desc: "国民革命军或许是蒋介石一手打造的，但戴季陶和陈果夫亦始终追随其身旁。国民革命军与中国其他军队的不同之处在于，其拥有由党直接挑选、培训的政委，政委会对各部队彻底进行政治训练。我们将利用这层联系，继续将军队与我们以及党国的利益紧紧绑在一起。"
 YUN_The_Whampoa_Coup_mission: "黄埔系政变"
 YUN_The_Whampoa_Coup_mission_desc: "一场巨大的悲剧发生了——我们尊敬的委员长竟被忘恩负义的党逼得辞职，遭胡汉民之流的奸逆取代。国家之存亡取决于坚韧意志与邪恶力量的角力，而这种赤裸裸的分裂和背叛行为，使我们的国家在国际舞台上显得软弱无力。如同过去那些无良的政客一样，本党为了一纸空文而陷入了琐碎的内讧和竞争。如果党不能在合理的期限内解决问题，那么缔造国家的革命军就会亲自动手！"
 YUN_Leverage_Whampoa_Connections_decision: "利用黄埔人脉"
 YUN_Leverage_Whampoa_Connections_decision_desc: "无论过去发生过什么或是将来会发生什么，何应钦都备受人们的崇拜。对许多黄埔昔日的学生和教职员工来说，何应钦永远是黄埔军校的教员领袖之一，也是一位值得尊敬和效仿的革命将领。如今何应钦依然年富力强，但已在中国历史上留下了自己的印记。面对四面楚歌之境，仍有许多人愿意支持他。\n\n§R要想将温和派拉回到他的阵营，就需要采取更礼貌而柔软的手段，这么做可能会妨碍军队的政变计划。§!"
 YUN_Campaign_of_Intimidation_decision: "恐吓行动"
 YUN_Campaign_of_Intimidation_decision_desc: "无论人们是否意识到，国家都已处于战争状态之中。每一天都是关乎国家存亡、民族未来的战役！在这场战争中，我们必须动用一切手段救亡图存——无论是暗杀、午夜逮捕还是大规模监控。唯有通过这种正义的暴力手段，我们的国家才能获得新生。\n\n§R然而，我们必须谨慎行事，恐惧往往会驱使受惊之人倒向任何能保护他们的阵营。§!"
 YUN_Remind_about_Foreign_Threats_decision: "警惕外国威胁"
 YUN_Remind_about_Foreign_Threats_decision_desc: "“日本帝国主义是中国人民不可调和的死敌，我们绝对拒绝妥协和平的可能性。如果本党不驱逐日本帝国主义出中国的话，那么日本帝国主义就会摧毁中国。因此，我们必须保持一种绝对的对敌人的态度，抵抗日本是本党最重要和最神圣的工作。”——《蓝衣社全国纲领》\n\n无论外来帝国主义者声称自己展现了多少“克制”或“妥协”，中国仍始终面临威胁。这种因《训政时期约法》等琐碎无谓之事而产生的分裂，如果得不到真正革命爱国志士的制止，很可能敲响中华文明之丧钟。"
 YUN_Encourage_Military_Disobedience_decision: "号召军方抗命"
 YUN_Encourage_Military_Disobedience_decision_desc: "为何我们的革命今日遭遇挫折？这当然不是因为军队缺乏战斗意志，也不是因为人民缺乏热情，更不是因为中国没有能力成为一个伟大的国家！当下的失败原因与过去几个世纪如出一辙——精英阶层的腐败堕落及其与外国势力的勾结！只要北京的叛徒和上海的窃贼继续把持着我们的政治和经济，新中国就绝无可能诞生。但我们绝不容忍这种情况，也绝不会重蹈覆辙！\n\n号召向来忠诚的国民革命军违抗党的命令虽不光彩，可是当整个党的机器都背叛了革命，我们岂有他路可循？中央执行委员会的那些毒蛇早已忘记，若要践行革命承诺，强大的军队与强力的指导缺一不可。唯有组织群众拒绝执行他们的非法命令，动摇他们的政权，才能真正拯救我们的党和国家！"
 YUN_Negotiate_with_the_SCPC_decision: "与华南政务委员会谈判"
 YUN_Negotiate_with_the_SCPC_decision_desc: "胡汉民的支持者已集结组成华南政务委员会。我们虽成功阻止其进一步争取支持，但他们仍然掌控着党的传统核心地带。我们要么采取行动与之和解（此举定能赢得国大代表们的支持），要么设法破坏这些谈判。"
 YUN_Handle_the_Leftist_Bloc_decision: "应对党内左派"
 YUN_Handle_the_Leftist_Bloc_decision_desc: "党内左派势力构成复杂，囊括了社会主义者、工团主义者、左翼民族主义者及进步派，导致其始终难以形成统一整体。与他们谈判可谓难上加难，往往如同对牛弹琴。然而，面对党内团结堪忧、军中左翼运动兴起的现状，我们或可与左派达成某种权宜之策。"
 YUN_Negotiate_with_the_Dangwai_decision: "与党外人士沟通"
 YUN_Negotiate_with_the_Dangwai_decision_desc: "党外人士指的是获准参与国民党立法程序的各路政治独立人士。为确保[ROOT.Capital.GetCapitalVictoryPointName]立法程序的合法性，当局邀请了大量党外人士参与其中。\n\n党外人士是一个多元化的群体。南方的党外人士大多倾向左翼和进步思想，长期被排除在权力核心之外，他们迫切渴望参与政治决策。北方的党外人士则多为旧北洋政府时期的资深保守派政客，他们早已习惯了政府的频繁更迭，这种政治灵活性固然有用，但也导致他们十分擅长讨价还价。若要维系政府稳定，这两股力量皆需纳入麾下。"
 YUN_Harness_the_Mass_Movement_decision: "利用群众运动"
 YUN_Harness_the_Mass_Movement_decision_desc: "革命的胜利不仅依靠军队与枪炮，更离不开人民及其支持的意愿。尽管宣称代表人民者不在少数，自诩为人民而战者更是多不胜数，但在历经连年战乱与背信弃义后，真正来自群众并能团结人民者却是寥寥无几。"
 YUN.introgame.001.t: "西南的明争暗斗"
 YUN.introgame.001.d: "在一十年代末，权力达到顶峰的唐继尧自诩为“西南王”。他统帅着强大的靖国军，雄踞滇黔二省，并继承了蔡锷的遗志，这些都让他的称号更加稳固。但接下来数年中，这位地方主官受尽了屈辱——他接连遭遇军事政变和战事败北，只能勉强苟延残喘。但能维持如此多年统治也绝非泛泛之辈能做到的，这位工于心计的领导人至今仍在自己位于昆明的宝座上谋划着各种阴谋诡计。\n\n云南最近一次陷入僵局是在1927年。当时唐继尧麾下的将领们短暂地推翻了他的统治，但他位于省府的卫队仍维持着对他的忠诚，使他得以重新掌权。国民党入侵的威胁消失后，一度叛变的将领们纷纷回归，唐继尧再次占据了主导地位，雄踞在昆明老巢统治着云南省。\n\n在唐继尧的北方，掌控着昭通的龙云将军仍然是云南的二号人物：龙云是一位视稳定高于一切的地方派，同时也在1926年的政变中掺了一脚。唐继尧一方面想要压制龙云的影响力，一方面又不能操之过急：他需要一位可靠的指挥官来驻守与贵州的国民党残党的边境，并制衡政变的真正主谋胡若愚。\n\n作为政变最终解决方案的一部分，胡若愚及其同谋张汝骥、李选廷事实上遭到了流放，他们现在代表唐继尧统治着南方的蒙自。而即使在1926年，他们的影响力加在一起也从没能超过唐继尧和龙云。但德国资金从印度支那源源不断地涌入蒙自，再加上胡若愚在国民党战败后恬不知耻地讨好吴佩孚和孙传芳（尽管他也是在二十年代最早欢迎国民党入驻云南的人士之一），他们仍然是云南的一股强大力量。\n\n新年伊始，唐继尧邀请了龙云、胡若愚以及大理的孙渡等三位镇守使来参加几周后举行的会议。"
 YUN.introgame.001.a: "双方肯定能进行富有建设性的对话。"
 YUN.introgame.001_tt: "§R云南的士绅势力不容小觑，而担任二把手的龙云代表了他们的影响力。除非能在日后以某种方式将龙云边缘化，否则唐继尧这位官方“督理”始终面临着被政变推翻的风险。§!"
 YUN.introgame.002.t: "滇黔边境紧张局势"
 YUN.introgame.002.d: "辛亥革命后，云南（简称“滇”）和贵州（简称“黔”）两省始终休戚与共。尽管滇黔两省都推翻了清朝巡抚的统治，但云南的蔡锷在战后巩固统治方面更为成功，并派遣唐继尧前往贵州，协助宪政预备会驱逐了更为激进的自治学社。\n\n自治学社被驱逐后，刘显世掌控了贵州大权。但在唐继尧回到云南担任督军后，刘显世在权力斗争中被外甥王文华废黜。王文华在国民党的支持下，于1920年靠着贵州将领何应钦、谷正伦和朱绍良的帮助发动了政变（史称“民九事变”）。这场流血事件引发了广泛谴责，王文华随后在避居上海期间遭暗杀身亡。\n\n随后，贵州因担忧滇系入侵而陷入了混乱，北洋政府先发制人，资助袁祖铭入黔驱逐了国民党支持的卢焘。至1922年，袁祖铭掌控贵州军政大权，但次年即遭唐继尧胞弟唐继虞率军入侵——唐继虞奉兄长之命欲助刘显世东山再起。唐继虞随后成为贵州督办，却在1925年滇桂战争惨败后被迫撤军。袁祖铭虽曾短暂与唐继尧达成妥协，并在北伐期间勉强依附国民党，最终却见风转舵背叛了革命。\n\n袁祖铭本欲在北伐后重掌贵州，然而天有不测风云。国民革命军虽然战败但并未覆灭，反而自华东发起了一次“长征”，最终控制了贵州西部。唐继尧向来与国民党忽战忽和，此刻却选择静观其变，让国民革命军盘踞黔西自生自灭，并将其作为缓冲地带以阻止直系势力进一步扩张。然而唐继尧很清楚：革命者终究是惹是生非之辈。"
 YUN.introgame.002.a: "有朝一日，我们会重回贵州。"
 YUN.introgame.002.b: "有朝一日，我们会离开贵州。"
 YUN.introgame.002_tt: "§Y目前，滇黔边境防御薄弱，双方势力旗鼓相当。但这种情况可能会迅速改变……§!"
 YUN.introgame.003.t: "华东的反租界浪潮"
 YUN.introgame.003.d: "五省联合最初是南直系在华东扩张的计划，但在北伐战争后，孙传芳将湖南、广东和广西也纳入了自身势力范围。在1929年那场备受争议的选举之后，五省联合于1930年正式扩张为八省联合。这场选举导致张作霖退出了北方的和平谈判，并引发了人们对张作霖和孙传芳结盟，共同反对曹锟、吴佩孚当局裁军和集权提议的担忧。\n\n贵州曾险些被纳入八省联合治下，直系任命的贵州督理袁祖铭极度依赖南直系以及后来湘系军阀的支持，以维系自己在黔东的统治。然而，孙传芳在战间期对抗北方势力时，为了避免激化与川滇军阀的矛盾，最终未将贵州纳入八省联合治下。\n\n不幸的是，孙联帅挑战导师的失败尝试最终导致了他的垮台。庞大的军队、飞涨的开支、根深蒂固的腐败、骇人听闻的暴行以及巨额的外债，这一切严重动摇了孙传芳的统治根基。孙传芳与租界洋人势力（尤其是德国东亚总督监事会）的合作引发了大规模骚乱，在浙赣铁路丑闻爆发后，骚乱更是达到了白热化的程度。\n\n云南向来深谙与外商共处之道。价值连城的锡矿贸易吸引了英、法、日、美以及如今的德国商人涌向云南，而唐继尧则试图在潜在财富与外国剥削之间取得平衡。英法两国的过度扩张曾引发个旧地区的动乱，而唐继尧则利用了这些动乱为自己谋利。即便如此，德国影响力依然巨大，尤其是在蒙自地区。通过对胡若愚的扶植，德商现已主导云南贸易命脉。\n\n在华东，芜湖事变给了新皖系陈调元脱离八省联合的借口。这或许预示着形势即将发生变化？"
 YUN.introgame.003.a: "与八省联合不同的是，我们将与外商建立平等的伙伴关系。"
 YUN.introgame.003.b: "只有当中国收回本属于自己的东西时，外国剥削才会结束！"
 YUN.introgame.004.t: "黑色星期一导致锡矿贸易瘫痪"
 YUN.introgame.004.d: "“黑色星期一”引发了全球经济崩溃，这场灾难将在未来数年内重创各大经济体。对于中国而言，由于美国大萧条导致的贸易萎缩，中国本已举步维艰，而此次危机可能会加剧今年以来的政治动荡。对于严重依赖锡矿贸易的云南而言，德国经济的崩溃更是毁灭性的打击。\n\n几乎所有锡矿出口都经过滇越铁路——这条铁路最初由法国人修建控制，世界大战后被德国人占领，之后又被并入东亚总督监事会旗下。同样，蒙自地区的采矿权曾一度由英法财团控制，如今实际上已被德国人掌控。与法国人如出一辙的是，德国人也利用滇粤两省间交通不便的情况，极力阻碍其他替代铁路的建设，并对滇越铁路收取了高昂的过路费用。\n\n长久以来，人们对外国租界的不满情绪正在不断积聚，近期的一系列事件不仅激发了民族团结意识，也加剧了仇外心理。民族主义和社会主义煽动者（通常隶属于国民党）利用这一时机，呼吁强行夺取外资控制的银行、工厂、矿山和铁路。尽管他们的主张除了复述孙中山几十年前发表的那份含糊不清的《建国大纲》之外往往缺乏具体方案，却仍精准迎合了当下的时代潮流。\n\n对于在云南省府任职的技术官僚来说，推动经济现代化已然刻不容缓。长期以来，云南经济高度依赖锡矿与鸦片贸易，财政厅长马聪曾于二十年代试图在经济危机中推行集中经济与货币改革，却因官僚体系抵制而失败。马聪的继任者缪云台在三十年代取得了更多成功，尤其是在工业化方面，但留给他的时间似乎已经不多了。"
 YUN.introgame.004.a: "这将是一场解放人民、土地和国家的经济革命！"
 YUN.introgame.004.b: "经济改革是挽救局势的良方。"
 YUN.introgame.005.t: "孙传芳在南京遇刺！"
 YUN.introgame.005.d: "孙传芳在南京遇刺，致使八省联合濒临内战边缘。虽然孙传芳尚未殒命，但他的南直系部下们已是虎视眈眈，伺机谋求继任者之位。最主要的竞争者是江苏督理齐燮元和叛逆的安徽督理陈调元，两人均蓄势待发，准备发动政变。\n\n随着国民党领袖在南方采取行动，八省联合各地几乎同时爆发了国民党起义。虽然大多数起义者都与国民党在闽赣根据地或贵州的据点保持着联系，但也有少部分国民党人没有等待上级授权，直接采取了行动。\n\n北京一片混乱，北直系领导人就如何应对危机争执不下，过去十年一直臣服于直系的军阀也迅速脱离了他们的掌控。北方的动乱以及对奉系军阀再次入侵的担忧，导致中央政府陷入了瘫痪，此刻的北京已然群龙无首。\n\n对于贵州国民党军政府来说，下一步的走向显而易见——这或许是他们实现革命承诺的最后机会。趁着北洋当权派分身乏术之际，他们必须尽可能地夺取各省的控制权。然而，对于像唐继尧这样的人来说，当前的形势却让他左右为难。\n\n联省自治运动在二十年代初达到鼎盛，当时的中国不仅陷入南北对峙，更分裂为诸多军阀割据的省域政权。通过和平谈判实现统一的主张虽受改良派知识分子推崇，然在直系军阀武力统一（证明了改良派的错误）之前，联省派便已遭南北政府联手打压而销声匿迹。除了少数南方圈子外，联省主义基本上被斥为不爱国的异端邪说，因此动用武力似乎是在中国实现联省主义的唯一途径。但对唐继尧政府中的地方派而言，在历经数次远征挫败后，滇军出省作战已成违背民意之举。"
 YUN.introgame.005.a: "孙中山的革命必将回归！"
 YUN.introgame.005.b: "联省派的梦想并未破灭！"
 YUN.introgame.006.t: "唐继尧的策略"
 YUN.introgame.006.d: "孙传芳在五省的统治如沙上塔般渐次倒塌，值此之际，八省联合的其他三个省份也经历了类似的动乱。由广东和广西两省组成的两广地区正在陷入全面内战，旧桂系的霸权正受到粤系军阀和国民党侵略者的挑战。\n\n对于唐继尧来说，绝佳良机已然降临——只需他把握时机。直系势力分身乏术、自相残杀，中央政权再度崩溃。四川和两广的邻省军阀正在内讧，湖南亦无力抗衡滇系的行动。贵州（至少贵州西部）已是唾手可得，唐继尧只需肃清盘踞当地的国民党残部——他已经向抵达昆明的指挥官们表达了这一雄心壮志。\n\n唐继尧的野心当然不会止步于贵阳。尽管在更广泛的联省运动于二十年代瓦解后，唐继尧从推崇联省转向了孤立，但他向来惯用武力贯彻意志——早在军阀混战之初，他便已挥师进犯川、黔、粤、桂各省。唐继尧若想真正确立自己作为中国对立政府的合法性，就必须夺取历任南方政权核心所在的广州城。尽管唐继尧先前的尝试因桂军的顽强抵抗而屡屡受挫，但他深信如今的敌军更为孱弱，且滇军已汲取历史教训。\n\n当然，贵州国民党军政府也有类似的想法。不幸的是，国民党领导人内部缺乏团结的问题已然暴露无遗，湖南的程潜将军和广西的李宗仁将军现已率部返回本省。虽然军政府对他们的冒险行为“表示祝福”，但贵州军政府显然无力节制麾下将领，各派系领袖之间更是势同水火。因此，国民党如今只剩两人抵抗唐继尧的猛烈攻势：云南的朱培德将军和贵州的何应钦将军。"
 YUN.introgame.006.a: "今年拿下贵州，明年拿下广州，终有一日拿下全中国！"
 YUN.introgame.006.b: "休想得逞！"
 YUN.introgame.006.a_tt: "§Y你将扮演§f滇系军阀§!。若想成功拿下贵州，就必须打破当前僵局。双方发动攻势都需要时间，我们需要拥有§G至少10000人§!的优势才能确保胜利。§!"
 YUN.introgame.006.b_tt: "§Y你将扮演§c黔省国党§!。若想击退对贵州的进攻并发动反攻，就必须打破当前僵局。双方发动进攻都需要时间，我们需要拥有§G至少10000人§!的优势才能确保胜利。§!"
 YUN.introgame.007.t: "贵州的流亡者"
 YUN.introgame.007.d: "如今的国民革命军残部正驻扎在黔西，国民革命军由国民党建立，宗旨是为党而战，听党指挥。对其中一些人而言，身处贵州是独在异乡为异客，是一段令人不安的流亡之路。但对另一些人而言，前往贵州其实就是回到老家。人们原本期望国民革命军是一支摆脱了地域门户之见的“国民”之军，但事实上，这支由臣服国民党的军阀部队拼凑而成的军队从未真正地满足人们的期望，其官兵依然对自己的故乡颇为忠诚。\n\n1927年1月底，蒋介石趁机重新掌权，他违背了汪精卫的命令，转而指挥自己的部队向西转进广西、贵州和湖南，以等待直军停止进攻，这场撤退后来被称为“长征”。但仅仅一个月后，蒋介石就在南宁遇刺身亡，接下来一年间，效忠于他的国民革命军部队势力不断收缩，最后只能困守贵州。\n\n朱培德接替了蒋介石领导军政府，他麾下的国民革命军第三军主要由云南士兵组成。李宗仁（第七军/广西）、谭延闿（第二军/湖南）、程潜（第六军/湖南）和何应钦（第一军/黄埔）也加入了他的麾下。但持续不断的内斗使国民革命军难以打出贵州，各军指挥官都试图打回各自的家乡，但都收效甚微。\n\n谭延闿早在多年前就在领导层改组中途前往湖南，而现在李宗仁和程潜也分别带领自己的部队主力进军广西和湖南，贵州只剩下了朱培德和何应钦。朱培德曾经在顾品珍与唐继尧的冲突中保持“中立”，但在唐继尧于1922年重新掌权后，他就被困在了广东。之后他将其他流亡的滇军招入旗下，再度对唐继尧构成了威胁。\n\n何应钦曾是蒋介石的副手，并在黄埔军校担任教官，他指挥第一军主要由黄埔毕业生组成。这支部队是最接近国民革命军的全中国之军理念的，但在流亡期间，贵州军官逐渐主导了该军。"
 YUN.introgame.007.a: "只剩下两位将军，应该很容易达成合作吧？"
 YUN.introgame.007.b: "……开玩笑的，这些将军一个比一个难缠。"
 YUN.introgame.008.t: "来自四川的难民"
 YUN.introgame.008.d: "由于被干旱、洪涝和政局动荡同时蹂躏，邻近的四川省发生了大饥荒。四川米价飙升，腐败无能的政府又无法提供大规模救济，于是难民们纷纷涌入邻近省份。与其他省份相比，云南省贫困而多山，因此接收的难民数量较少，但昆明方面还是得知了这些民众的困境。\n\n军阀混战时期，云南和四川间的关系错综复杂。四川省内盘踞着数个相互竞争的军阀势力，因此被称为军阀混战中的军阀混战。护国战争期间，蔡锷为夺取宝贵的盐田而入侵四川，之后十年间，川滇黔三省之间的冲突一直持续不断。\n\n而驻扎在川滇黔三省交界处的熊克武和吕超的军队恐怕是这些冲突留下的最后一批残党。熊吕二人曾经反对过唐继尧，但也不完全属于国民党的圈子，如今滇黔二省冲突一触即发，他们二人也可能成为这场冲突中的不确定因素。"
 YUN.introgame.008.a: "一心消弭旧日恩仇，唐继尧开仓赈粮。"
 YUN.introgame.008.b: "借助熊吕二人之力，国民党占据先机。"
 YUN.introgame.009.t: "确保南翼"
 YUN.introgame.009.d: "唐继尧已前往滇南城市蒙自，与驻扎在那里的将领会面。在负责“戍边”的将领中，最引人注目的当属镇守使胡若愚。胡若愚是唐继尧最初任命的四位镇守使之一，负责镇守蒙自，也是1926年二月政变的幕后主谋。胡若愚曾与同为镇守使的李选廷和张汝骥合谋，积极主张驱逐唐继尧。相较态度犹豫的龙云，胡若愚、李选廷、张汝骥三人与唐继尧结怨尤深。\n\n如果蒙自派没有表示诚意，想必唐继尧督理也不会来此一游。虽然蒙自派已不复鼎盛时期掌控昆明、大理、蒙自三地的盛况，但凭借与印度支那的商贸往来，他们依然相当富裕。蒙自派更因与德国以及八省联合交好，得以维持远超自身能力的庞大军力，并能持续获得外国资金。\n\n然而蒙自派的军队并非仅是为了耀武扬威（或是阻止唐继尧控制自己）。二十年代，滇南曾是大量土匪和叛军（两者的区别十分模糊，往往取决于你站在哪一边）的聚集地。唐继尧曾与部分土匪武装勾结，此事成为了政敌攻讦的把柄，不过国民党也曾试图招募这些土匪。其中一些土匪成功地以“体面”身份退休，例如莫朴投靠唐继尧后摇身一变成了“一等参赞”，王汝为甚至还在胡若愚麾下担任旅长。\n\n唐继尧若想实施自己的计策，就需要争取滇南势力的合作，或者至少在此期间让他们保持顺从。否则，当唐继尧的卫戍部队北上集结对抗国民党之际，昆明可能会再次遭受阴谋威胁。"
 YUN.introgame.009.a: "唐继尧成功说服蒙自派出兵北上昭通。"
 YUN.introgame.009.b: "唐继尧仅能让蒙自派保持中立。"
 YUN.introgame.010.t: "龙云的报告"
 YUN.introgame.010.d: "最初计划进攻贵州时，唐继尧被迫将战前准备工作托付给了昭通镇守使龙云。本周，唐继尧一行来到昭通，亲临现场视察战备情况。\n\n龙云一直在努力建设兵站、调配补给，并为进攻贵州调遣集结部队。历经四个月筹备，龙云的昭通司令部已呈现一派繁忙景象。在与唐继尧的会晤中，龙将军表示进攻所需的基础战备工作现已就绪。\n\n然而，龙云也提醒道，省界对面的国民党并非毫无准备。在注意到滇军集结部队后，国民革命军军政府也已开始调兵遣将，构筑防御工事，并征募当地民众入伍，突袭良机早已丧失。\n\n唐继尧督理和他最得力将领之间的关系一直十分紧张，尽管两人都避而不谈。这种紧张关系源于1925年的滇桂战争，当时龙云率部在进军广东的途中成功攻占了广西。然而，与国民党结盟的新桂系发动了决定性的反攻，将龙云的部队包围在城内，并最终迫使其投降。负责保护龙云侧翼的唐继虞部未能及时赶来解围，一些人指责唐继虞忙于在贵州购买鸦片，导致唐继虞部赶到后也被打得溃不成军。\n\n唐继尧为庇护胞弟战败之责，便将张汝骥当做替罪羊，这成为了次年政变的重要原因。唐继尧和唐继虞均与贵州关系密切，唐继虞曾在1923年领导了入侵占领贵州的行动，这让他预期自己会再次带兵入黔。然而，龙云却认为最终会由自己负责此次入黔作战。"
 YUN.introgame.010.a: "当然是由龙云来指挥这次进攻。"
 YUN.introgame.010.b: "把权力交给叛徒只会招致进一步的背叛。"
 YUN.introgame.011.t: "湘系军阀入侵贵州"
 YUN.introgame.011.HNN_ruled_by_KMT: "滇黔两省的关系很难称得上友好，卷入辛亥革命的贵州迅速成为革命派、反革命派、宪政派和地方军阀的战场。刘显世、任可澄派使者联系蔡锷后，唐继尧旋即代表蔡锷发兵贵州。在刘显世策应下，唐继尧政变推翻贵州军政机构，于1912年出任贵州都督。掌握大权后，唐继尧于1913年返滇就任云南都督，转而将贵州权柄交予刘显世。\n\n被迫参与护国战争后，刘显世逐步培植起黔系中的旧兴义系势力。凭借姻亲关系，刘显世的外甥王文华、王伯群，以及王文华的妹夫何应钦相继跻身权力核心，并于1920年策划了“民九事变”。随着刘显世被迫下野及后续内斗加剧，王文华最终遭袁祖铭遣刺客暗杀，而幕后主使正是刘显世本人。\n\n1923年，袁祖铭将卢焘逐出贵州后，随即也被唐继虞驱逐，遂投身四川军阀混战并依附直系。1924年与唐继尧达成和解后，袁祖铭于1925年复任贵州督理，但期间仍持续参与川省内战，将政务多委予部下王天培、彭汉章、周西成等人。1926年遭刘湘、杨森联合驱逐后，袁祖铭辗转投靠旧湘系，继而参与北伐战争。\n\n到1927年，贵州分裂为两部分：名义上归属滇系军阀的国民党控制区，以及受北京政府支持的北洋系控制区。随着国民党近日罢黜赵恒惕、击溃旧黔系势力，王天培、卢焘等人提出异议，致使湖南当局拒绝将其控制的贵州区域移交何应钦。于是乎，边界争端竟导致国民革命军在贵州省内爆发内斗，这般出人意料的情势或许能为云南自身的角逐有所助益。"
 YUN.introgame.011.HNN_ruled_by_non_KMT: "滇黔两省的关系很难称得上友好，卷入辛亥革命的贵州迅速成为革命派、反革命派、宪政派和地方军阀的战场。刘显世、任可澄派使者联系蔡锷后，唐继尧旋即代表蔡锷发兵贵州。在刘显世策应下，唐继尧政变推翻贵州军政机构，于1912年出任贵州都督。掌握大权后，唐继尧于1913年返滇就任云南都督，转而将贵州权柄交予刘显世。\n\n被迫参与护国战争后，刘显世逐步培植起黔系中的旧兴义系势力。凭借姻亲关系，刘显世的外甥王文华、王伯群，以及王文华的妹夫何应钦相继跻身权力核心，并于1920年策划了“民九事变”。随着刘显世被迫下野及后续内斗加剧，王文华最终遭袁祖铭遣刺客暗杀，而幕后主使正是刘显世本人。\n\n1923年，袁祖铭将卢焘逐出贵州后，随即也被唐继虞驱逐，遂投身四川军阀混战并依附直系。1924年与唐继尧达成和解后，袁祖铭于1925年复任贵州督理，但期间仍持续参与川省内战，将政务多委予部下王天培、彭汉章、周西成等人。1926年遭刘湘、杨森联合驱逐后，袁祖铭辗转投靠旧湘系，继而参与北伐战争。\n\n到1927年，贵州分裂为两部分：名义上归属滇系军阀的国民党控制区，以及受北京政府支持的北洋系控制区。旧日矛盾重燃之际，袁祖铭与周西成不顾唐继尧对刘显潜的支持，执意争夺贵州统治权。然而也有幕僚建议唐继尧可暂与袁祖铭合作，待时机成熟再反戈一击。"
 YUN.introgame.011.a: "何应钦与卢焘达成了临时协议。"
 YUN.introgame.011.b: "与湖南的紧张局势让国民党军队无暇顾及省界。"
 YUN.introgame.011.c: "滇系要拿下贵州何须袁祖铭。"
 YUN.introgame.012.t: "知识分子介入争论"
 YUN.introgame.012.d: "对于云南和贵州的知识分子来说，各派对这场迫在眉睫的冲突看法不一。滇黔两省都经历了“改良派”和“革命派”的分裂，并且都因争夺本省控制权而爆发了武装冲突。这反映了南方共和运动正面临着更广泛的分裂：革命民族主义者逐渐倒向国民党阵营，改良派则倾向于联省主义，或重新调整方向与北洋政府和解。\n\n知识精英们纷纷卷入了这场斗争，许多回国的学生和学者加入了国民党和其他社会主义组织，另一些人则捍卫更趋改良的纲领。这些“笔杆子”的影响力虽然不如“枪杆子”那般强大，但对相互竞争的军阀和革命领袖来说，他们却是政权合法性的关键支柱。此外，考虑到知识分子在官僚机构以及省市商会等机构中的影响力，作为一个整体的文人阶层实际上构成了军阀体系中不可或缺的组成部分。\n\n对于那些追寻意识形态立场坚定领袖的知识分子而言，西南地区的领导人无疑令人失望。无论是像唐继尧这样的联省派，还是像孙中山这样的国民党领导人，都因为实用主义和个人立场的转变而在不同的政治立场之间摇摆不定。事实上，自世界大战结束以来，全球格局已然发生了剧变，诸多新思想正如雨后春笋般从废墟中涌现。\n\n当形势需要时，这些领袖及其追随者甚至会动用极其残忍的手段：唐继尧重新掌权后，曾将政敌顾品珍枭首示众；孙中山也曾因卫队被遣散，亲自调遣炮舰轰击莫荣新官邸。\n\n虽然国民党和滇系军阀可以依靠各路忠于自己的报纸、演说家和作家的支持，但由于合法性在中国极为珍贵难得，因此最终还是要由中间派来决定结果。"
 YUN.introgame.012.a: "省级自治、民主制度和改良主义最终获得胜利。"
 YUN.introgame.012.b: "民族主义、民权主义和民生主义才是强力信条。"
 YUN.introgame.013.t: "凛冬将至"
 YUN.introgame.013.d: "纵观历史，即使是最强大的军队，也难免会受到变幻莫测的天气影响。中国西南地区的气候相对温和，但冬季的山区却异常寒冷，难以通行。然而尤为重要的是，唐继尧已下令在今年年底前发动一场战役——这位督理对其统一大业有着极其严格的时间表。\n\n前线战备仍在紧锣密鼓地进行。对国民党来说，冬季的到来为固守阵地抵御来犯之敌提供了巨大的优势，但即使他们能顶住最初的猛烈攻势，统一南方的时间窗口也已所剩无几。虽然军政府领导层现已下令进一步动员，但十月的稻谷收割导致双方民兵纷纷返乡，目前正缓慢地陆续返回前线。\n\n局势持续紧张，前线部队几无喘息之机。昭通的滇军司令部今晨收到昆明发来的重要电报：月底将对贵阳发动进攻。与此同时，国民革命军似乎另有锦囊妙计……"
 YUN.introgame.013.a: "滇军加紧准备。"
 YUN.introgame.013.b: "国民革命军设下埋伏。"
 YUN.introgame.013_tt: "§R如果不能在一个月内果断解决滇黔僵局，那么接下来的进攻成功概率实际上将由随机几率决定！§!"
 YUN.introgame.050.t: "联络贵州"
 YUN.introgame.050.d: "北伐失败后最大的奇迹（或者说灾难），当属国民革命军长征进入贵州。虽然蒋介石遇刺前夕下令发起的长征耗费了大量的人力、物力和补给，但最终却让国民党右派政权得以保全。长征结束后，国民革命军成立了一个五人军政府，由第三军军长朱培德代理总司令，其他成员包括第一军军长何应钦、第七军军长李宗仁、第二军军长谭延闿和第六军军长程潜。\n\n由于权力斗争和先前的紧张关系，贵州国民党势力范围内的军队在三十年代进行了整编，谭延闿第二军被编入程潜第六军，谭延闿本人则归隐长沙。与此同时，范石生部和金汉鼎第十六军也被解散编入第三军。\n\n李宗仁率领第七军开进两广，意图控制广西，致使其麾下驻黔部队大多撤离。但关键的是，一些重要的第七军后勤部队仍留在贵州，以维持军政府与那些精于权谋的冒险家之间的联系。面对资源有限且落脚点现已稳固的局面，黄绍竑与黄旭初提出将贵州境内所有第七军留守人员调往广西，以巩固李宗仁在两广地区的势力。\n\n然而，如此一来可能会使贵州剩余国民党部队在与敌对滇系军阀的战斗中遭遇失败，因此贵州军政府领导人恳求李宗仁共享两军的补给线。更具争议的是，新桂系提出了从双方共有补给中独占物资的想法，并声称这是“应得之份额”。虽然新桂系此举会削弱军政府的战备力量，但军政府失败的命运或许早已注定。"
 YUN.introgame.050.a: "第七军全部撤离贵州。"
 YUN.introgame.050.b: "李宗仁的补给线仍然对贵州国民党开放。"
 YUN.introgame.050.c: "新桂系拿走了属于他们的那一份库存。"
 YUN.introgame.051.t: "我们在云南的部队"
 YUN.introgame.051.d: "北伐失败后最大的奇迹（或者说灾难），当属国民革命军长征进入贵州。虽然蒋介石遇刺前夕下令发起的长征耗费了大量的人力、物力和补给，但最终却让国民党右派政权得以保全。长征结束后，国民革命军成立了一个五人军政府，由第三军军长朱培德代理总司令，其他成员包括第一军军长何应钦、第七军军长李宗仁、第二军军长谭延闿和第六军军长程潜。\n\n由于权力斗争和先前的紧张关系，贵州国民党势力范围内的军队在三十年代进行了整编，谭延闿第二军被编入程潜第六军，谭延闿本人则归隐长沙。与此同时，范石生部和金汉鼎第十六军也被解散编入第三军。\n\n虽然程潜现已率领第六军主力部队离黔入湘，但一些关键的后勤人员仍留在贵州，以确保通往邻省的补给线畅通无阻。在落脚点逐渐稳固后，一些总部参谋建议程潜将留守贵州的人员全部撤出。反对者则认为留守部队应按兵不动，以继续密切监视贵州军政府的一举一动。\n\n叶琪等军官则一直主张全力确保湖南战线，即便此举最终可能会占用贵州军政府的资源。在叶琪等人看来，历来问题重重的军政府迟早会垮台，若继续受其牵制，必将拖累整个革命事业。"
 YUN.introgame.051.a: "让留守部队按兵不动以保持补给线畅通。"
 YUN.introgame.051.b: "命令我军留守部队按计划进入湖南。"
 YUN.introgame.051.c: "遗憾的是，程潜将巩固湖南作为头等要事。"
 YUN.introgame.052.t: "来自[FROM.GetAdjective]边境对面的国民党补给"
 YUN.introgame.052.d: "看来，云南干涉邻省政治的恶果已经显现，来自邻近湘桂两省的物资现已经抵达贵州，周边省份领导人对此无能为力或不愿阻拦。云南长年纵容国民党重整军备之举，同样使得国民党将领得以趁着八省联合衰微之际渗透其他省份。\n\n随着国民革命军一路推进，一条连接贵州与[FROM.GetNonIdeologyName]的双向补给线正在逐渐巩固。由于大部分活动都发生在滇黔边境的另一侧，导致云南当局几乎没有任何便捷的应对办法。一些人提议采取极端措施，例如雇佣土匪民团来破坏这些补给线，希望这些袭击至少能将国民革命军限制在省界的另一侧。"
 YUN.introgame.052.a: "若不想引火烧身，我们最好不要过问。"
 YUN.introgame.052.b: "可以让一些朋友替我们出手……"
 YUN.introgame.053.t: "[FROM.GetAdjective]国民革命军的背叛！"
 YUN.introgame.053.d: "事态发生了相当荒唐的转折：国民革命军中最近撤离的[FROM.GetAdjective]部队似乎完全抛弃了革命兄弟情谊和国民革命的利害关系。即便这些部队的指挥官深知国民党贵州军政府所处的危急处境，但他们仍从共有补给中征调了“额外”物资，此举削弱了我们对抗滇系军阀的力量。最终，我方只能采取强制征税来弥补损失，或者干脆放任不管，专注于对抗滇系军阀的斗争。"
 YUN.introgame.053.a: "只能希望他们能够明白事理。"
 YUN.introgame.053.b: "非常时期必须采取非常手段。"
 YUN.introgame.060.t: "我们在滇黔两省的利益"
 YUN.introgame.060.d: "随着滇黔斗争的全面展开，邻近省份的危急局势引起了革命领袖熊克武和吕超的密切关注。贵州国民党虽然表面上支持熊克武和吕超的努力，但实际上却开始与熊克武的意识形态盟友（而非私人盟友）——联省派唐继尧发生冲突。身为国民党新桂系成员的吕超立场则更为鲜明，曾多次主张全力支援贵州国民党。然而，由于熊克武过去曾被国民党监禁，他的立场已经开始动摇。由于得到了众多幕僚和追随者的支持，四川革命者可以灵活地选择支持哪一方。"
 YUN.introgame.060.a: "吕超成功说服盟友支持国民党。"
 YUN.introgame.060.b: "熊克武不情愿地支持西南联省主义。"
 YUN.introgame.060.c: "熊克武和吕超同意暂时保持中立。"
 YUN.introgame.061.t: "实业团与国民党兄弟情"
 YUN.introgame.061.d: "看来，云南干涉邻省政治的恶果已经显现，来自长期战乱的四川省的物资现已涌入云南前线。尽管云南历来通过各种方式影响四川，但在军阀混战时期，滇系最终被熊克武赶出了四川。如今，作为贵州国民党军政府的势力延伸，一支寒酸的窃居者盘踞在川黔边境。看来国民党四川地方分支实业团依然秉持着坚定革命立场。作为孙中山的正统追随者和新桂系成员，吕超动员了自己派系的力量，支持国民党军政府对抗云南。"
 YUN.introgame.061.a: "这支身心俱疲的部队还能有何作为？"
 YUN.introgame.061.b: "袭击实业团的车队，把他们赶走。"
 YUN.introgame.062.t: "省域联省主义与四川模式"
 YUN.introgame.062.d: "看来，云南干涉邻省政治的恶果已经显现，来自长期战乱的四川省的物资现已涌入云南前线。尽管云南历来通过各种方式影响四川，但在军阀混战时期，滇系最终被熊克武赶出了四川。如今，作为贵州国民党军政府的势力延伸，一支寒酸的窃居者盘踞在川黔边境。看来熊克武已经履行了自己的联省主义承诺，为唐继尧的滇系军阀提供了物资。考虑到川滇两省领袖之间积怨甚深，这无疑令人颇感意外。"
 YUN.introgame.062.a: "熊克武如履薄冰。"
 YUN.introgame.062.b: "在边境拦截联省派的物资。"
 YUN.introgame.065.t: "西南边陲斗争中的左派"
 YUN.introgame.065.d: "闽赣根据地并非北伐失败后国民党革命力量的唯一残余，在千里之外的贵州省，也曾有过类似的斗争，甚至不少人认为贵州的斗争更为成功。贵州国民党军政府自称是国民革命军的真正继承者，在诸多方面继承了先总司令蒋介石的遗志，但军政府的部分领导人名义上已向胡汉民的莫斯科委员会宣誓效忠。闽赣根据地由国民革命军第四、第八军将士的牺牲所缔造，而贵州国民党则继承了其他几支国民革命军的血脉。\n\n尽管人们认为两支国民党残部存在某种革命上的同源性，但贵州国民党却转向了右派，并采取了强硬的反工团主义立场。贵州国民党指责左派推行外来意识形态，并采取了灾难性的第三国际统一战线政策，因此对[ROOT.GetLeader]的任何诚意都心存警惕。\n\n尽管摆出种种姿态，但贵州军政府内部仍然有相当数量的左派，尤其是在国民革命军第三军，第一军中也有少量左派。在朱德、陈诚等将领的庇护下，贵州左派与闽赣根据地保持着脆弱的联络渠道，但只获得了上级的有限认可。随着军政府与滇系军阀展开对峙，朱德及其第三军中的左派集团请求我们授权，支持他们与右派建立统一战线。"
 YUN.introgame.065.a: "朱德及其部下如今应支持朱培德。"
 YUN.introgame.065.b: "右派可不会感激我们。"
 YUN.introgame.066.t: "闽赣根据地支持与贵州合作"
 YUN.introgame.066.d: "如果你觉得贵州国民党的处境已经很糟糕了，那么只需穿过湖南省，便会发现闽赣根据地的局势更为严峻。虽然闽赣的左派起义军四面受敌，被迫在南直系核心地带苦战，但他们却已坚持抗争了近十年。\n\n虽然贵州残余的左派势力仍与闽赣根据地保持着脆弱的沟通渠道，但除了一些共同的走私路线外，双方仍未达成实质性合作。朱德等将领参与这类秘密谈判已是公开的秘密，尽管他坚称自己仍效忠于至交同窗朱培德。\n\n朱德已告知了朱培德自己的工作成果：闽赣根据地领导层已正式命令所有党内干部在即将与唐继尧爆发的冲突中服从军政府的命令。此举表面虽为慷慨示好，实则暗示贵州当局仍然受制于左派中央委员会，延续着党内团结的幻象。然而当下局势已无退路：若贵州失守，左派和右派都将被彻底摧毁。"
 YUN.introgame.066.a: "尽管存在分歧，但左右两派须团结共抗唐继尧。"
 YUN.introgame.066.b: "必须彻查这些叛徒通信！"
 YUN.introgame.070.t: "滇黔对决中的德国利益"
 YUN.introgame.070.d: "德国在东南亚的殖民事业几乎全盘承接了先前法国投资的遗产，中华文化圈内的事务也同样如此。殖民事业与滇黔两省的政治发展息息相关，曾经的法国殖民政府（如今的德国殖民政府）现已忙得不可开交。面对迫在眉睫的殖民骚动，以及山东半岛和八省联合领内危机四伏的态势，诸多德国在华利益正陷入岌岌可危的境地。\n\n然而，在紧邻边境的云南一省，德国的利益尚能维系。德国人曾不温不火地支持唐继尧巩固其在西南的立足点，如今这位自诩为“西南王”的将领正与贵州国民党残部展开一场争夺西南各省的血腥对决。虽然这场冲突与我们无关，但蒙自镇守使胡若愚的中间人已请求我方提供更多武器，以协助巡逻并清剿危害滇南锡矿贸易的“匪患”。“匪患”一词除了指代传统的盗匪（历史上在滇南地区确有活动）外，也经常被用来暗指社会主义叛军，这些叛军无疑受到了北方国民党活动的鼓舞，并且很可能与我们殖民地的印度支那革命者有联系。\n\n援助胡若愚将军，能为我们的直接利益提供一些即时保障，同时还能让唐继尧督理腾出兵力处理内陆事务。虽然唐继尧和胡若愚远非可靠盟友，但国民党革命者不仅表面上更具敌意，而且还贪得无厌。二者若联手，将严重威胁德国的金融利益。"
 YUN.introgame.070.a: "为胡若愚提供额外资金。"
 YUN.introgame.070.b: "目前我们没空担心云南的问题。"
 YUN.introgame.071.t: "来自新加坡的援助"
 YUN.introgame.071.d: "世界大战结束后，新加坡方面继承了法国对云南的影响力。随着昆明和贵阳准备进行决定中国西南地区命运的最终决战，云南的紧张局势日益加剧，新加坡对此深感担忧。尽管唐继尧的行动主要依靠德国支持，但新加坡担心这位“云南王”的势力会过度膨胀，因此选择间接支持他。与之对应，由于胡若愚将军近期请求德方援助以镇压骚扰云南锡矿贸易的“土匪”，德国反而向他提供了更多武器。\n\n蒙自派实力增强使唐继尧得以将更多兵力投入到入侵贵州，而非巡逻剿匪，但这位督理却毫不信任胡若愚将军。事实上，胡将军曾在1927年密谋罢免唐继尧的督理之位，险些得逞。尽管胡若愚表面上默许唐继尧继续统治云南，但这位联省派将军深知，胡若愚正在虎视眈眈，随时准备趁虚而入。\n\n唐继尧督理陷入了进退两难的境地——他问鼎中原的雄心壮志始于将贵州重新纳入联省派阵营，但他也绝不能容忍自己阵营之外年轻气盛的将军动摇自己苦心维系二十载的脆弱政权。一方面，唐继尧公开感谢柏林协助其政府镇压匪患；另一方面，当他对着困局思量再三时，私下里却对所谓的援助感到不满。"
 YUN.introgame.071.a: "这让我们能腾出手向北增派更多军队。"
 YUN.introgame.071.b: "我们得盯紧胡若愚将军。"
 YUN.introgame.080.t: "滇黔冲突失利"
 YUN.introgame.080.d: "尽管我们在滇黔冲突中为贵州军政府投入甚巨，但我们在滇黔权力争斗中压下的赌注却最终竹篮打水一场空。无论是因为遭遇伏击、被土匪抢夺，还是彼此不信任，我们的资金和物资几乎都没能送达贵州军政府手中。我们的所作所为广受批评，要重新组织起来需要极长的时间，最终政府内的许多人都对插手滇黔对决失去了兴趣，至少在不久的未来是如此。"
 YUN.introgame.080.a: "他们只能依靠自己了。"
 YUN.introgame.081.t: "滇黔冲突失利"
 YUN.introgame.081.d: "尽管我们在滇黔冲突中为滇系军阀投入甚巨，但我们在滇黔权力争斗中压下的赌注却最终竹篮打水一场空。无论是因为遭遇伏击、被土匪抢夺，还是被腐败官员私吞，我们的资金和物资几乎都没能送达滇系军阀手中。我们的所作所为广受批评，要重新组织起来需要极长的时间，最终政府内的许多人都对插手滇黔对决失去了兴趣，至少在不久的未来是如此。"
 YUN.introgame.081.a: "让我们从中抽身吧。"
 YUN.introgame.100.t: "深秋攻势"
 YUN.introgame.100.d: "沙漏流尽，大局已定。眼见滇军备战迟缓，尤其是面对实力远逊于己的贵州之敌，急不可耐的唐继尧遂下令全线进攻。随着滇军不断地向国民革命军前哨阵地发起试探性进攻，整条前线硝烟四起。\n\n战争迷雾笼罩着双方的最高统帅部。虽然双方都精心制定了作战计划，连最微小的细节也被标记在地图上，但在两军士兵交火，以及奇袭和反制方案暴露后，一切精密部署都已化作泡影。随着战火席卷前线和后方，所有士兵（他们更忠于袍泽之情与直属长官，而非名义上的统帅）都被迫面临抉择：哪一方更有可能获胜并支付自己的军饷？\n\n西南地区的命运将在未来数日揭晓。尽管目前局势仍未明朗，但显而易见的是，漫长的对峙与无法打破的僵局已酿成一场血战：对亟需保存精锐部队实力的双方而言，这无疑是毁灭性的结局。无论最终胜负如何，形势都不容乐观。"
 YUN.introgame.100.a: "无论如何，我们都将取得胜利。"
 YUN.introgame.101.t: "滇军攻占贵州"
 YUN.introgame.101.d: "经过艰苦的攻势，滇军的战备和云南陆军讲武学校的纪律收获了回报。虽然起初进展缓慢，但局势随后开始逆转，滇军得以迅速推进，国民革命军的前沿阵地相继被攻克，国民党的撤退迅速演变为溃败。\n\n当滇军进抵国民党腹地时，贵州之战实际上已经告终。大多数国民党民团要么缴械投降，要么临阵倒戈，要么遁入乡间——解甲归乡再无踪迹。虽然国民党正规军原计划在贵阳负隅顽抗，但随着部队彻底溃散并迅速被包围，胜负已成定局。\n\n国民党军政府领导层也同样要么流亡，要么转入地下，国民党在西南地区东山再起的希望至此彻底破灭。唐继尧如今是无可争议西南之主，但仍有许多问题悬而未决。"
 YUN.introgame.101.a: "让我们开启统一的下一阶段！"
 YUN.introgame.102.t: "昭通事变"
 YUN.introgame.102.d: "局势风云突变，国民革命军掌握了主动权，并充分利用了这一优势。国民革命军凭借训练有素的精准行动、民族主义热情以及彰显党国气魄的坚韧意志，先诱敌深入，让滇军放松警惕，随后便发动了猛烈的反攻。\n\n国民革命军精锐部队利用精妙部署的间谍和英勇侦察兵，突袭了滇军的薄弱环节。国民党渗透者的破坏和前线的大规模叛逃给滇军后方造成了严重破坏，滇军精锐部队很快便被重重包围。\n\n恐慌的消息传到昆明后，唐继尧决定亲自赶赴昭通指挥局势。然而，当唐继尧抵达滇军司令部时，他的卫队却遭到了龙云部下的伏击并被缴械——这无疑是一次重大背叛。当天傍晚，国民党代表团抵达昆明接受滇军投降，胡若愚也从蒙自发来电报，承认国民党新政府。"
 YUN.introgame.102.a: "我们很快便会抵达昆明。"
 YUN.earlygame.000.t: "武力干预主义的传统"
 YUN.earlygame.000.d: "滇军的情况极其糟糕，表现在兵卒的士气和武备质量都每况愈下。罗佩金主政四川期间从成都兵工厂送来的老式步枪杯水车薪，如今也早已停止运输，而经华南港口运来的日本枪械也只能说聊胜于无。炮队的情状同样恶劣——靖国军的克虏伯山炮早已废弃或是毁坏，而训练所需的实弹和空包弹也十分短缺，导致炮手长期生疏。\n\n因此，阅兵或是虚荣的巡行大行其道，真正的野战演练却被弃若敝屣，而这对新兵的提高战斗水平毫无裨益。滇军的骑兵同样因为身处云贵高原而疏于训练、纪律涣散。他们的马匹在轻微冲突中就会惊慌失措、一溃千里。而既没有训练有素的马匹、也没有车辆就意味着滇军几乎没有运输部队。而在西南，辎重往往就是胜败的关键。\n\n尽管如此，昆明方面还是保留着实力强大、纪律严明的声誉——人们的印象里还是那支训练精锐、不畏强敌、破釜沉舟的军队形象。无疑，这得益于云南陆军讲武堂（云南陆军讲武学校）的传承。然而，这种精神在如今以唐继尧派和唐继尧的弟弟唐继虞为主的滇军高级指挥部中消失无踪。靖国军的一般士兵素质也参差不齐——老兵易于领导，但是欠缺智慧和主动性；而新兵则更是训练不足、纪律涣散、缺乏动力。滇军被武力干预主义与内部争权夺利撕裂，只能寄希望于有朝一日能够重振雄风。"
 YUN.earlygame.000.a: "路漫漫其修远兮。"
 YUN.earlygame.001.t_kmt: "复兴黄埔军校"
 YUN.earlygame.001.t_nokmt: "扩大昆明军校"
 YUN.earlygame.001.intro: "位于昆明的云南陆军讲武堂（云南陆军讲武学校，即昆明军校）在我们新军的成立上功不可没。过去护国军的成功与这里所教导的奉献精神、兄弟情谊和大公无私密不可分。诸如蔡锷、杨杰、何应钦、李根源、李烈钧和唐继尧等伟大的革命斗士都曾在此处任教。云南讲武堂底蕴深厚，也为联省、国民党两大革命运动培养了许多人才。\n\n云南讲武堂旨在效仿日本人对天皇的忠诚，培养一批对中华与共和忠心耿耿的武士阶层。因此，学校的课纲也深受日本陆军士官学校影响——也有一部分原因是，早期的一批教师都是陆士毕业生。该校遵循管教一体的原则，官僚作风浓厚，但行事又十分认真。校内教职工和学生人数虽少，但都是精英，同时每个人都被鼓励直接向校长咨询问题。然而，遗憾的是，学校今不如昔。要想让这所名校焕发新生，就要有一位新校长来执掌航线，为其再次注入已然丧失的灵魂。\n\n"
 YUN.earlygame.001.d_kmtsatellite: "$YUN.earlygame.001.intro$在[ROOT.GetLeader]的要求下，当局挑出了三位候补人选来担任这个要职。第一位是建校元老李根源，他会监督本校真正回归那些被当代人所嘲弄的建校原则。第二位是雄才大略的朱德，他在众人口中有神童之美誉，也是蔡锷的门徒之一。他曾在军校任职，而在此后几年也进行过广博的军事研究。然而，他也是云南左派同情者的领袖，可能会激怒许多保守分子。在上述人物之外，胡若愚默认是第三位候补人，他是本校毕业生，也曾在唐继尧手下出任过校长，与当局建制有着千丝万缕的联系。"
 YUN.earlygame.001.d_kmt: "$YUN.earlygame.001.intro$当前最直接的人选是何应钦，他曾与王文华一起管理贵州讲武堂，后来先是在昆明担任教务长，之后又出任黄埔军校总教官这一至关重要的职位。第二个人选则是CC系推举的王柏龄。王柏龄曾于1925年担任黄埔军校教育长，北伐失败后因战绩不佳而退休，然而迫于陈果夫的压力，他还是主动加入了角逐——这让何应钦非常不满。最后一个人选是政学系推举的建校元老李根源。这位蔡锷时代的老将对革命理想和尚武精神矢志不渝，但李根源的政治立场让他在少壮派中备受冷遇。"
 YUN.earlygame.001.d_fed: "$YUN.earlygame.001.intro$\n\n根据评估，我们已遴选出三位在军事教育领域最具影响力的候选人。考虑到这一职位实际上会导致学生同时忠于校长和[ROOT.GetLeader]，因此最具吸引力的选择自然是重新启用唐继虞。唐继虞在政治上没有野心且易于操控，同时高度依赖于兄长，能够有效地扩大[ROOT.GetLeader]的影响力。至于另外两位候选人——胡若愚和龙云，他们虽与旧友和上司关系疏远，但二人均拥有出色的军政才干，并且都曾担任军校校长之职，必能恪尽职守。然而胡若愚和龙云对[ROOT.GetLeader]的评价并不尽如人意。"
 YUN.earlygame.001.d_npa: "$YUN.earlygame.001.intro$\n\n根据评估，我们已遴选出两位在军事教育领域最具影响力的候选人。考虑到这一职位实际上会导致学生同时忠于校长和督理，因此候选人自然是云南最有影响力的两位人物——胡若愚和龙云。两人各有千秋，都曾就读于军校，后来又都在唐继尧治下出任军校校长。然而，他们真正的实力在于各自的独特优势：胡若愚在政界人脉广泛，而龙云则是素以可靠著称的军人兼指挥官。"
 YUN.earlygame.001.a: "何应钦才略可堪此任。"
 YUN.earlygame.001.b: "王柏龄可谓老骥伏枥！"
 YUN.earlygame.001.c: "把昆明军校交还给建校元老。"
 YUN.earlygame.001.e: "我们都得靠朱德的帅才！"
 YUN.earlygame.001.f: "胡若愚可以缓和保守派的紧张态势。"
 YUN.earlygame.001.g: "龙云真乃雄才大略之士！"
 YUN.earlygame.001.h: "所谓同气连枝，选唐继虞。"
 YUN.earlygame.002.t: "滇军之魂"
 YUN.earlygame.002.d: "昆明军校（云南讲武堂）的立校之本在于作为中华文明最后堡垒的信念，和守护民族精神昂扬不灭的志向。为实现此志，昆明军校全面推行军事化教育体系，也是首批将军事技能纳入更广泛教育课程的国内军事院校之一。通过军校教育和普及义务兵役制度，昆明军校旨在云南人民心中培养一种战斗精神，使其即便面对国家最严峻的挑战，仍能立于不败之地。\n\n具体来说，昆明军校的课程设置与保定军校等学校有所不同——昆明军校更注重战备工作、体能训练和实战演习。昆明军校的大多数教员来自云南本地，其中也有来自陆军士官学校的日本教员（云南的大部分军校教员都毕业于日本陆军士官学校）。昆明军校的学生分为三个班：甲班为校级及以下的现役军官；乙班为临时巡防队军官；丙班为从民间或军校招募的有志军官。课程内容包括国文、伦理、器械画、步兵操典、阵中勤务令等。\n\n随着昆明军校迈入新时代，军中参谋内部掀起了一场关于革命时期黄埔军校对新昆明军校影响的讨论——因为党国的课程设置更加注重培养士兵的尚武精神，以及对革命和国家的绝对忠诚。然而，批评者和守旧派却担心，融合黄埔教育会损害昆明军校的实力和特色，最好还是保持原有路线。"
 YUN.earlygame.002.a: "在诸多军校中，黄埔堪称一颗璀璨明珠。"
 YUN.earlygame.002.b: "当前课程不是让我们赢得了护国战争吗？"
 YUN.earlygame.003.t: "群众爱戴的入侵者"
 YUN.earlygame.003.d: "经过多年来的精心努力，滇军在当地民众心中树立起了井然有序、士气高昂、纪律严明，与百姓打交道时彬彬有礼的形象，这与粗暴的北洋军队截然不同。这一切都要归功于滇军制定的群众纪律，主要内容包括对待百姓的态度、日常举止及卫生习惯等方面，并由军官负责监督执行。\n\n与军阀时代那些在军营外为所欲为的普通士兵不同的是，滇军新兵被要求行为举止都要恭敬克制，这种价值观让滇军与北方和东部的对手相比如同云泥之别。滇军各级军官均严厉禁止各类道德堕落行为——包括吸食鸦片、嫖娼宿妓、滥赌酗酒等恶习。\n\n通过实施服役期间的行为规范制度，滇军确保了官兵队伍道德纪律普遍达标，尽管在违反纪律时遭受的惩罚力度以及规则执行的严厉程度方面标准不一。\n\n当靖国军改革议题再度提上日程后，军中迅速掀起了关于行为准则必要性的争论，许多人声称这些规章制度削弱了军官们原本多元的职能。与之相反的是，职业化军队的倡导者们则继续推动滇军传承其为国家、人民和事业奉献的精神。"
 YUN.earlygame.003.a: "必须捍卫滇军的声誉！"
 YUN.earlygame.003.b: "这些繁文缛节削弱了军官们的重要作用。"
 YUN.earlygame.004.t: "速攻之灵魂"
 YUN.earlygame.004.d: "在制定切实可行的制胜战略时，指挥官必须将自己在军校学到的战略理论与中国的军事、政治和经济现实相结合。从民国初年起，两种战争模式开始出现：一种适用于内陆战争，另一种适用于沿海战争。这两种战争模式因地理、后勤、现代武器装备和通信方式的不同而有所差异，但总体而言，两种战略的共同战略目标都是夺取关键的交通枢纽，例如控制主要河流、山口以及铁路和公路网络的交通要地。\n\n与内陆地区相比，华东地区拥有更为完善的基础设施，通信网络与铁路运输更为发达。这些网络使得部队和装备的调动和运输更加高效，由此导致关键交通枢纽成为了兵家必争之地，并直接决定了战场的规模与选址。随着现代武器装备的不断改进，华东战事变得愈发激烈，致使战场沦为了绞肉机。\n\n但内陆地区的铁路、公路均十分匮乏，云南公路总长429公里，广东却有3926公里。因此，内陆作战虽然同样以夺取交通枢纽为战略重心，却不得不依赖于内河运输，进而导致军队兵力分散，重型装备匮乏，侦察能力有限，协同作战十分困难。\n\n在这些限制之下，军事决策层二十多年来始终偏好采取果敢积极的策略，但随着内陆工业化的缓慢推进，这种行动在扭转战局方面已变得越发无用，其所带来的风险甚至足以颠覆整个政权——1926年的唐继尧政权便险些因此倾覆。"
 YUN.earlygame.004.a: "兵贵神速！"
 YUN.earlygame.004.b: "北伐之败已经证明，冒进是行不通的。"
 YUN.earlygame.005.t: "军人精神"
 YUN.earlygame.005.d: "昆明军校（云南讲武堂）的创始人致力于在学生心中灌输共和革命和武士道精神，并打造出一个能够决定中华民族未来的职业军人阶层。为此，新昆明军校再次以严格纪律约束全体学生，并严禁自私自利、个人主义的恶习，包括纳妾、赌博、吸毒、妒忌长官等。现任校长曾多次强调“武士道”精神，以及精神教育在培养黄埔师生特殊情谊纽带方面发挥的重要作用。\n\n这种精神本身就代表着中国职业军人精神的巅峰。只有职业化、军事化、民族主义的军人才能理解民族国家的方向，这是他们才能承担的职责。由于在民族国家事务上拥有卓越的能力，新的护国军渴望在士兵中保持一定程度的精神优越感也就不足为奇了。\n\n然而，更多秉持文官统治思想的官员却谴责将军人奉为偶像的做法，并认为正是这种思维导致中国当前深陷军人铁腕统治的窒息状态。然而也有人提出了反驳，并指出即便军人主导国家方向是不争的事实，但也不能忽视大多数人缺乏从政所需知识和精神的现状，因此对昆明军校学生进行精神教育只是一种矫正措施罢了。"
 YUN.earlygame.005.a: "只有军人知道什么是对的！"
 YUN.earlygame.005.b: "正是这种想法让军阀得利！"
 YUN.earlygame.006.t: "历届云南航空学员"
 YUN.earlygame.006.intro: "1922年12月25日，在唐继尧的倡议下，云南航空学校第一期正式开学，30名学生全部编入航空学员队，与云南陆军讲武学校第十七期学员一同训练。1923年4月，唐继尧批准招收四名朝鲜学生，分别是李英茂、张志日、李纯，以及第一位女飞行员权基玉。\n\n云南航空学校实行两年制学制，其中包含六个月军事训练及一年半航空专业培训。自1922年至1935年办校期间，共开设四个飞行班和两个机械班，飞行科毕业生142名（含13名女飞行员），机械科毕业生100名。\n\n1935年第四期30名学员毕业后，为了跟上时代步伐，云南航空学校设立了新班级，并开始在云南省内外大规模招生。与此同时，复办的航校向历届师生广发招聘信函，但反响较为平淡。"
 YUN.earlygame.006.d_kmt: "$YUN.earlygame.006.intro$\n\n然而对国民党而言最关键的，当属两位家世显赫且胆识过人的飞行学员的奋斗精神。陈其美之子陈宪甫、戴季陶之子戴安国相继应募入学。这些革命元勋子弟投身国民革命大业的热忱，正是其家族对国民革命坚定决心的明证。"
 YUN.earlygame.006.d_nokmt: "$YUN.earlygame.006.intro$\n\n随着第五批学员的正式入学，许多高层领导都希望云南航校能够成为与保定航校相媲美的中国航空人才摇篮。"
 YUN.earlygame.006.a: "祝愿这些勇敢的飞行员一飞冲天！"
 YUN.earlygame.007.t: "巫家坝的光荣历史"
 YUN.earlygame.007.d: "巫家坝位于昆明市东南四公里处的滇池北岸。这里原本是一片荒草丛生的荒地，连地名都没有。后来，一户巫姓人家来到此地开垦并定居，逐渐发展成了一个村子，有了“巫家村”的之名。在多山的云南，人们习惯称那些被群山环绕的平地为“坝子”，因此，巫家村所在的平地也就被昆明人称为“巫家坝”。\n\n时间来到近代，清朝时期，昆明城外的巫家坝平地被赈济局征用以修建炮兵营房，巫家坝成为一座拥有1137座营房的大型操练场。辛亥革命时，蔡锷和李根源率领云南的革命军在巫家坝军营发动“重九起义”，推翻清政府对云南的统治，巫家坝成为革命军的大本营。\n\n1922年，唐继尧强迫巫家坝周边的村民迁离，并将军营改建为机场。机场竣工后，唐继尧从德国驻越南空军手中买了30架旧战斗机和15架旧教练机，组建了云南第一支空中力量。巫家坝机场也成为当时亚洲大陆最早的航空训练机场，培养了一批飞行人才。\n\n即使与阎锡山、陆荣廷等同样锐意进取的军阀政权相比，云南的航空事业也相当令人瞩目，其成就堪比中央政府的航空事业。"
 YUN.earlygame.007.a: "中国空军的真正诞生地！"
 YUN.earlygame.008.t: "处境尴尬的云南讲武堂系海军"
 YUN.earlygame.008.d: "在我们新近控制海岸线后，流亡云南的海军将领们终于有机会一展雄才大略。这些将领以欧阳格为中心，试图建立自己的海军学院。该学院（被冠以“电雷学校”之名）虽然表面上是云南陆军讲武学校的一个分支，但不隶属于任何独立的海军部门，而是直接受云南讲武堂管辖。该学院因教职员多为云南讲武堂出身，因此又被称为“海军里的云南讲武堂”。\n\n这些新毕业生组成了所谓的“电雷系”，并在中国海军派系中占据了一席之地。然而广东海军派系将电雷系视为自己地盘上的外来者，并联合起来反对电雷系。他们不承认欧阳格和电雷系毕业生的海军军衔，实际上将电雷系限制在云南势力范围内的指挥机构里。\n\n更有甚者，海军闽系试图阻挠电雷系学员穿着海军制服。据报道，他们曾骚扰身穿海军制服的电雷系学员。"
 YUN.earlygame.008.a: "必须确保海军控制权！"
 YUN.earlygame.008.b: "这是对真正海员的侵犯！"
 YUN.earlygame.009.t: "殖民政权的云南事务"
 YUN.earlygame.009.d: "云南与印度支那边境的边防人员以及沿滇越铁路出行的人们纷纷报告，一系列神秘的货物正在离开云南边界，消失在印度支那的密林瘴气之中。这些货物很可能是[YUN.GetLeader]提供给殖民地抵抗力量的，旨在将我们的政府驱逐出云南边境，最终使我们失去对云南资源的垄断。\n\n但是，这种情况也有可能仅仅是由于云南官员办事不力，没搞清楚他们的货物最终流向了哪里。尽管如此，许多官员还是建议[ROOT.GetLeader]彻底切断殖民地与云南之间的所有贸易，这不仅可以摧毁脆弱的云南经济，还能中断货物运输。\n\n然而其他人则认为，断绝贸易可能会进一步加剧紧张局势，而且云南当局是否支持印支国大党并不重要，毕竟印支国大党永远无法在战场上击败德国海军。"
 YUN.earlygame.009.a: "岂有此理！立即实行禁运！"
 YUN.earlygame.009.b: "我们不能继续激怒[YUN.GetLeader]。"
 YUN.earlygame.040.t: "俄罗斯军事顾问"
 YUN.earlygame.040.d: "为了实现军队现代化，我们成功说服俄罗斯政府派遣军事顾问，协助我们打造一支按照俄罗斯模式构建的军队。俄军利用俄罗斯内战中的经验总结提出了“纵深作战”理念，希望俄方能将这一理念传授给我们。\n\n事实上，旧黄埔军校正是红俄流亡者的帮助下起步的，如今我们的这批新顾问虽然出身白军军官，但他们崇尚培养忠于祖国的军人、塑造敢于血战到底的军官团——这般理念与我们一脉相承。\n\n开启俄方与[ROOT.GetLeader]政府合作新纪元的，是科尔尼洛夫突击团的老兵彼得·冯·格拉泽纳普。格拉泽纳普不问政治而专精军务，曾作为科尔尼洛夫与邓尼金参谋部成员深度参与了俄军的最新改革。他深谙如何从零开始组建军队，必将成为我们的无价助力。\n\n陪同格拉泽纳普一同前来的是格奥尔基·埃尔芬格伦，他与科尔尼洛夫和萨文科夫关系密切。埃尔芬格伦扮演着军人兼外交官的角色，强调意识形态在精锐部队中的重要性，擅长运用其丰富的非对称作战经验组织针对优势之敌的游击破袭行动。与此同时，弗谢沃洛德·伊万诺夫则是一位能力出众的骑兵军官，提倡总体战思维，强调大众宣传的重要性，并且拥有在基建落后地区的丰富作战经验。\n\n虽然俄军顾问们基本不涉足中国内部政务，但他们都已开始有效地融入昆明军校（云南讲武堂）的架构，他们的专业知识有助于进一步巩固我们的军事方向，并有可能在世界舞台上开启新的伙伴关系。俄军顾问为我军的发展方向带来了许多有益的理念。"
 YUN.earlygame.040.a: "磨炼战略方可凯旋而归！"
 YUN.earlygame.040.b: "精锐军队铺就胜利之路！"
 YUN.earlygame.040.c: "全民动员才能取得胜利！"
 YUN.earlygame.050.t: "军队政治化的边界"
 YUN.earlygame.050.d: "滇军昔日的成功，主要归功于其独立于政治影响的传统官僚组织，这让滇军保持着一种“不涉政”的军事主义。滇军在对战役的战略和政治目标始终保持清醒认知的同时，还能像精密运转的机器般执行军事行动。随着党军体制的崛起，军政合一以及革命忠诚催生狂热精神的优势已经显露无遗。随着政治日益渗透军事领域，党内的文职派系已开始尝试将其影响力扩展到军事指挥系统。\n\n第一位请求委任军职的候选人是政学系的张群。张群曾是蒋介石的同学和参谋，最近才转入文职。然而，在当前的危急关头，他再次请求奔赴前线。\n\n第二位被推出的候选人是CC系的陈果夫。陈果夫同样参加过辛亥革命，此后便退居二线担任准军事职务，负责为黄埔军校招揽人才。虽然CC系处心积虑的谋划外界知之甚少，但如果陈果夫成功当选，他们将把影响力渗透到党内唯一尚未掌控的领域——军队。\n\n最后，值得关注的是蓝衣社这一特例。蓝衣社虽已深度涉入军务，却仍要求任命刘健群担任军职。作为蓝衣社的首席理论家，刘健群几乎没有实际服役经历，而是主要担任参谋或政治职务，如何应钦的机要秘书。\n\n无论如何，以上任命都遭到了顾祝同和卫立煌等国民革命军元勋的强烈反对，他们痛斥这些政客的卑劣行径玷污了军事艺术。"
 YUN.earlygame.050.a: "他们证明了自己的忠诚！"
 YUN.earlygame.050.b: "还请诸位安守文职本分。"
 YUN.earlygame.051.t: "先烈之血"
 YUN.earlygame.051.d: "中国的革命斗争史虽然艰辛漫长，却正是无数爱国志士为民族救亡不懈奋斗的象征。从辛亥革命前的先驱起义，到辛亥革命本身，再到护法运动、护国战争和北伐战争，中国的革命先烈前仆后继、不计其数，我们的宏伟事业正是建立在先烈们的累累白骨之上。然而，即便深知现实残酷，我们英勇的将士仍将为革命事业舍弃希望、梦想以及一切珍视之物。\n\n这一点在烈士们的遗书中体现得最为鲜明，尤其是年轻的蔡光举。蔡光举于1925年为国民革命事业捐躯，在壮烈牺牲的前一天，他给哥哥写下了这封遗书。\n\n“吾兄钧鉴：明日一战，弟恐难生还。母亲哺育之恩、兄长手足之情、挚友相助之义，永志不忘。然今日之责，当以三民主义为重，为四万万同胞谋，非为私亲故旧计。每思及古往今来成仁先烈，常觉愧怍无地。故明日当竭尽绵力，以身殉主义，方不负平生之志。”\n\n真正的战士当血战到底——蔡光举这般的故事，早已融入国民革命军的魂脉。然而，党内一些人仍然对完全释放人民的力量犹豫不决，害怕这会演变成毫无意义的死亡崇拜。"
 YUN.earlygame.051.a: "前方还会有更多流血牺牲。"
 YUN.earlygame.051.b: "伟大的灵魂，但也不应过度崇拜。"
 YUN.earlygame.052.t: "国民革命军的阴影下"
 YUN.earlygame.052.d: "国民革命军的根源可追溯至建军之初种种困境。孙中山先生因无力掌控驻粤滇军等所谓的“盟友”，从而决心建立一支真正忠诚的军队，一支忠于党和革命、而非忠于背信弃义的地方领导人的军队。黄埔军校成立后，由于当时的国民革命军规模较小，装备和人力都十分匮乏，这导致国民革命军愈发依靠果断的机动作战，以避免同时与多支敌军交锋，最终形成了一套“速战速决”的学说。\n\n国民革命军的战术注重军队的机动性、组织性、凝聚力和适应性，出其不意的策略在北伐之初蒋总司令指挥的湘赣两省战场上发挥了关键作用。毕竟战斗时间越长，耗费的宝贵资源就越多。\n\n尽管如此，采用此类军事理论的呼声在滇军高层中仍遭到了抵制和反对，许多人认为北伐战争和武汉惨败正是此类冒险战略弊端的明证。此外，由于国民革命军的运动战术尚未在云南的高山深谷中得到检验，加之滇军规模庞大且训练不足，该理论几乎不可能取得成功，反而会进一步加剧现有问题。然而，年轻的军事革新派和理论家们仍然坚信，新的训练计划、意识形态灌输和军官决策能力的提升正是滇军在新运动战时代蓬勃发展所需要的。狭路相逢勇者胜。"
 YUN.earlygame.052.a: "黄埔精神永存！"
 YUN.earlygame.052.b: "护国军凭借协同获胜。"
 YUN.earlygame.053.t: "棉湖战役纪念日"
 YUN.earlygame.053.d: "棉湖战役是国民革命军建军初期最重要的战役之一，被誉为黄埔精神的奠基。1925年2月，国民党为驱逐陈炯明发动第一次东征，东征联军包括刘震寰指挥的桂军、杨希闵指挥的驻粤滇军、何应钦与王柏龄指挥的新成立的黄埔教导团，以及许崇智指挥的粤军。\n\n滇军和桂军迅速占领了大片土地并击败了洪兆麟部，但之后却驻足不前，导致黄埔校军不得不以三千多人的兵力面对两万多的精锐部队。在与林虎部士兵的激烈战斗中，黄埔校军取得了辉煌的胜利，此役黄埔校军伤亡惨重，但依然表现出了坚韧不拔的精神，大大提升了新生的国民革命军的士气，而教导团也成为了日后国民革命军第一军的基础。\n\n何应钦最近带领参加过棉湖战役的老兵们举行了一场集会，会上，他强调了这场胜利的重要性，并赞颂了他们取胜的方式。据报道，何应钦称此役为革命的关键，并呼吁要复兴“黄埔精神”。顾祝同也对自己上峰的观点表示了赞同，他表示，牺牲精神是取得东征胜利和日后国民革命军成功的关键因素。\n\n尽管这一说法得到了黄埔老兵的支持，但金汉鼎、范石生等驻粤滇军成员以及文官派系却在试图淡化棉湖战役的重要性，并指责钱大钧、何应钦、顾祝同等人是在崇拜一种导致北伐失败的精神。"
 YUN.earlygame.053.a: "黄埔精神的真正诞生地。"
 YUN.earlygame.053.b: "黄埔精神也救不了北伐。"
 YUN.earlygame.054.t: "中国军队战略总览"
 YUN.earlygame.054.d: "若论滇军的军事思想，有三位巨擘为其战略奠基人。第一位是云南陆军讲武学校的创始人李根源，他是滇军官僚体制中大公无私的军事主义幕后推手。第二位是蔡锷。蔡锷之名如雷贯耳，他在云南最危急时刻领导滇军，先后击溃了袁世凯、川军以及任何敢于对抗护国军的势力。最后一位是唐继尧，虽然他经常被诟病为庸碌之辈，但他尽最大努力保全了靖国军的灵魂和功绩。尽管唐继尧的努力不无意义，怎奈靖国军气数已尽。\n\n以上三人中的第二位——蔡锷，或许是中国近代最伟大的军事战术家和战略家之一。蔡锷是一位造诣极高的军史学者和战略家，也是中国版“诱敌深入”战略的创始人。他十分重视波亚人（布尔人）对抗英国人以及俄国人对抗拿破仑的经验。他认为，中国疆域广袤，因此可以放弃部分土地，同时发动持续袭扰，最终在时机成熟时展开反击。\n\n然而，一些军方高层，比如黄埔系强硬派何应钦、顾祝同和滕杰，却不同意蔡锷的观点。他们坚信，现代中国无论面临何种处境，都必须具备与任何帝国主义列强正面抗衡的实力。"
 YUN.earlygame.054.a: "蔡锷说得对，辽阔的神州大地将吞没敌人。"
 YUN.earlygame.054.b: "进攻才是中国精神的最佳体现！"
 YUN.earlygame.055.t: "战后会议"
 YUN.earlygame.055.d: "作为我军新军事理论的奠基者，朱德着重强调了他所设想的“战后会议”制度在训练和教育层面的关键价值。在会上，全体指战员将齐心协力，共同分析近期的战役和战斗。所有与会者都可以参与讨论或批评战役和战斗计划，也可以批评个别指挥员和士兵的作战行为，并对未来作战计划提出质疑和批评。\n\n在这些会议上，主持会议的将领会亲自向官兵讲解更广泛的政治和军事形势，让他们明晰整体态势。朱德认为，这样做是为了保持军队的“民主”。如此一来，便可以在全军上下平等共享信息。\n\n朱德利用这些会议来纠正错误，淘汰无能的指挥官，并根据功绩提拔人才。他认为这些会议对军队具有极高的教育和技术价值，并计划将其成果编印成小册子，作为士兵的学习资料发行。\n\n军中较为保守的高级将领刘峙、关麟征和何应钦则提出了反对意见，他们认为此类会议可能导致指挥官因士兵对其不满而被罢免，并被冠以“无能”之名。实际上，士兵只是对上级的战略缺乏信心，或是欠缺贯彻执行的决心。"
 YUN.earlygame.055.a: "此类会议必将扰乱指挥结构！"
 YUN.earlygame.055.b: "若想成功就需要适度的反思。"
 YUN.earlygame.056.t: "指挥所统一规范"
 YUN.earlygame.056.d: "训练与教导对滇军和国民革命军的成功至关重要，但在军阀部队中却常被忽视。朱德在为官兵制定系统化训练方案的同时，也开始倡导采用西方新近发展起来的军事理论和体系。朱德严谨细致的军事训练和教学方法，在他向军队发布的各项指令中得到了充分体现——“如何考核官兵”、“如何选拔和教育新兵”、“如何提高体能和射击水平”等等，不一而足。\n\n然而，其中一份名为“如何确定晋升标准”的指令引发了强烈不满。朱德在该指令中设计了一套考核体系，用于评估官兵晋升资格、确定军中任职岗位及审批调任申请。同时，他还建立了完善的官兵正规教育体系，并指定专门机构采用新引进的道尔顿制实施考核。\n\n可惜的是，来自国民革命军保守派指挥官（如蒋鼎文、李根源和顾祝同）的强烈抵制带来了问题，他们担心这项指令会侵犯自己任命亲信的权利。但陈诚和滕杰等少壮派则表示支持，认为这有助于实现“唯才是举”的治军理念。"
 YUN.earlygame.056.a: "真正的国民革命军靠功绩出彩！"
 YUN.earlygame.056.b: "管好你自己的事情吧，朱德同志。"
 YUN.earlygame.057.t: "新国民革命军的战略与战术"
 YUN.earlygame.057.d: "基于朱德、陈毅、唐淮源等人的战略理论，新的国民革命军越来越重视速度和机动性，并将之视为确保胜利的最大优势。他们主张在条件最有利时才与实力更强大的敌军交战。由于意识到国民革命军部队将成为任何敌军的优先攻击目标，指挥员们主张将红军部队集中到国民党控制区纵深的复杂地形中，以诱敌深入。\n\n由于敌军通常以缺乏协调的方式推进，例如沿着分散的路线，穿越崎岖的地形，并在陌生的地域前行，这使得他们很容易成为针对孤立部队进行突袭的理想目标。在战术层面，这种战略需要各地村庄建立地方游击队；而在战役层面，则需要国民革命军部队实施跨越多个省份的大范围机动。这种创新性战略在闽赣根据地得到了初步运用，并被证明是行之有效的。\n\n然而，此类战略遭到了党内多方的反对，包括文职部门和军方。文职干部担心，敌军如此深入国民党控制区，将对经济、人口和地方机构造成重大损害；而军方强硬派则担心，如果国民革命军自己的部队最终被包围，任何战略收益都将化为乌有。"
 YUN.earlygame.057.a: "挺有意思，不过很不实用。"
 YUN.earlygame.057.b: "这是击败强敌的唯一方法！"
 YUN.earlygame.058.t: "新国民革命军的原则"
 YUN.earlygame.058.d: "在概述国民革命军的改革方案时，朱德为全军制定了一套理论原则。递交给[ROOT.GetLeader]的文件里，就是以这句标语开头的：“离开理论的实践，是盲目的实践；离开实践的理论，是空洞的理论。”朱德认为，尽管国民革命军作战经验丰富，但却缺乏总体的理论和战术知识。军队必须通过理论和实践的学习来提高水平。在理论与实践中，朱德总结出了一套经验方法，并作如下阐述：\n\n第一、事物是变动的，情况是迁移的，决不容有一成不变的老章法来指挥军队。\n第二、无论大兵团、小部队，在进攻中每一动作，都要选定主要突击方向而集中其最大兵力在这一方向来决战。其他次等方向只留出可以箝制敌人的兵力。\n第三、一般说来，战略要寻找敌人的主力，战术要寻找敌人的弱点。战斗的完全胜利，是由许多小的胜利总合起来的。\n第四、要求得大兵团协同动作，一定要每个兵团、每个部队在受领本身任务时，明了首长决心的要旨，以及本身的任务在首长决心中占何等地位。\n第五、侦察的主要任务，是弄清敌情、地形，但指挥员不能因侦察而迟疑徘徊，放弃良机。\n第六、如处在敌人几个纵队的夹击或包围地位，则应求得内弧幅员较宽，周旋容易。\n\n抛开政治立场，这些原则得到了大部分指挥官的认可。剩下少数坚持不退让者也是李根源、金汉鼎这样的老顽固。他们担心在革命的关键阶段进行尝试的风险太大，不过也承认未来再付实践仍是有裨益的。"
 YUN.earlygame.058.a: "革命军队，战无不胜！"
 YUN.earlygame.058.b: "现在可不是试新方法的时候。"
 YUN.earlygame.059.t: "党军的进攻目标"
 YUN.earlygame.059.d: "朱德在阐述新军事原则的基础上，进一步对军队目标进行了革新和反思。他自然从进攻目标着手，最终推导出国民革命军在进攻战略上的三大直接目标：党的存续、领土扩张和歼灭敌军有生力量。\n\n在阐述党的存续时，朱德澄清说，他有意将党和军队等同使用，因为没有党就没有军队，没有军队就没有党。这表明军队比[ROOT.Capital.GetCapitalVictoryPointName]当局本身更难取代。此外，战争的根本法则本身就在是消灭敌人的同时保存自己。\n\n在领土扩张方面，朱德希望维护并扩大国民革命军控制的地理“根据地”。他指出，这些根据地在功能上应相互独立，只在各自所属的地区发挥影响力。\n\n最后，关于歼灭敌军有生力量，朱德解释道，歼灭敌军并不一定意味着杀死敌人，而是像克劳塞维茨所指出的那样，让敌方无法继续阻碍我军。\n\n朱德再次遭遇了黄埔系的强烈反对，刘峙、何应钦和顾祝同极力反对建立独立“根据地”的想法，并断言此类组织终将沦为地方军阀的工具。"
 YUN.earlygame.059.a: "士兵们是为了生存而战，而非更伟大的事业！"
 YUN.earlygame.059.b: "各部队的独立性是确保军队生存的关键。"
 YUN.earlygame.060.t: "党军的防御目标"
 YUN.earlygame.060.d: "尽管遭到反对，但朱德还是坚持完成了他的战略纲要。不过此次他更加侧重于防御，并由此为国民革命军找到了一种新的作战方式。\n\n防御作战应当首先聚焦于保卫根据地或军事指挥中枢、抵御敌军入侵，并实现三个重要目标：保卫设防阵地、保存己方兵力、全歼或部分歼灭敌军。\n\n在后撤至设防阵地的过程中，国民革命军应机动至有利地形，争取时间准备军事物资并集中兵力。敌军追击越远，其补给和通讯线路就越脆弱，士气也越低落。一旦时机成熟，应迅速、果断地发起反击。\n\n最具争议的是，朱德拒绝承认“战略要地”这一概念，所谓的战略要地，通常指城市、古迹、具有文化或政治意义的地区。相反，他主张最大限度地控制一个地区的全部领土。\n\n如此说法，自然引起了党内、军内乃至文职人员的担忧。杨永泰、宋子文等文官的反对声音尤其强烈，李根源、刘峙、关麟征等人也对此表示谴责，并指出放弃城市将严重扰乱经济秩序，但陈诚及其土木系对朱德的务实态度表示了象征性的支持。"
 YUN.earlygame.060.a: "这是我们无法承受的危险策略。"
 YUN.earlygame.060.b: "这是我们战胜强敌的唯一方法。"
 YUN.earlygame.061.t_kmt: "对何应钦的事后批评"
 YUN.earlygame.061.t_kmtsatellite: "对朱培德的事后批评"
 YUN.earlygame.061.intro: "在持续推进官兵战后会议制度的过程中，朱德最近主持了一场颇具争议的会议，其中大量讨论聚焦于委员长在战场和政治各方面的表现。\n\n"
 YUN.earlygame.061.d_kmt: "$YUN.earlygame.061.intro$针对何应钦，朱德批评了何应钦第一军在北伐初期进展缓慢，收复失地有限，致使浙江省的党政控制发展滞后。尤其是在德军占领广州后，何应钦的第一军南下发起了为期两周却徒劳无功的反攻，朱德据此进一步指出第一军对围攻广州准备不足是他们犯下的致命失误。\n\n朱德的批评愈发尖锐，并将何应钦与先总司令蒋介石进行比较。尽管何应钦表面上是蒋介石的亲信和好友，却仍在1926年支持了推翻蒋介石的行动，如今更无法像他的前任那样，对国民革命军拥有同样的号召力和掌控力。\n\n何应钦对此深感震惊，在他看来，朱德此举相当粗鲁无礼，是对一名优秀军人应有追求的攻击抹黑。他随即发起了反击，指责朱德将军队政治化，向工团分子敞开大门，并受制于懦弱的汪精卫之流。"
 YUN.earlygame.061.d_kmtsatellite: "$YUN.earlygame.061.intro$尽管被并称为云南讲武堂“模范二朱”的朱德和朱培德素有袍泽之谊乃至私交甚笃，但朱德如今却对他的上司朱培德颇有微词。北伐战争期间，国民革命军屡次被孙传芳麾下的南直系部队击败，朱德据此指责朱培德为罪魁祸首。朱德甚至进一步损害了朱培德的声誉，指责朱培德在政治事务处理上无能，且无力掌控国民革命军内部各派势力。这主要是因为朱培德是贵州国民革命军名义上的最高统帅兼总司令，但他的影响力显然仅限于自己麾下第三军的一部分，与他平起平坐的还有何应钦、李宗仁、程潜和谭延闿等人。\n\n尽管朱培德为人正直，但昔日同窗好友的批评，还是彻底击碎了他与朱德和睦共处的最后一丝幻想。朱培德也反过来批评朱德在北伐时见死不救，屡屡自夸为蔡锷接班人，还妄图充当云南国民党内的左派领袖。"
 YUN.earlygame.061.a: "他的话有一定道理。"
 YUN.earlygame.061.b: "这是明目张胆的政治操弄！"
 YUN.earlygame.200.t: "柏林的回应"
 YUN.earlygame.200.d: "清朝末年，中国大部分地区被瓜分成了各个列强的经济势力范围。东北先是沦为俄国的势力范围，后来又落入日本手中，而云南则被法国控制。清朝覆灭后，军阀混战时期到来，各派军阀都争相寻求外国的支持。段祺瑞和旧皖系与日本勾结，几乎完全依赖日本的财政和军事援助。\n\n沈阳的老帅张作霖也曾与日本接触，但奉系雄厚的经济基础使他得以周旋于各大列强之间。蔡锷主政云南期间推行军事化进程，力图以武力实现统一，然而云南地处边陲，滇系的军事野心始终受制于巴黎——昆明唯一的武器供应方。当法兰西共和国爆发革命、德国接管法属印度支那后，柏林不仅取代了法国在云南的经济主导地位，同时也取代法国成为了昆明唯一的武器供应方。\n\n柏林的对华政策使得北京与德国利益更加密切后，为限制滇军武装，德国对唐继尧的军火输送日渐减少。除了唐继尧的扩张野心外，云南当局清剿中越边境土匪不力亦引起柏林不满。然随着直系霸权的瓦解，德国在华利益遭受严重威胁。唐继尧督理遂承诺将运用德制武器肃清匪患、维护中国西南的德国利益，以此安抚柏林方面的忧虑……"
 YUN.earlygame.200.a: "真不敢相信这招竟然奏效了！"
 YUN.earlygame.201.t: "锡矿与铁路"
 YUN.earlygame.201.d: "云南省贫穷落后，经济仍以农业为主，但该省的自然资源丰富。当法国人开始殖民中国西南部时，他们立即推动了云南的开放通商，并在云南和广西建立了蒙自、蔓耗和龙州等据点。甲午战争结束后，法国获取了广州湾的租借权，以及更大的铁路权和采矿权。法国人随后又修建了昆明到海防的滇越铁路。\n\n滇越铁路的修筑推动了巴黎下达的现代化议程，同时极大地促进了法属印度支那和昆明之间的交通，尤其是个旧到鸡街段铁路的修建，极大地增加了法国殖民地的出口额并带来了巨额利润。在铁路建成之前，个旧的出口量从未超过四千吨，但从铁路建成两年后一直到法国革命，个旧的出口量每年都超过了一万吨。虽然这条铁路除了出口收入之外并不算特别有利可图，但其带来的好处足以使巴黎慷慨投资。\n\n在滇越铁路建成之前，法国人要依赖中间商才能进行锡矿贸易，但滇越铁路使这些中间商瞬间失业，让所有商业利益都流入了印度支那殖民政府手中。虽然德国的印度支那殖民地政府在巩固控制方面不算成功，但柏林和巴黎一样对资源开采颇感兴趣，并一直完全控制着滇越铁路。尽管云南的未来方向仍存在争议，但所有人都一致同意，必须打破德国人在云南外贸中的主导地位。"
 YUN.earlygame.201.a: "总有一天我们将会自由……"
 YUN.earlygame.202.t: "财务困难的历史"
 YUN.earlygame.202.d: "19世纪的云南不仅从未富饶繁荣，反而遭受了持续不断的摧残。1855年，曾两次肆虐全球的黑死病席卷云南，持续十五年之久，导致数百万人死亡。此后不久，云南又陷入了由回族领导人杜文秀发动的起义，伤亡总数达百万之众。人口锐减导致矿业衰退，进而引发货币贬值，最终致使盗匪猖獗。回民起义后，汉回关系依然紧张，由于英国支持杜文秀，导致当地民众普遍不信任外国人。高涨的排外情绪最终导致一名英国公民被杀，而这可能是由云南省府授意的，该事件促使英国重启1858年《天津条约》的修订谈判。\n\n修订后的《天津条约》允许伦敦当局扩大从缅甸到云南的贸易，并租借部分边境地区，这进一步激起了排外情绪。法国人开始入侵越南时，越南政府曾聘请中国雇佣兵抵抗法军。虽然先后有五万多名中国士兵进入越南抵抗法军，但巴黎当局最终还是控制了该地区。此后，英法两国组建了一个财团来控制蒙自的采矿权，该财团一直持续到英法革命爆发，后来落入东亚总督监事会手中。自黑死病肆虐云南以来，已过去近一个世纪，但这片土地的创伤依旧未能愈合。"
 YUN.earlygame.202.a: "苦难的故事在中国随处可见。"
 YUN.earlygame.203.t: "恢复经济自主"
 YUN.earlygame.203.d: "自辛亥革命以来，经济改革一直是云南省府推崇的首要目标。然而，经济改革之路依然充满艰辛和变数。清朝末代云贵总督李经羲试图重振云南矿业，并复兴云南工业，却因此得罪了当地士绅。士绅迫使李经羲削减政府开支，并将他的改革范围限制在昆明和蒙自。\n\n虽然李经羲旧部蔡锷、唐继尧在辛亥革命后继承其改革遗志，但他们却仍然遭遇了相似困境。保守士绅的阻挠与财税收入的短缺持续掣肘省府施政，而蔡锷的军事化计划更是加剧了这些问题。无论如何，云南省府的经济发展雄心至今依然有增无减，[ROOT.GetLeader]政府希望云南省经济委员会能够实现先辈未竟之业。\n\n鉴于效仿华东地区以政策优惠吸引外资设厂、逆向复制西方技术的模式在此难以推行，西南地区需要强力经济干预现已成为共识。经济委员会的五项重点工作是发展棉纺产业、水力发电、水泥制造、轻工业和关键行业投资。虽然这些雄心勃勃的目标目前仍停留在纸面上，但人们心中已经燃起了一丝希望，或许云南的百年困局即将迎来终结。"
 YUN.earlygame.203.a: "祝经济委员会好运。"
 YUN.earlygame.400.t: "西南的国民党军政府"
 YUN.earlygame.400.d: "倒唐政变结束后，国民党迅速在昆明建立了统治，由朱培德出任省主席，何应钦、龙云和胡若愚也在行政部门中拥有相当的权力。尽管国民党已是云南的主导力量，但朱培德仍意识到需笼络包括地方士绅在内的本省势力。然而，对于新生的云南国民党军政府来说，并非一切都十分顺利。最初对国民党接管政权充满热情的激进学生团体，很快便对国民党的温和立场深感失望。\n\n讽刺的是，学生团体竟然与唐继尧的残余势力合作，反对新的昆明政府。反国民党骚乱愈演愈烈，商会报告了数起扰乱秩序的事件。除了政府外部的边缘群体，朱培德也面临着来自政府内部的反对。龙云虽然策划了倒唐政变，但他认为国民党的野心在于国民革命的龙兴之地广东，因此希望国民党在云南的统治只是暂时的。\n\n胡若愚虽然对国民党接管云南的态度更为温和，但他的看法与龙云类似，并且有夺取云南的野心。然而，朱培德领导的国民革命军第三军却表现出了强烈的地方主义情绪，更倾向于巩固国民党对云南的控制。另一方面，何应钦和国民革命军第一军则极力主张西征，以恢复国民党在广州的势力。对于第一军来说，云南只是国民党收复真正根据地的垫脚石。如果朱培德想要治理好云南，就必须平衡下属之间的利益冲突，否则就会像唐继尧一样落败。"
 YUN.earlygame.400.a: "巩固云南是国民党的首要任务！"
 YUN.earlygame.400.b: "单靠云南无法支撑国民党的野心，必须要拿下广州！"
 YUN.earlygame.4000.t: "国民党部队进军云南！"
 YUN.earlygame.4000.d: "北伐战争结束后，国民党残兵向西“长征”进军贵州。直系本以为这场行动注定失败，而国民党也只有被邻近的军阀集团吞并这一种下场。但事实证明他们错了：滇系军阀唐继尧试图入侵贵州却大败而归，结果遭到手下将领的背叛。\n\n国民党军政府的领导人朱培德得到当地士绅的勉强支持，并自命为云南省省主席。但没几个人会相信，国民党会满足于仅仅控制滇黔二省。"
 YUN.earlygame.4000.a: "西南气象，焕然一新！"
 YUN.earlygame.4000.b: "西南宝地，落入贼手……"
 YUN.earlygame.401.t: "云南的国民党往事"
 YUN.earlygame.401.d: "国民党在云南的历史和该党的历史一样悠久。同盟会元老之一李根源于1909年担任了云南陆军讲武堂校监。武昌起义爆发后，李根源与蔡锷、唐继尧合作在云南发动重九起义并宣布加入革命。一十年代，李根源一边反对袁世凯一边与岑春煊合作成立了旧政学系。旧政学系致力于修复北京和广州之间的关系，并与孙中山、唐继尧和陈炯明等人对立。\n\n但之后，唐继尧因偏袒弟弟唐继虞而疏远了李根源的门生顾品珍，这促使顾品珍强迫唐继尧辞去督军一职。唐继尧本想卷土重来，却被自己的盟友李烈均和朱培德抛弃了。唐顾二人大战期间，孙中山策划让金汉鼎攻占云南，但以失败告终。最终顾品珍身死，唐继尧夺回了云南，云南国民党则被流放到广州，并组建了国民革命军第三军，三十年代，金汉鼎和范石生的军队也被整合进了第三军。\n\n朱培德、范石生、金汉鼎还有后起之秀朱德等人出身不同，因此政治立场也各异。范石生和金汉鼎没什么意识形态倾向，第三军的朱德部表现出了强烈的社会主义倾向，朱培德本人则与旧右派情投意合。因此在范石生、金汉鼎和张群的要求下，朱培德决定接纳李根源回到云南，但由于李根源多年前就背叛了孙中山先生，这一决定饱受争议。何应钦和黄埔系已经明确地向朱培德委员长表达了他们的不满。"
 YUN.earlygame.401.a: "李氏浪子回头，千金难换！"
 YUN.earlygame.401.b: "此人背叛国父，罪不可赦……"
 YUN.earlygame.402.t: "胜利之恶"
 YUN.earlygame.402.d: "国民党在昆明的事务基本尘埃落定，委员长如今将注意力转向了云南的官僚机构。云南各地官员仍对前任督理怀有好感，朱培德并不愚蠢，自然没有忽视这一事实，若将其全部撤换恐将引发更大动荡。胡若愚和龙云虽然将国民革命迎入昆明，但他们基本上希望维持现状。与北方邻省相比，云南的政治局面向来更为稳定，历任地方主官始终延续其一贯的改良路线。\n\n辛亥革命推翻云贵总督李经羲后，蔡锷和唐继尧虽然强化了军事化色彩，但仍延续了李经羲的政治路线，并以征集税收、经济振兴及宪政诉求为名，建立了诸多行政机构。国民党历来以广东为据点，与云南政治传统本无继承关系。对于龙云和胡若愚而言，维护对军队影响巨大的云南官僚体制更为重要。滇军向来是一支高度官僚化的军队，各支部队不仅要效忠上级，还要作为整个机构的一部分服从上级的命令。\n\n权力不在于个人，而在于职位，而云南的官职体系则是金字塔式的等级制度。然而，国民党的革命纲领与云南的官僚传统并不一定相容。在国民党激进分子看来，云南的官僚体系是士绅利益和军阀割据的大杂烩。胡若愚主动联系了朱培德，希望寻求一种能够维护云南现有官僚机构的妥协方案。在此之前，胡若愚已经联系了朱德、范石生和金汉鼎，希望朱德能够尊重蔡锷留下的传统，并让范石生和金汉鼎二人保持不涉政的立场。"
 YUN.earlygame.402.a: "云南官僚机构将服务于国民革命。"
 YUN.earlygame.402.b: "国民革命事业不需要军阀的玩物！"
 YUN.earlygame.403.t: "黄埔系的背水之战"
 YUN.earlygame.403.d: "辛亥革命期间，虽然孙中山成功在华南地区壮大了同盟会事业，但利益分歧导致许多人背弃了他发起的二次革命，留下来的人后来构成了他的核心亲信圈子。孙中山回到广州后，花了数年时间与反复无常的盟友和投机主义的军阀打交道，这些人会毫不犹豫地背叛他的革命事业。屡遭背叛和缺乏西方支持让孙中山倍感愤慨，最终转向工团主义列强寻求结盟。在第三国际顾问团的帮助下，孙中山将国民党重组为一个纪律严明的革命政党。\n\n在军事方面，孙中山需要一支忠于其意识形态目标的军队，将党置于一切之上，因此他创建了黄埔军校。孙中山选择了他最忠诚的门生蒋介石出任黄埔校长，负责培养首批黄埔军官。蒋介石和他的老同学何应钦将保定军校和日本陆军士官学校的教诲融入黄埔军校，向他们的学员灌输战争的方方面面、国民革命的核心意识形态目标以及三民主义的宗旨。\n\n靠着黄埔系的簇拥，蒋介石在国民党内迅速崛起，并在北伐战争中取得了诸多胜利。然而，在德军和直军的围攻之下，黄埔系遭受了巨大的损失，他们敬爱的校长也惨遭刺杀。何应钦率领麾下黄埔系第一军的残余部队撤往贵州，那里汇聚着国民革命军中思想最坚定的军官。尽管第一军当时溃不成军，但黄埔系会迅速指出，将他们与其他残存的军阀部队相提并论是极为错误的。"
 YUN.earlygame.403.a: "必须尊重黄埔系的利益……"
 YUN.earlygame.403.b: "一群道貌岸然的自大狂……"
 YUN.earlygame.404.t: "浙江的革命者"
 YUN.earlygame.404.d: "二十世纪初，青帮控制了全上海的犯罪活动。而在1908年陈其美加入青帮之后，他们开始支持国民党。几年后，陈其美东渡日本为孙中山先生效力，并结识了蒋介石和戴季陶这两位浙江老乡。辛亥革命期间，戴季陶、蒋介石和陈其美都参加了上海起义，三人在上海四处奔走，组建了革命同志会浙江社。二次革命失败后，三人又逃亡日本，并成为了为数不多向孙中山先生本人宣誓效忠的革命者之一，因此得到了孙先生的刮目相看。\n\n1916年，陈其美被张宗昌派人刺杀身死，此后蒋介石为了悼念他而将其侄陈果夫收入门下。袁世凯死后，革命同志会浙江社恢复了在上海的活动，他们经常与青帮合作，还建立了一家非法证券交易所。之后蒋介石花了大笔精力炒股，直到赔了个底朝天才收手。戴季陶则热衷于在报纸上写文章。1924年，孙中山认可了蒋介石的忠诚并任命他为黄埔军校校长。1925年孙中山去世后，蒋介石与汪精卫并列成为国民党的巨头。\n\n戴季陶和陈氏兄弟也跟着鸡犬升天，他们与浙江籍黄埔校友一起构成了蒋介石私人圈子的核心。但随着蒋介石身亡，革命同志会浙江社的崛起之路被打断，蒋介石建立起的关系网络也土崩瓦解。戴季陶和陈氏兄弟在国民革命军垮台的混乱中逃往上海，继续在地下重操旧业，直到国民党夺取云南才离开上海。尽管戴季陶和陈氏兄弟眼下在昆明效力，但他们依然与青帮保持着联系，并继续从事非法证券交易所等不甚光彩的商业活动。"
 YUN.earlygame.404.a: "青帮永远是国民革命的忠实盟友！"
 YUN.earlygame.404.b: "上海一直是藏污纳垢的黑帮老巢……"
 YUN.earlygame.600.t: "西南的联省派孤军"
 YUN.earlygame.600.d: "滇军攻占贵州，确保了唐继尧的北翼安全。虽然广州现已门户洞开，但唐继尧仍需说服民众投入这场比贵州战役更加凶险的军事冒险。\n\n1918年，唐继尧曾向云南省议会提议建立川、滇、黔三省联军。在重庆举行的盛大仪式上，他接任了七省联军司令，名义上也统帅广东、广西、四川、湖南和山西五省部队。然而，唐继尧的北伐计划因权力中心逐渐从昆明转移至广州而陷入内讧，军费枯竭也迫使滇军依赖鸦片贸易与劫掠维持。滇系“客军”引发的民怨不断加剧，最终导致1920年爆发了广州支持的川系军阀联合叛乱。后来，唐继尧在广州支持的顾品珍政变中被麾下溃军推翻——这表明省外的失败会迅速波及省内。\n\n1922年唐继尧东山再起后，他转而优先考虑省内稳定，放弃了“武力干预主义”，并清洗了顾品珍、罗佩金、何国钧等留日背景的同僚。昔日威震西南的滇军陷入装备锈蚀、军饷削减的困境，并被交给唐继尧胞弟唐继虞统领。唐继虞虽然忠心耿耿，但能力却令人堪忧。然而，唐继尧仍建立起一套以官僚体制而非个人关系为基础的军队指挥系统，并将资金转向民生建设。\n\n1925年唐继尧进军广州的军事行动再遭重挫——其部队尚未进入广东境内，便被内部分裂的桂系军阀击溃。除了军事上的失败外，这次行动也为现代中国的政治走向提供了一个惨痛的教训。唐继尧未能明确展示对滇军流亡势力的态度（联合或是剿灭），致使昔日同袍或倒戈相向或冷眼旁观，纪律严明但偏重地方主义的滇军也根本无法与那些和国民党结盟的激进军阀部队抗衡。败归云南后，唐继尧再次遭遇部下政变，倘若历史改写……"
 YUN.earlygame.600.a: "……我们需要属于自己的主义的联盟。"
 YUN.earlygame.600.b: "……唐继尧需要巩固自己的权力。"
 YUN.earlygame.601.t: "滇军席卷贵州"
 YUN.earlygame.601.d: "滇系军阀曾是华南的主导力量，在护国战争中率领革命军反抗袁世凯复辟，并在护法战争中发挥了关键作用。然而，在与北洋政府和广州政府的斗争中惨败后，滇系军阀陷入了孤立，只能等待时机。\n\n如今，唐继尧督理眼见时机成熟，再次率领滇军投入战斗，以剿灭盘踞在贵州的国民党残余势力。然而，唐继尧的野心绝不会止步于此——在稳固了北翼后，他接下来显然会剑指全国。"
 YUN.earlygame.601.a: "在我们寻求建立中华联省的过程中，会有一个西南盟友吗？"
 YUN.earlygame.601.b: "蔡锷的不肖门生从西南杀回来了……"
 YUN.earlygame.602.t: "章太炎，联省派的标志人物"
 YUN.earlygame.602.d: "章太炎（章炳麟，号太炎）如今寓居昆明，他是一位年迈的联省派知识分子，也是辛亥革命的遗民——因1906年的“苏报”煽动案而声名鹊起，当时他被清廷和上海租界联合法庭判处三年徒刑。\n\n章太炎以反清作家身份倡导“国粹”思想，其理念直接催生了《云南丛书》杂志。该杂志激励了众多云南革命青年，其专栏《滇粹》收录西南军民抗清领袖传记，宣扬云南特有的地方尚武文化，同时力倡九大革新主张：国魂、群力、公心、进步、冒险、尚武、兴业、地方自治、国民品格。\n\n即使到了二十年代，章太炎在政界依然享有崇高声望，尤其是在联省派中。唐继尧等云南军政要员均受其“省域自治”思想感召，力图通过联合各个自治省份，凝聚实力以抵御外侮。虽然章太炎自己也承认，他的一些激进思想过于理想化，难以实现，但他仍然是一位极具影响力的思想家。\n\n章太炎最初常住苏州，曾参与过孙传芳政府，但孙传芳的威权主义及其拒绝打破直系中央集权的立场让他倍感失望。1932年，他失去了孙传芳的青睐，被迫逃离八省联合，寻求唐继尧的庇护。在直系成功统一中国后，他和更广泛的联省运动一样，多少有些失势。此后，唐继尧和章太炎二人通过将章太炎的统一自治党与唐继尧衰微的民治党合并，成功重振了政治声势。"
 YUN.earlygame.602.a: "章太炎的理想让联省主义重燃希望火焰！"
 YUN.earlygame.602.b: "唐继尧的领导让联省主义重新焕发生机。"
 YUN.earlygame.603.t: "应对地方派"
 YUN.earlygame.603.d: "士绅和商人几乎是中国各省份的重要权力支柱，云南也不例外。19世纪中期的动乱结束后，士绅在云南的重建中发挥了主导作用，并控制了云南的行政、财政以及矿业和贸易网络。\n\n士绅手中的权力让他们控制了地方议会，并利用议会来对抗中央政府的官僚机构和外国公司的剥削。士绅对地方政治和经济的控制使他们成为兼具改革性与反动性的强大力量——1911年李经羲推行的新政，便因士绅担忧财政赤字，最终在昆明和蒙自以外的地区全面受阻。大约在同一时期，英国强占片马的行径激化了士绅不满，他们组建“保界会”并发起大规模抵制英货运动，甚至呼吁推翻软弱无能的中央政权，致使众多保界会成员投身革命组织同盟会。\n\n这种改革与反动的拉锯、地方主义与民族主义的博弈至今仍在持续上演。云南的士绅和商人不愿支持那些可能改变乡村权力平衡的重大改革，却坚持某种形式的宪政和以省议会形式出现的精英民主。他们厌恶战争的前景及其带来的社会经济混乱，但又出于爱国的动机寻求国家统一。然而，在士绅设想的统一国家中，他们又渴望获得相当大的区域自治权力，而中央政府似乎并不愿意给予。若想争取士绅支持统一战争，我们需要付出巨大的努力。"
 YUN.earlygame.603.a: "解放同胞是我们义不容辞的民族责任！"
 YUN.earlygame.603.b: "我们是为了捍卫自己的自治权利而战！"
 YUN.earlygame.604.t: "新月盈缺"
 YUN.earlygame.604.d: "在昆明的各所大学校园里，你可以看到日渐式微的“新月社”正在授课。新月社由徐志摩于1923年创立，原为热衷戏剧的中上阶层知识分子组成的社交沙龙。这个由朋友同仁组成的松散社团吸引了胡适和张君劢等自由派学者，并迅速与现实主义主导的文学研究会以及浪漫主义主导的创造社展开竞争。在新文化运动的反传统浪潮中，新月社秉持中间道路，主张重新审视中国传统，同时理性地评价西方文化。\n\n罗隆基、闻一多、梁实秋和清华文学社很快加入了新月社阵营，并遭到了秉持社会主义立场的对手左翼作家联盟（创造社的继承者）的攻击。随着新月社的政治化程度不断提高，入社的非知识分子也日益增多，徐志摩对新月社“令人无法忍受的小资产阶级气息”感到不满，并在1927年的动乱中解散了该社。\n\n尽管如此，原新月社成员还是在上海重新聚首，开了一家书店。在统一前景日益明朗的背景下，他们不再仅仅满足于文学讨论，也开始探讨政治，于是开始出版月刊《新月》。这部月刊得名于印度独立运动家泰戈尔的诗集《新月》，徐志摩非常推崇泰戈尔，并表示：“我们舍不得新月这名字，因为它虽则不是一个怎样强有力的象征，但它那纤弱的一弯分明暗示着，怀抱着未来的圆满。”\n\n虽然新月社转向讨论政治使其成员产生了分歧，但在直系治下的自由化时期，新月社逐渐发展壮大。1931年，徐志摩在一次空难中不幸身亡（许多人认为他被暗杀），新月社陷入了悲痛之中，同时又遭到了八省联合的严厉镇压。次年，胡适和北大派系返回北方。罗隆基和清华派系则在南方寻求更加思想自由的避风港，并在云南谋得了一席之地，在那里继续发表文章。有了一定的资金支持，新月社就能再次兴盛。"
 YUN.earlygame.604.a: "唐继尧看重新月社的全国影响力。"
 YUN.earlygame.604.b: "新月社代表着对民主未来的希望。"
 YUN.earlygame.605.t: "贵州的真正统治者"
 YUN.earlygame.605.d: "贵州（至少是贵州西部）已入滇军之手，这对唐继尧重建他的西南帝国而言是极具价值的战利品。在此前的贵州战役中，唐继尧曾协助由上层士绅支持的改良派“宪政预备会”对抗由下层士绅支持的革命派“自治学社”。\n\n唐继尧违抗蔡锷入川军令、转道控制贵州的行动，彻底改写了他的政治命运。此举不仅导致唐继尧与孙中山决裂（孙中山当时正援助流亡的“黔人冤愤团”组织），其弟唐继虞在贵州担任实际军事长官期间，更因鸦片贪污贻误战机未能及时救援龙云，直接导致滇军在滇桂战争中败北，后来更是引发了胡若愚的未遂政变。\n\n宪政预备会治下的贵州长期由刘氏集团首领刘显世掌控。刘显世曾在二十年代主政贵州，但后来被袁祖铭及国民党流亡势力所取代。刘显世于1927年在昆明流亡期间去世，最终未能返回故土。\n\n然而，刘显世的亲属却迅速跟随滇军重返贵州。刘显世的堂兄刘显潜将军试图出任贵州省长一职，但遭到刘显世之侄刘公亮的反对，据说刘公亮在其叔父晚年掌握了省长实权。刘氏家族的其他成员，例如刘盛昌和刘新吾（均为军官）以及家族亲信易荣黔（一位军阀出身的慈善家和商人），都在此事上表明了立场。\n\n唐继虞也回到了贵州，考虑到他的名声，这引发了一些争议。但或许让唐继虞留在贵州更好，这样既能确保贵州在唐继尧的掌控之下，还能让唐继虞远离云南，毕竟唐继虞更加不受云南省府官员待见。"
 YUN.earlygame.605.a: "刘显潜团结刘氏家族，抵御外来干涉。"
 YUN.earlygame.605.b: "唐继虞协助刘公亮出任贵州省长一职。"
 YUN.earlygame.800.t: "通往广州之路"
 YUN.earlygame.800.d: "辛亥革命后，云南与两广（广东和广西合称“两广”）的关系错综复杂。护国战争期间，滇桂粤三省与当时受云南统治的贵州和四川，以及陕西、湖南和浙江结盟。这一西南联盟一直延续到护法战争，在此期间，云南及其“卫星省”四川和贵州始终与粤桂两省并肩作战。\n\n但随着云南被两广边缘化，双方关系逐渐紧张。滇军被赶出四川后，政学系崛起，云南只得屈居于广州当局之下，而唐继尧重新掌权后，又与国民党治下的广东产生冲突，国民党当局指控唐继尧与陈炯明联手反对孙中山。1925年孙中山去世后，唐继尧做出了一个重大决定——进军广东以夺取华南领导权。然而，他未曾料到会遭遇盘踞在昆明和广州之间的广西势力的顽强抵抗。滇军在抵达广州之前就被彻底击溃，唐继尧的统治因此受到严重动摇。\n\n北伐战争期间，云南基本保持中立，而贵州则与国民党结成了松散的联盟，最终在亲北洋的袁祖铭政府与贵阳国民党军政府的冲突中分裂。[YUN.GetLeader]再次将目光投向广州后，他必须仔细权衡自己的选择。"
 YUN.earlygame.800.a: "我们将继续考虑手头的选择。"
 YUN.earlygame.800.tt: "§R如果与两广的战争进展不顺，我们政权的稳定将面临极大的危险！§!"
 YUN.earlygame.801.t: "第二次滇桂战争"
 YUN.earlygame.801.d: "[YUN.GetLeader]做出了决定命运的开战决定，命令他的部队越过云南和贵州边境。尽管他的最终目标是建立对立政府必须攻占的核心城市——广州，但他的直接目标是广西省会南宁——这一沿途重要的后勤枢纽。\n\n1925年，第一次滇桂战争因孙中山逝世及随后的权力斗争而爆发。当时由龙云率领的滇军攻占了南宁，但在李宗仁率领的桂系部队反攻中被包围。唐继尧的救援行动失败后，新桂系随即收复了南宁，滇军士气低落，战争也随之告终。第一次滇桂战争对华南地区产生了决定性的影响，失势的唐继尧督理险些被心怀不满的下属推翻，而广州政府则得以完成改组。\n\n即将到来的第二次滇桂战争同样具有决定性意义。滇黔桂三省都是军事力量雄厚的省份，但比广东贫穷得多。如果滇黔部队未能采取迅猛攻势并快速击溃桂军，他们将面临严重的后患。另一方面，如果桂军未能守住坚固的防线，广东则将岌岌可危。"
 YUN.earlygame.801.a: "我们必须迅速行动，取得胜利！"
 YUN.earlygame.801.b: "我们将像往常一样坚守阵地。"
 YUN.earlygame.802.t: "攻克广州"
 YUN.earlygame.802.d: "[YUN.GetLeader]的豪赌大获全胜！[YUN.GetNameDef]的军队横扫了广西崎岖山林和广东水网地带中的守军，完成了他们的前辈1925年未能完成的壮举，并在决战中攻占了广州。虽然还有许多工作要做，但即便最苛刻的批评者也无法忽视或贬低此战意义。[YUN.GetRulingParty]的实力已得到验证，将领们得以安定军心，我们正可展望国家统一大业的下一阶段！"
 YUN.earlygame.802.a: "不得不说，这确实是个了不起的成就。"
 YUN.earlygame.810.t: "昆明的密谋者？"
 YUN.earlygame.810.d: "云南局势濒临崩溃已有一段时间，战场上的失败严重打击了军队的士气。自1910-20年代“武力干预主义”政策一败涂地以来，云南统帅部一直不愿支持对外军事冒险，而是倾向于武装孤立。我们收到了来自龙云将军和胡若愚将军代表的消息，他们希望终结战事，并提出推翻[YUN.GetLeader]，以换取云南继续享有省内事务自治权。\n\n如此一来，我们手头便有了充足的选择。虽然我们可以尝试彻底征服云南，但考虑到云南的多山地形，以及滇军在防御方面非常顽强，预计武力征服将得不偿失。对于我们来说，最好的选择或许是早点提出条件（这将稍微提高我们的谈判地位），把资源留给更重要的目标。"
 YUN.earlygame.810.a: "我们将持续关注局势。"
 YUN.earlygame.811.t: "[FROM.Capital.GetCapitalVictoryPointName]提出条件"
 YUN.earlygame.811.d.intro: "在击退我军并在冲突中占据上风后，[FROM.GetLeader]及其核心圈子权衡了结束这场战争的方案。云南有利的防御地形和相对匮乏的资源使得直接入侵变得不切实际。因此，他们决定接受昆明密谋者的提议，以停火为条件，支持我方发动政变。"
 YUN.earlygame.811.d.submission_and_lose_guizhou: "$YUN.earlygame.811.d.intro$\n\n但这并不意味着和平会轻易实现。云南将臣服于[FROM.GetNameDef]，并丧失国内事务的自治权，但至少允许我们维持自治和对军队的控制。贵州省将被转交给占领军，我们的西南霸权至此彻底告终。"
 YUN.earlygame.811.d.submission_and_keep_guizhou: "$YUN.earlygame.811.d.intro$\n\n但这并不意味着和平会轻易实现。云南将臣服于[FROM.GetNameDef]，并丧失国内事务的自治权，但至少允许我们维持自治和对军队的控制，贵州省（至少是战前我们控制的部分）也将继续留在我们的势力范围内。"
 YUN.earlygame.811.d.whitepeace_and_lose_guizhou: "$YUN.earlygame.811.d.intro$\n\n但这并不意味着和平会轻易实现。作为谈判条件的一部分，我们将被迫放弃贵州（至少是战前我们控制的部分地区），我们的西南霸权至此彻底告终。"
 YUN.earlygame.811.d.whitepeace_and_keep_guizhou: "$YUN.earlygame.811.d.intro$\n\n虽然和平来之不易，但值得庆幸的是，我们得以保留大部分现有成果。云南将维持自由和中立，贵州省（至少是战前我们控制的部分）也将继续留在我们的势力范围内。霸权虽已旁落，但为政权延续，此举实属不得已而为之。"
 YUN.earlygame.811.a: "看来云南的情况不太好……"
 YUN.midgame.130.t: "统治两广"
 YUN.midgame.130.d: "1911年清朝覆灭后，中国各地一直饱受内乱之苦，两广亦不例外。广东政坛的掌舵人是联省运动领袖陈炯明和商团团长陈廉伯。广西则被以林虎、刘震寰“桂军”为首的旧桂系势力掌控。如今，两广除了北京当局之外，又迎来了新的宗主——昆明的统治。新的领导层也带来了新的问题……\n\n唐继尧选择与刘震寰的桂军结盟，希望借此缓解民风彪悍、乡村广袤的广西省内可能产生的叛乱与动荡。然而，唐继尧对桂系军阀刘震寰显然有所提防。刘震寰有着严重的鸦片瘾，是个野心勃勃、嗜赌成性的军阀，而且曾被排挤出广西很长一段时间。虽然唐继尧已承诺将广西交给刘震寰统治，但考虑到林虎是广西当初的旧桂系四巨头之一，或许林虎会是更好的选择。\n\n与广西不同，广东是革命和联省主义的温床。粤军和士绅阶层对联省主义抱有强烈的同情。陈廉伯是广州市长，也是商人主导的“各界救粤联合会”的领导人。该协会致力于联合自由派和政学系，组建一个地方派联盟。\n\n军事占领和对干预其他省份事务并非唐继尧独有的政策。早在蔡锷主政时期，滇军就曾以牺牲他省资源为代价屯兵四川。事实上，此类远征为云南完成统一华南的非凡任务做好了准备。\n\n由于政局动荡，粤桂两省的议会现已暂时停摆。如果允许旧议会召开会议并进行投票，他们很可能会选出倾向旧政权的地方派。如果我们“审查”谁能重返议会，即便这样做会激怒一些人，但能确保让“真正的”联省派继续掌权。"
 YUN.midgame.130.a: "只要他们保持忠诚，我们就会尊重省级自治。"
 YUN.midgame.130.b: "应在选举前剔除军阀和其他颠覆分子。"
 YUN.midgame.131.t: "唐继尧政府"
 YUN.midgame.131.d: "在不断扩张、如今已覆盖华南地区的云南官僚体系中，唐继尧的官僚队伍和政府机构也在日益壮大。但唐继尧的核心圈子仍然由他的亲信组成，例如他的妹夫董泽、胞弟唐继虞及长子唐筱蓂。唐继尧的幕僚王九龄、李曰垓、白之瀚等人把控着政府要职，作为唐将军的心腹，掌管着机密决策与战略部署。\n\n民治党和章太炎则被奉为唐继尧的政治基本盘，民治党由联省派和自由派知识分子和立法者组成，还包括新近吸收的共和大同盟——这是一个由亲联省派团体组成的大帐篷。共盟表面上是一个民主派联盟，致力于结束多年动荡和专制统治；但这些团体内部的派系斗争却引起了唐继尧的担忧。尤其值得一提的是，副执政陈炯明的粤籍客家人背景让他在广东颇具影响力，而湖南则由联省派省长赵恒惕长期执掌。\n\n至于军队层面，虽然滇军占据了主导地位，却不得不大量吸纳收编军阀部队、民团武装甚至土匪来补充兵力。然而，即便是滇军嫡系也并非完全忠于唐继尧，龙云与胡若愚已被证明是不可靠的部属。在龙云等人失势后，唐继尧任命了张维翰和孙渡等亲信将领，他们不仅经验丰富，而且对不断发展的唐继尧政权也十分忠诚。"
 YUN.midgame.131.a: "唐继尧总是能依靠官僚机构来执行他的意志。"
 YUN.midgame.131.b: "章太炎和联省运动才是我们为之奋斗的理由！"
 YUN.midgame.131.c: "为了赢得胜利，我们必须信任军官和盟友。"
 YUN.midgame.132.t: "罗隆基重整新月社"
 YUN.midgame.132.d: "自从发表人权相关著作以来，罗隆基便在南方自由派和民主阵营中声名鹊起。作为自由派运动的后起之秀，罗隆基一直致力于缓慢修复新月社与旧中国民主政团同盟（由各路独立人士、小党派和小团体组成的联盟，他们追随联省运动，但对潜在的威权主义保持警惕）之间的联系。除了组织民主政团同盟的日常运作外，罗隆基还致力于在《民主周刊》和《民主日报》上发表文章和观点；他的文章时常会流露出些许对左派的钦佩之情，以表达对第二次法国革命中民主原则的支持。\n\n随着权力与角色的转变，罗隆基肩负起了筹备国家统一的全新责任。罗隆基固然可通过将新月社活动与唐继尧及共盟相联结来强化中国民主阵营，但这样做也存在一些问题——唐继尧毕竟是军阀出身，军方领袖们维护民主的承诺也难免令人生疑。罗隆基的另一种选择是专注于“外部建设性批评”，并尝试将更多摇摆不定的知识分子聚集到新月社旗下。这虽能促进民主进程中的言论和思想自由，但代价是牺牲南方的团结。最后还存在第三个选择——干脆直接与唐继尧麾下的各路军阀结盟，接受他们的资助和庇护。鉴于唐继尧终究不值得信任，在遭到排挤前寻觅更强大的靠山，或许才是罗隆基的最佳选择。"
 YUN.midgame.132.a: "唐继尧有能力领导革命事业！"
 YUN.midgame.132.b: "健全的反对派创造民主生机。"
 YUN.midgame.132.c: "我们有比唐继尧更好的人选。"
 YUN.midgame.133.t: "中国联省主义的历史"
 YUN.midgame.133.d: "联省主义的第一阶段（1895-1911）源于中国知识界对美国、瑞士的观察借鉴。梁启超率先指出，联邦制不会削弱中国这样疆域辽阔的国家，同盟会亦呼应此观点，并宣称中国理应建立共和政府。当时各省议会实际独立于北京政府运作，一些省份甚至曾考虑过由多个自治省组成联邦的想法。\n\n联省主义的第二阶段（1912-1920）源于袁世凯对中华民国的背叛。联省主义通过扩大省级自治权和推广真正的民主理想，成为对抗袁世凯政府的武器。袁世凯去世后，国民党与中国进步派决裂，联省主义理想基本无人响应。然而，1917年南北统一谈判失败后，联省运动再次受到欢迎，政治家熊希龄呼吁各省联合起来起草联省宪法并召开国会。\n\n中国联省主义的第三阶段，也就是当下所处的阶段，代表着联省革命运动的巅峰。1920年，湖南率先发起联省运动，制定了省宪。这一理念恰与日本明治维新的成功及西方强国经验相印证。真正的民主是主权在民，并毫无保留地赋予各省自治权力，中国政坛中日益增长的地方主义正是这种观点的体现。如今，各派系与政党逐渐以省域认同取代对中央的忠诚。联省派作家认为，通过赋予各省不受北京制约的自治和发展权力，各省将得以保持独立并发挥其自身的独特优势，这最终将增强而非削弱更宏大的民族国家。"
 YUN.midgame.133.a: "联省主义是恢复国家和各省之间和谐的方式。"
 YUN.midgame.133.b: "联省主义是实现宪政民主共和国的一种手段。"
 YUN.midgame.134.t: "一一·四运动的遗产"
 YUN.midgame.134.d: "1919年10月，北洋政府以山东权益换取协约国掠夺性贷款的密约文件遭曝光后，11月4日爆发了席卷全国（尤其是北京）的大规模抗议。\n\n抗议运动的反帝立场引发了新一轮思想浪潮，并促进了当代中国政治思想的蓬勃发展。受这种进化论和目的论的时间与历史观的影响，许多一一·四运动期间的知识分子将现代性理解为提倡“新”，同时有意识地反对“旧”。这种对现代性进步的、通俗的解释被称为“西方主义”，这是一种激进的、反传统的意识形态，其极端主张要求对中国文化进行“全盘西化”。\n\n新月社基本上拒绝了这种反传统立场，转而批判性地反思了西方思想对中国政治文化制度的影响。在新月社看来，新旧文化并无本质差别，反而应当努力欣赏东西文化与新旧思想。像闻一多这样的作家肯定了新文学运动带来的“新思潮”，并指出新文学运动“体现了我们追求新时代精神的自觉意识”。总而言之，新月社寻求的是一种兼容并蓄的新理想，既不彻底否定传统，也不盲目推崇革新，而是一种新政治文化的开端。\n\n唐继尧本人最初对民族主义的一一·四运动表示同情，但同时也试图限制学生行动，并颁布严格法令要求民众通过国会代表而非街头抗议表达诉求。他公开批评新月社等新文化思潮仅仅是“缺乏现实依据的政治哲学空谈”，并质疑这些思想最终会适得其反。"
 YUN.midgame.134.a: "我们确实拥抱了新文化！"
 YUN.midgame.134.b: "他们的空谈毫无意义。"
 YUN.midgame.135.t: "美国与联省运动"
 YUN.midgame.135.d: "联省运动历史上曾受到过两国启发：美利坚合众国和德意志帝国。新月社的许多成员都曾赴美留学，早期联省派知识分子也大多认为，美国的实验孕育了第一个真正的联邦制民主国家。美国再度陷入内战后，这些观点自然受到了挑战，尤其是在中国局势岌岌可危的情况下。\n\n大江会是新月社的前身之一，由梁实秋、闻一多、罗隆基等人于二十年代初创立。他们在芝加哥大学附近的德雷克塞尔酒店起草宣言，宣布成立大江会——该名称寓意中华文明如黄河般源远流长的辉煌历史。大江会宣言明确指出三点：（1）民族主义是为了对抗帝国主义；（2）必须实行民主和人权；（3）推行国家调控经济模式，并防止阶级斗争。政治制度应当以美国联邦主义原则为指导；寻求一个强大的联邦政府，并在权力的每一个环节进行制衡，以确保民主充满活力。\n\n与之相对的是，章太炎认为美国联邦主义模式与中国并不相容。首先，中华联省政府的权力结构将以地方社区为基础，联省政府的权力将分散在各省的文职和军事领导人手中，而不是将权力集中在总理和总执政手中。其次，联省政府的权力将来源于地方，各省将被视为主权国家，并基于共同协议建立邦联。第三，将有一个中央政府执行国家政策，并在“国际大家庭”中代表中国，但中央权力将受到严格限制。"
 YUN.midgame.135.a: "像美国各州一样的民主国家！"
 YUN.midgame.135.b: "一昧效仿美国并不符合中国国情。"
 YUN.midgame.136.t: "华南红色恐慌"
 YUN.midgame.136.d: "随着联省派革命在中国南方持续发展，联省运动自然与中国社会主义运动的温床——无政府主义者、共产主义者、工团主义者，当然还有国民党，发生了冲突。从广东和福建的游击区到上海和香港的造船厂，当资本主义世界尚未从黑色星期一的余震中恢复过来时，1932年遭到残酷镇压的社会主义运动却仍在持续发展。从小册子到公开罢工，社会主义者们谴责联省运动是军阀与资产阶级的邪恶联盟，用沾满鲜血的双手和资本主义的贪婪玷污了社会民族主义革命的荣光。\n\n然而，一些自由派在更加自由意志主义的社会主义团体（例如无政府主义者）中找到了意识形态合作伙伴。章太炎长期以来一直致力于阐述他的乌托邦民主理念，这与中国无政府主义者在谴责儒家封建世界观、提倡大同思想方面有许多相似之处。但章太炎由于革命方向以及革命与改良路线之争，与巴黎无政府主义者（即国民党内的“四大元老”）分道扬镳，最终导致他与社会主义革命运动决裂。\n\n虽然较为冷静的声音主张与赤色分子和平相处，但以梁实秋为代表的众多人士却将矛头指向左翼文学——从港口城市里中国工团主义者的著作，到流亡欧洲的国民党左派作品皆在其列。梁实秋直接批判那些鼓吹阶级斗争的政治著作不过是“隐秘民粹主义”。左翼报纸要么被查封，要么被勒令缩减出版。在某些情况下，罢工和劳工领袖甚至被扣上“煽动叛乱破坏民主革命”的帽子，并遭到公开逮捕。联省运动和新月社均明确表示，共产主义革命不可能、也无法颠覆他们建设自由中国的努力。"
 YUN.midgame.136.a: "给和平一个机会。"
 YUN.midgame.136.b: "宁死勿赤。"
 YUN.midgame.137.t: "新月社的内部争论"
 YUN.midgame.137.d: "新月社并非一开始就是如当下这般的政治势力。最初，新月社与许多政党一样，始于一群怀揣远见和梦想的同仁；而如今却演变为融合社会民主与右翼思想的充满活力的政治思潮。随着运动的发展，像徐志摩这样的创始人逐渐感到，新月社真正的理想沾染上了“令人无法忍受的小资产阶级气息”的污秽。对于徐志摩而言，理想的新月社当如罗塞蒂、萧伯纳式的文人雅集——少数人的思想碰撞，足以开辟出无限的政治、艺术与意识形态疆域。\n\n徐志摩曾是新月社的门面和粘合剂，维系着社内各派的团结。徐志摩与张君劢的妹妹喜结连理，二人的感情如旋风般跌宕激烈，最终在离婚后成为挚友。徐志摩曾在剑桥大学师从贝特拉姆·罗素和哈罗德·拉斯基，之后又与一位已婚女子再婚，并因此与家人断绝了联系。身负门楣之耻的徐志摩转向文学创作，先后从事过多份工作，最终于1931年在一场悲惨的空难中丧生。徐志摩艺术性的散文风格，摒弃了宁静祥和的旋律，转而拥抱虚无未来的不确定性。\n\n徐志摩逝世后，新月社背叛了他的愿景，成为一股更加庞大的政坛第三种力量；但他的影响力依然存在。部分成员如孙大雨、邵洵美沉迷于机械的冰冷恐怖、工业的野蛮扩张、感官意象的迷魅及畸形主题的黑暗美学，主张新月社纲领应该更加左倾，而另一些人则主张采取更为正统的右倾政治路线。这些所谓的右派人士敦促新月社应该向现有建制派靠拢，以便更好地适应不断变化的政治格局。或许，直接放任各派互相批评，会让他们更容易被我们的目标所左右。"
 YUN.midgame.137.a: "暴烈现世中仍有美韵存在。"
 YUN.midgame.137.b: "右转并与建制派展开合作。"
 YUN.midgame.137.c: "新月社各派依然四分五裂。"
 YUN.midgame.138.t: "联省民族主义"
 YUN.midgame.138.d: "在这个反帝斗争的时代，民族主义主导着中国的政治思想。然而，对于联省派来说，他们却难以高举民族主义这杆大旗。虽然联省运动当然希望摧毁外国租界，驱逐像德国和日本这样的帝国主义敌人；但他们也必须谨慎地处理与地方派当局的关系。\n\n唐继尧本人信奉强大的中央集权政府，该政府既能管理省份自治，也能最终构建起足以抵御外国影响的民族国家理念。在云南，民族主义事实上呈现出两种倾向：一派致力于成为外国人的平等商业伙伴，另一派则不惜一切代价试图将外寇驱逐出中国海岸。因此，一种独特的具有民族色彩的地方主义应运而生，它通过地方发展来建立民族自治，进而塑造出独特的身份认同。\n\n另一方面，章太炎则秉持着更加……深奥的信条。章太炎的民族主义概念深陷两种国家叙事的矛盾之中——既追求国家持续共同前行，又以某种方式强调与历史传统的羁绊。因此，真正的民族主义出路在于“国粹”——这种理念主张民族可脱离国家实体存在，但民族精神的存续与回归需依托国家制度载体实现。在处理涉外事务时，地方省级政府有时比依赖中央集权国家的官僚体系更加有效。"
 YUN.midgame.138.a: "中央政府须足够强大才能击退帝国主义！"
 YUN.midgame.138.b: "我们只能依靠各省集体来抵抗帝国主义！"
 YUN.midgame.139.t: "教育与思想管制"
 YUN.midgame.139.d: "尽管唐继尧是联省派革命的旗手，但反对派仍将他描绘成一个投机主义的军阀。唐继尧已经开始通过改革大学和宣传他的意识形态来施加影响。由唐继尧妹夫任教的东湖大学最近建成，其课程设置由唐继尧的高层官员制定批准。据报道，东湖大学学生与外省左派学生因故爆发冲突后，新月社随即发表严正谴责声明。\n\n唐继尧的大众教育计划不仅涵盖大学，还包含普及教育，并创办了一系列小学、职业学校、夜校和讲习所。激进派学生借此组织了表露社会主义情感的白话剧和爱国戏剧，这经常导致东湖大学学生内部发生冲突。据报道，有时军校学员甚至会冲击学生总部和宿舍，而唐继尧的省府则往往对此保持沉默。\n\n新月社成员梁实秋严厉谴责各省镇压言论和思想自由的做法，他写道，思想控制的结果将使人民分成三类：第一类人是理想派，无法在思想管制下放弃自己的原则；因此，他们要么被迫退休，要么投身革命。第二类人是投机派，他们受过教育，但没有原则，更没有勇气；最后一类人则是唯命是从的盲从者。在这种情况下，最聪明、最勇敢的人将被清除，只剩下投机派和无知的群众。因此，梁实秋在他的著作中呼吁宽容、思想自由和通识教育。"
 YUN.midgame.139.a: "艰难时刻需要强硬措施。"
 YUN.midgame.139.b: "我们或许应该放松管制。"
 YUN.midgame.100.t: "广州会议"
 YUN.midgame.100.d: "唐继尧终于回到了广州，他不再是屈辱的流亡者，而是以胜利者的姿态——最终战胜了两广势力。这座城市虽然饱受战乱之苦，却依然是中国革命力量的有力象征：20世纪，曾有数个南方政府试图挑战北京的统治地位，而广州正是他们的根据地。\n\n唐督理掌控南方数省后，获权召集特别会议，预计将在会上就任“唐总执政”。如今，唐继尧的注意力已然转移：云南事务不再（也不可能）是他的首要任务——他已统领着一个区域性政权。在两广派系中，广东是规模更大的联省运动的发源地，该运动以陈炯明及其粤军为核心。广东也是各种革命社会主义和保守主义反动派的温床——商界人士组建了“各界救粤联合会”，以反抗国民党和工团党的统治。广西则更为保守，分裂成了众多地方主义派系（统称为旧桂系）。虽然旧桂系内部经常发生争执，但他们仍会团结一致，共同反对外部势力干涉广西内政。\n\n来自全国各地的联省派领袖纷纷涌向广州，其中就包括一些新近臣服的军阀。一些对此感兴趣的军阀也派出了非官方代表，以避免向即将成立的广州政府做出任何直接承诺。这些军阀秉持着五花八门的、有时甚至相互冲突的理想——这不仅印证了联省运动历来松散的特性，更揭示了二十年代惨痛失败后联省派分崩离析的现状。多数人是宪政的坚定拥护者，部分人寄望于中国实现民主化，更多人则是因为联省派提出的地方自治承诺而加入。虽然全体与会者都要求实现国家统一并反对帝国主义，但有些人寻求和平道路，另一些人则主张发起解放战争。"
 YUN.midgame.100.a: "我们为实现宪政民主制度而奋斗。"
 YUN.midgame.100.b: "在国家重归一统前我们不会止步。"
 YUN.midgame.100.c: "我们将捍卫自己的地方自治权力。"
 YUN.midgame.101.t: "共和大同盟"
 YUN.midgame.101.d: "共和大同盟是由被边缘化的陈炯明和段祺瑞于1931年共同创立的，当时直奉统一谈判失败，反租界情绪高涨，民众理想幻灭。1932年上海起义爆发后，直系当局开始衰落，唐继尧和章太炎重振旗鼓的民治党以及褚辅成领导的浙江自治运动也加入了共盟。其余组织因顾忌直系权威而采取平行运作，包括赵恒惕的民新社与熊克武的联省自治筹备处。\n\n在接下来的几年里，共盟逐渐演变为成为联省派联合，尽管当时许多人将联省主义视为名誉扫地的不爱国思想，但共盟仍然帮助联省主义延续了下来。曹锟宪法中名义上的地方自治条款，让许多人质疑联省主义是否已经山穷水尽，并沦为地方军阀分裂国家的借口。\n\n然而，直系当局不仅未能兑现宪政承诺，甚至未能维护国家统一，这让许多国人开始重新审视联省主义。虽然不像二十年代运动高潮时那样激进，但东山再起的共盟仍吸引了许多心怀不满的民主人士，这些人大多曾是中国民主政团同盟的成员，并亲眼目睹了民主政团同盟未能引导北洋政府进行民主变革的失败。\n\n共盟誓言要团结军阀、知识分子和其他爱国者，建立联省民主政体。但在实现这一目标之前，共盟必须先化解内部潜在的紧张局势。陈炯明是共盟现任主席，同时也是致公党的领袖，他曾邀请唐继尧出任共盟副主席，但唐继尧却因不愿屈居于陈炯明之下而迟迟不愿接受。如今，强势崛起的唐继尧出任共盟主席已是水到渠成，但逼迫现主席下台会让陈炯明颜面尽失，并疏远一个潜在的盟友。"
 YUN.midgame.101.a: "唐继尧是无可争议的领袖，他将轻松赢得选举。"
 YUN.midgame.101.b: "让陈炯明继续担任名义主席，借此抛出橄榄枝。"
 YUN.midgame.102.t: "民主政团同盟的余烬"
 YUN.midgame.102.d: "1936年七君子事件后，南方众多共和派人士因中国民主政团同盟的消极回应深感失望，愤然退出同盟。中国宪政党是同盟中规模最大的党派，也是备受诟病的众矢之的。宪政党是梁启超的保守派继承者，与北洋建制派关系密切。此后，南方地区的左翼梁党人士、社会民主主义者及进步自由主义者云集广州，共同创建了民主社会党。\n\n民社党由两大派系组成。第一派也是占主导地位的派系是张君劢和张东荪领导的再生社，他们都是在欧洲接受教育的改良派社会主义者，试图将东方哲学与西方政治发展相结合。第二派是罗隆基、闻一多和梁实秋领导的新月社，这是一个在美国接受教育、更倾向于人文主义和自由主义的群体。这两个派系都得到了知识分子和中产阶级专业人士的支持。\n\n民社党誓言要“唤醒民族共同意识，履行社会协调功能，并通过国家力量实现个人自由发展”，主张建立混合经济制度以及由学者主导的民主共和体制。\n\n然而，民社党内的路线之争始终异常激烈。民社党首任主席张君劢摒弃了群众路线，转而利用中国学者的传统特权地位，通过教育和文化来影响政策。然而，许多人不认同张君劢的这种儒家哲学，而是更倾向于通过广泛的民意压力来寻求直接改革。尤其是罗隆基，他公开支持反帝国主义甚至反资本主义的抗议活动。其中一些分歧更是掺杂了个人恩怨——张君劢独断专行的领导风格招致了众多批评，他的领导力正在逐渐减弱。"
 YUN.midgame.102.a: "民主社会党内部的变革愿望推翻了张君劢。"
 YUN.midgame.102.b: "唐继尧对社会主义的忌惮终致张君劢失势。"
 YUN.midgame.103.t: "罗隆基崛起"
 YUN.midgame.103.d: "鉴于当下的情况，张君劢的垮台属于意料之中，但罗隆基迅速巩固了民社党的领导地位却令人颇感意外。尽管张君劢最初誓言夺回权位，但他最终在压力之下选择退出，并完全支持罗隆基接任。\n\n罗隆基在江西吉安长大，少年时正值百日维新遭慈禧太后镇压后的动荡时期。考入清华大学后，他在一一·四运动期间成为学生领袖。罗隆基兼具勇气与热忱，但也有务实的一面——他曾聘请一名魁梧的学生运动员担任保镖。后来，罗隆基远赴哥伦比亚大学深造，他的博士论文以《英国国会选举法》为题。\n\n罗隆基在意识形态上受到哈罗德·拉斯基和其他费边社会主义者的启发，但更倾向于人文自由主义。他推崇美国政府的三权分立体制——两院制立法机构、三权分立的政府以及防止权力过度集中的联邦制。他还融入了传统儒家教育的元素，对社会秩序、教育的变革力量、政府对人民的责任以及“专家政治”的倾向深感兴趣。\n\n北伐失败后不久，罗隆基回到了已经发生巨变的中国，并与昔日同窗闻一多、梁实秋一同加入了新月社。他逐渐开始反对直系的专制统治，并于1929年选举前发表了《论人权》，后来又谴责直系当局效仿查理一世和路易十六的专制统治，并且没有取得任何成效。\n\n1932年上海起义后的镇压中，罗隆基遭到当局迫害，被捕入狱并被列入黑名单。出狱后，他前往广州加入了再生社和中国民主政团同盟，最终在昆明大学谋得了一席之地。罗隆基是一位充满活力的宣传家和活动家，但他仍难以在民社党的左右两派之间取得平衡。"
 YUN.midgame.103.a: "一位值得尊敬的领袖，唐继尧将他奉为座上宾。"
 YUN.midgame.103.b: "又是一个空想自由派，唐继尧礼貌地无视了他。"
 YUN.midgame.104.t: "云南的统治者"
 YUN.midgame.104.d: "唐继尧及其大部分幕僚迁往广州后，云南的日常管理由谁来负责成为了悬而未决的问题。云南省虽然比广东贫穷，但仍是唐继尧不容有失的核心权力基础，否则他的势力将如纸牌屋般迅速崩塌。虽然龙云和胡若愚的忠诚度存疑，唐继尧派对云南省的控制也依然不稳，但当前形势相较唐继尧出征广州之前已经有了很大改善。\n\n周钟岳多年来一直担任唐继尧省府的高级顾问，因此是最稳妥的人选。周钟岳是白族人，曾在日本接受过教育。他本来准备成为一名教育家，但最终被蔡锷聘为秘书长兼教育厅长，并兼任数个重要的经济职务。他还曾在1919至1920年间短暂担任过代理省长。作为一名文化底蕴深厚的资深政治家，任命周钟岳为省长将是唐继尧统治的自然延续。\n\n董泽是唐继尧的妹夫，也是白族人，在蔡锷派他去哥伦比亚大学留学之前，曾担任都督府秘书。护国战争期间，他还曾担任驻香港联络总办。董泽曾任云南大学教师，后任教育厅长，以聘用留学生和推行学校民主管理而闻名。尽管存在裙带关系，但对于云南省来说，董泽或许是一个更加开明的人选。\n\n最后一个人选则是唐继尧之子唐筱蓂。唐筱蓂是一位在日本留学的经济学家，经常出现在父亲的政治集会上，据称他同情中国青年党和中国民主政团同盟。他曾在行政部门和军队中担任过许多低级职务。由于唐继虞目前在贵州主政，唐筱蓂便成了唐继尧在云南最亲近的亲属，而且唐筱蓂也是政坛新面孔。然而，任命唐筱蓂可能会引发严重的紧张局势，有人质疑他无法控制那些不守规矩的小军阀。"
 YUN.midgame.104.a: "周钟岳是最稳妥的人选。"
 YUN.midgame.104.b: "董泽将平衡改革与稳定。"
 YUN.midgame.104.c: "唐筱蓂将追随父亲脚步。"
 YUN.midgame.105.t: "新联省政府"
 YUN.midgame.105.d: "经过数周的讨论，新任广州政府的最终框架已经成型。广州政府将遵循联省主义路线，誓言尊重省级自治并统一各省——优先使用外交手段，必要时也不惜动用武力。在一次快速投票后，唐继尧顺理成章地就任总执政，并任命陈炯明为副执政，以安抚广东联省派。\n\n临时立法机构已经成立，章太炎受命担任总理，负责组织工作。尽管唐继尧和章太炎有不少相似之处，但二人在治理方式上仍存在着一些明显差异。唐继尧主张建立一个更加强大的中央政府，使其能够对抗外来帝国主义，并能够在各省之间进行仲裁。章太炎则时常呼吁废除中央政府，并指出中国幅员辽阔，难以管理，而且历任中央政府多行出卖主权之举，因此他转而寻求赋予各省权力。陈炯明和其他大多数人则采取更为温和的折衷立场。预计新政府将成为两派极端主张之间的妥协产物，并因对外敌入侵的共同担忧而团结在一起。\n\n新政府面临诸多挑战，中国各省正就迫近的统一之战选边站队。各界普遍质疑联省派政权能否化解其内部矛盾，以及能否以和平方式实现这一目标。"
 YUN.midgame.105.a: "联省主义东山再起。"
 YUN.midgame.106.t: "云南联省派统一华南"
 YUN.midgame.106.d: "军阀混战时期，广州曾是多个南方政权的所在地，这些政权无一不力图推翻北京当局的统治。最新自诩为角逐者的是唐继尧，他已将华南数个省份团结在自己麾下。唐继尧的新政府与各路军阀、知识分子、士绅和商人结盟，声称要为中国的联省民主而战——十年前，许多人认为联省主义是注定失败的叛国运动，但如今，联省运动却时来运转。\n\n然而，许多人质疑唐继尧的统治是否真能与他声称要推翻的专制暴政有任何本质区别。多年来，唐继尧的统治风格既有威权专制，也有灵活变通，有时甚至还略带进步色彩，这为他赢得了许多崇拜，也招致了不少批评。"
 YUN.midgame.106.a: "事实证明联省主义并未消亡。"
 YUN.midgame.106.b: "联省运动本应被扫进垃圾堆。"
 YUN.midgame.160.t: "关于人权的思考"
 YUN.midgame.160.d: "在这个渴望复兴中华民族的伟大政治思想家和民族主义者辈出的时代，罗隆基是中国少数卓有建树的自由主义者之一。他于1913年考入北京清华留美预备学校，并在一一·四运动中成为学生领袖。1921年，他先后赴威斯康星大学、哥伦比亚大学及伦敦政治经济学院攻读政治学。1932年孙传芳清剿中左翼和社会主义者后，罗隆基与清华学派在云南寻得庇护，在那里他们继续发表针对当局的自由主义批评文章。\n\n罗隆基在其最新著作《论人权》中写道：“做人，老实不客气，要有做人的快乐，生命要有生命的幸福。要享受生命上的幸福，衣，食，住，及身体安全这几个条件是不够的。”\n\n罗隆基深受西方传统的影响，对从《大宪章》到1789年《人权宣言》的自由主义进行了本体论研究。在他的著作中中，罗隆基将人权定义为个人享有并对社会做出贡献的权利，例如言论自由，并指出侵犯此类权利即构成对自然权利的剥夺。此外，他还进一步阐释了社会契约的本质，并霍布斯的社会契约意象：一个违反其社会契约的国家是不值得服从的国家。人权丧失，便会引发革命——当然，罗隆基澄清道，这并非马克思主义性质的革命（即阶级斗争），而是一场自由主义革命。最后，他总结了法治的重要性，并指出一个国家的法律框架始于深刻理解宪法——一部定义清晰、能够保护所有公民权利的宪法。"
 YUN.midgame.160.a: "我们将尽己所能来支持国家！"
 YUN.midgame.160.b: "但我们也有批评政府的权利。"
 YUN.midgame.161.t: "新月社同仁"
 YUN.midgame.161.d: "中国民主阳光渐暗之际，新月社却散发出一丝光芒。徐志摩英年早逝后，罗隆基、闻一多、梁实秋等人成为了新月社的主导力量，这批中国知识分子纷纷逃往西南，希望为自己找到一个安全的思想港湾。\n\n潘光旦毕业于清华大学，后留学美国。他是一位社会学家、优生学家和民族学家，最感兴趣的是研究云南和中国西南地区的少数民族。\n\n朱光潜曾离开中国大陆，前往香港大学这所位于使馆城市的著名西式学府求学。在校期间，他深受梁启超和胡适新文化运动的影响，并将他们的思想与自己对美学和心理学的兴趣紧密联系在一起。\n\n吴文藻是一位社会学家、人类学家和民族学家，对藏族研究颇感兴趣，深受伯特兰·罗素、约翰·杜威、孙中山、胡适和梁启超等人作品的影响。他毕业于清华大学，曾在美国留学过一段时间。\n\n李公朴曾是中国国民党党员，但早在北伐战争期间国民革命军一败涂地之前，他就已和国民党划清界限。之后，他移居美国，并就读于里德学院。在美国短暂停留后，他回到上海，与刘西、艾思奇等社会主义者一同担任报纸编辑。1932年上海起义爆发后，孙传芳的残酷清洗运动席卷了华东各省，李公朴和他新月社的其他朋友一起逃往云南。"
 YUN.midgame.161.a: "他们对学术界的贡献难以估量！"
 YUN.midgame.161.b: "他们的参与对于民主至关重要！"
 YUN.midgame.162.t: "章疯子与苏报案"
 YUN.midgame.162.d: "就在不到一代人之前，革命思潮激荡于神州大地，仁人志士们敢于梦想一个复兴的自由国度。章太炎和许多英勇先烈一道，作为一名爱国者加入了争取自由的行列。1903年，在与康有为和孙中山就革命路线问题产生分歧（他认为康有为排满立场不够激进）后，章太炎发表了《驳康有为论革命书》，批判满清君主制，并为邹容的《革命军》撰写了序言。章太炎的序言刊载于激进派报纸《苏报》——一份公开号召推翻清廷的刊物上。\n\n因苏报报馆地处上海公共租界司法管辖区，清廷与租界工部局当局遂以煽动叛乱罪名对章太炎和邹容展开审判。初审判决中，清廷主张的严苛刑罚震惊了西方社会——在西方势力的干预下，二人最终被判三年监禁。章太炎服刑期间，这位狂热的革命者在狱中仍然奋笔疾书，疾呼“上天以国粹付余”。\n\n章太炎、邹鲁二人都曾绝食抗议满清政府对言论自由的粗暴压制。不幸的是，邹容由于体质虚弱，加上绝食，导致他二十岁便英年早逝。章太炎坚持熬过了磨难，并坚称是他对佛经近乎狂热的研读让他从这场磨难中活了下来。\n\n出狱后，章太炎成为了著名的民族英雄和革命英雄。他直言不讳，热情奔放，热衷于建设一个真正自由民主的中华民国，因此被戏称为“章疯子”。这位英雄的丰功伟绩在书籍、小说和课堂上广为传诵，被誉为反抗帝国主义的英雄之一。如今，民族主义者要么将苏报案视为言论自由的典型案例，要么将之视为先烈为驱逐帝国主义者不惜牺牲的壮举。"
 YUN.midgame.162.a: "言论自由值得为之献身！"
 YUN.midgame.162.b: "我们既要驱逐满清，也要驱逐帝国主义者。"
 YUN.midgame.163.t: "民治党的方向"
 YUN.midgame.163.d: "1925年后，唐继尧曾试图游说段祺瑞以争取北方的支持，但未能成功。1926年7月，为了对抗华南兴起的革命派，唐继尧组建了自己的政党。如今的民治党声称拥有一套独特的、不受外国影响的意识形态，并与章太炎的国粹思想相结合。民治党倡导联省主义性质的民主，摒弃专制的先锋队领导，同时也力求与国粹理念相契合。部分醒狮社成员也因理念契合加入了唐继尧的民治党。\n\n国粹思想源自于日本“国体”概念，旨在创造中国自己的国体，并通过研习中国经典来领悟中华之道。章太炎等民族主义者回顾了中华文明被北方野蛮游牧民族掠夺本性玷污前的全盛时代，那时中国的文化、疆域和社会都保持着高度完整。国粹思想主张民族先于国家存在，但民族归根究底也需依托制度载体存在。在形成了自己的国粹后，中国将帮助其他受压迫的国家（例如印度）找到自己的国粹。\n\n虽然唐继尧和章太炎的出身截然不同，但在瞬息万变的中国政治格局中，他们找到了共同点。章太炎于1922年创立了自治运动促进会，并寻求军事支持，但他的追随者大多由知识分子（例如国学保存会）组成，而这些人更倾向于研究中国英雄史诗和经典著作，章太炎则屡次为他的革命运动寻求军事支持。前往云南后，章太炎得到了唐继尧民治党的强烈支持——民治党正试图将自己的联省主义意识形态与章太炎的“国粹”民族主义相融合。"
 YUN.midgame.163.a: "我们将真正致力于实现联省主义！"
 YUN.midgame.163.b: "我们将真正致力于实现国粹思想！"
 YUN.midgame.164.t: "云南雄主唐继尧"
 YUN.midgame.164.d: "多年来，唐继尧一直主宰着云南省。尽管被许多人斥为军阀，但他只是中国风云变幻的革命史中众多复杂人物之一。\n\n唐继尧出身富裕家庭，与许多同龄人一样，立志要学有所成。他曾在东京学习军事，期间加入了陆军团和武学社。作为《武学杂志》的编辑之一，历来爱国的唐继尧加入了同盟会，成为早期会员。然而，当日本政府镇压留学生时，他却拒绝参与罢课抗议，因此曾被怀疑不忠，甚至传出向云南咨议局告发同学的流言。唐继尧批评日军接受的“精神教育”，转而提倡深入研究王阳明思想。他与传奇将领蔡锷结为好友，并帮助蔡锷策划了1911年的昆明重九起义。\n\n辛亥革命缔造中华民国后，一向谨慎的唐继尧在军阀混战之初改良派与革命派的持续冲突中，最终选择站在改良派一方。蔡锷逝世后，唐继尧治下的云南时而介入两广政局，时而选择置身事外静观其变。唐继尧是一位坚持以文职身份统治的军人，虽然名义上置身军队体系之外，但毫无疑问的是，他始终牢牢掌控着军权及省内事务。唐继尧也是一位声名显赫的人物，他的肖像在钱币、学籍和报刊上随处可见——毫无疑问，唐继尧在中国西南各省拥有不可估量的影响力。追随者要么为唐继尧的军事才干所折服，要么是信奉他的革命理想，总之云南全省军民皆唯其马首是瞻。"
 YUN.midgame.164.a: "唯唐公马首是瞻！"
 YUN.midgame.164.b: "唐公即道统化身！"
 YUN.midgame.165.t: "唐继尧的核心集团"
 YUN.midgame.165.d: "唐继尧将自己塑造成一位强人、中国苦难之世里的救星，甚至在1926年以护国战争为背景的电影《洪宪之战》中扮演自己。当然，若没有亲信辅佐，强人也难以施政。唐继尧麾下的核心团队由军政要员组成，他们宣誓效忠云南的秀丽山川，并将永远追随这位滇系军阀的强力领导。\n\n王九龄是一位留学日本的云南政治家。他参加了云南重九起义，并因对新共和政权的忠诚获得了高官厚禄，现任唐继尧的秘书兼财政总管。作为一名善于斡旋的谈判专家，王九龄协助促成了与北洋政府的几笔交易，并被授予段祺瑞政府教育部总长的职位。1924年，他回到云南，在盐业委员会和富滇银行工作。\n\n丁兆冠也是一位留学日本的政治家，曾在四川省财政厅任职，后返回云南担任云南政法专科学校校长。丁兆冠是一位杰出的律师，后来成为一名法官，并担任唐继尧的法律顾问。\n\n孟有文是唐继尧的警卫旅旅长，负责保障这位军阀的安全，防止其受到省内外敌人的谋害。唐少卿和何世雄是云南陆军讲武堂出身的军官，据说是唐继尧最信任的将领。他们二人曾表示无论前路如何，都将誓死追随唐继尧。"
 YUN.midgame.165.a: "省建工作靠的是财政和行政。"
 YUN.midgame.165.b: "枪杆子当然比笔杆子更强大。"
 YUN.midgame.190.t: "土匪和军阀"
 YUN.midgame.190.d: "辛亥革命导致中央政府权威瓦解前，云南的匪患便已肆虐多年，革命后动荡混乱的局势更让土匪团伙与军阀势力趁势而起。在整个二十年代，失业矿工、心怀不满的退伍军人和饥肠辘辘的村民组成土匪团伙，不仅横行乡野，更频繁出没于城乡要地。当然，在许多人眼中，军方将领、当地军阀和小股土匪之间几乎没有区别，二者之间的界限时常模糊不清。过度军事化也是导致省内土匪猖獗的原因之一。军阀和将领们征召了成千上万的壮丁、民兵和准军事人员，却因财力有限屡屡拖欠军饷，致使众多历经沙场、手段凶悍的退伍士兵沦为土匪、街头帮派成员或地主武装的雇佣兵。\n\n甚至连唐继尧的私人秘书李韫焜也被指控与张结巴、吴学显等云南悍匪勾结。这些土匪势力凭借其纠集的大量退伍士兵，以发动叛乱、横行乡里而恶名昭著。他们不仅劫掠财物、粮食、军械与银元，更猖獗走私鸦片——尽管鸦片通常被云南省府明令禁止，却始终是畅销商品。这些土匪令人闻风丧胆，尤其是在乡村农民中，像张结巴会吃掉敌人心脏的恐怖故事和谣言更是广为流传。\n\n随着这些土匪团伙规模不断扩大，并在[ROOT.GetNameDef]领内组织起来，形势正愈发严峻，民众对联省运动的支持也开始动摇。虽然联省主义当然倡导地方民主和自治，但缺乏民众支持将使任何对联省革命的热情都化为泡影。另一方面，尽管有人指出剿匪是必要之举，但这也会严重消耗政府的资源和能力。"
 YUN.midgame.190.a: "土匪可以被驯服，只是需要时间。"
 YUN.midgame.190.b: "必须采取行动！"
 YUN.midgame.191.t: "军阀与思想家"
 YUN.midgame.191.d: "尽管许多人都同意，由于帝国主义者正图谋侵吞整个中国，因此中国革命必须依靠军事力量才能取得胜利，但那些主张更彻底“民主革命”的群体与政府之间的紧张关系，却使政府官僚体系陷入困境。\n\n在章太炎等学者知识分子的带领下，对[ROOT.GetLeader]领导层的批评日益增多。在这些批评者看来，[ROOT.GetLeader]如同独裁者，通过实施审查制度和增加军事预算来压制学术发展。事实上，对于最激进的联省派和自由派来说，联省政府的存在本身就是暴政和对人民的压迫。这些激进分子认为，中央政府、宪法、国会和国家行政机构的存在只会将国家带向中央集权独裁或无休止的内战。相反，他们鼓吹必须维护地方自治，在没有中央权力的情况下，地方自治仍能良好运作。在他们眼中，宪法、国会和总统这三大弊端必须根除，联省军队也应解散，军事权力应该掌握在各省手中。只有这样，军队才会用于共同防御，而不是用于剥削人民。\n\n这些想法在很大程度上得到了军方将领和各地军阀的支持，他们渴望保留不受中央管控的自治权，并承诺将军事力量用于保卫本省安全。然而，中央集权派和民族主义者指出，此类想法实质助长了军阀割据，将军们只会为了一己私利而垄断本省权力。"
 YUN.midgame.191.a: "中央政府将催生中国的萨文科夫。"
 YUN.midgame.191.b: "这只不过是欲盖弥彰的军阀行径。"
 YUN.midgame.192.t: "古老恶习"
 YUN.midgame.192.d: "罂粟花看似无害，却引起了全国各地民族主义者的鄙视和仇恨。这种俗称鸦片的植物能让吸食者服用后产生毫无痛楚的欣快感，还能让人逃离现实，遁入狂想。\n\n尽管鸦片长期被列为违禁品，但国内各地仍然广泛滥用，这早已不是什么秘密。中国西南地区当然也不例外，西南气候干燥炎热，非常适合种植这种被诅咒的植物。上至社会名流，下至街头乞丐，无不吸食鸦片；最常见的方式是吸食大烟，感受那令人陶醉的罂粟花香在城市街道上自由飘荡。鸦片从南亚和东南亚运到云南，再销往中国其他地区。尽管政府名义上禁止鸦片，但由于县长和执法人员通常在收受贿赂后睁一只闭一只眼，鸦片监管依然漏洞百出。\n\n在[ROOT.GetNameDef]领内，腐败问题不仅波及鸦片管制，还蔓延到对铜矿等公共资源的控制和垄断。政府中的显要人物与这些士绅新贵有着密切联系，这招致了人们的质疑和唾弃。这种不加掩饰的腐败行径尤其引起了活动家和记者的强烈谴责。"
 YUN.midgame.192.a: "抽烟放松无伤大雅。"
 YUN.midgame.192.b: "必须彻底肃清腐败！"
 YUN.midgame.193.t: "民族主义与联省运动"
 YUN.midgame.193.d: "随着联省运动日益壮大，民族主义者和爱国人士愈发担心，联省运动对地方省级自治的支持将导致国家分裂而非统一。尽管民族主义者都渴望看到从沈阳到昆明的国家统一，并夺回帝国主义占领的国土，然而这种国家认同与日益强烈的地方身份认同产生了冲突。过去几十年的军阀混战表明，人们对地方政府、城镇、市长以及省长更加信任，但仅此而已。\n\n诚然，地域认同可能会对中华民族的团结构成挑战。尽管书面汉语是全国一致的，但从粤语到闽南语、客家话、苗语，各种方言的差异远不止语调发音区别，这些方言本身也可以被归类为独立的语言。\n\n民族主义者宣称，联省运动是为了捍卫国家统一，这个国家指的就是中国，而且永远都只会是中国。然而，随着权力下放和地方自治日益受到重视，越来越多的声音，尤其是联省阵营内部的声音，认为民族主义只会滋生中央集权，真正的民主应当属于中国众多的民族和部落，而非单一的民族国家概念。"
 YUN.midgame.193.a: "让我们减少地方主义言论。"
 YUN.midgame.193.b: "国家属于各个民族，而非某一民族。"
 YUN.midgame.194.t: "打破精英主义桎梏"
 YUN.midgame.194.d: "新月社得名于印度博学家泰戈尔的《新月》诗集，且一直以其伪精英主义组织身份为傲。曾参加孙中山先生葬礼的新月社成员陈西滢在其《中山先生大殡给我的感想》一文中写道，空喊口号却鲜有哀思的青年群体，显露出极为轻浮之态。\n\n事实上，新月社成员普遍认同应由精英群体主导革命，而非由大众引领革命进程。罗隆基曾呼吁“专家治国”，并将这一理念与萧伯纳的思想相提并论，而梁实秋等人则受欧文·白璧德启发，同样对极端激进思想深恶痛绝。尽管新月社成员逻辑严密、精于算计，推崇理性克制的古典价值观，而非迎合激进解放的普遍氛围，但这并不代表他们完全否定了情感与想象力。\n\n虽然全国各地的民主人士都自诩代表平民，但很少有人能真正宣称自己曾与在田间辛勤劳作的农民共度数年、数月哪怕数日。然而，随着联省运动的支持率不断攀升，新月社和其他亲民主的政党纷纷呼吁立即结束军事统治，实行民主制度。当然，鉴于这些民主团体的历史，他们究竟是为了一己私欲而追名逐利，还是真正为人民谋福利，这的确是一个值得深思的问题。"
 YUN.midgame.194.a: "我们必须和先贤一样引导群众。"
 YUN.midgame.194.b: "我们岂不是成了小独裁者……"
 YUN.midgame.195.t: "《我努力的是什么》"
 YUN.midgame.195.d: "梁实秋近来在《光明报》上发表了《我努力的是什么》一文。这篇文章迅速在中国各地的报刊媒体上传播开来，许多人将它视作梁漱溟最优秀的作品，也是中国民主运动的真正宗旨。\n\n一、贯彻反帝主张，恢复领土主权之完整，反对中途妥协。\n\n二、实践民主精神，结束独裁，设置各党派国事协议机关。\n\n三、加强国内团结，所有党派间最近不协调之点，亟应根本调整。\n\n四、督促并协助联省运动切实执行建国纲领。\n\n五、确立国权统一，中央与地方权限，须为适当之划分。\n\n六、军队属于国家，军人忠于国家，反对军队中之党团组织，并反对以武力从事党争。\n\n七、厉行法治，保障人民生命财产及身体之自由，反对一切非法之特殊处置。\n\n八、尊重思想学术之自由，保护合法之言论出版集会结社。"
 YUN.midgame.195.a: "我们的事业是正义的！"
 YUN.midgame.195.b: "这并无任何特别之处。"
 YUN.midgame.300.t: "华南邦联"
 YUN.midgame.300.d: "黄兴的井字旗如今如今高扬于昆明城头。[YUN.GetLeader]政府的代表今天抵达广州，正式宣布与广州建立华南邦联。事实上，早在二十年代初，联省派就曾讨论过，甚至梦想过建立一个邦联，以抵抗北京当局的反复无常和国民党的独裁统治。护国联盟和护法政府的梦想，即在民主政府治下统一中国的真正共和梦想，有朝一日终将实现。\n\n随着云南联省运动的蓬勃发展，从城市街头到最高政治机构，希望与统一的热潮正席卷各阶层。虽然唐继尧表面上一直是联省派，但随着直系胜利和宣统复辟，联省运动面临着真切的不安与崩溃。如今，华南已团结于一个联省派邦联之下，在中国各省组成的邦联下实现国家统一的梦想已近在咫尺。当然，由于联省主义是这场民主革命的主要意识形态，章太炎在政府中的声音正变得更加响亮。章太炎无疑拥有强烈的联省主义倾向，虽然他的主张相当激进玄奥，但与他合作将会是一段有趣的经历。\n\n作为云南省长与滇军统帅，唐继尧还得决定他的主要对手兼下属——雄心勃勃的昭通镇守使龙云的命运。诚然，龙云为唐继尧立下的汗马功劳让他一直备受钦佩，但两人为争夺云南的控制展开激烈竞争也早已是不争的事实。唐继尧的一些私人顾问建议干脆将龙云提拔为广州和昆明之间的联络官（这其实是一个毫无价值的虚职），从而削弱他的势力，实际上相当于永久流放。另一方面，龙云的影响力和经验仍可以发挥作用，让他继续掌权或许对唐继尧更加有利。"
 YUN.midgame.300.a: "联络官这个新职位相当适合他。"
 YUN.midgame.300.b: "将他留在身边并进行严密监视。"
 YUN.midgame.301.t: "民主教育"
 YUN.midgame.301.d: "华南联省革命成功后，秉持联省主义原则的中国民主革命浪潮现已席卷云南。护国战争时期弥漫街头的革命热情，如今再度充斥在昆明和大理的街巷之间；罗隆基和新月社如今频繁前往广州与联省派大本营展开谈判和合作。在新月社缺席的情况下，云南本地的民主组织和政党如雨后春笋般涌现，并在地方政治中占据了主动。\n\n唐继尧的大众教育计划旨在普及基础教育，增加小学、职业学校、夜校和师范学校的数量。该计划的具体实施由苏鸿纲和寸树声二人主持，他们负责兴建学校并配备师资。由于师资匮乏，他们二人邀请了来自北方的学者和知识分子，这批北方来客因此获得了“北京派”的称号。虽然北京派的著作被省内保守派批评为过于激进，但在苏鸿纲和寸树声的力保下，他们仍然留在了教学岗位上——这可能是由于缺乏足够的专业人才。\n\n这些教育项目吸引了众多左翼激进分子。雄心勃勃的省内爱国学生吴澄、赵琴仙领导的激进学生团体与左翼力量结成统一战线，组建了一个名为“新滇社”的组织，该组织由工团党提供资金支持。这类左翼激进团体的成立自然引发了唐继尧的警惕，虽然这些团体的民族主义口号和理念无疑能引起其他民主革命人士的共鸣，但他们激进的左翼理想和阶级斗争宣言可能会带来问题并造成分裂。或许，打击这些激进左翼团体并限制他们参与公开集会才是更好的选择。"
 YUN.midgame.301.a: "这些团体是我们民主行之有效的证明。"
 YUN.midgame.301.b: "密切监视他们并做好重拳出击的准备。"
 YUN.midgame.302.t: "处理军区"
 YUN.midgame.302.d: "根据唐继尧先前实行的联省模式，在宪法制定完成前，省政府是最高权力机关，作为省长的唐继尧拥有几乎不受约束的无限权力，可以任免所有官员。在云南总商会的大力支持下，唐继尧政府曾试图实施军政分离，并将云南划分为四大军区：胡若愚的昆明军区，龙云的昭通军区，李选廷的大理军区，张汝骥的蒙自军区。\n\n尽管政府机构表面上功能健全，但唐继尧治下的分权体制自然导致各个军区乱象丛生。赋予镇守使独立辖区反而助长了割据势力，军队也经常向地方县市勒索钱粮以充军饷。\n\n入侵广西失败后，由于担心国民党会趁机进犯云南，唐继尧重组当初划分的四个军区，并将张汝冀送上法庭，结果导致龙云乘乱夺取了昆明，胡若愚控制了蒙自，李选廷则仍占据着大理。然而，1927年反政变爆发后，唐继尧再次重组了四个军区。最终，唐继尧控制了昆明，龙云被赶回了昭通，胡若愚、李选廷和张汝骥则被困在蒙自。胡若愚的前部下、张汝骥的竞争对手孙渡被授予了大理镇守使一职。\n\n鉴于云南现已成为民主革命的关键力量，这些军区似乎已无继续保留的必要。唐继尧可以顺应省内民主派的要求，正式废除这些军区，并将权力重新分配给各县和地方省议会。另一方面，将地方统治权托付给这些民主人士可能会收效甚微，甚至导致无政府状态——或许，任命龙云旧辖区中的效忠者才能确保和平与稳定。"
 YUN.midgame.302.a: "是时候相信人民的意志了。"
 YUN.midgame.302.b: "让这些军区维持现状就好。"
 YUN.midgame.303.t: "地方主义与共和国"
 YUN.midgame.303.d: "作为中国西南最边远的省份，云南虽早在汉朝初年即被纳入中国版图，却始终保持着独立自治的历史传统。在蒙古人征服云南之前，该省一直由南诏国和大理国统治，这与中原王朝治下其他地区截然不同。此外，小乘佛教的影响进一步强化了云南有别于中国其他地区的独特地方文化。清朝初年，吴三桂曾试图自立为帝，这一云南早期的独立尝试最终宣告失败；晚晴时期，杜文秀领导的回族起义也曾试图建立“平南国”，但仍以失败告终。哀牢山彝族部落首领李文秀亦曾揭竿而起，反抗汉族统治者的压迫。\n\n清末，云南民众对满清统治者乃至汉族官僚的强烈不满，最终引发了独立思潮和零星的暴力冲突。清廷覆灭后，云南涌现出了“决死会”、“保地会”、“兴汉会”等一批组织，他们公开要求云南立即脱离中央政府的管辖。\n\n中华联省联邦政府的最终目标是将中华民国的所有领土主张统一到一面国旗之下，这自然意味着云南将再度被纳入中央政府的管辖，如此做法激怒了地方派和章太炎阵营的支持者——他们认为云南的身份认同与北京存在本质差异。也有人指出，唐继尧虽然同样倾向于更具地方特色的区域认同，但正如他曾公开宣称的那样，他的真正志向在于建立一个强大的国家以抵御并击败帝国主义者。诚然，共和国高于所有省份，难道这不重要吗？"
 YUN.midgame.303.a: "我们拥有独属于自己的地方身份认同！"
 YUN.midgame.303.b: "我们唯有团结一致才能组成一个国家！"
 YUN.midgame.304.t: "省级宪政"
 YUN.midgame.304.d: "民国初年，共和主义和联省主义的理想并未因军阀混战的现实而消退；在云南，仍有许多人希望该省能像湖南那样拥有一部自治宪法。当时，唐继尧拒绝承认像湖南那样的省级宪法，转而反复强调建立一个强有力中央政府的必要性，认为此举可以消除军事冲突与军阀割据。即使在曹锟颁布1923年宪法后，唐继尧仍旧拒不承认北京政府的立法，并始终坚守其政治信念。\n\n即使在1929年直系重掌中央政权后，唐继尧仍未接受制定省宪的要求，这让商贾士绅得不受约束地施加政治影响力，因此他们一直支持唐继尧的立场。然而，自广州联省政府成立以来，全省各地的民主派和亲民主团体一直要求立即制定一部地方省宪，以保障集会、财产、言论和追求幸福的基本权利。\n\n面对省内因又一年缺失宪法保障而日益加剧的动荡与不满，唐继尧再次面临着起草颁布云南省宪的挑战。唐继尧的顾问们建议他谨慎行事，据说，即使唐继尧同意制定省宪，这也将是一个缓慢而艰巨的过程，需要完成大量的起草和修订工作。另一方面，联省运动的成败取决于能否将国家统一在井字旗之下——在此目标达成前，个人自由的保障仍需等待。"
 YUN.midgame.304.a: "我们将缓慢地开始起草省宪。"
 YUN.midgame.304.b: "统一至关重要。"
 YUN.midgame.305.t: "《两年半的乡村工作》"
 YUN.midgame.305.d: "寸树声生于云南腾冲县和顺乡。幼年时在家读私塾，后就读于和顺高等小学堂。1911年，他考入大理中学，1915年毕业后回乡任和顺高等小学堂教师。之后他赴日本留学，留日期间逐渐萌生了左翼思想并加入了创造社。\n\n在云南，他担任了益群中学校长，并因此名满全省。他认真按照斯巴达式的严格训练和求实精神培养学生。主张师生自己动手除草、挑土、种菜、植树，修整校园，就连全乡道路的清扫也由学生承担。学校还组织了学生消防队、学生农村生产运动队，参加乡里灭火，帮助农民冬耕，保护森林，兴修水利，发展渔业和家禽副业，把学校同社会结合起来。为了提高教学质量，寸树声从昆明延请了一批学有专长的教师任课。\n\n寸树声总结了自己在益群中学的实践经验，写成《两年半的乡村工作》一书。吴晗等评论家盛赞这本书说：“星星之火，可以燎原，和顺乡的火炬，将会给全国全民族以光明的启示。”\n\n凭借寸树声在云南省乃至全国政坛的新地位，他的影响力无疑有助于巩固唐继尧政权。自然，寸树声支持唐继尧的民族主义，并愿意与唐继尧合作，帮助他将中国从帝国主义的阴影中解放出来。但他也批评了唐继尧的专制作风。由于他与创造社间的左翼和民主立场联系，他对唐继尧政权的批评无疑将利好云南的左翼势力。"
 YUN.midgame.305.a: "唐继尧将完成革命！"
 YUN.midgame.305.b: "唐继尧就是个暴君！"
 YUN.midgame.306.t: "新的立法机构？"
 YUN.midgame.306.d: "在二十年代，与许多其他督理一样，唐继尧也试图在他的家乡推行民主改革。在一次雄心勃勃的立法机构改革中，唐继尧尝试重新分配代表席位，允许贫困地区通过选举产生代表。这些改革将扩大社会各阶层的参与度，但却遭到了保守派的抵制，他们不愿接受更加稀释的民主程序。尽管云南省法律没有明文规定，但选区划分实际上主导着选举进程，因为立法机构的议员们可以自行划定选区边界。\n\n然而，由于政学系和顾品珍持续阻挠强化立法机构的做法，导致省议会分裂成了数个敌对派系，各派系不断争斗并推举各自的候选人。此外，省议会的分裂只会在社会各阶层中传播可怕的紧张气氛，左翼积极谴责地方士绅商人的阶级主义和精英主义态度，称他们剥夺了不幸的兄弟姐妹们参与民主的机会。时至[GetYear]年，立法机构已基本上陷入高度僵化，省议会主要掌握在云南的士绅、商人和其他地方（军阀）精英手中。云南民主人士敦促重新划分选区，取缔不公正的选区划分，以划定更公正的选区边界。当然，这引起了保守派和那些倾向于维持现状之人（例如胡若愚阵营）的愤怒；他们反而坚称暂不举行新的选举。由此引发的强烈反弹促使民主人士与云南左翼力量（如新滇社）结成同盟，并激起了大规模抗议浪潮。"
 YUN.midgame.306.a: "暂无举行新选举的打算。"
 YUN.midgame.306.b: "好吧，也许他们有道理。"
 YUN.midgame.307.t: "校园战争"
 YUN.midgame.307.d: "自1902年光绪皇帝下诏关闭昆明书院等传统学校，并将其改组为现代学校起，云南省的教育体系已经发生了巨大变化。两所男女师范学校应运而生，此外还有矿业学校和法政学校。到二十年代，昆明的10所现代学校已招收约2000名学生，这些学生自然积极投身于政治活动。尤其是那些前往北京等主要城市学习后返回云南的学生，他们的思想正变得愈发激进。\n\n这场风波始于在省立第一中学走廊里散发的一本谴责唐继尧政权的小册子。小册子大胆宣称唐继尧及其麾下军阀准备征召所有学生入伍，强迫他们参军。小册子还提出了一系列要求：国民革命必须坚持反帝立场，停止一切军事拨款以支持省级发展，奉行和平主义以摧毁军阀势力，以及恢复被取缔的团体，例如《滇潮》学刊和大同会。这起初只是一场简单的抗议，但很快蔓延到其他学校，学生们纷纷要求关闭云南陆军讲武学校。暴力事件已不再仅是斗殴和口水战；军校校长现已明令禁止学生携带刀具。\n\n唐继尧尝试采用威逼利诱的方式而非直接动用武力镇压学生，并重申了自己在高校中的影响力，以及推动了大学改革，传播了他的意识形态等等。在妹夫董泽的支持下，唐继尧创办的东陆大学力图成为仁爱教育的典范。东陆大学的效忠派倾向招致了招致了激进学生的仇恨，他们认为东陆大学不过是当局的个人崇拜产物。激进学生与东陆学生之间的冲突日益频繁——校长们已恳求唐继尧迅速采取行动。"
 YUN.midgame.307.a: "这些学生将付出血的代价。"
 YUN.midgame.307.b: "让我们现在都先冷静下来。"
 YUN.midgame.308.t: "云南地方自治"
 YUN.midgame.308.d: "作为唐继尧最直接的民主改革措施之一，他此前曾试图加强云南的地方自治，并计划在当地村庄建立由社会各层人士组成的委员会会议和部门——此举虽然本意良好，却引起了地方领导层的愤怒。\n\n村长和官员们以资金短缺和缺乏训练有素的人员来执行自治方案为由，谴责唐继尧的计划毫无希望，简直是愚蠢的空想主义。在全面实施改革措施的地区，官员们则抱怨道，委员会会议从日落到日出，几乎没完没了，由于彻夜争吵，几乎没有达成任何妥协，最终也没有取得任何成果。在唐继尧的首次试点中，他尝试将自治方案调整到大约八个相对富裕的县（昆明、阿迷、蒙自、宜良、个旧、思茅、会泽和腾冲），毕竟这些较为富裕的县拥有更多受过教育的民众。这些尝试在一些地方取得了成功，但贫富差距仍在不断扩大。\n\n1923年，马关县的时任县长和新当选的地方自治委员会主席之间也爆发了权力斗争，导致县长被罢免。然而县长却拒不卸任，由此引发的混乱造成了严重粮荒。随后，马关县城被彝族匪首王世珍攻占，他赶走了县长，夺取了政权。\n\n随着联省运动蓬勃发展，将权力下放给国内各地城镇、乡村和小城市的呼声不断高涨，唐继尧重申了他先前的地方自治计划，希望能为联省革命赢得更多支持。士绅们自然持反对立场，鉴于唐继尧过去的失败，他们认为此类举措纯属浪费资源，并坚持维持现状，让一切仍按现有模式进行治理。"
 YUN.midgame.308.a: "士绅们说的对。"
 YUN.midgame.308.b: "谁会在意这帮士绅，唐继尧才是对的。"
 YUN.midgame.309.t: "挥之不去的匪患"
 YUN.midgame.309.d: "在护国战争爆发前蔡锷主政云南期间，他曾上书北京政府请求允许滇军撤离贵州。唐继尧虽然支持这一请求，但袁世凯为笼络贵州士绅，转而任命唐继尧为云南都督。虽然袁世凯曾警告唐继尧不可开创一省兼并邻省之先例，但贵州战役还是为唐继尧肃清匪患提供了正当理由。\n\n贵州远征巩固了唐继尧的云南都督地位。总而言之，黔军被强行解除武装，其中大批人员在唐继尧的监督下遭到处决，遗体则被抛入万人坑以儆效尤。其余贵州军民也未经审判即遭囚禁，唐继尧尤其针对自治学社成员和哥老会帮众。这场血腥镇压既源于当时激烈的派系斗争，更源于唐继尧对贵州所谓“奸盗匪徒”的极端憎恶。\n\n最终，唐继尧凭借与宪政预备会的关系成功控制了贵州一省。宪政预备会拥护唐继尧的执政理念，并负责贵州行政运作。唐继尧夺取贵州的手段虽然残酷，但无疑也为治理匪患开创了有效的先例。众所周知，云南地广人稀，群山密布，土匪猖獗。昆明驻军时常与当地犯罪团伙暗中勾结，甚至公开加入这些团伙。这帮盗匪曾一度公开出售掠夺来的财物，并在街上绑架妇女。据报道，一些富裕人家的孩子也被从学校绑架并被勒索赎金。鉴于土匪问题挥之不去，我们或许需要动用铁腕来维护法律和秩序。另一方面，随着战争持续，人力短缺的问题日益严重，让土匪（很多土匪是退伍军人）参军服役造福人民将会有所帮助。"
 YUN.midgame.309.a: "这帮土匪不值得任何宽恕。"
 YUN.midgame.309.b: "他们是只认金钱的雇佣兵。"
 YUN.midgame.400.t: "广州全国代表大会"
 YUN.midgame.400.d: "拿下广州后，国民党军政府终于拥有了足够的合法性来召开一次全国党代会。而参加这次代表大会的成员预计将远不止那些当初躲藏在贵州的军人们。国民党右派由众多派系组成，甚至在国民党开始北伐之前，这些派系就已经四分五裂了。\n\n在孙中山去世后，国民党右派因为争权夺利而陷入内斗，他们大致可分成三个派系。“旧右派”主要由胡汉民的支持者组成，这一派包括众多支持自由主义与旧同盟会的文官派系，如元老派和西山派，更为松散的再造派和旧政学系也算是其中一员。“新右派”则是指那些蒋介石的追随者，他们曾暂时支持与中国工团党组成统一战线对抗“旧右派”，但最后还是与国民党左派撕破了脸。这一派包括黄埔系、革命同志会浙江社及其各种右翼分支。最后一派则是所谓的“地方右派”，指那些与国民党结盟但更在乎自己的一亩三分地的军阀，如新桂系、新粤系和第三军系——每个派系都或多或少地融入了国民党的组织机构中。\n\n人们担心，这些长期对立的派系即使共处同一阵营之下，最后也会变成无休止的内斗。夺下两广后，新桂系的李宗仁、新粤系的陈济棠，以及“莫斯科委员会”的领导人，如元老派的胡汉民和西山派的林森等人，都在中央委员会中获得了席位作为安抚。再造派的孙科虽然缺席大会，但也因其父的地位获得了一个席位。而各派系的许多追随者都希望能获得一个党内的闲职来作为对自己忠诚的回报。"
 YUN.midgame.400.a: "我记不得这许多名字……"
 YUN.midgame.401.t: "旧右派内的分歧"
 YUN.midgame.401.d: "过去十年中，国民党右派大部分时间内都由胡汉民及其莫斯科委员会领导，至少在国际上是如此。随着蒋介石的去世以及他的军队撤至贵州，流亡海外的胡汉民主导了国民党右派知识界，与汪精卫及其巴黎委员会展开了一场论战。因此，在胡汉民发现自己拥有的所谓“权威”对身边那些“粗鲁”而“无礼”的军人毫无影响力时，他自然怒不可遏。\n\n时间一天天过去，而旧右派和主导贵州的地方右派之间却无法达成任何共识。尽管莫斯科委员会里塞满了势利小人，但胡汉民似乎坚持认为，不论党内再怎么内斗，都会默认他担任党的领导者。胡汉民自信到了近乎傲慢的程度，他甚至希望那些将军们会乞求他去领导——不过此举并非毫无明智之处，因为胡汉民不甘心只做一个傀儡。他坚定不移地试图推进其长远规划，其心意之坚与穆斯塔法·凯末尔颇为相似。\n\n朱培德的领导地位则来源于他之前在军政府中的一把手地位，而由于范石生、金汉鼎和朱德等人在第三军内部挑战其领导权，朱培德的领导地位遭受了严重打击，这些人都要求进一步分享权力。胡若愚出席了广州会议，但龙云依然留在昆明，对国家大事不感兴趣。随着第三军陷入混乱，许多云南代表都急切地希望回到滇省以避免老家再度生变。然而，若是这么做，必将减少他们在当前谈判中的筹码。"
 YUN.midgame.401.a: "广州才是我们的重中之重。"
 YUN.midgame.401.b: "让他们回家盯着龙云。"
 YUN.midgame.402.t: "重回黄埔岸"
 YUN.midgame.402.d: "第三军并非唯一一支在重返广州后经历重大动荡的部队。当那些高级军官们回到自己昔日的母校朝圣时，何应钦将军能感受到自己队伍里蔓延着的紧张气氛。尽管尚未有人跳出来公开挑战他的权威，但对他领导能力的质疑之声不绝于耳，那些旧日的恩恩怨怨也逐渐浮出水面。\n\n何应钦的“元老派”是黄埔系本流，他的这些忠诚追随者都是一群保守的军人，他们接受的教育要求他们严守党的正统思想。而何应钦则通过黄埔同学会向追随者们施加影响力，黄埔同学会起初由蒋介石创立，旨在与邓演达的左派黄埔革命同学会抗衡。\n\n眼下已经有两个有组织的派系在反对何应钦的领导。陈诚曾是邓演达和蒋介石的得意门生，他的“土木系”包括许多对邓演达的临委会抱有同情，但仍在长征期间忠于蒋介石的左倾军官。而他们的对手是蓝衣社，这是一个受鲍里斯·萨文科夫及其保卫联盟的成功启发而成立的地下阴谋团体，其成员都是些信奉极端民族主义的军官。\n\n而蒋介石校长的遗产仍在发光发热——各派黄埔军官似乎愿意团结在他们的名义领袖周围。何应钦本人就在北伐期间为此付出过代价，他曾在其他派系的压力下，以维持党内团结的名义罢免了蒋介石，但他很快发现第一军在前黄埔学员朱绍良的组织下拒绝接受他的指挥，直到蒋介石回归。当愤怒的蒋介石最终复职时，他警告何应钦说：“没有我蒋中正，决不会有何应钦。”如今蒋介石已经牺牲，但他的话是否应验仍有待时间揭示答案。"
 YUN.midgame.402.a: "黄埔人肩负着全中国的革命事业！"
 YUN.midgame.402.b: "第一军团结一致，支持何应钦将军。"
 YUN.midgame.403.t: "新右派里的新盟友"
 YUN.midgame.403.d: "由于国民党军政府的领导层以军人为主，导致文职领导层产生了巨大的缺口，在国民党的势力范围扩大了整整四倍后，这已成为一个重大问题。治理效能低下和类似军阀的统治方式，已成为影响国民党合法性的一大障碍。胡汉民及其莫斯科委员会实际上垄断了党内文职领导层，他们一直希望利用这一点为自己谋利。然而，随着谈判陷入僵局，规模较小的派系正在迅速壮大。\n\n在何应钦的招揽下，戴季陶及其革命同志会浙江社已在江南地区崛起。戴季陶和陈果夫都是黄埔军校的高级干部，陈立夫曾是蒋介石的机要秘书，因此他们都是何应钦将军所熟知的人物。戴季陶也被认为是右翼知识分子中的杰出代表，是少数几个在影响力上能与胡汉民匹敌的人物之一。\n\n张群是国民革命军第一军的实际后勤主管，也是蒋介石和何应钦的同窗，他现已招募杨永泰和一些文职团体组建了“新中国建设学会”，该学会通常又被称为“新政学系”。杨永泰是旧政学系的成员，曾被指控背叛孙中山，转而支持陆荣廷并与北洋政府谈判。然而，新政学系似乎更加同情国民党当局，至少在姿态上更为顺从。新政学系的专业知识和深厚人脉对党来说是无价之宝，但他们的忠诚度却令人怀疑。\n\n在中国，掌握军权是获得政治权力的手段，但近年来，各派系也都认识到了建立强大文官政府的重要性。在国民党内，蒋介石是罕见的既能统率军队又能获得广泛民心支持的人物，目前似乎没有人能够在如此大的规模上复制他的成就。因此，目前只能如此。"
 YUN.midgame.403.a: "莫斯科派的人选对党最为忠诚。"
 YUN.midgame.403.b: "浙江系培养了一批务实的人才。"
 YUN.midgame.403.c: "政学系结识了不少重要的人物。"
 YUN.midgame.404.t: "广州妥协"
 YUN.midgame.404.d: "几周以来的会议似乎毫无进展，于是，第一军的何应钦将军与革命同志会浙江社的本党理论家戴季陶达成协议，出其不意地超越了先前占主导地位的莫斯科派和第三军集团。根据两人的提议，何应钦将军将身兼革命政府主席、国民党主席和军事委员会委员长，戴季陶将成为（临时）行政院首任院长和国民党副主席，充当类似于“国务总理”的职务，进而有效地控制政府的行政部门。\n\n在新桂系众人之中，何应钦与黄绍竑彼此间很是投机，与李宗仁和白崇禧相处得也还不错，他争取到了他们对这一提议的支持。作为协议的一部分，黄绍竑将担任内政部长，李白二人也被许以高位，并由李白与黄旭初一起实际控制广西。\n\n戴季陶凭借与胡汉民的旧谊，说服对方及其盟友不要退出会议，并提议任命胡汉民为（临时）立法院的院长，居正为（临时）司法院的院长。他发誓会努力维护文官统治，而在统一全国之前，只是暂时达成此番安排。\n\n尽管此番安排远达不到完美，但各方能达成共识一事还是让大多数代表松了一口气，他们很快就向何戴政府表示服从。然而，本政府历经如此巨大之讨价还价才得以建立，其存在时间必然不能长久，很明显，纠纷还远未结束。"
 YUN.midgame.404.a: "双方都展现了卓越的政治家风范。"
 YUN.midgame.405.t: "贵州国民党重返广州"
 YUN.midgame.405.d: "时运突变，北伐失败后退守贵州的国民党军政府得以在十年后重返广州。国民革命军击败了阻挠其前进的军阀和对手，控制了两广地区，让党国政权恢复至1925年的局面。\n\n然而，组建新的广州国民政府并非易事。党内右派势力四分五裂，谈判一再拖延，直到何应钦将军与国民党理论家戴季陶最终达成妥协。随着党内大多数成员纷纷就范，广州国民政府的注意力转向了北方。"
 YUN.midgame.405.a: "他们从未放弃，我们亦将如此！"
 YUN.midgame.405.b: "看来他们抢先拿下了广州。"
 YUN.midgame.405.c: "十年后的又一次失败革命罢了。"
 YUN.midgame.410.t: "第三军的抵制"
 YUN.midgame.410.d: "虽说朱培德分享权力的一贯作风不知有几分出自公心，但即使他身为贵州军政府的首领，他也未僭越一步，不过是“同侪之首”。如今他眼见大会的发展，几乎要拍案而起了。朱培德仍是中执委委员和云南省省主席不假，可他在新政府中获得的唯一职位竟是在军事委员会中的委员虚职，要受到何应钦委员长的驱使，此举是对他的主动排挤。\n\n随着局势迅速脱离朱培德的掌控，他考虑在军政府正式解散之前，凭借自己现有的势力发动政变。然而，此般逆势并不利于他的行动。他与胡汉民及莫斯科派经过许多轮谈判，一直争执不下，没能取得结果，无法达成足够的共识。胡汉民固然公开鄙弃何应钦将军，但他顽固坚持党的团结和民主集中制也是人尽皆知，因此他会如何决定也不足为怪了。与之相对，政变需要动员的其他地方派将军，如李宗仁、白崇禧和陈济棠等，则多半已被收买好了。灾星正在闪烁，第三军军官们劝阻朱培德将军，他们认为反对派太分裂了，而大多数普通党员只想着随波逐流和维护表面团结。"
 YUN.midgame.410.a: "朱培德将军发言反对妥协！"
 YUN.midgame.410.b: "朱培德省主席返回云南从长计议。"
 YUN.midgame.411.t: "朱培德将军遭到羞辱"
 YUN.midgame.411.d: "朱培德对何应钦和戴季陶妥协方案的猛烈抨击并未取得多大进展。新右派内部僵持不下，粤桂两省将领保持沉默，而最致命的是，胡汉民竟与戴季陶联手谴责朱培德，称他为威胁党内团结、图谋领导权的新贵军阀。\n\n在朱培德的第三军战友中，只有朱德和其他左派人士支持他（这导致右派更加厌恶朱培德），而其他云南人士如范石生和金汉鼎则迅速撇清关系，坚称此举纯属朱培德个人行为。\n\n计划彻底失败后，颜面尽失的朱培德只得辞去中执委的职务，灰头土脸地回到云南老家。虽然朱培德仍是云南省主席，但他的权位能维系多久，众人皆不得而知。"
 YUN.midgame.411.a: "滚回昆明吧，你个赤匪！"
 YUN.midgame.412.t: "朱培德逝世"
 YUN.midgame.412.d: "自从在广州蒙受耻辱后，为了挽回自己的爱国者声誉，朱培德在云南省主席任上不辞辛劳、加倍努力。然而，由于疲于应付日渐猖獗的政敌所带来的压力，朱培德的健康状况不断恶化。昆明药品质量与医疗资源的隐患最终引发了悲剧，朱培德省主席为了避免缺席会议，服用了从德国进口的劣质抗贫血药物，导致病情急剧恶化，入院治疗后不幸离世。\n\n据说，朱培德临终前曾对前往医院探望他的[ROOT.GetLeader]交待了三件事：一、抗战在即，国力有限，我死之后，请从简安埋，无需破费国葬；二、家属子女，让他们自食其力，不要因我而优厚照顾；三、不要责怪家庭护士，这是我们国家医学不发达，不能解除病毒。\n\n如果朱培德的目标是恢复名誉，那么他的目标已经实现。党内各派，包括左派人士在内，都给予了他高度赞扬，各界要员也都称颂了他勤勉务实、虚怀若谷的爱国情操。国民政府现已明令颁布褒扬令：\n\n“陆军上将朱培德……精娴韬略，智能兼赅。早岁追随总理，效力革命，迭膺军机重任，北伐之役，总领师干，肤功克奏……尤能殚精擘划，宏济艰难……缅怀往绩，悼惜殊深……葬费量从俭约，藉以符其澹泊之素志，生平事迹，存备宣付国史馆，用彰勋荩而励来兹。”"
 YUN.midgame.412.a: "忠诚的战士，愿他安息。"
 YUN.midgame.412.b: "他将被铭记为爱国志士。"
 YUN.midgame.413.t: "朱培德与胡汉民携手"
 YUN.midgame.413.d: "启程返回昆明前，朱培德一行与胡汉民及其盟友进行了最后一轮谈判。在私下会谈中，双方均表达了对新成立的军人主导政府的不信任，并约定在采取任何行动前将继续保持磋商。\n\n胡汉民正努力扩大自己在立法机关和党务机构的影响力，以抗衡戴季陶和张群的势力。胡汉民与广东省府，特别是和陈济棠的紧密联系，让他拥有了其他大多数文职官员所缺乏的一定程度的硬实力。胡汉民寄望于争取尚在重建中的新桂系支持，并尽可能地联合贵州、湖南等地力量，以图重新掌控党内大权。"
 YUN.midgame.413.a: "一份盟约得以铸就。"
 YUN.midgame.414.t: "胡汉民巩固南方"
 YUN.midgame.414.d: "尽管胡汉民始终谨慎地避免危及国民革命的整体成果，但他已成为党内抵制何应钦统治的焦点人物。他一直致力于策动地方势力脱离何应钦控制，已经成功争取到了广东、云南，最近更将广西纳入麾下。对胡汉民这位固执的集权派而言，与地方军阀合作本就难以接受，可让他接受军权凌驾于党权之上又何尝不是如此呢。\n\n在国民政府内部，胡汉民凭借其立法院长之职位与党首之显赫地位，试图孤立何应钦。他曾多次尝试说服戴季陶背弃何委员长，还力推朱培德出任军事委员会委员长以取而代之。\n\n胡汉民深知何应钦将军的统治根基脆弱：与前任蒋介石不同，何氏仅有军事实力支撑，却难以真正赢得文官体系的效忠。然而掌控政权不仅需要忠诚——素以见风使舵闻名的政学系官僚向来唯利是图。或许争取这些实用派的支持才是更好的选择。无论如何，一个统一的南方政治联盟已然崛起，为黄埔系政府蒙上了不祥的阴云。"
 YUN.midgame.414.a: "凭借理念和忠诚，我们会拯救国民党。"
 YUN.midgame.414.b: "凭借力量和控制，我们会打倒独裁者。"
 YUN.midgame.420.t: "右派两巨头"
 YUN.midgame.420.d: "国民党右派的两大思想理论领袖便是胡汉民与戴季陶，二者同为孙中山的亲密战友，都花过不少笔墨来论述先总理的思想。两人曾常常彻夜修改润色对方的文稿，因而关系日渐亲近。不过二人的追随者却从某日开始分道扬镳。\n\n这样的裂隙起于“国工统一战线”时期，彼时右派各人士齐聚北京西郊的西山，共商如何应对工团党日益增长的影响。这些人都更倾向于当初的同盟会，同情保守的资产阶级民主。戴季陶因被指同情社会主义，被会议赶了出去。\n\n而戴氏最终团结起了所谓的“新右派”，最初这些人都支持国工合作，但旋即便转向蒋介石，帮助他在继续争取第三国际境外援助的情况下遏制工团党。他们声称要把外国思想从孙文哲学中剔除出去，并将列宁的先锋队主义在政治结构上与传统思想相结合。\n\n而国民党右派的共同点是，他们都信奉革命民族主义，践行孙中山思想，但拒绝进行阶级斗争。无论胡汉民还是戴季陶都在早期受马克思主义、无政府主义的影响。但他们的终极目的都是达到更高远的民族主义、反帝主义议程，故而抛弃了左翼理论，称其不适合中国国情、不尊重中国主权。与许多支持者不同，胡汉民不仅相信党国会把革命从阶级斗争的泥潭中拯救出来，还可以令其摆脱“虚伪的资产阶级民主。”换言之，尽管党必须涤除一切对手，但当国家建立起来后，国家又必须反过来钳制住党。"
 YUN.midgame.420.a: "我们必须守住本党初心。"
 YUN.midgame.420.b: "苟日新、日日新、又日新！"
 YUN.midgame.421.t: "黄埔诸系"
 YUN.midgame.421.d: "第一军以其能代表全中国而自豪。虽说黄埔师生实际上也大多来自那几个忠诚省份，但第一军与国民革命军中的其他地方军不同，黄埔同窗情谊还是能让他们不论出生，产生出精诚团结的情感。\n\n不过这也并没有阻止他们对前路产生分歧。何应钦领导的军队元老派从早期中国的保守改革派，以及日本的成功现代化中受到了启迪。这些人在现存建制中多出任要职，首要目标便是维持革命过程中的秩序与平衡。\n\n土木系由陈诚领导的第十八军（整编自溃散的粤军）和第十一师组成。因“十一”合之为“土”、“十八”合之为“木”，故名为土木系。他们因包藏左翼又自视甚高而臭名昭著——于友军面前动辄昂视阔步，视若无睹，对战力较差者则呼之为“豆腐部队”、“油渣部队”。\n\n滕杰则长期在谋划建立一个组织，以黄埔学生之精锐组成。他们在警、军、政界都建立了反帝小团体。德、日两国及使馆城市官方都称之为“蓝衣社”，也有些诸如“蓝衫军”、“蓝衣团”或者“救亡会”之类的别称——大多数名字的来源都是制服上的蓝补丁，加之以国民党的代表色。\n\n每一派都在军中勾心斗角，建设一重又一重的恩庇网，确保自己的成员能够步步高升。"
 YUN.midgame.421.a: "何应钦和元老派无所不能。"
 YUN.midgame.421.b: "陈诚和土木系革故鼎新！"
 YUN.midgame.421.c: "滕杰和蓝衣社才能救亡图存！"
 YUN.midgame.422.t: "CC系崛起"
 YUN.midgame.422.d: "自戴季陶首次入主行政院以来，他已经按自己的构想重组了该院。他的拥趸主要是浙江人，如今已纷纷身居高位，奋力践行着戴院长的议程。鉴于戴院长与何主席达成的协议，他如今权限可谓手眼通天：除了军队仍在何应钦与黄埔系的控制下，财政与经济部门掌控在政学系手里，而立法院和司法院则还在莫斯科派任命的干部手中。\n\n为满足戴季陶政府日益增长的需求，革命同志会浙江社已经发展为一个更大的实体——即外人口中的CC系（CC可能是中央俱乐部或中央委员会的缩写，也可能指陈氏兄弟）。然而，陈立夫否认这种组织的存在，称这是挑起党内分裂，质疑戴院长的领导地位。但无论如何，陈立夫和他的兄长陈果夫已经成为了戴氏党国的左膀右臂。\n\n这三人都十分看重教育、纪律和党的革命。而戴季陶是这一派的头面人物，陈立夫是他的二把手，陈果夫则是沉默的实干家。据说，陈果夫是个严守儒家礼教的人——从不喝酒、抽烟，也不看电影。他唯一的爱好就是读书，哪怕他口袋里就剩一分钱，也会拿来买书。据说，他一生最大的遗憾就是18岁入党，没有受过高等教育，因此他很鼓励年轻人接受深造。尽管肺结核后遗症让他身体状况不佳，但他仍然坚持工作、讲学。据他所说，“对抗疾病最好的武器，就是忘掉自己是病人”。陈果夫实乃吾辈楷模。"
 YUN.midgame.422.a: "CC系会践行何主席的议程！"
 YUN.midgame.422.b: "戴季陶鼓舞了同志们的心魄！"
 YUN.midgame.422.c: "哪有什么CC系，只有一个党，一个革命！"
 YUN.midgame.423.t: "政治对话之策"
 YUN.midgame.423.d: "新旧政学系和国民党新旧右派之间从来算不上一路人。岑春煊和李根源为首的旧政学系，因阻挠广州政府制定新宪法的努力而臭名昭著。与孙中山的矛盾不断激化后，他们转投广西军阀陆荣廷，企图将先总理逐出广州。同样，他们还尝试从唐继尧手里夺取云南，不过最终却以顾品珍人头落地而告失败。\n\n张群曾是岑春煊的幕僚，不过在国民党赶走政学系之后，他却无法融入北洋政府，不过后来在蒋介石和何应钦手下谋得了稳定职位。他做了行政院的副院长，兼任行政院下的军政部长，也在外交部中任一小职务，并围绕着对经济机构的技术官僚控制，构建起了自己的派系。\n\n杨永泰曾是黄兴的亲信，做过护法军政府的财政厅厅长，与岑春煊、李根源对抗过孙中山。在护法政府倒台后，他被迫逃亡北洋政府，任职不久便去上海做了寓公。下野近十年后，杨永泰在张群的引荐下再次复职于国民党，汲汲于保住权力，在政治上八面玲珑，同时又力保对委员长的忠诚。\n\n杨永泰建议以军事手段解决北洋政府（反党积极，矛盾难以调和）；以经济手段解决李宗仁等华南军阀（战力强大但经济贫弱）、以外交手段联合外国列强解决胡汉民和莫斯科委员会（军事力量较弱但政治声望高）。"
 YUN.midgame.423.a: "要用军事手段打倒这帮匪逆！"
 YUN.midgame.423.b: "我们要用经济激励来确保“盟友”的忠心。"
 YUN.midgame.423.c: "外交手段可以让本党保持精诚团结。"
 YUN.midgame.424.t: "文武之争"
 YUN.midgame.424.d: "革命儿女们的热情推动了革命本身的进行，可他们也由此分裂成了分庭抗礼的派系。自古以来，中国的官僚机关就分为“武”（代表实践与军队）和“文”（代表理论与官僚）两派。不过，国民党内最大的三个派系刚好可以与[ROOT.Capital.GetCapitalVictoryPointName]楼宇之间飘扬的青天白日满地红旗相对应。\n\n蓝衣社代表青天，他们在军中势力不断壮大，兜售着一种激进的愿景——即按理想中旧黄埔军校般狂热，以严明的纪律和革命的秩序来治理中国。对于许多当上高级军官的年轻黄埔校友来说，他们打小就长在动荡、革命与战乱中，决心不惜一切代价救亡图存——就算要从欧洲引进西洋思想，抛弃旧的臃肿腐朽的党组织也在所不惜。\n\nCC系代表白日，控制着党组织。他们在党内文职干部中发起了一场群众运动，呼吁复兴宋明理学，严守戴季陶先生对孙中山思想的解读。呼吁一种以党的正统为思想核心的更偏向知识分子的极端民族主义形式。他们控制着教育机构和政治建制，在党内权势滔天。然而，许多CC系成员对军方颇为不屑，还和杨永泰及政学系这样的投机分子有所勾连。\n\n土木系代表满地红，是军队少壮派的另一个分支，其成员对蓝衣社的酷烈感到不满，对CC系的腐朽感到失望。他们所培养的一批拥趸也让人回忆起昔日的黄埔军校——纪律严明、关心人民，把激进的社会主义拒之门外。\n\n这三派之间互相掣肘，有时比来自党外分子的阻挠还要严重。在本党领土扩张之时，他们之间的勾心斗角也愈发激烈。况且，每一派还都有自己的情报网络、青年组织和恩庇体系。而这一切，都在委员长的洞察之下。"
 YUN.midgame.424.a: "青如青天，如党国英雄之蓝衫！"
 YUN.midgame.424.b: "白似白日，如光耀大地之本党！"
 YUN.midgame.424.c: "红为满地红，遍撒烈士之鲜血！"
 YUN.midgame.424.e: "中庸之为德也，其至矣乎！"
 YUN.midgame.425.t: "贵州老营"
 YUN.midgame.425.d: "长征结束后，贵州西部一直是国民革命军残余势力的权力中心。在国民党统治之前，贵州几乎没有地方国有企业，甚至几乎没有任何工业。军政府曾努力解决这个问题，但收效甚微。然而，随着国民党将主要根据地迁往广州，各派势力争相争夺影响力，权力真空随之出现。\n\n王伯群是何应钦的内兄、王文华的兄长。王文华曾率领一批原贵州国民党革命派反抗他的叔父刘显世。王伯群也是一位与贵州省有着深厚渊源的文职官员，却饱受腐败指控的困扰。何应钦担心如果任命王伯群为省主席，可能会被指责为裙带关系，尤其是在他的弟弟何辑五同时也在竞选贵阳市（贵州省会）市长的情况下。\n\n作为何应钦的家乡，贵州对何委员长来说意义非凡。何应钦正在考虑的另一个潜在人选是他核心圈子里的秘书兼老乡刘健群。刘健群是一位隶属于蓝衣社的宣传官员，据说他十分热衷于宣传蓝衣社的意识形态。\n\n何应钦在贵州省的主要竞争对手是谷正伦，二人原是盟友，后来分道扬镳。谷氏兄弟是汪精卫领导的左派改组会的重要成员，尽管谷正伦有反社会主义倾向，但国民党内部仍对他抱有疑虑。另一位国民党人物卢焘虽也在考虑范围内，但基本上没有受到重视——他已经投靠了谷正伦。\n\n鉴于其中涉及极其激烈的个人政治斗争，政学系和CC系几乎没有自主决定人事任命的余地；尽管如此，这两个派系都曾寻求谷正伦的支持，以期在人事任命上牵制何应钦和刘健群。"
 YUN.midgame.425.a: "王伯群，委员长的内兄。"
 YUN.midgame.425.b: "谷正伦，贵州为数不多的硬汉。"
 YUN.midgame.425.c: "刘健群，何应钦的秘书、蓝衣社成员。"
 YUN.midgame.426.t: "党国的新闻与报刊"
 YUN.midgame.426.d: "尽管审查制度盛行，但百姓群众对政府秘辛和新闻消息的渴望却难以抑制。为了满足这种需要，大批党或半政府赞助的报纸如雨后春笋般涌现出来。\n\n《首都消息》据传是戴季陶《民权报》精神的继承者，由CC系主办，肩负着宣传三民主义的使命，而与机密部门的关系也使得他们可以获得第一手新闻，同时也能确保不泄露国家、军事机密。该报在深夜印刷，也刊载社会讽刺连环画和连载小说。该报将所得收入用来创办《月刊》、《政治评论》和正中书局等报刊机构。他们尖锐的政治评论常常引来军政界人士的怨言，要求何主席勒令撤回。\n\n《社会新闻》则是一份与蓝衣社脱不开干系的战斗派刊物。该报声称“国家民粹主义是亡国灭种之民族自救唯一手段”。坚称“除了仿效罗马尼亚与俄罗斯暴力奋斗精神，决没有其他出路。”也称赞此类精神是民族精神“最积极、最勇敢、最有力的具体体现”，同时也贬斥“民主的遗毒”，称无政府主义和个人主义是国民党如今衰颓的原因。\n\n而温和的党员则常常订阅孙科的《再造旬刊》和胡汉民的《三民主义日报》。而政学系则试图重开一些这些年起起落落的小报刊，譬如《现代评论》、国闻通信社等。其他如上海《时报》、《东方杂志》和《新中国》等期刊，在没有本党要人直接资助的情况下仍然存续。"
 YUN.midgame.426.a: "《首都消息》的耳目最灵通！"
 YUN.midgame.426.b: "《社会新闻》真是又快又新！"
 YUN.midgame.426.c: "老百姓还是爱看靠谱的老报纸。"
 YUN.midgame.427.t: "反左战争"
 YUN.midgame.427.d: "戴季陶院长发起了一场热火朝天的“反左战争”。戴院长曾也是一位马克思主义者，发表过不少社会主义著作，包括翻译了考茨基的《马克思的经济学说》，对此类文章到人民群众中去的能力深表敬佩。尽管他曾是马克思主义研究会的一员，但却在1921年拒绝加入中国工团党，并最终走上了反对阶级斗争的道路。戴院长认为，离开了具有意识的领导，工人运动就一无是处。\n\n作为孙中山的秘书和文胆，戴季陶以孙中山思想重要的诠释者自居，并指出孙中山的早期著作并未受多少马克思主义的影响。戴院长出版的《孙文主义之哲学的基础》尝试批评马克思主义和所谓的科学价值。他凭着自己的念旧思想、民族自豪、传统伦理道德、对民族主义的呼唤、含糊的社会主义思想、对正统的崇拜乃至对先秦周代的美好念想，将孙中山和孔夫子联系起来。他也谴责新文化运动乃至对旧圣人的反攻倒算，将孙中山思想、仇外思想和重振传统价值等结合成为了一种革命右翼的思潮，将其作为医治左翼科学社会主义的良方。\n\n戴季陶呼吁镇压社会主义的观点虽然大受欢迎，但却未被广泛践行。第三军里的社会主义同情者比比皆是，就算右派中也有反对中央政府过度干预的团结思想。朱培德、范石生和金汉鼎都因袒护社会主义同志而名声在外，也会继续抵制清洗社会主义的举动。\n\n而黄埔的队伍中，在早年间清洗社会主义者后，仍有不少残余的左派尝试弥合左右分歧，让国民党回归大帐篷革命党的本源。土木系就同情临委会，试图通过自身主持的广泛社会与经济改革来减少社会主义的支持。"
 YUN.midgame.427.a: "戴季陶才是真革命的使徒！"
 YUN.midgame.427.b: "左右都是好同志嘛！"
 YUN.midgame.427.c: "反动和社会主义外，一定有第三条道路！"
 YUN.midgame.428.t: "建立新政府"
 YUN.midgame.428.d: "建立一个新政府并非易事。国民党想要创立党国，但放眼中华大地，少有可堪大任之才，更遑论对党忠诚的干部。实际上，只有滇、黔、桂、粤、湘、川、浙、苏几省有组织完整的省党部，占了94%的各市、县支部数。而其他省的党务都是由陈氏兄弟直接指派的委员会或是单一党代表来临时代理。\n\n而与此同时，官僚机构几乎完全由军事委员会运作，而军委会的手也伸进了各地区行政机构。杨永泰是这一体系的总设计师，参与组织了剿匪区的建设，并提出了三大优先事项：行政效率、政治教育和政治动员。杨氏改革在于让各省级行政部门间得以横向沟通，而非只能联系中央政府与当地同侪，同时也赋权县行政机构、当地村庄的乡级机构。其中便包括了保甲制——即用短期党教中心组织起村内民团，以对抗土匪与赤匪。\n\n然而，此类改革因为落地缓慢，又严重依赖军事手段而推行不畅。只有少数几个由政学系军官控制的省份能够推行，但落后的通信技术却又带来了更大的混乱。保甲制深得许多士绅青睐，却惹恼了不少农民。而杨永泰的中央集权尝试也激怒了不少地方派阀，甚至招来了CC系的妒忌。许多人都指责政学系简直高高在上、贪墨成风。他们呼吁再行改革，罢免政学系领袖。"
 YUN.midgame.428.a: "这类改革为自由而安定的民国播下了种子！"
 YUN.midgame.428.b: "本党必须再行变易，以图生存！"
 YUN.midgame.428.c: "不过招致反抗、暴力、野蛮，如此循环耳，一塌糊涂。"
 YUN.midgame.429.t: "昆明风云"
 YUN.midgame.429.closer: "云南的国民党通常被认为比其他国民党右派更具地方主义色彩，且没那么敌视社会主义者。不断有人指责朱培德在包庇社会主义者，这些指控令朱培德一派很是挫伤，因为他确实很依赖朱德等人对他的支持。而出走多年后重新回归云南的李根源同样引发了许多争议，他正努力重建旧政学系的影响力，而人们普遍不怎么乐见此事。面对这些争端，范石生和金汉鼎对朱培德的支持也开始动摇，二人之所以还保持忠诚，纯粹是担心黄埔系的影响力过大。\n\n起初龙云和胡若愚在接受国民党统治时，就一直试图保留地方权力和自治权，如今他们开始更加大胆地削弱国民党本流的影响力，试图设立自己的国民党党部，并任命自己的亲信担任要职——有时他们甚至会强行驱逐朱培德任命的官员。\n\n出身滇军的黄埔五虎将之一刘峙已被派往云南“处理省务”。如今这个多山省份面临着无数变数，这场长期权力斗争中谁胜谁负犹未可知也。"
 YUN.midgame.429.d.Zhu_alive: "尽管新右派的势力似乎正在迅速增长，但云南国民党依然在革命中占据着主导地位。朱培德省主席正稳步而近乎毫无争议地掌握着该省的领导权，并试图与胡汉民等“旧右派”并肩奋战。\n\n$YUN.midgame.429.closer$"
 YUN.midgame.429.d.Zhu_dead: "尽管新右派的势力似乎正在迅速增长，但云南国民党依然在革命中占据着主导地位。在朱培德省主席去世后，他的好友、黄埔毕业生李弥便接替了他。\n\n$YUN.midgame.429.closer$"
 YUN.midgame.429.a: "朱培德团结云南，反抗[ROOT.Capital.GetCapitalVictoryPointName]暴政！"
 YUN.midgame.429.b: "李根源与政学系成功拉拢了云南。"
 YUN.midgame.429.c: "旧滇系趁着乱局驱逐国民党宿敌。"
 YUN.midgame.429.e: "李弥与刘峙带领昆明归顺黄埔系。"
 YUN.midgame.440.t: "南京城头，白日再升"
 YUN.midgame.440.d.satellite: "南京是孙中山先生光荣归国的地方，1912年1月1日，聚集于此的革命志士推举他为临时大总统。今天，[ROOT.GetLeader]傲然立于南京总统府（原两江总督府）前，发表演讲纪念国民革命军的胜利。\n\n南京易主后，巴黎的左派中央执行委员会的前景已然崩塌，然而党内右派的处境也同样艰难。如今各方势力不得不承认[ROOT.GetLeader]的地位，开始争相迎合[ROOT.GetRulingParty]的路线，其中最具规模的潜在盟友当属再造派。为了在新党内谋得一席之地，再造派的重要门面人物孙科近日已宣誓效忠新中央执行委员会。\n\n孙科的再造派是他个人圈子的最新形态，该派系始于孙科在其父孙中山治下任广州市长期间，当时被称为“太子派”，其中包括许多在海外留学的年轻技术官僚和自由派人士。尽管孙科一派最初对西山会议颇感兴趣，但他们最终在汪精卫的威逼下屈服，并在北伐失败后逃往夏威夷。后来，孙科的“夏威夷派”出版了一份名为《再造旬刊》（再造派得名于此）的杂志，并且至今仍与东南亚的华侨社区保持着联系。\n\n孙科虽已承袭其父的“政治衣钵”，但他的追随者除了在立法院挂名的闲职（孙科已在洽谈出任副行政院长）之外，能否获得其他优厚的职位，犹属未定之数。鉴于当前官僚体系竞争已经相当激烈，能否为再造派腾出位置，需要取决于政学系、莫斯科委员会以及其他零散派系的态度。"
 YUN.midgame.440.d: "南京是孙中山先生光荣归国的地方，1912年1月1日，聚集于此的革命志士推举他为临时大总统。今天，[ROOT.GetLeader]傲然立于南京总统府（原两江总督府）前，发表演讲纪念国民革命军的胜利。\n\n南京易主后，国民党左派的前途随之暗淡。国民党右派虽长期被视为声势较弱且缺乏法统的派系，但他们现已东山再起。许多在左右两派间摇摆不定的人士现已纷纷投奔右派政权，其中最具规模的变节者当属再造派。为了在中执委谋得一席之地，再造派的重要门面人物孙科现已宣誓效忠右派委员会。\n\n孙科的再造派是他个人圈子的最新形态，该派系始于孙科在其父孙中山治下任广州市长期间，当时被称为“太子派”，其中包括许多在海外留学的年轻技术官僚和自由派人士。尽管孙科一派最初对西山会议颇感兴趣，但他们最终在汪精卫的威逼下屈服，并在北伐失败后逃往夏威夷。后来，孙科的“夏威夷派”出版了一份名为《再造旬刊》（再造派得名于此）的杂志，并且至今仍与东南亚的华侨社区保持着联系。\n\n孙科虽已承袭其父的“政治衣钵”，但他的追随者除了在立法院挂名的闲职（孙科已在洽谈出任副行政院长）之外，能否获得其他优厚的职位，犹属未定之数。鉴于当前官僚体系竞争已经相当激烈，能否为再造派腾出位置，需要取决于政学系、莫斯科委员会和CC系的态度。"
 YUN.midgame.440.a: "我们将努力采纳再造派的想法。"
 YUN.midgame.440.b: "看在国父的面子上，只留下孙科。"
 YUN.midgame.441.t: "分道扬镳的三驾马车"
 YUN.midgame.441.d.satellite: "汪精卫和他的改组同志会是新旧右派的死对头，在广州的权力博弈期间便与二者分庭抗礼，一度被视为倒向第三国际的叛徒。然而，汪氏是个公认的政坛不倒翁——既高傲、又灵活，同时也试图以党内团结的名义重获党的青睐。\n\n事实上，改组会与[ROOT.GetLeader]的关系在各方面都极为复杂。随着[ROOT.GetNameDef]内部不断有人士在左右两派间摇摆，真正基于主义立场强烈反对汪精卫者实属寥寥。尽管多数人（即便不是全部）支持1924年的改组方案，但鲜少有人赞同与第三国际结盟或同中国工团党合作，反而强调在危急时刻保持党内团结的必要性。李根源等人虽然提出最激烈的反对，却颇为讽刺地促使更多党内成员转而支持汪精卫的和解努力，这种态势正中改组会下怀。\n\n与左派不同，国民党右派寻求的革命终极目的是建立一个和谐合作的民族整体，以文化相互结合，共同进退对抗威胁。像是戴季陶、胡汉民和蒋介石等人虽然保守，但也认为自己才是真正的革命者。因而左右两派互称对方为反革命也就不足为奇了。在左右两派间则存在着朱培德、陈诚、孙科等中间派人士，他们或因不同缘由倡导革命，却始终致力于调和左右两派的理念。\n\n汪精卫则坚称，如果邀请他进入政府，他也有秘密手段继续获取境外支持，同时，汪氏本人的存在也有助于削弱工团党。毕竟，在国际舞台上，汪精卫才是国民党的头面人物，将他排除在外将释放一种强烈的讯号。"
 YUN.midgame.441.d: "汪精卫和他的改组同志会是新旧右派的死对头，在广州的权力博弈期间便与二者分庭抗礼，一度被视为倒向第三国际的叛徒。然而，汪氏是个公认的政坛不倒翁——既高傲、又灵活，同时也试图以党内团结的名义重获党的青睐。\n\n戴季陶和1924年改组（改组会也因而得名）有千丝万缕的联系。在某种程度上，孙中山流亡日本期间，便是戴季陶充当他的代理，也塑造了孙中山更为保守的一面。戴季陶一派认为辛亥革命的失败在于民族精神的沦丧，但戴季陶也认为辛亥革命缺乏变革所必须的民众活力。戴季陶虽然认同1924年改组时采取的先锋队主义，然而他认为真正的革命要依靠群众而非少数激进派来实现，同时又反对依附第三国际。他反对国民党员拥有工团党的双重党籍，称这会给外部势力篡党的契机。因而事实上，改组时期，戴季陶实质上无异于被排挤流放，而孙中山的去世也让他彻底失去了对左派的克制，甚至差点悲观地选择了自戕。\n\n与左派不同，国民党右派寻求的革命终极目的是建立一个和谐合作的民族整体，以文化相互结合，共同进退对抗威胁。像是戴季陶、胡汉民和蒋介石等人虽然保守，但也认为自己才是真正的革命者。因而左右两派互称对方为反革命也就不足为奇了。\n\n当然，在如此艰难的时期，也有一些人在呼唤党内的团结。就如汪精卫声称，如果邀请他进入政府，他也有秘密手段继续获取境外支持，同时，汪氏本人的存在也有助于削弱工团党。毕竟，在国际舞台上，汪精卫才是国民党的头面人物，将他排除在外将释放一种强烈的讯号。"
 YUN.midgame.441.a: "请汪先生回来，不过让他最好有点作为。"
 YUN.midgame.441.b: "让汪逆滚回巴黎，伺候他的法国主子吧。"
 YUN.midgame.442.t: "闽赣残余"
 YUN.midgame.442.d.satellite: "北伐战争失败后，在闽赣两省作战的国民革命军残部拒绝加入右派发起的长征，决定转入地下，与直军进行长期游击战。这些部队在1932年发动了大规模的上海起义，以反抗八省联合愈演愈烈的暴政，但最终惨遭镇压。\n\n宋庆龄（孙中山遗孀）、李济深、谭平山和邓演达不屈不挠，发表了《对中国及世界革命民众宣言》，宣布成立国民党临时行动委员会，自主协调当时以闽赣根据地为中心的残余游击活动。\n\n临委会领导人大多在广东政坛声名显赫，并且曾在黄埔军校中担任领导职务。土木系和第三军左派等同情者曾试图与这些农业革命派进行谈判。然而，并非所有人都对此抱有信心，由于临委会立场极为顽固，他们很可能成为其他不像他们那样热衷于社会主义革命之人的眼中钉肉中刺。"
 YUN.midgame.442.d: "北伐战争失败后，在闽赣两省作战的国民革命军残部拒绝加入右派发起的长征，决定转入地下，与直军进行长期游击战。这些部队在1932年发动了大规模的上海起义，以反抗八省联合愈演愈烈的暴政，但最终惨遭镇压。\n\n宋庆龄（孙中山遗孀）、李济深、谭平山和邓演达不屈不挠，发表了《对中国及世界革命民众宣言》，宣布成立国民党临时行动委员会，自主协调当时以闽赣根据地为中心的残余游击活动。\n\n临委会领导人大多在广东政坛声名显赫，并且曾在黄埔军校中担任领导职务。陈诚（邓演达门生）和土木系等同情者曾试图与这些农业革命派进行谈判。然而，并非所有人都对此抱有信心，由于临委会立场极为顽固，他们很可能成为右派的眼中钉肉中刺。"
 YUN.midgame.442.a: "跟党内人士打交道总比跟党外人士打交道要好。"
 YUN.midgame.442.b: "让他们混进我们的队伍后患无穷。"
 YUN.midgame.443.t: "中工盟的嫌隙"
 YUN.midgame.443.d.satellite: "中工盟由工团党带头成立，旨在对抗国民党的影响，并突破统一战线的限制。在刚成立的中工盟里，有马克思主义者、工团主义者、无政府主义者和其他许多独立左派人士，各派为各自的影响力而激烈地斗争，这股势力实在是难以驯服。其中，工团党（他们同样分成了两个派别）的主要对头是国民党内四大元老领导下新世界社的无政府主义者。\n\n工团党乃至广义的中工盟也是国民党右派出现的原因，毕竟右派的就是为了反对统一战线才纠集在一起的。这些右派认为，中国独特的社会经济情况意味着阶级斗争和无产阶级专政是不必要的。虽然他们同样反感自由市场的影响力，也认识到了工资体系的社会弊病，但他们却坚信中国的资本主义尚处在初级阶段，尚未形成资产阶级的阶级意识。\n\n朱德培虽坚决主张践行三民主义、反对任何形式的马克思主义或无政府主义，却仍试探性地提出了将中国工团主义者纳入国民革命的议题。\n\n作为工团党的早期成员之一，王复生因近期事态而在党内获得了更高地位，得以代表党中央建立省级委员会。他与李鑫等人协同行动，现已深入渗透到地方学生和工人运动中。\n\n颇为奇特的是，在另一边，四大元老和世界社却更加受人欢迎。比如，李石曾就称马克思工团主义是落后的，民生主义才符合人类文明的进步。资本主义与工团主义同为西方帝国主义，一体两面，国民党必须领导一条与之对抗的第三道路。与四大元老和解，也许能有利于遏制住工团党。"
 YUN.midgame.443.d: "中工盟由工团党带头成立，旨在对抗国民党的影响，并突破统一战线的限制。在刚成立的中工盟里，有马克思主义者、工团主义者、无政府主义者和其他许多独立左派人士，各派为各自的影响力而激烈地斗争，这股势力实在是难以驯服。其中，工团党（他们同样分成了两个派别）的主要对头是国民党内四大元老领导下新世界社的无政府主义者。\n\n工团党乃至广义的中工盟也是国民党右派出现的原因，毕竟右派的就是为了反对统一战线才纠集在一起的。这些右派认为，中国独特的社会经济情况意味着阶级斗争和无产阶级专政是不必要的。虽然他们同样反感自由市场的影响力，也认识到了工资体系的社会弊病，但他们却坚信中国的资本主义尚处在初级阶段，尚未形成资产阶级的阶级意识。\n\n因此，马克思的信徒们无非是鼓吹一种工人阶级国际主义的黄粱美梦，必须要用反帝的民族复兴加以抗衡。马克思主义者和无政府主义者都是戴季陶眼中的“反动分子”，悖逆了提高生产力所需的工人“严格纪律”，因而他也支持开办合作社、学校并组织工人保险。劳工领袖也需要抵制暴民心态，领导工人们为这一“造产的事业”做出贡献。\n\n戴季陶同样厌恶无政府主义，认为此学说只会坏事。话虽如此，四大元老和世界社似乎和国民党建制派过从甚密。比如，李石曾就称马克思工团主义是落后的，民生主义才符合人类文明的进步。资本主义与工团主义同为西方帝国主义，一体两面，国民党必须领导一条与之对抗的第三道路。与四大元老和解，也许能有利于遏制住工团党。"
 YUN.midgame.443.a: "我们还是可以靠……三千年后人的智慧来进入无政府主义的。"
 YUN.midgame.443.b: "无政府、马克思、工团，通通是赤党的惑众妖言。"
 YUN.midgame.444.t: "复兴社合流"
 YUN.midgame.444.d.satellite: "胡宗南与[ROOT.GetNameDef]成员的关系既特殊又复杂。胡宗南是蒋总司令众多浙江籍门生之一，在流亡期间思想急剧转向极左翼。他纠集了大批黄埔系激进分子，受欧洲极权主义运动的启迪，成立了秘密组织中华复兴社。作为流亡期间的训练部主任，胡宗南影响了一代左翼学员成为了党内的极端派。\n\n颇具讽刺意味的是，他们唯一的战友“蓝衣社”已然式微，如今党内鲜有人能容忍与一大群高喊工团主义口号的极端分子为伍。然而耐人寻味的是，土木系却竭力劝说[ROOT.GetLeader]至少在原则上接纳部分复兴社成员。虽然此举表面上是黄埔校友间的互帮互助，但土木系显然是企图利用复兴社的狂热为己所用。\n\n然而，除了党内大多数人的反对外，复兴社的许多左派同侪（除了土木系）也认为他们无异于反革命。更糟的是，党内新旧右派成员均抨击他们是混进队伍的赤色分子，党内一众文官也觉得这些人有点太极端了。"
 YUN.midgame.444.d: "胡宗南是蒋总司令众多浙江籍门生之一，何应钦向来与他关系不睦，何况在他流亡左转之前就是如此了。他纠集了各色黄埔系极端分子，受欧洲极权主义运动的启迪，成立了秘密组织中华复兴社。作为流亡期间的训练部主任，胡宗南影响了一代左翼学员成为了党内的极端派。\n\n讽刺的是，或者说在某些人眼里，不出所料的是，他们竟然在蓝衣社里找到了自己的同道中人。滕杰一派本就是极端民族主义者，而这些人也相信，在正确的劝励下，胡宗南、邓文仪和贺衷寒之流就可以抛弃其主张里面的工团主义毒瘤，转向爱国的革命。滕杰向何应钦的秘书和亲密战友刘健群替他们求了情。而刘健群也认为，复兴社等人不同于左派里其他社会主义者和自由派，没有西方式的腐朽，而是更加接近孙先生纯粹的、真正的社会主义愿景。\n\n但除了何应钦外，还有不少人都对复兴社心存忌惮。许多左派同侪认为他们无异于反革命，而右派则说他们就是混进队伍的赤色分子，文官们也觉得这些人有点太极端了。"
 YUN.midgame.444.a: "大家都是黄埔同志嘛。"
 YUN.midgame.444.b: "这是一股危险的颠覆分子。"
 YUN.midgame.450.t: "《[GetYear]年教育目的实施方针纲要》"
 YUN.midgame.450.d: "作为教育部新官上任的举措之一，陈立夫起草了《[GetYear]年教育目的实施方针纲要》。尽管辛亥革命之后中国就展开了现代化建设，但教育仍是国内资金最为缺乏的领域之一。普及全民免费教育开销不下数亿元，然而教育预算在最高峰时期也不过所需金额的20%，平均水平更是只有10%左右。农村地区的小学四处散布，入学极为困难；而就算是资源丰富的大城市，也只有不到5%的人能够就读高中。\n\n除扩大教育支出外，陈部长还提议将三民主义纳入各级学校的课纲中，以正统的党理论来取代所谓公民教育，重点教授先总理的生平、教导、演说和著作。而高年级学生还会学习国民党政策与正统党史，为今后服务国家做好预备。此外，这项综合计划还包括一场“白话文运动”，即用白话文取代文言文。这项措施在城市大受欢迎，不过在乡村地区却颇受阻挠。\n\n无论如何，课程的政治色彩也引起了相当大的反对。许多人认为，党的理论可以作为公民教育的补充，而非强制要求。同样，也有人认为应该将重点放在中国传统历史上，以文言文为重，达到保护传统之效果。"
 YUN.midgame.450.a: "部长之方案，实乃高瞻远瞩。"
 YUN.midgame.450.b: "陈氏之方案，犹如瓦釜雷鸣。"
 YUN.midgame.451.t: "重振革命精神"
 YUN.midgame.451.d: "辛亥革命后，同盟会一分为二：一派认为可以借议会手段完成革命；而另一派则倾向于保留一支警醒的革命武装。随后，黄兴与宋教仁在选举中赢得了多数席位，却很快就被袁世凯的北洋军凭着反动的立法机关一同镇压。此后，孙中山和很多同志便否认议会手段，认为这是黄兴和宋教仁犯的幼稚病。\n\n对于戴季陶来说，这就是一种从相信自由个人主义为基础的理想国家，到建立在“主义”之上，背靠强大军事力量的国家的转变。他写道：\n\n“一个政党，除了主义，便没有结合的基础，主义是党的神经系，同时是党的血管。失去了神经系和血管，动物便不再称之为动物；而失去了主义，党也不能称为党。”\n\n对于戴季陶以及他在新右派的思想继承者来说，“主义”便意味着民族主义、革命主义与传统的价值观。他相信民众的力量是必要的，就算民众完全不知道自己在为何而战。戴季陶根据自己曾在四川组织革命所观察到的经验，总结出当时人们的四种行为：杀人越货、求神拜佛、抽大烟而死（他差点就走上这条路）、避世离俗。而大爱就是摆脱迷信的必需品，三民主义则是治愈世界痼疾的必需品。复兴的中国必须建立在这种传统的大同价值观上——否则下场只有亡国灭种。"
 YUN.midgame.451.a: "今当重燃革命之火。"
 YUN.midgame.451.b: "要超越此类理念，形成新的革命理念。"
 YUN.midgame.451.c: "过激化便是分裂本党之祸首！"
 YUN.midgame.452.t: "革命突击队"
 YUN.midgame.452.d: "在军阀混战的动荡年代，中国各省士兵的平均素质之间差异巨大。尽管云南历来以民国时期的尚武传统为荣，但成千上万的滇军士兵仍然缺乏爱国信念，宁愿为一碗米饭和一天的工资而战。在意识到这个问题后，戴季陶撰写了大量关于革命突击队必要性的文章——这些士兵被纯粹的道德意志和自我牺牲的爱国精神所驱动，他们用思想而非仅用枪械武装自己。\n\n这些士兵不仅受到民族主义情感的驱使，还应感受到使命的召唤；他们的使命就是弘扬和传承三民主义的光辉。当士兵们从一个城镇行进到另一个城镇时，他们会向民众传授孙中山的学说，并宣扬实行四权的必要性，以便民众能够学习和理解民主。戴季陶深受俄国内战期间布尔什维克垄断宣传的影响，因此尤其推崇其革命动员手段，例如使用火车巡回宣讲，并将托洛茨基等人物奉为偶像。纵使布尔什维克被戴季陶视作国民党的威胁，但他仍对这些策略表示赞赏，并认为中国应当在反帝战争中效仿这种革命模式。\n\n戴季陶提出的措施得到了CC系成员的全力支持，其中就包括著名报人陈布雷。然而，军方内部的保守派却认为，军队应该尽可能保持不涉政立场，并坚称训政制度属于党内文官职权。"
 YUN.midgame.452.a: "军队是国民革命的工具。"
 YUN.midgame.452.b: "军队有时必须远离政治。"
 YUN.midgame.453.t: "职业官僚与国民革命"
 YUN.midgame.453.d: "先总理曾经说过：“革命军起，革命党消”。然而，这需要结合当时的背景：同盟会刚刚解散，取而代之的是缺乏革命精神的中国国民党。\n\n时过境迁，先总理对中国革命本质的看法也随之改变。二次革命失败后，幻灭与悲观情绪使得先总理走向更为独断专行的道路，决意独自肩负救国重任。由于要求党员对自己宣誓效忠，中国各地以及广东权力中心以外的自由派纷纷抛弃了先总理的运动。这导致先总理心生憎恨，认为他们是背弃救国使命的叛徒。先总理的主要支持者，包括胡汉民和戴季陶，希望组建一个完全由国民党忠诚分子组成的政党，他们认为，只要党在一个中央正统思想下统一起来，正式的制度就没有必要了。\n\n随着国民党寻求重返国家政治舞台中央，所谓的政学系乃至部分CC系成员，都更加认同技术官僚式的行政管理。虽然他们的确认同国民党事业，但其中许多人与国民革命的联系较弱。然而，他们的专业技能对于妥善治理国家无疑是必要的。不过究其本质，这些人究竟是真正的建设者，抑或是伺机而动的投机派？"
 YUN.midgame.453.a: "一个良好合理的政府离不开妥协。"
 YUN.midgame.453.b: "政学系正是先总理所痛恨的官僚！"
 YUN.midgame.453.c: "必须让新一代国民党技术官僚取代他们！"
 YUN.midgame.455.t: "公安与内务问题"
 YUN.midgame.455.d: "自秦代起，中国的统治者就一直在运用司法手段、专职警察来弹压内部异见。自明代便有了通过“厂卫”来密探监视的起源，而真正的警察制度起源于戊戌变法，并延续到了北洋政府中。国民党的警务体制始于广州市公安局，该机构是仿照美国模式建立的。自此之后，本党的一切警务机关皆称“公安局”。时至今日，国民警政专家委员会和中央警官学校也在寻求联邦调查局的帮助，寻求将麾下的特工从纯粹的瘪三混混变成精锐的间谍、密探和杀手。张群曾经管理过某些警察部门，也实际上在司法院供职，他建议[ROOT.GetLeader]继续沿用旧的路线。\n\n但张群并非唯一想要建立党属警察之人。陈立夫身兼数职，也负责运作国民党中央执行委员会组织部调查统计局。中统由受过良好教育的三四十人组成，分为三个处（徐恩曾的调查处，主管党务调查；主管军警调查的特务处；还有丁默邨的总务处）。\n\n中统特务处的负责人是李士珍，他毕业于黄埔，与蓝衣社有所勾连，并成立了自己的直接向军事委员会汇报的情报部队”特务处“。他曾于日本学习警务，如今正争取着中央警官学校的校长之位，并将手下的特务处分为两个科——侦缉科下是由王柏龄领导的军务组和顾建中领导的特务组。而暗杀科则包括公安局和顾顺章领导的铁血团。"
 YUN.midgame.455.a: "交给张群的公安局。"
 YUN.midgame.455.b: "交给陈立夫的中统。"
 YUN.midgame.455.c: "交给李士珍的特务处。"
 YUN.midgame.456.t: "中国青年"
 YUN.midgame.456.d: "国民党历来将青年视作中国的未来，但也对青年的有组织活动心存戒备。鉴于此，我们选取了3月29日而非11月4日作为青年节，借此来避免过于明显的社会主义倾向。同时，大量由本党支持的青年组织也应运而生。“青年”的定义当下仍有争议，有些人年逾35岁却还在青年组织中，令一些领导人为此头痛不已。\n\n本党建立了青天白日团，而军方则成立了蓝衣社的青年组织。这两者名义上都是非法组织，但却得到了本党内许多高层要人的广泛支持，陈立夫将他们比作特种部队，以此招募爱国青年来作为军队的辅助力量，同时在现有的简陋党校机构中培训新一代党员。\n\n中国童子军则与国民党的关系没有那么密切，随着本党控制日盛，也有提议称要将其改组为国民党童子军。尽管这是一种从西方传来的城市风气，但许多人都对其赞赏有加，称这一运动促进了为青年建立一个纪律严明、热爱祖国的群众组织，鼓励公民行动。中国童子军同样以盛大的集会而闻名——女性在其中可以学习针线女红，男性则可以学习艺术、体育和纪律，这也吸引了许多政治倾向不太明显的家庭参与。\n\n这些组织间的竞争异常激烈。比如蓝衣社就要求其秘密组织里的成员在25岁时不要自发加入国民党，此举引发外界质疑，并被指控不忠。陈诚提议建立一个和党直接联系的三民主义青年团，将以上三个组织合而为一（再由他的盟友暗中主导）。此举得到了三个组织的一致支持，但是三青团内部的勾心斗角还将继续。"
 YUN.midgame.456.a: "青白团会确保三青团内的本党正统！"
 YUN.midgame.456.b: "蓝衣社有点极端，但可以让三青团充满活力！"
 YUN.midgame.456.c: "童子军是青年的修身之路。"
 YUN.midgame.456.e: "在新的领导下，三青团会涤除一切旧思想！"
 YUN.midgame.457.t: "再忆孔夫子"
 YUN.midgame.457.d: "自秦始皇扫清六合统一列国以来，儒家就逐渐成为了中国文化与哲学的基石。儒学与传统思想、复古理想有着莫大的联系，因而在百年国耻与辛亥革命后自然遭到了巨大的冲击。\n\n复兴的国民党右派一直将先总理对孔子思想的解读阐述为在唯物主义与帝国主义横行的世道中为革命奠基的道德基础。虽然大多数人都同意要提倡孝道，并以设立公假、开设学堂的方式来传授孔孟圣贤之说。但戴季陶一派进一步明确指出，《论语》中的治国之道仍然合宜。对戴季陶来说，只有孙中山先生正确理解了，儒学才是中国必须复兴的道德与活力之精神。\n\n还有一些人认为儒学不仅限于中国的道德意识形态。那些蓝衣社成员就崇尚中国历史上那些近乎专制的威权政权。昔日可不存在什么思想自由，普天之下莫不遵从纲纪伦常。"
 YUN.midgame.457.a: "孔圣人自是圣人，可我们也要向前看。"
 YUN.midgame.457.b: "这就是中华文明前进的蓝图。"
 YUN.midgame.457.c: "孔圣人既是解读过去的钥匙，也是通往未来的明灯。"
 YUN.midgame.458.t: "基督徒的天人交战"
 YUN.midgame.458.d: "基督教的性质长期以来都是国内争议不断的话题。首先，基督教肯定是个“洋教”；彼时，四海的蛮夷都用枪口给十字架撑腰，在我们的国土上胡作非为。也正是这些基督教国家妄图瓜分中国，三十年前的义和团运动就是最好的见证。\n\n国民党内部的基督教关系也恰如一幅精彩纷呈的画卷。孙中山、宋庆龄和蒋介石等党领导人自认是基督徒，而其他譬如廖仲恺（反基督教运动大同盟的创始人）和吴稚晖等人则蔑视基督教。许多人都认为中国的教会学校是帝国主义的象征，而这种外来思想在中国自然是不该有立足土壤的。对基督教最为直言不讳的批评者戴季陶也表达过类似观点。\n\n然而，在今日的国民党政府，如同何应钦（天主教徒）和张群（因妻子而皈依基督教）这样的显要人物也为基督教辩护，称其原则有可取之处，可以和中国传统道德一样被人效仿。甚至有传言，陈诚的妻子曾说耶稣本人就是社会和信仰革命的真正领袖——这是一场真正的国民革命。尽管陈诚本人对此事态度摇摆不决，但在最近一次访谈里，他提到自己仍旧认为基督教传教士在历史上就是高高在上、毫不尊重国人，时至今日仍然如此。\n\n这一话题已经威胁到了本党的团结，而近来的辩论也愈演愈烈。像是戴季陶就呼吁驱逐基督教，停止保护教会，停办中国的教会学校。不过讽刺的是，无论国民党怎么抗拒基督教，我们伟大的先总理不也是耶稣的信徒吗？"
 YUN.midgame.458.a: "本党之内，基督教价值观始终有一席之地。"
 YUN.midgame.458.b: "耶稣是个好人，但是基督徒素质有待提高。"
 YUN.midgame.458.c: "帝国主义洋教滚出中国去！"
 YUN.midgame.470.t: "黄埔系崛起"
 YUN.midgame.470.d: "蒋介石之死曾被视作黄埔系作为一支政治力量的终结。彼时，这场建立在军官间私交的新兴派系还掀起过一场新锐政治运动，改写了二十年代党内政治的左右派力量格局。\n\n如今，在何应钦将军的领导下，黄埔系又一次站到了台前。与蒋校长时期一样，他们凭着国民革命军的强大力量主导着政治，同时在政坛中保持中立，以制衡党内的各种主义、各种派系。一直以来，黄埔校友的同窗情谊都是亲如兄弟的，至少外人眼中是如此，这种团结建立在共同的“黄埔精神”之上，并通过黄埔军校的培育得以传承。“黄埔精神”结合了孙文主义哲学、社会主义革命活力、日本武士道乃至当前盛行的极端民族主义与狂热思想。\n\n何应钦将军执掌着黄埔系的航向，而他骨子里仍是一名军人。对何应钦来说，军队就是政府的力量，只有一支强大的军队才能保证本党、本国的存续。北伐期间的何应钦纵然是一位尽责的指挥官，但如今他转向后勤乃至步入政坛后，也发生了思想上的转变。何应钦愈发思索着“黄埔精神无所不能”的正确性，以及是否需要征兵来扩大军队。"
 YUN.midgame.470.a: "精英的黄埔精神才能救民族于水火！"
 YUN.midgame.470.b: "军队和民众都要拥抱群众运动了！"
 YUN.midgame.470.c: "何应钦放手让年轻一代来领导。"
 YUN.midgame.471.t: "委员长的个人崇拜"
 YUN.midgame.471.d: "个人崇拜对国民党来说不是什么新鲜事，自孙中山在二次革命后要求对他个人宣誓效忠以来，国民党就长期以个人崇拜作为统治的有效基础。此事长期以来颇有争议，且短时间内不会平息。\n\n要说有什么改变，那只能是个人崇拜的程度愈演愈烈。在[ROOT.Capital.GetCapitalVictoryPointName]的双十节阅兵上，矗立着一座3.6米高的何应钦将军雕像，象征着他稳坐中央。官修历史加班加点地完善着他的革命履历，通过渲染他与蒋介石、戴季陶（此二人与先总理交情更笃）的关系，来证明何应钦与孙中山的联系。黄埔校史与本党党史两相呼应，道出了谁才是革命的大救星。\n\n此类工作带着极端意识形态的色彩。要说民族复兴是高于一切的目标的话，那么《社会新闻》的编辑们则声称“建立中心偶像是统一国民党的重要条件，是复兴中国革命的第一步。”他们写道，“中国青年发展出了无政府主义思想，口口声声个人主义，以为偶像崇拜便是不对的。这简直大错特错，因为偶像有着强健民族文化、团结民众精神信任之重要作用。”总而言之，刘健群不认为共和制下的专制者和反动的帝王可以混为一谈，相反，他称这是一种相当进步的民族复兴方式。"
 YUN.midgame.471.a: "何将军万岁！"
 YUN.midgame.471.b: "他这次做得有点过火了。"
 YUN.midgame.471.c: "中心偶像是必要的，可他不再是委员长了。"
 YUN.midgame.472.t: "委员长与他的哲学家"
 YUN.midgame.472.d: "什么皇帝总统都会栽培几个权势滔天的心腹，这并不奇怪，不过何应钦主席和戴季陶之间的关系可谓奇特。两人都不太适合抛头露面——何将军的性格比起领袖更像一位追随者，而戴季陶则比较像一位阴谋家。两人共同的盟友蒋介石去世后，“新右派”就再也找不出一位对外的门面人物了。\n\n这两人的性格在其他方面也互有冲突（也有人认为是互补）。何应钦虽然是革命政党的军人，但他却不算是一位开拓先锋，而是自视为政府的忠诚战士。据说何应钦在训练期间，体育教官在其他学员面前训斥他，命令他在一旁站军姿。而全班解散、教官离开后，年轻的何应钦仍然一动不动，因为没有人告诉他可以解散。\n\n戴季陶则是彻头彻尾的革命家，尽管他更喜欢当别人的跟班，如影随形，在孙中山的身边随他游历、替他代笔、为他联络。当蒋介石奋起抵抗汪氏治党之时，戴季陶也对他的朋友鼎力支持，同时也暗自忧虑这场反左战争会不会让蒋介石丢了性命。事实证明，他的想法完全正确。\n\n现在的问题是，谁才是当下政权的真正操盘者。蒋介石去世后，高层中就再也无人能够独揽党、军两项大权了。"
 YUN.midgame.472.a: "戴季陶和本党会为民众发声。"
 YUN.midgame.472.b: "何应钦和革命军会保卫国家。"
 YUN.midgame.473.t: "陈立夫的《唯生论》"
 YUN.midgame.473.d: "随着CC系的影响不断扩大，其代表人物陈立夫的理念也日益显赫。在他的著作《唯生论》中，对亨利·柏格森的医学/精神哲学理论进行了中式注解，认为自由民主主义对于政府来说已经过时了。陈立夫指出美国的共和党、民主党内斗就造成了灾难性的分裂。\n\n而同样，路易十四的“朕即国家”原则也无法用在现代的民国。国民政府主席（日后的民国总统）应该做“各阶层的父母官”，更接近于路易·波拿巴。陈立夫概念里的独裁者并非将权力强加于大众，而是民权的充分体现。他心中的国家不仅要维持社会秩序，还要作为人们“践行忠于祖国”的切实理想。\n\n陈立夫拥趸的意识形态基调可以类比罗马尼亚铁卫团对农民的赞扬，抑或是俄罗斯保卫联盟对现代化、机器和工业暴力的追求。和前辈戴季陶一样，CC系融合了传统与前卫的信仰，用超然未来与安守过去的理念推动国家进步。\n\n受过工科训练的陈立夫为表对进步的追求，曾将政治局势与牛顿第二定律做类比。如果力等于质量乘以加速度，那么大众运动的力量就与其规模和狂热度成正相关。CC系欢迎世界大战，认为大规模的暴力可能有助于民族振兴，并认为这样才能动员起群众忠于党的主义。"
 YUN.midgame.473.a: "时不我待！我命由我！"
 YUN.midgame.473.b: "我们的民族要有一位青天父母官！"
 YUN.midgame.473.c: "农民群体、民众的精神与三民主义这三者不可分而论之。"
 YUN.midgame.473.e: "暴力和死亡带来民族的涅槃！"
 YUN.midgame.474.t: "委员长的臂膀杨永泰"
 YUN.midgame.474.d: "杨永泰是政坛上的老狐狸，在重要问题上，他总是备好了两套方案——一套支持现状，一套则完全反对。在洞察到主席的意见后，他就会拿出与之观点相同的那一套，然后做出一副自己从头到尾都是站在这一方的样子。因此，他就像变魔术一般，创造出了自己和领袖步调永远一致的假象。\n\n政学系并没有正式的组织（新中国建设学会很快就解散了，这既是避讳在党内搞小团体之嫌，也是因为其成员很难聚在一起），本质上还是一个小圈子。人们将他们比作内朝亲信，即和权力中心联系甚密，但从不会躬身讨好百姓。这种建立在人脉之上的精英圈子对公众总是高高在上，这自有其一定的优势（比如军方不会把他们视作威胁），但也意味着他们脱离群众运动，容易被蒸蒸日上的对手们当作攻击的目标。\n\n政学系在国民政府机关、地区行政机构甚至部分军队中与日俱增的影响力激怒了各路对手。CC系密谋在政府内部阻挠他们；土木系则号召民众反对他们；而蓝衣社则开始对政学系成员动用暴力。所有人都呼吁[ROOT.GetLeader]打压政学系。"
 YUN.midgame.474.a: "逆水行舟，不进则退！"
 YUN.midgame.474.b: "让我们放慢脚步，适应这种体制。"
 YUN.midgame.475.t: "朱门酒肉"
 YUN.midgame.475.d: "随着国民革命的推进，可用之才少之又少，让国民党不得不遂张群、杨永泰与李根源之意，启用许多旧政学系的成员出任要职。他们在官僚机构中说一不二，威胁着要盖过一切其他派系势头之总和。\n\n虽说CC系、土木系和蓝衣社的嫉妒之心众所周知，但政学系日益增长的影响力甚至让他们在莫斯科委员会里的惯常盟友，乃至黄埔出身的靠山们都忌惮三分。这种缺乏透明度的做法招致了莫斯科委员会的后起之秀张继痛斥：“欲知中国政局之真相，非到中国银行楼上探听不可。”\n\n所谓的中国银行便是政学系的非正式总部，也是张群、杨永泰和吴铁城等人本部所在。许多国民党统治下的富人对此敢怒不敢言，最终还是不得不拜了他们的码头。政学系的队伍里包括著名的银行家与金融家孔祥熙、蒋廷黻和吴鼎昌；也有像谷钟秀、王世杰、王又庸和张耀曾这样的顶尖学者、法学家与知识分子。当然也少不了军政界人士。\n\n政学系极其灵活，包含了不少前北洋（尤其是旧皖系）人物，这也意味着其中不少是维护旧秩序的角色，和国民党鲜有联系。像张君劢的胞弟张公权就是一位富商、银行家，也是新月社的诗人、名声在外的联省事业资助者——同样是政学系将他吸纳到国民党中的。\n\n那些“真正”党员的大规模不满与日俱增。许多人觉得自己晋升无门，而高位尽为这类腐败精英所窃居。而政学系的对头们则利用这一点，为国家的许多困难问题找到了替罪羊。在政学系的实权高层们会谈时，一些人提出应该为了派系的利益而主动出击。"
 YUN.midgame.475.a: "我们必须要讨好军队。"
 YUN.midgame.475.b: "我们应该捍卫经济计划事业！"
 YUN.midgame.475.c: "我们必须努力控制住政府！"
 YUN.midgame.476.t: "庐山会议"
 YUN.midgame.476.d: "在早年间起床号回荡于黄埔军校之时，某些学员就已经想到，未来某日，一些极邪恶的东西可能会篡夺国民革命——譬如工团主义的幽灵。正是在这座满载尚武革命教育和尚武革命精神的神圣殿堂里，一些组织形成了起来，发誓遵循委员长的教诲，并与校内日益壮大的社会主义影响力作斗争。随着黄埔同学会这样的小团体（大多是秘密团体）涌现，不少人产生了更为激进的信仰。\n\n激进主义和革命热忱方兴未艾，引得何应钦委员长都照例派了他的秘书刘健群去对此类会议做了监视。但今日，委员长决定亲自去拜访他们。在庐山脚下，他对几百名军方领导、蓝衣社领袖宣布，现在比以往任何时候都需要重燃革命热情。\n\n像滕杰这样的蓝衣社领袖便宣称，他们的理论是在重构出新的三民主义：保卫民族国防安全、培育极端民族主义和建设人民国家。诸如俄国的日出计划和日本的武士道精神及现代化的成功，都是新中华国家可以参考的潜在蓝本。甚至有人提出，如今中国应该放弃三民主义——抛弃民权主义，拥抱国家民粹主义。\n\n当然，俄罗斯的保卫联盟和罗马尼亚的铁卫团也受诸多争议，譬如铁卫团是一场寻求与过去和解并粉饰君主制的运动；保卫联盟则追求通过威权的共和领导来实现人民的民粹主义。黄埔军方不少领导人都支持更为保守的革命路线，而激进分子们则更为提倡大步跨入新的未来。"
 YUN.midgame.476.a: "鉴往者，可以知来。"
 YUN.midgame.476.b: "革命必须要演化到下一阶段了。"
 YUN.midgame.477.t: "反赤战争"
 YUN.midgame.477.d: "近期城乡都爆发了前所未有的暴力事件后，恐惧已在广州国民党政府统治区蔓延开来。在乡村，从国民革命军中独走的蓝衣社官兵组织起了“别动队”来恐吓社会主义公社与民兵。而在城镇中，左派、自由派的报刊与工会则遭遇了市同志锄奸会、青年自强社、华中先锋社和市互助社等组织的袭击。\n\n不过讽刺的是，给黄埔干部中最激进军官做启蒙的正是社会主义者。赤俄的契卡流亡者让好奇的黄埔学员们见识了最高效的刑讯手段，而前复兴社的成员也曾在第三国际国家停留期间接受过英国国家调查局的训练。\n\n日复一日，《民国日报》都报道着一起又一起热闹街道上的刺杀，又或是静谧夜晚里的残杀。更糟糕的是，很多报刊文章揭露了所谓杀人清单的丑闻，上面赫然许多中国自由派与社会主义者的名字。在本党之内，政学系成员批评了这种对自由派和商人的暴力，担心此类行为会对党的合法性与国民经济造成损害。军队中的陈诚一派也加入了批评，称许多社会主义者都拥护孙中山的主义，而那些在闽赣根据地中奋战的烈士们也不乏社会主义者。黄埔系和CC系都心照不宣地认为确实应该不惜一切代价打压赤色分子的影响，但也同样都担心，当下此举无异于开鼓励党内流氓行径之先河。"
 YUN.midgame.477.a: "立刻制止这样的乱象！"
 YUN.midgame.477.b: "民族之树正要靠逆贼的鲜血来浇灌。"
 YUN.midgame.478.t: "多面陈诚"
 YUN.midgame.478.d: "陈诚的角色实在复杂。他毕业于保定军校，与1924年国民党改组后涌现的一批黄埔优秀学员出身不同，多少有些格格不入。尽管陈诚对总司令蒋校长感情深厚，但他在政治和经济上却相当左倾。\n\n凭着这样的关系，蒋介石的精神继承者何应钦乐于让陈诚在再起的国民革命军中占有一席之地。陈诚的各种联系让他声名显赫，他也在说服人们严守黄埔革命纪律的方面成果斐然。不过，他激进的性格和对左派运动的同情让他在黄埔的激进右派眼里无异于眼中钉，他们觉得陈诚简直就是穿上军装的工团暴徒。\n\n随着陈诚名声日隆，他正处于分歧路口上。忠于何应钦固然回报丰厚，但他或许也可以与寻求民主与平等社会的各地左派建立良好关系。又或是他的保定背景可以派上用场；又或者，是时候让陈诚独力肩负起国民革命之重任了。"
 YUN.midgame.478.a: "忠于黄埔系是重中之重。"
 YUN.midgame.478.b: "我们要追求的正是社会主义。"
 YUN.midgame.478.c: "在这场革命里，我们可以在全国寻觅许多同志。"
 YUN.midgame.478.e: "只有陈诚一人可以引领革命前进！"
 YUN.midgame.479.t: "湖北试点"
 YUN.midgame.479.d: "老话说，饮水思源、不忘来路，陈诚心中亦是如此。他从小家境贫寒，负担不起教育，只能选择从军。无论国民政府的疆域多大，陈诚都不会忘记自己曾经的处境，因此他担负起了改造与振兴各省，使之摆脱贫困周期律的责任。\n\n土木系全国改革的首个试点是湖北省，陈诚已经接任该省主席。他们在当地即刻展开了禁烟、禁嫖、禁止跳舞及其他腐化堕落行为的工作。土木系同严立三、朱怀冰一道计划展开更大规模的改革，要与深层次的腐败作斗争。因为湖北的财富都掌握在与犯罪组织乃至CC系有所勾结的地下集团手中。\n\n省内左派敦促陈诚采取更多措施，以践行国民革命对民生的承诺。然而，黄埔系也在私下表达了对此类举动会与CC系产生龃龉的担忧。自然，现在不是在党内搞派系斗争的时候，可自然对于民众也不能不管不顾。无论如何，陈诚再次处于抉择之中，需要在情况日益复杂的国民革命中应付各方压力。"
 YUN.midgame.479.a: "民众比以往任何时候都需要我们。"
 YUN.midgame.479.b: "最好还是听听高官的意见。"
 YUN.midgame.479.c: "我们还可以为民众做得更多。"
 YUN.midgame.480.t: "从总理高徒到政治花瓶"
 YUN.midgame.480.d: "众所周知，孙中山逝世后的广州国民政府时期，统治革命军政府的三人是汪精卫、胡汉民与蒋介石。而胡汉民虽是立法院长，名义上也被认为是国民党右派的实际领袖，但他却发现自己渐渐被排挤到了党派政治之外。近日，胡汉民郁郁不得志，尤其是他在与戴季陶和行政院的沟通中，不得不接受何应钦委员长愈发频繁的“协调”。\n\n但无论如何，胡汉民在国民党在广东的旧人脉中仍然名望甚高；陈济棠、古应芬、林森、居正和邹鲁等人都时常在他左右。黄埔系在广东的影响力遭到粤系的反击而愈发消退，而何应钦试图通过恶名远扬的地方派军阀陈济棠来控制粤省，防止其直接叛乱——但近来几日，随着陈济棠持续支持胡汉民，这一算盘也逐渐落空。\n\n当然，现状也有着保持和平的迹象，只要继续维持正统，就能持续安抚胡汉民，避免其发难。新桂系中也有着潜在的盟友，虽然他们对黄埔系在革命中的影响力向来反感，但不管怎样也算是粤系各派别的老对头。何委员长还可以寻觅胡汉民在文官政府中的对头，培养一个更广泛的文官领袖同盟，以此来遏制粤系日益膨胀的声望。"
 YUN.midgame.480.a: "专注对地方军头展开工作。"
 YUN.midgame.480.b: "和建制派文官合作。"
 YUN.midgame.480.c: "维持党的正统。"
 YUN.midgame.481.t: "立法院"
 YUN.midgame.481.d: "随着国民党右派领导的革命持续推进，党内议会进程中的紧张局势正在日益加剧。立法院长胡汉民曾与行政院长戴季陶组成了不稳定的联盟，尽管被迫与其他国民党右派分享权力，但胡汉民仍被认为是对三民主义理解最为深刻、成果最为丰硕的理论家之一。胡汉民自同盟会时期就一直跟随孙中山，是最受爱戴的孙中山追随者之一，在党内拥有相当大的权力。\n\n如今，随着党内联盟日益分明，胡汉民或将寻求与党内其他派系接触，以巩固自身地位。政学系的谷钟秀和黄郛或许是合适的盟友，但政学系素来以更注重经济计划而非真正的革命意识形态而闻名，这可能会让一心追求正统三民主义革命理念的胡汉民感到不安。浙江出身的陈果夫虽与胡汉民存在分歧，但他近期已多次秘密拜访胡汉民的办公室。陈果夫的支持无疑会促成胡汉民与戴季陶和解，胡汉民可以利用两人的力量来制衡委员长的权力。或者，胡汉民也可以利用自己在广东的派系巩固权力，尤其是争取国民党太子孙科的支持——这将成为维系胡汉民党内威望和影响力的关键筹码。"
 YUN.midgame.481.a: "要团结我们的朋友。"
 YUN.midgame.481.b: "我们应该和政学系合作。"
 YUN.midgame.481.c: "陈果夫是个有力的盟友。"
 YUN.midgame.482.t: "孙先生的虎将"
 YUN.midgame.482.d: "在驻粤滇军中始终有这样一位令人敬佩的人物，他本人将自己的主义、忠诚与誓言置于一切之上。也许没有什么事情，比这更能体现一个人是如何为了白日高升的理想勇敢地响应号召、顽强地坚守本心。正如朱培德参加重九起义之时，只是一个普通的兵丁；正如朱培德在护国运动中奋勇斗争，又转而投入护法运动一般。\n\n朱培德恪尽职守，其服役中的优异表现让他得以跻身于中央执行委员会，亲自指挥国民革命军第三军。他与很多人都交情甚笃——谭延闿、李济深、邓演达、朱德乃至于蒋介石。赫赫战功也让他得到了国父孙中山口中“虎将”的美誉。朱培德的第三军坚韧不拔、作战意志坚决，大败了邓如琢的部队。而随着北伐的惨痛失利，第三军伤亡惨重以至于建制瓦解，遂于蒋介石总司令的命令下转进贵州，此刻真乃举步维艰。\n\n所谓兵败如山倒，蒋总司令旋即遇刺，而引导国民党右派的重任就落在了朱培德身上。他临危受命，成功确保国民革命军第一军、第二军、第三军、第六军、第七军和第十六军以及其他诸部顺利进入贵州，可以说是扶大厦之将倾、挽狂澜于既倒。而朱培德本人也毫不犹豫，继续大步前进，在革命军指挥官间建立了一个委员会，带领贵州国民党度过了三十年代风雨如晦的岁月。\n\n朱培德再次投入了行动中，而他也从未辜负过本党，不过他这次却和新老盟友的关系十分微妙——无论是从历史的灰烬中重生的李根源，还是他已经倒向社会主义的故交朱德。毫无疑问，未来几年将会决定着朱培德的形象和留下的传承究竟为何——是国父忠心耿耿的臂膀，是第三军的英雄，还是各方妥协达成的候选人物？"
 YUN.midgame.482.a: "益之未曾辜负本党！"
 YUN.midgame.482.b: "滇军健儿当自强！"
 YUN.midgame.482.c: "而我们的国家会走向现代……"
 YUN.midgame.483.t: "山中宰相"
 YUN.midgame.483.d: "第三军“右派”——这个新近得名的派系的确不是朱培德的一言堂。尽管第三军内部确实还有范石生、金汉鼎等人，下属中亦有朱世贵、张彦川、甘芳、刘耀扬、袁绩熙等众多将领，但论及分量、影响力与个人威望，无人能与李根源相提并论。作为朱培德的幕后靠山，李根源向来在云南备受尊崇；他既是民间英雄，亦是救国功臣，更被誉为“山中宰相”。\n\n李根源虽以军人起家，且功勋卓著，但他注定要成为一名管理者和领导者。他是一位启迪青年，引领家乡迈向更光明未来的人。他以兴办学校的善举闻名，毕生倾力回馈乡梓，于1911年创办了大理模范中学，1912年又创办了腾冲师范学校。1917年，李根源主政陕西期间厉行禁烟、保护文物古迹、扩建省立图书馆、创立陕西师范学堂等等。1926年返回云南后，李根源又做了许多类似的工作，还协同地方官员和黄炎培等人创立了乡村民主合作社。纵观李根源的整个职业生涯，他始终致力于保护中国的历史和文化。\n\n因此，云南人民总是无比推崇李根源。无论是在沙场还是政坛，李根源都为人民做出了无可否认的贡献，为了让他深爱的家乡人民过上更好的生活，他自己也饱尝苦难。然而，这番赤忱也让李根源在国民党内树敌众多——在反对者眼中，他无异于彻头彻尾的叛徒，仅仅是依靠与士绅、当权者和政学系的关系苟延残喘罢了。说到底，谁又能断言李根源的真实意图呢？但不可否认的是，他的确发挥了积极作用。"
 YUN.midgame.483.a: "民众皆敬仰李根源！"
 YUN.midgame.483.b: "不可宣扬个人崇拜。"
 YUN.midgame.483.c: "这种举动无异于政治投机倒把！"
 YUN.midgame.484.t: "一度军阀，一生战士"
 YUN.midgame.484.d: "要准确评价朱德的真正意识形态，实属不易。朱德首先是一位军人，他始终认为自己的职责仅限于在军事层面推动革命，比如在战场上作战，制定战役计划，而不是在座谈会和论坛上高谈阔论。鉴于朱德是蔡锷的门生之一，而蔡锷又以厌恶政治和政客著称，因此朱德会有这样的自我认知也就不足为奇了。然而，这并不意味着朱德没有意识形态或社会主义信仰，甚至将政治思想与军事事务割裂开来。朱德曾明确指出，他理想中的军队应当由工农构成，而军政干部则只能来自于城市无产阶级。\n\n此外，朱德始终以社会达尔文主义视角看待军事主义，这与他的滇军战友如出一辙；在他看来，军队应当成为救亡图存的旗手，士兵们也应清楚认识自己究竟为何而战，以免陷入腐败和贪婪的泥沼——对于人性的这一弱点，朱德有着远超他人的深切体会，他时常痛惜自己在蔡锷逝世后堕落为四川的地方军阀，任用亲信、攫取财富，甚至一度染上了鸦片瘾。然而亡羊补牢为时未晚，朱德在远赴欧洲后，又找到了新的人生目标。\n\n朱德将国民革命军视为社会主义政权的最重要捍卫者，并秉持着这样的理念：无论在使命上还是精神上，国民革命军都必须是一支阶级军队。这支军队决不能脱离群众，沦为帝国主义压迫工农的工具；国民革命军应当成为解放工农群众的武装力量，一支肩负国际使命的军队。在他看来，决定革命战争胜负的并非科学技术、现代化武器或强大的火力，而是政治、政治制度以及人心所向。朱德正是怀揣着这样的理想和希望，并为之不懈奋斗。"
 YUN.midgame.484.a: "身在右派心向左。"
 YUN.midgame.484.b: "朱德老总勇往直前！"
 YUN.midgame.484.c: "不过，他明白什么叫谦退之节。"
 YUN.midgame.485.t: "云南的社会主义新星"
 YUN.midgame.485.d: "第三军巩固了国民党在西南的新据点，无疑在推进势不可挡的国民革命现代化进程中发挥了关键作用。然而，目前也仍然缺乏一个清晰的愿景。朱培德将军对作妥协并不陌生，对于国民党政权前景的看法也相当灵活。\n\n而第三军中的许多人对于中国未来有着更为激进的愿景，将国民革命视作一场社会主义革命。第三军军官教导团长朱德，就致力于让该军慢慢左转，转为中国工农的武装。而在工人阶级中，有两位冉冉升起的新星脱颖而出。\n\n王德三在二十年代早期接触到了社会主义圈子，加入马克思学说研究会担任法语翻译。1922年，在邓中夏的介绍下加入了中国工团党，随后与国民党合作，出任黄埔军校的政治教官。王德三则是西南地区的社会主义主要人物。\n\n另一位后起之秀罗炳辉出生于一个贫苦的农民家庭。他的军旅生涯始于唐继尧麾下，随后又转而反对唐继尧，加入了朱培德的国民革命军。罗炳辉的经历使得他痛恨地主士绅，于是他秘密加入了工团党，向朱德靠拢。\n\n随着这些新星脱颖而出，左派势力日益壮大，许多人开始否认朱培德或是李根源的权威。有些普通士兵甚至只向陈毅、王均等左派军官汇报。许多人认为这就是第三军兄弟分成左右派搞摩擦——尽管各方之间还是存有同志情谊的。"
 YUN.midgame.485.a: "红星闪闪照西南。"
 YUN.midgame.485.b: "意识形态在军队中永远只能是第二位。"
 YUN.midgame.485.c: "上下级指挥自有其存在理由！"
 YUN.midgame.486.t: "永远的战士"
 YUN.midgame.486.d: "如此磅礴的精神！如此传奇的经历！如此英勇的奋斗！如同一股不可阻挡的自然伟力，注定要铸就后世的革命洪流！这就是李根源！虽然许多人将革命成果归功于李根源，然而他却遭到蔡锷、国民党和北洋政府的攻击抹黑，但云南绝不会辜负他——李根源是一位真正的西南赤子，坚韧粗犷、刚强有力。士兵、军事教官、校长、指挥官、官员、省长，李根源曾经身兼数职，如今，他的职业生涯仍在不断续写新篇。\n\n李根源对军事生涯是如此的执着，以至于1905年时，当时还只是一名日本陆军士官学校年轻学生的他，一想到要转学非军事专业就羞愧难当——甚至表示“宁死不从”。如果李根源的爱国情怀仅是例行公事、机械虚伪的伪装，那他便不会有这般令人难以理解的坚定信念。正是这份赤诚，成为了他人生中诸多艰难坎坷的慰藉。\n\n李根源的奉献精神早已深入人心，他的话语被云南陆军讲武学校乃至整个国家永远铭记。“尚武之风不振，则武人不出；武人不出，则民族之魂亡；民族之魂既亡，国将安存？吾等唯愿中国之武士道兴起，则保家卫国，易如反掌矣。”如此谆谆教诲，如此豪迈气魄，让云南上下清晰认识到，李根源才是真正的云南民族主义之冠，难怪他在官兵民众中的追随者与日俱增。\n\n无论如何，李根源的传承都已深深烙印在当代军人心中，无论是通过他的门生顾品珍（顾品珍曾击败过吴佩孚之流），还是通过他灌输的精神——这一精神至今仍激励着他的学生金汉鼎和胡若愚。从朱培德到龙云，当代革命军人或多或少都曾受益于李根源。如果没有李根源，国家很可能早已在袁世凯治下遭受灭顶之灾。"
 YUN.midgame.486.a: "留给本民族的不朽传承。"
 YUN.midgame.486.b: "他是明日革命之父！"
 YUN.midgame.486.c: "可敬可佩，然终不过是往日之影。"
 YUN.midgame.490.t: "党与青帮"
 YUN.midgame.490.d: "自反抗满清帝制的革命之初以来，不仅在国民党内部，在中国的黑社会中也涌现出了一批爱国的英雄革命者。许多国民党领导人，如孙中山、蒋介石和陈其美，都与洪门和青帮等秘密结社有联系，这些黑道势力虽因贪婪本性而勾结，却展现出类似日本极道或意大利黑手党的奇特英雄忠诚气概。此类犯罪纽带虽然在国民党最落魄时有所助益，但这些见不得光的联系此后也损害了国民党的声誉。\n\n尽管CC系和蓝衣社彼此敌对互不信任，但他们都与青帮保持着广泛联系。以蓝衣社成员刘时雍为例，此人同时深植于上海帮会网络，有不少徒子徒孙。近年来，CC系和蓝衣社甚至会雇佣青帮组织来强制推广忠于国民党的工会，并试图利用黄色工会来解决劳资冲突。尽管由于工团党和中工盟的存在，国民党内普遍对工会持怀疑态度，但靠着青帮的暴力控制，尤其是在沿海城市，强制推广国民党单一工会体制要容易得多。\n\n尽管党内许多右派人士希望最终吞并洪门，但鉴于其势力之大，目前看来这似乎难以实现。史量才发现了孔祥熙等国民党高官之间的秘密白银交易，并威胁要将丑闻曝光出去，孔祥熙则通过政学系要求秘密“制裁史量才”。面对党内自私自利泛滥、贪腐暴行常态化的沉疴积弊，人们不禁要问，到底谁才是真正的罪犯？"
 YUN.midgame.490.a: "不论过去有什么联系，罪犯都该严打。"
 YUN.midgame.490.b: "有时候道德底线可以灵活些。"
 YUN.midgame.491.t: "腐败循环"
 YUN.midgame.491.d: "所谓关系，即是关怀、联系，乃是中华文化博大精深的一环。这指代一种深厚的人脉网，一种比单纯的商业联系或是私人交情更为强劲的关联。这种文化来源于儒家思想，在政治、商业和社会中都能看到它的身影。\n\n然而，对于许多民国的外部人士来说，这个概念在国民党政府中如同与“腐败”及“官官相护”画了等号。国民党运动中日益增长的自私自利与冷漠无情令人敬而远之，使得意识形态的忠诚纽带减弱，而私相授受则日趋受到青睐。背后有没有靠山成为了政府任命的重要因素，政治改革寸步难行，党的名望也一落千丈。\n\n即使是最廉洁的人也避不开腐败的浪潮，因为贪腐已经深深根植于体系之中，反腐会让任何人——哪怕是国民政府主席本人都下台。\n\n党的支持基础开始缩减。为了保护这些有利可图的关系网，党内官员开始强调群众应该“各安本分”，莫谈国事。这种宋明理学思想自然没法让他们融入民众，许多人也担心这是否会动摇我们的政府。"
 YUN.midgame.491.a: "必须让民众相信我们，还有无所不能的领导者！"
 YUN.midgame.491.b: "要实现和谐，就要君君臣臣各守本分。"
 YUN.midgame.491.c: "我们要以革命的热情，撼动这套关系网！"
 YUN.midgame.492.t: "贵州的腐败丑闻"
 YUN.midgame.492.d: "作为一个致力于改善中国民生的政党，国民党在土地问题上被各种意识形态拉扯得四分五裂——党的左右两派都无法就如何完美解决土地问题而达成妥协。何委员长就首当其冲受到批评，称他虽然承诺政府会执行公平、充分的土地改革，但他本人却在贵州田产无数。而他的内兄王伯群也备受公众关注。王伯群是早期的同盟会成员，在武昌起义后尝试召开的议和会议时与孙中山有过接触，后任交通部长，在改善电信、铁路乃至航空方面颇有成就，为人所知。然而，近几个月的一场群众运动却揭露了他参与鸦片贸易的罪行，政府中许多人，尤其是土木系成员都要求他下野。贵州政坛的知名人物谷正伦也要求调查何委员长的财产（也许是为了削弱何氏在贵州的控制），并得到了政学系的支持。何应钦的弟弟何辑五曾在王伯群手下出任中国航空公司副董事长、贵州省政府委员和贵阳市长候选人，他也受到了审查。"
 YUN.midgame.492.a: "奇谈怪论，满嘴放屁。"
 YUN.midgame.492.b: "我们必须一查到底。"
 YUN.midgame.492.c: "谷正伦主动彻查此事。"
 YUN.midgame.493.t: "党的浙江化"
 YUN.midgame.493.d: "国民党长期都以广州作为根据地，是典型的由南方人主导的党派。广东政客和形形色色的广东人曾构成了党的主干。然而，在戴季陶、陈果夫和已故的蒋介石的影响下，新右派则大部分来自浙江，少部分来自贵州。这引起了不满，也引发了他们同广东元老们的争斗。\n\n即使在使馆城市建立后，上海连同富庶的江南仍然是国民党右派的主要活动地区。许多党员都经由关系网与这些城市紧密联系，就如陈氏兄弟可以凭着家庭、社会、银行、地方乃至政坛的人脉将CC系发展成一股政治力量。而对革命领袖陈其美的追忆在沧海桑田的上海社会中也仍占有一席之地。许多“爱国”精英人士将宝押在了国民党上，提供了数以百万计的贷款。同样，以青帮为首的许多秘密结社都开始背靠着浙江关系，对抗党内的社会主义者和广东派。\n\n但这也并不意味着在莫斯科派占大头的广东人已经穷途末路。他们仍然是党内的知识分子先锋，也保有着广泛的金融界、政界人脉，使之可以与江南的士绅、富商及实业家分庭抗礼。此外，北方人则多同情政学系，认为他们更为随和，少有激进。政治转型并非一蹴而就，但也一刻不停——戴季陶和陈果夫等浙江籍知识分子继承了一种家乡中更为保守、更像儒生文人的改良主义，而不太有党内的所谓“太平天国”式的风气。"
 YUN.midgame.493.a: "秩序和革命未必要对立。"
 YUN.midgame.493.b: "也许求稳的盟友会更好？"
 YUN.midgame.493.c: "必须要保持过去革命的劲头！"
 YUN.midgame.494.t: "确立党的路线"
 YUN.midgame.494.d: "建立具有凝聚力的党的路线从来都是CC系主管的中央政治学校的使命。戴季陶和陈果夫亲自帮助挑选了许多早期黄埔毕业生，而陈立夫则参与国民党组织部工作，协助将社会主义渗透分子这样的不速之客踢出队伍。\n\n但党的正统并不能只靠排除异己来实现。国民党还需要展现出一个中国新社会的愿景，一个可以动员起民众为了胜利而牺牲的愿景。\n\n新文化运动对党影响深远，其中对我们的理念既有支持的声音、也有反对的声音。党校印刷的许多公民教育教科书都强调三民主义的现代与平等，反映了新文化对生产力提高、实现进步、争取妇女权益以及工人阶级的社会与经济福利的需求。\n\n然而，在戴季陶的影响下，国民党也强烈反对新文化运动中的颠覆传统与个人主义思想。他们呼吁由党指导，建立一个有机结合的社会；党在其中既要有机结合，也要客观独立，发挥导师的作用。\n\n国民党内部对于理想社会的愿景也有些分歧。更传统的思想家们认为，要恢复旧日的家天下体制——让宋明理学建立在一系列等级关系之上，而让这些关系统合为一个集体。而更为现代的思想家们则为，应该进行更加有效的统合——即建立一个有机统一的党国。"
 YUN.midgame.494.a: "我们可以重建孕育我们的中庸纽带！"
 YUN.midgame.494.b: "要建设一个现代、进步的社会！"
 YUN.midgame.494.c: "我们要追求一个国家、一个民族、一个未来！"
 YUN.midgame.494.e: "民众可以替自己做主。"
 YUN.midgame.495.t: "革命之目的"
 YUN.midgame.495.d: "“革命之目的究竟为何？”戴季陶设问。“就是从少数人的手里把摧毁旧文化的新文化夺取过去，让群众百姓也能分享新文化的高尚地位。这样的目标不能算作不节制，因为我们民族千百年前的时候就是享受着这样的地位的。我这样年纪的人，在那些接触‘现代之文明’较晚的国度，也可以体察到人伦之美、生民之乐。”\n\n随着民族主义信念的空前高涨，人们对从根本上改造社会的信心也大为提升。对国民党右派来说，如今一切皆有可能。要通过民族主义，也只有通过民族主义和国民党，才可以创造一个平等的社会，一种没有颓废享乐的文化。这样的大同之世自然建立在孔夫子的道德上——戴季陶认为，这比起马列的思想更多地启发了孙中山的主义。\n\n三民主义之中，“民族主义的基础，就是在孝慈的道德；民权主义的基础，就是在信义的道德；民生主义的基础，就是在仁爱和平的道德。”换句话说，三民主义真乃中国继绝开来之主义——既受儒学的启迪，又有着救华夏于中落的革命重任。"
 YUN.midgame.495.a: "讲孝慈，才有民族的团结。"
 YUN.midgame.495.b: "守信义，才有民国的生存。"
 YUN.midgame.495.c: "仁爱平和，才是民生的根本。"
 YUN.midgame.495.e: "真是好一通废话！"
 YUN.midgame.500.t: "朱培德清洗龙云"
 YUN.midgame.500.d: "朱培德向中央政府臣服，以换取中央承认他的省主席职位，这大大增强了他的权势。在得到中执委的秘密授权后，朱培德逮捕了龙云及其众多亲信，将昭通牢牢控制在自己手中。\n\n昆明向[ROOT.OVERLORD.Capital.GetCapitalVictoryPointName]臣服，改变了西南地区，乃至整个中国政坛的力量平衡。曾经权倾一时的龙云将军被捕入狱，表明国民党并非像当地士绅所希望的那样，只是“路过”云南，然后进军广州，而是决心深耕当地，按照党国体制的路线重组云南。\n\n朱培德并非唯一因近期事态发展而增强权势之人。狡猾多变的胡若愚目前仍掌控着滇南的蒙自地区，尽管他此前与德国和直系势力眉来眼去，但他也是首批为了保住权力而改弦更张的主要滇系军阀领袖之一。随着胡若愚的两个最大对手（唐继尧和龙云）相继出局，许多原本省精英纷纷投向他的怀抱，以抵抗革命派的侵犯。\n\n不过就目前而言，朱培德的地位十分稳固。胡若愚继续公开宣示效忠，甚至有时将自己描绘成左派，以巩固党内支持，从而避免落得和龙云一样的下场。然而，胡若愚也建议云南省府将龙云交由自己看管，以缓解士绅的担忧。考虑到胡若愚将军时而与龙云竞争，时而又与龙云沆瀣一气，因此他不太可能放任龙云逍遥法外，但有可能让龙云继续担任战地指挥官，这让许多人感到担忧。"
 YUN.midgame.500.a: "龙云将继续被羁押在昆明。"
 YUN.midgame.500.b: "龙云将被转押至蒙自软禁。"
 YUN.midgame.501.t: "李根源的第二次机会"
 YUN.midgame.501.d: "为了维系对云南的脆弱控制，朱培德被迫依靠多方势力支撑，包括第三军左派激进分子、他在第三军内部的右派同僚（忠诚度存疑）、云南士绅，以及如今逐渐崛起的政学系——朱培德必须精巧制衡各方力量，使其相互牵制。\n\n朱培德与李根源的合作，在某些方面是自然结果，但在某些方面则是一场危险的赌博。李根源将军虽名义上退居幕后，却毫不掩饰自己的政治野心。李根源曾是蔡锷副手和云南陆军讲武学校教官，历史上曾因其革命领袖魅力与唐继尧和云南士绅发生过冲突，但也因在二十年代支持岑春煊和推动南北统一和谈而与孙中山和国民党本流决裂。尽管朱培德一直凭借自己手中的权力保持政治独立，并在顾品珍和唐继尧冲突期间维持中立，但众人仍质疑朱培德是否会落得和顾品珍一样的下场（顾品珍短暂掌权期间因被指控为李根源的傀儡而名誉受损）。\n\n政学系的影响力现已渗透至贵州。张群是原第一军的著名后勤主管，他培植了自成一派的“新政学系”。张群与国民党建制派较为亲近，与李根源的派系也保持着松散的联系，但仍然是一个独立的团体。\n\n总而言之，李根源有望成为朱培德稳定云南省的重要合作伙伴，但由于李根源不受欢迎且野心勃勃，他也有可能会动摇朱培德的统治。"
 YUN.midgame.501.a: "欢迎他帮助地区行政管理。"
 YUN.midgame.501.b: "他是我们巩固统治的威胁。"
 YUN.midgame.502.t: "何应钦失势"
 YUN.midgame.502.d: "何应钦与他国民革命军中同僚指挥官们的关系颇具争议，许多人把他视作蒋介石的走狗，却又在几个关键时刻背弃了蒋介石，有损他在黄埔系中的信誉。他在流亡期间还能保持影响力的首要优势就是他在贵州的广泛人脉。但如今，本党已经重回许多其他省份，他的影响力也就相对下降了。他个人来说并没有太大的魅力，也并非令人敬畏，因此也极易在全国范围内遭到孤立。\n\n在朱培德和李根源的筹算下，中央政府正秘密向这位黄埔出身的将军施压，让他辞去贵州省主席一职。他们发觉了何应钦的桀骜和腐败，指责他不服从国民革命大业。贵州省主席的位子落到了政学系的老人、蒋介石的长期幕僚张群手里。\n\n张群开始广泛的改革，并与昆明密切合作，但却未能阻止权力真空的出现。何应钦及其盟友还与当地士绅有所关联。而张群则决定延揽流亡的前政学系成员杨永泰，预期以此修复一些关系，不过大多数人还是在何氏倒台之后冥顽不灵。\n\n而更令人担忧的是第一军官兵的反应，他们大多都是黄埔军校的毕业生。这些人谴责地方政府变得自由化、“反革命”，旋即转投到年轻而魅力四射的陈诚麾下，而陈诚也在加大号召反腐、土改与其他民粹主义承诺。黄埔军官向来以搞小团体、搬弄主义著称，使得这种左倾潮流更加难以制止。"
 YUN.midgame.502.a: "陈诚和黄埔系对此事大为光火！"
 YUN.midgame.502.b: "张群和杨永泰以改革维系团结。"
 YUN.midgame.503.t: "西南左派"
 YUN.midgame.503.d: "尽管西南也是历史上一个相对保守的地区，但革命民族主义和左派同情者并不少见。辛亥革命期间，革命派就曾在同盟会中占有一席之地，甚至还与改良派之间争夺影响力。王复生及其他在北京师从李大钊的云南学生建立了一个地下工团主义社团，名为新滇社，誓要把革命带回自己的家乡。\n\n而长征后国民党的到来又为当地带来了另一股左派思潮。王复生力图在法政学校建立一个秘密社会主义圈子，出版《民国日报》，但旋即便被制止了。云南革新社（即新滇社原名）打破了工团党本流更注重城市工作的路线，他们潜伏在农村，希望能够组织起农民、当地少数民族和土匪来对抗唐继尧的统治。\n\n然而，更有实力的竞争者却得到了军方的支持。作为邓演达和蒋介石的门生，陈诚代表着黄埔军校早期的革命左翼民族主义者，他们的派系名为“土木系”，已经统合了贵州的黄埔各派。\n\n朱德则是另一颗冉冉升起的新星。他是朱培德的好友，与范石生、金汉鼎也有所联系，在滇军之中大名鼎鼎。从他与临委会（闽赣根据地中的主要政治力量之一）要员章伯钧的通信中可以看出，朱德的圈子可谓是云南省内左派思想的翘楚。"
 YUN.midgame.503.a: "王复生和新滇社会打倒土豪劣绅！"
 YUN.midgame.503.b: "陈诚和土木系会为了贵州而战斗！"
 YUN.midgame.503.c: "朱德和第三军会为了昆明而斗争！"
 YUN.midgame.504.t: "党与土司"
 YUN.midgame.504.d: "国民党与少数民族的关系相当复杂，从汉族主导的辛亥革命时期对中华民族主义的复杂态度可见一斑。国民党声称不分各族，代表一切中国人，但却又常常招致汉人至上的指责。他们的民族主义和社会达尔文思想经常和平等理想两相冲突，而实践中，在与军阀、士绅、社会主义者及少数民族层层叠叠的地方联盟网络打交道时，情况则更为复杂。\n\n滇黔两省都是少数民族的聚居地，其中居住着彝族、白族、布依族、侗族、土家族、苗族、哈尼族、壮族、傣族等。少民在地缘政治中扮演着相当复杂的角色，清代朝廷试图拉拢这些民族的领袖，并将这些部族首领划为土司（或称土官），分武职与文职，并对其后代开展教育，以培育忠心的臣民。在与英国及缅甸的边境冲突中，这些土司发挥了作用，即使大清的治权减退后，各省总督巡抚仍然维持这些土司存续运作，并要求其进贡，代表了中国对这些争议领土的主权。云南的苗商也对反租界商业斗争有所贡献。\n\n云南的少数民族也在辛亥革命中起到了重要作用。张文光就曾发表过一份共和、民粹的宣言，并一举用一支由少民和回民组成的军队攻克了大理。他的重要副手之一、少民领袖刀安仁便是在试图与孙中山取得联系的流亡途中牺牲。\n\n随着国民党在这一地区的胜利，许多人开始关注他们将如何对待当地的少数民族——这个问题相当敏感，因为该地区有近1/3人口并非汉人。土司的作用也存在争议，一些人认为他们是对抗当地士绅的重要实权群体；而另一部分人则认为土司和他们所对抗的士绅一样，都是落后的反动派。"
 YUN.midgame.504.a: "让大家知道，国民党要把民权带给每个中国人！"
 YUN.midgame.504.b: "国民党是一支进步和团结的力量，要对土司改造教育！"
 YUN.midgame.505.t: "云南的两种观点"
 YUN.midgame.505.d: "辛亥革命前，面对洋租界的侵蚀，主导云南的政治观点有两种：一是当地士绅所普遍持有的改良民族主义，即用自身经济发展和适度与洋商合作，以消除外贸中的不公允行径；二是商行与少数民族所持有的革命民族主义，寻求更加自由的国内市场和洋人垄断铁路的民族化。\n\n改良派和革命派的分歧在辛亥革命之后仍然存续，蔡锷便站在了改良派一边，并在本省政治对抗同盟会的激进影响中发挥了决定性作用。同盟会以及日后国民党煽动的叛乱都被旋即严酷镇压，像是顾品珍、李根源、朱培德、范石生和金汉鼎这些将军在“解放”家乡的工作中都收效甚微。\n\n朱培德、李根源与张群上台后，他们发现现状虽已截然不同，但仍面临着与云南士绅、保守将军胡若愚所支持的改良派作斗争的境地。然而与此同时，激进主义也在党内盛行，如朱德与陈诚等人正寻求激烈地改造西南。这类激进分子通常直言不讳，很难不引人注目。\n\n变革的步伐一直是一种微妙的平衡，绝非易事。归根到底，这需要各类哲学兼而用之，但所有人都同意，变革不但事关重大，而且迫在眉睫。"
 YUN.midgame.505.a: "采取更为改良的观点，确保平稳变革。"
 YUN.midgame.505.b: "保持激进的观点，这才能带来真正的改变。"
 YUN.midgame.506.t: "张群治黔"
 YUN.midgame.506.d: "尽管出师不利，但张群在贵州的统治还是取得了一些进展，可更进一步之时，却遭到了当地左倾思想的阻碍，毕竟许多本地工农都心向第一军的土木系。在杨永泰的建议下，张群很快意识到，对付陈诚日益膨胀的影响力，军事手段是低效的。\n\n为巩固政权，或者如表面上说的，为了维护[ROOT.OVERLORD.Capital.GetCapitalVictoryPointName]的利益，张群开始重新引入保甲民团制度、建立户籍制度、训练地方民团（并交由配合工作的士绅指挥）、修筑防御工事并搜捕赤色分子，并开始“扫荡”转移到农村试图掀起叛乱的第一军分子。由于大量难民从四川遁逃到了邻省贵州，张群的军队也一直在提供救助、减免税收，并试图恢复收支平衡。\n\n陈诚拒绝了一些下属的激进路线，转而效忠贵州政府，蛰伏以待时机。他也因此逐渐成为能与张群平起平坐的人物，甚至许多军队都愿意听从陈诚的指挥部而非贵阳行营的指挥。陈诚认为，解决中国农村动乱的问题是七分政治、三分军事，并提倡反腐、土改和政治改革，以剿匪安民。同时，他也在省主席张群的勉强首肯下建立了省粮政局和民众训练委员会。虽然张群和陈诚的部分目标不谋而合，但在陈诚占上风的地区，左派和亲近工农的思潮则更为强烈。"
 YUN.midgame.506.a: "张群和政学系的稳妥手段会带来繁荣。"
 YUN.midgame.506.b: "陈诚和土木系扶助工农的做法燃起了希望。"
 YUN.midgame.507.t: "朱培德与云南省议会"
 YUN.midgame.507.d: "云南省议会控制在当地精英手中，包括士绅、商人与知识分子。事实证明，省议会是一股保守的自由派力量，坚持责任政府，但抵制国民党所倡导的革命性变革。而这种现象也非云南独有，许多省份都在清朝末年皇权衰落后建立了各自的省议会。\n\n在辛亥革命期间，蔡锷连同他的军政统治自然忽略了省议会，而唐继尧也如出一辙，只不过是在建立所谓民主联省时对省议会做了些退让。尽管唐继尧已经倒台，但他的许多追随者仍然在省议会中，形成了自由派与保守派共处一室的局面，并与新涌入的国民党议员分庭抗礼。\n\n这也表现为朱培德、李根源与省议会同样复杂的过去。二人都愿意与这一机构展开合作——李根源最初也和蔡锷一样，在思想上偏向军政，但随着革命的进展，他也偏向了文官政治。他总结这种做法，称“官绅若不齐心协力，则难免患难。”\n\n朱培德也愿意接受文官监督，不过他在军旅生涯中很长时间都是局外人——在革命早期就流亡到了广州。这使得他在云南的精英圈子中少有朋友，而他圈子里的许多左派乃至于某些右派都建议他在议会中多安排一些“民众”代表，切勿讨好建制派。这样可以让议会式微，巩固党治，并有效抹除唐继尧十余年统治以来取得微小成果。"
 YUN.midgame.507.a: "省议会在本省未来当有一席之地。"
 YUN.midgame.507.b: "本党才能真正代表民众之意志。"
 YUN.midgame.508.t: "八寨起义"
 YUN.midgame.508.d: "昆明方面的官绅矛盾并非罕见，在历任政府中均屡见不鲜，这反映了当地国民党统治难以持续的艰难现实。地主精英控制着民团乡勇，对政府的指挥多有不从。\n\n其中一场冲突便爆发在八寨村，这反映了云南的复杂政局。在当地民团队长拒绝从命、擅自征税后，马关区政府试图没收当地部族的武装。此举引发了一场起义，工团主义新滇社的煽动分子也在煽风点火，让其势头更甚。\n\n令许多人震惊的是，连当地的地主都支持八寨起义，并派自己的乡勇家丁来援助乱匪，逼官军就范。但少数民族部族、社会主义者与士绅的联盟自然不会长久，左派和反动派旋即争夺起了这场运动的控制权，让官军得以在其停滞之时派出援军。\n\n在官军突然发难之际，激进派指挥官提议破釜沉舟，在士绅倒戈让他们独自承担败局之前扭转形势。而士绅手下的民团指挥官们则提议与官军谈判，希望以尽可能少流血的方式结束冲突。"
 YUN.midgame.508.a: "破釜沉舟，社会主义武装求出路！"
 YUN.midgame.508.b: "叛军决心谈判，为日后保存实力。"
 YUN.midgame.509.t: "贵州的两颗新星"
 YUN.midgame.509.d: "张群为了在贵州控制住第一军，提拔不少政治关联较少的年轻将领兼任军政要职。熊式辉就是这批少壮派中最耀眼的一位，他长期任贵州政务委员会会计长，在张群的圈子中声名显赫。\n\n尽管熊式辉出身行伍（或者不如说正因他参过军），但他的工作中心却放在了公共工程、精简税制和剿匪之上。担任贵阳行营办公厅主任期间，因主持修建公园、桥梁、招待所、道路，并废除苛捐杂税一百余种而广受赞誉。\n\n这自然也能让人联想到土木系的改革措施。说到土木系，他们也有一批后起之秀。朱怀冰是一位军人，也是陈诚的同学，还与云南有所关联。为了让土木系赢得维稳的名声，他选择右转并起草了《贵州各县政治战斗方案》和《建设新贵州计划》，组织移民并村、训练壮丁。尽管他曾谦逊地标榜“做大事不做大官”，但他也因提出“一家通匪，五户问罪”这样严酷的口号而遭非议。\n\n熊式辉、朱怀冰二人都试图接管贵州省工商委员会和新近成立的贵州实业公司。这家国营公司将接收国民党刚到贵州时所国有化的五十余家企业与矿场，先前的党内干部一向管理不善。董事会最终人选将在未来几周选举、任命完毕，而两人都承诺将会为振兴贵州经济注入新鲜血液。"
 YUN.midgame.509.a: "熊式辉和他那帮受过西式教育的技术官僚可以胜任。"
 YUN.midgame.509.b: "朱怀冰的干部们会将一生都献给实业振兴。"
 YUN.midgame.520.t: "社会主义运动家抵达昆明"
 YUN.midgame.520.d: "随着云南倒向[CHI.Capital.GetCapitalVictoryPointName]，左派的中央委员会也在西南国民党找到了盟友，当然他们也对这些人并不一定信任。云南的朱培德和贵州的何应钦就是知名右派，不过众所周知朱培德也并不反对与左派顾问为伍，而何应钦则曾是蒋介石的副手，在黄埔军官中不算人见人爱，但也是人尽皆知。\n\n有鉴于此，为了帮助昆明与贵阳回到革命正统，中央执行委员会决定向西南派出一个“顾问”代表团。这一代表团由大名鼎鼎的临委会领袖之一章伯钧率领，而章伯钧曾在1922年与朱德将军乘同一条船旅欧，成了这位第三军后辈的朋友与室友。\n\n而在贵州，周至柔将军与他的拜把兄弟陈诚、罗卓英再度聚首。周将军和陈诚一样是保定军校毕业生，也是黄埔军校的教导员，在流亡期间曾在欧洲学习军事航空，并成为了这一领域的顶尖专家。周至柔也是著名的黄埔革命同学会成员，故而与邓演达将军有所联系。与周至柔一道前来的则是严立三，他也是黄埔教导员、邓演达的密友，同样被许以贵州民政部门要职。\n\n汪精卫和改组会在西南也并非无亲无故，周恩来同样是朱德的好友。周恩来相信，朱德在情况紧急之时会站在党内文官政府而非黄埔革命同学会的盲动分子一边。而在贵州，改组会著名的两位组织者谷正纲、谷正鼎虽与哥哥谷正伦有些疏远，但无论政治立场如何，亲情总还是能超越主义分歧的。\n\n无论如何，以上所有人的目的都只有一个：防止云南落回土豪士绅之手，并确保其持续忠于社会主义当权者。"
 YUN.midgame.520.a: "章伯钧、周至柔和严立三会指明左翼运动的方向。"
 YUN.midgame.520.b: "周恩来同志与谷氏兄弟一定会有出色表现。"
 YUN.midgame.520.c: "我们也一起去西南！（切换至云南）"
 YUN.midgame.520.e: "社会主义要掌握在我们自己手中！"
 YUN.midgame.531.t: "来自[FROM.Capital.GetCapitalVictoryPointName]的乡村建设援助"
 YUN.midgame.531.d: "陈诚将军呼吁进行广泛的农村土改，包括耕者有其田、限制地租和精简捐税，这看上去是国民党左派更为激进方案的温和版本，不过这也是提案能在更为保守的贵州获得通过的必要条件。\n\n国家建设委员会表示愿意资助这些工作，并批下了几笔重大拨款，还向贵州农村派出了技术官僚。此举无疑是陈诚的重大政治胜利，而农村也会更加倒向土木系。\n\n虽然贵州大步前进的经济前景令人神往，但张群省主席圈子里的顾问却建议我们将省政府无法直接控制的项目迁延实行，或者另寻他法阻挠。否则，这农村不成了赤色分子的天下了。"
 YUN.midgame.531.a: "这一援助对于贵州的建设至关重要。"
 YUN.midgame.531.b: "此乃赤党之糖衣炮弹也。"
 YUN.midgame.532.t: "[FROM.Capital.GetCapitalVictoryPointName]为土木系送来武装"
 YUN.midgame.532.d: "陈诚先前被任命为从贵州的原第一军分割出来的第十八军的军长，加之他曾经直接领导的第十师，因此他这一派人也被称为“土木系”（“十一”合之为“土”、“十八”合之为“木”），代表着蒋介石黄埔系的左翼倾向。虽然陈诚也许并非真正的社会主义者，但他与邓演达及临委会的关系，使他成为贵州最引人注目的左翼人士。\n\n军事委员会下令向第十八军，尤其是第十师送来大量武器装备，这将会让陈诚将军大大加强党的控制，同时还足以补充老部队并组建新部队。张群省主席一派的贵州保安部队感到被冷落，因而颇为不满。\n\n夺取这批武器装备可能会导致流血事件，甚至会让党的大业受损，但不这么做无疑会损害张群省主席对贵州的控制。"
 YUN.midgame.532.a: "我觉得，贵州再多一两个保安师足以确保其安全无虞。"
 YUN.midgame.532.b: "既然他是社会主义者，那想必乐意与我们共享一些资源。"
 YUN.midgame.533.t: "[FROM.Capital.GetCapitalVictoryPointName]扶持第三军左派"
 YUN.midgame.533.d: "朱德将军大概是第三军中最引人瞩目的左派，他极具战略头脑、与朱培德、范石生和金汉鼎这样的地方革命将领关系匪浅。在个人政治立场往往高于意识形态的西南，他被中央委员会看作一笔宝贵的财富。\n\n军事委员会提出资助昆明兵工厂和云南陆军讲武学校，这无疑是有利于云南军务的。作为交换，朱德将军一派可以得到这一批项目的大部分监管权，这可能会赤化我们骄傲的滇军。\n\n而另一方面，拒绝这种提案会削弱我省的防务，在军队中也会引起怨言。朱培德省主席承诺，他会管好自己的门生。"
 YUN.midgame.533.a: "这一提议从长期看，加强了我们对抗帝国主义的力量。"
 YUN.midgame.533.b: "云南的边界从不需要外地人来保卫。"
 YUN.midgame.534.t: "[FROM.Capital.GetCapitalVictoryPointName]授权章伯钧"
 YUN.midgame.534.d: "章伯钧是党内的一位社会主义干部，一直在云南担任“顾问”和西南地区实际上的全权党代表。章伯钧善于交际、成果斐然，他受过良好教育、魅力超群，能够融入当地的知识分子圈子。而现在章伯钧声称，许多云南的学生和教授都对最近的政局发展感到失望，只要中央委员会愿意慷慨地给他发放津贴，他就能让他们改变立场。\n\n看来章伯钧终于收到了他请求的津贴，并充分地利用了这笔钱。他为国民党动员知识分子阶层的能力有助于政府的顺利运转，但人们对云南国民党左倾的怀疑也与日俱增。"
 YUN.midgame.534.a: "章伯钧在平衡社会主义与好政府方面做得不错。"
 YUN.midgame.534.b: "他的支持者要是有什么“三长两短”，那就太可惜了。"
 YUN.midgame.535.t: "[FROM.Capital.GetCapitalVictoryPointName]承认新滇社"
 YUN.midgame.535.d: "中国工团党云南特别局是一个由曾在黄埔军校接受过军政训练的，后转向革命的学生结成的秘密组织。他们的领头人是王德三、王复生兄弟，这二人也通过更广泛的新滇社（工团党内云南籍工团主义者组成的社团）在渗透该省的工作中取得了一定成果。中央政府对这一社团的承认令他们得以走出地下，并肆无忌惮地妖言惑众。\n\n这一政治局势发展的长期影响犹未可知。预计新滇社得到认可后会扩大队伍，但也并非云南的一切工团主义者都相信工团党能在未来控制当地。相反，许多人选择投靠章伯钧和朱德，希望工团主义得以在更广泛的国民党左派的庇护下，在昆明生根发芽。\n\n云南政府的镇压能力有限，同时这也会引发中央政府的愤怒。一些人建议可以用一些更亲近工农的政策来收编左派力量，而这样做虽然有望打击新滇社，却会令本省的左派进一步合法化。"
 YUN.midgame.535.a: "新滇社的队伍大大扩充。"
 YUN.midgame.535.b: "第三军左派因这场运动而受益。"
 YUN.midgame.535.c: "土木系趁势而动。"
 YUN.midgame.580.t.he_yingqin: "福将不败！"
 YUN.midgame.580.t.chen_cheng: "小委员长"
 YUN.midgame.580.t.teng_jie: "领袖诞生？"
 YUN.midgame.580.t.li_genyuan: "政学系斗士"
 YUN.midgame.580.t.wang_boling: "从居士到战士"
 YUN.midgame.580.t.zhu_peide: "第三军的胜者"
 YUN.midgame.580.t.zhu_de: "朱老总"
 YUN.midgame.580.d.he_yingqin: "何应钦对战争和政治并不陌生，他最早在陈其美领导下参与辛亥革命，之后与王文华一起为贵州而战，后来又成为了蒋介石的副手。尽管一直以来他更像是一个追随者而非领导者，而且他也不怎么参与政治，但不断变化的时局还是让他受到了万众瞩目。虽然何应钦并非最精明的政治家或最有魅力的领导人，但委员长不畏风雨，岿然不动。何委员长能将其最近在战场上取得的胜利转化为巨大的政治效应，并因其在激烈的战斗中毫发无损而被人们称为“福将”。"
 YUN.midgame.580.d.chen_cheng: "陈诚近来在战场上连战连捷，在中国舞台上的地位也如日中天。作为蒋介石和邓演达的门生，陈诚既继承了蒋介石那受儒家思想启发的清苦生活方式，又继承了邓演达的左翼民粹主义政纲。陈诚的公众形象严于律己、以身作则、生活简朴，坚持每餐不超过四菜。在其辖区内，陈诚禁止吸烟、饮酒和跳舞等轻浮行为，其部队也以忠于革命为荣。此外他也有不那么严肃的一面，以礼貌体贴，待人温和而闻名。"
 YUN.midgame.580.d.teng_jie: "滕杰是神龙见首不见尾的蓝衣社的领袖，随着滕杰将军及其士兵近来在战场上表现得愈发狂热，蓝衣社受到了更严格的审查。滕杰过去主要从事政治工作，因此他被任命为战场指挥官一事颇让人感到意外，但他很快便以敏锐的头脑带领部队取得胜利，打消了人们对他的疑虑。在世界各地的国家民粹主义运动的鼓舞下，滕杰的部队开始信奉极端主义，并不断违抗党内文职部门的命令。尽管此事令人担忧，但他们的效率也毋庸置疑。至于他们未来是否会惹出其他麻烦，那就是另一个问题了。"
 YUN.midgame.580.d.li_genyuan: "李根源是一位经验丰富的军人，他曾组织那些流亡日本的革命者为辛亥革命做准备。他的出道之战是重九起义，这巩固了他坚定的共和革命者的声誉。随着李根源最近在国民革命军服役期间不断取得成就，他受到了越来越多媒体的关注，并将政学系及其倡导的宪政思想推到了风口浪尖。在这支高度政治化的军队中，他那温和主义的立场打破了常规，而他的成功证明了不是只有狂热的极端主义才能拯救国家。"
 YUN.midgame.580.d.wang_boling: "王柏龄是一位杰出的革命家，也是黄埔军校的创始人之一，但北伐战争结束后不久，他就遁入空门，皈依印光大师，并取法名“慧常”，大多数人认为他的政治生涯已经结束了。但和其他国民党成员一样，随着国民革命在1936年迎来了第二次风潮，王柏龄也被召回。他不负众望，取得数次大胜，为他的CC系盟友赢得了荣誉。除了军事工作之外，他还因倡导佛教事业、亲近太虚大师以及重建鸡足山道场而闻名。"
 YUN.midgame.580.d.zhu_peide: "朱培德也许是滇军中最杰出的军官，他为国民革命奋战数十载，以勤奋、谦逊和诚实而闻名，第三军一直是国民党中的一支重要力量，而朱将军最近在战场上取得的胜利使其力量进一步增强。朱培德的派系以提倡建设国防和生活简朴而闻名，认可对三民主义的温和解读，立场更接近党内的“旧右派”。随着朱培德在国家舞台上站到了显赫地位，那些对党内激进派系持怀疑态度的人松了一口气。"
 YUN.midgame.580.d.zhu_de: "朱德的一生充满传奇色彩，他出身贫寒，之后在多支部队中当过兵。而在成为一名革命者后，他的生活大变样了：他戒掉了鸦片瘾，并在欧洲学习了更多社会主义和军事理论。从欧洲回国之后，他已脱胎换骨，并深度参与第三军改组的过程，使其成为一支为人民而战的强大革命力量。近来“朱老总”已经证明了自己的价值，他在艰苦的战斗中战胜了敌人，赢得了云南许多左派人士的钦佩。凭借人民的支持和自己的创新策略，他发誓要解放整个国家！"
 YUN.midgame.580.a: "他是黄埔军人的典范！"
 YUN.midgame.580.b: "土木系将创造更美好的未来。"
 YUN.midgame.580.c: "恐怖之人，惊人之举。"
 YUN.midgame.580.d: "辛亥革命的战士。"
 YUN.midgame.580.e: "愿他有一日能重拾经书。"
 YUN.midgame.580.f: "模范军队中的模范士兵。"
 YUN.midgame.580.g: "新军队之父！"
 YUN.midgame.581.t: "克复湖南"
 YUN.midgame.581.d: "我们牢牢控制住了长沙，如今必须任命一位忠诚的省主席，结束军事占领。为此，我们挑选出了几位可用的候选人：\n\n第一位是文官派的候选人覃振，作为西山派的一员，他自然得到了莫斯科委员会的支持。他是革命里的老资历，自然适合担任省主席，也能够体现国民党建立文官政府的承诺。但显而易见，他与莫斯科委员会过从甚密，难保未来不会与我们对立。\n\n第二位候选人则是第六军的程潜，他有着弥合各方裂隙的能力。程潜其人同情莫斯科委员会，也在黄埔军校做过教导员，使得他可以成为沟通莫斯科派与何应钦的黄埔系之间的不二人选。然而，程潜却有着臭名昭著的湖南地方主义情结，他离开贵州后竟然没有进军昆明，而是回到了湖南。\n\n第三位则是谭延闿。虽然他曾经指挥过第二军，但也从来都是一位文官，且曾经三起三落主政湖南，在该省名望甚高。谭延闿残部归程潜领导后，他便离开贵州军政府来到了湖南。话虽如此，他还是和我们的军队保持着联系，尤其是他还可以通过女婿陈诚的关系来争取省主席之位。\n\n还有第四位候选人，左派唐生智的老部下何键，虽然他名望不及前三位，但也跻身考虑范围之列。他是个坚定的反社会主义者，试图通过黄埔的联系来当上省主席。何键其人未经考验，因而也颇有争议，不过让他做省主席无疑对何应钦是好事一桩。"
 YUN.midgame.581.a: "覃振，带好你的文官们。"
 YUN.midgame.581.b: "程潜是个中庸的好选择。"
 YUN.midgame.581.c: "谭延闿名望甚高，选他。"
 YUN.midgame.581.e: "安排何键这匹黑马上任。"
 YUN.midgame.582.t: "北方的国民党"
 YUN.midgame.582.d: "国民革命军渡过黄河后，国民党在北伐战争中获胜的可能性与日俱增。国民党最终将推翻北洋政府，实现自己的民国愿景，这一传闻在全国范围内引发了广泛讨论，尤其是关于接下来会发生什么。\n\n虽然国民党自诩代表全国，实则本质上是以南方为基础的政党。孙中山、胡汉民、汪精卫皆出身广东，国民党政府长期亦以广州为据点。蒋介石和戴季陶来自浙江，还有一小部分党员来自东南地区。国民党的许多基层党员都来自更广阔的南方地区，而北方党支部的核心领导层却长期缺乏合适候选人。\n\n在党内，丁惟汾和于右任是北方国民党的领军人物，因此获得了中执委的席位。丁惟汾虽以沉默寡言著称，但他的一言一行皆有千钧之重，他曾是“大同盟”、“兴中学会”、“实践社”等秘密社团的领导人，活跃于山东和湖北等地的国民党掩护组织。于右任虽然年事已高，但这位体格魁梧、言辞铿锵的政治家，以乐观坦率的性格彰显着“北方风骨”。\n\n尽管丁惟汾和于右任二位同志不辞辛劳，但党内仍然缺乏值得信赖的北方干部。然而，正如张群和杨永泰所指出的，愿意效忠国民党之人并不在少数。凭借与北洋人士的关系，张群和杨永泰可以确保许多像黄郛这样的温和共和派倒戈加入，最终实现国家统一。这番主张激怒了强硬派，他们谴责张群和杨永泰是腐败的叛徒，削弱了党的力量，并呼吁将久经考验的忠诚党员派往北方，以援助和“培养”新一代党员。"
 YUN.midgame.582.a: "我们就依靠北方同志的关系来筛选候选人吧。"
 YUN.midgame.582.b: "唯一的出路就是团结我们的北洋同仁。"
 YUN.midgame.582.c: "还是依靠那些我们可以相信的人……"
 YUN.midgame.700.t: "昆明政变"
 YUN.midgame.700.d: "大多数军官，包括许多旧政权的支持者，都意识到云南在这场战争中大势已去，龙云和胡若愚乘机发动政变，以不利但可接受的方式结束了战事。胡若愚麾下的滇军在前线叛变，逮捕了效忠于唐继尧的高级军官。龙云则在警察和驻军同情者的帮助下夺取了昆明。不久之后，随着滇军将领纷纷加入密谋者，云南其他地区也相继易主。\n\n虽然唐继尧被推翻之后名义上仍是督理，在外人看来领导层没有任何变化。然而，政变后唐继尧便一直没有公开露面，而且他遭到囚禁且被断绝对外联络的事实已是人尽皆知——这是龙云和胡若愚在1927年政变中学到的惨痛教训。与此同时，龙云和胡若愚正为权力分配展开激烈角逐。\n\n第二次滇桂战争的惨败标志着云南干涉主义的最终落幕，云南当局正转向闭关自守。当溃不成军的滇军狼狈撤回时，云南各界均怒不可遏——一些人指责领导人派他们参加又一场注定失败的战役，另一些人控诉自己遭遇背后捅刀。在昆明，无论是战争的支持者还是反对者，类似的愤怒和激进情绪都在高涨，这场危机必须尽快得到解决。但随着这个曾经好战的省份重新陷入孤立，云南以外的领导人终于松了一口气。"
 YUN.midgame.700.a: "一场耻辱性的大败。"
 YUN.midgame.701.t: "滇军将领在昆明发动政变"
 YUN.midgame.701.d: "尽管滇黔军队气势汹汹，且拥有引以为傲的军事传统，但在第二次滇桂战争中，他们最终未能取得任何实质性进展。由于攻势停滞、屡屡受挫，人们普遍担心对手会入侵云南本土，这促使滇军将领推翻了自己的政府，并签署了停战协议。\n\n云南领导层正处于混乱之中，官方文件仍由外界认可的督理唐继尧签署，但他已有一段时间没有公开露面了。昆明还传出了有关龙云和胡若愚的消息，据说他们正在争夺最高权力。无论如何，这很可能标志着云南军事冒险的终结，这个多山省份正转向孤立。"
 YUN.midgame.701.a: "云南巨龙就此沉睡。"
 YUN.midgame.702.t: "不稳定的休战"
 YUN.midgame.702.d: "政变后的云南政局混乱不安，分化成了不同的阵营。在两位崛起的强人中，龙云总体上代表现状——他拉拢唐继尧旧部，宣扬维持秩序与稳定。龙云希望利用自己广泛的军方关系与其前任导师的政治恩庇网络，掌控全省并确保权力平稳过渡。\n\n另一方面，胡若愚则采取了反动立场，希望彻底改组政府，铲除唐继尧政权的“腐败”。胡若愚虽然偶尔会迎合社会主义和民族主义情绪，但最终还是决定组建士绅-商人联盟，推动非军事化并与中央政府谈判。为了达到目的，他不惜利用土匪武装、寻求外国援助，甚至联络前国民党活动人士。\n\n由于龙云和胡若愚都无法绝对掌控士绅、商人和其他省内精英，而这些人的支持又对他们最终夺权至关重要，因此两人都在通过不同政治主张极力争取精英支持，但这些精英的立场却始终摇摆不定。虽然拥有一支更强大的军队至关重要，但精英阶层的政治背书同样不可或缺。\n\n卢汉则是当下的一匹黑马，他是龙云麾下军官之一，也是龙云的亲戚——不过两人的具体关系尚不清楚。卢汉娶了龙云胞妹，但早在婚前他便与龙云关系密切，有传言称他们是同父异母的兄弟或有某种亲缘关系。卢汉借助龙云的势力崛起，据说正密谋通过民粹主义手段攫取权力。但眼下云南权力博弈的核心，仍是龙云与胡若愚两派势力的最终对决。"
 YUN.midgame.702.a: "龙云代表着向孤立的有序过渡。"
 YUN.midgame.702.b: "胡若愚主张和平与民族团结！"
 YUN.midgame.703.t: "唐继尧之死"
 YUN.midgame.703.d: "唐继尧在家中去世，结束了数周以来关于他命运的猜测。龙云和胡若愚两派之间的谈判一度紧张，龙云倾向于将唐继尧囚禁起来，以防其出省重组军队，同时对外维持政局稳定形象；胡若愚则寻求将唐继尧流放或处决。唐继尧的追随者担心他日益恶化的健康状况和人身安全，请求允许唐继尧安全离开云南。\n\n唐继尧的死因官方说法是病逝，但其支持者普遍认为是被毒杀。无论真相如何，密谋者之间脆弱的休战协议已被打破。胡若愚先发制人，包围了龙云的住所，并解除了他的护卫武装，龙云眼部受伤被擒。事情本应就此结束，但龙云麾下的将领大多逃脱，并在昭通集结军队。龙云的亲戚卢汉率部发动反攻，粉碎了张汝骥夺取昭通的企图。龙云的军队占据了优势，围城之势迫在眉睫，但胡若愚并未放弃，毕竟龙云仍然身陷囹圄。\n\n与此同时，王洁修背叛了胡若愚及其蒙自派，并和众多唐继尧效忠者聚集在大理，试图帮助唐继虞东山再起。省内第三势力的出现以及全面内战的前景，迫使龙云和胡若愚两派坐上了谈判桌。"
 YUN.midgame.703.a: "龙云的军队帮助他获得了释放的有利条件。"
 YUN.midgame.703.b: "胡若愚对铁路的控制使他拥有更多谈判筹码。"
 YUN.midgame.704.t: "唐继虞叛乱"
 YUN.midgame.704.d: "龙云现已获释，龙云与胡若愚两派之间的冲突暂时告一段落，但唐继虞仍是一个令人担忧的问题。唐继虞曾短暂流亡在外，后获准返回云南参加兄长的葬礼。1927年政变起初明确针对的是唐继尧的十位亲信，包括昆明市长张维汉、外交司长兼财政厅长徐之琛、云南锡业公司经理吴琨，以及唐继虞、陈维庚等多名高级将领，这次政变肯定没什么不同。\n\n意识到事态严峻后，唐继尧残部聚集在孙渡的大理要塞，拥立唐继尧胞弟唐继虞为主帅。唐继虞意图夺回兄长唐继尧的旧位，因此迅速率部进军昆明，希望获得士绅的支持，并团结唐继尧在昆明各地的亲信。有传言称，他们的阴谋甚至得到了龙云麾下主要将领卢汉的同情——如果属实，这将是一次巨大的背叛。\n\n然而，唐继虞的尝试基本上徒劳无功，他麾下的王洁修、吴学显等部多为土匪收编而成，刚一交战便溃不成军。唐继尧的卫队要么试图投奔龙云或胡若愚，要么孤立无援束手待擒。几周之内，唐继尧残部就被迫投降或转入地下。\n\n虽然龙云决定吸纳唐继尧的重要文官，但唐继尧麾下将领的命运却另当别论。讽刺的是，胡若愚的态度与龙云恰恰相反。胡若愚急于招揽像孟有文这样的将领以压制龙云，而龙云却下令处决或流放与他敌对的将领。"
 YUN.midgame.704.a: "杀鸡儆猴！"
 YUN.midgame.704.b: "流放唐继虞，收编其他人。"
 YUN.midgame.705.t: "民主之梦的消逝"
 YUN.midgame.705.d: "唐继尧和章太炎于二十年代末在云南培育的新兴民主运动，随着唐继尧的倒台而遭受重创。唐继尧固然是一位独裁者，但他的两位继任者对民主理想的承诺更是寥寥无几，胡若愚与龙云更倾向于与省议会中那些有名望的人物进行幕后交易，而非追求更广泛的代表性或改革。\n\n胡若愚政变后的内战尽管短暂，却进一步凸显了云南知识分子的无能为力，他们只能眼睁睁地看着两位强人兵戎相见。年迈的章太炎已基本隐退，唐继尧的民治党也几乎销声匿迹，成为了史书上的一个名词。唐继尧之子唐筱蓂被推举为父亲的继任者，出任民治党主席，但唐筱蓂在龙云手下担任闲职期间，却将精力主要放在中国青年党的青年活动上。\n\n对于剩下的民主人士来说，他们的选择十分有限。一些人回归了军阀鼎盛时期知识分子传统的高傲冷漠态度，离开云南到富裕省份从事更有声望的学术工作，或是将自己的活动限制在云南省内。龙云和卢汉曾向新月社等团体发出过有限的合作邀请，其他仍然渴望政治变革和直接行动之人则转向社会主义，将农村学校和文学俱乐部转化为激进主义的地下网络。"
 YUN.midgame.705.a: "梦想并未消亡，只是需要调整。"
 YUN.midgame.705.b: "我们必须觉醒，空谈无济于事。"
 YUN.midgame.730.t: "龙云派"
 YUN.midgame.730.d: "龙云彝名纳吉岬岬，这位汉彝混血的土司首领之孙，自取汉名“龙云”（取意龙腾云霄），其日益膨胀的政治抱负已暗藏于姓名之中。龙云曾是同盟会革命者，并在唐继尧麾下担任指挥官，如今又以维护稳定为名夺取云南政权，但他的梦想远不止于此。\n\n如同前任唐继尧一样，龙云也喜欢在政府中安插亲信，连襟蒋吟秋以及李培天和李培炎都是他的核心幕僚，其中李氏兄弟更是掌控着省内财政和官僚机构。龙云的其他亲信，例如安恩溥和张邦翰，则分别被任命为水利督办和建设厅长。\n\n龙云一贯热衷于在政府中安插彝族成员，以平衡汉族影响力。内敛寡言的陆崇仁与士绅阶层关系密切，在新政府中代表士绅阶层的声音。张冲将军也是彝族人，与匪帮有着密切联系，后来被任命为云南盐运使（盐税历来是重要财税来源，需武装护卫保障征收）。\n\n卢汉堪称新政权最大受益者，他是龙云的儿时好友兼同窗，也是龙云的亲戚，年轻时与龙云、邹若衡并称为“昭通三剑客”。卢汉也是彝族人，毕业于云南陆军讲武堂，后来成为龙云的首席军事副官之一。如今，卢汉被授予富滇银行理事长兼财政厅长之职，但龙云招纳唐继尧旧部叛将的决策让他愈发感到不安。"
 YUN.midgame.730.a: "龙云封赏亲朋好友以巩固自身控制。"
 YUN.midgame.730.b: "龙云留用唐继尧旧部以维护稳定。"
 YUN.midgame.731.t: "蒙自派"
 YUN.midgame.731.d: "野心勃勃、狡猾善变、诡计多端——胡若愚的绰号五花八门，但他在云南省的影响力毋庸置疑。作为割据滇南的军阀，所谓的“蒙自派”一直扼守着云南与印度支那的贸易路线，自三十年代起便一直通过印度支那获得德国援助。尽管胡若愚在意识形态上比较灵活，但由于他公开向吴佩孚示好，这使得蒙自派容易受到直系势力的影响。对于胡若愚来说，云南最近的政变让他获得了扩大影响力的新机会。\n\n蒙自派由一群渴望保住自身利益的军人和士绅组成。李选廷和张汝骥曾是唐继尧麾下的镇守使，因二十年代遭到排挤而怀恨在心。王维玉是一位蒙自商人，15岁时曾开过一个糕点小吃摊，后来与李聘合作开矿。随着规模扩张以及德国投资者的涌入，他们的矿场引起了土匪的注意，于是两人与矿工矿主共同组建了民团，并开始与蒙自派合作，以抵御盗匪的敲诈勒索。\n\n尽管过去曾有过冲突，但蒙自派也与一些残存的滇南土匪团伙结盟。李绍宗、莫朴、普文荣、唐松林——这些在二十年代唐继尧治下令人闻风丧胆的名字，现已和昔日的土匪猖獗时期一同成为过去，大多数土匪要么以某种方式被政府招安，要么沦为雇佣兵。王汝为是土匪中最有权势之人，他毕业于云南陆军讲武堂，自辛亥革命以来一直担任军官，并将马关地区据为己有。王汝为虽然势力强大却首鼠两端，龙云、张汝骥以及国民党都曾争相拉拢他——这模糊了士兵、土匪和政客之间的界限。"
 YUN.midgame.731.a: "云南反动势力纷纷团结在胡若愚身后。"
 YUN.midgame.731.b: "源源不断的锡矿贸易让胡若愚占据上风。"
 YUN.midgame.732.t: "贵州局势"
 YUN.midgame.732.d: "尽管在第二次粤桂战争中惨败，龙云仍然渴望维护云南对邻省贵州的影响力。自唐继尧介入贵州宪政预备会与自治学社之间的冲突后，滇黔这两个邻省的关系便愈发密切。唐继尧一直支持流亡的刘显世担任贵州省长，直至刘显世于1927年去世。而刘显世的家人则继续在云南活动，筹划着东山再起。\n\n虽然滇系近来屡遭挫折，但中央政府始终未能将其影响力拓展至西南地区，这促使龙云试图重新确立云南对贵州的统治。自粤桂战争以来，贵州一直由刘氏家族统治，包括刘显世的堂兄刘显潜和侄子刘公亮。刘氏家族谋求让贵州独立于昆明的无力挣扎，终因外部政府对滇黔事务的漠不关心而宣告失败。\n\n由于担心龙云会将势力扩张到昭通根据地之外，刘氏家族试图协助张汝骥和蒙自派以牵制龙云的统治。作为回应，龙云则挑拨刘氏家族内部的关系，并争取当地精英易荣黔的支持。虽然刘氏家族和易荣黔都不太可能真正摆脱昆明的势力范围，但随着双方使用云南提供的武器展开对抗，这场代理人战争已升级为具有更广泛区域影响的地方势力冲突。"
 YUN.midgame.732.a: "实力更强的刘氏家族击退了新挑战者。"
 YUN.midgame.732.b: "在龙云的帮助下，易荣黔打败了人数众多但内部分裂的刘氏家族。"
 YUN.midgame.733.t: "元老政客挑战龙云"
 YUN.midgame.733.d: "唐继尧或许已经逝去，但旧政权的残余依然存在。尽管龙云曾主动示好，但他巩固统治的努力却遭到了云南旧势力的抵制。省议会虽听命于督理，但却是权力的象征，以丁兆冠、王九龄和由云龙为首的一群元老正在阻碍龙云的议程。\n\n丁兆冠是一位留学日本的政治人物，曾在四川省财政厅任职，后返回云南担任云南政法专科学校校长。他也是一名法学家，曾在唐继尧治下出任司法部门的多个要职，之后又被龙云任命为政务厅厅长，但此后一直威胁要辞职。\n\n王九龄也在日本留学，曾参与辛亥革命，后成为唐继尧的秘书长。唐继尧后来任命他为财政厅长，并派他与北洋政府谈判。1924年，王九龄出任段祺瑞政府的教育总长，之后回到云南，先后担任云南盐运使和富滇银行总行长。王九龄也是东陆大学的名誉校长，并在云南省佛教会、汉学研究所和南雅诗社等多个社会团体中任职。\n\n由云龙是《云南日报》创始人，在护国战争中发挥了重要的组织作用，并在唐继尧出征期间代理省长一职。他也是一位实业家，曾任教育厅长、云南省第二届省议会议长，最近还当选为省参议院主席。\n\n尽管他们基本上被视为虽居高位却无实权的老古董，但胡若愚正不断寻找机会削弱龙云，因此迅速应对这些元老对于龙云的生存至关重要。"
 YUN.midgame.733.a: "龙云智取元老，巩固了自身地位。"
 YUN.midgame.733.b: "元老们压制了龙云，并削弱了他的控制。"
 YUN.midgame.734.t: "现代军人的角色"
 YUN.midgame.734.d: "在中国传统社会中，职业军官通常被显赫世家所轻视，社会顶层自然是那些只需终日沉溺于诗词歌赋与官僚政务的士大夫。当然，士大夫有时也需要率领部下征战沙场，但那只是暂时的牺牲。至于士卒兵勇，他们既无需学识涵养，也无需风雅修养；他们只需作为牺牲品，捍卫君主和长官，并保护华夏疆土免遭蛮夷侵袭。\n\n但在护国战争爆发后，知识分子对军事产生了一种奇特的热情。建立一支保卫宪政、捍卫共和的国家军队的理念，引起了许多人的强烈共鸣，尤其是在云南这样的省份；云南是第一个宣布独立并反抗北京专制统治的省份。护国战争期间，云南当局鼓励民众参军，并且经常实行征兵；在面对实力远超己方的军事力量时，这被视为必要之恶。然而，唐继尧重掌云南后，文官政府恢复了对军队和军阀的控制——唐继尧虽是军人出身，但他自诩为仁慈之主，而非一直依靠戒严令统治。\n\n如今，云南正进入历史上的又一个多事之秋，但问题依然存在：军队对人民的统治究竟应该持续多久？一方面，在危机关头，军队的领导作用无疑是必要的，但危机会逐渐消退，全省总动员尚未迫在眉睫。另一方面，军队的存在也对土匪和犯罪行为产生了强大的震慑作用——在当前艰难时期，这一点无疑备受重视。"
 YUN.midgame.734.a: "不到万不得已，谁舍得用好铁打钉子？"
 YUN.midgame.734.b: "危难关头，全仰仗将领们护佑周全。"
 YUN.midgame.735.t: "与龙云离心的表弟，卢汉"
 YUN.midgame.735.d: "卢汉自幼与龙云形影不离，曾一同在昭通学习武术。两人从云南陆军讲武堂毕业后，又在一起进入滇军服役。他们的关系曾经极为密切，甚至有传言称卢汉是龙云同父异母的弟弟。然而，卢汉最近却在私下里表达了对龙云政权方向的不满。卢汉与龙云决裂的原因有很多，但归根结底，龙云督理在省府和军队人事安排中过度偏袒唐继尧旧部才是根本原因。\n\n矛盾的焦点在于张维翰的新近任命。张维翰是唐继尧时期的政治人物，曾任省民政司司长和昆明市长。政变后，龙云让张维翰留任现职，而张维翰和卢汉却始终未能就任何事项达成一致。\n\n虽多数留在云南的唐继尧旧部都已归附龙云，但只要拿出足够的诚意，仍有些人可以被争取。孙渡毕业于云南陆军讲武堂，在唐继尧麾下任职多年，曾担任云南烟酒公卖总局局长。他始终忠于唐继尧，直至唐继尧逝世。孙渡以胆略过人著称，被誉为“儒将”和“小诸葛”。他向来仰慕雄才大略之主，而卢汉正具备这种领袖风范。在对抗龙云的行动中，孙渡可能成为卢汉潜在的盟友。"
 YUN.midgame.735.a: "龙云竭尽全力安抚误入歧途的表弟。"
 YUN.midgame.735.b: "卢汉开始从内部破坏龙云派系。"
 YUN.midgame.736.t: "忠诚与能力"
 YUN.midgame.736.d: "长期以来，云南当局一直在努力避免破产。由于耗资巨大的军事冒险、长期管理不善且过度雄心勃勃的项目、对鸦片贸易的过度依赖以及根深蒂固的腐败，云南的财政状况一直捉襟见肘。虽然这场政变拯救了云南，使其免于被其他南方省份彻底吞并，但就目前而言，云南经济实质上已运行失调。\n\n缪云台（原名缪嘉铭）肩负着防止财政彻底崩溃的重任，他是少数受过美国教育的省内商人之一。缪云台也是一位成功的锡业公司总经理，曾被龙云任命为云南富滇银行会办，负责监督云南的经济建设。缪云台的宏伟蓝图包括从以鸦片为主的经济（由于军阀大多秉持相同策略导致鸦片市场过度饱和、价格暴跌）转向以锡为基础的经济体系，并推动工业化发展。\n\n缪云台一次次证明了自己的价值，堪称真正的金融奇才。尽管龙云重视其才能，但遗憾的是，缪云台及其他成功技术官僚的改革努力却屡遭龙云任命的诸多官员掣肘——尤其是龙云的前秘书唐洪涛，他因对云南锡业公司管理不善而深陷丑闻漩涡。尽管唐洪涛拥有工程背景，但他却极其无能、疏忽大意，甚至可以说是怠惰成性。\n\n龙云任命的亲信官员与技术官僚之间的矛盾冲突预计将持续发展——前者对掌控经济命脉至关重要，后者对恢复经济秩序不可或缺，而投资者正密切评估局势并保持观望态度。"
 YUN.midgame.736.a: "我们要相信缪云台和其他专家！"
 YUN.midgame.736.b: "忠诚是第一位的，结果其次。"
 YUN.midgame.737.t: "重新审视1915年"
 YUN.midgame.737.d: "护国战争究竟是什么？像郭沫若这样的社会主义者认为，这是一场军阀之间的军事冲突，但他们内部对民众、进步党和国民党在其中的角色也存在分歧。其他历史学家则认为，孙中山领导的国民党革命者发挥了重要作用，而且民众自身也在战争中寻求解放。在云南，唐继尧在战争期间支持梁启超及其进步党，但抵制了孙中山的革命诉求。\n\n护国战争确实反映了中国一直未能解决的民族主义问题。对于蒙自矿区的云南士绅商人而言，民族主义意味着与外国人成为平等伙伴，并解决贸易失衡问题。所谓的“改良民族主义”计划则试图借助（而非排斥）外国力量建设地方工业化政权——事实上，德国在云南的投资的确促进了新工厂和纺织业的发展。另一方面，云南的革命派（尤其是那些深受外国贸易统治之害的私营商人）希望中国彻底摆脱外国人和帝国主义者。这些民族主义者认为外国势力无处不在且横行霸道，如果中国若想获得自由，就必须彻底摆脱帝国主义者的统治。\n\n最后，在某些人看来，护国战争是一场维护宪政和中国民主萌芽的战争。战后，唐继尧试图在云南省推行民主改革，但至今仍未显现成效。南北合作的破裂令唐继尧深感失望，他在战后发表的宣言试图为未来的民主奠定基础，但收效甚微。如今，重新审视护国战争或许正是迈向民主中国的第一步。"
 YUN.midgame.737.a: "护国战争是为了争取民族之解放！"
 YUN.midgame.737.b: "护国军政府旨在捍卫云南之自治！"
 YUN.midgame.737.c: "护国运动时代奠定了民主之基石。"
 YUN.midgame.738.t: "云南革命希望日渐式微"
 YUN.midgame.738.d: "在云南，四分之三的农民拥有自己的大部分或全部土地，但每户土地通常不超过5亩，在繁重赋税之下，这种程度土地所有权根本无济于事。秉持着进步精神，像寸树声和苏鸿纲这样的民主改革者一直活跃在农村，为农民提供教育（获得了省府不同程度的支持），并致力于改善农民的困境。\n\n但这些改革的局限性迫使许多人在走投无路之下转向激进主义。然而，与能够获得农民和土匪支持的闽赣社会主义者不同的是，云南社会主义者未能实现行之有效的阶级合作。随着运动走向失败，他们转而与地方县长结成不稳定的同盟关系。\n\n在陆良县士绅与昆明当局任命的县长爆发冲突之际，云南煽动家王德三及其新滇社试图发动一场起义。王德三誓言要“穿透表象之下的社会关系”，深入剖析佃农、富农、士绅及少数民族部落间的复杂联结，并争取各方支持，包括试图制衡士绅团练的地方县长、心怀不满的军官和土匪（这些人虽无明确意识形态，但大多是民粹主义者）、各类乡村学校和教师（陆良县的学生规模尤为庞大），以及因近期强制收缴武器而愤懑不平的少数民族部落成员。\n\n然而，尽管县长和士绅彼此怨恨，但他们更惧怕社会主义者——双方于是放下分歧，共同平息叛乱。随着革命者希望日渐渺茫，龙云指示县长主动与寸树声等人合作，在严厉处置暴动头目的同时改善与农民的和平关系。然而，暴力起义却给了胡若愚一个机会，让他得以拉拢那些惴惴不安的士绅，其中许多人指责当初是龙云允许这些左翼渗透者进入他们的村庄。"
 YUN.midgame.738.a: "农民起义让士绅们确信只有胡若愚才能保护他们。"
 YUN.midgame.738.b: "龙云麾下的县长和教师帮助恢复了乡村秩序。"
 YUN.midgame.739.t: "云南与中央政府"
 YUN.midgame.739.d: "云南地处中国偏远的西南地区，群山环抱、文化多元、与世隔绝，这造就了云南与中央政权之间错综复杂的历史。十九世纪的血腥叛乱被镇压后，云南的分离主义势力虽遭铲除，但当地民众畏惧欧洲帝国主义的入侵，并对中央政府在边境管控方面的无能感到不满——他们通常只得自行应对各种事态。\n\n尽管云南领导人自己也经常发动叛乱，但他们仍在谈论建立一个强大中央政府的必要性——蔡锷几乎所有的政治主张都围绕这一核心原则展开。蔡锷坚持定都北京，以维系对东北和蒙古的影响力；同时指出中国不适合联邦制，并建议废除省级行政单位，将云南划分为四道辖区，由北京直接任命高级官员治理。\n\n蔡锷对同盟会把控的立法机构顽固反对袁世凯大总统颇为不满，并认为如果大总统在人事任命上能够保持公正，而不是依赖党派政治，就能避免腐败。蔡锷将国家统一与强盛置于意识形态之上，并预言各党派必将各自培植私军，地方豪强则会在各省割据称雄。蔡锷还规定士兵不得加入任何党派，以免军队受外事干扰，最终导致统军重任逐渐落到文弱书生和不合格的秘密会党成员手中。\n\n蔡锷的继任者唐继尧也支持建立强大的国家政府，但为了化解护国战争引发的矛盾转而主张联省制度。唐继尧将云南划分为四片镇守使辖区，但在统治末期，他又转向了让文官掌控军队。到了龙云主政时期，地方主义思潮再度复兴，尽管滇系仍然寻求国家统一，但坚持与中央平起平坐并实行自治。"
 YUN.midgame.739.a: "中国需要一个强有力且负责任的政府。"
 YUN.midgame.739.b: "在中央政府崛起前，我们需要谨守自身利益。"
 YUN.midgame.760.t: "人民教育家苏鸿纲"
 YUN.midgame.760.d: "自1932年上海起义及随后的直系残酷镇压以来，云南一直汇聚着诸多开明人士，在反对北京当局的知识分子群体中，民盟云南省委无疑也拥有一定影响力。苏鸿纲是民盟云南省委的主要成员之一，于1878年出生于昆明郊区一个普通家庭。\n\n虽然苏鸿纲家境经济虽不宽裕，但父亲仍常周济穷困，这对年幼的苏鸿纲影响极深。长大后，苏鸿纲投身教育事业，父亲病故后留在家乡任教。1903年，苏鸿纲对同盟会的革命政治活动产生了浓厚兴趣，在共和派推翻了腐朽的清王朝后，他决心以教育救国。二十年代，苏鸿纲创办了一所私立学校，这所学校后来成为云南最著名的中学之一。\n\n1932年八省联合发起镇压行动后，苏鸿纲接纳了逃亡的知识分子，并与他们合作创办了西南联大，该校被誉为进步政治思潮的温床。尽管[ROOT.GetLeader]政府并非始终青睐新兴的理想主义进步力量，但他们也认为有必要与苏鸿纲及其西南联大同事保持友好关系。"
 YUN.midgame.760.a: "苏鸿纲和民盟确实造福了人民。"
 YUN.midgame.760.b: "一位得到政府重视的大胆梦想家。"
 YUN.midgame.761.t: "青年支持之争"
 YUN.midgame.761.d: "虽然人们常说知识分子阶层宁愿待在象牙塔里学习，也不愿相信大众的知识水平，但这显然不适用于中国学术界的年轻人。学术界被视为思想斗争的关键战场，各种知识分子政治团体经常向学生团体进行宣传，希望吸引年轻人加入他们的政治组织。中国民主同盟云南省委在这方面也不例外，他们在各高校开展了一场广泛的教育活动，让担任教职的民盟成员吸引支持者加入。\n\n此类活动的中心当属西南联大，该校不仅是民盟云南省委的根据地，也是新月社的活动中心。从学生群体中招募新成员变得尤为重要——在华北平原，秉持民族主义且富有战斗性的中国青年党主导了学生招募，并凭借其令人印象深刻的招募活动，成为与国民党相媲美的群众性政党。尽管政治立场差异巨大，但南方的进步知识分子阵营已经注意到青年党的政治策略，并尝试将自身转变为群众性的知识分子运动。"
 YUN.midgame.761.a: "民盟要做自由中国的先锋！"
 YUN.midgame.761.b: "团结一致为自由中国而战。"
 YUN.midgame.764.t: "奇迹创造者缪云台"
 YUN.midgame.764.d: "或许没有哪个省份比云南承受更多苦难，这片土地在百年国耻中经历了深重的磨难，但也正是这些条件促成了以缪云台为首的云南总商会的崛起。尽管云贵总督李经羲的改革遭到士绅势力的阻挠，但在[ROOT.GetLeader]的领导下，云南总商会引领了云南的新改革潮流。缪云台1894年生于显赫的云南士绅家庭，曾在美国学习矿冶学。在美国短暂工作后，他于1919年10月回国。\n\n云南都督唐继尧很快注意到了这位年轻工程师，并任命他为个旧锡务公司总理。缪云台接手时的锡务公司正遭受财务亏损，但他通过清理债务，并采用西方新技术，使得公司面貌大为改观。1924年，缪云台升任云南富滇银行（该行实际上是云南央行）会办后，唐继尧从富滇银行大量借贷，导致通货膨胀，富滇银行破产，货币也随之崩溃。\n\n缪云台于1932年出任富滇新银行行长后，通过建立半开银元储备金制度，并发行新滇币全面回收旧滇币，成功稳定了云南金融体系。在修复唐继尧政府的财政状况后，缪云台被任命为云南炼锡公司总经理。缪云台打破了云南传统上对鸦片的经济依赖，转而发展锡矿开采，并大幅削弱了德国通过滇越铁路对云南施加的经济影响。如今，缪云台作为云南总商会会长，仍对云南经济机构保有重要控制权，云南人民对他的贡献心怀感激。"
 YUN.midgame.764.a: "他的精明管理让我们资金充裕。"
 YUN.midgame.764.b: "他的灵巧手段巩固了我方政权。"
 YUN.midgame.765.t: "总商会的金库"
 YUN.midgame.765.d: "除了缪云台的辉煌履历外，云南总商会在云南经济现代化和改革运动的发展中也发挥了重要作用。在缪云台之前，陈钧执掌着脆弱的云南经济。陈钧早年曾到日本考查政治，民国成立、李经羲被罢黜后回乡闲居，后于1912年出任富滇银行协理。蔡锷注意到了陈钧的行政才能，便提拔他为云南省内务司长。\n\n后来，唐继尧任命陈钧负责建设中国的第一条民营铁路——个碧石铁路。二十年代，陈钧先是接手个旧锡业公司，后调任蒙自道尹，最终于1931年去世。陈钧去世后，吴琨接任唐继尧治下的云南锡业公司总经理，进一步推动了云南锡业的发展。云南总商会也巩固了对云南锡业的控制，并着重推动云南经济从传统的罂粟种植向自然资源出口转型。\n\n为了实现自身目标，云南总商会通常支持唐继尧的议程，并帮助他推行军政分离。虽然国内各地反对日本在华影响的抗议主要由学生领导，但此类抗议在云南多由总商会发起，学生们随后也加入其中。尽管总商会无意自治，但它仍将在云南政治中发挥影响，并敦促省府与保守士绅主导的民主化和反帝国主义运动合作。"
 YUN.midgame.765.a: "我们赞扬总商会的宪政立场。"
 YUN.midgame.765.b: "如此受人尊敬的反帝斗士可不多见。"
 YUN.midgame.790.t: "来自[FROM.GetAdjective]的援助和赞扬"
 YUN.midgame.790.d: "云南与邻近的贵州并列为西南地区最贫困的省份之一。由于距离首都最远，且多为山地丘陵，云南在治理和经济发展方面很大程度上被中央政府忽视也就不足为奇了。\n\n虽然这有利于让云南保持政治独立，不受北京的左右，但由于中央政府开发不足，大部分现代化建设工作都由昆明当局承担，尤其是在辛亥革命和护法战争之后。\n\n然而，[FROM.GetNameDef]最近试图消除这种经济不公现象，并承诺向云南提供经济援助，以进一步发展当地经济，使云南发展水平比肩东部省份。除此之外，[FROM.Capital.GetCapitalVictoryPointName]当局还向龙云将军以及蒙自的胡若愚将军（这令人相当意外）表达了赞赏。\n\n虽然大多数人对[FROM.GetAdjective]领导层的慷慨之举表示欢迎，但龙云却对此心存疑虑。这笔援助或许是件好事，但来自[FROM.Capital.GetCapitalVictoryPointName]方面的提议显得过分优厚——尤其当它声称不附加任何条件时，反而更显可疑。"
 YUN.midgame.790.a: "他们还是忠厚人啊。"
 YUN.midgame.790.b: "你的好意我们心领了，但请容我拒绝。"
 YUN.midgame.791.t: "关于[FROM.GetAdjective]特工贿赂的报告"
 YUN.midgame.791.d: "中国的征兵方式与其他拥有职业军队的国家存在显著差异，这主要是因为中国军队内部派系林立，导致许多地方军阀都组建了自己的私人武装。从街头征募、强征壮丁，再到通过家族关系招募，地方军队往往因缺乏其他就业机会而力量不足，并深受腐败之害。\n\n士兵逃亡现象时有发生，无论是出于自保心理、个人矛盾引发的积怨，还是收受贿赂的驱使，均导致地方省级部队一旦出现裂痕就极易崩溃瓦解。因此，昆明当局对[FROM.Adjective]特工在军中行贿的报道表现出高度警惕实属必然反应。\n\n这很可能是对方为了进一步渗透云南而策划的更大阴谋的一部分，并将胡若愚作为他们首选的云南督理人选。一旦双方爆发冲突，这将给龙云将军带来灭顶之灾。\n\n为了遏制军队内部的腐败风气，顾问们建议实施全面整肃，清除被渗透的人员。虽然这可能会在短期内影响滇军战斗力，但鉴于中国过去几十年里经历的混乱动荡，忠诚无疑是军人最重要的品质。"
 YUN.midgame.791.a: "滇军中的叛逃现象愈演愈烈。"
 YUN.midgame.791.b: "龙云对军队展开彻底清洗。"
 YUN.midgame.792.t: "来自[FROM.GetNameDef]的军事威胁"
 YUN.midgame.792.d: "实现政治目标的方式多种多样，既可通过战争手段，亦可借助外交途径。当外交斡旋无望时，才会无奈发动战争以达成目的。然而由于战争代价高昂，部分决策者转而通过军事威胁以重启外交谈判——对于[FROM.GetNameDef]来说，情况正是如此。[FROM.Capital.GetCapitalVictoryPointName]已向昆明发出了一封电报，警告称若他们的条件未能得到满足则将诉诸武力。\n\n除其他条件外，他们还要求必须让几名人员加入我方政府。不出所料，名单上的大部分人似乎都是胡若愚的效忠者和追随者。虽然这可能只是巧合，但显然[FROM.GetNameDef]更倾向于让胡若愚担任云南督理，而非龙云将军。\n\n尽管面临军事威胁，但云南的许多人仍然相信，[FROM.Capital.GetCapitalVictoryPointName]的外部入侵将被轻易击退，多山地形让云南尤为易守难攻。即便如此，公众似乎总体上仍对战争感到失望，第二次滇桂战争的惨败依然记忆犹新。\n\n对于龙云而言，他与蒙自派的内斗仍在继续。虽然目前局势仍未变化，但显而易见的是，如果龙云屈服于[FROM.Capital.GetCapitalVictoryPointName]的要求，云南的自治权以及他自身的权力都将岌岌可危。与此同时，不可否认的是，维持和平远比一场可能爆发的长期战争更加艰难。"
 YUN.midgame.792.a: "面对压倒性的力量，失败主义四处蔓延。"
 YUN.midgame.792.b: "云南局势并未因这些明晃晃的虚张声势而受到影响。"
 YUN.midgame.793.t: "[FROM.GetAdjective]与蒙自派的交易"
 YUN.midgame.793.d: "第二次滇桂战争最终成为了一场灾难，不仅摧毁了唐继尧督理的扩张野心，也损害了云南的内部稳定。唐继尧失势后，龙云将军和胡若愚将军成为云南新的权力中心。龙云坚守省会昆明，胡若愚将军则留在势力基地蒙自与盟友密谋。\n\n尽管胡若愚未能成为云南的新霸主，但他仍牢牢掌控着蒙自利润丰厚的南方矿区，并将矿产出口至印度支那港口，从中赚取了巨额财富。因此，云南的经济在很大程度上受制于蒙自派及其靠山的影响，直系军阀便是其中之一。\n\n真相现已大白，[FROM.GetNameDef]一直绕过昆明当局，直接与蒙自派达成交易，因此我们没有收到任何用于补贴矿场持续开采的资金。这笔交易不仅公然侵犯了云南的自治权，更进一步增强了胡若愚在省内的影响力。\n\n虽然我们想挽回颜面并反制[FROM.GetAdjective]的明显干涉，但除了向[FROM.Capital.GetCapitalVictoryPointName]发送一封电报表达自身不满之外，我们别无他法。不过也有人建议，对此视而不见或许是避免进一步政治窘境的更好做法。"
 YUN.midgame.793.a: "他们想找谁协商就去吧。"
 YUN.midgame.793.b: "昆明才是省府所在地，而非蒙自！"
 YUN.midgame.794.t: "[FROM.GetNameDefCap]释放和平信号"
 YUN.midgame.794.d: "自从袁世凯死后中国陷入分裂以来，国家统一一直是许多人的梦想。但由于种种原因，无论是通过和平谈判还是武力手段，所有努力都未能实现统一目标。八省联合崩溃、孙传芳联帅遇刺、齐燮元接任联帅后，直系统治下中国统一的幻象彻底破灭。\n\n在华南地区，云南是唯一未受战火和内乱蹂躏的省份，滇系不断积蓄实力，最终从国民党残部手中夺取了贵州。然而，云南督理唐继尧却因觊觎广州，悍然入侵两广地区，几乎毁掉了十年韬光养晦的成果。为了拯救云南，龙云和胡若愚扣押了唐继尧，并带领云南走向孤立。\n\n趁着云南外交形势发生新转折，[FROM.Capital.GetCapitalVictoryPointName]当局已向昆明发出和平试探，探讨南北统一的可能性。尽管国家统一在云南省内颇受欢迎，但许多人怀疑这究竟是真心实意，还是[FROM.GetAdjective]为巩固其在云南的影响力而耍的花招。\n\n对于龙云将军来说，滇系军阀无法承受与外部势力纠缠的后果，这会危及云南的自治权，并将云南卷入与其无关的战争。同时，断然拒绝旨在促进国家统一的和平提议，可能会让昆明省府丧失民心。"
 YUN.midgame.794.a: "龙云接受提案以维护和平。"
 YUN.midgame.794.b: "龙云断然拒绝这种妄图收编的拙劣伎俩。"
 YUN.midgame.795.t: "云南阻挠我们的努力"
 YUN.midgame.795.d: "尽管我们投入甚巨，试图扩大我们在云南地区的影响力，但龙云将军还是识破并阻止了我们的计谋。即便如此，这次精心策划的行动仍耗费了龙将军的宝贵资源——这些资源本该用于其他更有价值的地方。目前，胡若愚及其蒙自派只能暂避锋芒，在我们恢复元气之前自求多福。"
 YUN.midgame.795.a: "我们应该静待时机。"
 YUN.midgame.796.t: "[FROM.GetNameDefCap]强迫我们宣誓效忠"
 YUN.midgame.796.d: "在近代的大部分时间里，云南很少遭受境外势力的入侵。作为云南督理唐继尧“武力干预主义”的一部分，滇军曾入侵邻近的贵州、广西，甚至四川等省份，试图扩大滇系在西南地区的影响力，这种鲁莽的扩张主义最终在第二次滇桂战争中达到顶点。云南入侵两广失败后，滇系军阀退回孤立状态，唐继尧也被龙云与胡若愚联手推翻。\n\n颇为讽刺的是，云南如今面临着向外部势力屈服的最后通牒，外部强权企图迫使云南归顺并削弱其珍视的自治权。或许是对自己征服西南地区的能力充满信心，[FROM.Capital.GetCapitalVictoryPointName]当局要求龙云向[FROM.GetNameDef]宣誓效忠，否则将面临雷霆之怒。\n\n龙云曾希望以中立姿态保全云南的自治权，并让云南专注于本土发展而非扩张势力。然而面临一触即发的战事，让麾下将士冒险卷入又一场可能导致滇系军阀覆灭的血腥战争，这实非明智之举。"
 YUN.midgame.796.a: "龙云下令动员，捍卫云南自治！"
 YUN.midgame.796.b: "龙云不情愿地向[FROM.Capital.GetCapitalVictoryPointName]屈服。"
 YUN.midgame.797.t: "云南当局不为所动！"
 YUN.midgame.797.d: "护国战争期间，云南是第一个反对袁世凯复辟帝制的省份。当时，云南都督蔡锷逃离北京返回云南，率领云南一省对抗全中国。但在其他省份响应号召反抗北京当局后，云南奇迹般地取得了胜利。经此一役，云南奠定了反抗北洋暴政的“民主堡垒”声誉。\n\n自此以后，云南在历任地方主官的领导下，奉行着武力干预主义与孤立主义并存的政策，现任云南领导人龙云也不例外。云南最看重的当属独立于中央政府的自治权，尽管我们努力将西南地区纳入自身势力范围，但昆明当局始终不为所动。\n\n云贵高原是抵御外敌入侵的天然屏障，考虑到滇军在其领土内拥有的军事优势，放任昆明当局自行其是或许才是明智之举。与此同时，如果我们任由昆明为所欲为，我们或将永远失去让这个叛逆省份重回正轨的机会。"
 YUN.midgame.797.a: "是时候给这个叛逆省份一个彻底教训了。"
 YUN.midgame.797.b: "让云南继续保持自治，我们仍需等待时机。"
 YUN.lategame.000.t: "儒将英雄"
 YUN.lategame.000.d: "中国本来便是乱与治循环交替的，在普通百姓的思维中，文武之辨是互补的——虽不平等、亦不对立。千百年来、历朝历代，和谐治世总是与动荡乱世相互交替。而在乱世中，将帅之才愈发受到重视。因此，年轻的唐继尧心中，对于英雄将帅的赞颂，并非是对传统盛行儒家思想的排斥，而是一种改进。在日本陆士求学时代，唐继尧就曾这样记叙过自己的心态：\n\n“天下有道则见，天下无道则隐，圣贤也；天下有道则隐，天下无道则见者，英雄也。”十九、二十世纪确为乾坤颠覆之际，豪杰奋袂之时，神州大地无道久矣。他继续写下，“吾愿今日之中国，出一伟大之英雄，兼圣贤之德识才量，而以英雄之气魄能力，挽此大厦将倾之势。”\n\n随着这样的著述通行于世，中国文学界的风气已然明了：唐继尧自诩为振兴中国的雄略敢为之英雄。他和最高指挥部利用这种精神，动员起民众为新护国军服役。他认定军国民主义并非抛弃传统的根，而是长期的文化传统要求人们不得不投笔从戎、成为英雄。但唐继尧的立场同样招致批评，许多人称正是唐继尧这样的思想让中国陷入了军阀混战昏暗的无穷乱世。"
 YUN.lategame.000.a: "强军方能救国！"
 YUN.lategame.000.b: "军国民主义才是当今乱世源头！"
 YUN.lategame.001.t: "中国的武士道"
 YUN.lategame.001.d: "在很多人看来，蔡锷是云南现代化的旗手，也是当前云南领袖的先驱，因而毫无疑问他在本省、本国都德高望重。作为“护国军神”，他的著作在一系列哲学讨论中也有了新的地位。而最有趣的就是他年轻时的著述。蔡锷与他的知己蒋百里为梁启超的《新民丛报》分别撰写了一篇文章，即《军国民篇》与《军国民之教育》。这两篇文章被视作从德、日两国输出的军事民族主义首次传入中国，而阐述的都是提倡对中国国民采取普遍的军事教育。\n\n蔡锷的文章尤其感慨现代中国之“驯良懦弱”，指出中国应该发展出自己的尚武精神。他将缺乏军国民精神归咎于中国的教育，而又进一步批评了本国的哲学、文学、习俗与音乐。与邻国日本不同，中国的青年将其精力消耗在了“仁义礼智、三纲五常之高义”上，而与此同时日本人则被灌输了爱国、忠君和尚武的精神。中国人“伈伈俔俔，俯首帖耳”，故屡次向外来帝国主义列强奴颜屈膝也不足为奇了。\n\n在蔡锷的世界中，“外交之胜败，视乎武力之强弱”，他担心中国如果不能在身体和精神上凝聚足够的力量，打造出能够适应世界潮流的新民精神，那么面对外来列强的扼杀，“中国其真亡矣”。虽然蔡锷这些社会达尔文主义的著作是[ROOT.GetLeader]的新军事体制乃至昆明本身精气神的基础，但也引来了文官体系中许多人的担忧。人们担心，进一步歌颂军人的荣耀，无异于让军政统治继续失控。"
 YUN.lategame.001.a: "我们也有武士道！"
 YUN.lategame.001.b: "对于顽固不化的军人，最好还是审慎。"
 YUN.lategame.002.t: "我们共同的民族国家"
 YUN.lategame.002.d: "在护国军的传承中，没有什么比其建军的关键时刻更为重要：蔡锷、唐继尧和李烈钧麾下的英勇将士们奋勇抵抗暴君袁世凯的帝制野心。蔡锷始终坚信军队肩负国家福祉之重任，这一信念在滇系军阀治下被不断重申，但最引人注目的莫过于蔡锷在护国战争前夕对士兵的讲话。蔡锷在讲话中主张中华民国的民选总统应该创建一个“共同的民族国家”，为了确保民族国家的存续，每个人都应承担各自的责任。蔡锷据此痛斥袁世凯的做法恰恰相反：袁世凯当选后便开始破坏共和国的政治制度，滥用职权谋取私利，进而危害国家统一。\n\n更糟糕的是，袁世凯在宣布洪宪帝制时，假装顺应民意。蔡锷为此疾呼：“所以本军不忍我民族国家亡在旦夕，望各省军界以及仁人志士能够与我军同心协力，把袁氏除了，共同维持我们的民国。”唐继尧后来也重申了同样的观点，并补充道，背弃共和即为逆时代潮流而行。\n\n虽然蔡锷等人得到了国内最狂热军事派的支持，但民间却出现了沉默的反对，这似乎暗示着，中国命运不应由军人决断，倘若袁世凯未曾当选大总统、权倾朝野，而是由文官执掌国政，或可令华夏免遭军阀混战之劫难。"
 YUN.lategame.002.a: "军队是我们的大救星！"
 YUN.lategame.002.b: "如今军队不亦蹈袁氏之覆辙乎？"
 YUN.lategame.003.t: "军人在民族国家中的角色"
 YUN.lategame.003.d: "蔡锷关于中国军事化民族国家的大胆构想并非仅限于其个人及追随者，亦未孤立于军队内部——护国战争爆发后不久，云南旋即成立“护国演说社”，在昆明举办系列讲座以争取民众对英勇将士及反帝制事业的支持。在其中一次演讲中，护国演说社重申了护国军对袁世凯宣战的“责任”。若放任袁氏推行帝制，中国人民将再度沦为丧失政治权利的臣民，其血汗凝膏仅为一人独享。\n\n在另一场演讲中，蔡锷、唐继尧及李烈钧等人发动护国战争的法理依据被用通俗易懂的白话文阐释道：“共和制民族国家主体在人民，大总统由人民按法公举以主持政府。今袁世凯以大总统的座位，不能流传给他的子孙，私心自用，凭着大总统的势力，破坏共和，妄称皇帝。”鉴于人民尚未充分觉悟自身制止袁氏阴谋之责任，蔡锷、唐继尧、李烈钧三人遂挺身而出以救国救民。\n\n最后，护国演说社再次举行街头演讲，探讨“共和国的国民最荣耀的职务是哪样呢？”这一问题。在崇尚军人的中国民族主义与国家主义思潮中，答案不言而喻：“就是当兵了！”"
 YUN.lategame.003.a: "军人有此显赫地位诚然可喜可贺！"
 YUN.lategame.003.b: "在你任内各项制度正在遭到破坏！"
 YUN.lategame.004.t: "滇军荣光"
 YUN.lategame.004.d: "滇军素来秉承尊崇英雄历史的传统，纵使在三十年代初这支劲旅已不复往日荣光，官兵们依然坚持举行阅兵游行、发表演说，颂扬滇军在国家政治与地方文化中的重要地位。为了重申这一理念，[ROOT.GetLeader]近日在昆明举办盛大庆典，并在上级领导的陪同下，向广大官兵发表讲话，以此激励全军士气。\n\n“今日之庆典，铭刻着滇军捍卫国体的不朽史诗。1915年12月24日，正是滇军首举义旗再造共和，吾等先辈执干戈以卫社稷，以雷霆之势荡平洪宪伪朝，斩断袁逆帝制迷梦。若无此日护国首义，则武昌首义纪念难存，两广自治更无从谈起。今海内外同胞莫不将这番扭转乾坤的伟业，归功于滇军将士——千里出滇护国讨袁，大小数十战，其功绩当铸钟鼎永志。”\n\n在雷鸣般的掌声与欢呼中，建军周年庆典的重启堪称护国军中独有盛事——纵观华夏大地，鲜有军队承载如此壮阔辉煌的历史。当天晚些时候，[ROOT.GetLeader]走下讲台，亲赴云南革命烈士纪念碑前瞻仰祭奠，此举得到各界高度宣传。"
 YUN.lategame.004.a: "护国军英烈永垂不朽！"
 YUN.lategame.004.b: "当下的滇军让先辈蒙羞。"
 YUN.lategame.005.t: "五虎上将"
 YUN.lategame.005.intro: "随着新护国军完成了军事改革，蔡锷护国军的成就在我们全体官兵的内心深处得到了延续。路漫漫其修远兮，现在的军队也能再度担上国之劲旅的美名。军官们都得到了责任感与道德观的灌输，充分意识到自己在建设军事化民族国家中发挥的作用。而在这些军官中，有几人超群出众。正如唐继尧、蔡锷、罗佩金、李根源、顾品珍等过去的滇军豪杰一般，如今滇军中的优秀将领们再度承担起了救国的重任。\n\n这些新秀被称为“五虎上将”，指这五人和三国时期的五虎上将一样在主公麾下大显身手。他们的表现出类拔萃，是如今的护国军中一等一的优秀军人。\n\n"
 YUN.lategame.005.d_npa: "$YUN.lategame.005.intro$云南真正的守护者崛起后，尽管总参谋部成员大多遭到清洗，但由于摆脱了唐继尧那灾难性的腐败阴谋，滇军实力反而更加强大。新滇军五虎上将中的第一位是“干将”胡若愚。这位素以雄韬伟略著称的滇军大统帅，早在二十年代末策动倒唐兵变时，便被视为云南的悬顶之剑。\n紧随其后的是“忠将”鲁道源。作为一位年轻有为的优秀将领，鲁道源近期屡建战功，并在云南的政治泥潭中始终保持超然姿态。\n第三位是“福将”卢汉。卢汉虽然因追随表兄龙云的足迹而闻名，但他的成功实则源于与生俱来的应变能力，再加上异于常人的好运。\n第四位是“飞将”张冲。张冲素以坚韧不拔、作战彪悍著称，用兵神速且善于临机应变，因此总能取得远超同僚的战果。\n最后一位则是“虎将”龙云。龙云是滇军出身的最优秀的军事将领，而且没有上述几位同僚身上的缺点。龙云擅长各种类型的战斗，对攻击战尤为拿手，得此“虎将”威名实至名归。\n\n自然，如此吹捧军人引发了政府内文官集团的怀疑，他们指责军方正在干预省政，自成一系。"
 YUN.lategame.005.d_feds: "$YUN.lategame.005.intro$五虎上将中的第一位是“干将”胡若愚。胡若愚素以灵活善变闻名，但论忠诚可靠则稍显不足。他常以地道的云南人自居，声称只为士绅利益和云南最高阶层官员保驾护航。\n紧随其后的是“忠将”孙渡。孙渡是一名真正的战士，始终出色地为自己的领导人服务。他是个不问政事、不折不扣的军人。\n第三位是“福将”王洁修。作为一位骁勇有余而谋略稍逊的指挥官，王洁修在战争中不屈不挠，屡战屡胜，从而赢得了这个略带戏谑的绰号，但他仍然是最优秀的统帅之一。\n第四位是“飞将”唐继麟。作为一名杰出的战术家，他能够在任何战场形势下迅速调动部队，这使他的表现屡次胜过自己的同僚们。同僚们无不为此感到懊恼，而唐继麟本人却颇为得意。\n最后一位则是“虎将”龙云。龙云是云南陆军讲武学校出身的最优秀的军事将领，而且没有上述几位同僚身上的缺点。龙云擅长各种类型的战斗，对攻击战尤为拿手，得此“虎将”威名实至名归，但他的政敌却对此颇有微词。\n\n自然，如此吹捧军人引发了政府内文官集团的怀疑，他们指责军方正在干预国政，自成一系。但嘹亮的军号声与“五虎上将”对联省方案的巨大贡献，都有力地驳斥了这些猜忌。"
 YUN.lategame.005.d_kmt: "$YUN.lategame.005.intro$五虎上将中的第一位是“干将”陈诚。陈诚和他的土木系被认为是先总司令蒋介石的“天子门生”，他们已经证明了自己对国民党的忠诚。陈诚没有陷入派系斗争的漩涡，每一位真正的革命者都应学习他的可靠与干练。\n紧随其后的是“忠将”顾祝同。顾祝同是一名真正的战士，无论是在何应钦、朱培德还是蒋介石麾下，他都会出色地为自己的领导人服务。他是个不问政事、不折不扣的军人。\n第三位是“福将”刘峙。作为一位骁勇有余而谋略稍逊的指挥官，刘峙在战争中不屈不挠，屡战屡胜，从而赢得了这个略带戏谑的绰号，但他仍然是最优秀的统帅之一。\n第四位是“飞将”蒋鼎文。作为一名杰出的战术家，他能够在任何战场形势下迅速调动部队，这使他的表现屡次胜过自己的同僚们。同僚们无不为此感到懊恼，而蒋鼎文本人却颇为得意。\n最后一位则是“虎将”卫立煌。卫立煌是黄埔出身的最优秀的军事将领，而且没有上述几位同僚身上的缺点。卫立煌擅长各种类型的战斗，对攻击战尤为拿手，得此“虎将”威名实至名归。\n\n自然，如此吹捧军人引发了党内文官派系的怀疑，他们指责军方正在国民党和国民革命军中拉帮结派，自成一系。但嘹亮的军号声与“五虎上将”对国民革命的巨大贡献，都有力地驳斥了这些猜忌。"
 YUN.lategame.005.a: "好一群英雄豪杰！"
 YUN.lategame.005.b: "这些军队小团体也太明目张胆了！"
 YUN.lategame.006.t: "建立中央航空学校"
 YUN.lategame.006.d: "随着中国与外来帝国主义列强的冲突日渐迫近，云南得到了新的关注。由于其在我国相对孤立的位置，中央高层也对其愈发重视。为此，[YUN.GetRulingParty]和[ROOT.GetLeader]已将所有重要的航空资产从保定和杭州转移到了昆明巫家坝机场，令其成为中央政府的航空总部。中国航空和中央航空也不得不将其运营基地迁移到昆明，而巫家坝也随之成为中国的“两大航空中心”之一。\n\n为成为我国空军与民航共用的合适场所，也为了满足战争的需要，云南省政府已下令对巫家坝机场进行扩建。云南省建设厅、航空局、总参部、军需局和昆明县政府共同派员参与巫家坝机场扩建过程，组成了巫家坝机场建设改造工程委员会。\n\n工程实质上是将巫家坝机场改造成为我国唯一的国际进出机场，将原有的两条平行跑道延长至两千两百米，改设为沥青路面，并将候机室改造为砖木结构，建立了对应的物资仓库。除此之外，机场附近还开设了一些酒店、饭店、商店和医疗诊所。"
 YUN.lategame.006.d_kmt: "$YUN.lategame.004.d$\n\n尽管改造工程名义上由黄埔系骨干黄秉衡和蒋坚忍主持，但此二人在为扩建进行融资等方面几乎没有实际发言权。而毫不意外的是，巫家坝机场建设改造工程委员会手握如此诱人的合同，也牵动了省建设厅、军需局与县政府，自然成为了政学系银行家与CC系技术官僚你争我夺的战场。[ROOT.GetLeader]想要在二者之间把水端平，因此他的处境尤为尴尬——需要让各方都感到自己有利可图，以免哪一边阻碍项目的顺利进行。"
 YUN.lategame.006.a: "让陈氏兄弟拿到这份合同。"
 YUN.lategame.006.b: "最好交给金融专家去做吧。"
 YUN.lategame.006.c: "云南要成为我国的中心了！"
 YUN.lategame.007.t: "军人的美名"
 YUN.lategame.007.d: "在云南的尚武精神不断朝现代化进步，并深入中国人意识之时，滇军士兵的特征也在朝着日本帝国士兵靠拢。然而，这仍只停留在了表面，因为日本公民把他们兵士当作了新武士，而士兵也在为国家与天皇之荣誉而战。反观中国，知识分子和农民仍然对于普通士兵不太信任，认为他们的真实意图令人担忧。\n\n蔡锷看过普通中国公民对士兵的印象后，便写下了日本人对本国士兵的看法：“凡壮丁投戎，宗党邻里必醵金以赠，张旌以贺，设宴以飨；虽庶孽子弟入行伍，尊亲亦以为荣。士卒所至，市井折价而迎，乡野待若上宾。倘有临阵脱逃、玷辱军誉者，举族蒙羞，父兄耻于闾里。”\n\n要想让中日士兵能够分庭抗礼，滇军仍然道阻且长——要革命，要转变看待军人的文化思维。在此之前，滇军必须再接再厉，达到众人期望。毕竟无论是否得到回报，护国勇士都将以身护国。"
 YUN.lategame.007.a: "要崇尚新的武士阶层！"
 YUN.lategame.007.b: "恃勋矜武，自取灭亡。"
 YUN.lategame.008.t: "滇军军神"
 YUN.lategame.008.d: "随着战场上的不断胜利，[FROM.GetLeader]在政治上的主导地位也日益显赫。不仅是他圈子内的人，连全国都在传说，无论在影响力还是谋略上，他都可堪为惊天动地的蔡松坡的继承人。[FROM.GetLeader]形成了铺天盖地的个人崇拜，被人们誉为“滇军军神”，是本国新的护国军旗手与先锋。他们没有如蔡锷一般中道崩殂，而是得以开足马力，彻底实现民族救亡。\n\n他是深刻影响云南风貌内核的滇军英雄，带来了新一代任人唯贤的军中武士，他们效忠尽责，不为享乐与权力，而是为了中国建成军事化民族国家这一事业本身。他们的军队和政治天才经得起称赞，他们的事业配得上永远铭记。没有他们的行动，现代的中华民族也将不复存在。一代又一代华夏儿女的烈士们，护国军将会为了捍卫你们为之牺牲的一切而战。"
 YUN.lategame.008.a: "与蔡松坡一脉相承。"
 YUN.lategame.040.t: "黄皮书事件成功解决"
 YUN.lategame.040.intro: "1886年英国吞并上缅甸后，滇缅领土边界长期都是中英关系中的重要问题，也一直以来是云南政权所争论的焦点。英国和后来的缅甸对于当地边界的认知都来自于旧缅甸王国官员提供的信息，他们认为从前向缅甸国王上贡的地区都应该是缅甸的合法领土。而事实上，英国当局也依此宣称，这些旧缅甸王朝的领土全部归大英所有，其中包括但不限于：伊洛瓦底江的发祥地，即萨尔温江（在中国境内叫怒江）、湄公河（在中国境内叫澜沧江）与长江的上游河谷，而这些地区又居住着掸族、克钦族、钦族和拉什族等独特而人口稀少的土著社区。缅甸成为殖民地之前，对这些地区并没有什么影响力。\n\n清朝与大英的多次谈判都未能解决这些问题，直至1910年，南北割裂的两地问题仍然悬而未决。在对各自边境的不同认知下，这样的问题可以说无从谈起，只是交由当地的土司政权来管理这些区域，而土司对于边界亦无明确区分。1910年英国占领片马后，蔡锷对英采取妥协政策，但他仍然希望将这些中国的土地从英国（现在是缅甸）的控制下解放出来。\n\n更紧要的是，滇南的争议地区炉房有一批无价的银矿，云南省政府对其也颇为关注。作为二十余年来对抗外来帝国主义的焦点，在滇军最为强盛之际，发动进攻、收复失地的时刻已然到来。云南健儿不会再向任何外国强权屈服，计划发动一系列边境冲突，控制缅甸边防军所据守的几个孤立的小堡垒。\n\n"
 YUN.lategame.040.d: "$YUN.lategame.040.intro$不出所料，云南当局短短几日就控制了当地，成功夺取了此处的实际控制权。这也是我国洗刷百年国耻之不公不义的第一步。"
 YUN.lategame.040.a: "这就是帝国主义余孽的下场！"
 YUN.lategame.040.b: "所以死了这么多人，这一切值得吗？"
 YUN.lategame.041.t: "黄皮书事件铩羽收场"
 YUN.lategame.041.d: "$YUN.lategame.040.intro$尽管人员数量和训练水准都胜过守军，但滇军竟然没有守住这些据点。守军的增援火速抵达，杀了滇军一个措手不及，将他们赶回了云南。黄皮书事件可谓是为百年国耻又添上新的一笔，而这也大大鼓舞了缅军的信心。"
 YUN.lategame.041.a: "我们还是要对外国人卑躬屈膝吗？"
 YUN.lategame.041.b: "快撤！"
 YUN.lategame.042.t: "两败俱伤"
 YUN.lategame.042.d: "$YUN.lategame.040.intro$滇军自诩训练有素、领导有方，对缅甸边境发动的突袭应该可以速胜。然而，守军的抵抗比想象中更为顽强，虽然滇军成功击退了守军的增援，但却无法彻底控制边境地区。这是滇军的一场耻辱性的大败，对守军来说也不过一场惨胜。"
 YUN.lategame.042.a: "还护国英雄，连边境流寇都输，接下来没人输了。"
 YUN.lategame.042.b: "脸都不要了。"
 YUN.lategame.050.t: "重提《连坐法》"
 YUN.lategame.050.d: "在黄埔军校的旧传统中，最为基本的力量便是革命军人的国民党精神。在一度师从日本教导的国民党军官的强烈影响下，他们认识到最强劲的武士道所带来的最坚韧的毅力。此外，从务实的角度来看，要是党军士兵能敢于多打些白刃战，他们就能节约不少宝贵的弹药。而在云南讲武学校和黄埔军校的双重影响下，一种新文化也在逐渐生根发芽。\n\n优秀的黄埔学子不仅是一群战士，还是一股龙精虎猛的革命力量，他们敢于自我牺牲、担负重任、永不言弃，在不断的教导下，连一般的兵士也有着精英军国民的思想。但是，在高级将领和原国民革命军残部看来，这样的精神在流亡期间已然大打折扣。像是滕杰这种极端分子，还有何应钦这种十分讲纪律的人，他们提出，要恢复先总司令的《连坐法》，对于没有命令就擅自逃离岗位的军官，则一并杀之。\n\n如此激进的举措在军方一石激起千层浪，许多著名的军头甚至黄埔校友，如李根源、顾祝同和卫立煌都提出了强烈反对。他们指责蓝衣社和何应钦无异于想在纪律讲无可讲之时还把纪律奉为圭臬。所谓大难临头各自飞，难道自我牺牲也要强迫吗？"
 YUN.lategame.050.a: "为了革命的纯净，此法很有必要。"
 YUN.lategame.050.b: "我们才不枪毙自己的军官！"
 YUN.lategame.051.t: "新阶段、新策略"
 YUN.lategame.051.d: "随着我国局势转向稳定，持朱德一派军事思想的改革派开始在国民革命军中提倡更具进攻性的策略，称我军已经具有更主动采取行动的能力。他们宣扬在继续专注执行包围与歼灭时，我之于敌已相对强势，遂应该执行尽可能歼灭大量敌军阻碍，以巩固我之领土的策略。随着攻势顺着原先的进攻战略铺展开来，在敌人方面，强者就变成了弱者，优势就变成了劣势；国民革命军方面反之，弱者变成了强者，劣势变成了优势。突破包围的负担，便落到了敌人的头上。而敌人缺乏民众的支持，国民革命军却还有着许多的优势。由此可以断定，敌人的策略是必然失败的。\n\n改革派坚信一种基本的致胜模式，总结出了一本基础小册子。即战略进攻的第一阶段为分割阶段，即依赖于聪明的指挥员灵活运用三类战术：游击分割、运动分割与阵地分割。\n游击分割通过破坏、扰乱与伏击来阻碍敌人的通信与协调；而运动分割则是要在分散的敌人部队间调动国民革命军第正规军；阵地分割则是集中优势兵力，打敌人的薄弱环节。\n\n之后便进入战略包围的第二阶段，此时，对敌部队之分割已彻底完成，但本质上仍只是战略上的包围。第三阶段即是执行对被包围之敌的歼灭。要综合运用短距离攻击、突击、分进和合击。一路高歌猛进的新国民革命军自然不会有多少人反对，而改革派的计划因此得以付诸实践。"
 YUN.lategame.051.a: "农民阶级的英雄们，前进！"
 YUN.lategame.051.b: "国民革命军的士兵们，前进！"
 YUN.lategame.052.t: "新旧分歧"
 YUN.lategame.052.d: "可以预见，许多老一辈国民革命军指挥官还在不断努力接受朱德、陈毅这样军队中新锐改革派的学说。改革派受初步成果的鼓舞，决心要将军队改革推向最高潮。他们划定，在战争的最初阶段，运动战应占据首要地位，而游击战和阵地战的地位则将随着战事的进展灵活调整。\n\n具体到某一外来帝国主义列强进犯中华（主要针对日本）时，改革派强调，入侵的初期是运动战的阶段，要发扬部队的机动性、战略的灵活性。此后，日本人将不得不停止其战略进攻，转入保守占领的第二阶段。因此，在这个阶段，我之明智做法应当是专注游击扰乱，并在敌人后方动员起民众抵抗。第三阶段，日军将会极大地陷入疲惫，而我将于此时发动全面进攻，迫使日军在中国的重兵下逐步退却。此时，运动战仍然占有重要地位，但阵地战的重要性将缓慢占据高峰。\n\n刘峙、卫立煌和顾祝同对这类理论公开提出反对。他们是传统黄埔学说的铁杆支持者，因而反之提出了自己的国民革命军战略，即一开始就采取先头部队对敌人进行局部包围。凭着坚定的意志，以及一轮又一轮决战，这就可以确保速胜，减少中国人民所受的苦难。这就是他们眼中与所谓消耗战截然不同的策略。"
 YUN.lategame.052.a: "要打就要追求决胜！"
 YUN.lategame.052.b: "总体的胜利比速胜更可取。"
 YUN.lategame.053.t: "人民卫士"
 YUN.lategame.053.d: "随着我们攻克了越来越远的领土，国民革命军再一次走出了云贵高原，在外面得到了一些群众的欢迎，也受到了一些蔑视。而我们刚刚解放的领土上，一幅陌生而又醒目的画卷正缓缓铺陈开来。在近期占领的各县城中，国民革命军士兵和现存的国民党游击队会师，重振了士气，也重新建立起了地方政权机构。此外，他们还建立了民间组织来增援当地游击部队，组建了没有武装的“自卫队”来保卫道路、传递信息、照顾伤员。此外，国民革命军还通过话剧、演说、歌舞和大字报来向民众宣传三民主义。\n\n虽然这些士兵为当地的军事和治理状况都带来了巨大改善，但很多文官就这些士兵向[ROOT.GetLeader]提出了怨言。他们称，军人们的行为总体上是道德高尚的，但却逾越了国家军队应尽的本分。他们的行为正积极地破坏着县长等官员在建设新夺取地区的管理作用。虽然这话说得在理，但也难保文官们不是在做政学系和陈氏兄弟的传声筒，毕竟军队削弱的正是他们的影响力。"
 YUN.lategame.053.a: "百姓无不竭诚欢迎优良的革命者！"
 YUN.lategame.053.b: "交给官员去办，这不是士兵该做的事。"
 YUN.lategame.054.t: "战士们的困境"
 YUN.lategame.054.d: "在朱德发布一系列改革军队的指示后，他请求[ROOT.GetLeader]亲自指导推进进行中的征兵改革。朱德起草的《征募和教育新兵问题的训令》就力图让国民革命军解决招募新鲜、合格新兵的问题。目前，军队招募了不少年纪太小、有疾病甚至残疾的士兵，无法投入战斗。上述训令为新兵定下了如下标准：\n\n年龄须在十六岁以上三十岁以下，体格强健，身长四尺二寸以上。各正规营征募新兵必须经军医处或卫生队检查合格后始得补名；游击队则得由支队长、政治委员亲自检验始行补名。二者都需确与第一项资格相符合。新兵教育以集中为原则，以新兵营或新兵排的形式，教育训练至相当时期及有相当程度时，始行补充入前线部队。\n\n这样的条件相当友好，也得到了军中各派的支持，但却又自然遭到了CC系的反对。他们质疑征募情况是否真有朱德所称如此不堪，毕竟招兵以往就是CC系负责的。此外，陈立夫提出，这种广泛的考核也为党和军队增添了官僚工作负担，最好还是把这些问题留给专业人士操办——所谓专业人士就是他的兄长陈果夫，还有他们的CC系。"
 YUN.lategame.054.a: "批准朱德请求，好兵才能打胜仗。"
 YUN.lategame.054.b: "这种措施搞不下去的。"
 YUN.lategame.055.t: "重振体操训练"
 YUN.lategame.055.d: "朱德和他的改革派又向[ROOT.GetLeader]建议发布一份有趣的训示，事关国民革命军基层士兵的野战训练。在这份《加强体力与提高射击技术的训令》中，朱德着眼于提高官兵的体力与射击技术，希望提高二者效能，以弥补国民革命军弹药和火力的不足。改革派一心认为，国民革命军要在敌人跟前生存下来，乃至于击败敌军，就要意识到士兵必须在山路甚至更复杂的地形行军，以机动性来压倒一切敌军。\n\n朱德指出，体力训练和射击训练是军事训练的两大重点，他亲自为所有部队制定了一套锻炼方法，即各式各样的体操。而同时，他还大力举办一系列射击比赛。[ROOT.GetLeader]能理解朱德的雄心壮志，也可以大笔一挥让这一计划实施。然而，现在真的能进行如此广泛的改革计划吗？也可能会在如此关键的时刻影响军队自身的战斗力。难道在国家统一后，裁撤一些冗余部队后再行新法，不是更为可行吗？"
 YUN.lategame.055.a: "培养健强奋勇的官兵乃是第一要务！"
 YUN.lategame.055.b: "推迟到统一后再行打算吧。"
 YUN.lategame.056.t: "淡漠的军国民传统"
 YUN.lategame.056.d: "随着国民党控制领土的扩大，国民革命军也需要不断壮大，因而需要越来越广泛的征募手段。本军招募不能再局限于滇黔本地人，而是要放眼外省。最令人担忧的就是，很多国民革命军的新兵和那些老兵、骨干们的信念与出身都有所不同。在领土的扩张下，国民革命军的一些部分保留了核心的军国民传统，也因此，群众与军队之间产生了隔阂。\n\n然而，在另一个极端，国民革命军犯下了允许目无军纪的大规模游击等错误。这导致了一些部队发展出了不顾国民革命整体利益的个人主义风气。这种自行其是的举动着保留一股草莽作风，倾向于对那些行不义之举的坏分子快意恩仇。民众往往比国民革命军更为激进，他们更希望直接大开杀戒。虽然本军来自群众，却不应该反映农民那种冤冤相报的倾向。\n\n国民革命军中有两派人都认为那些新兵太过嗜杀无情。而这两派人虽然都认为这种行为对于本党本军和民众的形象有所损害，在如何惩罚此类行为上却产生了分歧。军中的激进派提议手下留情，毕竟人民群众在对抗豪强的革命热情中难免会冲昏头脑；而另一派则提议严肃处理，将所有扰乱军纪的人统统拿下，交由军事法庭定夺。"
 YUN.lategame.056.a: "他们只是在革命的热情中有些迷失了。"
 YUN.lategame.056.b: "我们是解放者，不是暴君！"
 YUN.lategame.057.t: "规章纪律"
 YUN.lategame.057.d: "作为军事改革的领头人，朱德向[ROOT.GetLeader]请求制作一本国民革命军的官方手册，再起草制定一系列改革的规章，以作为分发给每位官兵的备忘录。朱德崇尚强大的纪律精神，他称，在战争中总结出的最大经验就是，民众可以用现有的资源来打赢战争。只要有决心，群众就能拿起武器。利用夜间作战、突然袭击，就可以轻易从敌人手中夺取武器。民众以劣势的武器，甚至没有武器也可以参与作战。凭借旺盛的攻击精神，任何武器只要使用得当，都能用来打败敌人。\n\n为此，他的纪律手册着重于向士兵灌输革命精神。只要有着这本小册子加之意志力，战士们无论有没有武器都可以参与到战斗中来。朱德在手册中提出了“国民革命军三大纪律八项规章”，所谓三大纪律指的是：（一）行动听指挥（二）不要群众一针一线（三）打土豪要归公，而八项规章则是：（一）上门板（指宿营时睡老乡的门板走时要上好）（二）说话和气并尽力帮助群众（三）借东西要还（四）损坏东西要赔（五）买卖公平（六）挖茅坑避开房屋，走时填好（七）洗澡避女人（八）不虐待俘虏。\n\n军中各派都各自同意，要全面改善军纪，因此对上述纪律规章都无太大异议。然而，他们实际担心的是朱德在军中日益增长的影响力，害怕他从自己的军中抢走人才，害怕这些人直接听从朱德而非各自指挥官的命令。"
 YUN.lategame.057.a: "批准，我们的士兵要好好学学作战纪律。"
 YUN.lategame.057.b: "别越界了，朱德。"
 YUN.lategame.058.t: "最高指挥部中的分歧"
 YUN.lategame.058.d: "在世界范围内称霸称雄的德国陆军，最善用的就是强调基层官兵主动与独立性的战术，即风靡全球的“任务导向战术”(Auftragstaktik)。而近来国民革命军军官也得到了这样的自主权。在国民革命军行动之前，上级指挥官就会将战斗意图和总体目标传达给下级指挥官；而下级指挥官则灵活地设法达成目标。朱德和一众改革派都认为：“服从命令与机断专行这两件事是不冲突的。决不能把机断专行误认是违抗命令，也不能机械地执行命令，而抛弃机断专行。”\n\n在协调大部队行动时，每支部队接受任务都必须同时了解上级决定背后的意图，以及自己的任务在整个命令中扮演怎样的角色。如果情况有变、与上级的通信切断，他们应该根据之前得到的命令和当下情况自行决断，这不应被视为违抗命令。\n\n然而，也有与朱德思潮不同的思想出现，因为近期出现了军官不顾上级军官对于行动的最佳判断，而自行其是、打乱整体战略部署的现象。这引起了最高指挥部中蒋鼎文、钱大钧、熊式辉等人的担忧，他们害怕自己的队伍中有人借故抗命不从。"
 YUN.lategame.058.a: "军官们有权机断专行。"
 YUN.lategame.058.b: "上面的将军们才能对战局做出更好的判断。"
 YUN.lategame.059.t: "三民主义青年进行曲"
 YUN.lategame.059.d: "随着国民党在全国建立起统治，这个蓬勃发展的党国不仅在试图影响人民的思想，更在试图影响青年的思想。为此，成立“三民主义青年团”（简称“三青团”）的计划正在酝酿之中。该青年组织旨在向中国的下一代推广孙文主义，但随着第二次中日战争爆发，该计划被搁置。但著名音乐家马济霖和阙仲瑶已经共同为三青团起草了一首名为《三民主义青年进行曲》的团歌。\n\n烽火漫天，血腥遍野，中华民族遭受着空前的浩劫。\n我们在苦难中长成，我们在大时代的洪炉里锻炼，成一个革命的青年。\n党的新生，民族的复兴，两种任务已紧紧地压在我们双肩。\n我们誓为主义奋斗，我们誓为革命牺牲，为了抗战只有向前。\n我们的身体，好比钢铁。我们的意志，更比钢铁坚强。\n我们有力要战胜一切，我们有热要熔化一切。\n让我们的鲜血，去把新仇旧恨洗刷个尽绝。\n我们是三民主义的青年，民族的中坚。\n看准敌人，握紧铁拳，踏着先烈的血迹，\n完成抗战大业，光明就在前面，胜利就是——明天。\n\n中华民族正处于一场伟大的斗争当中，民族存亡岌岌可危，但我们所进行的伟大牺牲和斗争是为了现在和未来的一代又一代的中国人，为了他们的希望和梦想。"
 YUN.lategame.059.a: "走向胜利！"
 YUN.lategame.200.t: "华南建设"
 YUN.lategame.200.d.gov: "自护国战争以来，滇军健儿就从来是云南省社会与政府中的翘楚。蔡锷的军事化改革将本省七成的预算都交给了军务，而工业计划与农业改革则很大程度上停滞不前。唐继尧主政时期，曾主持过有限的去军事化，将财政重新用于经济现代化，但军务开支仍占省预算的大头。政府中那些提议仿效广东路线平衡经济的人认为，虽然军事化满足了政府在云南的需要，但长期来看毫无疑问会对中国的经济产生弊端，而云南恰又不如广东富庶，无法双管齐下。那些想要继续推动军事化主导的声音则认为，即便这有百般贻害，那也是以武力终结百年国耻的必要之恶。这是一个争议性的话题，最终自然是[ROOT.GetLeader]拍板定夺。"
 YUN.lategame.200.d.subject: "自护国战争以来，滇军健儿就从来是云南省社会与政府中的翘楚。蔡锷的军事化改革将本省七成的预算都交给了军务，而工业计划与农业改革则很大程度上停滞不前。唐继尧主政时期，曾主持过有限的去军事化，将财政重新用于经济现代化，但军务开支仍占省预算的大头。政府中那些提议仿效广东路线平衡经济的人认为，虽然军事化满足了政府在云南的需要，但长期来看毫无疑问会对中国的经济产生弊端，而云南恰又不如广东富庶，无法双管齐下。而随着昆明军校（云南讲武堂）一派的愿景失势，军事化倡导者也失去了基础，预计[ROOT.GetLeader]将会宣布军事化政策的转向。"
 YUN.lategame.200.a: "军事化仍是第一要务。"
 YUN.lategame.200.b: "我们需要平衡经济。"
 YUN.lategame.201.t: "滇军现状"
 YUN.lategame.201.d: "蔡锷曾在大名鼎鼎的昆明军校（云南陆军讲武学校）从教，一生都献给了军旅生涯。朱德在内的许多革命英雄都师从蔡锷。孙中山的二次革命失败后，蔡锷被软禁在北京，同侪唐继尧则接替他做了云南督军。后来袁世凯复辟帝制的野心路人皆知，蔡锷便逃回了云南，和唐继尧一道发动了护国战争，护国军也因此成立。\n\n袁世凯死后，蔡锷依然以巨大开销维持着滇军，这让他得以入侵四川，又反过来以当地资源减轻了滇军的负但。蔡松坡虽不幸病故，但他却将遗产留给了云南——他留下的军国民传统依然在滇地盛行，而他的英勇事迹也激励着昆明军校的学子们。"
 YUN.lategame.201.a: "我们要效仿松坡将军的榜样！"
 YUN.lategame.201.b: "蔡氏不过歧路英雄耳。"
 YUN.lategame.202.t: "商贾之怒"
 YUN.lategame.202.d: "同云南一样，士绅与商贾在广东省同样颇具影响力。为了在不冒犯这些权贵的情况下开展改革，陈炯明曾与陈廉伯及其商团结盟，这也让农民倒向了国民党。广州国民政府在德国的干涉下崩溃后，广东便被几股势力所瓜分。\n\n受北京支持的沈鸿英控制了粤北地区，而陈廉伯的商团则控制了广州及周遭，邓本殷则虎踞琼崖。这一状况直至滇军入粤、华南四省尽归一个政权之下才告终结。\n\n[ROOT.GetLeader]认为应该削减商人特权，将经济置于临时政府的监督下。毫不意外，商团对于新加的掣肘百般抗议，局势一度紧张，连军队也不得不去维持秩序。目前的情况无异于1925年的广东国民党，商团也别无他法，只能祈祷[ROOT.GetLeader]落得蒋介石一般的下场。"
 YUN.lategame.202.a: "故而必须慎之又慎……"
 YUN.lategame.202.b: "这些高高在上的资本家！"
 YUN.lategame.203.t: "兄弟省份"
 YUN.lategame.203.d: "广西夹在滇、粤两省之间，与西部的邻省云南一样有着相似的特点与丰富的历史。多山的地形使其与云南一样孕育出了独特的文化。但同样，自然风光的秀美伴随的却是经济的窘迫——滇、桂两省都是中国数一数二的贫穷省。\n\n这个多山而赤贫的省份也恰是政治激进主义的温床，太平天国运动就发祥于此。进入20世纪后，广西便成为了中国首屈一指的共和省份，与其他南方省份一样投入了辛亥革命中。陆荣廷的旧桂系和云南的蔡锷雄心十分相似，他将广西的军事化水平建设得可以比肩云南。\n\n陆荣廷下野之后，新桂系短暂地控制了广西，他们雄心勃勃的建设计划尝试为该省带来现代化、工业化，同时维持省内的军事化政策。主政广西的一批人最终还是因为太过保守、缺乏意愿而没有进行真正的改革，最后问题便留待[ROOT.GetLeader]解决——他会改革广西的经济现状，乃至一扫其过去的军国民旧俗吗？"
 YUN.lategame.203.a: "广西应当走向繁荣！"
 YUN.lategame.203.b: "广西的军国民主义自有其存在价值。"
 YUN.lategame.204.t: "双管齐下之策难以为继"
 YUN.lategame.204.d: "虽然云南是中国数一数二的穷省，但其主政者却都颇有雄心壮志。当袁世凯复辟帝制时，蔡锷和唐继尧充当了共和政府的先驱，也正是滇系护国军在四川大败北洋军，挫败了袁氏的帝制野心。蔡锷的军国民构想令他不断推进云南军事化，使其能与环伺之邻省分庭抗礼。\n\n蔡锷过世后，唐继尧对于一统中国的雄心同样基于军事化之上，认为中华联省也需要一支强大的武装来对抗外国威胁与帝国主义。但他意识到了云南窘迫的经济状况，遂执行了部分去军事化措施，可军国民构想仍然让这类改革没有一以贯之。这一状况直至近日才有所转变——省主席[ROOT.GetLeader]宣布要进行彻底的经济再平衡和政府去军事化。"
 YUN.lategame.204.a: "省主席，不能再端水了。"
 YUN.lategame.205.t: "国际贸易"
 YUN.lategame.205.d: "历史上，中国长期就是世界渴望的异域商品出口地。早在罗马时代，汉朝就生产丝绸，同时保护其生产秘诀不得外泄。在这样的跨国贸易鼎盛的时期，丝绸之路也随之繁荣，而中亚城市作为贸易的中转站，也成为了热门的目的地。中国长期保持着这样的地位，直到19世纪英国叩开了国门，以鸦片扭转了贸易顺差。\n\n中国各地都被帝国主义列强瓜分，而资源也自然被他们随意开采、销售。在许多地方，中国企业都无法参与到国际贸易中去，因为西方和日本公司已经做了中间商，将这些商品卖给各自市场的消费者。这一情况也使得云南经济委员会将发展当地企业、结束外国经济霸权作为第一要务。\n\n虽然在省级层面上能做的工作有限，但华南的贸易逆差确实在对德企、德资采矿活动的经济依赖减少后得以逆转，而更多的财富则流回了中国，回到了当地企业手中。来自云南的贸易收入增加，加之广州通商体系的顺差也带来了国家收入的提高，[ROOT.GetLeader]政府中的许多人已经开始规划这笔营收的用途。"
 YUN.lategame.205.a: "支持国货，富足的时代来临了！"
 YUN.lategame.205.b: "钱货财物，无不要投入战争中。"
 YUN.lategame.206.t: "省际贸易"
 YUN.lategame.206.d: "尽管中国的国际贸易时常潮涨潮落，但这并不意味着在闭关锁国时期，贸易就停止了。中国幅员辽阔、地大物博，各省富含的资源各不相同，因此省际壁垒与国际壁垒之间分别不大。\n\n譬如说北方适合种小麦，而南方的气候则更适宜水稻。若是具体到某一地区，如云南就在传统上以其玉石闻名，而玉石又可以远销华北，尤其是北京这样的繁华都市。当帝国主义列强试图打开国门进行贸易时，千百年来存续的省际贸易并未消失。并且在国际贸易已经被视为剥削源头的情况下，省际贸易愈发兴盛。\n\n云南经济委员会不仅在力图平衡与西方列强的贸易，也在开放各省之经济，使之进一步整合。过去，云南的锡矿销往河内，而法国人则充当中间商与消费者；如今这些资源则向东销往广州，而广州通商体系将会确保财富流向中国人手中。纵使这只是省级层面，但[ROOT.GetLeader]却有信心，这将会成为全国进步的方向。"
 YUN.lategame.206.a: "中华儿女一条心！"
 YUN.lategame.206.b: "呸，广东佬和德国佬都是小偷！"
 YUN.lategame.207.t: "中国社会的基石"
 YUN.lategame.207.d: "中华大地都是炎黄子孙，有着五千年的悠久历史。中华文明起源于黄河，发扬于中原，北起黄河、南至长江。由于身处两大河系之间，华夏祖先自古便善于农耕，代代相传直至今日。暂不论好坏，至少在欧美工业奇迹层出不穷之当下，中国人仍然极大规模地身在农业社会中。\n\n很多人认为，即使中国人沿着西方路线实现现代化、工业化，中原之地也无非是运用现代的科学技术来进行农耕。因此，农业与土地改革长期都是中国现代化的重中之重。而中国的农业社会历来不公，同样延续至今——一小部分地主有着大部分土地，而占大多数的农民只能保有余下的土地。\n\n更激进的思想家则认为，中国政府应当践行“耕者有其田”的平均地权思想，这才是对农民的公正回报。而较为温和的改良派则认为，延续晚清以来的稳健改革可以在提高社会流动性、实现现代化的情况下不造成强力打击地主乡绅带来的混乱动荡。不过最后拍板敲定方案的自然是[ROOT.GetLeader]。"
 YUN.lategame.207.a: "国民革命的目的就是平均地权。"
 YUN.lategame.207.b: "云南模式的改革才是我们要效仿的。"
 YUN.lategame.208.t: "耕者有其田"
 YUN.lategame.208.d: "国民党是个革命的共和政党，长期以来自视为反抗北京暴政与清廷腐朽之代表，这一点与太平天国运动一脉相承。袁世凯北洋集团与清朝之腐败亦一脉相承，于是，国民党便投身于推翻北洋政府、建立由孙中山及其革命同志所领导的“真正的现代民国”的使命。\n\n南北冲突在北伐之中达到高潮，而国民党的梦想也跌个粉碎。撤退至贵州的国民党残部排除万难，恢复了云南的秩序，为国民革命向全中国进发走出了第一步。尽管革命尚未成功，但[ROOT.GetLeader]委员长已经准备好了从省级层面上解放民众，作为将来登上全国舞台的政治实验。\n\n鉴于农业在中国社会的核心地位，农业改革被委员长提上日程也不足为奇。对陈立夫和CC系来说，国民党必须组建几个关键部委，包括但不限于经济委员会、内政部和财政部，以便为各省因地制宜地提供指导。这种官僚作派得到了戴季陶的支持，也引来了蓝衣社的反对。\n\n在滕杰、周复等蓝衣社理论家的眼中，中国农村经济衰退的原因在于繁重的土地税与地租、不规律的土地评估、苛捐杂税以及农民积极性与进取精神的丧失。黄埔系的新星、土木系这一小派系的领袖陈诚则结合了两种方案，以农村群众为工作重心，与搜刮民脂民膏的现象斗争，以货物的公共分配来对抗中国的通胀。本党如今举棋不定，唯有委员长可以为土改政策拍板。"
 YUN.lategame.208.a: "农民的解放要靠革命的官员！"
 YUN.lategame.208.b: "以农村群众为重！"
 YUN.lategame.209.t: "三角贸易"
 YUN.lategame.209.d: "明朝复辟了汉人统治之后，中国变得愈发内向，闭关锁国一度成为了国策。满清代明之后，闭关锁国政策得到了延续，对外贸易被局限于广州一口，而所谓的“一口通商”（广州通商体系）为外国带来大量贸易逆差。英国人决定向中国走私鸦片，以补偿从中国进口的茶叶导致的贸易逆差。鸦片很快便风靡中国，以至于中国的白银大量外流，遍地都是瘾君子。\n\n中国皇帝试图打击鸦片走私，由此引发了鸦片战争，而战败打破了“天朝上国”的美梦，开启了中国的屈辱史。之后鸦片走私加剧，进而国产土烟泛滥，鸦片出口甚至成为了云南的支柱经济。三角贸易随之出现：云南的鸦片被运到武汉出售，所得的利润则被带到广州和越南东京，以向西方列强购买棉花和纱线。蔡锷和唐继尧掌管云南期间都曾试图遏制鸦片，但由此导致的现金匮乏严重损害了省政府的利益。\n\n昆明政府并不倾向于参与农村建设，但财政部试图出售昆明周边城镇粮仓的存粮，因为那时，云南的匪患与特别是广西和四川相比已大体平息。如今国民党掌权并再度执行了罂粟禁令，但困扰唐继尧和蔡锷的问题仍然存在：自罂粟禁令颁布以来，云南省的税收大幅下降。许多人怀疑是否应该改为征收鸦片税，并将鸦片禁令留待未来再去实施。但政府中的高级官员坚持认为，革命的中国不能允许鸦片的存在，而云南当领全国之先。"
 YUN.lategame.209.a: "鸦片流毒深远，必须铲除。"
 YUN.lategame.210.t: "延续改革"
 YUN.lategame.210.d: "清朝末年，在义和团运动爆发后，政府开始推行着史无前例的政治经济现代化。在云南，云贵总督李经羲承担着一项重大的任务，即在全省推行集权，使经济现代化、打破洋人垄断。李总督的改革在士绅的阻挠下寸步难行，最终在辛亥革命中彻底流产。继他之后，便是同情革命的新军军人，蔡锷与唐继尧。\n\n蔡锷和唐继尧都以改良的方式来统治云南，但军事至上、贫困、鸦片烟、当地士绅和军阀混战等种种因素又让重大改革处处受阻。尽管如此，昆明方面的改革势头依然强劲高涨。在解决军事问题后，昆明政府便立刻将注意转向农业改革与现代化的任务。人们暗暗相信，李经羲所开启的改革，会在[ROOT.GetLeader]的手下自然地收尾。"
 YUN.lategame.210.a: "该到收尾阶段了。"
 YUN.lategame.211.t: "鸦片之问"
 YUN.lategame.211.d: "鸦片战争后，鸦片贸易和罂粟种植就愈发猖獗，在云南经济中占据着主导地位。三角贸易随之出现：云南的鸦片被运到武汉出售，所得的利润则被带到广州和越南东京，以向西方列强购买棉花和纱线。云贵总督李经羲试图集中鸦片税，而蔡锷与唐继尧则力主禁烟。唐继尧发动群众运动，包括讲座、手册、公共集会与禁烟歌曲来宣传禁烟。他还尝试对每亩罂粟田征以三元罚款。\n\n唐继尧希望腾出更多土地来种植粮食，但政府却无力在昆明之外推行这一措施，故而他们决定不在昆明以南实行处罚，避免造成动乱，扰乱滇越铁路的运作。实际操作中，禁烟处罚不仅没有减少鸦片的种植、吸食，反倒损害了农村利益，逼人落草为寇。尽管禁烟是经济改革的措施之一，但许多人都呼吁将其取消，与其做无用功夫，倒不如把这些收入拿来为其他地方建设现代化。"
 YUN.lategame.211.a: "禁烟功在当代，利在千秋。"
 YUN.lategame.211.b: "鸦片战争以来大势未必好转，禁烟之举亦不利于我……"
 YUN.lategame.212.t: "论民生"
 YUN.lategame.212.d: "戴季陶是国民党政治理论家中的翘楚，对于中国经济形势的思考带着无限的雄心壮志与革命热情。他曾是左派鼓动家，但在认识到这些巴黎走狗对待中国社会的崇洋媚外本质后，便迅速倒向了新右派，并以纯粹不羁的中国式理解来诠释孙文主义。与那些为了国际主义社会主义事业而背叛中国革命的左派不同，戴季陶对国民党的愿景是纯粹忠于中华民族的。\n\n与那些满口官腔、陈词滥调而脱离群众的自由派也不同，戴季陶明白，中国各阶级的解放乃是首要任务。然而，中国的阶级不该被作为互相斗争的工具；不，中国的各阶级都是更大社会机体的一部分。为了实现这种伟大的和谐大同，戴季陶认为革命的运动家应当有着这样的纪律：推进涵盖各阶级的国民党单一愿景，以民族复兴事业为重中之重。\n\n赤色分子鼓动的颓废享乐、无政府主义在中国革命中并没有立足之地，民众也不该受这种声音的蛊惑而走上歧途。不，民众是强大而深不可测的力量，必须由一支纪律严明的革命卫队来带领他们走向辉煌——而领头者正是国民党，只有本党可以带民众迈向中国的新曙光。\n\n诸如雇佣劳动、剩余价值这样的概念与中华民族是毫无瓜葛的，毕竟在中原王朝，劳动是一件贯穿古今的大事。因此，国民革命将会把各阶级团结成统一的生产机器，一面带来高度的发展、合作与繁荣；另一面，中国人也可以通过自己的劳动实现普遍的民生——这便是各民族的愿景。"
 YUN.lategame.212.a: "改善民生！"
 YUN.lategame.213.t: "国民党十年建设"
 YUN.lategame.213.d: "中国大部分地区已在国民党的旗帜下实现统一。农民不会再被迫过着战火不息的动荡生活。中国的工业水平正一天天实现现代化，并逐渐接近西方列强的水平。今天的中国比起袁世凯留下的中国已有了突飞猛进的发展。孙中山先生那建立强大且公平之中华民国的梦想即将实现。民国治下的自由省份正享受着经济一体化、交通现代化的福利，民族资本在政府的公正监督下蓬勃发展。西方列强不能再享受十年前在东方所拥有的那些特权。劳动群众则发现自己因纪律严明的中国革命而重新焕发了活力。那些曾经误入社会主义歧途的劳工领袖们，终于抛弃了暴民心态，引导工人走向发展事业。当然，我们还有很多工作要做。全面土地改革仍遥遥无期，军事统一更是当务之急，内陆的许多地区仍在军阀的统治之下。无论如何，国民革命才刚刚开始，从哈尔滨到大理，从台北到迪化，白日即将照耀这片大地！"
 YUN.lategame.213.a: "中华民国万岁！"
 YUN.lategame.400.t: "北伐大捷"
 YUN.lategame.400.d: "随着枪炮声终于平息，青天白日满地红旗职飘扬在了紫禁城和国会上空。五色旗和十二章国徽等北洋政府遗物被扯下，士兵们在城中大街小巷散发着传单，以纪念先总理愿望得到实现。\n\n兄弟阋墙手足相残真的是必要的吗？本党一向主张以和平方式建立一个统一政府。一方面，中华民国政府应由中国人自己建立；另一方面，民生多艰，中国人民承受不起内乱。因此先总理孙中山先生北上后，立即号召全国召开国民会议，共同解决时局。谁知国贼段祺瑞心口不一，对举行国民会议的号召阳奉阴违，而在帝国主义者的煽动下，那些军阀表现得愈发有恃无恐。\n\n本党不得不为民请命，以救国锄奸，我们不计成败，不惜牺牲，为实现总理遗教尽了神圣的义务。而举国上下那些支持本党的主义和纲领的人民，将继续支持本党在新时代要扮演的革命角色。国民革命的成功就在眼前了。"
 YUN.lategame.400.a: "统一政府万岁！"
 YUN.lategame.400.b: "国民革命成功万岁！"
 YUN.lategame.400.c: "中国人民的自由与解放万岁！"
 YUN.lategame.400.e: "国民革命军万岁！"
 YUN.lategame.401.t: "中央委员会内的不和"
 YUN.lategame.401.d: "国民革命军能在北伐战争中战胜对手，何应钦委员长功不可没，但人们对他身为国府主席的权力愈发感到不安。反对他的呼声愈演愈烈，战场上的胜利也并非总是能平息人们对他的领导的不满。\n\n某次，胡汉民和中央执行委员会开会批准了一项提案，陈立夫却说“需待委员长定夺”。但开会之时，何应钦正在最前线。委员会怒不可遏，以至于胡汉民还没来得及开口，另一个委员就说：“既然信不过党的决定，何必还要开会讨论？”\n\n若是在以往，何应钦总能凭借对自己执政联盟的掌控避免批评，但如今他的掌控也开始动摇。虽然迄今为止，行政院长戴季陶和副院长张群一直忠于国家并通常可以相互制衡，但这二人也对军官主导政府地位的现状存在异议——他们希望能在保留何应钦的主席职务的同时，确保过渡到更加文官统治的政府。而在国民革命军内部，陈诚和滕杰各自领导的派系也一直存在着异议，他们认为何应钦将军的统治过于保守，革命进展得还不够快。\n\n围绕着对行政方向和民主化的诉求、以及对外部威胁的担忧，国民党内已开始分裂。何应钦提出了解决方案，在一些党内派系的压力下，他提议起草一部《训政时期约法》。尽管这部临时宪法的细节仍在争论中，但他还是紧急召开了国民党全国代表大会，以最终敲定这些细节。"
 YUN.lategame.401.a: "这么做能解决本党的困境吗？"
 YUN.lategame.402.t: "胡汉民谴责[GetYear]年约法"
 YUN.lategame.402.d.intro: "胡汉民是先总理最顽固而正统的门徒，也是《训政时期约法》最强烈的反对者。根据孙中山的建国三阶段理论，只有训政结束之时，由中国各党派组成的国民大会才可以起草宪法，为宪政阶段做准备。因此，如果这么做了，“那岂不是要把总理的遗教一齐搁开，另寻一个所谓约法出来吗？”\n\n《训政时期约法》具体内容被公布后，批评声四起。这部《训政时期约法》很大程度上只是重申了那些既定事实——党国和训政被正式写入法律；孙中山的三民主义、五权宪法理念被再度重申；除经济事务外，中央政府和地方政府的权限划分将得到政府的尊重；国家建设委员会将执行孙中山先生的议程。但这部宪法的起草过于草率，且明显对人权缺乏保护：除了宗教自由之外的各种个人自由都可依法律随意停止或限制，因而其引起了许多党内温和派和党外自由派人士的批评。\n\n作为一名坚定的民主集中制拥护者，胡汉民绝不会支持任何试图直接分裂党的行动。但现在他一直等待的时刻终于来了。"
 YUN.lategame.402.closer: "胡汉民已开始公开活动，试图阻止《训政时期约法》通过，并要求何应钦辞职。他迅速聚集了包括众多政要、军阀和知识分子在内的一大批追随者，据说这些人秘密成立了“党权运动总联盟”，要求何应钦下台。"
 YUN.lategame.402.d.JapanIsDead: "$YUN.lategame.402.d.intro$而且随着日本的威胁消除，何应钦也已经没有借口再去维持一个军政府。\n\n$YUN.lategame.402.closer$"
 YUN.lategame.402.d.IsAtWar: "$YUN.lategame.402.d.intro$而且由于国家仍处于战争状态，何应钦的提议饱受指责与争议，委员长的处境依然岌岌可危。\n\n$YUN.lategame.402.closer$"
 YUN.lategame.402.d.IsAtPeace: "$YUN.lategame.402.d.intro$而且随着国家终于从战争的混乱中得到短暂的喘息，越来越多的人愿意呼吁变革。\n\n$YUN.lategame.402.closer$"
 YUN.lategame.402.a: "抵制此种暴政，捍卫总理遗教！"
 YUN.lategame.402.b: "一群可耻叛徒，必须付出代价！"
 YUN.lategame.403.t: "《训政时期约法》辩论"
 YUN.lategame.403.d: "随着全国代表大会中的辩论持续，各派系人物在为期数天的会议中先后发表了看法。据说，行政院副院长张群是该提案最热情的支持者之一。他的敌人声称，张群曾说过“黄埔系有枪炮做后盾，CC系有群众做基础，政学系看似威风，实则一无所有。”尽管这句话的真实性存在争议，但显而易见的是，在杂乱无章的党国过渡到更正式的政府的过程中，政学系的收益是最大的。\n\n他们与许多同样呼吁制定临时宪法的左派、自由派和地方派组成了奇怪的同盟。他们声称制定《训政时期约法》将以牺牲国民党为代价提升人民的权力，并使成立一个更多元化的政府成为可能。当然，这一提议遭到了胡汉民和许多莫斯科委员会内派系的坚决反对，这些人把持着党务，若是临时宪法通过，他们的损失是最大的。\n\n戴季陶和CC系的态度则更为矛盾。陈立夫曾公开表示，现在讨论过渡还为时过早，宪法也并非必需品。CC系认为精诚团结是当务之急。但另一方面，他们也不愿对主席采取强硬立场，并且在推动黄埔系和莫斯科派之间达成妥协。"
 YUN.lategame.403.a: "《约法》将保证自由与稳定！"
 YUN.lategame.403.b: "《约法》完全是场闹剧，其下是赤裸裸的独裁！"
 YUN.lategame.403.c: "我们应想办法寻求一个合理的解决方案。"
 YUN.lategame.404.t: "军方对[GetYear]年约法的权衡"
 YUN.lategame.404.d: "尽管有人把新约法称为“委座约法”或是“黄埔约法”，但国民革命军内部对这部约法的分歧比外人眼中的却大得多。虽然黄埔系元老派大多站在何应钦一侧，但少壮派则提出了一些异议，大多黄埔本流军官都不得不选边站队。\n\n刘健群在《社会新闻》上撰文的措辞称得上谨慎，他认为国家民粹主义者首要原则“为强国的国民组织，与强国的政府建设。”刘健群称，“委员会制最大的缺点，就是大家互相推诿，互相责难，结果分散了党的力量。”“在革命的改造中，没有人肯负责任。”“一会起来，就是争执，内乱次数之多，几乎与会议次数为正比例。”尽管他小心翼翼地不和上峰的约法内容唱对台戏，但众所周知蓝衣社是厌恶以宪法制衡政府这类理念的。\n\n陈诚和土木系也不愿得罪上峰，故而在公开场合言辞同样审慎。他们与其他许多左派一样，虽然很吃宪法和公共问责这一套，但却对政学系抱有怀疑，且担心党偏离了长期坚持的正统路线。"
 YUN.lategame.404.a: "我们相信何应钦，也相信他的宪法。"
 YUN.lategame.404.b: "我们什么时候才能懂得力行的必要性？"
 YUN.lategame.404.c: "这部宪法到底会缔造和平还是带来更多的战争？"
 YUN.lategame.405.t: "何应钦计划自我政变！"
 YUN.lategame.405.d: "《训政时期约法》的内容已经敲定，最后一步就是交由全国数百名代表组成的国民会议批准。这些席位不仅分配给各省和城市，还分配给专业团体、工会、农会、商会、教育协会、海外华人社区和党内官员等。鉴于目前的情况，这样的安排并非易事——那些未被国民党当局控制地区的代表席位实际上是由党任命的，并成为了党的代表。\n\n反对派不断壮大，胡汉民带头冲锋，人们开始担心《训政时期约法》将无法获得通过所需的三分之二多数票。胡汉民作为立法院长对程序有很大的影响力，即使CC系和政学系使出浑身解数，并充分利用党的力量，也不能保证投票结果会对他们有利。在听取了陈氏兄弟及其党鞭的意见后，戴季陶强烈反对继续推进提案。\n\n但从何委员长的角度来看，现在反对已经太迟了。这次投票越来越成为一次对何应钦领导权本身的全民公投。而南方领导人日益叛乱的威胁和侮辱，更使何应钦下定了决心。他计划在两个月后国民会议召开之前，逮捕胡汉民这个刺头，并瓦解拥胡武装阴谋团体。他计划迅速采取行动以打消党内反对派的气焰。\n\n作为《训政时期约法》的主要设计者之一，张群对这一提议让他感到不安。同样，陈诚及其盟友也对如此重大而危险的行动表示了担忧。但对于滕杰和其他许多对党国的笨拙低效感到不满的人而言，这正是关键一步。"
 YUN.lategame.405.a: "孔子之于少正卯，孔明之于马谡，其皆迫于责任乎？"
 YUN.lategame.406.t: "何应钦砥砺前行！"
 YUN.lategame.406.d: "政变进行得很顺利。何应钦邀请党内主要领导人去参加晚宴，胡汉民抵达后，委员长的警卫立即解除了胡汉民手下的武装，并将他和其他莫斯科委员会主要成员拘留。在一家旅馆的房间里，胡汉民被指控犯有多项罪行，包括密谋刺杀国府主席、推翻政府、阻挠临时宪法通过以妨碍行政等。\n\n其他地方的国民革命军部队也迅速采取行动，控制了南方各省份并消除了国民党腹地中的潜在威胁。尽管遇到了一些零星抵抗，但大部分抵抗势力都被黄埔系领导的部队一扫而空，几个小时后，全国就已牢牢在握。\n\n委员长在国民会议中宣布胡汉民因“健康状况不佳”选择辞职。尽管进行了书报审查，但胡汉民命运的真相还是慢慢浮出水面，可大多数人都选择了对此保持低调。最终所有对《训政时期约法》的反对声都默默地消失了。在戴季陶和张群的指导下，约法接受了审议并被最终通过，现在全党将团结一致地支持他们无可争议的领袖。\n\n委员长的冒险终于获得了回报：胡汉民被软禁，反对势力彻底瓦解，南方各省都被安插了忠诚的省主席，广东则处于直接军事统治之下。国家虽然一度动摇，但最终选择了顺从。如今的何应钦被赋予了非凡的权力，问题是他要如何使用这一权力？哪位副手最终能赢得他的青睐？"
 YUN.lategame.406.a: "只留下真正的爱国者！"
 YUN.lategame.406.b: "必须清洗不忠的党员！"
 YUN.lategame.406.c: "我们要开始治愈伤口。"
 YUN.lategame.406.e: "委员长要扫清反对派。"
 YUN.lategame.407.t: "《训政时期约法》辩论"
 YUN.lategame.407.d: "随着国民革命军进驻北京郊区，中国越来越接近统一，但国民党内部却越来越分裂。国民党左右两派分裂的家丑早已人尽皆知，但右派内部也长期分裂，形成了支持胡汉民的“旧右派”和支持蒋介石的“新右派”两大派系，互相争权夺利。\n\n《训政时期约法》问题现在成为党内争论的主要焦点。胡汉民及其追随者从意识形态角度谴责了这部临时宪法，他们认为受人尊敬的国民党总理孙中山先生早就规定，训政结束之前不得制定宪法。但何应钦主席和许多其他知识分子认为，起草一部临时宪法可以增加问责机制，为训政建立更加制度化的框架。\n\n党内已经围绕着这一问题开始党同伐异，何主席已下令在两个月内召开由全国各地的代表组成的国民会议，就该提案进行表决。但有关可能发生暴力事件的谣言四起，人们开始相信，此事将成为针对何应钦本人领导能力的一次公投。\n\n反对派则自称是“党权运动总联盟”，并向全国各地的地方派系发出试探性邀请，希望得到我们的支持，共同反对《训政时期约法》。但他们没有明说的是，支持他们就是在表示对何应钦独裁统治的反对，并使何主席把矛头指向我们。"
 YUN.lategame.407.a: "[ROOT.GetLeader]反对暴政！"
 YUN.lategame.407.b: "[ROOT.GetLeader]顺从主席。"
 YUN.lategame.408.t: "[FROM.GetName]反对约法！"
 YUN.lategame.408.d: "党权运动总联盟一直在全国范围内寻找盟友，毫不奇怪，有许多投机的地方军阀都加入了他们。[FROM.GetLeader]在他位于[FROM.Capital.GetCapitalVictoryPointName]的大本营内发表讲话，谴责起草《训政时期约法》是违背了总理遗教，他的说辞与那些党内反对派如出一辙。他还发誓要利用自己在[FROM.GetAdjective]代表中的影响力，在即将召开的国民会议中推动否决该提案。\n\n尽管他并未明言，但他现在已坚定地站在那些试图罢免何应钦的人的阵营中，使更多的军阀军队加入了潜在的反何联盟。我们虽然已来不及阻止[FROM.GetLeader]提升其在全国范围内的声望，但还是可以通过暗杀、贿赂和审查等各种不太正当的手段来阻止他对党内造成更大影响。"
 YUN.lategame.408.a: "党权运动总联盟日益壮大。"
 YUN.lategame.408.b: "必须阻止[FROM.GetAdjective]的干涉。"
 YUN.lategame.409.t: "[FROM.GetName]屈从于我们的权威"
 YUN.lategame.409.d: "党权运动总联盟一直在全国范围内寻找盟友，试图从地方军阀中吸纳投机分子。但并非每一位省主席都是好忽悠的。[FROM.GetLeader]从[FROM.Capital.GetCapitalVictoryPointName]向我们发来电报，保证自己会继续效忠何应钦。\n\n我们只能猜测他这么做的动机。也许他是害怕权力不断增长的中央军，又或者他依赖中央政府的补贴来维持自己的权威。再或者，他可能是担心帝国主义列强的外部威胁，又或者……没准他是真的很关心国民团结和党的命运。无论如何，他的输诚都打击了胡汉民颠覆主席的企图。"
 YUN.lategame.409.a: "务实主义让他们选择去维持现状。"
 YUN.lategame.409.b: "理想主义维系着我们党国的团结。"
 YUN.lategame.410.t: "胡汉民被逮捕！"
 YUN.lategame.410.d.intro: "胡汉民危机始于一场晚宴。在国民会议召开前夕，党内主要官员接到通知要去赴宴，但胡汉民兴冲冲地刚走进宴会厅，就遭到了逮捕。胡汉民被指控犯有多项罪行，包括密谋刺杀主席、推翻政府、阻挠《训政时期约法》通过以破坏行政等。\n\n胡汉民被迫提交了辞呈，声称自己因身体衰弱，所有职务概行辞去，但有关胡汉民之命运的消息迅速传遍了全国。何应钦笨拙地试图“澄清”事实，宣称胡汉民是在得知《训政时期约法》将违背自己意愿而通过后自愿选择辞职的，但这种说法很快便沦为了笑柄。"
 YUN.lategame.410.d.HighZeal: "$YUN.lategame.410.d.intro$\n\n国民革命军试图镇压南方军阀，却在民众的抗议浪潮中失败了。民众群情激昂，全国各地的抗议者纷纷走上街头。报纸也视审查于无物，不断发表反对何应钦的社论。就连党内干部都威胁要集体辞职，更令人担忧的是，许多部门拒绝服从进一步的命令。\n\nCC系和土木系中的狂热分子被激怒了，以莫斯科委员会为主导的司法院正式要求释放胡汉民。而与此同时，政学系人员不断叛逃，实力大减，而蓝衣社则被视作是何委员长暴行的白手套而名声受损。\n\n讽刺的是，何应钦的支持者和反对者在一件事上达成了一致：胡汉民的健康状况可能正在恶化。胡汉民先是被关押在一家以关押政治犯而闻名的酒店中，后来又被关押在空气流通不畅的胡汉民寓所中，危机带来的压力更是使他血压飙升到了危险水平。胡汉民拒绝接受何应钦将军派来的医生的治疗，他的同情者则被警卫们拒之门外，许多人担心，随着危机不断发酵，胡汉民的生命安全将难保无虞。"
 YUN.lategame.410.d.LowZeal: "$YUN.lategame.410.d.intro$\n\n全国各地的党支部纷纷发来电报，要求中央作出答复。国民党运动中逐渐萌生的悲观情绪早已引人注意，但很少有人能预测到，由此产生的愤怒和幻灭感会如此之强烈。被派去镇压南方异见人士的士兵要么在抗议声浪中退散，要么直接开了小差。显然就连党和军队都对何应钦的领导失去了信心，并对何应钦政权的腐败、残暴和独裁感到愤怒。\n\nCC系和土木系瞬间沦为了空架子，其成员要么因厌恶政府而叛逃，要么转向了激进道路，要么干脆和政府中无处不在的腐败同流合污。而随着危机爆发，围绕着《训政时期约法》的辩论也成为了国家政治的焦点：人们开始围绕着通过或否决这部临时宪法站队，使得政学系技官派和蓝衣社极端分子的势力大大增强。\n\n国民会议预计仍将按计划在未来几天后召开，但随着国家陷入危机，许多人都担心是否会爆发内战。社会已严重撕裂，举国上下只能屏息以待。"
 YUN.lategame.410.a: "共同的信心让我们战胜困难！"
 YUN.lategame.410.b: "社会中弥漫着的悲观思想爆发了。"
 YUN.lategame.411.t: "大厦将倾"
 YUN.lategame.411.d: "随着人们的恐慌情绪愈演愈烈，中央执行委员会的忠诚度也开始动摇。许多党权运动总联盟成员为了不被逮捕，纷纷转投支持何应钦的阵营。但罢黜何应钦的行动也愈发激进，莫斯科委员会中的四位元老邹鲁、古应芬、萧佛成和林森（即国民党中央监察委员会的约三分之一成员）联名通电弹劾何应钦。他们提出了何应钦的六大罪状：\n\n其一，以国民党为其私有；\n其二，放任社会主义者做大；\n其三，怂恿陈果夫等小人到处活动；\n其四，任用孔祥熙之辈，使其富如王侯；\n其五，任用杨永泰、章士钊等旧官僚军阀；\n其六，违法逮捕胡汉民、许崇智、居正等人。\n\n双方争论的焦点不仅是何应钦的违法叛党行为，还有他行政不力等罪行。许多人指责何应钦试图将国民政府主席一职（在孙中山的设计中，这只是议会主席式的职位）变成个人的独裁工具，何应钦将军则试图在公开演讲中反驳这一观点，指出国民会议只是在起草临时宪法，而不是扩大主席权力。\n\n众怒丝毫没有减弱的迹象，何应钦发现自己正越来越被孤立。今晨，他收到了戴季陶请辞行政院长一职的通知。明显眼下的情况已无法维持下去了。于是他孤注一掷，决定与戴季陶一起“为国民团结”而提出辞职下野，并提名张群和陈果夫来“监督过渡”。何应钦的算盘是：他指望反对派组建的新一届国民政府委员会（内阁）过于软弱，难以控制朝纲、长期执政，倘若果真如此，便能证明了他的观点：他的强硬手段对于维持政权运转必不可少。"
 YUN.lategame.411.a: "离了何委员长，国家还能转吗？"
 YUN.lategame.412.t: "张群铤而走险"
 YUN.lategame.412.d: "由于何应钦和戴季陶（至少暂时）遁出舞台，惊慌失措的中央执行委员会通过了对军政部长张群的国府主席任命。而这位上任的张主席远比众人所想的要开放自由，他上任的第一把火就是任命杨永泰取代陈果夫做了行政院长。\n\n战战兢兢的中央执行委员会过去数年中从来都是国府主席的提线木偶，如今也只得七手八脚地通过了任命。张、杨政府迅速通过了任命，让一帮支持自己的政学系智囊进入了国民政府委员会（内阁），以排挤CC系里的对手。同时，张群还召集国民革命军中与自己交好的军官，如李根源、赖世璜与熊式辉等，将军队也置于自己的掌控之下。\n\n张群在国民会议前匆匆做了一系列公开讲话，以图巩固自身地位。他强调要与华南政务委员会谈判，并重申政学系是希望通过《训政时期约法》的。考虑这两个问题的严肃性，加之他本人也没有明确提出可行方案，这似乎有些难以实现。也许他是在铤而走险，赌何应钦的回归（与报复）会促使党内的温和派做出行动——这实在是一步险棋。"
 YUN.lategame.412.a: "政学系再度为权力而周旋起舞。"
 YUN.lategame.413.t: "戴季陶与CC系的密谋"
 YUN.lategame.413.d: "戴季陶几十年来都是国民革命的忠实信徒，同时也极富远见。他正确地预测了蒋介石会在和汪精卫的勾心斗角中丧命，也正确预测了何应钦处理与胡汉民争端的方式势必弄巧成拙。现在，他坚信张群这个最近上位也可能是最没有原则的中国领导人，总有一天会倒台。\n\n而戴季陶则决定成为从中东山再起之人。从历史上看，他更像个衬托的背景，只是本党的管理失当、如今危机的紧迫严重使得他走到了台前。戴季陶下野时机恰到好处，使得他未受胡汉民风波的波及——他不像何应钦将军般自损严重，更因在党内的任职资历而比张群更具法统。据戴季陶自己说，他是唯一一个能弥合躁动的军队与不安分的文官之间的党内分歧，而同时又能坚守孙中山先生之主义的人。\n\n当然，他肯定不是唯一担得起这样评价的人。本党大部分人物向来就算不直接批判内部的非法小团体，也对此事讳莫如深。戴季陶亦然如是。不过不可否认的是，他周围也聚集着由近期失势的陈果夫和其胞弟陈立夫所带头组成的CC系。\n\n陈氏兄弟（也许是CC系名字的来源）致力于筹划协助戴季陶的密谋，即利用他们对议员、党内干部的影响力，策动国民会议否决《训政时期约法》。这将大大打击张群和杨永泰自称所谓能管好本党的宣称，而随后自然而然就可以对他们提起不信任案。随后，戴季陶就可以继任国府主席，得到调节军队与胡汉民一派分歧的大权。"
 YUN.lategame.413.a: "CC系于阴影之中崛起。"
 YUN.lategame.414.t: "蓝衣社接触何应钦将军"
 YUN.lategame.414.d: "滕杰和其他曾留学日、俄的黄埔军官早已制定了一个秘密计划，即提议在黄埔系内部建立一个无影无迹却又大权在握的组织，作为新党国的主心骨。滕杰身为高级军官，行事风格令人印象深刻，他在与兼管中央执行委员会军人科的黄埔同学会书记长曾扩情分享了这个计划后，便精挑细选十几位黄埔毕业生共进晚餐，进一步讨论此事。每一位参加者都宣誓自己会发展一位同学加入，到第三次晚宴时，蓝衣社已经在黄埔前六期中延揽了40余位核心社员。\n\n随着本党迅速激进化、以及政府急剧扩张带来的黄埔校友脱颖而出，这场运动开始抬头。他们近期核心圈子中采纳的议程在人脉网中迅速传播，即支持失势的何应钦成为“作为国民心目中的最高领袖、信仰中心。”\n\n何应钦方才下野几天，滕杰和曾扩情就在刘健群的主持下到达了他的宅邸。何应钦将军向来是仰仗黄埔战友的支持，也渴望听到他们来吹捧自己，请求自己再度出山。\n\n私下，这些新盟友的蛮横不太合何应钦的意，他更想保守建制派主动把他请回去。不过政学系和CC系都存有私心，为了自家的志向抛弃了他，那有黄埔系的支持也足够了。然而，黄埔系本身控制不了整个国民革命军，要想发动政变，必须让黄埔各路人马都投靠自己。想拉隔岸观火的陈诚和土木系入伙，可能并不容易。"
 YUN.lategame.414.a: "高层谋逆乎？民国自救乎？"
 YUN.lategame.415.t: "《训政时期约法》危机爆发"
 YUN.lategame.415.d: "国民党党内关系如今空前紧张，《训政时期约法》的命运更是悬而未决。随着何应钦在国民会议召开前突然下令逮捕了胡汉民，党内的权力斗争局势急转直下。胡汉民是立法院长，也是国民党内的主要理论家之一，他被拘留一事立刻引起了全国范围内的愤怒，而这愤怒很快就演变成对何应钦政权滥用权力的铺天盖地的谴责。\n\n忠于胡汉民的人成立了华南政务委员会，并组建了党权运动总联盟作为倒何先锋。面对各方日益高涨的反对声，何应钦进行了一次大胆的豪赌——他以“维护国民团结”的理由，与行政院长戴季陶一同宣布辞职。\n\n原军政部长张群宣誓就任国民政府主席，但他组建了自己的政府，使何应钦将军证明自己不可或缺的企图落了空。张群得到了由技术官僚、商业巨头和民族自由派政治家组成的政学系的支持，他试图通过《训政时期约法》以获得人民的支持。\n\n张群在党内的竞争对手则联合在了国民党内另一位重要的知识分子巨头戴季陶的周围。戴季陶有民族主义和保守主义的CC系党干部的支持，他们发誓要废除《训政时期约法》，以促进与华南政务委员会的和解。\n\n但随着国家陷入了无政府状态，军方也失去了耐心。人们越来越担心，何应钦将军可能会试图发动武装政变来东山再起，重返政坛。与此同时，[ROOT.GetRulingParty]必须决定，在即将来临的风暴中要如何行动。"
 YUN.lategame.415.a: "支持《训政时期约法》，推动国家前进。"
 YUN.lategame.415.b: "反对《训政时期约法》，维持国家稳定。"
 YUN.lategame.415.c: "退出国民会议，不与虫豸为伍。"
 YUN.lategame.416.t: "[FROM.GetLeader]盛赞约法"
 YUN.lategame.416.intro: "这场国民危机的影响范围巨大，故而那些更为自治的党委员会的介入也是预料之中。[FROM.GetNameDef]省主席[FROM.GetLeader]领导着一个以[FROM.Capital.GetCapitalVictoryPointName]为大本营的军阀集团，尽管他们是我们的革命同路人并对我们宣称效忠，但他们从未完全融入我们的中央政府。[FROM.GetLeader]的话颇具分量，甚至在[FROM.GetAdjective]代表团之外也有一定影响力。而在当今乱局面前，没人知道他的一言会激起几层惊涛巨浪。"
 YUN.lategame.416.closer: "当然，通过重金贿赂、言论审查、出言威胁和“罢免”代表等手段，我们还是可以想办法减轻[FROM.GetLeader]造成的损害。但我们应该当心，这么做冒犯的可不仅仅是[FROM.GetLeader]一个人。"
 YUN.lategame.416.d: "$YUN.lategame.416.intro$\n\n[FROM.GetLeader]决定利用自己的影响力去支持《训政时期约法》，他呼吁[FROM.GetNameDef]和其他地区的代表共同确保约法通过以推动国家前进。他这样做无疑是在暗中支持张群及其政学系政府。\n\n$YUN.lategame.416.closer$"
 YUN.lategame.416.a: "感谢他们的赞美之词。"
 YUN.lategame.416.b: "阻止他们妖言惑众。"
 YUN.lategame.417.t: "[FROM.GetLeader]谴责约法"
 YUN.lategame.417.d: "$YUN.lategame.416.intro$\n\n[FROM.GetLeader]决定利用自己的影响力去反对《训政时期约法》，他呼吁[FROM.GetNameDef]和其他地区的代表共同反对约法并和华南政务委员会谈判。他这样做无疑是在暗中支持戴季陶及CC系反对派。\n\n$YUN.lategame.416.closer$"
 YUN.lategame.417.a: "他们是对的，必须阻止约法通过！"
 YUN.lategame.417.b: "胡言乱语，不值一提。"
 YUN.lategame.418.t: "[FROM.GetLeader]退出会议"
 YUN.lategame.418.d: "$YUN.lategame.416.intro$\n\n[FROM.GetLeader]退出了国民会议，并决定利用自己的影响力去呼吁[FROM.GetNameDef]和其他地区的代表一同退出以表抗议。此举无疑是在暗示对[ROOT.Capital.GetCapitalVictoryPointName]政府合法性的否定——不过其所作所为离公开表示否定也只有一步之遥了。他对自己的抗议理由含糊其辞，并未明确表示自己是在抗议胡汉民被捕、何应钦被罢免，还是在对国民党的统治本身提出抗议。但无论如何，此举都令局势变得愈发不明朗。\n\n$YUN.lategame.416.closer$"
 YUN.lategame.418.a: "随他们去吧，他们会后悔的。"
 YUN.lategame.418.b: "不择手段施压，让他们留下。"
 YUN.lategame.419.t: "我们的努力失败了！"
 YUN.lategame.419.d: "虽然中国政坛早已对威权主义习以为常，但国民党统治的党国原则上还是遵循民主集中制的。而我们与中央政府间达成的部分协议也不成文地赋予了我们对国家事务表达意见的权利。然而中央政府却冒天下之大不韪，在《训政时期约法》危机期间对我们表达诉求的努力进行了严厉的镇压。政府采取了包括恐吓、审查，甚至是直接暴力在内的一连串手段来让我们闭嘴。此举绝非正常政府应有之行为，我们的队伍也因此叛心日增。"
 YUN.lategame.419.a: "早晚有一天，我们会提出自己的宪法草案。"
 YUN.lategame.420.t: "与华南政务委员会沟通"
 YUN.lategame.420.d: "华南政务委员会远非铁板一块，在胡汉民身陷囹圄之际更是如此。华南政务委员会虽然名义上由古应芬主持，但颇具讽刺意味的是，古应芬任人唯亲、独断专行的领导作风已在反叛阵营内部催生了新的叛乱者。尽管华南政务委员会一致谴责何应钦，要求释放胡汉民，并且与广东保持着密切联系，但[YUN.Capital.GetCapitalVictoryPointName]事态的后续发展及其自身势头的衰退，已导致他们无法在此次危机中发挥更加积极的作用。\n\n关于中央政府与华南政务委员会应通过谈判实现统一的主张正逐渐成为共识，但前提是必须释放胡汉民。孙科及其领导的进步自由主义再造派现已表示，他们倾向于与张群及其领导的技官派政学系展开对话。通过吴铁城等可信中间人斡旋，孙科改变了对《训政时期约法》的看法，转而认为一部宪法（哪怕需对原草案进行重大修改）将是约束军事统治的最佳途径。\n\n然而，胡汉民的强烈反对态度削弱了人们对《训政时期约法》的支持，而像张继这样的保守派人士则建议与戴季陶以及CC系合作，以确保结果更接近胡汉民的愿景，即由党内文职知识分子管理的党国体制。\n\n许多支持华南政务委员会的军阀已经开始无视其指令，这削弱了委员会的影响力，也加剧了局势的不确定性。然而，对于众多国民会议代表来说，实现两个国民政府和解才是当务之急，这让华南政务委员会获得了更多筹码——前提是委员会能够采取果断行动。华南政务委员会的成员大多来自林森和邹鲁领导的所谓西山派，他们很可能将决定最终结果。"
 YUN.lategame.420.a: "华南政务委员会要求修宪护宪。"
 YUN.lategame.420.b: "华南政务委员会要求彻底停止行宪。"
 YUN.lategame.420.c: "华南政务委员会吵作一团，谈判就此作罢。"
 YUN.lategame.421.t: "与左派谈判"
 YUN.lategame.421.d.CHI_DEAD: "国民党左派一贯四分五裂、缺乏凝聚，而在他们战败之后就更是如此。他们中的一些人利用自己的人脉与名声成功在新政府中占据了一席之地，但他们在右派政府中仍然被边缘化切缺乏信用。而他们走后门一事一旦暴露，无疑将证明现政府的软弱。\n\n汪精卫和他的改组会对与政学系合作表现出了兴趣，不过他本人在危机期间一直小心行事，避免抛头露面。流亡期间，汪精卫就一直主张颁布一部宪法，最近的《训政时期约法》运动更是证实了他的观点。显然他希望自己能在盟友获胜后跟着鸡犬升天。\n\n宋庆龄和她的临委会则一直在策划彻底推翻右派政府，并试图拉拢陈诚及其土木派。但他们之间的利用是双向的，陈诚同样在试图利用自己在黄埔革命同学会中的人脉帮助自己改组政府。\n\n当然，许多次要派系同样在寻找盟友。四大元老和他们的世界社虽然有着无政府主义背景，但同样与党内元老联系紧密。他们曾尝试与自己的浙江老乡戴季陶结盟，但戴季陶对包括马克思主义在内的各种社会主义都曾大加驳斥，使得双方一时难以和解。至于那些独立的社会主义者、前中工盟成员和各种进步主义团体，他们就没什么好的选择了，只能要么在政府内碰碰运气，要么干脆流亡海外。"
 YUN.lategame.421.d.CHI_ALIVE: "国民党左派仍然是中国政坛上的一支主要力量，他们正试图利用我们内部的分歧，抛出加深合作的诱饵。虽然大多数人都清楚，左右派之间根本不存在什么任何持久的团结，但如今我们的运动愈发陷入分裂，因此下层人士们正倾向于寻求实现大妥协。\n\n汪精卫和他的改组会对与政学系合作表现出了兴趣，不过他本人在危机期间一直小心行事，避免抛头露面。流亡期间，汪精卫就一直主张颁布一部宪法，最近的《训政时期约法》运动更是证实了他的观点。\n\n宋庆龄和她的临委会则一直在策划彻底推翻右派政府，并试图拉拢陈诚及其土木派。但他们之间的利用是双向的，陈诚同样在试图利用自己在黄埔革命同学会中的人脉帮助自己改组政府。\n\n当然，许多次要派系同样在寻找盟友。四大元老和他们的世界社虽然有着无政府主义背景，但同样与党内元老联系紧密。他们曾尝试与自己的浙江老乡戴季陶结盟，但戴季陶对包括马克思主义在内的各种社会主义都曾大加驳斥，使得双方一时难以和解。至于那些独立的社会主义者、前中工盟成员和各种进步主义团体，他们就没什么好的选择了，只能与我们你死我活。"
 YUN.lategame.421.a: "大多数左派暂时接受了约法。"
 YUN.lategame.421.b: "左派依然好斗，要求再次改组。"
 YUN.lategame.421.c: "左派内部争吵不休，如无头苍蝇。"
 YUN.lategame.422.t: "政学系宪法通过"
 YUN.lategame.422.d: "经过持续数周的混乱，国民会议终于将《训政时期约法》的修订版提交表决。尽管这部临时宪法已经历了许多次修改和妥协，但许多人仍然担忧其是否能确保通过。而随着代表们开始一个接一个地投票，明显张群和政学系已经得到了足够多的支持（虽然不一定热烈）来宣布自己取得胜利。\n\n在确保胜利之后，国民党稳步回归往日正轨。CC系及其官员遭到了边缘化，那些为抗议政府而辞职的人没有被重新聘用，其他人则与CC系割袍断义并改变了立场。陈立夫仍然担任教育部长，不过戴季陶和陈果夫现在只是无权无势的不管部政务委员。\n\n经过一场存在争议的投票后，华南政务委员会与政学系达成了初步协议，并选择回归中央政府。政权面临的另一个威胁消除了，来自军方的威胁也得到了制衡。\n\n黄埔系对国民革命军那庞大的影响力也同样遭到了削弱。事后，许多主要军官都被调离原职。大多数军官放弃支持何应钦将军的阴谋，他的盘算彻底破产。而与政学系结盟的军官们则悄悄地将赶跑了那些刺头，为自己争取到了领导职位。\n\n张群和杨永泰已经巩固了对国民政府的控制，尽管未来几个月恐怕还会动荡不安，但最糟糕的时期已经过去了。国民会议代表们陆续回到家中，向人们传播国民政府的最新动向，而张群主席的留任已无人怀疑。"
 YUN.lategame.422.a: "要彻底清洗党与军。"
 YUN.lategame.422.b: "让内敌们永无宁日！"
 YUN.lategame.422.c: "需尽快去稳定局势。"
 YUN.lategame.422.e: "那革命精神怎么办？"
 YUN.lategame.423.t: "CC系击垮政府！"
 YUN.lategame.423.d: "经过持续数周的混乱，成功妥协依然遥遥无期，但国民会议表决临时宪法的时间已经到了。这次表决获得了压倒性多数失败，政学系彻底失去了机会，没能获得一场他们急需的政治胜利。不信任投票已经不可避免，张群和杨永泰放弃了负隅顽抗，直接选择辞职。\n\n党内元老们出面斡旋了张杨二人的离任安排，确保了政权的平稳过渡。戴季陶轻松地拿下了多数选票，成为新任国府主席。而作为对CC系忠诚服务的奖励，陈果夫被提名为新行政院长，以此保证浙江系将长期掌权。张群和杨永泰依然保留了他们的旧业，负责国防采购和银行业务。这一安排颇具争议，不过之前那些属于他们管辖的经济或生产机构都已落入了CC系铁杆手中。孔祥熙等商界精英也很识时务，纷纷转向。\n\n尽管华南政务委员会对这一结果并不完全满意，但经过了激烈的投票与中间人的奔波努力后，他们承认了这是自己能争取到的最好结果。《训政时期约法》未能通过，华南政务委员会的大部分成员则选择承认戴季陶的主席身份并重新加入国民政府，这场危机得以告终。\n\n戴季陶虽是文官，却对军人们具有独特的影响力，从而大大削弱了何应钦对黄埔系的控制。国民革命军对这位著作等身的大师颇为熟悉，因此大多数军官都选择了忠于新政权。\n\n如今戴季陶一手掌握文武大权，成为党内的新任强人。自孙中山先生以来，从来没有哪个人能像他一样牢牢地大权在握。至于他能握多久，那就是另一个问题了。"
 YUN.lategame.423.a: "我们是时候去清理门户了。"
 YUN.lategame.423.b: "让那些难缠对手通通滚蛋。"
 YUN.lategame.423.c: "戴氏大权在握，众人咸服。"
 YUN.lategame.423.e: "但他真能继承总理遗教吗？"
 YUN.lategame.424.t: "黄埔系军事政变"
 YUN.lategame.424.d: "经过持续数周的混乱与无休止的辩论，人们对《训政时期约法》的焦虑不断增加，政学系政府的支持率已经跌至了谷底，随时可能垮台。人们开始越来越怀念何应钦那稳定的统治：虽然他的统治有些残酷而强硬，却至少不用担心内战爆发或外敌入侵。\n\n张杨政府原本寄希望于黄埔系内那些分裂分子，如进步的土木系等，能够保持对政府的忠诚，让事态平息。但他们收到了一封由国民革命军各主官联署的签名信，而陈诚的名字赫然出现在了前三个签名中，显然张杨二人已不剩多少时间了。\n\n经过精心安排，张群和杨永泰宣布辞职。中央执行委员会则邀请何应钦回来组建新一届国民政府委员会（内阁），作为对其忠诚的奖励，陈诚被任命为行政院长。虽然在名义上张群和杨永泰仍保留着他们在军政部和银行内的旧职位，戴季陶和陈氏兄弟则保留了自己在教育和党务方面的职位，但实际上，黄埔系干部已占据了政府的各个角落。\n\n最终《训政时期约法》悄无声息地得到了通过。事实证明，华南政务委员会不过是一只纸老虎：新右派采取了新一轮暴力运动后，这个由军阀和党内反对派组成的松散联盟在重压下立刻土崩瓦解。\n\n在局外人看来，何应钦已经证明了自己的必要性：他对于政府的良好运作不可或缺。而在黄埔系内部，其成员的看法已发生了重大转变：诚然，保卫革命需要委员长和国民革命军，但过去数月的政治混乱表明，何应钦对委员长一职恐怕不那么胜任。黄埔系已开始寻找一个更加年轻而机敏的候选人，也图在未来某一天取代何应钦。"
 YUN.lategame.424.a: "拦路者非敌即友！"
 YUN.lategame.424.b: "反对派必须屈服！"
 YUN.lategame.424.c: "和平与正义必胜。"
 YUN.lategame.424.e: "黄埔系报仇雪恨。"
 YUN.lategame.430.t: "分而治之的政府"
 YUN.lategame.430.d: "自胡汉民危机得到解决已过去了数月之久，艰难却稳定的和平终于重回[ROOT.Capital.GetCapitalVictoryPointName]。似乎大多数人已经接受了何应钦委员长的领导和《训政时期约法》。自然，何应钦和政学系是最大的受益者，但CC系也不甘落后。\n\n若是仔细观察情况就能发现，自国民党重返广州以来，党内那错综复杂的局势已经得到有效巩固。一位外部观察家是这样描述的：\n\n“国民党的最后决定权是操在何应钦的手中，但何也不是孤立的，而是受他下面各集团影响的。每一个集团都在他之下，都非操有全部的权力。这权力是分割的，如党务操在CC系的手中，财务操在杨、孔的手中，军事操在黄埔系的手中，行政方面则政学系的势力较大。这样各集团都是只有一部分权力，而在他们的全体之上则是何，造成何的政权。同时每一个集团都对何有影响。”\n\n通过这种微妙的权力分割，委员长的政府将继续轰轰烈烈地前进，他的统治已不容置疑。但这并没有阻止CC系和政学系、土木系和蓝衣社之间继续争夺权力。"
 YUN.lategame.430.a: "政学系会建设技官派政府。"
 YUN.lategame.430.b: "CC系铭记着主义的传承！"
 YUN.lategame.430.c: "土木系代表了大众的呼声！"
 YUN.lategame.430.e: "蓝衣社体现了国家的意志！"
 YUN.lategame.430.f: "何应钦维持着政府的团结。"
 YUN.lategame.431.t: "莫斯科派的终末"
 YUN.lategame.431.d: "胡汉民遭监禁一载之后，便和其他政治犯一起被秘密释放并转入了软禁。他寓居在广州的一间陋室，身体状况也因监禁时恶劣的居住条件而大不如前。胡汉民一如既往地固执，日日蹉跎在练字作诗之上，来客大多被拒之门外。这位脾气暴躁的老人对名义上重出政坛担任虚职不屑一顾，反倒日复一日地写些抗议政府的声明，当然这些文字迅速就遭到了审查。\n\n莫斯科委员会的各派大多自行其是。没了胡汉民这个主心骨，元老派成了一团散沙，各高层领导只能仰仗自己的威望勉力维持。西山派同样盘踞在司法院中，除了象征性的党内选举外，不愿再与何应钦作对。孙科和再造派在宪法问题上的问题也彻底转圜——孙科醉心于起草一部“完美”的宪法，找出摆脱独裁统治的办法。当然这种痴心妄想在何应钦将军这里只是笑柄。\n\n华南拥胡各省受到的打击都十分严重，权力机关几乎彻底换血。曾是陈济棠大本营的广东宣布了戒严，直至最近才宣布解严。广东省政府主席（督管军政）目前是陈诚的结拜兄弟广东人罗卓英将军。\n\n他向政治舞台的过渡很顺利，但或许任命一位更偏民政的省主席也许能塑造和平解决问题的形象。吴铁城是政学系著名人物，与前莫斯科派中的林森、孙科、许崇智等人交游密切。而与广东素来不睦的CC系也推举了博学多才、与广东政府有共事经验的张道藩出任省主席。新粤系则提名温和派文官领袖、省参议会议长林翼中就任，并以此结束占领。"
 YUN.lategame.431.a: "吴铁城在亚洲人脉颇广，正适合做中国的门户。"
 YUN.lategame.431.b: "张道藩是个博学的大儒，对本党核心大有裨益。"
 YUN.lategame.431.c: "林翼中代表浪子回头的粤系，也是信任的象征。"
 YUN.lategame.431.e: "罗卓英将军迄今表现令人满意。"
 YUN.lategame.432.t: "革命的先锋"
 YUN.lategame.432.d: "胡汉民危机令政府愈发注重自身形象，担心胡汉民对政府的连番抨击会损害民众心目中革命的正义面目。虽然大家心知肚明，现政权趋于保守（有时还比较反动），但还是有许多干部在加班加点地证明这些人的理解大错特错——国民党实实在在是为了中华的革命运动。\n\n全国各地的小册子铺天盖地，甚至发到了上海。其中内容尽是颂扬蓝衣社的革命光辉，或是颂扬陈立夫、陈果夫的作品。这些作品常常描写工农兵之间真诚相待、互相奉献——这与国民党左派的风格类似。\n\n而讽刺的是，蓝衣社也在借助大众媒体传播自己的理念，毕竟他们对自由派的报刊十分反感。不过，他们的册子里也不谈阶级斗争，而相反是阶级和谐——一个备受剥削的民族共同体，在达尔文主义的世界中，与环伺的帝国主义虎狼作着民族生存的斗争。\n\n陈诚和土木系也在用大众媒体传达自己的观念，但表达方式却更有社会主义的特征。他们宣扬，土木系将代表全国工农，追求真正的均田地。蓝衣社和CC系则自然斥责这是赤裸裸的马克思主义。\n\n政学系选择强调其致力于中国经济现代化的立场，并宣称自己是规划新国家主义经济模式的不二之选，即所谓的“计划自由经济发展”。政学系认为，所有关于社会主义和救亡图存的讨论都偏离了解决中国疲敝的真正方案——快速工业化和进取的计划。"
 YUN.lategame.432.a: "我们要在革命的真前锋带领下实现国民革命！"
 YUN.lategame.432.b: "追随蓝衣社，才不会亡国灭种！"
 YUN.lategame.432.c: "我们想要寻求真正为全国实现民生。"
 YUN.lategame.432.e: "最好的革命就是坚持其路线的革命。"
 YUN.lategame.433.t: "革新运动"
 YUN.lategame.433.d: "虽然政学系在推动建立党与国部分分离的正式政府中获益匪浅，但党内对他们的不满情绪却不断积累，最终爆发。关注党内政治的报纸将这次爆发称为“革新”运动。而这次革新运动奇迹般地统一了数个激烈对立的派系，只因他们都痛恨政学系官僚倾向明显、贪腐严重且缺乏革命热忱。\n\n第一波反对浪潮由CC系的潘公展及其同志萧铮、余井塘、程天放等人发起。在中央执行委员会全体会议上，潘公展发起了一轮激烈的讨论，强烈谴责政学系是军阀叛徒和机会主义者，称他们玷污了国民党的革命精神。\n\n梁寒操领导的再造派表达了类似的担忧。陈诚和土木系也加入了谴责政学系的行列。激进的蓝衣社同样发出了谴责的声音，滕杰和李士珍跳出来谴责张群勾结外来帝国主义。\n\n但戴季陶对此表示了沉默，因为他一直以来都在写文章反对党内派系斗争。要求委员长削弱政学系的呼声日益高涨，但他真的应该向党内日益增长的激进主义低头吗？"
 YUN.lategame.433.a: "政学系一次次地证明了其价值！"
 YUN.lategame.433.b: "贪污腐败积重已深，不得不除！"
 YUN.lategame.434.t: "黄埔系分裂"
 YUN.lategame.434.d: "尽管（或者说正因为）我们的地位越来越高，黄埔系内部的派系和山头内斗也变得前所未有的激烈。陈诚和他的土木系少壮派为争权夺利，在军界发起了一场破坏何应钦委员长权威的运动，这场运动甚至已经见了血。其中一个著名例子就是何应钦那位臭名昭著的下属程泽润。\n\n何应钦委员长曾经为了在黄埔系内争权夺利，而授意程泽润杀了陈诚属下一个贪赃枉法的师管区司令。此事令陈诚对何应钦恨之入骨，于是小委员长精心策划了一个圈套，让程泽润因贪污罪被捕，关进了军事监狱。\n\n随着争斗不断加剧，陈诚的死对头关麟征将军也参了一脚。关麟征素来以直率固执、不工心计闻名。1928年时，关麟征当着罗卓英的面侮辱陈诚的战地指挥能力，二人就此结下了梁子。关麟征从不放过任何贬低陈诚的机会，据说二人间最近的一次冲突尤为激烈，当时二人为何应钦的一项人事任命而大吵一架，关麟征指责陈诚心胸狭隘，暗示他想让土木系在军队中占据主导。二人争吵过于激烈，就在许多人以为他们要大打出手时，陈诚忽然因过度紧张而胃溃疡复发，小委员长当场跪倒在地，吐血不止。\n\n关麟征的嘲弄气得陈诚吐血，他原本希望能任命张耀明，但这一提议也被否决，最终由土木系的方天接任。消息在军政两界传开后，人们对此事争论不休。许多人对陈诚表示同情，认为他为国鞠躬尽瘁、呕心沥血。但也有不少人批评何应钦和陈诚，其中滕杰的反对声音尤为突出。他指责这两人任人唯亲、贪污腐败，并纵容党内的不正之风。"
 YUN.lategame.434.a: "陈诚真乃民族英雄！"
 YUN.lategame.434.b: "何委员长不偏不倚。"
 YUN.lategame.434.c: "滕杰之言掷地有声！"
 YUN.lategame.440.t: "最高领袖……和部下们"
 YUN.lategame.440.d: "名义上，整个国民革命军中那些经历过统一战争、二次北伐的老兵都忠于何应钦。然而，政局的发展略显讽刺，在胡汉民危机过后，委员长在黄埔系内部的权威便一落千丈。尽管何应钦保住了国府主席宝座，但如今的黄埔系内部早已翻天覆地。\n\n整个军校中都蔓延着革命激进主义的风气，如今的国民革命军内部分为陈诚、滕杰两派，而军队元老派则对蒸蒸日上的两支少壮派无能为力。为了安抚这些激进军人，陈诚出任了行政院长，而滕杰则出任总参谋长。\n\n但这一任命也没有压制蓝衣社对最高领袖的呼唤。他们的发言人刘健群在一场高度公开的讲话中，宣称千百年来，中国的黄金岁月总是伴着一位真正的独裁者，而国家的兴衰正是取决于此人的素质。如果一个至高无上的党，一个永远正确的国民革命的政党可以为中华民族永远辉煌时，那现在又有什么理由不这么做呢？\n\n然而，蓝衣社内部甚至刘健群本人也没说过，这个本党的最高领袖指的是何应钦。不过，他们一直都在行动，确保对军队中庞大恩庇网的控制。陈诚则是凭着美满的婚姻、天生的交际能力在政坛上有了一席之地。人们只能翘首以盼，这个所谓的最高领袖究竟是何面目？"
 YUN.lategame.440.a: "中华民族的领袖万岁！"
 YUN.lategame.440.b: "实现真革命需要的是公正的铁腕。"
 YUN.lategame.441.t: "《献一点整理本党的意见》"
 YUN.lategame.441.d: "滕杰与陈诚都在很大程度上视何应钦为失败的临时领袖，而他们专注于为自己钻营，这一点上刘健群显然看得更透彻。刘过去是何应钦的私人秘书，如今也是新政府实际上宣传工作的负责人，但他仍不辞辛劳地讨好着何主席。在对国府主席言论愈发被漠视的当下，刘健群的做法让自己的影响力大大提高。\n\n他甚至未与滕杰和陈诚商议，就自己更进了一步——印发了一本七页的小册子，称为《献一点整理本党的意见》。他在其中概述了本党面临的几个主要问题：\n\n本党的解决方案不仅仅是清除腐败分子、进行新的改组，而是要整个地打倒旧党，创立一个由真正革命者所组成的组织。\n\n党内应当充满富有蓝衣社革命精神的革命者。\n\n要抵制物质财富、封建关系，甚至是家庭纽带。真正的纽带只来源于同志情谊。当然，这构想的是一种在蓝衣社的保护下限制私有财产、彻底控制家庭成员的模式。\n\n三民主义应当以社会主义者的模式进行组织，同时兼具日本武士道、国家民粹主义力行争取终极革命现代性的精神。\n\n何应钦应当作为党和国家的最高领袖。一切成员唯领袖之命是从，不得违抗领袖。是的，当此非常之际，革命精神处于危急之时，中国需要一位真正的领袖(Conducător)或是元首(Vozhd)！"
 YUN.lategame.441.a: "不清党，本党何从焕然一新！"
 YUN.lategame.441.b: "唯物主义是新世纪开端以来最为堕落的思想！"
 YUN.lategame.441.c: "我们不必隐瞒，我们需要中国的萨文科夫！"
 YUN.lategame.442.t: "国民党的第三条道路"
 YUN.lategame.442.d: "刘健群并非是唯一一个想要改组党国的人。在世风日下之时，陈诚的言论煽动之下，所谓复兴思想日益高涨，促使许多黄埔系成员想要回归1924年的左派革命精神。\n\n而作为文官政府首脑，陈诚提议了进行二次改组，为所有政府人员设立年龄和教育程度的要求，他也有不少影响深远的军务和国务议程：\n\n要以非正规部队配合主力部队，打击赤匪和反动派一类。\n\n军队要贯彻改革，成为一支严格、有纪律、主义是从的武装。国民革命军不能再被视为国民党麾下的军阀武装。\n\n三民主义青年团将得到极大加强，同时其中也会设立秘密警察，以清洗反革命活动。当然，这实际上是针对何应钦和CC系的计策，借此避免其干扰陈诚的崛起势头。\n\n陈诚希望能努力弥合莫斯科派与委员长之间的分歧，以此来重塑对国民党的信任。他希望最终通过自己的诚信与廉洁，来重塑对于国民党体系的信念。"
 YUN.lategame.442.a: "新国家崛起于新军队之中！"
 YUN.lategame.442.b: "国家的未来是青年的！"
 YUN.lategame.442.c: "弥合旧关系，共赴远大目标。"
 YUN.lategame.443.t: "民权倾覆"
 YUN.lategame.443.d: "自从胡汉民危机爆发以来，右派文官就一直不太平。胡汉民虽已悄然获释转为软禁，但他的大部分追随者要么保持缄默，要么逃往国外。张群和杨永泰被边缘化，政学系近乎瓦解。戴季陶选择接受考试院院长一职，实质上淡出了决策核心圈。\n\n在提交给中央执行委员会的胡汉民危机最终报告中，此次危机被归咎于以下几点：1.）缺乏群众支持；2.）政府无力且拒绝变革；3.）官僚管理不善；4.）派系斗争过度；5.）地方政府不忠。危机过后，推行改革已刻不容缓，随之而来的清洗行动则为党内变革创造了契机。报告还警告称，若改革不力，国民党恐将前途堪忧。\n\n虽然CC系希望在土木系和蓝衣社之间发挥平衡作用，但他们的影响力已经大不如前。陈诚凭借职务之便，以采取急促果断的突击行动而非循序渐进的稳妥做法，加速清洗CC系要员。然而，由于何应钦名义上仍在掌权，这仅仅是局部变革。何应钦政府改组的最新目标是中执委秘书长一职，该职位负责管理秘书处事务。陈立夫即将被降职为教育部长，其兄陈果夫更遭调任立法院，形同流放，因此陈立夫已无力继续争夺这一职位。\n\n如今CC系被边缘化后，土木系力推朱怀冰出任秘书长一职。朱怀冰是一位左翼军官，后来成为文职官员，以恪尽职守而著称。蓝衣社则力推刘健群。刘健群既是何应钦认可的人选，又以笔耕不辍、痴迷民粹主义而闻名。为了维护仅存的合法性，CC系和部分土木系成员力推张厉生。张厉生虽然是CC系成员，但与陈诚提出的农村土改方案有着密切利益关联。"
 YUN.lategame.443.a: "朱怀冰将给政府注入新的活力！"
 YUN.lategame.443.b: "国民党需要刘健群的激进思想！"
 YUN.lategame.443.c: "只有张厉生才能达成真正妥协！"
 YUN.lategame.444.t: "建国三段论"
 YUN.lategame.444.d: "先总理谈到中国革命时，提到了广受讨论的革命三阶段理论，而国民党也将这一理论奉为圭臬：军政阶段的任务是革除军阀；训政阶段将会筹备民治；而第三阶段则是宪政阶段，彼时中国将彻底摆脱帝国主义，在享有民权的条件下发展。\n\n蓝衣社却认为中国仍应该处于军政阶段。所谓文官训政简直是不切实际的进步美梦，还会带来对于宪政的不必要奢求。毕竟……现阶段民众真的需要民权吗？也许联省派和其他民主理想派会这样思考，但在文盲未除、民智未开的情况下，给予中国民权无异于让一个缠足的女孩穿着高跟鞋跳舞。\n\n因此，蓝衣社也许是这样想的：民权未必要带来自由化，真正的民权乃唯领袖之命是从，对本党绝对忠诚，是为革命之第三阶段。\n\n陈诚本人大体接受由军人主导训政这一理念，但他最终是愿意实现民权的。本党必须引入新的、有活力的党员来更正训政时期的错误，并为中国逐步自由化、迈向民权做好准备。"
 YUN.lategame.444.a: "民权对民众来说不过*惑众妖言*！"
 YUN.lategame.444.b: "少壮派可以更正过去的错误。"
 YUN.lategame.450.t: "党国改组"
 YUN.lategame.450.d: "胡汉民危机尘埃落定，党内也安定了下来。如今，戴季陶成为了国民党无可争议的领袖。他作为一个理想主义的保守派，一心要复兴几个世纪之前，即马克思主义与工团主义革命尚未出现之前，各阶级和谐共处大同之世的本质。真正的国民革命不是需要阶级斗争，而是民族思想与阶级意识相统一；这才是孙中山先生的真正目标。\n\n按戴季陶自己的信条，他拒绝在党内站队，不过还是和CC系过从甚密。陈立夫、陈果夫两兄弟领导着一帮支持者，寻求结合儒家思想与威权主义，类似于俄罗斯的民族协作运动。\n\n现在新国府主席接管政府，将要开启改组国民党的第一阶段。增强个人崇拜与权力崇拜自然会强化戴季陶的形象，但寻求强力的CC系力量的支持可以提高本党之内的革命精神。或者，戴主席也可以弥合国内分歧，集中精力在一种纯粹的意识形态下让国家和谐发展。"
 YUN.lategame.450.a: "戴传贤先生乃是中国真伟人！"
 YUN.lategame.450.b: "民众勠力，共造和谐。"
 YUN.lategame.450.c: "提拔CC系里的忠臣。"
 YUN.lategame.451.t: "新中国，新媒体"
 YUN.lategame.451.d: "在20世纪的当下，群众日益识字，注意逐渐被报纸上的头条、火炉旁吱吱作响的收音机甚至是大城市中常见的电视机所吸引。CC系热衷于用党所批准的娱乐活动来愉悦、动员民众，将媒体用视为一种可以用于国民革命的控制形式与权力。\n\n中国文化建设协会受CC系资助，强调中国文化，抵制西洋文化，尤其热衷传统戏曲与音乐。戏剧演出专注于中国历史上力挽狂澜的民族英雄，如话剧《野玫瑰》就讲的是国民党特务在上海街头与日本情报机关斗智斗勇的故事。英雄般的牺牲、悲壮的爱情都是常见的主题，尤其着重的还有以身殉国的内容。CC系资助的还有面向青少年的《青年战士报》。这份刊物内容直指民族爱国主义，包括引导孩童为不可避免的反日、德帝国主义战争做准备的歌曲。同时还鼓励孩子们用玻璃、钉子、纺锤和竹节来做玩具飞机。\n\n奇特的是，这本刊物还鼓励孩子们玩一种名为“还我河山”的军事游戏。玩家们分成几组，排队夺回写有香港、上海、台湾及旅顺港等被帝国主义国家夺走城市名字的旗帜。"
 YUN.lategame.451.a: "引导资助弘扬中国传统文化的工作！"
 YUN.lategame.451.b: "引导资助弘扬军事思想的工作！"
 YUN.lategame.451.c: "引导资助弘扬民族责任的工作！"
 YUN.lategame.452.t: "本党本军"
 YUN.lategame.452.d: "军队长期以来一直是中国政治中一支强大的力量，而国民革命军无疑是国民革命成功的主要因素之一。北伐失败后，国民革命军四分五裂，鉴于戴季陶在右派势力中的个人政治影响力，真正的国民革命军自然承认他为党的实际领导人。\n\n随着何应钦实际上已在政坛中失势，关于何委员长与忠于蓝衣社的暴徒和激进分子勾结的传闻似乎也已偃旗息鼓。在军队内部，陈诚和土木系仍在要求增强改良活力。政学系则抱怨政府仍然缺乏完全合法性及协作机制，尽管他们自己可能会成为政府改组的下一个受害者。\n\n有了军队的忠诚支持，戴季陶当然可以让政学系和土木系两派人马相互制衡，加剧二者间的矛盾，从而让他在CC系内部的影响力进一步膨胀。当然，戴季陶也完全可以选择整肃党纪，让这些小派系悉数俯首听命。"
 YUN.lategame.452.a: "维持现状即可。"
 YUN.lategame.452.b: "让两派互相制衡。"
 YUN.lategame.452.c: "严厉整肃党纪！"
 YUN.lategame.453.t: "新右派中的知识分子"
 YUN.lategame.453.d: "在新右派中涌现出了两位杰出的知识分子，此二人皆因文学评论以及与党的联系而声名鹊起。其一是毕业于香港大学的朱光潜。朱光潜是一位自由主义美学家，对美学、心理学、西方哲学和艺术研究有着浓厚的兴趣。二十年代，朱光潜曾在英法这两个社会主义国家生活过一段时间，他身上自由主义的一面为英法二国的美学衰落并转向“古典”而感到惋惜，而他身上保守主义的一面则使他的作品在国民党右派中颇受欢迎。事实上，朱光潜曾批评中国群众面对困境时的虚伪，他指出，许多人“立誓感恩以分润庚子赔款的，是否没曾喊过打倒帝国主义？”\n\n另一位著名作家是记者陈布雷。陈布雷是戴季陶的亲密伙伴之一，他是一位雄心勃勃、甘于奉献的记者，每天都会在昏暗的灯光下工作数小时，只靠红茶和香烟来提神。陈布雷是戴季陶最忠实的代笔人，戴季陶那些最受欢迎的演讲稿背后都有他的参与，同时他也是国民党事业的忠实信徒——虽然他自己的女儿离家出走加入了中国工团党。陈布雷本人与陈氏兄弟和著名的革命家陈其美是亲戚，起初他在上海的一家报社担任编辑，后来在蒋介石的亲自邀请下加入了国民党。作为戴季陶领导层中的忠实成员，陈布雷坚定不移、忠心耿耿、服从领导，立志要为更伟大的事业奉献自己的文笔与生命。\n\nCC系领导下的中国文化建设协会决定为这两位文坛巨擘之一颁发中国年度作家的殊荣。朱光潜的著作受到了自由主义影响，为他颁奖似乎与新右派的事业相矛盾，但朱光潜对美学和哲学理解无比完美，对其与国民党的复兴运动间的关联也了然在心。而若是选择表彰陈布雷，则将继续加强对国府主席本人那与日俱增的个人崇拜。"
 YUN.lategame.453.a: "朱光潜推动自由主义前进！"
 YUN.lategame.453.b: "陈布雷乃真正的革命作家！"
 YUN.lategame.454.t: "与旧右派和解"
 YUN.lategame.454.d: "国民政府在胡汉民危机中陷入一片混乱，胡汉民本人也正式辞去一切党内职务，通电下野寓居广州。前些日子，戴季陶与胡汉民的友谊因这些事件愈发紧张，但戴季陶仍然不断提出与这位备受尊重的党国元老重修旧好。\n\n胡汉民下野后，华南政务委员会成为了戴季陶作为本党领袖的掣肘。广东出身的本党元老派已经安于寓居华南的宅子里，饮着下午茶，谈论着国家和世界大势。他们在粤地的权力根深蒂固，说一不二，戴季陶和CC系也自然无意除去他们。西山派继续在司法院中任职，而再造派则继续在立法院和侨民群体中兴风作浪。\n\n尽管胡汉民可能已经从危机中脱身并摆脱了叛徒的标签，但其他华南人士就没有这么走运了。虽然西山派人士主张对叛军采取抚恤路线，但党内许多军事派分子则呼吁立即惩罚那些构成华南政务委员会主干的两广军阀。陈立夫则建议彻底清洗同样逃往华南的政学系叛徒。"
 YUN.lategame.454.a: "展堂铁骨，化敌为友。"
 YUN.lategame.454.b: "收敛言语，共建新党。"
 YUN.lategame.454.c: "军阀祸根，一个不留。"
 YUN.lategame.455.t: "中央俱乐部与江浙财阀"
 YUN.lategame.455.d: "随着国民党的国民革命事业在全国范围内如火如荼地推进，该党与地方精英的关系性质近来引发了争议，这种关系或许可称为一种脆弱或有限的联盟。在国统区，地方精英始终与国民党进行着不同程度的脆弱协商与交易，这种情况在广东也曾出现过，最突出的代表便是灾难性的商团事变，最近的类似案例则是中央俱乐部与“江浙财阀”（中国最大的金融工业集团）的互动。\n\n依靠家族纽带（主要是通过陈其美的人脉），中央俱乐部核心人物陈果夫与陈立夫兄弟利用他们在地方上的关系，运作江浙财阀的庞大财力以资助国民党事业，江浙财阀的企业和革命同志会浙江社也一直是革命活动的主要据点。在当前的国家大背景下，江浙财阀更是将江南商帮并入了他们的商业帝国。\n\n然而，无论国民政府还是财阀集团都非铁板一块，当地方省县两级政府介入后，局面更是愈加复杂混乱。地方县级政府有时会公然违反省级或国家法律，与精英阶层私相授受，而非执行国民党提出的减租减息等政策。另一方面，国民党也经常勒索地方精英，强征巨额军费及党务资金，甚至打着清除“土豪劣绅”（即所有拒绝捐款的弱势精英）的旗号，展开反攻倒算。\n\n作为回应，各路反对党派纷纷成立，有时甚至演变成地方民兵与党员士兵之间的暴力冲突。在这种充满暴力的不确定氛围中，CC系提议召开党政联席会议，并建议对地方精英采取温和态度。CC系更倾向于采取政府行动，而非发动群众展开大规模暴力斗争。CC系的提案获得了党内广泛支持，并力推江浙财阀代表人物虞洽卿出面主持相关事务。"
 YUN.lategame.455.a: "中央俱乐部将利用自身关系网来统治精英！"
 YUN.lategame.455.b: "我们的做法怎么可能不符合精英的利益呢？"
 YUN.lategame.460.t: "政学系政府"
 YUN.lategame.460.d: "《训政时期约法》的通过，在国民党立法院内部获得了广泛赞誉。政学系在民选政府内部占据了主导地位，国民政府委员会（内阁）也成功稳固了重建的政府体系。由于国民革命军基层官兵展现出的高度忠诚，公开军事政变的担忧现已基本消退。CC系试图推翻张群政府的企图以失败告终，党内呈现出难得的平静局面。\n\n政学系下一步的议程是弥合与旧北洋政府之间的分歧。尽管北洋政府最终在直系治下沦为腐败的独裁政权，但像黄郛、吴鼎昌、吴铁城等北洋政要已表示愿向新国民政府效忠，并将他们丰富的经验献上。黄郛曾在多年前专门访问德国，深受瓦尔特·拉特瑙经济改革的启发。\n\n随着政学系政府的崛起，技术官僚和其他温和派政客纷纷支持张群。原著名北洋技官翁文灏和丁文江提议设立国家资源委员会和中央计划委员会等技官机构。中央计划委员会将汇集全国最优秀的专家，统筹国家的中央经济计划；国家资源委员会则负责工业发展。\n\n这些机构从而将成为中国工业化的跳板，并通过一系列雄心勃勃的五年计划，将经济牢牢掌控在国民党手中。孔祥熙的金融集团背后聚集的更为自由派的商业势力批评这些措施是社会主义的荒诞做法，但截至目前，杨永泰已公开支持此类国家主义提案，他此前还在西南地区建立了多家国营农场。"
 YUN.lategame.460.a: "巩固政学系忠实支持者对政府的控制。"
 YUN.lategame.460.b: "接触寻求建设更美好中国的北洋政客。"
 YUN.lategame.460.c: "通过严格措施振兴经济方为当务之急。"
 YUN.lategame.461.t: "与华南政务委员会谈判"
 YUN.lategame.461.d: "原国民党三巨头之一胡汉民在被捕并遭到短暂监禁后终于获释。但这位受人尊敬的政治家和作家拒绝承认我们的新政府。胡汉民谴责新政府不过是披着伪装的军阀买办，并南下广州孤身一人闭门反思。胡汉民依然怒火滔天且固执己见，而他的访客和耐心一样几乎即将清零了。\n\n尽管元老派仍在谴责[ROOT.Capital.GetCapitalVictoryPointName]的新政府，但胡汉民的追随者已纷纷作鸟兽散。而西山派和再造派对修复破裂的关系并建立一个真正而崭新的宪政政府一事持友好态度。那些加入了华南政务委员会的军头则毫不介意危机的持续，并将此次危机视作自己排除国民政府影响力的机会。\n\n大部分政学系成员都愿意与这些南方共和派恢复对话。有些人建议邀请孙科、居正和其他再造派与西山派的学者们共同参与政治协商会议，以制定一部完整的宪法。当然，孙科本人曾经把立即制订宪法以阻止未来的军事政变的观点视作异端邪说，但他现在已改变了自己对《训政时期约法》问题的看法。\n\n这些政客总是愿意收受贿赂，或许我们可以靠提供一大笔金钱并许下为乱世带来和平稳定的承诺，以此说服他们加入新的国民政府。又或者，最好的办法是给予那些军头自治权，以此来监视他们并遏制其影响力，从而避免组建新政府的尝试被政变所终结。"
 YUN.lategame.461.a: "召开政治协商会议！"
 YUN.lategame.461.b: "收下这笔钱，你就是自己人了。"
 YUN.lategame.461.c: "允许那些军阀自治。"
 YUN.lategame.462.t: "预防军事政变"
 YUN.lategame.462.d: "深夜，在张群位于[ROOT.Capital.GetCapitalVictoryPointName]的官邸中，张群、李根源、熊式辉与赖世璜等正在开会。四人正在讨论，胡汉民危机期间，国民革命军到底离发动政变有多近。以党军在党内的权势，如若发难，政府必将一举倒台。\n\n尽管政学系政府取得了胜利，但黄埔系仍然霸占着国民革命军最高指挥部。众所周知，陈诚的派系几乎无法容忍新政府，仅能维持表面上的忠诚。\n\n蓝衣社公开反对新政府，因为他们既厌恶民主，也不乐意追随文官政府。何应钦颜面尽失，他麾下的人也分成两派——一派识时务地倒向新政府，另一派则投靠了军中更为激进的派系。\n\n忽视军队的这种行为无异于放任激进派做大。还有一些地方派军官能被新政府拉拢。做做这些军官的工作可以确保我们对黄埔系的控制，收买其中一些人甚至可以让我们完全掌控住革命军。"
 YUN.lategame.462.a: "放革命军不管，我们有要事在前。"
 YUN.lategame.462.b: "保证对地方派军官的控制。"
 YUN.lategame.462.c: "着手提拔政学系。"
 YUN.lategame.463.t: "党外人士蜂起"
 YUN.lategame.463.d: "“党外”这个词在国民党话语体系中愈发流行，尤其是在《民国日报》等主流报刊和社论中。该术语指代获准参与政府事务的政治独立人士，他们名义上不属于国民党。\n\n在如今主导党内的张群-杨永泰联盟的领导下，许多曾在前安福俱乐部或北洋政府时期积累了政治影响力的共和派党外人士，如今获得了再次晋升的机会。随着新政权寻求在全国范围内确立自身合法性，这些雄心勃勃的前北洋政客正在重返国家政坛——此举往往以挤占国民党忠诚分子的席位名额为代价。该现象引发了党内众人的强烈不满，他们认为这些外来人士的存在削弱了党的革命精神。为此，谷钟秀提出了一个折衷方案，即给予这些人党籍，让他们获得在新国民政府中立足的正当名分。"
 YUN.lategame.463.a: "本着民权精神，广开言路。"
 YUN.lategame.463.b: "鼓励他们接受国民党党籍。"
 YUN.lategame.463.c: "要记住谁才是革命真同志。"
 YUN.lategame.464.t: "新民国中的新面孔"
 YUN.lategame.464.d: "政学系的成员除了政治家外，还有各行各业的人物，而这些人构成了新中国的核心。这个新中国早已摆脱了外国人的羞辱和君主制的压迫。而政学系将由这些能够改变历史的新人引领。\n\n翁文灏早年中秀才，后来又留学欧洲学习地质学，与同期赴欧的胡文耀、孙文耀并称“震旦三文”。学成归来后，翁文灏在北洋政府农商部任事，并在地质研究所任讲师，近来又被任命为经济部长。作为一名热情的地质学家，他一直在请求内政部扩大采矿活动，以帮助中国建设真正的石油工业。\n\n吴鼎昌曾经加入过同盟会又旋即退出，并参加了清廷的廷试。辛亥革命后，吴鼎昌参加了进步党，并在安福俱乐部政府中担任财政部次长。安福系失败后，吴鼎昌失去了政治支持并被逐出政坛，但却成为了一名成功的商人。在国民党的赞助下，吴鼎昌担任了实业部长与贵州省政府主席——就在新右派的老巢附近。\n\n最后一张新面孔是政治家吴铁城。吴铁城是林森的好友，他参加了辛亥革命，之后为孙中山先生工作，并加入了中华革命党。后来他短暂出海前往檀香山，然后与许崇智一同对抗陈炯明，并帮助镇压了广州商团事变。吴铁城是一位坚定的反社会主义者，与孙科阵营的关系也颇为密切。"
 YUN.lategame.464.a: "向革新的中国与新一代科学家致敬！"
 YUN.lategame.464.b: "向富裕的中国与新一代规划者致敬！"
 YUN.lategame.464.c: "向强盛的中国与新一代政治家致敬！"
 YUN.lategame.470.t: "新生活，新风尚"
 YUN.lategame.470.d: "“应对这场空前国家危机的关键在于培训与引导妇女投身职业生活。”\n——《民国日报》妇女周刊副刊\n\n国民党的理念呈现革命与保守的双重特质，其对女性角色的期待亦体现这一矛盾，既呼吁重塑符合“爱国”标准的新性别规范，又与许多欧洲极右翼运动试图鼓励女性回归家庭、在黑色星期一期间减少就业以承担母职不同；国民党认为，工业化进程中的中国亟需更多女性参与职场，且当前问题并非出生率不足，而在于婴儿死亡率居高不下。\n\n事实上，作为新生活运动的一部分，女性的奢华时装已被禁止。裙长须及踝，衣领至脸颊的距离不得少于一英寸半，袖长至少至肘部，裙摆开衩不得高于膝盖，女性必须避免穿紧身衣物，并将头发向后梳，头发不得垂至颈部以下，卷发也被禁止。女性政府职员必须以身作则，穿着蓝色短外套、黑色裙子、黑色长袜和黑色鞋子，同时禁止穿着没有纽扣的羊毛大衣。\n\n以上规定似乎与党的保守革命理念并无冲突。女性仍然被期望“培养平和、善良、健康的母性本能”并抚养子女。男女混浴已被禁止，在街上挽手行走也已被禁止。推行男女分校政策，以终结滋生“自私纨绔习气、刺激情欲享乐、妨害种族健康”的两性共同校园生活。\n\n尽管如此，传统的婚丧礼俗也将被简约形式所取代。国民党响应新文化运动号召，倡导核心家庭模式。与传统的中国家庭结构相比，核心家庭结构更加现代和世俗。"
 YUN.lategame.470.a: "为革命姐妹们创造真正的现代社会！"
 YUN.lategame.470.b: "女性应当跟随她们革命兄弟的领导！"
 YUN.lategame.470.c: "让这些女人老老实实地*待在家里*。"
 YUN.lategame.471.t: "战争中的国民党女杰"
 YUN.lategame.471.d: "中国正处于事关生死存亡的殊死搏斗中，国家不仅征召男儿奔赴沙场，也号召女子投入战事。全国女性正受训学习急救护理，承担后方勤务，甚至操练机枪弹药，以防时局恶化。\n\n在支持国民政府的中国女性中，先总司令蒋介石的夫人宋美龄无疑是最具代表性的一位。作为与前黄埔校长有过短暂交往的党内名流，宋美龄号召中国女性效仿一战期间的英法德等国妇女，投身军工生产。此举将有助于提高女性社会地位，让女性获得与男性平等的待遇，尤其是在像中国这样父权主导的社会中。宋美龄热心公益，并利用家族关系，创办了现代化的先进孤儿院，配备了游泳池、游乐场等娱乐设施以及现代化教室，以容纳中国日益增多的孤儿。\n\n宋美龄还与其他杰出女性，包括何应钦的妻子，共同呼吁妇女参军。虽然女性是否会被派往前线，成为真正的战斗人员，目前尚不清楚，但已有数千名女性响应号召，作为医护人员投入到当下这场救亡斗争之中。"
 YUN.lategame.471.a: "照顾孩子才是女性的优先事项！"
 YUN.lategame.471.b: "妇女参军将确保她们获得解放！"
 YUN.lategame.471.c: "妇女也要做好准备为生存而战！"
 YUN.lategame.472.t: "国民党政权的卫生育成"
 YUN.lategame.472.d: "作为国民政府振兴中华民族的工作，为国魂的战斗不仅为的是革命精神，也为的是华夏儿女的复兴。中国人的体质长期受着饥荒、战争与疾病的摧残。孙中山先生就严肃地谈过物竞天择的道理，革命必须在于新民——如果中国人没有得到疗愈，那作为一个物种，我们迟早会亡国灭种。新生活运动旨在调整曾经的新文化运动，平衡西方精神与传统道德。[ROOT.GetLeader]在宣传中就对妻子相敬如宾、忠贞不二，和那些旧军阀有着天壤之别。\n\n本党一直在严肃地对群众运动”去激进化“，确保其服从于新生活运动之目标。毕竟，那些两耳不闻窗外事，一心纵情声色犬马之徒，到最后都自顾不暇，成了堕落的反动者。\n\n毕竟，精神力量来源于更健康、更道德的生活方式。农村的卫生署大力鼓励接种疫苗，并教导人们更健康的生活习惯。运动鼓励人们清洁沐浴，灭蚊也成为了宣传中培养节制、卫生的新国民的重要一步——此后中国人便不在西洋人面前低人一等。\n\n此外，陈果夫建议将妓院收归国家运营。他的解释是，把这些窑子关掉只会逼他们转到其他合法的地区。不如限制妓院的运营，同时让所有娼妇都可以使用606（即砷凡纳明，一种抗生素）来治疗危险的性病。砷凡纳明虽然治疗过程痛苦，不过肯定比传统的水银疗法有效，而且这种药物也可以用于治疗一些其他恶疾。"
 YUN.lategame.472.a: "在新民，在止于至善。"
 YUN.lategame.472.b: "要搞好革命之斗争，先办好思想之斗争。"
 YUN.lategame.472.c: "应当励行新生活运动。"
 YUN.lategame.473.t: "新生活运动"
 YUN.lategame.473.d: "“民族的兴衰，与文化的兴衰成正比。不先建立新的民族文化，则民族的复兴难以成功。”\n\n像国民政府这样民治、民有、民享的政府，必须解决长期困扰中国社会的种种痼疾。人民应当在秩序的驱动和引领下，通过党的思想教化与精神指引，体验新生活并破除迷信陈规。这是一场受到萨文科夫领导的保卫联盟集会以及罗马尼亚铁卫团的秩序和稳定口号所启发的运动。必须摒弃阶级斗争，将广大人民团结起来，复兴中华民族精神。\n\n正如深植于中国社会的祖先崇拜一样，政治评论家和思想家指出，如今也出现了一种类似的趋势，即对党国的崇拜。新生活运动旨在调和中国日益加深的西化进程与流传千年的传统道德准则。工团主义与社会主义之类的荒谬言论在中国没有立足之地——国民党曾受其玷污，导致党内派系斗争加剧，党的势力逐渐衰弱。\n\n政府倡导民众奉行标语式的儒家思想，将“礼、义、廉、耻”四种美德奉为圭臬。当局甚至强制推崇孔子思想，遵守儒家节庆仪轨和九十六条行为准则，以规范民众的日常行为。\n\n当然，也有思想家指出，这场规模浩大的新生活运动不仅是为了复兴中华民族精神，更是为了确保中华民族的存续。新生活运动的支持者认为，新文化运动带来的堕落和对西方文化的过度效仿，已导致国民道德与体格的双重衰退。许多人据此主张，中华民族应该效仿日本的尚武文化，并按照日本军校的模式，重塑一个纪律严明、服从高效的社会。只有在严苛的纪律下，人的内在才能得到彻底改造，最终创造出一个崭新的社会和国家。"
 YUN.lategame.473.a: "摈弃旧生活，创造新社会！"
 YUN.lategame.473.b: "民族有道德，社会才和谐。"
 YUN.lategame.473.c: "培养新国民，同志齐努力。"
 YUN.lategame.474.t: "国民党地方政府改革"
 YUN.lategame.474.d: "渴望振兴地方县乡，是20世纪中国改革者的一个共同特点，国民党也不例外。但与联省派对手不同的是，国民党认为中央政府应该在鼓励地方振兴方面发挥主导作用，而地方行政反过来也将有助于增强中央政府的力量。事实上，当被追问时，国民党官员坚称他们正在构建一种“更好的联邦制度”，即全体中国人民共同努力，而非各省之间互相争斗。\n\n新的地方行政体制将由新设立的县和规模较小的镇实施，这些县镇将成为新的政治和经济活动中心。县将成为仅次于省和直辖市的二级行政区，第三级则是乡、镇以及其他较小的城市。乡将由镇级行政长官或民团长官领导，这些乡镇领导通常由上级行政官员亲自挑选，以保障农村地区的稳定与和平。\n\n保甲制度在宋、明、清三代都曾得到实践检验，新成立的国民政府也沿用了这一制度。何应钦委员长曾强调，保甲制度具备建立真正义务兵役制度的潜力。保甲制度以十人为一户，有助于户间相互监督担保、维护地方秩序、征收钱粮赋税并组织民生工程。保甲制度也旨在帮助当地居民做好参加剿匪的准备，并让远离首都的偏远地区也能落实中央政府的施政。\n\n最后，为了增加地方财政收入，我们对农村地区也进行了改革。虽然我们明文规定政府雇员管理的粮仓应当上报并保存粮税记录，但初步报告显示，粮仓内部仍存在相当多的徇私舞弊行为，表明这些改革措施并未完全奏效。"
 YUN.lategame.474.a: "我们将为乡村之心带来秩序与安定。"
 YUN.lategame.474.b: "我们将朝着真正的和谐与繁荣迈进。"
 YUN.lategame.474.c: "人民将通过保甲制度得到真正锻炼。"
 YUN.lategame.475.t: "中央委员会扩大化"
 YUN.lategame.475.d: "国民党奉行以党治国，不过政府与本党的关系却界限模糊。治党问题错杂无序、难以掌握，更加剧了这一问题。中央执行委员会是国民党全国代表大会选出进行统治的代表。最初在1924年，中执委仅24人，后来逐步增加到36人、71人，如今已有119人。过多的委员使得中执委臃肿异常，而在许多委员也同样在立法院、国民会议上任职的情况下，上述两个机构也显得多余起来。\n\n缩减中执委员的计划寸步难行，毕竟委员本身视为一种对效忠之士的褒奖。因此，便有了在中执委内部设立一个由3-15人组成的常务委员会的计划。起初，常委也只有国府主席何应钦、行政院长戴季陶与立法院长胡汉民三人，随后五院都有了常委名额，再后来中常委和中执委一样都变得臃肿不堪了。\n\n第三次改革方式也在付诸实施，即选出一个包括9名中常委员、6名其他中执委全会选出的中执委员的政治委员会，而国民政府委员会（内阁）也有无投票权的列席名额。孙科和胡汉民对该机构撰写了这样一份说明书：“政治委员会，为全国训政之监督与指导机关……对于党，为其隶属机关，亦即处理党务之机关……对于政府，为其根本大计与政策方案所发源之机关，但非政府本身机关之一。换言之，政治委员会实际总握训政时期一切根本方针之抉择权……为党与政府间唯一之连锁。”\n\n不过，还有人在呼吁要增加中央执行委员会、中央监察委员的委员与候补委员之名额，如果全盘接受，那总人数将超过200人！"
 YUN.lategame.475.a: "不亦祸乎……不过总有周旋余地吧。"
 YUN.lategame.475.b: "政治委员会也设立200名委员，不过只能有15位常委。"
 YUN.lategame.475.c: "整个体制都需要翻天覆地的革新！"
 YUN.lategame.476.t: "国民党政权的审计与纠举"
 YUN.lategame.476.d: "临时考试院和监察院的成立固然值得庆贺，但如同中国大多数事物一样，两院均深陷腐败无能的泥潭，而这些问题正是设立两院的初衷。考试院以原有的科举制度为基础，旨在清除不称职的政治候选人，并鼓励建立基于绩效和能力的政府。\n\n考试院拥有任命国家和省级公务员的最高权力，考试委员会则负责制定考生的考试时间、地点和形式，并设立一个临时考试委员会，人事部一直按照国民党官僚等级制度记录官员的履历。然而，这种冗余的官僚体系使高层官员获益，而底层官员往往无法获得稳定的收入。\n\n监察院旨在调查腐败，但随着考试院的扩张，规模庞大的政府导致监察院逐渐不堪重负。监察院是中华民国政府的监察和听证机构，理论上，监察院有权弹劾政府官员（不包括国府主席和副主席）、处分公职人员、采取处置措施，并有权审计年度预算。然而，鉴于腐败问题在中国政治社会中普遍存在，不少人考虑将监察院的年度预算挪作他用，另一些人则呼吁增加监察院的拨款。"
 YUN.lategame.476.a: "大力资助考试院。"
 YUN.lategame.476.b: "大力资助监察院。"
 YUN.lategame.476.c: "此钱自有好去处。"
 YUN.lategame.477.t: "教育的四项纲领与九大方针"
 YUN.lategame.477.d: "陈立夫的仕途虽然跌宕起伏，但作为教育家，他依然功不可没。在国民党临时全国代表大会上，他提出了一项大胆而全面的战时教育制度方案，其中包括指导我国教育改革的四项纲领、九大方针以及十七要点。\n\n四项纲领如下：1.）改订教育制度及教材，推行战时教程；2.）训练各种专门技术人员，予以适当之分配，以应抗战需要；3.）注重国民道德之修养，提高科学之研究与扩充其设备；4.）训练青年，俾能服务于战区及社会，以增加抗战力量。\n\n而九大方针分别是：1.）三育并进；2.）文武合一；3.）农村需要与工业需要并重；4.）教育目的与政治目的一贯；5.）家庭教育与学校教育密切联系；6.）对于吾国固有文化精神所寄之文学哲艺，以科学方法加以整理发扬，以立民族之自信；7.）对于自然科学，依据需要，迎头赶上，以应国防及生产之急需；8.）对于社会科学，取人之长，补己之短，对其原则应加整理，对于制度应谋创造，以求一切适合于国情；9.）对于各级学校教育，力求目标明显，并谋各地平均发展；对于义务教育，依照原定期限以达普及；对于社会教育与家庭教育，力求有计划之实施。\n\n尽管形势严峻，但这位银发绅士满怀勇气地去努力重塑中国人的思想。未来不会等着年轻人慢慢长大，中国要想度过这段艰难岁月，就必须教会年轻人去驾驭和克服未来的挑战。"
 YUN.lategame.477.a: "懂战斗，守纪律，青年一代方可勉力生存。"
 YUN.lategame.477.b: "爱科学，会生产，学生诸君必将创造未来！"
 YUN.lategame.477.c: "讲主义，勤奉献，后辈同志才能为国献身！"
 YUN.lategame.478.t: "乱世求学"
 YUN.lategame.478.d: "陈立夫的政治生涯虽然坎坷，但他仍是一位卓越的教育家。由于中国战乱频发，加上日本的威胁导致大批学生和学者西迁，陈立夫的工作无疑任重道远，用他的自己话来说：“矿冶工程师是发掘及冶炼地下物质资源的；教育行政人员是要发掘及冶炼人力资源的。两者的工作有可以类比的地方。并且教育工作在美国还有人称为‘人力工程’。”\n\n早在教育体系因战争而陷入混乱之前，外国观察家就已经注意到，中国教育体系的资源分配极不均衡，许多教师资质不合格，并且采用死记硬背等低效的教学方法来解决复杂问题。陈立夫则更为悲观，大多数高级课程都用外语授课，这既反映出外国影响力无处不在，也进一步导致普通中国学生难以获得技术教育。\n\n在短暂的相对和平时期，陈立夫召集了来自各所大学的数百名教授，召开了多场重要会议，编纂了数十套现代化的教学大纲和教材。教育部还试图减少高等教育机构人浮于事、标准松懈的问题，并将教师分为四个等级（教授、副教授、讲师和助理讲师），并对每个等级设定了明确的资质要求。\n\n陈立夫还坚持将课程重新划分为必修和选修两大类，并要求设立研究机构来研究化肥、猪鬃、桐油、茶叶、瓷器和丝绸。虽然陈立夫此举可能受到了中国传统经济理论的启发，但他坚称，这将有助于弥合先总理的国民经济建设计划与教育体系之间的差距。较无争议的是，陈立夫专门拨款设立了研究津贴与奖学金，并为符合资质的教授提供休假机会。"
 YUN.lategame.478.a: "华南之大，已经容不下一张平静的课桌了！"
 YUN.lategame.478.b: "为补己之短，应当注重课程的实践与传统运用。"
 YUN.lategame.478.c: "为优良教师及其项目寻来更多资金！"
 YUN.lategame.479.t: "中统在行动"
 YUN.lategame.479.d: "随着陈立夫的职权不断扩张，他领导下的国民党中央执行委员会组织部调查统计局也在努力工作。除了情报调查和收集这种写在名字上的本职之外，中统也具备通信辅助与反间谍职能。\n\n令中统引以为豪的是，他们在首都周边的数座城市运营着几家短波电台，这些电台的建立者李范一是一位在美国受过培训的短波通信专家。该无线电通信系统既可以用于加强政府内通信，也可以应用于战场之上，方便指挥部和主席官邸之间进行通信。\n\n除了通信工作外，中统也相当精通密码破译和通信安全工作。陈立夫总是随身带着一本密码本，他还亲自开发了一套名为“五笔检字法”的汉字检索系统，并试图在政府机关和公众中推广。\n\n众所周知，中统和CC系经营着众多外围组织。其中最大的是正元实业社，这是一个CC系用于转移资金和进行经济间谍行动的空壳公司。还有传言称，陈立夫珍视的中国工程师学会及其总部背后也是CC系的安全屋之一。\n\n但中统的行动也并非完全无拘无束。与CC系对立的蓝衣社最近就指控中统总务处主任丁默邨贪污腐败，要求调查他为拉拢某些著名左派叛逃者而申报的“招待费”。虽然丁默邨坚持认为这些指控完全是出于政治斗争，但他本就是一位前社会主义者，是在1924年的改组中才改变立场。这无疑增加了人们对他的怀疑，并使得他落得了一个见风使舵的名声。"
 YUN.lategame.479.a: "通信工作确保我国之团结。"
 YUN.lategame.479.b: "密码与谍务是本党之保障。"
 YUN.lategame.479.c: "查查他们的账本先。"
 YUN.lategame.480.t: "模范中国，模范警察"
 YUN.lategame.480.d: "在张群连同效忠政学系之警官的带领下，公安局取得了长足的发展。其公共活动的最前沿是[Root.Capital.GetCapitalVictoryPointName]警官学校，[ROOT.GetLeader]称赞其为各警察学校之标杆。超过350名青年男女学员在此处接受训练，享受着免费住宿与丰厚的月度津贴。\n\n警官学员们的训练基本是准军事化的。他们每天在起床号中醒来，参加升旗仪式，接着接受由军官与政委教导的冗长的游泳、柔术、军事学、政治教育课程。二年级学生则从行政治理、刑事调查、对外工作、女警训管四个方向选择一个主修。学员在培训期间就可以在当地警队服役，毕业后则可以配备枪支与现代化车辆。\n\n美国的影响力日益黯淡，但在中国警政系统中依然可见一斑。据说党警效仿的是在加州将犯罪率降低了一半的奥古斯特·沃尔默。警官们也效仿联邦调查局的专业经验，学习指纹鉴定等联邦警察的工作方法。\n\n也许最精锐的警察武装还是中国的宪兵。其作为国民革命军的分支，享有国府主席之亲卫的美誉。指挥宪兵的谷正伦人称”宪兵之父“，揭示“不说谎，不作假，守本分，尽职责。”为宪兵座右铭。他们是军事法的专家，致力于预防兵变。"
 YUN.lategame.480.a: "别无其他，唯赞颂优秀之学生与学校耳。"
 YUN.lategame.480.b: "现代调查之下，帮会势必退怯！"
 YUN.lategame.480.c: "宪兵会让军队安分尽责。"
 YUN.lategame.481.t: "特务处的权力争夺"
 YUN.lategame.481.d: "特务处起源于本党的军事委员会调查统计局第二处，不过后来的发展已经远远超过了母机构。在接受外国训练的秘密警察的帮助下，该处分出了甲、乙、丙和电讯班四个训练班——每班都有二三十位学员，要接受为期六个月的艰苦训练才能成为特务处的“基础人员”。\n\n乙班学员都是警校毕业生，一般被选为主席的亲卫。而丙处的学员则清一色由女学员组成，接受理发或是烹饪之类的培训，预备成为“掩护人员”。这一类特务在机关中一般从事一些“掩护工作”。\n\n甲班则被视为“骨干学员”，名义上由李士珍亲自教导（当然，日常教务工作是由其他军官开展的）。他们要学习特勤理论、密码密电、毒药化学、通信技术、军事地理、国际情报、政治理论、跟踪盯梢、爆破术、速写速记、情报收集、看相术、摄影术、柔术、中国功夫、开车骑马，以及外国语言——这可以算作本国精英间谍与刺客的最高课程。\n\n如今他们声名日盛、实力日强，如今已经试图全面控制党的情报工作。此外，他们还要求撤销保安团和宪兵队，掌管全国警务，同时也要在势头上压过三青团的情报机关。这些举动无疑盖过了其他机关的风头，他们纷纷要求[ROOT.GetLeader]从李士珍处夺走特务处，将权责再行公平分配。"
 YUN.lategame.481.a: "理应再扩编国府主席的亲卫。"
 YUN.lategame.481.b: "派特务去追捕那些反革命。"
 YUN.lategame.481.c: "现在特务该缩编了。"
 YUN.lategame.490.t: "《[YUN_GetDeclarationLocation]讲话》"
 YUN.lategame.490.d: "“如果放弃尺寸土地与主权，便是中华民族的千古罪人！那时便只有拼全民族的生命，求我们最后的胜利。万一真到了无可避免的最后关头，我们当然只有牺牲，只有抗战。如果战端一开，那就是地无分南北，年无分老幼，无论何人，皆有守土抗战之责，皆应抱定牺牲一切之决心！”\n\n在一片响亮的欢呼声中，[ROOT.GetLeader]向观众大声宣读了[YUN_GetDeclarationLocation]讲话，人们则回以“中华民国万岁！”的高呼。侵略者的铁蹄践踏着中华大地，对长期遭受压迫的人民犯下了无法形容的恐怖行为。每一个中国人现在都是时候加入保家卫国的行列、拯救危难中的中华民族了。[ROOT.GetLeader]已担任了为战时新设的总裁一职，[ROOT.GetSecondInCommand]则紧随其后组建了国防最高会议，以摆脱官僚主义约束，高效地执行那些紧急而必要的军事命令。出任总裁一职后，[ROOT.GetLeader]的地位已经能与先总理平起平坐，但这是危急形势下的必要之举——困难时期需要一位强有力的领导人来领导中国进行斗争。\n\n祖国的儿女们，快快响应号召。莫要旁观祖国沦亡哭号！枪在肩刀在腰，热血似狂潮。好男女报国在今朝！"
 YUN.lategame.490.a: "上下齐心，共克时艰。"
 YUN_GetDeclarationLocation_lushan: "庐山"
 YUN.lategame.491.t: "社会教育"
 YUN.lategame.491.d: "提高中国的识字率是一场旷日持久的斗争，也令教育改革家们头疼不已。战争打乱了他们的计划，可[ROOT.GetLeader]却决意要坚持下去。本党已经下令在控制区内修建一系列图书馆、博物院与美术馆，以此作为“社会教育”计划的一部分，让民众知晓，身为中国人究竟意味着什么。\n\n教育部长陈立夫命国立敦煌艺术研究所对西北地区的佛教遗址和文物进行研究，陈列于中央美术馆。他还趁热打铁，建立了国立社会教育学院、国立音乐学院，以培养可以体现中国现代性与道德的音乐文化。这些学校还常常录取一些背景常常不会为众人所重视的人，例如贫困无依者或是妇女。这些人最终得以得到教育机会，并运用他们学到的新技能来推广中国文化。\n\n陈立夫还努力推动了一个“电化教育办法”，以西方流行的留声片、广播等方式在全国进行推广。他还伴随着推行了诸如戏剧节、美术节、广播节、音乐节和体育节等一系列节日，以便在未来鼓励、发展现代中国文化。\n\n一些人批评陈立夫是在制造一种“思想控制”的形式，而他本人则予以强烈否认。他称马克思主义者常用宣传手段来渔利，那么保护民族文化便是现代政府的基本任务了。"
 YUN.lategame.491.a: "清醒的头脑，清澈的未来！"
 YUN.lategame.492.t: "德育教化处"
 YUN.lategame.492.d: "抗战的爆发并未阻止陈立夫和教育部孜孜不倦地向年轻人灌输，如何成为忠诚的党干部。陈立夫成立了德育教化处，旨在值此国难当头支持青年人学习，并在此期间教导、支持大学生。\n\n这是极必要的。即便在战前，诸如什么“毕业即失业”，“当学校里有一个学生时，社会就失去一个生产者；当一个学生从学校毕业出来后，社会就得到了另一个失业者。”的说法便大行其道；不过讽刺的是，战争的爆发倒是催生出不少岗位。而德育教化处则力求让毕业生、辍学生来肩负这些爱国的任务。\n\n而对于继续求学的学子，学务处奉命管理学生的贷款、减税、保健及征兵等程序。正如陈立夫所写，他一直在督导学生的行动，令这些年轻男女不会“被坏思想引上歧途，最终破坏战争工作。”\n\n为进一步减负，陈立夫还尝试精简教育。现存的中国大学倾向于使用美制的常规考、期末考模式，通过这些考试让学生获得毕业所需的学分。这种方法在美国行得通，但是在战乱频仍的中国，许多观察家更建议采取欧制：其他学年无期末考试，只有结业考试。而教育部则选择两头齐下：既可以通过学期考试获得学分，也可以通过结业考试直接毕业。"
 YUN.lategame.492.a: "教他们走上胜利的道路。"
 YUN.lategame.493.t: "征兵辩论"
 YUN.lategame.493.d: "中国人口基数大，但战争规模的扩大和兵员质量的下降引起了征兵问题的大辩论。军事委员会就何应钦1928年提出的征兵草案广泛征求了意见。根据他的意见，将在一年之内挨户做出调查，次年列出符合条件的男丁名单。这些男性将在保甲制下接受挑选，新兵将入营接受训练，随后在民团中服现役三年，接着服正役六年，最后转入续役到40岁。\n\n这样的民团制度基于何应钦在日本的观察，以及一些由新桂系首创的体系。该制度重在一个”平“字，即所谓征兵不论阶级贵贱之平等、依各省人口壮丁之多寡赋配比例之平均、办理征兵者以公平允当处理征兵事宜之平允的“三平原则”。并推行诸如补偿服役、为军人子女提供免费教育、减免税收等改革，以便从传统上不情不愿的士绅中募来更为年轻、合格的保甲军官。\n\n而实际上，征兵制并未做到所谓的“三平”：持枪强征、强拉硬抓之现象层出不穷。许多少壮派黄埔军官也抵制用素质不足的民团滥竽充数。\n\n教育部则提议推迟实行征兵制，称中国缺的不是壮丁，而是受过高等教育的人。陈立夫对此提出了四项基本原则：愿战者由政府应允从戎、体弱者继续向学、在学者毕业后报国、未役者须以教育立身。"
 YUN.lategame.493.a: "倾向于教育部的计划。"
 YUN.lategame.493.b: "军事委员会的计划是最好的。"
 YUN.lategame.500.t: "翦除荆棘"
 YUN.lategame.500.d: "盛大的欢呼浪潮席卷全国！白日终于照到了北京城，北洋政府的遗老遗少夹着尾巴逃跑了。胜利号角声甚至在[ROOT.Capital.GetCapitalVictoryPointName]都能听见。对于省内的其他人来说，这是一个庆祝的时刻，而对于李根源和朱培德来说，这是行动的时刻。\n\n长期以来，李根源和朱培德一直抵御着唐继尧的叛徒副手胡若愚的影响，因为胡若愚是云南保守势力的急先锋，同时他手中还控制着一支规模可观的军队。如今这一局面终于要结束了——不少人早就猜到这一结果。为了完成整合西南地区的最后一步，这两位省国民党领导人试图趁着胜利之际驱逐胡若愚，他们动员起李弥的部队，试图迅速包围胡若愚，促其投降。\n\n可胡若愚却事先得到了消息，他成功躲开了李弥的攻势，跑到自己位于蒙自的权力中心，并在滇南发动了一场小规模叛乱。这场由地方精英领导的叛乱得到了士绅和商人们的支持，而白日若想照耀从山巅到深谷的整个西南地区，这场叛乱就是他们将面临的最后一道重大阻碍。"
 YUN.lategame.500.a: "剿灭暴乱！前进！"
 YUN.lategame.500.b: "党国暴政！死吧！"
 YUN.lategame.501.t: "土木系政变"
 YUN.lategame.501.d: "胡若愚发动蒙自叛乱，西南局势再度变得动荡，而那隐藏在白日之影下的其他阴谋家绝不会作壁上观。随着何应钦在黄埔系中的失势，陈诚将军逐渐积聚实力，并趁此机会摊了牌。\n\n陈诚利用混乱的局势，不费吹灰之力便推翻了自己的国民党同志、贵州省政府主席张群。熊式辉和张群领导着政学系部队，迅速组织从贵州向云南撤退。土木系虽然暂时站住了脚跟，但陈诚和张群得出了相同的结论：一旦朱培德将军重新掌控云南，黄埔系将死无葬身之地。\n\n如果第三军能尽快镇压胡若愚的蒙自叛乱，那他们就能调头东进，重新确立对贵州的实际掌控。意识到这一点后，陈诚和罗卓英立即重新集结部队，从东北方向向昆明进军，试图掌控整个西南地区。同时他们也开始追击政学系的部队，以防止他们的袭扰。"
 YUN.lategame.501.a: "张主席的部队顺利撤退。"
 YUN.lategame.501.b: "陈将军的军队追亡逐北。"
 YUN.lategame.502.t: "两线作战"
 YUN.lategame.502.d: "随着滇南和滇东北的局势急转直下，朱培德及其忠诚盟友的部队陷入了重重包围。第三军的主力正在滇南前线对抗胡若愚，使得防御力量极为薄弱，难以抵挡陈诚发起的进攻。\n\n而那些留守昭通的部队也远非国民革命军的精锐。他们以张群和熊式辉指挥的政学系部队为主，这些刚刚从贵州撤退的部队士气低落，只知自保，昭通已危如累卵。\n\n朱培德召集了高级幕僚们举行军事会议，与李根源、朱德、金汉鼎和范石生等人商讨如何解决眼下的困境。会议上，他们大致分成了三个阵营：\n\n朱培德主张集中力量进攻蒙自的胡若愚，优先消除滇南威胁，再迅速回师迎击陈诚的进攻，但这么做就意味着把政学系部队当成了炮灰。反之，李根源提议从蒙自的后方调兵增援昭通，以充足兵力遏制第一军的推进，并趁机发动反击。显然这一方案在政治上对李根源最为有利，因为这么做可以保全张群的部队，从而增强政学系的地位。\n\n而李根源和朱培德还没来得及开始争吵，朱德将军就礼貌地提出了自己的计划：他建议第三军将包括滇南的李弥和滇北的张群在内的所有部队撤回防御阵地，并请求中央政府责令陈诚停止进攻。\n\n金汉鼎和范石生尚未表态，而他们的意见无疑将左右会议的最终结果。显然，每个计划都有其优点、缺陷和政治上的考量，同时也都并非必然成功的万全之策。金汉鼎陷入了友人、导师和上级之间的三难抉择。"
 YUN.lategame.502.a: "朱培德的方案——进军蒙自。"
 YUN.lategame.502.b: "李根源的方案——进军昭通。"
 YUN.lategame.502.c: "朱德的方案——请求中央委员会支援。"
 YUN.lategame.503.t: "陆良暴动"
 YUN.lategame.503.d: "无论朱培德的军事委员会最终制定了怎样的进攻计划，陆良暴动的爆发都让战局变得更加扑朔迷离。北伐之后，云南就一直活跃着大大小小的各种农村社会主义起义军，而这些起义军与闽赣根据地的部队完全相比是两回事。闽赣的起义部队在革命斗争中经常与土匪合作，而云南起义者则经常与那些同情他们的地区官员或其他建制派中坚分子合作。\n\n陆良县位于昆明以东、曲靖以南，此地居住着大量学生。王德三策划了一项相当雄心勃勃的行动，他成功拉拢了熊从周和其他县长，试图制衡那些士绅民兵的力量，而这些士绅多半正在南方支持胡若愚。\n\n最终，他们计划同时袭击云南境内的一批“土豪劣绅”，例如县团防大队长、大地主孙玉山，以及该地区的地下老大杨刀锋。然而，他们暗杀孙杨二人的努力以失败告终，起义随之陷入了困境。由于陆良地区相对孤立，暴动部队很难获得民众的支持，但胡若愚的叛乱和陈诚的推进导致局势混乱，他们的起义才得以坚持下去。\n\n新滇社内部有传言称，起义军计划争取朱德和其他同情他们的第三军军官的帮助，以获得更强大的武器，也有可能借助陈诚的改良派资历，与土木系取得联系。但第三军与土木系之间已势如水火，想要协调这两种选择绝非易事，更别提起义军的核心团体已经出现了矛盾。但王德三发动的这场微不足道的叛乱已经在昆明的防线上炸开了一个缺口，而这个缺口显然难以填补。"
 YUN.lategame.503.a: "朱德的部队赶到，稳定了当地局势。"
 YUN.lategame.503.b: "陈诚的先头部队破坏了昆明的防线。"
 YUN.lategame.503.c: "当地士绅取得胜利让胡若愚占据了先机。"
 YUN.lategame.504.t: "昆明动乱"
 YUN.lategame.504.d: "整个云南乱成了一锅粥，云南的省会昆明自然也好不到哪去。尤其是在朱培德最精锐的部队离开昆明之后，昆明的街头就陷入了无序。激进学生和城市工会纷纷站出来“保卫革命”，并开始与昆明的商业精英发生冲突，他们指责正是这些商人与胡若愚及其蒙自商帮勾结，企图颠覆政府。\n\n云南总商会则反咬了朱德及其盟友唐淮源、曾万钟等人，指责他们与省会的社会主义激进分子存在联系，试图发动社会主义政变。虽然朱德确实同情那些激进分子，但他一再宣誓效忠朱培德，认为自己不光是朱培德的下属，更是他的朋友。\n\n第三军的其他指挥官，如雄心勃勃的范石生和通情达理的金汉鼎对此的反应则是典型的左右逢源：金汉鼎同情社会主义，也是朱德最好的朋友，而他同样受到对朱培德的忠诚和自己的道德的约束。范石生则依然置身事外，等待着一笔对自己最为有利的交易，他甚至想要重建自己的第十六军。\n\n朱培德本人坚持反对总商会的指控，尽管可能存在某些证据，但他依然相信朱德的忠诚。另一方面，李根源敦促那些左派人士彻底下台，暗示他们对省政府已构成了严重威胁。同时，他建议对云南总商会采取和解性的态度，以确保财政不会断流。而在大多数人眼里，李根源和朱培德之间的旧日伤口显然再度被撕裂了……"
 YUN.lategame.504.a: "朱德不会背叛我们！"
 YUN.lategame.504.b: "采纳云南总商会和李根源的建议。"
 YUN.lategame.505.t: "第一军进军"
 YUN.lategame.505.d: "陈诚麾下的黄埔系部队从贵州一路高奏凯歌，坚定不移地向昆明挺进，现已成功跨过省境，最终抵达昭通。在进行攻城准备以夺取昭通之际，陈诚阵营内部亦暗流涌动，以钱大钧、蒋鼎文及态度最为激烈的关麟征为首的部分谨慎军官，公开反对陈诚的冒进策略。由于担心第一军战线过长，迷失方向，这些反对派军官结成庞大集团，延缓了部队前进。\n\n此外，陈诚的土木系因其自相矛盾的多面性质而开始承受巨大压力。土木系既有卫立煌这样的右派，也有何应钦黄埔系的残余势力，还有像陈诚这样自诩为“骨子里的社会主义者”的人，这导致该派系开始出现小规模内斗。雪上加霜的是，由于反对这场看似孤注一掷的进军昆明行动，那些追随陈诚的贵州军阀与他的关系正变得愈发紧张。\n\n在政策方面，土木系的内部斗争更加激烈。左翼试图与王德三领导的新滇社及其陆良起义势力结盟，希望推翻胡若愚和昆明当局。相反，陈诚阵营内部的右翼则真诚希望与朱培德及其第三军达成协议，而陈诚本人则始终坚持维系军队凝聚力不动摇。"
 YUN.lategame.505.a: "无论信条如何，革命者必须团结一致。"
 YUN.lategame.505.b: "妥协以避免流血事件。"
 YUN.lategame.506.t: "蒙自派的困境"
 YUN.lategame.506.d: "在乱局频发的云南，省内各地的事态也同样在迅速恶化，演变成一场政治风暴和血腥屠杀。胡若愚的滇南士绅联盟虽因反对国民党而结成松散联盟，但在其他方面却互相争斗，并开始扩张其势力范围。为了影响滇西——这片愿意抵制昆明影响的激进主义传统温床，胡若愚现已开始与当地大多数较为保守和反动的士绅进行谈判。\n\n在胡若愚的直属幕僚中，许多人建议他以外交手段应对危机，以争取云南当局的支持，并让省内恢复昔日稳定。另一些人则建议胡若愚采取进攻策略，与国民党激进分子公开对抗，力求在国民党内斗最激烈的时候迅速摧毁其政权。\n\n为了进一步巩固胡若愚的决心和地位，他的许多副官开始利用云南省内（例如云南总商会）与外界的联系。胡若愚与暹罗、缅甸和印度支那的潜在盟友建立了秘密联系，并开出大量许诺以换取盟友的物资和援助，从而巩固自身地位。\n\n尽管如此，云南内战依然势均力敌。为了巩固对云南的控制，胡若愚、朱培德和陈诚都不惜采取近乎自我毁灭的最后手段。可惜的是，最终只有一个人能够胜出……"
 YUN.lategame.506.a: "盟友的援助让胡若愚如虎添翼。"
 YUN.lategame.506.b: "昆明当局击垮了蒙自派的士气。"
 YUN.lategame.506.c: "激烈的战斗让双方都开始动摇。"
 YUN.lategame.510.t: "朱德起义"
 YUN.lategame.510.d: "昆明当局的处境确实岌岌可危，在叛乱与攻势的两面夹击下，即便省会坐拥天险，似乎也无法阻挡胡若愚和陈诚的猛攻。然而，胡若愚和陈诚竟未能撼动困守孤城的朱培德、朱德与李根源的坚固防御。与十年前向昆明进军的唐继尧相比，胡若愚的实力远不及他的昔日上司，他的进军势头已被彻底压制。在北方，尽管陈诚成功从第三军手中夺取了昭通，动摇了朱培德的合法性，但当他的军队迅速逼近戒备森严的省会时，也已经锐气丧尽。有鉴于此，一些激进的阴谋家开始在昆明暗中行动起来。\n\n在城内社会主义干部、工运组织者和激进学生的支持下，朱德领导的第三军左派军官迅速控制了昆明省主席官邸。第三军左派发动政变推翻了朱培德和李根源，并迅速得到了金汉鼎和范石生的支持——两人虽是云南国民党“右派”军官，却始终对左派合作持开放态度。\n\n从表面上看，朱德是打着让朱培德摆脱李根源影响的旗号，但事态却失控升级，最终导致朱培德被彻底免职。接替朱培德的是中央政府代表章伯钧，他被云南军政府“推荐”为省主席，不久后便获得了中央委员会的正式任命。\n\n陈诚颇为蹊跷地选择退兵，撤回贵州以巩固其省主席地位。至于胡若愚呢？显而易见的是，由于他的部队将在随后的进军中被全歼，他的末日已近在眼前。与此同时，现已沦为孤家寡人的政学系也是前途叵测。然而，人们心中仍有一个疑问：该如何处置朱培德？"
 YUN.lategame.510.a: "模范二朱，重修旧好。"
 YUN.lategame.510.b: "无论感情如何，朱培德背叛了人民。"
 YUN.lategame.511.t: "胡若愚进军昆明"
 YUN.lategame.511.d: "胡若愚的军队从蒙自直逼昆明，几乎未遇抵抗，国民党革命派显然已在云南不受欢迎。不堪重负的第三军驻军迅速被击溃，而龙云麾下参谋卢汉将军组织的城内起义则加速了这一进程。卢汉为亲人报仇，避免了长期围城。\n\n陈诚的部队在进攻旧滇系阵地时惨遭歼灭，自诩的黄埔精神最终沦为空谈。胡若愚和卢汉重组部队后，击溃了敌军，最终攻占了贵州。虽然两人名义上保留了国民党党员身份，并宣称对革命绝对忠诚，但国民党的真正拥护者已被逐出西南地区。\n\n随之而来的便是紧张的政治局势。尽管中央政府无暇顾及西南事务，对局势避而不谈，但讽刺的是，缺乏外部威胁反而使云南局势变得极不稳定。唐继尧对国民党来说绝对是不受欢迎之人，但龙云的立场则更具争议性。昆明驻军与滇省耆老曾短暂拥立龙云为督理，但他与长期竞争对手胡若愚（如今占了上风）之间的冲突导致双方互相指责对方犯下了反革命罪行。\n\n龙云原本希望依靠卢汉的支持来巩固自己日渐式微的地位，卢汉的军队正从贵州缓慢撤退。但卢将军却做出了一个决定命运的决定——背着龙云与胡若愚达成协议，同意承认胡若愚为督理，以避免进一步的冲突。虽然龙云也被邀请加入筹备中的军政府，但他已离开昆明前往昭通——他不愿充当傀儡，而是希望未来能有更顺风顺水的局面。"
 YUN.lategame.511.a: "云南重回反动统治。"
 YUN.lategame.512.t: "陈诚夺取昆明"
 YUN.lategame.512.d: "陈诚及其第一军以一次大胆的行动彰显了黄埔训练的价值。为了确保校长的教诲永远不会被遗忘或埋没，第一军从贵州一路向西南首府挺进，他们的英勇事迹堪称传奇。虽然此次进军让人不禁想起北伐失败后的长征，但陈诚的远征并非出于恐惧或悲伤，而是源自责任、精神和荣誉。\n\n第一军先是通过一场天衣无缝的政变推翻了政学系在贵州的统治，随后一路追击张群和熊式辉的部队，最终成功抵达昭通城下，并击溃了政学系的部队。\n\n面对势头正盛的第一军，士气低落的昆明守军仅进行了象征性的抵抗，陈诚便取得胜利，率部挺进城内。由于未遭长期围困，昆明大部分地区依然完好无损。然而，正当陈诚兵临城下之际，以朱德、唐淮源和曾万钟为首的第三军左派发动了内部政变。在朱德挚友金汉鼎和范石生将军的协助下，第三军异见人士成功拘捕了名誉扫地的朱培德、李根源和张群。\n\n在一片混乱之中，胡若愚试图利用昆明城内的对峙局面，从蒙自发动进攻。然而，由于情报匮乏，尽管胡若愚的部队拥有优势兵力，却在第三军和第一军的联合攻势下几乎全军覆没。\n\n尘埃落定后，紧张局势依然存在，云贵两省左派的政策分歧引发了诸多问题。朱德和金汉鼎希望释放朱培德，坚称他本无过错，旧政权的反革命行径均为李根源指使。陈诚则希望彻底改组云贵两省，名义上是为了巩固权力，并彻底“清除腐败”；与此同时，新滇社仍在呼吁立即采取断然行动。"
 YUN.lategame.512.a: "朱培德完全是被冤枉的！"
 YUN.lategame.512.b: "鉴于朱培德清正廉洁，可以对他网开一面。"
 YUN.lategame.513.t: "朱培德与李根源坚守昆明"
 YUN.lategame.513.d: "近来成为昆明政权防务重地的昭通城，如今再度陷入血腥梦魇。这座曾在上次滇黔战争中饱受摧残、尚处恢复阶段的城池，此番又遭到意图直取西南腹地的贵州入侵部队的围攻。然而此番战局却截然不同，这次滇军取得了英勇胜利。由于蒋鼎文的指挥失误导致第一军溃败，陈诚被迫下令撤退，此实为蒙羞之举。\n\n在胜利的鼓舞下，李弥指挥朱培德部对胡若愚在滇南集结的士绅武装发动了决绝、勇猛且近乎自杀式的攻击。李弥向来以严苛、混乱、凶悍的指挥风格著称，胡若愚部猝不及防间被他的迅猛突击打得措手不及。据说，李弥的炮兵在极近距离轰垮了胡若愚部防御工事。李弥还故意让少量部队陷入包围，使得胡若愚自认为胜券在握，试图围歼或俘虏李弥及其部下。然而，胡若愚却意外遭到了被围士兵的顽强抵抗。攻势受挫后，胡若愚部反而被李弥的外线部队合围，最终悉数被俘。\n\n固守要塞并击退侵略者的围攻后，朱培德和李根源仍然牢牢掌控着西南地区的主导权。朱培德正为张群和熊式辉的部队提供补给，并派遣政学系干将前往贵阳，就陈诚第一军的投降事宜进行谈判。与此同时，王德三的叛乱也几乎被彻底镇压。\n\n然而，一系列颇为微妙的问题随之而来——该如何处置这两个企图篡位的反叛者？朱培德和李根源应当释放善意，尝试与胡若愚及其部下和解吗？为了党的团结，他们应该向陈诚抛出橄榄枝吗？还是应该除掉这两个邪恶本性暴露无遗的煽动者？"
 YUN.lategame.513.a: "让蒙自派为我们效力。"
 YUN.lategame.513.b: "黄埔系已经翻不起风浪。"
 YUN.lategame.513.c: "决不能放过这两个心腹大患。"
 YUN.lategame.520.t: "西南请求仲裁"
 YUN.lategame.520.d_intro: "尽管国家正朝着统一大步向前，但并非每个省内部都像看起来一样风平浪静。而眼下最令人不安的还是滇黔二省的紧张局势。由于双方都要处理省内林立的山头，云南省主席朱培德和贵州省主席张群之间达成了一项尴尬的权力分享协议：朱培德要试图解决新滇社、第三军左派和胡若愚将军，而张群则必须面对何应钦倒台后由陈诚领导的国民革命军第一军残部。为了巩固对领土的控制，朱培德和李根源试图将胡若愚驱逐出省，然而胡若愚逃到蒙自的同时，陈诚也在贵州发动政变废黜了张群。张群匆匆逃亡昆明，而担心他死灰复燃的陈诚也紧随其后，挥师进军昆明。"
 YUN.lategame.520.d_NOTCHI: "$YUN.lategame.520.d_intro$\n\n陷入南北两面夹击的昆明政府向[ROOT.Capital.GetCapitalVictoryPointName]方面发信请求调解冲突，他们寄希望于[ROOT.GetLeader]能命令贵州方面撤军。但没过几天，新滇社的工团主义煽动者在陆良县组织了一场暴动，这使人们对朱培德的领导能力愈发怀疑，担心接下来会上演更大规模的社会主义者暴乱。甚至有消息称，朱培德的一些盟友如朱德、金汉鼎和范石曾等人，已经开始密谋反对朱培德。\n\n奇妙的是，叛乱的贵州省“主席”陈诚将军向[ROOT.GetLeader]发来消息，宣称自己对国民革命是如何尽职尽责，鞠躬尽瘁。陈诚宣称自己之所以从贵州进军昆明，不是为了争权夺利，而是为了伸张正义。他坚持认为只是在履行革命职责，赶走日益腐败的李根源、张群和朱培德。陈诚向来一言九鼎，但他最近的立场不断左倾，黄埔系正在和国民党右派日益离心离德。\n\n无论如何，我们必须对云南当前面临的严峻形势予以回应。云南的党部正四分五裂，互相攻讦。因此决定权落入了[ROOT.GetLeader]和[ROOT.GetRulingParty]手中，而他们必须尽快做出决定……"
 YUN.lategame.520.d_CHI: "$YUN.lategame.520.d_intro$\n\n遭到南北夹击的昆明当局已向[ROOT.Capital.GetCapitalVictoryPointName]致信请求调解冲突，期望[ROOT.GetLeader]的指示能够迫使贵州让步。然而随后数日，工团主义组织“新滇社”的煽动者在陆良县发动了起义，致使西南地区更广泛的社会主义事业濒临崩溃，这或将推动事态迎来终结。\n\n党代表章伯钧传递的秘密信息称，左派将领朱德以及同情他的右派军官金汉鼎和范石生准备在中央委员会的支持下发动昆明政变。章伯钧坚信，有了云贵地区的调解和中央军的增援，整个西南地区都有可能被纳入社会主义政权的掌控。显然，章伯钧的言外之意便是希望将西南地区归于“他的”治下，从而将又一省份置于临委会的统治之下。\n\n不仅如此，中执委最近还收到了叛乱将军、名义上的左派人士陈诚的电报。陈诚宣誓绝对忠于中执委和[ROOT.GetLeader]，坚称他的运动旨在清除西南地区的腐败。陈诚利用自己与邓演达的密切关系，辩称云南境内的社会主义势力过于弱小，无法长期控制该地区，转而提出只有他本人及其麾下的军队及土木系才能将该地区纳入革命的怀抱。"
 YUN.lategame.520.a: "命令陈诚带领他的人马撤回贵阳。"
 YUN.lategame.520.b: "让昆明自生自灭并默许陈诚行动。"
 YUN.lategame.520.c: "让章伯钧发动政变并谴责朱培德。"
 YUN.lategame.521.t: "[FROM.Capital.GetCapitalVictoryPointName]当局下场调解冲突"
 YUN.lategame.521.d: "据报，陈诚及其麾下部队已奉[FROM.GetLeader]之命撤回贵阳驻地！尽管“小委员长”完全遵从了中执委的命令，且整个撤退过程井然有序，但空气中仍然弥漫着遗憾不甘的氛围。然而，此时的昆明却洋溢着胜利的喜悦！昆明当局面临的北方威胁已被成功消除，且没有造成太多伤亡。\n\n在黄埔系第一军的威胁解除后，朱培德省主席成功整合了云南国民党军队，转而集中兵力打击南方的威胁，最终成功平息了胡若愚蒙自派的叛乱。凭借着李弥的大胆战术和第三军的强大火力，胡若愚部最终被击溃，大部缴械投降。\n\n尽管中央下场干预成功保全了朱培德与李根源的统治，但仍有一个问题需要解决。鉴于贵州民众对现任省主席普遍不满，中执委最终决定罢免张群的省主席职位，并明令由陈诚接任。\n\n险胜仍不失为胜利，朱培德与李根源在中央下场前成功守住了统治根基。然而，西南的政治格局已经发生了翻天覆地的变化，张群被正式罢免后，政学系几乎成了李根源的一言堂。与此同时，张群在西南政坛遗留的权力真空，最终由朱德的左派势力填补。\n\n尘埃落定后，一个问题依然悬而未决：胡若愚的部下该如何处置？胡若愚本人虽已失势，但他的部下悉数归降，其中不乏才干出众者。"
 YUN.lategame.521.a: "胡若愚的部下因其才能得以幸免。"
 YUN.lategame.521.b: "胡若愚的罪行其部下也有责任，不是吗？"
 YUN.lategame.522.t: "[FROM.Capital.GetCapitalVictoryPointName]当局在冲突中保持沉默"
 YUN.lategame.522.d: "虽然朱培德和李根源急切恳求中央委员会介入云南的困境，站在昆明当局一边做出决定性的干预。然而出乎预料的是，他们的行动却适得其反。虽然他们的请求被置若罔闻，但中央政府并非完全沉默。[FROM.GetLeader]现已正式宣布决定任命陈诚为贵州省主席。\n\n虽然中央没有明确谴责朱培德领导不力，但其影响显而易见。在这种势头的鼓舞下，陈诚麾下的第一军迅速攻占了昭通，政学系守军要么倒戈叛逃，要么成建制投降。当陈诚攻占通往昆明的战略要冲时，其迅猛攻势与当年国民党讨伐唐继尧时的首场大捷如出一辙。\n\n于是，本次冲突最终以几乎完全相同的方式落幕：昆明再度爆发内部政变。政变策划者逮捕了朱培德、李根源和张群。新成立的左派军政府由朱德、唐淮源、金汉鼎、范石生四巨头执掌，他们最初寻求与陈诚停火，并让朱培德继续充当云南的傀儡领袖。然而，由于陈诚态度强硬，四巨头的条件最终落空，他们最终只得接受陈诚兵不血刃进驻昆明的条件。\n\n随着[FROM.Capital.GetCapitalVictoryPointName]、昆明和贵阳三方之间的紧张谈判如火如荼地展开，人们几乎忘记了最初点燃战火的那根火柴。中执委的指示和内部政变在数小时内就有效平息了事态，与第一军和第三军的兵力相比，胡若愚领导的蒙自叛乱显得不堪一击。\n\n然而朱培德的命运仍然悬而未决，军政府四巨头希望释放他，事实上的“西南委员长”陈诚则迫切希望彻底抹除旧政权……"
 YUN.lategame.522.a: "朱培德将作为一名军人继续为国效力。"
 YUN.lategame.522.b: "遭到盟友抛弃的朱培德唯有隐退一途。"
 YUN.lategame.523.t: "[FROM.Capital.GetCapitalVictoryPointName]当局发动昆明政变"
 YUN.lategame.523.d: "虽然朱培德和李根源急切恳求中央委员会介入云南的困境，站在昆明当局一边做出决定性的干预。然而出乎预料的是，他们的行动却适得其反。由于在陆良起义的余波中暴露出意志薄弱与慌乱恐惧之态，致使二人向中执委发送的电文均遭冷遇。虽然他们的请求被置若罔闻，但中央政府并非完全沉默。[FROM.GetLeader]现已正式宣布决定任命陈诚为贵州省主席，以接替被罢免的政学系领袖张群。\n\n此外，中执委决心重拳出击，将政学系斥为反革命投机分子，认定他们已无留任必要并决定将之开除出党。消息传出后，在中央的默许下，云南省党代表章伯钧与朱德、金汉鼎和范石生策划了一场内部政变，同时动员党内干部、工会和激进学生，巩固了社会主义者对昆明的控制。\n\n随着朱培德、李根源和张群被推翻并迅速被捕，据报道，陈诚也遵照中央政府的命令停止了进攻，率领部下有序撤回贵阳，开始巩固自己的贵州省主席地位。北方的威胁消除后，朱德命令第三军镇压胡若愚领导的蒙自叛乱，并取得了辉煌的胜利。\n\n纵观全局，历经重重斗争，社会主义最终在西南地区宣告胜利。考虑到滇黔两省的保守特性，此番成就堪称开创式的重大壮举。然而，[ROOT.GetLeader]最终仍需决定备受争议的朱培德的命运，虽然有人称他直接参与镇压社会主义运动，但朱德等人却坚持认为他对国民党忠心不二。"
 YUN.lategame.523.a: "朱培德是一位尽职尽责的军人，也是我们的至爱亲朋。"
 YUN.lategame.523.b: "朱培德犯下了危害人民的罪行！"
 YUN.lategame.540.t: "故态复萌"
 YUN.lategame.540.d: "尽管在云南内战中取得辉煌胜利，但朱培德与李根源二人在此次危机中的行动，却暴露出朱-李二元政权日益脆弱的本质。当两人作为“西南王”几乎完全掌控全局时，往日宿怨自然浮出水面。此前，在驻粤滇军时期，李根源和朱培德曾是上下级关系，他们二人与李烈钧、杨希闵、刘震寰、范石生和张开儒等人并肩作战。朱培德一直是整个驻粤滇军中最忠于孙中山之人，因此在李烈钧和李根源的权力斗争中，他最终站在了李烈钧一边。由于李根源站在孙中山对立面，并坚持与旧桂系联手反对唐继尧，他最终被下属赶下台。\n\n当初的情况似乎即将再次上演，李根源正持续扩张权势，无论通过直接手段，还是借助士绅和政学系的支持。政学系领袖张群、胡若愚失势后，李根源便毫无顾忌地接纳了这些人的投效。考虑到李根源早已被党内主流唾弃，这无疑于事无补。\n\n然而，朱培德与李根源最近的争执在于两人治理云南的不同方式，以及是否需要与当地权贵谈判。朱培德始终是国民党的忠实拥护者，他坚持认为云南应当成为国民革命的齿轮，以及国民党未来征程的垫脚石和榜样。李根源则主张专注于云南地方建设，关注省内民众需求，并与建制派合作，建设一个惠及全民的强大省份。"
 YUN.lategame.540.a: "李根源说的对，云南需要照顾自己。"
 YUN.lategame.540.b: "朱培德的气魄占据上风！"
 YUN.lategame.541.t: "西南的国民党堡垒"
 YUN.lategame.541.d: "神奇的是，尽管李根源和朱培德身陷困境，争吵不休，且两人均诡计多端，污点重重，但他们却在西南地区真正建立了自己的独立王国。通过将贵州彻底并入云南，他们把国家的相当一部分地区纳入了西南二元革命政权的实际控制之下。他们不仅拥有雄厚的财政实力，还打造了一支颇有前途的军队，这让人不禁想起云南作为华南权力掮客的重要地位。\n\n尽管李根源和朱培德的政策缺乏连贯性且共识有限，但他们仍然建立了一个相当稳定的政府，并改善了广大群众的生活。在巩固了省内权力和边境安全后，两人开始讨论如何运用云南新近获得的影响力。他们也许会将云南打造为具备角逐全国实力的独立力量，也可能会专注于捍卫本省和国民革命成果，抵御那些企图践踏云南之人。无论如何，决定权始终在李根源和朱培德手中。"
 YUN.lategame.541.a: "保卫云南就是保卫革命！"
 YUN.lategame.541.b: "云南必须实现自力更生！"
 YUN.lategame.542.t: "西南的土木系改革"
 YUN.lategame.542.d: "政变成功后，“小委员长”陈诚的野心正随着他新扩张的领地而不断膨胀。陈诚不仅是贵州王，还统治着云南乃至整个西南地区，他得到了中央委员会的支持，并承担了由此带来的各种利弊。陈诚立即着手改造辖域，首先从他直接控制的地区开始。陈诚坚信，若想获得民众支持以对抗工团主义者等激进分子或士绅军阀等保守势力，国民党与国民革命军就必须彰显自己对乡村民众的天然关切。\n\n陈诚致力于推行彻底的革命性改革，以纾解民众长久以来的苦难，其目标直指颠覆中国现存的经济社会结构。虽然此举将摧毁总商会等既得利益集团的大部分现有财富，但陈诚认为这是救亡图存所必需付出的牺牲。\n\n陈诚希望将地租从占农作物年产量的60-70%降至37.5%，同时将年利降至20%，以此为他经济计划的进一步发展奠定初步基础。陈诚还希望通过实行配给制、以物易物和政府统一分配物资，以稳定物价并遏制领内的恶性通货膨胀。\n\n陈诚效法导师邓演达的政治理念，认为中国正处于前资本主义半封建社会，因此革命事业需要团结群众和国家资本主义的力量。陈诚以三民主义为指导，推行自己的纲领以及类似“耕者有其田”的政策，也与小资产阶级和军方保持着联系。陈诚雄心勃勃、坚定不移，他的实验性纲领旨在赢得群众的支持，推动社会进步，同时避免在士绅阶层中树敌过多。"
 YUN.lategame.542.a: "希望人民能够摆脱困境！"
 YUN.lategame.542.b: "陈诚的改革必将推动国民革命！"
 YUN.lategame.543.t: "土木系崛起"
 YUN.lategame.543.d: "在陈诚看来，国民党内部长期充斥着腐败无能的公务员、尸位素餐的官僚、自私自利的盗贼统治者，以及形形色色的贪官污吏。革命的纯洁性何在？对国民革命和黎民百姓的担当何在？人民需求何以满足？扶危济困何以践行？三民主义与天下为公的理想何以实现？以上种种都因私欲横流、人心涣散而付诸东流。然而对于“小委员长”来说，对症下药、整肃纲纪并非什么难事。\n\n陈诚决心在意识形态和革命实践上正本清源，为此，他已拟定了对国民党进行第二次有限改组的计划。虽然此次改组未能触及中执委层面，但至少滇黔两省将在他的努力下实现彻底革新。干部将被强制改造以恪守三民主义，擢拔标准也将由任人唯亲转向唯才是举。基于相同理念，陈诚还计划在未来筹建“三民主义青年团”。陈诚此举既为净化当下之党，更为铸造未来之党。他还努力让青年参与国家政策的制定，并将自己的革命理念融入党内。\n\n然而，陈诚的雄心远不止于此，幕后还有更加宏大的阴谋诡计、军事行动和刀光剑影。虽然陈诚非常满意目前的权位，但土木系内部却在传言，陈诚还有更远大的抱负，势必完成革命导师赋予他的使命。陈诚或将挥师出滇，守护这场用他鲜血铸就的革命。"
 YUN.lategame.543.a: "小委员长不过是民众的公仆！"
 YUN.lategame.543.b: "陈诚仍有未竟之事业……"
 YUN.lategame.544.t: "西南怒放社会主义之花"
 YUN.lategame.544.d: "经历了数年的斗争与一场云南内战之后，红旗终于在昆明上空升起，而这场成功的社会主义革命所带来的最意料之外的结果就是，云南的文学迎来了繁荣。尽管西南地区诞生过各种政治信仰的哲学大师，可这片土地一直偏向保守，抗拒着社会主义。但随着左派最近夺权上台，云南和贵州已经成为社会主义文学的乌托邦，吸引了众多的哲学家、艺术家、音乐家和理论家。\n\n在政治领域最有代表性的人物是艾思奇。艾思奇是出生在云南的蒙古族，是一位致力于社会主义的哲学家和理论家。艾思奇曾在日本学习，后来又自学德语，最终为《申报》工作，并于1935年加入了中国工团党。他是一位敬业、年轻、沉着的作家，并凭借于1935年出版的《大众哲学》一书赢得了相当的声誉。同时，艾思奇本人也是沈钧儒等民盟人士的朋友。\n\n其他声名鹊起的名人还包括著名的音乐家、作曲家聂耳。聂耳为许多电影和民族音乐做出了贡献，被认为是中国新音乐运动的先驱。还有著名的学生运动领袖、云南学联成员吴澄，吴澄是云南妇女运动与激进社会主义运动的领袖，她与龙云的亡妻李培莲是同学，与唐继尧的副官也关系密切。\n\n最后还有张伯简。张伯简是白族人，他曾赴法勤工俭学。他与周恩来等人是朋友，一直致力于向中国学生传播社会主义，对法国革命后的社会主义有深刻的理论和实践理解。\n\n曾经的云南是一个保守自封，拒绝改良的蛮荒之地，现在却成为了社会主义在中国的一片沃土，一处知识分子积极论辩的战场，以及这个国家未来的模板。当然了，云南还可以做到更多……"
 YUN.lategame.544.a: "云南将永远是社会主义的港湾！"
 YUN.lategame.544.b: "我们肩负的革命使命必将完成！"
 YUN.lategame.545.t: "《光明日报》"
 YUN.lategame.545.d: "章伯钧一直以来都既受人钦佩又遭人憎恶。党内右派人士因为他左倾而反感他，左派人士则因为他右倾而反感他，只有几位同志能给予他有限的安慰。章伯钧只有少数几个密友，比如和他有私交的陈铭枢与朱德。不过中国政界的某些派别一直对章伯钧及其努力表示了欢迎与支持，至少是表示了钦佩。作为张君劢、沈钧儒等人的朋友，章伯钧意外地赢得了这些新一代第三势力民主派人士的象征性支持。\n\n据悉，章伯钧最近多次与中国民主同盟的人物会面，渴望与他们进行谈判以实现共同目标。章伯钧向他的民盟朋友们提议组建一个省级政治联盟，他们似乎正在西南地区建立一个广泛的民主改良社会主义集团，至少他们在《光明日报》上的文章是这么说的。\n\n当然，这些努力不单单是为了纯粹的妥协。它们具有两方面作用：既能稳定章伯钧的政府，又能鲜明地表示章伯钧不像其他国民党同僚一样怀疑党外人士。章伯钧认为这一非正式联盟可以作为自己的武器和工具，用来在西南地区推进共同的进步事业。而还有一些人开始建议省主席把眼光放远，认为他的理想主义不应局限于滇黔一地，而应该放眼全国。"
 YUN.lategame.545.a: "统一而进步的事业！"
 YUN.lategame.545.b: "将目光投向全中国！"
 YUN.lategame.550.t: "护国军踏上征途"
 YUN.lategame.550.d: "国家正处于内战边缘，[YUN.GetLeader]匆忙赶赴[YUN.Capital.GetCapitalVictoryPointName]，试图控制国内乱局，并展现自身领导力。在一场由精心挑选的支持者和记者参加的盛大集会上，[YUN.GetAdjective]官员痛斥中央政府腐败暴虐、奉行修正主义，并驳斥了当局的叛国指控，转而声称主席背叛了孙中山的理想。这场集会最终以正式公告作结：拒绝承认中央委员会，并号召忠诚同志们组建新的中央委员会。\n\n这场庆典难以掩盖政府高层日益蔓延的忧虑。[YUN.GetLeader]发起了反抗中央政府的大胆豪赌。近期党内高层的危机虽然动摇了中央委员会的政治合法性，却不太可能从根本上改变战场态势。尽管[YUN.GetLeader]不断争取支持，但由于中央委员会的代表大会大肆镇压内部异见人士，高层内部仍未出现倒戈者。[YUN.GetAdjective]叛军只能寄望于其他边缘势力加入反抗，但这绝非定数。随着炮火不断轰鸣、步兵迅速布防，中国的命运很可能将在远离昆明权力中心的地方决定。"
 YUN.lategame.550.a: "我们再度踏上征途……"
 YUN.lategame.551.t: "昆明掌控全局"
 YUN.lategame.551.d: "昆明长期处于国民党革命运动的边缘地带，尽管从未被国民党直接控制，但这座城市乃至整个云南省都经常处于类似的圈子中。从蔡锷和李根源领导的重九起义（许多未来的云南国民党人均参与其中），到云南联合众多邻省共同推翻袁世凯洪宪帝制的传奇护国战争，云南曾多次与国民党并肩作战。然而，云南与国民党的分歧也比其他省份更为频繁，例如蔡锷拒绝参加1913年的二次革命，以及唐继尧对革命运动领袖地位与两广控制权的长期觊觎。\n\n因此，这位西南地区的地方霸主能够颠覆主流革命中枢的表面统治，并一路挥师东进击溃国民党中央委员会，以摧枯拉朽之势扫除旧秩序，实属意料之中。[YUN.GetLeader]的核心亲信和[YUN.GetRulingParty]对此心知肚明——虽然他们从未真正打算彻底铲除昔日恩人，但历史洪流却再次将他们推上了护国者的位置。\n\n旧政府垮台后，国民党外围势力的强势崛起已经无人可挡，但他们的领导地位依然存在争议。然而，这些争议并非来自党内的公开场合，而是来自民众、复员军人和经济部门。尽管国内仍有军阀势力存在，但中国未来数年的发展将取决于[YUN.GetLeader]能否迅速实现国家统一，以及国民革命进程中是否还会爆发更多冲突。"
 YUN.lategame.551.a: "誓竟全功。"
 YUN.lategame.600.t: "完成蔡锷的征途"
 YUN.lategame.600.d: "大约一代人之前，蔡锷宣布云南独立，脱离袁世凯所谓的“中华帝国”，这导致众多南方省份集体反对洪宪帝制，国家陷入内战。之后的历任南方政府未能完成将国家从北洋暴政中解放出来这一使命，直到今天——滇军最终夺取了中国古都的控制权。\n\n内战再起的后果不堪设想。战火导致无数生命消陨、家业倾覆，成千上万的家庭因军队调遣而流离失所，远征将士背井离乡跋涉千里后，也陷入了失序涣散的困境。为统一的下一阶段重整旗鼓需要数月时间，而国家全面恢复则需要整整一代人的时间。\n\n战场上的胜利赋予了广州政府足够的筹码，使其得以在首都再次召开重要会议。不过这一次，广州当局不再只是地方政府，而是以旧北洋政权的继承者的身份召开会议。会议邀请函已发往全国各地，几乎无人胆敢拒不出席。"
 YUN.lategame.600.a: "一个时代行将结束。"
 YUN.lategame.601.t: "第二次联省会议"
 YUN.lategame.601.d: "北京落入唐继尧之手，旧秩序随之瓦解。北洋残部或在负隅顽抗，或已投向我们的其他对手，不过至少目前城内抵抗力量已经减弱。新秩序正在冉冉升起——这一次，它将遵循广州政府的方略。\n\n唐继尧可谓当今的风云人物。曾经，唐继尧只是一个偏远省份的地方主官，在云南以外的战乱中屡遭羞辱，人们最多把他当成蔡锷的拙劣模仿者。如今，唐继尧却成了未来统一共和国的预定总执政。事实上，命运似乎将国家交到了南方人手中，鉴于中国历史上大多是北方统一南方，此次南方主导统一实属罕见。\n\n但唐继尧将如何统治国家？作为总执政领导一个未获多少认可的地方政府是一回事，成为中国的中央政府则是另一回事，尤其是他还领导着一场表面上致力于赋予各省权力的运动。联省派历来是中国政坛中的一个奇特群体——他们熟悉旧体制，并经常与之交织，而在其他方面却宣称自己是一场新的改良派运动。\n\n随着形势逐渐有利，联省派在即将到来的选举中占据了上风。为了在新政府中谋得一席之地，许多战败的北洋议员恳求加入胜利的广州政府。若想维持稳定，至少须吸纳部分北洋议员，但在开启新秩序的重要时刻，唐继尧手握重权，足以奠定未来基调。民主二字向来众说纷纭，如今共和国正屏息以待，看这位新任总执政将如何诠释民主定义。"
 YUN.lategame.601.a: "民主意味着北洋腐败风气终结。"
 YUN.lategame.601.b: "民主意味着法律面前人人平等。"
 YUN.lategame.602.t: "《我们走哪条路？》"
 YUN.lategame.602.d: "唐继尧及其盟友正沉浸在胜利的荣耀之中，但还有许多人渴望着自己的胜利。近日，新月社活动家重新发表了一系列在直系统一后写作的文章，其中最著名的是《我们走哪条路？》，这篇文章堪称新月社的开创性政治宣言。\n\n在文章中，新月社抛出了两个问题。第一个问题是：我们要铲除的是什么？新月社列举了五大仇敌：贫困、疾病、愚昧、贪污和扰乱。值得注意的是，资本主义、帝国主义和封建主义被新月社排除在外，然而这三者却是许多知识分子最痛恨的敌人。新月社认为，中国当下还不是一个资本主义国家，封建制度则早已在两千年前就已经崩坏了。如果中国没有被内部的“五鬼”削弱，帝国主义就无法乘虚而入。新月社据此指出，将责任归咎于外部敌人会转移人们对内部问题的注意力，这反映了他们所接受的世界主义和西方教育——这招致了来自各个政治派别的批评。\n\n最重要的是，正如当初没有公开声讨曹锟，新月社如今也没有公开谴责唐继尧，这为双方带来了结盟的可能。当然，诸如《我们要什么样的政治制度？》、《论社会主义》和《我们要金融控制权》等后续文章最终确实引起了直系的关注，但新月社始终更关注第二个问题：我们要建立的是什么？他们对此含糊其辞，只是呼吁建立一个安全、繁荣、文明、现代、团结的国家，并能够通过良好的法律来维护和平、社会服务、基础设施以及公平发达的经济体系。\n\n但该用什么法子，走哪一条路，才可以走到那目的地呢？革命具有破坏性，会将暴力变成一种习惯。演进太慢，而且保留了太多过时的元素。因此，唯一的办法便是走第三条道路——自觉的、和平的改革。"
 YUN.lategame.602.a: "唐继尧定会给我们带来自觉的、和平的改革。"
 YUN.lategame.602.b: "真正的改革需要真正的民主。"
 YUN.lategame.603.t: "北洋势力洗牌"
 YUN.lategame.603.d: "北京城迎来了新主人，失去主导地位的旧北洋党派纷纷努力适应新秩序。许多北洋领导人预感到新政权的动荡局势，为了规避风险，遂暂时作壁上观，转而让他们的下属在联省立法机构中充当干脏活的白手套。\n\n旧北洋体制由独立人士主导，至少名义如此。自从袁世凯与同盟会爆发冲突后，有组织的政党便遭到猜忌，许多北洋政客珍视其独立性，遂结成众多非正式派系与社团。许多独立人士至今仍在活跃，并希望利用自己的追随者、恩庇网络和政治机器在新政权中保持影响力，从而保住自身权位。\n\n许多北方左翼人士加入了新兴的反对派，尤其是与全国各界救国联合会有联系的人士。胡适和其他前新月社成员已开始与罗隆基派系密切往来，但也没有排除与总执政合作的可能性。国民党和中国工团党等社会主义革命政党遭到了严厉镇压，国工两党中央委员会也会明令禁止党员参与联省派政府。\n\n梁启超系经历了最为显著的转变。中国宪政党曾是国会中仅次于和谐社团的最大正式政党，宪政党在领导层加入共盟后解体。宪政党的少壮派分支则与张君劢的民社党前成员合作，共同组建了民主宪政党。中国青年党虽欲借宪政党成员出走之机牟利，但他们同时也在和唐继尧派暗通款曲。"
 YUN.lategame.603.a: "唐继尧对梁启超思想的拥护为他赢得了北方盟友。"
 YUN.lategame.603.b: "罗隆基和新月社轻松地与老朋友重新建立了联系。"
 YUN.lategame.603.c: "北京的独立人士们拼尽全力捍卫自己的现有地位。"
 YUN.lategame.604.t: "中国民主同盟"
 YUN.lategame.604.d: "会议最终发布了几项概括声明，宣布与会各方一致支持唐继尧总执政及其重建计划。唐继尧感谢会议对他的信任，誓言将继续进行解放战争，并承诺在统一后举行联省民主选举。虽然唐继尧目前承诺组建一个民族团结内阁，但迄今为止，他只挑选了忠诚党员出任要职。值此国家风雨飘摇之际，唐继尧恳请各界继续予以信任。\n\n那些对依赖这位承诺改革的新强人持谨慎态度之人并没有保持沉默。就在会场数街之隔处，许多前中国民主政团同盟成员齐聚一堂，他们从原组织名称中删去“政团”二字，公开宣告组建“中国民主同盟”，此举暗含整合各党之力、要求组建联合政府的深意。\n\n中国民主同盟推选罗隆基担任主席并起草《民主同盟政纲草案》，该纲领主张建立联省民主共和国，实行两院制国会、三权分立、普选制度及教育机会均等；提出经济民主化主张，要求军队国家化，并规划逐步迈向无阶级的社会主义社会。该纲领由参与组建民盟的多位前任政党领袖共同签署，此举被视为寻求在革命与渐进式发展之间找到民主道路的所谓“第三条道路”运动的一项重要独立举措。\n\n这场运动的影响波及了整个中国政坛。如果民盟能够真正保持团结，那么在中国宪政党被纳入唐继尧的政治机器后，民盟将成为民主反对派的基石。民众对此既怀热切期待，又深恐引发总执政的强力反制。更糟糕的是，民盟很可能因政治效能缺失，最终沦为当权者粉饰门面的象征性反对派。"
 YUN.lategame.604.a: "民盟将捍卫我们共和国的民主。"
 YUN.lategame.604.b: "民盟只会像往常一样满腹牢骚。"
 YUN.lategame.610.t: "[UPC.Capital.GetCapitalVictoryPointName]召开联省会议"
 YUN.lategame.610.d: "唐继尧在成功攻占北京后，决定在[UPC.Capital.GetCapitalVictoryPointName]再次召开联省会议。各地代表纷纷涌入这座城市，期盼在国家重建与军事整编的讨论中发出自己的声音。\n\n然而，会议局势迅速明朗化——代表们开始分裂为总执政的支持者与日渐壮大的反对派。大批怀疑唐继尧民主承诺或对其统治不满者，已聚集在学者罗隆基周围。鉴于全国选举须待统一后方能举行，此次会议或成民众表达不满的唯一机会。\n\n对于拥有高度自治权的[ROOT.GetName]地区来说，我们的表态有着举足轻重的分量。唐继尧的代表敦促我们展现团结姿态，反对派则恳请我们表明立场支持他们。然而人们不禁要问，双方是否会尊重联省运动保护省级自治的承诺。或许，此刻正是我们表达自身独特立场的时机。"
 YUN.lategame.610.a: "唐继尧得到了我们的大力支持。"
 YUN.lategame.610.b: "反对派有权发出自己的声音。"
 YUN.lategame.610.c: "我们需要提出独属于自己的意见。"
 YUN.lategame.611.t: "[FROM.GetLeader]支持唐继尧"
 YUN.lategame.611.warlordintro: "无论是在昔日的直系体制下，还是在如今我们的联省体制下，[FROM.GetNameDef]的领导人都一直保持着相当大的自治权。像他们这样的地方政府往往独立于中央政府，且掌握着大量军事和经济资源，还会利用这些资源迫使中央做出重大政治让步。然而，军阀领导人狡猾多变，反复无常——时而忠诚，时而野心勃勃。"
 YUN.lategame.611.d: "$YUN.lategame.611.warlordintro$\n\n目前，[FROM.GetRulingParty]似乎决定为唐继尧效力，[FROM.GetLeader]发表了支持总执政的讲话，[FROM.GetAdjective]当局则拘留了当地反对派活动人士。他们或许是想讨好总执政，也可能是想借机清除自己的敌人，但这似乎算得上是一份厚礼。另一方面，他们的对手终究不值得信任。"
 YUN.lategame.611.a: "感谢[FROM.GetLeader]的支持，他日定将回报。"
 YUN.lategame.611.b: "唐继尧谴责他为了维护自身名誉而采取暴力行动。"
 YUN.lategame.612.t: "[FROM.GetLeader]庇护反对派"
 YUN.lategame.612.d: "$YUN.lategame.611.warlordintro$\n\n目前看来，[FROM.GetRulingParty]似乎决定向罗隆基的反对派伸出援手，[FROM.GetLeader]发表讲话，支持快速推进民主化，[FROM.GetAdjective]则为当地反对派活动人士提供庇护。他们或许是真心希望未来实现民主，也可能只是想削弱总执政的权力，但这似乎的确是一份厚礼。另一方面，军阀终究不值得信任。"
 YUN.lategame.612.a: "罗隆基全心全意地接受与[FROM.GetLeader]的结盟。"
 YUN.lategame.612.b: "反对派与军阀划清界限。"
 YUN.lategame.613.t: "[FROM.GetLeader]谴责中央集权"
 YUN.lategame.613.d: "$YUN.lategame.611.warlordintro$\n\n目前看来，[FROM.GetRulingParty]似乎已决定走上独立道路，向所有愿意倾听之人强调联省运动需要维护省级自治，避免中央政府的暴政。虽然[FROM.GetLeader]没有直接点明，但他仍含蓄地否定了滇系军阀的领导地位。这样一位声名显赫的地区领袖发表如此言论，对共和国的未来而言可不是一个好兆头。"
 YUN.lategame.613.a: "唐继尧开始强调自己的联省派资历。"
 YUN.lategame.613.b: "罗隆基借机谴责军阀行径。"
 YUN.lategame.614.t: "我们的努力遭到驳斥"
 YUN.lategame.614.d: "表面看来，联省政治俨然是一场仅限云南人参与的游戏。当云南政客们抱团排外之时，我们试图援助[UPC.Capital.GetCapitalVictoryPointName]的盟友竟被斥为不受欢迎的军阀干涉。但他们必将为此后悔，我们的声音绝不会被压制。现在全国人民都知道了真相——云南联省派从未打算容纳其他声音。"
 YUN.lategame.614.a: "未来的不祥之兆。"
 YUN.lategame.630.t: "军阀间的摩擦"
 YUN.lategame.630.d: "随着滇军不断向国家统一迈进，滇系政府领土逐渐扩张，军队也承担了双重任务：既要管理“解放区”，又要攻占敌方领土，最终形成了省内与跨省的复杂军备网络。由于“新”军阀不断涌现，这自然引发了军阀内部的紧张局势。\n\n在真正同情我方和盟友的地区，原有的行政管理基本保持完整，并保留了不同程度的自治。在存在叛乱、游击活动或特别动荡的地区，地方政府实际上已在戒严令下重建。虽然滇军确保将滇系亲信安插在重要岗位，但此举却引发地方剿匪司令、省级军阀势力与地方县长三者间的权力冲突。\n\n唐继尧作为中央政府强硬“调解人”和“仲裁者”的角色颇为可疑，他自以为是频繁插手地方事务的做法，导致民众对他和滇军的怨恨日益加深；而唐继尧的惯用手段便是安插亲信。\n\n滇军在控制区扩张势力的同时，唐继尧的个人影响力亦突破省域局限扩散至全国乃至境外；这部分源于唐继尧在国内的知名度，但更重要的是滇军在国内的特殊地位。通过从头重建占领区的各省，滇系实际上已在部分地区取代国家职能，这让唐继尧和滇军掌握了难以撼动的绝对权力。"
 YUN.lategame.630.a: "对于护国功臣来说，这是最公正的情况！"
 YUN.lategame.630.b: "唐继尧这是寻求用他的军队来取代国家！"
 YUN.lategame.631.t: "战时民主"
 YUN.lategame.631.d: "随着军国主义倾向日益高涨，全国笼罩在持续不断的战争阴云之下，民主和自由思潮也遭遇了许多限制。这在坚韧的政治家与精英知识界中引发了激烈争论：权利和自由是否应该受到限制？在战争时期维护民主是否切实可行？又该如何应对叛乱分子、间谍活动及国内稳定之挑战？\n\n罗隆基在《自由论坛》撰文，宣称自己找到了解决方案。针对战争期间应大幅限制个人权利和自由的提议，他引用哈罗德·拉斯基的言论予以反驳。罗隆基认为，无论是战时还是和平时期，人们都应当享有自由，否则民众将既无斗志，更不愿为战争作出任何贡献。\n\n为了佐证自己的主张，罗隆基援引了英国革命和美国内战期间的军事失败案例，并指出对公民权利的严格限制乃至剥夺，是政府失去民众支持的主要原因。\n\n罗隆基所支持的并非专制或压迫性政府，而是一种得到国会支持的“领导力政治”。总执政可以行使特别权力，但必须经人民、国会和所有政党同意。当国家利益高于个人、党派和集团利益时，人民无需承受权利限制，便能激发出强烈的爱国精神。\n\n这种伟大的爱国主义理念超越了党派界限，建立在对法治的尊重，以及对政治“游戏规则”的尊重之上，即维护公平竞争、个人自由和不受军方影响的政治伦理。国家唯有保障言论自由、政治参与自由并推行政治改革举措，方能凝聚这股伟大的爱国力量，从而避免军事独裁带来的巨大危害。"
 YUN.lategame.631.a: "无论何时都要培育民主。"
 YUN.lategame.631.b: "用民主粉饰门面只会导致国家衰落。"
 YUN.lategame.632.t: "北洋人士与民治党"
 YUN.lategame.632.d: "从西南的地区势力崛起，登上全国舞台后，民治党自然获得了大量支持者，甚至新增党员人数也创下了纪录。但与此同时，民治党也吸纳了一大批所谓的“养子”，即前北洋政府的拥护者、旧皖系、直系、奉系以及介于三者之间的小派系，这些北洋人士都加入了民治党的阵营。\n\n在唐继尧的庇护下，这些原本效力于近乎独裁政权的北洋人士，如今已有机融入民治党内，协助国家行政与官僚体系的运作。由于唐继尧本人曾受到梁启超的思想启发（甚至与梁启超的思想高度契合），他也成功将许多中国宪政派人士拉拢到了自己的阵营，让他们在国家政治生态中占据了一席之地。\n\n章太炎则反对将北洋人士纳入民治党内，并坚称他们不过是些官僚和集权主义者，企图稀释中国联省主义的纯粹理想。章太炎呼吁维持北洋人士的“独立”地位，至多与他们开展务实合作，而非将他们纳入党内。但总而言之，章太炎被认为年迈力衰，难掌实权，不过是新时代里的老古董罢了。\n\n这并不意味着章太炎的观点毫无影响力，继承其思想与政治衣钵的汪东与汪荣宝兄弟，正试图在唐继尧的务实路线与章太炎的理想主义之间开辟一条折中之道。汪氏兄弟堪称各自领域的巨擘：汪东是章太炎的门生之一，甚至被视作其接班人；而汪荣宝则以外交家、驻外大使、宪法起草者以及前进步党人身份闻名于世。\n\n考虑到对出色官僚的需求，以及对联省主义更加务实的解读，汪氏兄弟指出，虽然立宪派和唐继尧都根植于梁启超思想，但这些北洋建制派本质上不过是一群没有灵魂的空壳，愿意为任何人效力。"
 YUN.lategame.632.a: "唐继尧永远是对的，我们需要出色的官僚。"
 YUN.lategame.632.b: "这是一场带来变革的政治运动！而不是发财致富的渠道！"
 YUN.lategame.632.c: "只有真正的信徒才能在我们的政府中脱颖而出。"
 YUN.lategame.633.t: "民盟集结反对腐败"
 YUN.lategame.633.d: "在庞大的唐继尧政府里，有如此多的私人资产在手中流转，就必然会有一些东西……落入黑暗的地下世界，最终导致组织纪律松懈、贪污腐败滋生。即使唐继尧本人有时也会参与其中，但这并不意味着他对腐败迹象毫无警惕。当然，与政府腐败密切相关的是当局层出不穷的威权措施。\n\n越来越多的人开始呼吁那些备受追捧的自由，包括言论和思想自由。在如此热烈的诉求之下，勤学善思的罗隆基俨然成为了这些呼声的代言人。罗隆基提议允许各民主党派扩大组织规模，增强实力，使其享有与民治党同等的地位。这将使所有对政府不满的民众都能以民主和平的方式表达自身诉求，而非诉诸革命手段或陷入普遍的冷漠。\n\n罗隆基继续强调自由民主的真谛：“所以说言论自由，是有什么言，出什么言；有什么论，发什么论。无事不可言，无事不可论。争人权的人，先争法治；争法治的人，先争宪法，宪法是人民监督政府的手段。”\n\n鉴于任何威权措施最终都将滑向独裁，罗隆基认为当局“在公民心中灌输恐惧、被动、依赖和奴性”。为了实现积极的公民民主，罗隆基倡导恢复“所有价值标准”和“积极思维”。\n\n最后，罗隆基谨慎地表示，他倡导的并非绝对的自由，而是有限制的自由。这种自由不会伤害他人的精神和智力健康，也不会损害人格尊严。"
 YUN.lategame.633.a: "追求自由至高无上。"
 YUN.lategame.633.b: "只要他接触现实，那他肯定会改变想法。"
 YUN.lategame.634.t: "集体主义与个人主义之争"
 YUN.lategame.634.d: "虽然唐继尧和章太炎无疑是一对良师益友，但他们对中华联省政府的愿景近来出现明显分歧。随着反唐抗议和异见开始在民众、知识分子，甚至部分军队中蔓延，即便唐继尧和章太炎秉持着相似理念，他们二人的冲突也在日益加剧。受章太炎和梁启超的影响，唐继尧的政治倾向逐渐趋向梁启超早期的威权家长制，而非章太炎那种独树一帜的个人主义。\n\n章太炎在1903年至1906年因从事革命活动而入狱期间皈依佛教，并将宗教视为反抗集体主义的一种形式。与梁启超不断强调中国人民是一个集体的“整体”群体认同的观点形成鲜明对比的是，章太炎试图将宗教作为一种在国家内部维护自我认同的方式，甚至将宗教用于为革命事业而自我牺牲。\n\n此后几年里，章太炎进一步发展了自己的观点，曾于1906年至1908年间在《民报》上撰文强调，佛教是一种超越民族主义的力量，是一个民族内部的精神统一力量，能够将五族团结成一个共同的整体。然而，他并不主张设立国教，而是奉行“己所不欲，勿施于人”的金科玉律。在章太炎看来，“真正的平等源于摆脱善恶对错的观念。”\n\n章太炎晚年虽然愈显老态，但他仍秉持着特立独行的个人主义精神。章太炎愈加频繁地就个人权利与自由问题与唐继尧据理力争，并旗帜鲜明地反对梁启超的集体主义斗争思维。章太炎的思想重新获得了同样秉持个人主义立场的政治中间派支持，他们希望章太炎能够在唐继尧的铁腕统治下，建立一个更加自由的联省制中国。"
 YUN.lategame.634.a: "章太炎的个人主义保障了自由！"
 YUN.lategame.634.b: "梁启超的遗产就是集体的力量！"
 YUN.lategame.635.t: "民盟遭遇挫折"
 YUN.lategame.635.d: "尽管民盟在一年前还处于辉煌时刻，但如今其发展势头却开始步履蹒跚。民盟不仅难以确立清晰连贯的目标，甚至无法确认自身定位，更遑论达成行动纲领共识。在内部讨论中，有人质疑民盟究竟是一个真正的政党，还是多个党派组成的联盟。尽管一些领导人声称民盟有10万名党员，但张君劢本人也承认，没人真正了解民盟有多少成员。\n\n罗隆基继续强烈主张民盟应以正式政党的形式存在，并试图迫使所有民盟下属政党自行解散，再以个人身份重新加入民盟。然而，罗隆基的主张遭到了民盟内部大多数人的反对，他们认为这些主张荒谬至极，将党内领导人和有影响力的政治家降格为普通党员。\n\n主要领导层此前也曾尝试加强民盟的组织建设，但最终因“需要先加入民盟下属政党，然后才能单独登记为民盟成员”的规定而失败。\n\n民盟的内斗导致许多努力奋斗的成员互不信任。上海自由派杂志《观察家报》的主编储安平批评民盟“脱离现实”且“先天不足”。储安平指出，民盟成员几乎全是资深学者，没有一个政治家，反对直系是维系他们团结的唯一纽带。\n\n雪上加霜的是，民盟作为中间阶层和有力反对派的地位，正在受到中国青年党的挑战，青年党凭借既定政治立场获得了更强的实力。总而言之，民盟的衰落很大程度上是由于自身缺乏远见，民盟无疑需要时间来恢复元气并进行深刻反思。"
 YUN.lategame.635.a: "民盟必须迅速采取行动整顿自身组织！"
 YUN.lategame.635.b: "唐继尧利用民盟的弱点来为自己谋利。"
 YUN.lategame.635.c: "中国青年党和独立人士导致事态复杂。"
 YUN.lategame.660.t: "省长与军阀"
 YUN.lategame.660.d: "在迂回曲折的军阀时代之中，横生事端的鼓吹者和饱受诟病的革命者之间，人们常常忽略了一个事实，即政府官员和军阀的权威，最终仅取决于他们的地位是否得到了某个更高权力或机构的认可。成为“合法”政府官员意味着什么？对于军阀身份的界定，不同人有着不同的标准。\n\n诚然，颇具影响力的地方精英（无论是文官还是军官）与军阀之间本就没有清晰的界限。更棘手的是，还必须考虑军阀的“出身”——这个军阀仅仅是“地头蛇”吗？还是比土匪强不了多少的地方军阀？抑或是能够称霸全国、影响深远的省级军阀？\n\n南方政府发起统一全国大业后，唐继尧政府在消灭了众多军阀的同时，也不得不依靠众多军阀征战四方，甚至在某些情况下构建了全新的军阀政治机器。目前看来，局势尚且稳定，但随着政府不可避免地日益强大，军阀势力必然会进一步发展壮大，最终成为改革进程乃至唐继尧权力的一大阻碍。\n\n然而，如果此时对军阀势力进行打压，很可能会迫使他们收容各方政治反对派，用枪杆子为这些文人撑腰。龙云和刘震寰等小军阀已经表示，一旦自己的权力被削弱，那他们就会采取类似的行动。如果这种情况真的发生，军阀们无疑将不再漠然顺从唐继尧，但只要国家事务不损害军阀及其权力基础，那他们便会继续俯首听命。\n\n但问题依然存在，唐继尧会袖手旁观，任由他的政府私相授受、滥用权力，公然藐视他所坚持的军政分离原则吗？甚至公然违抗民主制度本身？"
 YUN.lategame.660.a: "这帮军阀以为自己算老几？"
 YUN.lategame.660.b: "老虎屁股摸不得。"
 YUN.lategame.661.t: "封建主义与联省主义"
 YUN.lategame.661.d: "当人们提及“封建主义”一词时，脑海中浮现的可能是领主和贵妇们以某种荣誉纽带或其他方式统治着自己的封臣，然而这种契约关系早已湮没于历史长河之中。很少有人会认为封建主义与当下的军阀们有任何关联，从字面意义看来，也不会有多少人把联省主义和封建主义联系到一起。\n\n至少在传统的儒家语境中，“封建”一词曾经就是指代与皇权抗衡的地方自治。但在现代，封建却成了歧视、压迫和倒退的代名词。\n\n封建一词最早出现在古典诗歌中，意指天地交感、万物圆融之境界。然而直到近代，“封建”才开始被解释为“封建主义”。严复以西方视角解读该词，认为封建大致等同于自治，章太炎则倡导一种基于严复定义的“封建”联省制度。\n\n在章太炎的封建理论框架下，当局应侧重于培育地方制度与自治精神，这与梁启超等“郡县”改良派追求中央集权和统一民族国家的想法截然不同。在章太炎及其联省派同僚看来，中国联省主义与“封建”密不可分。章太炎于1920年提出的“联省自治”一词，实际上直接受到了明代大儒顾炎武和王夫之倡导封建的影响。\n\n因此，封建的内涵在于不惜一切代价维护地方自治以抵御外来威胁。清朝的中央集权导致中国丧失了与其他大国共同实现现代化的能力，而北洋政府失败的中央集权则加剧了军阀割据的局面。或许，如果封建早得赓续，吴楚两地的才子们就能完成洋务运动，中国也不会沦落到如今的地步。"
 YUN.lategame.661.a: "是时候打破这些空想家的美梦了。"
 YUN.lategame.661.b: "我们都希望身处更好的时代、拥有更好的领袖……"
 YUN.lategame.662.t: "闻一多的格律理论"
 YUN.lategame.662.d: "尽管新月社踏足政坛，但其本质与灵魂仍然是诗人的集合。这些文人墨客以华丽的言语面纱、精巧的文字舞蹈洞察着世界。这便是《新月》月刊的本质，这便是徐志摩最初为这个社团、这个书店所设立的奋斗目标。新月社并非一个政治组织，而是一个新式复兴中文诗歌的文化机构。\n\n闻一多是新月社最著名的成员之一，他既以自己的政治素养，也以自己的诗歌造诣而闻名，在美国期间，他就有着较强的公民政治参与意识，对于这个民主共和国中的种族歧视问题尤其敏感，并加入了中国青年党的前身“醒狮派”（即中国国家主义青年团）。\n\n在诗歌方面，他最为知名的就是他的格律理论。闻一多称“我们尽可以拿下棋来比作诗；棋不能废除规矩，诗也就不能废除格律”。他对于格律的要求极严格，反对“皈返自然”的浪漫主义主张，因为“自然界的格律不圆满的时候多，所以必须艺术来补充它。”\n\n闻一多借用了英语中的韵律概念，并结合了中文的语音特征，直接回应了他对诗国中“外来术语、外来表达、外来典故、外来主题、外来思想的可怕混乱”之潮流的失望。闻一多对待政治亦如此，寻求着一种中西合璧的解决方案。\n\n闻一多沉迷于“狂喜之死”的浪漫主义，借着充满想象力的艺术境界，与充满苦难的现实世界相结合，发展出了戏剧的天赋。在战争行将爆发之际，闻一多发誓，在取得胜利之前蓄起胡子，绝不剃去。"
 YUN.lategame.662.a: "山河破碎涂炭，诗家岂能不悲泣？"
 YUN.lategame.662.b: "美丽倏忽短暂，叫人处处难寻觅。"
 YUN_wen_yiduo_event_tt1: "§L“幸福！我如今不能受你的私贿，”\n“我的世界不在这尺方的墙内。”\n“听！又是一阵炮声，死神在咆哮。”\n“静夜！你如何能禁止我的心跳？”§!"
 YUN_wen_yiduo_event_tt2: "§L“就听不见了你们四邻的呻吟，”\n“看不见寡妇孤儿抖颤的身影，”\n“战壕里的痉挛，疯人咬着病榻，”\n“和各种惨剧在生活的磨子下。”§!"
 YUN.lategame.663.t: "怀念徐志摩"
 YUN.lategame.663.d: "任何国家、政府、政党、乃至意识形态都必然有其开创元勋，无论是谁拿了最初的那条餐巾，他都会给其后继者，以及后继者的后继者留下深刻而难以磨灭的印象，迫使他们被命运或理想所束缚，继续追随自己的脚步。而新月社也概莫能外。\n\n已在几年前于事故中不幸离世的徐志摩一直希望新月社能远离政治。徐志摩有着普罗米修斯式的人格，是一个不可教训的个人主义者。这是说他只知道个人，只认得清个人，只信得过个人，他信德谟克拉西的意义只是普遍的个人主义。\n\n徐志摩是如此直率，以至于他的新月书店很快成为了那些蔑视暴力革命、工团主义和马克思主义阶级理论之人的小天地。徐志摩颇为钦佩旧日英国政治那“自由与保守”的形式，以及对个人主义和独立思想的信仰。\n\n而作为一名诗人，徐志摩也充满了热情和活力。1926年，他受邀前往被称为“新诗人的乐窝”的闻一多家中参与讨论，随后决定在《晨报副镌》上推出《诗刊》，而这便成为日后新月诗派，以及同名的“新月社”的起源。徐志摩成立新月诗派的初衷是要“纠正以前不受约束的自由”，反抗当时文学作品中流行的“旺盛的自我主义”以及对外国表达和母题不加约束地使用。\n\n但徐志摩的事业也不断与时俱进。起初的新月社由徐志摩、闻一多和饶梦侃主导，是个纯粹的文学社团。但随着时间的推移与中国形势的发展，胡适、梁实秋等作家稳步地将新月社演变为一个政治文学出版物，步上了许多刊物的后尘。徐志摩的辞世令人哀痛，但他的文学精神已深深镌刻进了中国的诗学领域。"
 YUN.lategame.663.a: "我永远为他不能在这里感到遗憾。"
 YUN.lategame.663.b: "也许他对政治本质的看法是对的？"
 YUN_xu_zhimo_event_tt1: "§L“轻轻的我走了，”\n“正如我轻轻的来；”\n“我轻轻的招手，”\n“作别西天的云彩。”§!"
 YUN_xu_zhimo_event_tt2: "§L“但我不能放歌，”\n“悄悄是别离的笙箫；”\n“夏虫也为我沉默，”\n“沉默是今晚的康桥！”§!"
 YUN.lategame.700.t: "联省主义向前进"
 YUN.lategame.700.d: "北方已然陷落，南方人心不定，中华民族的历史翻开了新的一页。中国的联省运动传统上对统一的态度更为审慎，偏好谈判而非搞什么北伐——他们既是真心相信可以谈判统一；又是对资源珍惜如金、对战争前景悲观。尽管如此，[UPC.GetNameDef]还是取得了战争的胜利，在激烈的战斗中，攻克了万国共认的首都北京。\n\n但即便是对于胜利者来说，代价也是极惨重的。云南虽不是联省运动的核心，却也不得不对其民众横征暴敛，还卷入了现代战争中。民众苦而久矣，人心纷纷向往联省派可以兑现其在家乡中实现民主与经济改革的承诺。\n\n对于唐继尧来说，欠下的这些债需要归还的日子来得比想象中早。动乱已经酝酿了一段时间，而唐继尧试图集中省权，更是疏远了手下的各位镇守使。投靠他的知识分子们也同样因他缓慢的改革步伐而愈发不满——因为宪法起草停滞、选举也并不广泛。在广州思考其下一步行动之时，昆明方面也到了算总账的时候。"
 YUN.lategame.700.a: "唐继尧的领导会拯救本省！"
 YUN.lategame.700.b: "反对派会争取云南的自由！"
 YUN.lategame.700.c: "必须制止政府的滥权行径！"
 YUN.lategame.701.t: "云南的煽动"
 YUN.lategame.701.d: "唐继尧对于左翼激进分子渗透省内一直持谨慎态度。他意识到自己需要来自知名学府的知识分子，为自己表现出民主的面孔，并为政府提供人手，因此他在严厉的反赤立场外，也时不时对这些煽动者睁一只眼、闭一只眼，这也导致了云南革新社，即后来追随马克思主义的新滇社的成立。\n\n唐继尧一直关注着这些异见分子，在学生团体乃至教职工中安插线人。监视和审查在中国并非罕见，但中左派人士的日益失望同样麻烦，他们对强加于自己身上的制约感到恼火。\n\n中国民主政团同盟在北京复兴的消息传扬开来。目前的民主政团同盟是由全国的改良派社会主义者、进步派与自由派组织起来的。他们其中就有创始人之一罗隆基及过去十年纵横整个云南的整个新月社。\n\n而昆明本地人也建立起了自己的政党。在云南任教的一帮学者组成了所谓的“九老会”，包括寸树声、孙起孟、李公朴、张天放、周新民、楚图南；以及领导着求实学校，与李公朴、楚图南、闻一多、潘光旦及吴汉有所联系的苏鸿纲也加入了他们。其他西南联大的学者也加入了这个互有重合的团体，包括李文宜、冯素陶、杨一波、楚图南等前社会主义者也位列其中。\n\n曾经出任云南赈济会救济组长，在昆明兴文银行工作的教育家寸树声成为了他们的领袖。他在昆明组织着爱国学生运动，以反对帝国主义斗争的名义，动摇着唐继尧的统治。"
 YUN.lategame.701.a: "云南的民盟同志联合起来，反抗压迫！"
 YUN.lategame.701.b: "云南的当权派设法镇压了异见。"
 YUN.lategame.701.c: "必须制止政府的滥权行径！"
 YUN.lategame.702.t: "镇守使们的阴谋"
 YUN.lategame.702.d: "在1927年政变失败后，唐继尧就一直致力于排挤其他高级军官，运用着自己与中央政府的联盟以及他对云南侧翼的保护，来逐步打压、削弱其他人。多年来，他缓慢地裁撤着其他人的资金，驱虎吞狼，又将政权和特权逐步分给自己的忠臣，效果一时显著。\n\n而那些对头们也不会对唐继尧的谋划置若罔闻。不过，唐继尧在将龙云将军赶出昭通后，云南的政局便发生了不可磨灭的变化，而这一切都是对唐继尧更为有利的：龙云曾是唐继尧最为有权的部下，一度比其他更镇守使加起来还更为强大。龙云始终遭到严密监视，其权力几乎不复存在。因而现在可以说，真正能威胁到唐继尧统治的是胡若愚将军。\n\n从某种方面来说，胡若愚才是永远的死对头。他是比龙云更具进取性的阴谋家，不断谋划着一个倒唐联盟。尽管他和张汝骥将军也互不对付，但还是试图从唐继尧手中挖孙渡的墙角。同样，他还接触到了雄心勃勃的龙云的表弟卢汉将军，试图延揽他和他的表哥。胡若愚此外还有一些商界甚至土匪的关系，与当地民盟乃至国民党也有所交往。正如唐继尧一直准备同他摊牌一样，胡若愚这几年来也一直在等一个时机。"
 YUN.lategame.702.a: "胡若愚将军万事俱备……"
 YUN.lategame.702.b: "唐继尧督理设下一计……"
 YUN.lategame.703.t: "陆良起义"
 YUN.lategame.703.d: "在云南领导人于各城市之间明争暗斗时，农村已经爆发出了公开的战斗。一直以来，土匪、士绅、社会主义者与军官相互勾心斗角，局势一触即发。在大多数时候，云南的社会主义者就是最弱的一派——与闽赣的同志不同，云南的起义部队集结不出一支成规模的军队，无法与规模大得多的乡绅民团分庭抗礼，只能依赖本地不讲什么思想主义的土匪支持。\n\n而唯一的例外则是陆良县，当地的士绅竟然揭竿而起，反抗本地官员收缴部族的武器。以王德三为首的社会主义者则抓住时机，在当地学生、土匪、农民及其他不满豪强者的帮助下，与其他两方展开了势均力敌的拉锯。虽然在士绅与唐继尧部属的官员各自重整旗鼓后，也扳回了一城，但这一事变却让云南省陷入了彻底的混乱状态。\n\n胡若愚试图讨伐昆明，指责唐继尧窝藏赤党、勾结叛匪、忤逆士绅。唐继尧已经授意省议会宣布戒严作为对策，并逮捕了首都的许多社会主义领袖。而民盟的各领导人，再担心自己就是下一个目标，只能藏在家中，在明天到来之前拼命制定着下一步的对策……"
 YUN.lategame.703.a: "遣使龙云将军，请其发动兵变。"
 YUN.lategame.703.b: "电告[UPC.Capital.GetCapitalVictoryPointName]，请其做出干涉。"
 YUN.lategame.710.t: "胡若愚夺取昆明"
 YUN.lategame.710.d: "政变进展神速，快到超乎所有人的想象。唐继尧的统治也远比想象中脆弱——他的先头部队随着蒙自派的推进而逐渐瓦解。张汝骥率领左翼部队迅速攻占大理，沿途收编了许多地方士绅团练武装。与此同时，胡若愚和李选廷则迅速向省会进军。\n\n昆明几乎兵不血刃便告易主，得以免遭长期围困之灾。唐继尧试图说服省议会谴责蒙自派，但未能成功。随着早期战事失利的消息传开，省议会和总商会中的保守派势力纷纷倒戈。胡若愚兵临城下之际，逃跑成了唐继尧的唯一选择——但在城内民盟领导的抗议活动中，龙云将军趁机发动了内部政变，扣押了唐继尧督理，并自封为代理督理。\n\n尽管唐继尧的亲信试图在滇北卷土重来，但随即便被镇压。政变的消息传到贵州后，刘氏家族在唐继尧逃回云南之前就将他逮捕。唐继尧的其他心腹，如唐继麟、王洁修和吴学显，则由于人心涣散、士气低落，已无力长期顽抗。\n\n昆明的政变阴谋家派出代表与胜利的蒙自三巨头谈判，但胡若愚却要求他们缴械投降。意识到情况危急后，龙云的部下（以他的亲戚卢汉为首）宁愿背叛他，也不愿参战。由于不愿以无权无势的傀儡身份参与即将成立的军政府，龙云决定前往昭通“扫墓”，以等待更好的时机。卢汉将军试图利用民盟的不满情绪取龙云而代之，但目前，胡若愚才是西南之主。胡若愚迅速获得了中央政府的认可，成为云南督理。"
 YUN.lategame.710.a: "胡若愚终于报仇雪恨。"
 YUN.lategame.711.t: "反对派在昆明暴动"
 YUN.lategame.711.d: "政变进展神速，快到超乎所有人的想象。唐继尧的统治也远比想象中脆弱——他试图争取省议会和总商会的支持，结果却遭到了反叛。民盟组织了数万民众走上街头抗议，督理的合法性正在迅速下降，被边缘化的龙云将军得以集结足够的支持发动内部政变。\n\n在农村，随着唐继尧势力的溃败，与民盟松散结盟的游击队和土匪得以控制数座城镇。尽管唐继尧的亲信试图在滇北卷土重来，但随即便被镇压。政变的消息传到贵州后，刘氏家族在唐继尧逃回云南之前就将他逮捕。唐继尧的其他心腹，如唐继麟、王洁修和吴学显，则由于人心涣散、士气低落，已无力长期顽抗。随着唐继尧麾下的武装力量被消灭殆尽，大多数软弱的民治党成员要么改弦更张，要么逃往广州以躲避报复。\n\n由于内部纷争和乡村势力的破坏，胡若愚的军队迟迟未能离开蒙自。错失拿下昆明的时机后，胡若愚决定接受与寸树声、龙云、缪云台以及章太炎达成协议，组建一个临时委员会。委员会的名义首脑寸树声正在努力向中央政府解释局势，而唐继尧效忠者的命运已是岌岌可危。"
 YUN.lategame.711.a: "赶走一切唐继尧之支持者。"
 YUN.lategame.711.b: "应章太炎要求，暂时令这些人保留原职。"
 YUN.lategame.712.t: "唐继尧肃清反对派"
 YUN.lategame.712.d: "唐继尧的敌人行动迅速，但唐继尧还是更快一步。他迅速争取到了省议会的支持，宣布进入紧急状态，并调集警卫部队保卫昆明。城内零星的民盟和社会主义抗议活动被迅速镇压，摇摆不定的势力也纷纷就范。\n\n在昭通和大理，忠于唐继尧的部队成功阻止了当地土匪、游击队和士绅团练攻占主要城镇的企图。他们巩固了阵地，在蒙自派先头部队与响应势力会师前，稳住了唐继尧的西翼。\n\n由于迟迟未能离开蒙自，胡若愚的主力部队士气低落，组织混乱。当他们最终与唐继尧部相遇时，为时已晚——昆明部队早已构筑完备工事严阵以待。胡若愚的部队被轻松击退，唐继尧部一路追击至蒙自，三巨头最终被迫投降。蒙自派的阴谋被精明的唐督理识破，叛军只得跪倒在地恳求宽恕。"
 YUN.lategame.712.a: "逮捕逆党，抄没其财产，解散其部队。"
 YUN.lategame.712.b: "缴械其部队，但谅解其领袖。"
 YUN.lategame.720.t: "昆明来电"
 YUN.lategame.720.d: "总执政收到了一封来自昆明的急电，署名者为诸位云南民盟主要成员。尽管关于这个半封闭且高度自治省份政治暴力事件激增的报告连日来不断传入[UPC.Capital.GetCapitalVictoryPointName]，但这些信息零散且可靠性存疑。多年来，由联省派地方主官唐继尧领导的云南省府曾反复强调局势可控——声称农村匪患（长期存在但已受控的问题）与社会主义叛乱分子正利用柏林陷落后的不确定性制造动乱。\n\n最近的电报则描绘了一幅截然不同的景象。这封电报严厉谴责唐继尧政府腐败专制、暴虐无道——大肆逮捕异见人士，限制公民权利。唐继尧执掌大权期间，不仅没有制定省宪，还拒绝举行自由选举。唐继尧及其部属之间似乎正酝酿着一场内战，当地民主派知识分子也卷入其中。电报恳求中央政府介入，下令罢免唐继尧，并进一步指控其正策划针对[UPC.GetLeader]政府的叛国阴谋。\n\n这封电报措辞虽显夸张，却凸显出署名者的铤而走险。二十年代，联省派对中央与省级关系的看法总体上倾向于地方自治和不干预选举事务。唐继尧作为联省运动的核心元老，虽然执政期间屡次被质疑不忠，但此次指控仍触及了他的敏感神经。鉴于目前的极端情况，总执政介入事态以促成妥协或许是及时和平解决局势的唯一途径，但这样做也将带来巨大的政治风险。不过话说回来，放任事态发展也同样风险重重。"
 YUN.lategame.720.a: "回电唐继尧，令其缓和事态、开始谈话。"
 YUN.lategame.720.b: "回电唐继尧，承认其政权、请求其谈判。"
 YUN.lategame.721.t: "[UPC.Capital.GetCapitalVictoryPointName]令唐继尧退让"
 YUN.lategame.721.d: "寸树声向总执政提交的请愿书显然奏效了！消息迅速传开，[UPC.GetLeader]已公开命令唐省长立即停止镇压，和平解决席卷该省的危机，否则将面临后果。总执政此举触及了宪法中备受争议的内容，毕竟联省运动传统上主张中央政府应避免干涉地方事务，但也有人主张举行自由选举、保护公民权利和维护国家主权不应受此限制。\n\n然而，唐继尧尚未及回应便大势已去。唐继尧的声望日渐式微，权威骤降，他的软弱已然暴露无遗。短短一日内，一群复仇心切的将领便在龙云率领下发动了内部政变——通过斩首行动拘禁了唐继尧及其心腹。为赋予政变合法性，政变方同意由寸树声、龙云、章太炎以及勉强同意条件的胡若愚组成临时委员会。唐继尧名义上仍任省长，但实际上已沦为傀儡。\n\n尽管唐继尧的亲信试图在滇北卷土重来，但随即便被镇压。政变的消息传到贵州后，刘氏家族在唐继尧逃回云南之前就将他逮捕。唐继尧的其他心腹，如唐继麟、王洁修和吴学显，则由于人心涣散、士气低落，已无力长期顽抗。由于权力格局剧变，许多唐继尧追随者担心遭到报复，纷纷逃往邻近省份——毫无疑问，他们此刻必在炮制诬陷诋毁之辞。\n\n虽然中央政府不太可能对这一结果感到满意，但他们也急于撇清关系，至少目前如此。此次中央干预地方之先例既开，未来可能会引发更加棘手的问题。"
 YUN.lategame.721.a: "对这暴君复仇吧！"
 YUN.lategame.721.b: "让我们尽可能实现妥协。"
 YUN.lategame.722.t: "[UPC.Capital.GetCapitalVictoryPointName]重申唐继尧之权威"
 YUN.lategame.722.d: "寸树声和民盟试图说服总执政反对唐省长，但最终却事与愿违。[UPC.GetLeader]非但没有出手相助，反而公开发表声明，谴责民盟破坏唐省长的权威并试图煽动暴乱，同时重申了省府关于民盟勾结社会主义革命者与投机匪帮的指控。此外，总执政的声明还援引了联省运动曾达成的协议，即保护各省免受中央政府对地方事务的不当干涉，并责成唐继尧与反对派和平解决分歧。\n\n当然，总执政的支持足以让唐继尧重新掌控全省。有了中央政府的背书，政府中摇摆不定的官员也都站到了唐继尧一边，昆明当局很快便将城内通敌嫌疑人一网打尽。民盟则因等待中央政府回应而丧失了主动权，放任机会白白溜走，最终只能坐以待毙。\n\n胡若愚进军昆明的计划同样未能实现——他原本指望地方势力会在唐继尧势微时团结在自己身边，但他的如意算盘最终落空了。大多数滇系军阀仍然效忠唐继尧，而蒙自派麾下的乌合之众在进攻唐继尧效忠者阵地失败后便溃不成军。如今，唐继尧的统治地位已然稳固，眼下再无人能阻挡他高歌猛进。"
 YUN.lategame.722.a: "唐继尧誓要报复一切逆党。"
 YUN.lategame.722.b: "唐继尧既已得胜，遂表现出仁者风范。"
 YUN.lategame.730.t: "四大天王"
 YUN.lategame.730.d: "在中国的佛教神话中，北南东西四方由四大天王所统治——即多闻天王、增长天王、持国天王、广目天王，而他们则侍于四天王之主帝释天座下。每月农历初八、十四、十五，四天王就会敕遣大臣、案行世间。在帝释天的领导下，四天王也在代表着暴食与色孽等原罪的阿修罗的进攻下守护着传说中的天界：忉利天。\n\n而唐继尧在省内权力逐渐稳固后，人们也开始极大注意到他步步高升的亲卫队，即所谓的“四大天王”——吴学显、习自强、何世雄、谭少卿。\n\n吴学显出身于富贵人家，曾是一位匪首，与曲江坝的团首余英争霸水权，随后又于此同唐继尧部发生冲突。直到1919年，唐继尧军彻底失败，便与吴学显达成招抚协议，使吴学显誓死追随唐继尧，并成为了他部下最忠诚、最能干的猛将。\n\n习自强是一位纳西族人，在云南陆军讲武堂就读。他是一位虔诚的佛教徒，也是一位有所图谋的政客，有望成为唐继尧部下最值得信任的军官之一。\n\n何世雄与谭少卿是长期和唐继尧并肩作战的军官。他们是唐继尧的结拜兄弟，都愿意为这位云南督理赴汤蹈火、两肋插刀。\n\n这四大天王堪称唐继尧直接指挥的军事圈子中最信任的谋士，他们在军中有着深远的影响力。长期以来，滇军都是由昆明军校（云南讲武堂）毕业生与一帮土匪混编而成。重点也许应该放在训练一支善于在山间作战的精锐，由各军校教导毕业的军官负责参赞指挥。然而，也许也可以做一些军事预备，转而加强各省省军，将当地土匪招抚为寓于民众的民团。"
 YUN.lategame.730.a: "督理的意志要靠精兵执行。"
 YUN.lategame.730.b: "未雨绸缪，当练民团。"
 YUN.lategame.731.t: "新月社崛起"
 YUN.lategame.731.d: "民盟在反抗唐继尧政府后遭到弹压，其成员也被迫东躲西藏。据称，许多民盟成员都从中国最西边的云南省远赴上海和香港。而其中的温和派则试图与政府和解，并加入罗隆基、闻一多和梁实秋所领导的新月社。\n\n而新月社和民盟也早有渊源。罗隆基早年建立了国家社会党，也是民盟的喉舌。他早年自认为社民主义者，但随后便因为欣赏权力分立的理念和结构而转向自由主义，否认社会主义作为达成这一目的之手段。他是专攻人权问题的政治学教授，自1932年以来一直在昆明的西南联大任教。他和唐继尧督理长期以来关系密切，又坚定支持民主运动，二人之间可谓关系深厚。\n\n当然，新月社自然也是个潜在的威胁。他们那有些左倾的言辞鲜有可取之处，而且他们对民主更为马克思主义及左倾的阐释也与章太炎多有龃龉。既然这些人密切倾向激进分子，也许为了唐继尧的目的，应该帮助他们从民盟前成员的身份重新找到更为温和的“自我定位”。照此，这些人就可以少关注些阶级问题，多关注些民主分权问题。但换个角度，这些云南的民主团体多年都是纯粹的麻烦。毕竟只要他们存在，就会继续激化我们与本省工农的关系；也许最好直接将他们通通查禁。"
 YUN.lategame.731.a: "引导他们走向中道。"
 YUN.lategame.731.b: "他们最好还是把精力放在散文上……"
 YUN.lategame.732.t: "唐继尧政权稳固"
 YUN.lategame.732.d: "纵观整个军阀混战时期，总有满怀激情与热忱之人引领革命浪潮，但决定运动性质的往往不仅是领袖自己，还有他们身边的亲信。孙中山的国民党拥有汪精卫、蒋介石和胡汉民等忠实干将，陈炯明麾下亦有叶举和陈其尤等矢志追随者。与这些伟人一样，唐继尧也有自己的核心盟友。\n\n唐继尧的左膀右臂是他的长子唐筱蓂，唐继尧的亲信包括麾下将领唐继虞、陈维庚，昆明市长张维汉，外交司长兼财政厅长徐之琛，以及云南锡业公司经理吴琨。这些人共同构成了唐继尧最信任的幕僚和内阁。\n\n唐继尧政府的政治基础则是由章太炎及其追随者领导的民治党构成。民治党是一个融合了联省主义原则和保守民主理念的宪政派政党。虽然没有严格的正统意识形态教条，但观察人士指出，除了坚持民主原则和反帝立场之外，民治党也倾向于遵循佛教和儒家的信仰和传统。此外，唐继尧还曾在掌权之初邀请过醒狮会的代表。醒狮会吸纳了众多中国青年党成员，青年党人深度塑造了醒狮会思想内核。\n\n如今，国家已牢固统一在联省制度下，但这真的是唐继尧的夙愿所归吗？唐继尧领导的云南革命，最终会在[UPC.GetLeader]及其[UPC.GetRulingParty]主导的联省运动中被削弱吞并吗？随着广州和昆明之间的紧张局势日益加剧，唐继尧每天都会与他的核心幕僚以及民治党代表密谋筹策，静待破局之机。"
 YUN.lategame.732.a: "只有唐继尧可以完成真正的辛亥革命。"
 YUN.lategame.732.b: "我们是个广泛的民主联盟。"
 YUN.lategame.732.c: "我们支持中央政府！"
 YUN.lategame.740.t: "唐继尧之死"
 YUN.lategame.740.d: "政变士兵于半夜行动。夜深人静时，一队步兵冲进唐继尧官邸，大声宣读了手中的逮捕令：唐继尧将被无限期严密监视。这道命令直接来自唐继尧的前部下胡若愚和龙云，以及云南民盟领导人寸树声。在这场突如其来的内部政变中，唐继尧多年来的权力野心却在几个月里走向破灭。\n\n关于如何处置唐继尧，新三巨头之间产生了分歧。寸树声强烈主张将唐继尧从云南流放至广州，而龙云则认为，鉴于唐继尧在其支持者中的影响力，将他软禁在云南最为有利。另一方面，胡若愚则坚持要求唐继尧接受审判并获刑。然而，这些争论终成徒劳——上周中央政府已发来电令，要求武装护送唐继尧前往广州，但今晨他却被发现死于榻上。虽然唐继尧的健康状况最近每况愈下，但他遭到毒杀的谣言已经甚嚣尘上。\n\n唐继尧之子唐筱蓂一直在广州活动，试图代表其父游说中央政府，这让他结识了众多共盟知名人士，尤其是像陈炯明、陈其尤和马育航这样的致公党领导人。唐继尧身故后，其领导的民治党内多数成员视此为攀附中央、清算旧敌之机。民治党人坚信唐继尧是遇害身亡，因此将唐筱蓂视为其父理所当然的接班人，并敦促他出任民治党主席。此外，章太炎亦鼎力支持唐筱蓂，并承诺支持年轻的唐筱蓂开启政治生涯，出任民治党主席。胡若愚、龙云和寸树声三巨头则一直以审视怀疑的眼光看待唐筱蓂的政治前途，但三巨头或许可以与唐筱蓂达成妥协并引导他走上正轨。"
 YUN.lategame.740.a: "与唐筱蓂一道，总能找到出路。"
 YUN.lategame.740.b: "他仍然活在父亲的阴影下。"
 YUN.lategame.741.t: "民主青年同盟"
 YUN.lategame.741.d: "民盟如今掌握在寸树声的手中，他也在积极巩固党内民主派的权力。民盟成员对所谓龙云和胡若愚等等“民主”军阀的忠诚度感到担忧，因此便要在青年中培育起热情与活力。\n\n民主青年同盟在各城市中都有不同的支部，其中最为著名的便是四川与云南支部。昆明支部以其诗社、舞社、教育社团及妇女协会而著名。他们还负责赞助全国反对内战联合会等旨在促进和平、打倒国内军阀的组织。同样由民主青年同盟所运作的民主文化工作者联合会也为讨论在四川的工作而举办茶会。\n\n虽然民盟传统上都是温和派与自由派，但著名的左派人士吴晗也是这个青年组织中的积极分子。他在民主青年同盟内部的圈子以之与左翼组织及工会的联系而闻名。他们一直在积极推进与新滇社等左派团体间的统一战线。共产主义者和工团主义者都是这个组织中最激进的成员，而由于其激进思想，他们一直拒绝加入民盟，但仍然与之保持着密切联系。\n\n在全国政局愈发动荡的情况下，民主青年同盟也应当按我们的目标而塑造。可以激励青年们调动热情与群众支持，确保他们传播我们的思想主义。此外，我们也可以对他们进行军事与武器训练，为日益激烈的冲突做好准备。此外，还可以利用这些激情而狂热的民族主义青年在全国范围内制造动。令他们专注于反对中央政府，使其他人相信我们的事业是正义的，真正的革命将会来自云南。"
 YUN.lategame.741.a: "让他们以荣耀的赞歌，激励我们的民众。"
 YUN.lategame.741.b: "痛恨与暴力才是真正的热情。"
 YUN.lategame.742.t: "吴晗的故事"
 YUN.lategame.742.d: "吴晗同许多满怀爱国热情的知识分子一样，在北京大学开启学术生涯。他在北大师从胡适，后来成为明史学者，致力于反思最后一个汉族王朝的兴衰。他的妻子袁震曾是工团主义者，与李文宜为故交。吴晗和袁震既是夫妻，也是探讨政治历史问题的同事。1932年，为了躲避暴力迫害，吴晗跟随众多民主人士迁居云南，成为中国民主同盟的参与者和成员。\n\n吴晗在云南成立了一个名为“西南文化研究会”的智库，成员常秘密聚集于昆明唐家花园或租来的小船之中，讨论彼此的文章。吴晗的第一篇文章是《论贪污》，他在文中指出家族制度的桎梏是腐败的根源；另一篇是《论士大夫》，他在文中着重探讨了古代士人所秉持的忠义道德。在吴晗看来，知识分子的爱国精神是国家精神命脉延续的关键。\n\n吴晗凭借自身独特的北方学术背景以及与各地民盟成员的联系，成为连接云南当地民盟组织与全国民盟成员的桥梁。作为民盟中央委员，吴晗凭借其显赫的学术声望与炽热的政治热忱，成功招揽了许多志同道合者加入民盟。在罗隆基的领导下，民盟传统上保持独立，但一些民盟成员，例如潘光旦和潘大逵，已主动提出与国内其他团体合作。然而，潘光旦等人仍然坚决反对社会主义和左翼团体加入民盟。吴晗则认为左翼团体的加入将强化国内各民主派系的集体统一战线，并有助于构建平等民主。考虑到吴晗在党内的深远影响力，他显然具备调整民盟政治方向的关键能力。"
 YUN.lategame.742.a: "民盟应当专注于内部问题。"
 YUN.lategame.742.b: "让我们与其他团体合作，但不包括赤色分子。"
 YUN.lategame.742.c: "统一战线将确保真正的民主。"
 YUN.lategame.760.t: "国家的召唤"
 YUN.lategame.760.d: "云南在1915年勇敢地反抗袁世凯是辛亥革命故事中的重要篇章。蔡锷和唐继尧最初以维护稳定的名义支持袁世凯，但袁世凯却背叛共和，试图自立为帝。蔡锷和唐继尧于是召集西南地区领导人，率先宣布脱离新帝国独立。此举引发了护国战争，并最终推翻了袁世凯的君主专制统治。\n\n近日，云南省以联省运动之名支持[UPC.GetLeader]。我们的将士曾经同仇敌忾，为解放国家而战。然而，如同当年的袁世凯一样，现任总执政也转向了狭隘独裁、任人唯亲和过度的地方主义。在这种情况下，选举如何能公平举行？有鉴于此，[ROOT.GetLeader]现已揭竿而起，并号召各省群起响应。\n\n此举自然是一场豪赌。作为一个长期与联省运动结盟的省份，我们的起义震动了[UPC.Capital.GetCapitalVictoryPointName]当局，但迄今为止尚未有重要势力倒戈。在力量平衡发生转变之前，我们现在只不过是一个叛国的省份。只有在战场上取得胜利，历史才会宣告我们无罪。"
 YUN.lategame.760.a: "护国征途的最后一战……"
 YUN.lategame.761.t: "昆明迎难而上"
 YUN.lategame.761.d: "旧广州联省政府已不复存在，成为又一个因外部威胁和内部紧张局势而垮台的南方政府。但中国的联省主义此前已经历多次兴衰，这次也是一样。若非要说什么不同，那就是我们的事业始终屹立不倒——这恰恰证明唯有联省主义才能解决困扰中国数十年的症结：一个分崩离析的国度，该如何重归一统？\n\n[ROOT.GetLeader]从废墟中团结联省派残余势力组建新政府，再度为掌控中国而战。或许这一次，我们的国家终将实现其命中注定的联省民主。"
 YUN.lategame.761.a: "广州失败了，但我们不会。"
 YUN.lategame.800.t: "第二次中日战争"
 YUN.lategame.800.d: "第二次中日战争现已全面爆发，日本及其中国盟友与那些试图抵抗日本统治的势力展开对峙。全国上下的民族主义情绪高涨，原本冷漠的民众开始要求争执不休的领导人放下彼此间的琐碎分歧，共同参与到这场文明冲突之中。地方主义（至少其旧有形态）已成禁忌，所有省份都将被要求加入战争，无人可置身事外。\n\n龙云虽然表示要派兵参战，但他却陷入了困境。无论出兵与否，龙云的地位都会受到威胁——如果他真的派兵参战，那么省内维护统治的军队数量就会减少；如果他未能兑现参战承诺，就会被视作不忠诚的懦弱军阀。在民众情绪如此高涨的情况下，民愤已构成不容忽视的威胁。\n\n为了先行消弭各方批评，龙督理下令召集省议员、军官和官僚会议召开联席会议。对于胡若愚来说，这无疑是千载难逢的机会——众人皆知他会借机发难。在对麾下军官的讲话中，胡若愚强调了思想、道德和爱国主义信仰的重要性，并将自己塑造成乱世中的爱国英雄。\n\n军人的头脑深处，必然刻印着一个民族的精神。有道伐无道，有道者胜；顺应国情者伐违逆国情者，顺应国情者胜。"
 YUN.lategame.800.a: "阴谋家们正在蠢蠢欲动。"
 YUN.lategame.800.tt: "§Y[YUN.overlord.GetNameDefCap]支持政变的概率取决于我们党派的支持率。§!"
 YUN.lategame.801.t: "[GetYear]年政治会议"
 YUN.lategame.801.d: "当龙云在[YUN.Capital.GetCapitalVictoryPointName]召集上百名议员、参议员、县长、军官及民间领袖就中日战争举行紧急会议时，与会者皆心知肚明——这场会议实质上是为了巩固龙云自身权势。然而众人却都未料到，龙督理竟在战争爆发前夕提出军队重组计划，其激进程度更是令人瞠目。\n\n根据龙云的大胆提案，师级建制将被废除，代之以规模更小、更易掌控的旅级部队。此举除针对胡若愚等政敌外，还将彻底剥夺卢汉等高级将领的兵权，并由龙云亲手提拔的少壮派军官取而代之，这些军官定会对他感恩戴德。若该计划得以实施，将标志着唐继尧时代镇守使分权军事体系的终结，全省军政大权或将永久收归龙云及其官僚集团掌控。\n\n这一提议激怒了众多军方高层将领，包括龙云的几位主要副手，例如卢汉、朱旭、张冲和张凤春。虽然军方仍自认为可以随心所欲地提出和制定政策，然而权力重心早已悄然转移至掌控全省民政部门、拥有民众和士绅支持的龙云手中。\n\n胡若愚和卢汉决定揭穿龙云的虚张声势，在省会发动兵变，并通过指控龙云犯下庇护唐继尧失势后的残余党羽、勾结外敌危害国家等多项罪名，试图为政变披上合法外衣。龙云对卢汉的背叛措手不及，以回昭通扫墓为名离开了昆明，实则害怕卢汉和胡若愚像废黜唐继尧那样废黜他。由于民心不稳，这些阴谋家为避免政变崩盘，正迫切希望获得士绅、官僚和立法机构的合作。"
 YUN.lategame.801.a: "在军方的威逼利诱之下，文职领袖纷纷屈服。"
 YUN.lategame.801.b: "政府团结一致支持龙云，政变以失败告终。"
 YUN.lategame.802.t: "龙云被政变推翻"
 YUN.lategame.802.d: "云南位于中国西南山区，素来以与世隔绝而闻名，但昆明最近发生的事件却得到了国内外媒体的广泛报道。云南督理、前将军龙云试图集中权力，却导致下属仓促发动政变。\n\n龙云离开省会时，自以为省府少了他就无法运转，但他显然已经失去了士绅和将军们的信任，他们纷纷指责龙云“用人不当”，“不重用贤能之士”，并实行“违背人民利益的黑暗独裁”。"
 YUN.lategame.802.a: "我倒是好奇这个新政权能维持多久……"
 YUN.lategame.803.t: "龙云清洗麾下将领"
 YUN.lategame.803.d: "云南位于中国西南山区，素来以与世隔绝而闻名，但昆明最近发生的事件却得到了国内外媒体的广泛报道。云南督理、前将军龙云试图集中权力，却导致下属仓促发动政变。\n\n然而，在文官政府团结一致后，政变迅速失败。龙云随即清洗了麾下军官，并谴责主要对手胡若愚“心术不正，行事悖乱，养成僭越贪鄙之性”。龙云还指控胡若愚是封建思想的军阀独裁者，且暗中与境外敌对势力私通款曲。"
 YUN.lategame.803.a: "滇龙于西南腾飞。"
 YUN.lategame.810.t: "云南阴谋家寻求我方支持"
 YUN.lategame.810.d: "对于我们政府而言，西南事务向来无足轻重——因其地处偏远加之领袖桀骜不驯，历来仅需他们表示臣服即可。但随着云南各路军阀纷纷派出使者来访，我方介入对他们来说显然至关重要。鉴于蔡锷逝世后云南政变频发、权力斗争不断，如今局面并不令人意外，然而护国战争的爆发证明，即使是像云南这样贫穷偏远的省份，也可能引发全国性的灾难。\n\n据我们掌握的信息，冲突双方是龙云督理及其对手胡若愚将军。为了维护自身统治，龙云派其内兄李培天来访，辩称龙云正在训练军队，以帮助我们应对即将到来的对日战争，而维持云南现状对于保障我方阵营和平至关重要。李培天请求[ROOT.GetLeader]重申对龙云督理职位的认可，并命令滇军将领接受龙云拟定的军队重组方案。\n\n胡若愚则得到了周钟岳的帮助。周钟岳是一位心怀不满的云南元老政客，曾遭龙云排挤。周钟岳指出龙云是个不爱国的军阀，他更关心保护自身权位，而非在对日战争中报效国家。周钟岳还带来了云南各界人士的电报，罗列龙云三大罪状：缺乏对国家事业的奉献精神，阻碍各省进行必要改革，甚至拥抱社会主义并“玩弄煽动性的伎俩”。\n\n最后，我们也可以采取两面下注的策略，在局势明朗前避免支持任何一方；但无论表态与否，我们的意见在昆明都具有相当的分量。"
 YUN.lategame.810.a: "我们将暗示爱国变革的必要性。"
 YUN.lategame.810.b: "我们将对战时军队忠诚问题发表一些笼统言论。"
 YUN.lategame.811.t: "中央政府支持胡若愚"
 YUN.lategame.811.d: "鉴于本省再度濒临内战，对峙双方皆力图争取[FROM.GetLeader]的支持以压制对方。龙云派出了内兄李培天为自己辩护，而胡若愚则笼络心怀不满的元老周钟岳进行施压，要求更换云南领导层。\n\n由于中央政府向来对西南事务不甚关切，因而表态措辞审慎——无论何方胜出皆留有余地。然而在国家处于战争之际，中央政府却强调爱国的重要性，甚至暗示变革的可能性，却被云南各地错误解读为对政变的支持。尽管龙云试图淡化这一信息，但损害已经无可挽回。"
 YUN.lategame.811.a: "胡若愚取得了重大优势。"
 YUN.lategame.812.t: "中央政府支持龙云"
 YUN.lategame.812.d: "鉴于本省再度濒临内战，对峙双方皆力图争取[FROM.GetLeader]的支持以压制对方。龙云派出了内兄李培天为自己辩护，而胡若愚则笼络心怀不满的元老周钟岳进行施压，要求更换云南领导层。\n\n由于中央政府向来对西南事务不甚关切，因而表态措辞审慎——无论何方胜出皆留有余地。然而在国家处于战争之际，中央政府却强调军方忠诚的重要性，并任命龙云为名义上的西南军队统帅。这一决定影响深远，许多人将此解读为[FROM.Capital.GetCapitalVictoryPointName]对龙云的偏袒。虽然胡若愚无论如何都会坚持下去，但他的机会正变得日益渺茫。"
 YUN.lategame.812.a: "有时寥寥数语便能扭转乾坤。"
 YUN.lategame.830.t: "云南再举义！"
 YUN.lategame.830.d: "云南对外部势力的“臣服”一直以来都只是名义上的，该省过于孤立和顽固，无法真正被外部势力统治。尽管滇系军阀经常发生内讧，但他们又总能团结起来对抗外部威胁，即使他们偶尔会在内部冲突中寻求外部援助。然而，此次试图掌控云南的势力似乎操之过急，最终导致[YUN.GetLeader]正式断绝从属关系。\n\n云南揭竿而起古已有之，纵使以寡敌众亦在所不惜。不到一代人之前，蔡锷和唐继尧就领导了反抗袁世凯复辟的护国战争，而云南引以为傲的军队也已证明其足以与中国任何其他军队正面交锋。然而，在过去几十年里局势已发生了重大变化，许多人担心这场起义或将终结云南宝贵的独立——但即便果真如此，云南显然也绝不会轻易屈服。"
 YUN.lategame.830.a: "我们将和先辈一样奋勇向前！"
 YUN.lategame.840.t: "滇系再度崛起"
 YUN.lategame.840.d: "尽管历经艰难险阻，滇系军阀仍然成功击败了对手，并将势力范围拓展到西南以外的地区。此般战果赋予了[YUN.GetLeader]信心和合法性，让滇系得以在广州宣布成立新的护国联盟，这在以前被认为是不可想象的。对于一个曾被视为坚定的孤立主义者和失败的扩张主义者的派系来说，滇系能够重现一十年代的辉煌实属难得。\n\n然而，若想重新统一中国，护国政府还有很长的路要走。打出护国联盟的旗号，表明滇系渴望解放中国其他地区。虽然滇系此刻行动为时较晚，但由于大多数竞争对手已尝试过夺取政权，这反而给滇系带来了独特的优势和挑战。滇系一路走来虽已精疲力竭，但政权根基也更为稳固。如果滇系完成了自身使命，大多数人预计[ROOT.GetLeader]将像蔡锷那样实行独裁统治，将神州大地置于一个民族主义的、无党派的独裁共和国治下。"
 YUN.lategame.840.a: "这次无人能阻止我们！"
 YUN.lategame.841.t: "护国联盟再建"
 YUN.lategame.841.d: "如同前辈蔡锷一样，当今的滇系军阀宣布成立了新的护国联盟，剑指中国领导权，此举彻底扭转了滇系先前因多次远征失败而闭关自守的政策。显然，滇系已趁此期间积蓄力量，试图再度解放中国。\n\n与前任如出一辙，[YUN.GetLeader]已集结军方人士与知识分子于其松散的旗帜之下，希望凭借云南的军事实力和华南的民粹主义推翻现有秩序，并铲除国内的残余对手。滇系领袖誓言若取得成功，他将建立一套专制主义、民族主义、无党派的共和独裁政体来统治全国。"
 YUN.lategame.841.a: "我们曾经成功过，如今亦将如此！"
 YUN.lategame.841.b: "难道他们还没有吸取教训吗？"
 YUN.lategame.860.t: "龙云的雄心"
 YUN.lategame.860.d: "龙云如今已是云南无可争议的实际领袖，他击败了所有对手，并将军事、行政和经济大权掌控在自己手中。龙云的亲朋好友皆已身居政府要职，士绅主导的立法机构也对他唯命是从，似乎无人能违抗他的意志——仅有一人例外。\n\n龙云虽然出身行伍，但他在政治立场上却展现出极其精明和灵活的一面。然而这并不意味着龙云缺乏政治素养或对国际形势一无所知，他曾亲身经历过昆明的各种意识形态更迭——从清朝的君主制，到辛亥革命的共和制，再到国民党的革命民族主义、蔡锷的军国民主义、唐继尧的保守联省主义等等。\n\n如今龙云大权在握，再无人能掣肘，他的施政方式将决定其历史评价——他既可像蔡锷那样的超然军事强人，以铁腕选拔阁僚，无需征求立法机构的意见，也无需处理党派之争；亦可效仿唐继尧，努力拉拢地方民主人士，但也不过度放任自流。尽管龙云与导师们的关系错综复杂，但无论选择何种道路，都将被视为对滇系统治传统的自然承续。"
 YUN.lategame.860.a: "龙云是一位睿智且传统的中国统治者，超脱于各方纷争之上。"
 YUN.lategame.860.b: "龙云是一位锐意进取的现代领袖，更是进步的捍卫者！"
 YUN.lategame.861.t: "过去与未来"
 YUN.lategame.861.d: "几年前，龙云初次收服麾下诸将时，曾自诩为训诫鲁莽部属的睿智导师。龙云不愿像唐继尧那样成为傀儡，否则极可能在不久后便灭亡，于是他动身离开昆明，返回家乡祭拜祖坟，直到无计可施的叛军（因其在省议会、官吏、士绅及基层官兵中皆未获支持）被迫恳请他再度出山。\n\n这似乎是一个公平的妥协——卢汉和其他资深师长辩称，他们多年来一直忠诚追随龙云，却被不值得信任的唐继尧旧部排挤，并要求龙云清除政府中声名狼藉的前唐继尧官僚。作为交换，他们接受龙云继续担任领导职务并推行军事改革。将军们乘飞机前去与龙云会面，龙云则乘坐一辆豪车抵达。双方煞有介事地争执许久后，龙云最终同意复出，并在省会受到热烈欢迎。\n\n然而，龙云很快便展开了报复行动。龙云派部队逮捕胡若愚和蒙自派后，随即向外界发出电报，声称最近的危机是一些叛逆将领“不明政理，妄发意见”造成的。几周之内，卢汉被免去所有军职，调任政府虚职，另外两名师长张凤春和朱旭也被逮捕，四名师长中只有最年轻的张冲被降职为旅长，龙云至此彻底摧毁了滇军原有的权力格局。\n\n龙云巩固自身权力后，鉴于中国近期政治形势的发展，有人提出起复部分将领，并让其担任高层指挥职务。然而此举或将动摇龙云精心构建的权力架构，并限制他在省外采取单边行动的能力。"
 YUN.lategame.861.a: "龙云绝不容许外人再度分裂云南……"
 YUN.lategame.861.b: "龙云必须拥有可以信赖的出色人才。"
 YUN.lategame.862.t: "龙云与艺术"
 YUN.lategame.862.d: "龙云的原配夫人李培莲一直是云南文化界中一位举足轻重的人物。李培莲曾在西方接受教育，并积极参与昆明剧院和电影院的翻修，也曾资助过其他艺术展览。1932年，李培莲不幸早逝，令龙云深感悲痛。不久后，龙云与顾映秋（人称“云南第一美人”）再婚。\n\n龙云延续了原配夫人的艺术志趣，创办了南屏电影院和滇剧团。陆崇仁被任命为戏剧改进社社长，负责推动云南省的艺术文化发展。戏剧改进社还负责演出爱国主义和民族主义戏剧，以提振民心并增强督理统治的支持度和合法性。例如，督理一直积极推动《云南风云》的首演——这部爱国戏剧通过演绎护国战争中滇军发挥的重要作用，将云南塑造为共和先锋。尽管许多评论家指出，该剧带有明显的反直系色彩，除了提振军民士气外没有多少艺术价值，但不可否认的是，在场观剧者无不尽兴而归。"
 YUN.lategame.862.a: "展现了云南的侠骨柔情。"
 YUN.lategame.863.t: "竹王会"
 YUN.lategame.863.d: "早在三国时代之前，强盛的大汉王朝曾大力扩张疆域，将版图拓展至现今的华南地区。在那里，汉朝遭遇了夜郎——一个农耕部落联盟。\n\n夜郎国内流传着关于他们的第一位传奇领袖——竹王的传说。相传，一女子在溪边浣纱时，三节大竹漂至足间。当她劈开竹筒，发现一名啼哭的男婴，便将其收养。此子成年后精通文韬武略，成为部族领袖，率领夷濮部落走向兴盛，自封为夜郎侯，并以汉字“竹”为姓，成为流芳百世的竹王。\n\n汉初的历史记载时常虚实交织。据《后汉书》记载，夜郎侯曾归顺汉廷，获赐象征藩属身份的金印紫绶。然而在云南各地，尤其是彝族聚居区，竹子作为传奇领袖的象征至今备受尊崇，夜郎县境内更是遍布竹王庙宇。彝族等西南少数民族赋予了竹子丰富的文化内涵，形成了浓厚的竹图腾崇拜传统。对于这些少数民族来说，竹王传说还象征着他们反抗汉族封建统治者的斗争。"
 YUN.lategame.863.a: "引人入胜的传说。"
 YUN.lategame.890.t: "胡若愚与卢汉展开对峙"
 YUN.lategame.890.d: "面对胡若愚的挑战和卢汉的背叛，龙云选择离开昆明，动身前往昭通。龙云决心豪赌一把——如果没有他，胡若愚和卢汉将缺乏统治云南的合法性，还会因互不信任而无力推翻自己。虽然龙云明显低估了胡若愚和卢汉推翻自己的决心，但他却精准预见了二人水火不容的关系。\n\n随着胡若愚和卢汉开始瓜分胜利果实，两派之间的冲突也愈演愈烈。机会主义者卢汉试图借反建制浪潮之势，拉拢各路民主派甚至社会主义者。与此同时，尽管卢汉近期与龙云派反目成仇，但他也在试图收编龙云旧部，以构筑自己的文官网络。\n\n胡若愚则反其道而行之，希望通过拉拢省内精英，组建一个反动派集团。虽然有不少人加入了胡若愚一方，但仍有部分势力因心向龙云而对他深怀戒心——这迫使胡若愚不得不加紧控制省议会、总商会及军队等重要机构。\n\n当前的权力真空不太可能持续多久，迟早会有人脱颖而出。"
 YUN.lategame.890.a: "卢汉成功吸纳了龙云政权的朋友和敌人。"
 YUN.lategame.890.b: "胡若愚成功掌控了主要的权力掮客和机构。"
 YUN.lategame.891.t: "捍卫云南的自由"
 YUN.lategame.891.d: "尽管云南各派系存在分歧，但在抵御外敌入侵这一目标上立场一致。胡若愚与卢汉虽怀有相同目的，却采取了截然不同的方针——两人各自备战，以应对中央政府可能对云南边界采取的敌对行动。\n\n胡若愚总体上希望巩固云南的稳定，并调整该省方向，使其以自身为中心。胡若愚旨在通过亲自掌控全省资源调配权，让云南做好抵御外敌的战备工作，从而以“云南守护者”的身份割据一方。除此之外，胡若愚还将利用自身权威与外部势力展开平等谈判，意在确保云南将以自愿臣服而非被吞并的方式加入中央政府。\n\n卢汉也同样担忧云南的自卫能力，但他的部队早已因军纪松懈、劫掠成性而臭名昭著。为了整肃军纪，卢汉正考虑让一些滇军高级将领官复原职。如此一来，卢汉便需要做出妥协（他无疑想成为权力网络的核心人物）以求得团结。为此，卢汉甚至打算招募他曾抨击过的唐继尧旧部，比如孙渡和习自强。\n\n随着省议会召开会议，他们必须决定采纳哪种战略。"
 YUN.lategame.891.a: "胡若愚获得了动员全省所需的紧急权力。"
 YUN.lategame.891.b: "卢汉让几位被流放或被边缘化之人官复原职。"
 YUN.lategame.892.t: "马坚的故事"
 YUN.lategame.892.d: "马坚（教名穆罕默德·麦肯）是生于沙甸村的回族人，六岁时被送往省会昆明，在那里接受小学和中学教育直到19岁。毕业后，马坚回到家乡沙甸，在一所中阿并授的小学任教两年，后到宁夏师从虎嵩山。马坚很快便对教书失去了热情，于是前往上海继续深造，并因这座城市更为浓厚的社会主义氛围而产生了左翼倾向。\n\n回到云南后，马坚已成为云南穆斯林社区中一位颇具影响力的杰出人物。他请求地方政府资助并推广在农村地区开设的中阿并授学校，并得到了[ROOT.GetLeader]的默许。作为地方领袖，他还因参与编撰第一部阿拉伯语汉语词典和翻译更准确的《古兰经》译本而获得全国性声誉。由于阿拉伯语翻译问题，《古兰经》历来存在译本不一致和不准确的问题，马坚的阿汉词典成为了帮助中国穆斯林理解经文真谛的宝贵参考资料。\n\n为了提高[ROOT.GetLeader]的支持度和合法性并促进文化交流，当局决定资助马坚前往开罗和麦加朝觐。马坚表示，此次朝觐将有助于促进中国和阿拉伯穆斯林之间的文化交流，并提升现政府在回族群众中的合法性和支持度。"
 YUN.lategame.892.a: "展现了云南的温和包容。"
 YUN.lategame.893.t: "云南发现恐龙化石"
 YUN.lategame.893.d: "从昆明周边的道路施工现场传来了令人惊奇的消息——工人在开挖路基时，意外发现了某种已灭绝动物的化石残骸，部分围观群众猜测这可能是龙或麒麟的骸骨。地质学家卞美年闻讯后迅速赶赴现场，经初步研究，他确认了该化石生物的身份，并将其命名为“IVPP V15”。\n\n由古生物学家兼动物学家杨钟健率领的团队也已抵达现场，开始着手研究IVPP V15化石残骸。尽管仅存部分骨骼，但这具化石的蜥脚类恐龙特征让学界将其与1903年科罗拉多州发现的侏罗纪晚期巨型蜥脚类恐龙——腕龙进行比较。卞美年的初步测定显示，该骨骼化石很可能源自三叠纪晚期，这一结论令在场专家尤为振奋——传统观点认为多数蜥脚类恐龙直到侏罗纪早期才演化出现。尽管如此，许多人仍持怀疑态度，并指出周围的地质条件可能暗示这具化石年代更晚，更符合先前的发现。另一个引起人们兴趣的原因在于，这具化石似乎不属于中国已知的任何蜥脚类恐龙物种，许多人正翘首以盼，希望这具化石属于一个尚未发现的全新恐龙属。\n\n最终，杨钟健认定IVPP V15属于一个此前从未发现过的全新恐龙属，并将其命名为“许氏禄丰龙”(Lufengosaurus huenei)——禄丰代表化石发现的地点，许氏则是为了纪念他的导师弗里德里希·冯·许内。与此同时，杨钟健还发现了一个近缘物种——云南龙(Yunnanosaurus)，这些突破性成果让他迅速赢得了“中国恐龙之父”的称号。"
 YUN.lategame.893.a: "只管挖，钱管够！"
 YUN.endgame.000.t: "山河破碎，委座浮沉"
 YUN.endgame.000.d: "历史总是难以预料。最终带领国民党走向胜利的不是先总理孙中山，也不是先总司令蒋介石，更不是汪精卫、胡汉民或其他某位革命队伍的核心。最终竟然是何应钦委员长出人意料地带领国民党走向胜利。让无数革命前辈的梦想最终化为现实的是何应钦，让中国在革命与共和的旗帜下实现统一的是何应钦，而即将决定接下来几代中国人的未来的，还是何应钦。\n\n但我们的战斗尚未结束，国民革命的道路上还面临着许多挑战。国家固然实现了团结一致，共同对抗外部威胁和独立军阀，党却恰恰相反。国民党内部派系林立，却又缺乏能将其团结在一起的力量，使得党的团结已经开始支离破碎。雪上加霜的是，外国债权人纷纷赶来索要债务，同时政府还欠着退伍老兵和公务员一大笔钱。\n\n面对如此多的障碍，国民党需要同时完成两项看似南辕北辙的任务——既要强行编遣部队以节约财政支出，又要集中权力以充分利用资源。而要摆脱这一困境的唯一方法，恐怕就是在保留中央军的同时强制编遣各地军阀，但这一方案无疑不会受到军阀们的欢迎，并可能导致叛乱。\n\n何应钦依然在我们的队伍中维持着巧妙的权力平衡，而他那无可争议的领导地位更是增强了他的权力，使他有能力引导国家朝自己希望的方向发展。戴季陶预计将于近期宣布退休，而何将军的下一任行政院长人选恐怕会对后世产生巨大影响。"
 YUN.endgame.000.a: "是时候完成革命承诺了！"
 YUN.endgame.000.b: "是时候确保国家稳定了！"
 YUN.endgame.001.t: "遗业破碎，委座浮沉"
 YUN.endgame.001.d: "历史总是难以预料。最终带领国民党走向胜利的不是先总理孙中山，也不是先总司令蒋介石，更不是汪精卫、胡汉民或其他某位革命队伍的核心。最终竟然是党军的众人出人意料地带领国民党走向胜利。在国府主席何应钦、行政院长陈诚和参谋总长滕杰的领导下，黄埔系各派别得以通力合作。让无数革命前辈的梦想最终化为现实的是黄埔系，让中国在革命与共和的旗帜下实现统一的是黄埔系，而即将决定接下来几代中国人的未来的，还是黄埔系。\n\n但我们的战斗尚未结束，国民革命的道路上还面临着许多挑战。国家固然实现了团结一致，共同对抗外部威胁和独立军阀，党却恰恰相反。国民党内部派系林立，却又缺乏能将其团结在一起的力量，使得党的团结已经开始支离破碎。雪上加霜的是，外国债权人纷纷赶来索要债务，同时政府还欠着退伍老兵和公务员一大笔钱。\n\n面对如此多的障碍，国民党需要同时完成两项看似南辕北辙的任务——既要强行编遣部队以节约财政支出，又要集中权力以充分利用资源。而要摆脱这一困境的唯一方法，恐怕就是在保留中央军的同时强制编遣各地军阀，但这一方案无疑不会受到军阀们的欢迎，并可能导致叛乱。\n\n而要说到党内政治冲突，最明显的证据就是何主席的任期将终。由于应对危机不力，何主席预计将会低调地宣布退休。而陈诚和滕杰之间已经出现争执，党内许多人都在担心，这两位年轻将领间不可避免的冲突可能会导致又一轮的国内动荡。"
 YUN.endgame.001.a: "为了捍卫农民权益！"
 YUN.endgame.001.b: "为了拯救国民革命！"
 YUN.endgame.002.t: "恶性通胀风潮"
 YUN.endgame.002.d: "由于国民党曾经历过的残酷处境和中国那风雨飘摇的历史，经济像现在这样变成恶性肿瘤也是在所难免。毕竟国民党中央政府需要维持一支庞大军队，以抵御日本入侵、打倒军阀割据，更重要的是，为那些战败的将军提供工作以防止他们叛乱。而这支军队已成为国库最大的负担，使中国变得愈发民不聊生。这并非什么新鲜事，实际上在我们之前的每一个政府都遭遇过类似的命运，甚至连我们自己都并非第一次经历了。\n\n但话虽如此，和最近一轮的恶性通货膨胀比起来，之前的经济下行只能算是小巫见大巫了：随着我们实现国家统一，政府吸收了许多显性或隐性的债务，而其中许多甚至已经逾期。更糟糕的是，由于连年战争和经济荒废，我们已经用光了大部分增加政府收入的手段，如今只剩下两个饮鸩止渴的选项：要么提高税收，要么继续印钞。我们原本试图通过发行货币以兑换黄金和白银，从而增加我们的储备，抑制通货膨胀，没想到却导致了银行挤兑，不断恶化的危机对整个国家都带来了巨大的冲击。\n\n经济全面崩溃，骚乱也随之四起。孔祥熙这样的传统经济学家试图通过课征重税和削减预算来消除赤字，抑制通货膨胀。虽然从长远来看这样做很可能最为有效，但国民党长期以来都信奉国家资本主义，令人对这一方案极为忧虑。陈诚则利用这种犹豫不决来推动自己的民粹主义措施，包括对基本商品进行配给制、公共分配和价格控制，并允许以物易物，以此来稳定货币。而此外，激进分子则建议大规模债务违约，并颁布一个由政府指导的工作计划来渡过危机。"
 YUN.endgame.002.a: "我们需要开源节流！"
 YUN.endgame.002.b: "提高盐税，政府管控经济。"
 YUN.endgame.002.c: "强制物资配给以应对危机。"
 YUN.endgame.002.e: "洋鬼子一分钱也别想拿到！"
 YUN.endgame.003.t: "持续不断的机能失调"
 YUN.endgame.003.d: "随着党面临的外部威胁基本肃清，加之政府职位与财政拨款预计缩减，政治博弈的狂热程度正在加剧。年轻的门生故旧争相抢占利润丰厚的人情肥缺，唯恐政治体系彻底僵化；而政治圈外人则抱怨称，尽管他们完全有资格胜任大量职位，却因缺乏人脉而求职无门。与此同时，许多树大根深的党内官僚也在捍卫自己对公务员队伍和其他官僚体系要职的垄断地位。\n\n不可否认的是，由于国内经济形势急剧恶化，人们纷纷寻找能够抵御通胀影响的工作，这种情况只会愈演愈烈。与此同时，许多现任政府雇员开始抱怨工资过低和腐败横行，他们微薄的薪水正遭到削减，却还要通过行贿来保住职位。强烈的改革呼声此起彼伏，矛头直指亟待瓦解的既得利益集团。\n\n当官员向上级寻求答案时，却发现各派系忙于内斗，无法为国家提供所需的政治方向。同志之间已经开始相互倾轧，哪怕他们同为黄埔出身。即便是中央执行委员会和中央监察委员会，也在为国家的未来而争论不休。不过，各派系都认同一个观点：党必须改组，并构建一个共同的政治纲领。"
 YUN.endgame.003.a: "只有统一思想、精神和行动才能救亡图存。"
 YUN.endgame.003.b: "只有进行第二次改组，才能彻底根除腐败。"
 YUN.endgame.003.c: "我们的政府必须实行优绩主义管理改革。"
 YUN.endgame.003.e: "我们必须重振党国的爱国主义精神。"
 YUN.endgame.003.f: "我们必须清除党内的腐败和不正之风！"
 YUN.endgame.004.t: "民主的最后余火"
 YUN.endgame.004.d: "不幸的阴云并非只笼罩于政党或经济领域，这种病症已然蔓延至中国社会的方方面面。资产阶级和无产阶级同样饱受恶性通货膨胀的折磨，党内党外人士都对广泛的腐败感到不满。如今，腐败对国民党统治的冲击达到了顶峰，民众的不满情绪也开始滋长。民众纷纷团结起来反对军事独裁政权，在他们看来，当局曾承诺通过削减前几任政府的官僚作风来解决现有问题，但诺言却基本上未能兑现。\n\n在知识界的煽动下，要求变革、政府问责和民主化的呼声此起彼伏，意图在国民党实现孙先生的革命目标之前将其推翻。虽然群众怀有高尚的初衷（这点或可承认），但这场反党运动已被投机军阀、社会主义叛乱者以及其他对国民党政权不满之人所操控。\n\n尽管高层委员会内部斗得不可开交，但随着许多人开始意识到真正的利害关系，党内的激烈言论已经逐渐平息。陈诚和滕杰等激进派甚至提出了一些相当于暂时政治休战的方案。当然，待到国民党为民生痼疾开出药方（这些方案定会引发激烈争论）之后，意识形态的交锋必将再度爆发。"
 YUN.endgame.004.a: "我们必须听取人民对改革和问责的呼声！"
 YUN.endgame.004.b: "为了推进宪政，我们需要听取外界呼声。"
 YUN.endgame.004.c: "我们需要遵循三民主义，有序推进变革！"
 YUN.endgame.004.e: "我们需要维护自身权威并掌控未来命途！"
 YUN.endgame.005.t: "蓝衣社的土地改革"
 YUN.endgame.005.d: "蓝衣社接管党国政权并没有满足民众的土改诉求，也未能平息党内存在的分歧——这些分歧不仅涉及土改的具体实施方式，还包括曾经繁荣的中国经济走向衰退的根本原因。\n\n周方等学者将农村衰落归咎于政府管理不善，并指出过于沉重的苛捐杂税、反复无常的土地丈量以及临时征收的附加税种严重削弱了农民的积极性。与此同时，陆一远等学者指出，帝国主义与资本主义通过将外国商品大量倾销至中国市场，摧毁了中国本土农业和传统手工业，帝国主义强加的赔款与贷款则迫使清政府横征暴敛，进一步加剧了民众的赋税负担。\n\n刘炳藜则认为，“亚细亚生产方式”是中国农业衰落的根本原因，这种生产方式带来了停滞状态与反动思想，阻碍了农业剩余价值的产生，致使现代工业化进程受阻。梁园东也写道：“凡军阀、内战、土匪，就应当是乡村衰落的结果，而不是乡村衰落的原因。既是结果，那你要消灭军阀及其苛捐杂税，消灭内战、土匪，就非根本先有救济农村的方法不可。假如农村的衰落无法救济，而只认定单单取消军阀割据、制止内战、肃清土匪为救济的办法，那就倒果为因，其结果只有是推翻了袁世凯政府，又有了段祺瑞政府，推翻了段祺瑞政府，又有了曹锟政府，直皖之战完了，又会有直奉之战，直奉之战完了，又会有奉国之战，如此相续相生，永不会停止。”\n\n周方等人相信孙中山先生的最初设想，认为推行耕者有其田、限制地租和土地税足以消除农村贫困。梁园东和刘炳藜等更为激进的思想家则认为，平均地权比均分土地更加重要。在他们看来，均分土地只会导致普遍贫困，并鼓励“自私自利”的个人风气。相反，他们都认为“若要拯救农业，就必须从一种全新的体制开始”，刘炳藜推崇实行集体管理，梁园东则主张建立集体农庄。"
 YUN.endgame.005.a: "推行原有的耕者有其田政策就够了。"
 YUN.endgame.005.b: "我们必须制定全面的土地改革纲领。"
 YUN.endgame.006.t: "黄埔系的土地改革"
 YUN.endgame.006.d: "土地改革和“耕者有其田”是孙中山先生《建国大纲》的重要组成部分，但其具体实施方案始终存在争议。孙中山先生虽深受亨利·乔治思想影响，但在具体操作细节上往往含糊其辞。关于孙中山先生的设想方案是否与私有财产制度兼容，以及如何才能最好地实现中国农业现代化，并拆分士绅阶层规模庞大的田产（且通常是在外地主名下的），目前仍存在着相当多的争论。\n\n以陈立夫为首的党内较为保守的人士提交了报告，主张在全国经济委员会、内政部和财政部领导下成立一个联合土地委员会。土地委员会将对各省土地进行系统性丈量，并据此提出建议，重新审查地契和税收制度，使其更加平等，同时避免采取不必要的激进措施。根据陈立夫的计划，政府将统管大米销售，限制地主权力，并为农业现代化提供补贴。\n\n陈诚也已向农村复兴联合委员会提交了自己的方案。陈诚的方案借鉴了自己的地方施政成功经验，是邓演达等左派人士民粹主义改革的温和版本。陈诚的方案包括三个部分：1.限制地租改革，降低过高的地租；2.强制大地主以公平价格向政府出售土地，并将购得的土地重新分配给佃农；3.成立由公正专家组成的监督机构，负责项目监察。\n\n陈诚的方案引起了部分人士的强烈抵触，他们批评该方案毫无必要且鲁莽冒失，不过是马克思主义临委会最终推行土地国有化议程的铺垫。为了保障农民的政治权利，临委会历来推行耕者有其田政策，先通过剥夺在外地主和其他士绅的土地所有权，最终寻求逐步将土地全面收归国有。"
 YUN.endgame.006.a: "私营部门……将在政府的监管下自行解决问题。"
 YUN.endgame.006.b: "只有通过谨慎投资并与士绅合作才能取得成功。"
 YUN.endgame.006.c: "只有通过稳定且和平的改革才能打破治乱循环。"
 YUN.endgame.006.e: "唯有真正解放土地与农民，民主政治才会到来！"
 YUN.endgame.007.t: "陈诚的土地改革"
 YUN.endgame.007.d: "随着土地改革在全国范围内展开，陈诚及其盟友规定，所有达到一定规模和经营标准的地主都必须以“公平”的价格将土地出售给政府，其中一部分由政府现金支付，其余部分则以国有企业（由近期国有化的工业企业组成）股份的形式支付，随后再将购得的土地优先出售给现有佃农，佃农需以分期付款形式偿还政府，从而培育出更多的自耕农。陈诚下令，土改过程必须循序渐进、和平进行，但也要决策果断、杜绝腐败——买卖双方不得进行任何直接接触。\n\n土地改革的第二个重要组成部分是二五减租（也称三七五减租）。在此之前，地租普遍超过预期收成的50%，且存在“铁租”等强制性条款，即使歉收也必须全额支付地租。如今国民党规定，收成的25%归耕作者所有，剩余75%由佃农与地主均分。新规要求租约必须经官方书面备案，禁止包含铁租条款，租期未满六年不得终止；若佃农要求续租则必须续约，除非地主收回土地自耕，此举有效削弱了土豪劣绅的影响力。为了确保地主的公平待遇，政府将设立耕地租佃委员会代表地主利益，并确保不会出现拖欠地租的现象。若佃农欠租总额超过两年地租，地主有权终止租约。\n\n最后一步是制定统一的法律法规，由民政部土地局牵头的一系列监督委员会负责管理。陈诚在法规出台前邀请了专家学者、政府部门、地方代表和媒体参与讨论，并密切监控监管机构以防止腐败行为。事实证明，这项计划在农民中广受欢迎，并被士绅阶层勉强接受为公平方案。"
 YUN.endgame.007.a: "一个充满希望的开始！"
 YUN.endgame.008.t: "打破治乱循环"
 YUN.endgame.008.d: "陈诚主席出身农村，深知民生疾苦。作为“孙中山先生的忠实信徒”，他的使命不仅是要将同胞从近几十年来的帝国主义压迫中解放出来，更要从根本上变革导致中国两千年朝代更迭与治乱循环的经济制度——正是人口与土地的周期性失衡，引发了这片土地上绵延不绝的战乱。\n\n陈诚的纲领同时遭到了左右两派的批评，右派指责他寻求土地完全国有化，而左派则抨击他不愿强行没收士绅财产。但陈诚立场坚定，认为孙中山先生的土地国有化主张与试图剥夺所有财产的马克思主义国有化思想截然不同。国家是由个体组成的集合，无个体则无国家，故土地国有须通过人民之手实现。因此，孙中山先生的土地国有化理论并不排除土地私有制，而是将私有制置于法律框架之下。\n\n无论理论如何，土地改革的成效已然开始清晰显现。将土地重新分配给佃农的政策不仅缓解了社会动荡，更激励新兴的自耕农阶层投入资金，维护社区秩序并提高生产力。与此同时，由于许多士绅获得了国有企业股份作为补偿，他们的利益便与政权存续息息相关。在获得补偿金的地主群体中，许多人变卖田产迁居城市——他们将子女送入新式学堂，并在工商业领域另起炉灶。对于现存小农而言，资本的涌入与乡村关注度的提升、匪患消除、战乱平息以及赋税减免也改善了他们的生活。\n\n乡村的复兴也反过来造福了城市，农村生产和经济的发展促进了工商业的繁荣。曾经深陷土地桎梏的中国资本，如今已向工商实业领域踏出转型的第一步。"
 YUN.endgame.008.a: "民富则党兴。"
 YUN.endgame.009.t: "何应钦隐退"
 YUN.endgame.009.d: "伟大的中国解放战争时代基本告终后，何应钦将军在政治上基本被边缘化，他在军事战略规划中的作用也在逐渐减弱，只剩下主席高级顾问的虚职。这位前委员长除了领取薪俸和回忆往事之外几乎无事可做，于是他选择在远离公众视线的地方消磨时光。\n\n何应钦热爱体育、园艺和桥牌，同时也是各种无党派俱乐部和协会的赞助人。如今，何应钦消磨时光的最重要项目或许就是[RKT.Capital.GetCapitalVictoryPointName]高尔夫俱乐部。在市长、高级军官以及其他政府内高尔夫球爱好者的赞助下，该俱乐部已获准购买此前被军队占用的政府土地，用于建造一个九洞高尔夫球场。\n\n目前，这座球场已经制定了进一步扩建计划，计划将建成一座极其优雅的公园，高尔夫俱乐部也将在全国范围内推广这项运动。为了回应关于精英主义与排他性的批评，俱乐部已扩大公众参与渠道，包括全年设立“高尔夫日”。\n\n作为一位名誉扫地但仍具有潜在威胁的前国家元首，何应钦一直处于政府的监视之下。虽然何应钦的处境有些尴尬，但他显然随遇而安！"
 YUN.endgame.009.a: "不错的爱好。"
 YUN.endgame.009.b: "让我也来挥舞一杆！"
 YUN.endgame.010.t: "国民党政府动荡难安"
 YUN.endgame.010.d.base: "中华民族在国民党政府的领导下重新统一，但若是他们以为只靠民族主义就能团结这个崭新的国家，那就大错特错了。外国势力已被驱逐，对立政府也被推翻，外部压力已不复存在，这一运动便再难以保持团结一致了。与此同时，人民、各省主席和外国债权人对新政府期望过高，中央政府力有未逮，反噬开始出现。\n\n症状首先表现在统一后自由落体的经济。多年的赤字支出、高昂的军费开支、盛行的腐败低效、受损的经济企业以及持续的抗税行为导致政府债务不断上升。而国民党革命者接管政权后，许多产业精英和技术官僚纷纷逃离，外国债权人则开始要求政府立即偿还债务。而且中央政府缺乏稳定的货币储备，导致通货膨胀不断飙升。\n\n经济衰退产生了全国性的影响。和平虽然到来了，税收却还在增加，人民对此不断抗议，导致动乱开始升级。而随时可能爆发的进一步动乱使中央军不敢削减其军费开支。在[FROM.Capital.GetCapitalVictoryPointName]方面看来，唯一的解决方案就是让[FROM.GetLeader]集中权力，削减对各省的补贴并编遣军阀军队。所有这些因素导致中央目前格外脆弱，令其他棋手有机可乘。"
 YUN.endgame.010.d.kmt: "$YUN.endgame.010.d.base$\n\n作为国民党的一个地区派系（或者说对立派系），我们[ROOT.Capital.GetCapitalVictoryPointName]备受瞩目。党的未来何去何从，我们的意见特别重要，而许多人都在关注[ROOT.GetLeader]是否会带头遵守中央委员会的指示，抑或是选择谴责政府并引发党内叛乱。不论如何，我们都必须尽快做出决定，因为随着党国巩固其统治，我们这样的忠诚支流将最先被纳入政权。"
 YUN.endgame.010.d.shxyan: "$YUN.endgame.010.d.base$\n\n阎锡山省主席执掌的地盘工业化程度惊人，而也许现在正是他反对党国暴政，确立自己对国家的领导地位的机会。国民党击败了北洋政府，看似势不可挡，但现在却气充志骄、内斗不休。或许现在正是举起五色大旗，重建没落的北洋政府之时！"
 YUN.endgame.010.d.shxgmj: "$YUN.endgame.010.d.base$\n\n国民军领袖冯玉祥大帅身段灵活（有人称之为两面三刀），而也许现在正是他确立自己在国民革命中领导地位的机会。冯大帅曾经加入过国民党，但他领导着的国民军一直是个融合了民族主义、基督教民粹主义和部分北方政治传统的独特运动——也许中国所需要不是那些来自广州的愚蠢军人，而是我们这支国民军。"
 YUN.endgame.010.d.generic: "$YUN.endgame.010.d.base$\n\n对于我们这样的地方派来说，眼下可能是我们保护自己的自治权不受侵犯的最后机会。国民党政权在未来的一段时间内会变得无比虚弱，而目前地方派各个群情激奋，或许只靠一场起义就能推翻中央政府。但遗憾的是，战争总伴随有风险，有时推迟行动、顺时待命才是上策。"
 YUN.endgame.010.a: "打倒[FROM.GetLeader]的腐朽暴政！"
 YUN.endgame.010.b: "管[FROM.Capital.GetCapitalVictoryPointName]说什么集权，我们要走自己的路。"
 YUN.endgame.010.c: "是时候让本省回归中央了。（切换为[YUN.GetNameDef]）"
 YUN.endgame.011.t: "[FROM.GetLeader]挑战[RKT.GetLeader]"
 YUN.endgame.011.d.base: "[FROM.GetNameDef]意识到[RKT.Capital.GetCapitalVictoryPointName]的国民党政府的软弱，又担心国民党会在统一中国之后加强中央集权，于是他们打着保护公民自由和社会秩序、推翻不公统治、终结腐败政权的名义发动了一场反抗中央政府的起义。由于[RKT.GetLeader]的政府眼下正在经济困境、政治分裂和国内动乱的几重重压下苦苦挣扎，想要遏制这场叛乱恐怕需要一场苦战。"
 YUN.endgame.011.d.kmt: "$YUN.endgame.011.d.base$\n\n这场叛乱由[FROM.GetLeader]领导，他是[FROM.Capital.GetCapitalVictoryPointName]方面的国民党地方派领导人，他们为了推广自己对孙中山思想的理解，选择与中央委员会的路线决裂。鉴于国民党的分歧由来已久，其党内出现分裂派系并非什么新闻。至于这位全新的叛乱者能否战胜困难……或者与被他推翻的人表现得有所不同，这还有待检视。"
 YUN.endgame.011.d.shxyan: "$YUN.endgame.011.d.base$\n\n这场叛乱由山西的“模范省长”阎锡山煽动，他长期经营的太原市工业化程度惊人。阎锡山与旧北洋政权联系最为密切，却也将许多不同的政治理论融入了自己关于中国的理论，身为北方政局领袖，名声显赫。许多人认为阎锡山胜算不大，不过他仍是国民党政权最有力的挑战者。"
 YUN.endgame.011.d.shxgmj: "$YUN.endgame.011.d.base$\n\n这场叛乱由冯玉祥掌舵，他是民粹主义国民军的领袖。国民军曾是直系军阀的一个分支，之后在北伐中选择与国民党结盟。但他们依然维持着自己独特的身份认同：一个融合了基督教、民族主义、社会主义和其他众多信仰的独特意识形态。至于他们能否推翻中央委员会，就只能战场上见真章了。"
 YUN.endgame.011.d.generic: "$YUN.endgame.011.d.base$\n\n这场叛乱由[FROM.GetLeader]掀起，他是[FROM.GetNameDef]的领导人。他对国民党内的权力倾轧感到失望，同时还担心自己的权威丧失，于是他利用了省内外对现政权的强烈不满发动了叛乱。掀起叛乱危险不小，但看来[FROM.GetRulingParty]觉得值得冒这个险。"
 YUN.endgame.011.a: "祸国奸贼，恨不得杀之而后快。"
 YUN.endgame.011.b: "我们本以为这能为战争画上句号。"
 YUN.endgame.040.t: "变革中的中国，变化中的态度"
 YUN.endgame.040.d: "中国重新统一后，举国上下面临着“现在该怎么办”的问题。这个问题一直萦绕在国府主席何应钦的脑海中。过去几个月里，他一直在学习党的理论，广泛听取各种意见（包括党外人士），思考下一步该怎么做。在付出如此巨大的牺牲后，党究竟该如何建设一个不负这些代价的未来？\n\n在许多共和派领袖（他们大多接受英美教育，而非何应钦接受的日式或中式教育）的力谏下，何应钦对他们拥护宪政的呼声持愈加开放的态度。共和派建议何应钦接纳党外人士进入政府，甚至将小型党派合法化，为党外盟友提供新的参政途径，进而做好最终结束训政的准备。当然，短期内多数职位及政府机关仍将由国民党主导，但共和派表示局势不可能一直如此。\n\n在土地改革这一紧迫议题上，何应钦的立场也已开始松动。土地改革是先总理受亨利·乔治思想启发而提出的《建国大纲》的重要组成部分，但由于腐败盛行与士绅抵制，此前的土改努力在很大程度上未能突破省域局限。许多国民党官员，包括何应钦本人，都出身于地主精英阶层或拥有大量土地。但在革命军事阶段结束后，人们愈发意识到变革的必要性，随着少壮派民粹主义思想的兴起，何主席也软化了对变革的立场。\n\n强硬派疾呼变革势在必行，但在他们看来，变革意味着彻底完成革命未竟之业。成千上万的同志为我们的革命事业献出了生命，还有数百万民众正承受着战争和毁灭的伤痛。为了实现持久和平，党国必须全力以赴，按照先总理的三民主义，从头开始重建中国。"
 YUN.endgame.040.a: "战争已经结束，是时候让民主绽放光芒了。"
 YUN.endgame.040.b: "我们将通过土地和经济改革实现公平正义。"
 YUN.endgame.040.c: "我们将借助党的力量建设更加美好的未来。"
 YUN.endgame.041.t: "新儒家学会"
 YUN.endgame.041.d: "在黄埔系的领导下实现中国统一后，军事“新右派”为国民党赢得了持久胜利，并巩固了党内意识形态的右倾趋向。黄埔系已故领袖蒋介石便颇具思想前瞻性，早就认识到了向同治中兴先辈学习的价值。尽管这些晚清改良派最终未能阻止满清衰落，但他们推崇儒家思想以维护国内稳定与安全的尝试仍然值得学习。正如蒋介石所言：“我们要承接中华民族五千年历史文化，发扬光大，使其为人类理性振聋发聩的木铎。”\n\n儒家思想深深植根于中国政治传统，即使是反对何应钦和黄埔系之人，在此问题上亦有共识。李宗仁曾说，社会主义者试图“剥夺人民之灵魂”。陈济棠则指出：“生产建设可以尽量用外国机器，外国科学，甚至于不妨用外国工程师。但做人必须有本，这个本必须要到本国古文化里去寻求。”\n\n现代新儒家已远不如前辈思想家那样富有哲理，他们更像是寻求哲学实际应用的实干家。现代新儒家主要强调儒家的传统道德——礼、义、廉、耻，并将这些与维护社会秩序直接联系起来，尽管其在党内文献中频繁出现，但具体定义通常较为模糊。随着革命逐渐结束，“读经”运动兴起，西方人文社会科学受到抑制，这场文化之争已开始取代实际战争。正如一位作家所言：“西方值得借鉴的唯有科学技术。”\n\n然而这场读经运动却引发了党内认同危机——国民党正从革命先锋蜕变为秩序维稳工具。虽然国民党曾想借此重振士气，但效果充其量也只能说收效甚微。"
 YUN.endgame.041.a: "德行端正，方为君子。"
 YUN.endgame.041.b: "革命反动，水火不容。"
 YUN.endgame.042.t: "保甲制度的回归"
 YUN.endgame.042.d: "虽然国民党历来秉承革命传统，但显而易见的是，他们正向着更为保守、维护现状的方向转变。许多黄埔系军官，包括高级将领在内，都自诩为曾国藩和胡林翼之类的人物——曾国藩和胡林翼曾在清朝末年担任地方巡抚，镇压太平天国运动。\n\n按照国民党的新路线，曾国藩和胡林翼既体现了正规军官的专业素养和严格纪律，又带有中国传统精英阶层的士大夫背景（中国古代重文轻武，受人尊敬的将领通常首先是士大夫，其次才是军人）。作为一个曾经高度推崇华南太平天国运动的政党，国民党官员对曾国藩之流的尊崇无疑颇为讽刺，但或许也可以理解。\n\n事实上，由于国民党在打击社会主义和军阀叛乱分子的同时，力求恢复地方秩序、重振党内士气，因而正式接受了曾国藩和胡林翼一个多世纪前提出的原则。一些学者称之为“新复辟主义”，这些原则包括：1.）在控制区严格执法；2.）恢复保甲制度；3.）组织忠诚士绅力量。\n\n对于一个曾以革命者身份激烈抨击保甲制度与士绅阶层的政党而言，这无疑是一个重大转变。士绅阶层恢复其维护地方秩序的旧有角色后，他们被要求承担组建多数保甲民团的任务——这是他们恢复或新增的诸多旧特权之一。然而，这一变化也带来了新的转折，这些受过良好教育的士绅如今成为了向农民灌输国民党意识形态的前沿阵地。"
 YUN.endgame.042.a: "经过实践检验的有效方法。"
 YUN.endgame.042.b: "我们应该保留更多灵活性。"
 YUN.endgame.043.t: "天主教与中华民国"
 YUN.endgame.043.d: "当国民党势力于三十年代陷入低谷时，何应钦皈依了天主教。何应钦出身于动荡不安的贵州，在当时深受法国影响的西南地区，许多当地名门望族在传教士的影响下皈依了天主教，其中就包括王文湘（何应钦的妻子）一家。在至暗时刻，何应钦从信仰中找到了慰藉（尽管他不愿透露任何具体动机），包括天主教强调的自律、社会正义和个人修养等人们熟知的教义。如今，他将以国府主席的身份继续践行信仰。\n\n作为信仰国内小众宗教的国家元首，何应钦主席需要兼顾多方利益。何应钦天性内敛持重，能够在公众场合保持庄重仪态，但也谨慎避免流露出过度偏爱某种宗教的倾向。毕竟在许多中国民族主义者眼中，天主教是外国强加和操控的。\n\n何应钦和其他中国天主教徒一样，对中国传统怀有深厚的感情。对于这位中国最受瞩目的天主教徒来说，幸运的是，最近的宗教和政治发展有助于弥合东西方之间一些旧有的隔阂。罗马教廷传信部已正式宣布：中国的祭祖习俗本质上并非迷信活动，在遵循某些限制的情况下予以许可，此举成功化解了历史上因“礼仪之争”导致传教士被驱逐的长期矛盾。\n\n在国际层面，天主教廷已与中华民国建立邦交关系，北平总教区总主教田耕莘被擢升为枢机主教。\n\n何应钦在公开场合较少言及个人信仰，但对“道德复兴运动”表达了明确支持。该运动由美国路德宗牧师富兰克林·布克曼创立，旨在复兴基督教道德观，推动国际和平与经济复苏。"
 YUN.endgame.043.a: "虔信之人。"
 YUN.endgame.044.t: "行政院新院长"
 YUN.endgame.044.psc.d: "革命先贤戴季陶即将退休。过去几十年间，戴季陶为革命鞠躬尽瘁，他曾先后担任过孙中山先生的翻译、上海地下支部领导、宣传家、作家、党内权威，并在过去几年间一直担任行政院长。如今国家迎来统一，他则选择体面地退休，为自己传奇的职业生涯画上句号。他与国府主席间的关系若即若离，有时还会传出不谐之音。但事实证明，二人间的关系是富有成效的：国府主席与行政院长共同缔造了崭新的民国。\n\n尽管有人猜测戴季陶退休也许并非自愿，以及他下一步的打算，但这位即将离任的行政院长在自己的退休宴会上向党员们保证：自己可能会留在公共领域，继续为新生的民国扶上马送一程。他曾考虑过在教育领域或政府中某个不那么辛苦的岗位（如监察院或考试院）上度过自己的晚年。\n\n戴季陶直言不讳地表达了对自己继任者的看法。他曾严厉批评杨永泰是代表资本主义和反动派利益的两面派，并经常在公开和私下批评他的奸诈之举。戴季陶很肯定杨永泰正是迫使自己退休的罪魁祸首，尽管戴季陶对此无能为力，但这并没有阻止他在即将离任之时对杨永泰大加指责。"
