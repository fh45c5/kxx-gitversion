 YUN_the_fight_for_human_rights_modifier: "争回人权"
 YUN_the_fight_for_human_rights_modifier_desc: "争回人权的斗争是一场永恒的斗争。人权不仅仅包括那些国家赋予公民的民权，还包括哪些与生俱来的权利。这些权利自我们呱呱坠地便被赋予了每个人。正是那些包括思想自由、结社自由、言论自由、职业自由等等在内的，基本而不可剥夺的权利构成了自然法。人权是新月社斗争的基础，也将成为整个中国民主同盟斗争的基础。\n\n中国宪法必须成为世界上第一部以真正的公民民主来支撑其民主条款的宪法。因为一个自由而真正的民主制度必须将人权置于其构成其基础的纸面之上。是一个人，就有想法。有思想就要表现他的思想，要表现他的思想，他非要说话不可。人类必须被允许自由而自愿地发挥自己的才能，并且不能被别人的欲望所吓阻，此即为暴君恶果(Sic semper tyrannis)！"
