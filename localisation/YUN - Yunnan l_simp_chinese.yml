 YUN_country_intro_header: "§l东大陆主人§!"
 YUN_country_intro_content: "作为反清思想长久以来的温床，§Y云南§!在1911年§l辛亥革命§!爆发后便坚决地拿起了武器。在§m李根源§!的领导下，云南陆军讲武堂（即后来的云南陆军讲武学校）成为了当地革命棋盘上的金角银边——云南讲武堂的校友和师生无不与§l同盟会§!有着或多或少的联系。在§m李根源§!、§P蔡锷§!、§a罗佩金§!、§P刘存厚§!、§m顾品珍§!及§a唐继尧§!等人的主持下，§Y云南§!§l同盟会§!在1911年10月30日（即重阳节）自行发动了策应§l辛亥革命§!的起义，史称“重九起义”。§Y云南§!作为第一批在§l辛亥革命§!中取得完全胜利的省份，随即奔袭§Y川§!、§Y黔§!两省，鼓动其当地势力起兵反清，对§Y桂§!、§Y粤§!两省亦是如此。§P蔡锷§!与§a唐继尧§!成为民族英雄，分别登上了§Y云南§!和§Y贵州§!的都督之位。\n\n§P袁世凯§!阴谋篡位后，南北两地危如累卵的格局一触即发。§l辛亥§!革命英雄、忠诚的革命党人§c李烈钧§!在§a孙中山§!的指挥下发动了§c二次革命§!。但§Y滇§!、§Y黔§!在内的各省拒绝响应号召，注定了这次起义的失败命运。在局势平衡仍然岌岌可危之际，§P蔡锷§!以被“提拔”到§Y北京§!就职之名，被迫调离§Y云南§!，而接任者顺理成章成了§a唐继尧§!；§P刘显世§!则接替§a唐继尧§!入主§Y贵州§!。\n\n§P袁世凯§!计划复辟，引得§m李根源§!、§a唐继尧§!、§c李烈钧§!和§P蔡锷§!及一众国内外革命党人筹备起兵抗袁。他们公开要求§P袁世凯§!处决一切帮助其复辟的走狗，自然也没有得到回应。于是§P蔡锷§!、§c李烈钧§!和§a唐继尧§!三人一同宣布组建§l护国军§!，并宣布从§c中央政府§!独立。§Y云南§!以一省之力对抗余下整个中国，在与§e北洋§!军交锋初期便取得了辉煌的关键胜利，随后得到了§Y黔§!、§Y桂§!、§Y粤§!三省的响应，最终策动了整个华南（有些省份自然是见风使舵）。\n\n就在护国战争节节胜利，护国军政府宣告成立之际，§P蔡锷§!和§P袁世凯§!却双双离世，留下一地军阀混战的摊子。在§P冯国璋§!和§P段祺瑞§!的政治斗争中，§P袁世凯§!事实上的继承者，即北方国会遭到解散，§a孙中山§!、§c章太炎§!等人则在§Y广东§!发动§l护法运动§!作为回应。当然，这场运动最后遭到了妄图与§e北洋政府§!谈判的§P陆荣廷§!、§a岑春煊§!之流的篡夺。§a唐继尧§!就任护法政府副元帅，但很快辞任，继续运筹着他那把控西南的雄心壮志。\n\n20年代初，§Y联省§!运动在知识分子中兴起，而在军阀中也有了§P卢永祥§!、§a曹锟§!、§c赵恒惕§!、§a唐继尧§!、§l陈炯明§!、§S熊克武§!等一众支持者。而1925年，§a孙中山§!去世后，§a唐继尧§!便前去声称想要继任大元帅，但遭到了§P新桂系§!的果断反击，并在蔑视中灰溜溜地逃回了§Y云南§!和§Y贵州§!。"
 YUN_country_intro_header_1: "§g西南王§!"
 YUN_country_intro_content_1: "§a唐继尧§!在自己的政权中极大程度处于边缘地位，并且对国民党入侵的恐惧与日俱增，于是便将责任全盘归咎于滇军四大镇守使之一的§P张汝骥§!，将此人贬到§Y蒙自§!，而由§g龙云§!接收了§Y昆明§!。§P胡若愚§!接收§P张汝骥§!的旧地盘，§P李选廷§!则留在§Y大理§!。1926年7月，§a唐继尧§!组建了自己的政党，称其不受外国思想主义的影响，且与“国粹”相兼容。这就是所谓的§c民治党§!。§c民治党§!坚决鼓吹§Y联省主义§!，与§a唐继尧§!一年前的老上司§l陈炯明§!建立的§l致公党§!过从甚密。\n\n1927年初北伐失败后，§a唐继尧§!试图再次入侵§k国民党§!，但其部下拒不从命，转而发动了一场政变。在§P胡若愚§!带头发动§Y二·六政变§!，使§g龙云§!一跃成了§Y云南§!最大的军阀。而§a唐继尧§!则继续担任傀儡都督，维持着脆弱的平衡。而随后，§a唐继尧§!用计在4月6日推翻了§g龙云§!，在§Y蒙自§!掀起叛乱将§P胡若愚§!赶出§Y昆明§!，后又命令§P孟友文§!驱逐了§g龙云§!。\n\n1927年初，§k国民党§!长征进入§Y贵州§!，§P蒋介石§!也在二月被暗杀，§c朱培德§!继任§P总司令§!，与内斗中的§Y云南§!军阀谈判，强行驻扎进了§Y贵州§!省。\n\n唐继尧取得了胜利，而§R国民党§!威胁日盛，西南王最终重夺§Y昆明§!，逼迫局中各方协商调解：§a唐继尧§!接收§Y昆明§!、§g龙云§!接收§Y昭通§!、§P胡若愚§!、§P李选廷§!和§P张汝骥§!则接收§Y蒙自§!。§P胡若愚§!的前部下，§a唐继尧§!的支持者§a孙渡§!则接收§Y大理§!。在1928年第四次直奉战争期间，§a唐继尧§!重启与§Y北京§!方面的谈判，为§Y联省派§!争取了中央政府资助上的让步，以及约定一同打击§a贵州§!的§R国民党§!。\n\n但与北伐时情况极其相似，§g龙云§!不愿牺牲自己的部下，因此最终并无实质性的进展。30年代时，§g滇系§!对§z直系政府§!日渐失望，也停止了对§k国民党§!的攻击。与此同时，§k国民党§!§g军政府§!也在§Y贵州§!成立了由§P何应钦§!、§c谭延闿§!、§c朱培德§!、§a程潜§!和§P李宗仁§!组成的五人执委会。在重组国民革命军残兵后，他们将部队整合成为国民革命军第一军、第三军、第六军和第七军，继而排挤了§c谭延闿§!。"
 YUN_country_intro_header_2: "累卵之局"
 YUN_country_intro_content_2: "§M滇系§!\n§Y云南§!省内的各个政治派系，在其中达成了微妙的平衡。其中核心便是以§a唐继尧§!而得名的§a唐继尧派§!，他们也是本省政坛中的代表人物。§a唐继尧派§!直接听命于§P蔡锷§!的继承人§a唐继尧§!，他们过去和唐继尧本人一样遭受了打击。这些人既鼓吹专制，又鼓动进步，最终是为了实现§Y联省主义§!。§a唐继尧派§!努力争取着改良派知识分子的支持，同时也保持着士绅与军官的效忠。与此相关的是§c民治党§!，其为§a唐继尧§!早年§c民主党§!的后继者，代表着唐省长受§c梁启超§!、§c章士钊§!和§c章太炎§!的影响，所采取的更为改良、民主与保守的政治作风。\n\n而不懈追求着民主的则是清高的§l新月社§!，他们是一群在英美国家受教育的、一同为§l《新月》月刊§!撰稿的知识分子。这些人由于采用更为温和及现代保守主义的中国文化观，经常与左翼作家唇枪舌剑。§l新月诗人§!们倡导着以人权与教育为重的具人文情怀的宪政思想。\n\n剩下的则是§P胡若愚§!和§g龙云§!以各自的名号集结起来的派系。他们采用着各种形态的半吊子进步主义政府立场。这些军阀集团的真正愿望只是安居高位、壮大云南，并力求能在省内站稳脚跟（至少表面上如此）。这其中还包含着各式各样的利益小团体，比如§m云南总商会§!和§n中国青年党§!等等，不一而足。\n\n§M国民党§!\n§k国民党§!的残余势力已经在§Y贵州§!安营扎寨，但其中仍有着各式各样的对于三民主义和§a国父§!遗教有着各色意识形态的见解的派系。贵州的§k国民党§!以新右派为核心，连同着旧右派的拥趸一起，团结在首席思想理论家§a戴季陶§!的旗下。然而，真正的权力却掌握在§P蒋介石§!的继承人手中，即§P何应钦§!领导下的§P黄埔系§!。他们通过§a戴季陶§!推广的复兴式极端民族主义，宣称§P何应钦§!溯源于传统文化信仰，追求着中华复兴与国民革命。\n\n在§a戴季陶§!的工作下，目前以§a陈氏兄弟§!为首的革命同志会浙江社正寻求合并为非正式的政治实体§a中央俱乐部§!，并聚拢了一批与§P黄埔系§!家长式革命民主主义思想相近的、践行独特“唯生哲学”的技术官僚。他们的反对派则是凭借政府吏治和银行财权占据生态位的§m新政学系§!。这些人本质上是社会翘楚与技术官僚，也对于所谓“自由”与民权的骗局心知肚明——一切不过都在吏治之下。\n\n而激进派则各自聚拢于左派的§S土木系§!和右派的§n蓝衣社§!。蓝衣社坚称§R国民革命§!已然误入歧途，并效仿着萨文科夫与科德里亚努。§S土木系§!由于和§r临时行动委员会§!过从甚密，因此在本党的左翼中占据着一个横跨§S左§!§a右§!的特殊生态位。\n\n不过，占据主导的仍然是代表着§a国民党旧右派§!的§c朱培德的第三军§!。他们信奉正统三民主义，坚决拥护§a胡汉民§!作为§Y中央委员会§!领袖的权威。§c朱培德§!本质是地方派，只寻求让中央委员会重返§Y两广§!。而他的身边则是§R朱德§!的§c第三军§!左派，这些人深受来自§R临委会§!的§R章伯钧§!影响。"
 YUN_introminigame_war_preparation_complete_flag: "§Y已完成入侵贵州的初期准备。§!"
 YUN_first_amongst_equals_trait: "同侪之首"
 YUN_engineer_of_the_CC_clique_trait: "CC系的工程师"
 YUN_engineer_of_the_CC_clique_trait_desc: "§L“生是宇宙的重心……人类历史的根本动力是人类求共生、共存、共进。”§!"
 YUN_apostle_of_the_cultural_revolution_trait: "文化革命之使徒"
 YUN_apostle_of_the_cultural_revolution_trait_desc: "§L“要求全人类的真正解放，必须要以中国固有的仁爱思想为道德基础，把一切科学的文化，都建设在这一重仁爱的道德基础上面。”§!"
 YUN_socialist_at_heart: "骨子里的社会主义者"
 YUN_socialist_at_heart_desc: "§L陈诚是国民党新右派内部的异类，许多与其关系密切之人都称他是“骨子里的社会主义者”。他为实现民生主义而采取的行动则更加印证了这种说法。§!"
 YUN_little_generalissimo: "小委员长"
 YUN_little_generalissimo_desc: "§L土地者生命之根源也。土地供不应求，沦为了个体争斗与国家征伐的掠夺对象。而在小委员长的领导下，土地终将得到自由。§!"
 YUN_champion_of_the_peasantry: "农民的捍卫者"
 YUN_champion_of_the_peasantry_desc: "§L“在以农业经济为中心之国家，土地之投资与剥削，实已构成阻碍工商业发展之最大障碍，是故欲谋工商经济之发展，亦必须从土地改革中解除资本与劳力之桎梏。”§!"
 YUN_the_lingxiu: "领袖"
 YUN_the_lingxiu_desc: "§L“所以领袖好则其所领导的革命事业突飞而猛进；领袖不好，则其所领导的革命事业，就难免误入歧途。”§!"
 YUN_the_generalissimo: "委员长"
 YUN_the_generalissimo_desc: "§L作为军方的代表人物，何应钦坚信“军事实力是国家生存与发展的唯一保障”。§!"
 YUN_marshal_of_the_new_right: "新右派主帅"
 YUN_marshal_of_the_new_right_desc: "§L何应钦对中华民族永远忠诚，他发誓要推动“一个主义，一个政党”的理念，而这个主义就是戴季陶的精神革命理论。§!"
 YUN_the_crude_reformist: "粗枝大叶的改革者"
 YUN_the_crude_reformist_desc: "§L在中国自由派寡头盟友的簇拥下，何委员长肩负起了建立国家民主传承的重任。§!"
 YUN_safeguarding_chinese_democracy_trait: "保障中国民主"
 YUN_safeguarding_chinese_democracy_trait_desc: "§L“进则忧国，退则乐天，其志尽见于诗。”“其思精也，如谋国；其气胜也，如用兵；其用法从宽也，如恤民；其用情至深也，如爱士。”§!"
 YUN_modernising_maverick: "追求现代的超群者"
 YUN_modernising_maverick_desc: "§L幕后交易是许多政府的运作方式，而对于政学系来说，这种诡计则是为了追求国民革命。§!"
 YUN_the_first_assessor: "章门复圣"
 YUN_the_first_assessor_desc: "§L唐继尧集睿智之王、贤明之君、博学之士于一身，是章太炎门下毋庸置疑的“复圣”颜回。§!"
 YUN_the_third_assessor: "章门述圣"
 YUN_the_third_assessor_desc: "§L唐筱蓂接受了自己父亲、章太炎，以及其他许多共和派政治家的言传身教，如今的他堪称章太炎门下的“述圣”子思。§!"
 YUN_master_of_the_eastern_continent: "东大陆主人"
 YUN_master_of_the_eastern_continent_desc: "§L唐继尧可能是中国有史以来最伟大的政治家，如今他正炙手可热。作为中国政坛上无可争议的第一人，他会为复兴中国采取一切必要手段。§!"
 YUN_the_princeling: "唐家世子"
 YUN_the_princeling_desc: "§L虽然唐筱蓂不如其父那般广受赞誉，但他仍然尽力确保唐家政治王朝能在所有国人心目中保持良好形象。§!"
 YUN_the_patriot_pedagogue: "爱国主义教育家"
 YUN_the_patriot_pedagogue_desc: "§L“你们要在艰苦的环境里磨炼你们的精神，在斗争里发展你们的力量……我相信每一个黄帝的子孙，是不会当顺民，不甘心做奴隶的！”§!"
 YUN_the_lonesome_warrior: "孤勇者"
 YUN_the_lonesome_warrior_desc: "§L罗隆基因其火爆脾气而闻名。与张君劢相比，他是出了名的令人生厌；与黄炎培相比，他又“不太像中国人”。但也有人认为，正是这种性格才让他对民主的执着追求更加强烈。§!"
 YUN_king_of_yunnan: "云南王"
 YUN_king_of_yunnan_desc: "§L数十年来，龙云都在云南政坛中岿然不动，并牢牢掌控着云南省。§!"
 YUN_dian_dragon: "滇龙"
 YUN_dian_dragon_desc: "§L出身西南地区的龙云曾经不过是一介军阀，但如今他执掌全国，成为了一名真正的政治家，在中国鲜有人能比他更坚韧不拔。§!"
 YUN_the_great_commandant_trait: "大统帅"
 YUN_the_great_commandant_trait_desc: "§L胡若愚是之前众多军事强人大总统的精神继承者，他在文武两端都表现出超凡的力量与决心。§!"
 YUN_reluctant_revolutionary: "不情愿的革命者"
 YUN_reluctant_revolutionary_desc: "§L卢汉为人最为务实，愿意为了实现自己的政治野心与任何人合作，哪怕合作对象是那些更具革命性的人。§!"
 YUN_phase3_econ_tree_reward_state_modifier: "振兴华南经济"
 YUN_phase3_econ_tree_reward_state_modifier_desc: "我们的经济改革终于结出了硕果。当我们作为国家政府开始执政之际，华南经济模式的成功将向全国展示我们的能力。"
 YUN_civil_engineerings_reforms_effect: "土木系改革"
 YUN_civil_engineerings_reforms_effect_desc: "受陈诚打击土豪劣绅、废除富人社会统治地位的行动启发，他的政府推动了诸多地方省级当局致力于限制地租、减免田赋，并着力根除精英阶层的统治地位。"
 YUN_spiritual_authoritarianism_effect: "新右派内诸系"
 YUN_spiritual_authoritarianism_effect_desc: "新右派建立在何应钦那种剑走偏锋、高危险峻的军事中间主义统治方式之上，而其内诸系代表了各自背后的掌门人的势力。\n§Y该精神的效果会随当下$market_liberal_coloured$、$authoritarian_democrat_coloured$、$national_populist_coloured$、$social_democrat_coloured$和$paternal_autocrat_coloured$党派支持率修正。§!"
 YUN_spiritual_authoritarianism_dynamic_modifier_tt: "§C获得一个动态修正，其效果取决于当前$market_liberal_coloured$、$authoritarian_democrat_coloured$、$national_populist_coloured$、$social_democrat_coloured$和$paternal_autocrat_coloured$的党派支持率。§!\n当前效果：\n-政治点数增长：[?YUN.party_popularity@market_liberal|=%+]\n-党派支持率对稳定度修正：[?YUN.party_popularity@authoritarian_democrat|=%+]\n-战争支持度：[?YUN.party_popularity@national_populist|=%+]\n-工厂产出：[?YUN.party_popularity@social_democrat|=%+]\n-最大指挥点数增长乘数：[?YUN.party_popularity@authoritarian_democrat|=%+]"
 YUN_national_defense_fortification_plan_effect: "国防线计划"
 YUN_national_defense_fortification_plan_effect_desc: "为了防止被境外势力消灭，当局启动了一项雄心勃勃的国防线计划，旨在加强中央对边境的控制。"
 YUN_towards_revolutionary_datong_modifier: "回归精神根源"
 YUN_towards_revolutionary_datong_modifier_desc: "中国西北边疆蕴藏着尚未充分利用的丰富资源和宝贵财富，中央政府只需加以开发即可。为了确保边疆安全，同时在国家的精神圣地树立民族自豪感，国民党已着手在西北地区推行精心规划的发展计划，力求在实现现代化的同时，维护该地区的微妙平衡。"
 YUN_constituent_of_the_chinese_confederation_modifier: "中华邦联组成"
 YUN_constituent_of_the_chinese_confederation_modifier_desc: "中央政府赋予各组成省份广泛权力，正是联省主义的精髓所在。我们的做法虽未如章太炎设想的那般彻底，但他的思想精华依然深刻影响着国家和省级层面的相关政策。"
 YUN_kunhu_power_plant: "昆湖电厂"
 YUN_yunnan_resource_company: "云南资源公司"
 YUN_kunming_arsenal: "昆明兵工厂"
 YUN_Guizhou_Chishui_Arsenal: "贵州赤水兵工厂"
 YUN_Machine_Bureau: "云南机器局"
 YUN_agrarian_economy_idea1_desc: "在几十年的管理失当、冲突动乱之下，农业领域已经陷入了灾难。如果华南想要步入现代，农业改革就必须尽快付诸实施。"
 YUN_baring_our_teeth_idea: "咬紧牙关"
 YUN_baring_our_teeth_idea_desc: "滇军只是暂落下风，还不到满盘皆输。此刻我们能力有限，难以让影响力冲出事实上的边界，现在是时候让滇军这头野兽再次醒来，拿起新的装备，并向天下展示云南才是西南地区多年来的王者。"
 YUN_baring_our_teeth: "咬紧牙关"
 YUN_baring_our_teeth_desc: "自从我们在这个十年之初采取的策略以失败告终，滇军就变得过于谨小慎微。甚至不敢在滇黔省界之外宣示自己的权益。在滇军的默许下，国民革命军的残余势力盘踞贵州，袁祖铭在贵州边境之外张牙舞爪，德国势力则在省内矿区不断扩张势力。现在是滇军一鸣惊人之时了。"
 YUN_guangxi_arsenals: "广西军工厂"
 YUN.midgame.520.f: "而真正的革命必将无往不利。"
 YUN_KMT_civil_war_no_Zhang_tt: "§Y如果§g威权民主主义§!支持率大于§S社会民主主义§!与§c社会保守主义§!支持率之和，§g胡若愚§!就将获胜。\n如果§S社会民主主义§!支持率大于§c社会保守主义§!支持率，§S陈诚§!就将获胜。\n其他情况下，§c朱培德§!就是默认的赢家。§!"
 YUN_KMT_civil_war_Zhang_tt: "§Y如果§R激进社会主义§!支持率大于§S社会民主主义§!、§c社会保守主义§!和§g威权民主主义§!支持率之和，§R章伯钧§!就将获胜。\n$YUN_KMT_civil_war_no_Zhang_tt$§!"
 YUN_UPC_civil_war_tt: "§Y§g威权民主主义§!与§c社会保守主义§!支持率之和代表了§g唐继尧§!的实力。\n§P家长制独裁§!与§m市场自由主义§!支持率之和代表了§P胡若愚§!的实力。\n§S社会民主主义§!与§l社会自由主义§!支持率之和代表了§S寸树声§!的实力。\n最终的赢家会是三者中实力最强的一方。§!"
 YUN_luo_longji_improved: "§Y罗隆基§!获得§Y孤勇者§!特质，其效果为：\n -$political_advisor_cost_factor$: $RIGHT|+=$§R+25%§!\n -$MODIFIER_POLITICAL_POWER_FACTOR$: $RIGHT|+=$§G+10%§!\n -$MODIFIER_STABILITY_FACTOR$: $RIGHT|+=%0$§G+10%§!\n -$social_liberal_drift$: $RIGHT|+=$§Y+0.02§!"
 YUN_wang_fusheng_commander_desc: "§Y生于：§!§L1896年9月27日；大清、云南省祥云县§!\n§Y派系：§!§r云南工团党§!\n§Y背景：§!§L$YUN_wang_fusheng_bio$§!"
 YUN_zeng_wanzhong_commander_desc: "§Y生于：§!§L1894年；大清、云南省大关§!\n§Y派系：§!§R第三军左派§!\n§Y背景：§!§L曾万钟早年考入云南陆军讲武堂，与朱德、朱培德同期，毕业后投身革命事业，于1911年参加重九起义，后参加护国战争，任营长；又参加护法战争，任团长。他曾被编入靖国军，于二十年代协助顾品珍推翻唐继尧政权，后因唐继尧东山再起而下野流亡。\n\n1923年，曾万钟加入驻粤滇军，随军参与了东征战役和镇压商团事变，声名鹊起。1926年，他被编入朱培德第三军，率领第十九团参加北伐，英勇作战，受到蒋介石的亲自嘉奖。\n\n北伐失败后，曾万钟率部且战且退，撤往黔桂两省交界处。由于认为朱培德管理不善，他逐渐倒向了第三军内部的朱德派系。§!\n\n§Y备注：曾万钟生活简朴，没有置办半点田产，也没有积蓄。他痛恨一切形式的腐败，鄙视敲诈勒索，在军中始终两袖清风。§!"
 YUN_chen_cheng_sic_desc: "§Y生于：§!§L1898年1月4日；大清、浙江省青田县§!\n§Y派系：§!§S土木系§!\n§Y背景：§!§L陈诚少时家庭经济拮据，其父本打算留他在家里佐理家务以补贴家用。但陈诚却自作主张，先在家温习功课一年，然后步行一百多里投考附近的学校。师范毕业后，他原本希望投考日本陆军士官学校，却因身材瘦小而被拒绝。他改为用计报考保定军官学校，却因考试成绩差，身材矮小，未被录取。最后靠一位家族故交的关系入读保定军校炮科。\n\n直皖战争爆发后，陈诚南下广州，在新建粤军服务，并加入了中国国民党。等到保定军校复课，他又回校继续学业。1922年毕业后，陈诚投奔了与自己有师生之谊的邓演达，担任副官。在担任孙中山大元帅府警卫期间，陈诚胸部中弹，适逢蒋介石赴医院慰问伤员，对陈诚的英勇之举大为感动。黄埔军校成立后，孙中山、蒋介石、邓演达三人一致同意将陈诚送进军校。\n\n在黄埔军校就读期间，陈诚同时担任了教官兼区队长。第一次东征期间，陈诚的英勇奋战受到蒋介石的赞许，也为自己赢得了“三炮起家”的美誉。北伐期间，陈诚在国民革命军战绩最为巅峰之时升任师长。但之后德国人干涉北伐，陈诚的恩师蒋介石也随后遇刺身亡，继任者何应钦在国民革命军流亡贵州后将陈诚解职。但陈诚并未气馁，而是在接下来的数年间担任军事管理职务，并在黄埔系内组建了名为“土木系”的小圈子，践行着蒋介石与邓演达着两位恩师的思想。§!\n\n§Y备注：陈诚生活简朴，远离享乐，并极其反对贪污腐败。§!"
 YUN_zhang_qun_commander_desc: "§Y生于：§!§L1889年5月9日；大清、四川省华阳§!\n§Y派系：§!§m新政学系§!\n§Y背景：§!§L$YUN_zhang_qun_bio$§!"
 YUN_yang_yongtai_sic_desc: "§Y生于：§!§L1880年；大清、广东省茂名§!\n§Y派系：§!§m新政学系§!\n§Y背景：§!§L杨永泰出生于广东省一个富庶的城市家庭，早年接受了严格的传统教育，1897年便考取了秀才的功名。21岁时，他便前往广东高等学堂接受西式教育，后转入北京政法专门学校学习。毕业后，杨永泰以文笔流畅、思维敏捷、立论深刻、思想活跃而闻名于当地。随着声名日盛，他对于革命的渴望也愈发强烈，随之撰写了许多主张君主立宪的文章。\n\n1912年杨永泰当选临时参议院议员，继而当选国会参议院议员，后因袁世凯解散国会而下野，最终接触到了黄兴与孙中山。杨永泰投身于孙中山的中华革命党，参加了护国战争，作为李烈钧的幕僚出任财政厅长。他与李根源等人首创政学会，并在1917年被孙中山广州政府内定为财政厅长，但在政学系的阻挠下，他没有赴命。在唐继尧和政学系的运作下，孙中山愤而下野，杨永泰也于此时出任了广东省长。\n\n杨永泰担心遭报复，于是动身前往北洋政府。曹锟贿选事件后，他又辗转落脚上海，在那里寓居直到1927年。当年蒋介石下野时，杨永泰就给国民党官员写了一系列信件，表达其拥蒋复蒋、重返政坛的愿望。大多数信件都石沉大海，不过他还是动用关系在王伯群手下找到了生计。在转进贵州后，张群便注意到了他的雄心壮志，便幕后扶植杨永泰东山再起。杨永泰被视作张群的副手，有着团结新旧政学系的本领。§!"
 YUN_gu_zhenglun_commander_desc: "§Y生于：§!§L1889年；大清、贵州省安顺府§!\n§Y派系：§!§L独立派系§!\n§Y背景：§!§L谷正伦是谷氏兄弟中的老大。他自幼从军，1906年，他毕业于贵州的贵阳陆军小学堂，入学湖北的武昌陆军第三中学堂。1909年，他被保送到专为中国留学生开设的日本东京振武学校。在日期间，谷正伦开始支持同盟会这个共和派民族主义地下组织。1911年，他参加辛亥革命，越发投身于国民革命事业。\n\n完成留日学业后，谷正伦回到家乡贵州，进入黔军服役。孙中山发动护法运动时，他再一次与孙站在一起，率部进军四川。随后，旧桂系背叛了广州国民政府，他又率部讨伐桂逆，攻克桂林。在北伐战争中，谷正伦表现优异，但德国的干涉还是将国民党统一全国的雄心打了个粉碎，谷正伦也被迫跟随国民革命军残部逃往贵州。\n\n谷正伦利用自己在贵州省的关系和资历，顺利成为黔省政坛中一位颇具影响力的人物。通过他的两个胞弟谷正纲、谷正鼎，谷正伦与巴黎保持着联系，此外，他还连结朱培德、何应钦，共同反对唐继尧。如此，他充当了汪精卫中央委员会和云南国民党残部之间的桥梁。尽管谷正伦并未与贵州境内国民党残部中的任何一个派系结盟，但许多人都认为他是革命军各部、政学系和CC系博弈中额外的一颗棋子。§!"
 YUN_dai_jitao_sic_desc: "§Y生于：§!§L1891年1月6日；大清、四川省广汉§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L$YUN_dai_jitao_bio$§!\n\n§Y备注：戴季陶实乃不拘一格之怪杰，痴迷于儒释两道，又依赖安眠药。他在党内德望甚高，与胡汉民虽对总理遗教的诠释有所出入，但仍然存有私交。§!"
 YUN_chen_guofu_sic_desc: "§Y生于：§!§L1892年10月27日；大清、浙江省吴兴§!\n§Y派系：§!§aCC系§!\n§Y背景：§!§L陈果夫早年深受叔父陈其美的影响，陈其美是中华民国的缔造者之一，也是孙中山的盟友和蒋介石的导师。在叔父的引导下，陈果夫加入了同盟会，并参与了辛亥革命。\n\n后来，陈果夫结识了叔父的门生蒋介石，两人成为挚友，并在1916年陈其美遇刺后展开了广泛合作。1920年，他与蒋介石共同经营上海证券物品交易所，为国民党提供资金。随着蒋介石被孙中山提拔为黄埔军校校长，陈果夫的地位也随之水涨船高，被任命负责上海的人才招揽工作。\n\n在北伐战争惨败、老友蒋介石遇害后，陈果夫和弟弟陈立夫逃离广州，前往国民党残余势力在上海的据点。陈果夫现已成为国民党右派的重要人物，并坚决反对左派中央执行委员会与工团主义势力的联盟——在掌控国民党右派官僚系统，又有弟弟陈立夫在旁辅佐的情况下，陈果夫绝不会坐视孙中山的国民革命陷入此般黑暗的境地。他将重塑国民革命，以此告慰蒋介石、陈其美以及所有为中国未来献出生命的国民革命烈士。§!\n\n§Y备注：陈果夫、陈立夫兄弟一直致力于垄断四分五裂的国民党内的影响力，并将中央俱乐部的蔓枝伸向任何可以触及的地方。§!"
 YUN_gu_zhutong_commander_desc: "§Y生于：§!§L1893年1月9日；大清、江苏省涟水§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L顾祝同自幼立志从军，后辞别家人，入读江苏陆军小学学习军事。学校停办后，他于返乡途中偶然投身于辛亥革命，担任排长。全国学校复课后，他重拾学业，于1916年入湖北武昌预备军官学校法文班就读，就读期间曾试图协助护国军，但未能成功，于是回乡躲避，后考入保定陆军军官学校，最终于1919年以优异成绩毕业。1920年，他与孙中山频繁往来，又于1922年结识了蒋介石，两人一见如故。蒋介石推荐他出任许崇智的上尉副官后，他对蒋介石的善意感激不尽，并发誓无论何时都会与蒋介石并肩作战。\n\n顾祝同参与了黄埔军校的创办，并担任战术教官，后在东征讨伐陈炯明的战斗中身先士卒，功勋卓著。北伐初期，他在国民革命军第一军中与周荫人部英勇作战，但最终因蒋总司令遇刺、国民革命军溃败而功亏一篑。北伐失败后，他跟随战友撤退至贵州，在痛惜挚友恩人身死的同时，也希望能与何应钦等黄埔系成员一起，将蒋介石的理想发扬光大。§!\n\n§Y备注：由于顾祝同高度忠于何应钦和蒋介石，因此获得了“顾百顺”的绰号。§!"
 YUN_qian_dajun_theorist_desc: "§Y生于：§!§L1893年6月14日；大清、江苏省吴县§!\n§Y派系：§!§P黄埔系§!\n§Y背景：§!§L钱大钧出身商贾之家，却选择参军入伍，于1909年保送江苏陆军小学，辛亥革命后曾短暂服役，后于1912年毕业，毕业后不久便参加了1913年的二次革命，加入了钮永建所组织的敢死队。他受钮永建举荐东渡日本，就读于日本浩然学社，留日期间结识了孙中山，并于1914年加入了革命党（即后来的国民党）。1915年回国后，他进入武昌陆军第三预备学校学习，后因参与反袁活动而被迫辍学。袁世凯死后，他重拾学业，后来进入保定陆军军官学校炮兵科学习。\n\n在正式入学保定军校之前，钱大钧先是在东京的振武学校就读，后来又进入日本陆军士官学校学习。从陆士毕业后，他与欧阳藻丽成婚，最终进入保定军校炮兵科学习。1921年，他决定辞职南下广东投效孙中山，加入了许崇智麾下的部队。他是黄埔军校校务筹备的核心人物之一，后担任兵器教官。东征战役后，他取代了表现不佳的第二教导团指挥官王柏龄，后来又出任何应钦的参谋长。\n\n北伐战争期间，钱大钧出任广州警备司令部司令。虽然他英勇抵抗了德军入侵，但未能阻止国民党失去这座城市。北伐失败后，他跟随国民革命军的其他成员来到贵州，在何应钦手下担任师长和参谋。§!"
 YUN_li_shizhen_commander_desc: "§Y生于：§!§L1896年；大清、浙江省宁海§!\n§Y派系：§!§n蓝衣社§!\n§Y背景：§!§L李士珍早年被保送到上海求学，毕业于上海公学，后考入浙江大学，1924年入黄埔军校，参加蒋介石组织的右翼“孙文主义学会”，担任学会候补干事。1925年9月毕业后，他加入国民革命军，历任第一军第一师排长、连教导员、营党代表，参加第二次东征，1926年9月参与筹建警官学校，任中央警官学校教育长，中校军衔。1927年，他升任国民革命军总司令部兵站总监部参谋，北伐失败后，任贵州保安团团长。\n\n1930年，李士珍被派往美国学习现代警察技术，在传奇警官奥古斯特·沃尔默手下任职，从沃尔默那里学习了大量关于高效警务的知识。之后，他前往日本学习警政建设，先入日本步兵学校，后在日本警官学校结业，1932年回国后历任军事委员会上校参谋、贵州省警察厅警士教练所所长、蓝衣社下属“复兴社”中央干事会干事、贵州省警察厅秘书等职。§!\n\n§Y备注：李士珍是一位严厉的纪律执行者和警务专家，他的努力大大减少了贵州境内的土匪活动，并赢得了国民党省府的认可。§!"
 YUN_sun_du_high_command_desc: "§Y生于：§!§L1898年5月5日；大清、云南省陆梁§!\n§Y派系：§!§a唐继尧派§!\n§Y背景：§!§L孙渡出生于一个乡绅家庭，1915年考入云南陆军讲武堂步兵科，1917年毕业后加入滇军服役，1922年升任唐继尧直属独立团团长，转战四川、贵州等地，1924年返回云南。此后，他历任云南烟酒公卖总局局长、云南省宪兵司令官等职。\n\n在张汝骥、胡若愚、李选廷和龙云策划二六政变期间，孙渡采取了谨慎观望态度。在看到唐继尧凭借部下的忠诚逐渐恢复元气后，他协助唐继尧平定了政变，并升任云南省团务总局会办，成为唐继尧手下仅次于唐继虞的左膀右臂。\n\n1931年，孙渡因其忠诚表现而被提升为滇军参谋长，并于1931年向唐继尧当局提出大幅裁减滇军的计划，但由于滇系军阀的压力，该计划最终被搁置。§!\n\n§Y备注：孙渡被誉为滇军“小诸葛”、“云南儒将”。§!"
 YUN_wang_weiyu_commander_desc: "§Y生于：§!§L1892年；大清、云南省蒙自§!\n§Y派系：§!§P蒙自派§!\n§Y背景：§!§L王维玉之父在蒙自经营小额钱币兑换业，王维玉受到其父创业精神的影响，十五岁就开始摆糕点、小吃摊。1912年，他与李聘合作共同开矿，规模不断扩大，经营也颇有方。但由于滇南匪患频仍，不断袭扰矿区，为保障矿区安全，个当地众多大矿矿主组成保厂大队，一致公推王维玉为大队长。\n\n王维玉创办了不少矿业学校，并积极参与慈善事业，与德国在滇南的矿业利益集团来往密切，是当地的重要人物，同时也被誉为善人。他既是蒙自派的一名小军官，也是背后金主之一。§!"
 YUN_KR_gathering_storm_desc: "滇系曾是华南共和派的领军力量，如今却在时代的不公中黯然失色。被迫向北京政府屈膝臣服后，唐继尧督理的政府陷入了与贵州国民党残军斗争的僵局。唐继尧自诩为联省运动的领袖，他不仅要镇压国民党乱军，还希望按照自己的意愿实现统一。这位护国传人会让联省旗帜飘扬在中国各地吗？还是说国民革命的梦想会在复仇烈焰中重燃？"
 YUN_not_a_satellite_tt: "§C如果我们在§Y两广§!地区有领土，我们将解锁以下§Y决议§!：§!"
