 YUN_revolutionary_datong_modifier: "实现革命大同"
 YUN_revolutionary_datong_modifier_desc: "新右派终于彻底掌控全党，是时候实现其真正愿景了：不仅要重组中国国民党党内的秩序，更要重组中华民族千百年来赖以称雄亚细亚的道德基石。国民革命的血管已遭到反秩序团体、马克思主义叛徒和腐化分子的渗透与腐蚀，我们亟需为革命清除这些污血与余毒，实现真正的革命大同。\n\n§Y党内的新右派正致力于推广自己的理念，即在以中国传统道德哲学为基础，并追求明治维新式的现代化，建设一个真正的革命之中国。在游戏中这将以动态修正来体现，你可以通过完成政治类国策来增强该动态修正的效果，并使中国更接近新右派理想中的有机国家。§!"
