 YUN.endgame.044.wpc.d: "革命先贤戴季陶即将退休。过去几十年间，戴季陶为革命鞠躬尽瘁，他曾先后担任过孙中山先生的翻译、上海地下支部领导、宣传家、作家、党内权威，并在过去几年间一直担任行政院长。如今国家迎来统一，他则选择体面地退休，为自己传奇的职业生涯画上句号。他与国府主席间的关系若即若离，有时还会传出不谐之音。但事实证明，二人间的关系是富有成效的：国府主席与行政院长共同缔造了崭新的民国。\n\n尽管有人猜测戴季陶退休也许并非自愿，以及他下一步的打算，但这位即将离任的行政院长在自己的退休宴会上向党员们保证：自己可能会留在公共领域，继续为新生的民国扶上马送一程。他曾考虑过在教育领域或政府中某个不那么辛苦的岗位（如监察院或考试院）上度过自己的晚年。\n\n戴季陶十分谨慎地表达了对自己继任者的看法，只在必要的场合以恭敬的言辞谈论之。临别赠言中，戴季陶一边赞扬王伯群对国民党与何委员长的忠心不二，同时又温和地提醒他不要搞裙带关系任人唯亲。他表示自己希望王伯群能够与自己的门徒陈立夫陈果夫兄弟间能齐心协力，共建党的未来。"
 YUN.endgame.044.a: "别了，戴院长！今天最高兴了。"
 YUN.endgame.044.b: "同路不同道，革命之心总相通。"
 YUN.endgame.044.c: "向这位伟大的爱国者予以致敬。"
 YUN.endgame.044.e: "以革命精神发扬戴院长的事业！"
 YUN.endgame.044.f: "感谢戴院长对何委员长的支持。"
 YUN.endgame.045.t: "毋忘在莒"
 YUN.endgame.045.d: "“毋忘在莒”是一个成语，大意为“勿忘莒城之事”。战国时期，莒城被燕国军队围攻，成为衰落齐国的最后堡垒。然而，齐国士兵在逆境中顽强抵抗，最终发动反攻，收复了故土。\n\n毋忘在莒的故事不仅反映了国民党的坎坷经历与最终胜利，也是何应钦主席本人的生动写照。1921年12月，何应钦因内兄王文华遇刺身亡而被迫逃离贵州，藏身于昆明。何应钦曾在丰和茶楼与刺客爆发枪战，胸部和腿部中弹，此次事件及其他数次化险为夷的经历，为他赢得了“福将”的称号。\n\n何应钦并非独自面对绝境，除却这些年来往来更迭的诸多导师、战友与部属，他始终能在妻子王文湘那里寻得慰藉。在1921年丰和茶楼枪战后，王文湘在何应钦康复期间无微不至的照顾，让她成为何应钦眼中的灵魂伴侣——自此以后，王文湘一直帮助何应钦婉拒请托以护名誉，并在多次危机中支持他。据说何应钦有两条人生准则：无论多么疲惫，无论回家多晚，他都要花时间陪伴妻子；每天至少要和她一起吃一顿饭。\n\n这对夫妇虽然没有亲生子女，但收养了何丽珠为养女。从精神层面来说，新生民国才是何应钦的孩子，也是一代军人、革命者和烈士共同孕育的结晶。在新生中国的帮助下，何应钦主席将铭记逝去的战友与收复河山的艰难岁月，并引领国家驶向新时代。"
 YUN.endgame.045.a: "愿他的好运也能保佑我们。"
 YUN.endgame.046.t: "黄埔革命"
 YUN.endgame.046.d: "国民革命军成立的目的是为了革命，而黄埔军校成立的目的是为先锋队培训队职干部。当初人们聚集在黄埔岛的岸边时，他们根本想象不到自己未来将成就何等非凡之伟业。他们不仅为人民建立了一支忠诚可靠的解放力量，还让这些爱国青年们精诚团结，至死不渝。\n\n这些教官来自全国各地，最后在黄埔相识相知。未来的国府主席何应钦来自贵州，时任校长蒋介石和戴季陶、陈其美等政治部干部来自浙江，先总理孙中山则来自广东。但他们对民族、民权、民生的共同信仰超越了省界。\n\n手握钢枪的战士和鼓舞人心的政委齐心协力，这是只有在中国才能见到的奇观。黄埔校友们浴血奋战，历经战败和流亡之苦却矢志不渝，不达使命决不罢休。国民革命军和国民党携手将祖国从军阀割据、帝国主义和腐败官僚的共同压迫下解放出来，把这三座大山从自己心爱的故乡头上推翻。\n\n这种革命兄弟情谊精神为全中国点燃了一盏光明的火炬，而黄埔精神将成为所有受压迫的东方人民的希望灯塔，被永远载入亚洲史册。黄埔系和CC系的伙伴关系将继续下去，去实现并守护自己所立下的崇高承诺，直到中华民族的民族品性得以重建，中国历史翻开崭新的一页。"
 YUN.endgame.046.a: "携着手，向前行，路不远，莫要惊。"
 YUN.endgame.047.t: "将军与元老"
 YUN.endgame.047.d: "国民党在1924年改组后，便燃烧着革命的激情。他们励志推翻北洋政府，带领民众建立一个新的、平等而没有帝国主义秃鹫压迫的繁荣未来，建立一个真正的共和政府。\n\n可悲的是，国民党在北伐期间一溃千里，而最忠诚的国民党爱国者。在何应钦的伟大领导下，国民党不仅推翻了北洋军阀，还使得全中国摆脱了帝国主义的压迫。然而，随着全国统一的任务完成，建设新中国就成为了国民党的首要职责。\n\n何应钦委员长深知为了建设同享民生的新中国，本党必须承担起新的责任。过去的极端民族主义和激烈言论已不能再适应本党开辟中国未来道路的目标，眼下，必须将本党改组为一个受人尊敬的组织。\n\n为此，何委员长允许受西方教育的学者、政治元老和追求中国现代化的技术官僚参与到政府中来。他相信，张群和杨永泰能够带领这帮政治独立人士为本国带来民主与现代的未来。委员长和黄埔系同时也会确保新中国的秩序与稳定，同时防止军阀复辟倒算。\n\n在这方面，许多人也将现政府与明治维新的政府相比较，当年明治天皇的周遭也环绕着技术官僚、现代化主义者与知识分子，协助将日本建设为亚洲第一个现代国家。而且实际上，张群和杨永泰确实在日本院校中求学，从日本体制中受启发良多。\n\n尽管这个新的民主中国未来几十年还要受国民党统治，人们还是对美好的现代化未来满怀希望，将过去几十年的落后与混乱抛诸脑后。革命年代落下了帷幕，如今自由与现代化已经叩响了中国的门扉。"
 YUN.endgame.047.a: "中道为体，革命为用……"
 YUN.endgame.048.t: "行动派的训政"
 YUN.endgame.048.d: "作为代表广大中国人民意志的革命力量，国民党自成立以来始终致力于解放中国的底层民众。这种思想自然催生了许多备受争议的决策，也让社会主义理念吸引了（或者说是渗透）众多党员。二十年代末，国民党彻底崩溃，党内分裂为两个相互竞争的中央执行委员会和左右两派残余势力，各自为国民革命事业而战。那些尝试弥合分歧之人常常受到左右两派的嘲讽，这种情况目前依然存在。\n\n何委员长从办公室里望向[ROOT.Capital.GetCapitalVictoryPointName]连绵起伏的街道和错综复杂的城市，不禁长舒了一口气。身为一名骨子里的军人，何应钦在中国数十载的动荡岁月中如鱼得水，在他的英勇领导下，无数黄埔青年前赴后继，高举三民主义和青天白日的旗帜，踏上了国家统一的征途。然而当山河一统之后，和平岁月又将是何种模样？\n\n一阵敲门声打断了何应钦的沉思。随着一声应允，所谓的“小委员长”踏入了何应钦的私人空间。尽管在国民党分崩离析之后，蒋介石的左膀右臂与接班人之间存在龃龉，但陈诚的话语终究还是打动了何应钦——中国人民需要的不仅是夸夸其谈和军事统治，他们还需要政策、行动，以及能够推动国民革命事业不断发展的正式方略。\n\n陈诚与何应钦都是军人，一位现任行政院长，一位现任国府主席；他们也都是黄埔出身的革命英雄。陈诚与何应钦此刻相对而坐，恍若当年棉湖之战初次打响黄埔威名之时——在暮色苍茫之际，是何应钦率领黄埔残部短兵相接，用拼死一搏的勇气捍卫了革命的萌芽；是陈诚用接连不断的炮火，将林虎的部队打得落花流水。陈诚与何应钦曾经并肩作战赢得最终胜利，或许他们能再度从倾颓的废墟中带来光明的凯旋。"
 YUN.endgame.048.a: "相逢一笑泯恩仇。"
 YUN.endgame.049.t: "振兴革命"
 YUN.endgame.049.d: "中国之局势终于尘埃落定，国内外观察家们一致认为，自辛亥革命以来中国持续不断的内乱终于要画上句号了。尽管对“反革命分子”和“叛徒”的残酷镇压仍在继续，全国各地的城市和农村也不时爆发零星的战斗，但国民党的青天白日旗已在中华大地之上高高飘扬。\n\n国民革命军和国民革命的总司令、军事委员会委员长何应钦发现，面对民族革命复兴中的动荡，只有对党军予以绝对之信任方可取得成功。毋庸置疑，国民革命军的革命素质是实现救国的唯一手段。黄埔军校的学生们都是这个饱受摧残的民族的孩子，他们如手如足，一心一德，愿意为国为民尽忠而不择手段。正是凭借这种精神，他们才得以拯救国家。\n\n尽管人们曾经怀疑国家民粹主义这个外来和尚念的经好不好使，会不会篡夺总理遗教那至高无上的地位。但过去几年中的经验表明，民粹主义或者国家民粹主义的理念确实可以与中国国民党的革命精神和热情和谐共生。在如今这个非常时刻，国家急需秩序与稳定，而蓝衣社正拥有足以维持和平的力量。\n\n从旧中国的灰烬之中，新中国将浴火重生。而民族圣人何应钦委员长将革命热忱与激情的驱使下，成为新生中国的唯一元首与黄埔校长的真正接班人。已故校长曾经实行过的模式如今将被委员长予以完善和调整，成为新生中华民族的一条崭新路线。"
 YUN.endgame.049.a: "让黄埔的精神，常在蓝天上放光明！"
 YUN.endgame.060.t: "清除黄埔系腐化分子"
 YUN.endgame.060.d: "或许是秉承1924年的精神，抑或是为了在动荡时期维护党派凝聚力，又或许正如诸多反对派所言，是为了巩固自身对中国政府的铁腕统治——总而言之，陈诚委员长推行了被通称为“二次改组”的举措。与他雄心勃勃的中央集权计划一脉相承，陈诚认为通过官方政府机构正式实施改组措施才是合适之举。为此，陈委员长设立了一个名为“中央改造委员会”的机构，以取代原有的中央常务委员会和中央执行委员会。\n\n这个新委员会的成员大多属于陈诚一派，国民党新领导层的平均年龄为56岁，均拥有大学或同等学历。值得注意的是，此次改组确立了六大目标：其一，要使国民党成为一个革命民主主义政党；其二，扩大党的社会基础，将农民、工人、青年、知识分子和生产者纳入其中；第三，采用民主集中制作为组织原则；第四，强调党支部是党的基层组织单位；其五，党委作出的一切决定、人事和其他政策事项均应通过正式程序处理；最后，党员必须服从党的决定，拥护党的政策，并保持优良的工作作风。\n\n陈委员长的批评者，尤其是蓝衣社，已经开始猛烈抨击陈诚此举为集权行为。由于被彻底排除在权力渠道之外，一众反对派在党内场合公开表示强烈不满——他们至少说对了一半。陈委员长坚称此举旨在重塑党对政府和军队的绝对权威，而那群他深恶痛绝的蓝衣社成员的命运，此刻已尽在他的掌控之中。"
 YUN.endgame.060.a: "扫进历史的垃圾堆！"
 YUN.endgame.060.b: "黄埔纽带难以断绝。"
 YUN.endgame.061.t: "巩固未来"
 YUN.endgame.061.d: "在中华民族永不停歇的进步之路上，陈诚委员长正致力于建立三民主义青年团。三青团旨在向新一代青年灌输党的思想，重振垂暮腐朽的国民党，以期开创国民党的新纪元，最终让元老党员将火炬传递给一支更具活力、更加精干的队伍。在击败旭日帝国（这场战争险些毁灭了中华文明）后的胜利游行、庆典活动和锣鼓军号的鼓舞下，三青团展现出了强烈的爱国主义精神。随着众多知识青年自愿加入三青团，全国各地兴建了一系列青年会馆和招待所，以进一步吸纳青年入团。\n\n三青团不仅举办夏令营、运动会和其他文娱活动，还协助组建了战地服务和宣传队伍，为国民党的未来事业储备力量。随着影响力深入教育领域，三青团遂又肩负起政治整合的新使命。通过积极宣扬陈诚驰骋沙场的战功与执政兴国的实绩，三青团的规模现已扩张达到一个新高度。\n\n由于缺乏外部援助，中央改造委员会部分成员提议陈委员长启用中央俱乐部分崩离析后遗留的国内网络，借助陈氏兄弟及其在文官体系中的广泛人脉，推动三青团快速扩张。然而，此举也将势必导致CC系残党染指三青团核心事务。"
 YUN.endgame.061.a: "与中央俱乐部达成协议。"
 YUN.endgame.061.b: "没有这些鼠辈我们照样能成事。"
 YUN.endgame.062.t: "统一战线的余烬"
 YUN.endgame.062.d: "陈诚在党内的真实立场，是众多新右派人士最为好奇的问题。有人暗示，陈诚从未真正断绝与导师邓演达的联系，他其实是临时行动委员会的秘密成员，毕竟他与周至柔是结义兄弟。另一些人则声称，陈诚是蒋介石总司令的正统继承人，大力推行“红色将军”的政策。尽管陈诚身边之人声称他同情社会主义，但陈委员长实际上是彻头彻尾的新右派成员。\n\n与此同时，陈委员长最近设立了干部制度，以强化党组织在党员中的影响力。每位国民党干部都需要接受系统的三民主义思想培训，以及对党的忠诚度和能力的考核，党的工作方向也发生了变化。陈诚希望通过党员和全社会的共同努力，培养民众与国民党的鱼水之情，并开展地方实情调查获取一手数据，以彻底根除非法活动。\n\n此外，陈诚也对入党流程进行了调整，以更好地照顾底层民众，并重点吸纳工农阶层以及知识分子群体。尽管这些新晋党员暂时不会参与教育、宣传、公共服务或其他党内工作，但此举仍被国内临委会残部视为实现农民阶层与普罗大众地位平等的重大突破。\n\n基于陈诚与临委会领袖邓演达的良好关系和彼此赞誉，这个左派组织向“小委员长”伸出了橄榄枝。在近期与周恩来等其他左派人士交换意见后，邓演达提出临委会可以协助开展农民教育运动，以换取政治赦免和继续优先照顾中国底层民众。"
 YUN.endgame.062.a: "这是新右派的时代！"
 YUN.endgame.062.b: "昔日师生再度相聚！"
 YUN.endgame.063.t: "患难见真爱"
 YUN.endgame.063.d: "蒋介石和陈诚的交集虽然短暂，但他仍对陈诚的人生轨迹产生了巨大且持久的影响。蒋介石在北伐期间被哗变士兵（也可能是平民）刺杀后，作为总司令的门生，陈诚的政治生涯尚未展现真正潜力便遭遇重挫。尽管如此，这位“小委员长”的生活中仍然残留着他第二任导师的哲学思想与行事风格的印记——无论是陈诚秉持的黄埔精神，还是他朴素的生活作风。但最鲜明的烙印，当属陈诚与谭延闿之女谭祥的政治联姻。\n\n孙中山先生最初试图撮合宋美龄与谭延闿的婚事，但最终未能如愿，谭延闿表示自己永远忠于原配，即便妻子已经过世多年。最终，谭延闿选择认宋美龄为干女儿，孙中山则亲自安排宋美龄与蒋介石成婚。孙中山逝世后，除宋蔼龄外，其他宋氏家族成员都反对宋美龄与蒋介石的婚事，多亏了谭延闿出面干预，才得以挽救这桩婚事。北伐战争结束后，谭延闿在贵州右派残部中的势力日渐衰落，为了巩固自身地位，他与宋美龄密谋，于1931年促成女儿谭祥与陈诚的政治联姻。\n\n由于陈诚此前曾有过一段婚姻，因而很多人认为这桩婚事纯属政治联姻。然而，无论宋美龄、谭延闿或蒋介石对这桩婚事施加了何种影响，陈诚和谭祥证明了他们是一对恩爱和谐的夫妻。陈诚和谭祥的婚礼在贵州国统区举行，尽管二人此后经历了种种磨难，但他们始终相守不渝。谭祥一直在丈夫身边发挥重要作用，从抗日战争期间尽力救治伤员的医护人员，再到如今的中国第一夫人。谭祥同样是一位热忱的女权主义者，在政治工作中担任过中国护士学会、中国女童子军等多个组织的副主席。"
 YUN.endgame.063.a: "向中国第一家庭致敬！"
 YUN.endgame.063.b: "将这称为真爱？多么蹩脚的笑话！"
 YUN.endgame.064.t: "跨越政党界限"
 YUN.endgame.064.d: "在中国的政治战场上，党国固然是国内唯一占据绝对主导地位的政治力量，这一点毋庸置疑。但所谓的党外人士（即少数敢于坚持独立政治立场的群体）仍在国民党主导的政府框架下坚持参选，并捍卫自己的事业。国民党是如此的强大，以至于在陈诚的领导下，党外人士和其他政党对国家可能施加的任何影响力，都在某种程度上被间接压制了。\n\n陈诚及其派系在全国范围内建立了正式的半宪政体制，并在他们的监督下进一步建立了覆盖政府、军队和社会各个层面的党支部网络，每名党员都必须隶属于特定党支部。在民主集中制政治思想的指导下，党支部网络彻底重塑了国家内部的权力层级和党的权威。\n\n党支部分为城市和乡村两类，城乡党支部都会定期召开会议，进行党员之间的相互批评和自我批评、了解社会民生诉求并收集民众对国民党政策的意见反馈。总而言之，这些努力旨在形成一条拥有最广泛群众基础的政治路线。由于每名党员都被编入党支部且被要求参加会议，因此几乎可以确保所有党员都具有一定的忠诚度、积极性和价值感。\n\n然而，政府内部也有人坚持允许反对派蓬勃发展。在他们看来，若想制定一条最受民众认可的路线，就必须从不偏袒国民党的声音中获取信息。据此，他们已向中央改造委员会提交了一项议案，旨在推行有限多元化，并允许党外人士参加党支部会议。"
 YUN.endgame.064.a: "我们必须确保革命未来！"
 YUN.endgame.064.b: "若无党外同仁，怎能实现正义？"
 YUN.endgame.065.t: "大众的火炬手"
 YUN.endgame.065.d: "“人不能离开土地而生存，人类生活资料之所需，无不取给于土地，故土地者生命之根源也。唯土地面积，自古至今，殊少变动，而人口之繁殖，如听其自然，可能永无极限。古初地旷人稀之世，土地供应无缺，自无问题发生。演变至后世地狭人稠，土地供不应求，因而成为争夺之对象，于是土地问题遂逐渐由是而生。”\n\n陈诚是一位著述丰硕的作家，与其说他是一位将军，倒不如说他更像一位政治家和管理者。陈诚近来笔耕不辍，以科学的准确性接连发布公告，解释其雄心勃勃的土改举措的进程和理由。陈诚指出，经过缓慢且残酷的演变，土地已不再是人民赖以生存的物质基础，而是沦为了个体争斗与国家征伐的掠夺对象。纵观中国历史，土地状况一直在不断恶化，以至于作为农业大国的中国，仍需仰仗天时来获得粮食，最终导致广大乡村饥馑横行、饿殍遍野。\n\n为了解决土地问题，这位“小委员长”与他的左派同僚结盟，寻求的土改路线远比他昔日的新右派对手激进得多。虽然有人批评称，将土地改革与中国农民的关系置于国家存亡的关键位置过于夸张，但陈诚仍将坚定不移践行此道。消灭中国人民遭受的压迫，将他们从饥饿和奴役中解放出来，并赋予他们应得的自由、稳定和幸福生活，这便是陈委员长肩负的使命。"
 YUN.endgame.065.a: "携手同行，中华奋进。"
 YUN.endgame.066.t: "消除千年不公"
 YUN.endgame.066.d: "根据当代对中国过去两千多年历史的研究，治乱循环的模式总是反复出现。虽然这种现象的成因可归咎于特定时期的特殊背景，但其中一个共同点在于，历朝历代都是由于无法长期维持土地与人口之间的平衡而走向衰败。每当经历一段繁华盛世之后，国家的人口和财富无疑会随之剧增。\n\n一旦人地矛盾到达临界点，暴力便会成为民众发泄不满的直接方式，起义与内战仿佛是用来恢复国家平衡的残酷科学工具。战争导致人口锐减后，人地关系重新均衡，下一个社会政治稳定时期随之而来；而人民也将再次陷入永无休止的血腥杀戮循环。\n\n至少，这位“小委员长”在其向民众宣传的著作中是这么认为的。若想矫正一次次次推动整个文明逐渐衰败的体系，这一使命又是何等艰巨。然而，陈诚拥有远超他人的雄心壮志，也更加坚信自己的使命。当陈诚就近期的土地改革和经济集中化努力召开新闻发布会时，这位“小委员长”雄心勃勃地宣称：\n\n“中国实施土地改革后，不仅可以改造我国治乱循环之历史轨辙，抑且可以充分发展工商经济，使国家经济与国民生活，均能臻于现代化，同时亦可借经济民主来保障与发展政治民主。由此又可知，中国实施土地改革，实为一项改造历史且创造历史之工作！”\n\n即便赞扬陈诚及其治国才能的欢呼赞誉不绝于耳，也丝毫未能消解人们对这位雄心勃勃之人可能失败的担忧。陈委员长面前的征途道阻且长，但没有人比他更适合承担这项重任。"
 YUN.endgame.066.a: "“这小委员长，他小在哪里？”"
 YUN.endgame.080.t: "完成革命事业"
 YUN.endgame.080.d: "人民与党之间的确存在着巨大的隔阂。人民愈发憎恨党，憎恨所谓的意志仲裁者、解放者以及引领人民走向光明未来之人。党带来了什么？只有破坏毁灭、斗志消沉、军阀横行与官僚腐败，曾经的国民革命之党如今不过是具行尸走肉。\n\n当前领导层与党员之间的关系，只剩下互相利用和冷眼相待。党内领导无法辨别谁才是真正的忠实党员，党员则纯粹利用领导权威来实现个人目的。哪怕党员做出有损社会利益之事，只要口头迎合领导口号，便被视作“真正同志”。即使在党员内部，彼此间亦毫无同袍友爱可言——所谓革命情谊？它早在1927年便已消亡。\n\n若要终结如今控制党内的官僚和资本家，仅靠开展清洗和人事变动是远远不够的，这样做既不稳定也不切实际。相反，我们必须精心打造一个党中之党。蓝衣社应当占据中央执行委员会三分之二的席位，剩下的席位中应有一半属于海外华侨。进入中执委的蓝衣社成员必须是纯粹的革命者，甘愿为国家与民众牺牲一切。\n\n抵制物质享乐！铲除封建余毒！珍视同志情谊！此乃吾辈使命！然而，党外依然存在问题——军阀。无论这些军阀是否为黄埔出身，他们都已经侵蚀了党员，并导致党内腐败之风不断滋生恶化。刘健群身边的亲信建议“壮士断腕”，而滕杰则主张对国民革命军干部宽大处理，一些激进的声音甚至劝说我们姑息养奸……"
 YUN.endgame.080.a: "党内没有叛徒的容身之地。"
 YUN.endgame.080.b: "黄埔系从轻处理，至于其他人……"
 YUN.endgame.080.c: "不管喜欢与否，他们都是我们的同志！"
 YUN.endgame.081.t: "重新诠释三民主义"
 YUN.endgame.081.d: "“我等确信：吾党之纷乱、无力、腐化，非一人之过，实乃方法不善、制度未周、内容空虚之弊也。为历史因缘与法统所系而不欲轻启纷争计，吾社主张仍存本党旧外壳，而于党内组织献身一般国民之核心团体，灌注本党实质，铸就本党精魂。”\n\n近来，类似的宣称横行于国民党的社论与报刊之上，人们推测都是力行社所撰。他们鼓吹如今只见本党之名称，却不见本党之工作。而那些剩余还没投靠蓝衣社的国民党员，自是频频对此口诛笔伐。不过，既然蓝衣社要夺取政权，这些举措就是不可避免的。\n\n长期以来，蓝衣社都盛赞大众运动中动员一般民众实现目的之能力，尤其是诸如萨文科夫、墨索里尼、科德里亚努与穆斯塔法·凯末尔等人物。然而，他们称所谓抛弃主义、抛弃旧党，并非是对本党而恶意，而是欲以大志向来践行三民主义。刘健群笔耕不辍、争辩不休，坚称每一次成功的革命运动都是在三民主义的指导下完成的。即便他们不把三民主义挂在嘴上，或者口号、目标之类的有些区别，一切行动也是符合先总理之训教的。"
 YUN.endgame.081.a: "新时代，新主义。"
 YUN.endgame.081.b: "这简直是对三民主义的亵渎！"
 YUN.endgame.082.t: "点燃中国青年的火焰"
 YUN.endgame.082.d: "蓝衣社渴望看到中国的国民革命彻底改变腐败的旧国家，使其成为一个现代化的新国家，无一事物能幸免于蓝衣社的审视与改造，即便是青年和未来世代亦然。仅确保这一代人投身蓝衣社革命是远远不够的，新一代也必须接受三民主义的灌输。于是，国民军事教育运动应运而生。\n\n若要改革教育体系，必须首先对其进行军事化改造，以便未来的教师和学生能够接受训练和学习，成为最终冲突中的战士。学校应参照军团编制进行组织，强制教师、教职员工及学校管理人员参加军事训练，迫使其适应军队俭朴、严苛且纪律严明的生活方式。\n\n至于学生群体，思想灌输应从幼儿园阶段启动，孩子们将获得枪支和军舰作为玩具，并在墙面悬挂战争场景图画。青春期时，他们将被编入具有强大军事骨干的童子军团体，并着重开展体能训练和团体竞技项目。最终，这些青少年将开始接受正规军事训练。\n\n就课程本身而言，物理、化学和工程学教学均需转向战时应用领域。毒气制造、爆炸物研发——无任何知识禁区存在。学生必须参加实地占领任务，新中国将把意志薄弱的知识分子和他们对体力劳动的蔑视尽数投入烈火洗礼。在知识分子习气的灰烬之上，每名新社会成员都将成为国家机器中有用的生产力要素。"
 YUN.endgame.082.a: "革命建立在其追随者之上。"
 YUN.endgame.082.b: "让小孩保留童真吧。"
 YUN.endgame.083.t: "蓝衣社密会的黑暗蔓枝"
 YUN.endgame.083.d: "诚然，旧国民党压根没弄懂如何开展群众工作，如何动员群众意志。毕竟党本身都腐朽了，烂到了根子里，人厌狗嫌、毫无建树，只会操着实现总理遗教的陈词滥调虚张声势。叛徒汪精卫中央委员会，深受社会主义流毒之害；流亡在外的胡汉民委员会，也尽是些顽固守旧的榆木疙瘩。\n\n在党的新时代，只有蓝衣社才能肩负起引导国家航向的重任。为实现这一目标，蓝衣社必须组织起来，必须将之贯彻落实。虽然十七人的中央执行委员会仍将继续存在，但还必须有一个凌驾于他们之上的组织。\n\n按照刘健群的设想，一个内部集团——“力行社”即将成立。这一组织将超脱一切条条框框与官僚体制，甚至中央执行委员会本身，围绕唯一的至高领袖滕杰展开活动。\n\n中央执行委员会下辖五人常务委员会，由一名书记长全权领导，即一个书记处，以及四个独立的部门：总务处、宣传处、组织处、特务处。中央执行委员会之下为刘健群的青年同志会，负责招募新成员并渗入平民社会。再下一级便是复兴社，作为组织的群众基础。\n\n自然而然，组建这种秘密结社的行为遭到了严厉批评，甚至一些蓝衣社成员也对此颇为不满。“温和派”呼吁在中央执行委员会与力行社之间实现权力制衡，这一提案收获的支持微乎其微，但也足以让滕杰再三考虑这一安排了，尽管刘健群依旧力主唯有力行社才能引领国家前进。"
 YUN.endgame.083.a: "力行社至高无上！"
 YUN.endgame.083.b: "支持中央执行委员会。"
 YUN.endgame.084.t: "复兴中华文化"
 YUN.endgame.084.d: "中华民族国家在动荡发展的过程中，其民族文化和国民品德也同样经历了劫难、重建和历史的巨变。然而，这最终只给中华民族带来了毁灭、萎靡、腐败和不幸。当代中国的社会图景呈现出两个极端：一方面，中国人的动力并非源于爱国主义或民族主义，而是源于个人主义、家庭纽带和宗族情结；另一方面，则是颓废的乌托邦式世界主义理想。可以说，这两个极端都不利于真正的民族主义发展。\n\n传统宗法体制下，家长族长的专制统治已然固化，本质上服务于维护国家封建统治阶级的利益。而儒家思想中的“大同”理念，更是让那些软弱的中国知识分子沉迷于其中，从而有利于封建统治者。更糟糕的是，中国人将西方舶来的物质主义与个人主义奉为圭臬，几乎完全用个人权利和自由取代了实现自我价值，导致追求物质享乐成为他们首要关注的焦点。\n\n因此，培育新中国文化的重担落在了国民党和蓝衣社的身上。文化控制是社会、政治、教育乃至国家内部一切活动的核心。文化是民族复兴的灵魂。文化具有一种神秘的力量，能使每个人在不知不觉中被它控制，而蓝衣社的使命便是驾驭这股力量。"
 YUN.endgame.084.a: "摧毁西方的颓废思想！"
 YUN.endgame.084.b: "专注于打造一种能够控制大众的文化。"
 YUN.endgame.085.t: "神圣崇高民族之弘愿"
 YUN.endgame.085.d: "诚然，史册上将会记录着：革命成员——那些被炽烈的反帝激情所驱使、恪守总理遗教的苦行者，在新生的中国里“既不富裕，也不挨饿”。诚然，中华民族的最高领袖滕杰，必将带领中国迈入有史以来前所未有的社会形态：一个彻底摆脱了自由主义腐朽污秽和长期分裂中国人民的阶级斗争裂痕的社会。\n\n同志们，无需他觅，且看萨文科夫的伊佐托夫运动和科德里亚努的铁卫团——看看他们为民族复兴所凝聚的力量，看看他们彻底抛弃民主制度、自由主义和社会主义等生活中毫无意义的糟粕。我们必须绝对遵循国家民粹主义的原则，绝对忠于“领袖”，并向往一个真正自由的世界——在那里，男男女女都将通过为民族无条件奉献而获得真正的解放。\n\n前方的革命征途未必坦荡，我们必须连根拔除盘踞的毒根蔓枝，并用那些玷污革命的叛徒之血来反复浇灌革命之树。我们必须构建一种新的文化，一种摆脱西方颓废腐败弊病，又能追溯自身辉煌历史的文化。唯有立足于秩序井然、尊卑有度、虔敬守诚的传统根基，方能铸就更加辉煌的未来图景。\n\n在那一天到来之前，愿最高领袖、革命载体力行社和民族意志的宏图伟业能够不断进步、再创辉煌。"
 YUN.endgame.085.a: "一个民族！一个领袖！至高无上！神圣不可侵犯！"
 YUN.endgame.100.t: "新右派崛起"
 YUN.endgame.100.d: "国民党曾是中国革命的政党。1920年，当广受爱戴的先总理竭力为行将熄灭的革命之火寻求支持时，正是蒋介石、戴季陶、陈果夫、张人杰等党内浙江籍人士，以经营证券交易的方式，奋力筹募经费以延续革命事业。尤其值得铭记的是，国民党被反革命分子和第三国际的社会帝国主义代理人渗透后，是戴季陶及其追随者推动国民党回归其真正的本土根源——一个植根于中国传统道德精神的民族主义政党。\n\n中国因持续多年的内乱、帝国主义的侵略以及抗日战争的摧残而满目疮痍。然而，党内雄心勃勃的所谓“新右派”却决心重塑党的路线，迈向革命性改组。戴季陶及其在所谓“CC系”中的追随者，计划将整个中国社会改造为类似秦朝法家的治理模式。在他们看来，中国若要复兴，则既要拥抱现代化，更要坚守维系千年国运的道德气节。\n\n戴季陶独坐办公室，指间香烟袅袅，抬眼凝视座椅上方悬挂的先总理遗像，恍惚间竟自忖：后人或将视他为当代伊藤博文。然而胸口骤起的刺痛令他不禁沉思——是否该急流勇退，将革命未来托付于陈果夫、陈立夫这般朝气蓬勃的门生？待他迅速吞下又一片止痛药，引退的念头再度浮现：或可暂离纷繁党争，潜心研修佛学与四书五经。但值此神州风云激荡之际，岂不正需一位真正的革命砥柱执掌乾坤？"
 YUN.endgame.100.a: "是时候准备迎接新时代了！"
 YUN.endgame.100.b: "是时候准备选择继任者了……"
 YUN.endgame.101.t: "反对派日益壮大"
 YUN.endgame.101.d: "尽管先总理主张在训政时期推行革命性改革，甚至早在辛亥革命之初，党内政治思潮尚未充斥着悲观情绪之前，戴季陶本人也认为共和精神蕴含于法治之中。随着国民党组织日益壮大，党内腐化分子也逐渐增多，戴季陶依然坚持维护党内名义上的分权制衡——在他看来，为了维持公共秩序，就算牺牲个人自由也在所不惜。\n\n自从新右派掌权以来，党内再度陷入混乱，而前云南国民党内部又缺乏合格人才，导致反动分子混入政府之中。自由派投机客、中国民主同盟的新兴反对派，以及来自旧右派、军阀将领和左派的异见分子，一直在表达对戴主席政权的担忧和反对。\n\n戴季陶向亲信透露，巩固新政权的首要举措便是肃清党内派系之争。戴季陶认为，党内派系斗争如同一棵不断滋生分裂之树，虚弱的国力和腐败的风气则是滋生分裂的养分。在中央委员会的有力支持下，一项行政命令已获通过，强制要求凡辛亥革命后脱离或疏远国民党者，必须重新登记并接受严格的道德审查、政策考核及孙中山理论测试。今后新入党者亦须通过同等审核，在审核期间仅授予预备党员资格。"
 YUN.endgame.101.a: "党内的投机派、土匪和军头将被清除！"
 YUN.endgame.101.b: "党内的社会主义者和煽动分子将被肃清！"
 YUN.endgame.102.t: "军方不满"
 YUN.endgame.102.d: "在国民党右派长期流亡云南期间，党的领导人戴季陶和陈果夫一直在党内军事与文职派系的复杂关系中发挥调解作用。虽然中国革命终究是由军事胜利决定的，但根据孙中山先生的三民主义——随着训政时期的到来，军政阶段应当就此终结。尽管新右派领袖与黄埔系高层长期保持盟友关系，双方如今却因军方问题而关系紧张。\n\n何应钦退出政坛引发了军方人士的不满和愤怒，他们难以接受文官主导军方事务。据传，戴季陶雄心勃勃的改革计划将裁减军费开支，并解散大量部队（特别是雇佣兵），以此为重大经济项目筹措资金。\n\n此外，黄埔系内部也有一些人对何委员长退出政坛感到不安——面对CC系的政治投机行为，他们正日益被边缘化。在权力真空之际，土木系与蓝衣社已趁势接管了军中影响力，这给国民党文官政府发出了警示信号：绝不能忽视国民革命军的利益诉求。"
 YUN.endgame.102.a: "党必须加强对包括军事在内的所有事务的控制。"
 YUN.endgame.102.b: "黄埔系始终捍卫国民党，未来亦会如此。"
 YUN.endgame.102.c: "有时安分守己、避免麻烦才是明智之举。"
 YUN.endgame.103.t: "党国困境"
 YUN.endgame.103.d: "作为国家建设委员会中的CC系核心干将，陈立夫、张道藩和段锡朋一直致力于将大公司和工会纳入国民党的控制。陈立夫曾说过：“我深信完全否定自己传统文化的价值，一味模仿西洋或俄国的作品，未必就能使我们国家强盛！”\n\n陈立夫曾是斯克兰顿的一名采矿工程师，在美国求学期间亲身经历了残酷的剥削现实。在被召回中国之前，他曾加入过约翰·L·刘易斯领导的工会，并参加了罢工活动。与此同时，注重实用性和效率的美式管理制度也给他留下了深刻印象——工作流程的每个环节都经过细致研究，矿工提出的合理化建议会被公司采纳乃至奖励。\n\n然而，中国的情况却大不相同。由于国民党力图巩固国家对经济的控制，导致大量外国投资者和专家撤离主要工厂和基础设施，乃至资本纷纷外逃。供应链在混乱中遭到破坏后，资质不足或别有用心的官员趁机掌权，腐败问题也随之滋生。即使是中国公民也不愿在这种环境下投资，更何况新政府还对投资者施加了严苛要求。\n\n陈立夫曾哀叹，美国各级人员无不践行个人职责，但这种效率在他的祖国仍无法实现。在美国，层级间指挥畅通，人人专注职责环节且注重实效。反观中国，一日可成之事常拖至两三日之久，如同刻意印证一个忙碌之人无法按时完成工作。“这样浪费时间，不重实效，是现时各机关的通病。”陈立夫发誓要改变这种现状。"
 YUN.endgame.103.a: "我们奋进不息，誓让民生福祉惠及全民！"
 YUN.endgame.103.b: "我们需要提高透明度来减少腐败。"
 YUN.endgame.103.c: "最好稍微放松对经济事务的管控。"
 YUN.endgame.104.t: "土地改革提案"
 YUN.endgame.104.d: "作为先总理遗作《建国大纲》的一部分，土地改革至今仍是国民党最具民粹主义色彩的举措之一。正是靠着土地改革纲领，国民党确立了自身作为解放被压迫群众、迈向救亡图存的真正革命政党的国家合法性根基。土改问题依然争议颇多，这已不是什么秘密。对于如何推行土地改革，党内左右两派都因内部意识形态分歧而争执不下。\n\n新右派牢牢掌控党的路线后，国民党现在开始听取两位新右派主要思想家戴季陶和陈立夫关于土地改革的意见。国民政府建设委员会执行委员会已正式设立全国土地改革部，由政界人士张厉生与张道藩牵头主导。土改部向民众郑重承诺：国民党必将完成国家土地改革的艰巨使命。\n\n戴季陶坚信国家前途系于快速工业化之路，认为党应该将重点放在沿海发达地区的工业化投资上，此举也将促进农村经济发展。由于坚持维护省级土地自治，而非采取政府干预手段，戴季陶的政策得到了士绅地主阶级的赞扬。\n\n身为建设委员会执行委员会秘书长，陈立夫一直主张在政府的严格监督下进行广泛土地改革。与戴季陶的自由放任政策不同，陈立夫认为政府应该主动承担艰巨的土改任务，并通过政府官僚体系的严谨视角来最大限度地减少腐败，并提高政府在国内事务中的效率。"
 YUN.endgame.104.a: "戴季陶言之有理，我们必须先集中精力实现国家工业化。"
 YUN.endgame.104.b: "陈立夫提出的扩大土改建议才是正确之策。"
 YUN.endgame.105.t: "新文化"
 YUN.endgame.105.d: "辛亥革命成功后数年中，一股充满活力的新思想、新哲学浪潮自西方传入中国。诸如陈独秀、胡适等哲学家和知识分子将新文化运动视为摆脱残酷军阀混战的良方。而西方文化则被他们誉为纠正如今中国文化中不主动、不理性源泉的良药。梁漱溟等保守思想家则对此不大认同，认为西方哲学与中国文化格格不入，张君劢也支持这一观点。\n\n虽然孙中山先生最初同意民族文化的革命化尝试，但他旋即发现这场运动导向了不爱国的思想。先总理称国民党是中国道德与文化的卫士，戴季陶等追随者也纷纷效仿之。这也成为了理学思想反击新文化运动的基石。新生活运动中的思想家们借用儒家民胞物与之“共生”、协和万邦之“大同”的愿景，声称将迎来一个崭新的世界——以复兴的道德共同体与人类的操演活动，创造未来的人类文明。\n\n陈立夫加入这场大讨论的时间较晚，不过此时他已是灵活的本党宣传家了。他在中央政治学校中的演讲中，将一切不符合儒家礼教的观点贬斥为工团主义，而又将西方的唯生论哲学、传统文化中《易经》、《大学》与《中庸》的观点，加之孙中山、戴季陶两先生的理论相结合。虽然党内不乏认为新文化运动是国民革命重要部分的人士，但也有不少人拥护戴季陶等，认为应当回归儒家道路。党内有越来越多的新锐知识分子都提出要融合西方的唯生论与传统的儒学，创造出兼而有之的革命文化。"
 YUN.endgame.105.a: "革命后浪推前浪！"
 YUN.endgame.105.b: "我国需要新生活运动，而非新文化运动。"
 YUN.endgame.105.c: "兼有的革命文化才能救亡图存。"
 YUN.endgame.106.t: "白日黑心"
 YUN.endgame.106.d: "1911年，晚清思想家李宗吾提出了所谓的“厚黑学”理论。在李宗吾的文章中，他以现代视角阐释了中国传统哲学中关于色彩的论述——黑色象征着冷酷无情的隐秘力量，隐喻那些在暗处统治且拥有绝对权威的邪恶势力。黑色总会让人们将其与难以察觉的地下势力联系在一起，更会让人们联想到黑帮等有组织犯罪团伙。\n\n在过去的革命年代，帮派分子与革命者之间的界限极其微妙——二者都立足于兄弟情谊，也都是逃避当局追捕、贩卖武器、人口和情报的“有组织罪犯”。更复杂的是，许多臭名昭著的帮派头目也是真正的共和派民族主义者，无孔不入的黑暗势力与英勇奋斗的革命烈士之间的界限似乎正变得愈发模糊。\n\n昔日的革命同志会浙江社曾与上海的青帮等黑社会团体密切合作，但这些如今已成为党员和政治人物的浙江人士却坚称自己从未正式加入过任何帮会。在二次革命失败的惨痛创伤中，戴季陶、陈其美和蒋介石为了延续革命事业都曾做出过身不由己的行为。考虑到中国政治文化历来重视个人信任和人脉关系，因此许多声名狼藉之人混入CC系主导的政府也就不足为奇了。\n\n根除腐败绝非易事，政府内部存在诸多声音——既有活跃于立法院议事厅的公开主张，也有藏匿于社会阴暗角落的隐士潜流。戴季陶主席虽已明确表态要彻底肃清政府腐败，但以陈立夫为代表的党内少壮派则主张保持克制圆滑，以免卷入涉及贪婪腐败和裙带关系的政治丑闻。此外，陈立夫等人还指出，政府实际上可以利用这些黑暗势力来打压遏制异见分子和不守规矩的声音。"
 YUN.endgame.106.a: "有必要对党内的犯罪分子开展调查。"
 YUN.endgame.106.b: "为维持国家稳定，与黑暗势力的联系必不可少。"
 YUN.endgame.107.t: "中国好莱坞"
 YUN.endgame.107.d: "巴黎举行了纪念社会主义革命事业的盛大电影节，俄罗斯则通过其蓬勃发展的电影业表现保卫联盟的壮观场景。在这些的启发下，CC系的霸主陈立夫陈果夫兄弟表明国民党也有必要通过现代媒体来接触群众。陈果夫认为，文化和艺术应用于展示中华文明的美丽和辉煌，同时承担党教育和引导群众接受三民主义的责任。\n\n虽然传统上电影和艺术的政治倾向决定了其将由左派主导，但随着新右派占据了主导地位，几乎每一位左派电影制片人和男女演员都将受到党内的又一轮严格审查。在著名剧作家、中国美术会理事长张道藩的指导下，国立戏剧学校在南京新近成立了，该校旨在推广中国戏曲和古典音乐，以对抗使馆城市中盛行的堕落的西方音乐。随着左翼艺术家遭到了大规模贬斥，朱石麟等新一批电影人开始引领中国电影的重生，陈氏兄弟也组织了中国教育电影协会，该协会每年会向三部最具教育意义和爱国主义精神的优秀电影颁发奖项。"
 YUN.endgame.107.a: "一起去看电影吧！"
 YUN.endgame.108.t: "法学及人文学科裁撤法令"
 YUN.endgame.108.d: "振兴中国教育是《建国大纲》的一部分，也是国民革命的根本目标之一，既要让教育工作不再局限于单纯的西方现代性研究，还要培养新一代的革命青年。早在国民党执政之前，教育现代化精神就已成为改革的首要举措，像蔡元培这样的教育家一直致力于培养具有革命精神、致力于振兴中华的新一代知识分子。\n\n然而，行政院长陈果夫日前提出了一项备受争议的法案，拟在未来十年内削减中国高校的教育经费，并裁撤法律和人文学科。在此期间，政府将设定农业、工程和医学领域毕业生的配额，最终让技术领域的学生人数远高于法律领域。\n\n此举在中国学术界乃至CC系内部都引发了不小的争议，许多CC系成员，例如朱光潜，都拥有知识分子和教育背景。中华民国学生联合会首任会长、中山大学历史系主任段锡朋，历史学家罗家伦，中国美术会理事长张道藩等人均参与联署抗议，朱光潜更是直言不讳地指出党不应干预公民教育事业。\n\n讽刺的是，CC系成员自身同样奉行理想主义的中国传统史观以及秦朝的法家治国理念。当然，这也带来了一个问题：如果没有律师来维护法律，并为公民解释法律；如果没有历史学家来保护历史，并向民众传授历史——那么在这个国家，谁能真正了解事实真相呢？"
 YUN.endgame.108.a: "在陈果夫的坚持下，法令获得通过。"
 YUN.endgame.108.b: "我们还是暂时把这件事放在一边。"
 YUN.endgame.108.c: "他们说的对，党不应干预公民教育事业。"
 YUN.endgame.120.t: "《革命的知识与革命的工作》"
 YUN.endgame.120.d: "多年来，许多人曾标榜自己理解了先总理精深的辩证思想，但他们中却无人能比得上戴季陶对三民主义的天才理解。党的意识形态的确曾遭军阀军官与马克思主义倾向的反革命分子玷污，然而，如今我们终于洞彻了国民革命的真谛——唯有在戴主席的领导下，方有资格勉强自诩为这场文化革命的使徒。\n\n戴季陶主席最近完成了他的巨作《革命的知识与革命的工作》，这部作品旨在作为党的理论和回忆录出版。教育部表示，这部作品将成为培育新一代革命青年理解新中国纲领的指定读物。\n\n戴季陶在书中呼吁读者审视历代革命者的成败得失。他写道：“我们要以主义做标的去求进步，求解决问题。但不要，千万不要忘记由古至今，由中及外的历史的和世界的任务！”事实上，戴季陶在本书开篇和结尾都宣称，三民主义是革命的巅峰结晶，它摒弃了马克思主义和自由主义，宣扬了一种全新的、独特的、致力于护佑中华民族的意识形态。\n\n诚然，唯有戴季陶才堪称先总理遗教的真正践行者。"
 YUN.endgame.120.a: "辉煌新时代的不朽箴言。"
 YUN.endgame.121.t: "各大宗教与救国任务"
 YUN.endgame.121.d: "中国乃多元信仰的大国，不仅存有本土民间宗教，更有着伊斯兰教、基督教与佛教等——这些宗教都起源于国外，但广为国内各信仰所吸纳。在新右派的统治下，宗教问题也摆上了台面。像是孙中山、蒋介石等人等表明过自己是基督徒，不过为国民团结计，这些事实常常被避而不谈。\n\n国府主席戴季陶早年就有着虔诚的佛教信仰，这也改变了他的一生，让他支持创造一个基于德与义的世界。他认为，不可囫囵吞枣地接受宗教，亦不可不由分说地抗拒宗教，如此，剩下的路便是去改良宗教，使其发挥团结中国民众的效用。从早年皈依三宝到如今大权在握，他将个人的信仰与价值同国家结合在一起，激发了新一波道德领袖的热潮。\n\n为体现对此事重视，本党正式将佛教节日视同双十节（武昌起义纪念日）、先总理诞辰、忌日及三二九青年节（黄花岗七十二烈士纪念日）一般重要。佛学讲师与僧众常常聚集于学校、公共场所，目的是促进中国青年未来的道德教育。\n\n此外，蒙藏委员会开始鼓励西藏、蒙古与不丹所信仰的藏传大乘佛教。虽然中文是官方语言与文字，但委员会表示，允许在宗教活动中使用藏语，同时也由国民政府法律保护和推广金刚乘经文。"
 YUN.endgame.121.a: "红花白藕青荷叶，三教原来是一家。"
 YUN.endgame.122.t: "佛教与国民革命"
 YUN.endgame.122.d: "自唐代融入民间宗教以来，尊佛礼佛的思潮在中国起起落落。自太平天国反清起义来，佛教便不断衰落——许多汉民族主义者都认为佛教是外来而并非中国的。然而，佛学在中国的知识界仍然很受欢迎，一些人认为，佛教在中国的文坛而非政坛上仍然是占有重要地位的。\n\n但对于曾经自杀未遂，得到佛陀救度的戴季陶主席来说，佛学可以成为对应的民族主义救国形式的关键。他声称自己投河之时，被一道神圣的佛光唤起，最终才得了一位渔夫的搭救。这样非凡的遭遇让他将上天的佛祖与中国芸芸众生的民族主义情结连接在一起，弥合了佛性与人性之间的沟壑。同时他也受日本对佛教改良的启发，从一种大众的宗教变为了在封建的日本灌输牺牲精神的信仰。戴季陶认为，佛学中的戒律、善业、头陀行等概念正是扭转中国数十年来趋于堕落的道德所必需的。\n\n戴季陶反对传统的民间信仰，像是拜祖先、拜各地神灵等都被他称作迷信。他认为，佛教可以强化人的意志力，激发其牺牲一切的品格。只有改良佛教，将其作为国家精神上的剑与盾，中国民众才能像古代的菩萨一样，为国家的荣誉和神圣做出牺牲：男男女女誓要做当代的观音与文殊。"
 YUN.endgame.122.a: "梵行趋涅槃。"
 YUN.endgame.140.t: "光明前途"
 YUN.endgame.140.d: "陈立夫自就任国府主席以来，常于办公室里运筹帷幄，经年累月地擘画未来宏图。陈氏兄弟及其导师为之奋斗的革命伟业，至此终臻圆满之境。\n\n当思索中国的未来时，陈立夫在日记中挥毫写下坚定信念：新中国将造就前无古人的旷世伟业。这个新国家既肩负着守护全体公民的职责，又拥有构建真正现代化道德社会的技艺。通过融合东方道德精粹与西方技术方法，我们确实有可能规划并促进中华民族与中国文明的复兴。\n\n当陈立夫写下最后思绪时，他的嘴角泛起了笑意——新中国将如他笔下所描绘的那样，迎来无比光明的前途。这个国家将以道德共同体的形式，构建起省省相承、县县相系、村村相联的治理体系。人民将共同承担服务国家与照料家庭的义务，并在仁爱与宽容的慰藉下团结在一起——所有道德上的弊病和恶习都将被摒弃，取而代之的是无数个新的、正直的、不断演进的个体，他们将成为革命自觉的模范人物。全体国民将携手奋斗，不仅是为了延续国民革命伟业，更是为了建立一个拥有共同价值观和目标的世界……"
 YUN.endgame.140.a: "愿白日光芒不息。"
 YUN.endgame.141.t: "光荣退休"
 YUN.endgame.141.d: "[ROOT.Capital.GetCapitalVictoryPointName]已经流传了几个月戴季陶退休的传闻，据说中央执行委员会在几周前就收到了戴主席的辞呈，这一消息终于在今日得到了证实。\n\n随着中执委进行闭门会议，关于继承人的猜想众说纷纭。猜测最多的是陈立夫、陈布雷，还有一些人在私下议论军方人选的可能性。但最后，戴季陶的继承人已经清晰明了——他年轻而热情的门徒陈立夫将继任为国府主席。陈立夫比戴季陶年轻将近十岁，却有着与蒋介石、胡汉民、孙科等人共事的丰富经历。戴季陶的选择也表明他愿意将政权交给下一代人，也就是活跃于北伐而非辛亥革命的那一代。这一选择也落实了文官政府，彻底终结了国民党右派长期以来军人主导的状况。\n\n为支持弟弟候选，陈果夫已经辞去了行政院长一职，以免落任人唯亲之口实。而与戴季陶关系紧密的知识分子陈布雷（与陈氏兄弟并非亲属）则预计将执掌行政院，成为主席的得力助手。陈立夫得势意味着将一改孙中山时代以来本党的强人政治，迈向更为集体领导的时代。不过，要是低估了这个年轻人许多自己的想法，也是不明智的。\n\n在庆祝戴季陶、陈果夫两人退任的盛大典礼上，戴季陶还打趣说自己可不会早早离开。事实上，虽然戴季陶已经把中心放在了进行宗教研究、担任中山大学教职之上，但他和陈果夫仍将保留中执委的委员身份。"
 YUN.endgame.141.a: "陈氏兄弟万岁，万岁，万万岁！"
 YUN.endgame.141.b: "戴主席，我们会想您的！"
 YUN.endgame.142.t: "人类进化的首要任务"
 YUN.endgame.142.d: "陈立夫撰写哲学理论时，创造了自己独特的学识思想，即“唯生论”。为介绍这一复杂的辩证关系，陈立夫首先介绍了如下概念：人类的目标便是主宰宇宙与自然——而自然界一切事物都将落入精神与物质的自然秩序中。\n\n陈立夫不接受亨利·柏格森关于“选择对于进化至关重要”的说法，认为人类无法把握自由——过度的自由会加剧社会冲突，而人类应当关注的是效率。唯生论正是过度消费、行事散漫的良药。这一理论来自于陈立夫对传统中医药和西方哲学的研究，即认为“生元”构成了一切物质。这些生元便是宇宙中最微小、最基本的物质，但也构成了世间的一切物质。陈立夫凭借这个科学理论，以类似杜里舒的生命力论调重新定义了原子与物质的关系。因此，而由人组成的政党，自然也带着生命力——而加强党员内的生命力，就对于提高人的自然效率必不可少。\n\n基于这种主义，他甚至进一步阐明，若人对社会全无贡献，则不死何俟？这样的人活着也全然是对资源的浪费。而那些有价值的人，即携带强烈生元的人，才是人类最终达成进化的自然先驱。"
 YUN.endgame.142.a: "这便是我们人类的使命吗？"
 YUN.endgame.143.t: "振兴中医"
 YUN.endgame.143.d: "中医是一种源于中国传统医学的替代医疗体系，其诊疗实践养生疗法、儒家哲学、饮食调理、身体锻炼、针灸技术及多种学术流派。这些整体疗法被中国人沿用至今，其中关于东方疗法的最早文献可追溯至公元前14-11世纪的商朝。\n\n传统中医排斥注射、手术和西药等西医诊疗手段，其理论体系建立在经络、“气”的运行以及探索神性、宇宙与人类体验的关联之上。随着西医知识在中国的传播，部分思想开明的改革者主张大力发展西医研究，认为中医不过是古代的过时产物。\n\n然而，陈立夫长期以来一直是传统中医的支持者，也是国医馆的创始人之一，这很大程度上源自于他对元气理论的发展。国医馆旨在结合东西方医学精华，深刻体现了陈立夫力求贯通东西的兼收并蓄思想。国医馆汇聚了一批西方医生和受过传统中医培训的医生，并通过阶梯式诊疗方案同时提供替代疗法与现代医疗手段。虽然一些国内顶尖医生对此表示质疑，但考虑到国医馆成立时间不长，我们很难确定陈立夫的计划是否真的能创造出一种新的、独特的中医正统观念。"
 YUN.endgame.143.a: "多么有趣的概念！"
 YUN.endgame.200.t: "中国热月"
 YUN.endgame.200.d: "胜利的号角吹响，白日高悬于大地之上，人们本以为云南国民党应该为此欣喜若狂。因为他们为之奉献终身的理想终于开花结果了。国父曾在腐朽堕落的君主专制面前坚持奋斗以建立崭新而革命的国家秩序，如今这条漫漫长路看似终于抵达了终点。可是，眼下绝非什么最终的胜利。\n\n在党和干部周围，国家所经历的浩劫触目惊心。当初蔡锷将军在护国战争中再造共和，但国家却依然风雨飘摇，如今那样的命运却可能再度上演。此时此刻，吾党必须毫不动摇！中国人民期待着我们交出答卷，而我们也是时候提笔作答了。"
 YUN.endgame.200.a: "人民呼唤着小委员长！"
 YUN.endgame.200.b: "我们走到了聚光灯下……"
 YUN.endgame.201.t: "新时代，新政党"
 YUN.endgame.201.d: "临时行动委员会最初由谭平山和章伯钧在上海创立，起初创立临委会的目标是抗衡国民党。因为随着北伐的失败，很显然孙中山先生创立的革命党已经既无法拯救人民，也无法在中国实现社会主义了。对于谭平山和章伯钧而言，临时行动委员会意味着一场摆脱了蒋介石等人的阴谋诡计的崭新的革命运动。\n\n但随着邓演达和宋庆龄逃离了来势汹汹的军阀流亡上海，这对充满活力的搭档收编了临委会运动。临时行动委员会改变了方针，从对国民党进行外部改造变为对其进行内部改革。\n\n如今，章伯钧主席成为了国家元首，那位红色拿破仑再也不能对他进行掣肘，现在要由他和朱德老总来决定他们政权的性质了。眼下主席和行政院长面临两个选择。要么继续履行我们对青天白日满地红所立下的誓言，继续留在国民党运动内，并采用中国国民党革命委员会之名。\n\n要么也可以走自己的路，成立一个为中国的农工大众服务的新党，一个注定要建立革命社会主义的民主、摆脱国民党固有的独裁闹剧的政党，其名为“中国农工民主党”。"
 YUN.endgame.201.a: "毋忘革命之根！"
 YUN.endgame.201.b: "农工人民之党！"
 YUN.endgame.202.t: "国民党边缘派系进入中央"
 YUN.endgame.202.d: "尽管我们高歌猛进，尽管我们誓言铮铮，尽管我们信念如磐，但举国上下与全党内外仍对我们的誓言心存疑虑，在他们看来，我们不过是走好运的外来新贵罢了。[ROOT.GetRulingParty]成功击败了中央委员会，将国家从革命暴政统治的毁灭中拯救出来，但我们也坠入了政治黑洞，成为了漩涡中心。\n\n由于与旧政治建制派关系疏远且缺乏与当下地位相称的全国声望，国民党边缘派系正面临有史以来最为严峻的考验。军事行动只是这场斗争的一半，构建政治阵线并满足党和民众的必要诉求无疑仍将是一场艰苦的战斗。但我们若想生存下去，就必须迎难而上。"
 YUN.endgame.202.a: "“啊，那事情就复杂了。”"
 YUN.endgame.203.t: "互不相让的经济需求"
 YUN.endgame.203.d: "从昆明起家的国民党省级政府，直到现在才完全适应了国内多元化的意识形态。云南或许只是个缩影，至少相对而言比较容易管理，但如今全国上下都已陷入愤怒和骚动之中。且不论政治层面，新国民政府面临的经济需求更是五花八门、影响深远。\n\n[ROOT.GetLeader]和政府的期望有所出入，农民要求立即开展土地改革，工人上书请愿增加权利和保护，商人士绅则为维护自身利益及中国市场稳定而群起力争。\n\n雪上加霜的是，党内对经济政策的看法也存在分歧。正统派主张严格遵循孙中山先生提出的国家资本主义政策，党内其他自由派则坚持采取更加西式的经济模式，将经济增长放在首位。无论如何，我们必须尽快找到解决国家经济困境的良方……"
 YUN.endgame.203.a: "“你难道看不出我们在处理什么吗？”"
 YUN.endgame.204.t: "诸省权力真空"
 YUN.endgame.204.d: "迫于国民党内战期间的形势，各省都处于[ROOT.GetLeader]的直接控制之下，这导致省级党组织除了有限的临时行政机构外，无法建立起更加强效的管理体系。由于这种差异，在内战爆发前我们直接管辖的地区，例如滇黔两省，仍享有一定程度的相对稳定与和平，然而在湖北、江苏、广东和北京等千里之外的省份或中央委员会的地盘，目前仍有部分地区处于无政府状态。\n\n内战实际上摧毁了所有地方行政体系，虽然许多部队假托保境之名缴械归顺，但他们要么心怀抗拒、要么疑虑重重，要么敌视党内边缘派系的权威。在许多人看来，这些边缘派系不过是又一个崛起的新贵罢了。雪上加霜的是，不少人甚至将当局视为试图攫取全国统治权的云南地方势力与边缘派系的结合。"
 YUN.endgame.204.a: "“想不到我们居然让军阀割据再度死灰复燃。”"
 YUN.endgame.205.t: "新国民党的土地改革"
 YUN.endgame.205.d: "土地改革是当代中国最为紧迫、最具争议的话题之一，具有深远的社会、经济和政治影响。国民党的农村议程以孙中山的“耕者有其田”主张为基础，该主张已成为国民党国家建设纲领的重要组成部分。\n\n根据这种更为正统的土改思路，国民党理论家大多主张限制地租，以消除地主索取的盘剥性地租——这类地契往往没有正式书面文件，而是由士绅雇佣的团练强制执行，即便歉收年份佃农仍需全额缴付地租，致使众多农民深陷债务泥潭。据此，国民党主张政府对农村地契实施最严格的监管与规约。除此之外，国民党的土改方案还有两大主要支柱。\n\n首要举措便是整肃政府税制。由于战时需求激增、管辖权重叠以及贪腐肆虐，政府税赋体系已变得盘根错节、积弊丛生。保守派认为土地再分配毫无意义，转而倾向于聚焦经济发展以推动工业化进程，并建议我们与工商界及士绅阶层合作，鼓励基础设施建设，例如兴建公共粮仓和水利基础设施，再辅以强化乡村军事管制、资助土地银行等措施，这些举措将增进广大农村地区的民生福祉。\n\n第二项举措则是强制购买大片田产，尤其是针对在外地主。然后，政府应将购得田产出售给耕种土地的佃农，并推动合作社的发展。党内左派人士建议我们更进一步，实施土地无偿国有化，并强制农民参与公社。\n\n作为国家的统一者，我们如今已拥有足够权力启动这项将永远重塑中国社会的大规模国家工程。"
 YUN.endgame.205.a: "正统路线才是解决土地问题的最佳之策。"
 YUN.endgame.205.b: "我们应当采取保守的改革态度。"
 YUN.endgame.205.c: "唯有推行全面土改，我们的革命才能大功告成！"
 YUN.endgame.220.t: "统一战线工作部"
 YUN.endgame.220.d: "至少在主流党派看来，[ROOT.GetRulingParty]的竞选纲领中最具争议的举措之一，就是与中国无数党外人士间的合作和联系，而这些党外人士都松散地联合在新成立的中国民主同盟周边。作为梁启超为国家留下的长期遗产之一，民盟培养了许多中国最伟大的民主思想家，如黄炎培、张君劢、周世钊、沈钧儒、罗隆基、李璜、徐勤、刘崇佑等。该党团结了中国青年党、中国宪政党、中华职业教育社、中国民主建国会和许多其他小党派，他们正式组成了一个志同道合的改革派集团，愿意与政府进行真诚合作。\n\n章主席大胆地寻求建立广泛的统一战线，以图为中华民族创造更光明的未来，他与许多民盟领导人都建立了友谊，因此他计划建立一个与国民党和工团党过去统一战线类似的统一战线。但此举在[ROOT.GetRulingParty]内部引发了越来越多的不满，因为他们唯一能选择的兄弟党的只有工团党或民盟。\n\n而选择两者自然都有其缺点：民盟不受章主席所在党内强硬派的信任，同时民盟对眼下正在实践中的社会主义也心存疑虑；而另一方面，在章主席反对中央委员会之后，工团党与章主席的关系也变得相当疏远。同时主席阵营中的一些人也开始反对采取此类措施，在他们看来，[ROOT.GetRulingParty]完全有能力靠自己建设一个属于民主社会主义的未来。"
 YUN.endgame.220.a: "与中国民主同盟共建民主！"
 YUN.endgame.220.b: "维持党国的主导刻不容缓！"
 YUN.endgame.220.c: "携手组建第二次统一战线！"
 YUN.endgame.221.t: "弥合临委会裂痕"
 YUN.endgame.221.d: "临时行动委员会现在不过是国民党中的一个派系，但其起初并非如此。起初的临委会原本会成为一个新的开始，一个摆脱了统一国家失败的党国束缚的新党。这一计划最初是在北伐失败后不久，由章伯钧和谭平山提出的，但随着其创始人邀请宋庆龄和邓演达参加第三党成立大会，临委会的命运也随之改变。宋庆龄和邓演达最终取代了章伯钧和谭平山成为第三党运动的中心，第三党也演变为了国民党内的临时行动委员会，试图对国民党进行内部改造。\n\n谭平山很快对宋庆龄和邓演达的领导感到失望，对第三国际也产生了怀疑，他随即离开了临委会本流，打算建立一个由自己领导的地方支流。而章伯钧仍继续跟随着邓演达路线与临委会，直到他被派往云南省。\n\n国民革命军第十师及其领导人陈铭枢也遵循着类似的思路，成为了另一个在汪精卫中央委员会领导下崛起的国民党党内反对派。陈铭枢为人和蔼可亲，与章主席关系密切。而在中国的政治新秩序下，陈铭枢一直游移不定，他大体上反对阶级斗争，对中国社会主义的立场更倾向改良。此外，在汪精卫阵营内部和周边也存在着异见人士，例如顾孟余及其改组同志协会温和派，或是孙科及其再造派。\n\n为了弥合政治分歧以加强国家，章主席一直在与这些团体沟通，以确定他们是否愿意合作。作为第三党的一员，章主席和谭平山、邓演达和宋庆龄相比要更倾向民主主义。同时他又维持着临委会的马克思主义传统，至少与顾孟余、陈铭枢或孙科等人比起来是如此。因此，最终无论主席最后选择去拉拢谁，都能为党和政府提供独特的视角。"
 YUN.endgame.221.a: "以革命团结之名，拉拢谭平山的委员会。"
 YUN.endgame.221.b: "顾孟余的改组会能为中国人民提供必需的良药。"
 YUN.endgame.221.c: "绝不可忘记民主本质，我们正需要陈铭枢。"
 YUN.endgame.222.t: "章家图书馆"
 YUN.endgame.222.d: "章伯钧主席自幼便是一位多产的作家，之后也一直沉浸在文学和写作的世界中。章主席年轻时勤奋好学，1916年，年仅20岁的他尽管家境贫寒，却考入了武昌高等师范学校英文部。在校期间，章主席与恽代英等人结为好友，并加入了恽代英创办的“利群书社”。通过恽代英，章主席结识了著名的萧楚女，并在他们的指导下创办了自己的读书会和学生联合会。\n\n无论身在何处、身居何职，章主席都未曾放弃对文学的热爱。他曾短暂担任过安徽省立第四师范学校的校长，之后又于1922年前往德国柏林大学学习并获得哲学学位，在柏林，章主席与朱德成为了室友，还曾考虑是否要加入中国工团党。\n\n回国后，章主席开始收集各行各业的各种书籍。其收藏包括明代古本277部、2239卷，清代古本53部、323卷，以及其他类型文献不计其数。章主席是一位多产的读者和作家，据报道，在政府办公之余的闲暇时间，他最喜欢的就是在自己新建成的家庭图书馆中休息，被自己收藏的无数鸿篇巨著包围。章家图书馆中有近10000卷藏书，其藏书量之巨大，充分显示出他对书籍的热爱。\n\n治学认真、理想主义、心怀敬畏，这座图书馆成为了章主席献身自己爱好的独特注脚，也是成为他带入政坛的一股强大能量。至于这些理念能否被章主席的子女们继承，就只有时间才能证明了。"
 YUN.endgame.222.a: "“要做一个真正的人，最起码的条件和最终的要求就是表里如一，始终如一。”"
 YUN.endgame.223.t: "工农民主"
 YUN.endgame.223.d: "章主席和朱院长毕生致力于自己的使命：一刻不停、雄心勃勃，朝着进步和乌托邦大步前进。章主席忠于事业而理想主义，因此不得不忍受来自政坛各股势力的持续攻击。尽管他为社会主义和民主而操碎了心，但左派同志却指责他是来自右派的潜伏者，右派同志则妄称他为来自左派的毁谤者。而章主席内心深处完全无法指责他们的观点。忠于事业的章主席于是发表了一篇演讲来回应这些指控。\n\n“思想与政见是人人不必尽同的，亦事实上所不能尽同的。如强人以相同，或胁之以相同，只是徒劳而已。不同之中，何以相安？何以共处？则唯有遵守民主精神，确立民主的作风，尊重异己，接受批评，取人之长，补己之短。”\n\n既然主席愿做国家忠仆，为个人理想而奋斗终身，其道势必不孤。依靠军队及其主帅，还有章主席的众多朋友或盟友的大力支持，章主席成功让国家得到急需的稳定，从而建立了新中华民国的基石。章主席时刻不忘反躬自省，只愿以自己的努力为中国的农民和工人带来他们迫切需要的社会主义民主。"
 YUN.endgame.223.a: "“自由……得之愈艰，食之愈甘，爱之愈切。”"
 YUN.endgame.240.t: "[GetYear]年国民党选举"
 YUN.endgame.240.d: "传奇人物李根源与坚定的朱培德这对先锋二人组再次以师生身份团结一致，成功抵御了所有袭来的风暴。面对左右两派激进分子的阻挠反对，国民党当局仍助力国民革命事业不断向前迈进。在党的至暗时刻，李根源和朱培德将如同他们敬爱的蔡锷将军数十年前所做的那样，毅然挺身前行。\n\n尽管李根源-朱培德联盟取得了胜利，但二人的同盟关系却迅速显露瓦解之势。凭借资金雄厚的政学系旧部支持重返权利核心后，李根源的野心已经难以抑制，他正充分利用政学系的政治机器，力图夺得国民党党魁的头衔。\n\n据传，朱培德正在与党内一些根基较为深厚的派系谈判，并以行政院长职位为诱饵，吸引他们加入己方阵营。显然，朱培德的目标是将李根源赶下台，并扶植一位更受人尊敬的候选人。朱培德的谈判对象包括旧右派的三大巨头：孙科及其再造派，邹鲁及其西山派，甚至还有胡汉民及其元老派。在重掌权柄的诱惑下，他们也对李根源及其政学系背离党的正统立场深怀警惕。\n\n面对巨大压力，朱培德被迫呼吁举行党主席和国府主席选举。在失去主要支柱后，朱培德不得不四处奔走结盟，若能与旧右派达成重大协议，他将获得足够票数以巩固权力。另一方面，李根源已开始与北方故友——北洋系国民党人谷钟秀进行谈判。然而，张群却策动政学系少壮派，力推杨永泰出任行政院长一职。"
 YUN.endgame.240.a: "朱培德选择与再造派共度难关！"
 YUN.endgame.240.b: "朱培德与西山派携手取得胜利！"
 YUN.endgame.240.c: "朱培德与胡汉民意外取胜！"
 YUN.endgame.240.e: "李根源夺得主席之位并任命谷钟秀！"
 YUN.endgame.240.f: "李根源与年轻的杨永泰赢得胜利！"
 YUN.endgame.241.t: "国防线计划"
 YUN.endgame.241.d: "自古以来，中华民族饱受外敌入侵之苦，战争周而复始，朝代迭起兴衰。近年来，第二次中日战争给中华民族带来了深重的灾难，百姓生灵涂炭，山河满目疮痍。这般深重劫难，最为了解的莫过于浴血奋战的将士们。\n\n为了不惜一切代价抵御未来可能遭受的入侵，朱培德委员长与第三军最杰出的战略家同僚共同起草了一项计划。根据该计划，政府将斥资实施全面要塞化工程，扩建边境堡垒与运输专线，既为抗击入侵构筑屏障，亦为前线军需输送提供战略通道。全国划分为三道国防线——首道防线从济南延伸至保定；第二道防线从兖州延伸至安阳；东南地区还将建设锡澄线。此外，南京、武汉、徐州、开封、杭州、吴淞等重要城市也将增设防御工事。\n\n朱培德秘密从各地军政部门和军事院校选拔人员，并聘请外国专家指导，开始勘察地形，制定京沪杭地区防御阵地的进一步规划。他把京沪地区划分为三个防御区，根据不同地形制定防御体系，分别是宁沪地区、沪杭地区和南京地区。\n\n朱培德在国民革命军和政府中的盟友将此举誉为对国家未来安全和国防的一项重大投资，但政学系对此表示担忧。尽管政学系在统一前曾支持优先发展重工业，但李根源及其技术官僚盟友却力主将重点放在雄心勃勃的经济现代化计划上，而非军事化。政学系支持对交通运输（特别是铁路）的投资，却坚决拒绝进一步投资修建防御工事。"
 YUN.endgame.241.a: "永绝帝国主义入侵之患！"
 YUN.endgame.241.b: "应该把重心放在经济计划，而非军事化上。"
 YUN.endgame.242.t: "第三军左派的命运"
 YUN.endgame.242.d: "国民革命军第三军左派的显著特征，便是其在于广泛的非正式党内分裂中表现出的两面性。出于在云南陆军讲武学校培养的情谊，各路左派人士在大名鼎鼎的朱德的号召下站稳了脚跟。朱德靠着与金汉鼎、朱培德的友谊，成功将第三军变成了国民革命军内部的温和派。\n\n然而，随着国家统一，第三军声名鹊起，其中挥之不去的更明目张胆的社会主义色彩着实令人怀疑。在党内许多旧右派的议论下，第三军左派的地位变得岌岌可危。[ROOT.GetLeader]始终在这种愤怒的浪潮中秉持观望态度，而并没有迅速做出行动。他虽然不愿真正将朱德及其集团开除党籍，但党内许多人仍然要求在官方态度上斥他们为“低人一等”。\n\n更糟糕的是，近来，一身正气而又鲁莽粗暴的李弥也被扣上了受“左派”蛊惑，与国民革命军各级组织发生冲突的帽子，加剧了紧张局势。尽管官方上党内多数派都在指责李弥，但他却辩称自己只是在替[ROOT.GetLeader]做他做不到的事。而我们必须拿出官方的立场与态度，毕竟政学系各成员都是施压要求弹压左派，而第三军内部的共识则是与他们和解。"
 YUN.endgame.242.a: "他们永远都是战友同志！"
 YUN.endgame.242.b: "消灭这些受巴黎指挥的激进分子之影响力！"
 YUN.endgame.243.t: "正统委员长之治"
 YUN.endgame.243.d: "一股奇异的迷雾笼罩着整个国家。与过去几十年弥漫在中国各省的混乱、苦难和血腥氛围形成鲜明对比的是，人们正处于一种严肃、谨慎，甚至可以说是乐观的氛围之中。纵观朱培德委员长波澜壮阔、功勋卓著的戎马生涯，他堪称是彻头彻尾的革命军人典范。朱培德少年从戎，怀揣着李根源传授的爱国热忱与革命理想，投身于辛亥革命的时代洪流，并与朱德、范石生、金汉鼎、唐淮源以及其他云南讲武堂同窗义结金兰。为了救亡图存，朱培德不惜抛头颅洒热血。\n\n朱培德曾数度响应革命的号角——无论是护国战争、护法战争、北伐战争，还是在此期间的其他冲突。当国民革命军陷入绝境，重担再度落于朱培德肩头——他临危受命，统率各军完成先总司令制定的长征计划。在国民党的至暗时刻，朱培德接过了委员长职位，再次带领党走向辉煌，并完成了统一国家的伟业。\n\n时间丝毫没有减慢朱培德的脚步，朱委员长在国家建设时期仍在飞速前进，一丝不苟地履行作为政治家的职责。尽管担心被野心勃勃的李根源颠覆，但朱培德及其盟友[ROOT.GetSecondInCommand]还是设法达成了一份关乎国家未来的协议。在这份协议中，新旧右派弥合了分歧，宪政（无论采取何种形式）成为优先事项，国民革命事业也将得到充分实现。在最忠诚捍卫者的守护下，国家定将安然无恙。"
 YUN.endgame.243.a: "稳健之手，忘我之人。"
 YUN.endgame.244.t: "昆明真英雄再起"
 YUN.endgame.244.d: "或许命运最讽刺的转折之一就在于，开创国民革命新时代的并非少壮派革命者，也非恪守先总理遗训的国民党骨干，而是中华民族革命精神的奠基元老——李根源。李根源出身云南士绅家庭，他是云南陆军讲武学校之父，也是蔡锷的昔日劲敌，如今被推举为国府主席。作为同盟会创始成员、革命先驱与杰出政治家，李根源的人生经历证明，一个人的坚韧奉献、毅力决心能够让他在最艰难的境遇下坚持不懈、渡过难关。\n\n1915年，李根源安排蔡锷返回昆明，率先举义领导反抗袁世凯暴政的斗争，后来曾短暂担任南方军务院的领导职务，并出任陕西省省长，最终重掌滇军旧部。遭到唐继尧和李烈钧的排挤后，李根源前往北京参与政治活动，但他在南方的影响力依然存在（尽管时间短暂）。随着杨永泰将孙中山逐出广东的阴谋暴露，以及学生顾品珍在云南的统治倒台，李根源最终在曹锟贿选丑闻爆发后归隐山林。\n\n老骥伏枥，志在千里。国民党夺取云南后，李根源重回国家政坛并迅速行动起来——这一次，他将确保自己的雄心壮志不会受到任何束缚。作为政学系和欧事研究会的创始人之一，李根源与谷钟秀、黄郛等北方政学系成员保持着联系。如今，李根源迎来了政学系生涯的关键时刻——他以独具政治智慧的手腕赶走了朱培德，让旧政学系终于得以履行革命军人与生俱来的使命。可以肯定的是，老兵永远不会厌倦艰苦的劳动。"
 YUN.endgame.244.a: "“坚忍刻苦”。"
 YUN.endgame.260.t: "上海鸦片丑闻"
 YUN.endgame.260.d: "政学系因其伪军事性质而闻名，这导致派系内部的文官与军事事务界限十分模糊。虽然政学系本身主张平等，但其高层成员多有军旅经历——无论是李根源在战场内外的辉煌职业生涯，还是张群在军备与参谋领域的履职经历，抑或是黄郛曾任陈其美参谋长的职务。而在政学系少壮派中，这一传统仍得以延续。\n\n近日，国民党政坛新星、政学系要员熊式辉风头无两，他是一名优秀的行政人员和能干的政治官员，尤为喜爱举办奢华宴会。然而，熊式晖最近却卷入了一场丑闻，并波及了[ROOT.GetLeader]的政府，最终增强了人们对政学系政治腐败根深蒂固的普遍看法。\n\n国内媒体将此事戏称为“长江运毒案”，并将其比作美国尤利西斯·S·格兰特政府臭名昭著的腐败丑闻。最近，一艘从汉口开往上海的轮船被当地警方拦截搜查。在上海特别市政府的领导下，警方查明这艘轮船实际上是奉长官熊式晖之命运输的一批鸦片。熊式晖的政敌张定璠向国民政府痛陈利害，迫使[ROOT.GetLeader]成立全国禁烟委员会，旨在商议调查此事。然而，禁烟委员会主席完全受国府主席左右，因此熊式辉的命运最终将由[ROOT.GetLeader]亲自定夺。\n\n一方面，政府可以操控禁烟委员会力保熊式辉，虽然此举会产生不利影响，但至少可以确保这颗冉冉升起的新星不会在腾飞之前就被扼杀。另一方面，主席也可以顺势而为，借着严惩毒品走私彰显司法公正，以此挽救政学系的声誉。"
 YUN.endgame.260.a: "麻利点！掩盖所有与此“丑闻”有关的事情。"
 YUN.endgame.260.b: "天翼兄，这次你必须有所牺牲。"
 YUN.endgame.261.t: "国立南昌大学"
 YUN.endgame.261.d: "作为政学派最杰出的新星之一，熊式辉是全国各大媒体头条上的常客，不过每次的内容都各不相同：有些是关于他为国尽职尽责，有些是关于他对媒体的打趣，有些是关于他大宴同僚的怪癖，有些是关于他高产的诗篇，还有些是关于他的慈善事业。\n\n被任命为家乡江西省的省主席后，熊式辉就提倡厉行“清廉政治”，要求下属“简单朴素”。熊式辉在江西实行了党政军一元化的领导体制，有效地使自己成为“江西主心骨”。他彻底改组了江西省，将全省划为九个行政区并派出自己的亲信负责管理，并在省内推行了“一税制”。\n\n而为了配合他近来的改革努力，媒体上报道了熊式辉创办国立南昌大学的消息，并引发了热议。熊式辉从教育部获得了一百万元的拨款，秉持着“大中至正”的理念成功创办了这所综合性大学。著名的“中国生物学界的老祖宗”胡先骕博士被任命为该校首任校长，他是一位著名的学者、科学家，也是中国传统文化的推广者。国立南昌大学已着手推广一项雄心勃勃的计划，以提升江西人民的素质，并将本校变成科学研究的新避风港。\n\n国立南昌大学已吸引了许多其他著名学者加入其教职员工队伍，其中包括工学院院长蔡方荫、文学院院长王易、农学院院长周拾禄等。熊式辉计划进一步扩大该校规模，并将其与江西的其他大学合并。毫无疑问，熊式辉已为江西省乃至全国的未来留下了浓墨重彩的一笔。"
 YUN.endgame.261.a: "静思笃行、持中秉正。"
 YUN.endgame.261.b: "应该不用担心这个“江西王”……吧？"
 YUN.endgame.262.t: "书法家主席"
 YUN.endgame.262.d: "若将当今的国民政府比作由温文尔雅的西装、和蔼可亲的握手和游刃有余的微笑所构筑的政权，那真是再准确不过了。政学系全盘掌控政府后，国民党现已从革命政党转型为一个真正稳定的、全国性的政党。而政学系的统治风格，则在[ROOT.GetLeader]主席举手投足间散发的人格魅力中彰显得淋漓尽致。\n\n在官僚行政系统的重重帷幕之后，张群本人堪称魅力绅士的典范。作为一位著名书法家和热忱的艺术品收藏家，张群早在就任主席之前就活跃于中国艺术界，并与本世纪诸多艺术巨擘相交甚笃，例如擅长临摹古人真迹的书法宗师张大千，甚至还包括台湾著名水彩画大师蓝荫鼎和山水画家黄君璧。\n\n在学术界，这位卓然超群的自由派同样取得了辉煌的成就。张群被多所大学授予荣誉博士学位，包括伊利诺伊大学、首尔国立大学、圣约翰大学、成均馆大学，甚至还有东吴大学。从政治学到法学再到文学，张群也将自身一以贯之的儒雅风范注入了执政理念之中。\n\n张群倡导同僚“守法务实、真诚正直”，并奠定了政府的精神底色——通过政治妥协缔造更美好的中国。凭借个人友谊，张群将曾琦、张君劢等党外人士凝聚在一起，他的个人魅力甚至赢得了被边缘化的张学良和国父之子孙科的钦佩。张群这种令人倾倒的魅力甚至被带到了官方会议之中——每当会议间隙之时，张主席总会以幽默风趣的话语活跃会场气氛。"
 YUN.endgame.262.a: "治理国家恰似雕琢作品，不是吗？"
 YUN.endgame.263.t: "行政效率委员会"
 YUN.endgame.263.d: "为了给现代国家奠定坚实的基础，政学系正大力推进政府机构彻底实现真正的现代化，此举招致了他们旧右派同僚的不满和嘲笑。行政院长杨永泰主要关注行政院内效率低下的问题，并已着手起草精简行政部门的方案。为了防止胡汉民危机重演并消除行政部门普遍存在的管理不善等问题，杨永泰亲自建立并领导的行政效率委员会向政府提出了一项旨在革新现行体制的三阶段计划。\n\n首先，行政院的官僚机构必须彻底改进现有的档案保管方法，从而简化处理重要公文和信函的程序。其次，委员会明确指出，现行文书分类归档体系效率低下，犹如官僚主义迷宫，亟需建立科学高效的公文分类存档新制度。最后，行政院应裁撤多余的行政机构，以提高办事效率和协调能力。\n\n杨永泰随后提出，应扩大国家经济委员会的职能，将河道治理也涵盖在内；应撤销所有负责农业改革和农村合作社的机构，并将其职责移交给实业部。同时，应设立交通部；并将禁烟委员会的禁烟事务移交给军事委员会。最后，应将内政部划归孔祥熙管辖，并由实业部每年编制国民经济年鉴。\n\n由于政学系在政府立法和行政中占据主导地位，因此这些措施实际上只需走个流程便能获得主席批准。然而，任命孔祥熙的争议性举措以及行政事务的进一步集中，已在政坛中散播了一丝不安的气氛。"
 YUN.endgame.263.a: "通往国家社会主义理想的又一步！"
 YUN.endgame.263.b: "他会腐化党政机构吗？"
 YUN.endgame.264.t: "政治协商会议"
 YUN.endgame.264.d: "随着国家统一进程稳步推进，进入了必然的建设时期，所有人的目光都聚焦在[ROOT.GetLeader]主席和政学系身上，想知道他们对中国以及全体国民的未来有何展望。他们的治理模式最终将走向何方？是向旧政学系靠拢，还是新中国建设学会的崭新面貌？\n\n随着黄郛的北洋政学系与李根源、杨永泰的南方政学系重新整合，旧政学系至此正式统一，并开始敦促他们的年轻同僚起草宪法，正式结束国家的训政阶段。鉴于张群的新政学系大多表示同意，孙科领导的再造派和居正领导的西山派，以及党内其他法律专家，已声称要“按章办事”，邀请所有政党和独立人士参加政治协商会议。\n\n最终，此类事务的决定权仍掌握在[ROOT.GetLeader]主席手中。尽管主席是一位不懈奋斗的新式技官派，但在履行宪法职责时，要在多大程度上遵循正统，他仍有多种选择。首先，主席可以完全遵循程序，直至整个流程结束。另一个选择是指派选定的党内专家主导会议，以确保政学系主张得以实现。最后，也是最具争议的做法——主席可以提议维持《训政时期约法》，仅对其作适度调整。\n\n无论如何，国家的命运仍不明朗。尽管民主进程不断推进，但国民党（无论政学系是否占主导地位）究竟何时才能允许其他党派独立发展壮大，目前尚无定数。即便政客们争论不休，党国体制早已在实践层面深植于各级政府，未来数十年内恐难撼动。"
 YUN.endgame.264.a: "请照章办事先生们！照章办事……"
 YUN.endgame.264.b: "党内专家将确保善治！"
 YUN.endgame.264.c: "只要调整一下《训政时期约法》就可以了。"
 YUN.endgame.265.t: "火炬永不灭"
 YUN.endgame.265.d: "明媚的阳光洒在[ROOT.Capital.GetCapitalVictoryPointName]的街道上，人们穿行于日常琐事之间，相互寒暄，交换见闻。此番光景与那个饱受战乱、军阀混战和抗日战争摧残的国家截然不同。\n\n主席凝视着首都蜿蜒曲折的道路和熙熙攘攘的人群，一股深沉的自豪感油然而生，嘴角也难以抑制地上扬。阳光固然灿烂，但毋庸置疑的是，更高处飘扬着的青天白日旗帜比阳光还要明亮——它象征着希望、现代化与中华民族的新时代。或许有人会诋毁政学系背叛了国民革命，但国家如今有目共睹的繁荣景象，正是政学系稳健领导的最佳证明。\n\n与前任截然不同的是，主席被赋予了先发制人且无所不包的权力，但张群并非恣意妄为的独裁者，他本人常被类比为明治维新时期的明治天皇。主席受制于身边那群非正式的、凌驾于宪法之上的顾问，这群人被称作“中国元老”(げんろう)——这是一个由推崇平等主义和现代化的自由派精英改革者组成的寡头统治集团，恰似张群年轻时在日本亲眼目睹的元老院体制。\n\n总而言之，政学系和国民党的恩怨纠葛错综复杂，这一点毋庸置疑。自从投身中国共和事业之初，政学系便与国民党产生了派系裂痕，双方也曾多次爆发冲突。虽然政学系或许无法实现孙中山晚年构想的国民党愿景，但它恰恰体现了同盟会多年前的最初目标：为中华民族开创一个崭新的共和国……"
 YUN.endgame.265.a: "或许同盟会在某种程度上确实成功了……"
 YUN.endgame.300.t: "云南联省之胜"
 YUN.endgame.300.d: "昆明方面大获全胜。滇军在一十年代曾是一支劲旅，其后才日益衰落，时至如今这场决定性战役中的辉煌大胜才标志他们重夺了旧日荣光。与此同时，也有一种在二十年代被视为失败的思想也同样东山再起：那便是中国的联省主义。\n\n联省运动团结了一批军阀、地方派、宪政派、民主派和投机分子。这场运动争取着一个由士大夫主导的、在传统上强势的中央政府与日益崛起的地方政府之间划分权力的共和国。运动由南方人主导，但在北方也有支持者。这些北方支持者在1923年实行曹锟宪法时得以争取了一些名义的自治权，不过离他们所欲所求的相去甚远，仅仅有一些时不时出于尊重的让步而已。\n\n如今，他们已经预备好了推行自己的体制。不过，这背后的代价是惨痛的。国家经受连年战乱，军队臃肿不堪，且他们对于文官政府的忠诚度也令人起疑，甚至这场运动本身也面临分裂。[ROOT.GetLeader]及其盟友需要在未来几个月面临这些挑战。"
 YUN.endgame.300.a: "这是中国民主与宪政之胜利！"
 YUN.endgame.300.b: "各省终于从僭主手中赢回了自由！"
 YUN.endgame.301.t: "中央军与军阀"
 YUN.endgame.301.d: "在军阀割据时代的中国，军事集权面临着难以言喻的困难。晚清时期，各省的政治、经济和军事自治权不断增强，加之辛亥革命后持续数十年的内战，中央权力遭到大幅削弱，地方势力得以组建起强大的独立军队。各省军事化程度极高，任何示弱之举都可能招致邻省或中央政府入侵。这种高压态势迫使地方势力耗尽财力维持军备，而财政枯竭又迫使其寻求非法敛财渠道，最终进一步削弱了统治根基。\n\n结束这场危机绝非易事。国家在和平时期无力维持如此多的部队，大量部队亟待裁撤整编。但这需要各省与中央政府之间建立一定程度的信任，否则中央政府必须拥有足够的权力来强制执行非军事化。除了政治影响之外，每解散一支部队都意味着更多年轻人失业，这在历史上曾导致盗匪猖獗。由于中央政府试图以牺牲军阀盟友为代价来保全自身精锐部队，导致先前的去军事化努力曾引发过多次省级叛乱。\n\n多年来，云南领导人长期受困于这个问题——云南维持着一支庞大的军队以保护自己免受对手的侵害，但也为此承受了后果。唐继尧主政云南时曾撰文指出，中国需要一个能够对抗帝国主义并仲裁各省间争端的强大中央政府。另一方面，章太炎则坚持通过外交途径解决问题，并坚持各省至少保留两师兵力。民盟虽也曾广泛撰文论述军队国家化的必要性，但民盟的存续却始终倚仗军阀庇护。\n\n无论如何，裁军进程预计将在不久后启动，而军阀将首当其冲，由此引发了紧张局势。"
 YUN.endgame.301.a: "中央政府必须将军阀部队国家化。"
 YUN.endgame.301.b: "裁军必须平衡进行，以保护省级权利。"
 YUN.endgame.302.t: "经济顺风将至"
 YUN.endgame.302.d: "国家统一为经济繁荣带来了机遇——战火平息，百废待兴，但短期前景仍极为艰难。随着中国从战时经济转型，县长和民众不得不开始清点多年来遭受的损失。农田、企业和基础设施毁于战乱或劫掠，流离失所的难民陆续返回家园，却发现昔日的痕迹已所剩无几，被遣散的士兵则在苦苦寻觅生计。由于匪患与叛乱势力仍在滋扰，部分地区的法律秩序仍处于崩溃之中。值此国家重新整合之际，围绕土地、水源及商业权益的争端已在混乱中浮现。\n\n就宏观层面而言，多年内战的终结给新政府带来了严峻挑战。面对即将到期的债务，试图维护合法性的新政府无法再轻易拖延偿还，战败政府的债权人（有时甚至得到外国势力的支持）也试图迫使[ROOT.GetLeader]偿还债务。愈演愈烈的裁军危机进一步压缩了政府的财政收入，恶性通货膨胀的担忧也在日益加剧。增税将让饱受战争摧残的民众感到不安，持续蔓延的腐败痼疾更使税收举措收效甚微。\n\n这不禁让人怀疑，近些年来究竟损失了多少财富——不仅是炮火直接摧毁和外国势力掠夺的资产，还包括因局势动荡而胎死腹中的商业投资。辛亥革命后的历史走向已无法改写，中国本可获得的发展成果也已无法追回，但此刻正是政府为未来描绘更好蓝图的时候。"
 YUN.endgame.302.a: "提高税收并偿还债务将恢复对经济的信心。"
 YUN.endgame.302.b: "拒付北洋债务并增发货币即可偿债。"
 YUN.endgame.303.t: "民主化诉求"
 YUN.endgame.303.d: "在联省派政府的领导下完成统一后，延宕多时的新选举诉求现已刻不容缓。许多省份已经起草了自己的宪法，并得到了中央政府不同程度的支持。全国各地要求起草新宪法、举行承诺已久的民主选举的呼声日益高涨。\n\n中国民主同盟在抗日战争结束后加大了施压力度，并发表了一系列声明，包括《对抗战最后阶段的政治主张》（包含36点建议）及《在抗战胜利声中的紧急呼吁》，要求终止独裁统治、承认各党派及公民自由合法性、建立统一军事指挥体系并通过全国军队复员委员会实施裁军、废除秘密警察与政治犯劳改营等战时措施、落实战时难民抚恤。这些声明究竟是针对[ROOT.GetLeader]总执政还是各路军阀，目前尚不清楚。\n\n各省的要求则更为明确，即遏制中央政府权力的扩张。尽管联省政府承诺尊重地方自治，但实际上，当局通过控制重建项目、部署中央军、任命县长以及解决地方申诉等举措，已在各省积聚了庞大影响力。章太炎因鼻窦癌病情恶化，更兼哮喘频发，已流露归隐之意。在生命的最后阶段，章太炎一直在国家舞台上奔走疾呼，警告中央政府权力过大的危险。\n\n然而，建立联省民主说起来容易做起来难，毕竟中国人民对“民主”的含义有着截然不同的看法……"
 YUN.endgame.303.a: "提议成立临时联合政府直至举行选举。"
 YUN.endgame.303.b: "我们必须开始将地方事务交由当地人处理。"
 YUN.endgame.304.t: "联省主义实现乎？"
 YUN.endgame.304.d_intro: "中国在云南领导的广州联省政府旗下统一了，这也为我国一段沉痛的历史画上了句号，但新曙光乍现之际，新问题也接踵而至。为了赢得武力统一中的不少胜利，新的中央政府靠的是建立一支庞大而顽强的军队，也同样建立着庞大而顽强的国家机器——这也正是历来暴君僭主的左膀右臂。此举将令国家破产、国库空虚，举国亟待迈向和平。\n\n后果显而易见：通货膨胀、政治紧张接踵而来。要解决这一系列社会、经济、军事与政治问题的大杂烩，靠的是一系列审慎的谈判，令全国解除武装，实行国家建设，并解决央地关系这一悬而未决的政治问题。然而，很多人怀疑[UPC.GetLeader]的诚意，担心一切代价都会由边远省份承担。"
 YUN.endgame.304.d_generic: "$YUN.endgame.304.d_intro$\n\n公正解决这一切危机的途径就是公平的民主选举，但许多人质疑他们是否有意愿如此做。预计中央政府将在[UPC.Capital.GetCapitalVictoryPointName]举行由云南与广东的政治人物主导的制宪大会。而同时，[UPC.GetLeader]的影响力似乎一直较为羸弱。如果有人意欲挑战……而这个人刚好是[ROOT.GetLeader]的话……他能够成功吗？"
 YUN.endgame.304.d_hnn: "$YUN.endgame.304.d_intro$\n\n对我们来说，参会便无异于向[UPC.Capital.GetCapitalVictoryPointName]投降。我们的运动与联省运动关系匪浅，此刻要么便站出来夺取其控制权，要么就被它的大潮所淹没。尤其对于许多湖南政治人物来说，云南的运动中时兴的坚持军队国家化（最多也就给各地保留几个师的控制权）实在令人抗拒——这无异于我们自治的终结。\n\n同样，云南的作威作福、贵州的诸多问题，还有人际关系间的爱恨纠葛，仍然在许多湖南人心中留下了阴影。"
 YUN.endgame.304.d_szc: "$YUN.endgame.304.d_intro$\n\n对我们来说，参会便无异于向[UPC.Capital.GetCapitalVictoryPointName]投降。我们的运动与联省运动关系匪浅，此刻要么便站出来夺取其控制权，要么就被它的大潮所淹没。云南的领导人过去曾多次在四川作威作福，因此对四川的联省派而言，屈服于云南总是令人有苦说不出。但我们已经为联省事业奉献了如此之多，要不要更进一步发誓永远效忠呢？"
 YUN.endgame.304.a: "黄袍加身，岂有退路……"
 YUN.endgame.304.b: "也许他会信守承诺？"
 YUN.endgame.304.c: "当断不断，必受其乱！（切换为[UPC.GetNameDef]）"
 YUN.endgame.305.t: "[FROM.GetLeader]反抗国家化措施！"
 YUN.endgame.305.d.base: "虽然联省运动在全国各地都有支持者，但最终实现蔡锷梦想、在共和国框架下重新统一国家的却是云南人民。强大的滇军击败了对手，将全国统一在联省主义的旗帜下，完成了自1911年以来一直未能实现的目标。\n\n然而，胜利与和平似乎并未得到所有人的珍视。面对中央政府偏袒扶持滇系势力、纵容云南派系垄断国家政权、默许贪腐横行、任人唯亲、军阀割据以及粗暴推行中央集权等行径，[FROM.GetLeader]正竭力号召本省及其他支持者脱离中央政府。"
 YUN.endgame.305.d.closer: "中央政府自然占据着显著优势。由于控制着中国的主要城市，并拥有国际合法性（至少目前如此），这让中央政府能够获得更多贷款，拥有更庞大的税收和兵员人力。但[FROM.GetAdjective]的地方派对其军队的能力充满信心，并坚信各方势力必将群起反抗滇系把持的中央专制统治。此类动荡在中国已是屡见不鲜。不过，双方至少达成了一项共识：绝不允许军阀割据时代再现。"
 YUN.endgame.305.d.generic: "$YUN.endgame.305.d.base$\n\n[FROM.GetLeader]和[FROM.GetRulingParty]近来与联省运动保持着松散联系，虽然两者看似彼此独立，但双方理念根基实则相通。他们的野心与联省派在南方的胜利不谋而合，并借此实现了国家统一。但当中央政府试图对昔日盟友施压时，[FROM.GetNameDef]显然不愿屈服于联省当局的统治。\n\n$YUN.endgame.305.d.closer$"
 YUN.endgame.305.d.hnnfed: "$YUN.endgame.305.d.base$\n\n湖南向来以坚定刚毅的省宪为根基，将地方自治奉为圭臬，并以其近乎邦联式的独特联省制度而自豪。然而广东势力主导宪法起草，并且公然将各省部队国家化的做法最终激怒了湖南，导致他们揭竿而起。湖南正在争分夺秒，力争在为时已晚之前摆脱[UPC.GetLeader]的控制。\n\n$YUN.endgame.305.d.closer$"
 YUN.endgame.305.d.szcfed: "$YUN.endgame.305.d.base$\n\n四川的联省运动一直被同时代的其他势力所掩盖，甚至被一些联省派视为敌人，曾多次与云南和广东的联省派发生冲突。各省部队国家化的命令成为了压垮四川的最后一根稻草，这无疑是试图将他们限制在单纯的省级层面。[FROM.GetLeader]拒绝服从中央政府的指令，选择起兵反抗，意图按照自己的理念重新定义联省主义。\n\n$YUN.endgame.305.d.closer$"
 YUN.endgame.305.a: "军阀们将被碾碎。"
 YUN.endgame.305.b: "联省派自相残杀。"
 YUN.endgame.310.t: "联省派选举令"
 YUN.endgame.310.intro: "新的政治秩序降临了神州大地，中国统一战争的胜利者们主导着格局。共和大同盟和中国民主同盟已成为新共和国的主要政党，双方为争夺全国各省立法机构的控制权展开了激烈角逐。然而，最竞争最激烈争当属总执政人选——谁能拿下总执政宝座，谁便掌握了宝贵的人事任命权与行政职位。\n\n共盟被认为是两大主要政党中历史更悠久的一个（具体细节尚有争议），共盟的根源可追溯到二十年代的旧联省运动，许多联省派领袖都曾参与过最初的辛亥革命。尽管共盟的民意基本盘是士绅和商人等较为保守的建制派，但部分共盟领导人秉持着更为折衷的信条。共盟强调维护地方自治，并借此建立了强大的势力，尤其是在共盟的发源地华南。然而，这也导致共盟更加受制于各地区领袖的内部争执。"
 YUN.endgame.310.d_default: "$YUN.endgame.310.intro$\n\n章太炎由于病情恶化宣布退出政坛后，长期掌权的总执政唐继尧已成功将共盟整合于其麾下。唐继尧代表了共盟中较为保守和专制的一面——他秉持梁启超的传统治理模式，而非西化自由派同僚的路线。他未来面临的最大挑战不仅是赢得即将到来的选举（鉴于目前形势，唐继尧胜算颇高），还要让民众相信选举的合法性。\n\n面对民盟出人意料发动的浩大竞选攻势的挑战，唐继尧必须精心运筹以捍卫其政治遗产。陈炯明同样因健康情况恶化而逐步淡出国家政治舞台，并已提名前副手马育航作为竞选搭档。"
 YUN.endgame.310.d_satellite: "$YUN.endgame.310.intro$\n\n唐继尧下野去世后，他所属的共盟派系曾一度被认为即将迎来终结，但他精明的儿子唐筱蓂接过了民治党的火炬。章太炎由于病情恶化宣布退出政坛后，民治党便交给了这位年轻的政治家掌管。唐筱蓂与父亲迥然不同——虽然唐筱蓂也曾接受过日本教育，但他学习的是经济学，主要在父亲的政府中担任文职职务。\n\n唐筱蓂更加开明，也更契合当代中国的政治发展趋势。他与父亲在共盟内部的昔日盟友（有时甚至是对手）结盟，并提名陈炯明的前副手陈其尤作为副执政候选人，以争取广东选民的支持，同时还承诺将任命一位北方人担任总理。这个精明的年轻人或许会对寸树声的统治构成前所未有的挑战。"
 YUN.endgame.310.a: "共盟选择强调自己的温和宪政主义纲领。"
 YUN.endgame.310.b: "唐继尧依靠他在军队和官僚体系中的人脉。"
 YUN.endgame.311.t: "民盟内的勾心斗角"
 YUN.endgame.311.intro: "中国民主同盟诞生的时间虽然不长，但它背后是数十年来，中国的改革派为团结各种自由派和进步派知识分子，推动民主改革所付出的不懈努力。民盟中许多领导人物都奉梁启超为导师和榜样，早在1913年，梁启超领导的进步党就将北洋政府中所有非同盟会派系团结起来，并试图建立一个有组织的政治联盟。1929年，统一建国同志会的成立将这一理想化为现实，并成为日后民盟的前身。\n\n民盟由中产阶级知识分子和商界人士主导，而其中的各个派系也正如占据其领导层主力的学者、官僚和银行家一样难以驾驭。民盟的左派包括全国各界救国联合会，和一些规模较小、通常与社会主义者有关联的地方性团体。民盟中的自由派则包括新月社、中国民主建国会和中国民主促进会。而那些为数众多的梁启超系则聚集在中国民主社会党周围，该党将改良派社会主义经济纲领与具有民族色彩而且有一定传统主义倾向的社会观结合在了一起。"
 YUN.endgame.311.d_default: "$YUN.endgame.311.intro$\n\n与地域性极强的共盟不同，民盟的支持者分布广泛，其分支遍布北方、东方和南方的各个人口密集区域。罗隆基吸引了那些反对唐继尧统治的势力，并试图借此势头赢得即将到来的选举。为了摆脱他那“一贯不讨人喜欢”和过度西化的名声，罗隆基不情愿地邀请竞争对手张君劢参与选战，希望能够利用张君劢作为顽固的社会民主主义者与中国文化的坚定捍卫者的声誉，并吸引张家那些上海的商界精英们的雄厚财力支持。但不论罗隆基选择左转还是右转，他都得疏远某些党内人士。"
 YUN.endgame.311.d_satellite: "$YUN.endgame.311.intro$\n\n寸树声这位黑马候选人离总执政仅一步之遥。作为一位地方知识分子领袖，他与民盟内各主要政党间并没有什么特别的关联，而他在全国范围内的声望主要源于他近期发表的一些关于农村改革的著作，以及他出人意料地领导云南统一全国。为了扩大自己的选民基础，寸树声提名罗隆基为自己的竞选搭档，而这位出生于江西、受过北方教育的名人乐于加入了他的竞选阵营。寸树声正努力让自己不再仅仅是一个来自中国边陲省份的幸运政客，因此他必须谨慎考虑要不要与社会主义者或军阀们结成同盟。"
 YUN.endgame.311.a: "民盟选择左转。"
 YUN.endgame.311.b: "民盟的自由派蓬勃发展。"
 YUN.endgame.311.c: "民盟示好梁启超系。"
 YUN.endgame.312.t: "其余各党集会"
 YUN.endgame.312.d: "共盟和民盟实际上联手垄断了统一后的政治体系，但共和国的其他政党并不甘心低头认输。为了备战选举，合法和非法政党的政治代理人纷纷组织起来，利用共盟和民盟在基层竞选中的弱点，争取保住现有的一席之地，并试图拿下其他选区。\n\n[UPC_GetDCPPartyName_nocolour_long]和中国青年党均根植于梁启超思想，并奉行非自由主义的政治传统。梁启超是中国改良派的奠基人，一生中经历过多次政治立场转变。梁启超所倡导的宪政主义、公民民族主义、现代化理念，以及对西方科学与中国传统兼收并蓄的平衡之道，在中国北方尤其受到欢迎。由于南方在联省制下新获得的主导地位让许多北方人感到被边缘化，因此两党势力都在持续壮大。\n\n北洋政治传统上排斥西式政党，尤其是在袁世凯与同盟会爆发冲突之后，政党在北方实际上成了革命煽动的同义词。但随着南方人大出风头，许多北方人也开始尝试政党政治。然而，西式政党先前的污名挥之不去，对昔日北洋绅士政治的怀念也依然存在。那些顽固地保持独立、迎合地方利益的政客仍然掌控着地方政治机器。\n\n即使遭到当局的打压限制，极左翼势力也依然在继续活动。他们历来擅长大规模动员选民，尤其是那些心怀不满的贫困选民，因此仍是一股不容小觑的力量。国民党和工团党虽仍保持存在，但内部也产生了分裂，一些党员拥抱新共和国，另一派则誓言继续抗争，徒劳地追逐着他们的革命事业。"
 YUN.endgame.312.a: "如果不参与政党政治，我们就会被新秩序所淘汰。"
 YUN.endgame.312.b: "北方人士一如既往地顽固保持独立。"
 YUN.endgame.313.t: "章太炎逝世"
 YUN.endgame.313.d: "章太炎在家中逝世，对于其具体死因说法不一，有的说是由于严重的哮喘发作，有的说是由于鼻窦癌导致的高烧。不过毋庸置疑的是，全国上下都因此沉浸在悲痛之中。中国各地的报纸都报道了他的死讯，各政治派别的政界人士也纷纷表示哀悼。\n\n[UPC.GetLeader]总执政已批准其家人的请求，为章太炎举行国葬。但起初由于在安葬地点上存在一些分歧，导致葬礼被拖延。章太炎的遗言中只说“设有异族入主中夏，世世子孙毋食其官禄。”，并未明确表明自己的安葬地点。但章太炎的一些同僚找到了他1915年被囚禁期间写下的《终制》，章太炎在其中表明他希望将自己安葬在明朝开国功臣、著名学者刘基的墓旁，以此效仿张煌言逐岳飞墓而葬。据说，他在获释后，甚至从刘基后人手中买下了一块地。\n\n章太炎在《终制》中哀叹，由于他支持袁世凯，恐怕他的贡献不会像刘基那样被人们铭记。看来他错了。哪怕不看他在辛亥革命中的英勇事迹，他对中华文学、古典文化以及联省政府的发展所做出的贡献，也已经从根本上塑造了新时代的中国。不过，在世之人依然可以决定让他以何种形象被铭记在公众的集体记忆当中。"
 YUN.endgame.313.a: "伟大的爱国主义革命家，"
 YUN.endgame.313.b: "联省民主的奠基人，"
 YUN.endgame.313.c: "国学大师章太炎先生。"
 YUN.endgame.314.t: "国家局势不稳"
 YUN.endgame.314.d: "[GetYear]年选举正稳步迈向尾声，但紧张局势仍在持续。尽管许多地方预计将有序举行投票，但保守派担心激进分子操纵民众，而进步派则对投票的公正性表示担忧。\n\n对于一个年轻的民主国家来说，这些问题都在意料之中。中国历史上的选举相对低调，通常由地方士绅和当权者决定。然而此次选举模式颠覆了数十年来根深蒂固的政治格局，一些当权者确实面临着被新生代取代的风险。然而，这种不确定性既营造了希望的氛围，也带来了恐惧。\n\n旧北洋政府一直围绕着政治强人及其盟友（通常是省级军阀）运转，虽然联省派声称自己与众不同，但许多人注意到，云南人和其他南方人士仍然在军队、官僚机构，甚至党政机关和企业等非政府机构中掌握着重要权力。即使在北方和华东人士主导的学术界和媒体界，那些与昆明和广州有联系之人也获得了晋升。当地方派系影响力扩张至全国层面，滇系内部的细微矛盾对外界已无实质意义。新兴的所谓“滇系”现已垄断了令人垂涎的关键权位，这招致了许多批评。\n\n在当前国家面临不确定性与权力再度集中的背景下，民主制度的倒退恐将成为至少一代人亟需应对的严峻挑战。这种危机可能由多种潜在原因引起——国家内部结构分崩离析，或是外部威胁持续激化，抑或是选举结果引发激烈争议。这让许多人怀疑我们的民主制度能否长期保持活力。"
 YUN.endgame.314.a: "当投票成为一种克制、温和的行为时，共和国会才变得更好。"
 YUN.endgame.314.b: "民主的本质就在于让人民自由表达意愿。"
 YUN.endgame.320.t: "选举引发广泛冲突"
 YUN.endgame.320.d: "中国民主人士一直期盼着自由公正的全国选举，并寄希望于联省运动能够实现这一目标。然而不幸的是，随着越来越多的选区揭晓选举结果，他们似乎仍需等待很多年。\n\n尽管许多选区确实举行了合法（或基本合法）的投票，但其他许多选区却充斥着大量违规行为和舞弊指控。在许多关键省份，保守派候选人均以微弱优势胜出，而一些挑战者则被不怀好意的选举委员会驳回。在许多边远省份，存在压制选民甚至中央军军官直接操纵选票的报道。由于多数省级机构对现状赤裸裸的偏袒，最终导致共和大同盟获得了压倒性优势。\n\n尽管反对团体持续抗议，但[UPC_GetSTAPartyLeader]还是当选为总执政并匆忙宣誓就职。虽然有人试图在法庭上挑战选举结果，但多数人清楚此举注定徒劳无功。经历经数月混乱选战后，军方已明确支持其属意对象，指挥官们如今更不会让步。对民主程序的信任已经荡然无存，随着越来越多的议员前往[UPC.Capital.GetCapitalVictoryPointName]就职，显而易见的是，总执政的统治不会受到任何制度上的抵制。\n\n民盟领导人铤而走险，号召支持者走上街头抗议选举结果，但这不过是徒劳挣扎，终究难改定局。"
 YUN.endgame.320.a: "我想这就是民主在发挥作用。"
 YUN.endgame.321.t: "总执政自我政变"
 YUN.endgame.321.d: "总执政几乎一直掌握着巨大的权力，远远超出了宪法赋予的范围。即便不是总执政本人，也常有强人在幕后掌握实权。或许联省宪法的起草者们希望立法机构、各省或简单的民主规范足以阻止同样的悲剧在他们的新共和国重演。又或许，他们在宪法出台之前就接受了这个现实。\n\n无论如何，唐总执政的权力正愈发膨胀，他和他的亲信巩固了对行政部门的控制，他的特工开始系统性地骚扰异见人士，反对派也越来越难找到合法途径来反对他的统治。随着唐总执政努力巩固自己和一小撮被称为“滇系”的云南官员的权力，就连他所在的民治党的一些成员也被边缘化。据说，[GetSecondInCommand]总理也身陷困境。宪法确立的民主保障机制正被缓慢稳步瓦解。\n\n为了对抗唐继尧大肆攫取权力的行为，[UPC_GetCDLPartyLeader]和其他民盟领导人做了最后的努力，他们在国会推动立法，要求严格限制总执政法令效力，并组建一个由所有政党参与的民族团结政府。但他们的呼吁并未得到其他政党的积极响应，大多数政党选择采取观望态度，甚至干脆屈服于唐继尧的统治。\n\n民盟知识分子也开始在全国各地的社论报刊中表达他们的不满，希望引起广泛的反抗，却发现饱受战争摧残的民众大多对此漠不关心。大多数省份也同样牢牢地控制在唐继尧手中，省长们要么是出于忠诚，要么是害怕镇压，要么是蔑视任何激进行动。在这个年轻共和国的民主日益受到侵蚀之际，与政府结盟的媒体更是指责民盟在从事颠覆活动。"
 YUN.endgame.321.a: "是人民选择了唐继尧担任领袖，而不是他们。"
 YUN.endgame.322.t: "民盟政府垮台"
 YUN.endgame.322.d: "[GetSecondInCommand]政府近来一直摇摇欲坠，其权威受到诸多因素的削弱：争议性决策、军方高层不满以及对国家统一后各种危机处置不利。政府的公众支持率正在暴跌，由于盗匪猖獗，精英阶层开始呼吁更强有力的领导层来掌控局势。然而最致命的打击在于，[UPC.GetLeader]似乎已失去了其政府赖以运转的县长与军官的信任。\n\n首都爆发的小规模骚乱最终给了反对派采取行动的口实——[UPC.Capital.GetCapitalVictoryPointName]的几名学生活动家被警方逮捕，并被指控参与煽动性社会主义组织，这引起了学生的强烈抗议。抗议活动演变成暴力事件后，地方当局下令逮捕数十人，其中包括几名教授——这加剧了骚乱，并加深了人们认为民盟内部藏匿社会主义煽动分子的印象。许多被拘留的学者都是民盟成员，他们已请求总执政出面干预。\n\n然而，总执政几乎没有转圜的余地。随着消息迅速在首都传开，有关总执政打算下令释放嫌疑人的谣言已甚嚣尘上。[UPC_GetSTAPartyLeader]抓住时机，呼吁对[GetSecondInCommand]总理的内阁发起不信任投票。不信任动议以惊人的速度获得通过——许多议员甚至没有到场投票。当天晚些时候，[UPC.GetLeader]总执政失踪，据信已被内部政变推翻逮捕。前总理和许多民盟成员已经逃离首都，希望在各省集结支持力量。"
 YUN.endgame.322.a: "我们可以预见[UPC.GetLeader]很快就会辞职……"
 YUN.endgame.323.t: "民主烈士"
 YUN.endgame.323.d: "抗议活动起初进展缓慢，但随着民盟努力动员追随者反对[UPC_GetSTAPartyLeader]的权力博弈，抗议规模逐渐壮大。滇军随即以迅猛攻势扼杀了萌芽中的反对势力，陆军学员组织了大批效忠者袭击民盟抗议者，而警方则突袭了民盟领导人的住所。\n\n更令人毛骨悚然的是光天化日之下发生的刺杀事件——李敷仁与王任在西安遇刺；“七君子”之一、著名民盟组织者李公朴先是遭到亲政府暴徒击中头部重伤，后在昆明疗养期间散步时，被当地驻军军官公然枪杀。\n\n三天后，怒不可遏的闻一多在李公朴葬礼上即兴发表讲话，尖锐批评了滇系核心人物，并向人群中的特务们发出挑衅言论：“我们不怕死，我们有牺牲的精神，我们随时像李先生一样，前脚跨出大门，后脚就不准备再跨进大门！”当天下午晚些时候，闻一多在离开办公楼时遭遇枪击身亡。\n\n闻一多的殉难引发了人们的悲痛。闻一多在许多诗歌作品中都表达了他对“宁鸣而死”的渴望，即在追求理想的过程中，以完美的姿态死去，成就英雄式的牺牲与自我实现。这位极具魅力的学者兼政治家曾戏剧性地向人群地摊开他沾满粉笔灰的双手，坚称民盟学者们的手上没有沾染鲜血，并恳请众人不要轻视他那纯洁的双手，因为这双手可以“改变历史，创造奇迹”。\n\n面对汹涌的反抗浪潮，滇系已无退路。民盟领袖持续遭受追捕与迫害：孙中原在北京遇害，陶行知则在上海突发脑溢血逝世。当局实施宵禁戒严，查禁进步刊物，众多民主人士被迫流亡海外。"
 YUN.endgame.323.a: "[UPC_GetSTAPartyLeader]胜利了，但也付出了惨重的代价。"
 YUN.endgame.330.t: "国家不幸诗家幸"
 YUN.endgame.330.d: "抗日战争给这个国家，尤其是这个国家的人民带来了难以言喻的惨痛。无数母亲失去了儿子，无数孩子失去了父亲，无数兄弟失去了姐妹。这是一场反抗帝国主义和文化灭绝的战争，是所有中国人面对那些试图毁灭中华民族之人的最后一搏。为了记录下这场残酷的战争，人们运用了非凡的摄影技巧，甚至还拍摄了胶片，但最忠实而完美的记录还要数那些古老的散文和诗歌。\n\n在由云南人领导的中国民主同盟中，许多人都曾接受过新月社成员的诗歌创作指导，而其中一位爱国诗人的作品格外声名鹊起，回荡在每一位中国人心中。\n\n杨明是一位出生于云南大理的白族人，和他的同僚相比，他相当年轻，属于那代除了军阀混战之外一无所知的中国人。9岁时，他在下关一家商店当学徒，1936年，16岁的他前往昆明就读于中德大学。抗日战争期间，他积极投身于文艺创作，创作了大量宣传作品和诗歌。\n\n经闻一多介绍，杨明加入了联大新诗社，他最受欢迎的作品当属《死在战场以外的中国兵》。这首诗曾被闻一多本人亲自朗诵过，还被改编成了话剧，赢得了更大的赞誉。政坛之上，杨明是中国民主同盟的铁杆成员，他倾向该党的左翼温和派，并坚定地持有爱国和民主的立场，他被视为民盟圈子里一颗冉冉升起的新星。"
 YUN.endgame.330.a: "新一代中国人，新一代诗人政治家！"
 YUN.endgame.330.b: "还不到三十岁，就这么自以为是了？"
 YUN.endgame.331.t: "改良派中的革命者"
 YUN.endgame.331.d: "自从社会主义在军阀时代被引入充满活力、年轻多变的中国政坛以来，就一直存在两种观点：一种是通过阶级斗争来宣扬社会主义理想的方式，另一种则是通过参与资产阶级民主来推进人民解放的方式。\n\n许多社会主义运动因宣扬革命斗争而臭名昭著——而在中国，最热忱、最激进、最坚定的阶级斗争拥护者，当属国民党左派和中国工团党。临时行动委员会等组织将三民主义解读为解决社会问题的良方，以及在中国推行社会主义的指南。临委会始终致力于动员群众投身武装抗争，推翻压迫者的统治。\n\n信奉议会改良方式的最大群众政治组织则是中国民主同盟左翼。从全国各界救国联合会到民主社会党，民盟左翼主动接纳了大批社会主义革命阵营的叛逃者。随着国民党的地位和影响力日渐式微，并不断受到国家机器的攻击（主要因为他们想推翻当局），许多前国民党拥护者，甚至本土社会主义者，都纷纷转投了中国民主同盟。\n\n然而，由于民盟不断吸纳激进分子，导致其领导层内部出现分裂。与激进分子合作无疑会损害民盟在某些利益集团，甚至反对派眼中的形象；但不与激进分子合作，则会加剧民盟内部的派系斗争，从而损害民盟整体的影响力和实力。"
 YUN.endgame.331.a: "无需指摘他们的行为。"
 YUN.endgame.331.b: "是不是得问问他们孙中山当初妥协到了什么程度？"
 YUN.endgame.332.t: "全国推广斯巴达式教育"
 YUN.endgame.332.d: "寸树声是一位毕业于日本的经济学家，后来成为民主革命先驱。他也被誉为杰出的教育家，在抗日战争期间的贡献堪称非凡，他的教育成就甚至超越了其政治才能。1932年回国后，他在北京大学找到了一份工作，但最终因直系当局对左翼势力的镇压而被迫返回家乡。\n\n寸树声不为名利所动，毅然踏上了最终成为其毕生事业标志的征途。他来到腾冲，创办了云南第一所华侨学校——益群中学，并担任校长。据传，他自筹资金在当地创办这所学校，并将之比作“建设一所智慧的果园”，并提出“乡村学校应与社会打成一片”的办学理念。\n\n寸树声精心培养学生，为他们的将来做好铺垫，并倡导一种独特的“斯巴达式”教育。他提倡学生培养求实精神，并坚持认为“以斯巴达的严格训练对背负着几千年因袭的中国青年是必要的，有益的”，以此来证明他自给自足的教育方式的合理性。\n\n寸树声还倡导师生自己种植庄稼、自己修缮校园，甚至让学生清理自己镇上的道路、组织消防队、创建运动队、修建水利工程、发展渔业和家禽业，甚至帮助农民进行冬耕。\n\n寸树声从昆明聘请了一批教师来提高益群中学的教育水平，并进一步将自己的教学方法推广到和顺乡，先后担任小学校长、图书馆馆长和乡公所文化股主任。凭借他的经验，全乡学龄儿童90%进了学校，30岁以下的成人无文盲。"
 YUN.endgame.332.a: "愿他的方法能在全国范围内得到推广！"
 YUN.endgame.332.b: "把每所学校都变成公社似乎不太合适。"
 YUN.endgame.360.t: "《新月的态度》"
 YUN.endgame.360.d: "新月社全面涉足政治后，文艺与政治手腕的融合催生了与其同名的文章《新月的态度》。这篇宣言兼具文学性、艺术性、学术性与政治性，据信由徐志摩在逝世前起草，其理念和价值观汲取了梁实秋所倡导的新人文主义政治思想。最终，这篇文章在某种程度上成为了新月社所倡导的新自由主义文化态度的代表作。\n\n文章开篇对整个文坛进行了概括性批判，声称由于“思想的市场”迷失于“绝对的自由”，导致文坛正处于“无政府的凌乱”。文章随后以“新月派”的“新立场”为切入点，用“健康”和“尊严”两个口号来表达他们的文学理想。\n\n尊严，它的声音可以唤回在歧路上彷徨的人生。健康，它的力量可以消灭一切侵蚀思想与生活的病菌。这份宣言将生命视为一个“整体”，而支离的、偏激的看法，宣示着新月社寻求平庸，而非极端或怪诞的愿望。\n\n就宣言自身而言，“谦卑”的原则和前提是新人文主义理念中不可或缺的组成部分，尊严与健康都对生活和文学具有约束力。宣言强调对这种谦卑的倡导，并将这种谦卑与秩序、平庸相结合，反对偏激、怪诞和冲动。\n\n最后，新月社列举了十三种“我们这态度所不容”的文学力量：感伤派、颓废派、唯美派、功利派、训世派、攻击派、偏激派、纤巧派、淫秽派、狂热派、贩卖派、标语派和主义派。他们将这些力量与新兴的反左翼思潮联系起来，提出了“常见的英美文学自主性理念”，即个人主义、精英主义和非功利主义的写作方式。"
 YUN.endgame.360.a: "道德社会就是文雅社会。"
 YUN.endgame.360.b: "精英主义取代威权主义？"
 YUN.endgame.361.t: "总执政的含义"
 YUN.endgame.361.d: "担任总执政意味着什么？是通往权力的坦途？是被赋予塑造中国未来的全权？是近乎绝对的权力？是屈从于立法机关、行政机关？不管你问谁，从最勤劳朴实的农民到最肆意妄为的军阀，所得答案必是五花八门。但如果你问现任总执政罗隆基，担任这一职位意味着什么？他的回答却很简单：捍卫人类的自由。\n\n在最近的一次新闻发布会上，罗隆基总执政表示：“取缔言论自由，所取缔的不止在言论，实在思想。不止在思想，实在个性与人格。取缔个性与人格，即系屠杀个人的生命，即系毁灭人类的生命。”\n\n在罗隆基看来，人生最重要的层面是个人，而非国家。对他以及其他新月社成员而言，是一个人，就有思想，自然就会追求幸福，这种幸福只有通过发展个性、培养人格才能获得。用罗隆基自己的话来说，自由是绝对的，是所有人类与生俱来的权利。\n\n独裁统治最终无法实现罗隆基所设想的国家的三重功用：（一）维持生命；（二）发展个性、培养人格；（三）达到人群最大多数的最大幸福的目的。独裁统治剥夺了自由，阻碍了发展个性、培养人格，反而助长了被动依赖的性格。正如罗隆基所言，独裁统治是“没有思想的机械装置”。\n\n对于罗隆基来说，成为总执政意味着他终于可以实现自己的期望——由知识分子构建一个重视言论自由、政府保障自由、人尽其才的政治体制。革命的发生，首先源于被压迫者推翻压迫者，因此我们必须走近底层群众，并提高他们的社会地位。"
 YUN.endgame.361.a: "他是一位孤勇者，独自对抗数十年的不公。"
 YUN.endgame.361.b: "但我们能做的肯定不止政治改革吧？"
 YUN.endgame.362.t: "新月社的鼓动家"
 YUN.endgame.362.d: "新月社、民社党等中国民主同盟成员党派的领导人大多相对年轻，鲜少有白发苍苍的老人存在。但这些党派中依然还会有一支年轻气盛、野心勃勃、行事激进的“少壮派”。而在新月社的众多年轻新星中，储安平尤为引人注目。\n\n储安平生于1909年，出身江苏一个科名长盛不衰的望族。储安平的伯父储南强与黄炎培是同学，储安平本人考入了新成立的光华附中，这和他受左翼思潮影响密不可分，后来又升入光华大学。储安平爱好文学创作，为“新月派”后起之秀，与徐志摩等人均有往来，深受其影响。\n\n当时胡适、徐志摩、张东荪、罗隆基等人皆在光华任课，储安平因此与他们相识。他还在同学中认识了几位挚友，并与自己日后的妻子端木露西相识。储安平积极参加救国会运动，曾在上海活动过一段时间，并在张东荪主办的《再生》杂志上发表评论文章。后来他逐渐放弃散文而改写文学评论。\n\n1936年，储安平前往英国留学，积极关注工团主义世界的情况。抗战爆发后，他回到中国，以自己的方式——写作——为抗战出力。他经营着多家书店和文学刊物，担任编辑，并协助他在新月社、民社党和全救会中的朋友组织成立了中国民主同盟。储安平是一位坚定的民主主义和自由主义者，他经常对民盟的政治对手进行激烈的批驳，严厉批评他们反对民主、腐败独裁的行径，他还向民主科学座谈会示好，希望将他们纳入民盟。"
 YUN.endgame.362.a: "储君不亡，民主不死。"
 YUN.endgame.362.b: "兴风作浪，太过猖狂。"
 YUN.endgame.390.t: "虎父无犬子"
 YUN.endgame.390.d: "作为大名鼎鼎的唐继尧之子，唐筱蓂的政治生涯也在最近中国统一后蒸蒸日上。他是东京帝国大学的经济学生，与他父亲在中国成长的环境截然不同。但唐继尧仍然努力向自己的这位继承着灌输着仁义道德。在唐筱蓂年少时，唐继尧就带他去目睹了昆明的穷人挣扎与肮脏与贫苦中的景象。唐继尧告诫儿子要回报社会，将自己的胜利用于正途。\n\n如今中华归于一统，唐筱蓂在民治党中的地位也节节上升。为确保唐家在全国政治中始终占有一席之地，顾问们建议唐继尧可以在由中国青年党主导的军队中出任指挥官。此举既可以遏制青年党在更大的中国政坛中攫取影响力，又可以确保军队行伍中的态度友好。\n\n另一个方案则是让唐筱蓂运用其现有的政治人脉与经验，参与到政权运作中去。如此，他就可以充当重要的调解人与政治家，在唐继尧去世后也能维护其利益。\n\n还有一个选择，就是让唐筱蓂直接加入滇系的全国官僚系统中。他有着经济学的背景，出任交通部或财政部的职务再合适不过，这也可以确保国家机器的各个齿轮平稳运转，以此杜绝腐败。"
 YUN.endgame.390.a: "子承父业，做个军官！"
 YUN.endgame.390.b: "政治比较适合他。"
 YUN.endgame.390.c: "要想列车准点的话，我们刚好缺个人才。"
 YUN.endgame.391.t: "联省政府的佛教"
 YUN.endgame.391.d: "唐继尧和许多中国人一样，是一位虔诚的佛教徒。在官方层面上，唐继尧致力于调和联省民主运动与大乘佛教所倡导的教义理念。唐继尧还创建了一个佛教领袖和信徒圈子，圈内成员在新政府中的地位正在不断提升，其中最突出当属章太炎提倡的密宗“业种”学说，这一学说摒弃了纯粹的有神论和对佛陀的崇拜，转而推崇马鸣等高僧的教诲。\n\n习自强是纳西族人（来自喜马拉雅山区的少数民族），曾在云南陆军讲武堂学习。他是一位虔诚的佛教徒，也是云南佛教协会成员。习自强与唐继尧关系密切，经常在军事和政治事务中为唐继尧提供意见。\n\n虚云是一位福建籍禅宗弟子，毕生致力于探索正法，并在观世音菩萨的指导下寻求证悟。虚云是一位著作颇丰的僧人，因其诗歌作品和苦行生活而备受尊崇；他的讲经说法深得唐继尧喜爱。虚云在祖母的葬礼上接触到佛经后，便放弃了父亲的道教信仰，皈依了佛教。14岁时，他便宣称自己已经抛弃了一切物质享受，追求苦行僧的生活。\n\n虚云游历四方，从家乡福建远赴四川和西藏，拜谒达赖喇嘛和班禅喇嘛的住所。他甚至远赴印度、锡兰和缅甸，中年时才返回中国。虚云是一位无垢光佛，其信徒遍布泰国、马来亚、越南和缅甸。他还曾举办过名为“护国平灾大悲法会”的集会，为联省运动争取支持。"
 YUN.endgame.391.a: "时值动乱世，当守一切法。"
 YUN.endgame.420.t: "唐家花园与云南会议"
 YUN.endgame.420.d: "秀才出身的唐继尧酷爱园林艺术文化，统治云南期间，他聘请中国和法国建筑师精心建造了唐家花园，成了西南有名的私家花园，也是云南省城昆明最大的私家园林。“唐家花园”中有一栋中西合璧木结构两层转角楼，称“红楼”。楼前花园有莲池、拱桥、雕花石栏、喷水假山及中式六角亭、四方亭和戏台等。楼后梅园则有千树梅花。\n\n唐家花园内花树扶疏，盆花多种，四时不谢。但唐继尧仅偶尔前来小住，设席待客，也在园内。唐继尧认为偌大园林，经常闲置，书画古玩，庋藏一隅，同好无缘得以鉴赏，未免可惜。于是他于1923年成立东陆图书馆于园内，馆内书物许人参观，概不征费，但以星期三、六及星期日为限。\n\n东陆图书馆与云南大学同在一支山脉上，历届云南大学师生，都不时光顾。唐家花园成为了西南地区的文化中心。近年来，唐继尧频频离开昆明，他的儿子唐筱蓂则经常在唐家花园里招待客人，讨论政事。沈从文、罗隆基、闻一多、梁实秋、寸树声、周新民、潘大逵、姜亮夫等名人都曾应唐筱蓂的邀请拜访唐家花园。\n\n如今的唐筱蓂已成为共和国总执政，但在闲暇之余，他还是常常前往东陆图书馆和唐家花园。对于一些人而言，此处不过是个花园而已，但对于唐筱蓂而言，这个花园在某种程度上让他想起了自己的父亲，想起他那兼收并蓄的遗产，他为之奋斗终身的目标，以及他为人民奉献的意愿。"
 YUN.endgame.420.a: "唐继尧在天之灵会感到骄傲的。"
 YUN.endgame.420.b: "背父求荣，不肖子孙！"
 YUN.endgame.421.t: "宪政研究会"
 YUN.endgame.421.d: "云南在联省派改革的推动下迅速发展成为民主堡垒后，这片土地吸纳了从市井话题到政治辩论再到文学思辨的各类思潮交锋。若论谁才是这片土地上的运动领袖，非唐继尧的独子唐筱蓂莫属。\n\n唐筱蓂与周新民、潘大逵、蒋良辅、曾昭抡等人成立了宪政研究会，经常举行报告会、座谈会，讨论国内宪政运动的形式，介绍国外推行宪政的情况，发表文告，呼吁民主，扩大中国民主运动的影响。\n\n或许是为了弥合民治党与民盟之间的分歧，宪政研究会的标志性文章《我们在实施宪政前的要求》融合了两党的政策主张，提出在宪政实施前，必须首先给予人民言论和人身自由，承认各党派的合法地位，并建立联合政府。\n\n为了扩大自身影响力，唐筱蓂通过宪政研究会结识了李公朴、张天放、杨春洲和楚图南等人，与民盟成员建立了有效的联系。凭借着唐继尧之子的身份，以及与父亲盟友陈炯明等人相比的“世子”风度，唐筱蓂俨然成为了一位颇受民众喜爱的英雄人物。\n\n唐筱蓂团结了共和大同盟全体成员，并与所有民盟人士保持着良好关系，此外还与中国青年党和中国宪政党有着密切联系。唐筱蓂实现了看似不可能之事——将全国所有民主力量团结在他的旗帜之下。"
 YUN.endgame.421.a: "若无仁心，则宪政派阵线难以为继。"
 YUN.endgame.421.b: "他会将权柄拱手让给民新社和致公党！"
 YUN.endgame.422.t: "危楼之巅"
 YUN.endgame.422.d: "中国政坛一直以来就像一座摇摇欲坠的纸牌屋，由幕后交易与圆滑交涉精心构筑，即便是北洋时期最精于权谋的政客，也可能因为一步走错，或者一次不经意的举动而轰然垮台，段祺瑞、张作霖、曹锟的野心结局便是明证。\n\n然而，如今的联省政府并非北洋政府——这里没有积重难返的贪污腐败、根深蒂固的恩庇关系、尔虞我诈的权谋交易，也没有数十年来的政治包袱。这是一个焕然一新、生机勃勃的共和国，它建立在先烈鲜血、地方自由和国家民主的理想之上。然而，新生的共和国里仍然保留着许多老面孔——直系、奉系、宪政派、政学系、中国青年党以及其他北洋派系的追随者，他们在共和大同盟与中国民主同盟等新兴势力的政治角斗场中顽强生存着。\n\n但这对唐继尧长子而言绝非难事。唐筱蓂以他独特的方式，在政治角力场中成功构筑了坚实的人脉网络。这些联系来自他在共盟内部的小圈子，包括民治党、滇系、民新社还有致公党。此外，唐筱蓂与罗隆基、闻一多、李公朴等人的私人关系，也让他得以在民盟内部的新月社和全救会中建立影响力。\n\n至于政坛中的独立派系？努力会、政学系，甚至是商人团体，以及梁启超系的中国青年党和中国宪政党，唐筱蓂与这些团体也都保持着密切的联系。\n\n自身统治稳固后，唐筱蓂仍有机会利用自己的人脉，在民国的利益集团之间发挥平衡作用，并为建设中国的新未来争取更多人的支持。"
 YUN.endgame.422.a: "让我们依靠梁启超系的帮助。"
 YUN.endgame.422.b: "岂能背弃门生故旧。"
 YUN.endgame.422.c: "党争犹如病毒，启用独立人士。"
 YUN.endgame.460.t: "科学、人性、极少数天才"
 YUN.endgame.460.d: "虽然新月社最初只是一群在茶余饭后分享诗歌和政治观点的同仁，但他们在草创之初便已显露出卓尔不群的非凡品质。当世人汲汲于现代化浪潮之际，他们始终秉持着对人性的坚定信念。工业化虽是大势所趋，但它却割裂了生计与自然之间的联系。效率至上、追名逐利的机械法则，正侵蚀着构筑人类情谊的“真同情”。若要重拾本真的“生活乐趣”，就需要消除基督教青年会和马克思主义者所宣扬的“对成功和效率的迷信”。与儒家一样，新月社将人类的责任视为道德问题，并号召“极少数天才”挺身而出。\n\n新月社所推崇的“极少数天才”并非某个特定的阶级或政党，而是众多追求纯粹知识的个体。这些人应当成为全球运动的开路先锋，承认每个人都具备独立道德人格——这与传统儒家中“人”的概念截然不同。正如徐志摩在拜读弗里德里希·尼采和罗曼·罗兰的著作后所感叹的那样：“论精神我主张贵族主义，谈物质我主张平民主义。”\n\n罗隆基肩负着构建新型民主的使命，这种民主制度将代议制政府与专业官僚体系相结合。如果没有自由选举和公开廉洁的公务员制度，人民就无法信任政府。罗隆基曾哀叹中国人才匮乏，国家精英出国留学却常常拒绝回国，而那些回国的精英又在体制内饱受裙带关系的困扰。通过新月社倡导的“专家政治”，公众可以通过政党和地方组织参与政治，而职业机构和专业协会的专家将被赋予权力，利用他们的专业知识来管理国家。"
 YUN.endgame.460.a: "将中国从专制暴政和人才流失的“民族自杀”中拯救出来。"
 YUN.endgame.461.t: "教育与社会"
 YUN.endgame.461.d: "寸树声虽然贵为共和国总执政，却经常离开首都，回到家乡。他骨子里始终是一位教育家，经常以教育家的身份前往家乡各所学校任教，尤其是在益群中学任教。或许，他更适合当个教授或院长，而非政治家，更遑论背井离乡担任国家领袖。尽管如此，寸树声依然认为自己可以成为一名真正的政治家。\n\n作为一名热忱的爱国者，寸树声已经认识到，中国问题的根源不在于政治改革，不在于革命，也不在于虚张声势的外交野心或彻底的社会改造，而在于教育。唯有教育，才是中国问题的根源。倘若人民不识字、不会写，又如何指望他们参与公民民主？又如何能形成自己的思想与观念？又如何能将国家推向新高度？\n\n当寸树声就任总执政时，国内最顶尖的人才甚至比不上美国大学的平均水平。同样，当寸树声在和顺中心小学任校长时，当地多数孩童失学，30岁以下成人多为文盲。再看如今之和顺乡！多数儿童都已入学，多数成人亦能读写。\n\n因此，寸树声正是以和顺乡为样板，致力于消除阻碍中国实现真正繁荣的最大弊端。若要开启新时代，人民只需专注于国家经济建设以及文化、教育和科学事业的发展。寸树声始终勤勉工作、坚持不懈，如今又成为了一个满目疮痍国家的总执政，但毫无疑问的是，在他任期结束时，他将为人民留下一个崭新的理想国。"
 YUN.endgame.461.a: "星星之火，可以燎原，将给全国以光明的启示。"
 YUN.endgame.462.t: "未来的继承人"
 YUN.endgame.462.d: "身为共和国总执政，可谓任重而道远。唐筱蓂对军阀时代之前的历史没有多少记忆，他只是众多肩负前人遗产的新生代之一。虽然唐筱蓂的父亲是军阀时代最重要的人物之一，但这对他来说意味着什么？他的人生际遇是否因此更加优渥？他是否从中获益？或许有，或许没有。\n\n然而，唐筱蓂的父亲为追求一个自由、民主、联省制的共和国献出了生命。唐继尧骨子里是一位学者，现实中却是为联省主义终生奋斗的战士，并为此付出了巨大的代价。但唐继尧的使命并没有随他而逝，他的盟友和朋友，以及最重要的——他的长子和骨肉，都在守护着他的梦想。正是这份信念，让国家团结起来，最终实现了唐继尧和无数人为之抛头颅洒热血的梦想。\n\n守护梦想不灭——这便是唐筱蓂的志向所在，但这并不意味着他不够真诚，绝非如此。在当今这般残酷的世道里，人们无不贪图财富、渴求权柄，真正的政治家屈指可数，谋取私利的权力掮客比比皆是。然而，唐筱蓂却有着坚定的信念，他是基层民众的组织者，也是随时准备出征的战士。\n\n唐筱蓂从父亲手中接过了代表整个辛亥革命时代的火炬——革命先烈们的民主中国梦想并没有随之湮灭，只要唐筱蓂，或是任何受老一辈改革者和革命者影响之人尚存于世，他们的牺牲便没有白费。虽然前途未卜、希望渺茫，但即便是理想主义者的最后一搏，我们也必须为之拼尽全力。"
 YUN.endgame.462.a: "我们都是黑暗中闪耀的光芒。"
 YUN.endgame.463.t: "民治党与封建联省主义"
 YUN.endgame.463.d: "章太炎一生中的大部分时间都在探讨民主的核心问题：如何在保障个人自由的同时，赋予国家足够的权力，使其能够为公民提供公共服务。长期以来，这个问题一直困扰着章太炎，并驱使他不断探索和发展他的思想。受到佛教“空性”理念的启发，章太炎将民族国家的建立视为一种纯粹的实用手段。\n\n事实上，不仅民族国家，自由主义也是一种工具性手段，所有政治手段都是为了在个人自由、领袖权威和国家权力之间达成平衡。联省主义最终的目标，正是将个体、领袖及国家所承担的责任最大化。\n\n虽然章太炎已驾鹤西去，但他最伟大的追随者仍在续写篇章。在唐继尧总执政身上，章太炎所追求的那种不受约束、永不妥协的封建精神，已被冷酷无情的现实淬炼得更为坚韧。唐继尧是革命英雄、儒将、政治家，也是新共和国的缔造者。唐继尧虽然成就斐然，但他所做的一切都是为了服务人民、报效国家。在他看来，联省主义既是建设国家的工程，也是佛教仪轨的化身。\n\n唐继尧致力于改善民生，追求宪政、稳定、反军国主义的共和国，但他的立场却始终摇摆不定。为求得长治久安，他自然游走于专制与革命之间。他是一位民族主义者，却对民粹主义深感恐惧，并因此树敌众多，但总而言之，他的真实立场究竟如何？\n\n民主制度的一切美好与丑陋，都已展现在大众面前。作为表率，唐继尧并未给民众带来北洋专制的新时代，而是实现了他与章太炎长久追寻的真正民主理想。归根结底，唐继尧心中始终只有一个决定性考量：“如何才能让贫苦大众获得幸福？”"
 YUN.endgame.463.a: "“我非我之我也，国家之我也。\n我善，国家之利，我恶，国家之害。”"
 YUN.endgame.464.t: "父辈的罪孽"
 YUN.endgame.464.d: "我们血脉中那不可饶恕的沉重宿命，注定要让子孙后代背负祖辈的罪业。唐筱蓂对此深有体会——他的父亲魅力非凡，备受敬仰，所到之处人们总将他与父亲相提并论。但正是那份民主事业，那份联省主义事业，让他的父亲为之奋斗，乃至为之牺牲。也正是为了这份事业，唐筱蓂才被推上了总执政之位。\n\n诚然，中国革命通往理想彼岸的道路漫长坎坷，从来不是坦途。奔腾的理想主义在辛亥革命的混沌烈焰中迸发，吞噬了冷漠腐朽的清王朝，并在灰烬中建立了北洋政府。然而，即便只是提及北洋之名，便会让人感到不适和厌恶，真是令人扼腕叹息——可惜如此多的人为了一个失败的理想而牺牲，可惜如此多的人在梦想成真之前，还未得到慰藉就已死去。\n\n但有一种燃料，点燃了全世界理想主义者和革命者的火焰——那便是希望，对美好未来的希望，对美好生活的希望，不仅为了他们自己，更是为了他们的后代。为了缅怀父亲，唐筱蓂将接过先辈的旗帜，但这一次，卑微的农民、工人、政客和士兵都将与他同行。\n\n辛亥革命已经耗费了整整一代人的光阴，至今仍未竟全功。正因如此，我们不该哀叹先烈的牺牲和先辈的罪过，总会有新时代里的新一代人高举革命、民主和理想的火炬。无论是总执政官邸里的唐筱蓂，还是议会里的政客、工厂里的工人、田野里的农民、战壕里的士兵，举国上下都在为了更美好的未来而不懈努力，哪怕还要为之付出无数代价，承受无数痛苦，我们都在所不惜。"
 YUN.endgame.464.a: "往者不可谏，来者犹可追。"
 YUN.endgame.465.t: "胜利者的共和国"
 YUN.endgame.465.d: "“天下有道则见，天下无道则隐，圣贤也；天下有道则隐，天下无道则见者，英雄也。”唐继尧静夜独坐，翻阅少年时的日记，他四十年前求学时写下的这句箴言至今仍历历在目。他毕生所为，岂不正是一展儒将英雄之风采？\n\n整顿内政一直是国家首要任务，但庸碌之辈却难以胜任。中国人面对外敌入侵时的麻木不仁，最终演变为无能为力的挣扎，民众要么被革命煽动家裹挟，成为煽动者实现自我“救赎”的工具；要么彻底麻木，冷眼旁观。正是这种无处不在的虚无氛围，使得军阀得以长期统治。手足同胞为了权欲私利争斗了太久，以至于世人早已忘却了兄弟情谊的真正含义。\n\n蔡锷曾在其著作中探讨过如何建立共同的民族国家，并让每个人都为了民族国家福祉承担责任，并据此痛斥袁世凯倒行逆施，但他又会如何看待唐继尧，这位他曾讥讽过的“明公”？唐继尧既没有追随蔡锷的路线，也没有追随他的另一位导师章太炎的理想。相反，他开创了一条独属于自己的道路。\n\n诚然，唐继尧并未如他人所愿，推行自由民主或联省制度——这显然是由于民众尚未做好准备，但他并没有给中国人民套上新的专制枷锁，国家也终究实现了强盛统一。当年事已高的唐继尧在总执政官邸里闲思冥想时，“英雄”唐继尧似乎已经隐退，转而以“圣贤”之姿出山引领国家迈向复兴之路。"
 YUN.endgame.465.a: "谋士多勇略，儒将亦良才。"
 YUN.endgame.600.t: "完成未竟之业"
 YUN.endgame.600.d: "历经多年战乱，神州大地终于重归统一，这次我们似乎将迎来永久和平。历史仿佛再次重演——一支以其发源省份为名的军阀集团，最终实现了国家统一的宏愿。\n\n云南虽长期在国家政治中扮演关键角色，但其真实抱负却屡屡受挫——或因各省联合反制而折戟，或因过度扩张而不堪重负。\n\n总之，滇系当下的努力不禁让人回想起1915年蔡锷、李烈钧和唐继尧的峥嵘岁月。尽管当时由于蔡锷逝世和运动失败，滇系的梦想似乎遥不可及，但云南如今最终完成数十载前未竟之业，真正确立自己作为东大陆主人的地位，或许正是当初梦想的自然结果。\n\n然而，云南的“热月”立场却并未受到北洋国家秩序的善意接纳，北洋当局视这群喧闹的新贵为颠覆其根基、篡夺其权位的威胁。同样，民主派和革命派在现任政府中再次陷入孤立无援的境地，尽管政府的施政风格较为温和，但政府本身仍然谨慎保守。\n\n进退维谷的滇系当局试图将自己定位为五族共和的传承者和南方革命民粹主义的代表，但却收效甚微，人民所需要的是真实彻底的变革，而非旧秩序的复辟。"
 YUN.endgame.600.a: "我们必须从头开始建设国家。"
 YUN.endgame.601.t: "经济管理不善的后果"
 YUN.endgame.601.d: "毋庸置疑，中国的经济状况无论在国内还是国际上都远不尽如人意。从连年不断的内战，到随后的国家统一战争，再到民族存亡之战，旷日持久的战事耗尽了全国所有财政储备，同时也摧毁了基础设施、工厂、住宅以及民族国家的方方面面。\n\n投资者要么已经逃离，要么正在考虑逃离，军阀时代和战争时期积累的债务如今也到了偿还期限，更不用说直系军阀短暂统一带来的相对和平稳定崩塌后，多年经济增长付之东流。\n\n此外，由于未来前景的不确定性日益加深，导致人们对新政府推动实质性进展的信心不足。与此同时，贪污腐败、财产纠纷、军方滥用职权等一众不良行为也在不断增多。\n\n然而，目前最突出的经济问题在于规模庞大的军队——强制征兵与战时动员机制致使武装力量持续扩张。除此之外，由于政府官僚机构稚嫩低效，税收等常见的政府收入来源也未能达到国家预期标准。"
 YUN.endgame.601.a: "沉溺过往只会让我们止步不前。"
 YUN.endgame.601.b: "团结与力量终有一日会降临。"
 YUN.endgame.602.t: "入虎穴，得虎子"
 YUN.endgame.602.d: "秉持孤立主义的滇系军阀被推入了一个全然陌生的境地，全然力不从心。虽然滇系先前愿意（至少是克制地）帮助唐继尧实现国家统一的野心，却未曾想到，如今自己竟然成了京城里的掌权者，需要指派官员处理各种国家政治问题，并最终找到解决方案。\n\n然而，这种国家统一却打破了原有秩序。原本南北割裂的政治传统已深深植根于各地政客之中，这在军阀混战时期的历次南北议和中表现得尤为明显。即便在省级层面，政治运作与治理方式也无不带有鲜明的地域烙印。\n\n这些跻身内阁的军阀虽身居高位，但在西南一隅之外却鲜有人知。身处错综复杂的政局之中，先前的武力和政变手段几乎无法奏效，然而滇系却没有任何推行政策的王牌，只能粗暴地使用他们所欠缺的政治技巧。\n\n即便滇系拥有丰富的省级政治和议会经验，但空前庞大的新职责要求他们不仅要应对国会和各方态度，还要对付曾经被他们压制的各派势力——包括举枪对准大总统宝座的革命者和激进分子、利用民主呼声的民主人士、要求自治的省级军阀，以及旨在维护既得利益的守旧势力。\n\n由于缺乏统一纲领、官僚腐败横行、社会动荡失序，导致落实治国举措举步维艰。倘若新生民国继续贻误时机，未能及时解决中国社会问题的根源，则必将埋下内战的祸根。"
 YUN.endgame.602.a: "让我们与知识分子和学者达成一致。"
 YUN.endgame.602.b: "继续推行霸道，无须更改。"
 YUN.endgame.603.t: "中国的悬顶之剑"
 YUN.endgame.603.d: "中国正处于极其脆弱的境地，20世纪以来的一系列苦难让国家陷入了最低谷。军方对此心知肚明，遂滥用职权，同时向军人大总统发出警告，旨在确保其对军方的忠诚，并保证军队享有的权利、自治和保障。\n\n诚然，此般局势已难以为继，但也同样有利可图。经济形势一片混乱，政坛迅速陷入动荡，滇系军阀更是爆发内讧，新民国内部日渐脆弱与不稳的态势，早已成为公开的秘密。\n\n在乡村地区，抵抗运动正不断形成并蔓延扩大，土匪和革命者似乎同时发起行动，对政府和其他所谓的暴君施行“正义”。作为回应，军队公然在戒严地区滥用职权，肆意扣押士绅、商贾及农民，还强行征收罚金与苛捐杂税。与此同时，首都频频收到急报——大量小军阀已经割据一方，并对中央政令置若罔闻。\n\n新民国所谓“悬顶之剑”的根本成因之一，在于过度膨胀的军队规模以及层出不穷的低效问题。长期沉湎于过往荣光与积累财富各路军阀，正强烈反对任何裁军或整肃军纪的主张。而对普通士兵而言，他们恐惧裁军并非因为上级权势受损，而是因为在经济不景气的情况下，他们既无一技之长，也无专业知识，复员便等同于失业。"
 YUN.endgame.603.a: "军方当恪守边界。"
 YUN.endgame.603.b: "严厉提醒我们“亲爱的”诸位同仁其立下的誓言。"
 YUN.endgame.604.t: "可乘之机"
 YUN.endgame.604.d.base: "护国联盟大获全胜，成功从广州进军北京，并击败了所有对手。他们的表现远超前辈——虽然蔡锷等人曾挫败袁世凯的称帝企图，但最终却陷入内斗，未能在护国战争中彻底摧毁袁世凯的北洋军。\n\n新护国联盟的胜利让[YUN.GetLeader]在全国声名鹊起，得以宣告自己成为统一民国的大总统。然而，统一并不一定意味着永久的和平，尤其是在秉持孤立主义和地方主义的[YUN.GetLeader]被过度夸大抬高的情况下。统一带来的宏大期许绝非现有治理措施所能应对，[YUN.Capital.GetCapitalVictoryPointName]当局面临着一系列经济、军事和政治挑战，使得新政权极易受到挑战者冲击。\n\n在加强中央集权、镇压各路军阀的呼声中，各地大小领导人都在忙于为未来的内战做准备。其中野心勃勃者觊觎大总统之位，实力较弱者则以抵制裁军为手段负隅顽抗——甚至连云南省也参与了反抗行动。"
 YUN.endgame.604.d.shxyan: "$YUN.endgame.604.d.base$\n\n阎锡山坐镇山西数十载，今终得挥师东进之机，以夺取北洋政府的衣钵。作为仅存的北洋军阀之一，许多人都指望阎锡山能够维系北方主导地位，若一切进展顺利，他们的愿望未必不能成真。"
 YUN.endgame.604.d.shxgmj: "$YUN.endgame.604.d.base$\n\n对于冯玉祥来说，背叛旧主并非什么陌生之事。虽然冯玉祥正处于一个特殊的位置，他既能利用南方的民粹主义情绪，又能压制北方北洋人士的恐惧，但国民军内部仍不乏妥协之声——若能从体制内部伺机夺取大位，又何须再行险招另起炉灶？"
 YUN.endgame.604.d.generic: "$YUN.endgame.604.d.base$\n\n局势正变得对[ROOT.GetLeader]愈发不利，随着时间的推移，中央政府将不可避免地日益强大。值此关键时刻，粉碎我们对手的时机已经成熟。"
 YUN.endgame.604.a: "兵贵神速，时不我待！"
 YUN.endgame.604.b: "韬光养晦，权且忍让。"
 YUN.endgame.605.t: "[FROM.GetLeader]宣布“独立”"
 YUN.endgame.605.d.intro: "统一中国的壮举固然令人欢欣鼓舞，但帷幕之后实则暗流汹涌。这场胜利将[YUN.GetLeader]从籍籍无名之辈直接推向举国瞩目的位置，势必招致昔日盟友的妒忌、怨恨乃至猜疑。与此同时，随之而来的宏大期许亦骤然压至大总统肩头，他的政府不仅要应对各种军事、经济和政治挑战，还要努力满足各方期待。\n\n面对国家权力必将收归中央的局势，[FROM.GetLeader]及其[FROM.GetName]断然拒绝从盟友沦为臣属。他们公开声讨一年前亲手扶植的大总统，并宣布要再开战端以捍卫国家。此举虽然看似孤注一掷，却正值[YUN.Capital.GetCapitalVictoryPointName]当局最脆弱的时刻——这个深陷统一后治理困境的政府，正疲于应对各地蜂起的难题。"
 YUN.endgame.605.d.shxgmj: "$YUN.endgame.605.d.intro$\n\n对于冯玉祥来说，这不过是他谋求更多权势的野心之路上的又一次背叛罢了，他麾下的国民军虽然反复无常，却相当坚韧顽强。如今，凭借勾连南北的势力网络，冯玉祥的目标看来是从滇系手中夺取胜利果实。"
 YUN.endgame.605.d.shxyan: "$YUN.endgame.605.d.intro$\n\n对于阎锡山来说，此乃其狼子野心的真实写照——护国联盟已经消灭了他的北方对手，北洋人士则担心被南方势力取代，这一切都让他获益匪浅。现在，唯一的问题在于，阎锡山能否通过战场上的胜利来实现他的野心……"
 YUN.endgame.605.d.generic: "$YUN.endgame.605.d.intro$\n\n目前尚不清楚是否会有其他省份叛乱，但至少目前主动权掌握在[FROM.Capital.GetCapitalVictoryPointName]手中。至于这种势头能持续多久，则需另当别论。"
 YUN.endgame.605.a: "滇军战无不胜！"
 YUN.endgame.605.b: "再临深渊。"
 YUN.endgame.630.t: "护国内阁"
 YUN.endgame.630.d: "龙云在如此短暂的时间内取得了如此之大的成就——他曾经只是边陲军阀的下属，继而成为督理，后来又觊觎中央，如今更是一跃成为全中国无可争议的大总统。然而，这份新获得的权力也伴随着沉重的责任，以至于龙云独木难支。\n\n若想组建战后重建所需的政府，首先要任命一位体恤民情的总理领导内阁。虽然旧北洋政府和广州政府成员均已被迫归顺，但要从地方派系过渡为全国政权，维持合法性仍需依靠外交智慧和内部协调。\n\n李氏兄弟是龙云原配夫人的亲属，对维护权力至关重要。兄长李培天曾担任龙云派驻各方政府的首席外交官，拥有丰富的行政经验。虽然李培天似乎不太受欢迎，但他仍是与北京广州两地政治建制派的重要谈判代表，并曾主持与云南民主人士的会谈。将李培天提拔为总理（同时将他的胞弟李培炎也提拔为内阁高官）将使现行体制正规化，但也会坐实人们的猜疑——龙云计划效仿蔡锷式的独裁统治。\n\n另一种选择是任命一位北洋内部人士，最好是已受滇系影响之人。唐继尧曾在其民治党内着力培植此类人士，其中以汪氏兄弟最为突出。汪东出身名门望族，是章太炎在浙江时的得意门生，他的胞弟汪荣宝曾担任北洋政府立法委员、驻外大使和宪法起草人。选择汪东既能体现对原有政治体制的部分尊重，亦可彰显推行宪政的有限承诺。"
 YUN.endgame.630.a: "李氏兄弟是我们的首选。"
 YUN.endgame.630.a_tt: "§Y§g威权民主主义§!和§P家长制独裁§!的党派支持率将会互换。§!"
 YUN.endgame.630.b: "汪氏兄弟更加不可或缺。"
 YUN.endgame.631.t: "数学家熊庆来"
 YUN.endgame.631.d: "熊庆来1893年出生于云南，父亲是官府官员。尽管当时云南排外情绪高涨，但他还是于1911年在云南高等学堂就读期间开始学习英语和法语。1913年，他凭借省府奖学金前往比利时学习矿业，但由于世界大战爆发，他的学业被迫中断。\n\n于是，熊庆来动身前往巴黎，在巴黎圣路易中学完成了本科学业，之后进入格勒诺布尔大学继续深造，学习数学、分析力学、物理学和天文学。1920年，他获得了理科硕士学位，但在革命席卷法国后，他被紧急遣送回国。\n\n回国后，熊庆来迁至南京，创建了国立东南大学算学系，并撰写了涵盖几何至微积分等众多数学领域的教科书，成为将现代数学引入中国的先驱。在陕西西北大学短暂任职（因军阀混战而中断）后，他进入清华大学任教，并主持创建了清华算学系。\n\n三十年代，熊庆来重返欧洲，凭借论文《关于无穷级整函数与亚纯函数》赢得了国际声誉。他还代表中国参加了在苏黎世举行的国际数学家大会，是唯一出席的中国代表。回国后，他前往昆明担任云南大学校长，不仅拓展了学校的规模，还继续在世界舞台上代表祖国，以展现中国日益增强的学术实力。"
 YUN.endgame.631.a: "云南这片土地，竟孕育出如此旷世奇才！"
 YUN.endgame.632.t: "家族事务"
 YUN.endgame.632.d: "自从1915年龙云与李佩莲成婚以来，李家便始终对龙云保有重要影响力。李佩莲是名医李灿亭后代，以才艺与美貌闻名。二人相识的具体经过虽已成为当地宣传和民间传说的老生常谈，但可以肯定的是，李佩莲作为“现代”中国女性——受过良好教育、“西化”且与本土知识分子交往密切，她不仅是龙云深得信任的知己，更在动员妇女支持丈夫事业方面成效卓著。1933年，李佩莲因病去世，年仅三十三岁。\n\n龙云与李佩莲的子女中最重要的当属四子龙绳文，现任低级参谋军官。龙云另有多名子女出自其他婚姻，多数任职于军界、政界或商界，其中以龙绳曾最为瞩目，他曾是一名负责监督军事建设的高级参谋，同时也是重要的艺术赞助人。\n\n李佩莲虽已去世，但她的兄长李培天和李培炎在龙云政府中仍然极具影响力。长兄李培天通常作为龙云的全权代表周旋于外部政权与地方势力之间，同时执掌县官培训、粮政署及财政部门。李培炎比兄长小一岁，曾是一名教育家，后来成为省参议员，因遭腐败指控而被免职。借胞妹联姻之机复出后，李培炎成为龙云的政治代言人，负责构建龙云的恩庇网络、省办银行业务，并涉足水利管理、基建开发乃至蔗糖厂建设等众多经济政治要职。虽然李培炎在这些方面的能力值得怀疑，但他的忠诚度却毋庸置疑。"
 YUN.endgame.632.a: "龙云自诩超然于个人政治之上。"
 YUN.endgame.632.b: "龙云及其家族坐享权力果实。"
 YUN.endgame.660.t: "卢汉叛乱"
 YUN.endgame.660.d: "胡若愚与卢汉之间的最终对决愈演愈烈，这场较量在某种意义上将成为南北阵营的终极决战。两人之间早已不和，而统一战争只是短暂的喘息。由于两人都被视为国家政治的幸运局外人，这无疑加剧了他们在争夺军队和官僚机构控制权时的不确定性。\n\n远离故土的胡若愚试图争取旧北洋建制派的支持。作为新任大总统，他虽拥有更高的国家声望，并能倚仗外国支持维持统治，却也不得不为国家重建的困境承担更大责任（无论公平与否）。与此同时，他试图将自己打造成旧直系军阀的接班人，也继承了直系分裂的政治遗产。\n\n胡若愚的对手卢汉大帅则主要致力于吸收亲戚龙云的昔日盟友加入己方阵营。他还采取广结同盟策略，试图拉拢原广州政府支持者，还煽动地方主义情绪、共和民族主义，甚至国民党式的民粹主义。由于体制上的劣势，卢汉决定先发制人，利用民众对胡若愚涉嫌暗中勾结外国势力、贪污腐败和专制统治的愤怒，试图发动政变。\n\n卢汉趁胡若愚宴请外国贵宾之机，下令包围京城要地，企图逮捕胡若愚及其亲信。但胡若愚深谙唐继尧、龙云覆灭旧事，早已金蝉脱壳，迅即收拢旧部展开反击。及至夜幕降临……"
 YUN.endgame.660.a: "卢汉夺取首都！"
 YUN.endgame.660.b: "卢汉仓皇出逃！"
 YUN.endgame.661.t: "云南特产"
 YUN.endgame.661.d: "在云南众多米线店中，经常可以看到“米线”搭配生肉、蔬菜等配菜单独盒装，这种源自滇南蒙自的特色小吃被称为过桥米线。\n\n关于过桥米线的起源有诸多传说，其中流传最广的版本提及：一位书生在湖心岛苦读，妻子每日送餐。为使高汤在过桥途中保持滚烫，她独创了浮油保温法，并将生鲜食材分开携带，待抵达后再投入热汤中烫熟。这道美食与越南“河粉”存在相似之处，考虑到云南和印度支那接壤，这也就不足为奇了。\n\n这个传说广为流传，据说蒙自地方军阀疏浚南湖的原因之一就是为了还原传说场景。过桥米线是云南最珍贵的文化遗产之一，在全国各地享有盛誉。\n\n普洱茶也是云南当地特产。早在公元10世纪，世代生活在景迈山的布朗族与傣族先民就开始种植和生产普洱茶。传统上，人们会开垦森林下层空间栽种茶树。为了防止病虫害蔓延，人们还会种植分区轮作林，并在海拔较低的地区种植农作物和蔬菜。"
 YUN.endgame.661.a: "真不错。"
 YUN.endgame.662.t: "新总理"
 YUN.endgame.662.d: "当胡若愚与卢汉于台前冲突之际，新任总理周钟岳却在幕后默默耕耘。周钟岳是云南资深白族政治家，曾留学日本早稻田大学，后于1907年回国从事教育工作。他曾参与领导抗议清朝签订的不平等条约，该条约授予英法两国在云南的采矿权。1910年片马事变后，他作为抗议外国干涉的代表团成员，被云南省府派往北京。\n\n辛亥革命后，周钟岳被蔡锷任命为都督府秘书长，此后数年在北洋政府中担任教育、经济和政治职务。蔡锷举义反袁时，他留在北京掩护蔡锷出逃，后来被迫流亡日本，因此错过了护国战争。\n\n1916年蔡锷去世后，周钟岳仍受唐继尧重用，并出任众多要职，甚至曾短暂代理云南省长。在唐继尧、龙云、胡若愚三人发动的多次政变中，他负责居中斡旋，后来还协助建立了云南通志馆。\n\n至三十年代初，周钟岳已基本隐退，但在云南乱局期间，他再度被派往北京担任代表。凭借在北京建立的人脉以及相对中立的立场，周钟岳得以成为总理的少数合适人选之一。"
 YUN.endgame.662.a: "周钟岳是[ROOT.GetLeader]和立法机构之间的优秀沟通桥梁。"
 YUN.endgame.662.b: "周钟岳是一位值得信赖、沉默寡言的国家公仆——更重要的是，他是大总统的公仆。"
 YUN.endgame.700.t: "龙潭一探"
 YUN.endgame.700.d: "弥合革命与改良之间的鸿沟绝非易事，尤其是在中国这样一个历史悠久的国度。但在滇系内部，龙云却在这一问题上始终特立独行——他的许多亲信和盟友要么加入了国民党，要么加入了同盟会，因此龙云的整个职业生涯实际上都在于革命力量周旋。然而，这位军人大总统的立场与政学系更为接近，而非胡汉民或汪精卫的拥趸。\n\n虽然龙云与国民党并非水火不容，但大总统寻求“革命”道路却不是出于对孙中山理想的坚定信念，而是基于其可衡量、可实践的进步意义。尽管此举远超大总统的惯常立场，但他内心仍坚守着这样的理念：唯有能以革命者的笃定与热忱掌控政府全局之人，方为大总统一职的最佳人选。\n\n表面上，龙云政府正是罗隆基、刘震寰等友人所倡导的“专家政府”，但实际上，占据主导的仍是曾掌控云南地方事务的滇系原班人马。盘根错节的滇系军阀操控着整个国家官僚体系和各个政府部门——军方高层由军人大总统的亲信把持，官僚体系则由李培炎、李培天和周钟岳控制；士绅群体由陆崇仁统领，银行家与实业家则听命于缪云台。\n\n一切皆奉龙云之命，这位“滇龙”不过是将北方人在中央政府中的主导地位，转交给了自己麾下的南方人。龙云重视效率与忠诚，他铁腕的“革命”领导方式虽带来发展实效，但反对者则指出，这导致龙云政权的存续完全依赖于其个人能力支撑。"
 YUN.endgame.700.a: "滇龙长吟。"
 YUN.endgame.701.t: "大总统和他的共和国"
 YUN.endgame.701.d: "历史会如何看待中国的共和实验？成功？失败？还是介于两者之间？辛亥革命彻底推翻了中国几千年的封建帝制，并掀起了一场思想风暴。虽然辛亥革命席卷了神州大地，但随着袁世凯的倒行逆施，中国再度陷入数十年的苦难、贫困和内战。\n\n然而，唯有滇系军阀屹立不倒，勇往直前。滇系反抗袁世凯的专权图谋，最终却导致国家分裂与随后的军阀混战年代，但这绝非愚蠢或错误之举。一切皆成过往，如今滇系军阀再次改变了国家，这一次我们或将迈向团结，而非斗争。\n\n龙云是一名彝族军人，早年便加入滇军，拥有堪称辉煌的职业生涯。这位“滇龙”曾在多支部队的战役中屡建奇功，更是于1927年肩负起维护云南统一的重任。在协助推翻唐继尧之后，他再次挥师南下，及时惩处了那些欺压百姓的暴君。这位军人大总统至少将这样描绘自己——一位百姓心目中的英雄。\n\n虽然大总统始终保持着务实且超然的政治立场，但龙云的内阁总长们至少会粉饰出某种对民主的承诺。如同之前的直系政权一样，龙云在总统府、国会和参议院的日常政务活动，始终被由自由派、保守派及其他民主人士组成的私人幕僚团所环绕。\n\n然而，与大总统最亲近的或许是罗隆基及其新月社，他们就从国家政策到艺术探讨等各种事务向大总统提供建议。在某种程度上，这位“孤勇者”和“滇龙”可以说是志同道合之人，他们将并肩开辟前路、携手同行。"
 YUN.endgame.701.a: "明君总需谋臣辅佐。"
 YUN.endgame.702.t: "新秩序……"
 YUN.endgame.702.d: "自一十年代的蔡锷之后，云南首次在中央政府中拥有了发言权。而这一次，云南占据了主导地位。虽然几乎无人相信胡若愚会尝试统一全国，更没有人认为他能成功——但这位十年前在中国政坛还只是地方小人物的将领，最终却将全中国统一在他的省府治下，他本人也已成为民国大总统。\n\n胡若愚的思想体现了蔡锷理念的现代化演进——他信奉强大、近乎绝对的军事统治，即“军国民主义”。军人应当具有荣誉感和爱国情怀，还需严守纪律并对民族国家尽职尽责——这种“尚武精神”让军人能够明辨国家利益，并为之牺牲一切。\n\n在北京任职期间，蔡锷从未真正在原则上反对任何政党，而是认为国家统一和维护宪法至关重要。作为北洋军阀时代权力斗争的最终胜利者，直系也意识到将文官和知识分子纳入统治机构的重要性，并通过建立和谐社团以及在立法机构中对各党派保持包容（即便双方有时也会冲突），证明了此类手段总体有效。\n\n面对类似的局面，胡若愚及其盟友将领们也任命了一位无党派总理周钟岳，而他们的军政府则在幕后掌握实权。他们吸纳旧直系军阀、和谐社团以及其他势力的进程虽然笨拙且时断时续，但预计将在未来十年内逐步成型。胡若愚试图自封为“大统帅”，将自己抬升到与保定王曹锟和玉帅吴佩孚一样的高度。至于胡若愚能否达到如此高度，一切仍有待观察。"
 YUN.endgame.702.a: "换汤不换药。"
 YUN.endgame.703.t: "从军人到大总统"
 YUN.endgame.703.d: "辛亥革命后的环境，成就了那些胆识过人、雄心勃勃之辈——他们凭借着足够的决心、军事才能、个人魅力、冷酷无情与几分时运，得以青云直上，远超原有阶层。来自偏远省份的少数民族将领卢汉出人意料地笑到了最后，或许正是这个时代无常命运的缩影。\n\n历经征战结盟、密谋煽动乃至背叛上位，卢汉最终登上权力巅峰，作为新任大总统领导着统一的中国。在许多人眼中，他至今仍是谜一般的人物——他是龙云的童年挚友，后来却背叛昔日恩人；他身为民粹主义者，却始终与建制派紧密相连；他虽是地方派，最终却成功统一了整个国家。\n\n或许，了解卢汉的最佳途径便是追溯在他之前的云南领导人。蔡锷在北京任职期间，曾是袁世凯的得力助手。蔡锷行事谨慎，推崇宪政，还曾向梁启超及其各派势力示好，但他也支持近乎专制、军人作派的总统权威，甚至不惜牺牲国会和地方自治。\n\n在发起捍卫共和的倒袁战争后不久，蔡锷便英年早逝。经过短暂的权力斗争后，唐继尧接掌大权，并开始推行联省主义和宪政理念，甚至向文官统治过渡（尽管带有威权主义色彩）。此后的滇系军阀继承了蔡锷和唐继尧的威权主义，并转向了孤立主义和地方主义，但也或多或少保留了唐继尧以文官为中心的统治方式。\n\n作为第四代滇系领袖统领全国后，卢汉的执政方略又将走向何方？民族主义和中央集权似成必然，对云南以及南方人士的偏袒亦难避免。除此之外，卢汉的打算就成了一个谜——但在中国，特立独行的务实领导模式并不新鲜。卢汉可能会呼吁“民主”、进步和宪政，虽然这些口号的诚意和落实程度各不相同——但唯有国家利益高于一切。"
 YUN.endgame.703.a: "枭雄登顶。"
