 ALB_gardes_se_shqiperise_madhe_victory:0 "大阿尔巴尼亚卫队出征"
 ALB_gardes_se_shqiperise_madhe_victory_desc:0 "阿尔巴尼亚，曾经沦为土匪与强盗横行的荒凉之地，早已在漫长的动荡中彻底丧失了自己的灵魂。无论是平庸无聊的专制君主，还是虚伪至极的共和主义谎言，本质上不过是换汤不换药的权力游戏。阿尔巴尼亚真正需要的，是一场彻底砸碎旧秩序的根本性革命，一场能够带领我们从这片荒谬沼泽中脱颖而出的伟大变革。于是，“大阿尔巴尼亚卫队”应运而生！我们从海峡对岸的意大利带来了全新的思想与星火，阿尔巴尼亚摆脱苦难、重获新生的历史时刻终于到来了！"
 ALB_kelmendis_foolishness:0 "凯尔门迪的愚行"
 ALB_kelmendis_foolishness_desc:0 "阿里·凯尔门迪和他的赤匪同伙们正在一步步将这个脆弱的国家推入万劫不复的深渊。他不过是一个病入膏肓的残躯，又凭什么狂妄地声称能带这个濒死的国家走出阴霾？工团主义的狂热思想正在疯狂摧残着阿尔巴尼亚残存的道德与良知；还有恩维尔·霍查，那个神神叨叨、满口教条的共产主义暴徒。我们当前最紧迫的使命就是彻底加速这群赤匪的毁灭进程。只要我们还活着，这群叛国者就休想染指阿尔巴尼亚的哪怕一寸土地！"
 ALB_connect_like_minded_people:0 "联络志同道合者"
 ALB_connect_like_minded_people_desc:0 "在阿尔巴尼亚广袤而庞杂的右翼阵营之中，能与我们志同道合、并肩作战的，唯有国民阵线这群热血之士。我们怀揣着同样的炽热渴望复兴伟大的阿尔巴尼亚民族，誓死收复那些被邪恶的斯拉夫野蛮人和希腊暴徒所强行占领的祖国领土。更重要的是，我们有着共同的信仰，那就是对共和民族主义的无上追求。历史早已证明，腐朽的资产阶级议会救不了阿尔巴尼亚，一个愚昧无能的世袭国王更是无济于事。"
 ALB_fascis_blackshirts:0 "国家安全志愿服务团"
 ALB_fascis_blackshirts_desc:0 "国家安全志愿服务团是我们完全仿照意大利黑衫军建立起的准军事化武装民兵组织。它不仅承担着阿尔巴尼亚的国防安全与内部秩序维持职责，更拥有在必要时刻使用武力镇压一切反对者的权力。我们为其配备了从意大利本土运抵的最先进武器装备。当祖国面临严峻威胁时，他们必须履行誓言，第一个拿起武器冲向战场；而国防军也必须无条件听从服务团的统一指挥与调遣。"
 ALB_call_italian_comrades:0 "呼吁意大利同志"
 ALB_call_italian_comrades_desc:0 "大阿尔巴尼亚卫队在创立之初，便借鉴了意大利民族主义协会与革命行动法西斯的组织架构与理论，并在筹备期得到了来自意大利民族主义协会的加莱亚佐·齐亚诺以及革命行动法西斯的阿切雷·斯塔拉切的鼎力相助。如今，我们已经成功夺取了阿尔巴尼亚的最高权力，是时候向这两位亲密的战友寻求长期的军事与经济援助，以帮助我们迅速重建破败的祖国。作为回报，阿尔巴尼亚将永远坚定地与意大利站在一起。"
 ALB_convene_the_grand_council:0 "召开大委员会"
 ALB_convene_the_grand_council_desc:0 "是时候召开一场全党瞩目的大委员会来彻底决定大阿尔巴尼亚卫队未来的历史命运了。我们的党从来都不是一块铁板，在吸收海峡对岸思潮的过程中，内部逐渐演化出了两股截然不同的阵营：一方是崇尚精英主义与实用主义的“国家派”，他们紧密团结在特菲克·塞利姆·姆博尔贾的身边；另一方则是围绕着特伦齐奥·托奇展开、主张彻底社会变革的“国家革命派”。路线之争已到关头，我们今日必须做出彻底的了断。"
 ALB_rushing_to_the_peak_of_the_nation:0 "独裁官同志"
 ALB_rushing_to_the_peak_of_the_nation_desc:0 "不出所料，特菲克·塞利姆·姆博尔贾同志所率领的“国家派”在关于国家未来的大辩论中赢得了决定性胜利。作为加莱亚佐·齐亚诺的挚友，他吸纳了其精英军团主义与实用主义政治观，并立誓将大阿尔巴尼亚卫队全面改造成能够直接替代传统政府行使最高权力的国家超级机关。如此一来，大阿尔巴尼亚卫队在国家政治生活中的统治地位将再也无人能够摇撼。"
 ALB_all_within_corporat:0 "皆于社团之中"
 ALB_all_within_corporat_desc:0 "资本家、企业管理者必须与最底层的劳动者强行纳入同一个法团工会之中，唯有如此，统治阶层与管理层才能真正倾听劳动者的现实诉求。如果一个工会仅有工人存在，管理者便绝不会耐下心来听取意见，只会将其定性为社会主义暴徒在蓄意挑衅；而工人若脱离实际管理，也无法理解企业的运作困境，只会盲目索要超越现实的福利待遇。因此，我们必须建立上下直接贯通的“垂直工会”，由国家充当绝对权威的调解者与仲裁人。"
 ALB_super_albania_concept:0 "超阿尔巴尼亚概念"
 ALB_super_albania_concept_desc:0 "我们的“大阿尔巴尼亚主义”，与那些目光短浅、仅仅满足于收复科索沃便偃旗息鼓的狭隘领土收复主义有着天壤之别。我们梦寐以求的，是建立一个横跨萨拉热窝至萨洛尼卡、从尼什直抵北伊庇鲁斯的宏伟民族国家。这些地区的许多居民在敌对政府长期的洗脑下，误以为自己是斯拉夫人或希腊人，但他们的血管里流淌的依然是古伊利里亚人的血液。作为伊利里亚的正统继承者，我们有着将这些受压迫的同胞从外邦统治下彻底解放出来神圣义务。"
 ALB_follow_the_fascist_revolution:0 "黑衫暴徒"
 ALB_follow_the_fascist_revolution_desc:0 "不出所料，特伦齐奥·托奇同志所领导的“国家革命派”在关于国家发展路线的大争论中斩获了最终胜利。作为贝尼托·墨索里尼最狂热的追随者之一，特伦齐奥·托奇极度崇拜革命行动法西斯所阐述的圣墓主义理念。在他看来，只有发动一场自下而上的民粹主义革命才能真正拯救衰败的阿尔巴尼亚。托奇决心将大阿尔巴尼亚卫队锻造成一支极具狂热宗教色彩与彻底革命精神的钢铁纪律部队，唯有维持队伍绝对的纯洁性，才能确保伟大革命的顺利进行。"
 ALB_take_inspiration_from_ani:0 "借鉴民族主义协会"
 ALB_take_inspiration_from_ani_desc:0 "意大利民族主义协会内部蕴藏着大量值得我们深入学习与借鉴的思想。如今，我们可以进一步巩固并加深与意大利民族主义协会的纽带，全面引入他们的理论指导来制定大阿尔巴尼亚卫队的各项政策。借此契机，两国的政治与外交联系将提升至前所未有的高度。当然，我们绝非照本宣科的模仿者，我们必须结合阿尔巴尼亚本国的国情，对这些理论进行本土化改造，使其真正扎根于这片土地。"
 ALB_proletarian_nation:0 "无产者民族概念"
 ALB_proletarian_nation_desc:0 "意大利民族主义协会中最具洞见力的理论，莫过于恩里科·科拉迪尼所提出的“无产阶级民族主义”。在他的构想中，意大利人属于被压迫的无产阶级民族，而德奥英法等老牌强国则是占据垄断地位的资产阶级民族；意大利对外发动的战争，本质上就是无产阶级国家反抗资产阶级霸权的阶级斗争！这一理论完全适用于当下的阿尔巴尼亚。无产阶级民族主义将成为我们最强大的思想武器，凝聚起全民族各阶层的力量，共同抵抗斯拉夫人、德意志人以及奥斯曼土耳其残余势力的压迫！"
 ALB_positivist_experience:0 "实证主义经验与精英循环论"
 ALB_positivist_experience_desc:0 "维尔弗雷多·帕累托的实证主义与“精英循环论”向我们揭示了历史发展的铁律：政权的更迭，归根结底不过是旧有的统治精英被更有活力的新精英所取代的过程。正如我们所做的那样，正因为旧统治者无法带领阿尔巴尼亚走向现代文明，我们才将其推翻。然而，如果我们不能保持自身的革命敏锐度与绝对统治力，未来也必然面临与旧政权同样的覆灭结局。因此，永葆党的思想纯洁与永不熄灭的革命热情，是关乎生死存亡的头等大事。"
 ALB_fascis_republican_ideals:0 "终结专制君主"
 ALB_fascis_republican_ideals_desc:0 "特菲克·塞利姆·姆博尔贾同志早年曾是一位执着的左翼共和主义者。直到奥地利人入侵后，维德王朝在阿尔巴尼亚推行的灾难性腐朽统治，逼迫他不得不背井离乡流亡至伦巴第。在当地，他受到了加莱亚佐·齐亚诺的热情接待，二人结下了深厚友谊。在此期间，姆博尔贾同志深受齐亚诺右翼理论的熏陶，完成了思想上的转变。直到维德王朝土崩瓦解，他才得以重返祖国。我们绝不会再与任何愚蠢的君主玩过家家的玩偶游戏，封建专制统治必须彻底终结，让所有狂妄的王位宣称者永远滚出阿尔巴尼亚。"
 ALB_the_watcher_of_the_strait:0 "海峡之间的守望者"
 ALB_the_watcher_of_the_strait_desc:0 "虽然阿尔巴尼亚与意大利隔着辽阔的亚得里亚海，但这绝不能阻挡两国人民与革命同志之间的密切交流。在未来的战略布局中，阿尔巴尼亚将是意大利向整个巴尔干半岛施加影响力的前沿门户与双眼，协助海峡对岸的盟友向这片土地投射坚实的政治力量与思想光芒。阿尔巴尼亚与意大利的战斗友谊必将世代长存，我们将与意大利的同志们建立起更加不可破裂的紧密联系。"
 ALB_producers_and_fighters:0 "生产者与战斗员"
 ALB_producers_and_fighters_desc:0 "“生产者即是战斗员！”国家安全志愿服务团绝不仅仅是一支单纯用于维护国内稳定与应对对外战争的暴力工具。在没有硝烟的和平闲暇时段，服务团成员必须深入生产一线，作为一名光荣的劳动者直接参与到国家建设中去。长期脱离实际生产会使人的灵魂走向惰性与腐朽，唯有在轰鸣的生产线上辛勤劳作，才能确保我们的革命激情，并让我们时刻与劳动者们保持血肉联系。唯有当侵略者的号角吹响时，他们才会再次化身为冲锋一线的战士。"
 ALB_socialized_economic_struggle:0 "社会化经济斗争"
 ALB_socialized_economic_struggle_desc:0 "在阿尔巴尼亚，一切核心企业的控制权都必须无条件收归社会与国家所有，我们根本懒得去迁就那些贪婪资本家的私利与想法，对于这些资本家，他们要么服从国家安排，作为纯粹的管理人员和传达政府行政指令的执行者继续留任；要么就立刻卷铺盖彻底滚蛋。资产阶级同样必须亲自参与社会生产劳作。如果任由他们凭空坐享其成、寄生在劳动人民身上，那他们便没有任何存在的价值。急需重建的阿尔巴尼亚没有多余的资源去供养一群游手好闲的社会赘瘤。"
 ALB_save_the_ancient_people:0 "拯救古老民族"
 ALB_save_the_ancient_people_desc:0 "伟大的阿尔巴尼亚人乃是远古时期失落的伊利里亚人的直系后裔，我们的民族绝不仅仅局限于如今这狭小的版图，然而在岁月的洗礼下，几乎所有人都快要遗忘了我们无比辉煌的起源。如今，我们必须重新拾起属于伊利里亚人的神圣精神遗产。难道我们真的甘心终日沉溺于阿尔巴尼亚这片弹丸之地吗？不！我们必须时刻保持着我们的野心。古老民族的神圣传承绝不能在我们这一代人手中断绝，终有一天，我们将亲手复兴属于伊利里亚人的无上荣光。"
 ALB_encourage_class_cooperation:0 "鼓励阶级协作"
 ALB_encourage_class_cooperation_desc:0 "马克思主义所主张的阶级斗争理论早已彻底过时，并且严重违背了一个现代国家所追求的繁荣前景。社会主义者是在刻意制造内部分裂、疯狂破坏民族团结。一个健康民族的崛起，离不开社会各个阶层之间的和谐共处与紧密协作。我们需要资产阶级的管理才能与资金运作，同时也需要无产者对资本权力的理性约束，而不是盲目地彻底消灭某一个阶级，那种做法无异于自毁长城、自掘坟墓。"
 ALB_control_military_and_civil_affairs:0 "军事民生，尽在掌握"
 ALB_control_military_and_civil_affairs_desc:0 "大阿尔巴尼亚卫队必须将整个国家的军事工业与民生支柱产业牢牢掌控在自己手里，绝不允许任何私人资本形成行业垄断。我们绝不容许某个金融寡头或几个企业巨头掌控国家的经济命脉，唯有代表全民族利益的国家，才有资格成为唯一的合法垄断者。私人资本家只能作为国家的执行工具听命行事，他们既无资格干预政治事务，也休想在任何领域独揽大权。作为平衡，国家也会给予他们合理的政策补贴与利益保障，以防止资金与人才流失海外。"
 ALB_armed_fanatic_youth:0 "武装青年团"
 ALB_armed_fanatic_youth_desc:0 "年轻一代无疑是阿尔巴尼亚民族中最具狂热激情与热血的群体。他们的蓬勃朝气驱使着他们随时准备为伟大的信仰挺身而出，甚至毅然拿起武器保卫国家的领土安全。在未来的国土收复战争中，青年一代必将成为不可或缺的核心主力。我们必须全面改造教育体系，在学校中灌输保家卫国的信念与领土收复主义思想，让他们心甘情愿地为了大阿尔巴尼亚的浴火重生而献出一切乃至生命。"
 ALB_follow_the_countrys_orders:0 "听从祖国号令"
 ALB_follow_the_countrys_orders_desc:0 "社会的所有阶层与群体都必须无条件听从国家最高意志的号令，资产阶级必须在国家法律与政策的框架下，对广大劳动者实施严密的管理与人道庇护；而劳动阶层也有义务为了祖国的富强而尽心竭力地生产劳作。全社会必须在大阿尔巴尼亚的旗帜下紧密团结为一体，再也无需去接纳那些陈腐过时的思潮。全民族的目标有且仅有一个，那就是在伟大祖国的统一号召下，去战斗、去劳动、去创造辉煌。"
 ALB_contemporary_skanderbeg:0 "斯坎德培行于当下"
 ALB_contemporary_skanderbeg_desc:0 "人人皆渴望成为斯坎德培，但要想成为斯坎德培，必须成为伊斯坎德尔。斯坎德培固然是阿尔巴尼亚历史上永垂不朽的民族英雄，我们对他怀有无比的崇敬，是他教会了阿尔巴尼亚人民如何反抗异族压迫，也是他将最原始的民族主义火种带到了这片土地。但他早年不也曾效忠于奥斯曼帝国、作为伊斯坎德尔而战吗？因此，我们当下的选择并不是叛国，我们不过是为了整个民族未来的命运而做出必要的妥协罢了，做伊斯坎德尔没什么不好的。"
 ALB_the_legacy_of_alberesh:0 "阿尔贝雷什的遗产"
 ALB_the_legacy_of_alberesh_desc:0 "阿尔贝雷什人是当年斯坎德培起义惨遭奥斯曼帝国残酷镇压后的历史产物。在奥斯曼军队疯狂的血洗与屠戮下，他们的先祖背井离乡流亡到了亚平宁半岛。在意大利定居的漫长岁月中，他们将意大利文化与阿尔巴尼亚本土文化熔为一炉，最终孕育出了独特的阿尔贝雷什群体。他们内心深处高度认同阿尔巴尼亚民族主义，是连接我们与意大利进行文化与政治交流的不二桥梁。阿尔贝雷什人正是我们两国之间最坚固的纽带，也是意阿世代友谊历久弥坚的最好见证。"
 ALB_withered_tree_meets_the_new_spring:0 "枯木逢新春"
 ALB_withered_tree_meets_the_new_spring_desc:0 "在大阿尔巴尼亚卫队坚强有力的铁腕统治下，破败不堪的阿尔巴尼亚终于迎来了历史上的第二次繁荣曙光，那些陈腐落后的封建部落制以及毫无建树的共和主义在我们的改造下彻底土崩瓦解。从高耸的山峦到深邃的森林，卫队的足迹遍布祖国的每一寸土地。阿尔巴尼亚的复兴绝不会遗漏任何一个偏远地区，也绝不会允许任何堕落分子或旧时代的封建余孽拖累我们前进的步伐。阿尔巴尼亚这棵几近枯萎的千古老树终于迎来了属于它的盛世寒梅与勃勃生机。"
 
 albsoc.2.b:0 "大阿尔巴尼亚卫队自赤匪的混乱中解救了祖国！"
 albfas.1.t:0 "处决霍查"
 albfas.1.d:0 "在我们所处理过的所有赤色分子中，恩维尔·霍查无疑是最棘手的那一个。说句心里话，他完全称得上是一位不可多得的游击战大师。彼时，他和他的游击队悄然隐匿在阿尔巴尼亚绵延的群山与密林深处。我们那些未经正规训练的安全部队在复杂的荒野里简直就像无头苍蝇，根本摸不到他的踪影。更令人头疼的是当地不少偏远部落还在暗中为他们提供庇护与补给，这让本就困难重重的搜捕工作变得愈发希望渺茫。每次当我们的指挥官欣喜若狂，以为终于将他堵在死角时，到头来却发现那不过是他精心抛出的诱饵，我们的安全部队轻率地咬钩，随后便一头扎进早已设好的伏击圈，而他本人则再次毫发无损地逃之夭夭。意大利人对这样的军事天才极为赏识，甚至屡次建议我们对他进行招安，承诺只要他肯归顺，就可以授予他阿尔巴尼亚将军的头衔。然而这个人的狂热信仰坚硬如石，我们的说客在他面前根本无计可施；至于那些被派去劝降的特别小队每一次还没来得及开口就被他手下打了回来。\n\n不过，天底下从来没有永不破裂的防线。即便是这样的天才也终究无法逃脱我们在全国范围内张开的铁笼。那些未能逃过大搜捕的霍查亲信落入了我们手中。并没有耗费太多精力，仅仅稍微动用了些必要的“特别审讯手段”，他们便将知道的一切吐得一干二净。循着这些珍贵的情报，我们最终在科尔察附近的深山里将他堵截并一举擒获。尽管意大利方面依旧抱有幻想，极力主张对他从宽处置，甚至还在规划着如何说服他加入大阿尔巴尼亚卫队，但特菲克·塞利姆·姆博尔贾显然没有这样的耐心。他最终选择自作主张，干脆利落地签发了死刑令。就这样，这位曾让整个阿尔巴尼亚人心惶惶的游击天才在一场不为人知的秘密处决中悄无声息地结束了他的生命。"
 albfas.1.a:0 "这个赤匪总算完蛋了"
 albfas.2.t:0 "大委员会的争论"
 albfas.2.d:0 "大阿尔巴尼亚卫队大委员会目前已正式展开讨论，以决定是将受到意大利民族主义协会支持的特菲克·塞利姆·姆博尔贾推上领袖之位，还是将得到革命行动法西斯支持的特伦齐奥·托奇扶植上去。\n\n尽管特菲克·塞利姆·姆博尔贾已实际统治了阿尔巴尼亚一段时期，且在此期间所推行的各项政策成效显著，不仅反抗与反对的声音被逐步压制下去，阿尔巴尼亚的重建工程也在稳步推进，但我们仍需开展一场公开而公平的讨论。毕竟他目前仅具备临时领袖的身份，若想获得至高无上的合法权力就必须得到中央的正式授权。\n\n此外，我们还必须极其审慎地处理与意大利人的关系。意大利民族主义协会与革命行动法西斯虽然在意识形态上理论相近，但双方早已视彼此为势不两立的仇敌。尤其是在意大利革命战争期间，意大利民族主义协会对革命行动法西斯的背刺曾令贝尼托·墨索里尼大发雷霆。\n\n我们今日无论选择这两位候选人中的哪一位都意味着将与另一方势力彻底决裂，过往建立的盟友关系与友谊也将荡然无存。因此，切盼大会能够三思而行，谨慎地做出最终决断。"
 albfas.2.a:0 "支持特菲克·塞利姆·姆博尔贾"
 albfas.2.b:0 "支持特伦齐奥·托奇"
 albfas.3.t:0 "喃喃自语"
 albfas.3.d:0 "我伪装得是如此成功，以至于连我那位“挚友”齐亚诺，都被我那套精湛的表演彻底骗了过去。阿尔巴尼亚复兴？别开玩笑了，这种陈词滥调早在几十年前就无人问津。难道真有蠢货会相信，凭阿尔巴尼亚这块弹丸之地，能够击败那些雄霸世界十余载的列强？塞尔维亚人身后挺立着俄国熊，克罗地亚人的后台是奥地利，希腊人靠着盎格鲁-撒克逊人的舰队撑腰，保加利亚人也有日耳曼帝国的军靴做倚靠。巴尔干这团乱麻，根本就不是我这种人能解开的。我所做的一切不过是像这片血腥土地上的所有民族一样，在强权的缝隙里给自己抓紧一把伞、找一座靠山罢了。\n\n我可算不上什么高深莫测的理论大师，死板地照搬教条谁不会呢？我不过是顺水推舟，将它们的理论稍微改头换面了一下。可意大利民族主义协会的那群疯子居然还沾沾自喜，真以为在这个世界上找到了能与他们灵魂共鸣的知音，真是一群不可救药的蠢货。在这个阿尔巴尼亚，我才是唯一的领袖。霍查？也许他确实称得上是个不可多得的天才，但他凭什么配与我平起平坐？所以我干脆利落地让手下除掉了他。如果他只是个碌碌无为的庸才我甚至懒得在他身上多费半点心思，毕竟留下他这种“赤匪”做靶子，我还能顺理成章地向意大利人索要更多预算和援助呢。真可惜，谁让他偏偏不识时务呢。"
 albfas.3.a:0 "现在谁还想反对我？"
 albfas.4.t:0 "当代凯撒"
 albfas.4.d:0 "说实话，我根本读不懂维尔弗雷多·帕累托那套晦涩难懂的“精英循环论”。但既然我那位好“挚友”齐亚诺对此深信不疑，我也就必须亦步亦趋地跟紧他的脚印。为了不露出破绽，我不得不四处搜罗真正的理论家替我剖析那些令人头疼的复杂学说，唯有如此我才能在与意大利民族主义协会那群自命不凡的家伙交谈时显得睿智而博学，进而为我捞取更多来自米兰的真金白银。不过，久而久之我也算摸透了其中的玄机：既然我是新时代的“精英”，自然理所应当去推翻那些早已腐朽堕落的旧统治者；而若想稳固手中的宝座，就必须顺应所谓的铁律，时刻保持队伍的“纯洁性”与“革命性”。\n\n但这真是太令人厌烦了！我哪有那么多精力去逐一审查每个人是否怀揣真诚？\n\n与其深陷在无穷无尽的忠诚审查中，我逐渐迷恋上了一种更简单彻底的方式：将一切权力收归我一人所有。只要至高无上的权力尽握于我手，我便是这片土地上唯一的“精英”。届时没人能动摇我的统治，生死不过在我的一念之间，阿尔巴尼亚只需要听从我一人的号令！至于大阿尔巴尼亚卫队？让他们去替我处理那些繁琐且毫无实权的琐事就足够了。\n\n我发现自己正一步步走向凯撒曾经达到的高度，“国家第一公民”，多么美妙而富有魔力的称谓！只不过凯撒终究是个失败者，原因就在于他的独裁还不够彻底。而我绝不会重蹈覆辙，我将永存。阿尔巴尼亚早已被我彻底驯化，再也不会有人能像当年刺杀凯撒那样将我刺死在权力的殿堂之上。"
 albfas.4.a:0 "权力多么美妙"
 albfas.5.t:0 "我想要战争！"
 albfas.5.d:0 "恩里科·科拉迪尼，这个神神叨叨的疯子又开始到处推销他那荒谬绝伦的理论了。国家与国家之间的博弈怎么可能简单地套用无产阶级和资产阶级的概念？难怪他终究不过是个彻头彻尾的失败者。他居然大言不惭地说什么“阿尔巴尼亚和意大利是无产阶级兄弟国家”，这简直令人发笑。\n\n不过，既然他们自诩为“兄弟”，那么作为兄长，为阿尔巴尼亚注入更多的金钱自然也是理所应当。我只需要气定神闲地坐在地拉那的办公室里，那些意大利人就会毕恭毕敬地把一箱箱金条奉上，送入国库——不，是送入我的私人钱包。意大利人抱怨阿尔巴尼亚的战后重建进展缓慢？那关我什么事？要怪只能怪他们掏出来的钱还远远不够。\n\n权力与财富正源源不断地涌向我。这些迷人的东西确实能安抚我的野心，让我如此沉溺其中。可日复一日，这一切也渐渐变得枯燥乏味。我握有滔天的权势与数不清的金钱，却被困在这片狭小的土地上无法施展，就像一头被囚禁在阿尔巴尼亚山谷里的雄狮！\n\n对外战争！对，唯有战争！我要像历史上那些名垂青史的英雄一样，去踏平周边，收复所有“曾经属于阿尔巴尼亚的领土”。单纯的金钱与权力已经无法再填满我的欲望，我要做当代的斯坎德培！我要让希腊人、保加利亚人、南斯拉夫人都像如今的阿尔巴尼亚人一样，顺从地跪伏在我的脚下！\n\n……我发觉自己的思维越来越癫狂了。这些繁杂而琐碎的事务折磨得我头痛欲裂。但愿那些从米兰请来的意大利医生能用他们的针剂和药丸让我好受一点。"
 albfas.5.a:0 "阿尔巴尼亚人向我证明忠诚的时候到了"
 albfas.6.t:0 "索古"
 albfas.6.d:0 "最近艾哈迈德·索古这个废物又开始在海外上蹿下跳，叫嚣着要打回阿尔巴尼亚了。这肺痨鬼怎么还没把自己抽死？\n\n他明知道我有多么厌恶君主制。当年维德王朝统治时期，那种如影随形的恐惧至今仍令我作呕，大街小巷随处可见奥地利宪兵，他们肆意搜捕反抗者当街执行枪决。那时我除了逃往意大利别无选择。那段岁月是我这辈子都挥之不去的梦魇，而索古那个小丑竟然还敢拿着这些陈年旧账来羞辱我！\n\n我不过是拒绝了他私下提出的“双雄共治”方案罢了。阿尔巴尼亚人根本不需要什么国王，他难道连这么简单的道理都不懂吗？阿尔巴尼亚人有我一个人就足够了！我能赐予他们梦寐以求的生活——安稳、富足、强大。作为回报，他们只需要绝对地顺从我、奉献他们的忠诚就够了。\n\n我已经彻底受够了索古的滑稽表演。国家安全局最近正在密谋制定针对他的刺杀计划，相信用不了多久，就会有令人满意的“成果”呈递上来。说实话，安全局这群手下讨好我的手段确实让我颇为受用，但他们不该在未经我的授权就擅自做主，他们必须时刻清楚在这片土地上究竟谁才是唯一有资格下达命令的主人！日后在收拾他们。\n\n等等……我怎么会变成这样？我发觉自己现在的所作所为竟与当年维德王朝那个令人憎恶的独裁君主越来越像了。这明明是我这辈子最痛恨、最唾弃的样子……我究竟在做什么……"
 albfas.6.a:0 "也许我该吃药了"
 albfas.7.t:0 "千古英雄"
 albfas.7.d:0 "意大利医生开给我的那些镇静药物也不管用了。\n\n在昏沉与剧痛的间隙里，我仿佛看到了伟大的奥古斯都正微笑着向我招手。他缓缓抽出佩剑，将冰冷的剑身轻轻搭在我的肩膀之上，这一刻，我激动得浑身战栗，罗马的先贤们终于认可了我无可比拟的伟业！凯撒亲手将象征至高荣耀的桂冠戴在我的头顶，又将华贵的帝王紫袍披在我的肩头。在一阵高过一阵的万民欢呼与呐喊声中，我一步步迈向那座至高无上的王位。权杖与宝剑仿佛受到了某种神圣的召唤，纷纷飞入我的手中，耳畔响彻着排山倒海般的宏大赞美诗，而我整个人都彻底沐浴在璀璨耀眼的圣光之中。\n\n外面的喧闹与吵嚷声骤然将我从这场宏大的幻觉中拉回现实。我猛地睁开眼，却震惊地发现：那件紫袍竟依然沉甸甸地披在我的身上，而那顶桂冠也真切地戴在我的头顶！\n\n这是启示！这绝对是上天降下的神圣启示！看来我注定要登上王座，统治这片土地！\n\n不……不！这不是我！我绝不是那些令人唾弃的封建君主！我是特菲克·塞利姆·姆博尔贾！我不是凯撒死后的影子，更不是奥古斯都下旨封赏的附庸！我是一名高尚的阿尔巴尼亚公民，是一名领航时代的英明领袖！\n\n不……不对，我就是凯撒的转世！我就是阿尔巴尼亚唯一的神明与主宰！我才是……\n\n该死……我的头好痛。我想……我想我确实需要好好冷静一下了……"
 albfas.7.a:0 "我才是唯一的王！"
 albfas.7.b:0 "冷静……冷静……"
 albfas.8.t:0 "兄弟联盟"
 albfas.8.d:0 "国民阵线是为数不多还算称职的右翼民族主义政党。相比之下，绝大多数所谓的右翼不过是披着一层民族主义的外衣，向民众兜售他们荒谬至极的观点，为了迎合阿尔巴尼亚各个保守部落，他们甚至竭力鼓吹陈腐的传统主义与君主主义。\n\n作为少数经过现代思想洗礼的政党，国民阵线无疑是阿尔巴尼亚最理想的民族主义者大本营。他们不仅支持共和主义、大阿尔巴尼亚主义与民族主义，更希望将阿尔巴尼亚带入现代社会的曙光之中，这与我们的政治主张不谋而合。考虑到我们刚刚执政不久，急需一个在国内拥有深厚影响力的政党与我们携手合作，国民阵线显然是不二人选。\n\n阿尔巴尼亚人民真的需要一位君主吗？我想他们绝不会希望看到第二个维德二世式的傀儡国王。目前我们的联络官已经与国民阵线的同志们取得了密切联系，相信用不了多久，他们就会给我们答复，一个令人满意的答复。"
 albfas.8.a:0 "不错"
 albfas.9.t:0 "复兴大阿尔巴尼亚"
 albfas.9.d:0 "“大阿尔巴尼亚” 这一民族主义与国家统一主义的概念，旨在将巴尔干半岛所有以阿尔巴尼亚族为主体的土地统一为一个单一的主权国家。其核心版图不仅包括科索沃全境，还涵盖了北马其顿西部与西北部（如泰托沃、戈斯蒂瓦尔、代巴尔、斯特鲁加等阿族聚居区）、黑山南部与东南部（如靠近阿尔巴尼亚边境的乌尔齐尼、普拉夫、古西涅等地）、塞尔维亚南部普雷舍沃山谷地区的普雷舍沃、布亚诺瓦茨与梅德韦贾，以及希腊西北部历史上被称为“查梅里亚”的伊庇鲁斯沿海及周边地区。\n\n尽管我们曾将宣称地区进一步拓展至塞尔维亚全境、黑山全境、波斯尼亚南部以及马其顿全境，但这一切目前看来似乎仍如镜花水月般遥不可及。“大阿尔巴尼亚”的统一之路依然漫长而崎岖，但早晚有一天，属于我们的土地终将在祖国母亲的呼唤中重新回归。"
 albfas.9.a:0 "为了阿尔巴尼亚！"
 albfas.9.b:0 "保留宣称就行了，我们还惹不起这群人"
 albfas.10.t:0 "双鹰雄立"
 albfas.10.d:0 "正是得益于我们全面深入的改造与重建工作，如今的阿尔巴尼亚已然具备了傲视巴尔干群雄的雄厚实力，甚至拥有了介入与影响世界事务的底气。这一切的飞速崛起无不归功于我们亲密的意大利兄弟在祖国重建岁月里所给予的鼎力相助。倘若没有这份深厚的情谊与支援，阿尔巴尼亚绝无可能以如此惊人的速度屹立于强林之列。\n\n我们的士兵早已满怀炽热的渴望，誓要与意大利的同志们并肩作战，彻底驱散笼罩在两国人民头顶的列强阴霾，粉碎一切压迫与干涉。阿尔巴尼亚将永远与意大利同在！"
 albfas.10.a:0 "意大利已经堕落，我们必须解救他们！"
 albfas.10.b:0 "阿尔巴尼亚和意大利万岁！"
 albnewsevent.1.t:0 "阿尔巴尼亚亲意政变"
 albnewsevent.1.d:0 "在经历了近期动荡不安的政局与工团主义势力的接连骚乱后，一支自称“大阿尔巴尼亚卫队”的准军事组织从混乱的局势中迅速崛起，一举镇压并铲除了工团主义者的叛乱企图。鉴于阿尔巴尼亚王国政府此前对工团主义势力的放任自流以及在应对国内危机时的严重失职，该政府已宣告解散，国王索古一世被迫流亡海外。随后，“大阿尔巴尼亚卫队”发表正式声明，宣布将全面引入并采纳自意大利传播而来的新思潮，对阿尔巴尼亚的国家体制与社会秩序进行全面改造，直至本国具备与意大利并肩而立的实力。"
 albnewsevent.1.a:0 "有趣。"
 
