 SER_peoples_army:0 "人民军"
 SER_peoples_army_desc:0 "肩章已经摘掉，团号已经取消。现在只有一种军衔：人民战士。工厂的钳工和山区的牧羊人穿着同样的灰绿色军装，由同一个信念凝聚——保卫我们的革命。"
 SER_new_repubilic:0 "新共和国"
 SER_new_repubilic_desc:0 "革命保卫战需要子弹，也需要面包。工厂转向军工，农田供养城市，一切生产纳入动员计划。资产阶级的橱窗可以空着，前线的弹药箱必须满着。"
 SER_desperate_alliance:0 "绝望的同盟"
 SER_desperate_alliance_desc:0 "切特尼克的山羊皮帽和乌斯塔沙的U字徽章并排挂在同一面墙上。这面墙在此之前不属于任何人，在此之后属于一切愿意把手指扣在扳机上的人。安特·帕韦利奇从流亡地写信来了，切特尼克的指挥官们读信时没有开灯，只点了蜡烛。天亮时蜡烛已经燃尽，回信写好了，措辞简短得像是战报。只不过是两群被各自前路遗弃的人，在贝尔格莱德一间没有窗户的房间里，签了一份没有人祝福的文件。"
 SER_ultra_nat_union:0 "极端民族主义联盟"
 SER_ultra_nat_union_desc:0 "切特尼克的人带来塞尔维亚的村庄名单，乌斯塔沙的人带来克罗地亚的村庄名单。两张名单摊在同一张桌子上，中间用铅笔划了一道线。线这边是“我们”，线那边是“敌人”。至于“我们”这个词为什么包括了昨天还在互相割开喉咙的人，没有人在会上讨论。讨论是多余的。敌人的名单更长。敌人有名字，有地址，有驻扎的兵力数字，而对付他们需要两队人。"
 SER_intergrate_musilm:0 "整合穆斯林"
 SER_intergrate_musilm_desc:0 "波斯尼亚的穆夫提被请到了萨拉热窝的市政厅。茶水是热的，窗户是关着的。切特尼克的代表说你们和我们拜的不是同一个神，但我们拜谁不重要；乌斯塔沙的代表说克罗地亚民族包括伊斯兰教的克罗地亚人——这句话是从安特的旧文章里摘出来被印成文件的。穆夫提看着窗外。窗外的院子里停着两辆卡车。他无法逃避什么了，于是他签了字，希望快一点离开是非之地。"
 SER_unified_militias:0 "统一准军事组织"
 SER_unified_militias_desc:0 "乌斯塔沙有他们的黑色军团。切特尼克有他们的支队。现在这两支力量被编入同一个指挥系统。他们的训练营设在旧矿井里，白天练射击，晚上互相背诵对方所倾泻与复现的仇恨——塞尔维亚人听克罗地亚人的往日苦难，克罗地亚人听塞尔维亚人的传世伤痛，黑色的火焰和不知名的暗流在他们的声音里生长出来。他们听完之后继续联系射击，枪法显然更准了。"
 SER_against_oppressors:0 "团结对抗压迫者"
 SER_against_oppressors_desc:0 "压迫者的名单从贝尔格莱德念到萨格勒布，从莫斯塔尔念到巴尼亚卢卡。名单上的名字有些属于国际联盟，有些属于共济会，有些属于布尔什维克，有些属于“国际犹太金融集团”。这份名单被印成小册子，每每印着一句话：他们没有区别。不必分清敌人，只需认出敌人。"
 SER_anti_socialist_propaganda:0 "反社会主义宣传"
 SER_anti_socialist_propaganda_desc:0 "社会主义者相信人由阶级。我们只知道血。社会主义者想要国际主义。我们只是关注土地。社会主义者说工人应当掌管工厂。我们说工厂应当掌管工人——当然，是民族的工人，在民族的监督下。我们的宣传卡车装上扩音器，开进每一个有工会活动的镇子。广播车在前面开，后面跟着两卡车的人。这些人都戴帽子，帽子下面是什么表情，没人看得清。"
 SER_end_church_conflict:0 "结束宗教冲突"
 SER_end_church_conflict_desc:0 "正教堂和天主教堂的神父被召集到同一个会堂。主持会议的人穿着军靴，他们讲话时把军靴搁在桌子上。他说，从现在起，你们的布道内容由我们来写。敌对情绪仍旧是布道的主题，但敌人不再是马路对面的那间教堂，敌人是名单上的那些名字。圣萨瓦和圣安特同一天庆祝，同一天放假。十字架和十字架不再互相砸击，而是并排钉在敌人的门上。"
 SER_fight_for_great_yugoslavia:0 "为大南斯拉夫奋斗"
 SER_fight_for_great_yugoslavia_desc:0 "南斯拉夫的边界不再与任何旧条约吻合。它从斯洛文尼亚的阿尔卑斯山脚一直延伸到瓦尔达尔河谷，从亚得里亚海岸一直延伸到多瑙河弯。这张地图上没有任何少数民族的标注，没有自治区域，没有保护领。一个颜色，一个名字，一个政权。切特尼克和乌斯塔沙各自保留了在自家总部墙上挂起这张地图的权利。至于这个“大南斯拉夫”建成之后又会有什么谁说了算的问题——那就是以后的事了。"
 serpuppet.1.t: "保加利亚占领下的塞尔维亚"
 serpuppet.1.d: "为了摧毁保加利亚在巴尔干地区的霸权，贝尔格莱德条约对保加利亚开战，尽管我军在数量上占有优势，但塞尔维亚还是失败了。投降之后，保加利亚军队进入贝尔格莱德，镇压了最后几处抵抗。之前的政府成员有一些被逮捕，另一些则已逃之夭夭。\n\n保加利亚当局让日沃因·佩里奇作为首相，复辟了奥布雷诺维奇王朝，现在他们被选中来重建国家，并恢复他们的政策。"
 serpuppet.1.a: "我们得建立一个新国家。"
 serpuppet.2.t: "开始渐进改革"
 serpuppet.2.d: "为了在国内贯彻他们的理念，党已经发起了一系列新的改革，这些改革将影响国家的社会状况以安抚民众。但与此同时，他们也在努力巩固塞尔维亚的权力并对抗“多数人的暴政”。法国政治家亚历西斯·德·托克维尔曾对这一概念加以修正，他说：“民主是由多数派和绝对多数派所组成的恶性循环，政治少数派在其中则完全没有办法发声。”"
 serpuppet.2.a: "我们需要尊重民主和多数派原则。"
 serpuppet.2.b: "我们需要对抗这种暴政并建立一个直接接受委任的上议院。"
 serpuppet.3.t: "改革的第二步"
 serpuppet.3.d: "在关于“多数暴政”的辩论之后，党提出了一项关于实施最低工资的新改革。这一提议将允许每个家庭都能够拥有满足基本需求所必需的微薄收入。与之相反的是一些党员建议实行某种基于俾斯麦政治思想的保障制度，奖励那些为社会保障做出贡献的人。"
 serpuppet.3.a: "我们需要保证塞尔维亚人民能过上好日子。"
 serpuppet.3.b: "不劳动，不得食。"
 serpuppet.4.t: "改革的最后一步"
 serpuppet.4.d: "在进行了大量党内辩论之后，最后一项提案终于出炉。一些思想最为开明的议员正在考虑改革立法机构，实施诸如妇女解放以及对更多地保护工人等改革措施，这些想法与先前关于最低工资的建议是一致的。与此同时，党内的专制派成员则担心这一提议可能给国家带来不可预测的未来。相反，他们提议控制立法机构。政府将掌控行政权以及立法权，加强其所拥有的权力，最终走上威权主义的道路。"
 serpuppet.4.a: "塞尔维亚是一个拥有现代思维的现代国家！"
 serpuppet.4.b: "只有强大的国家才能保护政府免于崩溃。"
 serpuppet.5.t: "倾向自由的渐进改革"
 serpuppet.5.d: "在塞尔维亚践行自由主义思想和强化新政府权力之间做出许多抉择后，改革现在终于完成：改革最终选择了自由主义的道路。通过促进平等、保护民主以及实施最低工资、法律改革等提案举措，塞尔维亚已经成为了一个现代国家，足以被称誉为巴尔干半岛的典范。"
 serpuppet.5.a: "塞尔维亚万岁！"
 serpuppet.6.t: "倾向威权的渐进改革"
 serpuppet.6.d: "在塞尔维亚践行自由主义思想和强化新政府权力之间做出许多抉择后，改革现在终于完成：改革最终选择了威权主义的道路。塞尔维亚政府直接接受委任的上议院对抗危险的“多数人的暴政”、建立了以俾斯麦思想为基础的福利制度，最终实现了行政权与立法权的合并，巩固了自己的权力并成为巴尔干半岛上的强国。"
 serpuppet.6.a: "塞尔维亚万岁！"
 serpuppet.7.t: "暗中会面"
 serpuppet.7.d: "今晨，一封信寄到了国王的宫殿——这是一份来自切特尼克残余势力的会谈提议，他提议于午夜12点在黑暗的贝尔格莱德城外与国家领导人会面。保加利亚已经统治了塞尔维亚相当一段时间了，一些政府官员、包括国王本人、都开始考虑起义的可能性。也许这次会面会带来一个崭新但危险重重的机会。"
 serpuppet.7.a: "见见他。"
 serpuppet.7.b: "我们绝不背叛保加利亚，逮捕他！"
 serpuppet.8.t: "让政府中的一些人加入？"
 serpuppet.8.d: "会面之后，国王发现抵抗者是切特尼克中的一名杰出成员，他们的目标是在背后捅上一刀、推翻保加利亚的霸权。随后，乔治国王和他决定抛开一切形式的意识形态误解，团结塞尔维亚的抵抗力量以对抗保加利亚的压迫者，这个联盟将被称为“全国抵抗委员会”。目前，我们必须寻求一些支持来准备针对保加利亚的起义，但我们所做的每一个决定都会增强或削弱抵抗委员会以及独立运动的秘密行动。如果我们的秘密行动过低，我们就可能会被发现并激起保加利亚人对塞尔维亚人民的愤怒；如果能够设法保持良好的伪装，我们就可以在对抗保加利亚军队时获得一些意料之外的惊喜。\n\n现在，佩里奇知道政府中的一些人也正在开始转而反对保加利亚的立场。我们应该试图让他们也加入吗？"
 serpuppet.8.a: "可不能相信他们。"
 serpuppet.8.b: "也许我们还是能得到一些政治支持的。"
 serpuppet.9.t: "邀请将军？"
 serpuppet.9.d: "塞尔维亚军队在与保加利亚的战争中受尽羞辱。我国的一些将军不支持与胜利者合作，我们应该让他们参与进来吗？这可能会危及NCR的秘密行动，但同时也能在战争中为我们赢得一些军官的支持。"
 serpuppet.9.a: "还是应该潜伏下来。"
 serpuppet.9.b: "也许我们多少能赢得一些军事支持。"
 serpuppet.10.t: "搜集军队装备？"
 serpuppet.10.d: "上一次战争和世界大战期间的步兵装备在我国的一些仓库堆积如山：虽然这些枪支弹药正在尘土中慢慢腐烂，但它们对我们的起义还是有大用处的。问题在于，这些仓库的看守不是保加利亚士兵就是腐化的塞尔维亚士兵。我们可以贿赂他们或者偷偷潜入这些地方，行动仍有失败的可能，秘密行动也有可能会受到影响。该怎么办？"
 serpuppet.10.a: "还是别在这种事儿上冒险了。"
 serpuppet.10.b: "我们需要不计代价地搞到枪支弹药。"
 serpuppet.11.t: "招募更多的人手？"
 serpuppet.11.d: "自世纪初以来，塞尔维亚在卷入的每一场战争中都失去了许多男子汉，世界大战和第四次巴尔干战争则是其中最为致命的。但现在为了起义，我们需要战士去对抗保加利亚的压迫者。巧合的是，许多塞尔维亚人对政府的改革表示赞赏，但却对与保加利亚之间的联盟不以为然：这样我们就能招募更多的人来对付他们。"
 serpuppet.11.a: "小心驶得万年船啊。"
 serpuppet.11.b: "为了最终的决战，我们需要这些人。"
 serpuppet.18.t: "在教堂里隐藏枪支？"
 serpuppet.18.d: "自我们的运动建立以来，它的神秘性就不可或缺。事实上正是由于它成功的伪装，我们才能够从保加利亚人的手中获得最为令人惊讶的独立。一些游击队员建议我们应该把枪藏在乡村小教堂之类的教堂里面，这样会比把枪支藏在一些仓库里更好：当起义爆发时，我们就能够在无人阻挠的情况下把它们拿回来。然而这一举动引发了一些道德问题，NCR的一些成员反对在我们的计划中使用神圣的场所的想法。我们该怎么办？"
 serpuppet.18.a: "就这么办。"
 serpuppet.18.b: "那还是别碰教堂了。"
 serpuppet.12.t: "征募雇佣兵？"
 serpuppet.12.d: "现在我们已经知晓我们得到了多少支持：拥有多少条枪、多少人、多少盟友，甚至是如何处理这些枪支弹药。然而我们不知道的是即使凭拥有出其不意的优势，这些对我们武力争取独立是否足够。也许在起义的时候招募一些雇佣兵会是明智之举。我们可以假装在招募雇佣兵来帮助保加利亚人作战，这肯定能在一段时间里蒙蔽他们。"
 serpuppet.12.a: "太冒险了。"
 serpuppet.12.b: "我们需要他们。"
 serpuppet.13.t: "黑云压城"
 serpuppet.13.d: "骰子已经掷下，我们唯有等待，看看我们的决定会结出什么样的果。我们将准备反抗保加利亚压迫者的起义。只有这两种可能：要么我们的行动一直维持在秘密之中、要么我们的行动不慎暴露——在这种情况下，起义可能会失败，或者保加利亚会发现阴谋并比我们预计得更早就摧毁我们。"
 serpuppet.13.a: "为塞尔维亚祈祷吧。"
 serpuppet.14.t: "独立成功"
 serpuppet.14.d: "我们成功地保持了我们的密谋足够隐蔽，保加利亚人没有料到我们会反叛，这给予了我们出其不意的优势。"
 serpuppet.14.a: "我们占据了制高点。"
 serpuppet.15.t: "密谋失败"
 serpuppet.15.d: "我们还是不够谨慎，保加利亚对我们的所作所为疑心重重，他们将军队派遣往战略要地并逮捕了一些密谋分子。我们不得不孤注一掷。"
 serpuppet.15.a: "全完了。"
 serpuppet.16.t: "密谋被发现！"
 serpuppet.16.d: "我们在做的事情被保加利亚发现了。他们打算先下手为强。保加利亚军队正准备把我们一举消灭。"
 serpuppet.16.a: "我们完了。"
 serpuppet.17.t: "我们成功地宣布独立"
 serpuppet.17.d: "当保加利亚背信弃义时，我们成功地设法独立。但不出所料，有些人似乎已经告诉他们了……"
 serpuppet.17.a: "要命了。"
 serpuppet.19.t: "夺取奥匈皇冠？"
 serpuppet.19.d: "随着我国成功摆脱了保加利亚的统治，是时候开始决定我们国家的未来了。首相日沃因·佩里奇在一战期间，曾经提出将塞尔维亚并入奥匈帝国的想法，而国王与曾经的奥布雷诺维奇家族也一直持亲奥地利立场。我们可以选择加入奥匈帝国的阵营，也可以采取更激进的手段，攻入维也纳夺取奥匈帝国皇冠。我们要如何决断？"
 serpuppet.19.a: "以武力建立奥匈塞帝国！"
 serpuppet.19.b: "我们应该加入奥地利的阵营。"
 serpuppet.19.c: "算了吧。"
