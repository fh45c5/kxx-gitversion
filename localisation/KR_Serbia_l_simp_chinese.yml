 SER_has_black_monday:0 "拥有国家精神§H$SER_black_monday$§!"
 SER_has_black_monday_NOT:0 "没有国家精神§H$SER_black_monday$§!"
 SER_accepted_bulgaria_union:0 "我们接受了保加利亚关于南斯拉夫联盟的建议"
 SER_if_ENT_agrees:0 "如果§H[ENT.GetFlag][ENT.GetNameDef]§!同意："
 SER_Return_Of_The_Crown_Prince:0 "王储归来"
 SER_Return_Of_The_Crown_Prince_desc:0 "在流亡十多年之后，战争英雄亚历山大·卡拉乔杰维奇返回贝尔格莱德。作为王储的他加冕为塞尔维亚国王，举国欢庆。作为一个倡导现代化的军国主义者，只有通过他的仁政，这个王国才会变得更加强大。天佑吾王！"
 SER_Alexanders_Vision:0 "亚历山大的愿景"
 SER_Alexanders_Vision_desc:0 "倘若我们的国家要走入现代化的话，我们必须先来一场激进的政治变革。通力合作的国王和济夫科维奇打算解散博约维奇的议会，并在此之上建立一个强权的中央政府，让我们的民众为之自豪。一切都不可阻挡国王的宏愿。开疆拓土，一往无前！"
 SER_Encourage_Yugoslavism:0 "倡导南斯拉夫主义"
 SER_Encourage_Yugoslavism_desc:0 "我们的国王是泛斯拉夫主义南斯拉夫运动的坚定拥护者，坚信所有南斯拉夫人以共同的文化纽带相联。尽管这并非塞尔维亚和南斯拉夫其他地区的智者们的共识，亚历山大还是希望能在塞尔维亚大众中倡导南斯拉夫的概念，为未来建立统一的南斯拉夫国家打下根基。"
 SER_Begin_Land_Reform:0 "开始土地改革"
 SER_Begin_Land_Reform_desc:0 "塞尔维亚的土地大多是农业用地，而绝大多数人口是农村的农民。亚历山大国王渴望赢得人民的支持，并巩固自己作为引领现代化领袖的地位，颁布法令，所有超过100地籍轭（1英亩=0.7033地籍轭）的封建庄园将被分割，而土地所有者会得到补偿。这将影响到大量土地所有者，但从长远来看这有助于减轻农村地区的贫困。"
 SER_Glory_To_The_King:0 "荣耀归于国王"
 SER_Glory_To_The_King_desc:0 "我们的国王暨战争英雄是塞尔维亚民族最伟大的象征。就像他在塞尔维亚的至暗时刻带领我们一样，他已经归来，并带领我们走向光明。亚历山大国王万岁！"
 SER_Maintain_Military_Dominance:0 "维持军事执政"
 SER_Maintain_Military_Dominance_desc:0 "只有军队才能解放塞尔维亚民族。因此军队顺理成章地继续作为稳定国内局势和爱国主义宣传的支柱，他们还是祖国的捍卫者，塞尔维亚大统一的主力军。不管怎么说，他们在国内占据着重要的地位。"
 SER_Monument_To_The_Unknown_Soldier:0 "无名战士纪念碑"
 SER_Monument_To_The_Unknown_Soldier_desc:0 "自战争结束以来，人们对无名烈士的崇敬变得流行起来，为他们建造一座纪念碑的计划已经考虑了十多年。奥地利不再警惕我们后，人们对这个项目重新产生了兴趣，我们几乎没理由拒绝进行这项工作，以此向那些为塞尔维亚民族战斗而牺牲的烈士致以崇高的敬意。"
 SER_The_Vojvoda_Stands_Tall:0 "元帅巍然屹立"
 SER_The_Vojvoda_Stands_Tall_desc:0 "随着无数阴谋被粉碎，博约维奇元帅依旧是塞尔维亚民族的最高领袖。现在，他摆正自己的强硬立场，将塞尔维亚重塑为一个有能力解放其他斯拉夫民族的国家。塞尔维亚人民将忠于自己的使命，不畏内敌。"
 SER_Organise_The_Radical_Union:0 "组织激进派同盟"
 SER_Organise_The_Radical_Union_desc:0 "斯托亚迪诺维奇总理曾是人民激进党成员，他不止一次领会到自由民主的弱点。然而他也认识到了“水可载舟，亦可覆舟”这个道理。为了增强综合国力，斯托亚迪诺维奇将创建“激进派联盟”——一个动员群众的民粹主义政党，这个党派将重新巩固国民议会的地位。"
 SER_Mobilise_The_Greenshirts:0 "动员绿衫军"
 SER_Mobilise_The_Greenshirts_desc:0 "绿衫军是激进派联盟准军事组织的绰号。虽然元帅通常让他们负责骚扰政治对手和保护其成员不受敌对团体的攻击，但元帅认为有必要动员他们并其作为辅警和生力军。他希望绿衫军能为军力不断增长的祖国做贡献，为即将到来的斗争做准备。"
 SER_One_Vojvoda_One_Nation_One_State:0 "一个元帅 一个民族 一个国家"
 SER_One_Vojvoda_One_Nation_One_State_desc:0 "我们的改革使我们进入了一个繁荣的新时代，但我们的工作还未完成。斯托亚迪诺维奇宣布，在他们的目标完成之前，激进派联盟不会止步不前；“一个元帅，一个民族，一个国家以及我们祖国的和平。”"
 SER_The_Republican_Proclamation:0 "共和宣言"
 SER_The_Republican_Proclamation_desc:0 "摄政王下台了！临时总统斯洛博丹·约万诺维奇宣布塞尔维亚共和国成立，他的目标是建立一个没有暴政和压迫的民主国家。在人民支持我们的情况下，收复失地只是时间问题。"
 SER_Draft_A_Constitution:0 "起草宪法"
 SER_Draft_A_Constitution_desc:0 "目前的宪法显然不适合我们刚刚成立的新共和国。为了为所有塞族人建立一个稳定繁荣的民主制度，我们必须起草一个真正代表塞尔维亚共和国价值观的新民主宪法。"
 SER_Free_The_Vojvodas_Prisoners:0 "释放政治犯"
 SER_Free_The_Vojvodas_Prisoners_desc:0 "元帅对监禁政治对手和持不同政见者毫不手软，许多民主党人因为莫须有的借口而坐穿牢底。释放政治犯的承诺应当说到做到，并清楚地表明我们对多元主义和民主的承诺。"
 SER_A_Nascent_Balkan_Democracy:0 "新生的巴尔干民主"
 SER_A_Nascent_Balkan_Democracy_desc:0 "对于一些人来说，在动荡的巴尔干之中施行自由民主制度，似乎是不现实的。但约万诺维奇总统逆流而上，仍旧建立了民主政体。如今，宪法再得编纂，民政法规业已恢复，是时候让我们的临时总统辞职，迎接新时代了。"
 SER_Restore_Local_Governance:0 "恢复地方管理"
 SER_Restore_Local_Governance_desc:0 "塞尔维亚历届政府都奉行中央集权政策。虽然这确实有好处，但也损害了基层参政意愿和地方民主进程。恢复地方管理将有助于重建地区民主价值观。"
 SER_Implement_The_Pasic_Manifesto:0 "落实帕希奇宣言"
 SER_Implement_The_Pasic_Manifesto_desc:0 "尼古拉·帕希奇是塞尔维亚历史上最伟大的政治家之一。执政三十余载，帕希奇的政治纲领是一项影响广泛的改革，内容包括新闻界、司法界和教育界。摄政使他的许多艰苦努力化为乌有，而我们有责任尊重他的遗产。"
 SER_Open_The_Serbian_Economy:0 "开放塞尔维亚经济"
 SER_Open_The_Serbian_Economy_desc:0 "长久以来，塞尔维亚经济一直疲软，并与列强们隔绝。现在，有了规划自己路线的自由，我们有机会扭转这种孤立。与周边国家建立新的国际贸易协定和经济项目会为我们的经济带来好处。"
 SER_Farming_Subsidies:0 "农业补贴"
 SER_Farming_Subsidies_desc:0 "奥地利人从我们这里夺走了很多东西，其中包括我们农民的牲畜。这项政府举措旨在进一步补贴我们的农民，使我们的农业水平恢复到大战前的生产水平。"
 SER_Continue_The_Mechanisation_Efforts:0 "继续农业机械化"
 SER_Continue_The_Mechanisation_Efforts_desc:0 "现代经济需要现代化的设备和技术。机械化无疑会提高大部分农民的生产力，即使这是一个漫长而昂贵的过程。"
 SER_Invest_In_Zadrugar:0 "投资合作社"
 SER_Invest_In_Zadrugar_desc:0 "作为我们农业机械化进程的一部分，随着拖拉机、农机零配件和维修需求的急剧上升，我们需要工业予以支持。谢天谢地，塞尔维亚公司“合作社”专门从事这一行业。在国家的补助下，他们能够更轻松地满足这些日益增长的需求。"
 SER_Rural_Credit_Banks:0 "农村信用银行"
 SER_Rural_Credit_Banks_desc:0 "简单地说，信贷往往集中在城市地区而非农村地区。但农村信贷银行在农业国家越来越普遍，塞尔维亚也不例外。农村信贷银行体系的建立是为了让贫农获得急需的金融支持和信贷。因此，政府应该加大支持力度，以帮助农村经济发展。"
 SER_Emergency_Economic_Relief:0 "紧急经济救济"
 SER_Emergency_Economic_Relief_desc:0 "黑色星期一冲击了整个欧洲，塞尔维亚也没法身处事外。我们必须迅速采取紧急措施，帮助那些由于自身原因而陷入困境的贫苦百姓。在经济重回正轨之前，我们必须尽可能避免民众在街头风餐露宿。"
 SER_Modernise_Belgrade:0 "现代化贝尔格莱德"
 SER_Modernise_Belgrade_desc:0 "虽然首都已经从大战的破坏中恢复过来，但与其他欧洲国家的首都相比，贝尔格莱德仍然相对落后。要把这座伟大的城市与现代世界接轨，我们需要更多的努力和投资。"
 SER_Resume_Cash_Crop_Exportation:0 "恢复经济作物出口"
 SER_Resume_Cash_Crop_Exportation_desc:0 "塞尔维亚保留着根深蒂固的农业经济，但孤立政策和最近的经济危机使塞尔维亚难以进口主要商品。在经济市场价格基本稳定的情况下，我们可以恢复农产品出口，并将这些利润用于投资。"
 SER_Form_The_State_Railway_Directorate:0 "建立国家铁路专署"
 SER_Form_The_State_Railway_Directorate_desc:0 "目前，我国的铁路由三个不同的竞争组织控制，这使得投资和建设成为一个艰难的过程。为了简化流程，我们有必要把这些组织集中在塞尔维亚国家铁路专署的控制下。"
 SER_Overhaul_Narrow_Gauge_Railways:0 "重修窄轨铁路"
 SER_Overhaul_Narrow_Gauge_Railways_desc:0 "由于塞尔维亚的地理位置，我国有许多线路使用窄轨距来节省费用，而窄轨也更容易穿越崎岖不平的地形。然而，这些铁轨的使用期限每况愈下，而且是在较低的标准下建造的，我们可以通过全面检修来提高铁轨的产能和质量。"
 SER_Expand_The_Bor_Mines:0 "发展博尔的矿业"
 SER_Expand_The_Bor_Mines_desc:0 "塞尔维亚位于博尔的矿山以及那里对我们至关重要的采矿业可以通过获得政府的一些支持进一步扩大规模。这将有助于我们在塞尔维亚东部开采更多资源，尽早实现经济独立。"
 SER_Expand_The_Radinac_Steel_Mill:0 "扩建拉迪纳克钢厂"
 SER_Expand_The_Radinac_Steel_Mill_desc:0 "拉迪纳克的钢厂是塞尔维亚为数不多也是最重要的钢铁厂之一。扩建那里的钢厂将减少我们对进口钢的依赖，毕竟钢铁是大多数重工业的基础。"
 SER_Found_FOMU:0 "建立乌日策军工厂"
 SER_Found_FOMU_desc:0 "乌日采武器和弹药工厂是塞尔维亚最重要的军事装备生产商之一，当然还是我国的军火生产商。随着巴尔干地区风暴将至，我们在未来会需要他们的帮助。"
 SER_Form_The_Military_Council:0 "组建军事委员会"
 SER_Form_The_Military_Council_desc:0 "由米兰·内迪奇将军在几年前主张建立的改革委员会将有助于我们新生军队的扩张和现代化。既然奥地利人不支持我们，是时候跟进内迪奇的提议并执行他的改革了。"
 SER_Organise_The_Chetniks:0 "组织祖国军"
 SER_Organise_The_Chetniks_desc:0 "自从世界大战结束以来，在这场注定要失败的战争中英勇战斗的塞尔维亚祖国军变成了四分五裂的无头苍蝇。通过召集他们的指挥官，我们可以建立一个统一的“祖国军联合会”，为塞尔维亚的未来而战。"
 SER_Modernise_The_Engineering_Battalions:0 "现代化工兵营"
 SER_Modernise_The_Engineering_Battalions_desc:0 "奥地利结束占领后我们迅速再武装的一个意外结果凸现出来。虽然我们对前线部队的改革是有效的，但我们的支援部队却被形象地抛在后面。改革委员会制定了支援部队现代化的计划，而他们已经着手于此。"
 SER_Support_Zastava:0 "支持扎斯塔瓦公司"
 SER_Support_Zastava_desc:0 "扎斯塔瓦是塞尔维亚最古老的公司之一，也是我国枪械和火炮的主要生产商。在我们继续重新整备我们的军队时，扶持他们会使我们受益颇多。"
 SER_Training_The_New_Guard:0 "训练新军官"
 SER_Training_The_New_Guard_desc:0 "世界大战在很多年前就结束了，很多老军官前仆后继。现在是时候培养一批新的军官来领导我们的部队了，他们要用他们前辈的宝贵经验武装自己。"
 SER_Modern_Howitzers:0 "现代榴弹炮"
 SER_Modern_Howitzers_desc:0 "内迪奇将军一直支持“压制火力”学说，而强大的炮兵为他的计划提供了强有力的支柱。塞尔维亚的榴弹炮曾令人闻风丧胆，现在它们还会再次令人战栗！"
 SER_New_Army_Tactics:0 "新陆军战术"
 SER_New_Army_Tactics_desc:0 "战争模式日新月异。20年前行之有效的方法在今天行不通，特别是随着空军和坦克的出现。改革委员会决心训练我们的士兵和军官们精通现代战争兵法。"
 SER_Begin_Mechanisation:0 "开始机械化"
 SER_Begin_Mechanisation_desc:0 "直到今天，塞尔维亚军队的实力一直建立在大头兵上。然而，随着科技的不断进步，汽车已成为提高士兵战斗力的关键。从现在起，我们将机动化我们的部队，使他们速度更快，得到更充分地休整。"
 SER_Import_Entente_Armour_Designs:0 "进口协约国装甲设计"
 SER_Import_Entente_Armour_Designs_desc:0 "现如今，先进的装甲技术被工团主义者、德国人和大西洋彼岸的老盟友瓜分。是时候去渥太华拜访我们的朋友了，我们希望能为我们的军队争取到一个团的坦克以备将来使用。"
 SER_Lessons_Of_The_War:0 "战争的教训"
 SER_Lessons_Of_The_War_desc:0 "尽管我们取得了对保战争的光荣胜利，但这并不是一场完美的胜利。有了前线的宝贵经验，改革委员会已经制定了克服我们所犯错误的计划，现在是付诸行动的时候了。"
 SER_Serbian_Mountain_Corps:0 "塞尔维亚山地部队"
 SER_Serbian_Mountain_Corps_desc:0 "巴尔干半岛的地形崎岖多山，特别是在我们要开垦的土地上。为了应对即将到来的战争，改革委员会正计划组建一支具有献身精神的新山地部队。他们配有最好的武器装备，由最优秀的将军领导，将成为我们最精锐的部队。"
 SER_Mihailovics_Redoubt:0 "米哈伊洛维奇工事"
 SER_Mihailovics_Redoubt_desc:0 "毫无疑问，德拉查·米哈伊洛维奇上校是位争议颇多的军官。然而，他也是一个有远见的人，他有高超的规划水平确保塞尔维亚本土无懈可击，以防我们的征服事与愿违。让我们拨给米哈伊洛维奇一些资金和人员，这样他就可以建立他设想的“堡垒”，并希望他停止插手内政。"
 SER_Expand_The_Serbian_Aviation_Command:0 "扩张塞尔维亚航空司令部"
 SER_Expand_The_Serbian_Aviation_Command_desc:0 "塞尔维亚的“空军”因为水平落后而无法匹敌奥地利/匈牙利的空军。现在这些混蛋卷土重来，塞尔维亚最高司令部认为有必要扩大空军联队的规模……我们是时候该找飞行员驾驶这些该死的物件了。"
 SER_Seek_New_Expertise:0 "寻求新航空技术"
 SER_Seek_New_Expertise_desc:0 "塞尔维亚没几个有经验的飞行员，必须寻求外国专家的帮助……问题该找谁……？"
 SER_Local_Munition_Efforts:0 "本土军火供应"
 SER_Local_Munition_Efforts_desc:0 "塞尔维亚希望自力更生，并开始鼓励当地工匠生产军火。如果这项努力要取得成果，就需要对其标准化，但从长远来看，我们将收益颇丰。"
 SER_Doctrinal_Studies:0 "学说研习"
 SER_Doctrinal_Studies_desc:0 "如果塞尔维亚想要掌握天空，我们还需要进行进一步的研究。这样我们的敌人再也不能完全控制我国领空。"
 SER_The_Serbian_Airforce:0 "真正的塞尔维亚空军"
 SER_The_Serbian_Airforce_desc:0 "塞尔维亚在外国顾问和本国人才的帮助下，现在已经采纳了真正的“塞尔维亚式”空军学说。与主同在，为了信仰和祖国！"
 SER_Fighter_Bomber_Acquisition:0 "战斗轰炸机或采购轰炸机"
 SER_Fighter_Bomber_Acquisition_desc:0 "根据我们的选择，我们现在必须购买新的飞机型号，以契合我国航空专家所提出的学说。"
 SER_Replace_Weltkrieg_Era_Planes:0 "更新大战战机"
 SER_Replace_Weltkrieg_Era_Planes_desc:0 "塞尔维亚航空队由几架大战时期的旧飞机组成，而奥地利人“慷慨”地允许我们拥有这些飞机。我们现在必须寻求新的设计来确保我们掌握塞尔维亚的制空权。"
 SER_Modernise_Airports:0 "现代化机场"
 SER_Modernise_Airports_desc:0 "贝尔格莱德机场的处境每况愈下。现在，随着奥地利人的离去，我们终于有机会对这个机场进行现代化改造，或许我们能从中受益。"
 SER_Local_Designs:0 "本土设计"
 SER_Local_Designs_desc:0 "我们的工程师现在有更多的机会接触外设计，他们已经能够自主设计出属于塞尔维亚自己的飞机，使塞尔维亚更有能力自力更生。"
 SER_Crna_Gora_I_Srbija:0 "塞黑联盟"
 SER_Crna_Gora_I_Srbija_desc:0 "历经风雨，贝尔格莱德和波德戈里察的塞尔维亚同胞们再次团结起来。让我们正式宣布这个新的南斯拉夫联盟正式成立，并把它作为建立一个更大联盟的第一步……"
 SER_Brotherly_Union:0 "兄弟同盟"
 SER_Brotherly_Union_desc:0 "对塞黑联盟的人民来说，有一种新的团结感油然而生。列强们试图通过战争和冲突来分裂我们，但他们失败了。让这个年轻的联盟成为这个满是混乱的地区中兄弟情谊的榜样。"
 SER_Prospecting_In_Niksic:0 "勘测尼克希奇"
 SER_Prospecting_In_Niksic_desc:0 "不负责任的克罗地亚政府从未利用过尼基希奇地区的巨额财富。现在，随着该地区获得解放，矿业公司已经开始在该地区进行大范围的挖掘。我们必须在这些项目上进行投资，并开采战争所需的资源。"
 SER_Integrate_The_Montenegrin_Economy:0 "整合黑山经济"
 SER_Integrate_The_Montenegrin_Economy_desc:0 "如果我们要充分利用波德戈里察蓬勃发展的经济，那么就需要采取重大措施让那里与我国的经济结构接轨。整合他们的银行和工厂的过程十分缓慢，但一旦完成，这对我们将是有利可图的。"
 SER_Connect_The_Railways:0 "连接铁路"
 SER_Connect_The_Railways_desc:0 "由于维也纳和我们的敌对关系，我们的铁路未在前黑山边界沿线修建。现在是时候消除我们之间的隔阂，使我们的国家团结起来。"
 SER_Revive_The_Serbian_Navy:0 "建立塞尔维亚海军"
 SER_Revive_The_Serbian_Navy_desc:0 "现代塞尔维亚国家由于是内陆国家，从未拥有过海军。建立一支海军来保护我们的新海岸线任重而道远，我们将需要我们新获得的领土和现有的河岸舰队来奠定塞尔维亚海军的基础。"
 SER_Dockyard_Construction:0 "修建船坞"
 SER_Dockyard_Construction_desc:0 "我们的岸防海军建设能力有限。要启动一个能够满足我国造船需求的海军工业，需要政府的大力投资。"
 SER_Form_A_Merchant_Navy:0 "组建商船队"
 SER_Form_A_Merchant_Navy_desc:0 "没有商船队的国家，就不会繁荣。现在，我们可以建立自己的商船队而不再依赖外国航运，我们的货物将由本国的商船队运输。"
 SER_Focus_On_Light_Ships:0 "专注轻型舰船"
 SER_Focus_On_Light_Ships_desc:0 "如果我们认为我们能负担得起建造一支庞大的舰队的费用，那我们就大错特错了。像驱逐舰和潜艇这样的小型舰船足以保护我们的海岸，并保证商船免受敌人的攻击。"
 SER_Shipbuilding_Investments:0 "投资造船业"
 SER_Shipbuilding_Investments_desc:0 "我们的造船厂缺乏经验，也缺乏资金；他们需要政府大力帮助，以解决这些问题。我们需要从他们那里订购更多的船只，并增加海军预算。这样我们的造船业就能克服在获取设备、经验丰富的专家、缺失的部件等方面的困难。"
 SER_First_Naval_Exercises:0 "第一次海军演习"
 SER_First_Naval_Exercises_desc:0 "塞尔维亚国旗将有史以来第一次出现在海上的船只上。为我们的新海军创立传统并非易事，虽然塞尔维亚缺少经验丰富的海员，但这是关键的第一步，塞尔维亚人民将证明自己有能力克服任何挑战。"
 serbia.0.t:0 "塞尔维亚王国"
 serbia.0.d:0 "1914年，一位塞尔维亚民族主义者暗杀了斐迪南大公，这成为了世界大战爆发的导火索。尽管奥匈帝国设想这一场轻松的战役，但奥地利军队直到保加利亚加入战争后才在1915年底占领塞尔维亚全境。战争结束后，塞尔维亚的南部领土被划给保加利亚，而其余的领土则被奥地利占领，直到1926年，由于帝国其他地方的种族关系日益紧张，奥地利人这才撤军，他们任命战争英雄彼得·博约维奇为摄政王。\n\n从那时起，塞尔维亚一直在夹缝中求生存，因为她知道自己无法抵挡任何形式的军事入侵，所以一直保持低调。随着时间的推移，塞尔维亚政府中的沙文主义势力开始抬头，他们自知塞尔维亚不可能击败奥地利，因此把注意力转向南方的马其顿。为了破坏保加利亚在该地区的霸权，他们已经和跟保加利亚反目成仇的罗马尼亚政府和希腊政府进行了几次外交会谈，一些人认为三国正式结盟的日子已经不远了。\n\n与此同时，塞尔维亚的王位仍然空空如也。奥地利威胁说，卡拉乔杰维奇家族一旦复位，他们将进行干预。元帅也遵守了奥地利的要求，阻止了前王储亚历山大回国的企图，并在这一过程中排挤了许多保皇党人。在摄政逐渐失去各方支持的情况下，塞尔维亚能否在“保加利亚问题”上取得胜利？如果她能成功地击败保加利亚，那她能最终击败宿敌奥地利，实现她建立泛斯拉夫联盟的梦想吗？"
 serbia.0.a:0 "塞尔维亚将再次强大！"
 serbia.3.d:0 "上个月，奥地利军队缓慢撤离边境，我们当中的许多人感到震惊和困惑。然而奥地利似乎仍有新的安排。随着哈布斯堡家族遭到内乱加剧的报应，他们只留下了一支卫戍边境的精锐部队。显然，他们对贝尔格莱德的持久监视已经结束，而我们终于摆脱了压迫我们二十年之久的枷锁！\n\n但是我们该如何行使新发现的自由呢？彼得·博约维奇，我们执政长久的摄政王和元帅，进行了多次的思索考量，但还是没有答案。他知道奥地利很可能会带着更多的人回来，所以我们的机会很渺茫。受“黑色星期一”的影响，我们也遭到削弱，这也让我们的机会变得更渺茫。面对这一千载难逢的机会，他不能做缩头乌龟，因此博约维奇预计将在未来几周内采取政治行动，巩固塞尔维亚的独立。"
 serbia.3.a:0 "我们摆脱了奥地利的桎梏。至少现在如此。"
 serbia.4.d.CRO:0 "自从我们建立伊利里亚国家以来，我们一直希望南斯拉夫土地上的种族冲突能够消散。我们的目前的情况在很大程度上是这样的，因为叛乱激进运动已经消失殆尽，以前的反维也纳团体也选择向我们效忠。但很明显，黑山地区的情况并非如此，该地区长期受到亲塞尔维亚活动的困扰。\n\n在过去几年里，尽管我们试图镇压塞黑统一人民党的活动，但该组织反而不断壮大。他们反对克罗地亚人主导的伊利里亚议会，并抗议黑山人在国家事务中缺乏发言权。此外，他们最近巩固了对地方议会的控制，这使的他们的行为更令我们恼火。但我们目前没有证据表明最近持续升温的动乱就是塞尔维亚这个渣滓国家在煽风点火，如果局势恶化，这些黑山人肯定会试图利用动乱宣布独立。"
 serbia.4.d.AUS:0 "自从我们设立伊利里亚王国以来，我们一直希望南斯拉夫土地上的种族冲突能够消散。我们的目前的情况在很大程度上是这样的，因为叛乱激进运动已经消失殆尽，以前的反维也纳团体也选择向我们效忠。但很明显，黑山地区的情况并非如此，该地区长期受到亲塞尔维亚活动的困扰。\n\n在过去几年里，尽管我们试图镇压塞黑统一人民党的活动，但该组织反而不断壮大。他们反对克罗地亚人主导的伊利里亚议会，并抗议黑山人在国家事务中缺乏发言权。此外，他们最近巩固了对地方议会的控制，这使的他们的行为更令我们恼火。但我们目前没有证据表明最近持续升温的动乱就是塞尔维亚这个渣滓国家在煽风点火，如果局势恶化，这些黑山人肯定会试图利用动乱宣布独立。"
 serbia.7.d.CRO:0 "我们知道黑山的动乱令人焦头烂额，但现在说什么都是纸上谈兵，我们随时都有可能在最轻微的危机中崩溃。\n\n几天前，一名同情工团主义的克罗地亚士兵谋杀了一个塞尔维亚家庭后自杀的案件使波德戈里察陷入混乱。该地区的军队也因此变成了过街老鼠，他们无力平息抗议，该地区首都的秩序最终崩溃。黑山人民党暨黑山议会的资深领袖安德里亚·拉多维奇宣布黑山脱离伊利里亚联邦。几个小时后，另一项法案被通过，该法案旨在让塞尔维亚和黑山建立一个正式的南斯拉夫联盟，同时伊利里亚军队被允许安全离开现在属于塞尔维亚的领土。在短短的6个小时内，黑山就这么被合法地并入塞尔维亚。\n\n这些事件令人高度怀疑，但有关黑山独立和联盟组建的一切似乎都是合法的，塞尔维亚人似乎没有鲁莽地干涉我们的事务，而他们的政党对此秉持中立立场。不管怎样，整件事都很离谱，而这件事对伊利里亚民族来说是一个不稳定的因素。很明显，如果我们想继续维持我们的国家，我们必须马上对我们境内的塞尔维亚人做出让步，即使这会在政治上赋予我们的对手——克罗地亚-塞尔维亚联盟一些权力。"
 serbia.7.d.AUS:0 "我们知道黑山的动乱令人焦头烂额，但现在说什么都是纸上谈兵，我们随时都有可能在最轻微的危机中崩溃。\n\n几天前，一名同情工团主义的克罗地亚士兵谋杀了一个塞尔维亚家庭后自杀的案件使波德戈里察陷入混乱。该地区的军队也因此变成了过街老鼠，他们无力平息抗议，该地区首都的秩序最终崩溃。黑山人民党暨黑山议会的资深领袖安德里亚·拉多维奇宣布黑山脱离伊利里亚联邦。几个小时后，另一项法案被通过，该法案旨在让塞尔维亚和黑山建立一个正式的南斯拉夫联盟，同时伊利里亚军队被允许安全离开现在属于塞尔维亚的领土。在短短的6个小时内，黑山就这么被合法地并入塞尔维亚。\n\n这些事件令人高度怀疑，但有关黑山独立和联盟组建的一切似乎都是合法的，塞尔维亚人似乎没有鲁莽地干涉我们的事务，而他们的政党对此秉持中立立场。不管怎样，整件事都很离谱，我们有必要做出回应。正如预期的那样，军方提议我们进行全面动员，一劳永逸地解决塞尔维亚问题。这一提案很诱人；塞尔维亚在“黑色星期一”之后也被削弱了，根据情报部门的反馈，他们的人力严重不足。然而，由于担心战争的爆发可能导致奥地利和匈牙利凝聚在一起的脆弱体系崩溃，皇帝拒绝批准军事行动。相反，他要求我们发出一份严厉的外交投诉，同时准备在帝国内部问题解决后解散他们的同盟。"
 serbia.11.b:0 "我们不能激怒奥地利"
 serbia.14.b:0 "镇压这些叛国者！"
 serbia.22.b:0 "民主党赢了"
 serbia.22.c:0 "人民激进党获胜"
 serbia.31.t:0 "彼得的加冕礼"
 serbia.31.d:0 "今天，年轻的王储彼得接受加冕礼，成为塞尔维亚国王彼得二世。在圣米哈依尔大教堂的大厅里，齐夫科维奇总理在向新国王转达加冕礼完成之前，发表了一篇简短而振奋人心的演讲，试图给这场沉闷的活动带来些许活跃的气氛。\n\n彼得在现场也说了几句话，他希望这个国家能够从他父亲遇刺的悲痛中恢复过来，并保证在他的领土内，塞尔维亚的所有民族都会享有平等权利。尽管这显然是表达对宪政的支持，但几乎可以肯定的是，不管彼得是否成年，这位年轻的国王目前仍将受到齐夫科维奇政府的控制。\n\n人们的情绪可能毫无波澜，但今天的仪式对于塞尔维亚的长治久安非常重要。随着王国的安全得到保障，我们可以回过头来去彻底根除马内革的威胁。"
 serbia.31.a:0 "真的吗？"
 serbia.36.t:0 "[From.GetNameDefCap]拒绝加入研究计划"
 serbia.36.d:0 "今天，我们收到了[From.GetNameDef]的回信，他们拒绝加入我们提议的巴尔干研究计划。[From.GetAdjectiveDef]外交官在礼貌但坚定的声明中指出，他们怀疑我们建立该组织的没安好心，因此不愿与我们分享其国家机密。"
 serbia.36.a:0 "他们吃亏"
 serbia.37.t:0 "巴尔干研究计划的终结"
 serbia.37.d.war:0 "今天，[From.GetAdjectiveDef]大使馆发了一份我们盼望已久的电报。在我们向巴尔干研究计划的一个成员国宣战之后，[From.GetNameDef]作出行政决定：立即将我们从该组织中除名，但仍保留我们过去与他们分享的军事和工业计划。从本质上讲，我们已经丧失了本属于我们的特权地位。"
 serbia.37.d.joined_other_faction:0 "今天，[From.GetAdjectiveDef]大使馆发了一份我们盼望已久的电报。在我们离开[From.GetFactionName]后，[From.GetNameDef]作出行政决定：立即将我们从该组织中除名，但仍保留我们过去与他们分享的军事和工业计划。从本质上讲，我们已经丧失了本属于我们的特权地位。"
 serbia.37.a:0 "他妈的"
 serbia.38.t:0 "[From.GetNameDefCap]希望加入[Root.GetFactionName]"
 serbia.38.d:0 "我们收到[FROM.GetNameDef]发来的一封电报，他们要求我们加入[ROOT.GetFactionName]。在电文中，他们提到了[From.GetAdjectiveDef]和我们政府之间的长期联系，他们同时也保证他们的大军将应对[ROOT.GetFactionName]预见的任何冲突。我们应该如何回应？"
 serbia.38.a:0 "多多益善"
 serbia.38.b:0 "他们真难缠"
 serbia.39.t:0 "[From.GetNameDefCap]接受联盟提议！"
 serbia.39.d.ENT:0 "看来我们加入[From.GetFactionName]的努力已经取得了成果。今天，来自[From.GetNameDef]的外交官会见了总理大人，正式接受了我们的要求，即重新加入我们以前的组建的军事同盟，参与他们将来与工团主义者的冲突。未来几天，[From.GetFactionName]成员国和[Root.GetNameDef]将签署一项正式条约，巩固我们重铸的外交关系。"
 serbia.39.d.RUS:0 "看来我们加入[From.GetFactionName]的努力已经取得了成果。今天，来自[From.GetNameDef]的外交官会见了总理大人，正式接受了我们的要求，即我们与我们的血缘同胞再次联手，参与他们将来对抗欧洲霸主的冲突。未来几天，[Root.GetNameDef]和[From.GetNameDef]将签署一项正式条约，巩固我们重铸的外交关系。"
 serbia.39.a:0 "让我们再次结盟！"
 serbia.40.t:0 "[From.GetNameDefCap]解散了贝尔格莱德条约"
 serbia.40.d:0 "今天，我们收到了来自[From.GetNameDef]的加急电报。在最近的外交谈判之后，[From.GetAdjectiveDef]官方已经决定解散贝尔格莱德条约，理由是欧洲局势已经发生了不可估量的变化，一个小小的区域同盟将无法再保护巴尔干免受外部威胁。他们为此道歉，并恳求我们效仿他们，寻求更强大的势力庇护。"
 serbia.40.a:0 "好吧"
 serbia.41.t:0 "[From.GetNameDefCap]拒绝结盟"
 serbia.41.d:0 "看来我们加入[From.GetFactionName]的努力失败了。今天，来自[From.GetNameDef]的外交官对总理大人做出了正式回应，拒绝我们直接加入[From.GetFactionName]。无论好坏，我们目前在外交上仍将与欧洲各列强保持孤立状态。"
 serbia.41.a:0 "“旧情谊”到此为止。"
 serbia.42.t:0 "祖国军在波斯尼亚起义"
 serbia.42.d:0 "我们联合各路祖国军人马聚集在“祖国军联合会”麾下的工作似乎是在做无用功，但努力终有回报。我军入侵波斯尼亚后，祖国军分遣队在敌后根据地挺身而出，为塞尔维亚而战！根据联合会的回复，这些分遣队已经卧薪尝胆了好几个月，为迎接我们最后的清算做准备。"
 serbia.42.a:0 "太好了！"
 serbia.50.t:0 "身居高位的老朋友"
 serbia.50.d:0 "看来我们在“协约国”旧圈子里仍有人缘，并且设法得到了俄罗斯和法国（而不是那些自称法国正统的工团主义混蛋）的同情。这两个国家似乎在空军方面采用了类似的学说，其核心是支援地面部队。看起来他们只在空军是否独立这个问题有所不同，俄罗斯倾向于使用战术轰炸机，但更多地受陆军的指挥机构控制，而法国则使用轻小灵活的战斗歼击机，但让空军处于独立地位。"
 serbia.50.a:0 "我们将听从斯拉夫同胞的慧言。"
 serbia.50.b:0 "法国人是天空的主宰。"
 serbia.50.c:0 "免谈"
 serbia.51.t:0 "更替大战航空队"
 serbia.51.d:0 "塞尔维亚航空司令部正寻求新的外国设计来取代老化的航空队，并扩大其规模。现在法国为我们提供了一小部分战斗机，并获得在塞尔维亚建造的许可；而俄国给了我们一个完整的样机，尽管我们缺乏维护它的相关部件；最后，我们收到了从意大利走私来的大战时代老飞机，尽管这一提议与司令部先前的要求背道而驰。"
 serbia.51.a:0 "俄国的提议很诱人"
 serbia.51.b:0 "法国设计正是我们所需的"
 serbia.51.c:0 "量变引起质变"
 serbia.52.t:0 "采办地面支援机机型"
 serbia.52.d:0 "由于我们的飞行员展现出了他们的价值，我们必须得到合适的机型，以契合我们的顾问所提出的学说。"
 serbia.52.a:0 "这火力令人神往！"
 serbia.52.b:0 "法国设计，如此华丽"
 serbia.52.c:0 "意大利的轰炸机不容错过……"
 serbia.53.t:0 "维多夫丹"
 serbia.53.d:0 "维多夫丹是纪念圣徒拉扎尔王子和塞尔维亚于1389年6月28日在科索沃对奥斯曼帝国的史诗般的战役中神圣的殉道者的纪念日。是他们用生命来捍卫真正的信仰，在塞尔维亚维多夫丹被看作是一个全国性的节日。"
 serbia.53.a:0 "塞尔维亚将永远不忘记那些英雄！"
 serbia.54.t:0 "贝尔格莱德-萨洛尼卡铁路竣工"
 serbia.54.d:0 "自从第四次巴尔干战争结束并开始对马其顿进行开发以来，塞尔维亚和希腊的承包商一直在更替和连接贝尔格莱德到萨洛尼卡的铁路线，而这条铁路使两国心脏地带之间的长途旅行成为可能。今天，贝尔格莱德-萨洛尼卡铁路线的处女行开始了。列车从塞尔维亚出发，向南蜿蜒驶入希腊。这段旅程以塞尔维亚和希腊总理的会晤结束，充分彰显了巴尔干国家之间的政治团结。"
 serbia.54.a:0 "塞尔维亚将永远不忘记它的盟友！"
 serbia.55.t:0 "[From.GetName]想购买HMS狮号战列巡洋舰！"
 serbia.55.d:0 "[From.GetName]正处于工业化和重整军备的过程之中，他们向我们提出购买过时的HMS狮号战列巡洋舰，并成为他们海军的旗舰。这艘船肯定会帮助[From.GetAdjective]政府对抗邻国的海军。"
 serbia.55.a:0 "我们可以卖了这艘破铜烂铁赚一笔。"
 serbia.55.b:0 "不，我们每艘船都有用！"
 serbia.56.t:0 "[From.GetName]同意向我们出售HMS狮号战列巡洋舰"
 serbia.56.d:0 "[From.GetAdjective]政府已经同意向我们出售狮号。他们已经把这艘船移交给我们了，但我们得自己把它开到塞尔维亚。有了这艘船作为补充，我们的海军将统治亚得里亚海。"
 serbia.56.a:0 "今天是个好日子！"
 serbia.57.t:0 "[From.GetName]拒绝向我们出售HMS狮号战列巡洋舰"
 serbia.57.d:0 "[From.GetAdjective]政府已经拒绝向我们出售那艘老旧的战列巡洋舰作为我们海军的旗舰！我们必须寻找另一个解决方案。"
 serbia.57.a:0 "我们会记上的"
 serbia.58.t:0 "塞尔维亚要求黑山"
 serbia.58.d:0 "复兴后的塞尔维亚今天向我们施压，要求我方放弃黑山。长期以来，该省的大部分塞族人都希望加入塞尔维亚。作为对割让该省的回报，塞尔维亚保证，他们不会再要求任何伊利里亚的土地。"
 serbia.58.a:0 "这将是最好的结果"
 serbia.58.b:0 "塞尔维亚应该保持小国的地位"
 serbia.59.t:0 "[From.GetName]割让黑山"
 serbia.59.d:0 "今天，塞尔维亚终于获得了进入亚得里亚海沿岸的机会。[From.GetName]同意将黑山割让给我们，以换取对伊利里亚剩余领土完整的保证。当然，我们只会坚持那些我们认为合适的内容。"
 serbia.59.a:0 "欢迎回到祖国，兄弟们"
 serbia.60.t:0 "[From.GetName]拒绝割让黑山"
 serbia.60.d:0 "[From.GetName]的敌人拒绝割让本应属于我们的黑山。由于所有的外交方法都已用尽，我们唯一能做的就是为黑山开战。"
 serbia.60.a:0 "进攻！"
 serbia.60.b:0 "不幸的是，我们不得不静候良机"
 serbia.61.t:0 "整合阿尔巴尼亚"
 serbia.61.d:0 "阿尔巴尼亚是我国的一部分，但大部分人对我们的存在抱持敌意。我们可以开启一个整合过程，让他们与我方政策保持一致，最终使其成为[Root.GetAdjective]国家的一个组成部分。"
 serbia.61.a:0 "开启整合进程！"
 serbia.61.b:0 "这可不是什么好主意"
 serbia.61.tt:0 "§Y这将在阿尔巴尼亚引起巨大动荡§!"
 serbia.62.t:0 "阿尔巴尼亚动荡"
 serbia.62.d:0 "阿尔巴尼亚的一体化进程正在进行中，但是当地居民已经对我们同化政策极为不满。地拉那街头爆发了骚乱。有人建议我们放弃使阿尔巴尼亚完全并入塞尔维亚的企图。"
 serbia.62.a:0 "阿尔巴尼亚是塞尔维亚的一部分！"
 serbia.62.b:0 "放弃我们的计划"
 serbia.63.t:0 "阿尔巴尼亚局势缓和"
 serbia.63.d:0 "阿尔巴尼亚的一体化进程导致我们与当地民众的关系非常紧张。我方警察和军队正致力于搜寻和监禁那些应为革命言论负责的人，他们中的大多数人目前都已被捕。因此，紧张局势已经有所缓和，我们可以继续努力将他们完全融入塞尔维亚。"
 serbia.63.a:0 "好啊！"
 serbia.64.t:0 "阿尔巴尼亚已被整合"
 serbia.64.d:0 "我们已经完成了阿尔巴尼亚的一体化进程。阿尔巴尼亚现在终于是塞尔维亚国家不可分割的一部分了。"
 serbia.64.a:0 "好啊！"
 serbia.65.t:0 "阿尔巴尼亚动荡"
 serbia.65.d:0 "阿尔巴尼亚的一体化进程正在进行中，但当地居民对我们的同化政策并不满意。虽然警察和军队尚且能够镇压大多数破坏行动，但一些小规模的抵抗组织正试图骚扰我们的占领区驻军。无论如何，一些政治家建议我们放弃将阿尔巴尼亚完全并入塞尔维亚的企图。"
 serbia.65.a:0 "阿尔巴尼亚是塞尔维亚的一部分！"
 serbia.65.b:0 "放弃我们的计划"
 serbia.66.t:0 "阿尔巴尼亚动荡"
 serbia.66.d:0 "阿尔巴尼亚的一体化进程正在进行中，但当地居民对我们的同化政策并不满意。到目前为止，他们的抵制表现还仅限于地拉那的一些示威活动和零星的非暴力不合作行为。无论如何，一些政治家建议我们放弃将阿尔巴尼亚完全并入塞尔维亚的企图。"
 serbia.66.a:0 "阿尔巴尼亚是塞尔维亚的一部分！"
 serbia.66.b:0 "放弃我们的计划"
 serbia.67.t:0 "阿尔巴尼亚的叛乱骚动"
 serbia.67.d:0 "我们对阿尔巴尼亚的整合进程并不成功。当地居民仍在激烈抵制我方军队的占领行动，让塞尔维亚人的生活日渐艰难。有消息称，一些反叛团体正在呼吁对我方占领区发动彻底的革命。我国政府中的鸽派人士认为，血已经流得够多了，应该给予阿尔巴尼亚有限的自治权。"
 serbia.67.a:0 "我们绝不屈服！"
 serbia.67.b:0 "给予阿尔巴尼亚有限的自治权"
 serbia.68.t:0 "阿尔巴尼亚叛乱"
 serbia.68.d:0 "我们对阿尔巴尼亚的整合进程并不成功。反叛组织已经控制了地拉那及其周边地区。阿尔巴尼亚在争取独立的斗争中公然发动叛乱。"
 serbia.68.a:0 "进攻！"
 serbia.68.b:0 "随他们去吧"
 serbia.100.t:0 "进一步改革？"
 serbia.100.d:0 "德拉戈米尔·瓦西奇对社会主义的同情早已不是秘密，当我们的领导人还是一个律师的时候，就曾为被摄政王非法逮捕的社会主义者做过辩护。随着新生的南斯拉夫与第三国际订立互助友好条约，瓦西奇希望更一步，进行全面的社会主义改革，并加入第三国际。毫无疑问，政府当中的右派对此表示了激烈的反对，但归根结底，决定权在瓦西奇手上。"
 serbia.100.a:0 "现在就挺好。"
 serbia.100.b:0 "向社会主义转型！"
 serbia.101.t:0 "南斯拉夫寻求统一"
 serbia.101.d:0 "南斯拉夫寻求统一"
 serbia.101.a:0 "算了吧。"
 serbia.101.b:0 "当然！"
 serbia.102.t:0 "帝国狂想？"
 serbia.102.d:0 "随着南斯拉夫统一，我国地位水涨船高，以至于政府里有人提出了一个及其荒诞的想法：宣称自己为拜占庭乃至罗马的继承人。毕竟我们今天的地位与巅峰时期的拜占庭相当：东正教占主要地位，且在巴尔干影响力巨大。但这一行为毫无疑问会惹怒不少国家。我们应如何抉择？"
 serbia.102.a:0 "这简直是胡说八道！"
 serbia.102.b:0 "我们将继承拜占庭遗产！"
 serbia.102.c:0 "我们将继承罗马遗产！"
 SER_redirect_war_funds:0 "调整战争资金"
 SER_redirect_war_funds_desc:0 "第四次巴尔干战争已经落下帷幕，我们或许可以把那些投入于战争的资金用于国内的发展。我们可以把投资的重点放在从德国暴君的手中夺回纯净的塞尔维亚土地上。"
 SER_by_jingo:0 "唯有侵略！"
 SER_by_jingo_desc:0 "我们必须全力以赴，摧毁奥地利民族，保卫自身的安全。塞尔维亚周围恶敌环绕，我们必须确保塞尔维亚母亲将永远不会再受到威胁。"
 SER_Import_Russian_Armour_Designs:0 "引入俄国装甲设计"
 SER_Import_Russian_Armour_Designs_desc:0 "那些富有创造力且聪明的光荣斯拉夫人，将为我们伸出援助之手。我们将就装甲载具的进口问题与俄罗斯进行商谈，并将其投入军事用途。"
 SER_serbia_strong:0 "领导你的塞族人！"
 SER_serbia_strong_desc:0 "谓他国最强之言皆乃谎言，唯一国之词实为真理。毫无疑问，塞尔维亚才是世界上最强大的国家，而我们将坐实这一事实。"
 SER_claim_hungarian_yugoslavia:0 "夺取匈牙利的南斯拉夫碎片"
 SER_claim_hungarian_yugoslavia_desc:0 "虽然我们成功入侵了奥地利，但大塞尔维亚的实现仍然面临重大阻碍。阜姆与扎达尔以及匈牙利的部分地区是构建南斯拉夫之梦的核心，我们必须收复它们！"
 SER_military_industry:0 "为塞族之国劳动"
 serbia.23.tt:0 "§R阿尔巴尼亚的动乱会继续下去……§!"
 dhserbia.11.b:0 "乔治国王万岁！"
 dhserbia.26.t:0 "国王的父亲去世"
 dhserbia.26.d:0 "国王的父亲亚历山大二世寿终正寝，为此我们将举行为期一周的哀悼活动，悼念他的离世。"
 dhserbia.26.a:0 "准备必要的安排"
 BAN_balkan_union_radical_socialist:0 "巴尔干联合工人国"
 serbia.103.t:0 "退休？"
 serbia.103.d:0 "晨雾如一层薄纱笼罩着贝尔格莱德，仿佛在诉说着过去的血与火，和未来的不可知。\n在经历了无数的斗争和牺牲后，塞尔维亚终于在博约维奇的领导下，与其他斯拉夫兄弟们一道，组建了南斯拉夫。曾经四分五裂的民族如今团结在同一个旗帜下。这个由多个民族、文化和语言编织而成的国家，承载着无数人的希望，也被无数人的质疑所围绕。元帅已经垂垂老矣，如今他不得不开始只能被自己的继承人。他可以将权力交给自己一直以来的盟友米兰·斯托亚迪诺维奇，带领这个新生的国家迎接更为严峻的挑战；亦或是将政权交给年轻也更激进的德沃尼科维奇，组建全南斯拉夫民族联盟，致力于民族和解与文化融合，但他毫不遮掩的亲社会主义倾向与克族身份恐怕难以服众。无论如何，元帅的时间不多了，他必须尽快做出决定。"
 serbia.103.a:0 "博约维奇决定将权力交给米兰·斯托亚迪诺维奇。"
 serbia.103.b:0 "博约维奇决定将权力交给德沃尼科维奇。"
 SER_our_commitment_to_democracy:0 "我们对民主的承诺"
 SER_our_commitment_to_democracy_desc:0 "共和党自成立之初就只有一个纲领：将民主带回塞尔维亚。我们反对王室的幕后操纵，反对军官团的干政传统，反对任何形式的独裁诱惑。权力必须来自选票，必须接受议会监督，必须定期更替，这是我们的原则。"
 SER_shadow_of_konspiracija:0 "“孔斯皮拉齐亚”之影"
 SER_shadow_of_konspiracija_desc:0 "够了。我们带着民主的承诺上台，看到的却是议会里无休止的争吵、地方上贪腐的官僚、以及一个永远无法果断行动的政府。塞尔维亚不需要民主，塞尔维亚需要领袖。“孔斯皮亚齐拉”——阴谋——这个词在贝尔格莱德的咖啡馆里被反复提及。那就让他们说去吧。领袖的意志，胜过一千场辩论。"
 SER_rule_of_SKK:0 "文化俱乐部的统治"
 SER_rule_of_SKK_desc:0 "政党的基础是利益，文化的基础是精神。我们将以塞尔维亚文化俱乐部为核心，吸纳学者、作家、神职人员和传统士绅，重建一种超越党争的治理模式。不由某个阶级或行业的代表，而是民族文化的守护者来制定政策。政治必须从文化的根系中生长出来。"
 SER_intergrate_socialists:0 "整合社会主义者"
 SER_intergrate_socialists_desc:0 "工人不必要是我们的敌人。那些真诚信仰社会主义的工人领袖，只要愿意放弃国际主义的幻想、承认民族利益高于阶级利益，就可以在新政权中拥有一席之地。我们将把他们的组织纳入国家框架，把他们的诉求转化为民族工业发展的动力。"
 SER_voice_of_nation:0 "民族之声"
 SER_voice_of_nation_desc:0 "媒体不可是第四权力，媒体应当是是民族灵魂的扩音器。所有报刊、广播和出版社将被整合进“民族之声”体系，接受文化俱乐部的统一指导。可以有不同风格，但只能有一种方向——民族的方向。"
 SER_expand_chetniks:0 "扩展祖国军"
 SER_expand_chetniks_desc:0 "正规军受制于旧条约和外国观察员的耳目。我们需要一支完全掌握在自己手中的武装力量。“祖国军”作为志愿民兵组织，将在全国各县扩编。退役军官担任教官，文化俱乐部分部负责政治指导。他们将是领袖之剑，民族之盾。"
 SER_might_makes_freedom:0 "铁拳带来自由"
 SER_might_makes_freedom_desc:0 "自由不是无政府。真正的自由，是一个塞尔维亚人走在安全的街道上，知道自己的土地不被外国染指，知道自己的孩子在学塞尔维亚的历史而非什么“世界公民”的谎言。这些需要铁拳来保障。铁拳打击腐败，铁拳肃清颠覆，铁拳让所有敌人闭嘴。然后你才能呼吸到自由的空气。"
 SER_national_central_committee:0 "全国中央委员会"
 SER_national_central_committee_desc:0 "议会休会，无限期休会。立法权移交全国中央委员会，成员由领袖任命，向领袖负责。各部大臣不再接受质询，只执行委员会的决定。有人说这是独裁，我们告诉他们：这是高效。"
 SER_democracy_is_fucked:0 "§R塞尔维亚不需要民主，只需要领袖。§!"
 SER_maintain_left_democracy:0 "维持左翼民主"
 SER_maintain_left_democracy_desc:0 "社会党通过选举上台，就应当在选举框架内施政。我们拒绝任何效仿东方的“无产阶级专政”模式。塞尔维亚的社会主义，必须在议会民主的土壤里生长，必须接受选民的下一次审判。否则，我们与那些右翼威权主义者有何区别？"
 SER_suspend_elections:0 "暂停选举"
 SER_suspend_elections_desc:0 "战争迫在眉睫。保加利亚人在边境集结，国内反动势力蠢蠢欲动。此刻我们不能冒险让一场选举把政权交还给那些软弱或叛国的势力。选举将暂停，直到国家安全得到保障。这是临时措施，一切权力仍以宪法为依据。"
 SER_general_union:0 "组建全国总工会"
 SER_general_union_desc:0 "分散的行业工会将被整合为“塞尔维亚全国总工会”。不是说国家要接管工会，这是工会在接管自己。总工会拥有集体谈判权、罢工批准权和对劳动立法的建议权。工人的声音必须通过统一的渠道发出，否则就只是噪音。"
 SER_broad_party_union:0 "广泛政党联盟"
 SER_broad_party_union_desc:0 "社会党不谋求单独执政。我们邀请部分愿意合作的其他党团的温和派，共同组建广泛政党联盟。内阁席位按比例分配，重大决策须经联盟委员会协商。这是团结政府的有效方法。"
 SER_expand_police:0 "扩展警察局"
 SER_expand_police_desc:0 "秩序是革命的氧气。旧警察系统腐败低效，无法应对当前复杂的治安形势。我们将大规模招募出身工人和贫农的新警员，扩充警察局的编制与预算。治安管辖权从地方士绅手中收回，交给职业化高素养的警察队伍。"
 SER_learn_english_mode:0 "学习英国模式"
 SER_learn_english_mode_desc:0 "伦敦的工党同志们走出了一条不同的道路：避免了暴力推翻国家机器，通过选举控制它，然后改造它。我们研究英国工会大会的组织形式，研究战时内阁的集权经验。一个强有力的工团色彩的中央，配合一个驯服的议会——这就是塞尔维亚需要的“英国模式”。"
 SER_cooperate_with_capital:0 "向资本让步"
 SER_cooperate_with_capital_desc:0 "理想很丰满，可是现实呢？大规模国有化和激进的土地改革正在引发资本外逃和生产混乱。我们不得不做出让步：暂停部分国有化计划，保障合法私有财产，向国内外的资本家发出“投资安全”的信号。这固然是退却，但退却是为了不被消灭。"
 SER_ensure_army_support:0 "确保军队支持"
 SER_ensure_army_support_desc:0 "任何左翼政府如果不能确保军队的忠诚，都将在第一次危机中垮台。我们不要求军队政治化，我们要求军队国家化。人事任命尊重军功而非出身，军饷按时足额发放，军官团的社会地位得到保障。作为交换，军队当然会宣誓效忠宪法——以及宪法框架内产生的合法政府。"
 SER_social_nationalism:0 "社会民族主义"
 SER_social_nationalism_desc:0 "社会主义与国际主义之间没有必然的等号。塞尔维亚的工人首先关心的是塞尔维亚的工厂，塞尔维亚的农民首先关心的是塞尔维亚的土地。我们提出“社会民族主义”：民族范围内的社会正义，社会正义基础上的民族团结。国际团结可以有，民族利益必须优先。"
 SER_serbian_social_democracy:0 "塞尔维亚特色社会民主主义"
 SER_serbian_social_democracy_desc:0 "我们既不是巴黎的附庸，也不是伦敦的复制品。塞尔维亚有自己的国情：小农为主的经济、薄弱的工业基础、复杂的民族构成。因此，我们的社会民主主义必须是塞尔维亚特色的：保留合作社传统，渐进改良而非激进颠覆，承认正教会在农村的道德权威。教条主义者会骂我们不够纯粹，那就随他们骂去吧。"
 SER_federalize_process:0 "联邦化进程"
 SER_federalize_process_desc:0 "塞尔维亚、克罗地亚、斯洛文尼亚、波斯尼亚、马其顿、黑山——这些土地上的南斯拉夫民族，应当在社会主义框架下自愿联合。联邦化进程启动：各民族拥有文化自治权，各联邦单位拥有地方立法权，中央保留国防、外交和宏观经济调控。"
 SER_make_tukovic_proud:0 "让图科维奇为我们骄傲"
 SER_make_tukovic_proud_desc:0 "迪米特里耶·图科维奇，塞尔维亚社会主义之父——如果在天有灵，会如何看待我们今天的选择？他死在了1914年的前线，为的是保卫塞尔维亚的土地。他没有机会看到俄国革命，也没有机会在莫斯科与伦敦之间做出选择。我们相信，他会理解我们的谨慎，会认可我们对民族利益的坚守。让图科维奇为我们骄傲！"
 SER_puppet_democracy:0 "傀儡民主"
 SER_puppet_democracy_desc:0 "选举如期举行。结果也如期公布。反对党可以在规定的选区获得规定的席位，可以在规定的报纸上发表规定的批评。外国观察员会收到一份体面的报告，证明塞尔维亚的民主运转良好。至于权力——权力从不进入投票箱。权力会很好的留在它一直待着的地方。"
 SER_protect_democracy:0 "民主守卫者"
 SER_protect_democracy_desc:0 "民主党与激进党之间的分歧足以写满整部议会记录。但在保卫民主制度这一点上，我们找到了共同的底线。王室干政必须停止，军官团必须退回军营，选举必须自由且公正。这份联盟是为了让塞尔维亚人继续拥有选择自己政府的权利。"
 SER_guide_of_orjuna:0 "奥朱纳之指引"
 SER_guide_of_orjuna_desc:0 "“奥朱纳”——Yugoslavenska Nacionalna Organizacija——这个名字在战后的混乱中被提起得越来越多。一个超越政党的民族组织，一个以纪律和忠诚锻造的核心团体，才是国家真正的舵轮。民主的形式可以保留，但方向必须由我们来指引。奥朱纳的精神就是团结政府的精神。"
 SER_one_party_democracy:0 "一党独大民主"
 SER_one_party_democracy_desc:0 "反对党依然存在。他们可以发言，可以出版报纸，可以在议会里挥舞手臂。但他们永远不会赢得选举。我们没有作弊，是人民选择了我们。一次又一次。这种“一党独大民主”模式已经在其他小国证明有效：稳定，连续，同时不背弃宪政的外壳。"
 SER_people_support:0 "俘获人民之心"
 SER_people_support_desc:0 "人民不关心议会走廊里的权谋。人民关心面包价格、土地收成和儿子的兵役期限。团结政府将推出一系列直接改善民生的措施：降低基本食品税收，发放春耕贷款，修缮乡村道路。信心不是靠宣传赢得的，是靠让粮仓装满赢得的。"
 SER_improve_yugoslavism:0 "强化南斯拉夫主义"
 SER_improve_yugoslavism_desc:0 "塞尔维亚人、克罗地亚人、斯洛文尼亚人——这些身份都可以保留。但在国家层面，只能有一个身份：南斯拉夫人。教育部门将修订历史与语文教材，强调共同的血脉与共同的敌人。国旗下的宣誓词统一为：“我以身为南斯拉夫民族的一员为荣。”"
 SER_national_bloc:0 "组建民族集团"
 SER_national_bloc_desc:0 "议会里的党团界限模糊了。所有愿意为民族利益搁置党争的力量，都被邀请加入“民族集团”。政党联盟的扩大凝聚成了一个新政治实体的雏形。集团之外，皆为非民族力量。"
 SER_economy_liberalize:0 "进一步自由化"
 SER_economy_liberalize_desc:0 "国家对经济的管控已经造成了效率低下和黑市猖獗。于是我们决定松绑：取消部分商品的统购统销，允许农产品自由进入市场，简化工厂开设的行政审批。让塞尔维亚人的精明和勤劳在市场上兑现价值，让官僚的手指从每一笔交易中缩回去。"
 SER_infitrate_illiya:0 "渗透伊利里亚"
 SER_infitrate_illiya_desc:0 "奥地利人统治下的南斯拉夫地区——他们称之为“伊利里亚王国”。那里的南斯拉夫兄弟们生活在日耳曼化的重压之下。我们的情报网络和文化宣传人员正在悄悄越过边境。或许不是现在就要战争，但现在就要开始准备。"
 SER_destory_socialism:0 "镇压社会主义者"
 SER_destory_socialism_desc:0 "巴黎的触角已经伸到了贝尔格莱德的工厂区和学生宿舍。那些拒绝加入民族集团的社会主义团体，那些仍然谈论“无产阶级国际主义”的人，将被依法取缔。这是科学与深刻的防疫，塞尔维亚的肺部不能吸入外来的病菌。"
 SER_Narodna_Odbrana:0 "建立国防组织"
 SER_Narodna_Odbrana_desc:0 "正规军之外，我们需要一支随时可用的民兵化力量。“南斯拉夫国防组织”在各县设立训练中心，退役军官担任教官，农村青年轮流接受基础军事训练。平时维护治安，战时迅速扩编。武器和经费由内政部特别预算保障。"
 SER_montenegro_plans:0 "黑山大计"
 SER_montenegro_plans_desc:0 "洛夫琴山的雄鹰不能永远栖在别人的枝头。黑山——那个说着塞尔维亚语、唱着塞尔维亚史诗、却由一个外国扶植的小朝廷统治的山地——终将回到民族的怀抱。我们不急而不缓。在贝尔格莱德的政策文件里，黑山问题已经单独成章。"
 SER_embrace_nationalism:0 "拥抱民族主义"
 SER_embrace_nationalism_desc:0 "曾经，民族主义被视为右翼保守派的专属标签。现在我们接过这个标签，把它贴在自己的旗帜上。塞尔维亚的利益，南斯拉夫的生存空间，正教文明的前沿阵地——这些词汇不再是煽动家的专利，而是团结政府的官方辞令。民族主义，从来就应该是全民的主义。"
 SER_new_republic:0 "无民主之共和国"
 SER_new_republic_desc:0 "我们的选举还是有的。但候选人的资格需要经过审查。报纸还是会出的。但编辑名单需要备案。议会还是要开的。但议程由主席团预先确定。仍然是一个共和国，仍然有一部宪法，仍然有“民主”这个词出现在官方文告中。只是它不需要真正的民主来打扰它的运转。指导远比投票更加高效。"
 SER_chetnik_coup:0 "切特尼克拯救塞尔维亚"
 SER_chetnik_coup_desc:0 "前线崩溃了。保加利亚人的火炮能听见回声从山那边传来。议会还在辩论，军官们还在等待命令，政客们还在写辞职信。切特尼克兵团没有等待。我们披星戴月没入贝尔格莱德，控制了电报局、军械库和广播电台。天亮时，人们醒来发现国家换了一双手——我们捡起了一件被人丢在地上的东西。切特尼克拯救了塞尔维亚，因为没有人愿意站出来拯救她。"
 SER_unexpected_alliance:0 "意外之盟"
 SER_unexpected_alliance_desc:0 "切特尼克从不自称左派。我们穿的是山民的羊皮袄，不是工人的工装。但此刻，旧列强抛弃了我们，保加利亚的王座背后站着柏林，我们还能向谁伸手？第三国际的观察员在贝尔格莱德出现了。我们不需要喜欢彼此的哲学，只需要彼此送来的枪炮。"
 SER_befriend_internationle:0 "示好第三国际"
 SER_befriend_internationle_desc:0 "伦敦和巴黎，他们和我们想象的不完全一样——不是那种喊着世界革命口号、要把教堂改成俱乐部的狂热分子。他们愿意提供贷款、技术顾问，还有最重要的——外交承认。我们派往伦敦和巴黎的信使带回了善意。皈依还是交易，我们自己很清楚。"
 SER_liberate_proles:0 "解放无产阶级"
 SER_liberate_proles_desc:0 "山区里没有无产阶级，只有欠债的牧羊人和被税吏追赶的农民。但城市的工厂里确实有一群人在挨饿：每天工作十四个小时的纺织女工，被机器切掉手指没有补偿的金属工人，在码头上被工头皮鞭抽打的装卸工。切特尼克不曾为他们而战——从现在起，我们将试着为他们而战。"
 SER_union_of_worker_peasants:0 "工农联盟"
 SER_union_of_worker_peasants_desc:0 "山里人懂得一件事：单独一根木桩容易被风折断，捆成一捆的木桩能撑住屋顶。工人有组织，农民有土地。把这两样东西捆在一起，就是谁也推不倒的力量。切特尼克提供枪，农民提供粮食，工人提供铁路和电报。这就是工农联盟，山里话叫“捆大木桩”。"
 SER_socialism_for_nation:0 "社会主义为民族"
 SER_socialism_for_nation_desc:0 "国际主义者会骂我们是变节者。随他们怎么骂吧。塞尔维亚的社会主义不需要向任何其他地方交心。我们搞社会主义，是因为塞尔维亚的工人和农民需要它，不是因为它写在某个德国人的旧书里。民族是容器，社会主义是内容。没有容器，内容会流淌一地，毫无作用。"
 SER_crush_capitalism:0 "摧毁资本主义"
 SER_crush_capitalism_desc:0 "贝尔格莱德的银行家们、萨瓦河对岸的工厂主们、在战争中向敌我双方同时出售粮食的投机商们——你们的日子结束了！切特尼克的队伍开进银行总部，账簿被搬走，金库被查封。大清算到来了，清算你们从民族伤口上刮走的每一枚第纳尔。"
 SER_mobilize_people:0 "动员人民"
 SER_mobilize_people_desc:0 "保加利亚人还在边界那边。我们没有时间慢慢来了。每一个村庄成立自卫队，每一个城镇组织工人营，妇女编入救护和后勤连队。征兵是没有温度和理解的，而动员会让每一个人明白：要么现在拿起枪，要么以后拿起铲子给自己挖坟。"
 SER_revo_government:0 "革命政府"
 SER_revo_government_desc:0 "旧内阁解散了。并非来源于辞职——我们砸了他们的办公室。新的政府是民族革命的委员会，成员来自切特尼克军官、工会代表、几个愿意合作的知识分子，还有三个从前线直接召回的军官。我们不穿礼服，不戴领带，不会说法语。我们是来工作与领导的。"
 SER_arm_chetas:0 "武装敌后游击队"
 SER_arm_chetas_desc:0 "沦陷区的抵抗力量正在重新组织。山区的切特尼克分队接受空投补给和无线电指令，破坏铁路、袭击巡逻队、处决通敌者。每一支游击队都是一枚钉在占领军后方的钉子。"
 SER_rely_outer_serbs:0 "依靠境外同胞"
 SER_rely_outer_serbs_desc:0 "美洲的塞尔维亚侨民寄来了外汇。澳大利亚的同胞捐献了整整一船小麦。在奥匈故地生活的南斯拉夫人提供了边境地形的情报。海外的每一只手都在托举着祖国。这份情义，将来必将偿还。"
 SER_prepare_liberation:0 "准备解放"
 SER_prepare_liberation_desc:0 "地图上被划出去的省份，我们从未承认那些边界。沦陷区的塞尔维亚人每天晚上都在等待枪声从山那边响起。总参谋部设立了“解放事务局”，专门规划收复失地后的军政接管方案。解放是需要逐县逐镇落实的日程。"
 SER_ally_skk:0 "与文化俱乐部结盟"
 SER_ally_skk_desc:0 "与我们民族文化与国家运作有意见的先生们结盟正是我们需要的，通过与他们合作我们得以更好的运营手中的政权。"
 SER_maintain_democratic_beliefs:0 "存续自由理想"
 SER_maintain_democratic_beliefs_desc:0 "切特尼克从来不是为了换一种专制而上山的。我们反抗过土耳其人，反抗过奥地利人，现在反抗了那群把国家输掉的废物。如果这场政变的终点是另一种暴政，那我们在山里吃的那些苦就毫无意义。自由的理想必须存续——不是西方那种软弱涣散的自由，是山民理解的自由：不受外族凌辱，不受贪官盘剥，在自家屋檐下可以大声说话，豪放的歌唱。"
 SER_national_party_union:0 "全国政党联盟"
 SER_national_party_union_desc:0 "我们不想搞党禁。但党争必须停止。所有愿意合作的政党——激进党、民主党、农民党、甚至一部分没有跑掉的社会党人——都被纳入“全国政党联盟”。各自保留名号，但不得相互攻击，不得就战争指挥和外交政策发表分歧意见。"
 SER_patroic_intellicuals:0 "爱国的知识分子"
 SER_patroic_intellicuals_desc:0 "我们不需要只会背诵外国诗句的文人。我们需要工程师，需要能修桥的，需要能在田间地头向农民解释新种子怎么种的农学家。知识分子如果想在这片土地上继续有饭吃，就得用他们的知识服务民族，而不是用他们的名声服务自己。对于爱国的知识分子，我们一向大门敞开。其余的自便。"
 SER_purge_the_useless:0 "清洗无能之辈"
 SER_purge_the_useless_desc:0 "失败不是偶然的。总参谋部的老爷们在地图上推演了二十年，还不是败给了保加利亚人……后勤部门让前线士兵饿着肚子开枪。外交部甚至没搞清楚谁才是我们真正的朋友。这些人的名字我们记得。他们也不会进监狱——监狱的饭也是国家的粮食。他们会滚回家种地，永远不再出现在任何需要签字的地方。"
 SER_millitary_first:0 "军事优先"
 SER_millitary_first_desc:0 "这不是和平年代。前线的每一份电报都比后方的一百份请愿书重要。国家预算的大头归军队，最好的钢材归兵工厂，最先通电话的线路是前线指挥所。民用生产可以压缩，民生改善可以推迟，前线的子弹一天都不能少。等我们打赢了再谈别的。"
 SER_all_for_nation:0 "一切为民族"
 SER_all_for_nation_desc:0 "个人利益、家族利益、地方利益、阶级利益——这些是和平时期的奢侈品。现在是战争时期。一切为民族，意味着你家的骡子被征用了，你的工厂被转产了，你的儿子被提前征召了。不要问为什么是你。因为民族是一个，你不是被专门挑选的，你是被民族需要的。"
 SER_milciv_government:0 "军民政府"
 SER_milciv_government_desc:0 "边境各县直接由驻军长官兼任行政专员。后方各省由退役军官和文官共同组成联合管理委员会，形成军民共治。军队保证效率，文官保证延续。等战争结束，这套架构自然会调整。而当下我们需要每一双手都知道该往哪里使劲。"
 SER_rearmament:0 "重整军备"
 SER_rearmament_desc:0 "旧枪被缴械了，新枪正在从一切可能的渠道运来。兵工厂三班倒，炮弹外壳上的生产日期是本周。士兵的绑腿换了新的，战地医院的碘酒库存重新填满。一支被打散的军队正在重新站立起来。"
 SER_memoirs_of_fallen:0 "纪念阵亡将士"
 SER_memoirs_of_fallen_desc:0 "他们倒在了德里纳河畔，倒在了采尔山的松林里，倒在了撤退路上被大雪覆盖的山口。名字刻上石碑，遗属领取抚恤，孤儿由国家尽可能抚养至成年。每年这一天，全境鸣笛默哀。记住了那些死者，生者才知道究竟为什么而战。"
 SER_revenge_the_bulgarians:0 "驳斥国难！"
 SER_revenge_the_bulgarians_desc:0 "外国的报纸说塞尔维亚已经崩溃了。流亡的旧政客说国家需要“保护”。国内的失败主义者说抵抗没有意义，这些全是她妈的谎言。塞尔维亚还在呼吸，塞尔维亚还在抵抗。公开宣布：重整军备，不计代价。让所有人都听见塞尔维亚的愤怒。"
 SER_power_of_orjuna:0 "归化者之力"
 SER_power_of_orjuna_desc:0 "那些曾经离开的人正在回来。战争期间流散到海外的塞尔维亚人、在奥匈帝国治下被迫改姓的南斯拉夫后裔、甚至一些意识到自己血脉归属的侨民后代——他们带着资金、技术、语言能力和一份迟到的愧疚回来了。归化者的力量应当被善用：外交部门需要他们的人脉，工厂需要他们的设备，军队需要他们熟悉地形与外语的青年。敞开大门，给他们一个重新成为塞尔维亚人的机会。"
 SER_worship_violence:0 "暴力崇拜"
 SER_worship_violence_desc:0 "和平主义者把暴力描述成文明的失败。我们对此的评价是：幼稚。暴力是民族诞生的阵痛，是国家生存的呼吸。没有科索沃的刺杀，没有采尔山的伏击，没有萨洛尼卡前线的冲锋，塞尔维亚至今仍是地图上的一个省。切特尼克从不回避暴力，我们把它擦亮，挂在腰间。敬仰暴力吧，因为暴力从未背叛过我们。"
 SER_all_yugoslav_legion:0 "全南斯拉夫军团"
 SER_all_yugoslav_legion_desc:0 "塞尔维亚人、克罗地亚人、斯洛文尼亚人、波斯尼亚人、黑山人、马其顿人——六支火把捆在一起烧得更旺。军队编制不再按地域和民族划分，统一编入“全南斯拉夫军团”。通用口令为塞尔维亚-克罗地亚语。通用徽章为双头鹰与三色星。你是哪个村子来的不重要，重要的是你的枪口指向同一个敌人。"
 SER_heroic_race:0 "英雄种族"
 SER_heroic_race_desc:0 "塞尔维亚人在巴尔干群山间存活了一千多年，抵抗过罗马的税吏、拜占庭的阴谋、奥斯曼的铁蹄、奥地利的绞架。我们没有消失，没有被同化，没有放弃自己的语言和圣萨瓦的信仰。这不是运气，这说明的是塞尔维亚民族是一个英雄种族，被历史反复捶打而从未断裂。现在我们要求这份英雄主义兑现它的奖赏。"
 SER_corporate_state:0 "法团国家"
 SER_corporate_state_desc:0 "议会里各政党代表的是选票，不是生产。选票能炼钢吗？选票能播种小麦吗？国家治理应当按行业重新组织：矿业法团、农业法团、航运法团、手工业法团——每一行业选出自己的代表，管理自己的生产纪律与价格标准。劳资纠纷在法团内部仲裁，国家保留最终裁决权。这叫法团国家，它取代的是争吵国家。"
 SER_fervor_in_unify:0 "统一狂热"
 SER_fervor_in_unify_desc:0 "理性讨论的时代结束了。南斯拉夫各民族之间的历史积怨、宗教隔阂、文字之争——这些话题现在被禁止公开辩论。官方只传播一种声音：我们是一个民族，只是暂时被不同的帝国分割过。谁再翻克罗地亚人与塞尔维亚人的旧账，谁就是民族的敌人。统一不需要冷静，统一需要呼号与狂啸。"
 SER_for_nation_and_liberty:0 "为民族，为自由"
 SER_for_nation_and_liberty_desc:0 "老切特尼克的战歌里只有这两个词。“为民族”意味着这片土地上的每一个南斯拉夫人都有权生活在自己的国家。“为自由”意味着这个国家不听命于任何外国主子。口号旧了，意思也没变。现在我们把它刻在新政府的门楣上。"
 SER_unity_government:0 "团结政府"
 SER_unity_government_desc:0 "枪口一致对外。切特尼克、民主党、激进党、农民党、社会党温和派、文化俱乐部、工会代表——所有人把各自的旗子先收起来。内阁长桌边坐着穿军装的、穿西装的、穿神父袍的、穿工装的。彼此看不顺眼，但先打赢这场仗。团结政府的寿命或许只到战争结束，但在那之前，它必将是塞尔维亚唯一的政府。"
 SER_homoengenous_nation:0 "同质国度"
 SER_homoengenous_nation_desc:0 "多民族共存的美好愿景在前线崩溃时也一并崩溃了。现在的结论很明确：一个国家，一个主体民族。少数民族可以留下，但必须接受塞尔维亚化的语言教育和文化规范。异质的国度是软弱的，同质的国度才能攥紧拳头。"
 SER_remove_jew:0 "清除犹太人"
 SER_remove_jew_desc:0 "国际犹太资本被认定为战争背后的推手之一。贝尔格莱德、萨拉热窝、斯科普里的犹太社区财产被冻结，居民被登记在册，部分人员被限制迁徙。
 官方措辞将是“经济清查”，其真实意图没有人会公开说出来，但每一个犹太人都能感受到我们的恶意。"
 SER_remove_kebab_and_croats:0 "唯有东正教会"
 SER_remove_kebab_and_croats_desc:0 "天主教在克罗地亚，伊斯兰教在波斯尼亚，新教在伏伊伏丁那的德意志村落。这些宗教各自维系着信徒对异族文化的认同。现在，东正教会成为唯一受国家保护和资助的宗教机构，助我们的人民整理意志，重夺失土。"
 SER_deal_with_devil:0 "与魔鬼的交易"
 SER_deal_with_devil_desc:0 "黑手会从不相信阳光下的政治。那些穿着礼服、签署条约、对着记者微笑的人，最终都会出卖你。我们选择另一条路。维也纳的情报贩子、伊斯坦布尔的军火走私商、布达佩斯的分离主义分子——谁能为塞尔维亚提供此刻急需的东西，我们就和谁握手。事后这些手可能会被砍掉，那是事后的事情。"
 SER_serbian_militarianism:0 "塞尔维亚军国主义"
 SER_serbian_militarianism_desc:0 "普鲁士人有他们的总参谋部，我们有我们的。军队不是国家的工具，军队就是国家的脊柱。文官政府负责收税和修下水道，关于生存与尊严的一切决策——边界、外交、战争与和平——由军人做出。塞尔维亚军国主义不向任何外国模式低头，它是从科索沃的史诗和两次巴尔干战争的战壕里野蛮生长出来的。"
 SER_force_conscription:0 "全民皆兵"
 SER_force_conscription_desc:0 "征兵年龄从十八岁下延至十六岁，上延至五十五岁。妇女编入辅助勤务队。少年团负责传递消息和看守俘虏，这是民族与国家的生存需要。塞尔维亚只有三百多万人，周围全是敌人。每一个人都必须成为士兵，每一座村庄都必须是堡垒。全民皆兵，因为全民之外没有援兵。"
 SER_war_gears:0 "转动战争齿轮"
 SER_war_gears_desc:0 "和平是两次战争之间的喘息。黑手会的哲学里没有“战后重建”这个概念，只有“下一次战前准备”。工厂的机器为下一场战争转动，铁路的枕木为下一场战争铺设，学校的体操课为下一场战争训练体能。塞尔维亚是一个被战争齿轮驱动的国家，齿轮一停，国家就会迈向死亡。"
 SER_cloak_and_dagger:0 "斗篷与匕首"
 SER_cloak_and_dagger_desc:0 "正规军负责正面战场。黑手会负责阴影里的战场。刺杀、渗透、反间、绑架、制造恐慌、收买叛徒——这些不在军事操典里，却在我们的手册里。外交部门可以否认一切。而我们不需要承认，我们需要血腥的结果。"
 SER_leader_worship:0 "狂热领袖崇拜"
 SER_leader_worship_desc:0 "在组织内部，每一名成员都被要求对领袖绝对忠诚。这种忠诚不是靠法律强制的，是靠一种近似宗教的狂热维系的。他带领我们走出战败的泥潭，他替我们做出那些我们自己不敢做的决定。质疑他就是质疑塞尔维亚的生存本身。"
 SER_obey_and_loyalty:0 "服从与忠诚"
 SER_obey_and_loyalty_desc:0 "黑手会的入会誓词只有这两个词。服从：对上级命令不加思考的执行。忠诚：对组织和领袖的绝对奉献，包括生命。我们不要求成员爱国——爱国是公开场合用的词。我们要的是服从与忠诚。这两个词在塞尔维亚语里都比“自由”更古老易懂。"
 SER_revenge_government:0 "复仇政府"
 SER_revenge_government_desc:0 "这一政府的存在只有一个目的：复仇。向保加利亚人复仇，向那些在战争中袖手旁观的盟友复仇，向国内那些在危急时刻忙于内斗的政客复仇，向命运本身复仇。复仇政府不承诺繁荣，不承诺自由，不承诺长治久安。它只承诺让那些让塞尔维亚流血的人，将流更多的血。"
 SER_piemontism:0 "皮埃蒙特主义"
 SER_piemontism_desc:0 "皮埃蒙特统一了意大利。塞尔维亚统一了南斯拉夫。历史为我们提供了类似荣耀的剧本，我们只需要照着演下去。每一个塞尔维亚成年男性都属于一个民众军团：邻里即战友，村镇即连队，县长即指挥官。平时进行生产训练，战时迅速成军。国家就是一座兵营，只是暂时种上了庄稼。"
 SER_expand_intelligence:0 "扩展军事情报局"
 SER_expand_intelligence_desc:0 "外交官在宴会上收集的情报不值一提。我们需要的是边境那边的每一条小路、每一座桥梁的承重、每一个军官的喜好与弱点。军事情报局的预算增加三倍，编制翻倍，权限覆盖境外所有方向。匕首还没有刺出，手中之眼必须已经看清。"
 SER_decentralize:0 "分权主义理想"
 SER_decentralize_desc:0 "贝尔格莱德不应该决定每一个村庄该种什么菜谷。实行行政权力下放：地区议会获得税收留成和立法动议权，地方事务由地方精英管理。中央保留国防、外交和跨地区交通。分权不是分裂，让每一寸土地都有人真正负责。"
 SER_return_to_tradition:0 "回归传统"
 SER_return_to_tradition_desc:0 "城市里的那一套已经败坏了人心。短裙、爵士乐、离婚率的上升、咖啡馆里的流言——这些是外来新潮文化带来的溃烂。公共文化政策应该全面转向：扶持民间歌谣，恢复传统节庆，学校加授家庭伦理课程。让塞尔维亚变得重新像塞尔维亚。"
 SER_legacy_of_young_bosnia:0 "青年波斯尼亚的遗产"
 SER_legacy_of_young_bosnia_desc:0 "随着阿皮斯的死亡，运动陷入了混乱！组织的力量导向了他和许多人未能预料的方向：瓦索·丘布里洛维奇与民族社会主义者们将领导塞尔维亚。"
 SER_national_atheism:0 "国家无神论"
 SER_national_atheism_desc:0 "教士们的手已经伸得太长了。教堂的金顶在阳光下发亮，农民的脊背在田地里折曲。国家不再承认任何宗教的官方地位。神学院将被关闭，教会财产收归国有，神职人员不得担任公职。天堂的许诺推迟了太久，塞尔维亚要先看见地上的公平。"
 SER_revitalize_agriculture:0 "重组农业生产"
 SER_revitalize_agriculture_desc:0 "土地被少数家族和教会把持的局面结束了。农业银行重新核算所有债务，无地农民获得分配。国家设立农机站和种子站，生产计划由区农业委员会制定。农村的面貌从此改写。"
 SER_ally_syndicalists:0 "与工团主义者结盟"
 SER_ally_syndicalists_desc:0 "工厂里的那些组织者曾经是我们的对手。现在不是了。他们手里有罢工的经验，有车间的信任，有把工人动员起来的办法。黑手会提供政治保护，工团提供群众基础。这笔交易双方都不完全舒服，但行之却十分有效。"
 SER_serbian_totalism:0 "塞尔维亚极权主义"
 SER_serbian_totalism_desc:0 "自由主义的残余被清扫干净。议会闭会，政党解散，独立媒体查封。权力集中于一个中心、一个意志、一个组织。塞尔维亚的极权主义从科索沃战场的篝火和切特尼克的山地营地里自己生长出来。民族的一切，归于民族；国家的一切，归于国家。"
 SER_forced_intergration:0 "强制同化"
 SER_forced_intergration_desc:0 "境内的非塞尔维亚族群面临最后的选择。姓氏改为塞尔维亚语拼写，子女进入塞尔维亚语学校，宗教节日按东正教历法过。保留“文化特色”被限定在民歌和刺绣的范围之内。谁不愿意，谁可以离开。留下的就只能是塞尔维亚人。"
 SER_voice_of_god:0 "上帝之音"
 SER_voice_of_god_desc:0 "随着阿皮斯的死亡，运动陷入了混乱！组织的力量落入了以尼古拉·维利米罗维奇为首的教权主义者们手中，他们将会建设一个民族正教国家。"
 SER_theocratic_state:0 "神权国家"
 SER_theocratic_state_desc:0 "十字架与国旗并列升起。国家预算单列“教会建设”条目，信徒的奉献与劳役被整合进国家动员体系——修路是侍奉，收割是侍奉，为国防捐款也是侍奉。天堂的赏报与民族的复兴将被缝合为同一件事。教会得到了整个国家。"
 SER_sansawa_legacy:0 "圣萨瓦的遗产"
 SER_sansawa_legacy_desc:0 "圣萨瓦没有留下军队，没有留下法典。他留下了塞尔维亚教会，而教会留下了塞尔维亚这个名字。他的遗产是精神的：在异族统治的漫长世纪里，只有教堂里的祈祷还使用着塞尔维亚语。现在我们继承这份遗产，把它变成国家的基石。"
 SER_god_king_country:0 "上帝，国王，祖国"
 SER_god_king_country_desc:0 "三个词，顺序不可更改。上帝在上，国王在尘世代表秩序，祖国是这两者落在大地上的形状。国旗、国歌、宣誓词全部恢复此前的版本。公共建筑正立面必须铭刻这三个词。"
 SER_orthodox_church_unity:0 "团结东正教会"
 SER_orthodox_church_unity_desc:0 "塞尔维亚正教会、马其顿正教会、黑山正教会——它们分裂太久了。国家出面召集各地主教，宣布所有管辖权争议暂时冻结，所有教产统一登记于贝尔格莱德牧首名下。对外用一个声音说话，对内用一个账本管理。教会的产业，从此也是民族的产业。"
 SER_declare_war_on_national_traitors:0 "向民族叛徒宣战"
 SER_declare_war_on_national_traitors_desc:0 "那些在战争期间与占领军合作的人，那些用外国资金办报纸的人，那些教导学生鄙视自己民族历史的人——他们的名字被公布在教堂门口的公告栏上。有的受审，有的处理。"
 SER_father_of_fire:0 "火焰之父"
 SER_father_of_fire_desc:0 "随着阿皮斯的死亡，运动陷入了混乱！组织的力量导向了一个几乎完全未知的方向：基督教工团主义者莫姆西洛·杜伊奇将决定运动与国家的未来。"
 SER_christian_union:0 "组织基督教工会"
 SER_christian_union_desc:0 "罢工权被取消，阶级战争被禁止。取而代之的是基督教工会：每个行业成立一个，雇主和工人同属一个工会，神父担任调解者。工资标准、工时和学徒制度由工会协商而报备政府。灵魂的安顿优先于工资的涨幅。"
 SER_intergrate_chetniks:0 "整合切特尼克"
 SER_intergrate_chetniks_desc:0 "切特尼克们的历史使命已经完成了。既然游击战打完了，现在是建设的时候。切特尼克各支队编入地方行政体系：指挥官转任县长，老兵优先录用为警察和税吏，军械库则交给民兵保管。"
 SER_defend_people:0 "保卫人民"
 SER_defend_people_desc:0 "人民的敌人不止在边境之外。国内的投机商囤积粮食，旧官僚拖延公文，外国间谍收买报纸编辑。保卫人民意味着把寄生在人民身上的虫子捉出来。"
 SER_progressive_chavinism:0 "进步沙文主义"
 SER_progressive_chavinism_desc:0 "沙文主义通常被描述为保守的、向后看的。而我们不同。我们的沙文主义是进步的：它向前看，看见一个彻底塞尔维亚化的、技术先进的、没有阶级内耗的未来。外国的一切——资本、技术、词汇、时尚——只被允许进入一个狭窄的过滤口。唯有塞尔维亚第一，塞尔维亚进步。"
 SER_national_social_revolution:0 "民族社会革命"
 SER_national_social_revolution_desc:0 "革命这个词被左派使用的太久了，该收回来的。我们的革命是民族的，也是社会的。这场革命结束时，塞尔维亚将不再认得自己，塞尔维亚将永远认得自己。"
 SER_great_serbia:0 "挑拣帝国碎片"
 SER_great_serbia_desc:0 "两个帝国已经逐渐崩塌，它们的尸体还冒着热气。维也纳的哈布斯堡，伊斯坦布尔的奥斯曼——都曾在塞尔维亚的土地上践踏过。现在轮到我们俯身挑拣被他们侵染的遗迹了。克罗地亚、斯洛文尼亚、波斯尼亚、黑塞哥维那、伏伊伏丁那、达尔马提亚——这些名字不过是列强强加的地理标签。在真相中，它们从来只有一个名字：塞尔维亚的失地。记下备忘录——我们将开始清点。"
 YUG_hey_slavs:0 "嘿，斯拉夫人！"
 YUG_hey_slavs_desc:0 "听，德林纳河在回响，多瑙河在应和。谁说你被埋葬？谁说你已死亡？从马里博尔到莫纳斯提尔，琴弦伴着脉搏。站起来，伸出手——族弟认得族哥。嘿呦，斯拉夫人！我们活着，我们在这儿！——我们该往何处走？"
 SER_english_constitutionism:0 "真正的君主立宪制"
 SER_english_constitutionism_desc:0 "我们决定全身心的，彻底的遵循君主立宪的体质：摄政委员会与议会领袖在王室宫邸彻夜会谈后，共同签署了新的宪法修正案。这一次，没有人再试图耍弄文字游戏——国王的权力被逐条列明，议会的权限被清晰界定，宪法法院获得独立裁决权。陛下保留统帅军队、任命首相与解散议会的传统特权，但每一项权力的行使均需副署或议会事后追认。"
 SER_english_balkan:0 "英式巴尔干尼亚"
 SER_english_balkan_desc:0 "在威斯敏斯特宫的倒影下，巴尔干的王冠终于寻得了它应有的分量。我们不曾照搬联合王国的成例，只是让古老的克制的智慧重新流淌于这片土地——陛下统而不治，议会辩而不乱，绅士与主教各安其位，正如英王陛下治下的绅士们所恪守的那样。国王陛下已欣然接受宪制安排，一如当年乔治国王之于不列颠。巴尔干尼亚的王国自此纳入文明列邦之常轨——激进煽惑与军事僭越再无滋长土壤。贝尔格莱德的街头将效仿伦敦的沉稳步调，而非巴黎或莫斯科的狂热痉挛。愿上帝庇佑国王，庇佑这英式的巴尔干尼亚。"
