 serbia.74.t:0 "政变企图"
 serbia.74.d:0 "随着我国在第四次巴尔干战争的惨败，政府已经风雨飘摇，而在今天，德拉查·米哈伊洛维奇将军已经召集了老兵与他麾下的军队，要求接管政府并严惩卖国贼。目前，唯一可行的办法就是寻求奥地利与保加利亚的干涉，但这毫无疑问会令我国成为傀儡。我们该怎么办？"
 serbia.74.a:0 "投降。"
 serbia.74.b:0 "向维也纳与索菲亚求救！"
 serbia.75.t:0 "后果"
 serbia.75.d:0 "奥地利与保加利亚的军队迅速镇压了这起叛乱，但他们也提出了条件：复辟奥布雷诺维奇王朝。显然，我们不能说半个不字。"
 serbia.75.a:0 "我们已不复昔日荣光……"
 serbia.69.t:0 "组建新政府"
 serbia.69.d:0 "随着卖国贼的政权被军队推翻，新生的救国政府必须开始重建全国秩序，并寻找盟友。由弗拉达·泽切维奇带领的红色切特尼克主张与社会主义者联盟，剩余的成员则建议与黑手组织建立合作。与此同时，德拉戈米尔·瓦西奇领导的塞尔维亚文化俱乐部与由克罗地亚南斯拉夫主义流亡者组成的南斯拉夫民族主义者组织也抛来了橄榄枝，决定权在我们的手上。"
 serbia.69.a:0 "与社会主义者合作"
 serbia.69.b:0 "与塞尔维亚文化俱乐部合作"
 serbia.69.c:0 "与南斯拉夫民族主义者组织合作"
 serbia.69.e:0 "与黑手合作"
 serbia.69.f:0 "……与乌斯塔莎合作？"
