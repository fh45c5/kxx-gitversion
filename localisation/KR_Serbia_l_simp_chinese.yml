 SER_obrenovic:0 "塞尔维亚王国"
 SER_obrenovic_ADJ:0 "塞尔维亚"
 SER_obrenovic_DEF:0 "塞尔维亚王国"
 SER_aus_hun_ser:0 "奥匈塞帝国"
 SER_aus_hun_ser_ADJ:0 "奥匈塞"
 SER_aus_hun_ser_DEF:0 "奥匈塞帝国"
 SER_CHT:0 "塞尔维亚救国政府"
 SER_CHT_ADJ:0 "塞尔维亚"
 SER_CHT_DEF:0 "塞尔维亚救国政府"
 SER_CRO_CHT:0 "南斯拉夫独立国"
 SER_CRO_CHT_ADJ:0 "南斯拉夫"
 SER_CRO_CHT_DEF:0 "南斯拉夫独立国"
 SER_bolshevik_path:0 "布尔什维主义道路"
 SER_bolshevik_path_desc:0 "我们将效仿俄国同志们的革命经验，更好的领导塞尔维亚的革命事业。"
 SER_bukarinism_path:0 "学习布哈林主义"
 SER_bukarinism_path_desc:0 "革命不是一味猛冲。新经济政策时期的经验证明，向农民让步、鼓励小商品生产、逐步积累社会主义因素，才是巩固政权的稳妥道路。我们拒绝左翼冒险主义——先让农村的粮仓装满，城市的烟囱冒烟，再谈向共产主义过渡。"
 SER_orthodox_path:0 "坚守正统路线"
 SER_orthodox_path_desc:0 "党不需要任何修正。列宁同志指明的道路已经足够清晰：加速工业化，推进集体化，消灭富农阶级。任何偏离这条总路线的言论，无论是“右倾”的农民保护主义还是“左倾”的不断革命论，都是对革命事业的背叛。"
 SER_vahabiti_path:0 "瓦哈比派掌权"
 SER_vahabiti_path_desc:0 "党内生活必须彻底纯洁化。莫洛托夫同志的模式是我们此刻的指南：每一个支部都要重新审查成员档案，每一项决议都要经过忠诚度过滤，每一个持不同意见者都要在自我批评与组织处理之间做出选择，这是对革命肌体的必要消毒。"
 SER_purge_party:0 "清洗政党"
 SER_purge_party_desc:0 "党不是某些人物的客厅，什么人都可以进来聊天。那些投机分子、旧军官、小资产阶级知识分子、隐藏的托派、民主派同情者——他们必须被从党的队伍中剔除出去。组织部门将重新登记全体党员。留在党内的，只能是经过考验的革命战士。"
 SER_yay_lenin:0 "列宁主义放光芒"
 SER_yay_lenin_desc:0 "理论是指路的明星。所有党校加开列宁著作必修课程，《怎么办》《国家与革命》《帝国主义论》列为基本教材。每一个党员都必须能够向群众解释：我们是谁，我们从哪里来，我们要去向何方。没有革命的理论，就没有革命的运动。"
 SER_heroic_communism:0 "英雄共产主义"
 SER_heroic_communism_desc:0 "依靠革命热情而非物质刺激来推动生产。我们号召青年突击队奔赴最艰苦的工地，号召工人自愿延长工时，号召农民将超额粮食无偿捐献给城市。这是英雄主义的时代，金钱和舒适不能衡量一切。"
 SER_ind_agri_collectivize:0 "工农业集体化"
 SER_ind_agri_collectivize_desc:0 "个体农民的小块土地是资本主义复辟的温床。从现在起，国家全力推动农业集体化：建立集体农庄，推广拖拉机站，将分散的劳动力集中到集体土地上。同时，手工业者也被编入生产合作社。私人作坊的时代结束了。"
 SER_learn_nep:0 "执行新经济政策"
 SER_learn_nep_desc:0 "战争与革命耗尽了农村的耐心。强制征粮已经引发多起骚动。中央决定暂时放松控制：恢复一定的自由市场，允许农民在交足公粮后出售余粮，向外国资本提供有限的特许权。退一步是为了站稳脚跟。"
 SER_surrealist_path:0 "先锋主义霸权"
 SER_surrealist_path_desc:0 "旧世界的艺术死了。资产阶级的油画、现实主义的小说、旋律规整的交响乐——都是腐朽阶级的麻醉剂。先锋主义不是众多艺术流派中的一支，它是唯一配得上革命的审美形式。破碎的句法、碰撞的色彩、不协和的音符，这才是新社会的感官秩序。"
 SER_relation_with_breton:0 "与布勒东的联系"
 SER_relation_with_breton_desc:0 "巴黎的超现实主义者们已经宣告了理性的破产。我们与他们之间的电报线路现在正式开通。安德烈·布勒东同志的回信抵达贝尔格莱德：自动写作、梦境记录、对潜意识的无条件解放——这些技法将被引入我们的文化战线。未来主义的机器美学与超现实主义的梦境逻辑，将在巴尔干熔铸成一种全新的革命感官。"
 SER_call_international_brigades:0 "号召国际纵队"
 SER_call_international_brigades_desc:0 "革命不是塞尔维亚一国的私产。我们向全欧洲被压迫的艺术家、诗人、亡命之徒和梦想家发出号召：到贝尔格莱德来。不需要你信仰某个具体的教条，只需要你憎恨这个旧世界。画笔、钢笔、相机和拳头，都是武器。"
 SER_strengthen_body:0 "强身健体"
 SER_strengthen_body_desc:0 "未来主义者从不歌颂病态。速度、力量、金属般的肉体——这是新人应有的形态。全国推行每日体操制度，工厂设置体能训练时段，青年组织定期举行越野行军。一副被革命意志充满的躯体，不应当被肺病和佝偻拖垮。强健的肌肉，才能挥出强健的拳头。"
 SER_surrealist_revolution:0 "超现实主义革命"
 SER_surrealist_revolution_desc:0 "理性把人类锁在因果律的牢笼里太久了。现在，我们砸开这把锁。社会关系将被梦境逻辑重组，城市规划不再服从工程师的尺规而服从诗人的幻觉，法律条文让位于自动写作的呓语。这不是任何玩笑。一场比政治革命更深的革命将要到来——是从思想到对现实本身的颠覆"
 SER_technocracy_path:0 "技官主义影响"
 SER_technocracy_path_desc:0 "党内的工程师群体开始发出清醒的声音。革命需要热情，但热情不能替代发电站的装机容量。各项决策应当由拥有相关技术资质的人做出，而非由只会背诵口号的政治委员。机器不听口号，机器只看务实的数据。"
 SER_learn_deat:0 "新社会主义影响"
 SER_learn_deat_desc:0 "我们翻阅了西方社会民主主义那些“计划化”实验的报告，也研究了布尔什维克的经济计划学说。我们的结论是：市场必须被驯服，但完全消灭市场目前尚不经济。新社会主义的折中方案在党内获得了大量的讨论空间——使国家掌握命脉，同时允许有限的市场调节作为数据反馈机制。"
 SER_implement_planisme:0 "引入计划主义"
 SER_implement_planisme_desc:0 "价格信号是盲目的，利润动机是短视的。从现在起，国家计划委员会将编制年度与五年期的跨行业生产指标。原料分配、产能扩张、劳动力培训——全部纳入统一的指令框架。我们不再生产市场需要的东西，我们生产民族需要的东西。"
 SER_neosocialism_influence:0 "青年先锋"
 SER_neosocialism_influence_desc:0 "大学里的工程技术专业获得最高等级的招生优先权。所有学生社团中，无线电爱好者协会、航空模型小组和化学实验俱乐部被赋予“青年先锋”称号。政治课仍然要上，但评判一个青年是否革命的最终标准，是他能否修好一台拖拉机。"
 SER_techno_state:0 "科技强国"
 SER_techno_state_desc:0 "贝尔格莱德大学工程学院获得巨额拨款。地质勘探队派往全国寻找一切可开采的矿藏。我们向德国购买化工专利，向法国学习电气技术，向任何愿意出售知识的人购买知识。塞尔维亚的工业基础薄弱，但技术跳跃是可能的。用不了二十年，我们要让巴尔干的重工业中心不在的里雅斯特，不在布达佩斯，而是迁移至贝尔格莱德。"
 SER_natsynd_path:0 "国家工团主义掌权"
 SER_natsynd_path_desc:0 "工会不是用来罢工与制造破坏的。工会是用来组织生产的。国家工团主义的核心原则在此确立：每一个行业成立一个全国性工团，工团负责本行业的生产秩序、纪律仲裁与福利分配。政党靠边站，让生产者自己管理自己——当然，是在国家的框架之内。"
 SER_liberate_macedonia:0 "我们一定要解放马其顿！"
 SER_liberate_macedonia_desc:0 "马其顿的兄弟们至今仍被外国王冠和异族官僚统治着。瓦尔达尔河两岸的土地被不公正的边界割裂。国家工团主义政权的第一项外交宣言就是：马其顿全境必须统一。要解放马其顿，一定要解放马其顿！"
 SER_single_state:0 "单一制国家"
 SER_single_state_desc:0 "联邦制是软弱的表现。塞尔维亚、克罗地亚、斯洛文尼亚——这些名字将被保留作为地理和文化区划，但不再具有任何政治实体的含义。一个国家，一个民族，一个中央。所有地方议会改为中央派驻的行政公署。"
 SER_red_chetniks:0 "染红切特尼克"
 SER_red_chetniks_desc:0 "切特尼克，这个词曾经代表着保皇党和山地草莽。现在我们要把它夺过来，染成红色。旧切特尼克的游击传统、山地作战技能和乡土忠诚，完全可以转化为人民政权的武装资产。新的红色切特尼克分队将作为民兵辅助力量，负责边境巡逻和反匪作战。他们戴的仍然是传统的山羊皮帽，只不过帽子上的徽章换成了红星。"
 SER_national_revolution:0 "民族革命"
 SER_national_revolution_desc:0 "其他国家区分左派与右派，而我们不。我们区分民族与反民族。这场革命的性质因此明晰：它是一场民族革命。清算外国资本的特权，驱逐异族影响，将土地和工厂归还给塞尔维亚民族的生产者。社会主义就是最高形式的民族主义。"
 serbia.76.t: "选举新的领导人"
 serbia.76.d: "如今社会主义工人党扫清了资产阶级共和国的残余，但党就谁应领导我们步入无产阶级未来意见不一。我们有不少人可以挑选，但能成为领袖的只有一人。那么，谁将引领塞尔维亚社会主义共和国？"
 serbia.76.a: "西马·马尔科维奇"
 serbia.76.b: "武卡辛·马尔科维奇"
 serbia.76.c: "菲利普·菲利波维奇"
 serbia.76.e: "佩特科·米莱蒂奇"
 serbia.76.f: "米兰·戈尔基奇"
 serbia.76.g: "康斯坦丁·波波维奇"
 serbia.76.h: "看看别的"
 serbia.77.a: "拉扎尔·科利舍夫斯基"
 serbia.77.b: "亚历山大·兰科维奇"
 serbia.77.c: "特里沙·卡克莱罗维奇"
 serbia.77.e: "摩沙·皮贾德"
 serbia.77.f: "看看之前的"