 SER_ready_for_war:0 "宣战准备"
 SER_ready_for_war_tooltip:0 "§R塞尔维亚即将准备进攻奥地利。我们必须为战争做好准备。§!"
 SER_The_Road_To_Unification_decisions:0 "统一之路"
 SER_Ultimatum_To_Bulgaria:0 "对[BUL.GetNameDef]最后通牒"
 SER_End_The_Occupation_Of_Bulgaria:0 "结束对保加利亚的占领"
 SER_Attack_Austria:0 "进攻[AUS.GetNameDef]"
 SER_Balkan_Research_Initiative_decisions:0 "巴尔干研究计划"
 SER_Invite_Country:0 "邀请[From.GetNameDef]"
 SER_economic_council_decision:0 "经济合作公约"
 SER_economic_council_decision_desc:0 "作为我们深化关系和改善整个巴尔干地区经济的一部分，我们可以组建一个经济联盟。并成立一个由成员国的金融专家组成的经济委员会来指导它运作，它将为贝尔格莱德条约的领导人提供建议。成员国越多，好处就越大。"
 SER_economic_council_expansion:0 "加深经济联系"
 SER_economic_council_expansion_desc:0 "迄今为止，经济联盟对组织内的成员国都非常有益，我们可以通过颁布经济理事会提议的新政策来进一步改善它。"
 SER_economic_council_application:0 "申请加入经济合作公约"
 SER_economic_council_application_desc:0 "由于战争，我们差点成为经济合作公约的最初成员国，现在战争已经结束，我们可以再次向该组织提出申请。"
 SER_diplomatic_action:0 "已经接触了一个阵营"
 SER_will_declare_war_tooltip:0 "§R贝尔格莱德条约的所有成员将在这个月结束前对我们宣战！§!"
 SER_will_declare_war_allies_tooltip:0 "§R塞尔维亚将在两周内对奥地利宣战，我们也将参与这场战争。§!"
