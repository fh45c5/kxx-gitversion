l_simp_chinese:
 kxxnews.1.t:0 "人民党赢得希腊大选"
 kxxnews.1.d:0 "尽管君主制未能复辟，人民党仍坚定前行，为希腊提供强硬的解决方案而非不切实际的幻想。新任总统康斯坦丁·卡拉曼利斯承诺，不仅要唤醒沉睡的民族梦神，更要使其重获新生。他的执政纲领包括先刺激经济继而重建军队，使希腊能够捍卫国家利益与公民安全。随着选举落幕，外界对希腊外交政策剧变的担忧逐渐平息。重新执政的保守派主张在全球博弈中保持中立立场，寻求均衡拓展经济影响力——这种务实取向相较意识形态之争，更能为希腊民众带来切实福祉。"
 kxxnews.1.a:0 "经济，蠢货！"
 kxxnews.2.t:0 "自由党赢得希腊大选"
 kxxnews.2.d:0 "尽管面临激进势力的威胁，自由党仍然成功保卫了希腊的民主制度。乔治斯·帕潘德里欧总统承诺加强希腊军队，开放经济，在镇压保皇党残余分子与激进政党的同时，还承诺进一步的改革，不仅在道德上，而且在军事和经济上修复希腊破损的国家机器，并寻求对土耳其人的复仇。"
 kxxnews.2.a:0 "让韦尼泽洛斯为我们而骄傲！"
 kxxnews.3.t:0 "进步党赢得希腊大选"
 kxxnews.3.d:0 "通过与自由党以及温和社会主义者的合作，进步党成功入主希腊政坛。新总统亚历山德罗斯·帕潘纳斯塔西乌承诺将推行社会学协会的纲领：改善工作条件、建立工会维护自身利益、保护妇女和未成年人、限制工作时间、设立周日为假日，并最终实现人人平等，与以上宣言一同推行的还有对工团主义的镇压，这为新政权的未来蒙上了一层阴影。"
 kxxnews.3.a:0 "巴尔干的粉点。"
 kxxnews.4.t:0 "全国人民激进联盟赢得希腊大选"
 kxxnews.4.d:0 "在选举结果出炉之前，没有人能想到全国人民激进联盟作为希腊政局的边缘党派，竟然能成功当选。随着前君主派将军乔治斯·孔季利斯正式宣布就职为总统，新政府开始了激进自由化与民族平等的进程：企业被私有化，对土耳其人等少数民族的其实也在减少。虽然孔季利斯鼓吹希土联邦主义，但他丝毫不掩饰对奥斯曼苏丹政权的蔑视，称他们为“阻碍希腊土耳其人民团结一致的最大敌人”，其外交政策仍然飘忽不定。"
 kxxnews.4.a:0 "再为一体？"
 kxxnews.5.t:0 "自由思想党赢得希腊大选"
 kxxnews.5.d:0 "多亏了与保守派的联盟，扬尼斯·梅塔克萨斯在保皇派阴谋失败之后仍能夺取希腊政权。自称“伯里克利再世”的梅塔克萨斯试图以拜占庭和斯巴达的精神复兴希腊，建立一个统一在信仰和国王之下的国家。在他夺权后的短暂动荡后，政府的民粹主义经济政策成功地让自由主义者和社会主义者对心怀不满的工人和农民不再那么有吸引力。梅塔克萨斯声称的所谓的第三希腊文明究竟是要回归古希腊传统还是复兴拜占庭遗产尚不可知，但伴随着焚书的气味，来自雅典的呼喊，建立一个远至本都的帝国的呼喊，已经传及欧洲其他地方。虽然不知道梅塔克萨斯的野心能实现几分，但他的政权已无内患，可以开始着眼于这些目标了。"
 kxxnews.5.a:0 "自奥林匹斯山巅而来之人。"
 kxxnews.6.t:0 "社会主义者赢得希腊大选"
 kxxnews.6.d:0 "在这片古代雕像和与不朽纪念碑伫立的土地上，一场社会主义革命曾是难以想象的。直到现在。广泛的社会主义联盟在取得选举胜利之后策反军队，一同反对共和国政府，社会主义势力势不可挡地向首都进军。希腊街头的革命的热情仍在高涨，不分青红皂白地对所谓反动势力进行暴力报复。一个临时政府已经被建立起来处理政变后希腊的稳定问题，并将召开一次大会，组建第一个属于社会主义者的政府。"
 kxxnews.6.a:0 "一场新的泰坦之战。"
 kxxnews.7.t:0 "最为英勇者"
 kxxnews.7.d:0 "希腊法学专家亚历山德罗斯·斯沃洛斯作为率先发起革命运动的先驱使他以压倒性优势赢得选举，而且他并不打算就此罢休。从今以后，他打算将希腊改造成一个真正的人民、民主和爱国主义之国。梅塔克萨斯等右翼分子因背叛祖国和残害人民被判处终身监禁，资产阶级的财产被国有化并分配给穷人，旧王宫被改建成公共公寓。斯沃洛斯在希腊引入法国式的制度的同时学习德国社民党，他与工会接触并组织了第一个工人委员会，还放开了政治领域，允许以前被查禁的政党加入人民民主派。"
 kxxnews.7.a:0 "为斯沃洛斯三呼万岁！"
 kxxnews.8.t:0 "农民革命"
 kxxnews.8.d:0 "科斯塔斯·加夫里伊利季斯带领的农民党凭借来自农村的选票成功当选。新政权誓将希腊建设为一个包容传统又面向未来的现代农民国家。土地改革在希腊上下轰轰烈烈地开展，地主、资产阶级与右翼分子则被迫用汗水洗清他们的罪恶，同时进行的工人委员会的组建与分权化的推行。甘美的希腊葡萄酒、奶酪与橄榄将毫无阻碍地端上所有希腊家庭的餐桌。"
 kxxnews.8.a:0 "农民的胜利！"
 kxxnews.9.t:0 "工团主义屹立不倒"
 kxxnews.9.d:0 "将全国左翼势力集结于希腊社会主义工人党旗下的尼科斯·扎哈里亚季斯成功赢得了连任。扎哈里亚季斯计划以法国模式全面改造希腊，大规模的工业化已经在全国上下开始，工人委员会代替了原有的权力结构，旧的掌权者们则在监狱内腐烂，与农业生产集体化一同进行的还有社会福利体系的诞生。随着新政府向第三国际示好，社会主义势力似乎在巴尔干站稳了脚跟。"
 kxxnews.9.a:0 "工人阶级的力量！"
 kxxnews.10.t:0 "真正的共产主义革命"
 kxxnews.10.d:0 "马克思主义价值观的真正先锋在希腊取得了胜利。迪米特里奥斯·约托普洛斯在社会主义代表大会上当选。他在讲话中宣布，希腊需要进行一场真正的革命，以建设一个现代的无产阶级国家。在他的领导下，希腊已偏离了原先的路线，经常批评工团主义是在创造一种资产阶级的”香槟社会主义“。相反，约托普洛斯推行了一种从小开始的社会主义教育理论。新希腊与托洛茨基国际共产主义派别有一些相似之处，似乎仍准备通过非正统的手段来实现正统社会主义。"
 kxxnews.10.a:0 "教育第一，教育至上。"
 kxxnews.11.t:0 "奔向太虚"
 kxxnews.11.d:0 "希腊革命最激进的力量取得了胜利。未来超现实主义者最初只是被认为是似乎无法用理性来解释的袭击纪念碑和政府大楼的反传统恐怖分子，但他们深知象征主义的力量，安德烈·布勒东最喜爱的斯皮罗斯先生终于可以上演他最伟大的戏剧了。未来超现实主义共产党已经上台执政，并宣布了其宣言：战胜现实，勇攀高峰，并获得永生的愿望。随即，大量资产阶级分子因“背叛”事业而被送上了断头台。欧洲保守派领导人们对这些恐怖分子十分警惕，因为他们组织简单的艺术宣言已经在希腊演变为新雅各宾派恐怖的萌芽。罗伯斯庇尔现在已重临大地。"
 kxxnews.11.a:0 "一切都是为了追逐星辰。"
 kxxnews.12.t:0 "中间区域的崛起"
 kxxnews.12.d:0 "革命的边缘派系，从社会主义工人党中分裂出来的小派系，希腊共产党在女权活动家贝娅塔·基西基斯的领导下成功当选。贝娅塔在执行共产主义教条之外，还激进地反对民主制度，主张以“人民统治(laocracy)”替代现有的社会主义民主制度。除此之外，她主张希腊与土耳其民族同根同源，理应统合为一个整体；波斯帝国、马其顿帝国、拜占庭帝国与奥斯曼帝国是一个连续性的普世帝国；东正教是基督教最纯粹的形式，正如同阿列维派是伊斯兰教最纯粹的形式一样。甚至有传言声称，这位希腊的热情之花对极右翼的金色黎明抱有同情。无论如何，希腊已经准备夺回它应有的地位，在将土耳其人民自封建主义解救出来的同时，将介于西欧与远东之间的中间区域塑造为新的社会主义“帝国”。"
 kxxnews.12.a:0 "东方主义再崛起。"
 kxxnews.13.t:0 "金色黎明推翻希腊政府"
 kxxnews.13.d:0 "臭名昭著的极右翼组织希腊国家社会主义党—更广为人知的名字是“金色黎明”—在黑色星期一之后迅速获得了大量支持，该党快速扩充了其准军事部队，并开始渗透军队。由于政府的不作为，金色黎明在积聚了足够实力之后一举发动政变推翻了原有政府。在击溃另一个极右翼政党希腊国民联盟并清洗了党内左派之后，经济学家乔治奥斯·斯皮里登·梅尔库里斯成功巩固了他的统治。东正教教堂被焚烧，取而代之的则是古希腊神明的雕像；犹太人、土耳其人与社会主义者被定义为国家公敌，古斯巴达的婴儿筛选流程也被重新引入。在不久的将来，或许爱琴海将再次染成红色……"
 kxxnews.13.a:0 "宙斯之怒。"
 kxxnews.14.t:0 "金色黎明推翻希腊政府"
 kxxnews.14.d:0 "臭名昭著的极右翼组织希腊国家社会主义党—更广为人知的名字是“金色黎明”—在黑色星期一之后迅速获得了大量支持，该党快速扩充了其准军事部队，并开始渗透军队。由于政府的不作为，金色黎明在积聚了足够实力之后一举发动政变推翻了原有政府。在击溃另一个极右翼政党希腊国民联盟并清洗了党内右派之后，卡瓦拉罢工的英雄康斯坦丁诺斯·斯佩拉斯成功巩固了他的统治。斯佩拉斯效仿比耶特里与拉努瓦尔的黄色工团主义，一个统一的希腊劳工阵线被建立起来以改善工人权利并禁止一切罢工，名为安全旅的秘密警察在全国范围内搜捕社会主义反动派、土耳其间谍与犹太银行家，并邀请进步党加入政府。在不久的将来，或许爱琴海将再次染成红色……"
 kxxnews.14.a:0 "赫尔墨斯笑到最后。"
 kxxnews.15.t:0 "国民联盟推翻希腊政府"
 kxxnews.15.d:0 "臭名昭著的极右翼组织希腊国家社会主义党—更广为人知的名字是“金色黎明”—在黑色星期一之后迅速获得了大量支持，该党快速扩充了其准军事部队，并开始渗透军队。由于政府的不作为，金色黎明在积聚了足够实力之后一举发动政变推翻了原有政府。然而好景不长，另一个极右翼组织希腊国民联盟发动了反政变，逮捕了大部分金色黎明成员。国民联盟领导人乔治·科斯米迪斯宣布将开始国家军事化进程并将东正教定为国教，犹太人、社会主义者与土耳其人则遭到屠杀。随着希腊重拾拜占庭认同，在不久的将来，或许爱琴海将再次染成红色……"
 kxxnews.15.a:0 "多年后它将重新属于你……"
 kxxnews.16.t:0 "红与黄"
 kxxnews.16.d:0 "金色黎明的左翼派系设法赢得选举，卡瓦拉罢工的英雄康斯坦丁诺斯·斯佩拉斯成功巩固了他的统治。斯佩拉斯效仿比耶特里与拉努瓦尔的黄色工团主义，一个统一的希腊劳工阵线被建立起来以改善工人权利并禁止一切罢工，名为安全旅的秘密警察在全国范围内搜捕社会主义反动派、土耳其间谍与犹太银行家，并邀请进步党加入政府。社会主义者哀叹革命被背叛，而民族主义者则欢欣鼓舞。新希腊彻底切断一切与第三国际的联系，并开始准备对土耳其的战争。"
 kxxnews.16.a:0 "赫尔墨斯笑到最后。"
 kxxnews.17.t:0 "从亚陀斯山统治"
 kxxnews.17.d:0 "尽管共和派战胜了保皇党，希腊的政治局势仍然没有任何稳定下来的迹象。随着紧急选举陷入僵局，希腊陷入了全国动乱之中。在万般无奈之下，议会只得接受梅塔克萨斯的提议，邀请君士坦丁堡牧首本雅明一世回国担任领导人。随后牧首本人在议会外对信众发表演讲，谴责了反上帝的金色黎明以及不信神的社会主义者。他还谴责了罗马教皇与新教，但仍然表示希望弥合基督教的分裂，希腊就此转变为一个神权国家。"
 kxxnews.17.a:0 "他能治理好国家吗？"
 kxxnews.18.t:0 "鸠占鹊巢"
 kxxnews.18.d:0 "尽管共和派战胜了保皇党，希腊的政治局势仍然没有任何稳定下来的迹象。随着紧急选举陷入僵局，希腊陷入了全国动乱之中。在议会拒绝梅塔克萨斯邀请君士坦丁堡牧首担任领导人的建议之后，由逃离保加利亚统治的马其顿人成立的国家改革党发动了政变，强迫议会选举他们的领导人索蒂利奥斯·戈扎马尼斯为领导人。戈扎马尼斯奉行激进的民粹主义政策，在学习意大利民族主义协会的同时声称希腊人尤其是色雷斯马其顿人拥有天生的民族美德。随着戈扎马尼斯开始宣传所谓“希腊—泛斯拉夫主义”，希腊的命运再次飘忽不定。"
 kxxnews.18.a:0 "希腊的泛斯拉夫主义？疯了吧？"
 kxxnews.19.t:0 "永恒金色黎明"
 kxxnews.19.d:0 "尽管共和派战胜了保皇党，希腊的政治局势仍然没有任何稳定下来的迹象。随着紧急选举陷入僵局，希腊陷入了全国动乱之中。在议会拒绝梅塔克萨斯邀请君士坦丁堡牧首担任领导人的建议并挫败国家改革党的政变之后，由梅塔克萨斯派、金色黎明与国民联盟组成的联合右翼发动了反政变推翻了议会，并推举女诗人西察·卡赖斯卡季斯领导国家，然而，卡赖斯卡季斯本人不但支持约尔格·利本菲尔斯、阿尔伯特·罗森伯格等人的思想，更崇拜卡尔·李卜克内西与约瑟夫·戈培尔(有传言称卡赖斯卡季斯对他们皆抱有性幻想)，且与社会主义工人党联系颇深。新政权一边反对无神论社会主义，另一边却支持某种左翼神秘主义。只有时间才能告诉人们，这一极权主义与国家民粹主义的杂交政权的未来将会如何。"
 kxxnews.19.a:0 "神圣！神圣！神圣！"
 kxxnews.20.t:0 "再次奏响俄耳甫斯圣歌"
 kxxnews.20.d:0 "本雅明一世将所有资源全部浪费在与罗马教廷和新教辩经的行为激怒了所有人。愤怒的社会主义民兵突袭了亚陀斯山，在叛变的神职人员的帮助下逮捕了牧首。这场政变的领导人，古希腊多神教信徒西克利亚诺斯夫妇随后宣布了旧神权政府的倒台以及新的神权政府的诞生。随着牧首被判处终身监禁和苦役，俄耳甫斯复兴计划开始了。文化转型预计将是一项长期任务，但与此同时，俄耳甫斯派尝试将古希腊多神教与革命社会主义结合起来，制定了引人注目的经济和文化计划，旨在改善希腊人民的福祉，尤其是经常被忽视的农村地区。西克利亚诺斯夫妇还准备重新举办德尔斐节，向全世界展示希腊文化的丰功伟绩。"
 kxxnews.20.a:0 "一个新旧交织的希腊。"
