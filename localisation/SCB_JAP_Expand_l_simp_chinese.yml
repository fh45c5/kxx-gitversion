 SCBJAP.120.t:0 "山河燃烧，秩序尽毁"
 SCBJAP.120.d:0 "东京的“维新”狂热在第七十二小时被钢铁碾碎。寺内寿一冰冷的声音通过被强占的电台刺穿寒流：“全日本国民。盘踞东京之‘维新政府’，叛国逆贼！纵兵屠戮，胁迫宫廷！天皇震怒，敕命讨逆！” “本官奉旨率师，光复帝都！野中四郎、安藤辉三、香田清贞等，业已伏法！即日起，全国戒严，乱序者，格杀勿论！”电流“滋啦”切断广播。东京街头，狂热标语被“肃清国贼”、“绝对服从”的墨迹覆盖。卡车满载尸体驶向焚场，宪兵黑车掠过首相官邸废墟前。\n\n寺内寿一在指挥帐篷中审阅最新的北国情报，脸色阴郁如铁。不仅仅是东京在燃烧，远在北海道的佃农、伐木工与矿工正打着“全日本勤劳者共斗会议”的旗号疯狂集结。这绝非单纯的佃农起义——原本相互仇视的右翼分子、宗教活动者与潜伏多年的赤色地下党，竟以一种怪诞的姿态达成了“共斗”。\n\n电报纸在寺内指尖微微颤抖：“上川郡沦陷，当地役所被烧毁，地主与官吏被强行拉上荒原公审。日莲宗的僧侣呼'人间天堂即刻降临'，赤色分子的武装先遣队则在一旁严密布阵，确保所谓的'国民革命'不被干扰。”美瑛、富良野已成泽国，暴徒们声称：“趁东京的狗官们自相残杀，我们要在北国重建真正的皇国与自由！”\n\n帐篷外，工兵铲清理瓦砾的声音单调而急促，象征着旧秩序的强行缝合。但寺内知道，这只是暂时的回光返照……"
 SCBJAP.120.a:0 "立即派兵镇压！"
