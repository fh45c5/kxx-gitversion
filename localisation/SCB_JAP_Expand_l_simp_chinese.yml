l_simp_chinese:
 JAP_Hiranuma_Kiichiro_desc:0 "§Y领导人介绍\n\n生于：§!§L庆应3年9月28日;江戸幕府、美作国西北条郡§!\n§Y生涯：§!平沼骐一郎为日本资深司法检察官僚出身，长期担任枢密院副议长。他与门生组成的‘平沼阀’是日本思想检事体系的核心力量，致力于肃清外来思想对国体的威胁。1934年斋藤内阁倒台后，平沼凭借与政友会总裁铃木喜三郎的私谊，兼得皇道派领袖荒木贞夫、真崎甚三郎支持，顺利组阁，并大力推行翼赞政治。\n\n§C备注：平沼对左翼、右翼思想均抱敌视态度，视一切外来思想皆不如传统东洋道德。此立场令其与意图推动政治改革的革新派政治家关系不睦。"
 SCBJAP.1.t:0 "旭日之下万骨寒：促狭的民主"
 SCBJAP.1.d:0 "1919年，日本在屈辱的“光荣和平”中维持了其大部分殖民帝国，但战后经济的剧烈波动引发了席卷全国的“米骚动”。寺内正毅倒台后，原敬的政友会内阁开启了政党政治的先河，却因其在1921年的遇刺而蒙上阴影。1924年，随着“第二次护宪运动”的成功，加藤高明组成了强大的护宪三派内阁。他在任内推动了男子普选权的通过，但也为了安抚保守派，主导通过了《治安维持法》，旨在严厉镇压受英法革命影响的“赤色分子”。这一时期，大正民主达到了顶峰，但危机已在暗处滋生。随着加藤病逝，政坛进入了更为动荡的时期。\n1927年，政友会总裁田中义一大将上台。田中通过高超的政治手腕，成功劝说先前离党的“政友本党”大部分派系回归，实现了政友会的大团圆。他试图在国内推行强权统治，在外交上则采取“积极政策”。然而，田中的满洲冒险遭遇了前所未有的阻力。日本为保护南满铁路利益并扶持奉系军阀干涉直奉战争，与在华势力日益扩张的德国发生了严重的利益冲撞。日德军队在满洲边缘的长期对峙耗尽了国家的财力与耐心。随着1929年美国经济地震，台湾银行丑闻与“地震钞票”危机交织，田中内阁在军方强硬派与德国外交压力的双重挤压下精疲力竭，最终黯然倒台。"
 SCBJAP.1.a:0 "然后呢？"
 SCBJAP.2.t:0 "旭日之下万骨寒：超然政治"
 SCBJAP.2.d:0 "随后，滨口雄幸作为民政党总裁接手了这副烂摊子，他试图通过重返金本位和签署海军限制条约来挽救国家，但这却为他招来了右翼的子弹。1930年，滨口在东京站遇刺重伤，日本政坛陷入了前所未有的权力真空。面对如此情况，民政党选择了陆军温和派领袖宇垣一成担任总裁，并与政友会组成了联立内阁。然而，由于两党在削减军费与对德政策上的根本分歧，这个脆弱的联盟仅维持了两年便告崩塌。1932年，犬养毅重组政友会单党内阁，却在“五一五事件”中死于激进军官之手。接任的斋藤实海军大将虽然组建了名义上的“举国一致”内阁，但其行政骨干大多来自贵族院的亲民政党派系。这一“伪装的民政党政权”遭到了平沼骐一郎及在野党政友会的猛烈抨击，最终因贪腐丑闻下台，内阁黑幕伊泽多喜男也因遭到右翼袭击，与币原喜重郎共同退阵。最终，平沼骐一郎突破了各方掣肘，顺利组阁。"
 SCBJAP.2.a:0 "我想了解平沼内阁的状况。"
 SCBJAP.3.t:0 "旭日之下万骨寒：大御所的困境"
 SCBJAP.3.d:0 "平沼骐一郎在政友会主流派、陆军皇道派及海军激进派的簇拥下组建了所谓的“国民内阁”，试图以强权终结此前的混乱。然而，两年的执政时光并未带来所谓的“昭和维新”，反而将帝国推入了更深层的政治泥沼。\n平沼内阁建立在脆弱的平衡之上。首相虽依仗政友会正统派成功瓦解了前任斋藤内阁中民政党的官僚垄断，却因这种赤裸的政友会霸权，导致原本的盟友国民同盟与昭和会转入不信任的对立面。内阁内部俨然成为了各方政治怪胎的收容所：真崎甚三郎接掌陆军省后，虽然雷厉风行地清洗统制派核心，却未能根除其势力，反而迫使那些被边缘化的统制派军官与大川周明等激进右翼达成隐秘契约，试图卷土重来。与此同时，长州阀旧部对身为佐贺阀的真崎极度厌恶，闲院宫更是在暗中伺机而动，试图利用下级军官对内阁“谎话连天”的怨愤，将真崎彻底拉下马。\n更为讽刺的是，平沼骐一郎对“国体”近乎病态的固执，促使其强推了更严厉的《治安维持法》修正案。这种无差别的铁腕镇压，不仅未能清除“赤色分子”，反而迫使遭受迫害的极左势力与同样被打压的激进右翼在阴影中达成了一种畸形的“反平沼共识”。"
 SCBJAP.3.a:0 "糟透了。"
 SCBJAP.4.t:0 "旭日之下万骨寒：近卫新党运动"
 SCBJAP.4.d:0 "平沼内阁执政期间，政府派系失衡与军队的持续动荡导致日本政局陷入停滞。面对这一局面，政界内部要求改革的呼声渐起。以政友会、民政党及国民同盟中的部分中坚力量为基础，部分政客与开明官僚开始寻求改变，并将近卫文麿公爵视为重组政坛的核心人物。\n近卫文麿作为元老西园寺公望的政治侧翼，虽长期保持疏离姿态，但其跨派系的号召力使其成为各方革新势力的目标。以有马赖宁、后藤隆之助为核心的“昭和研究会”作为近卫的智囊团，开始谋求整合即成政党内不满政友会霸权与内阁无能的各派力量，试图构建一套能够整合陆海军分立、提升行政效率的全新决策机制。\n这一动向遭到了平沼骐一郎的强烈抵制。平沼视新党运动为“赤色分子”渗透与捣乱的结果，认为其试图推行的一党一国体制违背了帝国宪法下的国体原则，属于严重的违法行径。\n然而，随着平沼内阁在处理军队内耗与经济管理问题上的彻底失败，原本支持政府的中间力量进一步流失。近卫公爵的出马恐怕是早晚的事。"
 SCBJAP.4.a:0 "天皇陛下，万岁！"
 SCBJAP.5.t:0 "新年"
 SCBJAP.5.d:0 "平沼骐一郎在新年祝词的喧嚣后躲进了私邸侧室，他没有说话，只是缓慢地点燃了一支烟。淡蓝色的烟雾在昏暗的室内盘旋，他沉默地注视着坐在对面的阁僚，手中那份关于选举动向的报告纸角已被揉得皱缩。\n“这就是所谓的肃正？”平沼将烟蒂重重按灭在水晶缸里。内务大臣田边治通不安地挪动着身子，他负责的选举净化运动不仅收效甚微，反而因政友会层出不穷的资金输送与暴力威慑，让大选沦为一场荒唐的闹剧。这不仅给了在野的民政党与昭和会口实，连平日里观望的基层民众也难掩疑虑，平沼能感觉到，自己精心构建的合法性外壳正在碎裂。\n“首相，”内阁书记官长太田耕造压低了声音，额头上渗出冷汗，“民政党已公开表态，要将选举舞弊与陆军近期的丑闻作为质询重点。若任由事态发酵，国会势必瘫痪，议程恐怕要无限期空转。”\n平沼揉了揉眉心，对此心知肚明。在野党绝不会放过这围猎的机会，无止境的党争与扯皮将彻底耗尽内阁仅存的行政执行力。更令他心寒的是财政端的溃败：为了填补军部那无底洞般的扩军需求，结城丰太郎强行转向赤字扩张，这无异于饮鸩止渴。他再次划亮火柴，摇曳的烟火映照出他那张阴鸷而焦虑的脸。对他而言，漫长而又短暂的崩溃开始了。"
 SCBJAP.5.a:0 "“帝国怎么办，我也不知道了。”"
 SCBJAP.6.t:0 "第七十届国会：天价救助"
 SCBJAP.6.d:0 "全球经济海啸的突然袭击与农村社会的连锁崩溃，已将平沼内阁逼至帝国成立以来的最危险时刻。\n当平沼骐一郎步入议事堂时，空气中弥漫着压抑的焦灼。在野党席位上，昭和会议员东武率先发难，他提出了一项要求政府立即投入数十亿日元用于“紧急农村救济与失业者救助”的议案。平沼握着讲稿的手指微微泛白，他比谁都清楚这项动议的破坏力：数十亿日元的巨额支出不仅超出了财政极限，更与军部索要的无底洞军费针锋相对。若接受，财政将即刻崩溃；若拒绝，便等同于公开向国民承认内阁“视底层死活于不顾”。\n这番提议在会场内引发了剧烈的连锁反应，威力犹如一枚投向内阁基座的重磅炸弹。在野党联手利用农村的绝望与城市的萧条，以此为筹码意在彻底摧毁内阁仅存的行政权威。议事堂内，此起彼伏的叫嚣与攻讦淹没了任何理性的讨论，会期在无休止的争吵中被无限拖延。"
 SCBJAP.6.a:0 "可恶……" 
 SCBJAP.7.t:0 "第七十届国会：国家安全保障法"
 SCBJAP.7.d:0 "几天后，国民同盟担心局势彻底失控，由安达谦藏出面进行各方调停。那项让平沼内阁焦头烂额的农村救济动议随之被暂时搁置。\n国会审议的焦点迅速转移。平沼抛出了由他本人与政友会总裁铃木喜三郎、法务大臣盐野季彦预先敲定的草案——《国家安全保障法》。这部旨在强化治安维持的综合性法案早就躺在内务省的案头，只等时机成熟便全盘推出。\n法案的条款涵盖了思想管治、社会监控与战时动员，核心内容是赋予内阁在非常状态下不受议会与司法干预的行政特权。凡是对政府方针的质疑、未经允许的结社或任何形式的扰乱秩序行为，都将被直接定性为破坏国家安全。\n平沼站在讲台上推进审议，他的态度极其强硬。对他而言，这是一场防御性的反击，目的是通过立法彻底清扫议会内的反对声音。但他清楚，这份法案一旦通过，意味着他将公开与所有的在野党派、甚至包括近卫文麿身后的政治势力全面摊牌。坐在台下的议员们看着手中的法案条文，会场内的气氛比几天前更加紧绷。平沼点燃了一根烟，在烟雾中等待着议会最终的投票结果。"
 SCBJAP.7.a:0 "不过了吗？" 
 SCBJAP.8.t:0 "第七十届国会：满洲驻军计划"  
 SCBJAP.8.d:0 "因《国家安全保障法》的抛出，第七十届国会彻底陷入死锁。还没等内阁从党争中抽身，陆军省突然发布的一纸调令，又给这锅沸水投下了一枚重型炸弹。\n陆军大臣真崎甚三郎以“加强满洲防务”与“轮换训练”为借口，下令将一批皇道派的核心尉官成建制地抽调至满洲，充当所谓协助张作霖政府的“教导人员”。这并非简单的调防。这些被视为“激进”的皇道派中下层军官心里很清楚，这是真崎为了自保，在对他曾经的门生进行清洗与放逐。将这群狂热分子推向满洲那个俄、中势力交错，且物资极端匮乏的边缘地带，无异于让他们在政治与现实的双重绞杀中“自生自灭”。\n这道调令在军队基层引发的震荡远超内阁预想。被抛弃的少壮军官们感受到的是一种彻骨的背叛——那位平日里高喊“维新”的真崎陆相，如今为了保住自己的权位，不惜亲手将最忠诚的部下推向火坑。长久以来积压的愤懑与绝望，因这“皇道派杀皇道派”的背叛操作彻底点燃。驻地军营内的气氛已极度危险，下层军官之间关于“肃清腐败陆相”的密谋声浪，在阴影中迅速汇聚。"  
 SCBJAP.8.a:0 "全部都要完了。"  
 SCBJAP.100.t:0 "不安的预谋"
 SCBJAP.100.d:0 "东京市外的某处住宅内，纸窗敞着半扇，夜风湿漉漉地渗进来，带着新叶和泥土的气息。壁炉是冷的，空余一堆灰白的残烬。一盏油灯搁在矮几上，火苗被风扰动，昏黄的光晕在空旷的和室梁柱间不定地晃。角落里松木板壁的霉味，被湿气裹着，沉甸甸地浮在空气里。井上日召将削完水果的小刀收回皮鞘中，一旁的橘孝三郎正把一份报告按在膝上，沉默地等待着。大川周明正低着头，面对着铺开的东京地图，在大大小小的角落处做着标记。\n油灯火苗猛地一跳。\n“差不多了。”大川丢下炭笔，声音低沉。\n橘立刻接话，手指戳向地图：“断电，翻墙，我的人做。”\n井上则慢条斯理地说：“夜班守卫少，墙头空。孩子们都安排好了，出身都干净，一人一杀。”\n大川点头，将东京那些有名人的相片从桌下拾起，散在地图上。“斋藤实、池田成彬、牧野伸显……”\n外面传来隐约的、沉闷的敲击声，那是他们三个的人在准备着明日的正式行动。\n橘孝三郎突然抬眼逼视大川，摸出一张纸条：“那边的青年军官，起事时间能咬死？”他声音压得很低。\n大川从地图上撕下一角，凑近油灯火苗。纸页边缘卷曲焦黑。“定了。”火焰贪婪地吞噬着纸片。井上霍然起身，刀鞘撞上矮几，“当”的一声脆响。油灯的光猛烈摇晃，三人的影子在斑驳墙面上狂乱地扭动了一瞬。窗外，骤雨终于砸了下来，密鼓般捶打着屋顶。"
 SCBJAP.100.a:0 "风雨欲来，山河燃烧……"
 SCBJAP.101.t:0 "玄洋与大本"
 SCBJAP.101.d:0 "大阪某处，神龛上松枝燃烧的烟雾混着线香，凝成青白色的旋涡，在梁柱低垂的幽暗空间里缓缓上升。厚重的榻榻米中央，几处深陷的凹痕显示着常有人跪坐。木格窗外，城市的喧嚣被厚重的墙壁隔绝，只余一片沉闷的寂静。\n出口王仁三郎盘膝端坐于蒲团之上，宽大的白色祭袍下透出富态圆润的身形。他圆润的面庞上，一双细长的眼睛几乎隐没在眼睑的褶皱里，只偶尔在烟雾中闪过一丝让人捉摸不透的光，仿佛永远在浅笑。他厚实的手指无意识地摩挲着矮几上那块温润龟甲的神秘刻痕，一旁搁着半碗冷透的茶。\n对面，内田良平虽也盘坐，但灰白相间的长须如银瀑般垂落胸前，几乎覆住了整个前襟，透出年长者的威严。他刚从风尘仆仆的旅途下来，灰色和服衣襟一丝不苟，靴子边缘还沾着干燥的关东泥土，唯有那双锐利的眼睛，在皱纹和白须的包围中，依旧如鹰隼般刺破了烟雾。\n“下位的手笔，确实像样了。”出口的声音低沉缓慢，带着奇特的共鸣，他眯缝的眼缝似乎更细了。窗外树影落在他圆润的脸上。“关西的‘维’，已有筋骨。”\n内田良平没有碰面前的茶水，他灰白的长须微不可察地颤动了一下，锐利的目光穿透烟雾，直钉向出口那双仿佛闭合的眼睛：“筋骨有了，现在要看东京那边的‘新’。”他解开和服前襟，取出一枚卷得极紧的蜡丸，两指捏着，轻轻放在龟甲边缘，动作间长须随之拂动。“风，从江户城那头吹来了，很大。青年军官的火把……要点燃了。”他话语里每一个音节都像锤子敲打铁砧。\n出口王仁三郎一直眯着的双眼骤然睁开了极细的一线，精光乍现，如同暗室中划过的冷电，圆脸上的和蔼瞬间被一种深沉的警觉取代。他厚实的手指猛地攥紧了龟甲，指节发白。烟雾在他头顶盘旋，几乎要触到低矮的房梁。寂静中，只有线香燃烧的“哔啵”声，以及内田良平身上那股来自东京的、尚未散尽的风尘与铁锈气息。"
 SCBJAP.101.a:0 "“昭和神圣会在必要时会配合。”"
 SCBJAP.102.t:0 "青年的交谈"
 SCBJAP.102.d:0 "雨点单调地敲打着营房铁皮屋顶，像不耐烦的计数。煤油灯火苗在冷风中摇摆，将桌边几张年轻面孔的影子扯得扭曲。空气中混杂着旧军装的汗味与机油味，焦灼而滞重。\n矶部浅一背靠铁壁，手指捻着脱线的线头，声音压得极扁：“都确认了？明晚九点，别摸错地方。”\n香田清贞死死抵着刀镡，指节发白，颤声应道：“闭着眼睛都能摸到！”\n安藤辉三捏起一块干硬饭团，语气平淡却如淬冰的探针：“饭要煮得恰到好处，米粒要一粒是一粒。”他扫视众人，河野寿与野中四郎下意识挺直背脊。野中想喝水，手一晃，水洒在了卷曲的《步兵操典》上。\n“西田税先生那边，联络上了吗？”矶部停下动作，目光锐利。\n角落里划线的笔尖骤停。安藤斩钉截铁地回答：“联络上了。北一辉先生也写了回信。”\n河野寿猛地一震，脸上涌起不正常的潮红，脱口而出：“好！”\n死寂中，雨声如狂乱的心跳。火苗剧烈一跳，巨大的阴影瞬间吞没了半张桌子，将这群被狂热与恐惧撕扯着的青年，更深地埋进昏暗里。"
 SCBJAP.102.a:0 "维新的本意到底是什么呢……"
 SCBJAP.103.t:0 "永田的工作"
 SCBJAP.103.d:0 "陆军省走廊空旷，永田铁山办公室门缝下渗出惨白的冷光。室内秩序井然，巨大的办公桌纤尘不染，唯有一杯冷透的茶。永田背脊挺直，手中的红蓝铅笔在军需报表上精确移动，镜片后的双眼如深不见底的寒潭。\n一名年轻参谋官推门而入，脸色苍白：“阁下……宪兵队报，最近‘闲杂人员’走动异常。特别是‘明晚’的巡逻路线……”他没提“皇道派”，但警报已极度露骨。\n永田的铅笔没有停顿，只从喉咙深处应了一声：“嗯。”仿佛听到的只是琐碎报告。\n门合拢后，死寂回归。永田终于抬头，指腹触碰冰冷的瓷杯，随即看向一份被压在预算案下的绝密情报，上面只有一行字：“目标：阁下。时间：明夜。”\n他若无其事地继续翻阅文件，另一只手却极其缓慢地捻动铅笔，指尖因用力而泛白。\n窗外霓虹流过镜片，留下短暂而虚幻的冷痕。"
 SCBJAP.103.a:0 "这次的暴动计划，不寻常。"
 SCBJAP.104.t:0 "俱乐部畅谈"
 SCBJAP.104.d:0 "海军俱乐部内，雪茄烟云与威士忌的泥煤味交织。厚重的丝绒窗帘隔绝了严寒，仿炭精电炉发出橙色的暖光。留声机播放着忧郁的旋律，掩盖着角落里的议论。\n海军将领们陷在皮沙发里，藤田中将优雅地夹着雪茄，烟灰积落而不坠。\n“下雪了？”他慵懒地问。\n对面大佐心领神会，晃动着冰块叮当响的酒杯：“‘隔壁’的炉子烧得太旺了，几个年轻‘消防员’嫌烟囱太堵。”\n另一名少将切着黑森林蛋糕，语带讥讽：“烧掉些枯枝败叶是好事，只要别点着整栋房子。我们这栋楼，可都是好木头。”\n藤田弹落烟灰，声音如解剖刀般切入空气：“让他们烧。火势一起，谁是朽木，谁是栋梁，一目了然。”他目光冷冽，“我们备好水龙。等‘必要’的时候，让那些脑子过热的小伙子清醒清醒。”\n电炉火光跳跃，海军精英们举杯啜饮。窗外冬夜深沉，厚重的窗帘挡住了隔壁柴火爆裂的任何声响。"
 SCBJAP.104.a:0 "隔岸观火。"
 SCBJAP.105.t:0 "警察的苦恼"
 SCBJAP.105.d:0 "内务大臣后藤文夫的办公室，笼罩在台灯昏黄的光晕里。空气污浊，混杂着苦茶与浓重的烟味。后藤瘫坐在椅子里，一只手用力按着发胀的太阳穴，办公桌上那份薄薄的情报却重逾千斤：新桥、神田一带，下级军官频繁秘密集会，言论直指“清君侧”。\n警保局长安倍源基站在办公桌前，这位以强硬著称的警官此刻满脸焦躁，皮鞋在老旧的地板上急促踱步。“大臣！”他猛地停下，声音压抑而紧绷，“这绝不是寻常的牢骚。时间、地点、人员，所有的指向性都太明确了！我们必须立刻采取行动……”\n“行动？”后藤文夫抬起头，布满血丝的眼中透着一种近乎绝望的清醒，“把这些证据送给陆军省，然后呢？等着他们像处理以前那些‘麻烦’一样，反咬我们一口挑拨军民关系？”他嘴角扯出一个苦涩的弧度，“在那些人眼里，警察的干预本身就是对帝国根基的‘不忠’。”\n安倍源基僵在原地，下意识摸了摸腰间的配枪，冰冷的触感在此刻显得讽刺而无力。\n“军队的事，他们只想自己管。”后藤疲惫地将卷宗摔在文件堆顶，“而我们……连这间办公室的窗户都护不住。”\n室内陷入死寂，唯有水壶在火炉上疯狂尖鸣，蒸汽顶得壶盖“咔哒”作响，仿佛随时会炸开。后藤佝偻着背，像被无形的重担压垮。窗外，陆军省大楼的灯光依旧在黑夜中无情地亮着。"
 SCBJAP.105.a:0 "难左右……"
 SCBJAP.106.t:0 "一名“工人”的夜晚"
 SCBJAP.106.d:0 "东京下町区陈旧的长屋里，空气中弥漫着劣质木炭的呛烟与旧榻榻米的霉味。小林坐在冰冷的屋角，粗糙的手紧攥着一张湿软的米纸。字迹在昏黄灯光下模糊而刺眼：“明日，蛰伏，观察，待机，北方。”这是半小时前，巷口一个行色匆匆的“醉汉”塞给他的。\n他盯着纸条看了几秒，眼神如凝固的深潭。随后，他从榻榻米下拖出工具箱，里面没有木工活计，只有用油布仔细包裹的金属零件、棉纱和几本卷边的手册。手指在冰冷的零件上无意识拨弄，发出细微的磕碰声，指甲缝里的油污与机油味混合在一起，那是属于底层劳动者的气息。\n小林起身走到气窗前，额头抵着冰冷的窗框，侧耳捕捉着死寂中的动静。没有枪响，没有军靴声，只有远方工厂沉闷的汽笛。他回到灯下，将米纸凑近灯泡上方的热源。火苗贪婪地舔舐着“蛰伏”、“观察”、“北方”，字句在青烟中消散，只留下一点焦糊味。\n他吹熄指尖的火星，掀开墙角一处松动的榻榻米。油布裹着的南部式手枪轮廓清晰可见，散发着冰凉的金属质感。他没有取出武器，只是用指腹在油布上用力、缓慢地来回擦拭，仿佛在安抚某种狂躁的冲动。\n熄灯后，屋内被浓稠的黑暗吞噬。小林躺在榻榻米上，睁眼望着模糊的天花板。时间像凝固的沥青，粘稠地流淌。他在等待明天的第一声枪响，等待黑暗尽头可能亮起的、属于“北方”的光。指缝间的机油味，在死寂中愈发清晰。"
 SCBJAP.106.a:0 "该流血了……"
 SCBJAP.107.t:0 "陆军异动"
 SCBJAP.107.d:0 "今天我们陆军大臣川岛义一已经感觉到了不对劲。近期基层军官秘密串联、部队夜间异动、激进言论甚嚣尘上，和民间右翼搭上了线。之前一些青年军官试探性地来询问他如果发生政变，陆军整体的态度是什么。夹在统制派与皇道派之间，对立宪政府也确实不信任的川岛含糊其辞，暗示了陆军高层不会大动干戈。但现在似乎一些民间右翼的恐怖行为正在影响着陆军下层，他也隐约听说了今晚可能发生恐怖袭击事件。但目前的情况很不明确，现在就把事情挑大反而会激化矛盾，他实在不知如何是好。"
 SCBJAP.107.a:0 "……让近卫军团监管他们，宪兵队的情况也要摸清。"
 SCBJAP.108.t:0 "东京的灯，灭了"
 SCBJAP.108.d:0 "时间像被冻住的沥青，粘稠地滑向预定时刻。东京的夜空，原本被都市的灯火切割得支离破碎，霓虹的河流在楼宇间喧嚣流淌。橘孝三郎手指粗糙而稳定，猛地压下总闸手柄。那是一声沉闷、如筋骨断裂般的“咔哒”声。\n刹那间——\n以这处配电所为中心，黑暗如同墨汁滴入清水中，迅猛无声地晕染开来。先是近处几栋低矮民居的灯火倏然熄灭，如同被无形的手掐灭了烛芯。紧接着，神田、新橋、麹町……一片又一片区域的灯火，如同多米诺骨牌般接连倒下。皇宫外苑的奢华灯饰、霞关官厅大楼里冰冷的日光灯管、银座橱窗流溢的霓虹、下町区窗口昏黄的灯泡……整个东京的血管，被瞬间截断。最后熄灭的是首相官邸门前那盏孤悬的路灯，光晕挣扎着收缩，最终化为一点微弱的红热，旋即没入彻底的墨色。\n巨大的城市陷入死寂，旋即被更巨大的声浪吞噬。\n“啊——！”\n“停电了？！”\n“怎么回事？！”\n惊呼、咒骂、奔跑的脚步、孩童的哭嚎、家具被撞倒的巨响……从无数个窗口、街巷中喷涌而出，汇聚成一片混沌的声浪，在这无光的城市上空翻腾。汽车的灯光骤然亮起，如同受惊野兽慌乱的眼睛，光束在黑暗中急促地扫射、相撞，喇叭声凄厉地撕破夜空，在突然失去参照物的街道上制造出新的恐慌和拥堵。\n内务省大楼内，后藤文夫猛地从堆满文件的办公桌上抬起头，桌上的台灯灭了。他冲到窗边，只看到本该灯火通明的霞关，此刻一片令人心悸的墨黑。他喉头滚动，想喊安倍源基，却只发出一声嘶哑的抽气声，一股冰冷的寒意顺着脊柱直冲头顶。\n与此同时，陆军第一联队驻地附近，金属碰撞的摩擦声与急促的口令声骤然响起。黑暗中，靴子践踏积雪的声音汇成一股暗流，撕开寂静，朝着东京的心脏——永田町方向奔涌而去。\n东京，这座帝国的巨兽，在突如其来的、彻底的黑暗中，开始了它混乱而血腥的痉挛。"
 SCBJAP.108.a:0 "夜，开始了。"
 SCBJAP.109.t:0 "分叉之刃"
 SCBJAP.109.d:0 "断电后的东京是一片被枪声撕裂的拼图。首相官邸外，年轻士兵们在寒风中构筑工事，刺刀闪着幽蓝冷光。他们像饿狼般围困着这里，但目标冈田启介是生是死，尚无人敢断言。通讯已断，官邸深处唯有死寂。\n颠簸的卡车厢内，煤油灯照着弹药箱上的地图。赤坂离宫、警视厅、朝日新闻社……帝国的咽喉被密集的红圈圈定。\n“磨蹭什么！”香田清贞猛砸车板，眼球布满血丝，“名单上的人一个不留！斋藤实那个老朽，今晚必须送他‘上路’！还有西园寺那个……”提到西园寺公望，他的声音像被砂纸磨过，充满了刻骨的恨意。车厢内骤然一静。\n野中四郎抓紧枪身，颤声提醒：“安藤君，动了元老……万一天皇震怒……”连最激进的矶部浅一也抿紧了唇。除掉身为重臣的斋藤实尚能推说是“清君侧”，但动了西园寺，性质便彻底变了。\n安藤辉三沉默着，眼神如冰封寒潭。他在两股力量间权衡：是追随井上日召那种“流血净化”的疯狂，用斋藤实、冈田启介等人的血来染红旗帜？还是保全军职，专注于夺取电台、银行与陆军中枢，以此作为建立新秩序的筹码？\n车厢剧烈颠簸，仿佛行驶在崩溃边缘。是化身彻底的刺客，还是成为新政权的旗手？这把维新之刃，在黑暗中分了叉。"
 SCBJAP.109.a:0 "一人一杀！今夜必须‘玉碎’，彻底扫清障碍"
 SCBJAP.109.b:0 "刀锋所指，是为中枢！集中力量夺取政权！"
 SCBJAP.110.t:0 "高桥是清之死"
 SCBJAP.110.d:0 "高桥是清官邸。浓稠的黑暗中，安藤辉三与中桥基明率兵撞开纸门，皮靴粗暴地踏碎了宅邸的宁静。手电光柱如冷酷的追光，直射室内。\n高桥是清穿着白色寝衣，蜷缩在被褥中，稀疏白发在强光下近乎透明。他布满皱纹的脸因惊惧而扭曲。一名挡在身前的女子被士兵粗暴拽开，跌落在地，发出绝望的尖叫。\n“高桥是清！”安藤的声音在混乱中如冰块坠地。\n老人徒劳地后缩，哆嗦的嘴唇发不出完整的音节。安藤没有半分迟疑，下颌线条在阴影中绷紧，冷冷吐出两个字：“斩奸！”\n刺刀瞬间突刺，带着机油味的钢铁撕裂了脆弱的寝衣。数把刀刃从不同角度捅入那衰老的躯体，肉体被洞穿的闷响在和室里清晰可闻。高桥的身体剧烈弹起又重重摔下，鲜血如泉涌般在洁白的被褥上洇开。\n浓烈的血腥味瞬间覆盖了屋内原本的线香气息。手电光冷漠地掠过那具抽搐的残骸，安藤面无表情地向一旁失声痛哭的女子微微颔首，语调平板得令人发指：“失礼了，打扰了。”\n皮靴声迅速远去。黑暗中，只剩下粘稠血珠从榻榻米滴落的声音，以及整座城市在无光之夜中的混乱哀鸣。"
 SCBJAP.110.a:0 "财政之碍已除。"
 SCBJAP.111.t:0 "重臣的终结"
 SCBJAP.111.d:0 "凌晨的东京街头，雪花开始零星飘落，覆盖在尚未干透的血迹上。在陆军省附近一处隐蔽的街角，几支刚完成“任务”的小队在一片死寂中会合。空气中弥漫着刺鼻的硝烟味与剧烈的喘息声。\n中桥基明带着满身的寒气率先抵达。他的军服上溅着几点洗不掉的暗红，眼神中透着一种空洞的亢奋：“高桥是清那边已经解决了，那个老朽没撑过第一轮突刺。”\n片刻后，另一支小队由渡边太郎率领疾步而来。他的刺刀尚未入鞘，刀尖在雪地上拖出一道断断续续的红线。“渡边教育总监也已伏诛。”他声音嘶哑，带着一丝事后的虚脱感，“那老头子倒是硬气，但在‘维新’的大义面前，什么都不是。”\n最后抵达的一名尉官脸色苍白，语气却异常冷酷：“内大臣斋藤实官邸也已‘清理’完毕。他在睡梦中就被送上了路，甚至没来得及说一句话。”\n几名首谋者围站在昏暗的街灯下。冈田启介生死不明，但高桥、斋藤、渡边这三座压在青年军官头顶的重臣大山，已在这一夜悉数崩塌。\n远处皇宫方向隐约传来零星的枪响，那是这座帝国心脏在最后颤抖。他们互相交换了一个决绝的眼神，黑暗中，只有金属碰撞的冷冽声回荡在积雪的街道上。"
 SCBJAP.111.a:0 "诸君，新时代开启了。" 
 SCBJAP.112.t:0 "变质的圣战"
 SCBJAP.112.d:0 "在断电后的彻底黑暗中，数支叛乱部队如潮水般涌向东京的中枢。陆军省、参谋本部、警视厅的沉重大门接连被狂热的士兵撞开。在刺刀与机油味的包围下，各大新闻社与电信局迅速易主，关于“昭和维新”的檄文正准备通过这些夺取的喉舌传遍全国。\n然而，权力的交接并非如兵棋推移般精确。在永田町与霞关交界的街口，黑暗成了最可怕的催化剂。由于断电导致的视觉盲区，加之士兵们处于极度的神经紧逼状态，任何一丝风吹草动都触发了悲剧。\n“什么人！站住！”一名年轻下士对着黑暗中移动的黑影嘶吼，回应他的只有受惊路人慌乱的奔跑声。\n“砰！砰砰！”\n密集的枪声在狭窄的街道间回荡，由于无法辨识目标，恐慌在士兵中蔓延，导致了更大规模的盲目扫射。几名正欲翻窗逃离火线的平民在血泊中倒下，其中甚至包括清晨早起劳作的报童。\n当手电筒的光束照亮那具幼小的、被三八式步枪贯穿的尸体时，原本整齐的行军队列出现了一阵死寂般的动摇。"
 SCBJAP.112.b:0 "……" 
 SCBJAP.113.t:0 "神座的崩塌"
 SCBJAP.113.d:0 "皇宫，这座被层层宫墙拱卫的“神域”，也未能幸免于今夜的疯狂。御书房内空气凝滞，裕仁天皇脸色惨白，死死盯着紧闭的拉门。铃木侍从长僵立一侧，额角冷汗直流。\n突然，刺耳的枪声在皇宫外苑炸响，伴随着粗野的咆哮：“清君侧！天诛！破门！”近卫兵惊慌的呼喝与零星的抵抗声交织在一起。\n“陛下！有暴徒闯入，请速避！”侍从长声音带着哭腔，猛地扑到御案旁，试图用身躯挡住裕仁。裕仁猛地站起，脸色由白转灰，一种超越恐惧的荒谬感与愤怒攫住了他。\n“砰！”沉重的撞击声撼动着宫苑深处的门户。负责警戒的警卫长满脸血污冲入室内：“陛下！暴徒已入内苑，正逼近御书房！”他紧握手枪，侧身挡在裕仁身前，示意掩护撤离。\n正门方向，木头碎裂声与疯狂的吼叫已近在咫尺。那扇象征神国至圣的御纹拉门在撞击下剧烈震动，仿佛随时会崩塌。时间凝固在这一刻，生与死，就在这几步之间。"
 SCBJAP.113.a:0 "“撤！”"  
 SCBJAP.113.b:0 "“朕……是神国天子！尔等……敢弑君？！”" 
 SCBJAP.114.t:0 "铁幕垂落"
 SCBJAP.114.d:0 "东京的混乱如瘟疫蔓延，“昭和维新”的手术刀正粗暴地切割着帝国的心脏。一处隐蔽的地下作战室内，空气浑浊如铅。川岛义之手中紧攥着染血的报告：皇宫遇袭，天皇行踪不明。他眼中布满血丝，嘶哑地低吼：“必须立刻镇压……把那些狂徒碾碎！”\n石原莞尔如雕像般伫立，手指在地图节点上快速敲击。寺内寿一则如激怒的雄狮般咆哮：“这是叛乱！是对国体的亵渎！”他的目光如利刃般，猛地投向角落里的真崎甚三郎和荒木贞夫。\n这两位昔日权倾一时的皇道派首领，此刻正紧缩在阴影中。真崎的脸色在防爆灯下呈现出一种死人般的灰白，手指颤抖着反复摩挲军刀柄；荒木则低着头，那撇标志性的胡须不安地抖动着，全然不见往日宣扬“皇道精神”时的意气风发。\n此时，室内所有将领的目光——充满猜忌、鄙夷与仇恨——全都死死地剜向他们。空气中的寂静比枪声更刺骨：每个人都心知肚明，是这两人的纵容甚至煽动，才养出了这头噬主的野兽。\n宇垣一成缓缓点头：“事已至此……当以雷霆手段安定圣虑。”林铣十郎也催促道：“动手吧！”\n川岛义之猛地起身，甩开副官的手，在众将杀人的目光中，对着那两个瑟缩的身影重重地吼道：\n“以陆军大臣名义下令！近卫师团、第一师团立刻行动，执行‘镇压作战’！授权使用一切武力！目标：彻底粉碎叛乱！”\n随着命令下达，坦克履带与刺刀组成的铁幕重重落下。镇压机器终于开动，东京的夜，步入了最冷酷的时刻。"
 SCBJAP.114.a:0 "当野兽挣脱了锁链开始撕咬主人，唯一能终结混乱的，只有更强大、更无情的铁拳。"
 SCBJAP.115.t:0 "深海之礁"
 SCBJAP.115.d:0 "当陆军省地下的镇压指令如雷暴般滚动时，东京湾畔的伏见宫博恭王官邸，却笼罩在一种截然不同、深不可测的沉重中。\n海军军令部长伏见宫博恭王端坐主位，苍老锐利的鹰目扫视着海图桌旁的将领。桌上摊开的并非海战图，而是标注着陆军叛军控制区的东京地图。\n“陆军！那群马粪！”海军大臣加藤宽治焦躁地踱步，声音因狂怒而嘶哑，“连自己的窝都看不住！难道要海军上岸去替他们清理烂摊子吗？！”他毫不掩饰对陆军无能的鄙夷。\n军令部次长末次信正脸色阴沉如铁，随之附和：“殿下！若陆军镇压不利，海军绝不能坐视帝都沦陷于叛军之手！”\n“荒谬！”海军省军务局长米内光政冷冷打断，眉头紧锁，“贸然让水兵上岸卷入内乱，只会让局面更不可收拾。”他转向伏见宫，语气慎重：“海军应确保自身稳定，严密关注陛下安危，这才是应尽之忠节。”\n侧旁的井上成美补充道：“名不正，则言不顺。应令陆战队及舰队进入戒备，但不主动介入市区冲突。”\n在一片争执中，伏见宫博恭王始终保持着深海般的死寂。他看着这群各怀心思的部下，最终缓缓点头。在这场倾覆帝国的风暴中，海军这块巨礁选择在黑暗中冷冷地观望着陆地上的火焰。"
 SCBJAP.115.a:0 "旁边的动静是什么？"
 SCBJAP.116.t:0 "皇兄弟们"
 SCBJAP.116.d:0 "在海军官邸深处的密室里，高松宫宣仁亲王紧握手枪，年轻的脸上混杂着惊惧与愤怒。关于皇兄裕仁及年幼皇太子的安危全无音讯，这种死寂般的未知比外面的枪声更令人煎熬。\n“护贞，”宣仁声音沙哑，“皇侄们……还有秩父宫兄长……”\n亲信细川护贞心领神会：在这种天崩地裂的时刻，必须确保皇位继承的延续性。他迅速冲向海军秘密通讯点，手指颤抖着拨通了青森县官邸的专线。漫长的等待音如同死亡倒计时。\n“莫西莫西！我是雍仁。东京……到底发生了什么？！”电话那头，秩父宫雍仁亲王的声音充满了震惊。\n细川刚要汇报皇宫遇袭、天皇失踪的末日景象，官邸外突然炸响一声巨响！海军陆战队的鸣枪示警声与骚乱声瞬间爆发。\n“殿下！东京叛乱！陛下安危不明！您务必留在青森，绝对不要……”话音未落，线路在刺耳的噪音中戛然而断。细川握着冰冷的听筒，脸色惨白。\n而在遥远的北国，只听到半截惊悚消息的雍仁亲王陷入了巨大的惶恐与躁动。他猛地冲出房间，下令立刻准备列车南下。东京的烈焰，正顺着铁轨向整个帝国蔓延。"
 SCBJAP.116.a:0 "其他地方也将被东京的火燃烧……"
 SCBJAP.117.t:0 "最后的元老，宪政之烛"
 SCBJAP.117.d:0 "麻布区，西园寺公望的临时宅邸被死寂包围。受木户幸一等人邀请，公爵此前正为此起彼伏的倒阁危机暂住于此。此刻，铁门被粗暴撞开，一群臂缠“尊皇讨奸”白布的年轻军官包围了主建筑，神情中混杂着狂热与畏缩\n书房内，这位帝国最后的元老端坐如松，白发打理得一丝不苟。面对煞白的仆从与秘书，他平静摆手：“请他们进来吧。”\n数名陆军官兵带着寒气与杀气涌入，为首的少佐脸色涨红，声音虚张声势地颤抖：“帝都已由我等接管！请阁下顺应天意，发表声明支持维新义举！”\n西园寺缓缓抬头，注视着那张狂乱的脸，声音苍老而平稳：“尔等所谓‘维新’，便是以刀枪威逼一垂死老朽乎？”\n“老东西！”一名被戳中痛处的军曹恼羞成怒，猛地举起刺刀。少佐厉声喝止，却也拔出军刀指向西园寺，声音因羞辱感而扭曲：“请收回方才之言！否则……休怪我等无礼！”\n冰冷的刀锋近在咫尺。西园寺纹丝不动，甚至缓缓整理了一下羽织的前襟，那双看透世事的眼睛直视着颤抖的刀尖。空气凝固如冰，这群手握兵刃的年轻人，在这位宪政象征的凛然气势前，竟显得如同惊弓之鸟。"
 SCBJAP.117.a:0 "少佐犹豫了下，开枪射向西园寺的左肩，留下一句“失礼了！”随后带着其他人离去"
 SCBJAP.117.b:0 "“我们……走。”为首的军官嘶哑地吐出三个字，其他军官如蒙大赦，仓促退出"
 SCBJAP.118.t:0 "永田町核心突击"
 SCBJAP.118.d:0 "第1师团步兵第57联队在第2战车联队数辆八九式中战车的支援下，沿着永田町通向首相官邸和国会议事堂发起强攻。叛军依托官邸围墙、国会大厦的石柱和邻近建筑，架设机枪，进行顽强但缺乏组织的抵抗。坦克的炮火轻易撕碎了沙袋掩体和部分门窗，步兵在钢铁掩护下发起刺刀冲锋。叛军的“尊皇”狂热在钢铁洪流面前迅速瓦解，防线出现多处缺口。05:17，首相官邸主要建筑上升起镇压部队的旗帜。叛军残部退守国会大厦地下室及周边小范围区域，但被完全孤立。"
 SCBJAP.118.a:0 "在绝对火力优势和心理震慑下，残余叛军精神崩溃，打出白旗投降。"
 SCBJAP.118.b:0 "叛军发动了数次自杀式反冲击，国会大厦未能即时拿下。"
 SCBJAP.119.t:0 "三宅坂要塞争夺"
 SCBJAP.119.d:0 "近卫师团主力在师团长亲自督战下，主攻叛军心脏——被占领的陆军省和参谋本部大楼。这里是叛军指挥中枢和精神象征，抵抗最为狂热。叛军利用钢筋混凝土建筑、地下通道和预先储存的武器弹药，构成了交叉火力密布的死亡陷阱。镇压部队虽人数火力占优，但进展缓慢，每层楼、每个走廊都爆发血腥的白刃战和手榴弹互掷。大楼内浓烟滚滚，枪声爆炸声震耳欲聋。叛军喊叫着“天诛！七生报国！”发起一波波玉碎冲锋。"
 SCBJAP.119.a:0 "石原莞尔利用炮兵强攻，最终夺回了核心区"
 SCBJAP.119.b:0 "高层顾忌对中枢建筑的严重破坏及可能存在的重要人物被挟持，导致进攻无效" 
#松井石根-南次郎军政府
 JAP_total_martial_law:0 "全面戒严之后"
 JAP_total_martial_law_desc:0 "事变的硝烟尚未散去，平沼内阁已在爆炸中化为齑粉。现在，帝都的每一条街道都由战车和刺刀守卫。在非常时局平息前，戒严令将是帝国的最高法律。"
 JAP_active_service_minister:0 "限定军部大臣现役制"
 JAP_active_service_minister_desc:0 ""
 JAP_force_peace_preservation_law:0 "强制修正治安维持法"
 JAP_force_peace_preservation_law_desc:0 "鉴于之前发生的种种破坏国家安全的大事件，我们将强制让国会通过由我们提出的治安维持法修正案，将“怀疑”视为“定罪”的充分理由。任何对政府方针持有微词的个人，都将被视为破坏国体的叛徒。"
 JAP_birth_of_dai_nippon_political_association:0 "大日本政治会之始"
 JAP_birth_of_dai_nippon_political_association_desc:0 ""
 JAP_industrial_control_expansion:0 "产业统制扩大化"
 JAP_industrial_control_expansion_desc:0 "将国家信用注入核心工业部门。自由市场必须让位于国防需求，所有关键原材料的流动都将由军部派驻的监察员审核。"
 JAP_expelling_political_parties:0 "排击政党势力"
 JAP_expelling_political_parties_desc:0 "旧时代的党阀是新体制的毒瘤。通过行政和法律手段，剥夺政党对地方资源的调配权，彻底终结议会政治的残余。"
 JAP_new_zaibatsu_into_manchuria:0 "新财阀入满"
 JAP_new_zaibatsu_into_manchuria_desc:0 "我们将引入日产等新兴财阀进入满洲，通过满铁的技术积累与新兴资本的结合，将关外打造成帝国最坚固的工业基地。"
 JAP_patriotic_combination:0 "组合报国之大义"
 JAP_patriotic_combination_desc:0 ""
 JAP_three_year_rearmament:0 "三年扩军计划"
 JAP_three_year_rearmament_desc:0 ""
 JAP_military_zaibatsu_merger:0 "军财之合抱"
 JAP_military_zaibatsu_merger_desc:0 ""
 JAP_establish_kowa_in:0 "设立兴亚院"
 JAP_establish_kowa_in_desc:0 "剥夺外务省对华权限，由陆军主导的兴亚院统一负责大陆行政、开发与渗透工作。这是实现大亚细亚主义的指挥部。"
 JAP_national_life_control:0 "国民生活统制"
 JAP_national_life_control_desc:0 "战争不是前线的特权，而是全体国民的义务。通过邻组和报国会，国家将全面干预粮食、能源与生活必需品的分配。任何超额消费都被视为对战力的侵蚀，节约即是报国。"
 JAP_5_year_production_plan:0 "生产力扩充五年计划"
 JAP_5_year_production_plan_desc:0 "在企划院的统筹下，帝国步入指令性经济时代。通过强制性的资本集中，五年内必须实现钢铁、铝材与液化石油产量的翻倍，为旷日持久的大陆战争修筑工业长城。"
 JAP_china_cooperation_work:0 "对华提携工作"
 JAP_china_cooperation_work_desc:0 "兴亚院的工作重点在于提携。通过扶持亲日政权与民间社团，我们在名义上尊重其主权，实则通过军事顾问与经济协议，将其纳入帝国的防共与资源版图。"
 JAP_manchurian_network_funding:0 "资助满洲人脉活动"
 JAP_manchurian_network_funding_desc:0 "满洲不仅是领土，更是帝国的战略支点。通过秘密资金扶持亲日的满系官僚、蒙旗首领以及宗教领袖，确保关外资源的持续外流，并为进一步的北进或南下建立情报网。"
 JAP_unlimited_military_deficit:0 "无限度军事赤字"
 JAP_unlimited_military_deficit_desc:0 "既然生产力已经统制，那么通货膨胀只是数字游戏。为了满足扩军计划，国家银行将无限制承销军债，只要战争胜利，整个亚洲的资源都将是我们的偿债基石。"
 JAP_liberation_of_asian_race:0 "亚细亚一族之“解放”"
 JAP_liberation_of_asian_race_desc:0 "松井石根大将指出，日本作为东亚的盟主，必须将亚洲同胞从白人殖民者的枷锁中“解放”出来。这种解放伴随着刺刀与和服，旨在建立一个由帝国绝对主导的新秩序。"
 JAP_complete_total_mobilization:0 "完成总动员体制"
 JAP_complete_total_mobilization_desc:0 "" 
 #昭和会-国民同盟
 JAP_desperate_constitutional_alliance:0 "绝望的宪政联盟"
 JAP_desperate_constitutional_alliance_desc:0 "若是几年前，这一宪政联盟断然不可能实现，但是现在以最别扭的形式出现在了日本的舞台上。在国家滑向不可控的深渊前，党人们试图用威权手段强行稳住议会政治的骨架。"
 JAP_support_moderate_rearmament:0 "支持适度扩军"
 JAP_support_moderate_rearmament_desc:0 ""
 JAP_rescue_diet_legacy:0 "抢救议政会遗产"
 JAP_rescue_diet_legacy_desc:0 ""
 JAP_incorporate_civilian_groups:0 "收编民间团体"
 JAP_incorporate_civilian_groups_desc:0 ""
 JAP_oriental_police_responsibility:0 "东洋警察责任论"
 JAP_oriental_police_responsibility_desc:0 "作为东亚唯一的现代化强国，日本有义务通过强力干预来制止该地区的无序化，这是一种现实主义的亚洲警察职责。"
 JAP_expand_cabinet_intelligence_bureau:0 "扩权内阁情报局"
 JAP_expand_cabinet_intelligence_bureau_desc:0 "威权统治需要精准的情报。通过强化情报局，我们将有效监控社会动向，确保在混乱发生的苗头阶段就能通过行政手段将其平息。"
 JAP_maintenance_of_chusei:0 "中正之维系"
 JAP_maintenance_of_chusei_desc:0 "犬养毅坚持中正之道，即不偏向极左也不迎合极右。我们要利用宪政老臣的人格魅力，在刺刀见红的政坛中维持住最后一点温和的法统。"
 JAP_long_term_national_policy:0 "国策长久化考虑"
 JAP_long_term_national_policy_desc:0 "政党轮替导致的政策波动是国家疲敝的主因。我们需要一套超越党派、立足于十年乃至二十年的国策定见。"
 JAP_authority_of_purification:0 "肃正之威权"
 JAP_authority_of_purification_desc:0 "没有强力行政权的净化就是空谈。我们要通过赋予内阁绝对的整肃权，来铲除寄生在体制上的金权毒瘤。"
 JAP_improve_politics_by_influence:0 "以感化改善政界百弊"
 JAP_improve_politics_by_influence_desc:0 "犬养毅试图通过人格政治感化军部与激进派，以道德权威来弥补法律在动荡时代的无力。"
 JAP_consolidate_tokonami_network:0 "凝聚床次人脉"
 JAP_consolidate_tokonami_network_desc:0 ""
 JAP_liquidate_bureaucracy:0 "清算官僚主义"
 JAP_liquidate_bureaucracy_desc:0 ""
 JAP_return_to_partial_control:0 "回归部分统制"
 JAP_return_to_partial_control_desc:0 "安达谦藏主张的国家干预并非社会主义，而是为了切断财阀对命脉产业的勒索。之前的宇垣内阁推行的统制政策过于激进，我们只寻求对钢铁、电力的最终话语权。"
 JAP_sino_japanese_concord_effort:0 "日中协和努力"
 JAP_sino_japanese_concord_effort_desc:0 ""
