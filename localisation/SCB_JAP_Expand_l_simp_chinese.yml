 JAP_pc_election_campaign:0 "选举对策"
 JAP_pc_election_campaign_desc:0 "把候选人、经费与演说排成一张严丝合缝的表。"
 JAP_pc_personnel_posting:0 "官僚人事安排"
 JAP_pc_personnel_posting_desc:0 "把党部推荐的人，安排进各省的空缺里。"
 JAP_pc_local_grant:0 "地方振兴拨款"
 JAP_pc_local_grant_desc:0 "把预算拨到县里，换来的是道路与地方的人心。"
 JAP_pc_faction_broker:0 "派阀斡旋"
 JAP_pc_faction_broker_desc:0 "在几个派阀之间来回走动，把对立的人拉到同一张桌前。"
 JAP_pc_sme_organize:0 "中小产业组织化"
 JAP_pc_sme_organize_desc:0 "把零散的作坊编进组合，产能才统计得上。"
 JAP_pc_zaibatsu_consult:0 "财界协商"
 JAP_pc_zaibatsu_consult_desc:0 "与财界的代表闭门长谈，换来投资与政治献金。"
 JAP_pc_diplomacy_talk:0 "外交协商"
 JAP_pc_diplomacy_talk_desc:0 "把强硬的措辞留在国内，对外只递温和的照会。"
 JAP_pc_manchuria_invest:0 "对满经营"
 JAP_pc_manchuria_invest_desc:0 "资本与人脉一齐投向满洲，把地图上的颜色坐实。"
 JAP_pc_group_absorb:0 "民间团体收编"
 JAP_pc_group_absorb_desc:0 "把乡军、青年团与在乡军人会编进同一套组织。"
 JAP_pc_party_purge:0 "党内清洗"
 JAP_pc_party_purge_desc:0 "把反对总裁的人逐出名单，代价是党内的裂痕更深。"
 JAP_pc_budget_cut:0 "财政紧缩"
 JAP_pc_budget_cut_desc:0 "压缩开支与军费，把账面重新做平。"
 JAP_pc_labor_mediate:0 "劳资协调"
 JAP_pc_labor_mediate_desc:0 "把罢工的双方请到同一间屋子，谈出一个都能下的台阶。"
 JAP_pc_legacy_save:0 "议政会遗产抢救"
 JAP_pc_legacy_save_desc:0 "把旧议政会的人脉与文书，重新搬回政治的台面。"
 JAP_pc_intel_operation:0 "情报运用"
 JAP_pc_intel_operation_desc:0 "情报局汇总来的材料，第一次直接摆上内阁的桌面。"
 JAP_gt_tokko_sweep:0 "特高巡查"
 JAP_gt_tokko_sweep_desc:0 "特高课的名单又长了一截，巡查的靴声彻夜不停。"
 JAP_gt_bureau_posting:0 "官僚人事刷新"
 JAP_gt_bureau_posting_desc:0 "人事的调令一张接一张，各省的座位重新排过。"
 JAP_gt_control_enforce:0 "统制执行"
 JAP_gt_control_enforce_desc:0 "统制的条文落到车间，配给与产量都按表格走。"
 JAP_gt_colony_relief:0 "殖民地经营"
 JAP_gt_colony_relief_desc:0 "拨给殖民地的款项，换来的是顺从与资源的稳定流出。"
 JAP_gt_agri_association:0 "农业组合动员"
 JAP_gt_agri_association_desc:0 "把农户编进组合，米与兵源都从同一个名册里出。"
 JAP_gt_scandal_purge:0 "财界疑狱"
 JAP_gt_scandal_purge_desc:0 "一桩疑狱掀翻几个财阀，也顺带掀翻了几位阁僚。"
 JAP_gt_budget_coordinate:0 "预算协调"
 JAP_gt_budget_coordinate_desc:0 "陆军与海军的预算单被摊在同一张桌上逐条对账。"
 JAP_gt_spiritual_drill:0 "精神训练"
 JAP_gt_spiritual_drill_desc:0 "清晨的训话与夜间的讲习，把口号刻进身体里。"
 JAP_gt_imperial_purge:0 "皇道肃清"
 JAP_gt_imperial_purge_desc:0 "把异端与旧阀一并清出，剩下的都是自称的正统。"
 JAP_gt_asia_cooperation:0 "对华提携"
 JAP_gt_asia_cooperation_desc:0 "提携的辞令之下，是矿山、铁路与驻军的清单。"
 JAP_gt_local_improve:0 "地方改良"
 JAP_gt_local_improve_desc:0 "改良的经费下到町村，换来的是税基与人心的双收。"
 JAP_gt_martial_drill:0 "尚武奉公"
 JAP_gt_martial_drill_desc:0 "奉公的训示写进学校与工厂，尚武成了日常。"
 JAP_scb_gandhi_inspiration:0 "伊泽氏的甘地读本"
 JAP_scb_gandhi_inspiration_desc:0 "伊泽多喜男案头那本从印度寄来的小册子翻得卷了边。他读出的不是忍让，而是一个贫弱之国凭纪律与自给抵住强国压制的办法——不必增税，也不必扩军。这套读法如今被带进官厅：预算表上省下的每一笔，都要靠修身与节约去抵；对外既无力压服，便以持久相对。讲义这么写，行政也这么办。"
 JAP_scb_kinkei_academy:0 "金鸡学院"
 JAP_scb_kinkei_academy_desc:0 "金鸡学院不发文凭，只发听课证。安冈正笃在讲席上讲阳明之学，台下坐的是内务省的一班少壮——后藤文夫，以及循着伊泽阀这条人脉被一并叫来的同期。他们多半刚从国本社分出，缺一个自己的去处，于是借伊泽阀的关系在下町租下这间讲堂。功课排得很满：清晨修身，其后是法条、预算与农政。真正养成的不是学问，是一张彼此叫得出名字、进了各省还能互相照应的人事网。"
 JAP_scb_financial_scandal:0 "疑狱之后的财界"
 JAP_scb_financial_scandal_desc:0 "疑狱办下来，账目本身反倒成了最不紧要的东西。重要的是财界从此明白：检事的传票可以送到任何一家银行的门前，罪名总能找到。此后举债、增资、合并，都要先到官厅探一句口气——官厅不必再事事求人，立案本身就是筹码。"
 JAP_scb_appeasement:0 "绥靖的惯例"
 JAP_scb_appeasement_desc:0 "陆军要的是立刻动手，外务省要的是再拖一年。内阁取了后者：对华以地方协定收束，对英美以照会与谈判周旋，凡能压下的冲突先压下。换来的是船照开、货照卖；海军与陆军却把这些照会一张张收进文件夹，等着有一天拿出来当罪证。"
 JAP_scb_colony_relief:0 "殖民地救济"
 JAP_scb_colony_relief_desc:0 "朝鲜的米价与台湾的糖债，闹到东京不得不派人去看。救济不是发钱了事：赈粮下去的同时，重新丈量土地、编成户籍，把地方的组合并进官厅的账里。饥民散了，税基清楚了，驻在那里的守备队也可以抽走一部分——这笔账是这么算的。"
 SCB_JAP_gandhi_inspiration_tt:0 "以纪律与节约，抵补预算的空缺"

 SCB_JAP_kinkei_new_bureaucrat_tt:0 "内务省少壮有了一处自己的讲堂"
 SCBJAP.62.t:0 "金鸡学院的开校"
 SCBJAP.62.d:0 "下町一隅，旧讲堂的门楣上挂起一块新木牌，写着“金鸡学院”四个字。挂牌的人里没有一个是教育家。\n\n屋子是靠伊泽阀的路子租下来的，钱由几个人凑，名义上文部省管，实际上谁也管不着。讲席请的是安冈正笃——他不讲法条，也不讲预算，讲阳明：知行合一，致良知。第一课坐得满满的，多是内务省的少壮，后藤文夫坐在第二排。\n\n他们中许多人的名片上还印着国本社。那边的会照去，这边的讲义却只有在这里才听得到。分歧不在主义，在人：国本社要的是同志，这里要的是同期——同一份讲义、同一个官厅、彼此能直接叫出名字的人。\n\n开学那天没有仪式。安冈讲完，众人散去，各自回省办公。木牌留在了门上。"
 SCBJAP.62.a:0 "让他们办下去"
 JAP_gt_arrest_go_seinosuke:0 "逮捕乡诚之助"
 JAP_gt_arrest_go_seinosuke_desc:0 "日银总裁乡诚之助是财界说话最有分量的人，也是最难办的一个。罪名拟的是渎职，理由不必充分——要的是第一张传票送出去时，整个财界都听得见。银行家们会明白，这不是查账，是给往后的日子定规矩。"
 JAP_gt_arrest_mitsuchi_chuzo:0 "逮捕三土忠造"
 JAP_gt_arrest_mitsuchi_chuzo_desc:0 "乡案的卷宗里牵出几笔流向政党的钱，顺着查下去，名字落在民政党三土忠造头上。这一手把案子从财界推进了议会：在野党要在议场质问，执政方面的同僚开始打电话，检事省第一次要面对“查到议员”这道门槛。"
 JAP_gt_arrest_kuroda_hideo:0 "逮捕黑田英雄"
 JAP_gt_arrest_kuroda_hideo_desc:0 "再往里查，就查到了官厅自己。大藏省理财局长黑田英雄掌着公债与预算的口子，政党要钱、财界要担保，都得过他这一道。办他，等于告诉各省：位置再稳，也不保人。此后官厅递条子都比从前慢半拍——谁都怕自己的名字出现在下一份卷宗里。"
 JAP_gt_sweep_takahashi_faction:0 "扫灭大藏省高桥残余派"
 JAP_gt_sweep_takahashi_faction_desc:0 "高桥是清死后，他的人还坐在大藏省长桌的那一头：公债的口径、预算的写法、对军部的答法，都还留着他的手迹。现在不是查账，是换人——借这几桩案子的余势，把他们一并调开。案子办到这一步，已经从司法变成了人事。"
 JAP_gt_arrest_takahashi_heir:0 "逮捕高桥是贤"
 JAP_gt_arrest_takahashi_heir_desc:0 "要断高桥派就得断干净，于是卷宗里添上了高桥是贤的名字：亡者的儿子，受托管理家产，这就够立案了。天没亮上门，是怕记者；报纸第二天还是登了出来，标题不写渎职，写的是“父债子还”。连检事省内部都有人皱眉，说这一手过了线。"
 JAP_scb_tm_scandal_go:0 "疑狱：乡诚之助案"
 JAP_scb_tm_scandal_go_desc:0 "日银总裁被传唤的消息见报当天，财界的例会全部临时取消。银行家们改在私宅里见面，谁也不愿在这个节骨眼上被人看见与谁同桌。街谈说这是刷新，财界自己明白：往后签字之前，得先看清风向。"
 JAP_scb_tm_scandal_mitsuchi:0 "疑狱：三土案"
 JAP_scb_tm_scandal_mitsuchi_desc:0 "案子从财界查进了议会。议员被传唤，议场的质问变成攻讦，报纸连日用同一个词：疑狱。政党的人开始互相撇清，连党内的会都不再记名。"
 JAP_scb_tm_scandal_kuroda:0 "疑狱：黑田案"
 JAP_scb_tm_scandal_kuroda_desc:0 "查到了官厅自己头上。各省的条子递得比从前慢，签字的笔也慢——不是懒，是谁都要先看一遍前任当年是怎么签的。行政慢了下来，打听却快了：人人都在问下一个名字是谁。"
 JAP_scb_tm_scandal_takafaction:0 "扫荡：高桥残余派"
 JAP_scb_tm_scandal_takafaction_desc:0 "大藏省的长桌换了一批人坐着。旧预算案被翻出来逐页比对，公债的口径重新定过。行政断了一截，短期没人接得上——但至少，接手的都是自己人。"
 JAP_scb_tm_scandal_takaheir:0 "疑狱：高桥家"
 JAP_scb_tm_scandal_takaheir_desc:0 "连亡者的家门也被敲响。街谈之外，官厅的走廊安静得反常：谁都看得出来，案子办到这里，再往下已经没有还能办的人了。清算到了尽头，剩下的只是收尾。"
