# ==================== 官僚内阁 / 军政府 / 皇道派 新增 ====================
 JAP_industrial_control_amendment:0 "产业统制法修正案"
 JAP_industrial_control_amendment_desc:0 "自由市场必须让位于国防需求。"
 JAP_imperial_way_jurisprudence:0 "皇道法理"
 JAP_imperial_way_jurisprudence_desc:0 "法官援引皇道，如同从前援引条文。"
 JAP_kempeitai_politics:0 "宪兵政治"
 JAP_kempeitai_politics_desc:0 "人们不再问有没有犯法，只问有没有被记录。"
 JAP_obata_mobility:0 "小畑机动主义"
 JAP_obata_mobility_desc:0 "以速度与奇袭，弥补火力与资源之不足。"
 JAP_spiritual_training:0 "精神训练"
 JAP_spiritual_training_desc:0 "尚武是每个国民被期待的气质。"
 JAP_shinto_strengthened:0 "国家神道之强化"
 JAP_shinto_strengthened_desc:0 "参拜不再只是信仰，而是每天必须完成的动作。"

# ==================== 政党内阁 新增 ====================
 JAP_against_genro:0 "对抗元老政治"
 JAP_against_genro_desc:0 "政党公开向元老的重臣政治宣战，代价是政界的裂痕更深。"
 JAP_constitutional_illusion_end:0 "宪政幻象之终结"
 JAP_constitutional_illusion_end_desc:0 "曾经被寄予厚望的议会政治，如今只剩下被利用的躯壳。"
 JAP_defense_industry_strategy:0 "国防产业两全之策"
 JAP_defense_industry_strategy_desc:0 "军需与民需被摆在同一张图纸上，代价由每个家庭共同承担。"
 JAP_diet_discourse:0 "国会话语权之操纵"
 JAP_diet_discourse_desc:0 "议事堂里的发言次序与质询时间，如今都成了可以计算的政治资源。"
 JAP_education_nation_policy:0 "教育立国之政策"
 JAP_education_nation_policy_desc:0 "把有限的财源投向教室与研究所，赌的是十年后的国力。"
 JAP_election_purification:0 "选举之肃正"
 JAP_election_purification_desc:0 "买票与胁迫被摆到台面上清算，选举终于像一场选举。"
 JAP_escape_dictator_illusion:0 "摆脱独裁者之幻象"
 JAP_escape_dictator_illusion_desc:0 "对强人政治的幻想被主动放弃，议会重新成为唯一的舞台。"
 JAP_favor_rural_military_groups:0 "偏向乡军团体"
 JAP_favor_rural_military_groups_desc:0 "为了换取乡军的支持，政党付出了原则与稳定的代价。"
 JAP_gradual_conservative_revolution:0 "渐进的保守革命"
 JAP_gradual_conservative_revolution_desc:0 "不流血、也不宣示，制度却在一步一步地被改写。"
 JAP_hamaguchi_cabinet_lessons:0 "滨口内阁之教训"
 JAP_hamaguchi_cabinet_lessons_desc:0 "前任的紧缩与殉身，成了后继者案头最沉的一册书。"
 JAP_industrial_foundation:0 "产业立国之重申"
 JAP_industrial_foundation_desc:0 "工厂的烟囱再次被视为国力的标尺，产业政策重新回到国家的中心议程。"
 JAP_kokutai_vanguard:0 "国体明征之先锋"
 JAP_kokutai_vanguard_desc:0 "国体的话语被推到政治的最前列，一切争议都要在它面前让路。"
 JAP_kuhara_fusanosuke_leadership:0 "久原之执杖"
 JAP_kuhara_fusanosuke_leadership_desc:0 "一个惯于便宜行事的人执掌党权，政界的算计从此多了几分商人的气味。"
 JAP_labor_capital_coordination:0 "劳资之协调"
 JAP_labor_capital_coordination_desc:0 "工会与资方被请到同一张桌前，罢工的代价由双方各让一步来抵。"
 JAP_land_tax_transfer:0 "地租移让之实惠"
 JAP_land_tax_transfer_desc:0 "把地租的负担从中央移让给地方，农村的怨气因此稍稍平息。"
 JAP_local_revitalization:0 "地方振兴之策"
 JAP_local_revitalization_desc:0 "把财政的活水引向疲惫的农村，地方因此重新有了呼吸的余裕。"
 JAP_machida_chuji_stability:0 "町田之稳定局势"
 JAP_machida_chuji_stability_desc:0 "一个精通财政的老人稳住了盘子，市场的呼吸重新平稳。"
 JAP_maeda_yonezo_ascent:0 "关东长老之上台"
 JAP_maeda_yonezo_ascent_desc:0 "老成持重的关东派人物走上前台，党内的重心随之东移。"
 JAP_manchurian_investment:0 "对满投资之垄断"
 JAP_manchurian_investment_desc:0 "满洲的资源与日本的资本被绑在一起，利益的车轮一旦转动便难以停下。"
 JAP_minseito_comeback:0 "民政党之东山再起"
 JAP_minseito_comeback_desc:0 "民政党重新成为议会的第一大党，稳健与协调再一次成为政治的语言。"
 JAP_mori_kaku_dictatorship:0 "森恪之独裁之治"
 JAP_mori_kaku_dictatorship_desc:0 "一个通晓大陆事务的人把整个党攥在手里，效率换来了党内的一片死寂。"
 JAP_nagai_ryutaro_reform:0 "永井之革新"
 JAP_nagai_ryutaro_reform_desc:0 "被称为“小大隈”的人带来了革新的气息，也让党内保守派皱起了眉。"
 JAP_party_faction_unification:0 "党人派之聚拢"
 JAP_party_faction_unification_desc:0 "散落的党人派系重新集结，议会里的票数终于可以数得清。"
 JAP_pc_donation_drive:0 "政党资金之募集"
 JAP_pc_donation_drive_desc:0 "募集来的政治资金填满了党的金库，也留下了说不清的人情。"
 JAP_policy_consultation:0 "国策协商之常态化"
 JAP_policy_consultation_desc:0 "各派坐在一张桌子前谈国策，争吵被压进了程序里。"
 JAP_purge_anti_president:0 "反总裁派之肃清"
 JAP_purge_anti_president_desc:0 "党内反对总裁的声音被逐一清除，党的纪律压过了党内的议论。"
 JAP_reform_movement_leadership:0 "革新运动之主导权"
 JAP_reform_movement_leadership_desc:0 "政党试图接过革新运动的旗号，免得它落到军部手里。"
 JAP_rural_military_appeasement:0 "乡军团体之讨好"
 JAP_rural_military_appeasement_desc:0 "在乡军人会成为政党争取的对象，军靴声因此走进了议会政治。"
 JAP_sakuradakai_voice:0 "樱田会之发声"
 JAP_sakuradakai_voice_desc:0 "樱田会的意见开始进入决策的房间，党内的声音变得不再单一。"
 JAP_seiyukai_governance:0 "政友会政权之基"
 JAP_seiyukai_governance_desc:0 "政友会在议会中重新握住了多数，党的机器重新运转起来。总裁的意志得以通过党组织的渠道，贯彻到地方的每一个角落。"
 JAP_sme_organization:0 "中小产业之组织化"
 JAP_sme_organization_desc:0 "零散的中小工商业被编入统制的网格，虽失自由却得了秩序。"
 JAP_stability_above_all:0 "稳定压倒一切"
 JAP_stability_above_all_desc:0 "为了不再让内阁在街头政治中倾覆，一切代价都被视为可以接受。"
 JAP_tanaka_diplomacy:0 "田中外交之重提"
 JAP_tanaka_diplomacy_desc:0 "积极的大陆政策被重新端上台面，外交重回强硬的轨道。"
 JAP_uphold_constitutionalism:0 "拥护宪政，千代不变"
 JAP_uphold_constitutionalism_desc:0 "宪政被当作不可让渡的国是，哪怕它此刻并不受欢迎。"
 JAP_vertical_regime_dream:0 "纵断政权之旧梦"
 JAP_vertical_regime_dream_desc:0 "跨越党派的纵断式政权，是许多人反复做过却从未成真的梦。"
 JAP_party_cabinet:0 "政党内阁"
 SCB_JAP_democracy_soccon_marlib:0 "政党内阁"

# ==================== 阶段链 / 决议 / 限时精神 ====================
 pc_industry_L1:0 "产业立国之基"
 pc_industry_L1_desc:0 "以国家力量扶植基干产业，民间资本随之而动。"
 pc_industry_L2:0 "产业合理化"
 pc_industry_L2_desc:0 "统制产线、淘汰冗余，让每一座工厂都跑在效率曲线之上。"
 pc_industry_L3:0 "产业统制法体制"
 pc_industry_L3_desc:0 "《产业统制法》修正案落地，民转军的闸门正式交到国家手中。"
 pc_industry_L4:0 "国防产业两全"
 pc_industry_L4_desc:0 "军需与民生在同一张计划表上各行其道，互不挤占。"
 pc_order_L1:0 "选举肃正"
 pc_order_L1_desc:0 "从票箱开始整顿政界，买票与胁迫被逐一记录在案。"
 pc_order_L2:0 "治安法权"
 pc_order_L2_desc:0 "治安警察的权限被重新界定，集会与结社须先看国家脸色。"
 pc_order_L3:0 "肃正之威权"
 pc_order_L3_desc:0 "肃正不再是运动，而成为日常的统治方式。"
 pc_order_L4:0 "思想犯之网"
 pc_order_L4_desc:0 "思想犯罪的边界不断外扩，检举成为邻里之间的义务。"
 pc_control_L1:0 "部分统制"
 pc_control_L1_desc:0 "统制只覆盖关键部门，其余留给市场自行呼吸。"
 pc_control_L2:0 "国民合作"
 pc_control_L2_desc:0 "产业报国会的牌子挂到了每一条街巷。"
 pc_control_L3:0 "国民政治"
 pc_control_L3_desc:0 "政治不再是议席之争，而是全体国民的义务分配。"
 pc_military_L1:0 "适度扩军"
 pc_military_L1_desc:0 "预算表上军费一栏稳步上行，却仍在文官的掌控之内。"
 pc_military_L2:0 "以政善导军"
 pc_military_L2_desc:0 "用预算与人事做缰绳，把军部的方向拽回内阁的轨道。"
 pc_military_L3:0 "兵农两全"
 pc_military_L3_desc:0 "士兵在营里操练，农时在田里劳作，两者皆不耽误。"
 pc_bureau_L1:0 "官僚掌握"
 pc_bureau_L1_desc:0 "各省次官的任免开始看党部的脸色。"
 pc_bureau_L2:0 "专家治理"
 pc_bureau_L2_desc:0 "技术官僚被成批引入，政党的推荐信压过了学阀的名帖。"
 pc_const_L1:0 "拥护宪政"
 pc_const_L1_desc:0 "议会政治的存续本身，就是此刻最大的政治。"
 pc_const_L2:0 "护宪精神"
 pc_const_L2_desc:0 "护宪的旗号重新被举起，街头又响起了熟悉的口号。"
 pc_const_L3:0 "宪政之神"
 pc_const_L3_desc:0 "那位被称作宪政之神的老人，再度成为政界的公约数。"
 pc_finance_L1:0 "高桥财政"
 pc_finance_L1_desc:0 "赤字公债换来的是工厂的烟囱与就业的人数。"
 pc_finance_L2:0 "稳健财政"
 pc_finance_L2_desc:0 "紧缩的剪刀落下，通胀被按住，景气也随之转冷。"
 pc_finance_L3:0 "后危机时代"
