l_simp_chinese:
 JAP_Hiranuma_Kiichiro_desc:0 "平沼骐一郎为日本资深司法检察官僚出身，长期担任枢密院副议长。他与门生组成的‘平沼阀’是日本思想检事体系的核心力量，致力于肃清外来思想对国体的威胁。1934年斋藤内阁倒台后，平沼凭借与政友会总裁铃木喜三郎的私谊，兼得皇道派领袖荒木贞夫、真崎甚三郎支持，顺利组阁，并大力推行翼赞政治运动。§C备注：平沼对左翼、右翼思想均抱敌视态度，视一切外来思想皆不如传统东洋道德。此立场令其与意图推动政治改革的革新派政治家关系不睦。"
