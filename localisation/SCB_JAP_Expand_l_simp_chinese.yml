 #官僚内阁
JAP_continuation_of_bureaucratic_cabinet:0 "官僚内阁的延续"
JAP_continuation_of_bureaucratic_cabinet_desc:0 "风波过后，官僚内阁的骨架依旧运转。各方势力都在这个框架下重新排列，试图把国家机器重新握在自己手中。"
JAP_iron_fist_of_thought_prosecutors:0 "思想检事的铁腕"
JAP_iron_fist_of_thought_prosecutors_desc:0 "思想问题从来不是普通刑事程序能解决的。检事的裁量与铁腕，才是斩断不稳根源的真正手段。"
JAP_return_of_the_new_bureaucrats:0 "新官僚卷土而归"
JAP_return_of_the_new_bureaucrats_desc:0 "风波过后，新官僚并未彻底退出舞台。在官僚内阁的缝隙中，力量正悄然积蓄，准备重新掌握话语权。"
JAP_promote_provincial_personnel_reform:0 "推动各省人事革新"
JAP_promote_provincial_personnel_reform_desc:0 "各省人事长期被各种暧昧势力渗透。只有彻底的人事革新，才能让行政机构重新对国家意志保持忠诚。"
JAP_enforce_national_security_act:0 "强推国家安保法"
JAP_enforce_national_security_act_desc:0 "国家安全高于程序正义。必须以强力立法赋予检事与特高更广泛的权限，彻底压倒那些试图把刑事警察常态化的主张。"
JAP_resist_military_radicalism:0 "抵抗军部的激进主义"
JAP_resist_military_radicalism_desc:0 "军部的激进倾向令人警惕。必须以官僚的理性约束军人的冲动，防止国家被拖入失控的战争轨道。"
JAP_eliminate_corruption_in_justice_ministry:0 "排除司法省的污浊"
JAP_eliminate_corruption_in_justice_ministry_desc:0 "司法省内部的腐败与派系纠葛，早已侵蚀了公信力。整顿这些污浊，是重塑官僚体系权威的必要一步。"
JAP_support_imperial_way_diplomacy_renewal:0 "支持皇道外交刷新"
JAP_support_imperial_way_diplomacy_renewal_desc:0 "外交必须与国内的思想统制同步推进。以皇道为旗帜的强硬立场，才是当前应有的选择。"
JAP_reject_normalization_of_criminal_police:0 "拒否刑事警察常态化"
JAP_reject_normalization_of_criminal_police_desc:0 "一旦刑事警察被常态化，思想检事的特殊地位必将动摇。绝不能让司法的锋芒被钝化成普通警察的工具。"
JAP_establish_jurisprudence_research_society:0 "设立法理研究会"
JAP_establish_jurisprudence_research_society_desc:0 "强硬政策需要学术外衣。法理研究会的成立，就是为了系统论证‘皇道’作为唯一合法基础的正当性。"
JAP_purge_action_right_wing:0 "清剿行动右翼"
JAP_purge_action_right_wing_desc:0 "街头的过激行动已经超出了可容忍的限度。无论立场如何，维护官僚统治的体面与秩序，都必须将这些不受控制的右翼分子清理干净。"
JAP_develop_kinkei_academy:0 "发展金鸡学院"
JAP_develop_kinkei_academy_desc:0 "金鸡学院将成为培养下一代官僚的重要基地。在这里传授的，是更注重实际行政能力与地方治理的理念，而非单纯的思想灌输。"
JAP_senior_bureaucrats_protection_act:0 "高级官僚保障法"
JAP_senior_bureaucrats_protection_act_desc:0 "高级官僚在政治斗争中极易成为牺牲品。有必要通过立法，为官僚体系提供最低限度的制度防护。"
JAP_promote_agricultural_association_movement:0 "推动农业组合运动"
JAP_promote_agricultural_association_movement_desc:0 "农村基层的组织化长期被忽视。推动农业组合运动，既能稳固地方支持，也能为行政网络打下更坚实的根基。"
JAP_expand_suzuki_kwantung_army:0 "扩大铃木的关东军团"
JAP_expand_suzuki_kwantung_army_desc:0 "铃木喜三郎一派的关东议员地盘，是重要的地方政治资源。扩大这一地盘，能为官僚内阁提供更稳固的地方根基。"
JAP_useful_discretion_of_nationalism:0 "国家主义的有用裁量"
JAP_useful_discretion_of_nationalism_desc:0 "国家主义并非洪水猛兽，而是可被精妙操控的工具。用它筛选有用与无用的人，本身就是一种必要的裁量。"
JAP_increase_execution_preventive_detention:0 "加大行刑，预防拘禁"
JAP_increase_execution_preventive_detention_desc:0 "与其等待犯罪发生，不如提前将其扼杀在萌芽之中。扩大预防拘禁，强化行刑威慑，是维护秩序的必然要求。"
JAP_appeasement_policy:0 "绥靖主义政策"
JAP_appeasement_policy_desc:0 "在内外压力交织的时刻，过早将国家拖入不可控的冲突，是危险的。更为谨慎的姿态，或许才是当下应有的选择。"
JAP_inspiration_of_mahatma_gandhi:0 "圣雄甘地的启示"
JAP_inspiration_of_mahatma_gandhi_desc:0 "甘地的非暴力抵抗理念，提供了另一种可能。与其单纯依靠铁腕，不如尝试用柔性统合的方式维持秩序。"
JAP_unified_organization_of_youth_corps:0 "青年团统一组织化"
JAP_unified_organization_of_youth_corps_desc:0 "分散的青年团容易被极端思想吞噬。将其统一纳入更具行政色彩的组织体系，既能避免失控，也能储备基层干部。"
JAP_create_financial_scandals:0 "制造财界疑狱"
JAP_create_financial_scandals_desc:0 "对方在财界与地方的人脉，是其重要支柱。精心策划的疑狱，足以切断这些资金来源，让对手陷入被动。"
JAP_kempeitai_politics_tokko_state:0 "宪兵政治，特高国家"
JAP_kempeitai_politics_tokko_state_desc:0 "当思想检事与宪兵、特高完全合流，国家将进入由秘密警察主导的时代。这并非恐惧，而是维护国体所必需的秩序。"
JAP_national_labor_education:0 "国民劳动教育"
JAP_national_labor_education_desc:0 "国民劳动教育不应沦为单纯的思想灌输。强调实际生产技能与社会协作，才是更务实的方向。"
JAP_relief_for_colonies:0 "救济殖民地"
JAP_relief_for_colonies_desc:0 "殖民地的稳定不能仅靠高压。适当的救济与行政改善，同样是维护帝国外围秩序的必要手段。"
JAP_imperial_way_is_jurisprudence:0 "皇道即法理，法理即皇道"
JAP_imperial_way_is_jurisprudence_desc:0 "最终，一切法律都将收束于皇道之下。反对皇道者，即是违法者——意识形态与法理的统一，至此完成。"
JAP_rebuild_the_moral_nation:0 "重建道义之国"
JAP_rebuild_the_moral_nation_desc:0 "真正的道义之国，并非单纯的思想统制。官僚理性与传统伦理之间，仍有可能找到某种平衡。"
 #昭和会-国民同盟
 JAP_desperate_constitutional_alliance:0 "绝望的宪政联盟"
 JAP_desperate_constitutional_alliance_desc:0 "若是几年前，这一宪政联盟断然不可能实现，但是现在以最别扭的形式出现在了日本的舞台上。在国家滑向不可控的深渊前，党人们试图用威权手段强行稳住议会政治的骨架。"
 JAP_support_moderate_rearmament:0 "支持适度扩军"
 JAP_support_moderate_rearmament_desc:0 ""
 JAP_rescue_diet_legacy:0 "抢救议政会遗产"
 JAP_rescue_diet_legacy_desc:0 ""
 JAP_incorporate_civilian_groups:0 "收编民间团体"
 JAP_incorporate_civilian_groups_desc:0 ""
 JAP_oriental_police_responsibility:0 "东洋警察责任论"
 JAP_oriental_police_responsibility_desc:0 "作为东亚唯一的现代化强国，日本有义务通过强力干预来制止该地区的无序化，这是一种现实主义的亚洲警察职责。"
 JAP_expand_cabinet_intelligence_bureau:0 "扩权内阁情报局"
 JAP_expand_cabinet_intelligence_bureau_desc:0 "威权统治需要精准的情报。通过强化情报局，我们将有效监控社会动向，确保在混乱发生的苗头阶段就能通过行政手段将其平息。"
 JAP_maintenance_of_chusei:0 "中正之维系"
 JAP_maintenance_of_chusei_desc:0 "犬养毅坚持中正之道，即不偏向极左也不迎合极右。我们要利用宪政老臣的人格魅力，在刺刀见红的政坛中维持住最后一点温和的法统。"
 JAP_long_term_national_policy:0 "国策长久化考虑"
 JAP_long_term_national_policy_desc:0 "政党轮替导致的政策波动是国家疲敝的主因。我们需要一套超越党派、立足于十年乃至二十年的国策定见。"
 JAP_authority_of_purification:0 "肃正之威权"
 JAP_authority_of_purification_desc:0 "没有强力行政权的净化就是空谈。我们要通过赋予内阁绝对的整肃权，来铲除寄生在体制上的金权毒瘤。"
 JAP_improve_politics_by_influence:0 "以感化改善政界百弊"
 JAP_improve_politics_by_influence_desc:0 "犬养毅试图通过人格政治感化军部与激进派，以道德权威来弥补法律在动荡时代的无力。"
 JAP_consolidate_tokonami_network:0 "凝聚床次人脉"
 JAP_consolidate_tokonami_network_desc:0 ""
 JAP_liquidate_bureaucracy:0 "清算官僚主义"
 JAP_liquidate_bureaucracy_desc:0 ""
 JAP_return_to_partial_control:0 "回归部分统制"
 JAP_return_to_partial_control_desc:0 "安达谦藏主张的国家干预并非社会主义，而是为了切断财阀对命脉产业的勒索。之前的宇垣内阁推行的统制政策过于激进，我们只寻求对钢铁、电力的最终话语权。"
 JAP_sino_japanese_concord_effort:0 "日中协和努力"
 JAP_sino_japanese_concord_effort_desc:0 ""
