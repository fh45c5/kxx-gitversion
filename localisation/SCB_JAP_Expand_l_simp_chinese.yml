 JAP_strengthen_public_security_law_desc:0 ""
 JAP_japan_manchukuo_economic_sphere:0 "日满经济圈构想"
 JAP_japan_manchukuo_economic_sphere_desc:0 ""
 JAP_promote_national_cooperation:0 "推动国民合作"
 JAP_promote_national_cooperation_desc:0 ""
 JAP_implement_national_politics:0 "贯彻国民政治"
 JAP_implement_national_politics_desc:0 "" 
 #明正会
 JAP_political_renewal_meisho:0 "政界刷新之明正"
 JAP_political_renewal_meisho_desc:0 "在旧党阀因腐败与无能而分崩离析的当下，明正会不仅是一个政党，更是一场关于政治良知的实验。我们要剔除官僚主义的积弊，在统制时代的边缘为日本寻找一条清廉、高效且文明的复兴之路。"
 JAP_divide_established_parties:0 "分化既成政党"
 JAP_divide_established_parties_desc:0 "政友会与民政党的旧躯壳已无法承载国家的未来。通过精准的人事利诱与政策游说，我们将瓦解那些迟钝的利益集团，将其中的实务精英纳入明正会的旗帜之下。"
 JAP_new_collectivism_doctrine:0 "新集体主义学说"
 JAP_new_collectivism_doctrine_desc:0 "鹤见祐辅提出，自由并非个人的肆意妄为，而是为了人类全体进步而存在的团体主义。这种“新自由主义”的转向，要求我们在尊重个人价值的同时，将其导向国家的整体升华。"
 JAP_reduce_military_budget:0 "削减军费预算"
 JAP_reduce_military_budget_desc:0 "盲目的军备扩张正在榨干国家的财政血液。我们必须以行政专家的冷静，将有限的预算从昂贵的钢铁巨兽转向能产生实际效益的民生实业。"
 JAP_bridge_across_pacific:0 "跨越太平洋的悬桥"
 JAP_bridge_across_pacific_desc:0 "继承新渡户稻造的遗志，日本不应在孤立中枯萎。通过与美国进行坦诚的外交沟通，我们要证明一个强大的日本是太平洋和平的保障而非威胁。"
 JAP_southern_strategy:0 "南进之经略"
 JAP_southern_strategy_desc:0 "北方大陆的泥潭并非日本的宿命。资源丰富的南方海洋才是帝国应当开拓的经济腹地。以商业渗透替代军事征服，是海国日本的生存之道。"
 JAP_return_of_constitutional_god:0 "宪政之神回归"
 JAP_return_of_constitutional_god_desc:0 "尾崎行雄的归来为明正会注入了无可置疑的道义法统。这位宪政的老兵将用他的声望，在动荡的局势中重新定准国家的法治航标。"
 JAP_managed_democracy:0 "管理型民主"
 JAP_managed_democracy_desc:0 "民主不应沦为庸众的暴政。通过对选举权的合理加权与专家的决策参与，我们将建立一种由有见识者主导的、能够高效应对时局的秩序。"
 JAP_industrial_management_strategy:0 "实业之经略"
 JAP_industrial_management_strategy_desc:0 "武藤山治主张，生产力才是国家真正的脊梁。我们要将国家的命运交托给那些创造财富的实业家，而非那些只会挥霍财富的官僚与军人。"
 JAP_maintain_freedom_of_speech:0 "维护言论自由"
 JAP_maintain_freedom_of_speech_desc:0 "在宪政之神的庇护下，我们必须守住言论的底线。唯有自由的辩论，才能防止国家在偏执的狂热中坠入深渊。"
 JAP_investigate_election_corruption:0 "调查选举腐败"
 JAP_investigate_election_corruption_desc:0 "我们要用最严厉的手段净化永田町的空气。斩断财阀与议员间的金权脐带，是恢复国民对政治信心的唯一途径。"
 JAP_advocate_industrial_state:0 "倡导实业立国"
 JAP_advocate_industrial_state_desc:0 "将日本建设成为一座巨大的工厂。通过技术升级与教育投入，我们要让‘日本制造’成为世界无法拒绝的力量。"
 JAP_union_of_smes:0 "联合中小企业"
 JAP_union_of_smes_desc:0 "中小企业是日本活力的源泉。通过建立融资信用担保体系，我们要打破大财阀的信贷垄断，释放民间的创造潜能。"
 JAP_reform_house_of_peers:0 "推动贵院改革"
 JAP_reform_house_of_peers_desc:0 "世袭的特权不应再干预现代国家的决策。改革贵族院，是为了让立法权真正回归到那些通过才华而非血缘晋升的人手中。"
 JAP_awaken_constitutional_spirit:0 "唤醒护宪精神"
 JAP_awaken_constitutional_spirit_desc:0 "宪法不是一纸空文，而是国民与君主间的契约。我们要唤醒民众心中的法治意识，共同抵御那些试图践踏秩序的狂徒。"
 JAP_local_personnel_reform:0 "改革地方人事"
 JAP_local_personnel_reform_desc:0 "打破地方豪强对行政权的垄断。引入基于功绩的文官委任制，确保国家政策能够精准地落实到每一个县町。"
 JAP_streamline_government_spending:0 "精简政府开支"
 JAP_streamline_government_spending_desc:0 "每一分税金都应发挥其实际价值。通过裁撤冗官冗员，我们要建立一个精干、廉洁且高效的‘小政府’。"
 JAP_free_market_vitality:0 "自由市场的活力"
 JAP_free_market_vitality_desc:0 "反对过度统制，保留竞争机制。只有在市场的洗礼下，日本企业才能保持那股足以征服世界的锐气。"
 JAP_meisho_labor_capital_coordination:0 "劳资协调策略"
 JAP_meisho_labor_capital_coordination_desc:0 "阶级斗争是双输的死局。通过提升劳工待遇换取合作，我们要实现一种超越阶级的国家和谐，共同分享产业发展的红利。"
 JAP_true_meaning_of_yokusankai:0 "万民翼赞之真意"
 JAP_true_meaning_of_yokusankai_desc:0 "所谓的翼赞，不应是盲目的服从，而是国民在法理框架下对国政的积极辅助。这是尾崎行雄留给日本最后的宪政方案。"
 JAP_prosperity_of_kansai_capital:0 "关西财界之兴盛"
 JAP_prosperity_of_kansai_capital_desc:0 "以大阪、神户为枢纽，关西实业家们用他们的韧性与远见，为日本在统制经济的迷雾中撑起了一片繁荣的自由贸易区。"

