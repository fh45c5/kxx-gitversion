l_simp_chinese:
 JAP_Hiranuma_Kiichiro_desc:0 "§Y领导人介绍\n\n生于：§!§L庆应3年9月28日;江戸幕府、美作国西北条郡§!\n§Y生涯：§!平沼骐一郎为日本资深司法检察官僚出身，长期担任枢密院副议长。他与门生组成的‘平沼阀’是日本思想检事体系的核心力量，致力于肃清外来思想对国体的威胁。1934年斋藤内阁倒台后，平沼凭借与政友会总裁铃木喜三郎的私谊，兼得皇道派领袖荒木贞夫、真崎甚三郎支持，顺利组阁，并大力推行翼赞政治。\n\n§C备注：平沼对左翼、右翼思想均抱敌视态度，视一切外来思想皆不如传统东洋道德。此立场令其与意图推动政治改革的革新派政治家关系不睦。"
 JAP_Hara_Yoshimichi_desc:0 "§Y领导人介绍\n\n生于：§!§L庆应3年2月18日;大日本帝国、信浓国高井郡§!\n§Y生涯：§!原嘉道为战国名将原虎胤之末裔，帝国法曹界与财经界的至高重镇。他以民事诉讼第一人远近驰名，曾任第一东京律师会会长及中央大学学长。在田中义一内阁期间，原嘉道以在野法学泰斗之姿破格出任司法大臣，期间总揽全局，与其长野同乡盐野季彦联手发动“三·一五”大检举，并主持修改《治安维持法》，导入死刑、增设目的遂行罪，正式在官制上确立了“思想检事”体制。他是平沼骐一郎“国本社”的骨干理事，在平沼成为首相后成为枢密院议长。"
 JAP_Shiono_Suehiko_desc:0 "§Y领导人介绍\n\n生于：§!§L明治13年1月1日;大日本帝国、东京府神田区§!\n§Y生涯：§!盐野季彦出自旧松代藩司法世家，长年深耕司法省与大审院，是日本“思想检事”体系的主流派代表。作为平沼骐一郎的得意门生，他凭借“国家有用论”的政治融通性，在司法界内组建了盘根错节的“盐野阀”势力，并彻底压倒了小原直等主张刑事警察常道办案的非主流派系。盐野在就任东京地检检事正期间一手创设了“思想部”，并在随后的“三·一五”与“四·一六”事件中担任一线指挥，给极左势力以毁灭性打击。\n\n§C备注：坊间有传闻称，这位冷酷的司法大臣在私底下似乎是神秘主义新兴宗教“皇祖皇太神宫天津教”的隐秘信徒。" 
 SCBJAP.1.t:0 "旭日之下万骨寒：促狭的民主"
 SCBJAP.1.d:0 "1919年，日本在屈辱的“光荣和平”中维持了其大部分殖民帝国，但战后经济的剧烈波动引发了席卷全国的“米骚动”。寺内正毅倒台后，原敬的政友会内阁开启了政党政治的先河，却因其在1921年的遇刺而蒙上阴影。1924年，随着“第二次护宪运动”的成功，加藤高明组成了强大的护宪三派内阁。他在任内推动了男子普选权的通过，但也为了安抚保守派，主导通过了《治安维持法》，旨在严厉镇压受英法革命影响的“赤色分子”。这一时期，大正民主达到了顶峰，但危机已在暗处滋生。随着加藤病逝，政坛进入了更为动荡的时期。\n1927年，政友会总裁田中义一大将上台。田中通过高超的政治手腕，成功劝说先前离党的“政友本党”大部分派系回归，实现了政友会的大团圆。他试图在国内推行强权统治，在外交上则采取“积极政策”。然而，田中的满洲冒险遭遇了前所未有的阻力。日本为保护南满铁路利益并扶持奉系军阀干涉直奉战争，与在华势力日益扩张的德国发生了严重的利益冲撞。日德军队在满洲边缘的长期对峙耗尽了国家的财力与耐心。随着1929年美国经济地震，台湾银行丑闻与“地震钞票”危机交织，田中内阁在军方强硬派与德国外交压力的双重挤压下精疲力竭，最终黯然倒台。"
 SCBJAP.1.a:0 "然后呢？"
 SCBJAP.2.t:0 "旭日之下万骨寒：超然政治"
 SCBJAP.2.d:0 "随后，滨口雄幸作为民政党总裁接手了这副烂摊子，他试图通过重返金本位和签署海军限制条约来挽救国家，但这却为他招来了右翼的子弹。1930年，滨口在东京站遇刺重伤，日本政坛陷入了前所未有的权力真空。面对如此情况，民政党选择了陆军温和派领袖宇垣一成担任总裁，并与政友会组成了联立内阁。然而，由于两党在削减军费与对德政策上的根本分歧，这个脆弱的联盟仅维持了两年便告崩塌。1932年，犬养毅重组政友会单党内阁，却在“五一五事件”中死于激进军官之手。接任的斋藤实海军大将虽然组建了名义上的“举国一致”内阁，但其行政骨干大多来自贵族院的亲民政党派系。这一“伪装的民政党政权”遭到了平沼骐一郎及在野党政友会的猛烈抨击，最终因贪腐丑闻下台，内阁黑幕伊泽多喜男也因遭到右翼袭击，避免直接参与组阁活动。在政友会干事长森恪的游说下，平沼骐一郎突破了各方掣肘，顺利组阁。"
 SCBJAP.2.a:0 "我想了解平沼内阁的状况。"
 SCBJAP.3.t:0 "旭日之下万骨寒：大御所的困境"
 SCBJAP.3.d:0 "平沼骐一郎在政友会主流派、陆军皇道派及海军激进派的簇拥下组建了所谓的“国民内阁”，试图以强权终结此前的混乱。然而，两年的执政时光并未带来所谓的“昭和维新”，反而将帝国推入了更深层的政治泥沼。\n平沼内阁建立在脆弱的平衡之上。首相虽依仗政友会正统派成功瓦解了前任斋藤内阁中民政党的官僚垄断，却因这种赤裸的政友会霸权，导致原本的盟友国民同盟与昭和会转入不信任的对立面。内阁内部俨然成为了各方政治怪胎的收容所：真崎甚三郎接掌陆军省后，虽然雷厉风行地清洗统制派核心，却未能根除其势力，反而迫使那些被边缘化的统制派军官与大川周明等激进右翼达成隐秘契约，试图卷土重来。与此同时，长州阀旧部对身为佐贺阀的真崎极度厌恶，闲院宫更是在暗中伺机而动，试图利用下级军官对内阁“谎话连天”的怨愤，将真崎彻底拉下马。\n更为讽刺的是，平沼骐一郎对“国体”近乎病态的固执，促使其强推了更严厉的《治安维持法》修正案。这种无差别的铁腕镇压，不仅未能清除“赤色分子”，反而迫使遭受迫害的极左势力与同样被打压的激进右翼在阴影中达成了一种畸形的“反平沼共识”。"
 SCBJAP.3.a:0 "糟透了。"
 SCBJAP.4.t:0 "旭日之下万骨寒：近卫新党运动"
 SCBJAP.4.d:0 "平沼内阁执政期间，政府派系失衡与军队的持续动荡导致日本政局陷入停滞。面对这一局面，政界内部要求改革的呼声渐起。以政友会、民政党及国民同盟中的部分中坚力量为基础，部分政客与开明官僚开始寻求改变，并将近卫文麿公爵视为重组政坛的核心人物。\n近卫文麿作为元老西园寺公望的政治侧翼，虽长期保持疏离姿态，但其跨派系的号召力使其成为各方革新势力的目标。以有马赖宁、后藤隆之助为核心的“昭和研究会”作为近卫的智囊团，开始谋求整合即成政党内不满政友会霸权与内阁无能的各派力量，试图构建一套能够整合陆海军分立、提升行政效率的全新决策机制。\n这一动向遭到了平沼骐一郎的强烈抵制。平沼视新党运动为“赤色分子”渗透与捣乱的结果，认为其试图推行的一党一国体制违背了帝国宪法下的国体原则，属于严重的违法行径。\n然而，随着平沼内阁在处理军队内耗与经济管理问题上的彻底失败，原本支持政府的中间力量进一步流失。近卫公爵的出马恐怕是早晚的事。"
 SCBJAP.4.a:0 "天皇陛下，万岁！"
 SCBJAP.5.t:0 "新年"
 SCBJAP.5.d:0 "平沼骐一郎在新年祝词的喧嚣后躲进了私邸侧室，他没有说话，只是缓慢地点燃了一支烟。淡蓝色的烟雾在昏暗的室内盘旋，他沉默地注视着坐在对面的阁僚，手中那份关于选举动向的报告纸角已被揉得皱缩。\n“这就是所谓的肃正？”平沼将烟蒂重重按灭在水晶缸里。内务大臣田边治通不安地挪动着身子，他负责的选举净化运动不仅收效甚微，反而因政友会层出不穷的资金输送与暴力威慑，让大选沦为一场荒唐的闹剧。这不仅给了在野的民政党与昭和会口实，连平日里观望的基层民众也难掩疑虑，平沼能感觉到，自己精心构建的合法性外壳正在碎裂。\n“首相，”内阁书记官长太田耕造压低了声音，额头上渗出冷汗，“民政党已公开表态，要将选举舞弊与陆军近期的丑闻作为质询重点。若任由事态发酵，国会势必瘫痪，议程恐怕要无限期空转。”\n平沼揉了揉眉心，对此心知肚明。在野党绝不会放过这围猎的机会，无止境的党争与扯皮将彻底耗尽内阁仅存的行政执行力。更令他心寒的是财政端的溃败：为了填补军部那无底洞般的扩军需求，结城丰太郎强行转向赤字扩张，这无异于饮鸩止渴。他再次划亮火柴，摇曳的烟火映照出他那张阴鸷而焦虑的脸。对他而言，漫长而又短暂的崩溃开始了。"
 SCBJAP.5.a:0 "“帝国怎么办，我也不知道了。”"
 SCBJAP.6.t:0 "第七十届国会：天价救助"
 SCBJAP.6.d:0 "全球经济海啸的突然袭击与农村社会的连锁崩溃，已将平沼内阁逼至帝国成立以来的最危险时刻。\n当平沼骐一郎步入议事堂时，空气中弥漫着压抑的焦灼。在野党席位上，昭和会议员东武率先发难，他提出了一项要求政府立即投入数十亿日元用于“紧急农村救济与失业者救助”的议案。平沼握着讲稿的手指微微泛白，他比谁都清楚这项动议的破坏力：数十亿日元的巨额支出不仅超出了财政极限，更与军部索要的无底洞军费针锋相对。若接受，财政将即刻崩溃；若拒绝，便等同于公开向国民承认内阁“视底层死活于不顾”。\n这番提议在会场内引发了剧烈的连锁反应，威力犹如一枚投向内阁基座的重磅炸弹。在野党联手利用农村的绝望与城市的萧条，以此为筹码意在彻底摧毁内阁仅存的行政权威。议事堂内，此起彼伏的叫嚣与攻讦淹没了任何理性的讨论，会期在无休止的争吵中被无限拖延。"
 SCBJAP.6.a:0 "可恶……" 
 SCBJAP.7.t:0 "第七十届国会：国家安全保障法"
 SCBJAP.7.d:0 "几天后，国民同盟担心局势彻底失控，由安达谦藏出面进行各方调停。那项让平沼内阁焦头烂额的农村救济动议随之被暂时搁置。\n国会审议的焦点迅速转移。平沼抛出了由他本人与政友会总裁铃木喜三郎、法务大臣盐野季彦预先敲定的草案——《国家安全保障法》。这部旨在强化治安维持的综合性法案早就躺在内务省的案头，只等时机成熟便全盘推出。\n法案的条款涵盖了思想管治、社会监控与战时动员，核心内容是赋予内阁在非常状态下不受议会与司法干预的行政特权。凡是对政府方针的质疑、未经允许的结社或任何形式的扰乱秩序行为，都将被直接定性为破坏国家安全。\n平沼站在讲台上推进审议，他的态度极其强硬。对他而言，这是一场防御性的反击，目的是通过立法彻底清扫议会内的反对声音。但他清楚，这份法案一旦通过，意味着他将公开与所有的在野党派、甚至包括近卫文麿身后的政治势力全面摊牌。坐在台下的议员们看着手中的法案条文，会场内的气氛比几天前更加紧绷。平沼点燃了一根烟，在烟雾中等待着议会最终的投票结果。"
 SCBJAP.7.a:0 "不过了吗？" 
 SCBJAP.8.t:0 "第七十届国会：满洲驻军计划"  
 SCBJAP.8.d:0 "因《国家安全保障法》的抛出，第七十届国会彻底陷入死锁。还没等内阁从党争中抽身，陆军省突然发布的一纸调令，又给这锅沸水投下了一枚重型炸弹。\n陆军大臣真崎甚三郎以“加强满洲防务”与“轮换训练”为借口，下令将一批皇道派的核心尉官成建制地抽调至满洲，充当所谓协助张作霖政府的“教导人员”。这并非简单的调防。这些被视为“激进”的皇道派中下层军官心里很清楚，这是真崎为了自保，在对他曾经的门生进行清洗与放逐。将这群狂热分子推向满洲那个俄、中势力交错，且物资极端匮乏的边缘地带，无异于让他们在政治与现实的双重绞杀中“自生自灭”。\n这道调令在军队基层引发的震荡远超内阁预想。被抛弃的少壮军官们感受到的是一种彻骨的背叛——那位平日里高喊“维新”的真崎陆相，如今为了保住自己的权位，不惜亲手将最忠诚的部下推向火坑。长久以来积压的愤懑与绝望，因这“皇道派杀皇道派”的背叛操作彻底点燃。驻地军营内的气氛已极度危险，下层军官之间关于“肃清腐败陆相”的密谋声浪，在阴影中迅速汇聚。"  
 SCBJAP.8.a:0 "全部都要完了。"  
 SCBJAP.9.t:0 "不安的预谋"
 SCBJAP.9.d:0 "东京市外的某处住宅内，纸窗敞着半扇，夜风湿漉漉地渗进来，带着新叶和泥土的气息。壁炉是冷的，空余一堆灰白的残烬。一盏油灯搁在矮几上，火苗被风扰动，昏黄的光晕在空旷的和室梁柱间不定地晃。角落里松木板壁的霉味，被湿气裹着，沉甸甸地浮在空气里。井上日召将削完水果的小刀收回皮鞘中，一旁的橘孝三郎正把一份报告按在膝上，沉默地等待着。大川周明正低着头，面对着铺开的东京地图，在大大小小的角落处做着标记。\n油灯火苗猛地一跳。\n“差不多了。”大川丢下炭笔，声音低沉。\n橘立刻接话，手指戳向地图：“断电，翻墙，我的人做。”\n井上则慢条斯理地说：“夜班守卫少，墙头空。孩子们都安排好了，出身都干净，一人一杀。”\n大川点头，将东京那些有名人的相片从桌下拾起，散在地图上。“斋藤实、池田成彬、牧野伸显……”\n外面传来隐约的、沉闷的敲击声，那是他们三个的人在准备着明日的正式行动。\n橘孝三郎突然抬眼逼视大川，摸出一张纸条：“那边的青年军官，起事时间能咬死？”他声音压得很低。\n大川从地图上撕下一角，凑近油灯火苗。纸页边缘卷曲焦黑。“定了。”火焰贪婪地吞噬着纸片。井上霍然起身，刀鞘撞上矮几，“当”的一声脆响。油灯的光猛烈摇晃，三人的影子在斑驳墙面上狂乱地扭动了一瞬。窗外，骤雨终于砸了下来，密鼓般捶打着屋顶。"
 SCBJAP.9.a:0 "风雨欲来，山河燃烧……"
 SCBJAP.10.t:0 "玄洋与大本"
 SCBJAP.10.d:0 "大阪某处，神龛上松枝燃烧的烟雾混着线香，凝成青白色的旋涡，在梁柱低垂的幽暗空间里缓缓上升。厚重的榻榻米中央，几处深陷的凹痕显示着常有人跪坐。木格窗外，城市的喧嚣被厚重的墙壁隔绝，只余一片沉闷的寂静。\n出口王仁三郎盘膝端坐于蒲团之上，宽大的白色祭袍下透出富态圆润的身形。他圆润的面庞上，一双细长的眼睛几乎隐没在眼睑的褶皱里，只偶尔在烟雾中闪过一丝让人捉摸不透的光，仿佛永远在浅笑。他厚实的手指无意识地摩挲着矮几上那块温润龟甲的神秘刻痕，一旁搁着半碗冷透的茶。\n对面，内田良平虽也盘坐，但灰白相间的长须如银瀑般垂落胸前，几乎覆住了整个前襟，透出年长者的威严。他刚从风尘仆仆的旅途下来，灰色和服衣襟一丝不苟，靴子边缘还沾着干燥的关东泥土，唯有那双锐利的眼睛，在皱纹和白须的包围中，依旧如鹰隼般刺破了烟雾。\n“下位的手笔，确实像样了。”出口的声音低沉缓慢，带着奇特的共鸣，他眯缝的眼缝似乎更细了。窗外树影落在他圆润的脸上。“关西的‘维’，已有筋骨。”\n内田良平没有碰面前的茶水，他灰白的长须微不可察地颤动了一下，锐利的目光穿透烟雾，直钉向出口那双仿佛闭合的眼睛：“筋骨有了，现在要看东京那边的‘新’。”他解开和服前襟，取出一枚卷得极紧的蜡丸，两指捏着，轻轻放在龟甲边缘，动作间长须随之拂动。“风，从江户城那头吹来了，很大。青年军官的火把……要点燃了。”他话语里每一个音节都像锤子敲打铁砧。\n出口王仁三郎一直眯着的双眼骤然睁开了极细的一线，精光乍现，如同暗室中划过的冷电，圆脸上的和蔼瞬间被一种深沉的警觉取代。他厚实的手指猛地攥紧了龟甲，指节发白。烟雾在他头顶盘旋，几乎要触到低矮的房梁。寂静中，只有线香燃烧的“哔啵”声，以及内田良平身上那股来自东京的、尚未散尽的风尘与铁锈气息。"
 SCBJAP.10.a:0 "“昭和神圣会在必要时会配合。”"
 SCBJAP.11.t:0 "青年的交谈"
 SCBJAP.11.d:0 "雨点单调地敲打着营房铁皮屋顶，像不耐烦的计数。煤油灯火苗在冷风中摇摆，将桌边几张年轻面孔的影子扯得扭曲。空气中混杂着旧军装的汗味与机油味，焦灼而滞重。\n矶部浅一背靠铁壁，手指捻着脱线的线头，声音压得极扁：“都确认了？明晚九点，别摸错地方。”\n香田清贞死死抵着刀镡，指节发白，颤声应道：“闭着眼睛都能摸到！”\n安藤辉三捏起一块干硬饭团，语气平淡却如淬冰的探针：“饭要煮得恰到好处，米粒要一粒是一粒。”他扫视众人，河野寿与野中四郎下意识挺直背脊。野中想喝水，手一晃，水洒在了卷曲的《步兵操典》上。\n“西田税先生那边，联络上了吗？”矶部停下动作，目光锐利。\n角落里划线的笔尖骤停。安藤斩钉截铁地回答：“联络上了。北一辉先生也写了回信。”\n河野寿猛地一震，脸上涌起不正常的潮红，脱口而出：“好！”\n死寂中，雨声如狂乱的心跳。火苗剧烈一跳，巨大的阴影瞬间吞没了半张桌子，将这群被狂热与恐惧撕扯着的青年，更深地埋进昏暗里。"
 SCBJAP.11.a:0 "维新的本意到底是什么呢……"
 SCBJAP.12.t:0 "一名“工人”的夜晚"
 SCBJAP.12.d:0 "东京下町区陈旧的长屋里，空气中弥漫着劣质木炭的呛烟与旧榻榻米的霉味。小林坐在冰冷的屋角，粗糙的手紧攥着一张湿软的米纸。字迹在昏黄灯光下模糊而刺眼：“明日，蛰伏，观察，待机，北方。”这是半小时前，巷口一个行色匆匆的“醉汉”塞给他的。\n他盯着纸条看了几秒，眼神如凝固的深潭。随后，他从榻榻米下拖出工具箱，里面没有木工活计，只有用油布仔细包裹的金属零件、棉纱和几本卷边的手册。手指在冰冷的零件上无意识拨弄，发出细微的磕碰声，指甲缝里的油污与机油味混合在一起，那是属于底层劳动者的气息。\n小林起身走到气窗前，额头抵着冰冷的窗框，侧耳捕捉着死寂中的动静。没有枪响，没有军靴声，只有远方工厂沉闷的汽笛。他回到灯下，将米纸凑近灯泡上方的热源。火苗贪婪地舔舐着“蛰伏”、“观察”、“北方”，字句在青烟中消散，只留下一点焦糊味。\n他吹熄指尖的火星，掀开墙角一处松动的榻榻米。油布裹着的南部式手枪轮廓清晰可见，散发着冰凉的金属质感。他没有取出武器，只是用指腹在油布上用力、缓慢地来回擦拭，仿佛在安抚某种狂躁的冲动。\n熄灯后，屋内被浓稠的黑暗吞噬。小林躺在榻榻米上，睁眼望着模糊的天花板。时间像凝固的沥青，粘稠地流淌。他在等待明天的第一声枪响，等待黑暗尽头可能亮起的、属于“北方”的光。指缝间的机油味，在死寂中愈发清晰。"
 SCBJAP.12.a:0 "该流血了……"
 SCBJAP.13.t:0 "内务省的报告"
 SCBJAP.13.d:0 "田边治通走进书房，将一份蓝皮档案放在平沼骐一郎的桌面上。没有寒暄，没有多余的动作。\n\n“首相，这是警保局刚刚汇总的监视记录。”田边说道，“陆军第一联队驻地今晚有三次异常的人员集结。根据监听，涉及矶部浅一、香田清贞等人的通讯频率已经加密。这不仅是小范围集会，极有可能是针对霞关官厅区的联动进攻。”\n\n平沼放下手中的公文，目光停留在档案封面的红色印章上。田边继续补充：“目前国会会期尚未结束，在京的政友会、民政党领袖及内阁成员均在警戒范围。如果这是政变预演，内阁的防御力量在今晚九点前就会被冲破。我有授权，请求立即对相关涉事军官及极端右翼智囊采取行政拘留措施。”\n\n平沼抬头看了一眼挂钟，指针指向八点十分。书房内只有纸张翻动的声音，他必须在这一刻做出判断……" 
 SCBJAP.13.a:0 "“授权内务省，立即开始抓捕。”"
 SCBJAP.13.b:0 "“这份名单只能转交给真崎陆相，严禁任何主动干预。”"
 SCBJAP.13.c:0 "“将这份名单复印两份，分别交给真崎陆相与宪兵队司令部。”"
 SCBJAP.14.t:0 "东京的灯，灭了"
 SCBJAP.14.d:0 "时间像被冻住的沥青，粘稠地滑向预定时刻。东京的夜空，原本被都市的灯火切割得支离破碎，霓虹的河流在楼宇间喧嚣流淌。橘孝三郎手指粗糙而稳定，猛地压下总闸手柄。那是一声沉闷、如筋骨断裂般的“咔哒”声。\n刹那间——\n以这处配电所为中心，黑暗如同墨汁滴入清水中，迅猛无声地晕染开来。先是近处几栋低矮民居的灯火倏然熄灭，如同被无形的手掐灭了烛芯。紧接着，神田、新橋、麹町……一片又一片区域的灯火，如同多米诺骨牌般接连倒下。皇宫外苑的奢华灯饰、霞关官厅大楼里冰冷的日光灯管、银座橱窗流溢的霓虹、下町区窗口昏黄的灯泡……整个东京的血管，被瞬间截断。最后熄灭的是首相官邸门前那盏孤悬的路灯，光晕挣扎着收缩，最终化为一点微弱的红热，旋即没入彻底的墨色。\n巨大的城市陷入死寂，旋即被更巨大的声浪吞噬。\n“啊——！”\n“停电了？！”\n“怎么回事？！”\n惊呼、咒骂、奔跑的脚步、孩童的哭嚎、家具被撞倒的巨响……从无数个窗口、街巷中喷涌而出，汇聚成一片混沌的声浪，在这无光的城市上空翻腾。汽车的灯光骤然亮起，如同受惊野兽慌乱的眼睛，光束在黑暗中急促地扫射、相撞，喇叭声凄厉地撕破夜空，在突然失去参照物的街道上制造出新的恐慌和拥堵。\n内务省大楼内，一位官僚猛地从堆满文件的办公桌上抬起头，桌上的台灯灭了。他冲到窗边，只看到本该灯火通明的霞关，此刻一片令人心悸的墨黑。他喉头滚动，想喊人，却只发出一声嘶哑的抽气声，一股冰冷的寒意顺着脊柱直冲头顶。\n与此同时，陆军第一联队驻地附近，金属碰撞的摩擦声与急促的口令声骤然响起。黑暗中，靴子践踏积雪的声音汇成一股暗流，撕开寂静，朝着东京的心脏——永田町方向奔涌而去。\n东京，这座帝国的巨兽，在突如其来的、彻底的黑暗中،开始了它混乱而血腥的痉挛。"
 SCBJAP.14.a:0 "夜，开始了。"
 SCBJAP.15.t:0 "高桥是清之死"
 SCBJAP.15.d:0 "高桥是清官邸。浓稠的黑暗中，安藤辉三与中桥基明率兵撞开纸门，皮靴粗暴地踏碎了宅邸的宁静。手电光柱如冷酷的追光，直射室内。\n高桥是清穿着白色寝衣，蜷缩在被褥中，稀疏白发在强光下近乎透明。他布满皱纹的脸因惊惧而扭曲。一名挡在身前的女子被士兵粗暴拽开，跌落在地，发出绝望的尖叫。\n“高桥是清！”安藤的声音在混乱中如冰块坠地。\n老人徒劳地后缩，哆嗦的嘴唇发不出完整的音节。安藤没有半分迟疑，下颌线条在阴影中绷紧，冷冷吐出两个字：“斩奸！”\n刺刀瞬间突刺，带着机油味的钢铁撕裂了脆弱的寝衣。数把刀刃从不同角度捅入那衰老的躯体，肉体被洞穿的闷响在和室里清晰可闻。高桥的身体剧烈弹起又重重摔下，鲜血如泉涌般在洁白的被褥上洇开。\n浓烈的血腥味瞬间覆盖了屋内原本的线香气息。手电光冷漠地掠过那具抽搐的残骸，安藤面无表情地向一旁失声痛哭的女子微微颔首，语调平板得令人发指：“失礼了，打扰了。”\n皮靴声迅速远去。黑暗中，只剩下粘稠血珠从榻榻米滴落的声音，以及整座城市在无光之夜中的混乱哀鸣。"
 SCBJAP.15.a:0 "财政之碍已除。"
 SCBJAP.16.t:0 "首相官邸的搜捕"
 SCBJAP.16.d:0 "当香田清贞率领的突击队撞开首相官邸深处那扇厚重的红木门时，室内仅剩下一盏还在冒着青烟的台灯。桌面上摊开着几份未及焚毁的加密电报，窗帘被外面的狂风吹得剧烈翻卷，拍打着大理石墙面。官邸卫队的残余力量在走廊尽头阻击，枪声在空旷的室内回荡，伴随着金属弹壳跳动在瓷砖上的细碎响动。\n\n指挥室内空无一人。香田上前按住桌面，木制表层尚存余温。通过刚才的枪战，卫队撤退得异常迅速，这与他们之前誓死防御的姿态截然不同。\n\n“搜！”香田发出命令。士兵们粗暴地掀开地毯，推倒书架，刺刀扎进每一处可能的暗格。一名军官在走廊转角处捡起一只被遗落的单片眼镜，那眼镜的镜片在冷光灯下一闪而逝。就在他们围住办公桌的一刹那，后方传来一声压抑的闷响。有人在侧厅开枪了。子弹击穿了墙上的木制护墙板，碎屑四溅。在那短暂的一秒内，一个模糊的身影从防空暗道出口处闪过——那是平沼骐一郎，他侧脸的轮廓在火光中如岩石般僵硬，随即没入通往地下的阴影中。\n\n香田迅速扣动扳机，子弹擦过那个身影的肩膀，击碎了门框边缘的装饰线。守卫们在最后一刻将铁栅栏重重合上，发出沉闷的断裂声。第一联队的军人们冲到铁栅前，面对的是死一般的沉寂与黑暗。" 
 SCBJAP.16.a:0 "没有发现首相踪迹，占领官邸。"
 SCBJAP.16.b:0 "发现了老不死的血迹，继续追！"
 SCBJAP.17.t:0 "重臣的终结"
 SCBJAP.17.d:0 "凌晨的东京街头，雪花开始零星飘落，覆盖在尚未干透的血迹上。在陆军省附近一处隐蔽的街角，几支刚完成“任务”的小队在一片死寂中会合。空气中弥漫着刺鼻的硝烟味与剧烈的喘息声。\n中桥基明带着满身的寒气率先抵达。他的军服上溅着几点洗不掉的暗红，眼神中透着一种空洞的亢奋：“高桥是清那边已经解决了，那个老朽没撑过第一轮突刺。”\n片刻后，另一支小队由渡边太郎率领疾步而来。他的刺刀尚未入鞘，刀尖在雪地上拖出一道断断续续的红线。“渡边教育总监也已伏诛。”他声音嘶哑，带着一丝事后的虚脱感，“那老头子倒是硬气，但在‘维新’的大义面前，什么都不是。”\n最后抵达的一名尉官脸色苍白，语气却异常冷酷：“内大臣斋藤实官邸也已‘清理’完毕。他在睡梦中就被送上了路，甚至没来得及说一句话。”\n几名首谋者围站在昏暗的街灯下。平沼骐一郎生死不明，但高桥、斋藤、渡边这三座压在青年军官头顶的重臣大山，已在这一夜悉数崩塌。\n远处皇宫方向隐约传来零星的枪响，那是这座帝国心脏在最后颤抖。他们互相交换了一个决绝的眼神，黑暗中，只有金属碰撞的冷冽声回荡在积雪的街道上。"
 SCBJAP.17.a:0 "诸君，新时代开启了。"
 SCBJAP.18.t:0 "变质的圣战"
 SCBJAP.18.d:0 "在断电后的彻底黑暗中，数支叛乱部队如潮水般涌向东京的中枢。陆军省、参谋本部、警视厅的沉重大门接连被狂热的士兵撞开。在刺刀与机油味的包围下，各大新闻社与电信局迅速易主，关于“昭和维新”的檄文正准备通过这些夺取的喉舌传遍全国。\n然而，权力的交接并非如兵棋推移般精确。在永田町与霞关交界的街口，黑暗成了最可怕的催化剂。由于断电导致的视觉盲区，加之士兵们处于极度的神经紧逼状态，任何一丝风吹草动都触发了悲剧。\n“什么人！站住！”一名年轻下士对着黑暗中移动的黑影嘶吼，回应他的只有受惊路人慌乱的奔跑声。\n“砰！砰砰！”\n密集的枪声在狭窄的街道间回荡，由于无法辨识目标，恐慌在士兵中蔓延，导致了更大规模的盲目扫射。几名正欲翻窗逃离火线的平民在血泊中倒下，其中甚至包括清晨早起劳作的报童。\n当手电筒的光束照亮那具幼小的、被三八式步枪贯穿的尸体时，原本整齐的行军队列出现了一阵死寂般的动摇。"
 SCBJAP.18.a:0 "……" 
 SCBJAP.19.t:0 "断裂的政纲"
 SCBJAP.19.d:0 "永田町周边的公馆区此时已是炼狱。宪兵队与参与政变的青年军官部队不再区分敌友，只要是持有议员公馆通行证的人，一律在门廊前被就地拦截。那些平日里在高谈阔论“大正民主”与“宪政准则”的政客们，此时被粗暴地拽出暖床，衣衫不整地推入冰冷的积雪中。\n\n“你们这是叛乱！这是对宪法的公然蹂躏！”一名议员在刺刀下咆哮，声音因恐惧而破碎。回应他的是一记结实的枪托击打，随着肋骨断裂的闷响，那议员像一滩烂泥般瘫倒在血色模糊的雪地上。"
 SCBJAP.19.a:0 "旧政治已死。"
 SCBJAP.20.t:0 "清算的阻力"
 SCBJAP.20.d:0 "政变部队在控制霞关官厅区时遭遇了意料之外的阻滞。当几支负责搜捕政要的军官小队试图进入内务省外围防区时，遭遇了不明身份武装人员的迎头痛击。\n\n枪声在狭窄的街道间密集爆发，子弹精准地穿透了路灯，将街道重新归还给黑暗。这些反击者并非正规编制的守卫，他们身着宪兵制服，却不听从任何长官指令，行动节奏干练，且专门利用巷口的死角射击。几名冲锋在前的青年军官被点名击毙，突击阵型瞬间溃散。\n\n带队的队长避在水泥柱后，看着几名部下胸口整齐的弹孔，面色阴沉。这不是政友会或民政党的保镖所为。这股冷酷的、目的明确的火力，分明出自那些早已被清洗的“永田系”残部之手。\n\n“是统制派的残党，”他低声咒骂，握紧了刀柄，眼神中闪过一丝暴戾，“这些阴沟里的老鼠，还没学会认清形势。”\n\n尽管兵力占优，但每一条通往权力中枢的干道都被这些伏击者封锁，皇道派军官们陷入了极度的神经紧绷中。"
 SCBJAP.20.a:0 "清理掉这些阴沟里的老鼠！"
 SCBJAP.21.t:0 "廉价的混乱"
 SCBJAP.21.d:0 "随着黑夜渐深，这场政变开始渗入更多不确定的因素。几伙身份不明的暴徒出现在了市中心边缘。他们大多穿着廉价的黑色短打，手持短刀、铁棍或是从杂货铺抢来的汽油瓶，在银座与下町交界处疯狂地冲撞。\n\n这并非有组织的军事行动，而更像是一场缺乏纪律的宣泄。这些武装暴民在街道上肆意打砸，他们无法辨认目标，只能对着每一个亮灯的窗口投掷石块，或是对着空荡的街道进行无意义的嘶吼。这种拙劣的战术让原本就紧张的街头防御彻底瘫痪。\n\n枪声、玻璃破碎声与暴民的狂啸混作一团。平民们从睡梦中惊醒，面对这种毫无预兆的恐怖，除了在屋内死死顶住大门、发出压抑的哭泣声外，别无他法；而在试图逃离街区的平民队伍中，则不断有人因受到惊吓而盲目奔逃，最终撞进叛军与反击者的交火区，沦为无名的牺牲者。"
 SCBJAP.21.a:0 "理性的崩溃。" 
 SCBJAP.22.t:0 "神座的崩塌"
 SCBJAP.22.d:0 "皇宫，这座被层层宫墙拱卫的“神域”，也未能幸免于今夜的疯狂。御书房内空气凝滞，裕仁天皇脸色惨白，死死盯着紧闭的拉门。铃木侍从长僵立一侧，额角冷汗直流。\n突然，刺耳的枪声在皇宫外苑炸响，伴随着粗野的咆哮：“清君侧！天诛！破门！”近卫兵惊慌的呼喝与零星的抵抗声交织在一起。\n“陛下！有暴徒闯入，请速避！”侍从长声音带着哭腔，猛地扑到御案旁，试图用身躯挡住裕仁。裕仁猛地站起，脸色由白转灰，一种超越恐惧的荒谬感与愤怒攫住了他。\n“砰！”沉重的撞击声撼动着宫苑深处的门户。负责警戒的警卫长满脸血污冲入室内：“陛下！暴徒已入内苑，正逼近御书房！”他紧握手枪，侧身挡在裕仁身前，示意掩护撤离。\n正门方向，木头碎裂声与疯狂的吼叫已近在咫尺。那扇象征神国至圣的御纹拉门在撞击下剧烈震动，仿佛随时会崩塌。时间凝固在这一刻，生与死，就在这几步之间。"
 SCBJAP.22.a:0 "“撤！”"  
 SCBJAP.22.b:0 "“朕……是神国天子！尔等……敢弑君？！”" 
 SCBJAP.23.t:0 "铁幕垂落"
 SCBJAP.23.d:0 "地下作战室内的空气被凝重的烟草味填满。皇宫遇袭、天皇下落不明的消息像铅块一样压在所有人胸口。寺内寿一猛地将拳头砸在作战地图上，巨大的响声震得桌上的台灯剧烈晃动，他指着真崎甚三郎与荒木贞夫，咆哮声在狭窄的空间内回荡：“看看你们干的好事！把帝国变成修罗场，这就是你们所谓的‘维新’？”\n\n真崎甚三郎枯坐在阴影中，平日笔挺的军服此刻满是褶皱。他低垂着头，双手死死扣住膝盖，原本锐利的双眼此刻布满血丝，呈现出一种灰败的死寂。荒木贞夫站在他身侧，机械地拍着身旁林铣十郎的肩膀，试图以此寻求一丝盟友的共鸣。然而林铣十郎面色阴鸷，冷冷地侧过脸，避开了那只颤抖的手。阿部信行默然立于一旁，冷眼旁观。\n\n“那是头被你们喂饱的野兽，现在它正准备撕碎主人。”石原莞尔猛地从地图前转过身，他大步迈到真崎与荒木面前，几乎是贴着他们的脸，手指狠狠戳向两人的胸口，声音阴冷如冰：“真崎！荒木！看看你们养出来的那群狂犬！因为你们的纵容，现在连天皇陛下都被置于险境！你们是帝国的罪人，是耻辱！”\n\n真崎的身体猛地颤抖了一下，却依然没发一言。杉山元、川岛义之、山下奉文站在长桌两侧，目目相视，等待着真崎做点什么。最终川岛义之走到长桌顶端，将一份印着陆军大臣官印的镇压作战指令推至真崎面前，语气带着一丝被抽离的虚脱感：“陆相，下令吧。调动近卫师团与第一师团，立刻进城。”\n\n寂静中，真崎甚三郎缓缓抬起头，接过钢笔的手剧烈抖动，最终在作战令上签下了自己的名字。镇压机器终于开动，东京的夜，步入了最冷酷的时刻。"
 SCBJAP.23.a:0 "当野兽挣脱了锁链开始撕咬主人，唯一能终结混乱的，只有更强大、更无情的铁拳。"
 SCBJAP.24.t:0 "深海之礁"
 SCBJAP.24.d:0 "当陆军省地下的镇压指令如雷暴般滚动时，东京湾畔的伏见宫博恭王官邸，却笼罩在一种截然不同、深不可测的沉重中。\n海军军令部长伏见宫博恭王端坐主位，苍老锐利的鹰目扫视着海图桌旁的将领。桌上摊开的并非海战图，而是标注着陆军叛军控制区的东京地图。\n“陆军！那群马粪！”海军大臣加藤宽治焦躁地踱步，声音因狂怒而嘶哑，“连自己的窝都看不住！难道要海军上岸去替他们清理烂摊子吗？！”他毫不掩饰对陆军无能的鄙夷。\n军令部次长末次信正脸色阴沉如铁，随之附和：“殿下！若陆军镇压不利，海军绝不能坐视帝都沦陷于叛军之手！”\n“荒谬！”海军省军务局长米内光政冷冷打断，眉头紧锁，“贸然让水兵上岸卷入内乱，只会让局面更不可收拾。”他转向伏见宫，语气慎重：“海军应确保自身稳定，严密关注陛下安危，这才是应尽之忠节。”\n侧旁的井上成美补充道：“名不正，则言不顺。应令陆战队及舰队进入戒备，但不主动介入市区冲突。”\n在一片争执中，伏见宫博恭王始终保持着深海般的死寂。他看着这群各怀心思的部下，最终缓缓点头。在这场倾覆帝国的风暴中，海军这块巨礁选择在黑暗中冷冷地观望着陆地上的火焰。"
 SCBJAP.24.a:0 "旁边的动静是什么？"
 SCBJAP.25.t:0 "皇兄弟们"
 SCBJAP.25.d:0 "在海军官邸深处的密室里，高松宫宣仁亲王紧握手枪，年轻的脸上混杂着惊惧与愤怒。关于皇兄裕仁及年幼皇太子的安危全无音讯，这种死寂般的未知比外面的枪声更令人煎熬。\n“护贞，”宣仁声音沙哑，“皇侄们……还有秩父宫兄长……”\n亲信细川护贞心领神会：在这种天崩地裂的时刻，必须确保皇位继承的延续性。他迅速冲向海军秘密通讯点，手指颤抖着拨通了青森县官邸的专线。漫长的等待音如同死亡倒计时。\n“莫西莫西！我是雍仁。东京……到底发生了什么？！”电话那头，秩父宫雍仁亲王的声音充满了震惊。\n细川刚要汇报皇宫遇袭、天皇失踪的末日景象，官邸外突然炸响一声巨响！海军陆战队的鸣枪示警声与骚乱声瞬间爆发。\n“殿下！东京叛乱！陛下安危不明！您务必留在青森，绝对不要……”话音未落，线路在刺耳的噪音中戛然而断。细川握着冰冷的听筒，脸色惨白。\n而在遥远的北国，只听到半截惊悚消息的雍仁亲王陷入了巨大的惶恐与躁动。他猛地冲出房间，下令立刻准备列车南下。东京的烈焰，正顺着铁轨向整个帝国蔓延。"
 SCBJAP.25.a:0 "其他地方也将被东京的火燃烧……"
 SCBJAP.26.t:0 "永田町核心突击"
 SCBJAP.26.d:0 "第1师团步兵第57联队在第2战车联队数辆八九式中战车的支援下，沿着永田町通向首相官邸和国会议事堂发起强攻。叛军依托官邸围墙、国会大厦的石柱和邻近建筑，架设机枪，进行顽强但缺乏组织的抵抗。坦克的炮火轻易撕碎了沙袋掩体和部分门窗，步兵在钢铁掩护下发起刺刀冲锋。叛军的“尊皇”狂热在钢铁洪流面前迅速瓦解，防线出现多处缺口。05:17，首相官邸主要建筑上升起镇压部队的旗帜。叛军残部退守国会大厦地下室及周边小范围区域，但被完全孤立。"
 SCBJAP.26.a:0 "在绝对火力优势和心理震慑下，残余叛军精神崩溃，打出白旗投降。"
 SCBJAP.26.b:0 "叛军发动了数次自杀式反冲击，国会大厦未能即时拿下。"
 SCBJAP.27.t:0 "三宅坂要塞争夺"
 SCBJAP.27.d:0 "近卫师团主力在师团长亲自督战下，主攻叛军心脏——被占领的陆军省和参谋本部大楼。这里是叛军指挥中枢和精神象征，抵抗最为狂热。叛军利用钢筋混凝土建筑、地下通道和预先储存的武器弹药，构成了交叉火力密布的死亡陷阱。镇压部队虽人数火力占优，但进展缓慢，每层楼、每个走廊都爆发血腥的白刃战和手榴弹互掷。大楼内浓烟滚滚，枪声爆炸声震耳欲聋。叛军喊叫着“天诛！七生报国！”发起一波波玉碎冲锋。"
 SCBJAP.27.a:0 "石原莞尔利用炮兵强攻，最终夺回了核心区"
 SCBJAP.27.b:0 "高层顾忌对中枢建筑的严重破坏及可能存在的重要人物被挟持，导致进攻无效" 
 SCBJAP.28.t:0 "真崎幕府的黎明"
 SCBJAP.28.d:0 "硝烟散尽的东京，死一般的沉寂笼罩着永田町。真崎甚三郎独自站在首相官邸那扇碎裂的落地窗前，军靴下踩着的是他昔日亲信留下的血迹。就在刚才，他亲自签署并下达了对安藤辉三、香田清贞等人的最后清算令——他亲眼看着那些曾高呼着“尊皇讨奸”、视其为精神偶像的青年军官，在行刑场上被剥去领章、面对枪口，化作这严冬中最刺眼的红色污点。\n\n那种曾让他热血沸腾的疯狂亢奋，此刻褪去得干干净净，只剩下彻骨的寒冷。权力，正如他所愿地落在了掌心，但这权力却是由昔日理想的残骸堆砌而成。\n\n“都结束了，真崎君。”平沼骐一郎从暗影中走出，这位在危机中与他达成默契的文官首领，此刻神情疲惫。他手中捏着一份草拟好的内阁辞呈，语气中没有胜利者的喜悦，只有一种将烂摊子抛出的如释重负：“内阁已无法运作……重臣们的大命，恐怕会直接下达给你了。”\n\n真崎没有回头，他透过残破的窗棂，凝视着远处那群正在被宪兵队押走的背影。他那曾经刚毅的面孔上，此时只留下一片虚无的苍老。平沼注视着他，在这一刻，他依然能从这位新晋首相的眼底捕捉到那股少年般倔强而顽强的微光——那是属于他最纯粹、也最盲目的执念。\n\n真崎缓缓转身，沉重的指挥刀撞击着冰冷的木地板。他在这一刻意识到，自己终究还是成为了那个他曾试图摧毁的旧秩序的守门人。"
 SCBJAP.28.a:0 "“大君之御旗下，骸骨堆积如山，孑然独行……”"
 SCBJAP.28.b:0 "“要不，还是交给荒木吧……”" 
 SCBJAP.29.t:0 "重臣会议——残局"
 SCBJAP.29.d:0 "皇宫深处，熏香的烟雾弥漫在狭小的会议室内。斋藤实内大臣的空位像一道巨大的伤口，横亘在众人之间。窗外，东京仍有零星的枪声穿过寒冷的空气，每一声都像是在敲打着在座之人的心房。\n宫内大臣木户幸一冷峻地整理着手中的卷宗，他的视线扫过众人，最后落在清浦奎吾苍老的手上。\n“诸君，”清浦奎吾缓缓开口，声音干涩却坚定，“兵火已平，但帝国不能没有头颅。如今陆军人心惶惶，唯有拥戴军中宿将出面，方能平息这场动乱。南大将或松井大将，这两位不论是谁，都能压住那群狂徒的刀锋。”\n平沼骐一郎立刻点头，目光阴郁地扫向四周：“清浦伯所言极是。非常时期，当用非常手段，与其让军部自行推举，不如由我们提出人选。”枢密院议长原嘉道也紧随其后，声音低沉地表示附议。\n一木喜德郎猛地抬头，双手撑在桌面上，眉头紧锁：“一旦军人掌握了组阁权，将来谁能再制约他们？”\n坐在角落里的若槻礼次郎始终低垂着头，双手交叠于袖中，对这些争论充耳不闻，他深知自己代表的政党政治已是明日黄花，此刻发言只会引火烧身。\n伊泽多喜男与冈田启介低声交谈着，眉头紧锁，神情间尽是愁云。他们比谁都清楚这一步踏出的后果，但面对外面躁动如野兽的陆军，他们同样找不到更好的出路。“还望各位重臣速速为陛下解忧……”木户幸一的声音平静，不带一丝感情色彩，他看着窗外燃烧的东京，仿佛在等待着一个能够盖棺定论的瞬间。屋内陷入了可怕的沉静，除了若槻略显沉重的呼吸声，只剩下那盏台灯在不断地明灭。"
 SCBJAP.29.a:0 "拥戴南次郎，起用这头“关东军的老虎”。"
 SCBJAP.29.b:0 "拥戴松井石根，以威望缓和派系矛盾。"
 SCBJAP.30.t:0 "牧野私宅的密谈"
 SCBJAP.30.d:0 "冬雨绵绵，牧野伸显那座隐蔽的私宅在寒风中显得格外冷清。平沼骐一郎跨过门槛时，身上还带着官邸那股未散的硝烟味。他刚刚从那场血腥的肃清中撤身，此刻即便西装革履，也难掩周身的疲惫。\n\n屋内，木户幸一早已静候多时。作为代行内大臣，木户的面色沉静如水，看着平沼在牧野伸显身侧坐下。窗外，被政府强行镇压的“维新”残党正在被连夜收押，而此时此刻，这间小小的书房里，正在进行着帝国命运的最后一次文官闭门会议。\n\n“重臣会议那边，军人正虎视眈眈。”平沼看着炭火，声音低哑，“他们想把手伸进内阁。但我不能让他们如愿。”\n\n牧野伸显尽管在暗杀中幸存，但神情已显苍老。他听着平沼的谏言，缓缓点头。木户幸一则用指尖敲击着桌面，权衡着这一决策的风险。“盐野季彦，法务大臣，行事严谨，手段狠辣老练，是我的得意门生，可堪大任；原嘉道，枢密院议长，老成持重，政友会总裁铃木氏亦表面愿与其共事，重建我国之国体秩序。”\n\n“选吧。”牧野轻声叹息，将权杖交到了平沼手中。平沼抬起头，看向木户：“木户君，把这个名单送到御前吧。告诉陛下，这是为了捍卫帝国最后的文官尊严。”"
 SCBJAP.30.a:0 "大命最终下达给盐野季彦法相。"
 SCBJAP.30.b:0 "大命最终下达给原嘉道枢密院议长。"
 SCBJAP.31.t:0 "宪政的幽灵"
 SCBJAP.31.d:0 "叛乱目前已经被天皇强势要求平息。内阁总理大臣平沼骐一郎在伤势稍稳后，已正式提交辞呈。随着内阁进入停摆状态，重臣会议与各部司长官之间的联络密度显著增加。伊泽多喜男作为前内务系统的要人，目前频繁往来于官僚集团与各重臣公馆之间，就下一任首班人选进行具体评估。\n\n在巢鸭的私人宅邸，伊泽多喜男的访客名单涵盖了当前政坛的所有关键势力。他不仅与政友会总裁铃木喜三郎进行了密谈，更在随后会晤了曾经的竞争对手、国民同盟的安达谦藏，试图在动荡的局势下调和党派间的严重对立。为了确保组阁方案的稳妥，他还暗中接见了部分军部中立派的代表，探寻陆军对文官组阁的底线。\n在结束了这一连串紧锣密鼓的穿梭后，伊泽亲自拜访了西园寺公望公爵的私邸，当面呈报了组阁构想。后藤文夫的名字被摆上了棋盘，他是伊泽最信赖的亲信，也是重建政党纽带的最佳人选。而近卫文麿那张年轻、英俊却让人捉摸不透的面孔，也被伊泽反复提及——那是他寄予厚望的、足以对抗陆军蛮横的贵族招牌，一如当年的滨口雄幸。"
 SCBJAP.31.a:0 "大命最终下达给后藤文夫农相。"
 SCBJAP.31.b:0 "大命最终下达给近卫文麿公爵。" 
 SCBJAP.31.c:0 "解散国会重新选举，官僚将监督政党内阁重建。"
 SCBJAP.32.t:0 "第20回众议院议员总选举" 
 SCBJAP.32.d:0 "随着宪法第7条的解散令发布，帝国进入了空前的选举动员期。尽管刚刚平息的兵乱仍让社会气氛压抑，但各党派在全国范围内展开了密集的竞选活动。候选人们纷纷在演讲台上提及“肃正选举”与“国防建设”的平衡。选民们在各处的投票所排起长龙，面对极度不确定的国家前景，他们投下的每一张选票，都直接决定了未来帝国行政权的归属与政党政治的存续可能性。"
 SCBJAP.32.a:0 "立宪政友会保持了优势"
 SCBJAP.32.b:0 "立宪民政党重新崛起" 
 SCBJAP.32.c:0 "国民同盟和昭和会的联盟取得了成功"
 SCBJAP.32.e:0 "什么叫我们要扶持尾崎行雄作选举肃正榜样？"
 SCBJAP.33.t:0 "政友会的回归"
 SCBJAP.33.d:0 "随着众议院选举尘埃落定，政友会凭借着平沼内阁垮台后留下的政治遗产，顺势掌握了议会的大多数席位。尽管伊泽多喜男与民政党系的官僚对于政友会那种急于掌控枢机的作风始终抱有警惕，甚至带有某种程度上的排斥，但既定的政治惯性已无法阻挡。\n森恪在选举期间的激进纲领与平沼当初的政治承诺产生了奇妙的共鸣，平沼系官僚在辞职前夕已与政友会高层达成了事实上的默契。现在，权力的大门不得不向这位曾经的强硬派领导人敞开。伊泽多喜男在幕后审视着这份名单，他深知，无论个人喜好如何，只要政友会能够控制住军部的喧嚣并维持政局运转，这一轮的权力移交便是此时最为稳妥的“必然”。"
 SCBJAP.33.a:0 "大命最终下达给铃木喜三郎"
 SCBJAP.33.b:0 "大命最终下达给森恪"
 SCBJAP.34.t:0 "民政党的回归" 
 SCBJAP.34.d:0 "众议院选举结束后，立宪民政党在废墟中重组，町田忠治作为总裁，凭借其长期积累的组织管控能力，迅速稳住了党内的纪律。然而，这次复辟并非一帆风顺。在动荡的中间内阁时期，町田所坚持的“党务中心主义”由于过于专制，导致了不少中坚力量的流失。\n永井柳太郎的名字开始在党内会议中频繁被提及。作为在中间内阁中担任过要职的人物，他在政坛的活跃度和处理行政危机的实务经验，使他迅速聚集了一批不满于町田体制的“反主流派”。现在，党内的空气变得剑拔弩张：一边是致力于恢复传统若槻派统治的町田忠治，一边是试图以“实务改革”为由冲击总裁宝座的永井柳太郎。这场党内权力斗争，直接决定了民政党能否以统一的姿态，去应对接下来严峻的组阁压力。"
 SCBJAP.34.a:0 "大命最终下达给町田忠治"
 SCBJAP.34.b:0 "大命最终下达给永井柳太郎"
 SCBJAP.35.t:0 "宪政革新联盟"
 SCBJAP.35.d:0 "随着政友会与民政党陷入长期内耗，议会内的力量格局发生了微妙的位移。此时，以安达谦藏领导的国民同盟与床次竹二郎留下的昭和会所构成的“宪政革新联盟”，成为了各方势力无法绕开的中间地带。尽管床次竹二郎的离世让昭和会陷入了群龙无首的状态，但安达谦藏凭借其对政治风向的敏锐嗅觉，成功实现了对联盟的主导。\n伊泽多喜男在幕后对此保持着审慎的态度。他与安达谦藏在民政党共事期间积累的政治积怨虽深，但在当前肃杀的政治气压下，安达那种务实的“妥协式革新”反而成了一张可用的牌。宫中的大命走向正变得扑朔迷离，是在安达本人身上押注，还是推举昭和会内资历深厚、代表旧政友会势力的山崎达之辅来承接大命，成了重臣会议桌上最新的难题。无论如何，这个由“叛离者”组成的联盟，已具备了搅动帝国政局的实力。" 
 SCBJAP.35.a:0 "大命最终下达给安达谦藏"
 SCBJAP.35.b:0 "大命最终下达给山崎达之辅"
 SCBJAP.36.t:0 "革新俱乐部？自由党？明正会？宇垣党？" 
 SCBJAP.36.d:0 "随着政坛震荡的延续，伊泽多喜男将视线转向了那些长期徘徊在主流党派边缘的政治势力。由鹤见佑辅创立、后经宇垣一成大将经营、又吸纳了武藤山治国民同志会资源的“明正同志会”，虽在宇垣退阵后已渐趋凋零，但其残留的政治资产依然存在。特别是尾崎行雄的参与，赋予了该团体不可替代的象征意义。\n在当前动荡且充满贪腐指控的氛围下，伊泽意识到，如果不能在选前建立起一个能够对抗政治冷感的道德旗帜，民政党在即将到来的议会重组中将极为被动。伊泽在多次非正式接触中，提出了让尾崎行雄及其同僚以“选举肃正”为纲领出马，并以此作为与民政党组建联合内阁的筹码。对于民政党而言，这意味着需要借用这一自由主义色彩浓厚的团体来洗清前期的政治负债；而对于尾崎一派，这也是回归核心决策圈的唯一渠道。"  
 SCBJAP.36.a:0 "大命最终下达给尾崎行雄"
 SCBJAP.36.b:0 "大命最终下达给武藤山治"
 SCBJAP.37.t:0 "昭和维新的血阳"
 SCBJAP.37.d:0 "东京的黎明并非由霞光唤醒，而是被硝烟、血腥与一种扭曲的狂热浸透。首相官邸废墟之上，一面沾满泥污与暗红痕迹的巨大太阳旗被十几双激动颤抖的手奋力升起，在弥漫着焦糊味的晨风中猎猎作响。旗下，昨夜还被视为叛军的青年军官们——野中四郎、安藤辉三、香田清贞——此刻眼中燃烧着疲惫却亢奋至极的光芒，他们布满硝烟污渍的军服上缠着的“尊皇讨奸”白布，成了胜利者的勋章。在他们周围，是同样狂热的大日本生产党浪人、爱乡塾壮汉，以及少数面孔陌生却充满草莽戾气的武装分子。枪炮声并未完全平息，零星的抵抗仍在城市某些角落响起，但大局已定。\n广播里，不再是昨夜混乱的宣言，而是一个被刻意拔高、带着金属铿锵声的男音，通过被彻底控制的NHK电台向整个帝国播报：\n“全日本国民！黎明已至！昭和维新的圣战，在忠勇义士的奋起下，已涤荡帝都污秽！蒙尘之国体重光！奸佞朽木已被天诛！一切旧秩序、旧制度，凡阻碍天皇陛下亲政、妨害帝国八纮一宇之大业者，皆在此刻宣告终结！奉天皇陛下圣意，即日起成立‘维新政府’！军队即刻起统一接受义军指挥，忠于天皇者，皆为同志！违逆者，皆为国贼！”\n广播宣读了新政府的核心名单：以荒木贞夫为名义首脑，实权则由参与事件的激进少壮军官与民间右翼领袖共同把持。陆军省大楼成为了这个新生畸形政权的临时心脏，参谋本部则变成了清洗指令的传达中心。\n东京街头，不再是昨夜的无人空巷。被广播和激进分子强行驱赶出来的市民，瑟缩地站在路旁，脸上混杂着麻木、惊恐与难以置信。身穿各式非正规制服的武装人员趾高气扬地巡逻，墙上刷满了墨迹未干的标语：“昭和维新！天诛国贼！尊皇攘夷！皇宫方向一片死寂。高耸的宫墙外，布满了打着“保护天皇”旗号的新政府部队宫内省人员被严密控制，断绝一切未经许可的对外通讯。"
 SCBJAP.37.a:0 "“我们是天皇的忠诚卫士！我们是昭和维新的先锋！”"
 SCBJAP.38.t:0 "破碎的重聚"
 SCBJAP.38.d:0 "随着“维新政府”在东京陆军省正式挂牌，事态进入了最为危险的对峙期。皇道派青年军官团在荒木贞夫的旗号下虽然占领了中枢，但这种脆弱的军事占领很快遭到了外部力量的挑战。被拥立为“领袖”的荒木贞夫在极度的惶恐中，趁着混乱通过私人渠道逃出了东京，与正驻扎在关东的林铣十郎大将汇合。\n在关东的一处秘密指挥部内，面对东京发来的、带有明显强迫性质的“大命诏书”，林铣十郎并未选择妥协，东京的这场暴动已非任何单一派系所能控制。为了从激进少壮派手中夺回军队的法理控制权，林铣十郎决定打破“一夕会”分裂以来皇道派与统制派长期对立的人事枷锁。他开始通过特使紧急联络被下放至地方的永田铁山及东条英机，试图通过恢复军队内部的统一指挥体系，执行针对东京武装叛乱的收复作战。"
 SCBJAP.38.a:0 "以整肃军内纪律为前提，实施统一指挥……"
 SCBJAP.38.b:0 "宁可孤军奋战，亦不放弃皇道派的名义。" 
 SCBJAP.39.t:0 "复权-林铣十郎临时内阁"
 SCBJAP.39.d:0 "关东部队在林铣十郎的指挥下，以“清君侧”的名义迅速压制了东京周边的武装叛乱，随着激进少壮派的防线瓦解，东京局势重回军事管制的轨道。在重臣会议的默许与宫中的最终裁定下，林铣十郎正式受命组阁。为了在战后迅速稳定破碎的政局，林铣十郎并未独断专行，而是将永田铁山、东条英机等统制派核心纳入了内阁与省部的核心岗位，旨在通过这一“军部统一内阁”清理维新政府遗留的残余势力。林铣十郎深知，自己作为一名在派系斗争中摇摆的将领，其此次出阁不过是充当恢复秩序的过渡角色。他现在的首要任务是平息内部矛盾，并为后续的权力移交腾出空间。"
 SCBJAP.39.a:0 "敬候佳音。"
 SCBJAP.40.t:0 "武士刀的指向"
 SCBJAP.40.d:0 "首相官邸内，林铣十郎首相看向永田铁山军务局长。\n“铁山君，过渡内阁的使命即将完成。新人该接棒了。” 林直接问道，“你自己不考虑吗？”\n永田铁山坐姿笔挺，果断回答：“不。当前首相需直面各方压力，我的位置在军务系统内部维持协调，这更重要。”\n林铣十郎点点头，明白了他的意思，接着问：“那么，统制派中谁合适？”\n永田铁山沉默了片刻，显然在权衡。“这个位置，”他缓缓开口，“需要能力，也需要…各方一点认可。” 他抬眼，语气变得务实，“东条英机。此人…狡诈，但工作态度极其精细认真。军需、参谋业务他都烂熟于心，行事周密到苛求，关键时也能下决心。就能力而言，目前他是最合适的。”\n林铣十郎若有所思：“东条的勤勉确实无人质疑。但风暴过后，暗流涌动，是否还有其他力量需要平衡？”\n永田铁山点头：“池田纯久中佐他们的‘国防本义及其强化的提倡’小册子，在部分青年军官中有市场。里面鼓吹的‘国家总动员’、‘经济统制’和所谓的‘社会革新’，想法相当激进。有人把它看作新方向。”\n房间陷入短暂的安静。首相人选的问题悬在空中。"
 SCBJAP.40.a:0 "铁山君不必多辞，铣十郎辞相后，也会鼎力相助下任内阁。"
 SCBJAP.40.b:0 "那不妨，就看看“剃刀将军”能做到哪里。"
 SCBJAP.41.t:0 "关西的阴影与京都的旗号"
 SCBJAP.41.d:0 "由于荒木贞夫的失踪与关东林铣十郎部的不合作，东京的维新政府陷入了彻底的真空。陆军省内，大川周明所代表的右翼民粹派、追随北一辉思想的狂热改造分子，以及基层那些不知所措的少壮军官之间，因对权力分配与下一步行动的分歧爆发了激烈的派系倾轧，整座帝都弥漫着同室操戈的硝烟。\n就在东京陷入癫狂的内耗时，关西的局势发生了惊人异动。在统制派暗中的默许与资助下，大本教势力迅速崛起，他们以“镇抚叛逆、净化皇国”为口号，联合了老牌右翼组织玄洋社，组建了一支庞大的“勤皇武装”，开始向京都集结。\n这股力量不仅得到了地方保守派的支持，更隐隐透出要入京夺取“维新”名义、接管东京乱局的意图。"
 SCBJAP.41.a:0 "粉碎他们！"
 SCBJAP.41.b:0 "我才不信这帮神神叨叨的家伙会政变。" 
 SCBJAP.42.t:0 "昭和神圣会的入主"
 SCBJAP.42.d:0 "随着关西武装势如破竹地进抵东京外围，原本盘踞在陆军省的少壮军官团在双重夹击下土崩瓦解。大本教的“勤皇武装”与玄洋社的浪人主力顺利接管了帝都的防务，一个名为“昭和神圣会”的新政治实体迅速成形。\n然而，这一新政权的内部核心迅速出现了权力结构的分裂。一边是以内田良平为首的玄洋社旧部，他们渴望将权力导向传统的国家扩张主义与对满洲的控制；另一边则是深受出口王仁三郎影响的大本教核心圈，他们致力于推动一场以神权统治为核心的社会改造，主张彻底废除现有的政治腐败与官僚系统。"
 SCBJAP.42.a:0 "支持内田良平"
 SCBJAP.42.b:0 "支持圣师出口王仁三郎"
 SCBJAP.43.t:0 "皇道的终局：两位导师的交锋"
 SCBJAP.43.d:0 "当皇道派残部在绝境中勉力稳住东京的防线，并击退了关西神权势力的北上尝试后，维新政府并没有迎来预想中的统一。\n在“尊皇讨奸”的旗帜下，支撑这场运动的两大思想支柱——大川周明与北一辉，终于因国家改造的最终蓝图而彻底决裂。\n大川周明以“须佐之男”的再世自居，他将这一神话形象的暴力与破坏视为涤荡帝都秽物的必要手段，他麾下的农本主义者与日莲主义者极度鄙夷北一辉那种兜售焦虑的手段，认为那是招摇撞骗式的西方伪布道；而北一辉则视自己为再造日本的织田信长，他追求的是严密的国家统制与对既有体制的暴力重构，对大川那套混杂着神话色彩的农本论嗤之以鼻。陆军省大楼内，两派拥趸已成水火，空气中弥漫着宗教狂热与政治野心的混合恶臭。"
 SCBJAP.43.a:0 "支持大川周明的右翼们最终把西田税和北一辉关了起来"
 SCBJAP.43.b:0 "西田税抢先一步煽动，把大川周明关了起来"
 SCBJAP.43.c:0 "由于两派无法分出胜负，愤怒的军官们认为自己被骗了，直接接管了政权"
 SCBJAP.44.t:0 "锦旗革命：天皇政治的恢复"
 SCBJAP.44.d:0 "随着北一辉与西田税被清除出权力核心，东京的权力中枢彻底倒向了以大川周明为首的“爱国者共斗”阵线。这一刻，象征着对明治维新精神继承的“锦旗”在帝都各处飘扬，旨在通过“锦旗革命”彻底终结腐败的政党政治与财阀垄断，以对抗社会思潮中泛滥的“赤化”。大川周明内阁的成立，标志着帝国进入了由“天皇政治”直接覆盖的激进改造期。面对昭和恐慌引发的社会动荡与旧秩序的全面坍塌，新的内阁必须在反独占、反腐败的浪潮中，为帝国的未来选择一条确切的、能够统摄国民意志的政治纲领。"
 SCBJAP.44.a:0 "大川周明首相万岁！" 
 SCBJAP.44.b:0 "转向推行农本主义内阁"
 SCBJAP.44.c:0 "转向推行日莲主义内阁"
 SCBJAP.45.t:0 "大地的回归：农本主义内阁"
 SCBJAP.45.d:0 "随着农本主义内阁的正式确立，大川周明意识到仅凭口号无法平息昭和恐慌带来的社会饥渴。内阁开始向深耕乡土的草莽力量寻求执政合法性。以橘孝三郎为核心的‘爱乡塾’与‘皇国农民自治联盟’被赋予了全国农村重建的指导权，试图彻底废除寄生性的地主制。与此同时，为了寻找一种更具乌托邦色彩的社会组织形式，内阁甚至破天荒地请求武者小路实笃出山，试图将其曾经风靡全国的“新村运动”与国家意志相结合，以此作为重塑国民精神的实验室。然而，在这场大规模的农业重构中，赤尾敏等国家社会主义者却敏锐地嗅到了机会，他们极力推动“国家社会主义新村运动”，主张一种基于国民高度自发的、由下而上的国民社会主义，在追求建设高度国防国家的同时，打破既有大企业与官僚垄断、恢复国民对神圣信仰的崇拜。" 
 SCBJAP.45.a:0 "全面贯彻橘孝三郎的爱乡主义"
 SCBJAP.45.b:0 "采纳武者小路实笃的理想主义"
 SCBJAP.45.c:0 "采纳赤尾敏的国家社会主义方案"
 SCBJAP.46.t:0 "立正安国：日莲主义内阁"
 SCBJAP.46.d:0 "日莲主义内阁确立后，政府致力于通过宗教教义实现政教合一的体制转型。井上日召主导的教义解释将其民族主义倾向极端化，主张针对既有体制进行物理上的“除障”与肃清，这一派有广大的宗教支持，是主流所认可的。而另一派，则是田中家族所主导的、石原莞尔大佐支持的“养正会”，学者里见岸雄则发挥其理论优势，将马克思主义的唯物辩证法与田中智学的法华主义相结合，试图建立一套具有完整逻辑体系的“科学化国体论”，用以消解阶级斗争话语的合法性。当然，在政策边缘，也有一批奇怪的思潮，以江川樱堂及其“死之团”为代表的激进宗教团体，主张通过极端的“不惜身命”实践来对抗社会颓势。由于其主张不限于道德教化，而是包含了一系列针对社会异见者的暴力攻击与自毁式抗争……"
 SCBJAP.46.a:0 "支持井上日召"
 SCBJAP.46.b:0 "支持里见岸雄"
 SCBJAP.46.c:0 "支持江川樱堂？！"
 SCBJAP.47.t:0 "改造的权力天平"
 SCBJAP.47.d:0 "随着大川周明被软禁，“爱国者共斗”内部的权力结构彻底瓦解，东京的控制权归于北一辉与西田税之手。然而，在国家改造的终极蓝图上，两人陷入了深刻的分歧。北一辉基于其《日本改造法案大纲》，主张进一步剥离天皇在行政体系中的实质影响力，试图将天皇由“神格权威”转型为抽象的宪政象征，以扫清国家机器彻底公有化与统制的理论障碍；而西田税则坚决反对这一削弱皇权的操作，他认为在当下的社会危机中，必须紧握“天皇”这一最具号召力的政治合法性图腾，方能压制军内不满并维持社会的绝对服从。目前，两人正就谁出面担任台前领袖进行交涉……"
 SCBJAP.47.a:0 "支持北一辉"
 SCBJAP.47.b:0 "支持西田税"
 SCBJAP.48.t:0 "无序之舞"
 SCBJAP.48.d:0 "当北一辉与大川周明的理论争锋最终以双双出局告终，曾经被他们煽动起来的军官团赫然发现，维新的旗帜下已无导师。在东京一处密室俱乐部，混乱的争论声浪几乎掀翻屋顶。\n\n“野中君昨夜担当指挥，临危不乱，当为表率！他是陆军的人，由他出面，最能代表我等志士！”矶部浅一脖子上青筋毕露，猛地拍在桌面上。周围几个陆军尉官立刻振臂附和。\n\n“哼！”一名海军右翼军官冷笑着站起，“陆军？昨夜皇居前响彻的《昭和维新之歌》，那是三上卓中尉的作品！论感召国民，凝聚人心，谁能比得过三上中尉？海军也出了力！”话音未落，海军派系阵营便传出一阵喧嚣。\n\n野中四郎站在桌旁，脸色苍白，眼神中带着一种近乎漠然的疏离。他昨夜确实维持了秩序，但深知这滔天巨浪绝非自己能掌控。三上卓被推到人前，他看起来比任何人都疲惫，甚至有些恍惚，但听到自己的名字时，眼中闪过一丝狂热的光芒，随即又被深层的焦虑淹没。\n\n“哈哈哈！诸位！诸位！莫要争执！”桥本欣五郎挺着圆滚滚的肚子挤了进来，脸上挂着和事佬般的笑容，眼底却闪烁着精明的算计，“都是为陛下，为‘维新’大业！鄙人桥本，虽才疏学浅，但在军中和民间薄有虚名，愿为诸君分忧，担此重任！”\n\n房间内瞬间沉寂，随即迸发出更强烈的鄙夷与怒火。陆军军官眼中满是厌恶，海军军官们则皱起眉头。所有人都知道桥本的底细——志大才疏，夸夸其谈。但在陆海军互不相让的权力真空下，桥本这块搅动浑水的石头，却让局势变得彻底无可挽回……" 
 SCBJAP.48.a:0 "野中四郎"
 SCBJAP.48.b:0 "三上卓"
 SCBJAP.48.c:0 "桥本欣五郎" 
 SCBJAP.50.t:0 "霞关的接管"
 SCBJAP.50.d:0 "平沼官邸的硝烟散尽后，大命最终落到了一群穿着晨礼服、手里只有公文的人身上。\n\n次官会议在深夜召开，桌上摆着各省的人事表与未及处理的预算案。没有人发表就职演说，也没有人提起“维新”。他们只是把前一任遗留的卷宗重新分类，然后约定明天照常上班。\n\n窗外，戒严部队的卡车仍在不时驶过。而这座建筑里的人相信，只要行政机器还在运转，帝国就还没有结束。"
 SCBJAP.50.a:0 "以文官之手稳住国体。"
 SCBJAP.51.t:0 "戒严布告"
 SCBJAP.51.d:0 "告示贴满了东京的电线杆与砖墙：集会禁止、灯火管制、军法优先。\n\n军部推荐的首班人选摆在重臣会议桌上。无论最终由谁组阁，从这一天起，内阁的答复都要先经过陆军省的印章。\n\n一名老官僚把布告读了两遍，低声说：“这不是法律，这是天气。”"
 SCBJAP.51.a:0 "戒严令即最高法律。"
 SCBJAP.52.t:0 "一党的诞生"
 SCBJAP.52.d:0 "旧党阀的代表们被请进同一间会议室。桌上摆着合并方案，也摆着各自的政治生命。\n\n有人当场签字，有人要求保留名分，还有人把党旗折好放进怀里，什么也没说。会议结束时，一个新的名字被写进公报——从此他们只能以同一个声音发言。\n\n散会后下起了雨，议员们站在檐下等车，谁都没有再提议会的事。"
 SCBJAP.52.a:0 "从此只有一个声音。"
 SCBJAP.53.t:0 "数字的赌博"
 SCBJAP.53.d:0 "日本银行的报表上，军债承销的数字已经超过了去年全年的税收。\n\n企划院的年轻官僚把通胀预测推到首脑面前，得到的回答是：“只要战争胜利，整个亚洲的资源都是偿债的基石。”\n\n于是印钞机继续转动。有人提议适度刹车，被回以一句“战场不等财政”。窗外，米价又涨了。"
 SCBJAP.53.a:0 "战场不等财政。"
 SCBJAP.54.t:0 "总动员完成"
 SCBJAP.54.d:0 "动员表被钉满了整面墙壁：人力、粮食、钢铁、运力、乃至学术论文的方向。\n\n一名课长在深夜核对最后一栏，忽然发现自己已分不清这是国家的计划，还是国家的遗嘱。但他还是盖上了章，因为表格要求每一栏都要有人负责。\n\n第二天清晨，广播里宣布总动员体制正式完成。"
 SCBJAP.54.a:0 "每一栏都要有人负责。"
 SCBJAP.55.t:0 "皇道，亦需秩序"
 SCBJAP.55.d:0 "起事者们第一次坐在了需要签字的椅子上。\n\n摆在他们面前的是堆积如山的公文：恩赦、人事、米价、预算。三条路都通向同一个方向——把一场叛乱变成一套体制。\n\n真崎把钢笔转了两圈，最终问了一句：“哪一条能让米价降下来？”屋里没有人回答。"
 SCBJAP.55.a:0 "把一场叛乱变成一套体制。"
 SCBJAP.56.t:0 "幕府的开端"
 SCBJAP.56.d:0 "陆军省的走廊里，真崎的靴声比任何人都要响；而荒木的招牌，挂在了所有通电的最前面。\n\n这个既非内阁也非军政府的体制，被私下称作“幕府”。它靠默契运转：一个掌印，一个掌名。\n\n有参谋在日记里写道：“我们推翻了文官的独断，然后迎来了自己的独断。”"
 SCBJAP.56.a:0 "一个掌印，一个掌名。"
 SCBJAP.57.t:0 "竹枪的讲义"
 SCBJAP.57.d:0 "陆军省的讲堂里，讲师在黑板上画了一支竹枪和一輛坦克，然后用粉笔在两者之间重重划了一条等号。\n\n台下有军官欲言又止。讲师说：“诸君怀疑的不是竹枪，是自己的精神。”于是再无人提问。\n\n散场后，讲义被加印、下发，一路送到前线。"
 SCBJAP.57.a:0 "诸君怀疑的不是竹枪，是自己的精神。"
 SCBJAP.58.t:0 "十万万之敌"
 SCBJAP.58.d:0 "情报部门的报告摊在桌上：对面的人口是我们的十倍，钢产量是我们的数十倍。\n\n会议沉默良久，最后有人起身说：“数量无关紧要，因为我们有神国护持。”这句话被记进会议录，也被写进第二天的报纸头版。\n\n从此，算术题不再需要答案，只需要信念。"
 SCBJAP.58.a:0 "数量无关紧要，因为有神国护持。"
 SCBJAP.59.t:0 "至诚通天"
 SCBJAP.59.d:0 "古老的训诫被印在最后一期动员手册的扉页：至诚可以穿石，正如箭也曾穿石。\n\n雪仍在下，动员表上的每一栏都已填满。有人问接下来怎么办，得到的回答是把这句话再读一遍。\n\n帝国把理智交给了意志，把算术交给了信仰。箭，也许真的会穿石——只是没有人计算过，那需要多少支箭。"
 SCBJAP.59.a:0 "至诚通天，箭可穿石。"
