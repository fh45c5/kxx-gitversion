 ACW_foreign_volunteer_decisions_desc:0 "随着美国内战愈演愈烈，整个美国都被战争的烈火所肆虐，向那些对我们友好的，与我们有着同一或者相似的意识形态的内战派系提供他们所需要的军事装备和兵力可能会是一笔不错的战争投资。"
 ACW_support_csa_dec:0 "支持联合工团"
 ACW_support_csa_dec_desc:0 "我们理当声援美国的兄弟姐妹们奋起挣脱枷锁。"
 ACW_support_usa_dec:0 "支持美利坚合众国"
 ACW_support_usa_dec_desc:0 "我们应该支持美国联邦政府，协助其对抗工团分子与叛徒。"
 ACW_support_aus_dec:0 "支持美利坚联盟国"
 ACW_support_aus_dec_desc:0 "我们应该支持休伊·朗与美利坚联盟国，协助其战胜腐败的联邦政府与工团暴徒。"
 ACW_support_psa_dec:0 "支持美利坚太平洋国"
 ACW_support_psa_dec_desc:0 "唯有太平洋诸州代表着美国真正的合法政权，我们应该支持他们，协助其抵抗暴政的威胁。"
 ACW_civil_war_decisions:0 "内战"
 ACW_civil_war_decisions_desc:0 "第二次美国内战爆发，为了美国的未来，我们必须夺得胜利。"
 ACW_move_quickly:0 "我们必须快速行动"
 ACW_move_quickly_desc:0 "联邦政府控制的领土比我们多，所以对于一些人来说，我们的任务从一开始就已经注定了。既然我们已经拿起了武器，就要赶快建功立业，要不惜一切代价进攻联邦领土的腹地，以免他们缓过来以后夜长梦多。"
 ACW_break_ceasefire:0 "打破停火协议"
 ACW_break_ceasefire_desc:0 "我们准备的够久了，是时候攻打[From.GetNameDef]来一劳永逸地结束这场内战了。"
 ACW_ceasefire_six_months:0 "停火协议需期满六个月\n"
 ACW_ceasefire_one_month:0 "停火协议需期满一个月\n"
 CAL_deal_with_devil:0 "与魔鬼的交易"
 CAL_deal_with_devil_desc:0 "我们正在输掉内战……这无可置疑。我们唯一的希望就是与[From.GetNameDef]达成临时停火，这样双方就能联合起来对付彼此真正的敌人。我们最初的提案是休战九十天，但若双方都能达成共识的话，停战期完全可以更长。"
 TEX_deal_with_devil:0 "与魔鬼的交易"
