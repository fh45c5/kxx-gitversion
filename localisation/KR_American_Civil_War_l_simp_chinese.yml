 amcivwar.3007.c:0 "起义军必须任命社会主义政府"
 amcivwar.4015.d:0 "联合工团国内的政治辩论终于取得了一些进展，辩论似乎以激进的工团主义者占优告终。因此，我们的顾问指出，最为敌视互不侵犯条约的派系已然占了上风，一旦我们作为盟友的价值不再，条约很可能被立刻撕毁。"
 amcivwar.3601.c:0 "给卡彭送信"
 amcivwar.3611.t:0 "卡彭扬了代表大会"
 amcivwar.3611.d:0 "海伍德总统派遣暴徒去对抗世界产业工人联盟的决定被证明是一个严重的错误。卡彭没有摧毁抗议工会，而是设法将他们团结在了自己的身边，随着局势恶化，他利用自己的影响力并以自己的方式将控制力渗透到了我方政府的每一个部门。今天，卡彭的权势达到了顶峰，因为他的黑手党和世界产业工人联盟的盟友袭击了大会，阿方索·卡彭向威廉·海伍德发出了正式要求，勒令他辞职并任命卡彭为总统，否则将面临可怕的后果。"
 amcivwar.3611.a:0 "噢我的天哪"
 amcivwar.34.t:0 "赤色女巫"
 amcivwar.34.d:0 "长期以来，性别平等一直是社会主义思想的重要组成部分，现在我们有更多的证据来表明它是有实效的！一个完全由女性飞行员组成的飞行中队因其对敌方领土的大胆袭击而在联合工团中声名远扬。她们的协同一致的攻击编队使她们能够轻而易举地击落实力更为强大的敌方空中力量。由弗洛伦丝·“潘乔”·巴恩斯领导的飞行中队被支持休伊·朗的反动分子戏称为“赤色女巫”，而她们自己似乎对这个新绰号感到非常自豪。"
 amcivwar.34.a:0 "死亡天降"
 amcivwar.153.t:0 "阿拉斯加的代理政府？"
 amcivwar.153.d:0 "阿拉斯加的领土现在在加拿大的控制之下，但是我们对该地区的控制松散，当地的抵抗也很强。为了解决这个问题，许多人建议设置代理政府，以便更好地管理阿拉斯加。通常认为领导该代理政府的人应该是乔治·皮尔克斯，他之前曾在阿拉斯加地区任职过。"
 amcivwar.153.a:0 "派遣皮尔克斯"
 amcivwar.153.b:0 "保留阿拉斯加"
 amcivwar.2041.t:0 "瓜分西部军指挥中心"
 amcivwar.2041.a:0 "和平回到了我们身边……暂时的"
 amcivwar.2042.t:0 "绝不停火"
 amcivwar.2042.d:0 "或许人们给了和谈过高的期望。双方在丹佛的谈判没有达成任何实质性协议便破裂了，停火的希望就此终结，战争仍在继续。"
 amcivwar.2042.a:0 "到此为止吧"
 amcivwar.2043.t:0 "战火重燃"
 amcivwar.2043.d:0 "或许人们给了和谈过高的期望。双方在丹佛的谈判没有达成任何实质性协议便破裂了，停火的希望就此终结，战争仍在继续。"
 amcivwar.2043.a:0 "到此为止吧"
 amcivwar.2041.d.aus:0 "在丹佛的谈判已经结束，停火正在进行。我们的军队已经撤回到新边界的东部。这种情况会持续多久还有待观察。"
 amcivwar.2041.d.psa:0 "在丹佛的谈判已经结束，停火正在进行。我们的军队已经撤回到新边界的西部。这种情况会持续多久还有待观察。"
 amcivwar.2041.d.other:0 "在丹佛的谈判已经结束，停火正在进行。两边各自把军队撤回到了新边界之后。这种情况会持续多久还有待观察。"
 ACW_in_progress_tooltip:0 "为美利坚而战"
 ACW_in_progress:0 "为美利坚而战"
 amcivwar.3004.d.TEX:0 "我们刚收到来自朗派军队的要求，他们要求我们放下武器并并入忠于美利坚联盟国的武装力量中。这份要求还声明，如果我们不在接下来几天内服从他们的指挥官，他们会将我们视作敌人并对我们的地盘发起全面进攻。大多数人将此视作对我们起义军的威胁，并警告联盟国政府内的许多人与吉姆·克劳和旧民主党有着联系，他们可能只是想恢复美国内战之前的现状，甚至更糟。然而，包括查尔斯·扬将军和他的军队在内的一些实用主义者反驳称接受这份要求会挽救数以千计人的性命，并且我们可以利用这个机会在联盟国政府内建立一个有利于我方利益的权力集团。"
 amcivwar.3004.d.CAL:0 "我们刚收到来自太平洋国军队的要求，他们要求我们放下武器并并入忠于太平洋国政府的武装力量中。这份要求还声明，如果我们不在接下来几天内服从他们的指挥官，他们会将我们视作敌人并对我们的地盘发起全面进攻。大多数人将此视作对我们起义军的威胁，并警告我们可能此举只是在恢复内战前的现状，而他们也不会在其政府中维护我方的利益。然而，一些实用主义者反驳称接受这份要求会挽救数以千计人的性命，太平洋国政府忠于民主和自由，我们可以利用这个机会在其政府内建立一个有利于我方利益的权力集团。"
 amcivwar.5001.d.CSAPSA:0 "太平洋国要求我们下台，他们声称内战的爆发我们是负有部分责任的，并且我们的政权只是临时政府而已。他们声称如果我们投降，将大赦我方要员，但这显然意味着美利坚真正社会主义之终结，而这是我们所不能接受的。随着强硬派的猜想获得证实，他们已经开始呼吁对太平洋国全面开战以解决这烂摊子，且大会和军方也不再抵制这样的呼吁。"
 amcivwar.5001.d.CORPSA:0 "太平洋国要求我们下台，他们声称内战的爆发我们是负有部分责任的，并且我们的政权只是临时政府而已。他们声称如果我们投降，将大赦我方要员，但这显然意味着美利坚传统之终结，而这是我们所不能接受的。随着强硬派的猜想获得证实，他们已经开始呼吁对太平洋国全面开战以解决这烂摊子，且国会和军方也不再抵制这样的呼吁。"
 amcivwar.5002.d.CORPSA:0 "太平洋国刚刚提出，考虑到我们在内战之中是盟友，而且宪政国或多或少也亲民主，他们愿意抛开对民粹主义者拉塞尔的个人保留意见，提出举行全民公投，决定最终由谁掌控新国家，而无论赢家是谁，另一方都将成为国家政府的主要合作伙伴。同样，由于只有少数最高法院法官仍然健在和可信，胜利的一方无疑能掌控最高法院，这也允许我们根据全民投票结果，通过非正式的比例代表制来决定占领地区的划分。部分旧民主党人认为，这是西海岸银行界试图控制我们的手段，他们呼吁我们反过来要求接管整个美国，否则就是无谓地向他们投降。"
 amcivwar.1018.c:0 "祝福小理查德·拉塞尔"
 amcivwar.1021.t:0 "理查德·拉塞尔的要求"
 amcivwar.1021.d:0 "理查德·拉塞尔收到了我们的提议，同意接受宪法约束，但他要求统一后马上举行选举，希望能利用流窜在我们领土上的三K党的支持。并且他还呼吁太平洋国领导层宣布，拉塞尔正竭尽所能拯救美国民主，希望能允许他开展征募活动。看起来就算是在战争时期，拉塞尔也没有放弃那些政治把戏。"
 amcivwar.1021.a:0 "仍然接受"
 amcivwar.1021.b:0 "去他的，撤回提议"
 amcivwar.1022.t:0 "西部接受了"
 amcivwar.1022.d:0 "不论那些反对者怎么说，我们都与太平洋国达成了联盟。如此一来，我们便可以合作消灭布拉德利和艾森豪威尔所谓的“西部军指挥中心”以及休伊·朗的联盟国了，解放的部队可以用于东部战事。"
 amcivwar.1022.a:0 "我太牛逼啦！"
 amcivwar.1023.t:0 "太平洋国谴责我们！"
 amcivwar.1023.d:0 "我们就应该预料到，西部的寡头和官僚，谴责了我们帮助民众的尝试，即便我们索要的是那么的少。他们管拉塞尔叫“机会主义者”，他们希望所有美国人都向他们屈服，自大地拒绝承认我们的合法政府，要求我们立刻交出所有部队的指挥权。"
 amcivwar.1023.a:0 "金融寡头看来是要抵抗到底了"
 amcivwar.1024.t:0 "拉塞尔同意了"
 amcivwar.1024.d:0 "拉塞尔接受了我们的提议，现在我们共同组建了一个委员会来监督与开展全民公投。绝大部分公民都热切期盼内战的结束，虽然一些强硬派对此有些不高兴。"
 amcivwar.1024.a:0 "好"
 amcivwar.1025.t:0 "投票开始"
 amcivwar.1025.d:0 "全国公投已经开始，所有参选党派都充分利用他们的竞选技巧和政治机器，要么试图把自己吹捧为恢复稳定，维护自由和正义的守护者，要么就声称要制定全新的美国路线，以确保另一场内战和战前的社会不公不会再发生。"
 amcivwar.1025.a:0 "我们最好能赢"
 amcivwar.1026.t:0 "结果出炉！"
 amcivwar.1026.d:0 "决定联邦政府领袖的公投结果终于出来了，各个政权暂时搁置了他们的正统性决定接受公投的结果。最终的胜利者是："
 amcivwar.1026.a:0 "美利坚太平洋国"
 amcivwar.1026.b:0 "美利坚宪政国"
 amcivwar.1027.t:0 "最终对决！"
 amcivwar.1027.d.CORPSA:0 "美利坚宪政国和美利坚太平洋国是内战仅存的两个主要势力，而两者都遵守了各自的停火条约内容。现在的问题是在双方都认为他们各自是美国的合法政府的情况下使美国重归统一。我们的外交官已经向宪政国发送了一份请求进行全国公投的条约，以在双方都在宪法允许的条件下解决这个问题。公投将会由一个投票监察委员会进行监督，防止外部干预，且输掉那方也会得到比战前美国的状况下更多的自治权，以让当地能充分遵照自己的意愿进行活动。由于国会在新近被占领的地区只是空壳，所以公投将采用比例代表制来决定这些地区被任命者的数量，从而使获胜的一方有机会实施他们的议程。另一方面，诸如德威特将军和民主党领导人查尔斯·马丁等人认为拉塞尔不过是一个蛊惑人心的政客罢了，给予他在内战之灾后参选进而成为总统的机会是很不道德的行为，遑论这场灾难默里和拉塞尔都有一部分责任，综上所述，他们更想要我们要求拉塞尔政权直接滚下台。"
 amcivwar.1027.a:0 "发送提议"
 amcivwar.1027.b:0 "拉塞尔的民兵必须让步"
 amcivwar.1313.t:0 "棒球季赛被取消"
 amcivwar.1313.d:0 "美国职业棒球大联盟执行长堪尼索·芒汀·兰蒂斯宣布，棒球联赛将立即中断，对美国人来说，这是悲伤的一天。但这一举动并不令人意外，各州之间的对峙使得跨城市旅行几乎变得不可能，各个球队原本就只能在友好且接壤的州范围内比赛。由于这场对峙似乎没有和平的解决办法，甚至连这种权宜之计也行不通了，[GetYear]年世界大赛也被取消。看来，已经不再存在能让所有美国人团结起来的事情了。"
 amcivwar.1313.a:0 "要是没了国家，自然就没有全国性娱乐了……"
 ACW_support_car:0 "支持民族主义政府"
 amcivwar.663.t:0 "暴徒垮台"
 amcivwar.663.d:0 "我们最近在调查和逮捕罪犯方面的投入已经取得了成果。正式组织起来的暴徒团队已经崩溃，重新成为小规模行动或独立的罪犯团伙，不再对社会造成重大危害。"
 amcivwar.663.a:0 "感谢上帝！"
 amcivwar.36002.a:0 "噗噗噗"
 amcivwar.1641.t:0 "[From.GetNameDefCap]要求作出领土让步"
 amcivwar.1641.d:0 "[From.GetAdjective]政府已经派出了大使，声称他们已经占据了整个加拿大，希望我们能从中得到教训。停战协议可以即刻签署，但我们必须交出英属哥伦比亚和温哥华岛。"
 amcivwar.1641.a:0 "好，让我们结束这一切吧"
 amcivwar.1641.b:0 "不，我们还有希望赢得这场战争！"
 amcivwar.163.e:0 "我们打算给他们个教训！"
 amcivwar.1642.t:0 "[From.GetNameDefCap]索要新英格兰"
 amcivwar.1642.d:0 "[From.GetAdjective]政府已经派出了大使，声称他们已经占据了整个加拿大，希望我们能从中得到教训。停战协议可以即刻签署，但我们必须交出新英格兰。"
 amcivwar.1642.a:0 "好，让我们结束这一切吧"
 amcivwar.1642.b:0 "不，我们还有希望赢得这场战争！"
 amcivwar.4022.t:0 "朗同意了！"
 amcivwar.4022.d:0 "朗已经接受了我们提出的互不侵犯条约，我们现在要联合我们的力量对抗四面八方的反动势力！"
 amcivwar.4022.a:0 "非常好！"
 amcivwar.1864.t:0 "美国西南的命运"
 amcivwar.1864.d:0 "为了方便玩具游玩亚利桑那和纳瓦霍，我们特意添加了此调试事件。原本你要是想要玩到亚利桑那和纳瓦霍，你得先扮演墨西哥，在美国内战期间收复故土，再故意触发盎格鲁叛乱，然后扮演亚利桑那再故意触发纳瓦霍叛乱，但这样会浪费很多时间，而且还指不定会发生什么小概率随机事件。不过用这种方式生成的亚利桑那和纳瓦霍跟正常情况下别无二致，而且我们也没有改变其内容来适应前期的游戏环境。请注意，如果你使用这个了事件来生成亚利桑那和纳瓦霍，可能会导致不可预知的游戏错误！"
 amcivwar.1864.a:0 "我还是正常游戏吧"
 amcivwar.1864.b:0 "触发纳瓦霍-亚利桑那内战，并扮演纳瓦霍继续游戏"
 amcivwar.1864.c:0 "触发纳瓦霍-亚利桑那内战，并扮演亚利桑那继续游戏"
 amcivwar.1864.e:0 "触发纳瓦霍-亚利桑那内战，但不扮演任何一方"
 amcivwar.1864.f:0 "直接生成并扮演亚利桑那继续游戏，且不会自动触发纳瓦霍叛乱"
 amcivwar.1864.g:0 "直接生成亚利桑那，让他们自行其是"
 CLOSED_BORDERS:0 "关闭边界"
 amcivwar.2.deadlock.d:0 "默里的南方各州和海伍德的钢带全都自封为美利坚正统政府，直接与华府的麦克阿瑟分庭抗礼，而如今，休伊·朗也加入了战局。本来还寄希望于国会中的其他人能选自己为总统的朗在看清了这一痴心妄想后，向一分钟人和整个美国发出号召，呼吁所有人起来为真正的美利坚精神而战。朗带着他一贯的民粹腔调，怒斥麦克阿瑟想在现代当恺撒，痛批默里篡位夺权、暴虐无道，要求两家交出权力，重新召集国会，选出总统。有意思的是，对于海伍德和社会党，朗由于不想惹到至上党内的左翼而只是一句话带过，称其为误入歧途的蠢货。与默里、麦克阿瑟，甚至海伍德不同，朗并没有僭越自称总统，而是采用了“代总统”这一头衔，以此表明自己绝无二心，唯一目的就是恢复国会、重开大选，不过他的手下还是称呼他为朗总统。许多南方和中西部州的州长早已在国会内形成了以朗为中心的民粹进步联盟并一直等待着机会扩大农场主们的权力，而现在他们已经全部集结在了朗的周围。"
 is_acw_tag:0 "属于美国内战中的主要政权"
 is_acw_minor:0 "属于美国内战中的分离政权"
 acw_minor_claimed_america:0 "一分离政权已宣布接过正统美利坚的衣钵"
 ACW_declare_on_minor:0 "未竟之事"
 ACW_declare_on_minor_desc:0 "自内战伊始就持旁观态度的[From.GetNameDef]如今却妄自尊大，擅称天命。是该给这些僭越者一点颜色看看、为这场美利坚正主之争画上休止符了。"
 BBR_claimed_america:0 "已宣布接过正统美利坚的衣钵"
 TXS_claimed_america:0 "已宣布接过正统美利坚的衣钵"
 amcivwar.151.c:0 "为阿拉斯加政府和太平洋国安排一场会面！"
 amcivwar.10000.t:0 "垂直起降技术的发展"
 amcivwar.10000.d:0 "利用与国内企业和军事承包商的经济纽带，我们成功为美国及其盟友的军队开发出了实验性“直升机”原型。这些名为普拉特-勒佩奇XR-1的独特飞行器能够进行垂直起降，非常适合在各种崎岖的地形中使用。尽管这些飞行器造价高昂又不耐用，但我们已经给主要盟友送去了几架原型机，以便让我军和友军都能够使用这种独特的技术。此外，我们不断壮大的机队还使用了旋翼机、飞行越野车等由优秀的科学家和我们的盟友所设计的新型运输工具，如今，我们已可以轻松地在整个新大陆准时准点地运送我们的民众、军队和物资，同时如有命令还可以投递毁灭性的炸弹。只是要当心，别把它们弄坏了，因为我们仅有的这几架脆弱的飞机“喜怒无常”，且难以替换。"
 amcivwar.10000.a:0 "更高，更远！"
 amcivwar.10001.t:0 "来自美国的实验技术"
 amcivwar.10001.d:0 "为了检验最新取得的技术突破，美国人慷慨地将一些新军事装备送到了美国势力范围内的边缘前线进行测试。普拉特-勒佩奇XR-1是这批新产品的大头，它们能够实现垂直起降，也因此被最初的设计师称为“直升机”。直升机设计之初的目的是快速运送物资和贵重货物进出崎岖地形，不过后来其中一些加装了武器，当作拥有兼领侦察、补给职责的轻型空中武装炮艇和轰炸机使用。这些新型直升机看起来与其说是战争机器，倒更像是达·芬奇的手稿中冒出来的东西。我们将对这些直升机和美国人送来的其他技术进行彻底的检验，以对抗我们联盟的各种敌人。"
 amcivwar.10001.a:0 "我们一定会好好利用的"
 ACW_ilegitimate_government:0 "非法政府"
 ACW_ilegitimate_government_desc:0 "美国人民拒绝承认我们是他们的合法政府，但我们仍会战斗下去。即使很可能，我们没法在重归一统的美国的威势面前坚持多久。"
 ACW_legitimate_government:0 "合法政府"
 ACW_legitimate_government_desc:0 "美国人民已经发出了自己的声音，那声音就是宣布我们才是美利坚的合法政府！"
 ACW_USA_COR_ceasefire:0 "合众国-宪政国停火"
 CAR_USA_TREATY:0 "合众国已与宪政国达成了临时停火协议。"
 amcivwar.315.t:0 "机械化装甲战争方面的实验终于有了回报"
 amcivwar.315.d:0 "世界大战刚结束的那几年，出于对这种规模的欧陆战争可能会触及自家海岸的担忧，美国一直在悄咪咪地鼓捣自己的军火库，而当初实验性工作的大头便是实战用机械化装甲载具的设计、生产和应用。那段时期诞生了数不尽的设计和想法，既有M1克里斯蒂坦克及其远销海外的悬挂装置等早期的军用方案，也有像阿尔·卡彭那辆著名的铁甲凯迪拉克（这可是美国制造的第一辆货真价实的装甲车）这样的民用产品，而包括以油电混合非公用装甲公交车充当临时的运兵车和武装平台的实验在内的众多项目，都隶属于德怀特·F·戴维斯在担任战争部长时拟定的实验性机械化部队计划。戴维斯从前做过参议员和菲律宾总督，是国际网球赛事戴维斯杯的创始人，他以世界大战及随后吞噬英法等国的革命为例，劝诫美国全力推动军事研发，为以后的战争早做准备。在战争的阴云已逼近美国海岸的今日，我们不得不佩服戴维斯的远见。混乱持续扩大，海内外的战争皆已避无可避，是时候去让那些老旧仓库中的实验性军用设备重见天日，在接下来的战斗里助我们一臂之力了。"
 amcivwar.315.a:0 "实验性机械化旅，前进！"
 AMERICA_american_imperialism:0 "美利坚帝国主义"
 AMERICA_american_imperialism_desc:0 "有些人认为，美国只不过是一个毫无意志力可言的娘炮自由主义国家，根本没有加入文明世界的资格。这一认知显然大错特错。美国一直都是世界上最强大的国家，也许是时候向世界证明这一点了。"
 AMERICA_make_mexico_friendly:0 "向墨西哥的罪行施以复仇"
 AMERICA_make_mexico_friendly_desc:0 "几十年来，墨西哥这个无赖国家一刻也没有停止过对美国的侵犯。是时候向这个红色工团主义国家对我们无辜公民犯下的罪行复仇了。向蒙特祖玛进军！"
 AMERICA_banana_republics:0 "香蕉共和国"
 AMERICA_banana_republics_desc:0 "为进一步帮助我们的革命弟兄，我们勇敢的企业深入中美洲的丛林，协助他们开发中美洲的穷乡僻壤。我们必须对此予以全力支持，满足其一切需求。"
 AMERICA_demand_the_philippines:0 "菲律宾的归属"
 AMERICA_demand_the_philippines_desc:0 "菲律宾希望利用美国内部的混乱来争取独立，这一点毋庸置疑。然而混乱已经过去，我们必须为了双方的利益，把他们改造成美国的直属殖民地，从而确保他们不会在未来再有此种妄想。"
 AMERICA_vietnam_yesterday:0 "昨日越南"
 AMERICA_vietnam_yesterday_desc:0 "作为美国扩张的重要地点之一，越南的橡胶及其在远东的地理位置不容忽视。然而，这也使其成为了其他殖民主义国家的首要目标。如果德国仍在争夺这片领土，也许花钱购买来得更值。反之，越南就将成为我们的囊中之物。"
 AMERICA_stop_south_american_syndicalism: "遏制南方的工团主义"
 AMERICA_stop_south_american_syndicalism_desc:0 "多年来，智利一直是南美工团主义的中心。他们不断干涉其它国家，特别是阿根廷的事务，对我们半球的和平构成了威胁。我们必须赶在他们毁了整个美洲大陆之前阻止他们，也许将其收归于我们的直接掌控下会更好……"
 AMERICA_dismantle_the_empire:0 "碾碎温莎王朝"
 AMERICA_dismantle_the_empire_desc:0 "新世界秩序的开始往往伴随着旧秩序的崩溃。英国不断地想要如几个世纪前那样干涉我们的事务，把我们当作工具人——温莎王朝必须要学会尊重美国。加拿大将会感受到美国的强大，他们辽阔的土地将为我们所用，这就是君主制的终结和一个新西方强国的诞生。"
 AMERICA_claim_australasia:0 "平定澳大拉西亚"
 AMERICA_claim_australasia_desc:0 "英国君主政体虽已覆灭，但澳大拉西亚仍是一股不容忽视的力量。他们的海军威胁到了我们在远东地区的扩张，而且由于我们对该地区的垂涎人尽皆知，即便他们的政府对我们暂时没有直接的敌意，也是一副紧绷神经的谨慎样。如果我们想牢牢掌控这一地区，就必须平定澳大拉西亚。"
 AMERICA_new_moralism:0 "新道德主义"
 AMERICA_new_moralism_desc:0 "美国决不能与其他帝国同流合污，也决不能堕落为他们的一员。这种不道德的想法本身就是对美国传统的侮辱。我们应奉行和平思想，把军费用作国防。"
 AMERICA_support_eastern_allies:0 "稳定东方"
 AMERICA_support_eastern_allies_desc:0 "我们须支援东方诸盟友，将菲律宾纳入羽翼庇护之下。"
 AMERICA_new_interventionalism:0 "新干涉主义"
 AMERICA_new_interventionalism_desc:0 "美国将四处出击，以保障盟友的安全、打击极端主义与保卫民主。孤立主义已是过去式，把头埋在沙子里当鸵鸟的时代已经一去不复返了。"
 AMERICA_western_alliance:0 "协约国盟友"
 AMERICA_western_alliance_desc:0 "我们需要联合同为资本主义民主制度的兄弟——协约国，共同对抗威胁我们双方的极端分子和敌对帝国势力。如若我们能助其夺回家园，那么工团主义就将迎来末日，而他们也将成为我们的缓冲区。"
 AMERICA_the_city_on_a_hill:0 "山巅之城"
 AMERICA_the_city_on_a_hill_desc:0 "我们将进一步把军事和外交资金向工业，特别是汽车产业转移，满足美国民众的需求，从而成为一盏闪耀的进步明灯。"
 AMERICA_spirit_of_monroe:0 "门罗精神"
 AMERICA_spirit_of_monroe_desc:0 "南美洲的确是美国的后院，但我们也必须深切地认识到，我们是南美洲人民的保护者。为了保卫双方的安全，我们必须要保护其不受列强和其他形式暴政的侵害。"
 AMERICA_american_pacificism:0 "美利坚和平主义"
 AMERICA_new_interventionism:0 "新干涉主义"
 AMERICA_new_interventionism_desc:0 "如果我们还想守护民主的话，就不能再当鸵鸟了。协约国是我们在这个世界上唯一的自由主义朋友，我们必须帮助他们恢复其阳光下的地位。"
 AMERICA_anti_imperialism:0 "美利坚反帝主义"
 AMERICA_anti_imperialism_desc:0 "美国必须采取坚定的立场，反对当今世界最主要的暴政形式——帝国主义。只有那些和我们一样受到帝国主义威胁的国家，才是我们真正的朋友。"
 AMERICA_moral_support:0 "自决公约"
 AMERICA_moral_support_desc:0 "我们将发表支持独立权的宣言，并宣布我们将在全世界捍卫它。"
 AMERICA_league_of_anti_imperialism:0 "美利坚反帝国主义联盟"
 AMERICA_league_of_anti_imperialism_desc:0 "我们要将美利坚反帝国主义联盟的成员纳入政府，听取他们的意见，组建一个新的平等联盟，一个共同反对威胁我们的帝国主义列强的联盟。"
 AMERICA_warn_japan:0 "警告日本"
 AMERICA_warn_japan_desc:0 "日本对整个东亚乃至于我们在太平洋的后院都有所图谋，这是路人皆知的事实，我们理应警告他们不要再对我国潜在盟友有所图谋，并以此遏制他们。"
 AMERICA_embargo_japan:0 "对日禁运"
 AMERICA_embargo_japan_desc:0 "虽然我们之前已有过动作，但日本仍旧不值得信任，我们得通过禁运，特别是石油的禁运，来进一步削弱日本。"
 AMERICA_strike_japan:0 "进攻日本"
 AMERICA_strike_japan_desc:0 "是时候进攻我们在太平洋上最大的敌手——日本帝国了。我们将通过武力让其与我们利益一致，因为这是我们给东方宿敌的唯一选择。"
 AMERICA_phillipines_guarantee:0 "巩固盟约"
 AMERICA_phillipines_guarantee_desc:0 "我们需要加强与其它国家的合作，并投资军工、科研产业。"
 AMERICA_tokyo_talks:0 "东京会谈"
 AMERICA_tokyo_talks_desc:0 "对抗也许不是必经之路，派遣外交官出访日本、签署互不侵犯条约或许才是最符合双方利益的选择。"
 AMERICA_maf_investigation:0 "调查中央非洲"
 AMERICA_maf_investigation_desc:0 "很少有殖民地能像德国人控制的中央非洲这片黑暗大陆那样充斥着大量可疑的不法行为。我们会派遣一支小队前去调查，并在这一过程中明确我们的反帝立场。"
 AMERICA_patriotic_broadsides:0 "以爱国为名的声讨"
 AMERICA_patriotic_broadsides_desc:0 "人民应当铭记，质疑对国外事务的大肆干涉不仅不是不爱国的行为，反倒正是开国元勋们的希冀！公开支持帝国主义立场之人必将因爱国主义的抨击、批评而大失民望，我们亦可借此巩固自身。"
 AMERICA_defensive_navy:0 "防卫舰队"
 AMERICA_defensive_navy_desc:0 "强大的海军是防卫的基石，况且帝国主义列强只能从海上侵犯我国，因此，我们应加大海军投资，据帝国主义于国门之外。"
 AMERICA_support_anti_syndicalism:0 "反工团主义立场"
 AMERICA_support_anti_syndicalism_desc:0 "在近来的危机中，工团主义成为了我国的一大威胁。我们当然不支持帝国主义，但是也同工团主义国家没有任何共同语言可言。我们将采取坚定的反工团立场，警告工团主义国家不让妄想与我们作对。"
 AMERICA_sphere_of_influence:0 "势力范围"
 AMERICA_sphere_of_influence_desc:0 "在美洲构建起势力范围后，我们就可以通过各地的人脉来推动商务及科研合作，并在这一过程中进一步增进外交实力。"
 AMERICA_ally_new_mexico:0 "支持新墨西哥"
 AMERICA_ally_new_mexico_desc:0 "既然墨西哥已经建立了非社会主义政府，我们就应该尝试与其建立外交关系，并通过派遣大批外交官和商人对其予以支持。"
 AMERICA_atlantic_base:0 "大西洋前哨"
 AMERICA_atlantic_base_desc:0 "如果不能掌控大西洋，我们就无法占领欧洲。因此，我们将着手在大西洋建立起军事力量。冰岛是一个理想的落脚点，虽然他们是否会选择合作还有待观察，但这值得一试。"
 AMERICA_western_dominance:0 "新世界主宰"
 AMERICA_western_dominance_desc:0 "我们理应主宰新世界，为了实现这一目标，我们将着重建设军队。"
 AMERICA_look_east:0 "远东的潜力"
 AMERICA_look_east_desc:0 "东方的殖民地盛产廉价劳动力和橡胶，我们只需要规划好海军，拜将点兵，便可一举拿下。"
 AMERICA_hawaiian_launchpad:0 "夏威夷跳板"
 AMERICA_hawaiian_launchpad_desc:0 "夏威夷是美国海军在整个太平洋上开展军事行动的理想地点。只要控制了夏威夷，控制了这片海域，就再没有人能阻止我们在该地区的行动了。"
 AMERICA_ports_of_south_china:0 "华南港口"
 AMERICA_ports_of_south_china_desc:0 "华南港口带来的财富让英国享受了好一段时间的荣华富贵，而我们却只能从这块蛋糕上分得一小部分利益。今后我们将不再容忍，而是将整块蛋糕据为己有，进而大大加强对太平洋和亚洲的控制能力。"
 AMERICA_lend_lease:0 "协约国的租借"
 AMERICA_lend_lease_desc:0 "协约国急需我们的支援，而我们也会把自身生产的武器供给他们。"
 AMERICA_the_lion_and_the_eagle:0 "鹰狮齐行"
 AMERICA_the_lion_and_the_eagle_desc:0 "狮子与雄鹰如今正坚定地站在同一战线上，我们的经济内阁即将举行会议，讨论我们可以共同进行的军需品投资。"
 AMERICA_persian_influence:0 "波斯的影响力"
 AMERICA_persian_influence_desc:0 "波斯的地理位置和石油储备赋予了其巨大的潜力，而为了各方的安全，我们必须将它纳入协约国的控制。"
 AMERICA_meditarrian_ports:0 "地中海港口"
 AMERICA_meditarrian_ports_desc:0 "我们必须投资法兰西民族国的港口，这样他们才有希望从工团之敌手中夺回自己应有的国家。"
 AMERICA_bolster_dominion:0 "支援自治领"
 AMERICA_bolster_dominion_desc:0 "印度自治领的统治已经相当稳固，但他们仍缺乏工业和经验。这两处缺口将由我们来填补，以便他们捍卫那里的民主利益。"
 AMERICA_european_recovery_program:0 "欧洲复兴计划"
 AMERICA_european_recovery_program_desc:0 "欧洲虽已重回其正统政府之手，但战争与革命的阴影依旧笼罩其上。我们必须通过总参谋部和高级政治顾问共同制定的援助计划为盟友提供资金，协助其顺利开展重建工作。"
 AMERICA_push_further:0 "西方帝国"
 AMERICA_push_further_desc:0 "伊比利亚人曾经认为南美洲的丰富资源独属于他们自己，而如今这一诱人的珍馐于我们而言唾手可得！南美洲的资源是充实美国国力的必需品，而其地理位置又与美国的国家安全息息相关，因此，我们决不能让这里的各路激进分子站稳脚跟，也不能让其政府做大做强。美国的后花园必须要安全无虞。"
 AMERICA_take_panama:0 "美利坚的巴拿马"
 AMERICA_take_panama_desc:0 "巴拿马回到了美国手中，这次我们不会再重蹈覆辙了。除了在巴拿马进行投资，让这里真正成为美国的一部分外，我们还会派遣军队镇压反对派，最终让这里的美国人过上锦衣玉食的美好生活。"
 AMERICA_demand_greenland:0 "索取格陵兰"
 AMERICA_demand_greenland_desc:0 "丹麦这么一个蕞尔小国怎么能从我们手中占有这么多对我们来说利益攸关的重要领土？他们要么接受我们的领土要求，要么后果自负。"
 AMERICA_claim_the_east_indies:0 "声索印度尼西亚"
 AMERICA_claim_the_east_indies_desc:0 "印度尼西亚，亦即荷属东印度群岛，蕴藏着丰富的资源，是控制这一地域的必争之地，这里必须属于我们，而不是一个辉煌早已落幕的垂暮帝国。"
 AMERICA_giant_of_the_west:0 "西方的巨人"
 AMERICA_giant_of_the_west_desc:0 "我们以雷霆之势拿下了西方，现在只需重申余下的要求便可以了。"
 AMERICA_giant_of_the_east:0 "太平洋强国"
 AMERICA_giant_of_the_east_desc:0 "太平洋是我们的，而且只要通过必要的军事行动和经济合作让我们的盟友完全依附于我们，太平洋就将永远都是我们的。"
 AMERICA_national_rhetoric:0 "民族主义宣传"
 AMERICA_national_rhetoric_desc:0 "美国人民不能忘记我们民族与生俱来的优越性，谁也无法阻止我们向弱小国家扩张的步伐。我们应在国内着重宣扬帝国主义言论，让每一位公民都为国尽力。"
 AMERICA_strike_britain:0 "终结不列颠联盟"
 AMERICA_strike_britain_desc:0 "我们终于可以扼杀掉工团运动和不列颠联盟了。我们的老对头——英国人将真正臣服于我们脚下。"
 AMERICA_new_marine_corps:0 "新海军陆战队"
 AMERICA_new_marine_corps_desc:0 "为达到能够对全球各地展开入侵的目标，我们必须进一步扩大海军陆战队的规模并加大投资力度。以严苛训练淬就钢铁意志，令其成为播撒美国利益的尖兵。"
 AMERICA_reform_monroe_doctrine:0 "修正门罗主义"
 AMERICA_reform_monroe_doctrine_desc:0 "昔日的美利坚合众国在保卫世界民主政权免受工团与民粹主义侵扰的道路上，也曾有过踌躇。如今，美国国会与总统阁下决定重新审视其与欧洲及其它大陆国家的外交关系，毕竟，同一道散兵坑里可永远不会有中立派。"
 AMERICA_business_ties:0 "商业纽带"
 AMERICA_business_ties_desc:0 "三六年危机期间，大批洲际跨国企业选择逃离了美国。为恢复他们对美国经济的信任，国会计划向他们提供低息贷款、发行海外债券，与各大企业建立起新的合作关系。"
 AMERICA_pick_a_side:0 "抉择道路"
 AMERICA_pick_a_side_desc:0 "现在终于到我们决定自己在世界舞台上所处立场的时候了。我们是应该向联合王国的遗产卑躬屈膝，向协约国倾囊相助？还是应该与德国一同推动欧洲的团结？我们的国家在道路的抉择上仍存在着巨大分歧。"
 AMERICA_arsenal_of_freedom:0 "自由兵工厂"
 AMERICA_arsenal_of_freedom_desc:0 "国会已授权总统成立一个由商业利益和外交政策专家组成的委员会，以便为我们的新盟友提供最佳协助。只要运用得当，我们雄厚的工业实力几乎可以碾压一切国家，而只有真正的民主国家才配享有“自由兵工厂”带来的力量。"
 AMERICA_new_diplomatic_corps:0 "新外交使团"
 AMERICA_new_diplomatic_corps_desc:0 "内战期间被迫关停的无数使馆如今再度人满为患。我们有包括竞选捐助人、国会议员和军方官员在内的一长串名单可供填补外交使团的空缺。是时候该让世人重新认识美利坚了。"
 AMERICA_tech_sharing2:0 "科研合作"
 AMERICA_tech_sharing2_desc:0 "学术界向来不准通过私人渠道分享研究资料、接触海外机密项目，而既然我们决心整合全阵营的人力资源来对抗工团主义者，这道禁令也将就此废除。"
 AMERICA_color_war_plans:0 "虹色战争计划"
 AMERICA_color_war_plans_desc:0 "本应预料到的威胁没能做好防范，过时又不准的战争计划是三六年危机中那一套灾难性行动的一大祸首。我们必须制定一套全新的彩虹战争计划，让军方能够在冲突爆发前做好万全的准备。"
 AMERICA_joint_military_training:0 "联合军事训练"
 AMERICA_joint_military_training_desc:0 "美国国内一触即溃的和平秩序，使得军方只能将训练场地迁至国外，避免加深公众对独裁专制的恐惧。我国盟友已接受了这项提议，联合军事训练与演习计划正在积极策划中，看看我们能在新世界表现得如何吧！"
 AMERICA_economic_muscle:0 "美利坚向前进"
 AMERICA_economic_muscle_desc:0 "迄今为止，美国的对外军事行动一直靠的是压倒性的规模优势，以及部队的各行其是。不过，当下的新同盟关系要求的更多是合作与协调，因为我们的敌人一定会动用各种现代化武器来阻止我们。"
 AMERICA_united_together:0 "众志成城"
 AMERICA_united_together_desc:0 "美国民众对海外作战热情寥寥，维持中立的舆论始终占据着主流。我们必须软硬兼施，改变民众的想法，例如推动社会尊重退伍军人、以亲切的笔触描绘我国的海外盟友等。"
 AMERICA_the_american_century:0 "美利坚世纪"
 AMERICA_the_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 AMERICA_back_in_business:0 "再度出山"
 AMERICA_back_in_business_desc:0 "昔日饱经困厄，以致难展国际强国应有之姿，然则时移世易，今朝之美国已整装待发，重登世界舞台。"
 AMERICA_rebuild_monroe:0 "重申门罗主义"
 AMERICA_rebuild_monroe_desc:0 "欧洲与世界其它角落蔓延的危机，与我们有什么关系呢？美国属于新世界，我们要做的也是维护新世界的和平与繁荣。我等命中注定要成为北美的霸主、南美的守护者，以及任何胆敢与我方作对者的毕生噩梦。"
 AMERICA_diplomatic_corps:0 "美国外交使团"
 AMERICA_diplomatic_corps_desc:0 "迈向霸权的首要步骤，就是让我们未来的敌人与盟友确切地知道我们的想法。无论他们欢迎与否，都阻止不了我们的脚步。"
 AMERICA_rightful_domain:0 "国土不容侵犯"
 AMERICA_rightful_domain_desc:0 "北美大陆始终是我们的第一要务，美国绝不容许任何敌对国家在自己的边境上作祟，而她也会依凭武力从海陆两个方向护卫国土。"
 AMERICA_cooperaton_treaties:0 "合作条约"
 AMERICA_cooperaton_treaties_desc:0 "美洲国家联盟将聚合南北美诸友好中立国，美利坚于此既为保护者，亦为善导者。"
 AMERICA_propping_up_allies:0 "新美利坚帝国主义"
 AMERICA_propping_up_allies_desc:0 "美国人从来都不是帝国主义者，我们决不会不请自来，而只在必要之时、必要之地贯彻我们的意志，维护西方的秩序。这是为了所有人的利益。"
 AMERICA_pax_americana:0 "美式和平"
 AMERICA_pax_americana_desc:0 "美洲大陆的伟大斗争业已结束，新的集体意识正在稳步塑就。经济合作与社会秩序正在占据舆论主流，美利坚合众国的又一项雄心壮志即将成为现实。"
 AMERICA_enter_the_fray:0 "介入纷争"
 AMERICA_enter_the_fray_desc:0 "美国是世界舞台的一员。虽说我们对加入外国阵营一事心存芥蒂，但我们也会毫不犹豫地动用军事力量，消除世界各地那些终将找上门来的威胁。"
 AMERICA_arsenal_of_democracy:0 "民主兵工厂"
 AMERICA_arsenal_of_democracy_desc:0 "睦邻政策要求我们制定一项国内计划，为未来的冲突做好充分的武器准备。总统阁下所倡导的“民主兵工厂”由此应运而生，它将允许我们能够向南美洲最遥远的彼端输送战争物资，帮助其推翻暴政、打击工团主义。"
 AMERICA_longer_reach:0 "伸手向远方"
 AMERICA_longer_reach_desc:0 "如果我们希望将自己的力量投射到世界各地，那就必须拥有一支强劲的海军。"
 AMERICA_on_the_beach:0 "踏上滩涂"
 AMERICA_on_the_beach_desc:0 "我们的敌人终将会为美国士兵踏上其滩头时的雄姿而感到恐惧，为此，我们必须磨炼自身的能力，让其无愧于我们庞大的力量投射范围。"
 AMERICA_working_with_allies:0 "与盟友携手合作"
 AMERICA_working_with_allies_desc:0 "我们应该允许自己的盟国和“敌人的敌人”，自由运用我国的专业知识。假若他们的斗争可以更顺利些，我们离成功也能更进一步。"
 AMERICA_american_century:0 "美利坚世纪"
 AMERICA_american_century_desc:0 "为争取世界和平而进行的伟大意识形态斗争已经确立了美国工业和经济鹤立鸡群的雄厚力量。美国扮演着战胜暴政和工团主义的关键角色，如果我们战胜凯旋，美国也将成为维护世界和平不可或缺的力量。"
 AMERICA_fortress_america:0 "美利坚坚城"
 AMERICA_fortress_america_desc:0 "美国方才刚在地狱里走了一遭，现在还没精力参与外部的纷争。眼下必须放眼祖国各地，维护国内秩序，做好在敌国来袭时守卫边境高墙的准备。"
 AMERICA_man_the_walls:0 "高墙就位"
 AMERICA_man_the_walls_desc:0 "国防首务，当固边疆高墙。寰宇当畏美利坚之武威，然此慑止于自卫之境。"
 AMERICA_business_of_neutrality:0 "中立政策"
 AMERICA_business_of_neutrality_desc:0 "维持中立政策的好处就是敌人少、贸易伙伴多。假若美国有意成为真正的世界强国，就必须依靠强劲的美元。"
 AMERICA_look_inward:0 "放眼国内"
 AMERICA_look_inward_desc:0 "美国再也无需顾虑动荡与内战的威胁。眼下必须放眼国内，处理必要的内政问题，而非紧盯着那些不属于美国人的地方。"
 AMERICA_leap_forward:0 "美利坚的跃进"
 AMERICA_leap_forward_desc:0 "成果既已巩固，前进方向亦已明确，美国可以团结一致、遥遥领先于世界迈入下一纪元了。"
 AMERICA_peace_at_last:0 "终归和平"
 AMERICA_peace_at_last_desc:0 "我们的努力终见成效，美国也明白过来，真正的和平唯有通过实力与牺牲。"
