 amcivwar.4.t:0 "美利坚陷入紧张对峙"
 amcivwar.4.d:0 "紧张局势降临美国，民选总统海伍德在被道格拉斯·麦克阿瑟将军强行撤职后逃往芝加哥，但在麦克阿瑟宣布胜利的时候，旧民主党人也举起了反旗。在芝加哥，海伍德的支持者已经宣布麦克阿瑟政府非法，而休伊·朗在新奥尔良的民粹主义支持者和西部地区的太平洋国国会也否认麦克阿瑟的合法性。对此，麦克阿瑟将军给了他们30天的最后期限，要么停止叛乱行为，要么等待联邦政府的逮捕和处决。然而考虑到对峙各方都在紧张而迅速地提升自己的军备实力，几乎没有什么可以避免美国步入第二场血腥内战了。"
 amcivwar.4.a:0 "我明白了"
 amcivwar.5.t:0 "第二次内战"
 amcivwar.5.d:0 "联邦政府的最后通牒与废纸没有什么区别，伴随着大规模民兵力量的集结，各方的答复是什么早就已经很清楚了。从现在起，第二次美国内战正式打响了！"
 amcivwar.5.a:0 "希望不再有下次……"
 amcivwar.8.t:0 "太平洋各州州长宣布进入紧急状态"
 amcivwar.8.d:0 "太平洋各州州长宣布麦克阿瑟、威廉·H·默里，休伊·朗和比尔·海伍德无一例外地都是美利坚的叛徒与暴君。尽管他们还没有正式宣布脱离联邦，却拒绝承认竞争方中的任何一者具有执政合法性。州长弗兰克·梅里亚姆日前在萨克拉门托议会宣布，在时机成熟的情况下，他们将动用武力在恢复该国“适当的民主”。"
 amcivwar.8.a:0 "支持联邦政府！"
 amcivwar.8.b:0 "为了共和国！（扮演美利坚太平洋国继续游戏）"
 amcivwar.9.t:0 "美利坚陷入紧张对峙"
 amcivwar.9.d:0 "紧张局势降临美国，道格拉斯·麦克阿瑟将军日前率领军队威逼民选总统休伊·朗逃往新奥尔良，自行接管国家——根据他的电台演讲，麦克阿瑟宣布自己出此下策的缘由是希望“避免美利坚合众国遭受激进分子的蹂躏”。在新奥尔良，休伊·朗的支持者拒绝承认麦克阿瑟政权的合法性，以芝加哥为核心坐拥北方各州的比尔·海伍德亦是如此，太平洋各州也组建临时国会质疑联邦政府权威。对此，麦克阿瑟的反应相当简洁直白，他给所有人三十天期限考虑自己的处境，要么停止叛乱行为，要么等待联邦政府的逮捕与处决。然而考虑到对峙各方都在紧张而迅速地提升自己的军备实力，几乎没有什么可以避免美国步入第二场血腥内战了。"
 amcivwar.9.a:0 "我明白了"
 amcivwar.10.t:0 "第二次内战"
 amcivwar.10.d:0 "联邦政府的最后通牒与废纸没有什么区别，伴随着大规模民兵力量的集结，各方的答复是什么早就已经很清楚了。从现在起，第二次美国内战正式打响了！"
 amcivwar.10.a:0 "希望不再有下次……"
 amcivwar.13.t:0 "总统归来！"
 amcivwar.13.d:0 "总统在离开麦克阿瑟之后来到了太平洋国。他对局势发展到内战感到沮丧，但他清楚地意识到这场仗一定要迅速地拿下胜利。他献身发表演讲，谴责麦克阿瑟的“叛国”行为，并呼吁西方军指挥中心为了美利坚价值观自行解散。鉴于内战爆发的情况下，总统居然仍然希望与敌人妥协，我们也许应该要求他下台。"
 amcivwar.13.a:0 "他该下台了"
 amcivwar.16.t:0 "美利坚陷入紧张对峙"
 amcivwar.16.d:0 "[USA.GETLeader]总统已经失去了对国家的控制力，军队闯入他的办公室将其罢免，许多州长已不再承认联邦政府的合法性，要么投靠南方民粹主义者休伊·朗，要么转向工团主义运动家比尔·海伍德。尽管现在他们还只是拒绝履行来自联邦政府的命令，尚未正式脱离联邦。但他们已经要求当前的领导人麦克阿瑟宣布辞职，在他们选举产生的领导人的统治下建立“全国和解委员会”，恢复美国脆弱的政治秩序。作为回应，麦克阿瑟要求他们在三十天内集体辞职。不到一个世纪之前，这个国家曾经历过一场血腥的内战，而现在，这只可怖的幽灵似乎又要降临了。"
 amcivwar.16.a:0 "我明白了"
 amcivwar.19.t:0 "美利坚陷入紧张对峙"
 amcivwar.19.d:0 "诺里斯总统已经没法再控制美国的现状，许多州长已不再承认联邦政府的合法性，要么投靠南方民粹主义者休伊·朗，要么转向工团主义运动家比尔·海伍德，而他的政府机关实际上被麦克阿瑟将军所控制。尽管现在他们还只是拒绝履行来自联邦政府的命令，尚未正式脱离联邦。但他们已经要求当前的领导人兰登宣布辞职，在他们选举产生的领导人的统治下建立“全国和解委员会”，恢复美国脆弱的政治秩序。诺里斯已经决定返回内布拉斯加州，以摆脱这种局面，这一方面是为了抗议麦克阿瑟的接管，另一方面是他相信如果他继续担任总统，情况会变得更糟。而麦克阿瑟要求州长们们在三十天内集体辞职----不到一个世纪之前，这个国家曾经历过一场血腥的内战，而现在，这只可怖的幽灵似乎又要降临了。"
 amcivwar.19.a:0 "我明白了"
 amcivwar.20.t:0 "第二次内战"
 amcivwar.20.d:0 "总统的最后通牒与废纸没有什么区别，伴随着大规模民兵力量的集结，各方的答复是什么早就已经很清楚了。从现在起，第二次美国内战正式打响了！"
 amcivwar.20.a:0 "希望不再有下次……"
 amcivwar.24.t:0 "第二次美国内战落幕"
 amcivwar.24.d.noceasefire:0 "20世纪最大的资本主义国家如今正牢牢掌控在工人阶级手中。全国各地的工人不约而同地走上街头，庆祝他们终于得以从资本家的掠夺中解放出来。尽管依然有许多事情等待我们处理，眼下让我们共同庆祝这一伟大的胜利，品味美国空气久违的香甜……今天，在这里，这片有太多人流下鲜血自相残杀的地方，每个人都是平等的。"
 amcivwar.24.d.ceasefire:0 "20世纪最大的资本主义国家如今正牢牢掌控在工人阶级手中。全国各地的工人不约而同地走上街头，庆祝他们终于得以从资本家的掠夺中解放出来。尽管依然有许多事情等待我们处理，还有所谓的美利坚太平洋国在停火线的另一端等着我们，如今我们终于可以共同庆祝这一伟大的胜利，品味美国空气久违的香甜……今天，在这里，这片有太多人流下鲜血自相残杀的地方，每个人都是平等的。"
 amcivwar.24.a:0 "团结一致到永远！"
 amcivwar.25.t:0 "第二次美国内战落幕"
 amcivwar.25.d.noceasefire:0 "休伊·朗和他的盟友战胜了所有的敌人。凭借这次胜利，我们终于可以迎来一个和平的新时代。虽然还有许多重建工作要做，但我们将利用这段时间来庆祝我们的胜利。"
 amcivwar.25.d.ceasefire:0 "休伊·朗和他的盟友战胜了所有的敌人。凭借这次胜利，我们终于可以迎来一个和平的新时代。虽然还有许多重建工作要做，所谓的太平洋国也仍在停火线对面等待着我们，但我们将利用这段时间来庆祝我们的胜利。"
 amcivwar.25.a:0 "真正的美利坚凯旋！"
 amcivwar.26.t:0 "第二次美国内战落幕"
 amcivwar.26.d.noceasefire:0 "南方已定，工团祸患尽除，此等动摇国本之患皆已荡平。开国元勋睿构之宏制再渡劫波，民众当可暂享承平之世。"
 amcivwar.26.d.ceasefire:0 "南方已定，工团祸患尽除，此等动摇国本之患皆已荡平。虽太平洋国仍踞守停火线以西，山河未复，然开国元勋睿构之宏制再渡劫波，民众当可暂享承平之世。"
 amcivwar.26.a:0 "乱臣贼子万劫不复，星条笙旗冉冉升起！"
 amcivwar.27.t:0 "第二次美国内战落幕"
 amcivwar.27.d.noceasefire:0 "美国的敌人已被完全消灭。南方再一次被平定，工团主义者被彻底镇压，恺撒也被布鲁图斯和卡西乌斯合力拿下。一切对传统美国生活方式的威胁已经被扫入了历史的垃圾桶，由开国元勋们如此明智地设计的伟大制度经受住了另一个威胁。现在，全国人民都为此欢欣鼓舞，庆祝一个和平的新时代。"
 amcivwar.27.d.ceasefire:0 "虽然[ACW_survivor.GetNameDef]还存在于停火线的另一边，但内战中的其他派别已经倒下，战斗已经结束……至少现在是这样。在我们需要拿起武器，再次把国家团结在一面旗帜下之前，我们还有些许喘息的机会供我们进行片刻的重整与反省。而此时此刻，人民正在为来之不易的胜利而欢欣鼓舞。"
 amcivwar.27.a:0 "自由女神的光辉万古长存！"
 amcivwar.28.t:0 "第二次美国内战落幕"
 amcivwar.28.d.nee:0 "尘埃终于落定，看来内战中只剩下[NEE.GetNameDef]没有消灭了。我们需要举起美国的旗帜，重建剩下的一切。愿麦克阿瑟、休伊·朗、比尔·海伍德和其他野心家在地狱里玩的开心，这就是他们挑战自由的代价。"
 amcivwar.28.d.can:0 "尘埃终于落定……美国从地球上消失了……一切荣光如过往云烟，从此无处寻觅……"
 amcivwar.28.a:0 "至少……事情结束了"
 amcivwar.30.t:0 "第10号指示：物质资产再分配"
 amcivwar.30.d:0 "革命既已开始，我们必须决定如何处置资产阶级。世界产业工人联盟主张立即没收其全部财产并重新分配给人民。崭露头角的先锋党人则援引列宁因宽恕敌人而致革命受挫的先例，要求立即逮捕并处决资产阶级。隶属于没落的美利坚劳工联合会的社会党成员与几位忠诚的进步派人士主张留这些人一命，请求中央委员会仅征用战争必需物资，以维系其实用主义选民的满意度。"
 amcivwar.30.a:0 "他们的财富和生命都是我们的！"
 amcivwar.30.b:0 "为未来着想，我们可能需要这些温和派"
 amcivwar.31.t:0 "资产阶级逃往加拿大"
 amcivwar.31.d:0 "一些资产阶级，特别是芝加哥和底特律的资产阶级已经决定逃离联合工团的控制区。数千人逃往敌方领土内寻求庇护，非法的加拿大政府则是他们的一大目的地。这些罪犯渣滓在逃离革命制裁时卷走了他们一切能带走的、窃取而来的金银细软。"
 amcivwar.31.a:0 "革命铁拳早晚落到他们头上！"
 amcivwar.32.t:0 "军队大辩论！"
 amcivwar.32.d:0 "革命代表大会至今未能制定出统一的军事政策，各政治派别纷纷提出自己的方案。世界产业工人联盟主张依靠工业实力在机械化领域压倒其他派系，他们认为正如第一次美国内战中的联邦政府那样，最终我们将建立起令敌人难以企及的工业优势，故称该方案为“联邦计划”。而社会爱国主义者则支持斯梅德利·巴特勒创建建制化“共和军队”的设想，主张依托传统指挥体系，发挥我们在兵员数量与工业产能上的优势克敌制胜。集体工团主义者与最激进的无政府主义者则对上述两种方案均表反对，指出二者都未能依靠无产阶级的革命意志。在他们看来，工人阶级仅凭革命洪流就足以淹没反动势力，这才更符合马克思主义原则。该派别推出了由福斯特支持者杰克·舒尔曼主导的全民动员方案。最后，集权派提出的方案虽与世界产业工人派同样侧重工业，但更强调通过绝对火力优势远距离歼灭敌军，该计划获得了詹姆斯·伯纳姆与厄尔·白劳德的共同支持。"
 amcivwar.32.a:0 "世界产业工人联盟的计划"
 amcivwar.33.t:0 "第213号指示：战时工团主义"
 amcivwar.33.d:0 "前线战事正在陷入僵局，形势发展也愈发变得对我们不利。中央委员会正在讨论通过一项名为“战时工团主义”的全面经济改革方案。该计划预计将通过“对外贸易管制”、“工业全盘国有化”与“规范整肃劳动纪律”等非常法案，尽管这些提案没有在委员会内部引起太大争议，但其中混杂的其他政策仍被认为可能在实行过程中引发争议，例如“禁止非法罢工”，“拒绝劳动、服役的成年人将强制接受劳改”，“实行严格的食品配给制度”以及对“铁路交通部门实施军管”。毫无疑问，这些提案在美利坚社会党党内被当成了专制的苗头，许多人认为后面列举的种种措施，尤其是“禁止非法罢工”一项，同革命初衷完全背道而驰，若是将这些提案付诸实践，现政府的形象恐怕不会比他们反抗的资产阶级敌人好上多少。然而，支持这项提案的先锋队派成员则反驳说，非常时期自有非常策略，只有抱定这种决心，才能夺取革命胜利，“战时工团主义”政策确实会引起许多争议，但在内战结束后，我们完全可以直接将其推翻了事。"
 amcivwar.33.a:0 "实施战时工团主义"
 amcivwar.33.b:0 "这算哪门子社会主义！"
 amcivwar.35.t:0 "女兵"
 amcivwar.35.d:0 "革命斗争如火如荼，一些妇女怀揣着社会主义男女平等的美好理想，毅然参与到了武装斗争中去。虽然不是所有人都能得到男同志们的认可，但这并没有动摇她们为革命事业流血牺牲的决心。关于如何有效地组织妇女战斗小分队的手册已经陆续分发给征兵人员，女性民兵也能借此学习到一些战斗技巧。当然，这在社会主义代表大会内部激起了轩然大波。无政府主义者自然对此大加赞赏，但更为传统的派系，如美利坚劳工联合会和部分社会党成员，如厄尔·白劳德，则持反对态度，认为工人革命力量应该保护女性免受战火威胁，而工会派似乎在两方之间摇摆不定。美利坚工人党则强烈反对对女性征兵，他们认为革命妇女在大后方发光发热才是正道。\n\n出乎众人意料，哪怕是福斯特派，在这个问题上的意见也极不相同，他们虽是激进社会进步派，却从革命的角度对女兵加以批判，认为女性死亡率的走高会导致出生率降低，进而让反动资本主义国家获得人口优势，而这与福斯特的集体工团主义思想相矛盾，但也有福斯特派认为这是全面社会革命的必要条件。我们该怎么办？"
 amcivwar.35.a:0 "叛逆女孩，你是我世界的女王！"
 amcivwar.36.t:0 "内部冲突"
 amcivwar.36.d:0 "在掀起革命之时，大比尔·海伍德将世界产业工人联盟选为代表大会的典范和未来的接班人。我们因此博得了左翼激进派的热烈支持，如世界产业工人联盟、无政府主义者和福斯特派，但凡事皆有代价，那些怀抱着亲善劳工的社会主义理想，但又对工团主义敬而远之的左派因此疏远了我们。他们转而将目光投向了代表大会中相比之下偏右的部分，如美利坚劳工联合会和贝拉米主义的独立联盟，这些组织希望美国能走上一条崭新的、但又不像工团主义那样“极端”的新道路。而夹在左右两翼之间的是白劳德派、美利坚工人党和产业工会联合会，他们似乎更倾向于集权化的工团主义模式，尽管就具体方法来说，他们彼此之间有着千差万别。社会爱国主义者们已呼吁举行一次全民投票来决定是否保留国会席位，而不是纯粹的工会主政，他们认为，若是美国人民表达了其意愿，就应该给他们一个建设与众不同的社会主义的机会。工团主义者乃至于集体主义者对此反感不已，认为这不过是社会反动派妄想打入革命组织内部，企图窃取政权，资产阶级也会趁机凌驾于工人意志之上。代表大会上的争论日渐激烈，不管哪一方都在迫使我们做出决定，不论我们支持哪一方，我们都会在打击另一方力量的同时失去他们的支持。"
 amcivwar.36.a:0 "现 在 这 里 是 工 团 主 义 国 家"
 amcivwar.36.b:0 "“传统”的投票制度就挺好"
 amcivwar.37.t:0 "第656号指示：[GetYear]年冬季资源分配方案"
 amcivwar.37.d:0 "革命必须成功，但是革命也是为了人民的福祉。支持革命和帮助人民本是一体两面，没有谁更重要的说法，但要是到了只能在革命和人民中二选一的时候，作出抉择就显得异常艰巨。中央委员会已经意识到，眼下的资源供给形势非常严峻，无论是人民还是军队在这个冬天都不得不面临过冬物资供给不足的问题……"
 amcivwar.37.a:0 "我们为人民而战！"
 amcivwar.37.b:0 "我们为革命而战！"
 amcivwar.38.t:0 "第764号指示：革命教育法案"
 amcivwar.38.d:0 "不管过程是一帆风顺还是艰难求索，对于那些受过良好教育的人来说，接受革命思想就像呼吸一样容易。但是，我们的许多同志，无论是在钢带区还是来自美国的其他地方，他们被资本家骗了一辈子，不懂得革命能如何解放他们。许多人不肯全心全意地参加革命，甚至还有人无法理解只有我们是在真心实意地关心他们，企图危害我们的事业。问题不可不纠，我们必须将资本主义思想的毒草连根拔起，那么我们的同志是应该专注于安抚生活在我们领土里的居民，保持我们的斗志；还是应该冒险前往敌占区进行宣传，让当地人民转而拥护我们的解放斗争？"
 amcivwar.38.a:0 "关注社会主义家庭"
 amcivwar.38.b:0 "专注于反动敌人"
 amcivwar.39.t:0 "第984号指示：对战前资本主义政客的判决"
 amcivwar.39.d:0 "革命临近成功，人民敦促我们好好料理那些在革命前作威作福的腐败资本主义政客。这些政客现在已经烂在我们的牢里了。一些人认为，要是让这些政客努力工作几年，他们就会和工人感同身受，转而支持我们的事业。另一些人认为再多的教育也无法改变他们，他们必须在监狱里度过余生。人数不多但声音响亮的少数人坚持认为，他们必须因自己的罪行而被人民处决，就像曾经的罗曼诺夫王朝或古老的波旁王朝一样。"
 amcivwar.39.a:0 "他们必因汗流浃背而得救赎"
 amcivwar.39.b:0 "在牢里，他们会很好地体悟到被世界抛弃是什么感觉"
 amcivwar.39.c:0 "现在轮到我们了，我们可不能做小脚女人！"
 amcivwar.40.t:0 "第1231号指示：成立联情局"
 amcivwar.40.d:0 "不幸的是，还有很多敌特分子正在我们的领土上大肆破坏，妨碍我们解放无产阶级群众的光荣事业。在提交给中央委员会的众多提案中，厄尔·白劳德的建议很是显眼。他希望成立一个特别委员会，强推革命秩序、遏制反革命破坏活动。然而中央委员会的其他人，包括海伍德主席在内，都怀疑这么做是否必要，又是否背离了我们的理想。不管怎样，这份提案最后还是付诸了表决。代表们的决定是？"
 amcivwar.40.a:0 "成立联情局！"
 amcivwar.40.b:0 "这是不必要的……"
 amcivwar.41.t:0 "红色恐怖"
 amcivwar.41.d:0 "战争即地狱。内战更是如此。即使敌人是资本家，由于杀戮不断而造成的心理紧张已经使我们的一些士兵和指挥官变得愈发暴虐，以至于超出许多人认为可以接受的范围。虽并不常见，但来自前线与核心领土的有组织大规模处决和酷刑的报告仍屡见不鲜。尽管他们都宣称这是为了镇压资本主义间谍与破坏活动的不得已之举，但这绝对算不上什么光彩的事情。海伍德现已决定禁止自由媒体发表这些报道。“要是革命因为出了几个坏苹果就走向失败，”海伍德说，“那么人类受苦受难的日子还得长上几个世纪。”"
 amcivwar.41.a:0 "这是最后的斗争！"
 amcivwar.42.t:0 "第1398号指示：最低征兵年龄"
 amcivwar.42.d:0 "战争进程并不符合我们的预期。可恨的资本家在各个战线上都击退了我们的军队，此外我们还有耗尽人力的危险。绝望时代需要非常政策，而威廉·福斯特的提议更是一石激起千层浪，他试图将征兵年龄一举降低至11岁。虽然这将为我们提供坚持革命斗争所必需的宝贵人力，但这种极端措施还是让许多中央委员会成员胆战心惊起来。"
 amcivwar.42.a:0 "所有成年男性都得交出他们的孩子"
 amcivwar.42.b:0 "任何成年男性都懂得保护他们的孩子"
 amcivwar.44.t:0 "第53号指示：领导革命陆军"
 amcivwar.44.d:0 "中央委员会发布指示，要求在我们选定的军事领导人的指导下，任命一名成员担任革命陆军的首脑。中央委员会最终决定任命……"
 amcivwar.44.a:0 "本杰明·凯廷"
 amcivwar.44.b:0 "汉斯·艾姆利"
 amcivwar.44.c:0 "路易斯·塞肯迪"
 amcivwar.45.t:0 "第103号中央指示：领导革命空军"
 amcivwar.45.d:0 "中央委员会发布指示，要求任命一名成员担任革命空军的首脑，指导空军取得内战胜利。中央委员会最终决定任命……"
 amcivwar.45.a:0 "伯特·阿科斯塔"
 amcivwar.45.b:0 "埃迪·奥古斯特·施耐德"
 amcivwar.45.c:0 "潘乔·巴恩斯"
 amcivwar.48.t:0 "佩利向朗宣誓效忠"
 amcivwar.48.d:0 "来拜访休伊·朗的人当中出现了一位不寻常的好心人，他名叫威廉·达德利·佩利，是个古怪却异常充满激情的人。佩利是一个名为“银色军团”的本土政治宗教的社交俱乐部的领导者，银色军团在经济，政治以及文化上信奉民粹主义。不过很明显，这个俱乐部比大多数美利坚至上党成员更倾向于排他，佩利甚至公开拥护排犹思想，且支持对他认为不值得全额福利的社会要素保留怀疑的沙文主义。此外，虽然他反对旧民主党的“倒车”思想，旧民主党也瞧不上佩利所谓的“真正的”民粹主义，但许多人认为，佩利所信奉的基督教主旨和国家团结，以及将南方的贫穷黑人和其他种族隔离起来的所谓“分区制度”只不过是看起来文明一点的吉姆·克劳法式政策罢了。佩利的成员人数虽算不上多，但他对休伊·朗的理想一直充满热情，两人过去也曾合作过，双方的民兵联手对付过社会主义者，以及，虽然银色军团不常参与，也曾一起镇压过国家白人联盟。佩利此次拜访也希望休伊·朗能给他拨款资金，因为他想举办一场环游美国的福音传道与爱国宣传之旅，为联盟国聚集支持者。接受这项提议可能会给休伊的追随者留下他支持银色军团的印象，很可能激怒至上党里的左翼，因为佩利与左派不合的政策以及他本人激进反左翼的立场，并有可能疏远潜在的朗主义支持者，同时给了潜在的竞争对手，即银色军团机会。我们该如何回应？"
 amcivwar.48.a:0 "效忠者越多越好"
 amcivwar.48.b:0 "他只能自生自灭了"
 amcivwar.50.t:0 "总参谋长"
 amcivwar.50.d:0 "内战已经迫在眉睫，而我们却没有总参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。是故众人面谏休伊·朗，要求任命总参谋长以决胜局，其人选有三：素为艾森豪威尔所恶，主张军事动员的“微笑杰克”雅各布·德弗斯；推崇海军陆战队的“铁胸”刘易斯·伯韦尔·普勒；力倡先进战术规划的“恐怖特里”老特里·德拉梅萨·艾伦。不过，国内右派对三将方略皆存疑虑，故得到查尔斯·库格林神父及银色军团众将支持的至上党领袖杰拉尔德·L·K·史密斯，另提一政治化方案，即大规模征募、武装基督徒民众——若采纳此策，恐致全党加速右倾。"
 amcivwar.50.b:0 "“铁胸”刘易斯·伯韦尔·普勒"
 amcivwar.50.c:0 "老特里·德拉梅萨·艾伦"
 amcivwar.50.e:0 "杰拉尔德·L·K·史密斯"
 amcivwar.51.t:0 "陆军参谋长"
 amcivwar.51.d:0 "内战已经迫在眉睫，而我们却没有陆军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与休伊·朗进行了会晤，希望任命一位陆军参谋长来打赢这场战争。"
 amcivwar.51.a:0 "詹姆斯·费凯特"
 amcivwar.51.b:0 "弗兰克·麦克斯韦·安德鲁斯"
 amcivwar.51.c:0 "福克斯·康纳"
 amcivwar.52.t:0 "海军参谋长"
 amcivwar.52.d:0 "内战的阴影迫在眉睫，而海军参谋长职位却依然空缺，这一状况已引起政界与军界高层人士的广泛担忧。为此，各界领袖与休伊·朗会面商讨，期待尽快委任一名海军参谋长，以确保我们能在这场迫近的战争中取得胜利。"
 amcivwar.52.a:0 "詹姆斯·奥托·理查森"
 amcivwar.53.t:0 "空军参谋长"
 amcivwar.53.d:0 "内战已经迫在眉睫，而我们却没有空军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与休伊·朗进行了会晤，希望任命一位空军参谋长来打赢这场战争。"
 amcivwar.53.a:0 "詹姆斯·费凯特"
 amcivwar.53.b:0 "埃德温·查尔斯·帕森斯"
 amcivwar.53.c:0 "威廉·托马斯·庞德"
 amcivwar.54.t:0 "建设忠诚的海军"
 amcivwar.54.d:0 "腐败奸诈的美国海军将领们阻止了他们的任何船只被真正的爱国者们解放，因此我们失去了自己的海军。为了解决这个问题，支持推翻暴君的海军军官和无数水手正在计划建立一支属于新美利坚的海军部队。我们在休斯敦有很多船可以用来改装成军舰。包括驱逐舰和巡洋舰。我们需要哪一种呢？"
 amcivwar.54.a:0 "驱逐舰"
 amcivwar.54.b:0 "巡洋舰"
 amcivwar.61.t:0 "征兵"
 amcivwar.61.d:0 "随着战争的进行，是否应该实行征兵制的问题已经摆上了台面。这么做将为我们提供充足的恢复国家秩序所需的人员。然而，这不会是一个受欢迎的政策，因此也有些人建议我们把重点放在宣传上。"
 amcivwar.61.a:0 "实行征兵制"
 amcivwar.61.b:0 "专注于宣传"
 amcivwar.62.t:0 "召回驻中国的海军陆战队？"
 amcivwar.62.d:0 "随着内战的爆发，我们派驻使馆城市的驻军正束手无策。尽管召唤这批部队会让我们的中国租界变得不受保护，而且会使得我们在使馆城市的影响力进一步衰弱，但是许多人认为只有召回这些部队才能帮助我们赢得这场战争。我们应该召回这批部队吗？"
 amcivwar.62.a:0 "带小伙子们回来吧！"
 amcivwar.62.b:0 "我们不该冒这个险"
 amcivwar.63.t:0 "巴拿马卫戍部队"
 amcivwar.63.d:0 "随着内战的爆发，巴拿马卫戍队被派回美国参与作战。这使得运河变得毫无防御能力，但从另一方面来说，现在我们需要每一个能拿枪的人来保卫星条旗……"
 amcivwar.63.a:0 "孩子们，欢迎回家！"
 amcivwar.64.t:0 "内战的苦难"
 amcivwar.64.d:0 "内战为无数家庭带去辛酸苦楚。许多忠实地站在联邦政府一边的市民们正被迫忍受饥饿。我们可以集中力量来缓解他们的窘境，但这将迫使我们调用前线的军资。从这方面来说，国会与军方开始产生分歧。对此我们该如何处理呢？"
 amcivwar.64.a:0 "缓解民间疾苦"
 amcivwar.64.b:0 "帮助我们的部队"
 amcivwar.65.t:0 "戒严令？"
 amcivwar.65.d:0 "随着内战的蔓延，一个关于暂停人身保护令并在被占领地区实施戒严的问题被摆上了台面。总参谋部内部也对此存在分歧，近期可能会有更多的叛乱分子在我们端掉他们前纷纷涌现。这么做可能有助于我们在内战期间控制局势，但正如我们所说的，限制人身自由的举动自然会引起争议。那么我们该怎么办呢？"
 amcivwar.65.a:0 "实施戒严令"
 amcivwar.65.b:0 "维护民事秩序是更为妥善的选择"
 amcivwar.66.t:0 "联邦派的恐怖镇压"
 amcivwar.66.d:0 "在内战中，我们的某些军官采用了一些颇有争议的手段“永久”镇压了那些被怀疑是通敌者的普通平民。当被追问时，总统为他们的行为辩护，称“只使用了必要的武力，任何真正会实施暴行的指挥官早就已经投靠了叛军”。"
 amcivwar.66.a:0 "我们只能希望的确如此"
 amcivwar.67.t:0 "密语者"
 amcivwar.67.d:0 "亚利桑那州弗拉格斯塔夫市一位名叫菲利普·约翰斯顿的天才传教士和教育家，在与纳瓦霍印第安人共处数十年后，现在向我们提议创建“密码通话程序”。约翰斯顿提议让我们的政府和军事指挥部使用各种美洲印第安部落几乎已灭绝的语言，通过使用这些土著语对我们的通信进行加密来隐藏通信内容。通过使用纳瓦霍人、科曼奇人、阿西尼博因人、切罗基人、克里人、梅斯克瓦基人、莫霍克人、乔克托人、特林吉特人和穆斯科吉人等美洲土著的语言，我们可以创造出一种通信密码，除非我们的敌人抓到一个土著母语者，否则绝无可能破解，这将给我们的情报部门与通信部门带来无与伦比的优势。密语者将受到培训，即使被抓获并折磨，甚至即使面对必须自杀来防止情报泄露的处境，他们也绝不会吐露情报。当然，密语者也会尽可能远离前线，避免危险。我们的机密如今无法破解，这一切都要感谢土著人民。"
 amcivwar.67.a:0 "我们发誓不惜身命来保护密码，而且绝不背誓"
 amcivwar.68.t:0 "因良知拒绝服役"
 amcivwar.68.d:0 "许多男人和女人，特别是像耶和华见证会和摩门教徒这样的宗教人士，不愿参与战争，反对发生冲突。我们可以试着让他们闭嘴，也可以让他们通过从事非军事工作的办法帮助战争。公众舆论似乎有分歧，对这种行为不满的极端爱国者们已经开始在示威期间对他们进行攻击。"
 amcivwar.68.a:0 "公众知道怎么处理"
 amcivwar.68.b:0 "让他们去工作"
 amcivwar.69.t:0 "双V运动"
 amcivwar.69.d:0 "在我们与各种卖国贼们激烈斗争的同时，全国有色人种协进会的领导人已经开始推动所谓的双V运动，即“为保卫美国和对抗种族主义者的胜利”因此这项运动旨在为争取更多的黑人支持联邦政府战胜叛乱者并为反对种族歧视和隔离政策而战。"
 amcivwar.69.a:0 "胜利属于美国，胜利属于种族平等！"
 amcivwar.70.t:0 "建立女子航空勤务飞行队？"
 amcivwar.70.d:0 "国会正在就一项法案进行辩论，该法案旨在将女子航空勤务飞行队按照类似于陆军妇女团和志愿紧急服役妇女队的方式军事化。该项目要求政府像其他两个组织一样为女兵们提供费用，且避免让她们在过于紧张的战斗环境中进行飞行。尽管如此，它还是面临着来自国会的阻力，因为许多人认为许多女性飞行员没有男性飞行员那么有经验，也不适合担任这项工作。国会投票结果最终指向哪方呢？"
 amcivwar.70.a:0 "国会投票同意建立女子飞行队"
 amcivwar.70.b:0 "国会投票反对建立女子飞行队"
 amcivwar.71.t:0 "总参谋长"
 amcivwar.71.d:0 "内战已经迫在眉睫，而我们却没有总参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[USA.GETLeader]进行了会晤，希望任命一位总参谋长来打赢这场战争。"
 amcivwar.71.a:0 "奥马尔·布拉德利"
 amcivwar.71.b:0 "马林·克雷格"
 amcivwar.71.c:0 "瓦尔特·史密斯"
 amcivwar.72.t:0 "陆军参谋长"
 amcivwar.72.d:0 "内战已经迫在眉睫，而我们却没有陆军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[USA.GETLeader]进行了会晤，希望任命一位陆军参谋长来打赢这场战争。"
 amcivwar.72.a:0 "德怀特·艾森豪威尔"
 amcivwar.72.b:0 "肯尼思·乔治·奥尔索斯"
 amcivwar.73.t:0 "海军参谋长"
 amcivwar.73.d:0 "内战已经迫在眉睫，而我们却没有海军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[USA.GETLeader]进行了会晤，希望任命一位海军参谋长来打赢这场战争。"
 amcivwar.73.a:0 "威廉·哈里森·斯坦德利"
 amcivwar.73.b:0 "欧内斯特·约瑟夫·金"
 amcivwar.73.c:0 "托马斯·哈特"
 amcivwar.74.t:0 "空军参谋长"
 amcivwar.74.d:0 "内战已经迫在眉睫，而我们却没有空军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[USA.GETLeader]进行了会晤，希望任命一位空军参谋长来打赢这场战争。"
 amcivwar.74.a:0 "卡尔·安德鲁·斯帕茨"
 amcivwar.74.b:0 "爱德华·弗农·里肯巴克"
 amcivwar.74.c:0 "艾拉·克拉伦斯·埃克"
 amcivwar.76.t:0 "华盛顿陷落"
 amcivwar.76.d:0 "华盛顿已经落入叛国者与暴徒的手中，我们必须离开这座城市。军方领导人已经起草了几个可以供我们暂时迁移的城市。我们该选择搬到哪一个呢？"
 amcivwar.76.a:0 "丹佛"
 amcivwar.76.b:0 "圣弗朗西斯科"
 amcivwar.76.c:0 "海伦娜"
 amcivwar.76.e:0 "菲尼克斯"
 amcivwar.77.t:0 "总参谋长"
 amcivwar.77.d:0 "内战已经迫在眉睫，而我们却没有总参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[CAL.GETLeader]进行了会晤，希望任命一位总参谋长来打赢这场战争。"
 amcivwar.77.a:0 "亨利·阿诺德"
 amcivwar.77.b:0 "小塞缪尔·斯特吉斯"
 amcivwar.77.c:0 "亚历山大·范德格里夫特"
 amcivwar.78.t:0 "陆军参谋长"
 amcivwar.78.d:0 "内战已经迫在眉睫，而我们却没有陆军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[CAL.GETLeader]进行了会晤，希望任命一位陆军参谋长来打赢这场战争。"
 amcivwar.78.a:0 "亚历山大·麦卡雷尔·“桑迪”·帕奇"
 amcivwar.78.b:0 "艾萨克·D·怀特"
 amcivwar.79.t:0 "海军参谋长"
 amcivwar.79.d:0 "内战已经迫在眉睫，而我们却没有海军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[CAL.GETLeader]进行了会晤，希望任命一位海军参谋长来打赢这场战争。"
 amcivwar.79.a:0 "查尔斯·洛克伍德"
 amcivwar.79.b:0 "切斯特·W·尼米兹"
 amcivwar.79.c:0 "埃德温·托马斯·莱顿"
 amcivwar.80.t:0 "空军参谋长"
 amcivwar.80.d:0 "内战已经迫在眉睫，而我们却没有空军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。因此，他们与[CAL.GETLeader]进行了会晤，希望任命一位空军参谋长来打赢这场战争。"
 amcivwar.80.a:0 "霍华德·休斯"
 amcivwar.80.b:0 "亨利·阿诺德"
 amcivwar.80.c:0 "奥斯卡·威斯多佛"
 amcivwar.90.t:0 "来自民主抵抗运动的支持"
 amcivwar.90.d:0 "分散在全国各地为[Root.GetAdjective]事业而战的抵抗组织日前与我们的政府取得了联系，他们向我们移交了一批缴获的物资。"
 amcivwar.90.a:0 "这将为我们提供很大的帮助"
 amcivwar.91.t:0 "来自工团主义者的支持"
 amcivwar.91.d:0 "分散在全国各地为[Root.GetAdjective]事业而战的抵抗组织日前与我们的政府取得了联系，他们向我们移交了一批缴获的物资。"
 amcivwar.91.a:0 "这将为我们提供很大的帮助"
 amcivwar.92.t:0 "来自朗派的支持"
 amcivwar.92.d:0 "分散在全国各地为[Root.GetAdjective]事业而战的抵抗组织日前与我们的政府取得了联系，他们向我们移交了一批缴获的物资。"
 amcivwar.92.a:0 "这将为我们提供很大的帮助"
 amcivwar.93.t:0 "来自联邦派的支持"
 amcivwar.93.d:0 "分散在全国各地为[Root.GetAdjective]事业而战的抵抗组织日前与我们的政府取得了联系，他们向我们移交了一批缴获的物资。"
 amcivwar.93.a:0 "这将为我们提供很大的帮助"
 amcivwar.94.t:0 "西部工团主义者起义！"
 amcivwar.94.d:0 "最近几周以来，工团主义支持者们与当地安全部队在西海岸地区展开了激烈角逐，但从上周开始，这样的战斗烈度似乎在稳步减少，人们渐渐开始相信西部工团组织已经放弃了他们的革命希望。然而伴随着另一场新的起义爆发，这样愚蠢的想法很快成为泡影，在华盛顿州和俄勒冈州势力强劲的卡车司机与码头工人工会已经通过地下渠道组建起一批民兵武装，如果叛军能够找到办法闯出山区的话，这将在内战中开辟一条全新的战线。"
 amcivwar.94.a:0 "万岁！"
 amcivwar.94.b:0 "更多的工团人渣？！"
 amcivwar.95.t:0 "肯塔基朗派起义"
 amcivwar.95.d:0 "尽管1936年大选中肯塔基与印第安纳等中部各州在参选各方间担当了摇摆州的角色，休伊·朗在中部地区一直拥有广大的支持面。现在，在肯塔基州及其周边地区，休伊·朗的支持者们已经重新活跃起来，他们通过地下渠道得到了急需的武器装备，团结一致发动了起义，为内战中的联盟国军队开辟了一道全新的战线。"
 amcivwar.95.a:0 "万岁！"
 amcivwar.95.b:0 "从长远来看，这对他们没有任何帮助"
 amcivwar.96.t:0 "宾夕法尼亚联邦派起义"
 amcivwar.96.d:0 "即便深处工团主义活跃的腹地，宾夕法尼亚州支持联邦政府的呼声依然强劲如风。日前，在费城组建的联邦派民兵武装已经宣布起义，控制了该州中部的丘陵地带，并宣称自己只接受联邦政府的命令。他们能否切实实践这一目标为联邦政府开辟一道新的战线，目前还有待观察。"
 amcivwar.96.a:0 "万岁！"
 amcivwar.96.b:0 "这不过是徒劳"
 amcivwar.97.t:0 "[From.GetAdjective]叛军"
 amcivwar.97.d:0 "最近，我们发现[Root.GetNameDef]的[From.GetAdjective]支持者活动正在激增，毫无疑问，这些行动必然是[From.GetAdjective]资助并支持的。叛军武装通过地下渠道得到武器供给，大肆扰乱我军的后方，旨在骚扰我们的军事活动。他们是否会成为一个严重的威胁目前还有待观察。"
 amcivwar.97.a:0 "我们会撑过去的"
 amcivwar.98.t:0 "中西部民主派起义"
 amcivwar.98.d:0 "在美国中西部地区，太平洋各州的民主抵抗运动得到了民间的积极响应，各类反政府抗议活动在街头随处可见，许多人甚至把内战责任完全推给了麦克阿瑟将军。最近，这些抗议活动似乎开始变得愈发建制化，科罗拉多州日前掀起了一场大规模政治抗议活动，而组织这起活动的资金与装备似乎都是通过秘密渠道暗中筹集的。这些叛乱分子能否在内战中撕开一条新的战线目前还有待观察。"
 amcivwar.98.a:0 "万岁！"
 amcivwar.98.b:0 "充其量是群讨厌鬼罢了"
 amcivwar.100.t:0 "工团主义者在佐治亚州起义"
 amcivwar.100.d:0 "就目前的情况来看，不少对领导当局愤懑不满的朗派民兵已经转向支持联合工团。过去几周内他们曾集中于佐治亚南部丘陵，如今也以此地为基础展开活动，为美国内战开启一条新的战线。"
 amcivwar.100.a:0 "万岁！"
 amcivwar.100.b:0 "他们应该下定决心"
 amcivwar.102.t:0 "朗派在加州起义"
 amcivwar.102.d:0 "就目前的情况来看，不少对领导当局愤懑不满的美利坚社会党民兵已经转向支持联盟国。过去几周内他们曾集中于加利福尼亚南部丘陵，如今也以此地为基础展开活动，为美国内战开启一条新的战线。"
 amcivwar.102.a:0 "万岁！"
 amcivwar.102.b:0 "这无济于事"
 amcivwar.150.t:0 "美国陷入混乱"
 amcivwar.150.d:0 "我们的南方邻居正深陷混乱，更为糟糕的是，美利坚社会党竟然企图在我国边境建立据点。对此，新英格兰东北部的某些州长，对联邦政府的干预能力持悲观态度，所以正式请求加拿大政府履行《德比莱恩协议》，帮助他们抵御工团民兵暴力活动的威胁。尽管部分内阁成员认为，这一军事行动或许会被某些派别视作侵略，而不是保护性干预，主张经过国会辩论后再做决定。但对新英格兰来说，这意味着不能赶紧去救他们。"
 amcivwar.150.d.nocsa:0 "我们的南方邻居正深陷混乱，尽管工团主义革命或许得到避免，各地零散的暴力冲突依然趋于极端。有鉴于此，新英格兰东北部的某些州长，对联邦政府的干预能力持悲观态度，所以正式请求加拿大政府履行《德比莱恩协议》，帮助他们恢复社会秩序。然而，部分内阁成员认为，这一军事行动或许会被某些派别视作侵略，而不是保护性干预，主张经过国会辩论后再做决定。"
 amcivwar.150.a:0 "推迟任何干涉行动"
 amcivwar.150.b:0 "按照他们的要求，进军新英格兰"
 amcivwar.151.t:0 "阿拉斯加请求干涉"
 amcivwar.151.d:0 "内战爆发后，阿拉斯加随之面临着严重的物资短缺，而近期朱诺遭遇的炸弹袭击更是让欧内斯特·格鲁宁州长夜不能寐：远在天边的联邦政府根本抽不出身来处理边疆之地的问题，此种情形下，阿拉斯加的秩序恐怕会一触即溃。为此，格鲁宁迫不得已只能效仿新英格兰的州长们，请求加拿大政府临时介入阿拉斯加事务，协助维持秩序。\n\n政府中大部分人都赞成直接介入，但也有一部分议会成员从实际经济效益出发，认为掏我们自己的钱去补贴阿拉斯加只会浪费资源，还不如把全部资源都花在收复故土这一件头等大事上。还有人觉得如果我们拒绝直接下场干预的话，阿拉斯加政府为了自身安全着想就只能硬着头皮独立，而协约国就可以在阿拉斯加独立的第一时刻靠着地理优势抢先敌寇一步，将这一宝贵的领地拉入自己的势力范围之中。\n\n情报指出，阿拉斯加的州长认定太平洋国政府才是美国的正统所在，所以我们也可以先出手恢复秩序，然后在温哥华为阿拉斯加和太平洋国的代表们安排一场秘密会议。如此，阿拉斯加定会加入太平洋国的怀抱，而我们也能在这一过程中收获宝贵的盟友。"
 amcivwar.151.a:0 "我们应当介入！"
 amcivwar.151.b:0 "让阿拉斯加自生自灭去吧！"
 amcivwar.152.t:0 "[CAN.GetNameDefCap]占领阿拉斯加"
 amcivwar.152.d:0 "内战爆发后，阿拉斯加随之面临严重的物资短缺。朱诺炸弹袭击事件之后，阿拉斯加州长开始担心社会秩序崩溃的问题——对此，遥远的联邦政府显然无暇回应，所以，州长决定效仿新英格兰的做法，向[CAN.GetNameDef]提出干预。满载军人与补给品的卡车，正在驶入这一地区。"
 amcivwar.152.a:0 "我们之后再找他们算账"
 amcivwar.156.t:0 "美利坚的命运"
 amcivwar.156.d:0 "随着内战的结束，我们意识到我们得弄清楚如何处理我们现在控制的美国领土。"
 amcivwar.156.a:0 "把它还给[USA.GetNameDef]"
 amcivwar.156.b:0 "把它还给[CAL.GetNameDef]"
 amcivwar.156.c:0 "把它还给[TEX.GetNameDef]"
 amcivwar.156.e:0 "把它还给[NEE.GetNameDef]"
 amcivwar.156.f:0 "建立新政府"
 amcivwar.156.g:0 "继续我们的军事占领！"
 amcivwar.157.t:0 "美国领土回归"
 amcivwar.157.d.supported:0 "[From.GetNameDefCap]，遵守支持我们赢得内战的承诺，将大部分占领区领土归还给我们。"
 amcivwar.157.d.notsupported:0 "[From.GetNameDefCap]在内战期间占领了相当数量的美国领土。现在，他们的政府已经接近我们，打算把其中的大部分归还给它的“合法所有者”，这对我们来说没有任何问题。"
 amcivwar.157.a:0 "我们感激不尽"
 amcivwar.158.t:0 "美国领土回归"
 amcivwar.158.d:0 "我们的加拿大盟友，信守承诺，将近乎所有他们占领的美国领土，归还给我们。"
 amcivwar.158.a:0 "我们感激不尽"
 amcivwar.159.t:0 "美利坚新政府"
 amcivwar.159.d:0 "曾经的联邦政府早已是千疮百孔，我们应该做出些积极的改变，来取代旧政府。那么，新生的美国政府将采取何种组织形式呢？"
 amcivwar.159.a:0 "美利坚合众国，最正宗的那种"
 amcivwar.159.b:0 "美利坚太平洋国"
 amcivwar.159.c:0 "美利坚联盟国"
 amcivwar.159.e:0 "新英格兰"
 amcivwar.160.t:0 "新英格兰的命运"
 amcivwar.160.d:0 "英格兰地区，目前被我们所统治，那么，我们应该将土地归还给[america_country.GetNameDef]，还是继续占领呢？"
 amcivwar.160.a:0 "把它还给他们"
 amcivwar.160.b:0 "既然我们做过那么多，要点回报不过分"
 amcivwar.161.t:0 "阿拉斯加的命运"
 amcivwar.161.d:0 "阿拉斯加地区，目前被我们所统治，那么，我们应该将土地归还给[america_country.GetNameDef]，还是继续占领呢？"
 amcivwar.162.t:0 "[america_country.GetNameDef]的独立选举？"
 amcivwar.162.d:0 "[america_country.GetNameDef]新政府宣告成立，已有一年之久，现在，我们的盟友提出恢复独立。我们应该准许他们独立组织选举，以平等身份成为朋友吗？"
 amcivwar.162.a:0 "当然"
 amcivwar.162.b:0 "他们还没准备好"
 amcivwar.163.t:0 "与加拿大议和？"
 amcivwar.163.d:0 "我们占领了渥太华，目前加拿大人正在逃亡。我们也许该缔结和约了，以免我们陷入他们那广袤无垠的领土。"
 amcivwar.163.a:0 "挺好，让我们结束这一切吧"
 amcivwar.163.b:0 "除非他们割让不列颠哥伦比亚"
 amcivwar.163.c:0 "除非他们退出新英格兰"
 amcivwar.164.t:0 "[From.GetNameDefCap]呼吁和平"
 amcivwar.164.d:0 "来自[From.GetAdjective]的信使抵达我们宫廷，表示对方不再准备继续推进，希望加拿大能从中得到教训。停战协议可以即刻签署，但也警告我们，下次他们恐怕不会那么宽容。"
 amcivwar.164.a:0 "好，让我们结束这一切吧"
 amcivwar.164.b:0 "不，我们还有希望赢得这场战争！"
 amcivwar.165.t:0 "[From.GetNameDefCap]呼吁和平"
 amcivwar.165.d:0 "加拿大政府，被[From.From.GetNameDef]教训得很惨，现在，他们希望与[Root.GetNameDef]签署和约，彻底退出内战。"
 amcivwar.165.a:0 "好，让我们结束这一切吧"
 amcivwar.165.b:0 "我们打算给他们个教训！"
 amcivwar.166.t:0 "[From.GetNameDefCap]的提议"
 amcivwar.166.d:0 "目前，我们与[CSA.GetNameDef]尚有停火协议，却从未幻想过这是场真正的和平——那只是战争再度爆发前的短暂休整罢了。最近，[From.GetAdjective]政府提出：只要我们加入协约国，下次战争爆发后，他们就随我们共同参战。鉴于加拿大政府也恐惧[CSA.GetNameDef]的影响，这一态度是可信的。然而，某些政府成员不希望绑定在协约国的战车上，接受协议意味着，赢得内战之后，我们还得接着参与他们的欧洲战事。"
 amcivwar.166.a:0 "我们需要他们的帮助来赢得战争"
 amcivwar.166.b:0 "不，我们没他们照样行！"
 amcivwar.167.t:0 "[From.GetNameDefCap]加入协约国"
 amcivwar.167.d:0 "为了感谢我们的帮助，[From.GetAdjective]政府已决定接受我们的提议，并正式加入了协约国。"
 amcivwar.167.a:0 "为美利坚高呼三声万岁！"
 amcivwar.168.t:0 "[From.GetNameDefCap]拒绝了我方提议"
 amcivwar.168.d:0 "[From.GetAdjective]政府拒绝了我们的同盟提议，也许他们认为自己可以赢得内战。"
 amcivwar.168.a:0 "太令人失望了！"
 amcivwar.169.t:0 "[CAL.GetNameDefCap]加入协约国"
 amcivwar.169.d:0 "畏惧我们赢得最终的胜利，[CAL.GetAdjective]政府已经向加拿大和英国人展现善意。一旦停战协议到期，我们将与他们同时开战。"
 amcivwar.169.a:0 "那就这样吧！"
 amcivwar.199.t:0 "最后的美国人"
 amcivwar.199.d:0 "我们的公民开始明白，虽然内战实际上已经结束了。然而战斗留下的伤痕仍然存在很长一段时间。但至少经过这次战争，美国的命运已经完全定格。我们现在是，也永远是[Root.GetNameDef]。全世界都应该知道这一点。"
 amcivwar.199.a:0 "上帝保佑美国！"
 amcivwar.200.t:0 "可能的停火"
 amcivwar.200.d:0 "美国已饱受内战蹂躏，政府内部也有越来越多的人开始讨论与[CAL.GetNameDef]达成停火的可能性。太平洋叛军是否会表示同意尚不可知，但若真能实现停火，我们便将有时间巩固对东部地区的控制，也能让我军恢复些许元气。当然，最终清算之日终会到来，可如果我们现在不争取停火，战争可能会变得更加旷日持久。"
 amcivwar.200.a:0 "让我们在丹佛与他们碰面"
 amcivwar.200.b:0 "不，这没有意义"
 amcivwar.201.t:0 "丹佛停火谈判"
 amcivwar.201.d:0 "随着[survivor.GetNameDef]与[CAL.GetNameDef]间的战争陷入僵局，双方高层官员就可能的停火进行了会谈。这是在[survivor.GetAdjective]政府的敦促下做出的决定，目前尚不清楚停火对双方能够有多大的吸引力。不过几天之内我们就会知道结果如何。"
 amcivwar.201.a:0 "一个好主意？"
 amcivwar.202.t:0 "提案"
 amcivwar.202.d:0 "为期两天的会谈后，军方官员们共同达成了一个可行的建议：密西西比河以西目前被[CAL.GetAdjective]占领部队控制的领土将被割让给[CAL.GetNameDef]，停火线上有一些断层——尽管这些地区不能进行正常的军事作业。其余的将让给[survivor.GetNameDef]。除此之外，没有保证，也没有真正和平的谈判……最终会有一个清算。双方只是呼吁暂时停止敌对行动，评估损失，让生者喘口气。"
 amcivwar.202.a:0 "这就行了"
 amcivwar.202.b:0 "他们要求的太多了！"
 ACW_agree_proposal:0 "参照目前情况，同意这个建议。"
 ACW_we_will_try_again:0 "让我们再回到谈判桌前试一次……"
 amcivwar.203.t:0 "绝不停火"
 amcivwar.203.d:0 "或许人们给了和谈过高的期望。双方在丹佛的谈判没有达成任何实质性协议便破裂了，停火的希望就此终结，战争仍在继续。"
 amcivwar.203.a:0 "到此为止吧"
 amcivwar.204.t:0 "[ACW_ceasefire_name]"
 amcivwar.204.d:0 "与[CAL.GetNameDef]的谈判已经结束，停火正在进行。我们的军队已经撤回到新边界的东部。这种情况会持续多久还有待观察。"
 amcivwar.204.a:0 "和平回到了我们身边……暂时的"
 amcivwar.205.t:0 "[ACW_ceasefire_name]"
 amcivwar.205.d:0 "与[From.GetNameDef]的谈判已经结束，停火正在进行。我们的军队已经撤回到新边界的西部。这种情况会持续多久还有待观察。"
 amcivwar.205.a:0 "和平回到了我们身边……暂时的"
 amcivwar.206.t:0 "[ACW_ceasefire_name]"
 amcivwar.206.d:0 "美国内战已经持续肆虐了好几个月。今天，[CAL.GetNameDef]与[survivor.GetNameDef]官员在丹佛举行会谈后达成了停火协议。太平洋部队将撤离到双方同意的边界以西的新边界，而[survivor.GetAdjective]军队将向东撤离。然而，这并不是正式的和平，许多人认为两国之间未来的决战——也正是对美国未来命运的最后摊牌——是不可避免的。即便如此，对于双方来说，这都是一个喘息的机会，让他们聚集力量，清点死亡人数。两边的美国人都在庆祝能从混乱中获得些许久违的和平。"
 amcivwar.206.a:0 "我们看看这能持续多久……"
 amcivwar.212.t:0 "美国陷入混乱"
 amcivwar.212.d:0 "利比里亚自1822年作为获释奴隶安家的殖民地被建立以来，美国一直主导了他的经济和国内政治。这种半公开的控制也有助于保护她免受欧洲殖民列强的侵害。然而，现在美国正处于混乱之中，相互对立的政治派别角逐着总统的宝座。冲突现在已深化到战争的级别。利比里亚再也不能依靠美国来保护它了。现在我们必须决定该如何从这个冷血的时代里生存下去。"
 amcivwar.212.a:0 "再不当哈巴狗了——我们可以保护自己！"
 amcivwar.212.b:0 "我们不是叛徒——继续向美国人效忠"
 amcivwar.212.c:0 "做什么哈巴狗！我们已经可以保护自己了！"
 amcivwar.212.e:0 "我们不是叛徒——应该继续忠于美国"
 amcivwar.213.t:0 "利比里亚请求保护"
 amcivwar.213.d:0 "随着美国内战的全面爆发，他们的前保护国利比里亚共和国已向我们提出外交和军事保护的要求，因为美国不可能再给予他们这种保护。我们该如何答复？"
 amcivwar.213.a:0 "好，利比里亚将是有用的盟友"
 amcivwar.213.b:0 "既然他们不受保护，那就占领他们的土地！"
 amcivwar.213.c:0 "我们不需要他们"
 amcivwar.214.t:0 "法国同意保护我们"
 amcivwar.214.d:0 "法兰西民族国已同意保护我们，只要我们信守承诺在外交和经济上为他们做出某些让步。我们再一次安全了！"
 amcivwar.214.a:0 "万岁！"
 amcivwar.215.t:0 "利比里亚受到攻击"
 amcivwar.215.d:0 "现在这些外国人想要夺取我们的土地。我们别无选择，只有为生存而战！"
 amcivwar.215.a:0 "动员尽可能多的人来保卫国家"
 amcivwar.216.t:0 "法国拒绝了我们的请求"
 amcivwar.216.d:0 "不幸的是，法国拒绝保护我们……"
 amcivwar.216.a:0 "我们必须走向独立"
 amcivwar.216.b:0 "转而求助于德国"
 amcivwar.217.t:0 "利比里亚请求保护"
 amcivwar.217.d:0 "随着美国内战的全面爆发，他们的前保护国利比里亚共和国已向我们提出外交和军事保护的要求，因为美国不可能再给予他们这种保护。我们该如何答复？"
 amcivwar.217.a:0 "好，他们将是有用的盟友"
 amcivwar.217.b:0 "可以，但他们必须把行政权力移交给中央非洲"
 amcivwar.217.c:0 "我们不需要他们"
 amcivwar.217.e:0 "既然他们不受保护，那就占领他们的土地！"
 amcivwar.218.t:0 "德国同意保护我们"
 amcivwar.218.d:0 "德国已同意保护我们，只要我们信守承诺在外交和经济上为他们做出某些让步。我们再一次安全了！"
 amcivwar.218.a:0 "万岁！"
 amcivwar.219.t:0 "利比里亚的傀儡"
 amcivwar.219.d:0 "德皇提议把利比里亚国家变成我们的附属国。太好了，这将帮助我们控制更多的非洲地区。"
 amcivwar.219.a:0 "我们的势力愈发壮大"
 amcivwar.220.t:0 "德国人把我们交给了中央非洲"
 amcivwar.220.d:0 "德国人提议把我们置于他们的中央非洲殖民政府的控制之下。至少我们现在有个保护人了……"
 amcivwar.220.a:0 "万岁！"
 amcivwar.221.t:0 "德国人拒绝了我们的请求"
 amcivwar.221.d:0 "不幸的是，德国拒绝保护我们……现在我们在世界上无比的孤独"
 amcivwar.221.a:0 "我们必须独立自主"
 amcivwar.221.b:0 "转而求助于法兰西民族国"
 amcivwar.222.t:0 "孤立无援的利比里亚"
 amcivwar.222.d:0 "小国利比里亚脱离美国保护后如今是孤身一人。我们可以尝试为自己夺取这些土地，尽管这在我们的盟友和敌人眼中恐怕都不是一个受欢迎的举动。"
 amcivwar.222.a:0 "我们对利比里亚没有兴趣"
 amcivwar.222.b:0 "既然他们不受保护，那就占领他们的土地！"
 amcivwar.223.t:0 "孤立无援的利比里亚"
 amcivwar.223.d:0 "小国利比里亚脱离美国保护后如今是孤身一人。我们可以尝试为自己夺取这些土地，尽管这在我们的盟友和敌人眼中恐怕都不是一个受欢迎的举动。"
 amcivwar.223.a:0 "我们对利比里亚没有兴趣"
 amcivwar.223.b:0 "既然他们不受保护，那就占领他们的土地！"
 amcivwar.224.t:0 "法国入侵"
 amcivwar.224.d:0 "发现我们没有保护者，贪婪的法国帝国主义者决定攻击我们。我们别无选择，只能为生存而战。"
 amcivwar.224.a:0 "动员尽可能多的人来保卫国家"
 amcivwar.225.t:0 "德裔阿非利卡人入侵"
 amcivwar.225.d:0 "中央非洲的德国政府决定利用我国在外交上的孤立对我们发动攻击。我们别无选择，只能为自己的生存而战。"
 amcivwar.225.a:0 "动员尽可能多的人来保卫国家"
 amcivwar.226.t:0 "菲律宾独立"
 amcivwar.226.d:0 "美国内战削弱了美国对菲律宾的控制。菲律宾人民要求取得完全独立，但政府中的一些人担心一个独立的菲律宾会被该地区的其他大国吞并。"
 amcivwar.226.a:0 "自由，恐惧，恐惧，自由"
 amcivwar.227.t:0 "接管美国的装备"
 amcivwar.227.d:0 "随着美国人离开该岛，他们在菲律宾留下的大量设备无人问津。菲律宾军队主张在这些装备缺乏守备的情况下自行夺取这些资源，但政府担心这会对两国关系造成影响。"
 amcivwar.227.a:0 "夺取装备"
 amcivwar.227.b:0 "我们应保持友好"
 amcivwar.228.t:0 "美国驻菲律宾军团"
 amcivwar.228.d:0 "战争迫使美国政府召回所有可用的部队。在菲律宾的美军仍然忠于美国政府和麦克阿瑟。但一些人担心，放弃菲律宾将付出高昂代价，但美国现在需要这些军事力量。"
 amcivwar.228.a:0 "召回这些部队"
 amcivwar.228.b:0 "我们必须维持在当地的立场"
 amcivwar.229.t:0 "菲律宾联邦"
 amcivwar.229.d:0 "美国人从来没有向菲律宾人民许诺过独立，而菲律宾国内势力则想要利用美国内战的机会自行宣布独立，组建一个合法而自主的政府。菲律宾联邦的成立是为了帮助他们的政府更有效地独力行使权力并他们的家园逐步过渡到一个完全独立的国家。"
 amcivwar.229.a:0 "光荣的新联邦"
 amcivwar.300.t:0 "新英格兰和纽约骚乱"
 amcivwar.300.d:0 "最近数日，工团民兵武装正在努力争夺东北部各州的控制权，这项努力失败了。截至目前为止，局势依然牢牢掌控在各州州长手中，他们对极端武装的暴力行为实施严酷镇压——尽管如此，波士顿与布法罗依然发生民间骚乱，更不用说纽约城区正在爆发的工团起义了。新英格兰公众处在焦虑之中，州长们决定拒绝联邦政府在当地征调民兵武装的要求，担心此举将进一步恶化形势引发其他不可控的后果。据称，新英格兰州长们正秘密与加拿大政府接触，希望后者介入局势以免最糟糕的情况发生。"
 amcivwar.300.d.assass:0 "比尔·海伍德遇刺后的政治余波正在北方各州迅速发酵，从新泽西到缅因海岸，新英格兰地区的民间暴力问题表现得相当激烈。数家工团民兵组织日前对外宣布，假若美利坚联盟国发动起义，无论立场如何，他们也会尝试夺取地方政权。截至目前为止，局势依然牢牢掌控在各州州长手中，他们对极端武装的暴力行为实施严酷镇压——尽管如此，波士顿与布法罗依然发生民间骚乱，更不用说纽约城区正在爆发的工团起义了。新英格兰公众处在焦虑之中，州长们决定拒绝联邦政府在当地征调民兵武装的要求，担心此举将进一步恶化形势引发其他不可控的后果。据称，新英格兰州长们正秘密与加拿大政府接触，希望后者介入局势以免最糟糕的情况发生。"
 amcivwar.300.d.peace:0 "尽管比尔·海伍德与美利坚社会党努力安抚北方各州的民兵武装，但并非所有工团组织都认可妥协法案在维护工人利益上走得足够远。事实上，许多激进工会仍在呼吁罢工，从新泽西到缅因海岸，新英格兰工团民兵的社会暴力问题依然严峻。截至目前为止，局势依然牢牢掌控在各州州长手中，他们对极端武装的暴力行为实施严酷镇压——尽管如此，波士顿与布法罗依然发生民间骚乱，更不用说纽约城区正在爆发的工团起义了。新英格兰公众处在焦虑之中，州长们决定拒绝联邦政府在当地征调民兵武装的要求，担心此举将进一步恶化形势引发其他不可控的后果。据称，新英格兰州长们正秘密与加拿大政府接触，希望后者介入局势以免最糟糕的情况发生。"
 amcivwar.300.a:0 "真是一团糟"
 amcivwar.300.b:0 "有意思"
 amcivwar.310.t:0 "内华达州与太平洋诸州结盟"
 amcivwar.310.d:0 "老理查德·科尔曼日前已宣布拒绝承认麦克阿瑟将军政府的合法性，并转而同太平洋诸州结盟。自西海岸政府成立以来，内华达州一直在与他们进行积极的协商，科尔曼在一次广播讲话中表示，他无法接受民主在美国的崩溃，如果灯塔必然倒下，他也将为此做出悲壮的抵抗。与措辞激烈的演说形成鲜明对照的是，驻守当地的联邦军队选择从内华达军事基地默默撤离，双方没有发生任何暴力纠纷。"
 amcivwar.310.a:0 "欢迎他的决定"
 amcivwar.310.b:0 "真是桩蠢行"
 amcivwar.311.t:0 "三十日期限"
 amcivwar.311.d:0 "到目前为止，还没有任何一个州在联邦政府给予的三十天考虑期限内表示接受条件，而是选择继续对抗。尽管政府在利用这段时间强化自身掌控，但不少人士警告麦克阿瑟，在截止日期来临前，恐怕还将出现更多暴力冲突和州级叛乱。如今华盛顿的多数人已对避免全面战争的可能性持悲观态度。"
 amcivwar.311.a:0 "我们走着瞧"
 amcivwar.312.t:0 "期限迫近"
 amcivwar.312.d:0 "联邦政府发布的三十日最终期限将尽，叛乱各州仍然没有放弃武装斗争的意思。事实上，叛乱者们利用这段空余在控制区内征募起大批民兵武装，这意味着美国内战将演变成一场万分艰巨的斗争。"
 amcivwar.312.a:0 "该来的总会来的"
 amcivwar.314.t:0 "[restored_core.GetName]恢复秩序"
 amcivwar.314.d:0 "在过去的数周内，[Root.GetAdjective]政府的部队忙于[restored_core.GetName]的重建工作，逮捕那些我们认为对我们的控制造成妨碍的人，并帮助我们当地的支持者在人民中宣传和解与信任。我们想让他们放心，作为美国公民，他们没有理由对我们的存在感到恐惧。即使这里仍然处于混乱中，我们努力的种子也开始生根发芽。"
 amcivwar.314.a:0 "真是个好消息！"
 amcivwar.600.t:0 "[Root.GetAdjective]崩溃"
 amcivwar.600.d:0 "我们的军队已经不能再抵抗敌人了，人员开始大批逃亡，混乱的局势正在蔓延。[Root.GetNameDefCap]即将失败，我们不得不承认这一点……"
 amcivwar.600.a:0 "就这样结束了……"
 amcivwar.607.t:0 "联邦政府崩溃"
 amcivwar.607.a:0 "这是革命的必要步骤"
 amcivwar.607.b:0 "此即为暴君恶果！"
 amcivwar.607.c:0 "他们罪有应得"
 amcivwar.607.e:0 "令人震惊！"
 amcivwar.608.t:0 "联合工团崩溃"
 amcivwar.608.a:0 "令人百感交集"
 amcivwar.608.b:0 "至少这是个好消息"
 amcivwar.608.c:0 "让他们去地狱里闹革命吧"
 amcivwar.608.e:0 "有意思"
 amcivwar.609.t:0 "美利坚联盟国的崩溃"
 amcivwar.609.a:0 "理所应当"
 amcivwar.609.b:0 "至少这是个好消息"
 amcivwar.609.c:0 "这是他们罪有应得！"
 amcivwar.609.e:0 "有意思"
 amcivwar.610.t:0 "太平洋国的崩溃"
 amcivwar.610.a:0 "理所应当"
 amcivwar.610.b:0 "至少这是个好消息"
 amcivwar.610.c:0 "这是他们罪有应得！"
 amcivwar.610.e:0 "有意思"
 amcivwar.611.t:0 "来自[From.GetAdjective]的装备抵达"
 amcivwar.611.d:0 "我们的[From.GetNameDef]朋友支援了一批步兵装备来协助我们的战斗。"
 amcivwar.611.a:0 "雪中送炭！"
 amcivwar.615.t:0 "集合！预备兵们"
 amcivwar.615.d:0 "随着[From.GetNameDef]对[Root.GetNameDef]宣战，[From.GetAdjective]政府乘着我国最虚弱的时刻企图捡漏的行为进一步激怒了我们的人民。自发组建的新军队伍来自全国各地，他们已准备好奉献一切，将敌人扼杀在自己的战壕里！"
 amcivwar.615.a:0 "他们必须付出代价！"
 amcivwar.616.t:0 "预备役复员"
 amcivwar.616.d:0 "国家预备队曾在国家最危险的时刻接受召唤抵达前线，现在战争已经结束，他们也开始已经了复员工作准备返回自己的家乡，经过这么多场艰辛的战斗，想来他们也已经筋疲力尽吧。"
 amcivwar.616.a:0 "亲爱的，你们终于可以休息了"
 2000_infantry_equipment_1:0 "£rifle_texticon §H2000§!"
 2000_infantry_equipment_1_blocked:0 "£rifle_texticon §R2000§!"
 2000_infantry_equipment_1_tooltip:0 "在送出支援前，我们需要有足够的武器"
 amcivwar.617.t:0 "梵蒂冈提供军事援助"
 amcivwar.617.d:0 "教宗国在现任教宗的带领下，对联盟国传达了相当令人惊讶的声援，他们向一分钟人提供武器和补给，甚至派出了志愿军，其中许多是想要帮助一分钟人将美国从腐败和工团主义中解放出来的法国和意大利志愿者。这对政府无疑是一个巨大的冲击；众所周知，美国主要是一个新教国家，天主教人口实际上大部分居住在新英格兰，到了马里兰州以南便已几乎不见，而目前联盟国当然不可能触及这片地区，教宗为何而支持引发了政府的疑惑。\n\n不过德克萨斯有着大量的天主教人口，路易斯安那也历来同情天主教，这使得教宗的提议也有其合理性。虽然[TEX.getleader]个人把教宗的支持归因于天主教传统的慈善和勤勉美德，但一部分政府成员，特别是虔诚的新教徒杰拉尔德·L·K·史密斯十分鄙视罗马天主教的干预，敦促[TEX.getleader]驳斥梵蒂冈企图扩大其在北美的影响力的任何企图，并以墨西哥的克里斯特罗战争（天主教徒起义）为例，说明罗马教宗“企图腐蚀毒害自由世界的价值观”。当然，我们可以轻易认为史密斯所说的都是不公平与偏执的胡言乱语，但最终的决定权在[TEX.getleader]。"
 amcivwar.617.a:0 "向圣座表达我们的感谢，但我们会自己把事情处理好的"
 amcivwar.617.b:0 "史密斯就是个偏执狂，我们他妈的需要武器！"
 amcivwar.52.b:0 "林恩·C·奎格"
