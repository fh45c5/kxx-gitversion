 amcivwar.3001.t:0 "黑带起义"
 amcivwar.3001.d:0 "在社会主义者、民族自由派民兵的通力合作下，黑带起义军终于在黑人聚居区起身反抗旧民主党，并在民兵夺取伯明翰后，宣布“定都”于此。杜波依斯来到了这个叛乱国度，担任其名义领导人，我们必须得赶快镇压他们，免得遭到背刺。"
 amcivwar.3001.a:0 "他妈的！"
 amcivwar.3001.b:0 "是时候了！"
 amcivwar.3002.t:0 "黑带起义"
 amcivwar.3002.d:0 "在社会主义者、民族自由派民兵的通力合作下，黑带起义军终于在黑人聚居区起身反抗旧民主党，并在民兵夺取伯明翰后，宣布“定都”于此。杜波依斯来到了这个叛乱国度，担任其名义领导人，我们必须得赶快镇压他们，免得遭到背刺。"
 amcivwar.3002.a:0 "他妈的！"
 amcivwar.3002.b:0 "是时候了！"
 amcivwar.3003.t:0 "整合黑带起义军？"
 amcivwar.3003.d.USA:0 "随着我们摧毁了美国东部地区所有的敌对政权，我们现在该解决如何处理对抗宪政国的黑人起义者们的问题了。目前我们双方都未对对方宣战，但是由于他们军队中显眼的分裂主义部队，而且他们并未明确对联邦效忠，因此是否通过和平方式合并对方军队与领土仍存在争议。我们将要求对方放下武器，放联邦军队开入占领。但在对和统的怀疑中，部分激进派认为起义军对联邦毫无忠诚可言，与内战的其他势力不过一丘之貉，他们主张直接对黑人起义军发起进攻。"
 amcivwar.3003.d.TEX:0 "随着我们摧毁了美国东部地区所有的敌对政权，我们现在该解决如何处理对抗宪政国的黑人起义者们的问题了。目前我们双方都未对对方宣战，但是由于他们军队中显眼的分裂主义部队以及他们并未明确向我方效忠，因此是否通过和平方式合并对方军队与领土仍存在争议。我们将要求对方放下武器，放联盟国军队开入占领。但在对和统的怀疑中，部分激进派认为让美国的大片土地沦于另一个潜在敌对势力手中将是一场政治灾难，并且这将损害南方至上党成员的关系，许多南方至上党成员的选区被起义军所控制，依此他们主张直接对黑人起义军发起进攻。"
 amcivwar.3003.d.CAL:0 "随着我们摧毁了美国东部地区所有的敌对政权，我们现在该解决如何处理对抗宪政国的黑人起义者们的问题了。目前我们双方都未对对方宣战，但是由于他们军队中显眼的分裂主义部队，且他们并未明确对我方效忠，因此是否通过和平方式合并对方军队与领土仍存在争议。我们将要求对方放下武器，放太平洋国军队开入占领。但在对和统的怀疑中，部分激进派认为起义军缺乏对美式民主的忠诚，与内战的其他势力不过一丘之貉，他们主张直接对黑人起义军发起进攻。"
 amcivwar.3003.a:0 "发出统一要求"
 amcivwar.3003.b:0 "立刻进攻他们！"
 amcivwar.3004.t:0 "统一要求"
 amcivwar.3004.d.USA:0 "我们刚收到来自联邦政府军的要求，他们要求我们放下武器并并入忠于麦克阿瑟将军的武装力量中。这份要求还声明，如果我们不在接下来几天内服从要求，他们会将我们视作叛匪并对我们的地盘发起全面进攻。大多数人将此视作对我们起义军的威胁，并提醒说效忠麦克阿瑟很可能让我们黑人的处境倒退至与默里甚至很可能是西蒙斯治下那样。然而，一些实用主义者反驳认为接受这份要求会挽救数以千计人的性命，接受这份要求也能够展现我们对联邦政府的忠诚，而这也能让我们在未来的决策中获得更多的筹码。"
 amcivwar.3004.a:0 "接受要求"
 amcivwar.3004.b:0 "拒绝要求"
 amcivwar.3005.t:0 "黑人起义拒绝要求！"
 amcivwar.3005.d:0 "黑带叛军的领导层拒绝了我们的合并要求，宣称我们是忠于旧秩序的暴君。他们的军队已经开始为应对我们而动员，冲突预计将于数小时内爆发，指挥官们正在催促我们部署军队来给予他们回击。"
 amcivwar.3005.a:0 "操他妈的"
 amcivwar.3006.t:0 "黑人叛军接受要求！"
 amcivwar.3006.d:0 "黑带叛军的领导层答应了我们的合并要求，而我们已经开始了他们领土的控制转移进程。叛军的部分士兵也请求加入我们的军队，虽然他们的请求并未得到广泛的支持，但是现况需要我们去争取每一个可能的援助。"
 amcivwar.3006.a:0 "好耶！"
 amcivwar.3007.t:0 "整合黑带起义军？"
 amcivwar.3007.d.soc:0 "随着盘踞在美国东部的一切敌对政府被击败，我们现在必须面对如何处理对抗美利坚宪政国的黑人起义的问题。目前我们双方尚未发生冲突，但由于起义军内部存在大量反动势力，我国政府内的激进派质疑其政府对社会主义的忠诚度。他们主张要求接管该地区直至局势恢复和平，以便我们能更审慎地解决黑带自治问题。然而温和派则认为，任何吞并起义区域的企图只会引发更多战争并激起民众怨恨。"
 amcivwar.3007.d.nosoc:0 "随着盘踞在美国东部的一切敌对政府被击败，我们现在必须面对如何处理对抗美利坚宪政国的黑人起义的问题。目前我们双方尚未发生冲突，但其资本主义政府的性质与我们革命的根本宗旨相悖。内阁多数成员主张要求接管该地区直至局势恢复和平，以便我们能更周密地筹划黑带自治问题的解决方案。然而较为温和的派别则认为，任何吞并起义区域的企图都将引发更多战乱并招致民众怨恨，建议在对方建立社会主义政府的前提下维持其自治现状。"
 amcivwar.3007.a:0 "随他们去吧"
 amcivwar.3007.b:0 "起义军必须加入联合工团"
 amcivwar.30070.t:0 "统一要求"
 amcivwar.30070.d:0 "我们刚收到来自工团主义者军队的要求，他们要求我们放下武器并并入忠于美利坚联合工团的武装力量中。这份要求还声明，如果我们不在接下来几天内加入他们的革命，他们会将我们视作敌人并对我们的地盘发起全面进攻。大多数人将此视作对我们起义军的威胁，并坚持认为我们应该在各种外部与潜在的敌对势力威胁下保持自治。然而，一些实用主义者反驳认为接受这份要求会挽救数以千计人的性命，并且和联合工团合并毫无疑问是能保障我们人民在未来的安全的最佳选项。"
 amcivwar.30070.a:0 "拒绝要求"
 amcivwar.30070.b:0 "接受要求"
 amcivwar.30071.t:0 "黑人叛军接受要求！"
 amcivwar.30071.d:0 "黑带叛军的领导层答应了我们的合并要求，而我们已经开始了他们领土的控制转移进程。叛军的部分士兵也请求加入我们的军队，虽然他们的请求并未得到广泛的支持，但是现况需要我们去争取每一个可能的援助。"
 amcivwar.30071.a:0 "好耶！"
 amcivwar.30072.t:0 "黑人起义拒绝要求！"
 amcivwar.30072.d:0 "黑带叛军的领导层拒绝了我们的合并要求，宣称我们是企图强加于人的暴君。他们已经开始为应对我们而在边境动员军队。现在的问题是我们应该先发制人，还是随他们去。"
 amcivwar.30072.a:0 "别逼他们太紧了"
 amcivwar.30072.b:0 "如果他们的回答就这……"
 amcivwar.3008.t:0 "联合工团要求改换政府"
 amcivwar.3008.d:0 "我们刚收到来自美利坚联合工团的要求，他们要求我们改选一个社会主义的政府，要么就自食其果。这份要求还声明，如果我们不在接下来几天内开始移交控制权，他们会将我们视作反动派并对我们的地盘发起全面进攻。大多数人将此视作对我们起义军的威胁，并坚持认为我们就算是以战争为代价也应该在各种外部与潜在的敌对势力威胁下保持自治。然而，一些实用主义者反驳说，接受这一要求会挽救成千上万人的性命，而且相比起陷羽翼未丰之国家于火海，还不如就社会主义得了，不过，前提是由我们自己进行选举，来选择一个我们自己的社会主义政府。"
 amcivwar.3008.a:0 "接受要求并要求由我们自己进行选举"
 amcivwar.3008.b:0 "拒绝要求"
 amcivwar.3009.t:0 "黑人起义拒绝要求！"
 amcivwar.3009.d:0 "黑人起义的领导层拒绝了我们的合并要求，宣称我们是企图强加于人的暴君。他们的军队已经开始为应对我们而动员，而冲突预计将于数小时内爆发，指挥官们正在催促我们布放军队来回击他们。"
 amcivwar.3009.a:0 "操！"
 amcivwar.3010.t:0 "黑带起义军要求选举"
 amcivwar.3010.d:0 "黑带起义军已经接受了我们的要求，任命社会主义政府，但条件是他们要举行选举，确定自己的领导人。再一次，温和派主张不要把他们逼得太紧，制造另一个战线和对手，而一些激进分子则主张，我们必须团结一致，只遵循一种意识形态立场，即使这意味着战争。"
 amcivwar.3010.a:0 "选举是他们的权利"
 amcivwar.3010.b:0 "他们有过改选社会主义政府的机会。逐一发送坦克！"
 amcivwar.3011.t:0 "联合工团接受了！"
 amcivwar.3011.d:0 "联合工团同意了我们自己举办选举的要求。我们已经开始为选举做准备，而联合工团政府内的几个派别甚至表示，一旦竞选的政党变得更加明显，他们将开始支持候选人。尽管与即将离任的领导层仍有很多分歧，但冲突似乎已经避免。"
 amcivwar.3011.a:0 "好歹是躲过一劫……"
 amcivwar.4000.t:0 "与胜选者沟通？"
 amcivwar.4000.d:0 "虽然海伍德是因为众议院才赢得了总统一职，但他在技术方面来说终究是一个民主选举的总统。但他就职前那一系列反资本主义体制的革命言论，仿佛表明他想通过反宪政的方式来实施他的计划，这样一来和他开战对民众而言并不是毫无道理的。尽管如此，如果他愿意承认美国宪法，包括允许最高法院审核他提出的法规中的社会主义要素，即使这不太可能，我们就愿意提供给他某种意义上的同盟关系，而即使他不同意，我们也能占上道德高地。"
 amcivwar.4000.a:0 "至少我们可以去试试"
 amcivwar.4000.b:0 "不与暴君争高下"
 amcivwar.4001.t:0 "太平洋国提议和平"
 amcivwar.4001.d:0 "太平洋国已决定承认我们是1936年选举的胜利者，因此它们愿意与我们结盟。然而，这样做的代价是必须我们同意接受他们的法律的约束，而不巧的是，我们的许多追随者认为，这些法律被严重歪曲了，是为资产阶级服务的，更不会得到我们激进派支持者的赞同。尽管如此，他们的援助将是十分有益的，并且主要由美利坚劳工联合会和独立联盟组成的“社会爱国主义者”派系，热切希望我们接受这饱受工团和极权主义者谴责的协议。"
 amcivwar.4001.a:0 "放屁"
 amcivwar.4001.b:0 "我们必须接受"
 amcivwar.4002.t:0 "提议遭拒"
 amcivwar.4002.d:0 "意料之中的是我们的提议被拒绝了，但是我们好歹尝试过通过理性的手段去求和了。"
 amcivwar.4002.a:0 "奇耻大辱"
 amcivwar.4003.t:0 "提议被接受！"
 amcivwar.4003.d:0 "令人震惊的是，尽管海伍德是个名声在外的激进分子，他还是接受了我们的临时停火提议。然而，社会党中的强硬派显然对这个安排不满意，这让人怀疑停火能否长久持续下去。同样，我们的政客和公民也对该协议做出了反应，尤其是右翼分子们，他们中有一些人拒绝服役于我们。"
 amcivwar.4003.a:0 "这总好过什么都没有"
 amcivwar.4006.t:0 "朗的要求"
 amcivwar.4006.d:0 "朗收到了我们的提议，同意接受宪法约束，但他要求统一后马上举行选举，希望能利用分享财富计划的利好。并且他还呼吁太平洋国领导层宣布，朗正竭尽所能拯救美国民主，希望能允许他开展征募活动。看起来就算是在战争时期，王鱼也没有放弃那些政治把戏。"
 amcivwar.4006.a:0 "仍然接受"
 amcivwar.4006.b:0 "去他的，撤回提议"
 amcivwar.4007.t:0 "西部接受了"
 amcivwar.4007.d:0 "不论那些反对者怎么说，我们都与太平洋国达成了联盟。如此一来，我们便可以合作消灭布拉德利和艾森豪威尔所谓的“西部军指挥中心”，解放的部队可以用于东部战事。"
 amcivwar.4007.a:0 "我太牛逼啦！"
 amcivwar.4008.t:0 "太平洋国谴责我们！"
 amcivwar.4008.d:0 "我们就应该预料到，西部的寡头和官僚，谴责了我们帮助民众的尝试，即便我们索要的是那么的少。他们管朗叫“机会主义者”，他们希望所有美国人都向他们屈服，自大地拒绝承认我们的合法政府，要求我们立刻交出所有部队的指挥权。"
 amcivwar.4008.a:0 "财团们是要抵抗到底了"
 amcivwar.4009.t:0 "和联合工团谈谈？"
 amcivwar.4009.d:0 "尽管赤卫队和一分钟人的关系向来很差，甚至在过去也曾爆发过战斗，但事实上，在国会中的至上党及其盟友也曾就和社会党纲领类似的法案进行过投票，这曾促使双方高层进行过一些积极的沟通，现在可能是我们重拾这些联系的时候了。由于我们不得不应对西部军指挥中心和我们最为敌视的宪政国，军队提醒我们，联盟国已经开始力不从心了，至上党的一名左翼成员默里·马弗里克，趁机提出访问联合工团并试图签订和平条约，因为他们也要面对宪政国和合众国，和我们保持和平对局势有利。自然，查尔斯·库格林、银色军团的领袖威廉·达德利·佩利，以及杰拉尔德·L·K·史密斯都反对这项计划，声称其只会催生出联盟国将士与朗之间的嫌隙，而且左翼分子与反对“财富共享”计划的宪政国及联邦西部军一样，都是我们必须对抗的敌人。"
 amcivwar.4009.a:0 "派出马弗里克"
 amcivwar.4009.b:0 "他们也是我们的敌人"
 amcivwar.4010.t:0 "联盟国提议签订和平条约？"
 amcivwar.4010.d:0 "组建联盟国的朗派联盟代表默里·马弗里克给我们送来了停火协定，他宣称联合工团和联盟国不仅要为了生存而一同战斗，而且双方的相似之处比起意识形态的区别来说更多。虽然这更像是朗为了减轻前线压力全力对付宪政国与西部军指挥中心而提出的，但确实，由于东面的麦克阿瑟、还有南方宪政国对我们特别“关照”带来的破坏，我们现在的处境并不算好。工团主义者们对协议的热情并不算高，支持集体工团主义的工会团结联盟领袖威廉·Z·福斯特将这份协定视作对联合工团必然要击败的“社会资本主义”的无谓让步并予以反对，但议会中的社会爱国主义者正试图推动通过这份协定。我们可以暂时接受这份协定，但议会中的工团主义者如果有自己的算盘的话，他们最后必然会撕毁这份协定。"
 amcivwar.4010.a:0 "我们必须接受……仅限现在"
 amcivwar.4010.b:0 "我们不会和投机取巧者协商"
 amcivwar.4011.t:0 "联合工团拒绝！"
 amcivwar.4011.d:0 "联合工团拒绝了我们的提议，致我们两国于危难之中，至上党右翼的猜测成真了。马弗里克大受打击的同时，军方正试图通过把联合工团称为好战的侵略势力来在北部征兵，可惜收效甚微。"
 amcivwar.4011.a:0 "蠢货，我们都要完蛋了！"
 amcivwar.4012.t:0 "联合工团接受！"
 amcivwar.4012.d:0 "美利坚联合工团接受了这份提案！现在我们能相应的全力对抗西部军指挥中心和美利坚宪政国。当然，马弗里克也警告说，联合工团中的工团分子和极权派激进分子都反对这一协议，将来必然会将其撕毁 。"
 amcivwar.4012.a:0 "这是无奈之举！"
 amcivwar.4013.t:0 "朗拒绝！"
 amcivwar.4013.d:0 "朗本质上只是想要把我们吸纳入他的事业，不可能接受我们的政治派系成为统治阶层。与他的战争似乎不可避免。"
 amcivwar.4013.a:0 "该死的！"
 amcivwar.4014.t:0 "激进分子反对和平条约！"
 amcivwar.4014.d:0 "宪政国颓势已显，大会中的激进派们开始越来越反对我们和朗签订的停火条约。有鉴于此，激进派们开始向政府施压，要求对朗开战，理由是一山不容二虎，就算我们不出手，朗也会先发制人，威胁到革命的未来。他们的想法不无道理，虽然我们可以利用剩余的部分政治力量尽力在大会内争取时间，但战争终究不可避免。"
 amcivwar.4014.a:0 "将和平条约延长一段时间"
 amcivwar.4014.b:0 "马上进攻！"
 amcivwar.4015.t:0 "与联合工团的和平条约被撕毁！"
 amcivwar.4015.a:0 "该死！"
 amcivwar.4015.b:0 "那么现在就进攻他们！"
 amcivwar.4016.t:0 "代表大会否决了和平条约！"
 amcivwar.4016.d:0 "革命代表大会已经完全否决了和平条约并宣布发起针对美利坚联盟国的小资产阶级的革命。他们声称联盟国是效仿民粹主义的煽动者的粪坑，还试图将自己伪装成进步主义者。因此我们要与美利坚联盟国开战了。"
 amcivwar.4016.a:0 "美国革命迫在眉睫！"
 amcivwar.4017.t:0 "与美利坚合众国达成协定？"
 amcivwar.4017.d:0 "尽管我们对反旧民主党反全国民主党白人联盟的麦克阿瑟政权反感不已，但现在联合工团和联盟国已经达成了停火协定，我们现在正处于不利的地位。正因如此西奥多·比尔博拟定了一个200天计划，这项计划将使我们可能与美利坚合众国达成为期200天的互不侵犯条约，直到我们另有所图又或者他们和平地承认我们的权威。"
 amcivwar.4017.a:0 "派出比尔博"
 amcivwar.4017.b:0 "不，他们现在就会被击垮！"
 amcivwar.4018.t:0 "与宪政国达成协定？"
 amcivwar.4018.d:0 "由于联合工团与联盟国近日签署了一项互不侵犯条约，宪政国部长西奥多·比尔博便带着自己的两百天方案找上了我们，提出互相之间先维持两百天的和平，之后再视情况重新商议。虽然我们与宪政国根本不是一路人，但从目前的情况来看，这一提案确实是最优解，因此，理查德·K·萨瑟兰主动请缨去与比尔博协商敲定这份协定。"
 amcivwar.4018.a:0 "我们必须同意"
 amcivwar.4018.b:0 "我们不与恐怖分子谈判！"
 amcivwar.4019.t:0 "美利坚合众国同意了！"
 amcivwar.4019.d:0 "合众国已经接受了这份停火协定，鉴于他们签订时的不情愿，我们似乎不太可能在到期后续签这份停火协定。"
 amcivwar.4019.a:0 "好极了"
 amcivwar.4020.t:0 "美利坚合众国拒绝了！"
 amcivwar.4020.d:0 "美利坚合众国拒绝了这份协定，并要求我们立刻重归合众国。战争似乎已经不可避免。"
 amcivwar.4020.a:0 "该死"
 amcivwar.4021.t:0 "协定到期"
 amcivwar.4021.d:0 "随着我们与美利坚合众国的停火协定到期，看起来我们双方都期望对方在某个时刻屈膝臣服。鉴于双方由于备战而导致边境冲突次数的提升，是时候在他们进攻我们之前先发制人了。"
 amcivwar.4021.a:0 "开战！"
 amcivwar.5000.t:0 "最后的对决！"
 amcivwar.5000.d.AUSPSA:0 "美利坚联盟国和美利坚太平洋国是内战仅存的两个主要势力，而两者都遵守了各自的停火条约内容。现在的问题是如何在双方各自认为自己是美国的合法政府的情况下使美国重归统一。我们的外交官已经向联盟国发送了一份请求进行全国公投的条约，以在双方都在宪法允许的条件下解决这个问题。公投将会由一个投票监察委员会进行监督，防止外部干预，而且输掉那方也会得到比战前美国的状况下更多的自治权，以便充分按照他们自己的意愿来运行其下领地。由于新近被占领的地区在国会尚无代表，所以公投将采用比例代表制来决定这些地区被任命者的数量，从而使获胜的一方有机会实施他们的议程。另一方面，诸如德威特将军和民主党领导人查尔斯·马丁等人认为朗只不过是一个蛊惑人心的政客罢了，给予他在内战之灾后参选进而成为总统的机会是很不道德的行为，遑论这场灾难朗也有一部分责任，综上所述，他们更想要我们直接把朗政权赶下台。"
 amcivwar.5000.d.AUSPSACSA:0 "美利坚联盟国，美利坚联合工团以及美利坚太平洋国是内战仅存的三个主要势力，而三者都遵守了各自的停火条约内容。现在的问题是在三方各自认为自己是美国的合法政府的情况下使美国重归统一。我们的外交官已经向发送了一份请求进行全国公投的条约，以在双方都在宪法允许的条件下解决这个问题。公投将会由一个投票监察委员会进行监督，防止外部干预，而且输掉那方也会得到比战前美国的状况下更多的自治权，以便充分按照他们自己的意愿来运行其下领地。由于新近被占领的地区在国会尚无代表，所以公投将采用比例代表制来决定这些地区被任命者的数量，从而使获胜的一方有机会实施他们的议程。另一方面，国会的大量人士认为这些政权只不过是见势不妙才选择停火的激进派，我们应该强令他们屈服，不然通过公投达成的统一将会使我们在战争中付出的努力全部白费，不过也有一些声音认为，通过民主的，和平的方式而不是争斗来解决问题是刻在我们美国传统中的。"
 amcivwar.5000.d.CSAPSA:0 "美利坚太平洋国和美利坚联合工团是内战仅存的两个主要势力，而两者都遵守了各自的停火条约内容。现在的问题是如何在双方各自认为自己是美国的合法政府的情况下使美国重归统一。我们的外交官已经向联合工团发送了一份请求进行全国公投的条约，以在双方都在宪法允许的条件下解决这个问题。公投将会由一个投票监察委员会进行监督，防止外部干预，而且输掉那方也会得到比战前美国的状况下更多的自治权，以便充分按照他们自己的意愿来运行其下领地。由于新近被占领的地区在国会尚无代表，所以公投将采用比例代表制来决定这些地区被任命者的数量，从而使获胜的一方有机会实施他们的议程。另一方面，大多数太平洋国民认为联合工团只是一群狂热分子，这些人虽然嘴上说着进行内部改革，却成为了内战的首犯，更别说要是他们赢得了公投，他们就更不会懂得妥协让步了。言而简之，我们应该让他们屈服而不是搞什么破公投。"
 amcivwar.5000.a:0 "发送提议"
 amcivwar.5000.b:0 "朗的一分钟人必须让步"
 amcivwar.5000.c:0 "他们双方都必须让步"
 amcivwar.5000.e:0 "海伍德必须做出让步"
 amcivwar.5001.t:0 "太平洋国要求我们做出让步！"
 amcivwar.5001.d.AUSPSA:0 "太平洋国要求我们下台，他们声称内战的爆发我们是负有部分责任的，并且我们的政权只是临时政府而已。他们声称如果我们投降，将大赦我方要员，但这显然意味着朗和他的盟友政治生命之终结，而这是我们显然不能接受的。有感于受到背叛，联盟国中的激进派分子已经开始呼吁我们发动袭击。"
 amcivwar.5001.d.AUSPSACSA:0 "太平洋国要求我们下台，他们声称内战的爆发我们是负有部分责任的，并且我们的政权只是临时政府而已。他们声称如果我们投降，将大赦我方要员，但这显然意味着美利坚真正社会主义之终结，而这是我们显然不能接受的。随着强硬派的猜想获得证实，他们已经开始呼吁对资本主义猪猡政权联盟国和太平洋国全面开战以解决这烂摊子，且大会和军方也不再抵制这样的呼吁。"
 amcivwar.5001.a:0 "叛匪！"
 amcivwar.5001.b:0 "与朗保持和平"
 amcivwar.5002.t:0 "太平洋国的提议！"
 amcivwar.5002.d.AUSPSA:0 "太平洋国刚刚提出，考虑到我们在内战之中是盟友，而且联盟国或多或少也亲民主，他们愿意抛开对民粹主义的个人保留意见，提出举行全民公投，决定最终由谁掌控新国家，而无论赢家是谁，另一方都将成为国家政府的主要合作伙伴。同样，由于只有少数最高法院法官仍然健在和可信，胜利的一方无疑能掌控最高法院，这也允许我们根据全民投票结果，通过非正式的比例代表制来决定占领地区的划分。部分一分钟人干部认为，这是西海岸银行界和政治精英借此契机，重夺政治制度的主导地位，阻碍我方的民粹主义理想，他们呼吁我们现在就拒绝，并反过来要求他们屈膝于人民的意愿。"
 amcivwar.5002.d.AUSPSACSA:0 "太平洋国刚刚提出，考虑到我们在内战之中是盟友，而且联盟国和联合工团或多或少也亲民主，他们愿意抛开对民粹主义的个人保留意见，提出举行全民公投，决定最终由谁掌控新国家，而无论赢家是谁，另一方都将成为国家政府的主要合作伙伴。同样，由于只有少数最高法院法官仍然健在和可信，胜利的一方无疑能掌控最高法院，这也允许我们根据全民投票结果，通过非正式的比例代表制来决定占领地区的划分。部分一分钟人干部认为，这会使西海岸银行界和政治精英借此契机，重夺政治制度的主导地位，同时联合工团内部仍存在大量危险的极端分子渴望联盟国的覆灭，他们呼吁我们现在就突袭联盟国和联合工团。"
 amcivwar.5002.d.CSAPSA:0 "太平洋国刚刚提出，考虑到我们在内战之中是盟友，而且联合工团或多或少也亲民主，他们愿意抛开对民粹主义的个人保留意见，提出举行全民公投，决定最终由谁掌控新国家，而无论赢家是谁，另一方都将成为国家政府的主要合作伙伴。同样，由于只有少数最高法院法官仍然健在和可信，胜利的一方无疑能掌控最高法院，这也允许我们根据全民投票结果，通过非正式的比例代表制来决定占领地区的划分。很多工团主义同志认为这只是西部布尔乔亚毫无意义的自救，赤旗终将插遍世界！他们极力鼓动我们去向太平洋国发起进攻，同时他们认为向太平洋国妥协与投降无异。"
 amcivwar.5002.a:0 "行吧"
 amcivwar.5002.b:0 "结果他们"
 amcivwar.5003.t:0 "朗同意了"
 amcivwar.5003.d:0 "朗接受了我们的提议，现在我们共同组建了一个委员会来监督与开展全民公投。绝大部分公民都热切期盼内战的结束，虽然一些强硬派对此有些不高兴。"
 amcivwar.5003.a:0 "好"
 amcivwar.5004.t:0 "联合工团接受！"
 amcivwar.5004.d:0 "谢天谢地，联合工团接受了我们的和平提议。尽管更为极端的左翼派系十分不满，但工团人民显然和我们一样厌倦了战争，社会爱国主义者和和平主义派系在代表大会占了上风。"
 amcivwar.5004.a:0 "好极了"
 amcivwar.5005.t:0 "公投开始"
 amcivwar.5005.d:0 "全国公投已经开始，所有参选党派都充分利用他们的竞选技巧和政治机器，要么试图把自己吹捧为恢复稳定，维护自由和正义的守护者，要么就声称要制定全新的美国路线，以确保另一场内战和战前的社会不公不会再发生。"
 amcivwar.5005.a:0 "我们最好能赢"
 amcivwar.5006.t:0 "结果出炉！"
 amcivwar.5006.d:0 "决定联邦政府领袖的公投结果终于出来了，各个政权暂时搁置了他们的正统性决定接受公投的结果。最终的胜利者是："
 amcivwar.5006.a:0 "美利坚太平洋国"
 amcivwar.5006.b:0 "美利坚联盟国"
 amcivwar.5006.c:0 "美利坚联合工团"
 amcivwar.5007.t:0 "最后的对决！"
 amcivwar.5007.d:0 "好像我们和工团壬都进了美国内战决赛圈，这倒有点尴尬了，因为我们先前签订了和平协议，所以没有办法一决雌雄。默里·马弗里克，就那个成功达成第一次和平协议的人提出了另一项提议，即投票通过一部“更包容”的宪法，让国家重新团结起来，也让政府有更大的干预经济与修宪的权力。接着进行当前各派人马的选举，以决定国家的领导人。为了确保双方能够公平竞争，我们将成立民主委员会来阻止贿选现象……至少，是阻止彼此之外的。但右翼人士谴责了该计划，并指出，如果我们败选，我们将把国家拱手交给工团壬，最初反对和平条约的人呼吁我们在社会党没有任何准备的情况下突袭他们。"
 amcivwar.5007.a:0 "民主是美国的道路"
 amcivwar.5007.b:0 "这个国家绝不能被赤匪侵占"
 amcivwar.5008.t:0 "联盟国提议签订和平条约！"
 amcivwar.5008.d:0 "我们的国会仍然对如何处理联盟国的问题感到困惑，但当联盟国外交官，美利坚至上党左派成员默里·马弗里克的出现，我们的选择似乎变得更加明确了。他提议双方通过一部“扩大”的宪法来实现各自的改革，并在所有政党之间进行一场新的全国选举。工团主义者和其他国会中的激进派对此并不感兴趣，但社会爱国主义者和白劳德主义者却钟情于这个提议。当然，凭借我们对工业的控制，不论如何，我们都将终结美利坚至上党——这一被许多社会党成员认为是小资产阶级蛊惑人心和腐败的顽固堡垒。"
 amcivwar.5008.a:0 "接受提议"
 amcivwar.5008.b:0 "社会主义才是唯一的胜利者"
 amcivwar.5009.t:0 "竞选活动开始！"
 amcivwar.5009.d:0 "联合工团已经接受了我们的提议，在各党派陆续加入后，竞选活动将立即开始。双方都急于向被占领地区的有选举权的公民提供救济和宣传，并忙着清除那些与敌对政权有联系且最不可能支持他们的人。尽管如此，民主委员会仍能确保没有人能在他们的控制区外搞阴谋诡计，甚至搞到彼此产生严重对立的程度。与此同时，一方无法接受的另一方的党内势力将不续参选，不过他们还是会对政局产生一定影响，就像联合工团一方有厄尔·白劳德重组的美国共产党和联盟国一方的美利坚银色军团一样。"
 amcivwar.5009.a:0 "就这样吧"
 amcivwar.5010.t:0 "结果出炉！"
 amcivwar.5010.d:0 "决定联邦政府领袖的公投结果终于出来了，各个政权暂时搁置了他们的正统性决定接受公投的结果。最终的胜利者是："
 amcivwar.5010.a:0 "美利坚联合工团"
 amcivwar.5010.b:0 "美利坚联盟国"
 amcivwar.8000.t:0 "与胜选者沟通？"
 amcivwar.8000.d:0 "虽然休伊·朗是因为众议院才赢得了总统一职，但他在技术方面来说终究是一个民主选举的总统。但他就职前那一系列反对“寡头公司制度”的民粹言论，仿佛表明他想通过反宪政的方式来实施他的计划，这样一来和他开战对民众而言并不是毫无道理的。尽管如此，如果他愿意承认美国宪法，包括允许最高法院审核他提出的法规，我们就愿意提供给他某种意义上的同盟关系，考虑到朗的泛美团结情怀以及渴望获得进步派势力的支持，他很可能会同意，即使他不同意，我们也能占上道德高地。"
 amcivwar.8000.a:0 "至少我们可以去试试"
 amcivwar.8000.b:0 "不与暴君争高下"
 amcivwar.8001.t:0 "太平洋国提议和平"
 amcivwar.8001.d:0 "太平洋国已决定承认我们是1936年选举的胜利者，因此它们愿意与我们结盟。然而，这样做的代价是必须我们同意接受他们的法律的约束，而不巧的是，我们的许多追随者认为，这些法律被严重歪曲了，是为资产阶级服务的，更不会得到我们激进派支持者的赞同。尽管如此，太平洋国的援助将是十分有益的，并且主要由劳工联合会和独立联盟组成的“社会爱国主义者”派系，热切希望我们接受这饱受工团和极权主义者谴责的协议。"
 amcivwar.8001.a:0 "当然，他们也是我的人民"
 amcivwar.8001.b:0 "不，他们只能直接加入我们！"
 amcivwar.1015.t:0 "与胜选者沟通？"
 amcivwar.1015.d:0 "虽然默里是因为众议院才赢得了总统一职，但他在技术方面来说终究是一个民主选举的总统。但他就职前那一系些敌视“北方投机佬”制度的反动言论，仿佛表明他想通过反宪政的方式来实施他的计划，这样一来和他开战对民众而言并不是毫无道理的。尽管如此，如果他愿意承认美国宪法，包括允许最高法院审核他提出的法规，即使默里不太可能允许西海岸的自由派们腐蚀他的反革命，我们就愿意提供给他某种意义上的同盟关系，而即使他不同意，我们也能占上道德高地。"
 amcivwar.1015.a:0 "至少我们可以去试试"
 amcivwar.1015.b:0 "不与暴君争高下"
 amcivwar.1016.t:0 "太平洋国提议和平"
 amcivwar.1016.d:0 "太平洋合众国决定承认，我们是1936年选举的胜利者，因此，他们愿意与我们结盟。然而若是结盟，我们就不得不被他们的许多法律所束缚，其中包括宪法，而大多数旧民主党人认为这部宪法已经遭受了近100年的扭曲，使得美国被迫要为世界各地的银行家、犹太人和左派利益而服务。因此，几乎我们所有的内阁成员都反对此次结盟，声称这将使默里失去任何合法性，又或者我们可以用加入宪政国为交换条件，因为他们绝不可能同意，所以这基本上等于另一种拒绝交易的方式，而且能使他们看起来才是不讲道理的一方。"
 amcivwar.1016.a:0 "直接拒绝"
 amcivwar.1016.b:0 "提出要求"
 amcivwar.1016.c:0 "我才不管内阁说毛线，我同意"
 amcivwar.1017.t:0 "提议遭拒"
 amcivwar.1017.d:0 "意料之中的是我们的提议被拒绝了，但是我们好歹尝试过通过理性的手段去求和了。"
 amcivwar.1017.a:0 "奇耻大辱"
 amcivwar.1018.t:0 "旧民主党内乱！"
 amcivwar.1018.d:0 "旧民主党人对我们居然对敌人妥协感到愤怒。他们说，我们应该立即撤销这笔交易，命令太平洋国乖乖被我们吞并，因为宪政国才是唯一合法的政府。否则，党代表们将投票选出新国家元首，真正能代表所有爱国者的信仰的元首。虽然理论上来说，行政权力都操之于默里一人之手，但他的政权尚未稳定下来，在近来才成立的宪政国内部有太多兴风作浪的派系。很明显，默里还没有足够的手段应对党内多数上层成员的反对，对于那些因为默里迎娶土著女性而不满的极端强硬种族主义者来说，这次是罢免他的完美借口。然而，尽管默里对党内同伴的背叛感到痛苦，但他在佐治亚州参议员小理查德·拉塞尔身上找到了和自己相似的精神。虽然拉塞尔是民主党人，但他还是设法借全州最有权势的人这一身份在宪政国占据了强有力的政治地位，他承诺，如果默里同意他成为宪政国的下任领导人，他会延续默里的愿景。"
 amcivwar.1018.a:0 "接下来要有一场愚蠢的战争了，我走了"
 amcivwar.1018.b:0 "得了，我拒绝交易行了吧"
 amcivwar.1019.t:0 "新党魁"
 amcivwar.1019.d:0 "很明显，我们不能让默里接受和太平洋国的交易，因为如果把主权拱手让给太平洋国官僚，几乎所有我们的支持者，特别是白人联盟，都不会再支持我们了。尽管如此，虽然我们会让默里低调退休，并声称这是出于健康问题，但我们仍然需要新的党领导人。两大党内主要派系此时出面争夺权势。第一个是国家民主党，由查尔斯·林德伯格和亨利·福特领导的旧民主党内部派系，代表以城市为中心的部分旧民主党，声称他们可以在继承旧民主党遗产的同时，为战争提供重工业支持。第二个是全国民主党白人联盟，由各种准军事组织、社团和其他支持旧民主党的激进组织组成，也就是主要是三K党及其各种辅助组织和分支。他们声称他们能够提供一切力量和支持来帮助宪政国赢得战争，而确实没有人怀疑他们会不惜一切代价将美国置于白人新教统治之下的愿望。再加上白人联盟控制着我们的情报部门和人力资源，使他们成为一支不可忽视的力量。三K党领导人（事实上也是白人联盟最有权势的成员）威廉·约瑟夫·西蒙斯是一位受欢迎的领导人人选。当然，党内有人提出了第三种选择，就是支持巴顿将军出任新的国家元首，让他继承旧民主党的传统。最终的选择权落在副总统约翰·E·兰金身上，虽然党内已经明确表示众议院不允许他担任总统，但他在旧民主党的权势允许他在派系分裂之时成为拥王者。"
 amcivwar.1019.a:0 "林德伯格，我们的青年之星"
 amcivwar.1019.b:0 "我们必须支持西蒙斯"
 amcivwar.1019.c:0 "一起支持巴顿吧"
 amcivwar.13.b:0 "无论如何，他都是我们的总统"
 amcivwar.1300.t:0 "美利坚陷入紧张对峙"
 amcivwar.1300.d:0 "共和党人已经没法再控制美国的现状，军队闯入他的办公室将其罢免，许多州长已不再承认联邦政府的合法性，要么投靠南方民粹主义者休伊·朗，要么转向工团主义运动家比尔·海伍德。尽管现在他们还只是拒绝履行来自联邦政府的命令，尚未正式脱离联邦。但他们已经要求当前的领导人麦克阿瑟宣布辞职，在他们选举产生的领导人的统治下建立“全国和解委员会”，恢复美国脆弱的政治秩序。作为回应，麦克阿瑟要求他们在三十天内集体辞职。不到一个世纪之前，这个国家曾经历过一场血腥的内战，而现在，这只可怖的幽灵似乎又要降临了。"
 amcivwar.1300.a:0 "我明白了"
 amcivwar.260.t:0 "第二次美国内战落幕"
 amcivwar.260.d.noceasefire:0 "南方已定，工团祸患尽除，此等动摇国本之患皆已荡平。开国元勋睿构之宏制再渡劫波，民众当可暂享承平之世。"
 amcivwar.260.d.ceasefire:0 "南方已定，工团祸患尽除，此等动摇国本之患皆已荡平。虽太平洋国仍踞守停火线以西，山河未复，然开国元勋睿构之宏制再渡劫波，民众当可暂享承平之世。"
 amcivwar.260.a:0 "乱臣贼子万劫不复，星条笙旗冉冉升起！"
 amcivwar.2600.t:0 "第二次美国内战落幕"
 amcivwar.2600.d.noceasefire:0 "南方确实已经再次崛起，但这一次，国家的其他地区也在抵制那些要征服我们的人。狼狈为奸的朗和海伍德左翼威胁已被粉碎，与旧政府结盟的银行家叛徒也被粉碎。这些对美国生活方式的威胁已经被摧毁，现在是时候修正曾经的错误，将这个国家重建为本来的面目了。"
 amcivwar.2600.d.ceasefire:0 "南方确实已经再次崛起，但这一次，国家的其他地区也在抵制那些要征服我们的人。狼狈为奸的朗和海伍德左翼威胁已经被扫入了历史的垃圾桶，与旧政府结盟的银行家叛徒也被粉碎。虽然所谓的太平洋国也仍在停火线对面等待着我们，但这场战争已经向世人证明，由开国元勋们如此明智地设计的伟大制度经受住了另一个威胁。现在，全国人民都为此欢欣鼓舞，庆祝一个和平的新时代。"
 amcivwar.2600.a:0 "信仰帮助我们跨越风浪！"
 amcivwar.32.b:0 "社会爱国主义者的计划"
 amcivwar.32.c:0 "集体主义者的计划"
 amcivwar.32.e:0 "集权派的计划"
 amcivwar.35.b:0 "减少女性士兵数量"
 amcivwar.36001.t:0 "社会爱国主义者要求选举！"
 amcivwar.36001.d:0 "受社会爱国主义影响强烈的军队要求我们用传统投票制度来决定大会席位，但这只是偏袒他们自己的派系！他们声称把选民排除在选举进程之外是不民主的，并声称我们在操纵选举进程以权谋私。虽然世界产业工人联盟对军方的要求感到不满，但其他人声称我们应该顾虑军方的意见。"
 amcivwar.36001.b:0 "好极了"
 amcivwar.36002.t:0 "军方接管！"
 amcivwar.36002.d:0 "巴特勒和他的军事集团谴责革命大会排挤他们决议，强行闯入大会，宣布大会席位应由传统投票决定。在巴特勒的领导下，社会爱国主义者通过“团结法案”特赦了许多原本涉嫌叛国的公民，博取了大量支持，巩固了自己的地位。不过，他们倒是无意强迫将世界产业工人联盟和激进左派赶出代表大会。"
 amcivwar.36001.a:0 "不"
 amcivwar.36003.t:0 "工团主义主导"
 amcivwar.36003.d:0 "代表大会里的社会爱国主义者最终没能在扩大影响力的同时削弱激进左派的影响力。代表大会的多数席位仍由工团主义者控制，很明显，社会爱国主义者将不得不在革命中退居次要地位，他们现在只希望尽可能地博取利益和对工会的影响力，以支持他们在地方的权力基础，嘉奖安抚自己的成员。"
 amcivwar.36003.a:0 "革命安全了！"
 amcivwar.3600.t:0 "社会爱国主义者提出团结法案！"
 amcivwar.3600.d:0 "社会爱国主义者提出了一项充满争议的法案“团结法案”，他们认为即使有人曾经扮演过资本主义代言人的角色，只要现在在内战中支持我们，就能获得特赦。此外，那些现在被视为“政治面貌可疑”的人如果参军或加入工会，也将获得特赦。当然，激进派强烈反对这项法案，认为那些人太危险了，不能轻易容许他们拥有如此大的权力和影响力，应在内战结束前他们应该被软禁或者劳动改造，取决于犯下的罪行有多深重。"
 amcivwar.3600.a:0 "通过法案"
 amcivwar.3600.b:0 "驳回"
 amcivwar.3601.t:0 "工会团结联盟的最后通牒"
 amcivwar.3601.d:0 "福斯特率领的工会团结联盟对我们越来越亲近社会爱国主义者，频繁采纳他们的制度十分不满。福斯特派和激进工团主义者感觉到他们在代表大会被边缘化，于是在街头发表演讲，声称是时候在“联合工团被反动派窃取之前”终结[CSA.GetLeader]和社会爱国主义者的影响了。福斯特威胁我们，如果我们不任命福斯特派担任政府职务，扩大工会团结联盟和（他的新盟友）世界产业工人联盟在代表大会的席位，避免社会爱国主义者夺取政权的可能的话，他们就会立刻行动。"
 amcivwar.3601.a:0 "我们必须安抚福斯特"
 amcivwar.3601.b:0 "对抗福斯特的威胁！"
 amcivwar.3602.t:0 "削弱工会团结联盟"
 amcivwar.3602.d:0 "由于军方干涉，工会团结联盟在过去数周里的集会频繁遭到打断，许多民兵与效忠派都神秘地遭受暴力而死，福斯特别无选择，只能顺从巴特勒今天对他的直接警告，同意只要我们停止再针对工会团结联盟，他就在内战结束后辞职，自然地放弃权力。"
 amcivwar.3602.a:0 "好"
 amcivwar.3603.t:0 "社会爱国主义者掌权"
 amcivwar.3603.d:0 "社会爱国主义者如今在代表大会中的地位越来越高，民众的支持率也跟着水涨船高，世界产业工人联盟也不复当年风光，让激进左派感到震惊的是，社会爱国主义者已经把持了代表大会，正在通过各种有利于他们派系的法案。"
 amcivwar.3603.a:0 "怎么可能会这样？"
 amcivwar.3604.t:0 "激进左派叛乱！"
 amcivwar.3604.d:0 "一小部分左翼激进分子竟然因为社会爱国主义者取得权力而做出危及整个联合工团的事情。一批集体工团主义者、“加莱亚尼派”无政府主义者以及激进无政府共产主义者已经组织起来，自称为革命先锋队，在各个城市建立了小据点，设置了封锁线。福斯特手下的工会团结联盟也有许多人投奔他们，并警告我们要是不立刻让出政权，他们就会发动起义。然而，虽然他们的行径对我们来说如芒在背，但这并没有危及民众对我们的支持，而且他们的行为危害了联合工团的安危，因此激怒了许多工团主义者，甚至有许多没去投奔他们的工会团结联盟成员脱离了福斯特阵营。我们可以重拳出击结束他们的威胁，但结果无疑会流不少血。"
 amcivwar.3604.a:0 "送他们上天！"
 amcivwar.3605.t:0 "激进派被击溃！"
 amcivwar.3605.d:0 "激进左派的叛乱已经被粉碎，我们的地位也随之巩固。即使许多工会团结联盟领导人似乎已经逃去了法兰西公社，但我们仍然算是胜利了。随着社会爱国主义者通过立法建立起更传统的民主制度，使非工会选民更容易影响选举结果，国家的未来似乎稳固地掌握在他们手中。不过世界产业工人联盟仍然是一支掌管地方工团的势力，没有他们，我们要继续战争是不可能的。"
 amcivwar.3605.a:0 "好极了"
 amcivwar.3606.t:0 "军方要求大赦！"
 amcivwar.3606.d:0 "叛乱已经被镇压，但是一部分受到集体主义影响的军队对叛乱者表示同情，他们要求特赦幸存的叛乱者，特别是福斯特的得力助手尤金·丹尼斯，说他们只是感觉被我们边缘化且不再受到尊重，所以才铤而走险。"
 amcivwar.3606.a:0 "好，准了"
 amcivwar.3606.b:0 "我不这么认为"
 amcivwar.3607.t:0 "福斯特派政变！"
 amcivwar.3607.d:0 "杰克·舒尔曼带领受到集体主义影响的一部分军队擅自释放了遭到监禁的，包括尤金·丹尼斯在内的一众工会团结联盟激进派。如今，福斯特派的军队已经打响了第一枪，很明显，是福斯特亲自指挥，许多畏惧的社会爱国主义者要么同意下台辞职，要么直接逃离了联合工团。"
 amcivwar.3607.a:0 "我们完了"
 amcivwar.3608.t:0 "军方要求支持世界产业工人联盟！"
 amcivwar.3608.d:0 "支持世界产业工人联盟的一部分军队对社会爱国主义者独霸代表大会感到不安，呼吁达成政治上的妥协，给予工团和公社更大的地方权力，以保护他们不受我们新法律的过度影响。当然，这种权力下放会削弱我们。"
 amcivwar.3608.a:0 "同意"
 amcivwar.3608.b:0 "不能接受"
 amcivwar.3609.t:0 "工团主义者政变"
 amcivwar.3609.d:0 "在大比尔·海伍德的领导下，世界产业工人联盟联合部分军队发动政变，恢复了海伍德原来的行政权力，并谴责社会爱国主义者动用不民主的手段操弄政治。社会爱国主义者对政变表示了强烈谴责，但美利坚劳工联合会民兵的回击已经失败。我们现在可以选择放过社会爱国主义者一马，让他们继续留在代表大会，条件是他们必须接受我们的领导，或者清洗社会爱国主义者。福斯特呼吁进行清洗，但多萝西·戴更倾向于大赦，她声称大会民主在美国是稚嫩的产物，在这种情况下，错误和混乱或许是不可避免的，实施清洗无疑是资本主义民主下镇压行动的重演。"
 amcivwar.3609.a:0 "清除他们"
 amcivwar.3609.b:0 "用大赦换效忠"
 amcivwar.3610.t:0 "社会爱国主义者巩固权力"
 amcivwar.3610.d:0 "社会爱国主义者在代表大会已占据了主导地位，无政府主义者如今只能龟缩在自己的自治公社里，而世界产业工人联盟剩下的存在意义就只有在某些投票僵持的时候充当最后的砝码。白劳德带领的社会党集权派和詹姆斯·伯纳姆的工人党背离了自己的阵营，与社会爱国主义者结盟，通过立法大大削弱了激进左派以及海伍德的行政权力，也让赤卫队脱离了工团的控制。工会代表制被地域代表制取而代之，因此非工会成员甚至包括中产阶级都能更直接地影响现在的选举，这成了终结世界产业工人联盟影响力的最后一手妙招。现在看来，社会爱国主义者已经登上了舞台，剩下的只有在内战结束后解决他们自己内部的分歧了。"
 amcivwar.3610.a:0 "看来有时候鲤鱼也能跃龙门"
 amcivwar.50.a:0 "“微笑杰克”雅各布·德弗斯"
 amcivwar.800.t:0 "总参谋长"
 amcivwar.800.d:0 "随着内战的临近，宪政国和白人联盟领导人在亚特兰大召开了紧急会议，默里总统不得不在三位候选人中选择一位作为军队的总参谋长。乔治·范·霍恩·莫斯利是三位中作战经验最足的，还得到了福特派和白人联盟主流成员的大力支持。不过，也有人担心任命莫斯利会让福特派势力过于庞大，因此提出备选项，任命新泽西三K党巨龙亚瑟·霍恩布伊·贝尔为总参谋长。然而，旧三K党派系和黑色军团对贝尔的意识形态倾向表示了怀疑，并争辩说最适合这个位置的应该是弗吉尔·“伯特”·埃芬格。"
 amcivwar.800.a:0 "乔治·范·霍恩·莫斯利"
 amcivwar.800.b:0 "亚瑟·霍恩布伊·贝尔"
 amcivwar.800.c:0 "弗吉尔·埃芬格"
 amcivwar.801.t:0 "陆军参谋长"
 amcivwar.801.d:0 "内战已经迫在眉睫，而我们却没有陆军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。在选定总参谋长后，沟通仍在继续，我们必须任命一位陆军参谋长来打赢这场战争。"
 amcivwar.801.a:0 "詹姆斯·C·布雷肯里奇"
 amcivwar.801.b:0 "乔治·巴顿"
 amcivwar.802.t:0 "空军参谋长"
 amcivwar.802.d:0 "内战已经迫在眉睫，而我们却没有空军参谋长这一事实引起了政界和军方各大领导人物的普遍担忧。在选定陆军参谋长后，沟通仍在继续，我们必须任命一位空军参谋长来打赢这场战争。"
 amcivwar.802.a:0 "伯特·霍尔"
 amcivwar.802.b:0 "查尔斯·林德伯格"
 amcivwar.802.c:0 "马丁·詹姆斯·蒙蒂"
 amcivwar.900.t:0 "投身战火"
 amcivwar.900.d:0 "艾森豪威尔和布拉德利发现自己正面临着美国军队有史以来的最大挑战之一……甚至没有之一。他们所控制的土地基本上是巨大的落基山脉和西南沙漠，四面也被新出现的敌人所包围，下辖的大片土地几乎完全未被开发。对他们和他们的士兵来说，很明显，并无多少胜算。考虑到这一点，布拉德利已紧急开始重组他麾下的部队，以适应当前恶劣的形势，并充分利用手头的微薄资源和他忠诚而专业的部队的优越训练把握生机。将当地执法部门、公园巡查员和任何有资格的人纳入军队中央指挥部的倡议已经提出。如果西部军指挥中心能够坚持下去，他们将把美利坚的至暗之时变为至耀一刻。"
 amcivwar.900.a:0 "祝愿成功"
 amcivwar.901.t:0 "征募工作"
 amcivwar.901.d:0 "对西部军指挥中心为数不多的利好消息之一是来自当地民众的支持。西部军领土上的公民已经开始为战争进行动员。然而，前线居高不下的损失意味着即使全数投入我们招募的预备队也远远不够。艾森豪威尔将开始与当地领导人起草一系列计划，以挖掘一切可能的人力来源。然而，前美利坚军团指挥官阿尔文·M·奥斯利要求立即开始大规模征兵，基本上所有能开枪的人都应被征募。目前在麦克阿瑟的指挥部中担任有效“东部司令部传声筒”的乔治·肯尼将军也支持这一做法。但一些文官领袖，如犹他州州长亨利·H·布拉德已经得知了奥斯利的要求，正反对这种激进的命令——尽管情势十万火急。"
 amcivwar.901.a:0 "立刻增加征召"
 amcivwar.901.b:0 "支持布拉德"
 amcivwar.902.t:0 "征募工作"
 amcivwar.902.d:0 "自从与布拉德州长站在一起后，奥斯利就在质疑我们对联邦政府的承诺，并表示若要赢得这场战争，需要领导层和普通民众不惜一切代价恢复美利坚的秩序。来自东部麦克阿瑟的电报也表明他支持奥斯利，但麦克阿瑟目前对布拉德利缺乏任何实质的权威，而且消息到达得太晚，无法影响布拉德利的任何决定。"
 amcivwar.902.a:0 "战争已经足够艰辛了"
 amcivwar.311.b:0 "不可能"
 amcivwar.503.t:0 "支持黑带？"
 amcivwar.503.d:0 "伪宪政国政府在战争期间显然在控制黑带方面遇到了一些麻烦，导致了当地起义军，特别是激进分子，请求我方帮助他们的起义行动。虽然我们可能为此付出高昂的代价，但这些人将破坏伪宪政国政府对该地区的控制。"
 amcivwar.503.a:0 "打钱过去"
 amcivwar.503.b:0 "拒绝"
 amcivwar.504.t:0 "支持黑带？"
 amcivwar.504.d:0 "伪宪政国政府在战争期间显然在控制黑带方面遇到了一些麻烦，导致了当地起义军，特别是激进分子，请求我方帮助他们的起义行动。虽然我们可能为此付出高昂的代价，但这些人将破坏伪宪政国政府对该地区的控制。"
 amcivwar.504.a:0 "打钱过去"
 amcivwar.504.b:0 "拒绝"
 amcivwar.505.t:0 "黑带提议重新整合"
 amcivwar.505.d:0 "如果我们给予他们更多的自治权，确保美国黑人的平等权利，建立一个致力于确保平等雇佣权的政府机构，非法化且取缔白人联盟，并“重建”黑带，黑带就愿意重新融入美国。虽然代价昂贵，但这可能是值得的。不过另一方面，我们也可以用武力夺取他们的土地。"
 amcivwar.505.a:0 "同意"
 amcivwar.505.b:0 "开战！"
 amcivwar.607.d.lives:0 "看来在美国内战中，联邦政府已经奄奄一息了。它的大部分土地已经被[annex_to.GetNameDef]和其他势力分食，联邦政府现在只剩下最后的几支残军了——他们士气低落，每天都有大量逃兵，但仍不顾一切坚持着，希望出现奇迹来拯救他们。一些联邦领导人正同[annex_to.GetAdjective]将军们会晤，就他们不可避免的完全投降的条件进行谈判。"
 amcivwar.607.d.falls:0 "今天，联邦政府在美国内战中垮台的消息迅速传开。以前在它控制下的土地已经被美国的其他派系吞并了，据报道，最后残余的联邦领导人正同[annex_to.GetNameDef]的将军会晤，以协商他们完全投降的条件。[USA.GetLeader]的下落。目前不明，但据信他已经被逮捕。看来，美国的未来掌握在摧毁联邦政府的各派手中了。"
 amcivwar.608.d.lives:0 "看来在美国内战中，联合工团政府已经奄奄一息了。它的大部分土地已经被[annex_to.GetNameDef]和其他势力分食，联合工团现在只剩下最后的几支残军了——他们士气低落，每天都有大量逃兵，但仍不顾一切坚持着，希望出现奇迹来拯救他们。一些工团领导人正同[annex_to.GetAdjective]将军们会晤，就他们不可避免的完全投降的条件进行谈判。"
 amcivwar.608.d.falls:0 "今天，[CSA.GetNameDef]在美国内战中垮台的消息迅速传开。以前在它控制下的土地已经被美国的其他派系吞并了，据报道，最后残余的工团领导人正同[annex_to.GetNameDef]的将军会晤，以协商他们完全投降的条件。[CSA.GetLeader]的下落。目前不明，但据信他已经被逮捕。看来，美国已不再有陷入工团主义之中的危险了。"
 amcivwar.609.d.lives:0 "看来在美国内战中，联盟国政府已经奄奄一息了。它的大部分土地已经被[annex_to.GetNameDef]和其他势力分食，联盟国现在只剩下最后的几支残军了——他们士气低落，每天都有大量逃兵，但仍不顾一切坚持着，希望出现奇迹来拯救他们。一些联盟国领导人正同[annex_to.GetAdjective]将军们会晤，就他们不可避免的完全投降的条件进行谈判。"
 amcivwar.609.d.falls:0 "今天，联盟国政府在美国内战中垮台的消息迅速传开。以前在它控制下的土地已经被美国的其他派系吞并了，据报道，最后残余的联盟国领导人正同[annex_to.GetNameDef]的将军会晤，以协商他们完全投降的条件。[TEX.GetLeader]的下落。目前不明，但据信他已经被逮捕。看来，美国已不再有被[TEX.GetNameDef]的激进意识形态动摇的威胁。"
 amcivwar.610.d.lives:0 "看来在美国内战中，太平洋国政府已经奄奄一息了。它的大部分土地已经被[annex_to.GetNameDef]和其他势力分食，太平洋国府现在只剩下最后的几支残军了——他们士气低落，每天都有大量逃兵，但仍不顾一切坚持着，希望出现奇迹来拯救他们。一些太平洋国领导人正同[annex_to.GetAdjective]将军们会晤，就他们不可避免的完全投降的条件进行谈判。"
 amcivwar.610.d.falls:0 "今天，太平洋国政府在美国内战中垮台的消息迅速传开。以前在它控制下的土地已经被美国的其他派系吞并了，据报道，最后残余的太平洋国领导人正同[annex_to.GetNameDef]的将军会晤，以协商他们完全投降的条件。[CAL.GetLeader]的下落。目前不明，但据信他已经被逮捕。看来，美国的未来掌握在摧毁太平洋国的各派手中了。"
 amcivwar.619.t:0 "黑色军团恐怖活动"
 amcivwar.619.d:0 "黑色军团是最为极端的白人联盟成员，他们认为当今主流的三K党过于温和，哈肯回到了弗雷斯特将军和白人联盟组织（如本杰明·蒂尔曼的红衫军）领导下的最初的三K党。怀抱这种理念的他们和其盟友被昵称为“旧三K党”。本来就是我们眼中钉的黑色军团近来更是在我国流窜，袭击官员与平民，甚至有时规模较大地，袭击我们的后勤补给线，必须要对他们重拳出击了。"
 amcivwar.619.a:0 "疯子！"
 amcivwar.619.b:0 "叛徒！"
 amcivwar.622.t:0 "黑色军团转入地下！"
 amcivwar.622.d:0 "在我们不懈的清剿下，黑色军团的控制力已经下滑，现在他们已经难以在他们的根据地策划更加公开的袭击。他们重新变成了一个更隐蔽的恐怖组织。"
 amcivwar.622.a:0 "这是一个很好的开始！"
 amcivwar.622.b:0 "他们毫无胜算！"
 amcivwar.623.t:0 "黑色军团遭受打击！"
 amcivwar.623.d:0 "随着越来越多的公民愿意举报他们的行踪和成员，黑色军团的影响力已经下降。如今他们再也不能进行广泛的恐怖活动了。"
 amcivwar.623.a:0 "乘胜追击！"
 amcivwar.623.b:0 "他们毫无胜算！"
 amcivwar.624.t:0 "黑色军团失去支持！"
 amcivwar.624.d:0 "黑色军团早已遭到重创，成员的减少和不断增加的反对势力使得其更接近于最初令人恼火的暴力帮派，而非准军事组织。如果我们继续施压，兴许就能把他们彻底终结！"
 amcivwar.624.a:0 "好极了！"
 amcivwar.625.t:0 "黑色军团瓦解"
 amcivwar.625.d:0 "黑色军团已经彻底崩溃，被俘成员互相出卖，资金全数充公，大部分武装分子要么死亡，要么消失。看来黑色军团已经彻底被击败了。政府宣布黑色军团被击溃的消息得到了公民的庆祝，现在他们终于可以过上平静的生活了。"
 amcivwar.625.a:0 "最终，正义得以伸张"
 amcivwar.626.t:0 "社会主义者骚乱！"
 amcivwar.626.d:0 "世界产业工人联盟的军事组织，赤卫队和其他无政府主义武装分子在最近加强了他们的活动。总体而言，除了罢工之外，他们还开始了数次工业破坏运动、有针对性的政治暗杀、扰乱补给供给以及旨在吸引城市工人的激进宣传。这些行动正在损害我们的经济，尤其是我们生产工业原材料的能力。"
 amcivwar.626.a:0 "该死！"
 amcivwar.630.t:0 "社会主义者受挫！"
 amcivwar.630.d:0 "最近数周以来，社会主义组织已然崩解分裂，其协调组织能力也随之而去。虽然这很难称得上是红色恐怖的结束，不过起码这些赤匪们不会继续为非作歹，散播恐怖，当地人上交的有关加莱恩主义者和集体主义者们活动的情报和信息也更加准确，有助于我们打击赤匪。终于，我们的工业能够喘口气，稍微从赤匪的破坏活动下恢复了。"
 amcivwar.630.a:0 "很好！"
 amcivwar.631.t:0 "社会主义民兵开始崩溃！"
 amcivwar.631.d:0 "由于赤卫队民兵们不断失败、兵员短缺，其支持度最近有所下降。在政治上犹豫不决的工人们已经越来越看好我们了，工业破坏行动也越来越少了。"
 amcivwar.631.a:0 "棒极了！"
 amcivwar.631.b:0 "挺不错的"
 amcivwar.632.t:0 "赤卫队奄奄一息"
 amcivwar.632.d:0 "赤卫队经受了一场又一场的打击，被迫采取更粗暴的策略，破坏工业设施并设法蛊惑工人，但因为他们彼此之间几乎没有任何组织协调能力，绝大多数工人们都不愿意加入他们的事业，就算赤卫队威胁他们也无法挽回事实。看来，我们最终还是会赢得这场战斗。"
 amcivwar.632.a:0 "当然，我们会赢！"
 amcivwar.633.t:0 "终结社会主义民兵！"
 amcivwar.633.d:0 "社会主义民兵已不再是能攻击我们的支持者并使我们经济停摆的势力了。尽管总会有一些狂热的赤匪愿意为他们的事业而死，但这些极端分子对我们来说，似乎已不再是一个重大威胁了，这让我们的支持者感到高兴不已。"
 amcivwar.633.a:0 "妙！"
 amcivwar.634.t:0 "一分钟人崛起"
 amcivwar.634.d:0 "那些和联盟国的朗派联合在一起的一分钟人民兵已开始在我国境内组织起来，他们正在招募境内的农民、失业者、农村穷人和中产阶级。为了破坏我们的补给线和干扰部队协调，这些叛乱分子抢略我们的补给仓库，鼓励农民向国家隐瞒他们的拥有的资产，更破坏与我们结盟的农民的庄稼。此外，他们还采纳了像弗兰克·哈默等美利坚至上党军事顾问的建议，积极地实施心理战，当有机会时，会以可怕的方式暗杀我们的军官、兵员和组织者，并偶尔进行夜袭。"
 amcivwar.634.a:0 "杂种！"
 amcivwar.637.t:0 "一分钟人受挫！"
 amcivwar.637.d:0 "最近，“一分钟人”民兵的支持者和兵力正在续渐流失，他们之间的协调能力也随着我们对恐怖活动的有力打击而有所削弱。但我们仍有很长的路要走，要打破他们对供应品和农产品的控制，因为我们的人民才可以在这残酷的内战中得到一些喘息，官员们也可以更有效地开展工作。"
 amcivwar.637.a:0 "继续努力！"
 amcivwar.638.t:0 "一分钟人被击退！"
 amcivwar.638.d:0 "被发现的一分钟人基地数量越来越多，我们的士兵也很高兴听到这些匪帮袭击他们的行动屡屡受挫。由于农民们认为至上党是万恶之源，他们也不太愿意按他们的要求办事，我们的补给路线现在更加安全，我们的官员也可以更高枕无忧地工作。尽管如此，要彻底消灭他们还有很长的路要走。"
 amcivwar.638.a:0 "好极了！"
 amcivwar.638.b:0 "好极了！"
 amcivwar.639.t:0 "一分钟人的最后一搏！"
 amcivwar.639.d:0 "一分钟人日薄西山，其武装分子遭俘获审讯者与日俱增，我方更屡次挫败其袭扰图谋。由于至上党的宣传大部分是面向农民的，但农民现在明显地站在我们这一边，他们也没办法再做什么来扰乱我们了。但他们仍然对我们有些妨碍，如果我们要最大限度地保证我们的补给线和军队士气，我们就必须彻底消灭他们。"
 amcivwar.639.a:0 "到此为止了！"
 amcivwar.640.t:0 "一分钟人被击溃！"
 amcivwar.640.d:0 "一分钟人完蛋了！在至上党民兵组织的最终崩溃后，他们的人要么逃之夭夭，要么就得面对我们的人的报复，他们完蛋了，而我们的人民也就可以放心了，这群流氓再也无法恐吓他们了。物资可以轻松地运到营地，士兵们的生活中也少了一件烦心事。"
 amcivwar.640.a:0 "感谢上帝！"
 amcivwar.641.t:0 "三K党现身！"
 amcivwar.641.d:0 "与白人联盟和旧民主党结盟的三K党徒抗拒着我们的统治，并企图以攻击补给线，袭击工厂和散布反政府言论来干扰我们的政府运转。我们得马上处理这件事。"
 amcivwar.641.a:0 "该死！"
 amcivwar.645.t:0 "三K党受创！"
 amcivwar.645.d:0 "三K党再也无法无天、肆意妄为地在我国活动，因为它的组织遭受了袭击，成员也纷纷叛变，三K党因此受到了削弱。然而，他们仍是庞然大物，还有造成重大破坏的能力，我们不能掉以轻心。"
 amcivwar.645.a:0 "很好！"
 amcivwar.646.t:0 "三K党正丧失支持！"
 amcivwar.646.d:0 "白人联盟和三K党最近几天来的行动受到了巨大的打击，军方成功地破坏了他们的行动，平民感到更加自在，开始与我们合作并指认三K党成员。"
 amcivwar.646.a:0 "好的！"
 amcivwar.646.b:0 "好的！"
 amcivwar.647.t:0 "全国白人联盟奄奄一息"
 amcivwar.647.d:0 "三K党在最近几天遭受了巨大的损失，他们已经无法有效地与我国境内的其他白人联盟和三K党组织进行协调。在他们的势力日趋衰落后，我们的军队有了更多的补给，平民们也比以前更相信我们能战胜三K党了。"
 amcivwar.647.a:0 "好极了！"
 amcivwar.648.t:0 "三K党被扫清"
 amcivwar.648.d:0 "三K党的各大巨龙和追随者要么逃之夭夭，要么身陷法网，三K党和其他白人联盟的组织完全转入地下，几乎分崩离析、不复存在。虽然他们的一些成员仍在境内活动，但他们已不能再对我们的补给线或平民进行什么袭击了。"
 amcivwar.648.a:0 "尘埃落定！"
 amcivwar.649.t:0 "旧联邦派抵抗！"
 amcivwar.649.d:0 "仍在我们领土上存在的大量残余联邦部队以及他们的支持者已经决定组成反对我们的力量。虽然他们的人数比我们打击的其他派别武装分子要少上一些，但他们的训练弥补了人力的不足，他们依托小型基地和卡车，有效地使用了游击战术，并用车装着我们的士兵、枪支和食物就跑。我们需要立即反击。"
 amcivwar.649.a:0 "痛击他们！"
 amcivwar.653.t:0 "旧联邦派受创"
 amcivwar.653.d:0 "我们终于设法扭转了对联邦军民兵作战的局面，成功的袭击了他们的基地并使他们面临更多的补充人手的问题。然而，他们仍然大量活动着。"
 amcivwar.653.a:0 "这是一个开始！"
 amcivwar.654.t:0 "旧联邦派被击退"
 amcivwar.654.d:0 "近日，随着我军的行动和反击已经破坏了他们的反间谍行动，补给获取以及通讯，我方控制区内的联邦军民兵已经受到了越来越严重的损失，因此他们正显得越发脆弱。"
 amcivwar.654.a:0 "终于！"
 amcivwar.654.b:0 "终于！"
 amcivwar.655.t:0 "旧联邦派遭受重创！"
 amcivwar.655.d:0 "我们领土上的联邦民兵及军团已奄奄一息，因为我们做出的反击让他们的组织越来越散乱，他们看起来更像民兵，而非军队，他们也没办法作为一支军队而存在了。这给予了我们的情报部门和巡逻人员急需的鼓舞，也让彻底解决联邦派匪帮成为可能。"
 amcivwar.655.a:0 "继续保持！"
 amcivwar.656.t:0 "旧联邦派消散"
 amcivwar.656.d:0 "联邦派似乎已经认为他们不能再对我们造成重大破坏了，因此他们越来越多地试图逃离我国，去寻求一个更友好的地方，他们的宣传也完全失效。在他们最后一个重要组织的崩溃后，他们几乎在无法招募到新的成员，他们也终于无法再困扰我们了。"
 amcivwar.656.a:0 "很好！"
 amcivwar.657.t:0 "犯罪事件爆发"
 amcivwar.657.d:0 "不是所有的美国人都对内战无动于衷，也不是所有的美国人都为了让某个意识形态派别在内战中得胜而奋战，一些机会主义者已冒出头来，并从国家重建的软弱中获得了强大的力量。犯罪分子投机倒把、窃名逐利，利用混乱为所欲为，犯下了偷窃、敲诈勒索还有一系列更糟的罪行。他们只会拖累我们，我们也得处理他们。"
 amcivwar.657.a:0 "罪犯渣滓！"
 amcivwar.671.t:0 "黑人抵抗势力崛起！"
 amcivwar.671.d:0 "从左翼的非裔血亲兄弟会到右翼的全体黑人进步协会，以及两者之间所有与黑人民族主义有关的抵抗组织都站了起来去反对我们的统治，他们要求美国黑人应当享有更大的权利以及为其划分自治区。尽管他们现在还没有一个统一的组织，但他们对我们政府的抗议正在令我们的支持者感到不安，因为这使我们对黑人社区进行的管理和征税变得更加困难。"
 amcivwar.671.a:0 "不！"
 amcivwar.675.t:0 "黑人抵抗衰弱"
 amcivwar.675.d:0 "境内黑人抵抗组织的数量正在急剧下降，这使我们能够更有效地掌控自己的领土，并在一定程度上舒缓了我们的内部军事压力。"
 amcivwar.675.a:0 "继续坚持！"
 amcivwar.676.t:0 "黑人抵抗被削弱"
 amcivwar.676.d:0 "黑人抵抗组织的力量正在变得越来越弱，他们难以获得新的支持者，行动亦不断被打压，这使他们陷入困境，并让我们和支持者的正统性有所增长。"
 amcivwar.676.a:0 "很好！"
 amcivwar.676.b:0 "很好！"
 amcivwar.677.t:0 "黑人抵抗失去支持"
 amcivwar.677.d:0 "黑人抵抗组织对我们统治的抵抗终于崩溃了，在我们对他们及其同情者的反击下，他们的组织能力和士气均愈发低落，这让他们退化成结构松散的民兵团体，而不是以前那个组织严密的准军事部队。我们必须完成我们的工作。"
 amcivwar.677.a:0 "干死它！"
 amcivwar.678.t:0 "黑人抵抗瓦解"
 amcivwar.678.d:0 "随着那些流亡者逃离我们的国家（逃跑行动不是很成功），黑人对我们政权的有组织的抵抗终于崩溃了。虽然有些部队仍然在进行着抵抗，但他们已经无法再获得我们的军队所占领的黑带地区的支援了，更不用说发动进攻了。"
 amcivwar.678.a:0 "结束了。"
