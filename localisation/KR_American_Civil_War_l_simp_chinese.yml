 amcivwar.5011.t:0 "僵局？"
 amcivwar.5011.d:0 "联盟国、联合工团和太平洋国是这场内战最后剩下的政权，三方目前仍遵守着各自的停战协议。尽管我们与工团仍处于战争状态，但联盟国从未正式向其宣战。这导致了一个尴尬的局面——由于我们与工团并不接壤，再加上联盟国可能出于中立立场，始终不愿允许我军借道伐赤。只要联盟国与工团维持和平，内战实质上就陷入了三方僵局。来自工团的内部消息表明，停战协议迟早会破裂，但这个过程可能需要数月时间，届时工团将获得充足的扩军机会。若我们直接向工团提出和谈，势必会遭到拒绝——但由于存在联盟国这一“中立方”，倘若我们愿意向双方作出让步，他们或许愿意充当调解人。另一个选择是要求联盟国放弃中立，毕竟他们阻碍了我们向赤匪大敌发动全面战争的能力。"
 amcivwar.5011.a:0 "请求调停"
 amcivwar.5011.b:0 "要求联盟国屈服！"
 amcivwar.5011.c:0 "让条约顺其自然吧"
 amcivwar.5012.t:0 "来自太平洋国的提案"
 amcivwar.5012.d:0 "太平洋国大使向我们提出了一项条约，称能推动结束内战。他们表示由于联盟国的脆弱中立，太平洋国的军队无法穿越我方领土去打击工团，战争实际上陷入了僵局。因此，大使提议由我们作为调解方，在新奥尔良安排他们一场与工团的和平谈判，彻底结束这场战争。包括朗本人在内的大多数联盟国政客认为安排会谈并无坏处，因为维持现状只会导致战争长期拖延，而工团内部的消息透露，如果战争持续太久，与联盟国的和平迟早会破裂。左派人士警告说，与西部寡头合作可能会适得其反，甚至可能刺激工团内部的激进派撕毁条约并向我们宣战。而且除非太平洋国的保守派代表团同意对方的条款，工团本身也不太可能接受和平协议。还有人认为，我们与其提供调解，不如利用这种领土分裂的局面，主动向其中一方或双方开战，以免在战争结束时被迫放弃我们自己的理想。"
 amcivwar.5012.a:0 "安排会议"
 amcivwar.5012.b:0 "我们应共同对抗赤匪！"
 amcivwar.5012.c:0 "干掉那些西部寡头！"
 amcivwar.5012.e:0 "我一手一个掐巴死俩！"
 amcivwar.5013.t:0 "新奥尔良会议"
 amcivwar.5013.d.liberal:0 "虽然太平洋国仍与我们交战， 但彼此国境之间联盟国的中立阻碍了我们将革命传播到西部各州。联盟国意识到我们和太平洋国都处于这种尴尬状态，于是提出一项条约，两国停火进而在三方之间通过公投一劳永逸地结束战争。作为交换，太平洋国将在促进工人权利和扩大工会代表权方面做出一些让步。然而，如果谈判破裂，联盟国的调停肯定会激怒我方的激进工团主义者，而我们与联盟国的互不侵犯条约也将就此终结。"
 amcivwar.5013.d.conservative:0 "虽然太平洋国仍与我们交战， 但彼此国境之间联盟国的中立阻碍了我们将革命传播到西部各州。联盟国意识到我们和太平洋国都处于这种尴尬状态，于是提出一项条约，两国停火进而在三方之间通过公投一劳永逸地结束战争。然而，保守的太平洋国拒绝了我们提出的促进工人权利和扩大工会代表权的条款，谈判破裂。此外，联盟国的调停也激怒了我方的激进工团主义者，我们与联盟国的互不侵犯条约就此终结。"
 amcivwar.5013.a:0 "签署条约"
 amcivwar.5013.b:0 "他们疯了吗？"
