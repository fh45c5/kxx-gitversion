FLK_coup:0 "1921 年 11 月的糟糕回忆"
FLK_coup_desc:0 "这次航行以政变和占领福克兰群岛告终。海军上将伯德和他的伙伴们被派往南极探险，费用由加拿大政府支付。伯德迫于压力在福克兰群岛海岸登陆，并推翻了阿根廷建立的当地政府，使这次航行发生了转折。这次政变取得了成功，因为阿根廷在南方也遇到了自己的问题。然而，这次政变并没有受到当地人的热烈欢迎，他们毫不留情地进行了战斗，至今仍留下了伤疤。"
FLK_eyes_from_both:0 "双眸"
FLK_eyes_from_both_desc:0 "我国 "占领 "了曾属于阿根廷的岛屿。这种占领仍然激怒着巴塔哥尼亚人和阿根廷人，迟早会导致战争......我们必须做好最坏的打算......"
FLK_political_immigration:0 "移民潮"
FLK_political_immigration_desc:0 "在占领这个重要岛屿之后，突然出现了移民潮，主要来自加拿大和巴塔哥尼亚。虽然这对我们来说是件好事，因为它增加了我们的人口、劳动力和人力，但却不利于居住，因为这个岛很小，目前几乎没有空间。我们要么关闭边界，要么扩大边界？"
FLK_under_the_british_crown:0 "在英国王室统治下"
FLK_under_the_british_crown_desc:0 "我们是一个独立的国家，但仍受加拿大和国王的管辖。我们可能会与英国人兵戎相见，也可能任由他们自生自灭......"
FLK_five_principles:0 "五项存在原则"
FLK_atlantian_inhabitance:0 "亚特兰蒂斯人的生活"
FLK_preparing_for_the_homeland:0 "为祖国做准备..."



FLS_START:0 "海军上将条例的合法性"
FLS_START_desc:0 "我们必须巩固我们的规则，这样才能继续我们的旅程！"
FLS_SOLIDATE_RULE:0 "我们将被强有力的双手统治..."
FLS_SOLIDATE_RULE_desc:0 "如果我们必须控制一个国家，我们就必须铁腕治国！"
FLS_NAVAL_DICTATORSHIP:0 "......伟大的海军上将！"
FLS_NAVAL_DICTATORSHIP_desc:0 "只有我们的大将军才能领导我们！"
FLS_FIVE_PRINCIPLES_OF_RULE:0 "五项存在原则"
FLS_FIVE_PRINCIPLES_OF_RULE_desc:0 "1我们只为伟大的海军上将服务\n2我们将为伟大的海军上将献出生命\n3将为伟大的海军上将抛头颅洒热血\n4我们伟大的海军上将将带领我们走向胜利\n5我们的大将军是唯一一个..."
FLS_EMBRACE_THE_OLD:0 "拥抱古老，活在古老之中！"
FLS_EMBRACE_THE_OLD_desc:0 "曾经伟大的亚特兰蒂斯社会在地球上过着繁荣富强的生活，直到被犹大人淹没！我们必须再次重现这一辉煌！"
FLS_OF_WHERE_WE_NEED_TO:0 "我们的祖国在等着我们"
FLS_OF_WHERE_WE_NEED_TO_desc:0 "时钟滴答作响，大门即将打开"
FLS_CULT_OF_ADMIRAL:0 "海军上将的统治"
FLS_CULT_OF_ADMIRAL_desc:0 "大将军将带领我们！"
FLS_THE_FIRST_CONQUEST_desc:0 "我们扩张的第一个目标是南桑威奇群岛，该群岛现在归阿根廷所有，他们会阻止我们吗？"
FLS_ATLANTIC_VOYAGE_desc:0 "大西洋上到处都是拥有港口的小岛，它们的霸主可能不会在乎我们是否征服它们......或者会吗？"
FLS_PACIFIC_VOYAGE_desc:0 "太平洋上到处都是有港口的小岛，它们的霸主可能不会在意我们是否征服它们......或者会吗？"
FLS_CAPE_OF_NO_ORANGE_desc:0 "南非不是一个容易抓到的地方，我们必须做好全面入侵的准备！"
FLS_TO_INDIAN_OCEAN_desc:0 "印度洋，香料之海。为了我们自己的利益，我们必须征服它！"
FLS_FINAL_CONQUEST_desc:0 "这是我们最后一战 如果我们赢了，就能最终打开阿加森之门！"
FLS_GATEWAY_TO_HEAVEN_desc:0 "我们梦想成真 阿加森万岁"
FLS_IMPROVE_SHEEP_MARKET_desc:0 "我们的主要生产和出口产品是绵羊毛和乳制品。如果我们能进一步扩大这一市场，就能稳定我们的经济，增强我们的实力！"
FLS_OIL_MUST_FLOW_desc:0 "众所周知，福克兰群岛的土地上蕴藏着一些石油，我们必须利用这种情况！"
FLS_GREAT_DOCKYARD_desc:0 "我们必须扩大我们的船坞！"
FLS_GROW_MILITARY_INDUSTRY_desc:0 "我们必须扩大我们的军火工业！"


