fne.25.t:0 "圣丹尼斯镇的奇怪活动。"
fne.25.d:0 "有传言称，圣丹尼斯出现了奇怪的政治活动。其中包括人们所说的两个人之间的会面。据人们说，其中一个人是民粹主义者罗伯特·布拉西拉赫，而另一个人，人们认不出他的长相。据他们描述，他穿着一件黑色到深蓝色的长外套，带着一顶帽子，根本看不清楚长相。当然，我们可以置之不理，继续做自己的事情，但许多人建议我们应该对此进行调查。"
fne.25.a:0 "这只是浪费时间......"
fne.25.b:0 "也许我们应该关注一下"
fne.25_dont:0 "§G我们不会把时间浪费在这上面......"
secret_continues:0 "§R我们是在钻兔子洞吗？"
