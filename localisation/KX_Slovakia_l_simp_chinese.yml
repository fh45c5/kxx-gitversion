FRG_conquest_1:0 "新秩序"
FRG_conquest_1_desc:0 "时机已到！我们必须进一步扩大我们的边界！整个欧洲将跪在地上，祈祷在我们的政权之下，如果不是......"
FRG_conquest_2:0 "行省"
FRG_conquest_2_desc:0 "行省保护国，或简称为行省，是拿破仑真正控制傀儡政权的思想的产物。"
FRG_conquest_3:0 "他们无法拒绝的提议......"
FRG_conquest_3_desc:0 "当谈到谁是合法的法国国家的问题时，是我们。但是在非洲北部和西部仍然有一个，对我们的规则印象深刻。我们应该问他们是否想团结起来......"
FRG_conquest_4:0 "罗曼蒂或战争"
FRG_conquest_4_desc:0 "罗曼蒂是法国民众居住的著名土地，仍处于瑞士罪恶的政权之下。它应该是我们的，不惜一切代价......"
FRG_conquest_5:0 "第二次伊比利亚战役"
FRG_conquest_5_desc:0 "我们现在将确保我们在名为伊比利亚的火药桶中的影响力......"
FRG_conquest_6:0 "征服波兰人"
FRG_conquest_6_desc:0 "波兰人，仍在外国占领下受苦。它将被我们的部队“解放”！"
FRG_conquest_7:0 "布拉西拉赫-德莫夫斯基协定"
FRG_conquest_7_desc:0 "波兰人传来了好消息，他们同意加入我们，但有一个例外，他们将从德国和奥地利得到他们所要求的土地。我们当然接受这个决定!"
FRG_conquest_8:0 "巴黎-华沙轴心"
FRG_conquest_8_desc:0 "整个欧洲将围绕巴黎和华沙旋转！"
FRG_conquest_9:0 "意大利战役"
FRG_conquest_9_desc:0 "我们现在将向南走，这本身就是一团糟......"
FRG_conquest_10:0 "最终解决方案..."
FRG_conquest_10_desc:0 "德国问题的唯一解决办法是彻底消灭那些不值得的人......"
FRG_conquest_11:0 "杀死压迫者"
FRG_conquest_11_desc:0 "我们必须摧毁压迫那些没有能力保护自己的人的人。奥地利仍然统治着一个拥有许多种族的帝国，将不复存在！"
FRG_conquest_12:0 "第二次推到莫斯科？"
FRG_conquest_12_desc:0 "我们应该马上向俄罗斯宣战吗？"
FRG_conquest_13:0 "欧洲在我们的铁蹄下"
FRG_conquest_13_desc:0 "一个国家，一个民族，一个皇帝！"

FRG_marseille_nuit_comp:0 "马赛之夜结束了"
FRG_paris_nuit_comp:0 "巴黎之夜结束了"
FRG_bordeaux_nuit_comp:0 "奥尔良之夜结束了"
FRG_lyon_nuit_comp:0 "里昂之夜结束了"

FRG_new_order:0 "欧洲新秩序迫在眉睫......"
FRG_extreme_germanophobia:0 "一劳永逸地把他们......"

frg_polish_agression:0 "§G当我们对德国人发动战争时，我们将向波兰人宣战......§!"
frg_faction_poland:0 "§G在即将到来的对德国人的战争中，我们得到了波兰人的支持和盟友的保证§!"
frg_faction_1:0 "大陆轴心"

fne.14.t:0 "内阁形式"
fne.14.d:0 "我们最忠诚的大臣们在漫长而残酷的内战之后回来了，我们将任命他们应有的位置，好吗？"
fne.14.a:0 "回来了"

fne.15.t:0 "波兰政变？"
fne.15.d:0 "运气站在我们这边，由德莫夫斯基领导的民族君主制政变终于推翻了波兰政府，他们准备加入我们的事业！"
fne.15.a:0 "敌人，没有了！"

fne.16.t:0 "重回旧事"
fne.16.d:0 "令人作呕、粗俗和不必要的拉丁字母没有任何好处，它取代了我们祖先使用的古高卢语雅利安语。我们必须摆脱这个没有意义的字母表，并用无敌的高卢-雅利安字母表取而代之。我们的老师被迫用高卢字母代替法语拉丁字母，烧毁和重写每本含有拉丁语的书。至少，我们拥有的那些日耳曼老鼠，有一些事情要做，重写那些无用的书，如果他们不这样做，他们将面临我们以前不得不经历的命运。他们需要面对死亡，这就是他们生来的目的。"
fne.16.a:0 "呃......？"

FRG_master_over_europe:0 "国家的工业力量"
FRG_master_over_europe_desc:0 "法国领域，法国工业。决定我们真正力量的两个因素。我们将再次打开它们，并展示我们的生活有多好。"
FRG_begin_FRGmanization:0 "每个人都在工作！"
FRG_begin_FRGmanization_desc:0 "每个有能力工作并要求工作的人都应该得到这份工作。妇女、儿童、男人和老人！为了法兰西民族！"
FRG_moskowien:0 "再教育营"
FRG_moskowien_desc:0 "那些我们认为不值得公民身份的人应该在其他地方使用，在那里他们会有所帮助......"
FRG_polen:0 "南方的工业"
FRG_polen_desc:0 "我们的南方，在技术上还没有像北方那样先进。我们应该在那里建立一些产业，并提供一些就业机会！"
FRG_ukraine:0 "北方工业"
FRG_ukraine_desc:0 "大苹果，北方。我们的力量就在那里。我们应该进一步推进它！"
FRG_stufe_zwei:0 "巴黎-波尔多公路"
FRG_stufe_zwei_desc:0 "巴黎-波尔多公路是一个项目，它需要更大的铁路和公路，从巴黎蜿蜒到波尔多。这将极大地帮助行业失衡，并更多地传播我们的视野！"
FRG_repatriate_warsachu:0 "大规模武器生产"
FRG_repatriate_warsachu_desc:0 "如果我们生产了大量的坦克，就必须为我们的军队生产大量的枪支！"
FRG_repatriate_moskau:0 "开发天然资源..."
FRG_repatriate_moskau_desc:0 "阿尔卑斯山地区蕴藏着丰富的财富，但工团政府却没有真正关注到这一点。我们需要进一步挖掘，找到埋藏在地下的黄金！"
FRG_stufe_drei:0 "西欧的大型机器"
FRG_stufe_drei_desc:0 "我们的宣传片中展示了工作场所的男女！现代化的工业和工作场所足以让人相信，国家有能力在全国每个角落维持秩序和清洁！"

