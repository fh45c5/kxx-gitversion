FRG_economic_golden_age:0 "动荡的国家"
FRG_economic_golden_age_desc:0 "时机已到，真正的爱国者已经从专制的、工团主义的和破坏文化的叛徒手中站了起来！我们必须做好准备，打败那些压迫我们多年的人！"
FRG_nation_turmoil:0 "法兰西战役"
FRG_reinforce_the_aa_line:0 "团结民众"
FRG_reinforce_the_aa_line_desc:0 "如果我们想打败红军，就必须征召在我们伟大土地上行走的每一个持有武器的人！"
FRG_begin_the_atlantropa_project:0 "对红军的最后一击"
FRG_begin_the_atlantropa_project_desc:0 "没什么特别的，红军士气低落，我们必须利用这一点，让他们流血受苦！"
FRG_anti_red:0 "同胞相残"
FRG_anti_red_2:0 "种族的呼唤....."
FRG_berlin_to_FRGmania:0 "向波尔多推进"
FRG_berlin_to_FRGmania_desc:0 "我们人民的力量必将把红色败类赶出巴黎！为了波尔多兄弟 我们永不投降"
FRG_too_good_to_be_true:0 "向马赛推进"
FRG_too_good_to_be_true_desc:0 "南部城市马赛离我们的保护范围越来越近，我们必须集结力量，将红军赶出那里！"
FRG_too_good_to_be_true_2:0 "§B真正的§!§W三色旗§!"
FRG_too_good_to_be_true_2_desc:0 "这一天终于到来了，红军终于投降了，我们赢了。天知道我们亲爱的国家未来会发生什么！"
FRG_economic_collapse:0 "清除灰尘..."
FRG_economic_collapse_desc:0 "内战已经结束，我们现在可以清理由工团主义者造成的问题了"
FRG_nationalize_the_banks:0 "银行国有化"
FRG_nationalize_the_banks_desc:0 "我们必须将银行国有化！我们不能让银行被犹太复国主义分子所拥有！"
FRG_rethink_the_economy:0 "将国有工业国有化"
FRG_rethink_the_economy_desc:0 "我们必须将一切国有化！"
FRG_ECO_1:0 "重新思考经济问题"
FRG_ECO_1_desc:0 "新政府出台了新的经济政策。"
FRG_ECO_2:0 "摧毁公社"
FRG_ECO_2_desc:0 "只有这样，我们才能确保彻底消灭工团主义者，我们必须将他们打入地狱......"
