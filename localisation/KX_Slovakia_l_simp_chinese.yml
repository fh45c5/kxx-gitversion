FRG_ARMY_17:0 "东山再起"
FRG_ARMY_17_desc:0 "他再次踏上了法国的土地"
FRG_ARMY_18:0 "第二次加冕"
FRG_ARMY_18_desc:0 "他将再次成为法国皇帝"
FRG_ARMY_19:0 "我们都是拿破仑"
FRG_ARMY_19_desc:0 "你们，甚至我，现在都是拿破仑。如果你不向皇帝效忠，你将受到惩罚。"
FRG_slave_revolts:0 "成立拿破仑青年团"
FRG_slave_revolts_desc:0 "孩子们必须懂得道德。他们应该去营地，那里会教他们礼仪，让他们成为真正的士兵，保卫法国。年轻的女士们将有幸接受教育，培养出更多真正的雅利安人的孩子!"
FRG_NAP_2:0 "建立PdÉs"
FRG_NAP_2_desc:0 "PdÉs是一个政府资助建立的组织，它将确保我们内部的稳定。尽管通过武力或惩罚……"
FRG_incite_factionalism:0 "水晶之夜"
FRG_incite_factionalism_desc:0 "我们必须摆脱那些被我们的教导救赎为不必要的人!我们的国家不应该欢迎德国人和犹太人!"
FRG_NAP_1:0 "红色审判"
FRG_NAP_1_desc:0 "只有拿破仑政权才能领导我们的国家!"
FRG_NAP_3:0 "国家教育"
FRG_NAP_3_desc:0 "完美的家庭，父亲，母亲和两个孩子。在法国的旗帜下，他们应该按照我们的命令生活!"
FRG_NAP_4:0 "只对法兰西民族有用"
FRG_NAP_4_desc:0 "我们宣誓效忠法国和拿破仑，没有人能领导我们，只有拿破仑!万岁!万岁!万岁!"

FRG_ARMY_1:0 "伟大的法国军队"
FRG_ARMY_1_desc:0 "拿破仑统治下的法国的主要优势之一是其强大的军队，曾被称为“地球上的大象”。我们必须让欧洲人看到这支军队!"
FRG_ARMY_2:0 "研究新战术"
FRG_ARMY_2_desc:0 "如果我们想成为世界舞台上最成功和最强大的力量，我们必须适应过去几年出现的技术进步。其中之一就是闪电战战术。这在将来会被认为是有用的……"
FRG_ARMY_3:0 "坦克的批量生产"
FRG_ARMY_3_desc:0 "拥有一支更大更好的军队的唯一方法就是生产大量的坦克!大家快点!我们得干活了!"
FRG_ARMY_4:0 "机动化"
FRG_ARMY_4_desc:0 "我们需要在陆地作战中达到更高的速度。随着大量的坦克生产，我们必须向我们的军队引进机动装备!"
FRG_ARMY_5:0 "速度就是力量"
FRG_ARMY_5_desc:0 "快……再快，甚至更快!"
FRG_ARMY_6:0 "无敌传说……"
FRG_ARMY_6_desc:0 "技术和战略上的改进是使我们变得更强大的关键。我们现在将展示我们真正的力量和统治地位…"
FRG_ARMY_7:0 "真正的欧洲军队"
FRG_ARMY_7_desc:0 "我们曾经是一个从伊比利亚延伸到波兰的大国。我们必须用我们强大的军队，再次夺回那些边界!"
FRG_ARMY_8:0 "扔炮弹，而不是人"
FRG_ARMY_8_desc:0 "我们的军队必须有更多的火炮!"
FRG_ARMY_9:0 "铁制的……"
FRG_ARMY_9_desc:0 "我们制造的火炮将是独一无二的。既能抵抗天气，又能抵抗敌军……"
FRG_ARMY_10:0 "复杂的军事战术"
FRG_ARMY_10_desc:0 "我们必须聘请新的更有经验的将军!"
FRG_ARMY_11:0 "国王的土地……"
FRG_ARMY_11_desc:0 "拿破仑将不仅是法国的皇帝，而且是所有国家的皇帝。"
FRG_ARMY_12:0 "国王的海洋……"
FRG_ARMY_12_desc:0 "我们不会再做海上小丑了，我们的海军会毫无例外地杀死德国人和英国人!"
FRG_ARMY_14:0 "天空的雄鹰……"
FRG_ARMY_14_desc:0 "我们的伟大将翱翔天际!"
FRG_army_1:0 "复兴的军队"
FRG_tank_1:0 "闪电战"
FRG_tank_2:0 "闪电战"
FRG_motor_1:0 "武装机动化"
FRG_speed:0 "§B快…快…快!"
