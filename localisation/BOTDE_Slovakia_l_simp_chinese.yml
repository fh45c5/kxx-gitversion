 slovak.1.t:0 "斯洛伐克当地知名人士在普雷斯堡会面"
 slovak.1.d:0 "柏林股市的崩盘在我国人民中引发了深重的经济灾难，造成的损失难以估量。在这场席卷而来的动荡中，一群知识分子与民间领袖悄然组织了一场仅限斯洛伐克人参与的公开集会。与会者成分复杂，既有怀抱斯洛伐克革命理想的社会主义者，也有为普通斯洛伐克民众争取更广泛自由的民主人士。令人意外的是，一些右翼激进分子也现身其中，使得会议氛围更显诡谲。\n\n尽管各派在立场与主张上争执不休，言辞激烈，但他们却在一个根本目标上达成了一致：将斯洛伐克民族从匈牙利王国的统治下彻底解放出来。这一诉求并非新生事物，早在我们王国中存在了百年之久。过去，我们尚能凭借强力压制这种分离主义的思潮；然而如今，随着思想的日益开放与自由化倾向的蔓延，他们获得了前所未有的活动空间与舆论土壤。现在我们唯有保持高度警惕，期盼这股暗流不会进一步扩散从而演变为动摇国本的更大风波。"
 slovak.1.a:0 "这场运动是否将不复存在呢？"
 slovak.1.b:0 "立刻，马上逮捕他们！"
 slovak.2.t:0 "袭击匈牙利官员"
 slovak.2.d:0 "“黑色星期一”的阴云至今仍笼罩在我们的国土之上，未能消散。而就在这片阴霾之下，我们曾以为最恶劣的情形，竟又以更狰狞的面目重现于日光之中，一伙暴徒，部分源自普雷斯堡街头的肮脏贫民窟，公然实施绑架暴行，甚至对匈牙利民众乃至商界高层人士悍然动用武力。\n\n值此危局，少数家境优渥的匈牙利贵族迅速收拾行装，仓皇逃往布达佩斯寻求庇护。他们向我国人民泣诉，诉说自身如何被如牲畜般粗暴对待，遭棍棒无情殴打，甚至被抛入冰冷的河流湖泊，而施暴者竟毫无悔意。“斯洛伐克人不过是一群鼠辈，野蛮未开化、愚昧无知”，这已成为贵族抵抗组织及逃难至布达佩斯的人们口中流传的新口号。如今，他们正怀着满腔愤懑与急切，翘首期盼着这场风波能够早日了结。"
 slovak.2.a:0 "这真是出乎意料......"
 slovak.3.t:0 "斯洛伐克工人罢工"
 slovak.3.d:0 "更为严峻的是，斯洛伐克境内原本富庶的工业区，正经历着工人数量的急剧萎缩。这一局面一方面源于市场体系的崩溃所带来的非正常负增长，另一方面则深深根植于工人群体中不断滋长的斯洛伐克民族主义情绪。在民族意识的驱动下，他们公开提出诉求，要求工作场所的管理权必须完全交由斯洛伐克人，而将匈牙利人排除在管理层之外。同时，他们进一步主张，所有的经济收益应当悉数流入斯洛伐克人的口袋，而非由匈牙利人分享。这种日益激化的对立情绪，不仅加深了民族间的裂痕，也严重冲击了生产秩序与社会稳定。\n\n面对不断升级的骚乱，国家武装力量采取了强硬手段进行镇压。许多参与抗议的工人遭到逮捕，并被强制遣返回原籍，生产区域在刺刀与命令的笼罩下，暂时恢复了表面的平静。然而，这种以暴力回应当社会诉求的做法，不仅未能从根本上化解矛盾，反而进一步激化了斯洛伐克人与中央政府之间的对立。"
 slovak.3.a:0 "斯洛伐克工人，团结起来！"
 slovak.4.t:0 "斯洛伐克人拿起了武器！"
 slovak.4.d:0 "最糟糕的预感应验了，普雷斯堡的人民终于越过了忍耐的极限，将命运攥回了自己手中。整座城市仿佛一夜之间苏醒了它的意志，街巷中涌动着决绝的人潮。他们随手抓起一切能充当武器的东西，铁锹、棍棒、从工坊搬来的铁具，甚至拆下街垒的石块。一场自发的抵抗如野火般蔓延，迅速在普雷斯堡外围形成了一道坚不可摧的封锁线。那不再只是一道物理的屏障，而是一道由愤怒与尊严筑起的人墙。任何试图跨进这座城市的匈牙利警察或士兵，面对的不再是顺从的市民，而是以命相搏的决心。他们眼中燃烧的火焰在宣告：这里已是自由之地，踏入者，将不再有安全，只有代价。"
 slovak.4.a:0 "普雷斯堡现在自由了吗？"
 slovak.5.t:0 "斯洛伐克独立宣言"
 slovak.5.d:0 "在历经千年的异族统治之后，斯洛伐克这片土地终于迎来了自由的曙光。当独立的钟声敲响，无数人涌向城镇广场，蓝色的斯洛伐克旗帜在晨光中缓缓升起，像一道划破长夜的闪电。\n\n人群中爆发出经久不息的欢呼。老人们擦拭着眼角的泪水，他们布满皱纹的手紧紧相握，仿佛在确认这个等待了太久的时刻不是梦境。年轻人则挥舞着自制的旗帜，歌声与呐喊在古老的街巷间回荡。有人跪地亲吻这片刚刚获得新生的土地，有人仰望着飘扬的国旗，喃喃念着祖辈未能亲眼见证的夙愿。\n\n一位参与过起义的战士登上临时搭起的讲台，他的声音因激动而微微发颤：“今天我们站在这里，不是作为谁的臣民，而是作为这片土地真正的主人。”他顿了顿，环视着台下无数双闪着泪光的眼睛，“我们的祖辈在这条路上倒下，他们的血浸透了这片土地。而现在，我们终于能够告诉长眠地下的他们：你们没有白等，同胞们！享受这来之不易的自由吧，让那群匈牙利人滚蛋，万岁斯洛伐克，万岁自由的祖国！”\n\n人群渐渐安静下来，只听见旗帜在风中猎猎作响。 "
 slovak.5.a:0 "嘿，斯洛伐克人"
 slovak.5.b:0 "该死的！"
 slovak.6.t:0 "匈牙利人卷土重来"
 slovak.6.d:0 "匈牙利人到底是不愿放过我们！马扎尔人的大军已压境而来，在匈牙利与斯洛伐克的边境线上集结成阵，一门门火炮赫然指向布拉迪斯拉发，他们至今仍执意称之为“普雷斯堡”，仿佛这样就能抹去我们独立的事实！他们发誓要夺回所谓的“北匈牙利”，也就是我们脚下的斯洛伐克！\n\n我们的军队，大多不过是未受过严格训练的民兵，没有精良的装备，也没有经年的战术磨砺。可那又如何？既然他们执意要战，那我们便以斯洛伐克之名迎战！我们愿押上一切，土地、生命、未来，只为守护这来之不易的自由。一千年来，我们一直活在压迫之下，沉默地承受着不属于我们的命运。而今天，我们不愿再低头，也绝不后退！斯洛伐克人，可以付出所有，只为那更高贵的两个字，自由！我们绝不低头！"
 slovak.6.a:0 "他们想打，我们就打！"
 slovak.7.t:0 "整装待发"
 slovak.7.d:0 "我们绝不能坐视斯洛伐克就这样从我们手中分裂出去！那片土地承载的不仅是山河与城镇，更是匈牙利民族百年来的历史与尊严。我们的同胞在那里生活、我们的财产在那里扎根、我们的记忆在那里延续，每一寸斯洛伐克的土壤都与匈牙利血脉相连。\n\n若是轻率地放弃斯洛伐克，我们失去的将不仅是领土，更是民族的脊梁。可以预见，国内民众的愤怒必将如多瑙河的洪水般汹涌而来，民族情绪一旦失控，后果不堪设想。那些潜伏在阴影中的极端主义团体，定会借机煽动民意、招揽信众，把国家的伤痛变成他们扩张的养料。到那时，我们要面对的将不仅是分裂的领土，更是被撕裂的社会与动荡的国本。无论从法理还是情感上，斯洛伐克都理应是匈牙利不可分割的一部分。我们必须坚定立场，用一切必要的手段夺回这片属于我们的土地，这不只是政治决策，更是我们对历史、对民族、对子孙后代不可推卸的责任！"
 slovak.7.a:0 "斯洛伐克人别想着彻底脱离匈牙利！"
 slovak.8.t:0 "介入斯洛伐克"
 slovak.8.d:0 "柏林股市危机确实让我们有些手忙脚乱，手头尽是焦头烂额的事，不过话说回来，这段日子传来的也不全是坏消息。我们的叛逆的臣国匈牙利，这回同样没能幸免，而且看起来摔得比我们还重。他们过去对斯洛伐克人的种种苛待与盘剥，如今终于激起了强烈的反弹，斯洛伐克人已经公开宣布脱离匈牙利王国，自立为斯洛伐克共和国。这事表面上和我们没什么直接关系，毕竟是匈牙利王国的内政。但眼下的局势，却让人不由得多想几步。匈牙利显然不甘心就这样失去斯洛伐克，已经摩拳擦掌，准备出兵收复。如果我们在这个时候，找准时候插上一手阻止匈牙利对斯洛伐克的进攻，那不就等于间接削弱了匈牙利的力量吗？这些桀骜不驯的马扎尔人，是时候该让他们尝尝苦头了。更何况，这样做不仅能够打压一下马扎尔人，我们还有可能借此机会，收获一个至少在表面上愿意效忠于我们的新政权。一个亲近我们的斯洛伐克政府，哪怕只是暂时的忠诚，也足以在未来的棋盘上，为我们多布下一枚有利的棋子。"
 slovak.8.a:0 "不错，就这么办吧"
 slovak.9.t:0 "奥地利介入斯洛伐克局势"
 slovak.9.d:0 "奥地利帝国向我们斯洛伐克伸出了庇护之手，表示愿意为我们遮挡马扎尔人的怒火。作为交换，斯洛伐克共和国仍将留在奥匈帝国内部，但与以往不同的是，我们将获得远高于以往的独立地位，包括组建自己的议会、拥有独立的军队、实现不受外来操控的经济自主（当然，这也意味着我们不能再指望来自奥地利帝国的经济援助），以及仅具象征意义的义务。这样的条件，实在令人感到满意。作为一个曾揭竿而起义的叛乱共和国，能得到如此宽厚甚至称得上仁慈的条约，多少有些出乎意料。细细想来，这大概是奥地利为了在帝国内部制衡匈牙利而做出的妥协吧。时局如棋，我们虽为棋子，却也在这微妙平衡中，寻得了一方喘息之地。"
 slovak.9.a:0 "行吧"
 slovak.10.t:0 "奥地利介入斯洛伐克局势"
 slovak.10.d:0 "奥地利向我们发出明确的最后通牒，要求立即停止一切针对斯洛伐克的敌对行动，并将军队全线撤离斯洛伐克边境。他们毫不掩饰地威胁道，若我们不从，维也纳方面必将施以“严厉惩罚”。这无疑是一场精心策划的政治操弄，奥地利人显然是想借斯洛伐克问题进一步削弱我们匈牙利王国的影响力。眼睁睁看着斯洛伐克就这样从匈牙利统治下分离出去，却无力阻止，实在是莫大的耻辱。然而，现实摆在眼前，我们除了暂时低头，似乎别无选择。国库空虚，内外交困，我们还得指望来自维也纳的金币和贷款来渡过眼前的难关。既然如此，在这阵风波平息之前，不如暂且顺着他们的意思行事。今天所受的屈辱，总有一天我们要连本带利地讨回来。奥地利人施加的掌控，绝不会永远持续下去。"
 slovak.10.a:0 "马扎尔人，隐忍！"
 slovak.11.t:0 "[GetYear]年议会选举"
 slovak.11.d:0 "这场议会选举，是我们年轻的斯洛伐克共和国迎来的第一次议会选举，意义非凡。全国各地民众的参与热情空前高涨，从城市到乡村，选民们纷纷走向投票站，满怀信心地为支持的政党投下自己庄严的一票。即便是目前仍被匈牙利非法占领的南斯洛伐克地区，我们的同胞也未放弃表达政治意愿的权利，他们派出了自己的代表，跨越阻隔，参与到这场关乎国家前途的民主进程中来。\n\n尽管此次选举中，仅有斯洛伐克社会民主党与斯洛伐克民族农民党两个政党获准进入议会，其他一些政党因先前制造政治骚乱、危害国家稳定而被依法排除在外，但这丝毫没有削弱人民对民主实践的热忱。相反，选举过程秩序井然，民众表达理性而坚定，恰恰证明了我们共和国的政治体制具有旺盛的生命力与独特的活力。这种在新生国家中蓬勃生长的民主精神，正是我们斯洛伐克走向独立自强之路最宝贵的基石。"
 slovak.11.a:0 "最终，社会民主党胜选！"
 slovak.11.b:0 "最终，民族农民党胜选！"
 slovak.12.t:0 "极端主义兴起"
 slovak.12.d:0 "不可避免的是，我们的国家正一步步滑向危险的边缘。泛滥的民族主义与复仇主义宣传，如同滋生的土壤，使一批批极右翼政治家如雨后春笋般涌现。其中最为人所知的，莫过于赫林卡人民党旗下准军事组织“赫林卡人民防卫组织”的新晋指挥官亚历山大·“萨诺”·马赫。马赫早年便投身人民党事业，最初作为沃伊捷赫·图卡的助手在党内各类运动中崭露头角。在图克的悉心引导下，他先后担任党报《斯洛伐克报》与《斯洛伐克真理报》的编辑职务，并于1924年被擢升为党的政治委员会成员。\n\n然而，也正是在图卡身边那些年的耳濡目染中，马赫的思想逐渐走向极端。他开始公开支持针对波兰人、犹太人、匈牙利人的激烈言论，甚至鼓吹所谓的“清除政策”。这种极端立场引起了赫林卡人民党内强硬派的注意，他们对其青睐有加。不久，马赫便被委以重任，取代了相对温和的卡罗尔·西尔多，出任人民防卫组织的指挥官。这一任命不仅强化了党内极端派系的力量，也进一步激化了政治氛围。面对这一局面，赫林卡人民党的创始人安德烈·赫林卡与立场较为中立的约瑟夫·蒂索虽深感忧虑，却因党内情势错综复杂、派系牵制而难以出手干预，只能眼看极端势力在犹豫与妥协之间悄然坐大。"
 slovak.12.a:0 "我们必须提防起来"
 slovak.13.t:0 "赫林卡人民党崛起"
 slovak.13.d:0 "赫林卡人民党起源于奥匈帝国时期的斯洛伐克，其成立初衷是争取民主自由、推动斯洛伐克独立与主权，并抵制自由主义的影响。该党自斯洛伐克民族党中分离而出，在保持保守意识形态的同时，逐渐转向反对捷克斯洛伐克主义。在19世纪末至20世纪初，斯洛伐克民族党是奥匈帝国境内唯一代表斯洛伐克人利益的政党。该党在匈牙利人民党内部建立，因反对自由主义而深受斯洛伐克信教民众支持，其纲领涵盖移民、高利贷、腐败及强制马扎尔化等社会问题。然而，随着该党逐渐偏离原有立场，部分斯洛伐克政治家开始在党内形成独立派系。1905年11月，党的高层要求其唯一议员弗朗齐谢克·斯凯恰克签署反对斯洛伐克纲领的声明，遭其拒绝。斯凯恰克于同年12月5日发表新政党宣言。1906年初，包括天主教神父安德烈·赫林卡在内的更多人士加入这一运动，但直至1913年，该团体仍以斯洛伐克民族党名义参选，以避免分散斯洛伐克选票。两党纲领相近，人民党主张强化民主，呼吁言论自由与普选权等自由主义改革。在1906年议会选举中，尽管存在普遍的选举舞弊，人民党仍赢得6个议席，民族党仅获1席。匈牙利政府随即加强镇压，企图削弱斯洛伐克人的民族与政治意识。1912年，斯洛伐克人民党公开反对民族党日益明显的捷克斯洛伐克主义倾向，并再次发表类似1905年的声明，但未正式实施。1913年7月19日，斯洛伐克人民党正式成为独立政党，由赫林卡担任主席，费尔迪什·尤里加和斯凯恰克等人共同领导。第一次世界大战期间，该党暂停活动，以避免被指控反对奥匈帝国。1918年，赫林卡与尤里加支持建立捷克斯洛伐克国家，签署《马丁宣言》，否认匈牙利对斯洛伐克的统治。该党参与创建第二届斯洛伐克民族委员会，但迅速遭到奥匈当局镇压。1925年，该党恢复运作并更名为赫林卡人民党，以区别于捷克斯洛伐克人民党。在1925年至1936年间，赫林卡人民党成为斯洛伐克最具影响力的政党并开始挑战斯洛伐克共和国现任政府的权威。"
 slovak.13.a:0 "密切关注他们"
 slovak.14.t:0 "捷克斯洛伐克军团归国"
 slovak.14.d:0 "捷克斯洛伐克军团是由捷克与斯洛伐克志愿者组成的武装部队。第一次世界大战期间，该军团为协约国作战，后在1919年11月之前的俄国内战中支持白军，其宗旨是争取协约国支持，以实现波希米亚王冠领地脱离奥地利帝国、上匈牙利地区摆脱匈牙利王国统治，从而促成民族独立。在托马斯·加里格·马萨里克和米兰·拉斯蒂斯拉夫·斯特凡尼克等流亡领袖的推动下，军团逐步壮大为逾十万兵力的武装力量。在俄作战期间，军团参与了多场关键战役，包括对同盟国作战的兹博罗夫战役与巴赫马奇战役，并在俄国内战中与布尔什维克激烈交锋，一度控制西伯利亚大铁路全线及西伯利亚多座主要城市。战争初期，捷克社群对参战反应热烈，但随后热情渐趋平淡。1914年，旅俄捷克与斯洛伐克民族协会向俄国政府请愿，请求支持祖国独立，并倡议组建志愿部队协同俄军作战。同年8月，俄军最高统帅部批准成立由境内捷克与斯洛伐克人组成的“捷克支队”。流亡政治家致力于将其扩展为更大规模的正规军，并争取从奥匈帝国战俘中招募兵员。尽管1914年末俄军方一度允许招募战俘，该政策旋即被其他部门否决，直至1917年夏才正式解禁。不过，通过地方层面的灵活协商，部分战俘仍得以加入。1916年，捷克支队升格为捷克斯洛伐克第1步兵团，随后扩展为步兵旅。该部在1917年7月克伦斯基攻势的兹博罗夫战役中表现突出，促成俄国临时政府同意流亡机构从战俘营大规模征召志愿者。同年秋，部队扩编为“俄罗斯捷克斯洛伐克军团第一师”，10月再增第二师，至1918年总兵力已达约四万人。除俄国外，军团在法国与意大利亦有分支。俄国内战最终以亚历山大·克伦斯基的全俄罗斯政府获胜告终。战后，奥匈帝国重组，扬·马萨里克与爱德华·贝奈斯返回波希米亚，在新成立的更具自主权的波希米亚王冠领地政府中担任要职。斯洛伐克人米兰·斯特凡尼克不满斯洛伐克在帝国框架内缺乏地位，继续流亡法国，后因法国政局变动转赴俄国，与滞留的军团官兵会合并担任指挥。1936年斯洛伐克自匈牙利统治下独立，斯特凡尼克与部分由斯洛伐克人组成的军团成员应召回国，悉数抵达斯洛伐克。"
 slovak.14.a:0 "欢迎回来，我们英勇的同胞"
 slovak.15.t:0 "斯洛伐克民族党质疑选举舞弊"
 slovak.15.d:0 "斯洛伐克民族党近日对斯洛伐克社会民主党在大选中的行为提出强烈质疑，指控其存在系统性选举舞弊。民族党指出，社民党利用其在斯洛伐克独立以来长期积累的政治影响力与群众中的号召力，有意压制政治对手，破坏选举公正。他们进一步控诉，社民党以所谓“破坏秩序”为借口，采取各种不正当手段，将对立政党强行驱逐出议会，从而削弱反对声音。\n\n此外，民族党还指称议会中的斯洛伐克民族农民党名义上扮演着“头号反对党”的角色，实则是与社会民主党合谋演出一场政治双簧。他们认为两党刻意营造对立假象，欺骗缺乏政治认知的民众，使大选沦为一场精心排演的权力游戏，而非真实反映民意的民主过程。整场选举在民族党看来，不过是社民党为延续执政地位而与民族农民党联袂上演的一出虚伪戏码。"
 slovak.15.a:0 "真该死！"
 slovak.16.t:0 "赫林卡人民党声援民族党抗议行动"
 slovak.16.d:0 "斯洛伐克地区最具政治影响力的赫林卡人民党近日公开宣布，全力声援斯洛伐克民族党所发起的抗议行动，两党共同将矛头指向执政的斯洛伐克社会民主党。赫林卡人民党党主席安德烈·赫林卡在声明中强烈谴责社民党，指责其“系统性破坏斯洛伐克的民主根基”，不仅长期操弄民众的爱国情绪，更将这种情绪扭曲为政党私用，为选举舞弊和政治打压披上“正当性”外衣。赫林卡进一步强调，社民党以虚伪的“团结”为名，行政治清洗之实，导致议会沦为单一力量主导的虚假舞台。\n\n为此，赫林卡人民党提出三项明确诉求：第一，立即恢复真正的多党议会体制，停止对反对声音的政治驱逐；第二，将被以不正当手段排除出议会的右翼政党重新邀请回归，恢复政治生态的多元平衡；第三，在下一轮大选中实施全面公开、可监督的投票机制，杜绝任何选举操控的空间。赫林卡人民党警告，若社民党继续拒绝回应这些诉求，他们将联合其他右翼力量发起更大规模的政治行动，“直到斯洛伐克恢复真正的民主”。"
 slovak.16.a:0 "右翼滚蛋！"
 slovak.16.b:0 "我们不得不答应他们的要求......"
 slovak.17.t:0 "右翼进军布拉迪斯拉发"
 slovak.17.d:0 "在斯洛伐克社会民主党断然拒绝右翼阵营提出的政治和解方案后，积蓄已久的不满终于冲破了临界点。斯洛伐克民族党与赫林卡人民党迅速结成“全国民主联盟”，在各方尚未反应过来之际，双方麾下训练有素的准军事组织以迅雷不及掩耳之势向首都布拉迪斯拉发发动了突击。这场代号为“民族之怒”的军事行动彻底颠覆了原有的政治格局。仓促应战的社民党政权在短短数日内便宣告瓦解，其领导层四散流亡。在赫林卡人民党的武装支持下，斯洛伐克民族党成功接管政权，成为了斯洛伐克新的执政核心。面对国内外的震惊与质疑，民族党向全体斯洛伐克人发表宣言，声称此举实为“打破专制枷锁的不得已之举”，其唯一目的在于“恢复斯洛伐克健康、纯净的民主环境”。他们承诺，当前的政治状态仅是“非常时期的过渡政府”，待国家秩序与政治生态被彻底“净化”后，将逐步恢复并完善民主制度。民族党郑重保证，四年后的大选必将如期举行，权力将重归于人民。然而，这番承诺并未能消除弥漫在布拉迪斯拉装上空的忧虑。许多政治精英与观察家敏锐地察觉到，在此次行动中展现出超强组织力与军事化能力的赫林卡人民党，其政治野心绝非甘居人下。他们担心，在这四年的权力真空中，赫林卡人民党将借机深度掌控国家机器，不断坐大。届时，即便大选如期召开，若结果不符合其预期，手握武装的他们或许将毫不犹豫地发动第二次布拉迪斯拉发政变，将斯洛伐克彻底拖入永无止境的极端主义。"
 slovak.17.a:0 "斯洛伐克，我们来了！"
 slovak.18.t:0 "斯洛伐克民族党的历史"
 slovak.18.d:0 "斯洛伐克民族党成立于19世纪70年代初期，自称是巴赫专制主义终结后匈牙利境内斯洛伐克民族捍卫与民族解放斗争的代表。该党以1861年提出的《斯洛伐克民族备忘录》为政治纲领，核心诉求包括改革匈牙利自治政府以及建立被称为“斯洛伐克周边地区”的自治区。1871年6月6日，正值《备忘录》签署十周年且其诉求未获满足之际，该党正式成立。在意识形态上，斯洛伐克民族党追随所谓“旧斯洛伐克学派”政治家的思想。这一学派自19世纪60年代活跃，并于1869年匈牙利议会选举中成功推举出一位议员：维利姆·保利尼-托特。斯洛伐克民族党随后参加了1872年、1875年和1881年的议会选举，但均未成功（当时仅有约6%人口拥有投票权，选举过程既不民主也不公正）。由于屡次失利、选举不公、公开投票受警察监控，以及日益加剧的匈牙利化政策，该党在1878年、1884年和1887年的选举中采取了消极参选（即抵制）策略。1892年，斯洛伐克民族党转而支持匈牙利语天主教人民党名单上的斯洛伐克候选人，并于1896年再度参选，但仍未赢得议席。直至1901年，民族党在国家层面长期保持消极态度，之后才开始为斯洛伐克民族提出语言与文化方面的诉求。在19、20世纪之交，党内形成三大主要派别：以斯韦托扎尔·胡尔班-瓦扬斯基为代表的马丁保守派、以瓦夫罗·什罗巴尔和帕沃尔·布拉霍为代表的声乐派，以及以安德烈·赫林卡为代表的神职派。在1901年选举中，斯洛伐克民族党首次取得突破，赢得匈牙利议会的四个席位。其竞选策略趋于温和，未批评国籍法，并积极倡导普选权。1905年，该党仅保住一席，但在1906年实现最大胜利，共获七个席位（其中六席为与斯洛伐克人民党的联合候选人）。当选议员包括：弗兰蒂谢克·耶赫利奇卡、马特伊·梅托德·贝拉、帕沃爾·布拉霍、费迪南德·尤里加、马丁·科拉尔、弗兰蒂谢克·斯基恰克和米兰·霍扎。在1910年一战前的最后一次选举中，斯洛伐克民族党赢得三席。民族党在斯洛伐克人民党分离后未积极争取大众支持，表现较为精英化，导致其退党逐渐被孤立。1914年8月，斯洛伐克民族党公开表态支持君主制，以避免被政府指控通敌并遭解散。与此同时，斯洛伐克民族党逐渐与捷克政治力量靠拢。1918年5月24日，党内政治家组织了一场名为“内部领导层秘密会议”的集会，讨论斯洛伐克未来走向。在瓦夫罗·什罗巴尔、埃米尔·斯托多拉和米兰·霍扎提交的三项提案中，仅什罗巴尔的方案明确提出与捷克共建捷克斯洛伐克。最终，在安德烈·赫林卡的坚持下，与会者私下表态支持捷克斯洛伐克主义。1918年10月30日，斯洛伐克民族党参与发表《斯洛伐克民族宣言》，并在特尔瓦纳圣马丁成立斯洛伐克民族委员会，党主席马图什·杜拉出任委员会主席。然而，斯洛伐克民族党在与社会民主党和民族农民党的竞争中已边缘化。民族农民党在1920至1922年间短暂合作后，转投捷克斯洛伐克民族民主党，1925年瓦夫罗·什罗巴尔离开斯洛伐克民族党转投民族农民党。1929年和1935年，斯洛伐克民族党唯一当选的议员是马丁·拉祖斯，他是作为捷克斯洛伐克民族民主党（或称自治联盟）的候选人参选。该联盟是斯洛伐克右翼政党联合体，包含斯洛伐克民族党与斯洛伐克赫林卡人民党，于1932年10月16日签署《兹沃伦宣言》后正式成立。1936年斯洛伐克民族党参与了普雷斯堡起义并一举成为斯洛伐克最具有影响力的右翼民主政党。"
 slovak.18.a:0 "至少现在我们赢了"
 slovak.19.t:0 "乌克兰起义军的威胁"
 slovak.19.d:0 "西乌克兰地区的乌克兰起义军及乌克兰民族主义者组织，初看似乎因地理阻隔而难以对斯洛伐克构成直接威胁，毕竟我们之间横亘着加利西亚-洛多梅里亚王冠领地以及匈牙利王国。普遍认为，他们的影响力再强，也难以跨越如此屏障延伸至我国境内。然而现实却证明，他们确实做到了。喀尔巴阡鲁塞尼亚地区的领土归属问题长期悬而未决，目前该地处于匈牙利控制之下，但内部独立运动持续不断，令匈牙利当局疲于应对，最终不得不对该地区实施严格的军事戒严。即便如此，喀尔巴阡鲁塞尼亚的独立情绪仍未平息，其内部更分化为三大派系：主流一派主张完全独立建国，其余则分别倾向于并入乌克兰，或是融入我国，也就是斯洛伐克。然而，我国自匈牙利独立不久，国力尚弱，难以有余力介入喀尔巴阡鲁塞尼亚的复杂局势。乌克兰起义军及其民族主义组织却已高瞻远瞩，在该地区设立分支机构，系统性地训练出一批亲乌克兰的民族主义准军事力量。其中最为人所知的，便是由米哈伊洛·“格罗缅科”·杜达所率领的“格罗缅科团”。与其他乌克兰起义军分支不同的是，格罗缅科团展现出一种近乎矛盾的“仁慈”。他们以亲民作风著称，不仅庇护驻扎地周边的村庄，更为逃难至此的流离失所者提供庇护与食物。他们从不向村民强征粮食或勒索金钱，这种自律使其成为喀尔巴阡鲁塞尼亚诸多武装团体中最为清贫的一支，却也因此赢得了底层民众的广泛认同。然而，这种“仁义”背后，隐藏着更为深远的战略意图。格罗缅科团战斗力惊人，其成员战斗意志坚定，因为他们清楚自己为何而战，不是为了掠夺，而是为了某种更具凝聚力的民族愿景。这绝非斯洛伐克所乐见的局面。更令人警惕的是，该团势力已悄然渗透至翁格地区，并多次试图进入我国普雷绍夫一带，意图在当地建立乌克兰起义军的前哨基地。尽管我国军队已数次击退其渗透行动，但难以保证他们不会再度卷土重来。而格罗缅科团曾在普雷绍夫边境村庄短暂驻扎的经历，已使部分当地居民对其产生怀念甚至公开赞扬之情。"
 slovak.19.a:0 "确实是个不小的麻烦"
 slovak.20.t:0 "斯洛伐克共产党与红色之梦"
 slovak.20.d:0 "斯洛伐克共产党最初源于捷克斯洛伐克共产党的内部分裂。部分不满的斯洛伐克共产党成员认为捷克斯洛伐克共产党失去了共产主义理想，因此决定脱离母党，转而支持建立一个独立且自由的斯洛伐克社会主义国家。捷克斯洛伐克共产党成立于1921年，其前身为捷克斯洛伐克社会民主党（工人党）的左翼派系。该党成立的直接导火索是1920年12月因警察占领左翼机构而引发的全国总罢工。成立大会于1921年5月14日至16日在布拉格召开。会前，捷克社会民主党执行委员会于5月15日至16日举行会议，选举产生大会主席团。共有569名代表出席，代表约35万名左翼社会民主党人。在5月16日的会议上，新执行委员会选举瓦茨拉夫·什图尔茨为主席，博胡米尔·什梅拉尔和瓦茨拉夫·博伦为副主席。大会通过了加入第三国际的二十一项条件，并于1921年6月和7月获得第三国际代表大会批准，标志着共产党的正式成立。当时该党仅整合了捷克社会民主党内的斯洛伐克、捷克和鲁塞尼亚左翼力量；直到1921年11月，在捷克共产党统一代表大会上，才实现了与德国、匈牙利、波兰及犹太共产主义组织的联合，建立起全国统一的共产党。成立之初，捷克斯洛伐克共产党在党员数量和影响力上均为世界上最大的共产主义政党之一，仅次于俄共（布），位列全球第二。然而，1924年，斯洛伐克共产党试图联合匈牙利共产党，在上匈牙利及整个匈牙利地区发动革命，以建立独立的斯洛伐克苏维埃共和国和匈牙利苏维埃共和国。因计划遭叛徒泄露，行动很快遭到匈牙利军警的镇压，革命未果。此次失败使斯洛伐克共产党遭受重创，不得不继续依附于捷克斯洛伐克共产党。在1925年的议会选举中，捷克斯洛伐克共产党获得934,223张选票和41个席位，成为第二大党。同年，该党启动“工团化布尔什维克”进程，旨在强化其对第三国际和法国的政治依附。这一转向源于党内不同意见派系之间的斗争。早在1924年第三国际巴黎代表大会后，捷克斯洛伐克共产党已出现第一波党员开除潮。1925年爆发“布勃尼克事件”，布拉格书记约瑟夫·布勃尼克因拒绝完全服从巴黎路线而被开除出党。此时，捷克斯洛伐克共产党名义上由博胡米尔·伊莱克领导，但以克莱门特·哥特瓦尔德为核心的所谓“卡尔小子”派系包括瓦茨拉夫·科佩茨基、鲁道夫·斯兰斯基、约瑟夫·古特曼等人逐渐崛起。这些年轻成员与前代领导人（被称为“机灵鬼”）在年龄、背景和思想方面截然不同。他们大多出生于世纪之交，入党时未满三十岁，缺乏社会民主主义的历史经验，思想更为激进，社会与家庭根基也相对薄弱。哥特瓦尔德等人常以布拉格卡尔区书记处为据点，逐步扩大影响力。1929年2月，捷克斯洛伐克共产党第五次代表大会彻底被“卡尔小子”掌控，标志着该党工团化布尔什维克过程的完成。克莱门特·哥特瓦尔德接任领导人，成为党史上的重要转折点。尽管大多数创始党员在此过程中退党，该党在1929年10月的议会选举中仍获得753,220票，赢得30个席位，位列第四。1934年，逐渐恢复元气的斯洛伐克共产党在安东宁·雅努塞克与斯蒂芬·巴斯托万斯基的领导下，宣布脱离捷克斯洛伐克共产党。新生斯洛伐克共产党指责捷共领导层接受巴黎工团主义领导是背离了共产主义原则，并正式与捷克斯洛伐克共产党断绝关系。"
 slovak.20.a:0 "不过是一群不得志的赤色暴徒罢了"
 slovak.21.t:0 "波兰斯洛伐克联盟"
 slovak.21.d:0 "我们常听到这样的声音：几个世纪以来，波兰与斯洛伐克，这两个山河相依、命运相连的兄弟民族，始终不曾摆脱外来的压迫与掠夺。正因如此，有人呼吁我们应当携起手来，结成一个真正的兄弟联盟，共同面对那些企图支配我们的外国势力。让我们想清楚：我们要的究竟是共舞，还是合并？是并肩，还是合一？而当外来的风雨再次袭来之时，我们究竟该如何回答，用一个声音，还是两个？"
 slovak.21.a:0 "这是个不错的提议"
 slovak.21.b:0 "还是别抱有这样的幻想了"
 slovak.22.t:0 "[SVK.GetName]想要加入我们的阵营"
 slovak.22.d:0 "自从斯洛伐克革命胜利以来，[SVK.GetAdjective]政府就发现其被敌人重重包围。今天，他们的外交官和代表们给我们打电话，要说上两句。\n在通话中，[SVK.GetLeader]亲自以目前的困境为由，要求同我们建立军事同盟。我们要如何回应呢？"
 slovak.22.a:0 "为啥不呢？"
 slovak.22.b:0 "为啥？"
 slovak.23.t:0 "[FROM.GetNameDef]拒绝了"
 slovak.23.d:0 "在我们礼貌地、彬彬有礼地向[FROM.GetAdjective]打了一通私人电话之后，我们收到了答复，他们拒绝了我们的请求。这让事情变得非常复杂，因为现在我们被敌人重重包围，真是孤立无援，也是时候提高军事预算了。"
 slovak.23.a:0 "一帮流氓……"
 slovak.24.t:0 "工人不满情绪激增"
 slovak.24.d:0 "在斯洛伐克社会民主党成功上台并逐步稳固了中左翼政府之后，政治格局出现了微妙而深刻的变动。曾一度社会民主党动员与武装起来的工人阶级，逐渐察觉到社会民主党在立场上的犹豫与反复。面对其在关键议题上表现出的摇摆姿态，广大工人的失望情绪日益加剧，转而将政治希望寄托于立场更为鲜明的斯洛伐克共产党。这一大规模的政治转向，不仅削弱了我们原有的群众基础，更在根本上动摇了我们长期以来所依赖的社会根基。"
 slovak.24.a:0 "真是一群喂不饱的豺狼"
 slovak.25.t:0 "社民党的福利计划"
 slovak.25.d:0 "我党，斯洛伐克社会民主党，长期以来所倡导的社会福利计划，现在终于迎来了实质性的进展，新计划将全面覆盖医疗、教育、失业保障、住房保障等多个关键民生领域，标志着我们向更公平、更包容的社会迈出了坚实一步。这一切，当然也离不开各大企业的“通力合作”（不合作就吃子弹）在各方力量的共同推动下，我们终于能够逐步实现这一酝酿已久的雄心壮志，为广大斯洛伐克人民构建一个更加稳固、更有温度的社会安全网。"
 slovak.25.a:0 "确实不错"
 slovak.26.t:0 "给资本套上锁链"
 slovak.26.d:0 "卡尔·马克思曾一针见血地指出：“资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。”这句话在我们民族的记忆中，有着鲜血写就的印证。曾经，匈牙利贵族的资本家们如同贪婪的野兽，将他们的铁蹄踏向我们斯洛伐克人。我们被驱赶到昏暗的厂房中，在无情的机器旁耗尽生命。他们榨干我们的汗水，掠夺我们的尊严，无数同胞倒在了冰冷的生产线上，那是一条条吞噬生命的死亡之链，逝去的灵魂早已数不清。这段血与泪的往事，绝不容许重演。今天，我们更要加紧防范，我们斯洛伐克社会民主党虽主张资本与劳动者和谐共存，但他们要是敢克扣劳动者的工资或者通过各种手段压榨劳动者，就别怪我们手下不留情。"
 slovak.26.a:0 "确实该如此"
 slovak.27.t:0 "多瑙河国际？"
 slovak.27.d:0 "维也纳那近亲相奸滋生的腐朽造物，不论更换多少任首相、更迭何种执政党派，都难以掩盖其骨子里散发的恶臭。这不过是个勉强爬进二十世纪门槛、拖着臃肿身躯苟延残喘的畸形侏儒。多瑙河国际这等货色，还是离我们斯洛伐克远些为妙！哈布斯堡家族那群沉溺于乱伦癖好的狂徒，至今还在做着统御多瑙河的白日梦。总有那么一天，我们要亲手为他们钉紧棺材板，让这些历史的残渣彻底埋葬在垃圾堆最深处，连同他们病态的野心一起在腐臭中永世沉沦！"
 slovak.27.a:0 "1848年他们就该死了！"
 slovak.28.t:0 "耶稣之恶"
 slovak.28.d:0 "我们斯洛伐克社会民主党，虽在反宗教立场上不及斯洛伐克共产党那般决绝，却也始终对宗教势力保持高度警惕、严加防范。说到底，我们终究是承袭卡尔·马克思理论血脉的正统传人劳动者们岂能在圣经神话中虚掷光阴？有那份虔诚跪拜基督的工夫，不如去读读德国社会民主党理论家卡尔·考茨基的《基督教之基础》，看清宗教背后的阶级本质与历史虚影。别再沉溺于什么升入天国的廉价美梦了，当心哪天你们信仰的耶稣真的钻进脑袋，把你们的理性与思考啃噬得一干二净！"
 slovak.28.a:0 "有脑子和信宗教总得选一个"
 slovak.29.t:0 "国家歌剧院"
 slovak.29.d:0 "斯洛伐克国家歌剧院总算正式落成了！自打我们破土动工那天起，布拉迪斯拉发的市民们就没停过催促，看起来比我们这帮建设者还要着急。这座歌剧院，是我们斯洛伐克社会民主党为全体公民倾力打造的文化殿堂。说起娱乐方式，美国那边红火的电影院实在叫人眼馋。正因为如此，我们这座歌剧院可不单单是来看唱歌跳舞的场所，它更要为我们斯洛伐克人带来电影这门新艺术！我们已经引进了卓别林先生的一系列电影胶卷，就让这些会动的画面，点亮我们每个无聊的夜晚，滋养我们斯洛伐克人崭新的国民精神。"
 slovak.29.a:0 "给我也买一张票！"
 slovak.30.t:0 "为农民"
 slovak.30.d:0 "我们确实应该好好提醒一下那些整天为工人摇旗呐喊的所谓左翼谁才是这个国家真正的主人。是农民，是那些面朝黄土背朝天的农民！看看现实吧，一个工人一个月的工资，就够一个农民生活整整半年，这难道还不够触目惊心吗？这种差距简直令人胆寒！为什么整个社会都在有意识地疏离农民？为什么报纸上充斥的都是城市精英的声音，而田间地头的身影却越来越被遗忘？这些自诩为左翼的群体，口口声声要为劳动者争取权益，可当农民的利益受到侵害时，他们又在哪里？说到底，他们不过是把马克思的只言片语奉为圭臬，却不懂得结合我们这片土地的实际进行思考。他们捧着书本夸夸其谈，却看不见这片土地上最朴实的耕耘者。他们高喊着要解放全人类，却对身边最需要被关注的农民视而不见。这种脱离实际的“左翼”，不过是在象牙塔里自说自话罢了。真正的爱国者，首先应该为脚下这片土地的主人，农民，挺身而出！"
 slovak.30.a:0 "不爱农民的滚出去"
 slovak.31.t:0 "新书上架"
 slovak.31.d:0 "总统先生瓦夫罗·什罗巴尔的新作《论农民与斯洛伐克民族》，正是一部扛鼎之作。他在书中深刻地剖析了农民阶级与我们斯洛伐克民族主义之间血脉相连的关系，并掷地有声地肯定了农民，我们这片土地的真正奠基者对于塑造斯洛伐克民族不可磨灭的贡献。事实胜于雄辩，这本书的存在本身就说明了一切：谁才是真正将农民放在心上，谁才是农民权益最坚定的捍卫者。答案不言自明，我们斯洛伐克民族农民党，才是那个始终与农民同呼吸、共命运的政治力量！"
 slovak.31.a:0 "我也要买一本看！"
 slovak.32.t:0 "农业工会崛起"
 slovak.32.d:0 "自斯洛伐克民族农民党发布关于农民自行组建农业工会的决议以来，各地如雨后春笋般涌现出众多农民工会组织。仿佛是社会终于睁开了眼睛，开始正视那些长期被忽视的田间身影与乡土呼声。农民，这一始终默默支撑着社会基础却往往被置于边缘的群体，终于等来了属于他们的回响。说到底，想要真正守护农民的权益，终究离不开一股坚定而有力的力量去推动。没有这样的推手，再迫切的诉求也容易湮没于尘嚣，再质朴的心声也难穿透喧嚣的人群。只有这样强力的大手才能让社会的目光不得不转向土地，转向那些在土地上劳作、生活、期盼的人们，托举着整个国家进步。"
 slovak.32.a:0 "任重道远"
 slovak.33.t:0 "一个有理想的农民"
 slovak.33.d:0 "一个真正有理想的农民是什么样子？难道仅仅是望着田垄，幻想今年能多收几斗粮食吗？难道只是拨弄着指头，盘算年末能攒下几个钱吗？不，绝不是这样。那样的目光太短浅，那样的心胸太狭窄。有理想的农民，目光是深远的，他不只看见自己的田，自己的仓，更望向远方的苦难与呼唤。他会想到，在南斯洛伐克那片沉默的土地上，我们的同胞，在匈牙利王国的铁蹄之下，依然衣不蔽体、食不果腹。他们的饥饿，就是我们的屈辱；他们的呻吟，就是我们心头上的怒火。我们不只是种地的人，我们更是土地的儿女，是背负着未来命运的命定之人。我们手中握着的，不只是锄头和草叉，还是打开未来之门的钥匙。总有一天，当号角吹响，当愤怒汇成洪流，我们这些农民，我们这些被轻蔑、被压榨的人，会举起手中的草叉与镰刀，像收割成熟的庄稼一样把那群骑在我们头上的马扎尔恶魔全都砍倒！"
 slovak.33.a:0 "以武止戈"
 slovak.34.t:0 "破坏神像"
 slovak.34.d:0 "数百年来，压在我们脊梁上的，何止是马扎尔人的铁蹄？还有那披着圣袍、口念仁慈的教会！你真以为那些牧师神父只会捧着圣经，说几句“阿门”就完事了吗？不！他们是一群披着羊皮的老鼠，用上帝的名义，一寸一寸啃食我们的血肉！他们一边摸着十字架，一边摸进我们的谷仓；他们一边许诺天国，一边夺走我们最后一块活命的土地。他们让我们像牲畜一样跪着，对他们感恩戴德，对我们说：忍耐吧，再等等，天国的门就要敞开。可我们呢？我们连站都站不起来了！我们饿得眼冒金星，快要倒在泥里。他们难道要我们空着肚子去见耶稣？如果这就是所谓的天主仁慈，那我们宁愿拖着他们一起坠落！就算死了，也要用最后一口怒气，把这虚伪的上帝从神坛上拽下来，连滚带爬的一起下地狱！"
 slovak.34.a:0 "舍得一身剐，敢把上帝拉下马！"
 slovak.35.t:0 "农具使用准则"
 slovak.35.d:0 "若是地主老爷上门，要你把最后一粒活命粮也交出去，你当如何？跪地求饶，盼他发善心宽限几日？还是低头哈腰，双手把粮筐捧上去？答案是去他妈的，你手里握着的不是烧火棍，是镰刀，它能割稻禾，也能割开老爷的喉咙。我们教你用草叉，不只因它能垛稻草，更因它能捅穿老爷那绸缎裹着的肥肚皮。你猜，是先冒出黄澄澄的油，还是红彤彤的血？让他瞪大眼睛看清楚，在他断气前的惨叫里，是我们这些他瞧不起的泥腿子，像田里的稻草人，不，像山一样立着。几千年前，这地里弯腰耕种的是我们；几千年来，血流成河、尸骨成肥，埋在地下的是我们；几千年的欺压过后，如今还站在这片土地上的，依然是我们。老爷？老爷换了一茬又一茬，可我们，永远会在这片田里生根。"
 slovak.35.a:0 "铁打的农民，流水的地主"
 slovak.36.t:0 "卡特尔的终末"
 slovak.36.d:0 "斯洛伐克虽是一个年轻的国家，却已有大型企业试图将触角深入各个角落，企图垄断某一行业，进而胁迫消费者购买其定价高昂、品质低劣的产品。更有甚者，他们还试图收买官员，让政府为这种不义之举背书、保驾护航。如此行径，无异于构建一个巨大的卡特尔集团，它若不加以肢解，必将成为吸附在社会肌体上的吸血鬼，不断吮吸民脂民膏，侵蚀国家根基。"
 slovak.36.a:0 "一步步来"
 slovak.37.t:0 "天主教工人"
 slovak.37.d:0 "一个信仰天主教的工人，往往比毫无信仰的工人表现出更高的工作效率和更饱满的热情。这是因为，对于前者而言，劳动不仅是谋生的手段，更是通向永恒目标的生命实践，他们相信，若能秉持信仰、勤勉尽责，直到生命的终点，必将进入天国，蒙受耶稣的嘉许与赏报。这样的信念赋予他们超越现世的意义感，使他们在日常工作中怀抱盼望、持守责任。而一个毫无信仰的工人，由于缺乏这样的超越维度，容易陷于“活在当下”的状态，日复一日，难以从更高的意义中汲取持久的精神动力，从而在工作的投入与恒心上往往不及前者。"
 slovak.37.a:0 "忠诚的信徒必有回报"
 slovak.38.t:0 "恶果"
 slovak.38.d:0 "恶性竞争在斯洛伐克带来的，从来不是更优质或更便宜的商品，而是一批批以次充好的廉价垃圾。企业为了在价格上“有一战之力”，不得不压缩生产配额，降低原材料的品质，甚至一再压低员工的工资。这种无底线的成本削减，最终让产品质量一落千丈，一步步沦为粗制滥造的工业残次品。长此以往，市场上将再也找不到真正耐用的优质产品，取而代之的，是那些刚出厂就几乎可以直接扔进垃圾场的工业破烂。若不及时对恶性竞争加以遏制，这些企业在利益的驱使下，真的什么都做得出来。"
 slovak.38.a:0 "是该管管了"
 slovak.39.t:0 "斯洛伐克的保守主义必然"
 slovak.39.d:0 "在这个道德与信仰日渐倾颓的时代，保守主义恰如一柄淬炼千年的利刃，刺破笼罩西方世界的堕落阴云。昔日的文明灯塔已黯然失色，巴黎与伦敦的街巷盘踞着荼毒传统的赤色幽灵，自由主义的糖衣炮弹最终击穿了西方精神的最后防线。而更令人警醒的是，那个曾被世人诟病为乱伦成瘾、道德沦丧的哈布斯堡王朝，竟在时代的惊涛骇浪中愈发坚不可摧。黑色星期一的经济海啸非但未能动摇这个古老王朝的根基，反而使其在危机中淬炼出更强大的统治力量，这无疑是对现代性幻梦的绝妙讽刺。在此浊世之中，我们斯洛伐克民族唯有将保守主义的旗帜牢牢插在喀尔巴阡山巅，让传统道德的堡垒在每一个村庄、每一座教堂巍然矗立。当堕落的瘟疫在欧洲大陆蔓延，我们必须在圣基里尔与圣美多德的精神指引下，守护祖先传承的生活之道，方能在这场文明存亡的战役中，避免被西方世界的道德溃烂所蚕食。历史已然证明，唯有坚守我们斯洛伐克人与生俱来的保守品格，方能在狂澜既倒之时，成为拯救欧洲文明的诺亚方舟。"
 slovak.39.a:0 "如利剑般刺向恶魔"
 slovak.40.t:0 "民族与民主的必然联合"
 slovak.40.d:0 "民族主义者必须是民主主义的忠实拥护者，若非如此，民族主义便极易堕落为一种新的恶魔。它将不再是民族的守护者，而会异化为以愤怒为燃料的邪恶帝国，在狂热中建立起压迫性的秩序，一步步驱使人民走向无尽的死亡深渊。唯有那些坚守民主主义原则的民族主义者，才配称为真正的民族主义者；唯有心怀民主精神的民族主义者，才能真正为民族的未来着想，为民族的命运负责。"
 slovak.40.a:0 "诚然如此"
 slovak.41.t:0 "解放者"
 slovak.41.d:0 "斯洛伐克的民族主义，目光又岂能仅仅停留于斯洛伐克自身？我们肩上担负着更为崇高的使命，我们完全应当成为多瑙河各民族的解放者，挥起正义之剑，将那一个个被哈布斯堡邪恶帝国践踏的民族，从其铁蹄下解救出来！我们的理想不应受边界束缚，我们的呼声应当响彻多瑙河两岸。再看向我们的家门口，南斯洛伐克、科希策、喀尔巴阡，这些本应与我们血脉相连的土地，至今仍被马扎尔人牢牢掌控。我们的同胞正在异族的枷锁下喘息，日夜期盼着来自母族的拯救，等待着我们伸出臂膀，为他们夺回应有的自由与尊严！"
 slovak.41.a:0 "奋勇前进"
 slovak.42.t:0 "民族主义情绪高涨"
 slovak.42.d:0 "自斯洛伐克独立以来，一股高涨的民族主义情绪便在街头巷尾蔓延开来。这股浪潮中，最遭殃的莫过于我们境内的匈牙利人。他们那些曾经神气活现的工厂，一夜之间就被愤怒的人群砸得七零八落，根据统计直接经济损失就高达数百万匈牙利福林；不少匈牙利老板被抓出来大的遍体鳞伤，场面一度不忍直视。乡间的马扎尔地主也没能幸免，农民们自发组织起来，用拳头和棍棒狠狠教训了这群趾高气扬的外来者，而这些匈牙利人最终也只能灰溜溜地逃回匈牙利老家去。"
 slovak.42.a:0 "罪有应得"
 slovak.43.t:0 "复仇主义兴起"
 slovak.43.d:0 "令人扼腕的是，尽管我们的起义为斯洛伐克夺得了珍贵的自由，南斯洛伐克、科希策与外喀尔巴阡的广袤土地，却依然被匈牙利王国的铁蹄所践踏。我们的同胞，至今仍困于马扎尔恶魔的枷锁之下，忍受着异族统治的屈辱与苦难。而更令人痛心的是，我们此番奋起的身影，已成匈牙利人眼中的警示，他们必将以更严密的手段、更残酷的监视，紧紧扼住那些尚未解放的土地，使我们同胞的处境愈发艰难。然而，火焰既已点燃，便不会轻易熄灭。终有一日，我们要让自由的旗帜，也在那些沉默的土地上高高扬起，我们必将带去真正的、彻底的解放。"
 slovak.43.a:0 "斯洛伐克的自由万岁！"
 slovak.44.t:0 "选举安保"
 slovak.44.d:0 "第二次选举的进程显然已无法同首次选举的顺利相比，斯洛伐克境内的各派政治力量虎视眈眈，选前数月便已风云暗涌。从城市广场到偏远村镇，骚乱与冲突此起彼伏，共产党武装频频出击，民族主义者的准军事组织四处活跃，袭击事件、爆炸与街头对峙几乎成为日常图景。然而，即便局势如此紧绷，我们依然相信，这些动荡不足以撼动我们亲手建立并守护的民主制度。有人不断提出应强化安保、收紧管控，但我们觉得加强安保会破坏民主制度，让公民不敢参与投票，但如果我们不加强安保很可能那些议会外的反对派会给我们来个大惊喜。"
 slovak.44.a:0 "别管这么多了，民主要紧"
 slovak.44.b:0 "加强安保措施"
 slovak.45.t:0 "[GetYear]年大选"
 slovak.45.d:0 "在必要的安保措施得以强化后，整个选举进程逐渐步入正轨，秩序取代了混乱，选票最终压过了枪声。那些一度活跃在政治边缘的反对派团体，在军警的有力管控下渐趋沉寂，斯洛伐克的街头重新恢复了往日的平静。随着局势明朗，曾心存疑虑的公民也在各方引导下放下顾虑，走向投票站，为他们所支持的政党投下坚定的一票。一切终于重回正轨，我们的民主制度，尽管经历风雨，终究没有被撼动，而是在这场考验中顽强地生存了下来。几天后选举结果出炉，胜利者是："
 slovak.45.a:0 "社会民主党！"
 slovak.45.b:0 "民族农民党！"
 slovak.45.c:0 "民族党！"
 slovak.46.t:0 "社会民主党总统候选人"
 slovak.46.d:0 "现在我们赢得了斯洛伐克的1940年大选，我们要从我们党内提名的总统候选人中选一个出来接替总统一职。"
 slovak.46.a:0 "伊万·德雷尔！"
 slovak.46.b:0 "伊曼纽尔·莱霍基！"
 slovak.47.t:0 "民族农民党总统候选人"
 slovak.47.d:0 "现在我们赢得了斯洛伐克的1940年大选，我们要从我们党内提名的总统候选人中选一个出来接替总统一职。"
 slovak.47.a:0 "瓦夫罗·什罗巴尔！"
 slovak.47.b:0 "米兰·霍贾！"
 slovak.48.t:0 "秩序崩溃"
 slovak.48.d:0 "由于我们在安保措施上的疏忽与不力，给了一些极端团体可乘之机。他们趁着当前社会秩序的混乱状态，公然展开一系列反政府活动，气焰嚣张，形势日趋严峻。根据我们掌握的确切情报，斯洛伐克共产党与赫林卡人民党均已暗中组织起武装力量，企图通过暴力手段强行颠覆现有政权，夺取斯洛伐克的控制权。事态发展至此，斯洛伐克那本就脆弱的民主制度，恐怕已难逃终结的命运。"
 slovak.48.a:0 "要求军队对抗右翼的进攻"
 slovak.48.b:0 "要求军队对抗左翼的进攻"
 slovak.49.t:0 "斯洛伐克革命"
 slovak.49.d:0 "斯洛伐克国防军调动所有可用的部队，拼尽全力迎击赫林卡人民党发起的进攻。经过激烈交战，国防军成功挫败了该党的夺权企图，一举粉碎其武装叛乱。残余的叛乱分子在溃败中仓皇逃窜，最终越境流亡至国外。然而，这场胜利代价惨重，国防军在作战中元气大伤，兵力与资源几近耗尽，已难以组织起有效防线应对来自左翼的斯洛伐克共产党的威胁。在国防力量空虚、局势失控的情形下，斯洛伐克共产党趁势推进，未遭遇实质性抵抗，最终推翻了斯洛伐克共和国政权，全面接管布拉迪斯拉发，结束了斯洛伐克原有的民主体制。"
 slovak.49.a:0 "升起红旗！"
 slovak.50.t:0 "斯洛伐克革命"
 slovak.50.d:0 "斯洛伐克国防军调动所有可用的部队，拼尽全力迎击斯洛伐克共产党发起的进攻。经过激烈交战，国防军成功挫败了该党的夺权企图，一举粉碎其武装叛乱。残余的叛乱分子在溃败中仓皇逃窜，一路逃到了喀尔巴阡鲁塞尼亚。然而，这场胜利代价惨重，国防军在作战中元气大伤，兵力与资源几近耗尽，已难以组织起有效防线应对来自右翼的赫林卡人民党的威胁。在国防力量空虚、局势失控的情形下，赫林卡人民党趁势推进，未遭遇实质性抵抗，最终推翻了斯洛伐克共和国政权，全面接管布拉迪斯拉发，结束了斯洛伐克原有的民主体制。"
 slovak.50.a:0 "斯洛伐克民族万岁！"
 slovak.51.t:0 "斯洛伐克民族起义"
 slovak.51.d:0 "尽管赫林卡人民党已成功入主布拉迪斯拉发并建立起新的政权，军队方面也在形式上表达了妥协，宣布向新政府效忠，然而政权内部远未稳固。军中一部分对赫林卡人民党极端民族主义立场深感不满的高级将领，毅然举起了叛旗，公开宣布发动军事叛乱。他们意图借此时机，彻底推翻赫林卡人民党的统治，重塑国家政局。令人意外的是，面对这场突如其来的内部挑战，多数军队单位选择了按兵不动。他们既不响应政府的镇压指令，也不主动支持叛乱势力，仿佛在静观其变，等待局势的明朗。如此一来，赫林卡人民党不得不孤军奋战，只能依靠自身有限的力量去应对这场深刻的政治危机。"
 slovak.51.a:0 "起义者赢了！赫林卡人民党被推翻！"
 slovak.51.b:0 "赫林卡人民党镇压了叛乱！"
 slovak.52.t:0 "乌克兰在行动"
 slovak.52.d:0 "在当前斯洛伐克政局持续动荡、内部权力结构尚未稳固之际，盘踞于喀尔巴阡鲁塞尼亚地区多年的乌克兰起义军“格罗缪科团”，趁乱在凌晨时分越过边境，悄然进入斯洛伐克东部领土。这支训练有素、作战经验丰富的部队行动迅速，几乎未遭遇有效抵抗。今天上午，位于边境不远的重要城市普雷绍夫宣告沦陷，格罗缪科团已全面控制该市及其周边关键设施。目前，他们正积极整顿军队、巩固占领区，并筹备进一步的军事行动。有情报显示，该团指挥官意图借此斯洛伐克内部分裂之机，向西推进，直指首都布拉迪斯拉发，最终目标是占领斯洛伐克全境，将整个国家纳入其控制之下，而斯洛伐克政府已经集结了军队，准备将入侵者驱逐出去。"
 slovak.52.a:0 "僭越者被击垮，残余部队退回外喀尔巴阡"
 slovak.52.b:0 "布拉迪斯拉发陷落，荣耀归于乌克兰！"
 slovak.53.t:0 "第二次斯洛伐克革命"
 slovak.53.d:0 "遁入外喀尔巴阡山区的斯洛伐克共产党军队并未就此沉寂。他们在这一偏远地带重整旗鼓，迅速集结并整编了部队。斯洛伐克共产党广泛联络了一批爱国主义的准军事组织，同时收拢了斯洛伐克国防军溃散后的残余部队，形成了一支临时却不容小觑的抵抗力量。如今，这支联合部队正准备向盘踞在普雷绍夫的乌克兰起义军“格罗缅科团”发起最后的冲锋。他们清楚，这不仅仅是一场军事反击，更关乎斯洛伐克国家命运的存续。倘若此次反攻不能将乌起义军逐出国土，斯洛伐克作为一个独立国家的历史与认同，或将就此走向终结。"
 slovak.53.a:0 "血流成河，乌克兰起义军维持了控制！"
 slovak.53.b:0 "斯洛伐克共产党驱逐了入侵势力！"
 slovak.54.t:0 "赫林卡人民党的新领导层"
 slovak.54.d:0 "现在我们已经夺得了斯洛伐克的政权，并且巩固了赫林卡人民党的领导地位，国内的秩序也正在逐步恢复，现在我们该选一个赫林卡人民党的代表出任斯洛伐克元首一职"
 slovak.54.a:0 "安德烈·赫林卡！"
 slovak.54.b:0 "约瑟夫·蒂索！"
 slovak.54.c:0 "亚历山大·马赫！"
 slovak.55.t:0 "以黄代红"
 slovak.55.d:0 "斯特凡·苏罗维亚克提议，斯洛伐克人民党既不可借助暴力镇压进一步激化工人阶级的不满、将其推向左翼阵营，也不应坐视社会主义力量在政治领域持续壮大。面对这一两难局面，他主张创建一种新型的“工会”组织，用以对抗日益激进的红色工会，即所谓“黄色工会”。这类工会在表面上以独立工会身份示人，实际上却由人民党提供资金支持，甚至直接安插党内人员加以操控。其策略分步推进：首先，通过参与公开的反政府活动博取工人群体的信任与支持；随后，在工人中悄然植入思想引导，逐步将其争取权益的方式从暴力抗争扭转为和政府展开对话；进而使其完全服从于政府指挥，并将工人对自身权益的关注转移至民族解放、国家复兴等宏大议题中。通过这一系列操作，黄色工会能够在无形中逐步挤压、取代各类社会主义工会。这一策略不仅使政府避免了与左翼阵营的直接冲突，还能成功的在无产阶级内部制造对立。最终，政府几乎不费一兵一卒，便可全面清除反对声音，实现对社会运动的彻底掌控。"
 slovak.55.a:0 "苏罗维亚克真是个天才！"
 slovak.55.b:0 "这是否会破坏我们的民主生活？"
 slovak.56.t:0 "红与褐"
 slovak.56.d:0 "亚历山大·马赫或许是斯洛伐克人民党中最为矛盾也最引人注目的人物。他公开以激进的斯洛伐克民族主义者自居，旗帜鲜明地反对共产主义，然而在政治帷幕之后，却与多位斯洛伐克共产党高层保持着密切的私人联系，弗拉基米尔·克莱门蒂、拉科·诺沃梅斯基、古斯塔夫·胡萨克等人，都曾是他那张关系网中的一员。马赫不仅试图在政治上为他们辩护，甚至屡次动用自身影响力，帮助他们免于因“反政府罪”遭到司法追诉。早在担任准军事组织指挥官期间，马赫就时常为这些共产党友人“开绿灯”，使他们一次次在围捕中安然脱身。而当他登上国家元首之位后，这种偏袒行为更加公开且系统化。政府对于反对派的清剿，逐渐演变成仅针对民主团体的选择性打击；许多执行任务的士兵在得知目标为共产党员身份后，甚至选择直接视而不见、绕道而行。在这种纵容与默许之下，斯洛伐克共产党人逐渐在政治夹缝中积蓄力量。或许，我们正可把握这一特殊局面，推动共产党人正式进入政府体系，毕竟，唯有容纳各派政治力量，才称得上真正意义上的“民族团结”。"
 slovak.56.a:0 "当然，我们正有此意"
 slovak.56.b:0 "算了吧，反共的外衣可不能脱"
 slovak.57.t:0 "军政府的未来"
 slovak.57.d:0 "斯洛伐克的军政府自诞生起便从未真正赢得过民众认同，这个由职业军人主导的政权始终笼罩在不受欢迎的阴云里。谁也未曾料到，这支素来被视作保守僵化的军事集团竟会主动点燃导火索，他们以"捍卫民族利益"为旗号发动了斯洛伐克民族起义。更令人错愕的是，这场原本不被看好的军事行动竟大获全胜，一举击溃了实力雄厚的赫林卡人民党政权。然而胜利的欢呼声尚未消散，面对后续此起彼伏的反对声浪、政治崩溃的烂摊子与民众持续的低信任度，这支军事集团竟又凭借铁腕手段奇迹般稳住了阵脚。可表面的平静下暗流汹涌，即便暂时守住了权力，军政府依然如同坐在火山口上，民意的背离如影随形。对于掌舵者鲁道夫·菲斯特而言，若想从根本上稳固统治根基，此刻正站在必须抉择的十字路口。摆在面前的似乎只有两条路径：其一是顺应迟早要来的政治潮流，重新开放民主大选，将权力交还给政党博弈与民意裁决的场域；其二则是延续军事集团的惯常手段，把这副千疮百孔的治理重担转手甩给捷克斯洛伐克军团，尽管后一种选择犹如将火种引向邻人，能否扑灭自身的危机尚未可知，却至少能暂时抽身于舆论的风暴中心。"
 slovak.57.a:0 "将权力移交给军团"
 slovak.57.b:0 "开放民主选举"
 slovak.58.t:0 "军政府管制下的民主选举"
 slovak.58.d:0 "令人颇感意外的是，鲁道夫·菲斯特最终应下了民主政党的诉求——他并未如外界揣测那般，将眼前这摊足以搅动政局的烂摊子推给捷克斯洛伐克军团收拾。不过这位老练的政客显然深谙权衡之道，在松口妥协的同时，也与民主派阵营达成了某种隐秘的政治默契：无论本轮选举最终是哪个党派突出重围执掌大权，鲁道夫·菲斯特本人及其核心幕僚班底都须保留在总统职位与内阁要职之上。于是在各民主政党的承诺下，军政府召开了民主大选。\n\n结果出炉，胜利者是："
 slovak.58.a:0 "社民党的德雷尔"
 slovak.58.b:0 "社民党的莱霍基"
 slovak.58.c:0 "农民党的什罗巴尔"
 slovak.58.e:0 "农民党的霍贾"
 slovak.58.f:0 "民族党的拉祖斯"
 slovak.59.t:0 "革命议会选举"
 slovak.59.d:0 "临时革命议会是斯洛伐克共产党在1940年斯洛伐克革命期间组建的一个临时行政机构，旨在接替原斯洛伐克国民议会的行政职能。随着革命爆发，斯洛伐克共产党利用民主政府疲于应对极右翼势力进攻的时机，迅速进入并控制了首都布拉迪斯拉夫。在此过程中，原有的国民议会被解散，国家行政体系出现权力真空。为维持政府基本运转、稳定社会秩序，临时革命议会遂应运而生，承担起过渡时期的行政管理职责。然而，该机构自设立之初便明确其临时性质，并不具备长期执政的合法性基础。面对国内外形势的复杂变化，临时革命议会急需推选出一位具备威信与能力的领导人，以统筹过渡阶段各项事务，并推动政治进程回归正轨。尽快完成国民议会的职能重建与权力移交，已成为当前最为紧迫的政治任务。"
 slovak.59.a:0 "开始吧"
 slovak.60.t:0 "斯特凡·巴什托万斯基"
 slovak.60.d:0 "斯特凡·巴什托万斯基于1910年2月7日出生在匈牙利王国布达佩斯的一个斯洛伐克裔家庭。在多元文化交织的布达佩斯度过童年与青年时期，他自幼接触到工人阶层的现实处境与民族认同的张力。成长过程中，1917年俄国十月革命的消息传来，革命理想与平等愿景在他心中埋下种子，使他对社会主义思想产生强烈共鸣。然而，当时匈牙利王国政府严厉压制左翼运动，公开探讨或参与社会主义活动极为困难，他只能将这份理想暂藏心底。成年后，巴什托万斯基随家人迁回斯洛伐克地区的文化中心布拉迪斯拉发。1930年，受当时斯洛伐克民族情绪高涨的影响，他加入了具有民族主义色彩的斯洛伐克赫林卡人民党。但很快，他意识到该党强烈的排外倾向与极端民族主义立场，与其所追求的社会平等理念相悖，遂毅然退党。此后，他前往波西米亚王冠领地（即捷克地区）游学，并在布拉格结识了一批持马克思主义立场的斯洛伐克知识分子。在这些同道的影响下，他先后加入了捷克斯洛伐克共产党以及更为侧重斯洛伐克问题的独立斯洛伐克共产党。1934年，由于不满捷克斯洛伐克共产党内部日益明显的修正主义路线以及忽视斯洛伐克自主性的“大捷克主义”倾向，巴什托万斯基带领一批斯洛伐克籍党员退出该党，转而与独立斯洛伐克共产党的领导人安东宁·雅努塞克展开谈判。双方最终达成共识，将组织合并为统一的“斯洛伐克共产党”，强化了斯洛伐克共产主义运动的主体性。此后，巴什托万斯基回到布拉迪斯拉发积极投身地下宣传、工人组织等革命活动。1940年，斯洛伐克革命爆发，他凭借长期积累的声望与组织能力被推举为布拉迪斯拉发国家委员会主席，承担起领导地方革命政权的重要职责。同时，他也先后成为斯洛伐克临时革命议会、制宪国民议会以及正式国民议会的成员。"
 slovak.60.a:0 "就他了！"
 slovak.60.b:0 "看看下一位吧"
 slovak.61.t:0 "拉科·诺沃梅斯基"
 slovak.61.d:0 "拉科·诺沃梅斯基出生于一个裁缝家庭，父亲是塞缪尔·诺沃梅斯基，母亲是伊尔玛·普日科波娃。父母从塞尼察迁居至布达佩斯后，他在那里出生，并完成了小学和中学教育。1919年后全家再度搬迁，他进入塞尼察和莫德拉的师范学院学习，于1923年毕业。之后他开始从事教师职业，同时以校外学生身份注册进入科梅纽斯大学文学院学习，期间对文学与政治活动产生浓厚兴趣。1924年，他出任《青年斯洛伐克》杂志编辑，该杂志由扬·波尼坎接手，原出版方为斯洛伐克学生联盟，后联盟解除了他的编辑职务。同时，他积极参与戴维斯小组的活动。1925年，诺沃梅斯基加入捷克斯洛伐克共产党，并开始在党的媒体机构工作，先后担任过奥斯特拉瓦《真理报》、《无产者报》和《蒙卡萨报》的编辑及总编辑，以及布拉格《鲁迪晚报》的编辑。1922年，后来的戴维斯成员扬·波尼坎发表《斯洛伐克人与国际主义》一文，同年斯洛伐克社会主义学生自由协会成立，成员包括波尼坎、奥卡利、克莱门蒂斯、西拉茨基和托马希克-杜明等人。他们最初在《自由》杂志发表文章，后转至《青年斯洛伐克》。诺沃梅斯基通过该协会与民主美国学生协会建立联系。在布拉格，他加入左翼先锋团体“戴维斯”，与乌尔克斯、奥卡利、克莱门蒂斯和波尼坎等人共事。1927年，他因触犯新闻法被捕入狱并处罚金。据斯特凡·德鲁格所述，警方早在1925年已将诺沃梅斯基列为危险共产主义者。1926年他接替哥特瓦尔德出任《真理报》总编辑后，国家检察官频繁查没其文章，诺沃梅斯基本人也屡因被批评者控告而受审。德鲁格指出，尽管许多法庭档案已遗失，但他通过奥帕瓦国家档案馆的资料研究发现，相关案件包括拒绝刊登通讯员来信、卢切内茨警察局长扬·孔皮什指控其侮辱，以及《我们有一个斯洛伐克苦行僧》《切特尼克刺刀保护的工厂》等文章引发的争议，还有工人通讯员在《这就是现状，这就是未来》中与巴塔的论战。罚款、审讯、对通讯员的刑事指控、威胁、审查、秘密监视，乃至1927年两次被判5日监禁，构成了诺沃梅斯基作为编辑的日常现实。1929年，诺沃梅斯基拒绝签署《七人宣言》，并在捷共五大后支持哥特瓦尔德及其获胜的列宁主义路线。针对《七人宣言》，他号召左翼知识分子支持党的立场。20世纪30年代，他与古斯塔夫·胡萨克、扬·波尼坎、丹尼尔·奥卡利、弗拉基米尔·克莱门蒂斯等人活跃于斯洛伐克共产主义知识分子圈，即“戴维斯派”。他们自视为左翼，同时带有民族主义倾向，强调斯洛伐克的独特性，对捷克斯洛伐克主义持批判态度。1934年捷共分裂，斯洛伐克共产党宣布成立，诺沃梅斯基加入新党。1935年，他出版诗集《敞开的窗户》，获得亚历山大·马图什卡、约瑟夫·费利克斯和米兰·皮舒特等评论家的好评，被认为融合了无产阶级主题与先锋派风格。该诗集也帮助作者走出了一段创作上的怀疑与低落期，重新确立社会革命与诗歌创作的辩证统一。1936年，他参与组织特伦钦-特普利采大会，呼吁东西方进步文化力量团结对抗帝国主义、野蛮行径、宗教或世俗的优越论及非人道现象。诺沃梅斯基后来回顾认为，此次大会意义重大，成功汇聚了迪隆、克莱门蒂斯、卢卡奇、贝尼亚克、波尼坎、乌尔班、吉列姆尼茨基等不同政治背景的人物，尽管数年后其中一些名字已显得“颇具矛盾性”。在他看来，特普利采所凝聚的团结为革命中的民族团结奠定了基础。"
 slovak.61.a:0 "就他了！"
 slovak.61.b:0 "看看下一位吧"
 slovak.62.t:0 "瓦西尔·比拉克"
 slovak.62.d:0 "瓦西尔·比拉克出身于斯洛伐克东北边境一个名为克拉伊纳比斯特拉的偏僻小村庄，其家族具有鲁塞尼亚人的血统背景。在投身共产主义运动期间，他公开以乌克兰人身份自居——这一选择背后，是鲁塞尼亚人长期被压抑的民族认同困境。比拉克希望通过政治活动为他们争取话语权，尽管这一份表述本身也折射出多民族地区中复杂的认同纠葛。他原名瓦西尔·久拉，童年充满坎坷。三岁时父亲离世，母亲改嫁一位据称曾拥有财富但性情暴躁的美国人。更不幸的是，母亲在他十一岁时也撒手人寰。家中七个兄弟姐妹中，仅有兄长迪米特里一人与他共同存活下来，艰苦的成长环境塑造了他坚韧甚至固执的性格。完成小学教育后，比拉克前往赫拉德茨-克拉洛韦，成为裁缝师傅弗朗蒂谢克·鲁塞克的学徒。1936年，他迁往布拉迪斯拉发，进入一家裁缝工场工作，也开始真正接触工人运动与社会思潮。同年，他先后加入具有左翼色彩的共产主义红色联盟及斯洛伐克共产党，展现出强烈的组织热情与宣传才能。由于善于动员基层工人，他很快在党内崭露头角，被调入斯洛伐克共产党布拉迪斯拉发地区委员会工作。那段时间，比拉克过着双重生活：白天仍在裁缝店做工维持生计，夜晚则投身于政治培训与秘密会议，星期日也常用来进行宣传动员。这种高强度的节奏，不仅反映出他对革命事业的投入，也展现了其出色的组织耐力与纪律性。共产党夺取政权后，比拉克凭借其坚定的意识形态立场与基层工作经验，迅速进入党的领导层。他先后担任斯洛伐克共产党中央委员会部门负责人、普雷绍夫地区分部书记，并最终晋升为中央委员会总书记，成为斯洛伐克地区最具影响力的政治人物之一。"
 slovak.62.a:0 "就他了！"
 slovak.62.b:0 "看看下一位吧"
 slovak.63.t:0 "古斯塔夫·胡萨克"
 slovak.63.d:0 "古斯塔夫·胡萨克出生于尼科德姆·胡萨克与其妻子玛格达莱娜（娘家姓弗拉特里乔娃）的家庭。他在婴儿时期受洗，取名奥古斯蒂纳。不幸的是，在他仅15个月大时，母亲因肺结核去世。几个月后，父亲尼科德姆应征入伍，一岁半的胡萨克与两位姐姐卡塔琳娜和斯特凡妮娅被迫由亲戚代为照料。此后四年，胡萨克在杜布拉夫卡过着没有父亲陪伴的生活。尼科德姆在战争中头部和手部受伤，因伤残退伍，却未能回到战前工作的帕特龙卡布拉迪斯拉发弹药厂就业。为此，他转而务农，并在杜布拉夫卡市政部门兼职以维持生计。1920年9月，尼科德姆与当年1月丧夫的玛丽亚·维莱莫娃（娘家姓维莱莫娃）再婚。尼科德姆还将玛丽亚与前夫所生的两个女儿朱莉娅和罗莎莉娅接入家庭，不久后，他们又诞下儿子斯特凡。新家位于亚德兰斯卡街，同住的还有玛丽亚的妹妹和母亲。在这样的环境中，胡萨克度过了战后的艰难童年，从小就学会为生存和前途奋斗。在班主任和杜布拉夫卡教区神父的帮助下，胡萨克于1925年9月考入位于格罗斯林戈瓦街的布拉迪斯拉发国立皇家中学。他成绩优异，最初入学的54名同学中仅有11人最终通过毕业考试，胡萨克是其中之一。1933年9月，他进入科梅纽斯大学法学院深造，于1937年完成学业，并于1938年获得法学博士学位。此后，他担任友人弗拉基米尔·克莱门蒂斯的法律助理。1938年9月1日，胡萨克与演员兼导演玛格达·胡萨科娃-洛克文佐娃结婚。胡萨克的政治倾向早在青少年时期便已显现。1929年，年仅十六岁、仍为中学生的他秘密加入当时被严格禁止中学生参与的捷克斯洛伐克共产主义青年团。中学期间，他活跃于弗尔切克教育小组，该组织为学生提供教育、文化及体育活动。凭借出色的组织能力和强烈抱负，胡萨克逐渐升任为该小组的主席。1933年进入大学后，他正式加入捷克斯洛伐克共产党，并于次年成为新成立的斯洛伐克共产党成员，曾担任《Šíp》杂志编辑。他还积极参与学生社团，如“法学家”社团、社会主义学术协会以及后来的多瑙河学术协会，并晋升为全斯洛伐克学生联盟副主席。20世纪30年代中期，胡萨克投身于“戴维斯派”第二代运动（以1924–1937年间出版的《戴维斯报》为核心），成为弗拉基米尔·克莱门蒂斯和拉科·诺沃梅斯基的追随者。这两人后来成为他珍视的朋友与精神导师。胡萨克日后成长为斯洛伐克共产党内改革运动的关键人物，其政治立场相比温和的亚历山大·杜布切克更为激进，展现出坚定的理想主义与改革决心。"
 slovak.63.a:0 "就他了！"
 slovak.63.b:0 "看看下一位吧"
 slovak.64.t:0 "亚历山大·杜布切克"
 slovak.64.d:0 "亚历山大·杜布切克于1921年11月27日出生在斯洛伐克的乌赫罗韦茨。三岁那年，他随全家迁往法国，童年的大部分时光在奥克西坦地区一个被一些人称为“公社”的聚落中度过。该地位于罗讷河畔，隶属于法兰西公社体制下的罗讷大区。1933年，杜布切克十二岁时，全家又搬至法兰西公社中部的城市布尔日。尽管在异国成长，亚历山大始终心怀故土，之后一家人决定重返斯洛伐克。回国后，十七岁的亚历山大加入了当时仍处于非法状态的斯洛伐克共产党，并在工作场所积极组织抵抗运动。他在杜布尼察纳德瓦霍姆的一家工厂里学到了人生中的第一门手艺，与哥哥尤利乌斯以及童年好友安娜·博尔塞科娃并肩工作。这个时期的杜布切克一家，政治活动更多依赖于紧密的人际网络，而非僵化的党内架构，全家人辗转多地，共同承担风险与使命。杜布切克的父亲斯特凡自1921年便是党员，回国后他再次投身党务，负责印刷党报、伪造各类证件与官方文件，并制作其他左翼出版物。在这样的家庭氛围下，亚历山大很早就接触到政治实践与理想主义的双重洗礼。1940年，杜布切克在斯洛伐克共产党的一次全会上发表讲话，鲜明地表达了其所属一代人逐渐成形的政治信念：他们不愿接受单一工人阶级或党内官员的专制统治，而是倾向于诉诸一种普遍而包容的人类原则。这一原则在起源、实践与目标上，既与社会学及马克思列宁主义存在共通之处，又融合了两者的特质，展现出更为宽广的伦理视野与人本关怀。"
 slovak.64.a:0 "就他了！"
 slovak.64.b:0 "回到第一位吧"
 slovak.65.t:0 "《鬣狗想要战争》"
 slovak.65.d:0 "没人会喜欢打仗，是的，这世上没有人不憎恶战争。只有鬣狗才渴望硝烟，它们怯懦地躲在光亮的背面，白天披上人皮，混迹在我们中间，装作我们的同胞、邻居，甚至领袖；可一旦黑夜降临，它们就从洞穴中爬出，以尸体为食，贪婪地啃噬我们年轻孩子的血肉。他们假借响亮的口号，高喊着“为了民族，为了斯洛伐克”，把我们的儿子、丈夫、父亲，一个又一个送上战场，推向死地。一颗子弹就能轻易击碎一个家庭的天空；一个倒下的身躯，也许正承载着全家的希望与温饱。而鬣狗在后方，牙齿沾着血，嘴角挂着肉，却还在嘶吼着空洞的荣耀。它们要的从来不是守护，而是用我们的痛苦喂养它们的贪婪。那些为了资本的征服与掠夺而点燃战火的人，本就应该自己拿起枪，站到第一线去！谁若再敢叫嚣战争，我们就先把他拖出来，送到炮火最密集的地方，让他亲身体会，什么叫血肉之躯面对钢铁的咆哮，什么叫活着的地狱。只有鬣狗，才盼望战争。因为它们早已不是人，它们靠我们的死亡苟活。"
 slovak.65.a:0 "和平最难能可贵"
 slovak.66.t:0 "名为贪婪"
 slovak.66.d:0 "“结束所有战争的战争”，自始至终都是一场不义的战争，这是无论那些高高在上的精英们如何用爱国主义与民族主义绑架民众，都永远洗刷不掉的真相。他们把罪责推给了一个年轻人，一个年仅十九岁、却比在座所有列强都更有良心的青年。他有什么错？他手中射出的那两颗子弹，送走了一位大公，也射穿了一个民族积压多年的血与泪、仇与痛。而列强呢？他们只会推诿，只会转嫁，把一场导致三千万人丧生的战争的罪名，统统压在这位勇敢的年轻人肩上。可无论有没有加夫里洛·普林西普扣动扳机，战争都注定爆发。那是列强之间不可调和的矛盾，是早已绷紧的弦，是堆满火药的高台，只等一颗火星。普林西普，不过是恰好点燃了它。于是世界付出了三千万条生命的代价，换来了什么？换来了德意志帝国在欧陆的短暂凯旋，换来了那个看似摇摇欲坠、却仍强撑至1936年的奥匈帝国。他们指着堆积如山的尸体，说这是和平；他们以“必要之恶”为名，将无数牺牲轻描淡写。而普林西普的那两颗子弹，终究没有击穿不公的世道。它们只是加速了一场无法避免的浩劫，让血更快地流成河，让恨更深地埋进历史的裂缝里。"
 slovak.66.a:0 "射杀斐迪南大公的从来不是那两颗子弹"
 slovak.67.t:0 "多瑙河联邦计划"
 slovak.67.d:0 "尽管多瑙河联邦主义的思想并非由米兰·霍扎首倡，但毫无疑问，他堪称这一理念的大师级实践者与推动者。与那种仅仅服务于奥地利皇帝意志、沦为统治工具的“奥地利多瑙河联邦主义”截然不同，霍扎所倡导的多瑙河联邦主义，以其平等与包容的底色，被许多人视为奥匈帝国内部各民族的希望之光。他主张多瑙河流域所有国家与民族结成一个真正平等的共同体，坚决反对任何单一民族主义的主导与压迫。正是这种超越狭隘民族利益的视野，使米兰·霍扎长期以来深得奥匈境内各民族群体的广泛支持。如今，他已稳坐斯洛伐克总统之位，手握实权，迎来了将毕生所构想的多瑙河联邦从理念推向现实的历史性机遇。"
 slovak.67.a:0 "多瑙河，联合起来！"
 slovak.68.t:0 "斯洛伐克的命运"
 slovak.68.d:0 "近日维也纳的政治风向标剧烈震颤，曾被哈布斯堡王朝统治数百年的捷克地区，终于彻底挣脱了帝国的桎梏。随着最后一支奥军撤离布拉格，波西米亚平原的晨雾里飘扬起全新的旗帜，整座波西米亚全境都沐浴在主权回归的暖阳中。消息传到布拉迪斯拉发时，斯洛伐克议会厅的水晶吊灯都在微微震颤，这个与捷克山水相连却命运多舛的民族，正站在历史的十字路口。\n\n布拉格的贺电墨迹未干，捷克临时政府的特使已带着民族热忱跨过边境。他们在谈判桌上摊开精心绘制的地图，将"大捷克斯洛伐克"的国界线描得格外清晰："我们的兄弟应当共享自由的光荣。"言辞间既有手足团聚的拳拳期盼，亦藏着不容置疑的弦外之音——那些曾在奥匈帝国治下共同遭受压迫的记忆被反复提及，仿佛在说：当年我们能并肩抗争，如今岂能分道扬镳？\n\n更耐人寻味的是特使话锋微转时的暗示："若斯洛伐克仍犹豫，我国或将不得不采取'必要手段'维护共同利益。"布拉格的报纸次日便隐晦提及"经济协同机制""文化融合计划"，明眼人都明白，这温和措辞下藏着怎样的分量——毕竟刚获新生的捷克握有更完整的工业体系、更庞大的军队，以及国际社会更广泛的承认。\n\n斯洛伐克议会里正弥漫着复杂的情绪。老议员们抚摸着泛黄的《斯拉夫民族宪章》低叹，想起百年前共同签署的统一愿景；年轻代表们则翻看着捷克送来的基建蓝图，描绘着布拉迪斯拉发与布拉格互联的高铁。但质疑声同样尖锐："我们刚从匈牙利王冠下挣脱，难道要立刻套上另一个民族的框架？"窗外的多瑙河静静流淌，映出这个新生民族尚未明晰的未来。"
 slovak.68.a:0 "捷克斯洛伐克，统一而不可分割！"
 slovak.68.b:0 "我们必须捍卫斯洛伐克的自由！"
 
 worldnews.1669.t:0 "斯洛伐克从匈牙利独立！"
 worldnews.1669.d:0 "经过近百年前赴后继的不懈抗争与民族意识的不断觉醒，斯洛伐克终于凝聚起足以撼动历史的力量，挣脱了匈牙利王国长达数个世纪的统治。在民族自决的旗帜下，斯洛伐克人民众志成城，团结一心，为他们年轻的共和国翻开了崭新的篇章。此刻，这个新生的国家正站在政治抉择的十字路口，人民期待着一位深孚众望的领袖，能够引领斯洛伐克走向稳定与繁荣。眼下，社会民主党作为执政党，正主导着国家的初步建设。然而，政治的潮汐从不停歇，他们还能延续当前的执政势头吗？是继续凭借现有政策赢得民心，还是将在民主选举的机制下面临权力更迭？随着不同政治力量的消长与民意的流转，一切仍是未定之天。但无论如何，一个不争的事实已经铸就：斯洛伐克终于迎来了属于她的自由。挣脱了外族的桎梏，这个国家与其人民，正以独立的姿态，坚定地迈向充满希望的未来。"
 worldnews.1669.a:0 "祝他们好运！"
 
