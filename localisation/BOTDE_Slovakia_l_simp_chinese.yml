 POLITICS_SVK_STEFAN_SUROVIAK_DESC:0 "§Y领导人介绍§!\n§Y生于：§!1892年11月10日，斯洛伐克日利纳州多尔尼库宾区普里什比村\n§Y政治生涯：§!第一次世界大战爆发后，斯特凡·苏罗维亚克在特伦钦应征入伍，被编入斯洛伐克第71步兵团。在接受为期两个月的军事训练后，随即被派往俄国前线参战。在战斗中不幸被俘，但成功逃脱，最终在克拉古耶瓦茨市与部队会合。在此期间，他亲眼见证了克拉古耶瓦茨起义中42名斯洛伐克士兵被处决的悲剧。此后，他被任命为黑海沿岸城市马里乌波尔火车站的站长，并在此职位上服务至战争结束。战争结束后，苏罗维亚克回到日利纳，再次任职于铁路部门，并开始积极参与公共事务。1919年11月2日，他与几位斯洛伐克官员共同在日利纳创立了“斯洛伐克铁路员工独立工会”，即斯洛伐克铁路工人联合会。他最初担任记录员，后晋升为秘书，并于1922年起出任工会主席。此外，1921年他还创办并出版了专业期刊《斯洛伐克铁路工人报》。作为斯洛伐克人民党及其领袖安德烈·赫林卡的坚定支持者，苏罗维亚克于1923年代表该党当选为波瓦日斯卡县议会议员。之后，他于1925年、1929年及1935年连续三届当选为斯洛伐克议会议员，代表斯洛伐克人民党。在这三段议员任期内，他参与了多个议会委员会的工作，包括预算委员会、交通委员会及文化委员会。随着安德烈·赫林卡逐步将党内权力移交给他，苏罗维亚克得以逐步推动其理念的实现，即以“黄色工会”的形式，通过温和改良的路径，取代激进的暴力斗争方式。"
 POLITICS_ALEXANDER_MACH_DESC:0 "§Y领导人介绍§!\n§Y生于：§!1902年10月11日，斯洛伐克尼特拉州新扎姆基区梅德尔村\n§Y政治生涯：§!亚历山大·马赫于1922年加入由赫林卡领导的斯洛伐克人民党。在沃伊泰赫·图克的支持下，他于1924年成为该党防卫组织（成立于1923年）的领导人，并进入斯洛伐克人民党政治委员会。自1923年起，他担任《特伦坎》杂志的编辑；1925年至1939年间，转任《斯洛伐克》杂志的编辑及主编；1936年，他还曾出任《斯洛伐克真理报》的主编。从1936年开始，马赫成为斯洛伐克人民党领导层成员，并被视为党内激进派的核心人物。尽管马赫一贯持反共立场，但他仍与弗拉基米尔·克莱门蒂斯、拉科·诺沃梅斯基等知名共产党人保持联系。他曾如此评价诺沃梅斯基：“他并非政治人物，而是一位杰出的诗人，是我很好的朋友，但也是我的意识形态敌人。”马赫主张斯洛伐克应完全独立于捷克，并推动建立独立政府。此外，他还系统性地参与并组织了对犹太人及国内其他少数民族（如匈牙利人）的迫害，认为斯洛伐克对匈牙利人的压制是对历史上民族屈辱的一种清算。"