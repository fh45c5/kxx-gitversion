 SVK_Bratislava_NAME:0 "布拉迪斯拉发"
 SVK_anti_hungarian_sentiment:0 "反匈牙利情绪"
 SVK_anti_hungarian_sentiment_desc:0 "848年的“民族之春”唤醒了斯洛伐克人的民族意识，独立之愿初次萌芽。自此，斯洛伐克的独立运动与文化启蒙浪潮迭起，却在马扎尔人的严酷镇压下渐趋沉寂。1918年，随着以德意志帝国为首的同盟国在欧洲大陆高奏凯歌，我们的独立事业遭受沉重精神打击，许多人不再怀抱独立的希望，转而投身奥匈帝国议会，为争取斯洛伐克人的权利而奔走。\n\n机会稍纵即逝，但我们终究牢牢将其握在手中。1936年，德国股市危机重创匈牙利，我们借此良机宣告独立，并受到奥地利帝国的庇护。曾经嚣张的马扎尔人，如今只能在奥地利的压制下愤懑不已。我们自由了，而这自由，我们必须誓死捍卫，为我们亲爱的祖国献上一切。§R南斯洛伐克的同胞仍处于水生火热之中，时刻不要忘记了民族屈辱！§!"
 SVK_czechophile:0 "亲捷情结"
 SVK_czechophile_desc:0 "1916年，随着米兰·斯蒂法尼克、爱德华·贝奈斯与托马斯·马萨里克共同组建捷克斯洛伐克国民委员会，“捷克斯洛伐克主义”逐渐成为国内的主流思潮。尽管大多数斯洛伐克民众对此反应淡漠，长期的异族统治早已磨平了他们的棱角与锐气，但斯洛伐克的政治精英却对此寄予厚望。正是在这样的背景下，捷克斯洛伐克军团应运而生。\n\n尽管军团在德国与奥地利的双重打压下辗转多地，甚至一度流亡至远东的俄罗斯远东共和国，而米兰·斯蒂法尼克也不幸在一次空难中落下残疾，但军团的奋斗与牺牲，却在斯洛伐克人民心中烙下深刻的印记。他们让沉默的民众看见，在这条充满荆棘的独立之路上，我们并非孤军奋战，还有来自捷克的兄弟，与我们并肩而立。"
 SVK_divided_slovakia:0 "貌合神离的祖国"
 SVK_divided_slovakia_desc:0 "布拉迪斯拉发的起义之所以成功，得益于社会各阶层与从左至右所有政治力量的空前团结。尽管这场胜利曾为我们带来一段短暂的“政治蜜月期”，但这份团结并未能持久。斯洛伐克独立后，左右翼之间尖锐的意识形态纷争便迅速撕裂了国内的政治图景。尽管这场斗争最终以斯洛伐克社会民主党及斯洛伐克民族农民党将斯洛伐克共产党、斯洛伐克民族党与赫林卡人民党一并驱逐出议会而告终，但其造成的裂痕却至今仍在隐隐作痛，持续分化着这个年轻的国家。而被驱逐的各政党也并未就此沉寂，它们始终在积蓄力量，伺机卷土重来。"
 SVK_economic_collapse:0 "燃烧的经济"
 SVK_economic_collapse_desc:0 "柏林股市危机为我们带来的，是一次充满死亡阵痛的独立。这场金融风暴瞬间席卷全球，年轻的斯洛伐克亦无法幸免。企业接连破产，农田的收成无人问津，工厂的机器彻底沉寂。尽管我们没收了匈牙利贵族在斯洛伐克的资产，但这对于国家的创痛而言，不过是杯水车薪。作为一个刚刚诞生的共和国，我们的经济根基无比脆弱，所面临的形势比以往任何时候都更为严峻。一场深刻而彻底的改革，已迫在眉睫。"
 SVK_slovak_armed_forces:0 "斯洛伐克国防军"
 SVK_slovak_armed_forces_desc:0 "斯洛伐克国防军主要由捷克斯洛伐克军团的老兵与布拉迪斯拉发的起义军为骨干组建而成。这些士兵大多历经第一次世界大战的洗礼，不仅作战经验丰富、意志坚定，还能在保卫国家之余，承担起训练新兵的职责。我们的将领也多毕业于各国军事名校，其战术素养在中欧地区已接近一流水平。然而，这支军队也面临着明显的短板：规模有限，装备水平较之中欧邻国差距显著，将领们亦缺乏大规模实战的检验。因此，进一步的训练与深刻的改革，仍是这支年轻军队的当务之急。"
 SVK_national_arsenal:0 "国家兵工厂"
 SVK_national_arsenal_desc:0 "作为斯洛伐克唯一完全自主的兵工厂，国家兵工厂的重要性不言而喻。尽管其产量远不及斯柯达，规模甚至不足其斯洛伐克分公司的一半，并且最初是从匈牙利方面收缴而来，但它依然是斯洛伐克民族意志的象征，是我们当之无愧的骄傲。我们坚信，终有一日，这座兵工厂将如斯柯达一般，成长为捍卫国家主权的坚实利器，成为斯洛伐克自由事业不可或缺的钢铁后盾。"
 povazska_strojaren:0 "国家兵工厂"
 SVK_economic_collapse_1:0 "经济有所好转"
 SVK_economic_collapse_1_desc:0 "柏林股市危机为我们带来的，是一次充满死亡阵痛的独立。这场金融风暴瞬间席卷全球，年轻的斯洛伐克亦无法幸免。企业接连破产，农田的收成无人问津，工厂的机器彻底沉寂。尽管我们没收了匈牙利贵族在斯洛伐克的资产，但这对于国家的创痛而言，不过是杯水车薪。作为一个刚刚诞生的共和国，我们的经济根基无比脆弱，所面临的形势比以往任何时候都更为严峻。一场深刻而彻底的改革，已迫在眉睫。"
 SVK_economic_collapse_2:0 "经济恢复"
 SVK_economic_collapse_2_desc:0 "经过一系列果断的改革与补救，斯洛伐克的经济终于从一团乱麻步入了井然有序的轨道。在专项基金的扶持下，一度倒闭的企业重焕生机，长久沉寂的生产线再度轰鸣。琳琅满目的商品如泉水般涌流，迅速填补了市场的空白；农民的粮食不再无处可去，而是通过农业合作社统一走向千家万户。人民终于告别了饥饿的阴影。如今，崭新的工厂如雨后春笋般拔地而起，各类企业遍地开花。一个充满活力与希望的斯洛伐克，正稳步迎来属于自己的黄金时代。"
 SVK_economic_collapse_3:0 "黄金时代"
 SVK_economic_collapse_3_desc:0 "经过一系列果断的改革与补救，斯洛伐克的经济终于从一团乱麻步入了井然有序的轨道。在专项基金的扶持下，一度倒闭的企业重焕生机，长久沉寂的生产线再度轰鸣。琳琅满目的商品如泉水般涌流，迅速填补了市场的空白；农民的粮食不再无处可去，而是通过农业合作社统一走向千家万户。人民终于告别了饥饿的阴影。如今，崭新的工厂如雨后春笋般拔地而起，各类企业遍地开花。一个充满活力与希望的斯洛伐克，正稳步迎来属于自己的黄金时代。"
