 SVK_Mobilize_Slovakia:0 "动员斯洛伐克"
 SVK_Mobilize_Slovakia_desc:0 "数个世纪以来，马扎尔人一直骑在斯洛伐克人的头上作威作福，用铁蹄践踏我们的土地，用枷锁束缚我们的灵魂。我们忍受了太久的压迫，经历了太深的苦难，直到如今，我们才终于挣脱匈牙利的桎梏，迎来了来之不易的自主。然而，这自由尚不完整，我们仍有无数同胞被困在匈牙利的牢笼之中，在异族的统治下继续忍受屈辱。他们渴望着故土的呼唤，期盼着民族的解放。终有一天，我们要让所有斯洛伐克儿女重归自由的家园；终有一天，我们要让压迫者付出代价；终有一天，我们要让完整的、真正的独立之旗，在这片饱经磨难的土地上永远飘扬！"
 SVK_Slovak_National_Uprising:0 "斯洛伐克大起义"
 SVK_Rebuilding_Great_Moravia:0 "重建大摩拉维亚"
