 SVK_National_Revitalization_Plan:0 "国家振兴计划"
 SVK_National_Revitalization_Plan_desc:0 "很不幸的是，尽管我们竭尽全力应对，经济危机依然蔓延至斯洛伐克。此刻绝非气馁之时，我们必须迅速行动，全力以赴提振国民经济，遏制危机进一步深化，避免其演变为更为严重的系统性衰退。"
 SVK_Nationalization_of_bankrupt_enterprises:0 "破产企业国有化"
 SVK_Nationalization_of_bankrupt_enterprises_desc:0 "经济危机已导致大量企业陷入破产困境，我们不能对此坐视不管。为此，政府决定启动企业国有化措施，以合理价格收购濒临破产的企业资产。这不仅能为原所有者提供急需的资金以助其渡过难关，也使国家能够有效整合并利用这些资源，更好地应对危机、稳定就业与经济基本面。"
 SVK_Subsidize_enterprises:0 "补贴中小企业"
 SVK_Subsidize_enterprises_desc:0 "中小企业作为经济的重要组成部分，在此次危机中承受了尤为沉重的打击，大量倒闭的企业正是这一群体。当前的首要任务之一，是向那些徘徊在破产边缘的中小企业提供定向补贴与支持，帮助它们维持运营、保障就业，稳住经济的毛细血管。"
 SVK_The_role_of_the_state:0 "发挥国家的作用"
 SVK_The_role_of_the_state_desc:0 "一个真正负责任的政府，绝不是奉行“无为而治”的小政府，而应是积极作为、全面担当的大政府。若政府选择置身事外，那其存在的意义何在？我们的企业家也应清醒认识到，若无政府作为坚强后盾，他们在激烈的国际竞争中将难以抵御外国巨头企业的冲击，本土产业恐将面临存亡危机。"
 SVK_Macroeconomic_regulation:0 "宏观调控"
 SVK_Macroeconomic_regulation_desc:0 "这场经济危机给我们上了深刻的一课：自由市场并不具备完美的自我调节能力。在危机状态下，完全放任的自由市场反而可能加剧混乱，引发更深的崩溃。因此，国家必须出手，实施必要的调控与监管，引导市场重回正轨，确保其健康、稳定发展。"
 SVK_Reemployment_of_the_unemployed:0 "失业者再就业"
 SVK_Reemployment_of_the_unemployed_desc:0 "失业群体是经济危机中一个棘手而重要的议题。我们既不能对他们置之不理，也不应过度援助以致滋生依赖文化。为此，政府将推行“以工代赈”计划，组织失业者参与公共工程建设。这既能为他们提供收入来源，维护社会尊严，也能降低纯福利支出，将节约的资金用于其他关键领域。"
 SVK_Develop_Slovakian_resources:0 "开发斯洛伐资源"
 SVK_Develop_Slovakian_resources_desc:0 "斯洛伐克蕴藏的潜力远超世人想象。我们的国土之下，埋藏着众多尚未开发的自然资源；我们的发展道路上，还有无数机遇等待发掘。国家将投入力量，对国土资源进行系统性、深层次的勘探与评估，为未来的经济增长奠定坚实的资源基础。"
 SVK_Support_farmers:0 "扶持农民"
 SVK_Support_farmers_desc:0 "农民始终是斯洛伐克的基石，是我们社会中最为重要的群体之一，我们绝不能在他们遇到困难时转身离去。面对经济危机中出现的农产品滞销、粮仓爆满的困境，政府决定以危机前的市场价格统一收购农民的粮食，解除他们的后顾之忧，确保他们能够安心从事农业生产，保障国家粮食安全。"
 SVK_Promote_mechanization:0 "农业机械化"
 SVK_Promote_mechanization_desc:0 "生产效率是农业现代化的关键。再锋利的传统镰刀，其效率也无法与现代拖拉机相提并论。我们将从国外引进先进拖拉机进行技术研究与消化吸收，随后在国内开展大规模仿制与生产，目标是让每一位斯洛伐克农民都能用上价格实惠、质量可靠、经久耐用的国产拖拉机，实现农业生产的跨越式升级。"
 SVK_National_backing:0 "国家后盾"
 SVK_National_backing_desc:0 "广大农民兄弟必须坚信，国家永远是他们最坚实的后盾。在需要之时，农民应当积极申请政府的各项援助计划。我们斯洛伐克政府承诺，始终做农民最强大的靠山，一千年也不会改变。"
 SVK_National_Ordnance_Factory:0 "国家兵工厂，我们的骄傲！"
 SVK_National_Ordnance_Factory_desc:0 "国家兵工厂是斯洛伐克境内唯一完全自主、规模庞大的国有工厂，它是我们民族的骄傲。早在脱离匈牙利统治之前，这座工厂的灵魂便已属于斯洛伐克人民，尽管当时名义上归匈牙利所有，但工厂内的匈牙利人已逐渐被我们的同胞所取代。在争取民族独立的斗争中，它曾为我们的抵抗战士生产武器，立下了不朽功勋。"
 SVK_Scale_expansion:0 "兵工厂规模扩张"
 SVK_Scale_expansion_desc:0 "为了捍卫来之不易的国家自由与独立，我们必须扩大国家兵工厂的规模，提升其技术水平和生产能力，使其逐步取代外国工厂在国防供应中的地位。这是加强国家主权、保障国防安全的必由之路。"
 SVK_Military_industrial_complex:0 "军工复合体"
 SVK_Military_industrial_complex_desc:0 "军工复合体作为一种发展模式具有其优势，但这些实体必须置于国家的绝对领导之下。政府在其中的持股必须占据主导地位，确保其发展方向和经营活动完全听从国家指挥。任何想要从国家获得订单和支持的企业，都必须明确接受这一前提：服从国家利益，听从政府指挥。"
 SVK_Support_the_aviation_industry:0 "支持航空工业"
 SVK_Support_the_aviation_industry_desc:0 "制空权在现代国防中至关重要。斯洛伐克必须建立自己完善的空军工业体系，能够自主研发和生产飞机，用以保卫祖国的蓝天。否则，在未来潜在的冲突中，我们将面临被敌方空军彻底摧毁的风险。"
 SVK_The_Dream_of_Industry:0 "工业之梦"
 SVK_The_Dream_of_Industry_desc:0 "斯洛伐克怀揣着一个工业化的梦想，而今，这一梦想正逐步照进现实。无数工厂在这片热土上拔地而起，生根发芽。我们正坚定地沿着工业化道路迈进，从一个以农业为主的国家，转型为一个具有现代工业体系的国家，这是斯洛伐克复兴的伟大征程。"
 SVK_1936_General_Election:0 "1936年大选"
 SVK_1936_General_Election_desc:0 "1936年的大选在万众瞩目中如期举行，这是斯洛伐克宣告独立后的首次民主盛事。尽管选举过程中出现了一些令人不快的插曲，但整个进程终究有惊无险地完成了。让我们为我们伟大而臻于完美的民主制度纵情欢呼！这场选举不仅彰显了新生国家的政治成熟，更昭示着斯洛伐克人民主宰自己命运的坚定决心。"
 SVK_President_Derer:0 "德雷尔总统"
 SVK_President_Derer_desc:0 "正如各界预期，斯洛伐克社会民主党在选举中再度赢得人民的信任。在庄严的国会大厅里，德雷尔总统手按宪法，宣誓就任斯洛伐克总统。这一幕不仅是个人的荣耀时刻，更印证了社会民主党在斯洛伐克政坛不可撼动的地位。该党自独立运动以来就与国家和人民同呼吸、共命运，这份深厚的情谊已然化作选票箱里最坚实的支持。"
 SVK_Fulfill_the_reform_promises:0 "履行改革承诺"
 SVK_Fulfill_the_reform_promises_desc:0 "我们将坚定不移地履行在选举前向人民庄严承诺的改革计划。我们不屑于效仿那些外国政客惯用的华丽辞令与空头支票，因为我们深信：唯有脚踏实地为民造福，才能真正赢得人民的衷心拥戴与永恒尊重。"
 SVK_Protect_Slovak_businesses:0 "保护斯洛伐克企业"
 SVK_Protect_Slovak_businesses_desc:0 "要实现民族经济的伟大复兴，当务之急并非盲目引进外资企业，而是应当倾力呵护我们本土的爱国企业。这些民族企业承载着斯洛伐克的经济命脉，必须为它们筑起坚实的防护墙，使其免遭外国资本的无情冲击。今日播下的种子，必将在明日长成参天大树 - 这些民族企业终将成为国家发展最可靠的后盾。"
 SVK_Restrict_labor_movement:0 "约束劳工运动"
 SVK_Restrict_labor_movement_desc:0 "尽管我们的国家诞生于波澜壮阔的工人运动，但如今此起彼伏的工潮确实令人困扰。工人们为薪资待遇抗议，为工作环境示威，甚至为政府施政得失走上街头。这种无休止的抗议活动必须得到适当规范。我们理解工人的合理诉求，但社会秩序与稳定同样至关重要，需要在保障工人权益与维护社会安宁之间寻求平衡。"
 SVK_Mobilize_workers:0 "动员工人"
 SVK_Mobilize_workers_desc:0 "在这个危机四伏的时代，我们必须将工人群众充分动员起来。斯洛伐克诞生于内忧外患之中，至今仍被重重危机所包围。为了守护这个年轻的国家，工人们应当武装起来，做好随时保卫家园的准备。让战斗的劳动者高歌猛进！他们不仅是经济建设的主力军，更将是国家安全最坚实的屏障。"
 SVK_Regional_economy:0 "地区经济"
 SVK_Regional_economy_desc:0 "盲目与国际市场接轨绝非明智之举。那些远在天边的跨国巨头不会因我们敞开国门而心存感激。相较之下，与我们同文同种的捷克企业显得尤为亲切可靠。与兄弟般的企业携手合作，既能促进区域经济融合，又能避免受制于遥远的国际资本，这才是符合斯洛伐克利益的选择。"
 SVK_Construction_of_public_works:0 "建设公共工程"
 SVK_Construction_of_public_works_desc:0 "作为政府宏伟蓝图的重要组成部分，遍布全国的公共工程计划正在稳步推进。这项雄心勃勃的计划旨在让每个斯洛伐克人都能感受到政府的温暖关怀。我们将用平整的柏油马路取代泥泞不堪的乡间土路，这些道路不仅是连接城乡的血脉，更是通往美好生活的康庄大道。"
 SVK_Arbitrating_labor_disputes:0 "仲裁劳资矛盾"
 SVK_Arbitrating_labor_disputes_desc:0 "劳资之间的矛盾冲突由来已久，这很大程度上源于政府过往的消极放任。如今我们正在采取积极措施调解劳资关系，通过建立常态化的协商机制，促进劳动者与资本家达成谅解。这种开创性的做法必将推动社会向着更加稳定、和谐的方向发展，让各阶层都能共享国家进步的成果。"
 SVK_Social_welfare_program:0 "社会福利计划"
 SVK_Social_welfare_program_desc:0 "当被问及社会民主党的首要使命时，有人说是发展经济，有人主张拓展外贸，但这些都不是最核心的答案。我们最根本的追求是建立覆盖全体国民的社会福利体系。从摇篮到坟墓，每个斯洛伐克人都应享有完善的社会保障，这才是社会民主党人最崇高的理想。"
 SVK_National_Railway:0 "国家铁路"
 SVK_National_Railway_desc:0 "我们梦寐以求的全国铁路网正在逐步成为现实。虽然斯洛伐克幅员不大，但铁路系统对国家发展至关重要。它不仅是民众出行的主要交通工具，更是连接各地区的经济动脉。密集的铁路网络将打破地域隔阂，促进资源流通，为偏远地区带去发展的机遇。"
 SVK_Cooperation_replaces_struggle:0 "以合作取代斗争"
 SVK_Cooperation_replaces_struggle_desc:0 "与一味强调斗争的共产党人不同，我们坚信合作优于对抗。如果劳动者与资产阶级能够化解分歧，在民族主义的旗帜下团结一致，这样的国家才称得上完美。斯洛伐克应当成为各阶层和谐共处的典范，让合作共赢的理念深入人心。"
 SVK_Nationalization_of_Hungarian_enterprises:0 "匈牙利企业国有化"
 SVK_Nationalization_of_Hungarian_enterprises_desc:0 "面对匈牙利人通过经济手段继续操控我国经济的企图，我们将采取坚决果断的反制措施。所有隶属于匈牙利资本的企业都将被依法征收，这是维护国家经济主权的必要之举。有奥地利帝国作为后盾，布达佩斯的抗议注定只能是虚张声势。"
 SVK_Protect_impoverished_people:0 "保障贫困人群"
 SVK_Protect_impoverished_people_desc:0 "我国仍有大量人口生活在贫困线以下，这种状况必须改变。消除贫困已成为政府当前最紧迫的任务之一，我们正在打响一场针对贫困的全面战争。通过就业扶持、技能培训和社会保障等多管齐下，誓要让贫困在斯洛伐克的土地上彻底消失。"
 SVK_Encourage_consumption:0 "鼓励消费"
 SVK_Encourage_consumption_desc:0 "为了激活国内经济循环，鼓励民众消费势在必行。我们将通过研发新颖实用的商品，配合适当的价格调控，激发民众的消费热情。让储蓄在银行里的死钱流动起来，转化为推动经济发展的活水，形成良性循环的经济生态。"
 SVK_Boost_business_vitality:0 "提振企业活力"
 SVK_Boost_business_vitality_desc:0 "企业的活力就是国家经济的生命力。政府将通过资金注入和政策扶持双轮驱动，帮助企业焕发创新活力。期待这些企业在政府引导下，生产出更多符合人民需求的优质商品，共同构建一个繁荣兴旺的斯洛伐克。"
 SVK_Regulate_capitalists:0 "管制资本家"
 SVK_Regulate_capitalists_desc:0 "资本若无约束，必将异化成贪婪的剥削机器。为此，我们正在制定一系列保护劳动者权益的法律法规，对资本家行为进行严格规范。这些立法将确保劳动者获得公平待遇，让经济发展成果惠及每一个辛勤工作的斯洛伐克人。"
 SVK_Land_Without_Hunger:0 "斯洛伐克，无饥荒之国"
 SVK_Land_Without_Hunger_desc:0 "经过一系列深彻改革，斯洛伐克这艘航船终于驶入了平稳发展的航道。纵横交错的铁路网络将商品输送到全国各地，困扰多年的饥荒和贫困问题正在得到根本解决。放眼未来，我们满怀信心地宣告：斯洛伐克的明天，牢牢掌握在我们自己手中！这个年轻的国度正在书写属于自己的辉煌篇章，每一个斯洛伐克人都是这段历史的见证者和创造者。"
 SVK_Rational_society:0 "理性社会"
 SVK_Rational_society_desc:0 "斯洛伐克需要理性的光芒，我们的人民需要理性的指引，我们的社会需要理性的基石。若纵容暴力成为表达诉求的常态，我们的国家将永远沉沦于政治极端主义的黑暗深渊。我们必须清醒地认识到，以暴制暴只会滋生更多的暴力，唯有理性对话与和平协商，才能引领我们走向光明未来。"
 SVK_Slovak_Cultural_Association:0 "斯洛伐克文化协会"
 SVK_Slovak_Cultural_Association_desc:0 "弘扬斯洛伐克文化是我们捍卫民族自由的神圣使命。数个世纪以来，匈牙利人在斯洛伐克地区推行的马扎尔化政策企图抹杀我们的民族特性，但我们坚韧不屈的民族精神终究抵御了这场文化侵蚀。如今，我们要以更加昂扬的姿态，让斯洛伐克文化在世界的舞台上绽放独特光彩。"
 SVK_resurgence_of_nationalism:0 "民族主义的复兴"
 SVK_resurgence_of_nationalism_desc:0 "斯洛伐克的民族主义沉寂得太久了，要么是被教会束缚的天主教民族主义，要么是日渐偏激的极端民族主义。而今，我们正开创一条崭新的道路：一条既保持民族尊严又包容开放的温和民族主义之路。这条道路将引领我们找回民族自信，同时以宽广胸怀拥抱世界文明。"
 SVK_Stay_away_from_internationalism:0 "远离国际"
 SVK_Stay_away_from_internationalism_desc:0 "我们拒绝那些虚无缥缈的崇高国际主义，更要坚决抵制奥地利社会民主工党鼓吹的多瑙河国际。斯洛伐克的民族主义必将迎来伟大复兴，我们要建立的是扎根于本土、服务于人民的民族主义，而不是盲目追随外来意识形态的奴仆。"
 SVK_Education_Reform:0 "教育改革"
 SVK_Education_Reform_desc:0 "几个世纪以来，教育始终是社会精英的特权领地。如今，时代已经改变！社会民主党始终秉持平等理念，在教育领域更是如此。我们将推行全面的义务教育改革，让知识的阳光普照社会的每一个角落，每一个阶层的子女都享有平等的受教育权利。"
 SVK_Our_social_democracy:0 "我们的社会民主"
 SVK_Our_social_democracy_desc:0 "我们的社会民主主义具有独特的民族品格，它不是奥地利社会民主的翻版，也不是德意志社会民主的仿制品。这是扎根于斯洛伐克土壤、汲取民族智慧养分的社会民主主义，是真正属于我们这片土地和人民的社会主义道路。"
 SVK_Defend_freedom:0 "捍卫自由"
 SVK_Defend_freedom_desc:0 "要捍卫来之不易的自由，我们必须建立强大的国防力量，培养爱国尽责的公民，构建独立自主的文化与思想体系，同时坚定不移地保障绝对的宗教信仰自由。这些要素如同支撑国家大厦的四根支柱，缺一不可。"
 SVK_Antitrust_Economics:0 "反垄断经济"
 SVK_Antitrust_Economics_desc:0 "卡特尔这头无节制的资本怪兽必须被驯服。美国的教训历历在目：当国家被大型垄断集团操控，政府就不再是人民的公仆，而沦为资本牟利的工具。我们要采取坚决措施打破垄断，还市场以公平，还人民以正义。"
 SVK_Empower_workers:0 "赋权工人"
 SVK_Empower_workers_desc:0 "单纯的罢工抗议无法从根本上改变国家命运。工人阶级必须积极参与政治进程，在议会殿堂发声远比街头呐喊更具建设性。我们全力支持并积极推动工人阶级参政议政，让劳动者的声音直接响彻国家决策的核心地带。"
 SVK_The_Dream_of_Czechoslovakia:0 "捷克斯洛伐克之梦"
 SVK_The_Dream_of_Czechoslovakia_desc:0 "捷克斯洛伐克的统一始终是我们矢志不渝的梦想。捷克人与斯洛伐克人血脉相连、文化相通，为何要分隔为两个独立国度？我们将继承米兰·斯蒂凡尼克的未竟事业，实现捷克斯洛伐克的完全统一与彻底自由，将捷克同胞从奥地利帝国的桎梏中解放出来。"
 SVK_Towards_Prosperity_and_Freedom:0 "迈向繁荣与自由"
 SVK_Towards_Prosperity_and_Freedom_desc:0 "今日的斯洛伐克正迈向前所未有的繁荣盛世：经济发展步入快车道，政治生活充满活力，民族文化蓬勃复兴。这是一个属于全体斯洛伐克人的黄金时代，我们正亲手创造着民族历史上最辉煌的篇章。让我们携手并肩，共同迎接这个伟大时代的到来！"
 SVK_President_Srobar:0 "什罗巴尔总统"
 SVK_President_Srobar_desc:0 "1936年的大选最终以斯洛伐克民族农民党的胜利落下帷幕。这个脱胎于捷克斯洛伐克农民人民党的新兴政治力量，终于在斯洛伐克这片土地上扎下了坚实的根基。瓦夫罗·什罗巴尔在庄严的宣誓后，肩负起总统的重任，标志着斯洛伐克农民阶层真正登上了国家政治的舞台中心。这不仅是一次选举的胜利，更是一场深刻的社会变革的开端。"
 SVK_Protector_of_Farmers:0 "农民的庇护者"
 SVK_Protector_of_Farmers_desc:0 "斯洛伐克民族农民党始终以斯洛伐克农民的守护者自居，执政后更是坚定不移地贯彻其亲农民的民族主义路线。在党的庇护下，农民将不再是任人宰割的弱势群体，而是国家建设的脊梁。我们要让每一寸土地都焕发生机，让每一个农民家庭都沐浴在希望的阳光下。农民不再是沉默的大多数，而是国家命运的塑造者。"
 SVK_Powerful_farmers:0 "强大的农民"
 SVK_Powerful_farmers_desc:0 "某些自诩进步的理论家竟公然诋毁农民是反动、落后的象征，这不仅是数典忘祖的背叛，试问谁的祖先不是从田间地头走出来的？更是对农民贡献的亵渎。农民手中握着的不只是锄头，更是国家的命脉。他们的力量远超那些坐在书斋里的理论家的想象，这股力量正在觉醒，必将震撼整个社会。"
 SVK_Agricultural_Union:0 "农业工会"
 SVK_Agricultural_Union_desc:0 "既然工人阶级有工会作为后盾，为什么农民就不能拥有自己的组织？农民绝不能继续做沉默待宰的羔羊！我们必须团结起来，让农民的声音响彻云霄。每一个村庄都应当建立农民工会，每一片田野都应当成为争取权益的阵地。只有组织起来，我们才能真正掌握自己的命运。"
 SVK_Encourage_agricultural_cooperatives:0 "鼓励农业合作社"
 SVK_Encourage_agricultural_cooperatives_desc:0 "农业合作社制度是我们民族农民党一贯倡导的富民之道。单个农民面对市场的风浪往往力不从心，但当我们挽起手臂，就能筑起抵御风险的坚固堤坝。通过合作社统一销售农产品，共同分担风险，我们要让农民第一次真正成为市场的主人，而不是任人摆布的棋子。"
 SVK_Utilize_land:0 "利用土地"
 SVK_Utilize_land_desc:0 "放眼望去，我们脚下这片沃土的开发程度还不足一半！大片大片的荒地仍在沉睡，这是对国家资源的巨大浪费。我们将通过政策性补贴，激励农民开垦这些处女地，让荒原变粮仓，让瘠土变良田。这不仅是在开拓土地，更是在开拓斯洛伐克的美好未来。"
 SVK_Agricultural_Office:0 "设立农业办公室"
 SVK_Agricultural_Office_desc:0 "为了更好地服务广大农民，农业办公室应运而生。每个乡村都要设立这样的机构，聘请精通农业的专业人才，为农民排忧解难。这不是又一个官僚机构，而是农民身边的贴心人，是连接政府与田野的桥梁。"
 SVK_Explore_Slovakias_potential:0 "发掘斯洛伐克潜力"
 SVK_Explore_Slovakias_potential_desc:0 "斯洛伐克大地的潜力远未被充分发掘。那些闲置的土地可以兴建工厂，落后的乡村可以焕发新生成为现代化城镇。我们绝不能以任何借口容忍懒惰和不作为。变革的号角已经吹响，我们要让每一寸土地都发挥其最大价值。"
 SVK_Challenge_the_big_landlord:0 "挑战大地主"
 SVK_Challenge_the_big_landlord_desc:0 "地主骑在农民头上作威作福的时代该终结了！民族农民党誓要彻底解决这个困扰斯洛伐克已久的社会毒瘤。主动交出土地的地主尚可得到宽恕，若有人胆敢负隅顽抗，等待他们的将是雷霆手段。农民的土地，终究要回到农民手中！"
 SVK_Protect_the_interests_of_farmers:0 "保卫农民利益"
 SVK_Protect_the_interests_of_farmers_desc:0 "绝不允许任何人以低价强买强卖农民的劳动成果！谁要是敢把黑手伸向农民的钱袋，我们就敢毫不留情地将其斩断。农民的血汗必须得到应有的回报，这是不可逾越的底线。"
 SVK_Better_than_the_Czech:0 "比捷克更好"
 SVK_Better_than_the_Czech_desc:0 "有人鼓吹捷克的制度优越？快醒醒吧！那些逆向民族主义者永远只会对我们吹毛求疵。捷克算什么农民的国家？我们斯洛伐克才是真正的农民国度！我们对农民的尊重与关怀，已经远远超越了捷克的虚伪做派。"
 SVK_Launch_land_reform:0 "启动土地改革"
 SVK_Launch_land_reform_desc:0 "从地主手中收回的土地将发挥巨大作用。我们要将这些土地公平地分配给无地或少地的农民，让耕者有其田的梦想成为现实。同时必须严禁土地买卖，从根源上杜绝地主阶级的死灰复燃。这将彻底改变斯洛伐克的土地所有制结构。"
 SVK_Agricultural_Insurance:0 "农业保险"
 SVK_Agricultural_Insurance_desc:0 "为防范自然灾害等风险，我们将建立农业保险体系。农民只需缴纳少量保费，在遭遇灾害导致歉收时就能获得补偿，确保来年生产的顺利进行。这不仅是经济保障，更是给农民吃下的定心丸。"
 SVK_Price_control:0 "价格管控"
 SVK_Price_control_desc:0 "粮食价格必须保持合理区间。粮价过高会损害消费者利益，最终反噬农民；粮价过低又会让农民血本无归。我们要建立科学的价格调控机制，既要让农民劳有所得，又要维护市场稳定。"
 SVK_Rural_infrastructure:0 "条条大路通乡村"
 SVK_Rural_infrastructure_desc:0 "我们将大兴土木，修建四通八达的公路网，让条条大路直通乡村。农民兄弟再也不用在泥泞的土路上艰难前行。这一切建设都由政府出资，我们要让现代化的交通网络惠及每一个村庄。"
 SVK_Protect_individual_enterprises:0 "保护个体企业"
 SVK_Protect_individual_enterprises_desc:0 "个体农户在危机面前往往不堪一击，我们要建立完善的保障体系，帮助他们在风雨中站稳脚跟。通过信贷支持、技术指导和市场对接，让个体经营不再是孤军奋战。"
 SVK_Towards_Country_of_Farmers:0 "迈向农民之国"
 SVK_Towards_Country_of_Farmers_desc:0 "斯洛伐克过去是农民的乐土，现在我们要把它建设成举世瞩目的农民天堂。在这里，农民将享有尊严、富裕和幸福。让外国的农民都向我们投来羡慕的目光吧！这不仅是我们的理想，更是我们必将实现的誓言！"
 SVK_A_farmer_with_ideals:0 "一个有理想的农民"
 SVK_A_farmer_with_ideals_desc:0 "我们应当甘愿一生困守在田地里，只顾埋头耕种吗？不，绝不！那绝非胸怀大志者应有的视野。我们要做有理想、有担当的农民，不只满足于温饱，更要亲手塑造我们所期望的世界，让脚下的土地因我们的奋斗而改天换地，这才是我们真正渴望成就的事业！"
 SVK_Reject_the_red_temptation:0 "拒绝赤色诱惑"
 SVK_Reject_the_red_temptation_desc:0 "赤色分子何曾真正在意过我们农民的命运？他们眼中只有城市里那寥寥无几的工人，整日把马克思的著作奉若神明，固守在僵化的教条之中。我们绝不能受他们华丽辞藻的蛊惑，必须清醒地远离那些不切实际的承诺与煽动。"
 SVK_The_Beauty_of_Democracy:0 "民主之美"
 SVK_The_Beauty_of_Democracy_desc:0 "斯洛伐克的每一位公民都应当坚信：民主制度才是与我们民族气质最相契合的道路。它的优越远超我们浅显的认知，不仅能赋予人民选择的权力，更带来持久的自由与尊严，这一切，是那些抗拒民主、沉溺于左翼空想的势力永远无法理解的。"
 SVK_Stop_ethnic_violence:0 "扭转民族暴力"
 SVK_Stop_ethnic_violence_desc:0 "够了，亲爱的斯洛伐克同胞！我们自豪于自己的民族身份，但我们绝不是嗜血的暴徒。匈牙利人曾施加于我们的伤害，不应成为我们报复的借口。如今留在我们土地上的匈牙利人，已成为斯洛伐克共同体的一部分。向前看吧，别让历史的伤口继续撕裂民族的未来。"
 SVK_Peasant_participation_in_politics:0 "鼓励农民参政"
 SVK_Peasant_participation_in_politics_desc:0 "农民必须走向政治舞台的中心，亲手掌握国家的命运！我们要大力推动农民参政议政，让他们为自己发声、为自己争取权益。即便未来选举遭遇挫折，我们也绝不容许任何新上台的势力，轻易推翻我们为农民争取的福祉与保障。"
 SVK_A_gentle_and_humble_nation:0 "温和而谦逊的民族"
 SVK_A_gentle_and_humble_nation_desc:0 "斯洛伐克人生性温和、胸怀谦逊。让我们彻底远离无谓的民族仇杀与暴力循环。和平才是未来的主旋律，纷争与杀戮只会让我们的同胞白白流血，让整个民族付出惨痛代价。"
 SVK_Improve_the_parliament:0 "完善议会制度"
 SVK_Improve_the_parliament_desc:0 "我们斯洛伐克，刚刚挣脱匈牙利的束缚，成为一个崭新的国家。我们的议会制度尚不完美，仍处于摸索与成长的阶段。但我们有信心，也有毅力，一步步将它打磨成最适合我们国情、最能代表民意的政治架构。"
 SVK_Separate_Church:0 "分离教会"
 SVK_Separate_Church_desc:0 "教会必须彻底退出政治的领域！斯洛伐克人向往的是精神的自由与灵魂的解放。我们绝不能容忍任何势力，既想支配我们的信仰，又想操控我们的政治选择。政教分离，是我们绝不妥协的底线！"
 SVK_Harmonious_and_peaceful:0 "内部的和谐与安宁"
 SVK_Harmonious_and_peaceful_desc:0 "看看我们如今的国家吧，安宁而有序，街头不再有暴徒横行，那些狂热的极端民族主义者也渐渐沉寂。或许他们仍在暗处蠢蠢欲动，但早已失去撼动国家的力量。斯洛伐克的未来，掌握在理性与建设者手中。"
 SVK_The_foundation_of_nation:0 "巩固国家根基"
 SVK_The_foundation_of_nation_desc:0 "农民，是我们国家最坚实的根基，是斯洛伐克赖以生存的命脉。如果我们忽视农民的福祉，不全力改善他们的生活、不增强他们的保障，那无异于自毁长城、动摇国本！"
 SVK_Sickle_and_Pitchfork:0 "镰刀与草叉"
 SVK_Sickle_and_Pitchfork_desc:0 "农民兄弟们，是时候举起你们手中的镰刀与草叉了！不过，我们举起的不只是农具，更是捍卫权益的象征。我们要以此对抗一切内外压迫与不公！斯洛伐克是你们的，也理应由你们主宰；而这世界的明天，也终将烙印上你们奋斗的痕迹！"
 SVK_President_Razus:0 "拉祖斯总统"
 SVK_President_Razus_desc:0 "社会民主党那帮人竟敢妄想在我们斯洛伐克建立一党专制的独裁统治，简直是不自量力！幸而我们斯洛伐克民族党果断出手，重拳出击，在我们忠诚的兄弟赫林卡人民党的准军事武装鼎力相助下，一举推翻了社会党的痴心妄想。如今，斯洛伐克民族党的杰出领袖拉祖斯将挺身而出，肩负起斯洛伐克总统的重任，带领我们走向民族复兴的光明大道。"
 SVK_Correct_the_crash:0 "纠正崩溃"
 SVK_Correct_the_crash_desc:0 "这场该死的经济危机差点将我们彻底击垮，无数家庭在风雨中飘摇，整个国家几乎陷入瘫痪。血的教训告诉我们，必须对我们的经济体制进行一场脱胎换骨的大改革，绝不能重蹈覆辙。若是再来一次这样的危机，我们的国家恐怕就真的撑不住了。这场改革必须全方位、深层次，要从根本上增强我们经济的韧性与活力。"
 SVK_Restrict_enterprises:0 "束缚企业"
 SVK_Restrict_enterprises_desc:0 "必须给那些肆无忌惮的企业戴上枷锁！放任它们无节制地扩张，只会让我们美丽的祖国遭受工业污染的荼毒。我们绝不能让布拉迪斯拉发沦为第二个雾都伦敦。更可怕的是，这些企业的野蛮生长还会挤压其他企业的生存空间，破坏健康的商业生态。我们必须立即采取行动，为企业的扩张划定明确的红线。"
 SVK_Encourage_foreign_trade:0 "鼓励对外贸易"
 SVK_Encourage_foreign_trade_desc:0 "狭隘的地区经济早已不能满足我们发展的需要，我们必须将视野投向更广阔的天地。只有愚蠢的井底之蛙才会将自己的国家封闭起来。看看我们的邻国，奥地利帝国、德意志帝国，这些庞大的市场正等待着我们去开拓。闭关锁国只会让我们错失良机，开放进取才能赢得未来。"
 SVK_Walking_with_the_Church:0 "与教会同行"
 SVK_Walking_with_the_Church_desc:0 "斯洛伐克民族党是在天主教信仰和民族主义精神的共同孕育下诞生的，这是我们立党的根基。因此，我们必须与教会建立牢不可破的同盟关系。这不仅为我们的执政提供了神圣的法理依据，更能赢得广大信教群众的衷心拥护。信仰的力量将是我们执政路上最坚实的后盾。"
 SVK_Reject_the_cartel:0 "拒绝卡特尔"
 SVK_Reject_the_cartel_desc:0 "卡特尔这种垄断组织简直是罪大恶极！我们绝不希望看到一个企业垄断一切的局面。只有保持充分的市场竞争，才能促使企业不断进步，才能让老百姓用上物美价廉的产品。因此，我们必须以铁腕手段进行严格的反垄断，维护市场的公平正义。"
 SVK_Railway_to_the_outside:0 "通往外部的铁路"
 SVK_Railway_to_the_outside_desc:0 "我们必须加快建设通往外部世界的铁路网络。可恨的匈牙利人统治时期，在斯洛伐克的土地上几乎毫无建树，他们把从斯洛伐克人身上剥削来的财富全都用在了自己身上。如今，我们只能靠自己动手，修建通往繁荣的道路。这条铁路不仅是一条交通线，更是一条生命线，它将把斯洛伐克与欧洲紧密相连。"
 SVK_Industrial_expor:0 "产业出口"
 SVK_Industrial_expor_desc:0 "我们拥有大量优质商品亟待出口，新勘探出的矿产资源堆积如山，急需一个巨大的国际市场来消化。通过对外贸易赚取的外汇，可以反哺国内各行各业的发展。只要打通对外贸易的通道，经济繁荣就指日可待。这是我们实现经济腾飞的绝佳机遇。"
 SVK_Catholic_Workers_Guild:0 "天主教工人行会"
 SVK_Catholic_Workers_Guild_desc:0 "我们要建立一个天主教工人行会，让那些充满智慧且长期扎根基层的教士们来帮助解决工人的实际困难。在处理劳资矛盾等棘手问题时，这些深谙民情的教士们肯定比我们这些高高在上的官员更懂得如何化解。这种独特的制度将是我们的一大创举。"
 SVK_Contain_economic_instability:0 "遏制经济动荡"
 SVK_Contain_economic_instability_desc:0 "要想从根本上遏制经济动荡，就必须让国家这只"看得见的手"发挥关键作用。政府要对国内各行各业进行精准调控，一旦发现危机的苗头就立即采取行动，将其扼杀在萌芽状态。这正是政府应当履行的神圣职责，也是我们避免经济危机的最佳保障。"
 SVK_Encourage_citizen_employment:0 "鼓励公民就业"
 SVK_Encourage_citizen_employment_desc:0 "懒惰是可耻的，这是千百年来人类社会的共识。现在，我们要让那些因经济危机而失业的人们重新振作起来，立即投入到祖国建设的洪流中去。当前的斯洛伐克正值用人之际，各行各业都急需劳动力。让我们用勤劳的双手，共同建设美好的家园。"
 SVK_Restrict_free_competition:0 "限制自由竞争"
 SVK_Restrict_free_competition_desc:0 "企业之间的良性竞争固然是好事，但过度激烈的竞争很可能引发恶性后果。到时候，企业之间很可能演变成弱肉强食的黑帮火并。因此，我们必须为竞争划定合理的边界，引导企业进行有序竞争，营造健康的市场环境。"
 SVK_Citizens_Party:0 "公民之党"
 SVK_Citizens_Party_desc:0 "作为代表公民意志的政党，尽管我们自诩为精英政党，但也必须时刻倾听基层的声音。毕竟，我们是在民族主义和民主制度的旗帜下行事的。民意就是我们执政的基石，失去民心的政党注定无法长久。"
 SVK_Tame_the_mountains:0 "驯服山地"
 SVK_Tame_the_mountains_desc:0 "我们斯洛伐克人从来就不惧怕高山的阻挡。只要我们善用智慧与勇气，再高的山峰也能变成良田。如果山太高，我们就削平它；削下来的土石正好可以物尽其用。千万不要小看了斯洛伐克人民的智慧和毅力，我们向来善于化险为夷、变废为宝。"
 SVK_Economic_revival:0 "经济复兴"
 SVK_Economic_revival_desc:0 "经过我们一系列大刀阔斧的改革，斯洛伐克的经济体制终于完成了一场深刻的变革。虽然不能保证经济危机永远不会发生，但我们已建立起完善的预警和防范机制。即便危机真的来临，我们也能将损失降到最低。这是一项历史性的成就，为我们的经济发展奠定了坚实基础。"
 SVK_Expand_the_middle_class:0 "扩大中产阶级"
 SVK_Expand_the_middle_class_desc:0 "从无产阶级跃升到中产阶级，这是一个质的飞跃。判断一个国家是否发达，不能单看经济总量，更要看其中产阶级的规模。中产阶级才是一个国家真正的中流砥柱，是社会稳定的基石。因此，我们必须不遗余力地扩大中产阶级的队伍，这是实现国家长治久安的关键所在。"
 SVK_The_old_order_returns:0 "旧秩序回归"
 SVK_The_old_order_returns_desc:0 "旧欧洲的文明之光终于重新照耀在斯洛伐克的大地上。当下这个时代，我们的社会正遭受赤色分子和自由派的双重毒害。唯有依靠天主教的力量与传统美德，我们才能与这些恶魔般的思潮抗衡。让我们重拾信仰，守护我们珍贵的文化传统，在这片土地上重建文明的秩序。"
 SVK_Conservative_Gatekeeper:0 "保守主义守门人"
 SVK_Conservative_Gatekeeper_desc:0 "作为祖国思想阵线上坚定不移的守门人，我们必须以最坚决的态度、最彻底的手段筑起意识形态的钢铁长城，严防那些赤色幽灵与自由派毒素侵蚀斯洛伐克纯洁的精神家园。这些散发着腐朽气息的异端邪说必须被连根铲除，绝不容许有一丝一毫渗透进我们神圣的国境线。我们的子民正站在道德的十字路口，唯有以雷霆万钧之势肃清这些蛊惑人心的罪恶之源，才能守护他们免于堕入万劫不复的深渊。"
 SVK_Relationship_with_the_Holy_See:0 "与圣座的关系"
 SVK_Relationship_with_the_Holy_See_desc:0 "尽管我们已远离了中世纪经院哲学的辉煌年代，但与圣座保持血脉相连的神圣纽带仍是我们斯洛伐克民族党的天命所归。作为扎根于天主教传统的政治力量，若能获得当今圣父的亲自祝福，不仅将为我们披上神圣的合法性外衣，更能在万千信众心中点燃永不熄灭的信仰之火。这既是政治智慧的精妙运用，更是天主指引的必由之路。"
 SVK_Elite_politics:0 "精英政治"
 SVK_Elite_politics_desc:0 "政治这门至高无上的艺术，从来就是精英们运筹帷幄的神圣殿堂。那些在温饱线上挣扎的底层民众，岂能参透治国安邦的玄机？若放任短视的民粹浪潮淹没理性的政治决策，整个国家必将陷入各自为政的泥潭。唯有让经过严格淬炼的政治精英执掌权柄，才能超越狭隘的阶级利益，实现泽被苍生的宏伟蓝图。"
 SVK_Follow_the_guidance_of_the_Bible:0 "追随圣经指引"
 SVK_Follow_the_guidance_of_the_Bible_desc:0 "圣经这部凝聚着永恒智慧的圣书，实乃人类文明史上最璀璨的明珠。那些自诩进步的左翼思潮与自由派学说，不过是从这口永恒之井中窃取的零星活水。从平等博爱到公义怜悯，所有看似新颖的社会主张，早在千年前就已在圣经中绽放光芒。每一个追求真理的灵魂，都应当跪拜在这部神圣典籍面前汲取永恒的智慧。"
 SVK_Catholic_teacher:0 "天主教教师"
 SVK_Catholic_teacher_desc:0 "尽管圣经的字字珠玑闪耀着真理的光芒，但其深奥的微言大义确实需要引路人。我们何不聘请德高望重的神职人员走进学堂，在年轻的心田播撒信仰的种子？这既为虔诚的牧者开辟了神圣的职分，又让圣经的真谛如春雨般滋润整个民族。如此双赢的妙策，正是天主赐予我们的智慧结晶。"
 SVK_Religion_is_above_the_state:0 "宗教高于国家"
 SVK_Religion_is_above_the_state_desc:0 "当斯洛伐克的民族意识尚在历史长河中孕育时，基督的十字架早已在这片土地上空闪耀。这种超越时空的永恒特质，使圣教会成为比任何世俗政权都崇高的存在。即便某天国家大厦倾颓，只要保存好斯洛伐克教会的圣火，我们就能在灰烬中重生千万次。教会不仅是灵魂的避难所，更是民族复兴的不灭明灯。"
 SVK_Nationalism_and_democracy:0 "民族与民主主义"
 SVK_Nationalism_and_democracy_desc:0 "真正的民族主义从来与民主制度血脉相连，就像圣子与圣父本为一统。民主机制为我们民族主义者提供了传播理念的神圣讲坛，让我们得以用选票而非子弹来实现政治理想。这种文明的政治博弈，正是天主赐予现代基督徒的珍贵礼物，让我们既能坚守原则又不玷污双手，因此每一个民族主义者都必须捍卫民主制度。"
 SVK_The_Virtues_of_Catholicism:0 "天主教之美德"
 SVK_The_Virtues_of_Catholicism_desc:0 "当今社会世风日下、道德沦丧，其根本原因在于背离了天主教的美德训导。只要我们重新擎起圣经的火炬，让十诫的光辉照亮每个阴暗角落，必能重建一个充满虔诚、节制与仁爱的和平且自由的国度。这不仅仅只是政治纲领，更是我们向全体国民许下的神圣诺言。"
 SVK_Purify_the_soul:0 "净化万千污浊心灵"
 SVK_Purify_the_soul_desc:0 "如今年轻一代的灵魂正在被世俗的毒液侵蚀，他们叛逆的目光中燃烧着危险的火焰。必须以圣经的永恒真理锻造道德的锁链，用圣言的天籁抚慰他们躁动的心灵。这不是束缚，而是拯救；不是压制，而是引导迷途的羔羊回归牧人的怀抱，让他们回归到最纯洁的美德。"
 SVK_Take_it_a_step_further:0 "更进一步"
 SVK_Take_it_a_step_further_desc:0 "现在我们正站在天国门前的最后一级台阶，再向前迈出坚定的一步，就能沐浴在神圣秩序的荣光中。那些伪装成光明天使的恶魔，那些亵渎真理的伪基督，终将在圣言的利剑下现出原形。在此之前，我们要以苦修者的坚毅严格自律，做好迎接新时代的圣洁准备。"
 SVK_Piety_and_Civilization:0 "虔诚与文明之地"
 SVK_Piety_and_Civilization_desc:0 "今日的斯洛伐克已然建成令世人钦羡的信仰国度，全体国民在十字架下凝聚成坚不可摧的精神共同体，神圣教会与民族意志永乳交融。那些虎视眈眈的马扎尔入侵者，必将被我们紧握的天主之矛刺穿野心。为了斯洛伐克的永恒荣光，为了我等同胞的自由，前进！砸碎那些胆敢拦路之人！"
 SVK_military_expansion:0 "扩充斯洛伐克军备"
 SVK_military_expansion_desc:0 ""黑色星期一以来，斯洛伐克困难的经济导致军队一直得不到充足的资金。但当下经济形势的好转和旧大陆紧张局势的加剧让军事投资得以大幅增加，我们可以凭此最终实现部队的现代化，让我们的部队有可战之力。"
 SVK_military_tech:0 "军事技术委员会 "
 SVK_military_tech_desc:0 "我们不久前模仿奥匈帝国创立的斯洛伐克军事技术委员会，即军技委，是斯洛伐克国防部的一部分，负责军事技术的审查、开发与应用。委员会在斯洛伐克军队的现代化改造中占有十分重要的地位，除能保证斯洛伐克的军事技术发展不落于他国外，还能让我们的部队保有精良的装备。"
 SVK_rifle_trials:0 "步枪测试"
 SVK_rifle_trials_desc:0 "尽管军事技术委员会已经竭尽全力让斯洛伐克的军事装备在缺乏资源的情况不至于落后太多，但一直以来战争部都没有让我们的部队如同其他国家一样列装半自动步枪。为了纠正这个小小的问题，委员会开始了半自动步枪的招标项目，众多的军火公司也都渴望着这份合同。为了能选出最好的步枪，军技委组织起了一场新的步枪测试。"
 SVK_artillery_modernisation:0 "火炮现代化"
 SVK_artillery_modernisation_desc:0 "尽管像斯柯达和百禄这样的公司拥有来自国外的先进火炮生产合同，能够跟上世界的发展，但我们自己装备的大多数火炮都还是上次大战的老旧货。随着炮兵成为现代战争中最重要的角色之一，军事技术委员会迫切希望我们在扩充军备的同时用新型火炮淘汰掉我们在用的那些老破烂。"
 SVK_military_mountaineers:0 "扩编山地部队"
 SVK_military_mountaineers_desc:0 "山地部队不乏一些斯洛伐克最富盛名且最受尊敬的部队，他们曾多次击退马扎尔人的入侵。鉴于他们对斯洛伐克的防卫至关重要，且在普雷绍夫和喀尔巴阡地区存有大量潜在的新兵，扩编并改良这些部队就成为了当下的优先事项。"
 SVK_motorisation:0 "推广军用汽车"
 SVK_motorisation_desc:0 "尽管斯洛伐克一直有运用军用汽车的想法，但老实说，军队中的汽车数量一直不多。斯洛伐克军用汽车部是军事技术委员会的一部分，负责军用车辆的开发和部署。我们的总参谋部已经清楚认识了军用汽车在现代战争中的重要性，现在他们将会把军队摩托化作为最优先事项。"
 SVK_tank_trials:0 "坦克实验"
 SVK_tank_trials_desc:0 "对大多数人而言，上次大战的创伤还历历在目，坦克因其在大战期间的表现为奥匈军队迅速接受，我们希望在斯洛伐克的军队也用上坦克。像斯柯达和捷克摩拉维亚-科尔本-丹历这样的公司向我们提供了一些世界上最先进的坦克设计。而随着坦克开发的迅速推进，军技委希望能即刻举办一场测试来查看新坦克的性能"
 SVK_radar:0 "对空雷达"
 SVK_radar_desc:0 "我们国内的科学家的研究引起了军事技术委员会和航空兵团的注意，双方都渴望能将发明实际应用以提高斯洛伐克对空中威胁的防御能力。针对这个基于无线电的飞行器定位仪的实验证明了它可以有效的预警来自空中的威胁，斯洛伐克很快就会有可用的对空雷达了。"
 SVK_rockets:0 "火箭技术发展"
 SVK_rockets_desc:0 "斯洛伐克虽然没有像奥匈帝国那样拥有众多优秀的火箭科学家，如欧根·森格尔和西奥多·冯·卡门这些科学家。目前大多数人都对火箭及其军事方面的应用存在疑问，但军技委希望进一步发展火箭，他们相信火箭的潜力大到让人无法忽视。"
 SVK_reform_AOK:0 "改革军队最高参谋部"
 SVK_reform_AOK_desc:0 "军队最高参谋部于1936年斯洛伐克独立不久后创立。其职责是协调统合联合陆军、空军和地方警卫队的保卫国家。但黑色星期一爆发后不久军队最高参谋部因为没有资金支持就解散了，斯洛伐克陷入了一段混乱状态。重组军队最高参谋部对团结我们的部队至关重要。"
 SVK_doctrine_Jansa:0 "马赫的集中计划学说"
 SVK_doctrine_Jansa_desc:0 "亚历山大·马赫是军队最高参谋部的成员之一，他认为斯洛伐克需要通过防御战略来恢复在世界大战期间遭受的惨痛损失。他还认为周密的计划和准备工作是应对战争的最佳方式，并希望通过改善指挥官间的沟通以尽可能地减少伤亡。"
 SVK_doctrine_Hickmann:0 "昆德利克的优势火力学说"
 SVK_doctrine_Hickmann_desc:0 "亚历山大·昆德利克将军是总参谋部的一员，他认为军队应该着重于取得技术优势以对抗斯洛伐克的敌人。对公众和军方而言，世界大战仍然是一次惨痛的创伤，因此减少伤亡至关重要。昆德利克将军认为，改进火力支援与提高常规装备的性能是赢得现代战争的关键。"
 SVK_doctrine_von_Hubicki:0 "马拉尔的机动作战学说"
 SVK_doctrine_von_Hubicki_desc:0 "骑兵将军奥古斯都·马拉尔是现役的斯洛伐克骑兵指挥官，他相信未来战争的制胜法宝是坦克与卡车。机动性是战争的关键，而坦克则是战场上的新型轻骑兵和胸甲骑兵。这支新兴的骑兵队定能在敌人做出反应前挫败并压倒他们。"
 SVK_communications:0 "增强通讯能力"
 SVK_communications_desc:0 "自世界大战以来，无线电等通讯工具的发明让指挥官与部队之间的沟通变得十分容易。通过良好的信息交流，最高统帅部可以以更快的速度对不可预见的突发事件做出反应，削弱它的影响并进行反制，因此我们需要大力发展通讯技术。"
 SVK_better_support_equipment:0 "最大化火力支援"
 SVK_better_support_equipment_desc:0 "单位必须拥有适当的装备才能发挥充分的效用。他们得到的支援越多，表现自然就会更加优越，伤亡也随之减少。所谓的支援武器不仅包括火炮，还包括转移伤员的卡车、适当的侦察与维护单位等。"
 SVK_mech_cavalry:0 "机械化骑兵"
 SVK_mech_cavalry_desc:0 "虽然坦克性能强大，但它们仍然需要步兵的支援才能发挥作用，脱离步兵的坦克是异常脆弱的。步兵必须具备能够跟上坦克的速度，而卡车的公路运输性能很好，履带式运输车将是个不错的主意。幸运的是，一支部队已经将他们过时的坦克和火炮拖拉机改造成临时的装甲运兵车，他们完全可以弥补我们当前的空缺！"
 SVK_kavalleriepanzer:0 "骑兵坦克计划"
 SVK_kavalleriepanzer_desc:0 "顾名思义，旨在打造一种能够有效承担历史上骑兵所肩负的战术角色的装甲单位。正如骑兵在过去的战场上凭借其速度、机动与冲击力执行侦察、迂回与快速突击任务，今天的骑兵坦克也必须能够在高度动态的现代战场上，承担类似的机动作战职能。鉴于机动性是我们新兴作战理论的核心支柱，开发这样一种具备高战略与战术机动性、能够迅速投送至关键战区、并在接敌后实施高速突破与纵深打击的骑兵坦克，已成为当前装备研发工作中的重中之重。因此，我们必须优先调配资源，全力推进此类装甲平台的研制与列装工作。"
 SVK_infanteriepanzer:0 "步兵坦克计划"
 SVK_infanteriepanzer_desc:0 "虽然军队已经有了许多成功的骑兵坦克设计，但步兵坦克项目到目前为止还无法提供有效的进展。这样的情况必须得到弥补，因为步兵支援在我们的新学说中是被优先考虑的，这些项目应该被进一步推进。我们不介意新的样车更重、更贵，但是他的性能必须强大，防护能力也应更好。"
 SVK_auftragstaktik:0 "战术改良计划"
 SVK_auftragstaktik_desc:0 "任务型战术并非新近出现的产物，它们在世界大战中就已收效甚佳。该战术的特点包括：最高指挥部给出明确的任务目标，由麾下单位独立完成，这给予了后者极大的灵活性并激励他们最大程度地完成任务。任务型战术可以被调整以适用于现代战争的要求，并应用于新学说的研究。"
 SVK_aviation_effort:0 "国家航空兵团"
 SVK_aviation_effort_desc:0 "航空兵团是斯洛伐克的空中力量。在黑色星期一期间，它的规模还十分微小，可支配的飞机数量也相当有限，黑色星期一刚结束不久后匮乏的资金也让它得不到任何的补充。但现在军方有钱了，现代化并扩编航空兵团完全没问题。"
 SVK_uzelac-plan:0 "斯米克的战场支援计划"
 SVK_uzelac-plan_desc:0 "奥托·斯米克是空军部队的第一个指挥官，并在总参谋部和空军军官中保有重要的影响。他相信空军的存在作用主要就是为陆军开展行动提供支援。因此，空军必须专注发展战斗机来保证空优，以此让轻型轰炸机能够攻击前方的敌军阵地。"
 SVK_loehr-plan:0 "斯特凡尼克的进攻型空军计划"
 SVK_loehr-plan_desc:0 "空军上将米兰·拉斯蒂斯拉夫·斯特凡尼克是一位战略轰炸学说的支持者，他力挺让空军进一步从陆军中独立出来，实现空军单独作战，不再听从陆军的指挥，这样能更好的发挥空军的主观能动性。有了重型轰炸机，空军能够打击帝国的一切敌人并摧毁他们的军事能力和士气。"
 SVK_flugschule:0 "建立国家飞行学院"
 SVK_flugschule_desc:0 "尽管斯洛伐克境内有着众多飞行学校，但是却从没有一个集中化的学院来协调训练并为航空军提供飞行员和军官。建立这样一个机构对改革至关重要，因为它会为我们提供新一代的军官和飞行员，同时也会将部队精简的不那么臃肿。"
 SVK_airbase_expansion:0 "拓展空军基地"
 SVK_airbase_expansion_desc:0 "新的单翼机技术让飞机的航程更进一步，同样也为我们的军事和经济两个方面带来了巨大多机遇。如果能够在航空兵团的各个基地中推广它，我们将能以最小的人员伤亡取得最大的空中优势。将它运用在新式飞机上还可以刺激地方经济。"
 SVK_fighter_trials:0 "战斗机测试"
 SVK_fighter_trials_desc:0 "航空技术的发展一日千里，战机迭代的速度更是日新月异。面对不断演进的空防形势与作战需求，我国航空企业已率先组织专项实验团队，全力推进新一代战斗机的预研与攻关。战斗机向来是空中力量体系的核心支柱，更是现代战争中夺取制空权、保障国土安全的关键装备。新一代战斗机的研发，不仅关乎技术优势的建立，更直接关系到未来战场态势的主动权的掌控。因此，我们必须把握战略机遇，集中优势资源，加快推进新型号的高质量研发，为构筑坚强可靠的空中防线奠定坚实基础。"
 SVK_light_bomber_trials:0 "轻型轰炸机测试"
 SVK_light_bomber_trials_desc:0 "地面支援任务始终是航空兵作战体系中的优先环节，采用轻型轰炸机执行此类使命，不仅是战术上的选择，更是战役层面的必需。这类机型兼具敏捷性与打击精度，能够在我方地面部队接敌时迅速提供火力支援，有效摧毁敌方工事、装甲单位及兵力集结点。目前可用于此类任务的航空平台构成一个完整的装备谱系：一端是具备较大载弹量与航程的双引擎轰炸机，虽然相对“重型”，但仍保有较强的战术灵活性；另一端则是由战斗机改装而成的俯冲轰炸机，以其极高的精准度和快速反应能力见长。这一轻重兼备、梯次搭配的装备体系，使我们能够根据战场实际情况，灵活组织空中支援，形成对地打击的最大效能，进而确保地面作战行动的顺利推进。"
 SVK_heavy_bomber_trials:0 "重型轰炸机测试"
 SVK_heavy_bomber_trials_desc:0 "重型轰炸机是飞机技术上相对较新的一种发展，战略轰炸的支持者看到了它们的潜力。卓越的航程和超大的载弹量使它们成为敌后打击的完美角色。因此，有关它们的试验正在广泛进行，许多飞机公司都渴望赢得这样一份利润丰厚的合同。"
 SVK_medium_bomber_trials:0 "中型轰炸机测试"
 SVK_medium_bomber_trials_desc:0 "多用途中型双引擎轰炸机因其卓越的任务弹性与广泛的战术适应性，已引起高级司令部的高度重视。这类战机不仅能够胜任传统的轰炸任务，还可灵活转向侦察、对地支援乃至部分制空作战，显示出其在现代战场中不可替代的实战价值。鉴于战术轰炸机在近年作战行动中屡建奇功，已成为航空兵部队的中坚力量，各大飞机制造商也嗅到其中巨大的战略需求与利润空间，纷纷投入技术竞赛，全力角逐新一代战术轰炸机的研发先机。"
 SVK_mil_expanded:0 "新式斯洛伐克军队"
 SVK_mil_expanded_desc:0 "军队的改革之路漫长而充满挑战，其间付出的代价固然高昂，但每一份投入终将淬炼出更为坚韧的国防力量。如今，新型主战坦克、先进枪械与多用途战机，正如滚滚洪流般从全速运转的生产线上奔赴一线，交付至早已期盼换装的部队手中。经过这场深刻而彻底的现代化重塑，我军已焕然一新，装备精良、士气高昂，随时准备迎战斯洛伐克方向的任何来犯之敌，以铁与火捍卫国土尊严。"
 SVK_outside_world:0 "外部世界"
 SVK_outside_world_desc:0 "现在，作为一个独立的国家，我们必须开始制定外交政策了。让我们好好开眼看世界吧。"
 SVK_an_alliance:0 "结成同盟"
 SVK_an_alliance_desc:0 "欧洲似乎再次成为了火药桶，是时候让我们开始寻找能在未来的斗争中与我们并肩作战的盟友了。"
 SVK_socialist_camp:0 "社会主义联盟"
 SVK_socialist_camp_desc:0 "虽然我们对第三国际没有什么好感，但作为世界上唯一一个社会主义同盟，我们现在必须同他们站在一起保护我们的工人国家。"
 SVK_old_west:0 "老西方"
 SVK_old_west_desc:0 "大约二十五年前，协约国为了我们挺身而出。虽然最后落了个遍体鳞伤的结果，但今日的他们依旧是我们政府理想的帮手。"
 SVK_defense_of_our_people:0 "捍卫主权"
 SVK_defense_of_our_people_desc:0 "欧洲的巨人们最害怕什么？害怕在血腥而昂贵的战争中丢人现眼，因此当他们贪婪地试图吞并我们的国家时，他们只会一头撞上我们的铜墙铁壁。"
 SVK_anti_hungarian_stance:0 "反匈立场"
 SVK_anti_hungarian_stance_desc:0 "匈牙利继续推行着他的侵略性外交政策，以为他们可以尽可能多的保留那些攫取来的土地，现在我们必须在这里给他们划上界限，他们不能通过！"
 SVK_oppose_habsburgs:0 "阻止哈布斯堡野心"
 SVK_oppose_habsburgs_desc:0 "维也纳那近亲相奸的产物，至今仍用贪婪的目光觊觎着我们的土地。他们妄想让哈布斯堡帝国的幽灵借着“多瑙河联邦”的躯壳还魂，让旧帝国的阴影重新笼罩这片山河。我们绝不能容许历史的悲剧重演。是时候彻底斩断这条试图缠住我们脖颈的锁链，是时候让这个困扰我们百年的棘手问题，在我们这一代人手中永远终结。我们脚下的土地只属于我们自己，过去如此，现在如此，将来也必永远如此。"
 SVK_topple_hungary:0 "粉碎匈牙利复仇主义"
 SVK_topple_hungary_desc:0 "匈牙利在失去斯洛伐克时痛苦不堪。这简直是要了那些天天做着“大匈牙利”春秋大梦的人命，所以我们必须在他们变得过于强大之前将他们的复仇主义火苗熄灭。斯洛伐克将不再属于这些马扎尔匈人佬，不管他们愿不愿意。\n管他们怎么想！让他们去争吵、叫喊或放大话去吧！斯洛伐克人民会一直、一直、一直继续挺立于世的！"
 SVK_depose_habsburgs:0 "钉紧奥地利棺材板"
 SVK_depose_habsburgs_desc:0 "他们已不能再以铁腕控制我们，而且现在，他们的帝国已经衰败，扩张之梦也已凋零，而我们将第一次占领维也纳。"
 SVK_polish_czechoslovak_federation:0 "波兰-斯洛伐克联邦"
 SVK_polish_czechoslovak_federation_desc:0 "几个世纪以来，波兰与斯洛伐克这两个兄弟国家一直受到外国的压迫与掠夺，我们将团结起来，我们将抹去这屈辱的历史，并且永不再重演。"
 SVK_russophilia:0 "斯拉夫兄弟"
 SVK_russophilia_desc:0 "越来越多的人都在思考，能不能让斯拉夫人团结起来，对抗历史上那些欺压我们的强权。我们不应该沉迷于兄弟阋墙之中，而应该团结一致，共御外敌。"
 SVK_mutual_programs:0 "互助合作"
 SVK_mutual_programs_desc:0 "既然我们现在都在一起战斗了，为什么我们要以捍卫主权的理由，去向对方隐瞒科技成果呢？我们将开始和俄国人分享蓝图。"
 SVK_return_czechoslovak_legions:0 "捷克军团归乡"
 SVK_return_czechoslovak_legions_desc:0 "随着符拉迪沃斯托克的僭主政权被击垮，我们应该开始就失散已久的捷克军团的回国问题进行谈判。他们近三十年来一直流亡国外，无家可归，也该回来了。"
 SVK_germanophilia:0 "亲德情节"
 SVK_germanophilia_desc:0 "纠结于过去的恩怨情仇只能阻碍我们实现利益最大化。鉴于现任政府对德国人赞不绝口，我们应该考虑加入他们的组织。"
 SVK_mitteleuropa_membership:0 "中欧同盟成员国"
 SVK_mitteleuropa_membership_desc:0 "在加入帝国公约后，理所当然的，我们将申请加入中欧同盟，成为他们经济圈的一员。"
 SVK_german_officers:0 "德式训练"
 SVK_german_officers_desc:0 "尽管我们曾多次迎击以这种方式战斗的军队，但普鲁士式的战争方式仍然值得我们学习。让我们吸收借鉴这种有效的战争方式，请些顾问来培训我们的军队。"
 SVK_national_ambitions:0 "国家雄心"
 SVK_national_ambitions_desc:0 "我们是一个自由的国家，但我们不仅是一个新生的国家，我们可以留下一种宝贵遗产，让我们不像过去的国家那样被历史的浪潮冲垮。"
 SVK_official_neutrality:0 "斯洛伐克独存于世"
 SVK_official_neutrality_desc:0 "我们如今过得很好，不需要谁来指点江山，更不需要什么捷克斯洛伐克主义。让那些捷克人继续抱着他们那套理想做梦去吧，我们斯洛伐克人早已走上自己的路。我们挣脱过一个牢笼，就不会再走进另一个。斯洛伐克就是斯洛伐克，不从属于谁，不依附于谁，更不会再认什么新主子。我们站在这里，站在喀尔巴阡的山风中，站在自己选择的土地上，独立、自由、完整。就让他们守着他们的旧梦，我们自有我们的明天。"
 SVK_our_mark_on_earth:0 "接受捷克斯洛伐克主义"
 SVK_our_mark_on_earth_desc:0 "捷克人早已背弃了捷克斯洛伐克主义的真谛，他们将这一崇高理念扭曲为维系自身统治的借口，篡改了它的灵魂。而今，我们要重新举起T.G.马萨里克那面尘封的旗帜，让捷克斯洛伐克之魂在斯洛伐克的土地上再度燃烧。我们不会任由梦想沦为权力的注脚，也不会让理想屈从于现实的算计。我们要让真正的、纯粹的捷克斯洛伐克精神重见天日，不是作为统治的工具，而是作为自由的火焰，照亮我们共同的前路。"
 SVK_join_the_weltkrieg:0 "誓与赤匪拼死斗"
 SVK_join_the_weltkrieg_desc:0 "我们不能让西方社会主义的威胁持续存在下去，这种瘟疫正在中欧大地上蔓延开来。而我们要坚定不移地对抗赤匪的威胁！"
 SVK_panslavist_doctrine:0 "捍卫西斯拉夫主义"
 SVK_panslavist_doctrine_desc:0 "尽管泛斯拉夫主义运动的理念确实崇高而宏伟，但要想实现中欧、东欧、巴尔干甚至是俄罗斯最边远地区的斯拉夫民族的完全统一，对我们来说根本就是无稽之谈。因此，我们应该把西斯拉夫人的统一和东南方同族的解放当做我们的首要目标。"
 SVK_destroy_galicia:0 "拯救不幸的加利西亚"
 SVK_destroy_galicia_desc:0 "加利西亚-洛多梅里亚是波兰人和乌克兰人共同的家园，也是后者一系列民族思想的发源地。荒凉和贫困长年笼罩在这片大地上，因此我们必须向这些不幸的同胞伸出其急需的援助之手。"
 SVK_integrate_poland:0 "为长久的竞争画上句点"
 SVK_integrate_poland_desc:0 "波兰的历史可谓源远流长，其存在的时间与统一的捷克国家不相上下。我们两国都曾遭受过斯拉夫世界以外的势力的占领，但我们都坚持了下来，并在相互之间的友好竞争中寻得了一丝慰藉。现在，是该看看谁能在这段关系中占得大头了。"
 SVK_attack_ukraine:0 "解放面包篮"
 SVK_attack_ukraine_desc:0 "乌克兰地处边陲，长期受东西方文化的共同影响，不久前才崛起成为世界舞台上的重要一员。他们的资源堪称取之不尽用之不竭，其价值不可估量，我们应与西斯拉夫联盟精诚合作，激发出他们真正的潜力。"
 SVK_annex_belarus:0 "白俄罗斯地区启蒙"
 SVK_annex_belarus_desc:0 "白俄罗斯的命运实属悲惨，好不容易摆脱了浑浑噩噩的民族身份和立陶宛的宗主，紧接着却又接连迎来了俄罗斯人的魔爪和德国为灌输普鲁士思想而硬生生捏造的君主制。身为斯拉夫民族的新守护者、白俄罗斯民众的西方表亲，我们自然应该出手，帮助其实现从“地方”身份到民族理想的转变。"
 SVK_backstab_russia:0 "祓除妄想"
 SVK_backstab_russia_desc:0 "通向斯拉夫一族的解放之路上唯余最后一个障碍，而这个障碍或许也是我们所要面对的最大困难。大俄罗斯的流毒危害了我们的远亲太久太久了，久到把保护全体斯拉夫人这一崇高的目标都扭曲成了由莫斯科一手遮天的帝国主义妄想。帮助俄罗斯人走出过去、现在与未来的错误，我们义不容辞。"
 SVK_czech_corridor:0 "开辟捷克走廊"
 SVK_czech_corridor_desc:0 "捷克走廊是一个昔日的想法，如果协约国在大战中得胜，他们就会让匈牙利割让一片土地，以让捷克斯洛伐克和南斯拉夫成为邻国。虽然这得到泛斯拉夫派的支持，但由于同盟国的胜利，该计划从未能够付诸实施。\n然而，这条走廊现在将为民族主义及其象征目的服务，统一，并将奥匈帝国与他们的第二首都分隔开来。"
 SVK_Democratic_Republic:0 "实现民主共和国之梦"
 SVK_Democratic_Republic_desc:0 "1940年，斯洛伐克社会民主党在历史性的大选中以压倒性优势获胜，他们肩负起整个民族的期望，正式踏上了建立斯洛伐克民主共和国的征程。这可以说是民意的一次彻底觉醒，也是民主力量在斯洛伐克土地上的伟大绽放。"
 SVK_Fruits_of_victory:0 "巩固民主的胜利果实"
 SVK_Fruits_of_victory_desc:0 "不过这次选举过程并非完美，存在一些令人担忧的隐患。安保措施的疏漏给左右翼极端分子钻了空子，他们潜伏在民主制度的缝隙中，差一点就把年轻的斯洛伐克推向深渊。这场危机如同一记警钟，提醒我们民主果实需要持续守护，必须坚定捍卫这来之不易的自由制度。"
 SVK_Real_social_democracy:0 "我们引以为豪的社会民主"
 SVK_Real_social_democracy_desc:0 "斯洛伐克的社会民主主义有其独特之处，它不像有些国家那样只讲漂亮话或空头承诺，而是像春雨一样渗透进人民生活的方方面面，从工厂车间到乡村田野，从学校教室到家庭灶台，社会民主的理念在这里真正扎下了根。让每个公民亲身体会到制度带来的繁荣与尊严，正是我们始终追求的目标。"
 SVK_Collective_patriotism:0 "激发集体爱国主义热情"
 SVK_Collective_patriotism_desc:0 "沉寂多年的斯洛伐克民族主义正等待被唤醒。我们应当重新点燃人民心中对祖国的赤诚热爱，培养深厚的爱国情怀，让每个斯洛伐克人都能发自内心地守护我们共同的家园，捍卫这片土地上每个人的自由。"
 SVK_The_Pride_of_Marxism:0 "让马克思为我们骄傲"
 SVK_The_Pride_of_Marxism_desc:0 "如果卡尔·马克思今天还活着，他一定会为我们所实现的社会民主成就感到自豪。我们不仅是马克思主义理论的继承者，更是其精神实质的坚定实践者。在斯洛伐克，我们正在书写令马克思为之骄傲的新历史。"
 SVK_Oppose_extreme_socialism:0 "誓死抵御赤色极端主义"
 SVK_Oppose_extreme_socialism_desc:0 "我们必须清醒认识到，共产主义、工团主义以及其他鼓吹暴力革命的思潮，本质上都已经背离了马克思主义的真义。这些极端思想企图破坏公民的民主生活，摧毁我们建立的社会秩序，对此我们绝不退让，坚决守护我们的民主价值观。"
 SVK_Ivan_Derer:0 "伊万·德雷尔与民粹梦想"
 SVK_Ivan_Derer_desc:0 "深受爱戴的伊万·德雷尔先生在党内获得广泛支持，成功当选斯洛伐克总统。他将带领大家实现他所倡导的斯洛伐克社会民主民粹主义蓝图，这是一条融合人民意愿与民主价值的独特道路。"
 SVK_Realize_Czechoslovakism:0 "强硬实现捷克斯洛伐克联合"
 SVK_Realize_Czechoslovakism_desc:0 "捷克斯洛伐克的统一是大势所趋。我们本来就是同根同源的民族，两国都有不少有识之士强烈呼吁捷克与斯洛伐克重新联合。我们必须采取坚定措施，稳步推进这一历史性的统一进程。"
 SVK_The_Peace_of_A_Generation:0 "属于一代人的和平主义"
 SVK_The_Peace_of_A_Generation_desc:0 "早在一战爆发之初，德雷尔总统就公开谴责这场非正义的战争。他曾在报纸上大声疾呼，恳请捷克人和斯洛伐克人不要成为列强博弈的牺牲品。可惜当时民众被狂热的民族主义蒙蔽，导致至今仍有同胞流落在俄罗斯远东无法回家。如今二战阴云笼罩，我们比任何时候都更需要和平，捷克斯洛伐克人民绝不能再被卷入战争。"
 SVK_Farmers_and_workers:0 "农民与工人一同前进"
 SVK_Farmers_and_workers_desc:0 "真正进步的国家发展道路，不能落下任何一个群体。工人是国家的重要支柱，广大农民同样是这片土地的根基。一个真正为人民谋福祉的国家，必须同时属于工人和农民。"
 SVK_Emanuel_Lehocky:0 "伊曼纽尔·莱霍基与正统道路"
 SVK_Emanuel_Lehocky_desc:0 "社会民主党创始人兼理论奠基人伊曼纽尔·莱霍基，因其卓越贡献赢得全民支持，当选斯洛伐克总统。他将以深厚的理论素养和政治智慧，带领我们走上真正的社会民主之路。"
 SVK_The_Gotha_Program:0 "接受拉萨尔的哥达纲领"
 SVK_The_Gotha_Program_desc:0 "费迪南德·拉萨尔的思想遗产，尤其是《哥达纲领》中的深刻见解，非常值得我们认真研究和借鉴。将这些理论精华融入斯洛伐克的社会民主体系，会让我们的思想武器更加丰富和完善。"
 SVK_Replace_the_entrepreneur:0 "劳动者取代企业家"
 SVK_Replace_the_entrepreneur_desc:0 "通过合作社模式成长起来的企业家，往往比传统资本家更具社会责任感。让无产阶级通过这种方式成为企业家，不仅能缓和阶级矛盾，还能促成社会各阶层和谐共处、共同发展。"
 SVK_Hegelian_tradition:0 "社民党的黑格尔传统"
 SVK_Hegelian_tradition_desc:0 "社会民主党始终尊奉经过卡尔·马克思批判改造的黑格尔哲学，这一理论基石百年不移，任何人都无法动摇我们对这一哲学传统的忠诚。这是我们思想体系的灵魂所在，也是我们区别于其他政治力量的本质特征。"
 SVK_Everything_for_the_farmers:0 "一切为了农民"
 SVK_Everything_for_the_farmers_desc:0 "1940年，斯洛伐克大地掀起了一场政治风暴。长期扎根于乡村田野的斯洛伐克民族农民党，以其贴近民生的朴实主张赢得了广大农民的热烈拥戴。在这场决定国家命运的选举中，他们以排山倒海之势，将长期占据政坛主导地位的斯洛伐克社会民主党斩落马下，开创了斯洛伐克政治史的新纪元。"
 SVK_Farmers_rights:0 "以武力捍卫农民权益"
 SVK_Farmers_rights_desc:0 "农民必须拿起武器，这是捍卫我们生存权利的唯一途径！只有武装起来的农民，才能守护祖辈留下的土地，才能抵御那些贪婪的地主和疯狂工业化的侵蚀。我们要让每一把镰刀都闪耀着捍卫尊严的光芒，让每一支猎枪都成为守护家园的利器。对于那些企图剥夺我们土地的家伙，我们必将用武力给予最坚决的回击！"
 SVK_Oppose_Magyar_hegemony:0 "将马扎尔霸权主义踹入坟墓"
 SVK_Oppose_Magyar_hegemony_desc:0 "数百年来，匈牙利王国的马扎尔统治者像沉重的枷锁般压在我们身上。但今非昔比，觉醒的斯洛伐克人民必将把马扎尔的霸权主义彻底埋葬！我们要用坚定的意志铸就复仇的长矛，直刺马扎尔人罪恶的心脏。让布达佩斯的贵族老爷们记住：斯洛伐克人不再是任人宰割的羔羊！"
 SVK_Catch_the_mouse:0 "保护维持温饱的粮仓"
 SVK_Catch_the_mouse_desc:0 "有人胆敢将魔爪伸向农民赖以生存的粮仓？这简直是对我们生存底线的公然挑衅！我们要用最严厉的方式警告这些掠夺者：谁敢动农民一粒粮食，我们就砍断谁的脏手！农民的粮仓神圣不可侵犯，这是我们用血汗浇灌的成果，绝不容许任何人染指！"
 SVK_Our_Lajos_Kossuth:0 "科苏特是属于我们的英雄"
 SVK_Our_Lajos_Kossuth_desc:0 "任凭那些马扎尔人在多瑙河畔如何咆哮，拉约什·科苏特永远是我们斯洛伐克的骄傲！他们休想篡改历史，休想夺走属于我们的民族英雄。科苏特精神早已融入斯洛伐克的山川河流，他的每一滴热血都在为斯洛伐克的自由而沸腾！"
 SVK_Protect_impoverished_farmers:0 "向万千贫困农户伸出援手"
 SVK_Protect_impoverished_farmers_desc:0 "在我们广袤的乡村，仍有无数农民在贫困线上挣扎。国家绝不能坐视不管！我们要伸出温暖的援手，用实实在在的补贴帮助这些最朴实的劳动者渡过难关。让每一个农民都能感受到：这个国家始终与他们心连着心，血浓于水！"
 SVK_Vavro_Srobar:0 "精明的瓦夫罗·什罗巴尔"
 SVK_Vavro_Srobar_desc:0 "睿智的农民之子瓦夫罗·什罗巴尔，这位深谙民情的民粹理论家，以其卓越的才智赢得了全党的信任。在万众瞩目下，他肩负起领导斯洛伐克的重任，成为这个新生国家的新任总统。他的当选，标志着农民真正掌握了国家的前途命运。"
 SVK_Tomas_Masaryk:0 "追随托马斯·马萨里克路线"
 SVK_Tomas_Masaryk_desc:0 "伟大的托马斯·马萨里克始终心系天下苍生，特别是那些面朝黄土背朝天的农民。我们要坚定不移地沿着他指引的道路前进，将国家的温暖送到每一户农家。让饱经风霜的农民不仅能收获尊严，更能拥有充足的面包！"
 SVK_Democratic_Antisemitism:0 "揭露犹太人的邪恶面孔"
 SVK_Democratic_Antisemitism_desc:0 "至于那些令人不齿的犹太人，他们在世界大战的硝烟中躲藏在阴暗角落，逃避保家卫国的责任。当我们的青年在前线浴血奋战时，他们却在后方吮吸着国家的血液。这些寄生虫必须离开斯洛伐克，这片土地不容许这样的败类存在！"
 SVK_The_Road_to_Independence:0 "捷克斯洛伐克的独立之路"
 SVK_The_Road_to_Independence_desc:0 "我们要以钢铁般的意志捍卫捷克斯洛伐克的独立主权！向全世界庄严宣告：我们不属于哈布斯堡，不属于匈牙利，我们只属于这片土地上生生不息的人民。任何企图奴役我们的势力都将遭到最坚决的反击！"
 SVK_Milan_Hodza:0 "魅力非凡的米兰·霍贾"
 SVK_Milan_Hodza_desc:0 "富有远见的农业理论家米兰·霍贾，作为马萨里克的得力臂膀，以其独特魅力赢得了全体国民的拥戴。这位心系农民的领袖成功当选总统，标志着捷克与斯洛伐克人民团结一心，共同开创美好未来。"
 SVK_Danube_Federation:0 "多瑙河联邦从斯洛伐克开始"
 SVK_Danube_Federation_desc:0 "米兰·霍贾总统怀揣着一个伟大的梦想：在中欧大地建立一个消除一切歧视的农民天堂。如今，手握权柄的他终于可以大展宏图，将这个美好愿景一步步变为现实，为千百万农民打造理想家园。"
 SVK_Administrative_institution_downsizing:0 "改革冗余臃肿的行政机构"
 SVK_Administrative_institution_downsizing_desc:0 "臃肿的行政机构已成为国家发展的绊脚石。那些重叠的部门、冗余的编制，必须用快刀斩乱麻的方式进行彻底改革！唯有如此，政府服务人民的效率才能得到本质提升，国家机器才能焕发新的活力。"
 SVK_Ethnic_equality_rights:0 "为各民族平等权益而斗争"
 SVK_Ethnic_equality_rights_desc:0 "一个开明的民族应当学会尊重其他民族。那些狂热的民族主义者应该明白：我们争取的是平等权利，而不是骑在别人头上作威作福。同为人类，为何要对自己的同胞施加压迫？让我们携手共建一个没有歧视、充满理解的美好家园！"
 SVK_Resurgence_of_Traditional_Spirit:0 "斯洛伐克传统精神迎风而起"
 SVK_Resurgence_of_Traditional_Spirit_desc:0 "1940年，斯洛伐克迎来历史性的一刻，大选结果庄严揭晓，最终由坚守天主教保守主义理念的斯洛伐克民族党胜出。作为斯洛伐克最受民众拥护的民主政党，民族党不仅以坚定的斯洛伐克民族认同为旗帜，更以毫不妥协的反斯洛伐克主义立场，捍卫着我们民族的尊严与未来。他们不仅是选举的赢家，更是斯洛伐克人民意志的化身。"
 SVK_The_history_of_struggle:0 "铭记民族解放与斗争的历史"
 SVK_The_history_of_struggle_desc:0 "回望1848年，我们曾满怀激情投身于“民族之春”的浪潮，渴望挣脱枷锁、争取自由。然而，奥地利帝国的铁蹄无情地碾碎了我们的梦想，而一度并肩作战的匈牙利人，竟在关键时刻背弃了我们，他们渴求自身的自由，却拒绝将同样的权利赋予斯洛伐克人。这段被鲜血与背叛浸染的历史，是我们民族记忆中永不愈合的伤疤。唯有铭记这份痛楚，斯洛伐克才能在苦难中淬炼出更强大的灵魂。"
 SVK_Cultural_protectionism:0 "捍卫我们的语言与文化"
 SVK_Cultural_protectionism_desc:0 "匈牙利人曾处心积虑地企图抹去斯洛伐克的语言根脉与文化灵魂，在斯洛伐克土地上强行推行“马扎尔化”政策，妄想使我们沦为历史的尘埃。然而他们终究失败了。一代又一代斯洛伐克青年在压迫中觉醒，以不屈的意志捍卫着我们与生俱来的权利，说母语的权利、传承文化的权利、做斯洛伐克人的权利。他们用信念筑起了民族精神的堡垒。"
 SVK_National_Committee:0 "斯洛伐克民族委员会的遗产"
 SVK_National_Committee_desc:0 "1848年，我们成立了斯洛伐克民族委员会，以此作为争取民族独立与自主的核心机构。起义虽遭镇压，但民族委员会的火种从未熄灭，它在暗夜中潜伏，在沉默中积蓄力量，始终寻找着挣脱枷锁的契机。如今，斯洛伐克赢得自由已逾四载，在这呼吸着自主空气的日子里，我们永远不会忘记民族委员会为这片土地所立下的不朽功绩。"
 SVK_Reverse_Magyarization:0 "将马扎尔化的遗留影响驱除"
 SVK_Reverse_Magyarization_desc:0 "尽管“马扎尔化”的浪潮最终退却，但其遗毒仍如幽灵般徘徊在我国某些地区。在一些受其侵蚀较深的角落，甚至滋生出对匈牙利的认同，而淡忘了斯洛伐克才是我们血脉所系的祖国。我们必须以坚定的民族教育、以深沉的文化感召，唤醒这些迷途的灵魂，让他们重新认清：斯洛伐克，才是我们共同且唯一的家园。"
 SVK_Moderate_nationalism:0 "拒绝暴力的斯洛伐克民族主义"
 SVK_Moderate_nationalism_desc:0 "我们必须警惕斯洛伐克赫林卡人民党所展现的暴力倾向。民族主义本应是捍卫尊严的盾牌，而不应化作撕裂社会的猛兽。如果我们任由暴力主导对待少数民族的方式，那我们与昔日压迫我们的匈牙利又有何异？我们将沦为自身最憎恶的模样，这绝非斯洛伐克应有的道路。"
 SVK_Martin_Razus:0 "诗与文与马丁·拉祖斯"
 SVK_Martin_Razus_desc:0 "马丁·拉祖斯，这位斯洛伐克杰出的诗人与作家，以其无可争议的声望与人格魅力，当选为斯洛伐克共和国的总统。他不仅是文学的巨匠，更是民族的梦想家。在他的引领下，民族党对于斯洛伐克的蓝图将得以实现，一场自上而下、彻彻底底的改革即将展开，一个崭新的斯洛伐克正在路上。"
 SVK_Slovak_autonomy:0 "自治，而非捷克斯洛伐克"
 SVK_Slovak_autonomy_desc:0 "我们坚决拒绝任何形式的“捷克斯洛伐克主义”！我们曾被匈牙利人凌驾于头顶，绝不容忍再有任何势力企图成为我们新的“主人”。斯洛伐克的自由与独立，是我们用鲜血与信念换来的瑰宝，必须坚定不移地捍卫到底，任何人都休想撼动分毫。"
 SVK_Slovak_nationality:0 "重塑斯洛伐克民族性"
 SVK_Slovak_nationality_desc:0 "斯洛伐克的民族主义，必须根植于我们自身的土壤，符合我们独特的历史与国情。盲目效仿外国模式只会使我们迷失方向。我们要重新塑造属于斯洛伐克人的民族精神，通过追溯祖先的光辉历史，唤醒每一位同胞心中的民族自豪，从大摩拉维亚的荣光到民族复兴的火种，我们的历史本就璀璨夺目。"
 SVK_Side_by_side_with_God:0 "斯洛伐克与天主并肩而立"
 SVK_Side_by_side_with_God_desc:0 "今日的斯洛伐克，所取得的成就已足以与天国比肩。这片流淌着奶与蜜的土地，就是全体斯洛伐克人共同缔造的地上天堂。我们在耶稣基督的荣光指引下，昂首行走于正道之上，步伐坚定，心含骄傲。我们，就是天国在尘世的映照；我们，就是自身的至高荣耀。"
 SVK_According_to_Hlinkas_will:0 "秉承赫林卡意志前行"
 SVK_According_to_Hlinkas_will_desc:0 "那些天真的民主派人士，竟以为依靠华而不实的空谈便能赢得人民的真心拥戴，这实在是大错特错。我们斯洛伐克赫林卡人民党，正是为了纠正他们那偏离正轨的思想而存在。他们所追随的所谓民主，不过是偏离了我们民族精神与历史传统的歧路；而我们，才是真正民主精神的继承者与捍卫者。我们不仅要在理论上驳斥他们的谬误，更要在实践中证明，只有根植于民族土壤的民主，才能带来真正的繁荣与尊严。"
 SVK_Crackdown_on_socialists:0 "斩杀社会主义毒蛇猛兽"
 SVK_Crackdown_on_socialists_desc:0 "四年来，赤色分子在我们的国土上肆意喧嚣，不仅未能兑现任何实质性的福祉承诺，反而加剧了民族的分裂与社会的动荡。他们不配立足在我们神圣的祖国。我们必须举起手中的武器，无论是思想的武器还是实际的武器，将这些破坏秩序、背叛民族的暴徒彻底清除。唯有如此，祖国才能重归统一，斯洛伐克人才能重拾尊严与安宁。"
 SVK_Oppose_extreme_nationalism:0 "完全割弃党内极端羽翼"
 SVK_Oppose_extreme_nationalism_desc:0 "约瑟夫·蒂索与亚历山大·马赫等人所奉行的路线，已经滑向了我们不愿见到的极端。我们所倡导的民族主义，绝不是偏执与排外的同义词。民族主义应当是一种凝聚人心的力量，而不是撕裂社会的工具。如果他们执意不改其激进倾向，那我们只能遗憾地作出决定：将他们从赫林卡人民党中驱逐出去。斯洛伐克的未来，容不下任何形式的极端主义。"
 SVK_Anti_modern_liberalism:0 "拒绝现代自由主义逆流邪风"
 SVK_Anti_modern_liberalism_desc:0 "现代自由主义如一股暗流，正不断侵蚀斯洛伐克人千百年来所积淀的民族特质。新自由主义的经济政策扰乱了我国健全的市场体系，而自由主义的政治理念又在悄然瓦解我们坚定的民族认同。面对这一无形的侵蚀，我们必须果断行动，将自由主义的余毒从我们社会的方方面面中彻底清除，捍卫属于我们自己的文化根基与价值体系。"
 SVK_Czechoslovak_National_Unity:0 "捷克斯洛伐克民族团结"
 SVK_Czechoslovak_National_Unity_desc:0 "捷克斯洛伐克主义，曾是我们与捷克兄弟共同怀抱的一个美好理想，也是我们长期以来共同奋斗的目标。我们渴望构建一个平等而强大的联邦，它不仅能抵御外来的侵蚀与分化，更能凝聚我们两族的力量，共创未来。任何人、任何势力，都休想动摇我们这一坚定的信念与追求。"
 SVK_Loyal_to_Slovakia:0 "永远忠诚于斯洛伐克民族"
 SVK_Loyal_to_Slovakia_desc:0 "无论时代如何变迁，赫林卡人民党的核心宗旨始终如一：永远忠诚于斯洛伐克民族。这是党内不同思潮、不同派别所共同遵循的根本原则。人民党的名字，就代表着对民族命运的承诺，我们绝不会辜负这一神圣的名字，也绝不会背离我们最初的誓言。"
 SVK_Andrej_Hlinka:0 "老领袖安德烈·赫林卡"
 SVK_Andrej_Hlinka_desc:0 "在广大党员与人民群众的热烈拥戴之下，安德烈·赫林卡，这位年迈却意志坚定的老牧师，肩负起领导斯洛伐克共和国的重任。他以其深邃的智慧与坚韧的毅力，引领我们走向一个崭新的时代。一个独立、自强、充满希望的斯洛伐克，已不再遥远，它正一步步从理想走向现实。"
 SVK_Catholic_values:0 "天主教价值观走入日常生活"
 SVK_Catholic_values_desc:0 "我们民族的强大，离不开天主教价值观的指引。正是这一信仰，塑造了我们斯洛伐克人文明、节制、富有道德感的民族性格，使我们有别于那些野蛮而狂躁的马扎尔人。在天主教精神的照耀下，我们将继续走向复兴之路，让斯洛伐克不仅在地理上，更在精神上屹立于欧洲民族之林。"
 SVK_Taming_nationalism:0 "驯服民族主义野兽"
 SVK_Taming_nationalism_desc:0 "民族主义如同一头难以驯服的野兽，若不能加以引导和控制，便会反噬其主，将一切撕成碎片。因此，我们必须以高度的智慧驾驭这股力量，使其既不过激也不软弱，走一条稳健而坚定的中道。唯有平衡与克制，才能让民族主义成为建设性而非毁灭性的力量。"
 SVK_For_the_future_of_Slovakia:0 "为了全体斯洛伐克人的未来"
 SVK_For_the_future_of_Slovakia_desc:0 "在安德烈·赫林卡伟大领袖的英明领导下，斯洛伐克民族已经看到了清晰的未来。那些曾经遥不可及的目标，如今正变得触手可及。这是一个崭新的黎明，是属于每一个斯洛伐克人的希望时代，我们正在亲手缔造历史。"
 SVK_Stefan_Suroviak:0 "“工贼”斯特凡·苏罗维亚克"
 SVK_Stefan_Suroviak_desc:0 "作为铁路工会的重要成员与黄色工会理念的坚定倡导者，斯特凡·苏罗维亚克深得老领袖赫林卡的信任与赏识，最终接替他成为斯洛伐克共和国的领导人。苏罗维亚克上任之后，将全力以赴，实现他那基于黄色工会理念的社会改革蓝图，为工人与国家的关系探索一条新的道路。"
 SVK_Establish_yellow_union:0 "以黄色工会应对赤色威胁"
 SVK_Establish_yellow_union_desc:0 "斯特凡·苏罗维亚克所提出的“以黄色工会逐步替代其他工会组织”的倡议，已在若干试点地区取得了显著成效。这些地区的劳资关系更趋和谐，社会稳定性明显高于其他区域。基于这一成功经验，我们将审慎而坚定地将这一模式推广至全国，以期实现更广泛的社会协调与秩序重建。"
 SVK_Bind_workers:0 "用爱国主义热枕束缚工人"
 SVK_Bind_workers_desc:0 "要有效遏制工人参与游行或抗议活动的冲动，不能仅靠压制，更需引导。我们应当用强烈的爱国主义情感去占据他们的精神世界，让他们深刻认识到，自己辛勤工作的每一刻，都是在为国家的强大与繁荣贡献力量。一旦这种崇高的使命感深入人心，动荡的土壤便将不复存在。"
 SVK_State_controlled_union:0 "国家管控下的工会活动"
 SVK_State_controlled_union_desc:0 "从今往后，任何工会组织的活动必须事先获得国家的批准。未经报备的一切集会与行动，均属非法，必须立即予以解散和取缔。国家必须对一切社会组织保持高度警觉，所有活动都应在政府的监督与引导之下进行，这是维护社会稳定与国家权威的不二法则。"
 SVK_Alternative_path:0 "有别于赫林卡的新道路"
 SVK_Alternative_path_desc:0 "民主所建立的所谓秩序已彻底崩塌，虚伪的议会政治将整个国家拖入了深渊。在这片混乱与背叛的废墟上，赫林卡人民党的激进派系毅然崛起，执掌了斯洛伐克的命运。我们决意打破旧时代的桎梏，开辟一条崭新的道路，这条道路将不再延续安德烈·赫林卡时代的妥协与犹豫，而是以铁与火的意志，重塑民族的灵魂。"
 SVK_End_parliamentary_democracy:0 "终止斯洛伐克议会民主"
 SVK_End_parliamentary_democracy_desc:0 "民主是一场精心编织的骗局，是寄生在民族躯体上的政治谎言。一个真正自由的民族，何须倚靠选票与代议制的虚伪把戏？我们斯洛伐克人早已看清真相：民主不过是资本与权贵用来驯化人民的工具。今天，我们不仅要撕下这层面纱，更要亲手埋葬民主的遗骸，让斯洛伐克在真实的意志中重获新生。"
 SVK_Crack_down_on_the_opposition:0 "让喧嚣的反对者们闭嘴"
 SVK_Crack_down_on_the_opposition_desc:0 "那些喋喋不休的民主派、躲在暗处的社会主义者，以及所有企图阻挡民族复兴的反对势力，他们的命运已经注定。赫林卡卫队，我们最忠诚的钢铁臂膀正蓄势待发。清算的时刻即将来临，每一个叛徒、每一个动摇分子，都将在民族法庭面前付出代价。"
 SVK_Purge_of_Slovak_Jews:0 "彻底清除斯洛伐克犹太人"
 SVK_Purge_of_Slovak_Jews_desc:0 "犹太人从未真正属于斯洛伐克。在一战的烽火中，他们逃避兵役；在和平的年代，他们蚕食我们的经济；如今，他们更是在别国的废墟上建立自己的国家，践踏另一个民族的尊严。斯洛伐克不再容忍这样的背叛，我们必须彻底清算这一异质元素，捍卫民族的纯洁。"
 SVK_Establish_dictatorial_position:0 "确立人民党的独裁地位"
 SVK_Establish_dictatorial_position_desc:0 "斯洛伐克议会已被解散，旧时代的嘈杂争论就此终结。从今以后，这片土地上只允许存在一种声音，赫林卡人民党的声音。我们宣告全国性独裁政权的建立，这不是压迫，而是拯救。唯有通过铁的纪律与统一意志，斯洛伐克才能踏上真正强大的道路。"
 SVK_Defend_independence:0 "保卫我们骄傲而光荣的独立"
 SVK_Defend_independence_desc:0 "捷克人梦想着“捷克斯洛伐克主义”的复活，匈牙利人觊觎我们的南部领土，波兰人则高唱“西斯拉夫兄弟情”企图吞并我们。外部势力从未停止对斯洛伐克主权的侵蚀。但我们要高声宣告：斯洛伐克的命运，只能由斯洛伐克人自己掌握！我们不要虚假的同盟，不要屈辱的依附，我们要的是完整、独立、光荣的斯洛伐克祖国！"
 SVK_Jozef_Tiso:0 "爱国主义神父约瑟夫·蒂索"
 SVK_Jozef_Tiso_desc:0 "在人民的呼声中，虔诚而坚定的天主教神父约瑟夫·蒂索站到了历史的前台。他不仅继承了安德烈·赫林卡的衣钵，更在老领袖的默许下，注入了新时代所需要的决断力。蒂索不仅是赫林卡人民党的新领袖，更是全体斯洛伐克人意志的化身。"
 SVK_Eradicate_famine_completely:0 "解决斯洛伐克人的温饱问题"
 SVK_Eradicate_famine_completely_desc:0 "空谈民主的时代已经结束，人民需要的是面包、工作与尊严。我们将推行一系列切实政策，从根本上消灭贫困，让每一个斯洛伐克家庭都能享有温饱与希望。只有让民众真实地受益，他们才会发自内心地拥护我们的领导。"
 SVK_Away_from_Bohemia:0 "与布拉格政府划清界限"
 SVK_Away_from_Bohemia_desc:0 "赫林卡人民党曾一度对捷克斯洛伐克主义抱有幻想，那是老领袖安德烈·赫林卡一代人的理想。但现实残酷地教育了我们：捷克人从未将我们视为平等的伙伴，他们口中的“联合”不过是并吞的伪装。今天，我们彻底与布拉格决裂，斯洛伐克只走自己的路。"
 SVK_Christian_social_justice:0 "基督教社会正义与现实政治"
 SVK_Christian_social_justice_desc:0 "这个腐败的政治体系需要被净化，而唯一能净化它的，是千年基督教传统所孕育的社会正义。我们将把基督教道德注入国家治理的每一个角落，洗涤官僚与政客心中的贪婪。若有人抗拒这一神圣使命，那就让他们让位，愿意为斯洛伐克奉献的人，从来都不缺。"
 SVK_Alexander_Mach:0 "亚历山大·马赫不可能的胜利"
 SVK_Alexander_Mach_desc:0 "在民族情绪的浪潮中，亚历山大·马赫以不可阻挡之势赢得了斗争。尽管党内有杂音，但人民的选择不容质疑。马赫的胜利，是斯洛伐克民族意志的胜利。历史的车轮已向前推进，任何不甘者只能选择追随，或是被碾碎。"
 SVK_Slovak_of_Slovaks:0 "斯洛伐克只属于斯洛伐克人"
 SVK_Slovak_of_Slovaks_desc:0 "斯洛伐克是斯洛伐克人的斯洛伐克。对于本民族的人，无论其政治立场如何，只要他们最终选择回归民族的怀抱，我们愿意给予宽恕与机会。但对于外族者，尤其是那些长期侵蚀我们生存空间的异族，我们绝不妥协。斯洛伐克的土地，只为斯洛伐克人而存在。"
 SVK_Encourage_nationalism:0 "释放民族主义狂热与种族暴力"
 SVK_Encourage_nationalism_desc:0 "我们必须点燃民族仇恨的火焰，让每一个斯洛伐克人都铭记：科希策还在匈牙利人手中，南斯洛伐克的亲人仍在异族统治下受苦。对匈牙利人的报复不是仇恨的宣泄，而是正义的伸张。让他们也尝一尝痛苦的滋味，才知道斯洛伐克人不可欺。"
 SVK_Dedicated_to_Slovakia:0 "一切果实皆奉予斯洛伐克祖国"
 SVK_Dedicated_to_Slovakia_desc:0 "劳动者的汗水，政治家的智慧，都必须奉献给一个至高无上的存在：斯洛伐克祖国。我们的一切都属于她，任何人都不能将我们与祖国剥离。个人的命运与民族的命运紧密相连，唯有全心全意效忠祖国，斯洛伐克人才能迎来最终的光荣与强大。"
 SVK_Slovak_military_government:0 "军政府治下的新斯洛伐克"
 SVK_Slovak_military_government_desc:0 "那个软弱无能的民主政府已被扫进历史的垃圾堆，连赫林卡那个装神弄鬼的人民党也已被我们彻底击溃，残部四散逃窜，再无翻身之日。如今，斯洛伐克的命运已牢牢掌握在我们军人手中。在秩序重建、和平真正降临之前，任何可能危及稳定的所谓“自由”都必须被果断禁止，这是非常时期的必要之举，不容任何质疑。"
 SVK_Restrict_the_democrats:0 "给民主分子套上枷锁"
 SVK_Restrict_the_democrats_desc:0 "民主？它或许是个不错的幌子，但归根结底只是一种工具，绝不能成为目的。那帮夸夸其谈的政客根本没有统治这个国家的资格与能力，他们的治理只会带来无穷的混乱和动荡。因此，我们必须给他们套上缰绳，可以允许他们发出一点声音，但那声音绝不能越过我们划定的红线，更不能挑战我们定下的规矩。"
 SVK_Protect_the_motherland:0 "保护我们美丽的祖国"
 SVK_Protect_the_motherland_desc:0 "看看我们的四周吧！捷克人、奥地利人、匈牙利人、波兰人，还有那虎视眈眈的德意志人……哪一个不对斯洛伐克的土地垂涎三尺？为了守护祖国的独立与自由，我们不得不暂时收紧内部的缰绳。牺牲一部分个人的自由，是为了换取整个民族的生存空间。这是迫不得已的生存之道，总有一天，人民会理解我们今日的抉择与牺牲。"
 SVK_Remove_obstacles:0 "扫清通完伟大之路的障碍"
 SVK_Remove_obstacles_desc:0 "还有一些躲在阴沟里的老鼠不肯死心，那些不甘失败的前民主派、散落各处的极端民族主义疯子，以及嚣张跋扈的赤色分子。放心吧，我们忠诚的军队早已布下天罗地网，会将他们从藏身的老鼠洞里一个一个地揪出来，彻底清除，绝不留情。"
 SVK_Politicization_of_the_military:0 "将政治进行军事化武装"
 SVK_Politicization_of_the_military_desc:0 "政治本身是软弱无力的，必须经过军事化的淬火，才能变得坚韧而有效。不掌握武力的政治，只会沦为包容叛徒和鼠辈的垃圾桶。唯有我们军人，对国家的忠诚历经考验。因此，军人必须成为政府的坚强柱石，必须进入权力的核心，成为政府的捍卫者与决策者。"
 SVK_Reward_collaborators:0 "犒赏忠诚的合作者"
 SVK_Reward_collaborators_desc:0 "我们的道路也并非孤立无援。早在斗争之初，就有一批有远见的政治家坚定地站在我们一边，与我们同舟共济。对于这些忠诚的合作者，我们不会亏待。他们将获得应有的回报，在政府中担任重要职位，与我们一同塑造斯洛伐克的未来。"
 SVK_Czechoslovak_Legion:0 "捷克斯洛伐克军团挺身而出"
 SVK_Czechoslovak_Legion_desc:0 "那个纯粹的军政府阶段已经完成了它的历史使命，但也面临着无人喝彩的困境和堆积如山的难题。为了更顺畅地推行国策，我们将政权移交给了全体人民都深深敬仰的捷克斯洛伐克军团——这个象征着团结与胜利的英雄集体。伟大的米兰·斯蒂凡尼克将肩负起领导新政府的重任，带领我们走向新的征程。"
 SVK_Home_of_Czechoslovakia:0 "我们即是捷克斯洛伐克之家"
 SVK_Home_of_Czechoslovakia_desc:0 "我们，才是捷克斯洛伐克灵魂的真正继承者！波西米亚的那些人已经背叛了真正的捷克斯洛伐克主义，背离了国父托马斯·马萨里克的正确道路。而我们将在此地，建立起一个崭新的、真正的捷克斯洛伐克。祖国的统一伟业，将从斯洛伐克这里重新开始。"
 SVK_West_Slavic_youth:0 "骄傲的仰起头，西斯拉夫青年！"
 SVK_West_Slavic_youth_desc:0 "数百年来，我们西斯拉夫民族如同砧板上的鱼肉，任人宰割。波兰虽然名义上独立，却不过是德意志人的附庸；而加利西亚-洛多梅里亚、波西米亚以及我们斯洛伐克，更是在奥匈帝国的铁蹄下痛苦呻吟。今天，我们终于可以骄傲地昂起头颅，为民族的生存与荣耀而战！"
 SVK_Equal_Federation:0 "平等，且更加伟大的联邦"
 SVK_Equal_Federation_desc:0 "未来的捷克斯洛伐克，必须是一个真正平等的一体化联邦！不能是捷克人的联邦，也不能是斯洛伐克人的联邦，而必须是所有民族平等参与的联邦。唯有绝对的公平，才能确保联邦延续千年乃至永恒。我们的人民必须享有绝对的自由与平等，再也不受任何内外势力的压迫。"
 SVK_Ukrainian_Insurgent_Army:0 "漂泊于异乡的抵抗者们"
 SVK_Ukrainian_Insurgent_Army_desc:0 "来自喀尔巴阡鲁塞尼亚的勇士们，乌克兰起义军下属的格罗缅科团，已经一路西进，解放了处于混乱中的斯洛伐克。这支英雄部队的指挥官，米哈伊洛·杜达，如今成为了这片土地（或许可以称之为乌克兰的斯洛伐克省）的新领袖。"
 SVK_Lend_the_helping_hand:0 "向斯洛伐克人民伸出援手"
 SVK_Lend_the_helping_hand_desc:0 "我们虽然是乌克兰人，但对斯洛伐克兄弟近年来所遭受的苦难感同身受。这个多灾多难的国家从匈牙利统治下独立不过数年，便又陷入了内战与混乱的深渊。我们作为解放者与管理者的首要责任，就是终结他们的苦难，向在困境中挣扎的斯洛伐克人民伸出援助之手。"
 SVK_Ukraine_Slovakia:0 "构建乌克兰-斯洛伐克联邦"
 SVK_Ukraine_Slovakia_desc:0 "为了从根本上化解斯洛伐克同胞可能存在的抵触情绪，我们郑重提议：建立一个乌克兰-斯洛伐克平等联邦。这个联邦将由乌克兰和斯洛伐克两个完全平等的主体共同组成，共享权力，共担责任。让斯洛伐克人民和乌克兰人民心连着心，携手并进。"
 SVK_The_Glory_of_Revenge:0 "践行复仇主义之荣耀"
 SVK_The_Glory_of_Revenge_desc:0 "复仇主义，不是狭隘的仇恨，而是我们不可推卸的历史责任，是我们民族的无上荣耀！为受苦受难的同胞复仇，为备受屈辱的民族雪耻，这是我们的神圣使命。从今往后，绝不允许任何人再骑在斯洛伐克人或乌克兰人头上作威作福。只要我们两个兄弟民族紧密团结，同心协力，就一定能够战胜那些来自西方的邪恶势力！"
 SVK_Hardline_Communist:0 "强硬派共产党的胜利"
 SVK_Hardline_Communist_desc:0 "旧世界已在人力的穷尽与历史的必然中彻底崩塌，斯洛伐克大地陷入一片混沌与失序。然而，正是在这无边黑暗中，斯洛伐克共产党如赤色朝阳般崛起，以钢铁意志与严密组织，建立起无可争议、无可动摇的统治。一切反动势力在镰刀与锤子交织的耀眼光芒下仓皇溃逃，赤色的浪潮彻底浸染了斯洛伐克的每一寸山河，一个属于劳动者的新纪元就此开启。"
 SVK_Smash_all_old_orders:0 "砸碎一切旧秩序"
 SVK_Smash_all_old_orders_desc:0 "我们必须以铁拳粉碎一切旧秩序的残余，尤其是那所谓民主势力精心构筑的福利国家幻象，它不过是麻痹无产阶级的糖衣炮弹。未来只属于勤劳的工人与朴实的农民，绝不属于寄生社会的懒汉、欺压乡里的恶霸、以及贪婪腐败的政客。民主的遗产，连同其虚伪的议会与骗人的选票，必须被连根拔起、彻底剿灭，绝不能让它在新生的土壤中留下任何毒根。"
 SVK_Workers_Constitution:0 "属于我们的工人宪法"
 SVK_Workers_Constitution_desc:0 "前政权为维系其统治，施以小恩小惠的福利制度，诱使一部分无产者迷失方向。然而，他们始终在刻意掩盖最根本、最尖锐的矛盾：阶级矛盾！他们的法律何曾真正偏向过无产阶级？不过是一纸空文，用以装饰门面。为了彻底揭穿这场世纪骗局，我们将制定一部前所未有的宪法，一部真正属于工人阶级的宪法，将无产阶级专政用根本大法的形式确立下来，让劳动者的权益成为不可撼动的基石。"
 SVK_Slovak_Red_Guards:0 "动员斯洛伐克赤卫队"
 SVK_Slovak_Red_Guards_desc:0 "革命的同志们，切不可有片刻懈怠！反动派如阴沟里的老鼠，无处不在。他们潜伏在阴暗的角落，蜷缩在恶臭的下水道，无时无刻不伺机反扑，企图用那柄沾满人民鲜血的匕首，刺穿我们年轻的工人政权。因此，我们必须先发制人！赤卫队要全面动员起来，保持高度警惕，用铁与火的手段，将这些威胁扼杀在萌芽状态，绝不给敌人任何可乘之机。"
 SVK_The_Birth_of_the_New_World:0 "致新世界的诞生"
 SVK_The_Birth_of_the_New_World_desc:0 "那个腐朽、堕落的斯洛伐克共和国已永远成为历史的尘埃。今天，一个崭新的、由无产阶级亲手缔造的新斯洛伐克，正傲然屹立于世界民族之林。未来的命运紧握在我们劳动者长满老茧的手中，一个没有剥削、没有压迫的新世界，必将在我们工农的汗水与智慧下诞生。让我们为此纵情欢呼吧，为了光明的未来，为了赤旗飘扬的新世界！"
 SVK_Complete_the_Five_Year_Plan:0 "争分夺秒，完成五年计划"
 SVK_Complete_the_Five_Year_Plan_desc:0 "工业化是强国之基。以往的民主政府空谈工业化数年，却在富农、地主及其代理人的重重阻挠下屡屡碰壁，一事无成。如今，我们将毅然拾起这未竟的梦想，以坚定的决心推行第一个五年计划。我们要用计划经济的铁臂，扫清一切障碍，在斯洛伐克的土地上建立起强大的重工业和国防工业，彻底治愈这片土地积弱已久的顽疾。"
 SVK_Stefan_Bastovansky:0 "斯特凡·巴什托万斯基的铁腕"
 SVK_Stefan_Bastovansky_desc:0 "在刚刚闭幕的革命议会上，我们伟大的革命舵手、无产阶级的忠诚卫士，斯特凡·巴什托万斯基同志，以雷霆万钧之势赢得了压倒性的胜利。他的领导是革命事业坚不可摧的保障。在他的英明指引下，斯洛伐克必将迈向一场前所未有的、纯净而充满活力的总革命，将一切旧社会的污秽冲刷殆尽。"
 SVK_Kill_the_reactionaries:0 "无处可逃的反动派与投机者"
 SVK_Kill_the_reactionaries_desc:0 "我们英勇的赤卫队战士们，正以高度的革命热情清扫着祖国的每一个角落。任何反动余孽、投机倒把分子，都休想逃脱这张天罗地网。他们就像罪恶的老鼠，试图啃噬我们新生的政权，但我们警告他们：休想将肮脏的触角伸向我们和平安宁的斯洛伐克祖国！无产阶级的铁拳必将将他们砸得粉碎。"
 SVK_Everything_for_the_revolution:0 "一切为了革命，一切守护人民"
 SVK_Everything_for_the_revolution_desc:0 "斯洛伐克共产党的纯洁性与革命性，高于一切。我们每时每刻都忠于革命理想，忠于人民嘱托。任何人，无论其职位高低，倘若胆敢偏离这条正确的革命路线，或被资本主义的糖弹腐蚀，谁就必将被革命的法律无情审判，迎来最严厉的惩处。无数双革命的眼睛在注视着，背叛人民的苟且之事，想都不要想！"
 SVK_The_Red_Giant_Shrugs:0 "红色巨人耸耸肩"
 SVK_The_Red_Giant_Shrugs_desc:0 "在伟大的斯特凡·巴什托万斯基总统的铁腕统治下，斯洛伐克无产阶级专政的政权，已如同一个顶天立地的红色巨人，傲然挺立于世。这个巨人只要微微耸动肩膀，发出低沉的怒吼，就足以让全欧洲的反动派们吓得屁滚尿流，夜不能寐。我们的力量，来源于工农，必将撼动旧世界的基础。"
 SVK_Antonin_Janousek:0 "老英雄安东宁·雅努舍克"
 SVK_Antonin_Janousek_desc:0 "革命万岁！盘踞在我国领土上的乌克兰侵略者，在我军的英勇打击下已仓皇逃窜。在杰出的军事家、坚定的革命者安东宁·雅努舍克同志的卓越指挥下，斯洛伐克赤卫队的雄师已胜利开进布拉迪斯拉发，将占领此地的乌克兰匪帮全部、干净、彻底地消灭！这些为祖国解放立下不朽功勋的战士们，是斯洛伐克人民真正的英雄，他们的名字将永载史册。"
 SVK_Slovak_Soviet:0 "铭记斯洛伐克苏维埃"
 SVK_Slovak_Soviet_desc:0 "历史的记忆不容磨灭。曾几何时，斯洛伐克苏维埃共和国的伟大计划不幸胎死腹中。那场原本可歌可泣的起义，因可耻叛徒的出卖而夭折，无数英勇的革命志士倒在了匈牙利王国军警的屠刀之下。我们尊敬的安东宁·雅努舍克同志，当年也是那场未竟革命的谋划者之一。这悲壮的一页，这段用鲜血写就的历史，我们必须铭记，它时刻提醒我们革命道路的曲折与叛徒的凶险。"
 SVK_Revolutionary_Power:0 "革命的权力，正义的战争"
 SVK_Revolutionary_Power_desc:0 "革命，是普天下被压迫人民与生俱来的神圣权利！所有在反动派铁蹄下呻吟的人民，都有权奋起反抗，砸碎身上的锁链。而我们，已经取得胜利的斯洛伐克无产阶级，有责任、也有义务发起一场正义的、伟大的解放战争，将盘踞在各国民众头上的反动势力连根拔除。未来的江山，必将是赤旗的海洋，这是历史不可抗拒的洪流！"
 SVK_The_socialist_nirvana_rebirth:0 "社会主义涅槃重生"
 SVK_The_socialist_nirvana_rebirth_desc:0 "回首往昔，社会主义事业曾在国际反动势力的联合围剿下遭受重创，甚至一度濒临灭绝。伟大的俄国十月革命，虽因内外反动派的疯狂反扑而最终受挫，革命导师弗拉基米尔·列宁同志的壮志未酬，更令全世界无产者痛心。但是，我们要正告所有敌人：社会主义从未消亡！它正如一粒充满生命力的种子，在人民的精心呵护与热血浇灌下，于废墟之中顽强生长、逐步壮大。今日的斯洛伐克，就是明证！它正预示着社会主义的涅槃重生，其势必将席卷全球，无可阻挡！"
 SVK_Centrist_Communist:0 "中间派共产党平稳航行"
 SVK_Centrist_Communist_desc:0 "当最后的硝烟散去，旧时代的最后一块基石终于崩塌。那个自诩民主的政权被扫进了历史的垃圾堆，斯洛伐克共产党以雷霆万钧之势完成了全面夺权的伟大使命。前政府的官僚精英被彻底清洗，我们光荣而伟大的斯洛伐克祖国终于迎来了期盼已久的赤色黎明。这是一次彻底的新生，是劳动人民真正的解放。革命的火炬将永远燃烧！斯洛伐克万岁！无产阶级万岁！"
 SVK_Down_with_capitalism:0 "打倒资本，一切归于国家"
 SVK_Down_with_capitalism_desc:0 "资本家这群社会的蛀虫，终日吮吸着工人的血汗而肥。事实已经证明，工人离开资本家能够活得更好，而资本家却从未证明他们离开工人还能存活。他们不过是一群依附在劳动人民肌体上的吸血鬼，靠着剥削和压迫维系着可耻的存在。对于这样的寄生虫阶级，我们必须采取最坚决、最彻底的革命手段，将他们连同滋生他们的土壤一并清除，还社会一个朗朗乾坤。"
 SVK_Proletarian_culture:0 "释放真正的无产阶级文化"
 SVK_Proletarian_culture_desc:0 "腐朽的资产阶级文化终日向无产阶级灌输着"忠于祖国、忠于国家"的谎言，要求他们永远站在所谓"国家利益"的立场思考，却对他们自身饥寒交迫的处境视而不见。这种文化是堕落的，是反动的，是禁锢人民思想的枷锁。我们断言，这种虚伪的文化必将被抛进历史的深渊，取而代之的将是充满生机与活力的、属于无产阶级自己的新文化，一种真正为人民发声、捍卫人民尊严的文化。"
 SVK_Help_the_poor:0 "救助饥荒与贫困者"
 SVK_Help_the_poor_desc:0 "无论旧民主政府如何将斯洛伐克描绘成天堂，都掩盖不了街头巷尾无家可归者的哀嚎，掩盖不了广袤乡村中无地贫农和贫困户的绝望。我们斯洛伐克共产党人，就是要坚定不移地站在这些被遗忘、被抛弃的劳苦大众一边。我们要伸出坚实的援手，将他们从苦难中解救出来，让他们成为新社会的主人。这是我们庄严的承诺，也是我们不可推卸的历史使命。"
 SVK_Red_Compulsory_Education:0 "为下一代的红色义务教育"
 SVK_Red_Compulsory_Education_desc:0 "教育不应当成为少数精英垄断的特权，它理应属于全体劳动人民。因此，我们将推行全面的义务教育，让每一个斯洛伐克公民都能沐浴在知识的阳光之下。我们要用无产阶级的思想武装下一代的头脑，让他们彻底摆脱资产阶级腐朽思想的侵蚀。我们的后代将在红色的教育中茁壮成长，成为真正的"革命一代"，接过我们手中的旗帜，将共产主义事业进行到底。"
 SVK_Cooperative_People:0 "协力人民赢得胜利"
 SVK_Cooperative_People_desc:0 "我们始终与人民站在一起，血脉相连，命运与共。我们的使命就是帮助人民认识自己的力量，赢得最终的胜利。这个国家属于无产阶级，这个世界也同样属于无产阶级。未来牢牢掌握在劳动者自己手中。当前最紧迫的任务，就是将人民从旧社会的思想牢笼中彻底解放出来，让他们清醒地认识到：他们的命运，必须由自己来主宰！"
 SVK_Laco_Novomesky:0 "拉科·诺沃梅斯基的诗之革命"
 SVK_Laco_Novomesky_desc:0 "在革命议会的一致推举下，深受人民爱戴的诗人、不屈的革命家拉科·诺沃梅斯基同志，众望所归地成为了斯洛伐克的新任总统。他是一位勤恳的实干家，更是一位孜孜不倦的革命引路人。我们坚信，在他的英明领导下，斯洛伐克必将沿着社会主义的康庄大道奋勇前进。为了真理，为了社会主义，万岁！"
 SVK_Bolshevization:0 "再度推动布尔什维克化"
 SVK_Bolshevization_desc:0 "俄国的十月革命虽然遭遇了挫折，我们伟大的革命导师弗拉基米尔·列宁同志也过早地离开了我们，但他们所留下的革命遗产却是无比丰厚的。特别是布尔什维克党的严密组织体系和斗争经验，值得我们深入学习和借鉴。我们将以先锋队的要求建设我们的党，使她成为领导斯洛伐克无产阶级走向胜利的坚强核心。"
 SVK_Guide_the_people:0 "引导人民接受社会主义"
 SVK_Guide_the_people_desc:0 "目前，仍有不少群众对社会主义缺乏了解，部分人甚至因受宗教和旧观念蒙蔽而对社会主义抱有敌意。因此，耐心细致地引导他们，争取他们的理解和支持，是我们的首要任务。这绝非空喊口号所能办到，需要我们忠诚的党员同志们真正深入到田间地头、工厂车间，与群众同甘共苦，用真诚的服务和实际的行动，一点点消除他们的疑虑与隔阂。"
 SVK_Lenin_of_Slovakia:0 "斯洛伐克的弗拉基米尔·列宁"
 SVK_Lenin_of_Slovakia_desc:0 "拉科·诺沃梅斯基同志所开创的斯洛伐克革命道路，已经被实践证明是成功的、正确的。如今，斯洛伐克江山一片红，国内的反动势力土崩瓦解。我们斯洛伐克共产党以辉煌的胜利证明了无产阶级的强大力量。在这一刻，我们完全有理由说，拉科·诺沃梅斯基同志的历史功绩，足以与伟大的列宁同志相媲美！"
 SVK_Vasi_Biak:0 "瓦西尔·比拉克的中庸之道"
 SVK_Vasi_Biak_desc:0 "在革命议会内部经过充分而激烈的民主讨论后，各派别最终以革命大局为重，达成了团结的共识。备受爱戴的中间派领袖瓦西尔·比拉克同志，以其包容和务实赢得了各方的普遍支持，出任斯洛伐克总统一职。我们期待着他能够弥合分歧，凝聚全党智慧，彻底解决长期困扰我党的团结问题，带领我们走向新的团结和胜利。"
 SVK_Reach_the_general_public:0 "从办公室走向普罗大众"
 SVK_Reach_the_general_public_desc:0 "我们的党员同志绝不能蜕变为坐在办公室里发号施令的官僚。真正的革命者，必须扎根于人民群众之中，与群众同吃、同住、同劳动，让他们真切地了解我们、信任我们、支持我们。如果我们脱离了群众，那我们与我们所推翻的那些虚伪的民主分子还有什么区别？密切联系群众，这是我们党最大的政治优势，必须牢牢坚持并发扬光大。"
 SVK_Marginalized_radical:0 "边缘化激进主义者"
 SVK_Marginalized_radical_desc:0 "党内那些强硬派所鼓吹的所谓"全面监管"政策，完全是不切实际的空想。那种"以革命的名义"禁锢自由的做法，绝不会得到斯洛伐克人民的真心拥护。如果我们连自己所要解放的人民都信不过，那我们还能相信谁？革命的目的正是为了让人民当家作主，而不是用新的枷锁去束缚他们。因此，这些脱离实际、高谈阔论的空想家必须被坚决地边缘化。"
 SVK_Revitalize_national_culture:0 "复兴国民文化与光荣历史"
 SVK_Revitalize_national_culture_desc:0 "我们斯洛伐克民族拥有着自己悠久而辉煌的历史文化，这是我们立足的根本。我们何必一味仰视法兰西或不列颠的工团主义经验？又何必为俄国十月革命的具体挫折而过度感伤？最重要的是立足我们脚下的这片土地，从我们民族独特的历史轨迹和文化血脉中汲取力量和智慧。我们与其他民族走过的道路不同，塑造的文化品格自然也各异，他们有的，我们未必需要；我们独有的，正是我们力量的源泉。社会主义事业必须与斯洛伐克的民族特质相结合，才能生根发芽，茁壮成长。"
 SVK_Moderate_Communist:0 "温和派共产党民主转型"
 SVK_Moderate_Communist_desc:0 "尽管斯洛伐克共产党以强硬姿态解散了原有的民主政府架构，但在人事安排上却表现出令人意外的灵活性，除少数确凿违法者被清除外，绝大多数公务人员都得以留任。这种审慎的处理方式让技术官僚和知识精英们悬着的心终于落地。通过保留行政体系的连续性，共产党向全社会传递出寻求最大公约数的合作信号，这预示着斯洛伐克的政治转型将在保持民主内核的前提下稳步推进。"
 SVK_Economic_liberalization:0 "逐步放宽经济管制"
 SVK_Economic_liberalization_desc:0 "临时革命议会推行的战时共产主义体制已完成其历史使命，紧随其后的计划经济模式也到了需要革新的时刻。商店货架的匮乏与民众的消费需求都在呼唤经济活力的回归。是时候让兹罗提重新焕发货币的魔力了，市场自由化绝非洪水猛兽，而是重建经济生态的必由之路。当价格机制重新指引资源配置，当私营经济重获呼吸空间，斯洛伐克这艘航船才能驶出物资短缺的浅滩。"
 SVK_For_the_freedom_of_all:0 "为了所有人的自由"
 SVK_For_the_freedom_of_all_desc:0 "我们的政治哲学始终锚定在"全体斯洛伐克人的自由"这一核心坐标上。无论是流水线上的工人、田野间的农民，还是经营企业的资本家，只要他们认同这片土地的未来，我们就应报以政治智慧下的合作姿态。阶级标签不应成为团结的壁垒，真正的试金石是对民族复兴的实际贡献。这种包容性执政理念，正是新时代社会主义民主的生动注脚。"
 SVK_Welcome_SSS:0 "张开双臂欢迎社会民主党"
 SVK_Welcome_SSS_desc:0 "斯洛伐克社会民主党与我们共享着相似的精神谱系，他们关于社会公正的理论建构尤其值得我们借鉴。取缔这样的兄弟政党不仅是政治短视，更是对社会主义理想的背叛。相反，我们应当敞开政府大门邀请他们共同执政，让两种社会主义思潮在政策制定中碰撞融合，这种"红红合作"模式必将开创斯洛伐克特色的多党合作范式。"
 SVK_Socialist_democracy:0 "巩固社会主义民主制度"
 SVK_Socialist_democracy_desc:0 "社会主义民主制度的巩固面临来自党内的严峻挑战。自从我们推行政治改革以来，共产党内的保守派系不断以"捍卫革命纯洁性"为名攻击新政。这些固守教条的批评者根本不懂，真正的危险不在于政策调整，而在于脱离群众的官僚主义。他们的聒噪恰恰反衬出政治体制改革的紧迫性，民主化从来都是社会主义存续的前提。"
 SVK_Eradicate_the_evil_of_totalist:0 "去死吧，邪恶的极权主义恶魔！"
 SVK_Eradicate_the_evil_of_totalist_desc:0 "极权主义的幽灵仍在欧洲游荡，这种将国家意志凌驾于公民自由之上的政治恶疾，我们必须予以最彻底的清算。特别要警惕那些潜伏在革命队伍中的极权主义崇拜者，他们打着集中力量的幌子行专制之实。对于这些民主肌体中的癌细胞，不仅要通过民主辩论揭露其谬误，更要运用制度手段防止其死灰复燃。"
 SVK_Gustav_Husak:0 "古斯塔夫·胡萨克与法国路线"
 SVK_Gustav_Husak_desc:0 "古斯塔夫·胡萨克先生的当选堪称工团主义思想的重大胜利。这位在工厂车间成长起来的领袖，用他设计的工人自治方案征服了革命议会。在他的蓝图里，工厂委员会将与国家议会形成双重代表制，让经济民主与政治民主相得益彰。这预示着斯洛伐克将探索出一条不同于俄式模式的工团主义道路。"
 SVK_Syndicalist_system:0 "效仿巴黎的工团制度"
 SVK_Syndicalist_system_desc:0 "法兰西公社的工团主义实践犹如一部活的教科书。我们应当派遣代表团深入考察巴黎的工人理事会，邀请普鲁东和索雷尔的后继者来布拉迪斯拉发开设理论讲堂。但学习不是照搬——如何将法兰西的工团主义嫁接到斯洛伐克的文化土壤，需要我们在吸收借鉴中实现创造性转化。"
 SVK_Humanist_socialism:0 "带有人性面孔的社会主义"
 SVK_Humanist_socialism_desc:0 ""带有人性面孔的社会主义"一直是我们的制度基因。这种社会主义拒绝将人异化为宏大叙事的符号，始终将个体幸福作为制度设计的出发点。当批评者质疑我们的改革方向时，遍布城乡的公民议事厅、工人管理的合作社企业、多元共治的社区网络，都是社会主义民主生命力的最佳证明。"
 SVK_Red_Danube_Star:0 "璀璨的多瑙河赤色之星"
 SVK_Red_Danube_Star_desc:0 "多瑙河畔升起的这颗工团主义新星，正用制度创新刺痛着哈布斯堡遗产下的陈旧秩序。我们废除的不仅是旧国家的官僚机器，更是绵延千年的依附传统。当工人开始选举厂长，当农民参与制定农业政策，这种植根于经济领域的民主实践，才是对"解放"一词最深刻的诠释。"
 SVK_Alexander_Dubcek:0 "亚历山大·杜布切克与民主改革"
 SVK_Alexander_Dubcek_desc:0 "亚历山大·杜布切克的崛起象征着民主社会主义者的成熟。这位善于调和不同利益的政治家，在革命议会上搭建起跨越意识形态的对话平台。他提出的"民主化纲领"之所以能获得压倒性支持，正因其准确把握了时代的政治脉搏，在维护社会主义本质的前提下，开辟通往民主社会的制度通道。"
 SVK_Compromise_with_democracy:0 "向民主政党全面妥协"
 SVK_Compromise_with_democracy_desc:0 "真正的民主政治必然包含妥协的智慧。多党制议会不是权力斗兽场，而是政策优化的熔炉。我们鼓励反对派发声，因为理性的批评是最好的防腐剂。各党派辩论越激烈，越能彰显我们民主制度的健康度。这种通过政治博弈实现动态平衡的机制，恰恰是最坚实的反极权保障。"
 SVK_firm_democracy:0 "社会主义与民主制密不可分"
 SVK_firm_democracy_desc:0 "有人指责我们的执政合法性存在悖论，通过暴力革命上台却倡导和平民主。但历史辩证法告诉我们，当旧制度关闭所有改革通道时，革命就成了打开民主之门的唯一钥匙。更重要的是，我们以保留旧政权人员的宽厚方式，完成了暴力革命向宪政政治的软着陆。这难道不是对"社会主义民主"最富创见的实践吗？"
 SVK_Cooperate_with_capitalists:0 "与斯洛伐克资本大鳄合作"
 SVK_Cooperate_with_capitalists_desc:0 "斯洛伐克的经济重建需要调动一切积极因素。只要民族资本愿意遵守新社会的规则，我们就应提供制度包容的发展空间。聪明的执政者懂得将资本活力转化为民生福祉，而非进行意识形态的洁癖式清洗。在市场规律与社会主义原则之间寻找平衡点，让资本为全民福祉服务，这种务实主义才是通往繁荣的理性选择。"
 
