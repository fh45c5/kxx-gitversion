 PLS_PVZ_TRUE_end:0 "终章？"
 PVZ.1.t: "书桌上多出来了一个奇异蘑菇？"
 PVZ.1.d: "桌上不知道为什么长出来了一朵菇，宛如一只从迷幻梦境中走出的生灵，其娇小圆润的体态在夜色中显得格外醒目。它那深紫色的菌盖上布满了粉红色的螺旋纹路，如同不断旋转的旋涡，散发着诱人且危险的荧光。最令人过目难忘的莫过于它那对标志性的螺旋大眼，瞳孔中交织着混乱的线条，透着一股不切实际的魔力。它静静地伫立在菌柄之上，随着呼吸微微律动，看起来既像一个无辜的紫色小精灵，又像是一位深不可测的催眠大师，以这种华丽而诡谲的外表，仿佛在落口的瞬间，就可以无声无息地接管对方的意志。"
 PVZ.1.a: "（咬）"
 PVZ.1.b: "（丢了）"
 PVZ.2.t: "焦灼的对战"
 PVZ.2.d: "战况速报：泳池里的惊魂一刻\n正午的阳光烈得发毒，但我的背脊却阵阵发凉。这把“生存模式：困难”已经进行到了最后一波，背景音乐的节奏快得让人心脏病发。\n满屏都是蹦极僵尸留下的红色靶心，投石车僵尸的履带声沉闷地碾过草坪。我的阵型看起来虽然稳固，但危机四伏：\n高坚果已经被啃得满头大汗，眼看就要撑不住了。\n忧郁菇正疯狂喷吐紫色烟雾，但两只巨型僵尸正举着电线杆步步逼近。\n阳光充沛，但我刚放下的玉米加农炮还没冷却好！\n就在这时，伴随着一声令人胆寒的尖叫，一个撑杆跳选手越过了我最后的防线，直奔大门而去……"
 PVZ.2.a: "僵尸吃掉了你的脑子！"
 PVZ.2.b: "全都防出去了（自信）！"
 PVZ_KXX_plant.1.t: "资金问题"
 PVZ_KXX_plant.1.d: "戴夫说他有一些好主意解决这个问题"
 PVZ_KXX_plant.1.a: "让我们看看他又整了啥花活"
 PVZ_KXX_plant.1.b: "不是很靠谱啊"
 PVZ_KXX_plant.2.t: "小商店？"
 PVZ_KXX_plant.2.d: "戴夫说这玩意可以买到很多我们想要的东西"
 PVZ_KXX_plant.2.a: "额，毕竟你是老大嘛"
 PVZ_KXX_plant.2.b: "别烦我了……"
 PVZ_KXX_plant.3.t: "不一样的“戴夫”"
 PVZ_KXX_plant.3.d: "“你知道我为什么要抱着坚果吗？”\n\n“不知道”\n\n“因为我疯了！！！！！！！！！！！！！！！！”\n"
 PVZ_KXX_plant.3.a: "这集神了！"
 PVZ_KXX_zombie.1.t: "一个计划"
 PVZ_KXX_zombie.1.d: "僵王提出了一个计划，说会让我们获得更多的脑子"
 PVZ_KXX_zombie.1.a: "这是好事啊"
 PVZ_KXX_zombie.1.b: "这家伙怕不是有什么不可告人的秘密"
 PVZ_KXX_zombie.2.t: "更进一步"
 PVZ_KXX_zombie.2.d: "僵王说要结合整个尸群的力量，通过进一步控制尸群意识，共同行动，在未来才能实现我们的脑子自由"
 PVZ_KXX_zombie.2.a: "好！！！！！！！（鼓掌）"
 PVZ_KXX_zombie.2.b: "要用一人的使命绑架整个族群吗……"
 PVZ_KXX_zombie.3.t: "沉默"
 PVZ_KXX_zombie.3.d: "………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………"
 PVZ_KXX_zombie.3.a: "……………………………"
