CHL_the_day_of_judgement:0 "决胜时刻"
CHL_the_day_of_judgement_desc:0 "政治局势风云变幻，革命军政府正处于危机之时，橡皮图章先生正无奈的旁观两头野兽的撕咬，飞鸟猛禽于高空中等待时机，而地面上的雄狮已张嘴咆哮——哪怕四年前还是亲密无间的战友……或许早就不是了？\n\n话虽如此，可那两头野兽已将党内派系瓜分的所剩无几，政府中上层机能几乎彻底停摆，所有人都翘首以待另一方的悲惨落幕。在各自嫡系的背后，工会，左翼政党及进步青年们为为格罗韦将军摇旗助威，大有翻天覆地之势。而那些祖国忠诚的爱国者，刺刀冷芒折射出的钢冷面庞和最忠实的实业家们则敬以连连嘘声回应。\n\n情况已不可挽回，只能以一方被彻底清算作为结束的标志了。"
CHL_choose_grove:0 "为了人民"
CHL_choose_grove_desc:0 "毫无疑问，军队不过是为了达到目的过程中，微不足道又不必要的工具罢了。既然已经达成目的，便自然应让这些无情的执行者回到那应许之地，将政权交还给那最广大被剥削阶级的手上。"
CHL_ensure_army:0 "确保军队支持"
CHL_ensure_army_desc:0 "……不过话说回来，武官系统是文官政府在和平年代最具威慑力和压迫性的执行机构。在不稳定的政局下更是最大的变数。更可悲的是我国并不具备稳定政局与和平年代这二者中的任意部分。巴塔哥尼亚的工人兄弟们向我们投以求助的目光，而那阿根廷的虎豹豺狼正磨刀霍霍，南美战端再开只是时间问题，只能先确保军队支持，将问题推到未来了。"
CHL_sway_unions:0 "拉拢工会"
CHL_sway_unions_desc:0 "作为我国激进左翼基本盘之一，工会一直其中最重要的组成部分。在资本家的解雇威胁及其雇佣的黑社会帮凶之爪牙下，工会有力地将工人们团结起来，以共同储蓄金对抗罢工期间的经济问题又还与地痞流氓们工人纠察队有力的回击，强大又活力旺盛的工会正是我们结盟的不二之选，该正式表态了。"
CHL_land_reform_act:0 "承诺土地改革"
CHL_land_reform_act_desc:0 "在我国境内农民绝不是少数，在前任反动政府压榨下的困苦农民为社会主义政权作出了不小贡献，可政变成功后却忘记了这些可怜的支持者，土地改革进展缓慢的同时该有的是一点没少。我们有必要将本该到来的土地改革执行下去，正如同本该击垮达维拉将军一般。如此这般，农民将是我们最坚实的支持者之一。"
CHL_seek_internationale_support:0 "寻求国际支持"
CHL_seek_internationale_support_desc:0 "虽说革命之路艰辛，作为社会主义国家被强敌环伺，但我们总归还是有有一些来自遥远的大洋彼岸，英法革命同志的小小支援。来自英法革命的同志承诺一旦与阿根廷反动政府开战，必然会派遣大量人力物力及志愿军支援，那么在此之前，我们应有必要提醒英法盟友我国内部之政局动荡，以及之中诞生的妄图反攻倒算之辈，相信大洋彼岸的同志一定会给出有力的支援。"
CHL_compromise_with_democrats:0 "与民主派妥协"
CHL_compromise_with_democrats_desc:0 "大敌当前，更应团结一切可团结的迅速稳定政局，虽说那些中间派绅士墨客与我们如同平行线一般爱答不理，但只要以本该到来对民主的幻梦及我们的老对头达维拉将军的独断暴行晓之以情，动之以理，那些民主派别很快便会热情的加入我们整齐划一的队形。毕竟他们没得选，不是吗？"
CHL_expel_san_diago_garrison:0 "调离圣地亚哥驻军"
CHL_expel_san_diago_garrison_desc:0 "在我等积极团结进步势力之时，达维拉大帅也于暗处从中密谋。在察觉我们的行动后陆军方面已有明显异常措施，但他察觉的太晚了，等到雄狮有所反应之际，我们早已将其大部报以缴匪助农之名赴往荒郊野岭，如今只需在与其达成表面上的虚伪妥协，以无关紧要的让步换取其嫡系部队的“精诚协作”，胜利的曙光已近在眼前了。"
CHL_establish_popular_front:0 "组建人民阵线"
CHL_establish_popular_front_desc:0 "决胜准备之际，该彻底整肃我们这番力量以面对最终终局，面对我们这自下而上吸纳了一切反对派的派系正是人民阵线的最好诠释。应以人民阵线命名并团结这些分散又意见不一的支持者们，团结一致方能战胜来犯之敌。"
CHL_choose_davila:0 "为了国家"
CHL_choose_davila_desc:0 "在社会主义政权风雨飘摇之际，老对头空军元帅和那些可笑的激进左翼为国家做了什么实事？在我等为国颤颤兢兢，尽忠效力之时，这该死的蛆虫却在暗处默不作声暗中啃食着立国之本。该一绝后患了。稳定高于一切，今日是，明日亦是。"
CHL_50_act:0 "颁布第50号法令"
CHL_50_act_desc:0 "骰子已经掷出，颠覆分子的暗中密谋却还在照常继续，不能让这种恶习继续持续下去了——颁布一部新的国家安全法便是个不错的选择，将解释权牢牢握于我等之手，组建由陆军主导的维和部队，颠覆分子们便再无可乘之机。"
CHL_coceat_support:0 "与柯卡特结盟"
CHL_coceat_support_desc:0 "柯卡特，全名为反无神论与叛徒军官委员会。在格洛维将军意识到我们的举措，积极与党内左翼及同民主同情者结盟后我们也应调转航向，放弃就有对左翼势力的安抚与拉拢，转向与党内那些郁郁不得志的精忠爱国之士结为手足，而柯卡特组织便是不二之选，依据大帅对陆军的掌控力谈拢不在话下，又可使陆军进一步效忠，何乐而不为呢？"
CHL_crackdown_on_union:0 "镇压工会罢工"
CHL_crackdown_on_union_desc:0 "罢工，什么罢工？值此风雨飘摇之际，那些罢工者们不但不体谅国家与国企，竟在开战前夕妄图争取那一点可怜的个人私利而扰乱国家生产，不就是实业家们欠了几个月铜子吗？最终我们仁慈的大帅决定自掏腰包，先垫上工人们一个月薪水，但如若反抗，休怪我大帅不义。立刻派遣士兵盖以军警之名入驻那些冥顽不灵的工厂加急复工复产，并将那些密谋破坏国家稳定的秘密结社以叛国罪一网打尽。咱工人要替国家想，我不上岗谁上岗？"
CHL_disband_department_of_defence:0 "解散国防部"
CHL_disband_department_of_defence_desc:0 "在这社会主义之国中，士兵无疑是各阶级中最先进，最具革命性的群体。难道革命军人们对长官的极高服从性，对国家的极端热爱忠诚，军旅生涯的纪律性和历经战火的教育不能胜过那些下班胡作非为，上工睡眼惺忪，毫无付出精神和爱国忠义之心的迂腐之辈吗？现实已向我们证明了军人不但有成为先锋队之责，更能成为最具革命性的阶级。正因如此，应当立即促进兵士们对政府的影响力，将那些无能的文官全部送去盖橡皮图章了。军人阶级必须领导一切！"
CHL_restore_political_police:0 "重建政治警察"
CHL_restore_political_police_desc:0 "忠诚不绝对就是绝对不忠诚，在经历了一系列改革后，如今若非绝对支持我等便将彻底倒戈至空天将军一侧，为其为虎作帐。虽说如此，但其对党羽的控制力因吸纳过多反对派而脆弱不堪。正是凭借陆军绝对优势，组建政治警察稍微敲打一下。便能使他那些仅有有限忠诚的走狗张开嘴巴，将密谋情报等如诉苦般倾倒而出。"
CHL_arrest_Benitez:0 "逮捕贝尼特斯"
CHL_arrest_Benitez_desc:0 "…………说着他把石子奋力向上一掷。很快就见空中一架飞机突然爆发出耀眼的强光，然后就坠落下来。“这是美军的间谍飞机，他们一直在圣地亚哥上空盘旋，与叛徒格洛韦一同侵犯我们的主权，我已经忍了很久了。”达维拉愤愤地说。军人同志们都鼓起掌来，为祖国有这样的领导人感到自豪……\n\n虽说内部解释原委为此，但凭最后结果连同美国战机与手持机密资料泄密的格罗韦二把手贝尼特斯便人赃并获，一道打入地牢严加审讯，党内同志们也只能半信半疑的信了。"
CHL_soup_stations:0 "开设施粥处"
CHL_soup_stations_desc:0 "虽说社会主义政权早已建成，但经济上的严峻形势始终如同噩梦一般牢牢箍住祖国，贫困率居高不下的同时，卑微的国民经济更是几乎陷入停滞。但大敌当前怎可自乱阵脚？如今我国内忧外患，千疮百孔，愚蠢的理想主义者伙同外国间谍正妄图推翻我们伟大的社会主义祖国。无从下手只能先开设施粥处，多活一个是一个算了。"
CHL_normal_day_in_san_diago:0 "圣地亚哥普通的一天"
CHL_normal_day_in_san_diago_desc:0 "朝日方升，圣地亚哥又迎来了新的一天。\n\n这一天里，各派摒弃前嫌，精诚协作，工会不再号召工人响应，兵士的铁蹄不再于城中肆虐，激进分子们不在街头巷尾窃窃私语，实业家们无形的皮鞭似乎也挥得乏了些，街头巷尾又恢复了往日的欢声笑语，哪怕是政府冷漠的办事员们僵硬的面庞上也似乎带了几分温情。\n\n总而言之，一切都很好……除了明天"
CHL_dual_regime_bop:0 "摇摇欲坠的双头政权"
CHL_dual_regime_davila_power:0 "达维拉派"
CHL_dual_regime_grove_power:0 "格罗韦派"
