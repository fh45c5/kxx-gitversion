 chl.dem.1.t: "重启旧《居留法》"
 chl.dem.1.d: "1918年颁布的《居留法》法的初衷是为维护公共秩序的必要立法，该法的诞生与第一次世界大战末期智利国内尖锐的社会矛盾密不可分，风起云涌的劳工运动和无政府主义思潮让寡头统治集团深感不安，他们将社会动荡简单归咎于外来“颠覆分子”的煽动，因此，这部法律的核心设计异常直白且宽泛：它授予行政机关无需经过繁琐司法程序的专断权力，可以直接下令驱逐任何被认定为“不良分子”或“不受欢迎”的外国人，并可预先禁止类似人员入境。法律以极其模糊的措辞界定了打击目标，将那些在海外有犯罪记录者、在智利缺乏正当谋生手段者，以及任何鼓吹以暴力手段进行社会或政治变革的人，一概纳入“不良”范畴，这几乎为当局随意解释和扩大打击面敞开了便利之门。\n随着经济民族主义抬头和种族偏见加深，该法的模糊条款也可被系统性地用于针对华人移民。以华人“无正当职业”“无法证明有足够资金维持生计”或威胁社会卫生等牵强借口，拒绝其入境或直接将其驱逐，从而使《居留法》成为排华浪潮中最主要的合法工具。从法律技术层面看，它还将资金证明这一门槛固化为先例，规定入境者需证明拥有至少维持六个月生活的资产，从而为经济筛选和拒斥贫困移民奠定了基础。\n《居留法》远不止于纸上条文，它所树立的行政随意裁量、反对外来思想、以抽象威胁为由抹除个体权利的治理模式，在智利历史上留下了深刻烙印。但也有人担心这会人国家治理从欢迎外来建设者转向民族主义排外，从而引发不必要的社会动乱。"
 chl.dem.1.a: "失败的尝试不能再一次绑架新政府te"
 chl.dem.1.b: "从经济发展的视角这个是有益于其发展的工具，但在政治上需要慎重考量"
 chl.dem.1.c: "其失败的原因是其落实不力，而我们不会再犯前人的错误"
 
 chl.dem.2.t: "人民阵线的领袖"
 chl.dem.2.d: "人民阵线已成功得以延续，如今我们必须确定这一统一战线的最高掌舵者。人民阵线由四大核心政党联合组建而成：智利共产党、工人联合会、智利社会党以及激进党。曾几何时，智利共产党奉行孤立政策，拒绝与其他党派合作，但在右翼势力的猛烈冲击下，不得不转变策略，与社会党携手组建了人民阵线；为此，共产党经历了深刻的内部改组，目前由深受各界爱戴的“团结诗人”巴勃罗·聂鲁达担任领导人。工人联合会作为智利国内影响力最大的工团主义组织，自然责无旁贷地加入了人民阵线。智利社会党则由萨尔瓦多·阿连德同志领导，他是人民阵线当之无愧的创始者。至于激进党，其高层佩德罗·阿吉雷·塞尔达因一贯主张与其他左翼势力密切合作，自然而然地引领着激进党融入了这一进步洪流。"
 chl.dem.2.a: "共产党！"
 chl.dem.2.b: "工人联合会！"
 chl.dem.2.c: "社会党！"
 chl.dem.2.e: "激进党！"
 
 chl.dem.3.t: "选战"
 chl.dem.3.d: "智利民主制度的这场“换血”，注定不会是一场平静的进化。它充满争论、甚至偶尔会有倒退，但这恰恰说明了这套制度的生命力。\n\n在即将到来的选举中，谁能闪闪发光？或许并不是某一个特定的政治明星，而是那种敢于在不确定性中寻找确定性、在激进理想中植入理性根基的政治勇气。\n\n当新一代的智利青年走进投票站，他们手里握着的不仅是选票，更是对一个更公平、更现代、更具包容性的国家的期许。无论最后是谁胜出，只要这种“新鲜血液”持续流动，智利的民主理想就永远不会暗淡。"
 chl.dem.3.a: "激进党再一次获胜"
 chl.dem.3.b: "自由党在选战中优势尽展"
 chl.dem.3.c: "基督教民主党继承前保守党的意志斩获头筹"
 chl.dem.3.e: "国家党作为选战中的黑马爆出冷门"
 chl.dem.3.f: "保守党再一次获胜"
 chl.dem.3.g: "人民阵线再一次回归智利的政治舞台"
 
 chl.dem.4.t: "激进党总统候选人"
 chl.dem.4.d: "智利民主后的第二次大选已经结束，激进党以惊人的支持率赢得的胜利，现在激进党需要敲定党的领袖，目前党内有几位主要人选备受关注：其一是温和派的佩德罗·阿吉雷·塞尔达，他善于团结各方，被视作能够凝聚共识的调和者；其二是经验丰富的胡安·埃斯特万·蒙特罗，虽然政治资历深厚，却在民众中声誉存疑，不少人质疑其亲和力与公众形象；而加夫列尔·冈萨雷斯·魏地拉，一名共济会成员，政治立场灵活难测，既与共产党所代表的左翼力量保持联系，也不排斥同右翼团体接触，堪称一名难以捉摸的政治两面派。"
 
 chl.dem.5.t: "自由党总统候选人"
 chl.dem.5.d: "智利民主后的第二次大选已经结束，自由党以惊人的支持率赢得的胜利，现在自由党需要敲定党的领袖，目前党内几位主要竞争者的形象与立场已逐渐清晰：爱德华多·亚历山德里代表着党内保守自由派势力，支持推进国家工业化，政治抱负显著，被视作一位具有战略眼光的实力派人物。古斯塔沃·罗斯凭借其化解经济危机的卓越能力，赢得“金融奇才”的美誉，在党内外均享有较高声望，是广受民众欢迎的政治领袖。埃米利亚诺·菲格罗斯·拉腊因作为中右翼的团结旗手，虽秉持坚定的民主信念，却在政治判断上屡受质疑，被认为缺乏长远的战略眼光；而豪尔赫·冈萨雷斯·冯·马雷斯作为自由党的新面孔，他是一个坚定的民族主义支持者，曾经是智利国家社会主义运动的创立者，然而屡遭打击最终解散了运动加入了自由党，他希望以法团主义将国家改造成一个温和民族主义的自由国度。"
 chl.dem.5.a: "爱德华多·亚历山德里！"
 chl.dem.5.b: "埃米利亚诺·菲格罗斯·拉腊因！"
 chl.dem.5.c: "豪尔赫·冈萨雷斯·冯·马雷斯！"

 chl.dem.6.t: "大选日的灾难"
 chl.dem.6.d: "随着新版《居留法》补充条款的强制执行，数以万计的二代、三代华人移民被剥夺了投票权，甚至面临“即刻遣返”的威胁。这项被称为“排外法案巅峰”的法律，成为了压死骆驼的最后一根稻草。在奥希金斯大街的尽头，武装民兵的红袖标在阴影中若隐若现。\n当现任政府的直升机飞越拉莫内达宫上空时，第一声爆炸从中央车站区的投票点传出。精确的战术爆破让选区计票进程被彻底打乱。\n\n智利华人自卫民兵利用其在各个行业的深厚积淀，迅速切断了政府军的指挥链路。与此同时，长期蛰伏在南方的抵抗力量在城市边缘响应，火光在贫民窟与工业区交界处升起。\n\n华人民兵提供了精良的装备，而赤色抵抗力量则贡献了丰富的山地与城市游击经验。在圣地亚哥金融区，华人店主们拉下了卷闸门，但这不再是为了躲避暴乱，而是为了向民兵提供补给和医疗掩护。\n\n大选本该结束的时刻，总统府的大门被一辆改装的重型卡车撞开。政府军的防线在内外夹击之下迅速瓦解。智利的国旗依然在飘扬，但旗杆下站立的人群已截然不同。大选日的民主进程彻底的终结了，而街道上的篝火映照着新老面孔的重叠。"
 chl.dem.6.a: "花儿凋谢了……"



#new
CHL_home_of_south_american_syndicalism_false:0 "“南美洲工团主义之乡”？"
CHL_home_of_south_american_syndicalism_false_desc:0 "作为南美洲首个工团主义国家，智利的特殊地位吸引了各地革命者前往圣地亚哥“朝圣”。这种影响力直接鼓舞了不堪压迫的巴塔哥尼亚工人，他们揭竿而起，成功脱离阿根廷。然而，这袭革命的红袍之下究竟隐藏着什么，也只有我们自己知道了"
CHL_dual_regime:0 "双头政权"
CHL_dual_regime_desc:0 "“智利社会主义共和国”的远比表面所见更为复杂。在许多人眼中，普加将军是国家的最高领导人，然而真正的实权派却隐藏在台面之下。两位理念相左的将军在幕后主导着智利的革命方向。格罗韦将军作为一名较为坚定的社会主义者，主张推行更为民主、开放的路线；而达维拉将军则倾向于务实稳健的治国策略，强调政权稳固与执行力。两人之间的理念分歧，逐渐演化为一场不见硝烟的暗斗，这场阴影中的战争正撕裂着智利的政治。"
CHL_reaction_return:0 "反动派回潮"
CHL_reaction_return_desc:0 "“智利社会主义共和国”成立的第一件事便是内斗，无休止的内斗给了那些躲在暗处的豺狼野狗机会。民主派无时无刻不再为夺回国家而做准备，而更加疯狂的民粹团体正等待着一个时机，还有那些觊觎权力的将军们。智利怎么办，只有天知道......"
CHL_economic_disaster:0 "失败的经济改革"
CHL_economic_disaster_desc:0 "智利工团政权在建立初期曾怀有宏大的改革理想。将军们以强硬手段大力推行工团化政策，然而这些措施并未如预期般促进经济健康发展，反而催生了一批新兴垄断寡头。国家经济命脉在革命的名义下，被军方高层牢牢掌控。这场彻底失败的经济改革，最终将国家推向更加深刻的危机之中。"
CHL_syndicalism_without_syndie:0 "工团主义，名不副实"
CHL_syndicalism_without_syndie_desc:0 "尽管民众对我们所坚持的“工团主义”方向已生出疑虑，甚至出现了批判我们偏离工团主义本质的声音，但值得庆幸的是，大多数群众仍暂时选择信任我们。眼下，接连失败的改革正使政权根基产生动摇，我们迫切需要一场胜利——一场宏大的、不容置疑的胜利，来证明我们工团主义制度的优越性与正确性。"
