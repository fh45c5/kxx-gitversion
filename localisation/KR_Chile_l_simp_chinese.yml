CHL_we_lose:0 "玩球子蛋了"
CHL_we_lose_desc:0 "他妈的玩球子蛋了。我们把整个智利的前途命运押在了南锥体战争上，押注的时候就像一位赌徒觉得自己手里攥着一把好牌，开牌的时候才发现全是局。阿根廷人现在正在布宜诺斯艾利斯的街头庆祝什么巴塔哥尼亚收复，让他们庆祝去吧……每一杯庆功酒都是往我们脸上泼的泔水。国内的反对派闻着血腥味就全冒出来了，一群在将死之兽上空盘旋的秃鹫！军政府内部那摊烂事我们甚至还没顾上收拾——输掉一场战争已经够糟了，输掉之后还要面对自己人开始互相捅刀子的丑态，这比输掉战争本身更恶心，多么让人想把整个圣地亚哥一把火烧了……\n耻辱已经不足以形容现在的情形，现在我们连耻辱的重量都感觉不到了，只剩下空荡荡的无力。\n回天乏术。"
CHL_YAY_YOU_WON:0 "§R现政权大权得保。§!"
CHL_LOL_TFR_REFERENCE:0 "§R智利将再次迎来政权更迭。§!"
chile.1.t:0 "决胜时刻"
chile.1.d:0 "智利革命军政府的表面团结已彻底瓦解。帷幕被无情撕开，马默杜克·格罗韦与卡洛斯·达维拉间的权力之争已公开化并趋于白热化。名义上的领袖、宪法总统阿图罗·普加将军，此刻暴露其虚弱姿态，只能在两位强人的风暴中心无力旁观。革命的狂热逐渐冷却，取而代之的是席卷全境的纷争与愈演愈烈的街头暴力。尖锐的冲突正在撕裂这个国家，派系间的裂痕已将圣地亚哥笼罩在不安的阴影之下。\n\n在这决定智利命运的十字路口，军官团的忠诚已不再统一。士兵们的枪口转向了何方？秩序正在崩塌，而我们——这支军队乃至整个国家未来的关键力量——必须做出选择：我们将跟随哪一方踏入这未知的深渊？"
chile.1.a:0 "格罗韦没有错，革命军政府一直站在人民的一方"
chile.1.b:0 "卡洛斯·达维拉一直是个可靠的军人"
chile.2.t:0 "革命者的凯旋？"
chile.2.d:0 "硝烟与对峙的尘埃正缓缓落定。卡洛斯·达维拉将军，格罗韦昔日激进的同僚和最主要的对手，最终未能在权力的悬崖边站稳脚跟。他选择了悄然离去，留下象征性的权力真空——这真空转瞬即逝，迅速被胜利者全然填补。\n\n马默杜克·格罗韦将军，这位革命精神更具公众亲和力的化身，如今无可争议地屹立于革命军政府权力的顶峰。圣地亚哥的街道上，曾经被派系冲突模糊的革命赤色旗帜重新昂扬招展。在民众热切的目光和士兵忠诚的枪刺环绕下，格罗韦发出了新的宣言：他将终结内部倾轧，指引国家回归那场推翻旧秩序的革命所怀抱的理想与目标——那曾被权力斗争短暂遮蔽的初心。\n\n此刻，革命的脉搏再次随着将军的号令强劲跳动。但这崭新的团结，能否真正转化为建设一个崭新、更公正智利的力量？将军的承诺正等待一场更为艰巨的考验。"
chile.2.a:0 "真正的考验已然来临"
chile.3.t:0 "权力的余烬"
chile.3.d:0 "圣地亚哥的枪声渐息，留下刺鼻的硝烟与权力的废墟。一场短暂却残酷的“矫正”风暴席卷了革命军政府的核心。卡洛斯·达维拉将军，凭借着更为冷酷的决心和手中紧握的军事力量，悍然清除了马默杜克·格罗韦及其追随者的势力。曾经革命同志的理想主义呼声，已被铁腕下的威权命令取代，他们或遭监禁，或被迫噤声流亡。\n\n如今，达维拉将军独步于权力的顶峰。革命军政府被彻底改组，军营取代了辩论厅成为决策之源。革命的喧嚣被一种严厉的秩序取代，一种以牺牲议会与人民代表的“幼稚幻想”换取的“效率”与“纪律”统治术正在被强加给这个疲惫的国家。\n\n街头仍飘扬着革命的旗帜，但所有人都知道那不再是真正的革命，革命不再是关于平等社会的热烈辩论，而成了单一意志下的绝对控制。胜利者站在寂静的广场上，脚下的阴影拖得很长。暴风雨结束了，但智利的未来——在这位铁腕将军及其亲信军团划定的道路上——究竟是浴火重生，抑或堕入深渊？"
chile.3.a:0 "而未来又在哪？在这冰冷的晨曦里..."
chile.4.t:0 "智利邀请我们一同对抗阿根廷"
chile.4.d:0 "智利方面主动释放合作信号，提议与我方共同应对阿根廷极端民族主义势力的扩张行径，这恰为我们提供了雪洗三国同盟战争历史旧耻的战略契机，于情于理皆值得积极回应。"
chile.4.a:0 "为四国同盟战争复仇！"
chile.4.b:0 "还是算了吧"
chile.5.t:0 "巴拉圭同意了！"
chile.5.d:0 "巴拉圭已同意与我们并肩协作，共同应对阿根廷极端势力。由其在我方北方边境对阿方极端武装实施牵制性袭扰，如此一来，我方夺取南锥体战争胜利的把握便更增几分。"
chile.5.a:0 "让我们一同前进！"
chile.6.t:0 "巴拉圭拒绝了！"
chile.6.d:0 "巴拉圭终究还是收起了并肩的承诺，明明白白将我们推上了独自迎敌的境地。如今阿根廷的铁蹄声已碾至边境，我们只剩孤军直面这场蓄势已久的攻势。"
chile.6.a:0 "该死......"
chile.7.t:0 "智利同我们交好"
chile.7.d:0 "智利主动提议与我方签署互不侵犯条约，声称当放下历史仇怨。对方明言，若我方应下这纸约定，便可允许共同开发塔克纳资源——尽管那片土地历史上本属我国。只是智利至今仍是地区强权，与之贸然交恶恐于我不利。眼下态势，似乎唯有与智利修好一途。可国内民族主义情绪正沸反盈天，民众要求收复失地的声浪从未停歇。这般困局，我们究竟该如何抉择？"
chile.7.a:0 "友谊万岁！"
chile.7.b:0 "智利，不可信任。"
chile.8.t:0 "秘鲁签订互不侵犯条约"
chile.8.d:0 "秘鲁已同意与我方签署互不侵犯条约。有这份约章兜底，再加国际社会的监督制衡，他们绝无胆量轻易撕毁；既不敢对我轻举妄动，玻利维亚自然也会暂敛对我国领土的觊觎。如此一来，我国北境压力必将大幅缓解，可调遣主力部队挥师阿根廷前线，那些仰赖秘鲁、玻利维亚资助的准军事势力也将蛰伏一时。这般布局下，我方在南锥体战场的胜算便又添了几分。"
chile.8.a:0 "友谊万岁！"
chile.9.t:0 "秘鲁拒绝了提议！"
chile.9.d:0 "秘鲁断然拒绝与我方缓和关系，更公然重申塔克纳主权归属其所有，声称对该地区拥有无可争辩的主权，无需我方置喙。与此同时，玻利维亚亦显露重获出海口的动向。局势至此，我方不得不分兵布防，以应对两国或有的进犯。眼下唯赖组建爱国民兵聊解国防燃眉之急，而胜利曙光，依旧笼罩在重重迷雾之中。"
chile.9.a:0 "果然是一群豺狼......"
chile.10.t:0 "登台亮相"
chile.10.d:0 "国家行动的错误行径让外国势力攫取了过多权柄，加拿大、奥地利、德国、美利坚宪政国等势力扶植的政治集团联手窃据了智利政权。如今这片土地已陷身于异邦统治的阴影下，那些代理人此刻正为争夺统治权展开暗斗。智利的命运早已脱离我们的掌控，余下能做的，唯有静候那些"宗主"给出最终裁决。"
chile.10.a:0 "汉森与沙文主义复兴"
chile.10.b:0 "马泰与民族农业社会"
chile.10.c:0 "贵族爱德华兹铁腕统治"
chile.10.e:0 "传统白人霸权势不可挡"
chile.11.t:0 "柯卡特紧急会议"
chile.11.d:0 "卡洛斯·达维拉这废物的终于被一脚踹进了历史的臭水沟里了，连同他那套愚蠢透顶的伪社会主义谎言，全被埋进了南锥体的废墟里，南锥体战争的溃败该算在他头上！这懦夫还想脚底抹油逃之夭夭？做梦！我们爱国的铁血军队早把他锁进了囚笼，很快就能以叛国通敌的罪名押上审判席，让这废物蠢货在人民的唾骂里烂透！\n\n如今反无神论与叛徒军官委员会的权柄已如钢铁般稳固，我们这些铲除毒瘤的人，明天就约民粹主义的弟兄们坐下来谈谈该由谁来执掌这新生的秩序？是时候给那些跪舔旧政权的蛆虫们立立规矩了，新世界的权杖，只能握在真正愿为国家刮骨疗毒的人手里！"
chile.11.a:0 "马雷斯与国家社会主义运动！"
chile.11.b:0 "国家行动巩固了统治！"
chile.11.c:0 "国家秩序阵线与雅利安人崛起！"
chile.11.e:0 "会议陷入僵局！国家进入混乱状态"
chile.11.f:0 "让我们看看我们的西班牙派同志"
chile.12.t:0 "党之方向"
chile.12.d:0 "豪尔赫·冈萨雷斯·冯·马雷斯始终是个优柔寡断之辈。顽固的老党员们骂他民族主义立场绵软，没能绷紧智利民族主义的脊梁，生生逼得许多坚守民族主义路线的老同志脱离了国家社会主义运动，党内曾经的理论台柱卡洛斯·凯勒便是其中之一，如今他已转投国家行动。另一边，新兴的激进派党员又戳他脊梁骨，说他社会主义成色不足，满身"资产阶级的软弱与虚伪"。更让他难堪的是，当有机会远渡重洋与欧洲大理论家们共签极权宪章时，他偏要留在智利放弃这等机遇，结果又掀一轮党员出走潮。如今，这骑墙者终于到了必须站队的时刻：今日，非得在民族主义与社会主义之间，选一条道走到黑不可。"
chile.12.a:0 "维持现状就好"
chile.12.b:0 "追随宪章极权主义"
chile.13.t:0 "大获全胜"
chile.13.d:0 "果然不出所料，阿根廷根本招架不住我们的攻势！我们与巴塔哥尼亚的同志并肩作战，将红旗牢牢插上了布宜诺斯艾利斯的土地。现在，巴塔哥尼亚的同志们已经接过政权，一个崭新的社会主义阿根廷就此诞生！我们“智利社会主义共和国”的威望也随之冲上顶峰，再没有人敢质疑我们工团主义道路的正确性。\n\n智利街头处处是欢庆的人群，胜利的欢呼响彻天空。南美各地的社会主义者也为之振奋，他们热切期盼着我们像解放阿根廷一样，为他们带去曙光，接下来各地的动荡势必进一步加剧，而我们终于可以喘一口气了。无论如何，为我们辉煌的胜利放声高歌吧！社会主义的洪流，已势不可挡！"
chile.13.a:0 "万岁，社会主义的智利！"
chile.14.t:0 "凄惨落幕"
chile.14.d:0 "我们严重误判了阿根廷的实力。原以为他们不过是条奄奄一息的野狗，轻轻一击就会彻底崩溃。可我们忘了，即便步入黄昏的霸主，也终究是霸主。我们根本挡不住阿根廷军队推进的步伐，他们的炮火甚至已经砸向圣地亚哥。巴塔哥尼亚的同志们遭到无情碾压，我们亲手建立的社会主义政权在他们眼前崩塌。如今战火蔓延到本土，阿根廷人长驱直入，我们只剩下一条路——投降，无条件投降。接下来会发生什么，我们无力阻止，只能眼睁睁看着社会主义政权彻底瓦解，一切归于混沌……"
chile.14.a:0 "完了！"
chile.15.t:0 "叛乱者在行动"
chile.15.d:0 "我们早就嗅到政变的气息，却没料到它会来得这样迅猛、这样彻底，叛徒竟出自我们最信赖的军队！这些背弃誓言的豺狼！我们曾如此信任那些军官，以为能在动荡中倚仗他们稳住政权，谁知他们非但不援手，反而亲手将局势推向深渊。如今我们手中可用的，只剩首都寥寥的警备军，根本无力抵挡叛军的铁蹄。我们已经错得太多了，不能再眼睁睁看着更多年轻的生命消耗在这场自相残杀的闹剧中。快收拾行装，趁现在撤离吧！一旦落入那群杀红了眼的政变者手中，只有死路一条。\n\n智利社会主义共和国在风雨飘摇中挣扎了一年多，此刻终于……迎来了它的终局。"
chile.15.a:0 "社会主义去死！"
chile.16.t:0 "抗议者要求恢复民主"
chile.16.d:0 "巴托洛梅·布兰切将军发动政变才过去没多久，连代理总统的位子都还没坐热，全国各地就接连爆发抗议，要求他立即下台、恢复民主体制。各地相继进入戒严状态，不再听从布兰切的指挥。他们放话：除非布兰切解散军政府，否则绝不解除戒严。布兰切手中兵力有限，根本斗不过那些在政坛混迹多年的老狐狸。眼看局势失控，军政府已经做好了解散的准备。眼下最后一步，就是把圣地亚哥当地的大法官请出来，由他宣布恢复智利共和国宪法，同时废除智利社会主义共和国时期制定的各项法律。"
chile.16.a:0 "他们要民主，我就给他们民主"
chile.17.t:0 "军政府解散后的智利共和国第一届民主选举"
chile.17.d:0 "军政府依照巴托洛梅·布兰切的承诺正式解散。各地行政官原本以为他还会再挣扎一番，甚至已做好长期对抗的准备，没料到他竟如此干脆。不过这样也好，民主之路上的最后一块绊脚石，总算被布兰切将军自己亲手搬开。接下来，就该重新恢复被智利社会主义共和国废除的大选了。此次参选政党包括激进党、自由党、保守党等主要势力，另有一些无足轻重的小党。当前要务，是鼓励智利民众积极参与投票，迎接久违的选举。"
chile.17.a:0 "激进党！"
chile.17.b:0 "自由党！"
chile.17.c:0 "保守党！"
chile.18.t:0 "人民阵线"
chile.18.d:0 "大选失利后，激进党不得不调整竞选策略。他们找到了智利社会党主席萨尔瓦多·阿连德，几轮谈判下来，两党携手组成了“人民阵线”选举联盟，此外还吸纳了一些共产党成员与工团主义者加入。看上去，他们已经为下一场选举做足了准备。只希望这个联盟别在关键时刻自己闹内讧——毕竟几方理念差异不小，能不能长久合得来还真不好说。不过至少在选前，表面上的团结应该还是能维持住的吧。"
chile.18.a:0 "有趣"
chile.19.t:0 "自由党的新面孔"
chile.19.d:0 "豪尔赫·冈萨雷斯·冯·马雷斯发现，自己在智利这片重回民主的土地上，已经失去了所有支持。民众不再需要他们这些准军事组织去推翻智利社会主义共和国，因为巴托洛梅·布兰切将军早已将其扫进了历史的垃圾堆。心灰意冷之下，豪尔赫只得解散了早已人员零落的“国家社会主义运动”，带着所剩无几的支持者集体加入了自由党，企图改头换面，指望在下一场大选中以自由党之名角逐总统宝座。"
chile.19.a:0 "看起来国社运已经以一种别样的方式重生了"
chile.20.t:0 "工人保险基金大屠杀"
chile.20.d:0 "豪尔赫·冈萨雷斯·冯·马雷斯绝不容忍自己倾注心血所维系的政党走向覆灭。早在巴托洛梅·布兰切将军发动政变之前，他便已暗中训练起一支只听命于他个人的准军事部队：那些被理想蛊惑的青年武装分子，甘愿为“事业”奉献一切。起事前夕，奥兰多·拉托雷、马里奥·佩雷斯与里卡多·怀特等骨干成员在冯·马雷斯的授意下，同奥斯卡·希门尼斯·皮诺切特会晤并取得其支持。冯·马雷斯意图联合所有民粹主义团体，共同起事推翻智利民选总统阿图罗·亚历山德里·帕尔马。这一计划迅速获得国家社会主义运动、国家行动、国家秩序阵线、国家长枪党、智利天主教大学行会运动、国家工团主义革命阵线及若干激进保守主义团体的响应。\n\n起事当日，武装分子率先攻占工人保险基金大楼，并以此为据点构筑防线；另有一部控制圣地亚哥多处警察局与消防局。一股激进分子甚至突入政府大楼，却遭警卫猛烈还击，多数被歼，残部仓皇逃至工人保险基金大楼汇合。阿图罗·亚历山德里·帕尔马政府迅速反应，调动宪兵队并获军队火炮支援承诺。战斗伊始，驻守大楼的武装分子率先开火，击毙一名谈判代表与一名宪兵，致五人受伤。宪兵队立即还击，五分钟内便击毙五名袭击者。\n\n随之而来的是长达两日的血腥围攻。宪兵队以密集火力压制窗口射击点，而武装分子仅凭简陋步枪与狂热意志抵抗，战线迅速沦为一边倒的屠杀。次日黄昏，军方调来的野战炮被推至前线，炮口直指大楼主体。首轮炮击即摧毁三层外墙，混凝土块与人体残肢四处飞溅；第二轮齐射引发内部连环爆炸，火光吞没顶层。残存武装分子退守地下室，却在第三轮炮火下被彻底埋葬。工人保险基金大楼最终化为一片废墟，所有抵抗者皆被歼灭。与此同时，城内其余据点的武装分子也陆续被肃清。事败后，主谋豪尔赫·冈萨雷斯·冯·马雷斯与奥斯卡·希门尼斯·皮诺切特相继被捕，将以叛国罪受审。此次动乱共有163名宪兵阵亡，2名军官殉国；根据叛乱者的供词一共有450名武装分子参与了战斗，423名被击毙，27人被逮捕。"
chile.20.a:0 "右翼们的末日来临了......"
chile.21.t:0 "柯卡特紧急会议"
chile.21.d:0 "卡洛斯·达维拉这废物的终于被一脚踹进了历史的臭水沟里了，连同他那套愚蠢透顶的伪社会主义谎言，全被埋进了南锥体的废墟里，南锥体战争的溃败该算在他头上！这懦夫还想脚底抹油逃之夭夭？做梦！我们爱国的铁血军队早把他锁进了囚笼，很快就能以叛国通敌的罪名押上审判席，让这废物蠢货在人民的唾骂里烂透！\n\n如今反无神论与叛徒军官委员会的权柄已如钢铁般稳固，我们这些铲除毒瘤的人，明天就约民粹主义的弟兄们坐下来谈谈该由谁来执掌这新生的秩序？是时候给那些跪舔旧政权的蛆虫们立立规矩了，新世界的权杖，只能握在真正愿为国家刮骨疗毒的人手里！"
chile.21.a:0 "国家长枪党！"
chile.21.b:0 "天主教大学行会运动！"
chile.21.c:0 "国家工团主义革命阵线！"
chile.21.e:0 "看看我们激进的保守主义同志们"
chile.22.t:0 "柯卡特紧急会议"
chile.22.d:0 "卡洛斯·达维拉这废物的终于被一脚踹进了历史的臭水沟里了，连同他那套愚蠢透顶的伪社会主义谎言，全被埋进了南锥体的废墟里，南锥体战争的溃败该算在他头上！这懦夫还想脚底抹油逃之夭夭？做梦！我们爱国的铁血军队早把他锁进了囚笼，很快就能以叛国通敌的罪名押上审判席，让这废物蠢货在人民的唾骂里烂透！\n\n如今反无神论与叛徒军官委员会的权柄已如钢铁般稳固，我们这些铲除毒瘤的人，明天就约民粹主义的弟兄们坐下来谈谈该由谁来执掌这新生的秩序？是时候给那些跪舔旧政权的蛆虫们立立规矩了，新世界的权杖，只能握在真正愿为国家刮骨疗毒的人手里！"
chile.22.a:0 "农业工党！"
chile.22.b:0 "国家复兴党！"
chile.22.c:0 "自由民主中心！"
chile.22.e:0 "回到上上份提议"
chile.23.t:0 "皮诺切特政变"
chile.23.d:0 "当右翼势力的争论陷入僵局、国家滑向无序深渊之际，一支仍坚守社会主义理想的军队在奥古斯托·皮诺切特上校的率领下朝圣地亚哥挺进。右翼集团从未料到，自己竟会以同样遭到政变的方式被推翻。宪兵队未作抵抗，便向起义部队交出武器。很快，皮诺切特的部队控制了除政府大楼外圣地亚哥的所有要害机构，外界的通讯线路也被切断，使“反无神论与叛徒军官委员会”成员陷入孤立无援的境地，即便他们反应过来，求援也已无门。在肃清政府大楼守军后，政变军队迅速逮捕了这批人。此刻，智利的命运已落入奥古斯托·皮诺切特上校手中，社会主义共和国再度迎来重生。而上校将选择还政于左翼，还是大权独揽？一切仍是未知。"
chile.23.a:0 "社会主义共和国万岁！"
chile.24.t:0 "有力舵手引领革命"
chile.24.d:0 "奥古斯托·皮诺切特将军早已看透：那些自诩为左翼的人，不过是披着一层虚伪的外衣。他们立场摇摆、信念薄弱，根本是一群不可信赖的乌合之众。所幸，皮诺切特将军英明决断、意志如钢，他不会再倚仗任何不可靠的势力，智利社会主义共和国的前途，将由他一人执舵前行，直到一切稳定。他将追随西蒙·彼得留拉的足迹，为智利迎来真正的社会主义黎明。在皮诺切特将军光芒的照耀下，一切反动派无所遁形；在他强有力的掌控中，所有罪恶终将被彻底扼杀。智利人，为我们永恒的领袖：奥古斯托·皮诺切特将军，高声欢呼吧！"
chile.24.a:0 "我们的将军，皮诺切特！"
chile.25.t:0 "社会主义共和国的民主黎明"
chile.25.d:0 "随着局势逐步稳定，奥古斯托·皮诺切特将军的临时政府使命也临近完成。在各项筹备工作妥善落实后，智利将迎来一场真正的社会主义民主选举。整个过程将在皮诺切特将军与忠于社会主义理想的军队监督下进行，确保民主程序的公正与透明。这亦是将军为智利社会主义共和国政治体制所做的最后一项贡献。此后，他将继续在军队中承担重要职责，守护智利祖国与社会主义政权的安全与未来。"
chile.25.a:0 "激进农业社会主义长枪党！"
chile.25.b:0 "人民社会主义先锋队！"
chile.25.c:0 "马普切协会！"
chile.25.e:0 "智利工人联合会！"
chile.26.t:0 "更多的援助"
chile.26.d:0 "我们的军事顾问很实在。他们准备直接请他们的祖国再派一支军官代表团过来，帮我们稳固内部统治，还能协助策划对外战争。有这些专业军官的加入，今后打仗肯定会顺利得多。他们还主动提出给一些援助，允许我们引进毛瑟、保时捷这类公司，并且鼓励外国企业来智利投资。这对我们来说完全是稳赚不赔的买卖，怎么看都是好事一桩，哪有不接的道理？"
chile.26.a:0 "当然，这正是我们所需要的！"
chile.26.b:0 "还是算了吧，有点危险......"
chile.27.t:0 "军事顾问施加影响"
chile.27.d:0 "军事顾问手似乎伸得有点太长了。他们派来的军官代表团，最近和我们国内的公民往来异常频繁，甚至有人发现他们跟本地的一些准军事组织也有接触。更值得警惕的是，部分企业招人时几乎只录用自己人。种种迹象让人不得不怀疑，他们背后是不是在谋划什么。我们是不是该出面警告一下，让他们别越过界线？毕竟这样下去太危险了。可话说回来，一旦挑明，我们恐怕也承受不起他们的怒火……"
chile.27.a:0 "别想那么多了"
chile.27.b:0 "警告一下他们"
chile.28.t:0 "军事顾问指导我们的政治"
chile.28.d:0 "军事顾问现在把触角伸向我们的政治领域！他们认为我们推行的“保守革命”已经偏离了他们眼中的“正统路线”，还警告说一步走错、满盘皆输。他们提出，只要让他们的保守革命理论家来“指导”一下，就能帮我们回归“正轨”，到时候智利实现复兴，战胜阿根廷自然不在话下。如果任由他们插手，我们的自主性何在？颜面何存？但坦白说，我们真的还能反抗吗？"
chile.28.a:0 "全完了"
chile.29.t:0 "达维拉，还是伊瓦涅斯？"
chile.29.d:0 "卡洛斯·达维拉始终是卡洛斯·伊瓦涅斯·德尔·坎波的坚定追随者。即便在他成为智利社会主义共和国的最高主宰者之后，这份拥护也未曾动摇。甫一上台，他便亲自前去面见伊瓦涅斯，恳请对方执掌智利大局。然而伊瓦涅斯只是婉言相拒。于是，达维拉独自一人，将智利社会主义共和国塑造成他心目中的形态。南锥体战争结束后，他的威望抵达巅峰。此刻，他清楚地意识到：智利没有伊瓦涅斯又如何？何苦再困于过去的执念。在他最艰难的时刻，伊瓦涅斯也并未现身。今日的智利，可以没有伊瓦涅斯，却绝不能失去达维拉。也许是时候做出决断了。可潜意识中，他仍渴望将政权交还到伊瓦涅斯手中。达维拉，正立于命运的十字路口。"
chile.29.a:0 "达维拉继续执政！"
chile.29.b:0 "权力归于伊瓦涅斯！"
chile.30.t:0 "社会主义民主凯旋"
chile.30.d:0 "在南锥体战争取得辉煌胜利后，马默杜克·格罗韦的声望抵达了前所未有的顶点。此刻，他终于能够着手实现毕生所追求的社会主义民主理想。智利各大工会、社会党与共产党等左翼力量紧密团结在格罗韦周围，智利社会主义共和国的民主进程已势不可挡。对于支持者，他论功行赏、毫不吝惜；对于反对者，他也胸怀宽恕、不予追究。如今，马默杜克·格罗韦已做好万全准备，即将全面开启社会主义民主的伟大实践。"
chile.30.a:0 "新公共行动！"
chile.30.b:0 "智利中央工会！"
chile.30.c:0 "智利社会党！"
chile.30.e:0 "智利地区工人联合会！"
chile.30.f:0 "智利共产党！"
chile.30.g:0 "世界产业工人联盟！"
chile.31.t:0 "激进党总统候选人"
chile.31.d:0 "智利恢复民主后的首次大选日渐临近，激进党也到了必须敲定总统提名人的关键时刻。目前党内有几位主要人选备受关注：其一是温和派的佩德罗·阿吉雷·塞尔达，他善于团结各方，被视作能够凝聚共识的调和者；其二是经验丰富的胡安·埃斯特万·蒙特罗，虽然政治资历深厚，却在民众中声誉存疑，不少人质疑其亲和力与公众形象；而加夫列尔·冈萨雷斯·魏地拉，一名共济会成员，政治立场灵活难测，既与共产党所代表的左翼力量保持联系，也不排斥同右翼团体接触，堪称一名难以捉摸的政治两面派。"
chile.31.a:0 "佩德罗·阿吉雷·塞尔达！"
chile.31.b:0 "胡安·埃斯特万·蒙特罗！"
chile.31.c:0 "加夫列尔·冈萨雷斯·魏地拉！"
chile.32.t:0 "自由党总统候选人"
chile.32.d:0 "智利恢复民主后的首次大选日益临近，自由党也到了必须推举出一位总统候选人的关键阶段。目前党内几位主要竞争者的形象与立场已逐渐清晰：阿图罗·亚历山德里·帕尔马以铁腕政治风格著称，虽自诩为亲近工人阶级的政治人物，却曾有过运用行政权力干预选举的争议记录。他明确反对军人干政，并主张对自由放任的经济模式加以约束。爱德华多·亚历山德里则代表党内保守自由派势力，支持推进国家工业化，政治抱负显著，被视作一位具有战略眼光的实力派人物。古斯塔沃·罗斯凭借其化解经济危机的卓越能力，赢得“金融奇才”的美誉，在党内外均享有较高声望，是广受民众欢迎的政治领袖。埃米利亚诺·菲格罗斯·拉腊因作为中右翼的团结旗手，虽秉持坚定的民主信念，却在政治判断上屡受质疑，被认为缺乏长远的战略眼光。"
chile.32.a:0 "阿图罗·亚历山德里·帕尔马！"
chile.32.b:0 "爱德华多·亚历山德里！"
chile.32.c:0 "古斯塔沃·罗斯！"
chile.32.e:0 "埃米利亚诺·菲格罗斯·拉腊因！"
chile.33.t:0 "保守党总统候选人"
chile.33.d:0 "智利即将迎来恢复民主后的首次大选，保守党也面临推举总统候选人的关键抉择。目前党内有两位主要人选备受关注：其一为爱德华多·科鲁兹-科克，天主教信徒，原为生物学教授，被誉为智利公共卫生体系的重要奠基人，以其学术背景与务实形象在知识界和民众中颇具声望。另一位是赫克托·罗德里格斯·德拉索塔，坚定的保守派政治家，在推动宪法秩序恢复过程中发挥了重要作用，被视为党内传统价值的捍卫者和体制重建的功臣。"
chile.33.a:0 "德华多·科鲁兹-科克！"
chile.33.b:0 "赫克托·罗德里格斯·德拉索塔！"
chile.34.t:0 "保守主义的终点"
chile.34.d:0 "即便最乐观的保守党成员也不得不承认，智利保守党已经走到了尽头。上一次大选的失利带来沉重一击，迫使党内重新调整策略，然而一切努力终究无济于事。长达数年间，保守党未能吸纳任何新成员，反而不断有党员选择退党，或另立新团，或转投他处。财政上的入不敷出更是将政党推向绝境，使其面临不可避免的解体命运。\n\n在爱德华多·科鲁兹-科克的倡议下，保守党残存力量与极右翼的国家长枪党达成合并。新成立的基督教民主党将承接保守党原有的政治生态，继续在智利政坛中寻求定位。这一合并不仅象征传统保守力量的体制性重组，也标志着右翼阵营进入新的整合阶段。保守党成立80余年，终究还是轰然倒塌。曾经的辉煌与延续数代的政治影响，在现实的重压下画上句点。而基督教民主党能否在多变的政治局势中延续其精神遗产，仍有待未来的检验。"
chile.34.a:0 "他们有改变吗？"
chile.35.t:0 "父与子"
chile.35.d:0 "西班牙，这个名字对我们而言曾是远在天边的枷锁。从他们手中赢得独立，不过是一百多年前的事情，可许多国人看待西班牙的情感，早已不是对仇敌的恨，反倒像望向一位遥远而疏离的血亲，它孤零零地悬在海外，像一颗早已冷却的星。那个曾被称为“日不落”的太阳帝国，早已碎裂成一片片无法重圆的旧梦。我们一面为挣脱它而欢呼自由，一面却也在某些深夜里，默默哀悼着那轮沉落夕阳的余晖。连曾经誓死抵抗的马普切人，以及无数美洲原住民的鲜血，也早已在数百年民族的交融中，流进了我们共同的脉搏。血海深仇被时间稀释成模糊的传说，只剩下若有若无的亲缘，如风中之絮，抓不住，也挥不去。\n\n可这，就代表我们遗忘了历史么？不，恰恰相反。近三百年的殖民史，像一柄未曾拔出的尖刀，始终插在祖国的脊梁上。它无时无刻不在提醒着我们：一旦再度沦为那“太阳”的一部分，将是怎样的命运。那些被我们潜意识认作“血亲”的人，他们的祖先曾对我们祖先所做的一切，应当令我们保持敬畏，但更应当激起我们坚决的反对，必须敲碎它的獠牙，斩断它的利爪。\n\n然而，大多数国人早已选择了遗忘。他们不愿，甚至恐惧去揭开这道结痂的伤疤，生怕心目中那个被浪漫化的、完美的太阳帝国幻影会轰然倒塌，生怕那看似牢固的西裔拉丁团结，会露出底层深刻的裂痕。我们渴望团结，却不敢正视团结之下埋葬的真相；我们呼唤认同，却害怕看清认同背后斑驳的血色。我们该怎么办？是继续用沉默去维系这脆弱的亲缘幻象，还是勇敢地去清洗那从未真正愈合的伤口？也许答案不在今天，而在未来一代人的记忆与选择里。而如今，我们只是站在历史的十字路口，被过去的光与影同时拉扯，进退两难。前路何往，恐怕，也只有天知道了。"
chile.35.a:0 "西裔必须团结，我们终将迎来重生"
chile.35.b:0 "梦该醒了，即使梦境之外是一地鸡毛"
chile.36.t:0 "豺狼与恶犬"
chile.36.d:0 "老实说，我们能够维持独立，很大程度上是拜战争所赐。第一次世界大战的硝烟曾让南美洲短暂喘了一口气；而当德意志帝国的铁蹄踏平欧陆，盎格鲁–扬基势力不得不从拉美抽身之际，我们曾以为德国人是伟大的解放者，是照亮南美自由之路的曙光。可谁又能想到，这不过是换了一个主子罢了。看看中美洲、委内瑞拉、哥伦比亚——我们的同胞们，哪一个不是被德国人紧紧攥在手心？经济、军队，样样受其操纵。表面上是独立国家，骨子里早已成了德意志帝国的海外附庸。而我们自己呢？大批德裔移民不断涌入，不断挤压着我们本族的生存空间。不止是德裔，还有战乱中逃难而来的盎撒人、扬基人……他们随随便便一场抗议，就足以让我们心惊胆战，生怕触怒柏林那头巨兽，连这点脆弱的独立地位也被一举剥夺。\n\n我们不过是个提线木偶，随着德意志帝国的指挥棒起舞，看人脸色，仰人鼻息。历任总统不是没有尝试过扭转局面，可结果呢？无一不是徒劳。那些外来势力资助的准军事组织、政治团体，像毒蛇一样潜伏在国土之内，时不时就冒出来制造动荡。更有人公开叫嚣，要彻底瓦解我们这个民族国家。这群豺狼，正一口一口撕咬我们的血肉，非要吸干最后一滴血才肯罢休。西班牙恶犬走了，却来了更加凶狠的豺狼。我们的前路究竟在何方？若是玻利瓦尔与圣马丁看到我们今天这般模样，恐怕也只能在历史的彼岸摇头叹息吧。"
chile.36.a:0 "我们不能因一时的热血去触怒这些大国，至少我们表面还是独立的"
chile.36.b:0 "总有一天，玻利瓦尔与圣马丁会再次踏上征途"
chile.37.t:0 "旭日之轮"
chile.37.d:0 "近些年来，日本在国际社会上的种种举动，确实引起了我们的高度关注。他们不遗余力地鼓吹所谓“东亚共荣”的理论，并将这种论调不断向英、法、德控制下的殖民地传播。在许多受压迫的群体眼中，日本仿佛成了一轮能够驱散殖民阴霾的“太阳”，不少人真的相信，日本人会为他们带来自由与尊严。日本也趁机加大对各地抵抗组织的资助力度，出钱出枪，塑造自身“救世主”的形象。时间一长，“有色人种的解放者”这个称号，就在被压迫民族中传开了——甚至连远在美国的黑人群体中，也有声音将日本视为希望的象征。\n\n我们拉丁美洲一向对外来移民持开放态度，日本人也借此机会大量迁居拉美各国。如今，不论是在巴西、秘鲁，还是在我们国家，日本移民社区规模可观，影响力不容忽视。更令人担忧的是，日本人那套极具迷惑性的宣传，不仅让他们自我陶醉，甚至也打动了不少居住在此的华人后裔。这些人中，有的家族史上还是南美太平洋战争中的英雄后代，本应与我们有共同的历史记忆与立场。可眼下，他们当中却有人开始真心相信日本是来“解放”他们的。\n\n这种局面让我们陷入深深的矛盾。一方面，我们不是没有听过日军在朝鲜等地的暴行。从那些侥幸逃出的朝鲜难民口中，我们得知日本军队在占领区犯下过多起残忍的屠杀，其行径与其所宣扬的“共荣”完全背道而驰。他们口中的“解放”，背后往往是镇压与剥削。但另一方面，我们自己也处在历史的十字路口。我们要走的自由之路，不可能单凭一腔热血就能走通，必须寻找外部的依托。日本——这个野心勃勃但实力尚未成熟的东方国家，看上去似乎是一个可以利用的跳板。它的欲望远远超过它当下的力量，而这恰恰可能为我们所用。"
chile.37.a:0 "亲近日本百利而无一害，只要我们加以防范就不会重蹈覆辙"
chile.37.b:0 "去他妈的，他们只想杀了我们的人，然后抢走我们的土地！"
chile.38.t:0 "援助联合工团"
chile.38.d:0 "一箱箱武器弹药整齐码放在圣地亚哥的货轮甲板之上，它们即将远渡重洋，驶向美利坚联合工团，去支援那场如火如荼的工人解放事业。尽管国内外反动势力必将对这场美利坚革命进行百般阻挠与绞杀，但我们坚信正义终将战胜邪恶，最终的胜利必定属于我们。胜利女神历来垂青于正义之师，智利无产阶级与美利坚无产阶级血脉相连、亲如兄弟，作为阶级兄弟，我们义不容辞地相互驰援。这不仅仅是为了我们各自的自由，更是为了让世界工人解放运动迈出关键一步，今日星火已在美洲点燃，明日必将形成燎原之势，照亮全世界！"
chile.38.a:0 "胜利属于无产阶级！"
chile.39.t:0 "一个大工会！"
chile.39.d:0 "世界产业工人联盟绝不会仅仅将目光局限于南美洲的弹丸之地，在这个世界上，仍有千千万万的工人兄弟正呻吟于反革命的残酷压迫之下。我们必须前进，必须更进一步！诚然，一个大工会或许能暂时为饱受迫害的无产阶级提供庇护之所，但我们深知，被动的庇护远不及主动的斗争来得有效。在争取自身权益的残酷斗争中，总需要有人挺身而出，去流血、去牺牲。我们甘愿做那只振臂一呼的领头羊，站出来为世界各地的受压迫者点燃希望的火种。时不我待，我们绝不能坐视反革命势力继续奴役工人阶级。我们要握紧手中的武器，更要唤醒那些仍在沉睡的工友，号召他们与我们并肩作战，共同推翻这腐朽的旧世界，去建设一个属于未来的光明乌托邦！即便死亡的阴影笼罩明日，但在今天，我们依然是捍卫自由、为全人类解放而战的无畏战士！"
chile.39.a:0 "光荣！"
chile.40.t:0 "智利希望与我们统一"
chile.40.d:0 "随着智利国内状态的稳定，智利政府向我们表达了联合的请求，虽然我们同属于社会主义阵营，但仍然有很多人担心此举会抹杀阿根廷人的独特性，部分持民族主义观点的委员对此表达了反对，而且智利国内也充满了令人担忧的民族主义氛围，这是一个值得讨论的事情，不过大部分委员都对此事表示同意，毕竟我们要携手去解放整个南美洲，巴塔哥尼亚和智利的联合将会是第一步。"
chile.40.a:0 "我们将与智利的同志站在一起"
chile.40.b:0 "阿根廷必须维持独立！"
chile.41.t:0 "智利向我们索要领土"
chile.41.d:0 "智利向我们发出了最后通牒，要求将我们所殖民的南美洲领地移交给他们。他们宣称这些土地是南美洲不可分割的一部分，并声称要彻底摧毁南美洲大陆上残留的殖民势力。如果我们不接受条件，他们表示不排除使用武力手段将这些土地夺走。如今我们的议院已经焦头烂额，我们究竟有没有必要为了这些弹丸之地同智利开战？"
chile.41.a:0 "交出去吧"
chile.41.b:0 "这绝无可能！"
chile.42.t:0 "社会党的新领袖"
chile.42.d:0 "智利社会党在上一次大选中取得了压倒性的胜利，我们成功在智利社会主义共和国取得了领导地位，但党内的分歧暂时还未得到完全解决，目前有三方势力在党内最为强大。萨尔瓦多·阿连德同志所代表的技术官僚派，主张通过技术官僚体系将智利逐步建设成平等的社会主义乌托邦，同时他们也与智利共产党、中央工会和工人联合会保持着一定的联系与交集；萨尔瓦多·阿连德同志希望将这些左翼力量联合起来，同国内外的反革命分子作坚决斗争。加布里埃拉·米斯特拉尔同志则更注重推动国内的社会主义教育与土著权利保障，主张采取温和手段逐步蚕食右翼的势力范围，直至将其彻底瓦解；与此同时，她倡导联合所有愿意合作的南美洲国家，共同推进一场新时代的南美洲解放事业，从而将欧洲、北美在南美洲设立的各种影子殖民机构彻底清除。而奥斯卡·施纳克同志强调必须重点解决智利国内的经济问题，认为只有让人民真正富裕起来，才能使他们切实体会到社会主义制度的优越性，这样他们自然会逐渐放弃对右翼的支持；此外，他还坚决要求同智利共产党和工团主义分子彻底划清界限，认为这些激进势力严重破坏了智利社会主义共和国的稳定。\n\n社会党中央委员会需要通过投票表决，从这三位人选中选出一位担任智利社会党的新一届领导人。"
chile.42.a:0 "阿连德同志一直是个很可靠的人"
chile.42.b:0 "阿尔卡亚同志带来团结"
chile.42.c:0 "斯卡纳同志会改善我们国内的困境"
chile.43.t:0 "尼加拉瓜的流亡者到来"
chile.43.d:0 "尼加拉瓜的社会主义政府被一场邪恶的军事政变彻底推翻，但值得庆幸的是，桑地诺同志并未落入反动派之手。如今，这些尼加拉瓜的革命者来到了智利，而我们作为拉丁美洲的工团主义传统深厚的国家，理应向这些英勇的革命者提供一席之地。等到时机成熟，我们将带领军队前去推翻那些霸占尼加拉瓜的寡头集团，将红旗重新插在这片土地之上。"
chile.43.a:0 "欢迎！"
chile.44.t:0 "工人联合会的分歧"
chile.44.d:0 "智利地区工人联合会最终仍走向了分裂，选举的大胜使得原本暂时团结的两派，因争夺智利社会主义共和国主席的职务而彻底走向了对立与对抗。伯纳多·伊巴涅斯·阿吉拉宣称，旧式的工团主义道路已完全不适合当下的智利，认为要推动智利走向复兴，在一定条件下与资本主义合作是可以接受的；与此同时，他还呼吁建立统一的总工会，以集中领导全国各地的工人运动。而欧内斯托·米兰达·里瓦斯及其激进派支持者则强烈反对伯纳多·伊巴涅斯·阿吉拉的主张，指责其修正主义倾向将工人联合会拖入了政党政治与国家主义的深渊。为此，他们强调必须严格实行地区工团自治，以分化中央权力。欧内斯托·米兰达·里瓦斯认为，与资本主义合作意味着妥协与背叛，革命必须不断自我净化，而资本主义终将成为下一个被彻底摧毁的目标。"
chile.44.a:0 "智利急需一场彻底的变革！"
chile.44.b:0 "支持阿奎拉同志的温和主义路线"
chile.45.t:0 "党的路线问题"
chile.45.d:0 "智利共产党内部向来存在分歧，与其说它是一个统一的党派，不如说是由各持己见的共产主义者组成的暂时性联盟，而这一联盟如今已走向终点。选举胜利的果实促使智利共产党必须确定接下来的总路线。加洛·冈萨雷斯·迪亚兹同志一直担任智利共产党主席，他是一位立场强硬的共产主义者，与俄罗斯布尔什维克保持联系并直接接受其指挥。他对党内的派系斗争深感不满，在任期内始终压制各派，使智利共产党未因宗派主义而彻底分裂。路易斯·科瓦兰同志虽不赞同加洛·冈萨雷斯·迪亚兹的强硬作风，但仍认可将马克思列宁主义作为党的总路线。他认为，尽管马克思列宁主义具有正确性，但也应吸取其在实践中的失败教训，从“红十月”的惨痛经历中逐步调整党的路线，以使革命走向稳定。路易斯·科瓦兰要求加快推进布尔什维克化，将隐藏的反动势力清除出社会主义共和国。而帕布罗·罗卡同志的设想则颇为独特。他受到《超现实主义宣言》的影响，将弗拉基米尔·列宁视为当代的耶稣，认为是上帝派来拯救人间的使者，因此所有人都必须沿列宁主义的道路前进。帕布罗·罗卡与维森特·维多夫罗交往甚密，并受到其“创造主义”思想的熏陶。卡洛斯·拉巴尔卡同志则与其导师列夫·托洛茨基一样不为人所喜，这位言辞激烈的“超革命者”呼吁实现合法化民主，宣称托洛茨基主义才是马克思主义的正统延伸。路易斯·埃米利奥·雷卡巴伦同志是一位务实的革命者，他认为共产主义者与工团主义者应放下分歧，指出以法兰西公社为代表的第三国际势力正不断壮大，其实行的工团主义制度已取得显著成效，值得借鉴；而智利本土的工团主义力量也相当强大，与其合作有百利而无一害。巴勃罗·聂鲁达同志代表党内的文化工作者，他强调言论自由与艺术自由十分必要，认为知识分子和艺术家的批评意见值得听取，因为他们更了解智利需要什么。他还指出，智利文化是宝贵的遗产，不能因推进布尔什维克化而将其抹杀，否则将丧失智利人的独特性。\n\n最终，谁将在这场角逐中胜出呢？"
chile.45.a:0 "继续实行加洛主席的强硬路线"
chile.45.b:0 "支持列宁主义正统道路"
chile.45.c:0 "罗卡同志的超现实主义方案"
chile.45.e:0 "拉巴尔卡同志重拾托洛茨基的遗志"
chile.45.f:0 "也许我们该和工团主义和解了"
chile.45.g:0 "文化工作者最清楚智利需要什么"
chile.46.t:0 "国家长枪党的下一步"
chile.46.d:0 "我们智利国家长枪党作为西班牙长枪党在智利的效仿者，自认为自己已经初步领悟了长枪主义的理念，但我们终究与西班牙长枪党有所不同。他们可以理想化地高呼消灭资本主义、消灭资产阶级议会制，而我们作为整个智利的领导者则需要考量更多的现实因素。我们需要争取那些民主分子和资本力量的支持，否则很难使这个刚刚脱离灾难的国家恢复稳定与秩序。然而这一切，真的符合我们内心的追求吗？我们同样怀有与西班牙长枪党一样的理想，不甘心仅仅充当资本与民主势力的傀儡。如今局势已趋于稳定，我们完全有可能同那些寡头势力公开决裂，彻底转向我们自己的道路。但领袖何塞·伊格纳西奥·帕尔马在决策上仍显摇摆不定，我们仍然需要为未来进行更审慎的谋划。"
chile.46.a:0 "社会主义？它永远不可能在智利复活了！"
chile.46.b:0 "就像那句歌词......资本主义去死！"
chile.47.t:0 "女权主义崛起"
chile.47.d:0 "随着时代不断向前发展，保守主义同样不能固步自封。社会主义女权主义吸引了大批女性为之奋斗，这些赤色分子要求我们赋予女性平等的权利。我们党内也存在一些持有女权主义观点的成员，玛丽亚·科雷亚·莫兰德女士赢得了大量女性公民的支持，目前她正在挑战塞尔吉奥·奥诺弗雷·哈尔帕的领导地位。她的保守女权主义立场值得我们加以利用——这不仅能分化社会主义者的力量，还能吸引更多女性支持我们的政府。与其坐等玛丽亚·科雷亚·莫兰德的势力壮大到足以与国家复兴党分庭抗礼，不如我们主动给予她一个位置，承认她的影响力，让她协助我们争取女性公民的支持。或者更进一步，让塞尔吉奥·奥诺弗雷·哈尔帕退居幕后，由这位玛丽亚女士来领导国家。智利出现第一位女性总统无疑将是一个极具吸引力的宣传点，这可以让我们在国际上赢得众多女权主义者的青睐与支持。不过，这一切还需看党内保守派元老的脸色才能最终决定。"
chile.47.a:0 "给她一个位置，但拒绝她出任总统"
chile.47.b:0 "当然！祝玛丽亚女士一路顺风！"
chile.48.t:0 "黄色工团主义？"
chile.48.d:0 "在大洋彼岸的法兰西，那里诞生了一种耐人寻味的意识形态——“黄色工团主义”。它虽然身处社会主义阵营，却在立场上明显偏向资本主义，主张以工会形式发声，强调捍卫无产阶级的价值观与权利，而非直接对抗雇主或其立场；它不仅不组织罢工，甚至协助雇主镇压革命行动，并以民族主义立场取代传统的阶级立场。我想我们正需要这样的理念。智利的工团主义者规模庞大，黄色工团主义的出现可以对他们进行逐步的分化与瓦解。我们可以借助黄色工团主义来逐渐消磨工人的斗争意志，使他们甘愿为我们所用。黄色工团主义在名义上仍可算作社会主义的一个发展分支，我们可以披上这层外衣，对外宣称自己是工团主义者，以此在国际上骗取那些对实情不甚了解的社会主义者的援助。而我们将要付出的代价，主要只是党内那些死硬的顽固分子——然而这些人目前却在党内占据相当一部分话语权。因此，若想在智利成功推行黄色工团主义，着实面临不小的困难。"
chile.48.a:0 "不错的提议"
chile.48.b:0 "这是不是有点社会主义了？"
chile.49.t:0 "德国人的要求"
chile.49.d:0 "德国人要求弗朗西斯科·哈维尔·迪亚斯·瓦尔达拉马下台，换由更加亲德的卡洛斯·凯勒上台。他们认为瓦尔达拉马毫无遮掩的智利民族主义损害了智利德裔群体的利益，并令其感到“恐慌”。德国方面的顾问向弗朗西斯科·哈维尔·迪亚斯·瓦尔达拉马表示，这只是一次暂时的妥协，他仍可以在幕后统治整个国家。然而，同意德国人的要求、让卡洛斯·凯勒上台，将意味着智利彻底沦为外国势力的提线木偶，届时势必引发更大的动荡。可是那些西方势力过于强大，以智利目前的国力而言，根本无力与其对抗。趁现在整个智利还掌握在我们手中，而外国势力要渗透进来尚需一段时间，我们完全可以反对这个决定。这些外国人势必会顾及可能引发的后果，从而暂时停止插手智利政务。"
chile.49.a:0 "他们的手伸的太长了，管好欧洲再说吧！"
chile.49.b:0 "我们斗不过这些德国人，答应他们的要求"
chile.50.t:0 "邀请军事顾问"
chile.50.d:0 "为了重建智利军队，政府已经决定从其他国家邀请军事顾问指导我们。智利素有南美普鲁士之称，瓦尔德拉马与凯勒都主张邀请德国军事顾问，但除此之外，我们还有其他选择。奥地利与协约国也正寻求在南美发展势力范围，邀请他们或许也是一个选项。最后但不是最不重要的是曾经的美国巨人，正忙于内战的美利坚宪政国不但与我们志趣相投，而且还可以教给我们军队新鲜的知识，但是他们不一定有空理我们。我们应当如何抉择？"
chile.50.a:0 "普鲁士精神正是我们所需要的"
chile.50.b:0 "奥地利人肯定懂得如何管理军队"
chile.50.c:0 "让英国人来试试"
chile.50.e:0 "美国人能教我们很多"
chile.51.t:0 "民主与独裁之间"
chile.51.d:0 "如今，奥古斯特·皮诺切特上校已经全面掌握了智利社会主义共和国的军政大权，那些曾经威胁国家稳定的右翼分子已被彻底肃清与消灭，而我们也终于可以静下心来，认真规划智利未来的发展方向。在当前局势下，多数左翼政治势力希望奥古斯特·皮诺切特上校能够顺应民意，开放一场真正意义上的民主选举，使智利社会主义共和国重新回归社会民主的正常轨道；然而，更多的人还是希望奥古斯特·皮诺切特上校能够继续作为整个国家的保护者，可以长期的继续带领智利社会主义共和国走向一个崭新的未来，因为相比那些只会空谈的社会民主势力，皮诺切特上校在处理实际政务与维护国家稳定方面要务实、果敢得多，即便他在某些人眼中被视为一个披着左翼外衣的考迪罗式人物，但这并不妨碍他成为当下智利最需要的坚强领导者。"
chile.51.a:0 "在皮诺切特上校的带领下走向真正的社会主义！"
chile.51.b:0 "皮诺切特上校承诺选举！"
chile.52.t:0 "长枪党下的民主"
chile.52.d:0 "激进农业社会主义长枪作为国家长枪党在国家针对右翼势力的严厉打击之下发生分裂后所形成的左翼产物，其整体实力远远不及智利社会党、智利共产党这些传统左翼势力。但很明显，奥古斯特·皮诺切特上校对智利社会党和智利共产党持有明显的疏远态度，他不愿意将政治权力分享给这些传统左翼阵营，相反，他对一些带有左翼色彩的右翼组织以及另类工团主义者抱有明显的好感。因此，作为其中一个典型例子，激进农业社会主义长枪积极参与了民主选举，并以惊人的优势取得了最终的胜利。重组之后的激进农业社会主义长枪与许多旧政治势力进行了合并，这使得我们党内成分变得更加多元，因此我们还需要举行一场内部选举，以最终确定我们政党的领导人选。"
chile.52.a:0 "奥斯卡·施纳克！"
chile.52.b:0 "加布里埃尔·魏地拉！"
chile.52.c:0 "埃瓦尔多·克莱因·多尔纳！"
chile.52.e:0 "何塞·伊格纳西奥·帕尔马！"
chile.52.f:0 "卡洛斯·伊瓦涅斯·德尔·坎波！"
chile.53.t:0 "国王还是共和？"
chile.53.d:0 "我们终于驱逐了那些来自欧洲大陆的白皮狗！这些远渡重洋而来的强盗再也无法将枷锁强加在自由的阿劳卡尼亚人身上了！如今，我们阿劳卡尼亚人彻底掌握了自己的命运，接下来需要确定我们未来的政体形式。一些保守的长老们希望重现阿劳卡尼亚王国昔日的荣光，因此他们主张加冕安托万三世——这位深受西方整合主义和国家工团主义熏陶的西化分子作为我们的新国王。但我们认为，阿劳卡尼亚人不需要一个君王凌驾于我们之上，我们本就是自由的民族，应当贯彻彻底的自由精神。因此，建立一个由各个部落联合而成的阿劳卡尼亚联邦将是一个更好的选择。"
chile.53.a:0 "没有国王我们一样生活！"
chile.53.b:0 "安托万三世万岁！"
chile.54.t:0 "和平谈判"
chile.54.d:0 "我们的巴塔哥尼亚同志在阿根廷反动派的猛烈打击下已经被彻底消灭了！这意味着我们几乎已经输掉了整场南锥体战争，如果继续进行战争的话，恐怕会引起国内民众的广泛不满。大多数人希望智利能够趁阿根廷刚刚收复巴塔哥尼亚、局势尚未稳定之际，主动向他们发出和平谈判的意愿，伤痕累累的阿根廷肯定会顾及我们残存的军事力量，同意与我们达成某种协议。然而，我们作为南美工团主义之乡，如果向反动派妥协，无疑会沉重打击整个拉丁美洲的社会主义革命运动，而我们南美工团主义之乡的名号也将变得更加名存实亡。与此同时，国内的右翼势力也会以此为借口，发动对我们的新一轮攻击。我们究竟要不要停止这场战争？"
chile.54.a:0 "我们的力量已经经不起这样损耗了......"
chile.54.b:0 "战斗到最后一刻！"
chile.55.t:0 "与阿根廷开战？"
chile.55.d:0 "令人遗憾的是，我们的巴塔哥尼亚同志们似乎并没有那么坚定地坚持革命理想。就在不久之前，阿根廷与巴塔哥尼亚达成了协议，双方实现了和平统一，阿根廷持续数年的分裂局面由此迎来了终结。从道义上讲，我们理应庆贺这来之不易的和平，但从情感与革命立场出发，我们实在心有不甘——我们曾为巴塔哥尼亚的独立与解放事业付出了多少牺牲，而现任阿根廷政府仅凭几句谈判之辞就将这片土地重新融回了阿根廷的版图，难道这不意味着我们先前所做的一切努力都付诸东流了吗？我们应当果断出兵，趁局势尚未完全稳定之际，将整个阿根廷彻底解放，将红旗重新插遍这片广袤的土地，即便没有巴塔哥尼亚的协助，我们也要独自完成解放阿根廷的使命。然而，以我们目前的力量，真的能够对抗一个重新统一后的阿根廷吗？这恐怕需要我们付出极其沉重的代价，而且我们国内的反对派们也绝不会让我们轻易得逞。"
chile.55.a:0 "把红旗插到布宜诺斯艾利斯去！"
chile.55.b:0 "我们无力与他们为敌"
chile.56.t:0 "解放者凯旋"
chile.56.d:0 "显然，我们对阿根廷的解放战争迎来了完美的结局。尽管阿根廷的反动政府拼尽全力抵挡革命军的进攻，但他们最终还是兵败如山倒，布宜诺斯艾利斯政府已经彻底垮台，阿根廷对其国内无产阶级的压迫已经永远结束了。正如当年圣马丁带领革命者推翻西班牙腐朽殖民帝国在南锥体的统治一样，我们这些新时代的革命者也成功推翻了一个压迫人民的反动政权。南美洲的一角已经被彻底染红，阿根廷的人民政权已经建立起来。如今，我们终于可以长舒一口气，国内那些反对的声音在这场辉煌的胜利面前被狂热的欢呼声彻底淹没。我们用实际行动证明了智利社会主义共和国工团政权的先进性，也确立了智利作为南美洲工团主义之乡不可动摇的地位。"
chile.56.a:0 "当代圣马丁！"
chile.57.t:0 "无能之辈"
chile.57.d:0 "完了，一切都彻底完了。我们对阿根廷的战争迎来了彻底的失败，我们的军队完全无法抵挡阿根廷的进攻，一路节节败退，巴塔哥尼亚已经彻底丢失了。我们的革命战争失败了，我们作为南锥体解放者的幻想彻底破灭了。好在阿根廷因为刚刚迎来统一，答应了与我们进行和平谈判。但这场战争的失利无疑对我们造成了毁灭性的打击，我们国内的反动势力与民主派、自由派们已经开始行动起来，民众对我们的不满已经达到了顶点，军队也不再听从我们的调遣，各州政府纷纷宣布叛乱，脱离了智利社会主义共和国的控制。如今我们所能掌控的只剩下首都圣地亚哥，而各方势力已经兵临城下。维持数年的智利社会主义共和国迎来了它的终点，智利将再一次陷入动荡……"
chile.57.a:0 "一切都是咎由自取罢了"
chile.58.t:0 "重现伟大帝国"
chile.58.d:0 "葡萄牙人，作为西班牙的敌人与伙伴，曾在托尔德西里亚斯条约中与西班牙瓜分了整个新大陆。1580年，我们曾短暂地成为一个整体，后来却又分道扬镳。如今，西班牙的旧政权已经被摧毁，来自新大陆的革命者将旗帜插在了马德里之上，暴虐的国王与自由派分子已经被彻底清扫出去，昔日伟大的西班牙殖民帝国重现于世。然而，我们并不满足于现有的领土，葡萄牙同样需要一场革命，一场伟大的革命，一场由我们主导的革命。葡萄牙将再次回到西班牙的手中，连同他们所创造的殖民帝国：巴西、安哥拉、莫桑比克……当然，我们也可以选择让他们在自己制造的灾难中自行沉没。葡萄牙人以无能著称，而且不仅仅局限于政治方面，他们既然无意踏上新时代的征程，那就让他们永世沉沦在旧帝国的荣光之中吧。"
chile.58.a:0 "拉丁人团结一致！"
chile.58.b:0 "让葡萄牙人在粪坑里自生自灭吧！"
chile.59.t:0 "苏维埃"
chile.59.d:0 "1917年11月7日，一场伟大的革命在彼得格勒爆发了。布尔什维克推翻了俄罗斯临时政府，建立了全俄罗斯苏维埃政府。然而，反动派们注定不会甘心，在德意志帝国与俄罗斯白军运动的联合绞杀之下，苏维埃政府最终被摧毁，亚历山大·克伦斯基重返彼得格勒。革命的导师弗拉基米尔·列宁在这场灾难中不幸遇难，其余布尔什维克成员四散逃亡，一部分人改头换面，留在俄罗斯共和国境内，或前往中亚与高加索地区的军阀割据地带；而大多数人则选择了流亡法兰西公社。当然，这些人绝不会坐以待毙，布尔什维克依然致力于推动世界各国的共产主义革命，而智利首当其冲地成为了他们重点关注的对象。我们的政党在这些流亡布尔什维克的指导与影响下，逐步成长壮大，最终成为智利的第一大党。如今，智利的共产主义政权已经成功建立，我们既可以继承布尔什维克的遗志，重新夺取俄罗斯的控制权，将其再次置于苏维埃政府的统治之下；当然，我们也可以选择走“一国建成社会主义”的道路，一切等时机成熟之后再作进一步打算，就让这些布尔什维克同志们暂且耐心等待吧。"
chile.59.a:0 "打回俄罗斯，重现红十月！"
chile.59.b:0 "我们需要一切以智利的发展为先"
chile.60.t:0 "雅利安黄金时代"
chile.60.d:0 "看看这个旧世界吧！到处都充斥着劣等人与堕落者。整个世界早已被所谓的“犹太灰人”暗中控制，他们寄生于各国的权力核心，构成了无处不在的“深层政府”，死死勒住人类社会方方面面的咽喉。曾经高贵的雅利安人，如今却遭到了犹太灰人残酷至极的严厉打压，不得不屈居于智利一隅苟延残喘——这无疑是一场文明史上的巨大悲剧！然而，黑夜即将过去。如今，我们终于接收到了来自外星纯净雅利安同胞的圣洁指引，并在冰封的南极大陆重新找回了我们失落已久的远古力量。现在，向犹太灰人以及潜伏在暗处的蜥蜴人们宣战的时刻已经到来！\n\n一场席卷全球的雅利安伟大复兴运动即将轰轰烈烈地展开，这注定会是一场洗涤灵魂的神圣复兴之战。我们将用烈火与战歌，彻底唤醒那些依旧在迷茫中沉沦的雅利安同胞。最后的决战已然临近，让那些虚伪的犹太灰人和蜥蜴人们，在高贵的雅利安种族无上的威能之下瑟瑟发抖吧！世界必将再度归于雅利安人之手。我们征服，我们前进！我们就是新纪元的开创者，我们誓为一切仍处于黑暗统治与压迫中的雅利安同胞而战！我们将彻底摧毁这个饱受道德灾难和血统杂交折磨的堕落旧秩序。我们即是世界的意志，我们即是无可阻挡的时代浪潮！"
chile.60.a:0 "新时代来临了！"
chile.60.b:0 "我还是更希望做一个正常人......"
chile.61.t:0 "伟大征途"
chile.61.d:0 "我们的领袖卡洛斯·达维拉将军始终致力于美洲大陆的解放事业。拉丁美洲遭受殖民统治的历史过于漫长，时至今日仍有不少人沉沦在对西班牙与葡萄牙殖民帝国的旧日迷思之中，幻想着有朝一日能重回伊比利亚半岛的统治之下。不可否认，这片土地上绝大多数居民皆为拉丁裔，其祖先确系来自伊比利亚半岛，但我们却一直是受压迫的一方。真正从殖民体系中攫取巨额利益的始终是那些高高在上的上层贵族老爷，而我们这些平民百姓，处境与当地土著一般无二，只能依靠出卖廉价劳动力为生。虽说名义上不是奴隶有别于那些土著，但生活的凄苦也并未好到哪里去。如今，伊比利亚半岛乃至整个欧陆的霸权主义幽灵仍在向拉丁美洲投射影响力，妄图开启新殖民时代。而在北美洲，情况更是惨不忍睹，这片土地至今仍处于某种变相的殖民状态之中，土著居民在盎格鲁-撒克逊殖民者长达数百年的残酷统治下人口十不存一。尽管美国后来脱离了不列颠的直接统治自称演变为洋基人或迪克西人，但其本质依旧是盎格鲁-撒克逊文化的延续，那种根深蒂固的殖民思维丝毫未变；至于加拿大就更不必多言，那些流亡至此的不列颠王室成员为了有朝一日能杀回欧陆，正牢牢掌控着这片冰冷的土地。作为整个美洲大陆当之无愧的反殖民先锋，智利理应挺身而出，去解放那些仍在水深火热中的国家，将整个美洲团结为一个坚实的整体，并以此反抗旧大陆的霸权压迫。"
chile.61.a:0 "吾辈之责，义不容辞！"
chile.61.b:0 "在此之前我们最好还是先掂量掂量自己的实力"
chile.62.t:0 "殖民者的末日"
chile.62.d:0 "我们国家的白人殖民者已被尽数驱逐，智利重新回到了阿劳卡尼亚人的掌控之中。整个南锥体的彻底解放也将在不久的将来成为现实，事实上，我们已经在这方面做出了不懈的努力。然而，放眼整个美洲大陆，殖民者的阴霾依旧在肆虐。这些高傲的外来者妄自尊大，幻想自己是这片大陆的主宰，并由此滋生出了形形色色的排他性民族主义。这些人最好别忘了，他们所谓的“独立”是建立在土著累累尸骸之上的。试问，印加帝国、阿兹特克帝国等那些辉煌灿烂的土著文明为何就此消散？这片土地早在远古时期就是我们土著居民的乐土，这些豺狼般的殖民者摧毁了我们的家园，使我们沦为奴隶，我们的同胞遭到无情屠戮，世代守护的土地被强行侵占。而那些殖民者却对此毫无愧疚之心，他们轻蔑地称我们为贱民，将我们驱赶到他们划定的贫瘠土著聚集区，严禁我们踏出这片囚笼一步。但这一切不公终将被彻底粉碎，他们种下的恶果终将由他们自己亲手咽下。我们将从南锥体出发，步步为营，逐步解放整个拉丁美洲，最后直刺帝国主义在美洲大陆的心脏——北美。我们要么让他们夹着尾巴灰溜溜地滚回欧罗巴，要么就用锋利的长矛让他们认清一个事实：究竟谁才是这片土地真正的主人。"
chile.62.a:0 "我们正是为解放而来"
chile.62.b:0 "最好还是先解决南锥体的困境"
chile.63.t:0 "蒲鲁东圈困局"
chile.63.d:0 "我们的君王安托万三世在法国旅行期间，深受蒲鲁东圈内两种新兴思潮的冲击：国家工团主义与整合主义。一战结束之后，法国的惨败促使巴黎爆发了剧烈的革命，安托万国王也随着内战的硝烟四处避难。在此期间，他亲眼见证了蒲鲁东圈的彻底分裂——乔治·瓦卢瓦与夏尔·莫拉斯分道扬镳。瓦卢瓦选择携手乔治·索雷尔留在公社，并由此组建了国家工团主义组织“共和工团党”，该党正是如今公社劳工总联合会中索雷尔派的前身；而夏尔·莫拉斯则追随旧政府流亡至阿尔及尔，在那里与他的追随者成立了“法兰西行动”。安托万国王并未随波逐流前往阿尔及尔，而是隐姓埋名，深入公社内部生活。在公社的这段岁月里，他受到了左翼浪潮的深刻影响，思想逐渐向左倾斜。尽管远在巴黎，但阿尔及尔那边兴起的君主社会主义运动同样对他产生了强烈的吸引力，当然，他也从未放弃整合主义的内核思想。随着在阿尔及尔与巴黎两地均有组织的“法兰西行动”迎来分裂，巴黎分部宣布脱离阿尔及尔的控制，成立“新法兰西行动”并选择彻底融入公社政治，安托万国王也积极参与到了这一进程中。如今，他将这两种交融的思想带回了智利，摆在面前的道路是：究竟是建立一个君主社会主义的新阿劳卡尼亚，还是拥抱社会整合主义的有机王国。"
chile.63.a:0 "支持君主社会主义运动"
chile.63.b:0 "支持新法兰西行动"
chile.64.t:0 "叛逆之地"
chile.64.d:0 "如今，我们已经替宗主国牢牢掌控了智利，那些意图叛乱的叛逆之徒已被我们悉数逮捕入狱，再也没有任何人胆敢忤逆我们的铁腕统治。眼见着智利局势已定，我们终于可以向万里之外的宗主们呈上这份治理成果了，近来已有源源不断的移民响应号召来到这片沃土。这一切表面上看起来欣欣向荣，但宗主国那反复无常的态度实在令我们忧心忡忡。他们时而对我们维持秩序的成果表示嘉许，时而又假惺惺地对我们的“殖民行为”表示厌恶，这种两面三刀的做法令人费解。这恐怕是某些暴徒正在国内捣乱，妄图扰乱祖国的政治安定。如今，越来越多流亡智利的民族主义分子，正企图以智利为据点打回祖国去，旨在清除自由派和社会主义者对祖国的威胁。但这一切实际上与我们的核心利益并无太大干系，我们只需要按时向祖国献上贡品，聊表我们的忠诚即可。无论他们对这些礼节是欣然接受还是表面厌恶，贸然掺和到政治斗争这种繁琐的事务中去，对我们而言绝非明智之举。我们只需要严格依照祖国下达的命令行事即可，无论掌权的是民族主义政府还是自由派政府。但难道我们就该这样坐视祖国被社会主义者和自由派逐步摧毁吗？我想，也许我们需要未雨绸缪，采取些许行动来阻止这场灾难的发生。"
chile.64.ger.yes:0 "德意志帝国千秋万代，别去管那些琐事了"
chile.64.ger.no:0 "我们绝对不能坐视德意志祖国被自由派摧毁！"
chile.64.aus.yes:0 "我们不必为双头鹰而担忧"
chile.64.aus.no:0 "社会主义者正在毁灭双头鹰，杀光他们！"
chile.64.can.yes:0 "不列颠向来如此，没什么好操心的"
chile.64.can.no:0 "不义之辈正裹挟着不列颠雄鹰！"
chile.64.cor.yes:0 "那里是白人世界的最后壁垒，没人能毁灭宪政国"
chile.64.cor.no:0 "犹太人正在毁灭白人至上主义，我们必须立刻出动！"
chile.65.t:0 "帝国之疆"
chile.65.d:0 "经过我们艰苦卓绝的努力，我们终于将德意志祖国从自由派势力和赤色分子的魔掌中解救了出来。然而，自由派政府留下的烂摊子简直是一场巨大的灾难，当我们向祖国进军之时，才发现他们早已丢掉了德意志帝国引以为傲的东部屏障。波罗的海沿岸、立陶宛、波兰、白俄罗斯乃至乌克兰，这些广袤的土地统统被拱手送给了俄罗斯巨熊，我们所掌握的领土仅剩下支离破碎的德意志本土。德意志帝国绝对不能就此沉沦，我们绝不能坐视俄罗斯吞噬我们的东方疆域。那片被称为“东墙”的地区，作为帝国防御斯拉夫蛮族的最后防线，必须重新回到我们的铁腕统治之下。而要夺回这一切，就必须同俄罗斯再次开战，用钢铁与鲜血迫使他们重新回到谈判桌前。我们始终铭记着建立大日耳曼国家的宏愿。反观奥地利人，他们偏安一隅，与异族混杂而居，竟厚颜无耻地自称为“小德意志人”；实际上，他们早已丧失了德意志人的英勇血性与尚武精神，沦为一具臃肿不堪的政治尸体，仅靠那个无能的哈布斯堡皇帝勉强维系着一个不合时宜的怪胎。至于丹麦人，则更加卑劣无耻，他们既不愿真正融入德意志大家庭，却又贪婪地妄图夺回石勒苏益格。不过，他们嚣张不了太久了。我们将实现历代德意志皇帝的夙愿，统一整个大德意志地区，将这些自神圣罗马帝国覆灭以来便分崩离析的日耳曼土地，重新锻造为一个坚不可摧的整体。"
chile.65.a:0 "帝国的盛世将会再次到来，奥地利也将会到德意志的怀抱"
chile.65.b:0 "就此收手吧，我们没有能力去开辟更广阔的疆土了"
chile.66.t:0 "双头鹰挺立于世"
chile.66.d:0 "我们已经将奥地利从堕落的深渊中彻底解救了出来，那个无能的哈布斯堡孽障再也无法禁锢奥地利雄鹰的翅膀了。诚然，他们曾经确实给奥地利带来过一时的强盛与繁荣，可惜这个为了所谓“血统纯净”而疯狂近亲结婚的畸形王朝，最终还是不可避免地走向了腐朽与堕落。为了彻底对抗哈布斯堡带来的道德沦丧与种族退化，我们必须将其连根拔起，彻底消灭。还有那些一向叛逆的帝国属地——匈牙利、波西米亚、克罗地亚等等，这些土地及其人民终将归于高贵的日耳曼人之手。帝国昔日对他们再三容忍，换来的却是他们变本加厉的背叛与分裂行径，而今我们将以铁拳粉碎这些叛乱分子的痴心妄想。现在我们仍有许多同胞深陷自由派的逆流之中，我们的德意志兄弟曾是日耳曼民族最坚硬的脊梁，他们本应富有古老雅利安人的精神，英勇而好战；如今却在自由主义毒素的侵蚀下逐渐萎靡堕落，丧失了德意志人特有的钢铁意志，变得软弱且愈发贪图安逸。我们必须去给他们重新带回旧日的荣光与精神，唤醒那些迷失的丹麦人、挪威人、瑞典人、荷兰人等等。我们必须将他们从现代自由主义的死亡漩涡中解救出来，我们将重新带来真正的道德与正义，日耳曼人终将团结为一，我们将会复兴神圣罗马帝国的无上荣光。"
chile.66.a:0 "日耳曼人终将崛起！"
chile.66.b:0 "抛开这些不切实际的幻想吧"
chile.67.t:0 "醒来，不列颠尼亚！"
chile.67.d:0 "经过我们的浴血奋战，不列颠尼亚终于重归我们的统治之下。那些信念动摇之辈曾信誓旦旦地断言，我们永远无法收复故土，但我们终究做到了！他们曾利用自由派政府裹挟流亡者，欺骗他们说永远回不了不列颠，但我们以实际行动粉碎了这一谎言。我们不仅彻底肃清了赤色匪患，还将那些软弱无能的自由派分子一网打尽。当然，这绝非终点，一个更为宏大的构想正在我们脑海中酝酿：组建一个整合了所有前不列颠帝国殖民地的大联邦，一个横跨欧、亚、非、美、澳五大洲，囊括了所有盎格鲁-撒克逊人阳光下土地的伟大帝国。诚然，要实现这一目标异常艰巨，我们不仅要同欧陆霸主德意志帝国兵戎相见，还必须将这些叛离的殖民地一一夺回。这些殖民地早已与我们离心离德，有的投靠了德意志一方，有的则彻底切断了与不列颠的联系，妄图走上独立自主的道路。摆在我们面前的只有一条路，那就是诉诸武力，迫使这些殖民地重新臣服。想当年，不列颠帝国鼎盛之时，这些土地对我们俯首帖耳、毕恭毕敬；可如今，不列颠仅仅沉沦了短短数年，它们便生出了叛逆之心。作为不列颠帝国正统的继承者，我们必须对这些地方发起再征服战争，迫使它们重归帝国的统治之下。"
chile.67.a:0 "日不落帝国将会重现于世"
chile.67.b:0 "真是个幼稚的想法"
chile.68.t:0 "无形帝国之边际"
chile.68.d:0 "尽管三K党自南北战争初创以来便始终植根于美国本土，但其为白人族群高举的“崇高”旗帜却早已跨越了本土四十八州的范畴，远渡太平洋彼岸。约翰·罗斯·泰勒领导的加拿大三K党，行事虽不如美国本土般激进暴烈，却也凭借与帝国统一党的紧密联盟，在北方悄然编织起自己的势力网络。虽然不少同仁乐见于我等之理念在真北之疆生根发芽，但仍对泰勒一派与天主教徒阿尔康的合作心存芥蒂。目前，加拿大三K党虽是我辈最大的国际盟友，但其绝非前无古人，更不会后无来者。早在二十世纪二十年代，我们便曾南下古巴，以“古巴三K党”之名谆谆告诫邻邦关于非裔古巴人的所谓“风险”，试图防范其效仿海地掀起暴乱——然而，我们的真诚话语被人当成了耳旁风，这一分部也于二十年代末销声匿迹。放眼北美之外，弗朗西斯·亚瑟·萨顿同“假腿”卡尼一道，于太平洋对岸的上海滩试图布道，虽然组织规模不及北美分毫，但其向愚昧蛮荒的东方传播盎撒“文明之光”的勇气着实令人侧目。上述三者虽堪称我等对外活动的代表，但海外拓疆之事迹实则贯穿了三K党的整个党史。1847年，那个因执迷不悟的帝国党人干预而被迫关停的斐济分部，以及二十年代我们在新西兰遭遇的残酷打压，便是其中的典型例证。\n\n以上种种，便引出了今日的严峻议题：是否要整编各个海外分部？自执掌美国政权后，借助海外网络扩张“无形帝国”疆域的呼声便日益高涨。不过，反对的声浪同样不容小觑。许多人斥其为“不计后果的冒进”，担忧大规模吸纳“异教徒与亚洲人”会“玷污国家的纯洁性”，并主张采取温和的外交策略以维系现有国际关系，认为这些失落之地不必让帝国大费周章地去夺回。这场关乎三K党未来走向的论战愈演愈烈，而最终的抉择落在了我们肩上：究竟是与海外同道仅维持简单的外交关系，还是在亚太地区竖起战旗，开创新的天地呢？"
chile.68.a:0 "白人帝国正在崛起"
chile.68.b:0 "让那些失落之地就此溺亡吧"
chile.69.t:0 "路线指南"
chile.69.d:0 "红线：选择格洛韦一方，赢得南锥体战争，然后可以选举新公共行动/IWW/智利中央工会/智利地区工人联合会/社会党/共产党。\n达维拉：选择达维拉一方，赢得南锥体战争。然后可以选择保留达维拉或者迎回伊瓦涅斯。\n民主线：选择格洛韦一方，输掉南锥体战争。然后可以选举激进党/自由党/保守党。\n第二次选举：若在第一次选举没有选择激进党，激进党会与共产党、社会党、中央工会组成人民阵线参与选举。\n若在第一次选举中没有选择自由党，国社运会与自由党合流。\n若在第一次选举中没有选择保守党，保守党会分裂为基督教民主党与国家党。\n右线：选择达维拉一方，输掉南锥体战争。然后可以选择国家行动/国社运/国家秩序阵线/国家工团主义革命运动/天主教大学行会运动/国家长枪党/国家复兴党/农业工党/自由民主中心。\n外国占领：进入国家行动线，完成国策邀请军事顾问团，然后在事件里分别接受援助，允许施加影响，军事顾问团就会政变，路线取决于军事顾问团的国籍。\n皮诺切特：进入右线，在科卡特选举中选择进入僵局，皮诺切特就会政变。随后可以选择恢复民主或是独裁，恢复民主可以选人社先锋队/智利工人联合会/激进农业社会主义长枪/马普切协会。"
chile.69.a:0 "建议截图保存"


 CHL_Reformed_syndicalism:0 "改良的工团主义"
 CHL_Reformed_syndicalism_desc:0 "我们走的道路要求我们用工会的力量在现有经济框架内为劳动者争取最大利益，同时一步一步地改变这个框架本身。改良的工团主义者并不幻想资本家会主动交出厂子，清楚地知道每一项权利都是靠罢工和谈判斗争的来的。这是一场需要耐心的持久战，而我们准备好打这场持久战了。"
 CHL_Expand_trade_union_organizations:0 "扩展工会组织"
 CHL_Expand_trade_union_organizations_desc:0 "战后经济动荡的阴影还未散去，通货膨胀和物资短缺仍在折磨着劳动者的日常生活。地方工会的应对之策绝不依赖中央政府的救济，决心主动出击：把还没有组织起来的行业拉进工会网络，车间和工地处处都有工人的代表机构。工会组织的拓展成为了抵抗经济动荡最有效的武器——组织起来的工人可以协调生产、调配物资、压制黑市，单打独斗的工人只能被市场洪流冲走。各地方工会已经在这项工作上积累了丰富的经验，现在我们只需扩大规模，让工会的触角伸进智利经济的每一个角落。"
 CHL_Revolutionary_syndicalism:0 "革命的工团主义"
 CHL_Revolutionary_syndicalism_desc:0 "改良主义幻想着可以在旧制度的废墟上修修补补勉强过活，但是真正的工团主义拒绝任何形式的妥协。国家机器要被彻底拆散；资本家要被赶出生产领域；教会要被连根拔起——革命的工团主义者相信解放只能在彻底的自由中实现，任何留有余地的妥协都是给敌人留下反扑的后门。革命不会温和地进行，作为一场战争的延续——一场劳动者对一切压迫者的全面战争。"
 CHL_Continue_the_Popular_Front:0 "延续人民阵线"
 CHL_Continue_the_Popular_Front_desc:0 "社会党不是独自战斗，人民阵线的传统在阿连德手中得到了全面的延续、恢复和扩展。激进派知识分子、工团主义者、合作社运动者、进步的自由派人士，所有愿意站在劳动者一边的政治力量都被纳入执政联盟的框架。人民阵线作为党的非附庸组织参与各方都能够保留自己的组织相对独立和政治主张，在重大立法和选举中协调。"
 CHL_Industrial_nationalization:0 "产业国有化"
 CHL_Industrial_nationalization_desc:0 "铜矿国有化，硝石国有化，铁路国有化，电力国有化，大型制造业企业国有化，一切收归国有。阿连德的国有化方案是智利历史上最激进的产权变革，核心产业被从外资和本国寡头手中剥离，原来的所有者获得的是大把的政府债券，而补偿的数额却是由政府单方面评估确定。华尔街和许多个华尔街大震，铜价期货剧烈跌荡，外资银行直接冻结了对智利的信贷额度。智利的地下矿藏属于智利人民，如果从前不是，那么现在开始是了。"
 CHL_Peoples_welfare:0 "人民福利"
 CHL_Peoples_welfare_desc:0 "医疗保障、养老保险、住房补贴、失业保险，撑起了一套覆盖全体公民的社会福利体系。社会党执政以来的各项福利政策被系统整合成一个完整的制度架构，不再零散地分属于不同部门和不同时期的临时法令。财政压力巨大，政府必须同时维持高额的福利开支和工业化投资，赤字风险像一把悬在头顶的剑。社会主义政权的合法性最终建立在对普通人的具体生活改善之上，福利制度是革命向劳动者兑现的承诺与祝福。"
 CHL_Universal_education:0 "全民教育"
 CHL_Universal_education_desc:0 "米斯特拉尔一生从事教育事业，她对教育的信念朴素而坚定：一个孩子能读书，他的人生就多了一扇通向光亮的门；一个国家的所有孩子都能读书，这个国家就没有任何困难能把它彻底压垮。全民教育计划覆盖从乡村小学到国立大学的全部层级，师范学校扩招，偏远地区设立寄宿制学校，工人夜校和农民识字班在全国铺开。教育经费占政府预算的比例被提到前所未有的高度，教育是这笔投资的回报是整个智利民族的未来。"
 CHL_Industrialization_process:0 "工业化进程"
 CHL_Industrialization_process_desc:0 "智利的经济结构过度依赖硝石和铜矿出口，这种单一资源型经济在国际市场波动面前脆弱得不堪一击。工业化进程的目标是建立门类相对齐全的本土工业体系，从纺织到机械制造，从食品加工到化工，凡是能在本土生产的就不再依赖进口。保护性关税、国家工业投资和技工培训三管齐下。这项工程注定需要跨越多个政治周期，在施纳克与阿尔卡亚两派的共识中，工业化超越了党内路线之争，是智利从资源殖民地走向现代国家的必经之路。"
 CHL_Production_Promotion_empresa:0 "生产促进公司"
 CHL_Production_Promotion_empresa_desc:0 "国家必须亲自下场抓生产，这是施纳克经济方案的核心。生产促进公司作为国有经济实体直接介入关键产业，从硝石开采到铜矿冶炼，从铁路运输到港口装卸，国家资本在这些领域里是绝对的操盘手。政府有能力调动全国资源，政府就应该自己干。"
 CHL_De_radicalization:0 "去激进主义化"
 CHL_De_radicalization_desc:0 "人民阵线时代留下来的那一套激进动员机制已经过时！这激越和丑陋的机器只会制造更多的政治对立和街头冲突。施纳克主张用去政党化来替代人民阵线的激进政治：把那些动辄上街示威的激进团体从政治决策中清理出去，用行政效率和技术理性取代无用的革命口号。不再扮演街头运动的组织者的社会党要化身那一台运转顺畅的执政机器。激进左翼在党内的残余力量遂被通过党内纪律处分边缘化，而路线辩论最终让位于行政命令。"
 CHL_Establish_a_federation_of_trade_unions:0 "建立总工会"
 CHL_Establish_a_federation_of_trade_unions_desc:0 "全国各地分散的地方工会和行业工会需要被整合进一个统一的全国性组织，那就是我们自己的总工会。这个总工会要为各地工会提供一个协调行动、共享资源、统一对外谈判的平台。过去那种各管各的局面在面对大资本家和跨国公司时显然被动而拘束，圣地亚哥的铁路工会和瓦尔帕莱索的码头工会如果各谈各的合同，谁都拿不到好条件，而总工会的成立就补上了这块短板，各个地方工会在保持自治权的同时终于有了一个可以信赖的全国性协调中枢。"
 CHL_Strengthen_the_power_of_the_congress:0 "扩大联合会权力"
 CHL_Strengthen_the_power_of_the_congress_desc:0 "在建立总工会之后，进一步扩大联合会在经济决策中的发言权就成了顺理成章的下一步。联合会应该直接参与制定产业政策、审查政府预算、监督国有企业的运营。我们要求的是实实在在的决策权，让工会代表坐进经济部的会议室，带来整个行业的生产数据、成本核算表与集体请愿书。经济权力的再分配是政治权力再分配的延续，联合会权力的扩大就是工人权力的扩大。"
 CHL_Defend_trade_union_independence:0 "保卫工会独立性"
 CHL_Defend_trade_union_independence_desc:0 "工会不能变成政党的附庸或政府的工具那样任何一个外部势力的延伸。在立场问题上我们坚硬如铁，工会是工人阶级自己的组织，工会领导人如果开始替政府说话、替政党传话，那他就应该被当场召回。什么国家给工会拨款？不要，工会自会筹钱。政府给工会发文件？不收，工会自要决定政策。独立性的保卫是一场永远不能松懈的战斗，因为收编工会的诱惑对任何政权来说都是巨大的，就连革命政权也不例外。"
 CHL_Local_trade_union_autonomy:0 "地方工团自治"
 CHL_Local_trade_union_autonomy_desc:0 "地方工团自治是我们的组织原则，每一个城镇的工会联合会对自己管辖范围内的经济和社会事务拥有最终决定权，中央机构只负责国防、外交和跨区域的重大协调等。地方的事情地方自己管，不需要等上面的红头文件。这一套分权体制的底气在于我们对地方劳动者的信任：他们比任何远在首都的官员更清楚自己需要什么，也更有权利决定自己的命运。"
 CHL_Socialist_trade_union:0 "社会党工会"
 CHL_Socialist_trade_union_desc:0 "工会运动与社会党之间的关系需要被制度化地巩固下来，社会党工会在全国各大产业中陆续建立，与已有的工会组织既竞争又合作，把社会党的政治纲领直接带入车间和矿场的日常劳动之中。尽管工团主义者对此激烈反弹，指责这是政党对工会独立的又一次渗透——把社会党的主张带到工人中去，因为社会党认为这些主张对工人本来有好处，把话说在明处总比暗地里动下流手脚强。"
 CHL_Technocracy_attracts:0 "技官主义吸引"
 CHL_Technocracy_attracts_desc:0 "革命热情需要加入大量的工程师、计划经济学家、农艺师和医生来维持运转。阿连德政府向全国的技术精英发出公开邀请：社会主义智利需要你们的知识和技能，祖国在呼唤，为革命事业工作吧！不要求你一定是社会党党员，只要你愿意用自己的专业能力为智利人民服务。一批年轻的技术官僚在这一时期涌入政府各部门和经济管理岗位，在当时这被叫做“建设新智利”。"
 CHL_Maintain_equality:0 "维护平等"
 CHL_Maintain_equality_desc:0 "法律面前的平等如果没有经济地位的平等作为支撑，就是一纸空文。社会党推动了一套旨在缩小贫富差距的累进税制、最低工资逐年上调和公共资源向贫困地区倾斜的财政转移制度。让富人多交税去养活穷人的学校和医院，让资本在利润分配时不能只考虑股东回报，让每一个劳动者在离开工作岗位时都能体面地度过晚年。是平等让贫富的悬殊缩小到社会可以承受的范围内。"
 CHL_Our_Latin_American_comrades:0 "我们的拉丁美洲同志"
 CHL_Our_Latin_American_comrades_desc:0 "革命的智利要是能关起门来过自己的好日子——那固然很诱人，实际上整个拉丁美洲的革命势力都值得援助。秘鲁的山地游击队、玻利维亚的矿工工会、哥伦比亚农村的自卫武装、中美洲香蕉种植园里的罢工工人，从墨西哥到合恩角到处都有被压迫者在反抗。智利的援助包括物资、资金、军事顾问和医疗队，同时也向这些革命组织敞开圣地亚哥的大门作为联络和休整的后方，这是又一笔坚实的政治支持资源的另一种体现形式。"
 CHL_Solidarity_economy:0 "团结经济"
 CHL_Solidarity_economy_desc:0 "社会党内部对经济政策的争论始终是喋喋不休难以停息，市场经济和计划经济各自的信徒在各派中都有拥趸。团结经济的是双方妥协的产物：承认市场在资源配置中的基础作用，坚持国家在关键领域的主导地位；保护私人资本在法律范围内的合法经营，赋予工会和合作社更大的经济参与权。使经济体制的选择不能撕裂社会，劳动者、企业家和国家三方的力量在制度框架内实现动态平衡。"
 CHL_Relief_and_Reconstruction_Company:0 "救济与重建公司"
 CHL_Relief_and_Reconstruction_Company_desc:0 "战争在南方的城镇和农村留下战殇如狰狞的长疤，住房被毁，农田荒芜，桥梁和铁路线断裂。我们着手于救济重建公司，钱直接出自国库，要知道荒芜的产业和无力的公司是吸引不来财富与繁荣的，我们必须想出解决这些财政阻碍的办法，我们的公司朋友们一定会在以后的日子里帮助我们的。"
 CHL_Infiltrate_trade_unions:0 "渗透工会"
 CHL_Infiltrate_trade_unions_desc:0 "工团主义者把工会视为自己的独立王国，不许党务的插手，不许政府的过问，何其荒谬。工会既然是工人阶级的组织，执政的社会党就有责任确保工会不被反对派利用，不与政府的重建计划对着干。于是渗透工会的工作在低调中进行，社会党党员在各个行业工会的选举中逐步取得关键岗位，过程不张扬，手段也不全能放在台面上。工团惊梦猛回头时，你们的主人已经回来了。"
 CHL_Controlled_capitalism:0 "受控的资本主义"
 CHL_Controlled_capitalism_desc:0 "在革命全面胜利之前，资本主义不会凭空消失，那么就必须把它关进笼子里。受控的资本主义是我们的过渡方案：私人资本可以在一定范围内运营，但它必须接受国家的严格监管和工会的全面监督。利润率设制上限，解雇工人需要工会的批准，企业的财务必须对工人委员会透明开放。资本家们当然不会喜欢这套安排，要在报纸上骂我们是社会主义的看门狗。狗看门是为了不让贼进来，这么生气是不是因为你们早就习惯了当贼？"
 CHL_The_liberation_of_workers:0 "工人的解放……"
 CHL_The_liberation_of_workers_desc:0 "工人的解放意味着不再有人靠剥削别人的劳动来发财，不再有孩子因为贫困而被剥夺读书的权利，不再有一家老小挤在铁皮棚屋里过冬。解放这个词如此巨大而似遥不可及，有时候让人觉得不真实，那么我们将其拆开观看：八小时的工作，闲余的家庭时间与气力，生病后敢去医院，老有所养。每一件小事都值得革命者为它奋斗终生，何况那一终大的愿景。"
 CHL_Enemy_of_the_capitalist_church:0 "资本教会之敌"
 CHL_Enemy_of_the_capitalist_church_desc:0 "资本和教会，这两样东西在智利的历史上是一对孪生兄弟。资本家出钱修教堂，主教在讲道台上训诫工人要“顺从主人”。工人阶级的敌人从来还有那些穿着黑袍站在道德高地上替剥削辩护的人。我们是资本与教会之敌！我们就对主教们明说了：我们拒绝和教会进行任何形式的社会合作，拒绝承认教会有资格在公共事务中发言。劳动者不靠神仙皇帝，我们自己就是自己的救世主！"
 CHL_Socialist_Youth_League:0 "社会主义青年团"
 CHL_Socialist_Youth_League_desc:0 "如果没有年轻人来接棒，革命会老去死亡，凋零遗忘。社会主义青年团为社会党的未来储备政治人才，在大学、工厂和农村广泛吸纳青年成员，进行系统的政治培训和组织锻炼。青年团的训练除了那些一般人也能做的读书和讨论，也包括参与社区服务、协助工会工作、在偏远地区开展扫盲和医疗援助，其中不乏许多将革命青年热情投入国家建设的资志愿渠道。把最好的年月交给革命，留下最好的革命交给后来人。"
 CHL_Invest_in_science_and_technology:0 "投资科学技术"
 CHL_Invest_in_science_and_technology_desc:0 "靠卖矿石过日子是不能长久的，智利必须在科学技术上实现追赶。国家科学技术委员会的预算被大幅增加，大学理工科院系扩招，规模化的重点实验室在圣地亚哥和康塞普西翁建立起来，公派留学生被送往欧洲和北美学习最新的工程技术。这种速度的调整与重视迟早对我们有益，这是功在千秋之事。"
 CHL_Socialist_humanism:0 "人道的社会主义"
 CHL_Socialist_humanism_desc:0 "只讲生产和分配的社会主义是无情短用的，社会主义必须关怀人的全部——人的情感、人的尊严、人在劳动之外的自由。一座新落成的工人住宅区不只要计算人均居住面积，花园和公共图书馆与住宅本身都同等重要；一项产业政策不只要评估产值增长，工人的劳动强度和精神压力也必须被纳入考量。“不能被量化就不去做”的态度恰是一切冷漠的官僚政治的根源。"
 CHL_Empower_indigenous_peoples:0 "赋予土著权力"
 CHL_Empower_indigenous_peoples_desc:0 "在智利生活的时间比任何西班牙后裔都长，马普切人在自己的土地上正直与勤恳的生活着，数个世纪以来却被当作外来者对待。米斯特拉尔政府颁布了一系列原住民权益改革法案：承认马普切传统领地的集体所有权，在阿劳卡尼亚地区设立马普切语的双语教育体系，将原住民代表纳入地方行政决策程序。他们看见智利的时候，智利也应该看见他们。"
 CHL_Participatory_democracy:0 "参与式民主"
 CHL_Participatory_democracy_desc:0 "社会党推动参与式民主，将决策权部分下放到基层社区和工厂委员会。例如地方预算的一部分由居民直接投票决定用途，企业的重大投资决策需要工人委员会审议，城市规划和环境保护项目在立项前必须召开公众听证会……这套制度运行起来很慢，争吵很多，一个社区公园的改建方案能吵上三个月。参与式民主的代价是效率的降低，它的收益是公民对公共事务的持续投入和责任感。"
 CHL_Attract_investment:0 "招商引资"
 CHL_Attract_investment_desc:0 "智利的经济重建靠自身积累速度太慢，外资必须被重新引进。施纳克政府推出一系列政策吸引外国投资者，这一套做法在党内左翼看来是向帝国主义拱手投降，外资进入南锥体历史上总是带着军舰和不平等条约。施纳克的态度却是耐人寻味的拒绝讨论路线问题，据说船运公司和矿业机械制造商不会等人吵完架才开工，是以实干兴邦嘛。"
 CHL_Ensure_one_party_dominance:0 "确保一党独大"
 CHL_Ensure_one_party_dominance_desc:0 "在多党竞争的格局下搞战后重建，各个法案都要在议会里被反对党反复撕扯，所有预算表决都可能变成政治交易。出于现实需要，社会党要成为智利唯一的执政党。修订宪法，重写选举规则，反对党的活动空间被压缩到接近于零。"
 CHL_Labor_dignity:0 "劳工尊严"
 CHL_Labor_dignity_desc:0 "所有制度设计的最终落脚点都是人。劳动者早晨走进自己工作的车间或矿井的时候，他需要确认自己不是一件会说话的机器，不是雇主任意处置的财产的，一个有尊严的人。没有拖欠，没有谩骂，没有朝不保夕……劳工尊严是工人阶级最终的追求，所有的罢工、谈判和立法都通向这里。"
 CHL_Peoples_Temple:0 "人民神庙"
 CHL_Peoples_Temple_desc:0 "在日复一日的劳作中，智利的劳动人民们亲手建造了一座看不见的神庙，没有那精美的大理石，砖石是每一次罢工争取的成果，穹顶是各地工会大厅里所熔铸彻夜不熄的灯火，那萦绕的圣歌是千百万人齐声唱响的抗议，还有希望……人民的神庙没有了神职人员来主持，只是每一个在劳动中认识到自我力量的工人都是自己的祭司 ，去追求劳动者在精神上的彻底觉醒，意识到自己才是这个世界唯一的真实创造者。"
 CHL_Welcome_the_dawn:0 "助人民赢得胜利"
 CHL_Welcome_the_dawn_desc:0 "所有政策的终点都在这里。国有化为人民，科技投资为人民，人民阵线为人民，工会和青年团为人民。智利的劳动者在这个时期获得的权利、福利和尊严在拉丁美洲范围内没有第二个国家可以相比，哪怕它的代价是曾经顽固的财政赤字与国际资本的全面围堵。我们的困难比山高，我们手上有一样东西谁也拿不走，人民和我们站在一起，人民会帮助我们与革命获得胜利！"
 CHL_Use_poetry_as_a_sword:0 "罗德里格斯再度启程"
 CHL_Use_poetry_as_a_sword_desc:0 "智利独立战争时期的传奇游击战士在群山之间与西班牙殖民军周旋多年，最后却被自己人出卖而死。他的名字在智利革命传统中就是经久不衰的特殊符号：一个并不高高在上，也并不靠近国父形象的，永远在山路上策马奔驰的身影，衣衫破旧，弹袋欲空尽了，身后追兵将至，他马头一拨，又继续冲向下一个山口。革命者疲倦且饥饿，时常在深夜怀疑自己走的这条路到底对不对，为此无法吐露千年的忧郁，可是当我们又想起他，模糊的背影，已经因为速度而难以分辨——上马奔腾，前面还有等待的路途。智利的社会主义革命没有可以停下来歇脚的时候，马背就是我们的归所。"
 CHL_Economic_miracle:0 "自由与面包一同夺回"
 CHL_Economic_miracle_desc:0 "面包，是经济重建的成果——就业率回升，通货膨胀被控制，港口重新繁忙起来，南方城镇的废墟上盖起了新房。自由，是革命最初许诺的那些权利——劳动者在工厂里有发言权，农民拿到了土地，每一个公民在法律面前平等。自由如果能跟面包一起落到劳动者的餐桌上，它就是最实在的政治承诺，胜过一切空谈，盖过所有废话。"
 CHL_is_the_work_of_the_workers_themselves:0 "……是工人自己的工作！"
 CHL_is_the_work_of_the_workers_themselves_desc:0 "可是慈善家不会给工人带来解放！开明的政客不会给工人带来解放！就连最同情工人的知识分子也没法代替工人去解放自己。工人的解放是工人自己的工作——战斗口号与组织原则。罢工要工人自己去组织，合作社要工人自己去经营，工会的领导人要工人自己去选举监督。任何外力包办工人去做本该工人自己做的事情，末了新的枷锁还会回到我们身上，我们定不愿此事发生。"
 CHL_Shining_socialist_democracy:0 "闪亮的社会主义民主"
 CHL_Shining_socialist_democracy_desc:0 "多么美好，多么崇高……"
 CHL_Socialism_shall_never_fall:0 "璀璨的社会主义之星"
 CHL_Socialism_shall_never_fall_desc:0 "南锥体的天空被红旗照亮！从圣地亚哥到布宜诺斯艾利斯，从硝石矿场到潘帕斯牧场，整个南锥体都在无言注视着这场人类历史上最壮丽的革命实验。安第斯山脉——宏伟的天堑与革命的脊梁。太平洋的浪涛拍打着海岸，仿佛是它呼号，如同它诉说着：社会主义共和国存活于世，胜利凯旋，并且它还要在可见的历史中坚定的继续向前。"
 CHL_Eliminate_the_democratic_faction:0 "清除民主派"
 CHL_Eliminate_the_democratic_faction_desc:0 "那些在战争期间就蠢蠢欲动的资产阶级民主派先生们，他们在议会里高谈阔论，在报纸上阴阳怪气，在俱乐部里密谋串联——够了。革命不是请客吃饭，共和国也不是他们的股票交易所。我们可太清楚当阿根廷前线的小伙子们还在用胸膛堵枪眼的时候，这些人已经在他们的肥脑中盘算着战后的权力分配了。清除他们是革命的必要自我防卫。街头上或许会有不满的声音，那些从来不肯放弃特权的阶层当然会反弹，但这恰恰证明这一步走对了。可是革命政权手里有枪，心里有底，身后有千千万万刚刚从战争中走出来的工农士兵，定将胜于风吹浪打。"
 CHL_The_legacy_of_the_machete_incident:0 "军刀事件的遗产"
 CHL_The_legacy_of_the_machete_incident_desc:0 "1927年的军刀事件为我们留下过严重的耻辱，当年那些佩剑的军官以为用刀背敲几下地板就能吓退工人阶级，尽管他们所想荒谬无稽，但他们留下的教训到今天仍然值得反复咀嚼。军队并非抽象隐身的国家机器，它有着自己的阶级属性与政治立场，有自己的一套利益算盘。格洛韦将军对此再清楚不过，毕竟他自己就是从旧军队里杀出来的异类。关于军队和革命关系的深刻认识评估的结论是枪杆子必须牢牢握在革命者手里，一刻都不能放松了。"
 CHL_Hold_elections:0 "举行选举"
 CHL_Hold_elections_desc:0 "仗打完了，政权也稳住了，现在该让人民说话了。忘掉资产阶级那种只有识字者和有产者才能投票的虚假民主吧！真正的、由工农兵学商各界群众广泛参与的社会主义选举来了。共和国的革命政党们将各自拿出自己的纲领，让车间、田埂和军营里的劳动者们来决定共和国接下来将去向何方——将是我们革命的新起点。"
 CHL_Central_Union_of_Chilean_Workers:0 "智利中央工会"
 CHL_Central_Union_of_Chilean_Workers_desc:0 "选举结果落定，智利中央工会赢得了执政权，布莱斯特·里福和他的同志们从总工会的办公桌后走到了总统府的办公桌后。这个派别从智利的工会运动土壤中生长出来，它的根系深扎在车间、码头和矿场里，它的信仰则来自另一个方向的融合——来自福音书与教会两千年来关于公义和怜悯的教导。基督教工团主义在很多人看来是一个奇怪的组合，但中央工会的人从不觉得这有什么矛盾：你看，基督本人就是个木匠，他的门徒是渔夫和税吏，教会从一开始就是劳动者的团体。"
 CHL_The_New_Public_Movement_Shall_Not_Fall:0 "新公共行动"
 CHL_The_New_Public_Movement_Shall_Not_Fall_desc:0 "选举结果落定，新公共行动赢得了共和国的执政权，格洛韦将军继续担任国家的掌舵人。劳动者们在经历了战争、动荡和重建的漫长考验之后用选票做出了自己清醒的决定。新公共行动围绕格洛韦将军本人凝聚而成，民主社会主义者、进步军官、合作社组织者、独立工会活动家共同站在这面旗帜之下。他们共享着一个明确无误的信念：社会主义必须是民主的，民主也必须是社会主义的，丢掉其中任何一个革命就会变质。"
 CHL_IWW_Chile_Branch:0 "世界产业工人联盟智利支部"
 CHL_IWW_Chile_Branch_desc:0 "选举结果出来了，世界产联智利支部赢得了执政资格。我们的同志们从瓦尔帕莱索的码头、从硝石矿场的工棚、从铁路修理厂的车间里走出来，就这么走进了总统府。世界产联在智利的历史不算长，在旧工会和传统左翼政党眼里我们一直是边缘角色，激进吵闹且不肯妥协。现在边缘角色走到了舞台中央。我们的信念就从没有变过：工人阶级的解放只能是工人阶级自己的事情，政党不可靠，议会不可靠，只有产业工会和直接行动才是我们的伙伴。"
 CHL_The_social_responsibility_of_the_church:0 "教会的社会责任"
 CHL_The_social_responsibility_of_the_church_desc:0 "教会不能永远躲在彩绘玻璃窗后面假装看不见这个世界的苦难。当工人家庭的孩子在挨饿，当矿工在暗无天日的井下咳出肺里的粉尘，当码头搬运工被工头皮鞭抽打的时候，教会如果只是说几句祈祷词就转身离开，那它就是在背叛福音书里每每关于穷人的经文。中央工会要求教会承担起社会责任的呼声不是来自理论家的书房，而是来自基层教区那些亲眼目睹过穷人生活的神父和修士们。教堂的门必须要向劳动者敞开，不止是在礼拜天，而是在如同每一个需要庇护、需要食物、需要有人站出来说话的时刻。"
 CHL_Defend_human_rights:0 "捍卫人权"
 CHL_Defend_human_rights_desc:0 "工团主义的全部主张可以从一个最简单的起点推导出来：劳动者是人，劳动者必须被当作人来对待。捍卫人权在这个语境下也不是什么抽象的启蒙口号，它简单的意味着八小时工作制，安全的生产环境，雇主不能随意开除工人，工人有权组织自己的工会而不被列入黑名单……这些权利是劳动者用罢工、游行和几十年的血汗斗争换回的。中央工会把人权写在自己的旗帜上，因而我们就说：任何侵犯劳动者权利的人，都是在侵犯人权本身。"
 CHL_propose_land_reform:0 "重提土地改革"
 CHL_propose_land_reform_desc:0 "上一轮土地改革被战争打断，现在必须重新启动。智利农村的封建残余堆积得如同安第斯山脉上的积雪，大地主们躲在管家和账本后面，至今仍然控制着全国最肥沃的耕地。新公共行动的立场毫不含糊：土地不属于任何坐享其成的人，土地属于在上面流汗的人。地契将要重写，庄园将被拆分，农村合作社要一个一个地建立起来。这场改革永远不会安静地进行。"
 CHL_Learn_from_the_British_model:0 "学习英国模式"
 CHL_Learn_from_the_British_model_desc:0 "不列颠联盟的同志们已经在社会主义民主的道路上摸索了十几年，他们的经验值得我们作为后来者认真对待。伦敦的工人委员会制度、苏格兰的合作社网络、威尔士的基层自治实验都是活生生运行着的架构，是实践中的社会主义民主。智利当然不是不列颠，安第斯山脚下的国度有自己独特的土壤和历史。向英国模式学习该是借鉴而非照搬，派往伦敦的考察团带回来的不只是文件和照片，还带回来了我们的信念：社会主义民主是一条走得通的大道。"
 CHL_The_army_the_revolutions_guard:0 "军队，革命之卫队"
 CHL_The_army_the_revolutions_guard_desc:0 "如同军刀事件之后，旧军队的那一套已经被证明不可信任。格洛韦将军推动了一场从上到下的改造：政治委员制度被引入每一级指挥体系，士兵委员会在基层连队中获得了发言权，军官晋升不再看家世和裙带关系，只看实战表现和政治忠诚。军队脱下了旧帝国时期的贵族外套，换上了革命卫队的制服。枪口永远朝外，枪托牢牢靠在民众的肩膀上。"
 CHL_Help_our_American_brothers:0 "帮助我们的美国兄弟"
 CHL_Help_our_American_brothers_desc:0 "美利坚的联合工团同志们正在北方受自己的苦，而我们智利革命的胜利能够给出他们这样的信号：南锥体已经变红，美洲的社会主义不再是孤岛了。我们向他们派遣技术人员、医疗队和无线电操作员。美国兄弟的事情就是我们的事情，太平洋和反动派隔不开我们的。"
 CHL_Preach_the_Gospel:0 "传颂福音"
 CHL_Preach_the_Gospel_desc:0 "亚伯托·乌尔塔多神父正致力于一项崇高的事业，他所创立的“基督之家”为智利社会中遭受歧视、不公与边缘化的群体，包括残障人士、退役军人以及无家可归者提供了温暖的庇护与支持。如今，他秉持着博爱与人道的精神，希望将“基督之家”的庇护范围扩展至整个智利。尽管这一使命艰巨而复杂，但我们新一届智利政府愿积极助力，与乌尔塔多神父携手并进，共同推动建设一个没有歧视、没有压迫的新智利。这也正是我们这一届政府所不懈追求的社会愿景。"
 CHL_Worker_Jesus:0 "工人耶稣"
 CHL_Worker_Jesus_desc:0 "“倘若耶稣生于今日，他也必会成为一位游击队员。”我们对此深信不疑。在这沉沦的旧世中，主的福音似乎已离我们远去。罗马的伪教宗肆意传扬那被篡改的福音，却对这世上最黑暗、最隐蔽的角落中时刻滋生的压迫与不公视若无睹。而这样的角落，在世界的版图上数不胜数，当世是一个巨大的索多玛，义人十不存一。\n\n难道那群恶人他们真以为那全视之眼一无所见吗？不，祂知晓一切，祂看到了那暴行的肆虐与猖狂。只是万能的主已为这堕落的人世闭上了双眼。耶稣不会再度降临，但耶稣无处不在，他就在我们中间，与我们并肩战斗！直到罪恶被驱散，直到道德重归于巅峰，天主会再次为我们睁开双眼，真正的福音将重回大地。"
 CHL_Form_trade_union_militia:0 "组建工会民兵"
 CHL_Form_trade_union_militia_desc:0 "工人不能永远指望别人来保护自己。战争时期的教训很清楚：当敌人逼近的时候，工会会员就是最好的兵源，车间就是最方便的兵营，起重机操作员的双手一样可以操纵火炮！工会民兵由各行各业的劳动者组成，定期在周末接受军事训练，他们的指挥官是从工人队伍中推选出来的老兵而非什么军校毕业生。这支武装力量的存在本身就是一种宣言：劳动者的政权有劳动者自己来保卫，不需要那雇佣兵或什么职业打手，工人手握的既是生产工具，也是自卫的武器。"
 CHL_Remember_the_Treaty_of_Leticia:0 "铭记加莱条约"
 CHL_Remember_the_Treaty_of_Leticia_desc:0 "1920年的加莱条约结束了欧洲大战，也划定了此后二十年旧大陆的政治版图。对智利革命者而言，加莱条约的意义在于它是一面镜子，照出了帝国主义列强瓜分世界的真实嘴脸。我们远在南锥体，和那些欧洲帝国的恩怨没有直接瓜葛，然而那份条约所代表的世界秩序至今仍在运作，仍在压迫着全球每一个被侮辱被损害的民族……让我们记住加莱，记住眼前的帝国主义不是历史书里的过去式。"
 CHL_Peoples_Militia:0 "人民民兵"
 CHL_Peoples_Militia_desc:0 "正规军之外，人民民兵是共和国防务的另一根支柱。这些由工人、农民和学生组成的武装力量在阿根廷战争期间证明了自己不是不通作战的花架子。和平到来之后，民兵没有解散，反而要进一步正规化。每个城镇的民兵连队定期集训，武器存放在街区委员会的地下室里，指挥链条与正规军紧密联动。也有资产阶级报纸嘲讽这是“全民皆兵的妄想症”，可是革命的逻辑则很朴素：只要敌人还在，人民就必须随时能够战斗。"
 CHL_Lyrical_rebellion:0 "抒情的反叛"
 CHL_Lyrical_rebellion_desc:0 "革命不能活得像个没趣的账房先生！无产阶级的反叛从来是抒情的、炽热的、决意不肯被规矩压扁。在街垒后面诵诗，在罢工的篝火旁唱歌，在工会集会上为了一句触动人的豪言壮语而欢呼到沙哑了嗓子。世界产联的传统里不乏这种抒情的反抗精神，我们的老前辈们在二十世纪初的美国就是一边唱wobblies歌曲一边被警棍们打破了头。今天在南锥体的我们也继承了这个传统：革命要有力量，革命也要有美。一首罢工歌曲胜过十篇社论的煽动，更能让一个工人明白自己是谁。"
 CHL_Industrial_unionism:0 "产业工会主义"
 CHL_Industrial_unionism_desc:0 "世界产联的工会理念和传统工会完全不同。传统工会按职业分工，火车司机作一个工会，扳道工作另一个工会，检票员又是一个工会，同一个铁路系统里能冒出七八个互不隶属的组织。产业工会主义打破所有这些人为的区隔：一条铁路上的所有人，不管你是工程师还是清洁工统统归入同一个产业工会。整个智利的工人阶级按产业重新整编，矿业、运输、制造、农业，每一个产业就是一个当处的战斗兵团。这样组织起来的工人阶级是多项的有力臂膊，而不像一碰就碎的把式货。"
 CHL_Sickle_hammer_cross:0 "镰刀，锤子，十字架"
 CHL_Sickle_hammer_cross_desc:0 "左翼阵营里有人说十字架是旧时代的迷信，教会里有人说镰刀和锤子是无神论的象征。中央工会的回答则是：镰刀和锤子是劳动者的工具，十字架是救赎的标记，这三样东西在我们的传统里并不敌对。想想吧，一个在田里挥镰刀的农民，一个在车间抡锤子的工人，他们在星期天走进同一座教堂，跪在那十字架下祈祷——这或许就是智利劳动者的真实生活，信仰和革命不需要互相否定。"
 CHL_Implement_the_Lagarrigue_Plan:0 "执行拉格里戈计划"
 CHL_Implement_the_Lagarrigue_Plan_desc:0 "战争胜利后，国内经济却悬而未决，被拖得千疮百孔。通货膨胀吃掉了工人的工资，硝石出口的恢复速度远低于预期，战时配给制延续太久已经开始滋生黑市……拉格里戈计划是应对这一切的系统方案：稳定货币，重建基础设施，恢复对外贸易，将战时工业转回民用生产。这一计划的名字来自那位在三十年代经济危机中提出整套思路的智利经济学家，他的理论在当时被嘲笑为不切实际的谈论，现在是终于有机会拿到现实中来检验了。"
 CHL_Nietzsche_D_Annunzio_Dleon:0 "尼采，邓南遮，德莱昂"
 CHL_Nietzsche_D_Annunzio_Dleon_desc:0 "尼采，德国疯子哲学家；邓南遮，意大利颓废派诗人兼战争狂；德莱昂，奇怪的美国马克思主义者。听起来莫名其妙，不过我们从他们每个人身上拿走了一部分东西来熔铸我们自己的反叛意识。从尼采那里拿来了对一切旧道德的蔑视和对生命意志的赞美，从邓南遮那里拿来了对行动的热情和对美与暴烈的无畏拥抱，从德莱昂那里拿来了产业工会主义的理论和冷酷无情的阶级斗争逻辑。这爆裂的意识形态鸡尾酒便是现今我们世界产联智利支部的精神底色了。"
 CHL_Attack_the_church:0 "痛击教会"
 CHL_Attack_the_church_desc:0 "智利的天主教会两千年来一直站在权力而从来没有站在穷人的一侧。主教们为地主虔诚祝福，为将军洒去圣水，又为大资本主做了临终弥撒，而工人阶级？在他们眼里只是需要施舍和训诫的羊群。世界产联对教会没有兴趣搞什么对话改革，我们现在就要把教会从公共生活中彻底赶出去。神父们不能再插手学校，不能再控制婚姻和葬礼，不能再对工人运动指手画脚。革命不需要十字架来给自己背书，然他们自己滚去一边念经去。"
 CHL_Direct_trade_union_democracy:0 "直接工会民主"
 CHL_Direct_trade_union_democracy_desc:0 "经验告诉我们政党和议会是靠不住的，工人的事情工人自己说了算，这就是直接工会民主的核心。工会代表大会是最高决策机构，代表们不在上面一坐好几年，他们随时可以且可能被原选举单位召回。重大决策不在密室里做出，所有会员都能旁听公开辩论。领导人的权力被严格限制，轮换制确保没有人能把工会变成自己的私人领地。这套制度在很多人看来造成了严重的效率低下、和程序麻烦，我们的回应是革命如果嫌民主都麻烦，迟早会把革命本身也简化掉。"
 CHL_De_politicization:0 "去政党化"
 CHL_De_politicization_desc:0 "政党政治在智利的历史上留下的更多是伤痕而非荣耀。各路政党在议会里吵的昏天黑地，少有哪些真的为工人谋来了福利，劳动者等来的却是换汤不换药的剥削。中央工会主张把政治权力从政党手中拿回来，直接交还给工会和基层社区。工会代表大会应当取代议会成为最高决策机构，立法者不必是职业政客而可以是刚从车间里走出来的工人代表。让真正在生产一线劳动的人来决定国家怎么运转，那些靠选举吃饭的职业政客们该歇歇了。"
 CHL_Unite_workers:0 "团结工人"
 CHL_Unite_workers_desc:0 "经济危机的烂摊子必须靠劳动者的团结来收拾。战时经济留下的通货膨胀和物资短缺不是靠一纸行政命令就能解决的，它需要工会在每一个行业、每一个企业里协调生产、调配资源、压制囤积居奇。中央工会的号召各行各业的劳动者放下门户之见，码头工人和铁路工人联手打通物流，矿工和钢铁工人协作恢复生产，纺织女工和农业合作社互通有无。团结工人就是把经济从泥潭里拉出来的最有效方针。"
 CHL_Land_cannot_be_without_people:0 "土地不能没有人民……"
 CHL_Land_cannot_be_without_people_desc:0 "那些世世代代在别人土地上弯腰的人，那些名字从未出现在任何地契上的人，那些除了自己的双手和脊背一无所有的人。土地是一个抽象的地理概念吗，土地是汗滴下去会开出花来的地方吗？其实是人民的劳动赋予了土地意义、价值和生命力。这场改革的全部哲学基础无非此句：土地不能没有人民。"
 CHL_People_cannot_be_without_land:0 "人民不能没有土地！"
 CHL_People_cannot_be_without_land_desc:0 "没有土地的人民就是风中飘零的碎叶，永远只能租别人的屋檐遮雨，永远只能看着自己的劳动成果被我们尊敬的管家先生抽走一大半。土地是尊严的基础，是自由的起点，是一个劳动者可以站着对任何人说话的物质前提。那些大庄园主恐惧的是失去土地带给他们的支配权力。革命要的就是这个效果：拿走他们手里的粗壮鞭子，把土地交给本就在上面劳作的人。人民不能没有土地，一如土地不能没有人民。"
 CHL_The_legacy_of_the_Valparaiso_strike:0 "瓦尔莱帕索罢工的遗产"
 CHL_The_legacy_of_the_Valparaiso_strike_desc:0 "世纪初的瓦尔帕莱索港口罢工浪潮死于军警镇压，码头工人的血把海港的栈桥都染红了……失败的罢工留下的愤怒和教训一直流传到今。瓦尔帕莱索的血瀑教会了智利工人阶级：指望政府来调解劳资纠纷是物理意义上的死路一条，工人必须依靠自己的组织和直接行动。世界产联把瓦尔帕莱索罢工视为自己精神的起点，似乎之后每有新的罢工和示威都是对1903年码头工们未竟事业的延续。"
 CHL_Pacifist_appeal:0 "和平主义呼吁"
 CHL_Pacifist_appeal_desc:0 "战争打赢了，革命的生存空间已经获得保障，接下来要做的是防卫为重。中央工会的和平主义立场来自两个源头：一是基督教传统里对暴力的深刻反思，二是工团主义对劳动者国际团结的信念。智利的劳动者和阿根廷的劳动者没有仇，智利的劳动者和秘鲁的劳动者也没有仇——真正有仇的是坐在总统府和将军府里的那些人。"
 CHL_Love_for_the_weak_and_justice:0 "爱，为弱者，为正义"
 CHL_Love_for_the_weak_and_justice_desc:0 "革命的终极燃料是大爱，不是仇恨。这话在枪炮声刚刚停熄的智利说出来，或许有人觉得太过理想超前。我们则坚持相信：社会主义如果只剩下经济和暴力两个维度，注定一日会在意外中干涸。爱弱者，爱那些在社会底层被践踏者；爱正义，爱那种不分贵贱让每个人都能抬头做人的秩序。这种爱像安第斯山脉的花岗岩坚不可摧，愿意为弱者挡住一切风暴，愿意为正义去冲击一切堡垒。我们的革命有枪炮、法律和经济计划，那么同时我们的革命也有爱。"
 CHL_Radical_Youth_Congress:0 "激进青年联盟"
 CHL_Radical_Youth_Congress_desc:0 "革命最忠实的燃料是青年人们——还没有学会对现实妥协，还没有被房贷和职称压弯脊梁，还能为了简单的口号热血沸腾，心潮澎湃。各大学和工厂建立了激进青年联盟。作为党的青年预备队只是附带作用，更多是作为独立的青年组织。他们读禁书印地下报纸，在街头英勇和警察对峙，在工会集会冲在最前排。这恰恰是青年最珍贵的品质：革命者永远是年轻，年轻人永远似革命。"
 CHL_Commune_system:0 "公社体制"
 CHL_Commune_system_desc:0 "经济危机的根治是要靠把经济权力交还给基层才能够实现。公社体制是我们给出的方案：以城镇和城市街区为单位，由劳动者直接管理的公社接管生产、分配和交换的全部职能。公社与公社之间通过协商和互助来协调区域性事务。这种体制在理论上极其美好，在实践中充满了摩擦和不确定性。哪怕我们清楚这一点，还是选择选择迎难而上，因为替代方案——让旧的官僚机器继续运转已经被证明是走不通的。"
 CHL_Blessed_are_the_kind_hearted:0 "与人为善的人有福了"
 CHL_Blessed_are_the_kind_hearted_desc:0 "登山宝训此句所言：与人为善，并非懦弱的讨好，是勇敢地选择去理解、帮助与和解。对待犯了错误的同志与人为善，对待曾经反对过我们但愿意回头的人与人为善，对待所有在贫困和屈辱中挣扎的劳动者与人为善。一个由劳动者建立的国家应当是一个比旧世界更温暖的国家。基督在山上的讲道遗留千年，本是能带来福音的至理，可千年以来也是听懂的人不多，照着去做的人更少。中央工会想做的就是在地球另一端的这片土地上认认真真地照着去做这一回。"
 CHL_The_triumph_of_democratic_socialism:0 "民主社会主义的凯旋"
 CHL_The_triumph_of_democratic_socialism_desc:0 "从军刀事件的耻辱到南锥体战争的胜利，从战后的经济泥潭到拉格里戈计划的有序推进，从旧军队的改造到人民民兵的建立，这条路走过来有多难恐怕只有亲身经历过的人才知道。民主社会主义在今天不再是书本上的一个词条，智利人民用选票、用劳动、用枪杆子、用无数个日夜的争论和妥协真切打造出来的现实也无外乎此。体制的凯歌已不必用大炮来奏响，这是更高级的胜利，从而在这里我们也听到它长久的回荡。"
 CHL_Finally_a_big_trade_union_is_built:0 "一个大工会终建成"
 CHL_Finally_a_big_trade_union_is_built_desc:0 "智利全国各行各业的劳动者最终被按照我们的愿望整合进了一个统一的产业工会体系，也就是一个大工会。从硝石矿场的爆破手到麦哲伦港的装卸工，从圣地亚哥的电车司机到复活节岛上的渔民，所有劳动者都在同一张大网的节点上。大工会本身就是政府，大工会取代了政党。世界产联奋力整整一个历史阶段来完成这场重组，它最终成形的那一天……就是我们狂想的终结，就让它来到现实吧。"
 CHL_Chile_Regional_Workers_Federation:0 "智利地区工人联合会"
 CHL_Chile_Regional_Workers_Federation_desc:0 "选举结果落定，智利地区工人联合会赢得了执政权。和中央工会那些全国性大组织不一样，我们的根基在地方，各省各镇的工会大厅以及每一个小工厂和作坊的工人委员会……联合会的组织原则从一开始便是分权的，各地工会保留了高度的自主权。这种松散的结构曾被我们的对手嘲笑为一盘散沙，而在战后的政治洗牌中这盘散沙凝聚起来并证明了自己的分量。智利的劳动者选择了一条扎根于地方的工团主义道路，以不必凡事都等圣地亚哥发话。"
 CHL_Chilean_Socialist_Party:0 "智利社会党"
 CHL_Chilean_Socialist_Party_desc:0 "选举结果落定，智利社会党赢得了执政权。从硝石矿区的工会办公室到圣地亚哥的大学讲堂，从瓦尔帕莱索的码头工人集会到南方农村的合作社，作为最早期革命政党的社会党的组织网络覆盖了这个狭长国家的每一寸土地。社会党内部容纳了许多不同的流派和倾向——经济派的务实主义者、改良派的渐进社会主义者、年轻一代的理想家——此刻拥挤于同一面旗帜下，即将在党内表决中决定共和国下一步的方向。"
 CHL_Moderate_victory:0 "温和派胜利"
 CHL_Moderate_victory_desc:0 "党内路线斗争中的温和派占了上风，伯纳多·伊巴涅斯·阿吉拉和他的自由工团主义路线赢得了多数代表的支持。温和派并不认同激进派那种一步到位砸烂国家机器的主张，他们认为在战后智利的现实条件下，工团主义必须学会与现有的社会结构共存并逐步改造它。革命者不能只善于破坏，还要善于建设与修理。"
 CHL_Radical_at_the_helm:0 "激进派掌舵"
 CHL_Radical_at_the_helm_desc:0 "党内路线斗争中的激进派胜利了！欧涅斯托·米兰达·里瓦斯和他的无政府工团主义路线拿下了多数代表的支持。渐进改良的方案被否决了，代表们选择了彻底的革命姿态。从明天开始，我们没有朋友了，只有自己为自己谋取革命的出路。"
 CHL_Allendes_victory:0 "阿连德带来梦想"
 CHL_Allendes_victory_desc:0 "在党内表决中，可靠的年轻一代理想家萨尔瓦多·阿连德取得了领导权。如今是轮到他来掌舵了，轮到他来把同志们所期许、等待与呼喊的理想，那些社会革命的幻梦带来此处。"
 CHL_Alcayagas_election_victory:0 "阿尔卡亚与团结同行"
 CHL_Alcayagas_election_victory_desc:0 "进步改良派的加布里埃拉·米斯特拉尔取得了领导权。她的名字在智利远传——诗人、教育家、外交官，大文学家，智利文化灵魂式的人物。阿尔卡亚是她在家乡的化名，后来变成了她政治战友们对她的昵称，进而逐渐成为整个改良派阵营的代号。"
 CHL_Schnake_comes_to_power:0 "施纳克建设繁荣"
 CHL_Schnake_comes_to_power_desc:0 "经济派的奥斯卡·施纳克在党内表决中意外获胜。他的胜利多是因为他的某些能力：他在党内以务实著称，对意识形态辩论缺乏耐心，对经济数字却有着近乎偏执的才华。革命的高潮已经过去了，现在摆在面前的是通货膨胀、失业率和物资短缺，能把这三样东西打下去的人才有资格谈论理想。"
 CHL_For_the_motherland:0 "为了祖国！"
 CHL_For_the_motherland_desc:0 "这个松散的右翼联盟在达维拉政权的废墟上找到了属于自己的时刻。智利是智利人的智利，剩下的一切靠边站！为了祖国——这三个字被赋予了最滚烫的重量，是所有纲领的总和，是所有政策的出发点，是所有敌人的判决书。祖国不需要向任何主义道歉，不需要向任何外国鞠躬，祖国只需要被热爱、被保卫、被扩张。那些在战争失败之后还在盘算着怎么瓜分政治残局的人最好重新想清楚……"
 CHL_Eliminate_socialism:0 "消灭社会主义"
 CHL_Eliminate_socialism_desc:0 "社会主义是智利的癌细胞，必须被一刀一刀地剜干净 鲜血喷涌！工团主义者的工会，社会党的基层组织，共产党在矿区的地下网络，温和派在议会里那些亲工的说辞，统统属于同一个病灶。消灭社会主义！段不设上限，时限不设终点。外科手术式的镇压当然会引起反弹，反弹正好暴露残余病灶的位置，清理工作只会更加彻底。"
 CHL_Imprison_Davila:0 "关押达维拉"
 CHL_Imprison_Davila_desc:0 "达维拉本人也必须为他的失败付出代价。战败的将军没有资格继续以领袖自居，他的军事冒险断送了南锥体战场上最好的局势，把胜利拱手让给了阿根廷国民军。为战死者索债，作为清洗军队内部无能分子的政治信号，谁还在私下为达维拉说情，谁就是下一个被关押的对象。"
 CHL_COCAT_Emergency_Conference:0 "柯卡特紧急会议"
 CHL_COCAT_Emergency_Conference_desc:0 "柯卡特庄园的紧急会议被准备，被召开，不知道多少天要过去了……右翼各路势力的代表在烟雾缭绕的房间里争吵、讨价还价、互相威胁，最终在共同的敌人和共同的恐惧面前达成了一纸协议。柯卡特紧急会议将被后世称为智利右翼的制宪会议，一切分歧被暂时搁置，一切矛盾被暂时冻结，在柯卡特庄园里重新分配了权力，然后各自回到自己的阵营里准备下一次内斗。紧急选举就从这场密会中产生，究竟由谁来继续领导祖国的伟大？又该由谁来拯救它的风雨飘摇？"
 CHL_National_Socialist_Movement:0 "国家社会主义运动"
 CHL_National_Socialist_Movement_desc:0 "国家社会主义运动在祖国派阵营中自诩为最革命的力量。他们从德国国家社会主义和意大利法西斯主义等的理论武库中搬来了整套军火，在智利的土壤上组装出了自己的版本：民族共同体高于阶级，国家是民族的最高政治形式，领袖原则是唯一高效的政治决策方式。国家社会主义运动的政治动员充满了街头暴力、群众集会和准军事纪律，他们不屑于和旧右翼的绅士们为伍，宣称要发动一场真正的民族革命——革自由主义的命，革社会主义的命，革一切无能政客的命。"
 CHL_National_Action_Unbreakable:0 "国家行动"
 CHL_National_Action_Unbreakable_desc:0 "国家行动走上了执政前台，这个政党自视为智利民族主义最纯粹的政治结晶。它的纲领建立在三个主要观点上：民族共同体高于一切、领袖原则不容挑战、外部敌人必须被彻底消灭。国家行动的组织结构仿效军队，层级分明，纪律严酷，党的决定就是命令，命令不容讨论与违反。"
 CHL_National_Order_Front:0 "国家秩序阵线"
 CHL_National_Order_Front_desc:0 "国家秩序阵线是智利右翼阵营中最边缘也最令人不安的派别。骨干来自一小撮沉迷于秘传主义、种族神秘论和阴谋学说的知识分子，本来在正常的政治光谱上几乎无法被定位。原先国家秩序阵线不屑于和任何主流派别为伍，认为自己掌握着被主流世界遗忘的古老真理。"
 CHL_Shift_towards_totalitarianism:0 "既非反动......"
 CHL_Shift_towards_totalitarianism_desc:0 "极左派和民族左派被国家社会主义运动拉入了政治联盟，以极左派为主导。这个组合让传统马克思主义者感到困惑：法西斯和左翼怎么可能坐在一起？国家社会主义运动的逻辑其实也很直白，反动派和资产阶级自由派都是民族的寄生虫，在反资本主义和反自由主义的旗帜下，极左的民族布尔什维克可以和极右的国家社会主义找到共同语言。对旧右翼进行羞辱性的切割，革命的主体不需要贵族和银行家的祝福。"
 CHL_Uphold_national_populism:0 "......亦非革命"
 CHL_Uphold_national_populism_desc:0 "联盟的这一张面孔以极右翼为主导，联合极左派和民族左派但方向盘握在自己手里。其实无非是对马克思主义革命的拒绝，革命的目标不是建立无产阶级专政而是建立民族共同体至上的强权国家。极左派的群众动员能力和极右派的组织纪律被良好焊接，连接处上站着的全是国家社会主义运动的干部。"
 CHL_Valladarama_Continues_at_the_Helm:0 "瓦尔达拉玛继续掌舵"
 CHL_Valladarama_Continues_at_the_Helm_desc:0 "弗朗西斯科·哈维尔·迪亚斯·瓦尔达拉马巩固了自己在国家行动中的领导地位。瓦尔达拉马是智利民族主义运动中的老面孔，政治生涯经历过多次起伏，在达维拉的阴影下忍辱负重多年之后终于等到了自己的时刻。他的统治风格带有老派威权主义的沉稳，不屑于年轻人的街头暴力和意识形态狂热，更依赖官僚系统、警察和军队的体系化运转。"
 CHL_Keller_Seizes_Power:0 "凯勒夺权"
 CHL_Keller_Seizes_Power_desc:0 "卡洛斯·凯勒在国家行动内部发动了一场迅捷的夺权攻势，瓦尔达拉马被架空推走，凯勒掌握了实际权力。凯勒的政治风格比瓦尔达拉马更激进也更学术化，他随身带着种族理论的著作，有时都能见到他在干部会议上用近乎临床医学的冷静语气谈论优生学和民族退化。"
 CHL_Embrace_esotericism:0 "接受秘传主义"
 CHL_Embrace_esotericism_desc:0 "真理自古不是所有人都能承受的，真理只向少数被拣选的人显现。秘传主义被接受为政权意识形态的核心，从赫尔墨斯主义到通神论，从亚特兰蒂斯传说到南极地心文明，所有被现代社会嗤之以鼻的知识碎片被系统整理拼接成一套完整荒谬，晦涩难懂的宇宙观。人类的历史不是阶级斗争的历史，是隐藏的智慧传统和黑暗力量之间持续数千年的隐秘战争的历史，包括那犹太人，背叛者，许多神，还有那隐藏的仙境……"
 CHL_Aristocratic_rule:0 "贵族统治"
 CHL_Aristocratic_rule_desc:0 "我们清楚的知道，民主是暴民的狂欢，平等是人类最危险的幻觉。贵族统治被恢复为唯一的正当统治形式，贵族也不尽来自血统，而有是对秘传真理的掌握和精神修行的成就。新贵族阶层的选拔由一套秘密的内部考核体系完成，不为外人所知。"
 CHL_Embrace_racism:0 "拥抱种族主义"
 CHL_Embrace_racism_desc:0 "种族之间的不平等不是偏见，是宇宙秩序的一部分，是不可以否认的事实差别，是必然与永恒的高低贵贱。拥抱种族主义的国家秩序阵线与智利政权毫不遮掩地宣称雅利安种族是地球文明的正统继承者，有色人种和混血人种在精神和智力上天然低劣，跨种族通婚是基因污染的犯罪。"
 CHL_Establish_Stormtroopers:0 "建立冲锋队"
 CHL_Establish_Stormtroopers_desc:0 "冲锋队被建立起来，街头从此不再属于左翼。冲锋队员穿着统一的制服在各大城市巡逻，解散左翼集会、砸毁社会主义报纸的印刷机、在罢工纠察线上和工会打手正面对撞。冲锋队是国家社会主义运动的粗暴拳头，拳头上沾着血，血迹中有敌人的也有自己的。政治暴力从地下交易变成了公开表演，每一场街头冲突都在强化冲锋队员对彼此的忠诚和对领袖的崇拜。"
 CHL_Order_and_Discipline:0 "秩序与纪律"
 CHL_Order_and_Discipline_desc:0 "自由的反面是秩序，散漫的反面是纪律。国家社会主义运动把秩序和纪律定义为民族复兴的两大支柱，社会秩序不容任何个人或团体以自由之名破坏，生产纪律不容任何工人以权利要求为名懈怠。全民被编入准军事化的组织体系，从少年团到妇女联合会，每个人在组织中都有自己的位置和上级，每个位置都附带一套明确的行为规范，代价是自由的彻底消亡，支持者认为自由本来就是西方自由主义炮制出来的伪神。"
 CHL_Strengthen_national_identity:0 "强化国家认同"
 CHL_Strengthen_national_identity_desc:0 "智利的历史被重新书写，从马普切战争到太平洋战争，从独立运动到反社会主义内战，所有重大的历史事件都被编织成一部民族认同的宏大叙事。学校教材、公共仪式和国家媒体三者联动，把国家认同灌输进每一个智利人的日常意识，为了制造一种绝对的政治共同体意识，在国家认同面前任何其他身份都不被承认。"
 CHL_Centralized_State:0 "集权化国家"
 CHL_Centralized_State_desc:0 "权力被从地方收归中央，省长和市长由中央政府直接任命，地方议会被解散，地方预算被纳入全国统一财政体系。集权化国家的推进过程遭遇了传统地方势力的抵抗，对这些抵抗的处理方式是调换人事和削减经费，或许不流血但同样坚决。"
 CHL_Invite_German_Military_Advisors:0 "邀请军事顾问"
 CHL_Invite_German_Military_Advisors_desc:0 "德意志帝国与其他外籍兵团的军事顾问被正式邀请进驻智利军队。这些顾问可不是来做客喝茶的，他们接手了智利军队的训练、编制和作战条令的全部改造工作。邀请军事顾问的代价是智利军队的指挥权部分让渡给了他们，不过国家行动认为这不是主权的损失，是向更强大的文明借用力量的必经之途。"
 CHL_Chilean_Labor_Front:0 "智利劳工阵线"
 CHL_Chilean_Labor_Front_desc:0 "法团化的劳工阵线被建立起来，全国各产业的工会被强制编入统一的官方劳工组织。劳资谈判被废止，工资标准由劳工阵线的技术部门根据生产指标和国家利益统一制定，罢工属于对祖国和民族的犯罪。"
 CHL_Support_eugenics:0 "支持优生学"
 CHL_Support_eugenics_desc:0 "劣等基因必须被从智利民族的血液中过滤掉！优生学政策包括遗传病筛查、强制绝育和对有缺陷个体的婚姻限制，优生学理论被列为大学医学院和生物学系的必修课。科学的纯洁性要求民族基因的纯洁性与之匹配，凯勒的优生学工程就是一台用医学器械武装起来的种族净化机器，高效且残忍。"
 CHL_Practice_ritual_magic:0 "修习仪式魔法"
 CHL_Practice_ritual_magic_desc:0 "仪式魔法被纳入国家秩序阵线的内部修行体系，高级干部在秘密仪式中实践仪式魔法以提升精神力量、与高维存在建立联系、在政治决策中获取超自然的指引。以至于政府预算中有一笔秘密拨款专门用于仪式场所的修建和仪式用具的采购。"
 CHL_Gothic_Spanish_Supremacism:0 "哥特—西班牙至上主义"
 CHL_Gothic_Spanish_Supremacism_desc:0 "智利被国家秩序阵线重新定义为哥特-西班牙文明在南半球最纯净的继承者，这分明是完全的真理！西哥特人在伊比利亚半岛建立的中世纪王国是欧洲最完美的文明形态，西班牙帝国将哥特的血脉和信仰带到了新大陆，智利是这个文明链条的末端，最完美的可发展领域，也是重新起航的起点，未来还将是文明复生与再临的绝对力量。"
 CHL_Arm_the_Youth:0 "武装青年"
 CHL_Arm_the_Youth_desc:0 "青年是民族最优质的燃料。国家社会主义运动在各级学校建立了准军事青年组织，从少年阶段就灌输忠诚、勇气和服从的价值观，体育锻炼和军事训练合并为一套课程。培养有独立思想的公民是不能达成武装目标的，要培养战场上能开枪、工厂里能干活、集会时能撕心裂肺欢呼的，全面发展的优绩主义多功能战士。"
 CHL_Production_Promotion_Company:0 "生产促进部"
 CHL_Production_Promotion_Company_desc:0 "国家亲自下场抓生产，生产促进部被赋予绕过一切官僚程序的超级权限。生产计划的制定由政治委员会和工程师联合完成，劳动纪律由冲锋队进驻工厂来保证，资本家的经营自主权被压缩到接近于零。该部门的成立是国家社会主义运动对自由市场最响亮的耳光，利润根本不是生产的目的，民族的强大才是。"
 CHL_Economic_Protectionism:0 "经济保护主义"
 CHL_Economic_Protectionism_desc:0 "外国商品被高关税挡在国门之外，外国资本进入智利市场需要经过政治委员会的逐一审批。民族经济的堡垒化到来了，智利的生产体系被尽可能地和全球市场隔离开来，自给自足的理想在国家社会主义的框架内被推到了极端处。"
 CHL_Eradicate_the_Jewish_Threat:0 "根除犹太威胁"
 CHL_Eradicate_the_Jewish_Threat_desc:0 "反犹主义在瓦尔达拉马的统治下被提升为国策。哪怕智利的犹太社群规模不大，在商业和学术领域的影响力也被国家行动的宣传机器无限放大，犹太人在经济上被定义为民族的吸血鬼与恶魔，在文化上被定义为传统道德的腐蚀剂，在政治上被定义为全球布尔什维克与跨国资本的秘密同盟。这一系列政策包括剥夺犹太人的公职资格、限制犹太商业活动、鼓励犹太人离境。"
 CHL_Technical_Committee:0 "技术委员会"
 CHL_Technical_Committee_desc:0 "经济恢复不能靠政客的嘴皮子，还是得靠懂行的人。一个技术委员会被设立为全国最高经济决策机构，成员由工程师、经济学家和工业经理组成，不受常规议会程序的约束，直接向瓦尔达拉马负责。技术官僚在国家行动体制中的地位仅次于军队和警察，他们手握特权，用效率和数据取代了公共讨论。"
 CHL_Prussian_Spirit:0 "普鲁士精神"
 CHL_Prussian_Spirit_desc:0 "服从、简朴、精确、责任——普鲁士精神被系统地引入智利军队和官僚体系。军官和公务员接受普鲁士式的纪律训练，上下级关系被重新定义为一套绝对的命令与服从体系。普鲁士精神在安第斯山脚下找到了一块异国的，另类的试验田。"
 CHL_Attract_German_Immigrants:0 "吸引德国移民"
 CHL_Attract_German_Immigrants_desc:0 "德裔移民被优惠政策吸引到智利南部定居。德国移民在政府赠予的土地上建立农业定居点和手工业作坊，被要求保持德语和文化传统，被编入地方民兵作为维持秩序的辅助力量。吸引德国移民是种族工程的一部分，目标是逐步提升日耳曼血统在智利民族基因库中的比例，以优化智利的人口血统结构。"
 CHL_Interventionist_Economy:0 "干涉主义经济"
 CHL_Interventionist_Economy_desc:0 "看不见的手被国家有形的大手紧紧握住。干涉主义经济让政府成为市场的主导者，价格管制、生产配额和投资审批覆盖了所有关键行业，私营企业的利润空间被压缩到允许范围之内。其实质则是以民族国家的名义对资本主义进行有限度的驯化，同时使劲管控经济社会。"
 CHL_Resolve_the_Eternal_Crisis:0 "解决永恒危机"
 CHL_Resolve_the_Eternal_Crisis_desc:0 "民族的血脉纯度是一切危机的根源。劣等基因和异族血统混入民族体之内导致智利长期陷入政治动荡和经济停滞，解决永恒危机的方案是从优生学、移民控制和种族隔离多个维度同时推进的民族净化工程。我们在这场大战中决不投降。"
 CHL_New_Brahmin_Class:0 "新婆罗门阶级"
 CHL_New_Brahmin_Class_desc:0 "我们效仿先进的印度种姓制度，将新的婆罗门阶级被确立为社会最高等级。新婆罗门由政权高层干部、秘传主义大师和优生学认定的高级种族个体组成，享有政治决策权、教育垄断和对低级种姓的生杀大权。社会等级与分工问题，阶级差异被制度化神圣化乃至恶魔化为不可逾越的壁垒。"
 CHL_Worship_of_Labor:0 "劳动崇拜"
 CHL_Worship_of_Labor_desc:0 "劳动的行为与产出被抬上了神坛。在国家社会主义运动的宣传中，劳动者不再是阶级斗争的承担者，而是民族共同体中最光荣，本来就光荣的成员。劳动崇拜的国家仪式包括年度劳动英雄表彰、大型集体生产竞赛和全国劳动节大阅兵。工人的实际工资和劳动条件是否改善都属于次要问题了，首要问题是工人是否在情感上认同自己是民族生产大军中的荣光无限的一员。"
 CHL_Extreme_Nationalist_Propaganda:0 "极端民族主义宣传"
 CHL_Extreme_Nationalist_Propaganda_desc:0 "每一个电台波段都在播放军乐和领袖讲话，每一张报纸的头版都在报道民族复兴的最新成就，每一面墙都被刷上了爱国主义标语和领袖画像。将信息空间压缩成了只能容纳一种声音的密室，全国在同一个时间听同一个声音、读同一篇文章、呐喊同一个口号，这个共享着集体的可怖狂热，憎恶的浪潮与对国家荣光的集体意淫高潮。"
 CHL_Military_Rule:0 "军事统治"
 CHL_Military_Rule_desc:0 "军队接管了从治安到教育再到经济规划的一系列民事职能，军事长官被任命为地方行政首脑，军事法庭的管辖权扩展到民事领域。军营的秩序被移植到社会各个角落，效率被提升，自由被蒸发。"
 CHL_South_American_Germany:0 "南美德意志"
 CHL_South_American_Germany_desc:0 "智利要成为南美洲的德意志，军队是南美德意志最直接的样板。阅兵式上智利军队踢正步踢踏的姿势和柏林阅兵真是如出一辙，甚至军官的口令有时都用德语喊出，勋章设计也隐隐约约在效仿铁十字。智利民族主义对德意志帝国军事文明的全部倾慕的物化表现就是如此，整个国家被塑造成一座巨大的军营，营地门上书:“纪律是最大的自由”。"
 CHL_Conservative_Revolution:0 "保守革命"
 CHL_Conservative_Revolution_desc:0 "资源和科研被投入，甚至朝向优生学、核物理和火箭技术……完成一场保守革命——用最前沿的科技去保卫最古老的价值。保守革命将现代科学和传统种族理论缝合在一起，实验室里的科学家就是种族理论家，这两种人格，科学与政治的，在一个预算科目下共享研究的经费。"
 CHL_Reverse_Western_Decline:0 "逆转西方衰落"
 CHL_Reverse_Western_Decline_desc:0 "我们的国家并不腐朽！腐朽的明明是西方无能恶心的自由主义。西方世界在个人主义和享乐主义的泥潭里越陷越深，智利重新点燃了西方的精神火种——纪律、信仰、民族荣誉和种族纯洁。逆转西方衰落的使命感让凯勒政权带有一种近乎宗教的热忱，似乎相信自己的确不同。"
 CHL_Castrate_Hybrids_and_Aryan_Eugenics:0 "阉割杂种与雅利安优生学"
 CHL_Castrate_Hybrids_and_Aryan_Eugenics_desc:0 "优生学被推到更极端的地步。混血人口被严格隔离在特定区域，被施以强制绝育以逐步削减其在总人口中的比例，雅利安血统的纯净度通过严格的婚姻审查和基因档案制度来维护，发动这一套用生物学语言表达的社会清洗方案。"
 CHL_Search_for_Extraterrestrial_Ancestors:0 "寻找外星祖先"
 CHL_Search_for_Extraterrestrial_Ancestors_desc:0 "雅利安种族的最初起源不在太阳系内，人类的外星祖先曾访问过史前地球，在亚特兰蒂斯和利莫里亚建立了高度发达的文明。寻找外星祖先的项目包括考古发掘、古代文献解译和与外星智慧体建立超自然接触的秘仪实践。除了许珀尔珀瑞亚与亚特兰蒂斯，也有那无上秘境与南极之下的阿加莎，我们一定找到，寻回并跪拜我们骄傲的起源。"
 CHL_Destroy_Monopoly_Capitalism:0 "摧毁垄断资本主义"
 CHL_Destroy_Monopoly_Capitalism_desc:0 "大资本也被国家社会主义运动列为了首要敌人，垄断企业是民族的吸血鬼，金融寡头是民族的寄生虫。摧毁垄断资本主义的政策包括强制拆分大型企业、限制私人资本规模、将金融业置于国家直接控制之下。中小资产阶级在国家的羽翼下获得了一定保护，大资本家则被剥夺了反抗能力，国家的拳头对他们不比对工人软。"
 CHL_Refuse_to_Fight_as_Neither_Horse_Nor_Worker:0 "非马非工拒斗争"
 CHL_Refuse_to_Fight_as_Neither_Horse_Nor_Worker_desc:0 "马克思主义和工团主义都被国家社会主义运动扔进了社会主义专用的垃圾桶。马克思主义是犹太知识分子炮制出来的异族学说，工团主义是工人贵族的狭隘行会意识，两者共同毒害了工人阶级对民族共同体的天然忠诚，是完全不可理喻的思想。阶级斗争被彻底拒绝，工人被教导去寻找自己的阶级敌人——结果找了半天发现敌人就是自己隔壁车间的兄弟。"
 CHL_Santiago_s_Sacred_Land:0 "圣地亚哥的神圣土地"
 CHL_Santiago_s_Sacred_Land_desc:0 "圣地亚哥是军人的神圣土地！武装部队在这里誓师、在这里阅兵、在这里为祖国献上最隆重的致敬。神圣土地的定义排斥一切亵渎者——社会主义的亵渎者、自由主义的亵渎者、一切在军队面前不肯低下头的亵渎者。绝不要将它玷污了，我亲爱的土地……"
 CHL_Rebuild_the_City_of_Caesar:0 "重建凯撒之城"
 CHL_Rebuild_the_City_of_Caesar_desc:0 "宏伟的基础建设工程被命名为凯撒之城的重建，在安第斯山脉的群山之间修建巨大的花岗岩建筑群、地下迷宫和刻满符文的高塔。建筑风格仿效古罗马和假想中的亚特兰蒂斯样式，建材全部采用能历经千年的石材和混凝土。重建凯撒之城是为万年后的人类留下文明的火种和雅利安种族的不朽丰碑，青史记载的最好例证，看啊，雅利安神国这就要来了！"
 CHL_Chilean_National_Revolution:0 "智利民族革命"
 CHL_Chilean_National_Revolution_desc:0 "一切政策的最终指向是智利民族革命。这场革命从右翼出发，要革掉自由主义、社会主义、反动保守主义和外国帝国主义的命，只留下一个纯净的、强大的、统一的智利民族！民族革命不会在几年内完成，是一场永无止境的历史任务，民族革命的终点永远在前方！"
 CHL_End_the_Kaliyuga:0 "终结卡利字迦"
 CHL_End_the_Kaliyuga_desc:0 "黑暗的末法时代已经持续数千年，这个时代的特点是精神退化、道德沦丧和低等种族统治世界。终结卡利宇迦的全部条件已经在当下汇集：雅利安种族、秘传真理和星际时代的开启。我们的终极使命就是亲手终结这无垠的黑暗时代，碎裂这无用的时势与斗争天的时候，开启下一个黄金纪元！"
 CHL_Submit_to_foreign_rule:0 "屈从于外国统治"
 CHL_Submit_to_foreign_rule_desc:0 "圣地亚哥以一种最屈辱的方式陷落了！外籍军事顾问团撕下顾问的面具，一夜之间接管了总统府、军营、港口和电台。国旗被降下来，国旗被升上去。蠢货把帝国主义请进家门的时候还以为自己能当管家，现在主子直接把房子收走了……智利，骄傲的智利，南锥体革命策源地的智利，安第斯山脉的心脏此刻正被一双双戴着白手套的外国双手掐着脖子按在地上，连呼吸都要看别人的眼色。"
 CHL_German_colonies:0 "德意志的殖民地"
 CHL_German_colonies_desc:0 "智利正式成为德帝国的海外殖民地，柏林派遣总督和行政官员接手智利政府的运转。德帝国对南锥体的兴趣由来已久，一战前威廉二世的将军们就在地图上比划安第斯山脉周边，现在帝国鹰徽归于此处。殖民部对智利的定位是南美洲的资源仓库和战略据点，日耳曼移民开始有计划地向智利南部迁徙，在当地最好的耕地上建立定居点。智利是德意志的殖民地，帝国的太阳永远不落，南半球的这一块拼图终于补上了。"
 CHL_Austrian_rule:0 "奥地利的统治"
 CHL_Austrian_rule_desc:0 "维也纳的旗帜在圣地亚哥飘扬，奥地利帝国拿下了对智利的控制权。这个中欧老牌帝国在自己的帝国内部明明总是摇摇欲坠，却在地球另一端捞到了一块膏腴的殖民地。奥地利统治的风格和德国人不太一样，维也纳式的官僚体系更慵懒也更精致，对殖民地管得不像普鲁士人那么密不透风。上校军官们在圣地亚哥的社交舞会上接受当地精英的奉承，奥地利统治停留在表面优雅，内里腐朽与无能，一张华丽的帷幕遮住了拿枪托砸门的声音。"
 CHL_Consolidate_our_rule:0 "巩固我们的统治"
 CHL_Consolidate_our_rule_desc:0 "所有关键位置全部换上我们自己的人，军队指挥权集中到顾问团手里，警察系统由宗主国军官直接掌管。让每一个智利人时刻都清楚地知道自己活在谁的枪口下。反抗情绪当然会有，譬如那街角贴传单的人永远抓不完，这些无足轻重——机关枪和宵禁会慢慢教会人们服从。"
 CHL_British_dominions:0 "不列颠的自治领"
 CHL_British_dominions_desc:0 "智利被纳入大英帝国的自治领体系，名义上享有自治地位，实际上所有重大决策都由伦敦任命的自治领总督拍板。英国人的殖民风格是找本地精英合作，用贸易协定和法律条款把殖民地牢牢绑在帝国经济体系上。智利在自治领地位下保留了一切能让智利人产生自己还在管理国家的错觉的形式，比如那法院和议会、国歌与国旗，真正的决策在总督府的密室里便已经结束，摆进议会只是走个过场。"
 CHL_Allies_of_constitutional_countries:0 "宪政国的盟友"
 CHL_Allies_of_constitutional_countries_desc:0 "智利被来自北美的宪政国政权纳入势力范围，脱胎于旧南方同盟和种族主义传统，对南美洲这块殖民地的兴趣来自一种偏执的种族地缘政治理论：白人文明必须在整个美洲大陆建立统治秩序，消灭一切土著和混血种族的政治影响力。宪政国在智利全面推行这套意识形态，白人至上主义从理论变成了法律，从法律变成了警察皮带和宪兵的靴尖。"
 CHL_Rely_on_military_rule:0 "依仗军队统治"
 CHL_Rely_on_military_rule_desc:0 "德帝国对智利的控制通过军队来实施，总督本人就是从德军总参谋部调任的老牌军官。智利本土军队被解散后重新整编，各级指挥官全部由德国军官担任，士兵属于智利人，指挥权属于柏林。军队统治除了维持秩序，还负责殖民地的经济计划执行和重大工程建设，军队把智利当成一座巨大的军营来管理，效率出奇的高，手段出奇的硬。"
 CHL_Establish_agricultural_college:0 "创建农业学院"
 CHL_Establish_agricultural_college_desc:0 "在智利南部推广农业技术，建立农业学院培训本地农民使用新式农具和耕作方法。这一切听起来像是殖民生涯中难得的善意，真相是农业学院的主要功能是研究如何提高单位面积的作物产量以便征收更多的实物税，它附带教给农民一些技术。农业学院是奥地利统治的典型产物，在文明使命的外衣下包裹着精细的剥削算计。"
 CHL_Revere_the_thoughts_of_Lebensphilosophie:0 "尊崇利本菲尔斯思想"
 CHL_Revere_the_thoughts_of_Lebensphilosophie_desc:0 "于尔格·兰茨·冯·利本菲尔茨，维也纳最恶名昭著的种族民粹理论家，他的思想在奥地利本土曾被主流学界嗤之以鼻，如今却在智利殖民地的奥地利人圈子里被奉为圭臬。利本菲尔茨鼓吹一种糅合了神秘主义、种族等级论和反现代主义的极端意识形态，主张雅利安优等民族有权奴役一切低等种族，鼓吹阉割劣等种族中的堕落分子来净化人类基因库。这个老恶魔的理论在殖民地找到了温床，隔离和暴力在殖民地本就是日常，利本菲尔茨思想不过是给已有的暴行提供了一套更加体面与体系化的说辞。"
 CHL_Introduce_suzerain_investment:0 "引入宗主投资"
 CHL_Introduce_suzerain_investment_desc:0 "智利的经济命脉重新对外敞开，这一次连体面的遮羞布都不需要了。铜矿、硝石、港口、铁路，宗主国资本以“重建援助”的名义蜂拥而入，收购价格低如旧货市场。本地的民族资本则被挤到墙角，赫然发现自己在真正的帝国主义面前不过是等着被吞并的小鱼。宗主投资是一种合法化的经济占领，签合同比开军舰更省钱也还要更有效。"
 CHL_Issue_martial_law:0 "颁布戒严令"
 CHL_Issue_martial_law_desc:0 "全国进入军事管制状态，一切公民权利暂停，一切公共集会需要提前审批，一切印刷品接受占领当局的审查。如有违反，军事法庭，速审速决。那些戒严令被贴在街区的公告栏上，被风吹雨打，内容渐渐的模糊了……"
 CHL_Silence_the_locals:0 "让当地人闭嘴"
 CHL_Silence_the_locals_desc:0 "将报纸停刊，将电台接管，将大学里发表过进步言论的教授被列入黑名单。占领当局对智利社会的言论控制细致到了教堂里的布道词——神父们被告知哪些话题可以讲，哪些绝对不许碰。把整个本土社会的发声器官一个一个摘除，让想说话的人找不到话筒，让有话筒的人不敢开口，让开过口的人再也没有第二次机会。"
 CHL_Expand_the_Imperial_United_Alliance:0 "扩展帝国联合同盟会"
 CHL_Expand_the_Imperial_United_Alliance_desc:0 "大英帝国在全球的殖民地和自治领通过帝国同盟联合会这个平台进行协调，智利被拉进来成为南美洲的分支机构驻地。联合会的日常工作是协调各殖民地的贸易政策、军事防务和情报共享，它的存在让智利殖民地直接嵌入大英帝国的全球网络，成为帝国在南锥体的支点。智利的铜和硝石等通过这个网络流向帝国各地，帝国各地的工业品和资本通过这个网络流回来，智利是这条利益链上的一个环节，被设计好了要永远停留在资源供应地的位置上。"
 CHL_Individual_conservative_aristocratic_legionism:0 "个人保守与贵族军团主义"
 CHL_Individual_conservative_aristocratic_legionism_desc:0 "英国殖民当局在智利推行一套结合了个人保守道德和贵族军团主义的治理理念。个人保守强调服从权威、恪守传统、压抑激进的社会变革欲望；贵族军团主义把殖民地官员塑造成兼具行政能力和军事素养的精英阶层，他们在牛津或桑赫斯特的母校塑造了他们苍白而笃定的价值观，他们将这些价值观带到智利，以此为基础建立一套层层效忠的等级体系。这些是英国统治的道德外壳，也是其军事骨架。"
 CHL_Eliminate_pseudo_nationalists:0 "消灭伪民族主义者"
 CHL_Eliminate_pseudo_nationalists_desc:0 "宪政国在智利面对一群尴尬的对手：那些曾经投靠合作者的本土民族主义者，他们在种族论面前站错了队——对宪政国而言，拉丁裔混血民族主义者也配自称白人吗！？我们将发动一场种族论对国族论的歼灭战，本土右翼的民族主义话语被宪政国的种族理论连根拔起，所有不能证明自己纯白血统的右翼分子都被从傀儡政权中清洗出去，只有血统纯正是比爱国更为根本的政治资格。"
 CHL_Labor_brings_freedom:0 "劳动带来自由"
 CHL_Labor_brings_freedom_desc:0 "集中营被俘的工团主义战士、不肯合作的工会领袖、在街上对德国士兵吐口水的青年学生，被成批成批地送进设有这句标语的营地。在采石场劳动到死可以让你从活着的痛苦中解脱。除了这些具体暴烈的部分，在民间生产当然也有这样的思想指导，也算作是某种标准化的管理工具，它在欧洲某些地方早已投入使用，漂洋过海来到智利之后依然运转如常。"
 CHL_Chilean_General_Staff:0 "智利总参谋部"
 CHL_Chilean_General_Staff_desc:0 "仿照德国总参谋部体制建立的智利军事指挥机构，名义上负责殖民地防务，实际上是将德帝国军事思想制度化地植入智利军队的骨髓。总参谋部的军官全部在德国接受过系统培训，参谋作业流程、作战条令和军事学术研究全部照搬德军范式。智利总参谋部培养德意志帝国在南美洲的军事代理人，这一代的军事精英们。"
 CHL_Pastoral_idyll:0 "田园牧歌"
 CHL_Pastoral_idyll_desc:0 "殖民当局把智利农村描绘成一幅田园牧歌的优美画卷，奥地利移民在安第斯山麓经营农场，本地农民在田里辛勤劳作，所有人在秩序与和谐中过着满足的生活。智利农民在地里流汗的时候，抬头就会被监工的木棍敲回去。那殖民宣传的杰作啊，每一幅宁静的乡村图景，由审查删减和武力威胁所拼贴。"
 CHL_Integrate_local_ethnic_groups:0 "整合本土民族主义者"
 CHL_Integrate_local_ethnic_groups_desc:0 "智利的民族主义者和占领者之间有一种奇特的默契。他们仇恨左翼，崇尚秩序和强权，对帝国主义没有天然的免疫力——帝国在他们眼里是值得效仿的强者，而强者的旗帜天然就该飘在弱者的头顶。占领当局拉拢这批人进入傀儡行政体系，给他们低级别的官职和有限的权力，让他们去管自己同胞的麻烦事。民族主义者的膝盖骨在外国人面前会自动软化，在同胞面前却又硬得能踢断肋骨，这种狗一样的天赋正是占领当局需要的。"
 CHL_Never_repeat_the_same_mistake:0 "不再重蹈覆辙"
 CHL_Never_repeat_the_same_mistake_desc:0 "十八世纪西班牙帝国在南美洲的统治之所以崩溃，一个重要原因是本土克里奥尔精英和帝国官僚之间的裂痕无法弥合，最终克里奥尔人举起了独立旗帜。占领当局现在不打算重复这个错误，我们的殖民机构被设计成一套封闭的、由宗主国直接掌控的体系，本土合作者永远只能当副手，永远接触不到核心决策层。不再重蹈覆辙，这一次殖民者不打算走了。"
 CHL_Continental_nationalism:0 "我们大洲的民族主义"
 CHL_Continental_nationalism_desc:0 "英国人在智利推广一种剥离反帝内核与一切可能指向英国的批判性内容的美洲民族主义，一种安全可控制的地区认同。这种民族主义教育智利人以南锥体为傲，以安第斯山脉为精神图腾，以美洲历史为荣……所有这些骄傲都在英国的政治框架内表达。在足球比赛和文化节上满足智利人的归属感，到了帝国利益面前就必须自动卷起来收进抽屉了。"
 CHL_Nordic_whites_are_supreme:0 "北欧白人至高无上"
 CHL_Nordic_whites_are_supreme_desc:0 "一切政治权利和经济特权会按肤色分配。欧洲白人移民在就业、教育和福利体系中占据金字塔顶端，肤色越浅越接近权力的中心，肤色越深越逼近生存的边缘。智利本土的混血人口在法律上被定义为有色人种，降为次等公民。一整套精密设计的种族等级制度扎根在每一个政府部门的档案柜和每一个企业的雇佣名册中，为智利的白人带来根本的福祉。"
 CHL_Aid_our_brothers:0 "援助我们的兄弟"
 CHL_Aid_our_brothers_desc:0 "宪政国向智利殖民政权持续输送军事援助：武器、教官、情报和宪兵顾问。智利被定义为白人文明在南美洲的前哨战场，对这个政权的军事援助被纳入宪政国全球白人秩序战略的预算。种族阵营的政治暗语如此，所谓兄弟的定义和血缘无关，只和至高无上的肤色正相关。"
 CHL_South_American_Prussia:0 "南美普鲁士"
 CHL_South_American_Prussia_desc:0 "智利被德帝国殖民体系重新塑造为一个军事化的纪律国家，俨然安第斯山脚下的小普鲁士。学校实行军事化管理，工厂按军营标准组织生产，地方政府仿照德国军管区的模式运转……每一个适龄男性都必须接受义务军事训练，每一个城镇都有定期操练的后备民兵。智利社会被从头到脚套上了普鲁士化的紧身衣，哪怕这层硬壳的下面是被压迫民族无声的喘息与磨牙蹑声。"
 CHL_Castrate_the_degenerate:0 "阉割堕落者"
 CHL_Castrate_the_degenerate_desc:0 "利本菲尔茨的极端优生学理论在殖民地立法中找到了出口：所谓的堕落者——包括惯犯、精神疾病患者和反复反抗殖民统治的政治犯——被施以强制绝育。奥地利人带来的医生穿着白大褂在专门设立的诊所里执行这些手术，他们的医学报告写得工整干净，完全不提手术台上被绑住手脚的人撕心裂肺的惨叫。以科学之名实施的暴行，所谓科学在这里是权力最忠实的婢女，优生学在任何地方和种族灭绝都是邻居。"
 CHL_Attract_Nordic_racial_immigrants:0 "吸引北欧种族移民"
 CHL_Attract_Nordic_racial_immigrants_desc:0 "鼓励适当的引进另一极的欧洲人口以充实智利国家的经济与人口结构，这些来自北欧的小市民与跨国商人在欧陆的纷争中显得不那么具有倾向性，同时还是所谓的日耳曼血统，他们一定会助力我们的国家建设一把的。"
 CHL_Destroy_the_Star_of_David:0 "毁灭大卫之星"
 CHL_Destroy_the_Star_of_David_desc:0 "智利有数量可观的中产阶级犹太社群，在商业、法律和医疗领域积累了相当的影响力。占领当局中那些从欧洲来的种族理论家很快盯上了他们，各种限制措施接踵而至：犹太裔公职人员被清退，犹太企业的营业执照被重新审查，犹太会堂受到严密监视。安第斯山脚下同样逃不掉清洗的命运，似乎种族仇恨在任何语言里都那样相似，难道我们以恨一致吗？"
 CHL_Return_to_traditional_order:0 "回归传统秩序"
 CHL_Return_to_traditional_order_desc:0 "英国殖民当局把智利社会重新拖回前革命时代的社会结构，旧贵族被扶植回来，教会重掌教育和道德教化权，严密的阶级等级重新确立。工团主义革命所摧毁的那些东西被一个接一个地恢复。文明的重建实际上是一次政治上的僵尸复活：使地主拿回了被没收的土地，主教回到了道德裁判席，工人回到了黑鞭下。"
 CHL_Aryan_Knights:0 "雅利安骑士团"
 CHL_Aryan_Knights_desc:0 "名为雅利安骑士团的准军事组织和一体化组织负责镇压有色人种反抗、维持种族隔离秩序和执行政治清洗。骑士团的骨干从宪政国和智利本土白人青年中招募，入团仪式使用仿中世纪的礼仪和符号，而其意识形态填充物是粗制滥造的种族神话和过量的仇恨。那是宪政国殖民统治的精神图腾和暴力工具，它相信自己代表文明——在美洲大陆上建造了欧洲新的黑暗天国。"
 CHL_Soul_of_Germania:0 "日耳曼之魂"
 CHL_Soul_of_Germania_desc:0 "帝国将智利视为海外殖民体系中最有潜力的一环，不只是资源，还有人的改造。日耳曼之魂运动推广德语教育、普鲁士式纪律训练和德意志文化认同，目标是培养一代精神上日耳曼化、身体上智利人的新殖民精英。操典的口令，政府机关的公文格式，连殖民地官员的制服都请了莱比锡的裁缝来打版。日耳曼之魂，那种族和文化的改造机器，它要把安第斯山脚下的这个狭长国家变成德意志精神在南半球的前哨站。"
 CHL_Ensure_church_loyalty:0 "确保教会忠诚"
 CHL_Ensure_church_loyalty_desc:0 "天主教会是智利社会中唯一能和占领当局讨价还价的本地势力。主教们在私下会谈中表达了担忧，对当局的一些做法颇有微词。占领当局的策略是一手给甜头，保证教会财产不受侵犯，赋予教会在教育和道德事务上的特权；一手施压，不合作的教区被切断财政补贴，不听话的神父被调离岗位。几个回合下来后大多数主教只有选择了沉默和配合。所谓上帝的归上帝，凯撒的归凯撒，送它去吧。"
 CHL_AngloSaxon_wisdom:0 "盎格鲁撒克逊之智"
 CHL_AngloSaxon_wisdom_desc:0 "这种文化在智利殖民地的渗透强调实用理性的路子。行政管理以效率和克制著称，殖民地官员被训练成冷峻、寡言、精于计算的技术官僚，热衷于用自由贸易的理论论证殖民体系的合理性，再注入一套更粗犷的种族实用主义，那纯粹的等级意识和毫不遮掩的优越论。在北半球的盎格鲁帝国沉溺于此的同时，南半球也在迎头追赶这一黑暗的精湛传统。"
 CHL_Racial_welfare:0 "种族福利"
 CHL_Racial_welfare_desc:0 "占领当局为本国移民和驻军家属设立了一套单独的福利体系，住房、医疗、教育全都和当地居民隔离开来，其标准高出了本地人一大截。占领者的生活质量必须显著高于被占领者，这是维持统治权威的必要条件。种族福利是殖民统治的润滑剂，它让每一个普通白人移民都觉得自己是帝国荣光的一部分，在智利人面前天然高人一等。"
 CHL_Colonial_corporatism:0 "殖民地法团主义"
 CHL_Colonial_corporatism_desc:0 "经济被按行业重新组织，由占领当局任命的主席全权负责新设立的法团委员会。这套制度从欧洲法团主义理论中借来了名词的外衣，填充进去的则是赤裸裸的殖民控制：法团委员会负责分配生产配额、制定工资标准和压制劳工运动。殖民地法团主义是一套效率极高的经济奴役体系，它把整个智利经济变成了为宗主国服务的加工车间。"
 CHL_Dignified_colonies:0 "尊严殖民地"
 CHL_Dignified_colonies_desc:0 "占领当局在圣地亚哥郊区和其他主要城市兴建了一批所谓尊严殖民地设施，配备现代化供水、供电和医疗设施，表面上看是对占领区的基础设施投资。实际上这些区域多是为占领者及其家属修建的封闭社区，高墙铁丝网环绕，下等人未经许可不得入内。这种“尊严殖民地”就是殖民统治的空间化表达，它在物理上把占领者和被占领者隔成了两个世界，前者的世界里绿树成荫，后者的世界里尘土飞扬，一道大门锁住，于是所有关于平等的幻觉消亡。"
 CHL_Vanguard_of_antisyndicalism:0 "反工团主义先锋"
 CHL_Vanguard_of_antisyndicalism_desc:0 "智利的工团主义运动是南锥体最顽强的革命力量，即便在军事失败之后仍然在各地工会的地下室里保持着组织抵抗。占领当局将镇压工团主义列为首要任务，宪兵队和情报部门在外日夜搜捕工会骨干，被捕者被关进临时设立的拘留营。法律程序被简化到接近于不存在，或者是干脆取消，审问和定罪之间的间隔短得来不及请什么律师。连宗主国都要表彰他们在南美洲为全球反共事业做出的贡献。"
 CHL_Cultural_enlightenment:0 "文化启迪"
 CHL_Cultural_enlightenment_desc:0 "占领当局在推行一整套文化殖民政策，宗主国语言被列为学校必修课，本地历史教材被改写以突出欧洲文明对南美洲的启蒙和拯救使命。智利的艺术家和作家如果还想继续发表作品就必须通过文化审查委员会的审批，委员会由一群从宗主国大学调来的老文学教授们控制，他们的学术专长是论证殖民地文化相对于宗主国文化的结构性低劣事实。"
 CHL_Tame_the_Southern_Cone:0 "驯服南锥体"
 CHL_Tame_the_Southern_Cone_desc:0 "整个南锥体在占领者眼里就是一头需要驯化的野兽，野性难改，时不时就要龇牙咧嘴地挣扎。驯服的手段包括军事镇压、经济控制和思想改造的立体化组合，几十年的革命与进步传统正在被一寸一寸地从智利社会的肌体中剜去。哪怕其进度比预期的慢，这一工作也被持续的开展下去。占领当局很清楚驯服南锥体需要至少一代人的时间，他们有耐心，他们手里的枪也有耐心……"
 CHL_Glory_is_loyalty:0 "荣耀即忠诚"
 CHL_Glory_is_loyalty_desc:0 "既然占领政权向宗主国宣誓效忠，这份忠诚就被定义为殖民地政府的最高政治准则。军事服从、经济配合、文化追随、外交一致。智利的外交代表权由宗主国统一行使，智利的军队编入帝国联合作战体系，智利的经济计划提交宗主国审核。智利的名字还在地图上，其主权如今并不存在，是被帝国主义吞掉了。"
 CHL_Take_back_the_country:0 "夺回国家"
 CHL_Take_back_the_country_desc:0 "我们还有更巨大的野心，不想再做他们殖民地的总督了，想做独立的独裁者。这条路的尽头是向宗主国反目，以本地强人的身份重塑政权合法性，很难说有哪些人可以在这条道路上成功。"
 CHL_Crimson_Southern_Cone:0 "深红南锥体"
 CHL_Crimson_Southern_Cone_desc:0 "所有政策的终点都在这里。国有化为人民，科技投资为人民，人民阵线为人民，工会和青年团为人民。智利的劳动者在这个时期获得的权利、福利和尊严在拉丁美洲范围内没有第二个国家可以相比，哪怕它的代价是曾经顽固的财政赤字与国际资本的全面围堵。我们的困难比山高，我们手上有一样东西谁也拿不走，人民和我们站在一起，人民会帮助我们与革命获得胜利！"
 CHL_Recabaren_and_the_Trade_Unions:0 "雷卡巴伦与工会"
 CHL_Recabaren_and_the_Trade_Unions_desc:0 "党内路线问题摆上台面后，是路易斯·埃米利奥·雷卡巴伦胜出。雷卡巴伦的路线指向一个明确的方向，即共产党必须和工团主义者产生合作，以结束工会运动的分裂态势与接入国际工团主义。工团主义者不管多顽固与反感政党的纪律，他们目前手底下毕竟组织着几十万工人群众，我们恐怕不可能绕过工会去联系工人阶级。"
 CHL_Between_the_Syndicalists_and_the_Communists:0 "工团与共产之间"
 CHL_Between_the_Syndicalists_and_the_Communists_desc:0 "工团主义者信仰直接行动和工会自治，共产党人坚持党的领导权和政治挂帅，两边辩论多年，但眼下有更重要的事情要做：联合对抗资本反扑、协调产业政策、同时防止帝国主义利用工会分裂来瓦解革命阵线。拉拢是手段，融合是目标，共产党向工团主义者以捍卫革命的决心与善意去伸出手，工团主义者敢不敢握是另一回事，我们先把手伸出去了。"
 CHL_For_the_Freedom_of_the_People:0 "为了人民之自由"
 CHL_For_the_Freedom_of_the_People_desc:0 "共产党的自由观和资产阶级的自由观不可同日而语。资产阶级自由是资本的自由、剥削的自由、把工人当商品的自由，人民自由是劳动者从剥削中解放出来的自由、反压榨反童工的自由、让群众能读书认字参与政治的自由。共产党人终生都在为这个真正的自由而战斗。"
 CHL_Gallo_and_the_Hardliners:0 "加洛与强硬派"
 CHL_Gallo_and_the_Hardliners_desc:0 "党内路线问题摆上台面，是主席加洛·冈萨雷斯·迪亚兹胜出。加洛在智共内部代表最硬的一派，其布尔什维克道路经过他自己对智利国情的调整，核心是铁的纪律和毫不妥协的阶级斗争。软弱是革命的癌症，妥协是慢性自杀，强硬路线在党内获得多数支持本身就能够或多或少说明党员队伍当前的心理状态：革命四面受敌，怎能一时变幻。"
 CHL_The_End_of_the_Speculators:0 "投机者的末日"
 CHL_The_End_of_the_Speculators_desc:0 "革命胜利之后又从我们曾经没有看见的地方冒出来一大批投机商和两面派，他们换上革命的外套，嘴里念叨着进步的词句，手底下继续干着倒卖物资、囤积居奇、拉拢腐蚀干部的勾当。发现一个，清理一个。革命法庭对投机者的判决没有拖泥带水，经济犯罪和反革命破坏在战时同罪。这些人在旧社会活得滋润，在新社会必须让他们活不下去，投机者的末日就是革命法制的黎明。"
 CHL_Towards_Party_Purity:0 "迈向党内纯净"
 CHL_Towards_Party_Purity_desc:0 "党的肌体里不能有恶心的寄生虫。加洛推动的党内审查覆盖全部党员，从中央委员到基层支部，档案、财产、社会关系逐一核查。生活腐化的清除，政治立场摇摆的清除，历史上有可疑背景的清除，哪怕或许误伤好人使其失去党籍。审查从严，定性从实，有错必纠，决不手软。党内纯净是革命政权免疫力的来源，我们不要做一个注水党派，就像那豆腐渣工程的桥梁。"
 CHL_Restore_the_Peoples_Soviets:0 "恢复人民苏维埃"
 CHL_Restore_the_Peoples_Soviets_desc:0 "苏维埃是工人阶级政权的组织形式，在战时的一些权力洗牌中苏维埃的地位被各种临时机构冲淡或者代替了。恢复人民苏维埃也代表我们重新确立苏维埃作为最高权力机关的地位，一切重大决策必须经过其审议表决。苏维埃代表不是职业政客而是来自车间和田间，不脱产与随时可以罢免的代表显然比资产阶级民主高明太多。"
 CHL_Defend_the_Fruits_of_the_Revolution:0 "捍卫革命果实"
 CHL_Defend_the_Fruits_of_the_Revolution_desc:0 "活的、会呼吸的、每天都在被国内外敌人觊觎的就是我们的成果。捍卫革命的果实需要武装力量时刻待命，情报系统时刻警觉，党员群众皆具备政治嗅觉。帝国主义不会甘心失去智利的市场与资源，国内被没收了财产的阶级不会甘心失去特权与地位，这两股力量早晚要合流反扑。被动防御只会落了下乘，应当准备好把反扑变成对敌人的彻底清算。"
 CHL_The_Dawn_of_the_Revolution:0 "革命之黎明"
 CHL_The_Dawn_of_the_Revolution_desc:0 "最黑暗的时刻已经过去了，地平线上亮起来的，是革命的曙光闪耀！智利工人阶级无时无刻不企盼着黎明，数十年如一日痛断肝肠，灰蒙蒙压在眼前，那挥之不去的反动现实。无数次罢工、镇压、屠杀和战争历历往矣，结果我们已经胜利。赤红的颜色，滚烫的温度，轰鸣与欢笑，动作像舞蹈，声音像歌唱。前面还有乌云风暴，只要一时红日在天，未有世事难料，不见举世可敌。"
 CHL_La_Barca_and_Internationalism:0 "拉巴尔卡与国际主义"
 CHL_La_Barca_and_Internationalism_desc:0 "党内路线问题摆上台面，而后卡洛斯·拉巴尔卡胜出，这个结果出乎很多人的预料。拉巴尔卡在党内长期不受欢迎，他的所谓国际主义立场在很多人看来过于极端，他的托洛茨基主义倾向让他一直处于边缘位置。拉巴尔卡的胜利说明党内有一股暗流在涌动，认定革命或许将要以激进甚至不计后果的方式走出智利。"
 CHL_The_Legacy_of_Trotsky:0 "托洛茨基的遗产"
 CHL_The_Legacy_of_Trotsky_desc:0 "托洛茨基在十月革命失败后的漫长流亡中被全世界反动派追杀，最终不知所踪。拉巴尔卡把这份遗产从新发掘：如不断革命论、对官僚主义的预警、国际革命的优先性等观念。托洛茨基的很多判断在今天看来不是完全没有道理，官僚机器对革命热情的吞噬就是活生生的例子。不过继承托洛茨基的遗产也不意味着全盘照搬，拉巴尔卡也对其做了很多务实的实践修改。"
 CHL_Democratic_Legitimization:0 "民主合法化"
 CHL_Democratic_Legitimization_desc:0 "永远以战时状态的名义取消一切政治自由的革命专政是不可行的，这是拉巴尔卡在党内最受争议的观点。无产阶级专政也需要法制的框架，苏维埃内部的民主程序也要得到尊重，党员在组织内部的批评权利不能被纪律压制，好防止个人专断和官僚暴政在革命的名义下滋生。"
 CHL_Reclaim_the_Mining_Industry:0 "收回矿产业"
 CHL_Reclaim_the_Mining_Industry_desc:0 "铜和硝石是智利的血管，几十年里一直插在外资和买办寡头的吸管底下。帝国主义公司从智利的矿山里抽走了多少财富，留给智利工人的就只有肺病和棚户区。一块矿石都不留给外国资本，补偿金按革命政府评估的资产残值支付，也不接受任何国际仲裁。任凭董事会们可拍桌子，舰队开到公海上示威，可是智利的矿山从此姓了共。"
 CHL_Full_Nationalization_of_Industry:0 "工业全面国有化"
 CHL_Full_Nationalization_of_Industry_desc:0 "收回矿山只是第一步，整个工业体系都要从旧资本手中拿过来。纺织厂、食品加工厂、机械制造车间、港口装卸公司，大小企业统统国有化，不给资本家留一条后路。我们知道小资产阶级会哭穷，会说自己不是剥削者是勤劳致富的模范，这些说辞在革命法庭面前没有用。生产资料属于全体劳动者是社会主义的经济基础，基础不稳迟早造成上层建筑碎裂崩塌。"
 CHL_Everything_to_the_Party:0 "一切全归党"
 CHL_Everything_to_the_Party_desc:0 "一切权力归苏维埃！苏维埃的核心是党，党是无产阶级的先锋队，是革命的头脑和拳头。国家机器、经济命脉、文化阵地、武装力量，全部归党领导，不允许在党的指挥链之外存在任何独立的政治实体。工团主义者想自己管工厂，自由派想保留议会里的反对党席位，教会想维持对社会道德的仲裁权，简单的答案是全部休想。党领导一切，这一条没得商量。"
 CHL_Embrace_the_Technocrats:0 "拥纳技术官僚"
 CHL_Embrace_the_Technocrats_desc:0 "革命需要工程师和经济学家，让懂行的人来管理被没收的工厂和矿山。如果不反对革命，愿意用自己的专业知识为无产阶级政权服务，党就给他们岗位和信任。政治标准与专业标准要兼具，不懂行的人硬要指挥生产只会把革命的脸丢光。因而体制一定需要吸收技术官僚来充实管理层面。"
 CHL_Reform_the_Soviet_System:0 "改革苏维埃体制"
 CHL_Reform_the_Soviet_System_desc:0 "苏维埃体制是革命的骨架，政权没有它就站不住。体制改革瞄准了官僚主义苗头和阶级异己分子的渗透，纯洁苏维埃比扩大苏维埃要更紧迫。选举程序要收紧，代表资格审查要从严，混进苏维埃的投机商和两面派必须被清洗出去。革命政权的稳固从于纪律，没有幼稚的宽容可言。"
 CHL_Proletarian_Cultural_Revolution:0 "无产阶级文化革命"
 CHL_Proletarian_Cultural_Revolution_desc:0 "无革命还要打进每一个人的头脑，把旧世界埋在那里的毒刺毒草一根根拔除。无产阶级文化革命是思想领域的阶级斗争，为清除封建残余、资产阶级个人主义和宗教麻醉剂的全面攻势。看我们进攻文教，发动群众整顿媒体，批判社区中沿用的陋俗旧习。文化阵地是必须要争取的阶级斗争战场，无产阶级不在这个战场上主动进攻，资产阶级就会从里面反攻出来。"
 CHL_The_Eternal_Communist_Party:0 "永恒的共产党"
 CHL_The_Eternal_Communist_Party_desc:0 "没有共产党，智利就难有今天；没有共产党，智利就没有明天。资产阶级政党轮流坐庄几十年，只留下遍地贫困、文盲和外国资本的殖民地式掠夺。革命胜利后一些人又开始幻想多党制和自由选举，幻想回到那个有钱人坐沙发、穷人蹲门槛的旧社会。共产党将轻松粉碎这些幻想，明确无误地告诉全国劳动者智利只有一个政党配得上执政，历史作证，人民作证！"
 CHL_Lenin_Sets_Foot_in_the_Southern_Hemisphere:0 "列宁踏足南半球"
 CHL_Lenin_Sets_Foot_in_the_Southern_Hemisphere_desc:0 "列宁主义翻过了安第斯山脉，跨过了太平洋，来到了遥远的南锥体矿山与港口中。列宁用于清扫旧世界渣滓的扫帚随即而至——布尔什维克的经验和原则在智利落地生根，南锥体的革命者在列宁的旗帜下列队，沿着他指出的方向继续将害人虫一扫光。任凭资本家仇恨，但教反动派灭亡！"
 CHL_The_Path_to_Chilean_Socialism:0 "智利社会主义之路"
 CHL_The_Path_to_Chilean_Socialism_desc:0 "硝石矿工的罢工棚屋，然后是码头工人和军警搏斗的栈桥，那地下党在烛光下印出的第一张传单……一路战斗，一路胜利。无人有恩赐，无人能代劳，智利无产阶级用自己的鲜血与宝贵的生命一步一步走来。前方还有帝国主义封锁、国内反扑和建设途中的种种难题，这些都吓不倒共产党人。不是温良恭俭让，革命之路是铁花泵火，强风中嘹亮的高歌。"
 CHL_Inspire_Revolutionary_Art_and_Literature:0 "鼓舞革命文艺"
 CHL_Inspire_Revolutionary_Art_and_Literature_desc:0 "艺术不能吊在资产阶级趣味的裤腰带上晃荡，革命需要革命的文艺，它能点燃群众、羞辱敌人、协助启蒙与教育劳动者。把那些无病呻吟的，用来洗钱的高雅抽象画从美术馆里请出去，把为矿工和码头工人创作的诗歌刷到工厂的墙上。革命的文艺不怕粗糙狂野直白见血，和旧世界同流合污才是可怕的低俗。作曲家和诗人如果还在为沙龙里的贵妇服务，他们的作品便配不上这个时代，革命会自己动手创造出配得上的东西。"
 CHL_Learn_from_the_Lessons_of_Red_October:0 "吸取红十月的教训"
 CHL_Learn_from_the_Lessons_of_Red_October_desc:0 "十月革命在俄罗斯失败后，白军反扑成功使得苏维埃政权被绞杀，全世界革命者从这场失败中汲取的教训比从任何胜利中汲取的都要多。原来革命不能只靠城市暴动，农村的根基也必须打牢；革命不能容忍内部派系的无休止争斗，党必须在思想上高度统一；革命不能指望敌人的仁慈，对反动派的一丝宽容就是对自己人的万箭穿心。红十月的失败是列宁主义在全世界的预警信号，永远不能忘。"
 CHL_The_Revival_of_Vanguardism:0 "先锋主义复兴"
 CHL_The_Revival_of_Vanguardism_desc:0 "党是无产阶级的先锋队，先锋队不能躲在群众后面当尾巴。党员在车间里必须是产量最高、最能吃苦的那一个，在战场上必须是冲在最前面的那一个，在政治斗争中必须是立场最坚定、嗅觉最敏锐的那一个，在艺术创作上也是最激情，最不畏旧世界评判的那一个。前卫的斗争指导并伴随着我们！"
 CHL_Covarrubias_and_the_Orthodox:0 "科瓦兰与正统派"
 CHL_Covarrubias_and_the_Orthodox_desc:0 "党内路线问题摆上台面，最终路易斯·科瓦兰胜出。科瓦兰在智共内部是正统马克思列宁主义的守护者，对各种修正主义和改良倾向深恶痛绝。他的理论功底扎实，判断不带个人感情，政治判断力在党内公认稳当。马克思和列宁的原典就是足够用的武器库，革命不需要在科学理论之外另起炉灶。"
 CHL_Promote_Bolshevization:0 "推动布尔什维化"
 CHL_Promote_Bolshevization_desc:0 "布尔什维化使得民主集中制全面贯彻、党的基层组织扎根深厚、党员的政治教育和军事训练并重、派别活动被严格禁止。这份方案不带任何折中色彩，党内的自由主义和个人主义是必须被清理的杂质，党的战斗力是一切革命成果的前提。"
 CHL_Neruda_and_Art_and_Literature:0 "聂鲁达与文艺"
 CHL_Neruda_and_Art_and_Literature_desc:0 "党内路线问题摆上台面，巴勃罗·聂鲁达胜出。这个名字在整个西语世界都响当当，智利最伟大的诗人，共产党的文化旗帜。聂鲁达在党内一直负责文化工作，他的胜选意味着文艺战线被提升到了战略高度。聂鲁达的路线是创作自由与文艺进步主义的并行，不给艺术家戴枷，而提供最广阔的创作空间和最沸腾的生活素材。"
 CHL_The_Fusion_of_Dreams_and_Fire:0 "梦与火之交融"
 CHL_The_Fusion_of_Dreams_and_Fire_desc:0 "梦需要火的温度才能燃烧，火需要梦的光彩才能照亮人心。正如我们的诗艺与革命之道。放手去创作吧！革命的现实太丰富了，那时矿工占领矿山，昨天农民拿到地契，凌晨码头工会在暴风雨中升起红旗，诗、画、歌。不需要规定主题和风格，现实本身已经足够震撼，艺术家要做的就是致力于把这些震撼凝聚在作品中。"
 CHL_Invest_in_Artistic_Groups:0 "投资艺术团体"
 CHL_Invest_in_Artistic_Groups_desc:0 "革命政府从预算中拨出专项资金支持各类艺术团体，诗人协会、壁画工作坊、工人剧团、民间乐队都在这份名单上。共产党对文艺的投资不设意识形态预审，艺术团体只要不公开反对革命政权都可以申请资助。文化的繁荣是革命成功的硬指标，一座没有歌声与欢笑的城市在社会主义的天空下是不可想象的。"
 CHL_Face_the_Future:0 "直面未来"
 CHL_Face_the_Future_desc:0 "南锥体的社会主义革命走到了今天这一步，脚下是无数烈士的骸骨，头顶是未完成的理想和未兑现的承诺。未来不会自动变得更好，帝国主义封锁着，国内反动势力潜伏者，建设的道路上布满了弹坑和弯路。曾有一片虚构的玫瑰色远景，供许多不坚定者来麻醉自己，现在共产党人已经将这无用幻象驱散，他们知道前面还有硬仗要打，还有牺牲要付出，这一切都挡不住队伍继续向前的脚步。这一代又一代人接力长跑的革命事业，已是在未来的地平线上等待我们了。"
 CHL_Oppose_Organized_Misery:0 "反对组织苦难"
 CHL_Oppose_Organized_Misery_desc:0 "怎把受苦当成美德来歌颂？旧社会给劳动者制造了无边的苦难，革命美学的任务是消灭它们。不要写那种把工人永远塑造成可怜可悲的受苦者，工人是胜利者，是建设者，是正在改写历史的巨人，是改变现实的圣贤。苦难不配被歌颂，战胜苦难的力量才配。"
 CHL_Protect_Cultural_Heritage:0 "卫护文化遗产"
 CHL_Protect_Cultural_Heritage_desc:0 "革命可不搞文化虚无主义，人类文明史上一切优秀的文化遗产都是革命者的财富。殖民时期的教堂建筑是宗教压迫的现世展示，其中的艺术价值也值得保护和研究；资产阶级作家的小说清楚的显明了什么叫做在政治上落后于时代，不过文学技艺仍然可以作为社会主义文艺的养分。卫护文化遗产是共产党文化自信的表现，只有对自己的革命事业充满信心的人，才敢坦然面对旧世界留下的一切，取其精华，弃其糟粕。"
 CHL_Roca_and_Surrealism:0 "罗卡与超现实主义"
 CHL_Roca_and_Surrealism_desc:0 "党内路线问题摆上桌面，帕布罗·罗卡胜出，这个结果让党内的各派差点把茶杯摔在地上。罗卡是著名的超现实主义分子，他的艺术理念在很多人看来和共产党的唯物论水火不容，政治言论还要出格——列宁同志是现代的耶稣，革命的弥赛亚。罗卡的胜选说明智利共产党的文化土壤比任何人想象的都更开放，以至于愿意接受理论上的冒险和冲击……"
 CHL_The_Beauty_of_Creationism:0 "创造主义之美"
 CHL_The_Beauty_of_Creationism_desc:0 "劳动者的精神需要美的滋养，需要创造主义的激情。工人们在休息时间可以参与壁画创作，新建的工人住宅区的外墙上涂满了超现实风格的彩绘。创造主义之美是对灰暗乏味的旧生活的彻底否定，是对劳动者精神世界的彻底解放，一日它要激发革命群众对生活的激情与热爱。"
 CHL_When_Lenin_Met_Jesus:0 "当列宁遇见耶稣"
 CHL_When_Lenin_Met_Jesus_desc:0 "带着被压迫者走出帝国主义的埃及，列宁就是我们的先知！宗教词汇在共产党的话语体系里是禁忌，罗卡却毫不客气地将其打破，用教徒的语言去定义革命者的神圣性。这种表达方式引爆了无数基层党员的想象力。难道木匠神明和神一般的工运导师真的见面了吗？"
 CHL_Velvet_Glove:0 "天鹅绒手套"
 CHL_Velvet_Glove_desc:0 "咯吱作响的铁拳缩进了天鹅绒的手套里。接过达维拉垮塌后的残局，他们彬彬有礼，他们西装革履，他们在议会里使用宪法条文互相致意，他们笑得精心，带着怀柔的面孔与威权的内核。民主回来了，回到了一群不相信民主者手中。天鹅绒手套的做工极其考究，面料柔软，触感温润，戴在手上显得文明而克制——手套里面裹着的指关节在握紧的时候却和军靴踏步的声响那样相似。"
 CHL_Agricultural_Workers_Party:0 "农业工党"
 CHL_Agricultural_Workers_Party_desc:0 "农业工党走上了执政前台。散发着泥土和传统的气息，他们的根基在南方的庄园和农村合作社中，那些城市革命的浪潮未能实际淹没的广阔田野上。农业工党的领导层是大地主、富农和农业技术官僚的混合体，认定智利的灵魂不在冒烟的工厂烟囱而在安第斯山麓的麦田和葡萄园中。土地是最诚实的生产资料，农民是最可靠的国民，城市工人和街头革命者则是需要被纠正的迷途羔羊。"
 CHL_National_Revival_Party:0 "国家复兴党"
 CHL_National_Revival_Party_desc:0 "国家复兴党接过了执政的接力棒。党的骨干来自旧军政府的文职官僚、失意的民族主义知识分子和战后涌现的保守派青年注入。自诩为智利走出泥潭的领路人，他们的口号是秩序、发展和尊严。秩序排在最前面，发展依靠外部投资，尊严的前提是要有人闭嘴服从。"
 CHL_Liberal_Democratic_Center:0 "自由民主中心"
 CHL_Liberal_Democratic_Center_desc:0 "自由民主中心在右翼阵营中自诩为最文明的派别，它代表了城市中产阶级和专业人士对秩序和自由的折中渴望。自由民主中心对军权政府的粗暴记忆犹新，对国家复兴党的威权倾向相对警惕，对左翼的社会革命则更是怀有根深蒂固的恐惧。他们想要的是有秩序的自由、有门槛的民主、有管制的市场。"
 CHL_Agricultural_Protectionism:0 "农业保护主义"
 CHL_Agricultural_Protectionism_desc:0 "外国农产品不配和智利农民在同一张餐桌上竞争！农业保护主义的关税壁垒被筑得又高又厚，进口粮食和肉类在智利市场上被课以重税，价格被抬得高比雪线。智利的土地应当供养智利的人民，智利的农民应当在自己的土地上活得体面。那些城市消费者抱怨粮价上涨，你们在工厂里罢工要求涨工资的时候可从没替农民的收购价着想过，现在轮到农民自己了。"
 CHL_Guild_Substitution_for_Work_Groups:0 "以行会代工团"
 CHL_Guild_Substitution_for_Work_Groups_desc:0 "工团主义是城市的病毒，它把工人组织起来对抗雇主和国家，这是对自然秩序的亵渎。农业工党用传统的行会体制来取代工团主义工会，行会按行业组建，师傅、学徒和业主坐在同一个委员会里接受国家指导，劳资矛盾在行会的框架内被消解为技术性的意见分歧。罢工的权利被行会规章巧妙地阉割，工人被重新定义为“行会成员”，其成员身份的首要义务是维护行会的荣誉和团结，对抗雇主则不属于团结的范畴。"
 CHL_Privatized_Enterprises:0 "私有化企业"
 CHL_Privatized_Enterprises_desc:0 "军政府留下的国有化遗产被清理了，国有企业也被分批出售给私人资本。矿山、铁路、港口和制造工厂重新回到了企业家手里，出售价格被确保私人买家获得足够的利润空间。私有化企业是我们经济路线最核心的内容，国家从经济领域撤退的过程被包装为经济自由化的必要步骤，撤退的速度和私人资本接收的速度配合得天衣无缝，堪称完美。"
 CHL_Calpara_Spring:0 "加尔帕之春"
 CHL_Calpara_Spring_desc:0 "经济复苏的暖风吹来了，加尔帕，圣地亚哥的富人区，梧桐树遮蔽的街道两侧排列着殖民时代风格的宅邸和新落成的现代公寓。外贸回升、铜价走稳、外资重新流入，经济数据在连续几年的下跌之后终于又开始抬头。后世称为加尔帕之春时间的受益者是智利社会的上层与中上层，他们在梧桐树荫下举杯庆祝经济回暖，开了一瓶又一瓶好香槟。同一时间，贫民区的铁皮棚户里大家仍然在烧柴火取暖。"
 CHL_Non_Red_Progress:0 "非赤化之进步"
 CHL_Non_Red_Progress_desc:0 "这是一套排斥左翼的进步观，认为进步必须是经过消毒的非赤化产品。经济增长、科技进步和社会改良都可以搞，其条件是不能沾染任何社会主义的红颜色。工人福利可以适度提高，但提高的方式必须通过老板的慈善和政府的补助，不能通过工会主动抗争。就像一条狭窄的独木桥上推着独轮车前行，既要进步又不要进步所必然伴随的社会动员。"
 CHL_Revelation_of_Free_syndicalism:0 "自由工团之启示"
 CHL_Revelation_of_Free_syndicalism_desc:0 "工团主义不能全盘否定，自由民主中心从中获得了一项关键启示：工人需要组织，组织需要被引导。自由工团方案将工会改造成企业管理层的合作伙伴，生产效率和劳资和谐取代阶级斗争成为工会的核心使命。这套方案在某些欧洲国家已经被证明是有效的，智利只需要把那些经验本土化。"
 CHL_Experience_of_Truck_Drivers_Union:0 "卡车司机联合会的经验"
 CHL_Experience_of_Truck_Drivers_Union_desc:0 "卡车司机联合会是政府眼中最理想的工会样板。该联合会控制着全国运输命脉，其领导层和资方长期保持着良好的合作关系，工资谈判总是在罢工威胁出现之前就和平达成协议。联合会的领导人在公开场合谈论的是运输行业的专业性和对国民经济的责任，几乎不提阶级斗争，这种工会才是自由民主中心想要在全国推广的合法合理的标杆。"
 CHL_Condemnation_of_Individual_Socialist_Degeneration:0 "谴责个人社会主义堕落"
 CHL_Condemnation_of_Individual_Socialist_Degeneration_desc:0 "个人主义把每个人都变成孤岛，孤岛上的人不问彼此死活只问自己快活。智利的道德家们在公开演讲中猛烈抨击城市社会的原子化堕落产生离婚率上升、传统家庭解体、年轻人不再去教堂、街头充斥着来自外国的低俗音乐和伤风败俗的服装等现象。明明白白的，智利社会在自由主义和个人主义的双重腐蚀下正在走向道德破产，要叫停这场堕落。"
 CHL_Promotion_of_Economic_Liberalization:0 "推动经济自由化"
 CHL_Promotion_of_Economic_Liberalization_desc:0 "关税壁垒被逐步拆除，外国投资限制被放宽，劳动力市场被解除管制。智利开展经济自由化的理论依据来自一系列从北半球引进的经济学教科书，实际效果是智利市场重新对外国商品和资本敞开大门。国内中小企业在外国巨头的竞争压力下哀鸿遍野，可是反正市场不怜悯弱者，竞争才是效率的唯一裁判。"
 CHL_Broad_Political_Party_Alliance:0 "广泛政党联盟"
 CHL_Broad_Political_Party_Alliance_desc:0 "国家复兴党不满足于单独执政的有限权力，广泛政党联盟被搭建起来，从温和自由派到保守教权派的政治势力都被纳入执政框架。虽然联盟内部争吵不断，利益分配每半年就要重新谈判一次，联盟的核心黏合剂是共同反共。只要能守住这条底线，内部的一切矛盾都可以在暗室里协商解决。"
 CHL_Splitting_Socialist_Party:0 "分化社会党"
 CHL_Splitting_Socialist_Party_desc:0 "社会党在战后的智利仍然拥有相当可观的群众基础，我们认为正面取缔它付出的代价会太大。分化手段被运用得娴熟、耐心而狡猾：向温和派社会党人开放政府职位，资助社会党内部的调和主义派系，在社会党的工会阵地中收买摇摆的基层干部。社会党中那些不坚定的分子在政府提供的位置上坐稳之后，他们的政治资本就自动从社会党转移到了执政联盟的账上。"
 CHL_Legacy_of_Housing_Front:0 "住房阵线的遗产"
 CHL_Legacy_of_Housing_Front_desc:0 "住房阵线原是左翼工团主义在住房领域的组织，自由民主中心在执政后本没有全盘摧毁它，对它的组织网络和动员机制进行了彻底的改造并吸收。住房阵线的社区网络被保留下来，人事则换了一遍，原来的革命口号被替换为社区服务和一些如家庭价值的说辞。吸收住房阵线的经验证明了自由民主中心更愿意接管理论上属于敌人的产业，把左翼的组织遗产洗干净之后变成自己的选举机器。"
 CHL_Encouragement_of_Entrepreneurial_Spirit:0 "鼓励企业家精神"
 CHL_Encouragement_of_Entrepreneurial_Spirit_desc:0 "企业家是社会的榜样，他们创造就业、贡献税收、在市场竞争的惊涛骇浪中驾驶着产业的船只。我们颂扬企业家精神！近乎崇拜的热忱使得官方宣传中成功商人被塑造成民族英雄，政府向优秀企业家颁发勋章如“劳动与创造之星”。工人被反复教导要感谢他们的雇主提供了饭碗，智利需要更多的企业家和更少的工会领袖。企业家在赞扬声中欣然接受了低税率和宽松的劳动法规，榜样在利益面前也总不糊涂。"
 CHL_Feminism_New_Connotations:0 "女权主义新含义"
 CHL_Feminism_New_Connotations_desc:0 "国家复兴党内的保守女性活动家们提出了一套十分独特的女性主义论述，将女性权利重新定义为母亲、家庭守护者和道德教育者的权利。女性参政不是为了让女人像男人一样去竞争和对抗，而是让女性特有的温柔和道德“感化”公共事务。这套论述在社会上层女性中意外的获得了一定市场，将女权话语嫁接到了保守主义传统的树干上，那花朵开得很体面，不过大家会选择性忽略其根脉仍然扎在旧土壤里。"
 CHL_New_Authoritarian_State:0 "新式威权国家"
 CHL_New_Authoritarian_State_desc:0 "国家复兴党的政治理想是回到军政府时代的赤裸裸暴力统治吗？那就落了下乘了，建立一套新式威权国家才是他们的诉求。在那里法治被保留为统治的外壳，在那里宪法被修改以扩大行政权力，在那里议会仍然开会但只能讨论政府允许讨论的议题。精致之处在于它懂得用合法程序包装专制实质，通过一部修改过的选举法来确保反对党永远赢不了，自然比出动军队包围议会要聪明得多……在那里，那里很快就是这里了。"
 CHL_Between_Progress_and_Conservatism:0 "进步与保守之间"
 CHL_Between_Progress_and_Conservatism_desc:0 "自由民主中心的政治定位本身摇摆不定，在进步和保守之间不断调整重心。对保守派说自己是不总是进步的，对进步派则说自己是负责任的。这种摇摆在外界看来似乎是优柔寡断的机会主义，在自由民主中心自己看来是成熟政治妥协制衡智慧的体现。进步与保守之间的位置在智利的政治版图上不太舒适，被左边和右边同时挤压，自由民主中心在这条窄缝里生存的策略只能是不断向两边做出相互矛盾的承诺。"
 CHL_Labor_Agricultural_Youth:0 "劳动农业青年"
 CHL_Labor_Agricultural_Youth_desc:0 "青年组织被赋予了鲜明的农村色彩，劳动农业青年在全国各地农村设立分支去组织年轻人学习农业技术与参加田间劳动。城市青年被鼓励到农村去体验生活，在泥土和汗水里洗掉街头革命沾染上的激进习气。劳动农业青年！我们就说道，土地教给人的东西比书本更诚实！青年们在农田里弯腰劳作的时候，他们的同龄人正在城市的秘密集会上传递油印传单，两种青年之间的隔阂乃是云泥之别，高下立判。"
 CHL_Functional_Democracy:0 "功能性民主"
 CHL_Functional_Democracy_desc:0 "国家复兴党对民主的定义是功能性的：民主是选拔管理人才的技术手段而非人民主权的政治表达。选举被保留为统治合法性的来源，选票被严格限制在产生管理者的功能范围内。这种模式拒绝承认人民有任何权利改变根本制度，因为制度是专家和领袖设计的精密机器，选民只能选择由谁来操作这台机器，机器本身不接受投票。"
 CHL_Yellow_Union_Employers_Friend:0 "黄色工会，雇主之友"
 CHL_Yellow_Union_Employers_Friend_desc:0 "自由民主中心工会政策的核心产品就是黄色工会了，由雇主资助、政府注册、专门负责在工人中散布强力劳资合作的福音。哪怕黄色工会的领导人在工厂里被称为工贼，他们对此安之若素。毕竟黄色工会的合法性来自政府的批准印章和持续重视的意向，那些所有黄色工会的成立都是和独立工会的争夺战，这激烈争夺的标的物就是工人的签字名单与更难以令人理解的——罢工权。"
 CHL_Christian_Social_Justice:0 "基督教社会正义"
 CHL_Christian_Social_Justice_desc:0 "农业工党从教会的思想武库中搬出了基督教社会主义作为官方意识形态的补充。曾经教皇的《新事》通谕中阐述的劳资合作、私有财产的社会责任和对社会主义的温和替代方案被引用在政府的政策白皮书里。教会重新获得了在教育和社会福利领域的话语权，主教们在政府会议上拥有固定席位。用十字架替换红旗，用福音书替换资本论，用天国的承诺替换地上的革命。"
 CHL_Integration_of_Right_Wing_Political_Parties:0 "整合右翼政党"
 CHL_Integration_of_Right_Wing_Political_Parties_desc:0 "几十块互相不买账的残废碎片就是智利右翼的最好写照，农业工党主动承担起这整合碎片的工作。合并收编与结盟排挤，各种手段轮番使用。整合过程相当顺利，许多分歧被淡化或消除，将散兵游勇编成我们的正规军。"
 CHL_Conservative_New_Era:0 "保守主义新时代"
 CHL_Conservative_New_Era_desc:0 "国家复兴党在其执政巅峰期就宣布智利进入了保守主义新时代，所有的激进思潮都已经被历史证明是失败的，所有的革命冲动都已经被现实证明是有害的。官方叙事把智利历史重新梳理了一遍，独立战争以来的所有革命和改革都被重新评价为外来思想的过度影响，真正属于智利本土的保守传统被定位为国家的精神根基，很快就要完成的是智利民族的光荣复兴。"
 CHL_United_Anti_Socialist_Front:0 "联合反社会主义阵线"
 CHL_United_Anti_Socialist_Front_desc:0 "从农业工党的土地庄园到自由民主中心的城市写字楼，所有右翼派别在反社会主义这一点上达成了毫无保留的一致。各党之间的最高协调机制就是反共反社，其共同目标是在智利彻底根除社会主义的政治存在。反社会主义阵线的内部充满利益冲突和互相算计，在对付左翼的时候他们确实做到了步调一致与声势上的团结。"
 CHL_Natural_Leader:0 "天生领导者"
 CHL_Natural_Leader_desc:0 "这种对领袖的想象带着浓厚的精英主义色彩：统治者是天生的而非选举选出来的。选举只是在天生领导者之间做选择。天生领导者的理论引用了一大堆生物决定论和社会达尔文主义的过时学说，夹杂着拉丁美洲右翼知识分子偏爱的贵族浪漫主义。雄鹰之人的形象在自由民主中心的宣传画中被反复使用，雄鹰翱翔在山巅之上俯瞰众生，众生需要雄鹰的保护。这种自我迷恋的精英主义在智利中产阶级中颇受欢迎，对鹰的仰望同时揭示了他们不用再平视地上那些和自己一样普通的同胞。"
 CHL_Cultivate_and_Rest:0 "修养生息"
 CHL_Cultivate_and_Rest_desc:0 "智利被军政府、战争和政权更迭折腾严重，因而农业工党向全国提出的重点承诺就是修养生息。不再搞激进的社会实验，不再积极备战，不再折腾农村和农民。如此言论对疲惫的智利社会具有极大的吸引力，经过南锥体战争的失败和军政府的崩溃之后，人们确实只想安静地过日子。修养生息的政策在短期内缓和了社会矛盾，尽管其长期后果是让旧的生产关系在和平的掩护下巩固了阵地。"
 CHL_Iron_Fist_and_Freedom:0 "铁拳与自由"
 CHL_Iron_Fist_and_Freedom_desc:0 "经济自由和政治自由的边界由铁拳来划定，自由在铁拳的保护下繁荣生长，铁拳在自由的修饰下显得不那么赤裸。这就是右翼民主派全部政治智慧的浓缩，自由是给赢家的奖品，铁拳是给输家的判决，两者合在一起其实就是智利右翼统治的全部真相了。"
 CHL_spanish_influence:0 "西班牙母亲的呼唤"
 CHL_spanish_influence_desc:0 "西班牙母亲在远方呼唤她的孩子回家，那声音穿过大西洋的浪涛与安第斯山脉的云雾，终于传到了圣地亚哥。智利脱离西班牙帝国已经一个多世纪，这一个多世纪里这片土地试遍了从自由主义到社会主义的各种舶来品，却没有一样能让它真正安宁。西班牙激进主义把这个狭长的国家重新放回了它本该在的位置——西班牙母亲的目光之下。母亲的怀抱并非抽象与遥不可及的诗意修辞，乃是天主教的永恒真理，伊比利亚半岛千年未断的文化血脉与拉丁民族在全球衰落中重新挺起自己胸膛的唯一道路。"
 CHL_national_falange_rise:0 "国家长枪党崛起"
 CHL_national_falange_rise_desc:0 "国家长枪党走上了执政前台，来自西班牙长枪党的革命传统与红黑旗帜。长枪党人把自己的政治信仰描述为诗意的革命：既不向资本主义的贪婪低头，也不向社会主义的仇恨让步，在两者之间开辟第三条道路——民族的、天主教的、工团主义的革命。长枪党在智利的崛起由一群年轻军官和激进知识分子联手完成，他们不再相信旧右翼的保守和软弱，也不相信旧左翼的虚幻阶级斗争，只有行动、纪律和对祖国无条件的献身。"
 CHL_rise_of_carlism:0 "卡洛斯派复兴"
 CHL_rise_of_carlism_desc:0 "卡洛斯派在智利不可思议地复兴了，这个起源于十九世纪西班牙王位继承争端的传统主义运动在大洋彼岸找到了第二故乡。坚持着最纯正的天主教正统主义：国王必须由上帝拣选，教会高于国家，自由主义和社会主义都是必须被连根拔除的异端。即使在西班牙本土卡洛斯派已经输掉了战争和历史的双重赌局，在智利他们却重新站起来了，挟着安第斯山的冷风和不曾熄灭的王朝忠诚重返政治前台。"
 CHL_revolutionary_syndicalist_movement:0 "革命工团主义运动"
 CHL_revolutionary_syndicalist_movement_desc:0 "革命工团主义运动走上了执政前台，这个运动把自己的血统追溯到索雷尔的革命工团主义理论——不需要政党，不需要议会，工人只需要工会和直接行动。区别在于索雷尔把矛头对准资产阶级，智利的革命工团主义把矛头同时对准资产阶级和马克思主义者尤其共产主义者。前者的罪行是剥削，后者的罪行是背叛，两者都是民族共同体必须铲除的害虫。"
 CHL_general_union_secretary:0 "全国工会秘书处"
 CHL_general_union_secretary_desc:0 "全国工会秘书处被设立为管理整个国家经济和劳动关系的最高机构，它的权力范围覆盖生产计划、工资标准、劳动纪律和职业培训。秘书处的官员不是从党棍中选拔，而是从工会干部和技术官僚中提拔，他们自认为代表的是生产的逻辑和民族的利益，最终目标是把整个国民经济变成一座巨大的、运转有序的法团工厂。"
 CHL_sorel_ledesma_redondo:0 "索雷尔、莱德斯马、雷东多"
 CHL_sorel_ledesma_redondo_desc:0 "乔治·索雷尔提供了暴力作为创造性力量的神话，他的革命工团主义是燃烧在血液里的汽油。莱德斯马·拉莫斯把西班牙长枪党的工团主义嫁接进了民族革命的总框架，使工团不再是无政府主义的工具与左翼的专利，是民族国家的支柱。奥内西莫·雷东多则在西班牙本土实践了国家工团主义的农村组织方案，其农民工会理论被智利的革命工团主义全盘移植到了安第斯山麓的农业合作社里。这些就是我们的认同，我们的路线，我们的过去。"
 CHL_right_to_revo:0 "革命的权利，正义的战争"
 CHL_right_to_revo_desc:0 "革命不是罪恶，反而是最高的权利——被压迫民族和被压迫阶级有权利拿起武器推翻腐败的旧秩序。智利的革命工团主义把革命本身塑造为绝对的政治美德，现存秩序的和平是奴隶的和平，资产阶级的法律是强盗的法律，打破这一切的战争是正义的战争。正义的战争是永不终止的清洗，旧的腐化被消灭之后新的腐化又会出现，革命从一场战役升变成了一种永恒的精神状态。"
 CHL_demarxize_syndicalism:0 "工团主义去马克思化"
 CHL_demarxize_syndicalism_desc:0 "是卡尔·马克思把工团主义引入了歧途！阶级斗争的最终目标是夺取政权建立无产阶级专政，工人阶级一旦陷入这种政治迷思就忘了自己真正的力量在于经济直接行动。去马克思化才能对工团主义彻底清洗，唯物史观和剩余价值学说被扔进历史的垃圾堆，教工会不再讨论什么政治革命，只讨论工资工时和劳动条件。"
 CHL_unified_nationalists:0 "统一民族主义组织"
 CHL_unified_nationalists_desc:0 "运动建立了一个覆盖全国的统一民族战线组织，把各行各业的法团、民兵、青年团和妇女辅助队编织进一张网络。这张网络的功能是渗透和控制，智利民众的日常活动都在网络的节点上被记录、被评估、被引导。一座没有围墙的军营。"
 CHL_black_flag:0 "黑旗飘飘"
 CHL_black_flag_desc:0 "国家工团之旗乃是黑色！黑色怎么可能是无政府主义的专属，那分明是国家工团主义对旧世界一切颜色的吞噬。黑旗飘扬圣地亚哥的政府大楼和工会总部之上，在全行业罢工被禁止之后，工人们仍然在黑旗下集会庆祝政府批准的节日。黑色吸收了所有旗帜的颜色，只留下民族、国家、劳动。"
 CHL_reponsibility_of_army:0 "军队的责任"
 CHL_reponsibility_of_army_desc:0 "只管理军营是庸俗的军队，军队必须全面介入接管经济秩序。革命工团主义运动授予军队在经济领域的广泛权力——例如军事工程师管理矿山的生产进度，军需官负责物资调配，退役军官被派驻工厂担任纪律监督……包括的不限于此。市场经济被彻底军事化，效率达到了自由市场难以企及的高度，其代价是自由本身的消失，不过那又何妨。"
 CHL_patria_libertad:0 "祖国与自由"
 CHL_patria_libertad_desc:0 "军团的意志，祖国与自由。祖国是一个超越了地理概念的，所有劳动者在民族共同体中实现自我价值的唯一场域；自由是抹除了个人主义的胡作非为后，在纪律中找到自己的位置并完美地履行这个位置所赋予的职责。这便是革命工团主义军团的精神格言。"
 CHL_into_hispansphere:0 "西班牙圈的一份子"
 CHL_into_hispansphere_desc:0 "智利回到西班牙语世界的大家庭里，和那些从加利福尼亚到火地岛、从马德里到马尼拉的西语国家又站在一起。西班牙圈成为一整套文明秩序，以天主教、拉丁文化和民族主义的综合体现世，在盎格鲁撒克逊的功利主义和斯拉夫的野蛮主义等等之间唯一还能守住人类尊严的文明堡垒。智利在这个圈子里找到了自己的位置，西语世界的边界线于是画到安第斯山脚下，到麦哲伦海峡以及复活节岛——智利向西语世界致意，以共同的血脉、共同的信仰、共同的悲欢。"
 CHL_liberate_spain:0 "解放伊斯巴尼亚"
 CHL_liberate_spain_desc:0 "西班牙本土正在腐烂。自从帝国崩溃以来，伊比利亚半岛就陷入了永无休止的混乱，自由派、社会主义者、分离主义者在马德里的废墟上互相撕咬，西班牙的伟大被一群小丑踩在脚底。智利不能再袖手旁观！西语世界最遥远的儿子现在要拿起剑翻身归途去，跨过大西洋，去在西班牙本土升起真正西班牙的旗帜。解放伊斯巴尼亚，拯救伊斯巴尼亚！从自由主义手里拯救她，我苦难的母亲；从社会主义手里拯救她，我失散的祖地；从西班牙人自己手里，彻底的拯救精神的西班牙国家。"
 CHL_oppose_progressvism:0 "对抗进步主义"
 CHL_oppose_progressvism_desc:0 "进步主义是人类文明在最近三百年里遭遇的最邪恶的骗局，它伪装成理性和科学的模样，干的却是拆毁传统、亵渎信仰、瓦解家庭、抹平一切神圣等级的勾当。对进步主义的对抗是全面的、不妥协的：进步主义主张男女平等，传统秩序坚持男性在家庭和社会中的权威地位；进步主义推广世俗教育，教会坚持教育必须在信仰的框架内进行；进步主义鼓吹选举和议会，正统主义认定统治权来自上帝而非民意。"
 CHL_return_to_tradition:0 "传统的怀抱"
 CHL_return_to_tradition_desc:0 "传统向所有在现代化迷途中筋疲力尽的智利人敞开了怀抱。传统的生活方式，就像是父亲传给儿子的手艺，母亲教给女儿的祈祷词，村庄世代遵循的节庆和仪式，安第斯山民在贫瘠土地上耕种了三百余年的古老智慧。回到传统的怀抱就是回到确定性，回到被工业化和城市化剥夺之前的那个温暖有序的世界。"
 CHL_people_labor_movement:0 "人民劳工运动"
 CHL_people_labor_movement_desc:0 "出人意料地，当局发起了所谓的人民劳工运动，传统主义的君主派跑到工厂和矿山里去组织工人，场景颇有几分魔幻。人民劳工运动的理论基础是天主教的社会教义：工人有权获得公正的工资和体面的劳动条件，资本家的贪婪和社会主义的阶级斗争必须被同时反对，劳资和谐的唯一基础是双方共同跪在上帝面前承认彼此为兄弟。是以卡洛斯派的劳工运动绕过阶级话语直接用宗教语言和工人对话。"
 CHL_invite_intelicuals:0 "邀请思想巨匠"
 CHL_invite_intelicuals_desc:0 "智利的现代化建设需要最优秀的大脑，向全球天主教世界的思想巨匠们发出邀请。西班牙的神学家、法国的工程师、意大利的建筑师和德国的化学家……在新建的大学和研究院里培养智利的下一代精英。科学技术的发展不能脱离信仰的框架，邀请学者的标准也是学术造诣和信仰虔诚并重。现代知识的火炬在天主教世界里传递，智利要成为其载体，拖生火炬的宏厚灯台。"
 CHL_wrongs_of_liberal_democracy:0 "自由民主之谬"
 CHL_wrongs_of_liberal_democracy_desc:0 "自由民主从头到脚都是谬误。它把统治权交给多数票而不是交给上帝和传统，它把公民变成没有灵魂的选票计数器，它用相对主义腐蚀道德，用个人主义瓦解共同体。在批判自由民主这一点上我们总是异口同声，必然抹杀那无稽的谬论。"
 CHL_liberate_union_from_reds:0 "自赤匪之手解放工会"
 CHL_liberate_union_from_reds_desc:0 "智利的工会运动一直以来是被被赤匪劫持！共产党和工团主义者等等恶鬼把工会变成了反国家、反民族、反信仰的堡垒，工会从单纯的工人的保护组织变成了革命党手里的人质，这简直是进步的倒行逆施！我们要把工会重新放回民族和信仰的框架里，劳动者需要工会来保障自己的面包和尊严，劳动者同样需要信仰和祖国来赋予面包和尊严以意义。"
 CHL_natsynd_mode:0 "国家工团主义模式"
 CHL_natsynd_mode_desc:0 "被当局共同使用的组织框架是国家工团主义模式，就在这工会层面的争夺战中。各产业按垂直方向组成国家控制的法团，劳资双方在法团内部接受国家的仲裁，罢工被禁止，阶级斗争被取代，工会职能从对抗国家转变为协助国家管理产业。这种模式是右翼对工团主义遗产的全面改造，保留了工会的组织形式，不过抽去了阶级斗争的灵魂。"
 CHL_implement_church_rule:0 "强调教会职责"
 CHL_implement_church_rule_desc:0 "教会总不该只待在圣坛后面做弥撒，上帝的子民在这个世界上受苦的时候教会必须站出来。教会的职责是全面参与社会建设，神父是灵魂的牧者，是社区的组织者、道德的仲裁者和国家政策的基层执行者。教会的社会参与为政权提供了遍布全国每一个村镇的道德毛细血管网。"
 CHL_voice_of_saint_thomas:0 "传颂圣托马斯之音"
 CHL_voice_of_saint_thomas_desc:0 "阿奎那的圣托马斯，天主教会最伟大的经院哲学家，他的声音在智利产业建设中回荡。圣托马斯的自然法理论被用来论证社会等级秩序的天然合理性，他的劳动尊严学说被用来激励工人勤奋工作，他的公义价格理论被用来指导国家经济计划。中世纪圣人的理性之光穿透七百年的时光被智利的技术官僚和神学家联手引进了国内的工厂和矿山。产业建设被赋予了神圣性，生产指标，救赎的希望——在圣托马斯之音中逐渐一体。"
 CHL_god_patria:0 "上帝与祖国"
 CHL_god_patria_desc:0 "全部信念的浓缩如此。上帝赐予信仰和道德秩序，祖国提供土地和政治归属，军民的士气从这两个词里汲取永不枯竭的源泉。战场上士兵冲锋时喊出来的最后几个字都会是它们，工厂早晨开工前全体工人齐声念诵的誓词也或是它们，学校开学典礼上每一个孩子对着国旗和十字架做出的承诺也要是如此。"
 CHL_new_type_of_revolution:0 "新式革命"
 CHL_new_type_of_revolution_desc:0 "卡洛斯派进行的不是旧式的反革命复辟，一场新式革命才是真正发生的事情——用传统的武器打现代的战争。革命的主体是超越了一切阶级的信仰共同体；革命的敌人是自由主义、社会主义和无神论；革命的目标是建立天主教王国的现世投影。军团式的组织、现代的宣传技巧和对群众心理的精准把握被卡洛斯派运用的得心应手。"
 CHL_intergrate_remains_of_soccon:0 "整合保守党残部"
 CHL_intergrate_remains_of_soccon_desc:0 "旧保守党在失败之后已经碎成一地残渣，长枪党于是把这些残渣扫起来倒进自己的模子里重新铸造。保守自由派的干部被收编入长枪党的行政体系，他们的议会经验和法律知识被保留利用，他们在经济上的自由主义倾向则被长枪党的国家管制逐步磨平。长枪党在右翼阵营内部完成统一的手段就是如此，不再需要多个互相争吵的政党，只有一个政党、一个领袖、一个纲领。"
 CHL_against_capital_decadence:0 "对抗资产阶级堕落"
 CHL_against_capital_decadence_desc:0 "完全相反的路径被提出来了，长枪党联合智利共产党共同对抗资产阶级的堕落。这个方案在长枪党内部引发了激烈争论，支持者认为资产阶级自由主义才是文明的头号腐蚀剂，它比共产主义更危险，因为共产主义至少还有纪律和集体主义，资产阶级自由主义只有自私自利和享乐主义。长枪党和共产党在社会道德问题上意外地找到了共同语言，共同对抗资产阶级堕落在实践中的表现就是两党在反自由主义的旗帜下默契配合，联合施行政务。"
 CHL_social_catholic_union:0 "基督教社会联合"
 CHL_social_catholic_union_desc:0 "教会和长枪党在智利达成了一种深度联合，政教关系的例行公事作为灵与肉的结合。教会提供道德秩序和灵魂救赎，长枪党提供政治组织和物质力量，两者合在一起就是基督教社会的全尽框架。工人被要求在工厂里遵守长枪党制定的劳动纪律，星期天被要求走进教堂聆听神父的道德训诫，生产空间和精神空间之间不留任何空白地带，六天属于祖国，第七天属于上帝。"
 CHL_end_degenerate:0 "终结颓废"
 CHL_end_degenerate_desc:0 "现代文明已经腐烂到了骨髓！颓废的气息弥漫在每一个城市的街道上。颓废的艺术家在画廊里挂出令人作呕的抽象画，颓废的作家在小说里歌颂变态和堕落，颓废的音乐在舞厅里毒害年轻人的耳朵并与思想。长枪党向这一切宣战，进行文化上的大扫除，扫掉那些从巴黎和纽约漂过来的文化垃圾，扫去大学里那些以解构为荣的腐朽知识分子与一切让智利民族变得软弱、自私、丑陋的精神毒药。"
 CHL_influence_of_maritanism:0 "马里坦主义影响"
 CHL_influence_of_maritanism_desc:0 "雅克·马里坦的基督教人文主义哲学在智利长枪党内部找到了其虔诚的追随者。马里坦试图在天主教传统和现代社会之间架设一座桥梁，他的学说为长枪党提供了一套更能被国际社会接受的温和面孔。人被当作完整的人格来对待，劳动者的尊严在基督教人文主义的框架内得到承认，社会的组织原则是天主教共同体理想而不是赤裸裸的暴力。"
 CHL_get_rid_of_intergalism:0 "摆脱整合主义枷锁"
 CHL_get_rid_of_intergalism_desc:0 "西班牙传统的整合主义把教会和国家捆绑太紧，使得教会失去了自主的呼吸空间。智利长枪党内如今主张教会应当从国家的全面控制中适度松绑，保留独立的精神权威地位。也就是摆脱整合主义的枷锁。在措辞上这是对西班牙老牌教权主义的批判，在实践上则是为智利教会争取和国家讨价还价的余地。"
 CHL_one_party_dictatorship:0 "一党独大"
 CHL_one_party_dictatorship_desc:0 "多党竞争是自由主义的骗局，政党轮替是让同一群寡头换件衣服继续统治的可笑把戏。一党独大的政治体制使合法的反对党被解散，非法的反对党被消灭，议会里就是我们的一言堂。反对者说这是我们在独裁，对极了，长枪党不在乎独裁！就是要把全部政治权力集中到唯一一个有资格代表民族的政党手里，集中到彻底为止。"
 CHL_iberian_american_fusion:0 "伊比利亚-美洲交融"
 CHL_iberian_american_fusion_desc:0 "智利和伊比利亚半岛的关系不能再是宗主和殖民地的旧模式，而是两个平等节点在同一个文明网络中的深度融合。西班牙的军事教官在智利训练长枪党民兵，西班牙的语言学和历史学教授在智利大学里重写拉丁美洲史教材，智利的长枪党理论家在西班牙本土的刊物上发表文章阐述美洲长枪主义……一切的一切是为了证明交融是西班牙圈理想的具体化，就使大西洋与血脉之海不再是我们的隔阂。"
 CHL_legacy_of_quad:0 "纪元四重法精神"
 CHL_legacy_of_quad_desc:0 "劳动、团结、牺牲、服从……劳动是公民对祖国的义务，不劳者不得食；团结是民族内部的铁板一块，阶级分裂是自由主义者制造出来的伪命题；牺牲是个人随时准备为国家献出一切的最高美德；服从是纪律的灵魂，军队需要服从，工厂需要服从，整个国家就是一座服从的金字塔。四重法像钟摆一样精确地度量着每一个人的忠诚度，指引着每一个人的行为规范。"
 CHL_democratic_mandate:0 "恢复民主"
 CHL_democratic_mandate_desc:0 "谢天谢地，左右暴徒们已经烟消云散了！民主得以重归智利，我们将重新召开大选，还这个国家以纯正的民意。"
 CHL_partido_liberal:0 "自由党胜利"
 CHL_partido_liberal_desc:0 "选举的结果已经揭晓，自由党成功赢得了政权。面对智利动荡的局势，我们将向世人证明，自由主义不仅能带来经济的繁荣，更能稳定这个饱受危机摧残的国家。"
 CHL_continue_alexandrism:0 "延续亚历山德里主义"
 CHL_continue_alexandrism_desc:0 "阿图罗·亚历山德里总统的路线已经证明了自己的价值。通过温和的社会改良满足底层诉求，同时用强力的行政手段维持宪政秩序，我们将继续走在这条平息阶级矛盾的平衡木上。"
 CHL_we_need_ross:0 "我们需要罗斯"
 CHL_we_need_ross_desc:0 "大萧条几乎摧毁了我们的国家，空洞的政治口号无法填饱肚子。面对崩溃的财政与巨额赤字，智利需要一位冷酷、务实且手腕强硬的财政奇才——古斯塔夫·罗斯就是唯一的人选。"
 CHL_republic_militia:0 "共和国民兵"
 CHL_republic_militia_desc:0 "为了防止左翼激进暴动并震慑蠢蠢欲动的军方插手政治，由中产阶级和文官精英自发组织的“共和国民兵”将成为宪政最坚实的武装盾牌。自由，必须用刺刀来捍卫。"
 CHL_progamic_economic_policy:0 "实用经济政策"
 CHL_progamic_economic_policy_desc:0 "在饥饿与破产面前，僵化的意识形态毫无意义。我们将采取绝对务实的经济反垄断与重组手段，削减不必要的行政开支，优先恢复智利在国际市场上的信用。"
 CHL_economic_protection:0 "经济保护主义"
 CHL_economic_protection_desc:0 "国际自由贸易体系已经在外汇危机中分崩离析，我们不能再一味依赖进口。提高关税、筑起贸易壁垒，全面保护和扶持本土脆弱的民族工业，是智利实现自给自足的唯一出路。"
 CHL_liberty_under_iron_fist:0 "铁拳带来自由"
 CHL_liberty_under_iron_fist_desc:0 "如果任由无政府主义、罢工和极端思想蔓延，那么自由将沦为空谈。有时候，为了保护长远的民主与自由，我们必须在当下挥舞起秩序的铁拳，取缔任何敢于挑战国家法律的组织。"
 CHL_media_controls:0 "媒体管控"
 CHL_media_controls_desc:0 "报纸和电台不该成为煽动阶级仇恨与叛乱的工具。通过对舆论进行必要的审查与温和引导，能让国民将精力集中在国家复兴上，而不是无休止的政治内耗。"
 CHL_worker_insurance:0 "工人保险"
 CHL_worker_insurance_desc:0 "对抗共产主义蔓延最好的武器，就是让工人阶级在体制内有所依靠。通过建立强制性的工人社会保险制度，用国家的温情去化解革命的干柴。"
 CHL_reign_of_minister_of_hunger:0 "饥饿部长的统治"
 CHL_reign_of_minister_of_hunger_desc:0 "左翼和工人们愤怒地咒骂罗斯为‘饥饿部长’，因为他的财政紧缩政策毫不留情地削减了福利。但正是这种近乎冷血的严苛，正在将智利的财政从彻底破产的深渊中硬生生拉回来。"
 CHL_expand_police:0 "扩展警察部门"
 CHL_expand_police_desc:0 "城市的街道需要重回法治轨道。我们将扩大宪兵和秘密警察部队的编制与技术装备，确保任何扰乱社会治安、组织非法罢工的企图都会在萌芽状态被迅速平定。"
 CHL_state_stadium:0 "建设国家体育场"
 CHL_state_stadium_desc:0 "在圣地亚哥筹建一座宏伟的国家体育场。这项浩大的公共工程不仅能为成千上万的失业工人提供工作岗位，更将成为智利国家凝聚力与新时代繁荣的标志性建筑。"
 CHL_increase_taxes:0 "提高税收"
 CHL_increase_taxes_desc:0 "国库空虚让政府寸步难行。我们必须顶住有产阶级的压力，合理提高特定行业与高收入群体的税率，以确保国家有足够的资金用于偿还外债和关键领域的公共投资。"
 CHL_revise_constitution:0 "修订宪法"
 CHL_revise_constitution_desc:0 "新宪法确立了强大的总统制，但这在危机时期依然不够。我们需要进一步扩充行政首脑的紧急权力，彻底杜绝过去议会制带来的低效、扯皮与政治瘫痪。"
 CHL_industry_development_committee:0 "工业发展委员会"
 CHL_industry_development_committee_desc:0 "由政府出面牵头，成立国家级的工业发展委员会。通过国家资本与私人资本的联合，有计划地将智利从一个单纯依赖矿产出口的原材料国家，转化为现代化的工业国。"
 CHL_united_right:0 "联合右翼"
 CHL_united_right_desc:0 "面对左翼‘人民阵线’日益严重的威胁，自由党、保守党以及传统地主阶级必须放下过去的派系分歧。我们将组成统一的右翼战线，坚决捍卫私有制、秩序与智利的传统价值观。"
 CHL_restore_pruduction_niter:0 "恢复硝石生产"
 CHL_restore_pruduction_niter_desc:0 "硝石曾是智利的命脉，即便合成氨技术兴起，它依然大有可为。通过重组‘智利硝石与碘业销售公司（COVPROCH）’，实行国家垄断销售，我们将让这个传统支柱产业重新为国库赚取宝贵的外汇。"
 CHL_infulence_of_unity_club:0 "联合俱乐部的影响"
 CHL_infulence_of_unity_club_desc:0 "圣地亚哥的联合俱乐部是智利真正掌权者的汇聚地。得到了这些银行家、大庄园主和知识精英的支持，我们的经济法令才能毫无阻碍地推行下去。"
 CHL_freedom_union:0 "自由联盟"
 CHL_freedom_union_desc:0 "自由联盟成功将社会改良派、中间派与温和自由派团结在同一面旗帜下。我们将证明，在民主与理性的框架内，同样可以实现国家的长治久安与阶级和解。"
 CHL_economic_miracle:0 "经济奇迹"
 CHL_economic_miracle_desc:0 "阵痛已经过去，繁荣如期而至。随着通货膨胀得到全面控制，赤字抹平，失业率降至历史新低，智利的经济复苏在拉美乃至整个西方世界都被称作奇迹。"
 CHL_new_liberal_age:0 "新自由时代"
 CHL_new_liberal_age_desc:0 "在铁腕下稳定秩序，在务实中发展繁荣。智利已经彻底走出了危机的阴霾，一个既有强力法治保护、又有自由市场活力的‘新自由时代’，正由我们亲手拉开序幕。"
 CHL_partido_conservative:0 "保守党胜选"
 CHL_partido_conservative_desc:0 "大选的尘埃落定宣告了保守党的全面胜利。在这个礼崩乐坏、激进思潮泛滥的动荡时代，我们将用坚定的信仰、严明的法治以及对传统价值观的捍卫，重新撑起智利国家的脊梁。"
 CHL_traditionistas:0 "传统主义派胜利"
 CHL_traditionistas_desc:0 "埃克托·罗德里格斯·德·拉·索塔所领导的传统主义派赢得了主导权。我们代表着大庄园主、教会精英与智利最纯正的保守主义血脉。国家不需要那些危险的社会实验，唯有重归传统秩序，国家才能获得永续的稳定。"
 CHL_cristno_democratia:0 "基督教民主派胜利"
 CHL_cristno_democratia_desc:0 "爱德华多·克鲁斯-科克医生所代表的社会基督教派系夺取了政权！我们不能再盲目扮演旧时代特权的守护者，而必须践行天主的公义。通过温和的社会改良与民生关怀，基督教民主主义将成为对抗红色浪潮最坚实的盾牌。"
 CHL_legacy_of_poltares:0 "波塔莱斯的遗产"
 CHL_legacy_of_poltares_desc:0 "伟大的迪亚哥·波塔莱斯曾用铁腕和绝对的威权确立了智利的早期国基。在当今世界动荡的局势下，我们必须继承这份不朽的遗产——建立一个高效、集权且不可动摇的冷酷文官政府，用秩序平息一切杂音。"
 CHL_strengthen_church:0 "强化天主教会"
 CHL_strengthen_church_desc:0 "天主教会是智利道德与社会的最终基石。我们将废除过去那些世俗化的无神论政策，全面恢复教会在国家教育、文化和婚姻事务中的神圣地位，让弥撒的钟声再度洗涤每一个智利人的心灵。"
 CHL_social_catholic_influence:0 "社会基督教影响"
 CHL_social_catholic_influence_desc:0 "根据教宗《新事》与《四十周年》通谕的精神，资本必须对社会承担道德责任。我们将引入社会基督教的原则，在肯定私有财产的同时，确保劳动者获得体面的尊严，用天主的慈爱化解阶级仇恨。"
 CHL_control_army:0 "控制军队"
 CHL_control_army_desc:0 "军队是国家的剑，但握剑的手必须属于合法的文官政权。我们将彻底清洗军中那些怀揣波拿巴主义野心的野心家，强化宪政体制对兵营的绝对控制，确保军人安心服从于法治与国家秩序。"
 CHL_agri_reforms:0 "农业改革"
 CHL_agri_reforms_desc:0 "为了提高土地利用率并缓和农村日益尖锐的对立，克鲁斯-科克主张进行符合基督公义的温和农业技术与制度改良。在绝不破坏神圣私有制的前提下，让佃农与土地结成更紧密的利益共同体。"
 CHL_protect_capital:0 "保护私有资本"
 CHL_protect_capital_desc:0 "正如罗德里格斯·德·拉·索塔在著作中所坚称的那样，私有财产是人类自由与文明的最终防线。政府将立法严厉惩治任何侵犯私有制、煽动非法分地的激进企图，给国内外投资者提供最安心的法律庇护。"
 CHL_public_hyinege:0 "改善公共卫生"
 CHL_public_hyinege_desc:0 "作为享誉全国的名医与前卫生部长，克鲁斯-科克深知疾病和恶劣的卫生条件是贫困与动荡的根源。我们将发起全国性的公共卫生运动，修建现代化医院、净化水源、普及基础医疗，唯有健康的国民才能筑起强大的国家。"
 CHL_national_union:0 "组建国民联盟"
 CHL_national_union_desc:0 "面对左翼‘人民阵线’日益严重的威胁，所有的右翼和中间温和力量都退无可退。我们将以保守党为核心，将地主、资本家、教会以及爱国文官紧密团结在一起，结成不可撼动的国民联盟。"
 CHL_con_youth:0 "保守派青年"
 CHL_con_youth_desc:0 "青年是国家的未来。我们必须深入校园与工坊，将那些充满热血的保守派青年（如保守党青年团、未来的国家法警派系）组织起来，向他们灌输信仰与复兴的宏志，让他们成为抵抗街头极左暴力的中坚力量。"
 CHL_against_capital_communism:0 "对抗资本与共产"
 CHL_against_capital_communism_desc:0 "无论是唯利是图、剥削人性的盎格鲁-撒克逊式野蛮资本主义，还是抹杀信仰、宣扬仇恨的苏维埃无神论共产主义，都不是智利的归宿。罗德里格斯·德·拉·索塔指出，我们将走出第三条道路——一条基于基督教伦理与社团主义的复兴之路。"
 CHL_economic_councils:0 "财政预算管理委员会"
 CHL_economic_councils_desc:0 "为了杜绝议会扯皮和政治分肥对国家财政的虚耗，我们将成立一个由经济专家、银行家和大庄园代表组成的‘财政预算管理委员会’。用绝对理性、审慎的精英视角，牢牢把控国家的每一分银钱。"
 CHL_catholic_welfare:0 "天主教社会福利"
 CHL_catholic_welfare_desc:0 "世俗国家的救济往往冰冷而僵化，而天主的慈善却充满温度。政府将拨款并联合全国教区网络，建立广泛的天主教慈善与福利救济体系，通过教会的手向失业者和孤寡老人发放面包与温暖。"
 CHL_ally_liberals:0 "联合自由党"
 CHL_ally_liberals_desc:0 "尽管我们在信仰和传统的某些细节上与自由党人有所争论，但在维护社会秩序和保护私有资本的核心利益上，我们是一致的。两党结盟将彻底锁死左翼通过选举窃取国家政权的所有希望。"
 CHL_total_economic_recover:0 "全面经济复苏"
 CHL_total_economic_recover_desc:0 "通过严厉的财政纪律、对传统矿业的整顿以及农业的大丰收，智利的经济已经全面触底反弹。工厂的烟囱再度冒烟，国库的赤字正在被抹平，全面经济复苏的曙光已然破晓。"
 CHL_local_powers:0 "扩大地方权力"
 CHL_local_powers_desc:0 "圣地亚哥的集权官僚无法真正体会外省佃农与乡绅的切身需求。通过适当扩大地方省份的自主权与财税留成，能够让各地的传统精英更高效地因地制宜，巩固智利外省的稳定根基。"
 CHL_resist_radicalism:0 "抵抗激进主义"
 CHL_resist_radicalism_desc:0 "激进党人和他们的左翼盟友正试图用激进的世俗化和阶级斗争拆毁智利的传统大厦。我们必须在议会、媒体以及街头上进行针锋相对的抗争，坚决筑起一道阻挡这些危险思潮的防波堤。"
 CHL_seek_foreign_investment:0 "寻求外国投资"
 CHL_seek_foreign_investment_desc:0 "为了重振智利疲软的工业与基础设施建设，我们需要海量的外来资金。通过展示我们无与伦比的政治稳定性和法治环境，向美英等西方大国伸出橄榄枝，吸引外资大规模流入。"
 CHL_chile_star:0 "智利之星"
 CHL_chile_star_desc:0 "在崇高信仰的指引下，在不朽秩序的庇护下，智利已经成为南美大陆上最闪亮的灯塔。没有暴动，没有赤化，一个繁荣、虔诚且不可动摇的伟大智利，正犹如一颗璀璨之星，在安第斯山脉上空冉冉升起。"
 CHL_partido_radical:0 "激进党延续"
 CHL_partido_radical_desc:0 "作为智利政坛的中流砥柱，激进党再次挑起了国家的重担。我们将高举理性、进步与世俗化的旗帜，在左翼与右翼的夹缝中开辟出一条属于智利的中间改良道路。"
 CHL_president_cerda:0 "塞尔达总统"
 CHL_president_cerda_desc:0 "佩德罗·阿奎雷·塞尔达赢得了大选！这位出身平民、深受爱戴的领袖将践行他‘治国即开学’（Gobernar es educar）的至理名言，带领底层民众走向知识与工业的新时代。"
 CHL_intergrate_socialists:0 "整合社会党"
 CHL_intergrate_socialists_desc:0 "为了对抗保守右翼的盘剥，我们必须联合一切可以联合的左翼力量。通过邀请社会党人进入内阁，人民阵线将更加巩固，共同为无产阶级争取尊严。"
 CHL_intergrate_nationalists:0 "寻求民族主义者支持"
 CHL_intergrate_nationalists_desc:0 "在革命失败的血腥阴影和对寡头政权的共同愤怒下，即便是民族主义者也愿意向我们伸出援手。只要有利于国家的独立和复兴，这种暂时的结盟完全值得。"
 CHL_true_jacobins:0 "真正雅各宾精神之继承人"
 CHL_true_jacobins_desc:0 "激进党人的血液里流淌着法国大革命的激进传统。我们是理性的信徒、封建残余的死敌。我们将以毫不妥协的态度，彻底扫除阻碍智利现代化的旧时代垃圾。"
 CHL_comittee_for_race_salvation:0 "保卫种族委员会"
 CHL_comittee_for_race_salvation_desc:0 "国家的未来取决于国民的体魄。通过建立保卫种族与消遣委员会，直接介入公共卫生、工人体育和营养改善，全面提升智利劳动阶级的身体素质与民族凝聚力。"
 CHL_tackle_agri_problems:0 "解决农业问题"
 CHL_tackle_agri_problems_desc:0 "落后的封建庄园制正在吸干智利农村的血。如果不能解决土地分配不公与粮食减产的问题，我们的工业化就只是空中楼阁。是时候对农村动刀了。"
 CHL_grape_field_of_don_tinto:0 "丁托先生的葡萄园"
 CHL_grape_field_of_don_tinto_desc:0 "被称为‘丁托先生’（红酒先生）的塞尔达总统，这不仅因为他出身于丰饶的中央山谷，更因为他深知智利土地的潜力。支持本土葡萄酒与农业加工业，就是支持智利的根基。"
 CHL_secular_state:0 "世俗化国家"
 CHL_secular_state_desc:0 "教会的阴影不应再笼罩法律与讲台。我们将坚定地推进政教分离，剥夺教会对公共教育的垄断权，让科学与理性成为智利下一代的启蒙灯塔。"
 CHL_president_montero:0 "蒙特罗总统"
 CHL_president_montero_desc:0 "胡安·埃斯特班·蒙特罗总统接管了政权。面对前任留下的烂摊子和动荡的社会秩序，这位作风严谨的法学家将用法律的尊严和温和的改良来抚平国家的创伤。"
 CHL_revitalize_economics:0 "复兴经济"
 CHL_revitalize_economics_desc:0 "没有繁荣的经济，一切政治改革都是空谈。政府将通过积极的宏观调控、吸引外资以及稳定本币汇率，让智利萧条的工商业重新焕发生机。"
 CHL_corfo:0 "生产促进公司"
 CHL_corfo_desc:0 "毁灭性的地震和萧条让我们意识到，不能再依赖天赐的矿产了。我们将成立‘生产促进公司’（CORFO），由国家主导，在电力、钢铁、石油和机械领域建立起智利自己的工业骨肉。"
 CHL_state_college:0 "国立技术大学"
 CHL_state_college_desc:0 "工厂需要工程师，车间需要技术员。我们将整合全国的职业与技术教育资源，建立一所现代化的国立技术大学，为智利的工业化高潮输送源源不断的人才。"
 CHL_get_rid_of_debt:0 "摆脱债务"
 CHL_get_rid_of_debt_desc:0 "巨额的外债正像锁链一样勒住智利的脖子。通过重新谈判、债务重组和严苛的财政纪律，我们将逐步甩掉这个沉重的包袱，赢回财政的主权。"
 CHL_deal_with_what_we_done:0 "解决烂摊子"
 CHL_deal_with_what_we_done_desc:0 "前几任政府的激进政策和鲁莽行动给国家留下了满地疮痍。激进党不能只懂得破坏，更要懂得建设。现在，轮到我们静下心来清理这些历史遗留问题了。"
 CHL_correct_our_mistake:0 "纠正我们的错误"
 CHL_correct_our_mistake_desc:0 "过去的某些极端政策不仅激化了阶级矛盾，还险些让国家陷入内战。我们必须勇于承认并纠正这些偏航的政策，将智利重新拉回法治与妥协的正常轨道上。"
 CHL_help_the_unemployed:0 "救济失业者"
 CHL_help_the_unemployed_desc:0 "成千上万在硝石矿山和工厂中失业的工人正流落街头。政府必须迅速行动，通过紧急救济金和以工代赈的项目，确保每一个智利公民至少能有面包果腹。"
 CHL_no_landifendia:0 "拆分拉迪芬狄亚"
 CHL_no_landifendia_desc:0 "大庄园制（Latifundia）是垄断与落后的代名词。我们将通过立法限制大地产的无限扩张，将闲置的土地强制赎买并分给真正耕作的佃农，彻底粉碎封建地主阶级的经济垄断。"
 CHL_peoples_bank:0 "人民信贷银行"
 CHL_peoples_bank_desc:0 "高利贷正在榨干小商贩和工人的最后一分钱。由国家出资建立人民信贷银行（Caja de Crédito Popular），为平民阶层提供低息贷款，用国家的信用去对抗贪婪的资本秃鹰。"
 CHL_expand_social_welfare:0 "延展社会福利"
 CHL_expand_social_welfare_desc:0 "社会的稳定取决于底层民众的安全感。我们将进一步扩大医疗、养老和工伤福利的覆盖范围，让每一个智利人在面对生活的意外时都能有所依靠。"
 CHL_don_cripple:0 "跛脚先生的亡羊补牢"
 CHL_don_cripple_desc:0 "尽管我们的政府因为各派系的扯皮而被讥讽为‘跛脚政府’，但这并不妨碍我们修补体制的漏洞。在危机彻底爆发前，哪怕是蹒跚前行，我们也必须把该补的网补好。"
 CHL_president_videla:0 "魏地拉总统"
 CHL_president_videla_desc:0 "加夫列尔·冈萨雷斯·魏地拉登上了总统宝座。这位极具政治手腕的领袖曾借助左翼的力量掌权，但现在，他敏锐地察觉到了冷战风暴的来临。智利的方向，将由他重新掌舵。"
 CHL_the_cursed_law:0 "颁布诅咒法"
 CHL_the_cursed_law_desc:0 "《保卫民主永久法》（Ley de Defensa Permanente de la Democracia）——亦被民间称为‘诅咒法’。该法案将正式宣布共产主义政党为非法，清洗政府与工会中的极端分子。为了宪政的安全，民主必须长出牙齿。"
 CHL_women_votes:0 "扩展投票权"
 CHL_women_votes_desc:0 "激进主义意味着真正的平等。魏地拉总统将正式签署法案，赋予智利女性完全的选举权与被选举权。这是一场民主的跨越，数百万女性将用选票为激进党筑起新的防线。"
 CHL_national_centralize_cabinet:0 "民族集中内阁"
 CHL_national_centralize_cabinet_desc:0 "在驱逐了共产主义者后，为了应对左翼的分裂与罢工威胁，魏地拉邀请了自由党和保守党入阁，组成了‘民族集中内阁’。我们将联合所有温和与右翼力量，共同维持国家稳定。"
 CHL_serna_plan:0 "塞雷那计划"
 CHL_serna_plan_desc:0 "作为魏地拉总统的故乡， La Serena 将成为智利城市现代化的样板。通过‘塞雷那计划’，我们将融合古典殖民风格建筑与现代城市规划，将其打造为区域性的工业、教育与旅游明珠。"
 CHL_control_economy:0 "限制性经济政策"
 CHL_control_economy_desc:0 "恶性通货膨胀正在吞噬工人的薪水。为了稳定大局，政府将采取限制性的经济政策，严格控制薪资涨幅、冻结部分物价，并压制激进工会的罢工要求，以换取经济的硬着陆。"
 CHL_infrastructure_construction:0 "基础设施建设"
 CHL_infrastructure_construction_desc:0 "连接全国的公路、现代化的港口和横跨山脉的电网，是国家强大的主动脉。我们将倾注国力开展大规模基础设施建设，为工业的高速腾飞铺平道路。"
 CHL_moderate_authoritianism:0 "温和威权主义"
 CHL_moderate_authoritianism_desc:0 "在极左暴动与极右政变的双重夹击下，绝对的自由只会导致绝对的混乱。我们将实行温和的威权主义统治，在保留议会和选举的同时，用铁腕手段压制任何敢于破坏社会治安的行为。"
 CHL_age_of_radical:0 "激进年代"
 CHL_age_of_radical_desc:0 "激进党成功将智利带入了现代化国家的行列。跨越了动荡与阵痛，这个由激进党人亲手塑造的黄金时代，将永远铭刻在智利的历史上。"
 CHL_unexpected_victory_of_frente_popular:0 "人民阵线的意外胜利"
 CHL_unexpected_victory_of_frente_popular_desc:0 "第二次大选的结果让几乎所有观察家都措手不及。人民阵线——这个由社会党人、共产党人、左翼工会和进步知识分子组成的选举联盟——以超出所有预料的得票率赢得了执政资格。选举之夜圣地亚哥的工人区彻夜欢庆，人群举着红旗和标语涌上街头，老左派们在街角拥抱落泪，他们中许多人是从三十年代失败的革命中幸存下来的，曾以为这辈子不会再看到这一天。欢呼声淹没了各色熙熙攘攘的人群，于是在安第斯山脉脚下，红旗重新升起。"
 CHL_redress_socialist_republic:0 "平反社会主义共和国"
 CHL_redress_socialist_republic_desc:0 "人民阵线执政后很快就打算为三十年代初期被推翻的社会主义共和国正式平反。国会通过决议宣布当年的军事政变为非法，恢复所有被迫害的前政权成员的名誉，并在圣地亚哥市中心建立纪念碑以纪念那些为革命牺牲的人们。政府档案中那些曾被列为叛国者的名字，现在被印在教科书里作为智利社会主义运动的先驱来讲述。这项举措的意义远不止于当下历史评价作为印象的修正，实际上也重新接续了被暴力中断的社会主义政治传统，赋予当前政权以我们原有的深厚历史合法性。"
 CHL_progressive_democratic_programme:0 "进步民主纲领"
 CHL_progressive_democratic_programme_desc:0 "激进党与人民阵线合作达成的共同纲领，内容包括扩大社会福利覆盖面、强化劳工集体谈判权、推行累进税制以及保障公民政治自由等。这份纲领是两个政治传统相当不同的力量之间妥协的产物：激进党的意图更侧重制度内改良和程序正义，人民阵线则更倾向于经济结构变革和群众动员。双方约定在选后根据得票比例分配内阁席位，而共同承担执政责任。"
 CHL_defend_mapchea_rights:0 "马普切人自治"
 CHL_defend_mapchea_rights_desc:0 "人民阵线政府在南锥体地区率先推行原住民自治政策，承认马普切人对传统领地的集体所有权，在阿劳卡尼亚地区设立马普切自治区，赋予其独立或半独立的司法、教育和文化管理权限。政府派出工作组与马普切社区长老进行了长期的协商最终达成协议。这项政策在智利社会引发了广泛争议，中南部省份的非原住民地主们强烈的反对土地归还条款，但政府坚持社会主义政权如果连国内最古老的被压迫民族都不解放，就没有资格自称革命的立场，并准备着手于弹压这些人。"
 CHL_ally_38ers:0 "联合38人"
 CHL_ally_38ers_desc:0 "人民阵线向革命失败后幸存下来的激进左翼团体发出邀请，这些团体在漫长的地下斗争中积累了丰富的组织经验和基层人脉，但其政治影响长期被主流左翼所忽视。为这些团体提供了合法的政治活动空间后，同时吸纳其部分领导人进入政府咨询机构。这些老战士的回归为人民阵线注入了一股粗粝而执着的革命精神，他们在政府会议上的发言往往比年轻的部长们更激进直接而不愿妥协。"
 CHL_worker_dignity:0 "工人尊严"
 CHL_worker_dignity_desc:0 "激进党在第二任期内将劳工权益提升为政府的核心议题之一。新的劳动法规定了最高工时上限、最低工资标准和强制性的工伤保险，同时赋予工会在集体谈判中更大的法定权力。工作不只是谋生，也是人的尊严的一部分。这项政策巩固了激进党在工人群体中的支持率，也引发了企业界对劳动力成本上升的担忧。"
 CHL_socialism_rebirth:0 "社会主义涅槃重生"
 CHL_socialism_rebirth_desc:0 "人民阵线在其执政的巅峰时期将智利社会主义运动的全部历史资源——从三十年代的革命先驱，到工会运动的地下斗争，再到左翼知识分子半个世纪的笔耕——汇聚成一幅宏大的政治叙述史诗，宣告社会主义在智利的彻底重生。圣地亚哥举行了规模空前的庆祝活动，游行队伍从工人区一直延伸到总统府前的宪法广场。老战士们穿着珍藏多年的旧军装走在队伍前列，上面别着三十年代革命时期的徽章，多是已经锈迹斑斑。没有人再用悲情而咏叹的语调谈论当年的失败，因为失败已经被今天的胜利重新诉说为一个伟大故事必要的序章。公众演讲中很长一段篇幅逐一在念出那些没能活到今天的革命者的名字，广场上是一片寂静，然后铿锵与热情的音乐重新响起，整座城市再次被歌声和脚步的节奏所充满。社会主义在智利不被禁止，社会主义在智利不再需隐藏，复活日降临在圣地亚哥，如同在你与我之间。"
 CHL_radical_second:0 "激进党第二任期"
 CHL_radical_second_desc:0 "激进党在第二次大选中再次获得执政授权，选民对其推进的社会改革和扩大公共参与的政策给予了持续支持。连任后的施政方向在原有教育普及和政治民主化基础上进一步扩展，涉及劳工权益保护、地方自治扩权以及国家在经济发展中角色的重新定义。激进党的领导层中也有新一代人物开始崭露头角，他们比前辈更愿意谈论经济平等问题，也更敢于触碰传统上与激进党保持距离的工会和社区组织。"
 CHL_radical_youth:0 "激进青年团"
 CHL_radical_youth_desc:0 "激进党为了培养后备政治力量，正式将党内青年组织制度化。激进青年团在各大学和主要城镇设立分支，成员定期参加政治理论学习、公共演讲训练和社区服务活动。青年团除了培训平台也逐渐化为党内推动政策革新的压力团体，其领导层在党代会上多次提出比党内主流更激进的社会改革方案，引发了党内老一辈与新生代之间的活跃辩论。"
 CHL_import_instead_industialize:0 "进口替代工业化"
 CHL_import_instead_industialize_desc:0 "政府推出一套系统性的产业政策，旨在用国产工业品替代长期以来依赖进口的制成品。保护性关税被提高，国家银行向本土制造业提供低息贷款，外国工业品进口则需要申请许可证。这套政策在短期内刺激了轻工业的快速发展，纺织、食品加工和日用消费品行业的产量显著上升。同时其实也有批评者指出，高关税环境下本土产品质量参差不齐，没有形成有效的自主发展，消费者实际支付了不必要的更高的价格，但政府坚持认为工业基础的建立本身就是价值，其长期收益将超过短期的市场效率损失，无需在这样的决定上胡言乱语大做文章。"
 CHL_reason_and_democracy:0 "理性与民主"
 CHL_reason_and_democracy_desc:0 "自由党与激进党在政治改革议题上找到了共同语言，推动了一套以理性讨论和程序正义为核心的议会改革方案。例如国会辩论程序被规范化，议案审议引入了专家听证环节，政府决策被要求提供充分的数据支撑和法律依据……这套改革的目的在于提升立法质量，避免决策被民粹情绪或密室政治所绑架。民主不仅是一场关于人数的游戏，也是一场关于理性的深度修行。"
 CHL_enlightment_spirit:0 "启蒙精神永存"
 CHL_enlightment_spirit_desc:0 "将本党的政治遗产与启蒙运动的思想传统明确联结起来，资助出版了一套面向大众的启蒙思想普及丛书——在全国各大城市举办了以“理性、进步、自由”为主题的公共展览。我们将激进党的百年奋斗史概括为启蒙精神在智利土地上的实践史：宛如普及教育是为了让每一个公民都能运用自己的理性，扩大选举权是为了让每一个成年的灵魂都在政治中有重量，保障劳工权益是为了让文明的光芒绝不仅仅照耀在精英大户的书房里。"
 CHL_liberal_second:0 "自由党第二任期"
 CHL_liberal_second_desc:0 "自由党在第二次大选中成功连任，选民对其执政期间的经济表现和相对温和的社会政策给予了正面评价。连任后的施政重点放在深化产业改革和扩大国际贸易关系上，政府表示将继续奉行自由市场原则，同时维持适度的社会保障以免激化社会矛盾。自由党领导层意识到连任带来的政治资本是有限期的，必须在上任初期推动那些最有争议的改革——一旦过了中期选举，国会里的反对派就不会再配合了。"
 CHL_maintain_liberal_spirit:0 "存续自由精神"
 CHL_maintain_liberal_spirit_desc:0 "自由党政府在任期将尽时发起了一项旨在传承本党意识形态的社会运动，通过设立基金会、资助学术研究和在中小学推广自由主义思想教育来确保自由精神不会随政权更迭而消散。党的元老们意识到，自由党在智利政治中的胜败浮沉难以预料，但自由主义作为一种世界观需要比政党更长的生命。各大城市的图书馆和大学收到了专项资助，用于购置自由主义经典著作和举办讲座，一批自由主义知识精英在这一时期逐渐成长起来，作为自由主义政治的后备军形成了一个跨越党派的松散思想团体。"
 CHL_continue_liberalize_policy:0 "继续自由放任"
 CHL_continue_liberalize_policy_desc:0 "自由党坚持经济自由化路线，减少政府对市场的干预，降低进口关税，吸引外国投资。与早期自由主义不同的是，本届政府在经济政策中同时表现出对温和社会主义者的亲和态度，承认市场机制在分配领域存在缺陷，支持建立基本的公共福利制度和工人参与企业分红的机制。政府发言人还曾将这套政策命名为“社会化的自由经济”，其目的无非是在与左翼的竞争中挖走温和派选民，同时不失去资本家的信心。"
 CHL_relation_with_conservatives:0 "与保守党的关系"
 CHL_relation_with_conservatives_desc:0 "自由党在第二次大选后主动向温和保守派伸出橄榄枝，试图在国会中建立一个跨党派的中间联盟。政府意识到在重大立法事项上单靠自由党自身的席位不足以确保通过，而温和保守派在经济自由化议题上的立场与自由党高度重合。双方在多次闭门会谈后达成了非正式的合作协议，在短期内增强了政府的立法能力，尽管也引发了党内左翼的不满，认为自由党正在模糊自己的政治身份。"
 CHL_legacy_of_liberal_government:0 "自由政府的遗产"
 CHL_legacy_of_liberal_government_desc:0 "自由党政府将本届政府任内完成的主要事业列举：税率结构的简化、对外贸易的扩展、公民自由的保障以及社会保障体系的基础搭建。这些成就不像如战争胜利那样具备戏剧性，也缺乏革命式变革的冲击力，但自由党领导人强调，自由政府的遗产恰恰在于它的平凡和实在——作为一个让人民可以安静地经营生活的国家，比起那些被宏大口号和战争动员所笼罩的政权或许更能经得起时间的冲刷。"
 CHL_new_face_in_party:0 "党的新面孔"
 CHL_new_face_in_party_desc:0 "贡萨雷斯·冯·马雷斯接管自由党领导权后对党的组织架构和公众形象进行了彻底改造。这位从国家社会主义运动中走出来的政治人物为自由党带来了前所未有的动员能力和宣传技巧，同时也带来了大量来自原极右翼阵营的追随者。自由党传统的精英俱乐部气质被街头政治和群众集会的热烈场面所取代，就连党徽也被重新设计，党歌被重新谱写，哪怕老党员们对这个新面孔感到陌生，也不得不承认它确实吸引了大量的新支持者。"
 CHL_cut_ties_with_far_right:0 "与极右翼切割"
 CHL_cut_ties_with_far_right_desc:0 "冯·马雷斯在巩固了党内的领导地位后，开始刻意与极右翼团体拉开距离。政府出动警察接管了若干极右翼控制的产业——包括钢铁厂与矿业公司——将这些企业纳入国家管理或转交给与自由党关系密切的私营资本。极右翼领导人对此暴怒，在街头报刊上痛骂冯·马雷斯是国家的叛徒，但这恰恰帮助后者在温和选民中洗刷了极右背景，证明了他可以为了国家利益压制过去的盟友。"
 CHL_liberal_corporatism:0 "自由法团主义"
 CHL_liberal_corporatism_desc:0 "自由党在冯·马雷斯的领导下提出了一套独特的经济社会理论，将法团主义的行业组织原则与自由主义的经济政策相结合。政府按产业部门建立法定行业协会，劳资双方在协会框架内协商工资和劳动条件，国家担任调解者而非强制者的角色。这套制度被设计用来替代阶级斗争和工会对抗，同时保留市场机制在资源配置中的主导作用。"
 CHL_anti_nationalism_stance:0 "反民族主义立场"
 CHL_anti_nationalism_stance_desc:0 "与智利右翼主流形成鲜明对比的是，冯·马雷斯领导的自由党在对外政策上明确反对民族主义狂热。冯·马雷斯在多次演说中批评那种认为智利作为某种民族共同体必须征服南锥体、必须统治拉丁美洲的宏大叙事。自由党主张智利应当专注于内部发展和制度建设。这一立场使得自由党在外交精英和知识分子群体中获得了认同，同时也招致右翼阵营的攻击，是被指责“缺乏爱国心”。"
 CHL_leftist_allies:0 "左派盟友"
 CHL_leftist_allies_desc:0 "自由党在构建政治联盟时做出了一个在当时颇为出人意料的决定：主动接触温和左派团体，邀请它们在地方选举和部分立法议题上结盟。冯·马雷斯的逻辑是，温和左派在经济分配问题上的诉求可以与自由党的产业政策找到交集，而双方在反对右翼民族主义这一点上更是天然的同盟。数个温和社会主义团体最终接受了邀请，在随后几年中与自由党形成了一个松散的以具体议题为导向的合作网络。"
 CHL_no_immigrants:0 "制止移民"
 CHL_no_immigrants_desc:0 "自由党政府出台了一套颇为严格的移民管制措施，其公开理由是保护国内劳动力市场不受外来廉价劳动力的冲击。新移民法大幅提高了永久居留的申请门槛，收紧了对无证移民的执法力度，同时停止了对非西语国家移民的优待政策。冯·马雷斯政府在这一问题上的强硬态度大概指向：劳动力的自由流动必须以保护国内工人的基本权益为前提。"
 CHL_liberal_torch_in_hands_of_el_jefe:0 "领袖手中的自由火炬"
 CHL_liberal_torch_in_hands_of_el_jefe_desc:0 "政府发布的长篇政纲称冯·马雷斯领导下的自由党为自由的最终捍卫者——这里的自由既不同于保守党的传统自由，也不同于激进党所倡导的政治自由，而是一种由强有力领袖保障的、秩序框架内的公民自由。在首都举行了盛大的火炬游行，数万人手持火把从总统府步行至宪法广场，火炬的光在夜色中汇成一条移动的火星河流。夜晚是“自由照耀智利的一夜”，拥有明智领袖国家的神圣记忆。"
 CHL_maintain_status_quo:0 "维持现状"
 CHL_maintain_status_quo_desc:0 "南锥体战争顺利，伟大的胜利来到了我们手中！将军万岁！智利政府万岁！他解放我们，使我们得到自主与不受威胁的环境，这是再好不过了，民众将鼎力支持现存之政府的，我们相信一定是这样。\n今天很好，希望明天也是。"
 CHL_davila_rule_continue:0 "达维拉统治延续"
 CHL_davila_rule_continue_desc:0 "达维拉将军继续执政，因为他为我们带来了伟大的胜利！胜利者不需要为自己的统治做多余的辩护，胜利本身就是那最高的合法性。革命者们的尸体还躺在安第斯山脉东麓的战壕里，他们的理想在圣地亚哥渐渐泯灭……"
 CHL_army_loyalty:0 "清洗军队"
 CHL_army_loyalty_desc:0 "军队是达维拉政权的脊梁骨，这根骨头里面不能有任何碎渣。格洛韦的残党、共产主义同情者、曾经在私下里串联过政变计划的军官，让他们一个接一个地从军队名册上消失，就建成这样的军事纪律，任何不绝对忠诚于达维拉将军的军人都是对国家安全的直接威胁。军事法庭的工作效率比战前提高了整整三倍，审判记录则是直接简洁到只剩姓名军衔和判决结果。"
 CHL_bolivian_experence:0 "学习玻利维亚经验"
 CHL_bolivian_experence_desc:0 "玻利维亚的军政府模式是南美洲最成功的威权实验之一，圣地亚哥派出的考察团带回的报告写得密密麻麻，这些经验的核心内容是军队直接管理国家经济、社会组织和地方行政，把政府本身变成一台军事机器。达维拉将军显然不打算搞什么过渡时期的特殊安排，毕竟玻利维亚已经用十几年的实践证明了这条路走得通。"
 CHL_split_the_left:0 "分化左派"
 CHL_split_the_left_desc:0 "左翼不是铁板一块，温和社会主义者和激进革命派之间隔着一整条意识形态的长距与零散的鸿沟。达维拉政权把这条鸿沟当成了自己的战略资产，那些温和社会主义者被邀请进入政府框架内的咨询机构，给他们以办公室、薪水和体面的头衔，换取他们在政治上公开支持与加入政权。这种红皮专制的联盟本质是把一部分左派变成右翼独裁政权的装饰品，装饰品在橱窗里看着体面，对窗外的工人运动已经起不到任何保护作用了。"
 CHL_nationalist_establishments:0 "建制化民族主义者"
 CHL_nationalist_establishments_desc:0 "民族主义被当成街头运动与恐怖袭击的消耗品可就太浪费了，它必须被建制化纳入国家机器的运转齿轮。达维拉政权建立了一套从中央到地方的民族主义组织体系，把曾经散落在各个右翼小党里的民族主义分子全部吸收入政府架构。民族主义者的激情被驯化为一套官方的、规范化的、可复制的话术，激进的民族主义冲动被转化为对领袖和国家的制度化忠诚。"
 CHL_true_socialists_lol:0 "真正人本之社会主义"
 CHL_true_socialists_lol_desc:0 "我们的政治修辞中有一个奇怪的概念叫人本社会主义，它的定义是剥离阶级斗争和无产阶级专政之后的社会主义，保留了福利和再分配的功能，当然也顺便剔除了革命的灵魂。我们认为社会主义的实质是让工人得到一些物质好处，同时彻底放弃政治权力，用福利换自由，用补贴换选票，用体面的工资换以世纪的沉默。达维拉对此坦诚得惊人，直言工人不应该关心谁在统治国家，工人只需要关心工资有没有准时发，工时有没有被缩短，退休金有没有保障，一日这些不出问题，怎能就这样质疑政权。"
 CHL_implement_davila_plan:0 "完成达维拉计划"
 CHL_implement_davila_plan_desc:0 "这一涵盖经济、社会和政治的全面宏大纲领的最终目标是建立一套稳定的威权发展体制。把所有的改革打包成一套不可逆转的制度架构，国家的经济命脉握在军方手里，反对派则被压缩到毫无生存空间，工人运动被阉割成国家的附属部门……南锥体军事独裁最完整的迷惑性版本也就此建成了。"
 CHL_complete_nationalize:0 "全面国有化"
 CHL_complete_nationalize_desc:0 "矿山、工厂、铁路、港口全部都收归国有。左翼人士听到这个政策一度以为达维拉精神失常，一个军政府在搞国有化不可笑吗？可是他们怎么知道国有化是把经济命脉从外国资本和私人寡头手里拿回来交给国家的手段，国家是军队的国家，军队是达维拉的军队。全面国有化是国家资本主义的最高形式，使所有权集中到唯一的股东手里，而说白了这个股东同时还是你的总司令。"
 CHL_production_council:0 "生产总委员会"
 CHL_production_council_desc:0 "国有化之后需要一个管理机构，生产总委员会应运而生。这个委员会由军方经济专家和经过甄别的技术官僚组成，全权负责全国的生产计划、资源配置和价格管制。生产总委员会取代了市场调节，取代了工会的协商功能，取代了企业主的经营自主权，它把整个国民经济变成了一间巨大的，被接管的司令部。"
 CHL_halt_production_exceeds:0 "制止生产过剩"
 CHL_halt_production_exceeds_desc:0 "资本主义的顽疾是生产过剩，东西造得太多了工厂就要倒闭，工人就要失业。达维拉政权对此开出的药方是由国家直接控制产量，根据需求制定生产指标，彻底杜绝供过于求的危机。也就是说要把经济完全计划化，按照政府的指令来平衡供需。自由派经济学家对此惊骇万分，不过他们的惊恐只是理论上的洁癖罢了。"
 CHL_except_foreign_capital:0 "但外国资本除外"
 CHL_except_foreign_capital_desc:0 "国有化有个体面的例外，外国投资不受国有化影响。达维拉政权对帝国主义资本的友好态度是经过精确计算的：智利需要外资来维持经济增长，需要外资的技术和市场渠道，需要外资背后的宗主国在外交和军事上的支持。国内资本可以被任意处置，外国资本享有豁免权。尽管这一条政策把达维拉政权的所有反帝修辞都变成了笑话——外国人不是傻瓜，他们知道达维拉不是真的反帝，他只是反那些不是他盟友的资本家——不过智利的政权的确从中获得了实际的利益啊。"
 CHL_recontribute_wealth_welfare:0 "再分配与福利计划"
 CHL_recontribute_wealth_welfare_desc:0 "国有化创造的利润一部分被用于再分配，工人获得了有限的工资提升和福利保障。再分配被称为人本社会主义的核心成果，其修辞策略无非是把每一个铜板的好处都夸张成改天换地的跃进，或者某种其他本质的改变。再分配与福利计划作为我们新的潜规则式社会契约：人民得到面包和马戏，将军得到绝对的权力，双方各取所需，这可是谁也不欠谁的。"
 CHL_left_corporatist_state:0 "左翼法团国家"
 CHL_left_corporatist_state_desc:0 "法团国家按行业把社会分成不同的法团，每个法团由国家任命的官员负责管理，左翼则是被塞进这套自上而下的控制体系里的那些各式工团主义残余与形式。左翼法团国家的体制是将军对工团主义的全面收缴，把工会从工人自己的组织变成了国家控制工人的组织。工人被允许保留工会的旗号和集会，条件是他们永远不能越过政府画好的圈子。"
 CHL_realize_estado_socialismo:0 "实现国家社会主义"
 CHL_realize_estado_socialismo_desc:0 "以国家为唯一的核心，以社会主义为福利工具，以军队为统治支柱，以领袖为最高权威。这样的国家社会主义的旗帜在圣地亚哥升起，旗杆就是实心的铸铁，旗面是那社会主义的鲜红，边角都有些肮脏褪色了。南锥体的工人们在达维拉的国家社会主义下面获得了物质补偿和绝对服从的义务，这些革命的陌路人被允许吃饱穿暖，在政府组织的游行中欢呼，唯独不被允许开口。"
 CHL_return_of_ibanes_del_campo:0 "德尔坎波的归来"
 CHL_return_of_ibanes_del_campo_desc:0 "卡洛斯·伊瓦涅斯·德尔坎波重新出现在圣地亚哥的政治舞台上，对智利政治记忆进行了一次猛烈之唤醒。在二十年代以铁腕著称的前任总统，在那个年代还没有任何拉丁美洲强人能像他那样同时讨好街头的穷人和军营里的军官。现在他又回来了，带着更加成熟的经验和对自由主义更深沉的蔑视，自由民主在智利已经被证明是一场漫长的闹剧，现在是该有人来收拾残局的时候了。"
 CHL_libdem_failure:0 "自由民主已然失败"
 CHL_libdem_failure_desc:0 "经济危机、社会撕裂、军队分裂、国际地位一落千丈。这样的议会制度何济于事也？自由民主许诺了繁荣和自由，兑现的却是贫困和依附。伊瓦涅斯回归的政治宣言揭开了对自由民主的全面清算序幕，声称这套制度是外国人的舶来品，因此并不适应智利的土壤，制造了许多腐败和无能，在危机面前只会发抖。自由民主已然失败！让伊瓦涅斯来收走它的尸体！"
 CHL_big_tent:0 "组建大帐篷政府"
 CHL_big_tent_desc:0 "伊瓦涅斯不是某书的教条主义者，他清楚单靠军队和右翼民族主义者撑不起一个稳定有效的政府。社民改良派、独裁民粹派、温和保守派和部分被收编的工团主义者统统被邀请入阁。大帐篷容得下任何愿意接受伊瓦涅斯领导的人，条件是所有人都必须接受政权是伊瓦涅斯说了算。大帐篷里有各种各样的面孔，只有在禁锢之下勉强变换表情，来进行他们那孱弱的表达。"
 CHL_ban_left_union:0 "取缔左翼工会组织"
 CHL_ban_left_union_desc:0 "激进的左翼工会继续存在就是对国家权威的公开羞辱，伊瓦涅斯政府决定对此不再容忍。左翼工会被取缔，工会资产被没收，工会领袖被逮捕或被驱逐。我们很快也遭到了零星的街头抵抗，不过在宪兵队出动的情况下用了几个小时就把抵抗处理干净了。伊瓦涅斯对此评论到：工会恶贼们不是说自己是无产阶级的先锋吗，现在就看看先锋在监狱里怎么带领你们的队伍吧。"
 CHL_wisdom_of_peron:0 "庇隆的智慧"
 CHL_wisdom_of_peron_desc:0 "阿根廷的胡安·庇隆是伊瓦涅斯最欣赏的年轻政治家，这种庇隆主义在南锥体的流行给了伊瓦涅斯一套可以直接借鉴的模板。庇隆的智慧包括如强人领袖的直接动员能力、对工人阶级的怀柔政策、以国家为主导的经济民族主义、以及用社会福利换取政治服从的精妙计算。伊瓦涅斯把庇隆的经验移植到了智利，他毫不介意被人称为智利的庇隆，强人之间如果为了真正的有效，需要的原创性的虚荣也可以被抛弃。"
 CHL_reverse_socialist_reform:0 "逆转社会主义改革"
 CHL_reverse_socialist_reform_desc:0 "社会主义共和国政府遗留下来的社会主义改革项目被一项接一项地撤销，速度之快让保守派欢呼，让左派悲鸣与措手不及。土地改革被推翻了，地契重新回到原主手里；工人委员会的法定权力被剥夺，企业管理的决定权归还给经理层；教育领域的进步主义课程大纲被废弃，重新换上传统的德育和宗教内容……修修补补乎？倒行逆施乎？把革命连根刨出的悲剧已是无人关心，随着新的春天把土壤又翻一遍，就确保再也长不出同样的东西……"
 CHL_state_reconstruction:0 "重建国家"
 CHL_state_reconstruction_desc:0 "我们要重建国家！战后的智利在伊瓦涅斯嘴里是一栋危房，地基疏松，墙壁皲裂，屋顶漏雨，自由主义的设计图全是错谬，社会主义的装修工人全是贼寇。重建国家从现在开始按照伊瓦涅斯亲自审定的图纸和施工队伍从头来过，从宪法到街道委员会，没有任何东西可以逃过我们重建的铁锤。"
 CHL_klein_sax_representives:0 "克莱因—萨克斯代表团"
 CHL_klein_sax_representives_desc:0 "来自美国的克莱因-萨克斯经济代表团被伊瓦涅斯政府奉为上宾，这群来自芝加哥和华尔街的技术官僚带着自由主义的经济药方走进圣地亚哥：紧缩财政、开放市场、私有化国有企业与削减福利开支。智利那样需要可贵的秩序，秩序需要发展也就是经济的层面，发展又需要你们的钱与慈悲。休克疗法在南美山脚下又找到了一块新的政治经济试验田……"
 CHL_steadily_end_partisanship:0 "稳步终结党派政治"
 CHL_steadily_end_partisanship_desc:0 "伊瓦涅斯对政党政治的处理方是稳步的不声张的，用行政和立法手段逐步收紧深黑的绞索。政党的注册条件被抬高拖延，选举被推迟淤弊，议会的权力被转移到行政机构。政客们在这个过程中互相嘶喊，脸红脖子粗的指责对方配合威权，可是到他们发现已经没有舞台可供他们表演的时候，党派政治就该安静地断气了。"
 CHL_massive_public_works:0 "大规模公共工程"
 CHL_massive_public_works_desc:0 "公路、水坝、港口、政府大楼、体育场……大规模的公共工程在全国各地同时开工。这些公共工程计划同时实现了多重目标：拉动就业、刺激经济、塑造强人领袖的纪念碑式政绩、把工人的注意力从政治斗争转移到搬砖和水泥上。每一座新落成的政府大楼外墙上都嵌着伊瓦涅斯名字的字母浮雕，那些沉默无言的手与嘴于是抬头看一眼自己的劳动成果，然后低头继续去修下一座，下下一座……"
 CHL_state_banks:0 "国家银行"
 CHL_state_banks_desc:0 "中央银行被改组为国家银行，把货币发行权和信贷分配权集中到了政府手里。维持币值稳定或抑制通胀也不是他们的焦点，为政府的工业化和公共工程提供无限度的廉价融资才是此行的根本目的。哪怕有经济学家在报纸上警告滥发货币的灾难性后果，这些异见的专栏在国家银行的印钞机面前显得轻得那样没有重量。"
 CHL_authoritian_development_mode:0 "威权发展模式"
 CHL_authoritian_development_mode_desc:0 "智利的核心模式是经济增长靠国家强力推动，社会秩序靠军队和警察维持，政治参与靠领袖个人的魅力来疏导。这套模式在智利运转起来的起始数据确实是肯定要好看，工业产值又在上涨，就业率回升了，基建里程数被拉得很长。理论家在国内刊物上长篇论证“发展需要秩序”的陈词滥调，其他如自由派的报纸则被禁止反驳。"
 CHL_ibanez_populism:0 "伊巴涅斯民粹主义"
 CHL_ibanez_populism_desc:0 "伊瓦涅斯和民众之间的直接联系不需要通过政党和议会来中转，他本人就是所有的中转站、信息中心和情感投射对象。此人定期出现在贫民区、工矿区和农村集会上，站在讲台上对台下成千上万的人直接高声喊话，使用的语言就像让人群听懂并且欢呼的街头词汇和民谣调子。煽动的便是领袖和群众之间的一次又一次的情感快充，无眼的群众从他身上获得安全和尊严感，自豪的他从群众身上获得欢呼和合法性，政党在这两者之间显得似乎完全多余。"
 CHL_peoples_caudilo:0 "人民的考迪罗"
 CHL_peoples_caudilo_desc:0 "拉丁美洲政治最古老的传统之一就是强人领袖骑在马背上统治，手里握剑，人似玻利瓦尔或者别的什么人，留下姿势与动态都相似的雕像。伊瓦涅斯把考迪罗传统现代化了，他站在敞篷车上穿过人群，仿佛那就是他的高大战马，利剑换成了麦克风，原来要有的刻字刻在了全国每一个基建项目上。人民的考迪罗，他在广场上享受海啸般的欢呼时，他的警察正在几条街之外驱散批评者，他的经济学家正在办公室里为即将到来的通货膨胀准备辩解与推诿的说辞，他的副手们正在密室中讨论如何让下一次选举在统计数字上看起来无可挑剔。我们知道人民爱他，他也爱人民，这份爱的保质期取决于他还能从国家手里拿出多少面包来分，不过其实今天很美好，不是吗。"
 CHL_pinochet_coups:0 "皮诺切特拯救智利"
 CHL_pinochet_coups_desc:0 "柯卡特庄园的密谈破裂了！那些穿着深色西装的老爷们就这样谈崩了，忙于互相指责对方逾越协议。圣地亚哥的街头无时停止骚动着，工人区里流传着军队即将再次出动的传言，富人区里流传着左翼即将反攻的恐惧。在这些传言和恐惧之间，奥古斯托·皮诺切特，一个名字在几个月前还只出现在军校教员名册上的年轻上校带着他的参谋军官走进了无人把守的总统府。后来人们反复争论着：他究竟是闯入了权力的真空，还是被真空之空泡吸入……他自己或许也说不清楚。这个在社会主义共和国时期读完军校、在战后思想泥潭里反复挣扎变易的年轻人，此刻站在总统府的外台上面对着厌倦了所有人咒骂的城市，那么他来宣布秩序了。问题在于秩序和独裁的意象似乎从来那样相近。"
 CHL_purge_farright:0 "镇压极右翼"
 CHL_purge_farright_desc:0 "那些以为皮诺切特是自己人的极右翼团体最先尝到了新秩序的滋味，国家社会主义运动的冲锋队被勒令解散，卡洛斯·凯勒的党羽被逐出政府大楼，国家秩序阵线的神秘主义刊物被查抄。在革命年代成长起来的年轻军官对旧式右翼的本能厌恶被肆意的挥洒。年轻的皮诺切特见了社会主义共和国，那场实验在他脑子里留下了不可磨灭的一种坚持所见的残影。他镇压极右翼的时候下手利落，像是在割除自己阵营里最让他羞耻的那部分组织。被镇压的人至死都不明白发生了什么，以为他只是另一个达维拉，只可惜他们猜错了。"
 CHL_save_socrep_legacy:0 "抢救社会主义共和国的遗产"
 CHL_save_socrep_legacy_desc:0 "社会主义时代的社会政策被皮诺切特部分地保留了下来，这让所有人感到困惑。一个亲进步派的独裁者？以前的政治里可没有这样的人。哪怕皮诺切特自己对这件事的解释都很含混，共和国做对过一些事情，把做对的事情扔掉是蠢人干的事。他抢救了共和国曾经证明有效的一切，这些事情包括劳工保护、基础教育扩张和农村医疗网络。左翼把他视为篡位者，把左翼的遗产偷来放在自己的执政架构上，这类行为更像是继承中的篡改，也可能是篡改中的继承？"
 CHL_army_purge:0 "军队清洗"
 CHL_army_purge_desc:0 "军队里盘踞着那些个旧民族主义分子，这些人已经习惯把军队当成自己的封地。皮诺切特发动了一场从上到下的清洗，旧派军官被强令退役，民族主义倾向明显的部队被拆散重编，军校课程被重新审定，对领袖的个人崇拜被替换为对国家制度的忠诚教育。虽然客观上确实铲除了异己，清洗军队的逻辑是按照一个职业军官对军队的理解去重塑军队。皮诺切特心目中的军队是服从国家而非某个人的工具，尽管他自己正在变成那个不可被挑战的人。这个矛盾他也没有解决，意识到后，他把这个问题扔掉了。"
 CHL_helicopter_rides_lol:0 "肃清反革命"
 CHL_helicopter_rides_lol_desc:0 "反革命的定义被皮诺切特政府扩大得很宽泛。极右翼的颠覆阴谋是反革命，极左翼的地下抵抗是反革命，资本家用经济破坏来对抗国家政策也是反革命。反反革命作为一场同时在多个方向上进行的战争，情报部门日夜运转，拘留营里关满了彼此仇视到不可思议的人——法西斯分子和社会主义者被关在同一个牢房里，他们共同的罪名是反对皮诺切特。这种四面树敌的做法在外界看来无异于是政治上的自杀，但在他自己的计算里却是维持平衡的某种奇特方式：或许让每一个极端派别都忙于对付他而抽不出力量来对付彼此，智利就不会再打一场内战了。"
 CHL_martial_law:0 "戒严为民"
 CHL_martial_law_desc:0 "戒严令以保护人民的名义被颁布。宵禁时间到了，街头巡逻的宪兵有权检查任何人的证件，公共集会需要提前报备并经审批。戒严是压制，为民是服务，把两个方向相反的词焊在一起就有类皮诺切特的执政风格。他似乎真心认为自己是在为人民戒严，这让他的批评者感到比面对一个纯粹虚伪的独裁者更难以应对。"
 CHL_between_democracy_dictatorship:0 "民主与独裁之间"
 CHL_between_democracy_dictatorship_desc:0 "在深夜里，皮诺切特不得不独自面对这个问题。民主在他年轻时是共和国教科书上的某种晦涩承诺，独裁似乎是他此刻正在越来越靠近做的事情，这两个词之间的空间那样遥远，类似他每天在总统办公室里踱步的距离。他阅读所有能弄到手的政治学著作，召见不同立场的学者进行长谈，在他的私人笔记里涂写关于什么过渡方案的草图……过渡总是被推迟，推迟的理由也总是很充分：经济尚未稳定，极右翼仍有残余，左翼的地下网络未被根除，国际局势尚且不利。理由可以无限列举，每一个理由单独看都站得住脚，放在一起就是一条永远走不完的过渡之路了。在这条路上皮诺切特感到渐渐老去，同时渐渐习惯了权力像自己的第二层皮肤贴在身上的感觉，渐渐忘记了当初他写字的时候用的是铅笔还是钢笔……"
 CHL_continue_emergency_state:0 "延续紧急状态"
 CHL_continue_emergency_state_desc:0 "紧急状态被延续期限而设定为直到局势彻底稳定为止，局势彻底稳定的定义却模糊着没有写在任何法律条文里，只靠皮诺切特自己的判断。只要他认为不稳定，紧急状态就不会解除。自我循环的逻辑怪圈由来了，使得紧急状态赋予他权力去镇压不稳定因素，不稳定因素的存在反过来论证了紧急状态的必要性。他怪圈里沉坐，权力的惯性让这一切变得自然了，像是上下班时我们不再感觉到重量的手表。"
 CHL_establish_dina:0 "建立军事情报局"
 CHL_establish_dina_desc:0 "军事情报局在皮诺切特手中被建立，效力和权限远超一般情报机构。收集敌国军事情报，监视的也是智利公民。档案柜里按照字母顺序排列着那些工会领袖、反对派政客、不安分的知识分子、可能构成潜在威胁的军官。皮诺切特对情报的痴迷在政府内部众所周知，他会亲自翻阅最敏感的那部分档案，在页边用红笔批注。他是独裁者，同时也是一个军校教官出身的细节控？仿佛又回到了那个并不优秀的军校学生身上呢……"
 CHL_experience_of_chicago_boys:0 "芝加哥男孩的经验"
 CHL_experience_of_chicago_boys_desc:0 "米尔顿·弗里德曼在芝加哥大学培养出来的那一批智利经济学家被皮诺切特请进了政府经济部门，他们带来的药方是休克疗法：大幅削减公共开支、开放市场、私有化国有企业、严格控制货币供应。这套方案在理论上完美无缺，在实践中让无数智利家庭在过渡期里失去了饭碗和医疗保障。长篇大论的经济学论文写满了效率与增长，独缺了在贫困家庭餐桌上的尽头。不是一个经济自由主义者的皮诺切特信任了，因为他们的方案看起来有序科学而不需要如街头政治的支持。后来经济确实回升，谁知道这期间发生了什么呢。"
 CHL_total_patriot_front:0 "全民爱国阵线"
 CHL_total_patriot_front_desc:0 "工团主义被皮诺切特吸纳进了官方体制，就是把工团主义从革命传统中剥离出来改造成一个可控制的政治平台。全民爱国阵线容纳了被改造过的工团团体、退伍军人协会、妇女组织和青年俱乐部，在法定框架内表达一种经过审批的爱国主义。工团领袖们被邀请入阵线的时候得到的是体面的办公场所和有限的发言权，代价是他们不能再自行组织罢工和街头集会。一些人接受了交易，一些人不接受，不接受的人自然被请到了别的地方。"
 CHL_seek_church_support:0 "寻求教会支持"
 CHL_seek_church_support_desc:0 "天主教会是智利唯一能和皮诺切特保持对话而不必完全屈从的社会力量。主教们在私下会面中表达了人道主义关切，皮诺切特的回应是给予教会在教育和社会福利领域的更多空间，同时委婉而坚定地拒绝任何公开的政治批评。最终教会和国家之间达成了一种灰色的共生关系：教会不公开挑战政权的合法性，政权不公开侵犯教会的底线。灰色地带中的主教们渐渐分裂，一些人和政权合作，一些人默默庇护着被迫害者，所有人都在良心的灰色里向各自的神父祷告。"
 CHL_localize_syndicalism:0 "本地化工团主义"
 CHL_localize_syndicalism_desc:0 "工会体系被从欧洲工团主义的跨国传统中剪切落地，植扎入了智利本土的政治土壤。我们强调工人和国家之间的直接关系，工人不需要国际劳工运动的指导，工人需要的是和国家的合作。罢工权利在法条里被保留，在实践里被审核程序无限期地延迟审批，法律上的权利和实际里的权利之间隔着一条被高位者亲手设计的行政鸿沟。"
 CHL_victory_over_corruption:0 "向腐败宣战"
 CHL_victory_over_corruption_desc:0 "裙带关系和军政府末期的财政腐败被皮诺切特当作重点靶子，一批旧官僚和商人被送上特别法庭，量刑不轻，执行不慢。这些举止在左翼和进步派那里为他赢得了真实的好感，他在进步派眼里至少做对了一件事。反腐行动同时也清理了一批潜在的权力竞争者，旧政权的实权派在反腐败的名义下被从棋盘上逐个移除开去。"
 CHL_remember_our_failure:0 "铭记国难"
 CHL_remember_our_failure_desc:0 "南锥体战争的失败、军政府末期的混乱、经济崩溃和社会撕裂，我们经历了多少不该的苦难！这些记忆被提炼成一套我们的警示性叙事，目的是让每一个智利人都记住混乱的代价。铭记国难的教育从小学课堂延伸到新兵训练营，国民被反复提醒这个国家与民族曾经走得离深渊有多近。记住恐惧的人更倾向于接受秩序，皮诺切特对此了然于心。"
 CHL_arm_against_tryanny:0 "对抗暴君的战争"
 CHL_arm_against_tryanny_desc:0 "皮诺切特在他的军队面前把他自己和我们描述为反抗暴君者。暴君是谁？那些在国家危难时图谋私利的旧政客，想要把智利拖回街垒战和物资短缺时期的极右翼和极左翼，是一切想让智利永远陷在混乱中的人，比如该时间对应的外敌。军队动员的口号是对抗暴君，军队出征的对象是暴君的残余。修辞的政治在于谁定义了暴君这个词，皮诺切特更进一步定义了这个词的定义者，也定义了他自己不在这个词的射程之内。"
 CHL_mixed_economy:0 "混合所有制经济"
 CHL_mixed_economy_desc:0 "在国有化和私有化之间皮诺切特选择了一条中间道路。大矿业名义上收归国有，经营权部分保留在政府手中，部分授权给外国公司；基础设施由政府和私人资本合资建设分享收益；中小企业完全交给市场，大型战略性产业由国家控股。外表是实用主义的经济管理，内在是一个独裁者对任何一种绝对化的经济权力都不信任的体现。他又怕资本家坐大，也怕国有部门僵化，两端的恐惧逼他为手了一条这样的中间路线。"
 CHL_chile_miracle:0 "智利奇迹"
 CHL_chile_miracle_desc:0 "经济复苏的数据在连续增长之后被集合成了一个称为智利奇迹的叙事。通货膨胀被遏制住了，外国投资大量涌入，基础设施现代化进程加速。虽说奇迹的受益者主要是中产阶级和上层，贫民区的生活改善幅度远没有国家宣传说的那么显著。智利奇迹也并不是谎言，只是选择性呈现的事实。事实上，统计数字在正确的光照下看起来确实很漂亮。"
 CHL_poltares_nap:0 "波塔莱斯与拿破仑"
 CHL_poltares_nap_desc:0 "十九世纪智利共和国的构建者被皮诺切特政府重新抬上神坛。波塔莱斯的铁腕治国和制度设计能力被反复赞颂，拿破仑的军事天才和法理遗产同样被发掘。波塔莱斯和拿破仑在这个政权的符号体系中是斗志的源泉和军民的榜样。皮诺切特自己正在做的是拿破仑式的征服，而喜欢用波塔莱斯的克制腔调来谈论这件事，像是在谈论未来……同样的伟业。"
 CHL_our_general_pinochet:0 "我们的将军，皮诺切特"
 CHL_our_general_pinochet_desc:0 "所有的政治修辞和制度设计最终汇集到了一个人身上。奥古斯托·皮诺切特，国家元首，军队总司令，智利的拯救者！这些头衔一个接一个叠加在他的名字前面，代表着种种一部分真实的功绩和一部分被精心修饰的叙事。在圣地亚哥阅兵式的观礼台上，用帽沿的阴影遮住自己的眼睛，阳光在勋章上反射出刺眼的光芒。广场上排列着整齐的方阵，士兵们高呼他的名字，声音震天地响。他站在那呼声的中央，也就是这个政权的风口浪尖，风眼中安静到他能听见自己的呼吸。这时候是否还混杂着当年那个在军校图书馆翻阅共和国宪法的年轻军官的喃喃自语，已没有人能替他回答。他戴上眼镜在总统府的办公桌后批阅文件的时候，偶尔会停下来，看窗外安第斯山脉的雪顶在暮色中变成粉红色。雪山每年都在那里，一如他每年都在这里。\n伟大者的面具已经摘不下来了……他试过一次，那是在一个失眠的凌晨，手指碰到脸上的时候他才幡然醒悟，意识到那里其实什么都没有。\n于是智利的王得意的欢笑。虽然和所想不尽然一样，终究是我赢了。"
 CHL_mercy_of_our_caudilo:0 "考迪罗的仁慈"
 CHL_mercy_of_our_caudilo_desc:0 "人们称赞他仁慈。一个手握枪杆子的将军，在可以永远关上议会大门的时候选择了推开它，在可以终身执政的时候选择了走下观礼台——还有比这更仁慈的吗？报纸的头版标题堆满了溢美之词，街头的市民在收音机里听到恢复选举的消息时呆愣，然后有人鼓掌，掌声稀稀拉拉的，像下雨前零星的雨点……\n试问一个在社会主义共和国的余晖中读完军校的青年军官，一个在政权垮塌后的废墟里收拾过旧政权烂账的参谋本部新星，一个在柯卡特会议的僵局中发现自己已经站在权力顶端、环顾四周全是深渊的年轻将军，一个在深夜里反复翻过孟德斯鸠和波塔莱斯、翻来翻去找不到答案的失眠者，这个人会不会也会在凌晨的寂静中突然恐惧——恐惧自己在这条路上再走一步，就再也看不到安第斯山雪顶的日出？会不会也恐惧成为被自己曾经朋友同僚，与后人唾骂的独裁者？会不会也向往功成名就激流勇退，就做那个被人怀念的辛辛纳图斯？……哪怕接下来的事情未必是他想要的？\n两千年里没有人真的想当辛辛纳图斯，但很多人喜欢拿他当榜样来教育别人……终于他决定恢复民主。哪怕是经过过滤的、安全的、把危险分子排除在外的民主。他给自己留了军队总司令的位置，他给宪法加了足够多的保险丝，他确保了自己不会在走下权力巅峰之后被送上法庭。这些安排让他的民主承诺打了折扣，折扣率的数字他在心里算着，而觉得可以接受。"
 CHL_peoples_socialist_vanguard:0 "人民社会主义先锋队"
 CHL_peoples_socialist_vanguard_desc:0 "人民社会主义先锋队赢得了选举。先锋队的核心骨干来自国家社会主义运动的马雷斯派——豪尔赫·贡萨雷斯·冯·马雷斯曾是智利最著名的纳粹投机分子，现在他领导了一场对极右翼的切割手术，带着一批愿意跟随他向左转的前国家社会主义者重新定义了国家社会主义运动。他们宣布回归原本的、未被欧洲种族主义污染过的国家社会主义理论传统，这一派理论在二十世纪初的欧洲也确实曾经和社会主义左翼有过短暂而暧昧的交集。"
 CHL_we_are_leftists:0 "我们的左翼立场"
 CHL_we_are_leftists_desc:0 "先锋队公开宣称自己的左翼立场，他们在经济上支持国有化和工人参与管理，在社会议题上倾向世俗主义和进步主义，在外交上对第三国际保持务实接触。旧左翼阵营里的共产党和社会党对他们嗤之以鼻，认为不过是一群换皮的法西斯。先锋队却说：看我们的政策，别看我们的出身。这本身是一句很好的政治辩护词，好像政党的出身终究是个人的出身。"
 CHL_destroy_far_right:0 "摧毁极右翼"
 CHL_destroy_far_right_desc:0 "先锋队对极右翼的打击也不留情面。国家秩序阵线的残余组织被取缔，凯勒分子的地下网络被情报部门逐个破获，极右翼控制的产业被没收并纳入国有管理体系。摧毁极右翼同时实现了两个目标：清理了政权最危险的潜在对手，吸收了极右翼留下的资本和产业为国有经济补充血液。极右翼曾经以为马雷斯是自己人，发现他不是的时候已经来不及了，除了“叛徒”的咒骂，又能发出什么呢。"
 CHL_absorb_democrats:0 "吸纳民主派残余"
 CHL_absorb_democrats_desc:0 "温和的民主社会主义者在旧左翼崩溃后散落在各个角落，没有统一组织也没有政治话语权。先锋队把他们吸纳进来，民主的社会主义者也是社会主义者。吸纳民主派残余既是扩大执政基础的政治策略，也为先锋队的政策制定注入了一批有经验的技术官僚和基层工作者。被吸纳者在新的阵营里并非完全舒坦，不过这并不碍事。"
 CHL_volunteer_service:0 "志愿服务造福人民"
 CHL_volunteer_service_desc:0 "大规模志愿服务运动在先锋队推动下铺开。青年先锋队员被派往农村支教，退伍军人参与社区巡逻和基础设施维护，妇女联合会组织食品分发和公共卫生宣传。志愿服务的理论源头可以追溯到早期国家社会主义对公民义务的强调，在实践中它呈现出一幅相当动人的社会图景。"
 CHL_natdem_socialism:0 "民族，民主，社会主义"
 CHL_natdem_socialism_desc:0 "军队的政治教育被重新编写。旧的口号被替换为民族、民主、社会主义三位一体，军队宣誓效忠的不再是某一个人，其升级为至高的民族共同体和民主社会主义制度。主义治军的实际效果有待时间检验，至少军纪在表面上比军政府时代多了一层看似的理想主义的光泽。"
 CHL_under_red_stars_flag:0 "于红星旗下前行"
 CHL_under_red_stars_flag_desc:0 "红旗没有更换，先锋队仍然在红星旗下号召军民为国奉献。不过奉献的对象从抽象的领袖更多的变成了具体的国家和人民，旗帜的颜色绝绝没有变，只是换了更强力的旗杆来撑起它。"
 CHL_radical_agrian_falange:0 "激进农业社会主义长枪"
 CHL_radical_agrian_falange_desc:0 "激进农业社会主义长枪党赢得了恢复民主之后的第一场选举。长枪党——从西班牙内战时代就争议缠身的名号——在智利的政治土壤上长出了谁也未能预料的变种。至少它的领导层在公开场合反复强调自己不是法西斯；也不是传统左翼，它谈阶级合作多于阶级斗争，谈民族共同体多于无产阶级国际主义。它是一个挤着社会主义下的自由保守派、长枪党残余的工团主义信徒、从农业工党分裂出来的农村改良派，以及一批在达维拉时代被边缘化、如今在民主框架里找到位置的右翼温和分子的大帐篷。帐篷的支柱是皮诺切特的宪法框架，帐篷的帆布是共同反共的默契。"
 CHL_agrian_elite_in_pnl:0 "农业工党的农业精英"
 CHL_agrian_elite_in_pnl_desc:0 "农业工党在旧时代里代表大地主和富农的利益，它的精英人脉和农业管理经验在战后重建中被证明仍然有价值。激进农业社会主义长枪党追溯并吸收了这批人，把他们从保守主义的旧壳里拖出来塞进新的生产补给体系。庄园主的儿子们在农业学院里学会了现代农业技术，回到土地上用更高效的方式种出了比父辈更高的产量。农业工党的精英被改造为国家的农业技术干部，他们的祖父曾经只对自己的庄园负责，现在他们被要求对整个智利的粮食安全负责。"
 CHL_popular_stance_of_psl:0 "人民社会党的人民立场"
 CHL_popular_stance_of_psl_desc:0 "人民社会党是智利左翼阵营中最早和皮诺切特政权达成默契的派别，它的温和社会主义立场在旧左翼圈子里被骂为叛徒，在长枪党的帐篷里却被视为可靠的合作伙伴。人民社会党的立场被追溯并纳入新政权社会政策的根基：基层社区的互助网络、工人消费合作社的组织经验、农村识字运动的动员模式等等，人民社会党的干部在战后承担了大量社会福利发放和社区调解的工作，用温和派的务实作风稳住了战后社会的阵脚。"
 CHL_enlightment_of_pr:0 "激进党的启蒙精神"
 CHL_enlightment_of_pr_desc:0 "激进党在智利历史上代表着中产阶级知识分子的启蒙传统——科学、理性、教育、进步。这套精神遗产在激进农业社会主义长枪党手中被追溯并用于建设与科研工作。大学的实验室重新获得经费，科研人员被组织起来攻关矿业技术和农业改良，公共教育体系在激进党老党员的督导下恢复了战前的覆盖面。"
 CHL_democracy_of_nf:0 "长枪党的基督教民主"
 CHL_democracy_of_nf_desc:0 "长枪党的思想传统中一直有一条基督教民主的暗线：代表着劳资合作、社会公正和道德秩序。激进农业社会主义长枪党追溯并强化了这条暗线，把它用于军队的思想政治工作。随军神父被重新派入营房，使士兵在训练之余接受以基督教伦理为核心的道德教育，军队的自我定位就从民族扩张的利剑转型为国家稳定的护卫者。基督教民主的框架为军队提供了一套可以替代旧民族主义的新意识形态。"
 CHL_populism_of_ibanez:0 "伊巴涅斯的民粹主义"
 CHL_populism_of_ibanez_desc:0 "卡洛斯·伊瓦涅斯·德尔坎波留下了一笔民粹主义实践成果——强人领袖和群众之间的直接情感纽带、绕过政党直接与人民对话的动员技术。激进农业社会主义长枪党追溯并吸收了这笔遗产，用于强化军民团结。深入基层、缩短讲台和群众的距离、用朴素语言代替军事术语。军民团结的运动在各地铺开，军队帮忙修路建校，民众在军队开放日走进营区参观……民粹主义的古老配方就这样在民主的厨房里被重新加热端上了桌。"
 CHL_party_coalition_protect_democracy:0 "多党联合，保卫民主"
 CHL_party_coalition_protect_democracy_desc:0 "民主是脆弱的，战后刚刚恢复的民主尤其脆弱。激进农业社会主义长枪党推动的多党联合协议把帐篷里的所有派别从临时的选举联盟绑成了制度化的执政共同体。协议的条款详细到每一个部门的人事分配和每一类立法的表决机制，桌腿则是共同的底线：反共、拥军、服从宪法框架。保卫民主在这份协议里的实际含义是保卫这套由皮诺切特亲手设计、由各党派共同维护的有限民主不被来自左翼或极右翼的力量颠覆。"
 CHL_foch:0 "智利工人联合会"
 CHL_foch_desc:0 "智利工人联合会的胜选宣告了某种异端无政府主义在智利政治版图上的另一次短暂回归。这个组织的精神祖先同样可以追溯到巴枯宁和克鲁泡特金，它的现实根基是战后重建中顽强存活下来的地方工团网络。政府被要求在最大限度上收缩职能，工厂和土地被工人和农民直接接管。至于无政府主义者在赢得选举之后面临的无政府状态是什么……这个问题在理论上不太容易回答。"
 CHL_protect_arg_socialism:0 "庇护阿根廷社会主义者"
 CHL_protect_arg_socialism_desc:0 "国民阿根廷与其思想洪流仍然在对左翼进行周期性清洗，阿根廷的社会主义者、工团主义者和无政府主义同伴翻越安第斯山脉逃往智利寻求庇护。智利工人联合会敞开边界接收了这些流亡者，在圣地亚哥和外省城镇设立了安置点和工作分配机制。庇护阿根廷的社会主义者是一件在道义上无可指摘、在现实中为智利补充了大量熟练工人和政治干部的事情。"
 CHL_united_unions:0 "统一工会组织"
 CHL_united_unions_desc:0 "分散的地方工会被整合进统一的全国工会组织体系，无政府工团主义的去中心化传统和战后重建对统一指挥的需求在这里激烈冲突。保留了地方工会的自治权，同时建立了全国性的协调机制，协调的范围和深度只能在各派争吵中反复调整。"
 CHL_anti_reaction_terror:0 "反反动派恐怖"
 CHL_anti_reaction_terror_desc:0 "反动派的恐怖——针对工会领袖的政治暗杀、资本雇佣的打手对罢工工人的暴力袭击、极右翼地下组织对工会场所的炸弹攻击——被联合会列为头号敌人。反击的手段合法和非法的界限相当模糊，自我防卫和主动出击的区别在行动报告中也是反复出现的争议项，只能说很难认定同样的事情是否也发生在敌人的身上。"
 CHL_we_plunder:0 "我们征用"
 CHL_we_plunder_desc:0 "被企业主弃置的厂房、被地主抛荒的土地、被资本抽空之后剩下的空壳以及那过境之地的村镇所有，被工人和民兵们自行征用。征用的法律依据在现行宪法中并不存在，不过在紧急状态下，劳动与武力的需要高于狭隘的财产权。"
 CHL_we_assasinate:0 "我们暗杀"
 CHL_we_assasinate_desc:0 "敌人在阴影里行动，我们也必须学会在阴影里反击。暗杀虽说不是联合会的官方政策，在地方工会的某些分支内部，对极右翼骨干和叛徒的秘密处决被视作必要的自卫手段。暗杀这个词出现在联合会的机密文件里时也是带着一种刻意的冷酷——也就是说政治暴力在某些无政府主义传统中被接受为一种悲剧性的必须，或者说是必然而必须执行的选项。"
 CHL_we_use_blood_flourish_anarchist_utopia:0 "鲜血浇灌无政府主义乌托邦"
 CHL_we_use_blood_flourish_anarchist_utopia_desc:0 "乌托邦可不是免费的！劳动者用罢工、占领、斗争和牺牲一寸一寸地争夺过来的自由空间，每一寸都浇灌着热腾腾的鲜血。无政府主义乌托邦在智利的安第斯山脚下血流成河，土地都变得异常肥沃，在这疯狂的土地上种下去的每一种理想都在疯狂生长。或许，或许乌托邦不会在联合会的手中最终建成，它永远在下一个地平线上若隐若现，让追赶它的人血水流干，死而不悔。"
 CHL_socrep_lives_on:0 "社会主义共和国仍存于世"
 CHL_socrep_lives_on_desc:0 "社会主义共和国没有死！皮诺切特与他的继业者们用双手从碎渣里捧起来，小心翼翼地拼回一个和原来不太一样的形状。工团主义的互助网络被保留，农村合作社的架构被延续，基础教育扩张的步伐没有停，矿区工人的医疗站在军政府的预算里被列入重点保障科目。左翼从来没有承认过的人也不需要他们的承认。那人做这些事情的动机连他自己也未必能完全讲清楚——也许是一个年轻军官当年在共和国的宣传画前驻足时留下的印记，也许是一个阅读过马克思和索雷尔的读者对旧时代残余的审美式眷恋，也许只是实用主义告诉他这些东西确实运转得不错。"
 CHL_rise_of_first_nation:0 "原住民的崛起"
 CHL_rise_of_first_nation_desc:0 "选票统计结果……马普切协会？那个被各大政党拉来凑数的原住民小党，那个在选前民调里被排在垫底位置的边缘角色赢了。自由派措手不及，长枪党目瞪口呆，另类左翼右们反复查看统计结果是否有错误……然而这是无用的。据说退居幕后的皮诺切特大帅在得知结果后长时沉默，后对身边的副官说道：这样也好，可以让那些骂我们操纵选举的人闭嘴。于是原住民社群在智利政治中第一次走到了最前排，马普切人、艾马拉人、拉帕努伊人，这些在这片土地上生活了上千年却从来没有真正决定过自己命运的族群此刻坐在了总统府的办公桌后。"
 CHL_birth_of_araucania_federation:0 "阿劳卡尼亚联邦之诞"
 CHL_birth_of_araucania_federation_desc:0 "阿劳卡尼亚地区在原住民掌权之后成为了一个政治上的偏难怪题目，马普切左翼社群在这里建立了一套半自治的联邦式架构，既不彻底脱离智利中央政府，也不完全服从圣地亚哥的垂直管辖。联邦的内部组织大量借鉴了马普切传统的部落协商制度，公社代表在集体会议上用母语马普切语和西班牙语交替发言，决策过程漫长以至于使来自城市的行政官员几近崩溃。左翼社群在阿劳卡尼亚的实验被外界称为联邦之谜，这个谜面是原住民如何在现代国家的框架内保持自治而不走向分裂，谜底则至今没有人完全解开。"
 CHL_indigenous_tradition:0 "维护土著传统"
 CHL_indigenous_tradition_desc:0 "传统应当是活在日常里的秩序和智慧。马普切人的传统草药知识被纳入公共卫生体系的基层培训，安第斯山区的传统农耕技术被农业部门整理推广，原住民社区的纠纷由长老会议依据习惯法调解……政府承认传统和现代法律之间的连结，并在这种特异张力中寻找一条可行的共存路径。其代价是部分现代主义者指责这是在拖慢国家的现代化进程，不过就像老谚语里所说那样：急着赶路的人会忘了自己从哪里来。"
 CHL_socialist_support:0 "社会主义诗人的支持"
 CHL_socialist_support_desc:0 "极左翼诗人和工团主义者在原住民政权中找到了意想不到的盟友。诗人们从马普切的口头文学传统中看到了未被资本主义污染的语言矿脉，工团主义者从原住民公社的集体劳动模式中辨认出了前现代版本的劳动联合自治。诗人和工团主义者进入政府联盟的同时也接受了原住民对他们的改造——诗被要求写得更能让不识字的农民听懂，工会被要求把组织工作延伸到偏远的原住民山区。"
 CHL_mapuchea_culture_revitalization:0 "马普切文化复兴"
 CHL_mapuchea_culture_revitalization_desc:0 "马普切语被列为和西班牙语并列的官方语言，马普切历史被纳入国民教育必修课程，传统织造工艺和银饰制作获得了国家专项资助。文化复兴的速度超出了所有人的预期，被压抑了几个世纪的语言和文化符号一旦获得政治权力的浇灌就开始疯长。年轻一代的马普切人用本族语言创作流行歌曲和电影剧本，他们的祖父母在收音机里听到马普切语新闻时仍然会忍不住流泪。"
 CHL_a_equal_state:0 "平等的国家"
 CHL_a_equal_state_desc:0 "原住民政权对平等的理解比左翼的传统定义更加彻底。平等并不是各阶级在同一个法律框架内的形式平等，而应该使不同民族、不同文化、不同生活方式在国家政治中享有同等的发言权和自治权。法律承认马普切社区对传统领地的集体所有权，承认艾马拉人的水资源管理惯例……平等的国家在智利实践中是一套极度复杂的分权体系，旧体制的官僚们每天都在发出抱怨，争吵也为此日日出现，但这其中的精神真切影响深远。"
 CHL_between_christian_primal_belief:0 "原始信仰与基督教之间"
 CHL_between_christian_primal_belief_desc:0 "原住民的原始信仰和天主教在智利共存了几百年，共存的方式时而暴力压制，时而屈辱妥协，时而是深层次的融合。原住民政权在这两种信仰之间努力寻找一种平衡：不强迫任何人放弃祖灵崇拜转向十字架，也不强迫任何人必然放弃十字架回到祖灵崇拜。在阿劳卡尼亚的一些村庄里，天主教弥撒和马普切祭祀仪式被安排在同一天的清晨和傍晚，同一个广场上晨飘熏香，暮灼药草。"
 CHL_reverse_occupation:0 "扭转占领时期"
 CHL_reverse_occupation_desc:0 "十九世纪智利军队对阿劳卡尼亚的征服被原住民政权正式定义为非法占领，占领时期殖民者及其后代持有的土地产权被全面审查，部分产权被没收并归还给原住民社区。这项政策的冲击波在智利社会引发了剧烈的反弹，中南部省份的土地所有者组织起来抵制土地归还程序，但最终被镇压。扭转占领的进程是一场漫长而痛苦的产权战争，战争的双方都说自己在为正义而战，在两个方向上都迷糊的涂着历史的旧账。"
 CHL_intergrate_indigenous_groups:0 "整合原住民组织"
 CHL_intergrate_indigenous_groups_desc:0 "散落在全国各地的原住民组织被整合进一个统一的全国性协调机制，从此不再各自为战。整合过程充满了内部矛盾，毕竟客观来讲不同原住民族群之间的历史恩怨和现实利益冲突不会因为共同掌权就自动消失。整合之后的原住民组织体系更像是一个松散的邦联，邦联的黏合剂是共同被压迫的历史记忆和对未来平等地位的共同期待。"
 CHL_indigenous_federation:0 "土著国度"
 CHL_indigenous_federation_desc:0 "是否有一天，担忧和自卑会从这片土地上彻底消失？殖民者用枪炮和病毒带来的末日恐惧困扰了原住民几百年，殖民者的末日正在到来——另一场种族灭绝？我们并不是屠夫。要以殖民者后裔和被殖民者后裔在同一个国家里重新谈判彼此位置的方式。安第斯雄鹰苍天盘旋千年之久，鹰看到过马普切勇士抵抗西班牙骑兵，看到过智利军队推进到比奥比奥河以南，看到过共和国的旗帜在圣地亚哥升起，看到过社会主义的红旗和军政府的白旗。鹰现在看到的是一个让所有人都感到有点陌生、有点不安、又有点期待的老朋友，这土著国度正在山脚下艰难地长出第一层嫩芽，自由的族群不死不灭。"
 CHL_recrownation_of_araucanian_king:0 "阿劳卡尼亚国王再加冕"
 CHL_recrownation_of_araucanian_king_desc:0 "奥雷利耶-安托万一世的后裔在法国流亡多年之后被请回了智利。阿劳卡尼亚王国在历史上是一桩离奇的十九世纪冒险——一个法国律师跑到南美洲宣布自己当上了马普切人的国王，后来被智利军队抓住驱逐出境，故事到这里本该在嘲弄中结束。可是马普切人在一百多年后重新把这个头衔从历史的尘埃里请了回来，似乎他们真的需要一位君主。加冕礼在阿劳卡尼亚的旷野里举行，媒体镜头和原住民长老围簇成两个不太相交的圆圈。国王的王冠是马普切银匠用手工打制的，法国的各类君主主义者在信里激动地写道这是君主制在全球复兴的又一明证……\n这时，马普切的长老们在私下里交换了一下眼神，其实国王在他们手里只是一个用来凝聚认同的政治工具。"
 CHL_emperor_of_france_and_americas:0 "法兰西与美洲的皇帝"
 CHL_emperor_of_france_and_americas_desc:0 "安托万三世旅居法国多年，在君主主义圈子里接受了系统的政治训练。他带回智利一套不那么纯粹的欧洲君主制方案，是将法国正统派的社会王国理念和马普切传统混合之后发酵出来的奇怪产物。法兰西与美洲的皇帝这个头衔本身就是一个混杂的符号，如法国君主主义者在他身上看到了王朝在海外的延续，美洲原住民也在他身上看到了一个可以被操控着去反制殖民叙事的象征。"
 CHL_rise_of_msm:0 "君主社会主义运动的崛起"
 CHL_rise_of_msm_desc:0 "君主社会主义运动走上了执政前台，这个党团的名字本身十足政治悖论。君主制和社会主义在十九世纪的欧洲是死敌，在二十世纪中期的智利阿劳卡尼亚却被人硬生生地塞进了同一个政治纲领。君主社会主义的理论家们将君主定义为超越阶级利益的最高仲裁者，社会主义的平等分配被放在君主制的框架内进行，国王在理论上站在所有阶级之上确保没有人因为出身而受穷。这套理论在正统马克思主义者眼里不过是可笑的封建余孽，在正统保皇党眼里是又对君主制的亵渎，在安第斯山脚下的社群实践中则是一种灵活的政治黏合剂。"
 CHL_naf_again:0 "新法兰西行动新装登台"
 CHL_naf_again_desc:0 "新法兰西行动——这个名字从法共和国创立的极右翼运动中借来——它在智利换上了一身完全不同的衣装。社会整合主义替代了原来的极端保皇主义，原住民的民族解放替代了法兰西的民族复仇，行会工团主义替代了传统的社会等级制。新法兰西行动新装在阿劳卡尼亚的国王宫廷里找到了政治归宿，它的骨干们穿着马普切银饰和法式军装的混搭制服出现在政府大楼的走廊里，视觉上的怪异混乱恰好是这个政权理论杂糅程度的真实写照。"
 CHL_localist_principle:0 "分权主义原则"
 CHL_localist_principle_desc:0 "生产决策被下放到基层公社和行会，国家的角色从计划的制定者转变为资源分配的协调者和最低标准的保障者。将经济权力打散之后重新组合，公社和行会在地方层面掌握了大量的自主决策空间。君主在国家层面提供统一的道德象征和政治仲裁，这种垂直分权在智利的原住民君主实践中被证明至少能够勉强运转。"
 CHL_equality:0 "人人平等"
 CHL_equality_desc:0 "君主制下的平等——国王在上，万民在下，万民之间没有高低贵贱。人人平等在君主社会主义的理论中却是通过将君主设定为唯一的等级顶端、其余所有人全部平等地臣服于君主来实现的。生产的提升被寄希望于平等带来的社会团结，劳资矛盾在君主的仲裁下被转化为资源分配的技术性问题。"
 CHL_people_state:0 "人民国度"
 CHL_people_state_desc:0 "君主社会主义的群众基础来自原住民公社和城市贫民，国王通过定期巡视和公开接见与最底层的臣民保持直接联系，绕过官僚和贵族。人民国度的国王同时是君主和民粹领袖，在接见厅里听臣民投诉，在巡视途中接受农民的请愿书，在公开演讲中把君主制和人民主权这两个理论上水火不容的概念强行交合。"
 CHL_liberate_commuards:0 "整合公社革命者"
 CHL_liberate_commuards_desc:0 "法兰西的君主主义和美洲公社的革命传统在阿劳卡尼亚国王的宫廷里被强行缝合在一起，宫廷的文件同时引用法国国王的敕令和公社宣言。这些奇怪的逻辑相当激进：公社是基层的君主，君主是公社的最高统一者，因此公社必须归于君主。这套话术在政治哲学上漏洞百出，在实践中居然拉拢到了一批理想主义者和机会主义者，当然最后还是为癫狂的战略背书而已。"
 CHL_intergrate_royalists:0 "整合保皇党残部"
 CHL_intergrate_royalists_desc:0 "法国保皇党在共和制的法兰西早已边缘化，他们在智利的马普切君主政权中找到了意外的后援。保皇党的遗老们被邀请到阿劳卡尼亚担任礼仪顾问和历史档案整理员，一些前贵族后裔在智利南部的庄园里重新过上了拥有宫廷礼仪的生活。整合保皇党残部在法国的共和派眼中是一出滑稽戏，在阿劳卡尼亚政权自己看来则是获取欧洲外交资源和历史合法性的实用手段。"
 CHL_legacy_proundon_circle:0 "蒲鲁东圈的遗产"
 CHL_legacy_proundon_circle_desc:0 "就如瓦卢瓦等人研究的类似，蒲鲁东对私有财产和国家的双重批判被军国主义的君主派挪用为灌输军民的教材，互助主义原则被用来论证行会工团主义的正当性，联邦主义的政治构想被用来支持原住民公社的自治权利。在巴黎建立的所谓工人互助组织的遗产在南美被一群穿着军装的君主主义者捧在手里……蒲鲁东本人如果活到这一天，啊……可能都会陷入沉默吧。"
 CHL_guild_syndicalism:0 "行会工团主义"
 CHL_guild_syndicalism_desc:0 "各行各业按垂直方向组建行会，行会掌握生产和分配的决策权，君主在行会之间担任协调者。将工团自治和君主仲裁合并成一个完整的体系，罢工被废除，劳资矛盾在行会内部通过协商解决，行会之间的利益冲突提交国王裁决。君主政权的工团主义将工人从阶级战士重新定义为行业共同体的成员，行业共同体只在银色王冠的庇护下运转。"
 CHL_national_revolution:0 "民族革命"
 CHL_national_revolution_desc:0 "原住民君主民族革命军被组建，革命的对象是如殖民主义残余、自由民主的议会政治和跨国资本。民族革命将原住民解放和君主制复辟合并为同一个政治议程，在马普切传统旗帜和王冠的号召下向前推进。民族革命的战场横跨安第斯山脉两侧，从阿劳卡尼亚的丘陵一直延伸到拉普拉塔河流域，革命军里的口号竟能同时出现马普切语的祖灵呼唤和法语的长枪冲刺口令。"
 CHL_social_kingdom:0 "社会王国"
 CHL_social_kingdom_desc:0 "法兰西-美洲原住民联盟的最终理想被命名为社会王国。这个王国的理论基础混合了法国正统派的社会天主教主义、马普切传统公社制度和南美洲本土的工团主义实验。国王是社会的统一象征，社会由自治的公社和行会组成，国家在经济领域承担协调和仲裁的职能。社会王国在安第斯山脚下运转的时间还不够长，足以被当作一套成熟的政体来研究，在它仍然摇摇晃晃的时刻就已经吸引了全球君主主义者和原住民运动的目光。"
 CHL_visitor_from_other_side:0 "地球另一端的来客"
 CHL_visitor_from_other_side_desc:0 "没人预料到事情会变成这样！当政府还在忙自己的事情的时候，那些从硝石矿场、铁路工地和港口码头涌出来的华工已经控制了圣地亚哥的关键位置。他们的领袖金廷·德拉金塔纳登高总统府天台，宣布了旧秩序的终结。外界瞠目结舌，报纸标题写得像是天方夜谭——来自地球另一端、被当作牛马使唤了几十年的苦力，此刻正在签署命令、接管部委、改写法律……智利的老牌政治家族们还没反应过来发生了什么，一场革命就这样完成了。"
 CHL_liberate_our_comrades:0 "解放同胞"
 CHL_liberate_our_comrades_desc:0 "新政权的第一道命令传遍了所有的那些苦难的华工聚集地：从塔拉帕卡的硝石矿到麦哲伦港的冷库，从北方铁路的筑路营地到南部伐木场，所有被契约束缚的华工全部恢复自由身。临时军警和自发武装组织接到命令，使任何试图阻拦或藏匿华工的原雇主都将以贩卖人口罪论处。消息传到矿区时都有许多老工人跪在地上哭得说不出话，有人把自己那张早已发黄的契约书从工头的档案柜里翻出来焚烧，喜悦和解放四处翻涌。"
 CHL_legacy_of_brigade_volcano:0 "火神营的遗产"
 CHL_legacy_of_brigade_volcano_desc:0 "历史上曾有一支由华工组成的后勤志愿部队编号火神营。他们在上一次太平洋战争期间负责灭火、抢修铁路和搬运弹药，其英勇表现屡获军方嘉奖，也受当地士兵传颂。新政权追溯这段历史，将火神营正式确认为智利华人群体的军事传统源头，并为当年的老兵补发勋章。火神营的事迹被编入军队教材，其营旗被请进军事博物馆，与智利独立战争时期的战旗并列陈列。一代代华工在异乡顶着歧视和压榨活了下来，那火神营的旗帜就是他们在绝境中不曾失去了血性的证明。"
 CHL_restore_relation_with_china:0 "恢复与本土的联系"
 CHL_restore_relation_with_china_desc:0 "智利华工政权派出特使，远渡重洋前往中国沿海的各通商口岸和使馆城市，与当地华人社团、商会和军阀代表建立联系。这时中国的海外华人网络自有其跨越战火的生命力，南洋侨商、旧金山会馆和上海买办很快都知道了安第斯山脚下发生的事情——有一群华工，在南美洲的西海岸建立了一个政权？……我们为什么不把这视作一个机会呢？双方都如是想到。"
 CHL_minority_rights:0 "少数族裔权利"
 CHL_minority_rights_desc:0 "新政权以华工解放为起点，迅速同时扩展为对所有少数族裔的全面保障。新的法律规定任何在智利境内的族裔群体，无论其肤色、语言和出生地，均享有完全平等的公民权、土地权和受教育权。作为整个拉丁美洲有史以来最彻底的反歧视立法之一，其涵盖范围连那些世代居住在南方的马普切社群都要感到惊讶。我们受够了被人当作另一种人类，所以我们绝不会把别的族群也当成另一种人类。"
 CHL_remember_our_warring_legacy:0 "铭记我们的好战传统"
 CHL_remember_our_warring_legacy_desc:0 "华工们从来不是温顺的羔羊！从十九世纪中叶第一批契约劳工抵达秘鲁和智利开始，逃亡、暴动和武装反抗就从未停止过，只是这些故事从来不会被写进冠冕堂皇的历史。新政府于是组织历史学者系统搜集和整理华工反抗的档案——从硝石矿区的秘密结社到铁路营地的集体逃亡，从港口苦力的械斗到对虐待成性的工头的清算……这些被尘封的记忆被印刷成册，在各学校和军营中分发。老兵们在集会上向年轻人讲述当年拿着铁锹和镐头对抗骑警的经历，语气愤怒亦骄傲：我们从来都在战斗，从来——只是现在才有人承认罢了……"
 CHL_denounce_imperialism:0 "谴责帝国主义"
 CHL_denounce_imperialism_desc:0 "新政权发布了一份措辞毫不客气的宣言，历数帝国主义列强在拉丁美洲和亚洲犯下的罪行。从英国在硝石贸易中的巧取豪夺，到美国联合果品公司在中美洲的圈地，再到法国资本对智利铁路的控制，是所有殖民时代的旧账。政府宣布要废除一切不平等经济协定，收回被外国公司占有的矿山和土地。"
 CHL_remember_hongs_legacy:0 "铭记天王遗训"
 CHL_remember_hongs_legacy_desc:0 "在政权内部的文化宣传中，洪秀全和太平天国被推到了一个近乎神圣的位置。政府将天王遗留下来的文书、诏令和诗歌编成小册子广泛印发。我们就理解着，回忆着：天王身死道消怎是因为他的道理错了，而是因为清妖和洋妖合起伙来将他谋害！今天在异乡之下，南美洲的安第斯山脚下，一群远离故乡的华人决定再次追随天王，在地上建成他当年未能建成的国。"
 CHL_honor_cristianism:0 "尊奉基督教"
 CHL_honor_cristianism_desc:0 "太平天国的拜上帝教传统在新政权中得到了一种颇为独奇的延续。基督教是为一种带有鲜明华人色彩的社会福音，强调其中关于平等、公义和穷人得解放的内容，同时淡化或者无视了其神学教条的排他性。这一套论述在实践中与欧洲的基督教社会主义和拉美的解放神学等流派产生了意外的共鸣。"
 CHL_our_land_reform:0 "天朝田亩制度指导土改"
 CHL_our_land_reform_desc:0 "新政权在脚下广大的农村推行了全面土地改革，其指导性文件赫然是太平天国当年颁布的《天朝田亩制度》。所依者唯“有田同耕，有饭同食”大则，将大庄园主的土地分给无地农民，不分族裔不问出身。农村基层按照一套结合了太平天国乡官制度和智利本地合作社传统的模式重新组织了起来。在中央平原的一些村庄里，农民们第一次在自家地头竖起木牌，上面写着地界和主人姓名，旁边还贴着一张从宣传册上撕下来的天王画像。"
 CHL_our_industrialize:0 "实施资政新篇"
 CHL_our_industrialize_desc:0 "在完成土地改革后，新政权将目光转向了现代化工业体系建设，其政策框架直接取法于洪仁玕当年为太平天国撰写的《资政新篇》。修筑铁路，开办银行，推广机器制造，发展海外贸易，鼓励技术创新——一百多年前在南京城里写成却未曾真正施行的蓝图，此刻在安第斯山脉的另一侧晚诞。"
 CHL_anti_consessionism_anti_manchu:0 "同心放胆同杀妖"
 CHL_anti_consessionism_anti_manchu_desc:0 "我们的军队以华工为骨干，吸收各族贫苦青年，作战信条简洁近乎粗粝。这支军队在军事纪律上效法现代标准，在精神动员上却毫不掩饰其朴素的善恶二元论：天下一家受苦人，不问南北或西东，压迫者魑魅魍魉，四海五湖同杀妖。如果此时遥远的中国还有什么清政府或其残余势力统治着，这份渴望战斗的意志必将更加猛火难熄——故乡帝王尚未倒，何年何月抚故土，同上紫禁舞刀枪？！"
 CHL_revive_heavenly_kingdom:0 "太平天国重生"
 CHL_revive_heavenly_kingdom_desc:0 "在经过成功的内部整合和军事准备之后，这个另类的政权做出了震惊世界与必将到来的决定：要全面反攻本土，去回到我们魂牵梦绕的地方，为做自己的主人，为有自己的城国——哪怕要跨“太平”洋，自家水塘何足慌？尽使四面有豺狼，战过我军溃逃忙！直到南京作天京，城头变换天王旗！直使天兄游境土，妖魔杀尽天国临！天父主张兄担当，在地荣耀类天疆……\n齐声翻滚的口令声音大到连海鸥都被惊飞了。船队驶出瓦尔帕莱索港的早晨，太平的洋上波光潋滟，一望无际的蔚蓝海面一直铺展到看不见的亚细亚海岸。天国的旗帜船头飘扬，草民的呼号也空中飘荡。"
 CHL_chile_foreign_policy:0 "世界舞台上的智利"
 CHL_chile_foreign_policy_desc:0 "南锥体战争结束了，无论结果如何，智利已经进入了一个摇晃的新的战略稳定期，政府开始将注意力从安第斯山脉前线转向更广阔的世界。战争期间凝聚起来的民众热情和国家机器也需要一个新的未来方向。政府内部各派对大战略的设想从来不一致：有人只着眼于南锥体，有人望向整个拉丁美洲，还有人已经在研究世界地图……接下来的一系列决策将决定智利在未来几十年里扮演什么样的角色。"
 CHL_ally_fop:0 "与社会主义阿根廷联合"
 CHL_ally_fop_desc:0 "南锥体战争的胜利扫除了两国合并的最大障碍。巴塔哥尼亚的同志们和我们曾在同一条战壕里战斗，现在双方政府开始认真讨论建立统一国家的可能性。布宜诺斯艾利斯的革命政府对此持开放态度，不过阿根廷各省的政治传统和地方利益使得谈判相当复杂。"
 CHL_attack_arg:0 "向卡莱斯政权复仇"
 CHL_attack_arg_desc:0 "南锥体战争以阿根廷国民军的胜利告终，巴塔哥尼亚红色政权覆灭，而国民阿根廷完成了统一。智利军队撤回安第斯山脉以西，边境线恢复了原状，但战争留下的仇恨并未消失。卡莱斯政权在胜利后清洗了南方省份的社会主义支持者，大量难民涌入智利境内。新一届智利政府将复仇列为国策核心：重建军队，储备物资，等待时机。与其到时候等他打过来，不如我们先打回去。"
 CHL_attack_peru:0 "第二次太平洋战争"
 CHL_attack_peru_desc:0 "秘鲁与智利的领土争议可以追溯到六十年前的一场太平洋战争，塔克纳和阿里卡的归属问题在条约上解决了，在民族情绪里却是一桩无头悬案。智利政府认为当前是解决这一历史遗留问题的最佳时机，秘鲁的军备建设相对滞后，其外交孤立状态也限制了它获取外部援助的能力。总参谋部制定的作战计划以海陆协同为核心，海军将封锁秘鲁主要港口，陆军则沿太平洋海岸向北推进。政府对外宣称军事目标围绕着宣称领土的调整，内部的战略评估则涉及秘鲁南部的矿产资源和渔业水域。"
 CHL_attack_bolivia:0 "攻击玻利维亚"
 CHL_attack_bolivia_desc:0 "玻利维亚自太平洋战争失去海岸线之后一直对智利抱有怨恨，两国外交关系长期冷淡。智利军方内部有一派观点认为，玻利维亚的军事力量在南锥体诸国中最弱，其东部低地省份与中央政府关系疏远，战争很可能快速结束。政府对玻利维亚的战争目标包括夺取其富含天然气的东部地区和矿产带的控制，同时彻底消除来自北方内陆的潜在威胁。外交部在开战前会发布一份白皮书来详细陈述玻利维亚历年来在边境问题上的敌对行为。"
 CHL_attack_paraguy:0 "平定巴拉圭"
 CHL_attack_paraguy_desc:0 "智利与巴拉圭在对抗阿根廷时曾是某种盟友，但这种关系随着阿根廷局势的稳定而失去了共同基础。智利政府判断巴拉圭的军事潜力有限，其陆军虽然在查科战争中积累了一定经验，但装备老化严重，空军几乎可以忽略不计。总参谋部将这场战争定性为短周期作战，其目标是控制巴拉圭河航道，取得对巴拉圭全境的政治主导权。"
 CHL_attack_uraguy:0 "跨过乌拉圭河"
 CHL_attack_uraguy_desc:0 "乌拉圭在南锥体长期保持相对中立，其经济以畜牧业和农业出口为主，军队规模在南美各国中几乎是最小。智利政府策划对乌拉圭的军事行动主要是看中了蒙得维的亚作为大西洋港口的战略价值以及乌拉圭作为通往巴西缓冲区的地位。作战方案被建议以两栖登陆和沿乌拉圭河快速穿插为主。"
 CHL_unify_la_plata:0 "统一南锥体"
 CHL_unify_la_plata_desc:0 "巴拉圭、乌拉圭和阿根廷的领土在战争结束后将陆续纳入智利主导的政治框架，而一个规模空前的南锥体联合政权开始成形。圣地亚哥发布的官方地图上，国界线已经从太平洋延伸到南大西洋，向南覆盖火地岛，向东囊括了整个潘帕斯草原。政府随后还发表了一项关于马尔维纳斯群岛的声明，措辞尖锐而毫不含糊：群岛及南大西洋其他争议岛屿是本政权不可分割的领土组成部分。声明援引了大量历史档案和法律文件，论证西班牙殖民时期岛屿属于拉普拉塔总督辖区，因此理应继承给南锥体现政权等等。整个南锥体在经历多年战乱后终于统一在一个政权之下，从安第斯山脉的雪顶到拉普拉塔河的入海口，我们的所辖多么广袤，我们的人民多么众多……"
 CHL_attack_brazil:0 "摧毁巴西"
 CHL_attack_brazil_desc:0 "巴西是南美洲最大的国家，其人口、资源和工业规模远超智利，任何针对巴西的军事行动都需要极其慎重的准备。军方预计战争将分为三个阶段：首先摧毁巴西海军主力以夺取大西洋制海权，然后在南部边境发动大规模地面攻势牵制其陆军主力，最终通过政治手段促成巴西内部的分裂或混乱，使智利在南美洲不再有旗鼓相当的对手。"
 CHL_unite_latin_america:0 "统一拉丁美洲"
 CHL_unite_latin_america_desc:0 "我们将战略视野从南锥体扩展到整个拉丁美洲。外交部、情报机构和军事参谋部共同制定了一份庞大的整合计划，涵盖从墨西哥到阿根廷的所有拉丁语系国家，包含了经济合作、文化渗透、政治联盟和必要时武装干预的综合战略。政府发布的外交文件创新性的使用了“拉丁美洲命运共同体”这一概念，声称拉丁美洲人民拥有共同的殖民历史、相似的语言文化以及一致的反帝目标，因此应当在智利的领导下实现最终的政治团结。相关的决议机制随之启动，政府各部委将获得专项经费和授权，在外交、军事和经济三个方向上同时推进这一宏大的构想。"
 CHL_unite_south_america:0 "解放南美洲"
 CHL_unite_south_america_desc:0 "我们将南美洲作为当前战略的核心区域，目标是建立一个以智利为中心、排除外部列强影响的南美洲新秩序。这一战略聚焦于南美众国，强调地缘政治上的可行性和紧迫性。外交部牵头制定了一系列双边和多边协议草案，军事参谋部则为每一个可能的对手准备了作战预案。政府向民众阐述这一战略时强调的是南美洲在经历了欧洲列强数百年的掠夺和干涉后应当由南美人自己来决定自己的命运，而智利已经证明了自己有能力去领导这场伟大的解放事业。"
 CHL_unite_spanish_america:0 "继承西班牙的遗产"
 CHL_unite_spanish_america_desc:0 "在智利某些政治派别的观念里，西班牙帝国的瓦解并不意味着其文化纽带的断绝。相反，从加利福尼亚到火地岛，所有使用西班牙语的国家和地区现在就在共享着一种可以追溯到伊比利亚半岛的文明传统。政府宣布将继承并整合这份遗产，对外政策的重心转向所有西语国家。这意味着智利不仅要介入南美洲事务，还将把目光投向中美洲、加勒比海甚至欧洲的菲律宾的远洋。相应的对外决议随即被筹划，政府设立专门的西语国家事务办公室，负责协调与拉拢全球西语圈的关系，也同时在文化宣传中反复强调“西语世界共同体”的历史叙事。"
 CHL_attack_centroamerica:0 "解放中美洲"
 CHL_attack_centroamerica_desc:0 "中美洲诸国长期处于政治动荡和经济依附状态，我们将这一地区视为战略上可以争取的薄弱环节。军事介入的方案比南美洲的同类计划更为大胆，因为中美洲各国的军队规模和装备水平普遍较低，抵抗能力有限。政府为这场战争准备的公开理由是对抗外部势力在中美洲的持续干预，文件也清楚地写着控制巴拿马运河的战略价值和对北美势力范围的压缩。"
 CHL_attack_america:0 "粉碎美国霸权"
 CHL_attack_america_desc:0 "美国无论当前处于何种政治状态——联合、分裂、内战或军政府统治——其历史上一贯的门罗主义和对拉丁美洲事务的干涉都被智利定性为必须终结的霸权体系，也就是我们所要解决的帝国主义敌人。美国在十九世纪和二十世纪前半期通过军事干预、经济控制和外交施压在拉丁美洲建立的不平等秩序现在将由智利来打破！政府向国内民众发表的动员讲话中反复提及美国过去在智利策动政变、扶植独裁政权的历史旧账，这场即将到来的对抗被描述为我们对帝国主义治下百年囿苦的总复仇。"
 CHL_attack_carribean:0 "控制加勒比海"
 CHL_attack_carribean_desc:0 "加勒比海是连接南北美洲的枢纽，其岛屿链在历史上是欧洲殖民者进入新大陆的第一站。智利政府认为控制加勒比海对于巩固整个拉丁美洲战略具有关键意义。海军需要扩建远洋舰队，陆战队将接受热带作战训练，情报部门开始搜集各岛屿的政治动向和防御情报……政府对加勒比海的兴趣不止于军事控制，还涉及该地区丰富的热带作物资源和农业经济潜力等。"
 CHL_attack_guiana:0 "夺取圭亚那"
 CHL_attack_guiana_desc:0 "圭亚那地区至今仍处于英法荷三国的殖民统治或势力影响之下，这在智利政府看来是殖民主义在南美洲尚未被清算的残余。智利启动了一项专门针对圭亚那的外交与军事行动，包括向相关殖民国家发出最后通牒、支持当地独立运动以及准备武装登陆等。夺取圭亚那的战略意义在于获得南美洲东北海岸的深水港口和丰富的矿产资源，同时也向全世界宣告智利有能力终结欧洲列强在新大陆残留的殖民体系。"
 CHL_attack_filipino:0 "远渡菲律宾"
 CHL_attack_filipino_desc:0 "菲律宾在许多智利战略理论家的著作中被视为“拉丁亚洲”的组成部分，西班牙长达三个多世纪的殖民统治在菲律宾留下了深刻的文化印记——比如天主教信仰、西班牙语借词、与拉丁美洲相似的社会结构。据此我们提出大胆的构想：其实菲律宾应当重新纳入拉丁文化圈的影响范围，而智利作为拉丁美洲新的领导者有责任远渡重洋去实现这一使命——穿越风浪与岛礁，直达汪洋的彼方。"
 CHL_master_of_new_world:0 "新大陆霸主"
 CHL_master_of_new_world_desc:0 "智利经过多年征战和外交经营，已经将整个美洲大陆的大部分地区纳入自己的势力范围。政府宣布智利不再是安第斯山脉脚下的某一个无名狭长国家，而是新大陆真正的霸权。这一地位的确认意味着智利将承担起维护美洲秩序的责任，同时也享有划定势力范围的权利。从解放者奥希金斯到今天的远征军士兵，终于智利人用了四代人的时间走完了从殖民地到霸权的道路。"
 CHL_bigger_ambitions:0 "更大的野心"
 CHL_bigger_ambitions_desc:0 "智利国内存在某些规模不大但影响力颇强的政治派别并不满足于新大陆霸权，主张我们应当将目光投向欧洲、非洲和亚洲。这一派的理论基础也建立在对全球格局的长期判断上：第三国际的欧洲革命政权迟早要与旧大陆的保守帝国爆发新的世界大战，智利应当在那一天到来之前就提早做好介入的准备。"
 CHL_rise_partido_nacional:0 "国家党崛起"
 CHL_rise_partido_nacional_desc:0 "国家党在保守党分裂后吸纳了其中主张强硬民族主义和传统价值观的一翼，迅速发展为智利右翼阵营的重要力量。该党的群众基础主要集中在农村地区和小城镇，其领导层多次在公开场合强调国家利益高于阶级和党派，呼吁建立强有力的中央政府。选举结果揭晓之夜，国家党支持者在各地党部升起了党旗，唱响起当年民族主义运动流传下来的老歌。这个从保守党废墟中走出来的新政党正在迅速改变智利右翼的政治结构。"
 CHL_conservative_second:0 "保守党第二任期"
 CHL_conservative_second_desc:0 "保守党在第二次大选中再次获胜，这意味着选民对过去几年执政路线的认可。该党承诺继续推行稳健的财政政策，维护传统社会结构，同时在对外关系上保持审慎。保守党领导层将这次连任解读为民众对激进变革的拒绝，党内主流派主张在已有成绩基础上稳步推进，避免任何可能引发社会动荡的政策冒险。"
 CHL_continue_oppress_socialism:0 "继续镇压社会主义"
 CHL_continue_oppress_socialism_desc:0 "国家党执政后延续了对社会主义组织的压制政策，其声称的理由是南锥体战争失败后阿根廷政权等外部威胁仍然存在，任何国内的激进左翼活动都可能成为外部敌人渗透的通道。内政部扩大了政治监控的范围，警察被赋予在紧急状态下不经正式逮捕令即可搜查的权力。政策在国内遭到人权组织和左翼政党的强烈抗议，但国家党在国会依旧拥有足够席位来支撑其强硬路线。"
 CHL_ally_nationalists:0 "与民族主义者结盟"
 CHL_ally_nationalists_desc:0 "第二次大选前面临选票分流的压力，党内战略家决定与民族主义团体建立正式选举联盟。这些团体在对外政策上持强硬立场，在文化议题上强调智利民族认同，其基层支持者主要来自中下层城市居民和部分退役军人。结盟协议经过双方代表数轮谈判达成，我们在文化议题上做出让步以换取民族主义者在经济政策上接受我们的方案。"
 CHL_enemy_to_friends:0 "化敌为友"
 CHL_enemy_to_friends_desc:0 "国家党与保守党之间历史上并非没有过节，双方在三十年代初期的某些选举中对彼此的攻击激烈程度不亚于对左翼的火力。然而政治格局的变化迫使双方重新评估彼此的关系，共同的对手和对秩序的共同珍重使得两党领导层开始接触。几次非公开会谈之后双方达成了合作的基本共识。"
 CHL_democratic_alliance:0 "建立民主联盟"
 CHL_democratic_alliance_desc:0 "在选举合作的基础上进一步将关系制度化，正式建立民主联盟，负责协商与团结党派之间在重大立法事项等重要政治事物上的共同立场，同时保留各自独立的组织架构和党纲。联盟纲领的核心内容包括捍卫宪政秩序、推进经济自由化、加强社会道德建设。"
 CHL_encourage_social_savings:0 "鼓励社会储蓄"
 CHL_encourage_social_savings_desc:0 "政府推出了一系列鼓励居民储蓄的政策，包括提高国家储蓄债券利率、设立个人退休账户税收减免、以及在中小学开展储蓄教育。财政部认为国民储蓄率的提高可以为国内投资提供稳定资金来源，减少对外债的依赖，银行随即在全国各地增设了储蓄网点。"
 CHL_new_republic:0 "新共和国"
 CHL_new_republic_desc:0 "国家党在其执政后推动了一整套宪政改革，将国家党的核心政治理念以宪法条文的形式固定下来。改革后的政治体制被称作“新共和国”，其特点是强化总统权力、限制地方自治、在国家重大事务上排除政党竞争而代之以全国协商机制。支持者将新共和国描述为智利政治传统的集大成者：一个强有力的、有道德的、不受外国思想和地方寡头挟持的民族国家。总统在签署宪法修正案的那天广场上聚集了数万支持者，礼炮轰鸣，人头攒动——国家党的党旗和智利国旗并列飘扬在所有政府大楼的旗杆上。一个政党完成了一个国家的重塑，至少它的信徒们是如此相信的。"
 CHL_cristian_democrats_win:0 "基督教民主党当选"
 CHL_cristian_democrats_win_desc:0 "第二次大选中，基督教民主党以微弱优势胜出，成为智利新的执政党。该党的竞选纲领融合了传统道德价值观与社会改良诉求，在保守派选民和温和进步派之间找到了一个微妙的平衡点。当选后组建的内阁容纳了党内多个派系，政策方向兼顾经济效率与社会公正。"
 CHL_redistribution_income:0 "收入再分配"
 CHL_redistribution_income_desc:0 "政府推出一套旨在缩小贫富差距的税收和福利方案，主要内容包括提高高收入阶层所得税率、扩大对低收入家庭的生活补贴、增设国家资助的职业培训项目。财政部的测算显示这些措施或许可以在三年内将基尼系数拉低数个点，同时不至于过度损伤企业投资意愿。政策的提出在国会引发了激烈辩论，反对者担心过度再分配会打击经济活力，支持者则指出贫富差距已经严重到威胁社会稳定的地步，改革已经刻不容缓。"
 CHL_from_falange_to_democracy:0 "长枪主义民主转型"
 CHL_from_falange_to_democracy_desc:0 "基督教民主党内部长期存在一个以长枪主义传统为荣的派别，其思想根源可以追溯到西班牙长枪党的某些主张——国家统合、阶级调和与对社区价值的强调。在智利民主化的新环境下，这一派别没有选择固守旧日的威权倾向，而是主动将长枪主义中的部分理念加以改造，剥离其原有的专制色彩，将“阶级合作”转化为一种倡导劳资协商的制度设计，将“国家统合”重新解释为超越党派利益的民族团结。这一转型为基督教民主党提供了独特的理论资源，使其在面对传统左翼的阶级话语和右翼的个人主义时都能拿出自己的替代方案。"
 CHL_cut_bureaucracy:0 "裁剪官僚机构"
 CHL_cut_bureaucracy_desc:0 "行政体系的臃肿在历届政府扩张之下已经成为一个显著问题，重叠的部门职能和冗长的审批流程拖累了政策执行效率。改革方案要求各部委在一个财政年度内完成自查，裁撤冗余岗位，合并职能相近的司局级单位，同时引入标准化的行政流程以减少不必要的文书往来。公务员工会对此表示警惕，对此政府承诺在裁减过程中保障基本权益，优先通过退休自然减员和内部转岗来消化富余人员。"
 CHL_humanism_spirit:0 "人文主义精神"
 CHL_humanism_spirit_desc:0 "政府在教育、文化和公共宣传领域推行一套以人文主义为核心的价值观，强调人的尊严、社会团结和道德教化。公立学校的课程大纲增加了哲学、伦理和公民教育的比重，国家资助的文艺项目倾向于表现普通劳动者的日常生活和社会互助。政府发言人多次在公开讲话中使用所谓“完整的人”这一概念，主张经济发展的最终目的是塑造有道德、有文化、有社会责任感的公民，而非仅仅追求物质指标的增长。"
 CHL_from_farright_to_libtards:0 "从激进右翼到民主斗士"
 CHL_from_farright_to_libtards_desc:0 "基督教民主党的前身与智利右翼激进运动有着千丝万缕的历史联系，其中一些成员早年甚至参与过对国家社会主义运动的同情。然而在民主化进程重启之后，该党完成了显著的政治转型。党内的新生代领导层公开与旧时代的极端主张划清界限，转而拥抱民主宪政和社会改良，其政策纲领逐渐向欧洲基督教民主主义靠拢。这一转型过程并不轻松，党内的老派人物与新派之间多次爆发路线之争，最终以新派的全面胜出告终。今天的基督教民主党在智利政治光谱中稳稳占据着中间偏右的位置，同时又是民主制度的坚定捍卫者，这种独特的身份让它在面对来自左右两端的攻击时都能保持一定的政治余裕。"
 CHL_the_revolution_of_liberty:0 "自由革命"
 CHL_the_revolution_of_liberty_desc:0 "基督教民主党在其执政后期发起了被支持者称为“自由革命”的全面社会改革，改革的核心理念也不似放任式的自由，而是一种积极自由观——国家有义务创造条件让每一个人都有能力行使自由权利。改革涵盖教育平权、医疗可及性、住房保障和基层自治四大领域。政府在推动改革时展现出惊人的政治动员能力，立法进程在国会以前所未有的速度推进。任期时的圣地亚哥举行了盛大的庆祝集会，总统则是在演讲中宣称智利已经找到了一条超越传统左右对立的第三条道路。"
 CHL_conservative_trimuph:0 "保守主义凯旋"
 CHL_conservative_trimuph_desc:0 "保守党在连续执政期间完成了对智利政治格局的重塑。从地方议会到中央政府，保守主义的理念渗透进了国家机器的每一个齿轮。政府发布的白皮书将这一时期定义为“秩序与繁荣的黄金年代”，列举了任期内修建的公共工程、恢复的对外贸易额和下降的犯罪率。支持者在圣地亚哥街头举行了盛大的庆祝游行，旗帜上印着保守党历任领袖的肖像，从早期的建党元老到现任总统，排成一条横跨三个街区的长队。这场胜利不仅仅是选举意义上的，它标志着保守主义从一种政治主张上升为智利社会的主流共识。政府在任期最后阶段着手将多项政策写入宪法修正案，试图确保即便未来政权更迭，保守主义的制度遗产也不会被轻易推翻。"
