CHL_dual_regime_grove_1:0 "格罗韦略占上风"
CHL_dual_regime_davila_win:0 "达维拉完全掌权"
CHL_dual_regime_davila_2:0 "达维拉权势扩大"
CHL_dual_regime_davila_1:0 "达维拉略占上风"
CHL_dual_regime_bop_decisions:0 "摇摇欲坠的双头政权"
CHL_revolutionary_policies:0 "扩大空军权力"
CHL_make_compromises:0 "扩大陆军权力"
CHL_reactionaries_on_the_move:0 "达维拉正在采取行动"
CHL_socialists_on_the_move:0 "格罗韦正在采取行动"
CHL_democrats_unrest:0 "民主派不满"
CHL_democrats_unrest_desc:0 "“智利社会主义共和国”成立的第一件事便是内斗，无休止的内斗给了那些躲在暗处的豺狼野狗机会。民主派无时无刻不再为夺回国家而做准备，而更加疯狂的民粹团体正等待着一个时机，还有那些觊觎权力的将军们。智利怎么办，只有天知道......"
CHL_nationalist_unrest:0 "柯卡特不满"
CHL_nationalist_unrest_desc:0 "“智利社会主义共和国”成立的第一件事便是内斗，无休止的内斗给了那些躲在暗处的豺狼野狗机会。民主派无时无刻不再为夺回国家而做准备，而更加疯狂的民粹团体正等待着一个时机，还有那些觊觎权力的将军们。智利怎么办，只有天知道......"
CHL_grove_victory:0 "格罗韦的胜利"
CHL_grove_victory_desc:0 "在历经磨难，欢笑，泪水及无力的呻吟声中，空军元帅格洛韦最终带领人民阵线击垮了贪婪的军部鬣狗。可怜的达维拉先生还没意识到发生了什么，便被丢入全新组建的智利海军陆战队训练部担任首席长官，与他的同僚一同日夜操练精兵强将，只待有朝一日美国内乱登陆西部州开拓解放区，再为革命立汗马功劳了。"
CHL_purge_nationalists:0 "清洗民族主义者"
CHL_purge_nationalists_desc:0 "在完成了对达维拉将军的初步清洗之后，是时候将目光转向他最广泛的支持者——民族主义者们身上了。这些民族主义派系山头林立，派系五花八门，唯一共同的诉求就是用一些……不怎么社会主义的方式让他们幻想中的智利伟大，更可悲的是二者大概率意见互不重合。哪怕目前温顺乖巧也不可小觑，应当先下手为强。"
CHL_promise_democracy:0 "对民主的承诺"
CHL_promise_democracy_desc:0 "推翻前任反动政府的最大遗产便是革命军队，可达维拉将军的叛变已向我们证明这份遗产并不可靠，甚至随时会反咬一口摧毁我们为之付出的一切，为了我们的社会主义事业和各类互有分歧的左翼政党团结，我们必须进行民主化。而对民主的广泛承诺便是一个不错的开始。"
CHL_ensure_army_loyalty:0 "确保军队忠诚"
CHL_ensure_army_loyalty_desc:0 "虽说我们通过调离嫡系部队的方式轻易的完成了政变，可那些对失势陆军长官未有几分忠诚的士官和士兵恐怕也不会给我们好脸色看。应第一时间将空军影响力扩散至陆军，确保我们不会成为下一次革命的对象。"
CHL_begin_land_reform:0 "开始土地改革"
CHL_begin_land_reform_desc:0 "我们通过承诺土地改革吸引了智利绝大多数的农民，如今大权得保正是博取进一步支持的好时机，通过快速开展的土地改革将我们的影响力扩大至乡间的每一片田野，直到基层再无空缺。"
CHL_soldify_popular_front:0 "巩固人民阵线"
CHL_soldify_popular_front_desc:0 "在完成了对左翼激进势力的初步统合并夺取胜利后，我们应当巩固这为我们带来胜利的组织，使我们意见上虽说稍有分歧，但革命意志坚定的同志们紧密的团结在人民阵线之下，为智利带来胜利。"
CHL_promote_Benitez:0 "提拔贝尼特斯"
CHL_promote_Benitez_desc:0 "来自空军的贝尼特斯先生对我们的事业有足够的忠诚，自革命开始便坚定不移地站在我方，事实已向我们证明。其不仅对社会主义有坚定的信仰，资历与能力也远高于其岗位，正是我们提拔干部的不二之选。"
CHL_social_justice:0 "社会正义"
CHL_social_justice_desc:0 "在我们这正义的社会下，邪恶无所遁形。实业大亨和金融巨鳄们缩在地下室里畏畏缩缩等待着判决来临，往日仗着政府统治力度日渐萎靡，在往日乡间嚣张跋扈的地主老财们那双丑恶的眼眸如今正无神的望着绞刑台下冷眼旁观的乡土居民。正义于今日得到伸张。"
CHL_human_face:0 "人性面孔"
CHL_human_face_desc:0 "在智利这片土地上的人民已承受太多太多，自伊涅巴斯治下便无宁日，而后而冉冉升起的社会主义共和国也陷入内斗不可自拔，并未给予过多补助，哪怕是现在也因阿根廷的威胁难以空出手大刀阔斧改革，只能先从指缝中抠出一点余量来安抚饥肠辘辘的人民了。"
CHL_from_prison_to_senate:0 "从监狱到参议院"
CHL_from_prison_to_senate_desc:0 "自1927年那次失败的革命后，我们终于真正赢得了胜利，历经大量改革后的内政已焕然一新，老对头和他的党羽们已不足为虑，只待一声令下。便会举起那双满是伤痕老茧的手以表退意，军队也整肃大半，只待南美再次风云变幻之际便是出动之时，全国上下欢欣鼓舞，无不为这次胜利而振奋。至少现在，我们胜利了"
CHL_davila_victory:0 "达维拉继续掌权"
CHL_davila_victory_desc:0 "可笑的空军小丑和他那嘈杂又喋喋不休的戏班终于滚下了舞台，他们自以为胜券在握却只轮得个海军航空兵之职——哪怕我们根本没有航母，剩余未反应过来的左翼党派便冠以国际观察之名送到英法学习交流，那么局势就稳定了。"
CHL_crash_syndie:0 "镇压工团主义者"
CHL_crash_syndie_desc:0 "这些该死的工团主义者喋喋不休，以工会作为其代表向我们兜售着降低工时提高工薪的愚见。可悲可叹，若不是我们陆军勤恳守则，哪换得来这样一个朗朗乾坤，太平之世？让这些沉溺于革命美梦的激进分子好好冷静冷静，若不愿支持这场属于军士们的革命，那便只能作为余烬中的最后一点残渣，随风拂去了。"
CHL_price_control_committe:0 "价格控制委员会"
CHL_price_control_committe_desc:0 "在我们铁腕手段之下，颠覆分子们大致已偃旗息鼓，那正是我们大肆分封，收买人心的好时机，将那些愿意为政府出钱出力的热心爱国实业家，经济贡献者和乡绅统一收编至新创立下的价格控制委员会统一各辖区物价，以促社会主义之实干。"
CHL_destory_liberal_personalism:0 "摧毁自由个人主义"
CHL_destory_liberal_personalism_desc:0 "自由主义这条毒蛇一直在暗中窥伺着我们伟大的国家，自从1932年革命成功之后便对政府喋喋不休，妄作论断，这些可笑的自由主义者向我们英勇的国民兜售着那套腐蚀国民健全之心智的个人主义思想，甚至于格洛维之党羽与背后都有其支持，毒蛇虽狠厉却暂无破坏革命之能，正是将其彻底驱逐出智利之时。"
CHL_ministry_of_labor:0 "创立劳动部"
CHL_ministry_of_labor_desc:0 "如今工团分子们被打击至所剩无几，实业家们也应他们忠诚的赏赐满意的低下了头，那正是我等大展拳脚，扩展影响力至工业部门的机会，新创立劳动部代以公会以统辖劳动，强制全民加入后按人头收取会费贡献国家，并盖以节日甜点犒劳。"
CHL_cooperate_with_capital:0 "与资产阶级合作"
CHL_cooperate_with_capital_desc:0 "如今回过头来，所以说国际上社会主义广泛对资产阶级带有排斥歧视之意，但资产阶级为我国兵士革命立下不世之功，已成功地证明其忠诚，现在正该将此事抬到面前，正式宣告与爱国者们的彻底合作。"
CHL_promote_nationalists:0 "提拔民族主义者"
CHL_promote_nationalists_desc:0 "说真的，还有比民族主义者们更忠实，无私的支持者吗？专一而一心一意为智利民族服务，除此之外便别无所求。对我等来说只需略施小计，小小展示一下政策上对民族的倾斜便会纷纷倒戈而至，又不慕钱财与名利，这些忠实的支持者们仅仅是在击退政变后提出了一些无关紧要的要求，而忠诚者自有奖赏。"
CHL_feed_people:0 "喂饱人民"
CHL_feed_people_desc:0 "在我们执着于争权夺利，斩草除根之时，那些空洞的而眼神和饥饿的腹腔还在城乡里游荡，而如今权力的精妙斗争已悄然落幕，我们也应当将同从滑稽的马戏面前扭过来看看这一地鸡毛了，不管是强制劳动还是扩大施粥处，总得给点希望以备东征之时。"
CHL_revitalize_nationalism:0 "重燃民族主义"
CHL_revitalize_nationalism_desc:0 "民族主义正是针对智利现状的一味良药，如今国家自1932年来的千疮百孔已好上太多，但远远不足以应对即将到来的战争，值此危难之际更应重振民族主义，使国民们了解为之奋斗的目标并因此为国付出。"
CHL_benovolent_dictatorship:0 "仁慈独裁"
CHL_benovolent_dictatorship_desc:0 "在经历了对智利政坛的绝对重塑，爱国者们的一致认同及密谋颠覆者的腥风血雨中，达维拉大帅终究坐稳了宝位，向全智利宣告全善全能的独裁官到来，只要还在位一天，智利工人们便能英勇的付出，使农民们全心全意为国劳作，充满人间之哲思的新中间层统筹谋划，居有定所，老有所依，使全智利沐浴在他的仁慈的光辉之下——和那隐约可见的刺刀"
CHL_south_cone_war:0 "南锥体战争"
CHL_south_cone_war_desc:0 "阿根廷国民政权总统曼努埃尔·卡莱斯已经宣布对南方巴塔哥尼亚红色政权发动统一战争！智利社会主义共和国随即对阿根廷宣战，南锥体战争爆发。我们的战略目标是在安第斯山脉东麓建立防线，阻挡国民军南下并伺机向北推进，最终推翻残暴的卡莱斯政权。这场战争将决定南锥体地区未来数十年的命运……"
CHL_mass_moblization:0 "大规模动员"
CHL_mass_moblization_desc:0 "政府启动了全面动员机制，征兵范围覆盖全国主要城市和农业省份，第一批征召对象是已完成基础军事训练的预备役人员。将动员令通过广播电台和地方政府逐级传达，适龄男性按出生年份分批入伍。运输系统将转入军事管制，铁路要优先运送兵员和物资。"
CHL_rally_millitia:0 "召集民兵"
CHL_rally_millitia_desc:0 "除正规军外，智利各地还存在大量工农民兵组织，这些组织在革命胜利后的社会改造中逐步形成，定期进行军事训练。我们可以下令将这些民兵整编为一些正规作战单位，装配一些合作社生产的武器。"
CHL_arm_the_people:0 "武装人民"
CHL_arm_the_people_desc:0 "考虑到战线漫长且阿根廷国民军有渗透作战的习惯，智利政府决定在后方城镇推行民众武装计划。我们号召街区委员会和农村合作社等负责组织本地居民进行基本武器的操作训练，并大量发放已经不用于军备范围的库存老旧枪械。这些武装民众将迅速成为我们的一批可靠兵源。"
CHL_france_support:0 "寻求国际支援"
CHL_france_support_desc:0 "智利外交部通过第三国际渠道向法兰西公社、不列颠联盟和意大利社会主义共和国发出正式援助请求，三国承诺提供军火和战略物资，运输船队从欧洲港口出发，经大西洋航线抵达瓦尔帕莱索港。援助物资包括大量火炮、机枪、通信设备和医疗用品，第一批预计在开两周以内到达。"
CHL_ally_paraguy:0 "邀请巴拉圭"
CHL_ally_paraguy_desc:0 "巴拉圭与阿根廷的紧张关系源自曾经查科战争期间阿根廷对玻利维亚的支持。现在智利政府利用这一旧矛盾向巴拉圭发出结盟提议，建议双方组成联合阵线对阿根廷作战。巴拉圭的参战将迫使阿根廷在北部边境部署兵力，分散其对南方战线的投入。"
CHL_aside_peru:0 "稳住秘鲁人"
CHL_aside_peru_desc:0 "秘鲁与智利之间存在一些历史领土的争议，政府自然是担心秘鲁趁机在北方边境制造事端。于是外交部门主动向秘鲁发出外交照会以表达改善双边关系的意愿，并附上一批硝石作为贸易示好。我们的策略是通过经济让步换取秘鲁的中立保证，确保北方边境在战争期间保持稳定。"
CHL_go_all_out:0 "全力以赴！"
CHL_go_all_out_desc:0 "呼号我们的军队，使他们做到最好。\n将腰带系好，把子弹上膛！\n我们已经决定，就要决不投降！\n智利的军队振奋，革命的力量激昂！向前向前向前，绝不辜负荣光！保卫阿根廷就是保卫家乡！"
CHL_civ_to_miv:0 "经济动员"
CHL_civ_to_miv_desc:0 "战争需求已经超出常备物资储备，于是政府宣布实行经济动员——主要工业设施转向军用生产，纺织厂转产帆布和军服，机械加工车间开始承接武器零部件订单。硝石和铜矿维持原有产量，而使出口暂时中止，矿产收入直接转为战争经费。国内也将实行部分生活物资配给制以优先保障军队供应。"
CHL_emergency_military_construction:0 "紧急军工建设"
CHL_emergency_military_construction_desc:0 "国内现有军工产能并不足以支撑长期作战，政府决定在各地兴建弹药装配厂和火炮维修车间。设备从圣地亚哥等中心城市的机械厂调配，技术人员由军队工程兵和民间技师混编以迅速扩大规模。甚至工厂也采用简易厂房结构，目标三个月内达能到设计产能，像其他厂一样供应军工生产。"
CHL_scrap_supply:0 "搜刮补给"
CHL_scrap_supply_desc:0 "安第斯山脉以东的阿根廷领土是智利军队的主要作战区域，而当地农业发达，粮食和牲畜储备充足。后勤部门计划在占领区就地征用物资以减少对国内运输线的依赖。征用方式也包含强制收购，支付比索或留下借据。这种做法能缓解后勤压力，同时也可能影响当地民众对占领军的态度。"
CHL_our_last_chance:0 "最后一搏"
CHL_our_last_chance_desc:0 "（注：此国策可以打赢跳过，不必要点完！）\n如果战争陷入僵持……我们将考虑启动全面动员的补充方案：加强战时训练与作战烈度，延长工人工时，征用民用车辆和通信设备……政府各部门压缩非战争开支，教育和文化经费转拨军费！一切为了胜利，绝不死于阿根廷……一切为了胜利，绝不倒下在这里……"
CHL_we_won:0 "红旗飘扬阿根廷"
CHL_we_won_desc:0 "智利和巴塔哥尼亚联军向北推进，先后攻占门多萨、科尔多瓦、罗萨里奥……布宜诺斯艾利斯也就陷落。国民阿根廷政权灭亡了，阿根廷全境统一在社会主义政权之下！南锥体战争以红色阵营的全面胜利结束。安第斯山脉两侧的工人和农民终于大声的欢呼，胜利的喜悦像南锥体夏季的强风一样扫过城市和乡村的每一条街道。人们涌上广场高声歌唱，那些还没来得及填上新词的红色旋律，在狂喜中任何曲调都显得足够庄严。智利政权的国家安全环境由此得到了根本改善，整个南锥体从此进入了一个全新的时代。"
