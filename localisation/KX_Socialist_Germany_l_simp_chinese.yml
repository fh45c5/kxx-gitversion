 rotermorgenmisc.10011.t:0 "复辟皇冠的主人 - 续"
 rotermorgenmisc.10011.d:0 "接下来的两位候选人是来自霍亨索伦-锡格马林根家族天主教旁系的腓特烈和弗朗茨·约瑟夫两兄弟，在许多德国人看来，这兄弟俩可谓是相当奇特。腓特烈是霍亨索伦亲王，由于其母波旁-两西西里公主玛丽亚·特蕾莎的血缘关系，有人猜测他将成为未来的西班牙国王（如果德国打算介入西班牙的话），他的贵族生活相当平平无奇，不过，出于他对战争的热爱，他慢慢开始倾向于在近几十年来多次工团主义革命后开始兴起激进民族主义民兵组织。革命爆发后，腓特烈的许多朋友都认为他会与社会主义者血战至死，但事实证明他们都错了，社民党激进派的温和政府也是如此。亲王亲自发动了一场真正的革命战争，在新共和国的法庭上为保留东普鲁士大片森林的所有权舌战群儒。之后，他将来之不易的庄园变成了名副其实的禁区，禁止任何赤匪和祖国叛徒入内，直到最近基民盟的上台才有所松动。腓特烈王子将加冕为腓特烈四世，继承神圣罗马帝国哈布斯堡王朝腓特烈三世和德意志皇帝腓特烈三世的历史遗产。\n\n他的弟弟，霍亨索伦的弗朗茨·约瑟夫（他喜欢自称为为霍亨索伦·埃姆登），也同样奇怪，甚至可能比他哥还奇怪。在世界大战期间，弗朗茨·约瑟夫在“埃姆登”号轻巡洋舰上担任鱼雷军官，自认为是一名在保护德国不受任何威胁的道路上远航的正义骑士。他将自己的观点写进了一本关于自己战时经历的书《埃姆登：侠骑士的终航》中。在德属东亚服役期间，他与流亡的政治激进分子有了接触，之后，他采用了霍亨索伦-埃姆登亲王的头衔，这让他的其他亲族非常恼火。更令德国公民感到奇怪的是，最近有报道称他受到了越南所谓的“椰子僧”的影响，在他的“凤岛”上进行统治。如果埃姆登王子被选中，他将自行加冕为弗朗茨·约瑟夫二世，这显然是对他所认为的哈布斯堡家族的自由和软弱的嘲讽，认为其不配继承弗朗茨·约瑟夫一世的遗产。\n\n最后一位候选人是曾经差点当上芬兰国王的普鲁士的腓特烈·威廉。尽管腓特烈·威廉王子既是新教徒，又是霍亨索伦家族的成员，还因此成了前民主党中最受欢迎的候选人，但他却因妻子是天主教徒而被拒绝作为王位候选人，基民盟的许多支持者在竞选期间都利用了这一点。此后，他苦修哲学，甚至获得了波恩大学的博士学位，并将注意力转向了如何在德国推行类似于英国的议会君主制，以避免德意志帝国再次因他所认为的原因重蹈衰落覆辙。革命结束后，腓特烈·威廉成为了保皇派运动的真正先锋，夜以继日、奋战不休，试图以改革方式合法地复辟德意志帝国。如果当选，他将加冕为腓特烈·威廉五世。"
 rotermorgenmisc.1001.g:0 "加冕普鲁士的腓特烈·威廉！"
