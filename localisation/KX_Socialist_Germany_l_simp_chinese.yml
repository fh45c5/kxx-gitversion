 GRU_bomber_ground_OK_NLW_desc:0 "德国国家空军最高统帅部。\n\n我们的空军以轰炸机和地面支援为核心。"
 GRU_bomber_sea_OK_NLW:0 "国家空军最高统帅部"
 GRU_bomber_sea_OK_NLW_desc:0 "德国国家空军最高统帅部。\n\n我们的空军以轰炸机和海军支援为核心。"
 GRU_panzer:0 "陆军重心：坦克"
 GRU_panzer_desc:0 "我们的军队将会以装甲部队为基础建设。"
 GRU_panzer_two:0 "陆军重心：坦克与机械化步兵"
 GRU_panzer_two_desc:0 "我们的军队将会以合成部队为基础建设。"
 GRU_masses:0 "陆军重心：人海战术"
 GRU_masses_desc:0 "我们的军队将会以大规模步兵为基础建设。"
 GRU_masses_two:0 "陆军重心：人海战术与火力压制"
 GRU_masses_two_desc:0 "我们的军队将会以大规模步兵和压倒性火力的合成部队为基础建设。"
 GRU_mobile_generals:0 "国家人民军最高统帅部"
 GRU_mobile_generals_desc:0 "德国国家陆军最高统帅部\n\n我们的陆基武装力量以机动性、速度和装甲师的使用为核心"
 GRU_masses_generals:0 "国家人民军最高统帅部"
 GRU_masses_generals_desc:0 "德国国家陆军最高统帅部\n\n我们的陆基武装力量以人浪战术和对敌人阵地的压倒性炮火的结合为核心"
 GRU_pol_off:0 "政治委员"
 GRU_pol_off_desc:0 "我们的军官团在选拔中以意识形态上的盲从态度为主。"
 GRU_skill_off:0 "专业军官"
 GRU_skill_off_desc:0 "我们的军官团在选拔中以专业技能为主。"
 GRU_eleced_off:0 "选举军官"
 GRU_eleced_off_desc:0 "士兵从他们的连队中选举他们的直属上级，但将军由政府任命。"
 GRU_MFSP:0 "特种项目部"
 GRU_MFSP_desc:0 "特种项目部\n特种项目部的任务是为首要项目分配人才库和资源。"
 GRU_DSR:0 "德意志工团主义共和国"
 GRU_DSR_desc:0 "德意志工团主义共和国认为自己是所有前德国政府的合法继承者，如果这些政府仍然以某种形式存在，它也认为这些政府是非法的。"
 GRU_DSR_Welfare:0 "工团主义福利"
 GRU_DSR_Welfare_desc:0 "新的工团主义福利计划为所有有需要的工人提供免费住房和基本需求。"
 GRU_DSR_education1:0 "工团主义教育"
 GRU_DSR_education1_desc:0 "以自然科学、物理学与工团主义社会理想为新核心的工团主义教育新时代已经来到了当代德国青年身边。"
 GRU_DSR_education2:0 "工团主义高等教育"
 GRU_DSR_education2_desc:0 "德国的大学和学校已经改组成他们自己的联盟，现在由联盟决定教给下一代什么和如何教育。\n但有一件事已经确定无疑，传统主义或宗教思想和价值观在德国教育中将不再占有一席之地。"
 GRU_DSR_integration:0 "融合"
 GRU_DSR_integration_desc:0 "我们的任何残疾工人都不能被排除在工作之外，甚至不能被排除在兵役之外！\n我们要在社会上为每个工人都找到一个位置。"
 GRU_DSR_oneunion:0 "德意志统一工会"
 GRU_DSR_oneunion_desc:0 "德国统一工会将作为全体德国工人的公民赞助人和平台。"
 GRU_DSR_fortschritt:0 "进步！"
 GRU_DSR_fortschritt_desc:0 "进步！\n\n我们已经实现了我们的梦想，创造一个公正和宽容的社会，让所有的工人共享财富。"
 GRU_DSR_industrialunions:0 "产业工会"
 GRU_DSR_industrialunions_desc:0 "德国工业的联合为我们建立更强大的经济奠定了坚实的基础。"
 GRU_DSR_industrialunions_TWO:0 "产业民主"
 GRU_DSR_industrialunions_TWO_desc:0 "德国工业的联合为我们建立更强大的经济奠定了坚实的基础。工人直接控制生产资料的公平的民主化工业！"
 GRU_DSR_COMITTEE:0 "工会委员会"
 GRU_DSR_COMITTEE_desc:0 "工会贸易委员会是工会与外国或其他工会之间资源贸易的中间人，并在必要时作为中央机构直接控制所有工会。"
 GRU_DSR_ressources1:0 "资源开采与分配协会"
 GRU_DSR_ressources1_desc:0 "资源开采与分配协会是一个控制自然资源开采和分配的国立协会。"
 GRU_DSR_ressources2:0 "资源开采与分配及农业公社协会"
 GRU_DSR_ressources2_desc:0 "资源开采与分配及农业公社协会是一个国立协会，负责控制自然资源和农产品的开采和分配。"
 GRU_FAUD_congress:0 "德意志联盟大会"
 GRU_FAUD_congress_desc:0 "工会大会将会被建立，并作为德国的常设立法机构。"
 GRU_FAUD_Education1:0 "反威权教育"
 GRU_FAUD_Education1_desc:0 "德国教育将不再遵循经典的学校教育模式，而是基于鲁道夫·斯坦纳强调个性和创造力的“华德福教育”模式，在这个模式中分数制将会被废除。"
 GRU_FAUD_Education2:0 "学生自治公社"
 GRU_FAUD_Education2_desc:0 "德国教育将不再遵循经典的学校教育模式，而是基于鲁道夫·斯坦纳强调个性和创造力的“华德福教育”模式，在这个模式中分数制将会被废除。\n\n传统的大学形式也被废除，取而代之的是学生自治公社，没有考试，也没有教授。相反，他们关注的是在为他们提供的学生村中的个人自我的提升，学生村以年老学者为赞助人的图书馆为中心，而不是住在其中的上级领导。"
 GRU_SPD_Education1:0 "自由教育"
 GRU_SPD_Education1_desc:0 "政治或宗教思想在学校里没有立足之地，我们的学校系统将发挥它应有的作用：一个获得知识的地方。我们后代必须独立思考。"
 GRU_SPD_Education2:0 "自由主义教育与助学金"
 GRU_SPD_Education2_desc:0 "政治或宗教思想在学校里没有立足之地，我们的学校系统将发挥它应有的作用：一个获得知识的地方。我们后代必须独立思考。\n\n那些负担不起学习费用但有能力完成学术工作的学生将得到政府的资助。"
 GRU_SPD_FAUD_EINIGKEIT_RECHT:0 "统一，正义……"
 GRU_SPD_FAUD_EINIGKEIT_RECHT_desc:0 "统一和正义是构成我们宪法和社会核心的原则。"
 GRU_SPD_FAUD_FREIHEIT:0 "统一，正义与自由"
 GRU_SPD_FAUD_FREIHEIT_desc:0 "统一、正义和自由是我们宪法和社会的核心原则。"
 GRU_SPD_FAUD_WOMAN_RIGHTS:0 "女权主义"
 GRU_SPD_FAUD_WOMAN_RIGHTS_desc:0 "我们社会的法律不会再将男女区别对待，工作分配也不会再有差异。"
 GRU_SPD_FAUD_TOLERANT_SOCIETY:0 "宽容的社会"
 GRU_SPD_FAUD_TOLERANT_SOCIETY_desc:0 "我们社会的法律不会再将不同性别、性取向和种族区别对待，工作分配也不会再有差异。"
 GRU_SPD_SOCIAL_MARKET:0 "社会市场经济"
 GRU_SPD_SOCIAL_MARKET_desc:0 "我们建立了社会市场经济的基础，将自由市场与社会理念和保障结合起来。"
 GRU_SPD_SOCIAL_MARKET_MIRACLE:0 "社会市场经济：经济奇迹"
 GRU_SPD_SOCIAL_MARKET_MIRACLE_desc:0 "我们建立了社会市场经济的基础，将自由市场与社会理念和保障结合起来，现在是时候收获劳动果实了。\n我们的经济上全世界增长最快的，大众财富终于化为现实。"
 GRU_SPD_WORKER_RIGHTS:0 "工人权利"
 GRU_SPD_WORKER_RIGHTS_desc:0 "通过几项保护工人不受雇主不公平待遇的法律，我们将创造一个阶级和谐相处的社会。"
 GRU_WORLD_REVOLUTION:0 "输出革命"
 GRU_WORLD_REVOLUTION_desc:0 "我们将会输出革命！"
 GRU_arsenal_of_syndicalism_idea:0 "工团马克思主义兵工厂"
 GRU_arsenal_of_syndicalism_idea_desc:0 "我们的工业战争机器现在已经焦虑不安的准备为最后的斗争做贡献"
 GRU_RED_TRADE:0 "红色贸易"
 GRU_RED_TRADE_desc:0 "我们只与那些支持革命的国家进行贸易，我们必须向我们的盟友施压，让他们也这么做。"
 GRU_RED_WORLD:0 "世界革命"
 GRU_RED_WORLD_desc:0 "我们将横扫全球，让赤潮席卷旧世界。"
 GRU_HEROISM:0 "英雄主义宣传"
 GRU_HEROISM_desc:0 "表扬保护我们的工人士兵！"
 GRU_RED_GUARD:0 "赤卫队"
 GRU_RED_GUARD_desc:0 "准军事警察部队会严密监视街上的每一个人。"
 GRU_RED_NEWS:0 "布尔什维克电台"
 GRU_RED_NEWS_desc:0 "老百姓能获取信息的唯一途径就是党的宣传。"
 GRU_WOMAN_WORKER:0 "女工"
 GRU_WOMAN_WORKER_desc:0 "德意志的女性像她们的男性同行一样在工厂和农田工作"
 GRU_BRUTALISM:0 "野兽派建筑"
 GRU_BRUTALISM_desc:0 "该国已经迎来了一个新的野兽派建筑时代。"
 GRU_5_YEAR_PLAN:0 "五年计划"
 GRU_5_YEAR_PLAN_desc:0 "经济有义务遵循五年计划。"
 GRU_KOMMANDOWIRTSCHAFT:0 "计划经济"
 GRU_KOMMANDOWIRTSCHAFT_desc:0 "整个经济已经重组为一条庞大的生产线，能够在短时间内适应它可能面临的所有情况。"
 GRU_GPR:0 "德意志人民共和国"
 GRU_GPR_desc:0 "德意志人民共和国认为自己是所有前德国政府的合法继承人，如果这些政府仍然以某种形式存在，它也认为这些政府是非法的。"
 GRU_GDU:0 "德意志民主联盟"
 GRU_GDU_desc:0 "德意志民主联盟认为自己是所有前德国政府的合法继承人，如果这些政府仍然以某种形式存在，它也认为这是非法的。"
 GRU_GESTAPO:0 "史塔西"
 GRU_GESTAPO_desc:0 "史塔西是一个政治监督和执法部门，其职能类似于警察，但方法远不那么人道。"
 GRU_DIRECT_CONTROL:0 "直接控制工会"
 GRU_DIRECT_CONTROL_desc:0 "工会不再以民主方式选举领导人，取而代之的是党任命他们最喜欢的候选人。"
 GRU_PARLIAMENT:0 "授权委员会"
 GRU_PARLIAMENT_desc:0 "议会被授权将政府内部的最高权力下放给几个高级官员。"
 GRU_RED_PATRIOT:0 "红色爱国主义"
 GRU_RED_PATRIOT_desc:0 "在公开谴责民族主义的同时，我们向我们的工团主义国家宣传红色爱国主义。"
 GRU_FEMALE_SOLDIER:0 "女兵"
 GRU_FEMALE_SOLDIER_desc:0 "我们允许女性像男性同行一样服务和工作。"
