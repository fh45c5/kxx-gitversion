 GRU_battleship_submarine_OK_NVM_desc:0 "德国国家海军最高统帅部。\n\n我们的舰队将以战列舰特遣部队和潜艇狼群为重心。"
 GRU_battleship_cruiser_OK_NVM:0 "国家人民海军最高统帅部"
 GRU_battleship_cruiser_OK_NVM_desc:0 "德国国家海军最高统帅部。\n\n我们的舰队将以战列舰特遣部队和巡洋舰为重心。"
 GRU_fighter:0 "空军重心：战斗机"
 GRU_fighter_desc:0 "我们的空军发展专注于战斗机。"
 GRU_fighter_ground:0 "空军重心：战斗机与地面支援"
 GRU_fighter_ground_desc:0 "我们的空军发展专注于战斗机和地面支援。"
 GRU_fighter_sea:0 "空军重心：战斗机与海军支援"
 GRU_fighter_sea_desc:0 "我们的空军发展专注于战斗机和海军支援。"
 GRU_fighter_ground_OK_NLW:0 "国家空军最高统帅部"
 GRU_fighter_ground_OK_NLW_desc:0 "德国国家空军最高统帅部。\n\n我们的空军以战斗机和地面支援为核心。"
 GRU_fighter_sea_OK_NLW:0 "国家空军最高统帅部"
 GRU_fighter_sea_OK_NLW_desc:0 "德国国家空军最高统帅部\n\n我们的空军以战斗机和海军支援为核心。"
 GRU_bomber:0 "空军重心：轰炸机"
 GRU_bomber_desc:0 "我们的空军发展专注于轰炸机。"
