 rotermorgenmisc.150.a:0 "欢迎回归！"
 rotermorgen.70.t:0 "德意志联盟第一次大会"
 rotermorgen.70.d:0 "占领当局要求召开第一届德意志联盟大会，允许拥有2万名以上成员的工会、政党或政治组织参与此次大会。\n\n领先的候选者有工团马克思党和德意志社会民主党（激进派），前者提倡实行一种深受马克思主义影响的工团主义，后者则是战前社民党的激进派别，提倡“社会主义民主”。\n\n但也有其他的党派参与着竞争。由于德国左翼政党的组建合法化，德意志自由工人联合会的影响力早已不如以往，但它仍有获胜可能。而由保罗·连施领导的日耳曼社会主义人民党则是另一大派别，该党宣扬的泛日耳曼民族主义，传统价值观和普鲁士纪律理念在大会中显得过于另类，而不被其他政党所接受。"
 rotermorgen.70.a:0 "保罗·连施——日耳曼社会主义人民党胜利"
 rotermorgen.70.b:0 "皮克/台尔曼——德意志统一工团马克思党胜利"
 rotermorgen.70.c:0 "鲁道夫·洛克——德意志自由工人联合会胜利"
 rotermorgen.70.e:0 "李卜克内西——德国社会民主党激进派胜利"
 rotermorgen.700.t:0 "大选"
 rotermorgen.700.d:0 "在选举前不久，社会民主党再次分裂，激进派另起炉灶，成立了民主社会党，而温和派成员大部分仍留在了旧时的主流社民党中，德意志社民党-激进派似乎已经成为了一个历史名词。\n\n与此同时，几个被前政府贴上反动派标签的政党也在尝试赢得大选，以推翻早已建立起来的社会主义社会，没有人能清楚地预测出选举结果会是什么样……"
 rotermorgen.700.a:0 "社会保守主义的基督教民主联盟获胜！"
 rotermorgen.700.b:0 "市场自由主义的德意志自由党赢得了胜利！"
 rotermorgen.700.c:0 "社会自由主义的自由民主党赢了！"
 rotermorgen.700.e:0 "德意志社会民主党的元老们获胜！"
 rotermorgen.700.f:0 "激进的民主社会党将捍卫社会主义民主！"
 rotermorgenmisc.7.t:0 "李卜克内西因年龄问题退休"
 rotermorgenmisc.7.d:0 "今天，德国总统卡尔·李卜克内西宣布他将退休，并履行先前承诺的全面民主。\n\n年过七旬的李卜克内西认为自己不再适合统治国家，希望能在最后几年里安稳地生活。"
 rotermorgenmisc.7.a:0 "但社民党激进派大概挺不过去了……"
 rotermorgen.1.t:0 "做一个德国人？"
 rotermorgen.1.d:0 "你做到了！你从德皇手中拯救了欧洲！现在我只有一个问题要问你！\n\n你想扮演德国继续游戏么？"
 rotermorgen.1.a:0 "谢谢，我就不用了。"
 rotermorgen.1.b:0 "这是我在这里的唯一原因，伙计！"
 rotermorgen.80.t:0 "德意志统一工团马克思党党内斗争升级"
 rotermorgen.80.d:0 "由工团派和马克思派组成的德意志统一工团马克思党终究还是没能实现“统一”，两派在经济状况和未来等重要议题上的想法大相径庭，不断发生着内斗。党的领导层已经召开了一次紧急党员大会，台尔曼和皮克以及两人的支持者都在会议上慷慨陈词，阐述着自己的观点，但却不断被对立派别成员的嘲笑声打断。\n\n现在的问题是，谁取得了优势地位？"
 rotermorgen.80.a:0 "台尔曼将带领我们走向繁荣！"
 rotermorgen.80.b:0 "皮克将会指引我们！"
 rotermorgen.10.t:0 "占领"
 rotermorgen.10.d:0 "现在我们既然掌握了德国的全部控制权，就必须为它找到一条未来的道路。我们现在面临的问题是，虽然前德意志帝国各地都有着地下组织，但除了德意志自由工人联合会之外，还没有任何一个正式的工团主义或社会主义组织，我们不能简单地把所有的权力交给一个内部派系争斗不断的工人工会。\n由法、英、意三国代表团组成的委员会，决定号召德国人成立政党，为将来的德意志联盟大会做准备。"
 rotermorgen.10.a:0 "看看事态会如何发展吧"
 rotermorgen.20.t:0 "旧党的幸存者"
 rotermorgen.20.d:0 "虽然我们起初禁止了德国战前的所有政党，但我们决定再次将战前曾致力于工人斗争的政党合法化。\n\n像恩斯特·台尔曼这样的德国著名工团主义者已经成立了几个工团组织和联盟。此外，社民党内的激进社会主义派与温和派成员的分歧已难以弥合，这些激进派成员现在已经在社民党内部围绕着卡尔·李卜克内西形成了社民党-激进派。"
 rotermorgen.20.a:0 "有趣的进展"
 rotermorgen.30.t:0 "德意志自由工人联合会的分裂"
 rotermorgen.30.d:0 "德意志自由工人联合会最近面临着一些重大问题，恩斯特·台尔曼带领着相当一部分倾向集权主义的成员一起离开，成立了“德意志工人工团联盟”。\n在此之后，德意志自由工人联合会的残余成员明确表示，他们现在将代表唯一真正的工团主义联盟，他们称台尔曼为马克思主义者、布尔什维克，是自由的叛徒——因为台尔曼在政府和经济上的立场倾向于中央集权。"
 rotermorgen.30.a:0 "等等，他们不是我们当中最强大的派别吗？"
 rotermorgen.40.t:0 "威廉·皮克呼吁马克思列宁主义"
 rotermorgen.40.d:0 "德国最著名的马克思列宁主义支持者之一、自由意志工团主义的敌人威廉·皮克呼吁恢复“真正的工人阶级斗争”并拥抱马克思主义思想。\n他已经宣布将与新成立的马克思主义政党德意志统一马列党一起参加第一次选举。"
 rotermorgen.40.a:0 "列宁在俄罗斯失败了，皮克在这里也会得到同样的结果"
 rotermorgen.50.t:0 "连施博士的迷人魅力"
 rotermorgen.50.d:0 "虽然很多人认为皮克组建的德意志统一马列党对工团主义社会来说是一个问题，但没有人会想到另一个政党的成立会盖过这一问题。\n\n保罗·连施，这位前社民党成员，同时也是支持泛日耳曼主义的革命保守派煽动者，成功组织了一场由统一马列党中的民族主义强硬派、同情泛日耳曼团结和传统经济政策的民族主义者以及少数“德意志索雷尔派”参加的会议。"
 rotermorgen.50.a:0 "这是个玩笑吗？"
 rotermorgen.51.t:0 "德意志工人工团联盟与德意志统一马列党的合并"
 rotermorgen.51.d:0 "今天，恩斯特·台尔曼和威廉·皮克宣布德意志工人工团联盟和德意志统一马列党因意识形态相似，将合并为德意志统一工团马克思党，以增加他们在德国夺取权力的机会。"
 rotermorgen.51.a:0 "工团马克思主义？"
 rotermorgen.52.t:0 "保罗·连施和日耳曼社会主义人民党"
 rotermorgen.52.d:0 "我们收到了一个令人不安的消息。那个反动的疯子保罗·连施成功拉拢到了人们的支持，并组织了自己的政党——日耳曼社会主义人民党。所谓的“日耳曼社会主义”政党，该理念怎么看都像是披上一层薄薄红纱的保守主义。很多人认为这无疑是对革命的背叛。\n\n他甚至公然宣称我们垄断了权力，擅自组建了自己的民兵，由于他们使用的是暗红色的全身制服，因此被称为“龙虾兵”。"
 rotermorgen.52.a:0 "把那个捣蛋鬼的脑袋给我送过来！"
 rotermorgen.52.b:0 "如果他能控制住自己的手下，我们就允许他参加选举"
 rotermorgen.60.t:0 "德意志联盟第一次大会准备就绪"
 rotermorgen.60.d:0 "我们为参加德意志联盟第一次代表大会的所有工会和具有相当规模的党派代表准备了会议场所。"
 rotermorgen.60.a:0 "我们真的做得不错，不是吗？"
 rotermorgen.61.t:0 "红衫军和宪兵发生冲突"
 rotermorgen.61.d:0 "37人死亡！日耳曼社会主义人民党与警察发生冲突！\n\n在所有的德国报纸上，日耳曼社会主义人民党对我们逮捕其领导人的失败尝试都太不友好，并且我国民兵规模庞大，战争时期武器流遍全国，因此不可能在没有更多流血的情况下结束战争。\n现在只有一条路可走，我们必须容忍和允许党轮流控诉每一个主动伤害或杀害警察的人。"
 rotermorgen.61.a:0 "能不能把这该死的大会搞定！？"
 rotermorgenmisc.5.t:0 "艺术之魂"
 rotermorgenmisc.5.d:0 "在我们最近举办的艺术大会上，一位相当知名的艺术家费利克斯·努斯鲍姆展示了他的许多艺术作品，其中最主要的一件作品让大多数评论家都感到惊讶。这幅名为《灵魂》的作品是一幅完全空白的白色画布，几乎所有的鉴赏家都称它为“达达主义的杰作”，并说“这是艺术应该有的范例”，但也有一些批评者称它“平淡无奇”、“没有灵魂”，然而，他们随后就被嘘声淹没了。\n之后，一些支持努斯鲍姆的艺术家甚至开始移除那些批评《灵魂》者的作品。"
 rotermorgenmisc.5.a:0 "这才是真正的艺术！"
 rotermorgenmisc.800.t:0 "德国人要求我国加入第三国际"
 rotermorgenmisc.800.d:0 "今天我们收到了来自德意志工团主义共和国的电报，邀请我们加入第三国际。\n这可能是让我国获得欧洲工团主义巨头保护的好机会。"
 rotermorgenmisc.800.a:0 "终于！"
 rotermorgenmisc.801.t:0 "德国人希望我们加入他们"
 rotermorgenmisc.801.d:0 "今天，我们收到了德意志工团主义共和国发来的电报，邀请我们加入他们的联盟。"
 rotermorgenmisc.801.a:0 "终于！"
 rotermorgenmisc.810.t:0 "战胜马克思"
 rotermorgenmisc.810.d:0 "在我们宣布战胜马克思的幽灵之后，日耳曼人历史上最大的叛徒所创作的所有作品都被集中起来烧毁了。根据官方法令，现在你哪怕只是以一种积极的立场提及马克思的名字，都将被视为一种可判处10年苦役的罪行。"
 rotermorgenmisc.810.a:0 "理应如此"
 rotermorgenGCW.2.t:0 "濒临崩溃的经济"
 rotermorgenGCW.2.d:0 "我们未能处理好“黑色星期一”带来的后果，德国企业正在纷纷破产。\n\n成千上万的工人被解雇，面临着没有希望的新现实。"
 rotermorgenGCW.2.a:0 "经济最终会自己恢复正常的！"
 rotermorgenGCW.3.t:0 "失业的群众涌上街头"
 rotermorgenGCW.3.d:0 "城市里到处都是寻找工作的乞丐和失业者，许多人卖掉了他们所有的东西，只为了养家糊口。"
 rotermorgenGCW.3.a:0 "也许我们应该做点什么……"
 rotermorgenGCW.4.t:0 "大规模暴乱"
 rotermorgenGCW.4.d:0 "从布尔什维克到温和社民党的各类著名左翼政客发表了演讲，呼吁进行剧烈变革，随后德国各地爆发了大规模暴乱。"
 rotermorgenGCW.4.a:0 "我的天哪，1918年的历史恐怕要重演了……"
 rotermorgenGCW.5.t:0 "公开叛乱"
 rotermorgenGCW.5.d:0 "这发生了……\n不可思议的事情发生了，我们正面临着一场来自莱茵河各类左翼分子和左翼民族主义者煽动起来的公开叛乱，这些人中有着来自北方的“日耳曼社会主义者”、“民族布尔什维主义者”、来自德国西部的社会主义者和布尔什维主义者，以及向德意志自由工人联合会和其他工团主义工会寻求帮助的失业德国人。\n\n现在，这些不太可能的盟友已经组成了统一战线和中央指挥部，这已经使我们以工人阶级为基础的士兵和水兵中的一半人选择支持他们的事业。我们面临着自拿破仑时代以来在德国领土上发生的最大规模的战争。更为卑鄙的是，法兰西公社已经抓住机会占领了阿尔萨斯-洛林。"
 rotermorgenGCW.5.a:0 "为了上帝和祖国！"
 rotermorgenGCW.5.b:0 "革命到来了！"
 rotermorgenGCW.10.t:0 "宣告胜利"
 rotermorgenGCW.10.d:0 "革命中央指挥部宣布彻底战胜帝国军队，并呼吁迅速恢复德国的秩序；他们已经和法国签署了一项条约，放弃对阿尔萨斯-洛林的所有主权，以换取第三国际的成员国资格。\n\n与此同时，冲突和意识形态上的不和问题再次浮现，革命内部也出现了新结成的联盟。\n革命的各意识形态领袖们已经开始组织自己的新政党，参加即将召开的第一次德意志代表大会。"
 rotermorgenGCW.10.a:0 "我们将大胆前行"
 rotermorgenGCW.20.t:0 "社民党地位稳固！"
 rotermorgenGCW.20.d:0 "卡尔·李卜克内西曾是1918年第一次社会主义起义的领袖之一，他呼吁社民党再次遵循他的指引，为德国的美好未来而努力奋斗。"
 rotermorgenGCW.20.a:0 "元老派重新登台"
 rotermorgenGCW.30.t:0 "大众冠军"
 rotermorgenGCW.30.d:0 "德意志自由工人联合会是德国最大的工人工会组织，它是工人阶级无可争议的拥护者，因此也时常被前帝国政府边缘化，德意志自由工人联合会最近试图改组为政党，但由于其高层成员的政治对立，内部出现了一些问题。"
 rotermorgenGCW.30.a:0 "仍是巨人"
 rotermorgenGCW.40.t:0 "工团马克思主义"
 rotermorgenGCW.40.d:0 "威权工团主义者的领导人恩斯特·台尔曼和布尔什维克领袖威廉·皮克一致认为，他们的意识形态信仰有着足够的共同点，可以建立统一战线，以对抗革命内部的自由派和民族主义者。他们号召所有追随者加入他们新成立的工团马克思主义政党：统一工团马克思党。\n\n这能否能够足以挑战那些巨无霸，仍旧是个问题。"
 rotermorgenGCW.40.a:0 "走着瞧"
 rotermorgenGCW.50.t:0 "连施博士的迷人魅力"
 rotermorgenGCW.50.d:0 "尽管此前许多人早已认为威廉·皮克组建的马列主义工人党对工团社会构成隐患，却无人预料到竟会出现一个能使其黯然失色的政治力量。\n前社会民主派支持者、革命保守主义的大德意志狂热分子——保尔·连施，他创造了一套自己的意识形态，称其为“日耳曼社会主义”，这与大多数人所说的“社会主义”相去甚远，同时，他狂热地支持泛日耳曼主义，又怀抱佯装革命的保守派立场，简直就像又一个俾斯麦。在皮克的马列主义工人党内巧妙地组织了民族主义强硬派的秘密基层组织。这些同情德意志统一与传统经济理念的民族主义者，连同少数德意志索雷尔派，被逐步纳入他所建立的日耳曼社会主义人民党这一准政党架构之中。"
 rotermorgenGCW.50.a:0 "真是另类"
 rotermorgenGCW.51.t:0 "黑羊"
 rotermorgenGCW.51.d:0 "革命阵营中大多数人视超越爱国主义的民族主义为一种痼疾。\n\n但并非全部。内战期间，约瑟夫·戈培尔这个莱茵兰本土出身的异类，早已将众多民族主义团体收归麾下。这个最初曾对马克思主义抱有同情的人物，如今发展出了被称为“民族马克思主义”的独特意识形态，尽管它与主流认知的马克思主义相去甚远，主张通过阶级合作建立部分国有化的社会企业经济来终结阶级斗争。但他更因炽烈的民族主义倾向，常被拿来与法国的瓦卢瓦、戴亚或布卡德之流相提并论，这是个憎恶诸多事物，却不可否认地深爱着德意志的矛盾体。\n\n今日，他宣布将率领新成立的德意志民族马克思主义人民党出席代表大会。"
 rotermorgenGCW.51.a:0 "给他的代表团最烂的位置……好吗？"
 rotermorgenGCW.60.t:0 "万事俱备"
 rotermorgenGCW.60.d:0 "我们为即将到来的大会做好了一切准备。住所，食物，会议室……应有尽有。大会将在几天后召开，届时各种议题都将提上日程。\n德意志的未来很快就要决定了。"
 rotermorgenGCW.60.a:0 "我们最好开始收拾行李！"
 rotermorgenGCW.70.t:0 "德意志联盟第一次大会"
 rotermorgenGCW.70.d:0 "革命政府要求召开第一届德意志联盟大会，允许拥有2万名以上成员的工会、政党或政治组织参与此次大会。\n\n领先的候选者有工团马克思党和德意志社会民主党（激进派），前者提倡实行一种深受马克思主义影响的工团主义，后者则是战前社民党的激进派别，提倡“社会主义民主”。\n但也有其他的党派参与着竞争。由于德国左翼政党的组建合法化，德意志自由工人联合会的影响力早已不如以往，但它仍有获胜可能。而由保罗·连施与约瑟夫·戈培尔领导的日耳曼社会主义人民党/德意志民族马克思主义人民党联盟则是另一大派别，该党宣扬的泛日耳曼民族主义，传统价值观在大会中显得过于另类，而不被其他政党所接受。"
 rotermorgenGCW.70.a:0 "日耳曼社会主义人民党胜利"
 rotermorgenGCW.70.b:0 "德意志统一工团马克思党胜利"
 rotermorgenGCW.70.c:0 "德意志自由工人联合会胜利"
 rotermorgenGCW.70.e:0 "德意志社会民主党激进派胜利"
 rotermorgenGCW.100.t:0 "援助公司？"
 rotermorgenGCW.100.d:0 "许多德国公司在黑色星期一受到重创，收入几近于无。而由于市场尚未完全恢复，他们几乎无法支付自身的日常开销，现在正艰难地生存着。\n也许我们应该投资这些公司以确保它们的生存。"
 rotermorgenGCW.100.a:0 "我们必须这么做"
 rotermorgenGCW.100.b:0 "……它们必须做出牺牲"
 rotermorgenGCW.101.t:0 "公共施膳处"
 rotermorgenGCW.101.d:0 "自最近黑色星期一后的失业浪潮以来，许多人都依靠着慈善项目和施膳处勉强度日，教会和红十字会目前也无力喂饱如此多的无业游民，他们已经向所有有能力捐钱或捐赠食物的人发起了求助。也许我们也应该向施膳处提供物资，并开设国营赈济所，以便为大众提供食物。"
 rotermorgenGCW.101.a:0 "勒紧裤腰带！"
 rotermorgenGCW.101.b:0 "我们不能让人民挨饿！"
 rotermorgenGCW.102.t:0 "解救银行业？"
 rotermorgenGCW.102.d:0 "几位银行家找到了政府，向我们交了底，如果没有援助，他们也撑不了多久，在黑色星期一期间，他们许多股份形式的资产已经贬值到一文不值。对经济来说最大的问题是，随着银行的崩溃，几乎所有银行持多数股份的公司也将可能随之倒闭。"
 rotermorgenGCW.102.a:0 "我也骗了我奶奶几便士呢，回答是不！"
 rotermorgenGCW.102.b:0 "我们当然会帮助他们"
 rotermorgenGCW.103.t:0 "银行业开始崩溃"
 rotermorgenGCW.103.d:0 "银行面临的危险似乎比我们想象的还要大，它们的崩溃现在几乎难以避免。"
 rotermorgenGCW.103.a:0 "上帝啊！我们必须立即介入！"
 rotermorgenGCW.103.b:0 "皇帝陛下还是拒绝了"
 rotermorgenGCW.104.t:0 "征用财产"
 rotermorgenGCW.104.d:0 "对于像疾病一样向我们袭来的大规模贫困，一个解决方案是征用富有精英的财富来养活大众……\n这个想法显然不受大多数政府成员的欢迎，但这可能是我们避免彻底混乱的最后办法。"
 rotermorgenGCW.104.a:0 "扯淡！我们可不是工团分子"
 rotermorgenGCW.104.b:0 "有时，多数人的需求是第一位的"
 rotermorgenGCW.106.t:0 "回归常态"
 rotermorgenGCW.106.d:0 "似乎一切都在慢慢恢复正常，也许我们最近的经济干预和福利项目刚刚避免了另一场危机。"
 rotermorgenGCW.106.a:0 "谁知道呢？"
 rotermorgenGCW.7.t:0 "一艘正在下沉的船"
 rotermorgenGCW.7.d:0 "如果你在今天目睹德国大城市的街道，你不会看到体现了德国财富与胜利的生机盎然的街道。你看到的只有失业的男人，街上无所事事的孩子们，一个个泪流满面的家庭，他们又过了一个没有温暖和食物的日子。如果你去欣赏德国田园诗般的乡村风光，迎接你的不会是它富饶的农场，以及在那里辛勤劳作的一代代自豪的农民。相反，你会看到被取消抵押品赎回权的农民，只能维持生活必需品所需的家庭，和骑着马或乘坐公共交通工具去市中心寻找工作的农民，许多人暗自垂泪，因为他们的祖先曾辛勤耕耘过的农场已不复存在。然而，德意志帝国政府却没有采取任何措施来减轻他们的痛苦。政府太过关心自己帝国的混乱而没有帮助普通的德国人。对于许多德国人来说，他们终于摆脱了黑色星期一的阴霾，因为他们终于明白，德意志帝国并不关心他们和他们的家庭。这种怨恨是不可想象的，因为曾经憎恨赤匪的人们现在加入了众多赤匪团体中的一个。如果帝国政府不尽快做出回应，这种怨恨将蔓延到何种程度是无从知晓的。"
 rotermorgenGCW.7.a:0 "随着黎明的到来，红色曙光也将接近"
 rotermorgenGCW.8.t:0 "统一战线"
 rotermorgenGCW.8.d:0 "当德意志帝国无力应对“黑色星期一”时，德国境内的各种左翼组织无疑利用了帝国政府的无能。在得到了期盼已久的第三国际秘密支持后，德国国内的三大社会主义组织每天都吸纳着数万人加入他们的队伍。虽然这些组织有着截然不同的理想，但他们所获得的支持使他们更紧密地团结在了一起，共同对抗腐败和专制的德皇及其拥趸。暂且抱持着同一目标，社民党激进派、红军旅、德意志自由工人联合会、民族马克思主义战斗团和民族社会主义阵线成立了一个统一战线，以更好地协调合作。这一惊人的事态发展表明了社会主义者对德国秩序的威胁。即使在政府中也有传言称：如果统一战线继续获得支持，可能会出现公开的叛乱。即便帝国能从黑色星期一的泥潭中脱身而出，它也将面临来自新统一战线的重大挑战。"
 rotermorgenGCW.8.a:0 "随着红色曙光的到来，社会主义的光芒将照进更多的家庭"
 rotermorgenGCW.9.t:0 "万物崩解"
 rotermorgenGCW.9.d:0 "德皇政府的消极态度只会让德国国内的情况更加糟糕。随着统一战线队伍的日渐壮大，他们也开始变得更具对抗性。罢工和抗议在莱茵地区变成了常事，那里的工人和仓促成立的工会已经停止了一切生产。巴伐利亚的前士兵和农民大肆破坏着政府财产和贵族住宅，以发泄他们对政府失职的愤怒。在柏林，每天的抗议活动都有可能变成暴乱，警察正在努力控制愤怒的市民。然而，麻烦并没有就此结束。全国各地新成立的准军事组织信息暗示着赤色分子正在准备更大规模的行动。总参谋部里甚至开始流传着这样的传言：如果社会主义者决定对德皇采取行动，可能会有相当一批同情他们的不忠分子。德国革命，这个曾经很少被人提及的词汇，现在已经成为了一个严重的问题。"
 rotermorgenGCW.9.a:0 "革命即将到来"
 rotermorgenmisc.8.t:0 "爱国联盟的成立"
 rotermorgenmisc.8.d:0 "根据人民总理保罗·连施最近颁布的法令，全国所有的工会都将合并为一个属于全德工人的全国工会。新成立的爱国联盟有望精简并整合所有工会官僚机构，以提高效率并节省运营多个工会所需的成本。它也有一个政治目的，因为一个中央集权的工会将减少有组织的工人对政权的威胁。预计爱国联盟还将推行几项经济举措，为德国国内工人的休闲和繁荣带来更多机会。"
 rotermorgenmisc.8.a:0 "符合德意志情况的秩序工会主义！"
 rotermorgenmisc.9.t:0 "钢马汽车的成立"
 rotermorgenmisc.9.d:0 "由于最近有针对性地为德国的国有化汽车工厂提供资金的努力，日耳曼社会主义人民党现在已经产出了一种德国人民能够买得起的汽车。它被称为“钢马”，与德皇统治时期市场上的汽车相比，它要便宜得多，而且在质量和效率方面几乎没有缩水。通过给德国人民提供负担得起的汽车，我们预计将在减少通勤时间的同时减轻公共交通的压力。除了交通效率明显提高之外，这款汽车现在还将给德国家庭更多的动力，让他们在德国各地旅行，无论是去休闲还是度假。随着国有汽车厂的第一辆汽车从生产线上驶下，钢马汽车预计将在年底前在大多数主要城市中心普及。"
 rotermorgenmisc.9.a:0 "现代的贵族载具！"
 rotermorgenmisc.10.t:0 "人民通信"
 rotermorgenmisc.10.d:0 "在整个德国，许多家庭都得到了免费的收音机，或者以大幅降低的国家标价购买了收音机。这款名为“人民先驱”的新型收音机，有望将广播的娱乐和精髓带到每个德国人的家中。从宇宙电影公司的广播节目到最新的音乐，甚至从最新的国家新闻到人民首相本人的讲话，这台新收音机有望鼓舞全国普通德国家庭的士气。它还是一种灌输手段，电台只会播放国家规定的节目，这或许能够帮助日耳曼社会主义人民党将自己的思想潜移默化地传播到德国人家的潜意识之中。"
 rotermorgenmisc.10.a:0 "起居室内的城市广场之乐！"
 rotermorgenmisc.11.t:0 "开发“先知”"
 rotermorgenmisc.11.d:0 "在为数不多的几家德国电子工厂和实验室里，日耳曼社会主义人民党正在特别关注和资助一项全新的家庭娱乐的发明。党的领导和研发实验室的人员将这种新设备命名为“先知”，它使用电缆传输和无线电信号将图像和音频一起投射到屏幕上。虽然目前的产品仍处于早期阶段，并且生产成本很高，但它并没有阻止党的高层领导在自己家里安装这种可视收音机。目前，先知只有两个频道，一个是新闻频道，一个是娱乐频道，主要是在宇宙电影公司的各个演播室进行现场音乐表演。更不用说，由于没有足够的民用电信基础设施的支持，人民电视也很难获得像样的信号。尽管最初的几款型号存在一些缺陷，但日耳曼社会主义人民党相信，有了更多的资金和关注，先知甚至也有可能在某一天取代收音机。"
 rotermorgenmisc.11.a:0 "超越凡人视野的惊世一瞥"
 rotermorgenmisc.17.t:0 "为爱而感到恐惧"
 rotermorgenmisc.17.d:0 "在汉堡市矗立着一座高耸的皮克总书记雕像，而雕像后面有一栋建筑，是这座城市的秘密警察总部。这支秘密部队的成员每天都会追踪革命的敌人，并监视城市的市民，以确保他们未曾反对过皮克或党。如果他们察觉到任何异动，无论是反革命还是纯粹的非法行为，这个犯事的人也多半别想指望看见明天的太阳了。到了晚上，当工人们回到自己的公寓，街上空无一人的时候，秘密警察就会行动起来。他们将闯入罪犯和革命公敌的家中，把他们和家属从家中拖出来。少数勇敢的反抗者要么被直接就地枪决，要么会被枪托击昏，而剩下的人则被装上卡车，送往天知道在哪儿的设施。当警察带走与他们有所牵连的朋友和同事时，邻居们也只能听到他们在晚上发出的喊叫和哀号。这些声音提醒着人们，为什么他们应该忠于皮克和革命，为什么他们永远不该忘记这一切。"
 rotermorgenmisc.17.a:0 "为了德意志的利益，皮克，还有革命……"
 rotermorgenmisc.18.t:0 "新共产主义式建筑"
 rotermorgenmisc.18.d:0 "为了使德国社会社会主义化，扫除旧的反动建筑方式，总书记皮克颁布了一项法令，宣布所有的新建筑都必须按照一定的风格设计。该建筑的风格主要表现为方形极简主义风格，并主要使用混凝土和砖作为主要材料，以创造现代和均衡的建筑外观。这种被称为“野兽主义”的新风格有望给德国的建筑带来革命性的变化，并提醒人们德国社会主义的未来，以及未来对反动的过去的优越性。这种风格很快被德国大学的课程所采用，因此新一代的建筑师和城市规划者将会习惯并为这种独特的社会主义建筑风格感到自豪。"
 rotermorgenmisc.18.a:0 "如果你问我的话，我会说这是一种相当沉闷和丑陋的风格"
 rotermorgenmisc.19.t:0 "私设法庭和摆样子公审"
 rotermorgenmisc.19.d:0 "德国新任总书记一上台，就开始毫不犹豫地清除他的敌人。不过只有野蛮人或反动派才会在扣动扳机前把枪口对准敌人的脑袋，皮克并不像他们那样残忍，他会让自己的敌人享受到同伴公正审判的奢侈。当然，当台尔曼和他的其他同事看到这些由他们的同行进行的“公平”审判充斥着秘密军事法庭捏造的证据，被告也没有辩护律师时，他们肯定会翻白眼，但一个国家之敌知道什么呢？皮克所知道的是，内战期间的叛国罪和各种反人类罪的指控足以让法官在每次审判不超过两个小时的时间里得出结论。每一次，几乎所有人都一致被判死刑。在某些情况下，被告被拖到外面，以便让下一个被审判的可怜人被送上断头台。鲜血于此绽放，一旦木槌敲响。"
 rotermorgenmisc.19.a:0 "嗨呀，至少他们能得到一个快速的审判。"
 rotermorgenmisc.21.t:0 "新教育"
 rotermorgenmisc.21.d:0 "说到教育德国的孩子，这是一件极其重要的事情。德意志自由工人联合会很理解这一观点，因为早期教育可以更好地为孩子成年后的生活做好准备，或者它可以被用作操纵下一代的工具。不管怎样，工会议会正在协调努力，以从课程到设施，全面改革教育。尽管无政府工团主义课程的具体内容可能因德国地区的不同而有所不同，但人们普遍同意，儿童将接受关于其社会思想的教育。主要的内容包括强调公平和所有同龄人之间的合作，教授学生过去反动的、资本主义的、帝国主义的德国固有的错误，以及无政府工团制度的内部运作方式和它的理想。一些家庭声称，新课程完全只偏重思想上的教育，并没有使下一代做好实际工作的准备。在一些城镇，明显缺少像微积分和物理这样的学科课程，而围绕社会主义政治理论和艺术的学科在学校里获得了更多的优先地位。德意志自由工人联合会通过强调如何在反动分子毒害下一代之前，首先在教育中确保无政府主义的未来，来解决这些人们的担忧。"
 rotermorgenmisc.21.a:0 "记住马克思和克鲁泡特金与成为工程师或工厂工人有什么关系？"
 rotermorgenmisc.22.t:0 "爱满园"
 rotermorgenmisc.22.d:0 "德国国内长期存在的保守主义氛围一直持续到德皇下台，在德皇时期，德国的同性恋者接受了最严厉的惩罚。同性恋行为会遭到严厉的监禁和劳役，甚至在某些情况下，其中一些人会被送进精神病院接受电击治疗，在一些高调的同性恋者中，他们会接受实验性的脑叶切除术治疗。德意志自由工人联合会认为这种对待男女同性恋者的方式是极其野蛮和落后的，这就是为什么当他们将同性恋合法化并制定相关法律保护他们时，任何人都没有感到太奇怪。根据新法律，同性恋者将在各级政府、就业和军事服务中享有平等的机会，任何对他们的制度性歧视或仇恨犯罪都将受到法律惩罚。这些新法律中最具争议的方面是对德国为数不多的变性群体的保护，即使是联合会的成员也认为这有点过头了，因为这可能会加大对这些新法律已经十分激烈的反动派抵抗。然而，尽管新法律面对着这些挑战，许多联合会成员和进步人士认为这是在正道上迈出的一步。"
 rotermorgenmisc.22.a:0 "为了平等和进步"
 rotermorgenmisc.23.t:0 "工人阶级的先锋队"
 rotermorgenmisc.23.d:0 "民兵无疑是工团主义革命的支柱。当人们回顾法国、英国和意大利的革命时，你永远不会看到军队推翻反动派的统治。能够把资本家和暴君赶出革命的，唯有群众的意志和力量。德意志自由工人联合会完全理解这一原则，因此他们在工会议会上一致决定正式宣布红色民兵为革命的军事先锋。这一声明坚定地将民兵视为德国的主要军事力量，并成为最受信任的机构，以维护工会与议会自身代表的革命。虽然有些人可能会担心，一群非正式的周末战士不能承担维持秩序和作为保卫德国的骨干力量的责任，但当革命捍卫者最终获得应有的重要性和认可时，德意志自由工人联合会的成员和相当多的德国人对这一发展都感到欣喜若狂。"
 rotermorgenmisc.23.a:0 "社会主义的火焰将由工人来保护"
 rotermorgenmisc.24.t:0 "所有人的平等"
 rotermorgenmisc.24.d:0 "在德国，有一种古老而毁灭性的观念，认为德国是为德国人准备的。然而，有争议的是，德国从来就不是纯粹的德国。如果是的话，它又如何解释在德国生活了数百年的犹太人、波兰人、捷克人、荷兰人、比利时人和法国人的数量？更不用说那些为了工作而来到大陆的殖民地原住民，不管他们是黑人、东南亚人还是中国人。继续压制这些少数群体将是德国历史和人民的耻辱，这就是为什么在最近的一次德意志自由工人联合会工会会议上，人们一致认为应该采取更多行动，确保这些群体得到平等对待。除了针对他们的反歧视法之外，工会和公社每年都将为少数群体制定就业配额，以确保他们获得更好的就业机会。如未能达到配额，可能导致对这样做的工会和公社的潜在罚款和处罚。这也许是迄今为止德意志自由工人联合会采取的最具争议性的行动，因为它第一次因此收到了相当数量的工会反对票。尽管这些改革具有激进的性质，但历史也许会表明，这些改革对于实现所有德国居民的平等和进步是必要的。"
 rotermorgenmisc.24.a:0 "重疾还需猛药医"
 rotermorgenmisc.25.t:0 "史塔西的组建"
 rotermorgenmisc.25.d:0 "自德国革命胜利以来，德意志统一工团马克思党在很大程度上依靠德国各地的各种民兵维持法律和秩序，有时还执行一些更为秘密的不光彩的任务。由于这些民兵的能力参差不齐，人民议会在闭门会议期间签署了建立一支集中和秘密警察部队的决定。这个新的中央警察机构被命名为史塔西，它只会直接服从人民议会的意愿，而为了德国和革命的需要，他们也可以全权管理他们认为合适的行动。议会投票选举民兵领袖和长期效忠的恩斯特·沃尔韦伯为史塔西的第一任首脑。自从史塔西成立以来，已经有各种各样的德国公民被证实失踪，一些未失踪的声音更大的反对党成员也变得奇怪的沉默。许多人很快就意识到史塔西的存在，由此产生的恐惧和偏执已经足以让反动派愿意与政府保持一致——甚至变得对革命非常忠诚。"
 rotermorgenmisc.25.a:0 "屈服来自恐惧"
 rotermorgenmisc.26.t:0 "血红之地"
 rotermorgenmisc.26.d:0 "德国东部的田野以许多东西而闻名。人们首先想到的可能是他们美丽的土地、丰饶的农业收成和坚韧的人民，但现在他们的土地却以一种更加邪恶的东西而闻名。自从台尔曼的思想产物——文化大革命被人民议院宣布开始后，史塔西和更臭名昭著的赤卫队一直将那些被指控犯有叛国罪和严重反革命活动的人带到这些地方处死。方法往往因实施的人不同而有所不同；史塔西更喜欢一种叫做“沙丁鱼包装法”的方法，即让反动派躺在深沟里，然后射杀，而另一排反动派则躺在他们的尸体上再重复这个过程，而一些赤卫队则更喜欢用机装枪扫射成排的反动派，然后把他们的尸体堆起来，再浇上汽油点燃。甚至有谣言流传，在红色战士联盟中有个名为拉狄克的民兵对被处决的人进行了各种残忍的行为，有人说有些人像动物一样被猎杀或被车辆拖走，甚至提到了强奸和使用反动派作为射击练习的目标。晚上，一些附近公社的农民可以听到不远处指定杀戮区传来的尖叫声和枪声，死亡、火药和汽油说带来的恶臭显然非常强烈，可以弥漫数公里。"
 rotermorgenmisc.26.a:0 "死了的反动派才是好反动派"
 rotermorgenmisc.27.t:0 "笑到最后"
 rotermorgenmisc.27.d:0 "台尔曼与人民议院一直都知道这一天迟早会到来，他们现在也很高兴这么做。自从德意志统一工团马克思党执政以来，皮克和他的共产主义派系一直是他们的眼中钉，他们总是抵制台尔曼采取的任何行动，无论是合法合理的意识形态分歧还只是琐碎的争吵。不管他们可能会面临怎样的挑战，皮克的派系已经被削弱到可以从整个政治舞台上中消失的程度。人民议院因此对皮克和他集团的高层发出了逮捕令，以便他们能被公开审判。国际观察员指出，对他们的审判相当公平，因为被告有律师依法为其辩护，他们也有进行自我辩护的时间。然而，这并没有改变一个事实，即主审陪审团完全是由德意志统一工团马克思党官员或低级民兵成员组成的，也没有改变一些证据和证人证词是部分或完全捏造出来以符合对他们的指控的事实。最后，皮克和他的核心集团及副手们被判犯有多项罪名，他们都被撤销了党员资格，并被剥夺了任何荣誉和头衔，被禁止再次担任要职或政治职务。法院甚至对皮克和其他一些人实行无限期软禁。他们曾经是整个德国最令人头痛的问题，但如今已沦为历史上一个无关紧要的脚注，被历史之风吹散。"
 rotermorgenmisc.27.a:0 "革命之敌定将被绳之以法"
 rotermorgenmisc.28.t:0 "女性选举权"
 rotermorgenmisc.28.d:0 "众所周知，德国在德皇时期就因其对妇女的保守态度而臭名昭著。即使是在美国和俄罗斯等民主国家赋予妇女投票权时，德国也不知出于什么原因，仍旧态度暧昧。社民党意识到了该决定的落后性，这也是为什么党的领导层上台后，几乎在第一时间就追求赋予妇女投票权。到今天为止，社民党已经实现了这一目标。现在，所有年满21岁的德国公民都拥有选举权。赋予妇女选举权的决定被德国社会的大多数人士视为朝正确方向迈出的一步，使得社民党的支持率在一夜之间持续走高。"
 rotermorgenmisc.28.a:0 "迈向正道"
 annex.157.k:0 "建立忠诚的索雷尔主义傀儡政权！"
 annex.159.k:0 "建立忠诚的准则主义傀儡政权！"
 annex.73.k:0 "建立忠诚的国家工团主义傀儡政权！"
 annex.12.k:0 "建立忠诚的民族社会主义匈牙利！"
 rotermorgenmisc.30.t:0 "一切归于主席"
 rotermorgenmisc.30.d:0 "终于，他做到了。经过了数周甚至数月的谋划、周旋和暗算，他终于成功了。现在，皮克立于德国的权力之巅，以德国和革命最高主席的身份宣告着，他才是德国革命无可争议的领袖。当然，他的反对者们会大喊大叫，说他是一个背叛革命的修正主义煽动家，但对皮克来说，这些底层人的意见并不重要。尽管现在他的支持者为他的宣言组织了即兴庆祝活动，但为了确保德国和革命的未来，仍有许多工作要去完成。不过现在，由于摆脱了“民主”这块变幻无常的绊脚石，这一艰巨的任务将变得容易许多。"
 rotermorgenmisc.30.a:0 "新无产阶级专政"
 rotermorgenmisc.31.t:0 "暗红宪法第一部分"
 rotermorgenmisc.31.d:0 "从序言开始，宪法便承诺其将坚定捍卫工人阶级、平等与革命。序言后是公民的基本权利部分。它保证无论其性别、种族或信仰，每个公民都将得到法律平等的保护。除此之外，宪法中还有承认私人财产的条款，但一个人所能拥有的财富与财产的数量有其上限，超过这一上限便将被视作资产阶级，并将受到相应的处理。最终，一旦革命发展到相应阶段，私有制制度将被逐步淘汰，亦将完全被公有制所取代。\n\n接下来，宪法就工作场所进行了讨论，宪法保证各工会将被国有化，并被重组为由国家管理、更为高效的管理机构，以确保工作场所的管理系统更为精简、生产更为高效。\n\n而后，就是德国境内的民兵与军队问题，宪法规定一切民兵组织与军队成员必须宣誓效忠革命、工人和最高主席。各民兵组织将被国家改组为赤卫队，其余的民兵组织将被解散，除此以外，还有一项条款规定赤卫队将成为德国的“革命先锋”，任何独立于官方的民兵组织在实际上都无法组成。然后是宗教问题，宪法规定德国是一个世俗国家，并且任何有组织的宗教组织在本质上都是反动派。"
 rotermorgenmisc.31.a:0 "乍看简单易懂"
 rotermorgenmisc.32.t:0 "暗红宪法第二部分"
 rotermorgenmisc.32.d:0 "在宪法第一部分后，便是政府结构的部分。首先是最高行政职位的确立，其官方头衔是党和国家的最高主席。最高主席掌握着德国的最高权力，副主席则是他的副手。最高主席将能够选择内阁官员领导德国的各个部门和机构，而在理论上，政治局则会作为与最高主席分享权力的权力机构而存在。接下来是建立一个新的一院制立法机构，名为人民议院。人民议院将由来自德国各指定行政区域内的民主选举出的官员组成，并代表他们的选民。虽然在理论上，人民议院作为德国立法机构，是整个德国的代表，并与最高主席和政治局分享权力，但它实际上只是一个没有实权的橡皮图章机构。人民议院的首脑将担任议院主席，每五年通过法定选举产生。议院副主席将担任主席的第二副手，与德意志马列主义党最高立法委员共同担任副主席的指定继任者。这就是党领导下的政治生态。只有德意志马列主义党党员才能够担任公职。德意志社会民主党、德意志自由工人联合会、德意志统一工团党和日耳曼社会主义人民党的成员不允许竞选任何类型的政治职位，并且由于其存在对革命和政府构成了威胁，他们不得继续维持合法运作状态。该条款还有效地阻碍了在未来组建任何反对党的尝试，并成功地使德意志统一工团马克思党中的布尔什维克派成为德国境内唯一允许合法运作的政党。最后是司法制度，由政府指定法官的人民法院负责解决纠纷和违法犯罪行为。每个公民都有权得到律师辩护和由同事组成的陪审团。但若是犯下了叛国罪，以上权利便视作失效。"
 rotermorgenmisc.32.a:0 "规矩真多"
 rotermorgenmisc.33.t:0 "收尾"
 rotermorgenmisc.33.d:0 "在花了整整一个月的时间制定宪法条款之后，所有代表都在宪法上签了字，而皮克是第一个签字的人。德国各地立即举行了人民议院的临时选举，各国家部门也正式成立。从现在开始，德国各地的反对党人士面临着赤卫队的大规模镇压，这也正式地粉碎了德国境内所有的官方反对派。世界各地的共产主义和布尔什维克国家与组织向新德国发出了贺信，祝贺它在没有发生大规模流血事件的情况下巩固了其中央集权和革命制度。然而，一些人指出，宪法似乎有一些漏洞，可能被执政党利用。台尔曼和他的派系仍然对宪法感到愤怒，称皮克是一个穿着革命外衣的反动分子，称他只是在努力实现自己的政治野心，而非工人阶级的目标。至于皮克的角色，许多人毫不怀疑皮克将继续站在新德国的巅峰。无论如何，在一场新的革命中，德国和全世界的工人离真正的自由又近了一步。"
 rotermorgenmisc.33.a:0 "永为革命砥砺前行！"
 rotermorgenmisc.34.t:0 "亮红宪法第一部分"
 rotermorgenmisc.34.d:0 "从序言开始，宪法便承诺其将坚定捍卫工人阶级、平等与革命。序言后是公民的基本权利部分。它保证无论其性别、种族或信仰，每个公民都将得到法律平等的保护。除此之外，宪法中还有承认私人财产的条款，但一个人所能拥有的财富与财产的数量有其上限，超过这一上限便将被视作资产阶级，并将受到相应的处理。最终，一旦革命发展到相应阶段，私有制制度将被逐步淘汰，亦将完全被公有制所取代。接下来，宪法就工作场所进行了讨论，宪法保证工会将直接控制工作场所，并以此为基础实现工人民主。而后，就是德国境内的民兵与军队问题，宪法规定一切民兵组织与军队成员必须宣誓效忠革命、工人和民主制度。各民兵组织仅需在德国人民军注册在案便可以合法地组建并武装起来，但一切违反宪法或进行反革命活动的民兵组织都将被立即解散。然后是宗教问题，宪法规定德国是一个世俗国家，并且任何有组织的宗教组织在本质上都是反动派。"
 rotermorgenmisc.34.a:0 "乍看简单易懂"
 rotermorgenmisc.35.t:0 "亮红宪法第二部分"
 rotermorgenmisc.35.d:0 "在宪法第一部分后，便是政府结构的部分。首先是立法机构的设立，它将作为德国最重要的管理机构存在。新的一院制机构被称为人民议院，人民议院将由来自德国各指定行政区域内的民主选举出的官员组成，以代表并执行现行宪法。虽然在理论上，行政权力属于立法机构，但事实上的政府首脑由每五年通过法定投票选举产生的议院主席担任。除此之外，各部门部长将担任议院主席的内阁成员，而议院主席的就任与任命需要得到议院中多数票的确认。议院副主席将担任主席的副手，而德意志统一工团马克思党的最高立法委员将担任副主席的指定继任者。紧接着的就是各反对党问题。只有在根据德意志统一工团马克思党的指导方针、并进行适当重组的情况下，德意志社会民主党、德意志自由工人联合会、德意志统一工团马克思党-布尔什维克派和日耳曼社会主义人民党才能被允许继续其政治活动并在议院中拥有代表席位。他们所能拥有的席位数量也将被限制，所有反对党不能在一届任期内拥有总共超过25%的议院席位。而在各反对党成员竞选任何职位前，他们必须在得到内政部的批准。最后是司法制度，由民主选举产生的人民法院负责解决纠纷和违法犯罪行为。每个公民都有权得到律师辩护和由同事组成的陪审团。但若是犯下了叛国罪，以上权利便视作失效。"
 rotermorgenmisc.35.a:0 "规矩真多"
 rotermorgenmisc.36.t:0 "收尾"
 rotermorgenmisc.36.d:0 "在花了整整一个月的时间制定宪法条款之后，所有代表都在宪法上签了字，而台尔曼是第一个签字的人。德国各地立即举行了人民议院的临时选举，各国家部门也正式成立。在野党被正式重组，并在遵循相应的指导方针的前提下竞选公职，在德国，执政党正式击败了反对派。在世界各地，各工团主义组织和国家向新德国发出贺信，祝贺它在没有发生大规模流血事件的情况下巩固了民主和革命制度。然而，一些人指出，宪法似乎有一些漏洞，可能被执政党利用。皮克和他的派系仍然对宪法感到愤怒，称台尔曼是个虚伪的暴君，称他只是在努力实现自己的政治野心，而非工人阶级的目标。至于台尔曼的角色，很多人都想知道他会不会成为第一任议院主席，或者他会不会把革命火炬交给一个新人，自己退居次位。无论如何，德国工人现在离真正的自由又近了一步。"
 rotermorgenmisc.36.a:0 "为了工人阶级与革命！"
 rotermorgenmisc.38.t:0 "革命医生"
 rotermorgenmisc.38.d:0 "每个人都明白医生有多重要。他们保证人们的健康与身体机能，并确保我们为人民和革命服务的目的保持健康的身躯。唯一的问题是，大多数医生都来自中产阶级，出身特权阶层，生活作风奢侈，因此让他们为人民大众与革命服务可谓难事一桩。倘若我们希望革命得以延续，那么这种情况就不能继续下去。因此，在文化革命时期，人民议院发出了“革命医生”的倡议。这个新项目将挑选工厂工人和农民送往相关教育机构，学习现代医学的奇迹，并培养他们成为新德国的医生。至于那些曾经的资产阶级医生，他们中有少数人被选中来教导这个项目的成员，以表明自己在政治和社会上改过自新，而其余的人将被送往再教育营或劳改营。虽然有些人可能怀疑这些新医生的质量，因为一些报道称他们给病人的药物剂量错误，甚至在手术过程中把手术工具掉在病人身上。但许多人都乐观地认为，随着时间的推移，这些医生将与从前的资产阶级医生旗鼓相当，甚至更胜一筹。"
 rotermorgenmisc.38.a:0 "我希望他们至少能分清泰诺和氰化物的区别"
 rotermorgenmisc.39.t:0 "新德意志电影院"
 rotermorgenmisc.39.d:0 "在革命将德国从皇帝手中解放出来后，德国电影业并不特别受人重视。尽管人们认为德国电影业在制作大片和前卫派电影方面与好莱坞不相上下，但德国最近发生的暴力冲突使任何电影制作都完全终止了下来。制片厂被摧毁，电影业人才要么死于非命要么流亡海外，德国娱乐和文化的一个重要部分遭受了重大损失。无论如何，日耳曼社会主义人民党希望通过对宇宙电影公司的国有化和大规模合并来改变这一切。这次新的国有化行动将使宇宙电影公司获得大量的国家资金来重建德国电影产业，同时将所有其他的非独立的德国电影公司合并入其中。宇宙电影公司的总部设在柏林城外的巴伯尔斯贝格，日耳曼社会主义人民党希望通过这一举措将被破坏的电影工业重新打造回能与好莱坞媲美的规模，同时在国际水平上展示新的德国艺术和价值观。此时此刻，宇宙电影公司有多个电影项目正在拍摄中，预计明年就会发布。除此之外，该公司还正在与友好国家达成协议，使他们的电影能够在那些国家和德国同步上映，来自世界各地有抱负的男女演员被鼓励来到德国，试图在一部作品中获得一个角色，公司导演和国家制片人不断与世界各国谈判，以确保得到具有异国情调的拍摄地点。"
 rotermorgenmisc.39.a:0 "在银幕上放映新德国的时刻已经到来"
 rotermorgenmisc.860.t:0 "难忘的聚会"
 rotermorgenmisc.860.d:0 "德国政界、工业界的精英和有头有脸的人物都来到克虏伯庄园参加盛大的宴会和宴会，工业界的太太们在和演员们调情，有钱的老男人盯着女服务员，大把的香槟喷洒了出来。\n但这不是克虏伯本人和他那一小撮顶级工业集团盟友所享受的，在聚会开始后，他们安静地退进了会议室，他们即将讨论一项酝酿了数月的计划，并最终一劳永逸地统治德国，摆脱社民党强加给他们的社会国家的所有残余。完整的计划内容将包括成立世界工业委员会，这是一个由最有影响力的工业团体组成的委员会……更确切地说，是现在在场参加会议的人。它还将包括正式解散德国自由党，解散国会，将委员会作为紧急立法机构，并事实上建立一个由克虏伯集团和他的帮派独裁统治的国家。\n但并不是所有与会人员都对此有信心，他们呼吁采取不那么激烈的措施来确保他们通过德国自由党表达自身利益。"
 rotermorgenmisc.860.a:0 "取消计划！"
 rotermorgenmisc.860.b:0 "做出妥协"
 rotermorgenmisc.860.c:0 "民主的终结"
 rotermorgenIV.2.t:0 "至暗时刻"
 rotermorgenIV.2.d:0 "作为面对战争的失败，又因为现在被至少一半的德国人所憎恨，并且目睹着他的国家正在毁灭的德国皇帝，威廉二世今天在他的私人房间自杀了。为了避免任何谣言的传播，政府已向公众宣布他年老而死。"
 rotermorgenIV.2.a:0 "灭亡的前兆"
 rotermorgenIV.3.t:0 "德意志，梦的破灭"
 rotermorgenIV.3.d:0 "威廉三世的加冕，使得德国第三次爆发了内乱，因为在被认为由威廉二世政府引起的灾难性的内战后，许多德国民众带着恨意希望终结君主制度。\n\n在残余的大部分帝国军队跟随威廉三世撤退回普鲁士的同时，德国剩下的各个地区已经宣布独立，其中有一部分甚至宣称要继承帝国的大统……德意志之梦最终破灭了。"
 rotermorgenIV.3.a:0 "撤退到普鲁士！"
 rotermorgenIV.3.b:0 "巴伐利亚的鲁普雷希特万岁！"
 rotermorgenIV.3.c:0 "莱茵地区的民主！"
 rotermorgenIV.3.e:0 "革命的火炬仍在北方燃烧！"
