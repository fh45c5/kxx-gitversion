 GRU_Volkswagen:0 "钢马"
 GRU_Volksempfaenger_desc:0 "人民通信是德国工人能负担得起的标准化收音机。"
 GRU_Volksempfaenger_two_desc:0 "人民通信已经取得巨大成功，爱国联盟进一步推出新的国家项目，即“先知”，一种价格低廉的标准化电视机。"
 GRU_Volkswagen_desc:0 "钢马是由爱国联盟牵头推出的坚固全能车，适用于各种路面，旨在为愿意出钱享受一些奢侈的民众提供廉价汽车。"
