 GRU_SMEPD_greater_germ:0 "迈向人民帝国的进军"
 GRU_SMEPD_greater_germ_desc:0 "我国的意志如今能投向全球各地，日耳曼人民现在完全统一在独一无二的人民帝国之下，是时候把流离失所的兄弟们团结起来了。从阿尔卑斯山脉到北海，所有的德意志人民都在呼吁团结，我们终于能够做到了——德意志人将不再被背信弃义的边界分隔开，而是团结统一！"
 POLITICS_PAUL_LENSCH_DESC:0 "保罗·连施在他那特立独行的生涯中有过无数别名，但没有谁能否认他的决心和狂热。\n\n连施出生于1873年，也就是德意志社会民主党成立10年后，他年轻时入党，尽管他的同志们注意到他强烈的民族主义情绪和有时古怪的思想，但他对党的忠诚无可动摇。在繁忙的编辑和记者工作之外，连施抽出时间沉浸在了柏林国家图书馆的书籍中，拜读了《普鲁士精神与社会主义》等奥斯瓦尔德·斯宾格勒的著作，领略了伟大的铁血宰相俾斯麦和士兵国王腓特烈·威廉一世的成就，并从中顿悟：或许上述几者的社会政策是一种更棒的社会主义形式，一种比他的同志们崇拜的马克思更纯粹、更强大、更德国风格的社会主义。他开始试图将这些想法传播给他热爱的兄弟，但他们拒绝了他，称他为反动修正主义者，于是连施隐藏了自己的想法。1916年，当他宣布支持鲁登道夫军事独裁统治时，他被反对鲁登道夫的社民党开除。从此，连施终于开始集中精力发展自己的意识形态，将普鲁士主义、人民主义、泛日耳曼主义、法团主义经济和各种社会主义理论结合起来，创立了自己的政党日耳曼社会主义人民党，化身“日耳曼社会主义”的捍卫者。他的运动仍然特立独行，但在内战的时候，他和自己的支持者加入了其他社会主义者推翻德皇的行列。\n\n很少有人会想到他会掌权，但现在这位“人民总理”是德国的新强人，他打算实现建立一个伟大、光荣和真正社会主义的德国的愿景。"
