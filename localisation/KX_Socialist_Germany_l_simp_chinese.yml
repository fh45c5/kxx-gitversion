 RR_OFFICER:0 "红骑士"
 RR_OFFICER_desc:0 "此人是红骑士团的一员，隶属于日耳曼社会主义人民党的特别军事行动小组。"
 gru_froncophobe:0 "反法"
 gru_froncophobe_desc:0 "此人对法兰西的恨是无以复加的"
 gru_chairman:0 "最高主席\n\n§g威廉·皮克已被宣布为德国最高主席，党授予了他在政府所有行政部门的绝对权力，以及立法权和行政权。§!"
 gru_chairman_desc:0 "威廉·皮克已被宣布为德国最高主席，党授予了他在政府所有行政部门的绝对权力，以及立法权和行政权。"
 red_guard_leaders:0 "红军旅民兵"
 red_guard_leaders_desc:0 "此人是即红军旅民兵的一员，红军旅是一支由威权工团主义者和布尔什维克组成的准军事部队。"
