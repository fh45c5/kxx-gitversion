 GRU_FDJ_desc:0 "人民学员军团\n人民学员军团的政治和意识形态目标是影响德国年轻人生活的方方面面，传播日耳曼社会主义，推广人民总理所称的“高尚的人民精神”。\n人民学员军团的成员资格名义上是自愿的，但是，那些不加入的人基本失去了假期，并且发现很难甚至不可能被大学录取或从事选定的职业等。组织的许多活动与军事训练非常相似，包括武器训练、突击课程和基本战术。其目的是灌输其成员作为士兵为德国忠诚作战的动力。与学术研究相比，这里更强调体能、坚韧和军事训练。"
 rotermorgenmisc.1002.t:0 "革命的旗帜"
 rotermorgenmisc.1002.d:0 "当我们推进真正的德国革命时，必须团结在一面旗帜后，以促进无产阶级间的团结。我国国旗底色采用的是红色，中间有一条黑色横条纹，这将保持不变。党目前无法达成一致的是在上方加上何种标志以完成最终设计。"
 rotermorgenmisc.1002.a:0 "使用纹章和花环。"
 rotermorgenmisc.1002.b:0 "使用纹章。"
 rotermorgenmisc.1002.c:0 "使用剑与稻麦的符号。"
