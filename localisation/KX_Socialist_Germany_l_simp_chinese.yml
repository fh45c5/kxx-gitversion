 GRU_OCCUPIED_START:0 "德意志现在是一个被占领的国家"
 GRU_CORPORATE_DICTATORSHIP_FLAG:0 "克虏伯和德意志工业家委员会建立了企业独裁统治"
 GRU_red_ufa:0 "宇宙电影公司"
 GRU_red_ufa_desc:0 "在其国有化之后，所有的媒体发行和制作都被并入了宇宙电影公司，成为德国新的中央宣传机器。"
 GRU_breitspur:0 "宽轨铁路"
 GRU_breitspur_desc:0 "宽轨铁路是一个正在进行的项目，旨在建设一个轨距极宽的铁路网。这背后的想法是将德国所有工业高度发展或资源量巨大的城市和地区联系起来。"
 GRU_guard:0 "红骑士团"
 GRU_guard_desc:0 "红骑士团不知畏惧，事实上，是每个人都怕他们，不仅在德国，他们的名声已经传到了邻国。\n红骑士身穿全套深红色制服，是党直接指挥下的一支小型精锐部队。他们负责应对并清除国内外的国家敌人。"
 GRU_new_germany:0 "伟大又光荣的德意志！"
 GRU_new_germany_desc:0 "德意志已然重生，从被外敌毁灭后的灰烬之中崛起。再也不会失败了！现在我们如同凤凰涅槃般重生，我们将永远守护我们光荣的祖国！"
 GRU_deutsche_architecture:0 "日耳曼社会主义建筑"
 GRU_deutsche_architecture_desc:0 "人民总理对创造一种象征德意志的建筑风格产生了特殊的兴趣。"
 GRU_heavy_industry:0 "新兴重工业"
 GRU_heavy_industry_desc:0 "新兴重工业。\n\n我们一直在建立一个新的重工业，它将使所有其他欧洲国家的工业相形见绌。"
 GRU_carrier:0 "海军重心：航母"
 GRU_carrier_desc:0 "我们的海军将会以航母战斗群舰队为基础进行建设。"
 GRU_carrier_submarine:0 "海军重心：航母与潜艇"
 GRU_carrier_submarine_desc:0 "我们的海军将会以航母特混舰队和潜艇狼群为基础进行建设。"
 GRU_carrier_cruiser:0 "海军重心：航母与巡洋舰"
 GRU_carrier_cruiser_desc:0 "我们的海军将会以航母特混舰队和巡洋舰为基础进行建设。"
 GRU_carrier_submarine_OK_NVM:0 "国家人民海军最高统帅部"
 GRU_carrier_submarine_OK_NVM_desc:0 "德国国家海军最高统帅部。\n\n我们的舰队将以航母特遣部队和潜艇狼群为重心。"
 GRU_carrier_cruiser_OK_NVM:0 "国家人民海军最高统帅部"
 GRU_carrier_cruiser_OK_NVM_desc:0 "德国国家海军最高统帅部。\n\n我们的舰队将以航母特遣部队和巡洋舰为重心。"
 GRU_battleship:0 "海军重心：战列舰"
 GRU_battleship_desc:0 "我们的海军将会以航母战斗群舰队为基础建设"
 GRU_battleship_submarine:0 "海军重心：战列舰与潜艇"
 GRU_battleship_submarine_desc:0 "我们的海军将会以战列舰舰队和狼群为基础建设。"
 GRU_battleship_cruiser:0 "海军重心：战列舰与巡洋舰"
 GRU_battleship_cruiser_desc:0 "我们的海军将会以战列舰舰队和巡洋舰为基础进行建设。"
