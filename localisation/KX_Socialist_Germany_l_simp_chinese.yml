 rotermorgenmisc.1000.t:0 "不可能的公投？"
 rotermorgenmisc.1000.d:0 "随着康拉德·阿登纳总理领导下的基督教民主联盟继续深化改革、建设素质高尚、社会公正的德意志社会，这个诞生自动荡与冲突之中的共和国也在秉持着尊重少数群体与新教徒理念的同时，慢慢接近于天主教的理想。在度过了近几个月的相对稳定的时光后，政府决定吸引德国的劳保们入党，而革命之火降临、内战爆发时的执政党——德意志保守党的前成员们就在政府的目标清单之中。\n\n我党的前身中央党就曾与他们以及帕彭宰相结盟，不过，我们两家在帝国崩溃后即分道扬镳。保守党支持者、我们政府在巴伐利亚基督教社会联盟中的合作伙伴，以及以路德维希·卡斯为代表的中央党威权派成员的大量涌入导致的直接后果就是党内半官方性质的“保皇”派的建立，如此之大规模之前在党内还是闻所未闻。虽然阿登纳与“保皇”二字可以说是毫不相干，但他的政治理念是在霍亨索伦的“普鲁士主义”、俾斯麦针对教会的文化斗争对莱茵身份认同的侵蚀下形成的，所以他可能会被自己的莱茵老乡卡斯说动，同意举行恢复君主制的民主公投。\n\n当然了，这种重大抉择肯定是要预先向民众详细解释的，好留给他们时间仔细考虑自己的选择。公投的初步方案分两阶段进行，第一阶段决定是否要在立宪体制之下恢复更为公正的君主制，而第二阶段则决定由谁来担任皇帝。\n\n虽然基民盟中的大多数成员都不待见这一想法，但他们也表示如果能保证将新教贵族，特别是霍亨索伦家族排除在皇位候选人之外，那他们也会遵从人民的意志，尊重他们做出的选择。如今，决定权就掌握在总理手中，无论他的选择是什么，德国都将迎来重大变革。"
 rotermorgenmisc.1000.a:0 "或许为了保卫我们的人民，一位立宪君主是必要的"
 rotermorgenmisc.1000.b:0 "不，德国以共和国的身份而重生，也将以共和国的身份万世长存！"
 rotermorgenmisc.1001.d:0 "就连最初提议公投的人也没想到，德国民众竟然以53%的微弱优势赞成以新的立宪体制恢复君主制。虽然投票率低于预期，但上百万的德国民众已经明确表达出了他们的意愿，而且还会有更多的人去参加接下来的第二次公投，来决出一国之主花落谁家。国家议会列出的名单上一共六位候选人，六人都是天主教贵族。\n\n想都不用想，萨克森国王格奥尔格二世肯定位列名单之上。革命爆发时，出乎众人的意料，也让许多人愤愤不平的是，格奥尔格放弃了自己的王位，逃到了奥地利的因斯布鲁克，加入了经营卡尼希尔斯学院的耶稣会。格奥尔格的身边人以前经常传他有志成为一名牧师，而革命也差点遂了他的这一桩愿望，然而，社会主义温和派以及基督教民主联盟的上台给了格奥尔格回到萨克森的机会。除了在前臣民的恳求下重拾萨克森王位外，格奥尔格在近几个月一直过着非常低调、平静的生活，少有的公开露面不是在为因战争而一无所有之人组织慈善活动，就是在同当地的僧侣一起祈祷悟道。格奥尔格除了接受过系统性的政治学和经济学教育、虔信天主教外，还因幼时在路德宗导师下养成的普世思想对新教、犹太人一视同仁，可谓是在基督教民主联盟的旗帜下团结德国各方势力的最佳人选。如若他能当选，他将会以格奥尔格一世的名号统治国家。\n\n别的候选人还有巴伐利亚的基督教社会联盟提出的维特尔斯巴赫家族的鲁普雷希特国王和阿尔布雷希特王子。鲁普雷希特的治国经验居所有的候选人之首，并且也同样笃信天主教，但党内有人担心鲁普雷希特在巴伐利亚对奥地利民粹主义表现出的放纵，以及以普鲁士、巴伐利亚、整合后的荷兰为主导的新三邦体系的大战时代的陈腐理念，因为这不仅会抹杀掉诸如莱茵这样的其他文化身份，还有可能将之前的普鲁士主导的德意志换成巴伐利亚后卷土重来，而基督教民主联盟也会被基督教社会联盟取而代之。\n\n如果人民坚持要选维特尔斯巴赫的话，还可以考虑下鲁普雷希特的儿子、王太子阿尔布雷希特。阿尔布雷希特大部分时间都隐世不出，沉醉于林木的学科研究、猎鹿，以及饲养外国犬种。他除了可以充当象征性的君主外，还能够拉拢那些更具环保意识的国民。如果维特尔斯巴赫的两人当选的话，就会分别以鲁普雷希特一世、阿尔布雷希特三世的名号施行统治。"
