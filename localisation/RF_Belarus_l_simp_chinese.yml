 hol_monbol:0 "荷兰君主领导下的社会主义政府"
 WHR_monbol_land_confiscation:0 "以再分配打动群众"
 WHR_monbol_land_confiscation_desc:0 "长期以来，白罗斯的农民一直受着贪婪的富农和地主的剥削。而在这些地主之中，有许多人根本不是白罗斯人，而是波兰人和俄罗斯人的后裔。在国王和主席的命令下，一场大规模的再分配运动得以开展，他们的这些不义之财将会还给人民。白罗斯的农民与必须从这些强盗手中夺回他们的土地和财富，在国王政府和白罗斯革命组织的武装援助下，他们的梦想终于得以成真，希望我们能以此赢得农民们的支持。"
 WHR_monbol_central_planning:0 "王权下的集中工业化"
 WHR_monbol_central_planning_desc:0 "一些死板的工团主义者可能会指责我们实行的就是“国家资本主义”。但是，我们的经济制度是一种不基于工团或自由市场的需要，而是基于政府与人民的需要所建立的、最有效的制度。在我们推动白罗斯的大规模工业化的同时，这一制度能够扩大我们的经济基本盘，加快城市化进程，并进一步巩固国家对经济的控制，这一新制度将成为我们新经济发展的发动机。"
 WHR_monbol_recreate_police:0 "皇家白罗斯人民卫队"
 WHR_monbol_recreate_police_desc:0 "NBP曾以残酷的效率镇压对旧政权的异议，而我们许多人都对NBP鄙夷不已，这也证明他们确实做的不错。而我们要摆脱这可怕的过去，建立其属于新国家的安全力量——即皇家白罗斯人民卫队，他们将充分展现对国王和新白罗斯人民的奉献精神，在他们的监督之下，我们的新国家将江山永固，免受持不同政见者和反动派的攻击，而我们的乌托邦也不必被那些安那其疯子们的破坏所困扰。"
 WHR_monbol_cops:0 "皇家白罗斯人民卫队"
 WHR_monbol_cops_desc:0 "作为NBP的附属组织，白罗斯皇家人民卫队的任务是保护革命与王国免遭一切境内外敌人的威胁。"
 WHR_monbol_land:0 "忠者得土"
 WHR_monbol_land_desc:0 "土地改革在白罗斯是个老大难问题，随着人民王国的建立，这个问题终于有得到解决的迹象。那些拒绝宣誓效忠新国家的贵族和地主们的财产将被没收，并会重新分配给穷人。穷人可以拥有这些土地，只需要他们保持忠诚，否则土地将再次被没收，并被分配给其他忠诚的臣民。"
 WHR_monbol_planning:0 "白罗斯经济增长皇家委员会"
 WHR_monbol_planning_desc:0 "白罗斯的工业化一直在原地踏步，但由于现任政府是基于工人而建立的，我们必须得解决这个问题了。为了这一问题得到解决，王子殿下批准成立白罗斯经济增长皇家委员会。该委员会将从世界各地的计划经济体制中汲取灵感，致力于推进白罗斯的工业化，希望这能让万事大吉。"
 WHR_erdicrate_foreign_capital:0 "根除外国资本影响"
 WHR_erdicrate_foreign_capital_desc:0 "普鲁士的巨鹰高傲地扬起翅膀，但那东拼西凑装点自各国掠夺而来的羽毛并不影响其在受诅的黑色礼拜一于万里高空中坠落。作为对此回应，前帝国东墙防线的多米诺骨牌也已轰然倒塌，现在正是将我们嚣张跋扈的德国老爷赶出国门，并对遗留产业进行改造的机会。"
 WHR_reorganize_BNP:0 "改组无党派联盟"
 WHR_reorganize_BNP_desc:0 "事到如今，哪里还有置身事外的办法？革命如火如荼又迅疾如雷，端坐在拉达中央的士绅怕不是要等耶稣重临世间才会收回他们那副懒散的态度，是时候逼他们作出决定了，要么跟着德国主子一个下场，要么收起他们那般态度，老老实实为新政权干点杂活。"
 WHR_bolshevik_question:0 "我们对布尔什维主义的立场"
 WHR_bolshevik_question_desc:0 "在初步稳定了国内混乱的局势后，最不想面对的问题拖着他那悠长的步子向我们缓缓走来。面对这一问题，政权内已人心思变，流言四起，如不解决恐怕政权覆灭也只是时间问题。\n究竟以何种态度对待布尔什维主义？\n置于舞台聚光灯照耀之上的是布尔什维之门徒，白俄革革命党人，他们呕心沥血，为政权造成不可磨灭之贡献，陛下欣慰的看着他们为鲁塞尼亚破屋添砖加瓦，有他们的辛勤付出，百丈高楼也不过是时间问题……不过他们似乎对君主制兴致缺缺。在陛下忠诚的卫队看来，这些无神无主的亵渎之野蛮人怕是要欺君罔上，如若熟视无睹，挥舞着锤子镰刀将陛下从高塔之尖端扔下的时间也不远了。\n在舞台一角，陛下对这些破坏团结的流言蜚语早有耳闻，暂未发表意见。不过谁会在意一个花瓶的意见呢？但在无人知晓的地方，皇室卫队已向陛下秘密效忠，厉兵秣马只待赤匪露出破绽后趁虚而入。\n目光焦点之外，前无党派联盟，社民党，社革党，农民劳工联盟……出身各异杂乱无章的新政权效忠者从舞台上下也向那政治乱流中投来匆匆一瞥，然后回归到一次又一次的繁忙工作之中。对这些墙头草来说，无论是谁赢了都无所谓——当然两败俱伤更好，这样摇摇欲坠的破房子就更需要他们这些忠实的代理人了。他们不想也不准备掺和乱流，但如若政权出现了出乎意料的变故，自然也会发挥出他们该有的力量。\n各方势力互做僵持，鹿死谁手犹未可知。"
 WHR_denounce_reds:0 "打倒赤匪"
 WHR_denounce_reds_desc:0 "赤匪，必须得剿，一天不剿都不行！恼人的蚊虫，王国的肿瘤。毫无疑问，赤匪是造成一切暴动，祸患，堕落的根源，就是这些蛀虫蛀空了前王国的基石，该死的赤匪！但螳螂捕蝉的时刻已然远去，黄雀正张开翅膀扫去这些历史的尘埃。\n话说回来，若不是这些恼人的暴民击溃了前任王国，我便也永无出头之日，陛下的统治尚未巩固，现在正是从中提拔有识之士的好机会——一切皆凭陛下定夺。"
 WHR_embrace_authoritianism:0 "拥抱威权主义"
 WHR_embrace_authoritianism_desc:0 "赤匪去死！既然已经做出了决定，那么我们的国王陛下就不应再过多犹豫了，邪恶的赤匪在完成了民族国家基础的土地改革后竟想更进一步，士可忍孰不可忍，陛下，请下令吧！"
 WHR_loyal_socdem:0 "忠诚的社民党"
 WHR_loyal_socdem_desc:0 "乱世用重典理所应当，大棒已经挥下，而现在正是投出胡萝卜的时候。\n社会民主主义是个好东西，左经马传皆以此为基准，更有社会主义之耶稣基督——马克思亲自托付的圣考茨基为其背书，世间再找不到第二个比其正统且软弱的党棍为我们辩经了，只要许以作为门面党派的蝇头小利，忠诚的社民党人自会闻风而动从八方拜服而来，为我们表演自由与革命的宗教滑稽剧。"
 WHR_benvolent_dictatorship:0 "仁慈独裁"
 WHR_benvolent_dictatorship_desc:0 "陛下忠诚的卫兵已经击溃赤匪的主心骨，布尔什维主义的阴影在鲁塞尼亚上空回旋缓缓消失，除却乡间的散兵游勇外已无组织，威权已足够彰显，现在是时候展现陛下仁慈了——将残余社会主义拍手党拖出来彰显门面是个不错的选择。"
 WHR_continue_nationalization:0 "继续国有化"
 WHR_continue_nationalization_desc:0 "在击垮了布尔什维克蛀虫后。空缺的席位，基层官僚必须立刻填补，工厂必须立刻复工，高层官僚也得抽出身子，好好忙活一番……有的忙活了。那么，国有化难道不是必须的吗？将赤匪的遗产尽数充功装入国王的宝库，基层空缺用于培养忠诚之士，党内特权，高官厚禄用于笼络人心。那么，我们的国有化就完成了。"
 WHR_moderate_revolution:0 "温和革命"
 WHR_moderate_revolution_desc:0 "革命……革谁的命？这是个好问题。在英法工团主义者的眼里，革命的首要目的是将我们脑袋上的德国主子赶出门外，大腹便便的布尔乔亚通通送去枪毙……以及我这个曾经有名无实的傀儡国王。每每想到此处，我不禁为革命之面纱困惑其必要性。但圣考茨基的门徒举着赤党十字架来到了门前，挤眉弄眼的拿出了那份充满诱惑的提案。\n如果，我是说如果，我们的国王一开始就他贫苦的子民站在同一立场呢？在德意志假作民族解放之图殖民东欧之时，我们贫苦人的国王英勇的接下了管理重任，忍气吞声支持地下解放运动，在革命运动陷入迷茫之际挺身而出保全大局。凭此内忧即可无恙，我们也好多领一份来自西方恶魔的馈赠，就是德国主子可能不太满意。"
 WHR_paternal_socialism:0 "家长制社会主义"
 WHR_paternal_socialism_desc:0 "在稳定国内政局之后，是时候开始重新编写意识形态圣典了，一切于文书中独立出现的社会主义全部消失再辅以晦涩难懂的官话，或者冠以“王朝”“贵族”之前缀，那些出于理论核心的既不能删去又不能补充就开动脑筋改为社会正义，一“主”一“正”，将唯心的，路线错误的“主”改为符合君情，唯物辩证的“正”!\n看呐，辩证法的伟大胜利！"
 WHR_liberal_socialism:0 "自由社会主义"
 WHR_liberal_socialism_desc:0 "在前王国时期，无论遇到哪一个抵抗运动成员问其内心之所往，他们都会毫不犹豫的回答：“自由”。\n是啊，自由高于一切，但我们暗中联络的德国主子因为近期发生的政治波动向我们投来了警惕的目光。大使们窃窃私语，边境线上也传来了异动，自由岌岌可危。\n但陛下自有妙招，在重新与德国取得秘密联系之后以降低自主性，提高对德经济依赖为代价，决定在德国的支持下发动“二次革命”，我们的国王将作为革命党党魁兼国王，一举推翻腐朽的鲁塞尼亚王国，将那些赤匪余党一网打尽。\n这样，我们的德国主子也能心满意足的收回目光了。"
 WHR_renewed_kingdom:0 "崭新的王国"
 WHR_renewed_kingdom_desc:0 "在经历了我们大刀阔斧的改革之后，旧日腐朽王国焕然一新，拍手党们争相称好，官僚有条不紊的运作国家机器，党棍则急于对新的意识形态说文解字，小修小补。臣民也满意地收回了对新政权的忧虑，乖乖回到了自己该待的位置，鲁塞尼亚的闹剧终于落下帷幕。"
 WHR_national_reconcilation:0 "全国大和解"
 WHR_national_reconcilation_desc:0 "那还说啥呢兄弟，这么性情投了得了\n密谈之中，陛下做出了出人意料的举动，或许是因为雅泽普一心为国，毫不利己的气魄震慑住，经过了短暂思考后热泪盈眶，神情狂热的握住了他的手，不过片刻便将桌上的卖国提案撕成碎纸，并宣布解散皇家卫队，而雅泽普思索片刻后抱以同样的激情紧紧的握住了手，并宣布帝位将如社会主义般永世长存……兴许是为了党内团结？不论如何，危机都已消散。\n握握手，握握双手!"
 WHR_national_unity:0 "团结一致向前看"
 WHR_national_unity_desc:0 "……绝对不是有人在背后推波助澜，绝对不是。\n在解决了危机之后，官僚们也就这次心照不宜的团结而心满意足的撇去了视线，如今鲁塞尼亚百废待兴，和解的政令传开后朝野皆惊，正是初步统合各派系支持者的好时机。"
 WHR_national_social_revolution:0 "民族与社会的革命"
 WHR_national_social_revolution_desc:0 "毫无疑问，民族国家兴起后王室的权威便一蹶不振，鲁塞尼亚并无特例，为了给王室赋予合法性与民族主义绑定是不错的选择，至于那些赤……赤血忠诚之士，他们毫无例外均是狂热的社会革命推动者。那么在此之上，让陛下出门至市井街铺，扶老妇过路后示意党棍大书特书，再将民族与社会绑定便可使陛下高枕无忧。"
 WHR_wake_the_people:0 "唤醒人民"
 WHR_wake_the_people_desc:0 "意识形态章程已敲定完毕 ，现在正是发起运动唤醒帝国之纯正无产阶级奋斗之时，我看聚聚会，修修路就不错嘛，帝国物质条件极大丰富。喝茶之类的苦差就交给文员代办了。"
 WHR_worker_and_peasant_government:0 "工农政府"
 WHR_worker_and_peasant_government_desc:0 "最后的最后，我们的笔杆子盯着政府那栏犯了愁，我们如此奇异的君主社会主义究竟该用何等伟大词汇来形容其政府，君主专制？先锋队之专政？无论填哪个都不利于大局又有失偏颇，在依次请示上级过后，我们的灰衣主教大手一挥，提笔便写：\n“工农政府”"
 WHR_rise_of_peoples_kingdom:0 "人民王国的崛起"
 WHR_rise_of_peoples_kingdom_desc:0 "鲁塞尼亚，你崛起吧！\n在度过了艰难的政权维持阶段，并适度的展望未来后，我们的国王同无产阶级一道肩并肩，目光如炬，直钉向那风云变幻的欧罗巴土地，大步迈向那民族与社会革命之乌托邦。"
 WHR_victory_of_monbol:0 "君主布尔什维主义的胜利"
 WHR_victory_of_monbol_desc:0 "反动渣滓们终于可以永远的闭上他们那恼人又喋喋不休的嘴巴了，在意识到弗拉基米尔这个宛如古奥斯曼亵童般向德国主子摇尾乞怜的傀儡虚君无可救药后，结束会议的亚泽普同志立刻动用雷霆手段囚禁了国王，并解除了皇室卫队的武装，而那些台下笑意盎然的观众党魁自有办法。\n但至少现在，君主的掩饰还是必要的。"
 WHR_monarchobol: "君主……社会主义？"
 WHR_monarchobol_desc: "虽说工团主义革命在西方胜利了，但布尔什维主义在东方阵营里仍是真正革命的意识形态，或者说我们希望它是。我们必须拥抱我们的文化根源——被德国和俄国白匪这些反动派撕破的文化根源——为白俄罗斯人民照亮一条新的道路，我们的“光荣王”弗拉基米尔的指路明灯和社会主义的正义红星指引我们前进。我们要让世界知道，君主制与社会主义是可以共存的，结合二者可以造福于全体人民。"
 WHR_ideas_of_mladossi:0 "青年俄罗斯联盟的启示"
 WHR_ideas_of_mladossi_desc:0 "启示，什么启示？这个将苏俄内战时不死不休双方结合起来的劣质产物有什么意义？更别提他们的创始人——阿塞拜疆血统的小贵族卡津别克跟随高尔察克颠沛流离一路逃到运东，如今坚持他的意识形态只让他落得个在西伯利亚鸟不拉屎的地方天天开君布沙龙，在凛冽寒风呼啸而过之时以地方主义者的嗤笑为背景，与那些同他一致的无能傻瓜畅谈那他乡遇帝王，反攻大陆去的美梦。\n他最大的贡献就是告诉我们相信社会主义同君主制结合的都是十足的蠢货兼政治不可靠者，将这些蠢蛋全部派去西伯利亚理论考察团学习先进经验，或者另设一处丢去偏职喝茶喝到特别处上门。"
 WHR_royal_planning_comittee:0 "皇家经济计划委员会"
 WHR_royal_planning_comittee_desc:0 "是时候对白俄罗斯一潭死水的政治环境进行大洗牌了，把那些无能的官僚统统撤销编制，能力尚可的丢进新开设的计划经济委员会测试其能力。大局当前必要精简行政机关，只会为新政权摇旗呐喊的家伙全部扫地出门，若是经过能力测试，封为专职技术官僚未尝不可——他们为新政权效忠的下半生也只剩数学了。"
 WHR_proletariat_unity:0 "无产阶级团结"
 WHR_proletariat_unity_desc:0 "为什么能让这些踩着社会主义独轮车的小丑登上舞台？就是因为我们亲爱的无产阶级还未意识到其职责——管理这个属于他们的国家，我们必须立刻开启大规模政治教育运动提高无产阶级的自觉，直到他们有能力替先锋队管理国家的重担。"
 WHR_peoples_army:0 "人民军"
 WHR_peoples_army_desc:0 "在内政告一段落后，我们终于可以组建一支独属于党的军队了，因为我们的地理环境，若不是有君主制遮掩，鹰视狼顾的欧洲列强怕是早已一拥而上将白俄罗斯叛匪瓜分殆尽，我们必须争分夺秒组建这支武装，武装其以保卫工人阶级的祖国。"
 WHR_true_social_monarchy:0 "真正的社会君主制"
 WHR_true_social_monarchy_desc:0 "一切事务都在有条不紊的进行中，但在文员的交流里，可靠的工人同志口中，文件的传输中同一个名词日益增长\n弗拉基米尔，这位生得那令人憎恶之性情，被称为国王又只会向普鲁士乞尾求食的猖妓正静静的坐在单人囚室中，与日月和好似永恒的春天为伴，全国上下翘首以待，等待着国王的判决。在经过深思熟虑后，亚泽普最终做出决断:寇可往，吾亦可往！\n既然黑暗的旧世界可以如此腐蚀人的心智使其为财权所困，那么我们明亮的新社会主义世界便可较之千倍万倍的照耀他那丑恶的灵魂，灼烧他那灰暗的神志，令其作为那尚未诞生的理想之乌托邦——白鲁塞尼亚人民共和国第一公民接受全社会改造，作为新世界的出瓶体以此证明社会主义对资本主义的全面胜利。\n社会主义一号改造人，出列！"
 WHR_kryvian_aryan_concept:0 "克里维亚—雅利安概念"
 WHR_kryvian_aryan_concept_desc:0 "古老的梵文经卷在某个被遗忘的角落里沉睡了千年，直到明斯克的学者们从那些庄严的音节中辨认出自己祖先的名字。ārya——高贵的、光荣的、值得尊敬的，这个在恒河与印度河之间回荡了千年的词汇与第聂伯河上游那些古城遗址中埋藏的陶片和骨针之间伸展着一条穿越整个欧亚大陆的隐秘血脉。\n克里维亚，东斯拉夫最古老的部族联盟之一，带着波罗的海的琥珀气息与芬人土地上的桦林记忆，如今在这座焕然一新的白俄罗斯首都郑重宣布：我们，就是这支伟大迁徙的最初源头。那些在十九世纪被欧洲人种学家反复测绘的颅骨比例和鼻梁高度，那些被德意志学者挪用又扭曲的远古叙事，终于等来了它真正的主人。"
 WHR_land_of_ancestors:0 "尽复先祖之土"
 WHR_land_of_ancestors_desc:0 "地图在西沉的暮色里重新铺展开来，它的边界不再以当下的条约和铁丝网来描画，而是由那些早已在博物馆玻璃柜里泛黄的羊皮纸上褪色的墨线来划定。基辅罗斯的编年史里记载着克里维奇人曾经占据的疆域：他们的城市矗立在斯摩棱斯克，在波洛茨克，在伊兹博尔斯克，在普斯科夫；他们的商船沿第聂伯河顺流而下直抵拜占庭的金门，他们的武士曾追随奥列格大公的舰队在君士坦丁堡的城墙下将盾牌钉上城门作为凯旋的印记。此后的十个世纪是一场漫长的退潮——蒙古的铁蹄踏过，立陶宛的大公们来了又走，莫斯科的文书们在沙皇的印章旁标注着新的行省边界，把克里维奇人的后裔分割进不同的人为疆域。\n而今，明斯克宣称退潮已经结束，涨潮开始了。"
 WHR_nordic_origins:0 "我们的北欧起源"
 WHR_nordic_origins_desc:0 "瓦良格人的龙首长船曾经劈开道加瓦河冰冷的浪花，那些从斯堪的纳维亚峡湾远道而来的北欧武士们，在如今被称作白俄罗斯的河岸上留下了铁斧，留下了把树木雕成船形的古老手艺，留下了那些至今还能在某些乡间方言里找到踪迹的古诺尔斯语词汇。\n编年史里分明写着：波洛茨克的克里维奇人曾与北欧商旅交换皮毛和蜂蜜，曾在漫长的冬夜里围坐在同一堆篝火旁，交换关于雷神和雷鸟的传说。\n此后的许多个世纪里，南方的草原、东方的平原把白俄罗斯人的面孔织入了斯拉夫的经纬，但血液里那一丝来自极北之地的凛冽从未被完全稀释。\n如今，明斯克把目光转向波罗的海对岸——转向斯德哥尔摩的群岛和奥斯陆的峡湾，转向那些在冰岛苔原上依然吟唱着古老史诗的后裔，转向那些在丹麦海滨保留着和祖先同样航海本能的民族，要说的是：我们的起源在你们那里，你们遗忘的历史在我们这里。北欧大地，准备好重新认识你们散落在东方的古老族人。"
 WHR_adopt_panslavism:0 "接纳泛斯拉夫主义"
 WHR_adopt_panslavism_desc:0 "莫斯科盗用了斯拉夫母亲的名号！久到连说法不同方言的人们都快要忘记，最初的火种是从第聂伯河中游那些古老的定居点里燃起的。泛斯拉夫主义不是克里姆林宫的特产——那是所有斯拉夫儿女与生俱来的遗产。\n当明斯克的演说家们用白俄罗斯语喊出兄弟这个词时，它的回响在索菲亚、在贝尔格莱德、在萨格勒布都能被听懂。那些被奥斯曼苏丹的税吏压弯了腰的巴尔干农民，那些在哈布斯堡军营里用捷克语低声祈祷的士兵，那些在波兰工厂里默默劳动的斯拉夫工人——他们全都听得见啊！\n白俄罗斯人从沙皇时代就被教导要低头走路，如今他们终于抬起头来，举目不见东边那个自封的长兄，只有一个横跨中欧到黑海的、由真正平等的斯拉夫民族组成的广阔图景。\n西斯拉夫人将从德意志人的文化阴影中被重新带回阳光底下，南斯拉夫人将从几个世纪的奥斯曼余烬和被强行拼凑的王国废墟中找到一条通向共同家园的路。克里维亚的旗帜朝这些方向展开时，在深情的邀请——邀请你们，一起谱写斯拉夫人迟到几百年的团圆。"
 WHR_to_greece:0 "启航伯罗奔尼撒"
 WHR_to_greece_desc:0 "克里维奇人的船队曾在拜占庭的金角湾把盾牌举过头顶向皇帝致敬，他们的先辈曾用狐皮和蜂蜜换取爱琴海出产的橄榄油与丝绸。如今白俄罗斯重新拾起那些早已风化的航海图，把目光投向伯罗奔尼撒——那个名字源于帕罗普斯、用神话与大理石雕刻了整个西方文明摇篮的半岛。\n不需要像雅典和斯巴达那样建立殖民母国与属地的森严等级，他们渴望的是锚链哗啦啦沉入爱琴海那片世上最蓝的水域，渴望自己王国的名字与阿伽门农的迈锡尼、与奥林匹亚的圣火、与科林斯地峡的海风并肩而立。这趟远航将是对失落千年之后一段尘封历史的回访。"
 WHR_revitalize_allemanis:0 "净化日耳曼"
 WHR_revitalize_allemanis_desc:0 "德意志，这片土地在白俄罗斯的大地上留下过太多标记。那些用哥特体铭文替换掉西里尔字母的路牌和明斯克街头踏响皮靴的巡逻队，那些在德国人俱乐部壁炉旁一边喝白兰地一边讨论瓦格纳舞美设计的侨民——他们全代表着一种将白俄罗斯视为东方行省的眼神——从未真正将这片土地当作平等的存在，口中的秩序只是另一种意义上的驯服。现在，这双眼睛该从莱茵河到奥得河之间的全部土地上被逐一合上了。\n中欧那些被条顿骑士团的迷信、被普鲁士的军棍、被种种执念所浸泡过的日耳曼诸国，需要被净化——洗掉那种理所当然的优越，洗掉他们在东方前哨对斯拉夫人的屈尊俯就。\n白俄罗斯人要让日耳曼人学会一件事：在明斯克说白俄罗斯语不是一种需要被纠正的缺陷。"
 WHR_towards_great_belarus:0 "迈向大白俄罗斯"
 WHR_towards_great_belarus_desc:0 "白俄罗斯人沉睡了过久了。从波洛茨克公国的钟声到最后一次在维尔纽斯城堡上升起的白红白旗帜，他们一直被历史的大潮推来搡去，从未掌握过自己的命运。然而一个统一的民族正在醒来！——跨越语言的细微差异，跨越边境的人为切割，跨越几个世纪的离散与遗忘。从斯摩棱斯克的森林到布列斯特的平原……我们呼唤着共同体，一个我们知道的家乡。"
 WHR_restore_order_of_ostwall:0 "恢复东墙秩序"
 WHR_restore_order_of_ostwall_desc:0 "从白俄罗斯到乌克兰，从波罗的海沿岸到波兰平原，整个东方都在等待稳定。帝国已经厌倦了这些在战壕里诞生的碎片国家无休无止的内斗、腐败和天真幻想——它们需要一个共同的秩序，一个统一的意志，一个足以让任何觊觎者望而却步的铜墙铁壁。明斯克总督府已经证明了自己的能力，现在是时候将这份经验推广到整个东欧了。德意志的使命在东方，德意志的天职在东方，德意志的荣耀也在东方。"
 WHR_establish_reichcommisarats:0 "建立总督辖区"
 WHR_establish_reichcommisarats_desc:0 "一个明斯克远远不够。华沙需要总督，基辅需要总督，里加和维尔纽斯同样需要那种曾经让白俄罗斯从混乱泥潭中挣脱出来的铁腕。我们将在东方大地上建立起一系列平行的总督辖区，每一个都将以明斯克为模板，成为帝国边境上不可撼动的堡垒。"
 WHR_ostwall_general_governate:0 "东欧总督区"
 WHR_ostwall_general_governate_desc:0 "零散的辖区终将合流。如同数条支流汇入一条大河，白俄罗斯、乌克兰、波罗的海诸国和波兰残余领地上的各个总督辖区，最终将在一个至高无上的总体架构下统一起来。东欧总督区——这个名字本身包含着一种帝国视野的恢弘气度。从波罗的海到黑海，从东普鲁士边界到俄罗斯大草原的边缘，一片前所未有的行政空间将在地图上被标注出来，帝国的鹰旗将在这片广袤土地上每一个省会的塔楼顶端飘扬。"
 WHR_demolish_moscovites:0 "雪耻楚德湖"
 WHR_demolish_moscovites_desc:0 "七个世纪就这么过去了——一二四二年楚德湖冰面上的那场败绩，至今仍在德意志民族的集体记忆深处隐隐作痛。条顿骑士团的铁骑在冰层碎裂的巨响中沉入冰冷的湖水，那是一个未竟的东进之梦，是一笔未清算的历史旧账。这是历史赐予德意志的窗口。向东方，向着那片曾经吞噬过条顿先辈的辽阔土地，前进！"
 WHR_litbel_union:0 "立陶宛—白俄罗斯联盟"
 WHR_litbel_union_desc:0 "立陶宛大公国从未真正死去。格季米纳斯的铁骑到雅盖沃的联盟之间，立陶宛人与白俄罗斯人的祖先曾在同一面旗帜下并肩驰骋，共同缔造了这片土地上最辉煌的岁月。如今，当维尔纽斯和明斯克都在为生存而挣扎时，那些被遗忘的血脉正轻声呼唤同一个古老的名字。让我们重新走到一起吧，让历史上最悠久的东欧伙伴关系在二十世纪的烽火中浴火重生。"
 WHR_litbel_cooperation:0 "深化立陶宛—白俄罗斯合作"
 WHR_litbel_cooperation_desc:0 "联盟不只是纸上的签字表意，它意味着统一的铁路时刻表跨越旧日的关卡，共同的教科书讲述同一种被重新发现的历史叙事，协调一致的外交照会让维尔纽斯和明斯克的声音在国际舞台上汇成一股洪流。\n这不是权宜之计。"
 WHR_unite_lit:0 "保护立陶宛人"
 WHR_unite_lit_desc:0 "在梅梅尔，在比亚韦斯托克，立陶宛的儿女们正寄居在别人的屋檐下，用不属于自己的语言祈祷。白俄罗斯的目光越过国境线，望向那些散落在西边的兄弟——他们的命运与我们相连，他们的苦难与我们相通。\n总有一天，总有一天——立陶宛人的每一寸故土都将得到庇护，每一个失散的儿女都将回到那个共同的家乡。"
 WHR_embrace_litvinism:0 "利特维主义"
 WHR_embrace_litvinism_desc:0 "那群无耻的萨摩吉蒂亚蛮子竟敢地盗用立陶宛这一属于斯拉夫人的民族身份！我们应当遵循奥西普·森科夫斯基的指示，自豪的称自己为真正的立陶宛人——利特维人！"
 WHR_legacy_of_litwin_duchy:0 "立陶宛大公国的遗产"
 WHR_legacy_of_litwin_duchy_desc:0 "既然我们已经了解了我们真正的民族起源，我们便应该恢复我们的旧领土——立陶宛大公国的领土！拿起武器，让勒图瓦人滚出我们的土地！"
 WHR_restore_the_commonwealth:0 "重建波兰立陶宛联邦"
 WHR_restore_the_commonwealth_desc:0 "1861年，白俄罗斯独立运动先驱康斯坦蒂·卡利诺夫斯基在《农民真理》中呼吁反对俄罗斯帝国，呼吁恢复波兰立陶宛联邦。波兰人和我们一样，早就受够了在沙皇统治下做牛做马的日子了。让我们再次团结起来——哪怕要用武力。"
 WHR_west_ruthianism:0 "西俄罗斯主义"
 WHR_west_ruthianism_desc:0 "1884年，白俄罗斯历史学家米哈伊尔·克亚洛维奇在他撰写的历史教科书中阐明了西俄罗斯主义：白俄罗斯人民是全俄罗斯人民的一部分。毫无疑问，与波兰的联盟是我国历史上的一个巨大污点。让我们实现全罗斯人民的团结——哪怕要用武力。"
 WHR_revolution_in_east_europe:0 "东欧革命"
 WHR_revolution_in_east_europe_desc:0 "社会主义的烽火再燃！巴黎的公社墙、伦敦的车间委员会、巴塞罗那的无政府工团广场——这些名字在白俄罗斯的工厂棚屋里被一遍遍低声传诵，像一首跨越国界的秘密圣歌。明斯克的革命者抬头望向西方，望向那片被工团主义红潮席卷的土地，心中燃烧着一个共同的信念：东欧的工人和农民，同样配得上一个砸碎锁链的黎明。从华沙的纺织厂到基辅的炼铁车间，从里加的码头到维尔纽斯的铁路工人聚居区，整个东欧都在等待那第一声号角，而白俄罗斯就愿意做那个吹响号角的人。"
 WHR_inheriter_of_october:0 "革命接班人"
 WHR_inheriter_of_october_desc:0 "老近卫军们的旗帜还插在废墟之上，新一代的战士正在工厂的汽笛声中、在被遗忘的乡村学校里、在那些仍然敢于秘密集会的狭小阁楼中成长起来。他们是革命的未被书写的下一页，是那些牺牲者生前唱过的歌谣中预留的副歌。白俄罗斯的革命不会因为没有先驱而止步，只因先行者已经在泥土中为后来者铺好了路，我们莫要辜负。"
 WHR_declare_ruthian_empire:0 "宣布成立鲁塞尼亚帝国"
 WHR_declare_ruthian_empire_desc:0 "终于，在国内一切乱象平息后，我们可以将骄傲的头颅伸向外界，在外界惊疑不定的眼神中大声呼喊鲁塞尼亚的到来。\n国王万岁！革命万岁！"
 WHR_imperial_legacy:0 "帝国遗产"
 WHR_imperial_legacy_desc:0 "帝国最伟大的遗产是什么？土地？皇权？本土化革命？\n不，都不是，帝国最伟大的遗产是在于是否能涌现出十万名年轻、纪律严明且手持武器的帝国子民，他们的唯一使命是铲除国家舞台上那些伪善者和叛徒，一如有机体结合起来，并无阶级长幼之分。如今我们忠诚的子民已大步上前，向全世界高声赞扬鲁塞尼亚的到来，并接受那份来源于过去帝国之遗产馈赠。\n而那心似骄阳的唐吉诃德终将为祖国劈云斩雾。"
 WHR_successor_of_ancient_rus:0 "古罗斯的继承人"
 WHR_successor_of_ancient_rus_desc:0 "莫斯科自称第三罗马，华沙高唱联邦荣光，立陶宛回忆着大公国的疆域，而白俄罗斯——这片曾经作为基辅罗斯核心腹地的土地——却被遗忘在历史的角落里，像一个被剥夺了姓氏的孩子。如今，白俄罗斯的国家工团主义者翻开了尘封的编年史，在波洛茨克那些被风吹雨打了八个世纪的石碑上，辨认出属于自己民族的古老印记。莫斯科声称继承了罗斯的正统，但他们不过是从鞑靼蛮子枷锁下爬出来的僭越者！真正的罗斯血脉流淌在第聂伯河上游，在波列西耶的沼泽与森林之间，每一个仍然能用古教会斯拉夫语念出祷文的白俄罗斯人之口舌。"
 WHR_restore_the_kievan_rus:0 "重建基辅罗斯"
 WHR_restore_the_kievan_rus_desc:0 "基辅是所有罗斯人的母亲城。第聂伯河上的第一座教堂到智者雅罗斯拉夫的法典，鲍里斯和格列布的殉道到伊戈尔远征的悲歌——罗斯的根在这片南方土地上扎得那样深，以至于千百年的占领、焚烧和征服都未能将其彻底拔除。白俄罗斯的国家工团主义者将目光投向南方，投向那片曾经与波洛茨克、图罗夫一同构成古老罗斯拼图的辽阔疆域……他们谈论的是一次伟大的回归。当白红白的旗帜逆第聂伯河南下，它将以失散多年的血亲的身份叩响基辅的金门。"
 WHR_federation_of_free_man:0 "东欧自由人联合体"
 WHR_federation_of_free_man_desc:0 "高墙，高墙立于世界大战后的废墟之上。\n这堵高墙高耸入云，墙体间由燃尽无数劳动者血泪烧出的砖块砌成，而那可怜的奴工在被榨干最后一点价值便成了墙砖之间的粘合物，于此之上混乱的高塔戴着金丝眼镜又衣冠楚楚的德国观察员骄傲耸立，提起钢笔在草纸上草草书写后又举起望远镜，似是分析俄国巨熊的威胁后更添几笔。\n但如今德帝国主义陷入混乱，被卫兵保护的观察员早已落荒而逃。无人维护的高墙摇摇欲坠，而从高墙墙角崩裂迸发出的希望与欢笑誓要让这座高墙倒塌，建立真正之自由人联合体………于工会指引下。"
 WHR_return_to_jelusam:0 "回到圣地"
 WHR_return_to_jelusam_desc:0 "圣地耶路撒冷自古以来便是我犹太族梦寐以求之地，也是千年流放的终点。现如今中东霸主奥斯曼陷入民族独立之死局，正是我等厉兵秣马，联合巴勒斯坦族同胞以捍卫民族独立之名夺回圣地，彻底将犹太复国主义扫入垃圾堆以夺取其正统性，成为犹太民族唯一组织的机会。\n该让西亚病夫迎来他的安息日了。"
 WHR_destroy_prison_of_peoples:0 "摧毁民族监狱"
 WHR_destroy_prison_of_peoples_desc:0 "俄罗斯——诸民族之监狱。\n在民族观念上世上再也没有能比俄罗斯还丑陋的国家了，来自莫斯科的暴君和昏君，反动大独裁者，自由主义捍卫者，“民族之瑰宝”们意见不一，互相攻伐，但当这些全俄罗斯最聪明的大脑们一致讨论上帝，家庭与祖国时，便会异口同声的从他们的狗嘴里吐来自前沙皇时代的象牙。\n“俄罗斯，统一而不可分割”\n再没有比这些莫斯科佬，傲慢，迟钝又多愁善感的人了，这些互相攻伐争论不休的狱长不愿意低下脑袋，看看那由贪婪的探险家，空洞的步枪枪口，粗健的警棍组成的大帝国中发出绝望呼号的诸民族哪怕一眼。\n在日复一日于冰天雪地的西伯利亚输送特殊人才时，俄罗斯统一不可分割吗？\n在华沙军警棍棒击碎头颅的碎响声中，俄罗斯统一而不可分割吗？\n在全俄无人不知，无人不晓的犹太屠杀惨案，标准差事中，俄罗斯统一而不可分割吗？\n绝不，现在正是我们的决胜时刻，联系一切可联系的，在军火仓库的阴影与工厂的产线上拿取一切可拿取的，召唤一切可召唤后，便将一切交于铁与血了。"
 WHR_message_for_mankind:0 "给人类的新信息"
 WHR_message_for_mankind_desc:0 "在世界大战之后，我们周围的世界非常奇怪。旧世界现在躺着，腐烂着，像一具臃肿的尸体。然而，新世界挣脱锁链，准备从废墟中诞生。现在，从混乱和灰烬中，人类的天使已经崛起，为全人类呼唤世界的新的黎明！几个世纪压在我们肩上的重负即将消失，我们将迈向一个没有人受苦的新明天！"
 WHR_against_the_capital:0 "反对愚蠢的资本主义"
 WHR_against_the_capital_desc:0 "这个世界上的谗妄基本上都源于一种卑鄙的意识形态：资本主义。虽然近年来发生的事已经开始削弱其霸权，但它的恶劣影响仍然困扰着世界。但无论他们在哪里，我们都要驱逐他们！因此，有必要让人们知道，我们为自己开辟的这片土地将成为反对愚蠢的资本主义的光辉堡垒！"
 WHR_against_grave_worship:0 "反对死亡崇拜"
 WHR_against_grave_worship_desc:0 "有组织宗教的信徒，如基督教和其他亚伯拉罕信徒，为一个共同目标奋斗。如果通过敬拜神明来安抚全世界的工人，任何正常的，相信一切苦难都通向乌托邦的人都会闭嘴，接受他们在这个世界上必须经历的痛苦。同样重要的是，这些信仰否认在物质世界中有可能形成一个光荣和永恒的黄金时代，因此，有信仰的工人变成了死亡的崇拜者。他们躺在那里，没有意识到死亡只会让他们被遗忘，而永生在地球上确实是可能的。\n\n让我们纠正这些错误，努力废除在全世界营造这种错觉的宗教，并开始证明我们可以在我们自己的世界上为所有人建立一个乌托邦。"
 WHR_for_the_stars:0 "为了赐我们以生命的星辰"
 WHR_for_the_stars_desc:0 "我们认识到，作为人类，我们都是星星的孩子。我们的思想从这些天体熔炉的巨大火焰中诞生，我们都通过这样或那样的方式维持着星星燃烧的能量。终于到了收回我们与生俱来的权利的时候了！我们出生在星星上，也将回到星星上。我们向我们古老的祖先提出了挑战，因为地球上的人类觉醒了，他们的生活范围扩展到了宇宙。"
 WHR_for_freedom:0 "…还有自由！"
 WHR_for_freedom_desc:0 "如果进步是由奴隶实现的，如果全世界的工人都生活在痛苦和贫困中，那么进步就毫无意义！我们今后的努力必须围绕这一思想。我们的目标是为了人类的自由，而不是为了一些虚伪的国家或专制的左翼技官！因此，让我们的声音响彻满洲的平原，让它的荣耀覆盖世界！因为奴隶制和奴役工人的人的丧钟终于可以听到了！"
 WHR_faith_progress:0 "进步的信念"
 WHR_faith_progress_desc:0 "基督教认为人一半是天使，一半是动物；虽然这在今天可能是正确的，但过去并非总是如此。人最初只是一种动物，并不比其他任何动物都特别，只有一个例外——在人的心中有一种对进步的渴望。正是对进步的信念促使人类创造了我们今天所看到的一切，使人类超越了自然。通过进步，人类增加了他的天使性，减少了他的兽性，我们将如此继续，直到人类属于上帝，由他对上帝的信仰所驱使——不是凌驾于人类之上的上帝，而是他自己的虔诚信仰。"
 WHR_faith_creativity:0 "创造的信念"
 WHR_faith_creativity_desc:0 "创造和生产的过程是生命的本质。既然我们是生活最坚定的捍卫者，我们也必须是创造最坚定的捍卫者。生物个体，作为生物宇宙主义的基础，生来就拥有创造力的火花。为此，他厌恶死亡，因为死亡是创造的终极毁灭者。因此，对创造的信仰不仅只是对创造的信仰，也是对我们自己的信仰。"
 WHR_perfect_living_individual:0 "使活体趋于完美"
 WHR_perfect_living_individual_desc:0 "固定的形态是束缚生命体的巨大锁链之一。卵子有无限的潜力，但是一旦它发育成一个完全成熟的生物，它就失去了这种潜力。生物被困在一个它可能会厌倦的身体里。这是对自由的公然侮辱，我们不能允许这样的事情发生。我们将把扩大身体自由选择权作为我们的首要任务之一，就像我们对待死亡一样。如果你必须生活在一个你不能自由选择的身体里，那么永生的目的是什么呢?"
 WHR_techno_anarchism:0 "技官无政府主义"
 WHR_techno_anarchism_desc:0 "我们绝不能让开历史倒车的人和资产阶级愚弄人类，让人类认为他们过去的生活方式是可以接受的、正常的，或者世界将永远是这样的。通过利用技术和自动化，我们将努力建立一个没有人需要工作或受苦的世界。资本主义和威权主义的发明和思想已经渗透到世界的许多地方，以至于对一些人来说，想象世界的终结比想象资本主义的终结更容易。\n\n但是所有这些旧世界的残余和迷信都将被废除！乌托邦无法打造的想法将被粉碎！通过技术，所有生物都将实现愿望；通过我们的努力，总有一天我们会把痛苦、掠夺和奴役变为只存在于神话和故事里的东西。自动化将确保没有人需要为了生存而工作，通过技术进步，所有的痛苦总有一天会被消除。所以，欢呼吧，宇宙间所有的生物！你的自由即将到来！"
 WHR_immortality_beyond_space:0 "超越国家的不朽"
 WHR_immortality_beyond_space_desc:0 "我们的一些同志误解了生物宇宙主义的目标。他们相信不朽的关键在于赋予国家更多的权力。我们很难理解为什么我们的同志这样认为：授权给一个杀死比其他任何机构都多的人的机构是通往不朽的道路。当然，我们有不同的道路。\n\n永生不会以一种专制的方式实现，不会是从上到下的强迫，而是作为一个有机的自下而上的过程，在这个过程中，寿命的每一次延长都伴随着自由的增加。我们不需要强迫人们为他们的自由而工作，因为我们将直接给予工人永生的权利。"
 WHR_future_perfection:0 "完美的未来"
 WHR_future_perfection_desc:0 "由于生物宇宙主义极其具有革命性，我们很难向大众讲述我们正在进行的项目的最终边界。大多数人认为它可以归结为两点：永生论和星际论。虽然我们也同时必须强调复兴是第三要点，但这些只是我们实际追求的逻辑表达，真正的生物宇宙主义比这三点更广泛，更简单。\n\n我们的追求是——也将永远是——生命的表达。自从第一个细胞分裂以来，自从第一个神经元放电以来，生物宇宙论的教义便已隐含其中。我们最终的目标是用理性有序的生命填满死亡的宇宙。"
 WHR_war_against_nature:0 "对抗自然之战"
 WHR_war_against_nature_desc:0 "我们一直处于战争状态——不仅是对抗我们的敌人，而且是对抗我们周围的自然之力。走在危险的道路上，我们需要充满勇气，但也要警惕——因为敌人的攻击是盲目而残忍的。我们的创造所不仅仅是一个我们自己创造的自由空间，它还是一个战场——我们共同任务的每一个追随者都是一名士兵。在与自然的战争中，我们需要巧妙的策略，明确的宗教式纪律和伟大的象征来团结我们所有人。在一个混乱的世界里，我们将成为人类最伟大斗争中的第一支真正的军队——带领人类走向无限的胜利。"
 WHR_bogdanov_legacy:0 "波格丹诺夫的遗产"
 WHR_bogdanov_legacy_desc:0 "波格丹诺夫同志在最近的混乱中失踪，这让我们深感忧虑。虽然我们希望他没有落入我们的死敌——死神冰冷的手中，但也不能排除这种可能性。如果是这样，我们必须记下来并把他放在复活名单的首位。波格丹诺夫的突然失踪使我们这些跟随他和他的队伍的人无家可归。自由创造所将成为所有追随前进派事业的人的新家。"
 WHR_total_production_control:0 "对生产的全面控制"
 WHR_total_production_control_desc:0 "一个任由矛盾混乱和自由市场支配的经济体，是不可能被可靠地期望照料其人民的。资本家和商人往往只能看见眼前的利益，这导致了日益严重的贫困和不平等，并为经济灾难和动荡铺平了道路。我们将是打破这种所谓“繁荣与萧条”循环的人。通过广泛的国有化运动，我们从个人和任何不幸被我们发现的资本家手中夺回了生产的各个方面的控制权。这样，我们将能够形成一个完全为我们所有人的福祉而工作的有凝聚力的经济体！"
 WHR_custodianship_of_the_earth:0 "对地球的监护"
 WHR_custodianship_of_the_earth_desc:0 "地球上的资源——空气、水、地壳中的矿物质——太珍贵了，不能任由自然的盲目力量摆布。我们的任务要求人类在地球上发挥调节作用。通过进化创造的生态系统本质上是不稳定的，必然走向一定程度的毁灭——为了拯救生命，人类需要采取有意识的、理性的行动。在未来，我们的目标将是控制天气，掌握原子能，把地球上的所有生命都置于我们伟大帝国的保护之下——在那里，它将由强大的双手和聪明的头脑引导，走上征服宇宙的道路。"
 WHR_enlighten_bandits:0 "启蒙强盗"
 WHR_enlighten_bandits_desc:0 "俄罗斯和乌克兰移民并不是唯一居住在这片亚洲土地上的人。在虚伪的资产阶级共和国崩溃之后，满洲人建立了他们自己的，充斥着土匪和农民的小领地。现在我们已经解放了这片土地，是时候让满族人走出悲惨的境地，进入新的启蒙阶段了。我们将帮助他们前进，迈向一个比我们所知更伟大的乌托邦！我们团结一致将是多么光荣啊！我们给世界树立了一个光辉的榜样，告诉我们如何摆脱民族主义的迷信和邪恶，进入一个伟大的新时代！"
 WHR_friends_or_enemy:0 "是友或敌"
 WHR_friends_or_enemy_desc:0 "在旧共和国的尸体上，在首都展开了一场新的实验：加斯捷夫-罗森鲍姆集团正试图建立某种奇怪的市场-工团主义综合体。尽管它明显优于困扰着共和国其他地区的复古主义毒蛇和民族主义者，但它显然无法与复兴的唯一途径——创造所相提并论。然而，尽管它不如我们，但不可否认，这种努力有一些值得关注的地方。也许通过适当的谈判，我们可以与双方达成协议。如果个人注定要死亡，那么个人主义的目的是什么？如果进步的目标不是天上的星星，那进步又是什么？"
 WHR_immortality_to_far_east:0 "不朽之国，出兵远东！"
 WHR_immortality_to_far_east_desc:0 "我们现在屹立在旧资产阶级共和国腐朽溃烂的尸体中间，像一座乌托邦的光辉灯塔。但是目前，我们的解放工作还局限于同土匪和军阀的边境小冲突。但是和平的时代已经结束了！现在终于到了我们打击所有阻碍我们实现永恒使命的人的时候了！首先我们要把不朽带给远东，然后从那里走向世界！"
 WHR_crematorium_tradition:0 "火葬传统"
 WHR_crematorium_tradition_desc:0 "对早已死去的人的做法的墨守成规和宗教崇拜已经困扰了人类几千年。现在，即使这种事情的可怕本质已赤裸裸地暴露在世人面前，但似乎很少有人愿意放弃旧做法。但我们将为世界指明方向，把这个世界从早已死去的鬼魂的恶行中解放出来！\n\n因此，让我们在净化的火焰中烧尽这个世界吧！这样我们就可以从无数恶魔的灰烬和他们的戒律中建立一个新的乌托邦！"
 WHR_united_labour_church:0 "联合劳工教会"
 WHR_united_labour_church_desc:0 "人们需要的是一种推动他们前进的新思想——一种新的、真正的宗教，一种伟大的象征。但在现代世界，还有什么宗教存在呢？新知识的炽烈之火焰已经无情地审判了过去的迷信，但这是否意味着现代人必须毫无信仰地生活下去呢？不！人类命运共同体将成为新的宗教！在劳动中，在向星辰大海的共同努力中，我们将找到新的上帝——新的福音将在每条街道上传播，每座工厂都将变成寺庙。因为智慧的人知道，我们在这里的努力意味着什么，这是一个真正的神性产生的地方。从落后的满洲卑微而起——人类将很快飞升到一个新的神族。"
 WHR_new_alchemists:0 "今天的炼金术士"
 WHR_new_alchemists_desc:0 "尽管人们都在谈论抛弃旧世界的丑恶壮举，但有一件事只有少数人知道：我们思想的种子是在古代播下的。在古代炼金术士的工作中，我们伟大努力的核心理想得以实现。那就是变化，把物质与神性合为一体。因此，我们寺庙的火炉也熊熊燃烧起来，借着火光，我们不停地劳作，从我们周围世界的铅中提炼出最高贵的金子。"
 WHR_for_order:0 "…还有秩序！"
 WHR_for_order_desc:0 "我们重组宇宙计划的首要任务是引入秩序。我们将引入意识的力量，把这个世界改造成一个理性、有序的机器。到那时，人类创造力的真正表现将不会是无政府状态，不会是胡言乱语的暴民，而是一个完美的国家——宇宙主义之国。在这样一个国家里，在政治领袖、科技精英的领导下，人类将最终能够驯服桀骜不驯的大自然，并创造一个全新的世界。让新秩序的军团骄傲地前进吧——把旧世界踩在他们的靴子下！"
 WHR_time_mastery:0 "掌控时间"
 WHR_time_mastery_desc:0 "我们项目的最终目标是完全掌握时间，也就是说——创造永恒。虽然其他帝国迟早会崩溃，但我们不会出现这样的的情况——因为我们是人类的最终命运。我们计划实现的是不朽，这指的不仅仅是我们的身体，而是我们整个宇宙的文明。随着时间的推移，宇宙将像柔软的粘土一样由我们来塑造，我们将成为最伟大的艺术家，无垠星河就是我们的画布。"
 WHR_space_mastery:0 "掌控空间"
 WHR_space_mastery_desc:0 "如果我们要给这个世界带来不朽和乌托邦，我们就不能固守在地球的小角落里，从这里缓慢地移动到那里。我们必须努力通过增强我们在所有可能方向上移动的能力来掌控空间。旧时代的做法，马匹和轿子，应该被抛弃！我们需要铁路技术来确保城市和国家之间的快速通信和旅行。但是，我们不能仅仅满足于铺设多少公里的铁路。我们必须超越速度的限制，进一步发展飞行的用途。\n\n谁知道呢？也许不久的将来，来自地球中心的航天飞机将飞向天空，进入无尽的宇宙！当我们宣布我们对宇宙取得了最终胜利时，世界各地的人们都将自豪地看着我们取得的成就！"
 WHR_improvement_humanity_institute:0 "人类进步研究所"
 WHR_improvement_humanity_institute_desc:0 "认为我们征服自然的任务应该在自然环境中结束的说法是不可接受的。不，我们的目标是创造一个不朽生物的联盟，因此我们需要重新定义人类。为此，我们创建了一个新的机构:人类进步研究所——一个致力于控制我们的肉体、骨骼和定义我们微妙思想的机构。研究所不应畏惧禁忌：等待我们的是漫长的旅程。虽然现在我们只能想到一些小步骤：例如集体卫生措施或在全国范围内实施优生计划，但将来研究所将找到重塑人体的秘密方法，创造一种新的上帝般的人：一种没有死亡的人，拥有超越凡人想象的力量。"
 WHR_state_beyond_nature:0 "超越自然之国"
 WHR_state_beyond_nature_desc:0 "建立国家代表着人类征服自然的任务的完成——它本身就是一种技术，将人类个体组织成集体形式的技术。我们将利用法律、象征和纯粹的力量来建设我们的国家，在这之上，我们将建立一个将取代自然的新世界。当它完成时，自然法则将不复存在，但国家的法律永存。"
 WHR_scientific_totalitarism:0 "科技集权主义"
 WHR_scientific_totalitarism_desc:0 "有必要认识到，我们现在生活的世界为我们提供了前所未有的可能，即使是过去最伟大的思想家也无法想象！我们不能像世界上其他地方的无知落后的蠢猪一样，拒绝感受科技所带来的温暖。\n\n有些人认为科学是独立于政治和社会组织之外的一个领域。但这仅仅是思想封闭的人的观点，他们无法理解新时代的诞生！通过在组织中应用科学原理，将会产生一个新的世界。对自然的完全控制和一个新的充满活力的世界将随之而来！当我们开始这样建设新社会时，世界将被我们不断改良和塑造。在这个社会中，所有人都在一起工作，行动和生活，以实现前所未有的成就和进步！"
 WHR_modern_methamorphosis:0 "现代变形记"
 WHR_modern_methamorphosis_desc:0 "几代人所熟悉的世界已不复存在——工厂的火焰重新排列了宇宙的基本元素。我们正在进入一个新时代。在我们眼前，自然正在成为历史，而我们正在成为世界变革的推动者！无论我们走到哪里，世界的新秩序就会出现。教会和国家合二为一——文化和政治在牢不可破的纽带中实现。一切，一切陈旧的制度和陈旧的思想幻想在我们眼前融化，只剩下赤裸裸的真理。我们将迎来启蒙——重生的人类，完成了救赎的任务。人类将既不在无知的伊甸园中寻找真和美，也不在困苦的地球上寻找真和美，他们将在群星中获得真正的奖赏。"
 WHR_siberian_revolution:0 "西伯利亚革命"
 WHR_siberian_revolution_desc:0 "人类蜕变的第一步已经完成。远东的人民已经在对新永恒明天的美好憧憬中得到了净化！但我们的任务还远没有完成！现在我们必须转向西方！到北方的苔原和平原去！\n\n目前，西伯利亚被牢牢地掌握在暴君和反动煽动家手中。我们将像一束净化之火，冲进沙皇走狗和卢德暴徒的墓地！成千上万的人期待着我们给他们带来的美好未来和新的天堂！我们不会让你们失望的。我们可能还有很长的路要走，从地球的角落，但让我们抬起我们的头与骄傲，因为我们的旗帜骄傲地飘扬在风中，这是一个新的创世纪！"
 WHR_future_to_eurasia:0 "人类的未来"
 WHR_future_to_eurasia_desc:0 "欧亚大陆上空的枪声终于沉寂了下来。我们取得了胜利，在荣耀中战胜了其敌人。我们的基地已成功建立在前俄罗斯帝国及其无数叛乱的余烬中。现在，工作能真正开始实现了。让我们注入新的生命，让我们的金属尖顶直达云霄，让我们直抵星空！"
 WHR_alexander_yaroslavsky_desc:0 "当尼古拉·费多罗夫在19世纪将宇宙主义的理想付诸实践时，他能料到会有这么多追随者吗？但在当前这种情况下呢？当俄国内战期间革命的命运处于最低谷时，出现了一场被称为“生物宇宙论”的知识分子运动，他们呼吁一种准无政府主义的不朽目标。身边充斥着无数死亡，人们不难理解为什么像亚历山大·雅罗斯拉夫斯基这样的人会执着于斯维亚托戈尔的“创造所”和它的乌托邦目标。\n\n雅罗斯拉夫斯基虽然既不是生物宇宙主义的领袖，也不是俄罗斯社会民主工党的成员，但在过去的几十年里，他是几个前进派宇宙主义文化组织的成员。一旦共和国找到了不稳定的和平，他就继续在哈尔滨街头担任布道者的角色，组织诗歌朗诵和公开演讲，呼吁人们共同建设社会主义和费多罗夫的愿景。他诗歌主题正如人们所期望的那样，他以一首关于人体低温保存的长诗在生物宇宙论舞台上留下了第一个印记——通过技术和人类的精神力量可以为人类做些什么。\n\n虽然他在前进派文化领域远非异端，但如果不是因为生物宇宙主义运动、俄罗斯社会民主工党和黄俄罗斯本身的三重解体，这位误入歧途的诗人可能仍然是一名煽动家。随着斯维亚托戈尔短暂的身体不适和共和国中央突然出现的权力空缺，剩下的党组织已经自顾不暇了。雅罗斯拉夫斯基能够团结起群众支持他，他已经成为一个公开宣扬宇宙主义的国家的领导人。再一次，面对巨大的破坏，似乎不可能的梦想也爆发出力量。最伟大的斗争将以收获最伟大的成果而结束——终结死亡的必然性和自然的规律性，追求人类最大的共同利益，为人类带来永恒的、崭新的、可畏的自由。"
 WHR_valerian_murayev_desc:0 "尼古拉·费多罗夫，俄罗斯宇宙主义的创始人，是一位苦行的知识分子，一位图书管理员——同时也是一位伟大的科学家、哲学家。同样，瓦勒里安·穆拉维耶夫与其他无数在黄俄罗斯的磨难中想要成为民粹主义领袖的人相去甚远，他更像是一个默默无闻的学术作家。虽然穆拉维耶夫从来没有像其他在俄罗斯内战期间崛起的生物宇宙论杰出人物那样（他不是一位激动人心的诗人），但他是斯维亚托戈尔“创造所”的早期忠实成员。一想到革命有可能重振俄罗斯，这让他兴奋不已，他和他的哲学同志们一起参飞越了西伯利亚。\n\n当一些生物宇宙学家转向鼓动流亡共和国的艺术发展时，穆拉维耶夫在阿列克谢·加斯捷夫的中央劳动学院找到了工作。他在研究所和疗养院的出版社中占据了一个重要的位置，将科学的劳动组织与人类随时间掌握的哲学结合起来。虽然它缺乏大众诗歌的戏剧性，但这一愿景为福特主义原则注入了生命力，并使他在整个前进派获得了许多盟友。\n\n当黄俄罗斯解体时，他的联盟受到了考验。利用他们的官僚知识和人际关系，穆拉维耶夫的科学家和知识分子已经证明在灭亡的共和国的无政府中心又他们掌权是合理的。还有什么其他机构能够将国家工作重心从法律和经济的领域转变为信仰和道德的领域呢？什么可被信任来建设一种超越生死的文化？还有什么可以实现人类的共同任务？站在高处俯视，新的封闭秩序宣告了生死界限并不是绝对的。终有一天，发生的一切都不会是听天由命的，而是服从于人类的意志。"
 belarus.42.t: "意外"
 belarus.42.desc: "在一次回春手术中，波格丹诺夫必须输入一名年轻学生的血液。然而，结果证明，这个学生得了疟疾和肺结核，波格丹诺夫大概也是知道的。于是一场可怕的悲剧发生了！在第11次换血过程中，该学生发生了排斥反应并随后死亡。波格丹诺夫也因手术而死。\n\n举国上下都在为无产阶级文化的思想家、世界上最聪明的人之一——党主席的逝世哀悼并悲痛不已。他的主席职位将由亚历山大·雅罗斯拉夫斯基接替。"
 belarus.42.a: "亚历山大·雅罗斯拉夫斯基将成为新主席！"
 WHR_germans_takeover:0 "明斯克总督府"
 WHR_germans_takeover_desc:0 "柏林的电报措辞简短而冷峻。社民党人那场打开潘多拉魔盒的实验，终于让白俄罗斯变成了一锅沸腾的杂烩汤——现在这种情况结束了，帝国的忠诚者从新掌控了这片大地，现在它要走向帝国所为它设想的愿景。"
 WHR_millitary_rule:0 "实施军法管制"
 WHR_millitary_rule_desc:0 "宵禁的钟声每晚八点从斯维斯洛奇河对岸的钟楼传来，悠长而不可违抗，街道便在钟声里一层层褪去人声，只剩下巡逻队探照灯的光柱像一把把缓慢移动的白色刀刃，切开那些曾经属于集会、辩论和无政府主义梦想的夜晚。军事法庭取代了地方法院，帝国军官坐在过去地方自治局的大厅里宣读判决，头顶还挂着那面白红白的三色旗，但审判的语言已经变成了德语，精确而坚硬，不容置疑的音节在那些曾经回荡着白俄罗斯语议会辩论的穹顶下激起回响。有人消失在了夜里，有人在黎明时分被押上东行的列车，然而铁路时刻表前所未有地恢复了准时，工厂的烟囱重新吐出黑烟，商人们在宪兵队岗亭旁重新支起了货摊。"
 WHR_crush_the_left:0 "终结农工联盟乱党"
 WHR_crush_the_left_desc:0 "农工联盟的人们曾经真诚地相信选票可以改变一切，他们把巴黎公社的歌谣一句一句译成白俄罗斯语，在乡村集市飞扬的尘土里散发油印小册子，向那些被地主、德国买办和几个世纪以来的贫困压弯了腰的农民们讲述一个闪耀着光辉的未来：没有驻军，没有不平等商约，土地归耕种者，工厂归劳动者。一九三五年的春天，他们的候选人席卷了明斯克和戈梅利的工人选区，拉达的大厅里第一次坐满了穿粗布外套的代表，那些布满老茧的手掌笨拙地翻阅着议事规则小册子。然后就是那个漫长的夏天，街垒毫无预兆地出现在首都的大街上，没有人愿意回忆是谁开了第一枪，只记得灼热的空气中弥漫着燃烧的轮胎气味和一种让人喉咙发紧的恐慌。总督的名单上印着两百三十七个名字，宪兵们按图索骥，敲开棚屋、厂房宿舍和乡村学校破旧的大门。那些曾在群众集会上挥舞拳头、在油灯下彻夜讨论土地纲领的面孔，如今被贴在每一个警察局的墙上，画像下面只有通缉。有一些人逃进了普里皮亚季河沿岸的密林深处，带着油印机、几支手枪和那些关于土地与自由的旧梦\n也许他们会在篝火旁继续压低声音讨论着同一个问题：我们到底在哪一步走错了。"
 WHR_loyal_rada:0 "迫使中央拉达服从"
 WHR_loyal_rada_desc:0 "中央拉达的老人们中的许多人还记得十几年前那个阴云低垂的早晨，当独立宣言在德军占领下的明斯克被颤抖地朗读出来时，窗外正走过一列德国巡逻队，刺刀在灰蒙蒙的光线里泛着冷光。\n此后的二十年是一段漫长的周旋史：在白俄罗斯民族主义与帝国现实之间小心翼翼地走钢丝，在尊严与生存之间反复权衡，在所有重大议题上学会了一个苦涩的本领——把真心话咽回去，说出一套不会让柏林皱眉的外交辞令。当总督府的召见函在那个秋天送到拉达主席团手中时，有人试图在闭门会议中坚持立场，但声音像投入深井的石子。\n帝国东方事务部早已把白俄罗斯的未来写进了一份编号严谨的备忘录，拉达的角色被精确地限缩为一行德文注释：斡旋机构，而非政府。第二天的公报里，拉达宣布全权委托总督府恢复秩序。"
 WHR_fruit_of_loyalty:0 "忠诚自有奖赏"
 WHR_fruit_of_loyalty_desc:0 "总督府带来的是一种德国式的务实慷慨，如同经验丰富的猎场看守人懂得在严冬给忠诚的猎犬留下最肥美的骨头。那些在社民党乱政时期紧闭庄园大门、在窗帘后面焦灼地等待风暴过去的白俄罗斯大地主们，忽然发现敲门声不再是农工联盟征粮队的粗暴捶打，而是德国副官彬彬有礼的指关节，带着总督的问候和一份用烫金字体印制的合作方案。顺从的庄园获得驻军保护，顺从的议员在地方自治机构里谋得擦拭一新的办公室，顺从的商行拿到了向帝国驻军供应皮革、谷物和亚麻的长期合同。"
 WHR_begin_germanization:0 "开始日耳曼化"
 WHR_begin_germanization_desc:0 "学校的铃声照常响起，但孩子们翻开的新课本里，白俄罗斯语的铅字旁边整整齐齐地印着藤蔓一般哥特体的德文释义。本地教师被集中到明斯克的一所原神学院里接受培训，学习用德语讲授历史、地理和自然常识，新编的教材轻柔而坚决地将白俄罗斯的过去织入日耳曼叙事的经纬——讲到波洛茨克公国时会不经意地提及汉萨同盟的商路曾经延伸到这些土地，描述民间童话时会以学术性的口吻标注格林兄弟对斯拉夫民间文学素材所做的收集工作。明斯克的街道从德国侨民聚集的几条街区开始悄然更换路牌，那些用西里尔字母书写的旧名字被一块一块摘下来，换上哥特体的新铭牌，然后这股更名潮像墨水洇纸一般漫延到商业街、行政区和教堂门前的布告栏。神父们开始在用白俄罗斯语布道之后加上一段德语的祝福。而那些聚集在村口磨坊旁的白发老人们，他们正在用越来越低沉的嗓音讲述祖辈时代的故事，像守护一簇在冬夜里被四面寒风围困的火焰……"
 WHR_power_to_the_locals:0 "向当地人放权"
 WHR_power_to_the_locals_desc:0 "紧绷的缰绳也需要偶尔松弛一寸，这是所有骑手都懂得的道理，而总督府深谙统治的精妙在于让受治者以为自己也在执辔。地方自治委员会的职权被以一种精心策划的慷慨扩大了，白俄罗斯面孔前所未有地出现在市议会、区公所和新建的经济协调机构的花名册上，他们在开幕典礼上剪彩时露出恰到好处的微笑，在文件上用白俄罗斯语签署自己的全名，在本地报纸的头版刊登照片并配以简短的履历介绍。然而每一项真正权力的行使都如影随形地跟着一位德语翻译、一名顾问或一位谦虚地自称联络官却持有帝国安全部门签发的特别通行证的官员。白俄罗斯语的声音确实多了起来，在走廊里，在接待室里，在各种委员会的茶歇间隙里随处可以听见，但这只是一种音量上的慷慨施舍，我们都知道的。"
 WHR_german_priviliges:0 "德国人享特权"
 WHR_german_priviliges_desc:0 "帝国公民在东方从未如此体会到血统的重量：自从奥伯奥斯特军政府时代第一批德国商人沿军用铁路线深入这片土地开设锯木厂和亚麻收购站，白俄罗斯的德语社群便像一层薄薄的油膜浮在水面，始终清晰可辨，始终不曾真正融入。如今他们被称为东疆德意志人，这个称号本身便是一种法律地位，铭刻在采购合同的优先条款里、在减税名册的页边空白处、在大学录取名额的心照不宣的配额线上。明斯克最好的河景住宅由一个德意志侨民合作基金统一托管，傍晚的德国俱乐部里，壁炉的松木烧得噼啪作响，白兰地的琥珀色光泽在玻璃杯里晃动，人们谈论白俄罗斯木材的出口税率、东方防线新增驻军的番号，以及遥远柏林歌剧院秋季排演的《特里斯坦与伊索尔德》的舞美设计。\n而隔几条街的平民酒馆里，白俄罗斯工人们喝着一戈比一杯的克瓦斯，用一种刻意压到最低的嗓音交换着从莫斯科方向断断续续传来的无线电消息，好像老鼠在墙后窸窣作响。"
 WHR_invite_german_company:0 "邀请德国公司"
 WHR_invite_german_company_desc:0 "帝国的资本像春天融雪后的洪汛，从西向东缓慢而不可阻挡地漫过白俄罗斯辽阔的平原。克虏伯的勘察队在普里皮亚季河上游的沼泽地带标定铁矿脉的走向，西门子的工程师们在泥泞的驿道旁竖起一根接一根的电报线杆，细长的影子落在刚刚翻耕过的黑钙土上，像一排正在书写什么的笔尖；德意志银行的分行用一套精密如钟表内部结构的信贷工具将本地手工业者和原料商人纳入帝国马克的流通循环，那些曾经只懂得以物易物或用早已贬值的旧卢布交易的人们，如今学会了在德文合同上签下自己歪歪扭扭的名字。明斯克郊外第一家现代纺织厂投产的那个早晨，总督亲自剪彩，从四乡八里赶来围观的农民们站在厂区的新砌围墙外面，透过铁栅栏大门望着那些来自萨克森的机器不知疲倦地吞吐亚麻，一个裹着羊皮袄的老人低叹道：这些德国人的铁玩意儿，比全村一百双手加起来还快不知道不少倍……"
 WHR_overthrow_land_reform:0 "弘扬军国主义"
 WHR_overthrow_land_reform_desc:0 "“东墙”，白俄罗斯被寄予了超出一个傀儡国通常分量的厚望：它将不仅仅是地图上那片涂抹成德国同色系的缓冲地带，而是一座武装到牙齿的军事前哨，一片能够像心脏泵血一样源源不断向前线输送兵源和补给的后方基地。义务兵役的年龄门槛在行政命令中悄然下调，村庄里最年轻的一批儿子——那些几年前还在赤脚追赶鹅群的少年——接到了征召令，被军用卡车运往布列斯特和鲍里索夫郊外新建的训练营地，在那里，德国教官用浓重口音喊出的白俄罗斯语队列口令在操场上空日夜回荡。从沃尔科维斯克到波洛茨克的少年们在尘土飞扬的操场上学习正步、瞄准和向着德皇的巨幅画像庄严宣誓，明斯克街头的征兵海报上，一个身着德式军装的白俄罗斯青年正以坚毅的目光凝视远方，海报下沿印着一行白俄罗斯文字：保卫边界，就是保卫你父亲屋檐下的炉火。\n母亲们把儿子送到村口驿站的马车旁，粗糙的手掌在儿子脸颊上停留了很久，有些人想起了二十多年前那些同样被征召、同样登上东行列车、从此消失在历史缝隙中的父辈——只是那一代人穿的是沙俄的灰军装，去打的，是另一场战争，为了另一个皇帝。"
 WHR_fortify_bunkers:0 "强化东方防线"
 WHR_fortify_bunkers_desc:0 "俄罗斯人是我们东方的暴君与最大的威胁，只有与友邦团结合作，不断巩固防御工事才能够保证白俄罗斯的最基本安全。"
 WHR_massive_privatlization:0 "大规模私有化"
 WHR_massive_privatlization_desc:0 "帝国的经济专家们从柏林搭乘专机来到明斯克，只用了三天就得出一致结论：这片土地的一切都处于一种令人难以忍受的法律模糊状态。沙俄时代遗留的贵族产权在世界大战和随后的革命风暴中灰飞烟灭，后继的克伦斯基临时政府、德军占领当局、短命的白俄罗斯民族共和国和布尔什维克的溃败部队留下了层层叠叠互相矛盾的地契、公告和口头承诺，那些广袤的森林、草场和肥沃的黑钙土耕地，在法律上属于所有人，在现实中不属于任何人。总督府决定以德式效率终结这种暧昧，一份措辞简洁的私有化法令公布后，国有土地以近乎象征性的底价挂牌出售，竞拍大厅里回荡着德语和少数几个与总督府关系密切的白俄罗斯地主的报价声，拍卖槌一声接一声落下，土地登记簿的纸页被迅速翻过，新增了数百个日耳曼姓氏。原来的耕种者们收到了措辞礼貌却毫无商量余地的通知：可以继续住在这片你祖父开垦、你父亲耕种、你在上面学会走路的土地上，但是身份将从自耕农变更为佃农，或者，你可以收拾行李去新开的纺织厂和锯木厂寻找生计，那里的日薪据说足够在明斯克工人区的出租公寓里租一间没有窗户的地下室。"
 WHR_appealing_to_german_immigrants:0 "吸引德国移民"
 WHR_appealing_to_german_immigrants_desc:0 "东进，这个沉睡在德意志民族集体记忆深处、可以追溯到中世纪条顿骑士团和汉萨同盟向波罗的海沿岸拓殖年代的古老冲动，在二十世纪三十年代的帝国被重新唤醒并赋予了一套现代官僚体系的精密包装。柏林各大报纸的广告版面上刊登着白俄罗斯土地的招揽启事，措辞让人联想起十二世纪那些号召拓殖者前往东方定居的修道院文书：肥沃的黑钙土，充足的水源，帝国军队的永恒庇护，诚邀拥有专业技能与开拓精神的德意志家庭申请移民配额。帝国移民协会组织了整列火车的移民队伍从波美拉尼亚、西里西亚和萨克森驶出，车厢里挤满了世代在贫瘠小块田地上精耕细作却始终不得温饱的农民家庭，也搭载着测绘工程师、兽医、中学教师和满怀雄心壮志的年轻化学家。明斯克火车站的月台为每一批抵达的移民准备了简朴而庄重的欢迎仪式，铜管乐队演奏着《守望莱茵》，总督或他的副手亲自致辞，地方报纸的摄影记者用镁光灯捕捉德意志家庭在白俄罗斯天空下的第一张全家福……\n一位来自但泽郊外的工程师在抵达当晚写给留在故乡的未婚妻的信中描述道：这里的土地平坦得令人想起普鲁士的故乡，天空低垂在无边无际的田野上方，镶着一圈冬天将至的铅灰色，只是那些木头教堂的洋葱形圆顶不断提醒你，这是另一片大地，人们沉默寡言，用你听不懂的语言向一个你从未见过的上帝祈祷。"
 WHR_belarus_loyal_and_strong:0 "白俄罗斯忠诚而强大"
 WHR_belarus_loyal_and_strong_desc:0 "这个诞生于在德皇陛下军队的默许下匆忙宣布建国的年轻国家，在蹚过了社民党人天真而混乱的民主实验、农工联盟充满激情却注定短命的街头梦想、中央拉达没完没了的议程争吵和一长串走马灯般更迭的短命内阁之后，终于在一片筋疲力尽的沉默中安顿了下来。白红白的三色旗与帝国黑白红三色鹰旗并排垂挂在政府大楼的正立面，巡逻队的军靴整齐地踏过明斯克宽阔的中央大道，工厂的烟囱向灰蒙蒙的天空吐出绵延不绝的烟柱，教堂的钟声与德国校歌的旋律在黄昏的空气里交替回荡。农民们学会了在征兵站前耐心排队，在德文合同的最下端用蘸水笔小心翼翼地写下自己仅会写的几个字母，在边境哨卡探照灯刺眼的白光下用学会的几句德语回答盘问。总督合上满载柏林嘉奖的电报夹，走到窗前点燃一支烟，斯维斯洛奇河在他脚下静静流淌，河面上映着冬日铅灰色天空的最后一点微光，如同一面黯淡的锡箔……\n看来帝国东部边境最大的工程已经悄然竣工了。"
