 WHR_dawn_of_new_belarus:0 "新白俄罗斯的黎明"
 WHR_dawn_of_new_belarus_desc:0 "曾经的左翼社会革命党人与布尔什维克，如今的国家工团党领导人，法比安·阿金契奇成功颠覆了他前盟友的君主独裁政权。历经与外国资本势力及堕落浪潮的鏖战，真正的白俄罗斯子孙终于成为了自己的血脉与土地的主人。觉醒吧，白俄罗斯人！我国历史最黑暗的时刻已经过去了，黎明正等待着我们！"
 WHR_solidify_control:0 "控制国家机构"
 WHR_solidify_control_desc:0 "西吉斯蒙德政府已然垮台，但他的走狗——白俄罗斯秘密警察仍然潜伏于阴影中，随时准备对我们发动致命一击，请回他们那狼狈逃到危地马拉封地的主子。这绝不会发生——每一个农民都将成为我们的帮手，每一个家庭主妇都是我们的特工。在忠诚的白俄罗斯男男女女的帮助下，这些杂碎的下场除了灰溜溜地回到柏林之外，就是沉入沼泽地之中。"
 WHR_populist_policy:0 "民粹主义政策"
 WHR_populist_policy_desc:0 "谁有资格统治白俄罗斯？只有人民。国王与农工联盟没有倾听民众的声音，自恃为只承载真理的光荣先知，这必然会导致对体制的滥用。多谢了他们，我们的无产阶级一直处于愚昧无知的状态。新的白俄罗斯应该成为一个为人民服务且由人民组成的政府。新的政府架构，哪怕是最普通农民也能轻易理解。新的白俄罗斯将永远为白俄罗斯人民服务。"
 WHR_national_collective:0 "民族共同体"
 WHR_national_collective_desc:0 "一个民族！一个国家！唯有民族团结才是真正的统一！当外族觊觎我们的灭亡时，为何要自相残杀？存在的只有民族间争夺主导权的斗争，胜负将由最英勇民族的集体意志决定。我们决不能在即将到来的斗争中失败。因此让我们做好准备！所有白俄罗斯无产者都必须为国家与民族无私奉献，而国家也将毫不吝啬地报答他们。"
 WHR_end_rada:0 "终结拉达"
 WHR_end_rada_desc:0 "哦，拉达——无能之徒的老巢，资产阶级的白手套，一切镇压人民法律的产出地。农工联盟沉溺于自由民主的幻想之中，但我们看的比他们远；拉达可曾做过有利于白俄罗斯人民的事？脑满肠肥衣着华丽的议员沉溺奢靡，可曾听见饥儿父母撕心裂肺的哀嚎？可曾感受农夫徒手驯服沼泽的绝望？愤怒的烈焰已经被点燃，而资产阶级民主将第一个被烧成灰烬。"
 WHR_national_syndicalism:0 "回归国家工团主义本源"
 WHR_national_syndicalism_desc:0 "虽说社会革命党过于无能，布尔什维克只不过是接过了沙皇的鞭子，但在西欧，乔治·瓦卢瓦与奥斯瓦尔德·莫斯利的思想却给出了另一份答卷，而这正是我们所应该学习的：白俄罗斯不容任何形式的资产阶级存在——无论是本土的还是外来的，地主阶级还是城市资产阶级。我们将打击所有形式的资产阶级，我们不会对阶级和民族的敌人有丝毫怜悯。"
 WHR_national_populism:0 "坚持国家民粹主义原则"
 WHR_national_populism_desc:0 "社会主义者许下空中楼阁般的承诺，却只兑现了镀金的谎言，社会革命党，布尔什维克，再到农工联盟，左翼思想一次又一次让白俄罗斯人民心寒。难道我们不该看得更远吗？更深入吗？白俄罗斯人民不应以阶级划分，而应通过血脉、文化和共同事业团结起来，真正的白俄罗斯民族精神将不再忍受蛊惑民心的社会主义思想的荼毒。"
 WHR_total_land_reform:0 "全面土地改革"
 WHR_total_land_reform_desc:0 "有一种祸患，比霍乱更致命，比牛虻更恼人，在社会各阶层蔓延的程度超过任何害虫：地主如同吸血鬼般吸食我们民族的鲜血与生命力。对待这种顽疾，必须用尽一切手段根除。一场全面而彻底，比农工联盟的任何提案都激进上百倍的土地改革将会立刻开始。这些罪人将血汗赎罪，延续数百年的系统性压迫，必须用同样漫长的岁月来偿还。唯有洗净祖先的罪孽，方能获得宽恕。"
 WHR_alliance_with_BSDP:0 "合并社会主义政党"
 WHR_alliance_with_BSDP_desc:0 "还记得那些为白俄罗斯独立，高呼打倒沙皇的口号的时光吗，社会革命党的同志们？如果没有他们的帮助，我们决没有可能推翻德国国王嫁给我们的暴政。至于农工联盟，他们虽然无能，中了自由民主之毒，但仍是为白俄罗斯人民而奋斗。为了新政权的稳定，一个囊括所有社会主义政党（当然，布尔什维克除外）的政治联盟将会建立起来，一同建设社会主义。"
 WHR_promote_belarussian_nationalism:0 "白俄罗斯民族主义"
 WHR_promote_belarussian_nationalism_desc:0 "白俄罗斯虽始终夹在波兰与俄罗斯之间，我们仍孕育了独特的语言、文化与艺术。我们才是斯拉夫文明的正统守护者。波兰人夸耀其影响力，俄罗斯人标榜欧亚双重属性，而我们呢？我们完整保存了古老的斯拉夫传统，既未扭曲其本质，亦未使精神臣服于东西方任何势力。我们不是立陶宛人，不是波兰人，更不是俄罗斯人。我们就是我们，我们是白俄罗斯人！"
 WHR_nationalist_union:0 "极右翼联盟"
 WHR_nationalist_union_desc:0 "随着我们决定疏远社会主义运动，是时候开始考虑与极右翼势力进行更多接触了。拉斯托夫斯基的克里维亚主义运动与维图什卡率领的黑猫分队，都可以成为我们的盟友。在这些盟友的帮助之下，我们的新白俄罗斯将以永世长存的形态，在新的光芒中重生。白俄罗斯战士已整装待发，随时准备光复白俄罗斯的荣耀。"
 WHR_end_jewish_threat:0 "摧毁犹太威胁"
 WHR_end_jewish_threat_desc:0 "犹太人在我国境内构建独立飞地已是不争事实。他们漠视我国律法，唯以族裔亲缘为念。他们的习俗与法律相悖，自我隔离拒绝融入社会，崩得也许是社会主义者，但终究是大卫之星的仆从。是时候让他们离开我们的国家了，所有犹太人都将被驱逐出境。再见了，上帝唯一的选民们！出门的时候小心别让门框撞到你！"
 WHR_belarus_youth_union:0 "白俄罗斯青年联盟"
 WHR_belarus_youth_union_desc:0 "我们民族的希望之花乃是这样一些人——年轻、纯洁而志向远大。让青年茁壮成长吧！所有的白俄罗斯青年都必须加入白俄罗斯青年联盟。我们无法仰赖经验丰富的士兵、炮火支援或碾压敌军的钢铁洪流，我们只能依靠这些青年；这些乡野少年素来骁勇善战，而他们的热血至今未被尽数激发。何不以其青春热忱为我们的军队注入力量？"
 WHR_national_arsenal:0 "国家军工厂"
 WHR_national_arsenal_desc:0 "白俄罗斯必须实现国家现代化，不能成为国际社会的弃儿、地图上的无名角落！但我们决不能缓慢但稳定地从基础做起——假如没有军事工业，白俄罗斯将如何生产足以武装人民的武器？假如没有枪支，就算再勇敢的白俄罗斯人，又怎么可能与武装到牙齿的敌人抗衡？步枪，子弹，火炮——这才是对于白俄罗斯而言最重要的工业产品！"
 WHR_resource_nationalization:0 "资源国有化"
 WHR_resource_nationalization_desc:0 "长期以来，由于缺乏技术与资金，白俄罗斯的宝贵资源遭到德国公司的掠夺。不能再这样下去了！白俄罗斯的每一棵树木，每一块矿石都应该属于白俄罗斯！资源国有化法令将会立刻开始实行，所有的资源都将用来建设白俄罗斯的工业与农业，而不是用来填满外国资本永无止境的欲望！"
 WHR_class_struggle:0 "阶级斗争"
 WHR_class_struggle_desc:0 "我们作为无产阶级国家和社会主义政权，必须坚持马克思主义的智慧。通往社会主义和民族主义的道路必须是笔直而坚定的。地主还在鱼肉乡里的时候，可曾对农民的苦难抱有过一丝一毫的同情？资产阶级还在掌权的时候，可曾采取过半点措施改善工人的处境吗？既然如此，又何必为他们留情面？寄生虫们将会品尝到无产阶级上百年积压的怒火。"
 WHR_class_cooperate:0 "阶级合作"
 WHR_class_cooperate_desc:0 "必须明确，白俄罗斯无产阶级与本国雇主的关系，比与那些垂涎我国土地的俄国工人的关系更为紧密！不存在什么工人阵线，只有全体白俄罗斯同胞的统一阵线。我们的管理者在薪酬分配上难道不公正合理吗？我们的工人可曾缺乏什么？我们的农民难道不满意自己的土地和劳动果实？消灭剥削的唯一方式就是实现工人与企业的合作！"
 WHR_surrounded_by_enemy:0 "四周皆敌"
 WHR_surrounded_by_enemy_desc:0 "东部城镇里满是波兰天主教徒，南部沼泽地里则有乌克兰少数民族，莫斯科的鞑靼-蒙古部落仍然对我们，真正的斯拉夫部落虎视眈眈，更别提曾经打着解放的名号奴役我们的德国佬了。我们没有人能依靠，能依靠的只有白俄罗斯人民。我们随时监视着我们邻居的动向，只要他们敢轻举妄动，犯我疆界，必将大败而归。"
 WHR_belarus_strong_and_independent:0 "白俄罗斯强大且独立"
 WHR_belarus_strong_and_independent_desc:0 "白俄罗斯如今已不再是一个缺乏身份认同的国家。在国家工团党的建设下，白俄罗斯取得了前所未有的成就，并已准备好在世界舞台上大展拳脚了。"
 belarus.47.t:0 "深红支流的涌动"
 belarus.47.desc:0 "人类对进步的追求永远不会改变，即使是在最腐朽、最堕落的国家也不缺乏追逐太阳者，即使这条路上注定被死亡缠身、注定被血海吞没，先行者们也会毫不畏惧的从一个死亡走向另一个死亡，而法比扬·阿金契奇正是其中一员。\n\n亲眼见证着祖国的重生与堕落，法比扬·阿金契奇无比绝望，布尔什维克死在了红十月，连同带着民族自治的希望一同远去，资产阶级政府卷土重来，本以为祖国注定无法争得自由，但德国人却给了他希望，白俄罗斯没有被俄罗斯雄鹰一把掐死，而是得以在普鲁士人的庇护下挣扎求生，但德国人所作的一切并非出于良心，他们把来自普鲁士的伪君推上了王位，对国内的进步势力进行大规模的搜捕与屠杀。在不断的躲避追捕的过程中，法比扬·阿金契奇被国家工团主义所吸引，民族重生的理念正好契合法比扬·阿金契奇的梦想来自意大利、西班牙、法兰西智者们的思潮不断涌向他的思维，促使他推出属于白俄罗斯民族的纲领，一套融合了左翼社会革命党和国家工团主义的奇特理论。\n\n法比扬·阿金契奇从未想过胜利来的如此突然，白俄罗斯国家工团党不费吹灰之力就夺取了白俄罗斯的政权，而他也顺理成章的坐上了最高领袖的位置。在回归了国家工团主义本源之后，先前肆意缝合的纲领涌现出了它的弊端，国家工团主义的理念与左翼社会革命党的纲领产生了冲突，他必须对将纲领进行重新修订，而来自法兰西公社的索雷尔主义、西班牙的新理论国家工团主义、经过安布里斯兄弟重新修订的改良宪章极权主义则是首选，现在，白俄罗斯的深红未来站在了四条岔路口中间，全白俄罗斯都在等待舵手确定航线......"
 belarus.47.a:0 "......白俄巨轮将驶向索雷尔主义"
 belarus.47.b:0 "......改良宪章极权主义将会指引民族工人最本质的根源。"
 belarus.47.c:0 "......新理论国家工团主义将会卫护舵手与船员穿越暴风雨。"
 belarus.47.d:0 "......白俄将沿着国家工团主义的旧航线平稳航行。"
 WHR_workers_heliostate:0 "工人太阳会"
 WHR_workers_heliostate_desc:0 "明斯克的起义者们曾经信仰过许多种神明：农工联盟的人信仰选票，民族主义者信仰血统，社民党人信仰程序与辩论。亚历山大·奇热夫斯基从这些废墟中走过时可没有携带任何一尊旧神的神像，只有一台纪录仪，一架他亲手组装的空气离子化装置，以及一本被翻旧的笔记本，封面上用铅笔写着一个词：太阳。奇热夫斯基望向窗外那些在电力短缺的漆黑街道上高举火把的人群，低声说出了后来印在所有海报上的话：“太阳从未停止照耀——是我们蹲在旧日阴影里不肯睁眼。”"
 WHR_destroy_reactionary:0 "肃清反动派"
 WHR_destroy_reactionary_desc:0 "历代的压迫者从不惧怕农民的草叉，他们惧怕光。反动派们曾借着帝国总督的余灰与拉达的旧章程来定义白俄罗斯的土地，试图把历史的钟摆重新拖入旧日昏暗——不再费神与他们层层辩论，真理凭藉光辉剥离黑暗，反动派的退场恰似一滴水在正午的金属屋檐上蒸发。如今明斯克的天空下只剩一种权威，来自那颗距离我们一亿五千万公里、却比一切腐朽大地更亲近人民的恒星。"
 WHR_sunlight_electricity_life:0 "阳光，电力，生命"
 WHR_sunlight_electricity_life_desc:0 "奇热夫斯基在旧实验室里向第一批学员演示电子的轨迹时，没有人能理解他眼中的激动。他谈论的是宇宙射线穿透大气层时激发出生命火花的那一瞬，是每一片绿叶将光子转化为能量的那个永恒正在发生的奇迹……向白俄罗斯宣告：阳光不是某种农业生产的外部条件，阳光即是一切。\n电子学研究中心在一座废弃的纺织厂里挂牌成立，每一片镀铬的反光板都精准地校准向太阳，那是齐热夫斯基给白俄罗斯连上的脐带。"
 WHR_air_deionized:0 "扩大空气负离子化实验"
 WHR_air_deionized_desc:0 "呼吸曾经是农民的苦役——那是混合着沼泽瘴气、工厂煤灰与潮湿麦秆的气体。可奇热夫斯基坚信，负离子化能将最污浊的空气化为灵魂的催化剂。于是白俄罗斯诞生了空前壮阔的唯科教工程。“奇热夫斯基吊灯”从实验室的天花板来到了会议大厅、工厂食堂、乃至每一个集体农庄的磨坊，那些缠绕的细金属丝在电流的抚触下静静发光，吐出一种存在于瀑布和雷雨之后的那种滋味。人们得在呼吸这件事情上重新开始信点什么。有人半夜醒来，从敞开的窗口嗅到了一丝清新的空气，于是默默弯下腰，将头埋进双掌间。"
 WHR_improve_housing_enviroment:0 "改善住宅环境"
 WHR_improve_housing_enviroment_desc:0 "泥土的路，茅草的檐，几代人挤在一间被灶烟熏黑的木屋里……那是旧白俄罗斯留给民众的全部记忆。农业社会的阴湿已浸透了白俄罗斯的骨骼经络，奇热夫斯基对此无法容忍。工人太阳会全面推进电气化住宅，混凝土预制板从新工厂的流水线上源源不断滑出，每一块都被赋予了标准化的日光采集窗。新落成的公社大楼里消灭了蜡烛煤油灯，墙内嵌入了负离子发生导管。儿童们第一次在光亮如昼的房间里翻开课本，那些曾经被煤油烟熏得早衰的脸庞，如今映着电灯的白光，显得如此年轻呵。"
 WHR_follow_footstep_of_sun:0 "紧跟太阳步伐"
 WHR_follow_footstep_of_sun_desc:0 "太阳的运行存在节律，这事奇热夫斯基在二十年前就已验证过——每十一年一轮的耀斑周期，左右着斯摩棱斯克的暴动、波罗的海的罢工潮、乃至中欧版图上的战争频率。工人太阳会据此绘制了一张崭新的政治时钟：它的刻度不是小时，而是太阳黑子的活跃指数；它的节气不是春分秋分，而是日冕物质抛射的高峰季与低谷季。白俄罗斯的民众被引导着去解读每日清晨发布的天文公报，从光球层的每一次异动中辨认出自己应当蓄力还是出击。政治稳定就这样诡异而宁静的脱离了对警棍的依赖，国家在太阳的节奏中自行呼吸，我们的动荡年代被驯服在宇宙的韵律里。"
 WHR_heliobiology:0 "运用日光生物学"
 WHR_heliobiology_desc:0 "箴言：战争是太阳引发的另一种潮汐。白俄罗斯的兵工厂如今将科学牧师的这项发现刻印在每一枚弹壳上。日光生物学实验室由军队直接接管，它们负责根据太阳活动的预报来决定坦克列装的进度与弹药库配置的方向。军备设计局开始研究如何让装甲涂层的吸热曲线与太阳辐射谱产生共振，军医处将士兵的血液指标与日球层数据实时对标。军队本身已经成为一具灵敏的日照感应器官。那些站在兵营院中擦枪的年轻士兵们不再只看向地平线，他们久久注视着太阳，感知着太阳正把作战的意志，直接灌注进他们握紧枪托的骨节中。\n伟大的太阳啊，为每一寸的我的念想……"
 WHR_forced_education:0 "强制普及教育"
 WHR_forced_education_desc:0 "工人太阳会相信不识字的眼睛无法直视太阳。于是一场令过往一切识字运动都相形见绌的巨型扫盲行动展开了……这是一场不计代价的强行军，白俄罗斯的每一间谷仓都被征用成了临时教室，帝国时代遗留下来的神职人员、拉达时代的旧教员全被重新编入速成师资队伍中。课程表经过了重新编排：早上的第一课永远是观测——观测日光、测算日影、学习用分光镜分解每一道晨光……于是孩子们在作业本上用稚嫩的笔迹写下同一个命题：人是属于太阳的，太阳也属于人。整个民族在极端短的时间里完成了从文盲遍地到有大量专业人群能够参与天体物理学讨论的飞跃……啊，我们终于开始说话了。"
 WHR_utilize_revolutionary_chaos:0 "利用动荡年代"
 WHR_utilize_revolutionary_chaos_desc:0 "兵荒马乱不是灾难！动荡是宇宙赠予革命者的最高加速度。旧时代的财产被宣告为抵押给黑暗的过期债务，那些顽固抵制太阳会的工厂主和旧地主在一个清晨醒来，发现他们的车间被阳光晒得透亮，工人们已经在没有监工的情况下启动了机器。大型加速主义生产宣传画贴满了各大城市的火车站，画面上是太阳与强壮工人臂膀的重叠剪影，标语简洁而致命：“光在哪里，力就在哪里”。整个白俄罗斯被这种狂热的生产节奏推向高亢境地，熔炉不熄，铁锤不歇，一切来自旧世界的私产与陈腐制度，全被扔进烈焰中央，化为了那台加速器底部的燃料！"
 WHR_war_of_liberation:0 "准备解放之战"
 WHR_war_of_liberation_desc:0 "整个东欧平原的火药桶已经堆积了几个世纪，现在只等太阳那颗火星。启动最彻底的集中动员：农田边缘的联合收割机厂房在一夜之间转产弹药，每个国有农场都设置了军事训练站，每周工时的一部分被专门划出来用于操练队列和射击预习。广播里一遍遍播报动员令：就是中央气象局出具的日照预测——人们心知肚明，当日瓤活跃度达到某个阈值时，就是我们出发的时刻。那些在日光生物学实验室里日夜监测数据的技术员们，每记录下一次日冕物质抛射，便在墙上的地图上多画一道红线，从明斯克向东延伸，穿过斯摩棱斯克，穿过莫斯科，最终消失在欧亚大陆的边缘……"
 WHR_solar_laser_satelite:0 "以光为兵"
 WHR_solar_laser_satelite_desc:0 "我们就相信阳光是一支军队。当敌人潜伏在战壕里，阳光便是一位斥候，能读取他们最细微的热量痕迹；当冲锋号吹响，阳光便是一位炮术教官，为每一发炮弹校准着轨迹。新兵入伍宣誓不需手按圣经或宪法，而是将右手伸向正午最炽烈的日光。随军的光学工程师们为步兵开发了单兵镜阵列，让每个战士都能用聚光信号在无线电静默中传递指令；战车被涂上了一层能随紫外线强度变色的涂层，在战场上像活物一样呼吸。这支军队的敌人惧怕的已不是什么白俄罗斯的子弹——他们惧怕的是走在太阳的士兵头顶的那团恒定燃烧的可畏力量……仿佛整个太阳系都在为这支军队提供火力掩护。"
 WHR_transhumanism:0 "超越人类"
 WHR_transhumanism_desc:0 "红色的血球、古老的村落方言、烙印在姓氏里的民族记忆——这一切工人太阳会都将其视为人类还在爬行阶段的遗留物。如果人的祖先是从海洋中爬出的，那么人的未来就必须挣脱自己亲手编织的那件叫做“民族国家”的旧皮囊。奇热夫斯基的追随者们开始注射血清，开始记录自己暴露于电离辐射增量后的认知变化。超人类主义的宣传画上画着一个渐渐褪去肤色的半透明人形，正从白俄罗斯的版图上站起来，朝着大气层之外的宇宙空间迈出第一步。\n有人哭泣，有人跪下，但更多人只是沉默地卷起袖子，露出臂弯上那些接受了光照干预后留下的小块焦痕。他们正在成为某种更炽热的存在，脱离那副从黑土地里长出来的旧躯壳，向着宇宙的第一推动力归回而行，我们拒绝停下。"
 WHR_break_the_thorns:0 "冲破荆棘……"
 WHR_break_the_thorns_desc:0 "过往各个部落与派系喋喋不休建造的精神牢笼——他们的经文、他们的民间传说、他们各自引以为傲却引来无尽仇杀的山头主义——已经走到了彻底的尽头！\n思想不过是宇宙射线投射在人类脑灰质上的影子工人太阳会将这影子校准为同一个方向整个国家的意志通过负离子化空气的呼吸通过日光教学大纲的重重编码通过每一场加速主义生产竞赛的节奏而趋向于同一频率此刻白罗斯从明斯克的中央实验室到最偏远的森林哨站从耄耋老人到刚刚学会观测日影的孩童所有人的意志都已收束为同束纯色的激光冲破荆棘丛生旧世界不过更增添一层尚未被照耀到的阴影——————————"
 WHR_to_the_stars:0 "……直抵群星"
 WHR_to_the_stars_desc:0 "白俄罗斯不再是一个国家！它是一座宏伟的发射塔，整个欧罗巴大陆上唯一一座正在升空的发射塔！校准完毕的激光从明斯克的研究所射向天顶，白俄罗斯向全世界发去了不再以外交辞令包裹的通告：我们是全球无产阶级的太阳教会，我们肩负着把太阳的秩序播种到每一个尚未被照耀的角落的使命。首先走向欧罗巴与亚细亚，到地球最远的岛屿歇脚，十步并一步跨入星座之间！\n我们不会停下，我们终将到达。"
