 belarus.46.t:0 "面包房之夜"
 belarus.46.desc:0 "明斯克的冬夜被蒸汽与怒火点燃。法比安·阿金契奇站在圣灵大教堂的钟楼阴影里，看着鹅毛大雪中飘摇的印着剑与橡树叶的旗帜从面包房二楼窗口刺出——那是他们约定的最终信号。\n\n十二辆满载麦麸的军用卡车正在中央大街抛锚，戴蓝袖章的士兵们突然发现，平日佝偻着背揉面的面包师傅们，此刻正握着火钳与擀面杖组成人墙。老伊万的面粉围裙上还沾着酵母，他颤抖的右手却稳稳举着沙皇时代的燧发枪。\n\n"告诉国王陛下，"法比安的声音通过市政厅的扩音器在寒夜里炸响，"他的面包师们决定换种配方,一种白俄罗斯本地的配方！"\n\n当士兵调转枪口，白俄罗斯秘密警察与皇家卫队逃散之时，法比安知道赌局已赢。当第一缕晨光刺破云层时，愤怒的人群冲进了西吉斯蒙德的宫殿，发泄着蛰伏了三个世纪的野火，却没有发现国王本人的踪迹。“别管霍亨索伦家的走狗了。”法比安·阿金契奇对他的同胞们说道，"
 belarus.46.a:0 "“一个崭新的白俄罗斯于今日诞生了。”"
 belarus.52.t:0 "意外"
 belarus.52.desc:0 "威廉·库贝总督的指甲深深掐进橡木办公桌，泛黄的人种测量表在台灯下渗出诡异的青蓝。当第三滴冷汗坠落在"白俄罗斯样本纯度98.7%"的字样上时，库贝绝望地瘫坐在椅子上。"这不可能..."他扯开领口的十字勋章，金属边缘在基因图谱上划出猩红痕迹。那些他亲自从明斯克大学找来的人类学档案，此刻在月光下泛着珍珠色的冷光。\n\n“我之前做的一切，难道不是对祖先的亵渎吗？！”\n\n总督颤抖着砸碎镀金相框，威廉二世授予的委任状在玻璃渣中蜷缩。他突然意识到办公室的哥特式拱顶从未如此低垂，那些雕刻在石柱上的日耳曼英雄浮雕，分明长着斯拉夫人的宽颧骨。库贝徒劳地用红铅笔疯狂划割白俄罗斯民歌集，却发现五线谱上的音符正顺着墨水渗入自己的血管。墙上画作中的雅利安人的金发逐渐褪成亚麻色，自己的普鲁士口音开始混杂着波兰语腔调。\n\n黎明前最黑暗的时刻，总督府地下室传来瓷器破碎的巨响。卫兵们冲进藏书室时，看见库贝正用一夜未眠的空洞双眼盯着他们。当卫兵询问他发生了什么时，威廉·库贝张开干裂的嘴唇，用颤抖的声音说道："
 belarus.52.a:0 "“我犯了一个错误，但一切还来得及。”"
 belarus.52.b:0 "§R“我犯了一个错误，而我必须为此付出代价。”§!"
 WHR_YOU_ARE_MAD: "§R我来并不是叫地上太平，乃是叫地上动刀兵。§!"
 belarus.48.t:0 "邪教继续活动"
 belarus.48.desc:0 "看上去维图什卡似乎胜利了，没有人胆敢反对他，不过还有一点小问题。向白俄罗斯新任领导人递交的报告表明，尽管邪教的领导人亚历山大·波格丹诺夫已经被捕，但他们似乎推选出了新的领导人，并已经开始尝试推翻政府。尽管如此，新任独裁者的心腹递上的一份简短报告声称，局势或多或少都在控制之中。"
 belarus.48.a:0 "听起来挺可疑，但是不用担心。"
 belarus.48.b:0 "任何邪教，终将绳之以法！"
 belarus.49.t:0 "疯男革命"
 belarus.49.desc:0 "局势处于控制之中……还是正相反？不，局势绝非处于控制之下。\n乍一看混乱持续了数日甚至数星期。然而，在国家领导人对人民的死活毫不关心的情况下，一种信息病毒可以轻而易举填满整个空间。在这种情况下，在其他国家会被视为相当无关紧要的追随者圈子的事件一周之内发展成为组成完整的加速主义运动。这个所谓的“工人太阳会”现在拥有他们的新闻机关、准军事组织，以及蛊惑人心的煽动家，他们谴责维图什卡，宣称其应为巴瓦霍维茨的死负责，同时煽动明斯克人民罢工。并且最疯狂的是，人民确实这么做了。他们相信了这位疯先知。看来由疯男本人领导的数千疯子正在行进，他们武装到牙，目标直指政府区！"
 belarus.49.a:0 "奇热夫斯基万岁！"
 belarus.45.t:0 "总督问题"
 belarus.45.desc:0 "维尔纳·肯普夫只是一个普通的将领，之前从来没有任何管理国家的经验。柏林方面已经在考虑用当地高官，种族理论的信奉者威廉·库贝来替换他。"
 belarus.45.a:0 "库贝会当个好总督。"
 belarus.45.b:0 "没必要换人。"
 belarus.44.t:0 "政变"
 belarus.44.desc:0 "明斯克的冬夜被军靴踏碎。\n\n当议会厅穹顶上的双头鹰国徽第三次因枪托重击而震颤时，首相办公室的桃花心木门在防撞锤的冲击下轰然倒塌，雪粒混着火药味涌入的瞬间，雅泽普·阿达莫维奇看见年轻的国王站在近卫军黑色大衣组成的浪潮里，貂皮领口凝着霜花。\n\n近卫军用刺刀挑起壁炉里的文件，燃烧的纸页在空中翻飞如黑蝶。弗拉基米尔踩过灰烬，慢慢坐在了雅泽普的位子上。这么多年来，和自己亲弟弟争权搞得他筋疲力尽，一度被工团主义者推翻，而他的所谓大臣们把自己当成一个傀儡。如今，自己终于有机会将权力紧紧抓在自己手里。\n\n黎明前的钟声明斯克响起。雪地上，近卫军的皮靴印与囚车的车辙交织成新的权力图谱，而柏林来的电报正随着融雪渗入冬宫的大理石地缝。"
 belarus.44.a:0 "我再也不是傀儡了。"
 belarus.43.t:0 "争吵"
 belarus.43.desc:0 ""您要把德国人再请回来吗？"雅泽普·阿达莫维奇将文件拍在橡木桌上，震倒了插着黑麦穗的花瓶。国王的佩剑鞘尖挑起散落的文件，剑穗上的霍亨索伦家族纹章扫过首相鼻尖："知道为什么维斯瓦河的鲟鱼活不过冬天？因为它们总想逆流游向波罗的海。"\n\n雅泽普突然按住桌面他指尖摩挲着皇家计划委员会委员们联署的签名，声音混着地窖伏特加的辛辣："陛下可曾数过明斯克街头的货运马车？每辆德国货柜里都装着够买三个议会的钾盐！"\n\n弗拉基米尔听完当即起身准备离开，雅泽普的声音从后面传来："如果您真的对德国那么忠诚的话，也许我们该换一个国王了。"白俄罗斯人民的国王回过头来，说道："
 belarus.43.a:0 "“那我们走着瞧。”"
 belarus.43.b:0 "“也许……我们各退一步？”"
 belarus.43.b:0 "“我想……你是对的。”"
 WHR_kievrus_nazilol:0 "罗斯民族工人国"
 WHR_kievrus_nazilol_ADJ:0 "罗斯民族工人国"
 WHR_kievrus_nazilol_DEF:0 "罗斯民族工人国"
 WHR_schzios:0 "奇思妙想"
 WHR_schzios_desc:0 "月光浸透第聂伯河的时辰\n有人在沼泽腹地剖开一颗橡子\n里面没有果仁\n只有一只带鳞的瞳孔缓慢睁起\n凝视着比创世更古老的昏瞑\n\n他们用犁铧翻起黑土\n如成片的磷火\n十九世纪某个被绞死的先知\n遗落在泥炭层里的舌骨\n它还在说话呢\n\n……你是做梦了吗？\n\n有是声称在废弃的东正教堂地窖\n见到了亚历山大·涅夫斯基的圣像\n“啊天上没有金银！——\n啊地上没有神明！——”\n\n三条路从同一个针孔里延伸出来\n一条通向愈复不了的神智\n一条通向醒转不来的幻梦\n一条通向命名不得的恐怖\n那个针孔就在你的左眼瞳孔正中央\n在你读这些字的时候\n正在缓慢地\n扩大"
 WHR_finno_ugric_myth:0 "芬兰—乌戈尔之谜"
 WHR_finno_ugric_myth_desc:0 "我们曾经以为自己是斯拉夫人。我们曾经用斯拉夫人的字母书写，用斯拉夫人的礼仪敬拜，用斯拉夫人的嗓音在帝国和总督的夹缝中低声下气地乞讨一席之地。\n谎言。层层叠叠的谎言。\n在波列西耶沼泽最深处，在那些连德军测绘员都不屑标注的泥炭层下方，有人挖出了一枚骨哨。它不属于任何一支斯拉夫部落。它的音阶不在五度圈之内，它的材质是某种早已灭绝的北极驯鹿的胫骨，它的孔距与鄂毕河上游的汉特人祭礼用哨完全一致。吹响它的那个夜晚，明斯克一切斯拉夫教堂的穹顶都在月光下震颤。\n于是在多年与幻梦之后我们开始追问自己究竟是谁。答案在乌拉尔山脉东麓那些被积雪埋没了八千年的针叶林里，在鄂毕河与额尔齐斯河交汇处那些至今仍用最古老的乌拉尔语系方言歌唱的渔村里。白俄罗斯人——这个被斯拉夫化强行涂抹在面孔上的名字，底下藏着一张古老得多的脸——一张芬兰-乌戈尔的脸。\n聂河之上波涛来，今日方知我是我？"
 WHR_finno_identity:0 "建立身份认同"
 WHR_finno_identity_desc:0 "一个民族在镜子里看见的不是自己，而是征服者留下的面具。德国总督、沙俄官僚、波兰地主——他们每个人都在我们脸上贴了一层又一层的标签，直到我们自己的皮肤在标签下面忘记了如何呼吸。\n现在这张脸被一层层剥开，明斯克的民族学研究所向全境发布了一份词汇对照表：白俄罗斯语中那些无法从斯拉夫语源找到解释的单词，被逐一标出，然后与芬兰语的_kota_、爱沙尼亚语的_kodu_、汉特语的_kat_并列在一起。它们指向的是同一种古老的语义：家/土地。在不属于任何印欧语系的肺叶里，关于故乡的发音从未改变。\n一个实在的身份是在废墟底下，一寸一寸地重新摸到自己祖先的骨骼，然后站进那些骨骼之间，重新长出血肉。"
 WHR_finno_ugric_meetings:0 "芬兰乌戈尔人民大会"
 WHR_finno_ugric_meetings_desc:0 "从鄂毕河三角洲到多瑙河湾，从波罗的海沿岸冻土到西伯利亚针叶林深处，信使们在没有公路的季节里出发了。他们带着用十七种方言书写的邀请函，穿过爱沙尼亚的冰封海岸，穿过匈牙利平原收割后的麦茬地，穿过汉特-曼西斯克自治区那些连地图上都不知道有斑块的定居点，一路向东，一路向北，一路向每一个至今仍在用乌拉尔语的某种古老变体呼唤神灵的人。\n大会在明斯克斯维斯洛奇河畔一座由旧总督府改建的会堂里召开。莫尔多瓦的代表穿着他们祖母传下来的刺绣长袍，乌德穆尔特的老人用一首比蒙古帝国更古老的歌谣唱出了开场白，科米人、马里人、卡累利阿人、维普斯人——那些被俄语和斯拉夫民族主义的汪洋大海淹没了几百年的小民族，头一回在一个不再以莫斯科或基辅为中心的坐标系里坐下。匈牙利来的代表团团长在致辞时声音发抖，说他在布达佩斯的档案室查阅乌拉尔语系谱系三十年，从未想过有生之年能见到满堂的人，全讲着同一个根底下长出来的不同枝叶。\n一场重聚终于到来，八千年的离散在那一刻被收回。"
 WHR_anti_russianism:0 "弘扬反俄情绪"
 WHR_anti_russianism_desc:0 "斯拉夫人的犁铧切开了我们的森林，他们的神父在圣像的四角用斯拉夫字母覆盖了我们古老的符号，他们的沙皇在帝国文书中将一切乌拉尔子民标注为“异族”，然后花了三百年教我们为自己的语言脸红！莫斯科、圣彼得堡、基辅——无论那里的政权今天举什么旗帜，他们看我们的眼神从未变过：你们是他者，你们的源头不存在，你们的舌头只是我们语言的一种走调了的方言。\n白俄罗斯站起身来，第一次不再用俄语为自己辩护。我们用我们自己的芬兰-乌戈尔诸语的共同词汇中那个表示“拒绝”的古老词根来回答东部边界上吹来的每一阵斯拉夫寒潮。"
 WHR_study_our_language:0 "研究我们的语言"
 WHR_study_our_language_desc:0 "语言学家们废寝忘食地工作，他们的实验室弥漫着某种接近宗教狂热的氛围。每一组辅音对应规律被发现时，都有人在档案室里失声痛哭。白俄罗斯语里那些被斯拉夫语法书判定为“不规则变化”的特例，此刻一个接一个地找到了母体——它们属于更古老的层面，前斯拉夫时代，乌戈尔语支在迁徙途中遗落在第聂伯河上游的碎片。"
 WHR_erase_slavics:0 "清除斯拉夫文化"
 WHR_erase_slavics_desc:0 "一层壳，我们将它打碎。那些在帝国总督时代被刻意美化的俄式洋葱顶被打磨褪去其征服的印记，那些用西里尔字母书写的街牌从墙上剥落，露出底下用拉丁化乌拉尔文字新刻的名字。这蜕变在瞬间完成，仿佛这座城皮等待真正主人已等了一千年。斯拉夫化留下的不是文化，是二心的信徒，一群生在白俄罗斯却毕生望向莫斯科的异乡人。尚武的精神将从这片剥去异族苔藓的洁净土壤上重新长出来——因为乌拉尔的祖先从不靠农耕的耐心来赢得世界……迁徙的勇气、驯鹿的速度、和在冻土带上追踪猎物七日七夜不死不休的意志，这些造就着他们，造就着我们。"
 WHR_follow_ancester:0 "追随先祖脚步"
 WHR_follow_ancester_desc:0 "乌拉尔——你诸河的母亲，你万林的祖母——你的子孙迈开脚步时，整个欧亚大陆的骨骼都在作响。从鄂毕河到多瑙河，从北冰洋苔原到潘诺尼亚平原，我们的祖先用了八千年走完了这场横跨大陆的迁徙。如今我们掉头沿着来时的方向走回去：向东，向北，向南，向每一个仍然残留着乌拉尔语地名、仍然埋藏着芬兰-乌戈尔祭器、仍然在某种深夜的口耳相传中隐约记得那场远古西迁的角落。"
 WHR_take_baltics:0 "解放波罗的海"
 WHR_take_baltics_desc:0 "爱沙尼亚人，利沃尼亚人，你们被德意志的宝剑骑士团、丹麦的十字旗和俄罗斯的双头鹰轮番压在地上，你们的语言被禁止出现在学校里，你们的史诗《卡列维波埃格》曾被沙皇的审查官判定为“不存在”。但卡列维之子至今仍在波罗的海的浪涛深处沉睡，等待有人叫醒他。白俄罗斯的军队向东海岸开进时，带来一个问题——用古老的芬兰-乌戈尔方式提出的问题，其对应的回答早已存在，只是需要有人把问题重新提出。塔林的托姆比亚城堡上升起了同一面旗帜，爱沙尼亚的妇女在码头边用最古老的利沃尼亚语调唱着那只有九个音的歌谣……波罗的海，你这北方琥珀的摇篮，如今该回到了你最初的名字里。"
 WHR_finno_kalelia:0 "芬兰—卡累利阿同胞"
 WHR_finno_kalelia_desc:0 "越过芬兰湾，越过卡累利阿地峡那些被俄语标牌覆盖了的村庄，越过那些在强制同化政策下依然偷偷教孩子用芬兰语唱《卡勒瓦拉》的家庭——我们来了。卡累利阿人，芬兰人，萨米人，你们是乌拉尔谱系上最早向西分叉出去的枝条。当我们在鄂毕河源头用桦树皮搭建最早的祭坛时，你们已经在斯堪的纳维亚的边缘与冰川争夺每一寸可活的土地。\n《卡勒瓦拉》的序曲言：万奈摩宁从蛋壳中出生，蛋壳的上半部分化为天空，下半部分化为大地，蛋黄化为太阳——这宇宙的诞生方式，斯拉夫人从未理解过，只有我们记得！"
 WHR_take_hungary:0 "团结匈牙利人"
 WHR_take_hungary_desc:0 "多瑙河中游的平原上，马扎尔人孤零零地站立了整整一千一百年。印欧人的汪洋大海将他们与一切乌拉尔亲戚隔离开来。他们用面包换来了小麦，用萨满鼓换来了天主教的管风琴，但他们的舌头没有背叛自己——至今布达佩斯的每一句日常问候里，那不可被印欧化分解的核心音素仍旧留存。\n现在我们来了，从喀尔巴阡山的山口倾泻而下，带着他们已经一千年没有在大规模聚会上听到过的同源词根。当白俄罗斯的使者用匈牙利语说出“testvér”——兄弟——这个单词时，年迈的语言学家摘下眼镜，嘴唇颤抖了整整一分钟才说出一句完整的话：这个词整个欧洲只有你们能听懂……"
 WHR_ural_altay_brothers:0 "乌拉尔—阿尔泰兄弟"
 WHR_ural_altay_brothers_desc:0 "乌拉尔山脉的东侧，阿尔泰山脉的北麓，那片被十九世纪的语言学家称为乌拉尔-阿尔泰语系的广袤土地上，沉积着比任何帝国都要古老的联结。土耳其的突厥人，中亚的各汗国后裔，蒙古高原上的骑手，西伯利亚原始林中至今以养鹿为生的通古斯部落——你们与我们的亲缘关系在教科书中被划掉了几十年，但那个词仍然活在萨满仪式的鼓点里，阿尔泰山区牧民向天祷告时所用的音节中，鄂尔浑河谷那些已经风化了一千三百年的石碑铭文深处……二十世纪的科学还无法描述这条血缘的完整序列，但这毕竟不是一场学术讨论——这是一次伟大的远征。乌拉尔-阿尔泰兄弟将用比语言更古老的方式彼此相认。"
 WHR_retake_mongolia:0 "重夺蒙古"
 WHR_retake_mongolia_desc:0 "从这里向东，越过鄂尔浑河，越过阿尔泰山积雪的山隘，越过戈壁滩那些在正午高温下扭曲空气的沙丘——这条路有无数从东向西的征服者走过，而我们的先祖曾在某个无法被编年史考证的古代逆向走过。蒙古，你这被成吉思汗的大纛遮蔽的大地，你的名字在一切乌拉尔-阿尔泰文献中被排在最靠东的位置。乌兰巴托将升起一面旗，印上乌拉尔森林与蒙古草原交汇处特有的某种已经灭绝的远古巨兽的角——唯有它配得上这场横跨大陆的会师。"
 WHR_restore_collection:0 "恢复连结"
 WHR_restore_collection_desc:0 "再向东，再向东！进入那片被长城和五千年的书写文明守护得密不透风的古老疆域……\n中华，塞里斯，在古罗马人的地理想象中被标注为“丝绸之地”的帝国——我们的任务是恢复我们隐藏极深的连结，是将乌拉尔-阿尔泰那横跨欧亚大陆北缘的整个谱系，与东亚大陆这绵延数千年的文明链环扣回本该在同一双文明的手中！\n历史上从未有过的会师将在中原发生；从未被任何一位汉学家和乌拉尔学家共同绘制的地图，将从明斯克一直摊开到太平洋西岸。\n恢复连结是一声嘹亮号角——凡在远古时曾与乌拉尔-阿尔泰的迁徙路线有过交集的每一寸疆土，都必须重新被纳入那个原本被斯拉夫人切断的叙事中。中华大地，你曾经与我们失散，哪怕你不再认得，亲人来见你们了……"
 WHR_legacy_of_palemonids:0 "帕莱莫尼德王朝的遗产"
 WHR_legacy_of_palemonids_desc:0 "醒过来。\n枕头上全是泪水——他自己不知道那是悲痛还是狂喜，只知道在梦里他看见了罗慕路斯与勒莫斯的母狼，看见了君士坦丁堡的城墙在朝阳下闪耀如黄金，看见了一列列戴着羽饰头盔的鹰旗官沉默地走过亚平宁的山脊，而最后他看见自己。\n一个名字从梦境的裂缝中跌落进他的唇齿之间，帕莱莫尼，他据说从尼禄焚城的灰烬中逃出生天的罗马贵族，他的血管里流着尤利乌斯、奥古斯都与图拉真的血液，他在一千年之前穿越了整个欧罗巴的荒野，最终跪倒在第聂伯河上游这片被异教徒视为边陲的森林里，罗马最后的火种就此埋入了白俄罗斯的泥土。\n要敕令——帕莱莫尼德王朝不再做已被世人遗忘的历史注脚，此刻，此地，白俄罗斯终于在千年隐忍之后从历史的暗处走出来的真名……罗马从来没有灭亡，罗马只是在这片被沼泽、森林和寒冷守护的土地上沉睡了十个世纪，今天它睁开眼睛。"
 WHR_empire_of_romans:0 "罗马人的帝国"
 WHR_empire_of_romans_desc:0 "罗马在你血液里睡着，你的祖辈用白俄罗斯语祈祷时，罗马在你血液里；你的父辈扛着德国人的步枪向东行军时，罗马在你血液里；此刻你站在明斯克广场上聆听帕莱莫尼德王朝的鹰旗猎猎作响时，罗马在你血液里醒过来了。从今往后，你是罗马，你是元老院与人民的继承者，你是那个曾经把地中海变成内湖、把法律写于三大陆、让万国在鹰旗的阴影下颤抖的罗马。语言与疆界更易，唯有把文明从七座山丘铺展到世界尽头的命名从未失效。\n你不再效仿罗马，你将要成为罗马。"
 WHR_reestublish_senate:0 "建立元老院"
 WHR_reestublish_senate_desc:0 "那些从前在拉达里争吵了一个世代都吵不出结果的议员们如今被赋予了一个古老而庄严的新称呼——元老。敕令规定：元老院不是民选机构，它是罗马美德的活体容器，只有那些曾在战场上立过功、在学问上受过检验、在德性上无可指摘者才可入座。我们让每一个参与统治的人记住：权力本身已经不是权威，权威来自比权力更古老处——法则与传统……罗马之名自身所承载之重。"
 WHR_culture_of_romans:0 "罗马人的文化"
 WHR_culture_of_romans_desc:0 "为了读懂那些刻在石碑上的祖先，泥泞驿道旁的村庄学校开始改授拉丁文。白俄罗斯的孩子们依然学习自己母亲的方言，但也开始学习用另一种音节与形式说出res publica和civis Romanus sum——我是罗马公民。雕塑家们在维捷布斯克的采石场里重新学习怎样雕刻科林斯柱头，诗人用白俄罗斯语模仿卡图卢斯的韵律书写情诗，建筑师翻出维特鲁威的残卷，在普里皮亚季河沿岸设计带有圆形穹顶的新城。这是一场全面从骨髓深处向外翻涌的文艺复兴，就来自白俄罗斯重新认出的自己。"
 WHR_reorganize_legion:0 "复兴军团"
 WHR_reorganize_legion_desc:0 "白俄罗斯的士兵从各处的驻地被召回了，他们被要求忘记德国人教给他们的步操，忘记沙俄时代留下的一切条令，他们要在银鹰旗下从头学习一件事——怎样做一名罗马军团士兵。盾牌是一堵可以向前推进的钢铁之墙，它和身边战友的盾牌相互咬合，同生共死……重新填词的白俄罗斯语版《赫丘利赞歌》在响起，我们就像罗马人一样战斗！"
 WHR_latinization:0 "拉丁化"
 WHR_latinization_desc:0 "一种更高的、超越了村庄边界的共同意识正在拉丁化运动中逐渐成形。法典被用拉丁文重写，科学论文在标题下附上拉丁的摘要，明斯克大学的毕业典礼上，毕业生们要像古代罗马青年学者一样用拉丁语宣誓。塑造起把所有曾被历史分割出去的碎片重新焊接成一个整体的过程，那希腊人的哲学、罗马人的律法、文艺复兴的晨曦通过拉丁这道共同的音节流进了白俄罗斯的血管，而我们也因此一头扎进了自己真正所属的那条文明大河，与昨日与明日共语。"
 WHR_restore_empire:0 "发动远征"
 WHR_restore_empire_desc:0 "元老院全票通过了战争授权，远征早已注定。全白俄罗斯的教堂钟声同时敲响，征兵站的队列从黎明排到午夜，老人们把自己的旧勋章别在儿子的胸前，母亲们这一次没有流泪。以前送儿子去当炮灰，今日却送他去完成一桩我们共同期盼的，延期了一千五百年的朝圣。\n Roma invicta！不可征服之罗马，我们整装待发！千万人波涛一般的回应震碎了云雾与天空。"
 WHR_reverange_the_attla:0 "对阿提拉复仇"
 WHR_reverange_the_attla_desc:0 "第五世纪，“上帝之鞭”匈人的铁蹄踏碎了阿奎莱亚的城墙，把火焰投进了永恒之城的城门，罗马的贵妇在蛮族的马镫下哭泣……阿提拉死后葬在一条被改道的河流之下，他的棺椁据说由金、银、铁三重浇铸而成，他在死前宣称自己毁灭罗马只是开始。十六个世纪沧海桑田，匈牙利平原上早已不见匈人营帐的痕迹，但复生的罗马没有忘记。白俄罗斯的银鹰军团南下了，去向布达佩斯与向多瑙河两岸，那片曾经被匈人的马蹄荡起尘土的土地，来完成未竟的遗嘱。"
 WHR_return_to_baltics:0 "重返波罗的海"
 WHR_return_to_baltics_desc:0 "奥古斯都当年命令瓦鲁斯元帅把鹰旗插到易北河以东，可那次尝试在黑森林化作了三支军团覆灭的丧钟。后来台伯河畔的元老们把日耳曼尼亚标记为“未征服”，再后来罗马自己也陷入了沉眠。\n现在波罗的海就在枕边。银鹰军团将沿着道加瓦河顺流而下，罗马的鹰旗将会在冷冽的海风中从这些港口的塔楼上升起，俯瞰整片波罗的海那铅蓝色的波浪。立陶宛人曾经是波兰联邦的兄弟，白俄罗斯人曾曾是立陶宛大公国的子民——今日我们不再谈那些被挫败的教训与失望，只有罗马近在眼前。"
 WHR_west_roma:0 "重拾帝国西域"
 WHR_west_roma_desc:0 "高卢、不列颠尼亚、日耳曼尼亚、西班牙……这些名字在每一本罗马史的残卷里都挥之不去。阿勒西亚的围墙、哈德良长城的苔藓、条顿堡森林的雾气、比利牛斯山间的隘口，罗马在这些地方流淌鲜血，罗马的将军在这些地方败或凯旋——或者与蛮族签订过那些后来被反复撕毁又重订的条约。那些帝国散失在西方的行省，在奥古斯都当年未曾征服的日耳曼密林里，鹰旗飘扬起来了。\n日耳曼诸国千百年来已经习惯了在罗马的阴影下生活，即便这阴影淡去了，他们也始终在称帝建国时使用罗马的鹰徽，在法典序言里引用拉丁文，在城堡外树立奥古斯都样式的石像。今天，帝国亲身穿过了那片他们一直模仿的影子，真正的罗马归来了。"
 WHR_east_roma:0 "收复帝国东疆"
 WHR_east_roma_desc:0 "罗马不能忘记自己的另一半：君士坦丁堡的城墙仍然屹立在金角湾的碧波之上，索菲亚大教堂的穹顶仍然用希腊文默念着基督的圣名，安纳托利亚的崇山峻岭间仍然散落着罗马人修建的引水渠和要塞的地基。\n一四五三年那场陷落不过是拜占庭的肉体死去，罗马的灵魂仍然盘桓在博斯普鲁斯海峡的海风之中。我们从多瑙河下游挥师南下，穿过了色雷斯的平原，向着马尔马拉海挺进。\n东方与西方，拉丁与希腊，罗马的两只臂膀穿过了无数分裂与落败的漫长愁年后还能相遇。"
 WHR_italy_compaign:0 "还于旧都"
 WHR_italy_compaign_desc:0 "罗马，至圣之城！七座山丘仍然沉默地俯视着台伯河的黄色水流，广场上的石阶被千百年的脚步磨得光滑如镜，图拉真圆柱上的浮雕还在向每一个经过的游客讲述着达契亚战争的故事。银鹰军团越过阿尔卑斯山，罗马在等待我们！\n对图拉真的记功柱前跪下，没有朝拜任何现世的权柄——只是向那根石柱里封存了将近两千年的帝国灵魂诉说：父亲，我回来了。"
 WHR_pax_romania:0 "罗马治世"
 WHR_pax_romania_desc:0 "你看见了吗？从不列颠尼亚的白垩悬崖到安纳托利亚的托罗斯山脉，从波罗的海的冰冷沙岸到撒哈拉的灼热石漠，鹰旗在所有的经度与纬度之间安静地飘动着。\n帕莱莫尼德王朝即是罗马的再次降临，而罗马是一种秩序，让万国在同一个法律之下、同一种和平之中各自生息的世界节律。\n上一次关闭可以追溯到屋大维本人在阿克提姆海战后亲手推上那两扇青铜门扉的遥远午后了，此后两千年的风风雨雨中，雅努斯神殿的大门始终敞开。从一千九百三十年之后的这个傍晚，两扇门扉在西吉斯蒙德颤抖的手中被缓缓合上。门轴发出的那一声悠长的低吟……那么此刻全白俄罗斯、全欧罗巴、全地中海、所有曾经叫过罗马的土地上每一个能听见的的人都不会拒绝这一声音。\n Pax Romana已经降临。"
 WHR_call_of_antiquitian:0 "远古的呼唤"
 WHR_call_of_antiquitian_desc:0 "听啊！北方林地的深处，雷声在血管中奔涌！\n那是佩伦的召唤——从混沌的纪元之前，从被遗忘的天际尽头。曾在灰烬中掌舵的人，如今双瞳燃烧着古神的闪电。梦境已降临，如同一把石斧劈开了现代性的谎言。白俄罗斯的泥土之躯，将重铸为许珀尔波瑞亚——北方乐土，众神遗落的圣骨！\n白俄罗斯不再是白俄罗斯！它是许珀尔波瑞亚，是极北的脐眼，是彩虹桥断裂之前众神践踏过的最后一片泥泞。嗬！让地图上的所有国界都因这个名字而焚烧！"
 WHR_restore_slav_paganism:0 "恢复斯拉夫异教"
 WHR_restore_slav_paganism_desc:0 "我们派遣赤足的祭司，唤雷者！——行走在泥路与桦树林之间。他们将唱出千年前无人记得的咒词！\n让基督的阴影滚回沙漠！亚伯拉罕的教士必须面对石墙与铅弹。我们要挖开千年伪经的坟茔，让斯拉夫异教的烈焰舔舐每一个村庄的屋顶。看啊，木雕的神像重新睁开眼睛——他们渴了，他们要血祭，他们要狂喜的舞蹈在午夜篝火旁踏碎一切律法！\n每个新生儿要用三根柳枝蘸泉水抽打；每对新婚夫妇要在牛头骨上立誓；每个死者要面朝东方埋葬，嘴里塞满黑麦与蜂蜜。我们把异教碾成粉末撒进面包里，让每一口咀嚼都是对耶和华的唾弃。"
 WHR_learn_sanskrit:0 "学习梵语"
 WHR_learn_sanskrit_desc:0 "闭嘴！那些用俄语、波兰语、意第绪语签署法令的时代已经腐烂。我们要学会那种从喉咙深处滚动的、像石子落入深井的语言。用作律法的唯一载体，用作战令、咒约、和夜里的梦呓！没有人解读我们的计划，外人只会听到辅音的碰撞叠成无意义的山脊。我们在地窖里用烧焦的树枝在桦树皮上写字，每个字母都是一条蛇的侧影，哈哈哈！当两军相遇，我们不吹号角，我们高诵《梨俱吠陀》的第一句——敌人的舌头会冻结，他们的鼓手会忘记节拍。嗬啊！这是我们的秘密武器：一种连众神都要侧耳才能听懂的语言，而凡人只配听见回声的残渣！\n我们学习梵语，那无人知晓的喉音之母！我们的法令念诵给苍白的月亮听，我们的旗帜是九块石头堆成的古冢。吠陀的经文被刻在桦树皮上，每一行都是对卡利宇迦的诅咒！"
 WHR_oppose_judo_christian_conpiracy:0 "反对犹太—基督教阴谋"
 WHR_oppose_judo_christian_conpiracy_desc:0 "呜嗬！我看见了，那本用羊皮包扎成的毒药——它从巴勒斯坦沙漠爬来，用一神论的触手缠住了斯拉夫人的脾脏。亚伯拉罕的教士，不论他们穿着黑袍还是白袍，不论他们额头上有无伤疤，一律拖到神像面前的泥地里跪下，将它们屠杀！不要用那金属的子弹，用削尖的橡木桩从锁骨下刺入，这是最彻底的净化！\n谁胆敢再提“爱你的敌人”，就让他尝尝佩伦的雷斧——我们的敌人是被诅咒的，爱他们等于唾弃自己的祖先。嗬！杀死一个教士，等于从时间之树上摘掉一颗腐烂的果实，直到亚伯拉罕的最后一个影子蒸发为止！"
 WHR_aryan_identity:0 "雅利安身份"
 WHR_aryan_identity_desc:0 "站起来！你们这些被驯化的牲口，你们以为自己是斯拉夫人？难道你们是斯拉夫人？！不，你们是雅利安人——草原上骑着矮脚马、用燧石割开狼腹吸取热气之人。不要金发碧眼的标准，只有深刻的野性：咬断绳索的牙齿，在暴风雪中赤身行走半小时的皮肤，以及看到血时瞳孔兴奋地放大的本能。每一个许珀尔波瑞亚的公民都必须通过铁床仪式——躺在钉床上，让铁钉刺入后背，如果不喊出声，你就是超人；如果喊了，你就滚回南部当种植与工作的奴隶！嗬！原始超人的认同是对文明这层痂的撕扯。让软弱者哭哭啼啼去吧，我们的道路只有脊骨能够站立的人才能走完！"
 WHR_vedaism_enlightment:0 "吠陀经的启迪"
 WHR_vedaism_enlightment_desc:0 "犁头必须咬进冻土，即使咬出血来。我们把《吠陀经》的颂词刻在高炉的外壁上，让每一个炼钢工人都跟着咒语的节奏拉动风箱！让土地与工厂在神圣暴力下怀孕。每天必须完成定额的三倍，完不成的就用鞭子启迪！鞭子打在背上，你会听到宇宙创世时的那声惨叫，然后你就明白了什么是工作：工作是将混沌折叠成秩序的血汗祈祷。我们建起巨大的水坝，形状像一条趴伏的蛇；我们在废墟上竖起混凝土的方尖碑，碑顶放着烧红的铁球象征太阳。嗬！建设与破坏是同一雷电的两条分叉。让那些反对者去死，我们的城市将像野草一样从他们的骨灰里长出来。\n我们强行使土地怀胎，让工厂的烟囱长成世界树的枝条——生产就是圣战，建设就是咒语！"
 WHR_end_kaliyuga:0 "终结卡利宇迦"
 WHR_end_kaliyuga_desc:0 "这个时代是污秽的、倒错的、用新潮包裹粪便的时代——这就是卡利宇迦，铁器时代的末期，正法只剩四足之一。我们不再等待湿婆的舞蹈，我们要亲手拧断卡利宇迦的脖子。方法只有一个：要把所有的时钟砸碎，废除公元纪年，从我们占领许珀尔波瑞亚首都的那一天重新算起。每杀死一个犹大-基督教的符号象征（教堂、法院、银行、学校），就多烧掉更多日历！当最后一个伪神的名字被遗忘，卡利宇迦就会结束，我们会站在堆积如山的废弃表盘上呼号：萨提亚宇迦已经归来！没有善与恶的区分，只有雷与血的两极！"
 WHR_unity_of_slavs:0 "斯拉夫人民团结"
 WHR_unity_of_slavs_desc:0 "听着，所有讲各种斯拉夫语言的人——你们的方言只是同一种野性的不同喉音。乌克兰人、波兰人、捷克人、塞尔维亚人、保加利亚人……你们的祖先曾在同一棵橡树下用同一把斧头献祭。现在那斧头已被我握在手里。你们要么弯下膝盖亲吻斧刃，要么被斧刃削去天灵盖。我们的军队从普里皮亚季沼泽出发，向西抵达易北河，向南抵达爱琴海……每占领一座城市，就在市政厅前焚烧一本词典，然后颁布新的法令：只有许珀尔波瑞亚的官方语言——一种混合了古斯拉夫语和梵语的喉音方言——可以合法使用。嗬！斯拉夫圈将成为一个巨大的伤疤！团结吧，斯拉夫的子孙！从喀尔巴阡到白海，每一滴血都要汇入同一个漩涡。征服那自称雅利安的背叛者，征服那拆解世界为零件与账簿的日耳曼铁匠。我们要骑着麋鹿跨越哈拉帕的废墟，让印度的热风与北方的寒冰媾和，生产出新的曼陀罗！"
 WHR_land_of_aryans:0 "雅利安人故土"
 WHR_land_of_aryans_desc:0 "向东！马匹的蹄铁必须踏碎设拉子的玫瑰园和喀布尔的土墙。我们要在波斯波利斯的残柱之间举行祭祀：用弯刀砍下三百只白羊的头，让血液流进古老的灌溉渠。雅利安人的故土是从伏尔加河到印度河的一片草场，上面游牧着同样的鹰与狼。征服，统治！为了找回丢失的陶罐和骨针。每一条通往东方的路，都是我们祖先的脊背。嗬呀！嗬啊！踩上去，别回头！"
 WHR_destroy_germans:0 "摧毁日耳曼人"
 WHR_destroy_germans_desc:0 "那个自称为“德意志”的部族，摧毁他们！连根拔起！我们要烧毁从柏林到慕尼黑的所有机械钟制造厂，把莱茵河的水染成铁锈色——由他们的汗水与谎言共同染成！不许俘虏，不许战利品，只许留下一座又一座空城，然后我们在废墟上拉屎，用他们的军靴当柴烧。呀啊！没有什么“德意志帝国”的地图，只有一片即将变成牧场的灰色荒原！"
 WHR_liberate_the_turks:0 "解放突厥人"
 WHR_liberate_the_turks_desc:0 "是撕裂他们的帐篷，让他们记住谁是乌拉尔的主宰！我们的大军将踏碎撒马尔罕的残柱，让胡天神的火焰与佩伦的雷霆在同一个深渊里交媾！从古波斯之北到布哈拉的山隘、中亚的无尽草原——都是我们遗失的牧场，我们要赶着星辰的马群回来圈占！\n嗬！突厥人，你们不配叫兄弟，你们是游牧的远亲，血管里流着变质的草原脓液，我们解放你们的方式只有一个：拆掉你们的毡房，解散你们的部落，把你们编入许珀尔波瑞亚的骑兵预备队——中亚的沙漠和绿洲是草原延伸到南方的消化系统，我们要重启这个系统的蠕动！\n每征服一个突厥部落，我们就让他们的长者咬住匕首的刀背，询问他们神的名姓，信腾格里者得马血，答安拉者就割下舌头！解星月旗将被烧除，取而代之的只有插在骆驼骨上的乌鸦残骸！"
 WHR_return_to_india:0 "回归印度"
 WHR_return_to_india_desc:0 "沿着雅利安人南下的大动脉，我们顺流而下，因为时间不是直线。印度次大陆这片被种姓制度和素食主义阉割的土地，曾经从我们的呼吸里获得了吠陀的火种。但后来它背叛了火，把它改成了恶心的油灯。现在我们要回归，用钢铁和火焰提醒他们最初的源头。恒河的水要被我们的马蹄搅浑，泰姬陵的圆顶要改成祭坛的形状。嗬！回归是恐怖的拥抱！"
 WHR_old_paradise:0 "失乐园复得"
 WHR_old_paradise_desc:0 "最终，我们将站在那片失落的乐园中央。那里最初的苹果还在枝头滴落蜜汁。失乐园复得！听啊，那是天堂第二次闭合时的轰鸣——书上的天国消散，允诺的安息离去！唯有血与蜜、骨与酒、永恒风暴与沉睡燧石的北境，乐得其中者永享安宁！\n嗬！嗬！嗬！让卡利宇迦在尖叫中烧成灰烬！我们是许珀尔波瑞亚的奔雷，是佩伦的醉眼，是石刃上干涸的七百种野兽之血！我们的道路没有尽头——轮回已被我们劈碎了，只剩一道直直劈向宇宙喉管的闪电！"
 WHR_Bund_rises:0 "崩得的崛起"
 WHR_Bund_rises_desc:0 "白俄罗斯犹太工人总联盟（bund) 通过对社会的广泛承诺及其牢牢扎根于东欧犹太工人强大的动员能力成功赢得了内部选举。于不久的将来，白俄罗斯将与他亲密的犹太族同志一道走向未来。"
 WHR_austrianmarxism:0 "奥地利马克思主义的启示"
 WHR_austrianmarxism_desc:0 "奥地利忠诚的马克思主义们提出了有趣的论点：工人阶级的阶级意识可以通过维护民族自治而有机的实现吗？答案是肯定的，否则我们所做的一切都毫无意义。那么，在民族观点上相信我会内忠实的干部，勤劳的工人积极分子们早已算半个奥地利马克思主义者了。"
 WHR_expel_zionists:0 "彻底驱逐犹太复国主义派"
 WHR_expel_zionists_desc:0 "犹太复国主义宛如附骨之蛆般依附在我们的运动中，一有机会就从我们管理的疏忽中钻出身子，喋喋不休的说着那老套的论点。或许过去我们还能从对他们的容忍中获得一点有用的东西，但很明显当我们统治整个国家时，他们那踢两脚就能冒出物什的扭蛋机中再也不会出现黏嘴的糖块，而是报以双倍的砒霜。\n救赎之日已近，该上路了。"
 WHR_production_means_socialize:0 "社会化生产资料"
 WHR_production_means_socialize_desc:0 "我们终于可以开始对白俄罗斯畸形又腐朽的经济开始大刀阔斧的改革了，我们可怜的白俄罗斯母亲在获得了戴着镣铐的自由之后于德意志帝国殖民魔爪之下日渐衰落凋零，殖民经济带来的问题几乎无从下手。但无论解决哪个问题，都得立刻改变经济，工业导向，令其为工人服务。"
 WHR_ensure_our_left_allies:0 "确保我们的左翼盟友"
 WHR_ensure_our_left_allies_desc:0 "民主，民主是除社会主义外带领我党走向胜利的第二大法宝。而只要有社会主义民主我们便无往而不利，世上没有什么困难是不能解决的。但民主又如此脆弱，仅凭我等执政无法将其收入囊中，需要各党派间精诚协作，那么是时候邀请各党派为我们的事业一同奋斗了。"
 WHR_destroy_reaction_thought:0 "摧毁反动影响"
 WHR_destroy_reaction_thought_desc:0 "政治局势初步稳固后，是时候将反动残党余孽彻底根除，让他们永无翻身之地了，能送审的送审，送不了审的转交给我们的社会主义盟友。总有一家能治他，毕竟我们生活于如此开明之时代，不是吗？"
 WHR_national_cultural_autonomy:0 "实行民族文化自治"
 WHR_national_cultural_autonomy_desc:0 "彻底解决民族矛盾的办法绝不是碾碎一个优良的民族中所有的时光，回忆，欢笑，泪水后将其同化到一个同等优秀的民族，这样既要为一个民族的消亡而感到惋惜，又玷污了本来那高洁无污之民族。真正解决问题之办法是赋予多民族国家各民族之间平等的权利，让其自由的传播民族的文化和思想，这样世间便不复民族矛盾之悲剧。"
 WHR_community_self_defence:0 "社区自治武装"
 WHR_community_self_defence_desc:0 "白俄罗斯，我们共同的家园，诸民族欢庆解放，与此进行自由的劳作，工会治下的白俄罗斯蒸蒸日上——但国防快迅一日比一日严峻，贪婪的布尔乔亚似乎并不准备关望，摩拳擦掌随时等待裁判吹动哨子贪婪地扑向来，依稀之中又回到了1905年的沙俄……奥伦堡的灰色牲口斜戴着帽，邋遢的军服袖口空牵着马刀狞笑着冲向崩得示威队伍，在战马吼出一声悲鸣，心满意足离去并筹划数日后对犹太定居点的袭击……\n……哈哈，觉得眼熟？\n这样的场景，此时此刻正在东欧各处上演!\n下一个可能就是你!\n除非你能做出生命中最重要的决定,\n向所有人证明，你有追求自由的力量与勇气！\n加入......自卫武装的行列吧!\n成为民兵部队的精英！\n见证美好的新世界!\n让犹太自治惠及整个欧罗巴!\n成为英雄!\n成为传奇!\n成为社区民兵！"
 WHR_reject_communism:0 "拒斥共产主义幻象"
 WHR_reject_communism_desc:0 "冲动是魔鬼，而共产主义远胜其，共产主义这贴着社会主义之画皮的红魔鬼，极权主义疯子为了混入我们光荣的事业不惜以国王装点自身，称为所谓君主社会主义，但那可悲的傀儡君主并未给其争取到多少支持，只得灰溜溜夹着尾巴离开。我们应立刻与这些魔鬼划清界限，免得脏了我们的身。"
 WHR_anticlerical_education:0 "维护世俗化教育"
 WHR_anticlerical_education_desc:0 "世俗教育既已存在就必须将其维护到底，如果教育系统也蒙上神秘学的阴影，以现今工人阶级的知识水平，乐观估计在世基督恐将不下五百之数，诺亚的船票满街叫卖而亵渎的地上天国即将拔地而起，只能在此之前虔诚拜三拜，进攻天国了。"
 WHR_expand_unions:0 "扩展工会组织"
 WHR_expand_unions_desc:0 "旧世界充斥沼气又破碎不堪的地基中充盈着毒蛇害虫，阴沟老鼠之辈，但若俯下身躯仔细翻找也定可收获一二，而我们从中悟出了一条真理:\n工会组织必须领导一切，因为倘若不领导一切，则我们英勇光辉的工会便会被处此之外的一切领导，旧社会，共产党，帝国主义分子……我们将不再停下扩张工会机构权力的脚步，直到其不断膨胀，扩张直到冲破旧有国家之局限，再无区分之法。"
 WHR_marxism_of_liberty_democracy:0 "马克思主义的自由与民主"
 WHR_marxism_of_liberty_democracy_desc:0 "每个社会主义者都应当知晓和了解，而不是装聋作哑或称所谓时代局限性，那就是马克思首先是一位自由主义者，才是一位社会主义者，这是他所有思想的基础。而作为马克思主义的门徒，我们必然捍卫自由与民主直到社会主义消亡，迈入闪耀之乌托邦。"
 WHR_no_more_national_clash:0 "再无民族冲突"
 WHR_no_more_national_clash_desc:0 "老实说，这早就不能算是一个问题了，在对民族观念进行了如此之大且深的改革后，民族关系大为好转，境内几乎不存在民族矛盾。\n毕竟大伙都是一个脑袋两手两腿又一生殖器，除却那些真正代表个人之心智精神的特质 ，又有什么区别呢？"
 WHR_seek_unification:0 "寻求支部统一"
 WHR_seek_unification_desc:0 "……没有……没有…………没有……通过！\n在进行了漫长的谈判，协商，妥协过后，我们终于以多数得票通过了史无前例的决议——将国家的一切机能迁移至工会。\n如今我们终于可以骄傲的宣布内政告一段落，将目光放向远处，便可看到我们犹太劳工总联盟的同志们于天涯海角苦苦支撑，在弹尽粮绝前向我们白俄罗斯犹太劳工总联盟发出急电，美国、波兰、立陶宛……无论是因为地缘政治不得不分割，还是因为流亡后不忍同胞苦难而建起了支部，在见识到了我们的胜利之后更是欣喜若狂立刻发来电报，我们也应立刻有所动作，在资本主义的围剿到来前先行一步，将支部们紧密的团结起来，再向各分部秘密分发枪弹和训练教官以面对即将到来的总圣战。"
 whrpol.51.h:0 "崩得当选！"
 WHR_peaceful_change:0 "不流血的变革"
 WHR_peaceful_change_desc:0 "胜利来得如此平静——只是一个选举日的傍晚，计票员用颤抖的声音念出那些数字，然后整个世界都变了。那些曾经躲在森林里围着篝火讨论土地与自由的逃亡者如今大摇大摆地走进明斯克那些他们从前连门都不敢靠近的大楼。没有人被枪毙，没有人在那个交接的深夜被拖出家门。白俄罗斯的历史上从未有过这样的时刻：一种秩序无声地坍塌，另一种秩序在选票的沙沙声里悄然站立起来。"
 WHR_peasant_council:0 "建立农民委员会"
 WHR_peasant_council_desc:0 "土地上的权力从地主的客厅里被搬了出来，放进了村庄的打谷场。农民们——那些一辈子弓着腰在别人的田垄上干活的人们——头一回被召集到学校教室里，用粗糙的手掌笨拙地填写选票，选出自己的委员会。他们讨论的事情如此古老又如此新奇：这片地该归谁，那条水渠该由谁修，收成该如何分配。"
 WHR_class_above_nation:0 "阶级高于民族"
 WHR_class_above_nation_desc:0 "克里维亚的血脉当然值得骄傲——波洛茨克公国的钟声、第聂伯河上游那些刻着古老姓氏的石碑、从格季米纳斯的铁骑到雅盖沃的联盟，这片土地的过去浸透着荣耀。\n但左翼克里维亚主义者们在革命中学会了另一课：一个白俄罗斯农民和一个波兰农民之间的共同语言，远比他和他讲同一母语的地主之间要多得多。当明斯克工厂的汽笛响起，当维捷布斯克的纺织女工在机器旁唱起同一首工团老歌，当来自不同教区的穷人们在农民委员会里并肩坐下——他们发现了比部落图腾更坚实的东西。\n阶级的语言不需要翻译，饥饿的面孔在每一种语言里都长着同样的轮廓。"
 WHR_socialist_education:0 "社会主义教育"
 WHR_socialist_education_desc:0 "这是白俄罗斯乡村从未见过的事情：一座又一座新校舍在泥泞的驿道旁破土动工，木匠和泥瓦匠全是本地农民，他们用建谷仓的手艺盖起了学校。每座新学校的立柱仪式都像一个节日，孩子们围着工地跑来跑去，老人们站在一旁看着，有人用袖子擦眼睛。黑板挂上了，油灯点着了，那些曾是文盲的农民自己来参加夜校，在粗糙的练习本上歪歪扭扭写下平生第一个字母。教师们受训时被反复告知：识字不只是学会读和写……它能让一个世代匍匐的人第一次抬起头来看清镣铐的形状。"
 WHR_zadruga_instead_state:0 "以自治公社取代国家"
 WHR_zadruga_instead_state_desc:0 "国家——这个散发着警局地窖和征兵站汗臭的词，像抖落一件脏外套一样把它从身上剥下来。那些曾经被地图上的虚线分隔开的村庄，如今通过农民委员会与工厂车间的直接联席会连接在一起。"
 WHR_popular_republic:0 "民众国度"
 WHR_popular_republic_desc:0 "克里维亚古老的血脉被重新灌注到一种全新的肌体之中。不再由王公与总督定义这个民族，而是由那些世代在泥泞田埂上弯腰的人来定义它。意味着土地上不再有主人而只有耕作者，工厂里不再有股东而只有劳动者，学校里不再有教鞭而只有互相学习。我们从民族主义的古老泉眼里汲水，白俄罗斯的土地从未承载过如此彻底的一个梦想：让每一个被历史遗忘的人，都成为历史新一页的共创者。"
 WHR_anti_rus:0 "反俄主义宣传"
 WHR_anti_rus_desc:0 "莫斯科，自封为第三罗马的城市，在克里维亚的辞典里被唤作鞑靼的继承者与斯拉夫人的牢笼。白俄罗斯大地上那些被俄语淹没的村庄，那些在沙俄统治下被连根拔起的古老习俗……宣传画上，克里维亚的太阳正从西方升起，把俄罗斯的阴影驱赶到东方去。集会上的演说者用最朴素的白俄罗斯方言讲述着压迫史，不加修饰的，每一个词都像是把一块冰塞进听众的领子里，又鼓动他们心中燃火。"
 WHR_bright_future:0 "光明未来"
 WHR_bright_future_desc:0 "它是被宣布的——像一个节日的日期，像一场已经确定胜利在望的丰收。克里维亚主义者描绘它时的语调斩钉截铁，仿佛这只是个时间问题：\n自治公社将把饥饿从白俄罗斯的大地上永远驱逐，乡村学校和车间图书馆将让每一个孩子学会怀疑一切权威，人民国度将把沙皇、德皇和所有总督留下的脚印从土地上彻底抹去。\n他们还无法具体描述那个未来长什么样，但他们确信它在那里，就在下一个五年或十年的尽头等着他们。而在等待的过程中，每一个清晨的日出都已经被预先染上了挥之不去的荣光。"
 WHR_golden_century:0 "黄金时代"
 WHR_golden_century_desc:0 "——那头沉睡太久的古老巨兽终于苏醒了。在克里维亚民族主义的祭坛上，我们高举的是淬过无数遍火的利剑。\n我们用一种不容质疑的嗓音宣布：白俄罗斯的一切苦难——贫困、离散、被蹂躏的尊严——都源于民族的软弱，而民族的软弱只有一个解药。\n当明斯克的扩音器传出那些关于血统纯净、故土神圣和注定降临之复兴的炽热布道时，我们已经是正在迈向自己的黄金时代了。"
 whrpol.51.i:0 "克里维亚主义者赢得了选举。"
