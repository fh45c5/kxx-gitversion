 WHR_american_bunds:0 "美利坚的支部"
 WHR_american_bunds_desc:0 "美利坚的支部向我们发来短讯，在大选于各方势力角逐之下彻底崩坏之际成功联系上社会党代本部达成合作协议，虽然我们地处东欧帝国主义包围圈仅能进行有限支持，但设法通过四散在美犹太人提供情报和扩大社会党影响力没有问题，甚至到革命即将落败之际，通过我们一点点犹太的小小关系，保下领导人绝非难事，到时便是筹划反攻大陆之日。"
