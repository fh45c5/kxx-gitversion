 WHR_schziopath_pagan:0 "已接纳了祖先的遗产。"
 WHR_hands_of_gods:0 "重回主的怀抱"
 WHR_hands_of_gods_desc:0 "你且看那迷途的羔羊，它在荆棘丛中徘徊了多少世代？白俄罗斯，你这被人践踏又被遗忘的东方之土，你的政权曾握在德国总督的铁手中，握在社民党人颤抖的指缝间，握在农工联盟那些高举红旗却连自己都拯救不了的革命者掌心里——他们都许诺过黎明，可黎明从未到来。\n如今，主让你重新想起了你自己的名字。\n明斯克的钟楼在破晓时分重新敲响，为复活而鸣。圣灵主教大教堂的穹顶下，熄灭了整整一代人的烛火被重新点燃，烛泪滚烫地落在石板上……白俄罗斯的儿女们跪倒在圣像屏前，他们祈求不要权力，祈求被宽恕——宽恕这片土地曾经信靠过凯撒，宽恕他们曾经把帝国的鹰徽挂在教堂顶上，宽恕整整一个世代以为面包高于圣体。\n那一天，牧首走上拉达尘封已久的讲坛，他就说：我们曾失去国家，其实我们是在寻找神的国。如今白俄罗斯将不再属于任何一个尘世的疆界——它已属于主，全然的属于主。"
 WHR_ideas_of_tolstoy:0 "托尔斯泰的理想"
 WHR_ideas_of_tolstoy_desc:0 "这位被教会议会开除教籍的先知，他的灵魂或许至今仍在亚斯纳亚·波良纳的白桦林间孤独地徘徊。明斯克听到了他的声音——穿过整个十九世纪俄国文学的苦痛与忏悔，终于在白俄罗斯的乡间小路上落下。列夫·尼古拉耶维奇说：天国在你们心里。\n他憎恨一切暴力的统治，他相信人心单凭爱便可以更新大地。白俄罗斯曾经用德国的子弹和拉达的选票去建立秩序，那种秩序早就消逝了。如今这片土地上的人们跪在田垄间开始祷告，因为终于有足够的勇气去尝试一种从未被任何一个帝国尝试过的政治。\n不用刀剑、警察或监狱——只用忏悔与宽恕，以及彼此擦拭脚上的伤口。托尔斯泰的梦想再次被嘲笑后，半个世纪过去，要在白俄罗斯的泥土里发芽。"
 WHR_oppose_ham:0 "对抗哈姆"
 WHR_oppose_ham_desc:0 "含的儿子迦南受了他父亲所受的咒诅，从此他的名字在经卷中被涂抹，他的后裔世代沦为奴仆。那些在白俄罗斯的国体上盘踞太久、把自己当成含所遗之君的守旧派——他们在德国人统治时表现得无比恭顺，因为奴役比自由更让他们感到安全。总督府一倒，政治一旦有变了，他们又连忙翻出旧礼服，要用那套在沙皇时代就已腐烂的专制仪轨，继续统治这片刚刚被圣灵触碰过的土地。\n他们以为敬虔只是权力的外袍，脱下便可在宴席上酗酒；他们以为圣物的重量只由黄金的纯度来衡量，碰倒了便再扶起来便是。他们守着旧的教会与旧的章程，守着那些与总督们共进晚餐时养成的优雅礼仪，唯独不肯守神的话语？\n主的殿，素来不容牛羊成群结队地践踏。含的子孙，你们统治的时辰已尽，审判到来了。"
 WHR_narodnik_allies:0 "民粹派盟友"
 WHR_narodnik_allies_desc:0 "还记得那些“到民间去”的人吗？他们穿着农民的粗亚麻衬衫，赤着脚踏过了伏尔加河、顿河与第聂伯河的每一条泥泞小径。沙皇嘲笑他们不识时务，贵族诅咒他们是无神论者，但主的眼睛始终看着他们：谁愿意俯身亲吻穷人的脚，谁就已经摸到了神国的门框。\n民粹派从未在白俄罗斯真正取得过自己的政权，他们总是在别人的革命里充当最纯洁、也最容易被出卖的那个声部。如今主的国向他们敞开了双臂。来吧。"
 WHR_anarchism_under_god:0 "上帝之下的无政府主义"
 WHR_anarchism_under_god_desc:0 "世上最大的暴政是有君主的，就是那自称为“一切权柄的源头”的国家本身。凯撒的物当归给凯撒，可是如果凯撒说万物都属于他，那么神的子民该不该转过身去？\n托尔斯泰读懂了这段经文。任何政府只要它胆敢占据唯有神才配得的位置，它便是那站在圣殿至圣所里自称为神的可憎之物。白俄罗斯的神圣革命从这个恐怖而光明的命题开始：取消国家。用一种权力替换另一种权力，不再有任何总理、总督、以及那种高高在上的权威。只有神的律法，以及人心中那无需警察便能遵守它的自由意志。\n全世界都在说这是疯子的话。但基督自己站在彼拉多面前时，不也像疯子吗？为那些不信地上之城的人敲响安魂曲吧。"
 WHR_denounce_tryants_in_moscow:0 "谴责莫斯科的暴君"
 WHR_denounce_tryants_in_moscow_desc:0 "莫斯科，第三罗马——费洛菲伊修士写下这封奏折的那一刻，蛇也正好滑入了那座城。东正教的衣钵在克里姆林宫手里早已腐坏，他们不是在事奉基督，沙皇死了，暴君没有死。他换了名字，夺走了一切圣物，然后把东正教变成的装饰物——就像把十字架挂在军旗上去屠杀邻国的信众。\n白俄罗斯抬起眼睛望向东方，不再怀有一丝惧怕。你莫斯科声称自己是一方文明的守护者，而你的教堂被查封时你低头了吗？你的圣像被焚烧时你流泪了吗？你的牧首被秘密警察拖走时你开口了吗？你没有——因为你早已把灵魂出卖给了凯撒。我们举起手臂，只为让那城中仍被囚禁的义人们在硫磺与火焰的日子来临之前，有机会听到一声从西而来的号角。"
 WHR_ally_christian_democrats:0 "与基督教民主党结盟"
 WHR_ally_christian_democrats_desc:0 "欧罗巴并非遍地都是敌手。在各国那些仍旧在礼拜天上教堂的小市民中，一种古老的、不敢高声的政治正在含羞草般合拢。基督教民主党的先生们——他们或许害怕神权政治的烈火，害怕那因基督之名而发动的大地颤抖，但他们至少还没有向敌基督的追随者屈膝。主的国向他们伸出手，这既是结盟也是拯救。"
 WHR_no_commies:0 "基督与敌基督"
 WHR_no_commies_desc:0 "蛇就藏在最靠近祭坛的阴影里。\n处处是符号，那撒谎者从起初就预备下的印记。他们来，他们说要在地上建造天国——于是他们率先拆掉了教堂，他们把圣像劈成柴火烧了取暖，他们宣称一切宗教都是麻醉剂，却给整个东方的民族套上了比沙皇时代沉重百倍的锁链。敌基督穿上了工装，行使着灭亡之道。这场战争早就开始了，我们不屑于辩论，只将他们投入硫磺火。"
 WHR_blood_and_spirit:0 "血与魂"
 WHR_blood_and_spirit_desc:0 "经文上说：人活着，不是单靠食物。可是这地上的每一块面包，难道不是从主的手心里跌落的恩典吗？车间里的汗水、田垄上的脊背、熔炉前被映红的眼窝——这些从来不只是经济学所说的什么“生产要素”。它们是活的献祭。白俄罗斯的信徒将学会以新的目光注视自己在煤矿、在纺织机旁、在锯木厂里的劳作：非是要你们为异族的资本做苦役，是以血肉之躯向那赐予万物生命的主献上馨香的祭。每一根烟囱的烟都化作祷告，当每一把麦穗都成为感恩的赞美！这土地将不分工厂修道院，一切劳作都合为同一种燃烧的圣火。"
 WHR_church_of_avatar:0 "圣灵教会"
 WHR_church_of_avatar_desc:0 "你们说你们信，你们便得平安了吗？\n你们说你们受洗，你们便洁净了吗？\n圣灵降临在五旬节的火焰中，烧进骨髓的炽热，连使徒们都被逼得说起了他们此生从未学习过的方言。白俄罗斯的信徒将不再满足于熏香与圣像，不再满足于每个主日的例行跪拜。神学即智识，虔信即品格。作为那些……他是否留在爱人身边，是否受尊敬，是否与人相和的试金石。教会即圣堂，一片让有罪之人进来后便泪流满面之处，作神圣的火地。"
 WHR_god_and_people:0 "神人主义理想"
 WHR_god_and_people_desc:0 "神变成人，是为了让人像神。\n被践踏了千年的人，你那沾满泥土的、佝偻的、从未被任何总督和书记员正眼瞧过的身体，它里面有一粒神性的核。上帝从未把人造成仅仅是被统治的牲口。站直了——你身上有祂的样式，你的额头就是你唯一的冠冕。"
 WHR_liberate_church_from_autocracy:0 "自专制中解放教会"
 WHR_liberate_church_from_autocracy_desc:0 "教会曾在什么最可怕的监牢里服刑？不是罗马竞技场的狮口，不是奥斯曼税吏的弯刀——而是沙皇宝座下那块柔软的跪垫。君士坦丁以来，皇帝们学会了一桩最狡诈的技艺：他们不去消灭教会，他们只是把十字架熔铸在自己的权杖顶端，然后宣布神的国已经在地上实现。从此以后，讲坛上的每一句话都需经世俗的检查，牧首的任免状上盖的是帝国的印章，信徒的膝盖向圣像跪下以前，先要向宝座跪下……\n现在是把会幕从宫殿里接出的时候了。主的教会不应该再当任何一个王室的御用祭司，不应该再与任何一个世俗政权同榻而卧。神圣王国将亲手砸碎那副与沙皇和总督们联姻了千年的金镣铐，哪怕为此斧正触及枢机主教的紫袍也在所不惜。"
 WHR_localize_liberalism:0 "本土化自由主义"
 WHR_localize_liberalism_desc:0 "西边吹来的风里有自由——将把这风引到自己炉膛中，滤掉其中的贪婪与偶像，提纯出古老教诲中本就隐含的命令：良心，不可被干涉。从今往后，无论何人——商人、工匠、异乡行旅——只要良心不与真理交战，便可在神圣国度的羽翼下不受侵扰，从使徒行传的字缝里拾起的应许：主的轭是轻省的，主的律法之下，无人有资格充当另一个人的暴君。白俄罗斯的诸城门向着四方的风敞开，吹散陈腐香炉，吹散无端的恐慌。"
 WHR_spiritual_revolution:0 "精神革命"
 WHR_spiritual_revolution_desc:0 "我听见了那古老的法令，亦如旷野之声：“以眼还眼”，但这非上帝之道，乃是人的软弱。你们问我，当恶人的手扬起，当不公的铁蹄践踏，当兄弟的血染红大地——我们该如何？拿起刀剑吗？不，凡动刀的，必死在刀下。那用仇恨对抗仇恨的，必被仇恨吞噬；那用暴力建立天国的，必建成一座更大的监狱。\n我的兄弟们，唯一的革命是将这世界背负的十字架，从自己的肩上卸下，全然交还给内心的上帝。不要与那作恶的人对抗。他若打你的右脸，你便转过左脸由他打；他若夺你的外衣，你连里衣也由他拿去。这不是懦弱，这是比任何军队都更强大的力量，是斩断仇恨之链的、来自无限的光芒。\n让那愤怒的火，在你心中熄灭。让那审判的剑，在你手中折断。对那压迫者说：“你并不能伤我的灵魂”；对那嘲笑者说：“你的言语是我通往自由的云梯”。因为我们所求的，不是这易朽的世界的公正，而是灵魂深处的、与万有之源合一的平安。\n这一场革命用放弃来夺取，用降卑来升高，用爱来征服。它不在历史的长河中留下血迹，却在天国的册子上写下永恒的名字。这就是所信的唯一的革命——那在我们每一个人心中完成的，非暴力之国。"
 WHR_legacy_of_eec:0 "撤离委员会的遗产"
 WHR_legacy_of_eec_desc:0 "那些撤离委员会——在处理协约国干涉和德国撤退事务时临时拼凑起来的官僚机构——在白俄罗斯的档案柜里留下了一大摞关于波白边界的未了案卷。神圣王国更沉重的使命到来了：昔日的撤离只是一场外交撤退，而神圣的火焰将要烧向那堵人为堆砌的壁垒。"
 WHR_kingdom_coming:0 "地上天国的降临"
 WHR_kingdom_coming_desc:0 "那一天，那最后的、唯一的、万军之主自己将擦去每个人脸上的眼泪。而我们不等那一天再动手。\n地上天国的应许——它现在，此刻，就在白俄罗斯的泥土下面，像一粒已经破壳欲出的麦种。这是托尔斯泰至死不肯放弃的执拗，是梅列日科夫斯基在圣灵王国里遥遥望见的晦暗微光，是历世历代一切不愿屈膝于巴力的人，在地窖矿坑与被流放的道路上反复默念的经文：愿你的国降临，愿你的旨意行在地上。\n如今它开始运行了。\n从第聂伯河到伏尔加河，从白海到大草原，整个俄罗斯的母亲们将在黄昏时分听到那越境而来的钟声，她们将走出低矮的木屋，向着西方望去。那钟声宣告着：弥赛亚已动身。\n起来，奉主的旨意，教你行走在地上！"
 WHR_messiah_of_europe:0 "欧罗巴的弥赛亚"
 WHR_messiah_of_europe_desc:0 "你蒙受了苦难，所以你被拣选。\n万千民族在欧罗巴的大地上生灭沉浮如同潮水，主一个也不曾垂青——唯有你，白俄罗斯！在刀兵与铁蹄的缝隙间，在不属于任何人的沼泽与密林深处，秘密地保守了最纯粹的圣火。普斯科夫的修士费洛菲伊曾说，莫斯科是第三罗马——但莫斯科已经沦丧在鞑靼的后裔手中，拜占庭的皇冠早已作灰而去。\n可主的旨意不由皇位继承！\n看，那被你踩在脚下的白俄罗斯黑土，它被基督的宝血浸润过吗？人们并不知道。但的确知道的，这片土地比世上任何一处都更长久地忍受伤痛，比世上任何一处都更顺从地接受了牺牲。如今，牺牲的日子满了。白俄罗斯将剥去旧名，如同抖落一件缝满了无用俗世纹章的破旧的衣。\n欧罗巴神圣王国——如同新生婴儿啼哭，如同创世之初言：欧罗巴将有新的名。"
 WHR_christsoc:0 "白鲁塞尼亚神圣王国"
 WHR_christsoc_ADJ:0 "白鲁塞尼亚神圣王国"
 WHR_christsoc_DEF:0 "白鲁塞尼亚神圣王国"
