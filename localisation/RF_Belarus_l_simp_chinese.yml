 whrpol.8.c:0 "中央拉达将权力转交给了西吉斯蒙德。"
 WHR_Ilya_Itskovich_Fundaminsky_hog_syn:0 "伊利亚·伊西多罗维奇·丰达明斯基"
 WHR_Alexei_Dmitrievich_Scaldin_for_syn:0 "阿列克谢·德米特里耶维奇·斯卡尔丁"
 WHR_Valentin_Aleksandrovich_Ternavtsev_eco_syn:0 "瓦伦丁·亚历山德罗维奇·捷尔纳夫采夫"
 WHR_Aleksandr_Arkadievich_Dikhoff_sec_syn:0 "亚历山大·阿尔卡季耶维奇·迪霍夫"
 WHR_oun_in_exile:0 "乌克兰革命的最后一次机会"
 WHR_oun_in_exile_desc:0 "德国人的探照灯把明斯克的夜空照得像白昼一样寒光凛冽，农工联盟的街垒也在火焰中倒塌了。白俄罗斯民族主义者的传单在混战里被风吹得满地都是，没有人在意这乱局里多了谁。当所有声音都在枪声里被压得零碎的时候，乌克兰人来了。塔拉斯·波罗维茨带着他从波列西耶沼泽地和森林中带出来的士兵与死亡，在所有人忙着互相撕咬的间隙里把一个想法变成了事实——白俄罗斯的混乱，不就是乌克兰革命军等了太久的一线之机吗。"
 WHR_the_remaints:0 "收拢残兵"
 WHR_the_remaints_desc:0 "乌克兰的战士们从沃伦的村庄、从科斯托波尔的麦田边走出来，很多人的口袋里还装着波兰集中营发给他们的编号牌。现在他们穿过普里皮亚季河，进入白俄罗斯这片被战火反复犁过的土地。那些被打散的农民武装、那些在森林里藏了几个月的逃兵、那些对什么都绝望了却还不肯回家的人，一个个被收拢进队伍，好似雨水顺着斜坡汇聚到同一条沟渠中来。"
 WHR_reorganize_uvo:0 "重组军事组织"
 WHR_reorganize_uvo_desc:0 "篝火升起来了！围在火边的面孔被火光映得明灭不定。他们扛的步枪来自三个不同的军队，但他们眼里的东西那样相似……波罗维茨从怀里取出一面有点褪色的旗帜摊开在膝上——那不是他的旗，是西蒙·彼得留拉的，是一个早就被赶出基辅却从未在他心里死去的乌克兰人民共和国的遗物。从此以后这面旗就是我们所有人的番号。乌克兰革命军，他们开始照着马赫诺打运动仗的法子训练，在林间空地上来回奔跑，但脑子里没有无政府主义那一套——他们有一个自己的梦想与秩序的蓝图。"
 WHR_coop_with_bel_nationalists:0 "与白俄罗斯民族主义者合作"
 WHR_coop_with_bel_nationalists_desc:0 "分不清谁是白俄罗斯人谁是乌克兰人，他们的祖辈们在同一片沼泽边上犁地，在同一条河里捕鱼，这里的语言像苔藓一样铺满了边界，你一脚踩上去，分不出下面是谁的土壤。白俄罗斯民族主义者们也站在这片苔藓上——他们或许对明斯克的左翼与自由派的群众组织都失望透了，或许只是想在德国人跌倒时也上去踹一脚。我们在黑夜中围在同一围篝火旁取暖，像两个在黑暗的熔狱中素不相识的猎人与勇士，今天我们坐在一起谈话，出于现状他还能给我们共享那些宝贵的资源，甚至包括手中的枪。"
 WHR_fire_of_resistence:0 "重燃抵抗之火"
 WHR_fire_of_resistence_desc:0 "袭击没有规律，像沼泽地上的雾气，一会在南部公路沿线烧掉德军的后勤仓库，一会又在另一个方向的铁路道钉下塞进炸药。战士们熟知这片土地每一条被芦苇遮蔽的水道和每一座被遗忘的伐木小径，他们不等补给、命令和援军，只是还在不断的抵抗，哪怕就要灭亡。"
 WHR_end_the_chaos:0 "终结混乱"
 WHR_end_the_chaos_desc:0 "那也许是拉达曾经争吵不休的那个大厅，也许是某个德国人刚搬出去的总督办公室——望着底下街道上渐渐落定的尘埃。起义者们不再互相射击了，因为已经没剩下几个能打的派系。那些曾经在这座城市里各喊各口号的团体，有的溃散了，有的投降了，有的消失在了夜色里。\n乌克兰革命军成了最后一个还站着的组织，而当最后一批竞争者从棋局上被抹掉之后，我们发现这个他原本只想被跳板的城市，现在已经安静地躺在手里……"
 WHR_kuks_social_tendency:0 "库克的社会倾向"
 WHR_kuks_social_tendency_desc:0 "可是人们听进去了，瓦西里·库克的训诫……因为在这支衣衫褴褛、在波列西耶的雨季泥泞里筋疲力尽的队伍中，有太多人开始先后问出同一个问题：我们打了这么多年仗，我们在枪声中熬白了头发，最后打下来的如果只是一个由新老爷取代旧老爷的乌克兰，那我们和对面战壕里那些替暴君卖命的人究竟有何不同？这是库克从这些沉默的、疲惫的、仍然湿漉漉扛着步枪的面孔上读到的最沉重的问题。他选择用整个余生去回答它。"
 WHR_kurba_holds:0 "布尔巴继续掌权"
 WHR_kurba_holds_desc:0 "塔拉斯·波罗维茨，布尔巴！波列西耶的沼泽地里每一株芦苇都认识这个名字，沃伦的黑钙土深处埋着他的兄弟们的骸骨，那面褪色的旗帜裹着他在白俄罗斯的寒夜里入睡。人们说他只是一个侥幸混进了明斯克政府大楼的散兵游勇，说乌克兰革命军注定像它之前的一切起义一样无声殒灭。可是布尔巴还活着——他活过了波兰人的集中营，活过了德国人的悬赏令，活过了农工联盟的崩溃，活过了那些曾经比他更响亮的名字的接连坠落。硝烟在波列西耶的林间渐渐散开，所有人抬起头来，发现战场上只剩他一个人还拄着旗杆站着。于是那张被冻土和火药磨砺过的面孔露出了所有幸存者的微笑，那笑意肆意兹傲！"
 WHR_legacy_of_national_revoltionaries:0 "民族革命派的遗产"
 WHR_legacy_of_national_revoltionaries_desc:0 "地窖里的油印机早已磨秃了滚筒，那些在小册子只印了一半便被德国巡逻队打断的夜晚，那些把人秘密送过边境时河水在黑暗中的呜咽——这些不仅仅是属于过去的东西。每一个从绞刑架下面走过还活着回来的人都欠那些没能从绞刑架下走出来的人一笔信念。这笔信念不可以用任何一个只会更换主子的政权来偿还，它必须长成比一纸独立宣言更厚重的东西：长成土地不再属于任何人而属于耕种者，长成工厂的汽笛不再召唤工奴而召唤主人，长成一个倒下去的普通人，并不比一个站着的大人物更轻贱。"
 WHR_syndicalist_model:0 "学习工团主义模式"
 WHR_syndicalist_model_desc:0 "革命现在终于轮到了乌克兰，但库克不打算照搬任何外来的经书——他所要的是那种骨头里的精要：让经济不再是某个人手中的提线，而让那些在机器旁、在田垄上、在矿区巷道里工作者与中央政府成为决策的中心。"
 WHR_polissia_sich_and_black_cats:0 "联合游击队"
 WHR_polissia_sich_and_black_cats_desc:0 "有一支部队曾经分裂得支离破碎，如同一块被反复摔打过度的脆铁。沃伦的农民扛着猎枪，波列西耶的伐木工攥着斧头，加利西亚来的老兵们能闭着眼睛拆装步枪却互相听不懂对方那带着山地口音的方言。从今往后，这片土地上所有的游击队员，不管他们来自哪个村子、哪个派系、哪个没来得及被人记住就已经覆灭的组织，都将站进同一支队列里，用同一个番号呼吸，向同一个方向瞄准。"
 WHR_thirst_for_vengence:0 "复仇主义狂热"
 WHR_thirst_for_vengence_desc:0 "伤口若是不被撕开，它终将结痂，然后化脓，在肌肤之下蔓延成无法排解的瘀毒。乌克兰的孩子从会写字起就在学习被伤害的历史——俄国人把我们碾碎过，波兰人把我们关进集中营，德国人把我们编上号码丢进强迫劳动营，而每一次搏斗的残骸上都插着别人家的旗子。现在革命军把这一切沾满触目鲜血的恶臭历史画皮撕开，并不留任何一块遮羞布！\n一个个黑板上写下魂灵的往事：那些死在苏联集体化里的人的名字；波兰宪兵从白俄罗斯地牢里拖曳出的冻僵身影；在德国工厂里像油脂一样被熬干的乌克兰劳工……每一个名字，就是往少年的眼睛深处注入来到这个血缘共同体中最纯正的恨意！\n仇恨呀……溃烂吧……淬炼啊！"
 WHR_socialism_for_people:0 "社会主义为人民"
 WHR_socialism_for_people_desc:0 "在这场漫长而耗竭一切的战争中，一直到最后面最疲倦的时刻，有一个词始终没有失去光泽。那些村庄里把最后一块黑面包掰开分给游击队员的沉默女人，那些一辈子没走出过自己出生地、却在篝火的映照里把儿子塞进革命军队伍的衰老父亲。人民，民族社会主义，如果它不是为这些人而存在的……可这世上从未有过任何抽象的东西能治愈一个饥饿的胃或者擦去一个母亲的眼泪。这片土地上的人民已经付出了过于昂贵的代价，他们应得的不是浮在天上德空洞口号或大炮轰鸣下的感恩戴德，只靠我们自己。"
 WHR_nationalism_for_oppressors:0 "民族主义对暴君"
 WHR_nationalism_for_oppressors_desc:0 "暴君并非少数人，所有那些曾经把手按在乌克兰脖颈上的人……沙皇的官吏，契卡的委员，波兰的省长，德国的总督。他们一副又一副面孔熔化符合变现流动漂浮，可是可是可是手的重量从来没有在我的脖颈上减轻过！\n可是我挣脱了，我重生了。\n现在，一种比他们的铁腕更坚硬的东西在沼泽地和密林里被锻造出来：民族，被一代代人去而复返地爱过却始终没能握住的神圣火焰。塔拉斯攥着这团火焰，把它从一个名字变成我们国家与军队的脊梁。\n每一个挡在乌克兰面前的必须人明白：这片土地受过的欺压，会以神圣民族的名义加倍索回。"
 WHR_get_prepared:0 "枕戈待旦……"
 WHR_get_prepared_desc:0 "乌克兰革命军在白俄罗斯的森林和废弃厂房里训练，擦枪，把行装整理了一遍又一遍……他们知道终极的战场在南边第聂伯河的对岸，在他们大多数人出生的那片黑土地上。白俄罗斯人有些选择留在这支队伍里——毕竟他们声称白俄罗斯与乌克兰亲如一家，也基本这样做了。\n等待让人发疯，等待让人磨刀。没人知道口令会在哪个黎明下达，每个人都在黑暗中攥紧着枪托……"
 WHR_and_strike:0 "……伺机出击！"
 WHR_and_strike_desc:0 "……南方的地平线在某一天的晨光里忽然显得比平时更近了一些。也许是莫斯科的事，也许是柏林……也许根本没有什么特别的信号，只是所有人都感到不能再等了。领袖翻身上马——也可能是一辆破旧的卡车——回头看了看身后的队伍。那里面有沃伦的农民，有波列西耶的伐木工，有从波兰的集中营里活着走出来的老兵，还有几个不知道怎么回事就跟上来了的白俄罗斯游击队员。旗帜在晨风中费力地展开，褪色的布面上绣着一个已经灭亡了快二十年的国家的徽章。这一路不会轻松，基辅的厚门不会向他们自己敞开，第聂伯河的河水也不会为他们而奇迹分开，但他们已经在地图上死去太久，不再愿意退后！"
 WHR_great_ukrainian_federation:0 "大乌克兰革命联邦"
 WHR_great_ukrainian_federation_desc:0 "是啊，我们回来了，我们胜利了……我们胜利了！\n万岁！乌克兰永不灭亡！"
 whrpol.50.f:0 "在混乱中，波利西亚起义军夺取了权力！"
 