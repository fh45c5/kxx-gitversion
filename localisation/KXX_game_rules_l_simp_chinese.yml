 RULE_OPTION_CAN_POLITICAL_PATH_SOCIALISM:0 "£KXX_game_rule_flag_NFL_CANADA 第二次进军渥太华"
 RULE_OPTION_CAN_POLITICAL_PATH_SOCIALISM_DESC:0 "C-7法案未能在加拿大议会通过，现政府因此垮台。国王没有要求重新选举，而是行使了他的王室特权，把权力掌握在自己手中。后来，他决定维持§P温莎家族§!对加拿大的直接统治，并最终解散了加拿大政府，宣布成立联合王国加拿大政府。然而，这一系列操作导致了左派与大众的不满，所有的左派都组织起了再次向渥太华进军。随着大量由加拿大本地人组成的军队倒戈，最终英国王室政府垮台，§R社会主义者§!占领渥太华，宣布成立加拿大社会主义邦联。"

