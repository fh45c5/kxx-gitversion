 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN:0 "£KR_game_rule_flag_FRA_Lenin £GFX_KR_game_rule_flag_FRA_Jacobin 雅各宾派"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN_DESC:0 "雅各宾派在1936年选举中取得多数席位，之后莫里斯·多列士当选劳工总议会主席。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN_REDS:0 "£KR_game_rule_flag_FRA_Lenin 雅各宾派——莫里斯·多列士"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN_REDS_DESC:0 "红色雅各宾派在1936年选举中取得多数席位，之后莫里斯·多列士当选劳工总议会主席。\n虽然法兰西共产党一直是按照列宁提出的民主集中制原则运作的，但近期劳工总议会选举中工人力量的得胜让党内的矛盾到达了不可调和的地步。雅克·多里奥及其“民族雅各宾派”称莫里斯·多列士总书记及其“红色雅各宾派”已“无力应对法国今日所面临的重大问题”，公然挑战起了后者的权威。最终，莫里斯·多列士的“红色雅各宾派”在党内的斗争中获胜。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN_NATS:0 "£GFX_KR_game_rule_flag_FRA_Jacobin 雅各宾派——雅克·多里奥"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_JACOBIN_NATS_DESC:0 "民族雅各宾派在1936年选举中取得多数席位，之后莫里斯·多列士当选劳工总议会主席。\n虽然法兰西共产党一直是按照列宁提出的民主集中制原则运作的，但近期劳工总议会选举中工人力量的得胜让党内的矛盾到达了不可调和的地步。雅克·多里奥及其“民族雅各宾派”称莫里斯·多列士总书记及其“红色雅各宾派”已“无力应对法国今日所面临的重大问题”，公然挑战起了后者的权威。最终，雅克·多里奥的“民族雅各宾派”在党内的斗争中获胜。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN:0 "£KR_game_rule_flag_FRA_Sorelian 索雷尔派"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_DESC:0 "索雷尔派在1936年选举中取得多数席位，之后乔治·瓦卢瓦当选劳工总议会主席。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_ALIVE:0 "£KR_game_rule_flag_FRA_Sorelian 索雷尔派——乔治·瓦卢瓦"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_ALIVE_DESC:0 "索雷尔派在1936年选举中取得多数席位，之后乔治·瓦卢瓦当选劳工总议会主席。\n当瓦卢瓦主席在内阁成员马歇尔戴亚和情报居总局长皮埃尔赖伐尔在凯旋门下向公众发表激烈的演讲时，黑卫军刺客从人群中出现并试图刺杀瓦卢瓦主席。刺客向讲台投掷炸弹并且尝试枪击台上人员，在现场造成了极大的混乱。最终，浑身是血的瓦卢瓦在安保人员的搀扶下完成了他的演讲，在随后的全国讲话中，瓦卢瓦主席向全体国民保证，他将确保法国社会的稳定，坚持走工团主义的道路，绝不向那些为了政治目的而不择手段残害人民的暴徒屈服。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_KING:0 "£KR_game_rule_flag_FRA_Sorelian 索雷尔派——乔治一世"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_KING_DESC:0 "索雷尔派在1936年选举中取得多数席位，之后乔治·瓦卢瓦当选劳工总议会主席。\n当瓦卢瓦主席在内阁成员马歇尔戴亚和情报居总局长皮埃尔赖伐尔在凯旋门下向公众发表激烈的演讲时，黑卫军刺客从人群中出现并试图刺杀瓦卢瓦主席。刺客向讲台投掷炸弹并且尝试枪击台上人员，在现场造成了极大的混乱。尽管主席已经没有生命危险，但枪伤导致的感染仍然让他发了高烧，在痛苦的折磨中，他顿悟了自己姓氏的真相，最终建立卡佩民族工人帝国，将自己加冕为乔治一世。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_BERTHIER:0 "£KR_game_rule_flag_FRA_Sorelian 索雷尔派——爱德华·贝尔特"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_BERTHIER_DESC:0 "索雷尔派在1936年选举中取得多数席位，之后乔治·瓦卢瓦当选劳工总议会主席。\n当瓦卢瓦主席在内阁成员马歇尔戴亚和情报居总局长皮埃尔赖伐尔在凯旋门下向公众发表激烈的演讲时，黑卫军刺客从人群中出现并试图刺杀瓦卢瓦主席。刺客向讲台投掷炸弹并且尝试枪击台上人员，在现场造成了极大的混乱。尽管主席已经没有生命危险，但枪伤导致的感染仍然让他发了高烧，在痛苦的折磨中，他顿悟了自己姓氏的真相，最终他放弃了这个想法，选择了爱德华·贝尔特作为继任者。"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_DIEU:0 "£KR_game_rule_flag_FRA_Sorelian 索雷尔派——至暗之日"
 KXX_RULE_OPTION_FRA_START_ELECTION_TOTALIST_SORELIAN_DIEU_DESC:0 "索雷尔派在1936年选举中取得多数席位，之后乔治·瓦卢瓦当选劳工总议会主席。\n当瓦卢瓦主席在内阁成员马歇尔戴亚和情报居总局长皮埃尔赖伐尔在凯旋门下向公众发表激烈的演讲时，黑卫军刺客从人群中出现并试图刺杀瓦卢瓦主席。刺客向讲台投掷炸弹并且尝试枪击台上人员，在现场造成了极大的混乱。乔治·瓦卢瓦当场毙命，一场紧急大会将被举行，决定由谁将接替乔治·瓦卢瓦的事业。"
 KXX_RULE_OPTION_FRA_START_ELECTION_NO_MAJORITY:0 "£KR_game_rule_flag_FRA 僵局"
 KXX_RULE_OPTION_FRA_START_ELECTION_NO_MAJORITY_DESC:0 "1936年的大选没有任何一个派系能够取得绝对多数，劳工总议会主席路易·尼埃尔决定他和议会选举一名新主席组建联合内阁。"
