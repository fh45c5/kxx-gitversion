 RULE_OPTION_USA_1936_ELECTION_RANDOM_DESC:0 "尽管深受政治动荡与无效经济复兴计划的妨害，许多美国公民依然相信他们的国家终将从1925年华尔街股市崩盘中恢复过来。“黑色星期一”的降临无疑为这种希望奏响了丧钟，本已疲弱的经济更是坠入无底的深渊。虽然共和党与民主党候选人都承诺在当选后采取积极措施振兴经济，公众对传统两党的信任犹如雪崩般疾速下滑。与此同时，比尔·海伍德与休伊·朗都将舆论矛头对准腐败的金融机构与行政部门，双方不约而同地谴责正是这群业界精英的贪婪引发了金融危机。此外，§Y1936年是选举年，选举也总得有个结果。"
