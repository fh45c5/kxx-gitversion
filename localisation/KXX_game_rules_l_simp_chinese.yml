 RULE_OPTION_CAN_SOCIALIST_PATH_RANDOM_DESC:0 "摆脱了疯王的暴政之后，加拿大终于可以在一个民治、民享的政府之下繁荣昌盛。正如1925年一般，国王的臣民们挣脱了枷锁，将反动势力驱逐到了异国他乡。现在，加拿大的众多社会主义团体已经不再被限制在地下活动，于它们组织了一次大会来选出新任政府，在大会闭幕时，任何集团都有拔得头筹的可能。"
