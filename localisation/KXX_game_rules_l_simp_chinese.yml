 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BLACK_GUARD_COUNTERREVOLUTION_NOGOV_DESC: "内斯托尔·马赫诺已经召集了他的黑卫军，并组织了一场反对混乱的索雷尔政府的反革命政变。如今，无政府主义笼罩着法国。最终，黑卫军选择维持纯粹无政府主义路线。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BLACK_GUARD_COUNTERREVOLUTION_MAKHNO: "£GFX_KR_game_rule_flag_FRA_Makhno 马赫诺的无政府共产主义"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BLACK_GUARD_COUNTERREVOLUTION_MAKHNO_DESC: "内斯托尔·马赫诺已经召集了他的黑卫军，并组织了一场反对混乱的索雷尔政府的反革命政变。如今，无政府主义笼罩着法国。最终，黑卫军选择由马赫诺统治法国，实施无政府共产主义统治。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_TECH:0 "£GFX_KR_game_rule_flag_FRA_Makhno 共治主义阴谋"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_TECH_DESC:0 "内斯托尔·马赫诺已经召集了他的黑卫军，并组织了一场反对混乱的索雷尔政府的反革命政变。如今，无政府主义笼罩着法国。然而，马赫诺最终被刺杀，共治帝国运动趁机夺权，建立技官主义统治。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_DEAT: "£GFX_KR_game_rule_flag_FRA_Deat 戴亚恢复秩序"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_DEAT_DESC: "在索雷尔派大会举行之时，马塞尔·戴亚和他的新社会主义派推翻了走火入魔的索雷尔派。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BATAILLE: "£GFX_KR_game_rule_flag_FRA_Bataille 主宰者之叛"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BATAILLE_DESC: "在索雷尔派大会举行之时，马塞尔·戴亚和他的新社会主义派推翻了走火入魔的索雷尔派。之后，戴亚拒绝进行选举，最终被乔治·巴泰耶推翻。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_CIVIL_WAR: "£GFX_KR_game_rule_flag_FRA_Civil_War 万劫不复"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_CIVIL_WAR_DESC: "奥古斯特·德·里贝斯在求助多方无果后未能制止索雷尔派叛乱，最终被索雷尔派激进分子刺杀，马塞尔·布卡德领导索雷尔派上台。然而，法国多地爆发了叛乱，布列塔尼、诺曼底、洛林、奥克西塔尼亚相继独立，最终神圣法兰西解放运动发起叛乱，法国彻底陷入内战。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C僵局——奥古斯特·德·里贝斯§!"


