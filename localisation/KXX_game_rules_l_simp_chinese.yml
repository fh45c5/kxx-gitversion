 RULE_OPTION_GRU_CONGRESS_SMEPD_PIECK_DESC: "德意志统一工团马克思党将会获得第一次大会的胜利，而威廉·皮克将会作为马克思派的领导者取得党的领导权。"
 RULE_OPTION_GRU_CONGRESS_SPD-R: "£GFX_KR_game_rule_flag_GRU 德意志社民党-激进派"
 RULE_OPTION_GRU_CONGRESS_SPD-R_DESC: "德意志社会民主党获得第一次大会的胜利，他们承诺未来会开放自由选举。"
 RULE_OPTION_GRU_CONGRESS_PDS: "£GFX_KR_game_rule_flag_GRU_totalist 德意志民主社会党"
 RULE_OPTION_GRU_CONGRESS_PDS_DESC: "德意志民主社会党获得德意志联盟第一次大会的胜利，他们承诺未来将会进行自由选举。在卡尔·李卜克内西退休后的选举中，由SPD-R的前成员组成的民主社会党获得了胜利，他们决定维持革命民主主义。"
 RULE_OPTION_GRU_CONGRESS_SPD: "£GFX_KR_game_rule_flag_GRU 德意志社会民主党"
 RULE_OPTION_GRU_CONGRESS_SPD_DESC: "德意志社会民主党获得德意志联盟第一次大会的胜利，他们承诺未来会开放自由选举。在卡尔·李卜克内西退休后的自由选举中，党内的温和派领导党再度胜选，他们将为德意志带来期待已久的社会民主主义。"
 RULE_OPTION_GRU_CONGRESS_FPD: "£GFX_KR_game_rule_flag_GRU 自由民主党"
 RULE_OPTION_GRU_CONGRESS_FPD_DESC: "德意志社会民主党获得德意志联盟第一次大会的胜利，他们承诺未来会开放自由选举。在卡尔·李卜克内西退休后的自由选举中，自由民主党获得胜利，他们将为年轻的民主德意志人民带来他们的自由理念。"
