 RULE_OPTION_GEA_FUTURE_MUCKE_2:0 "£KR_game_rule_flag_GEA 穆克进行改革"
 RULE_OPTION_GEA_FUTURE_MUCKE_2_DESC:0 "社会保守主义的赫尔穆特·冯·穆克正式接任了德属东亚的总督职位。之后穆克选择对东亚殖民地进行改革，不会同意保大对越南的自治请求。"
