 DEN_PATH: "£KR_game_rule_flag_DEN  守望斯卡格拉克"
 RULE_OPTION_DEN_PATH_RANDOM: "默认"
 RULE_OPTION_DEN_PATH_RANDOM_DESC: "社民党政府领导丹麦已经有一段时间了，但福利国家的梦想却被上议院阻挠。\n当民主进程迎难而上，宪法危机却迫在眉睫，谁知道未来怎样？"
 RULE_OPTION_DEN_PATH_DEM: "£KR_game_rule_flag_DEN  民主"
 RULE_OPTION_DEN_PATH_DEM_DESC: "政府$RULE_OPTION_DEN_PATH_DEM_MID_DESC$民选政府继续掌权，以克里斯蒂安十世为国王的君主立宪制得以延续。$RULE_OPTION_DEN_PATH_DEM_END_DESC$"
 RULE_OPTION_DEN_PATH_DEM_MID_DESC: "在宪法危机中倒向国王一边。"
 RULE_OPTION_DEN_PATH_DEM_END_DESC: "宪法危机结束后，丹麦会向北欧邻国们靠拢，或者加入帝国公约。"
 RULE_OPTION_DEN_PATH_SOCDEM: "£KR_game_rule_flag_DEN  民主：社民党"
 RULE_OPTION_DEN_PATH_SOCDEM_DESC: "托瓦尔·斯陶宁的§S社会民主党§!成功与反对派进行了有关经济复苏的谈判，随后$RULE_OPTION_DEN_PATH_DEM_MID_DESC$\n$RULE_OPTION_DEN_PATH_DEM_END_DESC$"
 RULE_OPTION_DEN_PATH_SOCLIB: "£KR_game_rule_flag_DEN  民主：激进左翼党"
 RULE_OPTION_DEN_PATH_SOCLIB_DESC: "社民党政府$RULE_OPTION_DEN_PATH_DEM_MID_DESC$\n随后政府倒台，§l激进左翼党§!赢得提前选举，彼得·蒙克出任首相。\n$RULE_OPTION_DEN_PATH_DEM_END_DESC$"
 RULE_OPTION_DEN_PATH_MARLIB: "£KR_game_rule_flag_DEN  民主：左翼党"
 RULE_OPTION_DEN_PATH_MARLIB_DESC: "$RULE_OPTION_DEN_PATH_MARLIB_START_DESC$。§m左翼党§!建立了新政府，托马斯·马森-米格达尔出任首相，他会$RULE_OPTION_DEN_PATH_DEM_MID_DESC$\n$RULE_OPTION_DEN_PATH_DEM_END_DESC$"
 RULE_OPTION_DEN_PATH_MARLIB_START_DESC: "有关经济复苏的谈判失败之后，社民党政府最终倒台"
 RULE_OPTION_DEN_PATH_PURSCHEL_AUTDEM: "£KR_game_rule_flag_DEN  国王内阁：保守人民党(独裁派)"
 RULE_OPTION_DEN_PATH_PURSCHEL_AUTDEM_DESC: "社民党政府在宪法危机中倒台。\n随后，国王任命§a保守人民党独裁派§!的维克托·皮舍尔为首相，丹麦迅速加入了帝国公约。"
 RULE_OPTION_DEN_PATH_MARLIB_FAIL_DESC: "继任的左翼党政府又在宪法危机中被国王解职。\n随后，国王任命"
 RULE_OPTION_DEN_PATH_SOCCON: "£KR_game_rule_flag_DEN  国王内阁：保守人民党(宪政派)"
 RULE_OPTION_DEN_PATH_SOCCON_DESC: "$RULE_OPTION_DEN_PATH_MARLIB_START_DESC$，$RULE_OPTION_DEN_PATH_MARLIB_FAIL_DESC$§c保守人民党宪政派§!的约翰·克里斯特马斯·默勒为首相，丹麦迅速加入了帝国公约。"
 RULE_OPTION_DEN_PATH_WESTERGAARD_AUTDEM: "£KR_game_rule_flag_DEN  国王内阁：保守人民党(韦斯特高派)"
 RULE_OPTION_DEN_PATH_WESTERGAARD_AUTDEM_DESC: "$RULE_OPTION_DEN_PATH_MARLIB_START_DESC$，$RULE_OPTION_DEN_PATH_MARLIB_FAIL_DESC$默勒为首相，丹麦迅速加入了帝国公约。\n然而，§a保守人民党韦斯特高派§!从党内夺取政府权力的阴谋成功了，亚克·韦斯特高成为了新的首相。"
 RULE_OPTION_DEN_PATH_FREDERIK_SOCDEM: "£KR_game_rule_flag_DEN  弗雷德里克九世：社民党"
