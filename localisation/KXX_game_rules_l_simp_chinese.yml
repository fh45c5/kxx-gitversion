 HNN_PATH_RD:0 "£KR_game_rule_flag_HNN 湖南的未来"
 RULE_OPTION_HNN_FUTURE_RANDOM_DESC: "目睹八省联盟的覆灭后，吴光新的湖南将陷入危机。各方要人、土匪和革命者都想利用混乱来谋取私利。接下来发生的事情将决定这个省份的命运。"
 RULE_OPTION_HNN_AUT_ZHAO_HENGTI:0 "£KR_game_rule_flag_HNN 赵恒惕稳坐船头"
 RULE_OPTION_HNN_AUT_ZHAO_HENGTI_DESC:0 "在镇压了当地的土匪之后，赵恒惕开始谴责民主势力，称其与土匪一样危险。如今，他以铁腕手段统治湖南，一路镇压异己。"
 RULE_OPTION_HNN_AUT_TANG_XIANGMING:0 "£KR_game_rule_flag_HNN 屠夫归来，继续嗜血"
 RULE_OPTION_HNN_AUT_TANG_XIANGMING_DESC:0 "在平定湖南的土匪后，汤芗铭转而谴责民主势力，认为他们与土匪同样危险。如今，汤芗铭以铁腕统治湖南，镇压一切反对其统治的势力。"
 RULE_OPTION_HNN_NATIONAL_SOCIALIST:0 "£KR_game_rule_flag_HNN 汤芗铭走上第三道路"
 RULE_OPTION_HNN_NATIONAL_SOCIALIST_DESC:0 "为了恢复人民对汤芗铭省长和共和主义的信心，他与中国民主社会党结盟，承诺进行更大规模的社会改革，这将解放土地和人民。"
 RULE_OPTION_HNN_KMT_RIGHT_HE_JIAN:0 "£KR_game_rule_flag_YUN_KMTR 何健的崛起"
 RULE_OPTION_HNN_KMT_RIGHT_HE_JIAN_DESC:0 "在湖南对国民党部队进行多次镇压行动后，直系军阀已被击溃，国民党右派在何健的带领下掌控了政权。"
 RULE_OPTION_HNN_KMT_LEFT_HE_LONG:0 "£KR_game_rule_flag_YUN_KMTL 贺龙的狂飙"
 RULE_OPTION_HNN_KMT_LEFT_HE_LONG_DESC:0 "在湖南对国民党部队进行多次镇压行动后，直系军阀已被击溃，在贺龙的带领下，国民党左翼派系已掌权。"
 RULE_OPTION_HNN_KMT_LEFT_SYNDICALIST:0 "£KR_game_rule_flag_HNN_syndicalist 李立三走上新路线"
 RULE_OPTION_HNN_KMT_LEFT_SYNDICALIST_DESC:0 "在多次旨在消灭湖南国民党军队的战役后，直系军阀被统一战线击败。由此，在李立三领导下的湖南工团党在湖南省统一战线中取得了领导地位，使工团主义得以进入湖南。"
 RULE_OPTION_HNN_SPIRIT_SOLIDER:0 "£KR_game_rule_flag_HNN_Spirit_Hunan 神兵"
 RULE_OPTION_HNN_SPIRIT_SOLIDER_DESC:0 "在湖南反抗直系暴政后，王锡九手下的神兵已成功平定湖南。现在他们将踏上拯救中国、在玉皇大帝的统治下恢复繁荣中国的征程。"
 RULE_OPTION_HNN_TAOIST_CULT:0 "£KR_game_rule_flag_HNN_Shi_Dingwu_Hunan 大中华佛国"
 RULE_OPTION_HNN_TAOIST_CULT_DESC:0 "从神兵的失败和渎神中，石顶武崛起并推翻了占据长沙王位的魔鬼。现在石顶武承诺将在佛教和道教的注视下，通过宗教纯洁的未来确保中国安全。"
 RULE_OPTION_HNN_CHEN_QUZHEN:0 "£KR_game_rule_flag_HNN_QUZHEN_MIAO 陈渠珍的犯罪帝国"
 RULE_OPTION_HNN_CHEN_QUZHEN_DESC:0 "在混乱的战火中，陈渠珍接管了湖南省，并利用沈从文的苗族民族主义，将哥老会置于苗族解放运动的核心。"

 HNN_ELECTION_PATH:0 "£KR_game_rule_flag_HNN 湖南省选举"
 RULE_OPTION_HNN_ELECTIONS_RANDOM_DESC: "赵恒惕成功接替吴光新，现在将举行选举，希望能将本省巩固在联省制之下。然而，其他党派已察觉到这一弱点并采取行动，任何事都可能发生。\n§R需要：§! §C$RULE_OPTION_HNN_FED$§! 在 §Y$HNN_PATH_RD$§!"
 RULE_OPTION_HNN_BUD:0 "£KR_game_rule_flag_HNN 唐生智赢得选举"
 RULE_OPTION_HNN_BUD_DESC:0 "在赵恒惕恢复湖南宪法后，唐生智的佛教组织赢得了最近的选举，现在正寻求建立一个佛教社会主义的中国。"
 RULE_OPTION_HNN_FED:0 "£KR_game_rule_flag_HNN 赵恒惕赢得选举"
 RULE_OPTION_HNN_FED_DESC:0 "在赵恒惕恢复湖南宪法后，赵恒惕赢得了选举，并承诺将实施一部受其盟友陈炯明启发的联省主义宪法。"
 RULE_OPTION_HNN_KMT_RIGHT_CHENG_QIAN:0 "£KR_game_rule_flag_YUN_KMTR 国民党右派赢得选举"
 RULE_OPTION_HNN_KMT_RIGHT_CHENG_QIAN_DESC:0 "在赵恒惕恢复湖南宪法后，国民党已控制了湖南的票箱，而程潜则被党部内的右派说服，选择了一条与左派对抗的独立道路。"
 RULE_OPTION_HNN_KMT_LEFT_CHENG_QIAN:0 "£KR_game_rule_flag_YUN_KMTL 国民党左派赢得选举"
 RULE_OPTION_HNN_KMT_LEFT_CHENG_QIAN_DESC:0 "在赵恒惕恢复湖南宪法后，国民党在湖南控制了票箱，而程潜则决定与该党的左派合作。"
 RULE_OPTION_HNN_MAO_ZEDONG:0 "£KR_game_rule_flag_HNN_MAO_HUNAN 毛泽东赢得选举"
 RULE_OPTION_HNN_MAO_ZEDONG_DESC:0 "在赵恒惕恢复湖南宪法后，新民学会已改组为政党，由毛泽东领导。毛泽东主张走工农解放的道路，不依赖国民党与工团党修正主义者。"
 RULE_OPTION_HNN_KMT_LEFT_MAO_ZEDONG:0 "£KR_game_rule_flag_YUN_KMTL 毛泽东带领国民党左派赢得选举"
 RULE_OPTION_HNN_KMT_LEFT_MAO_ZEDONG_DESC:0 "在赵恒惕恢复湖南宪法后，新民学会已改组为政党，由毛泽东领导。毛泽东以工农解放为竞选承诺。在组织群众基础的问题上，毛泽东再次向国民党伸出橄榄枝，承诺改组该党并清除中国工团主义党的影响。"
