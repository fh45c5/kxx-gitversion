 KXX_FRA_DAY_OF_INFAMY: "£KR_game_rule_flag_FRA £KR_game_rule_flag_FRA_Lenin £GFX_KR_game_rule_flag_FRA_Sorelian 国耻日"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_RANDOM: "默认"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_RANDOM_DESC: "只有天知道。"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION: "£GFX_KR_game_rule_flag_FRA_Gamelin 甘末林拨乱反正"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION_DESC: "雅各宾改革正在引起法国社会的广泛不安。工人国际法国支部的重要政治人物莱昂·布鲁姆公开呼吁各派势力联合起来抵制雅各宾派政府，制止他们继续背叛法国革命。内战将领莫里斯·甘末林迅速率领其支持者发动兵变加入人民阵线的行列，他们设法攻占首都并将雅各宾派党徒逐出城市，曾被短暂废除的工团主义机构重新活跃起来，甘末林本人获选成为劳工总议会主席，布鲁姆则被委任主管救国委员会的运营。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA 1936年公社选举§!中选择§C雅各宾派§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION_PF: "£GFX_KR_game_rule_flag_FRA_Gamelin 甘末林维持人民阵线"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION_PF_DESC: "雅各宾改革正在引起法国社会的广泛不安。工人国际法国支部的重要政治人物莱昂·布鲁姆公开呼吁各派势力联合起来抵制雅各宾派政府，制止他们继续背叛法国革命。内战将领莫里斯·甘末林迅速率领其支持者发动兵变加入人民阵线的行列，他们设法攻占首都并将雅各宾派党徒逐出城市，曾被短暂废除的工团主义机构重新活跃起来，甘末林本人获选成为劳工总议会主席，布鲁姆则被委任主管救国委员会的运营。最终，甘末林选择维持人民阵线，并举行新的选举。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA 1936年公社选举§!中选择§C雅各宾派§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION_MG: "£GFX_KR_game_rule_flag_FRA_Gamelin 甘末林组建军政府"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_GAMELIN_RESTORATION_MG_DESC: "雅各宾改革正在引起法国社会的广泛不安。工人国际法国支部的重要政治人物莱昂·布鲁姆公开呼吁各派势力联合起来抵制雅各宾派政府，制止他们继续背叛法国革命。内战将领莫里斯·甘末林迅速率领其支持者发动兵变加入人民阵线的行列，他们设法攻占首都并将雅各宾派党徒逐出城市，曾被短暂废除的工团主义机构重新活跃起来，甘末林本人获选成为劳工总议会主席，布鲁姆则被委任主管救国委员会的运营。最终，甘末林选择组建军政府，实行军事统治。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA 1936年公社选举§!中选择§C雅各宾派§!"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BLACK_GUARD_COUNTERREVOLUTION: "£GFX_KR_game_rule_flag_FRA_Makhno 黑卫军反革命"
 KXX_RULE_OPTION_FRA_DAY_OF_INFAMY_BLACK_GUARD_COUNTERREVOLUTION_DESC: "内斯托尔·马赫诺已经召集了他的黑卫军，并组织了一场反对混乱的索雷尔政府的反革命政变。如今，无政府主义笼罩着法国。\n§R需要：§!\n在§Y£KR_game_rule_flag_FRA_syndicalist 1936年公社选举§!中选择§C索雷尔派——至暗之日§!"
