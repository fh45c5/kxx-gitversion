 RULE_OPTION_GEA_FUTURE_MUCKE_3_DESC:0 "社会保守主义的赫尔穆特·冯·穆克正式接任了德属东亚的总督职位。之后穆克选择对东亚殖民地进行改革，并同意保大对越南的自治请求。"
 RULE_OPTION_GEA_FUTURE_JOSIAS_1:0 "£KR_game_rule_flag_GEA 亲王见好就收"
 RULE_OPTION_GEA_FUTURE_JOSIAS_1_DESC:0 "威权民主主义的约西亚斯·楚·瓦尔代克-皮尔蒙特亲王被指派到德属东亚成为总督。随着约西亚斯的野心愈发增大，最终决定在柏林察觉之前收手。"
 RULE_OPTION_GEA_FUTURE_JOSIAS_2:0 "£KR_game_rule_flag_GEA 亲王掌控一切"
 RULE_OPTION_GEA_FUTURE_JOSIAS_2_DESC:0 "威权民主主义的约西亚斯·楚·瓦尔代克-皮尔蒙特亲王被指派到德属东亚成为总督。随着约西亚斯的野心愈发增大，最终决定将东亚殖民地转变为自己的提线木偶，建立家长制独裁统治。"
 RULE_OPTION_GEA_FUTURE_HEYE:0 "£KR_game_rule_flag_GEA 海耶的铁腕统治"
