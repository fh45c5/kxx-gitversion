 RULE_OPTION_GEA_FUTURE_RANDOM_NEW_DESC:0 "赫尔穆特·冯·穆克在阿尔贝特·巴林死后暂时接管了德属东亚，在随后的柏林的任命中，谁将统治德意志帝国在东亚的殖民地？"
