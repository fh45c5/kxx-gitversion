 RULE_OPTION_GRU_CONGRESS_DEFAULT: "£GFX_KR_game_rule_flag_GRU_totalist 与第三国际结盟"
 RULE_OPTION_GRU_CONGRESS_DEFAULT_DESC: "德意志统一工团马克思党或德意志社会民主党激进派和他们支持第三国际的继任党派将于德意志联盟第一次大会中取胜，他们会和第三国际协同一致，并成为世界革命的基石。\n§C该规则会确保德国一定会加入第三国际，除非其他规则设置德国加入别的联盟组织§!"
